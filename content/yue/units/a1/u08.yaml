id: a1.u08
title: 我屋企人
lessons:
  - id: a1.u08.l1
    title: 我有一個家姐
    teach: [g.kinship-terms]
    vocab: [w.uk1-kei2-jan4, w.gaa1-ting4, w.baa1-baa1, w.maa4-maa1, w.aa3-baa1, w.aa3-maa1, w.go1-go1, w.gaa1-ze1, w.sai3-lou2, w.mui6-mui6, w.sai3-mui2, w.hing1-dai6-zi2-mui6, w.aa3-go1, w.jat1-gaa1-jan4, w.daai6-go3, w.sai3-go3, w.paau2-maa5]
    tip: "Cantonese always says whether a brother or sister is older or younger: 哥哥, 家姐, 細佬, 妹妹."
    sentences:
      - { es: "我屋企有五個人。", en: "There are five people in my family.", altEs: ["我屋企人有五個。", "我屋企有五個人呀。"], altEn: ["My family has five people."], grammar: [g.kinship-terms, g.jau-have], vocab: [w.uk1-kei2-jan4] }
      - { es: "我有一個家姐同一個細佬。", en: "I have an older sister and a younger brother.", altEs: ["我有個家姐同個細佬。"], grammar: [g.kinship-terms, g.jau-have], vocab: [w.gaa1-ze1, w.sai3-lou2], transform: { instruction: "Say you have two older brothers", answer: "我有兩個哥哥。", alt: ["我有兩個阿哥。"], en: "I have two older brothers." }, error: { wrong: "我有一隻家姐同一個細佬。", explain: "People take the measure word 個 (or polite 位), never 隻, which is for animals.", grammar: g.common-classifiers } }
      - { es: "你有冇兄弟姊妹呀？", en: "Do you have any brothers or sisters?", altEs: ["你有冇兄弟姊妹？", "你有兄弟姊妹嗎？"], altEn: ["Do you have any siblings?"], grammar: [g.kinship-terms, g.jau-have], vocab: [w.hing1-dai6-zi2-mui6] }
      - { es: "我冇兄弟姊妹。", en: "I don't have any brothers or sisters.", altEs: ["我冇兄弟姊妹呀。"], altEn: ["I'm an only child."], grammar: [g.kinship-terms, g.mou-negation], vocab: [w.hing1-dai6-zi2-mui6] }
      - { es: "我哥哥住喺跑馬地。", en: "My older brother lives in Happy Valley.", altEs: ["我阿哥住喺跑馬地。"], grammar: [g.kinship-terms, g.hai2-location], vocab: [w.go1-go1, w.aa3-go1], transform: { instruction: "Say it's your younger sister", answer: "我妹妹住喺跑馬地。", alt: ["我細妹住喺跑馬地。"], en: "My younger sister lives in Happy Valley." } }
      - { es: "阿媽，我返嚟喇！", en: "Mum, I'm home!", altEs: ["媽媽，我返嚟喇！", "阿媽，我返嚟啦！"], grammar: [g.kinship-terms], vocab: [w.aa3-maa1] }
      - { es: "阿爸，食飯喇！", en: "Dad, dinner's ready!", altEs: ["爸爸，食飯喇！", "阿爸，食飯啦！"], grammar: [g.kinship-terms], vocab: [w.aa3-baa1] }
      - { es: "我爸爸係醫生，我媽媽係老師。", en: "My dad is a doctor and my mum is a teacher.", altEs: ["我阿爸係醫生，我阿媽係老師。"], grammar: [g.kinship-terms, g.hai6-identity], vocab: [w.baa1-baa1, w.maa4-maa1] }
      - { es: "我細妹今年六歲。", en: "My little sister is six this year.", altEs: ["我妹妹今年六歲。"], grammar: [g.kinship-terms, g.age], vocab: [w.sai3-mui2, w.mui6-mui6] }
      - { es: "我細個住喺跑馬地。", en: "When I was little I lived in Happy Valley.", altEs: ["我細個嗰陣住喺跑馬地。"], grammar: [g.kinship-terms, g.hai2-location], vocab: [w.sai3-go3] }
      - { es: "你大個想做乜嘢呀？", en: "What do you want to be when you grow up?", altEs: ["你大個想做咩呀？", "你大個想做咩嘢呀？"], grammar: [g.question-words], vocab: [w.daai6-go3] }
      - { es: "我哋一家人星期三晚去跑馬地睇跑馬。", en: "Our whole family goes to Happy Valley on Wednesday night to watch the races.", altEs: ["星期三晚我哋一家人去跑馬地睇跑馬。"], grammar: [g.kinship-terms, g.time-before-verb], vocab: [w.jat1-gaa1-jan4, w.paau2-maa5] }
      - { es: "你屋企有幾多個人呀？", en: "How many people are there in your family?", altEs: ["你屋企有幾個人呀？", "你屋企有幾多人呀？"], grammar: [g.kinship-terms, g.gei-how-many], vocab: [w.uk1-kei2-jan4] }
      - { es: "佢係我哥哥，唔係我男朋友！", en: "He's my older brother, not my boyfriend!", altEs: ["佢係我阿哥，唔係我男朋友！"], grammar: [g.kinship-terms, g.m-negation], vocab: [w.go1-go1] }
      - { es: "我哋係一個好細嘅家庭。", en: "We're a very small family.", altEs: ["我哋個家庭好細。"], grammar: [g.kinship-terms], vocab: [w.gaa1-ting4] }
    exchanges:
      - q: { es: "你有冇兄弟姊妹呀？", en: "Do you have any brothers or sisters?" }
        a: { es: "有，我有一個哥哥。", en: "Yes, I have an older brother." }
        alt: ["冇呀。", "有，我有兩個妹妹。", "有，一個家姐。"]
        grammar: [g.kinship-terms, g.jau-have]
        vocab: [w.hing1-dai6-zi2-mui6, w.go1-go1]
      - q: { es: "你屋企有幾多個人呀？", en: "How many people are there in your family?" }
        a: { es: "四個：爸爸、媽媽、家姐同我。", en: "Four: Dad, Mum, my older sister and me." }
        alt: ["四個。", "五個人。", "三個人。"]
        grammar: [g.kinship-terms]
        vocab: [w.baa1-baa1, w.maa4-maa1, w.gaa1-ze1]
      - q: { es: "佢係你家姐嗎？", en: "Is she your older sister?" }
        a: { es: "唔係，佢係我妹妹。", en: "No, she's my younger sister." }
        alt: ["係呀。", "唔係，係我細妹。"]
        grammar: [g.kinship-terms, g.maa-questions]
        vocab: [w.gaa1-ze1, w.mui6-mui6]
      - q: { es: "你屋企人住喺邊度呀？", en: "Where does your family live?" }
        a: { es: "佢哋住喺跑馬地。", en: "They live in Happy Valley." }
        alt: ["住喺跑馬地。", "喺香港島。", "佢哋住喺英國。"]
        grammar: [g.kinship-terms, g.hai2-location]
        vocab: [w.uk1-kei2-jan4]
      - q: { es: "你細個住喺邊度呀？", en: "Where did you live when you were little?" }
        a: { es: "我細個住喺英國。", en: "When I was little I lived in Britain." }
        alt: ["英國。", "我細個住喺跑馬地。"]
        grammar: [g.kinship-terms, g.question-words]
        vocab: [w.sai3-go3]
    texts:
      - title: "我屋企人"
        es: ["我屋企有五個人。", "爸爸、媽媽、家姐、細佬同我。", "我哋一家人住喺跑馬地。"]
        en: ["There are five people in my family.", "Dad, Mum, my older sister, my younger brother and me.", "Our whole family lives in Happy Valley."]
        grammar: [g.kinship-terms]
        vocab: [w.uk1-kei2-jan4, w.gaa1-ze1, w.sai3-lou2, w.jat1-gaa1-jan4]
      - title: "阿媽嘅短訊"
        es: ["阿仔，你幾點返嚟呀？", "今晚爺爺嫲嫲嚟食飯。", "唔好遲到呀！"]
        en: ["Son, what time are you coming home?", "Grandpa and Grandma are coming for dinner tonight.", "Don't be late!"]
        grammar: [g.kinship-terms]
        vocab: [w.aa3-maa1]
    spicy:
      - { es: "我媽媽話你好靚仔。", en: "My mum says you're very handsome.", altEs: ["我媽媽話你好靚女。", "我阿媽話你好靚仔。"], altEn: ["My mum says you're very pretty."], grammar: [g.kinship-terms, g.adjective-predicates], vocab: [w.maa4-maa1] }
      - { es: "你哥哥有冇女朋友呀？唔係我問，係我朋友問。", en: "Does your brother have a girlfriend? I'm not asking, my friend is.", altEs: ["你阿哥有冇女朋友呀？唔係我問，係我朋友問。"], grammar: [g.kinship-terms, g.jau-have], vocab: [w.go1-go1] }
      - { es: "我阿媽成日問我幾時帶男朋友返屋企。", en: "My mum keeps asking me when I'm bringing a boyfriend home.", altEs: ["我阿媽成日問我幾時帶女朋友返屋企。"], altEn: ["My mum keeps asking me when I'm bringing a girlfriend home."], grammar: [g.kinship-terms, g.question-words], vocab: [w.aa3-maa1] }
      - { es: "我細個好得意，而家……都幾得意㗎。", en: "I was really cute as a kid, and now... still pretty cute.", altEs: ["我細個好得意，而家都幾得意㗎。"], grammar: [g.kinship-terms, g.degree-adverbs], vocab: [w.sai3-go3] }
      - { es: "你家姐好靚，不過我鍾意你。", en: "Your sister is beautiful, but it's you I like.", altEs: ["你家姐好靚，但係我鍾意你。"], grammar: [g.kinship-terms, g.zung-ji-like], vocab: [w.gaa1-ze1] }
  - id: a1.u08.l2
    title: 呢個係邊個嘅？
    teach: [g.ge-possessive]
    vocab: [w.ge3, w.je4-je2, w.maa4-maa4, w.gung1-gung1, w.po4-po2, w.lou5-gung1, w.lou5-po4, w.zai2, w.neoi2, w.zai2-neoi2, w.syun1, w.suk1-suk1, w.aa3-ji1, w.gu1-maa1, w.kau5-fu2, w.biu2-go1, w.biu2-ze2, w.can1-cik1, w.uk1-kei2.b]
    tip: "嘅 works like 's: 我媽媽嘅袋 \"my mum's bag\". With close family it is usually dropped: 我媽媽, 我屋企."
    sentences:
      - { es: "呢個係邊個嘅袋呀？", en: "Whose bag is this?", altEs: ["呢個袋係邊個嘅呀？", "呢個係邊個嘅袋？"], grammar: [g.ge-possessive, g.question-words], vocab: [w.ge3], error: { wrong: "呢個係邊個的袋呀？", explain: "Spoken Cantonese marks possession with 嘅 (ge3), not Mandarin 的.", grammar: g.ge-possessive } }
      - { es: "呢個袋係我媽媽嘅。", en: "This bag is my mum's.", altEs: ["呢個袋係我阿媽嘅。"], grammar: [g.ge-possessive], vocab: [w.ge3], transform: { instruction: "Say it belongs to your older sister", answer: "呢個袋係我家姐嘅。", en: "This bag is my older sister's." } }
      - { es: "嗰架車係我爸爸嘅。", en: "That car is my dad's.", altEs: ["嗰架車係我阿爸嘅。"], grammar: [g.ge-possessive, g.demonstratives], vocab: [w.ge3], transform: { instruction: "Make it negative", answer: "嗰架車唔係我爸爸嘅。", alt: ["嗰架車唔係我阿爸嘅。"], en: "That car isn't my dad's." } }
      - { es: "我嫲嫲今年八十歲。", en: "My grandmother (Dad's mum) is eighty this year.", altEs: ["我嫲嫲今年八十。"], grammar: [g.kinship-terms, g.age], vocab: [w.maa4-maa4] }
      - { es: "我婆婆係我媽媽嘅媽媽。", en: "My 婆婆 is my mum's mum.", altEs: ["我婆婆係我阿媽嘅阿媽。"], grammar: [g.ge-possessive, g.kinship-terms], vocab: [w.po4-po2], error: { wrong: "我嫲嫲係我媽媽嘅媽媽。", explain: "嫲嫲 is your father's mother; your mother's mother is 婆婆.", grammar: g.kinship-terms } }
      - { es: "我公公婆婆住喺澳門。", en: "My grandparents on my mum's side live in Macau.", altEs: ["我公公同婆婆住喺澳門。"], grammar: [g.kinship-terms, g.hai2-location], vocab: [w.gung1-gung1, w.po4-po2] }
      - { es: "我爺爺嘅屋喺跑馬地。", en: "My grandpa's flat is in Happy Valley.", altEs: ["我爺爺間屋喺跑馬地。"], grammar: [g.ge-possessive, g.hai2-location], vocab: [w.je4-je2] }
      - { es: "佢老公係廚師。", en: "Her husband is a chef.", altEs: ["佢嘅老公係廚師。"], grammar: [g.ge-possessive, g.hai6-identity], vocab: [w.lou5-gung1] }
      - { es: "我老婆係香港人。", en: "My wife is from Hong Kong.", altEs: ["我太太係香港人。"], altEn: ["My wife is a Hongkonger."], grammar: [g.ge-possessive], vocab: [w.lou5-po4] }
      - { es: "陳太有一個仔同兩個女。", jp: "can4 taai2 jau5 jat1 go3 zai2 tung4 loeng5 go3 neoi2", en: "Mrs Chan has one son and two daughters.", altEs: ["陳太有個仔同兩個女。"], grammar: [g.kinship-terms, g.jau-have], vocab: [w.zai2, w.neoi2], transform: { instruction: "Swap them: two sons and one daughter", answer: "陳太有兩個仔同一個女。", alt: ["陳太有兩個仔同個女。"], en: "Mrs Chan has two sons and one daughter." } }
      - { es: "我個仔今年十歲。", en: "My son is ten this year.", altEs: ["我個仔今年十歲呀。"], grammar: [g.classifier-as-the, g.age], vocab: [w.zai2] }
      - { es: "我阿姨嘅女係我表姐。", en: "My aunt's daughter is my cousin.", altEs: ["我阿姨個女係我表姐。"], grammar: [g.ge-possessive, g.kinship-terms], vocab: [w.aa3-ji1, w.biu2-ze2] }
      - { es: "我舅父係我媽媽嘅細佬。", en: "My uncle is my mum's younger brother.", altEs: ["我舅父係我阿媽嘅細佬。"], grammar: [g.ge-possessive, g.kinship-terms], vocab: [w.kau5-fu2] }
      - { es: "我姑媽係我爸爸嘅家姐。", en: "My aunt is my dad's older sister.", altEs: ["我姑媽係我阿爸嘅家姐。"], grammar: [g.ge-possessive, g.kinship-terms], vocab: [w.gu1-maa1] }
      - { es: "新年好多親戚嚟我屋企。", en: "At New Year lots of relatives come to our place.", altEs: ["新年有好多親戚嚟我屋企。"], grammar: [g.ge-possessive], vocab: [w.can1-cik1, w.uk1-kei2.b] }
      - { es: "嫲嫲有六個孫，我係最細嗰個。", en: "Grandma has six grandchildren, and I'm the youngest.", altEs: ["我嫲嫲有六個孫，我係最細嗰個。"], grammar: [g.kinship-terms], vocab: [w.syun1, w.maa4-maa4] }
    exchanges:
      - q: { es: "呢部係邊個嘅電話呀？", en: "Whose phone is this?" }
        a: { es: "係我嘅。", en: "It's mine." }
        alt: ["我嘅。", "係我哥哥嘅。", "係我表姐嘅。"]
        grammar: [g.ge-possessive]
        vocab: [w.ge3]
      - q: { es: "你爺爺嫲嫲住喺邊度呀？", en: "Where do your grandparents (Dad's side) live?" }
        a: { es: "佢哋住喺跑馬地。", en: "They live in Happy Valley." }
        alt: ["喺跑馬地。", "住喺澳門。"]
        grammar: [g.kinship-terms, g.hai2-location]
        vocab: [w.je4-je2, w.maa4-maa4]
      - q: { es: "你有冇仔女呀？", en: "Do you have children?" }
        a: { es: "有，我有一個仔。", en: "Yes, I have a son." }
        alt: ["冇呀。", "有，一個仔一個女。", "有，兩個女。"]
        grammar: [g.kinship-terms, g.jau-have]
        vocab: [w.zai2-neoi2, w.zai2]
      - q: { es: "佢係你表哥嗎？", en: "Is he your cousin?" }
        a: { es: "係呀，佢係我舅父個仔。", en: "Yes, he's my uncle's son." }
        alt: ["係呀。", "唔係，佢係我哥哥。"]
        grammar: [g.ge-possessive, g.maa-questions]
        vocab: [w.biu2-go1, w.kau5-fu2]
      - q: { es: "你老公做乜嘢㗎？", en: "What does your husband do?" }
        a: { es: "佢係醫生。", en: "He's a doctor." }
        alt: ["醫生。", "佢係廚師。"]
        grammar: [g.ge-possessive, g.question-words]
        vocab: [w.lou5-gung1]
    texts:
      - title: "相"
        es: ["呢張係我屋企人嘅相。", "中間嗰個係我嫲嫲。", "佢旁邊係我爺爺同我表哥。"]
        en: ["This is a photo of my family.", "The one in the middle is my grandma.", "Next to her are my grandpa and my cousin."]
        grammar: [g.ge-possessive, g.kinship-terms]
        vocab: [w.maa4-maa4, w.je4-je2, w.biu2-go1]
      - title: "Karen 嘅短訊"
        es: ["姑媽，你嘅遮喺我屋企。", "我聽日拎畀你。"]
        en: ["Auntie, your umbrella is at my place.", "I'll bring it to you tomorrow."]
        grammar: [g.ge-possessive]
        vocab: [w.gu1-maa1, w.ge3]
    spicy:
      - { es: "你嘅廣東話好正，你嘅樣都好靚。", jp: "nei5 ge3 gwong2 dung1 waa2 hou2 zeng3 nei5 ge3 joeng2 dou1 hou2 leng3", en: "Your Cantonese is great, and so are your looks.", altEs: ["你嘅廣東話好正，你個樣都好靚。"], grammar: [g.ge-possessive, g.adjective-predicates], vocab: [w.ge3] }
      - { es: "我婆婆話：你咁好人，快啲結婚啦！", en: "My grandma says: you're such a good person, hurry up and get married!", altEs: ["我婆婆話你咁好人，快啲結婚啦！"], grammar: [g.kinship-terms], vocab: [w.po4-po2] }
      - { es: "呢件褸係我嘅，你凍就着啦。", jp: "ni1 gin6 lau1 hai6 ngo5 ge3 nei5 dung3 zau6 zoek3 laa1", en: "This jacket is mine; if you're cold, put it on.", altEs: ["呢件褸係我嘅，你凍就着啦！"], grammar: [g.ge-possessive], vocab: [w.ge3] }
      - { es: "你係邊個嘅男朋友呀？……冇？咁好。", en: "Whose boyfriend are you? ... Nobody's? Good.", altEs: ["你係邊個嘅女朋友呀？……冇？咁好。"], altEn: ["Whose girlfriend are you? ... Nobody's? Good."], grammar: [g.ge-possessive, g.question-words], vocab: [w.ge3] }
      - { es: "我嘅電話號碼？你想要就畀你啦。", en: "My phone number? If you want it, it's yours.", altEs: ["我嘅電話號碼？你想要我就畀你啦。"], grammar: [g.ge-possessive], vocab: [w.ge3] }
  - id: a1.u08.l3
    title: 佢好高
    teach: [g.adjective-predicates]
    vocab: [w.gou1, w.ai2, w.fei4, w.sau3, w.leng3, w.leng3-zai2, w.leng3-neoi2, w.hau6-saang1, w.lou5, w.lek1, w.hou2-jan4, w.mong4, w.dak1-haan4, w.hoi1-sam1, w.ok3, w.hou2-siu3, w.ho2-oi3, w.dak1-ji3, w.noi6-sing3]
    tip: "Adjectives work like verbs: no 係. Add 好 for a plain statement (佢好高), and drop it in negatives (佢唔高)."
    sentences:
      - { es: "我細佬好高。", en: "My younger brother is tall.", altEs: ["我細佬好高呀。"], grammar: [g.adjective-predicates], vocab: [w.gou1], transform: { instruction: "Make it negative", answer: "我細佬唔高。", alt: ["我細佬唔係好高。"], en: "My younger brother isn't tall." } }
      - { es: "我爸爸唔係好高。", en: "My dad isn't very tall.", altEs: ["我阿爸唔係好高。", "我爸爸唔係幾高。"], grammar: [g.adjective-predicates], vocab: [w.gou1], error: { wrong: "我爸爸唔好高。", explain: "唔好 means \"don't\"; for \"not very\" say 唔係好高, or just 唔高.", grammar: g.adjective-predicates } }
      - { es: "我婆婆好矮，不過好叻。", en: "My grandma is short, but very clever.", altEs: ["我婆婆好矮，但係好叻。"], grammar: [g.adjective-predicates], vocab: [w.ai2, w.lek1] }
      - { es: "我哋隻狗好肥。", en: "Our dog is fat.", altEs: ["我哋隻狗好肥呀。"], grammar: [g.adjective-predicates, g.classifier-as-the], vocab: [w.fei4] }
      - { es: "佢好瘦，食好多都唔肥。", en: "She's thin; she eats a lot and never gets fat.", altEs: ["佢好瘦，食好多嘢都唔肥。"], altEn: ["He's thin; he eats a lot and never gets fat."], grammar: [g.adjective-predicates], vocab: [w.sau3, w.fei4] }
