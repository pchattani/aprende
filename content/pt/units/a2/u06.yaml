id: a2.u06
title: Você já foi a Curitiba?
lessons:
  - id: a2.u06.l1
    title: Você já foi a Curitiba?
    teach: [g.ja-ainda-nao]
    vocab: [w.ainda-não, w.alguma-vez, w.experiência, w.exterior, w.capivara, w.pinhão, w.cultura, w.tradição, w.típico, w.diferente-de, w.conhecido, w.europeu, w.africano, w.asiático, w.latino-americano]
    tip: "Você já…? + preterite = Have you ever…? Answer Já (yes), Ainda não (not yet) or Nunca (never). Não… mais = not any more."
    sentences:
      - { es: "Você já foi a Curitiba?", en: "Have you ever been to Curitiba?", altEs: ["Você já foi para Curitiba?", "Já foi a Curitiba?"], altEn: ["Have you been to Curitiba?"], grammar: [g.ja-ainda-nao, g.preterite-ser-ir], vocab: [w.ir] }
      - { es: "Já, duas vezes. E você?", en: "Yes, twice. And you?", altEs: ["Já fui, duas vezes. E você?"], altEn: ["I have, twice. And you?"], grammar: [g.ja-ainda-nao], vocab: [w.vez] }
      - { es: "Ainda não, mas quero muito ir.", en: "Not yet, but I really want to go.", altEs: ["Ainda não, mas eu quero muito ir."], grammar: [g.ja-ainda-nao], vocab: [w.ainda-não, w.querer], transform: { instruction: "Change to 'we'", answer: "Ainda não, mas queremos muito ir.", alt: ["Ainda não, mas a gente quer muito ir.", "Ainda não, mas nós queremos muito ir."], en: "Not yet, but we really want to go." } }
      - { es: "Você já viu uma capivara de perto?", en: "Have you ever seen a capybara up close?", altEs: ["Já viu uma capivara de perto?"], grammar: [g.ja-ainda-nao], vocab: [w.capivara, w.ver], note: "Capybaras live freely in Curitiba's parks." }
      - { es: "Já comi pinhão em Curitiba, no inverno.", en: "I've eaten pinhão in Curitiba, in winter.", altEs: ["Eu já comi pinhão em Curitiba, no inverno."], grammar: [g.ja-ainda-nao], vocab: [w.pinhão, w.comer, w.inverno], note: "pinhão = the seed of the araucaria pine, a winter treat in the South." }
      - { es: "Você já morou no exterior alguma vez?", en: "Have you ever lived abroad?", altEs: ["Você já morou no exterior?", "Alguma vez você morou no exterior?"], grammar: [g.ja-ainda-nao], vocab: [w.exterior, w.alguma-vez], error: { wrong: "Você tem morado no exterior alguma vez?", explain: "'Have you ever…?' is já + preterite: você já morou.", grammar: g.ja-ainda-nao } }
      - { es: "Eu nunca fui a um país europeu.", en: "I've never been to a European country.", altEs: ["Nunca fui a um país europeu."], grammar: [g.ja-ainda-nao], vocab: [w.europeu, w.país] }
      - { es: "Ela não mora mais em Paraty.", en: "She doesn't live in Paraty any more.", altEs: ["Ela já não mora em Paraty."], grammar: [g.ja-ainda-nao], vocab: [w.morar], variant: "Portugal: Ela já não mora em Paraty.", transform: { instruction: "Change to 'they' (women)", answer: "Elas não moram mais em Paraty.", alt: ["Elas já não moram em Paraty."], en: "They don't live in Paraty any more." } }
      - { es: "A cultura de Paraty é muito diferente da de São Paulo.", en: "Paraty's culture is very different from São Paulo's.", grammar: [g.contractions-de], vocab: [w.cultura, w.diferente-de] }
      - { es: "Você ainda mora no centro histórico?", en: "Do you still live in the historic centre?", altEs: ["Ainda mora no centro histórico?"], grammar: [g.ja-ainda-nao], vocab: [w.histórico, w.centro] }
      - { es: "Você já experimentou a comida típica daqui?", en: "Have you tried the local food yet?", altEs: ["Já experimentou a comida típica daqui?"], altEn: ["Have you tried the typical food here?"], grammar: [g.ja-ainda-nao], vocab: [w.típico, w.experimentar] }
      - { es: "Paraty é uma cidade muito conhecida pela sua história.", en: "Paraty is a town well known for its history.", altEs: ["Paraty é uma cidade bem conhecida pela sua história."], grammar: [g.contractions-por], vocab: [w.conhecido, w.história] }
      - { es: "Na festa, a gente ouviu música africana, asiática e latino-americana.", en: "At the party, we heard African, Asian and Latin American music.", altEs: ["Na festa, nós ouvimos música africana, asiática e latino-americana."], grammar: [g.a-gente], vocab: [w.africano, w.asiático, w.latino-americano] }
      - { es: "Essa festa é uma tradição antiga da cidade.", en: "This festival is an old tradition in the town.", altEs: ["Esta festa é uma tradição antiga da cidade."], grammar: [g.demonstratives], vocab: [w.tradição, w.antigo] }
      - { es: "Foi a minha primeira experiência num barco.", en: "It was my first experience on a boat.", altEs: ["Foi minha primeira experiência num barco.", "Foi a minha primeira experiência em um barco."], grammar: [g.preterite-ser-ir], vocab: [w.experiência, w.barco] }
      - { es: "Você já terminou? — Ainda não!", en: "Have you finished yet? — Not yet!", altEs: ["Já terminou? — Ainda não!"], grammar: [g.ja-ainda-nao], vocab: [w.terminar, w.ainda-não] }
    exchanges:
      - q: { es: "Você já foi a Paraty?", en: "Have you ever been to Paraty?" }
        a: { es: "Já! Fui no ano passado e adorei.", en: "Yes! I went last year and loved it." }
        alt: ["Ainda não.", "Nunca fui.", "Já, duas vezes."]
        grammar: [g.ja-ainda-nao]
        vocab: [w.ir]
      - q: { es: "Você já comeu pinhão?", en: "Have you ever eaten pinhão?" }
        a: { es: "Ainda não. É bom?", en: "Not yet. Is it good?" }
        alt: ["Já, adoro!", "Nunca comi.", "Já."]
        grammar: [g.ja-ainda-nao]
        vocab: [w.pinhão, w.ainda-não]
      - q: { es: "Você já morou no exterior?", en: "Have you ever lived abroad?" }
        a: { es: "Já, morei dois anos no Canadá.", en: "Yes, I lived in Canada for two years." }
        alt: ["Nunca.", "Ainda não.", "Já, em Portugal."]
        grammar: [g.ja-ainda-nao]
        vocab: [w.exterior]
      - q: { es: "Você ainda trabalha naquela loja?", en: "Do you still work at that shop?" }
        a: { es: "Não, não trabalho mais lá.", en: "No, I don't work there any more." }
        alt: ["Ainda trabalho.", "Não, saí no ano passado.", "Trabalho, sim."]
        grammar: [g.ja-ainda-nao]
        vocab: [w.loja, w.trabalhar]
      - q: { es: "Qual é a comida mais típica de Curitiba?", en: "What's the most typical food in Curitiba?" }
        a: { es: "Acho que é o pinhão, no inverno.", en: "I think it's pinhão, in winter." }
        alt: ["O pinhão.", "Não sei.", "Pinhão, com certeza."]
        grammar: [g.superlatives]
        vocab: [w.típico, w.pinhão]
    texts:
      - title: "Mensagem de Paraty"
        es: ["Oi, mãe! Já cheguei a Paraty.", "Ainda não conheço a cidade, mas já vi o rio e o mar.", "Amanhã vou ver as igrejas antigas do centro histórico."]
        en: ["Hi, Mum! I've arrived in Paraty.", "I don't know the town yet, but I've already seen the river and the sea.", "Tomorrow I'm going to see the old churches in the historic centre."]
        grammar: [g.ja-ainda-nao]
        vocab: [w.ainda-não, w.igreja]
      - title: "Pergunta do dia"
        es: ["Você já viu uma capivara?", "Em Curitiba, elas moram nos parques e não têm medo de ninguém.", "Mas não chegue muito perto!"]
        en: ["Have you ever seen a capybara?", "In Curitiba they live in the parks and aren't afraid of anyone.", "But don't get too close!"]
        grammar: [g.ja-ainda-nao]
        vocab: [w.capivara, w.parque]
    spicy:
      - { es: "Você já beijou alguém numa viagem? Eu ainda não... até agora.", en: "Have you ever kissed someone on a trip? I haven't yet... until now.", altEs: ["Você já beijou alguém em uma viagem? Eu ainda não... até agora."], grammar: [g.ja-ainda-nao], vocab: [w.beijar, w.viagem] }
      - { es: "Já fui a vários países, mas nunca vi olhos como os seus.", en: "I've been to lots of countries, but I've never seen eyes like yours.", grammar: [g.ja-ainda-nao], vocab: [w.vários, w.olho] }
      - { es: "Ainda não sei o seu nome, mas já gosto de você.", en: "I don't know your name yet, but I already like you.", altEs: ["Ainda não sei seu nome, mas já gosto de você."], grammar: [g.ja-ainda-nao], vocab: [w.nome, w.gostar] }
      - { es: "Você ainda tá solteiro ou eu cheguei tarde?", en: "Are you still single or am I too late?", altEs: ["Você ainda está solteira ou eu cheguei tarde?", "Você ainda está solteiro ou eu cheguei tarde?"], grammar: [g.ja-ainda-nao], vocab: [w.solteiro, w.chegar] }
      - { es: "Não fumo mais, não bebo mais... mas ainda danço com estranhos bonitos.", en: "I don't smoke any more, I don't drink any more... but I still dance with handsome strangers.", grammar: [g.ja-ainda-nao], vocab: [w.fumar, w.dançar, w.estranho] }
  - id: a2.u06.l2
    title: Tudo pronto para a viagem
    teach: [g.past-participles]
    vocab: [w.reserva, w.reservar, w.pousada, w.albergue, w.pacote, w.roteiro, w.guia, w.turismo, w.mochila, w.mochilão, w.bagagem, w.câmbio, w.moeda, w.dólar, w.euro, w.carimbo]
    tip: "Participles end in -ado / -ido, with irregulars like feito, dito, visto, escrito, aberto, posto, pago, gasto. As adjectives they agree: a porta está aberta."
    sentences:
      - { es: "A reserva da pousada já está feita.", en: "The guesthouse booking is already made.", altEs: ["A reserva da pousada já foi feita."], altEn: ["The guesthouse is already booked."], grammar: [g.past-participles], vocab: [w.reserva, w.pousada] }
      - { es: "Reservei um quarto num albergue perto do centro.", en: "I've booked a room in a hostel near the centre.", altEs: ["Eu reservei um quarto num albergue perto do centro.", "Reservei um quarto em um albergue perto do centro."], grammar: [g.preterite-regular], vocab: [w.reservar, w.albergue], variant: "Portugal: pousada da juventude (youth hostel)." }
      - { es: "A mochila está pronta e a mala está fechada.", en: "The rucksack is ready and the suitcase is closed.", altEs: ["A mochila está pronta e a mala, fechada."], grammar: [g.past-participles], vocab: [w.mochila, w.mala, w.fechar], transform: { instruction: "Make everything plural", answer: "As mochilas estão prontas e as malas estão fechadas.", alt: ["As mochilas estão prontas e as malas, fechadas."], en: "The rucksacks are ready and the suitcases are closed." } }
      - { es: "O roteiro foi escrito pelo nosso guia.", en: "The itinerary was written by our guide.", altEs: ["Quem escreveu o roteiro foi o nosso guia."], grammar: [g.past-participles], vocab: [w.roteiro, w.guia, w.escrever], error: { wrong: "O roteiro foi escrevido pelo nosso guia.", explain: "escrever has an irregular participle: escrito.", grammar: g.past-participles } }
      - { es: "A conta da pousada já está paga.", en: "The guesthouse bill is already paid.", altEs: ["A conta da pousada já foi paga."], grammar: [g.past-participles], vocab: [w.pagar, w.conta], error: { wrong: "A conta da pousada já está pago.", explain: "As an adjective the participle agrees with the noun: a conta está paga.", grammar: g.past-participles } }
      - { es: "A loja de câmbio está aberta aos sábados?", en: "Is the currency exchange open on Saturdays?", altEs: ["A casa de câmbio está aberta aos sábados?"], grammar: [g.past-participles], vocab: [w.câmbio, w.abrir], transform: { instruction: "Change to 'the exchange shops'", answer: "As lojas de câmbio estão abertas aos sábados?", alt: ["As casas de câmbio estão abertas aos sábados?"], en: "Are the currency exchanges open on Saturdays?" } }
      - { es: "Você trocou dinheiro? — Troquei dólares por reais.", en: "Did you change money? — I changed dollars into reais.", altEs: ["Trocou dinheiro? — Troquei dólares por reais."], grammar: [g.preterite-spelling], vocab: [w.dólar, w.trocar, w.real] }
      - { es: "Todo o dinheiro foi gasto no primeiro dia!", en: "All the money was spent on the first day!", altEs: ["O dinheiro todo foi gasto no primeiro dia!"], grammar: [g.past-participles], vocab: [w.gastar, w.dinheiro] }
      - { es: "O meu passaporte tem carimbos de muitos países.", en: "My passport has stamps from lots of countries.", altEs: ["Meu passaporte tem carimbos de muitos países."], grammar: [g.plural-nouns], vocab: [w.carimbo, w.passaporte] }
      - { es: "Fizemos um mochilão pela América do Sul.", en: "We went backpacking around South America.", altEs: ["A gente fez um mochilão pela América do Sul."], grammar: [g.preterite-irregular], vocab: [w.mochilão] }
      - { es: "Esse pacote de turismo tem hotel e passeio de barco.", en: "This tour package includes a hotel and a boat trip.", altEs: ["Este pacote de turismo tem hotel e passeio de barco."], grammar: [g.ter-present], vocab: [w.pacote, w.turismo, w.passeio] }
      - { es: "A bagagem já foi posta no ônibus.", en: "The luggage has already been put on the bus.", altEs: ["A bagagem já foi colocada no ônibus."], grammar: [g.past-participles], vocab: [w.bagagem, w.pôr] }
      - { es: "Tudo isso foi dito pelo guia.", en: "All of that was said by the guide.", grammar: [g.past-participles], vocab: [w.dizer, w.guia] }
      - { es: "Você tem moedas de um real?", en: "Do you have one-real coins?", altEs: ["Tem moedas de um real?"], grammar: [g.ter-present], vocab: [w.moeda] }
      - { es: "Lá tudo é pago em euros.", en: "Everything there is paid for in euros.", altEs: ["Lá se paga tudo em euros."], grammar: [g.past-participles], vocab: [w.euro, w.pagar] }
      - { es: "A igreja de Santa Rita foi construída em 1722.", en: "The church of Santa Rita was built in 1722.", grammar: [g.past-participles, g.dates-years], vocab: [w.construir, w.igreja], note: "Santa Rita, by the water in Paraty, is the town's most photographed church." }
    exchanges:
      - q: { es: "Você já fez a reserva?", en: "Have you made the booking yet?" }
        a: { es: "Já, está tudo reservado.", en: "Yes, everything's booked." }
        alt: ["Ainda não.", "Fiz ontem.", "Já está feita."]
        grammar: [g.past-participles]
        vocab: [w.reserva, w.reservar]
      - q: { es: "Onde vocês vão ficar?", en: "Where are you staying?" }
        a: { es: "Numa pousada no centro histórico.", en: "In a guesthouse in the historic centre." }
        alt: ["Num albergue.", "Num hotel.", "Numa pousada."]
        grammar: [g.contractions-em]
        vocab: [w.pousada]
      - q: { es: "Você comprou um pacote?", en: "Did you buy a package?" }
        a: { es: "Não, a gente fez o roteiro sozinho.", en: "No, we planned the itinerary ourselves." }
        alt: ["Comprei, sim.", "Não, vou de mochilão.", "Não, fiz tudo sozinho."]
        grammar: [g.preterite-irregular]
        vocab: [w.pacote, w.roteiro]
      - q: { es: "Onde eu troco dinheiro?", en: "Where can I change money?" }
        a: { es: "Tem uma casa de câmbio aberta ali na esquina.", en: "There's an exchange office open on the corner there." }
        alt: ["No banco.", "No aeroporto.", "Ali na esquina."]
        grammar: [g.past-participles]
        vocab: [w.câmbio]
      - q: { es: "A sua mala está pronta?", en: "Is your suitcase ready?" }
        a: { es: "Está feita desde ontem!", en: "It's been packed since yesterday!" }
        alt: ["Ainda não.", "Quase.", "Está, sim."]
        grammar: [g.past-participles]
        vocab: [w.mala]
    texts:
      - title: "Lista de viagem"
        es: ["Reserva da pousada: feita.", "Passagens: compradas.", "Dinheiro: trocado.", "Mochila: ainda aberta!"]
        en: ["Guesthouse booking: done.", "Tickets: bought.", "Money: changed.", "Rucksack: still open!"]
        grammar: [g.past-participles]
        vocab: [w.reserva, w.mochila]
      - title: "Paraty"
        es: ["O centro histórico de Paraty foi construído no século XVIII.", "No passado, o ouro de Minas Gerais passava por aqui.", "Em 2019, Paraty virou Patrimônio Mundial da UNESCO."]
        en: ["Paraty's historic centre was built in the 18th century.", "In the past, gold from Minas Gerais passed through here.", "In 2019, Paraty became a UNESCO World Heritage Site."]
        grammar: [g.past-participles, g.dates-years]
        vocab: [w.construir, w.histórico]
    spicy:
      - { es: "A minha mochila está feita, mas o meu coração ficou em Paraty.", en: "My rucksack is packed, but my heart stayed in Paraty.", altEs: ["Minha mochila está feita, mas meu coração ficou em Paraty."], grammar: [g.past-participles], vocab: [w.mochila, w.coração] }
      - { es: "Reservei uma mesa para dois. Você está convidado.", en: "I've booked a table for two. You're invited.", altEs: ["Reservei uma mesa para dois. Você está convidada."], grammar: [g.past-participles], vocab: [w.reservar, w.convidar] }
      - { es: "O roteiro está pronto: praia, jantar e você.", en: "The itinerary is ready: beach, dinner and you.", grammar: [g.past-participles], vocab: [w.roteiro, w.pronto] }
      - { es: "Guia turístico? Não, mas posso mostrar a cidade para você.", en: "A tour guide? No, but I can show you the town.", altEs: ["Guia turístico? Não, mas posso te mostrar a cidade."], grammar: [g.poder-present], vocab: [w.guia, w.mostrar] }
      - { es: "Meu passaporte tem vinte carimbos, mas nenhuma lembrança tão boa como esta.", en: "My passport has twenty stamps, but no memory as good as this one.", altEs: ["O meu passaporte tem vinte carimbos, mas nenhuma lembrança tão boa quanto esta."], grammar: [g.indefinite-pronouns], vocab: [w.carimbo, w.lembrança] }
  - id: a2.u06.l3
    title: Tenho viajado muito
    teach: [g.perfeito-composto]
    vocab: [w.ultimamente, w.recentemente, w.raramente, w.frequentemente, w.de-vez-em-quando, w.quase-nunca, w.fotografia, w.embarcar, w.desembarcar, w.demorar]
    tip: "tenho feito = I have been doing (lately, again and again). For one finished action, use the preterite: Já fiz."
    sentences:
      - { es: "Tenho viajado muito ultimamente.", en: "I've been travelling a lot lately.", altEs: ["Ultimamente tenho viajado muito.", "Eu tenho viajado muito ultimamente."], grammar: [g.perfeito-composto], vocab: [w.ultimamente, w.viajar], error: { wrong: "Tenho viajada muito ultimamente.", explain: "With ter the participle never changes: tenho viajado.", grammar: g.perfeito-composto } }
      - { es: "Como você tem passado?", en: "How have you been?", altEs: ["Como tem passado?"], grammar: [g.perfeito-composto], vocab: [w.passar], transform: { instruction: "Ask several people (vocês)", answer: "Como vocês têm passado?", alt: [], en: "How have you (all) been?" } }
      - { es: "Tem chovido muito em Paraty.", en: "It's been raining a lot in Paraty.", altEs: ["Tem chovido bastante em Paraty."], grammar: [g.perfeito-composto], vocab: [w.chover] }
      - { es: "A gente tem ido à praia de vez em quando.", en: "We've been going to the beach now and then.", altEs: ["Nós temos ido à praia de vez em quando."], grammar: [g.perfeito-composto, g.a-gente], vocab: [w.de-vez-em-quando, w.praia] }
      - { es: "Ultimamente eles têm saído pouco.", en: "Lately they haven't been going out much.", altEs: ["Eles têm saído pouco ultimamente."], grammar: [g.perfeito-composto], vocab: [w.ultimamente, w.sair], transform: { instruction: "Change to 'she'", answer: "Ultimamente ela tem saído pouco.", alt: ["Ela tem saído pouco ultimamente."], en: "Lately she hasn't been going out much." } }
      - { es: "Recentemente comecei a estudar fotografia.", en: "I recently started studying photography.", altEs: ["Comecei recentemente a estudar fotografia."], grammar: [g.preterite-spelling], vocab: [w.recentemente, w.fotografia] }
      - { es: "Tenho tirado muitas fotografias das igrejas.", en: "I've been taking lots of photographs of the churches.", altEs: ["Tenho tirado muitas fotos das igrejas."], grammar: [g.perfeito-composto], vocab: [w.fotografia, w.tirar, w.igreja] }
      - { es: "Ela raramente viaja de avião.", en: "She rarely travels by plane.", altEs: ["Ela viaja raramente de avião."], grammar: [g.frequency-adverbs], vocab: [w.raramente, w.avião] }
      - { es: "Frequentemente a gente pega um barco para as ilhas.", en: "We often take a boat out to the islands.", altEs: ["Nós frequentemente pegamos um barco para as ilhas."], grammar: [g.frequency-adverbs], vocab: [w.frequentemente, w.barco, w.ilha] }
      - { es: "Quase nunca tenho tempo para ler.", en: "I hardly ever have time to read.", altEs: ["Quase nunca tenho tempo pra ler."], grammar: [g.frequency-adverbs], vocab: [w.quase-nunca, w.tempo, w.ler] }
      - { es: "Embarcamos às oito e desembarcamos em Paraty ao meio-dia.", en: "We boarded at eight and got off in Paraty at midday.", altEs: ["A gente embarcou às oito e desembarcou em Paraty ao meio-dia."], grammar: [g.preterite-regular], vocab: [w.embarcar, w.desembarcar] }
      - { es: "O ônibus de São Paulo para Paraty demora umas seis horas.", en: "The bus from São Paulo to Paraty takes about six hours.", altEs: ["O ônibus de São Paulo a Paraty demora umas seis horas."], grammar: [g.present-regular-ar], vocab: [w.demorar, w.ônibus] }
      - { es: "Não temos dormido bem por causa do calor.", en: "We haven't been sleeping well because of the heat.", altEs: ["A gente não tem dormido bem por causa do calor."], grammar: [g.perfeito-composto], vocab: [w.dormir, w.calor, w.por-causa-de] }
      - { es: "Tenho visto muitos turistas estrangeiros este mês.", en: "I've been seeing lots of foreign tourists this month.", altEs: ["Este mês tenho visto muitos turistas estrangeiros."], grammar: [g.perfeito-composto, g.past-participles], vocab: [w.turista, w.estrangeiro] }
      - { es: "O que você tem feito?", en: "What have you been up to?", altEs: ["O que você tem feito de bom?"], grammar: [g.perfeito-composto, g.past-participles], vocab: [w.fazer] }
      - { es: "Já terminei o livro.", en: "I've already finished the book.", altEs: ["Eu já terminei o livro."], grammar: [g.perfeito-composto, g.ja-ainda-nao], vocab: [w.terminar, w.livro], error: { wrong: "Eu tenho terminado o livro.", explain: "One finished action takes the preterite (já terminei); tenho terminado would mean 'I've been finishing (again and again)'.", grammar: g.perfeito-composto } }
    exchanges:
      - q: { es: "Como você tem passado?", en: "How have you been?" }
        a: { es: "Bem, mas tenho trabalhado demais.", en: "Fine, but I've been working too much." }
        alt: ["Tudo bem.", "Tenho passado bem.", "Bem, e você?"]
        grammar: [g.perfeito-composto]
        vocab: [w.passar, w.trabalhar]
      - q: { es: "Você tem viajado?", en: "Have you been travelling?" }
        a: { es: "Ultimamente, sim: fui a Paraty e a Curitiba.", en: "Lately, yes: I've been to Paraty and Curitiba." }
        alt: ["Quase nunca.", "De vez em quando.", "Tenho, sim."]
        grammar: [g.perfeito-composto]
        vocab: [w.ultimamente, w.viajar]
      - q: { es: "Você vai muito à praia?", en: "Do you go to the beach a lot?" }
        a: { es: "De vez em quando, quando faz sol.", en: "Now and then, when it's sunny." }
        alt: ["Raramente.", "Quase nunca.", "Frequentemente."]
        grammar: [g.frequency-adverbs]
        vocab: [w.de-vez-em-quando]
      - q: { es: "Quanto tempo demora a viagem?", en: "How long does the journey take?" }
        a: { es: "Demora umas seis horas de ônibus.", en: "It takes about six hours by bus." }
        alt: ["Umas seis horas.", "Depende do trânsito.", "Seis horas."]
        grammar: [g.present-regular-ar]
        vocab: [w.demorar]
      - q: { es: "A que horas a gente embarca?", en: "What time do we board?" }
        a: { es: "Às nove. Não chegue atrasado!", en: "At nine. Don't be late!" }
        alt: ["Às nove.", "Daqui a uma hora.", "Às nove e meia."]
        grammar: [g.telling-time]
        vocab: [w.embarcar]
    texts:
      - title: "E-mail para a avó"
        es: ["Querida avó, tenho viajado muito ultimamente.", "Recentemente estive em Paraty e tirei muitas fotografias.", "Tenho pensado muito em você. Beijos!"]
        en: ["Dear Gran, I've been travelling a lot lately.", "Recently I was in Paraty and took lots of photographs.", "I've been thinking about you a lot. Love!"]
        grammar: [g.perfeito-composto]
        vocab: [w.ultimamente, w.recentemente, w.fotografia]
      - title: "No barco"
        es: ["Embarcamos às dez da manhã.", "O passeio demorou cinco horas e parou em três praias.", "Desembarcamos cansados, mas muito felizes."]
        en: ["We boarded at ten in the morning.", "The trip took five hours and stopped at three beaches.", "We got off tired but very happy."]
        grammar: [g.preterite-regular]
        vocab: [w.embarcar, w.demorar, w.desembarcar]
    spicy:
      - { es: "Tenho pensado muito em você ultimamente.", en: "I've been thinking about you a lot lately.", altEs: ["Ultimamente tenho pensado muito em você."], grammar: [g.perfeito-composto], vocab: [w.pensar, w.ultimamente] }
      - { es: "Raramente danço, mas hoje vou dançar com você.", en: "I rarely dance, but tonight I'm dancing with you.", grammar: [g.frequency-adverbs], vocab: [w.raramente, w.dançar] }
      - { es: "De vez em quando eu olho para você... Tá bom, frequentemente.", en: "Now and then I look at you... OK, often.", altEs: ["De vez em quando eu olho pra você... Tá bom, frequentemente."], grammar: [g.frequency-adverbs], vocab: [w.de-vez-em-quando, w.frequentemente, w.olhar] }
      - { es: "Tenho dormido mal. Acho que é saudade de você.", en: "I've been sleeping badly. I think I miss you.", grammar: [g.perfeito-composto], vocab: [w.dormir, w.saudade] }
      - { es: "Embarquei sozinho, mas espero desembarcar com o seu número.", en: "I boarded alone, but I hope to get off with your number.", altEs: ["Embarquei sozinha, mas espero desembarcar com o seu número."], grammar: [g.preterite-spelling], vocab: [w.embarcar, w.desembarcar, w.número] }
  - id: a2.u06.l4
    title: Acabei de chegar
    teach: [g.acabar-de, g.indefinite-pronouns]
    vocab: [w.acabar, w.algo, w.nenhum, w.qualquer, w.vários, w.bolso, w.cinto, w.luva, w.cachecol, w.anel, w.brinco, w.colar, w.pulseira, w.joia]
    tip: "acabei de + infinitive = I've just done. Negative words after the verb need não before it: Não vi ninguém. Não comprei nada."
    sentences:
      - { es: "Acabei de chegar a Paraty.", en: "I've just arrived in Paraty.", altEs: ["Acabei de chegar em Paraty.", "Eu acabei de chegar a Paraty."], grammar: [g.acabar-de], vocab: [w.acabar, w.chegar], error: { wrong: "Acabei chegar a Paraty.", explain: "acabar needs de before the infinitive: acabei de chegar.", grammar: g.acabar-de } }
      - { es: "O ônibus acabou de sair.", en: "The bus has just left.", altEs: ["O ônibus acabou de passar."], grammar: [g.acabar-de], vocab: [w.acabar, w.sair], transform: { instruction: "Change to 'the boats'", answer: "Os barcos acabaram de sair.", alt: [], en: "The boats have just left." } }
      - { es: "Acabou o café!", en: "We've run out of coffee!", altEn: ["The coffee's finished!"], grammar: [g.acabar-de], vocab: [w.acabar, w.café], note: "acabar on its own = to finish, to run out." }
      - { es: "Alguém viu o meu anel?", en: "Has anyone seen my ring?", altEs: ["Alguém viu meu anel?"], grammar: [g.indefinite-pronouns], vocab: [w.anel, w.alguém] }
      - { es: "Não vi nada e não falei com ninguém.", en: "I didn't see anything and I didn't talk to anyone.", altEs: ["Eu não vi nada e não falei com ninguém."], grammar: [g.indefinite-pronouns], vocab: [w.nada, w.ninguém], error: { wrong: "Vi nada e falei com ninguém.", explain: "Negative words after the verb need não before it: não vi nada.", grammar: g.indefinite-pronouns } }
      - { es: "Comprei uns brincos e uma pulseira numa loja do centro histórico.", en: "I bought some earrings and a bracelet in a shop in the historic centre.", altEs: ["Comprei uns brincos e uma pulseira em uma loja do centro histórico."], grammar: [g.preterite-regular], vocab: [w.brinco, w.pulseira] }
      - { es: "Esse colar é uma joia de família.", en: "This necklace is a family heirloom.", altEs: ["Este colar é uma joia de família."], altEn: ["This necklace is a family jewel."], grammar: [g.demonstratives], vocab: [w.colar, w.joia] }
      - { es: "Você quer alguma coisa? — Não, não quero nada.", en: "Do you want anything? — No, I don't want anything.", altEs: ["Você quer algo? — Não, não quero nada."], grammar: [g.indefinite-pronouns], vocab: [w.algo, w.nada] }
      - { es: "Nenhum hotel tinha quarto livre.", en: "No hotel had a free room.", altEs: ["Nenhum hotel tinha quarto disponível."], grammar: [g.indefinite-pronouns], vocab: [w.nenhum, w.hotel] }
      - { es: "Pode escolher qualquer pousada: todas são boas.", en: "You can choose any guesthouse: they're all good.", altEs: ["Você pode escolher qualquer pousada: todas são boas."], grammar: [g.indefinite-pronouns], vocab: [w.qualquer, w.pousada, w.escolher] }
      - { es: "Qualquer coisa, me liga.", en: "If anything comes up, call me.", altEs: ["Qualquer coisa, me ligue."], altEn: ["Call me if you need anything."], grammar: [g.indefinite-pronouns], vocab: [w.qualquer, w.ligar] }
      - { es: "Em Curitiba, no inverno, você vai precisar de luvas e cachecol.", en: "In Curitiba, in winter, you'll need gloves and a scarf.", altEs: ["No inverno, em Curitiba, você vai precisar de luvas e de cachecol."], grammar: [g.precisar-de], vocab: [w.luva, w.cachecol, w.precisar] }
      - { es: "Esqueci o cinto em algum lugar do hotel.", en: "I left my belt somewhere in the hotel.", altEs: ["Esqueci meu cinto em algum lugar do hotel."], grammar: [g.indefinite-pronouns], vocab: [w.cinto, w.esquecer] }
      - { es: "Tinha várias coisas no meu bolso, mas nenhuma era a chave.", en: "There were several things in my pocket, but none of them was the key.", altEs: ["Havia várias coisas no meu bolso, mas nenhuma era a chave."], grammar: [g.indefinite-pronouns], vocab: [w.vários, w.bolso, w.nenhum] }
      - { es: "A gente acabou de jantar. Quer alguma coisa?", en: "We've just had dinner. Would you like anything?", altEs: ["Nós acabamos de jantar. Quer alguma coisa?"], grammar: [g.acabar-de, g.indefinite-pronouns], vocab: [w.acabar, w.jantar], transform: { instruction: "Change to 'I'", answer: "Acabei de jantar. Quer alguma coisa?", alt: ["Eu acabei de jantar. Quer alguma coisa?"], en: "I've just had dinner. Would you like anything?" } }
      - { es: "Ia sair, mas acabei dormindo.", en: "I was going to go out, but I ended up falling asleep.", altEs: ["Eu ia sair, mas acabei dormindo."], grammar: [g.acabar-de], vocab: [w.acabar, w.dormir], note: "acabar + gerund = to end up doing. Portugal: acabei por adormecer." }
    exchanges:
      - q: { es: "Você já está aqui?", en: "Are you here already?" }
        a: { es: "Acabei de chegar! Cadê você?", en: "I've just arrived! Where are you?" }
        alt: ["Ainda não.", "Tô chegando.", "Acabei de chegar."]
        grammar: [g.acabar-de]
        vocab: [w.acabar]
      - q: { es: "Tem alguém em casa?", en: "Is anyone home?" }
        a: { es: "Não, não tem ninguém.", en: "No, there's nobody." }
        alt: ["Tem, sim.", "Ninguém.", "Não tem ninguém."]
        grammar: [g.indefinite-pronouns]
        vocab: [w.ninguém, w.alguém]
      - q: { es: "Você quer comprar alguma coisa?", en: "Would you like to buy anything?" }
        a: { es: "Quero uns brincos para a minha irmã.", en: "I'd like some earrings for my sister." }
        alt: ["Não, nada.", "Só estou olhando.", "Quero, sim."]
        grammar: [g.indefinite-pronouns]
        vocab: [w.brinco]
      - q: { es: "Qual pulseira você prefere?", en: "Which bracelet do you prefer?" }
        a: { es: "Qualquer uma: todas são lindas!", en: "Any of them: they're all lovely!" }
        alt: ["Esta aqui.", "Nenhuma.", "A de prata."]
        grammar: [g.indefinite-pronouns]
        vocab: [w.qualquer, w.pulseira]
      - q: { es: "Você viu o meu cachecol?", en: "Have you seen my scarf?" }
        a: { es: "Não vi nenhum cachecol aqui.", en: "I haven't seen any scarf here." }
        alt: ["Está no seu bolso!", "Não vi.", "Vi, está na cadeira."]
        grammar: [g.indefinite-pronouns]
        vocab: [w.nenhum, w.cachecol]
    texts:
      - title: "Mensagem para a pousada"
        es: ["Acabei de sair da pousada.", "Esqueci algo: o meu anel está em cima da cama?", "Se alguém achar, me avisa, por favor!"]
        en: ["I've just left the guesthouse.", "I forgot something: is my ring on the bed?", "If anyone finds it, let me know, please!"]
        grammar: [g.acabar-de, g.indefinite-pronouns]
        vocab: [w.acabar, w.algo, w.anel]
      - title: "Na loja de joias"
        es: ["Entrei numa loja de joias em Paraty.", "Tinha vários colares e pulseiras, todos de prata.", "Não comprei nada, mas acabei saindo com um brinco de presente!"]
        en: ["I went into a jewellery shop in Paraty.", "There were several necklaces and bracelets, all made of silver.", "I didn't buy anything, but I ended up leaving with an earring as a gift!"]
        grammar: [g.indefinite-pronouns, g.acabar-de]
        vocab: [w.joia, w.vários, w.colar, w.pulseira]
    spicy:
      - { es: "Acabei de te ver e já quero o seu número.", en: "I've only just seen you and I already want your number.", altEs: ["Acabei de ver você e já quero o seu número."], grammar: [g.acabar-de], vocab: [w.acabar, w.número] }
      - { es: "Não preciso de nenhuma joia: tenho você.", en: "I don't need any jewellery: I have you.", grammar: [g.indefinite-pronouns], vocab: [w.nenhum, w.joia] }
      - { es: "Qualquer coisa, me liga. Mesmo se não for nada.", en: "If anything comes up, call me. Even if it's nothing.", grammar: [g.indefinite-pronouns], vocab: [w.qualquer, w.ligar] }
      - { es: "Ninguém dança como você... e eu já vi muita gente dançar.", en: "Nobody dances like you... and I've seen a lot of people dance.", grammar: [g.indefinite-pronouns, g.ja-ainda-nao], vocab: [w.ninguém, w.dançar] }
      - { es: "Esse anel no seu dedo é de alguém, ou ainda posso sonhar?", en: "Is that ring on your finger from someone, or can I still dream?", altEs: ["Esse anel no seu dedo é de alguém ou eu ainda posso sonhar?"], grammar: [g.indefinite-pronouns], vocab: [w.anel, w.dedo, w.sonhar] }
dialogues:
  - id: a2.u06.d1
    title: Tudo pronto em Paraty
    context: Bruna has just arrived at a guesthouse in Paraty, where her friend Igor is waiting.
    lines:
      - { speaker: Igor, es: "Bruna! Você acabou de chegar?", en: "Bruna! Have you just arrived?" }
      - { speaker: Bruna, es: "Acabei! Que cidade linda! Você já conhecia Paraty?", en: "I have! What a beautiful town! Did you already know Paraty?" }
      - { speaker: Igor, es: "Já. É a terceira vez que eu venho. Ultimamente tenho viajado muito.", en: "Yes. This is the third time I've come. I've been travelling a lot lately." }
      - { speaker: Bruna, es: "Que sorte! Eu quase nunca viajo.", en: "Lucky you! I hardly ever travel." }
      - { speaker: Igor, es: "Você já foi a Curitiba? Fui no mês passado e vi várias capivaras no parque.", en: "Have you ever been to Curitiba? I went last month and saw several capybaras in the park." }
      - { speaker: Bruna, es: "Ainda não. Mas já comi pinhão!", en: "Not yet. But I have eaten pinhão!" }
      - { speaker: Igor, es: "E o passeio de barco? Já está reservado?", en: "And the boat trip? Is it booked yet?" }
      - { speaker: Bruna, es: "Está tudo reservado e pago. O barco sai amanhã às dez.", en: "Everything's booked and paid. The boat leaves tomorrow at ten." }
      - { speaker: Igor, es: "Ótimo. Então hoje a gente pode andar pelo centro histórico.", en: "Great. Then today we can walk around the historic centre." }
      - { speaker: Bruna, es: "Bora! Ah, não... cadê o meu brinco? Alguém viu um brinco de prata?", en: "Let's go! Oh no... where's my earring? Has anyone seen a silver earring?" }
      - { speaker: Igor, es: "Está no seu bolso, Bruna!", en: "It's in your pocket, Bruna!" }
    questions:
      - { q: "É a primeira vez do Igor em Paraty?", options: ["Sim, é a primeira", "Não, é a terceira", "Não, é a segunda"], answer: 1, explain: "É a terceira vez que eu venho." }
      - { q: "O que o Igor viu em Curitiba?", options: ["Capivaras", "Um barco", "A praia"], answer: 0, explain: "Vi várias capivaras no parque." }
      - { q: "A que horas sai o barco amanhã?", options: ["Às oito", "Às dez", "Ao meio-dia"], answer: 1, explain: "O barco sai amanhã às dez." }
      - { q: "Onde estava o brinco da Bruna?", options: ["Na pousada", "No bolso dela", "No barco"], answer: 1, explain: "Está no seu bolso, Bruna!" }
