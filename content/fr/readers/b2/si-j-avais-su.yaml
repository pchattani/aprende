id: r.b2.si-j-avais-su
level: b2
title: "La Fête des Lumières : si j'avais su"
kind: text
intro: Antoine tells the story of an 8th of December in Lyon – the night of candles in the windows – and of a meeting that almost didn't happen. Notice the past conditional and si + plus-que-parfait (si j'avais su, je serais venu…).
allow: [antoine, élise, fabisch, ok, centre]
paragraphs:
  - { es: "Chaque année, le 8 décembre, les Lyonnais posent sur le rebord de leurs fenêtres de petites bougies dans des verres colorés, les lumignons. La tradition remonte à 1852. Cette année-là, on devait inaugurer une statue dorée de la Vierge en haut de la chapelle de Fourvière, sur la colline qui domine la ville. Mais le jour même, il pleuvait à verse, et les organisateurs ont décidé d'annuler les feux d'artifice. Le soir, le ciel s'est dégagé, et les habitants, déçus mais heureux, ont spontanément allumé des bougies à leurs fenêtres. Toute la ville s'est illuminée. Si la pluie n'avait pas annulé la fête officielle, cette tradition n'aurait peut-être jamais existé.", en: "Every year on the 8th of December, the people of Lyon put little candles in coloured glasses, the lumignons, on their windowsills. The tradition goes back to 1852. That year a golden statue of the Virgin was to be inaugurated at the top of the Fourvière chapel, on the hill overlooking the city. But on the day itself it was pouring with rain, and the organisers decided to cancel the fireworks. In the evening the sky cleared, and the residents, disappointed but happy, spontaneously lit candles in their windows. The whole city lit up. If the rain hadn't cancelled the official celebration, this tradition might never have existed." }
  - { es: "Aujourd'hui, la Fête des Lumières dure quatre jours. Des artistes du monde entier projettent des images sur les façades, les places et les monuments, et des millions de visiteurs envahissent les rues. Moi, qui suis né à Lyon, j'avais fini par l'éviter. Trop de monde, trop de bruit. Il y a trois ans, pourtant, mon amie Élise m'a convaincu de l'accompagner place des Terreaux.", en: "Today the Festival of Lights lasts four days. Artists from all over the world project images onto façades, squares and monuments, and millions of visitors flood the streets. I was born in Lyon, and I had ended up avoiding it. Too many people, too much noise. Three years ago, though, my friend Élise convinced me to go with her to the Place des Terreaux." }
  - { es: "Nous avions rendez-vous à huit heures devant la fontaine. J'étais en retard, évidemment. Le métro était bondé, et quand je suis enfin arrivé, il y avait une telle foule que je n'arrivais même plus à avancer. Mon téléphone n'avait plus de batterie. J'ai cherché Élise pendant une heure, en vain. Si j'avais su, je serais parti plus tôt. J'aurais dû recharger mon téléphone. J'aurais pu, au moins, lui proposer un endroit plus facile à trouver.", en: "We had arranged to meet at eight in front of the fountain. I was late, of course. The metro was packed, and when I finally arrived there was such a crowd that I couldn't even move forward. My phone's battery was dead. I looked for Élise for an hour, in vain. If I'd known, I'd have left earlier. I should have charged my phone. I could at least have suggested a place that was easier to find." }
  - { es: "Découragé, j'ai décidé de rentrer à pied, par les petites rues des pentes de la Croix-Rousse, loin des grandes installations. Et c'est là que j'ai vu le vrai spectacle. Dans ces rues calmes, il n'y avait ni projecteurs ni musique, seulement des centaines de lumignons qui brillaient aux fenêtres, comme en 1852. Des familles étaient au balcon. Une vieille dame m'a offert un verre de vin chaud. J'ai eu l'impression de redécouvrir ma propre ville.", en: "Discouraged, I decided to walk home through the little streets on the slopes of the Croix-Rousse, away from the big installations. And that's where I saw the real show. In those quiet streets there were no spotlights and no music, just hundreds of lumignons shining in the windows, as in 1852. Families were out on their balconies. An old lady offered me a glass of mulled wine. I felt as if I was rediscovering my own city." }
  - { es: "Au coin d'une rue, devant une fenêtre pleine de bougies, quelqu'un m'a appelé. C'était Élise. Elle aussi avait fui la foule, et elle aussi avait eu l'idée de rentrer par les pentes. « Si tu étais arrivé à l'heure, m'a-t-elle dit en riant, on aurait vu les projections et on n'aurait jamais vu ça. »", en: "On a street corner, in front of a window full of candles, someone called my name. It was Élise. She too had fled the crowd, and she too had had the idea of going home by the slopes. 'If you'd arrived on time,' she said, laughing, 'we'd have seen the projections and we'd never have seen this.'" }
  - { es: "Nous avons marché ensemble jusqu'à minuit. Depuis, nous ne nous sommes plus quittés. L'an dernier, nous nous sommes mariés, et le 8 décembre, nous posons nos lumignons sur le rebord de notre fenêtre, comme tous les Lyonnais. Parfois, je me demande ce qui se serait passé si mon téléphone avait eu de la batterie ce soir-là. Nous aurions sans doute passé une soirée agréable dans la foule, puis chacun serait rentré chez soi. Comme en 1852, c'est un contretemps qui a tout illuminé.", en: "We walked together until midnight. Since then we haven't been apart. Last year we got married, and on the 8th of December we put our lumignons on our windowsill, like everyone in Lyon. Sometimes I wonder what would have happened if my phone had had battery that evening. We would probably have spent a pleasant evening in the crowd, then each gone home. As in 1852, it was a setback that lit everything up." }
questions:
  - { q: "Pourquoi les Lyonnais ont-ils allumé des bougies en 1852 ?", options: ["Parce que l'électricité était coupée", "Parce que la fête officielle avait été annulée à cause de la pluie", "Pour fêter Noël"], answer: 1, explain: "The fireworks were cancelled because of the rain; when the sky cleared, residents spontaneously lit candles." }
  - { q: "Pourquoi Antoine évitait-il la Fête des Lumières ?", options: ["Il n'aimait pas la foule et le bruit", "Il travaillait ce jour-là", "Il n'habitait plus à Lyon"], answer: 0, explain: "«Trop de monde, trop de bruit.»" }
  - { q: "Qu'est-ce qu'Antoine regrette ce soir-là ?", options: ["D'être parti trop tôt", "De ne pas avoir rechargé son téléphone et d'être parti trop tard", "D'avoir bu du vin chaud"], answer: 1, explain: "«Si j'avais su, je serais parti plus tôt. J'aurais dû recharger mon téléphone.»" }
  - { q: "Où Antoine a-t-il vu « le vrai spectacle » ?", options: ["Place des Terreaux", "Dans les petites rues calmes des pentes de la Croix-Rousse", "À Fourvière"], answer: 1, explain: "In the quiet streets there were only «des centaines de lumignons qui brillaient aux fenêtres»." }
  - { q: "« Si tu étais arrivé à l'heure, on aurait vu les projections. » Quel est le sens de cette phrase ?", options: ["Il est arrivé à l'heure", "Il n'est pas arrivé à l'heure, donc ils n'ont pas vu les projections", "Ils vont voir les projections demain"], answer: 1, explain: "Si + plus-que-parfait + conditionnel passé describes an unreal past: he wasn't on time, so it didn't happen." }
