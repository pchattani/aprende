id: c2.u02
title: "Estou a aprender"
lessons:
  - id: c2.u02.l1
    title: Estou a beber uma bica
    teach: [g.ep-estar-a-infinitive]
    vocab: [w.estar-a, w.bica, w.galão, w.meia-de-leite, w.imperial, w.fino, w.sumo, w.ginjinha, w.pastel-de-nata, w.nata, w.pastelaria, w.chávena, w.ementa, w.empregado-de-mesa, w.tosta-mista, w.sandes, w.fiambre, w.bolacha, w.gelado.n, w.ananás, w.rebuçado, w.pistácio]
    tip: "Portugal says estou a fazer where Brazil says estou fazendo: estar + a + infinitive, never a + gerund."
    sentences:
      - { es: "Estou a beber uma bica numa esplanada em Belém.", en: "I'm having an espresso at a café terrace in Belém.", altEs: ["Estou a tomar uma bica numa esplanada em Belém.", "Estou a beber uma bica numa esplanada de Belém.", "Estou tomando um cafezinho numa mesa ao ar livre em Belém."], altEn: ["I'm drinking an espresso on a terrace in Belém."], grammar: [g.ep-estar-a-infinitive], vocab: [w.estar-a, w.bica, w.esplanada] }
      - { es: "Estão a fazer fila há meia hora para comprar pastéis de nata.", en: "They've been queuing for half an hour to buy custard tarts.", altEs: ["Estão na fila há meia hora para comprar pastéis de nata.", "Estão a fazer fila há meia hora para comprarem pastéis de nata.", "Estão fazendo fila há meia hora para comprar pastéis de nata."], altEn: ["They've been standing in line for half an hour to buy custard tarts."], grammar: [g.ep-estar-a-infinitive, g.ha-faz-time], vocab: [w.estar-a, w.pastel-de-nata, w.nata] }
      - { es: "Quando chegámos à pastelaria, ainda estavam a tirar os pastéis do forno.", en: "When we got to the pastry shop, they were still taking the tarts out of the oven.", altEs: ["Quando chegámos à pastelaria, os pastéis ainda estavam a sair do forno.", "Quando chegamos na confeitaria, ainda estavam tirando os pastéis do forno."], grammar: [g.ep-estar-a-infinitive, g.estar-gerund-past], vocab: [w.pastelaria] }
      - { es: "Estou a pensar pedir um galão e uma tosta mista.", en: "I'm thinking of ordering a milky coffee and a toasted ham and cheese sandwich.", altEs: ["Estou a pensar em pedir um galão e uma tosta mista.", "Estou a pensar pedir uma tosta mista e um galão.", "Estou pensando em pedir um café com leite e um misto-quente."], grammar: [g.ep-estar-a-infinitive], vocab: [w.galão, w.tosta-mista] }
      - { es: "O empregado de mesa está a trazer a ementa.", en: "The waiter is bringing the menu.", altEs: ["O empregado está a trazer a ementa.", "O empregado de mesa está a trazer-nos a ementa.", "O garçom está trazendo o cardápio."], grammar: [g.ep-estar-a-infinitive], vocab: [w.empregado-de-mesa, w.ementa], transform: { instruction: "Put it in the past: 'was bringing'", answer: "O empregado de mesa estava a trazer a ementa.", alt: ["O empregado estava a trazer a ementa."] } }
      - { es: "Estás a ouvir-me ou estás a olhar para os gelados?", en: "Are you listening to me or are you looking at the ice creams?", altEs: ["Estás-me a ouvir ou estás a olhar para os gelados?", "Estás a ouvir-me ou a olhar para os gelados?", "Você está me ouvindo ou está olhando pros sorvetes?"], grammar: [g.ep-estar-a-infinitive, g.ep-enclisis], vocab: [w.gelado.n] }
      - { es: "Os miúdos estão a escolher um gelado de pistácio e outro de ananás.", en: "The kids are choosing a pistachio ice cream and a pineapple one.", altEs: ["Os miúdos estão a escolher um gelado de pistácio e um de ananás.", "Os miúdos estão a escolher entre um gelado de pistácio e um de ananás.", "As crianças estão escolhendo um sorvete de pistache e outro de abacaxi."], grammar: [g.ep-estar-a-infinitive], vocab: [w.gelado.n, w.pistácio, w.ananás, w.miúdo] }
      - { es: "Não estou a perceber: um galão não é o mesmo que uma meia de leite?", en: "I don't get it: isn't a galão the same as a meia de leite?", altEs: ["Não estou a perceber; um galão não é o mesmo que uma meia de leite?", "Não estou a perceber: um galão e uma meia de leite não são a mesma coisa?", "Não estou entendendo: um galão não é a mesma coisa que uma meia de leite?"], grammar: [g.ep-estar-a-infinitive], vocab: [w.galão, w.meia-de-leite], note: "A galão comes in a tall glass with more milk; a meia de leite is half coffee, half milk, in a cup.", error: { wrong: "Não estou a percebendo: um galão não é o mesmo que uma meia de leite?", explain: "Estar a takes the infinitive (a perceber), never the gerund.", grammar: g.ep-estar-a-infinitive } }
      - { es: "A minha avó estava a beber chá numa chávena de porcelana.", en: "My grandmother was drinking tea from a porcelain cup.", altEs: ["A avó estava a beber chá numa chávena de porcelana.", "A minha avó estava a tomar chá numa chávena de porcelana.", "Minha avó estava tomando chá numa xícara de porcelana."], grammar: [g.ep-estar-a-infinitive, g.ep-articles-names-possessives], vocab: [w.chávena] }
      - { es: "No Porto pede-se um fino; em Lisboa, uma imperial.", en: "In Porto you ask for a fino; in Lisbon, an imperial.", altEs: ["No Porto pedes um fino e em Lisboa uma imperial.", "No Porto pede-se um fino e em Lisboa, uma imperial.", "No Porto se pede um fino; em Lisboa, uma imperial; no Brasil, um chope."], altEn: ["In Porto you order a fino; in Lisbon, an imperial."], grammar: [g.se-passive, g.ep-enclisis], vocab: [w.fino, w.imperial], note: "Both are a small glass of draught beer: Brazil calls it um chope." }
      - { es: "Estávamos a acabar o sumo de laranja quando começou a chover.", en: "We were finishing our orange juice when it started raining.", altEs: ["Estávamos a acabar o sumo quando começou a chover.", "Estávamos a beber o sumo de laranja quando começou a chover.", "Estávamos terminando o suco de laranja quando começou a chover."], grammar: [g.ep-estar-a-infinitive, g.preterite-vs-imperfect], vocab: [w.sumo], transform: { instruction: "Say it the Brazilian way (estar + gerund)", answer: "Estávamos acabando o sumo de laranja quando começou a chover.", alt: ["Estávamos terminando o suco de laranja quando começou a chover.", "A gente estava acabando o suco de laranja quando começou a chover.", "Estávamos acabando o suco de laranja quando começou a chover."] } }
      - { es: "Esta ginjinha está a saber-me pela vida!", en: "This ginjinha is going down a treat!", altEs: ["Esta ginjinha sabe-me pela vida!", "Esta ginjinha está-me a saber pela vida!", "Essa ginjinha está uma delícia!"], grammar: [g.ep-estar-a-infinitive, g.ep-enclisis], vocab: [w.ginjinha], note: "Saber a = to taste of; saber pela vida = to taste wonderful (Portugal)." }
      - { es: "O que é que estás a fazer com essa bolacha? Isso é para o cão!", en: "What are you doing with that biscuit? That's for the dog!", altEs: ["Que estás a fazer com essa bolacha? Isso é para o cão!", "O que estás a fazer com essa bolacha? É para o cão!", "O que você está fazendo com esse biscoito? Isso é pro cachorro!"], altEn: ["What are you doing with that cookie? It's for the dog!"], grammar: [g.ep-estar-a-infinitive, g.ep-tu-forms], vocab: [w.bolacha] }
      - { es: "Está-me a apetecer uma sandes de fiambre.", en: "I'm fancying a ham sandwich.", altEs: ["Apetece-me uma sandes de fiambre.", "Está a apetecer-me uma sandes de fiambre.", "Estou com vontade de comer um sanduíche de presunto."], altEn: ["I feel like a ham sandwich."], grammar: [g.ep-estar-a-infinitive, g.ep-enclisis], vocab: [w.sandes, w.fiambre, w.apetecer] }
      - { es: "Não estejas a comer rebuçados antes do almoço.", en: "Don't go eating sweets before lunch.", altEs: ["Não comas rebuçados antes do almoço.", "Não estejas a comer rebuçados antes de almoço.", "Não fica comendo bala antes do almoço."], altEn: ["Don't be eating candy before lunch."], grammar: [g.ep-estar-a-infinitive, g.ep-imperative-tu], vocab: [w.rebuçado] }
    exchanges:
      - q: { es: "O que estás a fazer?", en: "What are you doing?" }
        a: { es: "Estou a fazer fila para os pastéis de Belém.", en: "I'm queuing for the pastéis de Belém." }
        alt: ["Estou na fila dos pastéis.", "Nada de especial, estou a descansar."]
        grammar: [g.ep-estar-a-infinitive]
        vocab: [w.estar-a, w.pastel-de-nata]
      - q: { es: "O que vai ser?", en: "What will it be?" }
        a: { es: "Uma meia de leite e uma tosta mista, se faz favor.", en: "A white coffee and a toasted ham and cheese sandwich, please." }
        alt: ["Um galão, se faz favor.", "Para mim, uma bica."]
        grammar: [g.ep-forms-of-address, g.polite-requests]
        vocab: [w.meia-de-leite, w.tosta-mista, w.galão, w.bica]
      - q: { es: "Estás-me a ouvir?", en: "Are you listening to me?" }
        a: { es: "Desculpa, estava a ver os barcos no rio.", en: "Sorry, I was watching the boats on the river." }
        alt: ["Estou, estou.", "Diz outra vez, que não ouvi."]
        grammar: [g.ep-estar-a-infinitive]
        vocab: [w.estar-a]
      - q: { es: "Queres mais alguma coisa da pastelaria?", en: "Do you want anything else from the pastry shop?" }
        a: { es: "Traz-me um sumo de ananás, se faz favor.", en: "Bring me a pineapple juice, please." }
        alt: ["Não, obrigado.", "Só mais um pastel de nata."]
        grammar: [g.ep-imperative-tu, g.ep-enclisis]
        vocab: [w.pastelaria, w.sumo, w.ananás]
      - q: { es: "Onde estão os miúdos?", en: "Where are the kids?" }
        a: { es: "Estão a comer gelado no jardim.", en: "They're eating ice cream in the garden." }
        alt: ["Estão no jardim a brincar.", "Estão ali a ver os barcos."]
        grammar: [g.ep-estar-a-infinitive]
        vocab: [w.gelado.n, w.miúdo]
    texts:
      - title: "Mensagem do Gonçalo"
        es: ["Estou a chegar a Belém de elétrico.", "A fila da pastelaria já está enorme.", "Guarda-me um lugar na esplanada, se faz favor!"]
        en: ["I'm getting to Belém by tram.", "The queue at the pastry shop is already huge.", "Save me a seat on the terrace, please!"]
        grammar: [g.ep-estar-a-infinitive, g.ep-imperative-tu]
        vocab: [w.pastelaria, w.elétrico, w.esplanada]
      - title: "Postal de Belém"
        es: ["Estou sentada à beira do Tejo a comer o meu terceiro pastel de nata.", "Daqui vejo a Torre de Belém e os turistas a tirar fotografias.", "Ninguém me tira daqui!"]
        en: ["I'm sitting by the Tagus eating my third custard tart.", "From here I can see the Belém Tower and the tourists taking photos.", "Nobody's getting me out of here!"]
        grammar: [g.ep-estar-a-infinitive, g.ep-articles-names-possessives]
        vocab: [w.pastel-de-nata]
    spicy:
      - { es: "Estás a olhar para mim ou para o meu pastel de nata?", en: "Are you looking at me or at my custard tart?", altEs: ["Estás a olhar para mim ou para o meu pastel?", "Você está olhando pra mim ou pro meu pastel de nata?"], grammar: [g.ep-estar-a-infinitive, g.ep-articles-names-possessives], vocab: [w.pastel-de-nata] }
      - { es: "Estava a pensar em ti e, de repente, apareceste na pastelaria.", en: "I was thinking about you and suddenly you turned up at the pastry shop.", altEs: ["Estava a pensar em ti e de repente apareceste na pastelaria.", "Eu estava pensando em você e, de repente, você apareceu na confeitaria."], grammar: [g.ep-estar-a-infinitive, g.ep-tu-forms], vocab: [w.pastelaria] }
      - { es: "Não estou a convidar-te para sair; estou só a oferecer-te metade da minha tosta.", en: "I'm not asking you out; I'm just offering you half my toastie.", altEs: ["Não te estou a convidar para sair; estou só a oferecer-te metade da minha tosta.", "Não estou te convidando pra sair; só estou te oferecendo metade do meu misto-quente."], grammar: [g.ep-estar-a-infinitive, g.ep-enclisis], vocab: [w.tosta-mista] }
      - { es: "O empregado de mesa está a sorrir-te há dez minutos; pede-lhe o número.", en: "The waiter has been smiling at you for ten minutes; ask him for his number.", altEs: ["O empregado está a sorrir-te há dez minutos; pede-lhe o número.", "O garçom está sorrindo pra você há dez minutos; pede o número dele."], grammar: [g.ep-estar-a-infinitive, g.ep-imperative-tu], vocab: [w.empregado-de-mesa] }
      - { es: "Estás a corar? É do sol ou é da ginjinha?", en: "Are you blushing? Is it the sun or the ginjinha?", altEs: ["Estás a ficar vermelho? É do sol ou é da ginjinha?", "Você está ficando vermelha? É do sol ou da ginjinha?"], grammar: [g.ep-estar-a-infinitive], vocab: [w.ginjinha, w.corar] }
  - id: c2.u02.l2
    title: Ando a comer bem demais
    teach: [g.ep-aspect-periphrases]
    vocab: [w.andar-a, w.francesinha, w.bifana, w.bacalhau, w.sardinha, w.caldo-verde, w.arroz-de-pato, w.vinho-verde, w.vinho-do-porto, w.talho, w.mercearia, w.drogaria, w.quiosque, w.papelaria, w.tabacaria, w.pronto-a-vestir, w.montra, w.saldos, w.talão, w.multibanco, w.cêntimo, w.cheque, w.levantar-dinheiro]
    tip: "andar a = lately, ficar a = stay doing, pôr-se a = suddenly start, acabar por = end up, estar à espera de = be waiting for."
    sentences:
      - { es: "Ando a comer bacalhau todos os dias; já perdi a conta às receitas.", en: "I've been eating salt cod every day; I've lost count of the recipes.", altEs: ["Ando a comer bacalhau todos os dias, já perdi a conta às receitas.", "Ando a comer bacalhau todos os dias e já perdi a conta às receitas.", "Ando comendo bacalhau todo dia; já perdi a conta das receitas."], grammar: [g.ep-aspect-periphrases], vocab: [w.andar-a, w.bacalhau], note: "They say there is a bacalhau recipe for every day of the year." }
      - { es: "Ficámos a ver o pôr do sol no Padrão dos Descobrimentos.", en: "We stayed and watched the sunset at the Monument to the Discoveries.", altEs: ["Ficámos a ver o pôr do sol junto ao Padrão dos Descobrimentos.", "Ficámos no Padrão dos Descobrimentos a ver o pôr do sol.", "Ficamos vendo o pôr do sol no Padrão dos Descobrimentos."], grammar: [g.ep-aspect-periphrases] }
      - { es: "De repente, o miúdo pôs-se a chorar porque o gelado caiu ao chão.", en: "Suddenly the kid burst into tears because his ice cream fell on the ground.", altEs: ["De repente, o miúdo pôs-se a chorar porque o gelado lhe caiu ao chão.", "De repente o miúdo pôs-se a chorar, porque o gelado caiu ao chão.", "De repente, o menino começou a chorar porque o sorvete caiu no chão."], grammar: [g.ep-aspect-periphrases, g.ep-enclisis], vocab: [w.miúdo, w.gelado.n], error: { wrong: "De repente, o miúdo pôs-se chorar porque o gelado caiu ao chão.", explain: "Pôr-se needs a before the infinitive: pôs-se a chorar.", grammar: g.ep-aspect-periphrases } }
      - { es: "Continua a chover, por isso acabámos por almoçar caldo verde na tasca.", en: "It's still raining, so we ended up having caldo verde for lunch at the tasca.", altEs: ["Continua a chover, portanto acabámos por almoçar caldo verde na tasca.", "Como continua a chover, acabámos por almoçar caldo verde na tasca.", "Continua chovendo, então acabamos almoçando caldo verde no boteco."], grammar: [g.ep-aspect-periphrases], vocab: [w.caldo-verde, w.tasca] }
      - { es: "Estou à espera do elétrico 15 há vinte minutos.", en: "I've been waiting for the number 15 tram for twenty minutes.", altEs: ["Estou à espera do 15 há vinte minutos.", "Há vinte minutos que estou à espera do elétrico 15.", "Estou esperando o bonde 15 há vinte minutos."], grammar: [g.ep-aspect-periphrases, g.ha-faz-time], vocab: [w.elétrico], transform: { instruction: "Say it the Brazilian way", answer: "Estou esperando o bonde 15 há vinte minutos.", alt: ["Estou esperando o elétrico 15 há vinte minutos.", "Faz vinte minutos que estou esperando o bonde 15."] } }
      - { es: "A francesinha é do Porto, mas ando a vê-la cada vez mais em Lisboa.", en: "The francesinha is from Porto, but I've been seeing it more and more in Lisbon.", altEs: ["A francesinha é do Porto, mas ando a ver cada vez mais francesinhas em Lisboa.", "A francesinha é do Porto, mas ando vendo cada vez mais em Lisboa."], grammar: [g.ep-aspect-periphrases, g.ep-enclisis], vocab: [w.francesinha, w.andar-a] }
      - { es: "Deixei de comer carne, mas uma bifana de vez em quando não conta.", en: "I've stopped eating meat, but a bifana now and then doesn't count.", altEs: ["Deixei de comer carne, mas uma bifana de vez em quando não faz mal.", "Deixei de comer carne; uma bifana de vez em quando não conta.", "Parei de comer carne, mas uma bifana de vez em quando não conta."], grammar: [g.ep-aspect-periphrases, g.verbal-periphrases], vocab: [w.bifana] }
      - { es: "Estou prestes a sair: precisas de alguma coisa da mercearia?", en: "I'm about to go out: do you need anything from the grocer's?", altEs: ["Estou prestes a sair; precisas de alguma coisa da mercearia?", "Estou quase a sair: precisas de alguma coisa da mercearia?", "Estou para sair: você precisa de alguma coisa do mercadinho?"], grammar: [g.ep-aspect-periphrases, g.ep-tu-forms], vocab: [w.mercearia] }
      - { es: "Passa pelo talho e traz um pato para o arroz de pato.", en: "Stop by the butcher's and bring a duck for the duck rice.", altEs: ["Passa no talho e traz um pato para o arroz de pato.", "Passa pelo talho e compra um pato para o arroz de pato.", "Passa no açougue e traz um pato pro arroz de pato."], grammar: [g.ep-imperative-tu], vocab: [w.talho, w.arroz-de-pato] }
      - { es: "Andamos a ver montras há duas horas e ainda não comprámos nada.", en: "We've been window-shopping for two hours and we still haven't bought anything.", altEs: ["Andamos a ver as montras há duas horas e ainda não comprámos nada.", "Há duas horas que andamos a ver montras e ainda não comprámos nada.", "A gente está olhando vitrines há duas horas e ainda não comprou nada."], grammar: [g.ep-aspect-periphrases, g.ha-faz-time], vocab: [w.montra, w.andar-a] }
      - { es: "Nos saldos de janeiro, o pronto-a-vestir da esquina fica cheio.", en: "In the January sales, the clothes shop on the corner gets packed.", altEs: ["Nos saldos de janeiro, a loja de roupa da esquina fica cheia.", "Durante os saldos de janeiro, o pronto-a-vestir da esquina fica cheio.", "Na liquidação de janeiro, a loja de roupa da esquina fica lotada."], grammar: [g.ficar-change-of-state], vocab: [w.saldos, w.pronto-a-vestir] }
      - { es: "Acabei por pagar com o multibanco, porque já não aceitam cheques.", en: "I ended up paying by card, because they don't take cheques any more.", altEs: ["Acabei por pagar com multibanco, porque já não aceitam cheques.", "Acabei por pagar com cartão, porque já não aceitam cheques.", "Acabei pagando com cartão de débito, porque não aceitam mais cheque."], grammar: [g.ep-aspect-periphrases], vocab: [w.multibanco, w.cheque], transform: { instruction: "Say it the Brazilian way", answer: "Acabei pagando com cartão, porque já não aceitam cheques.", alt: ["Acabei pagando com cartão de débito, porque não aceitam mais cheque.", "Acabei pagando com cartão, porque não aceitam mais cheques."] } }
      - { es: "Tenho de levantar dinheiro: o quiosque só aceita notas e moedas.", en: "I need to get some cash out: the kiosk only takes notes and coins.", altEs: ["Tenho de levantar dinheiro, que o quiosque só aceita notas e moedas.", "Preciso de levantar dinheiro: o quiosque só aceita dinheiro.", "Preciso sacar dinheiro: a banca só aceita dinheiro vivo."], grammar: [g.ter-que], vocab: [w.levantar-dinheiro, w.quiosque] }
      - { es: "Guarda o talão, que tu andas sempre a perder os recibos.", en: "Keep the receipt, you're always losing receipts.", altEs: ["Guarda o talão, que andas sempre a perder os recibos.", "Guarda o talão; andas sempre a perder os recibos.", "Guarda o comprovante, que você vive perdendo os recibos."], grammar: [g.ep-aspect-periphrases, g.ep-imperative-tu], vocab: [w.talão, w.andar-a] }
      - { es: "Na papelaria vendem cadernos; na tabacaria, jornais e selos.", en: "The stationer's sells notebooks; the tobacconist's sells newspapers and stamps.", altEs: ["Na papelaria vendem-se cadernos; na tabacaria, jornais e selos.", "Na papelaria vendem cadernos e na tabacaria, jornais e selos."], grammar: [g.indeterminate-subject], vocab: [w.papelaria, w.tabacaria] }
      - { es: "A drogaria do bairro continua a vender de tudo, de lâmpadas a tachos.", en: "The local hardware shop still sells everything, from light bulbs to pots and pans.", altEs: ["A drogaria do bairro continua a vender um pouco de tudo, de lâmpadas a tachos.", "A loja de ferragens do bairro continua vendendo de tudo, de lâmpada a panela."], grammar: [g.ep-aspect-periphrases], vocab: [w.drogaria] }
    exchanges:
      - q: { es: "O que é que andas a fazer ultimamente?", en: "What have you been up to lately?" }
        a: { es: "Ando a aprender a cozinhar bacalhau à Brás.", en: "I've been learning to cook bacalhau à Brás." }
        alt: ["Ando a trabalhar demais.", "Nada de especial, ando a descansar."]
        grammar: [g.ep-aspect-periphrases]
        vocab: [w.andar-a, w.bacalhau]
      - q: { es: "Branco ou tinto?", en: "White or red?" }
        a: { es: "Um vinho verde bem fresco, se faz favor.", en: "A nicely chilled vinho verde, please." }
        alt: ["Tinto, se faz favor.", "Para mim, um vinho do Porto no fim."]
        grammar: [g.polite-requests]
        vocab: [w.vinho-verde, w.vinho-do-porto]
      - q: { es: "Quanto é?", en: "How much is it?" }
        a: { es: "São dois euros e cinquenta cêntimos.", en: "That's two euros fifty." }
        alt: ["Dois e cinquenta.", "São dois euros e meio."]
        grammar: [g.quanto-custa]
        vocab: [w.cêntimo]
      - q: { es: "Ainda estás à espera do autocarro?", en: "Are you still waiting for the bus?" }
        a: { es: "Estou. Se não vier, acabo por ir a pé.", en: "I am. If it doesn't come, I'll end up walking." }
        alt: ["Já não, apanhei um táxi.", "Estou, e continua a não vir."]
        grammar: [g.ep-aspect-periphrases, g.future-subjunctive-se]
      - q: { es: "Viste aquela montra?", en: "Did you see that shop window?" }
        a: { es: "Vi! Pus-me a olhar e quase perdi o comboio.", en: "I did! I got so caught up looking that I nearly missed the train." }
        alt: ["Vi, mas os saldos só começam amanhã.", "Não, onde?"]
        grammar: [g.ep-aspect-periphrases, g.ep-enclisis]
        vocab: [w.montra, w.saldos]
    texts:
      - title: "Lista de compras"
        es: ["Talho: um frango e um pato.", "Mercearia: azeite, pão e uma garrafa de vinho verde.", "Quiosque: o jornal do avô.", "E não te esqueças de levantar dinheiro!"]
        en: ["Butcher's: a chicken and a duck.", "Grocer's: olive oil, bread and a bottle of vinho verde.", "Kiosk: Grandad's newspaper.", "And don't forget to get some cash out!"]
        grammar: [g.ep-imperative-tu, g.ep-proclisis-attractors]
        vocab: [w.talho, w.mercearia, w.quiosque, w.vinho-verde, w.levantar-dinheiro]
      - title: "Diário de viagem"
        es: ["Ando a dormir pouco e a comer muito.", "Ontem fiquei a ver os barcos no Tejo até escurecer.", "Acabei por jantar sardinhas outra vez e não me arrependo."]
        en: ["I've been sleeping little and eating a lot.", "Yesterday I stayed watching the boats on the Tagus until it got dark.", "I ended up having sardines for dinner again and I don't regret it."]
        grammar: [g.ep-aspect-periphrases]
        vocab: [w.andar-a, w.sardinha]
    spicy:
      - { es: "Ando a pensar em ti mais do que em bacalhau, e isso diz muito.", en: "I've been thinking about you more than about salt cod, and that says a lot.", altEs: ["Ando a pensar mais em ti do que em bacalhau, e isso diz muito.", "Ando pensando mais em você do que em bacalhau, e isso diz muito."], grammar: [g.ep-aspect-periphrases], vocab: [w.andar-a, w.bacalhau] }
      - { es: "Fiquei a olhar para ti tanto tempo que o meu galão arrefeceu.", en: "I kept looking at you for so long that my coffee went cold.", altEs: ["Fiquei tanto tempo a olhar para ti que o galão arrefeceu.", "Fiquei olhando pra você tanto tempo que meu café com leite esfriou."], grammar: [g.ep-aspect-periphrases], vocab: [w.galão, w.arrefecer] }
      - { es: "Pus-me a rir quando me pediste o número em vez da conta.", en: "I burst out laughing when you asked me for my number instead of the bill.", altEs: ["Pus-me a rir quando me pediste o meu número em vez da conta.", "Comecei a rir quando você me pediu o número em vez da conta."], grammar: [g.ep-aspect-periphrases, g.ep-proclisis-attractors] }
      - { es: "Acabei por aceitar o teu convite, mas só por causa da francesinha.", en: "I ended up accepting your invitation, but only because of the francesinha.", altEs: ["Acabei por aceitar o convite, mas só por causa da francesinha.", "Acabei aceitando seu convite, mas só por causa da francesinha."], grammar: [g.ep-aspect-periphrases], vocab: [w.francesinha] }
      - { es: "Estou à tua espera na esplanada; o vinho verde é que não espera.", en: "I'm waiting for you on the terrace; the vinho verde won't wait, though.", altEs: ["Estou à tua espera na esplanada, mas o vinho verde não espera.", "Estou te esperando no café; o vinho verde é que não espera."], grammar: [g.ep-aspect-periphrases, g.emphatic-structures], vocab: [w.vinho-verde, w.esplanada] }
  - id: c2.u02.l3
    title: A minha casa, o meu bairro
    teach: [g.ep-articles-names-possessives]
    vocab: [w.frigorífico, w.casa-de-banho, w.autoclismo, w.sanita, w.lava-loiça, w.loiça, w.esquentador, w.aquecimento, w.estore, w.persiana, w.alcatifa, w.carpete, w.rés-do-chão, w.térreo, w.senhorio, w.arrendar, w.arrendamento, w.assoalhada, w.marquise, w.despensa, w.pequeno.n]
    tip: "In Portugal names and possessives normally take the article: a Marta, o meu senhorio, a tua casa. Leave it out only when calling someone: Marta, anda cá!"
    sentences:
      - { es: "O meu senhorio vive no rés do chão e eu no terceiro andar.", en: "My landlord lives on the ground floor and I'm on the third floor.", altEs: ["O meu senhorio mora no rés do chão e eu no terceiro andar.", "O meu senhorio vive no rés do chão e eu vivo no terceiro andar.", "Meu senhorio mora no térreo e eu no terceiro andar."], grammar: [g.ep-articles-names-possessives], vocab: [w.senhorio, w.rés-do-chão, w.térreo], transform: { instruction: "Say it the Brazilian way, without the article before the possessive", answer: "Meu senhorio mora no térreo e eu no terceiro andar.", alt: ["Meu senhorio vive no rés do chão e eu no terceiro andar.", "Meu senhorio mora no rés do chão e eu no terceiro andar.", "Meu senhorio vive no térreo e eu no terceiro andar."] } }
      - { es: "A minha casa em Belém tem três assoalhadas e uma marquise com vista para o rio.", en: "My flat in Belém has three rooms and an enclosed balcony looking out over the river.", altEs: ["A minha casa em Belém tem três assoalhadas e uma marquise virada para o rio.", "A minha casa, em Belém, tem três assoalhadas e uma marquise com vista para o rio.", "Minha casa em Belém tem três cômodos e uma varanda fechada com vista pro rio."], grammar: [g.ep-articles-names-possessives], vocab: [w.assoalhada, w.marquise], note: "Portuguese flats are described as T1, T2, T3… by the number of bedrooms." }
      - { es: "O esquentador da nossa casa de banho avariou outra vez.", en: "The water heater in our bathroom has broken down again.", altEs: ["O esquentador da casa de banho avariou outra vez.", "O esquentador da nossa casa de banho voltou a avariar.", "O aquecedor do nosso banheiro quebrou de novo."], grammar: [g.ep-articles-names-possessives, g.ep-aspect-periphrases], vocab: [w.esquentador, w.casa-de-banho] }
      - { es: "Liguei ao senhorio, mas o senhor Almeida não atende.", en: "I called the landlord, but Mr Almeida isn't answering.", altEs: ["Liguei ao senhorio, mas o Sr. Almeida não atende.", "Telefonei ao senhorio, mas o senhor Almeida não atende.", "Liguei pro senhorio, mas o seu Almeida não atende."], grammar: [g.ep-articles-names-possessives, g.ep-forms-of-address], vocab: [w.senhorio] }
      - { es: "A Inês está a arrendar um quarto em casa da tia.", en: "Inês is renting a room at her aunt's place.", altEs: ["A Inês arrenda um quarto em casa da tia.", "A Inês está a arrendar um quarto em casa da tia dela.", "Inês está alugando um quarto na casa da tia."], grammar: [g.ep-articles-names-possessives, g.ep-estar-a-infinitive], vocab: [w.arrendar] }
      - { es: "O contrato de arrendamento é de dois anos.", en: "The lease is for two years.", altEs: ["O contrato de arrendamento dura dois anos.", "O arrendamento é por dois anos.", "O contrato de aluguel é de dois anos."], grammar: [g.ser-present], vocab: [w.arrendamento] }
      - { es: "Põe a loiça no lava-loiça; eu lavo-a depois.", en: "Put the dishes in the sink; I'll wash them later.", altEs: ["Põe a loiça no lava-loiça, eu lavo-a depois.", "Põe a loiça no lava-loiça; lavo-a mais logo.", "Coloca a louça na pia; eu lavo depois."], grammar: [g.ep-imperative-tu, g.ep-enclisis], vocab: [w.loiça, w.lava-loiça] }
      - { es: "O frigorífico do meu irmão está sempre vazio.", en: "My brother's fridge is always empty.", altEs: ["O frigorífico do meu irmão está sempre às moscas.", "A geladeira do meu irmão está sempre vazia."], grammar: [g.ep-articles-names-possessives], vocab: [w.frigorífico] }
      - { es: "Baixa o estore, que o sol nos bate na cara a manhã toda.", en: "Lower the blind, the sun's been in our faces all morning.", altEs: ["Baixa a persiana, que o sol nos bate na cara a manhã toda.", "Baixa o estore, que o sol bate-nos na cara a manhã inteira.", "Abaixa a persiana, que o sol bate na nossa cara a manhã toda."], grammar: [g.ep-imperative-tu, g.ep-proclisis-attractors], vocab: [w.estore, w.persiana] }
      - { es: "Os nossos vizinhos ainda têm alcatifa no quarto; nós preferimos madeira.", en: "Our neighbours still have fitted carpet in the bedroom; we prefer wooden floors.", altEs: ["Os vizinhos ainda têm alcatifa no quarto; nós preferimos madeira.", "Os nossos vizinhos ainda têm carpete no quarto; nós preferimos chão de madeira.", "Nossos vizinhos ainda têm carpete no quarto; a gente prefere piso de madeira."], grammar: [g.ep-articles-names-possessives], vocab: [w.alcatifa, w.carpete] }
      - { es: "Sem aquecimento central, o inverno em Lisboa é mais duro do que parece.", en: "Without central heating, winter in Lisbon is harder than it looks.", altEs: ["Sem aquecimento central, o inverno de Lisboa é mais duro do que parece.", "Sem aquecimento central, o inverno em Lisboa é mais duro que parece."], grammar: [g.comparatives], vocab: [w.aquecimento], note: "Many Portuguese homes have no central heating, so it can be colder indoors than outside in winter." }
      - { es: "Onde está o nosso pequeno? — Está escondido na despensa com as bolachas.", en: "Where's our little one? — Hiding in the pantry with the biscuits.", altEs: ["Onde é que está o nosso pequeno? — Está escondido na despensa com as bolachas.", "Onde está o pequeno? — Está escondido na despensa com as bolachas.", "Cadê o nosso pequeno? — Está escondido na despensa com os biscoitos."], grammar: [g.ep-articles-names-possessives], vocab: [w.pequeno.n, w.despensa, w.bolacha] }
      - { es: "O autoclismo está a pingar desde que viemos para cá.", en: "The toilet cistern has been dripping since we moved in.", altEs: ["O autoclismo está a pingar desde que nos mudámos para cá.", "O autoclismo anda a pingar desde que viemos para cá.", "A descarga está pingando desde que a gente se mudou pra cá."], grammar: [g.ep-estar-a-infinitive], vocab: [w.autoclismo, w.sanita] }
      - { es: "A tua casa é linda! Gostei muito da vossa marquise.", en: "Your house is lovely! I really liked your enclosed balcony.", altEs: ["A tua casa é linda! Gostei imenso da vossa marquise.", "A tua casa é linda; gostei muito da vossa marquise.", "Sua casa é linda! Gostei muito da varanda de vocês."], grammar: [g.ep-articles-names-possessives], vocab: [w.marquise], error: { wrong: "Tua casa é linda! Gostei muito da vossa marquise.", explain: "In Portugal a possessive normally takes the article: a tua casa. Without it you sound Brazilian.", grammar: g.ep-articles-names-possessives } }
      - { es: "O João e a Marta arrendaram um T2 perto dos Jerónimos.", en: "João and Marta have rented a two-bedroom flat near the Jerónimos Monastery.", altEs: ["O João e a Marta arrendaram um T2 ao pé dos Jerónimos.", "O João e a Marta arrendaram um T2 junto aos Jerónimos.", "João e Marta alugaram um apartamento de dois quartos perto dos Jerônimos."], grammar: [g.ep-articles-names-possessives], vocab: [w.arrendar], transform: { instruction: "Say it the Brazilian way, without articles before the names", answer: "João e Marta alugaram um T2 perto dos Jerónimos.", alt: ["João e Marta arrendaram um T2 perto dos Jerónimos.", "João e Marta alugaram um apartamento de dois quartos perto dos Jerônimos."] } }
    exchanges:
      - q: { es: "Onde é a casa de banho, se faz favor?", en: "Where's the bathroom, please?" }
        a: { es: "É a segunda porta à direita, ao pé da despensa.", en: "It's the second door on the right, next to the pantry." }
        alt: ["Ao fundo do corredor.", "É ali, à esquerda."]
        grammar: [g.prepositions-place]
        vocab: [w.casa-de-banho, w.despensa]
      - q: { es: "Quantas assoalhadas tem a casa?", en: "How many rooms does the flat have?" }
        a: { es: "Tem quatro, mais a cozinha e a marquise.", en: "Four, plus the kitchen and the enclosed balcony." }
        alt: ["É um T3.", "Três, e uma casa de banho."]
        grammar: [g.ter-present]
        vocab: [w.assoalhada, w.marquise]
      - q: { es: "O senhorio já arranjou o esquentador?", en: "Has the landlord fixed the water heater yet?" }
        a: { es: "Ainda não. Ando a tomar banho de água fria há uma semana!", en: "Not yet. I've been having cold showers for a week!" }
        alt: ["Já, finalmente.", "Diz que vem amanhã."]
        grammar: [g.ep-aspect-periphrases, g.ha-faz-time]
        vocab: [w.senhorio, w.esquentador]
      - q: { es: "Onde ponho a loiça?", en: "Where shall I put the dishes?" }
        a: { es: "Põe-na no lava-loiça, eu trato disso.", en: "Put them in the sink, I'll deal with it." }
        alt: ["Deixa estar, eu arrumo.", "Na máquina, se faz favor."]
        grammar: [g.ep-imperative-tu, g.ep-enclisis]
        vocab: [w.loiça, w.lava-loiça]
      - q: { es: "A Sofia está?", en: "Is Sofia in?" }
        a: { es: "Não, foi visitar a mãe ao Restelo.", en: "No, she's gone to visit her mother in Restelo." }
        alt: ["Está, mas está a dormir.", "Saiu agora mesmo."]
        grammar: [g.ep-articles-names-possessives]
    texts:
      - title: "Anúncio"
        es: ["Arrenda-se T2 em Belém, com marquise e vista para o Tejo.", "Rés do chão com despensa, aquecimento central e frigorífico novo.", "Falar com o senhorio depois das seis da tarde."]
        en: ["Two-bedroom flat to let in Belém, with enclosed balcony and a view of the Tagus.", "Ground floor with pantry, central heating and a new fridge.", "Speak to the landlord after six in the evening."]
        grammar: [g.se-passive, g.ep-enclisis]
        vocab: [w.arrendar, w.marquise, w.rés-do-chão, w.despensa, w.aquecimento, w.frigorífico, w.senhorio]
      - title: "Mensagem ao senhorio"
        es: ["Bom dia, senhor Almeida.", "O autoclismo continua a pingar e o estore da sala partiu-se.", "Podia mandar alguém esta semana? Obrigada, Leonor."]
        en: ["Good morning, Mr Almeida.", "The toilet cistern is still dripping and the living-room blind has broken.", "Could you send someone this week? Thank you, Leonor."]
        grammar: [g.ep-forms-of-address, g.ep-imperfect-for-conditional]
        vocab: [w.senhorio, w.autoclismo, w.estore]
    spicy:
      - { es: "A minha casa é pequena, mas a minha marquise tem a melhor vista de Belém.", en: "My flat is small, but my enclosed balcony has the best view in Belém.", altEs: ["A minha casa é pequena, mas a marquise tem a melhor vista de Belém.", "Minha casa é pequena, mas minha varanda tem a melhor vista de Belém."], grammar: [g.ep-articles-names-possessives], vocab: [w.marquise] }
      - { es: "O teu senhorio sabe que recebes visitas tão giras?", en: "Does your landlord know you get such cute visitors?", altEs: ["O senhorio sabe que recebes visitas tão giras?", "Seu senhorio sabe que você recebe visitas tão bonitas?"], grammar: [g.ep-articles-names-possessives, g.ep-tu-forms], vocab: [w.senhorio, w.giro] }
      - { es: "Eu lavo a loiça, se tu escolheres o filme.", en: "I'll do the dishes if you choose the film.", altEs: ["Lavo eu a loiça, se escolheres o filme.", "Eu lavo a louça, se você escolher o filme."], grammar: [g.future-subjunctive-se, g.ep-tu-forms], vocab: [w.loiça] }
      - { es: "Sem aquecimento em casa, o teu abraço é a minha única esperança.", en: "With no heating at home, your hug is my only hope.", altEs: ["Sem aquecimento em casa, o teu abraço é a única esperança.", "Sem aquecimento em casa, seu abraço é minha única esperança."], grammar: [g.ep-articles-names-possessives], vocab: [w.aquecimento] }
      - { es: "A Marta diz que o teu primo é giro; o teu primo diz o mesmo da Marta.", en: "Marta says your cousin is cute; your cousin says the same about Marta.", altEs: ["A Marta acha o teu primo giro; o teu primo diz o mesmo da Marta.", "Marta diz que seu primo é bonito; seu primo diz o mesmo da Marta."], grammar: [g.ep-articles-names-possessives], vocab: [w.giro] }
  - id: c2.u02.l4
    title: Na junta de freguesia
    teach: [g.ep-estar-a-infinitive, g.ep-aspect-periphrases]
    vocab: [w.cartão-de-cidadão, w.contribuinte, w.câmara-municipal, w.junta-de-freguesia, w.freguesia, w.concelho, w.autarquia, w.autarca, w.vindima, w.adega, w.quinta.n, w.serão, w.fim-de-tarde, w.quinzena]
    tip: "Estou a ver means both 'I'm watching' and 'I see / I get it'; context decides."
    sentences:
      - { es: "Estou a tratar do cartão de cidadão da minha filha.", en: "I'm sorting out my daughter's ID card.", altEs: ["Estou a tratar do Cartão de Cidadão da minha filha.", "Ando a tratar do cartão de cidadão da minha filha.", "Estou cuidando da carteira de identidade da minha filha."], grammar: [g.ep-estar-a-infinitive, g.ep-articles-names-possessives], vocab: [w.cartão-de-cidadão] }
      - { es: "Para arrendar casa, pedem-te o número de contribuinte.", en: "To rent a place, they ask you for your tax number.", altEs: ["Para arrendar uma casa, pedem o número de contribuinte.", "Para arrendar casa, pedem-te sempre o número de contribuinte.", "Para alugar casa, pedem o seu CPF."], grammar: [g.indeterminate-subject, g.ep-enclisis], vocab: [w.contribuinte, w.arrendar], note: "The Portuguese número de contribuinte (NIF) does the job of the Brazilian CPF." }
      - { es: "Estou à espera há uma hora na junta de freguesia.", en: "I've been waiting at the parish council for an hour.", altEs: ["Há uma hora que estou à espera na junta de freguesia.", "Estou na junta de freguesia à espera há uma hora.", "Faz uma hora que estou esperando na junta de freguesia."], grammar: [g.ep-aspect-periphrases, g.ha-faz-time], vocab: [w.junta-de-freguesia] }
      - { es: "Belém é uma freguesia do concelho de Lisboa.", en: "Belém is a parish in the municipality of Lisbon.", altEs: ["Belém é uma das freguesias do concelho de Lisboa.", "Belém é uma freguesia do município de Lisboa."], grammar: [g.ser-present], vocab: [w.freguesia, w.concelho] }
      - { es: "A câmara municipal anda a arranjar os passeios junto ao rio.", en: "The town hall has been fixing the pavements along the river.", altEs: ["A Câmara anda a arranjar os passeios junto ao rio.", "A câmara municipal está a arranjar os passeios junto ao rio.", "A prefeitura anda arrumando as calçadas perto do rio."], grammar: [g.ep-aspect-periphrases], vocab: [w.câmara-municipal, w.arranjar] }
      - { es: "O autarca esteve a falar com os jornalistas durante uma hora.", en: "The mayor was talking to the journalists for an hour.", altEs: ["O autarca esteve a falar aos jornalistas durante uma hora.", "O autarca esteve uma hora a falar com os jornalistas.", "O prefeito ficou falando com os jornalistas durante uma hora."], grammar: [g.ep-estar-a-infinitive], vocab: [w.autarca] }
      - { es: "As autarquias estão a investir em transportes públicos.", en: "Local authorities are investing in public transport.", altEs: ["As autarquias estão a apostar nos transportes públicos.", "As prefeituras estão investindo em transporte público."], grammar: [g.ep-estar-a-infinitive], vocab: [w.autarquia] }
      - { es: "Este ano vamos à vindima numa quinta do Douro.", en: "This year we're going to the grape harvest at an estate in the Douro.", altEs: ["Este ano vamos fazer a vindima numa quinta do Douro.", "Este ano vamos à vindima a uma quinta do Douro.", "Este ano a gente vai pra colheita da uva numa fazenda do Douro."], grammar: [g.ir-infinitive], vocab: [w.vindima, w.quinta.n] }
      - { es: "Passámos o fim de tarde na adega a provar vinho.", en: "We spent the late afternoon in the wine cellar tasting wine.", altEs: ["Passámos o fim da tarde na adega a provar vinhos.", "Passámos o fim de tarde a provar vinho na adega.", "Passamos o fim de tarde na adega provando vinho."], grammar: [g.ep-estar-a-infinitive, g.ep-aspect-periphrases], vocab: [w.adega, w.fim-de-tarde], error: { wrong: "Passámos o fim de tarde na adega a provando vinho.", explain: "After a, use the infinitive: a provar.", grammar: g.ep-estar-a-infinitive } }
      - { es: "Depois do jantar, ficámos ao serão a contar histórias.", en: "After dinner we stayed up for the evening telling stories.", altEs: ["Depois do jantar, ficámos no serão a contar histórias.", "Depois de jantar, ficámos ao serão a contar histórias.", "Depois do jantar, ficamos até tarde contando histórias."], grammar: [g.ep-aspect-periphrases], vocab: [w.serão] }
      - { es: "Daqui a uma quinzena acabo o curso e volto para o Brasil.", en: "In a fortnight I finish my course and go back to Brazil.", altEs: ["Daqui a quinze dias acabo o curso e volto para o Brasil.", "Dentro de uma quinzena acabo o curso e volto para o Brasil.", "Daqui a duas semanas termino o curso e volto pro Brasil."], altEn: ["In two weeks I finish my course and go back to Brazil."], grammar: [g.present-regular-ar], vocab: [w.quinzena] }
      - { es: "Estás a ver o Mosteiro dos Jerónimos? É Património Mundial desde 1983.", en: "Can you see the Jerónimos Monastery? It's been a World Heritage Site since 1983.", altEs: ["Vês o Mosteiro dos Jerónimos? É Património Mundial desde 1983.", "Estás a ver o Mosteiro dos Jerónimos? É Património Mundial da UNESCO desde 1983.", "Você está vendo o Mosteiro dos Jerônimos? É Patrimônio Mundial desde 1983."], grammar: [g.ep-estar-a-infinitive] }
      - { es: "Estou a ver: sem número de contribuinte, não se faz nada neste país.", en: "I see: without a tax number, you can't do anything in this country.", altEs: ["Estou a ver; sem número de contribuinte não se faz nada neste país.", "Já percebi: sem número de contribuinte, não se faz nada neste país.", "Entendi: sem CPF, não se faz nada neste país."], grammar: [g.ep-estar-a-infinitive, g.se-passive], vocab: [w.contribuinte], note: "Estou a ver can simply mean 'I see / I get it'." }
      - { es: "Continuo a não perceber porque é que a junta fecha à hora de almoço.", en: "I still don't understand why the parish council closes at lunchtime.", altEs: ["Continuo sem perceber porque é que a junta fecha à hora de almoço.", "Continuo a não perceber porque é que a junta fecha à hora do almoço.", "Continuo sem entender por que a junta fecha na hora do almoço."], grammar: [g.ep-aspect-periphrases], vocab: [w.junta-de-freguesia], transform: { instruction: "Say it the Brazilian way", answer: "Continuo sem entender por que a junta fecha na hora do almoço.", alt: ["Continuo não entendendo por que a junta fecha na hora do almoço.", "Continuo sem entender por que a junta fecha na hora de almoço."] } }
      - { es: "Quando cheguei à câmara, os funcionários estavam a almoçar.", en: "When I got to the town hall, the staff were having lunch.", altEs: ["Quando cheguei à Câmara, os funcionários estavam a almoçar.", "Quando cheguei à câmara municipal, os funcionários estavam a almoçar.", "Quando cheguei na prefeitura, os funcionários estavam almoçando."], grammar: [g.ep-estar-a-infinitive, g.preterite-vs-imperfect], vocab: [w.câmara-municipal], transform: { instruction: "Say it the Brazilian way", answer: "Quando cheguei na prefeitura, os funcionários estavam almoçando.", alt: ["Quando cheguei à câmara, os funcionários estavam almoçando.", "Quando cheguei na câmara, os funcionários estavam almoçando."] } }
    exchanges:
      - q: { es: "O que estás a fazer aqui na junta?", en: "What are you doing here at the parish council?" }
        a: { es: "Estou a pedir um atestado de residência.", en: "I'm applying for a certificate of residence." }
        alt: ["Estou a tratar de uns papéis.", "Estou à espera da minha vez."]
        grammar: [g.ep-estar-a-infinitive]
        vocab: [w.junta-de-freguesia, w.atestado]
      - q: { es: "Tem o cartão de cidadão consigo?", en: "Do you have your ID card with you?" }
        a: { es: "Tenho o passaporte; sou brasileira.", en: "I have my passport; I'm Brazilian." }
        alt: ["Tenho, aqui está.", "Esqueci-me dele em casa!"]
        grammar: [g.ep-forms-of-address]
        vocab: [w.cartão-de-cidadão]
      - q: { es: "Qual é o seu número de contribuinte?", en: "What's your tax number?" }
        a: { es: "Ainda não tenho; estou a tratar disso nas Finanças.", en: "I don't have one yet; I'm sorting it out at the tax office." }
        alt: ["Está aqui no cartão.", "Posso dar-lho amanhã?"]
        grammar: [g.ep-estar-a-infinitive]
        vocab: [w.contribuinte, w.finanças]
      - q: { es: "Que tal foi a vindima?", en: "How was the grape harvest?" }
        a: { es: "Cansativa, mas ficámos na quinta até ao serão a cantar.", en: "Tiring, but we stayed on at the estate singing into the evening." }
        alt: ["Fantástica! Andámos dois dias a apanhar uvas.", "Acabei por só beber vinho."]
        grammar: [g.ep-aspect-periphrases]
        vocab: [w.vindima, w.quinta.n, w.serão]
      - q: { es: "Vens jantar connosco amanhã?", en: "Are you coming to dinner with us tomorrow?" }
        a: { es: "Não posso, estou prestes a mudar de casa.", en: "I can't, I'm about to move house." }
        alt: ["Vou, claro!", "Amanhã não, mas daqui a uma quinzena sim."]
        grammar: [g.ep-aspect-periphrases, g.ep-tu-forms]
        vocab: [w.quinzena]
    texts:
      - title: "Aviso da junta"
        es: ["A Junta de Freguesia de Belém informa:", "durante a próxima quinzena, os serviços estão a funcionar só de manhã.", "Pedimos desculpa pelo incómodo."]
        en: ["Belém Parish Council would like to inform you that", "over the next fortnight, its services are open in the mornings only.", "We apologise for the inconvenience."]
        grammar: [g.ep-estar-a-infinitive, g.ep-formal-writing]
        vocab: [w.junta-de-freguesia, w.quinzena]
      - title: "Fim de semana no Douro"
        es: ["Fomos à vindima numa quinta perto do Pinhão.", "Passámos o dia a cortar uvas e o fim de tarde na adega.", "Ao serão, a família toda pôs-se a cantar."]
        en: ["We went to the grape harvest at an estate near Pinhão.", "We spent the day cutting grapes and the late afternoon in the wine cellar.", "In the evening, the whole family burst into song."]
        grammar: [g.ep-aspect-periphrases]
        vocab: [w.vindima, w.quinta.n, w.adega, w.fim-de-tarde, w.serão]
    spicy:
      - { es: "Estou a ver que gostas mais da vindima do que de mim.", en: "I can see you like the grape harvest more than me.", altEs: ["Estou a ver que gostas mais da vindima que de mim.", "Estou vendo que você gosta mais da colheita do que de mim."], grammar: [g.ep-estar-a-infinitive, g.comparatives], vocab: [w.vindima] }
      - { es: "Passámos o serão inteiro a conversar e nem demos pelas horas.", en: "We spent the whole evening talking and didn't even notice the time.", altEs: ["Passámos o serão todo a conversar e nem demos pelas horas.", "Passamos a noite toda conversando e nem vimos a hora passar."], grammar: [g.ep-aspect-periphrases], vocab: [w.serão] }
      - { es: "Se continuas a sorrir-me assim, acabo por perder a vez na fila.", en: "If you keep smiling at me like that, I'll end up losing my place in the queue.", altEs: ["Se continuas a sorrir-me assim, ainda acabo por perder a vez.", "Se você continuar sorrindo pra mim assim, acabo perdendo a vez na fila."], grammar: [g.ep-aspect-periphrases, g.ep-enclisis] }
      - { es: "Na adega, entre dois copos, pôs-se a recitar poemas... para mim.", en: "In the wine cellar, between two glasses, he started reciting poems... to me.", altEs: ["Na adega, entre dois copos, ela pôs-se a recitar poemas... para mim.", "Na adega, entre dois copos, ele começou a recitar poemas... pra mim."], grammar: [g.ep-aspect-periphrases], vocab: [w.adega] }
      - { es: "Não precisas do meu número de contribuinte; o do telemóvel chega.", en: "You don't need my tax number; my mobile number will do.", altEs: ["Não precisas do meu número de contribuinte: o do telemóvel chega.", "Você não precisa do meu CPF; o número do celular basta."], grammar: [g.ep-tu-forms], vocab: [w.contribuinte] }
dialogues:
  - id: c2.u02.d1
    title: Na fila dos pastéis de Belém
    context: Leonor, a Lisboner, takes her Brazilian friend Caio to the famous pastry shop in Belém. While they queue, she explains how coffee works in Portugal.
    lines:
      - { speaker: Caio, es: "Estás a brincar! Esta fila é toda para os pastéis?", en: "You're kidding! This whole queue is for the tarts?" }
      - { speaker: Leonor, es: "É, mas anda depressa. Venho cá desde miúda e nunca esperei mais de vinte minutos.", en: "It is, but it moves fast. I've been coming here since I was a girl and I've never waited more than twenty minutes." }
      - { speaker: Caio, es: "Enquanto estamos à espera, explica-me: qual é a diferença entre um galão e uma meia de leite?", en: "While we're waiting, explain something to me: what's the difference between a galão and a meia de leite?" }
      - { speaker: Leonor, es: "O galão vem num copo alto, com mais leite; a meia de leite vem numa chávena.", en: "A galão comes in a tall glass, with more milk; a meia de leite comes in a cup." }
      - { speaker: Caio, es: "E a minha mãe pede sempre um cafezinho. Aqui como é?", en: "And my mother always asks for a cafezinho. What do you say here?" }
      - { speaker: Leonor, es: "Aqui pedes uma bica. Olha, o empregado está a chamar-nos.", en: "Here you ask for a bica. Look, the waiter is calling us." }
      - { speaker: Empregado, es: "Bom dia! O que vai ser?", en: "Good morning! What will it be?" }
      - { speaker: Leonor, es: "Seis pastéis para levar e duas bicas, se faz favor.", en: "Six tarts to take away and two espressos, please." }
      - { speaker: Caio, es: "Seis? Estás a pensar comer quatro?", en: "Six? Are you planning to eat four?" }
      - { speaker: Leonor, es: "Dois são para a minha avó. Os outros... logo se vê.", en: "Two are for my grandmother. The others... we'll see." }
    questions:
      - { q: "Desde quando é que a Leonor vai àquela pastelaria?", options: ["Desde o ano passado", "Desde miúda", "É a primeira vez"], answer: 1, explain: "She says «Venho cá desde miúda»: she has been going since she was a girl." }
      - { q: "Como é servido o galão?", options: ["Numa chávena", "Num copo alto", "Numa garrafa"], answer: 1, explain: "«O galão vem num copo alto, com mais leite.»" }
      - { q: "O que se pede em Lisboa em vez de um cafezinho?", options: ["Uma bica", "Um galão", "Uma imperial", "Um fino"], answer: 0, explain: "Leonor tells Caio «Aqui pedes uma bica»." }
      - { q: "Para quem são dois dos pastéis?", options: ["Para o empregado", "Para a avó da Leonor", "Para a mãe do Caio"], answer: 1, explain: "«Dois são para a minha avó.»" }
writing:
  - task: "Text a friend from a pastelaria in Belém describing what you and the others are doing right now, using estar a + infinitive."
    min: 130
    max: 220
    use: [w.pastel-de-nata, w.bica, w.galão, w.pastelaria, w.empregado-de-mesa]
    useAtLeast: 3
    grammar: [g.ep-estar-a-infinitive]
    expect:
      - { pattern: '\b(estou|estamos|estás|est[aá]|est[aã]o) a [a-zà-ú]+r\b', hint: "Use estar a + infinitive: Estou a comer…, Estamos a ver…" }
    model: { es: "Olá, Sofia! Estou neste momento numa pastelaria em Belém, a poucos metros do Mosteiro dos Jerónimos. Estou a comer o meu segundo pastel de nata, ainda quente, com açúcar por cima. O Pedro está a beber uma bica e a Joana está a pedir um galão ao empregado de mesa, que está a correr de um lado para o outro, porque a pastelaria está cheia. Lá fora, a fila está a crescer e há turistas a tirar fotografias à porta. Nós estamos a pensar ir a pé até à Torre de Belém depois do lanche e, se não estiver muito vento, apanhar sol à beira do Tejo. E tu, estás a trabalhar hoje? Se quiseres, vem ter connosco! Guardamos-te um pastel. Daqui a pouco vamos também ao Padrão dos Descobrimentos, que fica mesmo ao lado.", en: "Hi, Sofia! Right now I'm in a pastry shop in Belém, a few metres from the Jerónimos Monastery. I'm eating my second custard tart, still warm, with sugar on top. Pedro is drinking an espresso and Joana is ordering a milky coffee from the waiter, who is rushing about because the shop is full. Outside the queue is growing and there are tourists taking photos at the door. We're thinking of walking to the Belém Tower after our snack and, if it isn't too windy, sunbathing by the Tagus. And you, are you working today? If you like, come and join us! We'll save you a tart. In a while we're also going to the Monument to the Discoveries, which is right next door." }
  - task: "Write to a friend about what you've been doing lately in Portugal, using andar a + infinitive (ando a comer…, ando a aprender…) and European food and shopping words."
    min: 130
    max: 220
    use: [w.andar-a, w.francesinha, w.bacalhau, w.mercearia, w.saldos]
    useAtLeast: 3
    grammar: [g.ep-aspect-periphrases]
    expect:
      - { pattern: '\b(ando|anda|andamos|andam|andas|tenho andado) a [a-zà-ú]+r\b', hint: "Use andar a + infinitive for what you've been doing: Ando a comer…" }
    model: { es: "Querida Bia, tenho tanta coisa para te contar! Ando a comer bem demais desde que cheguei ao Porto: francesinhas, bifanas, bacalhau de todas as maneiras e, claro, pastéis de nata ao pequeno-almoço. Também ando a aprender o vocabulário daqui, que é bem diferente: a mercearia é a nossa venda de bairro, o talho é o açougue e o multibanco é onde levantamos dinheiro. A minha colega de casa anda a ensinar-me a fazer caldo verde, mas ainda não sei fazê-lo bem. Ao fim de semana, andamos a visitar as vilas à volta da cidade. O pior é que ando a gastar imenso dinheiro nos saldos! E tu, tens andado a estudar muito? Para a semana, vou a Braga com uns colegas e depois conto-te tudo. Escreve-me quando puderes. Beijinhos, Carla.", en: "Dear Bia, I've got so much to tell you! I've been eating far too well since I arrived in Porto: francesinhas, pork sandwiches, cod every which way and, of course, custard tarts for breakfast. I've also been learning the local vocabulary, which is really different: the mercearia is our corner shop, the talho is the butcher's and the multibanco is where we take out money. My flatmate has been teaching me to make caldo verde, but I still can't make it well. At weekends we've been visiting the towns around the city. The worst thing is I've been spending loads of money in the sales! And you, have you been studying a lot? Next week I'm going to Braga with some colleagues and I'll tell you all about it afterwards. Write to me when you can. Love, Carla." }
  - task: "Describe your flat in Lisbon and your flatmates the European way: articles with names (a Inês, o João) and with possessives (o meu quarto), using European house vocabulary."
    min: 130
    max: 220
    use: [w.casa-de-banho, w.frigorífico, w.senhorio, w.rés-do-chão, w.arrendar]
    useAtLeast: 3
    grammar: [g.ep-articles-names-possessives]
    expect:
      - { pattern: '\b(a minha|o meu|as minhas|os meus|a nossa|o nosso) [a-zà-ú]+', hint: "Use the article with possessives: a minha casa, o meu quarto…" }
      - { pattern: '\b(com|a|o) (a |o )?(in[eê]s|jo[aã]o|ana|pedro|maria|rui|sofia|marta)\b', hint: "Use the article with people's names: a Inês, o João…" }
    model: { es: "Arrendei um apartamento no rés do chão de um prédio antigo em Campo de Ourique. O meu quarto é pequeno, mas tem muita luz, e a casa de banho foi arranjada no ano passado. A cozinha tem um frigorífico novo e uma marquise onde secamos a roupa. Vivo com a Inês, uma enfermeira de Viseu, e com o João, que estuda arquitetura. A Inês é muito arrumada; o João, nem por isso. O nosso senhorio, o senhor Fernando, mora no primeiro andar e é muito simpático, mas não gosta de barulho depois das dez. A minha parte favorita da casa é a despensa, onde guardo os meus livros, porque o meu quarto já não tem espaço para mais nada! Pago setecentos euros por mês, o que, para Lisboa, até nem é muito.", en: "I've rented a ground-floor flat in an old building in Campo de Ourique. My bedroom is small, but it gets a lot of light, and the bathroom was done up last year. The kitchen has a new fridge and a glazed balcony where we dry the washing. I live with Inês, a nurse from Viseu, and with João, who studies architecture. Inês is very tidy; João, not so much. Our landlord, Mr Fernando, lives on the first floor and is very nice, but he doesn't like noise after ten. My favourite part of the flat is the pantry, where I keep my books, because my bedroom has no room for anything else! I pay seven hundred euros a month, which, for Lisbon, isn't actually that much." }
  - task: "Describe a bureaucratic morning at the junta de freguesia or the câmara municipal: what everyone was doing (estava a…, andava a…) and what you needed."
    min: 130
    max: 220
    use: [w.cartão-de-cidadão, w.contribuinte, w.junta-de-freguesia, w.câmara-municipal, w.freguesia]
    useAtLeast: 3
    grammar: [g.ep-estar-a-infinitive, g.ep-aspect-periphrases]
    expect:
      - { pattern: '\b(estava|est[aá]vamos|estavam|andava|andavam) a [a-zà-ú]+r\b', hint: "Use estava a / andava a + infinitive for the background: estava a discutir…" }
    model: { es: "Ontem passei a manhã na junta de freguesia de Arroios, porque precisava de um atestado de residência para pedir o número de contribuinte. Quando cheguei, às nove, já havia uma fila enorme. Um senhor estava a discutir com a funcionária por causa de um documento, duas raparigas estavam a preencher formulários e uma criança andava a correr pela sala. Esperei quase duas horas! Depois, na câmara municipal, disseram-me que, para o cartão de cidadão, tinha de ir a outro serviço. Enquanto estava a ouvir a explicação, percebi que a burocracia portuguesa é tão complicada como a brasileira. No fim, consegui tudo, mas só cheguei ao trabalho depois do almoço. Saí de lá a pensar que, em qualquer país, a paciência é o documento mais importante de todos. Para a próxima, levo um livro.", en: "Yesterday I spent the morning at the Arroios parish council, because I needed a certificate of residence to apply for a tax number. When I got there at nine, there was already a huge queue. A man was arguing with the clerk about a document, two girls were filling in forms and a child was running around the room. I waited almost two hours! Then, at the city hall, they told me that for the citizen card I had to go to another office. While I was listening to the explanation, I realised Portuguese bureaucracy is as complicated as the Brazilian kind. In the end I got everything done, but I only got to work after lunch. I left thinking that, in any country, patience is the most important document of all. Next time I'll take a book." }
