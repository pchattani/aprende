reading:
  text: |
    Quem visita Belém pela primeira vez costuma ser apresentado ao açaí como quem é apresentado a um parente distante: com cerimônia e algum medo. O caldo grosso, roxo, servido sem açúcar, com farinha de tapioca e peixe frito, pouco tem a ver com a sobremesa gelada, doce e cheia de banana que se vende nas academias do Sul. Para o paraense, aliás, essa versão é quase uma ofensa; para o visitante, a versão paraense é, no mínimo, uma surpresa.

    O fato de que o açaí tenha conquistado o mundo é, sem dúvida, uma boa notícia para os ribeirinhos que vivem da sua coleta. Em contrapartida, o sucesso trouxe problemas que poucos consumidores imaginam. Com a demanda internacional em alta, o preço do fruto subiu muito, e muitas famílias da região, que sempre o comeram todos os dias, passaram a não conseguir comprá-lo. Dito de outro modo: o que era comida de pobre virou artigo de luxo justamente na terra onde nasce.

    Há ainda a questão ambiental. Embora a palmeira do açaí seja nativa da floresta, as grandes plantações de uma espécie só, estimuladas pelos bons preços, vêm substituindo outras espécies nas várzeas. Segundo pesquisadores, áreas onde antes conviviam dezenas de árvores diferentes estão se transformando em verdadeiras plantações de açaí, com consequências ainda pouco estudadas para os peixes, as aves e a própria terra.

    Não se trata, é claro, de condenar o consumo. Trata-se, isso sim, de perguntar quem fica com o dinheiro e quem paga a conta. Iniciativas de comércio justo, grupos de pequenos agricultores e lojas que informam a origem do produto têm mostrado que é possível ganhar dinheiro e preservar a floresta ao mesmo tempo. Resta saber se o consumidor, do outro lado do mundo, aceitará pagar um pouco mais para que o açaí continue a ser, antes de tudo, a comida de quem vive dele.
  questions:
    - { q: "How does the açaí eaten in Belém differ from the version sold in the South?", options: ["It is sweeter and colder", "It is only used in desserts", "It is thick, unsweetened and eaten with tapioca flour and fried fish"], answer: 2 }
    - { q: "What negative effect of international demand does the text describe?", options: ["Prices rose so much that local families can no longer afford a staple food", "Ribeirinhos stopped harvesting it", "The fruit lost its flavour"], answer: 0 }
    - { q: "What is the environmental concern?", options: ["The palm is an invasive foreign species", "Monoculture of açaí is replacing other species in the floodplains", "Açaí trees are being cut down for timber"], answer: 1 }
    - { q: "What is the author's position on consumption?", options: ["It should be banned", "It should only be allowed in Pará", "It is not to be condemned; the question is who profits and who pays"], answer: 2 }
    - { q: "What does 'Dito de outro modo' introduce?", options: ["A contradiction", "A reformulation of the previous idea", "A quotation from an expert"], answer: 1 }
