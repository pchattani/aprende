id: r.b2.vou-levando
level: b2
title: Vou levando
kind: dialogue
intro: In Jericoacoara, a village of sand streets on the coast of Ceará, a traveller chats with Seu Raimundo, who has run a guesthouse there for thirty years. Their talk is full of verbal periphrases (vou levando, vinha pensando, ando cansado, tenho feito) and the future perfect.
allow: [direção, raimundo, jericoacoara, jeri, ceará, ok, kitesurf, kitesurfistas, pedra, furada, fortaleza, juliana]
paragraphs:
  - { es: "Eram seis da tarde, e a vila inteira caminhava em direção à grande duna para ver o pôr do sol. A Juliana, que tinha chegado naquele dia, preferiu ficar na varanda da pousada, conversando com o dono, seu Raimundo, que balançava devagar numa rede.", en: "It was six in the evening, and the whole village was walking towards the big dune to watch the sunset. Juliana, who had arrived that day, preferred to stay on the guesthouse veranda, chatting with the owner, Seu Raimundo, who was swinging slowly in a hammock." }
  - { es: "— E aí, seu Raimundo, como é que o senhor está?", en: "'So, Seu Raimundo, how are you doing?'" }
  - { es: "— Vou levando, minha filha. Vou levando. Ando meio cansado, mas quem mora num lugar desses não tem direito de reclamar, né?", en: "'Getting by, dear. Getting by. I've been a bit tired, but anyone who lives in a place like this has no right to complain, right?'" }
  - { es: "— O senhor mora aqui há muito tempo?", en: "'Have you lived here a long time?'" }
  - { es: "— Desde menino. Meu pai era pescador. Quando eu era criança, Jericoacoara era só uma vila de pescadores, sem luz elétrica, sem estrada, sem nada. A gente pescava, fazia farinha e dormia com o barulho do mar. Os primeiros turistas foram chegando nos anos oitenta, uns mochileiros cabeludos que tinham ouvido falar que aqui era o paraíso.", en: "'Since I was a boy. My father was a fisherman. When I was a child, Jericoacoara was just a fishing village, with no electricity, no road, nothing. We fished, made manioc flour and slept to the sound of the sea. The first tourists started arriving in the eighties, long-haired backpackers who had heard this place was paradise.'" }
  - { es: "— E como foi que o senhor acabou abrindo uma pousada?", en: "'And how did you end up opening a guesthouse?'" }
  - { es: "— Foi sem querer. Os mochileiros não tinham onde dormir, e a minha mãe começou a alugar um quarto. Depois dois, depois cinco. Quando vi, já estava cuidando de uma pousada. Isso vai fazer trinta anos em dezembro.", en: "'It happened by accident. The backpackers had nowhere to sleep, and my mother started renting out a room. Then two, then five. Before I knew it, I was running a guesthouse. That'll be thirty years this December.'" }
  - { es: "— E a vila mudou muito desde então?", en: "'And has the village changed a lot since then?'" }
  - { es: "— Mudou tudo, e ao mesmo tempo nada. As ruas continuam sendo de areia; a prefeitura nunca deixou asfaltar, e espero que nunca deixe. Mas hoje tem restaurante chique, tem loja de grife, tem gente do mundo inteiro. Os kitesurfistas vêm vindo cada ano em maior número, porque o vento aqui é dos melhores do planeta. E agora tem até aeroporto perto. Antes, a gente levava um dia inteiro para chegar de Fortaleza.", en: "'Everything has changed, and at the same time nothing. The streets are still sand; the town hall has never allowed them to be paved, and I hope it never does. But today there are fancy restaurants, designer shops, people from all over the world. Kitesurfers keep coming in greater numbers every year, because the wind here is among the best on the planet. And now there's even an airport nearby. Before, it took us a whole day to get here from Fortaleza.'" }
  - { es: "— O senhor acha que isso é bom ou ruim?", en: "'Do you think that's good or bad?'" }
  - { es: "— Depende do dia. — Ele riu. — O turismo deu trabalho para os meus filhos, que não precisaram ir embora para São Paulo como os meus primos. Mas eu venho pensando muito nisso ultimamente: os preços subiram tanto que muitos nativos têm vendido as casas para gente de fora e se mudado para longe da praia. Daqui a uns anos, quem sabe, os pescadores terão desaparecido da vila.", en: "'Depends on the day.' He laughed. 'Tourism gave work to my children, who didn't have to leave for São Paulo like my cousins. But I've been thinking about this a lot lately: prices have gone up so much that many locals have been selling their houses to outsiders and moving away from the beach. A few years from now, who knows, the fishermen will have disappeared from the village.'" }
  - { es: "— E o senhor pensa em vender a pousada?", en: "'And are you thinking of selling the guesthouse?'" }
  - { es: "— Proposta não falta. Toda semana aparece um estrangeiro querendo comprar. Mas eu vou continuar aqui enquanto tiver saúde. Quando eu morrer, os meus filhos decidem. Até lá, espero, eles já terão aprendido que dinheiro nenhum compra um pôr do sol desses.", en: "'There's no shortage of offers. Every week some foreigner turns up wanting to buy. But I'm going to stay here as long as I have my health. When I die, my children will decide. By then, I hope, they'll have learned that no amount of money buys a sunset like this.'" }
  - { es: "Ao longe, as pessoas no alto da duna começaram a bater palmas. O sol tinha acabado de desaparecer no mar.", en: "In the distance, the people on top of the dune began to clap. The sun had just disappeared into the sea." }
  - { es: "— Amanhã a senhora vai à Pedra Furada — disse seu Raimundo, fechando os olhos na rede. — Vá cedo, na maré baixa. E depois volta aqui para me contar.", en: "'Tomorrow you're going to Pedra Furada,' said Seu Raimundo, closing his eyes in the hammock. 'Go early, at low tide. And then come back here and tell me about it.'" }
questions:
  - { q: "Como era Jericoacoara quando o seu Raimundo era criança?", options: ["Uma cidade turística", "Uma vila de pescadores, sem luz elétrica nem estrada", "Um centro de kitesurf"], answer: 1, explain: "«Jericoacoara era só uma vila de pescadores, sem luz elétrica, sem estrada, sem nada.»" }
  - { q: "Como a pousada começou?", options: ["A mãe dele começou a alugar um quarto para mochileiros", "Ele comprou um hotel", "Um estrangeiro deu a pousada para ele"], answer: 0, explain: "«A minha mãe começou a alugar um quarto. Depois dois, depois cinco.»" }
  - { q: "O que NÃO mudou na vila?", options: ["As ruas continuam sendo de areia", "Não há restaurantes", "Não há turistas estrangeiros"], answer: 0, explain: "«As ruas continuam sendo de areia; a prefeitura nunca deixou asfaltar.»" }
  - { q: "O que preocupa o seu Raimundo?", options: ["Que o vento acabe", "Que os nativos vendam as casas e os pescadores desapareçam da vila", "Que os filhos se mudem para São Paulo"], answer: 1, explain: "«Muitos nativos têm vendido as casas para gente de fora... os pescadores terão desaparecido da vila.»" }
  - { q: "O que ele espera que os filhos aprendam?", options: ["Que dinheiro nenhum compra um pôr do sol como aquele", "A pescar", "A falar inglês"], answer: 0, explain: "«Eles já terão aprendido que dinheiro nenhum compra um pôr do sol desses.»" }
glossary:
