id: r.c1.macau-beyond-the-casinos
level: c1
title: 賭場以外嘅澳門
kind: text
intro: "An opinion column written in colloquial Cantonese by a (fictional) Macau resident, built on the classic 起承轉合 pattern of Chinese essays: an opening, a development, a turn that concedes the other side, and a conclusion. Watch for parallelism, rhetorical questions and emphatic structures such as 正是, 無疑 and 不得不."
allow: [路氹, 拉斯維加斯, 馬介休, 免治, 土生葡人, 世界美食之都, 聯合國教科文組織]
paragraphs:
  - { es: "（起）每次去外國旅行，人哋一聽到我係澳門人，第一句就問：「你係咪好識賭錢？」我每次都要解釋：我唔識打牌，亦都冇入過幾次賭場。澳門喺外國人眼中，好似淨係得賭場同酒店。但係對我哋住喺度嘅人嚟講，賭場以外，先係真正嘅澳門。", en: "(Opening) Every time I travel abroad, as soon as people hear I'm from Macau, the first thing they ask is: 'So you must be good at gambling?' Every time I have to explain: I can't play cards, and I've hardly ever been inside a casino. In foreigners' eyes Macau seems to consist of nothing but casinos and hotels. But for those of us who live here, the real Macau is what lies beyond the casinos." }
  - { es: "（承）無疑，博彩業係澳門經濟嘅核心。二零零六年，澳門嘅賭收已經超過拉斯維加斯；路氹由一片海填成陸地，起滿一座座大型酒店，夜晚燈光耀眼。好多人因為賭場搵到工，政府亦都靠賭稅派錢、起學校、起醫院。我唔會扮清高話賭場一啲好處都冇。", en: "(Development) Undoubtedly, the gaming industry is the core of Macau's economy. By 2006 Macau's gambling revenue had already overtaken Las Vegas; Cotai was reclaimed from the sea and filled with huge hotels, dazzling with lights at night. Many people have found jobs because of the casinos, and the government relies on gaming tax to hand out money and build schools and hospitals. I'm not going to pretend to be high-minded and say casinos have no benefits at all." }
  - { es: "但係，澳門有四百幾年中西文化交匯嘅歷史；有大三巴、媽閣廟、議事亭前地呢啲世界遺產；有土生葡人嘅馬介休同免治，有氹仔街邊嘅豬扒包，有路環嘅葡撻；二零一七年，聯合國教科文組織仲將澳門列為「世界美食之都」。一個城市有咁多寶，點解要淨係靠一樣嘢嚟賺錢？", en: "But Macau has more than four hundred years of history as a meeting point of Chinese and Western cultures; it has World Heritage sites like the Ruins of St Paul's, A-Ma Temple and Senado Square; it has the bacalhau and minchi of the Macanese, the pork chop buns of Taipa's street stalls and the egg tarts of Coloane; and in 2017 UNESCO named Macau a Creative City of Gastronomy. When a city has so many treasures, why should it rely on just one thing to make money?" }
  - { es: "我諗起疫情嗰幾年。遊客一冇咗，賭場冷清，成個城市好似停咗電。好多做酒店、做餐廳、做的士嘅朋友，一夜之間冇晒收入。正是嗰個時候，大家先發覺：雞蛋全部放喺同一個籃度，係幾咁危險。", en: "I think back to the pandemic years. As soon as the tourists disappeared, the casinos went quiet and the whole city seemed to have lost power. Many friends working in hotels, restaurants and taxis lost all their income overnight. It was precisely then that everyone realised how dangerous it is to put all your eggs in one basket." }
  - { es: "我有個舊同學，大學讀完酒店管理，喺賭場做咗十年荷官，人工唔錯，但係日日輪班，連過年都要返工。佢話：「我做咗十年，識得嘅嘢就係派牌。如果有一日賭場唔要我，我都唔知自己仲可以做乜。」佢嘅擔心，正是好多澳門年輕人嘅擔心：一個城市嘅經濟淨係得一條路，個人嘅前途都只得一條路。", en: "An old classmate of mine studied hotel management at university and has worked as a croupier in a casino for ten years. The pay is decent, but he works shifts every day and even has to work over Chinese New Year. He says: 'I've done this for ten years and what I know how to do is deal cards. If one day the casino doesn't want me any more, I don't know what else I could do.' His worry is precisely the worry of many young people in Macau: when a city's economy has only one road, each person's future has only one road too." }
  - { es: "（轉）當然，有人會話：「你講得咁輕鬆，唔靠賭場，邊有錢養咁多人？」呢個講法唔係冇道理。澳門地方細，人口得六十幾萬，冇乜工業，要轉型一定好難，亦唔係一兩年做得到。我同意，我哋唔可以一下子唔要賭場。但係，難，唔代表唔做；慢，唔代表唔行。", en: "(Turn) Of course, some will say: 'That's easy for you to say. Without the casinos, where's the money to support so many people?' This argument isn't without reason. Macau is small, its population is only just over six hundred thousand and it has very little industry, so changing direction is bound to be hard, and it can't be done in a year or two. I agree that we can't give up the casinos overnight. But difficult doesn't mean not doing it; slow doesn't mean not moving." }
  - { es: "其實，轉型可以由好細嘅嘢開始：保育舊街，等年輕人喺度開小店；搞多啲文化節同展覽，等遊客唔止留一晚；支持本地廚師，將土生葡人菜帶去世界；喺學校教多啲澳門歷史，等下一代知道自己個城市有幾特別。每一樣都唔係大計，但係加埋一齊，就係另一個澳門。", en: "In fact, the change can start with very small things: conserving old streets so young people can open small shops there; holding more cultural festivals and exhibitions so visitors stay more than one night; supporting local chefs and taking Macanese cuisine to the world; teaching more Macau history in schools so the next generation knows how special their city is. None of these is a grand plan, but together they make another Macau." }
  - { es: "試問，如果一個遊客嚟澳門三日，第一日行世界遺產，第二日去路環踩單車、食葡國菜，第三日先去路氹睇表演，佢會唔會比淨係入賭場更加想再嚟？我相信會。而且呢種遊客，帶畀小店、帶畀街坊嘅收入，可能仲多過喺賭枱上面輸咗嘅錢。", en: "Let me ask: if a visitor comes to Macau for three days – the first day touring World Heritage sites, the second cycling in Coloane and eating Portuguese food, and only on the third going to Cotai to see a show – won't they want to come back more than someone who only went into the casinos? I believe they will. And the income this kind of visitor brings to small shops and to the neighbourhood may even be greater than the money lost at the gaming tables." }
  - { es: "（合）我唔係反對賭場，我係反對澳門淨係得賭場。一個城市好似一個人：有一份好工好重要，但係如果除咗份工乜都冇，人生就太單調喇。我希望下一次喺外國，人哋聽到我係澳門人，第一句問嘅唔再係「你識唔識賭錢」，而係「你可唔可以介紹間好嘅土生葡人餐廳畀我」。到嗰日，我先會覺得，澳門真係行多咗一步。", en: "(Conclusion) I'm not against casinos; I'm against Macau having nothing but casinos. A city is like a person: having a good job is very important, but if you have nothing apart from your job, life is too monotonous. I hope that next time I'm abroad and people hear I'm from Macau, the first thing they ask won't be 'Can you gamble?' but 'Can you recommend a good Macanese restaurant?' When that day comes, I'll feel that Macau really has taken one more step forward." }
  - { es: "（編者按）本文作者喺澳門出世同長大，現職中學老師。文章只代表作者個人意見。歡迎讀者來信回應，你哋覺得澳門應唔應該減少依賴博彩業？請將意見寄到本報。", en: "(Editor's note) The author was born and raised in Macau and works as a secondary-school teacher. The article represents only the author's personal opinion. Readers are welcome to write in response: do you think Macau should reduce its dependence on gaming? Please send your views to this paper." }
questions:
  - { q: "作者喺「承」嗰部分承認咗乜嘢？", options: ["賭場一啲好處都冇", "博彩業係澳門經濟嘅核心，帶嚟工作同稅收", "佢自己好鍾意賭錢"], answer: 1, explain: "無疑，博彩業係澳門經濟嘅核心: he concedes the industry's importance before arguing his point." }
  - { q: "疫情嗰幾年令大家發覺乜嘢？", options: ["雞蛋全部放喺同一個籃度好危險", "澳門需要起更多賭場", "遊客唔鍾意澳門"], answer: 0, explain: "The idiom about eggs in one basket: depending on one industry is risky." }
  - { q: "喺「轉」嗰部分，作者點樣回應反對意見？", options: ["佢話反對嘅人講錯晒", "佢承認轉型好難，但係話難唔代表唔做", "佢唔理反對意見"], answer: 1, explain: "The 轉 section concedes (呢個講法唔係冇道理) and then turns: 難，唔代表唔做；慢，唔代表唔行." }
  - { q: "「難，唔代表唔做；慢，唔代表唔行。」用咗乜嘢修辭？", options: ["對偶", "反問", "比喻"], answer: 0, explain: "Two matched clauses of identical structure: 對偶 (parallel pair)." }
  - { q: "作者嘅結論係乜嘢？", options: ["澳門應該即刻關閉所有賭場", "佢唔反對賭場，但係反對澳門淨係得賭場", "澳門應該起更多酒店"], answer: 1, explain: "我唔係反對賭場，我係反對澳門淨係得賭場." }
