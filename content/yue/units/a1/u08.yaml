      - { es: "我屋企養兩隻貓。", en: "We keep two cats at home.", altEs: ["我哋屋企養兩隻貓。"], grammar: [g.common-classifiers], vocab: [w.joeng5], transform: { instruction: "Ask what they keep at home (use 乜嘢)", answer: "你屋企養乜嘢呀？", alt: ["你屋企養咩呀？", "你屋企養咩嘢呀？"], en: "What pets do you have at home?" } }
