id: b2.u09
title: "Oxente! Registro e sotaques"
lessons:
  - id: b2.u09.l1
    title: "Tá beleza ou atenciosamente?"
    teach: [g.register-formal-informal]
    vocab: [w.registro, w.formal, w.coloquial, w.culto, w.gíria, w.expressão, w.palavrão, w.variedade]
    tip: "Speech and writing are far apart in Brazil: tá, tô, pra, a gente, vi ele in a chat; está, estou, para, nós, eu o vi in an email to a client. Pick one register per text."
    sentences:
      - { es: "Cara, tá muito calor, bora pra lagoa?", en: "Mate, it's so hot, shall we head to the lagoon?", altEs: ["Cara, tá calor demais, bora pra lagoa?"], grammar: [g.register-formal-informal, g.spoken-reductions], vocab: [w.lagoa], transform: { instruction: "Say it in neutral, careful Portuguese", answer: "Está muito calor; vamos à lagoa?", alt: ["Está muito calor, vamos para a lagoa?", "Está muito quente; vamos à lagoa?"] } }
      - { es: "Solicitamos que os documentos sejam enviados até sexta-feira.", en: "We request that the documents be sent by Friday.", altEs: ["Pedimos que os documentos sejam enviados até sexta-feira."], grammar: [g.register-formal-informal, g.passive-advanced], vocab: [w.solicitar] }
      - { es: "Num e-mail formal, não se usa gíria nem abreviação.", en: "In a formal email, you don't use slang or abbreviations.", altEs: ["Em um e-mail formal, não se usa gíria nem abreviação."], grammar: [g.register-formal-informal, g.se-passive], vocab: [w.formal, w.gíria] }
      - { es: "Botei o celular na mochila e esqueci.", en: "I put my phone in my rucksack and forgot about it.", altEs: ["Coloquei o celular na mochila e esqueci.", "Pus o celular na mochila e esqueci."], grammar: [g.register-formal-informal, g.null-object], vocab: [w.mochila], variant: "Portugal: Pus o telemóvel na mochila e esqueci-me." }
      - { es: "A gente se fala depois, tá?", en: "We'll talk later, OK?", altEs: ["A gente conversa depois, tá?", "Nós nos falamos depois, está bem?"], grammar: [g.register-formal-informal, g.a-gente], vocab: [] }
      - { es: "Entraremos em contato em breve.", en: "We will be in touch shortly.", altEs: ["Nós entraremos em contato em breve.", "Entraremos em contato em breve com o senhor."], grammar: [g.register-formal-informal, g.future-simple], vocab: [], transform: { instruction: "Say it the way you'd text a friend (a gente + ir)", answer: "A gente vai entrar em contato logo, tá?", alt: ["A gente fala com você logo.", "A gente te chama logo."] } }
      - { es: "Poderia verificar a minha reserva para Barreirinhas, por favor?", en: "Could you check my booking for Barreirinhas, please?", altEs: ["O senhor poderia verificar a minha reserva para Barreirinhas, por favor?", "Poderia verificar minha reserva para Barreirinhas, por favor?"], grammar: [g.register-formal-informal, g.polite-requests], vocab: [w.verificar, w.reserva] }
      - { es: "Na linguagem coloquial, “vi ele” é normal; na escrita culta, escreve-se “eu o vi”.", en: "In colloquial speech, 'vi ele' is normal; in standard writing, you write 'eu o vi'.", grammar: [g.register-formal-informal, g.ele-as-object], vocab: [w.coloquial, w.culto] }
      - { es: "Prezado senhor, envio-lhe o contrato em anexo.", en: "Dear Sir, I am sending you the contract attached.", altEs: ["Prezado senhor, segue o contrato em anexo.", "Prezado senhor, estou lhe enviando o contrato em anexo."], altEn: ["Dear Sir, please find the contract attached."], grammar: [g.register-formal-informal, g.clitic-placement-norm], vocab: [w.contrato, w.anexo], transform: { instruction: "Say it informally, as a message to a friend (cara, tô…)", answer: "Cara, tô te mandando o contrato em anexo.", alt: ["Cara, tô te mandando o contrato.", "Cara, tô mandando o contrato pra você."] }, error: { wrong: "Prezado senhor, tô te mandando o contrato em anexo.", explain: "Don't mix registers: after Prezado senhor, write envio-lhe or segue, not tô te mandando.", grammar: g.register-formal-informal } }
      - { es: "Meu avô diz que palavrão não combina com mesa de jantar.", en: "My grandfather says swear words don't go with the dinner table.", altEs: ["O meu avô diz que palavrão não combina com a mesa de jantar."], grammar: [g.register-formal-informal], vocab: [w.palavrão, w.combinar] }
      - { es: "Cada registro tem a sua expressão certa: “valeu” para o amigo, “agradeço” para o cliente.", en: "Each register has its right expression: 'cheers' for a friend, 'thank you' for a client.", altEs: ["Cada registro tem sua expressão certa: “valeu” para o amigo, “agradeço” para o cliente."], grammar: [g.register-formal-informal], vocab: [w.registro, w.expressão] }
      - { es: "Valeu, mano! Te devo uma.", en: "Thanks, bro! I owe you one.", altEs: ["Valeu, cara! Te devo uma."], grammar: [g.register-formal-informal, g.pronoun-placement-brazil], vocab: [] }
      - { es: "Você ainda não respondeu à mensagem do cliente?", en: "Haven't you answered the client's message yet?", altEs: ["Você não respondeu à mensagem do cliente ainda?"], grammar: [g.ja-ainda-nao], vocab: [w.cliente, w.responder] }
      - { es: "Não chame o cliente de “você”; prefira “o senhor”.", en: "Don't call the client 'você'; it's better to use 'o senhor'.", altEs: ["Não trate o cliente por “você”; prefira “o senhor”."], grammar: [g.register-formal-informal, g.imperative-negative, g.voce-o-senhor], vocab: [w.cliente] }
      - { es: "O português do Brasil tem muitas variedades, e nenhuma é errada.", en: "Brazilian Portuguese has many varieties, and none of them is wrong.", altEs: ["O português brasileiro tem muitas variedades, e nenhuma é errada."], grammar: [g.indefinite-pronouns], vocab: [w.variedade] }
      - { es: "Gíria envelhece rápido: o que era “show de bola” ontem hoje soa antigo.", en: "Slang ages fast: what was 'awesome' yesterday sounds old today.", grammar: [g.register-formal-informal, g.relative-que-quem], vocab: [w.gíria] }
    exchanges:
      - q: { es: "E aí, beleza?", en: "Hey, all good?" }
        a: { es: "Beleza! E contigo?", en: "All good! And you?" }
        alt: ["Tudo certo!", "Tranquilo, e você?"]
        grammar: [g.register-formal-informal, g.greetings]
        vocab: []
      - q: { es: "Bom dia. Em que posso ajudá-lo?", en: "Good morning. How can I help you?" }
        a: { es: "Bom dia. Gostaria de confirmar a minha reserva, por favor.", en: "Good morning. I'd like to confirm my booking, please." }
        alt: ["Queria confirmar a minha reserva, por favor.", "Gostaria de confirmar minha reserva."]
        grammar: [g.register-formal-informal, g.polite-requests]
        vocab: [w.reserva]
      - q: { es: "Posso escrever “vc” no e-mail para o professor?", en: "Can I write 'u' in the email to the teacher?" }
        a: { es: "Melhor não. Num e-mail formal, escreva tudo por extenso.", en: "Better not. In a formal email, write everything out in full." }
        alt: ["Não, escreva “você”.", "Melhor não."]
        grammar: [g.register-formal-informal, g.imperative-formal]
        vocab: [w.formal]
      - q: { es: "O que quer dizer “bora”?", en: "What does 'bora' mean?" }
        a: { es: "É a forma coloquial de “vamos embora”.", en: "It's the colloquial form of 'let's go'." }
        alt: ["Quer dizer “vamos”.", "É gíria para “vamos”."]
        grammar: [g.register-formal-informal, g.spoken-reductions]
        vocab: [w.coloquial]
      - q: { es: "Como eu termino um e-mail para um cliente?", en: "How do I end an email to a client?" }
        a: { es: "Com “atenciosamente” ou “cordialmente”, e o seu nome completo.", en: "With 'yours sincerely' or 'kind regards', and your full name." }
        alt: ["Com “atenciosamente”.", "Use “atenciosamente”."]
        grammar: [g.register-formal-informal, g.formal-email]
        vocab: [w.cliente]
    texts:
      - title: "Duas mensagens, o mesmo assunto"
        es: ["Mano, tô chegando atrasado, segura a jardineira pra mim!", "Prezado senhor, informo que chegarei com quinze minutos de atraso.", "Peço, por gentileza, que o transporte me aguarde."]
        en: ["Bro, I'm running late, hold the truck for me!", "Dear Sir, I wish to inform you that I will arrive fifteen minutes late.", "I kindly ask that the transport wait for me."]
        grammar: [g.register-formal-informal, g.formal-email]
        vocab: []
    spicy:
      - { es: "Num e-mail eu seria formal, mas pessoalmente prefiro te chamar de “meu bem”.", en: "In an email I'd be formal, but in person I'd rather call you 'darling'.", altEs: ["Num e-mail eu seria formal, mas pessoalmente prefiro chamar você de “meu bem”."], grammar: [g.register-formal-informal, g.conditional-simple], vocab: [w.formal] }
      - { es: "Prezada senhorita, venho por meio desta solicitar um jantar a dois.", en: "Dear Madam, I hereby request a dinner for two.", grammar: [g.register-formal-informal, g.formal-email], vocab: [w.solicitar] }
      - { es: "Cara, tu é muito gato. Quer dizer: o senhor é bastante atraente.", en: "Dude, you're so hot. I mean: you are rather attractive, sir.", altEs: ["Cara, você é muito gato. Quer dizer: o senhor é bastante atraente."], grammar: [g.register-formal-informal, g.tu-regional], vocab: [] }
      - { es: "Com a sua mãe eu falo na norma culta; com você, na gíria do coração.", en: "With your mother I speak standard Portuguese; with you, in the slang of the heart.", altEs: ["Com sua mãe eu falo na norma culta; com você, na gíria do coração."], grammar: [g.register-formal-informal], vocab: [w.culto, w.gíria, w.norma] }
      - { es: "Agradeço antecipadamente a sua atenção… e o seu telefone.", en: "Thank you in advance for your attention… and your phone number.", altEs: ["Agradeço desde já a sua atenção… e o seu telefone."], grammar: [g.register-formal-informal, g.formal-email], vocab: [] }
  - id: b2.u09.l2
    title: "Oxente, tu vais?"
    teach: [g.regional-features-brazil]
    vocab: [w.sotaque, w.dialeto, w.regionalismo, w.caipira, w.oxente, w.vixe, w.eita, w.visse, w.arretado, w.avexado, w.aperreado, w.abestado, w.mangar, w.pirangueiro, w.cabra-da-peste, w.arrodear, w.tchê, w.tri, w.bah, w.guri, w.maranhense, w.cearense, w.piauiense, w.paraibano]
    tip: "Recognise regional words rather than imitate them: oxente and vixe in the Northeast, uai in Minas, bah and tchê in the South. In Maranhão many people use tu with standard forms: tu vais, tu queres."
    sentences:
      - { es: "Oxente, menino, que confusão é essa?", en: "Goodness, boy, what's all this fuss?", altEs: ["Oxe, menino, que confusão é essa?"], grammar: [g.regional-features-brazil], vocab: [w.oxente, w.confusão] }
      - { es: "Vixe, esqueci a chave da pousada!", en: "Oh no, I forgot the guesthouse key!", altEs: ["Vish, esqueci a chave da pousada!"], grammar: [g.regional-features-brazil], vocab: [w.vixe, w.chave], transform: { instruction: "Change to a gente", answer: "Vixe, a gente esqueceu a chave da pousada!", alt: ["Vixe, nós esquecemos a chave da pousada!"] } }
      - { es: "Eita, que lagoa mais azul!", en: "Whoa, what a blue lagoon!", altEs: ["Eita, que lagoa azul!"], grammar: [g.regional-features-brazil], vocab: [w.eita, w.lagoa] }
      - { es: "No Maranhão, muita gente diz “tu vais” e “tu queres”, como em Portugal.", en: "In Maranhão, lots of people say 'tu vais' and 'tu queres', as in Portugal.", grammar: [g.regional-features-brazil, g.tu-regional], vocab: [w.maranhense] }
      - { es: "Tu vais para os Lençóis amanhã cedo?", en: "Are you going to the Lençóis early tomorrow?", altEs: ["Você vai para os Lençóis amanhã cedo?", "Tu vais pros Lençóis amanhã cedo?"], grammar: [g.regional-features-brazil, g.tu-regional], vocab: [], transform: { instruction: "Change to você", answer: "Você vai para os Lençóis amanhã cedo?", alt: ["Você vai pros Lençóis amanhã cedo?"] } }
      - { es: "O sotaque maranhense é bem diferente do sotaque cearense.", en: "The Maranhão accent is very different from the Ceará accent.", altEs: ["O sotaque do Maranhão é bem diferente do sotaque do Ceará."], grammar: [g.regional-features-brazil, g.adjective-agreement], vocab: [w.sotaque, w.maranhense, w.cearense] }
      - { es: "Não estou avexado, só não quero perder o barco para Atins.", en: "I'm not in a hurry, I just don't want to miss the boat to Atins.", altEs: ["Não tô avexado, só não quero perder o barco pra Atins."], grammar: [g.regional-features-brazil], vocab: [w.avexado] }
      - { es: "Ela anda aperreada com as contas, coitada.", en: "She's been stressed about the bills lately, poor thing.", altEs: ["Ela anda preocupada com as contas, coitada."], grammar: [g.regional-features-brazil, g.periphrases-aspect], vocab: [w.aperreado] }
      - { es: "O forró de ontem foi arretado, visse?", en: "Last night's forró was brilliant, you know?", altEs: ["O forró de ontem foi massa, visse?", "O forró de ontem foi arretado, viu?"], grammar: [g.regional-features-brazil], vocab: [w.arretado, w.visse, w.forró], error: { wrong: "O forró de ontem foi arretada, visse?", explain: "arretado agrees with forró (masculine): arretado.", grammar: g.adjective-agreement } }
      - { es: "Deixe de ser abestado e pare de mangar do sotaque dos outros!", en: "Stop being silly and stop making fun of other people's accents!", altEs: ["Deixa de ser abestado e para de mangar do sotaque dos outros!"], grammar: [g.regional-features-brazil, g.imperative-formal], vocab: [w.abestado, w.mangar, w.sotaque] }
      - { es: "Meu avô era um cabra da peste: atravessava o sertão a pé.", en: "My grandfather was a tough guy: he used to cross the sertão on foot.", altEs: ["O meu avô era um cabra da peste: atravessava o sertão a pé."], grammar: [g.regional-features-brazil, g.imperfect], vocab: [w.cabra-da-peste, w.sertão] }
      - { es: "Para chegar à lagoa, a gente teve que arrodear a duna inteira.", en: "To get to the lagoon, we had to go all the way round the dune.", altEs: ["Pra chegar na lagoa, a gente teve que arrodear a duna inteira."], grammar: [g.regional-features-brazil, g.a-gente], vocab: [w.arrodear, w.duna] }
      - { es: "Bah, tchê, que frio! — disse o guri gaúcho em pleno inverno de Porto Alegre.", en: "Wow, mate, it's freezing! said the gaúcho lad in the middle of a Porto Alegre winter.", grammar: [g.regional-features-brazil], vocab: [w.bah, w.tchê, w.guri, w.gaúcho] }
      - { es: "Lá no Sul, uma coisa muito boa é “tri legal”.", en: "Down in the South, something really good is 'tri legal'.", altEs: ["No Sul, uma coisa muito boa é “tri legal”."], grammar: [g.regional-features-brazil], vocab: [w.tri] }
      - { es: "O “r” caipira do interior paulista é reconhecido em qualquer lugar do país.", en: "The rural 'r' of inland São Paulo is recognised anywhere in the country.", grammar: [g.regional-features-brazil, g.passive-advanced], vocab: [w.caipira] }
      - { es: "Um dialeto não é um português errado; cada regionalismo conta a história de um lugar.", en: "A dialect isn't wrong Portuguese; every regionalism tells the story of a place.", grammar: [g.regional-features-brazil], vocab: [w.dialeto, w.regionalismo] }
    exchanges:
      - q: { es: "Oxente, tu ainda não tomaste banho de lagoa?", en: "What, you still haven't been for a swim in the lagoon?" }
        a: { es: "Ainda não, mas hoje eu vou, sim!", en: "Not yet, but today I'm definitely going!" }
        alt: ["Ainda não.", "Hoje eu vou!"]
        grammar: [g.regional-features-brazil, g.tu-regional]
        vocab: [w.oxente]
      - q: { es: "De onde é esse sotaque?", en: "Where's that accent from?" }
        a: { es: "Sou piauiense, de Teresina, mas moro em São Luís há anos.", en: "I'm from Piauí, from Teresina, but I've lived in São Luís for years." }
        alt: ["Sou do Piauí.", "Sou piauiense."]
        grammar: [g.ser-origin, g.ha-faz-time]
        vocab: [w.sotaque, w.piauiense]
      - q: { es: "Ele é muito pirangueiro, né?", en: "He's really stingy, isn't he?" }
        a: { es: "Eita, se é! Nunca paga nem o cafezinho.", en: "Oh, and how! He never even pays for the coffee." }
        alt: ["É, sim.", "Muito! Nunca paga nada."]
        grammar: [g.regional-features-brazil]
        vocab: [w.pirangueiro, w.eita]
      - q: { es: "Por que você está tão avexada?", en: "Why are you in such a rush?" }
        a: { es: "Vixe, o barco sai em dez minutos!", en: "Oh no, the boat leaves in ten minutes!" }
        alt: ["O barco já vai sair!", "Estou atrasada."]
        grammar: [g.regional-features-brazil]
        vocab: [w.avexado, w.vixe]
      - q: { es: "Bah, que tri esse lugar, né, tchê?", en: "Wow, this place is great, isn't it, mate?" }
        a: { es: "Arretado! Dá até vontade de ficar mais uma semana.", en: "Brilliant! It makes you want to stay another week." }
        alt: ["Muito bom!", "Massa demais!"]
        grammar: [g.regional-features-brazil]
        vocab: [w.arretado, w.bah, w.tri, w.tchê]
    texts:
      - title: "Recado na pousada de Barreirinhas"
        es: ["Oxente, visitante! O passeio para os Lençóis sai às oito.", "Não fique avexado: o guia espera.", "Leve água e protetor, visse?"]
        en: ["Hey there, visitor! The trip to the Lençóis leaves at eight.", "Don't worry about rushing: the guide will wait.", "Take water and sunscreen, all right?"]
        grammar: [g.regional-features-brazil, g.imperative-formal]
        vocab: [w.oxente, w.avexado]
      - title: "Pergunta num fórum"
        es: ["Sou paraibano e moro em Porto Alegre.", "No começo, eu não entendia nada: guri, bah, tri…", "Agora já falo “tchê” sem perceber!"]
        en: ["I'm from Paraíba and I live in Porto Alegre.", "At first I didn't understand anything: guri, bah, tri…", "Now I say 'tchê' without noticing!"]
        grammar: [g.regional-features-brazil, g.imperfect]
        vocab: [w.paraibano, w.guri, w.bah, w.tri, w.tchê]
    spicy:
      - { es: "Oxente, tu ficas ainda mais bonito com esse sotaque.", en: "Goodness, you're even more handsome with that accent.", altEs: ["Oxente, você fica ainda mais bonito com esse sotaque.", "Oxente, tu ficas ainda mais bonita com esse sotaque."], grammar: [g.regional-features-brazil, g.tu-regional], vocab: [w.oxente, w.sotaque] }
      - { es: "Vixe, olhei para você e me perdi nas dunas.", en: "Oh dear, I looked at you and got lost in the dunes.", grammar: [g.regional-features-brazil], vocab: [w.vixe, w.duna] }
      - { es: "Não sou pirangueiro: o jantar é por minha conta, e a sobremesa também.", en: "I'm not stingy: dinner is on me, and dessert too.", grammar: [g.regional-features-brazil], vocab: [w.pirangueiro] }
      - { es: "Pode mangar do meu sotaque, contanto que dance comigo depois.", en: "You can make fun of my accent, as long as you dance with me afterwards.", grammar: [g.regional-features-brazil, g.conditional-conjunctions], vocab: [w.mangar, w.sotaque] }
      - { es: "Bah, tchê, que guria tri bonita!", en: "Wow, mate, what a really pretty girl!", altEs: ["Bah, tchê, que guri tri bonito!"], grammar: [g.regional-features-brazil], vocab: [w.bah, w.tri, w.guri, w.tchê] }
  - id: b2.u09.l3
    title: "Um minutinho, rapidinho"
    teach: [g.diminutives-augmentatives]
    vocab: [w.pertinho, w.rapidinho, w.devagarinho, w.cedinho, w.agorinha, w.pouquinho, w.bonitinho, w.gatinho, w.casinha, w.beijinho, w.tchauzinho, w.obrigadinho, w.pãozinho, w.casarão, w.carrão, w.dedão, w.paizão, w.golaço, w.goleada, w.atacante, w.zagueiro, w.pênalti, w.caçula, w.afilhado, w.madrinha, w.macaxeira, w.padrinho]
    tip: "-inho / -zinho shrink, soften or intensify: um minutinho (politeness), cedinho (really early), pertinho (very close). -ão / -aço enlarge or praise: casarão, golaço."
    sentences:
      - { es: "Só um minutinho, já te atendo.", en: "Just a moment, I'll be right with you.", altEs: ["Só um minutinho, já atendo você.", "Um minutinho, já te atendo."], grammar: [g.diminutives-augmentatives, g.pronoun-placement-brazil], vocab: [] }
      - { es: "A lagoa fica pertinho da pousada, dá para ir a pé.", en: "The lagoon is really close to the guesthouse, you can walk there.", altEs: ["A lagoa fica bem pertinho da pousada, dá pra ir a pé."], grammar: [g.diminutives-augmentatives], vocab: [w.pertinho, w.lagoa] }
      - { es: "Acordei cedinho para ver o sol nascer sobre as dunas.", en: "I got up really early to watch the sun rise over the dunes.", altEs: ["Acordei bem cedinho para ver o sol nascer sobre as dunas."], grammar: [g.diminutives-augmentatives], vocab: [w.cedinho, w.duna], transform: { instruction: "Change to a gente", answer: "A gente acordou cedinho para ver o sol nascer sobre as dunas.", alt: ["Nós acordamos cedinho para ver o sol nascer sobre as dunas."] } }
      - { es: "Volto rapidinho, só vou comprar uns pãezinhos.", en: "I'll be back in a jiffy, I'm just going to buy some rolls.", altEs: ["Já volto, só vou comprar uns pãezinhos."], grammar: [g.diminutives-augmentatives], vocab: [w.rapidinho, w.pãozinho], error: { wrong: "Volto rapidinho, só vou comprar uns pãozinhos.", explain: "Plural of a -zinho word: plural stem + -zinhos. pães → pãezinhos.", grammar: g.diminutives-augmentatives } }
      - { es: "Desça a duna devagarinho, que a areia é fofa.", en: "Go down the dune nice and slowly, the sand is soft.", altEs: ["Desce a duna devagarinho, que a areia é fofa."], grammar: [g.diminutives-augmentatives, g.imperative-formal], vocab: [w.devagarinho] }
      - { es: "O barco saiu agorinha; o próximo é daqui a uma hora.", en: "The boat left just now; the next one is in an hour.", grammar: [g.diminutives-augmentatives], vocab: [w.agorinha] }
      - { es: "Aceita um cafezinho? Está fresquinho.", en: "Would you like a coffee? It's freshly made.", altEs: ["Aceita um cafezinho? Acabei de fazer."], grammar: [g.diminutives-augmentatives], vocab: [], variant: "Lisbon: Quer uma bica?" }
      - { es: "Pode me dar um pouquinho mais de farofa?", en: "Could I have a tiny bit more farofa?", altEs: ["Pode me dar mais um pouquinho de farofa?"], grammar: [g.diminutives-augmentatives, g.polite-requests], vocab: [w.pouquinho, w.farofa] }
      - { es: "Que casinha bonitinha, toda pintada de azul!", en: "What a cute little house, all painted blue!", grammar: [g.diminutives-augmentatives], vocab: [w.casinha, w.bonitinho] }
      - { es: "Moramos num casarão colonial em São Luís.", en: "We live in a big colonial mansion in São Luís.", altEs: ["Nós moramos num casarão colonial em São Luís."], grammar: [g.diminutives-augmentatives], vocab: [w.casarão, w.colonial], transform: { instruction: "Say it is a small house instead (diminutive of casa)", answer: "Moramos numa casinha colonial em São Luís.", alt: ["Nós moramos numa casinha colonial em São Luís.", "Moramos em uma casinha colonial em São Luís."] } }
      - { es: "Ele chegou num carrão importado, mas atolou na areia.", en: "He arrived in a big imported car, but got stuck in the sand.", grammar: [g.diminutives-augmentatives], vocab: [w.carrão, w.areia] }
      - { es: "Machuquei o dedão subindo a duna.", en: "I hurt my big toe climbing the dune.", grammar: [g.diminutives-augmentatives, g.estar-gerund], vocab: [w.dedão, w.duna] }
      - { es: "Que golaço! O atacante driblou o zagueiro e chutou de longe.", en: "What a goal! The striker dribbled past the defender and shot from distance.", grammar: [g.diminutives-augmentatives], vocab: [w.golaço, w.atacante, w.zagueiro], variant: "Portugal: o avançado fintou o defesa." }
      - { es: "Foi uma goleada: cinco a zero, com dois pênaltis.", en: "It was a thrashing: five-nil, with two penalties.", grammar: [g.diminutives-augmentatives], vocab: [w.goleada, w.pênalti] }
      - { es: "Ele virou um paizão depois que nasceu a filha.", en: "He became a doting dad after his daughter was born.", grammar: [g.diminutives-augmentatives], vocab: [w.paizão] }
      - { es: "A porta é pequena, mas o portão é grande: são palavras diferentes.", en: "A 'porta' is a door, but a 'portão' is a gate: they're different words.", grammar: [g.diminutives-augmentatives], vocab: [], note: "Some augmentatives become new words, often masculine: a porta → o portão, a caixa → o caixão." }
    exchanges:
      - q: { es: "A praia fica longe?", en: "Is the beach far?" }
        a: { es: "Que nada, fica pertinho, uns cinco minutinhos a pé.", en: "Not at all, it's really close, about five minutes on foot." }
        alt: ["Fica pertinho.", "Não, é pertinho."]
        grammar: [g.diminutives-augmentatives]
        vocab: [w.pertinho]
      - q: { es: "Você pode me ajudar com a mala?", en: "Can you help me with the suitcase?" }
        a: { es: "Claro, é rapidinho.", en: "Sure, it'll only take a sec." }
        alt: ["Claro!", "Posso, sim, é rapidinho."]
        grammar: [g.diminutives-augmentatives]
        vocab: [w.rapidinho]
      - q: { es: "Viu o jogo ontem?", en: "Did you see the game yesterday?" }
        a: { es: "Vi! Que golaço do atacante no fim!", en: "I did! What a goal by the striker at the end!" }
        alt: ["Vi, foi uma goleada!", "Não vi, perdi."]
        grammar: [g.diminutives-augmentatives, g.null-object]
        vocab: [w.golaço, w.atacante]
      - q: { es: "Obrigadinho pela carona!", en: "Thanks a lot for the lift!" }
        a: { es: "Imagina! Tchauzinho, até amanhã.", en: "Don't mention it! Bye-bye, see you tomorrow." }
        alt: ["De nada!", "Imagina, tchau!"]
        grammar: [g.diminutives-augmentatives]
        vocab: [w.obrigadinho, w.tchauzinho]
      - q: { es: "Quem é o caçula da família?", en: "Who's the youngest in the family?" }
        a: { es: "É o meu afilhado, o Pedrinho. A madrinha dele sou eu!", en: "It's my godson, little Pedro. I'm his godmother!" }
        alt: ["É o Pedrinho.", "O Pedrinho, meu afilhado."]
        grammar: [g.diminutives-augmentatives]
        vocab: [w.caçula, w.afilhado, w.madrinha]
    texts:
      - title: "Mensagem da tia"
        es: ["Oi, meu bem! Passa aqui cedinho amanhã?", "Fiz um bolinho de macaxeira para o seu padrinho.", "Beijinhos e tchauzinho!"]
        en: ["Hi, darling! Can you drop by nice and early tomorrow?", "I've made a little cassava cake for your godfather.", "Kisses and bye-bye!"]
        grammar: [g.diminutives-augmentatives]
        vocab: [w.padrinho, w.beijinho, w.macaxeira, w.cedinho, w.tchauzinho]
    spicy:
      - { es: "Me dá um beijinho rapidinho? Ninguém está olhando.", en: "Give me a quick little kiss? Nobody's looking.", altEs: ["Me dá só um beijinho rapidinho? Ninguém tá olhando."], grammar: [g.diminutives-augmentatives], vocab: [w.beijinho, w.rapidinho] }
      - { es: "Senta aqui pertinho, que a noite está fresquinha.", en: "Sit right here next to me, the night is a bit chilly.", altEs: ["Senta aqui pertinho, que a noite tá fresquinha."], grammar: [g.diminutives-augmentatives, g.imperative-informal], vocab: [w.pertinho] }
      - { es: "Você é um gatinho, mas eu sou um gatão.", en: "You're a cutie, but I'm a hunk.", altEs: ["Você é uma gatinha, mas eu sou uma gatona."], grammar: [g.diminutives-augmentatives], vocab: [w.gatinho] }
      - { es: "Esse seu carrão impressiona, mas eu prefiro um passeio a pé.", en: "That big car of yours is impressive, but I'd rather go for a walk.", grammar: [g.diminutives-augmentatives], vocab: [w.carrão] }
      - { es: "Só mais um pouquinho de forró e eu te deixo em casa, prometo.", en: "Just a little bit more forró and I'll take you home, I promise.", grammar: [g.diminutives-augmentatives], vocab: [w.pouquinho, w.forró] }
  - id: b2.u09.l4
    title: "Cuscuz, cordel e sanfona"
    teach: [g.regional-features-brazil, g.diminutives-augmentatives]
    vocab: [w.porão, w.nordestino, w.mainha, w.painho, w.jerimum, w.aipim, w.abóbora, w.bergamota, w.mexerica, w.tangerina, w.cuscuz, w.queijo-coalho, w.baião, w.carne-de-sol, w.baião-de-dois, w.cajuína, w.caju, w.mungunzá, w.rapadura, w.buchada, w.cordel, w.xilogravura, w.repentista, w.sanfona, w.zabumba, w.xote, w.alagoano, w.sergipano, w.potiguar, w.telhado, w.sótão, w.muro]
    tip: "The same food has different names in different regions: macaxeira (Northeast), aipim (Rio), mandioca (elsewhere); bergamota (South), mexerica (São Paulo, Minas), tangerina (everywhere)."
    sentences:
      - { es: "No Nordeste se diz macaxeira; no Rio, aipim; em outros lugares, mandioca.", en: "In the Northeast they say macaxeira; in Rio, aipim; elsewhere, mandioca.", altEs: ["No Nordeste a gente diz macaxeira; no Rio, aipim; em outros lugares, mandioca."], grammar: [g.regional-features-brazil, g.se-passive], vocab: [w.macaxeira, w.aipim, w.mandioca] }
      - { es: "O gaúcho chama de bergamota, o paulista de mexerica, e todo mundo entende tangerina.", en: "A gaúcho calls it bergamota, a paulista mexerica, and everyone understands tangerina.", grammar: [g.regional-features-brazil], vocab: [w.bergamota, w.mexerica, w.tangerina, w.gaúcho] }
      - { es: "Mainha fez cuscuz com ovo e painho trouxe queijo coalho da feira.", en: "Mum made couscous with egg and Dad brought grilling cheese from the market.", altEs: ["Minha mãe fez cuscuz com ovo e meu pai trouxe queijo coalho da feira."], grammar: [g.regional-features-brazil, g.preterite-irregular], vocab: [w.mainha, w.painho, w.cuscuz, w.queijo-coalho], transform: { instruction: "Say it in neutral Portuguese, without mainha and painho", answer: "Minha mãe fez cuscuz com ovo e meu pai trouxe queijo coalho da feira.", alt: ["A minha mãe fez cuscuz com ovo e o meu pai trouxe queijo coalho da feira."] } }
      - { es: "O doce de jerimum da minha avó é o melhor do mundo.", en: "My grandmother's pumpkin dessert is the best in the world.", altEs: ["O doce de abóbora da minha avó é o melhor do mundo."], grammar: [g.regional-features-brazil, g.superlatives], vocab: [w.jerimum, w.abóbora], error: { wrong: "O doce de jerimum da minha avó é o mais bom do mundo.", explain: "bom has an irregular superlative: o melhor, never o mais bom.", grammar: g.irregular-comparatives } }
      - { es: "Baião de dois com carne de sol é o almoço de domingo lá em casa.", en: "Rice and beans with sun-dried beef is Sunday lunch at our house.", grammar: [g.regional-features-brazil], vocab: [w.baião-de-dois, w.carne-de-sol, w.baião] }
      - { es: "Você já provou cajuína? É feita de caju e não tem álcool.", en: "Have you ever tried cajuína? It's made from cashew fruit and has no alcohol.", altEs: ["Já provou cajuína? É feita com caju e não tem álcool."], grammar: [g.passive-ser], vocab: [w.cajuína, w.caju] }
      - { es: "Na festa junina não pode faltar mungunzá nem rapadura.", en: "At a June festival there has to be hominy pudding and raw cane sugar.", grammar: [g.regional-features-brazil], vocab: [w.mungunzá, w.rapadura] }
      - { es: "Buchada de bode é para os fortes; eu fico só no cuscuzinho.", en: "Stuffed goat tripe is for the brave; I'll stick to a bit of couscous.", grammar: [g.diminutives-augmentatives], vocab: [w.buchada, w.cuscuz] }
      - { es: "Os folhetos de cordel são ilustrados com xilogravuras.", en: "Cordel chapbooks are illustrated with woodcuts.", grammar: [g.passive-advanced], vocab: [w.cordel, w.xilogravura], error: { wrong: "Os folhetos de cordel são ilustradas com xilogravuras.", explain: "The participle agrees with folhetos (masculine plural): ilustrados.", grammar: g.passive-advanced } }
      - { es: "Dois repentistas improvisaram versos sobre os turistas da praça.", en: "Two singer-poets improvised verses about the tourists in the square.", grammar: [g.preterite-regular], vocab: [w.repentista] }
      - { es: "Sem sanfona, zabumba e triângulo, não tem forró pé de serra.", en: "Without accordion, bass drum and triangle, there's no traditional forró.", altEs: ["Sem sanfona, zabumba e triângulo, não há forró pé de serra."], grammar: [g.regional-features-brazil, g.tem-there-is], vocab: [w.sanfona, w.zabumba], variant: "Portugal: o acordeão." }
      - { es: "Luiz Gonzaga levou o baião e o xote do sertão para o Brasil inteiro.", en: "Luiz Gonzaga took baião and xote from the sertão to the whole of Brazil.", grammar: [g.preterite-regular], vocab: [w.baião, w.xote, w.sertão] }
      - { es: "Todo nordestino conhece alguém que mora em São Paulo.", en: "Every Northeasterner knows someone who lives in São Paulo.", grammar: [g.todo-tudo], vocab: [w.nordestino], transform: { instruction: "Change to the plural: Todos os nordestinos…", answer: "Todos os nordestinos conhecem alguém que mora em São Paulo." } }
      - { es: "O alagoano, o sergipano e o potiguar têm sotaques bem diferentes.", en: "People from Alagoas, Sergipe and Rio Grande do Norte have very different accents.", grammar: [g.regional-features-brazil], vocab: [w.alagoano, w.sergipano, w.potiguar, w.sotaque] }
      - { es: "A chuva entrou pelo telhado e encheu o porão.", en: "The rain came in through the roof and flooded the cellar.", grammar: [g.preterite-regular], vocab: [w.telhado, w.porão], variant: "Portugal: a cave." }
      - { es: "No sótão do casarão, achamos folhetos de cordel antigos e um muro pintado à mão.", en: "In the attic of the old mansion, we found old cordel chapbooks and a hand-painted wall.", altEs: ["No sótão do casarão, a gente achou folhetos de cordel antigos e um muro pintado à mão."], grammar: [g.diminutives-augmentatives, g.preterite-regular], vocab: [w.sótão, w.muro, w.cordel] }
    exchanges:
      - q: { es: "O que é macaxeira?", en: "What's macaxeira?" }
        a: { es: "É a mandioca. No Rio, eles chamam de aipim.", en: "It's cassava. In Rio they call it aipim." }
        alt: ["É mandioca.", "É o mesmo que aipim."]
        grammar: [g.regional-features-brazil, g.null-object]
        vocab: [w.macaxeira, w.aipim]
      - q: { es: "O que vocês comem no café da manhã aqui?", en: "What do you have for breakfast here?" }
        a: { es: "Cuscuz com manteiga, ovo e um cafezinho.", en: "Couscous with butter, egg and a little coffee." }
        alt: ["Cuscuz e café.", "Tapioca ou cuscuz."]
        grammar: [g.diminutives-augmentatives]
        vocab: [w.cuscuz]
      - q: { es: "Quem toca a sanfona na banda?", en: "Who plays the accordion in the band?" }
        a: { es: "O meu padrinho; a madrinha toca zabumba.", en: "My godfather; my godmother plays the bass drum." }
        alt: ["O meu padrinho.", "É o Seu Raimundo."]
        grammar: [g.jogar-vs-tocar]
        vocab: [w.sanfona, w.zabumba, w.padrinho, w.madrinha]
      - q: { es: "Onde eu compro cordel?", en: "Where can I buy cordel?" }
        a: { es: "Na feira, pertinho do mercado. Tem até xilogravura.", en: "At the market, really close to the covered market. They even have woodcuts." }
        alt: ["Na feira.", "Pertinho do mercado."]
        grammar: [g.diminutives-augmentatives]
        vocab: [w.cordel, w.xilogravura, w.pertinho]
    texts:
      - title: "Cardápio da barraca"
        es: ["Hoje tem baião de dois com carne de sol.", "Sobremesa: doce de jerimum ou rapadura.", "Bebidas: cajuína geladinha e suco de caju."]
        en: ["Today there's rice and beans with sun-dried beef.", "Dessert: pumpkin sweet or raw cane sugar.", "Drinks: ice-cold cajuína and cashew-fruit juice."]
        grammar: [g.diminutives-augmentatives]
        vocab: [w.baião-de-dois, w.jerimum, w.cajuína, w.baião, w.rapadura]
      - title: "Começo de um cordel"
        es: ["Vou contar uma história", "De um cabra lá do sertão,", "Que tocava uma sanfona", "E dançava o baião."]
        en: ["I'm going to tell a story", "Of a fellow from the sertão,", "Who used to play an accordion", "And dance the baião."]
        grammar: [g.regional-features-brazil]
        vocab: [w.sanfona, w.baião]
    spicy:
      - { es: "Mainha disse que quem dança xote coladinho tem que casar.", en: "Mum said that anyone who dances xote cheek to cheek has to get married.", grammar: [g.regional-features-brazil, g.diminutives-augmentatives], vocab: [w.mainha, w.xote] }
      - { es: "Você é mais doce que rapadura, e olha que eu sou nordestino.", en: "You're sweeter than raw cane sugar, and that's coming from a Northeasterner.", altEs: ["Você é mais doce que rapadura, e olha que eu sou nordestina."], grammar: [g.comparatives], vocab: [w.rapadura, w.nordestino] }
      - { es: "Se tu tocares sanfona assim no São João, eu caso contigo.", en: "If you play the accordion like that at the São João festival, I'll marry you.", altEs: ["Se você tocar sanfona assim no São João, eu caso com você."], grammar: [g.future-subjunctive-se, g.tu-regional], vocab: [w.sanfona] }
      - { es: "Escrevi um cordel para você, mas só rima com beijinho.", en: "I wrote a cordel for you, but it only rhymes with 'little kiss'.", grammar: [g.preterite-regular], vocab: [w.cordel, w.beijinho] }
dialogues:
  - id: b2.u09.d1
    title: "Na jardineira para a Lagoa Azul"
    context: "In Barreirinhas, Ana from São Paulo shares a truck to the Lençóis Maranhenses with Josué, the local guide, and Bia, a tourist from Porto Alegre."
    lines:
      - { speaker: "Josué", es: "Bom dia, gente! Tu já conheces os Lençóis ou é a primeira vez?", en: "Morning, everyone! Have you been to the Lençóis before, or is it your first time?" }
      - { speaker: "Ana", es: "Primeira vez! Desculpa, mas você falou “tu conheces”? Achei que só se falava assim em Portugal.", en: "First time! Sorry, but did you say 'tu conheces'? I thought people only spoke like that in Portugal." }
      - { speaker: "Josué", es: "Oxente! Aqui no Maranhão a gente conjuga o tu direitinho, visse?", en: "Of course! Here in Maranhão we conjugate tu properly, you know?" }
      - { speaker: "Bia", es: "Bah, que tri! Lá no Sul a gente usa tu, mas fala “tu vai”.", en: "Wow, that's great! Down South we use tu, but we say 'tu vai'." }
      - { speaker: "Ana", es: "E eu, paulista, só uso você. Cada um com o seu sotaque.", en: "And me, from São Paulo, I only use você. Each to their own accent." }
      - { speaker: "Josué", es: "Segurem firme agora, que a estrada é cheia de areia. Vamos devagarinho.", en: "Hold on tight now, the road is full of sand. We'll go nice and slowly." }
      - { speaker: "Bia", es: "Vixe, quase caí! Falta muito?", en: "Whoa, I nearly fell! Is it much further?" }
      - { speaker: "Josué", es: "Falta nada, já é pertinho. Quando a gente arrodear aquela duna, tu vais ver a Lagoa Azul.", en: "Hardly at all, it's really close. When we go round that dune, you'll see the Blue Lagoon." }
      - { speaker: "Ana", es: "Eita, que água mais azul! Valeu a pena acordar cedinho.", en: "Wow, what blue water! It was worth getting up really early." }
      - { speaker: "Josué", es: "Arretado, né? Agora, um mergulhinho rapidinho e depois um cafezinho com tapioca.", en: "Brilliant, right? Now, a quick little dip and then a coffee with tapioca." }
    questions:
      - { q: "Por que a Ana estranhou o jeito de falar do Josué?", options: ["Porque ele falou muito rápido", "Porque ele usou tu com o verbo conjugado", "Porque ele falou em inglês"], answer: 1, explain: "Ana is surprised by tu conheces: in Maranhão tu is used with the standard verb form." }
      - { q: "Como a Bia usa o tu no Sul?", options: ["Com o verbo na terceira pessoa: tu vai", "Ela não usa tu", "Exatamente como o Josué: tu vais"], answer: 0, explain: "Bia says that in the South people say tu vai, with the third-person verb." }
      - { q: "Por que eles vão devagarinho?", options: ["Porque estão com medo", "Porque a estrada é cheia de areia", "Porque a jardineira está quebrada"], answer: 1, explain: "Josué says a estrada é cheia de areia, so they go slowly." }
      - { q: "O que vão fazer depois do mergulho?", options: ["Voltar para a cidade", "Tomar um cafezinho com tapioca", "Subir outra duna"], answer: 1, explain: "Um mergulhinho rapidinho e depois um cafezinho com tapioca." }
writing:
  - task: "Your flight from São Luís was cancelled and you'll be back late. Write the news twice: first as a WhatsApp message to a friend, then as a formal email to your boss."
    min: 80
    max: 140
    use: [w.atenciosamente, w.prezado, w.formal, w.coloquial, w.cancelar]
    useAtLeast: 3
    grammar: [g.register-formal-informal]
    expect:
      - { pattern: '\b(prezad[oa]|atenciosamente|cordialmente|informo|comunico)\b', hint: "Write the formal version: Prezado…, informo que…, Atenciosamente." }
      - { pattern: '(?<!\p{L})(t[oô]|t[aá]|pra|c[eê]|beleza|valeu|mano|galera)(?!\p{L})', hint: "Write the informal version with spoken forms: tô, pra, valeu…" }
    model: { es: "Mensagem coloquial: E aí, Lu! Tô preso em São Luís, cancelaram o meu voo. Só volto na terça, beleza? Avisa a galera. Valeu, um abraço! E-mail formal: Prezado Senhor Carlos, informo que o meu voo de São Luís para São Paulo foi cancelado devido ao mau tempo. Por esse motivo, não poderei comparecer ao escritório na segunda-feira. Retornarei na terça-feira pela manhã. Peço desculpas e coloco-me à disposição para trabalhar de casa na segunda-feira, se for realmente necessário. Atenciosamente, Ana Souza.", en: "Informal message: Hey, Lu! I'm stuck in São Luís, they cancelled my flight. I'm only back on Tuesday, OK? Tell the gang. Thanks, hugs! Formal email: Dear Mr Carlos, I am writing to inform you that my flight from São Luís to São Paulo has been cancelled due to bad weather. For this reason, I will not be able to attend the office on Monday. I will return on Tuesday morning. I apologise and am available to work from home on Monday if it is really necessary. Kind regards, Ana Souza." }
  - task: "A friend from the Northeast sends you a message full of regional words. Reply in the same style, then explain some of the expressions in standard Portuguese."
    es: "Oxente, visse! Tu tá aperreado? Vixe, fiquei avexado com a tua demora. Arretado o passeio de ontem, né?"
    min: 80
    max: 140
    use: [w.oxente, w.vixe, w.arretado, w.aperreado, w.avexado]
    useAtLeast: 3
    grammar: [g.regional-features-brazil]
    expect:
      - { pattern: '(oxente|vixe|eita|arretad|aperread|avexad|visse|abestad)', hint: "Use some north-eastern words: oxente, vixe, arretado…" }
      - { pattern: '\b(quer dizer|significa|[eé] o mesmo que|ou seja)\b', hint: "Explain the expressions: … quer dizer …" }
    model: { es: "Oxente, aperreado nada! Tava só na praia, sem sinal. Vixe, desculpa a demora! E o passeio foi arretado mesmo, visse? Para quem não é do Nordeste, aperreado quer dizer preocupado ou com problemas, e arretado significa ótimo, muito bom. Já avexado quer dizer com pressa ou ansioso, e oxente é uma expressão de surpresa, como nossa. Vixe também mostra surpresa, mas muitas vezes com um pouco de medo. Eita também é muito usado quando alguma coisa nos surpreende de verdade.", en: "Oxente, I'm not worried at all! I was just at the beach, with no signal. Vixe, sorry for the delay! And the trip really was great, you know? For anyone who isn't from the Northeast: aperreado means worried or in trouble, and arretado means great, really good. Avexado means in a hurry or anxious, and oxente is an expression of surprise, like nossa. Vixe also shows surprise, but often with a bit of fear. Eita is also widely used when something really surprises us." }
  - task: "Write a message to a friend from your trip, using diminutives and augmentatives with nuance (pertinho, rapidinho, um pouquinho, um casarão…)."
    min: 80
    max: 140
    use: [w.rapidinho, w.pertinho, w.pouquinho, w.cedinho, w.casarão]
    useAtLeast: 3
    grammar: [g.diminutives-augmentatives]
    expect:
      - { pattern: '\b[a-zà-ú]+(inho|inha|inhos|inhas|zinho|zinha|zinhos|zinhas)\b', hint: "Use diminutives: rapidinho, pertinho, um pouquinho…" }
