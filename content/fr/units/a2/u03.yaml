    texts:
      - title: "Journal d'Étretat"
        es: ["Hier, c'était une journée parfaite.", "Il faisait beau et la mer était calme.", "Du haut de la falaise, il y avait une vue magnifique sur l'Aiguille."]
        en: ["Yesterday was a perfect day.", "The weather was lovely and the sea was calm.", "From the top of the cliff, there was a magnificent view of the Needle."]
        grammar: [g.c-etait]
        vocab: [w.falaise, w.aiguille]
      - title: "Message de Léa"
        es: ["La promenade sur la falaise ? C'était magnifique !", "Mais il y avait beaucoup de vent : j'ai perdu mon chapeau !", "Maintenant, il est dans la mer, avec les mouettes."]
        en: ["The walk along the cliff? It was magnificent!", "But it was very windy: I lost my hat!", "Now it's in the sea, with the seagulls."]
