id: r.a2.les-crepes-de-mamie
level: a2
title: Les crêpes de Mamie
kind: text
intro: Maël, from Quimper in Brittany, shares his grandmother's crêpe recipe on his cooking blog. Notice the imperative (mélangez, ajoutez, versez).
allow: [maël, mamie, centre, blog, chandeleur, nutella]
paragraphs:
  - { es: "En Bretagne, on mange des crêpes et des galettes depuis des siècles. La galette est salée : on la fait avec de la farine de sarrasin, et on la mange avec du jambon, du fromage ou un œuf. La crêpe est sucrée : on la fait avec de la farine de blé. Voici la recette des crêpes de ma grand-mère, à Quimper. Elle est facile et rapide !", en: "In Brittany people have eaten crêpes and galettes for centuries. The galette is savoury: it's made with buckwheat flour and eaten with ham, cheese or an egg. The crêpe is sweet: it's made with wheat flour. Here's my grandmother's crêpe recipe, from Quimper. It's easy and quick!" }
  - { es: "Pour quinze crêpes, il faut : deux cent cinquante grammes de farine, quatre œufs, un demi-litre de lait, cinquante grammes de beurre, une cuillère de sucre et une pincée de sel.", en: "For fifteen crêpes you need: two hundred and fifty grams of flour, four eggs, half a litre of milk, fifty grams of butter, a spoonful of sugar and a pinch of salt." }
  - { es: "D'abord, mettez la farine dans un grand bol. Ajoutez le sucre et le sel. Faites un trou au milieu et cassez les œufs dedans. Mélangez doucement avec une cuillère en bois.", en: "First, put the flour in a big bowl. Add the sugar and the salt. Make a hole in the middle and break the eggs into it. Mix gently with a wooden spoon." }
  - { es: "Ensuite, versez le lait petit à petit et mélangez bien. Attention : ne versez pas tout le lait en une fois ! La pâte doit être lisse, sans boules. Faites fondre le beurre et ajoutez-le à la pâte. Laissez reposer la pâte une heure.", en: "Next, pour in the milk little by little and mix well. Careful: don't pour all the milk in at once! The batter should be smooth, without lumps. Melt the butter and add it to the batter. Leave the batter to rest for an hour." }
  - { es: "Faites chauffer une poêle avec un peu de beurre. Versez une petite louche de pâte et tournez vite la poêle : la pâte doit couvrir toute la poêle. Après une minute, retournez la crêpe. Ma grand-mère la fait sauter en l'air, mais si vous êtes débutant, utilisez une spatule !", en: "Heat a frying pan with a little butter. Pour in a small ladle of batter and turn the pan quickly: the batter must cover the whole pan. After a minute, flip the crêpe. My grandmother tosses it in the air, but if you're a beginner, use a spatula!" }
  - { es: "Servez les crêpes chaudes avec du sucre, de la confiture, du miel ou du chocolat. Mon conseil : essayez-les avec du caramel au beurre salé, c'est la spécialité de la Bretagne. Et buvez du cidre avec, bien sûr !", en: "Serve the crêpes hot with sugar, jam, honey or chocolate. My advice: try them with salted butter caramel, Brittany's speciality. And drink cider with them, of course!" }
  - { es: "Une petite tradition : le 2 février, c'est la Chandeleur, la fête des crêpes. Ce jour-là, on fait sauter la première crêpe avec une pièce d'or ou un euro dans la main. Si la crêpe retombe bien dans la poêle, on aura de l'argent toute l'année. Chez nous, la première crêpe tombe toujours par terre… et c'est le chien qui la mange !", en: "A little tradition: the 2nd of February is Candlemas, the crêpe festival. On that day you toss the first crêpe with a gold coin or a euro in your hand. If the crêpe lands back in the pan, you'll have money all year. At our house the first crêpe always falls on the floor… and the dog eats it!" }
questions:
  - { q: "Quelle est la différence entre une galette et une crêpe ?", options: ["La galette est salée, la crêpe est sucrée", "La galette est plus petite", "La crêpe se mange le soir"], answer: 0, explain: "The galette is savoury, made with buckwheat (sarrasin); the crêpe is sweet, made with wheat (blé)." }
  - { q: "Combien d'œufs faut-il pour quinze crêpes ?", options: ["Deux", "Quatre", "Quinze"], answer: 1, explain: "«Quatre œufs, un demi-litre de lait…»" }
  - { q: "Pourquoi ne faut-il pas verser tout le lait en une fois ?", options: ["Pour avoir une pâte lisse, sans boules", "Parce que le lait est froid", "Parce que la pâte doit être épaisse"], answer: 0, explain: "«La pâte doit être lisse, sans boules» – adding the milk little by little avoids lumps." }
  - { q: "Combien de temps la pâte doit-elle reposer ?", options: ["Cinq minutes", "Une heure", "Toute la nuit"], answer: 1, explain: "«Laissez reposer la pâte une heure.»" }
  - { q: "Que se passe-t-il chez Maël à la Chandeleur ?", options: ["Il gagne de l'argent", "La première crêpe tombe et le chien la mange", "Sa grand-mère ne fait pas de crêpes"], answer: 1, explain: "«La première crêpe tombe toujours par terre… et c'est le chien qui la mange !»" }
glossary:
  - { es: pincée, en: pinch }
  - { es: trou, en: hole }
  - { es: "petit à petit", en: little by little }
  - { es: lisse, en: smooth }
  - { es: fondre, en: to melt }
  - { es: louche, en: ladle }
  - { es: couvrir, en: to cover }
  - { es: "fait sauter", en: "tosses (faire sauter = to toss a crêpe)" }
  - { es: débutant, en: beginner }
  - { es: spatule, en: spatula }
  - { es: miel, en: honey }
  - { es: spécialité, en: speciality }
  - { es: milieu, en: middle }
  - { es: retombe, en: "lands back, falls back" }
  - { es: "par terre", en: on the floor }
