id: r.b2.i-trulli-di-alberobello
level: b2
title: I trulli di Alberobello
kind: text
intro: A guidebook-style text on the trulli of Alberobello, in Puglia, and the curious story behind them. Notice the formal relative pronouns (il quale, la quale, i quali), del quale/della quale, and the compound gerund (avendo costruito, essendo stati).
allow: [alberobello, puglia, conversano, acquaviva, aragona, giangirolamo, monti, aia, piccola, trullo, sovrano, murgia, ferdinando, borbone, unesco, itria]
paragraphs:
  - { es: "Chi arriva ad Alberobello per la prima volta ha l'impressione di essere entrato in una fiaba. Sulle due colline del paese si alzano più di mille piccole case bianche, ciascuna delle quali è coperta da un tetto a forma di cono, fatto di pietre grigie. Sono i trulli, costruzioni tipiche di questa parte della Puglia, la Valle d'Itria, le quali dal 1996 fanno parte del Patrimonio dell'Umanità dell'UNESCO.", en: "Anyone arriving in Alberobello for the first time feels as if they've walked into a fairy tale. On the town's two hills stand more than a thousand little white houses, each of which is covered by a cone-shaped roof made of grey stones. These are the trulli, buildings typical of this part of Puglia, the Itria Valley, which have been a UNESCO World Heritage Site since 1996." }
  - { es: "La caratteristica più sorprendente dei trulli è la tecnica con la quale sono stati costruiti: «a secco», cioè senza malta né cemento. Le pietre calcaree, che i contadini trovavano nei campi, venivano tagliate e sistemate in cerchi sempre più piccoli, uno sopra l'altro, fino a chiudere il tetto. In cima veniva messa una pietra decorativa, il cosiddetto «pinnacolo», il cui significato non è mai stato chiarito del tutto.", en: "The most surprising feature of the trulli is the technique by which they were built: 'dry', that is, without mortar or cement. The limestone blocks, which the farmers found in the fields, were cut and arranged in smaller and smaller circles, one above the other, until the roof was closed. On the top a decorative stone was placed, the so-called 'pinnacle', whose meaning has never been fully explained." }
  - { es: "Ma perché costruire case senza malta? La risposta, secondo la tradizione, è una storia di tasse. Nel Seicento queste terre appartenevano ai conti di Conversano, i quali, per ogni nuovo insediamento, avrebbero dovuto pagare un tributo al re di Napoli. Il conte Giangirolamo II, detto «il Guercio», avendo trovato un modo per evitarlo, ordinò ai contadini di costruire solo case a secco, che potessero essere smontate rapidamente.", en: "But why build houses without mortar? The answer, according to tradition, is a story about taxes. In the seventeenth century these lands belonged to the Counts of Conversano, who, for every new settlement, would have had to pay a levy to the King of Naples. Count Giangirolamo II, known as 'il Guercio' (the One-Eyed), having found a way to avoid it, ordered the farmers to build only dry-stone houses that could be dismantled quickly." }
  - { es: "Si racconta che, ogni volta che arrivavano gli ispettori del re, i contadini, essendo stati avvisati in anticipo, smontassero i tetti in poche ore. Gli ispettori trovavano così soltanto mucchi di pietre, nei quali era impossibile riconoscere un paese. Partiti gli ispettori, i trulli venivano ricostruiti. Non sappiamo quanto di questa storia sia vero, ma è quella che ogni abitante di Alberobello racconta con orgoglio.", en: "It's said that whenever the king's inspectors arrived, the farmers, having been warned in advance, would take the roofs apart in a few hours. All the inspectors found were piles of stones, in which it was impossible to recognise a village. Once the inspectors had left, the trulli were rebuilt. We don't know how much of this story is true, but it's the one every inhabitant of Alberobello tells with pride." }
  - { es: "La situazione cambiò nel 1797, quando gli abitanti, stanchi del potere dei conti, chiesero aiuto al re Ferdinando IV di Borbone, il quale concesse ad Alberobello la libertà dal dominio feudale. Da quel momento fu possibile costruire anche con la malta, e il paese crebbe rapidamente.", en: "The situation changed in 1797 when the inhabitants, tired of the counts' power, asked for help from King Ferdinand IV of Bourbon, who granted Alberobello freedom from feudal rule. From then on it was possible to build with mortar too, and the town grew quickly." }
  - { es: "Oggi i trulli si concentrano soprattutto in due quartieri: il Rione Monti, più turistico, nel quale quasi ogni trullo ospita un negozio o un ristorante, e l'Aia Piccola, più tranquillo, dove molte famiglie vivono ancora. Merita una visita il Trullo Sovrano, l'unico su due piani, all'interno del quale si può vedere com'era la vita di una famiglia ricca dell'Ottocento.", en: "Today the trulli are concentrated mainly in two districts: Rione Monti, the more touristy one, in which almost every trullo houses a shop or a restaurant, and Aia Piccola, quieter, where many families still live. The Trullo Sovrano is worth a visit, the only one with two floors, inside which you can see what life was like for a wealthy nineteenth-century family." }
  - { es: "Un consiglio per chi volesse fermarsi: si può dormire in un trullo. D'estate è fresco, grazie ai muri spessi più di un metro; d'inverno, con il camino acceso, è caldo e accogliente. Svegliarsi sotto un tetto di pietra costruito, forse, per ingannare il re è un'esperienza che difficilmente si dimentica.", en: "A tip for anyone who wants to stay: you can sleep in a trullo. In summer it's cool, thanks to walls more than a metre thick; in winter, with the fire lit, it's warm and cosy. Waking up under a stone roof built, perhaps, to deceive the king is an experience you won't easily forget." }
questions:
  - { q: "Che cosa hanno di speciale i tetti dei trulli?", options: ["Sono piatti e coperti di tegole rosse", "Hanno la forma di un cono e sono fatti di pietre grigie", "Sono di legno"], answer: 1, explain: "Each trullo is covered «da un tetto a forma di cono, fatto di pietre grigie»." }
  - { q: "Che cosa significa costruire «a secco»?", options: ["Costruire d'estate", "Costruire senza malta né cemento", "Costruire senza acqua corrente"], answer: 1, explain: "Dry-stone building: stones are stacked without mortar." }
  - { q: "Perché, secondo la tradizione, il conte voleva case che si potessero smontare?", options: ["Per evitare di pagare un tributo al re", "Perché c'erano molti terremoti", "Per spostarle in un altro paese"], answer: 0, explain: "New settlements meant paying a levy to the King of Naples; dismantled houses didn't count." }
  - { q: "Che cosa successe nel 1797?", options: ["I trulli diventarono patrimonio UNESCO", "Il re concesse ad Alberobello la libertà dal dominio feudale", "Il Trullo Sovrano fu distrutto"], answer: 1, explain: "Ferdinand IV freed the town from the counts' feudal rule; building with mortar became possible." }
  - { q: "Nella frase «ciascuna delle quali è coperta da un tetto», a che cosa si riferisce «delle quali»?", options: ["Alle colline", "Alle case bianche", "Alle pietre"], answer: 1, explain: "Delle quali refers back to le piccole case bianche (feminine plural)." }
