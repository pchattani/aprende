id: b2.u02
title: Pasados del subjuntivo
lessons:
  - id: b2.u02.l1
    title: Me alegro de que hayas venido
    teach: [g.subjunctive-perfect]
    vocab: [w.parlamento, w.reforma, w.sindicato, w.salario-minimo, w.difundir, w.viral, w.hacerse-viral, w.verificar, w.contrastar, w.desmentir, w.manipular, w.manipulacion, w.libertad-de-prensa, w.escandalo, w.corrupcion, w.corrupto, w.juicio, w.condena, w.condenar, w.tribunal, w.fiscal, w.sentencia, w.sondeo, w.votacion, w.indignacion, w.indignarse]
    tip: "haya, hayas, haya, hayamos, hayáis, hayan + participle: for something already completed when the trigger is in the present. Me alegro de que hayas venido."
    sentences:
      - { es: "Me alegro de que el parlamento haya aprobado por fin la reforma.", en: "I'm glad that parliament has finally passed the reform.", altEs: ["Me alegro de que el parlamento por fin haya aprobado la reforma."], grammar: [g.subjunctive-perfect], vocab: [w.parlamento, w.reforma, w.aprobar, w.alegrarse] }
      - { es: "Es una pena que los sindicatos no hayan llegado a un acuerdo sobre el salario mínimo.", en: "It's a shame that the unions haven't reached an agreement on the minimum wage.", altEn: ["It's a pity the unions haven't reached an agreement on the minimum wage."], grammar: [g.subjunctive-perfect], vocab: [w.sindicato, w.salario-minimo, w.acuerdo, w.pena] }
      - { es: "¿No te parece raro que la noticia se haya hecho viral en solo dos horas?", en: "Don't you find it strange that the news went viral in only two hours?", altEs: ["¿No te parece extraño que la noticia se haya hecho viral en solo dos horas?"], grammar: [g.subjunctive-perfect], vocab: [w.hacerse-viral, w.noticia, w.raro] }
      - { es: "Dudo que hayan verificado la información antes de publicarla.", en: "I doubt they verified the information before publishing it.", altEs: ["Dudo que hayan comprobado la información antes de publicarla."], grammar: [g.subjunctive-perfect, g.subjunctive-doubt], vocab: [w.verificar, w.informacion, w.publicar] }
      - { es: "Es posible que la cadena haya manipulado las fotos.", en: "It's possible that the channel has manipulated the photos.", altEs: ["Puede que la cadena haya manipulado las fotos."], grammar: [g.subjunctive-perfect, g.subjunctive-impersonal], vocab: [w.manipular, w.cadena, w.foto] }
      - { es: "Me indigna que el tribunal haya condenado al periodista y no al político corrupto.", en: "It outrages me that the court has convicted the journalist and not the corrupt politician.", altEn: ["I'm outraged that the court convicted the journalist and not the corrupt politician."], grammar: [g.subjunctive-perfect, g.subjunctive-emotion], vocab: [w.indignarse, w.tribunal, w.condenar, w.corrupto, w.periodista] }
      - { es: "Espero que la fiscal haya presentado todas las pruebas.", en: "I hope the prosecutor has presented all the evidence.", grammar: [g.subjunctive-perfect], vocab: [w.fiscal, w.prueba, w.presentar] }
      - { es: "¡Qué bien que el gobierno haya desmentido el rumor tan rápido!", en: "How good that the government denied the rumour so quickly!", altEs: ["¡Qué bien que el gobierno haya desmentido el rumor tan deprisa!"], grammar: [g.subjunctive-perfect], vocab: [w.desmentir, w.rumor, w.gobierno] }
      - { es: "Es increíble que nadie haya contrastado los datos del sondeo.", en: "It's incredible that nobody has cross-checked the data from the poll.", grammar: [g.subjunctive-perfect, g.indefinite-pronouns], vocab: [w.contrastar, w.sondeo, w.dato] }
      - { es: "No es cierto que la oposición haya rechazado la ley; ha pedido más tiempo para la votación.", en: "It's not true that the opposition has rejected the law; it has asked for more time before the vote.", grammar: [g.subjunctive-perfect], vocab: [w.oposicion, w.rechazar, w.ley, w.votacion] }
      - { es: "Ojalá la sentencia haya sido justa, aunque lo dudo.", en: "I hope the ruling was fair, although I doubt it.", grammar: [g.subjunctive-perfect, g.subjunctive-wishes], vocab: [w.sentencia, w.justo, w.dudar] }
      - { es: "Que la condena haya sido tan corta provocó la indignación de las víctimas.", en: "The fact that the sentence was so short provoked the victims' outrage.", altEs: ["El hecho de que la condena haya sido tan corta provocó la indignación de las víctimas."], grammar: [g.subjunctive-perfect], vocab: [w.condena, w.indignacion, w.victima, w.provocar] }
      - { es: "El escándalo de corrupción se ha difundido por todas las redes, pero no hay nada que lo haya confirmado.", en: "The corruption scandal has spread across all the social networks, but nothing has confirmed it.", altEs: ["El escándalo de corrupción se ha difundido por todas las redes, pero nada lo ha confirmado."], grammar: [g.subjunctive-perfect, g.relative-subjunctive], vocab: [w.escandalo, w.corrupcion, w.difundir, w.confirmar] }
      - { es: "Sin libertad de prensa, es imposible que un país haya tenido elecciones de verdad.", en: "Without freedom of the press, it's impossible for a country to have had real elections.", grammar: [g.subjunctive-perfect, g.subjunctive-impersonal], vocab: [w.libertad-de-prensa, w.elecciones, w.pais] }
      - { es: "Me alegro de que hayas venido.", en: "I'm glad you've come.", altEs: ["Me alegra que hayas venido."], grammar: [g.subjunctive-perfect], vocab: [w.alegrarse, w.venir], error: { wrong: "Me alegro de que has venido.", explain: "Emotion verbs trigger the subjunctive; for a completed action use the perfect subjunctive: hayas venido.", grammar: g.subjunctive-perfect } }
      - { es: "Han aprobado la reforma. ¡Qué bien!", en: "They've passed the reform. Great!", grammar: [g.subjunctive-perfect, g.present-perfect], vocab: [w.aprobar, w.reforma], transform: { instruction: "Combine both ideas starting with Me alegro de que…", answer: "Me alegro de que hayan aprobado la reforma.", alt: ["Me alegra que hayan aprobado la reforma."] } }
    exchanges:
      - q: { es: "¿Has visto el escándalo de la portada de hoy?", en: "Have you seen the scandal on today's front page?" }
        a: { es: "Sí, pero dudo que hayan contrastado las fuentes.", en: "Yes, but I doubt they've cross-checked the sources." }
        alt: ["Sí, pero dudo que hayan verificado las fuentes.", "Sí, y me indigna que lo hayan publicado sin pruebas."]
        grammar: [g.subjunctive-perfect]
        vocab: [w.escandalo, w.contrastar, w.fuente]
      - q: { es: "¿Crees que la ley saldrá adelante?", en: "Do you think the law will go through?" }
        a: { es: "No creo que la oposición haya cambiado de opinión, así que no.", en: "I don't think the opposition has changed its mind, so no." }
        alt: ["No creo que la oposición haya cambiado de opinión.", "Es posible que la hayan aprobado ya."]
        grammar: [g.subjunctive-perfect]
        vocab: [w.oposicion, w.ley]
      - q: { es: "El vídeo ya tiene un millón de visitas.", en: "The video already has a million views." }
        a: { es: "No me extraña que se haya hecho viral: es indignante.", en: "I'm not surprised it went viral: it's outrageous." }
        alt: ["No me extraña que se haya hecho viral.", "Pues dudo que alguien haya verificado si es real."]
        grammar: [g.subjunctive-perfect]
        vocab: [w.hacerse-viral, w.indignante]
      - q: { es: "¿Te alegras de que hayan condenado al antiguo ministro?", en: "Are you glad they've convicted the former minister?" }
        a: { es: "Me alegro de que haya habido juicio; la condena me parece corta.", en: "I'm glad there was a trial; the sentence seems short to me." }
        alt: ["Me alegro de que haya habido juicio.", "Sí, aunque la condena me parece corta."]
        grammar: [g.subjunctive-perfect]
        vocab: [w.condenar, w.juicio, w.condena]
    texts:
      - title: "Titular y entrada"
        es: ["El parlamento aprueba la reforma laboral tras diez horas de debate.", "Los sindicatos celebran que se haya subido el salario mínimo, aunque lamentan que no se haya incluido a los autónomos.", "La oposición ya ha anunciado que votará en contra en el Senado."]
        en: ["Parliament passes the labour reform after ten hours of debate.", "The unions welcome the fact that the minimum wage has been raised, although they regret that the self-employed have not been included.", "The opposition has already announced that it will vote against in the Senate."]
        grammar: [g.subjunctive-perfect]
        vocab: [w.parlamento, w.reforma, w.sindicato, w.salario-minimo]
  - id: b2.u02.l2
    title: No sabía que hubieras estado allí
    teach: [g.subjunctive-pluperfect]
    vocab: [w.imperio, w.conquista, w.conquistar, w.conquistador, w.colonia, w.colonial, w.independencia, w.revolucion, w.dictadura, w.dictador, w.democracia, w.indigena, w.mestizo, w.criollo, w.inca, w.maya, w.azteca, w.europeo, w.civilizacion, w.piramide, w.templo, w.oro, w.plata, w.esclavo, w.esclavitud, w.libertador, w.legado, w.mito, w.heroe, w.arqueologo, w.atraer]
    tip: "hubiera / hubiese + participle: an action completed before a past trigger. No sabía que hubieras estado en Perú. Also after como si for an earlier action."
    sentences:
      - { es: "No sabía que hubieras estado en México antes de la boda.", en: "I didn't know you had been to Mexico before the wedding.", altEs: ["No sabía que hubieses estado en México antes de la boda."], grammar: [g.subjunctive-pluperfect], vocab: [w.boda, w.saber] }
      - { es: "Me sorprendió que los incas hubieran construido ciudades tan altas sin conocer la rueda.", en: "It surprised me that the Incas had built such high cities without knowing the wheel.", altEs: ["Me sorprendió que los incas hubiesen construido ciudades tan altas sin conocer la rueda."], grammar: [g.subjunctive-pluperfect], vocab: [w.inca, w.construir, w.rueda] }
      - { es: "Era increíble que una civilización entera hubiera desaparecido tan rápido tras la conquista.", en: "It was incredible that an entire civilisation had disappeared so quickly after the conquest.", altEs: ["Era increíble que una civilización entera hubiese desaparecido tan rápido tras la conquista."], grammar: [g.subjunctive-pluperfect], vocab: [w.civilizacion, w.conquista, w.desaparecer] }
      - { es: "Me molestó que el museo no hubiera mencionado la esclavitud en toda la exposición.", en: "It annoyed me that the museum hadn't mentioned slavery in the whole exhibition.", altEs: ["Me molestó que el museo no hubiese mencionado la esclavitud en toda la exposición."], grammar: [g.subjunctive-pluperfect, g.subjunctive-emotion], vocab: [w.esclavitud, w.mencionar, w.exposicion] }
      - { es: "No había pruebas de que el oro hubiera salido del templo antes de la llegada de los conquistadores.", en: "There was no evidence that the gold had left the temple before the conquistadors arrived.", altEs: ["No había pruebas de que el oro hubiese salido del templo antes de la llegada de los conquistadores."], grammar: [g.subjunctive-pluperfect], vocab: [w.oro, w.templo, w.conquistador, w.prueba] }
      - { es: "Era lógico que, tras tres siglos de colonia, los criollos hubieran querido la independencia.", en: "It was logical that, after three centuries as a colony, the creoles had wanted independence.", altEs: ["Era lógico que, tras tres siglos de colonia, los criollos hubiesen querido la independencia."], grammar: [g.subjunctive-pluperfect], vocab: [w.colonia, w.criollo, w.logico] }
      - { es: "No sabía que a Bolívar lo hubieran llamado «el Libertador» ya en vida.", en: "I didn't know they had called Bolívar 'the Liberator' already in his lifetime.", altEs: ["No sabía que a Bolívar lo hubiesen llamado «el Libertador» ya en vida."], grammar: [g.subjunctive-pluperfect, g.direct-object-pronouns], vocab: [w.libertador, w.llamar, w.vida] }
      - { es: "Parecía imposible que una dictadura tan larga hubiera terminado con una votación tan simple.", en: "It seemed impossible that such a long dictatorship had ended with such a simple vote.", altEs: ["Parecía imposible que una dictadura tan larga hubiese terminado con una votación tan simple."], grammar: [g.subjunctive-pluperfect], vocab: [w.dictadura, w.votacion, w.simple] }
      - { es: "Me alegré de que la democracia hubiera vuelto antes de que naciera mi hija.", en: "I was glad democracy had returned before my daughter was born.", altEs: ["Me alegré de que la democracia hubiese vuelto antes de que naciera mi hija."], grammar: [g.subjunctive-pluperfect, g.subjunctive-imperfect], vocab: [w.democracia, w.volver, w.nacer] }
      - { es: "Nadie imaginaba que el mito de la ciudad de oro hubiera atraído a tantos hombres a la selva.", en: "Nobody imagined that the myth of the city of gold had drawn so many men into the jungle.", altEs: ["Nadie imaginaba que el mito de la ciudad de oro hubiese atraído a tantos hombres a la selva."], grammar: [g.subjunctive-pluperfect], vocab: [w.mito, w.atraer, w.selva] }
      - { es: "Como si no hubiera pasado nada, el dictador siguió hablando de libertad.", en: "As if nothing had happened, the dictator went on talking about freedom.", altEs: ["Como si no hubiese pasado nada, el dictador siguió hablando de libertad."], grammar: [g.subjunctive-pluperfect, g.como-si], vocab: [w.dictador, w.libertad, w.seguir] }
      - { es: "¿Te extrañó que los arqueólogos no hubieran encontrado plata en la pirámide?", en: "Were you surprised that the archaeologists hadn't found silver in the pyramid?", altEs: ["¿Te extrañó que los arqueólogos no hubiesen encontrado plata en la pirámide?"], grammar: [g.subjunctive-pluperfect], vocab: [w.arqueologo, w.plata, w.piramide, w.extranar] }
      - { es: "El legado de la revolución fue enorme, pero pocos esperaban que hubiera costado tantas vidas.", en: "The legacy of the revolution was enormous, but few expected it to have cost so many lives.", altEs: ["El legado de la revolución fue enorme, pero pocos esperaban que hubiese costado tantas vidas."], grammar: [g.subjunctive-pluperfect], vocab: [w.legado, w.revolucion, w.costar] }
      - { es: "La sociedad colonial era mestiza e indígena, y me pareció raro que la película no hubiera mostrado a sus héroes.", en: "Colonial society was mestizo and indigenous, and I found it odd that the film hadn't shown its heroes.", altEs: ["La sociedad colonial era mestiza e indígena, y me pareció raro que la película no hubiese mostrado a sus héroes."], grammar: [g.subjunctive-pluperfect], vocab: [w.colonial, w.mestizo, w.indigena, w.heroe, w.mostrar] }
      - { es: "Me sorprendió que ya hubieran terminado el imperio y sus guerras.", en: "It surprised me that the empire and its wars had already ended.", altEs: ["Me sorprendió que ya hubiesen terminado el imperio y sus guerras."], grammar: [g.subjunctive-pluperfect], vocab: [w.imperio, w.guerra], error: { wrong: "Me sorprendió que ya hayan terminado el imperio y sus guerras.", explain: "The trigger is in the past (sorprendió), so the earlier action needs the pluperfect subjunctive: hubieran terminado.", grammar: g.subjunctive-pluperfect } }
      - { es: "No sabía que habías vivido en Lima.", en: "I didn't know you had lived in Lima.", grammar: [g.subjunctive-pluperfect, g.pluperfect], vocab: [w.vivir, w.saber], transform: { instruction: "Rephrase with the pluperfect subjunctive", answer: "No sabía que hubieras vivido en Lima.", alt: ["No sabía que hubieses vivido en Lima."] } }
    exchanges:
      - q: { es: "¿Sabías que Ana había vivido en Bogotá?", en: "Did you know Ana had lived in Bogotá?" }
        a: { es: "No, no tenía ni idea de que hubiera vivido allí.", en: "No, I had no idea she had lived there." }
        alt: ["No, no tenía ni idea de que hubiese vivido allí.", "Sí, me lo contó ella misma."]
        grammar: [g.subjunctive-pluperfect]
        vocab: [w.vivir, w.sueno.plan]
      - q: { es: "¿Qué fue lo que más te sorprendió del museo?", en: "What surprised you most about the museum?" }
        a: { es: "Que los mayas hubieran escrito libros antes que muchos europeos.", en: "That the Maya had written books before many Europeans." }
        alt: ["Que los mayas hubiesen escrito libros antes que muchos europeos.", "La cantidad de oro que había."]
        grammar: [g.subjunctive-pluperfect]
        vocab: [w.maya, w.europeo, w.libro]
      - q: { es: "¿Por qué se enfadó el guía?", en: "Why did the guide get angry?" }
        a: { es: "Porque le molestó que un turista hubiera tocado la pirámide.", en: "Because it annoyed him that a tourist had touched the pyramid." }
        alt: ["Porque le molestó que un turista hubiese tocado la pirámide.", "Porque un turista tocó la pirámide."]
        grammar: [g.subjunctive-pluperfect]
        vocab: [w.piramide, w.guia, w.tocar]
      - q: { es: "¿Te extrañó que la película terminara con la independencia?", en: "Did it surprise you that the film ended with independence?" }
        a: { es: "No; lo raro fue que no hubiera mencionado a los indígenas.", en: "No; the strange thing was that it hadn't mentioned the indigenous people." }
        alt: ["No; lo raro fue que no hubiese mencionado a los indígenas.", "Un poco, sí."]
        grammar: [g.subjunctive-pluperfect]
        vocab: [w.indigena, w.independencia]
    texts:
      - title: "Pie de foto de una exposición"
        es: ["Templo maya, siglo IX.", "Los arqueólogos dudaban de que una ciudad tan grande hubiera existido en medio de la selva.", "Hoy sabemos que llegó a tener cien mil habitantes."]
        en: ["Maya temple, ninth century.", "Archaeologists doubted that such a large city had existed in the middle of the jungle.", "Today we know it came to have a hundred thousand inhabitants."]
        grammar: [g.subjunctive-pluperfect]
        vocab: [w.templo, w.maya, w.arqueologo, w.habitante]
  - id: b2.u02.l3
    title: Si hubiera sabido…
    teach: [g.si-clauses-past]
    vocab: [w.coincidencia, w.coincidir, w.azar, w.al-azar, w.cruzarse, w.acertar, w.acierto, w.por-poco, w.en-su-momento, w.rumbo, w.desaprovechar, w.rechazo, w.intercambio, w.echar-raices, w.a-la-larga, w.a-estas-alturas, w.cita-a-ciegas, w.flechazo, w.divorcio, w.ni-hablar]
    tip: "si + pluperfect subjunctive, + conditional perfect: Si hubiera sabido, habría venido. A present result takes the simple conditional: Si hubiera estudiado medicina, ahora sería médico."
    sentences:
      - { es: "Si hubiera sabido que venías, habría preparado algo de cenar.", en: "If I had known you were coming, I would have made something for dinner.", altEs: ["Si hubiese sabido que venías, habría preparado algo de cenar.", "Si hubiera sabido que venías, hubiera preparado algo de cenar."], grammar: [g.si-clauses-past], vocab: [w.preparar, w.cenar, w.saber] }
      - { es: "Si no hubiéramos perdido aquel tren, nunca nos habríamos conocido.", en: "If we hadn't missed that train, we would never have met.", altEs: ["Si no hubiésemos perdido aquel tren, nunca nos habríamos conocido."], grammar: [g.si-clauses-past], vocab: [w.perder, w.tren, w.conocer] }
      - { es: "¿Qué habría pasado si hubieras aceptado la beca en Buenos Aires?", en: "What would have happened if you had accepted the grant in Buenos Aires?", altEs: ["¿Qué habría pasado si hubieses aceptado la beca en Buenos Aires?"], grammar: [g.si-clauses-past], vocab: [w.beca, w.aceptar, w.pasar] }
      - { es: "Si hubiera estudiado Medicina, ahora sería médica y no abogada.", en: "If I had studied medicine, I would now be a doctor and not a lawyer.", altEs: ["Si hubiese estudiado Medicina, ahora sería médica y no abogada."], grammar: [g.si-clauses-past], vocab: [w.medicina, w.medico, w.abogado], note: "Past condition, present result: conditional simple (sería)." }
      - { es: "De haberlo sabido, no habría rechazado el intercambio.", en: "Had I known, I wouldn't have turned down the exchange programme.", altEs: ["Si lo hubiera sabido, no habría rechazado el intercambio."], grammar: [g.si-clauses-past], vocab: [w.intercambio, w.rechazar], note: "de + haber + participle = si hubiera… (formal)." }
      - { es: "Si no me hubiera cruzado con Elena en aquella cita a ciegas, hoy no estaríamos casados.", en: "If I hadn't crossed paths with Elena on that blind date, we wouldn't be married today.", altEs: ["Si no me hubiese cruzado con Elena en aquella cita a ciegas, hoy no estaríamos casados."], grammar: [g.si-clauses-past], vocab: [w.cruzarse, w.cita-a-ciegas, w.casado] }
      - { es: "Fue pura coincidencia: si hubiésemos escogido otro hotel, no habríamos coincidido.", en: "It was pure coincidence: if we had chosen another hotel, we wouldn't have run into each other.", altEs: ["Fue pura coincidencia: si hubiéramos escogido otro hotel, no habríamos coincidido."], grammar: [g.si-clauses-past], vocab: [w.puro, w.coincidencia, w.coincidir, w.escoger] }
      - { es: "Si hubieras acertado una sola pregunta más, habrías aprobado. ¡Por poco!", en: "If you had got just one more question right, you would have passed. So close!", altEs: ["Si hubieses acertado una sola pregunta más, habrías aprobado. ¡Por poco!"], grammar: [g.si-clauses-past], vocab: [w.acertar, w.por-poco, w.aprobar, w.pregunta] }
      - { es: "A estas alturas, si no hubiera echado raíces aquí, ya me habría ido a otro país.", en: "By now, if I hadn't put down roots here, I would already have left for another country.", altEs: ["A estas alturas, si no hubiese echado raíces aquí, ya me habría ido a otro país."], grammar: [g.si-clauses-past], vocab: [w.a-estas-alturas, w.echar-raices, w.ir] }
      - { es: "Si en su momento no hubiera desaprovechado aquella oportunidad, mi rumbo habría sido distinto.", en: "If at the time I hadn't wasted that opportunity, my path would have been different.", altEs: ["Si en su momento no hubiese desaprovechado aquella oportunidad, mi rumbo habría sido distinto."], grammar: [g.si-clauses-past], vocab: [w.en-su-momento, w.desaprovechar, w.rumbo, w.oportunidad] }
      - { es: "Si hubiera tenido más paciencia, el divorcio no habría llegado tan pronto.", en: "If he had had more patience, the divorce wouldn't have come so soon.", altEs: ["Si hubiese tenido más paciencia, el divorcio no habría llegado tan pronto."], grammar: [g.si-clauses-past], vocab: [w.ten-paciencia, w.divorcio] }
      - { es: "¿Habrías dicho que sí si te lo hubieran pedido en público? — ¡Ni hablar! Me habría muerto de vergüenza.", en: "Would you have said yes if they had asked you in public? — No way! I'd have died of embarrassment.", altEs: ["¿Habrías dicho que sí si te lo hubiesen pedido en público? — ¡Ni hablar! Me habría muerto de vergüenza."], grammar: [g.si-clauses-past], vocab: [w.ni-hablar, w.verguenza, w.publico, w.morir] }
      - { es: "Si hubiera contestado al azar, probablemente habría acertado más veces.", en: "If I had answered at random, I probably would have got it right more often.", altEs: ["Si hubiese contestado al azar, probablemente habría acertado más veces."], grammar: [g.si-clauses-past], vocab: [w.al-azar, w.acertar, w.contestar] }
      - { es: "Fue un flechazo, pero a la larga el rechazo de sus familias pudo con ellos; si hubieran vivido lejos, quizá habrían seguido juntos.", en: "It was love at first sight, but in the long run their families' rejection got the better of them; if they had lived far away, perhaps they would have stayed together.", altEs: ["Fue un flechazo, pero a la larga el rechazo de sus familias pudo con ellos; si hubiesen vivido lejos, quizá habrían seguido juntos."], grammar: [g.si-clauses-past], vocab: [w.flechazo, w.a-la-larga, w.rechazo, w.familia], note: "poder con alguien = to get the better of someone." }
      - { es: "Si hubiera sabido la verdad, no habría venido.", en: "If I had known the truth, I wouldn't have come.", altEs: ["Si hubiese sabido la verdad, no habría venido.", "Si hubiera sabido la verdad, no hubiera venido."], grammar: [g.si-clauses-past], vocab: [w.verdad, w.venir], error: { wrong: "Si habría sabido la verdad, no habría venido.", explain: "Never the conditional after si: the past unreal condition takes the pluperfect subjunctive, hubiera sabido.", grammar: g.si-clauses-past } }
      - { es: "No vi el cartel y me perdí.", en: "I didn't see the sign and I got lost.", grammar: [g.si-clauses-past, g.preterite-irregular], vocab: [w.cartel, w.perderse], transform: { instruction: "Turn it into a past unreal condition with si", answer: "Si hubiera visto el cartel, no me habría perdido.", alt: ["Si hubiese visto el cartel, no me habría perdido.", "Si hubiera visto el cartel, no me hubiera perdido."] } }
    exchanges:
      - q: { es: "¿Cómo conociste a tu pareja?", en: "How did you meet your partner?" }
        a: { es: "Por casualidad: si aquel día no hubiera llovido, no habría entrado en esa cafetería.", en: "By chance: if it hadn't rained that day, I wouldn't have gone into that café." }
        alt: ["Por casualidad: si aquel día no hubiese llovido, no habría entrado en esa cafetería.", "En una cita a ciegas, ¿te lo puedes creer?"]
        grammar: [g.si-clauses-past]
        vocab: [w.por-casualidad, w.pareja, w.cafeteria]
      - q: { es: "¿Lamentas haber dejado la carrera?", en: "Do you regret having dropped out of your degree?" }
        a: { es: "A veces. Si hubiera seguido, a estas alturas sería ingeniero.", en: "Sometimes. If I had carried on, by now I'd be an engineer." }
        alt: ["A veces. Si hubiese seguido, a estas alturas sería ingeniero.", "No, en su momento fue la decisión correcta."]
        grammar: [g.si-clauses-past]
        vocab: [w.lamentar, w.a-estas-alturas, w.ingeniero]
      - q: { es: "¿Por qué no me llamaste?", en: "Why didn't you call me?" }
        a: { es: "Si hubiera tenido tu número, te habría llamado, te lo juro.", en: "If I'd had your number, I would have called you, I swear." }
        alt: ["Si hubiese tenido tu número, te habría llamado.", "Porque no tenía tu número."]
        grammar: [g.si-clauses-past]
        vocab: [w.numero, w.jurar]
      - q: { es: "¡Qué coincidencia verte aquí!", en: "What a coincidence to see you here!" }
        a: { es: "Pues sí; si hubiera salido cinco minutos antes, no nos habríamos cruzado.", en: "Indeed; if I had left five minutes earlier, we wouldn't have crossed paths." }
        alt: ["Pues sí; si hubiese salido cinco minutos antes, no nos habríamos cruzado.", "¡El mundo es un pañuelo!"]
        grammar: [g.si-clauses-past]
        vocab: [w.coincidencia, w.cruzarse]
    texts:
      - title: "Transcripción de un mensaje de voz"
        es: ["Oye, al final no cogí el trabajo de Lisboa.", "Si lo hubiera aceptado, habría tenido que mudarme en una semana.", "Y la verdad, no estaba preparado.", "Luego te cuento."]
        en: ["Hey, in the end I didn't take the Lisbon job.", "If I had accepted it, I would have had to move within a week.", "And honestly, I wasn't ready.", "I'll tell you later."]
        grammar: [g.si-clauses-past]
        vocab: [w.mudarse, w.al-final]
      - title: "Reseña de un libro"
        es: ["Una novela sobre el azar y las decisiones.", "Si la protagonista no hubiera perdido aquel vuelo, su vida habría seguido otro rumbo.", "Se lee en una tarde."]
        en: ["A novel about chance and decisions.", "If the protagonist hadn't missed that flight, her life would have taken another course.", "You can read it in an afternoon."]
        grammar: [g.si-clauses-past]
        vocab: [w.azar, w.rumbo, w.novela]
  - id: b2.u02.l4
    title: Cuando hayas terminado
    teach: [g.subjunctive-perfect]
    vocab: [w.revisar, w.supervisar, w.supervisor, w.borrador, w.version, w.definitivo, w.ampliar, w.expediente, w.clausula, w.abonar, w.pago, w.entrega, w.aprobacion, w.autorizar, w.autorizacion, w.justificante, w.comunicar, w.confirmacion, w.visto-bueno, w.transportista, w.paciente, w.completo]
    tip: "In future time clauses the perfect subjunctive marks a completed step: Cuando hayas terminado, avísame. En cuanto hayan firmado, lo enviaremos."
    sentences:
      - { es: "Cuando hayas revisado el borrador, mándamelo y lo supervisaré yo.", en: "When you've reviewed the draft, send it to me and I'll supervise it myself.", altEs: ["Cuando hayas revisado el borrador, envíamelo y lo supervisaré yo."], grammar: [g.subjunctive-perfect, g.subjunctive-time-clauses], vocab: [w.revisar, w.borrador, w.supervisar] }
      - { es: "No abonaremos la factura hasta que el proveedor haya entregado el pedido completo.", en: "We won't pay the invoice until the supplier has delivered the complete order.", altEs: ["No pagaremos la factura hasta que el proveedor haya entregado el pedido completo."], grammar: [g.subjunctive-perfect, g.hasta-que], vocab: [w.abonar, w.factura, w.proveedor, w.completo] }
      - { es: "Una vez que el director haya dado el visto bueno, la versión será definitiva.", en: "Once the director has given the go-ahead, the version will be final.", grammar: [g.subjunctive-perfect, g.subjunctive-time-clauses], vocab: [w.visto-bueno, w.version, w.definitivo] }
      - { es: "En cuanto hayan firmado todas las cláusulas, les enviaremos la confirmación.", en: "As soon as they have signed all the clauses, we'll send them the confirmation.", altEs: ["Tan pronto como hayan firmado todas las cláusulas, les enviaremos la confirmación."], grammar: [g.subjunctive-perfect, g.subjunctive-time-clauses], vocab: [w.clausula, w.confirmacion, w.firmar] }
      - { es: "Es probable que el supervisor ya haya autorizado el pago.", en: "The supervisor has probably already authorised the payment.", altEs: ["Probablemente el supervisor ya haya autorizado el pago."], grammar: [g.subjunctive-perfect, g.subjunctive-impersonal], vocab: [w.supervisor, w.autorizar, w.pago] }
      - { es: "Espero que hayáis adjuntado el justificante; sin él no se puede ampliar el plazo.", en: "I hope you've attached the receipt; without it the deadline can't be extended.", grammar: [g.subjunctive-perfect, g.se-impersonal], vocab: [w.justificante, w.ampliar, w.plazo, w.adjuntar] }
      - { es: "Avísame cuando hayas comunicado la decisión a los clientes.", en: "Let me know when you've informed the clients of the decision.", altEs: ["Avísame cuando les hayas comunicado la decisión a los clientes."], grammar: [g.subjunctive-perfect, g.imperative-pronouns], vocab: [w.comunicar, w.decision, w.cliente] }
      - { es: "No cierre el expediente hasta que hayamos recibido la autorización, por favor.", en: "Please don't close the file until we have received the authorisation.", altEs: ["No cierre el expediente hasta que no hayamos recibido la autorización, por favor."], grammar: [g.subjunctive-perfect, g.imperative-usted], vocab: [w.expediente, w.autorizacion, w.recibir] }
      - { es: "¿Es posible que se hayan equivocado de versión? Esta cláusula no estaba en el borrador.", en: "Is it possible they've got the wrong version? This clause wasn't in the draft.", grammar: [g.subjunctive-perfect], vocab: [w.equivocarse, w.version, w.clausula] }
      - { es: "Quizá la entrega se haya retrasado por la huelga de transporte.", en: "Perhaps the delivery has been delayed by the transport strike.", altEs: ["Quizás la entrega se haya retrasado por la huelga de transporte.", "Tal vez la entrega se haya retrasado por la huelga de transporte."], grammar: [g.subjunctive-perfect, g.quizas-tal-vez], vocab: [w.entrega, w.retrasarse, w.huelga] }
      - { es: "Me extraña que a estas alturas nadie haya revisado el presupuesto.", en: "I find it strange that at this stage nobody has reviewed the budget.", grammar: [g.subjunctive-perfect], vocab: [w.revisar, w.presupuesto, w.a-estas-alturas] }
      - { es: "Tan pronto como hayan abonado la primera parte, empezaremos la obra.", en: "As soon as they have paid the first instalment, we'll start the work.", altEs: ["En cuanto hayan abonado la primera parte, empezaremos la obra."], grammar: [g.subjunctive-perfect, g.subjunctive-time-clauses], vocab: [w.abonar, w.obra, w.empezar] }
      - { es: "Es una lástima que la aprobación haya llegado después de la fecha límite.", en: "It's a pity that the approval arrived after the deadline.", grammar: [g.subjunctive-perfect, g.subjunctive-emotion], vocab: [w.aprobacion, w.fecha-limite, w.lastima] }
      - { es: "El transportista dice que es posible que el paquete se haya quedado en el almacén.", en: "The carrier says it's possible the parcel has been left in the warehouse.", grammar: [g.subjunctive-perfect, g.reported-speech-present], vocab: [w.transportista, w.paquete, w.almacen] }
      - { es: "Cuando hayamos terminado, te lo mandaré.", en: "When we've finished, I'll send it to you.", altEs: ["Cuando hayamos terminado, te lo mando."], grammar: [g.subjunctive-perfect, g.subjunctive-time-clauses], vocab: [w.terminar, w.enviar.phr], error: { wrong: "Cuando habremos terminado, te lo mandaré.", explain: "A time clause about the future never takes the future tense: use the perfect subjunctive, hayamos terminado.", grammar: g.subjunctive-perfect } }
      - { es: "Primero reviso el borrador y después te llamo.", en: "First I'll check the draft and then I'll call you.", grammar: [g.subjunctive-perfect], vocab: [w.revisar, w.borrador, w.llamar], transform: { instruction: "Combine the two steps with cuando + perfect subjunctive", answer: "Cuando haya revisado el borrador, te llamaré.", alt: ["Cuando haya revisado el borrador, te llamo.", "Te llamaré cuando haya revisado el borrador."] } }
    exchanges:
      - q: { es: "¿Cuándo me enviarás el presupuesto definitivo?", en: "When will you send me the final budget?" }
        a: { es: "En cuanto el jefe lo haya revisado; mañana como muy tarde.", en: "As soon as the boss has reviewed it; tomorrow at the latest." }
        alt: ["Cuando el jefe lo haya revisado.", "Mañana, en cuanto lo haya revisado el jefe."]
        grammar: [g.subjunctive-perfect]
        vocab: [w.presupuesto, w.definitivo, w.revisar]
      - q: { es: "¿Ya has abonado la factura del proveedor?", en: "Have you paid the supplier's invoice yet?" }
        a: { es: "Todavía no; lo haré cuando hayan entregado el pedido.", en: "Not yet; I'll do it when they've delivered the order." }
        alt: ["Todavía no; la pagaré cuando hayan entregado el pedido.", "Sí, esta mañana."]
        grammar: [g.subjunctive-perfect]
        vocab: [w.abonar, w.factura, w.pedido]
      - q: { es: "¿Puedo cerrar el expediente?", en: "Can I close the file?" }
        a: { es: "No, espera a que recursos humanos haya dado el visto bueno.", en: "No, wait until human resources have given the go-ahead." }
        alt: ["No, espera a que hayan dado el visto bueno.", "Todavía no; falta la autorización."]
        grammar: [g.subjunctive-perfect]
        vocab: [w.expediente, w.visto-bueno]
      - q: { es: "¿Por qué no ha llegado la confirmación?", en: "Why hasn't the confirmation arrived?" }
        a: { es: "Es posible que se hayan equivocado de dirección de correo.", en: "It's possible they've got the wrong email address." }
        alt: ["Puede que se hayan equivocado de dirección.", "Quizá el sistema haya fallado."]
        grammar: [g.subjunctive-perfect]
        vocab: [w.confirmacion, w.equivocarse, w.direccion]
    texts:
      - title: "Correo del supervisor"
        es: ["Buenos días a todos.", "Cuando hayáis revisado el borrador, enviadme los comentarios en un solo documento.", "No habléis con el cliente hasta que yo haya dado el visto bueno.", "Gracias."]
        en: ["Good morning everyone.", "When you've reviewed the draft, send me your comments in a single document.", "Don't talk to the client until I've given the go-ahead.", "Thanks."]
        grammar: [g.subjunctive-perfect, g.imperative-vosotros]
        vocab: [w.borrador, w.revisar, w.visto-bueno]
      - title: "Aviso en la ventanilla"
        es: ["Una vez que haya rellenado el formulario, espere su turno.", "No se abonará ninguna tasa hasta que el expediente haya sido aprobado.", "Gracias por su paciencia."]
        en: ["Once you have filled in the form, wait for your turn.", "No fee will be paid until the file has been approved.", "Thank you for your patience."]
        grammar: [g.subjunctive-perfect, g.imperative-usted]
        vocab: [w.formulario, w.tasa, w.expediente]
dialogues:
  - id: b2.u02.d1
    title: El pedido que nunca llegó
    context: A customer phones a supplier about an order that has not arrived. They go over what may have happened and what should have been done.
    lines:
      - { speaker: Cliente, es: "Buenos días, llamo por el pedido 4521. Es raro que no haya llegado todavía.", en: "Good morning, I'm calling about order 4521. It's strange that it hasn't arrived yet." }
      - { speaker: Proveedor, es: "Un momento… Aquí dice que lo entregamos el martes.", en: "One moment… It says here that we delivered it on Tuesday." }
      - { speaker: Cliente, es: "Imposible. Si lo hubieran entregado, yo lo habría firmado, y no firmé nada.", en: "Impossible. If you had delivered it, I would have signed for it, and I didn't sign anything." }
      - { speaker: Proveedor, es: "Puede que el transportista se haya equivocado de dirección.", en: "The delivery driver may have got the wrong address." }
      - { speaker: Cliente, es: "Si me hubieran avisado del retraso, no habría tenido este problema con mi cliente.", en: "If you had warned me about the delay, I wouldn't have had this problem with my customer." }
      - { speaker: Proveedor, es: "Lo lamento mucho. Es posible que el aviso se haya quedado en el borrador del correo.", en: "I'm very sorry. It's possible the notice stayed in the email drafts." }
      - { speaker: Cliente, es: "Pues me sorprende que nadie lo hubiera comprobado antes de enviar la factura.", en: "Well, I'm surprised nobody had checked before sending the invoice." }
      - { speaker: Proveedor, es: "Tiene razón. Haremos un nuevo envío hoy mismo y no le cobraremos nada hasta que lo haya recibido.", en: "You're right. We'll make a new shipment today and we won't charge you anything until you have received it." }
      - { speaker: Cliente, es: "De acuerdo. Y cuando hayan encontrado el primer paquete, me avisan, por favor.", en: "All right. And when you've found the first parcel, let me know, please." }
      - { speaker: Proveedor, es: "Por supuesto. Ojalá todos los clientes fueran tan pacientes como usted.", en: "Of course. If only all customers were as patient as you." }
    questions:
      - { q: "What does the supplier's record say about the order?", options: ["It was cancelled", "It was delivered on Tuesday", "It is still in the warehouse"], answer: 1 }
      - { q: "Why is the customer annoyed?", options: ["Nobody warned him about the delay", "The goods were damaged", "The invoice was too high"], answer: 0 }
      - { q: "What does the supplier promise?", options: ["A full refund", "A discount on the next order", "A new shipment and no charge until it arrives"], answer: 2 }
