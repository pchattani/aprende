        vocab: [w.embaixo, w.frente, w.lado]
    spicy:
      - { es: "Você mora longe? Então eu levo você em casa.", en: "You live far away? Then I'll take you home.", altEs: ["Você mora longe? Então eu te levo em casa."], grammar: [g.prepositions-place], vocab: [w.longe] }
      - { es: "Senta aqui, ao meu lado.", en: "Sit here, next to me.", altEs: ["Senta aqui do meu lado.", "Senta aqui, do meu lado."], grammar: [g.prepositions-place], vocab: [w.lado] }
      - { es: "Entre nós dois tem só uma mesa. Que mesa grande!", en: "Between the two of us there's only a table. What a big table!", altEs: ["Entre nós dois só tem uma mesa. Que mesa grande!"], grammar: [g.prepositions-place], vocab: [w.entre] }
      - { es: "O seu vizinho é barulhento? O meu é muito tranquilo... e solteiro.", en: "Is your neighbour noisy? Mine is very quiet... and single.", altEs: ["A sua vizinha é barulhenta? A minha é muito tranquila... e solteira."], grammar: [g.adjective-agreement], vocab: [w.vizinho, w.barulhento, w.tranquilo] }
      - { es: "Lá em cima está o Cristo; aqui embaixo estamos nós dois.", en: "Up there is Christ the Redeemer; down here, it's the two of us.", altEs: ["Lá em cima fica o Cristo; aqui embaixo estamos nós dois."], grammar: [g.prepositions-place, g.estar-present], vocab: [w.cima, w.embaixo] }
dialogues:
  - id: a1.u04.d1
    title: Um quarto com vista
    context: Daniel visits a room to rent in Dona Célia's flat in Cosme Velho, at the foot of Corcovado.
    lines:
      - { speaker: Dona Célia, es: "Boa tarde, Daniel! Entra, por favor. Esta é a sala.", en: "Good afternoon, Daniel! Come in, please. This is the living room." }
      - { speaker: Daniel, es: "Que sala bonita! E o quarto, onde fica?", en: "What a nice living room! And the bedroom, where is it?" }
      - { speaker: Dona Célia, es: "Fica ali, ao lado do banheiro. Tem uma cama, um armário e uma mesa.", en: "It's over there, next to the bathroom. It has a bed, a wardrobe and a desk." }
      - { speaker: Daniel, es: "E a janela? É grande?", en: "And the window? Is it big?" }
      - { speaker: Dona Célia, es: "É, sim. E da janela você vê o Cristo Redentor!", en: "Yes, it is. And from the window you can see Christ the Redeemer!" }
      - { speaker: Daniel, es: "Que lindo! Tem internet no apartamento?", en: "How beautiful! Is there internet in the flat?" }
      - { speaker: Dona Célia, es: "Tem, sim, e é rápida.", en: "Yes, there is, and it's fast." }
      - { speaker: Daniel, es: "E onde fica o supermercado?", en: "And where's the supermarket?" }
      - { speaker: Dona Célia, es: "Fica perto, na esquina. E a padaria fica em frente ao prédio.", en: "It's close, on the corner. And the bakery is opposite the building." }
      - { speaker: Daniel, es: "Ótimo. E o metrô fica longe daqui?", en: "Great. And is the metro far from here?" }
      - { speaker: Dona Célia, es: "Fica a dez minutos. Mas o ônibus para o Corcovado passa aqui na frente.", en: "It's ten minutes away. But the bus to Corcovado goes past right outside." }
      - { speaker: Daniel, es: "Então eu fico com o quarto!", en: "Then I'll take the room!" }
    questions:
      - { q: "Onde fica o quarto?", options: ["Ao lado do banheiro", "Em frente à cozinha", "Em cima da garagem"], answer: 0, explain: "Dona Célia says: Fica ali, ao lado do banheiro." }
      - { q: "O que o Daniel vê da janela?", options: ["A praia", "O Cristo Redentor", "O Maracanã"], answer: 1, explain: "Da janela você vê o Cristo Redentor." }
      - { q: "Onde fica a padaria?", options: ["Na esquina", "Em frente ao prédio", "Longe, no centro"], answer: 1, explain: "The supermarket is on the corner; the bakery is opposite the building." }
      - { q: "O Daniel fica com o quarto?", options: ["Sim", "Não", "Não sabe"], answer: 0, explain: "Então eu fico com o quarto! (ficar com = to take)" }
