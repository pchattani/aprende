id: a1.u11
title: 我嘅一日
lessons:
  - id: a1.u11.l1
    title: 先沖涼，再食早餐
    teach: [g.sin-zoi-sequence]
    vocab: [w.fan3, w.caat3-ngaa4, w.sai2-min6, w.cung1-loeng4, w.sai2, w.zoek3-saam1, w.zoek3, w.gan1-zyu6.b, w.sik6-zou2-caan1, w.maan6-maan2, w.ngaan5-fan3]
    tip: "先 and 再 go right before their verbs: 我先沖涼，再食早餐. 跟住 and 然後 (\"then\") start the next step."
    sentences:
      - { es: "我朝早七點起身。", en: "I get up at seven in the morning.", altEs: ["我七點起身。", "朝早七點我起身。"], grammar: [g.time-before-verb, g.clock-time], vocab: [w.hei2-san1], transform: { instruction: "Say you get up at half past six", answer: "我朝早六點半起身。", alt: ["我六點半起身。"], en: "I get up at half past six in the morning." } }
      - { es: "我先沖涼，再食早餐。", en: "I shower first, then have breakfast.", altEs: ["我先沖涼，然後食早餐。", "我先沖涼，跟住食早餐。"], grammar: [g.sin-zoi-sequence], vocab: [w.sin1.b, w.zoi3, w.cung1-loeng4, w.sik6-zou2-caan1], transform: { instruction: "Swap the order: breakfast first, then a shower", answer: "我先食早餐，再沖涼。", alt: ["我先食早餐，然後沖涼。"], en: "I have breakfast first, then shower." }, error: { wrong: "先我沖涼，再食早餐。", explain: "先 goes after the subject, right before the verb: 我先沖涼.", grammar: g.sin-zoi-sequence } }
      - { es: "我起身，跟住刷牙。", en: "I get up, then brush my teeth.", altEs: ["我起身，然後刷牙。"], grammar: [g.sin-zoi-sequence], vocab: [w.gan1-zyu6.b, w.caat3-ngaa4], error: { wrong: "我起身，刷牙跟住。", explain: "跟住 (\"then\") starts the next step; it never goes at the end.", grammar: g.sin-zoi-sequence } }
      - { es: "我刷牙，然後洗面。", en: "I brush my teeth and then wash my face.", altEs: ["我刷牙，跟住洗面。", "我先刷牙，再洗面。"], grammar: [g.sin-zoi-sequence], vocab: [w.jin4-hau6, w.sai2-min6] }
      - { es: "我食早餐，跟住着衫。", en: "I have breakfast, then get dressed.", altEs: ["我食早餐，然後着衫。"], grammar: [g.sin-zoi-sequence], vocab: [w.zoek3-saam1] }
      - { es: "最後我十二點瞓覺。", en: "Finally I go to bed at twelve.", altEs: ["最後我十二點鐘瞓覺。"], grammar: [g.sin-zoi-sequence], vocab: [w.zeoi3-hau6, w.fan3-gaau3], transform: { instruction: "Make it half past eleven", answer: "最後我十一點半瞓覺。", en: "Finally I go to bed at half past eleven." } }
      - { es: "你先洗手，再食飯。", en: "Wash your hands first, then eat.", altEs: ["先洗手，再食飯。", "你洗手先，再食飯。"], grammar: [g.sin-zoi-sequence], vocab: [w.sai2] }
      - { es: "我眼瞓喇，我想瞓覺。", en: "I'm sleepy, I want to go to bed.", altEs: ["我好眼瞓，我想瞓覺。", "眼瞓呀，我想瞓覺。"], grammar: [g.adjective-predicates], vocab: [w.ngaan5-fan3, w.fan3-gaau3] }
      - { es: "我好攰呀，返到屋企即刻瞓。", en: "I'm so tired; as soon as I get home I'll go to sleep.", altEs: ["我好攰，返到屋企即刻瞓覺。"], grammar: [g.sin-zoi-sequence], vocab: [w.gui6, w.zik1-hak1, w.fan3] }
      - { es: "慢慢食啦，唔好食咁快。", en: "Eat slowly, don't eat so fast.", altEs: ["慢慢食啦，唔使咁快。"], grammar: [g.particles-aa-laa], vocab: [w.maan6-maan2, w.faai3.b] }
      - { es: "佢喺廚房煮早餐。", en: "She's making breakfast in the kitchen.", altEs: ["佢喺廚房整早餐。"], altEn: ["He's making breakfast in the kitchen."], grammar: [g.hai2-location], vocab: [w.cyu4-fong2] }
      - { es: "你幾點起身呀？", en: "What time do you get up?", altEs: ["你幾點起身？", "你朝早幾點起身呀？"], grammar: [g.clock-time, g.question-words], vocab: [w.hei2-san1] }
      - { es: "我先着衫，再出去。", en: "I'll get dressed first, then go out.", altEs: ["我先着好衫，再出去。"], grammar: [g.sin-zoi-sequence], vocab: [w.zoek3-saam1, w.zoek3] }
      - { es: "叮叮好慢，港鐵好快。", en: "The tram is slow, the MTR is fast.", altEs: ["電車好慢，港鐵好快。"], grammar: [g.adjective-predicates], vocab: [w.maan6.b, w.faai3.b] }
      - { es: "我起身，沖涼，跟住食早餐，然後坐叮叮返工。", en: "I get up, shower, then have breakfast, and then take the tram to work.", altEs: ["我起身，沖涼，然後食早餐，跟住坐叮叮返工。"], grammar: [g.sin-zoi-sequence, g.serial-verbs], vocab: [w.hei2-san1, w.cung1-loeng4, w.gan1-zyu6.b, w.jin4-hau6] }
    exchanges:
      - q: { es: "你朝早做咩呀？", en: "What do you do in the morning?" }
        a: { es: "我起身，沖涼，跟住食早餐。", en: "I get up, shower, then have breakfast." }
        alt: ["起身，食早餐。", "我先沖涼，再食早餐。"]
        grammar: [g.sin-zoi-sequence]
        vocab: [w.hei2-san1, w.cung1-loeng4]
      - q: { es: "你幾點瞓覺呀？", en: "What time do you go to bed?" }
        a: { es: "通常十二點。", en: "Usually at twelve." }
        alt: ["十二點。", "十一點半。"]
        grammar: [g.clock-time]
        vocab: [w.fan3-gaau3]
      - q: { es: "你先沖涼定先食早餐呀？", en: "Do you shower first or have breakfast first?" }
        a: { es: "先沖涼，再食早餐。", en: "Shower first, then breakfast." }
        alt: ["先食早餐。", "先沖涼。"]
        grammar: [g.sin-zoi-sequence]
        vocab: [w.sin1.b, w.zoi3]
      - q: { es: "你好攰呀？", en: "Are you tired?" }
        a: { es: "係呀，我想即刻瞓覺。", en: "Yes, I want to go to bed right away." }
        alt: ["唔係好攰。", "有啲攰。"]
        grammar: [g.adjective-predicates]
        vocab: [w.gui6, w.zik1-hak1]
      - q: { es: "快啲啦，你着好衫未呀？", en: "Hurry up, are you dressed yet?" }
        a: { es: "着好衫喇，就嚟！", en: "Yes, coming!" }
        alt: ["未呀，等我一陣。", "就快喇。"]
        grammar: [g.particles-aa-laa]
        vocab: [w.zoek3-saam1]
    texts:
      - title: "我嘅朝早"
        es: ["我七點起身。", "我先沖涼，再刷牙。", "跟住我食早餐，然後坐叮叮返工。"]
        en: ["I get up at seven.", "First I shower, then I brush my teeth.", "Then I have breakfast, and after that I take the tram to work."]
        grammar: [g.sin-zoi-sequence]
        vocab: [w.hei2-san1, w.cung1-loeng4, w.caat3-ngaa4, w.gan1-zyu6.b, w.jin4-hau6]
      - title: "Luna 嘅朝早"
        es: ["Luna十點先起身。", "佢食早餐，跟住又瞓覺。", "佢好攰？唔係，佢好鍾意瞓覺！"]
        en: ["Luna only gets up at ten.", "She has breakfast, then goes back to sleep.", "Is she tired? No, she just loves sleeping!"]
        grammar: [g.sin-zoi-sequence]
        vocab: [w.hei2-san1, w.fan3-gaau3, w.gui6]
    spicy:
      - { es: "我先沖涼，再打電話畀你。", en: "I'll have a shower first, then call you.", altEs: ["我沖完涼就打電話畀你。"], grammar: [g.sin-zoi-sequence, g.bei-give], vocab: [w.cung1-loeng4] }
      - { es: "你眼瞓就瞓啦，我喺度。", en: "If you're sleepy, go to sleep; I'm here.", altEs: ["你眼瞓就瞓啦，我喺度呀。"], grammar: [g.particles-aa-laa], vocab: [w.ngaan5-fan3, w.fan3] }
      - { es: "朝早起身，第一件事就係諗你。", en: "When I get up in the morning, the first thing I do is think of you.", altEs: ["朝早起身，我第一件事就係諗你。"], grammar: [g.sin-zoi-sequence], vocab: [w.hei2-san1] }
      - { es: "我好攰，不過見到你，即刻唔攰。", en: "I'm exhausted, but when I see you, I'm not tired any more.", altEs: ["我好攰，但係見到你，即刻唔攰。"], grammar: [g.adjective-predicates], vocab: [w.gui6, w.zik1-hak1] }
      - { es: "慢慢嚟，我等你。", en: "Take your time, I'll wait for you.", altEs: ["慢慢嚟啦，我等你。"], grammar: [g.particles-aa-laa], vocab: [w.maan6-maan2] }
  - id: a1.u11.l2
    title: 坐叮叮返工
    teach: [g.serial-verbs]
    vocab: [w.faan1-hok6, w.fong3-hok6, w.faan1-uk1-kei2, w.ceot1-gaai1, w.sik6-aan3, w.sik6-maan5-faan6, w.zyu2-faan6, w.soeng5-tong4, w.tong4, w.zou6-gung1-fo3, w.gung1-fo3, w.daa2-hoi1, w.gin6-san1-sat1, w.zou6-wan6-dung6]
    tip: "Cantonese puts verbs one after another in the order things happen, with no \"and\" or \"to\": 我去街市買餸."
    sentences:
      - { es: "我坐叮叮返工。", en: "I take the tram to work.", altEs: ["我坐電車返工。", "我搭叮叮返工。"], grammar: [g.serial-verbs, g.transport-verbs], vocab: [w.faan1-gung1], transform: { instruction: "Say you take the MTR to school", answer: "我坐港鐵返學。", alt: ["我搭港鐵返學。"], en: "I take the MTR to school." }, error: { wrong: "我返工坐叮叮。", explain: "Keep the order of events: first ride (坐叮叮), then arrive (返工).", grammar: g.serial-verbs } }
      - { es: "我放工去健身室做運動。", en: "After work I go to the gym to exercise.", altEs: ["放工我去健身室做運動。"], grammar: [g.serial-verbs], vocab: [w.fong3-gung1], transform: { instruction: "Say you go to the supermarket to buy things after work", answer: "我放工去超市買嘢。", alt: ["放工我去超市買嘢。"], en: "After work I go to the supermarket to buy things." } }
      - { es: "佢用筷子食飯。", en: "She eats with chopsticks.", altEs: ["佢用筷子食嘢。"], altEn: ["He eats with chopsticks."], grammar: [g.serial-verbs], vocab: [] }
      - { es: "我哋去海邊影相。", en: "We're going to the seaside to take photos.", altEs: ["我哋去海邊影相啦。"], grammar: [g.serial-verbs, g.heoi-lai], vocab: [] }
      - { es: "嚟我屋企食晚飯啦。", en: "Come and have dinner at my place.", altEs: ["嚟我度食晚飯啦。"], grammar: [g.serial-verbs, g.particles-aa-laa], vocab: [w.sik6-maan5-faan6], transform: { instruction: "Make it lunch", answer: "嚟我屋企食晏啦。", alt: ["嚟我度食晏啦。"], en: "Come and have lunch at my place." } }
      - { es: "我中午同朋友去食晏。", en: "At noon I go for lunch with friends.", altEs: ["中午我同朋友去食晏。"], grammar: [g.serial-verbs], vocab: [w.sik6-aan3] }
      - { es: "我細佬八點返學，四點放學。", en: "My younger brother starts school at eight and finishes at four.", altEs: ["我細佬朝早八點返學，下晝四點放學。"], grammar: [g.time-before-verb], vocab: [w.faan1-hok6, w.fong3-hok6] }
      - { es: "我夜晚七點返屋企煮飯。", en: "I go home at seven in the evening to cook.", altEs: ["夜晚七點我返屋企煮飯。"], grammar: [g.serial-verbs, g.time-before-verb], vocab: [w.faan1-uk1-kei2, w.zyu2-faan6] }
      - { es: "星期六我哋去銅鑼灣行街。", en: "On Saturday we go shopping in Causeway Bay.", altEs: ["我哋星期六去銅鑼灣行街。"], grammar: [g.serial-verbs], vocab: [w.haang4-gaai1], error: { wrong: "星期六我哋去銅鑼灣同行街。", explain: "Don't link verbs with 同, which only joins nouns: 去銅鑼灣行街.", grammar: g.serial-verbs } }
      - { es: "我九點喺公司開會。", en: "I have a meeting at the office at nine.", altEs: ["九點我喺公司開會。"], grammar: [g.time-before-verb], vocab: [w.hoi1-wui2] }
      - { es: "佢上堂，我做功課。", en: "She's in class and I'm doing homework.", altEs: ["佢去上堂，我做功課。"], altEn: ["He's in class and I'm doing homework."], grammar: [g.serial-verbs], vocab: [w.soeng5-tong4, w.zou6-gung1-fo3, w.gung1-fo3] }
      - { es: "你今晚出唔出街呀？", en: "Are you going out tonight?", altEs: ["你今晚出街嗎？"], grammar: [g.a-not-a-questions], vocab: [w.ceot1-gaai1] }
      - { es: "我用手機畀錢。", en: "I pay with my phone.", altEs: ["我用手機嚟畀錢。"], grammar: [g.serial-verbs], vocab: [] }
      - { es: "打開窗啦，好熱呀。", en: "Open the window, it's really hot.", altEs: ["打開個窗啦，好熱呀。"], grammar: [g.particles-aa-laa], vocab: [w.daa2-hoi1] }
      - { es: "我今日有好多工做。", en: "I've got lots of work to do today.", altEs: ["今日我有好多工做。"], grammar: [g.jau-have], vocab: [w.gung1] }
      - { es: "行快啲啦！講慢啲啦！", en: "Walk faster! Speak more slowly!", altEs: ["行快啲！講慢啲！"], grammar: [g.particles-aa-laa], vocab: [w.faai3-di1, w.maan6-di1] }
    exchanges:
      - q: { es: "你點樣返工呀？", en: "How do you get to work?" }
        a: { es: "我坐叮叮返工。", en: "I take the tram to work." }
        alt: ["坐叮叮。", "行路返工。", "我坐港鐵返工。"]
        grammar: [g.serial-verbs, g.transport-verbs]
        vocab: [w.faan1-gung1]
      - q: { es: "你放工做咩呀？", en: "What do you do after work?" }
        a: { es: "我去健身室做運動。", en: "I go to the gym to exercise." }
        alt: ["返屋企煮飯。", "去行街。"]
        grammar: [g.serial-verbs]
        vocab: [w.fong3-gung1]
      - q: { es: "你中午去邊度食晏呀？", en: "Where do you go for lunch?" }
        a: { es: "我去茶餐廳食晏。", en: "I go to a cha chaan teng for lunch." }
        alt: ["茶餐廳。", "我喺公司食飯盒。"]
        grammar: [g.serial-verbs]
        vocab: [w.sik6-aan3]
      - q: { es: "你今晚出唔出街呀？", en: "Are you going out tonight?" }
        a: { es: "唔出喇，我喺屋企煮飯。", en: "No, I'm cooking at home." }
        alt: ["出呀，我去睇戲。", "唔出喇。"]
        grammar: [g.a-not-a-questions]
        vocab: [w.ceot1-gaai1, w.zyu2-faan6]
      - q: { es: "你細佬幾點放學呀？", en: "What time does your younger brother finish school?" }
        a: { es: "四點放學。", en: "At four." }
        alt: ["四點。", "三點半。"]
        grammar: [g.time-before-verb]
        vocab: [w.fong3-hok6]
    texts:
      - title: "Kelvin 嘅一日"
        es: ["我住喺堅尼地城。", "我每日坐叮叮去中環返工。", "放工我去健身室做運動，然後返屋企煮飯。"]
        en: ["I live in Kennedy Town.", "Every day I take the tram to Central to work.", "After work I go to the gym, and then I go home and cook."]
        grammar: [g.serial-verbs, g.sin-zoi-sequence]
        vocab: [w.faan1-gung1, w.fong3-gung1, w.zyu2-faan6]
      - title: "我細佬"
        es: ["我細佬八點返學。", "佢四點放學，跟住去公園踩單車。", "夜晚佢做功課。"]
        en: ["My younger brother starts school at eight.", "He finishes at four, then goes to the park to ride his bike.", "In the evening he does his homework."]
        grammar: [g.serial-verbs]
        vocab: [w.faan1-hok6, w.fong3-hok6, w.zou6-gung1-fo3]
    spicy:
      - { es: "放工去飲杯嘢，好唔好？", en: "Shall we go for a drink after work?", altEs: ["放工一齊去飲杯嘢，好唔好？"], grammar: [g.serial-verbs, g.a-not-a-questions], vocab: [w.fong3-gung1] }
      - { es: "你煮飯，我食飯，好唔好？", en: "You cook and I eat, deal?", altEs: ["你煮飯，我負責食，好唔好？"], grammar: [g.serial-verbs], vocab: [w.zyu2-faan6] }
      - { es: "我坐叮叮去你公司樓下等你放工。", en: "I'll take the tram to your office and wait downstairs for you to finish work.", altEs: ["我搭叮叮去你公司樓下等你放工。"], grammar: [g.serial-verbs], vocab: [w.fong3-gung1] }
      - { es: "唔好返屋企住，出街食晚飯啦。", en: "Don't go home yet, let's go out for dinner.", altEs: ["唔好咁早返屋企，出街食晚飯啦。"], grammar: [g.serial-verbs], vocab: [w.ceot1-gaai1, w.sik6-maan5-faan6] }
      - { es: "聽日一齊食晏，我請。", jp: "ting1 jat6 jat1 cai4 sik6 aan3 ngo5 ceng2", en: "Let's have lunch together tomorrow, my treat.", altEs: ["聽日一齊食晏啦，我請。"], grammar: [g.serial-verbs], vocab: [w.sik6-aan3] }
  - id: a1.u11.l3
    title: 我日日都飲奶茶
    teach: [g.frequency-adverbs]
    vocab: [w.seng4-jat6, w.jau5-si4, w.gaan3-zung1, w.hou2-siu2, w.jat6-jat6, w.mui5-jat6, w.maan5-maan5, w.cung4-loi4, w.haa5.b, w.wan6-dung6, w.paau2-bou6, w.jau4-seoi2, w.saan3-bou6, w.haang4-saan1, w.gin6-san1, w.ni1-paai2]
    tip: "How-often words go before the verb: 我成日遲到. 每日 and 日日 usually take 都: 我日日都飲奶茶."
    sentences:
      - { es: "我日日都飲奶茶。", en: "I drink milk tea every day.", altEs: ["我每日都飲奶茶。"], grammar: [g.frequency-adverbs], vocab: [w.jat6-jat6, w.mui5-jat6] }
      - { es: "佢通常坐港鐵返工。", en: "She usually takes the MTR to work.", altEs: ["佢通常搭港鐵返工。"], altEn: ["He usually takes the MTR to work."], grammar: [g.frequency-adverbs], vocab: [w.tung1-soeng4], transform: { instruction: "Make it negative with 從來 (never)", answer: "佢從來唔坐港鐵返工。", alt: ["佢從來都唔坐港鐵返工。"], en: "She never takes the MTR to work." } }
      - { es: "我間中去游水。", en: "I go swimming now and then.", altEs: ["我間中都會去游水。"], grammar: [g.frequency-adverbs], vocab: [w.gaan3-zung1, w.jau4-seoi2], transform: { instruction: "Say you go swimming every day", answer: "我日日都去游水。", alt: ["我每日都去游水。"], en: "I go swimming every day." } }
      - { es: "我從來唔食早餐。", en: "I never eat breakfast.", altEs: ["我從來都唔食早餐。"], grammar: [g.frequency-adverbs], vocab: [w.cung4-loi4] }
      - { es: "我成日遲到。", en: "I'm always late.", altEs: ["我成日都遲到。"], grammar: [g.frequency-adverbs], vocab: [w.seng4-jat6], error: { wrong: "我遲到成日。", explain: "Frequency words go before the verb, never at the end: 我成日遲到.", grammar: g.frequency-adverbs } }
      - { es: "我哋有時去澳門。", en: "We sometimes go to Macau.", altEs: ["有時我哋去澳門。"], grammar: [g.frequency-adverbs], vocab: [w.jau5-si4], transform: { instruction: "Say you rarely go", answer: "我哋好少去澳門。", en: "We rarely go to Macau." } }
      - { es: "佢好少食快餐。", en: "He rarely eats fast food.", altEs: ["佢好少食快餐㗎。"], altEn: ["She rarely eats fast food."], grammar: [g.frequency-adverbs], vocab: [w.hou2-siu2], error: { wrong: "佢食快餐好少。", explain: "好少 (rarely) goes before the verb: 佢好少食快餐.", grammar: g.frequency-adverbs } }
