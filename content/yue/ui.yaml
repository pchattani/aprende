# Interface text in the target language (keys are fixed; values are per course).
# `{word}`, `{region}` and `{language}` are placeholders filled in by the app.
# Cantonese values are colloquial Hong Kong Cantonese in traditional characters.
appName: Gong 講
tagline: Cantonese, from your first words to fluency
welcome:
  title: Leo, Bonchita and Luna are off to Hong Kong
  intro: >-
    Three small dogs, one harbour full of boats, and only you can talk to the locals. Luna has the map, Leo has the
    Octopus card, Bonchita has her nose pressed against every bakery window. Every unit is a stop: Hong Kong Island,
    Kowloon, the New Territories, the Outlying Islands, then across the water to Macau and up the Pearl River to
    Guangzhou and Foshan. Where should the journey start? Everything is open; this just marks the first stop.
  firstStop: "Land at Hong Kong airport: A1, lesson 1."
greetings: { morning: 早晨, afternoon: 你好, evening: 晚上好 }
feedback: { correct: 啱晒！, almost: 差少少！, goalDone: 好嘢！ }
stampEarned: 蓋印成功！
spicyName: 辣味模式
games: { name: 生字遊戲, memory: 記憶遊戲, rapid: 快速搶答, win: 你贏咗！ }
dogsPage: 三隻狗仔
quizGreat: 好叻呀！
whatDoesItMean: 「{word}」係咩意思？
badgeName: "{region}徽章"
typePlaceholder: Type in Jyutping or characters
voiceTest: 你好！好高興認識你，我哋一齊學廣東話啦。
voiceHelp: >-
  No Cantonese voice installed. On Windows open Settings → Time & Language → Language & region, add “Chinese
  (Traditional, Hong Kong SAR)” and install its speech pack; on Android install Speech Services by Google and download
  the Cantonese (Hong Kong) voice under Settings → Text-to-speech; on iOS and macOS download the Sinji voice under
  Accessibility → Spoken Content → Voices → Chinese (Hong Kong).
pronunciationIntro: >-
  Cantonese has six tones, and the same syllable means different things at different pitches: si1 poem, si2 history,
  si3 try, si4 time, si5 market, si6 matter. Jyutping writes every syllable in Latin letters plus a tone number, so you
  can read, type and look up anything.
