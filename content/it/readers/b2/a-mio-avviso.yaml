id: r.b2.a-mio-avviso
level: b2
title: "Costiera Amalfitana: risorsa o condanna?"
kind: text
intro: An opinion piece from a student magazine on whether mass tourism is saving or ruining the Amalfi Coast. A model of Italian argumentative writing, with its connectors (in primo luogo, d'altro canto, ciononostante, alla luce di) and opinion structures (a mio avviso, è innegabile che).
allow: [amalfi, amalfitana, positano, ravello, maiori, vietri, sorrento, salerno, unesco, instagram]
paragraphs:
  - { es: "Chi ha percorso almeno una volta la strada che collega Positano a Vietri sul Mare sa che la Costiera Amalfitana è uno dei paesaggi più spettacolari del mondo: paesi di case colorate aggrappati alla roccia, limoneti a terrazze, il mare a picco sotto le curve. Non a caso, dal 1997 è Patrimonio dell'Umanità. Proprio questa bellezza, tuttavia, è diventata il suo problema principale. Ci si chiede, allora, se il turismo sia per la Costiera una risorsa o una condanna.", en: "Anyone who has driven even once along the road linking Positano to Vietri sul Mare knows that the Amalfi Coast is one of the most spectacular landscapes in the world: villages of coloured houses clinging to the rock, terraced lemon groves, the sea dropping sheer below the bends. It's no coincidence that it has been a World Heritage Site since 1997. Yet this very beauty has become its main problem. So the question is whether tourism is a resource or a curse for the coast." }
  - { es: "In primo luogo, è innegabile che il turismo abbia portato benessere. Fino a metà del Novecento la Costiera era una terra povera, da cui molti giovani emigravano. Oggi alberghi, ristoranti, barche e negozi danno lavoro a migliaia di persone, e i figli dei pescatori non sono più costretti ad andarsene. Inoltre, il turismo ha permesso di restaurare chiese, ville e giardini, come quelli di Ravello, che altrimenti sarebbero andati in rovina.", en: "First, it's undeniable that tourism has brought prosperity. Until the middle of the twentieth century the coast was a poor area that many young people emigrated from. Today hotels, restaurants, boats and shops give work to thousands of people, and fishermen's children are no longer forced to leave. In addition, tourism has made it possible to restore churches, villas and gardens, like those of Ravello, which would otherwise have fallen into ruin." }
  - { es: "D'altro canto, i costi sono sotto gli occhi di tutti. D'estate la strada statale, stretta e piena di curve, è bloccata per ore da pullman e auto, al punto che da qualche anno, nei mesi più affollati, i non residenti possono circolare solo a targhe alterne. Gli affitti per turisti hanno fatto salire i prezzi delle case, e molti residenti, soprattutto giovani, non possono più permettersi di vivere nei paesi in cui sono nati. Alcuni centri si svuotano d'inverno, trasformandosi in scenografie senza abitanti.", en: "On the other hand, the costs are plain for all to see. In summer the main road, narrow and full of bends, is blocked for hours by coaches and cars, to the point that for a few years now, in the busiest months, non-residents have only been allowed to drive on alternate days according to their number plates. Holiday lets have pushed up house prices, and many residents, especially young people, can no longer afford to live in the towns where they were born. Some places empty out in winter, turning into stage sets with no inhabitants." }
  - { es: "C'è poi un problema meno visibile ma altrettanto grave: la fragilità del territorio. I terrazzamenti che sostengono i limoneti richiedono una manutenzione continua, che solo chi coltiva la terra può garantire. Se gli ultimi contadini abbandonano i campi per lavorare nei bar, i muri a secco crollano e il rischio di frane aumenta. In altre parole, un turismo che consuma il paesaggio finisce per distruggere ciò che lo attira.", en: "Then there's a less visible but equally serious problem: the fragility of the land. The terraces holding up the lemon groves need constant maintenance, which only those who farm the land can provide. If the last farmers abandon the fields to work in bars, the dry-stone walls collapse and the risk of landslides increases. In other words, tourism that consumes the landscape ends up destroying the very thing that attracts it." }
  - { es: "Ciononostante, a mio avviso, sarebbe sbagliato considerare il turismo come un nemico. Il problema non è il turismo in sé, ma la sua concentrazione: troppi visitatori negli stessi luoghi, negli stessi mesi, per poche ore. Le soluzioni esistono, e alcune sono già state sperimentate: potenziare i collegamenti via mare, limitare l'accesso dei pullman, incentivare le visite in bassa stagione, sostenere economicamente chi continua a coltivare i limoni.", en: "Nevertheless, in my view, it would be wrong to see tourism as an enemy. The problem isn't tourism in itself but its concentration: too many visitors in the same places, in the same months, for a few hours. Solutions exist, and some have already been tried: strengthening sea connections, limiting coach access, encouraging visits in the low season, supporting financially those who keep growing lemons." }
  - { es: "Alla luce di quanto detto, credo che la Costiera non debba scegliere tra turismo e sopravvivenza, ma imparare a governare il primo per garantire la seconda. Se ci riuscirà, potrà restare quello che è sempre stata: non un set fotografico per Instagram, ma un luogo in cui si vive.", en: "In light of all this, I believe the coast doesn't have to choose between tourism and survival, but must learn to manage the former in order to guarantee the latter. If it succeeds, it can remain what it has always been: not a photo set for Instagram, but a place where people live." }
questions:
  - { q: "Qual è la domanda centrale dell'articolo?", options: ["Se la Costiera sia più bella di Capri", "Se il turismo sia una risorsa o una condanna per la Costiera", "Come arrivare in Costiera senza auto"], answer: 1, explain: "The introduction ends with the question the essay sets out to answer." }
  - { q: "Quale vantaggio del turismo NON viene citato?", options: ["Il lavoro per migliaia di persone", "Il restauro di chiese, ville e giardini", "La costruzione di un aeroporto"], answer: 2, explain: "Jobs and restoration are mentioned; no airport." }
  - { q: "Perché l'abbandono dei limoneti è pericoloso?", options: ["Perché non si produce più limoncello", "Perché senza manutenzione i muri crollano e aumenta il rischio di frane", "Perché i turisti non vengono più"], answer: 1, explain: "The terraces need constant upkeep; abandoned dry-stone walls collapse." }
  - { q: "Secondo l'autore, qual è il vero problema?", options: ["Il turismo in sé", "La concentrazione dei visitatori negli stessi luoghi e negli stessi mesi", "Il prezzo dei limoni"], answer: 1, explain: "«Il problema non è il turismo in sé, ma la sua concentrazione.»" }
  - { q: "Quale connettivo introduce l'opinione personale dell'autore, in contrasto con quanto detto prima?", options: ["In primo luogo", "Ciononostante, a mio avviso", "Inoltre"], answer: 1, explain: "Ciononostante (nevertheless) marks the contrast; a mio avviso (in my view) introduces the author's own position." }
