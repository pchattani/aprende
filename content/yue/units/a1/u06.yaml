        grammar: [g.prices-gei-do-cin]
        vocab: [w.gei2-cin2]
      - q: { es: "平啲得唔得呀？", en: "Can you do it a bit cheaper?" }
        a: { es: "好啦，七十蚊啦。", en: "OK, seventy then." }
        alt: ["唔得呀。", "得，七十蚊。"]
        grammar: [g.prices-gei-do-cin, g.di-some]
        vocab: [w.peng4-di1, w.dak1-m4-dak1]
      - q: { es: "白菜幾錢一斤呀？", en: "How much is bok choy a catty?" }
        a: { es: "十二蚊一斤。", en: "Twelve dollars a catty." }
