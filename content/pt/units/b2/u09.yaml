    model: { es: "Na viagem pelo Nordeste, descobri que cada região tem o seu vocabulário. A mandioca, por exemplo, é chamada de macaxeira no Nordeste e de aipim no Rio. E a abóbora lá se chama jerimum! No café da manhã, comi cuscuz com queijo coalho, e no almoço, baião de dois com carne de sol. De sobremesa, um pedaço de rapadura. À noite, fomos a um forró: ouvir a sanfona e a zabumba ao vivo foi maravilhoso. Na próxima viagem, quero aprender a dançar forró de verdade.", en: "On my trip around the Northeast I discovered that each region has its own vocabulary. Cassava, for example, is called macaxeira in the Northeast and aipim in Rio. And pumpkin there is called jerimum! For breakfast I had couscous with coalho cheese, and for lunch baião de dois with sun-dried beef. For dessert, a piece of rapadura. In the evening we went to a forró: hearing the accordion and the zabumba drum live was wonderful. Next trip, I want to learn to dance forró properly." }
