id: r.a2.receta-de-gazpacho
level: a2
title: "Receta: gazpacho andaluz"
kind: text
intro: A recipe page from a cookery blog, written with tú commands.
allow: [gazpacho, andaluz, pimiento, pepino, vinagre, batidora, kilo, gramos, mililitros]
paragraphs:
  - { es: "El gazpacho es una sopa fría de tomate típica del sur de España. Es perfecta para los días de calor, es muy sana y se prepara en quince minutos. Aquí tienes la receta para cuatro personas.", en: "Gazpacho is a cold tomato soup typical of the south of Spain. It's perfect for hot days, very healthy and ready in fifteen minutes. Here's the recipe for four people." }
  - { es: "Ingredientes: un kilo de tomates maduros, un pimiento verde, un pepino, un diente de ajo, un trozo de pan, cincuenta mililitros de aceite de oliva, dos cucharadas de vinagre, sal y agua fría.", en: "Ingredients: a kilo of ripe tomatoes, a green pepper, a cucumber, a clove of garlic, a piece of bread, fifty millilitres of olive oil, two tablespoons of vinegar, salt and cold water." }
  - { es: "Primero lava bien los tomates y córtalos en trozos. Pela el pepino y el ajo. Corta el pimiento y quita las semillas. Pon el pan en un poco de agua durante cinco minutos.", en: "First wash the tomatoes well and cut them into pieces. Peel the cucumber and the garlic. Cut the pepper and remove the seeds. Soak the bread in a little water for five minutes." }
  - { es: "Después, mete todos los ingredientes en la batidora. Añade el aceite, el vinagre y una pizca de sal. Bátelo todo durante dos o tres minutos, hasta que quede muy fino.", en: "Then put all the ingredients in the blender. Add the oil, the vinegar and a pinch of salt. Blend it all for two or three minutes, until it's very smooth." }
  - { es: "Prueba el gazpacho. ¿Está demasiado espeso? Echa un poco más de agua fría. ¿Le falta sal? Añade otra pizca. Guárdalo en la nevera al menos dos horas: tiene que estar muy frío.", en: "Taste the gazpacho. Is it too thick? Add a little more cold water. Does it need salt? Add another pinch. Keep it in the fridge for at least two hours: it has to be very cold." }
  - { es: "Sírvelo en vasos o en platos con trocitos de pepino, pimiento y pan frito encima. No lo calientes nunca: el gazpacho se toma frío. ¡Buen provecho!", en: "Serve it in glasses or bowls with little pieces of cucumber, pepper and fried bread on top. Never heat it: gazpacho is eaten cold. Enjoy!" }
questions:
  - { q: "How long does the recipe take to prepare?", options: ["Fifteen minutes", "Two hours", "All morning"], answer: 0 }
  - { q: "What do you do with the bread first?", options: ["Fry it", "Soak it in water", "Cut it into cubes"], answer: 1 }
  - { q: "How should gazpacho be served?", options: ["Hot", "Warm", "Very cold"], answer: 2 }
glossary:
  - { es: maduro, en: ripe }
  - { es: diente de ajo, en: clove of garlic }
  - { es: semilla, en: seed }
  - { es: espeso, en: thick }
  - { es: buen provecho, en: enjoy your meal }
