id: a2.u02
title: "Siamo andati a Siena"
lessons:
  - id: a2.u02.l1
    title: Siamo andati al Palio
    teach: [g.passato-prossimo-essere]
    vocab: [w.nascere, w.morire, w.crescere, w.diventare, w.succedere, w.restare, w.cadere, w.scappare, w.apparire, w.contrada, w.corsa, w.fantino, w.bandiera, w.torre, w.conchiglia, w.medievale, w.medioevo]
    tip: "With essere the participle agrees with the subject like an adjective: Marco è andato, Giulia è andata, siamo andati, le ragazze sono andate."
    sentences:
      - { es: "Sabato siamo andati a Siena in treno.", en: "On Saturday we went to Siena by train.", altEs: ["Sabato siamo andati a Siena con il treno.", "Sabato siamo andate a Siena in treno."], altEn: ["We went to Siena by train on Saturday."], grammar: [g.passato-prossimo-essere], vocab: [w.andare, w.treno], transform: { instruction: "Change to 'I' (you are a woman)", answer: "Sabato sono andata a Siena in treno.", alt: ["Sabato io sono andata a Siena in treno.", "Sabato sono andata a Siena con il treno."], en: "On Saturday I went to Siena by train." } }
      - { es: "Giulia è arrivata in Piazza del Campo alle dieci.", en: "Giulia arrived in Piazza del Campo at ten.", altEs: ["Giulia è arrivata alle dieci in Piazza del Campo."], grammar: [g.passato-prossimo-essere], vocab: [w.arrivare] }
      - { es: "Anna è andata al Palio con le amiche.", en: "Anna went to the Palio with her friends.", altEs: ["Anna è andata al Palio con le sue amiche."], grammar: [g.passato-prossimo-essere], vocab: [w.palio, w.amico], error: { wrong: "Anna è andato al Palio con le amiche.", explain: "With essere the participle agrees with the subject: Anna è andata.", grammar: g.passato-prossimo-essere } }
      - { es: "Mia nonna è nata a Siena, nella contrada dell'Oca.", en: "My grandmother was born in Siena, in the Oca district.", altEs: ["Mia nonna è nata nella contrada dell'Oca, a Siena."], grammar: [g.passato-prossimo-essere], vocab: [w.nascere, w.contrada] }
      - { es: "Il fantino è caduto durante la corsa.", en: "The jockey fell during the race.", altEs: ["Durante la corsa il fantino è caduto."], grammar: [g.passato-prossimo-essere], vocab: [w.fantino, w.cadere, w.corsa] }
      - { es: "Dopo la corsa il cavallo è scappato verso il Duomo.", en: "After the race the horse ran off towards the cathedral.", altEs: ["Il cavallo è scappato verso il Duomo dopo la corsa."], grammar: [g.passato-prossimo-essere], vocab: [w.scappare, w.cavallo] }
      - { es: "Che cosa è successo? — Ha vinto la Torre!", en: "What happened? — The Torre district won!", altEs: ["Cosa è successo? — Ha vinto la Torre!", "Che è successo? — Ha vinto la Torre!"], grammar: [g.passato-prossimo-essere, g.participles-irregular], vocab: [w.succedere], note: "succedere takes essere; vincere takes avere." }
      - { es: "Nel Medioevo Siena è cresciuta moltissimo.", en: "In the Middle Ages Siena grew enormously.", altEs: ["Siena è cresciuta moltissimo nel Medioevo."], grammar: [g.passato-prossimo-essere], vocab: [w.medioevo, w.crescere] }
      - { es: "La Torre del Mangia è diventata il simbolo di Siena.", en: "The Torre del Mangia has become the symbol of Siena.", altEs: ["La Torre del Mangia è diventata un simbolo di Siena."], grammar: [g.passato-prossimo-essere], vocab: [w.torre, w.diventare, w.simbolo] }
      - { es: "Le bandiere delle contrade sono apparse in tutte le strade.", en: "The districts' flags have appeared in every street.", altEs: ["In tutte le strade sono apparse le bandiere delle contrade."], grammar: [g.passato-prossimo-essere], vocab: [w.bandiera, w.apparire, w.contrada] }
      - { es: "Piazza del Campo ha la forma di una conchiglia.", en: "Piazza del Campo is shaped like a shell.", altEs: ["Piazza del Campo è a forma di conchiglia."], altEn: ["Piazza del Campo has the shape of a shell."], grammar: [g.avere-present], vocab: [w.conchiglia, w.forma] }
      - { es: "Siamo usciti presto e siamo tornati a mezzanotte.", en: "We went out early and came back at midnight.", altEs: ["Noi siamo usciti presto e siamo tornati a mezzanotte."], altEn: ["We left early and got back at midnight."], grammar: [g.passato-prossimo-essere], vocab: [w.uscire, w.tornare], transform: { instruction: "Change to 'she'", answer: "È uscita presto ed è tornata a mezzanotte.", alt: ["Lei è uscita presto ed è tornata a mezzanotte.", "È uscita presto e è tornata a mezzanotte."], en: "She went out early and came back at midnight." } }
      - { es: "Nel 1944 sono caduti tutti i ponti di Firenze: solo il Ponte Vecchio è restato in piedi.", en: "In 1944 all the bridges in Florence fell: only the Ponte Vecchio stayed standing.", altEs: ["Nel 1944 sono caduti tutti i ponti di Firenze; solo il Ponte Vecchio è rimasto in piedi."], grammar: [g.passato-prossimo-essere], vocab: [w.cadere, w.restare, w.ponte] }
      - { es: "Il nonno di Lorenzo è morto due anni fa, ma tutti ricordano le sue storie.", en: "Lorenzo's grandfather died two years ago, but everyone remembers his stories.", grammar: [g.passato-prossimo-essere, g.time-markers-past], vocab: [w.morire, w.storia] }
      - { es: "Siena è una città medievale: sembra ferma nel tempo.", en: "Siena is a medieval city: it seems frozen in time.", altEs: ["Siena è una città medievale, sembra ferma nel tempo."], grammar: [g.essere-present], vocab: [w.medievale, w.sembrare] }
      - { es: "Le tue amiche sono venute in macchina o in autobus?", en: "Did your friends come by car or by bus?", altEs: ["Le tue amiche sono arrivate in macchina o in autobus?"], grammar: [g.passato-prossimo-essere, g.prepositions-transport], vocab: [w.venire, w.macchina, w.autobus] }
    exchanges:
      - q: { es: "Dove siete andati sabato?", en: "Where did you go on Saturday?" }
        a: { es: "Siamo andati a Siena per il Palio.", en: "We went to Siena for the Palio." }
        alt: ["A Siena.", "Siamo restati a casa."]
        grammar: [g.passato-prossimo-essere]
        vocab: [w.andare, w.palio]
      - q: { es: "A che ora è arrivata Giulia?", en: "What time did Giulia arrive?" }
        a: { es: "È arrivata alle dieci, in ritardo come sempre.", en: "She arrived at ten, late as always." }
        alt: ["Alle dieci.", "Non è ancora arrivata."]
        grammar: [g.passato-prossimo-essere]
        vocab: [w.arrivare]
      - q: { es: "Che cosa è successo?", en: "What happened?" }
        a: { es: "Un fantino è caduto, ma sta bene.", en: "A jockey fell, but he's fine." }
        alt: ["Niente di grave.", "È caduto un fantino."]
        grammar: [g.passato-prossimo-essere]
        vocab: [w.succedere, w.fantino, w.cadere]
      - q: { es: "Dov'è nata tua nonna?", en: "Where was your grandmother born?" }
        a: { es: "È nata a Siena, nella contrada della Torre.", en: "She was born in Siena, in the Torre district." }
        alt: ["A Siena.", "È nata a Firenze."]
        grammar: [g.passato-prossimo-essere]
        vocab: [w.nascere, w.contrada]
      - q: { es: "Siete restati fino alla fine?", en: "Did you stay till the end?" }
        a: { es: "Sì, siamo tornati in albergo a mezzanotte.", en: "Yes, we got back to the hotel at midnight." }
        alt: ["No, siamo andati via presto.", "Sì, fino alla fine."]
        grammar: [g.passato-prossimo-essere]
        vocab: [w.restare, w.tornare]
    texts:
      - title: "Il Palio"
        es: ["Il 2 luglio siamo andati a Siena.", "Siamo arrivati in Piazza del Campo alle tre e siamo restati lì fino a sera.", "La corsa è durata solo novanta secondi!"]
        en: ["On 2 July we went to Siena.", "We arrived in Piazza del Campo at three and stayed there until the evening.", "The race lasted only ninety seconds!"]
        grammar: [g.passato-prossimo-essere]
        vocab: [w.palio, w.restare, w.corsa]
      - title: "Messaggio alla mamma"
        es: ["Mamma, siamo arrivati a Firenze!", "Siamo passati sul Ponte Vecchio e siamo entrati in tre gioiellerie.", "Tranquilla: non abbiamo comprato niente!"]
        en: ["Mum, we've arrived in Florence!", "We walked over the Ponte Vecchio and went into three jewellers'.", "Don't worry: we didn't buy anything!"]
        grammar: [g.passato-prossimo-essere, g.auxiliary-choice]
        vocab: [w.arrivare, w.passare, w.gioielleria]
    spicy:
      - { es: "Sei nato a Siena? Allora sei bello come Piazza del Campo.", en: "Were you born in Siena? Then you're as beautiful as Piazza del Campo.", altEs: ["Sei nata a Siena? Allora sei bella come Piazza del Campo."], grammar: [g.passato-prossimo-essere], vocab: [w.nascere] }
      - { es: "Sono caduto per te... e anche dalle scale del campanile.", en: "I fell for you... and also down the bell tower stairs.", altEs: ["Sono caduta per te... e anche dalle scale del campanile."], grammar: [g.passato-prossimo-essere], vocab: [w.cadere, w.campanile] }
      - { es: "Il cavallo è scappato, ma io sono restata qui. Con te.", en: "The horse ran off, but I stayed here. With you.", altEs: ["Il cavallo è scappato, ma io sono restato qui. Con te."], grammar: [g.passato-prossimo-essere], vocab: [w.scappare, w.restare] }
      - { es: "Sei diventato rosso! È colpa del vino o colpa mia?", en: "You've gone red! Is it the wine's fault or mine?", altEs: ["Sei diventata rossa! È colpa del vino o colpa mia?"], grammar: [g.passato-prossimo-essere], vocab: [w.diventare] }
      - { es: "Che cosa è successo ieri sera? Non ricordo niente, ma ho un numero nuovo nel cellulare.", en: "What happened last night? I don't remember anything, but I've got a new number in my phone.", grammar: [g.passato-prossimo-essere], vocab: [w.succedere, w.numero] }
  - id: a2.u02.l2
    title: Essere o avere?
    teach: [g.auxiliary-choice]
    vocab: [w.bastare, w.mancare, w.cambiare, w.iniziare, w.toccare, w.pazienza, w.evento, w.momento, w.fortuna, w.per-fortuna, w.purtroppo, w.arcipelago]
    tip: "Ask: does the verb take a direct object? ho cambiato casa (avere) — la città è cambiata (essere). Ho camminato and ho viaggiato take avere."
    sentences:
      - { es: "Abbiamo camminato tutto il giorno, poi siamo saliti sulla Torre del Mangia.", en: "We walked all day, then we went up the Torre del Mangia.", altEs: ["Abbiamo camminato tutto il giorno e poi siamo saliti sulla Torre del Mangia."], grammar: [g.auxiliary-choice], vocab: [w.camminare, w.salire, w.torre] }
      - { es: "Sono andato sul Ponte Vecchio al tramonto.", en: "I went to the Ponte Vecchio at sunset.", altEs: ["Sono andata sul Ponte Vecchio al tramonto.", "Al tramonto sono andato sul Ponte Vecchio."], grammar: [g.auxiliary-choice, g.passato-prossimo-essere], vocab: [w.andare, w.tramonto], error: { wrong: "Ho andato sul Ponte Vecchio al tramonto.", explain: "andare is a verb of movement to a place: it takes essere (sono andato).", grammar: g.auxiliary-choice } }
      - { es: "Il concerto è iniziato alle nove.", en: "The concert started at nine.", altEs: ["Il concerto è cominciato alle nove."], grammar: [g.auxiliary-choice], vocab: [w.iniziare, w.concerto] }
      - { es: "Ho iniziato un corso di cucina toscana.", en: "I've started a Tuscan cooking course.", altEs: ["Ho cominciato un corso di cucina toscana."], grammar: [g.auxiliary-choice], vocab: [w.iniziare, w.corso, w.cucina] }
      - { es: "Ho finito il lavoro.", en: "I've finished the work.", altEs: ["Io ho finito il lavoro."], altEn: ["I finished the job."], grammar: [g.auxiliary-choice], vocab: [w.finire, w.lavoro], transform: { instruction: "Make 'il lavoro' the subject (the work finished)", answer: "Il lavoro è finito.", en: "The work has finished." } }
      - { es: "Firenze è cambiata molto in vent'anni.", en: "Florence has changed a lot in twenty years.", altEs: ["In vent'anni Firenze è cambiata molto."], grammar: [g.auxiliary-choice], vocab: [w.cambiare] }
      - { es: "Il mese scorso ho cambiato casa.", en: "Last month I moved house.", altEs: ["Ho cambiato casa il mese scorso."], grammar: [g.auxiliary-choice, g.time-markers-past], vocab: [w.cambiare, w.casa] }
      - { es: "Mi è mancata tanto la Toscana!", en: "I missed Tuscany so much!", altEs: ["La Toscana mi è mancata tanto!"], grammar: [g.auxiliary-choice, g.passato-prossimo-essere], vocab: [w.mancare], note: "mancare works like piacere: the thing missed is the subject, so the participle agrees with it." }
      - { es: "Ti è bastato il tempo per vedere tutto?", en: "Did you have enough time to see everything?", altEs: ["Il tempo ti è bastato per vedere tutto?"], altEn: ["Was the time enough for you to see everything?"], grammar: [g.auxiliary-choice], vocab: [w.bastare, w.tempo] }
      - { es: "Ho toccato il naso del Porcellino: porta fortuna!", en: "I touched the Porcellino's nose: it brings good luck!", altEs: ["Ho toccato il naso del Porcellino perché porta fortuna!"], grammar: [g.auxiliary-choice], vocab: [w.toccare, w.fortuna, w.naso], note: "The Porcellino is a bronze boar at Florence's Mercato Nuovo; rubbing its snout is said to bring you back to the city." }
      - { es: "Per fortuna il treno è partito in ritardo!", en: "Luckily the train left late!", altEs: ["Il treno per fortuna è partito in ritardo!"], grammar: [g.auxiliary-choice], vocab: [w.per-fortuna, w.partire] }
      - { es: "Purtroppo è piovuto tutto il pomeriggio.", en: "Unfortunately it rained all afternoon.", altEs: ["Purtroppo ha piovuto tutto il pomeriggio."], grammar: [g.auxiliary-choice, g.weather], vocab: [w.purtroppo, w.piovere], note: "Weather verbs take either auxiliary: è piovuto / ha piovuto." }
      - { es: "Abbiamo avuto pazienza e alla fine siamo entrati.", en: "We were patient and in the end we got in.", altEs: ["Abbiamo avuto pazienza e finalmente siamo entrati."], grammar: [g.auxiliary-choice], vocab: [w.pazienza, w.entrare, w.alla-fine], transform: { instruction: "Change to 'she'", answer: "Ha avuto pazienza e alla fine è entrata.", alt: ["Lei ha avuto pazienza e alla fine è entrata."], en: "She was patient and in the end she got in." } }
      - { es: "Il Palio è un evento importante per tutta la città.", en: "The Palio is an important event for the whole city.", grammar: [g.essere-present], vocab: [w.evento, w.palio] }
      - { es: "È stato un momento bellissimo.", en: "It was a wonderful moment.", altEs: ["È stato proprio un momento bellissimo."], grammar: [g.auxiliary-choice, g.passato-prossimo-essere], vocab: [w.momento] }
      - { es: "L'estate scorsa siamo stati all'Elba e al Giglio, due isole dell'arcipelago toscano.", en: "Last summer we went to Elba and Giglio, two islands of the Tuscan archipelago.", altEs: ["L'estate scorsa siamo andati all'Elba e al Giglio, due isole dell'arcipelago toscano."], grammar: [g.auxiliary-choice, g.passato-prossimo-essere], vocab: [w.arcipelago, w.isola] }
    exchanges:
      - q: { es: "Quanto è costato il biglietto?", en: "How much did the ticket cost?" }
        a: { es: "È costato dieci euro.", en: "It cost ten euros." }
        alt: ["Dieci euro.", "Niente, è gratis la domenica."]
        grammar: [g.auxiliary-choice]
        vocab: [w.costare, w.biglietto]
      - q: { es: "Ti è piaciuta Siena?", en: "Did you like Siena?" }
        a: { es: "Sì, moltissimo! Mi manca già.", en: "Yes, very much! I miss it already." }
        alt: ["Sì, tanto.", "Sì, ma ho preferito Firenze."]
        grammar: [g.auxiliary-choice, g.piacere-intro]
        vocab: [w.mancare]
      - q: { es: "A che ora è iniziato il film?", en: "What time did the film start?" }
        a: { es: "È iniziato alle nove ed è finito a mezzanotte.", en: "It started at nine and finished at midnight." }
        alt: ["Alle nove.", "È iniziato tardi."]
        grammar: [g.auxiliary-choice]
        vocab: [w.iniziare]
      - q: { es: "Avete trovato posto sul treno?", en: "Did you find a seat on the train?" }
        a: { es: "Per fortuna sì, ma purtroppo il treno è partito in ritardo.", en: "Luckily yes, but unfortunately the train left late." }
        alt: ["Per fortuna sì.", "Purtroppo no."]
        grammar: [g.auxiliary-choice]
        vocab: [w.per-fortuna, w.purtroppo]
      - q: { es: "Firenze è cambiata?", en: "Has Florence changed?" }
        a: { es: "Sì, è cambiata tanto: ci sono molti più turisti.", en: "Yes, it's changed a lot: there are many more tourists." }
        alt: ["No, è sempre la stessa.", "Un po'."]
        grammar: [g.auxiliary-choice]
        vocab: [w.cambiare]
    texts:
      - title: "Una giornata sfortunata"
        es: ["Stamattina ho perso l'autobus e sono arrivato tardi al lavoro.", "Purtroppo è piovuto tutto il giorno.", "Per fortuna stasera è venuta Giulia con una pizza."]
        en: ["This morning I missed the bus and got to work late.", "Unfortunately it rained all day.", "Luckily this evening Giulia came round with a pizza."]
        grammar: [g.auxiliary-choice]
        vocab: [w.purtroppo, w.per-fortuna]
      - title: "Cartolina dall'Elba"
        es: ["Siamo arrivati all'Elba martedì.", "Abbiamo nuotato tutti i giorni e abbiamo mangiato pesce fresco.", "Ci è bastata una settimana per innamorarci dell'isola!"]
        en: ["We arrived on Elba on Tuesday.", "We swam every day and ate fresh fish.", "One week was enough for us to fall in love with the island!"]
        grammar: [g.auxiliary-choice]
        vocab: [w.bastare, w.nuotare]
    spicy:
      - { es: "Mi sei mancato tanto. Anche il tuo gelato.", en: "I missed you so much. Your ice cream too.", altEs: ["Mi sei mancata tanto. Anche il tuo gelato."], grammar: [g.auxiliary-choice, g.passato-prossimo-essere], vocab: [w.mancare, w.gelato] }
      - { es: "Ho toccato il naso del Porcellino e, guarda caso, sei arrivato tu.", en: "I touched the Porcellino's nose and, what do you know, you turned up.", altEs: ["Ho toccato il naso del Porcellino e, guarda caso, sei arrivata tu."], grammar: [g.auxiliary-choice], vocab: [w.toccare] }
      - { es: "Ho cambiato idea: non voglio un caffè, voglio un appuntamento.", en: "I've changed my mind: I don't want a coffee, I want a date.", grammar: [g.auxiliary-choice], vocab: [w.cambiare, w.appuntamento] }
      - { es: "Un momento con te mi è bastato per dimenticare il treno.", en: "One moment with you was enough to make me forget the train.", altEs: ["Mi è bastato un momento con te per dimenticare il treno."], grammar: [g.auxiliary-choice], vocab: [w.momento, w.bastare] }
      - { es: "Per fortuna ho perso l'autobus: così ti ho incontrato.", en: "Luckily I missed the bus: that's how I met you.", altEs: ["Per fortuna ho perso l'autobus, così ti ho incontrata."], grammar: [g.auxiliary-choice], vocab: [w.per-fortuna, w.perdere] }
  - id: a2.u02.l3
    title: Ci siamo conosciuti a Firenze
    teach: [g.reflexive-passato-prossimo]
    vocab: [w.pettinarsi, w.truccarsi, w.innamorarsi, w.sposarsi, w.fidanzarsi, w.lasciarsi, w.conoscersi, w.trasferirsi, w.laurearsi, w.fermarsi, w.sbrigarsi, w.annoiarsi, w.arrabbiarsi, w.preoccuparsi, w.rilassarsi]
    tip: "Reflexive verbs always take essere: mi sono svegliato/a, ci siamo divertiti/e. The pronoun goes before essere."
    sentences:
      - { es: "Stamattina mi sono svegliata alle sei.", en: "This morning I woke up at six.", altEs: ["Mi sono svegliata alle sei stamattina.", "Stamattina mi sono svegliato alle sei."], grammar: [g.reflexive-passato-prossimo], vocab: [w.svegliarsi], error: { wrong: "Stamattina mi ho svegliata alle sei.", explain: "Reflexive verbs take essere, never avere: mi sono svegliata.", grammar: g.reflexive-passato-prossimo } }
      - { es: "Ci siamo conosciuti sul Ponte Vecchio.", en: "We met on the Ponte Vecchio.", altEs: ["Ci siamo conosciute sul Ponte Vecchio."], grammar: [g.reflexive-passato-prossimo], vocab: [w.conoscersi] }
      - { es: "Si sono innamorati a Siena durante il Palio.", en: "They fell in love in Siena during the Palio.", altEs: ["Durante il Palio si sono innamorati a Siena."], grammar: [g.reflexive-passato-prossimo], vocab: [w.innamorarsi, w.durante] }
      - { es: "Marco e Sara si sono sposati in una villa del Chianti.", en: "Marco and Sara got married in a villa in Chianti.", altEs: ["Marco e Sara si sono sposati in una villa nel Chianti."], grammar: [g.reflexive-passato-prossimo], vocab: [w.sposarsi, w.villa] }
      - { es: "Mio fratello si è fidanzato a Natale.", en: "My brother got engaged at Christmas.", altEs: ["Mio fratello si è fidanzato per Natale."], grammar: [g.reflexive-passato-prossimo], vocab: [w.fidanzarsi], transform: { instruction: "Change to 'my sister'", answer: "Mia sorella si è fidanzata a Natale.", alt: ["Mia sorella si è fidanzata per Natale."], en: "My sister got engaged at Christmas." } }
      - { es: "Si sono lasciati dopo tre anni, ma sono rimasti amici.", en: "They split up after three years, but they stayed friends.", altEs: ["Dopo tre anni si sono lasciati, ma sono restati amici."], grammar: [g.reflexive-passato-prossimo, g.passato-prossimo-essere], vocab: [w.lasciarsi] }
      - { es: "Mi sono trasferito a Firenze l'anno scorso.", en: "I moved to Florence last year.", altEs: ["Mi sono trasferita a Firenze l'anno scorso.", "L'anno scorso mi sono trasferito a Firenze."], grammar: [g.reflexive-passato-prossimo], vocab: [w.trasferirsi] }
      - { es: "Mia sorella si è laureata a Pisa in giugno.", en: "My sister graduated in Pisa in June.", altEs: ["Mia sorella si è laureata a Pisa a giugno."], grammar: [g.reflexive-passato-prossimo], vocab: [w.laurearsi] }
      - { es: "Ci siamo fermati a Monteriggioni per un caffè.", en: "We stopped at Monteriggioni for a coffee.", altEs: ["Ci siamo fermate a Monteriggioni per un caffè."], grammar: [g.reflexive-passato-prossimo], vocab: [w.fermarsi] }
      - { es: "Ti sei pettinato? Allora andiamo!", en: "Have you combed your hair? Then let's go!", altEs: ["Ti sei pettinata? Allora andiamo!"], grammar: [g.reflexive-passato-prossimo], vocab: [w.pettinarsi] }
      - { es: "Giulia si è truccata in cinque minuti.", en: "Giulia did her make-up in five minutes.", grammar: [g.reflexive-passato-prossimo], vocab: [w.truccarsi], error: { wrong: "Giulia si è truccato in cinque minuti.", explain: "The participle agrees with the subject: Giulia si è truccata.", grammar: g.reflexive-passato-prossimo } }
      - { es: "Mi sono sbrigata, ma il treno è già partito.", en: "I hurried, but the train has already left.", altEs: ["Mi sono sbrigato, ma il treno è già partito."], grammar: [g.reflexive-passato-prossimo, g.gia-ancora-mai], vocab: [w.sbrigarsi] }
      - { es: "Vi siete annoiati al museo?", en: "Did you get bored at the museum?", altEs: ["Al museo vi siete annoiati?", "Vi siete annoiate al museo?"], grammar: [g.reflexive-passato-prossimo], vocab: [w.annoiarsi, w.museo] }
      - { es: "Il professore si è arrabbiato perché siamo arrivati tardi.", en: "The teacher got angry because we arrived late.", altEs: ["Il professore si è arrabbiato perché siamo arrivati in ritardo."], grammar: [g.reflexive-passato-prossimo, g.passato-prossimo-essere], vocab: [w.arrabbiarsi, w.professore] }
      - { es: "Non ti sei preoccupata? — No, mi sono rilassata in piscina!", en: "Didn't you worry? — No, I relaxed by the pool!", altEs: ["Non ti sei preoccupato? — No, mi sono rilassato in piscina!"], grammar: [g.reflexive-passato-prossimo], vocab: [w.preoccuparsi, w.rilassarsi, w.piscina] }
      - { es: "Mi sono rilassato in piscina.", en: "I relaxed by the pool.", altEs: ["Mi sono rilassata in piscina."], grammar: [g.reflexive-passato-prossimo], vocab: [w.rilassarsi], transform: { instruction: "Change to 'we'", answer: "Ci siamo rilassati in piscina.", alt: ["Ci siamo rilassate in piscina."], en: "We relaxed by the pool." } }
    exchanges:
      - q: { es: "Dove vi siete conosciuti?", en: "Where did you meet?" }
        a: { es: "Ci siamo conosciuti a una festa a Firenze.", en: "We met at a party in Florence." }
        alt: ["A Firenze.", "Sul Ponte Vecchio."]
        grammar: [g.reflexive-passato-prossimo]
        vocab: [w.conoscersi]
      - q: { es: "Quando ti sei trasferita in Toscana?", en: "When did you move to Tuscany?" }
        a: { es: "Mi sono trasferita tre anni fa.", en: "I moved three years ago." }
        alt: ["Tre anni fa.", "L'anno scorso."]
        grammar: [g.reflexive-passato-prossimo, g.time-markers-past]
        vocab: [w.trasferirsi]
      - q: { es: "Vi siete divertiti alla festa?", en: "Did you have fun at the party?" }
        a: { es: "Sì, ci siamo divertiti un sacco!", en: "Yes, we had a great time!" }
        alt: ["No, ci siamo annoiati.", "Abbastanza."]
        grammar: [g.reflexive-passato-prossimo]
        vocab: [w.divertirsi, w.annoiarsi]
      - q: { es: "Perché ti sei arrabbiato?", en: "Why did you get angry?" }
        a: { es: "Perché Luca non si è fermato al semaforo!", en: "Because Luca didn't stop at the traffic light!" }
        alt: ["Non mi sono arrabbiato!", "Perché siamo arrivati tardi."]
        grammar: [g.reflexive-passato-prossimo]
        vocab: [w.arrabbiarsi, w.fermarsi]
      - q: { es: "Dove si sono sposati?", en: "Where did they get married?" }
        a: { es: "Si sono sposati in un castello vicino a Siena.", en: "They got married in a castle near Siena." }
        alt: ["In chiesa.", "Non si sono ancora sposati."]
        grammar: [g.reflexive-passato-prossimo]
        vocab: [w.sposarsi]
    texts:
      - title: "La nostra storia"
        es: ["Ci siamo conosciuti a Firenze nel 2018.", "Ci siamo innamorati sul Ponte Vecchio, al tramonto.", "Due anni dopo ci siamo sposati e ci siamo trasferiti in campagna."]
        en: ["We met in Florence in 2018.", "We fell in love on the Ponte Vecchio, at sunset.", "Two years later we got married and moved to the countryside."]
        grammar: [g.reflexive-passato-prossimo]
        vocab: [w.conoscersi, w.innamorarsi, w.sposarsi, w.trasferirsi]
      - title: "Messaggio di Chiara"
        es: ["Scusa il ritardo! Mi sono svegliata tardi.", "Mi sono vestita e truccata in dieci minuti.", "Non ti arrabbiare, arrivo!"]
        en: ["Sorry I'm late! I woke up late.", "I got dressed and did my make-up in ten minutes.", "Don't get angry, I'm coming!"]
        grammar: [g.reflexive-passato-prossimo]
        vocab: [w.truccarsi, w.arrabbiarsi]
    spicy:
      - { es: "Ci siamo conosciuti alle nove e alle dieci mi sono già innamorata.", en: "We met at nine and by ten I'd already fallen in love.", altEs: ["Ci siamo conosciuti alle nove e alle dieci mi sono già innamorato."], grammar: [g.reflexive-passato-prossimo], vocab: [w.conoscersi, w.innamorarsi] }
      - { es: "Mi sono pettinato tre volte per te. Hai notato?", en: "I combed my hair three times for you. Did you notice?", altEs: ["Mi sono pettinata tre volte per te. Hai notato?"], grammar: [g.reflexive-passato-prossimo], vocab: [w.pettinarsi] }
      - { es: "Ci siamo fermati per un caffè e siamo rimasti fino a mezzanotte.", en: "We stopped for a coffee and stayed until midnight.", altEs: ["Ci siamo fermati per un caffè e siamo restati fino a mezzanotte."], grammar: [g.reflexive-passato-prossimo, g.passato-prossimo-essere], vocab: [w.fermarsi, w.caffè] }
      - { es: "Non mi sono mai annoiata con te. Neanche in coda alla posta.", en: "I've never been bored with you. Not even in the queue at the post office.", altEs: ["Non mi sono mai annoiato con te. Neanche in coda alla posta."], grammar: [g.reflexive-passato-prossimo, g.gia-ancora-mai], vocab: [w.annoiarsi] }
      - { es: "Ti sei truccata così per me? — No, per il gelato.", en: "Did you do your make-up like that for me? — No, for the ice cream.", grammar: [g.reflexive-passato-prossimo], vocab: [w.truccarsi] }
  - id: a2.u02.l4
    title: Non ancora!
    teach: [g.gia-ancora-mai]
    vocab: [w.non-ancora, w.non-più, w.matrimonio, w.sposo, w.coppia, w.parente, w.suocero, w.cognato, w.luna-di-miele, w.anniversario, w.fidanzamento, w.amore, w.bacio, w.baciare, w.abbracciare, w.abbraccio, w.appuntamento]
    tip: "già, ancora, mai, appena and sempre go between the auxiliary and the participle: ho già mangiato, non sono mai stato."
    sentences:
      - { es: "Avete già prenotato il ristorante per il matrimonio?", en: "Have you already booked the restaurant for the wedding?", altEs: ["Il ristorante per il matrimonio l'avete già prenotato?"], grammar: [g.gia-ancora-mai], vocab: [w.matrimonio, w.prenotare] }
      - { es: "Non abbiamo ancora scelto la data.", en: "We haven't chosen the date yet.", altEs: ["La data non l'abbiamo ancora scelta."], grammar: [g.gia-ancora-mai], vocab: [w.non-ancora, w.scegliere] }
      - { es: "Sei mai stata a un matrimonio italiano?", en: "Have you ever been to an Italian wedding?", altEs: ["Sei mai stato a un matrimonio italiano?"], grammar: [g.gia-ancora-mai, g.passato-prossimo-essere], vocab: [w.matrimonio] }
      - { es: "Gli sposi sono appena partiti per la luna di miele.", en: "The bride and groom have just left on their honeymoon.", altEs: ["Gli sposi sono partiti adesso per la luna di miele."], altEn: ["The newlyweds have just left for their honeymoon."], grammar: [g.gia-ancora-mai, g.passato-prossimo-essere], vocab: [w.sposo, w.luna-di-miele] }
      - { es: "Non ho mai visto una coppia così felice.", en: "I've never seen such a happy couple.", altEs: ["Una coppia così felice non l'ho mai vista."], grammar: [g.gia-ancora-mai], vocab: [w.coppia], error: { wrong: "Ho visto mai una coppia così felice.", explain: "'Never' needs non + mai around the auxiliary: non ho mai visto.", grammar: g.gia-ancora-mai } }
      - { es: "Tutti i parenti sono già arrivati.", en: "All the relatives have already arrived.", altEs: ["I parenti sono già arrivati tutti."], grammar: [g.gia-ancora-mai, g.passato-prossimo-essere], vocab: [w.parente], transform: { instruction: "Make it negative: 'not yet'", answer: "I parenti non sono ancora arrivati.", alt: ["Non sono ancora arrivati i parenti."], en: "The relatives haven't arrived yet." } }
      - { es: "Mia suocera ha sempre cucinato per tutti.", en: "My mother-in-law has always cooked for everyone.", altEs: ["Mia suocera ha cucinato sempre per tutti."], grammar: [g.gia-ancora-mai], vocab: [w.suocero, w.cucinare] }
      - { es: "Mio cognato non abita più a Siena.", en: "My brother-in-law doesn't live in Siena any more.", altEs: ["Mio cognato non vive più a Siena."], grammar: [g.gia-ancora-mai], vocab: [w.cognato, w.non-più] }
      - { es: "Oggi è il nostro anniversario: dieci anni d'amore!", en: "Today is our anniversary: ten years of love!", altEs: ["Oggi è il nostro anniversario: dieci anni di amore!"], grammar: [g.possessives], vocab: [w.anniversario, w.amore] }
      - { es: "La festa di fidanzamento è stata in un giardino sulle colline.", en: "The engagement party was in a garden in the hills.", grammar: [g.passato-prossimo-essere], vocab: [w.fidanzamento, w.giardino] }
      - { es: "Si sono baciati sotto la Torre del Mangia.", en: "They kissed under the Torre del Mangia.", grammar: [g.reflexive-passato-prossimo], vocab: [w.baciare, w.torre] }
      - { es: "Il nonno ha mandato un bacio a tutti dalla finestra.", en: "Grandpa blew everyone a kiss from the window.", altEs: ["Dalla finestra il nonno ha mandato un bacio a tutti."], grammar: [g.passato-prossimo-avere], vocab: [w.bacio, w.mandare] }
      - { es: "Ci siamo abbracciati alla stazione e abbiamo pianto.", en: "We hugged at the station and cried.", altEs: ["Alla stazione ci siamo abbracciati e abbiamo pianto."], grammar: [g.reflexive-passato-prossimo, g.auxiliary-choice], vocab: [w.abbracciare, w.piangere] }
      - { es: "Un abbraccio forte a tutti!", en: "A big hug to everyone!", altEs: ["Un forte abbraccio a tutti!"], grammar: [g.gia-ancora-mai], vocab: [w.abbraccio] }
      - { es: "Ho già finito.", en: "I've already finished.", altEs: ["Io ho già finito."], grammar: [g.gia-ancora-mai], vocab: [w.finire], transform: { instruction: "Make it negative: 'I haven't finished yet'", answer: "Non ho ancora finito.", alt: ["Io non ho ancora finito."], en: "I haven't finished yet." } }
      - { es: "Hai un appuntamento stasera? — No, non ancora!", en: "Have you got a date tonight? — No, not yet!", grammar: [g.gia-ancora-mai], vocab: [w.appuntamento, w.non-ancora] }
    exchanges:
      - q: { es: "Hai già mangiato?", en: "Have you eaten yet?" }
        a: { es: "No, non ancora. E tu?", en: "No, not yet. What about you?" }
        alt: ["Sì, ho già mangiato.", "Sì, ho appena finito."]
        grammar: [g.gia-ancora-mai]
        vocab: [w.non-ancora]
      - q: { es: "Sei mai stato a Siena?", en: "Have you ever been to Siena?" }
        a: { es: "Sì, una volta, durante il Palio.", en: "Yes, once, during the Palio." }
        alt: ["No, mai.", "Sì, tante volte."]
        grammar: [g.gia-ancora-mai]
        vocab: [w.una-volta]
      - q: { es: "Quando è il matrimonio?", en: "When's the wedding?" }
        a: { es: "Non lo sappiamo: non abbiamo ancora scelto la data.", en: "We don't know: we haven't chosen the date yet." }
        alt: ["A giugno.", "Non ancora deciso."]
        grammar: [g.gia-ancora-mai]
        vocab: [w.matrimonio]
      - q: { es: "Dove sono andati in luna di miele?", en: "Where did they go on honeymoon?" }
        a: { es: "Sono andati all'Elba. Sono appena tornati.", en: "They went to Elba. They've just got back." }
        alt: ["All'Elba.", "Non sono ancora partiti."]
        grammar: [g.gia-ancora-mai, g.passato-prossimo-essere]
        vocab: [w.luna-di-miele]
      - q: { es: "Tuo cognato abita ancora a Siena?", en: "Does your brother-in-law still live in Siena?" }
        a: { es: "No, non abita più lì: si è trasferito a Pisa.", en: "No, he doesn't live there any more: he moved to Pisa." }
        alt: ["Sì, abita ancora lì.", "No, non più."]
        grammar: [g.gia-ancora-mai, g.reflexive-passato-prossimo]
        vocab: [w.cognato, w.non-più]
    texts:
      - title: "Invito"
        es: ["Cari parenti e amici, finalmente abbiamo scelto la data!", "Ci sposiamo il 12 giugno a San Gimignano.", "Non avete ancora risposto? Aspettiamo un messaggio!"]
        en: ["Dear relatives and friends, we've finally chosen the date!", "We're getting married on 12 June in San Gimignano.", "Haven't you replied yet? We're waiting for a message!"]
        grammar: [g.gia-ancora-mai]
        vocab: [w.parente, w.non-ancora]
      - title: "Cartolina dalla luna di miele"
        es: ["Siamo già stanchi, ma felici.", "Non abbiamo mai mangiato così bene!", "Un abbraccio e un bacio a tutti, gli sposi."]
        en: ["We're already tired, but happy.", "We've never eaten so well!", "A hug and a kiss to everyone, the newlyweds."]
        grammar: [g.gia-ancora-mai]
        vocab: [w.abbraccio, w.bacio, w.sposo]
    spicy:
      - { es: "Ci siamo già baciati? No? Allora che cosa aspettiamo?", en: "Have we kissed yet? No? Then what are we waiting for?", grammar: [g.gia-ancora-mai, g.reflexive-passato-prossimo], vocab: [w.baciare] }
      - { es: "Non sono mai stato a un appuntamento così bello. E non abbiamo ancora ordinato.", en: "I've never been on such a lovely date. And we haven't even ordered yet.", altEs: ["Non sono mai stata a un appuntamento così bello. E non abbiamo ancora ordinato."], grammar: [g.gia-ancora-mai], vocab: [w.appuntamento, w.non-ancora] }
      - { es: "Tua madre non mi ha ancora conosciuto, ma ha già scelto il ristorante per il matrimonio.", en: "Your mother hasn't met me yet, but she's already chosen the restaurant for the wedding.", altEs: ["Tua madre non mi ha ancora conosciuta, ma ha già scelto il ristorante per il matrimonio."], grammar: [g.gia-ancora-mai], vocab: [w.matrimonio, w.non-ancora] }
      - { es: "Un abbraccio? Va bene. Ma solo uno... per ora.", en: "A hug? All right. But only one... for now.", grammar: [g.gia-ancora-mai], vocab: [w.abbraccio] }
      - { es: "Ho appena mangiato tre cantucci: adesso vorrei un bacio dolce.", en: "I've just eaten three cantucci: now I'd like a sweet kiss.", grammar: [g.gia-ancora-mai], vocab: [w.bacio] }
dialogues:
  - id: a2.u02.d1
    title: Com'è andata a Siena?
    context: Chiara has just come back from the Palio in Siena; her colleague Davide wants to know everything.
    lines:
      - { speaker: Davide, es: "Allora, Chiara, sei andata al Palio?", en: "So, Chiara, did you go to the Palio?" }
      - { speaker: Chiara, es: "Sì! Siamo partiti da Firenze alle otto e siamo arrivati a Siena alle nove e mezza.", en: "Yes! We left Florence at eight and arrived in Siena at half past nine." }
      - { speaker: Davide, es: "E avete trovato posto in Piazza del Campo?", en: "And did you find a place in Piazza del Campo?" }
      - { speaker: Chiara, es: "Sì, ma siamo restati in piedi per sei ore! La corsa è iniziata solo alle sette.", en: "Yes, but we stood for six hours! The race only started at seven." }
      - { speaker: Davide, es: "Che cosa è successo?", en: "What happened?" }
      - { speaker: Chiara, es: "Un fantino è caduto alla prima curva e alla fine ha vinto la Torre.", en: "A jockey fell at the first bend and in the end the Torre district won." }
      - { speaker: Davide, es: "Ti sei divertita?", en: "Did you have fun?" }
      - { speaker: Chiara, es: "Tantissimo! E dopo ci siamo fermati a cena con i ragazzi della contrada.", en: "Hugely! And afterwards we stayed for dinner with the people from the district." }
      - { speaker: Davide, es: "Io non sono mai stato al Palio.", en: "I've never been to the Palio." }
      - { speaker: Chiara, es: "Non ancora! Ad agosto ci andiamo insieme.", en: "Not yet! In August we'll go together." }
    questions:
      - { q: "A che ora sono arrivati a Siena?", options: ["Alle otto", "Alle nove e mezza", "Alle sette"], answer: 1, explain: "They left Florence at eight and arrived at half past nine." }
      - { q: "Per quanto tempo sono restati in piedi?", options: ["Per un'ora", "Per tre ore", "Per sei ore"], answer: 2, explain: "Siamo restati in piedi per sei ore." }
      - { q: "Chi ha vinto il Palio?", options: ["L'Oca", "La Torre", "Il fantino caduto"], answer: 1, explain: "Alla fine ha vinto la Torre." }
      - { q: "Davide è mai stato al Palio?", options: ["Sì, una volta", "Sì, tante volte", "No, mai"], answer: 2, explain: "Io non sono mai stato al Palio." }
