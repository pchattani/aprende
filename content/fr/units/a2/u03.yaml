  - id: a2.u03.l4
    title: "Maupassant et Arsène Lupin"
    teach: [g.imparfait-uses, g.c-etait]
    tip: "Use c'était + un/une + noun for people and things: C'était un romancier. Use il était + adjective or job without article: Il était très poli."
    vocab: [w.romancier, w.roman, w.voleur, w.cambrioleur, w.ennuyer, w.bête.n, w.marinière, w.pendentif, w.boule, w.triskell, w.tartine, w.jeu-vidéo, w.temps-libre, w.soda, w.chewing-gum, w.bonbon, w.rouler]
    sentences:
      - { es: "Le romancier Guy de Maupassant habitait à Étretat quand il était jeune.", en: "The novelist Guy de Maupassant lived in Étretat when he was young.", altEs: ["Quand il était jeune, le romancier Guy de Maupassant habitait à Étretat."], grammar: [g.imparfait-uses], vocab: [w.romancier], note: "Maupassant (1850–1893) spent part of his childhood in Étretat with his mother." }
      - { es: "Arsène Lupin était un voleur, mais un voleur très poli : un « gentleman cambrioleur ».", en: "Arsène Lupin was a thief, but a very polite thief: a 'gentleman burglar'.", grammar: [g.c-etait], vocab: [w.voleur, w.cambrioleur] }
      - { es: "Dans le roman L'Aiguille creuse, Lupin cachait son trésor dans l'Aiguille d'Étretat.", en: "In the novel The Hollow Needle, Lupin hid his treasure inside the Needle of Étretat.", grammar: [g.imparfait-uses], vocab: [w.roman, w.aiguille], note: "Maurice Leblanc published L'Aiguille creuse in 1909; his house in Étretat is now a museum." }
      - { es: "Quand j'étais jeune, je lisais les romans de Maurice Leblanc le soir, au lit.", en: "When I was young, I used to read Maurice Leblanc's novels in the evening, in bed.", altEs: ["Quand j'étais jeune, le soir, au lit, je lisais les romans de Maurice Leblanc."], grammar: [g.imparfait-uses], vocab: [w.roman],
          transform: { instruction: "Change to 'nous'", answer: "Quand nous étions jeunes, nous lisions les romans de Maurice Leblanc le soir, au lit." } }
      - { es: "Les cours d'histoire m'ennuyaient beaucoup.", en: "History lessons used to bore me a lot.", altEs: ["Les cours d'histoire m'ennuyaient énormément."], grammar: [g.imparfait-uses], vocab: [w.ennuyer] }
      - { es: "Le soir, on mangeait des tartines avec de la confiture.", en: "In the evening we ate slices of bread with jam.", altEs: ["Le soir, nous mangions des tartines avec de la confiture."], grammar: [g.imparfait-uses, g.partitive-articles], vocab: [w.tartine] }
      - { es: "À l'époque, nous n'avions pas de jeux vidéo : nous jouions dehors.", en: "Back then we didn't have video games: we played outside.", altEs: ["À l'époque, on n'avait pas de jeux vidéo : on jouait dehors."], grammar: [g.imparfait-uses, g.de-after-negation], vocab: [w.jeu-vidéo, w.à-l-époque] }
      - { es: "Pendant mon temps libre, je roulais à vélo jusqu'au phare.", en: "In my free time I'd cycle to the lighthouse.", altEs: ["Pendant mon temps libre, j'allais à vélo jusqu'au phare."], grammar: [g.imparfait-uses], vocab: [w.temps-libre, w.rouler, w.phare] }
      - { es: "Ma mère ne voulait pas : pas de soda, pas de chewing-gum et pas de bonbons !", en: "My mother wouldn't allow it: no fizzy drinks, no chewing gum and no sweets!", altEs: ["Ma mère ne voulait pas : pas de soda, pas de chewing-gum, pas de bonbons !"], grammar: [g.imparfait-uses], vocab: [w.soda, w.chewing-gum, w.bonbon] }
      - { es: "Mon grand-père portait toujours une marinière bleue et blanche.", en: "My grandfather always wore a blue and white striped top.", grammar: [g.imparfait-uses], vocab: [w.marinière] }
      - { es: "Elle portait un pendentif triskell : c'était un cadeau de sa grand-mère bretonne.", en: "She wore a triskelion pendant: it was a present from her Breton grandmother.", altEs: ["Elle portait un pendentif triskell, c'était un cadeau de sa grand-mère bretonne."], grammar: [g.c-etait], vocab: [w.pendentif, w.triskell] }
      - { es: "Je prenais toujours deux boules de glace : chocolat et fraise.", en: "I always had two scoops of ice cream: chocolate and strawberry.", altEs: ["Je prenais toujours deux boules : chocolat et fraise."], grammar: [g.imparfait-uses], vocab: [w.boule, w.fraise] }
      - { es: "Notre chien était une bonne bête : il dormait toute la journée.", en: "Our dog was a good old thing: he slept all day long.", altEs: ["Notre chien était une bonne bête, il dormait toute la journée."], grammar: [g.imparfait-uses], vocab: [w.bête.n] }
      - { es: "Qui était Arsène Lupin ? — C'était un cambrioleur dans les romans de Maurice Leblanc.", en: "Who was Arsène Lupin? — He was a burglar in Maurice Leblanc's novels.", grammar: [g.c-etait, g.c-est-il-est], vocab: [w.cambrioleur, w.roman],
          error: { wrong: "Qui était Arsène Lupin ? — Il était un cambrioleur dans les romans de Maurice Leblanc.", explain: "Before un/une + noun, use c'était, not il était.", grammar: g.c-etait } }
      - { es: "Lis ce roman : c'était mon livre préféré quand j'avais quinze ans !", en: "Read this novel: it was my favourite book when I was fifteen!", altEs: ["Lis ce roman, c'était mon livre préféré quand j'avais quinze ans !"], grammar: [g.c-etait, g.imperative], vocab: [w.roman],
          transform: { instruction: "Change to 'vous'", answer: "Lisez ce roman : c'était mon livre préféré quand j'avais quinze ans !", alt: ["Lisez ce roman, c'était mon livre préféré quand j'avais quinze ans !"] } }
    exchanges:
      - q: { es: "Qui était Maupassant ?", en: "Who was Maupassant?" }
        a: { es: "C'était un romancier normand.", en: "He was a Norman novelist." }
        alt: ["Un écrivain.", "C'était un écrivain normand."]
