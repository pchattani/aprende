id: r.b1.gentile-direttrice
level: b1
title: Gentile Direttrice
kind: text
intro: A formal letter of complaint to a hotel in the Cinque Terre, followed by the manager's reply. Notice the formal Lei, the set phrases of Italian letters and connectors such as poiché, tuttavia, pertanto.
allow: [vernazza, monterosso, cinque, terre, bassi, chiara, lorenzo, marchi, gabbiano, liguria]
paragraphs:
  - { es: "Oggetto: reclamo per il soggiorno dal 12 al 15 giugno. Gentile Direttrice, Le scrivo in merito al soggiorno che io e mia moglie abbiamo trascorso presso il Suo albergo, l'Hotel Gabbiano di Vernazza, dal 12 al 15 giugno. Avevamo scelto la Sua struttura con molti mesi di anticipo, poiché era il nostro anniversario di matrimonio e desideravamo un soggiorno speciale.", en: "Subject: complaint about the stay from 12 to 15 June. Dear Manager, I am writing to you regarding the stay that my wife and I spent at your hotel, the Hotel Gabbiano in Vernazza, from 12 to 15 June. We had chosen your establishment many months in advance, since it was our wedding anniversary and we wanted a special stay." }
  - { es: "Al momento della prenotazione avevamo richiesto una camera con vista mare, che ci era stata confermata per iscritto. Tuttavia, al nostro arrivo, ci è stata assegnata una camera al piano terra, con la finestra su una strada stretta e rumorosa. Quando ne abbiamo chiesto il motivo, il receptionist ci ha risposto che l'albergo era pieno e che non era possibile fare nulla. Abbiamo quindi trascorso le nostre tre notti con il rumore dei motorini e delle persone che tornavano dalla spiaggia fino a tarda notte.", en: "When booking, we had requested a room with a sea view, which had been confirmed to us in writing. However, on our arrival we were given a room on the ground floor, with a window onto a narrow, noisy street. When we asked why, the receptionist told us that the hotel was full and nothing could be done. We therefore spent our three nights with the noise of scooters and of people coming back from the beach until late at night." }
  - { es: "Inoltre, la colazione, che nel sito viene descritta come «ricca e con prodotti tipici liguri», consisteva in pochi biscotti confezionati e in un caffè tiepido. Infine, la doccia ha perso acqua per tutti e tre i giorni, nonostante l'avessimo segnalato più volte.", en: "In addition, the breakfast, which is described on the website as 'rich, with typical Ligurian products', consisted of a few packaged biscuits and a lukewarm coffee. Finally, the shower leaked for all three days, even though we had reported it several times." }
  - { es: "Comprendo che durante l'alta stagione possano verificarsi degli inconvenienti. Ciononostante, ritengo che il servizio ricevuto non corrisponda né al prezzo pagato né a quanto promesso. Pertanto Le chiedo cortesemente un rimborso parziale della somma versata. In attesa di un Suo cortese riscontro, porgo distinti saluti. Lorenzo Bassi", en: "I understand that problems can occur during the high season. Nevertheless, I believe that the service we received corresponds neither to the price paid nor to what was promised. I therefore kindly request a partial refund of the amount paid. I look forward to your reply. Yours faithfully, Lorenzo Bassi" }
  - { es: "Oggetto: risposta al Suo reclamo. Gentile Signor Bassi, La ringrazio per la Sua lettera e, prima di tutto, Le chiedo sinceramente scusa a nome di tutto il personale. Ho verificato quanto da Lei segnalato e devo ammettere che ha perfettamente ragione. Per un errore del nostro sistema di prenotazione, la camera con vista mare era stata assegnata a due clienti diversi.", en: "Subject: reply to your complaint. Dear Mr Bassi, Thank you for your letter and, first of all, please accept my sincere apologies on behalf of all the staff. I have checked what you reported and I must admit that you are quite right. Due to an error in our booking system, the sea-view room had been assigned to two different guests." }
  - { es: "Mi dispiace molto, inoltre, che il nostro collaboratore non Le abbia offerto alcuna soluzione. Per quanto riguarda la colazione, nei giorni del Suo soggiorno la nostra fornitrice di focaccia era in ferie, ma riconosco che avremmo dovuto informare i clienti. Il guasto della doccia è stato riparato il giorno dopo la Sua partenza. Mi permetto di aggiungere che, proprio per evitare situazioni simili, da questa settimana abbiamo un nuovo responsabile della reception.", en: "I am also very sorry that our staff member did not offer you any solution. As for breakfast, during your stay our focaccia supplier was on holiday, but I recognise that we should have informed our guests. The fault in the shower was repaired the day after your departure. May I add that, precisely to avoid similar situations, as of this week we have a new head of reception." }
  - { es: "Per rimediare, abbiamo deciso di rimborsarLe il quaranta per cento della somma pagata. Inoltre, saremmo felici di offrirLe due notti gratuite nella nostra camera migliore, con terrazza sul mare, in una data a Sua scelta, affinché Lei e Sua moglie possiate festeggiare il vostro anniversario come meritate. Restando a Sua disposizione per qualsiasi informazione, Le porgo cordiali saluti. Chiara Marchi, Direttrice", en: "To make amends, we have decided to refund you forty per cent of the amount paid. In addition, we would be happy to offer you two free nights in our best room, with a terrace over the sea, on a date of your choice, so that you and your wife can celebrate your anniversary as you deserve. Remaining at your disposal for any information, kind regards. Chiara Marchi, Manager" }
questions:
  - { q: "Perché il signor Bassi aveva scelto quell'albergo?", options: ["Per un viaggio di lavoro", "Per festeggiare l'anniversario di matrimonio", "Perché era economico"], answer: 1, explain: "«Era il nostro anniversario di matrimonio e desideravamo un soggiorno speciale.»" }
  - { q: "Quale problema NON viene citato nella lettera di reclamo?", options: ["La camera senza vista mare", "La colazione povera", "Il letto scomodo"], answer: 2, explain: "He complains about the room, the breakfast and the leaking shower – not the bed." }
  - { q: "Che cosa chiede il signor Bassi?", options: ["Un rimborso parziale", "Una nuova camera", "Di parlare con il receptionist"], answer: 0, explain: "«Le chiedo cortesemente un rimborso parziale della somma versata.»" }
  - { q: "Perché la camera con vista mare non era disponibile?", options: ["Era in ristrutturazione", "Per un errore era stata assegnata a due clienti", "Il signor Bassi non l'aveva prenotata"], answer: 1, explain: "A booking-system error had assigned it twice." }
  - { q: "Che cosa offre la direttrice?", options: ["Solo le scuse", "Il quaranta per cento della somma e due notti gratis", "Una cena al ristorante"], answer: 1, explain: "A 40% refund plus two free nights in the best room." }
