dialogues:
  - id: a1.u02.d1
    title: 我喺中環
    context: Sam is lost among the towers of Central and his phone is nearly dead. He calls Mandy.
    lines:
      - { speaker: Mandy, es: "喂，Sam？你喺邊度呀？", en: "Hello, Sam? Where are you?" }
      - { speaker: Sam, es: "我喺中環，喺一間銀行門口。", en: "I'm in Central, outside a bank." }
      - { speaker: Mandy, es: "邊間銀行呀？", en: "Which bank?" }
      - { speaker: Sam, es: "我唔知呀。呢度有好多銀行同高樓。", en: "I don't know. There are lots of banks and tall buildings here." }
      - { speaker: Mandy, es: "你有冇地圖呀？", en: "Do you have a map?" }
      - { speaker: Sam, es: "冇呀，我部手機就快冇電喇！", en: "No, and my phone is almost out of battery!" }
      - { speaker: Mandy, es: "唔緊要。你附近有冇便利店呀？", en: "Never mind. Is there a convenience store near you?" }
      - { speaker: Sam, es: "有，對面有一間。", en: "Yes, there's one opposite." }
      - { speaker: Mandy, es: "好，你喺便利店等我，我而家嚟。", en: "OK, wait for me at the convenience store. I'm coming now." }
      - { speaker: Sam, es: "冇問題，唔該晒！", en: "No problem, thanks a lot!" }
    questions:
      - { q: "Sam喺邊度呀？", options: ["中環", "灣仔", "機場"], answer: 0, explain: "我喺中環: Sam is in Central." }
      - { q: "Sam有冇地圖呀？", options: ["有", "冇", "佢唔知"], answer: 1, explain: "Sam answers 冇呀: he has no map, and his phone is almost dead." }
      - { q: "對面有乜嘢呀？", options: ["一間學校", "一間便利店", "一間銀行"], answer: 1, explain: "對面有一間 (便利店): there's a convenience store opposite." }
      - { q: "Mandy叫Sam喺邊度等佢？", options: ["銀行門口", "便利店", "機場"], answer: 1, explain: "你喺便利店等我: wait for me at the convenience store." }
writing:
  - task: "Write where you are now and where you live, and say whether it's near the MTR station."
