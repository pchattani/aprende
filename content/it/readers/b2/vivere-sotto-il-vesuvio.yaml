id: r.b2.vivere-sotto-il-vesuvio
level: b2
title: Vivere sotto il Vesuvio
kind: dialogue
intro: A radio interview with Carmela, who grows tomatoes and grapes on the slopes of Vesuvius. Why do hundreds of thousands of people live next to one of the most dangerous volcanoes in the world? Listen for concessive structures (benché, nonostante, pur + gerund, chiunque, qualunque).
allow: [carmela, vesuvio, ercolano, napoli, lacryma, christi, piennolo, sebastiano, osservatorio, vesuviano, vesuviani]
paragraphs:
  - { es: "Giornalista: Buongiorno, Carmela, e grazie di averci accolto nella sua azienda agricola. Siamo a cinquecento metri d'altezza, sulle pendici del Vesuvio, e da qui si vede tutto il golfo di Napoli. Lei è nata qui?", en: "Journalist: Good morning, Carmela, and thank you for welcoming us to your farm. We're five hundred metres up, on the slopes of Vesuvius, and from here you can see the whole Bay of Naples. Were you born here?" }
  - { es: "Carmela: Sì, e anche mio padre, mio nonno e il nonno di mio nonno. La mia famiglia coltiva questa terra da almeno duecento anni. Facciamo vino, il Lacryma Christi, e i pomodorini del piennolo, quelli che si appendono in grappoli e durano tutto l'inverno.", en: "Carmela: Yes, and so were my father, my grandfather and my grandfather's grandfather. My family has farmed this land for at least two hundred years. We make wine, Lacryma Christi, and piennolo cherry tomatoes, the ones you hang up in bunches that last all winter." }
  - { es: "Giornalista: La domanda che le fanno tutti, immagino, è questa: perché vivere sotto un vulcano attivo?", en: "Journalist: The question everyone asks you, I imagine, is this: why live under an active volcano?" }
  - { es: "Carmela: Me lo chiedono sempre, sì, soprattutto i turisti. La risposta è semplice: la terra vulcanica è la più fertile che esista. Benché il Vesuvio faccia paura, è anche lui che ci dà da vivere. Qualunque cosa pianti qui, cresce meglio che altrove. I Romani lo sapevano già: prima del 79 dopo Cristo, il Vesuvio era coperto di vigne.", en: "Carmela: They always ask me that, yes, especially the tourists. The answer is simple: volcanic soil is the most fertile there is. Even though Vesuvius is frightening, it's also what gives us our living. Whatever you plant here grows better than anywhere else. The Romans already knew it: before AD 79, Vesuvius was covered in vineyards." }
  - { es: "Giornalista: Eppure, sappiamo come è andata a finire per i Romani. Lei non ha paura?", en: "Journalist: And yet we know how it ended for the Romans. Aren't you afraid?" }
  - { es: "Carmela: Chiunque le dica di non avere paura, le mente. Io ce l'ho, certo. L'ultima eruzione è stata nel 1944, durante la guerra. Mio nonno la vide con i suoi occhi: la lava arrivò fino a San Sebastiano e distrusse metà del paese. Ma pur avendo paura, non me ne andrei mai. Questa è casa mia.", en: "Carmela: Anyone who tells you they're not afraid is lying. I am, of course. The last eruption was in 1944, during the war. My grandfather saw it with his own eyes: the lava reached San Sebastiano and destroyed half the town. But even though I'm afraid, I'd never leave. This is my home." }
  - { es: "Giornalista: Nella cosiddetta «zona rossa», quella più esposta, vivono circa settecentomila persone. Esiste un piano di evacuazione. Lei lo conosce?", en: "Journalist: In the so-called 'red zone', the most exposed area, about seven hundred thousand people live. There's an evacuation plan. Do you know it?" }
  - { es: "Carmela: Lo conosco, sì. Prevede che, in caso di allarme, tutti gli abitanti vengano trasferiti in altre regioni d'Italia entro settantadue ore. Ogni comune è gemellato con una regione: noi, per esempio, andremmo in Lombardia. Sulla carta funziona. Nella realtà, con il traffico che c'è qui, non so quanto sarebbe facile. Ci sono state esercitazioni, ma poca gente ci ha partecipato.", en: "Carmela: I know it, yes. It provides that, in case of alarm, all the inhabitants are moved to other regions of Italy within seventy-two hours. Each municipality is twinned with a region: we, for example, would go to Lombardy. On paper it works. In reality, with the traffic we have here, I don't know how easy it would be. There have been drills, but few people took part." }
  - { es: "Giornalista: Non è preoccupante?", en: "Journalist: Isn't that worrying?" }
  - { es: "Carmela: Sì, lo è. Però c'è anche una cosa che mi rassicura. Il Vesuvio è uno dei vulcani più controllati del mondo. L'Osservatorio Vesuviano, che è il più antico osservatorio vulcanologico del mondo, lo studia dal 1841, giorno e notte. Gli scienziati dicono che un'eruzione non arriverebbe senza segnali: ci sarebbero terremoti, cambiamenti nel terreno, gas. Per quanto mi riguarda, mi fido più di loro che dei miei vicini al volante.", en: "Carmela: Yes, it is. But there's also something that reassures me. Vesuvius is one of the most closely monitored volcanoes in the world. The Vesuvius Observatory, which is the oldest volcano observatory in the world, has been studying it since 1841, day and night. The scientists say an eruption wouldn't come without warning signs: there would be earthquakes, changes in the ground, gas. As far as I'm concerned, I trust them more than my neighbours behind the wheel." }
  - { es: "Giornalista: (ridendo) Un'ultima domanda. Se un giorno dovesse andarsene davvero, che cosa porterebbe con sé?", en: "Journalist: (laughing) One last question. If one day you really had to leave, what would you take with you?" }
  - { es: "Carmela: Le foto di famiglia, e una bottiglia del nostro vino. Per quanto possa sembrare strano, la porterei per tornare. Perché, comunque vada, qui torneremmo. I vesuviani tornano sempre.", en: "Carmela: The family photos, and a bottle of our wine. Strange as it may seem, I'd take it so as to come back. Because, whatever happens, we'd come back here. The people of Vesuvius always come back." }
questions:
  - { q: "Perché, secondo Carmela, la gente vive sul Vesuvio?", options: ["Perché le case costano poco", "Perché la terra vulcanica è molto fertile", "Perché il vulcano è spento"], answer: 1, explain: "«La terra vulcanica è la più fertile che esista.»" }
  - { q: "Quando è stata l'ultima eruzione?", options: ["Nel 79 dopo Cristo", "Nel 1841", "Nel 1944"], answer: 2, explain: "1944, during the Second World War; her grandfather saw it." }
  - { q: "Che cosa prevede il piano di evacuazione?", options: ["Che gli abitanti siano trasferiti in altre regioni entro settantadue ore", "Che tutti vadano a Napoli", "Che nessuno debba partire"], answer: 0, explain: "Each municipality is twinned with a region; Carmela's would go to Lombardy." }
  - { q: "Che cosa rassicura Carmela?", options: ["Il traffico", "Il fatto che il Vesuvio sia controllato giorno e notte", "Le esercitazioni"], answer: 1, explain: "The Vesuvius Observatory has monitored the volcano since 1841, and an eruption would give warning signs." }
  - { q: "Che cosa significa «pur avendo paura, non me ne andrei mai»?", options: ["Because I'm afraid, I'd leave", "Even though I'm afraid, I'd never leave", "I'm not afraid, so I'd never leave"], answer: 1, explain: "Pur + gerund is concessive: 'even though'. Andarsene = to leave, go away." }
