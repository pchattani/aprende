id: r.b2.even-grandma-uses-it
level: b2
title: 連阿婆都識用
kind: text
intro: Eighty-one-year-old Mrs Lau has lived on Peng Chau all her life and never owned a smartphone. When her granddaughter moves abroad, she decides it is time to learn - with the help of half the island.
allow: [劉婆婆]
paragraphs:
  - { es: "劉婆婆今年八十一歲，喺坪洲出世，喺坪洲大，一世都未離開過呢個小島超過一個禮拜。佢一向覺得智能手機係後生仔嘅玩具，同佢一啲關係都冇。佢屋企連電腦都冇，有咩事就打屋企電話，或者行去街坊屋企拍門。", en: "Mrs Lau is eighty-one this year. She was born and grew up on Peng Chau, and in her whole life she has never left the little island for more than a week. She had always thought smartphones were toys for young people that had nothing whatsoever to do with her. Her home doesn't even have a computer: if anything comes up she phones on her landline or walks over and knocks on a neighbour's door." }
  - { es: "直到舊年，佢個孫女阿欣去咗英國讀書。阿欣臨走之前同佢講：「婆婆，你學用手機啦，噉我哋就可以日日視像，你可以見到我。」劉婆婆搖頭：「我連個掣都撳唔啱，點學呀？」阿欣就話：「唔難㗎，連隔籬陳伯都識用啦！」", en: "Then last year her granddaughter Yan went to study in England. Before she left, Yan said to her: \"Grandma, learn to use a smartphone, then we can video call every day and you can see me.\" Mrs Lau shook her head: \"I can't even press the right button. How could I learn?\" Yan said: \"It isn't hard. Even Uncle Chan next door can use one!\"" }
  - { es: "一聽到陳伯都識用，劉婆婆就唔服氣。佢哋兩個做咗六十年鄰居，乜嘢都要比：邊個種嘅菜大啲、邊個煲嘅湯好飲啲。「佢識，我冇理由唔識！」於是阿欣臨走前幫佢買咗部大字嘅手機，教佢點樣開機、點樣聽電話。", en: "As soon as she heard that even Uncle Chan could use one, Mrs Lau wasn't going to be outdone. The two of them had been neighbours for sixty years and competed over everything: whose vegetables grew bigger, whose soup tasted better. \"If he can, there's no reason I can't!\" So before she left, Yan bought her a phone with large text and taught her how to turn it on and answer calls." }
  - { es: "阿欣走咗之後，問題就嚟喇。劉婆婆一個字都唔識打，又睇唔清楚啲細字。第一個禮拜，佢唔小心刪咗所有聯絡人；第二個禮拜，佢想影相，點知開咗自拍，影咗幾十張自己個鼻。佢嬲到想將部手機掟落海。", en: "After Yan left, the trouble began. Mrs Lau couldn't type a single character and couldn't read the small print. In the first week she accidentally deleted all her contacts; in the second week she tried to take a photo, but switched on the selfie camera instead and took dozens of pictures of her own nose. She was so annoyed she wanted to throw the phone into the sea." }
  - { es: "好在坪洲地方細，人人都識人人。茶樓嘅伙記教佢用語音輸入，「講嘢就變字，唔使打」；士多嘅老闆娘教佢掃碼畀錢；連碼頭嗰個賣魚蛋嘅後生仔都走過嚟，教佢點樣放大啲字。佢話：「婆婆，你唔好怕撳錯，撳錯咗大不了再嚟過。」", en: "Luckily Peng Chau is small and everyone knows everyone. The waiter at the teahouse taught her to use voice input - \"you talk and it turns into words, no typing needed\"; the woman who runs the corner shop taught her to pay by scanning a code; even the young man who sells fish balls at the pier came over and showed her how to make the text bigger. He said: \"Granny, don't be afraid of pressing the wrong thing. If you do, you can just start again.\"" }
  - { es: "三個月之後，劉婆婆已經識得同阿欣視像，又識得喺家庭群組度傳相。佢最鍾意影佢種嘅菜同養嘅貓，每朝早都傳一張「早晨」圖畀全家人，連喺加拿大嘅表姨都收到。有一日，佢仲喺網上睇片學整咗一個英式鬆餅，影咗相傳畀阿欣睇。", en: "Three months later, Mrs Lau could video call Yan and share photos in the family group chat. Her favourite things to photograph are the vegetables she grows and her cat, and every morning she sends a \"good morning\" picture to the whole family - even her cousin in Canada gets one. One day she even learned to make an English scone from an online video, and sent a photo of it to Yan." }
  - { es: "最好笑嘅係，有一日陳伯走嚟問佢：「劉師奶，你點樣喺手機度睇天氣㗎？我唔識喎。」原來陳伯根本唔識用手機，佢只係識聽電話！劉婆婆笑到碌地：「你個衰佬，原來你都係扮嘢！」", en: "The funniest part was when Uncle Chan came over one day and asked her: \"Mrs Lau, how do you check the weather on your phone? I can't work it out.\" It turned out Uncle Chan couldn't really use a phone at all; all he could do was answer calls! Mrs Lau laughed till she cried: \"You rascal, so you were just showing off!\"" }
  - { es: "而家，劉婆婆每個禮拜三下晝喺社區中心幫手，教其他長者用手機。佢成日同佢哋講：「我八十一歲都學得識，你哋冇理由學唔識。最緊要係唔好怕醜，唔識就問。」佢話，學識用手機之後，佢覺得自己同個世界嘅距離近咗好多，連英國都好似喺隔籬噉。", en: "Now Mrs Lau helps out at the community centre every Wednesday afternoon, teaching other elderly people to use smartphones. She is always telling them: \"I learned at eighty-one, so there's no reason you can't. The most important thing is not to be shy: if you don't know, ask.\" She says that since learning to use a smartphone she feels much closer to the world - even England feels as if it's right next door." }
questions:
  - { q: "劉婆婆點解決定學用手機？", options: ["想同喺英國嘅孫女視像", "想打機", "社區中心要佢學"], answer: 0, explain: "阿欣去咗英國讀書… 你學用手機啦，噉我哋就可以日日視像." }
  - { q: "點解一聽到陳伯識用，劉婆婆就唔服氣？", options: ["因為佢哋兩個乜嘢都要比", "因為陳伯好後生", "因為陳伯係佢老公"], answer: 0, explain: "佢哋兩個做咗六十年鄰居，乜嘢都要比." }
  - { q: "第二個禮拜發生咗乜嘢好笑嘅事？", options: ["佢刪咗所有聯絡人", "佢影咗幾十張自己個鼻", "佢將手機掟咗落海"], answer: 1, explain: "開咗自拍，影咗幾十張自己個鼻. Deleting the contacts was the first week; she only wanted to throw it into the sea." }
  - { q: "邊個教劉婆婆掃碼畀錢？", options: ["茶樓伙記", "士多老闆娘", "賣魚蛋嘅後生仔"], answer: 1, explain: "士多嘅老闆娘教佢掃碼畀錢." }
  - { q: "最後劉婆婆發現陳伯點樣？", options: ["佢好識用手機", "佢根本唔識用手機", "佢搬咗去英國"], answer: 1, explain: "原來陳伯根本唔識用手機，佢只係識聽電話！" }
  - { q: "而家劉婆婆每個禮拜三做乜嘢？", options: ["去英國", "喺社區中心教長者用手機", "同陳伯飲茶"], answer: 1, explain: "每個禮拜三下晝喺社區中心幫手，教其他長者用手機." }
glossary:
