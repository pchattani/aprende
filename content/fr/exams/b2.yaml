grammar:
  - { prompt: "Je t'explique le chemin pour que tu ne te ___ pas.", options: ["perds", "perdes", "perdras"], answer: 1, explain: "pour que + subjonctif (g.subjonctif-conjonctions)." }
  - { prompt: "Rentrons avant qu'il ___ pleuve.", options: ["ne", "pas", "n'"], answer: 0, explain: "Expletive ne in formal French after avant que: avant qu'il ne pleuve (g.ne-expletif)." }
  - { prompt: "Je suis ravie que vous ___ venir hier.", options: ["avez pu", "ayez pu", "pourriez"], answer: 1, explain: "A completed action after an emotion: subjonctif passé (g.subjonctif-passe)." }
  - { prompt: "Je doute qu'il ___ à l'heure.", options: ["arrive", "arrivera", "arrivait"], answer: 0, explain: "Doubt takes the subjonctif (g.subjonctif-doute)." }
  - { prompt: "Je cherche un guide qui ___ l'allemand.", options: ["parle", "parlera", "a parlé"], answer: 0, explain: "A hypothetical antecedent takes the subjonctif in the relative clause (g.subjonctif-relatives)." }
  - { prompt: "Si tu m'avais prévenu, je ___ te chercher à la gare.", options: ["serais venu", "viendrais", "suis venu"], answer: 0, explain: "si + plus-que-parfait, conditionnel passé (g.si-plus-que-parfait)." }
  - { prompt: "Si j'avais accepté ce poste, je ___ à Paris aujourd'hui.", options: ["vivrais", "aurais vécu", "vivrai"], answer: 0, explain: "Mixed: past condition, present result → conditionnel présent (g.mixed-si-clauses)." }
  - { prompt: "Il n'est pas là ? Il ___ se tromper de route.", options: ["a dû", "devrait", "doit avoir"], answer: 0, explain: "Probability about the past: il a dû + infinitive (g.devoir-nuances)." }
  - { prompt: "Le guide a dit qu'il ___ beau le lendemain.", options: ["fera", "ferait", "faisait"], answer: 1, explain: "After a past reporting verb, the future becomes the conditionnel (g.concordance-des-temps)." }
  - { prompt: "C'est la raison pour ___ je suis parti.", options: ["lequel", "laquelle", "quoi"], answer: 1, explain: "raison is feminine: pour laquelle (g.relative-lequel)." }
  - { prompt: "Le lac au bord ___ nous avons dîné était magnifique.", options: ["dont", "duquel", "auquel"], answer: 1, explain: "After a compound preposition (au bord de), use duquel, not dont (g.dont-vs-duquel)." }
  - { prompt: "C'est un travail très ___.", options: ["fatiguant", "fatigant", "fatiguante"], answer: 1, explain: "Verbal adjective spelling: fatigant (participle: fatiguant) (g.adjectif-verbal)." }
  - { prompt: "J'ai beau ___, je ne comprends pas.", options: ["chercher", "cherche", "cherché"], answer: 0, explain: "avoir beau + infinitive = however much I… (g.concession)." }
  - { prompt: "Je vais ___ réparer ma voiture.", options: ["faire", "laisser", "me faire"], answer: 0, explain: "faire + infinitive = have something done (g.faire-causatif)." }
  - { prompt: "Le Parlement ___ -t-il voté la loi ?", options: ["a", "est", "ait"], answer: 0, explain: "Formal complex inversion: noun subject + verb + -t-il (g.formal-inversion)." }
writing:
  prompt: "A French magazine asks its readers: « Faut-il limiter le tourisme dans les Alpes ? » Write an opinion article of at least 180 words. Give it a title; introduce the topic and state your position; develop two arguments with connectors (d'une part… d'autre part, en outre, par conséquent); concede a point and reply to it (certes… néanmoins, bien que + subjonctif); use at least one sentence with si + plus-que-parfait + conditionnel passé and one passive or pronominal passive; end with a recommendation (il faudrait que…, il serait souhaitable que…)."
  minWords: 180
  modelAnswer: |
    Les Alpes, victimes de leur succès ?

    Chaque hiver, des millions de skieurs montent dans les stations des Alpes, et chaque été, les randonneurs sont de plus en plus nombreux. Le tourisme fait vivre la montagne ; pourtant, je pense qu'il est temps de le limiter.

    D'une part, la montagne souffre. Les routes sont bloquées par les voitures, l'air de certaines vallées est très pollué et les sentiers les plus connus sont abîmés. D'autre part, le climat change : la neige se fait rare, et de nombreuses stations fabriquent de la neige artificielle, ce qui consomme énormément d'eau. En outre, les habitants ne trouvent plus de logement, car les appartements sont loués aux touristes.

    Certes, le tourisme crée des emplois, et bien qu'il soit parfois mal payé, il permet aux jeunes de rester au pays. Néanmoins, si on avait mieux organisé ce tourisme il y a vingt ans, on aurait évité bien des problèmes.

    Par conséquent, il faudrait que les stations limitent le nombre de visiteurs les jours de grande affluence et qu'elles développent les activités d'été. Il serait aussi souhaitable que les touristes viennent en train plutôt qu'en voiture. La montagne se partage ; elle ne se consomme pas.
  checklist:
    - "I gave the article a title and stated my position in the introduction."
    - "I organised two arguments with connectors (d'une part… d'autre part, en outre, par conséquent)."
    - "I conceded a point (certes, bien que + subjonctif) and replied with néanmoins / pourtant."
    - "I used si + plus-que-parfait with the conditionnel passé correctly."
    - "I used at least one passive or pronominal passive (sont bloquées, se fait rare, se partage)."
    - "I ended with a recommendation using il faudrait que / il serait souhaitable que + subjonctif."
