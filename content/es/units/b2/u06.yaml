id: b2.u06
title: Me dijo que viniera
lessons:
  - id: b2.u06.l1
    title: Me dijo que tuviera paciencia
    teach: [g.reported-speech-subjunctive]
    vocab: [w.replicar, w.soltar, w.desaconsejar, w.educar, w.crianza, w.insistencia, w.ruego, w.unir, w.ejemplar, w.consultar, w.acompanar]
    tip: "When you report in the past, the subjunctive shifts back too: present → imperfect (que vengas → que viniera), perfect → pluperfect (que hayas comido → que hubiera comido)."
    sentences:
      - { es: "Mi abuela me dijo que tuviera paciencia, que todo llega.", en: "My grandmother told me to be patient, that everything comes in time.", altEs: ["Mi abuela me dijo que tuviese paciencia, que todo llega."], grammar: [g.reported-speech-subjunctive], vocab: [w.abuela, w.ten-paciencia, w.llegar] }
      - { es: "Nos aconsejó que no nos casáramos antes de los treinta.", en: "She advised us not to get married before thirty.", altEs: ["Nos aconsejó que no nos casásemos antes de los treinta."], grammar: [g.reported-speech-subjunctive], vocab: [w.aconsejar, w.casarse] }
      - { es: "Mi madre esperaba que yo hubiera ahorrado algo antes de la boda, pero no fue así.", en: "My mother hoped I had saved something before the wedding, but that wasn't the case.", altEs: ["Mi madre esperaba que yo hubiese ahorrado algo antes de la boda, pero no fue así."], grammar: [g.reported-speech-subjunctive, g.subjunctive-pluperfect], vocab: [w.ahorrar, w.boda, w.esperar], note: "Direct: «Espero que hayas ahorrado» → reported: esperaba que hubiera ahorrado." }
      - { es: "El abuelo dudaba de que mi primo fuera capaz de educar a tres hijos.", en: "Grandfather doubted that my cousin was capable of bringing up three children.", altEs: ["El abuelo dudaba de que mi primo fuese capaz de educar a tres hijos."], grammar: [g.reported-speech-subjunctive], vocab: [w.dudar, w.educar, w.capaz, w.primo] }
      - { es: "Les sugerí que consultaran a un psicólogo sobre la crianza del bebé, y se ofendieron.", en: "I suggested they consult a psychologist about the baby's upbringing, and they took offence.", altEs: ["Les sugerí que consultasen a un psicólogo sobre la crianza del bebé, y se ofendieron."], grammar: [g.reported-speech-subjunctive], vocab: [w.sugerir, w.consultar, w.crianza, w.ofender] }
      - { es: "Me rogó que no soltara ninguna tontería delante de la familia.", en: "She begged me not to blurt out anything silly in front of the family.", altEs: ["Me rogó que no soltase ninguna tontería delante de la familia."], grammar: [g.reported-speech-subjunctive], vocab: [w.rogar, w.soltar, w.tonteria] }
      - { es: "Mi padre me desaconsejó que estudiara Filosofía; según él, no daba dinero.", en: "My father advised me against studying philosophy; according to him, it didn't pay.", altEs: ["Mi padre me desaconsejó que estudiase Filosofía; según él, no daba dinero."], grammar: [g.reported-speech-subjunctive], vocab: [w.desaconsejar, w.estudiar, w.segun] }
      - { es: "Dijo que ojalá sus nietos vivieran más cerca.", en: "She said she wished her grandchildren lived closer.", altEs: ["Dijo que ojalá sus nietos viviesen más cerca."], grammar: [g.reported-speech-subjunctive], vocab: [w.ojala, w.nieto, w.cerca], note: "«Ojalá vivan más cerca» → dijo que ojalá vivieran más cerca." }
      - { es: "Mi tía replicó que no creía que la crianza fuera cosa solo de madres.", en: "My aunt retorted that she didn't think child-rearing was only a mothers' matter.", altEs: ["Mi tía replicó que no creía que la crianza fuese cosa solo de madres."], grammar: [g.reported-speech-subjunctive, g.creer-no-creer], vocab: [w.replicar, w.crianza, w.madre] }
      - { es: "La abuela tenía miedo de que hubiéramos perdido las viejas costumbres.", en: "Grandmother was afraid we had lost the old customs.", altEs: ["La abuela tenía miedo de que hubiésemos perdido las viejas costumbres."], grammar: [g.reported-speech-subjunctive, g.subjunctive-pluperfect], vocab: [w.tener-miedo.phr, w.costumbre, w.perder] }
      - { es: "Nos pidió que fuéramos a comer a su casa todos los domingos, y su insistencia funcionó.", en: "She asked us to go and eat at her house every Sunday, and her insistence worked.", altEs: ["Nos pidió que fuésemos a comer a su casa todos los domingos, y su insistencia funcionó."], grammar: [g.reported-speech-subjunctive], vocab: [w.insistencia, w.pedir, w.domingo], note: "«Venid a comer» becomes que fuéramos when the speaker is no longer at her house." }
      - { es: "Mi hermano se quejaba de que nadie le hubiera preguntado la fecha de la boda.", en: "My brother complained that nobody had asked him about the date of the wedding.", altEs: ["Mi hermano se quejaba de que nadie le hubiese preguntado la fecha de la boda."], grammar: [g.reported-speech-subjunctive, g.subjunctive-pluperfect], vocab: [w.quejarse, w.fecha, w.preguntar] }
      - { es: "El ruego fue claro: que no llegáramos tarde y que no habláramos de política.", en: "The plea was clear: that we shouldn't arrive late and shouldn't talk about politics.", altEs: ["El ruego fue claro: que no llegásemos tarde y que no hablásemos de política."], grammar: [g.reported-speech-subjunctive], vocab: [w.ruego, w.tarde, w.politico] }
      - { es: "Me regaló un ejemplar de su libro favorito y me pidió que lo leyera con tranquilidad.", en: "She gave me a copy of her favourite book and asked me to read it calmly.", altEs: ["Me regaló un ejemplar de su libro favorito y me pidió que lo leyese con tranquilidad."], grammar: [g.reported-speech-subjunctive], vocab: [w.ejemplar, w.regalar, w.leer] }
      - { es: "Me dijo que tuviera paciencia.", en: "She told me to be patient.", altEs: ["Me dijo que tuviese paciencia."], grammar: [g.reported-speech-subjunctive], vocab: [w.ten-paciencia, w.decir], error: { wrong: "Me dijo que tenga paciencia.", explain: "After a past reporting verb (dijo), the present subjunctive shifts to the imperfect subjunctive: tuviera.", grammar: g.reported-speech-subjunctive } }
      - { es: "«Espero que hayáis comido», nos dijo la abuela.", en: "'I hope you have eaten,' Grandmother said to us.", grammar: [g.reported-speech-subjunctive, g.subjunctive-perfect], vocab: [w.comer, w.abuela], transform: { instruction: "Report it in the past (La abuela nos dijo que…)", answer: "La abuela nos dijo que esperaba que hubiéramos comido.", alt: ["La abuela nos dijo que esperaba que hubiésemos comido."] } }
    exchanges:
      - q: { es: "¿Qué te dijo tu abuela cuando le contaste lo de la boda?", en: "What did your grandmother say when you told her about the wedding?" }
        a: { es: "Que se alegraba mucho y que esperaba que fuéramos muy felices.", en: "That she was very happy and that she hoped we'd be very happy." }
        alt: ["Que esperaba que fuésemos muy felices.", "Que se alegraba mucho."]
        grammar: [g.reported-speech-subjunctive]
        vocab: [w.boda, w.alegrarse, w.feliz]
      - q: { es: "¿Qué te aconsejó tu padre sobre el trabajo?", en: "What did your father advise you about the job?" }
        a: { es: "Me aconsejó que no aceptara el primero que me ofrecieran.", en: "He advised me not to accept the first one they offered me." }
        alt: ["Que no aceptase el primero que me ofreciesen.", "Que lo pensara bien antes de decidir."]
        grammar: [g.reported-speech-subjunctive]
        vocab: [w.aconsejar, w.aceptar, w.ofrecer]
      - q: { es: "¿Y tu madre qué opinó del piso?", en: "And what did your mother think of the flat?" }
        a: { es: "Dudaba de que pudiéramos pagarlo, pero no dijo nada más.", en: "She doubted we could pay for it, but she didn't say anything else." }
        alt: ["Dudaba de que pudiésemos pagarlo.", "Le pareció caro, pero no dijo nada."]
        grammar: [g.reported-speech-subjunctive]
        vocab: [w.dudar, w.pagar, w.piso]
      - q: { es: "¿Qué os pidió el abuelo antes de morir?", en: "What did your grandfather ask of you before he died?" }
        a: { es: "Que no vendiéramos la casa del pueblo y que siguiéramos unidos.", en: "That we shouldn't sell the house in the village and that we should stay united." }
        alt: ["Que no vendiésemos la casa del pueblo.", "Nos pidió que siguiéramos unidos."]
        grammar: [g.reported-speech-subjunctive]
        vocab: [w.vender, w.unir, w.abuelo]
    texts:
      - title: "Mensaje de una madre"
        es: ["Tu abuela ha llamado.", "Dice que quiere que vayas a verla el domingo y que no le lleves nada.", "Yo le he dicho que te lo diría, pero tú sabes que algo le llevarás."]
        en: ["Your grandmother called.", "She says she wants you to go and see her on Sunday and not to bring her anything.", "I told her I'd tell you, but you know you'll take her something."]
        grammar: [g.reported-speech-subjunctive, g.reported-speech-present]
        vocab: [w.abuela, w.llevar]
      - title: "Recuerdo de infancia"
        es: ["Mi abuelo siempre me decía que no tuviera prisa por crecer.", "Yo le replicaba que quería ser mayor para mandar.", "Él se reía y me soltaba un dicho que entonces no entendía."]
        en: ["My grandfather always told me not to be in a hurry to grow up.", "I would retort that I wanted to be grown up so I could give orders.", "He would laugh and come out with a saying that I didn't understand back then."]
        grammar: [g.reported-speech-subjunctive, g.imperfect]
        vocab: [w.replicar, w.soltar, w.prisa]
    spicy:
      - { es: "Mi abuela me dijo que tuviera paciencia contigo; luego te vio bailar y me dijo que me diera prisa.", en: "My grandmother told me to be patient with you; then she saw you dance and told me to hurry up.", altEs: ["Mi abuela me dijo que tuviera paciencia contigo; después te vio bailar y me dijo que me diera prisa."], grammar: [g.reported-speech-subjunctive], vocab: [w.abuela, w.ten-paciencia, w.prisa] }
      - { es: "Me desaconsejaron que saliera con un músico; nadie me dijo que, además, cocinaría así.", en: "They advised me against going out with a musician; nobody told me he'd also cook like this.", altEs: ["Me desaconsejaron salir con un músico; nadie me dijo que, además, cocinaría así."], grammar: [g.reported-speech-subjunctive, g.reported-speech-present], vocab: [w.desaconsejar, w.decir] }
      - { es: "Mi primo me sugirió que llegara tarde a la cita para parecer interesante; llegué tarde y parecí lo que soy: impuntual.", en: "My cousin suggested I arrive late to the date to seem interesting; I arrived late and seemed what I am: unpunctual.", altEs: ["Mi primo me sugirió que llegara tarde a la cita para parecer interesante; llegué tarde y parecí lo que soy, impuntual."], grammar: [g.reported-speech-subjunctive], vocab: [w.primo, w.sugerir, w.llegar] }
      - { es: "Dudaba que hubieras leído mi mensaje; luego me alegré de que no lo hubieras leído, porque lo escribí a las tres de la mañana.", en: "I doubted you'd read my message; then I was glad you hadn't read it, because I wrote it at three in the morning.", altEs: ["Dudaba que hubieras leído mi mensaje; después me alegré de que no lo hubieras leído, porque lo escribí a las tres de la mañana."], grammar: [g.subjunctive-pluperfect], vocab: [w.dudar, w.leer, w.alegrarse] }
      - { es: "Mi madre me rogó que no vendiera el piso y mi novia me rogó que lo vendiera; yo le pedí al piso que opinara, y no dijo nada.", en: "My mother begged me not to sell the flat and my girlfriend begged me to sell it; I asked the flat for its opinion, and it said nothing.", altEs: ["Mi madre me rogó que no vendiera el piso y mi novio me rogó que lo vendiera; yo le pedí al piso que opinara, y no dijo nada."], grammar: [g.reported-speech-subjunctive], vocab: [w.madre, w.rogar, w.vender, w.piso, w.pedir] }
  - id: b2.u06.l2
    title: El médico me prohibió que fumara
    teach: [g.reported-commands]
    vocab: [w.entrenador, w.reposo, w.fisioterapeuta, w.lesion, w.lesionarse, w.nutricionista, w.musculo, w.tabaco, w.hidratarse, w.pediatra, w.dentista, w.operar, w.operacion, w.antibiotico, w.prevenir, w.prevencion, w.sedentario, w.estiramiento, w.vitamina]
    tip: "pedir, ordenar, rogar, prohibir, aconsejar, recomendar, mandar + que + subjunctive: El médico me prohibió que fumara. With a pronoun, the infinitive also works: Nos prohibieron fumar. mandar / hacer + infinitive: Nos hizo esperar."
    sentences:
      - { es: "El médico me prohibió que fumara y me mandó hacer ejercicio tres veces por semana.", en: "The doctor forbade me to smoke and ordered me to exercise three times a week.", altEs: ["El médico me prohibió fumar y me mandó hacer ejercicio tres veces por semana."], grammar: [g.reported-commands], vocab: [w.prohibir, w.fumar, w.ejercicio] }
      - { es: "La fisioterapeuta le pidió que guardara reposo hasta que el músculo se curara.", en: "The physiotherapist asked him to rest until the muscle healed.", altEs: ["La fisioterapeuta le pidió que guardase reposo hasta que el músculo se curase."], grammar: [g.reported-commands, g.hasta-que], vocab: [w.fisioterapeuta, w.reposo, w.musculo, w.curar] }
      - { es: "El entrenador nos ordenó que hiciéramos veinte minutos de estiramientos antes de correr.", en: "The coach ordered us to do twenty minutes of stretching before running.", altEs: ["El entrenador nos ordenó hacer veinte minutos de estiramientos antes de correr."], grammar: [g.reported-commands], vocab: [w.entrenador, w.ordenar, w.estiramiento] }
      - { es: "La nutricionista le aconsejó reducir el azúcar y beber más agua.", en: "The nutritionist advised her to cut down on sugar and drink more water.", altEs: ["La nutricionista le aconsejó que redujera el azúcar y bebiera más agua."], grammar: [g.reported-commands], vocab: [w.nutricionista, w.reducir, w.azucar], note: "With a pronoun (le), the infinitive is possible." }
      - { es: "El pediatra les recomendó que no le dieran antibióticos al niño sin receta.", en: "The paediatrician recommended that they not give the child antibiotics without a prescription.", altEs: ["El pediatra les recomendó que no le diesen antibióticos al niño sin receta."], grammar: [g.reported-commands], vocab: [w.pediatra, w.antibiotico, w.receta] }
      - { es: "Me rogó que me hidratara bien durante la maratón.", en: "He begged me to stay well hydrated during the marathon.", altEs: ["Me rogó que me hidratase bien durante la maratón."], grammar: [g.reported-commands], vocab: [w.rogar, w.hidratarse, w.maraton] }
      - { es: "El dentista me dijo que no comiera nada duro hasta el día siguiente.", en: "The dentist told me not to eat anything hard until the next day.", altEs: ["El dentista me dijo que no comiese nada duro hasta el día siguiente."], grammar: [g.reported-commands], vocab: [w.dentista, w.comer, w.duro] }
      - { es: "Después de la lesión, el fisioterapeuta nos hizo repetir los estiramientos cada mañana.", en: "After the injury, the physiotherapist made us repeat the stretches every morning.", grammar: [g.reported-commands], vocab: [w.lesion, w.repetir, w.estiramiento], note: "hacer + infinitive = to make someone do something." }
      - { es: "Le prohibieron que se operara hasta que le bajara la fiebre.", en: "They forbade him to have the operation until his fever went down.", altEs: ["Le prohibieron operarse hasta que le bajara la fiebre."], grammar: [g.reported-commands, g.hasta-que], vocab: [w.operar, w.fiebre, w.bajar] }
      - { es: "Que no te olvides de las vitaminas, dice la enfermera.", en: "Don't forget your vitamins, the nurse says.", grammar: [g.reported-commands, g.indirect-commands], vocab: [w.vitamina, w.olvidar, w.enfermero], note: "que + subjunctive alone transmits a command." }
      - { es: "El entrenador mandó callar y nos explicó cómo prevenir las lesiones de rodilla.", en: "The coach told us to be quiet and explained how to prevent knee injuries.", grammar: [g.reported-commands], vocab: [w.enviar.phr, w.callarse, w.prevenir, w.rodilla], note: "mandar + infinitive." }
      - { es: "Nos advirtieron de que una vida sedentaria aumentaba el riesgo de una operación de espalda.", en: "They warned us that a sedentary life increased the risk of back surgery.", grammar: [g.reported-commands, g.reported-speech-past], vocab: [w.advertir, w.sedentario, w.operacion, w.espalda] }
      - { es: "La prevención es sencilla: el médico me recomendó que me levantara de la silla cada hora.", en: "Prevention is simple: the doctor recommended that I get up from my chair every hour.", altEs: ["La prevención es sencilla: el médico me recomendó que me levantase de la silla cada hora."], grammar: [g.reported-commands], vocab: [w.prevencion, w.recomendar, w.levantarse] }
      - { es: "Se lesionó en el partido y le ordenaron que no entrenara en un mes.", en: "He got injured in the match and they ordered him not to train for a month.", altEs: ["Se lesionó en el partido y le ordenaron que no entrenase en un mes."], grammar: [g.reported-commands], vocab: [w.lesionarse, w.partido, w.entrenar] }
      - { es: "El médico le prohibió que bebiera alcohol.", en: "The doctor forbade him to drink alcohol.", altEs: ["El médico le prohibió beber alcohol.", "El médico le prohibió que bebiese alcohol."], grammar: [g.reported-commands], vocab: [w.prohibir, w.beber, w.alcohol], error: { wrong: "El médico le prohibió que beba alcohol.", explain: "The reporting verb is in the past (prohibió), so the command takes the imperfect subjunctive: bebiera.", grammar: g.reported-commands } }
      - { es: "«Estirad antes de entrenar», nos dijo el entrenador.", en: "'Stretch before training,' the coach told us.", grammar: [g.reported-commands, g.imperative-vosotros], vocab: [w.estirar, w.entrenar, w.entrenador], transform: { instruction: "Report the command in the past", answer: "El entrenador nos dijo que estiráramos antes de entrenar.", alt: ["El entrenador nos dijo que estirásemos antes de entrenar.", "El entrenador nos mandó estirar antes de entrenar."] } }
    exchanges:
      - q: { es: "¿Qué te ha dicho el médico?", en: "What did the doctor tell you?" }
        a: { es: "Que deje el tabaco y que camine una hora al día.", en: "To give up smoking and to walk an hour a day." }
        alt: ["Me ha dicho que deje el tabaco.", "Que camine más y que coma menos sal."]
        grammar: [g.reported-commands]
        vocab: [w.tabaco, w.caminar]
      - q: { es: "¿Por qué no entrenas hoy?", en: "Why aren't you training today?" }
        a: { es: "Porque el fisioterapeuta me prohibió que corriera hasta el lunes.", en: "Because the physiotherapist forbade me to run until Monday." }
        alt: ["Porque el fisioterapeuta me prohibió correr hasta el lunes.", "Me lesioné y me mandaron guardar reposo."]
        grammar: [g.reported-commands]
        vocab: [w.fisioterapeuta, w.correr, w.entrenar]
      - q: { es: "¿Te operaron al final?", en: "Did they operate on you in the end?" }
        a: { es: "No; la médica prefirió que esperara y que hiciera estiramientos.", en: "No; the doctor preferred that I wait and do stretching exercises." }
        alt: ["No; la médica prefirió que esperase.", "Sí, la operación fue el martes."]
        grammar: [g.reported-commands]
        vocab: [w.operar, w.estiramiento, w.preferir]
      - q: { es: "¿Qué os mandó el entrenador para el fin de semana?", en: "What did the coach tell you to do for the weekend?" }
        a: { es: "Que descansáramos y que nos hidratáramos bien.", en: "To rest and to stay well hydrated." }
        alt: ["Que descansásemos y nos hidratásemos bien.", "Nos mandó descansar."]
        grammar: [g.reported-commands]
        vocab: [w.entrenador, w.descansar, w.hidratarse]
    texts:
      - title: "Nota del pediatra"
        es: ["Dar el antibiótico cada ocho horas durante una semana.", "El médico recomienda que el niño no vaya al colegio hasta que no tenga fiebre.", "Volver a revisión el lunes."]
        en: ["Give the antibiotic every eight hours for a week.", "The doctor recommends that the child not go to school until he has no fever.", "Come back for a check-up on Monday."]
        grammar: [g.reported-commands, g.hasta-que]
        vocab: [w.antibiotico, w.pediatra, w.revision]
      - title: "Mensaje del entrenador al grupo"
        es: ["Mañana entrenamos a las siete.", "Os pido que lleguéis diez minutos antes para los estiramientos.", "Y que nadie venga sin haber desayunado."]
        en: ["Tomorrow we train at seven.", "I ask you to arrive ten minutes early for the stretches.", "And nobody is to come without having had breakfast."]
        grammar: [g.reported-commands]
        vocab: [w.entrenar, w.estiramiento, w.desayunar]
    spicy:
      - { es: "El médico me prohibió que corriera; no dijo nada de bailar contigo hasta las cuatro.", en: "The doctor forbade me to run; he said nothing about dancing with you until four.", altEs: ["El médico me prohibió correr; no dijo nada de bailar contigo hasta las cuatro."], grammar: [g.reported-commands], vocab: [w.prohibir, w.correr] }
      - { es: "La nutricionista me recomendó que redujera el azúcar, así que esta noche no habrá postre; tendrás que ser tú lo dulce de la cena.", en: "The nutritionist recommended I cut down on sugar, so tonight there'll be no dessert; you'll have to be the sweet part of the dinner.", altEs: ["La nutricionista me recomendó que redujera el azúcar, así que esta noche no hay postre; tendrás que ser tú lo dulce de la cena."], grammar: [g.reported-commands], vocab: [w.nutricionista, w.recomendar, w.reducir, w.azucar] }
      - { es: "El entrenador nos ordenó que hiciéramos estiramientos; yo aproveché para ponerme a tu lado.", en: "The coach ordered us to do stretches; I took the chance to get next to you.", altEs: ["El entrenador nos ordenó que hiciéramos estiramientos, y yo aproveché para ponerme a tu lado."], grammar: [g.reported-commands], vocab: [w.entrenador, w.ordenar, w.estiramiento] }
      - { es: "La fisioterapeuta le pidió que guardara reposo y él me pidió que lo cuidara; sospecho que la rodilla está bien.", en: "The physio asked him to rest and he asked me to look after him; I suspect the knee is fine.", altEs: ["La fisioterapeuta le pidió que guardara reposo y él me pidió que lo cuidara; sospecho que la rodilla está perfecta."], grammar: [g.reported-commands], vocab: [w.fisioterapeuta, w.reposo, w.rodilla] }
      - { es: "Me advirtió que no bebiera alcohol con la receta; no me advirtió de que tú estarías en la fiesta, que es peor.", en: "She warned me not to drink alcohol with the prescription; she didn't warn me you'd be at the party, which is worse.", altEs: ["Me advirtió de que no bebiera alcohol con la receta, pero no me advirtió de que tú estarías en la fiesta, que es peor."], grammar: [g.reported-commands, g.reported-speech-past], vocab: [w.advertir, w.beber, w.alcohol, w.receta] }
  - id: b2.u06.l3
    title: Lo que dijo el escritor
    teach: [g.reported-speech-subjunctive]
    vocab: [w.entrevistador, w.entrevistado, w.retirar, w.editor, w.exito-de-ventas, w.andarse-con-rodeos, w.irse-de-la-lengua, w.no-tener-ni-pies-ni-cabeza, w.poner-el-grito-en-el-cielo, w.echar-lena-al-fuego, w.no-dar-el-brazo-a-torcer, w.con-la-boca-pequena, w.firmar-ejemplares, w.autobiografia, w.gira, w.totalmente, w.video, w.directamente, w.grito]
    tip: "Full shifts when reporting: venir → ir, traer → llevar, aquí → allí, hoy → aquel día. And the subjunctive moves back a step: haya → hubiera."
    sentences:
      - { es: "La entrevistadora le pidió que no se anduviera con rodeos y que contestara con sinceridad.", en: "The interviewer asked him not to beat about the bush and to answer sincerely.", altEs: ["La entrevistadora le pidió que no se anduviese con rodeos y que contestase con sinceridad."], grammar: [g.reported-speech-subjunctive], vocab: [w.entrevistador, w.andarse-con-rodeos, w.sinceridad] }
      - { es: "El escritor declaró que no creía que su libro fuera un éxito de ventas por casualidad.", en: "The writer declared that he didn't think his book was a bestseller by chance.", altEs: ["El escritor declaró que no creía que su libro fuese un éxito de ventas por casualidad."], grammar: [g.reported-speech-subjunctive], vocab: [w.declarar, w.exito-de-ventas, w.por-casualidad] }
      - { es: "Dijo que esperaba que la versión inglesa hubiera respetado el humor del texto.", en: "He said he hoped the English version had respected the humour of the text.", altEs: ["Dijo que esperaba que la versión inglesa hubiese respetado el humor del texto."], grammar: [g.reported-speech-subjunctive, g.subjunctive-pluperfect], vocab: [w.version, w.respetar, w.humor] }
      - { es: "Su editor le había pedido que retirara un capítulo entero, y él no dio su brazo a torcer.", en: "His publisher had asked him to remove a whole chapter, and he refused to give in.", altEs: ["Su editor le había pedido que retirase un capítulo entero, y él no dio su brazo a torcer."], grammar: [g.reported-speech-subjunctive, g.pluperfect], vocab: [w.editor, w.retirar, w.no-dar-el-brazo-a-torcer, w.capitulo] }
      - { es: "Afirmó que ojalá los periodistas leyeran los libros antes de opinar.", en: "He stated that he wished journalists would read the books before giving their opinion.", altEs: ["Afirmó que ojalá los periodistas leyesen los libros antes de opinar."], grammar: [g.reported-speech-subjunctive], vocab: [w.afirmar, w.periodista, w.opinar] }
      - { es: "Cuando el entrevistador sugirió que la historia no tenía ni pies ni cabeza, el autor puso el grito en el cielo.", en: "When the interviewer suggested that the story made no sense at all, the author hit the roof.", grammar: [g.reported-speech-subjunctive, g.reported-speech-past], vocab: [w.no-tener-ni-pies-ni-cabeza, w.poner-el-grito-en-el-cielo, w.sugerir, w.autor] }
      - { es: "Reconoció que se había ido de la lengua al contar el final en la radio.", en: "He admitted that he had let the ending slip when he told it on the radio.", grammar: [g.reported-speech-subjunctive, g.pluperfect], vocab: [w.reconocer, w.irse-de-la-lengua, w.radio] }
      - { es: "Negó que el tribunal del premio le hubiera dado el premio por amistad.", en: "He denied that the prize panel had given him the award out of friendship.", altEs: ["Negó que el tribunal del premio le hubiese dado el premio por amistad."], grammar: [g.reported-speech-subjunctive, g.subjunctive-pluperfect], vocab: [w.negar, w.tribunal, w.premio, w.amistad] }
      - { es: "Pidió que le llevaran un ejemplar firmado a su madre, que vive en Cádiz.", en: "He asked them to take a signed copy to his mother, who lives in Cádiz.", altEs: ["Pidió que le llevasen un ejemplar firmado a su madre, que vive en Cádiz."], grammar: [g.reported-speech-subjunctive], vocab: [w.ejemplar, w.llevar, w.firmar], note: "Direct «traedle un ejemplar» → reported que le llevaran: traer becomes llevar." }
      - { es: "La editora comentó que dudaba de que el título se entendiera en otros países.", en: "The publisher commented that she doubted the title would be understood in other countries.", altEs: ["La editora comentó que dudaba de que el título se entendiese en otros países."], grammar: [g.reported-speech-subjunctive, g.se-passive], vocab: [w.editor, w.titulo, w.entender] }
      - { es: "Dijo que no quería echar más leña al fuego, pero que la crítica de aquel periódico no le había gustado.", en: "He said he didn't want to add fuel to the fire, but that the review in that newspaper hadn't pleased him.", grammar: [g.reported-speech-subjunctive, g.reported-speech-past], vocab: [w.echar-lena-al-fuego, w.critica, w.periodico] }
      - { es: "Nos contó que su editora le echó la bronca cuando llegó tres meses tarde con el texto de la autobiografía.", en: "He told us that his publisher gave him a telling-off when he turned up three months late with the text of his autobiography.", grammar: [g.reported-speech-subjunctive, g.reported-speech-past], vocab: [w.echar-la-bronca, w.autobiografia, w.editor] }
      - { es: "Dijo que, en cuanto terminara la gira, volvería a escribir.", en: "He said that, as soon as the tour ended, he would go back to writing.", altEs: ["Dijo que, en cuanto terminase la gira, volvería a escribir."], grammar: [g.reported-speech-subjunctive, g.temporal-clauses-advanced], vocab: [w.gira, w.terminar, w.escribir], note: "«En cuanto termine la gira, volveré» → en cuanto terminara, volvería." }
      - { es: "Anunció una firma de libros y pidió que los lectores llevaran sus ejemplares viejos.", en: "He announced a book signing and asked readers to bring their old copies.", altEs: ["Anunció una firma de libros y pidió que los lectores llevasen sus ejemplares viejos."], grammar: [g.reported-speech-subjunctive], vocab: [w.firmar-ejemplares, w.anunciar, w.lector] }
      - { es: "Dijo que esperaba que hubiéramos leído el libro.", en: "He said he hoped we had read the book.", altEs: ["Dijo que esperaba que hubiésemos leído el libro."], grammar: [g.reported-speech-subjunctive], vocab: [w.esperar, w.leer], error: { wrong: "Dijo que esperaba que hayamos leído el libro.", explain: "With a past reporting verb, the perfect subjunctive shifts to the pluperfect subjunctive: hubiéramos leído.", grammar: g.reported-speech-subjunctive } }
      - { es: "«Ven a la presentación y trae a tus amigos», me dijo el autor.", en: "'Come to the launch and bring your friends,' the author told me.", grammar: [g.reported-speech-subjunctive, g.imperative-tu], vocab: [w.presentacion, w.traer, w.autor], transform: { instruction: "Report it in the past, changing the point of view (venir → ir, traer → llevar)", answer: "El autor me dijo que fuera a la presentación y que llevara a mis amigos.", alt: ["El autor me dijo que fuese a la presentación y que llevase a mis amigos."] } }
    exchanges:
      - q: { es: "¿Qué dijo el escritor sobre el premio?", en: "What did the writer say about the prize?" }
        a: { es: "Que no creía que se lo hubieran dado por casualidad.", en: "That he didn't think they had given it to him by chance." }
        alt: ["Que no creía que se lo hubiesen dado por casualidad.", "Que se lo merecía, con la boca pequeña."]
        grammar: [g.reported-speech-subjunctive]
        vocab: [w.premio, w.creer]
      - q: { es: "¿Le molestó la pregunta sobre su primera novela?", en: "Did the question about his first novel bother him?" }
        a: { es: "Un poco; pidió que no se anduvieran con rodeos y la admitió con la boca pequeña.", en: "A little; he asked them not to beat about the bush and admitted it half-heartedly." }
        alt: ["Un poco, pero lo admitió con la boca pequeña.", "Sí; puso el grito en el cielo."]
        grammar: [g.reported-speech-subjunctive]
        vocab: [w.andarse-con-rodeos, w.con-la-boca-pequena, w.molestar]
      - q: { es: "¿Qué hizo cuando el entrevistador dijo que el libro no tenía ni pies ni cabeza?", en: "What did he do when the interviewer said the book made no sense at all?" }
        a: { es: "Puso el grito en el cielo y después pidió perdón.", en: "He hit the roof and then apologised." }
        alt: ["Puso el grito en el cielo.", "Se rio y dijo que no quería echar leña al fuego."]
        grammar: [g.reported-speech-subjunctive]
        vocab: [w.poner-el-grito-en-el-cielo, w.no-tener-ni-pies-ni-cabeza, w.pedir-perdon]
      - q: { es: "¿Qué le pidió la editora?", en: "What did the publisher ask him for?" }
        a: { es: "Que retirara el último capítulo, pero él no dio su brazo a torcer.", en: "To remove the last chapter, but he refused to give in." }
        alt: ["Que retirase el último capítulo.", "Que entregara el texto a tiempo, para variar."]
        grammar: [g.reported-speech-subjunctive]
        vocab: [w.editor, w.retirar, w.no-dar-el-brazo-a-torcer]
    texts:
      - title: "Resumen de la entrevista"
        es: ["El autor negó que su éxito de ventas fuera cosa de la publicidad.", "Reconoció que se había ido de la lengua con el final.", "Y pidió que los periodistas leyeran los libros antes de opinar."]
        en: ["The author denied that his bestseller was a matter of advertising.", "He admitted that he had let the ending slip.", "And he asked journalists to read the books before giving their opinion."]
        grammar: [g.reported-speech-subjunctive]
        vocab: [w.exito-de-ventas, w.irse-de-la-lengua, w.publicidad]
      - title: "Comentario de un lector en la web"
        es: ["Lo vi en la radio y me pareció un creído.", "Dijo que esperaba que su libro hubiera cambiado la forma de leer en España.", "Con la boca pequeña, eso sí."]
        en: ["I saw him on the radio and he seemed full of himself.", "He said he hoped his book had changed the way people read in Spain.", "Half-heartedly, mind you."]
        grammar: [g.reported-speech-subjunctive, g.subjunctive-pluperfect]
        vocab: [w.creido, w.con-la-boca-pequena, w.leer]
    spicy:
      - { es: "Le pedí que no se anduviera con rodeos y que me dijera si le gustaba; se fue de la lengua y me dijo que desde el primer día.", en: "I asked him not to beat about the bush and tell me whether he liked me; he let it slip and said since day one.", altEs: ["Le pedí que no se anduviera con rodeos y que me dijera si le gustaba; se fue de la lengua y confesó que desde el primer día."], grammar: [g.reported-speech-subjunctive], vocab: [w.andarse-con-rodeos, w.irse-de-la-lengua] }
      - { es: "El autor declaró que no creía que su novela hablara de su vida; su ex, en la presentación, puso el grito en el cielo.", en: "The author declared he didn't think his novel was about his life; his ex, at the launch, hit the roof.", altEs: ["El autor declaró que no creía que su novela hablara de su vida; su ex puso el grito en el cielo en la presentación."], grammar: [g.reported-speech-subjunctive, g.reported-speech-past], vocab: [w.autor, w.declarar, w.creer, w.presentacion, w.poner-el-grito-en-el-cielo] }
      - { es: "Dijo que esperaba que yo hubiera leído el capítulo siete antes de la cita; lo había leído: ahí es donde besa a la editora.", en: "He said he hoped I'd read chapter seven before the date; I had: that's where he kisses the editor.", altEs: ["Dijo que esperaba que hubiera leído el capítulo siete antes de la cita; lo había leído: ahí es donde besa a la editora."], grammar: [g.reported-speech-subjunctive, g.subjunctive-pluperfect], vocab: [w.esperar, w.leer, w.capitulo, w.editor] }
      - { es: "Me pidió perdón con la boca pequeña y me sugirió que no echara más leña al fuego; le sugerí que trajera flores la próxima vez.", en: "He apologised half-heartedly and suggested I not add fuel to the fire; I suggested he bring flowers next time.", altEs: ["Me pidió perdón con la boca pequeña y me sugirió que no echara más leña al fuego; yo le sugerí que la próxima vez trajera flores."], grammar: [g.reported-speech-subjunctive], vocab: [w.pedir-perdon, w.con-la-boca-pequena, w.sugerir, w.echar-lena-al-fuego, w.traer] }
      - { es: "Afirmó que nuestra historia no tenía ni pies ni cabeza y que no daría su brazo a torcer; aquella misma noche hicimos las paces con un beso.", en: "She claimed our story made no sense and that she wouldn't give in; that same night we made up with a kiss.", altEs: ["Afirmó que nuestra historia no tenía ni pies ni cabeza y que no iba a dar su brazo a torcer; aquella misma noche hicimos las paces con un beso."], grammar: [g.reported-speech-subjunctive, g.reported-speech-past], vocab: [w.afirmar, w.no-tener-ni-pies-ni-cabeza, w.no-dar-el-brazo-a-torcer] }
  - id: b2.u06.l4
    title: Dice mamá que recojas
    teach: [g.reported-commands]
    vocab: [w.tender-la-ropa, w.aspiradora, w.secadora, w.plancha, w.encargo, w.fontanero, w.electricista, w.guarderia, w.canguro, w.ninera, w.persiana, w.enchufar, w.fregona, w.cubo, w.detergente, w.colada, w.gotera, w.gotear, w.caldera, w.estanteria, w.martillo, w.tornillo, w.casero.n, w.mama, w.papa.dad, w.portal, w.sala]
    tip: "Relaying orders: Dice mamá que recojas (present → present subjunctive); Me dijo que recogiera (past → imperfect subjunctive); Que no se te olvide (que + subjunctive alone)."
    sentences:
      - { es: "Dice mamá que recojas tu habitación antes de salir.", en: "Mum says you're to tidy your room before going out.", altEs: ["Mamá dice que recojas tu habitación antes de salir."], grammar: [g.reported-commands, g.indirect-commands], vocab: [w.mama, w.recoger, w.habitacion] }
      - { es: "Mi padre me ha dicho que tienda la ropa y que no la meta en la secadora.", en: "My father has told me to hang out the washing and not to put it in the dryer.", grammar: [g.reported-commands], vocab: [w.tender-la-ropa, w.secadora, w.meterse] }
      - { es: "La canguro nos pidió que le dejáramos el número de la pediatra.", en: "The babysitter asked us to leave her the paediatrician's number.", altEs: ["La canguro nos pidió que le dejásemos el número de la pediatra."], grammar: [g.reported-commands], vocab: [w.canguro, w.pediatra, w.numero] }
      - { es: "El fontanero mandó apagar la caldera hasta que arreglara la gotera.", en: "The plumber ordered the boiler to be switched off until he fixed the leak.", altEs: ["El fontanero mandó apagar la caldera hasta que arreglase la gotera."], grammar: [g.reported-commands, g.hasta-que], vocab: [w.fontanero, w.caldera, w.gotera, w.apagar] }
      - { es: "Que no se te olvide pasar la aspiradora, me ha dicho tu hermana.", en: "Don't forget to vacuum, your sister told me to tell you.", grammar: [g.reported-commands, g.indirect-commands], vocab: [w.aspiradora, w.olvidar, w.hermana] }
      - { es: "La vecina nos rogó que no enchufáramos la plancha y la lavadora a la vez: salta la luz.", en: "The neighbour begged us not to plug in the iron and the washing machine at the same time: the power trips.", altEs: ["La vecina nos rogó que no enchufásemos la plancha y la lavadora a la vez: salta la luz."], grammar: [g.reported-commands], vocab: [w.enchufar, w.plancha, w.lavadora, w.a-la-vez] }
      - { es: "Le pedí al electricista que cambiara la bombilla del pasillo y que revisara la luz de la cocina.", en: "I asked the electrician to change the hall light bulb and to check the kitchen light.", altEs: ["Le pedí al electricista que cambiase la bombilla del pasillo y que revisase la luz de la cocina."], grammar: [g.reported-commands], vocab: [w.electricista, w.bombilla, w.pasillo, w.revisar] }
      - { es: "Nos prohibieron que dejáramos el cubo y la fregona en la escalera.", en: "They forbade us to leave the bucket and the mop on the stairs.", altEs: ["Nos prohibieron dejar el cubo y la fregona en la escalera."], grammar: [g.reported-commands], vocab: [w.cubo, w.fregona, w.escalera] }
      - { es: "Mi madre me hizo repetir la colada porque había puesto demasiado detergente.", en: "My mother made me redo the washing because I had put in too much detergent.", grammar: [g.reported-commands, g.pluperfect], vocab: [w.colada, w.detergente, w.repetir] }
      - { es: "Dile a tu hermano que baje las persianas y que no toque el martillo.", en: "Tell your brother to lower the blinds and not to touch the hammer.", grammar: [g.reported-commands, g.imperative-pronouns], vocab: [w.persiana, w.martillo, w.bajar] }
      - { es: "Me encargaron que recogiera a los niños de la guardería a las cinco.", en: "They gave me the job of picking up the children from nursery at five.", altEs: ["Me encargaron que recogiese a los niños de la guardería a las cinco."], grammar: [g.reported-commands], vocab: [w.encargar, w.guarderia, w.recoger] }
      - { es: "La niñera les dijo a los niños que se lavaran los dientes y que se acostaran.", en: "The nanny told the children to brush their teeth and go to bed.", altEs: ["La niñera les dijo a los niños que se lavasen los dientes y que se acostasen."], grammar: [g.reported-commands], vocab: [w.ninera, w.lavarse, w.acostarse, w.dientes] }
      - { es: "Dice el casero que no colguemos cuadros con tornillos en la pared nueva.", en: "The landlord says we're not to hang pictures with screws on the new wall.", grammar: [g.reported-commands, g.indirect-commands], vocab: [w.casero.n, w.tornillo, w.colgar, w.pared] }
      - { es: "El fontanero nos aconsejó que cambiáramos el grifo porque goteaba.", en: "The plumber advised us to change the tap because it was dripping.", altEs: ["El fontanero nos aconsejó cambiar el grifo porque goteaba."], grammar: [g.reported-commands], vocab: [w.fontanero, w.gotear, w.grifo] }
      - { es: "Dice mamá que recojas la cocina.", en: "Mum says you're to tidy the kitchen.", grammar: [g.reported-commands, g.indirect-commands], vocab: [w.recoger, w.cocina], error: { wrong: "Dice mamá que recoges la cocina.", explain: "A relayed command uses que + subjunctive: recojas. Recoges would report a fact, not an order.", grammar: g.reported-commands } }
      - { es: "«Baja la basura y riega las plantas», me dijo mi madre.", en: "'Take the rubbish down and water the plants,' my mother told me.", grammar: [g.reported-commands, g.imperative-tu], vocab: [w.basura, w.regar, w.planta], transform: { instruction: "Report the commands in the past", answer: "Mi madre me dijo que bajara la basura y que regara las plantas.", alt: ["Mi madre me dijo que bajase la basura y que regase las plantas.", "Mi madre me mandó bajar la basura y regar las plantas."] } }
    exchanges:
      - q: { es: "¿Qué te ha dicho el casero?", en: "What did the landlord tell you?" }
        a: { es: "Que no pongamos la estantería en esa pared y que avisemos si hay goteras.", en: "Not to put the shelves on that wall and to let him know if there are leaks." }
        alt: ["Que no pongamos la estantería en esa pared.", "Que avisemos si vemos alguna gotera."]
        grammar: [g.reported-commands]
        vocab: [w.casero.n, w.estanteria, w.gotera]
      - q: { es: "¿Qué encargo te dio tu madre?", en: "What errand did your mother give you?" }
        a: { es: "Que recogiera la plancha arreglada y que comprara detergente.", en: "To pick up the repaired iron and buy detergent." }
        alt: ["Que recogiese la plancha y comprase detergente.", "Recoger la plancha y comprar detergente."]
        grammar: [g.reported-commands]
        vocab: [w.encargo, w.plancha, w.detergente]
      - q: { es: "¿Qué os mandó hacer el fontanero?", en: "What did the plumber tell you to do?" }
        a: { es: "Nos mandó cerrar el agua y no usar la caldera hasta hoy.", en: "He told us to turn off the water and not use the boiler until today." }
        alt: ["Que cerráramos el agua y no usáramos la caldera.", "Nos mandó no usar la caldera."]
        grammar: [g.reported-commands]
        vocab: [w.fontanero, w.caldera, w.agua]
      - q: { es: "¿Por qué está enfadada la canguro?", en: "Why is the babysitter angry?" }
        a: { es: "Porque les pidió a los niños que se acostaran a las nueve y no le hicieron caso.", en: "Because she asked the children to go to bed at nine and they didn't listen to her." }
        alt: ["Porque los niños no le hicieron caso.", "Porque les dijo que se acostasen y siguieron jugando."]
        grammar: [g.reported-commands]
        vocab: [w.canguro, w.acostarse, w.hacer-caso]
    texts:
      - title: "Nota en la puerta de la nevera"
        es: ["Dice papá que no uses la secadora: está averiada.", "Tiende la ropa en la terraza.", "Y que no se te olvide sacar la basura."]
        en: ["Dad says not to use the dryer: it's broken.", "Hang the washing out on the terrace.", "And don't forget to take out the rubbish."]
        grammar: [g.reported-commands, g.indirect-commands]
        vocab: [w.papa.dad, w.secadora, w.tender-la-ropa, w.sacar-la-basura]
      - title: "Mensaje de la comunidad de vecinos"
        es: ["El electricista pide que nadie toque las luces del portal hasta mañana.", "El portero nos ha dicho que avisemos si vemos alguna gotera.", "Gracias por vuestra paciencia."]
        en: ["The electrician asks that nobody touch the lights in the entrance hall until tomorrow.", "The caretaker has told us to let him know if we see any leaks.", "Thank you for your patience."]
        grammar: [g.reported-commands]
        vocab: [w.electricista, w.portal, w.portero, w.gotera]
    spicy:
      - { es: "Dice mi compañera de piso que recojas tus cosas del salón; digo yo que te quedes a cenar.", en: "My flatmate says pick your things up from the living room; I say stay for dinner.", altEs: ["Dice mi compañera de piso que recojas tus cosas del salón, y digo yo que te quedes a cenar."], grammar: [g.reported-commands, g.indirect-commands], vocab: [w.recoger] }
      - { es: "El casero me dijo que no colgara nada en la pared; no dijo nada de colgar tu chaqueta en mi armario para siempre.", en: "The landlord told me not to hang anything on the wall; he said nothing about hanging your jacket in my wardrobe for ever.", altEs: ["El casero me dijo que no colgara nada en la pared, pero no dijo nada de colgar tu chaqueta en mi armario para siempre."], grammar: [g.reported-commands], vocab: [w.casero.n, w.colgar, w.pared] }
      - { es: "Que no se te olvide sacar la basura, regar las plantas y, sobre todo, volver.", en: "Don't forget to take out the rubbish, water the plants and, above all, come back.", altEs: ["Que no se te olvide sacar la basura, regar las plantas y, sobre todo, volver a casa."], grammar: [g.reported-commands, g.indirect-commands], vocab: [w.olvidar, w.sacar-la-basura, w.regar, w.planta] }
      - { es: "Mi hermana me pidió que llamara al fontanero por la gotera; llamé, y ahora el fontanero y yo tenemos una cita el viernes.", en: "My sister asked me to call the plumber about the leak; I called, and now the plumber and I have a date on Friday.", altEs: ["Mi hermana me pidió que llamara al fontanero por la gotera; llamé y ahora el fontanero y yo tenemos una cita el viernes."], grammar: [g.reported-commands], vocab: [w.hermana, w.fontanero, w.gotera] }
      - { es: "El portero dice que no te metas en el ascensor con la bici, y yo digo que te metas en mi vida con todo lo que traigas.", en: "The doorman says don't get in the lift with your bike, and I say get into my life with whatever you bring.", altEs: ["El portero dice que no te metas en el ascensor con la bici; yo digo que te metas en mi vida con todo lo que traigas."], grammar: [g.reported-commands, g.indirect-commands], vocab: [w.portero, w.meterse] }
dialogues:
  - id: b2.u06.d1
    title: Recados de familia
    context: Dani is on the phone with his mother, passing on messages from his grandmother, the babysitter and others.
    lines:
      - { speaker: Madre, es: "Dani, ¿has hablado con tu abuela?", en: "Dani, have you spoken to your grandmother?" }
      - { speaker: Dani, es: "Sí. Me ha dicho que vayamos a comer el domingo y que no llevemos nada.", en: "Yes. She told me we should go for lunch on Sunday and not bring anything." }
      - { speaker: Madre, es: "Eso dice siempre. ¿Y qué más?", en: "She always says that. And what else?" }
      - { speaker: Dani, es: "Que le pidas al fontanero que pase por su casa; tiene una gotera en la cocina.", en: "That you should ask the plumber to drop by her house; she has a leak in the kitchen." }
      - { speaker: Madre, es: "Vale. ¿Le dijiste que el médico le había prohibido que subiera escaleras?", en: "OK. Did you tell her the doctor had forbidden her to climb stairs?" }
      - { speaker: Dani, es: "Se lo dije, y ella me replicó que el médico no sabía nada y que no me metiera en sus cosas.", en: "I told her, and she retorted that the doctor knew nothing and that I shouldn't meddle in her affairs." }
      - { speaker: Madre, es: "¡Qué cabezota! Pues dile que la nutricionista también le pidió que caminara, no que subiera escaleras.", en: "How stubborn! Well, tell her the nutritionist also asked her to walk, not to climb stairs." }
      - { speaker: Dani, es: "Ya se lo diré. Ah, y la canguro ha llamado: pregunta si puede venir a las seis en vez de a las cinco.", en: "I'll tell her. Oh, and the babysitter called: she's asking whether she can come at six instead of five." }
      - { speaker: Madre, es: "Dile que sí, pero que traiga la llave que se llevó ayer.", en: "Tell her yes, but that she should bring the key she took yesterday." }
      - { speaker: Dani, es: "Mamá, ¿y a mí nadie me pide nada?", en: "Mum, doesn't anyone ask anything of me?" }
      - { speaker: Madre, es: "Sí: tu padre dice que recojas tu habitación antes de que llegue la canguro.", en: "Yes: your father says you're to tidy your room before the babysitter arrives." }
    questions:
      - { q: "What does the grandmother want the family to do on Sunday?", options: ["Visit the plumber", "Come for lunch without bringing anything", "Take her to the doctor"], answer: 1 }
      - { q: "How did the grandmother react when told about the doctor's orders?", options: ["She agreed to rest", "She said the doctor knew nothing", "She asked for a second opinion"], answer: 1 }
      - { q: "What does Dani's father want him to do?", options: ["Call the babysitter", "Fix the leak", "Tidy his room"], answer: 2 }
writing:
  - task: "Write about the advice your parents or grandparents gave you when you were young (Me dijo que tuviera paciencia, Me pidió que …)."
    min: 80
    max: 150
    use: [w.crianza, w.insistencia, w.desaconsejar, w.educar, w.ejemplar]
    useAtLeast: 3
    grammar: [g.reported-speech-subjunctive]
    expect:
      - { pattern: "\\b(me|nos|le|les) (dec[ií]a|dijo|dijeron|ped[ií]a|pidi[oó]|pidieron|aconsej[oó]|aconsejaron|recomend[oó]|desaconsej[oó]|prohibi[oó]|rog[oó])( en)? que\\b|\\binsist[ií]a en que\\b", hint: "Report advice: me decía que …, me pidió que …, insistía en que …" }
      - { pattern: "\\bque (no )?(me |te |se |le |lo |la )?[a-záéíóúñ]+(ara|aras|aran|iera|ieras|ieran|yera|yeras|yeran)\\b", hint: "Use the imperfect subjunctive in the reported request: que tuviera, que leyera …" }
    model: { es: "Mis abuelos tuvieron un papel muy importante en mi crianza. Mi abuela siempre me decía que tuviera paciencia y que no me enfadara por tonterías. Mi abuelo, que era un maestro ejemplar, insistía en que leyera todos los días y me pedía que le contara lo que había aprendido en el colegio. Cuando quise dejar los estudios a los dieciséis años, mis padres me lo desaconsejaron con mucha insistencia: me dijeron que lo pensara bien y que no tomara decisiones precipitadas. Hoy les agradezco que me educaran así.", en: "My grandparents played a very important role in my upbringing. My grandmother always told me to be patient and not to get angry about silly things. My grandfather, who was an exemplary teacher, insisted that I read every day and asked me to tell him what I had learned at school. When I wanted to leave school at sixteen, my parents strongly advised me against it: they told me to think it over and not to make hasty decisions. Today I'm grateful that they brought me up that way." }
  - task: "You hurt your knee near Puente del Inca. Tell a friend what the doctor and the physiotherapist told you to do and not to do."
    min: 80
    max: 150
    use: [w.reposo, w.lesionarse, w.fisioterapeuta, w.estiramiento, w.hidratarse]
    useAtLeast: 3
    grammar: [g.reported-commands]
    expect:
      - { pattern: "\\b(me|nos|le) (dijo|pidi[oó]|recomend[oó]|aconsej[oó]|prohibi[oó]|orden[oó]|mand[oó]) que\\b", hint: "Report the orders: el médico me dijo que …, me prohibió que …" }
      - { pattern: "\\bque (no )?(me |se |le )?[a-záéíóúñ]+(ara|aras|aran|iera|ieras|ieran|yera|yeras|yeran)\\b", hint: "Use the imperfect subjunctive: que guardara reposo, que no subiera …" }
    model: { es: "Ayer me lesioné la rodilla bajando hacia el Puente del Inca y tuve que ir a urgencias. El médico me dijo que guardara reposo durante una semana y me prohibió que hiciera deporte hasta nuevo aviso. También me recomendó que tomara las pastillas después de comer. Luego fui a una fisioterapeuta muy simpática, que me pidió que hiciera unos estiramientos sencillos cada mañana y que me hidratara bien. Me aconsejó que no subiera escaleras y que caminara con cuidado. ¡Así que adiós a la excursión al Aconcagua!", en: "Yesterday I hurt my knee going down towards Puente del Inca and had to go to A&E. The doctor told me to rest for a week and banned me from doing sport until further notice. He also recommended that I take the pills after eating. Then I went to a very nice physiotherapist, who asked me to do some simple stretches every morning and to drink plenty of water. She advised me not to climb stairs and to walk carefully. So goodbye to the trip to Aconcagua!" }
  - task: "Report a TV interview with a famous writer: what she said, what she asked her readers to do, and use one or two idioms (no se anduvo con rodeos, se fue de la lengua …)."
    min: 80
    max: 150
    use: [w.entrevistador, w.autobiografia, w.andarse-con-rodeos, w.irse-de-la-lengua, w.exito-de-ventas]
    useAtLeast: 3
    grammar: [g.reported-speech-subjunctive]
    expect:
      - { pattern: "\\b(dijo|explic[oó]|confes[oó]|reconoci[oó]|asegur[oó]|coment[oó]|afirm[oó]) que\\b", hint: "Report what she said: dijo que …, reconoció que …" }
      - { pattern: "\\b(pidi[oó]|recomend[oó]|aconsej[oó]|rog[oó])( a [a-záéíóúñ ]+)? que (no )?[a-záéíóúñ]+(ara|aran|iera|ieran|yera|yeran)\\b", hint: "Report her request with the imperfect subjunctive: pidió a los lectores que leyeran …" }
    model: { es: "Ayer vi en la televisión una entrevista con la escritora Clara Paz, cuya autobiografía es un éxito de ventas. Desde el principio, no se anduvo con rodeos: dijo que había escrito el libro para contar la verdad sobre su familia. Cuando el entrevistador le preguntó por su antiguo marido, se fue un poco de la lengua y reconoció que todavía no lo había perdonado. Al final, pidió a los lectores que no creyeran todo lo que publicaban las revistas y que leyeran más poesía. Aseguró que su próximo libro sería una novela.", en: "Yesterday I saw a TV interview with the writer Clara Paz, whose autobiography is a bestseller. From the start, she didn't beat about the bush: she said she had written the book to tell the truth about her family. When the interviewer asked her about her ex-husband, she let slip a bit too much and admitted she still hadn't forgiven him. At the end, she asked readers not to believe everything the magazines published and to read more poetry. She said her next book would be a novel." }
  - task: "Your mum left a note for you and your brother. Text your brother passing on her orders (Dice mamá que …), and what she asked you to do yesterday (Ayer me pidió que …)."
    es: "Nota de mamá: Recoged vuestras habitaciones, tended la ropa, llamad al fontanero por la gotera y no dejéis la persiana abierta."
    min: 80
    max: 150
    use: [w.tender-la-ropa, w.fontanero, w.gotera, w.persiana, w.aspiradora]
    useAtLeast: 3
    grammar: [g.reported-commands]
    expect:
      - { pattern: "dice (mam[aá] )?que|ha dicho que|quiere que", hint: "Pass on present orders: dice mamá que recojas …" }
      - { pattern: "\\bque (no )?(recojas|tiendas|llames|dejes|pases|pongas|hagas|bajes|subas|saques|limpies|friegues)\\b", hint: "Use the present subjunctive for current orders: que recojas, que llames …" }
      - { pattern: "\\b(me|te|nos) (pidi[oó]|dijo|mand[oó])( a m[ií])? que\\b", hint: "Report yesterday's request: ayer me pidió que pasara …" }
    model: { es: "Oye, Pablo, dice mamá que recojas tu habitación antes de las seis y que tiendas la ropa de la lavadora. También quiere que llames al fontanero, porque la gotera del baño está peor. Además, dice que no dejes la persiana abierta cuando salgas. Ayer ya me pidió a mí que pasara la aspiradora y que pusiera la secadora, así que hoy es tu turno. Si no lo haces, se va a enfadar muchísimo. ¡Luego no digas que no te avisé!", en: "Hey, Pablo, Mum says you should tidy your room before six and hang out the washing from the machine. She also wants you to call the plumber, because the leak in the bathroom is worse. And she says not to leave the blind up when you go out. Yesterday she already asked me to vacuum and put the dryer on, so today it's your turn. If you don't do it, she's going to be really angry. Don't say I didn't warn you!" }
