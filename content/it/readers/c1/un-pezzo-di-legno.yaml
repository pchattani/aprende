id: r.c1.un-pezzo-di-legno
level: c1
title: Un pezzo di legno che piangeva e rideva
kind: literature
author: Carlo Collodi (1826–1890)
source: "Le avventure di Pinocchio. Storia di un burattino, capitolo I (1883). Dominio pubblico. Testo integrale del capitolo; solo gli accenti sono normalizzati all'uso moderno."
intro: "The first chapter of Pinocchio, complete. Collodi writes in the Tuscan of the 1880s (si messe for si mise, gli è che, colla, cogli) and talks straight to his young readers. Watch how the narrator plays with the fairy-tale opening and how the passato remoto drives the action while the imperfetto paints the scene."
allow: [collodi, pinocchio, ciliegia, antonio, mastr, ohi, gli]
paragraphs:
  - { es: "C'era una volta... — Un re! — diranno subito i miei piccoli lettori. No, ragazzi, avete sbagliato. C'era una volta un pezzo di legno.", en: "Once upon a time there was... 'A king!' my little readers will say at once. No, children, you are wrong. Once upon a time there was a piece of wood." }
  - { es: "Non era un legno di lusso, ma un semplice pezzo da catasta, di quelli che d'inverno si mettono nelle stufe e nei caminetti per accendere il fuoco e per riscaldare le stanze.", en: "It was not an expensive piece of wood, just an ordinary log from the woodpile, the kind that in winter you put in stoves and fireplaces to light the fire and warm the rooms." }
  - { es: "Non so come andasse, ma il fatto gli è che un bel giorno questo pezzo di legno capitò nella bottega di un vecchio falegname, il quale aveva nome mastr'Antonio, se non che tutti lo chiamavano maestro Ciliegia, per via della punta del suo naso, che era sempre lustra e paonazza, come una ciliegia matura.", en: "I don't know how it happened, but the fact is that one fine day this piece of wood turned up in the workshop of an old carpenter whose name was Master Antonio, except that everybody called him Master Cherry, because of the tip of his nose, which was always shiny and purple, like a ripe cherry." }
  - { es: "Appena maestro Ciliegia ebbe visto quel pezzo di legno, si rallegrò tutto e dandosi una fregatina di mani per la contentezza, borbottò a mezza voce: — Questo legno è capitato a tempo: voglio servirmene per fare una gamba di tavolino.", en: "As soon as Master Cherry saw that piece of wood he cheered up completely and, rubbing his hands with pleasure, he muttered under his breath: 'This wood has come just at the right time: I'll use it to make a leg for a little table.'" }
  - { es: "Detto fatto, prese subito l'ascia arrotata per cominciare a levargli la scorza e a digrossarlo, ma quando fu lì per lasciare andare la prima asciata, rimase col braccio sospeso in aria, perché sentì una vocina sottile, che disse raccomandandosi: — Non mi picchiar tanto forte! Figuratevi come rimase quel buon vecchio di maestro Ciliegia!", en: "No sooner said than done: he picked up his sharpened axe to start stripping the bark and roughing it out, but just as he was about to bring down the first blow, he stopped with his arm in the air, because he heard a tiny thin voice pleading: 'Don't hit me so hard!' Imagine how that good old Master Cherry felt!" }
  - { es: "Girò gli occhi smarriti intorno alla stanza per vedere di dove mai poteva essere uscita quella vocina, e non vide nessuno! Guardò sotto il banco, e nessuno; guardò dentro un armadio che stava sempre chiuso, e nessuno; guardò nel corbello dei trucioli e della segatura, e nessuno; aprì l'uscio di bottega per dare un'occhiata anche sulla strada, e nessuno! O dunque?...", en: "He turned his bewildered eyes round the room to see where on earth that little voice could have come from, and he saw nobody! He looked under the workbench, and nobody; he looked inside a cupboard that was always kept shut, and nobody; he looked in the basket of shavings and sawdust, and nobody; he opened the shop door to take a look out in the street as well, and nobody! Well then?..." }
  - { es: "— Ho capito; — disse allora ridendo e grattandosi la parrucca, — si vede che quella vocina me la sono figurata io. Rimettiamoci a lavorare. E ripresa l'ascia in mano, tirò giù un solennissimo colpo sul pezzo di legno. — Ohi! tu m'hai fatto male! — gridò rammaricandosi la solita vocina.", en: "'I see,' he said then, laughing and scratching his wig, 'I must have imagined that little voice. Let's get back to work.' And taking the axe in his hand again, he brought down a tremendous blow on the piece of wood. 'Ow! You've hurt me!' cried the same little voice, complaining." }
  - { es: "Questa volta maestro Ciliegia restò di stucco, cogli occhi fuori del capo per la paura, colla bocca spalancata e colla lingua giù ciondoloni fino al mento, come un mascherone da fontana. Appena riebbe l'uso della parola, cominciò a dire tremando e balbettando dallo spavento:", en: "This time Master Cherry was struck dumb, his eyes popping out of his head with fear, his mouth wide open and his tongue hanging down to his chin, like a carved face on a fountain. As soon as he could speak again, he began to say, trembling and stammering with fright:" }
  - { es: "— Ma di dove sarà uscita questa vocina che ha detto ohi?... Eppure qui non c'è anima viva. Che sia per caso questo pezzo di legno che abbia imparato a piangere e a lamentarsi come un bambino? Io non lo posso credere. Questo legno eccolo qui; è un pezzo di legno da caminetto, come tutti gli altri, e a buttarlo sul fuoco, c'è da far bollire una pentola di fagioli... O dunque? Che ci sia nascosto dentro qualcuno? Se c'è nascosto qualcuno, tanto peggio per lui. Ora l'accomodo io!", en: "'But where can this little voice that said ow have come from?... And yet there isn't a living soul here. Could it be that this piece of wood has learned to cry and complain like a child? I can't believe it. Here's the wood, look; it's a piece of firewood like any other, and if you throw it on the fire it'll boil a pot of beans... Well then? Could someone be hiding inside it? If someone's hiding in there, so much the worse for him. I'll sort him out!'" }
  - { es: "E così dicendo, agguantò con tutt'e due le mani quel povero pezzo di legno e si pose a sbatacchiarlo senza carità contro le pareti della stanza. Poi si messe in ascolto, per sentire se c'era qualche vocina che si lamentasse. Aspettò due minuti, e nulla; cinque minuti, e nulla; dieci minuti, e nulla!", en: "And as he said this, he grabbed that poor piece of wood with both hands and started banging it mercilessly against the walls of the room. Then he stopped to listen, to hear whether some little voice was complaining. He waited two minutes, and nothing; five minutes, and nothing; ten minutes, and nothing!" }
  - { es: "— Ho capito, — disse allora sforzandosi di ridere e arruffandosi la parrucca, — si vede che quella vocina che ha detto ohi, me la sono figurata io! Rimettiamoci a lavorare. E perché gli era entrata addosso una gran paura, si provò a canterellare per farsi un po' di coraggio.", en: "'I see,' he said then, forcing himself to laugh and ruffling his wig, 'I must have imagined that little voice that said ow! Let's get back to work.' And because a great fear had come over him, he tried humming a tune to give himself a little courage." }
  - { es: "Intanto, posata da una parte l'ascia, prese in mano la pialla, per piallare e tirare a pulimento il pezzo di legno; ma nel mentre che lo piallava in su e in giù, sentì la solita vocina che gli disse ridendo: — Smetti! tu mi fai il pizzicorino sul corpo!", en: "Meanwhile, putting the axe aside, he took up the plane to smooth and polish the piece of wood; but while he was planing it up and down, he heard the same little voice saying to him with a laugh: 'Stop it! You're tickling me!'" }
  - { es: "Questa volta il povero maestro Ciliegia cadde giù come fulminato. Quando riaprì gli occhi, si trovò seduto per terra. Il suo viso pareva trasfigurato, e perfino la punta del naso, di paonazza come era quasi sempre, gli era diventata turchina dalla gran paura.", en: "This time poor Master Cherry fell down as if struck by lightning. When he opened his eyes again, he found himself sitting on the floor. His face seemed transformed, and even the tip of his nose, from the purple it nearly always was, had turned blue with fright." }
questions:
  - { q: "Come gioca il narratore con l'inizio tradizionale delle fiabe?", options: ["Promette un re e poi racconta di una regina", "Corregge i lettori che si aspettano un re: c'era una volta un pezzo di legno", "Comincia la storia dalla fine"], answer: 1, explain: "«— Un re! — diranno subito i miei piccoli lettori. No, ragazzi, avete sbagliato.» Collodi breaks the fairy-tale convention in the first lines." }
  - { q: "Perché mastr'Antonio è chiamato maestro Ciliegia?", options: ["Perché vende ciliegie", "Per il colore della punta del naso, lucida e paonazza", "Perché ha un albero di ciliegie davanti alla bottega"], answer: 1, explain: "«per via della punta del suo naso, che era sempre lustra e paonazza, come una ciliegia matura»." }
  - { q: "Che cosa vuole fare il falegname con il pezzo di legno?", options: ["Bruciarlo nel caminetto", "Una gamba di tavolino", "Un burattino"], answer: 1, explain: "«voglio servirmene per fare una gamba di tavolino». The puppet comes later, with Geppetto." }
  - { q: "Come reagisce maestro Ciliegia la prima volta che sente la vocina?", options: ["Scappa dalla bottega", "Cerca dappertutto e poi decide di essersela immaginata", "Chiama i vicini"], answer: 1, explain: "He searches under the bench, in the cupboard, in the basket, in the street, and concludes «quella vocina me la sono figurata io»." }
  - { q: "Nella frase «Che sia per caso questo pezzo di legno che abbia imparato a piangere?», il congiuntivo esprime…", options: ["un ordine", "un dubbio, una domanda rivolta a sé stesso", "un desiderio realizzato"], answer: 1, explain: "Che + congiuntivo standing alone (che sia…?) voices a doubt or conjecture – the independent subjunctive of c1.u01." }
  - { q: "Come finisce il capitolo?", options: ["Il falegname butta il legno nel fuoco", "Il falegname sviene dalla paura e il naso gli diventa turchino", "Il pezzo di legno comincia a camminare"], answer: 1, explain: "«cadde giù come fulminato… la punta del naso… gli era diventata turchina dalla gran paura»." }
