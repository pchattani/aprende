# B1 grammar notes (Hong Kong Cantonese). Explanations use light markdown:
# ### headings, bullets, pipe tables, **bold**. Cantonese examples are in
# traditional characters followed by toned Jyutping in brackets.
- id: g.resultative-complements
  level: b1
  title: "Resultative complements - 做完, 睇明, 寫錯"
  summary: "A second word after the verb tells you the result: 做完 'finish doing', 聽明 'hear and understand', 寫錯 'write wrongly'."
  explanation: |
    Cantonese often describes an action **and its result** in one compound: verb + result.
    | Compound | Jyutping | Meaning |
    |---|---|---|
    | 做完 | zou6 jyun4 | finish doing |
    | 聽明 / 聽明白 | teng1 ming4 | hear and understand |
    | 睇清楚 | tai2 cing1 co2 | see clearly |
    | 寫錯 | se2 co3 | write wrongly |
    | 食飽 | sik6 baau2 | eat until full |
    | 洗乾淨 | sai2 gon1 zeng6 | wash clean |
    | 搞掂 | gaau2 dim6 | get sorted, sort out |
    | 整爛 | zing2 laan6 | break (by handling) |

    ### With 咗
    咗 goes after the whole compound: 我做完咗功課 / 我做完功課 "I've finished my homework" (咗 is often dropped after 完).

    ### Negative
    冇 + compound: 我冇聽明 "I didn't understand." 未 + compound: 我未做完 "I haven't finished yet."

    ### Why it matters
    The plain verb only describes the attempt: 我搵咗 "I looked"; 我搵到 "I found it". 我聽咗 "I listened"; 我聽明 "I understood".
  examples:
    - { es: "你做完功課未呀？", en: "Have you finished your homework yet?" }
    - { es: "唔好意思，我冇聽明，可唔可以再講一次？", en: "Sorry, I didn't understand. Could you say it again?" }
    - { es: "我寫錯咗個地址。", en: "I wrote the address wrong." }
    - { es: "件事搞掂咗喇。", en: "It's all sorted now." }
  pitfalls:
    - "咗 goes after the result word, not between: 做完咗, not 做咗完."
    - "The plain verb doesn't imply success: 我學咗 'I studied it' vs 我學識咗 'I've learned it (can do it now)'."
    - "Negate with 冇 / 未, not 唔: 我冇睇清楚, not 我唔睇清楚 (which means 'I won't look carefully')."
  related: [g.jyun-hou, g.potential-resultatives, g.dou-attain]
  drills:
    - { es: "我食飽喇。", en: "I'm full." }
    - { es: "你睇清楚啲啦。", en: "Look more carefully." }
    - { es: "我講錯嘢喇。", en: "I said the wrong thing." }
    - { es: "啲碗洗乾淨咗。", en: "The bowls have been washed clean." }

- id: g.jyun-hou
  level: b1
  title: "完 and 好 - finished and ready"
  summary: "V完 means the action is over (食完 'finished eating'); V好 means it is done properly and ready (執好 'packed and ready')."
  explanation: |
    ### 完 (jyun4): finished
    The action is over, nothing left to do:
    - 我睇完本書喇 (ngo5 tai2 jyun4 bun2 syu1 laa3) - I've finished reading the book.
    - 食完飯先走 - Leave after you've finished eating.

    ### 好 (hou2): done properly, ready
    The action is completed **satisfactorily**, often as preparation:
    - 執好行李未呀？ (zap1 hou2 hang4 lei5 mei6 aa3) - Have you finished packing?
    - 坐好 (co5 hou2) - Sit properly.
    - 準備好 - ready.

    | Compound | Focus |
    |---|---|
    | 寫完 | finished writing (the end) |
    | 寫好 | written and ready (the outcome) |

    ### 完 in time clauses
    V完 + 就 / 先 is extremely common: 做完嘢就返屋企 "Go home once you've finished work."
  examples:
    - { es: "我哋食完飯去行街啦。", en: "Let's go shopping after we've eaten." }
    - { es: "份報告寫好咗，你睇吓。", en: "The report is written, have a look." }
    - { es: "你準備好未呀？", en: "Are you ready?" }
    - { es: "佢講完電話就出咗去。", en: "He went out as soon as he got off the phone.", altEn: ["She went out as soon as she got off the phone."] }
  pitfalls:
    - "Don't use 好 when you just mean 'over': 'the film is over' is 套戲做完喇, not 做好喇."
    - "坐好 / 企好 mean 'sit / stand properly', not 'sit well'."
  related: [g.resultative-complements, g.ji-cin-ji-hau, g.sin-final]
  drills:
    - { es: "我做完嘢喇。", en: "I've finished work." }
    - { es: "訂好酒店未呀？", en: "Have you booked the hotel yet?" }
    - { es: "睇完套戲先食飯。", en: "Let's eat after the film." }
    - { es: "坐好，就嚟開車喇。", en: "Sit properly, we're about to go." }

- id: g.saai-all
  level: b1
  title: "晒 - all, completely"
  summary: "晒 after a verb or adjective means 'all of it, completely': 食晒 'eat it all', 濕晒 'soaked through', 唔該晒 'thanks so much'."
  explanation: |
    晒 (saai3) goes after a verb (and before the object) to say the action covers **everything**:
    - 我食晒啲餸 (ngo5 sik6 saai3 di1 sung3) - I ate all the food.
    - 啲飛賣晒喇 (di1 fei1 maai6 saai3 laa3) - The tickets are sold out.
    - 佢用晒啲錢 - He spent all the money.

    ### After adjectives: completely
    - 濕晒 (sap1 saai3) - soaked through
    - 攰晒 - completely exhausted
    - 啱晒 - exactly right

    ### Politeness intensifier
    唔該晒 (m4 goi1 saai3) and 多謝晒 (do1 ze6 saai3) - thanks so much.

    ### Negative and potential
    - 未食晒 - haven't eaten it all yet
    - 食唔晒 (sik6 m4 saai3) - can't finish (it's too much)

    晒 is very Cantonese: Mandarin and written Chinese use 完 or 全部 instead.
  examples:
    - { es: "啲蛋撻賣晒喇。", en: "The egg tarts are sold out." }
    - { es: "落大雨，我成身濕晒。", en: "It poured and I got soaked." }
    - { es: "太多喇，我食唔晒。", en: "It's too much, I can't finish it." }
    - { es: "唔該晒你幫手！", en: "Thanks so much for helping!" }
  pitfalls:
    - "晒 goes right after the verb, before the object: 食晒啲餸, not 食啲餸晒."
    - "With a plural object, 晒 refers to the object (all the food), not to the people doing it."
  related: [g.resultative-complements, g.potential-resultatives, g.wh-dou-every]
  drills:
    - { es: "佢飲晒啲啤酒。", en: "He drank all the beer.", altEn: ["She drank all the beer."] }
    - { es: "我部手機冇晒電。", en: "My phone's completely out of battery." }
    - { es: "啲人走晒喇。", en: "Everyone has left." }
    - { es: "多謝晒！", en: "Thank you so much!" }

- id: g.potential-resultatives
  level: b1
  title: "Can't finish, can't understand - V唔完, V唔明"
  summary: "Put 唔 or 得 between a verb and its result to say whether the result is possible: 做唔完 'can't finish', 聽唔明 'can't understand'."
  explanation: |
    Any verb + result compound can become a **potential** form:
    | Compound | Can | Can't | Jyutping (can't) |
    |---|---|---|---|
    | 做完 finish | 做得完 | 做唔完 | zou6 m4 jyun4 |
    | 聽明 understand | 聽得明 | 聽唔明 | teng1 m4 ming4 |
    | 睇清楚 see clearly | 睇得清楚 | 睇唔清楚 | tai2 m4 cing1 co2 |
    | 搞掂 sort out | 搞得掂 | 搞唔掂 | gaau2 m4 dim6 |
    | 瞓着 fall asleep | 瞓得着 | 瞓唔着 | fan3 m4 zoek6 |
    | 食晒 finish (food) | 食得晒 | 食唔晒 | sik6 m4 saai3 |

    ### Questions
    V得…唔…? or the A-not-A form: 你聽唔聽得明呀？ / 你聽得明嗎？ "Can you understand?"

    ### 唔明 vs 聽唔明
    - 我唔明 - I don't understand (in general).
    - 我聽唔明 - I can't understand (what I hear).
    - 我睇唔明 - I can't understand (what I read).

    The positive V得 form is used mostly in questions and answers; statements tend to be negative.
  examples:
    - { es: "你講得太快，我聽唔明。", en: "You're talking too fast, I can't understand." }
    - { es: "今日做唔完，聽日再做。", en: "We can't finish today, we'll continue tomorrow." }
    - { es: "啲字太細，我睇唔清楚。", en: "The writing is too small, I can't see it clearly." }
    - { es: "你聽唔聽得明呀？聽得明。", en: "Can you understand? Yes, I can." }
  pitfalls:
    - "唔 goes between the verb and the result: 聽唔明, not 唔聽明."
    - "V唔完 'can't finish' is different from 冇V完 'didn't finish': 我做唔完 (too much) vs 我冇做完 (I didn't)."
  related: [g.resultative-complements, g.potential-complements, g.saai-all]
  drills:
    - { es: "我睇唔明呢封信。", en: "I can't understand this letter." }
    - { es: "咁多嘢，你做唔做得完呀？", en: "With so much to do, can you finish it?" }
    - { es: "太嘈，我瞓唔着。", en: "It's too noisy, I can't sleep." }
    - { es: "我搞唔掂部電腦。", en: "I can't sort out the computer." }

- id: g.directional-complements
  level: b1
  title: "Direction after the verb - V嚟 / V去"
  summary: "嚟 after a verb means towards the speaker, 去 away from the speaker: 拎嚟 'bring', 拎去 'take'."
  explanation: |
    嚟 (lai4) and 去 (heoi3) after another verb show the **direction** of the action relative to the speaker:
    | Verb | + 嚟 (towards me) | + 去 (away) |
    |---|---|---|
    | 拎 (carry) | 拎嚟 bring | 拎去 take |
    | 寄 (send) | 寄嚟 send here | 寄去 send there |
    | 搬 (move) | 搬嚟 move here | 搬去 move there |
    | 行 (walk) | 行嚟 walk here | 行去 walk there |

    - 你拎本書嚟啦 (nei5 ling1 bun2 syu1 lai4 laa1) - Bring the book.
    - 我搬咗去沙田 (ngo5 bun1 zo2 heoi3 saa1 tin4) - I've moved to Sha Tin.

    ### Place objects
    A destination comes between the verb and 嚟 / 去 or after 去: 行嚟我度 "walk over to my place", 搬去大埔 "move to Tai Po".

    ### Other objects
    Ordinary objects usually go between the verb and the direction word: 拎杯水嚟 "bring a glass of water".
  examples:
    - { es: "唔該拎張凳嚟。", en: "Please bring a stool over." }
    - { es: "我寄咗份禮物去英國。", en: "I sent a present to the UK." }
    - { es: "佢哋下個月搬去元朗。", en: "They're moving to Yuen Long next month." }
    - { es: "你行過嚟啦。", en: "Come over here." }
  pitfalls:
    - "Choose 嚟 or 去 by where the speaker is: on the phone from home, 'bring it home' is 拎返嚟; from outside, 拎返去."
    - "Don't drop the direction word: 'bring it' is 拎嚟, not just 拎."
  related: [g.compound-directionals, g.heoi-lai, g.faan-back]
  drills:
    - { es: "拎啲嘢食嚟啦。", en: "Bring some food." }
    - { es: "佢搬咗去大埔。", en: "She moved to Tai Po.", altEn: ["He moved to Tai Po."] }
    - { es: "你寄過嚟啦。", en: "Send it over." }

- id: g.compound-directionals
  level: b1
  title: "Up, down, in, out - 上嚟, 落去, 出嚟, 入去"
  summary: "Direction verbs (上, 落, 入, 出, 返, 過, 埋) combine with 嚟/去 and follow the main verb: 行上山, 跑出嚟, 搬落去."
  explanation: |
    ### Direction words
    | Word | Jyutping | Direction |
    |---|---|---|
    | 上 | soeng5 | up |
    | 落 | lok6 | down |
    | 入 | jap6 | in |
    | 出 | ceot1 | out |
    | 返 | faan1 | back |
    | 過 | gwo3 | over, across |
    | 埋 | maai4 | closer, up to |
    | 起 | hei2 | up (from lying/sitting) |
    | 開 | hoi1 | away, apart |

    ### Combinations
    Verb + direction + 嚟/去:
    - 行上嚟 (haang4 soeng5 lai4) - walk up (here)
    - 跳落去 (tiu3 lok6 heoi3) - jump down (there)
    - 拎出嚟 (ling1 ceot1 lai4) - take out
    - 企起身 (kei5 hei2 san1) - stand up

    ### With places
    The place goes after the direction word: 行上大帽山 (haang4 soeng5 daai6 mou6 saan1) "walk up Tai Mo Shan", 行入屋 "walk into the house", 爬上去 "climb up there".

    ### Getting on and off
    上車 / 落車 (soeng5 ce1 / lok6 ce1) get on / off a vehicle; 落雨 (rain) uses the same 落.
  examples:
    - { es: "我哋行上山頂睇日出。", en: "We walked up to the summit to watch the sunrise." }
    - { es: "佢由銀包拎咗張相出嚟。", en: "She took a photo out of her wallet.", altEn: ["He took a photo out of his wallet."] }
    - { es: "下一個站落車。", en: "Get off at the next stop." }
    - { es: "啲細路跑咗出去玩。", en: "The kids ran out to play." }
  pitfalls:
    - "The place goes between the direction word and 嚟/去 or at the end: 行入屋, 行入間屋度, not 行屋入."
    - "'Get off the bus' is 落車, not 出車 (which means 'set off' for a vehicle)."
  related: [g.directional-complements, g.faan-back, g.maai-closer]
  drills:
    - { es: "你上嚟啦。", en: "Come up." }
    - { es: "我行落去搵你。", en: "I'll walk down to find you." }
    - { es: "拎個銀包出嚟。", en: "Take your wallet out." }
    - { es: "佢企起身講嘢。", en: "He stood up to speak.", altEn: ["She stood up to speak."] }

- id: g.faan-back
  level: b1
  title: "返 - back, again, restore"
  summary: "返 after a verb means 'back' (攞返 'take back'), 'again / resume' (講返 'go back to'), or restoring a normal state (好返 'get better')."
  explanation: |
    返 (faan1) is one of the most useful Cantonese complements.

    ### Back (return)
    - 返屋企 (faan1 uk1 kei2) - go home
    - 攞返 (lo2 faan1) - take back, get back: 攞返啲錢 "get the money back"
    - 畀返 (bei2 faan1) - give back: 畀返本書我 "give me my book back"

    ### Resume, go back to
    - 講返正題 - get back to the point
    - 做返之前份工 - go back to the old job

    ### Restore to normal
    - 好返 (hou2 faan1) - recover: 你好返未呀？ "Are you better yet?"
    - 開返 (hoi1 faan1) - reopen: 間舖聽日開返 "The shop reopens tomorrow."
    - 着返件外套 - put your jacket back on

    ### Little bit of something (casual)
    V返 + small amount: 飲返杯 (jam2 faan1 bui1) "have a drink", 食返碗麵 "have a bowl of noodles" - it adds a relaxed, treat-yourself feel.
  examples:
    - { es: "你幾時畀返啲錢我呀？", en: "When are you giving me the money back?" }
    - { es: "我病咗一個星期，而家好返喇。", en: "I was ill for a week, but I'm better now." }
    - { es: "放工去飲返杯啦。", en: "Let's go for a drink after work." }
    - { es: "我哋講返正經嘢。", en: "Let's get back to serious matters." }
  pitfalls:
    - "返 goes right after the verb, before the object: 攞返本書, not 攞本書返."
    - "Don't mix up 返 'back' with 翻 in older texts; this course writes 返."
  related: [g.compound-directionals, g.heoi-lai]
  drills:
    - { es: "唔該畀返張單我。", en: "Please give me back the receipt." }
    - { es: "部冷氣又開返喇。", en: "The air con is back on." }
    - { es: "我哋聽日再講返。", en: "Let's pick it up again tomorrow." }
    - { es: "佢搬返香港住。", en: "She moved back to Hong Kong.", altEn: ["He moved back to Hong Kong."] }

- id: g.maai-closer
  level: b1
  title: "埋 - closer, along, finish off, as well"
  summary: "埋 after a verb means 'move closer' (行埋去), 'include, as well' (我都去埋), or 'finish off' (食埋佢)."
  explanation: |
    埋 (maai4) has several related meanings after a verb:

    ### Closer
    - 行埋嚟 (haang4 maai4 lai4) - come closer
    - 企埋啲 - stand a bit closer
    - 埋位 (maai4 wai2) - take your seat

    ### As well, along too
    - 我都去埋 (ngo5 dou1 heoi3 maai4) - I'll go too.
    - 叫埋佢 - invite him along too.
    - 連埋 (lin4 maai4) - including: 連埋我 "including me".

    ### Finish off the rest
    - 食埋佢 (sik6 maai4 keoi5) - finish it off.
    - 做埋份報告先走 - finish the report before you leave.

    ### Closed, put away
    - 閂埋門 (saan1 maai4 mun4) - shut the door
    - 收埋 - put away, hide

    ### Fixed words
    埋單 (maai4 daan1) the bill, 同埋 (tung4 maai4) and.
  examples:
    - { es: "行埋啲，我影唔到你哋。", en: "Come a bit closer, I can't get you all in the photo." }
    - { es: "你去唔去呀？我都想去埋。", en: "Are you going? I'd like to come along too." }
    - { es: "食埋最後一件啦。", en: "Finish off the last piece." }
    - { es: "記得閂埋窗。", en: "Remember to shut the window." }
  pitfalls:
    - "埋 'as well' goes after the verb (我去埋), while 都 goes before it; they are often used together: 我都去埋."
    - "收埋 means 'hide / put away', not 'collect closer'."
  related: [g.compound-directionals, g.dou-also, g.keoi-final]
  drills:
    - { es: "叫埋你男朋友嚟啦。", en: "Bring your boyfriend along too." }
    - { es: "做埋呢樣先放工。", en: "Finish this before you clock off." }
    - { es: "閂埋門啦。", en: "Close the door." }
    - { es: "連埋我一共五個人。", en: "Including me, there are five of us." }

- id: g.bei-passive
  level: b1
  title: "畀 - the passive (got …ed)"
  summary: "A + 畀 + agent + verb means 'A got …ed by the agent': 我部手機畀人偷咗。"
  explanation: |
    畀 (bei2), the verb "give", also forms the passive:
    **Patient + 畀 + agent + verb (+ 咗 / result)**
    - 我部手機畀人偷咗 (ngo5 bou6 sau2 gei1 bei2 jan4 tau1 zo2) - My phone got stolen (by someone).
    - 佢畀老細鬧 (keoi5 bei2 lou5 sai3 naau6) - He got told off by the boss.

    ### The agent is required
    Unlike English, you can't leave out the agent. If you don't know who did it, use 人 (jan4) "someone":
    | Not OK | OK |
    |---|---|
    | ~~我個銀包畀偷咗~~ | 我個銀包畀人偷咗 |

    ### Usually something bad
    The 畀 passive mostly describes unpleasant events: 畀人呃 (aak1) "be cheated", 畀車撞 "be hit by a car", 畀蚊咬 "be bitten by mosquitoes". Neutral events usually stay active.

    ### Written Chinese
    Formal Chinese uses 被; in Cantonese speech, 畀 is the norm.
  examples:
    - { es: "我喺旺角畀人偷咗銀包。", en: "I had my wallet stolen in Mong Kok." }
    - { es: "佢遲到畀老細鬧。", en: "He got told off by the boss for being late.", altEn: ["She got told off by the boss for being late."] }
    - { es: "我成晚畀蚊咬。", en: "I was bitten by mosquitoes all night." }
    - { es: "佢畀人炒咗。", en: "She got fired.", altEn: ["He got fired."] }
  pitfalls:
    - "Never leave out the agent: say 畀人偷咗, not 畀偷咗."
    - "Don't use the passive for neutral or good things where English would: 'the house was built in 1990' is 呢間屋一九九零年起嘅."
    - "In speech use 畀, not 被: 被 belongs to written Chinese and news reading."
  related: [g.bei-give, g.bei-permissive, g.formal-passive]
  drills:
    - { es: "我架單車畀人偷咗。", en: "My bike got stolen." }
    - { es: "佢畀狗咬咗。", en: "He was bitten by a dog.", altEn: ["She was bitten by a dog."] }
    - { es: "我哋畀人呃咗。", en: "We got cheated." }
    - { es: "啲衫畀雨淋濕晒。", en: "The clothes got soaked by the rain." }

- id: g.bei-permissive
  level: b1
  title: "畀 - let, allow"
  summary: "畀 + person + verb means 'let someone do': 畀我試吓 'let me try', 唔畀入 'not allowed in'."
  explanation: |
    畀 (bei2) + person + verb means "let, allow":
    - 畀我試吓 (bei2 ngo5 si3 haa5) - Let me try.
    - 阿媽唔畀我出街 (aa3 maa1 m4 bei2 ngo5 ceot1 gaai1) - Mum won't let me go out.
    - 畀我諗吓先 - Let me think first.

    ### No person: "allowed"
    唔畀 + verb means "not allowed": 呢度唔畀影相 "No photos allowed here." 畀唔畀泊車㗎？ "Is parking allowed?"

    ### Three uses of 畀
    | Use | Pattern | Example |
    |---|---|---|
    | give | 畀 + thing + person | 畀本書我 |
    | let | 畀 + person + verb | 畀我睇吓 |
    | passive | X + 畀 + agent + verb | 畀人偷咗 |

    Context and word order make the meaning clear: 畀佢睇 "let him see", 畀佢睇到 "got seen by him".
  examples:
    - { es: "畀我介紹吓自己。", en: "Let me introduce myself." }
    - { es: "我老婆唔畀我食煙。", en: "My wife won't let me smoke." }
    - { es: "博物館入面唔畀影相。", en: "Photos aren't allowed inside the museum." }
    - { es: "畀我嚟啦。", en: "Let me do it." }
  pitfalls:
    - "Word order distinguishes 'give' and 'let': 畀本書我 'give me the book' vs 畀我睇本書 'let me read the book'."
    - "'Let's' is not 畀我哋: 'let's go' is 我哋走啦."
  related: [g.bei-give, g.bei-passive, g.ho-ji-can-may]
  drills:
    - { es: "畀我幫你啦。", en: "Let me help you." }
    - { es: "唔畀帶狗入去。", en: "Dogs aren't allowed in." }
    - { es: "佢爸爸畀佢一個人去旅行。", en: "Her dad let her travel alone.", altEn: ["His dad let him travel alone."] }
    - { es: "畀我睇吓張相。", en: "Let me see the photo." }

- id: g.jau-jan-someone
  level: b1
  title: "有人, 冇人, 有啲 - someone, no one, some"
  summary: "有人 + verb means 'someone (did)'; 冇人 'no one'; 有啲 + noun 'some (of them)'. Indefinite subjects start with 有."
  explanation: |
    Cantonese does not like an indefinite subject such as "a man" or "someone" at the start. It introduces it with 有 (jau5):
    - 有人搵你 (jau5 jan4 wan2 nei5) - Someone's looking for you.
    - 有個男人喺門口等緊 - A man is waiting at the door.
    - 冇人知 (mou5 jan4 zi1) - No one knows.

    ### 有啲: some (of a group)
    - 有啲人鍾意，有啲人唔鍾意 - Some people like it, some don't.
    - 有啲嘢我唔明 - There are some things I don't understand.

    ### With incidents
    Very common in reports: 有人報警 "someone called the police", 有人受傷 "someone was injured", 有人喺度跌親 "someone fell here".

    | English | Cantonese |
    |---|---|
    | A car hit him. | 有架車撞咗佢。 |
    | Nobody came. | 冇人嚟。 |
  examples:
    - { es: "頭先有人打電話嚟搵你。", en: "Someone called for you just now." }
    - { es: "有架的士喺樓下等緊。", en: "A taxi is waiting downstairs." }
    - { es: "冇人話畀我知。", en: "Nobody told me." }
    - { es: "有啲同事唔同意。", en: "Some colleagues don't agree." }
  pitfalls:
    - "Don't start with a bare indefinite noun: 有個人搵你, not 一個人搵你."
    - "冇人 is 'nobody'; don't say 冇有人 in speech."
  related: [g.jau-have, g.bei-passive, g.wh-dou-every]
  drills:
    - { es: "有人喺度嗎？", en: "Is anyone here?" }
    - { es: "有人偷咗我啲嘢。", en: "Someone stole my things." }
    - { es: "冇人識講英文。", en: "Nobody can speak English." }
    - { es: "有個朋友想識你。", en: "A friend would like to meet you." }

- id: g.zoeng-disposal
  level: b1
  title: "將 - doing something to an object"
  summary: "將 + object + verb + result puts the object before the verb to say what was done to it: 將啲衫摺好。"
  explanation: |
    將 (zoeng1) moves a **specific** object before the verb, focusing on what happens to it:
    **Subject + 將 + object + verb + result/destination**
    - 將啲衫摺好 (zoeng1 di1 saam1 zip3 hou2) - Fold the clothes (neatly).
    - 我將本書放咗喺枱面 (ngo5 zoeng1 bun2 syu1 fong3 zo2 hai2 toi2 min2) - I put the book on the table.
    - 佢將啲錢擺入銀行 - He put the money in the bank.

    ### The verb needs a tail
    A bare verb sounds incomplete after 將. Add a result, a destination or 咗佢:
    | Incomplete | Complete |
    |---|---|
    | ~~將啲碗洗~~ | 將啲碗洗乾淨 |
    | ~~將封信寄~~ | 將封信寄去英國 |

    ### 將 in speech
    將 is a little formal; in casual speech people often just use the plain order or put the object first: 啲衫摺好佢. But it is common in instructions and recipes.
  examples:
    - { es: "你將啲嘢執好先出去。", en: "Tidy your things up before you go out." }
    - { es: "我將份文件傳咗畀你。", en: "I've forwarded the document to you." }
    - { es: "將啲菜切細。", en: "Chop the vegetables finely." }
    - { es: "佢將所有錢都捐咗。", en: "She donated all the money.", altEn: ["He donated all the money."] }
  pitfalls:
    - "Don't end a 將 sentence with a bare verb: add a result or destination (洗乾淨, 放喺度, 食咗佢)."
    - "The object of 將 must be specific: 將一啲書 sounds odd; use 將啲書 or 將呢幾本書."
  related: [g.wan-lo-use, g.keoi-final, g.resultative-complements]
  drills:
    - { es: "將啲垃圾拎落樓。", en: "Take the rubbish downstairs." }
    - { es: "我將架車泊咗喺停車場。", en: "I parked the car in the car park." }
    - { es: "將啲凳擺返原位。", en: "Put the stools back where they were." }

- id: g.wan-lo-use
  level: b1
  title: "攞 / 搵…嚟… - using something to do something"
  summary: "攞 or 搵 + thing + 嚟 + verb means 'use X to do': 攞張紙嚟寫, 搵把刀嚟切."
  explanation: |
    To say what you use for a task, Cantonese often says "get X to do":
    - 攞張紙嚟寫低 (lo2 zoeng1 zi2 lai4 se2 dai1) - Get a piece of paper to write it down.
    - 搵把刀嚟切 (wan2 baa2 dou1 lai4 cit3) - Find a knife to cut it with.
    - 用 (jung6) is also common: 用筷子食 "eat with chopsticks".

    ### The pattern
    **攞 / 搵 / 用 + thing + (嚟) + verb**
    嚟 (lai4) here means "in order to"; it links the tool and the action.

    ### 用嚟: used for
    X + 用嚟 + verb means "X is used for": 呢個係用嚟開罐頭嘅 "This is for opening tins."

    | Verb | Nuance |
    |---|---|
    | 用 | use (neutral) |
    | 攞 | take, grab (something handy) |
    | 搵 | find, get hold of (something you need to look for) |
  examples:
    - { es: "攞枝筆嚟記低佢個電話。", en: "Grab a pen and write down his number.", altEn: ["Get a pen to note her number."] }
    - { es: "呢個係用嚟做乜嘢㗎？", en: "What's this used for?" }
    - { es: "搵個膠袋嚟裝啲垃圾。", en: "Find a plastic bag to put the rubbish in." }
    - { es: "我哋用手機嚟畀錢。", en: "We pay with our phones." }
  pitfalls:
    - "The tool comes before the action: 攞刀嚟切, not 切嚟攞刀."
    - "搵 means 'find', not 'use', when it stands alone: 我搵緊把遮 'I'm looking for my umbrella'."
  related: [g.zoeng-disposal, g.serial-verbs, g.wai-zo-purpose]
  drills:
    - { es: "攞條毛巾嚟抹乾佢。", en: "Get a towel and dry it." }
    - { es: "我用呢個袋嚟裝書。", en: "I use this bag for my books." }
    - { es: "搵個人嚟幫手。", en: "Find someone to help." }

- id: g.keoi-final
  level: b1
  title: "V咗佢 - get it done (佢 at the end)"
  summary: "In commands, a dummy 佢 after the verb means 'get rid of it, get it done': 食咗佢, 掉咗佢, 做埋佢."
  explanation: |
    Cantonese commands often end in 佢 (keoi5) even when the object has already been mentioned or is not a person:
    - 食咗佢 (sik6 zo2 keoi5) - Eat it up.
    - 掉咗佢 (deu6 zo2 keoi5) - Throw it away.
    - 飲埋佢 (jam2 maai4 keoi5) - Drink the rest.

    ### Object first, 佢 at the end
    The real object often comes first as a topic, and 佢 refers back to it:
    - 啲衫洗咗佢 - Wash the clothes (get it done).
    - 呢啲舊嘢掉晒佢 - Throw all this old stuff away.

    ### Feel
    It sounds brisk and decisive, like "just do it". Very common in instructions at home and in the office.

    ### With 將
    將 + object + V咗佢 is a common combination: 將啲垃圾掉咗佢.
  examples:
    - { es: "啲餸凍喇，快啲食咗佢。", en: "The food's getting cold, eat it up." }
    - { es: "呢啲舊報紙掉咗佢啦。", en: "Throw away these old newspapers." }
    - { es: "份報告今日做埋佢。", en: "Get the report finished today." }
    - { es: "杯咖啡飲埋佢先走。", en: "Finish your coffee before you go." }
  pitfalls:
    - "This 佢 doesn't mean 'him/her' here; it refers to the thing just mentioned."
    - "It is used in commands and plans, not in neutral statements: 'I ate it' is 我食咗, not 我食咗佢 (unless you mean 'I polished it off')."
  related: [g.zoeng-disposal, g.maai-closer, g.personal-pronouns]
  drills:
    - { es: "關咗佢。", en: "Turn it off." }
    - { es: "啲碗洗咗佢。", en: "Get the dishes washed." }
    - { es: "賣咗佢算喇。", en: "Just sell it." }
    - { es: "唔該熄咗佢。", en: "Please switch it off." }

- id: g.relative-ge
  level: b1
  title: "Relative clauses with 嘅 - the person who, the thing that"
  summary: "The describing clause comes before the noun, linked by 嘅: 我住嘅屋邨 'the estate where I live'."
  explanation: |
    Cantonese has no "who/which/that". The whole describing clause goes **before the noun**, followed by 嘅 (ge3):
    | Clause | 嘅 | Noun | Meaning |
    |---|---|---|---|
    | 我住 | 嘅 | 屋邨 | the estate where I live |
    | 坐喺度 | 嘅 | 嗰個人 | the person sitting there |
    | 你尋日買 | 嘅 | 衫 | the clothes you bought yesterday |

    - 我住嘅屋邨好舊 (ngo5 zyu6 ge3 uk1 cyun1 hou2 gau6) - The estate I live in is very old.
    - 識講廣東話嘅人 (sik1 gong2 gwong2 dung1 waa2 ge3 jan4) - people who speak Cantonese

    ### Long clauses
    Even long clauses go in front: 上個月喺沙田開嘅新餐廳 "the new restaurant that opened in Sha Tin last month".

    ### Adding a demonstrative
    Demonstratives usually come first: 嗰個坐喺度嘅人 or 坐喺度嗰個人 (see the measure-word relative).
  examples:
    - { es: "我啱啱識嘅朋友係沙田人。", en: "The friend I've just met is from Sha Tin." }
    - { es: "你上次介紹嘅餐廳好好食。", en: "The restaurant you recommended last time was great." }
    - { es: "住喺樓上嘅人好嘈。", en: "The people who live upstairs are very noisy." }
    - { es: "我要搵一間近港鐵站嘅屋。", en: "I'm looking for a flat near an MTR station." }
  pitfalls:
    - "Don't put the clause after the noun as in English: 我住嘅屋, not 屋我住嘅."
    - "Don't forget 嘅: 我住屋邨 means 'I live on an estate', not 'the estate I live in'."
  related: [g.relative-classifier, g.ge-nominaliser, g.adj-ge-noun]
  drills:
    - { es: "佢係教我廣東話嘅老師。", en: "She's the teacher who teaches me Cantonese.", altEn: ["He's the teacher who teaches me Cantonese."] }
    - { es: "我鍾意有露台嘅屋。", en: "I like flats with a balcony." }
    - { es: "你尋日講嘅嘢係真㗎？", en: "Is what you said yesterday true?" }

- id: g.relative-classifier
  level: b1
  title: "Measure words in relative clauses - 我買嗰本書"
  summary: "Instead of 嘅, a relative clause can end with (嗰 +) measure word: 我尋日買(嗰)本書 'the book I bought yesterday'."
  explanation: |
    For a **specific** thing, Cantonese often replaces 嘅 with a measure word, optionally with 嗰 (go2):
    | With 嘅 | With measure word |
    |---|---|
    | 我尋日買嘅書 | 我尋日買嗰本書 / 我尋日買本書 |
    | 坐喺度嘅人 | 坐喺度嗰個人 |
    | 你介紹嘅餐廳 | 你介紹嗰間餐廳 |

    - 我尋日買嗰本書好好睇 (ngo5 cam4 jat6 maai5 go2 bun2 syu1 hou2 hou2 tai2) - The book I bought yesterday is really good.
    - 戴眼鏡嗰個係我老細 - The one wearing glasses is my boss.

    ### Plural: 啲
    我買啲嘢 / 我買嗰啲嘢 "the things I bought".

    ### Effect
    The measure-word version points to one particular thing, like "that book I bought". 嘅 is more general and is needed for kinds of things: 我鍾意食嘅嘢 "the things I like to eat".
  examples:
    - { es: "你頭先講嗰間餐廳喺邊度呀？", en: "Where's that restaurant you mentioned just now?" }
    - { es: "著紅衫嗰個係我家姐。", en: "The one in the red top is my sister." }
    - { es: "我上個月買部手機壞咗。", en: "The phone I bought last month is broken." }
    - { es: "你借畀我啲書我睇晒喇。", en: "I've finished all the books you lent me." }
  pitfalls:
    - "Use the right measure word: 我買嗰件衫, not 我買嗰個衫."
    - "For general kinds of things, keep 嘅: 我鍾意嘅音樂, not 我鍾意首音樂 (which means one specific song)."
  related: [g.relative-ge, g.classifier-as-the, g.demonstratives]
  drills:
    - { es: "企喺門口嗰個人係邊個呀？", en: "Who's the person standing at the door?" }
    - { es: "我住嗰間屋好細。", en: "The flat I live in is tiny." }
    - { es: "你送畀我嗰對鞋好舒服。", en: "The shoes you gave me are really comfortable." }

- id: g.ge-nominaliser
  level: b1
  title: "…嘅 on its own - the one(s) that, what"
  summary: "A clause or adjective + 嘅 with no noun means 'the one that …' or 'what …': 我要大嘅, 你講嘅冇錯。"
  explanation: |
    When the noun is obvious, it can be dropped, leaving the clause + 嘅 (ge3):
    - 我要大嘅 (ngo5 jiu3 daai6 ge3) - I'll take the big one.
    - 紅色嘅好啲 - The red one is better.
    - 你講嘅冇錯 (nei5 gong2 ge3 mou5 co3) - What you said is right.
    - 食嘅、飲嘅都有 - There's food and drink (things to eat and drink).

    ### Kinds of people
    做…嘅 = a person who does: 賣魚嘅 "fishmonger", 揸的士嘅 "taxi driver", 做IT嘅 "someone in IT".

    ### Possessive
    The same pattern gives "mine, yours": 我嘅, 佢嘅.

    ### With 係…嘅
    係 + clause + 嘅 describes a classification: 呢啲係唔賣嘅 "These are not for sale (are the not-selling kind)."
  examples:
    - { es: "有冇平啲嘅呀？", en: "Do you have a cheaper one?" }
    - { es: "我唔鍾意甜嘅。", en: "I don't like sweet things." }
    - { es: "佢爸爸係揸的士嘅。", en: "Her dad is a taxi driver.", altEn: ["His dad is a taxi driver."] }
    - { es: "你頭先講嘅我唔明。", en: "I didn't understand what you just said." }
  pitfalls:
    - "Don't add a dummy noun like 'one': 'the big one' is 大嘅, not 大嘅一個."
    - "做…嘅 can sound casual about someone's job; in formal contexts name the job: 司機, 醫生."
  related: [g.relative-ge, g.ge-possessive, g.adj-ge-noun]
  drills:
    - { es: "我要凍嘅。", en: "I'll have a cold one." }
    - { es: "新嘅定舊嘅呀？", en: "The new one or the old one?" }
    - { es: "佢係賣菜嘅。", en: "She sells vegetables.", altEn: ["He sells vegetables."] }
    - { es: "你想要嘅我都買咗。", en: "I've bought everything you wanted." }

- id: g.gok-dak-opinions
  level: b1
  title: "Giving opinions - 我覺得, 我諗, 我認為"
  summary: "我覺得 'I think/feel' is the everyday opinion opener; 我諗 'I reckon'; 我認為 'I believe' is more formal."
  explanation: |
    | Phrase | Jyutping | Register |
    |---|---|---|
    | 我覺得… | ngo5 gok3 dak1 | everyday: I think, I feel |
    | 我諗… | ngo5 nam2 | I reckon, I suppose |
    | 我認為… | ngo5 jing6 wai4 | I believe (formal) |
    | 我個人覺得… | ngo5 go3 jan4 gok3 dak1 | personally I think |
    | 依我睇… | ji1 ngo5 tai2 | as I see it |

    - 我覺得呢個計劃唔錯 - I think this plan is not bad.
    - 我諗佢唔會嚟 - I reckon he won't come.

    ### Asking
    你覺得點呀？ (nei5 gok3 dak1 dim2 aa3) "What do you think?" 你點睇？ "How do you see it?"

    ### Agreeing and disagreeing
    | Agree | Disagree |
    |---|---|
    | 我同意 I agree | 我唔同意 I disagree |
    | 冇錯 / 啱 right | 唔係噉囉 that's not so |
    | 你講得啱 you're right | 我唔係噉覺得 I don't see it that way |

    Note: negate the opinion verb, not the clause, less often than English: 我唔覺得佢會嚟 "I don't think he'll come" is fine; 我覺得佢唔會嚟 is also common.
  examples:
    - { es: "你覺得呢套戲點呀？", en: "What do you think of this film?" }
    - { es: "我覺得香港啲樓太貴。", en: "I think flats in Hong Kong are too expensive." }
    - { es: "依我睇，我哋應該等多陣。", en: "As I see it, we should wait a bit longer." }
    - { es: "我唔係好同意你嘅講法。", en: "I don't really agree with what you're saying." }
  pitfalls:
    - "覺得 is 'think' as in opinion; 諗 is 'think' as in the mental activity: 我諗緊 'I'm thinking (about it)'."
    - "認為 sounds formal in casual chat; use 覺得 with friends."
  related: [g.seoi-jin-daan-hai, g.jing-goi-should, g.probability]
  drills:
    - { es: "我覺得佢講得好啱。", en: "I think he's right.", altEn: ["I think she's right."] }
    - { es: "你點睇呀？", en: "What's your view?" }
    - { es: "我諗佢已經走咗。", en: "I reckon she's already left.", altEn: ["I reckon he's already left."] }
    - { es: "我同意。", en: "I agree." }

- id: g.seoi-jin-daan-hai
  level: b1
  title: "雖然…但係… - although … but"
  summary: "Cantonese uses both halves: 雖然好貴，但係好好食 'although it's expensive, it's delicious'."
  explanation: |
    Unlike English, Cantonese normally keeps **both** "although" and "but":
    - 雖然好貴，但係好好食 (seoi1 jin4 hou2 gwai3, daan6 hai6 hou2 hou2 sik6) - Although it's expensive, it's delicious.
    - 雖然佢好忙，但係都會抽時間陪屋企人 - Although he's busy, he still makes time for his family.

    ### "But" words
    | Word | Jyutping | Feel |
    |---|---|---|
    | 但係 | daan6 hai6 | but |
    | 不過 | bat1 gwo3 | but, however (softer) |
    | 可是 | ho2 si6 | but (written) |

    ### 都 for "still"
    The second clause often has 都 "still": 雖然落雨，佢都去咗 "Although it rained, she still went."

    ### Subject position
    雖然 can come before or after the subject: 雖然佢好忙 / 佢雖然好忙.
  examples:
    - { es: "雖然屋細，但係好近港鐵站。", en: "The flat's small, but it's very close to the MTR." }
    - { es: "雖然我唔識佢，不過佢好似好友善。", en: "I don't know him, but he seems very friendly.", altEn: ["I don't know her, but she seems very friendly."] }
    - { es: "佢雖然病咗，都照返工。", en: "Although she was ill, she still went to work.", altEn: ["Although he was ill, he still went to work."] }
    - { es: "呢度好靚，不過有啲遠。", en: "It's lovely here, but a bit far." }
  pitfalls:
    - "Don't drop 但係 / 不過 after 雖然: English uses one word, Cantonese usually two."
    - "不過 in the middle of a sentence is 'but', not 'only'; '不過係…' means 'it's only …'."
  related: [g.gok-dak-opinions, g.concessive-ji-sai, g.zau-syun-even-if]
  drills:
    - { es: "雖然好攰，但係好開心。", en: "Although I'm tired, I'm really happy." }
    - { es: "佢雖然後生，但係好有經驗。", en: "Although she's young, she's very experienced.", altEn: ["Although he's young, he's very experienced."] }
    - { es: "雖然落雨，我哋都去咗行山。", en: "Although it rained, we still went hiking." }

- id: g.jing-goi-should
  level: b1
  title: "應該 - should, ought to (and probably)"
  summary: "應該 + verb means 'should'; it also means 'probably': 你應該休息吓, 佢應該到咗喇。"
  explanation: |
    ### Should (advice, duty)
    - 你應該早啲瞓 (nei5 jing1 goi1 zou2 di1 fan3) - You should go to bed earlier.
    - 我哋應該點做？ - What should we do?
    - 你唔應該噉講 - You shouldn't talk like that.

    ### Probably (expectation)
    - 佢應該到咗喇 (keoi5 jing1 goi1 dou3 zo2 laa3) - He should have arrived by now.
    - 應該冇問題 - There probably won't be a problem.

    ### Strength of advice
    | Phrase | Strength |
    |---|---|
    | 不如… | why not … |
    | 最好… | you'd better … |
    | 應該… | you should … |
    | 一定要… | you must … |

    ### Short answers
    應該係 "probably", 應該唔會 "probably not": 佢會唔會嚟呀？應該會 "Will she come? She should."
  examples:
    - { es: "你應該同佢講清楚。", en: "You should make it clear to him.", altEn: ["You should make it clear to her."] }
    - { es: "我哋係咪應該報警？", en: "Should we call the police?" }
    - { es: "佢應該仲喺公司。", en: "He should still be at the office.", altEn: ["She should still be at the office."] }
    - { es: "聽日應該唔會落雨。", en: "It probably won't rain tomorrow." }
  pitfalls:
    - "唔應該 is 'shouldn't' (a criticism); 應該唔 is 'probably not': 你唔應該去 vs 你應該唔使去."
    - "Don't confuse 應該 'should' with 要 'must': 你應該去 is advice, 你要去 is an instruction."
  related: [g.zeoi-hou-better, g.probability, g.formal-modals]
  drills:
    - { es: "你應該多啲做運動。", en: "You should exercise more." }
    - { es: "佢應該唔知。", en: "He probably doesn't know.", altEn: ["She probably doesn't know."] }
    - { es: "我唔應該咁遲先講。", en: "I shouldn't have left it so late to say so." }
    - { es: "應該冇事嘅。", en: "It should be fine." }

- id: g.bat-jyu-suggest
  level: b1
  title: "不如 - why not, might as well, would rather"
  summary: "不如 + verb suggests an alternative ('why don't we'); A 不如 B means 'A is not as good as B'."
  explanation: |
    ### Suggestion: 不如…啦
    - 不如我哋坐的士啦 (bat1 jyu4 ngo5 dei6 co5 dik1 si2 laa1) - Why don't we take a taxi?
    - 太多人喇，不如走啦 - It's too crowded, let's just leave.

    ### "Might as well": 不如…仲好
    - 與其等，不如行路 (jyu5 kei4 dang2, bat1 jyu4 haang4 lou6) - Rather than wait, we might as well walk.

    ### Comparison: A 不如 B
    A is not as good as B: 我嘅廣東話不如佢 "My Cantonese isn't as good as hers." This is a little formal; 冇…咁好 is more colloquial.

    ### Counter-proposals
    不如 is the polite way to counter someone else's idea:
    | Someone says | You counter |
    |---|---|
    | 我哋食日本菜啦 | 不如食泰國菜啦？ |
  examples:
    - { es: "不如我哋改去聽日啦。", en: "Why don't we move it to tomorrow?" }
    - { es: "與其喺度等，不如入去坐。", en: "Rather than wait here, let's go in and sit down." }
    - { es: "不如你問吓你老細？", en: "Why don't you ask your boss?" }
    - { es: "坐巴士不如坐港鐵快。", en: "The bus isn't as fast as the MTR." }
  pitfalls:
    - "不如 starts the suggestion; it doesn't go after the verb: 不如去飲茶, not 去不如飲茶."
    - "In comparisons 不如 is formal; in conversation 冇…咁 is more natural."
  related: [g.zeoi-hou-better, g.hou-m-hou-suggestions, g.mou-gam-not-as]
  drills:
    - { es: "不如我哋去西貢食海鮮啦。", en: "Why don't we go to Sai Kung for seafood?" }
    - { es: "不如你先走啦。", en: "Why don't you go ahead first?" }
    - { es: "與其買新嘅，不如整返部舊嘅。", en: "Rather than buy a new one, we might as well fix the old one." }

- id: g.jat-bin-while
  level: b1
  title: "一邊…一邊… - doing two things at once"
  summary: "一邊 + verb, 一邊 + verb means 'while': 佢一邊食飯一邊睇電話。"
  explanation: |
    一邊 (jat1 bin1) before each of two verbs shows two actions happening **at the same time**:
    - 佢一邊食飯一邊睇電話 (keoi5 jat1 bin1 sik6 faan6 jat1 bin1 tai2 din6 waa2) - He reads his phone while eating.
    - 我一邊做嘢一邊聽歌 - I listen to music while I work.

    ### Shorter: 邊…邊…
    In fast speech 一 is dropped: 邊食邊傾 "chat while eating".

    ### Background action with 住
    V住 + V2 is another way: 佢笑住講 "she said, smiling" (see 住 in A2).

    ### At work
    Common office uses: 一邊開會一邊覆email, 一邊返工一邊讀書 "work and study at the same time".

    | Pattern | Example |
    |---|---|
    | 一邊A一邊B | 一邊行一邊講 |
    | 邊A邊B | 邊行邊講 |
    | A住B | 行住講 |
  examples:
    - { es: "我一邊返工一邊讀夜校。", en: "I work and go to night school at the same time." }
    - { es: "唔好一邊揸車一邊講電話。", en: "Don't talk on the phone while driving." }
    - { es: "我哋邊食邊傾啦。", en: "Let's talk while we eat." }
    - { es: "佢一邊聽一邊寫低。", en: "She wrote it down as she listened.", altEn: ["He wrote it down as he listened."] }
  pitfalls:
    - "Both actions need 一邊: 佢一邊食飯一邊睇電視, not 佢食飯一邊睇電視."
    - "The subject comes before the first 一邊, not between."
  related: [g.zyu-continuous, g.ge-si-hau]
  drills:
    - { es: "佢一邊沖涼一邊唱歌。", en: "He sings in the shower.", altEn: ["She sings in the shower."] }
    - { es: "我一邊等車一邊睇新聞。", en: "I read the news while waiting for the bus." }
    - { es: "邊做邊學。", en: "Learn as you go." }

- id: g.sin-final
  level: b1
  title: "Sentence-final 先 - first, before anything else"
  summary: "先 at the end of a clause means 'first' (我食咗飯先), and in questions it asks impatiently 'just …?' (你係邊個先？)."
  explanation: |
    Cantonese can put 先 (sin1) **at the end** of the clause, very common in speech:
    - 我食咗飯先 (ngo5 sik6 zo2 faan6 sin1) - I'll eat first.
    - 等我諗吓先 - Let me think first.
    - 你講先 - You speak first.

    ### 先 before the verb vs at the end
    Both mean "first"; the final position is more colloquial:
    | Before the verb | At the end |
    |---|---|
    | 我先走 | 我走先 |
    | 你先講 | 你講先 |

    ### 先至 / 先: only then
    Clause + 先 + verb means "only then": 做完先可以走 "You can only leave once you've finished." 佢十點先到 "He didn't arrive until ten."

    ### Impatient questions
    Question + 先 asks for clarification first: 你係邊個先？ "Who are you, anyway?" 幾錢先？ "How much is it, first of all?"
  examples:
    - { es: "我走先喇，聽日見。", en: "I'm off now, see you tomorrow." }
    - { es: "等我睇吓個價錢先。", en: "Let me check the price first." }
    - { es: "做完份報告先可以放工。", en: "You can only clock off once the report is done." }
    - { es: "你想點先？", en: "So what do you want, then?" }
  pitfalls:
    - "Final 先 comes at the very end of the clause, after the object: 我食咗飯先, not 我食先咗飯."
    - "In 'only then' sentences 先 means 'not until': 佢十點先到 'he didn't arrive until ten', not 'he arrived first at ten'."
  related: [g.sin-zoi-sequence, g.zi-jau-sin-only-if]
  drills:
    - { es: "我去洗手間先。", en: "I'll go to the toilet first." }
    - { es: "你冷靜吓先。", en: "Calm down first." }
    - { es: "佢夜晚十一點先返到屋企。", en: "She didn't get home until 11 pm.", altEn: ["He didn't get home until 11 pm."] }
    - { es: "我走先，拜拜！", en: "I'm off, bye!" }

- id: g.ngaam-ngaam-just
  level: b1
  title: "啱啱 - just (now), exactly"
  summary: "啱啱 + verb means 'have just': 我啱啱到; 啱啱好 means 'just right'."
  explanation: |
    ### Just (a moment ago)
    啱啱 (ngaam1 ngaam1) goes before the verb:
    - 我啱啱到 (ngo5 ngaam1 ngaam1 dou3) - I've just arrived.
    - 佢啱啱出咗去 - She's just gone out.
    - 啱啱開完會 - (I've) just finished a meeting.

    ### Exactly, just right
    - 啱啱好 (ngaam1 ngaam1 hou2) - just right: 杯茶啱啱好 "the tea is just right".
    - 啱啱夠 - just enough: 啱啱夠錢 "just enough money".

    ### 頭先 vs 啱啱
    | Word | Jyutping | Meaning |
    |---|---|---|
    | 啱啱 | ngaam1 ngaam1 | just (very recently) |
    | 頭先 | tau4 sin1 | earlier, a little while ago |
    | 啱 | ngaam1 | correct, right |

    頭先 refers to a time earlier today: 頭先有人搵你 "Someone was looking for you earlier."
  examples:
    - { es: "老細啱啱叫你。", en: "The boss was just looking for you." }
    - { es: "我啱啱食完飯，唔餓。", en: "I've just eaten, I'm not hungry." }
    - { es: "呢對鞋啱啱好。", en: "These shoes fit perfectly." }
    - { es: "頭先有個客打電話嚟。", en: "A client called earlier." }
  pitfalls:
    - "啱啱 goes before the verb: 我啱啱到, not 我到啱啱."
    - "啱 alone means 'right, correct': 你講得啱. Doubled 啱啱 is 'just'."
  related: [g.ji-ging-already, g.zo-perfective]
  drills:
    - { es: "我啱啱收到你個email。", en: "I've just received your email." }
    - { es: "佢啱啱走咗。", en: "He's just left.", altEn: ["She's just left."] }
    - { es: "時間啱啱好。", en: "The timing is just right." }

- id: g.reported-speech
  level: b1
  title: "Reporting what people said - 佢話…, 聽講…"
  summary: "話 introduces what someone said (佢話佢唔嚟); 聽講 / 聽人講 means 'I heard that'; no tense changes are needed."
  explanation: |
    ### 話 (waa6): say
    The everyday verb for reporting speech:
    - 佢話佢聽日唔嚟 (keoi5 waa6 keoi5 ting1 jat6 m4 lai4) - He said he's not coming tomorrow.
    - 天文台話會打風 - The Observatory says a typhoon is coming.

    ### Hearsay
    | Phrase | Jyutping | Meaning |
    |---|---|---|
    | 聽講… | teng1 gong2 | I hear that … |
    | 聽人講… | teng1 jan4 gong2 | people say … |
    | 據講… | geoi3 gong2 | reportedly (more formal) |
    | 佢話… | keoi5 waa6 | he/she says … |

    ### Tell someone: 話畀…知 / 同…講
    - 話畀我知 (waa6 bei2 ngo5 zi1) - tell me
    - 同佢講 (tung4 keoi5 gong2) - tell him, talk to him

    ### No tense shifts
    Cantonese keeps the original time words or changes them only logically: 佢話佢聽日嚟 "He said he would come the next day."

    ### Questions
    佢問我去唔去 "She asked me whether I'm going" - the A-not-A question stays as it is.
  examples:
    - { es: "佢話佢今晚加班。", en: "She said she's working late tonight.", altEn: ["He said he's working overtime tonight."] }
    - { es: "聽講沙田開咗間新商場。", en: "I hear a new mall has opened in Sha Tin." }
    - { es: "你同佢講咗未呀？", en: "Have you told him yet?", altEn: ["Have you told her yet?"] }
    - { es: "佢問我識唔識講普通話。", en: "He asked me if I could speak Mandarin.", altEn: ["She asked me if I could speak Mandarin."] }
  pitfalls:
    - "'Tell someone' is 話畀…知 or 同…講, not 話…: 話畀佢知, not 話佢."
    - "Don't shift tenses as in English; Cantonese has no tenses to shift."
  related: [g.wo5-hearsay, g.giu-someone, g.reporting-verbs]
  drills:
    - { es: "醫生話我要休息三日。", en: "The doctor said I need to rest for three days." }
    - { es: "聽講佢結咗婚。", en: "I hear she got married.", altEn: ["I hear he got married."] }
    - { es: "話畀我知發生咩事。", en: "Tell me what happened." }
    - { es: "佢問我幾時得閒。", en: "She asked me when I'm free.", altEn: ["He asked me when I'm free."] }

- id: g.hai-ge-focus
  level: b1
  title: "係…嘅 - stressing when, where or how"
  summary: "For past events, 係 + detail + verb + 嘅 stresses the circumstances: 我係尋日到嘅 'it was yesterday that I arrived'."
  explanation: |
    When an event is known and you want to focus on **when, where, how, or with whom** it happened, put 係 (hai6) before the detail and 嘅 (ge3) at the end:
    - 我係尋日到嘅 (ngo5 hai6 cam4 jat6 dou3 ge3) - I arrived yesterday (it was yesterday that I arrived).
    - 佢係坐飛機嚟嘅 - He came by plane.
    - 你係喺邊度識佢嘅？ (nei5 hai6 hai2 bin1 dou6 sik1 keoi5 ge3) - Where did you meet her?

    ### In the news
    Very common for reporting details: 宗意外係今朝發生嘅 "The accident happened this morning."

    ### 係 can be dropped
    In casual speech 係 is often left out but 嘅 stays: 你幾時到嘅？ "When did you arrive?"

    ### Negative
    唔係 + detail + verb + 嘅: 我唔係坐車嚟嘅，係行路嚟嘅 "I didn't come by bus, I walked."
  examples:
    - { es: "你係幾時嚟香港㗎？", en: "When did you come to Hong Kong?" }
    - { es: "我係同朋友一齊去嘅。", en: "I went with friends." }
    - { es: "場火係尋晚半夜燒起嘅。", en: "The fire broke out in the middle of last night." }
    - { es: "呢件衫係喺深水埗買嘅。", en: "I bought this top in Sham Shui Po." }
  pitfalls:
    - "Use 係…嘅 for known past events, not for new news: 'a fire broke out' (news) is 有火燭; details then take 係…嘅."
    - "Don't add 咗 inside 係…嘅: 我係尋日到嘅, not 我係尋日到咗嘅."
  related: [g.ge-assertion, g.reported-speech, g.hai6-identity]
  drills:
    - { es: "你係點樣嚟嘅？", en: "How did you get here?" }
    - { es: "我係二零一九年畢業嘅。", en: "I graduated in 2019." }
    - { es: "佢唔係故意嘅。", en: "He didn't do it on purpose.", altEn: ["She didn't do it on purpose."] }
    - { es: "你喺邊度買嘅？", en: "Where did you buy it?" }

- id: g.gwaan-jyu-about
  level: b1
  title: "關於 / 有關 - about, concerning"
  summary: "關於 + topic means 'about': 關於呢件事; 同…有關 means 'related to'."
  explanation: |
    ### 關於 (gwaan1 jyu1): about
    - 關於呢件事，我唔想講 - About this matter, I don't want to talk.
    - 一套關於香港歷史嘅紀錄片 - a documentary about Hong Kong history.

    ### 有關 (jau5 gwaan1): related, concerning
    - 同…有關 (tung4 … jau5 gwaan1): related to: 呢單新聞同環保有關 "This news story is about the environment."
    - 有關部門 - the relevant department (news language).

    ### Everyday alternatives
    In casual speech people often say 講…嘅 "that talks about": 一本講香港嘅書 "a book about Hong Kong".

    | Formality | Example |
    |---|---|
    | casual | 講食嘅節目 |
    | neutral | 關於飲食嘅節目 |
    | news | 有關飲食業嘅報道 |
  examples:
    - { es: "我想問關於租屋嘅問題。", en: "I'd like to ask about renting a flat." }
    - { es: "呢單新聞同交通有關。", en: "This news story is about traffic." }
    - { es: "佢寫咗本講新界歷史嘅書。", en: "He wrote a book about the history of the New Territories.", altEn: ["She wrote a book about the history of the New Territories."] }
    - { es: "有關部門會跟進。", en: "The relevant department will follow up." }
  pitfalls:
    - "關於 phrases come before the noun with 嘅 (關於香港嘅書), or at the start of the sentence, never after the verb as in English."
    - "有關 needs 同 before the topic when it means 'related to': 同天氣有關."
  related: [g.reported-speech, g.relative-ge, g.news-register]
  drills:
    - { es: "關於嗰件事，你點睇？", en: "What's your view on that matter?" }
    - { es: "我睇咗套關於海洋嘅紀錄片。", en: "I watched a documentary about the ocean." }
    - { es: "呢個問題同錢有關。", en: "This problem has to do with money." }

- id: g.story-openers
  level: b1
  title: "Opening and moving a story along"
  summary: "Start with 有一次 / 有一日 / 從前, then move on with 跟住, 之後, 後來 and 突然之間."
  explanation: |
    ### Openers
    | Phrase | Jyutping | Meaning |
    |---|---|---|
    | 有一次 | jau5 jat1 ci3 | once, one time |
    | 有一日 | jau5 jat1 jat6 | one day |
    | 從前 | cung4 cin4 | once upon a time |
    | 記得有一年… | gei3 dak1 jau5 jat1 nin4 | I remember one year … |

    ### Moving on
    | Phrase | Jyutping | Meaning |
    |---|---|---|
    | 跟住 | gan1 zyu6 | then, next |
    | 之後 | zi1 hau6 | after that |
    | 後來 | hau6 loi4 | later on |
    | 突然之間 | dat6 jin4 zi1 gaan1 | suddenly |
    | 點知 | dim2 zi1 | who'd have thought, but then |

    ### 點知: unexpected turn
    點知 (dim2 zi1) introduces something unexpected: 我以為佢唔嚟，點知佢第一個到 "I thought he wouldn't come, but then he was the first to arrive."

    ### Storytelling style
    Spoken stories mix 咗 for events and plain verbs for background, and often end lines with 囉 or 喎 (B2).
  examples:
    - { es: "有一次我喺大埔迷咗路。", en: "Once I got lost in Tai Po." }
    - { es: "跟住我問咗個阿伯點去車站。", en: "Then I asked an old man how to get to the station." }
    - { es: "突然之間落起大雨嚟。", en: "Suddenly it started pouring." }
    - { es: "我以為唔使排隊，點知要等一個鐘。", en: "I thought there'd be no queue, but we had to wait an hour." }
  pitfalls:
    - "後來 is 'later on' in a past story; for a future 'later' use 遲啲: 遲啲再講."
    - "點知 means 'unexpectedly'; as a question 點知？ means 'how do you know?'"
  related: [g.jyun-loi-turns-out, g.git-gwo-finally, g.sin-zoi-sequence]
  drills:
    - { es: "有一日我喺街撞到個舊同學。", en: "One day I bumped into an old classmate in the street." }
    - { es: "後來佢搬咗去英國。", en: "Later he moved to the UK.", altEn: ["Later she moved to the UK."] }
    - { es: "點知架車壞咗。", en: "But then the car broke down." }

- id: g.jyun-loi-turns-out
  level: b1
  title: "原來 - it turns out, so that's why"
  summary: "原來 introduces a discovery: 原來佢係你老公！ 'So he's your husband!'; 原來係噉 'Oh, I see'."
  explanation: |
    原來 (jyun4 loi4) marks **a fact you have just discovered** or a twist in a story:
    - 原來佢係你老公！ (jyun4 loi4 keoi5 hai6 nei5 lou5 gung1) - Oh, so he's your husband!
    - 原來你識講廣東話 - So you can speak Cantonese!
    - 原來係噉 (jyun4 loi4 hai6 gam2) - Oh, I see / so that's how it is.

    ### In stories
    原來 reveals the explanation: 我搵咗成日，原來喺我袋入面 "I looked all day, and it turned out it was in my bag."

    ### 原來 vs 本來
    | Word | Jyutping | Meaning |
    |---|---|---|
    | 原來 | jyun4 loi4 | it turns out (discovery) |
    | 本來 | bun2 loi4 | originally, was going to |

    本來我想去，後來改咗主意 "I was originally going to go, but changed my mind."

    原來 often pairs with the particle 嘅 / 㗎 or 喎: 原來你都係香港人嚟㗎 "So you're from Hong Kong too!"
  examples:
    - { es: "原來你都住喺沙田！", en: "Oh, you live in Sha Tin too!" }
    - { es: "我以為佢嬲我，原來佢唔舒服。", en: "I thought she was angry with me, but it turned out she wasn't well.", altEn: ["I thought he was angry with me, but it turned out he wasn't well."] }
    - { es: "原來係噉，我明喇。", en: "Oh, so that's it. I understand now." }
    - { es: "本來想坐巴士，最後坐咗的士。", en: "I was going to take the bus, but I ended up taking a taxi." }
  pitfalls:
    - "Don't use 原來 for 'originally planned'; that's 本來."
    - "原來 starts the clause it reveals: 原來佢走咗, not 佢原來走咗 (also heard, but weaker)."
  related: [g.story-openers, g.git-gwo-finally, g.wo3-noticing]
  drills:
    - { es: "原來你識佢！", en: "Oh, you know him!", altEn: ["Oh, you know her!"] }
    - { es: "原來今日放假。", en: "It turns out today's a holiday." }
    - { es: "我本來唔想嚟。", en: "I didn't originally want to come." }

- id: g.git-gwo-finally
  level: b1
  title: "結果, 最後, 終於 - how it turned out"
  summary: "結果 'in the end, as a result', 最後 'finally, last', 終於 'at last (after waiting)'."
  explanation: |
    | Word | Jyutping | Meaning | Feel |
    |---|---|---|---|
    | 結果 | git3 gwo2 | in the end, as a result | outcome (often unexpected) |
    | 最後 | zeoi3 hau6 | finally, lastly | last in a sequence |
    | 終於 | zung1 jyu1 | at last | relief after waiting |
    | 到最後 | dou3 zeoi3 hau6 | in the end | after a long process |

    - 等咗兩個鐘，結果佢冇嚟 (dang2 zo2 loeng5 go3 zung1, git3 gwo2 keoi5 mou5 lai4) - I waited two hours, and in the end he didn't come.
    - 我哋終於到咗 (ngo5 dei6 zung1 jyu1 dou3 zo2) - We've finally arrived.
    - 最後我哋去咗食火鍋 - Finally we went for hotpot.

    ### Position
    結果 and 最後 usually start the clause; 終於 goes before the verb (after the subject).

    ### 結果 as a noun
    結果 also means "result": 考試結果 "exam results".
  examples:
    - { es: "佢溫咗好耐書，結果都唔合格。", en: "He studied for ages, but still failed in the end.", altEn: ["She studied for ages, but still failed in the end."] }
    - { es: "我終於搵到工喇！", en: "I've finally found a job!" }
    - { es: "最後，我想多謝大家。", en: "Finally, I'd like to thank everyone." }
    - { es: "到最後我哋都冇去。", en: "In the end we didn't go." }
  pitfalls:
    - "終於 implies a long wait for something wanted; don't use it for bad outcomes: use 結果."
    - "終於 goes after the subject: 佢終於嚟咗, not 終於佢嚟咗 (heard, but weaker)."
  related: [g.story-openers, g.jyun-loi-turns-out]
  drills:
    - { es: "結果我哋錯過咗尾班車。", en: "As a result we missed the last train." }
    - { es: "佢終於答應咗。", en: "She finally agreed.", altEn: ["He finally agreed."] }
    - { es: "最後一個問題。", en: "One last question." }

- id: g.tim-too
  level: b1
  title: "添 - as well, even, on top of that"
  summary: "添 at the end adds 'too, even, on top of that': 佢請咗我食飯，仲送埋禮物添！"
  explanation: |
    添 (tim1) at the **end of the sentence** adds something extra, often with surprise or emphasis:
    - 佢仲會講日文添 (keoi5 zung6 wui5 gong2 jat6 man2 tim1) - She can even speak Japanese!
    - 落埋雨添 - And on top of that it's raining.
    - 再食多碗添 - Have another bowl (on top).

    ### Combined with 仲 and 埋
    添 often pairs with 仲 "also, even" and 埋 "as well": 佢仲請埋我飲嘢添 "She even bought me a drink as well!"

    ### Realising a mistake
    添 also expresses "oh no, I've just realised": 唔記得帶銀包添！ "Oh no, I forgot my wallet!" 死喇，遲咗添 "Oh no, I'm late!"

    | Use | Example |
    |---|---|
    | additional, even | 佢識煮飯添 |
    | another one | 要多杯添 |
    | oh no! | 漏咗手機添 |
  examples:
    - { es: "盆菜好好食，仲有鮑魚添！", en: "The poon choi is delicious, and there's even abalone!" }
    - { es: "我唔記得帶遮添！", en: "Oh no, I forgot my umbrella!" }
    - { es: "要多碗飯添，唔該。", en: "One more bowl of rice, please." }
    - { es: "佢唔單止識，仲教埋我添。", en: "He didn't just know, he even taught me.", altEn: ["She didn't just know, she even taught me."] }
  pitfalls:
    - "添 goes at the very end of the sentence, not after the verb in the middle."
    - "添 with a mistake ('oh no!') is common; don't read it as 'too' in 唔記得添."
  related: [g.zung-still, g.maai-closer, g.ge-assertion]
  drills:
    - { es: "佢仲識跳舞添。", en: "She can even dance!", altEn: ["He can even dance!"] }
    - { es: "漏咗鎖匙添！", en: "Oh no, I've left my keys behind!" }
    - { es: "飲多杯添啦。", en: "Have one more drink." }

- id: g.ge-assertion
  level: b1
  title: "Sentence-final 嘅 - it's like that, for sure"
  summary: "嘅 (ge3) at the end makes a statement sound certain and explanatory: 佢會嚟嘅 'he will come, I'm sure'."
  explanation: |
    At the end of a sentence 嘅 (ge3) presents something as **a settled fact** or the way things are:
    - 佢會嚟嘅 (keoi5 wui5 lai4 ge3) - He'll come, don't worry.
    - 冇問題嘅 (mou5 man6 tai4 ge3) - It'll be fine.
    - 盆菜係要一齊食嘅 - Poon choi is meant to be eaten together.

    ### Customs and rules
    嘅 is perfect for explaining how things are done: 過年要派利是嘅 "At New Year you give red packets."

    ### 嘅 vs 㗎
    㗎 (gaa3) is 嘅 + 呀 fused, more emphatic and explanatory, and also used in questions (B2): 好貴㗎 "It's really expensive, you know."

    ### Reassurance
    唔會嘅 (m4 wui5 ge3) "No way, that won't happen", 得嘅 "It'll work".
  examples:
    - { es: "放心，佢識路嘅。", en: "Don't worry, he knows the way.", altEn: ["Don't worry, she knows the way."] }
    - { es: "圍村過年要拜祖先嘅。", en: "In walled villages people worship their ancestors at New Year." }
    - { es: "我唔會話畀人知嘅。", en: "I won't tell anyone, I promise." }
    - { es: "呢度啲人好好人嘅。", en: "The people here are really nice." }
  pitfalls:
    - "Sentence-final 嘅 is not possession: 佢會嚟嘅 has nothing to do with 'his'."
    - "Don't overuse it: a plain statement without 嘅 is fine when you're just reporting."
  related: [g.hai-ge-focus, g.gaa3-explaining, g.ge-possessive]
  drills:
    - { es: "冇事嘅。", en: "It's all right." }
    - { es: "佢一定會鍾意嘅。", en: "She'll definitely like it.", altEn: ["He'll definitely like it."] }
    - { es: "呢度啲嘢好貴嘅。", en: "Things here are pricey." }

- id: g.jau-dak-chance
  level: b1
  title: "有得 / 冇得 - there's a chance to, you can't"
  summary: "有得 + verb means 'there's the opportunity to' (有得食), 冇得 + verb 'there's no way to' (冇得揀)."
  explanation: |
    有得 (jau5 dak1) and 冇得 (mou5 dak1) before a verb describe whether the **opportunity** exists:
    - 今晚有得食盆菜 (gam1 maan5 jau5 dak1 sik6 pun4 coi3) - We get to have poon choi tonight.
    - 冇得揀 (mou5 dak1 gaan2) - There's no choice.
    - 呢度有冇得泊車呀？ - Is there parking here?

    ### Common phrases
    | Phrase | Meaning |
    |---|---|
    | 有得賣 | it's on sale (available) |
    | 冇得傾 | no negotiation, non-negotiable |
    | 冇得頂 | unbeatable, fantastic (slang) |
    | 有得玩 | there's fun to be had |

    ### Compare 可以
    可以 asks for permission; 有冇得 asks whether the thing is available: 有冇得退錢？ "Is there a refund?" vs 可唔可以退錢？ "Can you give me a refund?"
  examples:
    - { es: "太平清醮嗰日有得食平安包。", en: "On the day of the festival you get to eat peace buns." }
    - { es: "呢個價錢冇得傾。", en: "This price isn't negotiable." }
    - { es: "呢度有冇得買飛呀？", en: "Can you buy tickets here?" }
    - { es: "已經冇得返轉頭。", en: "There's no going back now." }
  pitfalls:
    - "有得 + verb is about opportunity, not possession: 有得食 'there's food to eat', not 'have food'."
    - "冇得頂 is praise ('unbeatable'), not 'can't stand it'."
  related: [g.jau-have, g.potential-complements, g.ho-ji-can-may]
  drills:
    - { es: "圍村有冇得參觀呀？", en: "Can you visit the walled village?" }
    - { es: "冇得揀喇。", en: "There's no choice." }
    - { es: "呢間嘢嘅點心真係冇得頂！", en: "This place's dim sum is unbeatable!" }

- id: g.ge-waa-conditional
  level: b1
  title: "…嘅話 - if, in case"
  summary: "嘅話 closes the 'if' clause: (如果)落雨嘅話，我哋就唔去。"
  explanation: |
    嘅話 (ge3 waa2) at the **end of a condition** means "if (that's the case)". It is very common in speech, with or without 如果 / 要係 at the start:
    - 落雨嘅話，我哋就唔去 (lok6 jyu5 ge3 waa2, ngo5 dei6 zau6 m4 heoi3) - If it rains, we won't go.
    - 如果你攰嘅話，就唞吓啦 - If you're tired, take a break.
    - 得閒嘅話，嚟搵我 - Come and see me if you're free.

    ### Frame: 如果…嘅話，…就…
    | Part | Word |
    |---|---|
    | start | 如果 / 要係 (optional) |
    | end of condition | 嘅話 |
    | result | (subject) 就 + verb |

    ### Unlikely conditions
    假如 (gaa2 jyu4) and 萬一 (maan6 jat1) "in case, if by any chance": 萬一迷路嘅話，打電話畀我 "If you happen to get lost, call me."
  examples:
    - { es: "天氣好嘅話，我哋去西貢行山。", en: "If the weather is good, we'll go hiking in Sai Kung." }
    - { es: "萬一打風嘅話，活動會取消。", en: "If there's a typhoon, the event will be cancelled." }
    - { es: "你唔鍾意嘅話，唔使勉強。", en: "If you don't like it, don't force yourself." }
    - { es: "要係唔夠時間嘅話，就坐的士啦。", en: "If there isn't enough time, take a taxi." }
  pitfalls:
    - "嘅話 ends the condition; don't put it after the result."
    - "The 嘅話 clause comes first, like all conditions in Cantonese."
  related: [g.jyu-gwo-zau, g.zau-syun-even-if, g.formal-conditionals]
  drills:
    - { es: "太熱嘅話，就唔好去。", en: "If it's too hot, don't go." }
    - { es: "有問題嘅話，隨時搵我。", en: "If there's any problem, contact me any time." }
    - { es: "萬一落雨嘅話，我哋改期。", en: "If by any chance it rains, we'll reschedule." }

- id: g.zau-syun-even-if
  level: b1
  title: "就算…都… - even if"
  summary: "就算 + condition, (subject) 都 + result means 'even if … still …': 就算落雨，我都去。"
  explanation: |
    就算 (zau6 syun3) introduces a condition that **won't change** the result. The result clause takes 都 (dou1):
    - 就算落雨，我都去 (zau6 syun3 lok6 jyu5, ngo5 dou1 heoi3) - Even if it rains, I'll still go.
    - 就算佢道歉，我都唔會原諒佢 - Even if he apologises, I won't forgive him.

    ### Negative result
    就算…都唔… : 就算畀錢我，我都唔做 "Even if you paid me, I wouldn't do it."

    ### Other "even if" words
    | Word | Jyutping | Register |
    |---|---|---|
    | 就算 | zau6 syun3 | everyday |
    | 即使 | zik1 si2 | formal (B2) |
    | 哪怕 | naa5 paa3 | formal, Mandarin-influenced |

    ### Compare 雖然
    雖然 "although" is about a fact; 就算 "even if" about a hypothesis.
  examples:
    - { es: "就算好攰，我都會行到山頂。", en: "Even if I'm tired, I'll make it to the summit." }
    - { es: "就算你唔講，我都知。", en: "Even if you don't say it, I know." }
    - { es: "就算平，我都唔會買。", en: "Even if it's cheap, I won't buy it." }
    - { es: "就算遲到，都要去。", en: "Even if we're late, we have to go." }
  pitfalls:
    - "Don't forget 都 in the second clause: 就算落雨，我都去, not 就算落雨，我去."
    - "都 goes after the subject of the second clause: 我都去, not 都我去."
  related: [g.seoi-jin-daan-hai, g.ge-waa-conditional, g.concessive-ji-sai]
  drills:
    - { es: "就算唔夠錢，我都想去。", en: "Even if I don't have enough money, I want to go." }
    - { es: "就算佢唔嚟，我哋都照去。", en: "Even if he doesn't come, we'll go anyway.", altEn: ["Even if she doesn't come, we'll go anyway."] }
    - { es: "就算係朋友，都要講道理。", en: "Even friends have to be reasonable." }

- id: g.probability
  level: b1
  title: "How sure? - 一定, 應該, 可能, 唔一定, 或者"
  summary: "Rank certainty from 一定 'definitely' through 應該 'probably' and 可能 'maybe' to 唔一定 'not necessarily'."
  explanation: |
    | Word | Jyutping | Certainty |
    |---|---|---|
    | 一定 | jat1 ding6 | definitely, must be |
    | 梗係 | gang2 hai6 | of course (colloquial) |
    | 應該 | jing1 goi1 | probably, should |
    | 可能 | ho2 nang4 | maybe, possibly |
    | 或者 | waak6 ze2 | perhaps; or |
    | 唔一定 | m4 jat1 ding6 | not necessarily |
    | 唔會 | m4 wui5 | won't, can't be |

    - 聽日一定好熱 - It'll definitely be hot tomorrow.
    - 佢可能遲到 (keoi5 ho2 nang4 ci4 dou3) - He might be late.
    - 唔一定啱 - Not necessarily right.

    ### Position
    All of these go before the verb (or at the start of the sentence for 可能 and 或者).

    ### 或者 also means "or"
    In statements 或者 means "or": 星期六或者星期日都得 "Saturday or Sunday are both fine." In questions, "or" is 定係 (ding6 hai6): 你飲茶定係咖啡？
  examples:
    - { es: "山頂可能有霧。", en: "There might be fog on the summit." }
    - { es: "佢一定識路，佢成日嚟。", en: "He definitely knows the way, he comes here all the time.", altEn: ["She definitely knows the way, she comes here all the time."] }
    - { es: "或者我哋行另一條路啦。", en: "Maybe we should take another trail." }
    - { es: "貴唔一定好。", en: "Expensive isn't necessarily good." }
  pitfalls:
    - "In questions 'or' is 定係, not 或者: 你要茶定係咖啡？"
    - "一定 can mean 'must' (obligation) or 'definitely' (certainty): 你一定要嚟 vs 佢一定喺度."
  related: [g.jing-goi-should, g.wui-will, g.hedging]
  drills:
    - { es: "今晚可能會落雨。", en: "It might rain tonight." }
    - { es: "佢應該已經到咗。", en: "She's probably arrived already.", altEn: ["He's probably arrived already."] }
    - { es: "你飲咖啡定係茶呀？", en: "Would you like coffee or tea?" }
    - { es: "唔一定要今日做。", en: "It doesn't have to be done today." }

- id: g.wai-zo-purpose
  level: b1
  title: "為咗 - in order to, for the sake of"
  summary: "為咗 + goal states the purpose: 為咗學廣東話，我搬咗嚟香港。"
  explanation: |
    為咗 (wai6 zo2) means "in order to / for (the sake of)". The purpose usually comes **first**:
    - 為咗學廣東話，我搬咗嚟香港 (wai6 zo2 hok6 gwong2 dung1 waa2, ngo5 bun1 zo2 lai4 hoeng1 gong2) - I moved to Hong Kong to learn Cantonese.
    - 佢為咗屋企人好努力工作 - He works hard for his family.

    ### Purpose after the verb: 去 / 嚟
    For simple purposes, Cantonese just strings verbs: 我嚟香港讀書 "I came to Hong Kong to study." 為咗 adds emphasis.

    ### So that: 等 / 好等
    等 (dang2) + clause "so that": 講慢啲，等佢聽得明 "Speak slowly so he can understand."

    ### Asking why
    你為咗乜嘢…？ / 為乜…？ (wai6 mat1) "What for?": 你為乜要咁辛苦？ "Why make it so hard on yourself?"
  examples:
    - { es: "為咗儲錢，我而家好少出街食飯。", en: "To save money, I rarely eat out these days." }
    - { es: "佢為咗個女搬去咗大埔。", en: "She moved to Tai Po for her daughter's sake.", altEn: ["He moved to Tai Po for his daughter's sake."] }
    - { es: "早啲出門口，等唔使趕。", en: "Leave early so you don't have to rush." }
    - { es: "你為乜要轉工呀？", en: "Why do you want to change jobs?" }
  pitfalls:
    - "Don't put 為咗 at the end like English 'in order to': 為咗健康，我日日跑步, not 我日日跑步為咗健康 (heard, but less natural)."
    - "For simple purposes, plain verb series are more natural than 為咗: 我去超市買嘢."
  related: [g.serial-verbs, g.hei-mong-hope, g.wan-lo-use]
  drills:
    - { es: "為咗健康，我戒咗煙。", en: "I quit smoking for my health." }
    - { es: "佢為咗份工學普通話。", en: "He's learning Mandarin for his job.", altEn: ["She's learning Mandarin for her job."] }
    - { es: "講大聲啲，等大家聽到。", en: "Speak up so everyone can hear." }

- id: g.hei-mong-hope
  level: b1
  title: "希望, 想, 夢想 - hopes and dreams"
  summary: "希望 + clause 'hope that', 想 + verb 'want to', 夢想係… 'my dream is …'."
  explanation: |
    | Word | Jyutping | Meaning |
    |---|---|---|
    | 希望 | hei1 mong6 | hope (that) |
    | 想 | soeng2 | want to, would like to |
    | 夢想 | mung6 soeng2 | dream (ambition) |
    | 計劃 | gai3 waak6 | plan |
    | 將來 | zoeng1 loi4 | in future |

    ### 希望 + whole clause
    希望 can be followed by a complete sentence, with its own subject:
    - 我希望你早日康復 (ngo5 hei1 mong6 nei5 zou2 jat6 hong1 fuk6) - I hope you get well soon.
    - 希望聽日唔好落雨 - Hopefully it won't rain tomorrow.

    ### Talking about the future
    - 我將來想做老師 - In future I'd like to be a teacher.
    - 我嘅夢想係環遊世界 - My dream is to travel the world.

    ### Wishes at festivals
    New Year greetings are wishes without a verb: 身體健康 "good health", 心想事成 "may all your wishes come true".
  examples:
    - { es: "我希望有一日可以喺新界買屋。", en: "I hope one day I can buy a house in the New Territories." }
    - { es: "你將來想做乜嘢呀？", en: "What do you want to do in future?" }
    - { es: "希望大家玩得開心！", en: "I hope you all have a great time!" }
    - { es: "佢嘅夢想係開間咖啡店。", en: "Her dream is to open a café.", altEn: ["His dream is to open a café."] }
  pitfalls:
    - "希望 takes a clause directly; don't add 'that': 我希望你嚟, not 我希望係你嚟."
    - "想 is 'want to'; for a long-term dream, 夢想 or 希望 sounds more serious."
  related: [g.daa-syun-plans, g.wai-zo-purpose]
  drills:
    - { es: "希望你鍾意。", en: "I hope you like it." }
    - { es: "我將來想去外國讀書。", en: "In future I want to study abroad." }
    - { es: "我嘅夢想係做歌手。", en: "My dream is to be a singer." }

- id: g.zung-still
  level: b1
  title: "仲 - still, even more, also"
  summary: "仲 before a verb means 'still' (仲未), 'also' (仲有) or 'even more' with comparisons (仲貴): a key Cantonese adverb."
  explanation: |
    仲 (zung6) goes **before the verb or adjective** and has three main uses:

    ### Still
    - 佢仲喺度 (keoi5 zung6 hai2 dou6) - He's still here.
    - 我仲未食 - I still haven't eaten.

    ### In addition: 仲有 / 仲…添
    - 仲有冇問題呀？ - Any more questions?
    - 佢識煮飯，仲識整蛋糕 - She can cook, and she can bake too.

    ### Even more (comparisons)
    - 呢間仲貴 (ni1 gaan1 zung6 gwai3) - This one is even more expensive.
    - 今日仲熱過尋日 - Today is even hotter than yesterday.

    ### 仲 vs 都
    | Word | Meaning |
    |---|---|
    | 仲 | still; moreover; even more |
    | 都 | also (same as someone else); all |

    我仲想去 "I still want to go"; 我都想去 "I want to go too."
  examples:
    - { es: "已經十二點，你仲未瞓？", en: "It's already twelve and you're still not in bed?" }
    - { es: "我仲有一個問題。", en: "I have one more question." }
    - { es: "佢嘅計劃仲好過我嘅。", en: "His plan is even better than mine.", altEn: ["Her plan is even better than mine."] }
    - { es: "我哋仲要等幾耐呀？", en: "How much longer do we have to wait?" }
  pitfalls:
    - "仲 for 'still' goes before the verb: 佢仲喺度, not 佢喺度仲."
    - "Don't use 仲 when you mean 'too, like someone else': 'me too' is 我都係, not 我仲係."
  related: [g.tim-too, g.dou-also, g.mei-questions]
  drills:
    - { es: "我仲記得嗰日。", en: "I still remember that day." }
    - { es: "仲有冇其他嘢呀？", en: "Is there anything else?" }
    - { es: "今日仲凍。", en: "Today is even colder." }
    - { es: "佢仲細，唔明嘅。", en: "She's still little, she doesn't understand.", altEn: ["He's still little, he doesn't understand."] }
