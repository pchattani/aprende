id: r.c2.uma-noite-de-fado
level: c2
title: "Conversa com uma fadista em Alfama"
kind: dialogue
intro: "A Brazilian podcaster, Lucas, talks to Rosa, a fado singer, in a small tasca in Alfama before her evening set. Rosa speaks European Portuguese — tu with its own verb forms, estar a + infinitive, enclisis (diz-me, chamo-lhe), the imperfect for politeness (queria, podia) — while Lucas keeps his Brazilian você. Notice how both adapt, and how they talk about saudade without ever quite defining it."
allow: [camões, rosa, lucas, alfama, lisboa, amália, rodrigues, mouraria, severa, tejo, brasil, são, paulo, coimbra, unesco, porto]
paragraphs:
  - { es: "LUCAS: Rosa, muito obrigado por me receber aqui antes do show. Posso te tratar por você ou prefere que eu fale de outro jeito? ROSA: Trata-me por tu, que aqui em Alfama ninguém se trata por você, a não ser nas finanças! (risos) E não lhe chames show, por favor. Isto é uma noite de fado. Um show tem palco e luzes; aqui temos uma sala pequena, uma guitarra portuguesa, uma viola e silêncio. Sobretudo silêncio.", en: "LUCAS: Rosa, thank you so much for having me here before the show. Can I call you você or would you prefer I spoke differently? ROSA: Call me tu — here in Alfama nobody calls anyone você, except at the tax office! (laughs) And don't call it a show, please. This is a fado night. A show has a stage and lights; here we have a small room, a Portuguese guitar, a classical guitar and silence. Above all, silence." }
  - { es: "LUCAS: Por que o silêncio é tão importante? No Brasil, num samba, todo mundo canta junto, bate palma… ROSA: Pois, e ainda bem! Mas o fado é outra coisa. Quando a fadista canta, ninguém fala, ninguém come, os empregados param de servir. Se alguém se põe a conversar, há sempre uma senhora que se vira e diz “Silêncio, que se vai cantar o fado!”. É quase uma regra sagrada. O fado conta uma história a cada pessoa da sala, e para a ouvires tens de estar calado.", en: "LUCAS: Why is silence so important? In Brazil, at a samba, everyone sings along, claps… ROSA: Exactly, and a good thing too! But fado is something else. When the fadista sings, nobody talks, nobody eats, the waiters stop serving. If someone starts chatting, there's always a lady who turns round and says 'Silence, fado is about to be sung!' It's almost a sacred rule. Fado tells a story to each person in the room, and to hear it you have to be quiet." }
  - { es: "LUCAS: Como você começou… quer dizer, como começaste a cantar? ROSA: (risos) Estás a aprender depressa! Comecei miúda, aqui mesmo, nesta rua. A minha avó cantava enquanto estendia a roupa, e eu ficava a ouvi-la da janela. Aos catorze anos, um senhor que tinha uma casa de fados ouviu-me numa festa dos Santos Populares e disse à minha mãe: “Esta miúda tem a voz partida no sítio certo.” Nunca mais me esqueci daquilo.", en: "LUCAS: How did you start… I mean, how did you start singing? ROSA: (laughs) You're learning fast! I started as a little girl, right here, in this street. My grandmother used to sing while she hung out the washing, and I'd listen to her from the window. At fourteen, a man who owned a fado house heard me at a festa of the Santos Populares and told my mother: 'This girl's voice breaks in exactly the right place.' I've never forgotten that." }
  - { es: "LUCAS: Todo mundo diz que o fado é a música da saudade. Você… tu consegues explicar o que é saudade para quem não fala português? ROSA: Olha, já me fizeram essa pergunta mil vezes e nunca dei a mesma resposta duas vezes. Não é só tristeza, nem só nostalgia. É sentir a falta de alguém ou de alguma coisa e, ao mesmo tempo, gostar de sentir essa falta, porque é a prova de que aquilo existiu. Há quem diga que é uma dor que sabe bem. Eu chamo-lhe a presença de uma ausência.", en: "LUCAS: Everyone says fado is the music of saudade. Can you explain what saudade is to someone who doesn't speak Portuguese? ROSA: Look, I've been asked that question a thousand times and I've never given the same answer twice. It isn't just sadness, or just nostalgia. It's missing someone or something and, at the same time, liking that feeling of missing, because it's proof that it existed. Some people say it's a pain that feels good. I call it the presence of an absence." }
  - { es: "LUCAS: E no Brasil a gente também tem saudade, mas acho que é mais leve. Dizemos “que saudade!” de um amigo que não vemos há uma semana. ROSA: Eu sei, e acho uma ternura! Os brasileiros usam a palavra com mais alegria. Nós, cá, carregamo-la com mais peso, se calhar porque passámos séculos a ver os homens partir para o mar, para África, para o Brasil, para França. Quase todas as famílias portuguesas têm alguém que partiu. O fado nasceu nesses portos, entre quem ficava e quem ia.", en: "LUCAS: In Brazil we have saudade too, but I think it's lighter. We say 'que saudade!' about a friend we haven't seen for a week. ROSA: I know, and I find it sweet! Brazilians use the word more cheerfully. We here carry it with more weight, maybe because we spent centuries watching the men leave for the sea, for Africa, for Brazil, for France. Almost every Portuguese family has someone who left. Fado was born in those ports, between those who stayed and those who went." }
  - { es: "LUCAS: E a Amália Rodrigues? No Brasil, quem conhece um nome do fado conhece o dela. ROSA: A Amália é a nossa rainha, e não há fadista que não lhe deva alguma coisa. Foi ela que levou o fado de Alfama para o mundo, e foi ela que se atreveu a cantar grandes poetas, até Camões, quando muita gente achava que o fado era coisa de tasca. Eu cresci a ouvir os discos dela na cozinha da minha avó. Ainda hoje, antes de entrar, digo-lhe baixinho: “Dá-me força, Amália.”", en: "LUCAS: And Amália Rodrigues? In Brazil, anyone who knows one name in fado knows hers. ROSA: Amália is our queen, and there's no fadista who doesn't owe her something. She was the one who took fado from Alfama to the world, and she dared to sing great poets, even Camões, when many people thought fado was tavern stuff. I grew up listening to her records in my grandmother's kitchen. Even today, before I go on, I whisper to her: 'Give me strength, Amália.'" }
  - { es: "LUCAS: Hoje o fado é Património da Humanidade e lota salas no mundo inteiro. Isso mudou alguma coisa aqui no bairro? ROSA: Mudou muito, e nem tudo para melhor. Há mais turistas, o que é bom para quem vive da música, mas as rendas subiram tanto que muitos vizinhos tiveram de sair. Às vezes canto para uma sala onde ninguém percebe uma palavra, e mesmo assim há pessoas a chorar. Isso comove-me. Mas também me preocupa que um dia Alfama tenha fado e já não tenha alfacinhas.", en: "LUCAS: Today fado is World Heritage and fills venues all over the world. Has that changed anything here in the neighbourhood? ROSA: A lot, and not all for the better. There are more tourists, which is good for those who live from music, but rents have gone up so much that many neighbours have had to leave. Sometimes I sing to a room where nobody understands a word, and even so there are people crying. That moves me. But it also worries me that one day Alfama will have fado and no longer have any Lisboetas." }
  - { es: "LUCAS: Para terminar, que fado você… que fado vais cantar hoje? ROSA: Vou abrir com um fado antigo, da Mouraria, e acabar com um que escrevi para a minha avó. Mas não te digo mais nada, que senão estragava a surpresa. Fica até ao fim, está bem? E, por favor, desliga o telemóvel. LUCAS: Celular desligado, prometo. ROSA: Celular, telemóvel, tanto faz, desde que não toque! Agora cala-te, que a guitarra já se está a afinar.", en: "LUCAS: To finish, which fado are you going to sing tonight? ROSA: I'm going to open with an old fado from Mouraria and finish with one I wrote for my grandmother. But I won't tell you any more, or I'd spoil the surprise. Stay till the end, OK? And please switch off your phone. LUCAS: Phone switched off, I promise. ROSA: Celular, telemóvel, whatever, as long as it doesn't ring! Now hush, the guitar's already tuning up." }
questions:
  - { q: "Porque é que Rosa não quer que se chame “show” à noite de fado?", options: ["Porque é uma palavra brasileira", "Porque os bilhetes são caros", "Porque o fado não tem palco nem luzes, mas uma sala pequena e silêncio", "Porque ela não gosta de cantar"], answer: 2, explain: "For Rosa a show has a stage and lights; a fado night is intimate, built on silence." }
  - { q: "Que regra existe durante o fado?", options: ["Ninguém fala nem come, e os empregados param de servir", "Todos devem bater palmas", "Só se pode beber vinho do Porto", "O público deve cantar o refrão"], answer: 0, explain: "'Silêncio, que se vai cantar o fado!' — silence is almost sacred." }
  - { q: "Como Rosa define a saudade?", options: ["Como pura tristeza", "Como a presença de uma ausência: sentir a falta e gostar de a sentir", "Como alegria", "Como medo do futuro"], answer: 1, explain: "She calls it 'a presença de uma ausência' — a pain that feels good because it proves what was lost existed." }
  - { q: "Que diferença Rosa vê entre a saudade portuguesa e a brasileira?", options: ["Os brasileiros não conhecem a palavra", "Não há diferença", "Os brasileiros usam-na com mais leveza; os portugueses carregam-na com mais peso, por causa da emigração", "Os portugueses usam-na só para pessoas mortas"], answer: 2, explain: "Centuries of emigration, she suggests, gave the Portuguese word more weight." }
  - { q: "O que preocupa Rosa no bairro?", options: ["O excesso de silêncio", "Que as rendas expulsem os moradores e Alfama fique com fado mas sem lisboetas", "A falta de turistas", "A qualidade das guitarras"], answer: 1, explain: "Rising rents push neighbours out; she fears 'Alfama tenha fado e já não tenha alfacinhas' (Lisboetas)." }
  - { q: "Que construção europeia aparece em “a guitarra já se está a afinar”?", options: ["Estar a + infinitivo para uma ação em curso", "Mesóclise", "Futuro do conjuntivo", "Infinitivo pessoal"], answer: 0, explain: "Estar a afinar = Brazilian está afinando. Note also the clitic se attracted before the verb by já." }
