    model: { es: "除咗包山之外，仲有飄色巡遊同北帝廟嘅儀式。醮期間成個島都食齋，連餐廳都淨係賣齋菜。除此之外，你仲可以試吓街邊攤檔嘅小食，例如糯米糍同平安包。", en: "Apart from the bun towers, there's the float parade and the ceremonies at the Pak Tai Temple. During the festival the whole island eats vegetarian; even restaurants only sell vegetarian food. Besides that, you can try snacks from the street stalls, like glutinous rice balls and lucky buns." }
