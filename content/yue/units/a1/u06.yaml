        grammar: [g.prices-gei-do-cin]
        vocab: [w.baak6-coi3, w.gan1]
      - q: { es: "老闆，啲生果新唔新鮮呀？", en: "Boss, is the fruit fresh?" }
        a: { es: "好新鮮，今朝先到㗎！", en: "Very fresh, it only came in this morning!" }
        alt: ["好新鮮！", "新鮮呀。"]
        grammar: [g.a-not-a-questions]
        vocab: [w.lou5-baan2, w.saang1-gwo2, w.san1-sin1]
      - q: { es: "得唔得呀？", en: "Is that OK?" }
