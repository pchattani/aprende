id: r.c2.songs-of-the-pearl-river
level: c2
title: 珠江上嘅粵謳
kind: literature
author: 招子庸 Zhao Ziyong (1786–1847)
source: "招子庸《粵謳》 (Guangzhou, 1828): the opening lines of 〈解心事〉 and of 〈吊秋喜〉, quoted exactly. Public domain. The river-cruise framing and the colloquial explanations are written for this course."
intro: "On an evening cruise on the Pearl River, a retired literature teacher tells a group of friends about the 粵謳, the 'Cantonese songs' Zhao Ziyong published in 1828, one of the first books of literature written largely in colloquial Cantonese. She quotes the openings of two songs and explains how they mix classical diction with everyday words like 唔, 咁 and 係."
allow: [招子庸, 粵謳, 解心事, 吊秋喜, 秋喜, 南海, 山東, 金禧, 蘇老師, 金文泰, cecil, clementi, cantonese, love-songs]
paragraphs:
  - { es: "夜晚八點，珠江夜遊嘅船由天字碼頭開出。兩邊嘅大廈燈光閃閃，遠處嘅廣州塔不停變色。船上面一班退休老師飲緊茶，其中蘇老師以前教咗三十年中文。佢望住江面，話：「你哋知唔知，兩百年前呢條江上面泊滿花艇，夜夜笙歌，有人喺度寫低咗廣東話最早嘅文學作品之一？」", en: "At eight in the evening the Pearl River night cruise sets off from Tianzi Pier. The towers on both banks glitter, and in the distance Canton Tower keeps changing colour. On board, a group of retired teachers are drinking tea; one of them, Ms So, taught Chinese for thirty years. Gazing at the water, she says: 'Do you know that two hundred years ago this river was crowded with flower boats, with music and singing every night, and someone wrote down one of the earliest works of literature in Cantonese here?'" }
  - { es: "「佢叫招子庸，廣東南海人，中過舉人，喺山東做過官，又識畫畫，特別擅長畫竹同畫蟹。不過佢最出名嘅，係一本叫《粵謳》嘅書，一八二八年喺廣州出版。『謳』即係歌，『粵謳』就係廣東人嘅歌。當年珠江上面啲花艇有好多歌女，佢哋唱嘅歌，好多都係講愛情、講離別、講自己命苦。招子庸聽得多，就用佢哋嘅腔調，自己寫咗過百首。」", en: "'His name was Zhao Ziyong, from Nanhai in Guangdong. He passed the provincial examination, served as an official in Shandong, and could paint too – he was especially good at bamboo and crabs. But what he's most famous for is a book called Yuet Au, published in Guangzhou in 1828. 謳 means song, so 粵謳 means \"songs of the Cantonese\". In those days the flower boats on the Pearl River had many singing girls, and many of their songs were about love, parting and their own bitter fate. Zhao Ziyong heard so many of them that he wrote more than a hundred himself in their style.'" }
  - { es: "有個老師問：「咁佢用書面語定口語寫㗎？」蘇老師話：「兩樣都有，呢個就係最得意嘅地方。佢一時用好文雅嘅字，一時又用『唔』、『咁』、『佢』、『嘅』，好似我哋而家講嘢噉。嗰陣讀書人寫嘢，一定用文言文，用廣東話寫書，好多人會覺得唔登大雅之堂。但係招子庸偏偏就噉做。我讀兩段畀你哋聽。」", en: "One of the teachers asks: 'So did he write in written Chinese or in colloquial Cantonese?' Ms So says: 'Both – that's the most interesting thing about it. One moment he uses very refined words, the next he uses 唔, 咁, 佢 and 嘅, just like the way we talk now. In those days scholars always wrote in Classical Chinese, and many people thought writing a book in Cantonese was beneath serious literature. But Zhao Ziyong did it anyway. Let me read you two passages.'" }
  - { es: "〈解心事〉（開首） ／ 心各有事，總要解脫為先。心事唔安，解得就了然。苦海茫茫，多半是命蹇。但向苦中尋樂，便是神仙。", en: "'Unburdening the Heart' (opening) / Every heart has its troubles; the first thing is to set them free. / When troubles leave the heart uneasy, untie them and all becomes clear. / The sea of bitterness is vast, mostly because fate is harsh; / but seek joy within the bitterness, and you are an immortal." }
  - { es: "蘇老師解釋：「每個人心入面都有心事，最緊要係放得低。心事令你唔安樂，你解得開，就乜都清楚晒。人生好似一個苦海，好多時都係命唔好。但係如果你識得喺苦入面搵開心，你就好似神仙咁自在。你聽吓：『是』、『便是』、『尋樂』，都係好文雅嘅書面語；但係中間有個『唔安』嘅『唔』，一聽就知係廣東話。呢種文白夾雜，就係粵謳嘅特色。」", en: "Ms So explains: 'Everyone has worries in their heart; the most important thing is to be able to let them go. If your worries make you uneasy and you can untie them, everything becomes clear. Life is like a sea of bitterness, often because of bad luck. But if you know how to find happiness within the bitterness, you'll be as carefree as an immortal. Listen: 是, 便是, 尋樂 are very refined written words, but in the middle there's the 唔 of 唔安, and you know immediately it's Cantonese. This mixture of classical and colloquial is the hallmark of the Yuet Au.'" }
  - { es: "「仲有，佢用嘅字讀落好有節奏，四個字、五個字一組，好似唱南音噉，有板有眼。你用普通話讀，就完全冇咗嗰種味道，因為佢本來就係寫畀人用廣東話唱嘅。」", en: "'Also, his words have a strong rhythm when you read them aloud, in groups of four or five characters, like singing 南音, with a regular beat. If you read it in Mandarin, that flavour disappears completely, because it was written to be sung in Cantonese in the first place.'" }
  - { es: "〈吊秋喜〉（開首） ／ 聽見你話死，實在見思疑，何苦輕生得咁痴。", en: "'Mourning Chau Hei' (opening) / When I heard you were dead, I truly could not believe it – / why throw away your life so foolishly?" }
  - { es: "「呢首就更加口語喇。據講秋喜係一個歌女，同招子庸好熟，後來因為欠債，跳咗落江。招子庸聽到消息，寫咗呢首歌嚟悼念佢。『聽見你話死』，即係『聽到人講你死咗』；『實在見思疑』，即係『我真係唔信』；『何苦輕生得咁痴』，就係『你點解咁傻，要自己尋死呢』。一開口就好似同佢講嘢，冇乜修飾，所以特別令人心酸。」", en: "'This one is even more colloquial. It's said that Chau Hei was a singing girl who was close to Zhao Ziyong, and that later, because of debts, she threw herself into the river. When Zhao heard the news, he wrote this song to mourn her. 聽見你話死 means \"I heard people say you were dead\"; 實在見思疑 means \"I really can't believe it\"; 何苦輕生得咁痴 means \"why were you so foolish as to take your own life?\" From the first word it's as if he's talking to her, with hardly any ornament, and that's what makes it so heartbreaking.'" }
  - { es: "一個老師好奇：「咁一本用廣東話寫嘅書，有冇人睇㗎？」蘇老師笑：「好受歡迎！粵謳後來喺廣州、香港不斷有人模仿，報紙都登。一九零四年，英國人金文泰仲將佢翻譯做英文，叫 Cantonese Love-Songs。佢後來做咗香港總督。你諗吓，一個港督學廣東話，係靠讀歌女嘅情歌。」大家笑到成船人望過嚟。", en: "One teacher is curious: 'So did anyone read a book written in Cantonese?' Ms So laughs: 'It was very popular! People in Guangzhou and Hong Kong kept imitating the Yuet Au, and the newspapers printed them. In 1904 an Englishman, Cecil Clementi, even translated it into English as Cantonese Love-Songs. He later became Governor of Hong Kong. Imagine: a governor of Hong Kong learning Cantonese by reading the love songs of singing girls.' Everyone laughs so loudly that the whole boat turns to look." }
  - { es: "船經過海珠橋，江風吹嚟，好涼。蘇老師話：「而家我哋喺網上、喺WhatsApp打廣東話，覺得好平常。但係兩百年前，將廣東話寫落紙，係一件好大膽嘅事。招子庸證明咗，我哋日日講嘅說話，都可以寫成文學。」佢停咗一陣，對住江面細細聲讀：「心各有事，總要解脫為先……」嗰晚啲燈好靚，但係大家都冇再講嘢，淨係聽住水聲。", en: "The boat passes under Haizhu Bridge, and the river breeze is cool. Ms So says: 'Nowadays we type Cantonese online and on WhatsApp and think nothing of it. But two hundred years ago, putting Cantonese down on paper was a very bold thing to do. Zhao Ziyong proved that the words we speak every day can become literature.' She pauses, then reads softly to the river: 'Every heart has its troubles; the first thing is to set them free…' The lights are beautiful that night, but nobody says anything more; they just listen to the water." }
questions:
  - { q: "「粵謳」呢個名係乜嘢意思？", options: ["廣東人嘅歌", "廣東嘅詩人", "珠江嘅船"], answer: 0, explain: "謳 means song: 粵謳 = songs of the Cantonese (Yue) people." }
  - { q: "招子庸嘅粵謳喺語言上有咩特色？", options: ["全部用文言文", "文白夾雜，雅嘅書面語同「唔、咁、佢」呢啲口語混埋一齊", "全部用英文寫"], answer: 1, explain: "The songs mix classical diction (是, 便是) with colloquial Cantonese words (唔, 咁, 佢, 嘅)." }
  - { q: "「但向苦中尋樂，便是神仙」嘅意思係？", options: ["人生太苦，唔使努力", "識得喺苦入面搵開心，就好似神仙咁自在", "神仙住喺苦海入面"], answer: 1, explain: "尋樂 = look for joy; 便是 = then (you) are: whoever finds joy in hardship is as free as an immortal." }
  - { q: "〈吊秋喜〉點解特別令人心酸？", options: ["因為用好多深奧嘅典故", "因為好口語，好似直接同秋喜講嘢", "因為首歌好長"], answer: 1, explain: "Its plain colloquial lines (聽見你話死…) sound like speaking directly to the dead woman." }
  - { q: "邊個將《粵謳》翻譯做英文？", options: ["招子庸自己", "後來做咗香港總督嘅金文泰", "一個廣州嘅歌女"], answer: 1, explain: "Cecil Clementi published Cantonese Love-Songs in 1904 and later became Governor of Hong Kong." }
