id: r.a1.up-to-the-peak
level: a1
title: 點樣去山頂？
kind: dialogue
intro: Ana and Kelvin want to see the view from Victoria Peak. They take the MTR, get lost near Central and ask a passer-by for directions to the Peak Tram.
paragraphs:
  - { es: "今日天氣好好，有太陽，唔係好熱。Ana話：「我想去山頂睇香港！」Kelvin話：「好呀，我哋坐港鐵去中環，跟住坐纜車上山頂啦。」", en: "The weather is lovely today: sunny, and not too hot. Ana says: \"I want to go up the Peak and look at Hong Kong!\" Kelvin says: \"OK, let's take the MTR to Central, then take the tram up to the Peak.\"" }
  - { es: "佢哋喺北角站上車，坐港島綫去中環。車上面好多人，冇位坐，佢哋要企。Kelvin話：「北角去中環好近，十分鐘就到。」", en: "They get on at North Point station and take the Island Line to Central. The train is crowded and there are no seats, so they have to stand. Kelvin says: \"North Point to Central is close, just ten minutes.\"" }
  - { es: "喺中環站，佢哋行K出口出去。但係中環好大，有好多高樓，Kelvin唔知喺邊度坐纜車。Ana話：「我哋迷路喇！」", en: "At Central station they walk out of Exit K. But Central is huge, with lots of tall buildings, and Kelvin doesn't know where to catch the tram. Ana says: \"We're lost!\"" }
  - { es: "Ana問一位小姐：「唔該，請問喺邊度坐山頂纜車呀？」小姐話：「喺花園道。你哋直行，過馬路，轉右，再行五分鐘就到。」", en: "Ana asks a young woman: \"Excuse me, where do I catch the Peak Tram, please?\" The woman says: \"It's on Garden Road. Go straight ahead, cross the road, turn right and walk another five minutes, and you're there.\"" }
  - { es: "Ana：「遠唔遠呀？」小姐：「唔遠，好近。嗰度對面有個公園，好易搵。」Ana：「唔該晒！」小姐：「唔使客氣，拜拜！」", en: "Ana: \"Is it far?\" Woman: \"No, it's very close. There's a park opposite it, it's easy to find.\" Ana: \"Thank you so much!\" Woman: \"You're welcome, bye!\"" }
  - { es: "坐纜車嘅地方好多遊客，佢哋要等半個鐘。Kelvin用八達通畀錢。纜車上山好斜，Ana大叫：「嘩！」但係又好開心。", en: "The place where you board the tram is full of tourists, and they wait for half an hour. Kelvin pays with his Octopus card. The tram climbs very steeply up the hill; Ana shouts \"Whoa!\", but she's also very happy." }
  - { es: "喺山頂，佢哋睇到維多利亞港、九龍同好多高樓。Ana話：「嘩，好靚呀！」Kelvin話：「夜晚嘅山頂仲靚，我哋六點先返去啦。」", en: "At the Peak they can see Victoria Harbour, Kowloon and lots of tall buildings. Ana says: \"Wow, it's beautiful!\" Kelvin says: \"The Peak is even more beautiful at night, so let's not go back until six.\"" }
questions:
  - { q: "佢哋喺邊個站上車？", options: ["北角站", "中環站", "金鐘站"], answer: 0, explain: "佢哋喺北角站上車, then ride to Central." }
  - { q: "點解佢哋要企？", options: ["因為好近", "因為冇位坐", "因為Ana鍾意企"], answer: 1, explain: "車上面好多人，冇位坐: the train is full and there are no seats." }
  - { q: "喺邊度坐纜車？", options: ["花園道", "北角", "九龍"], answer: 0, explain: "The woman says 喺花園道: it's on Garden Road." }
  - { q: "坐纜車嘅地方對面有乜嘢？", options: ["一間酒樓", "一個公園", "一間銀行"], answer: 1, explain: "嗰度對面有個公園: there's a park opposite." }
  - { q: "Kelvin點樣畀錢？", options: ["用散紙", "用八達通", "Ana畀錢"], answer: 1, explain: "Kelvin用八達通畀錢: he pays with his Octopus card." }
glossary:
  - { es: 港島綫, en: Island Line (MTR) }
  - { es: 花園道, en: Garden Road }
  - { es: 斜, en: steep }
  - { es: 企, en: to stand }
