id: r.c2.three-dogs-in-shunde
level: c2
title: 三隻狗仔遊順德
kind: text
intro: "A comic story about the course's three travelling dogs on a food trip to Shunde, the 'world capital of gastronomy'. It is packed with current slang (正, 世一, 中伏, 食花生, hea), lucky and unlucky sound puns, and 歇後語, two-part sayings whose second half the listener is expected to supply – try to guess each punchline before you read it."
allow: [leo, bonchita, luna, 大良, 順德, 豬八戒, 阿茂, hea, chur]
paragraphs:
  - { es: "一落車，Leo個鼻就開始郁：「嘩，成條街都係雙皮奶嘅味！順德真係世一！」Bonchita翻白眼：「你喺佛山食咗三碗艇仔粥，喺廣州又食咗兩碟腸粉，而家仲食？」Luna就慢條斯理噉講：「佢呀，黃皮樹了哥——唔熟唔食；但係凡係食得嘅，佢都當自己好熟。」", en: "The moment they get off the bus, Leo's nose starts twitching: 'Wow, the whole street smells of double-skin milk! Shunde is the best in the world!' Bonchita rolls her eyes: 'You had three bowls of sampan congee in Foshan and two plates of rice rolls in Guangzhou, and you're eating again?' Luna says unhurriedly: 'Him? He's the myna in the wampee tree – he only eats what's ripe (\"he only deals with people he knows\"); except anything edible, he treats as an old friend.'" }
  - { es: "佢哋第一站去食魚生。師傅將一條魚切到薄過紙，擺到成朵花噉，旁邊仲有薑絲、蔥絲、花生同生菜。師傅笑住話：「食生菜好意頭，生菜即係生財，食完發達！」Leo即刻夾咗一大啖：「咁我要發大達！」Bonchita話：「你再食，就唔係生財，係生肥。」", en: "Their first stop is raw fish. The chef slices a fish thinner than paper and arranges it like a flower, with shredded ginger, spring onion, peanuts and lettuce on the side. The chef says with a smile: 'Eating lettuce is lucky – 生菜 \"lettuce\" sounds like 生財 \"make money\", so eat up and get rich!' Leo immediately grabs a huge mouthful: 'Then I want to get really rich!' Bonchita says: 'Keep eating and it won't be 生財, it'll be 生肥 \"get fat\".'" }
  - { es: "食完魚生，佢哋行過一間手信舖，門口寫住「正宗大良炒牛奶，全城最平」。Leo冇諗過就買咗三盒。點知一打開，入面得三粒，仲要凍冰冰。Bonchita嬲到爆：「中伏喇！呢間根本係呃遊客嘅！」Luna拍拍Leo個膊頭：「唔緊要，當買個教訓。下次記住：門口寫『全城最平』嘅，多數都係掛羊頭賣狗肉。」Leo大叫：「唔好講狗肉呀！」", en: "After the raw fish they pass a souvenir shop with a sign at the door: 'Authentic Daliang fried milk, cheapest in town'. Without thinking, Leo buys three boxes. But when he opens them, there are only three pieces inside, and they're ice cold. Bonchita is furious: 'We've been had! This place is just a tourist trap!' Luna pats Leo on the shoulder: 'Never mind, think of it as paying for a lesson. Next time remember: a shop with \"cheapest in town\" at the door is usually hanging up a sheep's head and selling dog meat.' Leo howls: 'Don't talk about dog meat!'" }
  - { es: "為咗安慰Leo，佢哋去咗一間老字號食雙皮奶。張枱隔籬有兩個阿姐，一路食一路講是非。一個話：「佢個新老公呀，外甥打燈籠——」另一個即刻接：「照舊！一樣咁孤寒！」Luna細細聲解釋：「外甥打燈籠，即係照住阿舅，『照舅』同『照舊』同音，意思係冇變過。」三隻狗仔一路扮食嘢，一路食花生，聽到唔捨得走。", en: "To cheer Leo up, they go to an old-established shop for double-skin milk. At the next table two women are eating and gossiping. One says: 'Her new husband, he's like a nephew carrying a lantern –' and the other immediately finishes: 'Lighting the way for his uncle! Just as stingy as before!' Luna explains quietly: 'A nephew carrying a lantern lights the way for his uncle – 照舅 \"lighting uncle\" sounds the same as 照舊 \"as before\", so it means nothing has changed.' The three dogs pretend to eat while enjoying the drama, too gripped to leave." }
  - { es: "雙皮奶滑到不得了，面頭嗰層奶皮又香又甜。Leo食完一碗，又嗌多一碗，又嗌多一碗。Bonchita話：「你今日食咗幾多？阿茂整餅——」Luna幫佢接：「冇嗰樣整嗰樣！」Leo抗議：「我有計數㗎！」Bonchita話：「你有計數？你條肚腩就話畀我知你冇。」", en: "The double-skin milk is incredibly smooth, and the layer of milk skin on top is fragrant and sweet. Leo finishes one bowl, orders another, then another. Bonchita says: 'How much have you eaten today? You're Ah Mau making cakes –' and Luna finishes for her: 'making whatever there's no call for!' Leo protests: 'I've been counting!' Bonchita says: 'Counting? Your belly tells me you haven't.'" }
  - { es: "落晝，佢哋去清暉園hea吓。Luna坐喺池邊睇魚，Bonchita喺樹下面跳舞，Leo就攤喺張石櫈度瞓覺，打鼻鼾打到啲遊客以為係打雷。有個阿叔行過，笑住話：「呢隻狗仔真係好食懶飛！」Bonchita話：「佢平時唔係咁㗎，佢返工好chur㗎，日日要陪啲學生學廣東話。」", en: "In the afternoon they go to Qinghui Garden to chill. Luna sits by the pond watching the fish, Bonchita dances under a tree, and Leo sprawls on a stone bench and falls asleep, snoring so loudly that visitors think it's thundering. A man walking past laughs: 'That little dog really loves eating and hates working!' Bonchita says: 'He's not usually like this. His job is really exhausting – every day he has to keep students company while they learn Cantonese.'" }
  - { es: "Leo瞓醒，見到Luna喺池邊對住啲魚影相，就問：「你影啲魚做乜？」Luna話：「過年食魚，因為『魚』同『餘』同音，年年有餘。我影定啲相，等過年嘅時候send畀大家，當係拜早年。」Bonchita喺隔籬補充：「不過唔好send死魚嘅相，嗰啲就唔係有餘，係冇晒。」Leo笑到碌地，又唔小心跌咗落池邊嘅草地，成身都係泥，三隻狗仔笑到停唔到。", en: "When Leo wakes up, he sees Luna by the pond taking photos of the fish and asks: 'What are you photographing the fish for?' Luna says: 'At New Year you eat fish, because 魚 'fish' sounds the same as 餘 'surplus' – may you have plenty every year. I'm taking some photos now so I can send them to everyone at New Year as early greetings.' Bonchita adds from beside her: 'Just don't send photos of dead fish – that wouldn't be surplus, it'd be all gone.' Leo laughs so hard he rolls off onto the grass by the pond and gets covered in mud, and the three dogs can't stop laughing." }
  - { es: "傍晚，Leo抹乾淨身上啲泥，話要買最後一樣手信：「我想買個鐘送畀老師，多謝佢教我哋。」Luna同Bonchita同時大叫：「唔得！」Luna解釋：「送鐘同送終同音，即係送人最後一程，好大忌諱！你想送嘢，不如送桔，桔同吉同音，大吉大利。」Leo諗咗一陣：「咁送梨得唔得？」Bonchita搖頭：「分梨即係分離，你想同老師分手咩？」", en: "Towards evening, having wiped off the mud, Leo says he wants to buy one last souvenir: 'I want to buy a clock for our teacher, to thank her for teaching us.' Luna and Bonchita shout at the same time: 'No!' Luna explains: '送鐘 \"giving a clock\" sounds the same as 送終 \"attending someone's deathbed\" – seeing someone off on their last journey. A huge taboo! If you want to give something, give tangerines: 桔 sounds like 吉 \"lucky\" – great fortune.' Leo thinks for a moment: 'Then what about pears?' Bonchita shakes her head: 'Sharing a pear sounds like parting – do you want to break up with the teacher?'" }
  - { es: "結果佢哋買咗一盒桔同一包杏仁餅。坐車返廣州嗰陣，Leo望住窗外，忽然好認真噉講：「我今日學咗好多嘢。原來廣東話唔單止要識講，仲要識聽聲：一個音，可以係好意頭，又可以係大忌。」Bonchita好感動：「Leo，你終於長大喇！」Leo點頭：「係呀，所以今晚宵夜，我食雙份，因為『雙』即係好事成雙。」Luna同Bonchita對望一眼，一齊講：「和尚擔遮——無法無天！」", en: "In the end they buy a box of tangerines and a packet of almond cookies. On the bus back to Guangzhou, Leo looks out of the window and suddenly says very seriously: 'I've learned so much today. Cantonese isn't just about speaking – you have to listen to the sounds: one syllable can be lucky or a huge taboo.' Bonchita is touched: 'Leo, you've finally grown up!' Leo nods: 'Yes, so for supper tonight I'll eat a double portion, because \"double\" means good things come in pairs.' Luna and Bonchita exchange a look and say together: 'A monk holding an umbrella – no hair, no sky (\"no law, no heaven\")!'" }
questions:
  - { q: "點解食生菜係好意頭？", options: ["因為生菜好健康", "因為「生菜」同「生財」音近", "因為生菜係綠色"], answer: 1, explain: "生菜 saang1 coi3 echoes 生財 saang1 coi4 'make money' – a homophone pun." }
  - { q: "Bonchita話「中伏喇」，即係點？", options: ["佢哋畀人呃咗", "佢哋食飽喇", "佢哋迷咗路"], answer: 0, explain: "中伏 'fall into an ambush' is slang for being ripped off or tricked." }
  - { q: "「外甥打燈籠」嘅下半句係乜嘢？", options: ["無法無天", "照舊", "冇嗰樣整嗰樣"], answer: 1, explain: "外甥打燈籠——照舅 (lighting the uncle's way), a pun on 照舊 'as before'." }
  - { q: "點解唔可以送鐘畀人？", options: ["因為鐘好貴", "因為「送鐘」同「送終」同音，係忌諱", "因為老師已經有鐘"], answer: 1, explain: "送鐘 sung3 zung1 = 送終, attending a death – one of the best-known taboos." }
  - { q: "「和尚擔遮」點解係「無法無天」？", options: ["因為和尚冇頭髮（無髮），把遮遮住個天（無天）", "因為和尚唔守法", "因為落雨冇天"], answer: 0, explain: "A monk has no hair (無髮, a pun on 無法 'no law') and the umbrella hides the sky (無天): 'lawless', here 'outrageous'." }
