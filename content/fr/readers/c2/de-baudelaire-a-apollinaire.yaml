id: r.c2.de-baudelaire-a-apollinaire
level: c2
title: "Quatre poèmes, de Baudelaire à Apollinaire"
kind: literature
author: Charles Baudelaire (1821–1867), Guillaume Apollinaire (1880–1918)
source: "Baudelaire, « L'Albatros » et « Recueillement », Les Fleurs du mal (poèmes ajoutés dans les éditions de 1861 et de 1868) ; Apollinaire, « Le Pont Mirabeau » et « Marie », Alcools (1913). Domaine public. Poèmes cités en entier d'après les éditions du Projet Gutenberg (n° 6099 et 15462) ; Alcools est reproduit sans ponctuation, comme dans l'original ; accents sur les majuscules rétablis."
intro: "Two poems by Baudelaire and two by Apollinaire, fifty years apart, quoted in full; the lines are separated by a slash. The short paragraphs before each pair are editorial introductions written for this course. Compare Baudelaire's classical alexandrines and allegories (ma Douleur, le Plaisir) with Apollinaire's unpunctuated lines, where rhythm and repetition replace commas and full stops."
allow: [ridicule, vastes, compagnons, pauses, baudelaire, apollinaire, mirabeau, seine, marie, laurencin, alcools, fleurs, albatros, albatros, poète, poèmes, poème, poésie, alexandrins, sonnet, ponctuation, azur, orient, multitude, servile, atmosphère, comique, prince, archer, exilé, mal, maclotte, éternels, violente, espérance]
paragraphs:
  - { es: "Quand Les Fleurs du mal paraissent en 1857, Baudelaire est poursuivi en justice pour « outrage à la morale publique », et six poèmes doivent être retirés du livre. Il continue pourtant d'écrire et d'enrichir le recueil. Dans « L'Albatros », il compare le poète à un grand oiseau de mer, magnifique dans le ciel mais ridicule sur terre ; dans « Recueillement », il parle à sa propre douleur comme à une personne.", en: "When Les Fleurs du mal came out in 1857, Baudelaire was prosecuted for 'offence against public morals', and six poems had to be removed from the book. He nevertheless went on writing and enlarging the collection. In 'The Albatross' he compares the poet to a great seabird, magnificent in the sky but ridiculous on land; in 'Meditation' he speaks to his own sorrow as to a person." }
  - { es: "L'ALBATROS. Souvent, pour s'amuser, les hommes d'équipage / Prennent des albatros, vastes oiseaux des mers, / Qui suivent, indolents compagnons de voyage, / Le navire glissant sur les gouffres amers. / À peine les ont-ils déposés sur les planches, / Que ces rois de l'azur, maladroits et honteux, / Laissent piteusement leurs grandes ailes blanches / Comme des avirons traîner à côté d'eux. / Ce voyageur ailé, comme il est gauche et veule ! / Lui, naguère si beau, qu'il est comique et laid ! / L'un agace son bec avec un brûle-gueule, / L'autre mime, en boitant, l'infirme qui volait ! / Le Poète est semblable au prince des nuées / Qui hante la tempête et se rit de l'archer ; / Exilé sur le sol au milieu des huées, / Ses ailes de géant l'empêchent de marcher.", en: "THE ALBATROSS. Often, for amusement, the men of the crew / Catch albatrosses, vast birds of the seas, / Which follow, indolent travelling companions, / The ship gliding over the bitter depths. / Scarcely have they set them down on the deck / Than these kings of the azure, clumsy and ashamed, / Pitifully let their great white wings / Drag beside them like oars. / This winged traveller, how awkward and feeble he is! / He, so beautiful a moment ago, how comic and ugly! / One teases his beak with a stubby pipe, / Another, limping, mimics the cripple who once flew! / The Poet is like the prince of the clouds / Who haunts the storm and laughs at the archer; / Exiled on the ground amid the jeers, / His giant's wings prevent him from walking." }
  - { es: "RECUEILLEMENT. Sois sage, ô ma Douleur, et tiens-toi plus tranquille. / Tu réclamais le Soir ; il descend ; le voici : / Une atmosphère obscure enveloppe la ville, / Aux uns portant la paix, aux autres le souci. / Pendant que des mortels la multitude vile, / Sous le fouet du Plaisir, ce bourreau sans merci, / Va cueillir des remords dans la fête servile, / Ma Douleur, donne-moi la main ; viens par ici, / Loin d'eux. Vois se pencher les défuntes Années, / Sur les balcons du ciel, en robes surannées ; / Surgir du fond des eaux le Regret souriant ; / Le Soleil moribond s'endormir sous une arche, / Et, comme un long linceul traînant à l'Orient, / Entends, ma chère, entends la douce Nuit qui marche.", en: "MEDITATION. Be good, O my Sorrow, and keep quieter. / You were calling for Evening; it is falling; here it is: / A dark atmosphere wraps the city, / Bringing peace to some, to others care. / While the vile multitude of mortals, / Under the whip of Pleasure, that merciless executioner, / Goes to gather remorse in the slavish festivities, / My Sorrow, give me your hand; come this way, / Far from them. See the dead Years leaning / From the balconies of the sky, in old-fashioned dresses; / Smiling Regret rising from the depths of the waters; / The dying Sun falling asleep beneath an arch, / And, like a long shroud trailing in the East, / Hear, my dear, hear the gentle Night walking." }
  - { es: "Apollinaire publie Alcools en 1913, à la veille de la Grande Guerre, où il sera blessé à la tête en 1916. Au dernier moment, il supprime toute la ponctuation du recueil : c'est au lecteur de trouver les pauses. « Le Pont Mirabeau » est souvent lu comme un adieu au peintre Marie Laurencin, qu'il venait de quitter ; « Marie » mêle les souvenirs d'un amour de jeunesse, la danse, la neige et la Seine.", en: "Apollinaire published Alcools in 1913, on the eve of the Great War, in which he would be wounded in the head in 1916. At the last moment he removed all punctuation from the collection: it is up to the reader to find the pauses. 'The Mirabeau Bridge' is often read as a farewell to the painter Marie Laurencin, whom he had just left; 'Marie' mingles memories of a youthful love, dancing, snow and the Seine." }
  - { es: "LE PONT MIRABEAU. Sous le pont Mirabeau coule la Seine / Et nos amours / Faut-il qu'il m'en souvienne / La joie venait toujours après la peine / Vienne la nuit sonne l'heure / Les jours s'en vont je demeure / Les mains dans les mains restons face à face / Tandis que sous / Le pont de nos bras passe / Des éternels regards l'onde si lasse / Vienne la nuit sonne l'heure / Les jours s'en vont je demeure", en: "THE MIRABEAU BRIDGE. Under the Mirabeau bridge flows the Seine / And our loves / Must I remember them / Joy always came after sorrow / Let night come let the hour strike / The days go by I remain / Hand in hand let us stay face to face / While under / The bridge of our arms passes / The wave of eternal gazes so weary / Let night come let the hour strike / The days go by I remain" }
  - { es: "L'amour s'en va comme cette eau courante / L'amour s'en va / Comme la vie est lente / Et comme l'Espérance est violente / Vienne la nuit sonne l'heure / Les jours s'en vont je demeure / Passent les jours et passent les semaines / Ni temps passé / Ni les amours reviennent / Sous le pont Mirabeau coule la Seine / Vienne la nuit sonne l'heure / Les jours s'en vont je demeure", en: "Love goes away like this flowing water / Love goes away / How slow life is / And how violent Hope is / Let night come let the hour strike / The days go by I remain / The days pass and the weeks pass / Neither time past / Nor loves come back / Under the Mirabeau bridge flows the Seine / Let night come let the hour strike / The days go by I remain" }
  - { es: "MARIE. Vous y dansiez petite fille / Y danserez-vous mère-grand / C'est la maclotte qui sautille / Toutes les cloches sonneront / Quand donc reviendrez-vous Marie / Les masques sont silencieux / Et la musique est si lointaine / Qu'elle semble venir des cieux / Oui je veux vous aimer mais vous aimer à peine / Et mon mal est délicieux / Les brebis s'en vont dans la neige / Flocons de laine et ceux d'argent / Des soldats passent et que n'ai-je / Un cœur à moi ce cœur changeant / Changeant et puis encor que sais-je", en: "MARIE. You danced there as a little girl / Will you dance there as a grandmother / It is the maclotte that skips / All the bells will ring / When will you come back Marie / The masks are silent / And the music is so far away / That it seems to come from the heavens / Yes I want to love you but love you scarcely / And my pain is delicious / The ewes go off into the snow / Flakes of wool and flakes of silver / Soldiers pass and why have I not / A heart of my own this changing heart / Changing and then again what do I know" }
  - { es: "Sais-je où s'en iront tes cheveux / Crépus comme mer qui moutonne / Sais-je où s'en iront tes cheveux / Et tes mains feuilles de l'automne / Que jonchent aussi nos aveux / Je passais au bord de la Seine / Un livre ancien sous le bras / Le fleuve est pareil à ma peine / Il s'écoule et ne tarit pas / Quand donc finira la semaine", en: "Do I know where your hair will go / Curly like a sea flecked with white / Do I know where your hair will go / And your hands autumn leaves / Strewn too with our confessions / I was walking along the Seine / An old book under my arm / The river is like my sorrow / It flows on and never runs dry / When will the week ever end" }
questions:
  - { q: "Pourquoi l'albatros est-il ridicule sur le navire ?", options: ["Parce qu'il est malade", "Parce que ses grandes ailes, faites pour le ciel, l'empêchent de marcher", "Parce qu'il a peur des marins"], answer: 1, explain: "On deck his wings drag «comme des avirons»; the last line gives the key: «Ses ailes de géant l'empêchent de marcher»." }
  - { q: "Que représente l'albatros dans le poème ?", options: ["Le poète, grand dans son art mais incompris et moqué parmi les hommes", "Le marin", "La liberté des voyages"], answer: 0, explain: "«Le Poète est semblable au prince des nuées»: magnificent in the sky of poetry, «exilé sur le sol au milieu des huées»." }
  - { q: "Quelle figure de style domine dans « Recueillement » ?", options: ["L'allégorie : la Douleur, le Plaisir, les Années, la Nuit deviennent des personnes", "L'hyperbole", "Le jeu de mots"], answer: 0, explain: "Abstractions get capital letters and human actions: the Sorrow is spoken to, Pleasure holds a whip, the Years lean from balconies, Night walks." }
  - { q: "Que signifie le refrain « Les jours s'en vont je demeure » ?", options: ["Le temps passe, mais le poète reste, seul avec son souvenir", "Le poète part en voyage", "Les jours sont de plus en plus longs"], answer: 0, explain: "Time flows like the Seine and loves go with it, while the poet stays (demeurer = rester), unable to follow." }
  - { q: "Qu'a fait Apollinaire avec la ponctuation d'Alcools ?", options: ["Il l'a doublée", "Il l'a entièrement supprimée", "Il n'utilise que des points d'exclamation"], answer: 1, explain: "He removed all punctuation just before publication; the line breaks and the rhythm guide the reader instead." }
