id: a1.u09
title: "En métro, on va où ?"
lessons:
  - id: a1.u09.l1
    title: Je vais au musée
    teach: [g.aller-present, g.contractions-au-du]
    vocab: [w.à-pied, w.taxi, w.visiter, w.théâtre, w.exposition, w.plan, w.ticket, w.bar, w.rapide, w.revenir, w.seul]
    tip: "Aller is irregular: je vais, tu vas, il va, nous allons, vous allez, ils vont. À + le = au, à + les = aux, de + le = du; à la and à l' never change."
    sentences:
      - { es: "Je vais au Louvre en métro.", en: "I'm going to the Louvre by metro.", altEs: ["Moi, je vais au Louvre en métro."], altEn: ["I go to the Louvre by metro.", "I'm taking the metro to the Louvre."], grammar: [g.aller-present, g.contractions-au-du], vocab: [], error: { wrong: "Je vais à le Louvre en métro.", explain: "À + le always contracts to au: au Louvre.", grammar: g.contractions-au-du } }
      - { es: "Tu vas où ? — Je vais à la gare.", en: "Where are you going? — I'm going to the station.", altEs: ["Où vas-tu ? — Je vais à la gare.", "Où est-ce que tu vas ? — Je vais à la gare."], grammar: [g.aller-present, g.contractions-au-du], vocab: [] }
      - { es: "Nous allons aux Tuileries à pied.", en: "We're walking to the Tuileries.", altEs: ["On va aux Tuileries à pied."], altEn: ["We're going to the Tuileries on foot.", "We walk to the Tuileries."], grammar: [g.aller-present, g.contractions-au-du], vocab: [w.à-pied], transform: { instruction: "Change to 'they'", answer: "Ils vont aux Tuileries à pied.", alt: ["Elles vont aux Tuileries à pied."], en: "They're walking to the Tuileries." } }
      - { es: "Vous allez au théâtre ce soir ?", en: "Are you going to the theatre tonight?", altEs: ["Allez-vous au théâtre ce soir ?", "Est-ce que vous allez au théâtre ce soir ?"], altEn: ["Are you going to the theater tonight?"], grammar: [g.aller-present, g.contractions-au-du], vocab: [w.théâtre], transform: { instruction: "Use tu instead of vous", answer: "Tu vas au théâtre ce soir ?", alt: ["Vas-tu au théâtre ce soir ?", "Est-ce que tu vas au théâtre ce soir ?"], en: "Are you going to the theatre tonight? (informal)" } }
      - { es: "Elle va à l'exposition avec sa mère.", en: "She's going to the exhibition with her mother.", altEn: ["She goes to the exhibition with her mother."], grammar: [g.aller-present, g.contractions-au-du], vocab: [w.exposition], error: { wrong: "Elle va au exposition avec sa mère.", explain: "Before a vowel, à l' stays as it is: à l'exposition.", grammar: g.contractions-au-du } }
      - { es: "On prend un taxi ou on va à pied ?", en: "Shall we take a taxi or walk?", altEs: ["Nous prenons un taxi ou nous allons à pied ?"], altEn: ["Are we taking a taxi or walking?"], grammar: [g.aller-present, g.on-nous], vocab: [w.taxi, w.à-pied] }
      - { es: "Le métro, c'est rapide et pas cher.", en: "The metro is fast and cheap.", altEs: ["Le métro est rapide et pas cher."], altEn: ["The metro is quick and not expensive."], grammar: [g.c-est-il-est], vocab: [w.rapide] }
      - { es: "J'ai un ticket, mais je n'ai pas de plan du métro.", en: "I have a ticket, but I don't have a metro map.", altEn: ["I've got a ticket, but I haven't got a map of the metro."], grammar: [g.contractions-au-du, g.de-after-negation], vocab: [w.ticket, w.plan] }
      - { es: "Ils reviennent du marché à midi.", en: "They're coming back from the market at noon.", altEs: ["Elles reviennent du marché à midi."], altEn: ["They come back from the market at midday."], grammar: [g.contractions-au-du], vocab: [w.revenir], transform: { instruction: "Change to 'I'", answer: "Je reviens du marché à midi.", en: "I'm coming back from the market at noon." } }
      - { es: "Les touristes visitent le musée d'Orsay.", en: "The tourists are visiting the Musée d'Orsay.", altEn: ["The tourists visit the Orsay Museum."], grammar: [g.present-er], vocab: [w.visiter] }
      - { es: "Je vais chez le médecin, pas au cinéma !", en: "I'm going to the doctor's, not to the cinema!", grammar: [g.aller-present, g.contractions-au-du], vocab: [] }
      - { es: "Ce bar est à côté du métro.", en: "This bar is next to the metro.", altEn: ["That bar is next to the metro station."], grammar: [g.contractions-au-du, g.prepositions-place], vocab: [w.bar] }
      - { es: "Tu vas seul à l'aéroport ?", en: "Are you going to the airport alone?", altEs: ["Tu vas seule à l'aéroport ?", "Vous allez seul à l'aéroport ?"], altEn: ["Are you going to the airport on your own?"], grammar: [g.aller-present, g.contractions-au-du], vocab: [w.seul] }
      - { es: "Comment ça va ? — Je vais bien, merci.", en: "How are you? — I'm fine, thanks.", altEs: ["Ça va ? — Je vais bien, merci."], altEn: ["How's it going? — I'm well, thank you."], grammar: [g.aller-present], vocab: [] }
      - { es: "Le métro de Paris date de 1900.", en: "The Paris metro dates from 1900.", altEs: ["Le métro de Paris date de mille neuf cents."], grammar: [g.numbers-100-plus], vocab: [] }
    exchanges:
      - q: { es: "Tu vas où ?", en: "Where are you going?" }
        a: { es: "Je vais au musée du Louvre.", en: "I'm going to the Louvre museum." }
        alt: ["Au Louvre.", "Je vais à la gare.", "Je vais chez Paul."]
        grammar: [g.aller-present, g.contractions-au-du]
        vocab: []
      - q: { es: "Vous allez à la tour Eiffel à pied ?", en: "Are you walking to the Eiffel Tower?" }
        a: { es: "Non, c'est trop loin : on prend le métro.", en: "No, it's too far: we're taking the metro." }
        alt: ["Oui, c'est près.", "Non, en taxi."]
        grammar: [g.aller-present]
        vocab: [w.à-pied]
      - q: { es: "Comment allez-vous, madame ?", en: "How are you, madam?" }
        a: { es: "Très bien, merci. Et vous ?", en: "Very well, thank you. And you?" }
        alt: ["Bien, merci.", "Pas mal, et vous ?"]
        grammar: [g.aller-present]
        vocab: []
      - q: { es: "Tu reviens quand du marché ?", en: "When are you coming back from the market?" }
        a: { es: "Je reviens dans une heure.", en: "I'll be back in an hour." }
        alt: ["Dans une heure.", "Bientôt !"]
        grammar: [g.contractions-au-du]
        vocab: [w.revenir]
      - q: { es: "Vous avez un plan du métro ?", en: "Do you have a metro map?" }
        a: { es: "Oui, voilà un plan.", en: "Yes, here's a map." }
        alt: ["Non, désolé.", "Oui, voilà."]
        grammar: [g.contractions-au-du]
        vocab: [w.plan]
    texts:
      - title: "Le métro de Paris"
        es: ["Le métro de Paris date de 1900.", "Il est rapide et pas très cher.", "On va au Louvre, à la tour Eiffel ou aux Tuileries en vingt minutes."]
        en: ["The Paris metro dates from 1900.", "It's fast and not very expensive.", "You can get to the Louvre, the Eiffel Tower or the Tuileries in twenty minutes."]
        grammar: [g.contractions-au-du]
        vocab: [w.rapide]
      - title: "Message de Nicolas"
        es: ["Je suis à la gare du Nord.", "Je vais à l'hôtel en taxi.", "Tu viens au restaurant ce soir ?"]
        en: ["I'm at the Gare du Nord.", "I'm going to the hotel by taxi.", "Are you coming to the restaurant tonight?"]
        grammar: [g.aller-present, g.contractions-au-du]
        vocab: [w.taxi]
    spicy:
      - { es: "Tu vas où ? Je peux venir avec toi ?", en: "Where are you going? Can I come with you?", altEs: ["Où vas-tu ? Je peux venir avec toi ?"], grammar: [g.aller-present], vocab: [] }
      - { es: "Je vais seul au cinéma ce soir. Ou avec toi ?", en: "I'm going to the cinema alone tonight. Or with you?", altEs: ["Je vais seule au cinéma ce soir. Ou avec toi ?"], grammar: [g.aller-present, g.contractions-au-du], vocab: [w.seul] }
      - { es: "Le métro est rapide, mais toi, tu vas trop vite !", en: "The metro is fast, but you're going too fast!", grammar: [g.aller-present], vocab: [w.rapide] }
      - { es: "On va au bar du coin ? Je paie le premier verre.", en: "Shall we go to the bar on the corner? I'll pay for the first drink.", altEs: ["On va au bar du coin ? Je paye le premier verre."], grammar: [g.aller-present, g.contractions-au-du], vocab: [w.bar] }
      - { es: "Tu reviens quand ? Paris est triste sans toi.", en: "When are you coming back? Paris is sad without you.", grammar: [g.question-words], vocab: [w.revenir] }
  - id: a1.u09.l2
    title: "Qu'est-ce que tu fais ?"
    teach: [g.faire-present]
    vocab: [w.faire, w.courses, w.faire-les-courses, w.faire-la-cuisine, w.queue, w.bise, w.vaisselle, w.sport, w.promenade, w.balade, w.vie]
    tip: "Faire is irregular: je fais, tu fais, il fait, nous faisons, vous faites, ils font. It's in dozens of everyday expressions: faire les courses, faire la queue, faire la bise."
    sentences:
      - { es: "Qu'est-ce que tu fais ce soir ?", en: "What are you doing tonight?", altEs: ["Tu fais quoi ce soir ?", "Qu'est-ce que vous faites ce soir ?", "Que fais-tu ce soir ?"], altEn: ["What are you doing this evening?"], grammar: [g.faire-present, g.question-words], vocab: [w.faire] }
      - { es: "Je fais les courses au marché le samedi.", en: "I do the shopping at the market on Saturdays.", altEs: ["Le samedi, je fais les courses au marché."], altEn: ["I do my food shopping at the market on Saturdays."], grammar: [g.faire-present], vocab: [w.faire-les-courses, w.courses], variant: "Québec: faire l'épicerie." }
      - { es: "Mon mari fait la cuisine et moi, je fais la vaisselle.", en: "My husband cooks and I do the washing-up.", altEs: ["Mon mari fait la cuisine et je fais la vaisselle."], altEn: ["My husband does the cooking and I do the dishes."], grammar: [g.faire-present, g.stressed-pronouns], vocab: [w.faire-la-cuisine, w.vaisselle] }
      - { es: "Vous faites du sport ?", en: "Do you do any sport?", altEs: ["Tu fais du sport ?", "Faites-vous du sport ?", "Est-ce que vous faites du sport ?"], altEn: ["Do you play any sport?", "Do you do sport?"], grammar: [g.faire-present], vocab: [w.sport], error: { wrong: "Vous faisez du sport ?", explain: "Faire is irregular: vous faites, never vous faisez.", grammar: g.faire-present } }
      - { es: "Nous faisons une promenade le long de la Seine.", en: "We're going for a walk along the Seine.", altEs: ["On fait une promenade le long de la Seine."], altEn: ["We go for a walk along the Seine."], grammar: [g.faire-present], vocab: [w.promenade], transform: { instruction: "Change to 'they'", answer: "Ils font une promenade le long de la Seine.", alt: ["Elles font une promenade le long de la Seine."], en: "They're going for a walk along the Seine." } }
      - { es: "Ils font la queue devant le musée.", en: "They're queuing in front of the museum.", altEs: ["Elles font la queue devant le musée."], altEn: ["They're standing in line in front of the museum."], grammar: [g.faire-present], vocab: [w.queue], transform: { instruction: "Change to 'I'", answer: "Je fais la queue devant le musée.", en: "I'm queuing in front of the museum." } }
      - { es: "En France, on fait la bise pour dire bonjour.", en: "In France, people kiss on the cheek to say hello.", altEn: ["In France, we greet each other with a kiss on the cheek."], grammar: [g.faire-present, g.on-nous], vocab: [w.bise] }
      - { es: "Tu fais une balade à vélo avec nous ?", en: "Are you coming for a bike ride with us?", altEs: ["Tu fais un tour à vélo avec nous ?", "Vous faites une balade à vélo avec nous ?"], altEn: ["Will you go for a bike ride with us?"], grammar: [g.faire-present], vocab: [w.balade] }
      - { es: "C'est la vie !", en: "That's life!", altEn: ["Such is life!"], grammar: [g.c-est-il-est], vocab: [w.vie] }
      - { es: "Qu'est-ce qu'elle fait dans la vie ? — Elle est médecin.", en: "What does she do for a living? — She's a doctor.", altEs: ["Elle fait quoi dans la vie ? — Elle est médecin."], altEn: ["What does she do? — She's a doctor."], grammar: [g.faire-present, g.c-est-il-est], vocab: [w.vie, w.faire] }
      - { es: "Je ne fais rien le dimanche.", en: "I don't do anything on Sundays.", altEs: ["Le dimanche, je ne fais rien."], altEn: ["I do nothing on Sundays."], grammar: [g.faire-present, g.negation-ne-pas], vocab: [w.faire], transform: { instruction: "Change to 'we' (nous)", answer: "Nous ne faisons rien le dimanche.", alt: ["On ne fait rien le dimanche.", "Le dimanche, nous ne faisons rien."], en: "We don't do anything on Sundays." } }
      - { es: "Mes voisins font la fête jusqu'à deux heures du matin !", en: "My neighbours party until two in the morning!", altEn: ["My neighbors party till two a.m.!"], grammar: [g.faire-present], vocab: [w.faire] }
      - { es: "Qu'est-ce que vous faites ? — Nous cherchons la station de métro.", en: "What are you doing? — We're looking for the metro station.", altEs: ["Vous faites quoi ? — Nous cherchons la station de métro.", "Qu'est-ce que vous faites ? — On cherche la station de métro."], grammar: [g.faire-present], vocab: [w.faire] }
      - { es: "Mon père fait toujours la cuisine le dimanche.", en: "My father always cooks on Sundays.", altEs: ["Le dimanche, mon père fait toujours la cuisine."], altEn: ["My dad always does the cooking on Sundays."], grammar: [g.faire-present, g.frequency-adverbs], vocab: [w.faire-la-cuisine], error: { wrong: "Mon père fais toujours la cuisine le dimanche.", explain: "With il and elle, faire ends in -t: il fait.", grammar: g.faire-present } }
      - { es: "On fait un tour en bateau sur la Seine ?", en: "Shall we take a boat trip on the Seine?", altEs: ["Nous faisons un tour en bateau sur la Seine ?"], altEn: ["Shall we go on a boat ride on the Seine?"], grammar: [g.faire-present, g.on-nous], vocab: [] }
    exchanges:
      - q: { es: "Qu'est-ce que tu fais dans la vie ?", en: "What do you do for a living?" }
        a: { es: "Je suis professeur de français.", en: "I'm a French teacher." }
        alt: ["Je suis étudiant.", "Je travaille dans un restaurant.", "Je suis étudiante."]
        grammar: [g.faire-present]
        vocab: [w.vie]
      - q: { es: "Tu fais du sport ?", en: "Do you do any sport?" }
        a: { es: "Oui, je fais du vélo le week-end.", en: "Yes, I go cycling at weekends." }
        alt: ["Non, pas du tout.", "Oui, un peu."]
        grammar: [g.faire-present]
        vocab: [w.sport]
      - q: { es: "Qui fait la cuisine chez toi ?", en: "Who does the cooking at your place?" }
        a: { es: "Mon frère. Moi, je fais la vaisselle.", en: "My brother. I do the washing-up." }
        alt: ["Moi !", "Ma mère."]
        grammar: [g.faire-present]
        vocab: [w.faire-la-cuisine, w.vaisselle]
      - q: { es: "Pourquoi il y a la queue ici ?", en: "Why is there a queue here?" }
        a: { es: "C'est pour l'exposition Monet.", en: "It's for the Monet exhibition." }
        alt: ["Pour le musée.", "Je ne sais pas."]
        grammar: [g.faire-present]
        vocab: [w.queue, w.exposition]
      - q: { es: "On fait la bise ?", en: "Shall we kiss on the cheek?" }
        a: { es: "Oui, deux bises, comme à Paris !", en: "Yes, two kisses, like in Paris!" }
        alt: ["Oui, bien sûr.", "Bonjour !"]
        grammar: [g.faire-present]
        vocab: [w.bise]
    texts:
      - title: "Mon samedi"
        es: ["Le samedi matin, je fais les courses.", "L'après-midi, je fais une balade au jardin.", "Le soir, je fais la cuisine pour mes amis."]
        en: ["On Saturday mornings I do the shopping.", "In the afternoon I go for a walk in the garden.", "In the evening I cook for my friends."]
        grammar: [g.faire-present]
        vocab: [w.faire-les-courses, w.balade, w.faire-la-cuisine]
      - title: "Message de Camille"
        es: ["On fait une promenade sur les quais ?", "Après, on fait les courses ensemble.", "Et ce soir, c'est toi qui fais la vaisselle !"]
        en: ["Shall we go for a walk along the quays?", "Afterwards, we'll do the shopping together.", "And tonight, you're the one doing the washing-up!"]
        grammar: [g.faire-present, g.on-nous]
        vocab: [w.promenade, w.faire-les-courses, w.vaisselle]
    spicy:
      - { es: "Tu fais la cuisine ? Moi, je fais la vaisselle… et le dessert.", en: "You cook? I'll do the dishes... and dessert.", grammar: [g.faire-present], vocab: [w.faire-la-cuisine, w.vaisselle] }
      - { es: "On fait la bise ? Deux ? Trois ? Quatre ?", en: "Shall we do the cheek kiss? Two? Three? Four?", grammar: [g.faire-present], vocab: [w.bise] }
      - { es: "Qu'est-ce que tu fais ce soir ? Rien ? Parfait.", en: "What are you doing tonight? Nothing? Perfect.", altEs: ["Tu fais quoi ce soir ? Rien ? Parfait."], grammar: [g.faire-present], vocab: [w.faire] }
      - { es: "Je fais la queue depuis une heure, mais pour toi, ça va.", en: "I've been queuing for an hour, but for you, it's fine.", grammar: [g.faire-present], vocab: [w.queue] }
      - { es: "Tu fais du sport ? Ça se voit.", en: "You do sport? It shows.", altEn: ["Do you work out? It shows."], grammar: [g.faire-present], vocab: [w.sport] }
  - id: a1.u09.l3
    title: Ce soir, on va sortir
    teach: [g.futur-proche]
    vocab: [w.ce-soir, w.plus-tard, w.bientôt, w.prochain, w.dernier, w.longtemps, w.voir, w.soirée, w.se-promener, w.passer, w.rester]
    tip: "Aller + infinitive = 'going to': je vais manger, on va sortir. In the negative, ne … pas goes around aller: je ne vais pas sortir."
    sentences:
      - { es: "Ce soir, je vais voir un film.", en: "Tonight I'm going to see a film.", altEs: ["Je vais voir un film ce soir."], altEn: ["This evening I'm going to watch a film.", "Tonight I'm going to see a movie."], grammar: [g.futur-proche], vocab: [w.ce-soir, w.voir], transform: { instruction: "Change to 'we' (on)", answer: "Ce soir, on va voir un film.", alt: ["Ce soir, nous allons voir un film.", "On va voir un film ce soir."], en: "Tonight we're going to see a film." } }
      - { es: "Demain, nous allons visiter Montmartre.", en: "Tomorrow we're going to visit Montmartre.", altEs: ["Demain, on va visiter Montmartre.", "Nous allons visiter Montmartre demain."], grammar: [g.futur-proche], vocab: [w.visiter], transform: { instruction: "Change to 'I'", answer: "Demain, je vais visiter Montmartre.", alt: ["Je vais visiter Montmartre demain."], en: "Tomorrow I'm going to visit Montmartre." } }
      - { es: "Attention, le métro va partir !", en: "Careful, the metro is about to leave!", altEn: ["Watch out, the metro is going to leave!"], grammar: [g.futur-proche], vocab: [] }
      - { es: "Je ne vais pas rester longtemps.", en: "I'm not going to stay long.", altEn: ["I won't stay long."], grammar: [g.futur-proche, g.negation-ne-pas], vocab: [w.rester, w.longtemps], error: { wrong: "Je vais ne pas rester longtemps.", explain: "Ne … pas goes around aller, not around the infinitive: je ne vais pas rester.", grammar: g.futur-proche } }
      - { es: "Le week-end prochain, ils vont faire la fête.", en: "Next weekend they're going to party.", altEs: ["Ils vont faire la fête le week-end prochain."], altEn: ["Next weekend they're going to have a party."], grammar: [g.futur-proche], vocab: [w.prochain] }
      - { es: "Tu vas passer chez moi plus tard ?", en: "Are you going to drop by my place later?", altEs: ["Tu passes chez moi plus tard ?", "Est-ce que tu vas passer chez moi plus tard ?"], altEn: ["Will you come round to my place later?"], grammar: [g.futur-proche], vocab: [w.passer, w.plus-tard] }
      - { es: "On va se promener sur les quais.", en: "We're going to go for a walk along the quays.", altEs: ["Nous allons nous promener sur les quais."], altEn: ["We're going for a walk on the quays."], grammar: [g.futur-proche, g.on-nous], vocab: [w.se-promener], note: "The reflexive pronoun goes before the infinitive: on va se promener, je vais me promener." }
      - { es: "Le dernier métro va bientôt partir.", en: "The last metro is going to leave soon.", altEs: ["Le dernier métro part bientôt."], altEn: ["The last train is leaving soon."], grammar: [g.futur-proche], vocab: [w.dernier, w.bientôt] }
      - { es: "Vous allez aimer Paris !", en: "You're going to love Paris!", altEs: ["Tu vas aimer Paris !"], altEn: ["You'll love Paris!"], grammar: [g.futur-proche], vocab: [] }
      - { es: "Elle va passer la soirée chez des amis.", en: "She's going to spend the evening at some friends' place.", altEn: ["She's going to spend the evening with friends."], grammar: [g.futur-proche], vocab: [w.passer, w.soirée], transform: { instruction: "Make it negative", answer: "Elle ne va pas passer la soirée chez des amis.", en: "She isn't going to spend the evening at some friends' place." } }
      - { es: "Je vais à Lyon. — Ah bon ? Tu vas rester longtemps ?", en: "I'm going to Lyon. — Really? Are you going to stay long?", altEs: ["Je vais à Lyon. — Ah bon ? Et tu vas rester longtemps ?"], grammar: [g.futur-proche, g.aller-present], vocab: [w.rester, w.longtemps] }
      - { es: "À bientôt ! On va se voir la semaine prochaine.", en: "See you soon! We'll see each other next week.", altEs: ["À bientôt ! On se voit la semaine prochaine."], altEn: ["See you soon! We're going to see each other next week."], grammar: [g.futur-proche, g.on-nous], vocab: [w.bientôt, w.prochain, w.voir] }
      - { es: "Il va pleuvoir, on rentre.", en: "It's going to rain, let's go home.", altEs: ["Il va pleuvoir, on rentre à la maison."], altEn: ["It's going to rain, we're going home."], grammar: [g.futur-proche], vocab: [] }
      - { es: "Je vais aller à la boulangerie.", en: "I'm going to go to the bakery.", altEs: ["Je vais à la boulangerie."], grammar: [g.futur-proche, g.aller-present], vocab: [], error: { wrong: "Je vais à aller à la boulangerie.", explain: "No preposition between aller and the infinitive: je vais aller.", grammar: g.futur-proche } }
    exchanges:
      - q: { es: "Qu'est-ce que tu vas faire ce soir ?", en: "What are you going to do tonight?" }
        a: { es: "Je vais voir une exposition avec Julie.", en: "I'm going to see an exhibition with Julie." }
        alt: ["Rien.", "Je vais rester à la maison."]
        grammar: [g.futur-proche]
        vocab: [w.ce-soir, w.voir]
      - q: { es: "Vous allez rester longtemps à Paris ?", en: "Are you going to stay in Paris long?" }
        a: { es: "Non, une semaine seulement.", en: "No, only a week." }
        alt: ["Oui, un mois.", "Trois jours."]
        grammar: [g.futur-proche]
        vocab: [w.rester, w.longtemps]
      - q: { es: "Tu vas passer à la fête plus tard ?", en: "Are you going to come by the party later?" }
        a: { es: "Oui, je vais passer vers dix heures.", en: "Yes, I'll drop by around ten." }
        alt: ["Peut-être.", "Non, je suis fatigué."]
        grammar: [g.futur-proche]
        vocab: [w.passer, w.plus-tard]
