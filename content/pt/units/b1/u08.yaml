id: b1.u08
title: A cidade onde eu nasci
lessons:
  - id: b1.u08.l1
    title: A cidade que eu escolhi
    teach: [g.relative-que-quem]
    vocab: [w.cidade-natal, w.morador, w.região, w.município, w.população, w.monumento, w.estátua, w.patrimônio, w.ponto-turístico, w.cartão-postal, w.arquitetura, w.colonial, w.barroco, w.ladeira, w.coreto, w.elevador, w.porteiro, w.paisagem, w.vista]
    tip: "que works for people and things and can never be dropped: o livro que eu li. After a preposition, people take quem: a pessoa com quem falei."
    sentences:
      - { es: "A cidade que eu mais amo é Brasília, a minha cidade natal.", en: "The city I love most is Brasília, my home town.", altEs: ["A cidade que eu mais amo é Brasília, minha cidade natal.", "A cidade que mais amo é Brasília, a minha cidade natal."], altEn: ["The city that I love most is Brasília, my home town."], grammar: [g.relative-que-quem], vocab: [w.cidade-natal] }
      - { es: "O arquiteto que projetou a Catedral foi Oscar Niemeyer.", en: "The architect who designed the Cathedral was Oscar Niemeyer.", altEs: ["Quem projetou a Catedral foi Oscar Niemeyer."], grammar: [g.relative-que-quem], vocab: [w.arquitetura] }
      - { es: "Os moradores com quem conversei adoram morar no Plano Piloto.", en: "The residents I talked to love living in the Plano Piloto.", altEs: ["Os moradores com quem eu conversei adoram morar no Plano Piloto."], altEn: ["The residents with whom I spoke love living in the Plano Piloto."], grammar: [g.relative-que-quem], vocab: [w.morador] }
      - { es: "A Torre de TV é um ponto turístico que todo mundo visita no fim de semana.", en: "The TV Tower is a tourist attraction that everyone visits at the weekend.", altEs: ["A Torre de TV é um ponto turístico que todo o mundo visita no fim de semana."], grammar: [g.relative-que-quem], vocab: [w.ponto-turístico] }
      - { es: "A Catedral é o cartão-postal que aparece em todas as fotos da cidade.", en: "The Cathedral is the landmark that appears in every photo of the city.", grammar: [g.relative-que-quem], vocab: [w.cartão-postal] }
      - { es: "Ouro Preto tem uma arquitetura colonial que impressiona qualquer turista.", en: "Ouro Preto has colonial architecture that impresses any tourist.", grammar: [g.relative-que-quem], vocab: [w.arquitetura, w.colonial] }
      - { es: "Minha avó mora num município que tem menos de cinco mil moradores.", en: "My grandmother lives in a municipality with fewer than five thousand residents.", altEs: ["A minha avó mora num município que tem menos de cinco mil moradores.", "Minha avó mora em um município que tem menos de cinco mil moradores."], grammar: [g.relative-que-quem], vocab: [w.município, w.morador] }
      - { es: "A população que vive na região em volta de Brasília é maior que a do Plano Piloto.", en: "The population living in the region around Brasília is bigger than that of the Plano Piloto.", altEs: ["A população que mora na região em volta de Brasília é maior do que a do Plano Piloto."], grammar: [g.relative-que-quem, g.comparatives], vocab: [w.população, w.região] }
      - { es: "Salvador tem um elevador que liga a Cidade Baixa à Cidade Alta.", en: "Salvador has a lift that connects the Lower City to the Upper City.", grammar: [g.relative-que-quem], vocab: [w.elevador] }
      - { es: "Na minha cidade natal tem uma praça com um coreto que é patrimônio da cidade.", en: "In my home town there's a square with a bandstand that is part of the town's heritage.", altEs: ["Na minha cidade natal há uma praça com um coreto que é patrimônio da cidade."], grammar: [g.relative-que-quem, g.tem-there-is], vocab: [w.coreto, w.patrimônio] }
      - { es: "A estátua de que te falei fica na Praça dos Três Poderes.", en: "The statue I told you about is in the Three Powers Square.", altEs: ["A estátua de que eu te falei fica na Praça dos Três Poderes.", "A estátua que te falei fica na Praça dos Três Poderes."], grammar: [g.relative-que-quem], vocab: [w.estátua], note: "In speech the preposition often disappears (a estátua que te falei); keep it in writing." }
      - { es: "A vista que a gente tem da Torre de TV é a melhor paisagem da cidade.", en: "The view we get from the TV Tower is the best scenery in the city.", altEs: ["A vista que nós temos da Torre de TV é a melhor paisagem da cidade."], grammar: [g.relative-que-quem, g.superlatives], vocab: [w.vista, w.paisagem] }
      - { es: "O monumento que visitamos ontem foi projetado por Niemeyer.", en: "The monument we visited yesterday was designed by Niemeyer.", altEs: ["O monumento que a gente visitou ontem foi projetado por Niemeyer."], grammar: [g.relative-que-quem], vocab: [w.monumento], error: { wrong: "O monumento visitamos ontem foi projetado por Niemeyer.", explain: "English can drop 'that'; Portuguese can't: o monumento que visitamos.", grammar: g.relative-que-quem } }
      - { es: "O homem que mora ao lado sobe a ladeira de bicicleta todo dia.", en: "The man who lives next door cycles up the steep street every day.", altEs: ["O homem que mora do lado sobe a ladeira de bicicleta todos os dias."], grammar: [g.relative-que-quem], vocab: [w.ladeira], error: { wrong: "O homem quem mora ao lado sobe a ladeira de bicicleta todo dia.", explain: "quem can't follow a noun directly: o homem que mora…", grammar: g.relative-que-quem } }
      - { es: "Conheci um porteiro. Ele fala cinco línguas.", en: "I met a doorman. He speaks five languages.", grammar: [g.relative-que-quem], vocab: [w.porteiro], transform: { instruction: "Join the two sentences with que", answer: "Conheci um porteiro que fala cinco línguas.", alt: ["Eu conheci um porteiro que fala cinco línguas."] } }
      - { es: "Esta é a vizinha. Eu falei com ela.", en: "This is the neighbour. I talked to her.", grammar: [g.relative-que-quem], transform: { instruction: "Join with com quem", answer: "Esta é a vizinha com quem eu falei.", alt: ["Esta é a vizinha com quem falei.", "Essa é a vizinha com quem eu falei."] } }
    exchanges:
      - q: { es: "Qual é a sua cidade natal?", en: "What's your home town?" }
        a: { es: "É Ouro Preto, uma cidade que tem igrejas barrocas lindas.", en: "It's Ouro Preto, a town that has beautiful Baroque churches." }
        alt: ["Ouro Preto, em Minas.", "Nasci em Ouro Preto, uma cidade colonial."]
        grammar: [g.relative-que-quem]
        vocab: [w.cidade-natal, w.barroco]
      - q: { es: "Quem é aquele senhor?", en: "Who is that gentleman?" }
        a: { es: "É o porteiro que trabalha aqui há trinta anos.", en: "He's the doorman who has worked here for thirty years." }
        alt: ["É o porteiro do prédio.", "É o porteiro que conhece todo mundo."]
        grammar: [g.relative-que-quem, g.ha-faz-time]
        vocab: [w.porteiro]
      - q: { es: "O que você mais gosta em Brasília?", en: "What do you like most about Brasília?" }
        a: { es: "O que eu mais gosto é o céu, que parece um mar.", en: "What I like most is the sky, which looks like a sea." }
        alt: ["O céu, que é enorme.", "O que eu mais gosto é a arquitetura."]
        grammar: [g.relative-que-quem]
        vocab: [w.arquitetura]
      - q: { es: "Qual é o cartão-postal da cidade?", en: "What's the city's landmark?" }
        a: { es: "A Catedral, que parece duas mãos abertas para o céu.", en: "The Cathedral, which looks like two hands open to the sky." }
        alt: ["A Catedral.", "É a Catedral, que todo mundo fotografa."]
        grammar: [g.relative-que-quem]
        vocab: [w.cartão-postal]
      - q: { es: "Com quem você foi à Torre de TV?", en: "Who did you go to the TV Tower with?" }
        a: { es: "Com a prima de quem te falei, a que mora na Asa Sul.", en: "With the cousin I told you about, the one who lives in the Asa Sul." }
        alt: ["Com a minha prima.", "Com uns amigos de quem eu gosto muito."]
        grammar: [g.relative-que-quem]
        vocab: [w.ponto-turístico]
    texts:
      - title: "Cartão-postal de Brasília"
        es: ["Oi, mãe! Estou na cidade que o Niemeyer desenhou.", "O hotel que reservamos fica perto do Eixo Monumental.", "O que mais me impressiona é o céu: é enorme!"]
        en: ["Hi Mum! I'm in the city Niemeyer drew.", "The hotel we booked is near the Monumental Axis.", "What impresses me most is the sky: it's enormous!"]
        grammar: [g.relative-que-quem]
        vocab: [w.cartão-postal]
      - title: "Guia de bolso"
        es: ["A Praça dos Três Poderes é um ponto turístico que você não pode perder.", "Lá fica a estátua dos Candangos, que homenageia os trabalhadores que construíram a cidade.", "Quem gosta de arquitetura deve voltar à noite, com as luzes acesas."]
        en: ["The Three Powers Square is a tourist attraction you can't miss.", "That's where the Candangos statue stands, honouring the workers who built the city.", "Anyone who likes architecture should come back at night, with the lights on."]
        grammar: [g.relative-que-quem]
        vocab: [w.ponto-turístico, w.estátua, w.arquitetura]
    spicy:
      - { es: "Você é o ponto turístico que eu mais quero visitar nesta cidade.", en: "You're the tourist attraction I most want to visit in this city.", altEs: ["Você é o ponto turístico que eu mais quero conhecer nesta cidade."], grammar: [g.relative-que-quem], vocab: [w.ponto-turístico] }
      - { es: "O que eu mais gosto em você é o jeito como você ri.", en: "What I like most about you is the way you laugh.", altEs: ["O que eu mais gosto em você é o seu jeito de rir."], grammar: [g.relative-que-quem] }
      - { es: "O porteiro que me deu o seu recado merece um aumento.", en: "The doorman who gave me your message deserves a raise.", grammar: [g.relative-que-quem], vocab: [w.porteiro] }
      - { es: "A pessoa com quem eu quero ver o pôr do sol no lago é você.", en: "The person I want to watch the sunset on the lake with is you.", altEs: ["A pessoa com quem quero ver o pôr do sol no lago é você."], grammar: [g.relative-que-quem] }
      - { es: "Quem tem uma vista dessas da janela não precisa de cartão-postal.", en: "Anyone with a view like that from the window doesn't need a postcard.", grammar: [g.relative-que-quem], vocab: [w.vista, w.cartão-postal] }

  - id: b1.u08.l2
    title: O bairro onde eu cresci
    teach: [g.relative-onde-cujo]
    vocab: [w.cujo, w.clima, w.natureza, w.rural, w.urbano, w.violência, w.segurança, w.poluição, w.transporte-público, w.crescimento, w.desenvolvimento, w.comércio, w.indústria, w.prefeito, w.caminho-de-casa, w.beco, w.viaduto, w.túnel, w.zona, w.favela, w.condomínio, w.subúrbio, w.orla, w.calçadão, w.governador, w.governar, w.espaço]
    tip: "onde for places, em que for times (o dia em que te conheci), cujo for 'whose'. cujo agrees with the thing owned and never takes an article: cujo livro, cuja mãe."
    sentences:
      - { es: "Brasília é a cidade onde eu nasci e onde quero viver para sempre.", en: "Brasília is the city where I was born and where I want to live forever.", altEs: ["Brasília é a cidade em que eu nasci e onde quero viver para sempre.", "Brasília é a cidade onde nasci e onde quero morar para sempre."], grammar: [g.relative-onde-cujo] }
      - { es: "O Rio, onde morei dez anos, tem uma orla linda, mas sofre com a violência.", en: "Rio, where I lived for ten years, has a beautiful seafront, but it suffers from violence.", altEs: ["O Rio, onde eu morei dez anos, tem uma orla linda, mas sofre com a violência."], grammar: [g.relative-onde-cujo], vocab: [w.orla, w.violência] }
      - { es: "O calçadão de Copacabana, cujo desenho lembra as ondas do mar, é famoso no mundo todo.", en: "The Copacabana promenade, whose pattern recalls the waves of the sea, is famous all over the world.", altEs: ["O calçadão de Copacabana, cujo desenho lembra as ondas do mar, é famoso no mundo inteiro."], grammar: [g.relative-onde-cujo], vocab: [w.calçadão, w.cujo] }
      - { es: "Tenho uma amiga cuja família mora numa favela do Rio.", en: "I have a friend whose family lives in a favela in Rio.", altEs: ["Eu tenho uma amiga cuja família mora numa favela do Rio."], grammar: [g.relative-onde-cujo], vocab: [w.cujo, w.favela] }
      - { es: "Brasília não tem prefeito: quem governa é o governador do Distrito Federal.", en: "Brasília has no mayor: the one who governs is the governor of the Federal District.", grammar: [g.relative-que-quem], vocab: [w.prefeito, w.governar, w.governador] }
      - { es: "Moramos num condomínio onde a segurança funciona vinte e quatro horas.", en: "We live in a gated community where security works twenty-four hours a day.", altEs: ["A gente mora num condomínio onde a segurança funciona vinte e quatro horas."], grammar: [g.relative-onde-cujo], vocab: [w.condomínio, w.segurança] }
      - { es: "No caminho de casa, passo por um túnel e por dois viadutos.", en: "On the way home, I go through a tunnel and over two flyovers.", altEs: ["No caminho de casa, eu passo por um túnel e por dois viadutos."], grammar: [g.contractions-por], vocab: [w.caminho-de-casa, w.túnel, w.viaduto] }
      - { es: "Evite o beco atrás da rodoviária à noite: não é uma zona segura.", en: "Avoid the alley behind the bus station at night: it isn't a safe area.", altEs: ["Evita o beco atrás da rodoviária à noite, não é uma zona segura."], grammar: [g.imperative-formal], vocab: [w.beco, w.zona] }
      - { es: "As cidades em volta do Plano Piloto, onde vive a maior parte da população, tiveram um crescimento muito rápido.", en: "The towns around the Plano Piloto, where most of the population lives, grew very fast.", grammar: [g.relative-onde-cujo], vocab: [w.crescimento] }
      - { es: "Prefiro a vida rural, onde o clima é mais tranquilo e a natureza está perto.", en: "I prefer country life, where the atmosphere is calmer and nature is close.", altEs: ["Prefiro a vida no campo, onde o clima é mais tranquilo e a natureza está perto."], grammar: [g.relative-onde-cujo], vocab: [w.rural, w.clima, w.natureza] }
      - { es: "A vida urbana tem poluição e trânsito, mas também tem comércio e cultura.", en: "Urban life has pollution and traffic, but it also has shops and culture.", grammar: [g.tem-there-is], vocab: [w.urbano, w.poluição, w.comércio] }
      - { es: "O subúrbio onde eu morava não tinha um bom transporte público.", en: "The suburb where I used to live didn't have good public transport.", altEs: ["O subúrbio em que eu morava não tinha um bom transporte público."], grammar: [g.relative-onde-cujo, g.imperfect], vocab: [w.subúrbio, w.transporte-público] }
      - { es: "É uma capital cujo desenvolvimento foi planejado desde o início, sem espaço para a indústria.", en: "It's a capital whose development was planned from the start, with no room for industry.", grammar: [g.relative-onde-cujo], vocab: [w.desenvolvimento, w.indústria, w.cujo] }
      - { es: "Tenho um vizinho cujo filho é piloto de avião.", en: "I have a neighbour whose son is an airline pilot.", altEs: ["Eu tenho um vizinho cujo filho é piloto de avião."], grammar: [g.relative-onde-cujo], vocab: [w.cujo], error: { wrong: "Tenho um vizinho cujo o filho é piloto de avião.", explain: "cujo never takes an article after it: cujo filho, not cujo o filho.", grammar: g.relative-onde-cujo } }
      - { es: "Esta é a rua. Eu cresci nesta rua.", en: "This is the street. I grew up on this street.", grammar: [g.relative-onde-cujo], transform: { instruction: "Join the sentences with onde", answer: "Esta é a rua onde eu cresci.", alt: ["Esta é a rua em que eu cresci.", "Esta é a rua onde cresci.", "Essa é a rua onde eu cresci."] } }
      - { es: "Conheci um artista. Os quadros dele estão no museu.", en: "I met an artist. His paintings are in the museum.", grammar: [g.relative-onde-cujo], transform: { instruction: "Join the sentences with cujo", answer: "Conheci um artista cujos quadros estão no museu.", alt: ["Eu conheci um artista cujos quadros estão no museu."] } }
    exchanges:
      - q: { es: "Onde você cresceu?", en: "Where did you grow up?" }
        a: { es: "Num subúrbio onde todo mundo se conhecia.", en: "In a suburb where everybody knew each other." }
        alt: ["Num bairro do subúrbio.", "Em Taguatinga, onde meus avós moram até hoje."]
        grammar: [g.relative-onde-cujo]
        vocab: [w.subúrbio]
      - q: { es: "Como é morar em Brasília?", en: "What's it like living in Brasília?" }
        a: { es: "É uma cidade onde tudo é longe, mas onde o céu é lindo.", en: "It's a city where everything is far away, but where the sky is beautiful." }
        alt: ["Tudo é longe, mas o céu é lindo.", "É ótimo, mas sem carro é difícil."]
        grammar: [g.relative-onde-cujo]
      - q: { es: "Qual é o maior problema da sua cidade?", en: "What's the biggest problem in your city?" }
        a: { es: "A violência, e também a poluição nas zonas onde tem indústria.", en: "Violence, and also pollution in the areas where there's industry." }
        alt: ["A falta de segurança.", "O transporte público, que é muito ruim."]
        grammar: [g.relative-onde-cujo]
        vocab: [w.violência, w.poluição, w.zona, w.indústria]
      - q: { es: "Brasília tem prefeito?", en: "Does Brasília have a mayor?" }
        a: { es: "Não, quem governa é o governador do Distrito Federal.", en: "No, the one who governs is the governor of the Federal District." }
        alt: ["Não, tem governador.", "Não tem, quem manda é o governador."]
        grammar: [g.relative-que-quem]
        vocab: [w.prefeito, w.governador, w.governar]
      - q: { es: "Você lembra do dia em que chegou aqui?", en: "Do you remember the day you arrived here?" }
        a: { es: "Lembro: foi em agosto, na época em que não chove nunca.", en: "I do: it was in August, at the time of year when it never rains." }
        alt: ["Lembro, foi em agosto.", "Lembro, estava tudo seco."]
        grammar: [g.relative-onde-cujo]
        vocab: [w.clima]
    texts:
      - title: "Minha cidade natal"
        es: ["Nasci em Taguatinga, uma cidade onde muita gente trabalha no comércio.", "Meu pai, cujos pais vieram do Nordeste para construir Brasília, ainda mora lá.", "No caminho de casa, a gente passava por um viaduto onde vendiam pamonha."]
        en: ["I was born in Taguatinga, a town where lots of people work in shops.", "My father, whose parents came from the Northeast to build Brasília, still lives there.", "On the way home we used to go under a flyover where they sold pamonha."]
        grammar: [g.relative-onde-cujo]
        vocab: [w.comércio, w.cujo, w.caminho-de-casa, w.viaduto]
    spicy:
      - { es: "Me mostra o lugar onde você costuma ver o pôr do sol?", en: "Will you show me the place where you usually watch the sunset?", altEs: ["Você me mostra o lugar onde costuma ver o pôr do sol?"], grammar: [g.relative-onde-cujo, g.costumar] }
      - { es: "Você é a pessoa cujo telefone eu sei de cor.", en: "You're the person whose number I know by heart.", grammar: [g.relative-onde-cujo], vocab: [w.cujo] }
      - { es: "Este é o calçadão onde a gente se viu pela primeira vez, lembra?", en: "This is the promenade where we first saw each other, remember?", altEs: ["Este é o calçadão onde nos vimos pela primeira vez, lembra?"], grammar: [g.relative-onde-cujo], vocab: [w.calçadão] }
      - { es: "Lembro o dia em que te conheci: você tinha derramado café na minha camisa.", en: "I remember the day I met you: you had spilled coffee on my shirt.", altEs: ["Lembro do dia em que te conheci: você tinha derramado café na minha camisa."], grammar: [g.relative-onde-cujo, g.pluperfect] }
      - { es: "Moro num condomínio cujo porteiro já sabe o seu nome.", en: "I live in a building whose doorman already knows your name.", grammar: [g.relative-onde-cujo], vocab: [w.condomínio, w.cujo] }

  - id: b1.u08.l3
    title: O motivo pelo qual eu sempre volto
    teach: [g.relative-o-qual]
    vocab: [w.o-qual, w.camelô, w.feirante, w.lembrancinha, w.artesanato, w.artesão, w.cerâmica, w.renda, w.sociedade, w.social, w.cultural, w.principal, w.próprio, w.proteger, w.barraca, w.área, w.direto]
    tip: "o qual, a qual, os quais, as quais agree with the noun they refer to and come after longer prepositions: a feira sobre a qual falei, o motivo pelo qual saí."
    sentences:
      - { es: "A feira sobre a qual te falei fica ao lado da Torre de TV.", en: "The market I told you about is next to the TV Tower.", altEs: ["A feira sobre a qual eu te falei fica ao lado da Torre de TV.", "A feira de que te falei fica ao lado da Torre de TV."], grammar: [g.relative-o-qual], vocab: [w.o-qual] }
      - { es: "Os artesãos com os quais conversei vêm de várias regiões do Brasil.", en: "The craftspeople I talked to come from various regions of Brazil.", altEs: ["Os artesãos com quem conversei vêm de várias regiões do Brasil."], grammar: [g.relative-o-qual], vocab: [w.artesão, w.região] }
      - { es: "Esse é o motivo pelo qual eu sempre volto à Feira da Torre.", en: "That's the reason why I always go back to the TV Tower market.", altEs: ["Esse é o motivo por que eu sempre volto à Feira da Torre.", "Esse é o motivo pelo qual sempre volto à Feira da Torre."], grammar: [g.relative-o-qual], vocab: [w.o-qual], transform: { instruction: "Make it plural: Esses são os motivos…", answer: "Esses são os motivos pelos quais eu sempre volto à Feira da Torre.", alt: ["Esses são os motivos pelos quais sempre volto à Feira da Torre.", "Estes são os motivos pelos quais eu sempre volto à Feira da Torre."] } }
      - { es: "A cerâmica do Vale do Jequitinhonha, da qual os turistas tanto gostam, é feita à mão.", en: "The pottery from the Jequitinhonha Valley, which tourists like so much, is handmade.", altEs: ["A cerâmica do Vale do Jequitinhonha, de que os turistas tanto gostam, é feita à mão."], grammar: [g.relative-o-qual], vocab: [w.cerâmica] }
      - { es: "Comprei uma toalha de renda para a minha mãe, a qual adora coisas feitas à mão.", en: "I bought a lace tablecloth for my mother, who loves handmade things.", altEs: ["Comprei uma toalha de renda para minha mãe, a qual adora coisas feitas à mão."], grammar: [g.relative-o-qual], vocab: [w.renda], note: "a qual makes it clear that it's the mother (not the tablecloth) who loves handmade things." }
      - { es: "O feirante para o qual eu trabalhava tinha a própria barraca.", en: "The market trader I used to work for had his own stall.", altEs: ["O feirante para quem eu trabalhava tinha a própria barraca."], grammar: [g.relative-o-qual, g.imperfect], vocab: [w.feirante, w.próprio, w.barraca] }
      - { es: "As lembrancinhas, entre as quais havia chaveiros e camisetas, custavam cinco reais.", en: "The souvenirs, among which there were key rings and T-shirts, cost five reais.", grammar: [g.relative-o-qual], vocab: [w.lembrancinha] }
      - { es: "A sociedade na qual vivemos precisa proteger o trabalho dos artesãos.", en: "The society we live in needs to protect the work of craftspeople.", altEs: ["A sociedade em que vivemos precisa proteger o trabalho dos artesãos."], grammar: [g.relative-o-qual], vocab: [w.sociedade, w.proteger, w.artesão] }
      - { es: "É um projeto social através do qual as artesãs vendem o próprio trabalho.", en: "It's a social project through which the craftswomen sell their own work.", grammar: [g.relative-o-qual], vocab: [w.social, w.próprio] }
      - { es: "O camelô perto do qual estacionamos vendia de tudo.", en: "The street vendor we parked near was selling everything.", altEs: ["O camelô perto de quem estacionamos vendia de tudo."], grammar: [g.relative-o-qual], vocab: [w.camelô] }
      - { es: "A renda que ela ganha na feira paga o aluguel e a escola dos filhos.", en: "The income she earns at the market pays the rent and the children's school.", grammar: [g.relative-que-quem], vocab: [w.renda], note: "renda = lace and also income." }
      - { es: "A área principal da feira, na qual ficam as barracas de comida, abre às nove.", en: "The main area of the market, where the food stalls are, opens at nine.", altEs: ["A área principal da feira, onde ficam as barracas de comida, abre às nove."], grammar: [g.relative-o-qual], vocab: [w.área, w.principal, w.barraca] }
      - { es: "Tem um ônibus direto para a feira, o qual sai da rodoviária a cada meia hora.", en: "There's a direct bus to the market, which leaves the bus station every half hour.", altEs: ["Tem um ônibus direto para a feira, que sai da rodoviária a cada meia hora."], grammar: [g.relative-o-qual, g.tem-there-is], vocab: [w.direto] }
      - { es: "A razão pela qual ela vende na feira é simples: gosta de gente.", en: "The reason she sells at the market is simple: she likes people.", grammar: [g.relative-o-qual], error: { wrong: "A razão pelo qual ela vende na feira é simples: gosta de gente.", explain: "o qual agrees with its noun: a razão → pela qual.", grammar: g.relative-o-qual } }
      - { es: "O artesanato que comprei é de Minas.", en: "The crafts I bought are from Minas.", altEs: ["O artesanato que eu comprei é de Minas."], grammar: [g.relative-o-qual], vocab: [w.artesanato], error: { wrong: "O artesanato o qual comprei é de Minas.", explain: "Without a preposition, use que: o artesanato que comprei.", grammar: g.relative-o-qual } }
      - { es: "Esta é a empresa que eu trabalho.", en: "This is the company I work for.", grammar: [g.relative-o-qual], note: "Colloquial: the preposition has disappeared.", transform: { instruction: "Make it formal with para a qual", answer: "Esta é a empresa para a qual eu trabalho.", alt: ["Esta é a empresa para a qual trabalho.", "Essa é a empresa para a qual eu trabalho."] } }
    exchanges:
      - q: { es: "Por que você sempre volta à Feira da Torre?", en: "Why do you always go back to the TV Tower market?" }
        a: { es: "Pelo mesmo motivo pelo qual todo mundo volta: o pastel e o artesanato.", en: "For the same reason everybody does: the pastel and the crafts." }
        alt: ["Por causa do pastel.", "Pelo artesanato, que é lindo."]
        grammar: [g.relative-o-qual]
        vocab: [w.artesanato]
      - q: { es: "Quem fez essa cerâmica?", en: "Who made this pottery?" }
        a: { es: "Uma artesã do Jequitinhonha, com a qual eu falo toda semana.", en: "A craftswoman from the Jequitinhonha valley, who I talk to every week." }
        alt: ["Uma artesã de Minas.", "Uma senhora do Jequitinhonha, com quem eu falo toda semana."]
        grammar: [g.relative-o-qual]
        vocab: [w.cerâmica, w.artesão]
      - q: { es: "Essa renda é feita à mão?", en: "Is this lace handmade?" }
        a: { es: "É, sim. É uma tradição cultural da qual a gente tem muito orgulho.", en: "Yes, it is. It's a cultural tradition we're very proud of." }
        alt: ["É, sim, feita à mão.", "É, sim, por artesãs da região."]
        grammar: [g.relative-o-qual]
        vocab: [w.renda, w.cultural]
      - q: { es: "Quanto custa essa lembrancinha?", en: "How much is this souvenir?" }
        a: { es: "Dez reais; se você levar três, faço por vinte e cinco.", en: "Ten reais; if you take three, I'll do them for twenty-five." }
        alt: ["Dez reais.", "Dez, mas três saem por vinte e cinco."]
        grammar: [g.future-subjunctive-se]
        vocab: [w.lembrancinha]
      - q: { es: "Você conhece algum projeto social aqui?", en: "Do you know any social project here?" }
        a: { es: "Conheço um, através do qual os jovens aprendem música.", en: "I know one, through which young people learn music." }
        alt: ["Conheço um de música para jovens.", "Não conheço nenhum."]
        grammar: [g.relative-o-qual]
        vocab: [w.social]
    texts:
      - title: "Placa na entrada da feira"
        es: ["Feira da Torre de TV: artesanato, comida e cultura.", "Os produtos, entre os quais há cerâmica e renda, são feitos por artesãos da região.", "Ao comprar aqui, você protege o trabalho local."]
        en: ["TV Tower Market: crafts, food and culture.", "The products, among which there are pottery and lace, are made by craftspeople from the region.", "When you buy here, you protect local work."]
        grammar: [g.relative-o-qual]
        vocab: [w.artesanato, w.cerâmica, w.renda, w.proteger]
    spicy:
      - { es: "Esse é o motivo pelo qual eu cheguei atrasado: fiquei olhando você na fila.", en: "That's the reason I was late: I stood there looking at you in the queue.", altEs: ["Esse é o motivo pelo qual cheguei atrasado: fiquei te olhando na fila."], grammar: [g.relative-o-qual], vocab: [w.o-qual] }
      - { es: "O feirante com o qual você conversou tanto me deu um pastel de graça. Obrigado!", en: "The market trader you chatted with so much gave me a free pastel. Thanks!", grammar: [g.relative-o-qual], vocab: [w.feirante] }
      - { es: "A pessoa com a qual eu quero dividir este pastel está na minha frente.", en: "The person I want to share this pastel with is right in front of me.", altEs: ["A pessoa com quem eu quero dividir este pastel está na minha frente."], grammar: [g.relative-o-qual] }
      - { es: "Comprei uma rede na feira, na qual cabem duas pessoas. Só estou informando.", en: "I bought a hammock at the market that fits two people. Just letting you know.", grammar: [g.relative-o-qual] }
      - { es: "A lembrancinha que eu trouxe para você sou eu mesmo.", en: "The souvenir I brought you is me.", altEs: ["A lembrancinha que eu te trouxe sou eu mesmo.", "A lembrancinha que eu trouxe para você sou eu mesma."], grammar: [g.relative-que-quem], vocab: [w.lembrancinha] }

  - id: b1.u08.l4
    title: Procuro um apartamento que tenha varanda
    teach: [g.relative-subjunctive]
    vocab: [w.moradia, w.imóvel, w.imobiliária, w.proprietário, w.inquilino, w.mobiliado, w.reforma, w.acessível, w.reciclar, w.reciclagem, w.meio-ambiente, w.desmatamento, w.sustentável, w.queimada, w.aquecimento-global, w.energia, w.solar, w.seca, w.enchente, w.inundação, w.deslizamento, w.fumaça, w.teto]
    tip: "Looking for something that may not exist? Subjunctive: Procuro um apartamento que tenha varanda. Talking about one you know? Indicative: Moro num apartamento que tem varanda."
    sentences:
      - { es: "Procuro um apartamento que tenha varanda e fique perto do metrô.", en: "I'm looking for a flat that has a balcony and is near the metro.", altEs: ["Estou procurando um apartamento que tenha varanda e fique perto do metrô.", "Procuro um apartamento que tenha varanda e seja perto do metrô."], grammar: [g.relative-subjunctive], error: { wrong: "Procuro um apartamento que tem varanda e fica perto do metrô.", explain: "You're looking for any flat like that, not a known one: subjunctive (tenha, fique).", grammar: g.relative-subjunctive } }
      - { es: "Moro num apartamento que tem varanda, mas não tem elevador.", en: "I live in a flat that has a balcony, but no lift.", altEs: ["Moro em um apartamento que tem varanda, mas não tem elevador."], grammar: [g.relative-subjunctive], vocab: [w.elevador], note: "A real, known flat: indicative (tem)." }
      - { es: "Você conhece alguma imobiliária que trabalhe com imóveis mobiliados?", en: "Do you know any estate agency that deals with furnished properties?", altEs: ["Você conhece alguma imobiliária que trabalhe com imóvel mobiliado?"], grammar: [g.relative-subjunctive], vocab: [w.imobiliária, w.imóvel, w.mobiliado] }
      - { es: "Não há nenhum imóvel nessa região que seja acessível para um estudante.", en: "There's no property in that area that's affordable for a student.", altEs: ["Não tem nenhum imóvel nessa região que seja acessível para um estudante."], grammar: [g.relative-subjunctive], vocab: [w.imóvel, w.acessível] }
      - { es: "O proprietário quer um inquilino que pague em dia e não faça barulho.", en: "The landlord wants a tenant who pays on time and doesn't make noise.", altEs: ["O dono quer um inquilino que pague em dia e não faça barulho."], grammar: [g.relative-subjunctive, g.subjunctive-irregular], vocab: [w.proprietário, w.inquilino] }
      - { es: "Precisamos de uma moradia que seja sustentável e use energia solar.", en: "We need housing that is sustainable and uses solar power.", altEs: ["A gente precisa de uma moradia que seja sustentável e use energia solar."], grammar: [g.relative-subjunctive], vocab: [w.moradia, w.sustentável, w.energia, w.solar] }
      - { es: "Quem chegar atrasado à reunião do condomínio não vota.", en: "Whoever arrives late to the residents' meeting doesn't vote.", altEs: ["Os que chegarem atrasados à reunião do condomínio não votam."], grammar: [g.relative-subjunctive, g.future-subjunctive-relative], vocab: [w.condomínio] }
      - { es: "O prédio precisa de uma reforma que acabe com o vazamento do teto.", en: "The building needs a renovation that will put an end to the leak in the ceiling.", grammar: [g.relative-subjunctive], vocab: [w.reforma, w.vazamento] }
      - { es: "Na seca, há queimadas que destroem grandes áreas de cerrado.", en: "In the dry season, there are fires that destroy large areas of cerrado.", altEs: ["Na época da seca, há queimadas que destroem grandes áreas de cerrado."], grammar: [g.relative-subjunctive], vocab: [w.seca, w.queimada, w.área], note: "A known fact: indicative (destroem)." }
      - { es: "Queremos políticos que levem a sério o desmatamento e o aquecimento global.", en: "We want politicians who take deforestation and global warming seriously.", altEs: ["A gente quer políticos que levem a sério o desmatamento e o aquecimento global."], grammar: [g.relative-subjunctive], vocab: [w.desmatamento, w.aquecimento-global] }
      - { es: "No meu prédio, não tem ninguém que recicle o lixo direito.", en: "In my building, there's nobody who recycles their rubbish properly.", altEs: ["No meu prédio, não há ninguém que recicle o lixo direito."], grammar: [g.relative-subjunctive], vocab: [w.reciclar] }
      - { es: "A reciclagem é um hábito que protege o meio ambiente.", en: "Recycling is a habit that protects the environment.", grammar: [g.relative-que-quem], vocab: [w.reciclagem, w.meio-ambiente] }
      - { es: "Enchentes, inundações e deslizamentos são comuns em cidades que crescem sem planejamento.", en: "Floods and landslides are common in cities that grow without planning.", grammar: [g.relative-que-quem], vocab: [w.enchente, w.inundação, w.deslizamento] }
      - { es: "Não conheço nenhum inquilino que esteja contente com o proprietário.", en: "I don't know any tenant who's happy with the landlord.", grammar: [g.relative-subjunctive], vocab: [w.inquilino, w.proprietário], error: { wrong: "Não conheço nenhum inquilino que está contente com o proprietário.", explain: "After a negative (nenhum, ninguém) the relative clause takes the subjunctive: esteja.", grammar: g.relative-subjunctive } }
      - { es: "Moro numa casa que tem energia solar.", en: "I live in a house that has solar power.", grammar: [g.relative-subjunctive], vocab: [w.energia, w.solar], transform: { instruction: "Turn it into a search: start with Procuro", answer: "Procuro uma casa que tenha energia solar.", alt: ["Procuro uma casa que tenha energia solar.", "Eu procuro uma casa que tenha energia solar.", "Estou procurando uma casa que tenha energia solar."] } }
      - { es: "Conheço alguém que recicla tudo.", en: "I know someone who recycles everything.", grammar: [g.relative-subjunctive], vocab: [w.reciclar], transform: { instruction: "Make it negative (Não conheço ninguém…)", answer: "Não conheço ninguém que recicle tudo.", alt: ["Eu não conheço ninguém que recicle tudo."] } }
    exchanges:
      - q: { es: "Que tipo de apartamento vocês procuram?", en: "What kind of flat are you looking for?" }
        a: { es: "Um que seja mobiliado e que aceite cachorro.", en: "One that's furnished and accepts dogs." }
        alt: ["Um mobiliado, que aceite cachorro.", "Um que tenha varanda e aceite cachorro."]
        grammar: [g.relative-subjunctive]
        vocab: [w.mobiliado]
      - q: { es: "Tem algum imóvel que seja acessível nesse bairro?", en: "Is there any affordable property in this neighbourhood?" }
        a: { es: "Tem um, mas precisa de reforma.", en: "There's one, but it needs renovating." }
        alt: ["Não tem nenhum que seja barato aqui.", "Tem, mas é bem pequeno."]
        grammar: [g.relative-subjunctive]
        vocab: [w.imóvel, w.acessível, w.reforma]
      - q: { es: "O proprietário aceitou a proposta?", en: "Did the landlord accept the offer?" }
        a: { es: "Aceitou, mas quer um inquilino que fique pelo menos um ano.", en: "He did, but he wants a tenant who'll stay at least a year." }
        alt: ["Aceitou, sim.", "Ainda não, quer alguém que fique mais tempo."]
        grammar: [g.relative-subjunctive]
        vocab: [w.proprietário, w.inquilino]
      - q: { es: "Por que o céu fica cheio de fumaça em setembro?", en: "Why is the sky full of smoke in September?" }
        a: { es: "Por causa das queimadas: na seca, qualquer fogo vira um problema enorme.", en: "Because of the fires: in the dry season, any fire becomes a huge problem." }
        alt: ["Por causa das queimadas.", "É a seca, e as queimadas."]
        grammar: [g.connectors-cause-consequence]
        vocab: [w.fumaça, w.queimada, w.seca]
      - q: { es: "O que a gente pode fazer pelo meio ambiente?", en: "What can we do for the environment?" }
        a: { es: "Reciclar, economizar energia e votar em quem proteja o cerrado.", en: "Recycle, save energy and vote for people who will protect the cerrado." }
        alt: ["Reciclar e economizar energia.", "Usar menos o carro e reciclar."]
        grammar: [g.relative-subjunctive]
        vocab: [w.meio-ambiente, w.reciclar, w.energia]
    texts:
      - title: "Anúncio no grupo do bairro"
        es: ["Procuro apartamento de um quarto, mobiliado, que fique na Asa Norte.", "Prefiro um prédio que tenha elevador e porteiro.", "Pago até dois mil reais. Falar com a Heloísa."]
        en: ["Looking for a furnished one-bedroom flat in the Asa Norte.", "I'd prefer a building with a lift and a doorman.", "I can pay up to two thousand reais. Speak to Heloísa."]
        grammar: [g.relative-subjunctive]
        vocab: [w.mobiliado, w.elevador, w.porteiro]
      - title: "Notícia do dia"
        es: ["A seca deste ano foi a mais longa dos últimos tempos.", "As queimadas destruíram uma área enorme de cerrado.", "Os moradores pedem medidas que protejam o meio ambiente."]
        en: ["This year's drought was the longest in recent times.", "The fires destroyed a huge area of cerrado.", "Residents are calling for measures that protect the environment."]
        grammar: [g.relative-subjunctive]
        vocab: [w.seca, w.queimada, w.meio-ambiente]
    spicy:
      - { es: "Procuro alguém que dance mal, para eu não passar vergonha sozinho.", en: "I'm looking for someone who dances badly, so I'm not embarrassed on my own.", altEs: ["Procuro alguém que dance mal, para não passar vergonha sozinho.", "Procuro alguém que dance mal, para eu não passar vergonha sozinha."], grammar: [g.relative-subjunctive] }
      - { es: "Não existe ninguém que faça um café tão bom quanto o seu.", en: "There's nobody who makes coffee as good as yours.", altEs: ["Não há ninguém que faça um café tão bom quanto o seu."], grammar: [g.relative-subjunctive, g.comparatives] }
      - { es: "Quero um namorado que recicle, cozinhe e ainda me faça rir.", en: "I want a boyfriend who recycles, cooks and makes me laugh too.", altEs: ["Quero uma namorada que recicle, cozinhe e ainda me faça rir."], grammar: [g.relative-subjunctive], vocab: [w.reciclar] }
      - { es: "Procuro um inquilino para o meu coração: alguém que seja carinhoso e pague em beijos.", en: "I'm looking for a tenant for my heart: someone who's affectionate and pays in kisses.", grammar: [g.relative-subjunctive], vocab: [w.inquilino] }
      - { es: "Quem quiser dividir o guarda-chuva comigo, que se aproxime.", en: "Whoever wants to share my umbrella, come closer.", grammar: [g.relative-subjunctive, g.future-subjunctive-relative], vocab: [w.aproximar-se] }
dialogues:
  - id: b1.u08.d1
    title: Na imobiliária
    context: Heloísa has just moved from Ouro Preto to Brasília for a job. Otávio, an estate agent, shows her what's available.
    lines:
      - { speaker: Otávio, es: "Bom dia! Em que posso ajudar?", en: "Good morning! How can I help?" }
      - { speaker: Heloísa, es: "Bom dia. Acabei de me mudar de Ouro Preto e procuro um apartamento que fique perto do trabalho.", en: "Good morning. I've just moved from Ouro Preto and I'm looking for a flat that's near my work." }
      - { speaker: Otávio, es: "E onde você trabalha?", en: "And where do you work?" }
      - { speaker: Heloísa, es: "Num ministério, na Esplanada. Quero um lugar que tenha ônibus direto para lá.", en: "At a ministry, on the Esplanade. I want somewhere with a direct bus there." }
      - { speaker: Otávio, es: "Tenho um na Asa Norte, numa superquadra cujos prédios têm porteiro vinte e quatro horas.", en: "I have one in the Asa Norte, in a superblock whose buildings have a doorman twenty-four hours a day." }
      - { speaker: Heloísa, es: "É mobiliado? Não tenho quase nada, só a cerâmica que trouxe de Minas.", en: "Is it furnished? I have almost nothing, just the pottery I brought from Minas." }
      - { speaker: Otávio, es: "É, sim. O proprietário, com o qual falei ontem, só pede um inquilino que cuide bem do imóvel.", en: "Yes, it is. The landlord, who I spoke to yesterday, only asks for a tenant who'll look after the property." }
      - { speaker: Heloísa, es: "E o aluguel? Preciso de algo que seja acessível.", en: "And the rent? I need something affordable." }
      - { speaker: Otávio, es: "Dois mil e duzentos, com condomínio. É o mais barato que eu tenho naquela região.", en: "Two thousand two hundred, including the service charge. It's the cheapest I have in that area." }
      - { speaker: Heloísa, es: "Não tem nenhum que custe menos de dois mil?", en: "Isn't there one that costs less than two thousand?" }
      - { speaker: Otávio, es: "Em Taguatinga tem, mas aí você vai passar duas horas por dia no transporte público.", en: "There is in Taguatinga, but then you'll spend two hours a day on public transport." }
      - { speaker: Heloísa, es: "Então vamos ver o da Asa Norte. O que eu mais quero é chegar cedo em casa!", en: "Then let's see the one in the Asa Norte. What I want most is to get home early!" }
    questions:
      - { q: "De onde a Heloísa se mudou?", options: ["De Taguatinga", "De Ouro Preto", "Da Asa Norte"], answer: 1, explain: "Acabei de me mudar de Ouro Preto." }
      - { q: "Que tipo de apartamento ela procura?", options: ["Um que tenha ônibus direto para a Esplanada", "Um que tenha varanda e piscina", "Um que fique em Taguatinga"], answer: 0, explain: "Quero um lugar que tenha ônibus direto para lá — to the Esplanade, where she works." }
      - { q: "O que o proprietário pede?", options: ["Um inquilino que pague um ano adiantado", "Um inquilino que cuide bem do imóvel", "Um inquilino que tenha carro"], answer: 1, explain: "Só pede um inquilino que cuide bem do imóvel." }
      - { q: "Por que a Heloísa prefere o apartamento da Asa Norte?", options: ["Porque o aluguel é mais barato", "Porque tem varanda", "Porque quer passar menos tempo no transporte"], answer: 2, explain: "The Taguatinga flat is cheaper, but she would spend two hours a day on public transport; she wants to get home early." }
writing:
  - task: "Describe the city where you were born, using relative words (a cidade onde…, que…, cujo / cuja…)."
    min: 50
    max: 100
    use: [w.cidade-natal, w.morador, w.região, w.paisagem, w.cartão-postal]
    useAtLeast: 3
    grammar: [g.relative-que-quem, g.relative-onde-cujo]
    expect:
      - { pattern: '\b(onde|cujo|cuja|cujos|cujas|em que|no qual|na qual)\b', hint: "Use relative words: a cidade onde nasci, a estufa cuja…" }
      - { pattern: '\b[a-zà-ú]+ que (eu|a gente|n[oó]s|todo|todos|parece|parecem|fica|tem)\b', hint: "Add a clause with que: a cidade que eu mais amo…" }
    model: { es: "A minha cidade natal é Curitiba, a cidade onde eu cresci e que eu mais amo. É uma região onde faz frio no inverno. Os moradores, que parecem sérios, são muito gentis. O lugar que eu prefiro é o Jardim Botânico, cuja estufa de vidro é o cartão-postal da cidade. A paisagem dos parques é linda o ano todo.", en: "My home town is Curitiba, the city where I grew up and which I love most. It's a region where it's cold in winter. The locals, who seem serious, are very kind. My favourite place is the Botanical Garden, whose glass greenhouse is the city's postcard image. The scenery in the parks is beautiful all year round." }
  - task: "Describe the neighbourhood where you grew up: what it was like and what has changed (o bairro onde…, a praça em que…, cujas ruas…)."
    min: 50
    max: 100
    use: [w.segurança, w.poluição, w.transporte-público, w.comércio, w.zona]
    useAtLeast: 3
    grammar: [g.relative-onde-cujo]
    expect:
      - { pattern: '\b(onde|cujo|cuja|cujos|cujas|em que|no qual|na qual)\b', hint: "Use relative words: o bairro onde eu cresci, cujas ruas…" }
    model: { es: "O bairro onde eu cresci fica em São Paulo, longe do centro. Era um lugar tranquilo, cujas ruas viviam cheias de crianças. A praça em que a gente brincava ainda existe, mas hoje há mais poluição e menos segurança. O comércio cresceu muito e o transporte público melhorou: agora tem uma estação de metrô ao lado da casa onde eu morava.", en: "The neighbourhood where I grew up is in São Paulo, far from the centre. It was a quiet place, whose streets were always full of children. The square where we used to play still exists, but today there's more pollution and less safety. The shops have grown a lot and public transport has improved: now there's a metro station next to the house where I used to live." }
  - task: "Tell a friend about a craft fair you love, using prepositions + o qual / a qual (a feira sobre a qual te falei, a barraca na qual…)."
    min: 50
    max: 100
    use: [w.artesanato, w.artesão, w.lembrancinha, w.barraca, w.cerâmica]
    useAtLeast: 3
    grammar: [g.relative-o-qual]
    expect:
      - { pattern: '\b(o qual|a qual|os quais|as quais)\b', hint: "Use o qual / a qual after a preposition: a feira sobre a qual te falei…" }
