name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Every live course in courses.json: content check and unit tests with VITE_LANG set
      - run: npm run check:all
      # The Pawsport hub builds to dist/ (the site root), every course to dist/<slug>/
      - run: npm run build:all
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # e2e runs against dist/ served at /aprende/ by scripts/serve-dist.mjs (started by Playwright)
      - name: Hub
        run: npm run test:e2e -- e2e/hub.spec.ts
      - name: Spanish
        run: npm run test:e2e -- e2e/app.spec.ts e2e/listen.spec.ts e2e/palabras.spec.ts e2e/games-words.spec.ts e2e/games-arcade.spec.ts e2e/games-verbs.spec.ts
      - name: Cantonese writing and games
        run: VITE_LANG=yue npm run test:e2e -- e2e/writing.spec.ts e2e/games-cantonese.spec.ts e2e/games-words.spec.ts e2e/yue-beginner.spec.ts
      - name: Smoke-test every course
        run: node scripts/courses.mjs "npx playwright test e2e/sister.spec.ts"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    # Publishes dist/ to the gh-pages branch, which GitHub Pages serves at
    # https://pchattani.github.io/aprende/ (Settings -> Pages -> source: gh-pages):
    # the Pawsport hub at /aprende/, each course in dist/<slug>/ → /aprende/<slug>/.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Phones and tabs still running the previous version (an installed app, an open tab) load its
      # hashed files lazily; deleting them breaks that copy until it updates. Keep the previous deploy's
      # assets for one more deploy (files it had itself carried over are dropped, so nothing piles up).
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: prev
      - name: Carry over the previous deploy's assets
        run: node -e "$CARRY"
        env:
          CARRY: |
            const fs = require('fs'), path = require('path')
            if (!fs.existsSync('prev')) process.exit(0)
            const old = new Set(fs.existsSync('prev/.carried') ? fs.readFileSync('prev/.carried', 'utf8').split('\n') : [])
            const carried = []
            const walk = (dir) => {
              for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
                const p = path.join(dir, e.name)
                if (e.isDirectory()) { if (e.name !== '.git') walk(p); continue }
                const rel = path.relative('prev', p)
                if (!rel.split(path.sep).includes('assets') || old.has(rel) || fs.existsSync(path.join('dist', rel))) continue
                fs.mkdirSync(path.dirname(path.join('dist', rel)), { recursive: true })
                fs.copyFileSync(p, path.join('dist', rel))
                carried.push(rel)
              }
            }
            walk('prev')
            fs.writeFileSync('dist/.carried', carried.join('\n'))
            console.log(`carried ${carried.length} files from the previous deploy`)
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
