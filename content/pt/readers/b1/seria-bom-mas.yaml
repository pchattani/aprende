id: r.b1.seria-bom-mas
level: b1
title: Seria bom, mas...
kind: dialogue
intro: Rodrigo and Valéria are planning a holiday in the Pantanal, the world's largest tropical wetland. They can't agree on when to go — and they talk in conditionals, probabilities and contrasts.
allow: [bolívia, paraguai, rodrigo, valéria, pantanal, pantaneiro, pantaneira, corumbá, cuiabá, poconé, transpantaneira, mato, grosso, ok]
paragraphs:
  - { es: "Era domingo à noite. Valéria estava no sofá com o computador no colo, cercada de mapas e de sites de pousadas. Rodrigo chegou da cozinha com duas xícaras de chá.", en: "It was Sunday night. Valéria was on the sofa with the laptop on her lap, surrounded by maps and guesthouse websites. Rodrigo came in from the kitchen with two cups of tea." }
  - { es: "— E aí, já decidiu? Pantanal em janeiro ou em agosto?", en: "'So, have you decided? Pantanal in January or in August?'" }
  - { es: "— Não sei. Em janeiro seria ótimo, porque a gente estaria de férias juntos. Mas li que é a época das chuvas. Boa parte do Pantanal fica debaixo d'água, e algumas estradas ficam fechadas.", en: "'I don't know. January would be great, because we'd both be on holiday. But I read that it's the rainy season. A large part of the Pantanal is under water, and some roads are closed.'" }
  - { es: "— Mas isso não seria lindo? Tudo verde, cheio de água...", en: "'But wouldn't that be beautiful? Everything green, full of water...'" }
  - { es: "— Seria, sim. Só que os animais ficam espalhados, e fica mais difícil vê-los. Além disso, tem muito mosquito. Você se lembra do que aconteceu na praia, no ano passado?", en: "'It would, yes. But the animals are spread out, and it's harder to see them. Besides, there are lots of mosquitoes. Do you remember what happened at the beach last year?'" }
  - { es: "— Nem me lembre — riu o Rodrigo. — Fiquei uma semana me coçando. E em agosto, como é?", en: "'Don't remind me,' Rodrigo laughed. 'I spent a week scratching. And what's it like in August?'" }
  - { es: "— Agosto é a seca. Os rios baixam, os animais se juntam perto da água que sobra, e aí é muito mais fácil ver jacarés, capivaras, tuiuiús... E a onça-pintada! Diz aqui que, na seca, a chance de ver uma onça perto do rio Cuiabá é bem alta.", en: "'August is the dry season. The rivers go down, the animals gather near the water that's left, and then it's much easier to see caimans, capybaras, jabirus... And the jaguar! It says here that, in the dry season, the chance of seeing a jaguar near the Cuiabá river is quite high.'" }
  - { es: "— Sabia que o Pantanal é a maior área úmida tropical do mundo? Ele fica em Mato Grosso e em Mato Grosso do Sul, mas também em partes da Bolívia e do Paraguai. Li isso hoje no trabalho, enquanto o chefe não estava olhando.", en: "'Did you know the Pantanal is the largest tropical wetland in the world? It's in Mato Grosso and Mato Grosso do Sul, but also in parts of Bolivia and Paraguay. I read that at work today, while the boss wasn't looking.'" }
  - { es: "— Olha só, virou especialista! — riu a Valéria.", en: "'Look at you, you've become an expert!' Valéria laughed." }
  - { es: "— Uma onça! Isso eu queria muito ver. Então por que você ainda está em dúvida?", en: "'A jaguar! I'd really love to see that. So why are you still undecided?'" }
  - { es: "— Porque em agosto eu provavelmente não conseguiria tirar férias. Na empresa é época de fechamento. E também li que, nos últimos anos, a seca tem sido muito forte e houve queimadas enormes. Seria triste chegar lá e ver tudo queimado.", en: "'Because in August I probably wouldn't be able to take time off. At the company it's closing season. And I also read that in recent years the dry season has been very severe and there were huge fires. It would be sad to get there and see everything burnt.'" }
  - { es: "— É verdade. Mas, se todo mundo deixar de ir por causa disso, as pousadas e os guias pantaneiros vão sofrer ainda mais. O turismo é uma das poucas coisas que ajudam a proteger a região.", en: "'That's true. But if everyone stops going because of that, the guesthouses and the local guides will suffer even more. Tourism is one of the few things that help protect the region.'" }
  - { es: "— Concordo. — A Valéria tomou um gole de chá e ficou pensando. — E se a gente fosse em junho? Já seria o começo da seca, o calor seria menor e a empresa ainda estaria tranquila.", en: "'I agree.' Valéria took a sip of tea and thought for a moment. 'And what if we went in June? It would already be the start of the dry season, it would be less hot and things would still be quiet at the company.'" }
  - { es: "— Junho... Eu teria que trocar a semana com o meu colega, mas acho que ele aceitaria. Ele me deve um favor.", en: "'June... I'd have to swap the week with my colleague, but I think he'd accept. He owes me a favour.'" }
  - { es: "— Então está decidido? Pousada perto de Poconé, passeio de barco no rio, cavalgada de manhã cedo e, se tivermos sorte, uma onça.", en: "'So it's decided? A guesthouse near Poconé, a boat trip on the river, horse riding early in the morning and, if we're lucky, a jaguar.'" }
  - { es: "— Decidido. Mas com uma condição: repelente na mala. Muito repelente.", en: "'Decided. But on one condition: insect repellent in the suitcase. Lots of repellent.'" }
  - { es: "— Embora você exagere um pouco, aceito a condição — disse a Valéria, já reservando a pousada.", en: "'Although you exaggerate a bit, I accept the condition,' said Valéria, already booking the guesthouse." }
questions:
  - { q: "Qual é o problema de ir ao Pantanal em janeiro?", options: ["É a época das chuvas e é mais difícil ver os animais", "Faz muito frio", "As pousadas estão fechadas"], answer: 0, explain: "January is «a época das chuvas»; «os animais ficam espalhados, e fica mais difícil vê-los»." }
  - { q: "Por que é mais fácil ver animais na seca?", options: ["Porque eles se juntam perto da água que sobra", "Porque há mais guias", "Porque as noites são mais longas"], answer: 0, explain: "«Os rios baixam, os animais se juntam perto da água que sobra.»" }
  - { q: "Por que a Valéria provavelmente não conseguiria tirar férias em agosto?", options: ["Porque é época de fechamento na empresa", "Porque vai viajar com a família", "Porque está doente"], answer: 0, explain: "«Em agosto eu provavelmente não conseguiria tirar férias. Na empresa é época de fechamento.»" }
  - { q: "Segundo o Rodrigo, por que é importante continuar visitando o Pantanal?", options: ["Porque é barato", "Porque o turismo ajuda a proteger a região", "Porque as queimadas acabaram"], answer: 1, explain: "«O turismo é uma das poucas coisas que ajudam a proteger a região.»" }
  - { q: "Em que mês eles decidem ir?", options: ["Janeiro", "Junho", "Agosto"], answer: 1, explain: "Valéria suggests June: «Já seria o começo da seca» and the company would still be quiet." }
