id: r.c2.three-tang-poems-in-cantonese
level: c2
title: 送別、相思同江雪：用粵語讀唐詩
kind: literature
author: 王維 Wang Wei (c. 701–761) and 柳宗元 Liu Zongyuan (773–819)
source: "王維〈送元二使安西〉and〈相思〉, 柳宗元〈江雪〉, Tang dynasty quatrains, quoted in full. Public domain. The farewell-dinner framing and the commentary are written for this course."
intro: "At a farewell dinner in Guangzhou for a classmate leaving for the north-west, a student who belongs to the university's Cantonese recitation society reads three Tang quatrains and explains them in colloquial Cantonese: a poem of parting, a poem about red beans 'from the southern land', and a winter poem whose rhymes only survive in Cantonese."
allow: [王維, 柳宗元, 元二, 安西, 渭城, 陽關, 新疆, 中山大學, 永州, 阿禮, 子軒, 芷晴, zyut6, mit6, syut3, t]
paragraphs:
  - { es: "子軒研究生畢業，下個月就要去新疆做工程師。佢喺中山大學嘅同學喺北京路附近一間老字號訂咗張枱，同佢餞行。食到一半，大家起哄，要讀開粵語吟誦會嘅芷晴唸首詩送佢。芷晴企起身，舉起杯茶：「咁我就唸一首最應景嘅，王維嘅〈送元二使安西〉。」", en: "Tsz-hin has finished his postgraduate degree and is leaving next month to work as an engineer in Xinjiang. His classmates from Sun Yat-sen University have booked a table at an old-established restaurant near Beijing Road to give him a send-off. Halfway through the meal everyone starts egging on Tsz-ching, a member of the Cantonese recitation society, to recite a poem for him. Tsz-ching stands up and raises her cup of tea: 'Then I'll recite the most fitting one: Wang Wei's \"Seeing Off Yuan the Second on a Mission to Anxi\".'" }
  - { es: "〈送元二使安西〉　王維 ／ 渭城朝雨浥輕塵，客舍青青柳色新。勸君更盡一杯酒，西出陽關無故人。", en: "'Seeing Off Yuan the Second on a Mission to Anxi' – Wang Wei / In Weicheng the morning rain dampens the light dust; / by the inn, green upon green, the willows are fresh. / I urge you, sir, to drain one more cup of wine: / west of Yang Pass you will have no old friends." }
  - { es: "芷晴解釋：「王維喺渭城送朋友去西北邊疆。朝早啱啱落完雨，啲塵都濕晒，客棧外面啲柳樹綠油油，好清新。前兩句寫景，好平靜；後兩句就係佢真正想講嘅：『你再飲多杯啦，出咗陽關，就冇老朋友喇。』古時送別要折柳，因為『柳』同『留』讀音相近，即係想留住對方。所以第二句寫柳，已經暗暗講緊唔捨得。」", en: "Tsz-ching explains: 'Wang Wei is in Weicheng, seeing a friend off to the north-western frontier. It's just stopped raining in the morning, the dust is all damp, and the willows outside the inn are lush and green, very fresh. The first two lines describe the scene, very calm; the last two are what he really wants to say: \"Have one more drink – once you're through Yang Pass, there'll be no old friends.\" In ancient times people broke off a willow branch when saying goodbye, because 柳 \"willow\" sounds almost like 留 \"stay\" – a wish to keep the other person. So by describing willows in the second line, he's already quietly saying he doesn't want to let his friend go.'" }
  - { es: "子軒笑：「咁我要飲多杯先得喇。」芷晴話：「仲未完，你去咗新疆，記得我哋喺南方。王維另一首詩，就係寫南方嘅。」佢由袋入面攞出一串紅色嘅豆，放喺枱面。", en: "Tsz-hin laughs: 'Then I'd better have another drink.' Tsz-ching says: 'I haven't finished. When you're in Xinjiang, remember we're here in the south. Wang Wei wrote another poem about the south.' She takes a string of red beans out of her bag and puts it on the table." }
  - { es: "〈相思〉　王維 ／ 紅豆生南國，春來發幾枝。願君多採擷，此物最相思。", en: "'Longing' – Wang Wei / Red beans grow in the southern land; / when spring comes, how many sprigs put forth? / I hope you will gather many, sir: / these things speak most of longing." }
  - { es: "「紅豆唔係我哋煲糖水嗰種，而係一種紅色、好硬嘅種子，又叫相思豆，就係生喺南方，即係我哋嶺南呢度。王維話：春天嚟到，佢唔知又發咗幾多枝；希望你多啲摘，因為呢樣嘢最令人想念。佢冇講『我會掛住你』，但係叫你摘紅豆，其實就係叫你記住大家。」子軒接過串紅豆，冇出聲，同枱嘅阿禮就扮嘢話：「嘩，好肉麻呀！」全枱人笑到碌地。", en: "'These red beans aren't the kind we use to make sweet soup; they're hard red seeds, also called love beans, and they grow in the south – here in Lingnan. Wang Wei says: spring has come, who knows how many new sprigs have grown; I hope you'll pick plenty, because these are what make people long for each other most. He doesn't say \"I'll miss you\", but by telling you to pick red beans, he's really telling you to remember each other.' Tsz-hin takes the string of beans without a word, while Lai at the same table puts on a show: 'Wow, how soppy!' The whole table falls about laughing." }
  - { es: "子軒話：「新疆冬天好凍㗎，零下二三十度。你有冇首詩講雪？」芷晴諗咗一陣：「有，而且呢首一定要用廣東話讀，普通話讀唔出佢嘅好處。柳宗元嘅〈江雪〉。」", en: "Tsz-hin says: 'Winter in Xinjiang is freezing – twenty or thirty below. Have you got a poem about snow?' Tsz-ching thinks for a moment: 'Yes, and this one has to be read in Cantonese – in Mandarin you can't hear what's good about it. Liu Zongyuan's \"River Snow\".'" }
  - { es: "〈江雪〉　柳宗元 ／ 千山鳥飛絕，萬徑人蹤滅。孤舟蓑笠翁，獨釣寒江雪。", en: "'River Snow' – Liu Zongyuan / Over a thousand mountains, no bird in flight; / on ten thousand paths, every human trace erased. / In a lone boat, an old man in straw cape and hat / fishes alone in the cold river snow." }
  - { es: "「一千座山都冇雀仔飛，一萬條路都冇人行過嘅痕跡。得一隻細船，船上面一個着住蓑衣、戴住笠帽嘅老人家，喺好凍嘅江上面，一個人喺雪入面釣魚。柳宗元寫呢首詩嘅時候，畀朝廷貶咗去永州，好失意。個老伯冇人陪，但係佢唔走，繼續釣，好似柳宗元自己：冇人明白，都唔肯放棄。」", en: "'Over a thousand mountains not a single bird flies; on ten thousand paths there's no trace of anyone passing. There's only one little boat, and on it an old man in a straw cape and a bamboo hat, fishing alone in the snow on the freezing river. When Liu Zongyuan wrote this poem, he'd been banished by the court to Yongzhou and was deeply frustrated. The old man has no one with him, but he doesn't leave; he keeps on fishing – like Liu Zongyuan himself: no one understands him, but he refuses to give up.'" }
  - { es: "「至於點解要用廣東話讀：你聽吓韻腳，絕 zyut6、滅 mit6、雪 syut3，三個字都係入聲，收 t 尾，好似一下一下咁斷咗，好冷、好靜，同首詩嘅意境一模一樣。普通話讀，jué、miè、xuě，入聲冇晒，雖然都押韻，但係嗰種一刀切斷嘅感覺就冇咗。呢首詩用入聲押韻，係作者特登揀嘅。」", en: "'As for why you have to read it in Cantonese: listen to the rhyme words – 絕 zyut6, 滅 mit6, 雪 syut3 – all three are entering tones ending in t, as if cut off one after another, cold and silent, exactly matching the mood of the poem. In Mandarin – jué, miè, xuě – the entering tones are all gone; they still rhyme, but that feeling of being sliced off is lost. The poet deliberately chose to rhyme on entering tones.'" }
  - { es: "芷晴坐低，大家靜咗幾秒，然後一齊拍手。子軒話：「我去到新疆，落雪嘅時候，就唸〈江雪〉；掛住你哋嘅時候，就睇吓串紅豆。」阿禮又嚟：「咁飲酒嘅時候呢？」子軒舉起杯：「勸君更盡一杯酒！」全枱人一齊接：「西出陽關無故人！」隔籬枱嘅阿叔都忍唔住拍埋手。", en: "Tsz-ching sits down; everyone is quiet for a few seconds, then they all applaud. Tsz-hin says: 'When I'm in Xinjiang and it snows, I'll recite \"River Snow\"; when I miss you all, I'll look at the red beans.' Lai pipes up again: 'And when you're drinking?' Tsz-hin raises his cup: 'I urge you, sir, to drain one more cup of wine!' The whole table joins in: 'West of Yang Pass you will have no old friends!' Even the uncle at the next table can't help clapping along." }
questions:
  - { q: "〈送元二使安西〉入面，點解寫柳樹已經暗暗講緊唔捨得？", options: ["因為「柳」同「留」讀音相近，古時送別會折柳", "因為柳樹好難種", "因為王維鍾意綠色"], answer: 0, explain: "柳 lau5 sounds like 留 lau4 'stay'; breaking off a willow branch was a parting custom expressing the wish to keep a friend." }
  - { q: "「西出陽關無故人」嘅意思係？", options: ["陽關西邊冇人住", "出咗陽關，就冇老朋友喇", "陽關有好多新朋友"], answer: 1, explain: "故人 = old friends: beyond Yang Pass your friend will be among strangers." }
  - { q: "〈相思〉入面嘅紅豆係乜嘢？", options: ["煲糖水用嘅紅豆", "一種紅色、好硬嘅種子，又叫相思豆", "一種紅色嘅花"], answer: 1, explain: "The 紅豆 of the poem is the hard red seed called 相思豆, which grows in the south (南國)." }
  - { q: "點解話〈江雪〉一定要用廣東話讀？", options: ["因為柳宗元係廣東人", "因為韻腳絕、滅、雪都係入聲，廣東話先保留到嗰種短促嘅感覺", "因為普通話冇「雪」字"], answer: 1, explain: "The rhymes zyut6, mit6, syut3 all end in -t; Mandarin has lost the entering tones." }
  - { q: "〈江雪〉入面個老伯，可能代表乜嘢？", options: ["一個鍾意釣魚嘅漁夫", "畀朝廷貶咗、冇人明白但唔肯放棄嘅柳宗元自己", "王維嘅朋友元二"], answer: 1, explain: "Written in exile in Yongzhou, the lonely fisherman is often read as the poet's self-portrait." }
