id: a2.u07
title: Eu te ligo
lessons:
  - id: a2.u07.l1
    title: Eu te vejo amanhã
    teach: [g.direct-object-pronouns]
    vocab: [w.te, w.o.pron, w.olhar, w.escutar, w.amar, w.odiar, w.abraçar, w.beijar, w.namorar, w.buscar, w.estufa, w.vidro]
    tip: "Me, te, nos go before the verb in Brazil: Eu te amo. O / a (him, her, it) are the written forms; in speech you will hear ele / ela."
    sentences:
      - { es: "Eu te amo.", en: "I love you.", altEs: ["Te amo."], grammar: [g.direct-object-pronouns, g.pronoun-placement-brazil], vocab: [w.te, w.amar], variant: "Portugal: Amo-te.", error: { wrong: "Eu amo te.", explain: "In Brazil the object pronoun goes before the verb: Eu te amo.", grammar: g.pronoun-placement-brazil } }
      - { es: "Você me escuta?", en: "Can you hear me?", altEs: ["Você está me escutando?", "Tá me escutando?"], altEn: ["Are you listening to me?"], grammar: [g.direct-object-pronouns], vocab: [w.escutar] }
      - { es: "O ônibus? Eu o vejo daqui.", en: "The bus? I can see it from here.", altEs: ["O ônibus? Eu vejo ele daqui.", "O ônibus? Vejo daqui."], grammar: [g.direct-object-pronouns, g.ele-as-object], vocab: [w.o.pron, w.ônibus, w.ver] }
      - { es: "Eu a conheci no Jardim Botânico.", en: "I met her at the Botanical Garden.", altEs: ["Eu conheci ela no Jardim Botânico.", "Conheci ela no Jardim Botânico."], grammar: [g.direct-object-pronouns], vocab: [w.o.pron, w.conhecer] }
      - { es: "Ela nos convidou para jantar.", en: "She invited us to dinner.", altEs: ["Ela convidou a gente para jantar.", "Ela nos convidou pra jantar.", "Ela convidou a gente pra jantar."], grammar: [g.direct-object-pronouns], vocab: [w.convidar, w.jantar], transform: { instruction: "Change 'us' to 'me'", answer: "Ela me convidou para jantar.", alt: ["Ela me convidou pra jantar."], en: "She invited me to dinner." } }
      - { es: "Os ingressos? Eu os comprei ontem.", en: "The tickets? I bought them yesterday.", altEs: ["Os ingressos? Comprei ontem.", "Os ingressos? Eu comprei eles ontem.", "Os ingressos? Comprei-os ontem."], grammar: [g.direct-object-pronouns], vocab: [w.o.pron, w.ingresso, w.comprar] }
      - { es: "Vou buscar você na rodoviária.", en: "I'll pick you up at the bus station.", altEs: ["Vou te buscar na rodoviária.", "Eu vou buscar você na rodoviária.", "Eu te busco na rodoviária."], grammar: [g.direct-object-pronouns, g.pronoun-placement-brazil], vocab: [w.buscar, w.rodoviária], variant: "Portugal: Vou buscar-te à estação." }
      - { es: "Não te escutei, fala de novo.", en: "I didn't hear you, say it again.", altEs: ["Não escutei você, fala de novo.", "Não te ouvi, fala de novo.", "Não te escutei, fala outra vez."], grammar: [g.direct-object-pronouns], vocab: [w.te, w.escutar] }
      - { es: "Quero conhecê-la.", en: "I want to meet her.", altEs: ["Quero conhecer ela.", "Eu quero conhecê-la."], grammar: [g.direct-object-pronouns], vocab: [w.o.pron, w.conhecer, w.querer], error: { wrong: "Quero conhecer-a.", explain: "After an infinitive the r drops and a becomes la, with an accent on the vowel: conhecê-la.", grammar: g.direct-object-pronouns } }
      - { es: "Eu vi a Rafaela no shopping.", en: "I saw Rafaela at the mall.", altEs: ["Vi a Rafaela no shopping."], grammar: [g.direct-object-pronouns], vocab: [w.ver, w.shopping], transform: { instruction: "Replace 'a Rafaela' with a pronoun (written form)", answer: "Eu a vi no shopping.", alt: ["Eu vi ela no shopping.", "Vi ela no shopping."], en: "I saw her at the mall." } }
      - { es: "Minha irmã namora o Caio, mas meu pai não o conhece.", en: "My sister is going out with Caio, but my father doesn't know him.", altEs: ["Minha irmã namora o Caio, mas meu pai não conhece ele.", "A minha irmã namora o Caio, mas o meu pai não o conhece."], grammar: [g.direct-object-pronouns, g.ele-as-object], vocab: [w.namorar, w.o.pron] }
      - { es: "Curitiba é fria, mas eu a amo.", en: "Curitiba is cold, but I love it.", altEs: ["Curitiba é fria, mas eu amo.", "Curitiba é fria, mas eu amo essa cidade."], grammar: [g.direct-object-pronouns], vocab: [w.amar, w.frio] }
      - { es: "Ela odeia o frio, mas adora a garoa.", en: "She hates the cold, but she loves the drizzle.", altEs: ["Ela odeia frio, mas adora garoa."], grammar: [g.direct-object-pronouns], vocab: [w.odiar, w.garoa, w.adorar] }
      - { es: "Me abraça, estou com frio!", en: "Hug me, I'm cold!", altEs: ["Me abraça, tô com frio!", "Me dá um abraço, estou com frio!"], grammar: [g.direct-object-pronouns, g.pronoun-placement-brazil], vocab: [w.abraçar], variant: "Portugal: Abraça-me, estou com frio!" }
      - { es: "Ele me beijou na frente de todo mundo.", en: "He kissed me in front of everyone.", grammar: [g.direct-object-pronouns], vocab: [w.beijar], transform: { instruction: "Change 'me' to 'her' (written form)", answer: "Ele a beijou na frente de todo mundo.", alt: ["Ele beijou ela na frente de todo mundo."], en: "He kissed her in front of everyone." } }
      - { es: "Te vejo amanhã no ponto de ônibus.", en: "See you tomorrow at the bus stop.", altEs: ["Eu te vejo amanhã no ponto de ônibus.", "Te vejo amanhã no ponto."], altEn: ["I'll see you tomorrow at the bus stop."], grammar: [g.direct-object-pronouns, g.pronoun-placement-brazil], vocab: [w.te, w.ponto-de-ônibus], variant: "Portugal: Vejo-te amanhã na paragem." }
    exchanges:
      - q: { es: "Você viu o Caio hoje?", en: "Did you see Caio today?" }
        a: { es: "Vi, sim. Eu o vi no ônibus de manhã.", en: "Yes, I did. I saw him on the bus this morning." }
        alt: ["Vi ele no ônibus.", "Vi, sim.", "Não, não vi."]
        grammar: [g.direct-object-pronouns, g.ele-as-object]
        vocab: [w.o.pron, w.ver]
      - q: { es: "Você conhece a Heloísa?", en: "Do you know Heloísa?" }
        a: { es: "Conheço! Eu a conheci numa festa.", en: "I do! I met her at a party." }
        alt: ["Conheço, sim.", "Conheço ela, sim.", "Não, não conheço."]
        grammar: [g.direct-object-pronouns]
        vocab: [w.o.pron, w.conhecer]
      - q: { es: "Quem vai te buscar no aeroporto?", en: "Who's going to pick you up at the airport?" }
        a: { es: "Meu irmão vai me buscar.", en: "My brother is going to pick me up." }
        alt: ["Meu irmão.", "Meu pai vai me buscar.", "Ninguém, vou de ônibus."]
        grammar: [g.direct-object-pronouns, g.pronoun-placement-brazil]
        vocab: [w.buscar]
      - q: { es: "Você me ama?", en: "Do you love me?" }
        a: { es: "Claro que te amo!", en: "Of course I love you!" }
        alt: ["Amo, sim!", "Te amo muito.", "Claro que sim!"]
        grammar: [g.direct-object-pronouns]
        vocab: [w.amar, w.te]
      - q: { es: "Onde estão as chaves?", en: "Where are the keys?" }
        a: { es: "Não sei, não as vi.", en: "I don't know, I haven't seen them." }
        alt: ["Não sei, não vi.", "Não vi elas.", "Estão na mesa."]
        grammar: [g.direct-object-pronouns, g.ele-as-object]
        vocab: [w.chave, w.o.pron]
    texts:
      - title: "Mensagem da Rafaela"
        es: ["Oi! Cheguei em Curitiba e está muito frio.", "Você vem me buscar na rodoviária?", "Te espero às oito. Beijos!"]
        en: ["Hi! I've arrived in Curitiba and it's really cold.", "Are you coming to pick me up at the bus station?", "I'll wait for you at eight. Kisses!"]
        grammar: [g.direct-object-pronouns, g.pronoun-placement-brazil]
        vocab: [w.buscar, w.esperar]
      - title: "Legenda da foto"
        es: ["Esta é a estufa de vidro do Jardim Botânico.", "Eu a visitei no domingo com meus pais.", "Eles a adoraram!"]
        en: ["This is the glass greenhouse at the Botanical Garden.", "I visited it on Sunday with my parents.", "They loved it!"]
        grammar: [g.direct-object-pronouns]
        vocab: [w.estufa, w.vidro, w.o.pron]
    spicy:
      - { es: "Eu te olho e esqueço o frio de Curitiba.", en: "I look at you and forget the Curitiba cold.", altEs: ["Te olho e esqueço o frio de Curitiba."], grammar: [g.direct-object-pronouns], vocab: [w.olhar, w.te, w.esquecer] }
      - { es: "Você me escuta ou só me olha?", en: "Are you listening to me or just looking at me?", altEs: ["Você está me escutando ou só me olhando?"], grammar: [g.direct-object-pronouns], vocab: [w.escutar, w.olhar] }
      - { es: "Te busco às oito. Vem bonito.", en: "I'll pick you up at eight. Look nice.", altEs: ["Te busco às oito. Vem bonita.", "Vou te buscar às oito. Vem bonito."], grammar: [g.direct-object-pronouns, g.pronoun-placement-brazil], vocab: [w.buscar, w.te] }
      - { es: "Odeio o frio, mas adoro quando você me abraça.", en: "I hate the cold, but I love it when you hug me.", altEs: ["Eu odeio o frio, mas adoro quando você me abraça."], grammar: [g.direct-object-pronouns], vocab: [w.odiar, w.abraçar] }
      - { es: "Ela me beijou e eu nem vi o ônibus passar.", en: "She kissed me and I didn't even see the bus go by.", altEs: ["Ele me beijou e eu nem vi o ônibus passar."], grammar: [g.direct-object-pronouns], vocab: [w.beijar, w.ônibus] }
  - id: a2.u07.l2
    title: Me empresta?
    teach: [g.indirect-object-pronouns]
    vocab: [w.lhe, w.emprestar, w.devolver, w.mostrar, w.explicar, w.oferecer, w.segredo, w.favor, w.carona]
    tip: "To me / to you: me, te. To him / to her: pra ele, pra ela in speech, lhe in writing. Give it to her = Dá pra ela."
    sentences:
      - { es: "Você me empresta seu guarda-chuva?", en: "Will you lend me your umbrella?", altEs: ["Me empresta seu guarda-chuva?", "Você pode me emprestar seu guarda-chuva?", "Você me empresta o seu guarda-chuva?"], altEn: ["Can you lend me your umbrella?"], grammar: [g.indirect-object-pronouns], vocab: [w.emprestar, w.guarda-chuva] }
      - { es: "Ela me deu um pacote de pinhão.", en: "She gave me a bag of pinhão.", altEn: ["She gave me a packet of pine nuts."], grammar: [g.indirect-object-pronouns], vocab: [w.dar, w.pacote, w.pinhão], note: "Pinhão, the seed of the araucaria pine, is boiled and eaten hot all winter in Paraná." }
      - { es: "Vou te mostrar a Ópera de Arame.", en: "I'm going to show you the Wire Opera House.", altEs: ["Vou mostrar a Ópera de Arame para você.", "Vou mostrar a Ópera de Arame pra você.", "Eu vou te mostrar a Ópera de Arame."], grammar: [g.indirect-object-pronouns, g.pronoun-placement-brazil], vocab: [w.mostrar], variant: "Portugal: Vou mostrar-te a Ópera de Arame." }
      - { es: "Mandei uma mensagem para ela, mas ela não me respondeu.", en: "I sent her a message, but she didn't answer me.", altEs: ["Mandei uma mensagem pra ela, mas ela não me respondeu.", "Mandei-lhe uma mensagem, mas ela não me respondeu."], grammar: [g.indirect-object-pronouns], vocab: [w.mandar, w.mensagem, w.responder], error: { wrong: "Mandei ela uma mensagem, mas ela não me respondeu.", explain: "'To her' needs para: mandei uma mensagem para ela (or lhe in writing).", grammar: g.indirect-object-pronouns } }
      - { es: "O professor nos explicou o exercício duas vezes.", en: "The teacher explained the exercise to us twice.", altEs: ["O professor explicou o exercício duas vezes pra gente.", "O professor explicou o exercício para nós duas vezes."], grammar: [g.indirect-object-pronouns], vocab: [w.explicar, w.exercício] }
      - { es: "Quando você vai me devolver o livro?", en: "When are you going to give me the book back?", altEs: ["Quando você me devolve o livro?", "Quando é que você vai me devolver o livro?"], grammar: [g.indirect-object-pronouns, g.pronoun-placement-brazil], vocab: [w.devolver, w.livro] }
      - { es: "Você me faz um favor?", en: "Will you do me a favour?", altEs: ["Me faz um favor?", "Você pode me fazer um favor?"], altEn: ["Can you do me a favour?"], grammar: [g.indirect-object-pronouns], vocab: [w.favor, w.fazer] }
      - { es: "Eu lhe agradeço pela ajuda.", en: "I thank you for your help.", altEs: ["Agradeço pela ajuda.", "Eu agradeço a você pela ajuda."], grammar: [g.indirect-object-pronouns], vocab: [w.lhe, w.agradecer, w.ajuda], note: "Lhe sounds formal in most of Brazil, but it is everyday speech in parts of the Northeast." }
      - { es: "Ele ofereceu um café para a gente.", en: "He offered us a coffee.", altEs: ["Ele ofereceu um café pra gente.", "Ele ofereceu um café para nós."], grammar: [g.indirect-object-pronouns], vocab: [w.oferecer, w.café], transform: { instruction: "Use the pronoun nos", answer: "Ele nos ofereceu um café.", en: "He offered us a coffee." } }
      - { es: "Me conta um segredo?", en: "Will you tell me a secret?", altEs: ["Você me conta um segredo?", "Conta um segredo pra mim?"], grammar: [g.indirect-object-pronouns, g.pronoun-placement-brazil], vocab: [w.segredo, w.contar] }
      - { es: "Ela me deu uma carona até o centro.", en: "She gave me a lift to the centre.", altEs: ["Ela me deu carona até o centro."], altEn: ["She gave me a ride downtown."], grammar: [g.indirect-object-pronouns], vocab: [w.carona, w.dar, w.centro], variant: "Portugal: Ela deu-me boleia até ao centro." }
      - { es: "Escrevi para os meus pais e contei tudo para eles.", en: "I wrote to my parents and told them everything.", altEs: ["Escrevi pros meus pais e contei tudo pra eles.", "Escrevi aos meus pais e contei-lhes tudo."], grammar: [g.indirect-object-pronouns], vocab: [w.escrever, w.contar] }
      - { es: "Você pode me mostrar onde fica a rodoviária?", en: "Can you show me where the bus station is?", altEs: ["Pode me mostrar onde fica a rodoviária?", "Me mostra onde fica a rodoviária?"], grammar: [g.indirect-object-pronouns, g.pronoun-placement-brazil], vocab: [w.mostrar, w.rodoviária] }
      - { es: "Não empresto dinheiro para ninguém.", en: "I don't lend money to anyone.", altEs: ["Não empresto dinheiro pra ninguém.", "Eu não empresto dinheiro para ninguém."], altEn: ["I never lend anyone money."], grammar: [g.indirect-object-pronouns], vocab: [w.emprestar, w.dinheiro] }
      - { es: "Perguntei para o motorista onde fica a parada.", en: "I asked the driver where the stop is.", altEs: ["Perguntei pro motorista onde fica a parada.", "Perguntei ao motorista onde fica a parada."], grammar: [g.indirect-object-pronouns], vocab: [w.perguntar, w.motorista, w.parada], transform: { instruction: "Replace 'para o motorista' with a pronoun (written form)", answer: "Eu lhe perguntei onde fica a parada.", alt: ["Perguntei-lhe onde fica a parada.", "Perguntei pra ele onde fica a parada.", "Perguntei para ele onde fica a parada."], en: "I asked him where the stop is." } }
    exchanges:
      - q: { es: "Você me empresta dez reais?", en: "Will you lend me ten reais?" }
        a: { es: "Empresto, mas você me devolve amanhã!", en: "I will, but you give it back to me tomorrow!" }
        alt: ["Empresto, sim.", "Claro, toma.", "Desculpa, estou sem dinheiro."]
        grammar: [g.indirect-object-pronouns]
        vocab: [w.emprestar, w.devolver]
      - q: { es: "O que você deu para a sua mãe?", en: "What did you give your mother?" }
        a: { es: "Dei um livro de receitas para ela.", en: "I gave her a recipe book." }
        alt: ["Dei flores pra ela.", "Um livro.", "Dei-lhe um livro."]
        grammar: [g.indirect-object-pronouns]
        vocab: [w.dar, w.livro]
      - q: { es: "Quem te explicou como chegar aqui?", en: "Who explained to you how to get here?" }
        a: { es: "Uma moça no ponto de ônibus me explicou.", en: "A young woman at the bus stop explained it to me." }
        alt: ["O motorista me explicou.", "Ninguém, usei o mapa."]
        grammar: [g.indirect-object-pronouns, g.pronoun-placement-brazil]
        vocab: [w.explicar]
      - q: { es: "Pode me fazer um favor?", en: "Can you do me a favour?" }
        a: { es: "Claro! Do que você precisa?", en: "Of course! What do you need?" }
        alt: ["Claro, fala.", "Depende do favor!", "Posso, sim."]
        grammar: [g.indirect-object-pronouns]
        vocab: [w.favor]
      - q: { es: "Você me dá uma carona?", en: "Will you give me a lift?" }
        a: { es: "Dou! Para onde você vai?", en: "Sure! Where are you going?" }
        alt: ["Dou, sim.", "Claro, entra aí.", "Hoje não dá, desculpa."]
        grammar: [g.indirect-object-pronouns]
        vocab: [w.carona, w.dar]
    texts:
      - title: "Bilhete na geladeira"
        es: ["Rafa, peguei seu casaco emprestado.", "Te devolvo hoje à noite.", "Obrigada! Beijo, Lu."]
        en: ["Rafa, I borrowed your coat.", "I'll give it back to you tonight.", "Thanks! Love, Lu."]
        grammar: [g.indirect-object-pronouns]
        vocab: [w.emprestar, w.devolver, w.casaco]
      - title: "Mensagem para o professor"
        es: ["Professor, o senhor pode me explicar o exercício cinco?", "Não entendi a pergunta.", "Obrigado e até amanhã!"]
        en: ["Sir, can you explain exercise five to me?", "I didn't understand the question.", "Thank you and see you tomorrow!"]
        grammar: [g.indirect-object-pronouns]
        vocab: [w.explicar, w.exercício]
    spicy:
      - { es: "Você me empresta seu casaco? Ou prefere me abraçar?", en: "Will you lend me your coat? Or would you rather hug me?", grammar: [g.indirect-object-pronouns, g.direct-object-pronouns], vocab: [w.emprestar, w.casaco, w.abraçar] }
      - { es: "Me conta um segredo e eu te conto dois.", en: "Tell me a secret and I'll tell you two.", altEs: ["Me conta um segredo que eu te conto dois."], grammar: [g.indirect-object-pronouns], vocab: [w.segredo, w.contar] }
      - { es: "Me dá seu número? Eu te devolvo com um convite.", en: "Can I have your number? I'll give it back with an invitation.", altEs: ["Me passa seu número? Eu te devolvo com um convite."], grammar: [g.indirect-object-pronouns], vocab: [w.devolver, w.convite] }
      - { es: "Ele me ofereceu um café e uma carona; aceitei os dois.", en: "He offered me a coffee and a lift; I accepted both.", altEs: ["Ela me ofereceu um café e uma carona; aceitei os dois."], grammar: [g.indirect-object-pronouns], vocab: [w.oferecer, w.carona, w.aceitar] }
      - { es: "Você me explica de novo? Gosto de te ouvir falar.", en: "Will you explain it to me again? I like hearing you talk.", altEs: ["Me explica de novo? Gosto de ouvir você falar."], grammar: [g.indirect-object-pronouns], vocab: [w.explicar, w.ouvir] }
  - id: a2.u07.l3
    title: Vou te ligar
    teach: [g.pronoun-placement-brazil, g.ele-as-object]
    vocab: [w.telefonar, w.avisar, w.ligação, w.recado, w.e-mail, w.caixa-postal, w.atender, w.alô]
    tip: "With two verbs the pronoun sits before the second one: Vou te ligar, Estou te esperando. In conversation, Vi ele is normal; in writing, Eu o vi."
    sentences:
      - { es: "Me liga quando chegar em casa.", en: "Call me when you get home.", altEs: ["Me liga quando você chegar em casa.", "Liga pra mim quando chegar em casa."], grammar: [g.pronoun-placement-brazil], vocab: [w.ligar, w.chegar], variant: "Portugal: Liga-me quando chegares a casa." }
      - { es: "Vou te ligar depois da aula.", en: "I'll call you after class.", altEs: ["Vou ligar pra você depois da aula.", "Te ligo depois da aula.", "Eu te ligo depois da aula."], grammar: [g.pronoun-placement-brazil], vocab: [w.ligar, w.aula], transform: { instruction: "Change 'you' to 'her' (everyday speech)", answer: "Vou ligar pra ela depois da aula.", alt: ["Vou ligar para ela depois da aula."], en: "I'll call her after class." } }
      - { es: "Alô? Quem fala?", en: "Hello? Who's speaking?", altEs: ["Alô, quem fala?", "Alô? Quem é?"], altEn: ["Hello? Who is this?"], vocab: [w.alô] }
      - { es: "Ele nunca me atende.", en: "He never answers my calls.", altEs: ["Ele nunca atende o telefone."], altEn: ["He never picks up when I call."], grammar: [g.pronoun-placement-brazil], vocab: [w.atender], transform: { instruction: "Change nunca to sempre", answer: "Ele sempre me atende.", en: "He always answers my calls." } }
      - { es: "Liguei três vezes e só deu caixa postal.", en: "I called three times and only got voicemail.", altEs: ["Liguei três vezes e caiu na caixa postal.", "Liguei três vezes e só dava caixa postal."], grammar: [g.pronoun-placement-brazil], vocab: [w.caixa-postal, w.ligar] }
      - { es: "Estou te esperando na frente da estação.", en: "I'm waiting for you in front of the station.", altEs: ["Tô te esperando na frente da estação.", "Estou esperando você na frente da estação."], grammar: [g.pronoun-placement-brazil], vocab: [w.esperar, w.estação], variant: "Portugal: Estou à tua espera em frente à estação." }
      - { es: "Eu vi ele ontem na Rua das Flores.", en: "I saw him yesterday on Rua das Flores.", altEs: ["Eu o vi ontem na Rua das Flores.", "Vi ele ontem na Rua das Flores."], grammar: [g.ele-as-object], vocab: [w.ver, w.ontem], note: "Rua das Flores is the nickname of Rua XV de Novembro, Curitiba's pedestrian street.", error: { wrong: "Eu lhe vi ontem na Rua das Flores.", explain: "Lhe is an indirect object (to him). For 'I saw him' use o (written) or ele (speech).", grammar: g.ele-as-object } }
      - { es: "Chama ela pro cinema!", en: "Invite her to the cinema!", altEs: ["Chame-a para o cinema!", "Chama ela para o cinema!", "Convida ela pro cinema!"], altEn: ["Ask her to the cinema!"], grammar: [g.ele-as-object], vocab: [w.chamar, w.cinema] }
      - { es: "Pode me avisar quando o ônibus chegar?", en: "Can you let me know when the bus arrives?", altEs: ["Você pode me avisar quando o ônibus chegar?", "Me avisa quando o ônibus chegar?"], grammar: [g.pronoun-placement-brazil], vocab: [w.avisar, w.ônibus] }
      - { es: "Deixei um recado com o seu irmão.", en: "I left a message with your brother.", altEs: ["Deixei recado com o seu irmão.", "Deixei um recado com seu irmão."], grammar: [g.pronoun-placement-brazil], vocab: [w.recado, w.deixar] }
      - { es: "Mandei um e-mail para a empresa, mas ninguém me respondeu.", en: "I sent the company an email, but nobody answered me.", altEs: ["Mandei um e-mail pra empresa, mas ninguém me respondeu."], grammar: [g.pronoun-placement-brazil, g.indirect-object-pronouns], vocab: [w.e-mail, w.empresa, w.responder] }
      - { es: "Não me lembro do número dela.", en: "I can't remember her number.", altEs: ["Não lembro o número dela.", "Eu não me lembro do número dela."], grammar: [g.pronoun-placement-brazil], vocab: [w.lembrar, w.número] }
      - { es: "A ligação caiu. Te ligo de novo!", en: "The call dropped. I'll call you back!", altEs: ["Caiu a ligação. Te ligo de novo!", "A ligação caiu. Já te ligo de novo!"], grammar: [g.pronoun-placement-brazil], vocab: [w.ligação, w.cair] }
      - { es: "Telefonei para o hotel e reservei um quarto.", en: "I phoned the hotel and booked a room.", altEs: ["Liguei para o hotel e reservei um quarto.", "Liguei pro hotel e reservei um quarto."], vocab: [w.telefonar, w.reservar, w.hotel] }
      - { es: "Encontrei eles no Largo da Ordem.", en: "I ran into them at Largo da Ordem.", altEs: ["Eu encontrei eles no Largo da Ordem.", "Eu os encontrei no Largo da Ordem."], grammar: [g.ele-as-object], vocab: [w.encontrar], note: "Largo da Ordem, in Curitiba's historic centre, has a big craft fair every Sunday.", transform: { instruction: "Rewrite it in the written norm", answer: "Eu os encontrei no Largo da Ordem.", alt: ["Encontrei-os no Largo da Ordem."], en: "I ran into them at Largo da Ordem." } }
    exchanges:
      - q: { es: "Alô, a Heloísa está?", en: "Hello, is Heloísa there?" }
        a: { es: "Ela saiu. Quer deixar recado?", en: "She's gone out. Do you want to leave a message?" }
        alt: ["Está, sim. Só um minuto.", "Não está. Quem fala?", "Ela não está agora."]
        grammar: [g.pronoun-placement-brazil]
        vocab: [w.alô, w.recado]
      - q: { es: "Por que você não me atendeu?", en: "Why didn't you answer my call?" }
        a: { es: "Desculpa, o celular estava sem bateria.", en: "Sorry, my phone battery was dead." }
        alt: ["Desculpa, não vi a ligação.", "Estava no ônibus e não ouvi."]
        grammar: [g.pronoun-placement-brazil]
        vocab: [w.atender, w.bateria]
      - q: { es: "Você viu a Jussara na festa?", en: "Did you see Jussara at the party?" }
        a: { es: "Vi ela, sim, mas não conversei com ela.", en: "Yes, I saw her, but I didn't talk to her." }
        alt: ["Vi, sim.", "Eu a vi, sim.", "Não, não vi ela."]
        grammar: [g.ele-as-object]
        vocab: [w.ver, w.conversar]
      - q: { es: "Me avisa quando chegar?", en: "Will you let me know when you get there?" }
        a: { es: "Aviso, sim. Te mando uma mensagem.", en: "Yes, I will. I'll send you a message." }
        alt: ["Claro, te ligo.", "Pode deixar!", "Aviso!"]
        grammar: [g.pronoun-placement-brazil]
        vocab: [w.avisar, w.mensagem]
      - q: { es: "Você mandou o e-mail para o professor?", en: "Did you send the email to the teacher?" }
        a: { es: "Mandei, mas ele ainda não me respondeu.", en: "I did, but he hasn't answered me yet." }
        alt: ["Mandei, sim.", "Ainda não, vou mandar agora."]
        grammar: [g.pronoun-placement-brazil]
        vocab: [w.e-mail, w.mandar]
    texts:
      - title: "Recado na caixa postal"
        es: ["Oi, Caio, é a Heloísa.", "Te liguei duas vezes e você não me atendeu.", "Me liga quando ouvir este recado, tá?"]
        en: ["Hi, Caio, it's Heloísa.", "I called you twice and you didn't answer.", "Call me when you hear this message, OK?"]
        grammar: [g.pronoun-placement-brazil]
        vocab: [w.recado, w.caixa-postal, w.atender]
      - title: "Mensagem no grupo"
        es: ["Gente, já estou no ônibus.", "Vi o Murilo na estação e ele vem com a gente.", "Alguém avisa a Jussara?"]
        en: ["Guys, I'm already on the bus.", "I saw Murilo at the station and he's coming with us.", "Can someone let Jussara know?"]
        grammar: [g.ele-as-object]
        vocab: [w.avisar, w.estação]
    spicy:
      - { es: "Me liga hoje à noite. Ou melhor: vem me ver.", en: "Call me tonight. Or better: come and see me.", altEs: ["Me liga hoje à noite. Ou melhor, vem me ver."], grammar: [g.pronoun-placement-brazil], vocab: [w.ligar, w.ver] }
      - { es: "Não te atendi porque estava pensando em você.", en: "I didn't pick up because I was thinking about you.", altEs: ["Não atendi porque estava pensando em você."], grammar: [g.pronoun-placement-brazil], vocab: [w.atender, w.pensar] }
      - { es: "Vi ele na festa e esqueci o nome de todo mundo.", en: "I saw him at the party and forgot everyone's name.", altEs: ["Vi ela na festa e esqueci o nome de todo mundo.", "Eu o vi na festa e esqueci o nome de todo mundo."], grammar: [g.ele-as-object], vocab: [w.ver, w.esquecer] }
      - { es: "Deixei um recado na sua caixa postal: saudade.", en: "I left a message on your voicemail: miss you.", grammar: [g.pronoun-placement-brazil], vocab: [w.recado, w.caixa-postal, w.saudade] }
      - { es: "Te aviso: quando eu danço, ninguém me segura.", en: "I'm warning you: when I dance, nobody can stop me.", altEs: ["Já te aviso: quando eu danço, ninguém me segura."], grammar: [g.pronoun-placement-brazil], vocab: [w.avisar, w.dançar] }
  - id: a2.u07.l4
    title: Vem comigo!
    teach: [g.prepositional-pronouns]
    vocab: [w.contigo, w.conosco, w.nele, w.dizer-que-sim, w.arame]
    tip: "After a preposition: para mim, com você, sem ele. With com: comigo, conosco (or com a gente). Before an infinitive: para eu fazer."
    sentences:
      - { es: "Você quer ir comigo à Ópera de Arame?", en: "Do you want to go to the Wire Opera House with me?", altEs: ["Quer ir comigo à Ópera de Arame?", "Você quer ir na Ópera de Arame comigo?"], grammar: [g.prepositional-pronouns], vocab: [w.comigo, w.querer] }
      - { es: "Essas flores são para mim?", en: "Are these flowers for me?", altEs: ["Essas flores são pra mim?"], grammar: [g.prepositional-pronouns], vocab: [w.flor, w.mim] }
      - { es: "Ela vai jantar conosco no sábado.", en: "She's going to have dinner with us on Saturday.", altEs: ["Ela vai jantar com a gente no sábado."], grammar: [g.prepositional-pronouns], vocab: [w.conosco, w.jantar], variant: "Portugal: Ela vai jantar connosco no sábado.", error: { wrong: "Ela vai jantar com nós no sábado.", explain: "Com + nós becomes conosco (or, in speech, com a gente).", grammar: g.prepositional-pronouns } }
      - { es: "Posso contar com você?", en: "Can I count on you?", altEs: ["Posso contar contigo?"], grammar: [g.prepositional-pronouns], vocab: [w.contar, w.contigo], note: "Contigo is common in the South and in Portugal, even among você speakers." }
      - { es: "Ele me deu o mapa para eu achar o hotel.", en: "He gave me the map so I could find the hotel.", altEs: ["Ele me deu o mapa pra eu achar o hotel."], grammar: [g.prepositional-pronouns], vocab: [w.mapa, w.achar], error: { wrong: "Ele me deu o mapa para mim achar o hotel.", explain: "Before an infinitive use the subject form: para eu achar, not para mim achar.", grammar: g.prepositional-pronouns } }
      - { es: "Penso muito nele.", en: "I think about him a lot.", altEs: ["Eu penso muito nele."], grammar: [g.prepositional-pronouns], vocab: [w.nele, w.pensar] }
      - { es: "Sem você, Curitiba é só frio.", en: "Without you, Curitiba is just cold.", altEs: ["Sem você, Curitiba é só frio e garoa."], grammar: [g.prepositional-pronouns], vocab: [w.sem, w.frio] }
      - { es: "Cá entre nós, não gostei do restaurante.", en: "Between you and me, I didn't like the restaurant.", altEs: ["Entre nós, não gostei do restaurante.", "Entre mim e você, não gostei do restaurante."], grammar: [g.prepositional-pronouns], vocab: [w.entre, w.restaurante] }
      - { es: "Eles moram perto de nós, no Batel.", en: "They live near us, in Batel.", altEs: ["Eles moram perto da gente, no Batel."], grammar: [g.prepositional-pronouns], vocab: [w.morar, w.perto], note: "Batel is a neighbourhood in Curitiba known for its restaurants." }
      - { es: "Você vem com a gente ou vai com eles?", en: "Are you coming with us or going with them?", altEs: ["Você vem conosco ou vai com eles?"], grammar: [g.prepositional-pronouns], vocab: [w.conosco, w.vir], transform: { instruction: "Change 'with us' to 'with me'", answer: "Você vem comigo ou vai com eles?", en: "Are you coming with me or going with them?" } }
      - { es: "Ela sempre diz que sim para tudo.", en: "She always says yes to everything.", altEs: ["Ela sempre diz sim pra tudo.", "Ela sempre diz que sim pra tudo."], grammar: [g.prepositional-pronouns], vocab: [w.dizer-que-sim, w.tudo] }
      - { es: "Isso não é para você, é para ela.", en: "This isn't for you, it's for her.", altEs: ["Isso não é pra você, é pra ela."], grammar: [g.prepositional-pronouns], vocab: [w.isso], transform: { instruction: "Swap it round: it's for you, not for her", answer: "Isso é para você, não para ela.", alt: ["Isso é pra você, não pra ela."], en: "This is for you, not for her." } }
      - { es: "Eu confio em você, mas não no seu GPS.", en: "I trust you, but not your GPS.", altEs: ["Confio em você, mas não no seu GPS."], grammar: [g.prepositional-pronouns], vocab: [w.confiar] }
      - { es: "Fala comigo!", en: "Talk to me!", altEs: ["Fale comigo!"], grammar: [g.prepositional-pronouns], vocab: [w.comigo, w.falar] }
      - { es: "Vocês foram ao Parque Tanguá sem mim?", en: "Did you go to Tanguá Park without me?", altEs: ["Vocês foram no Parque Tanguá sem mim?"], grammar: [g.prepositional-pronouns], vocab: [w.mim, w.sem, w.parque] }
    exchanges:
      - q: { es: "Você vai comigo ao Largo da Ordem no domingo?", en: "Are you coming with me to Largo da Ordem on Sunday?" }
        a: { es: "Vou com você, sim! Adoro a feira de lá.", en: "Yes, I'll go with you! I love the market there." }
        alt: ["Vou, sim!", "Vou contigo!", "Não posso, vou com meus pais."]
        grammar: [g.prepositional-pronouns]
        vocab: [w.comigo, w.feira]
      - q: { es: "Esse café é pra mim?", en: "Is this coffee for me?" }
        a: { es: "É, sim. É pra você.", en: "Yes, it's for you." }
        alt: ["É sim, pode tomar.", "Não, é pra ela."]
        grammar: [g.prepositional-pronouns]
        vocab: [w.mim, w.café]
      - q: { es: "Você ainda pensa nela?", en: "Do you still think about her?" }
        a: { es: "Penso nela todo dia.", en: "I think about her every day." }
        alt: ["Penso, sim.", "Às vezes.", "Não penso mais nela."]
        grammar: [g.prepositional-pronouns]
        vocab: [w.nele, w.pensar]
      - q: { es: "Posso contar com vocês amanhã?", en: "Can I count on you (all) tomorrow?" }
        a: { es: "Claro, pode contar com a gente!", en: "Of course, you can count on us!" }
        alt: ["Pode contar conosco!", "Amanhã não dá, desculpa."]
        grammar: [g.prepositional-pronouns]
        vocab: [w.conosco, w.contar]
      - q: { es: "Ele disse que sim?", en: "Did he say yes?" }
        a: { es: "Disse! Ele vem com a gente.", en: "He did! He's coming with us." }
        alt: ["Não, disse que não.", "Ainda não respondeu."]
        grammar: [g.prepositional-pronouns]
        vocab: [w.dizer-que-sim]
    texts:
      - title: "Convite"
        es: ["Sábado a gente vai ao Parque Tanguá.", "Você quer vir com a gente?", "Eu levo pinhão para todo mundo."]
        en: ["On Saturday we're going to Tanguá Park.", "Do you want to come with us?", "I'll bring pinhão for everyone."]
        grammar: [g.prepositional-pronouns]
        vocab: [w.conosco, w.pinhão]
      - title: "Bilhete para a mãe"
        es: ["Mãe, fui ao cinema com a Lorena.", "Ela me convidou e eu disse que sim.", "Volto às dez. Não me espere acordada!"]
        en: ["Mum, I've gone to the cinema with Lorena.", "She invited me and I said yes.", "I'll be back at ten. Don't wait up for me!"]
        grammar: [g.prepositional-pronouns, g.direct-object-pronouns]
        vocab: [w.dizer-que-sim, w.convidar]
    spicy:
      - { es: "Vem comigo: o frio é melhor a dois.", en: "Come with me: the cold is better for two.", altEs: ["Vem comigo, o frio é melhor a dois."], grammar: [g.prepositional-pronouns], vocab: [w.comigo, w.frio] }
      - { es: "Penso tanto em você que perdi três ônibus hoje.", en: "I think about you so much that I missed three buses today.", grammar: [g.prepositional-pronouns], vocab: [w.pensar, w.perder] }
      - { es: "Para mim, um café; para você, o meu número.", en: "A coffee for me; for you, my number.", altEs: ["Pra mim, um café; pra você, o meu número."], grammar: [g.prepositional-pronouns], vocab: [w.mim, w.número] }
      - { es: "Você diz que sim para tudo? Então: jantar comigo?", en: "Do you say yes to everything? Then: dinner with me?", altEs: ["Você diz sim pra tudo? Então: jantar comigo?"], grammar: [g.prepositional-pronouns], vocab: [w.dizer-que-sim, w.comigo] }
      - { es: "Sem você, a Ópera de Arame é só arame.", en: "Without you, the Wire Opera House is just wire.", grammar: [g.prepositional-pronouns], vocab: [w.arame, w.sem] }
dialogues:
  - id: a2.u07.d1
    title: Bateria acabou
    context: Rafaela has just arrived at Curitiba's bus station and finally gets through to her friend Caio.
    lines:
      - { speaker: Rafaela, es: "Alô? Caio? Finalmente você me atendeu!", en: "Hello? Caio? Finally you picked up!" }
      - { speaker: Caio, es: "Desculpa, Rafa! Meu celular estava sem bateria. Você já chegou?", en: "Sorry, Rafa! My phone battery was dead. Have you arrived already?" }
      - { speaker: Rafaela, es: "Cheguei, estou na rodoviária. Te liguei três vezes e só deu caixa postal.", en: "I have, I'm at the bus station. I called you three times and only got voicemail." }
      - { speaker: Caio, es: "Eu vi as ligações agora. Fica aí, que eu vou te buscar.", en: "I've just seen the calls. Stay there, I'm coming to pick you up." }
      - { speaker: Rafaela, es: "Obrigada! Ah, e está muito frio. Você me empresta um casaco?", en: "Thanks! Oh, and it's really cold. Will you lend me a coat?" }
      - { speaker: Caio, es: "Empresto, claro. A minha irmã também vai com a gente; ela quer te conhecer.", en: "Of course I will. My sister's coming with us too; she wants to meet you." }
      - { speaker: Rafaela, es: "Que bom! Vocês me mostram o Jardim Botânico amanhã?", en: "Great! Will you show me the Botanical Garden tomorrow?" }
      - { speaker: Caio, es: "Mostro, sim. E à noite te levo à Ópera de Arame.", en: "Yes, I will. And in the evening I'll take you to the Wire Opera House." }
      - { speaker: Rafaela, es: "Perfeito. Avisa a sua irmã que eu trouxe pão de queijo para ela!", en: "Perfect. Tell your sister I've brought her some pão de queijo!" }
      - { speaker: Caio, es: "Vou avisar! Ela vai te amar. Chego em vinte minutos.", en: "I'll tell her! She's going to love you. I'll be there in twenty minutes." }
    questions:
      - { q: "Por que o Caio não atendeu as ligações?", options: ["Estava dormindo.", "O celular estava sem bateria.", "Estava no ônibus."], answer: 1, explain: "Caio says: Meu celular estava sem bateria (my phone battery was dead)." }
      - { q: "Onde a Rafaela está?", options: ["No Jardim Botânico", "Na rodoviária", "Na Ópera de Arame"], answer: 1, explain: "Estou na rodoviária: she is at the bus station." }
      - { q: "O que a Rafaela pede emprestado?", options: ["Um casaco", "Um celular", "Dinheiro"], answer: 0, explain: "Você me empresta um casaco? She asks to borrow a coat because it's cold." }
      - { q: "O que a Rafaela trouxe para a irmã do Caio?", options: ["Flores", "Pinhão", "Pão de queijo"], answer: 2, explain: "Eu trouxe pão de queijo para ela: she brought pão de queijo." }
