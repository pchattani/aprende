id: r.b2.embora-chova-em-olinda
level: b2
title: Embora chova, Olinda dança
kind: text
intro: A chronicle of a rainy Carnival Saturday in Olinda, the hilltop colonial town next to Recife, famous for its giant puppets. The text practises concession and contrast (embora, mesmo que, apesar de, ainda que, por mais que).
allow: [olinda, recife, ribeira, sé, amparo, homem, meia-noite, pernambuco, ok, frevo, maracatu]
paragraphs:
  - { es: "A previsão do tempo tinha sido clara: chuva forte no sábado de Carnaval. Embora todos os sites dissessem a mesma coisa, ninguém em Olinda pareceu se preocupar. Às oito da manhã, as ladeiras já estavam cheias de gente fantasiada, com guarda-chuvas coloridos que serviam ao mesmo tempo de proteção e de enfeite.", en: "The weather forecast had been clear: heavy rain on Carnival Saturday. Although all the websites said the same thing, nobody in Olinda seemed to worry. By eight in the morning, the steep streets were already full of people in costume, with colourful umbrellas that served as both protection and decoration." }
  - { es: "Olinda é uma das cidades coloniais mais antigas do Brasil, fundada pelos portugueses no século dezesseis, e o seu centro histórico é patrimônio da humanidade. Durante o ano, é um lugar tranquilo, de igrejas brancas, casas coloridas e vista para o mar. No Carnaval, porém, transforma-se completamente. Por mais que você tenha visto fotos, nada prepara para o barulho, o calor humano e a alegria das ruas.", en: "Olinda is one of the oldest colonial towns in Brazil, founded by the Portuguese in the sixteenth century, and its historic centre is a World Heritage Site. During the year it's a quiet place of white churches, colourful houses and sea views. At Carnival, however, it is completely transformed. However many photos you've seen, nothing prepares you for the noise, the human warmth and the joy of the streets." }
  - { es: "Diferentemente de outros Carnavais do Brasil, aqui não há camarotes nem cordas separando quem paga de quem não paga. As orquestras de frevo e os grupos de maracatu passam pelas ruas estreitas, e quem quiser vai atrás. Os mais famosos são os bonecos gigantes, figuras de três metros de altura, feitas de papel machê e tecido, que representam personagens da cidade, artistas e políticos. O mais conhecido é o Homem da Meia-Noite, que sai à meia-noite de sábado há quase cem anos.", en: "Unlike other Carnivals in Brazil, here there are no VIP boxes or ropes separating those who pay from those who don't. The frevo orchestras and maracatu groups pass through the narrow streets, and whoever wants to follows them. The most famous are the giant puppets, three-metre-tall figures made of papier-mâché and fabric, representing local characters, artists and politicians. The best known is the Homem da Meia-Noite, who comes out at midnight on Saturday and has done so for almost a hundred years." }
  - { es: "Por volta das onze, a chuva finalmente chegou. Não foi uma garoa: foi um temporal tropical, daqueles que transformam as ladeiras em rios. Eu, que sou de São Paulo, procurei imediatamente uma marquise. Mas, apesar de a água cair com força, a orquestra que passava na Rua do Amparo não parou de tocar nem por um segundo. Os músicos, encharcados, tocavam ainda mais alto, e as pessoas dançavam frevo dentro das poças, rindo.", en: "Around eleven, the rain finally arrived. It wasn't drizzle: it was a tropical downpour, the kind that turns steep streets into rivers. Being from São Paulo, I immediately looked for shelter under an awning. But, although the water was pouring down, the orchestra passing along Rua do Amparo didn't stop playing for a single second. The soaked musicians played even louder, and people danced frevo in the puddles, laughing." }
  - { es: "Uma senhora de uns setenta anos, vestida de baiana, me puxou pelo braço. — Sai daí, menino! Ainda que chova pedra, Carnaval é na rua. — E eu saí. Em cinco minutos, eu estava tão molhado quanto todo mundo, tentando imitar os passos do frevo sem escorregar nas pedras da ladeira. Não consegui, claro, mas ninguém se importou.", en: "A lady of about seventy, dressed as a baiana, pulled me by the arm. 'Get out of there, boy! Even if it rains stones, Carnival is out on the street.' And I went out. Within five minutes I was as wet as everyone else, trying to imitate the frevo steps without slipping on the stones of the slope. I didn't manage, of course, but nobody cared." }
  - { es: "Nem tudo é perfeito, é verdade. Mesmo que a festa seja gratuita, a cidade recebe muito mais gente do que consegue suportar: há filas enormes para os banheiros, o lixo se acumula e alguns moradores reclamam que já não conseguem dormir nem sair de casa durante cinco dias. Muitos alugam as casas para turistas e vão embora, embora isso signifique deixar para trás a festa que viram desde crianças.", en: "Not everything is perfect, it's true. Even though the festival is free, the town receives far more people than it can handle: there are huge queues for the toilets, rubbish piles up and some residents complain that they can no longer sleep or leave their houses for five days. Many rent their houses to tourists and leave, even though that means leaving behind the festival they've seen since they were children." }
  - { es: "À tarde, o sol voltou, e a cidade inteira começou a secar, como se nada tivesse acontecido. Do alto da Sé, olhei para Recife, do outro lado, e para o mar, que brilhava. Embora eu estivesse cansado, molhado e com os pés doendo, entendi o que a senhora tinha querido dizer. Em Olinda, a chuva não cancela o Carnaval. No máximo, faz parte dele.", en: "In the afternoon, the sun came back, and the whole town started to dry out, as if nothing had happened. From the top of the Sé, I looked at Recife, on the other side, and at the sea, which was shining. Although I was tired, wet and my feet were aching, I understood what the lady had meant. In Olinda, rain doesn't cancel Carnival. At most, it's part of it." }
questions:
  - { q: "Como as pessoas reagiram à previsão de chuva?", options: ["Ficaram em casa", "Não se preocuparam e foram para a rua", "Cancelaram os desfiles"], answer: 1, explain: "«Embora todos os sites dissessem a mesma coisa, ninguém em Olinda pareceu se preocupar.»" }
  - { q: "O que diferencia o Carnaval de Olinda de outros Carnavais?", options: ["Não há camarotes nem cordas: a festa é de todos na rua", "É mais caro", "Só tem música eletrônica"], answer: 0, explain: "«Aqui não há camarotes nem cordas separando quem paga de quem não paga.»" }
  - { q: "O que são os bonecos gigantes?", options: ["Estátuas de pedra nas igrejas", "Figuras de três metros que representam personagens", "Fantasias de crianças"], answer: 1, explain: "«Figuras de três metros de altura, feitas de papel machê e tecido, que representam personagens da cidade, artistas e políticos.»" }
  - { q: "O que a orquestra fez quando começou o temporal?", options: ["Parou e procurou abrigo", "Continuou tocando, ainda mais alto", "Foi para Recife"], answer: 1, explain: "«A orquestra... não parou de tocar nem por um segundo. Os músicos, encharcados, tocavam ainda mais alto.»" }
  - { q: "Qual é um problema do Carnaval de Olinda mencionado no texto?", options: ["A falta de música", "A cidade recebe mais gente do que consegue suportar", "O preço dos ingressos"], answer: 1, explain: "«A cidade recebe muito mais gente do que consegue suportar: há filas enormes para os banheiros, o lixo se acumula...»" }
