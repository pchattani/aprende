id: r.b2.du-parlement-a-la-winstub
level: b2
title: Strasbourg, du Parlement à la winstub
kind: dialogue
intro: "Margot works as an assistant at the European Parliament in Strasbourg. After work she meets her cousin Lucas, who speaks very informal French – until her boss calls. Notice how the register changes: slang and dropped ne with Lucas, polished formal French on the phone."
allow: [margot, lucas, dumont, ok, centre]
paragraphs:
  - { es: "Lucas : Salut, Margot ! Ben alors, t'es crevée ? T'as une de ces têtes !", en: "Lucas: Hi, Margot! Well then, are you knackered? You look awful!" }
  - { es: "Margot : M'en parle pas. Session plénière toute la semaine. Les députés sont là quatre jours par mois, et pendant ces quatre jours, c'est la folie. J'ai bossé de huit heures du mat' à neuf heures du soir.", en: "Margot: Don't talk to me about it. Plenary session all week. The MEPs are here four days a month, and during those four days it's madness. I worked from eight in the morning till nine at night." }
  - { es: "Lucas : Sérieux ? Moi, à ta place, je laisserais tomber ce boulot. T'es payée combien, au moins ?", en: "Lucas: Seriously? If I were you, I'd give up that job. How much do they pay you, at least?" }
  - { es: "Margot : Ça, c'est pas tes oignons. Bon, on va bouffer ? Je meurs de faim. Y'a une winstub sympa près de la cathédrale.", en: "Margot: That's none of your business. Right, shall we go and eat? I'm starving. There's a nice winstub near the cathedral." }
  - { es: "Lucas : Une quoi ?", en: "Lucas: A what?" }
  - { es: "Margot : Une winstub. Un petit resto alsacien traditionnel, avec des boiseries, des nappes à carreaux, de la choucroute et du vin blanc. Tu vas kiffer.", en: "Margot: A winstub. A traditional little Alsatian restaurant, with wood panelling, checked tablecloths, sauerkraut and white wine. You're going to love it." }
  - { es: "(Ils marchent vers la cathédrale. Le téléphone de Margot sonne.)", en: "(They walk towards the cathedral. Margot's phone rings.)" }
  - { es: "Margot : Oh non, c'est mon chef… Allô ? Bonsoir, monsieur Dumont. … Oui, tout à fait. Je vous prie de m'excuser, je n'ai pas encore eu le temps de terminer la note. … Je comprends parfaitement. Puis-je vous la transmettre demain à huit heures ? … Je vous en remercie. Je me permettrai également de vous faire parvenir le compte rendu de la réunion de cet après-midi. … Je vous souhaite une excellente soirée, monsieur. Au revoir.", en: "Margot: Oh no, it's my boss… Hello? Good evening, Mr Dumont. … Yes, absolutely. Please forgive me, I haven't yet had time to finish the briefing note. … I understand perfectly. May I send it to you tomorrow at eight? … Thank you very much. I shall also take the liberty of forwarding you the minutes of this afternoon's meeting. … I wish you a very pleasant evening. Goodbye." }
  - { es: "Lucas : Waouh ! C'était qui, cette dame ? « Puis-je vous la transmettre… Je me permettrai… » On dirait la reine d'Angleterre !", en: "Lucas: Wow! Who was that lady? 'May I send it to you… I shall take the liberty…' You sound like the Queen of England!" }
  - { es: "Margot : (rire) C'est le métier. Au Parlement, on ne parle pas comme dans la rue. Avec mon chef, je vouvoie, je fais des phrases complètes, je n'oublie jamais le « ne » de la négation. Avec toi, je dis « c'est pas grave » et « je sais pas ». Tout le monde fait ça, tu sais. On change de registre selon la personne à qui on parle.", en: "Margot: (laughing) It's the job. At the Parliament we don't talk the way we do in the street. With my boss I use vous, I make full sentences, I never forget the ne in negatives. With you I say 'c'est pas grave' and 'je sais pas'. Everyone does it, you know. You change register depending on who you're talking to." }
  - { es: "Lucas : Ouais, enfin, moi, je parle pareil avec tout le monde.", en: "Lucas: Yeah, well, I talk the same way to everybody." }
  - { es: "Margot : Ah bon ? Et à ton entretien d'embauche, la semaine dernière, tu as dit au directeur : « Salut, mec, file-moi du fric » ?", en: "Margot: Really? And at your job interview last week, did you say to the manager: 'Hi, mate, give me some cash'?" }
  - { es: "Lucas : … Bon, d'accord. J'ai dit : « Bonjour, monsieur, je vous remercie de me recevoir. » Mais c'était une exception !", en: "Lucas: … OK, fine. I said: 'Good morning, sir, thank you for seeing me.' But that was an exception!" }
  - { es: "Margot : Tu vois ! Regarde, voilà la cathédrale. Sa flèche fait cent quarante-deux mètres. Pendant plus de deux siècles, c'était le bâtiment le plus haut du monde. Et sur la place, en décembre, il y a le marché de Noël, un des plus anciens d'Europe. Il existe depuis 1570.", en: "Margot: You see! Look, there's the cathedral. Its spire is a hundred and forty-two metres high. For more than two centuries it was the tallest building in the world. And on the square in December there's the Christmas market, one of the oldest in Europe. It's been going since 1570." }
  - { es: "Lucas : Trop stylé. Bon, et cette winstub, elle est où ? Parce que moi aussi, je crève la dalle.", en: "Lucas: So cool. Right, where's this winstub? Because I'm starving too." }
  - { es: "Margot : « Je crève la dalle »… Monsieur Dumont adorerait cette expression. Allez, viens, c'est juste là.", en: "Margot: 'Je crève la dalle'… Mr Dumont would love that expression. Come on, it's just here." }
questions:
  - { q: "Pourquoi Margot est-elle fatiguée ?", options: ["Elle a fait la fête", "C'était la semaine de session plénière au Parlement", "Elle a voyagé toute la journée"], answer: 1, explain: "«Session plénière toute la semaine» – she worked from 8 a.m. to 9 p.m." }
  - { q: "Qu'est-ce qu'une winstub ?", options: ["Un bar de nuit", "Un petit restaurant alsacien traditionnel", "Un marché de Noël"], answer: 1, explain: "«Un petit resto alsacien traditionnel, avec des boiseries, des nappes à carreaux, de la choucroute.»" }
  - { q: "Qu'est-ce qui surprend Lucas pendant l'appel ?", options: ["Margot parle allemand", "Margot parle de façon très formelle", "Margot crie sur son chef"], answer: 1, explain: "«Puis-je vous la transmettre… Je me permettrai…» – he says she sounds like the Queen." }
  - { q: "Selon Margot, pourquoi change-t-on de registre ?", options: ["Selon la personne à qui on parle", "Selon la météo", "Selon l'heure de la journée"], answer: 0, explain: "«On change de registre selon la personne à qui on parle.»" }
  - { q: "Que signifie « Je crève la dalle » ?", options: ["Je suis très fatigué", "J'ai très faim", "J'ai cassé quelque chose"], answer: 1, explain: "Very informal for «j'ai très faim», like Margot's «je meurs de faim»." }
  - { q: "Quelle phrase appartient au registre soutenu ?", options: ["« C'est pas tes oignons. »", "« Puis-je vous la transmettre demain ? »", "« T'es crevée ? »"], answer: 1, explain: "Inversion (puis-je) and vous belong to formal French; the other two are slang with dropped ne." }
glossary:
  - { es: "t'es", en: "tu es (spoken)" }
  - { es: "t'as", en: "tu as (spoken)" }
  - { es: "une de ces têtes", en: "a terrible face (you look awful)" }
  - { es: plénière, en: plenary }
  - { es: "mat'", en: "matin (slang)" }
  - { es: mat, en: "matin (slang)" }
  - { es: "pas tes oignons", en: none of your business }
  - { es: oignons, en: "onions (c'est pas tes oignons = none of your business)" }
  - { es: resto, en: restaurant (informal) }
  - { es: boiseries, en: wood panelling }
  - { es: kiffer, en: "to love (slang)" }
  - { es: "je vous prie de m'excuser", en: please forgive me }
  - { es: prie, en: "beg (je vous prie = please)" }
  - { es: parvenir, en: "to reach (faire parvenir = to send)" }
  - { es: "compte rendu", en: "minutes, report" }
  - { es: waouh, en: wow }
  - { es: "on dirait", en: "you sound like, it looks like" }
  - { es: embauche, en: hiring (entretien d'embauche = job interview) }
  - { es: file, en: "give (slang)" }
  - { es: exception, en: exception }
  - { es: flèche, en: spire }
  - { es: stylé, en: "cool (slang)" }
  - { es: "je crève la dalle", en: "I'm starving (slang)" }
  - { es: crève, en: "am dying (slang)" }
  - { es: dalle, en: "(crever la dalle = to be starving)" }
  - { es: négation, en: negation }
  - { es: registre, en: register (level of language) }
