      - { pattern: "\\b(souhait|veu|voudr|aimerai)[a-zàâçéèêëîïôûùœ]*\\b[^.!?]{0,10}\\bqu(e\\s|['’])", hint: "Use je souhaite que / je voudrais que + subjonctif: je souhaite que tout se passe bien." }
    model: { es: "Demain soir, je vais dîner chez les parents de Lucas pour la première fois. J'espère qu'ils me trouveront sympathique et que je ne serai pas trop nerveux. Il semble que sa mère soit une excellente cuisinière : on va déguster ses fameuses quenelles. Je souhaite de tout cœur que tout se passe bien, parce que Lucas est très proche de sa famille. Je voudrais qu'ils comprennent que je l'aime vraiment. J'espère aussi qu'ils apprécieront le vin que j'ai choisi. Et je souhaite surtout que personne ne parle de politique à table !", en: "Tomorrow evening I'm having dinner at Lucas's parents' for the first time. I hope they'll find me nice and that I won't be too nervous. It seems his mother is an excellent cook: we're going to taste her famous quenelles. I really hope everything goes well, because Lucas is very close to his family. I'd like them to understand that I truly love him. I also hope they'll like the wine I've chosen. And above all I hope nobody talks about politics at the table!" }
