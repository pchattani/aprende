id: r.b2.slow-days-in-peng-chau
level: b2
title: 坪洲慢活
kind: text
intro: Burnt out after ten years in finance, Ah Ming quit his job and opened a tiny café on Peng Chau. A year later he writes about slowness, loneliness, the island's old match factory and what he has learned about happiness.
allow: [阿明]
paragraphs:
  - { es: "一年前，我仲喺中環一間銀行做金融分析。每日朝九晚十一，返到屋企攰到連沖涼都唔想沖。有一日開會開到一半，我突然心跳得好快，喘唔到氣，入咗醫院先知係焦慮症。醫生同我講：「你再唔停一停，身體會頂唔順。」嗰一刻我先發覺，原來我已經好耐冇真正開心過。", en: "A year ago I was still a financial analyst at a bank in Central. Every day I worked from nine in the morning until eleven at night, and when I got home I was too tired even to shower. One day, halfway through a meeting, my heart suddenly started racing and I couldn't breathe. Only after going to hospital did I find out it was an anxiety disorder. The doctor told me: \"If you don't stop for a while, your body won't be able to take it.\" Only then did I realise I hadn't been truly happy for a very long time." }
  - { es: "我辭咗職，搬咗去坪洲，用晒啲積蓄開咗一間細細嘅咖啡店。坪洲係一個好細嘅島，由中環坐船大概四十分鐘。島上面冇車，冇大商場，最高嘅建築物都係得幾層。朋友聽到我嘅決定，個個都話我癲咗：「你讀咗咁多書，走去離島煲咖啡？」", en: "I resigned, moved to Peng Chau and spent all my savings opening a tiny café. Peng Chau is a very small island, about forty minutes by ferry from Central. There are no cars and no big shopping centres, and the tallest buildings are only a few storeys high. When my friends heard my decision, every one of them said I'd gone mad: \"You studied all those years, and now you're off to an outlying island to make coffee?\"" }
  - { es: "一開始真係好唔慣。坪洲嘅節奏慢到極，街市十點先開，好多舖頭下晝會閂門唞吓。我成日習慣性噉睇手錶，覺得乜嘢都慢吞吞。有一次我等一個師傅嚟整水喉，佢話「今日嚟」，結果三日之後先出現，仲笑住同我講：「後生仔，使乜咁心急呀？」我嬲到火滾，但係又冇佢辦法。", en: "At first it was really hard to get used to. Life on Peng Chau moves extremely slowly: the market doesn't open until ten, and lots of shops close for a rest in the afternoon. Out of habit I kept checking my watch, and everything felt painfully slow. Once I was waiting for a plumber to come and fix the pipes. He said \"I'll come today\", then turned up three days later and said to me with a grin: \"Young man, what's the rush?\" I was furious, but there was nothing I could do about him." }
  - { es: "最難捱嘅係孤獨。夜晚八點之後，成條街靜英英，得返海浪聲。以前喺中環，我成日覺得身邊太多人；而家人少咗，我反而好掛住啲朋友，有時寂寞到想即刻搭船返市區。好在島上面嘅街坊好有人情味。隔籬士多嘅陳婆婆知道我一個人住，成日拎湯過嚟：「後生仔，飲碗湯先，唔好成日飲咖啡！」", en: "The hardest thing to bear was loneliness. After eight in the evening the whole street was dead quiet, with only the sound of the waves. In Central I always felt there were too many people around me; now there were fewer, I missed my friends terribly, and sometimes I was so lonely I wanted to take the next ferry back to the city. Fortunately the neighbours on the island are very warm. Mrs Chan from the corner shop next door knew I lived alone and often brought me soup: \"Young man, have some soup - don't drink coffee all the time!\"" }
  - { es: "陳婆婆話我知好多坪洲嘅舊事。佢話以前坪洲有間好大嘅火柴廠，仲有幾個石灰窰，全盛時期好多島民都喺嗰度返工。「嗰陣成個島都好熱鬧，日日都有船嚟運貨，夜晚啲工人收工就喺街度食飯、打麻雀。」後來火柴廠執咗笠，好多後生都搬咗出市區，島就慢慢靜咗落嚟。而家嗰度只係剩返幾幅舊牆，佢每次行過都好懷念。", en: "Mrs Chan told me a lot about Peng Chau's past. She said the island used to have a big match factory and several lime kilns, and at their peak many islanders worked there. \"In those days the whole island was lively; boats came every day to carry goods, and at night when the workers finished they'd eat and play mahjong in the street.\" Later the match factory closed down, many young people moved to the city, and the island gradually went quiet. Now only a few old walls remain, and every time she walks past she feels nostalgic." }
  - { es: "慢慢地，我開始享受呢種節奏。我學識咗朝早去碼頭睇日出，下晝閂一個鐘門去行手指山，夜晚坐喺海邊睇漁船返嚟。間咖啡店生意唔算好，有時一日得十幾個客，但係每個客我都有時間同佢傾吓偈。有個熟客係退休嘅漁民，佢日日嚟飲一杯齋啡，講啲捕魚嘅故事畀我聽。", en: "Gradually I began to enjoy this pace. I learned to watch the sunrise at the pier in the morning, close up for an hour in the afternoon to climb Finger Hill, and sit by the sea at night watching the fishing boats come in. Business at the café isn't great - some days I have only a dozen or so customers - but I have time to chat with every one of them. One regular is a retired fisherman who comes every day for a black coffee and tells me stories about fishing." }
  - { es: "我唔係話每個人都應該辭工搬去離島，咁樣唔現實。我只係覺得，香港人成日都好趕，趕返工、趕食飯、趕瞓覺，好少問自己：咁樣真係開心咩？坪洲教識我嘅，係知足。錢少咗，但係我瞓得好咗，笑多咗，焦慮症都好返咗好多。", en: "I'm not saying everyone should quit their job and move to an outlying island - that's not realistic. I just feel that Hongkongers are always in such a hurry: rushing to work, rushing to eat, rushing to sleep, and rarely asking themselves: does this really make me happy? What Peng Chau has taught me is contentment. I earn less, but I sleep better, I smile more, and my anxiety has got much better." }
  - { es: "如果你喺市區忙到喘唔到氣，不如搵個週末嚟坪洲行吓。嚟我間店飲杯咖啡，同陳婆婆打個招呼，或者乜都唔做，坐喺海邊發吓呆。你會發覺，原來慢啲都冇問題。", en: "If you're so busy in the city you can barely breathe, why not spend a weekend wandering around Peng Chau? Come and have a coffee at my café, say hello to Mrs Chan, or do nothing at all and just sit by the sea and daydream. You'll find that slowing down is perfectly fine." }
questions:
  - { q: "阿明點解辭職？", options: ["佢患咗焦慮症，醫生叫佢停一停", "銀行炒咗佢", "佢想去旅行"], answer: 0, explain: "入咗醫院先知係焦慮症. 醫生同我講：「你再唔停一停，身體會頂唔順。」" }
  - { q: "朋友點樣睇阿明嘅決定？", options: ["好支持", "話佢癲咗", "好羨慕"], answer: 1, explain: "朋友聽到我嘅決定，個個都話我癲咗." }
  - { q: "個整水喉師傅幾時先出現？", options: ["嗰日", "三日之後", "一個禮拜之後"], answer: 1, explain: "佢話「今日嚟」，結果三日之後先出現." }
  - { q: "阿明覺得搬去坪洲最辛苦嘅係乜嘢？", options: ["孤獨", "冇錢", "太熱"], answer: 0, explain: "最難捱嘅係孤獨." }
  - { q: "以前坪洲有乜嘢工業？", options: ["火柴廠同石灰窰", "銀行", "電子廠"], answer: 0, explain: "以前坪洲有間好大嘅火柴廠，仲有幾個石灰窰." }
  - { q: "阿明話坪洲教識咗佢乜嘢？", options: ["點樣賺錢", "知足", "捕魚"], answer: 1, explain: "坪洲教識我嘅，係知足." }
