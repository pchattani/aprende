    spicy:
      - { es: "Ayant négocié toute la soirée, j'ai obtenu ton numéro… et un deuxième rendez-vous.", en: "Having negotiated all evening, I got your number… and a second date.", altEs: ["Après avoir négocié toute la soirée, j'ai obtenu ton numéro… et un deuxième rendez-vous."], grammar: [g.participe-present], vocab: [w.négocier, w.rendez-vous] }
      - { es: "Mon cœur n'importe plus rien ; il exporte tout vers toi.", en: "My heart doesn't import anything any more; it exports everything to you.", altEs: ["Mon cœur n'importe plus rien, il exporte tout vers toi."], grammar: [g.negation-jamais-plus-rien], vocab: [w.importer, w.exporter, w.cœur] }
