id: r.c1.une-nuit-au-sommet-annulee
level: c1
title: Une nuit au sommet annulée
kind: text
intro: "Two formal letters: a customer complains to a (fictional) travel agency after a night of stargazing at the Pic du Midi was cancelled, and the agency replies. Notice the fixed formulas of French correspondence (Je me permets de…, Veuillez…, Dans l'attente de…, je vous prie d'agréer…), the impersonal administrative style (il a été décidé, il convient de) and the polite but firm tone on both sides."
allow: [agence, générales, h, personnel, détail, supérieures, km, vérification, responsabilité, exceptionnel, pic, midi, pyrénées, mongie, toulouse, bigorre, bagnères-de-bigorre, durand, lefèvre, céline, marc, réf, cedex, mme, m.]
paragraphs:
  - { es: "Céline Durand, 14, rue des Lois, 31000 Toulouse. À l'attention du service clientèle, agence Pyrénées Étoiles, 65200 Bagnères-de-Bigorre. Toulouse, le 12 mars. Objet : annulation de la soirée « Nuit au sommet » du 2 mars – demande de remboursement. Réf. de réservation : PE-2847.", en: "Céline Durand, 14 rue des Lois, 31000 Toulouse. For the attention of the customer service department, Pyrénées Étoiles agency, 65200 Bagnères-de-Bigorre. Toulouse, 12 March. Subject: cancellation of the 'Night at the summit' evening of 2 March – request for a refund. Booking ref.: PE-2847." }
  - { es: "Madame, Monsieur, je me permets de vous écrire au sujet de la soirée « Nuit au sommet » que j'avais réservée auprès de votre agence pour le 2 mars, à l'occasion de l'anniversaire de mon mari. Cette formule, que nous avions payée 820 euros pour deux personnes, comprenait la montée en téléphérique depuis La Mongie, le dîner, l'observation du ciel avec un guide et la nuit à l'observatoire, à 2 877 mètres d'altitude.", en: "Dear Sir or Madam, I am writing to you regarding the 'Night at the summit' evening that I had booked with your agency for 2 March, for my husband's birthday. This package, for which we had paid 820 euros for two people, included the cable-car ride up from La Mongie, dinner, stargazing with a guide and the night at the observatory, at an altitude of 2,877 metres." }
  - { es: "Le jour prévu, après deux heures de route, nous avons appris à notre arrivée au téléphérique que la soirée était annulée en raison du vent. Je ne conteste nullement cette décision, qui relevait sans doute de la sécurité. En revanche, je regrette vivement de n'avoir été prévenue par aucun message, alors que, selon le personnel sur place, l'annulation avait été décidée dès le matin. Nous aurions ainsi évité un déplacement inutile.", en: "On the day, after a two-hour drive, we learnt on arriving at the cable car that the evening had been cancelled because of the wind. I do not in any way dispute this decision, which was no doubt a matter of safety. On the other hand, I very much regret not having been warned by any message, whereas, according to the staff on site, the cancellation had been decided that morning. We would thus have avoided a pointless journey." }
  - { es: "Par ailleurs, votre employé nous a seulement proposé de reporter la soirée à une date ultérieure, sans préciser laquelle. Or, mon mari et moi ne pouvons pas nous engager sur une nouvelle date avant plusieurs mois. Conformément aux conditions générales de vente figurant sur votre site, je vous demande donc de bien vouloir me rembourser l'intégralité de la somme versée, ainsi que, le cas échéant, nos frais de déplacement, dont vous trouverez le détail ci-joint.", en: "Furthermore, your employee simply offered to postpone the evening to a later date, without saying which. However, my husband and I cannot commit to a new date for several months. In accordance with the general terms and conditions of sale shown on your website, I therefore ask you kindly to refund the full amount paid, together with, where applicable, our travel expenses, the details of which you will find enclosed." }
  - { es: "Je tiens à préciser que nous avions choisi votre agence sur la recommandation d'amis, qui gardent un souvenir merveilleux de leur nuit au sommet. Vous comprendrez donc notre déception, d'autant plus que cette soirée devait être une surprise pour mon mari. Je ne doute pas que vous saurez apporter une réponse rapide et satisfaisante à ma demande.", en: "I should point out that we had chosen your agency on the recommendation of friends, who have wonderful memories of their night at the summit. You will therefore understand our disappointment, all the more so as this evening was meant to be a surprise for my husband. I have no doubt that you will be able to give a prompt and satisfactory answer to my request." }
  - { es: "Dans l'attente de votre réponse, je vous prie d'agréer, Madame, Monsieur, l'expression de mes salutations distinguées. Céline Durand. Pièces jointes : confirmation de réservation, justificatifs de frais.", en: "I look forward to your reply. Yours faithfully, Céline Durand. Enclosures: booking confirmation, receipts for expenses." }
  - { es: "Agence Pyrénées Étoiles, service clientèle. Madame Céline Durand, 14, rue des Lois, 31000 Toulouse. Bagnères-de-Bigorre, le 19 mars. Objet : votre courrier du 12 mars – réf. PE-2847.", en: "Pyrénées Étoiles agency, customer service. Mrs Céline Durand, 14 rue des Lois, 31000 Toulouse. Bagnères-de-Bigorre, 19 March. Subject: your letter of 12 March – ref. PE-2847." }
  - { es: "Madame, nous avons bien reçu votre courrier du 12 mars et vous remercions de nous avoir fait part de votre mécontentement. Nous tenons tout d'abord à vous présenter nos excuses pour la gêne occasionnée. Comme vous le soulignez à juste titre, la soirée du 2 mars a dû être annulée : des rafales supérieures à 100 km/h étaient annoncées au sommet, et il a été décidé, en accord avec l'exploitant du téléphérique, de suspendre toutes les montées à partir de 16 heures.", en: "Madam, we have received your letter of 12 March and thank you for letting us know of your dissatisfaction. We would first like to apologise for the inconvenience caused. As you rightly point out, the evening of 2 March had to be cancelled: gusts of more than 100 km/h were forecast at the summit, and it was decided, in agreement with the cable-car operator, to suspend all ascents from 4 p.m." }
  - { es: "Après vérification, il apparaît qu'un message d'annulation vous a bien été envoyé à 11 h 30, mais à une adresse électronique erronée, à la suite d'une erreur de saisie lors de votre réservation. Nous regrettons sincèrement ce malentendu, dont nous assumons la responsabilité. Il convient de préciser que nos clients sont désormais également prévenus par SMS, afin qu'une telle situation ne se reproduise pas.", en: "After checking, it appears that a cancellation message was indeed sent to you at 11.30 a.m., but to an incorrect email address, following a typing error when your booking was made. We sincerely regret this misunderstanding, for which we take responsibility. It should be pointed out that our customers are now also notified by text message, so that such a situation does not happen again." }
  - { es: "Conformément à nos conditions générales de vente, un remboursement intégral de 820 euros sera effectué sur votre carte bancaire dans un délai de quatorze jours. En outre, à titre exceptionnel et en dédommagement de votre déplacement, nous vous proposons un bon d'une valeur de 100 euros, valable deux ans, que vous trouverez ci-joint. Nous espérons ainsi avoir le plaisir de vous accueillir au sommet lors d'une prochaine nuit, sous un ciel, cette fois, parfaitement dégagé.", en: "In accordance with our general terms and conditions of sale, a full refund of 820 euros will be made to your bank card within fourteen days. In addition, as an exceptional gesture and to compensate you for your journey, we are offering you a voucher worth 100 euros, valid for two years, which you will find enclosed. We hope to have the pleasure of welcoming you to the summit on another night, under a perfectly clear sky this time." }
  - { es: "Nous vous prions d'agréer, Madame, l'expression de nos sentiments les meilleurs. Marc Lefèvre, responsable du service clientèle.", en: "Yours sincerely, Marc Lefèvre, customer service manager." }
questions:
  - { q: "Pourquoi Céline Durand écrit-elle à l'agence ?", options: ["Pour réserver une nouvelle soirée", "Pour se plaindre de ne pas avoir été prévenue de l'annulation et demander un remboursement", "Pour contester la décision d'annuler à cause du vent"], answer: 1, explain: "She does not dispute the cancellation («Je ne conteste nullement cette décision») but regrets not being warned, and asks for a full refund." }
  - { q: "Pourquoi n'a-t-elle pas reçu le message d'annulation ?", options: ["L'agence a oublié de l'envoyer", "Il a été envoyé à une adresse électronique erronée", "Son téléphone ne marchait pas"], answer: 1, explain: "«Un message d'annulation vous a bien été envoyé… mais à une adresse électronique erronée, à la suite d'une erreur de saisie.»" }
  - { q: "Que propose l'agence en plus du remboursement ?", options: ["Une nuit gratuite le lendemain", "Un bon de 100 euros valable deux ans", "Rien"], answer: 1, explain: "«À titre exceptionnel… nous vous proposons un bon d'une valeur de 100 euros, valable deux ans.»" }
  - { q: "Quelle formule de politesse termine une lettre formelle en français ?", options: ["Bisous, à bientôt", "Je vous prie d'agréer, Madame, Monsieur, l'expression de mes salutations distinguées", "Cordialement vôtre, mon cher ami"], answer: 1, explain: "The classic closing formula: «Je vous prie d'agréer, Madame, Monsieur, l'expression de mes salutations distinguées»." }
  - { q: "Que signifie « le cas échéant » dans la première lettre ?", options: ["Si nécessaire, si c'est possible", "Immédiatement", "Malheureusement"], answer: 0, explain: "le cas échéant = where applicable, if the case arises — a typical administrative expression." }
