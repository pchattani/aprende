id: r.b1.tres-pisos-y-una-decision
level: b1
title: Tres pisos y una decisión
kind: text
intro: A personal blog post by Nuria, who has spent two months flat-hunting in Valencia and has finally made up her mind.
allow: [nuria, valencia]
paragraphs:
  - { es: "Llevo dos meses buscando piso en Valencia y por fin he aprendido algo: lo que se ve en las fotos casi nunca es lo que hay. Esta semana he visitado tres pisos cuyos anuncios parecían perfectos. Os cuento.", en: "I've spent two months looking for a flat in Valencia and I've finally learnt something: what you see in the photos is almost never what there is. This week I visited three flats whose adverts seemed perfect. Let me tell you." }
  - { es: "El primero era un ático «luminoso y reformado, con terraza de veinte metros cuadrados». La terraza existía, sí, pero daba a una calle donde los coches no paran ni de noche. El dueño, un señor muy amable con quien hablé media hora, me explicó que la zona era «muy viva». Demasiado viva para alguien que trabaja desde casa.", en: "The first was a penthouse, 'bright and renovated, with a twenty-square-metre terrace'. The terrace did exist, but it looked onto a street where the cars don't stop even at night. The owner, a very kind man I talked to for half an hour, explained that the area was 'very lively'. Too lively for someone who works from home." }
  - { es: "El segundo anuncio decía: «Se alquila piso amueblado en edificio con ascensor. No se admiten mascotas». Yo tengo un gato, así que llamé para preguntar. La inmobiliaria me aseguró que la propietaria podía cambiar de opinión si el inquilino era «una persona responsable». Fui a verlo: el salón era acogedor y la cocina estaba nueva, pero el dormitorio era interior y no tenía ventana a la calle.", en: "The second advert said: 'Furnished flat to rent in a building with a lift. No pets allowed.' I have a cat, so I called to ask. The agency assured me that the owner could change her mind if the tenant was 'a responsible person'. I went to see it: the living room was cosy and the kitchen was new, but the bedroom faced the inner courtyard and had no window onto the street." }
  - { es: "El tercero estaba en las afueras, en un barrio donde viven muchas familias jóvenes. Era amplio, soleado y asequible, y el edificio tenía garaje y trastero. Lo único que no me gustaba era el transporte: el autobús que llega al centro pasa cada media hora.", en: "The third was on the outskirts, in a neighbourhood where many young families live. It was spacious, sunny and affordable, and the building had a garage and a storage room. The only thing I didn't like was the transport: the bus that goes to the centre comes every half hour." }
  - { es: "Busco un piso que tenga luz natural, que esté bien comunicado y que no cueste más de setecientos euros. ¿Existe? Mis amigos, que ya han pasado por esto, dicen que no hay ningún piso que lo tenga todo y que hay que elegir lo más importante.", en: "I'm looking for a flat that has natural light, is well connected and doesn't cost more than seven hundred euros. Does it exist? My friends, who have already been through this, say there is no flat that has everything and that you have to choose what matters most." }
  - { es: "Después de pensarlo mucho, he decidido quedarme con el tercero. Es verdad que está lejos del centro, pero es el único donde me imagino viviendo tranquila. Firmo el contrato el lunes y pago la fianza esa misma mañana. La mudanza será dentro de dos semanas; quien quiera ayudar con las cajas, que me escriba.", en: "After thinking about it a lot, I've decided to take the third one. It's true that it's far from the centre, but it's the only one where I can imagine living peacefully. I sign the contract on Monday and pay the deposit that same morning. The move will be in two weeks; anyone who wants to help with the boxes, write to me." }
questions:
  - { q: "Why did Nuria reject the first flat?", options: ["It had no terrace", "It was too expensive", "The street was too noisy"], answer: 2 }
  - { q: "What was the problem with the second flat?", options: ["The bedroom had no window onto the street", "The building had no lift", "It was not furnished"], answer: 0 }
  - { q: "What is the drawback of the flat she chooses?", options: ["It does not allow pets", "It is far from the centre", "It is dark"], answer: 1 }
glossary:
  - { es: ático, en: penthouse, top-floor flat }
  - { es: único, en: only (the only one) }
  - { es: caja, en: box }
