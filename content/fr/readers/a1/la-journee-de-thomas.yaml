id: r.a1.la-journee-de-thomas
level: a1
title: La journée de Thomas
kind: text
intro: "Thomas works near Notre-Dame. He describes a typical day: «métro, boulot, dodo» – metro, work, sleep – as Parisians say."
allow: [boulot, dodo, centre, gambetta]
paragraphs:
  - { es: "Je m'appelle Thomas. J'ai trente-deux ans et je travaille dans une banque, sur l'île de la Cité, près de Notre-Dame. J'habite dans le vingtième arrondissement, loin du centre. Ma vie, c'est « métro, boulot, dodo », comme on dit à Paris !", en: "My name is Thomas. I'm thirty-two and I work in a bank on the Île de la Cité, near Notre-Dame. I live in the twentieth arrondissement, far from the centre. My life is 'metro, work, sleep', as they say in Paris!" }
  - { es: "Le matin, je me réveille à six heures et demie. Je ne me lève pas tout de suite : je reste cinq minutes dans le lit. Ensuite, je me douche et je m'habille. Je prends mon petit-déjeuner dans la cuisine : un café noir et une tartine. Je ne mange pas beaucoup le matin.", en: "In the morning I wake up at half past six. I don't get up right away: I stay in bed for five minutes. Then I have a shower and get dressed. I have breakfast in the kitchen: a black coffee and a slice of bread. I don't eat much in the morning." }
  - { es: "À sept heures et quart, je pars. Je prends le métro à la station Gambetta. Le métro est toujours plein et les gens sont fatigués. Je lis un livre ou j'écoute de la musique. J'arrive au travail à huit heures moins le quart.", en: "At a quarter past seven I leave. I take the metro at Gambetta station. The metro is always full and people are tired. I read a book or listen to music. I get to work at a quarter to eight." }
  - { es: "Je commence à huit heures. Le matin, je réponds au téléphone et je travaille sur l'ordinateur. À midi, j'entends les cloches sonner. C'est l'heure du déjeuner ! Je mange avec mes collègues dans un petit restaurant, ou je prends un sandwich et je mange sur un banc, devant la Seine.", en: "I start at eight. In the morning I answer the phone and work on the computer. At noon I hear the bells ringing. It's lunchtime! I eat with my colleagues in a little restaurant, or I get a sandwich and eat on a bench in front of the Seine." }
  - { es: "L'après-midi, je travaille encore. Je finis à cinq heures et demie. D'habitude, je rentre à la maison en métro. Le jeudi, je fais du sport avec un ami : nous courons dans un parc. Le vendredi soir, je sors avec mes amis au cinéma ou au restaurant.", en: "In the afternoon I work some more. I finish at half past five. Usually I go home by metro. On Thursdays I do sport with a friend: we run in a park. On Friday evenings I go out with my friends to the cinema or a restaurant." }
  - { es: "Le soir, je fais la cuisine. Je dîne à huit heures et je regarde un film ou je lis. Je me couche à onze heures. Je suis toujours fatigué, mais j'aime ma vie à Paris. Et le week-end ? Je dors, je dors et je dors !", en: "In the evening I cook. I have dinner at eight and watch a film or read. I go to bed at eleven. I'm always tired, but I like my life in Paris. And at the weekend? I sleep, I sleep and I sleep!" }
questions:
  - { q: "Où travaille Thomas ?", options: ["Dans une banque", "Dans un restaurant", "Dans une école"], answer: 0, explain: "«Je travaille dans une banque, sur l'île de la Cité.»" }
  - { q: "À quelle heure Thomas se réveille ?", options: ["À six heures", "À six heures et demie", "À sept heures et quart"], answer: 1, explain: "«Je me réveille à six heures et demie.» At a quarter past seven he leaves." }
  - { q: "Que fait Thomas dans le métro ?", options: ["Il dort", "Il mange", "Il lit ou il écoute de la musique"], answer: 2, explain: "«Je lis un livre ou j'écoute de la musique.»" }
  - { q: "Qu'est-ce que Thomas entend à midi ?", options: ["Le téléphone", "Les cloches", "La radio"], answer: 1, explain: "«À midi, j'entends les cloches sonner.» For him it means lunchtime." }
  - { q: "Que fait Thomas le jeudi ?", options: ["Il va au cinéma", "Il fait du sport", "Il fait les courses"], answer: 1, explain: "«Le jeudi, je fais du sport avec un ami.» Friday is the cinema or restaurant." }
glossary:
  - { es: boulot, en: work (informal) }
  - { es: dodo, en: sleep (children's word) }
  - { es: "tout de suite", en: right away }
  - { es: plein, en: full }
  - { es: collègues, en: colleagues }
  - { es: banc, en: bench }
  - { es: tartine, en: slice of bread (with butter or jam) }
  - { es: gens, en: people }
