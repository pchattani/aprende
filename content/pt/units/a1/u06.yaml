      - { es: "Você está livre no sábado? E no domingo? E na segunda?", en: "Are you free on Saturday? And on Sunday? And on Monday?", altEs: ["Você tá livre no sábado? E no domingo? E na segunda?"], grammar: [g.days-months], vocab: [w.sábado, w.domingo, w.segunda-feira] }
      - { es: "Eu nunca danço... mas com você, às vezes.", en: "I never dance... but with you, sometimes.", altEs: ["Nunca danço... mas com você, às vezes."], grammar: [g.frequency-adverbs], vocab: [w.nunca, w.às-vezes] }
