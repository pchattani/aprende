id: b2.u07
title: "Il quale, la quale"
lessons:
  - id: b2.u07.l1
    title: Il laboratorio nel quale lavoro
    teach: [g.relative-il-quale]
    vocab: [w.scienza, w.scienziato, w.premio, w.ricercatore, w.esperimento, w.laboratorio, w.scoperta, w.invenzione, w.inventare, w.inventore, w.teoria, w.dimostrazione, w.analisi, w.analizzare, w.metodo, w.studioso, w.del-quale, w.citare, w.citato, w.mediante, w.tramite]
    tip: "Il quale agrees with the noun it refers to and fuses with prepositions (nel quale, alla quale, dei quali). Use it after a preposition or to make clear who you mean; never as a direct object."
    sentences:
      - { es: "Il laboratorio nel quale lavoro si trova vicino ai Sassi.", en: "The laboratory I work in is near the Sassi.", altEs: ["Il laboratorio in cui lavoro si trova vicino ai Sassi.", "Il laboratorio dove lavoro si trova vicino ai Sassi.", "Il laboratorio nel quale lavoro è vicino ai Sassi."], altEn: ["The laboratory where I work is near the Sassi.", "The lab I work in is near the Sassi."], grammar: [g.relative-il-quale], vocab: [w.laboratorio] }
      - { es: "La ricercatrice con la quale ho parlato studia il clima.", en: "The researcher I spoke to studies the climate.", altEs: ["La ricercatrice con cui ho parlato studia il clima."], altEn: ["The researcher I talked to studies the climate.", "The researcher with whom I spoke studies the climate."], grammar: [g.relative-il-quale], vocab: [w.ricercatore] }
      - { es: "Ho conosciuto la sorella di Marco, la quale fa la scienziata a Matera.", en: "I met Marco's sister, who works as a scientist in Matera.", altEs: ["Ho conosciuto la sorella di Marco, la quale lavora come scienziata a Matera."], grammar: [g.relative-il-quale], vocab: [w.scienziato], note: "La quale makes it clear that the sister, not Marco, is the scientist." }
      - { es: "Sono queste le ragioni per le quali l'esperimento è fallito.", en: "These are the reasons why the experiment failed.", altEs: ["Sono queste le ragioni per cui l'esperimento è fallito.", "Queste sono le ragioni per le quali l'esperimento è fallito."], altEn: ["These are the reasons for which the experiment failed."], grammar: [g.relative-il-quale], vocab: [w.esperimento] }
      - { es: "Qual è la scoperta della quale sei più orgoglioso?", en: "Which discovery are you proudest of?", altEs: ["Qual è la scoperta di cui sei più orgoglioso?", "Qual è la scoperta della quale sei più orgogliosa?", "Qual è la scoperta di cui sei più orgogliosa?"], altEn: ["What is the discovery you are most proud of?"], grammar: [g.relative-il-quale], vocab: [w.scoperta] }
      - { es: "Gli studiosi ai quali abbiamo scritto non hanno ancora risposto.", en: "The scholars we wrote to haven't replied yet.", altEs: ["Gli studiosi a cui abbiamo scritto non hanno ancora risposto.", "Gli studiosi ai quali abbiamo scritto non ci hanno ancora risposto."], altEn: ["The scholars to whom we wrote haven't answered yet."], grammar: [g.relative-il-quale], vocab: [w.studioso], transform: { instruction: "Make the scholars women (le studiose)", answer: "Le studiose alle quali abbiamo scritto non hanno ancora risposto.", alt: ["Le studiose a cui abbiamo scritto non hanno ancora risposto."] } }
      - { es: "Il metodo mediante il quale analizziamo i dati è molto semplice.", en: "The method by which we analyse the data is very simple.", altEs: ["Il metodo con il quale analizziamo i dati è molto semplice.", "Il metodo con cui analizziamo i dati è molto semplice."], altEn: ["The method we use to analyse the data is very simple."], grammar: [g.relative-il-quale], vocab: [w.metodo, w.mediante, w.analizzare] }
      - { es: "È una teoria sulla quale ci sarebbe molto da dire.", en: "It's a theory about which there would be a lot to say.", altEs: ["È una teoria su cui ci sarebbe molto da dire."], altEn: ["It's a theory there would be a lot to say about."], grammar: [g.relative-il-quale], vocab: [w.teoria] }
      - { es: "L'inventore del quale ti parlavo è nato in Basilicata.", en: "The inventor I was telling you about was born in Basilicata.", altEs: ["L'inventore di cui ti parlavo è nato in Basilicata."], altEn: ["The inventor I was talking to you about was born in Basilicata."], grammar: [g.relative-il-quale], vocab: [w.inventore, w.del-quale] }
      - { es: "Il libro che ho letto cita molti studiosi del Sud.", en: "The book I read quotes many scholars from the South.", altEs: ["Il libro che ho letto cita parecchi studiosi del Sud."], grammar: [g.relative-il-quale, g.relative-che], vocab: [w.citare, w.studioso], error: { wrong: "Il libro il quale ho letto cita molti studiosi del Sud.", explain: "Il quale is never used as a direct object: the book is what I read, so use che.", grammar: g.relative-il-quale } }
      - { es: "Ho letto l'analisi del professore, il quale però non cita le fonti.", en: "I read the professor's analysis; he, however, doesn't cite his sources.", altEs: ["Ho letto l'analisi del professore, che però non cita le fonti."], altEn: ["I read the analysis by the professor, who however doesn't cite the sources."], grammar: [g.relative-il-quale], vocab: [w.analisi, w.citare], note: "Il quale (masculine) can only mean the professor, not the analysis (feminine)." }
      - { es: "La dimostrazione tramite la quale ha convinto tutti era semplicissima.", en: "The proof with which she convinced everyone was extremely simple.", altEs: ["La dimostrazione con la quale ha convinto tutti era semplicissima.", "La dimostrazione con cui ha convinto tutti era semplicissima."], altEn: ["The proof he used to convince everyone was very simple."], grammar: [g.relative-il-quale], vocab: [w.dimostrazione, w.tramite] }
      - { es: "Chi è lo scienziato al quale hanno dato il premio?", en: "Who is the scientist they gave the prize to?", altEs: ["Chi è lo scienziato a cui hanno dato il premio?"], altEn: ["Who's the scientist who was given the prize?"], grammar: [g.relative-il-quale], vocab: [w.scienziato, w.premio] }
      - { es: "L'invenzione della quale tutti parlano è nata in un piccolo laboratorio.", en: "The invention everyone is talking about was born in a small laboratory.", altEs: ["L'invenzione di cui tutti parlano è nata in un piccolo laboratorio."], grammar: [g.relative-il-quale], vocab: [w.invenzione, w.laboratorio], transform: { instruction: "Replace 'della quale' with cui", answer: "L'invenzione di cui tutti parlano è nata in un piccolo laboratorio.", alt: [] } }
      - { es: "Mi hanno presentato i colleghi di Anna, i quali fanno tutti ricerca sul clima.", en: "They introduced me to Anna's colleagues, who all do research on the climate.", altEs: ["Mi hanno presentato i colleghi di Anna, che fanno tutti ricerca sul clima."], grammar: [g.relative-il-quale], vocab: [w.ricercatore] }
      - { es: "Chi ha inventato il telefono? Secondo molti, Antonio Meucci.", en: "Who invented the telephone? According to many, Antonio Meucci.", altEs: ["Chi ha inventato il telefono? Per molti, Antonio Meucci."], grammar: [g.question-words], vocab: [w.inventare], note: "Meucci's 'telettrofono' predates Bell's patent; the US House of Representatives recognised his work in 2002." }
    exchanges:
      - q: { es: "Con chi hai fatto la tesi?", en: "Who did you do your thesis with?" }
        a: { es: "Con una professoressa di Bari, la quale adesso lavora all'estero.", en: "With a professor from Bari, who now works abroad." }
        alt: ["Con una professoressa di Bari, che adesso lavora all'estero.", "Con una professoressa barese."]
        grammar: [g.relative-il-quale]
        vocab: [w.studioso]
      - q: { es: "Di quale invenzione parlava il programma?", en: "Which invention was the programme about?" }
        a: { es: "Di quella di Marconi, grazie alla quale oggi abbiamo la radio.", en: "Marconi's, thanks to which we have radio today." }
        alt: ["Della radio di Marconi.", "Di quella di Marconi, grazie a cui oggi abbiamo la radio."]
        grammar: [g.relative-il-quale]
        vocab: [w.invenzione]
      - q: { es: "Qual è il laboratorio nel quale lavori?", en: "Which laboratory do you work in?" }
        a: { es: "Quello vicino all'università, accanto alla biblioteca.", en: "The one near the university, next to the library." }
        alt: ["Quello vicino all'università.", "Lavoro in quello accanto alla biblioteca."]
        grammar: [g.relative-il-quale]
        vocab: [w.laboratorio]
      - q: { es: "Perché hai cambiato metodo?", en: "Why did you change method?" }
        a: { es: "Perché il metodo con il quale lavoravo era troppo lento.", en: "Because the method I was working with was too slow." }
        alt: ["Perché il metodo con cui lavoravo era troppo lento.", "Quello vecchio era troppo lento."]
        grammar: [g.relative-il-quale]
        vocab: [w.metodo]
      - q: { es: "Hai trovato la fonte della citazione?", en: "Did you find the source of the quotation?" }
        a: { es: "Sì, è un articolo del 1998 nel quale l'autore cita Galileo.", en: "Yes, it's a 1998 article in which the author quotes Galileo." }
        alt: ["Sì, è un articolo del 1998 in cui l'autore cita Galileo.", "Sì, un articolo del 1998."]
        grammar: [g.relative-il-quale]
        vocab: [w.citare]
    texts:
      - title: "Avviso del laboratorio"
        es: ["Gli studenti ai quali è stato dato un esperimento devono presentarsi alle nove.", "Il laboratorio nel quale si farà l'esperimento è al secondo piano.", "Chi non può venire scriva al professor Rossi."]
        en: ["Students who have been given an experiment must report at nine.", "The laboratory in which the experiment will take place is on the second floor.", "Anyone who can't come should write to Professor Rossi."]
        grammar: [g.relative-il-quale]
        vocab: [w.esperimento, w.laboratorio]
      - title: "Una scoperta a Matera"
        es: ["Nei Sassi gli studiosi hanno trovato una grotta nella quale vivevano famiglie già nella preistoria.", "Le analisi mediante le quali è stata studiata la grotta sono durate due anni.", "I risultati, dei quali si parlerà in un convegno, sono sorprendenti."]
        en: ["In the Sassi, scholars have found a cave in which families were already living in prehistoric times.", "The analyses by which the cave was studied lasted two years.", "The results, which will be discussed at a conference, are surprising."]
        grammar: [g.relative-il-quale]
        vocab: [w.studioso, w.analisi, w.mediante, w.scoperta]
    spicy:
      - { es: "Sei la scoperta della quale vado più orgoglioso.", en: "You're the discovery I'm proudest of.", altEs: ["Sei la scoperta di cui vado più orgoglioso.", "Sei la scoperta della quale vado più orgogliosa.", "Sei la scoperta di cui vado più orgogliosa."], grammar: [g.relative-il-quale], vocab: [w.scoperta] }
      - { es: "Il laboratorio nel quale ci siamo conosciuti adesso mi sembra il posto più romantico del mondo.", en: "The lab where we met now seems like the most romantic place in the world to me.", altEs: ["Il laboratorio in cui ci siamo conosciuti adesso mi sembra il posto più romantico del mondo."], grammar: [g.relative-il-quale], vocab: [w.laboratorio] }
      - { es: "Ho una teoria sulla quale vorrei lavorare con te stasera, a cena.", en: "I've got a theory I'd like to work on with you tonight, over dinner.", altEs: ["Ho una teoria su cui vorrei lavorare con te stasera, a cena."], grammar: [g.relative-il-quale], vocab: [w.teoria] }
      - { es: "La persona con la quale esco stasera è uno scienziato: speriamo che non mi analizzi.", en: "The person I'm going out with tonight is a scientist: let's hope he doesn't analyse me.", altEs: ["La persona con cui esco stasera è uno scienziato: speriamo che non mi analizzi.", "La persona con la quale esco stasera è una scienziata: speriamo che non mi analizzi."], grammar: [g.relative-il-quale], vocab: [w.scienziato, w.analizzare] }
      - { es: "Il metodo mediante il quale mi hai chiesto il numero era poco scientifico, ma ha funzionato.", en: "The method you used to ask for my number wasn't very scientific, but it worked.", altEs: ["Il metodo con il quale mi hai chiesto il numero era poco scientifico, ma ha funzionato."], grammar: [g.relative-il-quale], vocab: [w.metodo, w.mediante, w.scientifico] }

  - id: b2.u07.l2
    title: Il che non mi sorprende
    teach: [g.relative-advanced]
    vocab: [w.il-che, w.cervello, w.malattia, w.virus, w.vaccino, w.farmaco, w.tecnologia, w.tecnologico, w.innovazione, w.innovativo, w.intelligenza-artificiale, w.robot, w.algoritmo, w.informatica, w.informatico, w.programmatore, w.software, w.dispositivo, w.riguardo-a, w.in-merito-a, w.bloccare]
    tip: "Il che sums up a whole idea (which); per cui means so / that's why. A relative clause about something sought, or after a superlative, takes the congiuntivo: cerco qualcuno che sappia…"
    sentences:
      - { es: "Il software si è bloccato di nuovo, il che mi ha fatto perdere un'ora.", en: "The software crashed again, which made me lose an hour.", altEs: ["Il software si è bloccato un'altra volta, il che mi ha fatto perdere un'ora.", "Il software si è bloccato di nuovo, cosa che mi ha fatto perdere un'ora."], altEn: ["The software froze again, which cost me an hour."], grammar: [g.relative-advanced], vocab: [w.software, w.il-che, w.bloccare] }
      - { es: "Cerchiamo un programmatore che conosca bene l'intelligenza artificiale.", en: "We're looking for a programmer who knows artificial intelligence well.", altEs: ["Cerchiamo una programmatrice che conosca bene l'intelligenza artificiale.", "Stiamo cercando un programmatore che conosca bene l'intelligenza artificiale."], grammar: [g.relative-advanced], vocab: [w.programmatore, w.intelligenza-artificiale], note: "Any programmer who fits, not a known person: congiuntivo (conosca)." }
      - { es: "Il vaccino è arrivato in pochi mesi, il che sembrava impossibile.", en: "The vaccine arrived within a few months, which seemed impossible.", altEs: ["Il vaccino è arrivato in pochi mesi, cosa che sembrava impossibile."], grammar: [g.relative-advanced], vocab: [w.vaccino, w.il-che] }
      - { es: "Ho lasciato il dispositivo in ufficio, per cui non posso controllare i dati.", en: "I left the device at the office, so I can't check the data.", altEs: ["Ho dimenticato il dispositivo in ufficio, per cui non posso controllare i dati.", "Ho lasciato il dispositivo in ufficio, quindi non posso controllare i dati."], grammar: [g.relative-advanced], vocab: [w.dispositivo] }
      - { es: "È il farmaco più efficace che esista contro questa malattia.", en: "It's the most effective drug there is against this disease.", altEs: ["È il farmaco più efficace che ci sia contro questa malattia."], altEn: ["It is the most effective medicine that exists for this illness."], grammar: [g.relative-advanced], vocab: [w.farmaco, w.malattia], note: "After a superlative the relative takes the congiuntivo: che esista." }
      - { es: "Non c'è nessun robot che sappia fare il caffè come mia nonna.", en: "There's no robot that can make coffee like my grandmother.", altEs: ["Non esiste un robot che sappia fare il caffè come mia nonna.", "Non c'è robot che sappia fare il caffè come mia nonna."], grammar: [g.relative-advanced], vocab: [w.robot], error: { wrong: "Non c'è nessun robot che sa fare il caffè come mia nonna.", explain: "After 'non c'è nessun… che' the relative clause describes something that doesn't exist, so it takes the congiuntivo: sappia.", grammar: g.relative-advanced } }
      - { es: "Ti ringrazio per quanto hai fatto per il progetto.", en: "Thank you for everything you've done for the project.", altEs: ["Ti ringrazio per tutto quello che hai fatto per il progetto.", "Grazie per quanto hai fatto per il progetto."], grammar: [g.relative-advanced], vocab: [] }
      - { es: "Il centro di ricerca dove lavora mia cugina studia il cervello.", en: "The research centre where my cousin works studies the brain.", altEs: ["Il centro di ricerca in cui lavora mia cugina studia il cervello.", "Il centro di ricerca nel quale lavora mia cugina studia il cervello."], grammar: [g.relative-advanced], vocab: [w.cervello] }
      - { es: "L'algoritmo ha sbagliato tutte le previsioni, il che ha fatto ridere tutti.", en: "The algorithm got every forecast wrong, which made everyone laugh.", altEs: ["L'algoritmo ha sbagliato tutte le previsioni, cosa che ha fatto ridere tutti."], grammar: [g.relative-advanced], vocab: [w.algoritmo, w.il-che] }
      - { es: "Riguardo al virus, non c'è ancora niente che si possa dire con certezza.", en: "As regards the virus, there's still nothing that can be said for certain.", altEs: ["Riguardo al virus, non c'è ancora nulla che si possa dire con certezza."], grammar: [g.relative-advanced], vocab: [w.riguardo-a, w.virus] }
      - { es: "Mia sorella è informatica, per cui le chiedono sempre di riparare i computer.", en: "My sister is an IT specialist, so people always ask her to fix their computers.", altEs: ["Mia sorella fa l'informatica, per cui le chiedono sempre di riparare i computer."], grammar: [g.relative-advanced], vocab: [w.informatico, w.informatica], transform: { instruction: "Change to 'I' (a man)", answer: "Sono informatico, per cui mi chiedono sempre di riparare i computer.", alt: ["Faccio l'informatico, per cui mi chiedono sempre di riparare i computer.", "Io sono informatico, per cui mi chiedono sempre di riparare i computer."] } }
      - { es: "In merito alla Sua richiesta, Le comunico che il dispositivo è ancora in riparazione.", en: "Regarding your request, I can inform you that the device is still being repaired.", altEs: ["In merito alla Sua richiesta, La informo che il dispositivo è ancora in riparazione."], grammar: [g.lei-forms], vocab: [w.in-merito-a, w.dispositivo] }
      - { es: "Cerco un orologio che misuri anche il sonno.", en: "I'm looking for a watch that also measures sleep.", altEs: ["Sto cercando un orologio che misuri anche il sonno."], grammar: [g.relative-advanced], vocab: [w.misurare] }
      - { es: "Questa è la tecnologia più innovativa che io abbia mai visto.", en: "This is the most innovative technology I've ever seen.", altEs: ["È la tecnologia più innovativa che abbia mai visto.", "Questa è la tecnologia più innovativa che abbia mai visto."], grammar: [g.relative-advanced], vocab: [w.tecnologia, w.innovativo], transform: { instruction: "Change to 'we'", answer: "Questa è la tecnologia più innovativa che abbiamo mai visto.", alt: ["È la tecnologia più innovativa che abbiamo mai visto."] } }
      - { es: "Mio nonno usa il telefono solo per chiamare, il che, tutto sommato, non è un male.", en: "My grandfather only uses his phone to make calls, which, all things considered, isn't a bad thing.", grammar: [g.relative-advanced], vocab: [w.il-che] }
      - { es: "L'innovazione tecnologica non serve a niente se nessuno la sa usare.", en: "Technological innovation is useless if nobody knows how to use it.", altEs: ["L'innovazione tecnologica non serve a nulla se nessuno la sa usare."], grammar: [g.direct-object-pronouns], vocab: [w.innovazione, w.tecnologico] }
    exchanges:
      - q: { es: "Hai sentito? Hanno chiuso il laboratorio.", en: "Did you hear? They've closed the laboratory." }
        a: { es: "Sì, il che mi sembra assurdo, visti i risultati.", en: "Yes, which seems absurd to me, given the results." }
        alt: ["Sì, cosa che mi sembra assurda.", "Sì, la qual cosa mi sembra assurda."]
        grammar: [g.relative-advanced]
        vocab: [w.il-che]
      - q: { es: "Che tipo di programmatore cercate?", en: "What kind of programmer are you looking for?" }
        a: { es: "Qualcuno che sappia lavorare con l'intelligenza artificiale.", en: "Someone who can work with artificial intelligence." }
        alt: ["Uno che conosca bene l'intelligenza artificiale.", "Qualcuno che abbia esperienza con l'intelligenza artificiale."]
        grammar: [g.relative-advanced]
        vocab: [w.programmatore, w.intelligenza-artificiale]
      - q: { es: "Come mai non sei venuto ieri?", en: "How come you didn't come yesterday?" }
        a: { es: "Avevo la febbre, per cui sono rimasto a casa.", en: "I had a temperature, so I stayed at home." }
        alt: ["Ero malato, per cui sono rimasto a casa.", "Avevo la febbre, quindi sono rimasto a casa."]
        grammar: [g.relative-advanced]
        vocab: [w.malattia]
      - q: { es: "C'è un farmaco per questa malattia?", en: "Is there a drug for this illness?" }
        a: { es: "Per ora non c'è nessun farmaco che funzioni davvero.", en: "For now there's no drug that really works." }
        alt: ["Per ora no, non c'è niente che funzioni.", "Non ancora."]
        grammar: [g.relative-advanced]
        vocab: [w.farmaco, w.malattia]
      - q: { es: "Grazie mille per l'aiuto con il software!", en: "Thanks so much for the help with the software!" }
        a: { es: "Di niente: è il minimo che potessi fare.", en: "Not at all: it's the least I could do." }
        alt: ["Figurati, è il minimo che potessi fare.", "Di nulla!"]
        grammar: [g.relative-advanced]
        vocab: [w.software]
    texts:
      - title: "Email di lavoro"
        es: ["In merito alla riunione di domani, vi informo che il programmatore è malato.", "La riunione è quindi rinviata a lunedì, il che ci dà più tempo per i test.", "Chi ha domande può scrivermi."]
        en: ["Regarding tomorrow's meeting, I'm letting you know that the programmer is ill.", "The meeting is therefore postponed to Monday, which gives us more time for the tests.", "Anyone with questions can write to me."]
        grammar: [g.relative-advanced]
        vocab: [w.in-merito-a, w.programmatore, w.il-che]
      - title: "Dal giornale"
        es: ["Un gruppo di ricercatori lucani ha creato un algoritmo che riconosce alcune malattie del cervello.", "È il primo dispositivo del genere che funzioni anche senza internet, il che lo rende utile nei piccoli paesi."]
        en: ["A group of researchers from Basilicata has created an algorithm that recognises some brain diseases.", "It is the first device of its kind that works even without the internet, which makes it useful in small villages."]
        grammar: [g.relative-advanced]
        vocab: [w.algoritmo, w.malattia, w.cervello, w.dispositivo]
    spicy:
      - { es: "Cerco qualcuno che mi faccia ridere e che sappia cucinare.", en: "I'm looking for someone who makes me laugh and knows how to cook.", altEs: ["Cerco una persona che mi faccia ridere e che sappia cucinare."], grammar: [g.relative-advanced], vocab: [] }
      - { es: "Mi hai scritto alle tre di notte, il che mi ha fatto molto piacere.", en: "You texted me at three in the morning, which I really liked.", altEs: ["Mi hai scritto alle tre di notte, cosa che mi ha fatto molto piacere."], grammar: [g.relative-advanced], vocab: [w.il-che] }
      - { es: "Non c'è algoritmo che possa calcolare quanto mi piaci.", en: "There's no algorithm that could calculate how much I like you.", altEs: ["Non esiste un algoritmo che possa calcolare quanto mi piaci."], grammar: [g.relative-advanced], vocab: [w.algoritmo, w.calcolare] }
      - { es: "Sei la persona più interessante che io abbia mai conosciuto in un laboratorio.", en: "You're the most interesting person I've ever met in a laboratory.", altEs: ["Sei la persona più interessante che abbia mai conosciuto in un laboratorio."], grammar: [g.relative-advanced], vocab: [w.laboratorio] }
      - { es: "Il mio cervello dice di no, il che non significa che il resto sia d'accordo.", en: "My brain says no, which doesn't mean the rest of me agrees.", grammar: [g.relative-advanced], vocab: [w.cervello, w.il-che] }

  - id: b2.u07.l3
    title: Avendo osservato le stelle
    teach: [g.gerundio-composto]
    vocab: [w.avendo-fatto, w.essendo-arrivato, w.satellite, w.universo, w.astronauta, w.missione, w.galassia, w.telescopio, w.osservatorio, w.microscopio, w.genetica, w.cellula, w.specie, w.evoluzione, w.fisica, w.chimica, w.biologia, w.scientifico, w.reazione, w.lucertola, w.orbita]
    tip: "Avendo / essendo + participle = having done: an action before the main one, often its cause. With essendo the participle agrees: essendo arrivate."
    sentences:
      - { es: "Avendo finito l'esperimento, i ricercatori sono andati a cena.", en: "Having finished the experiment, the researchers went to dinner.", altEs: ["Dopo aver finito l'esperimento, i ricercatori sono andati a cena."], grammar: [g.gerundio-composto], vocab: [w.avendo-fatto, w.esperimento], transform: { instruction: "Change the subject to 'la ricercatrice'", answer: "Avendo finito l'esperimento, la ricercatrice è andata a cena.", alt: ["Dopo aver finito l'esperimento, la ricercatrice è andata a cena."] } }
      - { es: "Essendo arrivati tardi all'osservatorio, non abbiamo visto il tramonto.", en: "Having arrived late at the observatory, we didn't see the sunset.", altEs: ["Siccome eravamo arrivati tardi all'osservatorio, non abbiamo visto il tramonto.", "Essendo arrivate tardi all'osservatorio, non abbiamo visto il tramonto."], grammar: [g.gerundio-composto], vocab: [w.essendo-arrivato, w.osservatorio], error: { wrong: "Avendo arrivati tardi all'osservatorio, non abbiamo visto il tramonto.", explain: "Arrivare takes essere, so the compound gerund is essendo arrivati.", grammar: g.gerundio-composto } }
      - { es: "Avendo studiato fisica a Napoli, Luca ha trovato lavoro in un osservatorio.", en: "Having studied physics in Naples, Luca found work at an observatory.", altEs: ["Dopo aver studiato fisica a Napoli, Luca ha trovato lavoro in un osservatorio."], grammar: [g.gerundio-composto], vocab: [w.fisica, w.osservatorio] }
      - { es: "Non avendo ricevuto risposta, Le scrivo di nuovo.", en: "Not having received a reply, I am writing to you again.", altEs: ["Non avendo ricevuto alcuna risposta, Le scrivo di nuovo.", "Non avendo ricevuto risposta, Le scrivo nuovamente."], altEn: ["As I have not received a reply, I am writing to you again."], grammar: [g.gerundio-composto, g.lei-forms], vocab: [w.avendo-fatto] }
      - { es: "Avendo osservato la galassia con il telescopio, gli studiosi hanno scoperto una nuova stella.", en: "Having observed the galaxy with the telescope, the scholars discovered a new star.", grammar: [g.gerundio-composto], vocab: [w.galassia, w.telescopio] }
      - { es: "Essendosi svegliata tardi, la ricercatrice ha perso il treno per Matera.", en: "Having woken up late, the researcher missed the train to Matera.", altEs: ["Siccome si era svegliata tardi, la ricercatrice ha perso il treno per Matera."], grammar: [g.gerundio-composto], vocab: [w.ricercatore], note: "The reflexive pronoun attaches to essendo: essendosi." }
      - { es: "Avendo analizzato le cellule al microscopio, la ricercatrice ha confermato la teoria.", en: "Having analysed the cells under the microscope, the researcher confirmed the theory.", grammar: [g.gerundio-composto], vocab: [w.cellula, w.microscopio, w.confermare] }
      - { es: "Avendolo letto in una rivista scientifica, ci ho creduto subito.", en: "Having read it in a scientific journal, I believed it straight away.", altEs: ["Siccome l'avevo letto in una rivista scientifica, ci ho creduto subito."], grammar: [g.gerundio-composto], vocab: [w.scientifico], note: "Object pronouns attach to avendo: avendolo, avendola." }
      - { es: "Non essendo mai stata nello spazio, non so cosa si provi.", en: "Never having been to space, I don't know what it feels like.", altEs: ["Non essendo mai stato nello spazio, non so cosa si provi.", "Non essendo mai stata nello spazio, non so che cosa si provi."], grammar: [g.gerundio-composto], vocab: [w.essendo-arrivato] }
      - { es: "Avendo perso il treno, abbiamo preso l'autobus per Matera.", en: "Having missed the train, we took the bus to Matera.", grammar: [g.gerundio-composto], vocab: [w.avendo-fatto], transform: { instruction: "Rewrite it the conversational way, with 'siccome'", answer: "Siccome avevamo perso il treno, abbiamo preso l'autobus per Matera.", alt: ["Dato che avevamo perso il treno, abbiamo preso l'autobus per Matera."] } }
      - { es: "Essendo tornato dalla missione, l'astronauta ha dormito per due giorni.", en: "Having come back from the mission, the astronaut slept for two days.", grammar: [g.gerundio-composto], vocab: [w.astronauta, w.missione], transform: { instruction: "Make it plural and feminine: le astronaute", answer: "Essendo tornate dalla missione, le astronaute hanno dormito per due giorni.", alt: [] } }
      - { es: "Avendo letto Darwin, capisco meglio l'evoluzione delle specie.", en: "Having read Darwin, I understand the evolution of species better.", altEs: ["Avendo letto Darwin, capisco meglio l'evoluzione della specie."], grammar: [g.gerundio-composto], vocab: [w.evoluzione, w.specie] }
      - { es: "La chimica non mi è mai piaciuta, ma, avendo avuto un'ottima professoressa, ho preso un bel voto.", en: "I never liked chemistry, but, having had an excellent teacher, I got a good mark.", grammar: [g.gerundio-composto], vocab: [w.chimica] }
      - { es: "Il satellite, essendo partito con un giorno di ritardo, arriverà in orbita domenica.", en: "The satellite, having left a day late, will reach orbit on Sunday.", grammar: [g.gerundio-composto], vocab: [w.satellite] }
      - { es: "Avendo scelto biologia, mio figlio passa le giornate in laboratorio.", en: "Having chosen biology, my son spends his days in the lab.", grammar: [g.gerundio-composto], vocab: [w.biologia, w.laboratorio] }
      - { es: "Quanto è grande l'universo? Nessuno lo sa con certezza.", en: "How big is the universe? Nobody knows for sure.", altEs: ["Quanto è grande l'universo? Nessuno lo sa di sicuro."], grammar: [g.question-words], vocab: [w.universo] }
    exchanges:
      - q: { es: "Perché non siete entrati alla conferenza?", en: "Why didn't you go into the lecture?" }
        a: { es: "Essendo arrivati tardi, abbiamo preferito aspettare fuori.", en: "Having arrived late, we preferred to wait outside." }
        alt: ["Eravamo in ritardo, quindi abbiamo aspettato fuori.", "Essendo arrivate tardi, abbiamo preferito aspettare fuori."]
        grammar: [g.gerundio-composto]
        vocab: [w.essendo-arrivato]
      - q: { es: "Come hai fatto a riconoscere quella galassia?", en: "How did you manage to recognise that galaxy?" }
        a: { es: "Avendola già vista al telescopio, l'ho riconosciuta subito.", en: "Having already seen it through the telescope, I recognised it immediately." }
        alt: ["L'avevo già vista al telescopio.", "Avendola già osservata, l'ho riconosciuta subito."]
        grammar: [g.gerundio-composto]
        vocab: [w.galassia, w.telescopio]
      - q: { es: "Perché vuoi studiare genetica?", en: "Why do you want to study genetics?" }
        a: { es: "Avendo letto molto sull'evoluzione, voglio capire come funzionano le cellule.", en: "Having read a lot about evolution, I want to understand how cells work." }
        alt: ["Perché voglio capire come funzionano le cellule.", "Mi interessa l'evoluzione."]
        grammar: [g.gerundio-composto]
        vocab: [w.genetica, w.evoluzione, w.cellula]
      - q: { es: "Sei mai stata in un osservatorio?", en: "Have you ever been to an observatory?" }
        a: { es: "Sì, ed essendoci andata di notte, ho visto benissimo le stelle.", en: "Yes, and having gone at night, I saw the stars perfectly." }
        alt: ["Sì, una volta, di notte.", "No, mai."]
        grammar: [g.gerundio-composto]
        vocab: [w.osservatorio]
      - q: { es: "Hai risposto all'email del professore?", en: "Have you replied to the professor's email?" }
        a: { es: "Non ancora: non avendo finito l'analisi, preferisco aspettare.", en: "Not yet: not having finished the analysis, I'd rather wait." }
        alt: ["No, non ho ancora finito l'analisi.", "Non ancora, aspetto di finire l'analisi."]
        grammar: [g.gerundio-composto]
        vocab: [w.analisi]
    texts:
      - title: "Diario di bordo"
        es: ["Avendo lasciato la Terra tre mesi fa, siamo ormai a metà della missione.", "Essendoci abituati alla vita nello spazio, adesso dormiamo meglio.", "Ieri, avendo finito gli esperimenti, abbiamo guardato l'Italia dal finestrino."]
        en: ["Having left Earth three months ago, we are now halfway through the mission.", "Having got used to life in space, we now sleep better.", "Yesterday, having finished the experiments, we looked at Italy through the window."]
        grammar: [g.gerundio-composto]
        vocab: [w.missione, w.esperimento]
      - title: "Notizia scientifica"
        es: ["Un gruppo di biologi, avendo studiato una specie di lucertola dei Sassi, ha fatto una scoperta curiosa.", "Essendosi adattata alle grotte, la lucertola vede meglio al buio delle sue cugine."]
        en: ["A group of biologists, having studied a species of lizard from the Sassi, has made a curious discovery.", "Having adapted to the caves, the lizard sees better in the dark than its cousins."]
        grammar: [g.gerundio-composto]
        vocab: [w.specie, w.scoperta, w.biologia]
    spicy:
      - { es: "Avendo visto il tuo sorriso, ho dimenticato tutta la fisica che sapevo.", en: "Having seen your smile, I forgot all the physics I knew.", altEs: ["Dopo aver visto il tuo sorriso, ho dimenticato tutta la fisica che sapevo."], grammar: [g.gerundio-composto], vocab: [w.fisica] }
      - { es: "Essendo arrivato in anticipo all'appuntamento, ho avuto il tempo di pettinarmi tre volte.", en: "Having arrived early for the date, I had time to comb my hair three times.", altEs: ["Essendo arrivata in anticipo all'appuntamento, ho avuto il tempo di pettinarmi tre volte."], grammar: [g.gerundio-composto], vocab: [w.essendo-arrivato] }
      - { es: "Non avendo un telescopio, ti guardo da vicino.", en: "Not having a telescope, I'll look at you up close.", grammar: [g.gerundio-composto], vocab: [w.telescopio] }
      - { es: "Avendo studiato chimica, posso dirti che tra noi c'è una reazione.", en: "Having studied chemistry, I can tell you there's a reaction between us.", grammar: [g.gerundio-composto], vocab: [w.chimica, w.reazione] }
      - { es: "Avendo calcolato la distanza tra il mio divano e il tuo, propongo di ridurla.", en: "Having calculated the distance between my sofa and yours, I propose we reduce it.", grammar: [g.gerundio-composto], vocab: [w.calcolare, w.distanza] }

  - id: b2.u07.l4
    title: Cifre, misure e il che
    teach: [g.relative-il-quale, g.relative-advanced]
    vocab: [w.energia-solare, w.rinnovabile, w.pannello-solare, w.emissioni, w.gas-serra, w.relativo, w.rispettivo, w.suddetto, w.cifra, w.percentuale, w.media, w.statistica, w.grafico, w.calcolare, w.misurare, w.peso, w.altezza, w.lunghezza, w.larghezza, w.profondità, w.velocità, w.distanza, w.pannello, w.precisione, w.antenna, w.movimento, w.millimetro]
    tip: "In reports and data, il quale and il che keep long sentences clear: il grafico dal quale risulta…, il che significa che…"
    sentences:
      - { es: "Il grafico dal quale risulta l'aumento delle emissioni è a pagina tre.", en: "The chart that shows the increase in emissions is on page three.", altEs: ["Il grafico da cui risulta l'aumento delle emissioni è a pagina tre."], grammar: [g.relative-il-quale], vocab: [w.grafico, w.emissioni] }
      - { es: "Le emissioni di gas serra sono diminuite del dieci per cento, il che è un buon segnale.", en: "Greenhouse gas emissions have fallen by ten per cent, which is a good sign.", altEs: ["Le emissioni di gas serra sono calate del dieci per cento, il che è un buon segnale."], grammar: [g.relative-advanced], vocab: [w.gas-serra, w.emissioni, w.il-che] }
      - { es: "Ci serve un pannello solare che produca abbastanza energia per tutta la casa.", en: "We need a solar panel that produces enough energy for the whole house.", altEs: ["Abbiamo bisogno di un pannello solare che produca abbastanza energia per tutta la casa."], grammar: [g.relative-advanced], vocab: [w.pannello-solare] }
      - { es: "La percentuale di energia rinnovabile, la quale dieci anni fa era bassissima, è raddoppiata.", en: "The percentage of renewable energy, which was very low ten years ago, has doubled.", altEs: ["La percentuale di energia rinnovabile, che dieci anni fa era bassissima, è raddoppiata."], grammar: [g.relative-il-quale], vocab: [w.percentuale, w.rinnovabile] }
      - { es: "Ho misurato la larghezza della porta, per cui sono sicuro che il divano non passa.", en: "I've measured the width of the door, so I'm sure the sofa won't go through.", altEs: ["Ho misurato la larghezza della porta, per cui sono sicura che il divano non passa."], grammar: [g.relative-advanced], vocab: [w.misurare, w.larghezza] }
      - { es: "Matera si trova a circa quattrocento metri di altezza, il che spiega il fresco della sera.", en: "Matera lies at about four hundred metres above sea level, which explains the cool evenings.", altEs: ["Matera è a circa quattrocento metri di altezza, il che spiega il fresco della sera."], grammar: [g.relative-advanced], vocab: [w.altezza, w.il-che] }
      - { es: "Le grotte, alcune delle quali sono profonde venti metri, erano abitate già nella preistoria.", en: "The caves, some of which are twenty metres deep, were already inhabited in prehistoric times.", grammar: [g.relative-il-quale], vocab: [w.profondità] }
      - { es: "I due studenti hanno presentato le rispettive analisi, nelle quali però mancano le statistiche.", en: "The two students presented their respective analyses, which, however, lack statistics.", grammar: [g.relative-il-quale], vocab: [w.rispettivo, w.statistica] }
      - { es: "Non conosco nessuno che rispetti il limite di velocità su quella strada.", en: "I don't know anyone who keeps to the speed limit on that road.", altEs: ["Non conosco nessuno che rispetti i limiti di velocità su quella strada."], grammar: [g.relative-advanced], vocab: [w.velocità] }
      - { es: "La distanza tra Matera e Bari è di circa sessanta chilometri, per cui ci si arriva in un'ora.", en: "The distance between Matera and Bari is about sixty kilometres, so you get there in an hour.", altEs: ["Tra Matera e Bari ci sono circa sessanta chilometri, per cui ci si arriva in un'ora."], grammar: [g.relative-advanced], vocab: [w.distanza] }
      - { es: "Il pacco, il quale va spedito domani, pesa più di venti chili.", en: "The parcel, which is to be sent tomorrow, weighs more than twenty kilos.", altEs: ["Il pacco, che va spedito domani, pesa più di venti chili."], grammar: [g.relative-il-quale, g.passive-andare], vocab: [w.peso], transform: { instruction: "Replace 'il pacco' with 'la valigia'", answer: "La valigia, la quale va spedita domani, pesa più di venti chili.", alt: ["La valigia, che va spedita domani, pesa più di venti chili."] } }
      - { es: "Il progetto nel quale ho lavorato riguarda l'energia solare.", en: "The project I worked on is about solar energy.", altEs: ["Il progetto in cui ho lavorato riguarda l'energia solare.", "Il progetto al quale ho lavorato riguarda l'energia solare."], grammar: [g.relative-il-quale], vocab: [w.energia-solare], error: { wrong: "Il progetto in il quale ho lavorato riguarda l'energia solare.", explain: "The preposition fuses with the article: in + il quale = nel quale.", grammar: g.relative-il-quale } }
      - { es: "Le cifre relative al turismo, le quali sono state pubblicate ieri, sono incoraggianti.", en: "The tourism figures, which were published yesterday, are encouraging.", grammar: [g.relative-il-quale], vocab: [w.cifra, w.relativo], transform: { instruction: "Replace 'le quali' with che (more neutral)", answer: "Le cifre relative al turismo, che sono state pubblicate ieri, sono incoraggianti.", alt: [] } }
      - { es: "Tutti i dati citati nel suddetto rapporto vanno verificati.", en: "All the data quoted in the aforementioned report must be checked.", altEs: ["Tutti i dati citati nel rapporto suddetto vanno verificati."], grammar: [g.passive-andare], vocab: [w.suddetto, w.citato] }
      - { es: "Puoi calcolare la media di queste cifre?", en: "Can you calculate the average of these figures?", altEs: ["Riesci a calcolare la media di queste cifre?", "Mi calcoli la media di queste cifre?"], grammar: [g.potere-dovere], vocab: [w.calcolare, w.media, w.cifra] }
      - { es: "Qual è la lunghezza esatta del ponte?", en: "What is the exact length of the bridge?", altEs: ["Quanto è lungo esattamente il ponte?"], altEn: ["How long exactly is the bridge?"], grammar: [g.question-words], vocab: [w.lunghezza] }
    exchanges:
      - q: { es: "Quanto è alta la torre?", en: "How tall is the tower?" }
        a: { es: "Circa trenta metri, il che la rende visibile da tutta la città.", en: "About thirty metres, which makes it visible from all over town." }
        alt: ["Circa trenta metri.", "Più o meno trenta metri."]
        grammar: [g.relative-advanced]
        vocab: [w.altezza, w.il-che]
      - q: { es: "Hai visto le statistiche sul turismo?", en: "Have you seen the tourism statistics?" }
        a: { es: "Sì: i visitatori sono aumentati del trenta per cento, il che non mi sorprende.", en: "Yes: visitors have gone up by thirty per cent, which doesn't surprise me." }
        alt: ["Sì, sono aumentati del trenta per cento.", "Sì, cosa che non mi sorprende affatto."]
        grammar: [g.relative-advanced]
        vocab: [w.statistica, w.percentuale]
      - q: { es: "Che tetto serve per i pannelli solari?", en: "What kind of roof do you need for solar panels?" }
        a: { es: "Un tetto che sia esposto a sud e che non abbia ombra.", en: "A roof that faces south and has no shade." }
        alt: ["Uno che sia esposto a sud.", "Un tetto esposto a sud, senza ombra."]
        grammar: [g.relative-advanced]
        vocab: [w.pannello-solare]
      - q: { es: "Quanto pesa la valigia?", en: "How much does the suitcase weigh?" }
        a: { es: "Ventidue chili esatti, per cui va bene per l'aereo.", en: "Exactly twenty-two kilos, so it's fine for the plane." }
        alt: ["Ventidue chili.", "Ventidue chili, per cui possiamo portarla."]
        grammar: [g.relative-advanced]
        vocab: [w.peso]
      - q: { es: "Qual è la velocità media del treno?", en: "What's the train's average speed?" }
        a: { es: "Novanta chilometri all'ora, il che, su questa linea, non è male.", en: "Ninety kilometres an hour, which, on this line, isn't bad." }
        alt: ["Novanta all'ora.", "Circa novanta chilometri all'ora."]
        grammar: [g.relative-advanced]
        vocab: [w.velocità, w.media]
    texts:
      - title: "Il rapporto sull'energia"
        es: ["Nel nostro comune i pannelli solari, i quali sono stati montati sulle scuole, producono il quaranta per cento dell'energia.", "Le emissioni sono calate di un terzo, il che ci ha fatto risparmiare molto.", "Il grafico relativo ai consumi è allegato."]
        en: ["In our town the solar panels, which were installed on the schools, produce forty per cent of the energy.", "Emissions have fallen by a third, which has saved us a lot of money.", "The chart on consumption is attached."]
        grammar: [g.relative-il-quale, g.relative-advanced]
        vocab: [w.pannello-solare, w.emissioni, w.grafico, w.relativo]
      - title: "Misure di casa"
        es: ["La stanza nella quale dormo è lunga quattro metri e larga tre.", "Il letto, la cui lunghezza è di due metri, entra appena.", "Per cui, niente armadio nuovo!"]
        en: ["The room I sleep in is four metres long and three wide.", "The bed, which is two metres long, only just fits.", "So, no new wardrobe!"]
        grammar: [g.relative-il-quale, g.relative-il-cui]
        vocab: [w.lunghezza]
    spicy:
      - { es: "Ho calcolato la distanza tra noi due: troppa, il che va corretto subito.", en: "I've calculated the distance between the two of us: too much, which needs fixing right away.", grammar: [g.relative-advanced], vocab: [w.calcolare, w.distanza, w.il-che] }
      - { es: "La media di un primo appuntamento è di due ore; il nostro ne è durato sei, il che è statisticamente sospetto.", en: "The average first date lasts two hours; ours lasted six, which is statistically suspicious.", grammar: [g.relative-advanced], vocab: [w.media, w.statistica, w.il-che] }
      - { es: "Il divano sul quale ci siamo baciati la prima volta pesa troppo per il trasloco, ma non lo lascio.", en: "The sofa we first kissed on is too heavy for the move, but I'm not leaving it behind.", altEs: ["Il divano su cui ci siamo baciati la prima volta pesa troppo per il trasloco, ma non lo lascio."], grammar: [g.relative-il-quale], vocab: [w.peso] }
      - { es: "La tua altezza è perfetta: ti posso baciare senza alzarmi in punta di piedi, il che è comodo.", en: "Your height is perfect: I can kiss you without standing on tiptoe, which is handy.", grammar: [g.relative-advanced], vocab: [w.altezza, w.il-che] }
      - { es: "Non esiste un grafico che possa mostrare quanto mi sei mancato.", en: "There's no chart that could show how much I missed you.", altEs: ["Non c'è grafico che possa mostrare quanto mi sei mancato.", "Non esiste un grafico che possa mostrare quanto mi sei mancata."], grammar: [g.relative-advanced], vocab: [w.grafico] }

dialogues:
  - id: b2.u07.d1
    title: Nei Sassi di Matera
    context: Emma, a physicist who has just started working in Matera, takes a guided tour of the Sassi with Rocco, a local guide.
    lines:
      - { speaker: Rocco, es: "Benvenuta! Questa è la grotta nella quale viveva una famiglia di sette persone fino agli anni Cinquanta.", en: "Welcome! This is the cave in which a family of seven lived until the 1950s." }
      - { speaker: Emma, es: "Sette persone qui dentro? Senza luce né acqua, immagino.", en: "Seven people in here? Without light or water, I imagine." }
      - { speaker: Rocco, es: "Esatto, e spesso anche con gli animali, il che oggi sembra incredibile.", en: "Exactly, and often with the animals too, which seems incredible today." }
      - { speaker: Emma, es: "Avendo letto Carlo Levi, sapevo che la vita qui era dura, ma vederlo è un'altra cosa.", en: "Having read Carlo Levi, I knew life here was hard, but seeing it is something else." }
      - { speaker: Rocco, es: "Lei è qui in vacanza o per lavoro?", en: "Are you here on holiday or for work?" }
      - { speaker: Emma, es: "Per lavoro: sono una fisica e collaboro con il Centro di Geodesia Spaziale, il quale si trova sulla collina qui vicino.", en: "For work: I'm a physicist and I work with the Space Geodesy Centre, which is on the hill near here." }
      - { speaker: Rocco, es: "Ah, quello delle grandi antenne! E che cosa misurate, esattamente?", en: "Ah, the one with the big antennas! And what do you measure, exactly?" }
      - { speaker: Emma, es: "I movimenti della Terra, mediante i satelliti, con una precisione di pochi millimetri.", en: "The movements of the Earth, by means of satellites, with a precision of a few millimetres." }
      - { speaker: Rocco, es: "Quindi, essendo arrivata solo ieri, ha già visto più Matera dallo spazio che da qui!", en: "So, having only arrived yesterday, you've already seen more of Matera from space than from here!" }
      - { speaker: Emma, es: "Proprio così. Per questo ho cercato una guida che conoscesse bene i Sassi.", en: "Exactly. That's why I looked for a guide who knew the Sassi well." }
      - { speaker: Rocco, es: "Allora ha scelto bene: sono nato in una di queste case, la quale oggi è un piccolo museo.", en: "Then you chose well: I was born in one of these houses, which is a small museum today." }
    questions:
      - { q: "Fino a quando una famiglia ha vissuto nella grotta?", options: ["Fino all'Ottocento", "Fino agli anni Cinquanta", "Fino al 2019"], answer: 1, explain: "Rocco says a family of seven lived there 'fino agli anni Cinquanta'." }
      - { q: "Perché Emma è a Matera?", options: ["È in vacanza con la famiglia", "Lavora con il Centro di Geodesia Spaziale", "Scrive un libro su Carlo Levi"], answer: 1, explain: "She is there for work: she is a physicist at the Space Geodesy Centre." }
      - { q: "Che cosa misura il centro dove lavora Emma?", options: ["I movimenti della Terra", "La profondità delle grotte", "La velocità del vento"], answer: 0, explain: "'I movimenti della Terra, mediante i satelliti.'" }
