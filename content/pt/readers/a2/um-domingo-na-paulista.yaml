id: r.a2.um-domingo-na-paulista
level: a2
title: Um domingo na Paulista
kind: text
intro: Mariana, who moved from Recife to São Paulo, writes in her diary about the Sunday she spent on Avenida Paulista, when the avenue is closed to cars.
allow: [mariana, paula, recife, masp, paulista, sesc, lina, bo, bardi, consolação, ok]
paragraphs:
  - { es: "Querido diário, hoje foi um dia ótimo. Eu moro em São Paulo há dois meses e, até ontem, eu só conhecia o caminho de casa para o trabalho. Hoje de manhã, a minha colega Paula me ligou e me convidou para passear na Avenida Paulista. Aos domingos, a avenida fecha para os carros e fica cheia de gente.", en: "Dear diary, today was a great day. I've lived in São Paulo for two months and, until yesterday, I only knew the way from home to work. This morning my colleague Paula called me and invited me for a walk on Avenida Paulista. On Sundays, the avenue closes to cars and fills up with people." }
  - { es: "Eu peguei o metrô e desci na estação Consolação às dez horas. A Paula já estava lá, com a bicicleta dela. Nós andamos devagar pela avenida. Tinha muitas pessoas de bicicleta, de patins e a pé. Tinha músicos em todas as esquinas: um tocava violão, outro cantava samba, e uma banda de rock tocava muito alto na frente de um banco.", en: "I took the metro and got off at Consolação station at ten. Paula was already there, with her bike. We walked slowly along the avenue. There were lots of people on bikes, on skates and on foot. There were musicians on every corner: one was playing the guitar, another was singing samba, and a rock band was playing very loudly in front of a bank." }
  - { es: "Depois, nós visitamos o MASP, o museu de arte mais famoso da cidade. O prédio é muito diferente: ele é vermelho e fica no ar, em cima de quatro colunas. Embaixo dele, tem um espaço grande e livre. Lá dentro, eu vi quadros de artistas brasileiros e europeus. Eu gostei muito, mas fiquei cansada depois de duas horas.", en: "Afterwards we visited MASP, the most famous art museum in the city. The building is very different: it's red and it floats in the air, on top of four columns. Underneath it, there's a big open space. Inside, I saw paintings by Brazilian and European artists. I liked it a lot, but I got tired after two hours." }
  - { es: "Na hora do almoço, nós comemos num restaurante japonês perto da avenida. São Paulo tem comida do mundo todo! Eu comi sushi pela primeira vez e adorei. A Paula riu muito quando eu tentei usar os palitos.", en: "At lunchtime, we ate at a Japanese restaurant near the avenue. São Paulo has food from all over the world! I ate sushi for the first time and loved it. Paula laughed a lot when I tried to use the chopsticks." }
  - { es: "À tarde, nós sentamos num banco e olhamos as pessoas. Começou a chover um pouco, mas ninguém foi embora. A Paula disse: «Em São Paulo, a gente não para por causa da garoa.» Eu voltei para casa às sete, cansada e feliz. Agora eu entendo por que os paulistanos amam a Paulista.", en: "In the afternoon, we sat on a bench and watched the people. It started to rain a little, but nobody left. Paula said: 'In São Paulo, we don't stop because of drizzle.' I went back home at seven, tired and happy. Now I understand why paulistanos love the Paulista." }
questions:
  - { q: "Há quanto tempo a Mariana mora em São Paulo?", options: ["Há dois anos", "Há dois meses", "Há duas semanas"], answer: 1, explain: "«Eu moro em São Paulo há dois meses.»" }
  - { q: "O que acontece na Avenida Paulista aos domingos?", options: ["Ela fecha para os carros", "Tem uma feira de comida japonesa", "O metrô não funciona"], answer: 0, explain: "«Aos domingos, a avenida fecha para os carros e fica cheia de gente.»" }
  - { q: "Como é o prédio do MASP?", options: ["Branco e muito alto", "Vermelho, em cima de quatro colunas", "Antigo e pequeno"], answer: 1, explain: "«Ele é vermelho e fica no ar, em cima de quatro colunas.»" }
  - { q: "Por que a Paula riu no restaurante?", options: ["Porque a Mariana não gostou do sushi", "Porque a Mariana tentou usar os palitos", "Porque a comida era muito cara"], answer: 1, explain: "«A Paula riu muito quando eu tentei usar os palitos.»" }
  - { q: "O que as pessoas fizeram quando começou a chover?", options: ["Foram embora", "Entraram no museu", "Ficaram na avenida"], answer: 2, explain: "«Começou a chover um pouco, mas ninguém foi embora.»" }
