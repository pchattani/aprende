id: b2.u06
title: "Ela pediu que eu viesse"
lessons:
  - id: b2.u06.l1
    title: Ela pediu que eu viesse
    teach: [g.reported-speech-subjunctive]
    vocab: [w.sussurrar, w.murmurar, w.cochichar, w.berrar, w.gaguejar, w.insinuar, w.confidência, w.desabafo, w.conversa-fiada, w.papo, w.bater-papo, w.fofocar, w.implorar, w.suplicar, w.versão, w.comentário]
    tip: "When you report a request or wish in the past, the subjunctive moves back: “Venha!” → Ela pediu que eu viesse. A future subjunctive moves too: “Se eu puder…” → Disse que, se pudesse…"
    sentences:
      - { es: "Ela pediu que eu viesse a Natal no Réveillon.", en: "She asked me to come to Natal for New Year's Eve.", altEs: ["Ela pediu para eu vir a Natal no Réveillon.", "Ela me pediu que viesse a Natal no Réveillon."], grammar: [g.reported-speech-subjunctive], vocab: [], error: { wrong: "Ela pediu que eu venha a Natal no Réveillon.", explain: "The report is in the past (pediu), so the subjunctive moves to the imperfect: viesse.", grammar: g.reported-speech-subjunctive } }
      - { es: "Ele me sussurrou que eu não contasse nada a ninguém.", en: "He whispered to me not to tell anyone anything.", altEs: ["Ele sussurrou para eu não contar nada a ninguém.", "Ele me sussurrou que eu não contasse nada para ninguém."], grammar: [g.reported-speech-subjunctive], vocab: [w.sussurrar] }
      - { es: "A minha avó murmurou que esperava que a gente fosse muito feliz.", en: "My grandmother murmured that she hoped we'd be very happy.", altEs: ["Minha avó murmurou que esperava que nós fôssemos muito felizes."], grammar: [g.reported-speech-subjunctive, g.subjunctive-imperfect], vocab: [w.murmurar] }
      - { es: "As duas cochicharam o jantar inteiro; depois disseram que era só conversa fiada.", en: "The two of them whispered all through dinner; afterwards they said it was just idle chat.", grammar: [g.reported-speech-past], vocab: [w.cochichar, w.conversa-fiada] }
      - { es: "O vizinho berrou que a gente desligasse o som.", en: "The neighbour yelled at us to turn the music off.", altEs: ["O vizinho berrou para a gente desligar o som.", "O vizinho berrou que nós desligássemos o som."], grammar: [g.reported-speech-subjunctive], vocab: [w.berrar] }
      - { es: "Ele gaguejou, ficou vermelho e pediu que eu repetisse a pergunta.", en: "He stammered, went red and asked me to repeat the question.", altEs: ["Ele gaguejou, ficou vermelho e pediu para eu repetir a pergunta."], grammar: [g.reported-speech-subjunctive], vocab: [w.gaguejar] }
      - { es: "Ela insinuou que talvez fosse melhor eu ir embora.", en: "She hinted that it might be better if I left.", grammar: [g.reported-speech-subjunctive, g.talvez], vocab: [w.insinuar] }
      - { es: "Minha amiga me fez uma confidência e pediu que eu guardasse segredo.", en: "My friend confided in me and asked me to keep it a secret.", altEs: ["A minha amiga me fez uma confidência e pediu que eu guardasse segredo."], grammar: [g.reported-speech-subjunctive], vocab: [w.confidência] }
      - { es: "Depois do desabafo, ele disse que se sentia mais leve.", en: "After getting it off his chest, he said he felt lighter.", grammar: [g.reported-speech-past], vocab: [w.desabafo], note: "A reported fact keeps the indicative (se sentia); only requests and wishes take the subjunctive." }
      - { es: "A gente bateu papo na praia de Ponta Negra até o sol nascer.", en: "We chatted on Ponta Negra beach until the sun came up.", altEs: ["Nós batemos papo na praia de Ponta Negra até o sol nascer."], grammar: [g.preterite-regular, g.a-gente], vocab: [w.bater-papo, w.papo], variant: "Portugal: conversar or pôr a conversa em dia; papo is mostly Brazilian." }
      - { es: "Pedi que parassem de fofocar sobre a minha vida.", en: "I asked them to stop gossiping about my life.", altEs: ["Pedi para pararem de fofocar sobre a minha vida.", "Eu pedi que parassem de fofocar da minha vida."], grammar: [g.reported-speech-subjunctive], vocab: [w.fofocar] }
      - { es: "Ele implorou que ela não fosse embora.", en: "He begged her not to leave.", altEs: ["Ele implorou para ela não ir embora."], grammar: [g.reported-speech-subjunctive, g.reported-commands], vocab: [w.implorar] }
      - { es: "A mãe suplicou que o filho voltasse para casa antes do Natal.", en: "The mother pleaded with her son to come home before Christmas.", grammar: [g.reported-speech-subjunctive], vocab: [w.suplicar], note: "Natal means Christmas: the city was named for the day it was founded, 25 December 1599." }
      - { es: "Cada um tem a sua versão: ela diz que ele não ligou, ele diz que ela não atendeu.", en: "Each of them has their own version: she says he didn't call, he says she didn't pick up.", grammar: [g.reported-speech-present], vocab: [w.versão] }
      - { es: "«Venha à festa!», ela me disse.", en: "“Come to the party!” she told me.", altEs: ["«Vem pra festa!», ela me disse."], grammar: [g.imperative-formal], vocab: [], transform: { instruction: "Report it in the past with que + subjunctive", answer: "Ela me disse que eu viesse à festa.", alt: ["Ela me disse para eu vir à festa.", "Ela disse que eu viesse à festa.", "Ela me pediu que eu viesse à festa."], en: "She told me to come to the party." } }
      - { es: "«Se eu puder, vou ao show», disse o Rafa.", en: "“If I can, I'll go to the show,” said Rafa.", grammar: [g.future-subjunctive-se], vocab: [w.comentário], note: "His comment contains a future subjunctive: watch how it shifts when reported.", transform: { instruction: "Report it: O Rafa disse que…", answer: "O Rafa disse que, se pudesse, iria ao show.", alt: ["O Rafa disse que, se pudesse, ia ao show.", "O Rafa disse que iria ao show, se pudesse."], en: "Rafa said that if he could, he'd go to the show." } }
    exchanges:
      - q: { es: "O que ela te disse no ouvido?", en: "What did she whisper in your ear?" }
        a: { es: "Pediu que eu não contasse para ninguém.", en: "She asked me not to tell anyone." }
        alt: ["Pediu para eu não contar para ninguém.", "Segredo!"]
        grammar: [g.reported-speech-subjunctive]
        vocab: [w.sussurrar]
      - q: { es: "Por que vocês estavam cochichando?", en: "Why were you two whispering?" }
        a: { es: "Era só fofoca; a Bia pediu que eu não espalhasse.", en: "It was just gossip; Bia asked me not to spread it." }
        alt: ["Conversa fiada, nada importante.", "Ela me fez uma confidência."]
        grammar: [g.reported-speech-subjunctive]
        vocab: [w.cochichar]
      - q: { es: "O que o seu pai queria?", en: "What did your father want?" }
        a: { es: "Queria que eu estudasse Direito, mas eu escolhi Letras.", en: "He wanted me to study law, but I chose literature." }
        alt: ["Queria que eu fosse médico.", "Que eu voltasse cedo."]
        grammar: [g.reported-speech-subjunctive, g.subjunctive-imperfect]
        vocab: []
      - q: { es: "Ele gaguejou quando te viu?", en: "Did he stammer when he saw you?" }
        a: { es: "Gaguejou e pediu que eu repetisse o meu nome três vezes.", en: "He stammered and asked me to repeat my name three times." }
        alt: ["Gaguejou um pouco.", "Não, ele foi supertranquilo."]
        grammar: [g.reported-speech-subjunctive]
        vocab: [w.gaguejar]
      - q: { es: "Sobre o que vocês bateram papo?", en: "What did you chat about?" }
        a: { es: "Conversa fiada: praia, futebol e quem namora quem.", en: "Small talk: the beach, football and who's going out with whom." }
        alt: ["Sobre tudo e nada.", "Foi um desabafo; ela está cansada do trabalho."]
        grammar: [g.question-words]
        vocab: [w.bater-papo, w.conversa-fiada]
    texts:
      - title: "Mensagem de áudio"
        es: ["Amiga, a Carol me disse que você queria que ela viesse para o Réveillon.", "Ela pediu que eu te avisasse que vem, sim.", "Mas implorou que a gente não contasse para o ex dela!"]
        en: ["Hey, Carol told me you wanted her to come for New Year's Eve.", "She asked me to let you know she's coming.", "But she begged us not to tell her ex!"]
        grammar: [g.reported-speech-subjunctive]
        vocab: [w.implorar]
      - title: "Diário"
        es: ["Hoje a vovó me fez uma confidência.", "Sussurrou que, quando era jovem, tinha namorado um soldado americano em Natal.", "Pediu que eu não contasse para o vovô."]
        en: ["Today Grandma confided something to me.", "She whispered that, when she was young, she'd gone out with an American soldier in Natal.", "She asked me not to tell Grandpa."]
        grammar: [g.reported-speech-subjunctive, g.reported-speech-past]
        vocab: [w.confidência, w.sussurrar]
    spicy:
      - { es: "Você sussurrou que eu ficasse mais um pouco, e eu fiquei até o sol nascer.", en: "You whispered for me to stay a bit longer, and I stayed till sunrise.", altEs: ["Você sussurrou para eu ficar mais um pouco, e eu fiquei até o sol nascer."], grammar: [g.reported-speech-subjunctive], vocab: [w.sussurrar] }
      - { es: "Ela pediu que eu dançasse com ela; eu gaguejei, mas dancei.", en: "She asked me to dance with her; I stammered, but I danced.", altEs: ["Ela me pediu que dançasse com ela; eu gaguejei, mas dancei."], grammar: [g.reported-speech-subjunctive], vocab: [w.gaguejar] }
      - { es: "Ele insinuou que queria um segundo encontro, e eu fingi que não entendi… por cinco segundos.", en: "He hinted he wanted a second date, and I pretended not to understand… for five seconds.", grammar: [g.reported-speech-past], vocab: [w.insinuar] }
      - { es: "Minha mãe pediu que eu trouxesse alguém para o Natal em Natal; posso levar você?", en: "My mother asked me to bring someone for Christmas in Natal; can I bring you?", altEs: ["A minha mãe pediu que eu trouxesse alguém para o Natal em Natal; posso te levar?"], grammar: [g.reported-speech-subjunctive], vocab: [] }
      - { es: "As minhas amigas cochicharam a noite toda que a gente formava um casal lindo.", en: "My friends whispered all night that we made a lovely couple.", altEs: ["Minhas amigas cochicharam a noite toda que a gente formava um casal lindo."], grammar: [g.reported-speech-past], vocab: [w.cochichar] }
  - id: b2.u06.l2
    title: O juiz mandou que ele ficasse
    teach: [g.reported-commands]
    vocab: [w.ordenar, w.advertir, w.alertar, w.ameaçar, w.promotor, w.sentença, w.condenar, w.absolver, w.processar, w.advogar, w.acusação, w.acusado, w.suspeito, w.depor, w.jurar, w.fiança, w.réu, w.depoimento, w.firme]
    tip: "Two ways to report an order: mandar / pedir / dizer + que + subjunctive (formal) or + para + infinitive (everyday Brazil): Mandou que saíssemos / Mandou a gente sair. proibir de, aconselhar a, ameaçar + infinitive."
    sentences:
      - { es: "O guia mandou a gente passar protetor antes de subir as dunas.", en: "The guide told us to put on sunscreen before climbing the dunes.", altEs: ["O guia mandou que a gente passasse protetor antes de subir as dunas.", "O guia mandou que nós passássemos protetor antes de subir as dunas."], grammar: [g.reported-commands], vocab: [w.duna] }
      - { es: "O juiz ordenou que o réu ficasse em silêncio.", en: "The judge ordered the defendant to remain silent.", grammar: [g.reported-commands, g.reported-speech-subjunctive], vocab: [w.ordenar, w.réu] }
      - { es: "O salva-vidas advertiu os turistas de que não entrassem no mar depois das cinco.", en: "The lifeguard warned the tourists not to go into the sea after five.", altEs: ["O salva-vidas advertiu os turistas para não entrarem no mar depois das cinco."], grammar: [g.reported-commands], vocab: [w.advertir, w.salva-vidas] }
      - { es: "A prefeitura alerta os turistas para não subirem o Morro do Careca.", en: "The city council warns tourists not to climb the Morro do Careca.", grammar: [g.reported-commands, g.personal-infinitive-uses], vocab: [w.alertar], note: "The Morro do Careca, the big dune at the end of Ponta Negra beach in Natal, is closed to climbers to protect it from erosion." }
      - { es: "O vizinho ameaçou chamar a polícia se a festa não acabasse.", en: "The neighbour threatened to call the police if the party didn't end.", grammar: [g.reported-commands, g.subjunctive-imperfect], vocab: [w.ameaçar] }
      - { es: "O promotor pediu que o acusado fosse condenado.", en: "The prosecutor asked for the defendant to be convicted.", grammar: [g.reported-commands, g.passive-ser], vocab: [w.promotor, w.acusado, w.condenar] }
      - { es: "A advogada aconselhou o cliente a não depor sem ela.", en: "The lawyer advised her client not to testify without her.", altEs: ["A advogada aconselhou que o cliente não depusesse sem ela."], grammar: [g.reported-commands], vocab: [w.depor] }
      - { es: "Ela advoga há vinte anos e sempre pede que os clientes não mintam.", en: "She has practised law for twenty years and always asks her clients not to lie.", grammar: [g.reported-speech-subjunctive, g.ha-faz-time], vocab: [w.advogar] }
      - { es: "O juiz absolveu o réu e mandou que o soltassem.", en: "The judge acquitted the defendant and ordered his release.", altEs: ["O juiz absolveu o réu e mandou soltá-lo."], grammar: [g.reported-commands], vocab: [w.absolver, w.réu] }
      - { es: "Depois da acusação, a empresa ameaçou processar o jornal.", en: "After the accusation, the company threatened to sue the newspaper.", grammar: [g.reported-commands], vocab: [w.acusação, w.processar, w.ameaçar] }
      - { es: "O juiz proibiu o suspeito de sair da cidade.", en: "The judge banned the suspect from leaving the city.", altEs: ["O juiz proibiu que o suspeito saísse da cidade."], grammar: [g.reported-commands], vocab: [w.suspeito] }
      - { es: "A juíza exigiu que o acusado pagasse fiança.", en: "The judge required the defendant to pay bail.", grammar: [g.reported-commands], vocab: [w.fiança, w.acusado] }
      - { es: "No depoimento, a testemunha contou que tinha visto o carro azul.", en: "In her statement, the witness said she had seen the blue car.", grammar: [g.reported-speech-past, g.pluperfect], vocab: [w.depoimento] }
      - { es: "O guia mandou que a gente ficasse no bugue.", en: "The guide told us to stay in the buggy.", altEs: ["O guia mandou a gente ficar no bugue.", "O guia mandou que nós ficássemos no bugue."], grammar: [g.reported-commands], vocab: [w.bugue], error: { wrong: "O guia mandou que a gente fica no bugue.", explain: "mandar que reports an order, so it takes the subjunctive, here the imperfect: ficasse.", grammar: g.reported-commands } }
      - { es: "«Não saiam da trilha!», disse o guia.", en: "“Don't leave the trail!” said the guide.", grammar: [g.imperative-negative], vocab: [], transform: { instruction: "Report the order with mandou que…", answer: "O guia mandou que a gente não saísse da trilha.", alt: ["O guia mandou que nós não saíssemos da trilha.", "O guia mandou a gente não sair da trilha.", "O guia disse para a gente não sair da trilha."], en: "The guide told us not to leave the trail." } }
      - { es: "«Pague a fiança», disse o juiz ao acusado.", en: "“Pay the bail,” the judge told the defendant.", grammar: [g.imperative-formal], vocab: [w.fiança], transform: { instruction: "Report it with exigiu que…", answer: "O juiz exigiu que o acusado pagasse a fiança.", alt: ["O juiz exigiu que ele pagasse a fiança."], en: "The judge demanded that the defendant pay the bail." } }
    exchanges:
      - q: { es: "O que o motorista do bugue disse?", en: "What did the buggy driver say?" }
        a: { es: "Mandou a gente segurar firme e perguntou se a gente queria com emoção ou sem emoção.", en: "He told us to hold on tight and asked if we wanted it with thrills or without." }
        alt: ["Mandou todo mundo segurar firme.", "Pediu que a gente não tirasse o cinto."]
        grammar: [g.reported-commands, g.reported-questions]
        vocab: [w.bugue]
      - q: { es: "O que o juiz decidiu?", en: "What did the judge decide?" }
        a: { es: "Absolveu o réu, mas proibiu que ele saísse do país.", en: "He acquitted the defendant, but banned him from leaving the country." }
        alt: ["Condenou o réu a dois anos.", "Ainda não saiu a sentença."]
        grammar: [g.reported-commands]
        vocab: [w.absolver, w.réu, w.sentença]
      - q: { es: "Por que você não subiu o Morro do Careca?", en: "Why didn't you climb the Morro do Careca?" }
        a: { es: "A placa alerta que é proibido, e o salva-vidas mandou a gente descer.", en: "The sign warns it's forbidden, and the lifeguard told us to come down." }
        alt: ["É proibido subir.", "O salva-vidas advertiu que não pode."]
        grammar: [g.reported-commands]
        vocab: [w.alertar]
      - q: { es: "A testemunha já depôs?", en: "Has the witness testified yet?" }
        a: { es: "Depôs ontem e jurou que estava em casa naquela noite.", en: "She testified yesterday and swore she was at home that night." }
        alt: ["Ainda não; vai depor amanhã.", "Já, mas o promotor não acreditou."]
        grammar: [g.reported-speech-past]
        vocab: [w.depor, w.jurar]
      - q: { es: "O que a advogada te aconselhou?", en: "What did the lawyer advise you?" }
        a: { es: "Aconselhou a não falar com a imprensa até o julgamento.", en: "She advised me not to talk to the press until the trial." }
        alt: ["Pediu que eu não desse entrevistas.", "Mandou eu ficar calado."]
        grammar: [g.reported-commands]
        vocab: [w.julgamento]
    texts:
      - title: "Aviso em Genipabu"
        es: ["O passeio de bugue só é permitido com motorista autorizado.", "O motorista pode pedir que os passageiros desçam nas descidas mais perigosas.", "Siga sempre as orientações do guia."]
        en: ["Buggy rides are only allowed with an authorised driver.", "The driver may ask passengers to get out on the most dangerous descents.", "Always follow the guide's instructions."]
        grammar: [g.reported-commands, g.imperative-formal]
        vocab: [w.bugue]
      - title: "Notícia de tribunal"
        es: ["O juiz ordenou que o acusado ficasse em prisão domiciliar.", "O promotor pediu que a fiança fosse aumentada.", "A sentença deve sair na próxima semana."]
        en: ["The judge ordered the defendant to be kept under house arrest.", "The prosecutor asked for the bail to be increased.", "The verdict is due next week."]
        grammar: [g.reported-commands, g.passive-ser]
        vocab: [w.ordenar, w.acusado, w.promotor, w.fiança, w.sentença]
    spicy:
      - { es: "O motorista perguntou se a gente queria o passeio com emoção; você respondeu que, comigo do lado, já tinha emoção suficiente.", en: "The driver asked if we wanted the ride with thrills; you answered that, with me beside you, there were thrills enough already.", grammar: [g.reported-questions, g.reported-speech-past], vocab: [] }
      - { es: "A sua mãe mandou que eu te trouxesse cedo; eu jurei que sim.", en: "Your mother told me to bring you back early; I swore I would.", altEs: ["Sua mãe mandou que eu trouxesse você cedo; eu jurei que sim."], grammar: [g.reported-commands], vocab: [w.jurar] }
      - { es: "O salva-vidas advertiu que o sol estava forte; ele não sabia que o perigo era você.", en: "The lifeguard warned that the sun was strong; he didn't know the danger was you.", grammar: [g.reporting-verbs], vocab: [w.advertir] }
      - { es: "Se você me processar por roubar o seu coração, eu confesso tudo.", en: "If you sue me for stealing your heart, I'll confess everything.", grammar: [g.future-subjunctive-se], vocab: [w.processar, w.confessar] }
      - { es: "Ela ameaçou me beijar se eu falasse de trabalho de novo; falei de trabalho a noite toda.", en: "She threatened to kiss me if I talked about work again; I talked about work all night.", grammar: [g.reported-commands, g.subjunctive-imperfect], vocab: [w.ameaçar] }
  - id: b2.u06.l3
    title: O porta-voz desmentiu
    teach: [g.reporting-verbs]
    vocab: [w.alegar, w.argumentar, w.assegurar, w.confessar, w.desmentir, w.contestar, w.rebater, w.retrucar, w.acrescentar, w.concluir, w.relatar, w.relato, w.afirmação, w.declaração, w.pronunciamento, w.porta-voz, w.comunicado, w.entrevista-coletiva, w.citar, w.secretário]
    tip: "Most reporting verbs take the indicative (afirmou que é, alegou que estava). Verbs of denial take the subjunctive: negou que fosse, desmentiu que tivesse."
    sentences:
      - { es: "O secretário afirmou que a obra na orla será concluída em junho.", en: "The secretary stated that the work on the seafront will be completed in June.", grammar: [g.reporting-verbs, g.passive-ser], vocab: [w.concluir] }
      - { es: "A empresa alegou que o atraso foi por causa da chuva.", en: "The company claimed the delay was because of the rain.", grammar: [g.reporting-verbs], vocab: [w.alegar] }
      - { es: "O prefeito assegurou que nenhuma praia seria fechada.", en: "The mayor gave assurances that no beach would be closed.", grammar: [g.reporting-verbs, g.reported-speech-past], vocab: [w.assegurar] }
      - { es: "O jogador confessou que tinha pensado em desistir.", en: "The player confessed he had thought of giving up.", grammar: [g.reporting-verbs, g.pluperfect], vocab: [w.confessar] }
      - { es: "O porta-voz desmentiu que o presidente estivesse doente.", en: "The spokesperson denied that the president was ill.", grammar: [g.reporting-verbs, g.subjunctive-imperfect], vocab: [w.desmentir, w.porta-voz] }
      - { es: "Os moradores contestaram a decisão e argumentaram que a praia é de todos.", en: "The residents challenged the decision and argued that the beach belongs to everyone.", grammar: [g.reporting-verbs], vocab: [w.contestar, w.argumentar] }
      - { es: "A ministra rebateu as críticas e disse que os números eram outros.", en: "The minister hit back at the criticism and said the figures were different.", grammar: [g.reporting-verbs], vocab: [w.rebater] }
      - { es: "Quando perguntaram sobre o salário, ele retrucou que não era da conta de ninguém.", en: "When they asked about his salary, he retorted that it was nobody's business.", grammar: [g.reporting-verbs], vocab: [w.retrucar] }
      - { es: "O diretor acrescentou que a decisão era definitiva.", en: "The director added that the decision was final.", grammar: [g.reporting-verbs], vocab: [w.acrescentar, w.definitivo] }
      - { es: "O pescador relatou que viu golfinhos perto do Forte dos Reis Magos.", en: "The fisherman reported seeing dolphins near the Forte dos Reis Magos.", grammar: [g.reporting-verbs], vocab: [w.relatar, w.golfinho], note: "The star-shaped Forte dos Reis Magos, at the mouth of the Potengi river, is where Natal began in 1599." }
      - { es: "Numa declaração curta, a cantora negou que fosse se aposentar.", en: "In a short statement, the singer denied she was going to retire.", grammar: [g.reporting-verbs, g.subjunctive-imperfect], vocab: [w.declaração] }
      - { es: "O comunicado informa que o show de sábado foi adiado.", en: "The press release says Saturday's show has been postponed.", grammar: [g.reporting-verbs, g.passive-ser], vocab: [w.comunicado] }
      - { es: "Na entrevista coletiva, o técnico citou um provérbio e não respondeu nada.", en: "At the press conference, the coach quoted a proverb and didn't answer anything.", grammar: [g.reporting-verbs], vocab: [w.entrevista-coletiva, w.citar], variant: "Portugal: conferência de imprensa." }
      - { es: "O deputado negou que tivesse recebido dinheiro.", en: "The congressman denied having received money.", grammar: [g.reporting-verbs, g.subjunctive-pluperfect], vocab: [], error: { wrong: "O deputado negou que tinha recebido dinheiro.", explain: "negar que takes the subjunctive: negou que tivesse recebido.", grammar: g.reporting-verbs } }
      - { es: "«Vou renunciar», disse o técnico.", en: "“I'm going to resign,” said the coach.", grammar: [g.ir-infinitive], vocab: [w.renunciar], transform: { instruction: "Report it with declarou que…", answer: "O técnico declarou que ia renunciar.", alt: ["O técnico declarou que renunciaria.", "O técnico declarou que iria renunciar."], en: "The coach declared he was going to resign." } }
      - { es: "«Não estou doente», afirmou a cantora.", en: "“I'm not ill,” the singer stated.", grammar: [g.estar-present], vocab: [], transform: { instruction: "Report it with negou que…", answer: "A cantora negou que estivesse doente.", alt: ["A cantora negou estar doente."], en: "The singer denied she was ill." } }
    exchanges:
      - q: { es: "O que o porta-voz disse?", en: "What did the spokesperson say?" }
        a: { es: "Desmentiu que o presidente tivesse renunciado.", en: "He denied the president had resigned." }
        alt: ["Negou tudo.", "Que não ia comentar."]
        grammar: [g.reporting-verbs, g.subjunctive-pluperfect]
        vocab: [w.porta-voz, w.desmentir]
      - q: { es: "Você viu o pronunciamento do governador?", en: "Did you see the governor's address?" }
        a: { es: "Vi; ele assegurou que a obra seria concluída este ano.", en: "I did; he gave assurances the work would be finished this year." }
        alt: ["Vi, mas não acreditei em nada.", "Não, só li o comunicado."]
        grammar: [g.reporting-verbs]
        vocab: [w.pronunciamento, w.assegurar]
      - q: { es: "Ela citou alguém no discurso?", en: "Did she quote anyone in her speech?" }
        a: { es: "Citou Câmara Cascudo e acrescentou que Natal deve muito a ele.", en: "She quoted Câmara Cascudo and added that Natal owes him a lot." }
        alt: ["Citou um poema.", "Não citou ninguém."]
        grammar: [g.reporting-verbs]
        vocab: [w.citar, w.acrescentar]
      - q: { es: "A afirmação do ministro é verdadeira?", en: "Is the minister's claim true?" }
        a: { es: "Os jornalistas contestaram; dizem que os números são antigos.", en: "Journalists have challenged it; they say the figures are old." }
        alt: ["Ninguém sabe ainda.", "Parece que não."]
        grammar: [g.reporting-verbs]
        vocab: [w.afirmação, w.contestar]
      - q: { es: "Qual foi o relato dos pescadores?", en: "What was the fishermen's account?" }
        a: { es: "Relataram que o mar estava muito forte e que nenhuma jangada saiu.", en: "They reported that the sea was very rough and no jangada went out." }
        alt: ["Que o mar estava perigoso.", "Que viram uma baleia."]
        grammar: [g.reporting-verbs]
        vocab: [w.relato, w.relatar]
    texts:
      - title: "Notícia"
        es: ["Natal: prefeitura anuncia reforma da orla de Ponta Negra.", "Em entrevista coletiva, o secretário afirmou que as obras começarão em março.", "Comerciantes alegam que não foram consultados."]
        en: ["Natal: city council announces renovation of the Ponta Negra seafront.", "At a press conference, the secretary stated that the work will begin in March.", "Traders claim they were not consulted."]
        grammar: [g.reporting-verbs, g.headlines]
        vocab: [w.entrevista-coletiva, w.alegar, w.comerciante]
      - title: "Comunicado"
        es: ["A organização do festival informa que o show de sábado foi adiado.", "Segundo o comunicado, a decisão se deve à previsão de chuva.", "Os ingressos continuam válidos para a nova data."]
        en: ["The festival organisers announce that Saturday's show has been postponed.", "According to the press release, the decision is due to the rain forecast.", "Tickets remain valid for the new date."]
        grammar: [g.reporting-verbs]
        vocab: [w.comunicado]
    spicy:
      - { es: "Você alegou que estava passando por acaso; pela terceira vez na mesma semana?", en: "You claimed you were just passing by; for the third time in the same week?", grammar: [g.reporting-verbs], vocab: [w.alegar, w.acaso] }
      - { es: "Confesso que li o seu perfil inteiro antes do encontro; acrescento que gostei.", en: "I confess I read your whole profile before the date; I'd add that I liked it.", grammar: [g.reporting-verbs], vocab: [w.confessar, w.acrescentar] }
      - { es: "Os meus amigos asseguraram que você era tímido; ninguém me avisou que você dançava assim.", en: "My friends assured me you were shy; nobody warned me you danced like that.", altEs: ["Meus amigos asseguraram que você era tímida; ninguém me avisou que você dançava assim."], grammar: [g.reporting-verbs], vocab: [w.assegurar] }
      - { es: "Você desmentiu que estivesse interessada, mas o seu sorriso contestou.", en: "You denied you were interested, but your smile begged to differ.", altEs: ["Você desmentiu que estivesse interessado, mas o seu sorriso contestou."], grammar: [g.reporting-verbs, g.subjunctive-imperfect], vocab: [w.desmentir, w.contestar] }
      - { es: "Quando perguntei se você queria sair comigo, você retrucou: «Pensei que você nunca fosse perguntar.»", en: "When I asked if you wanted to go out with me, you retorted: “I thought you'd never ask.”", grammar: [g.reporting-verbs, g.reported-questions], vocab: [w.retrucar] }
  - id: b2.u06.l4
    title: O narrador pediu que confiássemos nele
    teach: [g.reported-speech-subjunctive, g.reporting-verbs]
    vocab: [w.galeria, w.escultura, w.escultor, w.acervo, w.curador, w.obra-prima, w.retrato, w.romance, w.romancista, w.crônica, w.cronista, w.poesia, w.poema, w.verso, w.rima, w.enredo, w.trama, w.desfecho, w.narrador, w.leitor, w.leitura, w.editora, w.lançamento, w.sensacional]
    tip: "Reporting in the arts: a writer conta, revela, explica, afirma que… (indicative); a curator or editor pede, sugere, exige que… (subjunctive)."
    sentences:
      - { es: "A escritora contou que escreveu o romance numa praia de Natal.", en: "The writer said she wrote the novel on a beach in Natal.", grammar: [g.reported-speech-past], vocab: [w.romance] }
      - { es: "A romancista revelou que os pais queriam que ela estudasse Medicina.", en: "The novelist revealed that her parents wanted her to study medicine.", grammar: [g.reporting-verbs, g.reported-speech-subjunctive], vocab: [w.romancista] }
      - { es: "O escultor explicou que a obra levou dois anos para ficar pronta.", en: "The sculptor explained that the piece took two years to finish.", grammar: [g.reporting-verbs], vocab: [w.escultor] }
      - { es: "A galeria anunciou que o acervo seria aberto ao público.", en: "The gallery announced that the collection would be opened to the public.", grammar: [g.reporting-verbs, g.passive-ser], vocab: [w.galeria, w.acervo] }
      - { es: "O pintor pediu que eu ficasse parado para terminar o retrato.", en: "The painter asked me to keep still so he could finish the portrait.", grammar: [g.reported-speech-subjunctive], vocab: [w.retrato] }
      - { es: "A cronista escreveu que, se pudesse, moraria em Ponta Negra para sempre.", en: "The columnist wrote that if she could, she'd live in Ponta Negra forever.", grammar: [g.reported-speech-subjunctive, g.se-clauses-unreal], vocab: [w.cronista] }
      - { es: "Toda semana ela publica uma crônica sobre a cidade, e os leitores pedem que ela nunca pare.", en: "Every week she publishes a column about the city, and her readers ask her never to stop.", grammar: [g.reported-speech-subjunctive], vocab: [w.crônica, w.leitor] }
      - { es: "Ela disse que a poesia a salvou numa fase difícil.", en: "She said poetry saved her during a difficult time.", altEs: ["Ela disse que a poesia salvou ela numa fase difícil."], grammar: [g.reported-speech-past], vocab: [w.poesia] }
      - { es: "O poeta pediu que a gente prestasse atenção na rima do último verso.", en: "The poet asked us to pay attention to the rhyme in the last line.", altEs: ["O poeta pediu que nós prestássemos atenção à rima do último verso."], grammar: [g.reported-speech-subjunctive], vocab: [w.rima, w.verso] }
      - { es: "O narrador conta a história como se tivesse estado lá.", en: "The narrator tells the story as if he'd been there.", grammar: [g.como-se], vocab: [w.narrador] }
      - { es: "A editora sugeriu que o escritor mudasse o enredo.", en: "The publisher suggested the writer change the plot.", grammar: [g.reported-speech-subjunctive], vocab: [w.editora, w.enredo] }
      - { es: "A trama era tão complicada que pedi que a minha amiga me explicasse.", en: "The plot was so complicated I asked my friend to explain it to me.", grammar: [g.reported-speech-subjunctive, g.consequence-clauses], vocab: [w.trama] }
      - { es: "No lançamento, a escritora pediu que os leitores não contassem o desfecho.", en: "At the launch, the writer asked readers not to give away the ending.", grammar: [g.reported-speech-subjunctive], vocab: [w.lançamento, w.desfecho] }
      - { es: "O professor pediu que lêssemos o poema em voz alta.", en: "The teacher asked us to read the poem aloud.", altEs: ["O professor pediu que a gente lesse o poema em voz alta.", "O professor pediu para a gente ler o poema em voz alta."], grammar: [g.reported-speech-subjunctive], vocab: [w.poema], error: { wrong: "O professor pediu que lemos o poema em voz alta.", explain: "A past request takes the imperfect subjunctive: lêssemos (nós) or a gente lesse.", grammar: g.reported-speech-subjunctive } }
      - { es: "«Não toquem nas esculturas», pediu o curador.", en: "“Don't touch the sculptures,” the curator asked.", grammar: [g.imperative-negative], vocab: [w.curador, w.escultura], transform: { instruction: "Report it: O curador pediu que ninguém…", answer: "O curador pediu que ninguém tocasse nas esculturas.", alt: ["O curador pediu que ninguém tocasse as esculturas.", "O curador pediu para ninguém tocar nas esculturas."], en: "The curator asked that nobody touch the sculptures." } }
      - { es: "«Leia mais um poema», pediu a plateia depois da leitura.", en: "“Read another poem,” the audience asked after the reading.", grammar: [g.imperative-formal], vocab: [w.leitura], transform: { instruction: "Report it: A plateia pediu que ela…", answer: "A plateia pediu que ela lesse mais um poema.", alt: ["A plateia pediu para ela ler mais um poema."], en: "The audience asked her to read another poem." } }
    exchanges:
      - q: { es: "O que a escritora disse no lançamento?", en: "What did the writer say at the launch?" }
        a: { es: "Pediu que a gente não contasse o desfecho para ninguém.", en: "She asked us not to tell anyone the ending." }
        alt: ["Pediu para a gente não contar o final.", "Que o próximo livro sai em dezembro."]
        grammar: [g.reported-speech-subjunctive]
        vocab: [w.lançamento, w.desfecho]
      - q: { es: "Você gostou do romance?", en: "Did you like the novel?" }
        a: { es: "Gostei, embora a trama seja meio confusa.", en: "I did, although the plot's a bit confusing." }
        alt: ["Adorei o enredo.", "Não; o desfecho é muito previsível."]
        grammar: [g.embora-concession]
        vocab: [w.romance, w.trama]
      - q: { es: "O que o curador explicou?", en: "What did the curator explain?" }
        a: { es: "Que o acervo tem mais de mil obras e que a melhor ainda está guardada.", en: "That the collection has over a thousand works and the best one is still in storage." }
        alt: ["Que a escultura é do século XIX.", "Pediu que a gente não usasse flash."]
        grammar: [g.reported-speech-past]
        vocab: [w.curador, w.acervo]
      - q: { es: "Quem é o seu cronista preferido?", en: "Who's your favourite columnist?" }
        a: { es: "Rubem Braga; minha mãe pedia que eu lesse uma crônica dele por dia.", en: "Rubem Braga; my mother used to ask me to read one of his columns a day." }
        alt: ["Não leio crônicas.", "Gosto da Martha Medeiros."]
        grammar: [g.reported-speech-subjunctive]
        vocab: [w.cronista, w.crônica]
      - q: { es: "Por que você parou de ler o livro?", en: "Why did you stop reading the book?" }
        a: { es: "O narrador falava com o leitor como se ele não entendesse nada.", en: "The narrator talked to the reader as if they didn't understand anything." }
        alt: ["A leitura estava muito lenta.", "A trama não me prendeu."]
        grammar: [g.como-se]
        vocab: [w.narrador, w.leitor]
    texts:
      - title: "Convite"
        es: ["A editora convida para o lançamento do romance «O último verão em Natal».", "A escritora pediu que cada leitor trouxesse uma pergunta.", "Sábado, às 18 horas, numa galeria da Ribeira."]
        en: ["The publisher invites you to the launch of the novel “The Last Summer in Natal”.", "The writer has asked every reader to bring a question.", "Saturday at 6 pm, in a gallery in Ribeira."]
        grammar: [g.reported-speech-subjunctive]
        vocab: [w.editora, w.lançamento, w.galeria]
      - title: "Resenha"
        es: ["O enredo é simples, mas a leitura prende do começo ao fim.", "O narrador nos pede que confiemos nele, e confiamos.", "O desfecho, porém, deixa o leitor com mais perguntas do que respostas."]
        en: ["The plot is simple, but the book grips you from start to finish.", "The narrator asks us to trust him, and we do.", "The ending, however, leaves the reader with more questions than answers."]
        grammar: [g.reported-speech-subjunctive]
        vocab: [w.enredo, w.leitura, w.narrador, w.desfecho]
    spicy:
      - { es: "Você pediu que eu escrevesse um poema para você; só consegui rimar «Natal» com «sensacional».", en: "You asked me to write you a poem; all I managed was to rhyme 'Natal' with 'sensational'.", altEs: ["Você me pediu que escrevesse um poema para você; só consegui rimar «Natal» com «sensacional»."], grammar: [g.reported-speech-subjunctive], vocab: [w.poema, w.rima] }
      - { es: "O pintor pediu que eu posasse para um retrato; pedi que ele pintasse você ao meu lado.", en: "The painter asked me to sit for a portrait; I asked him to paint you beside me.", grammar: [g.reported-speech-subjunctive], vocab: [w.retrato] }
      - { es: "Se a nossa história fosse um romance, o leitor pediria que o desfecho demorasse.", en: "If our story were a novel, the reader would ask for the ending to take its time.", grammar: [g.se-clauses-unreal, g.subjunctive-imperfect], vocab: [w.romance, w.leitor, w.desfecho] }
      - { es: "Na galeria, você sussurrou que a obra-prima da sala era eu.", en: "At the gallery, you whispered that the masterpiece in the room was me.", grammar: [g.reported-speech-past], vocab: [w.galeria, w.obra-prima, w.sussurrar] }
      - { es: "Ela disse que só sai com quem lê poesia; desde ontem eu aprendo um verso por dia.", en: "She said she only goes out with people who read poetry; since yesterday I've been learning one line a day.", grammar: [g.reported-speech-present], vocab: [w.poesia, w.verso] }
dialogues:
  - id: b2.u06.d1
    title: Com emoção ou sem emoção?
    context: Back in Natal after a buggy ride over the Genipabu dunes, Luana tells Diego what everybody said on the trip.
    lines:
      - { speaker: Diego, es: "E aí, como foi o passeio de bugue em Genipabu?", en: "So, how was the buggy ride in Genipabu?" }
      - { speaker: Luana, es: "Incrível! O motorista perguntou se a gente queria com emoção ou sem emoção.", en: "Amazing! The driver asked if we wanted it with thrills or without." }
      - { speaker: Diego, es: "E vocês?", en: "And what did you say?" }
      - { speaker: Luana, es: "A Bia implorou que fosse sem emoção, mas o Rafa berrou que queria com muita emoção.", en: "Bia begged for it to be without thrills, but Rafa yelled that he wanted lots of them." }
      - { speaker: Diego, es: "E o motorista?", en: "And the driver?" }
      - { speaker: Luana, es: "Riu e mandou todo mundo segurar firme. Depois disse que, se a gente ficasse com medo, era só gritar.", en: "He laughed and told everyone to hold on tight. Then he said that if we got scared, we just had to scream." }
      - { speaker: Diego, es: "E alguém gritou?", en: "And did anyone scream?" }
      - { speaker: Luana, es: "A Bia, o passeio inteiro. No fim, confessou que tinha adorado.", en: "Bia, the whole ride. At the end, she admitted she'd loved it." }
      - { speaker: Diego, es: "Típico. E o Rafa?", en: "Typical. And Rafa?" }
      - { speaker: Luana, es: "Ficou tão enjoado que pediu que eu não contasse para ninguém… Ops.", en: "He felt so sick he asked me not to tell anyone… Oops." }
    questions:
      - { q: "O que o motorista perguntou?", options: ["Se queriam o passeio com emoção ou sem emoção", "Se queriam ir ao Morro do Careca", "Se sabiam nadar"], answer: 0, explain: "O motorista perguntou se a gente queria com emoção ou sem emoção: a reported question." }
      - { q: "O que a Bia implorou?", options: ["Que o passeio fosse sem emoção", "Que o passeio fosse mais longo", "Que o Rafa dirigisse"], answer: 0, explain: "A Bia implorou que fosse sem emoção: a request reported with the imperfect subjunctive." }
      - { q: "O que o motorista disse para fazer se ficassem com medo?", options: ["Descer do bugue", "Gritar", "Fechar os olhos"], answer: 1, explain: "Se a gente ficasse com medo, era só gritar." }
      - { q: "O que o Rafa pediu à Luana?", options: ["Que contasse para todos", "Que não contasse para ninguém", "Que tirasse uma foto"], answer: 1, explain: "He asked her not to tell anyone that he felt sick, and she has just told Diego." }
writing:
  - task: "Report what your buggy driver told and asked you to do before the dune ride (Ele pediu que colocássemos…, mandou que ninguém saísse…)."
    es: "Bugueiro: “Coloquem o cinto! Não fiquem em pé no bugue. Quando eu parar, tirem fotos, mas não saiam de perto do carro!”"
    min: 80
    max: 140
    use: [w.duna, w.advertir, w.alertar, w.ordenar, w.implorar]
    useAtLeast: 2
    grammar: [g.reported-speech-subjunctive, g.reported-commands]
    expect:
      - { pattern: '\b(pediu|mandou|disse|insistiu|exigiu|recomendou|sugeriu|aconselhou|advertiu|alertou|ordenou)( a [a-zà-ú]+| nos| -nos)? (que|para)\b', hint: "Report requests and commands: pediu que…, mandou que…" }
      - { pattern: '\b[a-zà-ú]+(sse|ssem|ssemos)\b', hint: "Use the imperfect subjunctive after a past request: pediu que colocássemos…" }
    model: { es: "O passeio de bugue pelas dunas de Natal foi incrível! Antes de sair, o motorista pediu que colocássemos o cinto e nos advertiu que não ficássemos em pé no bugue. Ele explicou que, quando parasse, poderíamos tirar fotos, mas mandou que ninguém saísse de perto do carro. Ele também nos alertou que tomássemos cuidado com o sol forte. Na duna mais alta, ele perguntou se queríamos o passeio com emoção ou sem emoção. Claro que escolhemos com emoção! No final, ele pediu que deixássemos um comentário sobre o passeio.", en: "The buggy ride over the dunes in Natal was amazing! Before we set off, the driver asked us to put our seat belts on and warned us not to stand up in the buggy. He explained that when he stopped we could take photos, but he told us not to leave the vehicle. He also warned us to be careful with the strong sun. On the highest dune he asked if we wanted the ride with thrills or without. Of course we chose with thrills! At the end he asked us to leave a review of the trip." }
  - task: "Write a short news item reporting a court case, with precise reporting verbs (O réu jurou que…, O promotor argumentou que…, O juiz determinou que…)."
    min: 80
    max: 140
    use: [w.promotor, w.réu, w.sentença, w.fiança, w.depoimento]
    useAtLeast: 3
    grammar: [g.reported-commands, g.reporting-verbs]
    expect:
      - { pattern: '\b(determinou|mandou|ordenou|decidiu) que\b', hint: "Report the judge's order: O juiz determinou que…" }
      - { pattern: '\b(alegou|jurou|afirmou|negou|confessou|argumentou) que\b', hint: "Use precise reporting verbs: alegou que, jurou que…" }
    model: { es: "O juiz de Natal condenou ontem um empresário acusado de vender passeios de bugue falsos para turistas. No depoimento, o réu jurou que não sabia de nada e alegou que os seus funcionários eram os responsáveis. O promotor, porém, argumentou que havia provas claras contra ele. Na sentença, o juiz determinou que o empresário devolvesse o dinheiro às vítimas e mandou que ele ficasse em casa até pagar a fiança. O advogado do réu afirmou que não concorda com a decisão e insistiu que o seu cliente é inocente.", en: "Yesterday a Natal judge convicted a businessman accused of selling fake buggy trips to tourists. In his testimony, the defendant swore he knew nothing and claimed his employees were responsible. The prosecutor, however, argued there was clear evidence against him. In the sentence, the judge ordered the businessman to return the money to the victims and to stay at home until he paid bail. The defendant's lawyer stated that he disagrees with the decision and insisted that his client is innocent." }
  - task: "A company has denied a rumour. Write a short report of what was said, with precise reporting verbs (desmentiu, assegurou, acrescentou, concluiu…)."
    min: 80
    max: 140
    use: [w.porta-voz, w.desmentir, w.assegurar, w.acrescentar, w.comunicado]
    useAtLeast: 3
    grammar: [g.reporting-verbs]
    expect:
      - { pattern: '\b(desmentiu|assegurou|acrescentou|confessou|concluiu|rebateu|contestou|garantiu|alegou|relatou)\b', hint: "Use precise reporting verbs: desmentiu, assegurou, acrescentou…" }
    model: { es: "Ontem apareceu nas redes sociais a notícia de que o aeroporto de Natal ia fechar por seis meses. Em comunicado oficial, o porta-voz da empresa desmentiu a informação e assegurou que o aeroporto continuará funcionando normalmente. Ele acrescentou que as reformas serão feitas à noite, para não atrapalhar os voos. Numa entrevista coletiva, o secretário de turismo confirmou a declaração e concluiu que a notícia falsa tinha assustado muitos turistas. Ele também pediu que as pessoas não compartilhassem notícias sem confirmar a fonte.", en: "Yesterday a story appeared on social media saying Natal airport was going to close for six months. In an official statement, the company spokesperson denied the information and gave assurances that the airport will keep running normally. He added that the renovation work will be done at night, so as not to disrupt flights. At a press conference, the tourism secretary confirmed the statement and concluded that the fake news had frightened many tourists. He also asked people not to share news without checking the source." }
  - task: "Summarise a novel or story you have read, reporting what the narrator and the characters say, suggest and ask (O narrador conta que…, ela pede que…)."
    min: 80
    max: 140
    use: [w.romance, w.narrador, w.desfecho, w.leitor, w.leitura]
    useAtLeast: 3
    grammar: [g.reported-speech-subjunctive, g.reporting-verbs]
    expect:
      - { pattern: '\b(conta|explica|diz|revela|pede|pediu|confessa|confessou|perguntou|insinua|admite|jura) (que|se|para)\b', hint: "Report what is said: O narrador conta que…, ela pede que…" }
    model: { es: "Acabei de ler Dom Casmurro, um romance de Machado de Assis. O narrador, Bentinho, conta que se apaixonou por Capitu ainda criança. Ao longo do livro, ele insinua que ela o traiu com o seu melhor amigo, mas nunca apresenta provas. Num certo momento, Capitu pede que ele confie nela e jura que é inocente. O desfecho é aberto: o leitor tem de decidir se acredita no narrador ou não. Foi uma leitura sensacional! Recomendo que todo mundo leia este livro pelo menos uma vez.", en: "I've just finished Dom Casmurro, a novel by Machado de Assis. The narrator, Bentinho, says he fell in love with Capitu as a child. Throughout the book he insinuates that she betrayed him with his best friend, but he never offers proof. At one point Capitu asks him to trust her and swears she is innocent. The ending is open: the reader has to decide whether to believe the narrator or not. It was a sensational read! I recommend everyone reads this book at least once." }
