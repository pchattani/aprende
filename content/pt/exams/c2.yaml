grammar:
  - { prompt: "Ontem tu ___ (ir) ao cinema sozinho? (PT)", options: ["foi", "fostes", "foste"], answer: 2, explain: "European tu has its own verb forms: tu foste (Brazilian speech often has tu foi)." }
  - { prompt: "Não ___ (tu, falar) tão alto, por favor! (PT)", options: ["fala", "fales", "falas"], answer: 1, explain: "Negative tu imperative uses the present subjunctive: não fales." }
  - { prompt: "Neste momento, a Joana está ___ o relatório. (PT)", options: ["a escrever", "escrevendo", "escrever"], answer: 0, explain: "European progressive: estar a + infinitive (Brazil: está escrevendo)." }
  - { prompt: "Depois de muito discutir, eles acabaram ___ aceitar a proposta.", options: ["por", "de", "a"], answer: 0, explain: "acabar por + infinitive = to end up doing (acabar de = to have just done)." }
  - { prompt: "___ chegou ontem de Lisboa. (PT, informal)", options: ["Maria", "A Maria", "Da Maria"], answer: 1, explain: "In European Portuguese, first names normally take the article: a Maria." }
  - { prompt: "Ele ___ todos os dias às sete. (PT)", options: ["se levanta", "levanta-o", "levanta-se"], answer: 2, explain: "Enclisis is the default in affirmative main clauses in Portugal: levanta-se." }
  - { prompt: "Ele não ___ todos os dias às sete. (PT)", options: ["levanta-se", "levanta-lhe", "se levanta"], answer: 2, explain: "Negation attracts the clitic before the verb: não se levanta." }
  - { prompt: "O livro? Já ___ dei ontem. (= dei-lhe o livro)", options: ["lho", "lhe o", "o lhe"], answer: 0, explain: "lhe + o contract to lho; já attracts it before the verb: já lho dei." }
  - { prompt: "Amanhã ___ a resposta por escrito. (formal)", options: ["daremos-lhe", "dar-lhe-emos", "lhe-daremos"], answer: 1, explain: "Mesoclisis: the clitic goes between stem and ending of the future: dar-lhe-emos." }
  - { prompt: "___ um café, se faz favor. (PT, educado)", options: ["Quero", "Quis", "Queria"], answer: 2, explain: "The imperfect used as a polite conditional: queria / gostava (Brazil: queria / gostaria)." }
  - { prompt: "Em Portugal, o ônibus chama-se ___.", options: ["comboio", "autocarro", "elétrico"], answer: 1, explain: "autocarro = ônibus; comboio = trem; elétrico = bonde." }
  - { prompt: "Em Portugal, “propina” significa:", options: ["taxa paga à universidade", "suborno", "gorjeta"], answer: 0, explain: "False friend between varieties: PT propina = tuition fee; BR propina = bribe." }
  - { prompt: "Ortografia europeia: “o ___ é que ninguém apareceu.”", options: ["fato", "facto", "fáto"], answer: 1, explain: "In Portugal, facto (fact) keeps the c, distinguishing it from fato (suit)." }
  - { prompt: "“Desenrascar” traduz-se melhor para inglês como:", options: ["to untangle", "to scratch", "to manage somehow, to improvise a solution"], answer: 2, explain: "An 'untranslatable': the idea of getting out of a fix with whatever is at hand." }
  - { prompt: "Prefira a forma portuguesa: “Ele ___ para a vaga de professor.”", options: ["candidatou-se", "aplicou", "aplicou-se"], answer: 0, explain: "aplicar para is a calque of English 'apply for'; the idiomatic form is candidatar-se a (PT) / se candidatar a (BR)." }
writing:
  prompt: "A Portuguese cultural magazine has asked you for an opinion piece of at least 250 words with the title «Uma língua, duas normas?». Argue your position with precision and nuance: compare at least three concrete differences between European and Brazilian Portuguese (vocabulary, clitic placement, forms of address, spelling, pronunciation), refer to at least one classic author (Camões, Eça, Machado, Pessoa), use at least two rhetorical devices (rhetorical question, antithesis, tricolon), and write in the variety of your choice consistently, signalling the other where relevant."
  minWords: 250
  modelAnswer: |
    Uma língua, duas normas?

    Quando um lisboeta pede uma bica e um carioca pede um cafezinho, falam a mesma língua? A pergunta parece fácil, mas a resposta não é tão simples como se julga. Diz-se muitas vezes que o português de Portugal e o do Brasil são a mesma língua com sotaques diferentes. Quem já tentou ver uma novela brasileira num café do Porto, ou ler um contrato português em São Paulo, sabe que as diferenças vão bem além do sotaque.

    Há, desde logo, o vocabulário: o comboio é trem, o autocarro é ônibus, o telemóvel é celular, e a rapariga, inocente em Lisboa, convém evitá-la no Rio. Há depois a gramática. Em Portugal, diz-se “dá-me isso”; no Brasil, “me dá isso”. Em Lisboa, trata-se o amigo por tu, com o verbo certo; no Brasil, o você é rei, e o tu, quando aparece, raramente leva a forma verbal da segunda pessoa. E há, por fim, a pronúncia: os portugueses comem as vogais, os brasileiros abrem-nas e cantam-nas.

    Significa isto que temos duas línguas? Não me parece. Um brasileiro lê Eça sem dicionário; um português comove-se com Machado como se fosse seu. Camões é de todos, e Pessoa, que escreveu que a sua pátria era a língua portuguesa, nunca disse qual delas. A língua é uma só; as normas é que são duas, e talvez seja essa a sua maior riqueza.

    Em vez de perguntar qual das variedades é a certa, devíamos perguntar o que cada uma ensina à outra. O português europeu guarda a tradição e a memória; o brasileiro traz a liberdade e o ritmo. Juntos, falam para mais de duzentos milhões de pessoas, em quatro continentes. Não é pouco para uma língua que começou num pequeno país à beira do Atlântico.
  checklist:
    - "I compared at least three concrete differences (vocabulary, clitic placement, forms of address, spelling or pronunciation) with accurate examples."
    - "I referred to at least one classic author appropriately (Camões, Eça, Machado, Pessoa)."
    - "I used at least two rhetorical devices (rhetorical question, antithesis, tricolon)."
    - "I wrote consistently in one variety (e.g. European enclisis diz-se, comove-se, or Brazilian proclisis) and marked forms from the other variety as such."
    - "My argument is nuanced: I acknowledged the opposing view before taking a position."
    - "My conclusion adds a final idea rather than repeating the introduction."
