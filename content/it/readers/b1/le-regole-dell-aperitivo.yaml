id: r.b1.le-regole-dell-aperitivo
level: b1
title: Le regole dell'aperitivo
kind: text
intro: A tongue-in-cheek guide to the Milanese aperitivo, written by a Milanese for a friend from abroad. It is full of imperatives with pronouns (fallo, dimmi, non dimenticarlo).
allow: [milanesi, milanese, spritz, campari, negroni, sbagliato, aperol, navigli, darsena, francesco, sam, ok]
paragraphs:
  - { es: "Caro Sam, mi hai scritto che venerdì sera vuoi venire con me sui Navigli per il tuo primo aperitivo milanese. Benissimo! Ma l'aperitivo, qui a Milano, è quasi una religione, e ha le sue regole. Leggile con attenzione e, ti prego, non dimenticarle.", en: "Dear Sam, you wrote to me that on Friday evening you want to come with me to the Navigli for your first Milanese aperitivo. Excellent! But here in Milan the aperitivo is almost a religion, and it has its rules. Read them carefully and, please, don't forget them." }
  - { es: "Regola numero uno: l'orario. L'aperitivo si fa tra le sette e le nove di sera, dopo il lavoro e prima di cena. Non arrivare alle sei: troverai solo i camerieri che puliscono i tavoli. E non arrivare alle dieci, perché a quell'ora i milanesi sono già al ristorante.", en: "Rule number one: the time. Aperitivo happens between seven and nine in the evening, after work and before dinner. Don't arrive at six: you'll only find the waiters cleaning the tables. And don't arrive at ten, because by then the Milanese are already at the restaurant." }
  - { es: "Regola numero due: il bicchiere. Puoi prendere uno spritz, un bicchiere di prosecco o un analcolico, se non bevi. Ma se vuoi fare bella figura, ordina un Negroni sbagliato: è nato proprio qui, in un bar di Milano, quando un barista ha messo per errore lo spumante al posto del gin. Ordinalo con sicurezza, come se lo bevessi da sempre.", en: "Rule number two: the glass. You can have a spritz, a glass of prosecco or a non-alcoholic drink, if you don't drink. But if you want to make a good impression, order a Negroni sbagliato: it was born right here, in a bar in Milan, when a barman put in sparkling wine instead of gin by mistake. Order it confidently, as if you'd been drinking it forever." }
  - { es: "Regola numero tre: il cibo. Con il bicchiere arrivano sempre olive, patatine e piccoli stuzzichini. In molti locali c'è anche un buffet con pasta fredda, focaccia, verdure e formaggi. Assaggia tutto, ma non esagerare: non riempirti il piatto tre volte come se fosse la tua cena. Qualcuno lo fa, si chiama «apericena», ma i veri milanesi lo guardano male.", en: "Rule number three: the food. With your glass there are always olives, crisps and little nibbles. In many bars there's also a buffet with cold pasta, focaccia, vegetables and cheese. Try everything, but don't overdo it: don't fill your plate three times as if it were your dinner. Some people do it, it's called 'apericena', but true Milanese frown on it." }
  - { es: "Regola numero quattro: il posto. Sui Navigli i locali sono tantissimi e il venerdì sono pieni. Non cercare un tavolo libero dopo le sette e mezza: non lo troverai. Fa' come i milanesi: prendi il bicchiere al bancone e beviti l'aperitivo in piedi, lungo il canale, guardando il tramonto sulla Darsena.", en: "Rule number four: the place. There are loads of bars along the Navigli and on Fridays they're packed. Don't look for a free table after half past seven: you won't find one. Do as the Milanese do: get your glass at the bar and drink your aperitivo standing up, along the canal, watching the sunset over the Darsena." }
  - { es: "Regola numero quattro e mezzo: l'abbigliamento. Non serve vestirsi in modo elegantissimo, ma ricordati che sei a Milano, la capitale della moda. Niente tuta da ginnastica e niente ciabatte, per favore. Mettiti una camicia pulita, un paio di jeans e delle scarpe comode, perché poi cammineremo molto. E se fa freddo, portati una giacca: la sera, vicino all'acqua, c'è sempre un po' di umidità.", en: "Rule number four and a half: clothes. You don't need to dress very elegantly, but remember you're in Milan, the capital of fashion. No tracksuit and no flip-flops, please. Put on a clean shirt, a pair of jeans and comfortable shoes, because afterwards we'll walk a lot. And if it's cold, bring a jacket: in the evening, near the water, it's always a bit damp." }
  - { es: "Regola numero cinque: la conversazione. All'aperitivo si parla di tutto, ma con leggerezza: del lavoro, delle vacanze, del calcio, di dove andare a cena. Se qualcuno ti chiede «Di dove sei?», diglielo, e poi chiedigli qualcosa della sua città. I milanesi amano parlare di Milano, anche quando se ne lamentano.", en: "Rule number five: conversation. At aperitivo people talk about everything, but lightly: work, holidays, football, where to go for dinner. If someone asks you 'Where are you from?', tell them, and then ask them something about their city. The Milanese love talking about Milan, even when they're complaining about it." }
  - { es: "Ultima regola: il conto. Di solito ognuno paga il suo, ma tra amici capita spesso che uno offra il primo giro e l'altro il secondo. Venerdì il primo giro te lo offro io. Il secondo, però, offrimelo tu! Dimmi a che ora finisci di lavorare e scrivimi quando arrivi in Porta Genova. Ci vediamo lì. Un abbraccio, Francesco.", en: "Last rule: the bill. Usually everyone pays for their own, but among friends it often happens that one person buys the first round and the other the second. On Friday the first round is on me. The second, though, is on you! Tell me what time you finish work and text me when you get to Porta Genova. See you there. A hug, Francesco." }
questions:
  - { q: "A che ora si fa l'aperitivo a Milano, secondo Francesco?", options: ["Tra le sei e le sette", "Tra le sette e le nove", "Dopo le dieci"], answer: 1, explain: "«L'aperitivo si fa tra le sette e le nove di sera, dopo il lavoro e prima di cena.»" }
  - { q: "Come è nato il Negroni sbagliato?", options: ["Un barista ha messo lo spumante al posto del gin per errore", "Un turista l'ha ordinato per sbaglio", "È una ricetta di Venezia"], answer: 0, explain: "Sbagliato means 'mistaken': a barman used sparkling wine instead of gin." }
  - { q: "Che cosa pensano i veri milanesi dell'«apericena»?", options: ["Che sia la parte migliore dell'aperitivo", "Non la approvano molto", "Non la conoscono"], answer: 1, explain: "«I veri milanesi lo guardano male» – they frown on treating the buffet as dinner." }
  - { q: "Perché è meglio bere l'aperitivo in piedi sui Navigli il venerdì?", options: ["Perché i tavoli sono tutti occupati", "Perché è vietato sedersi", "Perché costa meno"], answer: 0, explain: "After 7.30 on a Friday you won't find a free table." }
  - { q: "Chi pagherà il secondo giro?", options: ["Francesco", "Sam", "Il barista"], answer: 1, explain: "«Il primo giro te lo offro io. Il secondo, però, offrimelo tu!» – offrimelo = offri + mi + lo." }
