id: r.b1.la-bonne-mere
level: b1
title: La Bonne Mère, qui veille sur Marseille
kind: text
intro: Karim, who grew up in Marseille, writes about Notre-Dame-de-la-Garde, the basilica on the hill that the people of Marseille call «la Bonne Mère». Notice the relative pronouns qui, que, où and dont.
allow: [karim, espérandieu, byzantin, byzantines, centre]
paragraphs:
  - { es: "Il y a une chose que tous les Marseillais voient chaque jour, où qu'ils soient dans la ville : la basilique Notre-Dame-de-la-Garde. Elle se trouve en haut d'une colline qui domine le Vieux-Port et la mer. Sur son clocher, il y a une immense statue dorée de la Vierge qui tient l'Enfant Jésus dans ses bras. C'est elle que les Marseillais appellent « la Bonne Mère ».", en: "There is one thing that everyone in Marseille sees every day, wherever they are in the city: the basilica of Notre-Dame-de-la-Garde. It stands at the top of a hill that overlooks the Vieux-Port and the sea. On its bell tower there is a huge golden statue of the Virgin holding the Child Jesus in her arms. She is the one the people of Marseille call 'the Good Mother'." }
  - { es: "Je suis né dans un quartier populaire d'où on voyait la basilique. Quand j'étais petit, ma grand-mère me disait : « Ne t'inquiète pas, la Bonne Mère veille sur nous. » Pour elle, qui était arrivée d'Algérie dans les années soixante, c'était le symbole de la ville qui l'avait accueillie. Elle n'était pas très croyante, mais elle montait à la basilique chaque année, le 15 août.", en: "I was born in a working-class neighbourhood from which you could see the basilica. When I was little, my grandmother used to tell me: 'Don't worry, the Good Mother is watching over us.' For her – she had arrived from Algeria in the sixties – it was the symbol of the city that had welcomed her. She wasn't very religious, but she climbed up to the basilica every year on the 15th of August." }
  - { es: "Depuis le Moyen Âge, il y a une chapelle sur cette colline, mais la basilique que l'on voit aujourd'hui date du dix-neuvième siècle. Elle a été construite entre 1853 et 1864 par l'architecte Henri-Jacques Espérandieu. Son style, dont on reconnaît les influences byzantines, est très différent de celui des églises gothiques du nord de la France : des pierres blanches et vertes, des coupoles et, à l'intérieur, des mosaïques dorées qui brillent au soleil.", en: "There has been a chapel on this hill since the Middle Ages, but the basilica you see today dates from the nineteenth century. It was built between 1853 and 1864 by the architect Henri-Jacques Espérandieu. Its style, in which you can recognise Byzantine influences, is very different from that of the Gothic churches of northern France: white and green stones, domes and, inside, golden mosaics that shine in the sun." }
  - { es: "Mais ce que je préfère, ce sont les ex-voto. Ce sont des objets que les gens offrent à la Bonne Mère pour la remercier : des tableaux qui montrent des bateaux dans la tempête, des petits navires suspendus au plafond, des lettres, des photos. Chaque objet raconte une histoire : un marin qui a survécu à un naufrage, un enfant qui a guéri d'une maladie, une mère dont le fils est rentré de la guerre.", en: "But what I like best are the ex-votos. They are objects people offer to the Good Mother to thank her: paintings showing boats in storms, little ships hanging from the ceiling, letters, photos. Each object tells a story: a sailor who survived a shipwreck, a child who recovered from an illness, a mother whose son came home from the war." }
  - { es: "Sur la façade, on peut encore voir des traces de balles. Elles datent d'août 1944, quand la ville a été libérée. Des soldats se sont battus ici pendant plusieurs jours. C'est un détail que beaucoup de touristes ne remarquent pas.", en: "On the façade you can still see bullet marks. They date from August 1944, when the city was liberated. Soldiers fought here for several days. It's a detail that many tourists don't notice." }
  - { es: "Pour monter à la basilique, on peut prendre le bus, mais je vous conseille d'y aller à pied. La montée est raide et il fait souvent chaud, mais la vue qu'on a d'en haut est la plus belle de Marseille : les toits du centre-ville, le port, les îles, et la mer qui brille jusqu'à l'horizon. Allez-y en fin de journée, au moment où le soleil se couche. C'est là que vous comprendrez pourquoi, pour nous, elle n'est pas seulement une église. C'est la gardienne de la ville.", en: "To get up to the basilica you can take the bus, but I advise you to go on foot. The climb is steep and it's often hot, but the view from the top is the most beautiful in Marseille: the roofs of the city centre, the port, the islands, and the sea shining all the way to the horizon. Go at the end of the day, when the sun is setting. That's when you'll understand why, for us, it isn't just a church. It's the guardian of the city." }
questions:
  - { q: "Qui est « la Bonne Mère » ?", options: ["La grand-mère de Karim", "La statue dorée de la Vierge sur la basilique", "Une église du Vieux-Port"], answer: 1, explain: "«C'est elle que les Marseillais appellent la Bonne Mère» – the golden statue of the Virgin, and by extension the basilica." }
  - { q: "Pourquoi la basilique était-elle importante pour la grand-mère de Karim ?", options: ["Elle y travaillait", "C'était le symbole de la ville qui l'avait accueillie", "Elle y était née"], answer: 1, explain: "She had come from Algeria; the basilica was «le symbole de la ville qui l'avait accueillie»." }
  - { q: "Quand la basilique actuelle a-t-elle été construite ?", options: ["Au Moyen Âge", "Entre 1853 et 1864", "En 1944"], answer: 1, explain: "There was a chapel in the Middle Ages, but the basilica was built «entre 1853 et 1864»." }
  - { q: "Qu'est-ce qu'un ex-voto ?", options: ["Un objet offert pour remercier", "Un ticket d'entrée", "Une sorte de mosaïque"], answer: 0, explain: "«Des objets que les gens offrent à la Bonne Mère pour la remercier.»" }
  - { q: "Que rappellent les traces sur la façade ?", options: ["Une tempête", "Les combats de la Libération en 1944", "Un incendie"], answer: 1, explain: "«Des traces de balles… d'août 1944, quand la ville a été libérée.»" }
  - { q: "Dans « une mère dont le fils est rentré de la guerre », que signifie « dont » ?", options: ["Où", "De qui (le fils de la mère)", "Que"], answer: 1, explain: "Dont replaces de + noun: le fils de la mère → la mère dont le fils…" }
