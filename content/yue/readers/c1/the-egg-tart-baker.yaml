id: r.c1.the-egg-tart-baker
level: c1
title: 路環餅店老闆專訪
kind: dialogue
intro: "A magazine interview with the (fictional) owner of a small family bakery in Coloane, who talks about the history of the Macau egg tart, running a business and dealing with big customers. Listen for polite, formal phrases such as 貴公司, 敝店, 承蒙, 坦白講 and percentages and discounts, mixed into friendly colloquial speech."
allow: [何記, 何生, 安德魯, 葡撻, 里斯本]
paragraphs:
  - { es: "記者：何生，你好，多謝你抽時間接受我哋訪問。何記餅店喺路環開咗三十年，好多遊客專程坐車入嚟買葡撻。可唔可以先講吓，間舖係點開始嘅？", en: "Reporter: Mr Ho, hello, and thank you for making time for this interview. Ho Kee Bakery has been open in Coloane for thirty years, and many tourists come all the way out by bus just to buy egg tarts. Could you start by telling us how the shop began?" }
  - { es: "何生：唔好客氣，承蒙你哋咁睇得起敝店。我阿爸以前喺酒店做西餅師傅，九十年代初退休，就喺路環租咗間細舖，本來淨係賣麵包同蛋糕。嗰陣路環好靜，週末先有啲人嚟行吓海灘，平日一日賣唔到幾十個麵包。", en: "Mr Ho: Not at all – it's an honour that you think so highly of our humble shop. My father used to be a pastry chef at a hotel. When he retired in the early nineties, he rented a small shop in Coloane, and at first it only sold bread and cakes. Coloane was very quiet back then; only at weekends did a few people come to walk on the beach, and on weekdays we couldn't sell more than a few dozen loaves a day." }
  - { es: "記者：咁葡撻呢？大家都話澳門葡撻同葡萄牙有關係。", en: "Reporter: And the egg tarts? Everyone says the Macau egg tart has a connection with Portugal." }
  - { es: "何生：係，但係講真，澳門葡撻嘅歷史其實好短。一九八九年，一位叫安德魯嘅英國人喺路環開咗間餅店，佢參考葡萄牙嘅蛋撻，再用英式蛋撻嘅做法改良，表面燒到有啲焦，入面好滑。後來好多餅店都跟住做，慢慢就成咗澳門嘅招牌手信。我阿爸都係嗰時開始學整，試咗成年先整到自己滿意嘅味道。", en: "Mr Ho: Yes, but to be honest, the history of the Macau egg tart is actually very short. In 1989 an Englishman called Andrew opened a bakery in Coloane. He took the Portuguese custard tart as his model and adapted it using the method for English custard tarts, so that the top is a bit scorched and the inside is very smooth. Later lots of bakeries followed suit, and gradually it became Macau's signature souvenir. That's when my father started learning to make them too – it took him a whole year of trying before he got a flavour he was happy with." }
  - { es: "記者：而家生意咁好，有冇大公司搵過你合作？", en: "Reporter: Business is so good now – have big companies approached you to work together?" }
  - { es: "何生：有，上年就有一間酒店集團想同我哋簽約，每日要兩千個葡撻，放喺佢哋嘅自助餐。佢哋封信寫得好客氣：「敬啟者：貴店之葡撻馳名中外，本集團誠意邀請貴店合作……」我睇完都覺得自己好威。", en: "Mr Ho: Yes. Last year a hotel group wanted to sign a contract with us – two thousand egg tarts a day for their buffet. Their letter was extremely polite: 'Dear Sir/Madam: Your shop's egg tarts are renowned at home and abroad, and our group sincerely invites your shop to cooperate…' After reading it I felt very important." }
  - { es: "記者：咁結果傾成咗未呀？", en: "Reporter: So did the deal go through in the end?" }
  - { es: "何生：傾咗三個月。佢哋開頭要我哋減價三成，即係七折，仲要逢星期日加送五百個。坦白講，我哋嘅利潤本來就唔高，牛油、雞蛋、租金年年加，打七折我哋實蝕本。我就同佢哋講：「原則上我哋好樂意合作，不過價錢方面，睇吓有冇商量嘅空間。」", en: "Mr Ho: We negotiated for three months. At first they wanted us to cut the price by thirty per cent, that is, thirty per cent off, and on top of that give them an extra five hundred every Sunday. Frankly, our profit margin isn't high to begin with – butter, eggs and rent go up every year – so at thirty per cent off we'd definitely make a loss. So I told them: 'In principle we'd be very happy to cooperate, but as regards the price, let's see whether there's any room for discussion.'" }
  - { es: "記者：好有禮貌噉講「唔得」。", en: "Reporter: A very polite way of saying no." }
  - { es: "何生：（笑）做生意就係噉，唔可以一開口就拒絕人，要畀返面。最後我哋同意九折，每日一千五百個，唔送額外。佢哋都接受，因為佢哋知道，如果我哋為咗平啲而用差啲嘅材料，客人一食就知。對我嚟講，數量唔係最緊要，個味道先係最緊要。", en: "Mr Ho: (laughs) That's how business works: you can't turn people down the moment you open your mouth, you have to let them save face. In the end we agreed on ten per cent off, fifteen hundred a day, with nothing extra free. They accepted, because they knew that if we used worse ingredients to make it cheaper, customers would notice at the first bite. For me, quantity isn't the most important thing; the flavour is." }
  - { es: "記者：有人話，同大集團合作，細舖好容易失去自己嘅特色。你擔唔擔心？", en: "Reporter: Some people say that when a small shop works with a big group, it can easily lose its own character. Are you worried about that?" }
  - { es: "何生：擔心㗎，所以我哋喺合約寫明：酒店唔可以將我哋嘅葡撻當自己出品，個盒一定要印住「何記」兩個字。仲有，舖頭嘅客永遠排第一，如果某一日材料唔夠，我哋寧願少送啲畀酒店，都唔會叫街坊空手返去。呢個係我阿爸定落嚟嘅規矩：做得耐，靠嘅係街坊，唔係靠一張合約。", en: "Mr Ho: I am worried, so we put it in writing in the contract: the hotel can't pass our egg tarts off as its own product, and the box must have 'Ho Kee' printed on it. Also, customers in the shop always come first. If one day we're short of ingredients, we'd rather send fewer to the hotel than have the neighbours go home empty-handed. That's a rule my father laid down: if you want to last, you rely on the neighbourhood, not on a contract." }
  - { es: "記者：最後一條問題：而家年輕人好多都唔想做呢行，你點睇？", en: "Reporter: Last question: nowadays lots of young people don't want to work in this trade. What do you think?" }
  - { es: "何生：呢行好辛苦，朝早四點就要起身搓麵粉，夏天個焗爐隔籬熱到四十度。不過我個女大學讀完商科，竟然話想返嚟幫手，仲幫我哋開咗網上舖，而家連葡萄牙都有客人寄電郵嚟訂貨。佢話：「阿爸，你整葡撻，我負責賣。」我聽到真係好安慰。老實講，佢寫嗰啲商業電郵，比我寫得好得多。", en: "Mr Ho: It's very hard work. You have to get up at four in the morning to knead the dough, and in summer it's forty degrees next to the oven. But my daughter, after finishing a business degree, said – to my surprise – that she wanted to come back and help, and she even set up an online shop for us; now we get emails ordering tarts even from Portugal. She says: 'Dad, you bake the tarts, I'll take care of selling them.' Hearing that is a real comfort. Honestly, the business emails she writes are far better than mine." }
  - { es: "記者：多謝何生。訪問完，我可唔可以買半打葡撻返公司？", en: "Reporter: Thank you, Mr Ho. Now that we've finished, could I buy half a dozen egg tarts to take back to the office?" }
  - { es: "何生：梗係得啦！啱啱出爐，熱辣辣，我送多兩個畀你，唔使客氣。不過記住，即刻食最好味，擺到聽日就冇咁脆喇。", en: "Mr Ho: Of course! They've just come out of the oven, piping hot. I'll throw in two extra for you, don't mention it. But remember, they taste best right away; if you leave them till tomorrow they won't be as crisp." }
questions:
  - { q: "根據何生，澳門葡撻嘅歷史係點樣開始嘅？", options: ["幾百年前由葡萄牙人帶嚟澳門", "一九八九年一個英國人喺路環開餅店，改良咗葡萄牙蛋撻", "何生阿爸喺酒店發明嘅"], answer: 1, explain: "The Macau egg tart dates from 1989, when an Englishman in Coloane adapted the Portuguese tart with English custard-tart methods." }
  - { q: "酒店集團開頭要求打幾折？", options: ["七折", "八折", "九折"], answer: 0, explain: "減價三成 = 七折: you pay 70% of the price." }
  - { q: "何生點樣客氣噉拒絕酒店嘅價錢？", options: ["佢直接話「唔得」", "佢話「原則上好樂意合作，不過睇吓價錢有冇商量嘅空間」", "佢唔覆封信"], answer: 1, explain: "原則上…不過…睇吓有冇空間 is a classic negotiation softener: agree in principle, then reopen the price." }
  - { q: "最後雙方同意咗乜嘢？", options: ["七折，每日兩千個", "九折，每日一千五百個，唔送額外", "原價，每日五百個"], answer: 1, explain: "They settled on 10% off (九折) for 1,500 tarts a day, with no free extras." }
  - { q: "何生個女返嚟幫手做咗乜嘢？", options: ["開咗網上舖，負責賣嘢", "喺葡萄牙開分店", "負責朝早四點搓麵粉"], answer: 0, explain: "She set up an online shop and handles sales: 你整葡撻，我負責賣." }
