id: a2.u03
title: Cuando era niño
lessons:
  - id: a2.u03.l1
    title: Antes vivía en un pueblo
    teach: [g.imperfect]
    tip: "The imperfect describes how things were: vivía, tenía, era."
    vocab: [w.antes, w.de-nino, w.de-pequeno, w.en-aquella-epoca, w.colegio, w.instituto, w.recreo, w.maestro, w.patio, w.companero.phr, w.uniforme, w.recuerdo, w.pueblo.phr, w.verano.phr]
    sentences:
      - { es: "Cuando era niño, vivía en un pueblo pequeño.", en: "When I was a child, I lived in a small village.", grammar: [g.imperfect, g.imperfect-uses], vocab: [w.de-nino, w.pueblo.phr] }
      - { es: "Antes no había internet en casa.", en: "Before, there was no internet at home.", altEs: ["Antes no teníamos internet en casa."], grammar: [g.imperfect], vocab: [w.antes, w.haber] }
      - { es: "De pequeña iba al colegio a pie.", en: "When I was little I walked to school.", altEs: ["De pequeña iba andando al colegio."], grammar: [g.imperfect], vocab: [w.de-pequeno, w.colegio, w.ir] }
      - { es: "Mi maestro era muy amable y nos contaba cuentos.", en: "My teacher was very kind and told us stories.", altEs: ["Mi maestro era muy simpático y nos contaba cuentos."], grammar: [g.imperfect], vocab: [w.maestro, w.escuchar.phr] }
      - { es: "En el recreo jugábamos al fútbol en el patio.", en: "At break we played football in the playground.", altEs: ["En el recreo jugábamos fútbol en el patio."], grammar: [g.imperfect], vocab: [w.recreo, w.patio, w.jugar] }
      - { es: "Llevábamos uniforme en el instituto.", en: "We wore a uniform at secondary school.", grammar: [g.imperfect], vocab: [w.uniforme, w.instituto] }
      - { es: "Mis compañeros de clase eran muy divertidos.", en: "My classmates were great fun.", grammar: [g.imperfect], vocab: [w.companero.phr, w.divertido] }
      - { es: "En aquella época mis padres trabajaban mucho.", en: "At that time my parents worked a lot.", grammar: [g.imperfect-uses], vocab: [w.en-aquella-epoca, w.trabajar] }
      - { es: "Todos los veranos íbamos al pueblo de mis abuelos.", en: "Every summer we went to my grandparents' village.", altEs: ["Cada verano íbamos al pueblo de mis abuelos."], grammar: [g.imperfect-uses], vocab: [w.verano.phr, w.abuelos.phr] }
      - { es: "Tengo muy buenos recuerdos de mi infancia.", en: "I have very good memories of my childhood.", grammar: [g.tener-present], vocab: [w.recuerdo, w.infancia] }
      - { es: "Mi abuela tenía una casa con un jardín enorme.", en: "My grandmother had a house with a huge garden.", altEs: ["Mi abuela tenía una casa con un jardín muy grande."], grammar: [g.imperfect-uses], vocab: [w.tener, w.jardin] }
      - { es: "Éramos cinco hermanos y dormíamos en dos habitaciones.", en: "There were five of us siblings and we slept in two rooms.", grammar: [g.imperfect], vocab: [w.ser, w.dormir], error: { wrong: "Eramos cinco hermanos y dormíamos en dos habitaciones.", explain: "The nosotros imperfect of ser is éramos, with an accent.", grammar: g.imperfect } }
      - { es: "Yo veía dibujos animados por la mañana.", en: "I used to watch cartoons in the morning.", altEs: ["Veía dibujos animados por la mañana."], grammar: [g.imperfect], vocab: [w.ver, w.dibujos-animados], transform: { instruction: "Change to 'we'", answer: "Veíamos dibujos animados por la mañana.", alt: ["Nosotros veíamos dibujos animados por la mañana."] } }
    exchanges:
      - q: { es: "¿Dónde vivías cuando eras niño?", en: "Where did you live when you were a child?" }
        a: { es: "Vivía en un pueblo pequeño.", en: "I lived in a small village." }
        alt: ["En un pueblo pequeño.", "En un pueblo."]
        grammar: [g.imperfect]
        vocab: [w.de-nino, w.vivir]
      - q: { es: "¿Cómo ibas al colegio?", en: "How did you get to school?" }
        a: { es: "Iba a pie.", en: "I walked." }
        alt: ["A pie.", "Iba andando."]
        grammar: [g.imperfect]
        vocab: [w.colegio, w.ir]
      - q: { es: "¿Cómo era tu maestro?", en: "What was your teacher like?" }
        a: { es: "Era muy amable y nos contaba cuentos.", en: "He was very kind and told us stories." }
        alt: ["Era muy amable.", "Muy amable."]
        grammar: [g.imperfect]
        vocab: [w.maestro]
      - q: { es: "¿Llevabais uniforme en el instituto?", en: "Did you wear a uniform at secondary school?" }
        a: { es: "Sí, llevábamos uniforme todos los días.", en: "Yes, we wore a uniform every day." }
        alt: ["Sí, todos los días.", "No, no llevábamos uniforme."]
        grammar: [g.imperfect]
        vocab: [w.uniforme, w.instituto]
    texts:
      - title: "Recuerdos del colegio"
        es: ["Cuando era pequeño, iba al colegio a pie con mis hermanos.", "En el recreo jugábamos al fútbol en el patio.", "Mi maestro era muy serio, pero nos contaba cuentos los viernes."]
        en: ["When I was little, I walked to school with my brothers.", "At break we played football in the playground.", "My teacher was very serious, but he told us stories on Fridays."]
        grammar: [g.imperfect, g.imperfect-uses]
        vocab: [w.recreo, w.patio, w.maestro]
    spicy:
      - { es: "De pequeño era tímido; ahora hablo con la persona más guapa del bar.", en: "As a kid I was shy; now I'm talking to the best-looking person in the bar.", altEs: ["De pequeña era tímida; ahora hablo con la persona más guapa del bar."], grammar: [g.imperfect], vocab: [w.de-pequeno] }
      - { es: "Antes no bailaba; ahora bailo contigo todos los viernes.", en: "Before, I didn't dance; now I dance with you every Friday.", grammar: [g.imperfect, g.imperfect-uses], vocab: [w.antes] }
      - { es: "En aquella época tenía muchos amigos, pero ninguno tan guapo como tú.", en: "Back then I had lots of friends, but none as handsome as you.", altEs: ["En aquella época tenía muchas amigas, pero ninguna tan guapa como tú."], grammar: [g.imperfect], vocab: [w.en-aquella-epoca] }
      - { es: "Todos los veranos íbamos al mismo pueblo y yo nunca te hablaba. Hola.", en: "Every summer we went to the same village and I never talked to you. Hi.", grammar: [g.imperfect], vocab: [w.verano.phr, w.pueblo.phr] }
      - { es: "Mi abuela siempre decía que la persona perfecta cocina bien. ¿Cocinas?", en: "My grandmother always said the perfect person cooks well. Do you cook?", grammar: [g.imperfect, g.imperfect-uses], vocab: [w.abuela] }
  - id: a2.u03.l2
    title: Juegos y juguetes
    teach: [g.imperfect-uses]
    vocab: [w.juguete, w.muneca, w.pelota, w.dibujos-animados, w.comic, w.tebeo, w.bicicleta, w.columpio, w.mascota, w.caramelo, w.cuento, w.montar, w.saltar, w.esconderse, w.helado.phr]
    sentences:
      - { es: "Mi juguete favorito era un coche rojo.", en: "My favourite toy was a red car.", grammar: [g.imperfect-uses], vocab: [w.juguete, w.favorito] }
      - { es: "Mi hermana jugaba con muñecas y yo con la pelota.", en: "My sister played with dolls and I with the ball.", altEs: ["Mi hermana jugaba con muñecas y yo jugaba con la pelota."], grammar: [g.imperfect-uses], vocab: [w.muneca, w.pelota] }
      - { es: "Los sábados veíamos dibujos animados y leíamos cómics.", en: "On Saturdays we watched cartoons and read comics.", altEs: ["Los sábados veíamos dibujos animados y leíamos tebeos."], grammar: [g.imperfect-uses], vocab: [w.dibujos-animados, w.comic] }
      - { es: "Mi padre coleccionaba tebeos antiguos.", en: "My father collected old comic books.", grammar: [g.imperfect-uses], vocab: [w.tebeo, w.antiguo] }
      - { es: "Montaba en bicicleta por el barrio con mis amigos.", en: "I rode my bike around the neighbourhood with my friends.", altEs: ["Montaba en bici por el barrio con mis amigos.", "Andaba en bicicleta por el barrio con mis amigos."], grammar: [g.imperfect-uses], vocab: [w.montar, w.bicicleta] }
      - { es: "En el parque había columpios y nosotros saltábamos y corríamos.", en: "In the park there were swings and we jumped and ran.", grammar: [g.imperfect], vocab: [w.columpio, w.saltar, w.correr] }
      - { es: "Teníamos una mascota: un gato que se llamaba Misi.", en: "We had a pet: a cat called Misi.", grammar: [g.imperfect-uses], vocab: [w.mascota, w.gato] }
      - { es: "Mi abuelo siempre me daba caramelos.", en: "My grandfather always gave me sweets.", altEs: ["Mi abuelo me daba caramelos siempre."], grammar: [g.imperfect-uses], vocab: [w.caramelo, w.dar] }
      - { es: "Antes de dormir, mi madre me leía un cuento.", en: "Before bed, my mother read me a story.", altEs: ["Antes de dormir, mi madre me contaba un cuento."], grammar: [g.imperfect-uses], vocab: [w.cuento, w.leer] }
      - { es: "Nos escondíamos detrás de los árboles.", en: "We hid behind the trees.", altEs: ["Nosotros nos escondíamos detrás de los árboles."], grammar: [g.imperfect], vocab: [w.esconderse, w.arbol] }
      - { es: "Los domingos tomábamos un helado en la plaza.", en: "On Sundays we had an ice cream in the square.", altEs: ["Los domingos nos tomábamos un helado en la plaza."], grammar: [g.imperfect-uses], vocab: [w.helado.phr, w.plaza] }
      - { es: "¿A qué jugabas de pequeño? — Jugaba al escondite.", en: "What did you play as a child? — I played hide-and-seek.", grammar: [g.imperfect-uses], vocab: [w.jugar, w.de-pequeno] }
      - { es: "Mi hermano montaba a caballo en el pueblo.", en: "My brother rode horses in the village.", grammar: [g.imperfect-uses], vocab: [w.montar, w.caballo], transform: { instruction: "Change to 'my brothers' (plural)", answer: "Mis hermanos montaban a caballo en el pueblo." } }
    exchanges:
      - q: { es: "¿Cuál era tu juguete favorito?", en: "What was your favourite toy?" }
        a: { es: "Un coche rojo.", en: "A red car." }
        alt: ["Mi juguete favorito era un coche rojo.", "Era un coche rojo."]
        grammar: [g.imperfect-uses]
        vocab: [w.juguete, w.favorito]
      - q: { es: "¿A qué jugabas de pequeño?", en: "What did you play as a child?" }
        a: { es: "Jugaba con la pelota en el parque.", en: "I played with the ball in the park." }
        alt: ["Jugaba con la pelota.", "Al fútbol."]
        grammar: [g.imperfect-uses]
        vocab: [w.jugar, w.pelota]
      - q: { es: "¿Teníais mascota?", en: "Did you have a pet?" }
        a: { es: "Sí, teníamos un gato que se llamaba Misi.", en: "Yes, we had a cat called Misi." }
        alt: ["Sí, un gato.", "No, no teníamos."]
        grammar: [g.imperfect-uses]
        vocab: [w.mascota, w.gato]
      - q: { es: "¿Qué hacíais los domingos?", en: "What did you do on Sundays?" }
        a: { es: "Tomábamos un helado en la plaza.", en: "We had an ice cream in the square." }
        alt: ["Tomábamos un helado.", "Íbamos a la plaza."]
        grammar: [g.imperfect-uses]
        vocab: [w.helado.phr, w.plaza]
    texts:
      - title: "Mensaje a mi hermana"
        es: ["¿Recuerdas nuestra bicicleta roja?", "Montábamos por el barrio todas las tardes y el abuelo nos daba caramelos.", "¡Qué tiempos!"]
        en: ["Do you remember our red bicycle?", "We rode around the neighbourhood every afternoon and Grandpa gave us sweets.", "Those were the days!"]
        grammar: [g.imperfect-uses]
        vocab: [w.bicicleta, w.montar, w.caramelo]
    spicy:
      - { es: "De pequeño montaba en bicicleta sin manos; ahora tengo miedo de pedir tu número.", en: "As a kid I rode my bike with no hands; now I'm scared to ask for your number.", altEs: ["De pequeña montaba en bicicleta sin manos; ahora tengo miedo de pedir tu número."], grammar: [g.imperfect-uses], vocab: [w.montar, w.bicicleta] }
      - { es: "Antes me escondía de los perros; ahora mi perro se esconde de ti porque le gustas.", en: "I used to hide from dogs; now my dog hides from you because he likes you.", grammar: [g.imperfect-uses], vocab: [w.esconderse] }
      - { es: "Mi cuento favorito tenía un final feliz; este café también puede tener uno.", en: "My favourite story had a happy ending; this coffee can have one too.", grammar: [g.imperfect-uses], vocab: [w.cuento] }
      - { es: "Cuando era pequeño, los caramelos eran mi cosa favorita. Ahora, los caramelos y tú.", en: "When I was little, sweets were my favourite thing. Now, sweets and you.", altEs: ["Cuando era pequeña, los caramelos eran mi cosa favorita. Ahora, los caramelos y tú."], grammar: [g.imperfect-uses], vocab: [w.caramelo] }
      - { es: "Saltaba en el columpio y jugaba con la pelota; hoy solo quiero jugar a las cartas contigo.", en: "I used to jump on the swing and play with the ball; today I just want to play cards with you.", grammar: [g.imperfect-uses], vocab: [w.columpio, w.pelota, w.saltar] }
  - id: a2.u03.l3
    title: Solía…
    teach: [g.soler]
    vocab: [w.soler, w.pelearse, w.obedecer, w.castigar, w.portarse, w.travieso, w.obediente, w.molestar, w.soñar, w.tener-miedo.phr, w.oscuridad, w.abuelos.phr, w.escuchar.phr]
    sentences:
      - { es: "Solía levantarme muy temprano para ir al colegio.", en: "I used to get up very early to go to school.", altEs: ["Me solía levantar muy temprano para ir al colegio."], grammar: [g.soler], vocab: [w.soler, w.levantarse] }
      - { es: "Mis hermanos y yo solíamos pelearnos por la televisión.", en: "My brothers and I used to fight over the television.", altEs: ["Mis hermanos y yo nos solíamos pelear por la televisión."], grammar: [g.soler], vocab: [w.pelearse, w.television] }
      - { es: "Yo era muy travieso y no obedecía a mis padres.", en: "I was very naughty and didn't obey my parents.", altEs: ["Era muy travieso y no obedecía a mis padres."], grammar: [g.imperfect-uses], vocab: [w.travieso, w.obedecer] }
      - { es: "Mi hermana, en cambio, era muy obediente.", en: "My sister, on the other hand, was very obedient.", grammar: [g.connectors-contrast], vocab: [w.obediente, w.hermana] }
      - { es: "Cuando me portaba mal, mi madre me castigaba sin postre.", en: "When I behaved badly, my mother punished me with no dessert.", grammar: [g.mientras-cuando], vocab: [w.portarse, w.castigar, w.postre] }
      - { es: "Siempre molestaba a mi hermano mayor.", en: "I was always bothering my older brother.", altEs: ["Molestaba siempre a mi hermano mayor."], grammar: [g.imperfect-uses], vocab: [w.molestar, w.mayor] }
      - { es: "Soñaba con ser futbolista.", en: "I dreamt of being a footballer.", grammar: [g.prepositions-verbs], vocab: [w.soñar, w.futbol], error: { wrong: "Soñaba de ser futbolista.", explain: "soñar con.", grammar: g.prepositions-verbs } }
      - { es: "Tenía miedo de la oscuridad.", en: "I was afraid of the dark.", altEs: ["Me daba miedo la oscuridad."], grammar: [g.tener-expressions], vocab: [w.tener-miedo.phr, w.oscuridad] }
      - { es: "Mis abuelos solían contarnos cuentos por la noche.", en: "My grandparents used to tell us stories at night.", altEs: ["Mis abuelos nos solían contar cuentos por la noche."], grammar: [g.soler], vocab: [w.escuchar.phr, w.abuelos.phr] }
      - { es: "¿Qué solías hacer los domingos?", en: "What did you usually do on Sundays?", altEs: ["¿Qué hacías normalmente los domingos?"], grammar: [g.soler], vocab: [w.soler, w.domingo] }
      - { es: "Solíamos comer todos juntos en casa de los abuelos.", en: "We used to eat all together at our grandparents' house.", grammar: [g.soler], vocab: [w.abuelos.phr, w.juntos] }
      - { es: "Mi padre suele leer el periódico después de cenar.", en: "My father usually reads the paper after dinner.", grammar: [g.soler], vocab: [w.soler, w.periodico] }
      - { es: "Ella solía jugar en la calle.", en: "She used to play in the street.", grammar: [g.soler], vocab: [w.soler, w.jugar], transform: { instruction: "Change to 'you all' (vosotros)", answer: "Solíais jugar en la calle.", alt: ["Vosotros solíais jugar en la calle."] } }
    exchanges:
      - q: { es: "¿Qué solías hacer los domingos?", en: "What did you usually do on Sundays?" }
        a: { es: "Solía comer en casa de mis abuelos.", en: "I used to eat at my grandparents' house." }
        alt: ["Comía en casa de mis abuelos.", "Solíamos comer todos juntos."]
        grammar: [g.soler]
        vocab: [w.soler, w.abuelos.phr]
      - q: { es: "¿Eras un niño travieso?", en: "Were you a naughty child?" }
        a: { es: "Sí, no obedecía a mis padres y me peleaba con mi hermano.", en: "Yes, I didn't obey my parents and I fought with my brother." }
        alt: ["Sí, un poco.", "No, era muy obediente."]
        grammar: [g.imperfect-uses]
        vocab: [w.travieso, w.obedecer]
      - q: { es: "¿Te castigaban tus padres?", en: "Did your parents punish you?" }
        a: { es: "Sí, cuando me portaba mal, me castigaban sin postre.", en: "Yes, when I behaved badly, they punished me with no dessert." }
        alt: ["Sí, sin postre.", "No, casi nunca."]
        grammar: [g.imperfect-uses, g.mientras-cuando]
        vocab: [w.castigar, w.portarse]
      - q: { es: "¿Tenías miedo de algo?", en: "Were you afraid of anything?" }
        a: { es: "Sí, tenía miedo de la oscuridad.", en: "Yes, I was afraid of the dark." }
        alt: ["De la oscuridad.", "No, de nada."]
        grammar: [g.tener-expressions, g.imperfect-uses]
        vocab: [w.tener-miedo.phr, w.oscuridad]
      - q: { es: "¿Qué suele hacer tu padre después de cenar?", en: "What does your father usually do after dinner?" }
        a: { es: "Suele leer el periódico.", en: "He usually reads the paper." }
        alt: ["Lee el periódico.", "Suele ver la televisión."]
        grammar: [g.soler]
        vocab: [w.soler, w.periodico]
    texts:
      - title: "Nota del profesor"
        es: ["Pablo suele llegar tarde a clase.", "Antes era un niño obediente, pero últimamente molesta a sus compañeros.", "¿Podemos hablar esta semana?"]
        en: ["Pablo usually arrives late to class.", "He used to be an obedient boy, but lately he bothers his classmates.", "Can we talk this week?"]
        grammar: [g.soler, g.imperfect-uses]
        vocab: [w.soler, w.obediente, w.molestar]
    spicy:
      - { es: "Solía soñar con una persona así; hoy la tengo delante.", en: "I used to dream about someone like this; today she's right in front of me.", altEs: ["Solía soñar con una persona así; hoy lo tengo delante."], grammar: [g.soler], vocab: [w.soler, w.soñar] }
      - { es: "Mi perro suele portarse bien, pero contigo es muy travieso: quiere tu bocadillo y tu silla.", en: "My dog usually behaves, but with you he's very naughty: he wants your sandwich and your chair.", grammar: [g.soler], vocab: [w.soler, w.portarse, w.travieso] }
      - { es: "De pequeño solía tener miedo de la oscuridad; ahora tengo miedo de decir que me gustas. Ya está, lo dije.", en: "As a kid I used to be scared of the dark; now I'm scared to say I like you. There, I said it.", altEs: ["De pequeña solía tener miedo de la oscuridad; ahora tengo miedo de decir que me gustas. Ya está, lo dije."], grammar: [g.soler, g.tener-expressions], vocab: [w.soler, w.tener-miedo.phr, w.oscuridad] }
      - { es: "Mi madre solía decir que eres perfecto para mí. Hoy le hago caso.", en: "My mother used to say you're perfect for me. Today I'm taking her advice.", altEs: ["Mi madre solía decir que eres perfecta para mí. Hoy le hago caso."], grammar: [g.soler], vocab: [w.soler] }
      - { es: "¿Te molesto? Suelo molestar a la gente guapa.", en: "Am I bothering you? I usually bother good-looking people.", grammar: [g.soler], vocab: [w.soler, w.molestar] }
  - id: a2.u03.l4
    title: El mundo de antes
    teach: [g.imperfect]
    vocab: [w.cambiar.phr, w.tranvia, w.fabrica, w.campo.phr, w.radio, w.gallina, w.vaca, w.caballo, w.arbol, w.flor, w.estrella]
    sentences:
      - { es: "Mi ciudad ha cambiado mucho: antes había tranvías.", en: "My city has changed a lot: before there were trams.", grammar: [g.imperfect], vocab: [w.cambiar.phr, w.tranvia] }
      - { es: "Mi abuelo trabajaba en una fábrica de coches.", en: "My grandfather worked in a car factory.", grammar: [g.imperfect-uses], vocab: [w.fabrica, w.trabajar] }
      - { es: "En el campo no había luz eléctrica.", en: "In the countryside there was no electric light.", grammar: [g.imperfect], vocab: [w.campo.phr, w.luz] }
      - { es: "Por la noche escuchábamos la radio.", en: "At night we listened to the radio.", altEs: ["Por las noches escuchábamos la radio.", "De noche escuchábamos la radio."], grammar: [g.imperfect-uses], vocab: [w.radio, w.escuchar] }
      - { es: "Mis abuelos tenían gallinas, dos vacas y un caballo.", en: "My grandparents had hens, two cows and a horse.", altEs: ["Mis abuelos tenían gallinas, un caballo y dos vacas."], grammar: [g.imperfect-uses], vocab: [w.gallina, w.vaca, w.caballo] }
      - { es: "Delante de la casa había un árbol enorme.", en: "In front of the house there was a huge tree.", altEs: ["Delante de la casa había un árbol muy grande."], grammar: [g.imperfect], vocab: [w.arbol, w.delante] }
      - { es: "Mi madre cultivaba flores en el jardín.", en: "My mother grew flowers in the garden.", grammar: [g.imperfect-uses], vocab: [w.flor, w.jardin] }
      - { es: "Por la noche veíamos muchas estrellas.", en: "At night we saw lots of stars.", altEs: ["De noche veíamos muchas estrellas."], grammar: [g.imperfect-uses], vocab: [w.estrella, w.ver] }
      - { es: "La gente no tenía móvil y escribía cartas.", en: "People didn't have mobile phones and wrote letters.", altEs: ["La gente no tenía teléfono móvil y escribía cartas."], grammar: [g.imperfect-uses], vocab: [w.movil, w.escribir] }
      - { es: "Las tiendas cerraban a mediodía.", en: "Shops closed at noon.", altEs: ["Las tiendas cerraban al mediodía."], grammar: [g.imperfect-uses], vocab: [w.cerrar, w.mediodia] }
      - { es: "Entonces los niños jugaban en la calle hasta la noche.", en: "Back then children played in the street until nightfall.", altEs: ["En aquella época los niños jugaban en la calle hasta la noche."], grammar: [g.imperfect-uses], vocab: [w.entonces, w.jugar] }
      - { es: "Mis padres se conocían desde el colegio.", en: "My parents had known each other since school.", grammar: [g.imperfect-uses], vocab: [w.conocer, w.colegio] }
