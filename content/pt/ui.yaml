# Interface text in the target language (keys are fixed; values are per course).
# `{word}`, `{region}` and `{language}` are placeholders filled in by the app.
appName: Pawsport
tagline: Portuguese, one stamp at a time
welcome:
  title: Leo, Bonchita and Luna are off to Brazil
  intro: Three small dogs, one enormous country, and only you can talk to the locals. Luna has the map, Leo has the ball, Bonchita has the appetite (pão de queijo, mostly). Every unit is a stop on the road from the beaches of Rio to the rivers of the Amazon, with one last crossing of the Atlantic to Portugal. Where should the journey start? Everything is open; this just marks the first stop.
  firstStop: "Land in Rio de Janeiro: A1, lesson 1."
greetings: { morning: Bom dia, afternoon: Boa tarde, evening: Boa noite }
feedback: { correct: Isso aí!, almost: Quase!, goalDone: Mandou bem! }
stampEarned: Carimbo conquistado!
spicyName: Modo picante
games: { name: Palavras, memory: Memória, rapid: Rápido, crossword: Palavras cruzadas, listen: Escute, soundMatch: Combine os sons, win: Conseguiu! }
dogsPage: Os cachorros
quizGreat: Muito bem!
whatDoesItMean: O que significa “{word}”?
badgeName: insígnia de {region}
typePlaceholder: Escreva em português
voiceTest: Olá, tudo bem? Somos Leo, Bonchita e Luna e vamos te ajudar com o português.
voiceHelp: No Portuguese voice installed. On Windows add “Portuguese (Brazil)” speech in Settings → Time & Language → Speech; on Android install Speech Services by Google and download Portuguese (Brazil); iOS and macOS include Luciana and Felipe (Settings → Accessibility → Spoken Content → Voices).
pronunciationIntro: Portuguese spelling is regular once you know a handful of rules, but the sounds are rich. Learn the nasal vowels, the open and closed e and o, and the r that changes from Rio to Lisbon, and you can read anything aloud.
cheers:
  - { es: "Isso aí!", en: "That's it!" }
  - { es: "Mandou bem!", en: "Nailed it!" }
  - { es: "Arrasou!", en: "You smashed it!" }
  - { es: "Show de bola!", en: "Brilliant!" }
  - { es: "Que demais!", en: "How awesome!" }
  - { es: "Boa!", en: "Nice one!" }
  - { es: "Tá voando!", en: "You're flying!" }
  - { es: "Sensacional!", en: "Sensational!" }
