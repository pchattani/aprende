id: r.b1.sur-les-pas-de-van-gogh
level: b1
title: Arles, sur les pas de Van Gogh
kind: text
intro: The story of the fifteen months Vincent van Gogh spent in Arles, told the way a guide tells it on a walking tour. Notice how the plus-que-parfait (il avait quitté, il était arrivé) takes us further back in the past.
allow: [vincent, gauguin, paul, théo, lamartine, forum, saint-rémy, ok, centre]
paragraphs:
  - { es: "Quand Vincent van Gogh est descendu du train à Arles, le 20 février 1888, il a eu une surprise : il neigeait. Il avait quitté Paris parce qu'il cherchait la lumière et les couleurs du Sud, et il trouvait de la neige ! Il avait trente-quatre ans. Il avait déjà essayé plusieurs métiers – vendeur de tableaux, professeur, prédicateur – et il ne peignait que depuis huit ans. Personne ne le connaissait.", en: "When Vincent van Gogh got off the train in Arles on 20 February 1888, he had a surprise: it was snowing. He had left Paris because he was looking for the light and colours of the South, and he found snow! He was thirty-four. He had already tried several jobs – art dealer, teacher, preacher – and he had only been painting for eight years. Nobody knew him." }
  - { es: "Mais le printemps est vite arrivé, et avec lui les arbres en fleurs. Van Gogh a peint comme un fou : les vergers, les champs de blé, les barques sur la plage des Saintes-Maries-de-la-Mer, le pont de Langlois. En quinze mois, il a réalisé environ deux cents tableaux. Il écrivait presque chaque jour à son frère Théo, qui lui envoyait de l'argent depuis Paris. Grâce à ces lettres, on sait ce qu'il pensait, ce qu'il mangeait, et même la couleur de ses rêves.", en: "But spring soon arrived, and with it the trees in blossom. Van Gogh painted like a madman: orchards, wheat fields, boats on the beach at Saintes-Maries-de-la-Mer, the Langlois bridge. In fifteen months he produced about two hundred paintings. He wrote almost every day to his brother Théo, who sent him money from Paris. Thanks to these letters, we know what he was thinking, what he ate, and even the colour of his dreams." }
  - { es: "En mai, il a loué quatre pièces dans une maison de la place Lamartine : la fameuse Maison jaune. Il avait un projet : il voulait créer un « atelier du Midi », où des peintres vivraient et travailleraient ensemble. Il avait invité son ami Paul Gauguin, qui est finalement arrivé en octobre. Van Gogh avait préparé sa chambre avec soin et l'avait décorée avec des tableaux de tournesols.", en: "In May he rented four rooms in a house on the Place Lamartine: the famous Yellow House. He had a plan: he wanted to create a 'studio of the South', where painters would live and work together. He had invited his friend Paul Gauguin, who finally arrived in October. Van Gogh had prepared his room carefully and had decorated it with paintings of sunflowers." }
  - { es: "Mais les deux hommes étaient très différents, et ils se disputaient souvent. Le 23 décembre, après une dispute violente, Van Gogh s'est coupé une partie de l'oreille. Gauguin, qui avait eu peur, est reparti à Paris quelques jours plus tard. Van Gogh a été soigné à l'hôpital de la ville. Pendant les mois suivants, il a eu d'autres crises, et des habitants qui avaient peur de lui ont même signé une pétition contre lui. En mai 1889, il a quitté Arles pour l'hôpital de Saint-Rémy-de-Provence, de sa propre volonté.", en: "But the two men were very different and they argued often. On 23 December, after a violent quarrel, Van Gogh cut off part of his ear. Gauguin, who had been frightened, went back to Paris a few days later. Van Gogh was treated at the town hospital. In the following months he had other crises, and some residents who were afraid of him even signed a petition against him. In May 1889 he left Arles for the hospital at Saint-Rémy-de-Provence, of his own free will." }
  - { es: "Aujourd'hui, la ville qui l'avait rejeté est fière de lui. On peut suivre ses pas grâce à des panneaux qui montrent ses tableaux à l'endroit exact où il les avait peints. Le café de la place du Forum, qu'il avait peint la nuit sous un ciel plein d'étoiles, est toujours jaune. La cour de l'ancien hôpital, avec son jardin, ressemble encore à son tableau. La Maison jaune, en revanche, n'existe plus : elle a été détruite pendant la guerre, en 1944.", en: "Today the town that had rejected him is proud of him. You can follow in his footsteps thanks to signs showing his paintings at the exact spot where he had painted them. The café on the Place du Forum, which he had painted at night under a sky full of stars, is still yellow. The courtyard of the old hospital, with its garden, still looks like his painting. The Yellow House, on the other hand, no longer exists: it was destroyed during the war, in 1944." }
  - { es: "Arles n'est pas seulement la ville de Van Gogh. Les Romains y avaient construit, il y a presque deux mille ans, des arènes où on organise encore des spectacles. Et chaque été, la ville accueille un grand festival de photographie. Mais quand on s'assoit le soir à la terrasse du café jaune, on ne peut pas s'empêcher de penser à ce peintre qui n'avait presque rien vendu de son vivant, et dont les tableaux valent aujourd'hui des millions.", en: "Arles isn't only Van Gogh's town. The Romans had built an arena there almost two thousand years ago, where shows are still held. And every summer the town hosts a big photography festival. But when you sit on the terrace of the yellow café in the evening, you can't help thinking of the painter who had sold almost nothing in his lifetime, and whose paintings are worth millions today." }
questions:
  - { q: "Quelle surprise Van Gogh a-t-il eue en arrivant à Arles ?", options: ["Il faisait très chaud", "Il neigeait", "Gauguin l'attendait"], answer: 1, explain: "«Il a eu une surprise : il neigeait.» He had come looking for light and colour." }
  - { q: "Comment Van Gogh vivait-il financièrement ?", options: ["Il vendait beaucoup de tableaux", "Son frère Théo lui envoyait de l'argent", "Il travaillait dans un café"], answer: 1, explain: "«Son frère Théo, qui lui envoyait de l'argent depuis Paris.»" }
  - { q: "Quel était le projet de Van Gogh dans la Maison jaune ?", options: ["Ouvrir un café", "Créer un atelier où des peintres vivraient ensemble", "Vendre des tableaux aux touristes"], answer: 1, explain: "«Il voulait créer un atelier du Midi, où des peintres vivraient et travailleraient ensemble.»" }
  - { q: "Que s'est-il passé le 23 décembre 1888 ?", options: ["Gauguin est arrivé", "Van Gogh s'est coupé une partie de l'oreille", "La Maison jaune a été détruite"], answer: 1, explain: "After a violent quarrel with Gauguin, «Van Gogh s'est coupé une partie de l'oreille»." }
  - { q: "« Il avait quitté Paris parce qu'il cherchait la lumière. » Pourquoi le plus-que-parfait ?", options: ["L'action se passe dans le futur", "Il a quitté Paris avant d'arriver à Arles", "C'est une habitude"], answer: 1, explain: "The plus-que-parfait shows an action earlier than another past action: he left Paris before arriving in Arles." }
