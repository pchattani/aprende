id: b2.u03
title: Lamentos y reproches
lessons:
  - id: b2.u03.l1
    title: ¿Qué habrías hecho tú?
    teach: [g.conditional-perfect]
    vocab: [w.ruptura, w.romper-con, w.reconciliarse, w.reconciliacion, w.ex, w.echar-de-menos, w.infiel, w.infidelidad, w.fiel, w.lealtad, w.comprensivo, w.comprension, w.convivir, w.convivencia, w.pelea, w.desconfianza, w.sinceramente, w.dilema, w.rencor, w.guardar-rencor, w.ceder, w.tonto, w.incomodo]
    tip: "habría, habrías, habría, habríamos, habríais, habrían + participle = would have. Yo no habría hecho eso. Me habría gustado verte."
    sentences:
      - { es: "¿Qué habrías hecho tú en mi lugar? ¿La habrías perdonado?", en: "What would you have done in my place? Would you have forgiven her?", altEs: ["¿Tú qué habrías hecho en mi lugar? ¿La habrías perdonado?"], grammar: [g.conditional-perfect], vocab: [w.perdonar, w.en-tu-lugar] }
      - { es: "Yo no habría roto con él por una discusión tan tonta.", en: "I wouldn't have broken up with him over such a silly argument.", altEn: ["I wouldn't have split up with him over such a stupid argument."], grammar: [g.conditional-perfect], vocab: [w.romper-con, w.tonto, w.discusion] }
      - { es: "Sin la ayuda de mis amigos no habría superado la ruptura.", en: "Without my friends' help I wouldn't have got over the break-up.", grammar: [g.conditional-perfect], vocab: [w.ruptura, w.superar, w.ayuda] }
      - { es: "Habría sido más fácil reconciliarse si los dos hubieran cedido un poco.", en: "It would have been easier to make up if both of them had given in a little.", altEs: ["Habría sido más fácil reconciliarse si los dos hubiesen cedido un poco."], grammar: [g.conditional-perfect, g.si-clauses-past], vocab: [w.reconciliarse, w.ceder, w.facil] }
      - { es: "Me habría gustado conocer a tu abuela; dicen que era muy comprensiva.", en: "I would have liked to meet your grandmother; they say she was very understanding.", grammar: [g.conditional-perfect], vocab: [w.comprensivo, w.abuela, w.gustar] }
      - { es: "A esas horas ya se habrían dormido; por eso no contestaron.", en: "At that time they would already have fallen asleep; that's why they didn't answer.", grammar: [g.conditional-perfect, g.future-conditional-probability], vocab: [w.dormir, w.contestar, w.deber.plan], note: "The conditional perfect also guesses about the remote past." }
      - { es: "Mi ex dijo que para el verano ya habría encontrado piso, y sigue en casa de sus padres.", en: "My ex said that by summer she would have found a flat, and she's still at her parents'.", grammar: [g.conditional-perfect, g.reported-speech-past], vocab: [w.ex, w.piso, w.verano], note: "Reported future perfect: habré encontrado → habría encontrado." }
      - { es: "Con un poco más de confianza, la convivencia habría sido mucho mejor.", en: "With a little more trust, living together would have been much better.", grammar: [g.conditional-perfect], vocab: [w.convivencia, w.confianza] }
      - { es: "Yo nunca habría guardado rencor durante tanto tiempo; la vida es corta.", en: "I would never have borne a grudge for so long; life is short.", altEs: ["Yo nunca habría guardado rencor tanto tiempo; la vida es corta."], grammar: [g.conditional-perfect], vocab: [w.guardar-rencor, w.rencor, w.vida] }
      - { es: "¿Le habrías contado la infidelidad a tu mejor amiga? — Sinceramente, no habría sabido qué hacer.", en: "Would you have told your best friend about the infidelity? — Honestly, I wouldn't have known what to do.", grammar: [g.conditional-perfect], vocab: [w.infidelidad, w.sinceramente, w.contar] }
      - { es: "Habría sido mejor hablar antes de la pelea, no después.", en: "It would have been better to talk before the fight, not after.", grammar: [g.conditional-perfect], vocab: [w.pelea, w.hablar, w.mejor] }
      - { es: "Echaba tanto de menos a su familia que, sin el trabajo, habría vuelto a Sevilla.", en: "She missed her family so much that, without the job, she would have gone back to Seville.", grammar: [g.conditional-perfect], vocab: [w.echar-de-menos, w.familia, w.volver] }
      - { es: "Habría jurado que eras fiel, pero me equivoqué: la desconfianza tenía razón.", en: "I would have sworn you were faithful, but I was wrong: the distrust was right.", grammar: [g.conditional-perfect], vocab: [w.fiel, w.desconfianza, w.jurar, w.equivocarse] }
      - { es: "Es un dilema: la lealtad a mi hermano o la verdad. ¿Tú qué habrías elegido?", en: "It's a dilemma: loyalty to my brother or the truth. What would you have chosen?", grammar: [g.conditional-perfect], vocab: [w.dilema, w.lealtad, w.elegir] }
      - { es: "Yo no habría dicho eso.", en: "I wouldn't have said that.", grammar: [g.conditional-perfect], vocab: [w.decir], error: { wrong: "Yo no habría decido eso.", explain: "The participle of decir is irregular: dicho. habría + dicho.", grammar: g.conditional-perfect } }
      - { es: "No me llamaste, así que no fui a la fiesta.", en: "You didn't call me, so I didn't go to the party.", grammar: [g.conditional-perfect, g.narration-connectors], vocab: [w.llamar, w.fiesta], transform: { instruction: "Express the unreal result with the conditional perfect (Si me hubieras llamado…)", answer: "Si me hubieras llamado, habría ido a la fiesta.", alt: ["Si me hubieses llamado, habría ido a la fiesta.", "Si me hubieras llamado, hubiera ido a la fiesta."] } }
    exchanges:
      - q: { es: "¿Tú qué habrías hecho con el mensaje de su ex?", en: "What would you have done about the message from his ex?" }
        a: { es: "Yo habría hablado con él directamente, sin gritos.", en: "I would have talked to him directly, without shouting." }
        alt: ["Habría hablado con él directamente.", "Yo no habría leído el mensaje, para empezar."]
        grammar: [g.conditional-perfect]
        vocab: [w.ex, w.mensaje, w.directamente, w.grito]
      - q: { es: "¿Crees que habrían seguido juntos si hubieran vivido en la misma ciudad?", en: "Do you think they would have stayed together if they had lived in the same city?" }
        a: { es: "Puede ser; la convivencia habría sido otra cosa.", en: "Maybe; living together would have been a different matter." }
        alt: ["Puede ser.", "No lo creo; el problema no era la distancia."]
        grammar: [g.conditional-perfect]
        vocab: [w.convivencia, w.juntos]
      - q: { es: "Al final no fui a la boda de mi ex.", en: "In the end I didn't go to my ex's wedding." }
        a: { es: "Yo tampoco habría ido; habría sido muy incómodo.", en: "I wouldn't have gone either; it would have been very awkward." }
        alt: ["Yo tampoco habría ido.", "Hiciste bien; habría sido incómodo para todos."]
        grammar: [g.conditional-perfect]
        vocab: [w.incomodo, w.boda]
      - q: { es: "¿Por qué no le pediste perdón?", en: "Why didn't you say sorry to him?" }
        a: { es: "Por orgullo. Habría sido lo más fácil, pero no pude.", en: "Out of pride. It would have been the easiest thing, but I couldn't." }
        alt: ["Por orgullo; habría sido lo más fácil.", "Porque yo no tenía la culpa."]
        grammar: [g.conditional-perfect]
        vocab: [w.orgullo, w.pedir-perdon]
    texts:
      - title: "Consultorio sentimental"
        es: ["Querida Marina: mi pareja me ha sido infiel y no sé si perdonarla.", "¿Qué habrías hecho tú?", "Un lector dolido.", "Respuesta: yo no habría decidido nada en caliente; date tiempo."]
        en: ["Dear Marina: my partner has been unfaithful to me and I don't know whether to forgive her.", "What would you have done?", "A hurt reader.", "Answer: I wouldn't have decided anything in the heat of the moment; give yourself time."]
        grammar: [g.conditional-perfect]
        vocab: [w.infiel, w.perdonar, w.lector]
  - id: b2.u03.l2
    title: Ojalá hubiera dicho la verdad
    teach: [g.ojala-pluperfect]
    vocab: [w.arrepentimiento, w.arrepentirse-de, w.remordimiento, w.sentirse-culpable, w.reprochar, w.reproche, w.meter-la-pata, w.metedura-de-pata, w.ingenuo, w.impulsivo, w.precipitarse, w.pensarselo-dos-veces, w.volver-atras, w.equivocacion, w.fallo, w.fallar, w.en-caliente, w.leccion, w.advertir, w.valor, w.sufrir, w.salvo, w.amistad, w.borrar]
    tip: "Regret in three shapes: Ojalá hubiera dicho la verdad. Me arrepiento de haber mentido. Tendría que haber escuchado."
    sentences:
      - { es: "Ojalá hubiera dicho la verdad desde el principio.", en: "I wish I had told the truth from the start.", altEs: ["Ojalá hubiese dicho la verdad desde el principio."], altEn: ["If only I had told the truth from the start."], grammar: [g.ojala-pluperfect, g.subjunctive-pluperfect], vocab: [w.verdad, w.al-principio] }
      - { es: "Me arrepiento de haber vendido el piso de mis abuelos.", en: "I regret having sold my grandparents' flat.", altEn: ["I regret selling my grandparents' flat."], grammar: [g.ojala-pluperfect], vocab: [w.arrepentirse-de, w.vender, w.piso] }
      - { es: "Tendría que haber escuchado a mi madre; ella ya me lo advirtió.", en: "I should have listened to my mother; she had already warned me.", altEs: ["Debería haber escuchado a mi madre; ella ya me lo advirtió."], grammar: [g.ojala-pluperfect, g.deber-haber], vocab: [w.advertir, w.escuchar, w.madre] }
      - { es: "¡Qué metedura de pata! Ojalá no hubiera mandado ese correo a toda la oficina.", en: "What a blunder! I wish I hadn't sent that email to the whole office.", altEs: ["¡Qué metedura de pata! Ojalá no hubiese mandado ese correo a toda la oficina."], grammar: [g.ojala-pluperfect], vocab: [w.metedura-de-pata, w.correo, w.oficina] }
      - { es: "Debería habérmelo pensado dos veces antes de dejar el trabajo; me precipité.", en: "I should have thought twice before leaving my job; I rushed into it.", grammar: [g.ojala-pluperfect, g.deber-haber], vocab: [w.pensarselo-dos-veces, w.precipitarse, w.trabajo] }
      - { es: "Si pudiera volver atrás, no habría sido tan ingenuo con aquella oferta.", en: "If I could turn back the clock, I wouldn't have been so naive about that offer.", altEs: ["Si pudiese volver atrás, no habría sido tan ingenuo con aquella oferta."], grammar: [g.ojala-pluperfect, g.si-clauses-unreal], vocab: [w.volver-atras, w.ingenuo, w.oferta] }
      - { es: "Ojalá tuviera el valor de pedirle perdón.", en: "If only I had the courage to apologise to him.", altEs: ["Ojalá tuviese el valor de pedirle perdón."], grammar: [g.ojala-pluperfect, g.subjunctive-imperfect], vocab: [w.valor, w.pedir-perdon], note: "Ojalá + imperfect subjunctive: an unlikely present wish." }
      - { es: "Se siente culpable por no haber llamado a su padre aquella noche.", en: "He feels guilty for not having called his father that night.", grammar: [g.ojala-pluperfect], vocab: [w.sentirse-culpable, w.llamar, w.padre] }
      - { es: "Fue impulsivo y ahora sufre los remordimientos; no deja de reprocharse el fallo.", en: "He was impulsive and now suffers the remorse; he keeps reproaching himself for the mistake.", grammar: [g.ojala-pluperfect, g.verbal-periphrases], vocab: [w.impulsivo, w.sufrir, w.remordimiento, w.reprochar, w.fallo] }
      - { es: "No me arrepiento de nada, salvo de no haber viajado más.", en: "I regret nothing, except not having travelled more.", altEs: ["No me arrepiento de nada, excepto de no haber viajado más."], grammar: [g.ojala-pluperfect], vocab: [w.salvo, w.arrepentirse-de, w.viajar] }
      - { es: "Ojalá hubiéramos aprendido la lección la primera vez.", en: "I wish we had learnt the lesson the first time.", altEs: ["Ojalá hubiésemos aprendido la lección la primera vez."], grammar: [g.ojala-pluperfect], vocab: [w.leccion, w.aprender] }
      - { es: "No tendrías que haber contestado en caliente; ahora él no quiere hablar contigo.", en: "You shouldn't have answered in the heat of the moment; now he doesn't want to talk to you.", altEs: ["No deberías haber contestado en caliente; ahora él no quiere hablar contigo."], grammar: [g.ojala-pluperfect, g.deber-haber], vocab: [w.en-caliente, w.contestar] }
      - { es: "El reproche de su hermana le dolió: «Ojalá hubieras estado aquí».", en: "His sister's reproach hurt him: 'I wish you had been here.'", altEs: ["El reproche de su hermana le dolió: «Ojalá hubieses estado aquí»."], grammar: [g.ojala-pluperfect], vocab: [w.reproche, w.doler, w.hermana] }
      - { es: "Me arrepiento de haberme precipitado; la equivocación me costó una amistad.", en: "I regret having rushed; the mistake cost me a friendship.", grammar: [g.ojala-pluperfect], vocab: [w.precipitarse, w.equivocacion, w.amistad, w.costar] }
      - { es: "Ojalá hubiera estudiado más.", en: "I wish I had studied more.", altEs: ["Ojalá hubiese estudiado más."], grammar: [g.ojala-pluperfect], vocab: [w.estudiar, w.ojala], error: { wrong: "Ojalá habría estudiado más.", explain: "ojalá always takes the subjunctive; for a past regret, the pluperfect subjunctive: hubiera estudiado.", grammar: g.ojala-pluperfect } }
      - { es: "No le dije la verdad y ahora lo lamento.", en: "I didn't tell him the truth and now I regret it.", grammar: [g.ojala-pluperfect], vocab: [w.verdad, w.lamentar], transform: { instruction: "Express the regret with Ojalá", answer: "Ojalá le hubiera dicho la verdad.", alt: ["Ojalá le hubiese dicho la verdad."] } }
    exchanges:
      - q: { es: "¿Tienes algún arrepentimiento?", en: "Do you have any regrets?" }
        a: { es: "Sí: no haber viajado más cuando era joven.", en: "Yes: not having travelled more when I was young." }
        alt: ["Ojalá hubiera viajado más cuando era joven.", "Ninguno, la verdad."]
        grammar: [g.ojala-pluperfect]
        vocab: [w.arrepentimiento, w.viajar]
      - q: { es: "Metí la pata con el jefe.", en: "I put my foot in it with the boss." }
        a: { es: "Deberías haberte callado; a veces es lo mejor.", en: "You should have kept quiet; sometimes it's the best thing." }
        alt: ["Tendrías que haberte callado.", "No es para tanto; mañana se le habrá olvidado."]
        grammar: [g.ojala-pluperfect, g.deber-haber]
        vocab: [w.meter-la-pata, w.callarse]
      - q: { es: "¿Por qué estás tan callado?", en: "Why are you so quiet?" }
        a: { es: "Ojalá no hubiera dicho lo que dije anoche.", en: "I wish I hadn't said what I said last night." }
        alt: ["Ojalá no hubiese dicho lo que dije anoche.", "Me arrepiento de lo que dije anoche."]
        grammar: [g.ojala-pluperfect]
        vocab: [w.callado, w.anoche]
      - q: { es: "Perdí el tren por cinco minutos.", en: "I missed the train by five minutes." }
        a: { es: "Tendrías que haber salido antes, como te dije.", en: "You should have left earlier, as I told you." }
        alt: ["Deberías haber salido antes.", "Vaya, qué mala suerte."]
        grammar: [g.ojala-pluperfect, g.deber-haber]
        vocab: [w.tren, w.perder]
    texts:
      - title: "Nota de disculpa"
        es: ["Marta, siento mucho lo de ayer.", "No tendría que haber contestado en caliente.", "Ojalá pudiera borrar esas palabras.", "¿Hablamos esta tarde?"]
        en: ["Marta, I'm very sorry about yesterday.", "I shouldn't have answered in the heat of the moment.", "I wish I could erase those words.", "Shall we talk this afternoon?"]
        grammar: [g.ojala-pluperfect]
        vocab: [w.en-caliente, w.borrar]
      - title: "Entrada de diario"
        es: ["Hoy me he dado cuenta de mi error.", "Debería haber escuchado a Lucía desde el principio.", "Mañana le pediré perdón, aunque es tarde."]
        en: ["Today I realised my mistake.", "I should have listened to Lucía from the start.", "Tomorrow I'll apologise to her, although it's late."]
        grammar: [g.ojala-pluperfect, g.deber-haber]
        vocab: [w.darse-cuenta, w.error]
  - id: b2.u03.l3
    title: Deberías haber llamado
    teach: [g.deber-haber]
    vocab: [w.excusa, w.pretexto, w.reganar, w.bronca, w.echar-la-bronca, w.impuntual, w.puntualidad, w.descuidado, w.irresponsable, w.tener-la-culpa, w.no-es-para-tanto, w.sentido-del-humor, w.ironia, w.ironico, w.sarcastico, w.chiste, w.gracioso, w.tener-gracia, w.carcajada, w.dar-planton, w.colarse, w.despiste, w.no-pegar-ojo, w.mio, w.tuyo, w.suyo]
    tip: "Modal + haber + participle looks back: deberías haber llamado (should have), podrías haber avisado (could have), tenías que haberlo dicho (ought to have). Pronouns attach to haber: habérmelo dicho."
    sentences:
      - { es: "Deberías haber llamado para avisar; llevamos una hora esperándote.", en: "You should have called to let us know; we've been waiting for you for an hour.", altEs: ["Tendrías que haber llamado para avisar; llevamos una hora esperándote."], grammar: [g.deber-haber, g.verbal-periphrases], vocab: [w.avisar, w.esperar] }
      - { es: "Podrías habérmelo dicho antes, ¿no? Ahora ya es tarde.", en: "You could have told me earlier, couldn't you? Now it's too late.", grammar: [g.deber-haber, g.pronoun-placement], vocab: [w.decir, w.tarde], note: "Pronouns attach to haber: habérmelo." }
      - { es: "Tenías que haber salido de casa a las siete; eres un impuntual.", en: "You ought to have left the house at seven; you're always late.", grammar: [g.deber-haber], vocab: [w.impuntual, w.salir] }
      - { es: "No deberíais haber reído tan fuerte en la reunión… aunque el chiste tenía gracia.", en: "You shouldn't have laughed so loudly in the meeting… although the joke was funny.", grammar: [g.deber-haber], vocab: [w.chiste, w.tener-gracia, w.reir, w.reunion] }
      - { es: "Debe de haber perdido el autobús; si no, ya habría llegado.", en: "He must have missed the bus; otherwise he would already have arrived.", grammar: [g.deber-haber, g.deber-de], vocab: [w.autobus, w.perder, w.llegar], note: "debe de haber + participle = must have (probability)." }
      - { es: "No es para tanto: no tendrías que haberle echado la bronca a tu hermano por un despiste.", en: "It's no big deal: you shouldn't have told your brother off over a slip.", grammar: [g.deber-haber], vocab: [w.no-es-para-tanto, w.echar-la-bronca, w.despiste] }
      - { es: "¿No podrías haber inventado una excusa mejor que «se me durmió el móvil»?", en: "Couldn't you have come up with a better excuse than 'my phone fell asleep'?", grammar: [g.deber-haber], vocab: [w.excusa, w.inventar, w.movil] }
      - { es: "Tenía que haber sido más responsable con las llaves; la culpa es mía.", en: "I ought to have been more responsible with the keys; it's my fault.", altEs: ["Tendría que haber sido más responsable con las llaves; la culpa es mía."], grammar: [g.deber-haber], vocab: [w.responsable, w.llave, w.culpa, w.mio] }
      - { es: "El jefe me regañó delante de todos; podría haber esperado a que estuviéramos solos.", en: "The boss told me off in front of everyone; he could have waited until we were alone.", altEs: ["El jefe me regañó delante de todos; podría haber esperado a que estuviésemos solos."], grammar: [g.deber-haber, g.subjunctive-imperfect], vocab: [w.reganar, w.esperar, w.solo] }
      - { es: "Deberían haber puesto el chiste al final de la presentación, no al principio; nadie se rio.", en: "They should have put the joke at the end of the presentation, not at the beginning; nobody laughed.", grammar: [g.deber-haber], vocab: [w.chiste, w.presentacion, w.al-final] }
      - { es: "No tenías que haberte colado; la gente llevaba media hora en la cola.", en: "You shouldn't have jumped the queue; people had been queuing for half an hour.", grammar: [g.deber-haber], vocab: [w.colarse, w.cola, w.gente] }
      - { es: "Con ese tono sarcástico no debería haber esperado una carcajada, sino una bronca.", en: "With that sarcastic tone he shouldn't have expected a burst of laughter, but a telling-off.", grammar: [g.deber-haber], vocab: [w.sarcastico, w.carcajada, w.bronca, w.tono] }
      - { es: "Podríamos haber ganado si no hubiéramos sido tan descuidados en el último minuto.", en: "We could have won if we hadn't been so careless in the last minute.", altEs: ["Podríamos haber ganado si no hubiésemos sido tan descuidados en el último minuto."], grammar: [g.deber-haber, g.si-clauses-past], vocab: [w.descuidado, w.ganar, w.minuto] }
      - { es: "Es irresponsable, pero tiene sentido del humor: convierte cada pretexto en ironía.", en: "He's irresponsible, but he has a sense of humour: he turns every pretext into irony.", grammar: [g.deber-haber], vocab: [w.irresponsable, w.sentido-del-humor, w.pretexto, w.ironia] }
      - { es: "Deberías haber venido a la fiesta.", en: "You should have come to the party.", altEs: ["Tendrías que haber venido a la fiesta."], grammar: [g.deber-haber], vocab: [w.venir, w.fiesta], error: { wrong: "Deberías haber venir a la fiesta.", explain: "After haber comes the participle, never the infinitive: haber venido.", grammar: g.deber-haber } }
      - { es: "No llamaste y tu madre se preocupó.", en: "You didn't call and your mother got worried.", grammar: [g.deber-haber], vocab: [w.llamar, w.preocuparse], transform: { instruction: "Make a reproach with deber + haber", answer: "Deberías haber llamado.", alt: ["Tendrías que haber llamado.", "Deberías haber llamado a tu madre."] } }
    exchanges:
      - q: { es: "Perdona el retraso, es que había mucho tráfico.", en: "Sorry I'm late, there was a lot of traffic." }
        a: { es: "Podrías haber avisado; llevo media hora aquí.", en: "You could have let me know; I've been here half an hour." }
        alt: ["Podrías haber avisado.", "Deberías haber salido antes; siempre hay tráfico."]
        grammar: [g.deber-haber]
        vocab: [w.retraso, w.avisar]
      - q: { es: "Se me olvidó tu cumpleaños.", en: "I forgot your birthday." }
        a: { es: "Ya lo sé. Deberías haberlo apuntado en el móvil, como todo el mundo.", en: "I know. You should have noted it on your phone, like everyone else." }
        alt: ["Deberías haberlo apuntado en el móvil.", "No pasa nada, no es para tanto."]
        grammar: [g.deber-haber]
        vocab: [w.cumpleanos, w.movil]
      - q: { es: "Me regañó el jefe por el informe.", en: "The boss told me off about the report." }
        a: { es: "Tenías que haberlo revisado antes de enviarlo.", en: "You ought to have checked it before sending it." }
        alt: ["Deberías haberlo revisado antes de enviarlo.", "¿Y qué excusa le pusiste?"]
        grammar: [g.deber-haber]
        vocab: [w.reganar, w.informe, w.revisar]
      - q: { es: "No me hizo gracia su chiste sobre mi edad.", en: "I didn't find his joke about my age funny." }
        a: { es: "A mí tampoco; no debería haberlo contado delante de todos.", en: "Me neither; he shouldn't have told it in front of everyone." }
        alt: ["No debería haberlo contado delante de todos.", "Bueno, un poco de sentido del humor…"]
        grammar: [g.deber-haber]
        vocab: [w.tener-gracia, w.chiste, w.edad]
      - q: { es: "Me dio plantón otra vez.", en: "He stood me up again." }
        a: { es: "No es para tanto, mujer; pero sí, podría haberte mandado un mensaje.", en: "It's not the end of the world; but yes, he could have sent you a message." }
        alt: ["Podría haberte mandado un mensaje.", "Pues deberías haberle echado la bronca."]
        grammar: [g.deber-haber]
        vocab: [w.dar-planton, w.no-es-para-tanto]
    texts:
      - title: "Mensaje de la madre"
        es: ["Hijo, llegaste a las tres de la mañana.", "Deberías haber avisado; tu padre no pegó ojo.", "Y no me pongas excusas: el móvil no se apaga solo."]
        en: ["Son, you got home at three in the morning.", "You should have let us know; your father didn't sleep a wink.", "And don't give me excuses: the phone doesn't switch itself off."]
        grammar: [g.deber-haber]
        vocab: [w.no-pegar-ojo, w.excusa]
  - id: b2.u03.l4
    title: Yo lo habría hecho de otra manera
    teach: [g.conditional-perfect]
    vocab: [w.asesino, w.asesinar, w.asesinato, w.coartada, w.venganza, w.vengarse, w.traicion, w.traicionar, w.heredero, w.testamento, w.complice, w.huida, w.deducir, w.deduccion, w.giro, w.desvelar, w.intriga, w.suspense, w.verosimil, w.inverosimil, w.mayordomo, w.veneno, w.disparo, w.disparar, w.cadaver, w.inspector, w.apostar]
    tip: "Three more uses of habría hecho: a guess about the remote past (Ya se habrían ido), a reported future perfect (Dijo que habría terminado) and a judgement about a story (Yo habría escrito otro final)."
    sentences:
      - { es: "El detective habría resuelto el caso antes si el mayordomo no hubiera mentido.", en: "The detective would have solved the case sooner if the butler hadn't lied.", altEs: ["El detective habría resuelto el caso antes si el mayordomo no hubiese mentido."], grammar: [g.conditional-perfect, g.si-clauses-past], vocab: [w.mayordomo, w.resolver, w.caso, w.mentir] }
      - { es: "Nadie habría sospechado del heredero: tenía la coartada perfecta.", en: "Nobody would have suspected the heir: he had the perfect alibi.", grammar: [g.conditional-perfect], vocab: [w.heredero, w.coartada, w.sospechar] }
      - { es: "¿Quién habría imaginado que la cómplice era la propia narradora?", en: "Who would have imagined that the accomplice was the narrator herself?", grammar: [g.conditional-perfect], vocab: [w.complice, w.narrador, w.imaginar] }
      - { es: "Serían las doce cuando ocurrió el asesinato; los vecinos ya se habrían acostado.", en: "It must have been twelve when the murder happened; the neighbours would already have gone to bed.", grammar: [g.conditional-perfect, g.future-conditional-probability], vocab: [w.asesinato, w.acostarse, w.vecino] }
      - { es: "La autora dijo que para el capítulo diez el lector ya habría deducido el final, pero yo no deduje nada.", en: "The author said that by chapter ten the reader would already have deduced the ending, but I didn't deduce anything.", grammar: [g.conditional-perfect, g.reported-speech-past], vocab: [w.deducir, w.autor, w.capitulo, w.lector] }
      - { es: "Habría jurado que el veneno estaba en el vino, y estaba en el café.", en: "I would have sworn the poison was in the wine, and it was in the coffee.", grammar: [g.conditional-perfect], vocab: [w.veneno, w.vino, w.cafe] }
      - { es: "Sin la traición de su hermano, el asesino habría huido del país sin problemas.", en: "Without his brother's betrayal, the murderer would have fled the country without any problems.", grammar: [g.conditional-perfect], vocab: [w.traicion, w.asesino, w.huir] }
      - { es: "Yo habría escrito un desenlace más verosímil; ese giro final es inverosímil.", en: "I would have written a more plausible ending; that final twist is far-fetched.", grammar: [g.conditional-perfect], vocab: [w.verosimil, w.giro, w.inverosimil, w.desenlace] }
      - { es: "Con ese testamento, cualquiera habría tenido motivos para la venganza.", en: "With that will, anyone would have had motives for revenge.", grammar: [g.conditional-perfect], vocab: [w.testamento, w.venganza, w.motivo] }
      - { es: "El inspector pensó que el disparo habría sonado hacia las doce de la noche.", en: "The inspector thought that the shot would have gone off around twelve at night.", grammar: [g.conditional-perfect], vocab: [w.inspector, w.disparo, w.sonar] }
      - { es: "La intriga habría funcionado mejor con menos personajes y más suspense.", en: "The intrigue would have worked better with fewer characters and more suspense.", grammar: [g.conditional-perfect], vocab: [w.intriga, w.suspense, w.personaje] }
      - { es: "La huida habría sido imposible sin un coche esperando en la esquina.", en: "The escape would have been impossible without a car waiting at the corner.", grammar: [g.conditional-perfect], vocab: [w.huida, w.imposible, w.esquina] }
      - { es: "Se vengó de quien la había traicionado; yo, en su lugar, habría llamado a la policía.", en: "She took revenge on the one who had betrayed her; in her place, I would have called the police.", grammar: [g.conditional-perfect, g.pluperfect], vocab: [w.vengarse, w.traicionar, w.policia] }
      - { es: "Encontraron el cadáver en la biblioteca; sin la deducción del inspector, nunca habrían desvelado quién disparó.", en: "They found the body in the library; without the inspector's deduction, they would never have revealed who fired.", grammar: [g.conditional-perfect], vocab: [w.cadaver, w.deduccion, w.desvelar, w.disparar] }
      - { es: "Yo no habría hecho eso.", en: "I wouldn't have done that.", grammar: [g.conditional-perfect], vocab: [w.hacer], error: { wrong: "Yo no había hecho eso.", explain: "había hecho = had done (pluperfect); would have done is the conditional perfect, habría hecho.", grammar: g.conditional-perfect } }
      - { es: "Dijo: «Habré terminado la novela para el viernes».", en: "She said: 'I will have finished the novel by Friday.'", grammar: [g.conditional-perfect, g.reported-speech-past], vocab: [w.terminar, w.novela, w.viernes], transform: { instruction: "Report it in the past (Dijo que…)", answer: "Dijo que habría terminado la novela para el viernes.", alt: ["Dijo que para el viernes habría terminado la novela."] } }
    exchanges:
      - q: { es: "¿Quién crees que lo hizo?", en: "Who do you think did it?" }
        a: { es: "Yo habría apostado por el heredero, pero tiene coartada.", en: "I would have bet on the heir, but he has an alibi." }
        alt: ["Habría apostado por el heredero.", "El mayordomo, como siempre."]
        grammar: [g.conditional-perfect]
        vocab: [w.apostar, w.heredero, w.coartada]
      - q: { es: "¿Te gustó el final?", en: "Did you like the ending?" }
        a: { es: "No; yo habría dejado libre al asesino, es más verosímil.", en: "No; I would have left the murderer free, it's more plausible." }
        alt: ["No; yo habría escrito otro final.", "Sí, el giro final me sorprendió."]
        grammar: [g.conditional-perfect]
        vocab: [w.asesino, w.verosimil, w.final]
      - q: { es: "¿Por qué no llamó a la policía la protagonista?", en: "Why didn't the protagonist call the police?" }
        a: { es: "Porque, según ella, nadie la habría creído.", en: "Because, according to her, nobody would have believed her." }
        alt: ["Porque nadie la habría creído.", "Porque la cómplice era policía."]
        grammar: [g.conditional-perfect]
        vocab: [w.protagonista, w.policia, w.creer]
      - q: { es: "El libro tiene seiscientas páginas.", en: "The book has six hundred pages." }
        a: { es: "Pues la autora habría podido contarlo en trescientas.", en: "Well, the author could have told it in three hundred." }
        alt: ["La autora habría podido contarlo en la mitad.", "Yo lo habría dejado en trescientas."]
        grammar: [g.conditional-perfect]
        vocab: [w.pagina, w.autor]
    texts:
      - title: "Contraportada"
        es: ["Una herencia, un testamento falso y tres sospechosos.", "Nadie habría imaginado quién estaba detrás de todo.", "El giro final te dejará sin palabras."]
        en: ["An inheritance, a fake will and three suspects.", "Nobody would have imagined who was behind it all.", "The final twist will leave you speechless."]
        grammar: [g.conditional-perfect]
        vocab: [w.testamento, w.herencia, w.giro]
      - title: "Comentario de un lector"
        es: ["Lo leí en dos noches.", "Habría preferido menos personajes, pero la intriga funciona.", "Cinco estrellas."]
        en: ["I read it in two nights.", "I would have preferred fewer characters, but the intrigue works.", "Five stars."]
        grammar: [g.conditional-perfect]
        vocab: [w.intriga, w.personaje]
dialogues:
  - id: b2.u03.d1
    title: La cena que salió mal
    context: Lucía and Pablo clear the table after a dinner party that went badly. They go over what they should have done differently.
    lines:
      - { speaker: Lucía, es: "Vaya desastre de cena. Deberíamos haber invitado a menos gente.", en: "What a disaster of a dinner. We should have invited fewer people." }
      - { speaker: Pablo, es: "Y yo no debería haber hecho el chiste sobre el novio de Carmen.", en: "And I shouldn't have made the joke about Carmen's boyfriend." }
      - { speaker: Lucía, es: "Desde luego. ¿Viste su cara? Podrías haberte callado por una vez.", en: "Certainly not. Did you see her face? You could have kept quiet for once." }
      - { speaker: Pablo, es: "Ya lo sé. Ojalá no hubiera abierto la boca. Me arrepiento de verdad.", en: "I know. I wish I hadn't opened my mouth. I really regret it." }
      - { speaker: Lucía, es: "Y Marcos tenía que haber avisado de que no come carne. ¡Nos habría ahorrado el segundo plato!", en: "And Marcos ought to have let us know that he doesn't eat meat. It would have saved us the main course!" }
      - { speaker: Pablo, es: "Bueno, no es para tanto. Dentro de un mes nos vamos a reír de todo esto.", en: "Well, it's no big deal. In a month we'll laugh about all this." }
      - { speaker: Lucía, es: "Puede ser. Pero yo en tu lugar llamaría mañana a Carmen y le pediría perdón.", en: "Maybe. But if I were you I'd call Carmen tomorrow and apologise." }
      - { speaker: Pablo, es: "Lo habría hecho esta noche, pero se fue sin despedirse.", en: "I would have done it tonight, but she left without saying goodbye." }
      - { speaker: Lucía, es: "Tendrías que haber salido detrás de ella.", en: "You should have gone out after her." }
      - { speaker: Pablo, es: "¿Con el postre en el horno? Habríamos tenido dos desastres en vez de uno.", en: "With the dessert in the oven? We'd have had two disasters instead of one." }
    questions:
      - { q: "What does Pablo regret?", options: ["Inviting too many people", "Making a joke about Carmen's boyfriend", "Burning the dessert"], answer: 1 }
      - { q: "What should Marcos have done?", options: ["Arrived earlier", "Brought wine", "Said that he doesn't eat meat"], answer: 2 }
      - { q: "What does Lucía advise Pablo to do?", options: ["Call Carmen tomorrow and apologise", "Forget about it", "Write Carmen a letter"], answer: 0 }
