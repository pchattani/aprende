id: b1.u05
title: "Penso che sia giusto"
lessons:
  - id: b1.u05.l1
    title: Credo che parta alle dieci
    teach: [g.congiuntivo-presente-forms]
    vocab: [w.esistere, w.senso, w.definire, w.finale, w.soluzione, w.riportare, w.patto, w.merito, w.affare, w.effetto, w.valore, w.interesse, w.attività, w.azione, w.regola, w.potere.n, w.forza, w.mente, w.pensiero, w.memoria, w.ruolo, w.complicato, w.complesso, w.concreto, w.preciso, w.reale, w.attuale, w.recente, w.particolare]
    tip: "-are verbs take -i (che parli), -ere and -ire verbs take -a (che prenda, che parta, che finisca). The three singular forms are the same, so add tu or lui when it isn't clear."
    sentences:
      - { es: "Penso che Marco parli un po' di dialetto.", en: "I think Marco speaks a bit of dialect.", altEs: ["Credo che Marco parli un po' di dialetto."], grammar: [g.congiuntivo-presente-forms, g.congiuntivo-opinion], vocab: [], error: { wrong: "Penso che Marco parla un po' di dialetto.", explain: "After penso che, use the congiuntivo: parli (-are verbs end in -i).", grammar: g.congiuntivo-presente-forms } }
      - { es: "Credo che il vaporetto parta ogni dieci minuti.", en: "I think the water bus leaves every ten minutes.", altEs: ["Penso che il vaporetto parta ogni dieci minuti."], grammar: [g.congiuntivo-presente-forms], vocab: [] }
      - { es: "Mi sembra che questa soluzione funzioni.", en: "I think this solution works.", altEn: ["This solution seems to work."], grammar: [g.congiuntivo-presente-forms], vocab: [w.soluzione] }
      - { es: "Non penso che capiscano il senso della regola.", en: "I don't think they understand the point of the rule.", grammar: [g.congiuntivo-presente-forms], vocab: [w.senso, w.regola], error: { wrong: "Non penso che capiscono il senso della regola.", explain: "-isc- verbs keep -isc- and take -ano in the loro congiuntivo: capiscano.", grammar: g.congiuntivo-presente-forms } }
      - { es: "Il concerto finisce a mezzanotte.", en: "The concert finishes at midnight.", grammar: [g.congiuntivo-presente-forms], vocab: [], transform: { instruction: "Start with Credo che…", answer: "Credo che il concerto finisca a mezzanotte.", alt: ["Penso che il concerto finisca a mezzanotte."], en: "I think the concert finishes at midnight." } }
      - { es: "Loro prendono il vaporetto per il Lido.", en: "They're taking the water bus to the Lido.", grammar: [g.congiuntivo-presente-forms], vocab: [], transform: { instruction: "Start with Penso che…", answer: "Penso che prendano il vaporetto per il Lido.", alt: ["Penso che loro prendano il vaporetto per il Lido."], en: "I think they're taking the water bus to the Lido." } }
      - { es: "Pensi che i turisti rispettino le regole della città?", en: "Do you think tourists respect the city's rules?", grammar: [g.congiuntivo-presente-forms], vocab: [w.regola] }
      - { es: "Mi pare che quel negozio venda vetro vero di Murano.", en: "I think that shop sells genuine Murano glass.", grammar: [g.congiuntivo-presente-forms], vocab: [w.vetro] }
      - { es: "Ho poca memoria: credo che il ristorante si chiami «Da Gino».", en: "I've got a bad memory: I think the restaurant is called 'Da Gino'.", grammar: [g.congiuntivo-presente-forms], vocab: [w.memoria] }
      - { es: "Credo che lavori in un'attività di famiglia, vicino a Rialto.", en: "I think he works in a family business, near Rialto.", grammar: [g.congiuntivo-presente-forms], vocab: [w.attività] }
      - { es: "Credo che la situazione attuale cambi presto.", en: "I think the current situation will change soon.", grammar: [g.congiuntivo-presente-forms], vocab: [w.attuale] }
      - { es: "Penso che tu giochi un ruolo importante in questa storia.", en: "I think you play an important role in this story.", grammar: [g.congiuntivo-presente-forms], vocab: [w.ruolo], note: "Spelling: giocare → giochi, pagare → paghi, cercare → cerchi." }
      - { es: "Non credo che la gente capisca il valore di questa città.", en: "I don't think people understand the value of this city.", grammar: [g.congiuntivo-presente-forms], vocab: [w.valore] }
      - { es: "Il sistema dei vaporetti sembra complicato, ma credo che serva solo un po' di pratica.", en: "The water-bus system seems complicated, but I think you just need a bit of practice.", grammar: [g.congiuntivo-presente-forms], vocab: [w.complicato] }
      - { es: "Credo che il ponte più recente sul Canal Grande si chiami Ponte della Costituzione.", en: "I think the most recent bridge over the Grand Canal is called the Constitution Bridge.", grammar: [g.congiuntivo-presente-forms], vocab: [w.recente] }
      - { es: "Non credo che esista un'altra città come Venezia: offre un'atmosfera molto particolare.", en: "I don't think there's another city like Venice: it has a very special atmosphere.", grammar: [g.congiuntivo-presente-forms], vocab: [w.esistere, w.particolare] }
    exchanges:
      - q: { es: "A che ora parte l'ultimo vaporetto?", en: "What time does the last water bus leave?" }
        a: { es: "Credo che parta verso mezzanotte, ma controlla.", en: "I think it leaves around midnight, but check." }
        alt: ["Penso che parta a mezzanotte.", "Non lo so, chiedi alla biglietteria."]
        grammar: [g.congiuntivo-presente-forms]
        vocab: []
      - q: { es: "Paolo parla inglese?", en: "Does Paolo speak English?" }
        a: { es: "Penso che lo parli abbastanza bene.", en: "I think he speaks it fairly well." }
        alt: ["Credo di sì.", "Non credo che lo parli."]
        grammar: [g.congiuntivo-presente-forms]
        vocab: []
      - q: { es: "Facciamo un patto?", en: "Shall we make a deal?" }
        a: { es: "Va bene: tu cucini e io lavo i piatti.", en: "OK: you cook and I'll wash the dishes." }
        alt: ["Dipende dal patto!", "D'accordo, ma niente trucchi."]
        grammar: [g.congiuntivo-presente-forms]
        vocab: [w.patto]
      - q: { es: "Che cosa hai in mente per stasera?", en: "What have you got in mind for tonight?" }
        a: { es: "Niente di particolare: credo che restiamo a casa.", en: "Nothing special: I think we'll stay at home." }
        alt: ["Niente di particolare.", "Penso che usciamo con Sara."]
        grammar: [g.congiuntivo-presente-forms]
        vocab: [w.mente, w.particolare]
      - q: { es: "Secondo te, è un buon affare?", en: "Do you think it's a good deal?" }
        a: { es: "Non lo so: credo che dipenda dal prezzo finale.", en: "I don't know: I think it depends on the final price." }
        alt: ["Credo di sì.", "Penso che dipenda dal prezzo."]
        grammar: [g.congiuntivo-presente-forms]
        vocab: [w.affare, w.finale]
    texts:
      - title: "Messaggio da Venezia"
        es: ["Ciao Luca, sono a Venezia con Sara.", "Credo che restiamo qui fino a domenica.", "Penso che domani prendiamo il vaporetto per il Lido.", "Immagino che tu lavori: ti mando una foto!"]
        en: ["Hi Luca, I'm in Venice with Sara.", "I think we'll stay here until Sunday.", "I think tomorrow we'll take the water bus to the Lido.", "I imagine you're working: I'll send you a photo!"]
        grammar: [g.congiuntivo-presente-forms]
        vocab: []
      - title: "Che cos'è Venezia?"
        es: ["Non è facile definire Venezia con una parola precisa.", "Credo che ognuno trovi una risposta diversa.", "Per me è una città che vive nella memoria e nel pensiero di chi la visita."]
        en: ["It isn't easy to define Venice in one precise word.", "I think everyone finds a different answer.", "For me it's a city that lives in the memory and thoughts of those who visit it."]
        grammar: [g.congiuntivo-presente-forms]
        vocab: [w.definire, w.preciso, w.memoria, w.pensiero]
    spicy:
      - { es: "Credo che tu mi guardi da mezz'ora: o ti piaccio o ho qualcosa sui denti.", en: "I think you've been looking at me for half an hour: either you like me or I've got something in my teeth.", grammar: [g.congiuntivo-presente-forms], vocab: [] }
      - { es: "Penso che tu legga nel pensiero: stavo per invitarti io.", en: "I think you read minds: I was about to invite you myself.", grammar: [g.congiuntivo-presente-forms], vocab: [w.pensiero] }
      - { es: "Non credo che il gondoliere canti solo per i turisti: ti ha guardato tre volte.", en: "I don't think the gondolier sings just for the tourists: he's looked at you three times.", grammar: [g.congiuntivo-presente-forms], vocab: [w.gondoliere] }
      - { es: "Mi sembra che tu dimentichi una cosa: il secondo bacio era una promessa.", en: "I think you're forgetting something: the second kiss was a promise.", grammar: [g.congiuntivo-presente-forms], vocab: [] }
  - id: b1.u05.l2
    title: Penso che sia giusto
    teach: [g.congiuntivo-irregular]
    vocab: [w.generale, w.principale, w.unico, w.raro, w.comune.adj, w.frequente, w.sufficiente, w.adatto, w.notevole, w.giusto, w.ingiusto, w.corretto, w.falso, w.improbabile, w.impossibile, w.necessario, w.opportuno, w.assurdo, w.normale, w.strano, w.ovvio, w.evidente, w.dubbio, w.certezza, w.fatto, w.realtà, w.in-realtà, w.esempio, w.motivo]
    tip: "essere → sia, avere → abbia; most others come from the io present: vado → vada, faccio → faccia, vengo → venga, posso → possa."
    sentences:
      - { es: "Penso che sia giusto proteggere chi vive a Venezia.", en: "I think it's right to protect the people who live in Venice.", grammar: [g.congiuntivo-irregular, g.congiuntivo-opinion], vocab: [w.giusto], error: { wrong: "Penso che è giusto proteggere chi vive a Venezia.", explain: "After penso che, essere becomes sia.", grammar: g.congiuntivo-irregular } }
      - { es: "Non credo che abbia ragione: è un'idea assurda.", en: "I don't think he's right: it's an absurd idea.", altEn: ["I don't think she's right: it's an absurd idea."], grammar: [g.congiuntivo-irregular], vocab: [w.assurdo] }
      - { es: "Lui ha ragione.", en: "He's right.", grammar: [g.congiuntivo-irregular], vocab: [], transform: { instruction: "Start with Penso che…", answer: "Penso che lui abbia ragione.", alt: ["Penso che abbia ragione."], en: "I think he's right." } }
      - { es: "Credo che vada a Murano con il vaporetto delle tre.", en: "I think she's going to Murano on the three o'clock water bus.", grammar: [g.congiuntivo-irregular], vocab: [], error: { wrong: "Credo che anda a Murano con il vaporetto delle tre.", explain: "andare comes from the io form vado: che vada.", grammar: g.congiuntivo-irregular } }
      - { es: "Fanno tardi stasera.", en: "They're going to be late tonight.", grammar: [g.congiuntivo-irregular], vocab: [], transform: { instruction: "Start with Credo che…", answer: "Credo che facciano tardi stasera.", alt: [], en: "I think they're going to be late tonight." } }
      - { es: "Penso che venga anche Giulia, ma non ne sono sicura.", en: "I think Giulia's coming too, but I'm not sure.", grammar: [g.congiuntivo-irregular], vocab: [] }
      - { es: "Non penso che tu possa entrare in San Marco con le spalle scoperte.", en: "I don't think you can go into St Mark's with bare shoulders.", grammar: [g.congiuntivo-irregular], vocab: [] }
      - { es: "Credo che dobbiate prenotare: ad agosto è sempre pieno.", en: "I think you'll have to book: in August it's always full.", altEs: ["Credo che dobbiate prenotare: in agosto è sempre pieno."], grammar: [g.congiuntivo-irregular], vocab: [] }
      - { es: "Non sono sicura che sappiano la strada.", en: "I'm not sure they know the way.", grammar: [g.congiuntivo-irregular], vocab: [] }
      - { es: "Dopo la febbre, mi pare che stia meglio.", en: "After the temperature, she seems to be better.", altEn: ["After his fever, I think he's feeling better."], grammar: [g.congiuntivo-irregular], vocab: [] }
      - { es: "So che è a Venezia, ma non credo che venga alla festa.", en: "I know he's in Venice, but I don't think he's coming to the party.", grammar: [g.congiuntivo-irregular, g.congiuntivo-opinion], vocab: [], note: "So che (certainty) takes the indicative; non credo che takes the congiuntivo." }
      - { es: "Penso che sia un caso raro: di solito l'acqua alta arriva in autunno.", en: "I think it's a rare case: high water usually comes in autumn.", grammar: [g.congiuntivo-irregular], vocab: [w.raro] }
      - { es: "Non credo che sia normale pagare dieci euro per un caffè.", en: "I don't think it's normal to pay ten euros for a coffee.", grammar: [g.congiuntivo-irregular], vocab: [w.normale] }
      - { es: "Credo che la soluzione più adatta sia il treno: in macchina è impossibile.", en: "I think the most suitable solution is the train: by car it's impossible.", grammar: [g.congiuntivo-irregular], vocab: [w.adatto, w.impossibile] }
      - { es: "Il motivo principale? Credo che sia il prezzo.", en: "The main reason? I think it's the price.", grammar: [g.congiuntivo-irregular], vocab: [w.motivo, w.principale] }
      - { es: "In realtà non penso che un giorno sia sufficiente per vedere Venezia.", en: "Actually, I don't think one day is enough to see Venice.", grammar: [g.congiuntivo-irregular], vocab: [w.in-realtà, w.sufficiente] }
    exchanges:
      - q: { es: "Pensi che sia una buona idea andare a Venezia ad agosto?", en: "Do you think going to Venice in August is a good idea?" }
        a: { es: "No, credo che faccia troppo caldo e che ci sia troppa gente.", en: "No, I think it's too hot and there are too many people." }
        alt: ["No, penso che faccia troppo caldo.", "Sì, se ti piace la folla!"]
        grammar: [g.congiuntivo-irregular]
        vocab: []
      - q: { es: "Viene anche Marco stasera?", en: "Is Marco coming tonight too?" }
        a: { es: "Non credo che venga: deve lavorare.", en: "I don't think he's coming: he has to work." }
        alt: ["Penso di sì.", "Credo che venga più tardi."]
        grammar: [g.congiuntivo-irregular]
        vocab: []
      - q: { es: "Secondo te, la notizia è vera o falsa?", en: "Do you think the news is true or false?" }
        a: { es: "Credo che sia falsa, ma non ne ho la certezza.", en: "I think it's false, but I'm not certain." }
        alt: ["Penso che sia vera.", "Non lo so, è difficile dire."]
        grammar: [g.congiuntivo-irregular]
        vocab: [w.falso, w.certezza]
      - q: { es: "Hai qualche dubbio?", en: "Do you have any doubts?" }
        a: { es: "Sì: non sono sicuro che l'albergo sia vicino a San Marco.", en: "Yes: I'm not sure the hotel is near St Mark's." }
        alt: ["No, nessun dubbio.", "Uno solo: il prezzo."]
        grammar: [g.congiuntivo-irregular]
        vocab: [w.dubbio]
      - q: { es: "Ti sembra giusto?", en: "Does it seem fair to you?" }
        a: { es: "No, penso che sia molto ingiusto.", en: "No, I think it's very unfair." }
        alt: ["Sì, mi sembra corretto.", "Non del tutto."]
        grammar: [g.congiuntivo-irregular]
        vocab: [w.ingiusto, w.corretto]
    texts:
      - title: "Recensione di un ristorante"
        es: ["Il ristorante è carino, ma credo che i prezzi siano un po' alti.", "Il servizio è notevole e il pesce è molto fresco.", "In generale, penso che valga la pena provarlo."]
        en: ["The restaurant is nice, but I think the prices are a bit high.", "The service is remarkable and the fish is very fresh.", "Overall, I think it's worth trying."]
        grammar: [g.congiuntivo-irregular]
        vocab: [w.notevole, w.generale]
      - title: "Un fatto e un'opinione"
        es: ["È un fatto: a Venezia non ci sono auto.", "È ovvio, ed è evidente a tutti.", "Ma che sia la città più bella del mondo, per esempio, è solo un'opinione comune."]
        en: ["It's a fact: there are no cars in Venice.", "It's obvious, and plain for everyone to see.", "But that it's the most beautiful city in the world, for example, is just a common opinion."]
        grammar: [g.congiuntivo-irregular]
        vocab: [w.fatto, w.ovvio, w.evidente, w.esempio, w.comune.adj]
    spicy:
      - { es: "Penso che tu sia la persona più interessante su questo vaporetto.", en: "I think you're the most interesting person on this water bus.", grammar: [g.congiuntivo-irregular], vocab: [] }
      - { es: "Non credo che tu abbia sbagliato numero: credo che tu voglia parlare con me.", en: "I don't think you've got the wrong number: I think you want to talk to me.", grammar: [g.congiuntivo-irregular], vocab: [] }
      - { es: "Dubito che il gondoliere sappia la strada, ma con te mi perdo volentieri.", en: "I doubt the gondolier knows the way, but with you I'm happy to get lost.", grammar: [g.congiuntivo-irregular], vocab: [w.gondoliere] }
      - { es: "Mi pare che tu sia un po' rosso... o è il tramonto sul Canal Grande?", en: "I think you're blushing a bit... or is it the sunset over the Grand Canal?", grammar: [g.congiuntivo-irregular], vocab: [] }
      - { es: "È strano: credo che tu sia l'unico uomo a Venezia senza una maschera.", en: "It's odd: I think you're the only man in Venice without a mask.", grammar: [g.congiuntivo-irregular], vocab: [w.strano, w.unico, w.maschera] }
  - id: b1.u05.l3
    title: Ho l'impressione che…
    teach: [g.congiuntivo-opinion]
    vocab: [w.ambiente, w.inquinamento, w.inquinare, w.rifiuti, w.riciclare, w.raccolta-differenziata, w.energia, w.cambiamento-climatico, w.riscaldamento-globale, w.sostenibile, w.plastica, w.risorsa, w.spreco, w.sprecare, w.proteggere, w.salvaguardare, w.natura, w.pianeta, w.ritenere, w.supporre, w.dubitare, w.immaginare, w.impressione, w.parere, w.parere.n, w.avere-limpressione, w.società]
    tip: "Opinion, belief and doubt take the congiuntivo: penso che sia, dubito che arrivi. Same subject? Use di + infinitive: penso di avere ragione."
    sentences:
      - { es: "Credo che il turismo di massa inquini la laguna.", en: "I think mass tourism pollutes the lagoon.", grammar: [g.congiuntivo-opinion], vocab: [w.inquinare] }
      - { es: "Ritengo che sia necessario proteggere l'ambiente della laguna.", en: "I believe it's necessary to protect the lagoon's environment.", grammar: [g.congiuntivo-opinion], vocab: [w.ritenere, w.necessario, w.proteggere, w.ambiente] }
      - { es: "Mi sembra che la raccolta differenziata funzioni bene a Venezia.", en: "Recycling seems to work well in Venice.", altEn: ["I think waste separation works well in Venice."], grammar: [g.congiuntivo-opinion], vocab: [w.raccolta-differenziata], transform: { instruction: "Make it negative: Non mi sembra che…", answer: "Non mi sembra che la raccolta differenziata funzioni bene a Venezia.", alt: [], en: "I don't think recycling works well in Venice." } }
      - { es: "Dubito che si possa riciclare tutta la plastica.", en: "I doubt all plastic can be recycled.", grammar: [g.congiuntivo-opinion], vocab: [w.dubitare, w.riciclare, w.plastica] }
      - { es: "Ho l'impressione che il cambiamento climatico sia un problema reale anche qui.", en: "I have the feeling climate change is a real problem here too.", grammar: [g.congiuntivo-opinion], vocab: [w.avere-limpressione, w.cambiamento-climatico, w.reale] }
      - { es: "Suppongo che tu sappia del MOSE, il sistema che protegge la città dall'acqua alta.", en: "I suppose you know about MOSE, the system that protects the city from high water.", grammar: [g.congiuntivo-opinion], vocab: [w.supporre, w.acqua-alta] }
      - { es: "Immagino che non sia facile salvaguardare una città costruita sull'acqua.", en: "I imagine it isn't easy to safeguard a city built on water.", grammar: [g.congiuntivo-opinion], vocab: [w.immaginare, w.salvaguardare] }
      - { es: "Penso di avere ragione.", en: "I think I'm right.", grammar: [g.congiuntivo-opinion, g.congiuntivo-vs-infinitive], vocab: [], error: { wrong: "Penso che io abbia ragione.", explain: "Same subject: use di + infinitive, penso di avere ragione.", grammar: g.congiuntivo-opinion } }
      - { es: "Mi pare che si sprechi troppa energia.", en: "I think too much energy is wasted.", grammar: [g.congiuntivo-opinion], vocab: [w.parere, w.sprecare, w.energia] }
      - { es: "Non penso che il riscaldamento globale sia un'esagerazione.", en: "I don't think global warming is an exaggeration.", grammar: [g.congiuntivo-opinion], vocab: [w.riscaldamento-globale] }
      - { es: "So che i rifiuti partono in barca ogni mattina: è un fatto.", en: "I know the rubbish goes off by boat every morning: it's a fact.", grammar: [g.congiuntivo-opinion], vocab: [w.rifiuti], note: "So che expresses certainty, so it takes the indicative (partono)." }
      - { es: "Credo che le risorse del pianeta non siano senza limiti.", en: "I think the planet's resources aren't limitless.", grammar: [g.congiuntivo-opinion], vocab: [w.risorsa, w.pianeta] }
      - { es: "Penso che lo spreco di cibo sia un problema enorme.", en: "I think food waste is a huge problem.", grammar: [g.congiuntivo-opinion], vocab: [w.spreco] }
      - { es: "La città è troppo cara.", en: "The city is too expensive.", grammar: [g.congiuntivo-opinion], vocab: [], transform: { instruction: "Start with Mi sembra che…", answer: "Mi sembra che la città sia troppo cara.", alt: ["Mi pare che la città sia troppo cara."], en: "The city seems too expensive to me." } }
      - { es: "Qual è il tuo parere? Pensi che il turismo sostenibile sia possibile?", en: "What's your opinion? Do you think sustainable tourism is possible?", grammar: [g.congiuntivo-opinion], vocab: [w.parere.n, w.sostenibile] }
      - { es: "Ho l'impressione che la natura riprenda spazio quando i turisti vanno via, e credo che la società debba imparare qualcosa.", en: "I have the impression that nature takes back space when the tourists leave, and I think society should learn something.", grammar: [g.congiuntivo-opinion], vocab: [w.impressione, w.natura, w.società] }
    exchanges:
      - q: { es: "Che cosa ne pensi del MOSE?", en: "What do you think of MOSE?" }
        a: { es: "Penso che sia utile, ma credo che costi troppo.", en: "I think it's useful, but I think it costs too much." }
        alt: ["Credo che sia utile.", "Non so, dubito che funzioni sempre."]
        grammar: [g.congiuntivo-opinion]
        vocab: []
      - q: { es: "Ricicli la plastica?", en: "Do you recycle plastic?" }
        a: { es: "Sì, sempre: credo che sia il minimo.", en: "Yes, always: I think it's the least you can do." }
        alt: ["Sì, sempre.", "Ci provo, ma non sempre."]
        grammar: [g.congiuntivo-opinion]
        vocab: [w.plastica]
      - q: { es: "Secondo te, Venezia è in pericolo?", en: "Do you think Venice is in danger?" }
        a: { es: "Ho l'impressione che lo sia, purtroppo.", en: "I have the feeling it is, unfortunately." }
        alt: ["Credo di sì.", "Non penso che sia in pericolo."]
        grammar: [g.congiuntivo-opinion]
        vocab: [w.avere-limpressione]
      - q: { es: "Che cosa possiamo fare per l'ambiente?", en: "What can we do for the environment?" }
        a: { es: "Credo che dobbiamo sprecare meno e usare meno plastica.", en: "I think we have to waste less and use less plastic." }
        alt: ["Riciclare di più.", "Penso che dobbiamo usare meno la macchina."]
        grammar: [g.congiuntivo-opinion]
        vocab: [w.sprecare, w.ambiente]
      - q: { es: "Vieni in bici?", en: "Are you coming by bike?" }
        a: { es: "No, penso di prendere il vaporetto.", en: "No, I'm thinking of taking the water bus." }
        alt: ["No, a Venezia le bici sono vietate!", "Penso di venire a piedi."]
        grammar: [g.congiuntivo-vs-infinitive]
        vocab: []
    texts:
      - title: "Cartello in calle"
        es: ["Venezia è casa nostra: rispettala.", "Crediamo che ognuno debba fare la raccolta differenziata.", "Non lasciate rifiuti in calle: la barca passa ogni mattina."]
        en: ["Venice is our home: respect it.", "We believe everyone should separate their waste.", "Don't leave rubbish in the street: the boat comes by every morning."]
        grammar: [g.congiuntivo-opinion]
        vocab: [w.raccolta-differenziata, w.rifiuti, w.calle]
    spicy:
      - { es: "Ho l'impressione che tu non sia qui per la raccolta differenziata.", en: "I have the feeling you're not here for the recycling.", grammar: [g.congiuntivo-opinion], vocab: [w.avere-limpressione] }
      - { es: "Non credo che sia sostenibile guardarti così per tutta la sera.", en: "I don't think it's sustainable to look at you like this all evening.", grammar: [g.congiuntivo-opinion], vocab: [w.sostenibile] }
      - { es: "Suppongo che tu abbia già un fidanzato. No? Che spreco!", en: "I suppose you already have a boyfriend. No? What a waste!", grammar: [g.congiuntivo-opinion], vocab: [w.supporre, w.spreco] }
      - { es: "Penso che tra noi ci sia abbastanza energia per illuminare tutta la laguna.", en: "I think there's enough energy between us to light up the whole lagoon.", grammar: [g.congiuntivo-opinion], vocab: [w.energia] }
  - id: b1.u05.l4
    title: Secondo me, invece…
    teach: [g.congiuntivo-opinion, g.congiuntivo-irregular]
    vocab: [w.politica, w.politico, w.partito, w.elezioni, w.votare, w.cittadino, w.diritto, w.legge, w.tassa, w.immigrazione, w.immigrato, w.lavoratore, w.disoccupazione, w.problema-sociale, w.argomento, w.questione, w.tema, w.punto, w.secondo-lui, w.considerare, w.giudicare, w.criticare, w.critica, w.approvare, w.daltra-parte, w.dipendere, w.dipende, w.discutere, w.convincere, w.convinto, w.daccordo-con, w.improbabile, w.opportuno, w.frequente, w.giustizia]
    tip: "Debating? Penso che, credo che, non sono convinto che + congiuntivo. But sono sicuro che, è vero che (certainty) + indicative."
    sentences:
      - { es: "Secondo lui, i politici non ascoltano i cittadini.", en: "In his opinion, politicians don't listen to citizens.", grammar: [g.congiuntivo-opinion], vocab: [w.secondo-lui, w.politico, w.cittadino], transform: { instruction: "Start with Lui crede che…", answer: "Lui crede che i politici non ascoltino i cittadini.", alt: ["Crede che i politici non ascoltino i cittadini."], en: "He believes politicians don't listen to citizens." } }
      - { es: "Non penso che questo partito vinca le elezioni.", en: "I don't think this party will win the election.", grammar: [g.congiuntivo-opinion], vocab: [w.partito, w.elezioni] }
      - { es: "Credo che votare sia un diritto e un dovere.", en: "I think voting is a right and a duty.", grammar: [g.congiuntivo-opinion], vocab: [w.votare, w.diritto] }
      - { es: "Dubito che la nuova legge risolva il problema della disoccupazione.", en: "I doubt the new law will solve the problem of unemployment.", grammar: [g.congiuntivo-opinion], vocab: [w.legge, w.disoccupazione] }
      - { es: "Mi sembra che le tasse per i lavoratori siano troppo alte.", en: "Taxes on workers seem too high to me.", grammar: [g.congiuntivo-opinion], vocab: [w.tassa, w.lavoratore] }
      - { es: "Penso che l'immigrazione sia un tema complesso.", en: "I think immigration is a complex topic.", grammar: [g.congiuntivo-opinion], vocab: [w.immigrazione, w.tema, w.complesso] }
      - { es: "Non sono convinto che abbiano ragione.", en: "I'm not convinced they're right.", grammar: [g.congiuntivo-opinion], vocab: [w.convinto], error: { wrong: "Non sono convinto che hanno ragione.", explain: "Non sono convinto che expresses doubt: use the congiuntivo, abbiano.", grammar: g.congiuntivo-opinion } }
      - { es: "Cerco di convincerla, ma credo che non voglia ascoltare.", en: "I'm trying to convince her, but I don't think she wants to listen.", grammar: [g.congiuntivo-irregular], vocab: [w.convincere] }
      - { es: "Dipende: penso che ogni immigrato abbia una storia diversa.", en: "It depends: I think every immigrant has a different story.", grammar: [g.congiuntivo-opinion], vocab: [w.dipende, w.immigrato] }
      - { es: "D'altra parte, non credo che esistano soluzioni semplici.", en: "On the other hand, I don't think there are simple solutions.", grammar: [g.congiuntivo-opinion], vocab: [w.daltra-parte, w.esistere] }
      - { es: "Sono d'accordo con te, ma non penso che tutti la pensino così.", en: "I agree with you, but I don't think everyone sees it that way.", grammar: [g.congiuntivo-opinion], vocab: [w.daccordo-con] }
      - { es: "Non mi piace giudicare, ma credo che questa critica sia ingiusta.", en: "I don't like to judge, but I think this criticism is unfair.", grammar: [g.congiuntivo-opinion], vocab: [w.giudicare, w.critica, w.ingiusto] }
      - { es: "Tutti lo criticano, ma io penso che faccia un buon lavoro.", en: "Everyone criticises him, but I think he's doing a good job.", grammar: [g.congiuntivo-irregular], vocab: [w.criticare] }
      - { es: "Il politico dice la verità.", en: "The politician is telling the truth.", grammar: [g.congiuntivo-irregular], vocab: [w.politico], transform: { instruction: "Start with Dubito che…", answer: "Dubito che il politico dica la verità.", alt: [], en: "I doubt the politician is telling the truth." } }
      - { es: "È un argomento difficile: non credo che sia il momento di discuterne.", en: "It's a difficult subject: I don't think this is the moment to discuss it.", grammar: [g.congiuntivo-opinion], vocab: [w.argomento, w.discutere] }
      - { es: "Considero la disoccupazione dei giovani una questione urgente: credo che sia il problema sociale più grave.", en: "I consider youth unemployment an urgent issue: I think it's the most serious social problem.", grammar: [g.congiuntivo-opinion], vocab: [w.considerare, w.questione, w.problema-sociale] }
    exchanges:
      - q: { es: "Per chi voti alle elezioni?", en: "Who are you voting for in the election?" }
        a: { es: "Non lo so ancora: dipende dai programmi.", en: "I don't know yet: it depends on the manifestos." }
        alt: ["È un segreto!", "Non ho ancora deciso."]
        grammar: [g.congiuntivo-opinion]
        vocab: [w.elezioni, w.dipendere]
      - q: { es: "Secondo te, la legge sarà approvata?", en: "Do you think the law will be passed?" }
        a: { es: "Mi sembra improbabile: credo che manchino i voti.", en: "It seems unlikely to me: I think they don't have the votes." }
        alt: ["Penso di sì.", "Dubito che la approvino."]
        grammar: [g.congiuntivo-opinion]
        vocab: [w.approvare, w.improbabile, w.legge]
      - q: { es: "Sei d'accordo con Marco?", en: "Do you agree with Marco?" }
        a: { es: "In parte: credo che abbia ragione su un punto, ma non su tutto.", en: "Partly: I think he's right on one point, but not on everything." }
        alt: ["Sì, completamente.", "No, per niente."]
        grammar: [g.congiuntivo-irregular]
        vocab: [w.punto, w.daccordo-con]
      - q: { es: "È opportuno parlare di politica a cena?", en: "Is it appropriate to talk politics at dinner?" }
        a: { es: "Dipende dagli ospiti: non credo che sia sempre una buona idea.", en: "It depends on the guests: I don't think it's always a good idea." }
        alt: ["Secondo me no.", "Dipende!"]
        grammar: [g.congiuntivo-opinion]
        vocab: [w.opportuno, w.politica]
      - q: { es: "Con quale frequenza leggi le notizie?", en: "How often do you read the news?" }
        a: { es: "Ogni giorno: penso che un cittadino debba essere informato.", en: "Every day: I think a citizen should be informed." }
        alt: ["Spesso.", "Non molto: credo che le notizie siano troppo negative."]
        grammar: [g.congiuntivo-irregular]
        vocab: [w.cittadino]
    texts:
      - title: "Lettera al giornale"
        es: ["Gentile direttore, molti considerano il turismo una risorsa per Venezia.", "D'altra parte, credo che la città debba proteggere i suoi abitanti.", "Non penso che una tassa basti: serve una legge chiara."]
        en: ["Dear Editor, many people consider tourism a resource for Venice.", "On the other hand, I think the city must protect its residents.", "I don't think a tax is enough: a clear law is needed."]
        grammar: [g.congiuntivo-opinion, g.congiuntivo-irregular]
        vocab: [w.considerare, w.daltra-parte, w.tassa, w.legge]
      - title: "Commento online"
        es: ["Le proteste dei residenti sono sempre più frequenti.", "Chiedono solo un po' di giustizia.", "Dubito che i politici le ascoltino.", "Ma penso che il voto dei cittadini conti ancora."]
        en: ["Protests by residents are more and more frequent.", "All they ask for is a bit of justice.", "I doubt politicians listen to them.", "But I think citizens' votes still count."]
        grammar: [g.congiuntivo-opinion]
        vocab: [w.frequente, w.giustizia, w.politico, w.cittadino]
    spicy:
      - { es: "Penso che tu sia l'unico politico che mantiene le promesse, almeno al primo appuntamento.", en: "I think you're the only politician who keeps his promises, at least on a first date.", grammar: [g.congiuntivo-opinion], vocab: [w.politico] }
      - { es: "Non credo che tu voglia parlare di elezioni con quel vestito.", en: "I don't think you want to talk about elections in that dress.", grammar: [g.congiuntivo-irregular], vocab: [w.elezioni] }
      - { es: "Ti voterei, ma credo che tu sia già occupato.", en: "I'd vote for you, but I think you're already taken.", grammar: [g.congiuntivo-opinion], vocab: [w.votare] }
      - { es: "D'altra parte, dubito che esista una legge contro i baci sul ponte di Rialto.", en: "Then again, I doubt there's a law against kissing on the Rialto Bridge.", grammar: [g.congiuntivo-opinion], vocab: [w.daltra-parte, w.legge] }
dialogues:
  - id: b1.u05.d1
    title: Sul ponte di Rialto
    context: Sara and Lorenzo are crossing the Rialto Bridge in Venice on a busy morning and start discussing tourism.
    lines:
      - { speaker: Sara, es: "Guarda quanta gente sul ponte! Penso che Venezia sia troppo affollata.", en: "Look how many people there are on the bridge! I think Venice is too crowded." }
      - { speaker: Lorenzo, es: "Hai ragione, ma credo che il turismo sia anche una risorsa per la città.", en: "You're right, but I think tourism is also a resource for the city." }
      - { speaker: Sara, es: "Certo, ma mi sembra che i veneziani se ne vadano: gli abitanti sono sempre meno.", en: "Sure, but it seems to me Venetians are leaving: there are fewer and fewer residents." }
      - { speaker: Lorenzo, es: "È vero. Nel centro storico oggi vivono meno di cinquantamila persone.", en: "That's true. Fewer than fifty thousand people live in the historic centre today." }
      - { speaker: Sara, es: "Che tristezza. Pensi che il biglietto d'ingresso per i turisti serva a qualcosa?", en: "How sad. Do you think the entry ticket for tourists is any use?" }
      - { speaker: Lorenzo, es: "Non sono sicuro che basti. Dubito che pochi euro cambino le cose.", en: "I'm not sure it's enough. I doubt a few euros will change things." }
      - { speaker: Sara, es: "Allora che cosa proponi?", en: "So what do you suggest?" }
      - { speaker: Lorenzo, es: "Credo che servano case a prezzi giusti per chi ci vive e ci lavora.", en: "I think we need homes at fair prices for the people who live and work here." }
      - { speaker: Sara, es: "Sono d'accordo con te. Ma adesso basta politica: credo che il nostro vaporetto parta tra due minuti!", en: "I agree with you. But that's enough politics: I think our water bus leaves in two minutes!" }
      - { speaker: Lorenzo, es: "Corriamo, allora!", en: "Let's run, then!" }
    questions:
      - { q: "Che cosa pensa Sara di Venezia?", options: ["Che sia troppo affollata", "Che sia troppo cara", "Che sia troppo tranquilla"], answer: 0, explain: "Penso che Venezia sia troppo affollata." }
      - { q: "Secondo Lorenzo, che cos'è anche il turismo?", options: ["Un problema sociale", "Una risorsa per la città", "Una moda"], answer: 1, explain: "Credo che il turismo sia anche una risorsa per la città." }
      - { q: "Che cosa propone Lorenzo?", options: ["Una tassa più alta", "Case a prezzi giusti per chi vive in città", "Chiudere il ponte ai turisti"], answer: 1, explain: "Credo che servano case a prezzi giusti per chi ci vive e ci lavora." }
      - { q: "Perché devono correre alla fine?", options: ["Perché piove", "Perché il vaporetto parte tra due minuti", "Perché il ponte chiude"], answer: 1, explain: "Credo che il nostro vaporetto parta tra due minuti!" }
writing:
  - task: "Give your opinion on the environment where you live: recycling, pollution, transport. Use penso che, credo che, mi sembra che + congiuntivo."
    min: 60
    max: 110
    use: [w.ambiente, w.inquinamento, w.raccolta-differenziata, w.plastica, w.dubitare]
    grammar: [g.congiuntivo-opinion, g.congiuntivo-presente-forms]
    expect:
      - { pattern: "\\b(penso|credo|mi sembra|mi pare|ritengo|immagino|suppongo|dubito|ho l['’]impressione|non credo|non penso) che\\b", hint: "Introduce your opinion: penso che, credo che, mi sembra che…" }
      - { pattern: "\\bche\\s+(\\S+\\s+){0,3}(sia|siano|abbia|abbiano|faccia|facciano|vada|vadano|possa|possano|debba|debbano|voglia|vogliano|stia|stiano|sappia|venga|vengano|funzioni|funzionino|usi|usino|ricicli|riciclino)\\b", hint: "Use the congiuntivo after che: sia, abbiano, funzioni…" }
    model: { es: "Penso che l'ambiente sia un tema molto importante. Nella mia città credo che la raccolta differenziata funzioni abbastanza bene, ma mi sembra che la gente usi ancora troppa plastica. Ho l'impressione che l'inquinamento sia il problema principale, perché ci sono troppe macchine in centro. Secondo me il comune dovrebbe creare più parchi e offrire autobus più frequenti. Sarebbe bello anche andare al lavoro in bicicletta, ma dubito che la situazione cambi presto.", en: "I think the environment is a very important issue. In my city I believe recycling works quite well, but it seems to me that people still use too much plastic. I have the impression that pollution is the main problem, because there are too many cars in the centre. In my opinion the council should create more parks and offer more frequent buses. It would also be nice to cycle to work, but I doubt the situation will change soon." }
  - task: "A friend tells you some alarming news about Venice. Reply with your opinion, your doubts and what you believe (non credo che, è possibile che, dubito che…)."
    es: "Ho letto che Venezia sparirà tra cinquant'anni!"
    min: 50
    max: 100
    use: [w.dubitare, w.possibile, w.immaginare, w.in-realtà, w.proteggere]
    grammar: [g.congiuntivo-irregular, g.congiuntivo-opinion]
    expect:
      - { pattern: "\\b(non credo|non penso|dubito|immagino|credo|penso|mi sembra|suppongo) che\\b|(è possibile|è probabile|è improbabile|è impossibile|è vero) che\\b", hint: "Express doubt or belief: non credo che, dubito che, è possibile che…" }
      - { pattern: "\\b(sia|siano|abbia|abbiano|faccia|facciano|vada|vadano|possa|possano|debba|debbano|salga|salgano|sparisca|spariscano|stia|stiano|dia|diano)\\b", hint: "Use an irregular congiuntivo: sia, abbia, faccia, debba…" }
    model: { es: "Davvero? Non credo che sia vero. È possibile che il livello del mare salga, ma dubito che Venezia sparisca così presto. Immagino che i giornali scrivano queste cose per avere più lettori. In realtà mi sembra che la città abbia già un sistema contro l'acqua alta. Penso però che sia necessario proteggere la laguna e che tutti debbano fare la loro parte.", en: "Really? I don't think it's true. It's possible that the sea level will rise, but I doubt that Venice will disappear so soon. I imagine newspapers write these things to get more readers. Actually it seems to me that the city already has a system against high water. I do think, though, that the lagoon needs to be protected and that everyone has to do their part." }
  - task: "Write a comment for a news website about a social problem in your country (unemployment, rents, immigration…): give your opinion with the congiuntivo and suggest a solution."
    min: 60
    max: 110
    use: [w.disoccupazione, w.soluzione, w.dipendere, w.lavoratore, w.daltra-parte]
    grammar: [g.congiuntivo-opinion]
    expect:
      - { pattern: "\\b(penso|credo|mi sembra|mi pare|ritengo|immagino|non credo|non penso|dubito) che\\b", hint: "Give your opinion: penso che, ritengo che, non credo che…" }
      - { pattern: "\\bche\\s+(\\S+\\s+){0,3}(sia|siano|abbia|abbiano|faccia|facciano|vada|vadano|possa|possano|debba|debbano|offrano|trovino|aiuti|\\S+(ino|ano))\\b", hint: "Use the congiuntivo after che: debba, vadano, offrano…" }
    model: { es: "Secondo me la disoccupazione è il problema più grave del nostro paese. Credo che molti ragazzi vadano a lavorare in altri paesi perché qui non trovano niente. Non penso che sia colpa loro: mi sembra che le aziende offrano solo contratti di pochi mesi e stipendi bassi. Ritengo che il governo debba aiutare chi assume giovani lavoratori. D'altra parte, dipende anche dalla scuola, che dovrebbe preparare meglio gli studenti.", en: "In my view unemployment is the most serious problem in our country. I believe many young people go to work in other countries because they can't find anything here. I don't think it's their fault: it seems to me that companies offer only contracts of a few months and low salaries. I believe the government should help those who hire young workers. On the other hand, it also depends on schools, which should prepare students better." }
  - task: "Your friend Sara has fallen in love with a gondolier and wants to move to Venice at once. Give her your honest opinion using che + congiuntivo (credo che tu debba, non dico che sia…)."
    min: 50
    max: 100
    use: [w.giusto, w.assurdo, w.normale, w.convinto, w.motivo]
    grammar: [g.congiuntivo-irregular]
    expect:
      - { pattern: "\\bche tu\\s+(\\S+\\s+)?(sia|abbia|faccia|vada|possa|debba|voglia|stia|sappia|venga|dia)\\b|\\bche\\s+(sia|abbia|faccia|vada|possa|debba|voglia|stia|sappia|venga|dia)\\b", hint: "Use irregular congiuntivo forms: che tu sia, che tu debba, che sia…" }
    model: { es: "Cara Sara, capisco che tu sia innamorata, ma credo che tu debba pensarci bene. Non dico che sia una scelta assurda: è normale che una persona faccia cose strane per amore! Però penso che sia giusto conoscere meglio Marco prima di trasferirti. Mi sembra che tu non abbia ancora un lavoro a Venezia, giusto? Se sei convinta, vai, ma ti consiglio di aspettare qualche mese.", en: "Dear Sara, I understand that you're in love, but I think you need to think it over carefully. I'm not saying it's an absurd choice: it's normal for people to do strange things for love! But I think it's right to get to know Marco better before you move. It seems to me you don't have a job in Venice yet, right? If you're sure, go, but I'd advise you to wait a few months." }
