# B1 grammar notes (Provence and the Riviera). Explanations use light markdown:
# ### headings, bullets, tables, **bold**, *italic* (italic = French inline).
- id: g.double-object-pronouns
  level: b1
  title: "Two pronouns together: je le lui donne"
  summary: "Order before the verb: me/te/se/nous/vous → le/la/les → lui/leur → y → en."
  explanation: |
    When a verb has two object pronouns, they go before the verb in a fixed order:

    | 1 | 2 | 3 | 4 | 5 |
    |---|---|---|---|---|
    | me, te, se, nous, vous | le, la, les | lui, leur | y | en |

    | sentence | with pronouns |
    |---|---|
    | *Il me donne **le poisson**.* | *Il **me le** donne.* |
    | *Je donne **la recette à Marie**.* | *Je **la lui** donne.* |
    | *Tu envoies **les photos à tes parents** ?* | *Tu **les leur** envoies ?* |
    | *Elle nous parle **de son voyage**.* | *Elle **nous en** parle.* |

    ### Rules of thumb
    - *Le / la / les* come **after** *me, te, nous, vous* but **before** *lui, leur*.
    - *Lui* and *leur* never combine with *me, te, nous, vous*.
    - *En* is always last.

    ### In compound tenses and with infinitives
    *Je **la lui** ai donnée.* (agreement with *la*) / *Je vais **te le** montrer.*
    Negative: *Je **ne** **le lui** ai **pas** dit.*
  examples:
    - { es: "Ces rougets, je vous les mets de côté ?", en: "These red mullet, shall I put them aside for you?" }
    - { es: "Ma recette de bouillabaisse ? Je te la donnerai.", en: "My bouillabaisse recipe? I'll give it to you." }
    - { es: "Tu as rendu le livre à Paul ? — Oui, je le lui ai rendu.", en: "Did you give the book back to Paul? — Yes, I gave it back to him." }
    - { es: "Il ne nous en a jamais parlé.", en: "He never talked to us about it." }
  pitfalls:
    - "*Je le lui donne*, not *je lui le donne*; but *il me le donne*, not *il le me donne*."
    - "In speech, people often drop one pronoun (*Je lui donne*); write both."
  related: [g.direct-object-pronouns, g.indirect-object-pronouns, g.pronoun-order-imperative, g.y-en-combinations]
  drills:
    - { es: "Je vous l'envoie demain.", en: "I'll send it to you tomorrow." }
    - { es: "Elle la leur a montrée.", en: "She showed it to them." }
    - { es: "Tu me le prêtes ?", en: "Will you lend it to me?" }
- id: g.pronoun-order-imperative
  level: b1
  title: "Pronouns with the imperative: donne-le-moi, ne me le donne pas"
  summary: "Affirmative: verb-direct-indirect with hyphens (donne-le-moi, montre-la-leur). Negative: normal order before the verb."
  explanation: |
    ### Affirmative imperative
    The pronouns follow the verb, joined by hyphens, **direct before indirect**; *me, te* become *moi, toi*:

    | order | example |
    |---|---|
    | verb – le/la/les – moi/toi/lui/nous/vous/leur – y – en | |
    | *Donne-**le-moi** !* | Give it to me! |
    | *Montrez-**la-leur**.* | Show it to them. |
    | *Rends-**les-nous**.* | Give them back to us. |
    | *Donne-**m'en** !* / *Donnez-**nous-en**.* | Give me / us some! |
    | *Va-**t'en** !* | Go away! |

    Before *en* and *y*, *moi / toi* become *m' / t'*: *Donne-m'en, va-t'en*.

    ### Negative imperative
    Back to the normal order before the verb: *Ne **me le** donne pas. Ne **la leur** montrez pas. Ne **t'en** va pas.*
  examples:
    - { es: "Ton billet pour le festival ? Montre-le-moi !", en: "Your festival ticket? Show it to me!" }
    - { es: "Les clés, donne-les-lui.", en: "The keys, give them to him." }
    - { es: "Ne me le dis pas, je veux la surprise !", en: "Don't tell me, I want it to be a surprise!" }
    - { es: "Des cerises ? Donnez-m'en un kilo.", en: "Cherries? Give me a kilo." }
  pitfalls:
    - "*Donne-le-moi*, not *donne-moi-le* (heard in casual speech but non-standard)."
    - "Negative: *ne me le donne pas*, not *ne donne-le-moi pas*."
  related: [g.imperative-with-pronouns, g.double-object-pronouns]
  drills:
    - { es: "Dis-le-nous.", en: "Tell us." }
    - { es: "Ne le leur envoie pas.", en: "Don't send it to them." }
    - { es: "Prête-la-moi, s'il te plaît.", en: "Lend it to me, please." }
- id: g.y-en-combinations
  level: b1
  title: "Il y en a, je m'en vais, je vous y emmène"
  summary: "y and en come last in the pronoun chain, y before en: il y en a, je lui en parle, je vous y attends."
  explanation: |
    | combination | example | meaning |
    |---|---|---|
    | **il y en a** | *Des billets ? Il y en a encore.* | there are some |
    | **il n'y en a plus** | *Il n'y en a plus.* | there's none left |
    | pronoun + **y** | *Je vous **y** emmène.* | I'll take you there |
    | pronoun + **en** | *Je **lui en** ai parlé.* | I talked to him about it |
    | **s'en aller** | *Je **m'en** vais.* | I'm leaving |
    | **s'en occuper** | *Je **m'en** occupe.* | I'll deal with it |
    | **se souvenir de** | *Je **m'en** souviens.* | I remember (it) |

    ### Order reminder
    me/te/se/nous/vous → le/la/les → lui/leur → **y → en**.

    *Y* and *en* together appear almost only in *il y en a* (and *il y en avait, il y en aura*).

    ### Passé composé
    *Il y en a eu beaucoup.* (There were lots.) *Je m'en suis souvenu.*
  examples:
    - { es: "Des touristes ? Il y en a partout au Vieux-Port.", en: "Tourists? There are some everywhere in the Old Port." }
    - { es: "Tu as parlé du problème au patron ? — Oui, je lui en ai parlé.", en: "Did you tell the boss about the problem? — Yes, I told him about it." }
    - { es: "Ne t'inquiète pas, je m'en occupe.", en: "Don't worry, I'll take care of it." }
    - { es: "Il est tard, on s'en va ?", en: "It's late, shall we go?" }
  pitfalls:
    - "*Il y en a*, not *il en y a*."
    - "*Je m'en vais* (I'm leaving) — *s'en aller* has *en* built in: *va-t'en, allez-vous-en*."
  related: [g.pronoun-y, g.pronoun-en, g.double-object-pronouns, g.en-quantities]
  drills:
    - { es: "Il n'y en a plus.", en: "There aren't any left." }
    - { es: "Je vous y attends.", en: "I'll wait for you there." }
    - { es: "Elle s'en souvient très bien.", en: "She remembers it very well." }
- id: g.relative-qui-que
  level: b1
  title: "Relative pronouns qui and que"
  summary: "qui = subject (followed by a verb): la dame qui parle. que = object (followed by a subject): la ville que j'aime."
  explanation: |
    | pronoun | role | followed by | example |
    |---|---|---|---|
    | **qui** | subject of the relative clause | a verb | *La basilique **qui** domine Marseille.* |
    | **que / qu'** | direct object | subject + verb | *La vue **que** nous admirons.* |

    Both work for people **and** things (English who / which / that).

    ### Test
    Look at what follows: a verb → *qui*; a subject (*je, tu, Marie…*) → *que*.
    - *L'homme **qui** vend du poisson.* (qui + vend)
    - *L'homme **que** je connais.* (que + je)

    ### Rules
    - *Qui* never elides: *l'ami **qui** arrive*. *Que* does: *l'ami **qu'**on attend*.
    - You can't leave out *que* as in English ("the town I love"): *la ville **que** j'aime*.
    - With *que* + passé composé, the participle agrees: *les photos **que** j'ai prises*.
    - *Qui* takes the verb agreement of its antecedent: *C'est moi qui **suis** venu.*
  examples:
    - { es: "Notre-Dame-de-la-Garde est la basilique qui veille sur Marseille.", en: "Notre-Dame-de-la-Garde is the basilica that watches over Marseille." }
    - { es: "Les ex-voto que les marins ont offerts sont émouvants.", en: "The ex-votos that the sailors offered are moving." }
    - { es: "C'est un quartier que j'adore.", en: "It's a neighbourhood I love." }
    - { es: "C'est toi qui as raison.", en: "You're the one who's right." }
  pitfalls:
    - "Never drop *que*: *le film que j'ai vu*, not *le film j'ai vu*."
    - "Never elide *qui*: *qui est*, not *qu'est*."
    - "*C'est moi qui suis*, not *c'est moi qui est*."
  related: [g.relative-ou, g.relative-dont, g.ce-qui-ce-que, g.pc-object-agreement]
  drills:
    - { es: "Le guide qui nous accompagne est marseillais.", en: "The guide who's with us is from Marseille." }
    - { es: "La glace que tu m'as achetée est délicieuse.", en: "The ice cream you bought me is delicious." }
    - { es: "C'est la ville qui me plaît le plus.", en: "It's the town I like most." }
- id: g.relative-ou
  level: b1
  title: "Où: where and when"
  summary: "où after places (la ville où je suis né) and after time expressions (le jour où je t'ai rencontré)."
  explanation: |
    | use | example |
    |---|---|
    | **place** | *Le quartier **où** j'habite.* — The neighbourhood where I live. |
    | **time** | *Le jour **où** il est arrivé.* — The day (when) he arrived. |
    | | *L'année **où** j'ai eu mon bac.* |
    | | *Au moment **où** le bateau partait…* |

    ### Où for time
    English uses "when" or nothing; French uses *où*, never *quand*: *le jour **où**…*, not *le jour quand…*

    ### D'où, par où
    *La colline **d'où** on voit la mer* (from where), *le chemin **par où** nous sommes passés* (through which).

    Où is always written with the accent (*ou* = or).
  examples:
    - { es: "Voici la colline où se trouve la Bonne Mère.", en: "Here's the hill where the Bonne Mère stands." }
    - { es: "Je me souviens du jour où j'ai vu la mer pour la première fois.", en: "I remember the day I saw the sea for the first time." }
    - { es: "C'est le restaurant où nous avons mangé la bouillabaisse.", en: "That's the restaurant where we ate bouillabaisse." }
    - { es: "Il y a une terrasse d'où on voit toute la ville.", en: "There's a terrace from where you can see the whole city." }
  pitfalls:
    - "Not *le jour quand…*: *le jour où…*"
    - "With a verb taking a direct object, use *que*: *la ville que je visite* (but *la ville où je vais*)."
  related: [g.relative-qui-que, g.relative-preposition, g.relative-lequel]
  drills:
    - { es: "C'est la maison où je suis née.", en: "It's the house where I was born." }
    - { es: "Le soir où il a plu, on est restés à l'hôtel.", en: "The evening it rained, we stayed at the hotel." }
    - { es: "Tu connais un endroit où on peut se baigner ?", en: "Do you know a place where we can swim?" }
- id: g.relative-dont
  level: b1
  title: "Dont: of which, whose, about whom"
  summary: "dont replaces de + noun: la ville dont je rêve (rêver de), l'ami dont le frère est marin (whose)."
  explanation: |
    *Dont* replaces a complement introduced by **de**:

    | verb / expression with de | relative with dont |
    |---|---|
    | *parler de* | *le film **dont** je t'ai parlé* (the film I told you about) |
    | *avoir besoin de* | *les choses **dont** j'ai besoin* (the things I need) |
    | *rêver de* | *la maison **dont** je rêve* |
    | *se souvenir de* | *un été **dont** je me souviens* |
    | *être fier de* | *un travail **dont** il est fier* |

    ### Whose
    With a noun of possession: *l'homme **dont** la fille est peintre* (the man whose daughter is a painter). Word order stays normal: *dont* + subject + verb, with *le / la / les* (no possessive):
    *La basilique, **dont** le clocher mesure 60 mètres…*

    ### Quantities
    *J'ai vu dix films, **dont** trois français.* (including three French ones)
  examples:
    - { es: "Voilà le livre dont tout le monde parle.", en: "There's the book everyone is talking about." }
    - { es: "C'est un marin dont le père était pêcheur.", en: "He's a sailor whose father was a fisherman." }
    - { es: "Le guide m'a donné tout ce dont j'avais besoin.", en: "The guide gave me everything I needed." }
    - { es: "Nous avons visité cinq églises, dont la Bonne Mère.", en: "We visited five churches, including the Bonne Mère." }
  pitfalls:
    - "Not *le film que je t'ai parlé*: *parler de* → *dont*."
    - "No possessive after *dont*: *l'homme dont la fille…*, not *dont sa fille*."
    - "Not *dont* after a preposition phrase like *à côté de*: use *duquel* (B2)."
  related: [g.relative-qui-que, g.ce-qui-ce-que, g.dont-vs-duquel]
  drills:
    - { es: "C'est la ville dont je rêvais.", en: "It's the city I dreamed of." }
    - { es: "L'auteur dont je parle est provençal.", en: "The author I'm talking about is from Provence." }
    - { es: "Une amie dont le mari est chef nous a invités.", en: "A friend whose husband is a chef invited us." }
- id: g.relative-preposition
  level: b1
  title: "Preposition + qui: avec qui, pour qui, chez qui"
  summary: "After a preposition, use qui for people (la personne avec qui je travaille) and lequel for things (B2)."
  explanation: |
    | preposition + **qui** (people) | English |
    |---|---|
    | *l'ami **avec qui** je pars* | the friend I'm leaving with |
    | *la dame **à qui** j'ai parlé* | the lady I spoke to |
    | *les gens **chez qui** nous dormons* | the people we're staying with |
    | *le prof **pour qui** j'ai écrit ça* | the teacher I wrote this for |

    French never ends a sentence with a preposition: the preposition goes **in front of** the relative pronoun.

    ### Things
    For things, use *lequel / laquelle* (B2): *la table **sur laquelle**…*, *le stylo **avec lequel**…* For places, *où* is often simpler: *la ville où…*

    ### De + person
    Use *dont* rather than *de qui*: *l'ami **dont** je parle* (more natural than *de qui je parle*).
  examples:
    - { es: "La femme à qui j'ai demandé le chemin était très gentille.", en: "The woman I asked the way was very kind." }
    - { es: "Ce sont des amis chez qui on dort souvent.", en: "They're friends we often stay with." }
    - { es: "Le marin avec qui nous avons parlé connaît bien la côte.", en: "The sailor we talked to knows the coast well." }
  pitfalls:
    - "Not *la personne qui je parle avec*: *la personne avec qui je parle*."
    - "*À qui* for people; for things after *à*, use *auquel* (B2): *le projet auquel je pense*."
  related: [g.relative-qui-que, g.relative-lequel, g.relative-dont]
  drills:
    - { es: "C'est l'homme avec qui elle danse.", en: "That's the man she's dancing with." }
    - { es: "Les enfants pour qui j'ai acheté ces cadeaux sont mes neveux.", en: "The children I bought these presents for are my nephews." }
    - { es: "La collègue à qui j'ai envoyé le message n'a pas répondu.", en: "The colleague I sent the message to hasn't answered." }
- id: g.ce-qui-ce-que
  level: b1
  title: "Ce qui, ce que, ce dont: what"
  summary: "'what' (= the thing that) in the middle of a sentence: ce qui (subject), ce que (object), ce dont (de)."
  explanation: |
    | form | role | example |
    |---|---|---|
    | **ce qui** | subject (+ verb) | ***Ce qui** me plaît, c'est la mer.* |
    | **ce que / ce qu'** | object (+ subject) | *Je ne sais pas **ce que** tu veux.* |
    | **ce dont** | verb + de | *Voilà **ce dont** j'ai besoin.* |

    ### Uses
    - Indirect questions: *Dis-moi **ce que** tu penses.* (not *qu'est-ce que*)
    - At the start, for emphasis: ***Ce que** j'aime ici, c'est le calme.*
    - *Tout ce qui / tout ce que* = everything that: *Prends **tout ce que** tu veux.*
    - Referring to a whole clause: *Il pleut, **ce qui** est rare en août.* (which)

    ### Qu'est-ce que vs ce que
    Direct question: *Qu'est-ce que tu fais ?* Indirect: *Je me demande **ce que** tu fais.*
  examples:
    - { es: "Ce qui me plaît dans les Calanques, c'est la couleur de l'eau.", en: "What I like about the Calanques is the colour of the water." }
    - { es: "Je ne comprends pas ce qu'il dit.", en: "I don't understand what he's saying." }
    - { es: "Une serviette et de l'eau, c'est tout ce dont tu as besoin.", en: "A towel and some water is all you need." }
    - { es: "Nous avons marché six heures, ce qui était trop.", en: "We walked for six hours, which was too much." }
  pitfalls:
    - "Not *Je ne sais pas qu'est-ce que tu veux*: *ce que tu veux*."
    - "*Ce qui* + verb, *ce que* + subject: *ce qui arrive* / *ce que je vois*."
  related: [g.relative-qui-que, g.relative-dont, g.indirect-questions, g.ce-qui-c-est]
  drills:
    - { es: "Fais ce que tu veux.", en: "Do what you want." }
    - { es: "Ce qui est important, c'est de bien boire.", en: "What's important is to drink plenty." }
    - { es: "Je ne sais pas ce dont il parle.", en: "I don't know what he's talking about." }
- id: g.demonstrative-pronouns
  level: b1
  title: "Demonstrative pronouns: celui, celle, ceux, celles"
  summary: "the one(s): celui-ci / celle-là, celui de Paul, celle qui est à droite. Ça / cela / ceci for ideas."
  explanation: |
    | | singular | plural |
    |---|---|---|
    | masculine | **celui** | **ceux** |
    | feminine | **celle** | **celles** |

    They can't stand alone; they need:
    - **-ci / -là**: *Quelle crique ? **Celle-ci** ou **celle-là** ?* (this one / that one)
    - **de** + noun: *Mon sac et **celui de** Paul.* (Paul's)
    - **a relative**: ***Celui qui** arrive le premier gagne. **Ceux que** j'ai vus.*

    ### Neutral: ça, cela, ceci
    - *ça* (spoken) / *cela* (written): an idea, a situation, an unnamed thing: *Ça me plaît. Cela dépend.*
    - *ceci* = this (formal, announcing): *Lisez ceci.*
    - *C'est ça !* (That's it!) *Ça va.* *Comme ci, comme ça.*
  examples:
    - { es: "Quelle calanque tu préfères ? — Celle d'En-Vau.", en: "Which calanque do you prefer? — The En-Vau one." }
    - { es: "Ceux qui aiment marcher iront à pied.", en: "Those who like walking will go on foot." }
    - { es: "Ce kayak est plus stable que celui-là.", en: "This kayak is more stable than that one." }
    - { es: "Ça m'est égal.", en: "I don't mind." }
  pitfalls:
    - "Not *le de Paul*: *celui de Paul*."
    - "*Ceux* (masc. plural) [sø]; *celles* (fem. plural)."
    - "*Cela* in writing, *ça* in speech: same meaning."
  related: [g.demonstratives, g.relative-qui-que, g.possessive-pronouns]
  drills:
    - { es: "Je prends celle-ci.", en: "I'll take this one." }
    - { es: "Ce sont ceux que j'ai achetés hier.", en: "They're the ones I bought yesterday." }
    - { es: "Ta voiture est plus rapide que celle de ton frère.", en: "Your car is faster than your brother's." }
- id: g.quelque-chose-de
  level: b1
  title: "Quelque chose de beau, rien d'important, quoi de neuf ?"
  summary: "Indefinite pronouns + de + masculine adjective: quelque chose de nouveau, personne d'autre, rien de spécial."
  explanation: |
    After *quelque chose, rien, quelqu'un, personne, quoi*, add **de / d'** + an adjective in the **masculine singular**:

    | | example |
    |---|---|
    | *quelque chose de* | *quelque chose **de** magnifique* |
    | *rien de* | *Rien **de** grave. Rien **d'**autre ?* |
    | *quelqu'un de* | *quelqu'un **de** très sympa* (even for a woman) |
    | *personne de* | *Je ne connais personne **d'**aussi drôle.* |
    | *quoi de* | ***Quoi de neuf ?*** (What's new?) |
    | *ce que … de* | *C'est ce qu'il y a **de** mieux.* |

    ### With an infinitive: à
    *quelque chose **à** boire, rien **à** faire, quelqu'un **à** qui parler*: *Tu veux quelque chose à manger ?*

    ### Rien / quelque chose d'autre
    *Vous désirez autre chose ?* / *Rien d'autre, merci.*
  examples:
    - { es: "On a vu quelque chose d'incroyable dans la calanque.", en: "We saw something incredible in the cove." }
    - { es: "Il n'y a rien d'intéressant à la télé.", en: "There's nothing interesting on TV." }
    - { es: "C'est quelqu'un de très calme.", en: "She's a very calm person." }
    - { es: "Tu veux quelque chose à boire ?", en: "Do you want something to drink?" }
  pitfalls:
    - "Not *quelque chose beau*: *quelque chose de beau*."
    - "The adjective stays masculine: *quelqu'un de gentil*, even about a woman."
  related: [g.indefinite-pronouns, g.ce-qui-ce-que]
  drills:
    - { es: "Rien de spécial.", en: "Nothing special." }
    - { es: "J'ai besoin de quelque chose de plus simple.", en: "I need something simpler." }
    - { es: "Il n'y a rien à faire.", en: "There's nothing to be done." }
- id: g.subjonctif-forms
  level: b1
  title: "The present subjonctif: forms"
  summary: "Stem of ils (present) minus -ent + -e, -es, -e, -ions, -iez, -ent: qu'ils finissent → que je finisse."
  explanation: |
    **Stem**: the *ils* form of the present without *-ent*. **Endings**: *-e, -es, -e, -ions, -iez, -ent*.

    | | parler (ils parl-ent) | finir (ils finiss-ent) | partir (ils part-ent) |
    |---|---|---|---|
    | que je | parl**e** | finiss**e** | part**e** |
    | que tu | parl**es** | finiss**es** | part**es** |
    | qu'il / elle | parl**e** | finiss**e** | part**e** |
    | que nous | parl**ions** | finiss**ions** | part**ions** |
    | que vous | parl**iez** | finiss**iez** | part**iez** |
    | qu'ils / elles | parl**ent** | finiss**ent** | part**ent** |

    ### Two-stem verbs
    Verbs whose *nous* form differs keep that difference with *nous / vous* (= imparfait forms):

    | verb | je, tu, il, ils | nous, vous |
    |---|---|---|
    | prendre | *que je **prenn**e* | *que nous **pren**ions* |
    | venir | *que je **vienn**e* | *que nous **ven**ions* |
    | boire | *que je **boiv**e* | *que nous **buv**ions* |
    | voir | *que je **voi**e* | *que nous **voy**ions* |
    | devoir, recevoir | *que je **doiv**e, **reçoiv**e* | *que nous **dev**ions, **recev**ions* |

    For -er verbs, the singular and *ils* sound just like the present; only *nous / vous* differ (*-ions, -iez*).

    The subjonctif almost always appears after *que*, in a clause that depends on a verb of will, emotion, necessity or doubt.
  examples:
    - { es: "Il faut que tu parles au professeur.", en: "You need to talk to the teacher." }
    - { es: "Je veux que vous finissiez avant midi.", en: "I want you to finish before noon." }
    - { es: "Il est temps que nous partions.", en: "It's time we left." }
    - { es: "Ma mère veut que je prenne le train.", en: "My mother wants me to take the train." }
  pitfalls:
    - "*Que nous parlions* (subjonctif) has an i: *nous parlons* is the indicative."
    - "Take the stem from *ils*: *ils finissent → que je finisse*, not *que je finis*."
  related: [g.subjonctif-irregular, g.subjonctif-volonte, g.subjonctif-necessite]
  drills:
    - { es: "Il faut que je parte.", en: "I have to leave." }
    - { es: "Je veux que tu viennes.", en: "I want you to come." }
    - { es: "Elle préfère que nous prenions le bus.", en: "She prefers us to take the bus." }
- id: g.subjonctif-irregular
  level: b1
  title: "Irregular subjonctifs: être, avoir, aller, faire, pouvoir, savoir, vouloir"
  summary: "que je sois, que j'aie, que j'aille, que je fasse, que je puisse, que je sache, que je veuille."
  explanation: |
    | | être | avoir | aller | faire |
    |---|---|---|---|---|
    | que je / j' | **sois** | **aie** | **aille** | **fasse** |
    | que tu | sois | aies | ailles | fasses |
    | qu'il / elle | **soit** | **ait** | aille | fasse |
    | que nous | **soyons** | **ayons** | **allions** | fassions |
    | que vous | **soyez** | **ayez** | **alliez** | fassiez |
    | qu'ils / elles | soient | aient | aillent | fassent |

    | | pouvoir | savoir | vouloir |
    |---|---|---|---|
    | que je | **puisse** | **sache** | **veuille** |
    | que nous | puissions | sachions | **voulions** |
    | qu'ils | puissent | sachent | **veuillent** |

    Impersonal: *qu'il faille* (falloir), *qu'il pleuve* (pleuvoir), *que ça vaille* (valoir).

    *Être* and *avoir* end in **-t** in the *il* form: *qu'il soit, qu'il ait*.
  examples:
    - { es: "Je veux que tu sois heureuse ici.", en: "I want you to be happy here." }
    - { es: "Il faut que j'aille à la banque.", en: "I have to go to the bank." }
    - { es: "Mes parents veulent que je fasse des études de droit.", en: "My parents want me to study law." }
    - { es: "Pourvu qu'il fasse beau demain !", en: "Let's hope it's nice tomorrow!" }
  pitfalls:
    - "*Que j'aie* (avoir) and *que j'aille* (aller) look alike: *aie* [ɛ], *aille* [aj]."
    - "*Qu'il ait*, not *qu'il aie*; *qu'il soit*, not *qu'il soie*."
    - "*Que nous soyons / ayons*: no i after y."
  related: [g.subjonctif-forms, g.subjonctif-volonte, g.imperative]
  drills:
    - { es: "Il faut que vous ayez votre passeport.", en: "You need to have your passport." }
    - { es: "Je doute qu'il puisse venir.", en: "I doubt he can come." }
    - { es: "Elle veut que nous sachions la vérité.", en: "She wants us to know the truth." }
- id: g.subjonctif-volonte
  level: b1
  title: "Subjonctif after wishes and wants: je veux que tu viennes"
  summary: "vouloir que, aimer que, préférer que, souhaiter que, demander que, exiger que, accepter que + subjonctif."
  explanation: |
    When one person wants **another** person to do something, French uses *que* + subjonctif:

    | verb | example |
    |---|---|
    | *vouloir que* | *Je veux **que tu viennes** à Aix.* |
    | *aimer (bien) que* / *j'aimerais que* | *J'aimerais **que vous restiez**.* |
    | *préférer que* | *Elle préfère **qu'on parte** tôt.* |
    | *souhaiter que* | *Je souhaite **que tout se passe** bien.* |
    | *demander que, exiger que* | *Le prof exige **que nous soyons** à l'heure.* |
    | *accepter que, refuser que* | *Il refuse **que je paie**.* |
    | *attendre que* | *J'attends **que tu finisses**.* |

    English uses an infinitive ("I want you to come"); French **cannot**: *Je veux te venir* is impossible.

    ### Espérer is different
    *Espérer que* takes the **indicative**: *J'espère que tu **viendras**.*
  examples:
    - { es: "Mes parents veulent que je fasse mes études à Aix.", en: "My parents want me to study in Aix." }
    - { es: "Je préfère que tu me dises la vérité.", en: "I'd rather you told me the truth." }
    - { es: "Cézanne voulait qu'on voie la montagne autrement.", en: "Cézanne wanted people to see the mountain differently." }
    - { es: "J'espère que vous aimerez la ville.", en: "I hope you'll like the city." }
  pitfalls:
    - "Not *je veux que tu viens*: *je veux que tu viennes*."
    - "Not *je veux toi venir*: French needs *que* + subjonctif."
    - "*Espérer que* + indicative, not subjonctif."
  related: [g.subjonctif-forms, g.subjonctif-vs-infinitive, g.subjonctif-emotion]
  drills:
    - { es: "Je veux que tu m'appelles.", en: "I want you to call me." }
    - { es: "Elle aimerait que nous venions dîner.", en: "She'd like us to come for dinner." }
    - { es: "Le guide demande que nous restions ensemble.", en: "The guide asks us to stay together." }
- id: g.subjonctif-emotion
  level: b1
  title: "Subjonctif after feelings: je suis content que tu sois là"
  summary: "être content / triste / surpris / désolé que, avoir peur que, regretter que, c'est dommage que + subjonctif."
  explanation: |
    Expressions of **emotion** about someone else's action take the subjonctif:

    | expression | example |
    |---|---|
    | *être content / heureux / ravi que* | *Je suis ravi **que vous soyez** venus.* |
    | *être triste / déçu que* | *Elle est déçue **qu'il ne vienne** pas.* |
    | *être surpris / étonné que* | *Je suis surpris **que ce soit** si cher.* |
    | *être désolé que, regretter que* | *Je regrette **que tu partes**.* |
    | *avoir peur que, craindre que* | *J'ai peur **qu'il (ne) pleuve**.* |
    | *c'est dommage que* | ***C'est dommage qu'**on n'ait pas plus de temps.* |
    | *ça m'énerve que* | *Ça m'énerve **qu'il soit** toujours en retard.* |

    The subjonctif here expresses the feeling, not a fact being stated: even if the fact is true.

    After *avoir peur que* / *craindre que*, a "*ne* explétif" may appear in formal style (no negative meaning): see B2.
  examples:
    - { es: "Je suis heureuse que tu voies les champs de lavande.", en: "I'm happy you're seeing the lavender fields." }
    - { es: "C'est dommage que l'abbaye soit fermée aujourd'hui.", en: "It's a shame the abbey is closed today." }
    - { es: "J'ai peur que les touristes abîment les champs.", en: "I'm afraid the tourists are damaging the fields." }
    - { es: "Nous sommes surpris que le village soit si calme.", en: "We're surprised the village is so quiet." }
  pitfalls:
    - "Not *je suis content que tu es là*: *que tu sois là*."
    - "Same subject → infinitive: *Je suis content d'être là* (not *que je sois là*)."
  related: [g.subjonctif-volonte, g.subjonctif-vs-infinitive, g.ne-expletif]
  drills:
    - { es: "Je suis désolé que tu sois malade.", en: "I'm sorry you're ill." }
    - { es: "Elle est contente que nous restions.", en: "She's glad we're staying." }
    - { es: "C'est dommage qu'il pleuve.", en: "It's a pity it's raining." }
- id: g.subjonctif-necessite
  level: b1
  title: "Subjonctif after necessity: il faut que, il est important que"
  summary: "il faut que, il est nécessaire / important / essentiel / urgent que, il vaut mieux que + subjonctif."
  explanation: |
    | expression | example |
    |---|---|
    | ***il faut que*** | *Il faut **que tu voies** Gordes.* |
    | *il ne faut pas que* | *Il ne faut pas **qu'on cueille** la lavande.* (mustn't) |
    | *il est nécessaire / indispensable que* | *Il est nécessaire **que chacun fasse** un effort.* |
    | *il est important / essentiel que* | *Il est important **que vous preniez** de l'eau.* |
    | *il vaut mieux que* | *Il vaut mieux **que nous partions** tôt.* (it's better) |
    | *il est urgent que* | *Il est urgent **qu'on protège** ces paysages.* |
    | *il suffit que* | *Il suffit **que tu demandes**.* (you only need to) |
    | *il est temps que* | *Il est temps **que je rentre**.* |

    ### General or personal?
    - *Il faut partir.* — We/one must leave (general): infinitive.
    - *Il faut **que tu partes**.* — **You** must leave: subjonctif, with a specific subject.

    In speech *il faut que je…* is extremely common: *Il faut que j'y aille !* (I've got to go!)
  examples:
    - { es: "Il faut que tu viennes en juillet pour la lavande.", en: "You must come in July for the lavender." }
    - { es: "Il est important que les visiteurs restent sur les chemins.", en: "It's important for visitors to stay on the paths." }
    - { es: "Il vaut mieux que vous réserviez.", en: "You'd better book." }
    - { es: "Bon, il faut que j'y aille.", en: "Right, I've got to go." }
  pitfalls:
    - "Not *il faut que tu vas*: *il faut que tu ailles*."
    - "*Il ne faut pas que* = must not, not 'don't have to'."
  related: [g.il-faut, g.subjonctif-forms, g.subjonctif-vs-infinitive]
  drills:
    - { es: "Il faut que nous fassions attention.", en: "We must be careful." }
    - { es: "Il est essentiel que tu sois là.", en: "It's essential that you're there." }
    - { es: "Il vaut mieux qu'il parte maintenant.", en: "He'd better leave now." }
- id: g.subjonctif-vs-infinitive
  level: b1
  title: "Subjonctif or infinitive? Same subject vs different subject"
  summary: "Same subject → infinitive (je veux partir); different subject → que + subjonctif (je veux que tu partes)."
  explanation: |
    | same subject → **infinitive** | different subjects → **que + subjonctif** |
    |---|---|
    | *Je veux **partir**.* | *Je veux **que tu partes**.* |
    | *Je suis content **d'être** ici.* | *Je suis content **que tu sois** ici.* |
    | *J'ai peur **de rater** le bus.* | *J'ai peur **qu'elle rate** le bus.* |
    | *Il faut **partir**.* (general) | *Il faut **que nous partions**.* |
    | *Je pars **avant de** manger.* | *Je pars **avant qu'il** mange.* (B2) |

    Emotions take **de** before the infinitive: *content de, triste de, désolé de, avoir peur de*. Verbs of will take no preposition: *vouloir, préférer, aimer*.

    ### Past
    For an earlier action with the same subject, use the past infinitive: *Je suis content **d'avoir vu** Gordes.*
  examples:
    - { es: "Je voudrais voir l'abbaye de Sénanque.", en: "I'd like to see Sénanque abbey." }
    - { es: "Je voudrais que tu voies l'abbaye de Sénanque.", en: "I'd like you to see Sénanque abbey." }
    - { es: "Nous sommes ravis d'être en Provence.", en: "We're delighted to be in Provence." }
    - { es: "Elle a peur de se perdre.", en: "She's afraid of getting lost." }
  pitfalls:
    - "Not *je veux que je parte*: same subject → *je veux partir*."
    - "*Content de* + infinitive, *content que* + subjonctif."
  related: [g.subjonctif-volonte, g.subjonctif-emotion, g.subjonctif-necessite, g.apres-avoir-avant-de]
  drills:
    - { es: "Je préfère rester.", en: "I prefer to stay." }
    - { es: "Je préfère que tu restes.", en: "I'd rather you stayed." }
    - { es: "Il est triste de partir.", en: "He's sad to be leaving." }
- id: g.conditionnel-present
  level: b1
  title: "The conditionnel présent: forms and uses"
  summary: "Future stem + imparfait endings: je parlerais, tu irais, il ferait, nous serions. Would, could, should."
  explanation: |
    | | parler | aller (ir-) | être (ser-) |
    |---|---|---|---|
    | je | parler**ais** | ir**ais** | ser**ais** |
    | tu | parler**ais** | ir**ais** | ser**ais** |
    | il / elle | parler**ait** | ir**ait** | ser**ait** |
    | nous | parler**ions** | ir**ions** | ser**ions** |
    | vous | parler**iez** | ir**iez** | ser**iez** |
    | ils / elles | parler**aient** | ir**aient** | ser**aient** |

    Same irregular stems as the future: *aur-, fer-, pourr-, voudr-, devr-, saur-, verr-, viendr-, faudr-…*

    ### Uses
    | use | example |
    |---|---|
    | hypothesis | *Avec plus d'argent, je **voyagerais**.* |
    | politeness | ***Pourriez**-vous m'aider ?* |
    | wish | *J'**aimerais** jouer au festival.* |
    | advice | *Tu **devrais** voir ce spectacle.* |
    | future in the past | *Il a dit qu'il **viendrait**.* |
    | unconfirmed news (B2) | *Le ministre **serait** malade.* |
  examples:
    - { es: "J'aimerais jouer dans la cour du Palais des Papes.", en: "I'd love to perform in the courtyard of the Palais des Papes." }
    - { es: "Ce serait génial de voir une pièce en plein air.", en: "It would be great to see a play outdoors." }
    - { es: "Pourriez-vous nous conseiller un spectacle ?", en: "Could you recommend a show to us?" }
    - { es: "Il a promis qu'il viendrait.", en: "He promised he would come." }
  pitfalls:
    - "Conditional *-ais* vs future *-ai*: *je ferais* (would) vs *je ferai* (will)."
    - "The conditional never follows *si* (if) in a condition: *si j'avais*, not *si j'aurais*."
  related: [g.si-imparfait-conditionnel, g.conditional-advice, g.conditional-politeness, g.futur-irregular-stems]
  drills:
    - { es: "Nous voudrions deux places.", en: "We'd like two seats." }
    - { es: "Tu viendrais avec moi ?", en: "Would you come with me?" }
    - { es: "Ils seraient contents de te voir.", en: "They'd be happy to see you." }
- id: g.si-imparfait-conditionnel
  level: b1
  title: "Si + imparfait, conditionnel: imagining"
  summary: "Si j'étais riche, j'achèterais un mas en Provence. Unlikely or unreal conditions in the present or future."
  explanation: |
    | si + **imparfait** | **conditionnel présent** |
    |---|---|
    | *Si j'avais le temps,* | *je resterais une semaine.* |
    | *Si tu étais comédien,* | *tu jouerais à Avignon ?* |
    | *Si nous gagnions au loto,* | *nous achèterions une maison.* |

    Compare the three degrees of probability:
    - *Si j'ai le temps, je viendrai.* (real, possible)
    - *Si j'avais le temps, je viendrais.* (unlikely / imaginary)
    - *Si j'avais eu le temps, je serais venu.* (past, impossible now: B2)

    ### Fixed expressions
    - *Si j'étais toi / À ta place, je…* — If I were you…
    - *Et si on allait au théâtre ?* (suggestion, imparfait alone)
    - *Si seulement j'avais plus de temps !* (if only)
  examples:
    - { es: "Si j'étais comédien, je jouerais au festival d'Avignon.", en: "If I were an actor, I'd perform at the Avignon festival." }
    - { es: "Si nous habitions ici, nous irions au théâtre tous les soirs.", en: "If we lived here, we'd go to the theatre every evening." }
    - { es: "Qu'est-ce que tu ferais si tu avais un an de vacances ?", en: "What would you do if you had a year's holiday?" }
    - { es: "Si seulement il faisait moins chaud !", en: "If only it weren't so hot!" }
  pitfalls:
    - "Never the conditional after *si*: *si j'avais*, not *si j'aurais*."
    - "*Si* elides only before *il / ils*: *s'il pouvait*."
  related: [g.conditionnel-present, g.si-present-futur, g.si-plus-que-parfait, g.imparfait-forms]
  drills:
    - { es: "Si j'avais une voiture, je visiterais le Luberon.", en: "If I had a car, I'd visit the Luberon." }
    - { es: "Si tu parlais plus fort, on t'entendrait.", en: "If you spoke louder, we'd hear you." }
    - { es: "Que ferais-tu à ma place ?", en: "What would you do in my place?" }
- id: g.conditional-advice
  level: b1
  title: "Giving advice: tu devrais, à ta place, si j'étais toi"
  summary: "Tu devrais + infinitive, Vous pourriez…, À ta place, je…, Si j'étais toi, je…, Il vaudrait mieux…"
  explanation: |
    | structure | example |
    |---|---|
    | ***tu devrais / vous devriez*** + infinitive | *Tu devrais réserver tes places.* (you should) |
    | ***tu pourrais / vous pourriez*** + infinitive | *Vous pourriez voir le spectacle off.* (you could) |
    | ***à ta place / à votre place***, + conditional | *À ta place, je partirais plus tôt.* |
    | ***si j'étais toi / vous***, + conditional | *Si j'étais vous, je prendrais un chapeau.* |
    | ***il vaudrait mieux*** + inf. / *que* + subj. | *Il vaudrait mieux y aller le matin.* |
    | ***tu ferais mieux de*** + infinitive | *Tu ferais mieux de te reposer.* (you'd better) |
    | ***je te conseille de*** + infinitive | *Je te conseille d'arriver tôt.* |

    ### Reproaches in the past (B2)
    *Tu aurais dû réserver !* (You should have booked!)
  examples:
    - { es: "Tu devrais aller voir une pièce dans le festival off.", en: "You should go and see a play in the fringe festival." }
    - { es: "À ta place, je réserverais tout de suite.", en: "If I were you, I'd book straight away." }
    - { es: "Il vaudrait mieux traverser le pont à pied.", en: "It would be better to cross the bridge on foot." }
    - { es: "Vous feriez mieux de prendre un chapeau.", en: "You'd better take a hat." }
  pitfalls:
    - "*Tu devrais* (should), not *tu dois* (must) for friendly advice."
    - "*Faire mieux de* + infinitive: *tu ferais mieux de partir*, not *tu ferais mieux partir*."
  related: [g.conditionnel-present, g.si-imparfait-conditionnel, g.regret-reproach]
  drills:
    - { es: "Tu devrais dormir un peu.", en: "You should get some sleep." }
    - { es: "Si j'étais toi, je lui dirais.", en: "If I were you, I'd tell him." }
    - { es: "Vous pourriez demander au guide.", en: "You could ask the guide." }
- id: g.plus-que-parfait
  level: b1
  title: "The plus-que-parfait: j'avais vu, elle était partie"
  summary: "imparfait of avoir/être + past participle: an action that happened before another past action (had done)."
  explanation: |
    | | avoir | être |
    |---|---|---|
    | j' / je | **avais** peint | **étais** parti(e) |
    | tu | avais peint | étais parti(e) |
    | il / elle | avait peint | était parti(e) |
    | nous | avions peint | étions parti(e)s |
    | vous | aviez peint | étiez parti(e)(s) |
    | ils / elles | avaient peint | étaient parti(e)s |

    Same auxiliary choice and agreement rules as the passé composé.

    ### Use: one step further back
    ```
    plus-que-parfait  →  passé composé / imparfait  →  now
    ```
    - *Quand je suis arrivé, le train **était** déjà **parti**.* (it left first)
    - *Van Gogh **avait** déjà **peint** beaucoup de tableaux avant d'arriver à Arles.*

    ### Other uses
    - Explanations: *J'étais fatigué : je n'**avais** pas **dormi**.*
    - Regrets with *si* (B2): *Si j'**avais su**…*
    - Reported speech (backshift): *Il a dit qu'il **avait fini**.*
  examples:
    - { es: "Quand Van Gogh est arrivé à Arles, il avait déjà vécu à Paris.", en: "When Van Gogh arrived in Arles, he had already lived in Paris." }
    - { es: "Je n'ai pas reconnu le tableau : je ne l'avais jamais vu.", en: "I didn't recognise the painting: I had never seen it." }
    - { es: "Elle était déjà partie quand nous sommes arrivés.", en: "She had already left when we arrived." }
    - { es: "Ils avaient réservé, mais l'hôtel était complet.", en: "They had booked, but the hotel was full." }
  pitfalls:
    - "English often uses the simple past where French needs the plus-que-parfait: *He said he had seen it* → *Il a dit qu'il l'avait vu*."
    - "Don't overuse it: if events are told in order, the passé composé is enough."
  related: [g.pc-vs-imparfait, g.discours-indirect-past, g.si-plus-que-parfait, g.passe-anterieur]
  drills:
    - { es: "J'avais oublié mon appareil photo.", en: "I had forgotten my camera." }
    - { es: "Nous étions déjà sortis.", en: "We had already gone out." }
    - { es: "Il m'a dit qu'il avait trouvé un appartement.", en: "He told me he had found a flat." }
- id: g.apres-avoir-avant-de
  level: b1
  title: "Avant de + infinitive, après avoir / être + participle"
  summary: "Avant de partir (before leaving); après avoir mangé, après être arrivé(e) (after eating / arriving): same subject only."
  explanation: |
    | structure | example |
    |---|---|
    | ***avant de*** + infinitive | *Je prends un café **avant de** partir.* |
    | ***après avoir*** + participle | ***Après avoir visité** l'arène, nous avons déjeuné.* |
    | ***après être*** + participle (être verbs) | ***Après être arrivée** à Arles, elle a appelé sa mère.* |
    | pronominal | ***Après s'être reposés**, ils sont repartis.* |

    The **past infinitive** (*avoir / être* + participle) shows that the action is completed. With *être*, the participle agrees with the subject.

    ### Same subject only
    Both actions must have the same subject. Otherwise use a clause:
    - *Après **qu'il** est parti…* (indicative)
    - *Avant **qu'il** parte…* (subjonctif: B2)

    English "after eating" → never *après manger* in careful French (heard in speech, and in *après manger* = after the meal, colloquial).
  examples:
    - { es: "Après avoir vu les Alyscamps, nous sommes allés au café.", en: "After seeing the Alyscamps, we went to the café." }
    - { es: "Van Gogh a peint la Maison jaune avant de tomber malade.", en: "Van Gogh painted the Yellow House before he fell ill." }
    - { es: "Après être rentrés, ils ont regardé les photos.", en: "After getting home, they looked at the photos." }
    - { es: "Réfléchis avant de répondre.", en: "Think before you answer." }
  pitfalls:
    - "*Avant de* + infinitive, not *avant* + infinitive: *avant de partir*."
    - "*Après avoir mangé*, not *après manger* (in writing)."
    - "*Être* verbs: *après être sorti(e)*, not *après avoir sorti* (unless there's an object)."
  related: [g.time-clauses, g.subjonctif-vs-infinitive, g.subjonctif-conjonctions]
  drills:
    - { es: "Après avoir fini, il est parti.", en: "After finishing, he left." }
    - { es: "Lave-toi les mains avant de manger.", en: "Wash your hands before eating." }
    - { es: "Après s'être levée, elle a pris une douche.", en: "After getting up, she had a shower." }
- id: g.time-clauses
  level: b1
  title: "Time clauses: quand, lorsque, dès que, pendant que, depuis que"
  summary: "quand / lorsque (when), dès que (as soon as), pendant que (while), depuis que (since), jusqu'à ce que (until, + subjonctif)."
  explanation: |
    | conjunction | meaning | mood | example |
    |---|---|---|---|
    | *quand, lorsque* | when | indicative | ***Lorsque** Gauguin est arrivé, Van Gogh était ravi.* |
    | *dès que, aussitôt que* | as soon as | indicative | ***Dès qu'**il a vu la lumière, il a voulu peindre.* |
    | *pendant que* | while (same time) | indicative | *Il peignait **pendant que** Gauguin dormait.* |
    | *alors que, tandis que* | while (contrast) | indicative | *Il aimait le jaune **alors que** Gauguin préférait le rouge.* |
    | *depuis que* | (ever) since | indicative | ***Depuis qu'**il habite ici, il est plus calme.* |
    | *après que* | after | indicative | ***Après qu'**il est parti…* |
    | *avant que* | before | **subjonctif** | *Avant qu'il (ne) parte…* (B2) |
    | *jusqu'à ce que* | until | **subjonctif** | *Attends **jusqu'à ce que** je revienne.* |

    ### Tenses
    - Future actions: future after *quand, dès que* (A2): *Dès que tu arriveras, appelle-moi.*
    - An action completed before another: futur antérieur / plus-que-parfait: *Dès qu'il avait fini, il sortait.*
  examples:
    - { es: "Lorsque Van Gogh est arrivé à Arles, il neigeait.", en: "When Van Gogh arrived in Arles, it was snowing." }
    - { es: "Dès que j'ai vu ce tableau, je l'ai reconnu.", en: "As soon as I saw this painting, I recognised it." }
    - { es: "Pendant que tu visites le musée, je vais au marché.", en: "While you visit the museum, I'll go to the market." }
    - { es: "Depuis qu'elle fait de la photo, elle voit la ville autrement.", en: "Since she took up photography, she sees the town differently." }
  pitfalls:
    - "*Après que* takes the indicative in standard French (the subjonctif is common but considered incorrect)."
    - "*Pendant que* (while) + clause; *pendant* (during) + noun."
  related: [g.quand-futur, g.apres-avoir-avant-de, g.subjonctif-conjonctions, g.futur-anterieur]
  drills:
    - { es: "Quand il est entré, tout le monde s'est tu.", en: "When he came in, everyone went quiet." }
    - { es: "Il lit pendant que les enfants dorment.", en: "He reads while the children sleep." }
    - { es: "Dès qu'elle est arrivée, on a commencé.", en: "As soon as she arrived, we started." }
- id: g.discours-indirect
  level: b1
  title: "Reported speech in the present: il dit que…"
  summary: "With a reporting verb in the present, keep the tense; change pronouns and possessives: « Je suis gardian » → Il dit qu'il est gardian."
  explanation: |
    | direct speech | reported speech |
    |---|---|
    | *« Je suis gardian. »* | *Il dit **qu'il est** gardian.* |
    | *« J'ai vu les flamants. »* | *Elle dit **qu'elle a vu** les flamants.* |
    | *« Nous viendrons. »* | *Ils disent **qu'ils viendront**.* |
    | *« Venez ! »* (command) | *Il nous dit **de venir**.* |
    | *« Ne touchez pas ! »* | *Il nous dit **de ne pas toucher**.* |

    ### What changes
    - **Pronouns and possessives**: *je → il / elle, mon → son, nous → ils*.
    - **Que** is compulsory before each clause: *Il dit **qu'**il est fatigué et **qu'**il veut rentrer.*
    - **Commands** → *dire / demander à quelqu'un **de*** + infinitive.

    When the reporting verb is in the present (*dit, explique, répond*), the tenses **don't** change. In the past, they shift (next note).

    French writing marks direct speech with « guillemets » and a dash for changes of speaker.
  examples:
    - { es: "Le gardian dit que les chevaux sont nés blancs.", en: "The gardian says the horses are born white." }
    - { es: "Elle explique qu'elle travaille ici depuis vingt ans.", en: "She explains that she's worked here for twenty years." }
    - { es: "Le guide nous demande de ne pas faire de bruit.", en: "The guide asks us not to make any noise." }
    - { es: "Il répond qu'il viendra demain.", en: "He replies that he'll come tomorrow." }
  pitfalls:
    - "Never leave out *que*: *il dit qu'il est là*, not *il dit il est là*."
    - "Commands: *dire de* + infinitive: *Il m'a dit de partir*, not *Il m'a dit que partir*."
  related: [g.discours-indirect-past, g.indirect-questions, g.reporting-verbs]
  drills:
    - { es: "Marie dit qu'elle est fatiguée.", en: "Marie says she's tired." }
    - { es: "Il me dit de l'attendre.", en: "He tells me to wait for him." }
    - { es: "Ils disent que la plage est loin.", en: "They say the beach is far." }
- id: g.discours-indirect-past
  level: b1
  title: "Reported speech in the past: il a dit qu'il viendrait"
  summary: "After a past reporting verb: present → imparfait, passé composé → plus-que-parfait, future → conditionnel."
  explanation: |
    When the reporting verb is in the **past** (*il a dit, elle expliquait*), the tenses shift back:

    | direct speech | → | reported (past) |
    |---|---|---|
    | présent: *« J'habite ici. »* | → | imparfait: *Il a dit qu'il **habitait** là.* |
    | passé composé: *« J'ai vu les taureaux. »* | → | plus-que-parfait: *Il a dit qu'il **avait vu** les taureaux.* |
    | futur: *« Je reviendrai. »* | → | conditionnel: *Il a dit qu'il **reviendrait**.* |
    | futur proche: *« Je vais partir. »* | → | *Il a dit qu'il **allait** partir.* |
    | imparfait, plus-que-parfait, conditionnel | → | no change |

    ### Time words also shift (B2)
    *aujourd'hui → ce jour-là, demain → le lendemain, hier → la veille, ici → là*.

    In speech, if the fact is still true, people often keep the present: *Il m'a dit qu'il habite à Arles.*
  examples:
    - { es: "Le gardian m'a dit que les taureaux n'étaient pas dangereux.", en: "The gardian told me the bulls weren't dangerous." }
    - { es: "Elle a dit qu'elle avait vu des flamants roses.", en: "She said she had seen pink flamingos." }
    - { es: "Ils ont promis qu'ils reviendraient l'année prochaine.", en: "They promised they would come back next year." }
    - { es: "Tu m'avais dit que tu allais m'appeler !", en: "You'd told me you were going to call me!" }
  pitfalls:
    - "Future → conditional: *il a dit qu'il viendrait*, not *qu'il viendra* (in careful French)."
    - "Don't shift the imparfait: *« J'étais fatigué »* → *il a dit qu'il était fatigué*."
  related: [g.discours-indirect, g.plus-que-parfait, g.conditionnel-present, g.concordance-des-temps]
  drills:
    - { es: "Il a dit qu'il était malade.", en: "He said he was ill." }
    - { es: "Elle m'a expliqué qu'elle avait raté le train.", en: "She explained that she had missed the train." }
    - { es: "Vous aviez dit que vous seriez là.", en: "You had said you would be there." }
- id: g.indirect-questions
  level: b1
  title: "Indirect questions: il demande si, où, ce que…"
  summary: "Yes/no → si; question words stay (où, quand, comment, pourquoi); qu'est-ce que → ce que; qu'est-ce qui → ce qui. No inversion, no est-ce que."
  explanation: |
    | direct question | indirect question |
    |---|---|
    | *« Tu viens ? »* | *Il demande **si** je viens.* |
    | *« Où habites-tu ? »* | *Il demande **où** j'habite.* |
    | *« Quand est-ce que tu pars ? »* | *Il demande **quand** je pars.* |
    | *« Qu'est-ce que tu veux ? »* | *Il demande **ce que** je veux.* |
    | *« Qu'est-ce qui se passe ? »* | *Il demande **ce qui** se passe.* |
    | *« Qui est-ce ? »* | *Il demande **qui** c'est.* |

    ### Rules
    - **Normal word order** (subject + verb): no inversion, no *est-ce que*.
    - **No question mark**: *Je me demande où il est.*
    - *Si* + *il / ils* → *s'il, s'ils*.
    - With a past reporting verb, tenses shift as in reported speech: *Il m'a demandé si j'**avais** faim.*

    Common introductions: *demander, se demander, savoir* (*je ne sais pas si…*), *dire* (*dis-moi où…*), *expliquer, comprendre*.
  examples:
    - { es: "Le touriste demande si on peut monter à cheval.", en: "The tourist asks whether you can go horse riding." }
    - { es: "Je me demande pourquoi les flamants sont roses.", en: "I wonder why flamingos are pink." }
    - { es: "Dis-moi ce que tu as vu.", en: "Tell me what you saw." }
    - { es: "Elle m'a demandé où j'avais acheté mon chapeau.", en: "She asked me where I had bought my hat." }
  pitfalls:
    - "Not *Je ne sais pas qu'est-ce qu'il veut*: *ce qu'il veut*."
    - "Not *Il demande où habites-tu*: *où j'habite* (no inversion)."
  related: [g.discours-indirect, g.ce-qui-ce-que, g.question-words]
  drills:
    - { es: "Je ne sais pas s'il viendra.", en: "I don't know whether he'll come." }
    - { es: "Elle demande quand le bateau part.", en: "She's asking when the boat leaves." }
    - { es: "Je me demande ce qui s'est passé.", en: "I wonder what happened." }
- id: g.reporting-verbs
  level: b1
  title: "Reporting verbs beyond dire"
  summary: "expliquer, répondre, ajouter, affirmer, promettre, avouer, demander, proposer, conseiller, rappeler…"
  explanation: |
    | verb | construction | example |
    |---|---|---|
    | *expliquer, affirmer, prétendre* | + que | *Il **explique que** la Camargue est un delta.* |
    | *répondre, ajouter, annoncer* | + que | *Elle **a ajouté qu'**il fallait réserver.* |
    | *avouer, admettre, reconnaître* | + que | *Il **a avoué qu'**il avait peur.* |
    | *promettre* | + que / + de + inf. | *Il **a promis de** revenir.* |
    | *demander* | + si / à qqn de + inf. | *Je **lui ai demandé de** m'attendre.* |
    | *proposer, conseiller* | à qqn de + inf. | *Il **nous a conseillé de** partir tôt.* |
    | *rappeler* | à qqn de + inf. / que | ***Rappelle-moi d'**acheter du pain.* |
    | *ordonner, interdire, permettre* | à qqn de + inf. | *Il **nous a interdit de** nager.* |
    | *se plaindre* | de / que | *Elle **se plaint que** c'est trop cher.* |
    | *s'excuser* | de + inf. | *Il **s'est excusé d'**être en retard.* |

    In narrative writing, verbs like *s'exclamer, murmurer, crier, soupirer* follow direct speech with inversion: *« Quelle chaleur ! » **soupira-t-elle**.*
  examples:
    - { es: "Le gardian nous a expliqué que les chevaux vivaient en liberté.", en: "The gardian explained to us that the horses lived free." }
    - { es: "Elle m'a conseillé de visiter les Saintes-Maries-de-la-Mer.", en: "She advised me to visit Saintes-Maries-de-la-Mer." }
    - { es: "Il a avoué qu'il n'était jamais monté à cheval.", en: "He admitted he had never ridden a horse." }
    - { es: "« Regardez ! » a crié l'enfant.", en: "'Look!' shouted the child." }
  pitfalls:
    - "*Demander à quelqu'un de faire*: *Je lui ai demandé de venir*, not *Je l'ai demandé de venir*."
    - "After direct speech, invert: *a-t-il dit*, *répondit-elle*, not *il a dit* after the quote in writing."
  related: [g.discours-indirect, g.verbs-plus-infinitive, g.verbs-indirect-object]
  drills:
    - { es: "Il a répondu qu'il n'en savait rien.", en: "He replied that he knew nothing about it." }
    - { es: "Je t'avais promis de venir.", en: "I'd promised you I'd come." }
    - { es: "Elle s'est excusée d'avoir oublié.", en: "She apologised for forgetting." }
- id: g.gerondif
  level: b1
  title: "The gérondif: en + -ant"
  summary: "en parlant, en faisant: while doing (simultaneity), by doing (means), if/when (condition). Same subject as the main verb."
  explanation: |
    ### Form
    *nous* present minus *-ons* + **-ant**, after **en**:
    *nous parl**ons** → **en** parl**ant**, nous finiss**ons** → en finiss**ant**, nous fais**ons** → en fais**ant***.

    Three irregulars: *être → en **étant**, avoir → en **ayant**, savoir → en **sachant***.

    ### Uses
    | use | example | English |
    |---|---|---|
    | simultaneity | *Elle chante **en travaillant**.* | while working |
    | means / manner | *On apprend **en sentant**.* | by smelling |
    | condition | ***En partant** tôt, tu éviteras les bouchons.* | if you leave early |
    | cause | *Il s'est blessé **en tombant**.* | (by) falling |

    ***Tout en*** stresses simultaneity or contrast: *Il travaille **tout en** écoutant de la musique. **Tout en** étant riche, il vit simplement.*

    The subject of the gérondif must be the subject of the main verb: *J'ai vu Marie en sortant* = I saw Marie as **I** was leaving.
  examples:
    - { es: "C'est en sentant des milliers de fleurs qu'on devient un nez.", en: "It's by smelling thousands of flowers that you become a perfumer." }
    - { es: "Elle cueille le jasmin en chantant.", en: "She picks jasmine while singing." }
    - { es: "En arrivant à Grasse, on sent déjà les fleurs.", en: "When you arrive in Grasse, you can already smell the flowers." }
    - { es: "Tout en étant célèbre, elle reste très simple.", en: "Although she's famous, she's still very down-to-earth." }
  pitfalls:
    - "Don't forget *en*: *en marchant* (by walking), not just *marchant*."
    - "The subject must match: *En sortant, la pluie a commencé* is wrong (the rain didn't go out)."
    - "English '-ing' after a preposition is usually an infinitive in French: *sans parler, avant de partir*."
  related: [g.participe-present, g.pour-sans-infinitive, g.adjectif-verbal]
  drills:
    - { es: "Il est tombé en courant.", en: "He fell while running." }
    - { es: "En travaillant plus, tu réussiras.", en: "By working harder, you'll succeed." }
    - { es: "Ne parle pas en mangeant !", en: "Don't talk while you're eating!" }
- id: g.verbs-prepositions
  level: b1
  title: "Verbs and their prepositions: penser à, s'intéresser à, dépendre de"
  summary: "Learn verbs with their preposition: penser à / penser de, s'intéresser à, tenir à, dépendre de, se servir de, se méfier de."
  explanation: |
    | **à** | **de** |
    |---|---|
    | *penser à* (think about) | *penser de* (think of = opinion: *Qu'en penses-tu ?*) |
    | *s'intéresser à* (be interested in) | *dépendre de* (depend on) |
    | *tenir à* (be attached to, insist on) | *se servir de* (use) |
    | *s'habituer à* (get used to) | *se méfier de* (distrust) |
    | *participer à* (take part in) | *se moquer de* (make fun of) |
    | *assister à* (attend) | *s'occuper de* (take care of) |
    | *croire à / en* (believe in) | *profiter de* (make the most of) |
    | *faire attention à* | *se passer de* (do without) |
    | *jouer à* (game) / *de* (instrument) | *manquer de* (lack) |

    ### Manquer à: a famous trap
    *Tu **me manques**.* = I miss you (literally: you are missing to me). *Paris **lui manque**.* = She misses Paris.

    ### Pronouns
    *à* + thing → *y*; *de* + thing → *en*; people → *à lui, d'elle* (stressed pronouns) after *penser à, s'intéresser à, se méfier de*: *Je pense à lui.*
  examples:
    - { es: "Elle s'intéresse beaucoup à la parfumerie.", en: "She's very interested in perfume-making." }
    - { es: "Le prix dépend de la qualité des fleurs.", en: "The price depends on the quality of the flowers." }
    - { es: "Qu'est-ce que tu penses de ce parfum ?", en: "What do you think of this perfume?" }
    - { es: "La Provence me manque.", en: "I miss Provence." }
  pitfalls:
    - "*Je te manque* = you miss me (not I miss you)."
    - "*Assister à* = attend: *assister à un cours*; it doesn't mean 'assist'."
    - "*Penser à* (think about) vs *penser de* (have an opinion of)."
  related: [g.verbs-indirect-object, g.verbs-plus-infinitive, g.pronoun-y, g.pronoun-en]
  drills:
    - { es: "Je pense souvent à toi.", en: "I often think about you." }
    - { es: "Il se sert d'un alambic.", en: "He uses a still." }
    - { es: "Tu me manques beaucoup.", en: "I miss you a lot." }
- id: g.pour-sans-infinitive
  level: b1
  title: "Pour, sans, au lieu de + infinitive"
  summary: "Prepositions are followed by the infinitive in French (not -ing): pour apprendre, sans parler, au lieu de rester."
  explanation: |
    | preposition | meaning | example |
    |---|---|---|
    | ***pour*** + inf. | (in order) to | *Je suis venu **pour apprendre**.* |
    | ***sans*** + inf. | without …-ing | *Il est parti **sans dire** au revoir.* |
    | ***au lieu de*** + inf. | instead of …-ing | ***Au lieu de** regarder, essaie !* |
    | ***avant de*** + inf. | before …-ing | ***avant de** partir* |
    | ***afin de*** + inf. (formal) | in order to | ***afin de** préserver la tradition* |
    | ***de peur de*** + inf. | for fear of | ***de peur de** se tromper* |
    | ***à force de*** + inf. | by dint of | ***À force de** sentir, on reconnaît tout.* |

    Exception: ***en*** + present participle (gérondif): *en travaillant*. *Après* takes a past infinitive: *après avoir travaillé*.

    ### Sans + noun
    No article after *sans* in general statements: *sans sucre, sans problème, sans doute*.

    With a different subject, use *pour que / sans que* + subjonctif (B2).
  examples:
    - { es: "On cueille les roses tôt le matin pour garder leur parfum.", en: "Roses are picked early in the morning to keep their scent." }
    - { es: "Il a créé ce parfum sans utiliser d'alcool.", en: "He created this perfume without using alcohol." }
    - { es: "Au lieu d'acheter un parfum, crée le tien !", en: "Instead of buying a perfume, create your own!" }
    - { es: "Je ne dis rien de peur de me tromper.", en: "I'm not saying anything for fear of being wrong." }
  pitfalls:
    - "Not *sans parlant*: *sans parler*."
    - "'For' + -ing is not *pour* + -ant: *merci d'être venu* (thanks for coming)."
  related: [g.gerondif, g.apres-avoir-avant-de, g.purpose-clauses]
  drills:
    - { es: "Il travaille pour payer ses études.", en: "He works to pay for his studies." }
    - { es: "Elle est sortie sans manteau.", en: "She went out without a coat." }
    - { es: "Au lieu de te plaindre, aide-moi.", en: "Instead of complaining, help me." }
- id: g.passive-voice
  level: b1
  title: "The passive voice: être + participle"
  summary: "être (in any tense) + past participle agreeing with the subject: La Palme d'or est remise par le jury."
  explanation: |
    | tense | active | passive |
    |---|---|---|
    | présent | *Le jury **remet** la Palme.* | *La Palme **est remise** par le jury.* |
    | passé composé | *On **a choisi** le film.* | *Le film **a été choisi**.* |
    | imparfait | *Les fans **attendaient** l'actrice.* | *L'actrice **était attendue** par les fans.* |
    | futur | *Le public **verra** le film.* | *Le film **sera vu** par le public.* |
    | infinitive | | *Le film va **être projeté**.* |

    The tense is carried by *être*; the participle **always agrees** with the subject: *Les films **ont été** sélectionné**s**.*

    ### When to use it
    French uses the passive less than English. It's common in news, formal writing and when the doer is unknown or unimportant. In speech, prefer *on* or an active sentence.

    Only verbs with a **direct object** can be passive: *On m'a donné un prix* → *J'ai reçu un prix* (not *J'ai été donné un prix*).
  examples:
    - { es: "La Palme d'or est décernée le dernier jour du festival.", en: "The Palme d'or is awarded on the last day of the festival." }
    - { es: "Le Palais des Festivals a été construit en 1982.", en: "The Palais des Festivals was built in 1982." }
    - { es: "Les acteurs seront accueillis sur le tapis rouge.", en: "The actors will be welcomed on the red carpet." }
    - { es: "Ce film a été tourné à Nice.", en: "This film was shot in Nice." }
  pitfalls:
    - "Agreement: *Les actrices ont été invitées*."
    - "'I was given' cannot be passive in French: *On m'a donné…* or *J'ai reçu…*"
    - "Don't confuse the passive with *être* + participle in the passé composé: *Elle est partie* is active."
  related: [g.agent-par-de, g.on-instead-of-passive, g.pronominal-passive, g.impersonal-passive-formal]
  drills:
    - { es: "Le film a été applaudi.", en: "The film was applauded." }
    - { es: "Les billets sont vendus en ligne.", en: "Tickets are sold online." }
    - { es: "La cérémonie sera retransmise à la télévision.", en: "The ceremony will be broadcast on television." }
- id: g.on-instead-of-passive
  level: b1
  title: "On and se instead of the passive"
  summary: "In everyday French, prefer on (On a volé ma valise) or a pronominal verb (Ça se vend bien) to the passive."
  explanation: |
    English uses the passive constantly; French often prefers:

    | English passive | French with **on** | French with **se** |
    |---|---|---|
    | My bag was stolen. | ***On** m'a volé mon sac.* | |
    | French is spoken here. | *Ici, **on** parle français.* | *Le français **se parle** ici.* |
    | The film was shown in 2020. | ***On** a projeté le film en 2020.* | |
    | That isn't done. | ***On** ne fait pas ça.* | *Ça **ne se fait pas**.* |
    | These tickets sell fast. | | *Ces billets **se vendent** vite.* |
    | How is it spelt? | *Comment **on** l'écrit ?* | *Ça **s'écrit** comment ?* |

    ### Indirect objects: always on
    *I was told…* → ***On m'a dit** que…*; *We were asked to wait* → ***On nous a demandé** d'attendre.*

    The pronominal passive (B2) works for general facts and habits, with a thing as subject: *Le vin blanc se boit frais.*
  examples:
    - { es: "On m'a dit que le festival était complet.", en: "I was told the festival was sold out." }
    - { es: "On a annoncé le gagnant à vingt heures.", en: "The winner was announced at eight pm." }
    - { es: "Les places se vendent en quelques minutes.", en: "The seats sell in a few minutes." }
    - { es: "Ça ne se dit pas !", en: "That's not something you say!" }
  pitfalls:
    - "'I was told' → *on m'a dit*, never *j'ai été dit*."
    - "With *on*, the verb is third person singular: *on a annoncé*."
  related: [g.passive-voice, g.on-nous, g.pronominal-passive]
  drills:
    - { es: "On a retrouvé mon portefeuille.", en: "My wallet was found." }
    - { es: "Ce plat se mange chaud.", en: "This dish is eaten hot." }
    - { es: "On nous a demandé nos billets.", en: "We were asked for our tickets." }
- id: g.agent-par-de
  level: b1
  title: "Par or de? The agent of the passive"
  summary: "par for an action (Le film a été réalisé par…); de for states, feelings and descriptions (Elle est aimée de tous, couvert de neige)."
  explanation: |
    | **par** (action, doer) | **de** (state, feeling, description) |
    |---|---|
    | *Le film a été réalisé **par** Agnès Varda.* | *Elle est aimée **de** tous.* |
    | *Il a été arrêté **par** la police.* | *Le sommet est couvert **de** neige.* |
    | *La lettre a été écrite **par** le maire.* | *La salle était remplie **de** journalistes.* |
    | | *Le président est accompagné **de** sa femme.* |
    | | *Il est connu **de** tout le monde.* |

    ### Verbs that usually take de
    Feelings: *aimer, adorer, détester, respecter, craindre*. Description / state: *couvert, rempli, entouré, orné, composé, accompagné, suivi, précédé, connu*.

    After *de*, the article *des* / *du* disappears with an indefinite noun: *couvert **de** fleurs* (not *de des fleurs*).

    The agent is often omitted: *Le gagnant a été annoncé.*
  examples:
    - { es: "Le jury est présidé par une actrice célèbre.", en: "The jury is chaired by a famous actress." }
    - { es: "La Croisette est bordée de palmiers.", en: "The Croisette is lined with palm trees." }
    - { es: "L'actrice est entrée, suivie de ses fans.", en: "The actress came in, followed by her fans." }
    - { es: "Ce réalisateur est respecté de tous.", en: "This director is respected by everyone." }
  pitfalls:
    - "*Couvert de neige*, not *couvert par la neige* (unless an actual act of covering)."
    - "*Entouré de fleurs*, not *entouré de des fleurs*."
  related: [g.passive-voice]
  drills:
    - { es: "Le tapis rouge est entouré de photographes.", en: "The red carpet is surrounded by photographers." }
    - { es: "Ce prix a été créé par la ville.", en: "This prize was created by the city." }
    - { es: "Elle est admirée de tous.", en: "She's admired by everyone." }
- id: g.opinion-mood
  level: b1
  title: "Giving opinions: je pense que + indicative, je ne pense pas que + subjonctif"
  summary: "Affirmative opinion verbs take the indicative; negative and interrogative (inversion) ones usually take the subjonctif."
  explanation: |
    | affirmative → **indicative** | negative / question → **subjonctif** |
    |---|---|
    | *Je pense que c'**est** une bonne idée.* | *Je ne pense pas que ce **soit** une bonne idée.* |
    | *Je crois qu'il **a** raison.* | *Je ne crois pas qu'il **ait** raison.* |
    | *Je trouve que c'**est** cher.* | *Je ne trouve pas que ce **soit** cher.* |
    | *Il me semble qu'il **est** là.* | *Penses-tu qu'il **soit** là ?* |

    Other opinion expressions with the indicative: *à mon avis, selon moi, pour moi, d'après moi* (+ normal sentence), *je suis sûr / certain que, il est évident / clair que*.

    ### Agree / disagree
    *Je suis d'accord (avec toi). Je ne suis pas d'accord. Tu as raison / tort. C'est vrai, mais… Absolument ! Pas du tout !*

    In casual speech, *Je pense pas que c'est…* (indicative) is heard; use the subjonctif in writing.
  examples:
    - { es: "Je pense que la Promenade est trop fréquentée en été.", en: "I think the Promenade is too crowded in summer." }
    - { es: "Je ne crois pas que les touristes soient le problème.", en: "I don't think tourists are the problem." }
    - { es: "À mon avis, il faut limiter les voitures.", en: "In my opinion, cars should be limited." }
    - { es: "Je trouve que la socca est délicieuse.", en: "I find socca delicious." }
  pitfalls:
    - "Not *je pense que ce soit* in the affirmative: *je pense que c'est*."
    - "*À mon avis*, not *dans mon opinion*."
    - "*Je suis d'accord*, not *j'ai d'accord*."
  related: [g.subjonctif-doute, g.connectors-cause-consequence, g.opinion-nuance]
  drills:
    - { es: "Je crois qu'il va pleuvoir.", en: "I think it's going to rain." }
    - { es: "Je ne pense pas qu'elle vienne.", en: "I don't think she's coming." }
    - { es: "Selon moi, c'est trop cher.", en: "In my view, it's too expensive." }
- id: g.connectors-cause-consequence
  level: b1
  title: "Cause and consequence: parce que, car, puisque, donc, alors"
  summary: "Cause: parce que, car, puisque, comme, à cause de, grâce à. Consequence: donc, alors, c'est pourquoi, du coup."
  explanation: |
    ### Cause
    | connector | use | example |
    |---|---|---|
    | *parce que* | neutral, answers *pourquoi* | *Je reste **parce qu'**il pleut.* |
    | *car* | written, never at the start | *Je reste, **car** il pleut.* |
    | *puisque* | known / obvious cause | ***Puisque** tu es là, aide-moi.* |
    | *comme* | at the start of the sentence | ***Comme** il pleuvait, on est restés.* |
    | *à cause de* + noun | negative cause | ***À cause de** la grève…* |
    | *grâce à* + noun | positive cause | ***Grâce au** soleil…* |

    ### Consequence
    | connector | use | example |
    |---|---|---|
    | *donc* | neutral, logical | *Il pleut, **donc** je reste.* |
    | *alors* | spoken | *Il pleut, **alors** on reste.* |
    | *c'est pourquoi* | written | ***C'est pourquoi** il faut agir.* |
    | *du coup* | very spoken | ***Du coup**, on est restés.* |
    | *si bien que* | so that (result) | *Il a plu, **si bien que** le match a été annulé.* |
    | *tellement… que* | so … that | *Il fait **tellement** chaud **qu'**on ne peut pas sortir.* |
  examples:
    - { es: "Comme il y avait trop de monde, nous sommes partis.", en: "As there were too many people, we left." }
    - { es: "Nice attire beaucoup de touristes grâce à son climat.", en: "Nice attracts lots of tourists thanks to its climate." }
    - { es: "Les loyers augmentent, c'est pourquoi les habitants partent.", en: "Rents are going up, which is why residents are leaving." }
    - { es: "Il y avait des bouchons, du coup on est arrivés en retard.", en: "There were traffic jams, so we arrived late." }
  pitfalls:
    - "*Car* can't start a sentence or answer *pourquoi*: *Pourquoi ? — Parce que…*"
    - "*À cause de* + noun, *parce que* + clause: *à cause de la pluie* / *parce qu'il pleut*."
    - "*Grâce à* only for good results; for bad ones, *à cause de*."
  related: [g.connectors-opposition, g.cause-advanced, g.opinion-mood]
  drills:
    - { es: "Je ne viens pas parce que je suis malade.", en: "I'm not coming because I'm ill." }
    - { es: "Puisque tu insistes, je viens.", en: "Since you insist, I'll come." }
    - { es: "Il était tellement fatigué qu'il s'est endormi.", en: "He was so tired he fell asleep." }
- id: g.connectors-opposition
  level: b1
  title: "Contrast and opposition: mais, pourtant, cependant, par contre, alors que"
  summary: "mais (but), pourtant / cependant (yet, however), par contre / en revanche (on the other hand), alors que / tandis que (whereas), malgré (despite)."
  explanation: |
    | connector | register | example |
    |---|---|---|
    | *mais* | all | *C'est beau, **mais** c'est cher.* |
    | *pourtant* | all | *Il a révisé ; **pourtant**, il a échoué.* |
    | *cependant, toutefois* | written | ***Cependant**, la question reste ouverte.* |
    | *par contre* | spoken | *Le centre est joli ; **par contre**, il est bruyant.* |
    | *en revanche* | written | *La ville est chère ; **en revanche**, la plage est gratuite.* |
    | *alors que, tandis que* + clause | all | *Nice est animée **alors que** Menton est calme.* |
    | *malgré* + noun | all | ***Malgré** la pluie, on est sortis.* |
    | *au lieu de* + noun / inf. | all | *Il a pris le bus **au lieu de** marcher.* |
    | *même si* + indicative | all | ***Même s'**il pleut, on y va.* |

    *Bien que* + subjonctif (although) is studied at B2.

    *Pourtant* expresses surprise ("and yet"); *par contre / en revanche* simply compare two sides.
  examples:
    - { es: "Le tourisme fait vivre la ville ; pourtant, beaucoup d'habitants s'en plaignent.", en: "Tourism keeps the city alive; yet many residents complain about it." }
    - { es: "Le Vieux-Nice est charmant, par contre il y a trop de monde.", en: "Old Nice is charming, but on the other hand it's too crowded." }
    - { es: "Malgré le prix, la socca reste populaire.", en: "Despite the price, socca is still popular." }
    - { es: "Même s'il fait froid, on se baigne.", en: "Even if it's cold, we're going for a swim." }
  pitfalls:
    - "*Malgré* + noun: *malgré la pluie*; not *malgré que* in careful French (use *bien que*)."
    - "*Même si* + indicative, never subjonctif: *même s'il pleut*."
  related: [g.connectors-cause-consequence, g.concession]
  drills:
    - { es: "Il est riche, pourtant il n'est pas heureux.", en: "He's rich, yet he isn't happy." }
    - { es: "Malgré la grève, le festival a eu lieu.", en: "Despite the strike, the festival went ahead." }
    - { es: "Elle adore la mer alors que lui préfère la montagne.", en: "She loves the sea whereas he prefers the mountains." }
- id: g.futur-anterieur
  level: b1
  title: "The futur antérieur: j'aurai fini, je serai parti"
  summary: "future of avoir/être + participle: will have done. After quand / dès que for an action completed before another future action."
  explanation: |
    | | avoir | être |
    |---|---|---|
    | je / j' | **aurai** gagné | **serai** arrivé(e) |
    | tu | auras gagné | seras arrivé(e) |
    | il / elle | aura gagné | sera arrivé(e) |
    | nous | aurons gagné | serons arrivé(e)s |
    | vous | aurez gagné | serez arrivé(e)(s) |
    | ils / elles | auront gagné | seront arrivé(e)s |

    ### Uses
    1. **Completed by a future moment**: *À vingt heures, j'**aurai fini**.* (By 8 pm I'll have finished.)
    2. **After quand, dès que, lorsque, une fois que, après que** when the action happens **before** the main future action:
       *Quand j'**aurai gagné**, j'achèterai un yacht.* (English: when I've won)
    3. **Supposition** about the past: *Il n'est pas là ? Il **aura oublié**.* (He must have forgotten.)

    Deadlines: *d'ici (à) demain, avant la fin du mois, dans deux ans*.
  examples:
    - { es: "Quand j'aurai gagné au casino, je t'inviterai à Monaco.", en: "When I've won at the casino, I'll invite you to Monaco." }
    - { es: "D'ici dimanche, les pilotes auront fait des centaines de tours.", en: "By Sunday the drivers will have done hundreds of laps." }
    - { es: "Dès que tu seras arrivé, appelle-moi.", en: "As soon as you've arrived, call me." }
    - { es: "Elle n'a pas répondu ? Elle aura perdu son téléphone.", en: "She hasn't answered? She must have lost her phone." }
  pitfalls:
    - "English 'when I've finished' → *quand j'aurai fini*, not *quand j'ai fini*."
    - "Agreement with *être*: *Quand elles seront parties…*"
  related: [g.quand-futur, g.futur-simple-forms, g.time-clauses, g.plus-que-parfait]
  drills:
    - { es: "J'aurai fini avant midi.", en: "I'll have finished before noon." }
    - { es: "Quand nous serons rentrés, nous dînerons.", en: "When we've got back, we'll have dinner." }
    - { es: "Ils auront raté le train.", en: "They must have missed the train." }
- id: g.prepositions-time
  level: b1
  title: "Time prepositions: en, dans, pendant, pour, d'ici, vers, à partir de"
  summary: "en 2030 / en deux heures, dans deux jours, pendant l'été, pour une semaine, d'ici lundi, vers midi, à partir de demain."
  explanation: |
    | preposition | meaning | example |
    |---|---|---|
    | *en* + year / month / season | in | *en 2030, en mai, en été* (but *au printemps*) |
    | *en* + duration | within (time taken) | *Il a fait le tour **en** deux minutes.* |
    | *dans* + duration | in (from now) | *La course commence **dans** une heure.* |
    | *pendant* | during, for | ***pendant** le Grand Prix* |
    | *pour* | for (planned) | *Je pars **pour** trois jours.* |
    | *d'ici (à)* | by, between now and | ***D'ici** vendredi, j'aurai fini.* |
    | *vers* | around (approximate) | ***vers** quinze heures* |
    | *à partir de* | from, starting | ***À partir de** lundi, la route est fermée.* |
    | *dès* | from … on, as early as | ***dès** six heures du matin* |
    | *jusqu'à* | until | ***jusqu'à** minuit* |
    | *depuis* | since, for (ongoing) | ***depuis** 1929* |
    | *il y a* | ago | ***il y a** cent ans* |
    | *au bout de* | after (a period) | ***Au bout d'**une heure, il est parti.* |
  examples:
    - { es: "Le Grand Prix de Monaco existe depuis 1929.", en: "The Monaco Grand Prix has existed since 1929." }
    - { es: "Les rues seront fermées à partir de jeudi.", en: "The streets will be closed from Thursday." }
    - { es: "Le pilote a bouclé le tour en une minute douze.", en: "The driver completed the lap in one minute twelve." }
    - { es: "D'ici la fin de l'année, je trouverai un travail.", en: "By the end of the year I'll have found a job." }
  pitfalls:
    - "*Dans une heure* (in an hour's time) vs *en une heure* (taking an hour)."
    - "*Au printemps*, but *en été, en automne, en hiver*."
  related: [g.pendant-depuis-il-y-a, g.futur-anterieur, g.time-clauses]
  drills:
    - { es: "On se retrouve vers vingt heures.", en: "Let's meet around eight pm." }
    - { es: "Je serai là dès demain.", en: "I'll be there from tomorrow." }
    - { es: "Au bout de trois tours, il a abandonné.", en: "After three laps, he retired." }
- id: g.ni-ni-aucun
  level: b1
  title: "Ne … ni … ni, ne … aucun, ne … nulle part"
  summary: "neither … nor (je n'aime ni le thé ni le café), not any / none (aucun problème), nowhere (nulle part)."
  explanation: |
    ### Ne … ni … ni (neither … nor)
    *Je **n'**aime **ni** le jeu **ni** les voitures.*
    - No article after *ni* with partitives / indefinites: *Il n'a **ni** frère **ni** sœur.* (*de* disappears too)
    - As subject: ***Ni** Paul **ni** Marie **ne** sont venus.*
    - *Moi non plus* ≈ *ni moi*.

    ### Ne … aucun(e) (no, not a single, none)
    *aucun / aucune* agrees with the noun and is almost always singular:
    - *Il **n'**y a **aucun** problème.* (no problem at all)
    - ***Aucune** voiture **ne** passe.* (subject)
    - Pronoun: *Tu as des questions ? — Non, je n'**en** ai **aucune**.*
    - Alone: *Tu as une idée ? — **Aucune** !*

    ### Ne … nulle part (nowhere)
    *Je ne trouve mes clés **nulle part**.* — After the participle: *Je ne suis allé **nulle part**.*

    ### Ne … guère (hardly, literary)
    *Il ne parle **guère**.*
  examples:
    - { es: "Je n'ai ni le temps ni l'argent pour le casino.", en: "I have neither the time nor the money for the casino." }
    - { es: "Il n'y a aucune place libre pour la course.", en: "There isn't a single free seat for the race." }
    - { es: "Aucun pilote n'a fini la course sous la pluie.", en: "No driver finished the race in the rain." }
    - { es: "On ne trouve des yachts pareils nulle part ailleurs.", en: "You won't find yachts like these anywhere else." }
  pitfalls:
    - "No *pas* with these: *je n'ai aucun problème*, not *je n'ai pas aucun problème*."
    - "*Aucun* is singular: *aucune idée*, not *aucunes idées*."
    - "*Ni … ni* drops the partitive: *ni pain ni vin*."
  related: [g.negation-jamais-plus-rien, g.negation-ne-pas]
  drills:
    - { es: "Je n'ai aucune idée.", en: "I have no idea." }
    - { es: "Elle ne boit ni vin ni bière.", en: "She drinks neither wine nor beer." }
    - { es: "Je ne vais nulle part ce week-end.", en: "I'm not going anywhere this weekend." }
