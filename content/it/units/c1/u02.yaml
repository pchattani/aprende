    model: { es: "L'11 maggio 1860 due navi si avvicinarono lentamente al porto di Marsala. A bordo c'erano Garibaldi e circa mille volontari, partiti da Genova pochi giorni prima. Quando i soldati borbonici scorsero le navi, cercarono di fermarle, ma era troppo tardi: i Mille sbarcarono quasi senza perdite. Nei giorni seguenti molti siciliani si misero dalla loro parte. Dopo la vittoria di Calatafimi, Garibaldi guardò i suoi uomini stanchi ma felici. Fu allora che capì che l'impresa poteva davvero riuscire. Alla fine di maggio i volontari giunsero a Palermo, dove la popolazione insorse contro i Borboni. In poche settimane l'isola fu conquistata. Era l'inizio dell'unificazione d'Italia, che sarebbe arrivata l'anno seguente. Nessuno, a Torino, si aspettava un successo così veloce.", en: "On 11 May 1860 two ships slowly approached the port of Marsala. On board were Garibaldi and about a thousand volunteers, who had left Genoa a few days earlier. When the Bourbon soldiers caught sight of the ships, they tried to stop them, but it was too late: the Thousand landed almost without losses. In the following days many Sicilians took their side. After the victory at Calatafimi, Garibaldi looked at his tired but happy men. It was then that he understood the enterprise could really succeed. At the end of May the volunteers reached Palermo, where the people rose up against the Bourbons. In a few weeks the island was conquered. It was the beginning of the unification of Italy, which would come the following year. Nobody in Turin had expected such a swift success." }
