id: r.b2.e-isso-que-eu-quero-dizer
level: b2
title: É isso que eu quero dizer
kind: dialogue
intro: On a jangada (a traditional raft) heading for the natural pools of Pajuçara, in Maceió, a podcaster interviews Seu Cícero, a jangadeiro for forty years. Listen for emphasis (é... que, quem... é), clitics and the Brazilian null object.
allow: [cícero, maceió, alagoas, alagoano, alagoana, pajuçara, mundaú, ok, podcast, renata]
paragraphs:
  - { es: "A jangada sai da praia de Pajuçara com seis turistas, uma vela branca enorme e o seu Cícero no comando. A podcaster Renata, sentada na ponta, segura o microfone com cuidado para não molhá-lo.", en: "The jangada leaves Pajuçara beach with six tourists, a huge white sail and Seu Cícero in command. The podcaster Renata, sitting at the end, holds the microphone carefully so as not to get it wet." }
  - { es: "— Seu Cícero, quanto tempo leva até as piscinas naturais?", en: "'Seu Cícero, how long does it take to get to the natural pools?'" }
  - { es: "— Uns vinte minutos, se o vento ajudar. Mas quem decide não sou eu, não. Quem decide é o vento. E quem manda nas piscinas é a maré. Se a maré não estiver baixa, não adianta ir: as piscinas só aparecem quando a água desce e os recifes ficam de fora.", en: "'About twenty minutes, if the wind helps. But I'm not the one who decides, no. The one who decides is the wind. And what rules the pools is the tide. If the tide isn't low, there's no point going: the pools only appear when the water goes down and the reefs are exposed.'" }
  - { es: "— O senhor faz isso há quanto tempo?", en: "'How long have you been doing this?'" }
  - { es: "— Faz quarenta anos. Meu pai era jangadeiro, meu avô também. Antes a gente pescava. A jangada era para trazer peixe, não turista. Foi o turismo que mudou tudo.", en: "'Forty years. My father was a jangadeiro, my grandfather too. Before, we used to fish. The jangada was for bringing fish, not tourists. It was tourism that changed everything.'" }
  - { es: "— E mudou para melhor ou para pior?", en: "'And did it change for the better or for the worse?'" }
  - { es: "— Olha, para o bolso, foi melhor. Hoje eu ganho mais levando turista do que eu ganhava pescando. Mas o mar sentiu. Teve uma época em que vinham tantas jangadas e tanta gente que os turistas pisavam nos corais, davam comida para os peixes, deixavam lixo. Os corais começaram a morrer. É isso que eu quero dizer quando falo que o mar sentiu.", en: "'Look, for the wallet, it was better. Today I earn more taking tourists than I used to earn fishing. But the sea felt it. There was a time when so many jangadas and so many people came that tourists stepped on the coral, fed the fish, left rubbish. The coral started dying. That's what I mean when I say the sea felt it.'" }
  - { es: "— E o que foi feito?", en: "'And what was done?'" }
  - { es: "— Criaram regras. Hoje tem limite de jangadas, tem fiscalização, não pode dar comida para os peixes, não pode pisar nos corais. No começo, muito jangadeiro reclamou. Eu mesmo reclamei. Mas depois vi que era o certo. Se a gente destrói o recife, destrói o próprio trabalho.", en: "'They created rules. Today there's a limit on jangadas, there's inspection, you can't feed the fish, you can't step on the coral. At first, lots of jangadeiros complained. I complained myself. But then I saw it was right. If we destroy the reef, we destroy our own work.'" }
  - { es: "A jangada para. Em volta, a água é verde-clara, tão parada que parece vidro. Os turistas pulam, com máscaras, e dezenas de peixes listrados se aproximam.", en: "The jangada stops. All around, the water is light green, so still it looks like glass. The tourists jump in, with masks, and dozens of striped fish come closer." }
  - { es: "— Seu Cícero, e a comida típica daqui? O que o senhor recomenda?", en: "'Seu Cícero, and the typical food here? What do you recommend?'" }
  - { es: "— Sururu, sem dúvida. É um mariscozinho que vem da lagoa Mundaú. As mulheres catam lá, limpam e vendem. Minha mulher faz um caldo de sururu que é uma coisa de outro mundo. Quer provar? Amanhã eu trago.", en: "'Sururu, no doubt. It's a little mussel that comes from the Mundaú lagoon. The women gather them there, clean them and sell them. My wife makes a sururu broth that's out of this world. Want to try it? I'll bring some tomorrow.'" }
  - { es: "— Traz, sim! Mas o senhor não acha que muitos turistas vêm a Maceió e nem sabem o que é sururu?", en: "'Yes, bring some! But don't you think many tourists come to Maceió and don't even know what sururu is?'" }
  - { es: "— Acho, sim. O turista vê o mar azul, tira foto, posta e vai embora. Ele vê, mas não conhece. O que eu queria era que o pessoal conhecesse também quem vive aqui: o pescador, a marisqueira, a rendeira, o jangadeiro. Não somos paisagem, não. É a gente que faz este lugar.", en: "'I do, yes. The tourist sees the blue sea, takes a photo, posts it and leaves. He sees it, but he doesn't know it. What I'd like is for people to also get to know those who live here: the fisherman, the shellfish gatherer, the lacemaker, the jangadeiro. We're not scenery, no. It's us who make this place.'" }
  - { es: "Na volta, a Renata desliga o microfone e pede o telefone do seu Cícero. — Para o caldo de sururu — explica. Ele ri e dá. No dia seguinte, ele trouxe mesmo, numa panela embrulhada num pano de prato. E ela comeu tudo.", en: "On the way back, Renata switches off the microphone and asks for Seu Cícero's number. 'For the sururu broth,' she explains. He laughs and gives it to her. The next day he really did bring some, in a pan wrapped in a tea towel. And she ate it all." }
questions:
  - { q: "Segundo o seu Cícero, quem decide quando ir às piscinas?", options: ["Os turistas", "O vento e a maré", "A prefeitura"], answer: 1, explain: "«Quem decide é o vento. E quem manda nas piscinas é a maré.»" }
  - { q: "Para que servia a jangada antes do turismo?", options: ["Para pescar", "Para transportar mercadorias para Recife", "Para corridas"], answer: 0, explain: "«Antes a gente pescava. A jangada era para trazer peixe, não turista.»" }
  - { q: "O que ele quer dizer com «o mar sentiu»?", options: ["Que o mar ficou mais frio", "Que o excesso de turistas danificou os corais", "Que os peixes foram embora para outra praia"], answer: 1, explain: "Tourists stepped on and fed the coral and fish: «Os corais começaram a morrer. É isso que eu quero dizer.»" }
  - { q: "Como o seu Cícero reagiu às novas regras?", options: ["Sempre apoiou", "Primeiro reclamou, mas depois viu que eram certas", "Parou de trabalhar"], answer: 1, explain: "«Eu mesmo reclamei. Mas depois vi que era o certo.»" }
  - { q: "O que ele gostaria que os turistas fizessem?", options: ["Que tirassem mais fotos", "Que conhecessem também as pessoas que vivem ali", "Que comprassem jangadas"], answer: 1, explain: "«O que eu queria era que o pessoal conhecesse também quem vive aqui... Não somos paisagem, não.»" }
