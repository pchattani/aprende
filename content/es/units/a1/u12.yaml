dialogues:
  - id: a1.u12.d1
    title: El último día de clase
    context: The Spanish course is ending. Tom, Yuki and the teacher talk about their plans.
    lines:
      - { speaker: Profesora, es: "Bueno, hoy es el último día del curso. ¿Qué vais a hacer ahora?", en: "Well, today is the last day of the course. What are you going to do now?" }
      - { speaker: Tom, es: "Yo voy a viajar por España dos semanas. Primero Sevilla y luego Granada.", en: "I'm going to travel around Spain for two weeks. First Seville and then Granada." }
      - { speaker: Yuki, es: "¡Qué suerte! Yo tengo que trabajar, pero en agosto voy a Japón a ver a mi familia.", en: "How lucky! I have to work, but in August I'm going to Japan to see my family." }
      - { speaker: Profesora, es: "¿Y vais a seguir estudiando español?", en: "And are you going to keep studying Spanish?" }
      - { speaker: Tom, es: "Claro. Voy a hacer el curso de A2 en septiembre.", en: "Of course. I'm going to do the A2 course in September." }
      - { speaker: Yuki, es: "Yo también. Además, mi novio es español, por eso practico todos los días.", en: "Me too. Besides, my boyfriend is Spanish, that's why I practise every day." }
      - { speaker: Profesora, es: "¡Perfecto! Entonces nos vemos en septiembre. Tenéis que hacer el examen primero, ¿vale?", en: "Perfect! Then we'll see each other in September. You have to take the exam first, OK?" }
      - { speaker: Tom, es: "No hay problema. ¡Buena suerte a todos!", en: "No problem. Good luck everyone!" }
      - { speaker: Yuki, es: "Gracias por todo, Carmen. ¡Hasta pronto!", en: "Thanks for everything, Carmen. See you soon!" }
    questions:
      - { q: "What is Tom going to do first?", options: ["Work", "Travel around Spain", "Go to Japan"], answer: 1 }
      - { q: "Why does Yuki practise every day?", options: ["She has an exam", "Her boyfriend is Spanish", "She lives in Spain"], answer: 1 }
      - { q: "When does the A2 course start?", options: ["In August", "In September", "Next year"], answer: 1 }
