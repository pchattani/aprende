id: c1.u05
title: "Português acadêmico"
lessons:
  - id: c1.u05.l1
    title: Neste estudo, analisamos
    teach: [g.academic-register]
    vocab: [w.acadêmico, w.metodologia, w.adotar, w.qualitativo, w.quantitativo, w.participante, w.corroborar, w.artigo-científico, w.periódico, w.palavra-chave, w.bibliografia, w.referências-bibliográficas, w.citação, w.plágio, w.orientador, w.banca, w.monografia, w.pesquisa-de-campo, w.estudo-de-caso, w.embasamento, w.arcabouço, w.fundamentação-teórica, w.revisão-de-literatura, w.empírico, w.teórico, w.conceitual, w.lacuna, w.contribuição, w.contribuir, w.boi, w.boi-bumbá, w.toada, w.brincante, w.arena, w.folclore, w.rivalidade, w.fortalecer, w.antropologia, w.movimentar, w.optar, w.basear, w.inédito, w.alfabético, w.identificar, w.publicação, w.corretamente]
    tip: "Academic Portuguese prefers the impersonal se (analisou-se, observa-se) or the plural of modesty (analisamos). Leave eu acho, a gente and tipo for the café."
    sentences:
      - { es: "Neste estudo, analisamos a rivalidade entre os bois Garantido e Caprichoso.", en: "In this study, we analyse the rivalry between the Garantido and Caprichoso boi groups.", altEs: ["Neste estudo, analisa-se a rivalidade entre os bois Garantido e Caprichoso."], grammar: [g.academic-register], vocab: [w.estudo, w.analisar, w.rivalidade] }
      - { es: "Adotou-se uma metodologia qualitativa, baseada em entrevistas.", en: "A qualitative methodology was adopted, based on interviews.", altEs: ["Foi adotada uma metodologia qualitativa, baseada em entrevistas."], grammar: [g.academic-register, g.se-passive], vocab: [w.adotar, w.metodologia, w.qualitativo, w.entrevista], transform: { instruction: "Rewrite with the plural of modesty (nós)", answer: "Adotamos uma metodologia qualitativa, baseada em entrevistas.", en: "We adopted a qualitative methodology, based on interviews." } }
      - { es: "A etapa quantitativa da pesquisa contou com 400 participantes.", en: "The quantitative stage of the research involved 400 participants.", grammar: [g.academic-register], vocab: [w.quantitativo, w.participante, w.etapa] }
      - { es: "Os dados corroboram a hipótese de que o festival fortalece a identidade local.", en: "The data corroborate the hypothesis that the festival strengthens local identity.", grammar: [g.academic-register], vocab: [w.corroborar, w.hipótese, w.fortalecer, w.identidade] }
      - { es: "O artigo científico foi publicado num periódico de antropologia.", en: "The scientific paper was published in an anthropology journal.", altEs: ["O artigo científico foi publicado em um periódico de antropologia."], grammar: [g.academic-register, g.passive-ser], vocab: [w.artigo-científico, w.periódico, w.antropologia] }
      - { es: "Indique até cinco palavras-chave logo abaixo do resumo.", en: "Give up to five keywords just below the abstract.", grammar: [g.academic-register, g.formal-reports], vocab: [w.palavra-chave, w.resumo], note: "Plural: palavras-chave (only the first part changes)." }
      - { es: "No âmbito do município, o festival movimenta toda a economia.", en: "At municipal level, the festival drives the whole economy.", grammar: [g.academic-register], vocab: [w.âmbito, w.movimentar, w.economia], error: { wrong: "A nível do município, o festival movimenta toda a economia.", explain: "a nível de is widely criticised in careful writing; use no âmbito de or em nível de.", grammar: g.academic-register } }
      - { es: "Copiar sem citar a fonte é plágio, mesmo que seja só um parágrafo.", en: "Copying without citing the source is plagiarism, even if it's only one paragraph.", grammar: [g.academic-register, g.por-mais-que], vocab: [w.plágio, w.fonte, w.copiar] }
      - { es: "Minha orientadora sugeriu que eu fizesse uma pesquisa de campo em Parintins.", en: "My supervisor suggested I do fieldwork in Parintins.", altEs: ["A minha orientadora sugeriu que eu fizesse pesquisa de campo em Parintins."], grammar: [g.academic-register, g.subjunctive-imperfect], vocab: [w.orientador, w.pesquisa-de-campo] }
      - { es: "A monografia será avaliada por uma banca de três professores.", en: "The dissertation will be assessed by a board of three lecturers.", grammar: [g.academic-register, g.passive-ser], vocab: [w.monografia, w.banca, w.avaliar], variant: "In Portugal the board is o júri." }
      - { es: "Optamos por um estudo de caso: o boi Caprichoso.", en: "We opted for a case study: the Caprichoso boi.", grammar: [g.academic-register], vocab: [w.estudo-de-caso, w.optar] }
      - { es: "Falta embasamento teórico ao segundo capítulo, e o arcabouço conceitual é frágil.", en: "The second chapter lacks theoretical grounding, and the conceptual framework is weak.", grammar: [g.academic-register], vocab: [w.embasamento, w.teórico, w.arcabouço, w.conceitual, w.frágil] }
      - { es: "A fundamentação teórica se apoia em autores como Câmara Cascudo, que estudou o folclore brasileiro.", en: "The theoretical framework draws on authors such as Câmara Cascudo, who studied Brazilian folklore.", altEs: ["A fundamentação teórica apoia-se em autores como Câmara Cascudo, que estudou o folclore brasileiro."], grammar: [g.academic-register, g.pronoun-placement-brazil], vocab: [w.fundamentação-teórica, w.apoiar, w.folclore] }
      - { es: "A revisão de literatura revelou uma lacuna: há poucos estudos sobre as toadas.", en: "The literature review revealed a gap: there are few studies on the toadas.", grammar: [g.academic-register], vocab: [w.revisão-de-literatura, w.lacuna, w.toada], note: "toada: the songs of the boi-bumbá." }
      - { es: "A principal contribuição da pesquisa é empírica: esperamos contribuir com dados inéditos sobre o público do festival.", en: "The research's main contribution is empirical: we hope to contribute new data on the festival's audience.", grammar: [g.academic-register], vocab: [w.contribuição, w.empírico, w.contribuir, w.inédito] }
      - { es: "Eu acho que o festival é muito importante para a cidade.", en: "I think the festival is very important for the city.", grammar: [g.academic-register, g.achar-que], vocab: [w.acadêmico], transform: { instruction: "Rewrite in academic register: impersonal and hedged", answer: "Considera-se que o festival é muito importante para a cidade.", alt: ["Pode-se afirmar que o festival é muito importante para a cidade.", "O festival parece ser muito importante para a cidade."], en: "The festival is considered very important for the city." }, note: "In an academic text, avoid eu acho." }
    exchanges:
      - q: { es: "Qual é a metodologia da sua pesquisa?", en: "What's your research methodology?" }
        a: { es: "Qualitativa: fiz entrevistas com brincantes dos dois bois.", en: "Qualitative: I interviewed performers from both bois." }
        alt: ["Entrevistas e observação.", "Mista: qualitativa e quantitativa."]
        grammar: [g.academic-register]
        vocab: [w.metodologia, w.qualitativo, w.brincante]
      - q: { es: "Você já tem orientador?", en: "Do you have a supervisor yet?" }
        a: { es: "Tenho: uma professora de antropologia que estuda festas populares.", en: "I do: an anthropology lecturer who studies popular festivals." }
        alt: ["Ainda não.", "Tenho, sim."]
        grammar: [g.relative-que-quem]
        vocab: [w.orientador, w.antropologia]
      - q: { es: "Que normas a bibliografia deve seguir?", en: "What rules should the bibliography follow?" }
        a: { es: "As da ABNT, com as referências bibliográficas em ordem alfabética.", en: "The ABNT ones, with the references in alphabetical order." }
        alt: ["As normas da ABNT.", "Pergunte à sua orientadora."]
        grammar: [g.academic-register]
        vocab: [w.bibliografia, w.referências-bibliográficas, w.alfabético]
      - q: { es: "Posso usar esse trecho no meu trabalho?", en: "Can I use this passage in my paper?" }
        a: { es: "Pode, desde que faça a citação corretamente; caso contrário, é plágio.", en: "You can, provided you cite it properly; otherwise, it's plagiarism." }
        alt: ["Só se citar a fonte.", "Pode, entre aspas e com a referência."]
        grammar: [g.conditional-conjunctions]
        vocab: [w.citação, w.plágio]
      - q: { es: "Quando é a defesa da sua monografia?", en: "When is your dissertation defence?" }
        a: { es: "Na sexta; a banca tem três professores.", en: "On Friday; the board has three lecturers." }
        alt: ["Na sexta-feira.", "Ainda não foi marcada."]
        grammar: [g.academic-register]
        vocab: [w.monografia, w.banca, w.defesa]
    texts:
      - title: "Resumo"
        es: ["Este artigo analisa a rivalidade entre os bois-bumbás de Parintins.", "Adotou-se uma metodologia qualitativa, com entrevistas a quarenta brincantes.", "Os resultados sugerem que a rivalidade fortalece, e não divide, a comunidade.", "Palavras-chave: boi-bumbá; identidade; festa popular."]
        en: ["This paper analyses the rivalry between the boi-bumbá groups of Parintins.", "A qualitative methodology was adopted, with interviews with forty performers.", "The results suggest that the rivalry strengthens, rather than divides, the community.", "Keywords: boi-bumbá; identity; popular festival."]
        grammar: [g.academic-register, g.formal-reports]
        vocab: [w.metodologia, w.palavra-chave, w.boi-bumbá]
      - title: "E-mail à orientadora"
        es: ["Prezada professora,", "Envio em anexo a revisão de literatura do segundo capítulo.", "Identifiquei uma lacuna nos estudos sobre as toadas e gostaria de discuti-la na próxima reunião.", "Atenciosamente, Bia."]
        en: ["Dear Professor,", "Please find attached the literature review for the second chapter.", "I have identified a gap in the studies on the toadas and would like to discuss it at our next meeting.", "Kind regards, Bia."]
        grammar: [g.formal-email, g.academic-register]
        vocab: [w.revisão-de-literatura, w.lacuna, w.identificar]
    spicy:
      - { es: "Minha pesquisa de campo sobre você já tem uma conclusão: preciso de mais dados, de preferência num jantar.", en: "My fieldwork on you already has a conclusion: I need more data, preferably over dinner.", altEs: ["A minha pesquisa de campo sobre você já tem uma conclusão: preciso de mais dados, de preferência num jantar."], grammar: [g.academic-register], vocab: [w.pesquisa-de-campo] }
      - { es: "A sua hipótese de que eu estava te olhando foi corroborada.", en: "Your hypothesis that I was looking at you has been corroborated.", altEs: ["Sua hipótese de que eu estava olhando para você foi corroborada."], grammar: [g.academic-register, g.passive-ser], vocab: [w.corroborar, w.hipótese] }
      - { es: "Fiz uma revisão de literatura completa: nenhum autor descreve um sorriso como o seu.", en: "I did a complete literature review: no author describes a smile like yours.", grammar: [g.academic-register], vocab: [w.revisão-de-literatura, w.sorriso] }
      - { es: "Você seria um ótimo estudo de caso: como alguém consegue ser tão charmoso de chinelo?", en: "You'd make a great case study: how does anyone manage to be so charming in flip-flops?", grammar: [g.conditional-simple], vocab: [w.estudo-de-caso, w.charmoso] }
      - { es: "Isso não é plágio, é citação: “você é a pessoa mais bonita da festa”, segundo a minha avó.", en: "That's not plagiarism, it's a quotation: 'you're the most beautiful person at the party', according to my grandmother.", grammar: [g.academic-register], vocab: [w.plágio, w.citação] }
  - id: c1.u05.l2
    title: Os dados sugerem que…
    teach: [g.academic-register]
    vocab: [w.morfoclimático, w.variável, w.correlação, w.causalidade, w.inferir, w.inferência, w.deduzir, w.dedução, w.generalizar, w.generalização, w.mensurar, w.quantificar, w.tendencioso, w.rigor, w.minucioso, w.criterioso, w.postular, w.constatar, w.constatação, w.averiguar, w.diagnóstico, w.prognóstico, w.parâmetro, w.indicador, w.respaldar, w.respaldo, w.simbólico, w.carecer, w.estatístico, w.indevido, w.questionário, w.induzir, w.precipitado, w.migrante, w.previamente, w.ocupação, w.acelerado]
    tip: "Hedge your claims: os dados sugerem, ao que tudo indica, parece, tende a, em certa medida. A careful conclusion is more convincing than a bold one."
    sentences:
      - { es: "A renda dos artesãos aumenta durante o festival.", en: "Craftspeople's income rises during the festival.", grammar: [g.academic-register], vocab: [w.renda, w.artesão], transform: { instruction: "Hedge the claim in academic style (Os dados sugerem…)", answer: "Os dados sugerem que a renda dos artesãos aumenta durante o festival.", alt: ["Ao que tudo indica, a renda dos artesãos aumenta durante o festival.", "A renda dos artesãos parece aumentar durante o festival."], en: "The data suggest that craftspeople's income rises during the festival." } }
      - { es: "Há uma correlação entre a idade e a fidelidade ao boi, mas correlação não implica causalidade.", en: "There's a correlation between age and loyalty to one's boi, but correlation doesn't imply causation.", grammar: [g.academic-register], vocab: [w.correlação, w.causalidade, w.implicar] }
      - { es: "Não se pode generalizar a partir de uma amostra tão pequena; tal generalização seria indevida.", en: "You can't generalise from such a small sample; such a generalisation would be unwarranted.", grammar: [g.academic-register, g.anaphora-cohesion], vocab: [w.generalizar, w.generalização, w.amostra] }
      - { es: "Dos depoimentos, infere-se que a rivalidade é simbólica; essa inferência, porém, carece de respaldo estatístico.", en: "From the testimonies, it can be inferred that the rivalry is symbolic; that inference, however, lacks statistical backing.", grammar: [g.academic-register, g.se-passive], vocab: [w.inferir, w.inferência, w.respaldo, w.depoimento, w.simbólico, w.carecer] }
      - { es: "Deduz-se que o turismo depende do festival, mas a dedução parte de uma premissa duvidosa.", en: "It is deduced that tourism depends on the festival, but the deduction rests on a dubious premise.", grammar: [g.academic-register], vocab: [w.deduzir, w.dedução, w.duvidoso] }
      - { es: "É difícil mensurar o impacto cultural do festival; o econômico, por sua vez, é mais fácil de quantificar.", en: "It's hard to measure the festival's cultural impact; the economic impact, for its part, is easier to quantify.", grammar: [g.academic-register, g.anaphora-cohesion], vocab: [w.mensurar, w.quantificar, w.impacto] }
      - { es: "O questionário era tendencioso: as perguntas induziam a resposta.", en: "The questionnaire was biased: the questions led the respondent to the answer.", grammar: [g.academic-register, g.imperfect], vocab: [w.tendencioso, w.questionário, w.induzir] }
      - { es: "O trabalho foi elogiado pelo rigor da análise e pela descrição minuciosa dos ensaios.", en: "The work was praised for the rigour of its analysis and its meticulous description of the rehearsals.", grammar: [g.academic-register, g.passive-ser], vocab: [w.rigor, w.minucioso, w.elogiar, w.ensaio] }
      - { es: "Uma leitura criteriosa das fontes evita conclusões precipitadas.", en: "A discerning reading of the sources avoids hasty conclusions.", grammar: [g.academic-register], vocab: [w.criterioso, w.precipitado, w.conclusão] }
      - { es: "Alguns autores postulam que o boi-bumbá chegou ao Amazonas com migrantes nordestinos.", en: "Some authors postulate that the boi-bumbá reached Amazonas with migrants from the Northeast.", grammar: [g.academic-register], vocab: [w.postular, w.migrante, w.nordestino] }
      - { es: "Constatou-se que o festival gera empregos o ano inteiro; essa constatação surpreendeu a equipe.", en: "It was found that the festival creates jobs all year round; that finding surprised the team.", grammar: [g.academic-register, g.anaphora-cohesion], vocab: [w.constatar, w.constatação, w.emprego] }
      - { es: "Averiguamos as informações com os presidentes das duas associações.", en: "We checked the information with the presidents of the two associations.", grammar: [g.academic-register], vocab: [w.averiguar, w.associação], transform: { instruction: "Rewrite with the impersonal se", answer: "Averiguaram-se as informações com os presidentes das duas associações.", alt: ["As informações foram averiguadas com os presidentes das duas associações."], en: "The information was checked with the presidents of the two associations." } }
      - { es: "O diagnóstico é claro, mas o prognóstico depende de investimentos.", en: "The diagnosis is clear, but the prognosis depends on investment.", grammar: [g.academic-register], vocab: [w.diagnóstico, w.prognóstico, w.investimento] }
      - { es: "Controlamos três variáveis e usamos cinco indicadores, com parâmetros definidos previamente.", en: "We controlled three variables and used five indicators, with parameters defined in advance.", grammar: [g.academic-register], vocab: [w.variável, w.indicador, w.parâmetro] }
      - { es: "Segundo Ab'Sáber, o domínio morfoclimático amazônico é marcado por terras baixas e floresta densa.", en: "According to Ab'Sáber, the Amazonian morphoclimatic domain is characterised by lowlands and dense forest.", grammar: [g.academic-register, g.passive-ser], vocab: [w.morfoclimático, w.domínio] }
      - { es: "O contexto em que a pesquisa foi feita é relevante.", en: "The context in which the research was carried out is relevant.", grammar: [g.academic-register, g.relative-o-qual], vocab: [w.contexto, w.relevante], error: { wrong: "O contexto onde a pesquisa foi feita é relevante.", explain: "In careful academic writing, onde is only for places: o contexto em que…", grammar: g.academic-register } }
    exchanges:
      - q: { es: "A idade influencia a escolha do boi?", en: "Does age influence the choice of boi?" }
        a: { es: "Há uma correlação, mas não dá para falar em causalidade.", en: "There's a correlation, but we can't talk about causation." }
        alt: ["Em certa medida.", "Os dados sugerem que sim, mas com cautela."]
        grammar: [g.academic-register]
        vocab: [w.correlação, w.causalidade]
      - q: { es: "Posso generalizar esses resultados para toda a Amazônia?", en: "Can I generalise these results to the whole of the Amazon?" }
        a: { es: "Não; a amostra é pequena e local demais.", en: "No; the sample is too small and too local." }
        alt: ["Com muita cautela.", "Não, seria uma generalização indevida."]
        grammar: [g.academic-register]
        vocab: [w.generalizar, w.amostra]
      - q: { es: "Como vocês mediram o impacto econômico?", en: "How did you measure the economic impact?" }
        a: { es: "Quantificamos a ocupação dos hotéis e o movimento no porto.", en: "We quantified hotel occupancy and traffic at the port." }
        alt: ["Pelo número de passagens vendidas.", "Com dados da prefeitura."]
        grammar: [g.academic-register]
        vocab: [w.quantificar, w.ocupação]
      - q: { es: "Os resultados respaldam a sua hipótese?", en: "Do the results back up your hypothesis?" }
        a: { es: "Em parte; ao que tudo indica, a hipótese precisa ser reformulada.", en: "Partly; by all indications, the hypothesis needs to be reformulated." }
        alt: ["Respaldam, sim.", "Não totalmente."]
        grammar: [g.academic-register, g.passive-ser]
        vocab: [w.respaldar, w.reformular]
      - q: { es: "O questionário não era tendencioso?", en: "Wasn't the questionnaire biased?" }
        a: { es: "Revisamos as perguntas com rigor justamente para evitar isso.", en: "We revised the questions rigorously precisely to avoid that." }
        alt: ["Não; foi testado antes.", "Talvez um pouco."]
        grammar: [g.academic-register]
        vocab: [w.tendencioso, w.rigor, w.revisar]
    texts:
      - title: "Trecho da discussão"
        es: ["Os resultados sugerem que a rivalidade entre os bois é, em grande medida, simbólica.", "Não se pode, contudo, generalizá-los para outras festas.", "Estudos futuros deveriam averiguar o papel das redes sociais."]
        en: ["The results suggest that the rivalry between the bois is, to a large extent, symbolic.", "They cannot, however, be generalised to other festivals.", "Future studies should look into the role of social media."]
        grammar: [g.academic-register, g.clitic-placement-norm]
        vocab: [w.generalizar, w.averiguar, w.simbólico]
      - title: "Parecer sobre o artigo"
        es: ["O artigo é minucioso e criterioso na análise dos dados.", "Algumas inferências, porém, carecem de respaldo empírico.", "Recomenda-se a publicação após pequenas correções."]
        en: ["The paper is meticulous and discerning in its analysis of the data.", "Some inferences, however, lack empirical support.", "Publication is recommended after minor corrections."]
        grammar: [g.academic-register, g.formal-reports]
        vocab: [w.minucioso, w.criterioso, w.inferência, w.respaldo]
    spicy:
      - { es: "Os dados sugerem que você gosta de mim: riu de todas as minhas piadas, até das ruins.", en: "The data suggest you like me: you laughed at all my jokes, even the bad ones.", grammar: [g.academic-register], vocab: [w.piada] }
      - { es: "Há uma forte correlação entre a sua chegada e o meu coração acelerado.", en: "There's a strong correlation between your arrival and my racing heart.", grammar: [g.academic-register], vocab: [w.correlação, w.acelerado] }
      - { es: "Fiz uma análise minuciosa do seu perfil e constatei: precisamos tomar um café.", en: "I made a meticulous analysis of your profile and found that we need to have a coffee.", grammar: [g.academic-register], vocab: [w.minucioso, w.constatar, w.perfil] }
      - { es: "Não quero generalizar, mas todo mundo em Parintins dança assim tão bem?", en: "I don't want to generalise, but does everyone in Parintins dance this well?", grammar: [g.academic-register], vocab: [w.generalizar, w.dançar] }
      - { es: "Meu diagnóstico: paixão. Prognóstico: excelente, se você aceitar o convite.", en: "My diagnosis: infatuation. Prognosis: excellent, if you accept the invitation.", altEs: ["O meu diagnóstico: paixão. Prognóstico: excelente, se você aceitar o convite."], grammar: [g.future-subjunctive-se], vocab: [w.diagnóstico, w.prognóstico, w.paixão] }
  - id: c1.u05.l3
    title: Foram entrevistados 320 visitantes
    teach: [g.formal-reports]
    vocab: [w.drasticamente, w.prioritário, w.fiscalização, w.coleta, w.resolução, w.membro, w.associação, w.estimativa, w.projeção, w.gráfico, w.tabela, w.percentual, w.desvio-padrão, w.centena, w.dezena, w.milhar, w.quantia, w.montante, w.parceria, w.edital, w.licitação, w.convênio, w.implementar, w.implementação, w.otimizar, w.viabilizar, w.viabilidade, w.galpão, w.costureira, w.presencial, w.limitar, w.arrecadar, w.financiar, w.transporte, w.exato, w.seletivo, w.disfarçar, w.urgência]
    tip: "Reports describe methods in the past or passive (foram entrevistados), results in the past or present, and end with recommendations (recomenda-se, sugere-se). Use the decimal comma: 9,2%."
    sentences:
      - { es: "Entrevistamos 320 visitantes durante os três dias de festival.", en: "We interviewed 320 visitors during the three days of the festival.", grammar: [g.formal-reports], vocab: [w.entrevistar, w.visitante], transform: { instruction: "Rewrite in report style with the passive (Foram…)", answer: "Foram entrevistados 320 visitantes durante os três dias de festival.", alt: ["Foram entrevistados 320 visitantes durante os três dias do festival."], en: "320 visitors were interviewed during the three days of the festival." } }
      - { es: "Cerca de 65% dos entrevistados afirmaram ter vindo de barco; o percentual de estrangeiros não passou de 3%.", en: "About 65% of respondents said they had come by boat; the percentage of foreigners was no more than 3%.", grammar: [g.formal-reports, g.personal-infinitive-uses], vocab: [w.percentual, w.entrevistado, w.estrangeiro], error: { wrong: "Cerca de 65% dos entrevistados afirmou ter vindo de barco; o percentual de estrangeiros não passou de 3%.", explain: "With a percentage, the verb agrees with the noun after de: 65% dos entrevistados afirmaram.", grammar: g.formal-reports }, variant: "In Portugal respondents are inquiridos." }
      - { es: "Segundo as nossas estimativas, milhares de pessoas trabalham para o festival ao longo do ano.", en: "According to our estimates, thousands of people work for the festival over the course of the year.", altEs: ["Segundo nossas estimativas, milhares de pessoas trabalham para o festival ao longo do ano."], grammar: [g.formal-reports], vocab: [w.estimativa, w.milhar] }
      - { es: "A Tabela 1 apresenta o perfil dos participantes, e o Gráfico 2, a evolução do público.", en: "Table 1 shows the profile of the participants, and Graph 2 the evolution of the audience.", grammar: [g.formal-reports, g.anaphora-cohesion], vocab: [w.tabela, w.gráfico, w.perfil, w.evolução] }
      - { es: "Em 2020, sem o festival presencial, o número de visitantes caiu drasticamente.", en: "In 2020, with no in-person festival, the number of visitors fell drastically.", grammar: [g.formal-reports, g.preterite-regular], vocab: [w.drasticamente, w.presencial] }
      - { es: "A média de idade foi de 34 anos, com desvio-padrão de 9,2.", en: "The mean age was 34, with a standard deviation of 9.2.", grammar: [g.formal-reports], vocab: [w.desvio-padrão, w.média] }
      - { es: "Algumas centenas de artesãos e algumas dezenas de costureiras trabalham nos galpões dos bois.", en: "Several hundred craftspeople and several dozen seamstresses work in the bois' workshops.", grammar: [g.formal-reports], vocab: [w.centena, w.dezena, w.costureira, w.galpão] }
      - { es: "A gente acha que devia ter mais coleta seletiva de lixo no festival.", en: "We think there should be more recycling collection at the festival.", grammar: [g.formal-reports, g.a-gente], vocab: [w.coleta, w.seletivo, w.lixo], transform: { instruction: "Rewrite as a formal recommendation with Recomenda-se", answer: "Recomenda-se ampliar a coleta seletiva de lixo durante o festival.", alt: ["Recomenda-se a ampliação da coleta seletiva de lixo durante o festival.", "Recomenda-se ampliar a coleta seletiva de lixo no festival."], en: "It is recommended that recycling collection be extended during the festival." } }
      - { es: "A fiscalização ambiental deve ser prioritária nos dias de maior movimento.", en: "Environmental monitoring must be a priority on the busiest days.", grammar: [g.formal-reports], vocab: [w.fiscalização, w.prioritário, w.ambiental] }
      - { es: "Os membros da associação aprovaram uma resolução que limita o barulho depois das duas da manhã.", en: "The association's members approved a resolution limiting noise after two in the morning.", grammar: [g.formal-reports], vocab: [w.membro, w.associação, w.resolução, w.barulho] }
      - { es: "As projeções indicam um aumento de 15% no número de visitantes até 2030.", en: "Projections indicate a 15% rise in the number of visitors by 2030.", grammar: [g.formal-reports], vocab: [w.projeção, w.aumento] }
      - { es: "A prefeitura publicou o edital da licitação para a reforma do porto.", en: "The city council published the call for tenders for the renovation of the port.", grammar: [g.formal-reports, g.legal-register], vocab: [w.edital, w.licitação, w.prefeitura] }
      - { es: "O convênio com a universidade viabilizou a pesquisa, e a parceria deve continuar.", en: "The agreement with the university made the research possible, and the partnership should continue.", grammar: [g.formal-reports], vocab: [w.convênio, w.viabilizar, w.parceria] }
      - { es: "O estudo de viabilidade foi concluído, mas a implementação do projeto atrasou.", en: "The feasibility study was completed, but the implementation of the project was delayed.", grammar: [g.formal-reports, g.passive-ser], vocab: [w.viabilidade, w.implementação, w.atrasar] }
      - { es: "Para implementar o plano, será necessário um montante de dois milhões de reais; até agora, a associação arrecadou uma pequena quantia.", en: "To implement the plan, a sum of two million reais will be needed; so far, the association has raised a small amount.", grammar: [g.formal-reports], vocab: [w.implementar, w.montante, w.quantia, w.arrecadar] }
      - { es: "É preciso otimizar o transporte de barco entre Manaus e Parintins.", en: "Boat transport between Manaus and Parintins needs to be optimised.", grammar: [g.formal-reports, g.impersonal-expressions], vocab: [w.otimizar, w.transporte] }
    exchanges:
      - q: { es: "Quantas pessoas responderam ao questionário?", en: "How many people answered the questionnaire?" }
        a: { es: "Pouco mais de três centenas: 320, para ser exato.", en: "Just over three hundred: 320, to be exact." }
        alt: ["Trezentas e vinte.", "Umas trezentas pessoas."]
        grammar: [g.formal-reports]
        vocab: [w.centena, w.questionário, w.exato]
      - q: { es: "O que mostra o Gráfico 3?", en: "What does Graph 3 show?" }
        a: { es: "A evolução do público entre 2015 e 2024, com a queda de 2020.", en: "The evolution of the audience between 2015 and 2024, with the drop in 2020." }
        alt: ["A evolução do público.", "O número de visitantes por ano."]
        grammar: [g.formal-reports]
        vocab: [w.gráfico, w.queda]
      - q: { es: "Qual é a recomendação principal do relatório?", en: "What is the report's main recommendation?" }
        a: { es: "Que a fiscalização ambiental seja prioritária nos dias de festa.", en: "That environmental monitoring should be a priority on festival days." }
        alt: ["Mais fiscalização ambiental.", "Ampliar a coleta seletiva."]
        grammar: [g.formal-reports, g.subjunctive-impersonal]
        vocab: [w.fiscalização, w.prioritário]
      - q: { es: "Quem financiou a pesquisa?", en: "Who funded the research?" }
        a: { es: "Um convênio entre a universidade e a prefeitura.", en: "An agreement between the university and the city council." }
        alt: ["A universidade.", "Uma parceria com a prefeitura."]
        grammar: [g.formal-reports]
        vocab: [w.convênio, w.financiar]
      - q: { es: "A reforma do porto já começou?", en: "Has the renovation of the port started yet?" }
        a: { es: "Não; o edital foi publicado, mas a licitação ainda não terminou.", en: "No; the call for tenders has been published, but the tendering process hasn't finished yet." }
        alt: ["Ainda não.", "Começa depois da licitação."]
        grammar: [g.formal-reports, g.ja-ainda-nao]
        vocab: [w.edital, w.licitação]
    texts:
      - title: "Resultados (trecho de relatório)"
        es: ["Foram entrevistados 320 visitantes.", "Cerca de 65% afirmaram ter chegado de barco, e 30%, de avião.", "A Tabela 2 mostra que a maioria tinha entre 25 e 44 anos."]
        en: ["320 visitors were interviewed.", "About 65% said they had arrived by boat, and 30% by plane.", "Table 2 shows that most were between 25 and 44 years old."]
        grammar: [g.formal-reports]
        vocab: [w.tabela]
      - title: "Recomendações"
        es: ["Recomenda-se ampliar a coleta seletiva durante o festival.", "Sugere-se, ainda, um convênio com as escolas locais.", "É fundamental que a fiscalização ambiental seja prioritária."]
        en: ["It is recommended that recycling collection be extended during the festival.", "An agreement with local schools is also suggested.", "It is essential that environmental monitoring be a priority."]
        grammar: [g.formal-reports, g.subjunctive-impersonal]
        vocab: [w.coleta, w.convênio, w.fiscalização, w.prioritário]
    spicy:
      - { es: "Segundo as minhas estimativas, 98% das pessoas nesta festa estão olhando para você; os outros 2% sou eu, disfarçando.", en: "According to my estimates, 98% of the people at this party are looking at you; the other 2% is me, pretending not to.", grammar: [g.formal-reports], vocab: [w.estimativa, w.disfarçar] }
      - { es: "Fiz um gráfico do meu humor: sobe drasticamente quando você chega.", en: "I made a graph of my mood: it rises drastically when you arrive.", grammar: [g.formal-reports], vocab: [w.gráfico, w.drasticamente, w.humor] }
      - { es: "Proponho um convênio: eu cozinho, você lava a louça e a gente divide a sobremesa.", en: "I propose an agreement: I cook, you do the washing-up and we share dessert.", grammar: [g.formal-reports, g.a-gente], vocab: [w.convênio, w.louça] }
      - { es: "O estudo de viabilidade foi concluído: um jantar a dois é perfeitamente viável.", en: "The feasibility study is complete: dinner for two is perfectly feasible.", grammar: [g.formal-reports, g.passive-ser], vocab: [w.viabilidade, w.viável] }
      - { es: "Recomenda-se, com urgência, que você aceite o meu convite.", en: "It is urgently recommended that you accept my invitation.", altEs: ["Recomenda-se, com urgência, que você aceite meu convite."], grammar: [g.formal-reports, g.subjunctive-advice], vocab: [w.urgência, w.convite] }
  - id: c1.u05.l4
    title: Bom dia a todos
    teach: [g.presentations]
    vocab: [w.apresentação, w.palestrante, w.público-alvo, w.auditório, w.projetor, w.sumário, w.agradecimento, w.sistematizar, w.mapear, w.mapeamento, w.elencar, w.pormenor, w.pormenorizar, w.detalhar, w.detalhe, w.minúcia, w.esmiuçar, w.delinear, w.esboçar, w.esboço, w.rascunho, w.redigir, w.reformular, w.aprofundar, w.cronograma, w.elaborar, w.elaboração, w.slide, w.gestor]
    tip: "Signpost a talk: Hoje vou falar sobre…, Passando agora para…, Como vocês podem ver…, Para concluir… Close with Obrigado/Obrigada pela atenção (agreeing with the speaker) and Fico à disposição para perguntas."
    sentences:
      - { es: "Bom dia a todos. Hoje vou apresentar os resultados da nossa pesquisa em Parintins.", en: "Good morning, everyone. Today I'm going to present the results of our research in Parintins.", grammar: [g.presentations], vocab: [w.apresentar, w.resultado] }
      - { es: "A apresentação está dividida em três partes, conforme o sumário no primeiro slide.", en: "The presentation is divided into three parts, as in the contents on the first slide.", grammar: [g.presentations, g.passive-estar-ficar], vocab: [w.apresentação, w.sumário, w.slide] }
      - { es: "Passando agora para a segunda parte: como vocês podem ver neste gráfico, o público dobrou em dez anos.", en: "Moving on now to the second part: as you can see in this graph, the audience doubled in ten years.", grammar: [g.presentations], vocab: [w.gráfico, w.dobrar] }
      - { es: "Agora eu vou falar das toadas.", en: "Now I'm going to talk about the toadas.", grammar: [g.presentations], vocab: [w.toada], transform: { instruction: "Rewrite as a presentation signpost (Passando agora para…)", answer: "Passando agora para as toadas.", alt: ["Passando agora às toadas.", "Passando agora para a parte das toadas."], en: "Moving on now to the toadas." } }
      - { es: "Vale destacar que esses números ainda são preliminares e serão detalhados no relatório final.", en: "It's worth highlighting that these figures are still preliminary and will be set out in detail in the final report.", grammar: [g.presentations, g.passive-ser], vocab: [w.detalhar, w.preliminar, w.destacar] }
      - { es: "A palestrante elencou cinco desafios para o futuro do festival.", en: "The speaker listed five challenges for the future of the festival.", grammar: [g.presentations], vocab: [w.palestrante, w.elencar, w.desafio] }
      - { es: "Muito obrigada pela atenção de vocês, disse a palestrante.", en: "'Thank you very much for your attention,' said the speaker.", grammar: [g.presentations, g.adjective-agreement], vocab: [w.palestrante, w.atenção], error: { wrong: "Muito obrigado pela atenção de vocês, disse a palestrante.", explain: "obrigado agrees with the speaker: a woman says obrigada.", grammar: g.presentations } }
      - { es: "O auditório estava lotado, e o projetor não funcionava.", en: "The auditorium was packed, and the projector wasn't working.", grammar: [g.presentations, g.imperfect], vocab: [w.auditório, w.projetor, w.lotado] }
      - { es: "Não vou entrar em pormenores; quem quiser pode ler o relatório.", en: "I won't go into detail; anyone who wants to can read the report.", grammar: [g.presentations, g.future-subjunctive-relative], vocab: [w.pormenor, w.relatório] }
      - { es: "Ela esmiuçou cada detalhe da festa, com uma minúcia impressionante.", en: "She scrutinised every detail of the festival with impressive thoroughness.", grammar: [g.presentations], vocab: [w.esmiuçar, w.detalhe, w.minúcia] }
      - { es: "Primeiro, delineamos o problema; depois, mapeamos os galpões dos dois bois.", en: "First, we outlined the problem; then, we mapped the workshops of the two bois.", grammar: [g.presentations, g.connectors-sequence], vocab: [w.delinear, w.mapear, w.galpão] }
      - { es: "O esboço dos slides está pronto, mas a conclusão ainda é um rascunho.", en: "The outline of the slides is ready, but the conclusion is still a rough draft.", grammar: [g.presentations], vocab: [w.esboço, w.rascunho, w.slide] }
      - { es: "Esbocei a introdução ontem; hoje vou redigir o resto.", en: "I sketched out the introduction yesterday; today I'm going to write the rest.", grammar: [g.presentations, g.preterite-regular], vocab: [w.esboçar, w.redigir, w.introdução] }
      - { es: "A banca pediu que eu reformulasse a hipótese e aprofundasse a discussão.", en: "The board asked me to reformulate the hypothesis and deepen the discussion.", grammar: [g.reported-commands, g.subjunctive-imperfect], vocab: [w.reformular, w.aprofundar, w.banca], transform: { instruction: "Put it in direct speech: A banca disse: “…”", answer: "A banca disse: “Reformule a hipótese e aprofunde a discussão.”", alt: ["A banca disse: “Reformule a hipótese e aprofunde a discussão”."], en: "The board said: 'Reformulate the hypothesis and deepen the discussion.'" } }
      - { es: "Para concluir, gostaria de sistematizar os principais pontos e fazer um agradecimento especial à equipe.", en: "To conclude, I'd like to sum up the main points systematically and give special thanks to the team.", grammar: [g.presentations], vocab: [w.sistematizar, w.agradecimento, w.equipe] }
      - { es: "A elaboração do relatório levou seis meses; elaborá-lo sozinha teria sido impossível.", en: "Drawing up the report took six months; doing it on my own would have been impossible.", grammar: [g.presentations, g.conditional-perfect], vocab: [w.elaboração, w.elaborar] }
    exchanges:
      - q: { es: "Você pode repetir o último dado?", en: "Could you repeat the last figure?" }
        a: { es: "Claro: cerca de 65% dos visitantes chegaram de barco.", en: "Of course: about 65% of visitors arrived by boat." }
        alt: ["Claro: 65% vieram de barco.", "Sem problema; está no slide seis."]
        grammar: [g.presentations, g.formal-reports]
        vocab: [w.dado]
      - q: { es: "E qual foi o impacto da pandemia no turismo?", en: "And what was the impact of the pandemic on tourism?" }
        a: { es: "Ótima pergunta. Não tenho esse dado agora, mas posso verificar e te dar um retorno.", en: "Great question. I don't have that figure right now, but I can check and get back to you." }
        alt: ["Ótima pergunta: o público caiu drasticamente em 2020.", "Posso verificar e te responder depois."]
        grammar: [g.presentations]
        vocab: [w.retorno, w.verificar]
      - q: { es: "Quem é o público-alvo da palestra?", en: "Who is the talk's target audience?" }
        a: { es: "Estudantes de turismo e gestores culturais da região.", en: "Tourism students and cultural managers from the region." }
        alt: ["Estudantes de turismo.", "Qualquer pessoa interessada no festival."]
        grammar: [g.presentations]
        vocab: [w.público-alvo, w.palestra, w.gestor]
      - q: { es: "O projetor está funcionando?", en: "Is the projector working?" }
        a: { es: "Ainda não; enquanto isso, vou começar pelo sumário.", en: "Not yet; meanwhile, I'll start with the outline." }
        alt: ["Agora sim.", "Não; vou falar sem slides."]
        grammar: [g.presentations, g.quando-enquanto]
        vocab: [w.projetor, w.sumário]
      - q: { es: "Quanto tempo você tem para a apresentação?", en: "How long do you have for the presentation?" }
        a: { es: "Vinte minutos, mais dez para perguntas; por isso não vou entrar em pormenores.", en: "Twenty minutes, plus ten for questions; that's why I won't go into detail." }
        alt: ["Vinte minutos.", "Meia hora, com as perguntas."]
        grammar: [g.presentations]
        vocab: [w.apresentação, w.pormenor]
    texts:
      - title: "Abertura de uma apresentação"
        es: ["Bom dia a todos. Meu nome é Bia Souza e sou pesquisadora da Universidade Federal do Amazonas.", "Hoje vou falar sobre o mapeamento dos galpões dos bois de Parintins.", "A apresentação está dividida em três partes: contexto, metodologia e resultados."]
        en: ["Good morning, everyone. My name is Bia Souza and I'm a researcher at the Federal University of Amazonas.", "Today I'm going to talk about mapping the workshops of the Parintins bois.", "The presentation is divided into three parts: context, methodology and results."]
        grammar: [g.presentations]
        vocab: [w.mapeamento, w.apresentação, w.pesquisador]
      - title: "Encerramento"
        es: ["Para concluir, o festival é muito mais do que três noites de espetáculo.", "No anexo, pormenorizamos o cronograma das próximas etapas.", "Obrigada pela atenção. Fico à disposição para perguntas."]
        en: ["To conclude, the festival is much more than three nights of spectacle.", "In the appendix, we set out the timetable for the next stages in detail.", "Thank you for your attention. I'm happy to take questions."]
        grammar: [g.presentations]
        vocab: [w.pormenorizar, w.cronograma, w.etapa]
    spicy:
      - { es: "Esbocei um plano para hoje à noite: jantar, toada e, com sorte, um beijo.", en: "I've sketched out a plan for tonight: dinner, toadas and, with luck, a kiss.", grammar: [g.presentations], vocab: [w.esboçar, w.toada, w.beijo] }
      - { es: "Não vou entrar em pormenores, mas o seu sorriso merecia uma apresentação inteira.", en: "I won't go into detail, but your smile deserves a whole presentation.", grammar: [g.presentations], vocab: [w.pormenor, w.sorriso, w.apresentação] }
      - { es: "Elenquei três motivos para você sair comigo; o terceiro é que eu danço muito mal e preciso de ajuda.", en: "I've listed three reasons for you to go out with me; the third is that I dance very badly and need help.", grammar: [g.presentations, g.personal-infinitive-uses], vocab: [w.elencar, w.motivo] }
      - { es: "Passando agora para o segundo item da pauta: o seu telefone.", en: "Moving on now to the second item on the agenda: your phone number.", grammar: [g.presentations], vocab: [w.pauta] }
      - { es: "O rascunho da minha declaração tinha dez páginas; a versão final é só: “Quer dançar comigo?”", en: "The rough draft of my declaration was ten pages long; the final version is just: 'Will you dance with me?'", grammar: [g.presentations], vocab: [w.rascunho, w.declaração, w.dançar] }
dialogues:
  - id: c1.u05.d1
    title: Seminário em Parintins
    context: Bia, a researcher, presents her survey of the festival audience at a seminar in Parintins. Professor Otávio and a student, Heloísa, ask questions.
    lines:
      - { speaker: Bia, es: "Bom dia a todos. Hoje vou apresentar os resultados da nossa pesquisa sobre o público do festival.", en: "Good morning, everyone. Today I'm going to present the results of our research on the festival audience." }
      - { speaker: Bia, es: "Como vocês podem ver nesta tabela, cerca de 65% dos entrevistados chegaram de barco.", en: "As you can see in this table, about 65% of respondents arrived by boat." }
      - { speaker: Otávio, es: "Desculpe interromper. Quantas pessoas foram entrevistadas?", en: "Sorry to interrupt. How many people were interviewed?" }
      - { speaker: Bia, es: "Trezentas e vinte, durante as três noites do festival.", en: "Three hundred and twenty, over the three nights of the festival." }
      - { speaker: Otávio, es: "E a amostra incluiu torcedores dos dois bois?", en: "And did the sample include fans of both bois?" }
      - { speaker: Bia, es: "Incluiu, sim: metade do Garantido e metade do Caprichoso, para evitar um resultado tendencioso.", en: "Yes: half Garantido and half Caprichoso, to avoid a biased result." }
      - { speaker: Heloísa, es: "E o que vocês constataram sobre a rivalidade?", en: "And what did you find about the rivalry?" }
      - { speaker: Bia, es: "Os dados sugerem que ela é sobretudo simbólica: fora da arena, as famílias se misturam.", en: "The data suggest it is mainly symbolic: outside the arena, families mix." }
      - { speaker: Heloísa, es: "Vocês pretendem aprofundar essa questão?", en: "Do you intend to go deeper into that question?" }
      - { speaker: Bia, es: "Pretendemos. Para concluir, agradeço às associações dos dois bois pela parceria. Fico à disposição para perguntas.", en: "We do. To conclude, I thank the associations of both bois for their partnership. I'm happy to take questions." }
      - { speaker: Otávio, es: "Parabéns pela apresentação. Só uma sugestão: no relatório, detalhe melhor a metodologia.", en: "Congratulations on the presentation. Just one suggestion: in the report, describe the methodology in more detail." }
    questions:
      - { q: "Quantas pessoas foram entrevistadas?", options: ["Cento e vinte", "Trezentas e vinte", "Sessenta e cinco"], answer: 1, explain: "Trezentas e vinte, durante as três noites do festival. (65% is the share who came by boat.)" }
      - { q: "Por que a amostra incluiu torcedores dos dois bois?", options: ["Para evitar um resultado tendencioso", "Porque era mais barato", "Porque a associação exigiu"], answer: 0, explain: "Metade do Garantido e metade do Caprichoso, para evitar um resultado tendencioso." }
      - { q: "O que os dados sugerem sobre a rivalidade?", options: ["Que está desaparecendo", "Que é sobretudo simbólica", "Que divide as famílias"], answer: 1, explain: "Ela é sobretudo simbólica: fora da arena, as famílias se misturam." }
      - { q: "Qual é a sugestão do professor?", options: ["Detalhar melhor a metodologia", "Entrevistar mais pessoas", "Mudar o título"], answer: 0, explain: "No relatório, detalhe melhor a metodologia." }
