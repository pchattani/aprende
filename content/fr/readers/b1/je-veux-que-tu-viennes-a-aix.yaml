id: r.b1.je-veux-que-tu-viennes-a-aix
level: b1
title: "Aix-en-Provence : je veux que tu viennes"
kind: text
intro: Clara is studying law in Aix-en-Provence, but she dreams of something else. Two emails – hers and her mother's – full of the subjunctive of wishes (je veux que, j'aimerais que, je préfère que).
allow: [clara, richelme, lauves, ok, mail, master]
paragraphs:
  - { es: "Objet : Viens me voir !", en: "Subject: Come and see me!" }
  - { es: "Chère Maman,", en: "Dear Mum," }
  - { es: "Ça fait déjà trois mois que je suis à Aix et j'adore cette ville. Je veux absolument que tu viennes me voir avant Noël. Je voudrais que tu voies le cours Mirabeau, avec ses grands platanes et ses fontaines. On dit qu'Aix est la ville aux mille fontaines, et c'est presque vrai : il y en a partout ! Le matin, avant les cours, je vais au marché de la place Richelme. J'achète des fruits, du fromage de chèvre et parfois des calissons, la spécialité d'ici.", en: "I've already been in Aix for three months and I love this city. I really want you to come and see me before Christmas. I'd like you to see the Cours Mirabeau, with its tall plane trees and its fountains. They say Aix is the city of a thousand fountains, and it's almost true: there are some everywhere! In the morning, before lectures, I go to the market on the Place Richelme. I buy fruit, goat's cheese and sometimes calissons, the local speciality." }
  - { es: "Mais il faut que je te dise quelque chose d'important, et je préfère que tu le saches avant de venir. Les études de droit, ce n'est pas pour moi. Je m'ennuie en cours et mes notes ne sont pas bonnes. Je sais que Papa et toi, vous voulez que je devienne avocate, comme Papa. Mais moi, ce que j'aime, c'est la peinture.", en: "But I need to tell you something important, and I'd rather you knew it before you come. Studying law isn't for me. I'm bored in lectures and my marks aren't good. I know that you and Dad want me to become a lawyer, like Dad. But what I love is painting." }
  - { es: "Le week-end dernier, je suis allée à l'atelier de Cézanne, sur la colline des Lauves. C'est là qu'il a travaillé à la fin de sa vie. Tout est resté comme avant : sa table, ses bouteilles, ses fruits, son manteau. Ensuite, j'ai marché jusqu'au lieu d'où il peignait la montagne Sainte-Victoire. Il l'a peinte des dizaines de fois, toujours différemment. Je suis restée là deux heures avec mon carnet et mes aquarelles. J'étais heureuse comme jamais.", en: "Last weekend I went to Cézanne's studio, on the Lauves hill. That's where he worked at the end of his life. Everything has stayed as it was: his table, his bottles, his fruit, his coat. Then I walked to the place from which he painted the Sainte-Victoire mountain. He painted it dozens of times, always differently. I stayed there two hours with my sketchbook and my watercolours. I was happier than ever." }
  - { es: "Alors voilà : j'aimerais que vous me laissiez changer d'études l'année prochaine. Il y a une école d'art ici. Je ne veux pas que vous soyez déçus, mais il faut que je fasse ce que j'aime. Viens, et on en parle tranquillement, d'accord ?", en: "So here it is: I'd like you to let me change courses next year. There's an art school here. I don't want you to be disappointed, but I have to do what I love. Come, and we'll talk about it calmly, OK?" }
  - { es: "Je t'embrasse très fort, Clara", en: "Lots of love, Clara" }
  - { es: "Objet : RE: Viens me voir !", en: "Subject: RE: Come and see me!" }
  - { es: "Ma chérie,", en: "My darling," }
  - { es: "Merci pour ton message, et merci d'avoir été honnête. Je ne vais pas te mentir : ton père et moi, nous avons été surpris. Ton père voudrait que tu finisses au moins ta première année. Il a peur que tu regrettes ta décision. Moi, je veux surtout que tu sois heureuse.", en: "Thank you for your message, and thank you for being honest. I won't lie to you: your father and I were surprised. Your father would like you to finish at least your first year. He's afraid you'll regret your decision. As for me, above all I want you to be happy." }
  - { es: "Tu sais, quand j'avais ton âge, je voulais être musicienne. Mes parents ont refusé que je fasse le conservatoire, et je le regrette encore aujourd'hui. Je ne veux pas que tu vives la même chose.", en: "You know, when I was your age I wanted to be a musician. My parents wouldn't let me go to the conservatoire, and I still regret it today. I don't want you to go through the same thing." }
  - { es: "Alors oui, je viens le 15 décembre. Je veux que tu me montres tes aquarelles, l'atelier de Cézanne et ta montagne. Et ensuite, on appellera ton père toutes les deux. Il faudra qu'on soit patientes avec lui !", en: "So yes, I'm coming on the 15th of December. I want you to show me your watercolours, Cézanne's studio and your mountain. And then the two of us will call your father. We'll have to be patient with him!" }
  - { es: "Gros bisous, Maman", en: "Big kisses, Mum" }
  - { es: "PS : Garde-moi des calissons, s'il te plaît.", en: "PS: Keep some calissons for me, please." }
questions:
  - { q: "Qu'est-ce que Clara veut que sa mère voie à Aix ?", options: ["Le cours Mirabeau et ses fontaines", "La mer", "Son université"], answer: 0, explain: "«Je voudrais que tu voies le cours Mirabeau, avec ses grands platanes et ses fontaines.»" }
  - { q: "Quel est le problème de Clara ?", options: ["Elle n'a pas d'argent", "Les études de droit ne lui plaisent pas", "Elle est malade"], answer: 1, explain: "«Les études de droit, ce n'est pas pour moi. Je m'ennuie en cours.»" }
  - { q: "Qu'a fait Clara le week-end dernier ?", options: ["Elle est rentrée chez ses parents", "Elle a visité l'atelier de Cézanne et a peint", "Elle a travaillé à la bibliothèque"], answer: 1, explain: "She visited Cézanne's studio and painted the Sainte-Victoire with her watercolours." }
  - { q: "Que voudrait le père de Clara ?", options: ["Qu'elle finisse au moins sa première année", "Qu'elle rentre tout de suite", "Qu'elle devienne peintre"], answer: 0, explain: "«Ton père voudrait que tu finisses au moins ta première année.»" }
  - { q: "Pourquoi la mère comprend-elle Clara ?", options: ["Elle est peintre", "Elle voulait être musicienne mais ses parents ont refusé", "Elle a étudié à Aix"], answer: 1, explain: "«Quand j'avais ton âge, je voulais être musicienne. Mes parents ont refusé…»" }
  - { q: "« Il faut que je fasse ce que j'aime. » Pourquoi « fasse » ?", options: ["C'est le futur", "Il faut que est suivi du subjonctif", "C'est l'imparfait"], answer: 1, explain: "Il faut que always takes the subjunctive: faire → que je fasse." }
glossary:
  - { es: objet, en: subject (of an email) }
  - { es: cours, en: "lectures, avenue (le cours Mirabeau)" }
  - { es: chèvre, en: goat }
  - { es: droit, en: law }
  - { es: avocate, en: lawyer (woman) }
  - { es: carnet, en: "sketchbook, notebook" }
  - { es: honnête, en: honest }
  - { es: chérie, en: darling }
  - { es: conservatoire, en: "music school, conservatoire" }
  - { es: tranquillement, en: calmly }
