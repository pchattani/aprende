id: r.b1.la-telefonata-della-zia-rosa
level: b1
title: La telefonata della zia Rosa
kind: text
intro: Laura's aunt in Genoa has phoned with news, and now Laura has to tell her husband everything she said. A story built on reported speech (ha detto che…, mi ha chiesto se…, mi ha detto di…).
allow: [laura, rosa, franco, genova, genovese, lanterna, boccadasse, acquario, ok, recco]
paragraphs:
  - { es: "Quando Franco è tornato dal lavoro, ho capito subito dalla sua faccia che aveva sentito il telefono squillare mentre era ancora sulle scale. «Era la zia Rosa, vero?» mi ha chiesto. «Che cosa voleva?» Mi sono seduta e ho preso un respiro profondo, perché le telefonate della zia Rosa non sono mai brevi.", en: "When Franco came home from work, I could tell immediately from his face that he had heard the phone ringing while he was still on the stairs. 'It was Aunt Rosa, wasn't it?' he asked me. 'What did she want?' I sat down and took a deep breath, because Aunt Rosa's phone calls are never short." }
  - { es: "«Allora,» ho cominciato, «prima di tutto ha detto che stava benissimo e che il medico le aveva trovato la pressione di una ragazza di vent'anni. Poi mi ha chiesto se avessimo già deciso dove andare in vacanza quest'estate. Io le ho risposto che non lo sapevamo ancora, e lì è cominciato tutto.»", en: "'So,' I began, 'first of all she said she was very well and that the doctor had told her she had the blood pressure of a twenty-year-old. Then she asked me whether we'd already decided where to go on holiday this summer. I replied that we didn't know yet, and that's where it all started.'" }
  - { es: "«Ha detto che a Genova d'estate si sta benissimo, che c'è sempre un po' di vento dal mare e che lei ha una casa troppo grande per una persona sola. Ha detto che ci avrebbe ospitato volentieri per tutto agosto. Mi ha detto di non preoccuparci per niente, perché lei avrebbe pensato a tutto: alla spesa, alla cucina, perfino ai biglietti per l'Acquario per i bambini.»", en: "'She said Genoa is lovely in summer, that there's always a bit of breeze from the sea and that her house is too big for one person. She said she'd happily put us up for the whole of August. She told me not to worry about anything, because she'd take care of everything: the shopping, the cooking, even the tickets to the Aquarium for the children.'" }
  - { es: "Franco mi guardava in silenzio. Conosce la zia Rosa da vent'anni. «E poi?» ha chiesto. «Poi ha detto che la mattina ci avrebbe portato a prendere la focaccia calda nel suo forno preferito, quello vicino alla Lanterna, e che il pomeriggio saremmo andati al mare a Boccadasse. Ha detto che la sera avrebbe preparato le trofie al pesto con il basilico del suo balcone, perché quello che si compra al supermercato, secondo lei, non sa di niente.»", en: "Franco was looking at me in silence. He's known Aunt Rosa for twenty years. 'And then?' he asked. 'Then she said that in the mornings she'd take us to get warm focaccia at her favourite bakery, the one near the Lanterna, and that in the afternoons we'd go to the beach at Boccadasse. She said that in the evenings she'd make trofie with pesto using the basil from her balcony, because the basil you buy at the supermarket, according to her, doesn't taste of anything.'" }
  - { es: "«Sembra fantastico,» ha detto Franco, un po' sospettoso. «Dov'è il problema?» Ho sorriso. «Il problema è che alla fine mi ha chiesto se tu sapessi ancora riparare le cose. Ha detto che le si era rotta la lavatrice, che la porta del bagno non si chiudeva più e che il tetto del terrazzo aveva bisogno di essere sistemato. Mi ha chiesto di dirti di portare gli attrezzi.»", en: "'Sounds fantastic,' Franco said, a bit suspicious. 'So where's the catch?' I smiled. 'The catch is that at the end she asked me whether you still knew how to fix things. She said her washing machine had broken, the bathroom door didn't shut any more and the roof of the terrace needed fixing. She asked me to tell you to bring your tools.'" }
  - { es: "Franco ha riso per un minuto intero. Poi ha detto che, in fondo, una vacanza gratis a Genova valeva bene una lavatrice. Mi ha chiesto di richiamare la zia e di dirle che saremmo arrivati il primo agosto. E ha aggiunto, a voce bassa, di chiederle se nella sua casa ci fosse almeno l'aria condizionata.", en: "Franco laughed for a whole minute. Then he said that, after all, a free holiday in Genoa was well worth a washing machine. He asked me to call my aunt back and tell her we'd arrive on the first of August. And he added, quietly, that I should ask her whether there was at least air conditioning in her house." }
  - { es: "L'ho richiamata subito. Lei ha detto che l'aria condizionata non serviva, perché a Genova c'è sempre il vento. Poi ha detto che doveva andare, perché aveva la focaccia in forno. Ancora oggi non so se fosse vero.", en: "I called her back straight away. She said air conditioning wasn't necessary, because in Genoa there's always a breeze. Then she said she had to go, because she had focaccia in the oven. To this day I don't know if it was true." }
questions:
  - { q: "Che cosa ha detto la zia del suo medico?", options: ["Che le aveva trovato la pressione di una ragazza", "Che doveva fare una dieta", "Che era in vacanza"], answer: 0, explain: "The doctor said she had the blood pressure of a twenty-year-old." }
  - { q: "Che cosa ha proposto la zia Rosa?", options: ["Di andare tutti al mare in Sicilia", "Di ospitarli a Genova per tutto agosto", "Di venire lei a casa loro"], answer: 1, explain: "«Ha detto che ci avrebbe ospitato volentieri per tutto agosto» – future in the past = condizionale passato." }
  - { q: "Perché la zia non compra il basilico al supermercato?", options: ["Perché è troppo caro", "Perché, secondo lei, non sa di niente", "Perché il supermercato è lontano"], answer: 1, explain: "She uses basil from her balcony: shop-bought basil «non sa di niente»." }
  - { q: "Qual è il «problema» della vacanza?", options: ["La zia vuole che Franco ripari alcune cose in casa", "La casa è troppo piccola", "Fa troppo caldo a Genova"], answer: 0, explain: "Washing machine, bathroom door, terrace roof: «Mi ha chiesto di dirti di portare gli attrezzi.»" }
  - { q: "Che cosa ha risposto la zia sull'aria condizionata?", options: ["Che l'avrebbe comprata", "Che non serviva perché a Genova c'è sempre il vento", "Che era rotta"], answer: 1, explain: "Reported speech: «Ha detto che l'aria condizionata non serviva.»" }
