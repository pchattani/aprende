id: b2.u06
title: "Grenoble, la ville sur laquelle on parie"
lessons:
  - id: b2.u06.l1
    title: Le laboratoire dans lequel elle travaille
    teach: [g.relative-lequel]
    tip: "After a preposition, use lequel / laquelle / lesquels / lesquelles for things, agreeing with the noun: le labo dans lequel, la raison pour laquelle. For people, qui is preferred: la chercheuse avec qui je travaille."
    vocab: [w.science, w.scientifique, w.scientifique.n, w.laboratoire, w.innovation, w.innovant, w.technologie, w.technologique, w.ingénieur, w.physique, w.chimie, w.biologie, w.mathématiques, w.informatique, w.informaticien, w.atome, w.électricité, w.électrique, w.électronique, w.microscope, w.théorie, w.analyser, w.analyse, w.résultat, w.données, w.mesure, w.expérimenter]
    sentences:
      - { es: "C'est le laboratoire dans lequel elle travaille depuis dix ans.", en: "It's the laboratory she has been working in for ten years.", altEs: ["C'est le laboratoire où elle travaille depuis dix ans."], grammar: [g.relative-lequel, g.depuis-present], vocab: [w.laboratoire], error: { wrong: "C'est le laboratoire dans laquelle elle travaille depuis dix ans.", explain: "lequel agrees with laboratoire (masculine singular): dans lequel.", grammar: g.relative-lequel } }
      - { es: "Voici la raison pour laquelle je suis venu à Grenoble : la science.", en: "Here's the reason why I came to Grenoble: science.", altEs: ["Voici la raison pour laquelle je suis venue à Grenoble : la science."], grammar: [g.relative-lequel], vocab: [w.science] }
      - { es: "Les outils avec lesquels les ingénieurs travaillent coûtent très cher.", en: "The tools the engineers work with are very expensive.", grammar: [g.relative-lequel], vocab: [w.ingénieur] }
      - { es: "Le microscope avec lequel nous travaillons a coûté deux millions d'euros.", en: "The microscope we work with cost two million euros.", altEs: ["Le microscope avec lequel on travaille a coûté deux millions d'euros."], grammar: [g.relative-lequel], vocab: [w.microscope] }
      - { es: "La théorie sur laquelle repose son travail date des années 1930.", en: "The theory his work is based on dates from the 1930s.", altEn: ["The theory on which her work rests dates from the 1930s."], grammar: [g.relative-lequel], vocab: [w.théorie] }
      - { es: "Ce sont des résultats sur lesquels personne ne comptait.", en: "These are results nobody was counting on.", grammar: [g.relative-lequel], vocab: [w.résultat], transform: { instruction: "Replace 'des résultats' with 'une découverte'", answer: "C'est une découverte sur laquelle personne ne comptait.", en: "It's a discovery nobody was counting on." } }
      - { es: "On a analysé les données parmi lesquelles se cachait l'erreur.", en: "We analysed the data in which the mistake was hiding.", altEs: ["Nous avons analysé les données parmi lesquelles se cachait l'erreur."], grammar: [g.relative-lequel], vocab: [w.données, w.analyser], error: { wrong: "On a analysé les données parmi qui se cachait l'erreur.", explain: "After parmi, always lesquels / lesquelles, never qui.", grammar: g.relative-lequel } }
      - { es: "Grenoble est une ville dans laquelle l'innovation est partout.", en: "Grenoble is a city where innovation is everywhere.", altEs: ["Grenoble est une ville où l'innovation est partout."], grammar: [g.relative-lequel], vocab: [w.innovation] }
      - { es: "C'est une technologie sans laquelle nos téléphones ne fonctionneraient pas.", en: "It's a technology without which our phones wouldn't work.", grammar: [g.relative-lequel, g.conditionnel-present], vocab: [w.technologie], transform: { instruction: "Replace 'une technologie' with 'des outils'", answer: "Ce sont des outils sans lesquels nos téléphones ne fonctionneraient pas.", en: "They're tools without which our phones wouldn't work." } }
      - { es: "La scientifique avec qui je travaille enseigne aussi la physique.", en: "The scientist I work with also teaches physics.", altEs: ["La scientifique avec laquelle je travaille enseigne aussi la physique."], grammar: [g.relative-lequel], vocab: [w.scientifique.n, w.physique], note: "For people, qui is preferred after a preposition; lequel is possible but more formal." }
      - { es: "Lequel de ces deux cours de chimie veux-tu suivre ?", en: "Which of these two chemistry classes do you want to take?", altEs: ["Tu veux suivre lequel de ces deux cours de chimie ?"], grammar: [g.relative-lequel, g.quel], vocab: [w.chimie] }
      - { es: "L'électricité, c'est le domaine dans lequel mon père a fait toute sa carrière.", en: "Electricity is the field in which my father spent his whole career.", grammar: [g.relative-lequel], vocab: [w.électricité] }
      - { es: "La matière dans laquelle je suis le plus fort, ce sont les mathématiques.", en: "The subject I'm best at is maths.", altEs: ["La matière dans laquelle je suis la plus forte, ce sont les mathématiques."], grammar: [g.relative-lequel], vocab: [w.mathématiques] }
      - { es: "L'informatique est un secteur dans lequel on trouve facilement du travail.", en: "IT is a sector where you can easily find work.", altEs: ["L'informatique est un secteur où on trouve facilement du travail."], grammar: [g.relative-lequel], vocab: [w.informatique] }
      - { es: "La biologie est la science grâce à laquelle on comprend le vivant.", en: "Biology is the science through which we understand living things.", grammar: [g.relative-lequel, g.auquel-duquel], vocab: [w.biologie] }
      - { es: "Ce sont des mesures sans lesquelles on ne peut pas expérimenter.", en: "These are measurements without which you can't experiment.", grammar: [g.relative-lequel], vocab: [w.mesure, w.expérimenter] }
    exchanges:
      - q: { es: "Sur quoi tu travailles en ce moment ?", en: "What are you working on at the moment?" }
        a: { es: "Sur un projet de biologie pour lequel on cherche encore de l'argent.", en: "On a biology project we're still looking for money for." }
        alt: ["Sur une nouvelle théorie.", "Sur l'analyse de nos résultats."]
        grammar: [g.relative-lequel]
        vocab: [w.biologie]
      - q: { es: "C'est quoi, ce bâtiment ?", en: "What's that building?" }
        a: { es: "C'est le laboratoire dans lequel on étudie les atomes.", en: "It's the laboratory where they study atoms." }
        alt: ["Un laboratoire de physique.", "C'est un centre de recherche."]
        grammar: [g.relative-lequel]
        vocab: [w.laboratoire, w.atome]
      - q: { es: "Pourquoi as-tu choisi Grenoble ?", en: "Why did you choose Grenoble?" }
        a: { es: "C'est une ville dans laquelle la recherche scientifique est très présente.", en: "It's a city where scientific research is very much present." }
        alt: ["Pour la recherche et pour la montagne.", "Parce que c'est une ville innovante."]
        grammar: [g.relative-lequel]
        vocab: [w.scientifique, w.innovant]
      - q: { es: "Lequel de ces vélos est électrique ?", en: "Which of these bikes is electric?" }
        a: { es: "Celui avec lequel je suis venu ce matin.", en: "The one I came on this morning." }
        alt: ["Le rouge.", "Celui de gauche."]
        grammar: [g.relative-lequel, g.demonstrative-pronouns]
        vocab: [w.électrique]
      - q: { es: "Qu'est-ce que votre entreprise fabrique ?", en: "What does your company make?" }
        a: { es: "Des cartes électroniques sans lesquelles aucun téléphone ne fonctionnerait.", en: "Electronic boards without which no phone would work." }
        alt: ["Du matériel technologique.", "Des cartes électroniques."]
        grammar: [g.relative-lequel]
        vocab: [w.électronique, w.technologique]
    texts:
      - title: "Présentation d'un laboratoire"
        es: ["Notre laboratoire est un lieu dans lequel des chercheurs en physique et en biologie travaillent ensemble.", "Les appareils avec lesquels nous travaillons sont parmi les plus innovants d'Europe.", "C'est la raison pour laquelle des chercheurs du monde entier viennent ici."]
        en: ["Our laboratory is a place where physics and biology researchers work together.", "The equipment we work with is among the most innovative in Europe.", "That's why researchers from all over the world come here."]
        grammar: [g.relative-lequel]
        vocab: [w.laboratoire, w.physique, w.biologie, w.innovant]
      - title: "Message d'Inès"
        es: ["Je t'envoie la photo du bâtiment dans lequel je fais mon stage.", "C'est un centre de recherche technologique sur la presqu'île.", "L'informaticien avec qui je travaille est génial !"]
        en: ["I'm sending you a photo of the building where I'm doing my internship.", "It's a technology research centre on the peninsula.", "The computer scientist I work with is brilliant!"]
        grammar: [g.relative-lequel]
        vocab: [w.technologique, w.informaticien]
    spicy:
      - { es: "Voilà la raison pour laquelle je viens à la bibliothèque tous les jours : toi.", en: "That's the reason I come to the library every day: you.", grammar: [g.relative-lequel], vocab: [] }
      - { es: "Le café dans lequel on s'est rencontrés est devenu mon labo préféré.", en: "The café where we met has become my favourite lab.", grammar: [g.relative-lequel], vocab: [] }
      - { es: "Il n'y a aucune théorie avec laquelle je peux expliquer l'effet que tu me fais.", en: "There's no theory I can explain the effect you have on me with.", grammar: [g.relative-lequel], vocab: [w.théorie] }
      - { es: "Entre nous, il y a une chimie sans laquelle ce rendez-vous serait très ennuyeux.", en: "Between us there's a chemistry without which this date would be very boring.", grammar: [g.relative-lequel], vocab: [w.chimie] }
      - { es: "Lequel de nous deux va inviter l'autre en premier ?", en: "Which of us is going to ask the other out first?", grammar: [g.relative-lequel, g.futur-proche], vocab: [] }
  - id: b2.u06.l2
    title: Le colloque auquel j'ai participé
    teach: [g.auquel-duquel]
    tip: "à + lequel → auquel, auxquels, auxquelles (but à laquelle); de + lequel → duquel, desquels, desquelles (but de laquelle). Use them after verbs with à (participer à, penser à) and after au bord de, près de, au milieu de…"
    vocab: [w.auquel, w.duquel, w.collaborer, w.collaboration, w.participer, w.conférence, w.colloque, w.campus, w.start-up, w.brevet, w.financement, w.subvention, w.signer, w.signature, w.travaux, w.sujet, w.au-bord-de, w.bord, w.au-milieu-de, w.milieu, w.à-l-intérieur-de, w.à-l-extérieur-de, w.au-dessus-de, w.au-dessous-de, w.pôle, w.pionnier]
    sentences:
      - { es: "Le colloque auquel j'ai participé portait sur l'énergie.", en: "The symposium I took part in was about energy.", grammar: [g.auquel-duquel], vocab: [w.colloque, w.auquel, w.participer], transform: { instruction: "Replace 'le colloque' with 'la conférence'", answer: "La conférence à laquelle j'ai participé portait sur l'énergie.", en: "The conference I took part in was about energy." } }
      - { es: "Ce sont des questions auxquelles personne n'a de réponse.", en: "These are questions nobody has an answer to.", grammar: [g.auquel-duquel], vocab: [w.auquel] }
      - { es: "La conférence à laquelle j'assiste commence à neuf heures.", en: "The lecture I'm attending starts at nine.", grammar: [g.auquel-duquel], vocab: [w.conférence], transform: { instruction: "Replace 'la conférence' with 'le cours'", answer: "Le cours auquel j'assiste commence à neuf heures.", en: "The class I'm attending starts at nine." } }
      - { es: "Le campus près duquel j'habite est immense.", en: "The campus I live near is huge.", grammar: [g.auquel-duquel, g.dont-vs-duquel], vocab: [w.campus, w.duquel], error: { wrong: "Le campus près dont j'habite est immense.", explain: "After a compound preposition (près de), use duquel, not dont.", grammar: g.dont-vs-duquel } }
      - { es: "La start-up avec laquelle nous collaborons a obtenu trois brevets.", en: "The start-up we work with has obtained three patents.", altEs: ["La start-up avec laquelle on collabore a obtenu trois brevets."], grammar: [g.relative-lequel], vocab: [w.start-up, w.collaborer, w.brevet] }
      - { es: "C'est un projet de collaboration auquel la ville tient beaucoup.", en: "It's a joint project the city cares about a lot.", grammar: [g.auquel-duquel], vocab: [w.collaboration], note: "tenir à quelque chose = to care about something." }
      - { es: "Le financement grâce auquel le labo existe vient de l'Europe.", en: "The funding the lab exists thanks to comes from Europe.", altEn: ["The funding that keeps the lab going comes from Europe."], grammar: [g.auquel-duquel], vocab: [w.financement] }
      - { es: "La subvention à laquelle nous avions droit n'est jamais arrivée.", en: "The grant we were entitled to never arrived.", altEs: ["La subvention à laquelle on avait droit n'est jamais arrivée."], grammar: [g.auquel-duquel], vocab: [w.subvention] }
      - { es: "Voici le contrat au bas duquel vous devez signer.", en: "Here's the contract you need to sign at the bottom of.", altEn: ["Here's the contract; you need to sign at the bottom."], grammar: [g.auquel-duquel], vocab: [w.signer] }
      - { es: "Les travaux à cause desquels la route est fermée dureront un mois.", en: "The roadworks the road is closed because of will last a month.", altEn: ["The roadworks that have closed the road will last a month."], grammar: [g.auquel-duquel], vocab: [w.travaux], error: { wrong: "Les travaux à cause de lesquels la route est fermée dureront un mois.", explain: "de + lesquels contracts to desquels.", grammar: g.auquel-duquel } }
      - { es: "C'est un sujet auquel je pense souvent.", en: "It's a subject I often think about.", grammar: [g.auquel-duquel], vocab: [w.sujet] }
      - { es: "L'Isère, au bord de laquelle la ville est construite, descend des Alpes.", en: "The Isère, on whose banks the city is built, comes down from the Alps.", grammar: [g.auquel-duquel], vocab: [w.au-bord-de, w.bord] }
      - { es: "Les quais au-dessus desquels passent les bulles sont toujours très animés.", en: "The embankments the bubbles pass over are always very lively.", grammar: [g.auquel-duquel], vocab: [w.au-dessus-de] }
      - { es: "Zéro degré, c'est la température au-dessous de laquelle l'eau gèle.", en: "Zero degrees is the temperature below which water freezes.", grammar: [g.auquel-duquel], vocab: [w.au-dessous-de] }
      - { es: "Le bâtiment à l'intérieur duquel se trouve le synchrotron mesure presque un kilomètre de tour.", en: "The building that houses the synchrotron is almost a kilometre round.", grammar: [g.auquel-duquel], vocab: [w.à-l-intérieur-de] }
      - { es: "Grenoble est devenue un pôle de recherche autour duquel se sont installées des centaines d'entreprises.", en: "Grenoble has become a research hub around which hundreds of companies have set up.", grammar: [g.auquel-duquel], vocab: [w.pôle] }
    exchanges:
      - q: { es: "Tu as participé au colloque sur l'énergie ?", en: "Did you take part in the energy symposium?" }
        a: { es: "Oui, c'est le colloque auquel je tenais le plus cette année.", en: "Yes, it's the symposium I cared about most this year." }
        alt: ["Oui, j'y ai présenté mon projet.", "Non, je n'ai pas pu y aller."]
        grammar: [g.auquel-duquel]
        vocab: [w.colloque, w.participer]
      - q: { es: "Qui est cet homme sur la photo ?", en: "Who's that man in the photo?" }
        a: { es: "Aristide Bergès, le pionnier à qui on doit l'expression « houille blanche ».", en: "Aristide Bergès, the pioneer we owe the expression 'white coal' to." }
        alt: ["Un pionnier de l'électricité.", "C'est Aristide Bergès."]
        grammar: [g.auquel-duquel]
        vocab: [w.pionnier]
      - q: { es: "Où se trouve la fontaine ?", en: "Where's the fountain?" }
        a: { es: "Au milieu de la place, à côté d'un café dont la terrasse est toujours pleine.", en: "In the middle of the square, next to a café whose terrace is always full." }
        alt: ["Au milieu de la place.", "Juste en face de la mairie."]
        grammar: [g.dont-vs-duquel]
        vocab: [w.au-milieu-de, w.milieu]
      - q: { es: "Où est-ce que je signe ?", en: "Where do I sign?" }
        a: { es: "En bas de la dernière page ; mettez aussi la date à côté de votre signature.", en: "At the bottom of the last page; put the date next to your signature too." }
        alt: ["Ici, en bas de la page.", "Sur la dernière page."]
        grammar: [g.imperative]
        vocab: [w.signature]
      - q: { es: "Vous attendiez où ?", en: "Where were you waiting?" }
        a: { es: "À l'extérieur du parc, devant l'entrée principale.", en: "Outside the park, in front of the main entrance." }
        alt: ["Devant l'entrée.", "Dehors, sous la pluie."]
        grammar: [g.prepositions-place]
        vocab: [w.à-l-extérieur-de]
    texts:
      - title: "Programme du colloque"
        es: ["Neuf heures : accueil sur le campus.", "Dix heures : conférence sur les projets auxquels participe notre laboratoire.", "Midi : déjeuner dans le jardin au bord duquel coule l'Isère."]
        en: ["Nine o'clock: welcome on the campus.", "Ten o'clock: lecture on the projects our laboratory is taking part in.", "Noon: lunch in the garden along which the Isère flows."]
        grammar: [g.auquel-duquel]
        vocab: [w.campus, w.conférence, w.auquel, w.duquel]
      - title: "Message d'une start-up"
        es: ["Nous avons obtenu la subvention que nous avions demandée.", "Grâce à ce financement, nous pourrons protéger nos inventions par deux nouveaux brevets.", "Merci aux laboratoires avec lesquels nous collaborons !"]
        en: ["We've been awarded the grant we applied for.", "Thanks to this funding, we'll be able to protect our inventions with two new patents.", "Thank you to the laboratories we work with!"]
        grammar: [g.relative-lequel]
        vocab: [w.subvention, w.financement, w.brevet, w.collaborer]
    spicy:
      - { es: "Le colloque auquel je suis allé était ennuyeux, mais la personne assise à côté de moi, pas du tout.", en: "The symposium I went to was boring, but the person sitting next to me wasn't at all.", altEs: ["Le colloque auquel je suis allée était ennuyeux, mais la personne assise à côté de moi, pas du tout."], grammar: [g.auquel-duquel], vocab: [w.colloque] }
      - { es: "Le banc sur lequel on s'est assis au bord de l'Isère est devenu mon endroit préféré.", en: "The bench we sat on by the Isère has become my favourite place.", grammar: [g.relative-lequel], vocab: [w.au-bord-de] }
      - { es: "Il y a une question à laquelle tu n'as pas répondu : tu es libre samedi ?", en: "There's a question you haven't answered: are you free on Saturday?", grammar: [g.auquel-duquel], vocab: [] }
      - { es: "Le projet auquel je tiens le plus en ce moment, c'est notre deuxième rendez-vous.", en: "The project I care about most right now is our second date.", grammar: [g.auquel-duquel], vocab: [w.auquel] }
      - { es: "La raison pour laquelle je suis au premier rang du colloque ? Toi, pas le sujet.", en: "The reason I'm in the front row of the symposium? You, not the subject.", grammar: [g.relative-lequel], vocab: [w.sujet] }
  - id: b2.u06.l3
    title: Le téléphérique grâce auquel on monte
    teach: [g.dont-vs-duquel]
    tip: "dont replaces a simple de (parler de, être fier de, the noun's 'whose'); duquel follows a longer preposition ending in de (au sommet duquel, près de laquelle)."
    vocab: [w.téléphérique, w.cabine, w.sphérique, w.bulle, w.relier, w.apercevoir, w.urbain, w.surnommer, w.surnom, w.mondialement, w.houille-blanche, w.barrage, w.centrale, w.propriétaire, w.locataire, w.colocation, w.colocataire, w.loger, w.meublé, w.terrain, w.jardin-public, w.propriété, w.extrémité, w.pointe, w.presqu-île, w.occidental, w.oriental]
    sentences:
      - { es: "Le téléphérique, grâce auquel on monte en quelques minutes, date de 1934.", en: "The cable car, thanks to which you go up in a few minutes, dates from 1934.", grammar: [g.auquel-duquel], vocab: [w.téléphérique] }
      - { es: "Le fort au sommet duquel nous sommes montés domine la ville.", en: "The fort we climbed to the top of overlooks the city.", altEs: ["Le fort au sommet duquel on est montés domine la ville."], grammar: [g.dont-vs-duquel], vocab: [], error: { wrong: "Le fort au sommet dont nous sommes montés domine la ville.", explain: "After a compound preposition (au sommet de), use duquel: au sommet duquel.", grammar: g.dont-vs-duquel } }
      - { es: "Les cabines dont tout le monde parle sont sphériques : on les surnomme « les bulles ».", en: "The cabins everyone talks about are round: they're nicknamed 'the bubbles'.", grammar: [g.dont-vs-duquel, g.relative-dont], vocab: [w.cabine, w.sphérique, w.surnommer, w.bulle] }
      - { es: "C'est un surnom dont les Grenoblois sont fiers.", en: "It's a nickname the people of Grenoble are proud of.", grammar: [g.dont-vs-duquel], vocab: [w.surnom] }
      - { es: "La ligne relie le centre-ville au fort, du haut duquel on aperçoit le mont Blanc par temps clair.", en: "The line links the city centre to the fort, from the top of which you can see Mont Blanc on a clear day.", grammar: [g.dont-vs-duquel], vocab: [w.relier, w.apercevoir] }
      - { es: "C'est l'un des premiers téléphériques urbains du monde, ce dont la ville est très fière.", en: "It's one of the first urban cable cars in the world, which the city is very proud of.", grammar: [g.dont-vs-duquel], vocab: [w.urbain] }
      - { es: "Grenoble, dont la recherche est mondialement connue, attire des étudiants de partout.", en: "Grenoble, whose research is world famous, attracts students from everywhere.", grammar: [g.dont-vs-duquel], vocab: [w.mondialement] }
      - { es: "On appelait « houille blanche » l'énergie de l'eau, dont les Alpes sont riches.", en: "The energy of water, which the Alps are rich in, used to be called 'white coal'.", grammar: [g.dont-vs-duquel], vocab: [w.houille-blanche] }
      - { es: "Le barrage au pied duquel nous nous sommes arrêtés produit de l'électricité.", en: "The dam we stopped at the foot of produces electricity.", altEs: ["Le barrage au pied duquel on s'est arrêtés produit de l'électricité."], grammar: [g.dont-vs-duquel], vocab: [w.barrage], transform: { instruction: "Replace 'le barrage' with 'la centrale'", answer: "La centrale au pied de laquelle nous nous sommes arrêtés produit de l'électricité.", alt: ["La centrale au pied de laquelle on s'est arrêtés produit de l'électricité."], en: "The power station we stopped at the foot of produces electricity." } }
      - { es: "La centrale dont je t'ai parlé se trouve dans la vallée.", en: "The power station I told you about is in the valley.", grammar: [g.dont-vs-duquel], vocab: [w.centrale], transform: { instruction: "Replace 'la centrale' with 'le barrage' (dont doesn't change)", answer: "Le barrage dont je t'ai parlé se trouve dans la vallée.", en: "The dam I told you about is in the valley." } }
      - { es: "Mon propriétaire, dont la fille est ingénieure, habite au-dessus de chez moi.", en: "My landlord, whose daughter is an engineer, lives above me.", altEs: ["Ma propriétaire, dont la fille est ingénieure, habite au-dessus de chez moi."], grammar: [g.dont-vs-duquel], vocab: [w.propriétaire], error: { wrong: "Mon propriétaire, que la fille est ingénieure, habite au-dessus de chez moi.", explain: "'whose' is dont: dont la fille est ingénieure.", grammar: g.dont-vs-duquel } }
      - { es: "La colocation dans laquelle je vis compte quatre colocataires.", en: "The flat share I live in has four flatmates.", grammar: [g.relative-lequel], vocab: [w.colocation, w.colocataire] }
      - { es: "Le locataire dont je parle n'a pas payé son loyer depuis trois mois.", en: "The tenant I'm talking about hasn't paid his rent for three months.", grammar: [g.dont-vs-duquel], vocab: [w.locataire] }
      - { es: "C'est un studio meublé dont le loyer est raisonnable.", en: "It's a furnished studio with a reasonable rent.", grammar: [g.dont-vs-duquel], vocab: [w.meublé] }
      - { es: "Le terrain au milieu duquel on va construire le nouveau labo appartient à l'université.", en: "The land in the middle of which the new lab will be built belongs to the university.", grammar: [g.dont-vs-duquel], vocab: [w.terrain] }
      - { es: "La presqu'île scientifique, à l'extrémité de laquelle l'Isère rejoint le Drac, accueille de grands laboratoires.", en: "The scientific peninsula, at the tip of which the Isère meets the Drac, is home to major laboratories.", grammar: [g.dont-vs-duquel], vocab: [w.presqu-île, w.extrémité] }
    exchanges:
      - q: { es: "Tu loges où pendant ton stage ?", en: "Where are you staying during your internship?" }
        a: { es: "Chez une dame qui loue une chambre meublée près du campus.", en: "With a lady who rents out a furnished room near the campus." }
        alt: ["Dans une colocation.", "Chez des amis."]
        grammar: [g.relative-qui-que]
        vocab: [w.loger, w.meublé]
      - q: { es: "Il est où, ce jardin public dont tu parles ?", en: "Where's this public garden you're talking about?" }
        a: { es: "Au bord de l'Isère, juste à côté du téléphérique.", en: "By the Isère, right next to the cable car." }
        alt: ["Près du téléphérique.", "En centre-ville."]
        grammar: [g.dont-vs-duquel]
        vocab: [w.jardin-public]
      - q: { es: "Cette maison est à vendre ?", en: "Is this house for sale?" }
        a: { es: "Oui, c'est une belle propriété dont le jardin donne sur le Vercors.", en: "Yes, it's a lovely property whose garden looks out on the Vercors." }
        alt: ["Oui, depuis un mois.", "Non, elle est louée."]
        grammar: [g.dont-vs-duquel]
        vocab: [w.propriété]
      - q: { es: "Qu'est-ce qu'on voit du fort ?", en: "What can you see from the fort?" }
        a: { es: "Du côté oriental, la chaîne de Belledonne, et du côté occidental, le Vercors.", en: "On the eastern side, the Belledonne range, and on the western side, the Vercors." }
        alt: ["Toute la ville.", "Les trois massifs et, par temps clair, le mont Blanc."]
        grammar: [g.adjective-agreement]
        vocab: [w.oriental, w.occidental]
      - q: { es: "Où se trouve le synchrotron ?", en: "Where is the synchrotron?" }
        a: { es: "À la pointe de la presqu'île, là où l'Isère rejoint le Drac.", en: "At the tip of the peninsula, where the Isère meets the Drac." }
        alt: ["Sur la presqu'île.", "Au nord-ouest de la ville."]
        grammar: [g.relative-ou]
        vocab: [w.pointe, w.presqu-île]
    texts:
      - title: "Petite annonce"
        es: ["Colocation dans un grand appartement meublé, près du campus.", "Trois colocataires, dont deux étudiantes en chimie, cherchent une quatrième personne.", "Le propriétaire, dont le bureau est au rez-de-chaussée, est très sympathique."]
        en: ["Flat share in a large furnished flat near the campus.", "Three flatmates, including two chemistry students, are looking for a fourth person.", "The landlord, whose office is on the ground floor, is very nice."]
        grammar: [g.dont-vs-duquel]
        vocab: [w.colocation, w.colocataire, w.propriétaire, w.meublé]
      - title: "Les bulles de la Bastille"
        es: ["Ouvert en 1934, le téléphérique relie le centre-ville au fort de la Bastille.", "Ses cabines sphériques, qu'on surnomme « les bulles », passent au-dessus de l'Isère.", "Du haut du fort, on aperçoit le mont Blanc par temps clair."]
        en: ["Opened in 1934, the cable car links the city centre to the Bastille fort.", "Its round cabins, nicknamed 'the bubbles', pass over the Isère.", "From the top of the fort, you can see Mont Blanc on a clear day."]
        grammar: [g.passive-voice]
        vocab: [w.téléphérique, w.relier, w.cabine, w.sphérique, w.surnommer, w.apercevoir]
    spicy:
      - { es: "La bulle dans laquelle on est montés était si petite que nos genoux se touchaient.", en: "The bubble we went up in was so small that our knees were touching.", grammar: [g.relative-lequel], vocab: [w.bulle] }
      - { es: "Tu es la personne dont je parle le plus à ma colocataire… elle commence à être jalouse.", en: "You're the person I talk about most to my flatmate… she's starting to get jealous.", grammar: [g.dont-vs-duquel], vocab: [w.colocataire] }
      - { es: "Le fort au sommet duquel tu m'as pris la main restera mon monument préféré.", en: "The fort at the top of which you took my hand will always be my favourite monument.", grammar: [g.dont-vs-duquel], vocab: [] }
      - { es: "Je t'ai trouvé un surnom : « houille blanche », parce que tu me donnes toute l'énergie dont j'ai besoin.", en: "I've found you a nickname: 'white coal', because you give me all the energy I need.", grammar: [g.dont-vs-duquel], vocab: [w.surnom, w.houille-blanche] }
      - { es: "Le jardin public au milieu duquel tu m'as attendu sous la pluie… c'était romantique ou bête ?", en: "The public garden you waited for me in the middle of, in the rain… was that romantic or silly?", altEs: ["Le jardin public au milieu duquel tu m'as attendue sous la pluie… c'était romantique ou bête ?"], grammar: [g.dont-vs-duquel], vocab: [w.jardin-public] }
  - id: b2.u06.l4
    title: Les découvertes dont on parle
    teach: [g.dont-vs-duquel, g.relative-lequel]
    tip: "The test: if the original sentence has a plain de, use dont (on parle de ce projet → le projet dont on parle). If de ends a longer preposition, use duquel (à l'intérieur de ce capteur → le capteur à l'intérieur duquel)."
    vocab: [w.mettre-au-point, w.prototype, w.robot, w.intelligence-artificielle, w.algorithme, w.numérique, w.virtuel, w.réalité-virtuelle, w.connecté, w.connexion, w.capteur, w.puce, w.semi-conducteur, w.nanotechnologie, w.observer, w.démontrer, w.phénomène, w.cellule, w.molécule, w.gène, w.génétique, w.vaccin, w.virus, w.microbe, w.espace, w.fusée, w.satellite, w.univers]
    sentences:
      - { es: "Le projet dont tout le monde parle sera présenté demain.", en: "The project everyone's talking about will be presented tomorrow.", grammar: [g.dont-vs-duquel], vocab: [] }
      - { es: "C'est une chercheuse dont les travaux sur les cellules sont célèbres.", en: "She's a researcher whose work on cells is famous.", grammar: [g.dont-vs-duquel], vocab: [w.cellule], error: { wrong: "C'est une chercheuse dont ses travaux sur les cellules sont célèbres.", explain: "dont already means 'whose': no possessive after it (dont les travaux).", grammar: g.dont-vs-duquel } }
      - { es: "Le prototype dont l'équipe est si fière a été mis au point en six mois.", en: "The prototype the team is so proud of was developed in six months.", grammar: [g.dont-vs-duquel], vocab: [w.prototype, w.mettre-au-point] }
      - { es: "Le robot avec lequel nous travaillons reconnaît les visages.", en: "The robot we work with recognises faces.", altEs: ["Le robot avec lequel on travaille reconnaît les visages."], grammar: [g.relative-lequel], vocab: [w.robot], transform: { instruction: "Replace 'le robot' with 'les machines'", answer: "Les machines avec lesquelles nous travaillons reconnaissent les visages.", alt: ["Les machines avec lesquelles on travaille reconnaissent les visages."], en: "The machines we work with recognise faces." } }
      - { es: "L'intelligence artificielle est un sujet dont on parle partout.", en: "Artificial intelligence is a subject people talk about everywhere.", grammar: [g.dont-vs-duquel], vocab: [w.intelligence-artificielle] }
      - { es: "L'algorithme sur lequel repose l'application a été écrit à Grenoble.", en: "The algorithm the app is based on was written in Grenoble.", grammar: [g.relative-lequel], vocab: [w.algorithme] }
      - { es: "Le monde numérique, dont nous dépendons tous, consomme beaucoup d'énergie.", en: "The digital world, which we all depend on, uses a lot of energy.", grammar: [g.dont-vs-duquel], vocab: [w.numérique] }
      - { es: "Le casque grâce auquel on entre dans la réalité virtuelle pèse moins de cinq cents grammes.", en: "The headset that takes you into virtual reality weighs less than five hundred grams.", grammar: [g.auquel-duquel], vocab: [w.réalité-virtuelle, w.virtuel], transform: { instruction: "Replace 'le casque' with 'les lunettes'", answer: "Les lunettes grâce auxquelles on entre dans la réalité virtuelle pèsent moins de cinq cents grammes.", en: "The glasses that take you into virtual reality weigh less than five hundred grams." } }
      - { es: "La connexion sans laquelle rien ne fonctionne est encore coupée !", en: "The connection without which nothing works is down again!", grammar: [g.relative-lequel], vocab: [w.connexion] }
      - { es: "Le capteur à l'intérieur duquel se trouve une puce mesure la qualité de l'air.", en: "The sensor that has a chip inside it measures air quality.", grammar: [g.dont-vs-duquel], vocab: [w.capteur, w.puce], error: { wrong: "Le capteur à l'intérieur dont se trouve une puce mesure la qualité de l'air.", explain: "After a compound preposition (à l'intérieur de), use duquel.", grammar: g.dont-vs-duquel } }
      - { es: "Les semi-conducteurs dont l'industrie a besoin sont fabriqués près de Grenoble.", en: "The semiconductors industry needs are made near Grenoble.", grammar: [g.dont-vs-duquel], vocab: [w.semi-conducteur] }
      - { es: "C'est un phénomène que les scientifiques observent depuis des années, mais dont ils ne connaissent pas encore la cause.", en: "It's a phenomenon scientists have been observing for years, but whose cause they don't yet know.", grammar: [g.dont-vs-duquel, g.relative-qui-que], vocab: [w.phénomène, w.observer] }
      - { es: "Cette expérience a démontré qu'il existait une molécule dont on ne savait rien.", en: "This experiment showed that there was a molecule nobody knew anything about.", grammar: [g.dont-vs-duquel, g.concordance-des-temps], vocab: [w.démontrer, w.molécule] }
      - { es: "Le gène dont dépend cette maladie a été découvert par une équipe génétique de Grenoble.", en: "The gene this disease depends on was discovered by a genetics team in Grenoble.", grammar: [g.dont-vs-duquel], vocab: [w.gène, w.génétique] }
      - { es: "Les vaccins, grâce auxquels on a sauvé des millions de vies, sont nés de la recherche sur les microbes.", en: "Vaccines, thanks to which millions of lives have been saved, came out of research into germs.", grammar: [g.auquel-duquel], vocab: [w.vaccin, w.microbe] }
      - { es: "La fusée à bord de laquelle se trouve le satellite partira demain.", en: "The rocket carrying the satellite will leave tomorrow.", grammar: [g.dont-vs-duquel], vocab: [w.fusée, w.satellite] }
    exchanges:
      - q: { es: "C'est quoi, une maison connectée ?", en: "What's a connected home?" }
        a: { es: "C'est une maison dont les appareils sont reliés à ton téléphone.", en: "It's a home whose appliances are linked to your phone." }
        alt: ["Une maison pleine d'objets connectés.", "Une maison qu'on contrôle avec son téléphone."]
        grammar: [g.dont-vs-duquel]
        vocab: [w.connecté]
      - q: { es: "Dans quel domaine Grenoble est-elle pionnière ?", en: "In what field is Grenoble a pioneer?" }
        a: { es: "Dans la nanotechnologie, un domaine auquel elle s'intéresse depuis longtemps.", en: "In nanotechnology, a field it has been interested in for a long time." }
        alt: ["Dans la nanotechnologie.", "Dans les semi-conducteurs."]
        grammar: [g.auquel-duquel]
        vocab: [w.nanotechnologie]
      - q: { es: "Le virus est dangereux ?", en: "Is the virus dangerous?" }
        a: { es: "Pas vraiment, mais c'est un virus contre lequel il n'existe pas encore de vaccin.", en: "Not really, but it's a virus there's no vaccine against yet." }
        alt: ["Non, pas du tout.", "Un peu, il faut être prudent."]
        grammar: [g.relative-lequel]
        vocab: [w.virus, w.vaccin]
      - q: { es: "Tu t'intéresses à quoi ?", en: "What are you interested in?" }
        a: { es: "À l'univers et à l'espace, des sujets auxquels je pense depuis toujours.", en: "The universe and space, subjects I've always thought about." }
        alt: ["À l'espace.", "Aux fusées et aux satellites."]
        grammar: [g.auquel-duquel]
        vocab: [w.univers, w.espace]
      - q: { es: "Elle étudie quoi, ta sœur ?", en: "What does your sister study?" }
        a: { es: "La génétique ; le laboratoire dans lequel elle fait sa thèse est à Grenoble.", en: "Genetics; the lab where she's doing her PhD is in Grenoble." }
        alt: ["La biologie.", "La génétique, à l'université."]
        grammar: [g.relative-lequel]
        vocab: [w.génétique]
    texts:
      - title: "Résumé d'article"
        es: ["Une équipe de Grenoble a mis au point un capteur dont la taille ne dépasse pas celle d'un grain de riz.", "Ce capteur, à l'intérieur duquel se trouve une puce, pourrait surveiller la qualité de l'eau.", "C'est un projet auquel participent trois laboratoires."]
        en: ["A Grenoble team has developed a sensor no bigger than a grain of rice.", "This sensor, which has a chip inside it, could monitor water quality.", "It's a project three laboratories are taking part in."]
        grammar: [g.dont-vs-duquel, g.auquel-duquel]
        vocab: [w.mettre-au-point, w.capteur, w.puce]
      - title: "Message de Lucas"
        es: ["Je suis allé voir l'exposition sur l'intelligence artificielle dont je t'avais parlé.", "Il y avait un robot avec lequel on pouvait jouer aux échecs.", "J'ai perdu en dix minutes !"]
        en: ["I went to see the exhibition on artificial intelligence I'd told you about.", "There was a robot you could play chess with.", "I lost in ten minutes!"]
        grammar: [g.dont-vs-duquel, g.relative-lequel]
        vocab: [w.intelligence-artificielle, w.robot]
    spicy:
      - { es: "L'application de rencontres dont tout le monde parle ne m'a jamais proposé quelqu'un comme toi.", en: "The dating app everyone talks about has never suggested anyone like you.", grammar: [g.dont-vs-duquel], vocab: [] }
      - { es: "Il y a entre nous un phénomène dont aucun scientifique ne pourrait expliquer la cause.", en: "There's a phenomenon between us whose cause no scientist could explain.", grammar: [g.dont-vs-duquel], vocab: [w.phénomène] }
      - { es: "Tu es le prototype dont je rêvais : beau, drôle et qui sait cuisiner.", en: "You're the prototype I dreamed of: good-looking, funny and able to cook.", altEs: ["Tu es le prototype dont je rêvais : belle, drôle et qui sait cuisiner."], grammar: [g.dont-vs-duquel], vocab: [w.prototype] }
      - { es: "Ma connexion internet est coupée, mais la connexion à laquelle je tiens, c'est la nôtre.", en: "My internet connection is down, but the connection I care about is ours.", grammar: [g.auquel-duquel], vocab: [w.connexion] }
      - { es: "Pas besoin de réalité virtuelle : la réalité dans laquelle tu existes me suffit.", en: "No need for virtual reality: the reality you exist in is enough for me.", grammar: [g.relative-lequel], vocab: [w.réalité-virtuelle] }
dialogues:
  - id: b2.u06.d1
    title: Dans les bulles
    context: "Sophie, who works in a research lab in Grenoble, takes her friend Marc up to the Bastille in the cable car."
    lines:
      - { speaker: Marc, es: "C'est ça, les fameuses bulles dont tu m'as parlé ?", en: "So these are the famous bubbles you told me about?" }
      - { speaker: Sophie, es: "Oui ! C'est le téléphérique grâce auquel on monte à la Bastille en quelques minutes.", en: "Yes! It's the cable car that takes you up to the Bastille in a few minutes." }
      - { speaker: Marc, es: "Elles sont minuscules ! Il y a de la place pour combien de personnes ?", en: "They're tiny! How many people do they hold?" }
      - { speaker: Sophie, es: "Six, je crois. Regarde, on passe au-dessus de l'Isère, au bord de laquelle se trouve mon labo.", en: "Six, I think. Look, we're going over the Isère, which my lab is beside." }
      - { speaker: Marc, es: "Lequel ? Il y en a tellement !", en: "Which one? There are so many!" }
      - { speaker: Sophie, es: "Celui dont le toit est bleu, sur la presqu'île, pas loin du synchrotron.", en: "The one with the blue roof, on the peninsula, not far from the synchrotron." }
      - { speaker: Marc, es: "Et c'est quoi, le projet sur lequel tu travailles ?", en: "And what's the project you're working on?" }
      - { speaker: Sophie, es: "Un capteur à l'intérieur duquel on met une puce minuscule. Il mesure la pollution de l'air.", en: "A sensor with a tiny chip inside it. It measures air pollution." }
      - { speaker: Marc, es: "Impressionnant. Et là-haut, qu'est-ce qu'on voit ?", en: "Impressive. And what can you see up there?" }
      - { speaker: Sophie, es: "Les trois massifs au milieu desquels la ville est construite : la Chartreuse, le Vercors et Belledonne. Et le mont Blanc, par temps clair.", en: "The three massifs the city is built in the middle of: the Chartreuse, the Vercors and Belledonne. And Mont Blanc, on a clear day." }
      - { speaker: Marc, es: "Alors croisons les doigts pour qu'il fasse beau !", en: "Then let's keep our fingers crossed for good weather!" }
    questions:
      - { q: "Qu'est-ce que « les bulles » ?", options: ["Des bonbons de Grenoble", "Les cabines du téléphérique", "Des laboratoires"], answer: 1, explain: "« les fameuses bulles » are the cabins of the cable car up to the Bastille." }
      - { q: "Où se trouve le laboratoire de Sophie ?", options: ["Au sommet de la Bastille", "Sur la presqu'île, au bord de l'Isère", "Dans le Vercors"], answer: 1, explain: "« au bord de laquelle se trouve mon labo » … « sur la presqu'île »." }
      - { q: "Sur quoi travaille Sophie ?", options: ["Un robot", "Un capteur qui mesure la pollution de l'air", "Un vaccin"], answer: 1, explain: "« Un capteur à l'intérieur duquel on met une puce minuscule. Il mesure la pollution de l'air. »" }
      - { q: "Que peut-on voir de la Bastille par temps clair ?", options: ["La mer", "Le mont Blanc", "Lyon"], answer: 1, explain: "« Et le mont Blanc, par temps clair. »" }
