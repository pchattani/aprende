id: b1.u07
title: 返工
lessons:
  - id: b1.u07.l1
    title: 一邊做嘢一邊…
    teach: [g.jat-bin-while]
    vocab: [w.jat1-bin1, w.soeng6-si1, w.jyun4-gung1, w.zik1-jyun4, w.haak3-wu6, w.haak3.b, w.bou6-mun4, w.wui6-ji5, w.man4-jyun4, w.je6-haau6, w.je6-baan1, w.haau6-leot2, w.nang4-lik6, w.zyun1-jip6, w.gung1-cing4-si1, w.leot6-si1, w.wui6-gai3, w.cit3-gai3-si1, w.cyun4-zik1, w.man4-gin2]
    tip: "Put 一邊 before each of the two verbs: 佢一邊食飯一邊覆電郵. In fast speech, 邊食邊傾."
    sentences:
      - { es: "佢一邊開會一邊覆電郵。", en: "She answers emails while she's in meetings.", altEs: ["佢邊開會邊覆電郵。", "佢一邊開會，一邊覆電郵。"], altEn: ["He answers emails while he's in meetings.", "She replies to emails during meetings."], grammar: [g.jat-bin-while], vocab: [w.jat1-bin1] }
      - { es: "我一邊做全職，一邊讀夜校。", en: "I work full-time and go to evening school at the same time.", altEs: ["我一邊做全職一邊讀夜校。", "我一邊返全職，一邊讀夜校。"], grammar: [g.jat-bin-while], vocab: [w.je6-haau6, w.cyun4-zik1] }
      - { es: "唔好一邊見客一邊睇手機。", en: "Don't look at your phone while you're with a client.", altEs: ["見客嗰陣唔好睇手機。", "唔好一邊見客，一邊睇手機。"], altEn: ["Don't check your phone while meeting a customer."], grammar: [g.jat-bin-while, g.m-hou-dont], vocab: [w.haak3.b] }
      - { es: "我哋部門啲員工成日一邊做嘢一邊聽歌。", en: "The staff in our department often listen to music while they work.", altEs: ["我哋部門嘅員工成日一邊做嘢一邊聽歌。", "我哋部門啲員工成日邊做嘢邊聽歌。"], grammar: [g.jat-bin-while], vocab: [w.bou6-mun4, w.jyun4-gung1] }
      - { es: "嗰個文員一邊聽電話，一邊寫低客戶嘅名字。", en: "That clerk writes down the client's name while she's on the phone.", altEs: ["嗰個文員一邊聽電話一邊寫低客戶嘅名字。", "嗰個文員一邊聽電話，一邊記低客戶嘅名。"], altEn: ["That clerk writes down the client's name while he's on the phone."], grammar: [g.jat-bin-while], vocab: [w.man4-jyun4, w.haak3-wu6] }
      - { es: "佢一邊做夜班一邊讀書，真係好辛苦。", en: "He works night shifts and studies at the same time; it's really hard.", altEs: ["佢一邊做夜班，一邊讀書，真係好辛苦。", "佢邊做夜班邊讀書，真係好辛苦。"], altEn: ["She works night shifts and studies at the same time; it's really hard."], grammar: [g.jat-bin-while], vocab: [w.je6-baan1] }
      - { es: "我唔識一邊講電話一邊打字。", en: "I can't talk on the phone and type at the same time.", altEs: ["我唔識一邊講電話，一邊打字。", "我唔可以一邊講電話一邊打字。"], grammar: [g.jat-bin-while, g.sik-know-how], vocab: [w.jat1-bin1] }
      - { es: "會計部嘅職員一邊計數一邊飲咖啡。", en: "The accounts staff drink coffee while they do the sums.", altEs: ["會計部啲職員一邊計數一邊飲咖啡。", "會計部嘅職員邊計數邊飲咖啡。"], grammar: [g.jat-bin-while], vocab: [w.wui6-gai3, w.zik1-jyun4] }
      - { es: "個設計師一邊聽客戶講，一邊畫畫。", en: "The designer sketches while the client is talking.", altEs: ["個設計師一邊聽客戶講一邊畫畫。", "嗰個設計師一邊聽客戶講，一邊畫。"], altEn: ["The designer draws as she listens to the client."], grammar: [g.jat-bin-while], vocab: [w.cit3-gai3-si1, w.haak3-wu6] }
      - { es: "工程師一邊行一邊同我講個問題。", en: "The engineer told me about the problem as we walked.", altEs: ["工程師一邊行，一邊同我講個問題。", "個工程師邊行邊同我講個問題。"], altEn: ["The engineer explained the problem to me while walking."], grammar: [g.jat-bin-while], vocab: [w.gung1-cing4-si1] }
      - { es: "佢好專業，一邊笑住同客講嘢，一邊幫佢哋搵文件。", en: "She's very professional: she chats to customers with a smile while finding their documents.", altEs: ["佢好專業，一邊笑住同客人講嘢，一邊幫佢哋搵文件。"], altEn: ["He's very professional: he chats to customers with a smile while finding their documents."], grammar: [g.jat-bin-while, g.zyu-continuous], vocab: [w.zyun1-jip6, w.haak3.b] }
      - { es: "一邊開會一邊食嘢，效率真係會高啲咩？", en: "Is it really more efficient to eat during meetings?", altEs: ["一邊開會一邊食嘢，效率真係高啲咩？", "邊開會邊食嘢，效率真係高啲咩？"], grammar: [g.jat-bin-while], vocab: [w.haau6-leot2, w.wui6-ji5] }
      - { es: "做律師要有能力一邊聽一邊諗。", en: "As a lawyer you need to be able to think while you listen.", altEs: ["做律師要識一邊聽一邊諗。", "做律師一定要有能力一邊聽一邊諗。"], grammar: [g.jat-bin-while], vocab: [w.leot6-si1, w.nang4-lik6] }
      - { es: "我上司一邊食早餐一邊睇新聞。", en: "My boss reads the news while having breakfast.", altEs: ["我嘅上司一邊食早餐一邊睇新聞。", "我上司一邊食早餐，一邊睇新聞。"], grammar: [g.jat-bin-while], vocab: [w.soeng6-si1], transform: { instruction: "Turn it into a command: tell someone not to do the two things together (唔好…)", answer: "唔好一邊食早餐一邊睇新聞。", alt: ["唔好一邊食早餐，一邊睇新聞。"], en: "Don't read the news while you're having breakfast." } }
      - { es: "佢一邊開會一邊寫低重點。", en: "He writes down the key points during the meeting.", altEs: ["佢一邊開會，一邊寫低重點。", "佢一邊開會一邊記低重點。"], altEn: ["She notes down the key points while in the meeting."], grammar: [g.jat-bin-while], vocab: [w.wui6-ji5], error: { wrong: "佢開會一邊寫低重點。", explain: "Both actions need 一邊: 一邊開會一邊寫低重點.", grammar: g.jat-bin-while } }
      - { es: "我哋邊食邊傾啦。", en: "Let's talk while we eat.", altEs: ["我哋一邊食一邊傾啦。", "不如邊食邊傾啦。"], grammar: [g.jat-bin-while], vocab: [w.jat1-bin1], transform: { instruction: "Use the full form with 一邊…一邊", answer: "我哋一邊食一邊傾啦。", alt: ["我哋一邊食，一邊傾啦。"] } }
    exchanges:
      - q: { es: "你點解咁攰呀？", en: "Why are you so tired?" }
        a: { es: "我一邊返工一邊讀夜校，冇時間休息。", en: "I'm working and going to evening school at the same time; I have no time to rest." }
        alt: ["我一邊做夜班一邊讀書。", "我日日一邊返工一邊讀夜校。"]
        grammar: [g.jat-bin-while]
        vocab: [w.je6-haau6]
      - q: { es: "你哋部門有幾多個員工？", en: "How many staff are there in your department?" }
        a: { es: "有十二個，連埋我。", en: "Twelve, including me." }
        alt: ["十二個。", "連埋我有十二個員工。"]
        grammar: [g.jat-bin-while]
        vocab: [w.bou6-mun4, w.jyun4-gung1]
      - q: { es: "你開會嗰陣做乜嘢？", en: "What do you do during meetings?" }
        a: { es: "我一邊聽一邊寫低重點。", en: "I listen and write down the key points." }
        alt: ["一邊聽一邊寫低重點。", "我邊聽邊記低重點。"]
        grammar: [g.jat-bin-while]
        vocab: [w.wui6-ji5]
      - q: { es: "嗰位係邊個嚟㗎？", en: "Who's that?" }
        a: { es: "佢係我哋嘅新客戶，係個律師。", en: "He's our new client; he's a lawyer." }
        alt: ["佢係新客戶。", "係我哋嘅新客戶，做律師嘅。"]
        grammar: [g.jat-bin-while]
        vocab: [w.haak3-wu6, w.leot6-si1]
      - q: { es: "可唔可以一邊揸車一邊講電話？", en: "Can you talk on the phone while driving?" }
        a: { es: "唔可以，好危險㗎。", en: "No, it's really dangerous." }
        alt: ["梗係唔可以啦。", "唔得，好危險。"]
        grammar: [g.jat-bin-while, g.ho-ji-can-may]
        vocab: [w.jat1-bin1]
    texts:
      - title: "喺米埔返工"
        es: ["我喺米埔做職員。", "每日我一邊帶遊客行，一邊介紹啲雀。", "放工之後，我仲要去讀夜校。"]
        en: ["I work as a staff member at Mai Po.", "Every day I show visitors around while telling them about the birds.", "After work I still have to go to evening school."]
        grammar: [g.jat-bin-while]
        vocab: [w.zik1-jyun4, w.je6-haau6]
      - title: "上司嘅提醒"
        es: ["各位員工：開會嗰陣請唔好一邊開會一邊睇手機。", "有問題可以一邊聽一邊寫低。", "多謝大家。"]
        en: ["Dear staff: please don't look at your phones during meetings.", "If you have questions, you can write them down as you listen.", "Thank you, everyone."]
        grammar: [g.jat-bin-while]
        vocab: [w.jyun4-gung1, w.wui6-ji5]
    spicy:
      - { es: "佢一邊開會一邊望住我笑，我點專心呀？", en: "He keeps smiling at me during the meeting; how am I supposed to concentrate?", altEs: ["佢一邊開會，一邊望住我笑，我點專心呀？"], altEn: ["She keeps smiling at me during the meeting; how am I supposed to concentrate?"], grammar: [g.jat-bin-while], vocab: [w.wui6-ji5, w.zyun1-sam1] }
      - { es: "唔好一邊同我食飯一邊覆你上司嘅電郵啦。", en: "Don't answer your boss's emails while you're having dinner with me.", altEs: ["唔好一邊同我食飯，一邊覆你上司嘅電郵啦。"], grammar: [g.jat-bin-while], vocab: [w.soeng6-si1] }
      - { es: "我哋邊食邊傾，傾到聽朝都得。", en: "Let's talk while we eat; we can talk until tomorrow morning if you like.", altEs: ["我哋一邊食一邊傾，傾到聽朝都得。"], grammar: [g.jat-bin-while], vocab: [w.jat1-bin1] }
      - { es: "佢一邊扮做嘢，一邊偷睇隔籬部門個靚仔。", en: "She pretends to work while sneaking looks at the handsome guy from the next department.", altEs: ["佢一邊扮做嘢一邊偷睇隔籬部門個靚仔。"], grammar: [g.jat-bin-while], vocab: [w.bou6-mun4] }
      - { es: "我一邊做夜班一邊諗你，效率差咗好多。", en: "I think about you all through my night shift; my efficiency has dropped a lot.", altEs: ["我一邊做夜班，一邊諗住你，效率差咗好多。"], grammar: [g.jat-bin-while], vocab: [w.je6-baan1, w.haau6-leot2] }
  - id: b1.u07.l2
    title: 做完先走
    teach: [g.sin-final]
    vocab: [w.bou3-gou3, w.man4-gin2, w.dong2-on3, w.daa2-jan3, w.jing2-jan3, w.jing2-jan3-gei1, w.cim1-meng2, w.cim1, w.hap6-joek3, w.hong6-muk6, w.sei2-sin3, w.haan6-kei4, w.fu6-zaak3, w.cyu5-lei5, w.on1-paai4, w.gan1-zeon3, w.gim2-caa4, w.gaai2-sik1, w.gaai2-kyut3, w.gon2]
    tip: "先 at the end of a clause means 'first': 我做完份報告先. Clause + 先 + verb means 'only then': 做完先可以走."
    sentences:
      - { es: "我做完份報告先走。", en: "I'll finish the report before I leave.", altEs: ["我做完份報告先至走。", "等我做完份報告先走。"], altEn: ["I'm only leaving once the report is done."], grammar: [g.sin-final], vocab: [w.bou3-gou3] }
      - { es: "你簽咗份合約先，跟住我哋再傾。", en: "Sign the contract first, then we'll talk.", altEs: ["你簽咗份合約先，然後我哋再傾。", "你簽咗份合約先，我哋再傾。"], grammar: [g.sin-final], vocab: [w.cim1, w.hap6-joek3] }
      - { es: "等我檢查吓份文件先。", en: "Let me check the document first.", altEs: ["等我睇吓份文件先。", "我檢查吓份文件先。"], grammar: [g.sin-final], vocab: [w.gim2-caa4, w.man4-gin2] }
      - { es: "死線係聽日，我哋要趕完先可以放工。", en: "The deadline is tomorrow; we can only clock off once we've rushed it through.", altEs: ["死線係聽日，我哋要趕完先至可以放工。", "聽日就係死線，我哋要趕完先可以放工。"], grammar: [g.sin-final], vocab: [w.sei2-sin3, w.gon2] }
      - { es: "你係邊個先？", en: "Who are you, anyway?", altEs: ["你究竟係邊個先？"], altEn: ["And who are you, exactly?"], grammar: [g.sin-final], vocab: [] }
      - { es: "處理咗呢個問題先，其他嘢遲啲再算。", en: "Deal with this problem first; the rest can wait.", altEs: ["處理咗呢個問題先，其他嘢遲啲先算。", "先處理呢個問題，其他嘢遲啲再算。"], grammar: [g.sin-final], vocab: [w.cyu5-lei5] }
      - { es: "呢個項目邊個負責先？", en: "So who's actually in charge of this project?", altEs: ["呢個項目係邊個負責先？"], altEn: ["First of all, who is responsible for this project?"], grammar: [g.sin-final], vocab: [w.hong6-muk6, w.fu6-zaak3] }
      - { es: "佢十點先返到公司。", jp: "keoi5 sap6 dim2 sin1 faan1 dou3 gung1 si1", en: "He didn't get to the office until ten.", altEs: ["佢十點先至返到公司。", "佢十點先到公司。"], altEn: ["She didn't get to the office until ten."], grammar: [g.sin-final], vocab: [w.gon2] }
      - { es: "我打印埋呢個檔案先。", en: "Let me just print this file first.", altEs: ["等我打印埋呢個檔案先。", "我打印咗呢個檔案先。"], grammar: [g.sin-final], vocab: [w.daa2-jan3, w.dong2-on3] }
      - { es: "你解釋清楚先，我先決定。", en: "Explain it clearly first, and only then will I decide.", altEs: ["你解釋清楚先，我先至決定。", "你講清楚先，我先決定。"], grammar: [g.sin-final], vocab: [w.gaai2-sik1] }
      - { es: "我去跟進嗰個客戶先，遲啲再安排會議。", en: "I'll follow up with that client first and arrange the meeting later.", altEs: ["我跟進咗嗰個客戶先，遲啲再安排會議。", "我先去跟進嗰個客戶，遲啲再安排會議。"], grammar: [g.sin-final], vocab: [w.gan1-zeon3, w.on1-paai4] }
      - { es: "部影印機壞咗，師傅下晝先嚟。", en: "The photocopier is broken, and the repairman won't come until the afternoon.", altEs: ["部影印機壞咗，師傅下晝先至嚟。"], grammar: [g.sin-final], vocab: [w.jing2-jan3-gei1] }
      - { es: "限期仲有一個禮拜，唔使咁趕。", en: "There's still a week before the deadline, no need to rush.", altEs: ["仲有一個禮拜先到限期，唔使咁趕。", "限期仲有一個星期，唔使咁趕。"], grammar: [g.sin-final, g.zung-still], vocab: [w.haan6-kei4, w.gon2] }
      - { es: "我覆咗個電郵先。", en: "I'll answer the email first.", altEs: ["等我覆咗個電郵先。", "我覆埋個電郵先。"], grammar: [g.sin-final], vocab: [], error: { wrong: "我覆先咗個電郵。", explain: "Final 先 comes at the very end of the clause, after the object: 我覆咗個電郵先.", grammar: g.sin-final } }
      - { es: "你先影印啲文件。", en: "Photocopy the documents first.", altEs: ["你影印咗啲文件先。"], grammar: [g.sin-final], vocab: [w.jing2-jan3, w.man4-gin2], transform: { instruction: "Move 先 to the end of the sentence (more colloquial)", answer: "你影印啲文件先。", alt: ["你影印咗啲文件先。"] } }
      - { es: "我哋要解決咗呢個問題先可以簽名。", en: "We can only sign once we've solved this problem.", altEs: ["我哋要解決咗呢個問題先至可以簽名。", "解決咗呢個問題先可以簽名。"], grammar: [g.sin-final], vocab: [w.gaai2-kyut3, w.cim1-meng2], transform: { instruction: "Say it with 'they' (佢哋) as the subject", answer: "佢哋要解決咗呢個問題先可以簽名。", alt: ["佢哋要解決咗呢個問題先至可以簽名。"] } }
    exchanges:
      - q: { es: "我哋幾時開會呀？", en: "When are we having the meeting?" }
        a: { es: "等我睇吓老細得唔得閒先。", en: "Let me check whether the boss is free first." }
        alt: ["等我問吓老細先。", "我睇吓上司幾時得閒先。"]
        grammar: [g.sin-final]
        vocab: [w.wui6-ji5]
      - q: { es: "我可唔可以而家放工呀？", en: "Can I clock off now?" }
        a: { es: "唔得，你做完份報告先可以走。", en: "No, you can only leave once the report is done." }
        alt: ["做完份報告先可以走。", "唔得，做完份報告先。"]
        grammar: [g.sin-final]
        vocab: [w.bou3-gou3]
      - q: { es: "份合約你簽咗未呀？", en: "Have you signed the contract yet?" }
        a: { es: "未呀，我要叫律師睇吓先。", en: "Not yet, I need to get a lawyer to look at it first." }
        alt: ["未，我想律師睇吓先。", "仲未簽，等律師睇咗先。"]
        grammar: [g.sin-final]
        vocab: [w.hap6-joek3, w.cim1]
      - q: { es: "呢個項目邊個負責？", en: "Who's in charge of this project?" }
        a: { es: "係我負責，有問題可以搵我。", en: "I am; if there's a problem you can come to me." }
        alt: ["我負責。", "係我，有問題搵我啦。"]
        grammar: [g.sin-final]
        vocab: [w.hong6-muk6, w.fu6-zaak3]
      - q: { es: "死線係幾時？", en: "When's the deadline?" }
        a: { es: "星期五，不過老細想星期四先睇吓。", en: "Friday, but the boss wants to have a look on Thursday first." }
        alt: ["星期五。", "限期係星期五。"]
        grammar: [g.sin-final]
        vocab: [w.sei2-sin3, w.haan6-kei4]
    texts:
      - title: "上司嘅短訊"
        es: ["今日下晝三點開會。", "你影印咗份文件先，每人一份。", "死線係星期五，唔好遲。"]
        en: ["The meeting is at three this afternoon.", "Photocopy the document first, one copy each.", "The deadline is Friday; don't be late."]
        grammar: [g.sin-final]
        vocab: [w.jing2-jan3, w.man4-gin2, w.sei2-sin3]
      - title: "辦公室通告"
        es: ["影印機壞咗，維修師傅下晝先嚟。", "要打印文件，請用樓上嗰部。", "用之前請檢查吓有冇紙。"]
        en: ["The photocopier is broken; the repairman isn't coming until the afternoon.", "To print documents, please use the one upstairs.", "Before using it, please check there's paper."]
        grammar: [g.sin-final]
        vocab: [w.jing2-jan3-gei1, w.daa2-jan3, w.gim2-caa4]
    spicy:
      - { es: "你講先：係咪你送花畀我？", en: "You first: was it you who sent me flowers?", altEs: ["你講先，係唔係你送花畀我？"], grammar: [g.sin-final], vocab: [] }
      - { es: "簽咗呢份合約先可以約我食飯。", en: "You have to sign this contract before you can ask me to dinner.", altEs: ["簽咗呢份合約先至可以約我食飯。"], grammar: [g.sin-final], vocab: [w.cim1, w.hap6-joek3] }
      - { es: "你係邊個先？點解每次開會都坐我隔籬？", en: "Who are you, anyway? Why do you sit next to me at every meeting?", grammar: [g.sin-final], vocab: [w.wui6-ji5] }
      - { es: "飲杯嘢先，份報告聽日先做啦。", en: "Let's have a drink first; the report can wait until tomorrow.", altEs: ["飲杯嘢先，份報告聽日先至做啦。"], grammar: [g.sin-final], vocab: [w.bou3-gou3] }
      - { es: "你解釋清楚先，點解你個電腦有我張相？", jp: "nei5 gaai2 sik1 cing1 co2 sin1 dim2 gaai2 nei5 go3 din6 nou5 jau5 ngo5 zoeng1 soeng2", en: "Explain this first: why is my photo on your computer?", altEs: ["你解釋清楚先：點解你部電腦有我張相？"], grammar: [g.sin-final], vocab: [w.gaai2-sik1] }
  - id: b1.u07.l3
    title: 啱啱出糧
    teach: [g.ngaam-ngaam-just]
    vocab: [w.sau1-dou2, w.ngaam1-ngaam1-hou2, w.nin4-gaa3, w.gaa1-jan4-gung1, w.zoeng2-gam1, w.faa1-hung4, w.soeng1-loeng4, w.ceot1-loeng4, w.sing1-zik1, w.ci4-zik1, w.teoi3-jau1, w.hoi1-gung1, w.baau1-kut3, w.cing1-git3-gung1, w.gung1-jan4, w.ze2-ze2, w.zaap6-gwaan3, w.syun1-bou3, w.hing3-zuk1]
    tip: "啱啱 goes before the verb: 我啱啱收到. 啱啱好 means 'just right'; 頭先 means 'earlier today'."
    sentences:
      - { es: "我啱啱收到你個電郵。", en: "I've just got your email.", altEs: ["我啱啱收到你封電郵。", "啱啱收到你個電郵。"], grammar: [g.ngaam-ngaam-just], vocab: [w.sau1-dou2] }
      - { es: "老細啱啱話今年有雙糧！", en: "The boss has just said we're getting a thirteenth-month bonus this year!", altEs: ["老細頭先話今年有雙糧！", "上司啱啱話今年有雙糧！"], grammar: [g.ngaam-ngaam-just, g.reported-speech], vocab: [w.soeng1-loeng4] }
      - { es: "佢啱啱升咗職，所以請大家食飯。", en: "He's just been promoted, so he's treating everyone to a meal.", altEs: ["佢啱啱升職，所以請大家食飯。"], altEn: ["She's just been promoted, so she's treating everyone to dinner."], grammar: [g.ngaam-ngaam-just], vocab: [w.sing1-zik1] }
      - { es: "我啱啱出咗糧，今晚我請。", en: "I've just been paid, so tonight's on me.", altEs: ["我啱啱出糧，今晚我請。", "啱啱出咗糧，今晚我請客。"], grammar: [g.ngaam-ngaam-just], vocab: [w.ceot1-loeng4] }
      - { es: "你嚟得啱啱好，會議啱啱開始。", en: "You've come at just the right time; the meeting has just started.", altEs: ["你嚟得啱啱好，個會啱啱開始。"], grammar: [g.ngaam-ngaam-just], vocab: [w.ngaam1-ngaam1-hou2] }
      - { es: "陳經理啱啱辭咗職。", en: "Mr Chan, the manager, has just resigned.", altEs: ["陳經理啱啱辭職。"], altEn: ["Manager Chan has just quit."], grammar: [g.ngaam-ngaam-just], vocab: [w.ci4-zik1] }
      - { es: "我啱啱放完年假，仲未習慣返工。", en: "I've just come back from annual leave and I'm still not used to working.", altEs: ["我啱啱放完年假，仲未慣返工。"], grammar: [g.ngaam-ngaam-just, g.zung-still], vocab: [w.nin4-gaa3] }
      - { es: "今年嘅花紅啱啱夠我去一次旅行。", en: "This year's bonus is just enough for one trip.", altEs: ["今年啲花紅啱啱夠我去一次旅行。"], grammar: [g.ngaam-ngaam-just], vocab: [w.faa1-hung4] }
      - { es: "我阿爸做咗三十年，啱啱退休。", en: "My dad worked for thirty years and has just retired.", altEs: ["我爸爸做咗三十年，啱啱退咗休。"], grammar: [g.ngaam-ngaam-just], vocab: [w.teoi3-jau1] }
      - { es: "清潔工啱啱拖完地，小心跌親。", en: "The cleaner has just mopped the floor; be careful not to slip.", altEs: ["清潔姐姐啱啱拖完地，小心跌親。"], grammar: [g.ngaam-ngaam-just], vocab: [w.cing1-git3-gung1] }
      - { es: "工人啱啱整好部影印機。", en: "The workman has just fixed the photocopier.", altEs: ["師傅啱啱整好部影印機。"], grammar: [g.ngaam-ngaam-just], vocab: [w.gung1-jan4, w.jing2-jan3-gei1] }
      - { es: "我哋屋企個姐姐啱啱放假返鄉下。", en: "Our domestic helper has just gone back home on holiday.", altEs: ["我屋企個姐姐啱啱放假返咗鄉下。"], grammar: [g.ngaam-ngaam-just], vocab: [w.ze2-ze2] }
      - { es: "份人工包唔包括獎金呀？", en: "Does the salary include a bonus?", altEs: ["人工包唔包括獎金？", "份糧包唔包括獎金呀？"], grammar: [g.ngaam-ngaam-just], vocab: [w.baau1-kut3, w.zoeng2-gam1] }
      - { es: "佢啱啱走咗。", en: "He's just left.", altEs: ["佢啱啱先走。", "佢啱啱走。"], altEn: ["She's just left."], grammar: [g.ngaam-ngaam-just], vocab: [], error: { wrong: "佢走咗啱啱。", explain: "啱啱 goes before the verb: 佢啱啱走咗.", grammar: g.ngaam-ngaam-just } }
      - { es: "我開工喇。", en: "I'm starting work now.", altEs: ["我而家開工喇。"], grammar: [g.ngaam-ngaam-just], vocab: [w.hoi1-gung1], transform: { instruction: "Say you have *just* started work (啱啱 + 咗)", answer: "我啱啱開咗工。", alt: ["我啱啱開工。"], en: "I've just started work." } }
      - { es: "老細加咗我人工。", en: "The boss has given me a pay rise.", altEs: ["老細幫我加咗人工。"], grammar: [g.ngaam-ngaam-just], vocab: [w.gaa1-jan4-gung1], transform: { instruction: "Add 啱啱: the boss has *just* done it", answer: "老細啱啱加咗我人工。", alt: ["老細啱啱幫我加咗人工。"] } }
    exchanges:
      - q: { es: "老細喺唔喺度呀？", en: "Is the boss in?" }
        a: { es: "佢啱啱出咗去，你遲啲再嚟啦。", en: "He's just gone out; come back later." }
        alt: ["啱啱出咗去。", "唔喺度，佢頭先出咗去。"]
        grammar: [g.ngaam-ngaam-just]
        vocab: [w.soeng6-si1]
      - q: { es: "你出咗糧未呀？", en: "Have you been paid yet?" }
        a: { es: "啱啱出咗，今晚我請你食飯。", en: "I've just been paid; dinner's on me tonight." }
        alt: ["啱啱出咗糧。", "未呀，月尾先出糧。"]
        grammar: [g.ngaam-ngaam-just]
        vocab: [w.ceot1-loeng4]
      - q: { es: "杯咖啡夠唔夠甜呀？", en: "Is the coffee sweet enough?" }
        a: { es: "啱啱好，唔該。", en: "It's just right, thanks." }
        alt: ["啱啱好。", "好啱，唔該晒。"]
        grammar: [g.ngaam-ngaam-just]
        vocab: [w.ngaam1-ngaam1-hou2]
      - q: { es: "你點解咁開心呀？", en: "Why are you so happy?" }
        a: { es: "我啱啱升咗職，仲加咗人工添！", en: "I've just been promoted, and I got a pay rise as well!" }
        alt: ["我啱啱升職。", "我啱啱收到花紅！"]
        grammar: [g.ngaam-ngaam-just, g.tim-too]
        vocab: [w.sing1-zik1, w.gaa1-jan4-gung1]
      - q: { es: "陳生仲喺唔喺公司做呀？", en: "Is Mr Chan still working at the company?" }
        a: { es: "唔喺喇，佢啱啱退休。", en: "Not any more, he's just retired." }
        alt: ["佢啱啱退咗休。", "唔喺喇，佢上個月辭咗職。"]
        grammar: [g.ngaam-ngaam-just]
        vocab: [w.teoi3-jau1, w.ci4-zik1]
    texts:
      - title: "好消息"
        es: ["老細啱啱宣佈今年有雙糧。", "做得好嘅員工仲有花紅。", "我哋今晚一齊去食飯慶祝！"]
        en: ["The boss has just announced a thirteenth-month bonus this year.", "Staff who did well also get a year-end bonus.", "We're all going out for dinner tonight to celebrate!"]
        grammar: [g.ngaam-ngaam-just]
        vocab: [w.soeng1-loeng4, w.faa1-hung4]
      - title: "留言"
        es: ["頭先有個客戶打電話嚟。", "佢話啱啱收到份合約，想約你聽日見面。", "我啱啱開完會，遲啲先覆佢。"]
        en: ["A client called earlier.", "He said he'd just received the contract and wants to meet you tomorrow.", "I've just finished a meeting; I'll get back to him later."]
        grammar: [g.ngaam-ngaam-just, g.reported-speech]
        vocab: [w.sau1-dou2, w.haak3-wu6]
    spicy:
      - { es: "我啱啱出糧，今晚想請你食飯，你得唔得閒？", en: "I've just been paid; I'd like to take you to dinner tonight. Are you free?", altEs: ["我啱啱出咗糧，今晚想請你食飯，你得唔得閒呀？"], grammar: [g.ngaam-ngaam-just], vocab: [w.ceot1-loeng4] }
      - { es: "你啱啱好係我杯茶。", en: "You're exactly my cup of tea.", altEs: ["你啱晒我杯茶。"], altEn: ["You're just my type."], grammar: [g.ngaam-ngaam-just], vocab: [w.ngaam1-ngaam1-hou2] }
      - { es: "佢啱啱話畀我知佢單身，我即刻請咗年假。", en: "He's just told me he's single, so I immediately took annual leave.", altEs: ["佢啱啱同我講佢單身，我即刻請咗年假。"], altEn: ["She's just told me she's single, so I immediately took annual leave."], grammar: [g.ngaam-ngaam-just, g.reported-speech], vocab: [w.nin4-gaa3] }
      - { es: "頭先你望咗我三次，我數咗㗎。", jp: "tau4 sin1 nei5 mong6 zo2 ngo5 saam1 ci3 ngo5 sou2 zo2 gaa3", en: "You looked at me three times earlier; I counted.", altEs: ["你頭先望咗我三次，我數咗㗎。"], grammar: [g.ngaam-ngaam-just], vocab: [] }
      - { es: "我啱啱升咗職，你要唔要升做我男朋友？", en: "I've just been promoted; would you like a promotion to boyfriend?", altEs: ["我啱啱升咗職，你要唔要升做我女朋友？"], altEn: ["I've just been promoted; would you like a promotion to girlfriend?"], grammar: [g.ngaam-ngaam-just], vocab: [w.sing1-zik1] }
  - id: b1.u07.l4
    title: 搵工同見工
    teach: [g.sin-final, g.ngaam-ngaam-just]
    vocab: [w.wan2-gung1, w.gin3-gung1, w.min6-si3, w.ceng2-jan4, w.zik1-wai2, w.cyun4-zik1, w.gim1-zik1, w.sat6-zaap6, w.gung1-cong2, w.saang1-ji3, w.pun4, w.fuk6-mou6, w.zik1-jip6, w.hong4-jip6, w.jam2-sik6-jip6, w.gam1-jung4, w.so2.c, w.hei1-mong6]
    tip: "Job-hunting words: 搵工 'look for a job', 見工 'go for an interview', 請人 'hire'. 你做邊行㗎？ asks what line of work someone is in."
    sentences:
      - { es: "我啱啱見完工，覺得幾好。", en: "I've just had a job interview, and I think it went quite well.", altEs: ["我啱啱見完工，覺得幾好吖。", "啱啱見完工，我覺得幾好。"], grammar: [g.ngaam-ngaam-just], vocab: [w.gin3-gung1] }
      - { es: "你想搵工先，定係讀書先？", en: "Do you want to look for a job first, or study first?", altEs: ["你想先搵工定係先讀書？", "你想搵工先定讀書先？"], grammar: [g.sin-final], vocab: [w.wan2-gung1] }
      - { es: "呢間公司請人，有全職同兼職職位。", en: "This company is hiring; there are full-time and part-time positions.", altEs: ["呢間公司請緊人，有全職同兼職嘅職位。"], grammar: [g.sin-final], vocab: [w.ceng2-jan4, w.zik1-wai2, w.cyun4-zik1, w.gim1-zik1] }
      - { es: "佢一邊做兼職一邊搵全職工。", en: "She's working part-time while she looks for a full-time job.", altEs: ["佢一邊做兼職，一邊搵全職工。", "佢一邊打兼職一邊搵全職工。"], altEn: ["He's working part-time while he looks for a full-time job."], grammar: [g.jat-bin-while], vocab: [w.gim1-zik1, w.wan2-gung1], error: { wrong: "佢做兼職一邊搵全職工。", explain: "Both actions need 一邊: 一邊做兼職一邊搵全職工.", grammar: g.jat-bin-while } }
      - { es: "我想喺飲食業做嘢，唔想做金融。", en: "I want to work in catering, not finance.", altEs: ["我想入飲食業，唔想做金融。", "我想做飲食業，唔想入金融。"], grammar: [g.sin-final], vocab: [w.jam2-sik6-jip6, w.gam1-jung4] }
      - { es: "面試之前要準備好，唔好遲到。", en: "Get well prepared before the interview, and don't be late.", altEs: ["見工之前要準備好，唔好遲到。"], grammar: [g.m-hou-dont], vocab: [w.min6-si3] }
      - { es: "佢喺工廠做咗十年先轉工。", en: "He worked in a factory for ten years before changing jobs.", altEs: ["佢喺工廠做咗十年先至轉工。"], altEn: ["She worked in a factory for ten years before changing jobs."], grammar: [g.sin-final], vocab: [w.gung1-cong2] }
      - { es: "我細佬啱啱喺一間銀行實習完。", en: "My younger brother has just finished an internship at a bank.", altEs: ["我細佬啱啱喺銀行實習完。"], grammar: [g.ngaam-ngaam-just], vocab: [w.sat6-zaap6] }
      - { es: "我阿爸有一盤細生意，喺元朗賣海味。", en: "My dad has a small business selling dried seafood in Yuen Long.", altEs: ["我爸爸做緊一盤細生意，喺元朗賣海味。"], grammar: [g.common-classifiers], vocab: [w.saang1-ji3, w.pun4] }
      - { es: "你嘅職業係乜嘢？", en: "What's your occupation?", altEs: ["你做乜嘢職業㗎？", "你做咩工㗎？"], grammar: [g.sin-final], vocab: [w.zik1-jip6] }
      - { es: "飲食業最緊要係服務好。", en: "In catering, good service is what matters most.", altEs: ["做飲食業，最緊要係服務好。"], grammar: [g.sin-final], vocab: [w.fuk6-mou6, w.jam2-sik6-jip6] }
      - { es: "佢喺金融行業做咗好多年。", en: "She has worked in the finance industry for many years.", altEs: ["佢喺金融業做咗好多年。"], altEn: ["He has worked in finance for many years."], grammar: [g.sin-final], vocab: [w.hong4-jip6, w.gam1-jung4] }
      - { es: "你等佢哋覆你先，唔好咁快決定。", en: "Wait for them to get back to you first; don't decide so quickly.", altEs: ["你等佢哋覆咗你先，唔好咁快決定。"], grammar: [g.sin-final], vocab: [w.min6-si3] }
      - { es: "我想搵工。", en: "I want to look for a job.", altEs: ["我想搵份工。"], grammar: [g.sin-final], vocab: [w.wan2-gung1], transform: { instruction: "Add sentence-final 先: you want to find a job *first*", answer: "我想搵工先。", alt: ["我想搵份工先。"], en: "I want to find a job first." } }
      - { es: "佢哋請咗人。", en: "They've hired someone.", altEs: ["佢哋請咗個人。"], grammar: [g.ngaam-ngaam-just], vocab: [w.ceng2-jan4], transform: { instruction: "Add 啱啱: they have *just* hired someone", answer: "佢哋啱啱請咗人。", alt: ["佢哋啱啱請咗個人。"] } }
    exchanges:
      - q: { es: "你喺邊個行業做嘢呀？", en: "What industry do you work in?" }
        a: { es: "飲食業，我喺茶餐廳做經理。", en: "Catering. I'm a manager at a cha chaan teng." }
        alt: ["金融。", "我做飲食業。"]
        grammar: [g.sin-final]
        vocab: [w.hong4-jip6, w.jam2-sik6-jip6]
      - q: { es: "面試點呀？", en: "How did the interview go?" }
        a: { es: "啱啱完咗，佢哋話下個禮拜先覆我。", en: "It's just finished; they said they won't get back to me until next week." }
        alt: ["幾好，下個禮拜先知結果。", "啱啱完，唔知點。"]
        grammar: [g.ngaam-ngaam-just, g.sin-final]
        vocab: [w.min6-si3]
      - q: { es: "你係全職定係兼職？", en: "Are you full-time or part-time?" }
        a: { es: "兼職，我一個禮拜返三日。", en: "Part-time; I work three days a week." }
        alt: ["全職。", "兼職嚟嘅。"]
        grammar: [g.sin-final]
        vocab: [w.cyun4-zik1, w.gim1-zik1]
      - q: { es: "你哋公司仲請唔請人呀？", en: "Is your company still hiring?" }
        a: { es: "請呀，我哋部門啱啱有個職位。", en: "Yes, a position has just opened up in our department." }
        alt: ["請呀。", "唔請喇，啱啱請咗人。"]
        grammar: [g.ngaam-ngaam-just]
        vocab: [w.ceng2-jan4, w.zik1-wai2]
      - q: { es: "你畢業之後做乜嘢？", en: "What will you do after you graduate?" }
        a: { es: "我想喺金融公司實習先。", en: "I'd like to do an internship at a finance company first." }
        alt: ["搵工先。", "實習先，再搵全職。"]
        grammar: [g.sin-final]
        vocab: [w.sat6-zaap6, w.gam1-jung4]
    texts:
      - title: "請人"
        es: ["我哋係米埔附近一間細公司，而家請人。", "職位：全職文員，識中文同英文。", "有興趣可以電郵我哋，見工時間係星期一到星期五。"]
        en: ["We're a small company near Mai Po, and we're hiring.", "Position: full-time clerk, Chinese and English required.", "If you're interested, email us; interviews are Monday to Friday."]
        grammar: [g.sin-final]
        vocab: [w.ceng2-jan4, w.zik1-wai2, w.cyun4-zik1, w.gin3-gung1]
      - title: "阿詩嘅日記"
        es: ["我啱啱見完第三份工。", "個經理話佢哋要睇晒所有人先決定。", "我希望今次得啦！"]
        en: ["I've just had my third job interview.", "The manager said they'd see everyone before deciding.", "I hope I get it this time!"]
        grammar: [g.ngaam-ngaam-just, g.sin-final]
        vocab: [w.gin3-gung1]
    spicy:
      - { es: "見工嗰陣個經理望住我笑，我諗我有機會。", en: "The manager kept smiling at me during the interview; I think I've got a chance.", altEs: ["見工嗰陣，個經理一直望住我笑，我諗我有機會。"], grammar: [g.jat-bin-while], vocab: [w.gin3-gung1] }
      - { es: "我搵到工先，再搵男朋友。", en: "Job first, then a boyfriend.", altEs: ["我搵到工先，再搵女朋友。", "搵到工先，先至搵男朋友。"], altEn: ["First I find a job, then a girlfriend."], grammar: [g.sin-final], vocab: [w.wan2-gung1] }
      - { es: "你係咪做設計師㗎？點解你着衫咁好睇？", en: "Are you a designer? How come you dress so well?", altEs: ["你係唔係做設計師㗎？點解你着衫咁好睇？"], grammar: [g.sin-final], vocab: [w.zik1-jip6] }
      - { es: "面試問我有咩能力，我話我識一邊煮飯一邊唱歌。", en: "At the interview they asked what my skills were; I said I can cook and sing at the same time.", altEs: ["面試嗰陣佢哋問我有咩能力，我話我識一邊煮飯一邊唱歌。"], grammar: [g.jat-bin-while, g.reported-speech], vocab: [w.min6-si3] }
      - { es: "我啱啱辭咗職，而家有大把時間陪你。", en: "I've just quit my job, so now I have loads of time to spend with you.", altEs: ["我啱啱辭職，而家有好多時間陪你。"], grammar: [g.ngaam-ngaam-just], vocab: [w.ci4-zik1] }
dialogues:
  - id: b1.u07.d1
    title: 第一日返工
    context: Si starts a new job at a small company near the Mai Po wetlands. Her manager, Mr Chan, shows her the ropes.
    lines:
      - { speaker: 陳經理, es: "你係新嚟嘅職員？我係陳經理，你嘅上司。", en: "Are you the new staff member? I'm Mr Chan, the manager, your boss." }
      - { speaker: 阿詩, es: "係呀，陳經理你好。我叫阿詩，今日第一日開工。", en: "Yes, hello Mr Chan. I'm Si, and today's my first day." }
      - { speaker: 陳經理, es: "歡迎。你啱啱到，飲杯茶先，等我講吓今日做乜嘢。", en: "Welcome. You've just arrived; have a cup of tea first, and I'll tell you what we're doing today." }
      - { speaker: 阿詩, es: "唔該。我使唔使簽份合約先呀？", en: "Thanks. Do I need to sign a contract first?" }
      - { speaker: 陳經理, es: "要，你簽咗名先，跟住我帶你參觀辦公室。", en: "Yes, sign it first, and then I'll show you round the office." }
      - { speaker: 阿詩, es: "聽講呢度啲員工會一邊做嘢一邊睇雀，係咪真㗎？", en: "I hear the staff here watch birds while they work. Is that true?" }
      - { speaker: 陳經理, es: "係呀，冬天好多雀飛嚟米埔，我哋成日一邊食飯一邊望出窗。", en: "It is. In winter lots of birds fly to Mai Po, and we often look out of the window while we eat." }
      - { speaker: 阿詩, es: "好正！咁我今日負責乜嘢呀？", en: "Brilliant! So what am I in charge of today?" }
      - { speaker: 陳經理, es: "你幫我影印呢幾份文件，然後跟進兩個客戶嘅電郵。", en: "Photocopy these documents for me, then follow up on two clients' emails." }
      - { speaker: 阿詩, es: "冇問題。我做完先嚟搵你。", en: "No problem. I'll come and find you once I've finished." }
      - { speaker: 陳經理, es: "好，有咩唔明就問我。", en: "Good. If there's anything you don't understand, just ask me." }
    questions:
      - { q: "阿詩係邊個？", options: ["新嚟嘅職員", "陳經理嘅客戶", "米埔嘅遊客"], answer: 0, explain: "She says today is her first day at work (今日第一日開工)." }
      - { q: "參觀辦公室之前，阿詩要做乜嘢先？", options: ["飲咖啡", "簽合約", "影印文件"], answer: 1, explain: "Mr Chan says 你簽咗名先, then he'll show her round." }
      - { q: "員工成日一邊食飯一邊做乜嘢？", options: ["聽歌", "望出窗睇雀", "覆電郵"], answer: 1, explain: "我哋成日一邊食飯一邊望出窗: lots of birds come to Mai Po in winter." }
      - { q: "陳經理叫阿詩跟進乜嘢？", options: ["兩個客戶嘅電郵", "三份報告", "一份合約"], answer: 0, explain: "跟進兩個客戶嘅電郵: follow up on two clients' emails." }
writing:
  - task: "Write about someone at work who does two things at once, and about yourself, with 一邊…一邊…"
    min: 40
    max: 90
    use: [w.jat1-bin1, w.soeng6-si1, w.haau6-leot2, w.je6-haau6]
    useAtLeast: 3
    grammar: [g.jat-bin-while]
    expect:
      - { pattern: "一邊.{1,8}一邊", hint: "Say two things at once: 一邊…一邊…" }
    model: { es: "我嘅上司成日一邊食早餐一邊覆電郵，效率好高。我就一邊返工一邊讀夜校，雖然好攰，但係學到好多嘢。", en: "My boss often answers emails while eating breakfast; she's very efficient. As for me, I work and go to evening school at the same time. It's tiring, but I'm learning a lot." }
  - task: "A new colleague wants to leave early. Tell them what has to be done first, using sentence-final 先."
    min: 40
    max: 80
    use: [w.bou3-gou3, w.hap6-joek3, w.cim1-meng2, w.haak3-wu6, w.daa2-jan3]
    useAtLeast: 3
    grammar: [g.sin-final]
    expect:
      - { pattern: "先", hint: "Say what must happen first with 先 at the end: 做完先." }
    model: { es: "你唔好走住，要將份報告做完先。仲有份合約，經理要簽名先可以寄畀客戶。你打印咗未呀？我哋六點之前要寄出去。", en: "Don't leave yet; you need to finish the report first. There's also the contract: the manager has to sign it before we can send it to the client. Have you printed it? We need to send it out before six." }
  - task: "Text a friend about what has just happened at work, using 啱啱."
    min: 40
    max: 90
    use: [w.ngaam1-ngaam1, w.ceot1-loeng4, w.faa1-hung4, w.ci4-zik1, w.hing3-zuk1]
    useAtLeast: 3
    grammar: [g.ngaam-ngaam-just]
    expect:
      - { pattern: "啱啱", hint: "Say what has just happened: 我啱啱…" }
    model: { es: "我啱啱出糧，仲收到年尾嘅花紅，好開心！不過坐喺我隔籬嘅同事啱啱辭職，佢話想轉行。我哋今晚去慶祝吓先！", en: "I've just been paid, and I got my year-end bonus too. So happy! But the colleague who sits next to me has just resigned; she says she wants to change careers. Let's go and celebrate tonight!" }
  - task: "You've just come back from a job interview. Write to a friend about the job and how it went."
    min: 40
    max: 90
    use: [w.gin3-gung1, w.cyun4-zik1, w.zik1-wai2, w.min6-si3, w.hei1-mong6]
    useAtLeast: 3
    grammar: [g.ngaam-ngaam-just]
    expect:
      - { pattern: "見工|面試", hint: "Mention the interview: 見工, 面試." }
      - { pattern: "希望|想", hint: "Say what you hope: 我好希望…" }
    model: { es: "我啱啱見完工返嚟。係一個全職文員嘅職位。面試嘅時候經理問咗我好多問題，我答得幾好。我好希望可以搵到呢份工！", en: "I've just come back from a job interview. It's a full-time office clerk position. In the interview the manager asked me lots of questions, and I answered quite well. I really hope I get this job!" }
