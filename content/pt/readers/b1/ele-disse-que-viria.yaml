id: r.b1.ele-disse-que-viria
level: b1
title: Ele disse que viria
kind: text
intro: Iara and Nando have booked a guided hike in the Chapada dos Veadeiros, in Goiás. But the guide doesn't turn up, and the day becomes a chain of messages and reported speech.
allow: [iara, nando, chapada, veadeiros, alto, paraíso, são, jorge, josué, ok, wi-fi, whatsapp]
paragraphs:
  - { es: "Na véspera, o guia tinha sido muito claro. O Josué disse que viria nos buscar na pousada às sete em ponto, que a trilha até as cachoeiras levaria umas quatro horas e que deveríamos levar água, lanche e roupa de banho. Também disse que, se chovesse muito à noite, ele nos avisaria, porque com chuva forte o rio fica perigoso. Era a nossa primeira viagem à Chapada, e nós estávamos muito ansiosos.", en: "The day before, the guide had been very clear. Josué said he would come and pick us up at the guesthouse at seven sharp, that the trail to the waterfalls would take about four hours and that we should bring water, a snack and swimwear. He also said that if it rained a lot in the night, he would let us know, because in heavy rain the river gets dangerous. It was our first trip to the Chapada, and we were really excited." }
  - { es: "Às sete, estávamos na porta, prontos. Às sete e meia, nada. Às oito, o Nando, que não é a pessoa mais paciente do mundo, já estava irritado. — Ele disse que viria às sete! Será que esqueceu da gente?", en: "At seven we were at the door, ready. At half past seven, nothing. At eight, Nando, who isn't the most patient person in the world, was already annoyed. 'He said he'd come at seven! Do you think he forgot about us?'" }
  - { es: "Tentei ligar, mas em São Jorge, a vila onde estávamos, o sinal de celular é fraco. Fui até a recepção e perguntei à dona da pousada se ela conhecia o Josué. Ela disse que sim, que ele era um dos melhores guias da região, e que nunca tinha deixado ninguém esperando. Ofereceu-se para ligar do telefone fixo.", en: "I tried to call, but in São Jorge, the village where we were staying, the mobile signal is weak. I went to reception and asked the guesthouse owner if she knew Josué. She said yes, that he was one of the best guides in the region, and that he had never left anyone waiting. She offered to call from the landline." }
  - { es: "Depois de alguns minutos, ela voltou com a notícia. A mulher do Josué tinha atendido e explicado que ele tinha saído de casa às seis e meia, mas que o carro tinha quebrado na estrada de terra, num lugar sem sinal. Ela pediu que esperássemos mais um pouco, porque ele ia tentar arranjar uma carona.", en: "A few minutes later she came back with the news. Josué's wife had answered and explained that he had left home at half past six, but that the car had broken down on the dirt road, in a place with no signal. She asked us to wait a bit longer, because he was going to try to get a lift." }
  - { es: "Às nove e quinze, uma caminhonete velha parou na frente da pousada. O Josué desceu, suado e sorrindo. — Desculpem, gente! Eu disse que chegaria às sete, mas a estrada não concordou comigo. Ainda dá tempo, vamos?", en: "At a quarter past nine, an old pickup truck stopped in front of the guesthouse. Josué got out, sweaty and smiling. 'Sorry, folks! I said I'd be here at seven, but the road didn't agree with me. There's still time, shall we go?'" }
  - { es: "A trilha foi uma das mais bonitas que já fiz. Caminhamos pelo cerrado, entre árvores baixas e retorcidas, flores que eu nunca tinha visto e pedras que brilhavam ao sol. O Josué explicou que aquelas pedras eram cristais de quartzo, que a região está sobre uma das rochas mais antigas do continente e que muita gente acredita que a Chapada tem uma energia especial. O Nando perguntou se ele acreditava nisso. Ele respondeu que acreditava, sim, na energia de um bom banho de cachoeira.", en: "The trail was one of the most beautiful I've ever done. We walked through the cerrado, among low, twisted trees, flowers I'd never seen and rocks that sparkled in the sun. Josué explained that those stones were quartz crystals, that the region sits on some of the oldest rock on the continent and that many people believe the Chapada has a special energy. Nando asked him if he believed that. He answered that he did believe in the energy of a good waterfall swim." }
  - { es: "Quando chegamos à cachoeira, a água estava gelada e transparente. Ficamos lá quase uma hora. Na volta, o Nando, já de bom humor, disse ao Josué que ia recomendar o trabalho dele a todos os amigos. O Josué agradeceu e pediu que, no comentário na internet, a gente não falasse do atraso. — Falem da cachoeira — disse ele, rindo. — Do carro, ninguém precisa saber.", en: "When we reached the waterfall, the water was icy and crystal clear. We stayed there almost an hour. On the way back, Nando, now in a good mood, told Josué he would recommend his work to all his friends. Josué thanked him and asked that, in our online review, we not mention the delay. 'Talk about the waterfall,' he said, laughing. 'Nobody needs to know about the car.'" }
  - { es: "Prometemos que não falaríamos. Bom, até hoje.", en: "We promised we wouldn't. Well, until today." }
questions:
  - { q: "O que o Josué tinha dito na véspera?", options: ["Que viria às sete e que a trilha levaria umas quatro horas", "Que não poderia ir", "Que a trilha estava fechada"], answer: 0, explain: "«O Josué disse que viria nos buscar na pousada às sete em ponto, que a trilha... levaria umas quatro horas.»" }
  - { q: "Por que não foi possível ligar para o Josué do celular?", options: ["Porque o celular estava sem bateria", "Porque o sinal em São Jorge é fraco", "Porque eles não tinham o número"], answer: 1, explain: "«Em São Jorge, a vila onde estávamos, o sinal de celular é fraco.»" }
  - { q: "Por que o Josué se atrasou?", options: ["Porque acordou tarde", "Porque choveu muito", "Porque o carro quebrou na estrada"], answer: 2, explain: "His wife explained «que o carro tinha quebrado na estrada de terra, num lugar sem sinal»." }
  - { q: "O que eram as pedras que brilhavam?", options: ["Ouro", "Cristais de quartzo", "Diamantes"], answer: 1, explain: "«O Josué explicou que aquelas pedras eram cristais de quartzo.»" }
  - { q: "O que o Josué pediu no fim?", options: ["Que eles não falassem do atraso no comentário", "Que pagassem mais", "Que voltassem no dia seguinte"], answer: 0, explain: "«Pediu que, no comentário na internet, a gente não falasse do atraso.»" }
