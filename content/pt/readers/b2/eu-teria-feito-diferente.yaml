id: r.b2.eu-teria-feito-diferente
level: b2
title: Eu teria feito diferente
kind: dialogue
intro: A student journalist interviews Seu Severino, an 82-year-old trombonist who has played frevo in Recife's Carnival for sixty years. He talks about his life — and his regrets — using the conditional perfect.
allow: [severino, recife, olinda, capibaribe, galo, madrugada, marco, zero, pernambuco, pernambucano, carla, ok, unesco, frevo, frevos]
paragraphs:
  - { es: "A casa do seu Severino fica numa rua estreita do bairro de São José, a poucos minutos do Marco Zero. Na parede da sala, há fotos em preto e branco de bandas de Carnaval e um trombone pendurado, brilhando como se fosse novo. A estudante Carla liga o gravador.", en: "Seu Severino's house is on a narrow street in the São José neighbourhood, a few minutes from Marco Zero. On the living room wall there are black-and-white photos of Carnival bands and a trombone hanging up, shining as if it were new. The student, Carla, switches on the recorder." }
  - { es: "— Seu Severino, o senhor toca frevo há sessenta anos. Como tudo começou?", en: "'Seu Severino, you've been playing frevo for sixty years. How did it all start?'" }
  - { es: "— Comecei com doze anos, na banda da escola. Meu pai era estivador no porto e queria que eu fosse trabalhar com ele. Mas um dia eu vi uma orquestra de frevo passar na rua, no Carnaval, e pronto: nunca mais quis outra coisa.", en: "'I started at twelve, in the school band. My father was a docker in the port and wanted me to go and work with him. But one day I saw a frevo orchestra go down the street at Carnival, and that was it: I never wanted anything else.'" }
  - { es: "— Para quem não conhece, como o senhor explicaria o que é o frevo?", en: "'For people who don't know it, how would you explain what frevo is?'" }
  - { es: "— É música que ferve, minha filha. O nome vem de «ferver». É rápida, tem muito metal, trombone, trompete, saxofone, e quem dança faz uns passos que parecem impossíveis, com uma sombrinha colorida na mão. Em 2012, a Unesco reconheceu o frevo como patrimônio da humanidade. Eu chorei quando soube.", en: "'It's music that boils, my dear. The name comes from ferver, to boil. It's fast, it has lots of brass, trombone, trumpet, saxophone, and the dancers do steps that seem impossible, with a coloured little umbrella in their hand. In 2012 UNESCO recognised frevo as part of the heritage of humanity. I cried when I found out.'" }
  - { es: "— O senhor tocou no Galo da Madrugada?", en: "'Have you played in the Galo da Madrugada?'" }
  - { es: "— Toquei em quase todos, desde os primeiros anos. Hoje o Galo leva mais de um milhão de pessoas para as ruas do centro no sábado de Carnaval. No começo, era uma coisa pequena, de bairro. Ninguém imaginaria que ficaria tão grande.", en: "'I've played in almost all of them, since the early years. Today the Galo brings more than a million people onto the streets of the centre on Carnival Saturday. At the beginning, it was a small, neighbourhood thing. Nobody would have imagined it would get so big.'" }
  - { es: "— Ao longo dessa vida, há alguma coisa que o senhor teria feito diferente?", en: "'Over the course of your life, is there anything you would have done differently?'" }
  - { es: "O seu Severino fica em silêncio por alguns segundos e olha para o trombone na parede.", en: "Seu Severino is silent for a few seconds and looks at the trombone on the wall." }
  - { es: "— Teria estudado música de verdade. Eu aprendi tudo de ouvido, nunca aprendi a ler partitura direito. Se tivesse estudado, teria conseguido tocar na orquestra sinfônica, teria viajado, quem sabe teria gravado discos. Tive convites para ir para o Rio nos anos setenta, mas tive medo e fiquei. Hoje, acho que teria ido.", en: "'I would have studied music properly. I learned everything by ear, I never learned to read sheet music well. If I had studied, I would have managed to play in the symphony orchestra, I would have travelled, who knows, I would have recorded albums. I had invitations to go to Rio in the seventies, but I was scared and I stayed. Today, I think I would have gone.'" }
  - { es: "— E se tivesse ido, o senhor acha que seria mais feliz?", en: "'And if you had gone, do you think you'd be happier?'" }
  - { es: "— Aí é que está. — Ele ri. — Se eu tivesse ido, não teria conhecido a minha mulher, que vendia tapioca na frente do teatro. Não teria tido os meus quatro filhos, nem ensinado frevo para os meninos aqui do bairro. Então, talvez eu tivesse feito diferente, mas não sei se teria sido melhor.", en: "'That's the thing.' He laughs. 'If I had gone, I wouldn't have met my wife, who sold tapioca outside the theatre. I wouldn't have had my four children, or taught frevo to the boys here in the neighbourhood. So maybe I would have done things differently, but I don't know if it would have been better.'" }
  - { es: "— O senhor ainda dá aulas?", en: "'Do you still teach?'" }
  - { es: "— Toda quarta-feira, aqui mesmo, na garagem. São quinze crianças. Algumas já tocam melhor do que eu tocava na idade delas. Eu digo para elas o que eu gostaria que alguém tivesse me dito: estudem, aprendam a ler música e, se aparecer uma oportunidade, não tenham medo. Mas nunca esqueçam de onde vieram.", en: "'Every Wednesday, right here, in the garage. There are fifteen children. Some of them already play better than I did at their age. I tell them what I wish someone had told me: study, learn to read music and, if an opportunity comes up, don't be afraid. But never forget where you came from.'" }
  - { es: "— E no próximo Carnaval, o senhor vai tocar?", en: "'And next Carnival, are you going to play?'" }
  - { es: "— Enquanto eu tiver fôlego, minha filha, eu vou estar na rua. Pernambucano não para de frevar.", en: "'As long as I have breath, my dear, I'll be out on the street. People from Pernambuco never stop dancing frevo.'" }
questions:
  - { q: "O que o pai do seu Severino queria para ele?", options: ["Que fosse músico", "Que trabalhasse com ele no porto", "Que estudasse no Rio"], answer: 1, explain: "«Meu pai era estivador no porto e queria que eu fosse trabalhar com ele.»" }
  - { q: "De onde vem o nome «frevo»?", options: ["Do verbo «ferver»", "De uma palavra africana", "Do nome de um músico"], answer: 0, explain: "«O nome vem de \"ferver\".»" }
  - { q: "O que o seu Severino teria feito diferente?", options: ["Teria estudado música de verdade", "Teria trabalhado no porto", "Teria deixado de tocar"], answer: 0, explain: "«Teria estudado música de verdade... nunca aprendi a ler partitura direito.»" }
  - { q: "Por que ele não tem certeza de que ir para o Rio teria sido melhor?", options: ["Porque não gosta do Rio", "Porque não teria conhecido a mulher nem tido os filhos", "Porque não gosta de viajar"], answer: 1, explain: "«Se eu tivesse ido, não teria conhecido a minha mulher... Não teria tido os meus quatro filhos.»" }
  - { q: "Que conselho ele dá aos alunos?", options: ["Que nunca saiam de Recife", "Que estudem e não tenham medo das oportunidades, sem esquecer de onde vieram", "Que toquem só frevo"], answer: 1, explain: "«Estudem, aprendam a ler música e, se aparecer uma oportunidade, não tenham medo. Mas nunca esqueçam de onde vieram.»" }
