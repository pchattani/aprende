id: r.a2.moving-to-sham-shui-po
level: a2
title: 我搬咗去深水埗
kind: text
allow: [鴨, 寮]
intro: Kelvin has just moved out of his family home into a small flat in Sham Shui Po. In a message to his sister he lists what he has already done and what he hasn't done yet.
paragraphs:
  - { es: "家姐：你好嗎？我上個禮拜六終於搬咗屋喇！我而家喺深水埗住，同一個朋友一齊租咗一個細細嘅單位。間屋好細，得兩間房，但係好方便，行三分鐘就到地鐵站。", en: "Sis: how are you? Last Saturday I finally moved! I live in Sham Shui Po now; a friend and I have rented a tiny flat together. It's very small, only two rooms, but it's very convenient: the MTR station is just a three-minute walk away." }
  - { es: "搬屋真係好辛苦。我哋由朝早八點搬到夜晚十點，搬完之後我攰到唔想郁。而家已經過咗一個禮拜，我執咗我間房，買咗張新床，仲煲咗第一煲湯！不過廚房仲未執，啲碗同碟仲喺箱入面。", en: "Moving is really exhausting. We moved from eight in the morning until ten at night, and afterwards I was too tired to move. Now a week has passed: I've tidied my room, bought a new bed and even made my first pot of soup! But I haven't sorted out the kitchen yet; the bowls and plates are still in boxes." }
  - { es: "我同屋叫阿明，佢係廚師，所以佢日日都煮飯畀我食，好正！但係佢瞓覺好大聲，我第一晚瞓唔着。我已經買咗一對耳塞，希望今晚瞓得好啲。", en: "My flatmate is called Ming. He's a chef, so he cooks for me every day, which is great! But he snores very loudly, and on the first night I couldn't sleep at all. I've already bought a pair of earplugs; I hope I sleep better tonight." }
  - { es: "深水埗好熱鬧，有好多平嘢食。樓下有間腸粉舖，我已經食咗三次。附近仲有鴨寮街，賣舊電器同電子嘢。我尋日去咗行，買咗個二手相機，先至一百蚊！", en: "Sham Shui Po is very lively and has lots of cheap food. Downstairs there's a rice-roll shop, and I've already eaten there three times. Nearby there's Apliu Street, which sells second-hand electrical goods and electronics. I went for a wander yesterday and bought a second-hand camera, only a hundred dollars!" }
  - { es: "我仲未換地址，所以啲信仲寄去屋企。如果有我嘅信，你可唔可以幫我拎吓？仲有，媽媽問我食咗飯未，日日打三次電話畀我。你同佢講，我好好，唔使擔心！", en: "I haven't changed my address yet, so letters still go to home. If there's any post for me, could you pick it up for me? Also, Mum keeps asking whether I've eaten, and she calls me three times a day. Tell her I'm fine and there's no need to worry!" }
  - { es: "你同姐夫幾時得閒嚟我新屋食飯呀？阿明話佢可以煮一餐好嘢畀你哋食。下個禮拜六好唔好？覆我啦！細佬Kelvin", en: "When are you and your husband free to come and eat at my new place? Ming says he can cook you a really good meal. How about next Saturday? Let me know! Your little brother, Kelvin" }
questions:
  - { q: "Kelvin幾時搬屋？", options: ["上個禮拜六", "尋日", "下個禮拜六"], answer: 0, explain: "我上個禮拜六終於搬咗屋喇. Next Saturday is when he invites his sister to dinner." }
  - { q: "Kelvin仲有乜嘢未做？", options: ["執佢間房", "執廚房", "買床"], answer: 1, explain: "廚房仲未執: he has tidied his room and bought a bed, but not sorted out the kitchen." }
  - { q: "點解Kelvin第一晚瞓唔着？", options: ["因為間屋好熱", "因為阿明瞓覺好大聲", "因為佢好肚餓"], answer: 1, explain: "佢瞓覺好大聲: his flatmate snores loudly, so he bought earplugs." }
  - { q: "Kelvin喺鴨寮街買咗乜嘢？", options: ["一部電腦", "一個二手相機", "一張床"], answer: 1, explain: "買咗個二手相機，先至一百蚊." }
  - { q: "Kelvin想家姐做乜嘢？", options: ["幫佢拎信", "幫佢搬屋", "幫佢煮飯"], answer: 0, explain: "你可唔可以幫我拎吓 (my letters)? He also asks her to reassure their mother." }
glossary:
  - { es: 單位, en: "flat, apartment" }
  - { es: 耳塞, en: earplugs }
  - { es: 二手, en: second-hand }
  - { es: 姐夫, en: "older sister's husband" }
  - { es: 箱, en: box }
