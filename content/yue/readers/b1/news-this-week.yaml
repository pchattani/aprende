id: r.b1.news-this-week
level: b1
title: 本地新聞
kind: text
intro: The Friday evening local news bulletin on a Hong Kong radio station - a typhoon, a wild boar in a shopping centre, winter birds at Mai Po and a new rule for the light rail. (The news items are invented for this course.)
paragraphs:
  - { es: "各位聽眾，晚安。呢度係《晚間新聞》，今日係十一月十四號，星期五。以下係今個禮拜嘅本地新聞重點。", en: "Good evening, listeners. This is the Evening News. Today is Friday the fourteenth of November. Here are the main local news stories of the week." }
  - { es: "第一單新聞：一個強颱風星期二吹襲香港，天文台喺朝早五點掛起八號風球，一直到下晝三點先改為三號風球。颱風期間，全港學校停課，好多公司都冇開工。政府表示，全港有超過三百棵樹畀風吹冧，其中大埔同西貢最嚴重。有十二個市民受傷送院，冇人死亡。", en: "First story: A severe typhoon hit Hong Kong on Tuesday. The Observatory raised the Number 8 signal at five in the morning, and only lowered it to Number 3 at three in the afternoon. During the typhoon all schools in Hong Kong were closed and many companies didn't open. The government said that more than three hundred trees across Hong Kong were blown down, with Tai Po and Sai Kung worst hit. Twelve people were injured and taken to hospital; nobody died." }
  - { es: "颱風過咗之後，屯門有啲低窪地區水浸，有居民話，屋企入面嘅水浸到膝頭咁高。消防員用咗成晚時間幫居民抽水。有關部門話，會盡快檢查區內嘅排水系統，避免下次再發生同樣嘅事。", en: "After the typhoon, some low-lying areas of Tuen Mun flooded; residents said the water inside their homes came up to their knees. Firefighters spent the whole night pumping out water for residents. The department concerned said it would check the district's drainage system as soon as possible to stop the same thing happening again." }
  - { es: "第二單新聞：星期三下晝，一隻野豬走咗入荃灣一個商場，喺一間麵包舖門口食咗幾個菠蘿包，嚇親好多市民。有目擊者話，隻野豬好似唔驚人，仲喺商場行咗成半個鐘。最後漁農自然護理署嘅職員用麻醉槍捉住咗佢，將佢送返郊野公園。署方提醒市民，唔好餵野豬，見到野豬要保持距離。", en: "Second story: On Wednesday afternoon, a wild boar wandered into a shopping centre in Tsuen Wan and ate several pineapple buns outside a bakery, giving many shoppers a fright. A witness said the boar didn't seem afraid of people and wandered around the centre for a full half hour. In the end staff from the Agriculture, Fisheries and Conservation Department caught it with a tranquilliser gun and took it back to a country park. The department reminded the public not to feed wild boars and to keep their distance if they see one." }
  - { es: "第三單新聞：今年冬天第一批候鳥已經飛到米埔自然保護區。根據保護區職員嘅初步調查，今個月已經有超過一萬隻候鳥嚟到，包括好罕見嘅黑臉琵鷺。職員話，每年十一月到三月係睇雀最好嘅時間，不過想入保護區參觀，要預先申請。", en: "Third story: The first migratory birds of the winter have arrived at the Mai Po Nature Reserve. According to a preliminary survey by reserve staff, more than ten thousand migratory birds have already arrived this month, including the rare black-faced spoonbill. Staff say that November to March is the best time each year for birdwatching, but anyone who wants to visit the reserve must apply in advance." }
  - { es: "第四單新聞：港鐵宣佈，由下個月開始，輕鐵每一個站都會裝新嘅八達通機，乘客上車之前一定要拍卡，冇拍卡嘅乘客最高可以畀人罰款五百蚊。有屯門居民表示支持，認為可以減少有人唔畀錢搭車；亦有老人家擔心自己會唔記得拍卡。", en: "Fourth story: The MTR has announced that from next month new Octopus readers will be installed at every Light Rail stop. Passengers must tap their card before boarding, and passengers who don't tap may be fined up to five hundred dollars. Some Tuen Mun residents said they supported the plan, believing it would reduce fare dodging; some elderly people, though, were worried they might forget to tap." }
  - { es: "最後係天氣。天文台預測，週末天氣會轉涼，星期六最低氣溫十七度，市區天晴，新界早晚會比較凍。天文台提醒市民，去郊外行山要帶夠水同衫。", en: "Finally, the weather. The Observatory forecasts that it will turn cooler at the weekend. On Saturday the lowest temperature will be 17 degrees, sunny in the urban areas, with the New Territories colder in the mornings and evenings. The Observatory reminds the public to take enough water and clothing when hiking in the countryside." }
  - { es: "以上係今晚嘅新聞。多謝收聽，祝大家週末愉快。", en: "That's tonight's news. Thank you for listening, and have a pleasant weekend." }
questions:
  - { q: "八號風球掛咗幾耐？", options: ["由朝早五點到下晝三點", "成日", "由下晝三點到夜晚"], answer: 0, explain: "朝早五點掛起八號風球，一直到下晝三點先改為三號風球." }
  - { q: "颱風之後屯門發生咗乜嘢事？", options: ["山泥傾瀉", "水浸", "火燭"], answer: 1, explain: "屯門有啲低窪地區水浸." }
  - { q: "隻野豬喺商場做咗乜嘢？", options: ["咬傷咗人", "食咗幾個菠蘿包", "搭咗升降機"], answer: 1, explain: "喺一間麵包舖門口食咗幾個菠蘿包." }
  - { q: "想入米埔保護區參觀要點做？", options: ["預先申請", "買飛", "唔使做乜"], answer: 0, explain: "想入保護區參觀，要預先申請." }
  - { q: "輕鐵乘客冇拍卡最高會畀人罰幾多錢？", options: ["一百蚊", "三百蚊", "五百蚊"], answer: 2, explain: "最高可以畀人罰款五百蚊." }
