id: r.b2.mi-disse-che-sarebbe-tornato
level: b2
title: Mi disse che sarebbe tornato
kind: text
intro: Giulia, a student in Lecce, retells the story her grandmother told her about the day her grandfather left for Germany in 1962. A text built on reported speech in the past, with the shift of tenses and time words (domani → il giorno dopo, qui → lì).
allow: [giulia, lecce, leccese, salento, oronzo, wolfsburg, volkswagen, germania, tedeschi, nonna, cosimo, lucia, croce]
paragraphs:
  - { es: "La settimana scorsa, mentre aiutavo mia nonna a mettere in ordine un vecchio armadio, abbiamo trovato una scatola di latta piena di lettere. Sulle buste c'erano francobolli tedeschi e una scrittura che conoscevo bene: quella di mio nonno Cosimo, morto dieci anni fa. La nonna si è seduta sul letto, ha preso la prima lettera e mi ha detto che era arrivato il momento di raccontarmi tutto.", en: "Last week, while I was helping my grandmother tidy an old wardrobe, we found a tin box full of letters. On the envelopes there were German stamps and handwriting I knew well: my grandfather Cosimo's, who died ten years ago. Grandma sat down on the bed, took the first letter and told me it was time to tell me everything." }
  - { es: "Mi ha spiegato che nel 1962 il nonno aveva ventidue anni e lavorava nei campi di tabacco del Salento, guadagnando pochissimo. Un giorno era venuto in paese un uomo di un'agenzia, il quale aveva detto che in Germania cercavano operai per una grande fabbrica di automobili e che chi avesse accettato avrebbe ricevuto un contratto, un letto e uno stipendio vero. Il nonno si era iscritto quello stesso pomeriggio.", en: "She explained that in 1962 Grandpa was twenty-two and worked in the tobacco fields of the Salento, earning very little. One day a man from an agency had come to the village and said that in Germany they were looking for workers for a big car factory, and that anyone who accepted would get a contract, a bed and a real salary. Grandpa had signed up that very afternoon." }
  - { es: "La sera prima della partenza, si erano incontrati in Piazza Sant'Oronzo, a Lecce, sotto la colonna del santo. La nonna mi ha raccontato che lui le aveva preso le mani e le aveva detto che sarebbe partito il giorno dopo, ma che sarebbe tornato entro due anni, con abbastanza soldi per sposarla e comprare una casa. Le aveva chiesto di aspettarlo e le aveva fatto promettere che gli avrebbe scritto ogni settimana.", en: "On the evening before he left, they had met in Piazza Sant'Oronzo, in Lecce, under the saint's column. Grandma told me he had taken her hands and said he would leave the next day, but that he would come back within two years, with enough money to marry her and buy a house. He had asked her to wait for him and had made her promise she would write to him every week." }
  - { es: "«E tu che cosa gli hai risposto?» le ho chiesto. La nonna ha sorriso. Mi ha detto che gli aveva risposto che non era sicura di volerlo aspettare, perché in paese c'erano altri ragazzi che le facevano la corte. Poi, però, era corsa a casa a piangere tutta la notte. «Ero orgogliosa», ha aggiunto, «non volevo che lui capisse quanto stavo male.»", en: "'And what did you answer?' I asked her. Grandma smiled. She told me she had answered that she wasn't sure she wanted to wait for him, because there were other boys in the village who were courting her. But then she had run home and cried all night. 'I was proud,' she added, 'I didn't want him to see how upset I was.'" }
  - { es: "Ha aperto una delle lettere e me l'ha letta ad alta voce. Il nonno scriveva da Wolfsburg che lì faceva un freddo che non aveva mai sentito, che il cibo non sapeva di niente e che i tedeschi erano gentili ma non sorridevano mai. Diceva che quella mattina aveva visto la neve per la prima volta e che aveva pensato a lei. E concludeva chiedendole se avesse ancora intenzione di aspettarlo.", en: "She opened one of the letters and read it to me aloud. Grandpa wrote from Wolfsburg that it was colder there than anything he'd ever felt, that the food didn't taste of anything and that the Germans were kind but never smiled. He said that that morning he had seen snow for the first time and had thought of her. And he ended by asking her whether she still meant to wait for him." }
  - { es: "I due anni, naturalmente, erano diventati sei. Il nonno era tornato nel 1968, e si erano sposati nella basilica di Santa Croce, quella chiesa barocca piena di angeli e di animali di pietra che i turisti fotografano ogni giorno. Con i soldi della Germania avevano comprato la casa in cui la nonna vive ancora.", en: "The two years had of course become six. Grandpa had come back in 1968, and they had married in the basilica of Santa Croce, that Baroque church full of stone angels and animals that tourists photograph every day. With the money from Germany they had bought the house in which Grandma still lives." }
  - { es: "Prima di rimettere le lettere nella scatola, la nonna mi ha detto una cosa che non dimenticherò. Mi ha detto che il nonno aveva mantenuto tutte le promesse tranne una: quella di non lasciarla mai più sola. «Ma questa», ha aggiunto, «non era colpa sua.»", en: "Before putting the letters back in the box, Grandma told me something I won't forget. She said Grandpa had kept all his promises except one: the promise never to leave her alone again. 'But that one,' she added, 'wasn't his fault.'" }
questions:
  - { q: "Che cosa hanno trovato Giulia e la nonna nell'armadio?", options: ["Delle foto del matrimonio", "Una scatola piena di lettere del nonno", "Un vecchio passaporto"], answer: 1, explain: "A tin box of letters with German stamps, in Grandpa Cosimo's handwriting." }
  - { q: "Perché il nonno partì per la Germania?", options: ["Per studiare", "Per lavorare in una fabbrica di automobili e guadagnare di più", "Per raggiungere la sua famiglia"], answer: 1, explain: "He earned very little in the tobacco fields; an agency offered factory work with a real salary." }
  - { q: "Che cosa disse il nonno alla nonna in Piazza Sant'Oronzo?", options: ["Che sarebbe tornato entro due anni per sposarla", "Che non sarebbe tornato mai più", "Che lei doveva partire con lui"], answer: 0, explain: "Reported speech: «le aveva detto che sarebbe partito il giorno dopo, ma che sarebbe tornato entro due anni» – domani becomes il giorno dopo." }
  - { q: "Perché la nonna rispose che non era sicura di volerlo aspettare?", options: ["Perché era innamorata di un altro", "Perché era orgogliosa e non voleva mostrare quanto stava male", "Perché i suoi genitori non volevano"], answer: 1, explain: "«Ero orgogliosa, non volevo che lui capisse quanto stavo male.»" }
  - { q: "Quanto tempo rimase davvero in Germania il nonno?", options: ["Due anni", "Sei anni", "Dieci anni"], answer: 1, explain: "«I due anni, naturalmente, erano diventati sei»: he came back in 1968." }
