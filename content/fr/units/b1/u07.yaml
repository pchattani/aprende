      - { pattern: "\\bavant d(e\\s|['’])[a-zàâçéèêëîïôûùœ]+", hint: "Use avant de + infinitive: avant de visiter la ville…" }
    model: { es: "Ce matin, avant de visiter la ville, j'ai pris un café sur la place du Forum. Après avoir vu les arènes romaines, je suis allé à l'Espace Van Gogh. Après être sorti du musée, j'ai déjeuné près du Rhône. Avant de rentrer à l'hôtel, j'ai pris des photos du fleuve avec mon appareil photo. Après avoir marché toute la journée, j'étais très fatigué !", en: "This morning, before visiting the town, I had a coffee on the Place du Forum. After seeing the Roman arena, I went to the Espace Van Gogh. After leaving the museum, I had lunch by the Rhône. Before going back to the hotel, I took photos of the river with my camera. After walking all day, I was very tired!" }
  - task: "Describe a moment when you saw something beautiful, using time clauses (au moment où, dès que, tandis que, jusqu'à ce que, une fois que)."
