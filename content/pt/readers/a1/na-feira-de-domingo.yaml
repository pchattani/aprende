id: r.a1.na-feira-de-domingo
level: a1
title: Na feira de domingo
kind: dialogue
intro: Rafa takes Kate to the Sunday street market in Tijuca. They buy fruit, ask prices and discover pastel with sugarcane juice.
allow: [kate, rafa, tijuca, ok, pastel, pastéis]
paragraphs:
  - { es: "É domingo de manhã. Na Tijuca, tem uma feira na rua todo domingo. Tem frutas, flores, peixe, queijo e roupas. O Rafa e a Kate vão à feira com uma sacola grande.", en: "It's Sunday morning. In Tijuca, there's a street market every Sunday. There's fruit, flowers, fish, cheese and clothes. Rafa and Kate go to the market with a big bag." }
  - { es: "— Nossa, quantas cores! — diz a Kate. — O que é aquela fruta amarela e grande?", en: "'Wow, so many colours!' says Kate. 'What's that big yellow fruit?'" }
  - { es: "— É mamão. É muito doce. Minha mãe come mamão todo dia no café da manhã — responde o Rafa.", en: "'It's papaya. It's very sweet. My mother eats papaya every day for breakfast,' Rafa replies." }
  - { es: "Eles vão até a barraca de frutas. O vendedor é um senhor alegre, com um chapéu branco.", en: "They go up to the fruit stall. The seller is a cheerful older man in a white hat." }
  - { es: "— Bom dia, moço! Quanto custa o mamão? — pergunta o Rafa.", en: "'Good morning! How much is the papaya?' Rafa asks." }
  - { es: "— Seis reais o quilo. E a manga está em promoção: três por dez reais!", en: "'Six reais a kilo. And the mangoes are on offer: three for ten reais!'" }
  - { es: "— Eu quero três mangas, por favor. E as bananas? — pergunta a Kate.", en: "'I'd like three mangoes, please. And the bananas?' Kate asks." }
  - { es: "— A dúzia é oito reais. Mas para a amiga do Rafa, é sete!", en: "'A dozen is eight reais. But for Rafa's friend, it's seven!'" }
  - { es: "— Obrigada! Você aceita cartão?", en: "'Thank you! Do you take cards?'" }
  - { es: "— Aceito cartão e pix. São dezessete reais, por favor.", en: "'I take cards and Pix. That's seventeen reais, please.'" }
  - { es: "Depois, o Rafa leva a Kate até uma barraca no fim da rua. Tem muitas pessoas lá.", en: "Afterwards, Rafa takes Kate to a stall at the end of the street. There are lots of people there." }
  - { es: "— Aqui é o melhor lugar da feira. Pastel e caldo de cana! — diz ele. — Você prefere pastel de queijo ou de carne?", en: "'This is the best place in the market. Pastel and sugarcane juice!' he says. 'Do you prefer a cheese or a meat pastel?'" }
  - { es: "— De queijo. E o que é caldo de cana?", en: "'Cheese. And what's caldo de cana?'" }
  - { es: "— É um suco de cana-de-açúcar. É doce e bem gelado. Prova!", en: "'It's sugarcane juice. It's sweet and really cold. Try it!'" }
  - { es: "A Kate prova o pastel e o caldo de cana. O pastel é grande, quente e muito gostoso.", en: "Kate tries the pastel and the sugarcane juice. The pastel is big, hot and very tasty." }
  - { es: "— Rafa, eu adoro a feira! Vamos voltar no próximo domingo?", en: "'Rafa, I love the market! Shall we come back next Sunday?'" }
  - { es: "— Claro! Domingo sem feira não é domingo — responde ele, e os dois riem.", en: "'Of course! A Sunday without the market isn't Sunday,' he replies, and they both laugh." }
questions:
  - { q: "Quando tem feira na Tijuca?", options: ["Todo sábado", "Todo domingo", "Todo dia"], answer: 1, explain: "«Na Tijuca, tem uma feira na rua todo domingo.»" }
  - { q: "Quanto custam três mangas?", options: ["Seis reais", "Sete reais", "Dez reais"], answer: 2, explain: "«A manga está em promoção: três por dez reais!»" }
  - { q: "Por que a Kate paga sete reais pelas bananas, e não oito?", options: ["Porque ela é amiga do Rafa", "Porque ela paga com pix", "Porque as bananas são pequenas"], answer: 0, explain: "The seller says «para a amiga do Rafa, é sete!» — a friendly discount for a regular customer's friend." }
  - { q: "O que é caldo de cana?", options: ["Uma sopa de carne", "Um suco de cana-de-açúcar", "Um tipo de pastel"], answer: 1, explain: "Rafa explains: «É um suco de cana-de-açúcar. É doce e bem gelado.»" }
  - { q: "Que pastel a Kate prefere?", options: ["De carne", "De frango", "De queijo"], answer: 2, explain: "Asked «queijo ou carne?», Kate answers «De queijo»." }
glossary:
  - { es: nossa, en: wow (exclamation) }
  - { es: barraca, en: (market) stall }
  - { es: moço, en: young man; used to call a seller or waiter }
  - { es: melhor, en: best }
  - { es: caldo, en: juice (caldo de cana = sugarcane juice) }
  - { es: cana, en: sugarcane }
  - { es: cana-de-açúcar, en: sugarcane }
  - { es: riem, en: they laugh (rir) }
