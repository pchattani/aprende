id: r.b1.venezia-un-biglietto-per-entrare
level: b1
title: "Venezia: un biglietto per entrare?"
kind: text
intro: Since 2024, day visitors to Venice have had to pay an access fee on the busiest days. A local newspaper asked four people what they think. Notice how opinions are expressed with the congiuntivo (penso che sia, credo che abbia, non è giusto che).
allow: [cinquantamila, venezia, veneziani, rialto, marco, mestre, unesco, chiara, roberto, giovanni, emily, toronto]
paragraphs:
  - { es: "Ogni anno Venezia riceve milioni di visitatori, ma gli abitanti del centro storico sono sempre meno: oggi sono meno di cinquantamila. Dal 2024, nei giorni di maggiore affluenza, chi visita la città solo per un giorno deve pagare un contributo d'accesso di qualche euro. Chi dorme in albergo, chi abita o lavora a Venezia e i bambini non pagano. Abbiamo chiesto a quattro persone che cosa ne pensano.", en: "Every year Venice receives millions of visitors, but the residents of the historic centre are fewer and fewer: today there are fewer than fifty thousand. Since 2024, on the busiest days, anyone visiting the city for just one day has to pay an access fee of a few euros. People staying in hotels, people who live or work in Venice, and children don't pay. We asked four people what they think about it." }
  - { es: "Chiara, 34 anni, gondoliera: «Io penso che sia una buona idea, anche se non basta. Il problema non è il numero dei turisti, è il modo in cui visitano la città. Arrivano con le navi o con i pullman, fanno una foto sul ponte di Rialto, mangiano un panino seduti sui gradini e ripartono. Non credo che pochi euro cambino le cose, ma almeno è un segnale. D'estate, in certe calli, non si riesce nemmeno a camminare. Venezia non è un parco divertimenti.»", en: "Chiara, 34, gondolier: 'I think it's a good idea, even if it isn't enough. The problem isn't the number of tourists, it's the way they visit the city. They arrive by ship or by coach, take a photo on the Rialto Bridge, eat a sandwich sitting on the steps and leave again. I don't think a few euros will change things, but at least it's a signal. In summer, in some alleys, you can't even walk. Venice isn't an amusement park.'" }
  - { es: "Roberto, 58 anni, proprietario di un negozio di souvenir: «Mi sembra assurdo che si debba pagare per entrare in una città, come in un museo. Venezia è un posto dove vive la gente, non un monumento. E poi ho paura che i turisti scelgano altre città e che il mio lavoro ne soffra. È facile criticare il turismo quando non si vive di turismo.»", en: "Roberto, 58, souvenir shop owner: 'It seems absurd to me that you should have to pay to enter a city, like a museum. Venice is a place where people live, not a monument. And besides, I'm afraid tourists will choose other cities and my business will suffer. It's easy to criticise tourism when you don't make a living from it.'" }
  - { es: "Giovanni, 72 anni, pensionato, abita a Cannaregio da sempre: «Quando ero giovane, nel mio palazzo vivevano sei famiglie. Adesso ci sono solo io e cinque appartamenti per turisti. Il fornaio ha chiuso, il calzolaio ha chiuso, al loro posto ci sono negozi di maschere fatte in Cina. Io credo che il contributo d'accesso sia giusto, ma bisogna che il Comune usi quei soldi per i veneziani: per le case, per le scuole, per i servizi. Altrimenti è solo una tassa in più.»", en: "Giovanni, 72, retired, has always lived in Cannaregio: 'When I was young, six families lived in my building. Now there's only me and five holiday flats. The baker closed, the shoemaker closed, and in their place there are shops selling masks made in China. I think the access fee is fair, but the city council needs to use that money for Venetians: for housing, for schools, for services. Otherwise it's just one more tax.'" }
  - { es: "Emily, 27 anni, turista canadese: «Ho saputo del contributo solo all'ultimo momento, ma non mi è dispiaciuto pagare. Mi sembra normale che i visitatori aiutino a proteggere una città così fragile. Però è un peccato che molti turisti non si rendano conto di quanto sia bella Venezia lontano da San Marco. Ieri mi sono persa nelle calli di Castello e ho trovato un'osteria dove c'erano solo veneziani. È stato il momento più bello del viaggio.»", en: "Emily, 27, Canadian tourist: 'I only found out about the fee at the last minute, but I didn't mind paying. It seems normal to me that visitors should help protect such a fragile city. But it's a pity many tourists don't realise how beautiful Venice is away from San Marco. Yesterday I got lost in the alleys of Castello and found an osteria where there were only Venetians. It was the best moment of my trip.'" }
  - { es: "Le opinioni, come si vede, sono molto diverse. Secondo alcuni esperti, è presto per dire se il contributo funzioni davvero. Il Comune, intanto, ha annunciato che i controlli continueranno anche nei prossimi anni e che i giorni a pagamento potrebbero aumentare. Tutti, però, sembrano d'accordo su una cosa: è necessario che Venezia resti una città viva, e non soltanto una cartolina.", en: "Opinions, as you can see, are very different. According to some experts, it's too early to say whether the fee really works. The city council, meanwhile, has announced that the checks will continue in the coming years and that the number of days when visitors must pay could increase. Everyone, however, seems to agree on one thing: Venice must remain a living city, and not just a postcard." }
questions:
  - { q: "Chi deve pagare il contributo d'accesso?", options: ["Tutti i visitatori, ogni giorno", "Chi visita la città per un giorno solo, nei giorni più affollati", "Solo i veneziani"], answer: 1, explain: "Day-trippers on the busiest days; hotel guests, residents, workers and children are exempt." }
  - { q: "Secondo Chiara, qual è il vero problema?", options: ["Il numero dei turisti", "Il modo in cui i turisti visitano la città", "Il prezzo delle gondole"], answer: 1, explain: "«Il problema non è il numero dei turisti, è il modo in cui visitano la città.»" }
  - { q: "Perché Roberto è contrario?", options: ["Teme che i turisti scelgano altre città", "Pensa che il contributo sia troppo basso", "Non vende souvenir"], answer: 0, explain: "«Ho paura che i turisti scelgano altre città e che il mio lavoro ne soffra.»" }
  - { q: "A quale condizione Giovanni è favorevole?", options: ["Se il contributo è gratis per gli anziani", "Se il Comune usa i soldi per i veneziani", "Se chiudono i negozi di maschere"], answer: 1, explain: "«Bisogna che il Comune usi quei soldi per i veneziani.»" }
  - { q: "Su che cosa sono tutti d'accordo?", options: ["Che il contributo sia un errore", "Che Venezia debba restare una città viva", "Che i turisti debbano dormire a Mestre"], answer: 1, explain: "«È necessario che Venezia resti una città viva, e non soltanto una cartolina.»" }
