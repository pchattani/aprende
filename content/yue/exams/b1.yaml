grammar:
  - { prompt: "我食___飯先出去。", options: ["完", "到", "住"], answer: 0, explain: "V完 means the action is finished (g.jyun-hou)." }
  - { prompt: "佢一個人食___成個蛋糕。", options: ["晒", "埋", "返"], answer: 0, explain: "晒 after a verb means 'all of it, completely' (g.saai-all)." }
  - { prompt: "功課太多，我今晚做___完。", options: ["唔", "冇", "未"], answer: 0, explain: "唔 between a verb and its result: 做唔完 'can't finish' (g.potential-resultatives)." }
  - { prompt: "我哋行___山頂睇日落。", options: ["上", "落", "入"], answer: 0, explain: "Direction verbs follow the main verb: 行上山頂 (g.compound-directionals)." }
  - { prompt: "我放工之後就返___屋企。", options: ["去", "嚟", "出"], answer: 0, explain: "去 after the verb means away from the speaker: 返去屋企 (g.directional-complements)." }
  - { prompt: "佢病咗兩日，而家好___喇。", options: ["返", "埋", "晒"], answer: 0, explain: "返 restores a normal state: 好返 'get better' (g.faan-back)." }
  - { prompt: "我部單車___人偷咗。", options: ["畀", "將", "同"], answer: 0, explain: "A + 畀 + agent + verb is the passive: 畀人偷咗 (g.bei-passive)." }
  - { prompt: "你___啲碗洗乾淨佢啦。", options: ["將", "畀", "用"], answer: 0, explain: "將 + object + verb + result says what is done to the object (g.zoeng-disposal)." }
  - { prompt: "我尋日買___本書好好睇。", options: ["嗰", "嘅", "咗"], answer: 0, explain: "A relative clause can end with 嗰 + measure word: 我尋日買嗰本書 (g.relative-classifier)." }
  - { prompt: "___好貴，但係好好食。", options: ["雖然", "因為", "如果"], answer: 0, explain: "雖然…但係… 'although … (but) …' (g.seoi-jin-daan-hai)." }
  - { prompt: "佢一邊食飯，___睇電話。", options: ["一邊", "跟住", "就"], answer: 0, explain: "一邊 + verb，一邊 + verb means 'while' (g.jat-bin-while)." }
  - { prompt: "我___到，你等咗好耐未呀？", options: ["啱啱", "已經", "終於"], answer: 0, explain: "啱啱 + verb means 'have just' (g.ngaam-ngaam-just)." }
  - { prompt: "我係尋日到___。", options: ["嘅", "咗", "過"], answer: 0, explain: "係 + detail + verb + 嘅 stresses the circumstances of a past event (g.hai-ge-focus)." }
  - { prompt: "___落雨，我都會去。", options: ["就算", "雖然", "因為"], answer: 0, explain: "就算…都 'even if … still' (g.zau-syun-even-if)." }
  - { prompt: "___學好廣東話，佢每日都睇港劇。", options: ["為咗", "因為", "雖然"], answer: 0, explain: "為咗 + goal states the purpose (g.wai-zo-purpose)." }
writing:
  prompt: "Write a short story (or a true story) in Cantonese about a day when something went wrong: start with a story opener (有一次 / 有一日), say what happened in order, include a surprise with 原來, use at least one 畀 passive or 將 sentence, and say how it ended with 結果 or 最後."
  minWords: 120
  modelAnswer: |
    有一次，我同朋友約咗喺尖沙咀食晚飯。嗰日我好早就放工，所以決定行路過去。點知行到一半，突然落大雨，我又冇帶遮，成身都濕晒。我即刻跑入一間便利店，想買把遮，但係啲遮全部都畀人買晒。

    冇辦法，我只好喺門口等雨停。等咗半個鐘，雨越落越大，我個朋友就打電話嚟問我喺邊度。我話：「我喺便利店，出唔到嚟呀！」佢笑咗好耐，話佢就喺隔籬嗰間餐廳。原來我哋只係隔咗一條街！

    佢拎住把遮行過嚟接我。我將件濕咗嘅外套除咗佢，同佢一齊入咗餐廳。結果嗰晚我哋食得好開心，仲叫咗一大煲湯。最後我學識咗一樣嘢：出門之前，一定要睇天氣報告。
  checklist:
    - "I opened the story with a story opener (有一次 / 有一日) and moved it along with 跟住, 之後, 突然."
    - "I used resultative or directional complements (濕晒, 買晒, 出唔到嚟, 行過嚟)."
    - "I used a 畀 passive or a 將 sentence correctly."
    - "I revealed a surprise with 原來."
    - "I said how things turned out with 結果 or 最後."
    - "I used a relative clause with 嘅 or a measure word (隔籬嗰間餐廳, 濕咗嘅外套)."
