id: r.b2.os-casaroes-de-sao-luis
level: b2
title: Os casarões de São Luís
kind: text
intro: An opinion piece in a São Luís newspaper argues that the only way to save the historic centre's tiled mansions is to bring people back to live in them. Notice the connectors of argumentation (em primeiro lugar, além disso, por outro lado, portanto, em suma).
allow: [são, luís, maranhão, maranhense, maranhenses, praia, grande, unesco, ok, reggae, bumba]
paragraphs:
  - { es: "Quem caminha pelas ruas da Praia Grande, no centro histórico de São Luís, vive uma experiência contraditória. De um lado, encanta-se com os casarões cobertos de azulejos portugueses, as sacadas de ferro, as ladeiras de pedra que descem até o mar. De outro, assusta-se com as janelas quebradas, os telhados caídos e as árvores que crescem dentro de prédios abandonados. Todo ano, durante a estação das chuvas, algum casarão desaba. É hora de admitir: do jeito que está, o centro histórico está morrendo.", en: "Anyone who walks the streets of Praia Grande, in São Luís's historic centre, has a contradictory experience. On one hand, you're enchanted by the mansions covered in Portuguese tiles, the iron balconies, the stone slopes running down to the sea. On the other, you're alarmed by the broken windows, the collapsed roofs and the trees growing inside abandoned buildings. Every year, during the rainy season, some mansion collapses. It's time to admit it: as things stand, the historic centre is dying." }
  - { es: "Em primeiro lugar, é preciso lembrar o valor do que está em jogo. São Luís é a única capital brasileira fundada por franceses, em 1612, e reúne um dos maiores conjuntos de arquitetura colonial portuguesa das Américas. Desde 1997, o seu centro histórico é patrimônio mundial da Unesco. A cidade também é conhecida como a capital brasileira do reggae e é o berço do bumba meu boi, uma das festas populares mais ricas do país. Não se trata, portanto, de um bairro qualquer, mas de uma parte da identidade do Brasil.", en: "First of all, we must remember the value of what's at stake. São Luís is the only Brazilian state capital founded by the French, in 1612, and it holds one of the largest ensembles of Portuguese colonial architecture in the Americas. Since 1997 its historic centre has been a UNESCO World Heritage Site. The city is also known as Brazil's reggae capital and is the birthplace of bumba meu boi, one of the country's richest popular festivals. This is not, therefore, just any neighbourhood, but part of Brazil's identity." }
  - { es: "Muitos defendem que a solução é investir mais em turismo: restaurar fachadas, abrir museus, organizar festivais. Não há dúvida de que essas ações são importantes. No entanto, a experiência mostra que elas não bastam. Vários casarões restaurados nas últimas décadas voltaram a se deteriorar poucos anos depois, justamente porque ninguém morava neles. Um prédio vazio, por mais bonito que seja, não resiste ao tempo: sem gente dentro, não há quem abra as janelas, conserte o telhado ou perceba uma infiltração antes que seja tarde.", en: "Many argue that the solution is to invest more in tourism: restore façades, open museums, organise festivals. There is no doubt that these actions are important. However, experience shows they are not enough. Several mansions restored in recent decades started deteriorating again a few years later, precisely because nobody lived in them. An empty building, however beautiful, does not withstand time: with no one inside, there's no one to open the windows, fix the roof or notice a leak before it's too late." }
  - { es: "Por isso, defendo que a prioridade seja a moradia. Além de restaurar, o poder público deveria oferecer incentivos para que famílias, estudantes e pequenos comerciantes voltassem a viver no centro: aluguéis subsidiados, redução de impostos para quem reformar e morar, linhas de crédito para pequenos proprietários. Cidades como Lisboa e Salvador, cada uma à sua maneira, já mostraram que um centro histórico só se mantém vivo quando volta a ter vizinhos, padarias, crianças na rua.", en: "That is why I argue that housing should be the priority. As well as restoring, the authorities should offer incentives for families, students and small shopkeepers to come back and live in the centre: subsidised rents, tax cuts for those who renovate and live there, credit lines for small owners. Cities like Lisbon and Salvador, each in its own way, have already shown that a historic centre only stays alive when it once again has neighbours, bakeries, children in the street." }
  - { es: "Há, é claro, objeções razoáveis. Alguns afirmam que restaurar um casarão para moradia custa caro demais e que as regras do patrimônio tornam qualquer obra lenta e burocrática. Outros temem que, uma vez recuperado, o centro fique caro e expulse justamente os moradores mais pobres que hoje resistem ali. São preocupações legítimas. Mas, a meu ver, elas apontam para a necessidade de um plano bem desenhado, e não para a desistência. Regras mais simples para obras de conservação e uma cota de moradias populares poderiam responder a ambos os problemas.", en: "There are, of course, reasonable objections. Some claim that restoring a mansion for housing is too expensive and that heritage rules make any work slow and bureaucratic. Others fear that, once restored, the centre will become expensive and push out precisely the poorest residents who hold on there today. These are legitimate concerns. But, in my view, they point to the need for a well-designed plan, not to giving up. Simpler rules for conservation work and a quota of social housing could answer both problems." }
  - { es: "Em suma, salvar os casarões de São Luís não é apenas uma questão de cimento e azulejo. É uma questão de gente. Enquanto o centro for visto só como cenário para fotos, continuará desabando aos poucos. Quando voltar a ser lugar de morar, talvez volte também a ter futuro. A escolha é nossa — e o tempo, a julgar pelas últimas chuvas, está acabando.", en: "In short, saving the mansions of São Luís isn't just a matter of cement and tiles. It's a matter of people. As long as the centre is seen only as a backdrop for photos, it will keep collapsing bit by bit. When it becomes a place to live again, perhaps it will also have a future again. The choice is ours — and time, judging by the latest rains, is running out." }
questions:
  - { q: "Por que a experiência de caminhar pela Praia Grande é «contraditória»?", options: ["Porque é bonita e ao mesmo tempo mostra prédios abandonados", "Porque é cara e barata", "Porque chove e faz sol"], answer: 0, explain: "You're enchanted by the tiled mansions but alarmed by «as janelas quebradas, os telhados caídos»." }
  - { q: "Qual é um fato histórico mencionado sobre São Luís?", options: ["Foi fundada por holandeses", "É a única capital brasileira fundada por franceses", "Foi a primeira capital do Brasil"], answer: 1, explain: "«São Luís é a única capital brasileira fundada por franceses, em 1612.»" }
  - { q: "Segundo o autor, por que investir só em turismo não basta?", options: ["Porque os turistas não gostam de museus", "Porque casarões restaurados se deterioram de novo se ninguém mora neles", "Porque não há dinheiro"], answer: 1, explain: "«Vários casarões restaurados... voltaram a se deteriorar poucos anos depois, justamente porque ninguém morava neles.»" }
  - { q: "Qual é a principal proposta do texto?", options: ["Transformar o centro em shopping", "Dar prioridade à moradia, com incentivos para as pessoas morarem no centro", "Demolir os casarões mais velhos"], answer: 1, explain: "«Defendo que a prioridade seja a moradia», with incentives like subsidised rents and tax cuts." }
  - { q: "Como o autor responde à objeção de que o centro pode ficar caro e expulsar os pobres?", options: ["Diz que isso é impossível", "Propõe uma cota de moradias populares", "Diz que não é problema dele"], answer: 1, explain: "He suggests «uma cota de moradias populares» as part of a well-designed plan." }
