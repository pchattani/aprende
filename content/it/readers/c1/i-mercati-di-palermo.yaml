id: r.c1.i-mercati-di-palermo
level: c1
title: Ballarò, il mercato che non dorme mai
kind: text
intro: "A feature article from a weekly magazine on Ballarò, the oldest street market in Palermo: its history, its voices and its uncertain future. Notice the journalistic devices of c1.u10 (a nominal headline, quoted voices, the reportative conditional) and the cohesion devices of c1.u04 (quest'ultimo, il quale, ciò)."
allow: [ballarò, vucciria, capo, albergheria, rosaria, salvo, giuseppe, abbanniate, abbanniata, panelle, sfincione, arancine, arancina, panino, kebab, street, food, unesco, ok]
paragraphs:
  - { es: "Chi arriva a Ballarò per la prima volta non lo vede: lo sente. Molto prima dei banchi di frutta e di pesce, arrivano le voci dei venditori, che gridano i prezzi e le qualità della merce con una specie di canto. A Palermo queste grida si chiamano «abbanniate», e per molti visitatori sono il vero monumento della città, più ancora della cattedrale o del Palazzo dei Normanni, che si trova a pochi passi.", en: "Whoever comes to Ballarò for the first time doesn't see it: they hear it. Long before the fruit and fish stalls, the voices of the sellers reach you, shouting out prices and the qualities of their goods in a kind of song. In Palermo these cries are called 'abbanniate', and for many visitors they are the city's true monument, even more than the cathedral or the Norman Palace, which is only a few steps away." }
  - { es: "Il mercato occupa le strade strette del quartiere dell'Albergheria, nel cuore del centro storico. Secondo molti studiosi, la sua origine risalirebbe al periodo arabo, cioè a più di mille anni fa: lo stesso nome deriverebbe da un villaggio vicino a Monreale da cui arrivavano i commercianti. Non tutti, però, sono d'accordo, e la questione resta aperta. Ciò che è certo è che il mercato non si è mai fermato: né le guerre né le crisi economiche sono riuscite a chiuderlo.", en: "The market fills the narrow streets of the Albergheria district, in the heart of the historic centre. According to many scholars, its origins are said to go back to the Arab period, that is, more than a thousand years ago: the name itself is said to come from a village near Monreale from which the traders came. Not everyone agrees, however, and the question remains open. What is certain is that the market has never stopped: neither wars nor economic crises have managed to close it." }
  - { es: "«Mio nonno vendeva pesce qui, poi mio padre, adesso io», racconta Salvo, cinquantadue anni, mentre pulisce un pesce spada con gesti rapidi e precisi. «Una volta si veniva al mercato per fare la spesa di tutta la settimana. Oggi la gente compra al supermercato e qui viene per guardare, per fare le foto. Non dico che sia un male, ma con le foto non si campa.» Quest'ultima frase la ripete due volte, ridendo, come se fosse un proverbio.", en: "'My grandfather sold fish here, then my father, now me,' says Salvo, fifty-two, as he cleans a swordfish with quick, precise movements. 'People used to come to the market to do the shopping for the whole week. Today people shop at the supermarket and come here to look, to take photos. I'm not saying it's a bad thing, but you can't make a living from photos.' He repeats this last sentence twice, laughing, as if it were a proverb." }
  - { es: "Il problema che Salvo descrive non riguarda solo Ballarò. Anche la Vucciria, l'altro grande mercato storico, è cambiata profondamente: negli ultimi vent'anni molti banchi hanno chiuso e al loro posto sono nati bar e locali per i giovani, che la sera si riempiono di musica. Il Capo, invece, resiste meglio, forse perché si trova in una zona dove abitano ancora molte famiglie.", en: "The problem Salvo describes doesn't only affect Ballarò. The Vucciria, the other great historic market, has also changed profoundly: in the last twenty years many stalls have closed and in their place bars and venues for young people have opened, which fill with music in the evening. The Capo, on the other hand, holds out better, perhaps because it lies in an area where many families still live." }
  - { es: "A Ballarò, però, sta succedendo qualcosa di nuovo. Accanto ai venditori palermitani lavorano oggi commercianti arrivati dal Bangladesh, dal Ghana, dalla Tunisia. Rosaria, che ha un banco di verdura da trent'anni, all'inizio era diffidente. «Pensavo che ci avrebbero portato via il lavoro», ammette. «Invece hanno riaperto negozi chiusi da anni e hanno portato clienti nuovi. Ormai il mio vicino di banco mi chiede come si cucinano i carciofi e io gli chiedo come si fa il suo pane.»", en: "At Ballarò, however, something new is happening. Alongside the Palermo sellers there are now traders who have come from Bangladesh, Ghana and Tunisia. Rosaria, who has had a vegetable stall for thirty years, was suspicious at first. 'I thought they would take our work away,' she admits. 'Instead they've reopened shops that had been shut for years and brought in new customers. These days my stall neighbour asks me how to cook artichokes and I ask him how he makes his bread.'" }
  - { es: "Non è la prima volta che succede. Palermo è stata greca, araba, normanna, spagnola, e ogni popolo ha lasciato qualcosa in cucina: l'arancina, secondo la tradizione, nascerebbe proprio dall'abitudine araba di mangiare il riso con lo zafferano. Il mercato, in questo senso, non fa che continuare una storia molto antica. «Ballarò è sempre stata così», dice Giuseppe, che organizza visite guidate per i turisti. «Un luogo dove ci si incontra, ci si scontra e alla fine ci si capisce.»", en: "It isn't the first time this has happened. Palermo has been Greek, Arab, Norman and Spanish, and every people has left something in the kitchen: the arancina, according to tradition, is said to have been born precisely from the Arab habit of eating rice with saffron. In this sense the market is simply continuing a very old story. 'Ballarò has always been like this,' says Giuseppe, who runs guided tours for tourists. 'A place where people meet, clash and in the end understand each other.'" }
  - { es: "Per chi visita il mercato, poi, c'è il cibo di strada. Davanti ai banchi si friggono le panelle, sottili frittelle di farina di ceci, e si vende lo sfincione, una pizza alta e morbida con cipolla, pomodoro e pangrattato. Qualche anno fa una guida internazionale ha inserito Palermo tra le capitali mondiali dello street food, e da allora le file davanti ad alcuni banchi sono diventate lunghissime. «Lo street food l'abbiamo inventato noi, prima che avesse un nome inglese», scherza un friggitore.", en: "For those visiting the market, there is also the street food. In front of the stalls they fry panelle, thin chickpea-flour fritters, and sell sfincione, a thick, soft pizza with onion, tomato and breadcrumbs. A few years ago an international guide put Palermo among the world capitals of street food, and since then the queues in front of some stalls have become very long. 'We invented street food, before it had an English name,' jokes one fritter-maker." }
  - { es: "Resta da capire che cosa succederà nei prossimi anni. Il Comune avrebbe in progetto di rinnovare le strade e di migliorare la raccolta dei rifiuti, che da tempo è uno dei problemi principali della zona. Alcuni commercianti temono che un mercato troppo pulito e ordinato perda la sua anima e diventi uno spettacolo per turisti. Altri, al contrario, pensano che senza investimenti il mercato non abbia futuro.", en: "It remains to be seen what will happen in the coming years. The council is reportedly planning to renovate the streets and improve rubbish collection, which has long been one of the area's main problems. Some traders fear that a market that is too clean and tidy will lose its soul and become a show for tourists. Others, on the contrary, think that without investment the market has no future." }
  - { es: "Intanto, alle sette di sera, Salvo chiude il banco. Lava il marmo con un secchio d'acqua, saluta i vicini e accende una sigaretta. «Domani alle cinque si ricomincia», dice. Poi, prima di andare via, si gira verso la strada ormai quasi vuota e grida un'ultima abbanniata, senza nessuno a cui vendere: sembra un saluto, o forse una promessa.", en: "Meanwhile, at seven in the evening, Salvo closes his stall. He washes the marble with a bucket of water, says goodbye to his neighbours and lights a cigarette. 'Tomorrow at five we start again,' he says. Then, before leaving, he turns towards the now almost empty street and shouts one last abbanniata, with nobody to sell to: it sounds like a farewell, or perhaps a promise." }
questions:
  - { q: "Che cosa sono le «abbanniate»?", options: ["I banchi di pesce del mercato", "Le grida cantate dei venditori", "Le feste del quartiere"], answer: 1, explain: "«A Palermo queste grida si chiamano abbanniate» – the sellers' sung cries." }
  - { q: "Perché il giornalista usa il condizionale in «la sua origine risalirebbe al periodo arabo»?", options: ["Per esprimere un desiderio", "Per riportare un'informazione non confermata", "Per fare una richiesta cortese"], answer: 1, explain: "The reportative conditional marks information attributed to others and not confirmed by the writer – and indeed «la questione resta aperta»." }
  - { q: "Qual è il problema principale secondo Salvo?", options: ["I turisti guardano e fotografano, ma comprano poco", "I prezzi del pesce sono troppo alti", "Il mercato apre troppo presto"], answer: 0, explain: "«qui viene per guardare, per fare le foto… con le foto non si campa»." }
  - { q: "Come è cambiata l'opinione di Rosaria sui nuovi commercianti?", options: ["Prima era favorevole, ora è contraria", "Prima era diffidente, ora ne vede i vantaggi", "Non ha mai cambiato idea"], answer: 1, explain: "«all'inizio era diffidente… Invece hanno riaperto negozi chiusi da anni e hanno portato clienti nuovi»." }
  - { q: "Secondo l'articolo, che legame c'è tra l'arancina e la storia di Palermo?", options: ["È stata inventata dai normanni", "Nascerebbe dall'abitudine araba di mangiare riso con lo zafferano", "È arrivata dalla Spagna"], answer: 1, explain: "«secondo la tradizione, nascerebbe proprio dall'abitudine araba di mangiare il riso con lo zafferano»." }
  - { q: "Che cosa temono alcuni commercianti dei progetti del Comune?", options: ["Che il mercato chiuda per sempre", "Che un mercato troppo ordinato perda la sua anima", "Che arrivino troppi venditori stranieri"], answer: 1, explain: "«temono che un mercato troppo pulito e ordinato perda la sua anima e diventi uno spettacolo per turisti» – temere che + congiuntivo." }
