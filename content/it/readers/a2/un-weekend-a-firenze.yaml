id: r.a2.un-weekend-a-firenze
level: a2
title: Un weekend a Firenze
kind: text
intro: Martina, a student from Naples, writes a blog post about her first weekend in Florence – told in the passato prossimo.
allow: [ce, martina, giorgio, brunelleschi, botticelli, venere, uffizi, arno, santo, spirito, oltrarno]
paragraphs:
  - { es: "Lo scorso fine settimana sono andata a Firenze per la prima volta. Sono partita da Napoli venerdì sera con il treno veloce e sono arrivata alla stazione di Santa Maria Novella dopo tre ore. Ho dormito in un piccolo albergo vicino al Duomo, con una vista bellissima sulla cupola.", en: "Last weekend I went to Florence for the first time. I left Naples on Friday evening on the high-speed train and arrived at Santa Maria Novella station three hours later. I slept in a small hotel near the cathedral, with a beautiful view of the dome." }
  - { es: "Sabato mattina mi sono svegliata presto e sono salita in cima alla cupola di Brunelleschi. Ci sono 463 gradini e la scala è molto stretta! A metà strada mi sono fermata due volte, ma alla fine ce l'ho fatta. Dall'alto ho visto tutta la città: i tetti rossi, le colline, il fiume Arno. È stato il momento più bello del viaggio.", en: "On Saturday morning I woke up early and climbed to the top of Brunelleschi's dome. There are 463 steps and the staircase is very narrow! Halfway up I stopped twice, but in the end I made it. From the top I saw the whole city: the red roofs, the hills, the river Arno. It was the best moment of the trip." }
  - { es: "Dopo pranzo ho visitato gli Uffizi. Ho comprato il biglietto online, così non ho fatto la fila. Ho passato tre ore nel museo e ho visto finalmente la Nascita di Venere di Botticelli. Dal vivo è molto più grande di come pensavo!", en: "After lunch I visited the Uffizi. I bought the ticket online, so I didn't queue. I spent three hours in the museum and finally saw Botticelli's Birth of Venus. In real life it's much bigger than I thought!" }
  - { es: "La sera ho attraversato il Ponte Vecchio. Sul ponte ci sono ancora le gioiellerie, come nel Cinquecento. Non ho comprato niente, perché i gioielli sono troppo cari per una studentessa, ma ho fatto tante foto. Poi ho cenato in una trattoria in Oltrarno con Giorgio, un amico dell'università che vive a Firenze da due anni. Abbiamo mangiato la bistecca alla fiorentina: enorme!", en: "In the evening I crossed the Ponte Vecchio. There are still jewellers' shops on the bridge, as in the sixteenth century. I didn't buy anything, because jewellery is too expensive for a student, but I took lots of photos. Then I had dinner in a trattoria in the Oltrarno with Giorgio, a university friend who has lived in Florence for two years. We ate Florentine T-bone steak: enormous!" }
  - { es: "Domenica ha piovuto tutto il giorno e sono rimasta a lungo in una libreria vicino a Santo Spirito. Sono tornata a Napoli stanca ma felice. Non ho visto tutto, naturalmente: Firenze è piena di arte. Ci torno sicuramente!", en: "On Sunday it rained all day and I stayed for a long time in a bookshop near Santo Spirito. I went back to Naples tired but happy. I didn't see everything, of course: Florence is full of art. I'll definitely go back!" }
questions:
  - { q: "Come è arrivata Martina a Firenze?", options: ["In aereo", "In treno", "In macchina"], answer: 1, explain: "«Sono partita da Napoli venerdì sera con il treno veloce.»" }
  - { q: "Perché Martina si è fermata due volte sabato mattina?", options: ["Perché la salita in cima alla cupola è lunga e stretta", "Perché ha perso il biglietto", "Perché pioveva"], answer: 0, explain: "She climbed the 463 steps of the dome and stopped twice halfway up." }
  - { q: "Perché Martina non ha fatto la fila agli Uffizi?", options: ["Perché è andata la sera", "Perché ha comprato il biglietto online", "Perché il museo era vuoto"], answer: 1, explain: "«Ho comprato il biglietto online, così non ho fatto la fila.»" }
  - { q: "Che cosa ha comprato sul Ponte Vecchio?", options: ["Un anello", "Una collana", "Niente"], answer: 2, explain: "«Non ho comprato niente, perché i gioielli sono troppo cari.» She only took photos." }
  - { q: "Da quanto tempo Giorgio vive a Firenze?", options: ["Da due anni", "Da due mesi", "Da un fine settimana"], answer: 0, explain: "Giorgio «vive a Firenze da due anni» – note da + present for something still going on." }
glossary:
  - { es: "ce l'ho fatta", en: I made it }
  - { es: dall'alto, en: from the top }
  - { es: dal vivo, en: in real life, in person }
  - { es: online, en: online }
  - { es: Cinquecento, en: the sixteenth century (the 1500s) }
  - { es: bistecca alla fiorentina, en: Florentine T-bone steak }
  - { es: libreria, en: bookshop }
  - { es: naturalmente, en: of course, naturally }
