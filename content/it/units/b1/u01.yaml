id: b1.u01
title: "Glielo dico io"
lessons:
  - id: b1.u01.l1
    title: Te lo presto volentieri
    teach: [g.combined-pronouns]
    vocab: [w.glielo, w.ce, w.favore, w.ringraziare, w.scusarsi, w.permesso, w.permettere, w.promessa, w.segreto, w.fidarsi, w.fiducia, w.nascondere, w.rivelare, w.passaggio, w.incartare, w.incarto, w.ricambiare, w.dovere.n, w.aiutarsi, w.condividere, w.offerta, w.proposta, w.richiesta, w.prestare-attenzione, w.gruppo]
    tip: "Indirect before direct, and the -i becomes -e: mi + lo = me lo, ti + la = te la. Gli and le both become glie- and fuse: glielo."
    sentences:
      - { es: "Mi presti la penna? Sì, te la presto.", en: "Will you lend me the pen? Yes, I'll lend it to you.", altEs: ["Mi presti la penna? Certo, te la presto.", "Mi presti la penna? Sì, te la presto volentieri."], altEn: ["Can you lend me the pen? Yes, I'll lend it to you."], grammar: [g.combined-pronouns], vocab: [w.ce] }
      - { es: "Il segreto? Non te lo posso dire.", en: "The secret? I can't tell you.", altEs: ["Il segreto? Non posso dirtelo."], altEn: ["The secret? I can't tell it to you."], grammar: [g.combined-pronouns], vocab: [w.segreto], transform: { instruction: "Attach the pronouns to the infinitive", answer: "Il segreto? Non posso dirtelo.", alt: ["Non posso dirtelo."] } }
      - { es: "Non preoccuparti, glielo dico io.", en: "Don't worry, I'll tell him.", altEs: ["Tranquillo, glielo dico io.", "Non ti preoccupare, glielo dico io."], altEn: ["Don't worry, I'll tell her.", "Don't worry, I'll tell them."], grammar: [g.combined-pronouns], vocab: [w.glielo], error: { wrong: "Non preoccuparti, gli lo dico io.", explain: "gli + lo fuse into one word: glielo.", grammar: g.combined-pronouns } }
      - { es: "Signora, gliela incarto? È un regalo?", en: "Madam, shall I wrap it for you? Is it a present?", altEs: ["Signora, gliela incarto? È per un regalo?"], grammar: [g.combined-pronouns, g.lei-forms], vocab: [w.incartare, w.glielo], note: "Shop assistants use glie- for formal 'to you' (Lei)." }
      - { es: "Ti mando il programma stasera.", en: "I'll send you the programme tonight.", grammar: [g.combined-pronouns], vocab: [w.ce], transform: { instruction: "Replace 'il programma' with a pronoun", answer: "Te lo mando stasera.", alt: ["Te lo mando stasera, il programma."], en: "I'll send it to you tonight." } }
      - { es: "Mi fido di te: te lo rivelo, ma resta un segreto.", en: "I trust you: I'll reveal it to you, but it stays a secret.", altEs: ["Mi fido di te, te lo rivelo, ma resta un segreto."], grammar: [g.combined-pronouns], vocab: [w.fidarsi, w.rivelare, w.segreto] }
      - { es: "Perché me lo nascondi? Ho fiducia in te.", en: "Why are you hiding it from me? I trust you.", altEs: ["Perché me lo nascondi? Io ho fiducia in te."], altEn: ["Why are you hiding it from me? I have faith in you."], grammar: [g.combined-pronouns], vocab: [w.nascondere, w.fiducia], error: { wrong: "Perché mi lo nascondi? Ho fiducia in te.", explain: "mi becomes me before lo: me lo nascondi.", grammar: g.combined-pronouns } }
      - { es: "Volete la ricetta del risotto alla milanese? Ve la mando stasera.", en: "Do you want the recipe for risotto alla milanese? I'll send it to you tonight.", altEs: ["Volete la ricetta del risotto alla milanese? Ve la mando io stasera."], grammar: [g.combined-pronouns], vocab: [w.ce] }
      - { es: "Un passaggio fino al Duomo? Te lo do volentieri.", en: "A lift to the Duomo? I'll gladly give you one.", altEs: ["Un passaggio fino al Duomo? Te lo do io volentieri."], grammar: [g.combined-pronouns], vocab: [w.passaggio] }
      - { es: "Il favore? Te lo ricambio presto, promesso.", en: "The favour? I'll return it soon, I promise.", altEs: ["Il favore te lo ricambio presto, promesso."], grammar: [g.combined-pronouns], vocab: [w.favore, w.ricambiare] }
      - { es: "Se hai una proposta migliore, ce la puoi dire adesso.", en: "If you have a better proposal, you can tell us now.", altEs: ["Se hai una proposta migliore, puoi dircela adesso."], grammar: [g.combined-pronouns], vocab: [w.proposta] }
      - { es: "Il permesso? Glielo chiedo io al direttore.", en: "The permission? I'll ask the director for it myself.", altEs: ["Il permesso al direttore glielo chiedo io."], grammar: [g.combined-pronouns], vocab: [w.permesso, w.glielo] }
      - { es: "È tuo dovere dirglielo.", en: "It's your duty to tell him.", altEs: ["Hai il dovere di dirglielo.", "È un tuo dovere dirglielo."], altEn: ["It's your duty to tell her."], grammar: [g.combined-pronouns], vocab: [w.dovere.n] }
      - { es: "Tra vicini ci aiutiamo: io gli presto la macchina e loro ce la riportano pulita.", en: "Neighbours help each other: I lend them the car and they bring it back to us clean.", altEs: ["Tra vicini ci aiutiamo sempre: io gli presto la macchina e loro ce la riportano pulita."], grammar: [g.combined-pronouns], vocab: [w.aiutarsi] }
      - { es: "Le foto della gita? Ve le condivido sul gruppo.", en: "The photos from the trip? I'll share them with you on the group chat.", grammar: [g.combined-pronouns], vocab: [w.condividere] }
      - { es: "Prestate attenzione: ve lo spiego una volta sola.", en: "Pay attention: I'll explain it to you only once.", altEs: ["Prestate attenzione, ve lo spiego solo una volta."], grammar: [g.combined-pronouns], vocab: [w.prestare-attenzione] }
    exchanges:
      - q: { es: "Mi presti la bici domani?", en: "Will you lend me your bike tomorrow?" }
        a: { es: "Certo, te la presto volentieri.", en: "Of course, I'll gladly lend it to you." }
        alt: ["Sì, te la presto.", "Mi dispiace, domani non te la posso prestare."]
        grammar: [g.combined-pronouns]
        vocab: [w.ce]
      - q: { es: "Hai detto a Giulia della festa?", en: "Have you told Giulia about the party?" }
        a: { es: "Non ancora, glielo dico stasera.", en: "Not yet, I'll tell her tonight." }
        alt: ["No, glielo dico domani.", "Sì, gliel'ho già detto."]
        grammar: [g.combined-pronouns]
        vocab: [w.glielo]
      - q: { es: "Ci racconti il tuo segreto?", en: "Will you tell us your secret?" }
        a: { es: "No, non ve lo racconto: è un segreto!", en: "No, I'm not telling you: it's a secret!" }
        alt: ["Ve lo racconto dopo cena.", "Forse ve lo racconto un giorno."]
        grammar: [g.combined-pronouns]
        vocab: [w.segreto]
      - q: { es: "Le incarto il panettone, signora?", en: "Shall I wrap the panettone for you, madam?" }
        a: { es: "Sì, grazie, è un regalo per mia suocera.", en: "Yes, thank you, it's a present for my mother-in-law." }
        alt: ["Sì, me lo incarti, per favore.", "No, grazie, lo mangio subito."]
        grammar: [g.combined-pronouns, g.lei-forms]
        vocab: [w.incartare]
      - q: { es: "Ti fidi di Luca?", en: "Do you trust Luca?" }
        a: { es: "Sì, i miei segreti glieli racconto tutti.", en: "Yes, I tell him all my secrets." }
        alt: ["Sì, ho molta fiducia in lui.", "No, non gli racconto niente."]
        grammar: [g.combined-pronouns]
        vocab: [w.fidarsi, w.segreto]
    texts:
      - title: "Messaggio di Paolo"
        es: ["Ciao Anna, sabato vado a Milano.", "Mi presti la tua guida della città?", "Te la riporto lunedì, promesso.", "Se ti serve qualcosa dal centro, te la compro io."]
        en: ["Hi Anna, I'm going to Milan on Saturday.", "Will you lend me your city guide?", "I'll bring it back to you on Monday, I promise.", "If you need anything from the centre, I'll buy it for you."]
        grammar: [g.combined-pronouns]
        vocab: [w.ce]
      - title: "Biglietto per la vicina"
        es: ["Gentile signora Bassi, grazie dell'offerta.", "Il pacco glielo ritiro io domani.", "E la torta gliela riporto lunedì, vuota!"]
        en: ["Dear Mrs Bassi, thank you for the offer.", "I'll pick up the parcel for you tomorrow.", "And I'll bring the cake back to you on Monday, empty!"]
        grammar: [g.combined-pronouns, g.lei-forms]
        vocab: [w.offerta, w.glielo]
    spicy:
      - { es: "Il tuo numero? Se me lo dai, te lo prometto: ti chiamo solo per cose importanti, tipo stasera.", en: "Your number? If you give it to me, I promise: I'll only call you about important things, like tonight.", altEs: ["Il tuo numero? Se me lo dai, ti prometto che ti chiamo solo per cose importanti, tipo stasera."], grammar: [g.combined-pronouns], vocab: [w.ce] }
      - { es: "Un bacio? Te lo do sotto il Duomo, così ci vedono tutti.", en: "A kiss? I'll give you one under the Duomo, so everyone sees us.", altEs: ["Un bacio? Te lo do davanti al Duomo, così ci vedono tutti."], grammar: [g.combined-pronouns], vocab: [w.ce] }
      - { es: "Il mio segreto? Te lo rivelo solo dopo il secondo aperitivo.", en: "My secret? I'll only reveal it to you after the second aperitivo.", grammar: [g.combined-pronouns], vocab: [w.segreto, w.rivelare] }
      - { es: "Mia madre vuole conoscerti: glielo dico io che sei solo un amico, un amico molto carino.", en: "My mother wants to meet you: I'll tell her you're just a friend, a very cute friend.", altEs: ["Mia madre vuole conoscerti: le dico io che sei solo un amico, un amico molto carino."], grammar: [g.combined-pronouns], vocab: [w.glielo] }
      - { es: "Il dolce ce lo dividiamo, ma l'ultimo cucchiaio me lo lasci tu.", en: "We'll share the dessert, but you leave me the last spoonful.", altEs: ["Il dolce lo dividiamo, ma l'ultimo cucchiaio me lo lasci tu."], grammar: [g.combined-pronouns], vocab: [w.ce] }
  - id: b1.u01.l2
    title: Gliel'ho già mandato
    teach: [g.combined-pronouns-past]
    vocab: [w.mail, w.allegato, w.allegare, w.inoltrare, w.scaricare, w.caricare, w.stampare, w.stampante, w.schermo, w.tastiera, w.sito, w.pagina, w.password, w.app, w.rete, w.connessione, w.collegarsi, w.cliccare, w.cancellare, w.aggiornare, w.aggiornamento, w.social, w.chiavetta, w.dati, w.utente, w.digitale, w.online, w.testo, w.copia, w.registrare, w.tranne]
    tip: "Lo and la elide before ho, ha, hanno (gliel'ho, me l'ha), and the participle agrees with the direct pronoun: la mail? Gliel'ho mandata."
    sentences:
      - { es: "Le foto della gita? Gliele ho già inoltrate.", en: "The photos from the trip? I've already forwarded them to him.", altEn: ["The photos from the trip? I've already forwarded them to her."], grammar: [g.combined-pronouns-past], vocab: [w.inoltrare, w.glielo] }
      - { es: "Chi ti ha dato la password della rete? Me l'ha data il cameriere.", en: "Who gave you the network password? The waiter gave it to me.", altEs: ["Chi ti ha dato la password della rete? Il cameriere me l'ha data."], grammar: [g.combined-pronouns-past], vocab: [w.password, w.rete] }
      - { es: "Ho mandato la mail a Luca.", en: "I sent the email to Luca.", grammar: [g.combined-pronouns-past], vocab: [w.mail], transform: { instruction: "Replace 'la mail' and 'a Luca' with pronouns", answer: "Gliel'ho mandata.", alt: [], en: "I sent it to him." } }
      - { es: "La mail del direttore? Gliel'ho mandata stamattina.", en: "The director's email? I sent it to him this morning.", altEn: ["The director's email? I sent it to her this morning."], grammar: [g.combined-pronouns-past], vocab: [w.mail], error: { wrong: "La mail del direttore? Gliel'ho mandato stamattina.", explain: "la mail is feminine, so the participle after l' agrees: mandata.", grammar: g.combined-pronouns-past } }
      - { es: "I biglietti per la Scala? Ve li ho stampati: sono sulla stampante.", en: "The tickets for La Scala? I printed them for you: they're on the printer.", altEs: ["I biglietti per la Scala ve li ho stampati, sono sulla stampante."], grammar: [g.combined-pronouns-past], vocab: [w.stampare, w.stampante] }
      - { es: "Quante pagine ti hanno chiesto? Me ne hanno chieste dieci.", en: "How many pages did they ask you for? They asked me for ten.", grammar: [g.combined-pronouns-past], vocab: [w.pagina], note: "With ne the participle agrees with the noun it stands for: pagine → chieste." }
      - { es: "L'aggiornamento dell'app? Ce l'hanno mandato due giorni fa, ma non l'abbiamo ancora scaricato.", en: "The app update? They sent it to us two days ago, but we haven't downloaded it yet.", grammar: [g.combined-pronouns-past], vocab: [w.aggiornamento, w.app, w.scaricare] }
      - { es: "Gliel'hai detto che lo schermo è rotto?", en: "Did you tell him the screen is broken?", altEs: ["Gli hai detto che lo schermo è rotto?"], altEn: ["Have you told her that the screen is broken?"], grammar: [g.combined-pronouns-past], vocab: [w.schermo] }
      - { es: "La chiavetta con i dati? Gliel'ho restituita ieri.", en: "The USB stick with the data? I gave it back to him yesterday.", altEn: ["The USB stick with the data? I gave it back to her yesterday."], grammar: [g.combined-pronouns-past], vocab: [w.chiavetta, w.dati] }
      - { es: "Mi hanno dato le chiavi dell'ufficio.", en: "They gave me the office keys.", grammar: [g.combined-pronouns-past], vocab: [w.ce], transform: { instruction: "Replace 'le chiavi dell'ufficio' with a pronoun", answer: "Me le hanno date.", alt: [], en: "They gave them to me." } }
      - { es: "Mi hai registrato il concerto? Sì, te l'ho registrato tutto.", en: "Did you record the concert for me? Yes, I recorded all of it for you.", grammar: [g.combined-pronouns-past], vocab: [w.registrare] }
      - { es: "Una copia del testo te l'ho caricata sul sito.", en: "I've uploaded a copy of the text to the website for you.", altEs: ["Te l'ho caricata sul sito, una copia del testo."], grammar: [g.combined-pronouns-past], vocab: [w.copia, w.testo, w.caricare, w.sito] }
      - { es: "Non riesco a collegarmi: me la ripeti, la password?", en: "I can't log on: can you repeat the password for me?", altEs: ["Non riesco a collegarmi: mi ripeti la password?"], grammar: [g.combined-pronouns], vocab: [w.collegarsi, w.password] }
      - { es: "Ho cliccato sul link e il sito mi ha chiesto i dati, ma non glieli ho dati.", en: "I clicked on the link and the site asked me for my details, but I didn't give them to it.", altEn: ["I clicked on the link and the website asked for my data, but I didn't give it."], grammar: [g.combined-pronouns-past], vocab: [w.cliccare, w.dati] }
      - { es: "Le foto imbarazzanti? Me le ha cancellate mio fratello, per fortuna.", en: "The embarrassing photos? My brother deleted them for me, luckily.", grammar: [g.combined-pronouns-past], vocab: [w.cancellare] }
      - { es: "Il profilo sui social? Te l'hanno aggiornato loro, con una foto digitale nuova.", en: "Your social media profile? They updated it for you, with a new digital photo.", grammar: [g.combined-pronouns-past], vocab: [w.social, w.aggiornare, w.digitale] }
    exchanges:
      - q: { es: "Hai mandato la mail al direttore?", en: "Did you send the email to the director?" }
        a: { es: "Sì, gliel'ho mandata stamattina.", en: "Yes, I sent it to him this morning." }
        alt: ["Non ancora, gliela mando dopo pranzo.", "Sì, gliel'ho già mandata."]
        grammar: [g.combined-pronouns-past]
        vocab: [w.mail]
      - q: { es: "Chi ti ha regalato questo libro?", en: "Who gave you this book?" }
        a: { es: "Me l'ha regalato mia sorella per il compleanno.", en: "My sister gave it to me for my birthday." }
        alt: ["Me l'ha regalato un'amica.", "Me l'hanno regalato i colleghi."]
        grammar: [g.combined-pronouns-past]
        vocab: [w.ce]
      - q: { es: "Mi hai stampato i biglietti?", en: "Did you print the tickets for me?" }
        a: { es: "Sì, te li ho stampati: sono sulla scrivania.", en: "Yes, I printed them for you: they're on the desk." }
        alt: ["No, scusa, la stampante non funziona.", "Te li ho mandati per mail."]
        grammar: [g.combined-pronouns-past]
        vocab: [w.stampare]
      - q: { es: "Quanti messaggi ti ha mandato?", en: "How many messages did he send you?" }
        a: { es: "Me ne ha mandati venti in un'ora!", en: "He sent me twenty in one hour!" }
        alt: ["Me ne ha mandati tantissimi.", "Non me ne ha mandato nessuno."]
        grammar: [g.combined-pronouns-past]
        vocab: [w.ce]
      - q: { es: "Hai il link della riunione online?", en: "Have you got the link for the online meeting?" }
        a: { es: "No, non me l'hanno ancora mandato.", en: "No, they haven't sent it to me yet." }
        alt: ["Sì, me l'ha inoltrato Giulia.", "Te lo inoltro subito."]
        grammar: [g.combined-pronouns-past]
        vocab: [w.online, w.inoltrare]
    texts:
      - title: "Mail di lavoro"
        es: ["Gentile dottoressa Ferri, il contratto gliel'ho inoltrato ieri.", "La copia firmata, invece, me l'ha caricata un collega sul sito.", "Se non la trova, gliela mando come allegato."]
        en: ["Dear Dr Ferri, I forwarded the contract to you yesterday.", "The signed copy, on the other hand, a colleague uploaded to the website for me.", "If you can't find it, I'll send it to you as an attachment."]
        grammar: [g.combined-pronouns-past, g.lei-forms]
        vocab: [w.inoltrare, w.copia, w.allegato]
      - title: "Nel gruppo degli amici"
        es: ["Ragazzi, le foto della festa ve le ho caricate qui.", "Quelle brutte, tranquilli, le ho cancellate.", "Il video invece me l'ha chiesto la nonna!"]
        en: ["Guys, I've uploaded the party photos here for you.", "Don't worry, I deleted the bad ones.", "The video, though, Grandma asked me for!"]
        grammar: [g.combined-pronouns-past]
        vocab: [w.caricare, w.cancellare]
    spicy:
      - { es: "Il mio numero? Te l'ho dato ieri sera: perché non mi hai ancora scritto?", en: "My number? I gave it to you last night: why haven't you texted me yet?", altEs: ["Il mio numero te l'ho dato ieri sera: perché non mi hai ancora scritto?"], grammar: [g.combined-pronouns-past], vocab: [w.ce] }
      - { es: "Le foto della serata? Te le ho mandate tutte, tranne quella in cui balli sul tavolo.", en: "The photos from the evening? I sent you all of them, except the one where you're dancing on the table.", grammar: [g.combined-pronouns-past], vocab: [w.ce] }
      - { es: "Il primo bacio? Me l'hai dato tu: io ho solo partecipato.", en: "The first kiss? You gave it to me: I just took part.", altEs: ["Il primo bacio me l'hai dato tu: io ho solo partecipato."], grammar: [g.combined-pronouns-past], vocab: [w.ce] }
      - { es: "La password del tuo cuore? Me l'ha detta tua sorella.", en: "The password to your heart? Your sister told me it.", altEn: ["The password to your heart? Your sister gave it to me."], grammar: [g.combined-pronouns-past], vocab: [w.password] }
      - { es: "Quella canzone romantica me l'hai mandata per sbaglio o apposta?", en: "Did you send me that romantic song by mistake or on purpose?", grammar: [g.combined-pronouns-past], vocab: [w.ce] }
  - id: b1.u01.l3
    title: Ce l'hai il biglietto?
    teach: [g.ce-ne-ce-lo]
    vocab: [w.farcela, w.stavolta, w.batteria, w.caricabatterie, w.linea, w.contatto, w.contattare, w.assistenza, w.togliere, w.riconoscere, w.notare, w.accorgersi, w.rendersi-conto, w.lassu, w.richiamare]
    tip: "Ci + ne → ce n'è / ce ne sono for quantities; with avere + lo/la/li/le, spoken Italian adds ci: ce l'ho (I've got it)."
    sentences:
      - { es: "Hai il biglietto per le terrazze? Sì, ce l'ho.", en: "Have you got the ticket for the rooftop terraces? Yes, I have.", altEs: ["Ce l'hai il biglietto per le terrazze? Sì, ce l'ho."], altEn: ["Do you have the ticket for the terraces? Yes, I've got it."], grammar: [g.ce-ne-ce-lo], vocab: [w.ce], error: { wrong: "Hai il biglietto per le terrazze? Sì, l'ho.", explain: "With avere + lo/la, Italian adds ci: ce l'ho.", grammar: g.ce-ne-ce-lo } }
      - { es: "C'è ancora posto nell'ascensore? No, non ce n'è più.", en: "Is there still room in the lift? No, there's none left.", altEs: ["C'è ancora posto in ascensore? No, non ce n'è più."], grammar: [g.ce-ne-ce-lo], vocab: [w.ce] }
      - { es: "Quante guglie ci sono sul Duomo? Ce ne sono più di cento.", en: "How many spires are there on the Duomo? There are more than a hundred.", grammar: [g.ce-ne-ce-lo], vocab: [w.guglia] }
      - { es: "Hai notato le statue? Ce ne sono più di tremila su tutta la cattedrale.", en: "Have you noticed the statues? There are more than three thousand of them all over the cathedral.", grammar: [g.ce-ne-ce-lo], vocab: [w.notare] }
      - { es: "Hai un caricabatterie? Ho il cinque per cento di batteria.", en: "Have you got a charger? My battery is at five per cent.", grammar: [g.ce-ne-ce-lo], vocab: [w.caricabatterie, w.batteria], transform: { instruction: "Answer 'no' using ce + pronoun", answer: "No, non ce l'ho.", alt: ["Mi dispiace, non ce l'ho."], en: "No, I haven't got one." } }
      - { es: "Ce la fai a salire a piedi? Sono più di duecento gradini.", en: "Can you manage to walk up? It's more than two hundred steps.", altEs: ["Ce la fai a salire a piedi? Ci sono più di duecento gradini."], grammar: [g.ce-ne-ce-lo], vocab: [w.farcela] }
      - { es: "Stavolta ce l'abbiamo fatta: siamo arrivati in cima!", en: "This time we made it: we got to the top!", altEs: ["Questa volta ce l'abbiamo fatta: siamo arrivati in cima!"], grammar: [g.ce-ne-ce-lo], vocab: [w.stavolta, w.farcela] }
      - { es: "Ci sono tre posti liberi.", en: "There are three free seats.", grammar: [g.ce-ne-ce-lo], vocab: [w.ce], transform: { instruction: "Replace 'posti liberi' with ne", answer: "Ce ne sono tre.", alt: ["Ce ne sono tre liberi."], en: "There are three (of them)." } }
      - { es: "C'è ancora del caffè? Sì, ce n'è un po'.", en: "Is there any coffee left? Yes, there's a bit.", grammar: [g.ce-ne-ce-lo], vocab: [w.ce], error: { wrong: "C'è ancora del caffè? Sì, ce ne sono un po'.", explain: "Coffee is uncountable and singular: ce n'è, not ce ne sono.", grammar: g.ce-ne-ce-lo } }
      - { es: "Mi sono accorta all'ingresso che il biglietto non ce l'avevo più.", en: "I realised at the entrance that I didn't have the ticket any more.", altEs: ["All'ingresso mi sono accorta che non ce l'avevo più, il biglietto."], grammar: [g.ce-ne-ce-lo], vocab: [w.accorgersi] }
      - { es: "Ti rendi conto? Di turisti oggi ce ne sono tantissimi.", en: "Can you believe it? There are loads of tourists today.", altEn: ["Do you realise? There are thousands of tourists today."], grammar: [g.ce-ne-ce-lo], vocab: [w.rendersi-conto] }
      - { es: "Per entrare nel Duomo devi togliere il cappello, se ce l'hai.", en: "To go into the Duomo you have to take off your hat, if you've got one.", grammar: [g.ce-ne-ce-lo], vocab: [w.togliere] }
      - { es: "Riconosci la Madonnina? È lassù, sulla guglia più alta.", en: "Do you recognise the Madonnina? She's up there, on the highest spire.", grammar: [g.ce-ne-ce-lo], vocab: [w.riconoscere, w.guglia, w.lassu] }
      - { es: "È caduta la linea: ti richiamo quando ho campo.", en: "The line went dead: I'll call you back when I've got signal.", altEs: ["È caduta la linea, ti richiamo appena ho campo."], grammar: [g.ce-ne-ce-lo], vocab: [w.linea, w.richiamare] }
      - { es: "Per l'assistenza devi contattare il museo: il contatto ce l'ho io.", en: "For assistance you need to contact the museum: I've got the contact details.", grammar: [g.ce-ne-ce-lo], vocab: [w.assistenza, w.contattare, w.contatto] }
      - { es: "Hai i documenti? No, non ce li ho: li ho lasciati in albergo.", en: "Have you got your documents? No, I haven't: I left them at the hotel.", altEs: ["Ce li hai i documenti? No, non ce li ho, li ho lasciati in albergo."], grammar: [g.ce-ne-ce-lo], vocab: [w.ce] }
    exchanges:
      - q: { es: "Hai l'ombrello? Comincia a piovere.", en: "Have you got your umbrella? It's starting to rain." }
        a: { es: "No, non ce l'ho. Lo compriamo qui?", en: "No, I haven't. Shall we buy one here?" }
        alt: ["Sì, ce l'ho in borsa.", "No, non ce l'ho."]
        grammar: [g.ce-ne-ce-lo]
        vocab: [w.ce]
      - q: { es: "Ci sono ancora biglietti per la visita delle due?", en: "Are there still tickets for the two o'clock tour?" }
        a: { es: "Sì, ce ne sono ancora pochi.", en: "Yes, there are still a few." }
        alt: ["No, non ce ne sono più.", "Ce ne sono solo tre."]
        grammar: [g.ce-ne-ce-lo]
        vocab: [w.ce]
      - q: { es: "Ce la fai a portare la valigia?", en: "Can you manage to carry the suitcase?" }
        a: { es: "Sì, ce la faccio, grazie.", en: "Yes, I can manage, thanks." }
        alt: ["No, non ce la faccio: mi aiuti?", "Ce la faccio da sola."]
        grammar: [g.ce-ne-ce-lo]
        vocab: [w.farcela]
      - q: { es: "Hai il caricabatterie del telefono?", en: "Have you got your phone charger?" }
        a: { es: "Ce l'ho in borsa: te lo presto.", en: "I've got it in my bag: I'll lend it to you." }
        alt: ["Sì, ce l'ho.", "No, non ce l'ho, mi dispiace."]
        grammar: [g.ce-ne-ce-lo, g.combined-pronouns]
        vocab: [w.caricabatterie]
      - q: { es: "C'è del latte in frigo?", en: "Is there any milk in the fridge?" }
        a: { es: "Sì, ce n'è ancora un po'.", en: "Yes, there's still a bit." }
        alt: ["No, non ce n'è più.", "Ce n'è mezzo litro."]
        grammar: [g.ce-ne-ce-lo]
        vocab: [w.ce]
    texts:
      - title: "Cartello alle terrazze del Duomo"
        es: ["Biglietti per le terrazze: ce ne sono ancora per il pomeriggio.", "Chi non ce la fa a salire a piedi può prendere l'ascensore.", "All'ingresso della cattedrale, togliere il cappello."]
        en: ["Tickets for the terraces: there are still some for the afternoon.", "Anyone who can't manage to walk up can take the lift.", "At the cathedral entrance, please remove your hat."]
        grammar: [g.ce-ne-ce-lo]
        vocab: [w.farcela, w.togliere]
    spicy:
      - { es: "Hai un fidanzato? Ce l'avevo, ma stasera non me lo ricordo più.", en: "Do you have a boyfriend? I had one, but tonight I can't remember him.", altEs: ["Hai il fidanzato? Ce l'avevo, ma stasera non me lo ricordo più."], grammar: [g.ce-ne-ce-lo], vocab: [w.ce] }
      - { es: "Di ragazzi carini a Milano ce ne sono tanti, ma con quegli occhi ce n'è uno solo.", en: "There are lots of cute guys in Milan, but there's only one with those eyes.", grammar: [g.ce-ne-ce-lo], vocab: [w.ce] }
      - { es: "Ce la fai a salire duecento gradini con me? In cima ti aspetta un bacio.", en: "Can you manage two hundred steps with me? A kiss is waiting for you at the top.", grammar: [g.ce-ne-ce-lo], vocab: [w.farcela] }
      - { es: "Il mio numero ce l'hai già: che cosa aspetti?", en: "You've already got my number: what are you waiting for?", altEs: ["Ce l'hai già il mio numero: che aspetti?"], grammar: [g.ce-ne-ce-lo], vocab: [w.ce] }
      - { es: "Stavolta non me lo nascondi: ce l'hai una ragazza o no?", en: "This time you're not hiding it from me: have you got a girlfriend or not?", grammar: [g.ce-ne-ce-lo, g.combined-pronouns], vocab: [w.stavolta, w.nascondere] }
  - id: b1.u01.l4
    title: Glielo spedisco domani
    teach: [g.combined-pronouns, g.combined-pronouns-past]
    vocab: [w.spedizione, w.corriere, w.consegna, w.ricevuta, w.mittente, w.destinatario, w.raccomandata, w.modulo, w.compilare, w.firmare, w.firma, w.avvisare, w.avvertire, w.informare, w.comunicare, w.annunciare, w.occuparsi, w.trattarsi, w.riguardare, w.richiedere, w.presenza, w.accettare, w.rifiutare, w.ritirare, w.codice, w.ammiratore, w.portiere]
    tip: "Ne joins the cluster too: me ne occupo io (I'll take care of it). And glie- covers formal 'you': glielo spedisco, signora."
    sentences:
      - { es: "Spedisco la lettera a mia madre.", en: "I'm sending the letter to my mother.", grammar: [g.combined-pronouns], vocab: [w.glielo], transform: { instruction: "Replace 'la lettera' and 'a mia madre' with pronouns", answer: "Gliela spedisco.", alt: [], en: "I'm sending it to her." } }
      - { es: "Mi scusi, la ricevuta me la può dare?", en: "Excuse me, could you give me the receipt?", altEs: ["Mi scusi, me la può dare la ricevuta?", "Mi scusi, può darmi la ricevuta?"], grammar: [g.combined-pronouns, g.lei-forms], vocab: [w.ricevuta] }
      - { es: "Il modulo gliel'ho già compilato io: deve solo firmarlo.", en: "I've already filled in the form for you: you only need to sign it.", altEs: ["Il modulo gliel'ho già compilato io, deve solo firmarlo."], grammar: [g.combined-pronouns-past, g.lei-forms], vocab: [w.modulo, w.compilare, w.firmare] }
      - { es: "La raccomandata? Ce l'hanno consegnata stamattina.", en: "The registered letter? They delivered it to us this morning.", grammar: [g.combined-pronouns-past], vocab: [w.raccomandata], error: { wrong: "La raccomandata? Ce l'hanno consegnato stamattina.", explain: "l' stands for la raccomandata (feminine), so the participle is consegnata.", grammar: g.combined-pronouns-past } }
      - { es: "Ho consegnato il pacco ai vicini.", en: "I delivered the parcel to the neighbours.", grammar: [g.combined-pronouns-past], vocab: [w.glielo], transform: { instruction: "Replace 'il pacco' and 'ai vicini' with pronouns", answer: "Gliel'ho consegnato.", alt: [], en: "I delivered it to them." } }
      - { es: "Chi è il mittente? Non lo so: la busta me l'hanno data senza nome.", en: "Who's the sender? I don't know: they gave me the envelope without a name.", grammar: [g.combined-pronouns-past], vocab: [w.mittente] }
      - { es: "Il destinatario ha rifiutato la consegna, quindi il pacco ce l'hanno rimandato.", en: "The recipient refused the delivery, so they sent the parcel back to us.", grammar: [g.combined-pronouns-past], vocab: [w.destinatario, w.rifiutare, w.consegna] }
      - { es: "Se la spedizione arriva in ritardo, ve lo comunichiamo per mail.", en: "If the shipment arrives late, we'll let you know by email.", altEs: ["Se la spedizione arriva in ritardo, ve lo comunichiamo via mail."], grammar: [g.combined-pronouns], vocab: [w.spedizione, w.comunicare] }
      - { es: "Di che cosa si tratta? Di un documento: glielo devo consegnare di persona.", en: "What's it about? A document: I have to hand it to him in person.", altEs: ["Di cosa si tratta? Di un documento: devo consegnarglielo di persona."], grammar: [g.combined-pronouns], vocab: [w.trattarsi] }
      - { es: "Non si preoccupi, me ne occupo io.", en: "Don't worry, I'll take care of it.", altEs: ["Non si preoccupi: me ne occupo io."], grammar: [g.combined-pronouns, g.lei-forms], vocab: [w.occuparsi], error: { wrong: "Non si preoccupi, mi ne occupo io.", explain: "mi becomes me before ne: me ne occupo.", grammar: g.combined-pronouns } }
      - { es: "Questa lettera riguarda anche te: te la leggo?", en: "This letter concerns you too: shall I read it to you?", grammar: [g.combined-pronouns], vocab: [w.riguardare] }
      - { es: "Ti hanno informato del ritardo? Sì, me l'hanno comunicato ieri.", en: "Did they inform you about the delay? Yes, they told me yesterday.", grammar: [g.combined-pronouns-past], vocab: [w.informare, w.comunicare] }
      - { es: "Hanno annunciato lo sciopero dei treni: ve l'avevo detto!", en: "They've announced the train strike: I told you so!", grammar: [g.combined-pronouns-past], vocab: [w.annunciare] }
      - { es: "Se arriva il corriere, mi avvisi? Me lo deve consegnare entro le sei.", en: "If the courier comes, will you let me know? He has to deliver it to me by six.", altEs: ["Se arriva il corriere, mi avverti? Me lo deve consegnare entro le sei."], grammar: [g.combined-pronouns], vocab: [w.avvisare, w.avvertire] }
      - { es: "Per il permesso di soggiorno richiedono la presenza: glielo dico perché non lo sa nessuno.", en: "For the residence permit they require you to be there in person: I'm telling you because nobody knows.", grammar: [g.combined-pronouns, g.lei-forms], vocab: [w.richiedere, w.presenza] }
      - { es: "Accettano solo contanti? Allora i soldi te li presto io.", en: "They only accept cash? Then I'll lend you the money.", grammar: [g.combined-pronouns], vocab: [w.accettare] }
    exchanges:
      - q: { es: "Buongiorno, vorrei spedire questo pacco a Torino.", en: "Good morning, I'd like to send this parcel to Turin." }
        a: { es: "Certo, me lo dia. Deve compilare anche questo modulo.", en: "Of course, give it to me. You also have to fill in this form." }
        alt: ["Certo, me lo dà? E compili questo modulo, per favore."]
        grammar: [g.combined-pronouns, g.lei-forms]
        vocab: [w.modulo, w.compilare]
      - q: { es: "Ha la ricevuta della raccomandata?", en: "Have you got the receipt for the registered letter?" }
        a: { es: "Sì, ce l'ho qui nel portafoglio.", en: "Yes, I've got it here in my wallet." }
        alt: ["Sì, ce l'ho.", "No, non ce l'ho più."]
        grammar: [g.ce-ne-ce-lo]
        vocab: [w.ricevuta, w.raccomandata]
      - q: { es: "Chi si occupa delle spedizioni?", en: "Who deals with the shipments?" }
        a: { es: "Me ne occupo io, non si preoccupi.", en: "I deal with them, don't worry." }
        alt: ["Se ne occupa il mio collega.", "Me ne occupo io."]
        grammar: [g.combined-pronouns]
        vocab: [w.occuparsi, w.spedizione]
      - q: { es: "Quando mi consegnate il divano?", en: "When will you deliver the sofa to me?" }
        a: { es: "Glielo consegniamo giovedì mattina.", en: "We'll deliver it to you on Thursday morning." }
        alt: ["Giovedì mattina.", "Glielo portiamo giovedì."]
        grammar: [g.combined-pronouns, g.lei-forms]
        vocab: [w.consegna]
      - q: { es: "Hai detto ai tuoi che ti trasferisci a Milano?", en: "Have you told your parents you're moving to Milan?" }
        a: { es: "Non ancora, glielo dico domenica a pranzo.", en: "Not yet, I'll tell them at Sunday lunch." }
        alt: ["Sì, gliel'ho detto ieri.", "No, non gliel'ho ancora detto."]
        grammar: [g.combined-pronouns, g.combined-pronouns-past]
        vocab: [w.glielo]
    texts:
      - title: "Avviso del corriere"
        es: ["Gentile cliente, oggi non l'abbiamo trovata in casa.", "Il pacco glielo riportiamo domani tra le 9 e le 13.", "Se preferisce, può ritirarlo in ufficio con questa ricevuta e una firma."]
        en: ["Dear customer, we didn't find you at home today.", "We'll bring the parcel back to you tomorrow between 9 and 1.", "If you prefer, you can collect it at the office with this receipt and a signature."]
        grammar: [g.combined-pronouns, g.lei-forms]
        vocab: [w.corriere, w.ricevuta, w.firma, w.ritirare]
    spicy:
      - { es: "Il mio cuore te l'ho spedito per raccomandata: firma la ricevuta, per favore.", en: "I've sent you my heart by registered mail: sign the receipt, please.", grammar: [g.combined-pronouns-past], vocab: [w.raccomandata, w.ricevuta, w.firmare] }
      - { es: "Le rose? Te le ha mandate un ammiratore segreto che, guarda caso, vive al tuo stesso indirizzo.", en: "The roses? A secret admirer sent them to you, who, funnily enough, lives at your address.", grammar: [g.combined-pronouns-past], vocab: [w.ammiratore, w.segreto] }
      - { es: "Il corriere te l'ha consegnato di persona? Strano, a me lo lascia sempre al portiere.", en: "The courier handed it to you in person? Funny, he always leaves mine with the porter.", grammar: [g.combined-pronouns-past], vocab: [w.corriere, w.portiere] }
      - { es: "Mi hai chiesto il numero e io te l'ho dato: adesso del resto te ne occupi tu.", en: "You asked me for my number and I gave it to you: now you take care of the rest.", grammar: [g.combined-pronouns-past, g.combined-pronouns], vocab: [w.occuparsi] }
dialogues:
  - id: b1.u01.d1
    title: Un pacco per Palermo
    context: Elena is at a post office near the Duomo in Milan, sending a present to her mother in Palermo.
    lines:
      - { speaker: Impiegato, es: "Buongiorno, mi dica.", en: "Good morning, how can I help?" }
      - { speaker: Elena, es: "Buongiorno. Vorrei spedire questo pacco a mia madre, a Palermo: è una piccola copia del Duomo.", en: "Good morning. I'd like to send this parcel to my mother in Palermo: it's a small model of the Duomo." }
      - { speaker: Impiegato, es: "Bel regalo! Me lo dia, lo peso. Deve compilare anche questo modulo.", en: "Nice present! Give it to me, I'll weigh it. You also have to fill in this form." }
      - { speaker: Elena, es: "Il modulo me l'ha già dato il suo collega e l'ho compilato a casa.", en: "Your colleague already gave me the form and I filled it in at home." }
      - { speaker: Impiegato, es: "Perfetto. Ha anche un documento?", en: "Perfect. Do you also have some ID?" }
      - { speaker: Elena, es: "Sì, ce l'ho... ah no, non ce l'ho! L'ho lasciato in albergo.", en: "Yes, I've got it... oh no, I haven't! I left it at the hotel." }
      - { speaker: Impiegato, es: "Non si preoccupi, per un pacco normale non serve. Lo vuole con il corriere espresso?", en: "Don't worry, you don't need it for an ordinary parcel. Do you want it by express courier?" }
      - { speaker: Elena, es: "Quanto costa? E quando glielo consegnano?", en: "How much is it? And when will they deliver it to her?" }
      - { speaker: Impiegato, es: "Diciotto euro, e glielo consegnano entro giovedì.", en: "Eighteen euros, and they'll deliver it to her by Thursday." }
      - { speaker: Elena, es: "Va bene. Mi dà la ricevuta, per favore? Così mando il codice a mia madre.", en: "All right. Could you give me the receipt, please? Then I can send the code to my mother." }
      - { speaker: Impiegato, es: "Ecco. Gliela metto nella busta insieme alla copia del modulo.", en: "Here you are. I'll put it in the envelope for you with the copy of the form." }
    questions:
      - { q: "Dove vuole spedire il pacco Elena?", options: ["A Milano", "A Palermo", "A Torino"], answer: 1, explain: "She says: Vorrei spedire questo pacco a mia madre, a Palermo." }
      - { q: "Chi le ha dato il modulo?", options: ["Sua madre", "Un collega dell'impiegato", "Il corriere"], answer: 1, explain: "Il modulo me l'ha già dato il suo collega: the clerk's colleague gave it to her." }
      - { q: "Perché Elena non ha il documento?", options: ["L'ha perso al Duomo", "L'ha lasciato in albergo", "Ce l'ha sua madre"], answer: 1, explain: "L'ho lasciato in albergo: she left it at the hotel." }
      - { q: "Che cosa vuole mandare Elena a sua madre?", options: ["Il codice della spedizione", "Una foto del Duomo", "Diciotto euro"], answer: 0, explain: "Così mando il codice a mia madre: she'll send her the tracking code." }
