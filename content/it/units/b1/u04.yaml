id: b1.u04
title: "Il treno era già partito"
lessons:
  - id: b1.u04.l1
    title: Il treno era già partito
    teach: [g.trapassato-prossimo]
    vocab: [w.annullare, w.cancellato, w.rimandare, w.rinviare, w.anticipare, w.imprevisto, w.inconveniente, w.contrattempo, w.nebbia-fitta, w.maltempo, w.a-quel-punto, w.in-tempo, w.allultimo-momento, w.ormai, w.intanto, w.frattempo, w.attesa, w.sala-dattesa, w.passeggero-in-transito, w.cambiare-treno, w.appuntamento-mancato, w.precedente, w.successivo, w.agenda]
    tip: "The trapassato prossimo (avevo visto, ero partito) is the past before the past: Quando sono arrivato, il treno era già partito."
    sentences:
      - { es: "Quando sono arrivato in stazione, il treno per Verona era già partito.", en: "When I got to the station, the train to Verona had already left.", altEs: ["Quando sono arrivata in stazione, il treno per Verona era già partito."], grammar: [g.trapassato-prossimo], vocab: [], error: { wrong: "Quando sono arrivato in stazione, il treno per Verona è già partito.", explain: "The earlier of two past actions takes the trapassato: era già partito.", grammar: g.trapassato-prossimo } }
      - { es: "Il treno era stato cancellato per il maltempo, ma nessuno ci aveva avvisato.", en: "The train had been cancelled because of the bad weather, but nobody had warned us.", grammar: [g.trapassato-prossimo], vocab: [w.cancellato, w.maltempo] }
      - { es: "C'era una nebbia fitta e il volo era stato annullato all'ultimo momento.", en: "There was thick fog and the flight had been cancelled at the last minute.", grammar: [g.trapassato-prossimo], vocab: [w.nebbia-fitta, w.annullare, w.allultimo-momento] }
      - { es: "Avevamo già comprato i biglietti quando hanno rinviato il concerto.", en: "We had already bought the tickets when they postponed the concert.", altEs: ["Avevamo già comprato i biglietti quando hanno rimandato il concerto."], grammar: [g.trapassato-prossimo], vocab: [w.rinviare, w.rimandare] }
      - { es: "Mi avevano detto che la riunione era stata anticipata alle nove.", en: "They had told me the meeting had been brought forward to nine.", grammar: [g.trapassato-prossimo], vocab: [w.anticipare] }
      - { es: "A quel punto avevamo perso la coincidenza e abbiamo dovuto cambiare treno a Brescia.", en: "By that point we had missed our connection and had to change trains in Brescia.", grammar: [g.trapassato-prossimo], vocab: [w.a-quel-punto, w.cambiare-treno] }
      - { es: "Ormai era tardi: il ristorante aveva già chiuso la cucina.", en: "By then it was late: the restaurant had already closed the kitchen.", grammar: [g.trapassato-prossimo], vocab: [w.ormai] }
      - { es: "Siamo arrivati in tempo perché eravamo partiti all'alba.", en: "We arrived in time because we had set off at dawn.", grammar: [g.trapassato-prossimo], vocab: [w.in-tempo] }
      - { es: "Intanto, nella sala d'attesa, un bambino aveva cominciato a piangere.", en: "Meanwhile, in the waiting room, a child had started to cry.", grammar: [g.trapassato-prossimo], vocab: [w.intanto, w.sala-dattesa] }
      - { es: "Nel frattempo Giulia aveva già prenotato un altro albergo.", en: "In the meantime Giulia had already booked another hotel.", grammar: [g.trapassato-prossimo], vocab: [w.frattempo] }
      - { es: "L'appuntamento mancato? Avevo dimenticato di scriverlo in agenda.", en: "The missed appointment? I had forgotten to write it in my diary.", grammar: [g.trapassato-prossimo], vocab: [w.appuntamento-mancato, w.agenda] }
      - { es: "Era un imprevisto: nessuno aveva pensato allo sciopero.", en: "It was something unexpected: nobody had thought about the strike.", grammar: [g.trapassato-prossimo], vocab: [w.imprevisto] }
      - { es: "Il treno precedente era partito in orario; quello successivo, con un'ora di ritardo.", en: "The previous train had left on time; the next one, an hour late.", grammar: [g.trapassato-prossimo], vocab: [w.precedente, w.successivo] }
      - { es: "Dopo un'attesa di due ore, abbiamo scoperto che il treno non era mai partito da Milano.", en: "After a two-hour wait, we found out that the train had never left Milan.", grammar: [g.trapassato-prossimo], vocab: [w.attesa] }
      - { es: "Marco mi ha detto: «Ho perso le chiavi».", en: "Marco told me: 'I've lost my keys.'", grammar: [g.trapassato-prossimo], vocab: [], transform: { instruction: "Report it: Marco mi ha detto che…", answer: "Marco mi ha detto che aveva perso le chiavi.", alt: [], en: "Marco told me he had lost his keys." } }
      - { es: "Il passeggero in transito aveva perso il volo per un piccolo contrattempo.", en: "The transit passenger had missed the flight because of a small hitch.", grammar: [g.trapassato-prossimo], vocab: [w.passeggero-in-transito, w.contrattempo], transform: { instruction: "Make the passenger plural", answer: "I passeggeri in transito avevano perso il volo per un piccolo contrattempo.", alt: [], en: "The transit passengers had missed the flight because of a small hitch." } }
    exchanges:
      - q: { es: "Perché non sei venuto alla riunione?", en: "Why didn't you come to the meeting?" }
        a: { es: "Mi avevano detto che era stata rinviata.", en: "They'd told me it had been postponed." }
        alt: ["Mi avevano detto che non c'era.", "Nessuno mi aveva avvisato."]
        grammar: [g.trapassato-prossimo]
        vocab: [w.rinviare]
      - q: { es: "Hai preso il treno delle otto?", en: "Did you catch the eight o'clock train?" }
        a: { es: "No, quando sono arrivato in stazione era già partito.", en: "No, when I got to the station it had already left." }
        alt: ["No, era già partito.", "Sì, per fortuna era in ritardo."]
        grammar: [g.trapassato-prossimo]
        vocab: []
      - q: { es: "Eri mai stato a Verona?", en: "Had you ever been to Verona?" }
        a: { es: "No, non c'ero mai stato: è la prima volta.", en: "No, I'd never been: it's the first time." }
        alt: ["Sì, c'ero stato da bambino.", "No, mai."]
        grammar: [g.trapassato-prossimo]
        vocab: []
      - q: { es: "Com'è andato il viaggio?", en: "How did the trip go?" }
        a: { es: "Male: avevano cancellato il volo e abbiamo preso l'autobus.", en: "Badly: they'd cancelled the flight and we took the bus." }
        alt: ["Benissimo, grazie.", "Un po' male: c'era stato uno sciopero."]
        grammar: [g.trapassato-prossimo]
        vocab: [w.cancellato]
      - q: { es: "A che ora siete arrivati?", en: "What time did you arrive?" }
        a: { es: "A mezzanotte: avevamo perso la coincidenza a Brescia.", en: "At midnight: we'd missed our connection in Brescia." }
        alt: ["Tardissimo.", "A mezzanotte, per colpa della nebbia."]
        grammar: [g.trapassato-prossimo]
        vocab: []
    texts:
      - title: "Annuncio in stazione"
        es: ["Il treno regionale delle 8.15 per Verona Porta Nuova è stato cancellato per maltempo.", "I passeggeri in transito possono cambiare treno a Brescia.", "Ci scusiamo per l'inconveniente."]
        en: ["The 8.15 regional train to Verona Porta Nuova has been cancelled due to bad weather.", "Transit passengers can change trains at Brescia.", "We apologise for the inconvenience."]
        grammar: [g.trapassato-prossimo]
        vocab: [w.cancellato, w.maltempo, w.passeggero-in-transito, w.inconveniente]
      - title: "Diario di viaggio"
        es: ["Quando siamo arrivati a Verona, avevamo già perso mezza giornata.", "Il treno precedente era stato cancellato e quello successivo era pieno.", "Ma a quel punto non era più importante: eravamo arrivati!"]
        en: ["When we got to Verona, we had already lost half a day.", "The previous train had been cancelled and the next one was full.", "But by that point it didn't matter any more: we had arrived!"]
        grammar: [g.trapassato-prossimo]
        vocab: [w.precedente, w.successivo, w.a-quel-punto]
    spicy:
      - { es: "Avevo già perso il treno, ma quando ti ho visto in sala d'attesa ho pensato: per fortuna!", en: "I had already missed the train, but when I saw you in the waiting room I thought: lucky me!", grammar: [g.trapassato-prossimo], vocab: [w.sala-dattesa] }
      - { es: "Non avevo mai baciato nessuno su un binario prima di quella sera.", en: "I had never kissed anyone on a platform before that evening.", grammar: [g.trapassato-prossimo], vocab: [] }
      - { es: "Il volo era stato cancellato, l'albergo era pieno e tu avevi solo un divano: che imprevisto fortunato!", en: "The flight had been cancelled, the hotel was full and you only had a sofa: what a lucky surprise!", grammar: [g.trapassato-prossimo], vocab: [w.cancellato, w.imprevisto] }
      - { es: "Ormai avevi già detto di sì: adesso non puoi cambiare treno.", en: "You'd already said yes by then: you can't change trains now.", grammar: [g.trapassato-prossimo], vocab: [w.ormai, w.cambiare-treno] }
  - id: b1.u04.l2
    title: Mi avevano rubato il portafoglio
    teach: [g.trapassato-prossimo]
    vocab: [w.furto, w.rubare, w.ladro, w.borseggiatore, w.denunciare, w.denuncia, w.polizia, w.carabiniere, w.questura, w.testimone, w.sospettare, w.oggetti-smarriti, w.smarrire, w.ritrovare, w.reclamo, w.rimborso, w.lamentarsi, w.protestare, w.dimenticanza, w.sbaglio, w.errore, w.colpa, w.per-colpa-di, w.addosso]
    tip: "Telling a story, the trapassato sets the scene before the main events: Mi sono accorto che qualcuno mi aveva rubato il portafoglio."
    sentences:
      - { es: "Mi sono accorto alla cassa che qualcuno mi aveva rubato il portafoglio.", en: "I realised at the till that someone had stolen my wallet.", altEs: ["Alla cassa mi sono accorto che qualcuno mi aveva rubato il portafoglio."], grammar: [g.trapassato-prossimo], vocab: [w.rubare] }
      - { es: "Il borseggiatore era salito sull'autobus alla fermata dell'Arena.", en: "The pickpocket had got on the bus at the Arena stop.", grammar: [g.trapassato-prossimo], vocab: [w.borseggiatore] }
      - { es: "Quando è arrivata la polizia, il ladro era già fuggito.", en: "When the police arrived, the thief had already fled.", altEs: ["Il ladro era già fuggito quando è arrivata la polizia."], grammar: [g.trapassato-prossimo], vocab: [w.ladro, w.polizia, w.fuggire], error: { wrong: "Quando è arrivata la polizia, il ladro aveva già fuggito.", explain: "fuggire takes essere in compound tenses: era già fuggito.", grammar: g.trapassato-prossimo } }
      - { es: "Hai denunciato il furto? Sì, la denuncia l'avevo fatta subito.", en: "Did you report the theft? Yes, I'd filed the report straight away.", grammar: [g.trapassato-prossimo], vocab: [w.denunciare, w.furto, w.denuncia] }
      - { es: "Un testimone aveva visto tutto dalla finestra.", en: "A witness had seen everything from the window.", grammar: [g.trapassato-prossimo], vocab: [w.testimone] }
      - { es: "I carabinieri hanno sospettato subito del cameriere, che era sparito la sera prima.", en: "The carabinieri immediately suspected the waiter, who had disappeared the evening before.", grammar: [g.trapassato-prossimo], vocab: [w.carabiniere, w.sospettare] }
      - { es: "All'ufficio oggetti smarriti avevano ritrovato il mio zaino.", en: "At the lost property office they had found my rucksack.", grammar: [g.trapassato-prossimo], vocab: [w.oggetti-smarriti, w.ritrovare] }
      - { es: "Avevo smarrito il passaporto, ma qualcuno l'aveva portato in albergo.", en: "I had lost my passport, but someone had taken it to the hotel.", grammar: [g.trapassato-prossimo], vocab: [w.smarrire] }
      - { es: "Avevo fatto un reclamo, ma non mi avevano mai risposto.", en: "I had made a complaint, but they had never replied.", grammar: [g.trapassato-prossimo], vocab: [w.reclamo], transform: { instruction: "Change io to noi", answer: "Avevamo fatto un reclamo, ma non ci avevano mai risposto.", alt: [], en: "We had made a complaint, but they had never replied to us." } }
      - { es: "Ci avevano promesso un rimborso, ma non abbiamo visto un euro.", en: "They had promised us a refund, but we didn't see a single euro.", grammar: [g.trapassato-prossimo], vocab: [w.rimborso] }
      - { es: "Si è lamentato perché il cameriere aveva sbagliato il conto.", en: "He complained because the waiter had got the bill wrong.", grammar: [g.trapassato-prossimo], vocab: [w.lamentarsi] }
      - { es: "Il pubblico protestava perché l'opera era cominciata con un'ora di ritardo.", en: "The audience were protesting because the opera had started an hour late.", grammar: [g.trapassato-prossimo], vocab: [w.protestare] }
      - { es: "È stata colpa mia: avevo lasciato la borsa aperta.", en: "It was my fault: I had left my bag open.", grammar: [g.trapassato-prossimo], vocab: [w.colpa] }
      - { es: "Per colpa di una dimenticanza, avevamo lasciato le chiavi in macchina.", en: "Because of a moment's forgetfulness, we had left the keys in the car.", grammar: [g.trapassato-prossimo], vocab: [w.per-colpa-di, w.dimenticanza] }
      - { es: "Anna dice: «Mi hanno rubato la borsa».", en: "Anna says: 'They've stolen my bag.'", grammar: [g.trapassato-prossimo], vocab: [w.rubare], transform: { instruction: "Report it in the past: Anna ha detto che…", answer: "Anna ha detto che le avevano rubato la borsa.", alt: [], en: "Anna said they had stolen her bag." } }
      - { es: "Non era uno sbaglio mio: c'era un errore nella denuncia, avevano scritto male il mio nome.", en: "It wasn't my mistake: there was an error in the report, they had misspelt my name.", grammar: [g.trapassato-prossimo], vocab: [w.sbaglio, w.errore, w.denuncia] }
    exchanges:
      - q: { es: "Che cosa è successo?", en: "What happened?" }
        a: { es: "Mi avevano rubato il telefono sull'autobus e non me n'ero accorto.", en: "Someone had stolen my phone on the bus and I hadn't noticed." }
        alt: ["Mi hanno rubato il telefono.", "Un borseggiatore mi aveva aperto la borsa."]
        grammar: [g.trapassato-prossimo]
        vocab: [w.rubare]
      - q: { es: "Hai fatto la denuncia?", en: "Have you reported it?" }
        a: { es: "Sì, l'ho fatta in questura stamattina.", en: "Yes, I filed it at the police station this morning." }
        alt: ["Sì, ai carabinieri.", "Non ancora, ci vado dopo."]
        grammar: [g.trapassato-prossimo]
        vocab: [w.denuncia, w.questura]
      - q: { es: "Hai ritrovato la valigia?", en: "Did you find your suitcase?" }
        a: { es: "Sì, l'avevano portata all'ufficio oggetti smarriti.", en: "Yes, they had taken it to the lost property office." }
        alt: ["Sì, per fortuna.", "No, non l'hanno ancora ritrovata."]
        grammar: [g.trapassato-prossimo]
        vocab: [w.ritrovare, w.oggetti-smarriti]
      - q: { es: "Di chi è stata la colpa?", en: "Whose fault was it?" }
        a: { es: "Mia: avevo dimenticato di chiudere la porta.", en: "Mine: I had forgotten to lock the door." }
        alt: ["Colpa mia.", "Di nessuno, è stato un incidente."]
        grammar: [g.trapassato-prossimo]
        vocab: [w.colpa]
      - q: { es: "Ti hanno dato il rimborso?", en: "Did they give you the refund?" }
        a: { es: "Non ancora: avevo mandato il reclamo, ma non hanno risposto.", en: "Not yet: I'd sent the complaint, but they haven't answered." }
        alt: ["Sì, finalmente.", "No, mi hanno detto di aspettare."]
        grammar: [g.trapassato-prossimo]
        vocab: [w.rimborso, w.reclamo]
    texts:
      - title: "Dalla denuncia"
        es: ["Ieri sera, verso le 22, ero in Piazza Bra con alcuni amici.", "Quando sono tornata in albergo, mi sono accorta che qualcuno mi aveva aperto la borsa.", "Il portafoglio era sparito, ma il telefono no."]
        en: ["Yesterday evening, at about 10 pm, I was in Piazza Bra with some friends.", "When I got back to the hotel, I realised that someone had opened my bag.", "My wallet had disappeared, but not my phone."]
        grammar: [g.trapassato-prossimo]
        vocab: [w.denuncia]
    spicy:
      - { es: "Un ladro mi aveva rubato il portafoglio, ma tu quella sera mi hai rubato il cuore.", en: "A thief had stolen my wallet, but that evening you stole my heart.", grammar: [g.trapassato-prossimo], vocab: [w.ladro, w.rubare] }
      - { es: "Avevo cercato il mio ombrello per giorni: era a casa tua, vicino alle tue scarpe.", en: "I'd been looking for my umbrella for days: it was at your place, next to your shoes.", grammar: [g.trapassato-prossimo], vocab: [] }
      - { es: "Non è stata colpa mia: il vino aveva già deciso tutto prima di me.", en: "It wasn't my fault: the wine had already decided everything before I did.", grammar: [g.trapassato-prossimo], vocab: [w.colpa] }
      - { es: "Mi ero persa per Verona, ma il carabiniere più carino della città mi aveva già notata.", en: "I'd got lost in Verona, but the cutest carabiniere in town had already noticed me.", grammar: [g.trapassato-prossimo], vocab: [w.carabiniere] }
      - { es: "Mi eri caduto addosso sull'autobus: io avevo sospettato un borseggiatore, invece eri solo timido.", en: "You'd fallen against me on the bus: I'd suspected a pickpocket, but you were just shy.", grammar: [g.trapassato-prossimo], vocab: [w.addosso, w.sospettare, w.borseggiatore] }
  - id: b1.u04.l3
    title: Quando avrò finito
    teach: [g.futuro-anteriore]
    vocab: [w.scadenza, w.dopo-che, w.non-appena, w.una-volta-che, w.finché, w.nel-momento-in-cui, w.fiera, w.impresa, w.industria, w.fabbrica, w.design, w.produrre, w.produzione, w.prodotto, w.automobile, w.risultato]
    tip: "avrò finito, sarò arrivato = I will have done. After quando, appena, dopo che, Italian uses it where English has 'when I've done'. It also guesses: Avrà perso il treno (He must have missed the train)."
    sentences:
      - { es: "Alle sei avrò finito e ti raggiungerò all'Arena.", en: "I'll have finished by six and I'll join you at the Arena.", altEs: ["Alle sei avrò finito e ti raggiungo all'Arena."], grammar: [g.futuro-anteriore], vocab: [], error: { wrong: "Alle sei sarò finito e ti raggiungerò all'Arena.", explain: "finire with a person as subject takes avere: avrò finito.", grammar: g.futuro-anteriore } }
      - { es: "Quando avrai visto la fiera, capirai perché viene tanta gente a Verona.", en: "When you've seen the fair, you'll understand why so many people come to Verona.", grammar: [g.futuro-anteriore], vocab: [w.fiera] }
      - { es: "Non appena avremo firmato il contratto, comincerà la produzione.", en: "As soon as we've signed the contract, production will start.", altEs: ["Appena avremo firmato il contratto, comincerà la produzione."], grammar: [g.futuro-anteriore], vocab: [w.non-appena, w.produzione] }
      - { es: "Una volta che avrete scelto il design, la fabbrica produrrà i primi pezzi.", en: "Once you've chosen the design, the factory will produce the first pieces.", grammar: [g.futuro-anteriore], vocab: [w.una-volta-che, w.design, w.fabbrica, w.produrre] }
      - { es: "Entro la scadenza avremo consegnato tutti i prodotti.", en: "By the deadline we'll have delivered all the products.", grammar: [g.futuro-anteriore], vocab: [w.scadenza, w.prodotto] }
      - { es: "Non risponde: avrà dimenticato il telefono in macchina.", en: "He's not answering: he must have left his phone in the car.", altEs: ["Non risponde, avrà lasciato il telefono in macchina."], grammar: [g.futuro-anteriore], vocab: [] }
      - { es: "Dove avrò messo le chiavi della macchina?", en: "Where can I have put the car keys?", altEn: ["Where on earth did I put the car keys?"], grammar: [g.futuro-anteriore], vocab: [] }
      - { es: "Sarà già arrivata a Verona: è partita alle otto.", en: "She must already have arrived in Verona: she left at eight.", grammar: [g.futuro-anteriore], vocab: [] }
      - { es: "Dopo che avrai letto il rapporto, dimmi che cosa ne pensi.", en: "After you've read the report, tell me what you think.", grammar: [g.futuro-anteriore], vocab: [w.dopo-che, w.rapporto] }
      - { es: "Finché non avrò finito questo progetto, non andrò in vacanza.", en: "Until I've finished this project, I won't go on holiday.", grammar: [g.futuro-anteriore], vocab: [w.finché] }
      - { es: "Nel momento in cui avranno aperto la nuova fabbrica, assumeranno trenta persone.", en: "As soon as they've opened the new factory, they'll take on thirty people.", grammar: [g.futuro-anteriore], vocab: [w.nel-momento-in-cui, w.fabbrica] }
      - { es: "In dieci anni questa impresa avrà prodotto più di un milione di automobili.", en: "In ten years this company will have produced more than a million cars.", grammar: [g.futuro-anteriore], vocab: [w.impresa, w.automobile, w.produrre] }
      - { es: "È contenta: avrà avuto un buon risultato all'esame.", en: "She's happy: she must have got a good result in the exam.", grammar: [g.futuro-anteriore], vocab: [w.risultato] }
      - { es: "Finisci e poi chiamami.", en: "Finish and then call me.", grammar: [g.futuro-anteriore], vocab: [], transform: { instruction: "Rephrase with quando + futuro anteriore", answer: "Quando avrai finito, chiamami.", alt: ["Chiamami quando avrai finito."], en: "Call me when you've finished." } }
      - { es: "Forse hanno perso il treno.", en: "Maybe they've missed the train.", grammar: [g.futuro-anteriore], vocab: [], transform: { instruction: "Make the guess with the futuro anteriore", answer: "Avranno perso il treno.", alt: [], en: "They must have missed the train." } }
      - { es: "L'industria del design va forte: a quest'ora, alla fiera, saranno già arrivati tanti visitatori.", en: "The design industry is booming: by now lots of visitors will already have arrived at the fair.", grammar: [g.futuro-anteriore], vocab: [w.industria, w.design, w.fiera] }
    exchanges:
      - q: { es: "Quando mi mandi la presentazione?", en: "When will you send me the presentation?" }
        a: { es: "Te la mando appena l'avrò finita.", en: "I'll send it to you as soon as I've finished it." }
        alt: ["Appena l'avrò finita.", "Stasera, quando l'avrò finita."]
        grammar: [g.futuro-anteriore, g.combined-pronouns]
        vocab: []
      - q: { es: "Perché Luca non è ancora arrivato?", en: "Why hasn't Luca arrived yet?" }
        a: { es: "Avrà perso l'autobus, come sempre.", en: "He must have missed the bus, as usual." }
        alt: ["Si sarà svegliato tardi.", "Avrà trovato traffico."]
        grammar: [g.futuro-anteriore]
        vocab: []
      - q: { es: "Dov'è finito il mio ombrello?", en: "Where has my umbrella got to?" }
        a: { es: "L'avrai lasciato al bar.", en: "You must have left it at the bar." }
        alt: ["Sarà in macchina.", "L'avrà preso tua sorella."]
        grammar: [g.futuro-anteriore]
        vocab: []
      - q: { es: "Quando parti per Verona?", en: "When are you leaving for Verona?" }
        a: { es: "Una volta che avrò finito gli esami, a luglio.", en: "Once I've finished my exams, in July." }
        alt: ["Appena avrò finito gli esami.", "A luglio."]
        grammar: [g.futuro-anteriore]
        vocab: [w.una-volta-che]
      - q: { es: "A che ora finisce l'opera?", en: "What time does the opera finish?" }
        a: { es: "Non lo so, ma a mezzanotte sarà finita, spero.", en: "I don't know, but it'll have finished by midnight, I hope." }
        alt: ["Verso mezzanotte.", "Tardi, credo."]
        grammar: [g.futuro-anteriore]
        vocab: []
    texts:
      - title: "Programma per la fiera"
        es: ["Entro venerdì avremo preparato tutto lo spazio.", "Non appena la fiera avrà aperto, presenteremo il nuovo prodotto.", "Una volta che avremo raccolto i contatti, li manderemo all'ufficio."]
        en: ["By Friday we'll have got the whole space ready.", "As soon as the fair has opened, we'll present the new product.", "Once we've collected the contacts, we'll send them to the office."]
        grammar: [g.futuro-anteriore]
        vocab: [w.fiera, w.non-appena, w.prodotto, w.una-volta-che]
    spicy:
      - { es: "Quando avrai finito di guardarmi così, potremo ordinare?", en: "When you've finished looking at me like that, can we order?", grammar: [g.futuro-anteriore], vocab: [] }
      - { es: "Non mi ha ancora scritto: avrà perso il mio numero, o sarà timido.", en: "He still hasn't texted me: he must have lost my number, or he's shy.", grammar: [g.futuro-anteriore], vocab: [] }
      - { es: "Appena avrò finito questo caffè, ti chiederò il numero.", en: "As soon as I've finished this coffee, I'll ask for your number.", grammar: [g.futuro-anteriore], vocab: [w.non-appena] }
      - { es: "Alle dieci avremo visto l'opera, alle undici avremo bevuto un bicchiere e a mezzanotte... vedremo.", en: "By ten we'll have seen the opera, by eleven we'll have had a drink and at midnight... we'll see.", grammar: [g.futuro-anteriore], vocab: [] }
  - id: b1.u04.l4
    title: Dopo aver visto l'Arena
    teach: [g.past-infinitive]
    vocab: [w.prima-di, w.dopo.prep, w.bruciare, w.scoppiare, w.dividere, w.origine, w.difficilmente, w.comprensibile, w.filo, w.causa, w.conseguenza, w.avvenire, w.arrosto]
    tip: "Same subject? prima di + infinitive (prima di uscire) and dopo + past infinitive (dopo aver mangiato, dopo essere arrivata)."
    sentences:
      - { es: "Dopo aver visto l'Arena, siamo andati alla Casa di Giulietta.", en: "After seeing the Arena, we went to Juliet's House.", altEs: ["Dopo avere visto l'Arena, siamo andati alla Casa di Giulietta."], grammar: [g.past-infinitive], vocab: [w.dopo.prep] }
      - { es: "Prima di partire, controlla il passaporto.", en: "Before leaving, check your passport.", grammar: [g.past-infinitive], vocab: [w.prima-di] }
      - { es: "Dopo essere arrivata a Verona, Anna mi ha chiamato.", en: "After arriving in Verona, Anna called me.", grammar: [g.past-infinitive], vocab: [w.dopo.prep] }
      - { es: "Grazie per averci accompagnato fino al balcone di Giulietta.", en: "Thank you for taking us all the way to Juliet's balcony.", altEs: ["Grazie di averci accompagnato fino al balcone di Giulietta."], grammar: [g.past-infinitive], vocab: [] }
      - { es: "Prima di entrare nell'Arena, abbiamo diviso i panini.", en: "Before going into the Arena, we shared out the sandwiches.", grammar: [g.past-infinitive], vocab: [w.prima-di, w.dividere] }
      - { es: "Dopo aver mangiato, siamo andati a fare una passeggiata.", en: "After eating, we went for a walk.", altEs: ["Dopo avere mangiato, siamo andati a fare una passeggiata."], grammar: [g.past-infinitive], vocab: [w.dopo.prep], error: { wrong: "Dopo mangiare, siamo andati a fare una passeggiata.", explain: "dopo needs the past infinitive: dopo aver mangiato.", grammar: g.past-infinitive } }
      - { es: "Sono contento di averti conosciuto.", en: "I'm glad to have met you.", altEs: ["Sono contenta di averti conosciuto."], altEn: ["I'm glad I met you."], grammar: [g.past-infinitive], vocab: [] }
      - { es: "Dopo aver bruciato l'arrosto, abbiamo ordinato una pizza.", en: "After burning the roast, we ordered a pizza.", grammar: [g.past-infinitive], vocab: [w.bruciare, w.arrosto] }
      - { es: "Prima di visitare la casa, ho letto qualcosa sull'origine della storia di Romeo e Giulietta.", en: "Before visiting the house, I read something about the origin of the story of Romeo and Juliet.", grammar: [g.past-infinitive], vocab: [w.origine] }
      - { es: "Dopo aver saputo la notizia, è scoppiata a piangere.", en: "After hearing the news, she burst into tears.", grammar: [g.past-infinitive], vocab: [w.scoppiare] }
      - { es: "Senza aver prenotato, difficilmente troverete un tavolo in centro.", en: "Without having booked, you'll hardly find a table in the centre.", grammar: [g.past-infinitive], vocab: [w.difficilmente] }
      - { es: "Dopo aver sentito la sua spiegazione, la sua reazione mi è sembrata comprensibile.", en: "After hearing his explanation, his reaction seemed understandable to me.", grammar: [g.past-infinitive], vocab: [w.comprensibile] }
      - { es: "Ho perso il filo del discorso dopo aver bevuto il terzo bicchiere.", en: "I lost the thread of the conversation after drinking the third glass.", grammar: [g.past-infinitive], vocab: [w.filo] }
      - { es: "La causa dell'incendio? Prima di uscire, qualcuno aveva lasciato il forno acceso.", en: "The cause of the fire? Before going out, someone had left the oven on.", grammar: [g.past-infinitive, g.trapassato-prossimo], vocab: [w.causa] }
      - { es: "Ho mangiato. Poi sono uscito.", en: "I ate. Then I went out.", grammar: [g.past-infinitive], vocab: [], transform: { instruction: "Join them with dopo + past infinitive", answer: "Dopo aver mangiato, sono uscito.", alt: ["Dopo avere mangiato, sono uscito.", "Sono uscito dopo aver mangiato."], en: "After eating, I went out." } }
      - { es: "Dopo aver perso il treno, abbiamo pagato le conseguenze: un taxi carissimo.", en: "After missing the train, we paid the price: a very expensive taxi.", grammar: [g.past-infinitive], vocab: [w.conseguenza], transform: { instruction: "Change the subject to io", answer: "Dopo aver perso il treno, ho pagato le conseguenze: un taxi carissimo.", alt: ["Dopo avere perso il treno, ho pagato le conseguenze: un taxi carissimo."], en: "After missing the train, I paid the price: a very expensive taxi." } }
    exchanges:
      - q: { es: "Che cosa avete fatto dopo aver visto l'Arena?", en: "What did you do after seeing the Arena?" }
        a: { es: "Siamo andati a mangiare in Piazza delle Erbe.", en: "We went to eat in Piazza delle Erbe." }
        alt: ["Dopo aver visto l'Arena, siamo andati a mangiare.", "Siamo andati alla Casa di Giulietta."]
        grammar: [g.past-infinitive]
        vocab: []
      - q: { es: "Quando hai deciso di trasferirti?", en: "When did you decide to move?" }
        a: { es: "Dopo aver visitato Verona per la prima volta.", en: "After visiting Verona for the first time." }
        alt: ["Dopo aver trovato lavoro.", "Subito dopo la laurea."]
        grammar: [g.past-infinitive]
        vocab: [w.dopo.prep]
      - q: { es: "Posso uscire?", en: "Can I go out?" }
        a: { es: "Sì, ma prima di uscire, spegni la luce.", en: "Yes, but before you go out, switch off the light." }
        alt: ["Sì, ma prima di uscire, chiudi la finestra.", "Certo."]
        grammar: [g.past-infinitive]
        vocab: [w.prima-di]
      - q: { es: "Perché sei così stanco?", en: "Why are you so tired?" }
        a: { es: "Dopo essere tornato dalla fiera, ho lavorato fino a mezzanotte.", en: "After getting back from the fair, I worked until midnight." }
        alt: ["Ho dormito poco.", "Ho lavorato tutto il giorno."]
        grammar: [g.past-infinitive]
        vocab: [w.fiera]
      - q: { es: "Grazie di avermi aiutato!", en: "Thanks for helping me!" }
        a: { es: "Figurati, è stato un piacere.", en: "Don't mention it, it was a pleasure." }
        alt: ["Di niente!", "Figurati!"]
        grammar: [g.past-infinitive]
        vocab: [w.figurarsi]
    texts:
      - title: "Lettera alla Casa di Giulietta"
        es: ["Cara Giulietta, dopo aver visto il tuo balcone, ho deciso di scriverti.", "Prima di partire da Verona, vorrei un consiglio.", "Come si fa a dividere un cuore tra due città?"]
        en: ["Dear Juliet, after seeing your balcony, I decided to write to you.", "Before leaving Verona, I'd like some advice.", "How do you divide a heart between two cities?"]
        grammar: [g.past-infinitive]
        vocab: [w.dopo.prep, w.prima-di, w.dividere]
      - title: "Notizia locale"
        es: ["Il furto è avvenuto ieri notte, dopo la chiusura del museo.", "Dopo essere entrati da una finestra, i ladri hanno preso due quadri.", "Le conseguenze per il museo sono gravi."]
        en: ["The theft took place last night, after the museum had closed.", "After getting in through a window, the thieves took two paintings.", "The consequences for the museum are serious."]
        grammar: [g.past-infinitive]
        vocab: [w.avvenire, w.conseguenza]
    spicy:
      - { es: "Dopo aver visto il balcone di Giulietta, mi è venuta voglia di cantare sotto la tua finestra.", en: "After seeing Juliet's balcony, I felt like singing under your window.", grammar: [g.past-infinitive], vocab: [w.dopo.prep] }
      - { es: "Prima di baciarmi, togliti quegli occhiali da sole: voglio vederti gli occhi.", en: "Before you kiss me, take off those sunglasses: I want to see your eyes.", grammar: [g.past-infinitive], vocab: [w.prima-di, w.togliere] }
      - { es: "Sono contenta di averti conosciuto, e ancora più contenta di averti rivisto.", en: "I'm glad I met you, and even gladder I saw you again.", grammar: [g.past-infinitive], vocab: [] }
      - { es: "Dopo aver diviso una pizza con te, non riesco più a mangiare da sola.", en: "After sharing a pizza with you, I can't eat alone any more.", grammar: [g.past-infinitive], vocab: [w.dividere] }
dialogues:
  - id: b1.u04.d1
    title: In questura a Verona
    context: Anna has just arrived in Verona by train and has gone to the police to report a stolen wallet.
    lines:
      - { speaker: Agente, es: "Buongiorno, si accomodi. Che cosa è successo?", en: "Good morning, have a seat. What happened?" }
      - { speaker: Anna, es: "Mi hanno rubato il portafoglio. Me ne sono accorta dopo essere scesa dal treno.", en: "My wallet has been stolen. I noticed after getting off the train." }
      - { speaker: Agente, es: "Si ricorda dove l'aveva messo?", en: "Do you remember where you had put it?" }
      - { speaker: Anna, es: "Nella borsa. Prima di partire da Milano l'avevo controllato: c'era.", en: "In my bag. Before leaving Milan I had checked it: it was there." }
      - { speaker: Agente, es: "Il treno era affollato?", en: "Was the train crowded?" }
      - { speaker: Anna, es: "Sì, pieno. A un certo punto un ragazzo mi era caduto addosso... Ecco, forse era un borseggiatore!", en: "Yes, packed. At one point a young man had fallen against me... That's it, maybe he was a pickpocket!" }
      - { speaker: Agente, es: "È probabile. Ha visto la sua faccia?", en: "That's likely. Did you see his face?" }
      - { speaker: Anna, es: "No, quando ho capito, era già sceso.", en: "No, by the time I realised, he had already got off." }
      - { speaker: Agente, es: "Va bene, facciamo la denuncia. Quando avrà compilato il modulo, lo firmi qui.", en: "All right, let's file the report. When you've filled in the form, sign it here." }
      - { speaker: Anna, es: "E se ritrovano il portafoglio?", en: "And if they find the wallet?" }
      - { speaker: Agente, es: "La chiamiamo noi. A volte i ladri buttano i portafogli dopo aver preso i soldi.", en: "We'll call you. Sometimes thieves throw wallets away after taking the money." }
    questions:
      - { q: "Quando si è accorta Anna del furto?", options: ["Prima di partire da Milano", "Dopo essere scesa dal treno", "In albergo"], answer: 1, explain: "Me ne sono accorta dopo essere scesa dal treno." }
      - { q: "Com'era il treno?", options: ["Vuoto", "In ritardo", "Molto affollato"], answer: 2, explain: "Il treno era affollato? — Sì, pieno." }
      - { q: "Che cosa deve fare Anna dopo aver compilato il modulo?", options: ["Firmarlo", "Chiamare la banca", "Tornare a Milano"], answer: 0, explain: "Quando avrà compilato il modulo, lo firmi qui." }
      - { q: "Secondo l'agente, che cosa fanno a volte i ladri?", options: ["Riportano i soldi", "Buttano i portafogli", "Vanno in questura"], answer: 1, explain: "A volte i ladri buttano i portafogli dopo aver preso i soldi." }
writing:
  - task: "Tell what went wrong when you arrived at Verona station: use the trapassato prossimo for what had already happened (il treno era già partito, avevo letto male…)."
    min: 50
    max: 100
    use: [w.imprevisto, w.annullare, w.ormai, w.nel-frattempo, w.rimandare]
    grammar: [g.trapassato-prossimo]
    expect:
      - { pattern: "\\b(avevo|avevi|aveva|avevamo|avevate|avevano|ero|eri|era|eravamo|eravate|erano)\\s+(\\S+\\s+)?\\S+(at|ut|it|ss|tt|st|s)[oaie]\\b", hint: "Use the trapassato prossimo: era già partito, avevo letto…" }
    model: { es: "Ieri è stata una giornata piena di imprevisti. Quando sono arrivato alla stazione di Verona, il treno per Venezia era già partito: avevo letto male l'orario! Il treno successivo era stato annullato per uno sciopero, quindi ho aspettato due ore in sala d'attesa. Ormai era troppo tardi per l'appuntamento con il mio cliente, che nel frattempo mi aveva mandato tre messaggi. Alla fine l'abbiamo rimandato a lunedì.", en: "Yesterday was a day full of setbacks. When I got to Verona station, the train to Venice had already left: I had misread the timetable! The next train had been cancelled because of a strike, so I waited two hours in the waiting room. By then it was too late for my appointment with my client, who in the meantime had sent me three messages. In the end we put it off until Monday." }
  - task: "You were robbed in Verona. Write what you say at the police station: what you had done before and when you noticed the theft (trapassato prossimo)."
    min: 50
    max: 100
    use: [w.furto, w.denunciare, w.rubare, w.borseggiatore, w.accorgersi]
    grammar: [g.trapassato-prossimo]
    expect:
      - { pattern: "\\b(avevo|aveva|avevamo|avevano|ero|era|eravamo|erano)\\s+(\\S+\\s+)?\\S+(at|ut|it|ss|tt|st|s)[oaie]\\b|\\bci eravamo\\s+\\S+", hint: "Use the trapassato prossimo: avevamo visitato, qualcuno mi aveva rubato…" }
      - { pattern: "\\b(rubat|furto|borseggiator)\\w*", hint: "Say what was stolen: mi hanno rubato…, un furto." }
    model: { es: "Buongiorno, vorrei denunciare un furto. Questa mattina ero in Piazza Bra con mia sorella. Avevamo appena visitato l'Arena e ci eravamo fermati a prendere un caffè. Quando sono andato a pagare, mi sono accorto che qualcuno mi aveva rubato il portafoglio dallo zaino. Probabilmente un borseggiatore mi aveva seguito tra la gente. Nel portafoglio c'erano la carta d'identità e cento euro.", en: "Good morning, I'd like to report a theft. This morning I was in Piazza Bra with my sister. We had just visited the Arena and had stopped for a coffee. When I went to pay, I realised that someone had stolen my wallet from my rucksack. A pickpocket had probably followed me through the crowd. In the wallet there were my ID card and a hundred euros." }
  - task: "Write about your plans for the coming months: what you will do once certain things have happened. Use the futuro anteriore (quando avrò finito, non appena sarò tornato…)."
    min: 50
    max: 100
    use: [w.scadenza, w.non-appena, w.dopo-che, w.una-volta-che, w.progetto]
    grammar: [g.futuro-anteriore]
    expect:
      - { pattern: "\\b(avrò|avrai|avrà|avremo|avrete|avranno|sarò|sarai|sarà|saremo|sarete|saranno)\\s+(\\S+\\s+)?\\S+(at|ut|it|ss|tt|st|s)[oaie]\\b", hint: "Use the futuro anteriore: avrò finito, sarò tornato…" }
    model: { es: "Questo mese è pieno di scadenze, ma ho un piano. Non appena avrò consegnato il progetto, prenderò qualche giorno di ferie. Una volta che avrò finito tutto, andrò a Verona per vedere un'opera all'Arena. Dopo che sarò tornato a casa, comincerò un corso di design. E spero che entro dicembre avrò trovato anche un lavoro nuovo!", en: "This month is full of deadlines, but I have a plan. As soon as I've handed in the project, I'll take a few days off. Once I've finished everything, I'll go to Verona to see an opera at the Arena. After I've come home, I'll start a design course. And I hope that by December I'll have found a new job too!" }
  - task: "Write a travel diary entry about a day in Verona, linking the actions with prima di + infinitive and dopo aver / dopo essere + participle."
    min: 50
    max: 100
    use: [w.prima-di, w.dopo.prep, w.cortile, w.balcone, w.fila]
    grammar: [g.past-infinitive]
    expect:
      - { pattern: "\\bdopo (aver|avere|esser|essere)\\s+\\S+", hint: "Link actions with dopo aver / dopo essere: dopo aver visto…" }
      - { pattern: "\\bprima di\\s+\\S+", hint: "Use prima di + infinitive: prima di entrare…" }
    model: { es: "Stamattina, dopo aver fatto colazione in albergo, sono andata a vedere l'Arena. Dopo essere uscita, ho camminato fino alla casa di Giulietta. Prima di entrare nel cortile ho dovuto fare una lunga fila, ma per fortuna è stata veloce. Dopo aver fatto qualche foto sotto il famoso balcone, ho pranzato in Piazza delle Erbe. Prima di tornare in albergo ho comprato un regalo per mia madre.", en: "This morning, after having breakfast at the hotel, I went to see the Arena. After coming out, I walked to Juliet's house. Before going into the courtyard I had to queue for a long time, but luckily it moved quickly. After taking a few photos under the famous balcony, I had lunch in Piazza delle Erbe. Before going back to the hotel I bought a present for my mother." }
