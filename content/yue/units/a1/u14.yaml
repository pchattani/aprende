id: a1.u14
title: 你好、唔該、多謝
lessons:
  - id: a1.u14.l1
    title: 你好！
    teach: [g.greetings]
    skills: [listen, speak, read]
    tip: "你好 nei5 hou2 means 'hello' (literally 'you good'). Both syllables rise: tone 5 rises a little, tone 2 rises a lot. Add 呀 aa3 for a friendlier 'hi there': 你好呀！"
    vocab: [w.nei5-hou2, w.nei5, w.ngo5, w.hou2, w.nei5-hou2-maa3, w.ne1]
    sentences:
      - { es: "你好！", en: "Hello!", altEn: ["Hi!"], grammar: [g.greetings], vocab: [w.nei5-hou2] }
      - { es: "你好呀！", en: "Hi there!", altEn: ["Hello!", "Hi!"], grammar: [g.greetings], vocab: [w.nei5-hou2] }
      - { es: "你好，Leo！", en: "Hello, Leo!", altEn: ["Hi, Leo!"], grammar: [g.greetings], vocab: [w.nei5-hou2] }
      - { es: "你好，Bonchita！", en: "Hello, Bonchita!", altEn: ["Hi, Bonchita!"], grammar: [g.greetings], vocab: [w.nei5-hou2] }
      - { es: "Luna，你好呀！", en: "Hi there, Luna!", altEn: ["Hello, Luna!", "Hi, Luna!"], grammar: [g.greetings], vocab: [w.nei5-hou2] }
      - { es: "你好嗎？", en: "How are you?", grammar: [g.greetings], vocab: [w.nei5-hou2-maa3] }
      - { es: "我好好。", en: "I'm very well.", altEn: ["I'm very good.", "I'm fine."], grammar: [g.greetings], vocab: [w.ngo5, w.hou2] }
      - { es: "我好好，你呢？", en: "I'm very well, and you?", altEn: ["I'm fine, and you?", "I'm very well. And you?"], grammar: [g.greetings, g.ne-follow-up], vocab: [w.ngo5, w.nei5, w.ne1] }
      - { es: "你好嗎，Leo？", en: "How are you, Leo?", grammar: [g.greetings], vocab: [w.nei5-hou2-maa3] }
    exchanges:
      - q: { es: "你好！", en: "Hello!" }
        a: { es: "你好呀！", en: "Hi there!" }
        alt: ["你好！"]
        grammar: [g.greetings]
        vocab: [w.nei5-hou2]
      - q: { es: "你好嗎？", en: "How are you?" }
        a: { es: "我好好。", en: "I'm very well." }
        alt: ["好好。", "我好好，你呢？"]
        grammar: [g.greetings]
        vocab: [w.hou2]
      - q: { es: "你好，Luna！", en: "Hello, Luna!" }
        a: { es: "你好，Leo！", en: "Hello, Leo!" }
        alt: ["你好！", "你好呀！"]
        grammar: [g.greetings]
        vocab: [w.nei5-hou2]
    texts:
      - title: "你好！"
        es: ["你好，Leo！", "你好嗎？", "我好好，你呢？"]
        en: ["Hello, Leo!", "How are you?", "I'm very well, and you?"]
        grammar: [g.greetings]
        vocab: [w.nei5-hou2]
  - id: a1.u14.l2
    title: 唔該！
    teach: [g.mgoi-doze]
    skills: [listen, speak, read]
    tip: "唔該 m4 goi1 is the magic word: 'please', 'excuse me', and 'thanks' when someone does something for you (a waiter, a driver, someone holding the door). The reply is 唔使唔該: 'no need to thank me'."
    vocab: [w.m4-goi1, w.m4-goi1-saai3, w.m4-sai2-m4-goi1, w.ze3-ze3, w.go3]
    sentences:
      - { es: "唔該！", en: "Excuse me!", altEn: ["Please!", "Thanks!", "Thank you!"], grammar: [g.mgoi-doze], vocab: [w.m4-goi1] }
      - { es: "唔該你。", en: "Thank you.", altEn: ["Thanks."], grammar: [g.mgoi-doze], vocab: [w.m4-goi1] }
      - { es: "唔該晒！", en: "Thanks a lot!", altEn: ["Thank you so much!", "Thanks so much!"], grammar: [g.mgoi-doze], vocab: [w.m4-goi1-saai3] }
      - { es: "唔該，一個。", en: "One, please.", grammar: [g.mgoi-doze, g.classifiers-intro], vocab: [w.m4-goi1, w.go3] }
      - { es: "三個，唔該。", en: "Three, please.", grammar: [g.mgoi-doze, g.classifiers-intro], vocab: [w.m4-goi1, w.go3] }
      - { es: "唔該，借借。", en: "Excuse me, coming through.", altEn: ["Excuse me, let me through."], grammar: [g.mgoi-doze], vocab: [w.m4-goi1, w.ze3-ze3] }
      - { es: "唔使唔該。", en: "You're welcome.", altEn: ["No problem.", "No need to thank me."], grammar: [g.mgoi-doze], vocab: [w.m4-sai2-m4-goi1] }
      - { es: "唔該，Leo！", en: "Thanks, Leo!", altEn: ["Thank you, Leo!"], grammar: [g.mgoi-doze], vocab: [w.m4-goi1] }
      - { es: "唔該晒，Luna！", en: "Thanks so much, Luna!", altEn: ["Thanks a lot, Luna!", "Thank you so much, Luna!"], grammar: [g.mgoi-doze], vocab: [w.m4-goi1-saai3] }
      - { es: "五個，唔該。", en: "Five, please.", grammar: [g.mgoi-doze, g.classifiers-intro], vocab: [w.go3] }
    exchanges:
      - q: { es: "唔該！", en: "Thanks!" }
        a: { es: "唔使唔該。", en: "You're welcome." }
        alt: ["唔使唔該！"]
        grammar: [g.mgoi-doze]
        vocab: [w.m4-sai2-m4-goi1]
      - q: { es: "唔該晒！", en: "Thanks a lot!" }
        a: { es: "唔使唔該！", en: "No problem!" }
        alt: ["唔使唔該。"]
        grammar: [g.mgoi-doze]
        vocab: [w.m4-goi1-saai3]
      - q: { es: "幾多個呀？", en: "How many?" }
        a: { es: "三個，唔該。", en: "Three, please." }
        alt: ["一個，唔該。", "兩個，唔該。"]
        grammar: [g.mgoi-doze, g.classifiers-intro]
        vocab: [w.go3]
    texts:
      - title: "借借"
        es: ["唔該，借借。", "唔該晒！", "唔使唔該。"]
        en: ["Excuse me, coming through.", "Thanks so much!", "You're welcome."]
        grammar: [g.mgoi-doze]
        vocab: [w.ze3-ze3]
  - id: a1.u14.l3
    title: 多謝！
    teach: [g.mgoi-doze]
    skills: [listen, speak, read]
    tip: "多謝 do1 ze6 is 'thank you' for a gift, a compliment or a kind word. For a service (a waiter, a driver), say 唔該. The reply to 多謝 is 唔使客氣: 'you're welcome'. 都 dou1 means 'too, also' and goes before the verb or adjective: 我都好好 'I'm very well too'."
    vocab: [w.do1-ze6, w.do1-ze6-saai3, w.m4-sai2-haak3-hei3, w.dou1]
    sentences:
      - { es: "多謝！", en: "Thanks!", altEn: ["Thank you!"], grammar: [g.mgoi-doze], vocab: [w.do1-ze6] }
      - { es: "多謝你！", en: "Thank you!", altEn: ["Thanks!"], grammar: [g.mgoi-doze], vocab: [w.do1-ze6] }
      - { es: "多謝晒！", en: "Thank you very much!", altEn: ["Thanks so much!", "Thank you so much!"], grammar: [g.mgoi-doze], vocab: [w.do1-ze6-saai3] }
      - { es: "唔使客氣。", en: "You're welcome.", altEn: ["Don't mention it."], grammar: [g.mgoi-doze], vocab: [w.m4-sai2-haak3-hei3] }
      - { es: "多謝你，Bonchita！", en: "Thank you, Bonchita!", altEn: ["Thanks, Bonchita!"], grammar: [g.mgoi-doze], vocab: [w.do1-ze6] }
      - { es: "多謝晒，Leo！", en: "Thanks so much, Leo!", altEn: ["Thank you very much, Leo!"], grammar: [g.mgoi-doze], vocab: [w.do1-ze6-saai3] }
      - { es: "好好，多謝。", en: "Very well, thanks.", altEn: ["Very well, thank you."], grammar: [g.mgoi-doze, g.greetings], vocab: [w.hou2, w.do1-ze6] }
      - { es: "多謝，我好好。", en: "Thanks, I'm very well.", altEn: ["Thank you, I'm very well.", "Thanks, I'm fine."], grammar: [g.mgoi-doze, g.greetings], vocab: [w.do1-ze6, w.ngo5] }
      - { es: "唔使客氣，Luna。", en: "You're welcome, Luna.", altEn: ["Don't mention it, Luna."], grammar: [g.mgoi-doze], vocab: [w.m4-sai2-haak3-hei3] }
      - { es: "我都好好。", en: "I'm very well too.", altEn: ["I'm fine too.", "I'm good too."], grammar: [g.greetings, g.dou-also], vocab: [w.ngo5, w.dou1] }
      - { es: "多謝，我都好好。", en: "Thanks, I'm very well too.", altEn: ["Thank you, I'm fine too."], grammar: [g.greetings, g.dou-also, g.mgoi-doze], vocab: [w.do1-ze6, w.dou1] }
    exchanges:
      - q: { es: "多謝！", en: "Thank you!" }
        a: { es: "唔使客氣。", en: "You're welcome." }
        alt: ["唔使客氣！"]
        grammar: [g.mgoi-doze]
        vocab: [w.m4-sai2-haak3-hei3]
      - q: { es: "你好嗎？", en: "How are you?" }
        a: { es: "好好，多謝。", en: "Very well, thanks." }
        alt: ["我好好，多謝。", "多謝，我好好。"]
        grammar: [g.mgoi-doze, g.greetings]
        vocab: [w.do1-ze6]
      - q: { es: "唔該晒！", en: "Thanks a lot!" }
        a: { es: "唔使唔該。", en: "You're welcome." }
        alt: ["唔使唔該！"]
        grammar: [g.mgoi-doze]
        vocab: [w.m4-sai2-m4-goi1]
      - q: { es: "我好好，你呢？", en: "I'm very well, and you?" }
        a: { es: "我都好好。", en: "I'm very well too." }
        alt: ["我都好好，多謝。", "好好，多謝。"]
        grammar: [g.greetings, g.ne-follow-up, g.dou-also]
        vocab: [w.dou1]
    texts:
      - title: "多謝你！"
        es: ["多謝你，Leo！", "唔使客氣，Luna！"]
        en: ["Thank you, Leo!", "You're welcome, Luna!"]
        grammar: [g.mgoi-doze]
        vocab: [w.do1-ze6, w.m4-sai2-haak3-hei3]
dialogues:
  - id: a1.u14.d1
    title: 你好！
    context: Luna meets Mr Chan, the friendly owner of a small shop, on her first morning in Hong Kong.
    lines:
      - { speaker: Luna, es: "你好！", en: "Hello!" }
      - { speaker: 陳生, es: "你好呀！你好嗎？", en: "Hi there! How are you?" }
      - { speaker: Luna, es: "我好好，多謝。你呢？", en: "I'm very well, thanks. And you?" }
      - { speaker: 陳生, es: "我都好好。", en: "I'm very well too." }
      - { speaker: Luna, es: "唔該，三個。", en: "Three, please." }
      - { speaker: 陳生, es: "好，三個。", en: "OK, three." }
      - { speaker: Luna, es: "唔該晒！", en: "Thanks so much!" }
      - { speaker: 陳生, es: "唔使唔該！", en: "You're welcome!" }
    questions:
      - { q: "How is Luna?", options: ["Very well", "So-so", "Tired"], answer: 0, explain: "She says 我好好: I'm very well." }
      - { q: "How many does Luna ask for?", options: ["One", "Three", "Five"], answer: 1, explain: "唔該，三個: three, please." }
      - { q: "Why does Luna say 唔該晒 and not 多謝 at the end?", options: ["Mr Chan gave her a present", "Mr Chan served her in his shop", "She is saying goodbye"], answer: 1, explain: "唔該 thanks someone for a service; 多謝 is for gifts and compliments." }
