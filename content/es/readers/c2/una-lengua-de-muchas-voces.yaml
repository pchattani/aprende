id: r.c2.una-lengua-de-muchas-voces
level: c2
title: Una lengua de muchas voces
kind: text
intro: An opinion essay on register and dialect in Spanish, written for this course. It argues that the twenty-odd varieties of the language are not errors to be corrected but the natural life of a tongue spoken by half a billion people.
allow: [madrid, sevilla, caribe, chile, méxico, mexicano, argentina, rioplatense, españa, américa, salamanca, valladolid, bolivia, buenos, aires, canarias, puerto, rico, rae]
paragraphs:
  - { es: "Hay una pregunta que todo estudiante de español se hace tarde o temprano: ¿qué español debo aprender? ¿El de Madrid o el de México? ¿El que dice «vosotros» o el que dice «ustedes»? La pregunta parece sencilla, mas la respuesta no lo es, porque supone que existe un español correcto y otros españoles que se le parecen más o menos.", en: "There is a question every student of Spanish asks sooner or later: which Spanish should I learn? The one from Madrid or the one from Mexico? The one that says 'vosotros' or the one that says 'ustedes'? The question seems simple, but the answer is not, because it assumes that there is one correct Spanish and other Spanishes that resemble it more or less." }
  - { es: "La realidad es otra. El español es una lengua hablada en más de veinte países por casi quinientos millones de personas, y en cada uno de esos países tiene su propia gramática, su propio acento y sus propias palabras. Un chileno dice «al tiro» donde un madrileño dice «ahora mismo»; una argentina dice «vos tenés» donde una sevillana dice «tú tienes»; un mexicano dice que la tienda «abre hasta las diez» y quiere decir que no abre antes de esa hora. Ninguno de los tres habla mal. Los tres hablan su variedad.", en: "The reality is different. Spanish is a language spoken in more than twenty countries by almost five hundred million people, and in each of those countries it has its own grammar, its own accent and its own words. A Chilean says 'al tiro' where a Madrid speaker says 'ahora mismo'; an Argentinian woman says 'vos tenés' where a Sevillian says 'tú tienes'; a Mexican says the shop 'opens until ten' and means that it does not open before that time. None of the three speaks badly. All three speak their variety." }
  - { es: "A la variedad geográfica se suma la social. Dentro de una misma ciudad, un médico no habla igual en el hospital que en el bar, y un chaval de dieciséis años no habla igual con sus amigos que con su abuela. Decimos «fallecer» en un periódico, «morir» en casa y «palmar» entre colegas, y las tres palabras significan lo mismo. Saber cambiar de registro no es hablar peor ni mejor: es la prueba de que dominamos la lengua.", en: "To geographical variety is added social variety. Within the same city, a doctor does not speak the same way in the hospital as in the bar, and a sixteen-year-old does not speak the same way with his friends as with his grandmother. We say 'fallecer' in a newspaper, 'morir' at home and 'palmar' among mates, and the three words mean the same thing. Knowing how to switch register is not speaking worse or better: it is the proof that we have mastered the language." }
  - { es: "¿Por qué, entonces, algunas formas tienen prestigio y otras no? Por razones históricas, no lingüísticas. El castellano de Valladolid se considera «neutro» porque la corte y la Academia estuvieron durante siglos en el centro de España. El acento andaluz, en cambio, se asocia con el humor y con lo popular, aunque Sevilla fuera durante el Siglo de Oro la ciudad más rica del mundo hispánico. El laísmo madrileño («la dije») está estigmatizado, pero el leísmo («le vi») se acepta. La lengua no decide estas cosas; las decide la sociedad.", en: "Why, then, do some forms have prestige and others not? For historical, not linguistic, reasons. The Castilian of Valladolid is considered 'neutral' because the court and the Academy were for centuries in the centre of Spain. The Andalusian accent, on the other hand, is associated with humour and with the popular, even though Seville was, during the Golden Age, the richest city in the Hispanic world. Madrid laísmo ('la dije') is stigmatised, but leísmo ('le vi') is accepted. The language does not decide these things; society does." }
  - { es: "Conviene recordar, además, que todas las variedades son hijas del mismo cambio. El latín «facere» se convirtió en «hacer»; «vuestra merced» se acortó hasta ser «usted»; el «vos» que hoy suena arcaico en España vive con toda normalidad en Buenos Aires. Lo que hoy es dialecto fue ayer norma, y lo que hoy es norma será mañana historia. Una lengua que no cambia es una lengua que nadie habla.", en: "It is also worth remembering that all the varieties are daughters of the same change. Latin 'facere' became 'hacer'; 'vuestra merced' was shortened until it was 'usted'; the 'vos' that today sounds archaic in Spain lives quite normally in Buenos Aires. What today is dialect was yesterday the norm, and what today is the norm will tomorrow be history. A language that does not change is a language that nobody speaks." }
  - { es: "Entonces, ¿qué español aprender? Mi respuesta es sencilla: el que vayas a usar. Si vives en Madrid, aprende el «vosotros»; si trabajas con clientes de México, aprende el «ahorita» y el «mande». Pero, sobre todo, aprende a escuchar. Un hablante culto no es el que habla como un libro, sino el que entiende a un taxista de La Habana, a una abogada de Bogotá y a un pescador de Canarias, y sabe responder a cada uno en el tono adecuado.", en: "So, which Spanish to learn? My answer is simple: the one you are going to use. If you live in Madrid, learn 'vosotros'; if you work with clients from Mexico, learn 'ahorita' and 'mande'. But above all, learn to listen. A cultured speaker is not the one who talks like a book, but the one who understands a taxi driver from Havana, a lawyer from Bogotá and a fisherman from the Canary Islands, and knows how to reply to each of them in the right tone." }
  - { es: "El español no es una lengua: es un coro. Y en un coro nadie canta mal por cantar con otra voz.", en: "Spanish is not a language: it is a choir. And in a choir nobody sings badly for singing with a different voice." }
questions:
  - { q: "According to the essay, what does the question 'which Spanish should I learn?' wrongly assume?", options: ["That Spanish is hard to pronounce", "That there is one correct Spanish and the others are imitations", "That Latin America has no grammar"], answer: 1 }
  - { q: "Why does the Castilian of Valladolid enjoy prestige, according to the author?", options: ["Because it is the oldest variety", "Because it has the simplest grammar", "For historical reasons: the court and the Academy were in central Spain"], answer: 2 }
  - { q: "What does the author say about 'fallecer', 'morir' and 'palmar'?", options: ["They mean the same thing in different registers", "Only 'morir' is correct", "They are regional variants"], answer: 0 }
  - { q: "What is the author's final advice?", options: ["Learn the Spanish of Madrid", "Learn the variety you will use, and above all learn to listen", "Avoid dialects"], answer: 1 }
