      - { es: "你咁醒目，應該知道我鍾意你。", en: "You're so sharp, you must know I like you.", altEs: ["你咁醒目，應該知我鍾意你。"], grammar: [g.adjective-predicates], vocab: [w.sing2-muk6, w.zi1-dou3] }
      - { es: "唔好怕醜，同我跳隻舞啦。", en: "Don't be shy, have a dance with me.", altEs: ["唔使怕醜，同我跳隻舞啦。"], grammar: [g.m-hou-dont, g.laa1-suggestion], vocab: [w.paa3-cau2, w.tiu3-mou5] }
      - { es: "一個人好寂寞，兩個人就啱啱好。", en: "One person is lonely; two is just right.", altEs: ["一個人好寂寞，兩個人就啱喇。"], grammar: [g.zau-then], vocab: [w.zik6-mok6] }
dialogues:
  - id: a2.u12.d1
    title: 星期一講週末
    context: Monday morning at the office. 嘉欣 and 志明 talk about what they did at the weekend.
    lines:
      - { speaker: 嘉欣, es: "早晨！你上個週末做咗啲咩呀？", en: "Morning! What did you do last weekend?" }
      - { speaker: 志明, es: "冇做乜，淨係喺屋企煲劇，煲到兩點先瞓。", en: "Nothing much, I just binge-watched at home until two before going to bed." }
      - { speaker: 嘉欣, es: "又煲劇？你成日都係咁。", en: "Binge-watching again? You're always like that." }
      - { speaker: 志明, es: "嗰套劇好好睇吖嘛。你呢？", en: "That series is really good, you see. What about you?" }
      - { speaker: 嘉欣, es: "我同Leo去咗九龍寨城公園。以前嗰度住咗好多人，而家變成咗一個好靚嘅公園。", en: "I went to Kowloon Walled City Park with Leo. Lots of people used to live there, and now it's a beautiful park." }
      - { speaker: 志明, es: "行完之後去咗邊呀？", en: "Where did you go after your walk?" }
      - { speaker: 嘉欣, es: "行完就去九龍城食泰國菜，食完先返屋企。", en: "After the walk we went for Thai food in Kowloon City, and went home after eating." }
      - { speaker: 志明, es: "好好玩喎！下次叫埋我啦。", en: "Sounds fun! Ask me along next time." }
      - { speaker: 嘉欣, es: "好吖，不過你唔好淨係顧住煲劇呀。", en: "Sure, but don't just think about your TV series." }
    questions:
      - { q: "志明上個週末做咗咩？", options: ["去咗公園", "淨係喺屋企煲劇", "返咗鄉下"], answer: 1, explain: "志明 says 淨係喺屋企煲劇." }
      - { q: "志明幾點先瞓？", options: ["十二點", "兩點", "十點"], answer: 1, explain: "煲到兩點先瞓: he didn't go to bed until two." }
      - { q: "嘉欣同Leo行完公園之後去咗邊？", options: ["九龍城食泰國菜", "廟街夜市", "返屋企煲劇"], answer: 0, explain: "行完就去九龍城食泰國菜." }
      - { q: "九龍寨城而家係咩地方？", options: ["一個公園", "一個機場", "一個街市"], answer: 0, explain: "嘉欣 says it has become 一個好靚嘅公園." }
