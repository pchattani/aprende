id: c2.u04
title: 佛山粵劇
lessons:
  - id: c2.u04.l1
    title: 萬福台上嘅大戲
    teach: [g.opera-language]
    vocab: [w.jyut6-kek6, w.daai6-hei3, w.hei3-baan1, w.hei3-toi4, w.hei3-paang4, w.san4-gung1-hei3, w.fat6-saan1, w.zou2-miu6, w.maan6-fuk1-toi4, w.king4-faa1-wui6-gun2, w.hung4-syun4, w.faa1-daan3, w.siu2-sang1, w.man4-mou5-sang1, w.cau2-sang1, w.mou5-sang1, w.lou5-gun1, w.ming4-ling4, w.ling4-jan4, w.hei3-mai4, w.ping4-hau4, w.zi2-hau4, w.gok3-sik1, w.fung6, w.mou5-toi4, w.ging1-kek6, w.hei3-fuk6]
    tip: "Older people call Cantonese opera 大戲 'the big show'. Every role has a name: 文武生 the male lead, 花旦 the female lead, 丑生 the clown; 老倌 is any star performer."
    sentences:
      - { es: "粵劇喺二零零九年列入人類非物質文化遺產。", en: "Cantonese opera was inscribed as Intangible Cultural Heritage of Humanity in 2009.", altEs: ["粵劇喺二零零九年成為人類非物質文化遺產。"], grammar: [g.opera-language], vocab: [w.jyut6-kek6] }
      - { es: "老一輩唔講粵劇，佢哋叫做「大戲」。", en: "The older generation don't say 'Cantonese opera'; they call it 'the big show'.", altEs: ["老一輩唔講「粵劇」，佢哋叫「大戲」。"], grammar: [g.opera-language], vocab: [w.daai6-hei3, w.jyut6-kek6] }
      - { es: "佛山祖廟嘅萬福台係一個好古老嘅戲台。", en: "The Wanfu Stage at Foshan's Ancestral Temple is a very old opera stage.", altEs: ["佛山祖廟個萬福台係一個好古老嘅戲台。"], grammar: [g.opera-language], vocab: [w.fat6-saan1, w.zou2-miu6, w.maan6-fuk1-toi4, w.hei3-toi4] }
      - { es: "以前啲戲班坐紅船，沿住珠江周圍去做戲。", en: "Opera troupes used to travel by red boat along the Pearl River to perform from place to place.", altEs: ["以前啲戲班坐紅船，沿住珠江四圍去做戲。"], grammar: [g.opera-language], vocab: [w.hei3-baan1, w.hung4-syun4] }
      - { es: "瓊花會館係以前佛山伶人嘅行會。", en: "The Qionghua Guild Hall was the old guild of Foshan's opera performers.", altEs: ["瓊花會館以前係佛山伶人嘅行會。"], grammar: [g.opera-language], vocab: [w.king4-faa1-wui6-gun2, w.ling4-jan4], jp: "king4 faa1 wui6 gun2 hai6 ji5 cin4 fat6 saan1 ling4 jan4 ge3 hong4 wui2" }
      - { es: "每年天后誕，村民都會搭戲棚做神功戲。", en: "Every year at Tin Hau's birthday, villagers put up a bamboo theatre and stage ritual opera.", altEs: ["每年天后誕，村民都搭戲棚做神功戲。"], grammar: [g.opera-language], vocab: [w.hei3-paang4, w.san4-gung1-hei3], transform: { instruction: "Put it in the past: when Grandpa was little (阿爺細個嗰陣), villagers did this every year", answer: "阿爺細個嗰陣，每年天后誕村民都會搭戲棚做神功戲。", alt: ["阿爺細個嗰陣，每年天后誕村民都搭戲棚做神功戲。"] } }
      - { es: "神功戲係做畀神睇嘅，不過觀眾都可以免費入場。", en: "Ritual opera is performed for the gods, but audiences can go in for free too.", altEs: ["神功戲係做畀神睇嘅，不過觀眾都可以免費入去睇。"], grammar: [g.opera-language, g.hai-ge-focus], vocab: [w.san4-gung1-hei3] }
      - { es: "嗰個花旦唱得好好，台下啲戲迷拍晒手掌。", en: "That leading lady sang beautifully, and all the fans in the audience applauded.", altEs: ["嗰個花旦唱得好好聽，台下啲戲迷拍晒手掌。"], grammar: [g.opera-language, g.dak-descriptive], vocab: [w.faa1-daan3, w.hei3-mai4], jp: "go2 go3 faa1 daan3 coeng3 dak1 hou2 hou2 toi4 haa6 di1 hei3 mai4 paak3 saai3 sau2 zoeng2", transform: { instruction: "Ask whether the leading lady sang well", answer: "嗰個花旦唱得好唔好？", alt: ["嗰個花旦唱成點？", "嗰個花旦唱得好唔好呀？"] } }
      - { es: "小生同花旦係一對，通常演才子佳人。", en: "The young male lead and the leading lady are a pair and usually play scholars and beauties.", altEs: ["小生同花旦係一對，通常做才子佳人。"], grammar: [g.opera-language], vocab: [w.siu2-sang1, w.faa1-daan3] }
      - { es: "文武生要識唱又要識打，係戲班嘅台柱。", en: "The civil-martial male lead must be able to both sing and fight; he's the pillar of the troupe.", altEs: ["文武生又要識唱又要識打，係戲班嘅台柱。"], grammar: [g.opera-language], vocab: [w.man4-mou5-sang1, w.hei3-baan1] }
      - { es: "丑生一出場，全場觀眾都笑到碌地。", en: "The moment the clown comes on stage, the whole audience is rolling on the floor laughing.", altEs: ["丑生一出嚟，全場觀眾都笑到碌地。"], grammar: [g.opera-language, g.jat-zau-as-soon-as], vocab: [w.cau2-sang1], jp: "cau2 sang1 jat1 ceot1 coeng4 cyun4 coeng4 gun1 zung3 dou1 siu3 dou3 luk1 dei2" }
      - { es: "武生喺台上翻筋斗，好似李小龍咁勁。", en: "The martial role does somersaults on stage, as impressive as Bruce Lee.", altEs: ["武生喺台上面翻筋斗，好似李小龍咁勁。"], grammar: [g.opera-language], vocab: [w.mou5-sang1] }
      - { es: "佢唱平喉，聲線好雄厚；佢師姐就專唱子喉。", en: "She sings in the natural voice of male roles, very rich; her senior sings falsetto female roles.", altEs: ["佢唱平喉，把聲好雄厚；佢師姐就專唱子喉。"], grammar: [g.opera-language], vocab: [w.ping4-hau4, w.zi2-hau4], error: { wrong: "佢係女仔，所以唔可以唱平喉。", explain: "平喉 is a voice type, not the singer's sex: women often sing 平喉 male roles.", grammar: g.opera-language } }
      - { es: "呢位名伶已經登台五十年，係粵劇界嘅老倌。", en: "This famous singer has been on stage for fifty years; she's a star of the opera world.", altEs: ["呢位名伶登台已經五十年，係粵劇界嘅老倌。"], grammar: [g.opera-language], vocab: [w.ming4-ling4, w.lou5-gun1, w.dang1-toi4], jp: "ni1 wai2 ming4 ling4 ji5 ging1 dang1 toi4 ng5 sap6 nin4 hai6 jyut6 kek6 gaai3 ge3 lou5 gun1" }
      - { es: "我今次做嘅角色係一隻鳳，要著好重嘅戲服。", en: "The role I'm playing this time is a phoenix, and I have to wear a very heavy costume.", altEs: ["今次我做嘅角色係一隻鳳，要著好重嘅戲服。"], grammar: [g.opera-language, g.relative-ge], vocab: [w.gok3-sik1, w.fung6], jp: "ngo5 gam1 ci3 zou6 ge3 gok3 sik1 hai6 jat1 zek3 fung6 jiu3 zoek3 hou2 cung5 ge3 hei3 fuk6" }
      - { es: "粵劇同京劇唔同，粵劇大部分用廣東話唱。", en: "Cantonese opera is different from Peking opera: most of it is sung in Cantonese.", altEs: ["粵劇唔同京劇，大部分用廣東話唱。"], grammar: [g.opera-language], vocab: [w.ging1-kek6, w.jyut6-kek6, w.mou5-toi4] }
    exchanges:
      - q: { es: "你有冇睇過大戲？", en: "Have you ever seen a Cantonese opera?" }
        a: { es: "細個同阿爺喺戲棚睇過神功戲。", en: "When I was little I saw ritual opera with Grandpa in a bamboo theatre." }
        alt: ["睇過一次，喺萬福台。", "未睇過，好想去睇。"]
        grammar: [g.opera-language, g.gwo-experiential]
        vocab: [w.daai6-hei3, w.hei3-paang4, w.san4-gung1-hei3]
      - q: { es: "萬福台喺邊度呀？", en: "Where is the Wanfu Stage?" }
        a: { es: "喺佛山祖廟入面，由廣州坐地鐵去好方便。", en: "Inside Foshan's Ancestral Temple; it's easy to get there by metro from Guangzhou." }
        alt: ["喺佛山祖廟。", "喺佛山，祖廟入面。"]
        grammar: [g.opera-language]
        vocab: [w.maan6-fuk1-toi4, w.zou2-miu6, w.fat6-saan1]
      - q: { es: "你最鍾意邊個角色？", en: "Which role do you like best?" }
        a: { es: "丑生，佢每次出嚟我都笑到碌地。", en: "The clown - every time he comes on I'm rolling on the floor." }
        alt: ["花旦，佢啲戲服好靚。", "文武生，又識唱又識打。"]
        grammar: [g.opera-language]
        vocab: [w.gok3-sik1, w.cau2-sang1]
      - q: { es: "佢係唱平喉定子喉㗎？", en: "Does she sing the natural voice or falsetto?" }
        a: { es: "平喉，佢專做小生。", en: "The natural voice - she specialises in young male roles." }
        alt: ["子喉，佢做花旦。", "平喉。"]
        grammar: [g.opera-language]
        vocab: [w.ping4-hau4, w.zi2-hau4, w.siu2-sang1]
      - q: { es: "點解以前啲戲班叫「紅船子弟」？", en: "Why were opera troupes once called 'red boat disciples'?" }
        a: { es: "因為佢哋坐紅船周圍去做戲。", en: "Because they travelled around on red boats to perform." }
        alt: ["佢哋住喺紅船上面。", "因為佢哋坐紅船。"]
        grammar: [g.opera-language]
        vocab: [w.hung4-syun4, w.hei3-baan1]
    texts:
      - title: "祖廟介紹牌"
        es: ["萬福台建於清朝，係廣東現存最古老嘅戲台之一。", "以前每逢節日，戲班都喺度做大戲。", "台前嘅空地可以企幾百個觀眾。"]
        en: ["The Wanfu Stage was built in the Qing dynasty and is one of the oldest surviving opera stages in Guangdong.", "In the past, troupes performed opera here at every festival.", "The open ground in front of the stage could hold several hundred standing spectators."]
        grammar: [g.opera-language, g.formal-time]
        vocab: [w.maan6-fuk1-toi4, w.hei3-toi4, w.hei3-baan1]
    spicy:
      - { es: "你做花旦，我做小生，我哋今晚唱一齣才子佳人。", en: "You be the leading lady and I'll be the young scholar - tonight we'll play scholar and beauty.", altEs: ["你做花旦，我做小生，今晚一齊唱才子佳人。"], grammar: [g.opera-language], vocab: [w.faa1-daan3, w.siu2-sang1] }
      - { es: "我本來唔係戲迷，見到你演花旦先變咗戲迷。", en: "I wasn't an opera fan at all until I saw you play the leading lady.", altEs: ["我本來唔係戲迷，睇完你做花旦就變咗戲迷。"], grammar: [g.opera-language], vocab: [w.hei3-mai4, w.faa1-daan3] }
      - { es: "你唔使扮丑生，你一開口我已經笑咗。", en: "You don't need to play the clown - the moment you open your mouth I'm already smiling.", altEs: ["唔使扮丑生啦，你一開口我已經笑咗。"], grammar: [g.opera-language, g.jat-zau-as-soon-as], vocab: [w.cau2-sang1] }
      - { es: "喺我心入面，你永遠係最紅嘅名伶。", en: "In my heart, you'll always be the most famous star.", altEs: ["喺我心目中，你永遠係最紅嘅名伶。"], grammar: [g.opera-language], vocab: [w.ming4-ling4] }
  - id: c2.u04.l2
    title: 唱做唸打
    teach: [g.opera-language]
    vocab: [w.coeng3-hong1, w.bong1-wong4, w.naam4-jam1, w.kuk1, w.kuk1-ci4, w.nim6-baak6, w.hau2-baak6, w.zou6-sau2, w.san1-dyun6, w.seoi2-zau6, w.lim5-pou2, w.faa3-zong1, w.hei3-fuk6, w.tau4-sik1, w.gu2-zong1, w.lo4-gu2, w.lo4, w.gu2.b, w.ji6-wu2, w.gou1-wu2, w.joeng4-kam4, w.so2-naap6, w.ngok6-hei3, w.bun6-zau3, w.paai4-lin6, w.jin2-ceot1, w.dang1-toi4, w.ze6-mok6, w.kek6-bun2, w.kek6-muk6, w.biu2-jin2, w.gou1-jam1, w.dai3-neoi5-faa1]
    tip: "唱做唸打 are the four skills: singing (唱), acting with gestures and posture (做手, 身段), recitation of spoken lines (念白), and martial arts (打)."
    sentences:
      - { es: "佢嘅唱腔好有特色，一聽就知係邊個。", en: "Her singing style is so distinctive that you know who it is straight away.", altEs: ["佢個唱腔好有特色，一聽就知係佢。"], grammar: [g.opera-language, g.jat-zau-as-soon-as], vocab: [w.coeng3-hong1] }
      - { es: "粵劇嘅音樂主要係梆黃，另外仲有南音。", en: "The music of Cantonese opera is mainly bangzi and erhuang melodies, plus Nanyin narrative song.", altEs: ["粵劇音樂主要係梆黃，仲有南音。"], grammar: [g.opera-language], vocab: [w.bong1-wong4, w.naam4-jam1] }
      - { es: "呢首曲啲曲詞好深，我要睇字幕先明。", en: "The lyrics of this aria are very literary; I have to read the surtitles to understand.", altEs: ["呢首曲嘅曲詞好深，要睇字幕先明。"], grammar: [g.opera-language, g.sin-final], vocab: [w.kuk1, w.kuk1-ci4] }
      - { es: "念白同口白唔同：念白有節奏，口白好似平時講嘢。", en: "Recited lines and spoken dialogue differ: recitation has a rhythm, dialogue is like everyday speech.", altEs: ["念白同口白唔一樣：念白有節奏，口白似平時講嘢。"], grammar: [g.opera-language], vocab: [w.nim6-baak6, w.hau2-baak6] }
      - { es: "老師話我啲做手唔夠細膩，身段又太硬。", en: "The teacher says my hand gestures aren't delicate enough and my posture is too stiff.", altEs: ["老師話我做手唔夠細膩，身段又太硬。"], grammar: [g.opera-language, g.reported-speech], vocab: [w.zou6-sau2, w.san1-dyun6] }
      - { es: "花旦一揮水袖，成個舞台都靚晒。", en: "When the leading lady flicks her water sleeves, the whole stage comes alive.", altEs: ["花旦一揮水袖，成個舞台都好靚。"], grammar: [g.opera-language, g.jat-zau-as-soon-as], vocab: [w.seoi2-zau6, w.mou5-toi4], jp: "faa1 daan3 jat1 fai1 seoi2 zau6 seng4 go3 mou5 toi4 dou1 leng3 saai3" }
      - { es: "紅色臉譜代表忠心，白色就代表奸詐。", en: "Red face paint stands for loyalty, white for treachery.", altEs: ["紅色臉譜代表忠，白色臉譜代表奸。"], grammar: [g.opera-language], vocab: [w.lim5-pou2] }
      - { es: "呢套戲服連頭飾都係人手繡嘅，好貴重。", en: "This costume, headdress included, is hand-embroidered and very precious.", altEs: ["呢套戲服同頭飾都係人手繡嘅，好貴重。"], grammar: [g.opera-language, g.hai-ge-focus], vocab: [w.hei3-fuk6, w.tau4-sik1], jp: "ni1 tou3 hei3 fuk6 lin4 tau4 sik1 dou1 hai6 jan4 sau2 sau3 ge3 hou2 gwai3 zung6" }
      - { es: "粵劇大部分都係古裝戲，好少有時裝。", en: "Most Cantonese operas are period pieces; very few are in modern dress.", altEs: ["粵劇大多數係古裝戲，好少時裝。"], grammar: [g.opera-language], vocab: [w.gu2-zong1] }
      - { es: "鑼鼓一響，觀眾就知好戲開場。", en: "As soon as the gongs and drums sound, the audience knows the show is starting.", altEs: ["鑼鼓一響，觀眾就知開場喇。"], grammar: [g.opera-language, g.jat-zau-as-soon-as], vocab: [w.lo4-gu2] }
      - { es: "打鑼嗰個師傅同打鼓嗰個係兩兄弟。", en: "The man playing the gong and the one playing the drum are brothers.", altEs: ["打鑼嘅師傅同打鼓嘅係兩兄弟。"], grammar: [g.relative-ge], vocab: [w.lo4, w.gu2.b] }
      - { es: "高胡個聲比二胡高，係粵劇樂隊嘅主音。", en: "The gaohu sounds higher than the erhu; it's the lead voice of the opera band.", altEs: ["高胡嘅聲比二胡高，係粵劇樂隊嘅主音。"], grammar: [g.bei2-comparison], vocab: [w.gou1-wu2, w.ji6-wu2], jp: "gou1 wu2 go3 seng1 bei2 ji6 wu2 gou1 hai6 jyut6 kek6 ngok6 deoi2 ge3 zyu2 jam1" }
      - { es: "揚琴、嗩吶同二胡都係傳統樂器，負責伴奏。", en: "The yangqin, suona and erhu are traditional instruments that provide the accompaniment.", altEs: ["揚琴、嗩吶同二胡都係傳統樂器，幫手伴奏。"], grammar: [g.opera-language], vocab: [w.joeng4-kam4, w.so2-naap6, w.ngok6-hei3, w.bun6-zau3], transform: { instruction: "Turn it into a question: which traditional instruments provide the accompaniment?", answer: "邊啲傳統樂器負責伴奏？", alt: ["有邊啲傳統樂器負責伴奏？"] } }
      - { es: "戲班排練咗三個月，今晚終於演出。", en: "The troupe rehearsed for three months, and tonight they finally perform.", altEs: ["戲班排練咗三個月，今晚終於正式演出。"], grammar: [g.opera-language, g.duration], vocab: [w.paai4-lin6, w.jin2-ceot1], error: { wrong: "戲班排練三個月咗，今晚終於演出。", explain: "咗 follows the verb directly, before the duration: 排練咗三個月.", grammar: g.duration } }
      - { es: "表演完之後，全部演員一齊出嚟謝幕。", en: "After the performance all the actors come out together to take a bow.", altEs: ["表演完，全部演員一齊出嚟謝幕。"], grammar: [g.opera-language], vocab: [w.biu2-jin2, w.ze6-mok6], transform: { instruction: "Say only the leading lady came out to take a bow", answer: "表演完之後，淨係花旦出嚟謝幕。", alt: ["表演完之後，得花旦一個出嚟謝幕。"] } }
      - { es: "呢個劇本係新寫嘅，唔係傳統劇目。", en: "This script is newly written; it's not a traditional repertoire piece.", altEs: ["呢個劇本係新寫㗎，唔係傳統劇目。"], grammar: [g.hai-ge-focus], vocab: [w.kek6-bun2, w.kek6-muk6] }
    exchanges:
      - q: { es: "學大戲最難係邊樣？", en: "What's the hardest part of learning opera?" }
        a: { es: "我覺得係身段，要練好多年。", en: "I think it's the stage posture - it takes years of practice." }
        alt: ["唱腔最難。", "唱做唸打樣樣都難。"]
        grammar: [g.opera-language]
        vocab: [w.san1-dyun6, w.coeng3-hong1]
      - q: { es: "你聽得明啲曲詞嗎？", en: "Can you understand the lyrics?" }
        a: { es: "唔係好明，好彩有字幕。", en: "Not really - luckily there are surtitles." }
        alt: ["一半半啦。", "聽得明，念白比較易。"]
        grammar: [g.opera-language]
        vocab: [w.kuk1-ci4]
      - q: { es: "嗰件係乜嘢樂器呀？", en: "What instrument is that?" }
        a: { es: "係高胡，比二胡高音啲。", en: "It's a gaohu, a bit higher-pitched than the erhu." }
        alt: ["高胡嚟㗎。", "係揚琴。"]
        grammar: [g.opera-language]
        vocab: [w.ngok6-hei3, w.gou1-wu2, w.ji6-wu2]
      - q: { es: "你哋幾時演出呀？", en: "When are you performing?" }
        a: { es: "下個月，而家日日都排練緊。", en: "Next month - we're rehearsing every day now." }
        alt: ["下個月初。", "仲未定，排練緊。"]
        grammar: [g.opera-language, g.gan-progressive]
        vocab: [w.jin2-ceot1, w.paai4-lin6]
      - q: { es: "佢化妝要幾耐？", en: "How long does her make-up take?" }
        a: { es: "足足兩個鐘，仲要戴頭飾。", en: "A good two hours, and she has to put on the headdress too." }
        alt: ["兩個鐘左右。", "好耐㗎，最少一個鐘。"]
        grammar: [g.opera-language, g.duration]
        vocab: [w.faa3-zong1, w.tau4-sik1]
    texts:
      - title: "後台"
        es: ["開場前一個鐘，後台好忙。", "花旦喺度化妝，武生喺度熱身。", "鑼鼓一響，大家就要登台。"]
        en: ["An hour before curtain-up, backstage is very busy.", "The leading lady is doing her make-up and the martial actor is warming up.", "As soon as the gongs and drums sound, everyone has to go on stage."]
        grammar: [g.opera-language, g.jat-zau-as-soon-as]
        vocab: [w.faa3-zong1, w.lo4-gu2, w.dang1-toi4]
      - title: "演出通告"
        es: ["劇目：《帝女花》。", "演出日期：十月十八日晚上七點半。", "樂隊現場伴奏，演出後老倌謝幕。"]
        en: ["Play: The Flower Princess.", "Date: the eighteenth of October, 7.30 pm.", "Live band accompaniment; the stars take a curtain call after the show."]
        grammar: [g.notice-language]
        vocab: [w.kek6-muk6, w.bun6-zau3, w.ze6-mok6]
    spicy:
      - { es: "你一揮水袖，我個心就跟住你飛。", en: "When you flick your water sleeves, my heart flies off after you.", altEs: ["你一揮水袖，我個心就跟住你飄。"], grammar: [g.opera-language, g.jat-zau-as-soon-as], vocab: [w.seoi2-zau6] }
      - { es: "唔使排練，同你約會我樣樣都即興演出。", en: "No rehearsal needed - on a date with you I improvise everything.", altEs: ["同你約會唔使排練，我樣樣都即興演出。"], grammar: [g.opera-language], vocab: [w.paai4-lin6, w.jin2-ceot1], jp: "m4 sai2 paai4 lin6 tung4 nei5 joek3 wui6 ngo5 joeng6 joeng6 dou1 zik1 hing3 jin2 ceot1" }
      - { es: "你化唔化妝都咁靚，臉譜都遮唔住。", en: "You're just as gorgeous with or without make-up - even face paint couldn't hide it.", altEs: ["你化唔化妝都一樣咁靚，臉譜都遮唔住。"], grammar: [g.opera-language], vocab: [w.faa3-zong1, w.lim5-pou2] }
      - { es: "我嘅心跳得好似鑼鼓咁快。", en: "My heart is beating as fast as the gongs and drums.", altEs: ["我個心跳得好似鑼鼓咁快。"], grammar: [g.opera-language, g.dak-descriptive], vocab: [w.lo4-gu2] }
      - { es: "今晚我哋嘅約會演出完，你會唔會同我謝幕？", en: "When tonight's date is over, will you take a bow with me?", altEs: ["今晚約會完，你會唔會同我一齊謝幕？"], grammar: [g.opera-language], vocab: [w.ze6-mok6] }
  - id: c2.u04.l3
    title: 妾身願隨君去
    teach: [g.classical-pronouns]
    vocab: [w.fu1-gwan1, w.noeng4-zi2, w.nou4-gaa1, w.cip3, w.ng4.b, w.jyu5.c, w.hing1, w.ji5.c, w.gwan1.b, w.gwaa2-jan4, w.zam6, w.san4.c, w.zoi6-haa6, w.lou5-fu1, w.hai4, w.ji5.d, w.fu4, w.zoi1, w.jin4.b, w.ho4.c, w.fu6-maa5, w.gung1-ting4, w.dai3-neoi5-faa1, w.zi2-caai1-gei3, w.maau5-daan1-ting4, w.coi4-zi2-gaai1-jan4, w.dai3-wong4-zoeng3-soeng3, w.zung1.c, w.haau3, w.ji6.c, w.syu1-sang1, w.gu2-man4, w.gu2-si1]
    tip: "The pronoun tells you who is speaking: 妾 or 奴家 a woman, 小生 a young scholar, 朕 the emperor, 臣 a minister, 老夫 an old man. In everyday speech they only appear as jokes."
    sentences:
      - { es: "粵劇入面，女角自稱「妾」或者「奴家」，好謙虛。", en: "In Cantonese opera, female roles call themselves 'this concubine' or 'this slave' - very humble.", altEs: ["粵劇入面嘅女角自稱「妾」或者「奴家」，好謙虛。"], grammar: [g.classical-pronouns], vocab: [w.cip3, w.nou4-gaa1] }
      - { es: "「妾身願隨君去」即係「我願意跟你走」。", en: "'This humble woman would follow you, my lord' means 'I'm willing to go with you'.", altEs: ["「妾身願隨君去」意思係「我願意跟你走」。"], grammar: [g.classical-pronouns], vocab: [w.cip3, w.gwan1.b], transform: { instruction: "Turn the colloquial version into a question: are you willing to go with me?", answer: "你願唔願意跟我走？", alt: ["你肯唔肯跟我走？"] } }
      - { es: "皇帝自稱「朕」，國王就自稱「寡人」。", en: "An emperor calls himself 'zam', and a king calls himself 'the lonely one'.", altEs: ["皇帝會自稱「朕」，國王就自稱「寡人」。"], grammar: [g.classical-pronouns], vocab: [w.zam6, w.gwaa2-jan4] }
      - { es: "佢一入門就話：「朕今日唔想返工。」", en: "The moment he came in he said: 'We do not wish to go to work today.'", altEs: ["佢一入門口就話：「朕今日唔想返工。」"], altEn: ["She walked in and announced: 'We are not minded to work today.'"], grammar: [g.classical-pronouns, g.jat-zau-as-soon-as], vocab: [w.zam6], error: { wrong: "佢一入門就話：「寡人今日唔想返工，朕好攰。」", explain: "Pick one royal pronoun and keep it: an emperor is 朕 throughout; mixing 寡人 and 朕 in one breath breaks the joke.", grammar: g.classical-pronouns } }
      - { es: "大臣同皇帝講嘢，一定要自稱「臣」。", en: "When a minister speaks to the emperor, he must call himself 'your servant'.", altEs: ["大臣同皇帝講嘢要自稱「臣」。"], grammar: [g.classical-pronouns], vocab: [w.san4.c], transform: { instruction: "Turn it into a question: what must a minister call himself when speaking to the emperor?", answer: "大臣同皇帝講嘢，要自稱乜嘢？", alt: ["大臣同皇帝講嘢要自稱咩？", "大臣同皇帝講嘢，一定要自稱乜嘢？"] } }
      - { es: "書生一出場就話：「小生姓梁。」", en: "As soon as the scholar comes on, he says: 'This humble scholar's surname is Leung.'", altEs: ["書生一出嚟就話：「小生姓梁。」"], grammar: [g.classical-pronouns, g.jat-zau-as-soon-as], vocab: [w.syu1-sang1, w.siu2-sang1], jp: "syu1 sang1 jat1 ceot1 coeng4 zau6 waa6 siu2 sang1 sing3 loeng4" }
      - { es: "「汝何故來此？」即係「你點解嚟呢度？」", en: "'Why hast thou come hither?' means 'Why have you come here?'", altEs: ["「汝何故來此？」意思係「你點解嚟呢度？」"], grammar: [g.classical-pronouns, g.classical-grammar], vocab: [w.jyu5.c, w.ho4.c] }
      - { es: "老生角色會自稱「老夫」，聽落好有威嚴。", en: "Old male roles call themselves 'this old man', which sounds very dignified.", altEs: ["老生角色自稱「老夫」，聽落好威嚴。"], grammar: [g.classical-pronouns], vocab: [w.lou5-fu1] }
      - { es: "皇帝叫自己嘅愛妃做「卿」，聽落好親切。", en: "The emperor calls his beloved consort 'hing', which sounds very affectionate.", altEs: ["皇帝叫佢嘅愛妃做「卿」，好親切。"], grammar: [g.classical-pronouns], vocab: [w.hing1] }
      - { es: "「爾」同「汝」都係古文嘅「你」，「吾」就係「我」。", en: "'Ji' and 'jyu' both mean 'you' in classical Chinese, and 'ng' means 'I'.", altEs: ["「爾」同「汝」都係古文「你」嘅意思，「吾」即係「我」。"], grammar: [g.classical-pronouns], vocab: [w.ji5.c, w.jyu5.c, w.ng4.b] }
      - { es: "台上小生叫花旦做「娘子」，花旦叫佢做「夫君」。", en: "On stage the young scholar calls the leading lady 'my lady', and she calls him 'my husband'.", altEs: ["台上面小生叫花旦做「娘子」，花旦叫佢「夫君」。"], grammar: [g.classical-pronouns], vocab: [w.noeng4-zi2, w.fu1-gwan1] }
      - { es: "古文句尾嘅「矣」、「乎」、「哉」，有啲似廣東話嘅語氣詞。", en: "The sentence-final 'ji', 'fu' and 'zoi' of classical Chinese are a bit like Cantonese particles.", altEs: ["古文句尾嘅「矣」、「乎」、「哉」，好似廣東話啲語氣詞。"], grammar: [g.classical-pronouns, g.classical-function-words], vocab: [w.ji5.d, w.fu4, w.zoi1] }
      - { es: "古詩用「兮」字拉長聲，本身冇乜意思。", en: "Old poems use 'hai' to draw out the sound; it has no real meaning of its own.", altEs: ["古詩用「兮」字嚟拉長聲，本身冇咩意思。"], grammar: [g.classical-function-words], vocab: [w.hai4], jp: "gu2 si1 jung6 hai4 zi6 laai1 coeng4 seng1 bun2 san1 mou5 mat1 ji3 si1" }
      - { es: "《帝女花》講公主同駙馬喺宮廷變亂之中嘅愛情。", en: "The Flower Princess tells of the love between a princess and her consort amid upheaval at court.", altEs: ["《帝女花》講公主同駙馬喺宮廷大亂入面嘅愛情。"], grammar: [g.opera-language], vocab: [w.dai3-neoi5-faa1, w.fu6-maa5, w.gung1-ting4] }
      - { es: "《紫釵記》同《牡丹亭》都係才子佳人嘅故事。", en: "The Purple Hairpin and The Peony Pavilion are both stories of scholars and beauties.", altEs: ["《紫釵記》同《牡丹亭》都講才子佳人。"], grammar: [g.opera-language], vocab: [w.zi2-caai1-gei3, w.maau5-daan1-ting4, w.coi4-zi2-gaai1-jan4] }
      - { es: "好多大戲都講帝王將相，宣揚忠、孝、義。", en: "Many operas are about emperors, kings, generals and ministers, and promote loyalty, filial piety and righteousness.", altEs: ["好多大戲講帝王將相，宣揚忠孝義。"], grammar: [g.opera-language], vocab: [w.dai3-wong4-zoeng3-soeng3, w.zung1.c, w.haau3, w.ji6.c] }
    exchanges:
      - q: { es: "「妾」係乜嘢意思？", en: "What does 'cip' mean?" }
        a: { es: "即係女仔謙虛噉講「我」。", en: "It's a woman humbly saying 'I'." }
        alt: ["女角自稱嘅「我」。", "古時女人講「我」。"]
        grammar: [g.classical-pronouns]
        vocab: [w.cip3]
      - q: { es: "點解佢成日自稱「朕」？", en: "Why does he keep calling himself 'zam'?" }
        a: { es: "佢玩嘢咋，扮皇帝搞笑。", en: "He's just joking - pretending to be the emperor for a laugh." }
        alt: ["扮皇帝囉。", "佢做大戲做上癮。"]
        grammar: [g.classical-pronouns]
        vocab: [w.zam6]
      - q: { es: "《帝女花》講乜嘢？", en: "What's The Flower Princess about?" }
        a: { es: "講公主同駙馬嘅愛情，好淒涼。", en: "The love of a princess and her consort - very tragic." }
        alt: ["講公主同駙馬。", "才子佳人嘅故事。"]
        grammar: [g.opera-language]
        vocab: [w.dai3-neoi5-faa1, w.fu6-maa5]
      - q: { es: "小生點樣叫自己老婆？", en: "How does the young scholar address his wife?" }
        a: { es: "佢叫佢做「娘子」。", en: "He calls her 'my lady'." }
        alt: ["「娘子」。", "叫「娘子」，佢就叫佢「夫君」。"]
        grammar: [g.classical-pronouns]
        vocab: [w.noeng4-zi2, w.fu1-gwan1]
      - q: { es: "古文嘅「吾」同廣東話有冇關係？", en: "Is classical 'ng' related to Cantonese?" }
        a: { es: "「吾」即係「我」，不過而家淨係喺歌詞見到。", en: "'Ng' means 'I', but nowadays you only see it in lyrics." }
        alt: ["即係「我」。", "有，「吾愛」即係「我嘅愛人」。"]
        grammar: [g.classical-pronouns]
        vocab: [w.ng4.b]
    texts:
      - title: "曲詞註解"
        es: ["「妾」：女角自稱，即係「我」。", "「君」：對男子嘅敬稱，即係「你」。", "「卿」：皇帝或者丈夫對女子嘅親切稱呼。", "「焉」：即係「點」，「焉知」就係「點知」。"]
        en: ["'Cip': what a female role calls herself - 'I'.", "'Gwan': a respectful way of addressing a man - 'you'.", "'Hing': an affectionate way for an emperor or husband to address a woman.", "'Jin': means 'how'; 'jin zi' is 'dim zi' (how could one know)."]
        grammar: [g.classical-pronouns, g.classical-function-words]
        vocab: [w.cip3, w.gwan1.b, w.hing1, w.jin4.b]
    spicy:
      - { es: "妾身今晚願隨君去食宵夜。", en: "This humble lady would gladly follow you, my lord, for a late-night snack.", altEs: ["妾身今晚願意跟君去食宵夜。"], grammar: [g.classical-pronouns], vocab: [w.cip3, w.gwan1.b] }
      - { es: "朕命令你今晚陪朕睇戲。", en: "We command you to accompany Us to the opera tonight.", altEs: ["朕命你今晚陪朕睇戲。"], grammar: [g.classical-pronouns], vocab: [w.zam6] }
      - { es: "娘子，小生已經訂咗枱，請問幾時賞面？", en: "My lady, this humble scholar has booked a table - when will you honour me with your presence?", altEs: ["娘子，小生訂咗枱喇，幾時賞面呀？"], grammar: [g.classical-pronouns], vocab: [w.noeng4-zi2, w.siu2-sang1] }
      - { es: "卿家今晚咁靚，朕都唔捨得返宮。", en: "Our beloved looks so lovely tonight that We can't bear to return to the palace.", altEs: ["卿今晚咁靚，朕唔捨得返宮。"], grammar: [g.classical-pronouns], vocab: [w.hing1, w.zam6] }
      - { es: "在下唔係大俠，不過願意幫你攞住手袋。", en: "This humble one is no hero, but would gladly hold your handbag.", altEs: ["在下唔係大俠，但係願意幫你拎手袋。"], grammar: [g.classical-pronouns], vocab: [w.zoi6-haa6] }
  - id: c2.u04.l4
    title: 好戲在後頭
    teach: [g.opera-idioms]
    vocab: [w.fu2-meng6, w.soeng1-si1, w.lei4-bit6, w.leoi6, w.tyun5-coeng4, w.bei1, w.hei2.b, w.jyun3, w.han6, w.cing4, w.jyun4.c, w.jat1-sang1, w.gam1-sang1, w.loi4-sang1, w.tin1-ngaai4, w.hoi2-gok3, w.paau2-lung4-tou3, w.hou2-hei3-zoi6-hau6-tau4, w.sau1-fo1, w.zou6-daai6-lung4-fung6, w.ngaan5-leoi6, w.wong4-fei1-hung4, w.jip6-man6, w.wing6-ceon1, w.sing2-si1, w.mou5-gun2, w.mou5-seot6, w.tou4-ci4, w.zin2-zi2]
    tip: "Several everyday phrases come from the opera stage: 做大龍鳳 'put on a show', 跑龍套 'play a bit part', 收科 'wrap things up', 好戲在後頭 'the best (or worst) is yet to come'."
    sentences:
      - { es: "佢哋兩個喺度做大龍鳳，其實早就和好咗。", en: "Those two are just putting on a show; they made up long ago.", altEs: ["佢哋兩個喺度做大龍鳳，其實早已經和好咗。"], grammar: [g.opera-idioms], vocab: [w.zou6-daai6-lung4-fung6], error: { wrong: "佢哋兩個喺度做大龍鳳，慶祝真心結婚。", explain: "做大龍鳳 implies an insincere show; don't use it for a genuine celebration.", grammar: g.opera-idioms } }
      - { es: "我喺公司只係跑龍套，大事輪唔到我話事。", en: "I'm only a bit player at the company; I don't get to decide anything important.", altEs: ["我喺公司淨係跑龍套，大事輪唔到我決定。"], grammar: [g.opera-idioms], vocab: [w.paau2-lung4-tou3], transform: { instruction: "Say it about him (佢)", answer: "佢喺公司只係跑龍套，大事輪唔到佢話事。", alt: ["佢喺公司淨係跑龍套，大事輪唔到佢決定。"] } }
      - { es: "搞成咁，睇你點收科。", en: "Look at this mess - let's see how you get out of it.", altEs: ["搞成噉，睇你點樣收科。"], grammar: [g.opera-idioms], vocab: [w.sau1-fo1], transform: { instruction: "Turn it into a direct question: how are we going to get out of this?", answer: "搞成咁，我哋點收科？", alt: ["搞成咁，點收科呀？", "搞成咁，我哋點樣收科？"] } }
      - { es: "今日只係第一場，好戲在後頭。", en: "Today is only the first act; the best is yet to come.", altEs: ["今日淨係第一場，好戲在後頭。"], grammar: [g.opera-idioms], vocab: [w.hou2-hei3-zoi6-hau6-tau4] }
      - { es: "我唔記得講稿，唯有爆肚。", en: "I forgot my script, so I had to ad-lib.", altEs: ["我唔記得咗講稿，唯有爆肚。"], grammar: [g.opera-idioms], vocab: [w.baau3-tou5] }
      - { es: "《帝女花》嘅結局好悲，睇到我眼淚都流埋出嚟。", en: "The ending of The Flower Princess is so sad it brought tears to my eyes.", altEs: ["《帝女花》個結局好悲，睇到我流眼淚。"], grammar: [g.opera-language, g.dou-extent], vocab: [w.bei1, w.ngaan5-leoi6], jp: "dai3 neoi5 faa1 ge3 git3 guk6 hou2 bei1 tai2 dou3 ngo5 ngaan5 leoi6 dou1 lau4 maai4 ceot1 lai4" }
      - { es: "曲詞成日講相思同離別，淚呀、斷腸呀，好淒涼。", en: "Opera lyrics are always about longing and parting - tears, heartbreak - very sorrowful.", altEs: ["曲詞成日講相思同離別，又淚又斷腸，好淒涼。"], grammar: [g.opera-language], vocab: [w.soeng1-si1, w.lei4-bit6, w.leoi6, w.tyun5-coeng4] }
      - { es: "女主角好苦命，一生都等緊一個唔返嚟嘅人。", en: "The heroine is ill-fated; she spends her whole life waiting for someone who never comes back.", altEs: ["女主角好苦命，成世都等緊一個唔返嚟嘅人。"], grammar: [g.opera-language, g.relative-ge], vocab: [w.fu2-meng6, w.jat1-sang1] }
      - { es: "「今生無緣，來生再見」係大戲常見嘅對白。", en: "'No fate together in this life; we'll meet in the next' is a common line in opera.", altEs: ["「今生無緣，來生再見」係大戲好常見嘅對白。"], grammar: [g.opera-language], vocab: [w.gam1-sang1, w.loi4-sang1, w.jyun4.c] }
      - { es: "佢怨老天爺，又恨自己唔夠勇氣。", en: "She resents heaven and hates herself for not being brave enough.", altEs: ["佢怨老天，又恨自己唔夠勇氣。"], grammar: [g.opera-language], vocab: [w.jyun3, w.han6] }
      - { es: "呢齣戲有悲有喜，講盡人間嘅情。", en: "This play has sorrow and joy and says everything about human love.", altEs: ["呢齣戲有悲有喜，講盡世間嘅情。"], grammar: [g.opera-language], vocab: [w.bei1, w.hei2.b, w.cing4], jp: "ni1 ceot1 hei3 jau5 bei1 jau5 hei2 gong2 zeon6 jan4 gaan1 ge3 cing4" }
      - { es: "就算天涯海角，我都會搵到你。", en: "Even at the ends of the earth, I will find you.", altEs: ["就算去到天涯海角，我都會搵到你。"], grammar: [g.zau-syun-even-if], vocab: [w.tin1-ngaai4, w.hoi2-gok3] }
      - { es: "佛山祖廟入面有黃飛鴻紀念館同葉問堂。", en: "Inside Foshan's Ancestral Temple are the Wong Fei-hung Memorial Hall and Ip Man Hall.", altEs: ["佛山祖廟有黃飛鴻紀念館同埋葉問堂。"], grammar: [g.opera-language], vocab: [w.wong4-fei1-hung4, w.jip6-man6] }
      - { es: "葉問教詠春，李小龍都係佢嘅徒弟。", en: "Ip Man taught Wing Chun, and Bruce Lee was one of his students.", altEs: ["葉問教詠春，李小龍係佢徒弟。"], grammar: [g.opera-language], vocab: [w.jip6-man6, w.wing6-ceon1], jp: "jip6 man6 gaau3 wing6 ceon1 lei5 siu2 lung4 dou1 hai6 keoi5 ge3 tou4 dai2" }
      - { es: "我哋喺祖廟睇咗醒獅表演，又去武館學咗兩招武術。", en: "At the Ancestral Temple we watched a lion dance and learnt a couple of martial-arts moves at a kung fu school.", altEs: ["我哋喺祖廟睇咗醒獅，仲去武館學咗兩招武術。"], grammar: [g.opera-language], vocab: [w.sing2-si1, w.mou5-gun2, w.mou5-seot6] }
      - { es: "佛山嘅陶瓷同剪紙都好出名，我買咗啲做手信。", en: "Foshan's ceramics and paper-cuts are famous; I bought some as souvenirs.", altEs: ["佛山啲陶瓷同剪紙都好出名，我買咗啲做手信。"], grammar: [g.opera-language], vocab: [w.tou4-ci4, w.zin2-zi2] }
    exchanges:
      - q: { es: "佢哋又嗌交？", en: "Are they fighting again?" }
        a: { es: "唔使理，做大龍鳳嚟咋。", en: "Never mind - it's just for show." }
        alt: ["做大龍鳳啫。", "係呀，今次好似認真。"]
        grammar: [g.opera-idioms]
        vocab: [w.zou6-daai6-lung4-fung6]
      - q: { es: "你喺套戲入面做乜嘢角色？", en: "What role do you play in the show?" }
        a: { es: "跑龍套咋，淨係出場兩次。", en: "Just a bit part - I only come on twice." }
        alt: ["跑龍套。", "我做丑生。"]
        grammar: [g.opera-idioms]
        vocab: [w.paau2-lung4-tou3]
      - q: { es: "件事搞到咁大，點收科呀？", en: "This has blown up so much - how do we wrap it up?" }
        a: { es: "唯有同老細講真話，求其收科啦。", en: "We'll just have to tell the boss the truth and wrap it up somehow." }
        alt: ["唔知點收科。", "等佢自己收科啦。"]
        grammar: [g.opera-idioms]
        vocab: [w.sau1-fo1]
      - q: { es: "今晚嘅演出完咗未？", en: "Is tonight's performance over?" }
        a: { es: "未呀，好戲在後頭。", en: "Not yet - the best is yet to come." }
        alt: ["仲有一場，好戲在後頭。", "完咗喇，啱啱謝幕。"]
        grammar: [g.opera-idioms]
        vocab: [w.hou2-hei3-zoi6-hau6-tau4]
      - q: { es: "你喺佛山買咗咩手信？", en: "What souvenirs did you buy in Foshan?" }
        a: { es: "買咗個陶瓷杯同兩張剪紙。", en: "A ceramic cup and two paper-cuts." }
        alt: ["陶瓷同剪紙。", "冇買，淨係睇咗醒獅。"]
        grammar: [g.opera-language]
        vocab: [w.tou4-ci4, w.zin2-zi2]
    texts:
      - title: "佛山一日遊"
        es: ["朝早去祖廟睇醒獅，下晝去黃飛鴻紀念館。", "夜晚喺萬福台睇大戲，一齣《帝女花》睇到我眼淚都流埋出嚟。", "今日只係第一日，好戲在後頭！"]
        en: ["In the morning we watched the lion dance at the Ancestral Temple, and in the afternoon went to the Wong Fei-hung Memorial Hall.", "In the evening we saw an opera at the Wanfu Stage - The Flower Princess brought tears to my eyes.", "And today was only the first day - the best is yet to come!"]
        grammar: [g.opera-idioms]
        vocab: [w.sing2-si1, w.wong4-fei1-hung4, w.hou2-hei3-zoi6-hau6-tau4]
    spicy:
      - { es: "唔好再做大龍鳳喇，你明明好想我錫你。", en: "Stop putting on a show - you obviously want me to kiss you.", altEs: ["唔好做大龍鳳喇，你明明想我錫你。"], grammar: [g.opera-idioms], vocab: [w.zou6-daai6-lung4-fung6] }
      - { es: "喺你嘅生命入面，我唔想跑龍套，我想做主角。", en: "In your life I don't want a bit part - I want the lead role.", altEs: ["喺你生命入面，我唔想跑龍套，想做主角。"], grammar: [g.opera-idioms], vocab: [w.paau2-lung4-tou3] }
      - { es: "第一次約會就咁開心，好戲在後頭。", en: "If the first date is this much fun, the best is yet to come.", altEs: ["第一次約會已經咁開心，好戲在後頭。"], grammar: [g.opera-idioms], vocab: [w.hou2-hei3-zoi6-hau6-tau4] }
      - { es: "同你一齊，天涯海角我都去。", en: "With you, I'd go to the ends of the earth.", altEs: ["同你一齊，天涯海角我都肯去。"], grammar: [g.opera-language], vocab: [w.tin1-ngaai4, w.hoi2-gok3] }
      - { es: "今生遇到你係緣，來生我都要再搵你。", en: "Meeting you in this life is fate; in the next life I'll find you again.", altEs: ["今生遇到你係緣分，來生我都要搵返你。"], grammar: [g.opera-language], vocab: [w.gam1-sang1, w.jyun4.c, w.loi4-sang1] }
dialogues:
  - id: c2.u04.d1
    title: 北京路嘅唱片舖
    context: On Guangzhou's Beijing Road, Ka-yan's grandfather, a lifelong opera fan, takes her and Ka-chun to an old record shop and talks them into a trip to Foshan.
    lines:
      - { speaker: 嘉欣, es: "阿爺，北京路咁多人，你點解特登帶我哋嚟呢度？", en: "Grandpa, Beijing Road is so crowded - why did you bring us here specially?" }
      - { speaker: 阿爺, es: "呢度有間舊唱片舖，賣好多粵劇唱片，我後生嗰陣日日都嚟。", en: "There's an old record shop here that sells lots of opera records; I came every day when I was young." }
      - { speaker: 家俊, es: "阿爺，你係戲迷嚟㗎？", en: "Grandpa, are you an opera fan?" }
      - { speaker: 阿爺, es: "梗係啦！我細個喺佛山睇神功戲，坐喺戲棚下面，一睇就睇成晚。", en: "Of course! As a boy I watched ritual opera in Foshan, sitting in the bamboo theatre, watching all night long." }
      - { speaker: 嘉欣, es: "我淨係知《帝女花》，其他劇目都唔識。", en: "I only know The Flower Princess; I don't know any other plays." }
      - { speaker: 阿爺, es: "《帝女花》講公主同駙馬嘅愛情，係才子佳人嘅經典。", en: "The Flower Princess is the love story of a princess and her consort - a classic of scholars and beauties." }
      - { speaker: 家俊, es: "不過啲曲詞好難明，乜嘢「妾」呀「君」呀。", en: "But the lyrics are so hard to follow, all this 'cip' and 'gwan'." }
      - { speaker: 阿爺, es: "「妾」即係女仔講「我」，「君」即係「你」，你哋聽多啲就明。", en: "'Cip' is a woman saying 'I', and 'gwan' means 'you'. Listen more and you'll understand." }
      - { speaker: 嘉欣, es: "阿爺，不如下個禮拜帶我哋去佛山祖廟睇萬福台啦。", en: "Grandpa, why don't you take us to the Wanfu Stage at Foshan's Ancestral Temple next week?" }
      - { speaker: 阿爺, es: "好呀！聽講嗰日有名伶登台，好戲在後頭！", en: "Good idea! I hear a famous star is performing that day - the best is yet to come!" }
    questions:
      - { q: "阿爺點解帶佢哋去北京路？", options: ["去舊唱片舖", "去食宵夜", "去買戲服"], answer: 0, explain: "He wants to show them an old record shop that sells opera records." }
      - { q: "阿爺細個喺邊度睇神功戲？", options: ["廣州塔", "佛山", "沙面"], answer: 1, explain: "我細個喺佛山睇神功戲: he watched ritual opera in Foshan." }
      - { q: "「妾」係乜嘢意思？", options: ["皇帝講「我」", "「你」", "女仔講「我」"], answer: 2, explain: "妾 is a humble female 'I'." }
      - { q: "佢哋下個禮拜打算去邊度？", options: ["北京路", "佛山祖廟", "陳家祠"], answer: 1, explain: "嘉欣 asks Grandpa to take them to the Wanfu Stage at Foshan's Ancestral Temple." }
writing:
  - task: "Write a review of a Cantonese opera performance you saw at the Wanfu Stage in Foshan's Ancestral Temple."
    min: 110
    max: 190
    use: [w.jyut6-kek6, w.maan6-fuk1-toi4, w.faa1-daan3, w.man4-mou5-sang1, w.coeng3-hong1]
    useAtLeast: 3
    grammar: [g.opera-language]
    expect:
      - { pattern: "粵劇|大戲", hint: "Name the art form: 粵劇, 大戲." }
      - { pattern: "花旦|文武生|小生|丑生|老倌", hint: "Mention the roles: 花旦, 文武生…" }
    model: { es: "上星期六我喺佛山祖廟嘅萬福台睇咗一場粵劇，劇目係名劇《帝女花》。做花旦嘅老倌唱腔好有感情，子喉嘅高音好穩定；文武生嘅身段同做手都好有型。最令我感動係最尾一場，兩個主角一齊死，台下好多戲迷都喊咗。最可惜係我坐得太後，聽唔清楚啲念白。總括嚟講，真係值得一睇。", en: "Last Saturday I saw a Cantonese opera on the Wanfu Stage at Foshan's Ancestral Temple: the famous The Flower Princess. The star playing the leading lady sang with great feeling and her falsetto high notes were very steady; the lead male's posture and gestures were really stylish. Most moving was the final scene, where the two leads die for love together; many fans in the audience cried. The biggest pity was sitting too far back to hear the spoken lines clearly. Overall, it's well worth seeing." }
  - task: "Write four lines in the style of an opera libretto using classical pronouns (妾, 君, 吾, 卿), then explain them in modern Cantonese."
    min: 110
    max: 190
    use: [w.cip3, w.gwan1.b, w.ng4.b, w.hing1, w.fu1-gwan1]
    useAtLeast: 3
    grammar: [g.classical-pronouns]
    expect:
      - { pattern: "妾|奴家|吾|在下|寡人", hint: "Use a classical first-person pronoun: 妾, 吾…" }
      - { pattern: "君|卿|汝|爾|夫君|娘子", hint: "Use a classical second-person pronoun: 君, 卿…" }
      - { pattern: "即係|意思係|嘅意思", hint: "Explain it in modern Cantonese: 即係…" }
    model: { es: "「夫君呀，天涯海角，妾都隨君去。」「娘子呀，今生吾只愛卿一人。」「離別之時淚如雨下，」「來生再結此段緣。」用而家嘅廣東話講，即係老婆話：「老公，去到幾遠我都跟住你。」老公答：「我呢一生淨係愛你一個。」最後兩句意思係：分開嘅時候喊到眼淚好似落雨咁，不過來生我哋都要再喺埋一齊，真係好令人感動。", en: "\"My husband, to the ends of the earth I'll follow you.\" \"My wife, in this life I love only you.\" \"At parting, tears fall like rain;\" \"in the next life we'll tie this bond again.\" In modern Cantonese: the wife says, \"Husband, however far you go, I'll follow you.\" The husband answers, \"In this life I love only you.\" The last two lines mean: when we part, our tears fall like rain, but in the next life we'll be together again. Very moving." }
  - task: "Write about a work situation using expressions that come from the opera stage (跑龍套, 好戲在後頭, 做大龍鳳, 收科)."
    min: 110
    max: 190
    use: [w.paau2-lung4-tou3, w.hou2-hei3-zoi6-hau6-tau4, w.zou6-daai6-lung4-fung6, w.sau1-fo1]
    useAtLeast: 3
    grammar: [g.opera-idioms]
    expect:
      - { pattern: "跑龍套|好戲在後頭|做大龍鳳|收科|做戲", hint: "Use an opera expression: 跑龍套, 做大龍鳳…" }
    model: { es: "我啱啱轉咗工，喺新公司暫時只係跑龍套，做啲影印同訂會議室嘅嘢。今日開會，經理同隔籬部門嘅經理為咗一份報告嗌交，嗌到成層樓都聽到，真係做大龍鳳。最後要老細出嚟先收科。同事話我：「你啱啱嚟，好戲仲喺後頭呀！」聽完我真係唔知應該笑定喊。我諗我都係做好自己份工先。", en: "I've just changed jobs, and for now I'm only playing a bit part at the new company, doing photocopying and booking meeting rooms. In today's meeting, my manager and the manager of another department argued over a report so loudly the whole floor could hear: a real big show. It took the boss coming out to wrap it up. A colleague told me: \"You've only just arrived; the best is yet to come!\" I didn't know whether to laugh or cry. I think I'd better just focus on doing my own job well." }
  - task: "Write a short article for a travel magazine about Foshan's culture: kung fu, lion dance and crafts."
    min: 110
    max: 200
    use: [w.wong4-fei1-hung4, w.jip6-man6, w.wing6-ceon1, w.sing2-si1, w.zin2-zi2]
    useAtLeast: 3
    grammar: [g.opera-language]
    expect:
      - { pattern: "佛山", hint: "Mention Foshan." }
      - { pattern: "黃飛鴻|葉問|詠春|醒獅|武術|剪紙|陶瓷", hint: "Mention Foshan's culture: 黃飛鴻, 醒獅, 剪紙…" }
    model: { es: "講起佛山，好多人第一時間會諗起黃飛鴻同葉問。佛山係南派武術好重要嘅地方，而家市區入面仲有唔少武館教詠春。每逢節日，街上都有醒獅表演，鑼鼓聲一響，成條街即刻熱鬧起嚟。除咗功夫，佛山嘅陶瓷同剪紙都好出名。如果你鍾意傳統文化，嚟佛山住兩日，一定會有好多收穫。記得試吓佛山啲嘢食呀！", en: "When people talk about Foshan, many immediately think of Wong Fei-hung and Ip Man. Foshan is a very important place for southern martial arts, and there are still quite a few schools in the city centre teaching Wing Chun. At every festival there are lion dances in the streets; as soon as the gongs and drums sound, the whole street comes alive. Besides kung fu, Foshan's ceramics and paper-cutting are also famous. If you like traditional culture, spend a couple of days in Foshan and you'll gain a lot. Remember to try Foshan's food!" }
