id: r.b2.la-maestra-que-invento-el-libro-del-futuro
level: b2
title: La maestra que inventó el libro del futuro
kind: text
intro: A biographical text about Ángela Ruiz Robles, the Spanish teacher who patented a mechanical precursor of the e-book in 1949, built around emphatic and cleft structures.
allow: [ángela, ruiz, robles, villamanín, león, ferrol, galicia, coruña, enciclopedia, mecánica]
paragraphs:
  - { es: "Cuando pensamos en el libro electrónico, pensamos en empresas enormes y en ingenieros de California. Sin embargo, fue una maestra de un pueblo de León quien imaginó, mucho antes que nadie, un libro que no pesara, que se iluminara y que hablara. Se llamaba Ángela Ruiz Robles y lo que inventó se llamó Enciclopedia Mecánica.", en: "When we think of the electronic book, we think of enormous companies and engineers in California. However, it was a teacher from a village in León who imagined, long before anyone else, a book that would not weigh anything, that would light up and that would speak. Her name was Ángela Ruiz Robles and what she invented was called the Mechanical Encyclopaedia." }
  - { es: "Ángela nació en 1895 en Villamanín, un pueblo pequeño de la provincia de León. Estudió para maestra y en 1918 se trasladó a Ferrol, en Galicia, donde pasó el resto de su vida. Allí dirigió una escuela para niñas y escribió varios libros de texto. No era una científica ni una ingeniera: era una profesora a la que le preocupaban sus alumnos.", en: "Ángela was born in 1895 in Villamanín, a small village in the province of León. She trained as a teacher and in 1918 moved to Ferrol, in Galicia, where she spent the rest of her life. There she ran a school for girls and wrote several textbooks. She was not a scientist or an engineer: she was a teacher who worried about her pupils." }
  - { es: "Lo que la preocupaba, exactamente, eran las mochilas. Sus alumnas llegaban a clase cargadas con kilos de libros, y muchas familias no podían comprarlos todos. Fue entonces cuando se le ocurrió la idea: ¿y si todos los libros cupieran en uno solo?", en: "What worried her, exactly, were the school bags. Her pupils arrived at class loaded with kilos of books, and many families could not buy them all. It was then that the idea occurred to her: what if all the books could fit into just one?" }
  - { es: "En 1949 patentó su invento. La Enciclopedia Mecánica era una caja del tamaño de un libro grande. Dentro llevaba varias bobinas con los textos de distintas asignaturas; el alumno pulsaba un botón y el texto aparecía en una ventana. Podía tener luz para leer de noche, una lupa para las letras pequeñas y, en el proyecto, incluso sonido para aprender idiomas. Lo asombroso no es solo la idea, sino la fecha: faltaban más de cincuenta años para el primer libro electrónico comercial.", en: "In 1949 she patented her invention. The Mechanical Encyclopaedia was a box the size of a large book. Inside it carried several reels with the texts of different subjects; the pupil pressed a button and the text appeared in a window. It could have a light for reading at night, a magnifying glass for small letters and, in the design, even sound for learning languages. The astonishing thing is not just the idea but the date: it was more than fifty years before the first commercial electronic book." }
  - { es: "El único prototipo se construyó en 1962 en un taller militar de Ferrol. Ángela lo presentó en ferias y exposiciones, recibió premios y mucha atención en la prensa. Lo que nunca recibió fue dinero. Ninguna empresa quiso fabricarlo: era caro, era raro y lo había inventado una mujer de provincias que ya tenía más de sesenta años.", en: "The only prototype was built in 1962 in a military workshop in Ferrol. Ángela presented it at fairs and exhibitions, received prizes and a great deal of press attention. What she never received was money. No company wanted to manufacture it: it was expensive, it was strange and it had been invented by a provincial woman who was already over sixty." }
  - { es: "Murió en Ferrol en 1975 sin ver fabricado su invento. Durante décadas, casi nadie la recordó. No fue hasta principios de este siglo cuando periodistas e historiadores volvieron a hablar de ella. Hoy su prototipo se conserva en el Museo Nacional de Ciencia y Tecnología de A Coruña, y varias escuelas llevan su nombre.", en: "She died in Ferrol in 1975 without seeing her invention manufactured. For decades, almost nobody remembered her. It was not until the beginning of this century that journalists and historians began to talk about her again. Today her prototype is kept in the National Museum of Science and Technology in A Coruña, and several schools bear her name." }
  - { es: "A ella no le interesaba la fama; lo que quería era que los niños aprendieran con menos esfuerzo y menos peso. No fue la falta de ideas, sino la falta de dinero y de confianza, lo que impidió que el libro del futuro naciera en Galicia. Y sí, es verdad que el mérito se lo llevaron otros. Pero fue ella, y nadie más, quien lo imaginó primero.", en: "She was not interested in fame; what she wanted was for children to learn with less effort and less weight. It was not a lack of ideas, but a lack of money and trust, that prevented the book of the future from being born in Galicia. And yes, it is true that others took the credit. But it was she, and nobody else, who imagined it first." }
questions:
  - { q: "What was Ángela Ruiz Robles by profession?", options: ["An engineer", "A teacher", "A journalist"], answer: 1 }
  - { q: "What problem did she want to solve?", options: ["Children carrying heavy bags of books they could not always afford", "The lack of electricity in schools", "The shortage of teachers"], answer: 0 }
  - { q: "When did she patent her invention?", options: ["In 1918", "In 1949", "In 1975"], answer: 1 }
  - { q: "Why was the invention never manufactured?", options: ["It did not work", "It was expensive, unusual and nobody trusted its inventor", "The patent was stolen"], answer: 1 }
  - { q: "Where is the prototype today?", options: ["In a museum in A Coruña", "In California", "It was lost"], answer: 0 }
