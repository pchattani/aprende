id: a2.u11
title: "Léonard à Amboise"
lessons:
  - id: a2.u11.l1
    title: "La maison de Léonard ? Nous l'avons visitée"
    teach: [g.pc-object-agreement]
    tip: "With avoir, the participle agrees with a direct object that comes before it: La maison ? Je l'ai visitée. Les photos ? Je les ai prises."
    vocab: [w.château, w.chapelle, w.tombeau, w.inventeur, w.invention, w.inventer, w.dessin, w.dessiner, w.prendre-une-photo, w.immense, w.magnifique, w.superbe, w.garder, w.affiche]
    sentences:
      - { es: "La maison de Léonard ? Nous l'avons visitée hier.", en: "Leonardo's house? We visited it yesterday.", altEs: ["La maison de Léonard ? On l'a visitée hier.", "La maison de Léonard, nous l'avons visitée hier."], grammar: [g.pc-object-agreement], vocab: [w.visiter] }
      - { es: "Les dessins de Léonard ? Je les ai vus au Clos Lucé.", en: "Leonardo's drawings? I saw them at the Clos Lucé.", altEs: ["Les dessins de Léonard, je les ai vus au Clos Lucé."], grammar: [g.pc-object-agreement], vocab: [w.dessin] }
      - { es: "Cette photo du château, qui l'a prise ?", en: "This photo of the château, who took it?", altEs: ["Qui a pris cette photo du château ?"], grammar: [g.pc-object-agreement], vocab: [w.château, w.prendre-une-photo] }
      - { es: "Léonard a dessiné des machines pour voler.", en: "Leonardo drew machines for flying.", altEn: ["Leonardo drew flying machines."], grammar: [g.passe-compose-avoir], vocab: [w.dessiner, w.machine] }
      - { es: "C'était un grand inventeur : il a inventé beaucoup de machines.", en: "He was a great inventor: he invented lots of machines.", grammar: [g.pc-vs-imparfait], vocab: [w.inventeur, w.inventer] }
      - { es: "Ses inventions ? On les a construites en grand dans le parc.", en: "His inventions? They've been built full-size in the park.", altEn: ["His inventions? They built them life-size in the park."], grammar: [g.pc-object-agreement], vocab: [w.invention, w.construire] }
      - { es: "Le tombeau de Léonard est dans la chapelle du château.", en: "Leonardo's tomb is in the château's chapel.", grammar: [g.contractions-au-du], vocab: [w.tombeau, w.chapelle] }
      - { es: "Quelle vue magnifique sur la Loire !", en: "What a magnificent view over the Loire!", altEs: ["Quelle vue superbe sur la Loire !"], grammar: [g.quel], vocab: [w.magnifique, w.vue] }
      - { es: "Le parc est immense et les arbres sont superbes.", en: "The park is huge and the trees are superb.", grammar: [g.adjective-agreement], vocab: [w.immense, w.superbe, w.parc] }
      - { es: "Les cartes postales ? Je les ai achetées à Amboise.", en: "The postcards? I bought them in Amboise.", altEs: ["Les cartes postales, je les ai achetées à Amboise."], grammar: [g.pc-object-agreement], vocab: [w.carte-postale, w.acheter] }
      - { es: "L'affiche de La Joconde, tu l'as gardée ?", en: "The Mona Lisa poster, did you keep it?", altEs: ["Tu as gardé l'affiche de La Joconde ?"], grammar: [g.pc-object-agreement], vocab: [w.affiche, w.garder] }
      - { es: "Quelle chambre as-tu choisie ?", en: "Which room did you choose?", altEs: ["Tu as choisi quelle chambre ?"], grammar: [g.pc-object-agreement, g.quel], vocab: [w.chambre, w.choisir] }
      - { es: "Ces chaussures, je les ai achetées à Tours.", en: "These shoes, I bought them in Tours.", grammar: [g.pc-object-agreement], vocab: [w.chaussure], error: { wrong: "Ces chaussures, je les ai acheté à Tours.", explain: "les (= ces chaussures, feminine plural) comes before avoir, so the participle agrees: achetées.", grammar: g.pc-object-agreement } }
      - { es: "J'ai vu la chapelle.", en: "I saw the chapel.", grammar: [g.pc-object-agreement], vocab: [w.chapelle], error: { wrong: "J'ai vue la chapelle.", explain: "No agreement when the object comes after the verb: j'ai vu la chapelle.", grammar: g.pc-object-agreement } }
      - { es: "J'ai pris les photos.", en: "I took the photos.", grammar: [g.pc-object-agreement], vocab: [w.photo], transform: { instruction: "Replace 'les photos' with a pronoun", answer: "Je les ai prises.", en: "I took them." } }
      - { es: "Nous avons visité la chapelle.", en: "We visited the chapel.", grammar: [g.pc-object-agreement], vocab: [w.chapelle], transform: { instruction: "Replace 'la chapelle' with a pronoun", answer: "Nous l'avons visitée.", alt: ["On l'a visitée."], en: "We visited it." } }
    exchanges:
      - q: { es: "Tu as vu les dessins de Léonard ?", en: "Did you see Leonardo's drawings?" }
        a: { es: "Oui, je les ai vus ce matin au Clos Lucé.", en: "Yes, I saw them this morning at the Clos Lucé." }
        alt: ["Oui, je les ai vus.", "Non, je ne les ai pas encore vus."]
        grammar: [g.pc-object-agreement]
        vocab: [w.dessin]
      - q: { es: "La chapelle, vous l'avez visitée ?", en: "The chapel, have you visited it?" }
        a: { es: "Oui, nous l'avons visitée : le tombeau de Léonard est là.", en: "Yes, we've visited it: Leonardo's tomb is there." }
        alt: ["Oui, on l'a visitée.", "Non, pas encore."]
        grammar: [g.pc-object-agreement]
        vocab: [w.chapelle, w.tombeau]
      - q: { es: "Qui a pris ces photos ? Elles sont superbes !", en: "Who took these photos? They're superb!" }
        a: { es: "C'est moi qui les ai prises, avec mon portable.", en: "I took them, with my phone." }
        alt: ["Moi !", "C'est ma sœur qui les a prises."]
        grammar: [g.pc-object-agreement]
        vocab: [w.superbe, w.prendre-une-photo]
      - q: { es: "Qu'est-ce que Léonard a inventé ?", en: "What did Leonardo invent?" }
        a: { es: "Il a dessiné des machines pour voler et des ponts.", en: "He drew flying machines and bridges." }
        alt: ["Beaucoup de machines.", "Des machines incroyables."]
        grammar: [g.passe-compose-avoir]
        vocab: [w.inventer, w.dessiner]
      - q: { es: "Tu as gardé les billets ?", en: "Did you keep the tickets?" }
        a: { es: "Oui, je les ai gardés pour mon album.", en: "Yes, I kept them for my album." }
        alt: ["Oui, je les ai gardés.", "Non, je les ai perdus !"]
        grammar: [g.pc-object-agreement]
        vocab: [w.garder, w.billet]
    texts:
      - title: "Carte postale d'Amboise"
        es: ["Aujourd'hui, nous avons visité le Clos Lucé, la maison de Léonard.", "Ses inventions ? Nous les avons vues dans le parc, en grand !", "La vue sur le château est magnifique."]
        en: ["Today we visited the Clos Lucé, Leonardo's house.", "His inventions? We saw them in the park, full-size!", "The view of the château is magnificent."]
        grammar: [g.pc-object-agreement]
        vocab: [w.invention, w.magnifique, w.château]
      - title: "Léonard en France"
        es: ["En 1516, le roi François Ier a invité Léonard de Vinci en France.", "Le peintre a apporté La Joconde avec lui.", "Il est mort à Amboise en 1519."]
        en: ["In 1516, King Francis I invited Leonardo da Vinci to France.", "The painter brought the Mona Lisa with him.", "He died in Amboise in 1519."]
        grammar: [g.passe-compose-avoir, g.passe-compose-etre]
        vocab: [w.roi, w.apporter]
    spicy:
      - { es: "Ton sourire, je l'ai vu une fois et je ne l'ai jamais oublié.", en: "Your smile, I saw it once and I've never forgotten it.", grammar: [g.pc-object-agreement], vocab: [w.sourire, w.oublier] }
      - { es: "La photo de nous deux ? Je l'ai gardée, évidemment.", en: "The photo of the two of us? I kept it, obviously.", grammar: [g.pc-object-agreement], vocab: [w.garder, w.photo] }
      - { es: "Léonard a inventé beaucoup de machines, mais pas une machine pour arrêter de penser à toi.", en: "Leonardo invented lots of machines, but not a machine to stop thinking about you.", grammar: [g.passe-compose-avoir, g.verbs-plus-infinitive], vocab: [w.inventer, w.machine] }
      - { es: "Ta lettre, je l'ai lue dix fois.", en: "Your letter, I've read it ten times.", grammar: [g.pc-object-agreement], vocab: [w.lettre] }
      - { es: "Tu es plus magnifique que La Joconde, et toi, au moins, tu souris vraiment.", en: "You're more magnificent than the Mona Lisa, and you at least really smile.", grammar: [g.comparatives], vocab: [w.magnifique, w.au-moins] }
  - id: a2.u11.l2
    title: "Tous les châteaux de la Loire"
    teach: [g.tout-chaque-plusieurs]
    tip: "tout le / toute la / tous les / toutes les (the whole, all, every), chaque + singular, plusieurs (several), quelques (a few), chacun (each one)."
    vocab: [w.tout, w.quelques, w.chacun, w.région, w.prince, w.princesse, w.cour, w.cheminée, w.tour.n, w.plafond, w.sol, w.toit]
    sentences:
      - { es: "Nous avons visité tous les châteaux de la région.", en: "We visited all the châteaux in the region.", altEs: ["On a visité tous les châteaux de la région."], grammar: [g.tout-chaque-plusieurs], vocab: [w.tout, w.région] }
      - { es: "Chaque pièce a une cheminée.", en: "Each room has a fireplace.", altEs: ["Il y a une cheminée dans chaque pièce."], grammar: [g.tout-chaque-plusieurs], vocab: [w.cheminée, w.pièce] }
      - { es: "Léonard a passé plusieurs années à Amboise.", en: "Leonardo spent several years in Amboise.", grammar: [g.tout-chaque-plusieurs], vocab: [w.plusieurs, w.passer] }
      - { es: "Tout le monde aime ce jardin.", en: "Everybody loves this garden.", altEn: ["Everyone loves this garden."], grammar: [g.tout-chaque-plusieurs], vocab: [w.tout, w.jardin], error: { wrong: "Tout le monde aiment ce jardin.", explain: "tout le monde takes a singular verb: tout le monde aime.", grammar: g.tout-chaque-plusieurs } }
      - { es: "Il a plu toute la journée, mais nous avons tout vu.", en: "It rained all day, but we saw everything.", grammar: [g.tout-chaque-plusieurs], vocab: [w.tout, w.journée] }
      - { es: "J'ai acheté quelques souvenirs pour ma famille.", en: "I bought a few souvenirs for my family.", grammar: [g.tout-chaque-plusieurs], vocab: [w.quelques, w.souvenir] }
      - { es: "Chacun choisit une salle et on se retrouve dans la cour.", en: "Everyone chooses a room and we meet in the courtyard.", altEs: ["Chacun choisit sa salle et on se retrouve dans la cour."], grammar: [g.tout-chaque-plusieurs], vocab: [w.chacun, w.cour] }
      - { es: "Les rois et toute la cour venaient chasser ici.", en: "The kings and the whole court came hunting here.", grammar: [g.tout-chaque-plusieurs, g.imparfait-uses], vocab: [w.cour, w.roi] }
      - { es: "Les princes et les princesses habitaient au château d'Amboise.", en: "The princes and princesses lived in the château of Amboise.", grammar: [g.imparfait-uses], vocab: [w.prince, w.princesse] }
      - { es: "Regarde le plafond : toutes les peintures sont d'origine.", en: "Look at the ceiling: all the paintings are original.", grammar: [g.tout-chaque-plusieurs], vocab: [w.plafond, w.peinture] }
      - { es: "Le sol de la salle est en pierre et le toit est en ardoise.", en: "The floor of the hall is stone and the roof is slate.", altEn: ["The hall has a stone floor and a slate roof."], grammar: [g.articles-definite], vocab: [w.sol, w.toit] }
      - { es: "On fait un tour en bateau sur la Loire ?", en: "Shall we take a boat trip on the Loire?", altEs: ["Si on faisait un tour en bateau sur la Loire ?"], grammar: [g.on-nous], vocab: [w.tour.n, w.bateau] }
      - { es: "Les visiteurs sont tous partis à six heures.", en: "The visitors all left at six.", altEs: ["Tous les visiteurs sont partis à six heures."], grammar: [g.tout-chaque-plusieurs, g.passe-compose-etre], vocab: [w.tout, w.visiteur], note: "Pronoun tous is pronounced [tus]." }
      - { es: "Il y a plusieurs châteaux près d'Amboise, par exemple Chenonceau.", en: "There are several châteaux near Amboise, for example Chenonceau.", grammar: [g.tout-chaque-plusieurs], vocab: [w.plusieurs, w.château] }
      - { es: "Je visite le château le lundi et le mardi et le mercredi.", en: "I visit the château on Monday and Tuesday and Wednesday.", grammar: [g.tout-chaque-plusieurs], vocab: [w.tout], transform: { instruction: "Say you visit it every day (tous les jours)", answer: "Je visite le château tous les jours.", en: "I visit the château every day." } }
      - { es: "Chaque salle est différente.", en: "Each room is different.", grammar: [g.tout-chaque-plusieurs], vocab: [w.différent], transform: { instruction: "Use toutes les … sont (all the rooms)", answer: "Toutes les salles sont différentes.", en: "All the rooms are different." } }
    exchanges:
      - q: { es: "Vous avez vu tous les châteaux ?", en: "Have you seen all the châteaux?" }
        a: { es: "Non, seulement quelques-uns : Amboise, Chenonceau et Blois.", en: "No, only a few: Amboise, Chenonceau and Blois." }
        alt: ["Oui, nous les avons tous vus !", "Non, il y en a trop."]
        grammar: [g.tout-chaque-plusieurs]
        vocab: [w.tout, w.quelques]
      - q: { es: "Tu viens ici souvent ?", en: "Do you come here often?" }
        a: { es: "Oui, plusieurs fois par an, avec toute ma famille.", en: "Yes, several times a year, with my whole family." }
        alt: ["Tous les étés.", "Chaque année, en mai."]
        grammar: [g.tout-chaque-plusieurs]
        vocab: [w.plusieurs]
      - q: { es: "Il y a une cheminée dans la chambre ?", en: "Is there a fireplace in the bedroom?" }
        a: { es: "Oui, il y en a une dans chaque pièce du château.", en: "Yes, there's one in every room of the château." }
        alt: ["Oui, chaque pièce a une cheminée.", "Non, pas dans celle-ci."]
        grammar: [g.tout-chaque-plusieurs, g.pronoun-en]
        vocab: [w.cheminée]
      - q: { es: "Qui a choisi les souvenirs ?", en: "Who chose the souvenirs?" }
        a: { es: "Chacun a choisi le sien.", en: "Each of us chose our own." }
        alt: ["Tout le monde.", "Chacun a choisi un souvenir."]
        grammar: [g.tout-chaque-plusieurs, g.possessive-pronouns]
        vocab: [w.chacun]
      - q: { es: "Qui habitait dans ce château ?", en: "Who lived in this château?" }
        a: { es: "Les rois de France et toute leur cour.", en: "The kings of France and their whole court." }
        alt: ["Les rois et les princes.", "Toute la famille royale."]
        grammar: [g.tout-chaque-plusieurs, g.imparfait-uses]
        vocab: [w.cour, w.prince]
    texts:
      - title: "Visite guidée"
        es: ["Le château est ouvert tous les jours de neuf heures à dix-huit heures.", "Chaque visiteur reçoit un plan.", "Plusieurs salles ont gardé leurs meubles d'origine."]
        en: ["The château is open every day from nine to six.", "Each visitor receives a map.", "Several rooms have kept their original furniture."]
        grammar: [g.tout-chaque-plusieurs]
        vocab: [w.tout, w.plusieurs]
      - title: "Message de Louis"
        es: ["J'ai visité trois châteaux aujourd'hui et je les ai tous adorés.", "J'ai pris quelques photos des toits et des plafonds.", "Toute la région est magnifique !"]
        en: ["I visited three châteaux today and I loved them all.", "I took a few photos of the roofs and ceilings.", "The whole region is magnificent!"]
        grammar: [g.tout-chaque-plusieurs, g.pc-object-agreement]
        vocab: [w.quelques, w.toit, w.plafond, w.région]
    spicy:
      - { es: "J'ai visité tous les châteaux de la Loire, mais tu es la plus belle vue de la région.", en: "I've visited all the châteaux of the Loire, but you're the most beautiful view in the region.", grammar: [g.tout-chaque-plusieurs, g.superlatives], vocab: [w.tout, w.région] }
      - { es: "Chaque fois que tu souris, j'oublie le nom du roi.", en: "Every time you smile, I forget the king's name.", grammar: [g.tout-chaque-plusieurs], vocab: [w.roi] }
      - { es: "Tu n'es pas un prince, mais tu as plusieurs qualités.", en: "You're not a prince, but you have several qualities.", grammar: [g.tout-chaque-plusieurs], vocab: [w.prince, w.plusieurs] }
      - { es: "Je pense à toi toute la journée, et quelques minutes la nuit.", en: "I think about you all day, and for a few minutes at night.", grammar: [g.tout-chaque-plusieurs], vocab: [w.quelques, w.journée] }
      - { es: "Une princesse, un château, une cheminée... il manque seulement toi.", en: "A princess, a château, a fireplace... the only thing missing is you.", grammar: [g.tout-chaque-plusieurs], vocab: [w.princesse, w.cheminée] }
  - id: a2.u11.l3
    title: "C'est le tien ou le mien ?"
    teach: [g.possessive-pronouns]
    tip: "le mien, la tienne, les nôtres… agree with the thing owned, not the owner: ma valise → la mienne. Simple possession: C'est à moi."
    vocab: [w.le-mien, w.le-tien, w.le-sien, w.le-nôtre, w.le-vôtre, w.le-leur, w.appartenir, w.tenir]
    sentences:
      - { es: "Ce n'est pas mon billet, c'est le tien.", en: "It's not my ticket, it's yours.", altEs: ["C'est pas mon billet, c'est le tien."], grammar: [g.possessive-pronouns], vocab: [w.le-tien, w.billet] }
      - { es: "Ta valise est plus grande que la mienne.", en: "Your suitcase is bigger than mine.", grammar: [g.possessive-pronouns, g.comparatives], vocab: [w.le-mien, w.valise] }
      - { es: "Notre château est petit, le leur est immense.", en: "Our château is small, theirs is huge.", grammar: [g.possessive-pronouns], vocab: [w.le-leur, w.immense] }
      - { es: "Ce parapluie est à vous ?", en: "Is this umbrella yours?", altEs: ["C'est votre parapluie ?", "C'est le vôtre, ce parapluie ?"], grammar: [g.possessive-pronouns], vocab: [w.parapluie] }
      - { es: "Ses enfants et les miens jouent ensemble dans le parc.", en: "Her children and mine play together in the park.", altEn: ["His children and mine play together in the park."], grammar: [g.possessive-pronouns], vocab: [w.le-mien, w.enfant] }
      - { es: "C'est à qui, ce sac ? — C'est le sien.", en: "Whose bag is this? — It's hers.", altEs: ["Il est à qui, ce sac ? — C'est le sien."], altEn: ["Whose is this bag? — It's his."], grammar: [g.possessive-pronouns], vocab: [w.le-sien, w.sac] }
      - { es: "Leur maison est jolie, mais la nôtre a un jardin.", en: "Their house is pretty, but ours has a garden.", grammar: [g.possessive-pronouns], vocab: [w.le-nôtre, w.jardin] }
      - { es: "Nos places sont au premier rang ; où sont les vôtres ?", en: "Our seats are in the front row; where are yours?", grammar: [g.possessive-pronouns], vocab: [w.le-vôtre] }
      - { es: "Ce château appartenait au roi.", en: "This château belonged to the king.", grammar: [g.imparfait-uses], vocab: [w.appartenir, w.roi] }
      - { es: "Tiens mon sac, je cherche les billets.", en: "Hold my bag, I'm looking for the tickets.", grammar: [g.imperative], vocab: [w.tenir, w.sac] }
      - { es: "Mon portable est mort ; je peux utiliser le tien ?", en: "My phone is dead; can I use yours?", grammar: [g.possessive-pronouns], vocab: [w.le-tien, w.portable] }
      - { es: "Les photos de Paul sont belles, mais les tiennes sont meilleures.", en: "Paul's photos are nice, but yours are better.", grammar: [g.possessive-pronouns, g.meilleur-mieux], vocab: [w.le-tien, w.photo] }
      - { es: "Paul ne trouve pas sa voiture : la sienne est rouge.", en: "Paul can't find his car: his is red.", grammar: [g.possessive-pronouns], vocab: [w.le-sien, w.voiture], error: { wrong: "Paul ne trouve pas sa voiture : le sien est rouge.", explain: "The pronoun agrees with the thing owned (la voiture), not with Paul: la sienne.", grammar: g.possessive-pronouns } }
      - { es: "Votre chambre est au deuxième étage ; la nôtre est au premier.", en: "Your room is on the second floor; ours is on the first.", grammar: [g.possessive-pronouns], vocab: [w.le-nôtre, w.étage], error: { wrong: "Votre chambre est au deuxième étage ; la notre est au premier.", explain: "The pronoun le nôtre / la nôtre has a circumflex; the adjective notre doesn't.", grammar: g.possessive-pronouns } }
      - { es: "C'est ma valise.", en: "It's my suitcase.", grammar: [g.possessive-pronouns], vocab: [w.le-mien], transform: { instruction: "Use a possessive pronoun: C'est …", answer: "C'est la mienne.", en: "It's mine." } }
      - { es: "Ce sont leurs billets.", en: "They're their tickets.", grammar: [g.possessive-pronouns], vocab: [w.le-leur], transform: { instruction: "Use a possessive pronoun: Ce sont …", answer: "Ce sont les leurs.", en: "They're theirs." } }
    exchanges:
      - q: { es: "C'est ton sac ?", en: "Is this your bag?" }
        a: { es: "Non, le mien est noir.", en: "No, mine is black." }
        alt: ["Oui, c'est le mien.", "Non, c'est celui de Léa."]
        grammar: [g.possessive-pronouns]
        vocab: [w.le-mien]
      - q: { es: "C'est à qui, ces lunettes ?", en: "Whose glasses are these?" }
        a: { es: "Ce sont les miennes, merci !", en: "They're mine, thanks!" }
        alt: ["Elles sont à moi.", "Ce sont celles de Paul."]
        grammar: [g.possessive-pronouns]
        vocab: [w.le-mien, w.lunettes]
      - q: { es: "Votre voiture est garée devant le château ?", en: "Is your car parked in front of the château?" }
        a: { es: "Non, la nôtre est au parking.", en: "No, ours is in the car park." }
        alt: ["Oui, c'est la nôtre.", "Non, nous sommes venus en train."]
        grammar: [g.possessive-pronouns]
        vocab: [w.le-nôtre]
      - q: { es: "J'ai oublié mon parapluie. Tu me prêtes le tien ?", en: "I forgot my umbrella. Will you lend me yours?" }
        a: { es: "Bien sûr, tiens.", en: "Of course, here you are." }
        alt: ["Désolé, je n'ai pas le mien.", "Oui, prends-le."]
        grammar: [g.possessive-pronouns]
        vocab: [w.le-tien, w.tenir]
      - q: { es: "À qui appartenait le château ?", en: "Who did the château belong to?" }
        a: { es: "Il appartenait aux rois de France.", en: "It belonged to the kings of France." }
        alt: ["Aux rois de France.", "Au roi François Ier."]
        grammar: [g.imparfait-uses]
        vocab: [w.appartenir]
    texts:
      - title: "Objets trouvés"
        es: ["Vous avez perdu un sac bleu dans la chapelle ?", "C'est peut-être le vôtre.", "Venez le chercher à l'accueil du château."]
        en: ["Did you lose a blue bag in the chapel?", "It may be yours.", "Come and collect it at the château's reception."]
        grammar: [g.possessive-pronouns]
        vocab: [w.le-vôtre, w.accueil]
      - title: "Message de Sophie"
        es: ["J'ai pris ta valise à l'hôtel par erreur !", "La mienne est grise, comme la tienne.", "Je te la rapporte ce soir."]
        en: ["I took your suitcase at the hotel by mistake!", "Mine is grey, like yours.", "I'll bring it back to you tonight."]
        grammar: [g.possessive-pronouns]
        vocab: [w.le-mien, w.le-tien]
    spicy:
      - { es: "Ton cœur ou le mien ? On peut échanger.", en: "Your heart or mine? We can swap.", grammar: [g.possessive-pronouns], vocab: [w.le-mien, w.cœur] }
      - { es: "Ta main est froide ; tiens, prends la mienne.", en: "Your hand is cold; here, take mine.", grammar: [g.possessive-pronouns], vocab: [w.le-mien, w.tenir] }
      - { es: "Leur histoire d'amour est belle, mais la nôtre commence ce soir.", en: "Their love story is beautiful, but ours starts tonight.", grammar: [g.possessive-pronouns], vocab: [w.le-nôtre, w.histoire] }
      - { es: "Ce pull est à toi ? Je le garde : il sent ton parfum.", en: "Is this jumper yours? I'm keeping it: it smells of your perfume.", grammar: [g.possessive-pronouns], vocab: [w.garder, w.pull] }
      - { es: "Tes yeux sont plus beaux que les miens, c'est injuste.", en: "Your eyes are more beautiful than mine, it's not fair.", grammar: [g.possessive-pronouns, g.comparatives], vocab: [w.le-mien, w.œil] }
  - id: a2.u11.l4
    title: "À la boutique du château"
    teach: [g.pc-object-agreement, g.possessive-pronouns]
    tip: "Talking about souvenirs: La lampe ? Je l'ai achetée. Ces porte-clés, ce sont les nôtres."
    vocab: [w.boutique, w.porte-clés, w.emporter, w.tapis, w.miroir, w.meuble, w.étagère, w.armoire, w.fauteuil, w.lampe, w.salle-à-manger, w.lumière]
    sentences:
      - { es: "Les porte-clés ? Je les ai achetés à la boutique du château.", en: "The key rings? I bought them at the château shop.", altEs: ["Les porte-clés, je les ai achetés à la boutique du château."], grammar: [g.pc-object-agreement], vocab: [w.porte-clés, w.boutique] }
      - { es: "Cette lampe, je l'ai trouvée dans une brocante à Tours.", en: "This lamp, I found it at a flea market in Tours.", grammar: [g.pc-object-agreement], vocab: [w.lampe, w.brocante] }
      - { es: "Dans la salle à manger, il y a une immense cheminée et un vieux tapis.", en: "In the dining room there's a huge fireplace and an old rug.", grammar: [g.il-y-a], vocab: [w.salle-à-manger, w.tapis] }
      - { es: "La chambre de Léonard a gardé ses meubles d'époque.", en: "Leonardo's bedroom has kept its period furniture.", grammar: [g.passe-compose-avoir], vocab: [w.meuble, w.époque] }
      - { es: "Le miroir ? Nous l'avons mis au-dessus du fauteuil.", en: "The mirror? We put it above the armchair.", altEs: ["Le miroir, on l'a mis au-dessus du fauteuil."], grammar: [g.pc-object-agreement], vocab: [w.miroir, w.fauteuil] }
      - { es: "Cette armoire est à toi ou à ta sœur ?", en: "Is this wardrobe yours or your sister's?", altEs: ["Cette armoire, c'est la tienne ou celle de ta sœur ?"], grammar: [g.possessive-pronouns], vocab: [w.armoire] }
      - { es: "Mes livres sont sur l'étagère ; les tiens sont dans le carton.", en: "My books are on the shelf; yours are in the box.", grammar: [g.possessive-pronouns], vocab: [w.étagère, w.le-tien] }
      - { es: "On peut emporter les affiches ?", en: "Can we take the posters away?", altEs: ["Est-ce qu'on peut emporter les affiches ?"], grammar: [g.modal-verbs], vocab: [w.emporter, w.affiche] }
      - { es: "La lumière entre par les grandes fenêtres.", en: "The light comes in through the big windows.", grammar: [g.articles-definite], vocab: [w.lumière, w.fenêtre] }
      - { es: "Les tasses que j'ai achetées sont pour ma mère.", en: "The cups I bought are for my mother.", grammar: [g.pc-object-agreement], vocab: [w.tasse, w.acheter] }
      - { es: "Ton souvenir est joli, mais le mien est plus original.", en: "Your souvenir is pretty, but mine is more original.", grammar: [g.possessive-pronouns, g.comparatives], vocab: [w.le-mien, w.souvenir] }
      - { es: "Quelle affiche as-tu prise ? La Joconde ?", en: "Which poster did you take? The Mona Lisa?", altEs: ["Tu as pris quelle affiche ? La Joconde ?"], grammar: [g.pc-object-agreement, g.quel], vocab: [w.affiche] }
      - { es: "Les clés ? Je les ai mises sur la table.", en: "The keys? I put them on the table.", grammar: [g.pc-object-agreement], vocab: [w.clé], error: { wrong: "Les clés ? Je les ai mis sur la table.", explain: "les (= les clés, feminine plural) comes before avoir: mises, and you hear the s.", grammar: g.pc-object-agreement } }
      - { es: "J'ai acheté cette lampe.", en: "I bought this lamp.", grammar: [g.pc-object-agreement], vocab: [w.lampe], transform: { instruction: "Replace 'cette lampe' with a pronoun", answer: "Je l'ai achetée.", en: "I bought it." } }
      - { es: "Ce fauteuil est à nous.", en: "This armchair is ours.", grammar: [g.possessive-pronouns], vocab: [w.fauteuil], transform: { instruction: "Use a possessive pronoun: C'est …", answer: "C'est le nôtre.", en: "It's ours." } }
    exchanges:
      - q: { es: "Tu as trouvé des souvenirs ?", en: "Did you find any souvenirs?" }
        a: { es: "Oui, des porte-clés ; je les ai achetés à la boutique.", en: "Yes, some key rings; I bought them at the shop." }
        alt: ["Oui, une affiche.", "Non, rien d'intéressant."]
        grammar: [g.pc-object-agreement]
        vocab: [w.porte-clés, w.boutique]
      - q: { es: "Où as-tu mis la lampe ?", en: "Where did you put the lamp?" }
        a: { es: "Je l'ai mise à côté du fauteuil.", en: "I put it next to the armchair." }
        alt: ["À côté du fauteuil.", "Je l'ai mise sur l'étagère."]
        grammar: [g.pc-object-agreement]
        vocab: [w.lampe, w.fauteuil]
      - q: { es: "Sur place ou à emporter ?", en: "Eat in or take away?" }
        a: { es: "À emporter, s'il vous plaît.", en: "Take away, please." }
        alt: ["Sur place.", "À emporter, merci."]
        grammar: [g.je-voudrais]
        vocab: [w.emporter]
      - q: { es: "Ce sont vos meubles ?", en: "Is this your furniture?" }
        a: { es: "Non, les nôtres sont encore dans le camion.", en: "No, ours are still in the van." }
        alt: ["Oui, ce sont les nôtres.", "Non, ils sont à nos voisins."]
        grammar: [g.possessive-pronouns]
        vocab: [w.meuble, w.le-nôtre]
      - q: { es: "Il y a beaucoup de lumière dans la salle à manger ?", en: "Is there a lot of light in the dining room?" }
        a: { es: "Oui, elle a trois grandes fenêtres.", en: "Yes, it has three big windows." }
        alt: ["Oui, beaucoup.", "Non, elle est un peu sombre."]
        grammar: [g.il-y-a]
        vocab: [w.lumière, w.salle-à-manger]
    texts:
      - title: "Liste de souvenirs"
        es: ["Pour Maman : une tasse avec La Joconde.", "Pour Paul : un porte-clés en forme de château.", "Pour moi : l'affiche de la machine pour voler. Je l'ai déjà achetée !"]
        en: ["For Mum: a cup with the Mona Lisa.", "For Paul: a key ring shaped like a château.", "For me: the poster of the flying machine. I've already bought it!"]
        grammar: [g.pc-object-agreement]
        vocab: [w.tasse, w.porte-clés, w.affiche]
      - title: "Dans la chambre de Léonard"
        es: ["La chambre est simple : un lit, une cheminée, quelques meubles.", "Par la fenêtre, on voit le château d'Amboise.", "La lumière est très belle le soir."]
        en: ["The bedroom is simple: a bed, a fireplace, a few pieces of furniture.", "Through the window you can see the château of Amboise.", "The light is very beautiful in the evening."]
        grammar: [g.tout-chaque-plusieurs]
        vocab: [w.meuble, w.lumière]
    spicy:
      - { es: "Le miroir de la boutique dit que je suis beau. Et toi, qu'est-ce que tu dis ?", en: "The mirror in the shop says I'm handsome. And what do you say?", altEs: ["Le miroir de la boutique dit que je suis belle. Et toi, qu'est-ce que tu dis ?"], grammar: [g.present-er], vocab: [w.miroir, w.boutique] }
      - { es: "Ce fauteuil est pour deux ; le tien ou le mien ?", en: "This armchair is for two; yours or mine?", grammar: [g.possessive-pronouns], vocab: [w.fauteuil, w.le-mien] }
      - { es: "La carte postale ? Je l'ai écrite, mais je ne l'ai pas envoyée : je préfère te la lire.", en: "The postcard? I wrote it, but I didn't send it: I'd rather read it to you.", grammar: [g.pc-object-agreement], vocab: [w.carte-postale, w.envoyer] }
      - { es: "Éteins la lampe ; la lumière de la cheminée est plus romantique.", en: "Turn off the lamp; the light from the fireplace is more romantic.", grammar: [g.imperative, g.comparatives], vocab: [w.lampe, w.lumière, w.éteindre] }
      - { es: "Je peux emporter ton numéro ? C'est mon souvenir préféré.", en: "Can I take your number away with me? It's my favourite souvenir.", grammar: [g.modal-verbs], vocab: [w.emporter, w.souvenir] }
dialogues:
  - id: a2.u11.d1
    title: "Retour du Clos Lucé"
    context: "Paul and Léa are back at their hotel in Amboise after visiting Leonardo da Vinci's house."
    lines:
      - { speaker: Léa, es: "Alors, tu as aimé la maison de Léonard ?", en: "So, did you like Leonardo's house?" }
      - { speaker: Paul, es: "Je l'ai adorée ! Et toutes les machines dans le parc, quelle merveille.", en: "I loved it! And all the machines in the park, what a marvel." }
      - { speaker: Léa, es: "Moi, j'ai préféré sa chambre. Elle est simple, avec quelques meubles et une cheminée.", en: "I preferred his bedroom. It's simple, with a few pieces of furniture and a fireplace." }
      - { speaker: Paul, es: "Tu as pris des photos ?", en: "Did you take any photos?" }
      - { speaker: Léa, es: "Oui, je les ai prises avec ton portable. Le mien n'avait plus de batterie.", en: "Yes, I took them with your phone. Mine had no battery left." }
      - { speaker: Paul, es: "Ah, c'est pour ça ! Et les affiches, tu les as achetées ?", en: "Ah, that's why! And the posters, did you buy them?" }
      - { speaker: Léa, es: "Oui, une pour moi et une pour toi. La tienne, c'est La Joconde.", en: "Yes, one for me and one for you. Yours is the Mona Lisa." }
      - { speaker: Paul, es: "Et la tienne ?", en: "And yours?" }
      - { speaker: Léa, es: "La machine pour voler, évidemment !", en: "The flying machine, of course!" }
      - { speaker: Paul, es: "Demain, on visite le château et la chapelle. Le tombeau de Léonard est là.", en: "Tomorrow we're visiting the château and the chapel. Leonardo's tomb is there." }
    questions:
      - { q: "Qu'est-ce que Paul a adoré ?", options: ["La chapelle", "La maison de Léonard et les machines", "La boutique"], answer: 1, explain: "Paul says: Je l'ai adorée ! Et toutes les machines dans le parc…" }
      - { q: "Avec quel portable est-ce que Léa a pris les photos ?", options: ["Avec le sien", "Avec celui de Paul", "Avec celui de sa mère"], answer: 1, explain: "She took them with Paul's phone because hers had no battery." }
      - { q: "Quelle affiche est pour Paul ?", options: ["La Joconde", "La machine pour voler", "Le château"], answer: 0, explain: "La tienne, c'est La Joconde." }
      - { q: "Où est le tombeau de Léonard ?", options: ["Dans le parc", "Dans sa chambre", "Dans la chapelle du château"], answer: 2, explain: "Paul says Leonardo's tomb is in the chapel they will visit tomorrow." }
writing:
  - task: "Your friend asks about your visit to Leonardo's house. Answer, using le, la, l' or les before the passé composé (careful with agreement)."
    es: "Alors, tu as visité le Clos Lucé ? Tu as vu la maison de Léonard ? Et ses dessins ?"
    min: 30
    max: 70
    use: [w.visiter, w.dessin, w.invention, w.magnifique, w.prendre-une-photo]
    useAtLeast: 3
    grammar: [g.pc-object-agreement]
    expect:
      - { pattern: "\\b(l['’]|les )(ai|as|a|avons|avez|ont) [a-zàâçéèêëîïôûùœ]+", hint: "Put the pronoun before avoir: je l'ai visitée, je les ai vus…" }
    model: { es: "Oui, je l'ai visité hier ! La maison de Léonard ? Je l'ai trouvée très belle. Ses dessins, je les ai vus dans une grande salle. Ses inventions sont magnifiques : je les ai prises en photo ! Et toi, tu as vu le château d'Amboise ?", en: "Yes, I visited it yesterday! Leonardo's house? I found it very beautiful. His drawings, I saw them in a big room. His inventions are magnificent: I took photos of them! And you, have you seen the Château d'Amboise?" }
  - task: "Describe the castles of the Loire you have visited, using tout / tous / toutes, chaque, plusieurs, quelques and chacun."
    min: 30
    max: 70
    use: [w.château, w.chacun, w.quelques, w.cheminée, w.région]
    useAtLeast: 3
    grammar: [g.tout-chaque-plusieurs]
    expect:
      - { pattern: "\\b(tous|toutes|tout le|toute la|chaque|plusieurs|quelques|chacun|chacune)\\b", hint: "Use tous / toutes, chaque, plusieurs…" }
    model: { es: "J'ai visité plusieurs châteaux de la région. Tous les châteaux sont immenses, mais chaque château est différent. À Chambord, toutes les chambres ont une grande cheminée. Il y a aussi quelques jardins magnifiques. Chacun a son histoire, et j'ai adoré tous les plafonds !", en: "I've visited several castles in the region. All the castles are huge, but each castle is different. At Chambord, all the rooms have a big fireplace. There are also a few magnificent gardens. Each one has its own history, and I loved all the ceilings!" }
  - task: "After the visit, everyone's bags and souvenirs are mixed up on the table. Write who owns what (C'est le mien, la tienne, les siennes…)."
    min: 30
    max: 70
    use: [w.le-mien, w.le-tien, w.le-sien, w.le-nôtre, w.appartenir]
    useAtLeast: 3
    grammar: [g.possessive-pronouns]
    expect:
      - { pattern: "\\b(le|la|les) (mien|mienne|miens|miennes|tien|tienne|tiens|tiennes|sien|sienne|siens|siennes|n[oô]tre|n[oô]tres|v[oô]tre|v[oô]tres|leur|leurs)\\b", hint: "Use possessive pronouns: c'est le mien, la tienne, les siens…" }
    model: { es: "Attention, ce sac rouge n'est pas à toi, c'est le mien ! Le tien est bleu. Ces cartes postales, ce sont les siennes : Léa les a achetées à la boutique. Et ces porte-clés ? Ce sont les nôtres. Ce parapluie appartient à Hugo, c'est le sien.", en: "Careful, this red bag isn't yours, it's mine! Yours is blue. These postcards are hers: Léa bought them at the shop. And these key rings? They're ours. This umbrella belongs to Hugo, it's his." }
  - task: "At the castle shop you bought souvenirs. Say what you bought for whom, referring back with pronouns (Les porte-clés ? Je les ai achetés pour…)."
    min: 30
    max: 70
    use: [w.boutique, w.porte-clés, w.affiche, w.emporter, w.miroir]
    useAtLeast: 3
    grammar: [g.pc-object-agreement]
    expect:
      - { pattern: "\\b(l['’]|les )(ai|as|a|avons|avez|ont) [a-zàâçéèêëîïôûùœ]+", hint: "Refer back with a pronoun before avoir: je les ai achetés, je l'ai prise…" }
    model: { es: "À la boutique du château, j'ai trouvé de jolis souvenirs. Les porte-clés ? Je les ai achetés pour mes cousins. L'affiche de Léonard, je l'ai prise pour ma chambre. Et la petite lampe ? Je l'ai offerte à ma mère. Je n'ai pas pu emporter le miroir : il était trop grand !", en: "At the castle shop I found some nice souvenirs. The key rings? I bought them for my cousins. The Leonardo poster, I took it for my bedroom. And the little lamp? I gave it to my mother. I couldn't take the mirror: it was too big!" }
