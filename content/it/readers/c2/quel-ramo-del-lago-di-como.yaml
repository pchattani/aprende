id: r.c2.quel-ramo-del-lago-di-como
level: c2
title: Quel ramo del lago di Como
kind: literature
author: Alessandro Manzoni (1785–1873)
source: "I promessi sposi, capitolo I (edizione definitiva, 1840–1842), inizio. Dominio pubblico. I tagli sono segnati con (…)."
intro: "The most famous opening in Italian prose. Manzoni's camera starts with a wide shot of the lake and the mountains, closes in on Lecco and its Spanish garrison, and finally on a narrow lane where a timid parish priest, don Abbondio, is about to meet two men who will change his life. Notice the long, balanced periods, the irony about the Spanish soldiers, and the ottocento forms (vien, lascian, de', ufizio)."
allow: [manzoni, como, adda, martino, resegone, milano, lecco, abbondio, lombarda, don, de', co', que']
paragraphs:
  - { es: "Quel ramo del lago di Como, che volge a mezzogiorno, tra due catene non interrotte di monti, tutto a seni e a golfi, a seconda dello sporgere e del rientrare di quelli, vien, quasi a un tratto, a ristringersi, e a prender corso e figura di fiume, tra un promontorio a destra, e un'ampia costiera dall'altra parte; e il ponte, che ivi congiunge le due rive, par che renda ancor più sensibile all'occhio questa trasformazione, e segni il punto in cui il lago cessa, e l'Adda rincomincia, per ripigliar poi nome di lago dove le rive, allontanandosi di nuovo, lascian l'acqua distendersi e rallentarsi in nuovi golfi e in nuovi seni.", en: "That branch of Lake Como which turns south, between two unbroken chains of mountains, all bays and inlets according to how they jut out and draw back, suddenly, as it were, narrows and takes on the course and shape of a river, between a headland on the right and a broad stretch of shore on the other side; and the bridge that joins the two banks there seems to make this transformation even more visible to the eye, marking the point where the lake ends and the Adda begins again, only to take the name of lake once more where the banks, drawing apart again, let the water spread out and slow down into new bays and new inlets." }
  - { es: "La costiera, formata dal deposito di tre grossi torrenti, scende appoggiata a due monti contigui, l'uno detto di san Martino, l'altro, con voce lombarda, il Resegone, dai molti suoi cocuzzoli in fila, che in vero lo fanno somigliare a una sega: talché non è chi, al primo vederlo, purché sia di fronte, come per esempio di su le mura di Milano che guardano a settentrione, non lo discerna tosto, a un tal contrassegno, in quella lunga e vasta giogaia, dagli altri monti di nome più oscuro e di forma più comune.", en: "The shore, formed by the deposits of three large mountain streams, slopes down against two neighbouring mountains, one called San Martino, the other, with a Lombard word, the Resegone, from its many peaks in a row, which really do make it look like a saw: so that there is nobody who, on first seeing it – as long as it is from the front, as for example from the walls of Milan that face north – does not at once pick it out by that mark, in that long, vast ridge, from the other mountains of more obscure name and more ordinary shape." }
  - { es: "Per un buon pezzo, la costa sale con un pendìo lento e continuo; poi si rompe in poggi e in valloncelli, in erte e in ispianate, secondo l'ossatura de' due monti, e il lavoro dell'acque. Il lembo estremo, tagliato dalle foci de' torrenti, è quasi tutto ghiaia e ciottoloni; il resto, campi e vigne, sparse di terre, di ville, di casali; in qualche parte boschi, che si prolungano su per la montagna.", en: "For a good stretch the slope rises gently and steadily; then it breaks up into knolls and little valleys, steep slopes and level ground, following the bones of the two mountains and the work of the waters. The outermost edge, cut by the mouths of the streams, is almost all gravel and large pebbles; the rest is fields and vineyards, scattered with villages, country houses and farmsteads; here and there woods that stretch up the mountain." }
  - { es: "Lecco, la principale di quelle terre, e che dà nome al territorio, giace poco discosto dal ponte, alla riva del lago, anzi viene in parte a trovarsi nel lago stesso, quando questo ingrossa: un gran borgo al giorno d'oggi, e che s'incammina a diventar città.", en: "Lecco, the chief of those places, which gives its name to the district, lies a short distance from the bridge, on the shore of the lake – indeed it partly ends up in the lake itself when the water rises: a large town nowadays, and well on its way to becoming a city." }
  - { es: "Ai tempi in cui accaddero i fatti che prendiamo a raccontare, quel borgo, già considerabile, era anche un castello, e aveva perciò l'onore d'alloggiare un comandante, e il vantaggio di possedere una stabile guarnigione di soldati spagnoli, che insegnavan la modestia alle fanciulle e alle donne del paese, accarezzavan di tempo in tempo le spalle a qualche marito, a qualche padre; e, sul finir dell'estate, non mancavan mai di spandersi nelle vigne, per diradar l'uve, e alleggerire a' contadini le fatiche della vendemmia.", en: "At the time when the events we are setting out to tell took place, that town, already of some size, was also a fortress, and therefore had the honour of lodging a commander and the advantage of possessing a permanent garrison of Spanish soldiers, who taught modesty to the girls and women of the place, stroked the backs of the odd husband or father from time to time; and, at the end of summer, never failed to spread out into the vineyards to thin out the grapes and lighten the labours of the harvest for the peasants." }
  - { es: "(…) Per una di queste stradicciole, tornava bel bello dalla passeggiata verso casa, sulla sera del giorno 7 novembre dell'anno 1628, don Abbondio, curato d'una delle terre accennate di sopra: il nome di questa, né il casato del personaggio, non si trovan nel manoscritto, né a questo luogo né altrove.", en: "(…) Along one of these little lanes, on the evening of 7 November 1628, don Abbondio, parish priest of one of the villages mentioned above, was strolling home at his ease from his walk: neither the name of the village nor the surname of the man is to be found in the manuscript, either at this point or anywhere else." }
  - { es: "Diceva tranquillamente il suo ufizio, e talvolta, tra un salmo e l'altro, chiudeva il breviario, tenendovi dentro, per segno, l'indice della mano destra, e, messa poi questa nell'altra dietro la schiena, proseguiva il suo cammino, guardando a terra, e buttando con un piede verso il muro i ciottoli che facevano inciampo nel sentiero: poi alzava il viso, e, girati oziosamente gli occhi all'intorno, li fissava alla parte d'un monte, dove la luce del sole già scomparso, scappando per i fessi del monte opposto, si dipingeva qua e là sui massi sporgenti, come a larghe e inuguali pezze di porpora.", en: "He was calmly saying his office, and now and then, between one psalm and the next, he would close his breviary, keeping his right forefinger inside it as a bookmark, and, then putting that hand in the other behind his back, he went on his way, looking at the ground and kicking towards the wall the pebbles that got in the way on the path: then he would raise his face and, idly casting his eyes around, fix them on the side of a mountain where the light of the sun, already set, slipping through the clefts of the opposite mountain, painted itself here and there on the jutting rocks, like wide, uneven patches of purple." }
  - { es: "(…) Il curato, voltata la stradetta, e dirizzando, com'era solito, lo sguardo al tabernacolo, vide una cosa che non s'aspettava, e che non avrebbe voluto vedere. Due uomini stavano, l'uno dirimpetto all'altro, al confluente, per dir così, delle due viottole: un di costoro, a cavalcioni sul muricciolo basso, con una gamba spenzolata al di fuori, e l'altro piede posato sul terreno della strada; il compagno, in piedi, appoggiato al muro, con le braccia incrociate sul petto.", en: "(…) The priest, having turned the bend in the lane and directing his gaze, as usual, at the wayside shrine, saw something he did not expect and would not have wished to see. Two men were standing, one opposite the other, at the confluence, so to speak, of the two paths: one of them astride the low wall, with one leg dangling over the outside and the other foot resting on the ground of the lane; his companion standing, leaning against the wall, with his arms folded on his chest." }
questions:
  - { q: "Come si muove lo sguardo del narratore nelle prime pagine?", options: ["Da un dettaglio piccolo verso il paesaggio intero", "Dal paesaggio ampio del lago verso Lecco e poi verso una stradina e un personaggio", "Salta continuamente tra passato e futuro"], answer: 1, explain: "Like a camera zooming in: the lake, the mountains, Lecco, the lane, don Abbondio, the two men." }
  - { q: "Perché il monte si chiama Resegone?", options: ["Per il nome di un santo", "Perché i suoi molti cocuzzoli in fila lo fanno somigliare a una sega", "Perché è rosso al tramonto"], answer: 1, explain: "«dai molti suoi cocuzzoli in fila, che in vero lo fanno somigliare a una sega» – resega is Lombard for 'saw'." }
  - { q: "Che tono usa Manzoni quando descrive i soldati spagnoli che «insegnavan la modestia alle fanciulle» e aiutavano nella vendemmia?", options: ["Ammirazione sincera", "Ironia: in realtà molestavano le donne, picchiavano gli uomini e rubavano l'uva", "Indifferenza"], answer: 1, explain: "Antiphrasis: the narrator says the opposite of what he means. 'Teaching modesty', 'stroking backs' and 'thinning the grapes' mean harassment, beatings and theft." }
  - { q: "Che cosa sta facendo don Abbondio quando lo incontriamo?", options: ["Sta tornando a casa dalla passeggiata, leggendo il breviario", "Sta celebrando un matrimonio", "Sta scappando dai soldati"], answer: 0, explain: "«tornava bel bello dalla passeggiata verso casa… Diceva tranquillamente il suo ufizio» – the office is the daily prayers in the breviary." }
  - { q: "Il narratore dice che il nome del paese «non si trova nel manoscritto». Di quale finzione si tratta?", options: ["Manzoni finge di trascrivere un manoscritto anonimo del Seicento", "Manzoni ha perso il suo manoscritto", "Il paese non è mai esistito"], answer: 0, explain: "The novel pretends to rework a 17th-century anonymous manuscript – a device Manzoni uses to comment ironically on his 'source'." }
