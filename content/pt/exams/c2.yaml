reading:
  text: |
    Há quem chegue ao Douro à espera de uma paisagem natural e encontre outra coisa: uma obra humana à escala de uma montanha. Os socalcos que descem até ao rio, sustentados por muros de pedra seca, foram construídos à mão ao longo de séculos, muitas vezes por homens e mulheres que nunca beberam um copo do vinho que ali se produzia. Não admira que a região seja Património Mundial; admira, sim, que alguém a tenha conseguido construir.

    O vinho do Porto, por estranho que pareça, deve o nome a uma cidade onde não se planta uma única vinha. Durante séculos, as pipas desciam o rio em barcos rabelos até às caves de Vila Nova de Gaia, do outro lado do rio, em frente ao Porto, onde o vinho envelhecia antes de seguir para Inglaterra. Em 1756, o Marquês de Pombal mandou marcar os limites da região, fazendo dela uma das primeiras zonas de vinho com regras próprias do mundo. As pedras que assinalavam esses limites ainda hoje se encontram, aqui e ali, entre as vinhas.

    Quem lá vai em setembro, na altura das vindimas, assiste a um espetáculo que mudou menos do que se julga. É certo que as máquinas chegaram e que os lagares de pedra, onde as uvas eram pisadas a pé ao som de música, deram lugar, em muitas quintas, a máquinas modernas. Mas ainda há quem faça questão de manter a tradição, nem que seja por uma noite, e os turistas pagam com gosto para tirar os sapatos e entrar no lagar.

    Seria, porém, um erro ver no Douro apenas um postal. A população envelhece, os jovens partem para o litoral ou para o estrangeiro e as alterações climáticas fazem as vindimas começar cada vez mais cedo. Os donos das quintas mais atentos já andam a plantar uvas que aguentam melhor o calor e a voltar a plantar variedades esquecidas. Dir-se-ia que o futuro da região dependerá, uma vez mais, da coragem de quem lá vive: a mesma que, há trezentos anos, transformou a pedra em vinha.
  questions:
    - { q: "What does the author find most remarkable about the Douro landscape?", options: ["That it is completely natural", "That it is flat and easy to farm", "That it was built by hand over centuries, on the scale of a mountain"], answer: 2 }
    - { q: "Why is port wine named after a city where no vines are grown?", options: ["Because the wine was aged in lodges at Gaia, opposite Porto, and shipped from there", "Because the city's name sounded better", "Because Pombal was born in Porto"], answer: 0 }
    - { q: "What did Pombal do in 1756?", options: ["He banned port wine", "He had the region demarcated, making it one of the first regulated wine areas", "He built the first lodges in Gaia"], answer: 1 }
    - { q: "What does the text say about treading grapes by foot?", options: ["It has disappeared completely", "It is required by law", "Modern machines have replaced it in many estates, but some keep the tradition and tourists pay to take part"], answer: 2 }
    - { q: "What threats to the region does the last paragraph mention?", options: ["Too many young people", "An ageing population, emigration and climate change bringing the harvest forward", "A lack of tourists"], answer: 1 }
