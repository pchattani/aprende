# Interface text in the target language (keys are fixed; values are per course).
# `{word}`, `{region}` and `{language}` are placeholders filled in by the app.
appName: Aprende
tagline: Spanish, from your first words to fluency
welcome:
  title: Leo, Bonchita and Luna are off to Argentina
  intro: Three small dogs, one big country, and only you can talk to the locals. Luna has the map, Leo has the ball, Bonchita has the appetite. Every unit is a stop on the road from Buenos Aires to the end of the world. Where should the journey start? Everything is open; this just marks the first stop.
  firstStop: "Land in Buenos Aires: A1, lesson 1."
greetings: { morning: Buenos días, afternoon: Buenas tardes, evening: Buenas noches }
feedback: { correct: ¡Correcto!, almost: ¡Casi!, goalDone: ¡Olé! }
stampEarned: ¡Sello conseguido!
spicyName: Modo picante
games: { name: Palabras, memory: Memoria, rapid: Rápido, win: ¡Lo lograste! }
dogsPage: Los perros
quizGreat: ¡Muy bien!
whatDoesItMean: ¿Qué significa “{word}”?
badgeName: insignia de {region}
typePlaceholder: Escribe en español
voiceTest: Hola, ¿qué tal? Me llamo Aprende y voy a ayudarte con el español.
voiceHelp: No Spanish voice installed. On Windows add “Spanish (Spain)” speech in Settings → Time & Language; on Android install Google TTS Spanish; iOS and macOS include Mónica/Jorge.
pronunciationIntro: Spanish spelling is almost perfectly regular. Learn the sounds once and read anything aloud.
cheers:
  - { es: "¡Olé!", en: "Bravo!" }
  - { es: "¡Qué bien!", en: "Nice one!" }
  - { es: "¡Genial!", en: "Great!" }
  - { es: "¡Vaya crack!", en: "What a star!" }
  - { es: "¡Así se hace!", en: "That's how it's done!" }
  - { es: "¡De lujo!", en: "Superb!" }
