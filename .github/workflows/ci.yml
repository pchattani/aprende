name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Every live course in courses.json: content check and unit tests with VITE_LANG set
      - run: npm run check:all
      # The Pawsport hub builds to dist/ (the site root), every course to dist/<slug>/
      - run: npm run build:all
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # e2e runs against dist/ served at /aprende/ by scripts/serve-dist.mjs (started by Playwright)
      - name: Hub
        run: npm run test:e2e -- e2e/hub.spec.ts
      - name: Spanish
        run: npm run test:e2e -- e2e/app.spec.ts e2e/listen.spec.ts e2e/palabras.spec.ts
      - name: Smoke-test every course
        run: node scripts/courses.mjs "npx playwright test e2e/sister.spec.ts"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    # Publishes dist/ to the gh-pages branch, which GitHub Pages serves at
    # https://pchattani.github.io/aprende/ (Settings -> Pages -> source: gh-pages):
    # the Pawsport hub at /aprende/, each course in dist/<slug>/ → /aprende/<slug>/.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
