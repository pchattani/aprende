id: r.b2.the-reclamation-debate
level: b2
title: 辯論：應唔應該填海起屋？
kind: dialogue
intro: In the final of an inter-school debating competition (the schools are invented), two secondary-school teams argue whether Hong Kong should reclaim land from the sea to build housing. The chair keeps time while the speakers present arguments, evidence and rebuttals.
allow: [阿琛, 阿蕎]
paragraphs:
  - { es: "主席：「各位評判、各位觀眾，歡迎嚟到今年中學辯論比賽嘅決賽。今日嘅辯題係『香港應該填海起屋』。正方係海景書院，反方係山城中學。每位辯員有三分鐘發言。首先請正方第一位辯員阿琛。」", en: "Chair: \"Judges, ladies and gentlemen, welcome to the final of this year's secondary school debating competition. Today's motion is 'Hong Kong should reclaim land to build housing'. The proposition is Sea View College and the opposition is Hill Town Secondary School. Each speaker has three minutes. First, I invite the first speaker for the proposition, Ah Sum.\"" }
  - { es: "阿琛：「多謝主席。香港有超過二十萬人住喺劏房，有啲一家四口住喺一百呎都冇嘅地方。輪候公屋平均要等五六年。換句話講，香港最大嘅問題係冇地。填海可以喺短時間內提供大片土地，起大量公屋。歷史證明，中環、灣仔、啟德好多地方都係填海得返嚟嘅，冇填海，就冇今日嘅香港。」", en: "Ah Sum: \"Thank you, Chair. More than two hundred thousand people in Hong Kong live in subdivided flats; some families of four live in less than a hundred square feet. The average wait for public housing is five or six years. In other words, Hong Kong's biggest problem is a lack of land. Reclamation can provide large areas of land in a short time and allow large amounts of public housing to be built. History proves it: much of Central, Wan Chai and Kai Tak was reclaimed from the sea. Without reclamation, there would be no Hong Kong as we know it today.\"" }
  - { es: "主席：「多謝。請反方第一位辯員阿蕎。」阿蕎：「多謝主席。正方話香港冇地，但係呢個講法唔準確。根據研究，香港仲有唔少棕地同閒置嘅土地，例如新界好多貨櫃場同停車場。我哋應該先用好呢啲地，而唔係即刻將海填平。填海唔單止成本極高，以千億計，而且需要十幾年先可以起好屋，根本解決唔到而家嘅問題。」", en: "Chair: \"Thank you. I invite the first speaker for the opposition, Ah Kiu.\" Ah Kiu: \"Thank you, Chair. The proposition says Hong Kong has no land, but that claim isn't accurate. According to research, Hong Kong still has plenty of brownfield sites and idle land, such as the many container yards and car parks in the New Territories. We should make good use of this land first, rather than immediately filling in the sea. Reclamation is not only extremely expensive - costing hundreds of billions - but it also takes more than ten years before homes can be built, so it simply can't solve today's problem.\"" }
  - { es: "阿蕎繼續講：「仲有，填海會對環境造成好大嘅破壞。大嶼山附近嘅中華白海豚，數量喺過去二十年已經大幅減少，專家認為填海同工程係其中一個主要原因。海洋生態一旦破壞，係冇得返轉頭嘅。」", en: "Ah Kiu continued: \"What's more, reclamation does enormous damage to the environment. The number of Chinese white dolphins around Lantau has fallen sharply over the past twenty years, and experts believe reclamation and construction work are among the main causes. Once the marine ecosystem is destroyed, there's no going back.\"" }
  - { es: "主席：「好，而家進入自由辯論環節。」正方第二位辯員：「反方話用棕地，我哋同意。但係棕地分散喺唔同地方，好多業權好複雜，收地要好多年。點解唔可以兩樣一齊做？填海同發展棕地並唔矛盾。」", en: "Chair: \"Right, we now move to the open debate.\" Second proposition speaker: \"The opposition says use brownfield sites, and we agree. But brownfield sites are scattered all over the place, many have very complicated ownership, and acquiring them takes years. Why can't we do both? Reclamation and developing brownfield sites aren't contradictory.\"" }
  - { es: "反方第二位辯員：「話雖如此，政府嘅資源係有限嘅。將幾千億用喺填海，就代表少咗錢用喺醫療同教育。而且，填海起嘅屋，最後係咪真係起公屋，定係賣畀發展商起豪宅？正方可唔可以保證？」", en: "Second opposition speaker: \"Be that as it may, the government's resources are limited. Spending hundreds of billions on reclamation means less money for healthcare and education. And will the homes built on reclaimed land really end up as public housing, or will the land be sold to developers to build luxury flats? Can the proposition guarantee that?\"" }
  - { es: "阿琛即刻反駁：「反方嘅問題係一個政策問題，唔係填海本身嘅問題。如果因為怕政策做得唔好就乜都唔做，噉住劏房嘅市民要等到幾時？我哋唔可以為咗保護海洋，就犧牲幾十萬人嘅生活質素。當然，環保好重要，所以我哋主張用最新嘅技術，盡量減少對環境嘅影響。」", en: "Ah Sum rebutted immediately: \"The opposition's question is a policy question, not a problem with reclamation itself. If we do nothing because we're afraid the policy will be badly carried out, how long must the people living in subdivided flats wait? We can't sacrifice the quality of life of hundreds of thousands of people for the sake of protecting the sea. Of course the environment matters, which is why we propose using the latest technology to minimise the impact on it.\"" }
  - { es: "最後，主席宣佈結果：評判以三比二，判反方勝出，而最佳辯論員就係正方嘅阿琛。比賽完咗之後，兩隊辯員互相握手。阿蕎同阿琛講：「你頭先講得好有說服力，我差啲畀你說服咗。」阿琛笑住話：「其實我自己都唔肯定答案係乜，所以先覺得辯論咁有意思。」", en: "Finally the chair announced the result: the judges voted three to two for the opposition, and the best speaker award went to Ah Sum of the proposition. After the contest the two teams shook hands. Ah Kiu said to Ah Sum: \"You were really persuasive just now. You almost convinced me.\" Ah Sum smiled: \"Actually, I'm not sure what the answer is myself, which is why I find debating so interesting.\"" }
questions:
  - { q: "今日嘅辯題係乜嘢？", options: ["香港應該填海起屋", "香港應該保護海豚", "香港應該起多啲學校"], answer: 0, explain: "今日嘅辯題係『香港應該填海起屋』." }
  - { q: "阿琛用咩例子證明填海有用？", options: ["中環、灣仔、啟德都係填海得返嚟", "新加坡", "大澳"], answer: 0, explain: "中環、灣仔、啟德好多地方都係填海得返嚟嘅." }
  - { q: "反方認為應該先用乜嘢地？", options: ["郊野公園", "棕地同閒置土地", "學校"], answer: 1, explain: "香港仲有唔少棕地同閒置嘅土地… 我哋應該先用好呢啲地." }
  - { q: "反方提出填海對邊種動物有影響？", options: ["野豬", "中華白海豚", "雀仔"], answer: 1, explain: "大嶼山附近嘅中華白海豚，數量…已經大幅減少." }
  - { q: "邊隊贏咗比賽？", options: ["正方", "反方", "打和"], answer: 1, explain: "評判以三比二，判反方勝出. Ah Sum of the proposition was best speaker." }
  - { q: "阿琛覺得辯論點解有意思？", options: ["因為佢一定會贏", "因為佢自己都唔肯定答案", "因為可以攞獎金"], answer: 1, explain: "其實我自己都唔肯定答案係乜，所以先覺得辯論咁有意思." }
