id: r.a1.un-dia-en-madrid
level: a1
title: Un día en Madrid
kind: text
intro: Tom writes about his first day visiting Madrid.
paragraphs:
  - { es: "Hoy es sábado y estoy en Madrid. Es mi primer día en la capital de España. Hace sol y hace un poco de calor. Son las nueve de la mañana y tengo mucha hambre.", en: "Today is Saturday and I'm in Madrid. It's my first day in the capital of Spain. It's sunny and a bit hot. It's nine in the morning and I'm very hungry." }
  - { es: "Desayuno en una cafetería pequeña al lado del hotel. Tomo un café con leche y un bocadillo de jamón. La camarera es muy simpática. El desayuno cuesta cuatro euros con cincuenta.", en: "I have breakfast in a small café next to the hotel. I have a coffee with milk and a ham sandwich. The waitress is very nice. Breakfast costs four euros fifty." }
  - { es: "Después voy al centro en metro. El metro de Madrid es grande, rápido y barato. Bajo en la estación de Sol y camino por la Plaza Mayor. Hay muchos turistas y muchas tiendas.", en: "Then I go to the centre by metro. The Madrid metro is big, fast and cheap. I get off at Sol station and walk through the Plaza Mayor. There are many tourists and many shops." }
  - { es: "A las dos como en un restaurante tradicional. Pido el menú del día: de primero una sopa, de segundo pollo con patatas y de postre un helado. Todo está muy rico.", en: "At two I have lunch in a traditional restaurant. I order the set menu: soup for the first course, chicken with potatoes for the main, and ice cream for dessert. Everything is delicious." }
  - { es: "Por la tarde visito el museo del Prado. Es un museo muy famoso y muy grande. Me gustan mucho los cuadros antiguos. Luego paseo por el parque del Retiro. Hay un lago y mucha gente pasea o hace deporte.", en: "In the afternoon I visit the Prado museum. It's a very famous and very big museum. I really like the old paintings. Then I walk through the Retiro park. There's a lake and lots of people stroll or do sport." }
  - { es: "Por la noche ceno tapas con unos amigos españoles en un bar del barrio de La Latina. Hablamos español y un poco de inglés. Vuelvo al hotel a las doce. Estoy muy cansado, pero muy contento. ¡Madrid es fantástica!", en: "At night I have tapas for dinner with some Spanish friends in a bar in the La Latina district. We speak Spanish and a little English. I return to the hotel at twelve. I'm very tired, but very happy. Madrid is fantastic!" }
questions:
  - { q: "How much does breakfast cost?", options: ["Four euros fifty", "Nine euros", "Two euros"], answer: 0 }
  - { q: "How does Tom go to the centre?", options: ["By taxi", "By metro", "On foot"], answer: 1 }
  - { q: "What does Tom do in the afternoon?", options: ["He has tapas", "He visits the Prado and walks in the Retiro", "He goes back to the hotel"], answer: 1 }
