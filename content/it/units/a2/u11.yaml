id: a2.u11
title: "Dal medico"
lessons:
  - id: a2.u11.l1
    title: Mi fa male la testa
    teach: [g.fare-male]
    tip: "fare male works like piacere: mi fa male la testa (one thing), mi fanno male i piedi (more than one). Or: ho mal di testa."
    vocab: [w.corpo, w.collo, w.spalla, w.schiena, w.pancia, w.stomaco, w.petto, w.gola, w.mal-di-testa, w.mal-di-gola, w.mal-di-pancia, w.mal-di-schiena, w.dolore, w.fare-male, w.febbre, w.tosse, w.raffreddore, w.influenza, w.termometro, w.prendere-freddo]
    sentences:
      - { es: "Dottore, mi fa male la testa da stamattina.", en: "Doctor, I've had a headache since this morning.", altEs: ["Dottore, ho mal di testa da stamattina."], altEn: ["Doctor, my head has been hurting since this morning."], grammar: [g.fare-male, g.da-since], vocab: [w.fare-male, w.testa, w.dottore] }
      - { es: "Mi fanno male i piedi: abbiamo camminato tutto il giorno per Volterra.", en: "My feet hurt: we've walked around Volterra all day.", altEs: ["Mi fanno male i piedi, abbiamo camminato tutto il giorno per Volterra."], grammar: [g.fare-male], vocab: [w.piede, w.camminare] }
      - { es: "Ti fa ancora male la schiena?", en: "Does your back still hurt?", altEs: ["Ti fa ancora male la schiena o stai meglio?"], grammar: [g.fare-male], vocab: [w.schiena] }
      - { es: "Ho mal di gola e un po' di tosse.", en: "I've got a sore throat and a bit of a cough.", altEs: ["Ho mal di gola e anche un po' di tosse."], grammar: [g.fare-male], vocab: [w.mal-di-gola, w.tosse], transform: { instruction: "Say it with fare male", answer: "Mi fa male la gola e ho un po' di tosse.", alt: ["Mi fa male la gola e ho anche un po' di tosse."], en: "My throat hurts and I've got a bit of a cough." } }
      - { es: "Gli fa male lo stomaco: ha mangiato troppo.", en: "His stomach hurts: he ate too much.", altEs: ["Gli fa male lo stomaco perché ha mangiato troppo."], grammar: [g.fare-male, g.indirect-object-pronouns], vocab: [w.stomaco, w.troppo] }
      - { es: "Mi fanno male le gambe dopo la passeggiata.", en: "My legs hurt after the walk.", altEs: ["Dopo la passeggiata mi fanno male le gambe."], grammar: [g.fare-male], vocab: [w.gamba, w.passeggiata], error: { wrong: "Mi fa male le gambe dopo la passeggiata.", explain: "Plural body parts need fanno: mi fanno male le gambe.", grammar: g.fare-male } }
      - { es: "Mi fa male la testa.", en: "My head hurts.", altEs: ["Ho mal di testa."], altEn: ["I have a headache."], grammar: [g.fare-male], vocab: [w.testa], error: { wrong: "Mi fa male la mia testa.", explain: "Use the article, not a possessive: mi fa male la testa.", grammar: g.fare-male } }
      - { es: "Ho la febbre: il termometro dice trentotto e mezzo.", en: "I've got a temperature: the thermometer says thirty-eight and a half.", altEs: ["Ho la febbre, il termometro dice trentotto e mezzo."], grammar: [g.avere-expressions], vocab: [w.febbre, w.termometro] }
      - { es: "Ieri sera ho preso freddo e adesso ho il raffreddore.", en: "I caught a chill last night and now I've got a cold.", altEs: ["Ho preso freddo ieri sera e adesso ho il raffreddore."], grammar: [g.passato-prossimo-avere], vocab: [w.prendere-freddo, w.raffreddore] }
      - { es: "Mia figlia ha l'influenza e oggi non va a scuola.", en: "My daughter has the flu and isn't going to school today.", grammar: [g.avere-expressions], vocab: [w.influenza, w.scuola] }
      - { es: "Le fa male il collo perché lavora sempre al computer.", en: "Her neck hurts because she always works at the computer.", altEs: ["Le fa male il collo: lavora sempre al computer."], grammar: [g.fare-male, g.indirect-object-pronouns], vocab: [w.collo, w.computer] }
      - { es: "Ho un dolore qui, al petto: è grave?", en: "I've got a pain here, in my chest: is it serious?", altEs: ["Sento un dolore qui, al petto: è grave?"], grammar: [g.fare-male], vocab: [w.dolore, w.petto, w.grave] }
      - { es: "Dopo quella cena ho mal di pancia.", en: "After that dinner I've got a stomach ache.", altEs: ["Dopo quella cena mi fa male la pancia."], grammar: [g.fare-male], vocab: [w.mal-di-pancia, w.pancia] }
      - { es: "Mi fanno male le spalle e ho mal di schiena.", en: "My shoulders hurt and I've got backache.", altEs: ["Ho mal di schiena e mi fanno male le spalle."], grammar: [g.fare-male], vocab: [w.spalla, w.mal-di-schiena] }
      - { es: "Dopo la gita in bici ci fa male tutto il corpo.", en: "After the bike ride our whole body aches.", altEs: ["Ci fa male tutto il corpo dopo la gita in bici."], altEn: ["After the bike trip we ache all over."], grammar: [g.fare-male], vocab: [w.corpo, w.gita] }
      - { es: "Mi fa male lo stomaco.", en: "My stomach hurts.", grammar: [g.fare-male], vocab: [w.stomaco], transform: { instruction: "Say it about your friend Marco (to him)", answer: "A Marco fa male lo stomaco.", alt: ["Gli fa male lo stomaco.", "Marco ha mal di stomaco."], en: "Marco's stomach hurts." } }
    exchanges:
      - q: { es: "Che cosa ti fa male?", en: "What hurts?" }
        a: { es: "Mi fa male la gola e ho un po' di febbre.", en: "My throat hurts and I've got a bit of a temperature." }
        alt: ["Mi fa male la testa.", "Mi fanno male le gambe.", "Tutto!"]
        grammar: [g.fare-male]
        vocab: [w.gola, w.febbre]
      - q: { es: "Ti fa ancora male la schiena?", en: "Does your back still hurt?" }
        a: { es: "Un po' meno, grazie. Oggi sto meglio.", en: "A bit less, thanks. I'm better today." }
        alt: ["Sì, ancora tanto.", "No, non mi fa più male."]
        grammar: [g.fare-male, g.comparatives-irregular]
        vocab: [w.schiena]
      - q: { es: "Che cos'ha, signora?", en: "What's the matter, madam?" }
        a: { es: "Ho mal di testa da tre giorni.", en: "I've had a headache for three days." }
        alt: ["Mi fa male la testa.", "Ho la tosse e il raffreddore."]
        grammar: [g.fare-male, g.da-since]
        vocab: [w.mal-di-testa]
      - q: { es: "Hai la febbre?", en: "Have you got a temperature?" }
        a: { es: "Sì, trentotto. Credo di avere l'influenza.", en: "Yes, thirty-eight. I think I've got the flu." }
        alt: ["No, ho solo il raffreddore.", "Non lo so, non ho il termometro."]
        grammar: [g.avere-expressions, g.opinions]
        vocab: [w.febbre, w.influenza]
      - q: { es: "Perché non vieni stasera?", en: "Why aren't you coming tonight?" }
        a: { es: "Ho preso freddo e ho il raffreddore.", en: "I caught a chill and I've got a cold." }
        alt: ["Sto male, ho la febbre.", "Mi fa male la pancia."]
        grammar: [g.passato-prossimo-avere]
        vocab: [w.prendere-freddo, w.raffreddore]
    texts:
      - title: "Messaggio al capo"
        es: ["Buongiorno, oggi non vengo in ufficio.", "Ho la febbre e mi fa male tutto il corpo.", "Spero di stare meglio domani."]
        en: ["Good morning, I'm not coming into the office today.", "I've got a temperature and my whole body aches.", "I hope to be better tomorrow."]
        grammar: [g.fare-male]
        vocab: [w.febbre, w.corpo]
    spicy:
      - { es: "Mi fa male il cuore quando non mi scrivi.", en: "My heart hurts when you don't write to me.", grammar: [g.fare-male], vocab: [w.cuore, w.scrivere] }
      - { es: "Mal di testa? No, ho solo pensato troppo a te.", en: "A headache? No, I've just been thinking about you too much.", grammar: [g.fare-male], vocab: [w.mal-di-testa, w.pensare] }
      - { es: "Mi fanno male i piedi, ma un altro ballo con te lo faccio.", en: "My feet hurt, but I'll do one more dance with you.", grammar: [g.fare-male], vocab: [w.piede, w.ballare] }
      - { es: "Il termometro dice trentasette, ma vicino a te sale.", en: "The thermometer says thirty-seven, but next to you it goes up.", grammar: [g.fare-male], vocab: [w.termometro, w.salire] }
      - { es: "Ho preso freddo ad aspettarti sotto casa tua.", en: "I caught a chill waiting for you outside your house.", grammar: [g.passato-prossimo-avere], vocab: [w.prendere-freddo, w.aspettare] }

  - id: a2.u11.l2
    title: Le braccia e le dita
    teach: [g.irregular-plurals-body]
    tip: "Some masculine body words turn feminine in -a in the plural: il braccio → le braccia, il dito → le dita, il ginocchio → le ginocchia, l'osso → le ossa. And la mano → le mani."
    vocab: [w.ginocchio, w.dito, w.labbro, w.orecchio, w.ciglio, w.osso, w.caviglia, w.guancia, w.fronte, w.lacrima, w.barba, w.baffi, w.pelle, w.sangue, w.rompersi, w.ferita, w.gonfio, w.cerotto, w.crema]
    sentences:
      - { es: "Mi fanno male le braccia dopo la palestra.", en: "My arms hurt after the gym.", altEs: ["Dopo la palestra mi fanno male le braccia."], grammar: [g.irregular-plurals-body, g.fare-male], vocab: [w.braccio, w.palestra] }
      - { es: "Lavati le mani prima di mangiare.", en: "Wash your hands before eating.", altEs: ["Prima di mangiare lavati le mani."], grammar: [g.irregular-plurals-body, g.imperativo-tu], vocab: [w.mano, w.lavarsi] }
      - { es: "Mi sono rotto due dita giocando a pallavolo.", en: "I broke two fingers playing volleyball.", altEs: ["Mi sono rotta due dita giocando a pallavolo.", "Mi sono rotto due dita a pallavolo."], grammar: [g.irregular-plurals-body, g.reflexive-passato-prossimo], vocab: [w.dito, w.rompersi, w.pallavolo], error: { wrong: "Mi sono rotto due diti giocando a pallavolo.", explain: "il dito → le dita (feminine plural in -a).", grammar: g.irregular-plurals-body } }
      - { es: "Ha le labbra rosse e le ciglia lunghe.", en: "She has red lips and long eyelashes.", grammar: [g.irregular-plurals-body, g.adjective-agreement], vocab: [w.labbro, w.ciglio] }
      - { es: "Mi fa male il ginocchio quando scendo le scale.", en: "My knee hurts when I go down the stairs.", grammar: [g.fare-male], vocab: [w.ginocchio, w.scala], transform: { instruction: "Say both knees hurt", answer: "Mi fanno male le ginocchia quando scendo le scale.", alt: ["Quando scendo le scale mi fanno male le ginocchia."], en: "My knees hurt when I go down the stairs." } }
      - { es: "Mi fanno male le orecchie: c'è troppo rumore.", en: "My ears hurt: there's too much noise.", altEs: ["Mi fanno male gli orecchi: c'è troppo rumore."], grammar: [g.irregular-plurals-body, g.fare-male], vocab: [w.orecchio, w.rumore] }
      - { es: "Dopo la caduta mi fanno male tutte le ossa.", en: "After the fall all my bones ache.", altEs: ["Mi fanno male tutte le ossa dopo la caduta."], grammar: [g.irregular-plurals-body, g.fare-male], vocab: [w.osso], error: { wrong: "Dopo la caduta mi fanno male tutti gli ossi.", explain: "The bones of your body are le ossa (feminine plural in -a).", grammar: g.irregular-plurals-body } }
      - { es: "Ho comprato un paio di scarpe e due paia di calzini.", en: "I bought a pair of shoes and two pairs of socks.", grammar: [g.irregular-plurals-body], vocab: [w.paio, w.calzino] }
      - { es: "D'estate ci sono centinaia di turisti alla Porta all'Arco.", en: "In summer there are hundreds of tourists at the Porta all'Arco.", grammar: [g.irregular-plurals-body, g.c-e-ci-sono], vocab: [w.centinaio, w.turista], note: "The Porta all'Arco in Volterra is an Etruscan gate." }
      - { es: "Mi sono fatta male alla caviglia: guarda com'è gonfia!", en: "I've hurt my ankle: look how swollen it is!", altEs: ["Mi sono fatto male alla caviglia: guarda com'è gonfia!"], grammar: [g.fare-male, g.reflexive-passato-prossimo], vocab: [w.caviglia, w.gonfio] }
      - { es: "Ha una ferita sulla fronte: mettiamo un cerotto.", en: "He has a cut on his forehead: let's put a plaster on it.", altEs: ["Ha una ferita sulla fronte, mettiamo un cerotto."], grammar: [g.imperativo-noi-voi], vocab: [w.ferita, w.fronte, w.cerotto] }
      - { es: "Metti la crema sulla pelle: il sole è forte.", en: "Put cream on your skin: the sun is strong.", altEs: ["Mettiti la crema: il sole è forte."], grammar: [g.imperativo-tu], vocab: [w.crema, w.pelle] }
      - { es: "Il nonno ha la barba bianca e i baffi lunghi.", en: "Grandad has a white beard and a long moustache.", grammar: [g.adjective-agreement], vocab: [w.barba, w.baffi] }
      - { es: "Ho le guance rosse e una lacrima sulla faccia: che film!", en: "My cheeks are red and there's a tear on my face: what a film!", grammar: [g.irregular-plurals-body], vocab: [w.guancia, w.lacrima] }
      - { es: "Non mi piace vedere il sangue: chiudo gli occhi.", en: "I don't like seeing blood: I close my eyes.", grammar: [g.piacere-intro], vocab: [w.sangue, w.occhio] }
      - { es: "Ho un dito rotto.", en: "I've got a broken finger.", grammar: [g.irregular-plurals-body], vocab: [w.dito], transform: { instruction: "Make it two fingers", answer: "Ho due dita rotte.", alt: ["Ho due dita rotte!"], en: "I've got two broken fingers." } }
    exchanges:
      - q: { es: "Che cosa ti sei fatto?", en: "What have you done to yourself?" }
        a: { es: "Mi sono rotto due dita giocando a calcio.", en: "I broke two fingers playing football." }
        alt: ["Mi sono rotto un dito.", "Mi sono fatto male al braccio."]
        grammar: [g.irregular-plurals-body, g.reflexive-passato-prossimo]
        vocab: [w.dito, w.rompersi]
      - q: { es: "Perché cammini così?", en: "Why are you walking like that?" }
        a: { es: "Mi sono fatta male alla caviglia sulle scale.", en: "I hurt my ankle on the stairs." }
        alt: ["Mi fa male il ginocchio.", "Mi fanno male i piedi."]
        grammar: [g.fare-male, g.reflexive-passato-prossimo]
        vocab: [w.caviglia]
      - q: { es: "Hai un cerotto?", en: "Have you got a plaster?" }
        a: { es: "Sì, eccolo. Ti sei tagliato?", en: "Yes, here it is. Have you cut yourself?" }
        alt: ["No, mi dispiace.", "Sì, nello zaino."]
        grammar: [g.reflexive-passato-prossimo]
        vocab: [w.cerotto]
      - q: { es: "Ti fanno male le ginocchia?", en: "Do your knees hurt?" }
        a: { es: "Sì, Volterra è tutta salite!", en: "Yes, Volterra is all uphill!" }
        alt: ["Sì, un po'.", "No, sto benissimo."]
        grammar: [g.irregular-plurals-body, g.fare-male]
        vocab: [w.ginocchio]
      - q: { es: "Quante uova servono per la torta?", en: "How many eggs do you need for the cake?" }
        a: { es: "Ne servono sei.", en: "You need six." }
        alt: ["Sei.", "Sei uova."]
        grammar: [g.irregular-plurals-body, g.ne-partitive]
        vocab: [w.uovo]
    texts:
      - title: "Che giornata!"
        es: ["Ieri sono caduto dalla bici.", "Mi sono fatto male alle ginocchia e alle mani.", "Niente di grave, ma ho le braccia piene di cerotti!"]
        en: ["Yesterday I fell off my bike.", "I hurt my knees and my hands.", "Nothing serious, but my arms are covered in plasters!"]
        grammar: [g.irregular-plurals-body, g.fare-male]
        vocab: [w.ginocchio, w.cerotto, w.braccio]
    spicy:
      - { es: "Hai le labbra più belle di tutta Volterra.", en: "You have the most beautiful lips in all of Volterra.", grammar: [g.irregular-plurals-body, g.superlatives], vocab: [w.labbro] }
      - { es: "Ho le mani fredde, ma il cuore caldo.", en: "My hands are cold, but my heart is warm.", grammar: [g.irregular-plurals-body], vocab: [w.mano, w.cuore] }
      - { es: "Con quelle ciglia lunghe mi guardi e io dimentico tutto.", en: "You look at me with those long eyelashes and I forget everything.", grammar: [g.irregular-plurals-body], vocab: [w.ciglio, w.dimenticare] }
      - { es: "Incrocio le dita: stasera mi dici di sì?", en: "Fingers crossed: will you say yes to me tonight?", grammar: [g.irregular-plurals-body], vocab: [w.dito] }
      - { es: "Ho la barba nuova: ti piace o la taglio?", en: "I've got a new beard: do you like it or shall I cut it off?", grammar: [g.direct-object-pronouns], vocab: [w.barba, w.tagliare] }

  - id: a2.u11.l3
    title: Dovresti riposare
    teach: [g.condizionale-presente]
    tip: "The conditional uses the future stem + -ei, -esti, -ebbe, -emmo, -este, -ebbero: andrei, potresti, sarebbe. Noi has double m: andremmo."
    vocab: [w.riposo, w.riposare, w.dieta, w.salute.n, w.dimagrire, w.ingrassare, w.fumare, w.sigaretta, w.malato, w.ammalarsi, w.guarire, w.curare, w.stare-male, w.sintomo, w.allergia, w.allergico, w.tossire, w.starnutire, w.respirare]
    sentences:
      - { es: "Mi piacerebbe vivere in campagna, vicino a Volterra.", en: "I'd like to live in the countryside, near Volterra.", altEs: ["Mi piacerebbe abitare in campagna, vicino a Volterra."], grammar: [g.condizionale-presente], vocab: [w.campagna], transform: { instruction: "Say 'we would like'", answer: "Ci piacerebbe vivere in campagna, vicino a Volterra.", alt: ["Ci piacerebbe abitare in campagna, vicino a Volterra."], en: "We'd like to live in the countryside, near Volterra." } }
      - { es: "Dovresti riposare un po': sei stanchissimo.", en: "You should rest a bit: you're exhausted.", altEs: ["Dovresti riposarti un po': sei stanchissimo.", "Dovresti riposare un po': sei stanchissima."], grammar: [g.condizionale-presente, g.condizionale-courtesy], vocab: [w.riposare, w.stanchissimo] }
      - { es: "Al tuo posto, andrei dal medico.", en: "If I were you, I'd go to the doctor.", altEs: ["Al posto tuo, andrei dal medico.", "Io al tuo posto andrei dal medico."], altEn: ["In your place, I'd go to the doctor."], grammar: [g.condizionale-presente], vocab: [w.medico, w.posto], transform: { instruction: "Start from 'Vado dal medico' and say what 'we' would do", answer: "Al tuo posto, andremmo dal medico.", alt: ["Al posto tuo, andremmo dal medico."], en: "If we were you, we'd go to the doctor." } }
      - { es: "Sarebbe meglio smettere di fumare.", en: "It would be better to stop smoking.", altEs: ["Sarebbe meglio smettere con le sigarette."], grammar: [g.condizionale-presente, g.verbs-with-prepositions], vocab: [w.fumare, w.smettere] }
      - { es: "Vorrei dimagrire, ma amo troppo la pasta.", en: "I'd like to lose weight, but I love pasta too much.", grammar: [g.condizionale-presente], vocab: [w.dimagrire, w.pasta] }
      - { es: "Che cosa faresti al mio posto?", en: "What would you do in my place?", altEs: ["Tu che cosa faresti al mio posto?", "Cosa faresti al posto mio?"], altEn: ["What would you do if you were me?"], grammar: [g.condizionale-presente], vocab: [w.fare, w.posto] }
      - { es: "Mangerei volentieri una pizza, ma sono a dieta.", en: "I'd happily eat a pizza, but I'm on a diet.", altEs: ["Mangerei volentieri una pizza, però sono a dieta."], grammar: [g.condizionale-presente], vocab: [w.dieta, w.volentieri] }
      - { es: "Con un po' di riposo guariresti prima.", en: "With a bit of rest you'd get better sooner.", altEs: ["Con un po' di riposo guariresti più presto."], grammar: [g.condizionale-presente], vocab: [w.riposo, w.guarire] }
      - { es: "Noi verremmo volentieri, ma siamo malati.", en: "We'd gladly come, but we're ill.", altEs: ["Verremmo volentieri, ma siamo malati.", "Noi verremmo volentieri, ma siamo malate."], grammar: [g.condizionale-presente], vocab: [w.malato, w.venire], error: { wrong: "Noi verremo volentieri, ma siamo malati.", explain: "The conditional noi ending is -emmo (double m): verremmo. Verremo is the future.", grammar: g.condizionale-presente } }
      - { es: "Sono allergica ai gatti: quando ne vedo uno, starnutisco.", en: "I'm allergic to cats: when I see one, I sneeze.", altEs: ["Sono allergico ai gatti: quando ne vedo uno, starnutisco."], grammar: [g.ne-partitive], vocab: [w.allergico, w.starnutire, w.gatto] }
      - { es: "Senza questa allergia starei molto meglio.", en: "Without this allergy I'd feel much better.", grammar: [g.condizionale-presente, g.comparatives-irregular], vocab: [w.allergia, w.stare] }
      - { es: "Un po' di riposo ti farebbe bene.", en: "A bit of rest would do you good.", altEs: ["Un po' di riposo ti farebbe proprio bene."], grammar: [g.condizionale-presente], vocab: [w.riposo] }
      - { es: "La salute è la cosa più importante: non la cambierei con niente.", en: "Health is the most important thing: I wouldn't swap it for anything.", grammar: [g.condizionale-presente, g.double-negation], vocab: [w.salute.n, w.importante] }
      - { es: "Con tutti questi dolci, ingrasserei di cinque chili!", en: "With all these sweets, I'd put on five kilos!", grammar: [g.condizionale-presente], vocab: [w.ingrassare, w.chilo] }
      - { es: "Il medico dice che oggi non dovrei uscire: tossisco e respiro male.", en: "The doctor says I shouldn't go out today: I'm coughing and I can't breathe properly.", grammar: [g.condizionale-presente], vocab: [w.tossire, w.respirare] }
      - { es: "Mi ammalo sempre a novembre: mi curerei volentieri con il sole della Sicilia!", en: "I always fall ill in November: I'd gladly treat myself with the Sicilian sun!", grammar: [g.condizionale-presente, g.reflexive-present], vocab: [w.ammalarsi, w.curare] }
    exchanges:
      - q: { es: "Che cosa faresti al mio posto?", en: "What would you do in my place?" }
        a: { es: "Andrei dal medico subito.", en: "I'd go to the doctor straight away." }
        alt: ["Starei a letto.", "Al tuo posto riposerei."]
        grammar: [g.condizionale-presente]
        vocab: [w.medico]
      - q: { es: "Ti piacerebbe vivere a Volterra?", en: "Would you like to live in Volterra?" }
        a: { es: "Sì, mi piacerebbe tantissimo: è così tranquilla.", en: "Yes, I'd love to: it's so peaceful." }
        alt: ["Sì, molto.", "No, preferirei vivere al mare."]
        grammar: [g.condizionale-presente]
        vocab: [w.tranquillo]
      - q: { es: "Vuoi un dolce?", en: "Do you want a dessert?" }
        a: { es: "Lo mangerei volentieri, ma sono a dieta.", en: "I'd happily eat one, but I'm on a diet." }
        alt: ["Sì, grazie!", "No, grazie, sono a dieta."]
        grammar: [g.condizionale-presente, g.direct-object-pronouns]
        vocab: [w.dieta, w.dolce]
      - q: { es: "Che sintomi ha?", en: "What symptoms do you have?" }
        a: { es: "Tossisco, starnutisco e sto male da due giorni.", en: "I'm coughing, sneezing, and I've been feeling ill for two days." }
        alt: ["Ho la febbre e la tosse.", "Mi fa male la gola."]
        grammar: [g.da-since]
        vocab: [w.sintomo, w.stare-male]
      - q: { es: "Fumi?", en: "Do you smoke?" }
        a: { es: "Solo qualche sigaretta, ma dovrei smettere.", en: "Just the odd cigarette, but I should stop." }
        alt: ["No, mai.", "Ho smesso l'anno scorso."]
        grammar: [g.condizionale-presente, g.indefinites]
        vocab: [w.sigaretta, w.fumare]
    texts:
      - title: "Consigli per la salute"
        es: ["Per stare bene, io mangerei più frutta e verdura.", "Camminerei mezz'ora al giorno.", "E non fumerei: le sigarette fanno molto male."]
        en: ["To stay healthy, I'd eat more fruit and vegetables.", "I'd walk for half an hour a day.", "And I wouldn't smoke: cigarettes are very bad for you."]
        grammar: [g.condizionale-presente]
        vocab: [w.salute.n, w.sigaretta]
    spicy:
      - { es: "Ti curerei io, con la minestra della nonna.", en: "I'd look after you myself, with Grandma's soup.", grammar: [g.condizionale-presente], vocab: [w.ammalarsi, w.curare] }
      - { es: "Con un dottore come te, mi ammalerei ogni settimana.", en: "With a doctor like you, I'd get ill every week.", altEs: ["Con una dottoressa come te, mi ammalerei ogni settimana."], grammar: [g.condizionale-presente], vocab: [w.ammalarsi, w.dottore] }
      - { es: "Al tuo posto, mi inviterei a cena.", en: "If I were you, I'd invite me to dinner.", grammar: [g.condizionale-presente], vocab: [w.invitare, w.posto] }
      - { es: "Quando mi guardi così, non riesco a respirare.", en: "When you look at me like that, I can't breathe.", grammar: [g.verbs-with-prepositions], vocab: [w.respirare, w.guardare] }
      - { es: "Starei tutta la notte a parlare con te.", en: "I'd stay up all night talking with you.", grammar: [g.condizionale-presente], vocab: [w.stare, w.parlare] }

  - id: a2.u11.l4
    title: Potrebbe aiutarmi?
    teach: [g.condizionale-courtesy]
    tip: "The conditional softens requests and advice: Potrebbe…? Vorrei… Le dispiacerebbe…? Dovresti… Faresti meglio a…"
    vocab: [w.dottore, w.pronto-soccorso, w.medicina, w.pillola, w.compressa, w.sciroppo, w.visita, w.paziente.n, w.ambulanza, w.grave, w.consiglio, w.accomodarsi, w.dispiacere, w.pasto, w.aspirina]
    sentences:
      - { es: "Scusi, potrebbe chiamare un medico?", en: "Excuse me, could you call a doctor?", altEs: ["Scusi, può chiamare un medico?", "Mi scusi, potrebbe chiamare un medico?"], grammar: [g.condizionale-courtesy], vocab: [w.potere, w.medico] }
      - { es: "Vorrei qualcosa per il mal di gola.", en: "I'd like something for a sore throat.", altEs: ["Vorrei qualcosa per il mal di gola, per favore."], grammar: [g.condizionale-courtesy, g.volere-vorrei], vocab: [w.mal-di-gola, w.qualcosa] }
      - { es: "Le dispiacerebbe aprire la finestra?", en: "Would you mind opening the window?", altEs: ["Le dispiace aprire la finestra?"], grammar: [g.condizionale-courtesy], vocab: [w.dispiacere, w.finestra] }
      - { es: "Dottore, potrebbe darmi uno sciroppo per la tosse?", en: "Doctor, could you give me a cough syrup?", altEs: ["Dottore, mi darebbe uno sciroppo per la tosse?"], grammar: [g.condizionale-courtesy], vocab: [w.sciroppo, w.tosse] }
      - { es: "Mi saprebbe dire dov'è il pronto soccorso?", en: "Could you tell me where A&E is?", altEs: ["Saprebbe dirmi dov'è il pronto soccorso?"], altEn: ["Could you tell me where the emergency room is?"], grammar: [g.condizionale-courtesy], vocab: [w.pronto-soccorso, w.sapere] }
      - { es: "Dovrebbe prendere una compressa ogni otto ore.", en: "You should take a tablet every eight hours.", altEs: ["Deve prendere una compressa ogni otto ore."], grammar: [g.condizionale-courtesy], vocab: [w.compressa, w.ogni] }
      - { es: "Faresti meglio a restare a letto.", en: "You'd better stay in bed.", altEs: ["Faresti meglio a stare a letto."], grammar: [g.condizionale-courtesy], vocab: [w.restare, w.letto] }
      - { es: "Potresti parlare più piano? Non capisco.", en: "Could you speak more slowly? I don't understand.", altEs: ["Potresti parlare più lentamente? Non capisco."], grammar: [g.condizionale-courtesy], vocab: [w.capire], transform: { instruction: "Ask a stranger politely (Lei)", answer: "Potrebbe parlare più piano? Non capisco.", alt: ["Potrebbe parlare più lentamente? Non capisco."], en: "Could you speak more slowly? I don't understand." } }
      - { es: "Chiami un'ambulanza, presto: è grave!", en: "Call an ambulance, quick: it's serious!", altEs: ["Chiamate un'ambulanza, presto: è grave!"], grammar: [g.imperativo-lei], vocab: [w.ambulanza, w.grave] }
      - { es: "Prego, si accomodi: la dottoressa arriva subito.", en: "Please, take a seat: the doctor will be right with you.", altEs: ["Prego, si accomodi: il dottore arriva subito."], grammar: [g.imperativo-lei], vocab: [w.accomodarsi, w.dottore] }
      - { es: "Signora, potrebbe aiutarmi?", en: "Madam, could you help me?", altEs: ["Signora, mi potrebbe aiutare?"], grammar: [g.condizionale-courtesy], vocab: [w.aiutare], error: { wrong: "Signora, potresti aiutarmi?", explain: "To someone you call Lei, use potrebbe; potresti is the tu form.", grammar: g.condizionale-courtesy } }
      - { es: "Il paziente vorrebbe parlare con il dottore.", en: "The patient would like to speak to the doctor.", altEs: ["La paziente vorrebbe parlare con la dottoressa."], grammar: [g.condizionale-courtesy], vocab: [w.paziente.n, w.dottore] }
      - { es: "Le darei un consiglio: prenda queste pillole dopo i pasti.", en: "Let me give you some advice: take these pills after meals.", grammar: [g.condizionale-courtesy, g.imperativo-lei], vocab: [w.consiglio, w.pillola, w.pasto] }
      - { es: "Avrei bisogno di una visita oggi, se possibile.", en: "I'd need an appointment today, if possible.", altEs: ["Avrei bisogno di una visita oggi, se è possibile."], grammar: [g.condizionale-courtesy, g.bisogna-avere-bisogno], vocab: [w.visita, w.possibile] }
      - { es: "Non dovrebbe prendere questa medicina a stomaco vuoto.", en: "You shouldn't take this medicine on an empty stomach.", grammar: [g.condizionale-courtesy], vocab: [w.medicina, w.vuoto] }
      - { es: "Devi bere più acqua.", en: "You must drink more water.", grammar: [g.potere-dovere], vocab: [w.bere, w.acqua], transform: { instruction: "Make it softer advice with the conditional", answer: "Dovresti bere più acqua.", alt: ["Dovresti bere più acqua!"], en: "You should drink more water." }, error: { wrong: "Dovresti bevere più acqua.", explain: "The infinitive is bere: dovresti bere.", grammar: g.condizionale-courtesy } }
    exchanges:
      - q: { es: "Buongiorno, desidera?", en: "Good morning, can I help you?" }
        a: { es: "Vorrei qualcosa per il mal di testa, per favore.", en: "I'd like something for a headache, please." }
        alt: ["Vorrei un'aspirina, per favore.", "Avrei bisogno di uno sciroppo per la tosse."]
        grammar: [g.condizionale-courtesy, g.volere-vorrei]
        vocab: [w.mal-di-testa, w.aspirina]
      - q: { es: "Che cosa mi consiglia, dottore?", en: "What do you advise, doctor?" }
        a: { es: "Dovrebbe riposare e bere molta acqua.", en: "You should rest and drink lots of water." }
        alt: ["Faccia una settimana di riposo.", "Prenda queste pillole."]
        grammar: [g.condizionale-courtesy]
        vocab: [w.consigliare, w.riposare]
      - q: { es: "Le dispiacerebbe aspettare un momento?", en: "Would you mind waiting a moment?" }
        a: { es: "No, nessun problema.", en: "No, no problem." }
        alt: ["Certo, aspetto.", "No, si figuri."]
        grammar: [g.condizionale-courtesy, g.double-negation]
        vocab: [w.dispiacere]
      - q: { es: "Potrebbe dirmi dov'è il pronto soccorso?", en: "Could you tell me where A&E is?" }
        a: { es: "Certo, è dietro l'ospedale, a sinistra.", en: "Of course, it's behind the hospital, on the left." }
        alt: ["È in fondo alla strada.", "Mi dispiace, non lo so."]
        grammar: [g.condizionale-courtesy]
        vocab: [w.pronto-soccorso, w.ospedale]
      - q: { es: "Ogni quanto devo prendere le pillole?", en: "How often should I take the pills?" }
        a: { es: "Ne prenda una ogni otto ore, dopo i pasti.", en: "Take one every eight hours, after meals." }
        alt: ["Una ogni otto ore.", "Due al giorno."]
        grammar: [g.imperativo-lei, g.ne-partitive]
        vocab: [w.pillola, w.pasto]
    texts:
      - title: "Le istruzioni del medico"
        es: ["Prenda una compressa la mattina e una la sera.", "Non dovrebbe bere alcol per una settimana.", "Se la febbre non passa, torni da me venerdì."]
        en: ["Take one tablet in the morning and one in the evening.", "You shouldn't drink alcohol for a week.", "If the fever doesn't go down, come back and see me on Friday."]
        grammar: [g.condizionale-courtesy, g.imperativo-lei]
        vocab: [w.compressa, w.alcol]
    spicy:
      - { es: "Dottore, potrebbe sentirmi il cuore? Va troppo veloce.", en: "Doctor, could you listen to my heart? It's going too fast.", altEs: ["Dottoressa, potrebbe sentirmi il cuore? Va troppo veloce."], grammar: [g.condizionale-courtesy], vocab: [w.dottore, w.cuore] }
      - { es: "Le dispiacerebbe darmi il Suo numero? È per una visita a cena.", en: "Would you mind giving me your number? It's for an appointment over dinner.", grammar: [g.condizionale-courtesy], vocab: [w.dispiacere, w.visita] }
      - { es: "Vorrei un consiglio: ti invito io o mi inviti tu?", en: "I'd like some advice: do I invite you or do you invite me?", grammar: [g.condizionale-courtesy], vocab: [w.consiglio, w.invitare] }
      - { es: "Faresti meglio a non guardarmi così: mi gira la testa.", en: "You'd better not look at me like that: my head is spinning.", grammar: [g.condizionale-courtesy], vocab: [w.guardare, w.testa] }
      - { es: "La medicina migliore? Una cena con te.", en: "The best medicine? A dinner with you.", grammar: [g.comparatives-irregular], vocab: [w.medicina, w.cena] }

dialogues:
  - id: a2.u11.d1
    title: In farmacia a Volterra
    context: Lucia, on holiday in Volterra, has fallen on one of the steep streets. She goes to a pharmacy.
    lines:
      - { speaker: Farmacista, es: "Buongiorno, mi dica.", en: "Good morning, how can I help?" }
      - { speaker: Lucia, es: "Buongiorno. Ieri sono caduta in una via del centro e mi sono fatta male alla caviglia.", en: "Good morning. Yesterday I fell in a street in the centre and hurt my ankle." }
      - { speaker: Farmacista, es: "Mi fa vedere? È un po' gonfia. Le fa male quando cammina?", en: "May I see? It's a bit swollen. Does it hurt when you walk?" }
      - { speaker: Lucia, es: "Sì, molto. E mi fanno male anche le ginocchia.", en: "Yes, a lot. And my knees hurt too." }
      - { speaker: Farmacista, es: "Le strade di Volterra sono tutte salite: succede spesso!", en: "Volterra's streets are all uphill: it happens a lot!" }
      - { speaker: Lucia, es: "Potrebbe darmi qualcosa per il dolore?", en: "Could you give me something for the pain?" }
      - { speaker: Farmacista, es: "Certo. Prenda una compressa ogni otto ore, dopo i pasti. E metta questa crema due volte al giorno.", en: "Of course. Take one tablet every eight hours, after meals. And put this cream on twice a day." }
      - { speaker: Lucia, es: "Grazie. Secondo Lei dovrei andare al pronto soccorso?", en: "Thank you. Do you think I should go to A&E?" }
      - { speaker: Farmacista, es: "Se domani Le fa ancora male, sì. Al Suo posto, oggi riposerei.", en: "If it still hurts tomorrow, yes. If I were you, I'd rest today." }
      - { speaker: Lucia, es: "Che peccato, volevo vedere la Porta all'Arco!", en: "What a shame, I wanted to see the Porta all'Arco!" }
      - { speaker: Farmacista, es: "È lì da più di duemila anni: può aspettare fino a domani!", en: "It's been there for more than two thousand years: it can wait until tomorrow!" }
    questions:
      - { q: "Che cosa è successo a Lucia?", options: ["È caduta e si è fatta male alla caviglia.", "Ha la febbre.", "Ha mal di denti."], answer: 0, explain: "Sono caduta… e mi sono fatta male alla caviglia." }
      - { q: "Ogni quanto deve prendere una compressa?", options: ["Ogni due ore", "Ogni otto ore", "Una volta alla settimana"], answer: 1, explain: "Prenda una compressa ogni otto ore, dopo i pasti." }
      - { q: "Che cosa farebbe il farmacista al posto di Lucia?", options: ["Andrebbe al pronto soccorso", "Riposerebbe", "Visiterebbe la città"], answer: 1, explain: "Al Suo posto, oggi riposerei." }
      - { q: "Perché la Porta all'Arco può aspettare?", options: ["Perché è chiusa oggi", "Perché è lì da più di duemila anni", "Perché è lontana da Volterra"], answer: 1, explain: "The Etruscan gate has stood for over two thousand years: one more day won't matter." }
