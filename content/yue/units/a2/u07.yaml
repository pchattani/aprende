      - { es: "你試吓呢碟菇吖，好好食。", en: "Try this plate of mushrooms, it's really good.", altEs: ["你試吓呢碟菇吖，好好食㗎。", "試吓呢碟菇吖，好好食。"], grammar: [g.aa1-offer, g.haa-briefly], vocab: [w.si3, w.dip2, w.gu1] }
      - { es: "我請你吖，你上次請咗我。", en: "Let me treat you, you treated me last time.", altEs: ["今次我請你吖，你上次請咗我。", "我請你吖，上次你請咗我。"], altEn: ["It's on me, you paid last time."], grammar: [g.aa1-offer, g.zo-perfective], vocab: [w.ceng2, w.soeng6-ci3] }
      - { es: "好嘅，我等陣打畀你。", en: "OK, I'll call you later.", altEs: ["好嘅，我一陣打畀你。", "好嘅，我遲啲打畀你。"], altEn: ["Sure, I'll ring you in a bit."], grammar: [g.aa1-offer], vocab: [w.hou2-ge2, w.daa2-bei2] }
      - { es: "係咩？我唔知喎。", en: "Really? I didn't know.", altEs: ["係咩？我都唔知喎。", "真係？我唔知喎。"], altEn: ["Is that so? I had no idea."], grammar: [g.aa1-offer], vocab: [w.hai6-me1, w.m4-zi1] }
      - { es: "吓？你講乜嘢呀？", en: "Huh? What did you say?", altEs: ["吓？你講咩呀？", "吓？你頭先講乜嘢呀？"], altEn: ["What? What are you saying?"], grammar: [g.question-words], vocab: [w.haa2, w.gong2] }
      - { es: "咦，你都喺度嘅？", en: "Oh, you're here too?", altEs: ["咦，你都喺度呀？", "咦，你又喺度嘅？"], altEn: ["Huh, fancy seeing you here!"], grammar: [g.dou-also], vocab: [w.ji2.b, w.hai2-dou6] }
      - { es: "佢識講廣東話㗎，佢媽媽係香港人吖嘛。", en: "She speaks Cantonese, her mum is from Hong Kong, after all.", altEs: ["佢識講廣東話㗎，佢阿媽係香港人吖嘛。"], altEn: ["He can speak Cantonese, his mother's a Hongkonger, you see."], grammar: [g.aa1-offer, g.sik-know-how], vocab: [w.aa1-maa3, w.gwong2-dung1-waa2, w.maa4-maa1] }
