id: c1.u09
title: Verga e Pirandello
lessons:
  - id: c1.u09.l1
    title: Il verismo
    teach: [g.literary-language]
    tip: "In 19th-century prose expect egli, ella, essi, the passato remoto and forms like giacché or ove. Recognise them; don't use them in conversation."
    vocab: [w.verismo, w.verista, w.novella, w.romanzo, w.romanziere, w.scrittore, w.autore, w.letteratura, w.letterario, w.provvidenza, w.fato, w.vinto, w.ciclo, w.ottocentesco, w.novecentesco, w.contemporaneo, w.capitolo, w.brano, w.egli, w.ella, w.esso, w.liceo, w.vincitore, w.ben]
    sentences:
      - { es: "Egli guardò il mare e tacque.", en: "He looked at the sea and fell silent.", altEs: ["Lui guardò il mare e tacque."], grammar: [g.literary-language, g.passato-remoto-irregular], vocab: [w.egli], transform: { instruction: "Modernise it: lui and the passato prossimo", answer: "Lui ha guardato il mare e non ha detto niente.", alt: ["Ha guardato il mare e non ha detto niente.", "Lui ha guardato il mare e ha taciuto."], en: "He looked at the sea and didn't say anything." } }
      - { es: "Ella sorrise e non rispose.", en: "She smiled and did not answer.", altEs: ["Lei sorrise e non rispose."], grammar: [g.literary-language, g.passato-remoto-irregular], vocab: [w.ella] }
      - { es: "Essi partirono all'alba, senza voltarsi.", en: "They left at dawn, without looking back.", altEs: ["Partirono all'alba, senza voltarsi."], grammar: [g.literary-language, g.passato-remoto-forms], vocab: [w.esso], transform: { instruction: "Modernise it: drop essi and use the passato prossimo", answer: "Sono partiti all'alba, senza voltarsi.", alt: ["Loro sono partiti all'alba, senza voltarsi.", "Sono partiti all'alba senza voltarsi."], en: "They left at dawn, without looking back." } }
      - { es: "Pubblicato nel 1881, I Malavoglia è il romanzo più famoso di Giovanni Verga.", en: "Published in 1881, I Malavoglia is Giovanni Verga's most famous novel.", altEs: ["I Malavoglia, pubblicato nel 1881, è il romanzo più famoso di Giovanni Verga."], grammar: [g.participio-assoluto, g.superlatives], vocab: [w.romanzo] }
      - { es: "La barca dei Malavoglia si chiamava Provvidenza, ma di provvidenza ne ebbero ben poca.", en: "The Malavoglia family's boat was called Provvidenza, but they had precious little providence.", grammar: [g.literary-language, g.ne-partitive], vocab: [w.provvidenza] }
      - { es: "Durante una tempesta la Provvidenza naufraga, e per la famiglia comincia la rovina.", en: "During a storm the Provvidenza is wrecked, and the family's ruin begins.", altEs: ["Durante una tempesta la Provvidenza fa naufragio, e per la famiglia comincia la rovina."], grammar: [g.literary-language], vocab: [] }
      - { es: "Verga voleva raccontare la storia dei vinti, cioè di chi perde la lotta per la vita.", en: "Verga wanted to tell the story of the defeated, that is, of those who lose the struggle for life.", grammar: [g.literary-language, g.relative-chi-quello-che], vocab: [w.vinto] }
      - { es: "Del ciclo dei vinti, Verga riuscì a completare soltanto due romanzi su cinque.", en: "Of the Cycle of the Defeated, Verga managed to complete only two novels out of five.", altEs: ["Del ciclo dei vinti, Verga completò solo due romanzi su cinque."], grammar: [g.passato-remoto-forms, g.word-order-marked], vocab: [w.ciclo] }
      - { es: "Lo scrittore verista non giudica i suoi personaggi: li lascia parlare.", en: "The verist writer doesn't judge his characters: he lets them speak.", grammar: [g.literary-language, g.lasciare-infinitive], vocab: [w.scrittore, w.verista] }
      - { es: "Nel verismo l'autore si nasconde: sembra che la storia si racconti da sé.", en: "In verismo the author hides: it seems as if the story tells itself.", grammar: [g.literary-language, g.congiuntivo-opinion], vocab: [w.verismo, w.autore] }
      - { es: "Il fato, nelle novelle di Verga, sembra più forte di ogni volontà umana.", en: "In Verga's short stories, fate seems stronger than any human will.", grammar: [g.literary-language], vocab: [w.fato, w.novella] }
      - { es: "Il romanzo è ambientato ad Aci Trezza; esso descrive la vita di una famiglia di pescatori.", en: "The novel is set in Aci Trezza; it describes the life of a family of fishermen.", altEs: ["Il romanzo è ambientato ad Aci Trezza e descrive la vita di una famiglia di pescatori."], grammar: [g.literary-language], vocab: [w.esso, w.pescatore] }
      - { es: "La letteratura ottocentesca racconta spesso il mondo dei contadini.", en: "Nineteenth-century literature often depicts the world of peasants.", altEs: ["La letteratura dell'Ottocento racconta spesso il mondo dei contadini."], grammar: [g.literary-language], vocab: [w.letteratura, w.ottocentesco] }
      - { es: "Quale romanziere contemporaneo consiglieresti a chi ama Verga?", en: "Which contemporary novelist would you recommend to someone who loves Verga?", altEs: ["Che romanziere contemporaneo consiglieresti a chi ama Verga?"], grammar: [g.condizionale-presente, g.relative-chi-quello-che], vocab: [w.romanziere, w.contemporaneo] }
      - { es: "Al liceo odiavo le novelle di Verga; ora le rileggo sulla spiaggia, per piacere.", en: "At school I hated Verga's short stories; now I reread them on the beach, for pleasure.", altEs: ["Al liceo odiavo le novelle di Verga, ora le rileggo sulla spiaggia per piacere."], grammar: [g.passato-prossimo-vs-imperfetto], vocab: [w.liceo, w.novella] }
      - { es: "Giacché sei qui, aiutami a capire questo brano del terzo capitolo.", en: "Since you're here, help me understand this passage in the third chapter.", altEs: ["Dato che sei qui, aiutami a capire questo brano del terzo capitolo."], grammar: [g.literary-language, g.imperativo-pronouns], vocab: [w.brano, w.capitolo], error: { wrong: "Giaché sei qui, aiutami a capire questo brano del terzo capitolo.", explain: "giacché has a double c and an accent: già + che.", grammar: g.literary-language } }
    exchanges:
      - q: { es: "Hai mai letto I Malavoglia?", en: "Have you ever read I Malavoglia?" }
        a: { es: "Sì, a scuola, ma l'ho apprezzato davvero solo da adulto.", en: "Yes, at school, but I only really appreciated it as an adult." }
        alt: ["Sì, al liceo.", "No, mai: è lungo?"]
        grammar: [g.gia-ancora-mai]
        vocab: [w.romanzo]
      - q: { es: "Che cos'è il verismo?", en: "What is verismo?" }
        a: { es: "Un movimento letterario che vuole rappresentare la realtà senza commenti dell'autore.", en: "A literary movement that aims to depict reality without the author's comments." }
        alt: ["È il realismo italiano di fine Ottocento.", "Il movimento di Verga e Capuana."]
        grammar: [g.literary-language, g.relative-che]
        vocab: [w.verismo, w.letterario]
      - q: { es: "Chi sono i «vinti» di Verga?", en: "Who are Verga's 'defeated'?" }
        a: { es: "I poveri, i pescatori, i contadini: chi perde nella lotta per la sopravvivenza.", en: "The poor, fishermen, peasants: those who lose in the struggle to survive." }
        alt: ["I poveri e gli sconfitti.", "Chi perde la lotta per la vita."]
        grammar: [g.literary-language]
        vocab: [w.vinto]
      - q: { es: "Mi consigli una novella breve?", en: "Can you recommend a short story?" }
        a: { es: "Rosso Malpelo: sono poche pagine, ma non la dimentichi più.", en: "Rosso Malpelo: it's only a few pages, but you'll never forget it." }
        alt: ["La roba, di Verga.", "Cavalleria rusticana."]
        grammar: [g.literary-language]
        vocab: [w.novella]
      - q: { es: "Perché in questo romanzo si dice «egli» e non «lui»?", en: "Why does this novel say 'egli' rather than 'lui'?" }
        a: { es: "Perché è un testo ottocentesco: allora era normale nella lingua scritta.", en: "Because it's a nineteenth-century text: back then it was normal in written language." }
        alt: ["Perché è un romanzo dell'Ottocento.", "È una forma letteraria."]
        grammar: [g.literary-language]
        vocab: [w.egli, w.ottocentesco]
    texts:
      - title: "Quarta di copertina"
        es: ["Aci Trezza, metà dell'Ottocento.", "La famiglia Toscano, detta «i Malavoglia», compra un carico di lupini e lo affida alla barca Provvidenza.", "Durante una tempesta la barca naufraga, e per la famiglia comincia la rovina."]
        en: ["Aci Trezza, the mid-nineteenth century.", "The Toscano family, known as 'the Malavoglia', buy a cargo of lupins and entrust it to their boat, the Provvidenza.", "During a storm the boat is wrecked, and the family's ruin begins."]
        grammar: [g.literary-language]
        vocab: [w.provvidenza]
      - title: "Appunti per l'esame"
        es: ["Verga nasce a Catania nel 1840.", "Dopo gli anni a Firenze e a Milano, si avvicina al verismo.", "Nel 1881 pubblica I Malavoglia, primo romanzo del ciclo dei vinti."]
        en: ["Verga is born in Catania in 1840.", "After his years in Florence and Milan, he turns to verismo.", "In 1881 he publishes I Malavoglia, the first novel of the Cycle of the Defeated."]
        grammar: [g.literary-language, g.present-for-future]
        vocab: [w.verismo, w.ciclo, w.novecentesco]
    spicy:
      - { es: "Ella lo guardò negli occhi e capì che quella sera la letteratura poteva aspettare.", en: "She looked him in the eyes and understood that literature could wait that evening.", grammar: [g.literary-language, g.passato-remoto-forms], vocab: [w.ella, w.letteratura] }
      - { es: "Chiamalo fato o chiamalo provvidenza: io lo chiamo «il tavolo accanto al tuo».", en: "Call it fate or call it providence: I call it 'the table next to yours'.", grammar: [g.literary-language, g.imperativo-pronouns], vocab: [w.fato, w.provvidenza] }
      - { es: "Non sarò un romanziere, ma il capitolo di stasera lo scriviamo insieme.", en: "I may not be a novelist, but tonight's chapter we'll write together.", altEs: ["Non sarò una romanziera, ma il capitolo di stasera lo scriviamo insieme."], grammar: [g.dislocation, g.futuro-probability], vocab: [w.romanziere, w.capitolo] }
      - { es: "Leggimi un brano di Verga con quella voce, e ti seguo fino ad Aci Trezza.", en: "Read me a passage of Verga in that voice, and I'll follow you all the way to Aci Trezza.", grammar: [g.imperativo-pronouns], vocab: [w.brano] }
      - { es: "Ho letto tutto il ciclo dei vinti, ma da quando ti conosco mi sento un vincitore.", en: "I've read the whole Cycle of the Defeated, but since I met you I've felt like a winner.", altEs: ["Ho letto tutto il ciclo dei vinti, ma da quando ti conosco mi sento una vincitrice."], grammar: [g.da-since], vocab: [w.ciclo, w.vincitore] }
  - id: c1.u09.l2
    title: Sarebbe partito, finalmente!
    teach: [g.discorso-indiretto-libero]
    tip: "Free indirect speech has no 'he thought that': third person and past tenses, but the character's own exclamations, questions and judgements. Sarebbe partito, finalmente!"
    vocab: [w.voce-narrante, w.flusso-di-coscienza, w.intreccio, w.antagonista, w.ambientazione, w.malaria, w.zolfara, w.carusu, w.mestiere, w.umile, w.rassegnazione, w.sconforto, w.turbamento, w.ostinazione, w.stoico, w.fatalismo, w.costui, w.colui, w.disgrazia, w.molo, w.zolfo]
    sentences:
      - { es: "'Ntoni guardava il mare. Sarebbe partito, sì, e avrebbe fatto fortuna!", en: "'Ntoni looked at the sea. He would leave, yes, and he'd make his fortune!", grammar: [g.discorso-indiretto-libero, g.condizionale-passato], vocab: [w.partire] }
      - { es: "Che colpa ne aveva lui, se la barca era affondata?", en: "Was it his fault if the boat had sunk?", altEs: ["Che colpa ne aveva, lui, se la barca era affondata?"], grammar: [g.discorso-indiretto-libero, g.trapassato-prossimo], vocab: [w.colpa] }
      - { es: "Era tardi, troppo tardi ormai. Doveva decidersi.", en: "It was late, too late now. He had to make up his mind.", grammar: [g.discorso-indiretto-libero, g.imperfetto-uses], vocab: [w.decidere] }
      - { es: "E se poi non tornava? Chi avrebbe pensato alla madre?", en: "And what if he didn't come back? Who would look after their mother?", grammar: [g.discorso-indiretto-libero, g.condizionale-passato], vocab: [w.tornare] }
      - { es: "Tutti in paese lo dicevano: quella era gente che non sapeva stare al suo posto.", en: "Everyone in the village said so: those were people who didn't know their place.", grammar: [g.discorso-indiretto-libero], vocab: [w.paese] }
      - { es: "Pensò: «Domani parto!»", en: "He thought: 'Tomorrow I'm leaving!'", grammar: [g.discorso-indiretto-libero], vocab: [w.partire], transform: { instruction: "Turn it into free indirect speech (no Pensò)", answer: "Domani sarebbe partito, finalmente!", alt: ["Il giorno dopo sarebbe partito, finalmente!", "Domani sarebbe partito!"], en: "Tomorrow he would leave, at last!" } }
      - { es: "Disse: «Non tornerò mai più in quella zolfara.»", en: "He said: 'I'll never go back to that sulphur mine.'", grammar: [g.discorso-indiretto-libero, g.reported-speech-advanced], vocab: [w.zolfara], transform: { instruction: "Turn it into indirect speech with disse che", answer: "Disse che non sarebbe mai più tornato in quella zolfara.", alt: ["Disse che non sarebbe più tornato in quella zolfara."], en: "He said he would never go back to that sulphur mine." } }
      - { es: "Nella novella la voce narrante sembra quella del paese intero.", en: "In the short story the narrative voice seems to be that of the whole village.", grammar: [g.discorso-indiretto-libero], vocab: [w.voce-narrante] }
      - { es: "Ciàula lavorava come carusu in una zolfara e respirava zolfo dalla mattina alla sera.", en: "Ciàula worked as a boy miner in a sulphur mine and breathed sulphur from morning to night.", grammar: [g.imperfetto-uses], vocab: [w.carusu, w.zolfara, w.zolfo] }
      - { es: "In quelle campagne la malaria era più temuta della fame.", en: "In that countryside malaria was feared more than hunger.", grammar: [g.comparatives, g.passive-essere], vocab: [w.malaria] }
      - { es: "Padron 'Ntoni accettava ogni disgrazia con una rassegnazione quasi stoica.", en: "Padron 'Ntoni accepted every misfortune with an almost stoic resignation.", grammar: [g.literary-language], vocab: [w.disgrazia, w.rassegnazione, w.stoico] }
      - { es: "Secondo il vecchio, chi lascia l'umile mestiere dei padri finisce male.", en: "According to the old man, whoever abandons the humble trade of his forefathers comes to a bad end.", grammar: [g.discorso-indiretto-libero, g.relative-chi-quello-che], vocab: [w.umile, w.mestiere] }
      - { es: "L'intreccio è semplice, ma l'ambientazione è descritta con grande precisione.", en: "The plot is simple, but the setting is described with great precision.", grammar: [g.passive-essere], vocab: [w.intreccio, w.ambientazione] }
      - { es: "Chi era costui che entrava in casa senza nemmeno salutare?", en: "Who was this fellow who came into the house without even saying hello?", altEs: ["Chi era costui, che entrava in casa senza neanche salutare?"], grammar: [g.discorso-indiretto-libero, g.literary-language], vocab: [w.costui] }
      - { es: "Il fatalismo dei pescatori è anche una forma di ostinazione: resistere, sempre.", en: "The fishermen's fatalism is also a form of obstinacy: holding out, always.", grammar: [g.discorso-indiretto-libero], vocab: [w.fatalismo, w.ostinazione] }
      - { es: "Che sconforto, quella lettera! Non sapeva più che cosa pensare.", en: "What dismay that letter caused! She no longer knew what to think.", grammar: [g.discorso-indiretto-libero], vocab: [w.sconforto], error: { wrong: "Che sconforto, quella lettera! Non sapevo più che cosa pensare.", explain: "Free indirect speech keeps the third person: non sapeva più.", grammar: g.discorso-indiretto-libero } }
    exchanges:
      - q: { es: "Chi parla in questo brano?", en: "Who is speaking in this passage?" }
        a: { es: "Formalmente il narratore, ma in realtà sentiamo la voce del personaggio.", en: "Formally the narrator, but really we hear the character's voice." }
        alt: ["Il personaggio, attraverso il narratore.", "È discorso indiretto libero."]
        grammar: [g.discorso-indiretto-libero]
        vocab: [w.voce-narrante]
      - q: { es: "Che cos'era una zolfara?", en: "What was a zolfara?" }
        a: { es: "Una miniera di zolfo; ci lavoravano anche ragazzi giovanissimi, i carusi.", en: "A sulphur mine; very young boys, the carusi, worked there too." }
        alt: ["Una miniera di zolfo.", "Una miniera siciliana di zolfo."]
        grammar: [g.imperfetto-uses]
        vocab: [w.zolfara, w.zolfo, w.carusu]
      - q: { es: "Perché 'Ntoni vuole partire?", en: "Why does 'Ntoni want to leave?" }
        a: { es: "Perché non accetta di fare per tutta la vita l'umile mestiere del nonno.", en: "Because he won't accept doing his grandfather's humble trade all his life." }
        alt: ["Vuole fare fortuna.", "Perché il paese gli sta stretto."]
        grammar: [g.discorso-indiretto-libero]
        vocab: [w.umile, w.mestiere]
      - q: { es: "Come reagisce la famiglia alle disgrazie?", en: "How does the family react to misfortune?" }
        a: { es: "Con rassegnazione, quasi con fatalismo: è il destino dei vinti.", en: "With resignation, almost fatalism: it's the fate of the defeated." }
        alt: ["Con rassegnazione.", "Con un'ostinazione silenziosa."]
        grammar: [g.discorso-indiretto-libero]
        vocab: [w.rassegnazione, w.fatalismo]
      - q: { es: "Chi è l'antagonista del romanzo?", en: "Who is the antagonist of the novel?" }
        a: { es: "Non è una persona: è il mare, o forse la storia stessa.", en: "It isn't a person: it's the sea, or perhaps history itself." }
        alt: ["Il mare.", "Il destino."]
        grammar: [g.discorso-indiretto-libero]
        vocab: [w.antagonista]
    texts:
      - title: "Discorso indiretto libero"
        es: ["'Ntoni fumava sul molo e guardava le navi.", "Lui non sarebbe rimasto lì a contare le acciughe tutta la vita!", "Fuori c'era il mondo, e il mondo lo aspettava."]
        en: ["'Ntoni was smoking on the quay, watching the ships.", "He wasn't going to stay there counting anchovies all his life!", "Out there was the world, and the world was waiting for him."]
        grammar: [g.discorso-indiretto-libero]
        vocab: [w.molo]
      - title: "Ciàula scopre la luna"
        es: ["Ciàula era un carusu e lavorava in una zolfara.", "Del buio della miniera non aveva paura; del buio della notte, sì.", "Quella sera, uscendo, vide la luna e si mise a piangere."]
        en: ["Ciàula was a boy miner and worked in a sulphur mine.", "He wasn't afraid of the darkness of the mine; of the darkness of the night, he was.", "That evening, coming out, he saw the moon and began to cry."]
        grammar: [g.discorso-indiretto-libero, g.passato-remoto-forms]
        vocab: [w.carusu, w.zolfara, w.turbamento, w.flusso-di-coscienza]
    spicy:
      - { es: "Le aveva sorriso, sì, proprio a lei! E adesso che cosa avrebbe fatto?", en: "He had smiled at her, yes, at her! And now what was she going to do?", grammar: [g.discorso-indiretto-libero, g.condizionale-passato], vocab: [w.sorridere] }
      - { es: "Sarebbe passato a prenderla alle otto, profumato e puntuale, per una volta.", en: "He'd pick her up at eight, freshly scented and on time, for once.", grammar: [g.discorso-indiretto-libero, g.condizionale-passato], vocab: [w.puntuale] }
      - { es: "Chi era costui che ballava così bene e non le aveva ancora chiesto il nome?", en: "Who was this fellow who danced so well and still hadn't asked her name?", grammar: [g.discorso-indiretto-libero, g.literary-language], vocab: [w.costui] }
      - { es: "Stoica, aspettò il suo messaggio fino a mezzanotte; poi, con ostinazione, fino all'una.", en: "Stoically, she waited for his message until midnight; then, stubbornly, until one.", grammar: [g.discorso-indiretto-libero, g.passato-remoto-forms], vocab: [w.stoico, w.ostinazione] }
      - { es: "Colui che riuscirà a farmi ridere a colazione avrà il mio cuore e l'ultimo cornetto.", en: "He who manages to make me laugh at breakfast will have my heart and the last croissant.", grammar: [g.literary-language, g.futuro-semplice], vocab: [w.colui] }
  - id: c1.u09.l3
    title: Uno, nessuno e centomila
    teach: [g.literary-language]
    tip: "Pirandello asks who we really are. Read him with these literary words in mind: sovente (spesso), talvolta (a volte), ove (dove / se), giammai (mai), codesto (quello vicino a te)."
    vocab: [w.identità, w.relativismo, w.follia, w.pazzia, w.esistenza, w.esistenziale, w.apparenza, w.alienazione, w.smarrimento, w.estraneo, w.riflettere, w.riflessione, w.codesto, w.ove, w.sovente, w.talvolta, w.invero, w.alquanto, w.giammai, w.tosto, w.finzione, w.ricominciare]
    sentences:
      - { es: "Vitangelo Moscarda scopre, grazie alla moglie, che il suo naso pende verso destra.", en: "Vitangelo Moscarda discovers, thanks to his wife, that his nose tilts to the right.", grammar: [g.literary-language], vocab: [w.scoprire] }
      - { es: "Da quel giorno egli non si riconosce più: chi è davvero, uno, nessuno o centomila?", en: "From that day on he no longer recognises himself: who is he really, one, no one or a hundred thousand?", grammar: [g.literary-language], vocab: [w.egli, w.riconoscere] }
      - { es: "Per Pirandello l'identità è una maschera che gli altri ci mettono addosso.", en: "For Pirandello identity is a mask that other people put on us.", grammar: [g.literary-language, g.relative-che], vocab: [w.identità] }
      - { es: "Creduto morto, Mattia Pascal prova a vivere una seconda esistenza sotto un altro nome.", en: "Believed dead, Mattia Pascal tries to live a second existence under another name.", altEs: ["Mattia Pascal, creduto morto, prova a vivere una seconda esistenza con un altro nome."], grammar: [g.participio-assoluto, g.subordination-implicit], vocab: [w.esistenza] }
      - { es: "Il relativismo di Pirandello è tutto nel titolo di una sua commedia: Così è (se vi pare).", en: "Pirandello's relativism is all there in the title of one of his plays: Right You Are (If You Think So).", grammar: [g.literary-language], vocab: [w.relativismo] }
      - { es: "Nelle sue opere la follia è talvolta l'unico modo per dire la verità.", en: "In his works madness is sometimes the only way to tell the truth.", altEs: ["Nelle sue opere la follia è a volte l'unico modo per dire la verità."], grammar: [g.literary-language], vocab: [w.follia, w.talvolta] }
      - { es: "In Enrico IV la pazzia è prima vera e poi recitata.", en: "In Henry IV the madness is first real and then acted.", grammar: [g.literary-language], vocab: [w.pazzia] }
      - { es: "Codesto libro che tieni in mano è una prima edizione?", en: "Is that book you're holding a first edition?", altEs: ["Quel libro che tieni in mano è una prima edizione?"], grammar: [g.literary-language], vocab: [w.codesto] }
      - { es: "Ove fosse necessario, consulti le note in fondo al volume.", en: "Where necessary, consult the notes at the back of the volume.", grammar: [g.literary-language, g.conditional-conjunctions], vocab: [w.ove], transform: { instruction: "Modernise it: replace ove with se", answer: "Se fosse necessario, consulti le note in fondo al volume.", alt: ["Se è necessario, consulti le note in fondo al volume.", "Qualora fosse necessario, consulti le note in fondo al volume."], en: "If necessary, consult the notes at the back of the volume." } }
      - { es: "Sovente il protagonista si sente estraneo nella propria casa.", en: "The protagonist often feels a stranger in his own home.", grammar: [g.literary-language], vocab: [w.sovente, w.estraneo], transform: { instruction: "Modernise it: replace sovente with spesso", answer: "Spesso il protagonista si sente estraneo nella propria casa.", alt: ["Il protagonista si sente spesso estraneo nella propria casa."], en: "The protagonist often feels a stranger in his own home." } }
      - { es: "Giammai avrebbe immaginato di diventare un altro.", en: "Never would he have imagined becoming someone else.", altEs: ["Mai avrebbe immaginato di diventare un altro."], grammar: [g.literary-language, g.condizionale-passato], vocab: [w.giammai] }
      - { es: "Invero, il problema non è il naso: è lo sguardo degli altri.", en: "In truth, the problem isn't the nose: it's the way others look at you.", altEs: ["In realtà, il problema non è il naso: è lo sguardo degli altri."], grammar: [g.literary-language], vocab: [w.invero] }
      - { es: "Tosto si alzò e uscì senza salutare.", en: "At once he got up and left without saying goodbye.", altEs: ["Subito si alzò e uscì senza salutare."], grammar: [g.literary-language, g.passato-remoto-forms], vocab: [w.tosto] }
      - { es: "Riflettendo sulla sua vita, provò un senso di smarrimento e di alienazione.", en: "Reflecting on his life, he felt a sense of bewilderment and alienation.", grammar: [g.subordination-implicit, g.passato-remoto-forms], vocab: [w.riflettere, w.smarrimento, w.alienazione] }
      - { es: "Dietro l'apparenza di una vita normale si nasconde un'angoscia esistenziale.", en: "Behind the appearance of a normal life lies an existential anguish.", grammar: [g.word-order-marked], vocab: [w.apparenza, w.esistenziale] }
      - { es: "Pirandello nacque ad Agrigento nel 1867 e morì a Roma nel 1936.", en: "Pirandello was born in Agrigento in 1867 and died in Rome in 1936.", grammar: [g.passato-remoto-irregular], vocab: [w.nascere], error: { wrong: "Pirandello nascette ad Agrigento nel 1867 e morì a Roma nel 1936.", explain: "The passato remoto of nascere is nacque (nascette is dialect).", grammar: g.passato-remoto-irregular } }
    exchanges:
      - q: { es: "Hai letto Il fu Mattia Pascal?", en: "Have you read The Late Mattia Pascal?" }
        a: { es: "Sì: è la storia di un uomo che tutti credono morto e che prova a ricominciare da capo.", en: "Yes: it's the story of a man everyone believes is dead, who tries to start all over again." }
        alt: ["Sì, due volte.", "Non ancora, ma ce l'ho sul comodino."]
        grammar: [g.relative-che]
        vocab: [w.ricominciare]
      - q: { es: "Che cosa vuol dire «codesto»?", en: "What does 'codesto' mean?" }
        a: { es: "È una forma letteraria, ancora viva in Toscana: indica una cosa vicina a chi ascolta.", en: "It's a literary form, still alive in Tuscany: it refers to something near the listener." }
        alt: ["Vuol dire «quello vicino a te».", "È come «quello», ma vicino a te."]
        grammar: [g.literary-language]
        vocab: [w.codesto]
      - q: { es: "Perché Moscarda entra in crisi?", en: "Why does Moscarda go into crisis?" }
        a: { es: "Perché scopre che per gli altri è centomila persone diverse, e per sé stesso nessuno.", en: "Because he discovers that to others he's a hundred thousand different people, and to himself no one." }
        alt: ["Per colpa del suo naso!", "Perché non sa più chi è."]
        grammar: [g.literary-language]
        vocab: [w.identità]
      - q: { es: "Ti è piaciuto il romanzo?", en: "Did you like the novel?" }
        a: { es: "Alquanto, anche se talvolta mi ha messo un po' d'angoscia.", en: "Quite a lot, though at times it made me a bit anxious." }
        alt: ["Moltissimo.", "Insomma: è alquanto pesante."]
        grammar: [g.literary-language]
        vocab: [w.alquanto, w.talvolta]
      - q: { es: "Qual è il grande tema di Pirandello?", en: "What is Pirandello's great theme?" }
        a: { es: "Il contrasto tra l'apparenza e la vera identità delle persone.", en: "The contrast between appearance and people's true identity." }
        alt: ["L'identità.", "La maschera e il volto."]
        grammar: [g.nominalization]
        vocab: [w.apparenza, w.identità, w.finzione, w.riflessione]
    texts:
      - title: "Lettera al giornale"
        es: ["Gentile direttore, ove mi fosse concesso, vorrei esprimere un parere.", "Sovente si legge che Pirandello è un autore difficile.", "Invero, basta un'ora di lettura per sentirsi suoi contemporanei."]
        en: ["Dear Editor, if I may, I would like to express an opinion.", "One often reads that Pirandello is a difficult author.", "In truth, an hour's reading is enough to feel like his contemporaries."]
        grammar: [g.literary-language, g.formal-letters]
        vocab: [w.ove, w.sovente, w.invero]
      - title: "Pirandello in breve"
        es: ["Nato ad Agrigento nel 1867, Pirandello studiò a Palermo, a Roma e a Bonn.", "Nei suoi romanzi e nel suo teatro domina il tema dell'identità.", "Morì a Roma nel 1936, due anni dopo il premio Nobel."]
        en: ["Born in Agrigento in 1867, Pirandello studied in Palermo, Rome and Bonn.", "In his novels and his plays the theme of identity dominates.", "He died in Rome in 1936, two years after the Nobel Prize."]
        grammar: [g.passato-remoto-forms, g.participio-assoluto]
        vocab: [w.identità, w.premio-nobel]
    spicy:
      - { es: "Per mia madre sono un angelo, per i miei amici un disastro; per te, stasera, vorrei essere uno solo: quello giusto.", en: "To my mother I'm an angel, to my friends a disaster; for you, tonight, I'd like to be just one: the right one.", altEs: ["Per mia madre sono un angelo, per i miei amici un disastro; per te, stasera, vorrei essere una sola: quella giusta."], grammar: [g.literary-language, g.condizionale-courtesy], vocab: [w.identità] }
      - { es: "Giammai avrei pensato di innamorarmi a un corso su Pirandello.", en: "Never would I have thought I'd fall in love at a Pirandello course.", grammar: [g.literary-language, g.condizionale-passato], vocab: [w.giammai] }
      - { es: "Codesti occhi che mi guardano così, sono sempre stati tuoi o li hai presi in prestito?", en: "Those eyes looking at me like that: have they always been yours, or did you borrow them?", grammar: [g.literary-language, g.dislocation], vocab: [w.codesto] }
      - { es: "Talvolta mi chiedo se tu sia vero o solo una bella apparenza; poi sorridi, e smetto di riflettere.", en: "Sometimes I wonder whether you're real or just a lovely appearance; then you smile, and I stop thinking.", altEs: ["Talvolta mi chiedo se tu sia vera o solo una bella apparenza; poi sorridi, e smetto di riflettere."], grammar: [g.literary-language, g.congiuntivo-nuance], vocab: [w.talvolta, w.apparenza, w.riflettere] }
      - { es: "Follia, dici? Forse: invitarti al mare a novembre è alquanto folle, ma tu hai detto sì.", en: "Madness, you say? Perhaps: inviting you to the seaside in November is somewhat crazy, but you said yes.", grammar: [g.literary-language, g.infinito-sostantivato], vocab: [w.follia, w.alquanto] }
  - id: c1.u09.l4
    title: Vendesi villa, cercasi attori
    teach: [g.enclitics-literary]
    tip: "Signs keep the old enclitic si: Vendesi, Affittasi, Cercasi. Don't invent new ones: mangiasi does not exist."
    vocab: [w.dicesi, w.vendesi, w.affittasi, w.cercasi, w.opera-teatrale, w.dramma, w.commedia, w.tragedia, w.atto, w.scena, w.metateatro, w.monologo, w.interpretare, w.interpretazione, w.rappresentazione, w.messa-in-scena, w.compagnia-teatrale, w.critica-letteraria, w.premio-nobel, w.poeta, w.poesia, w.vendita, w.fulmine]
    sentences:
      - { es: "Vendesi villa con vista mare a Porto Cervo.", en: "Villa with sea view for sale in Porto Cervo.", grammar: [g.enclitics-literary], vocab: [w.vendesi, w.villa] }
      - { es: "Affittasi monolocale arredato, a due passi dalla spiaggia.", en: "Furnished studio flat to let, a stone's throw from the beach.", grammar: [g.enclitics-literary], vocab: [w.affittasi, w.monolocale] }
      - { es: "Cercasi cameriere con esperienza per la stagione estiva.", en: "Experienced waiter wanted for the summer season.", altEs: ["Cercasi cameriera con esperienza per la stagione estiva."], grammar: [g.enclitics-literary], vocab: [w.cercasi, w.cameriere] }
      - { es: "Trattasi di un semplice malinteso.", en: "It is a simple misunderstanding.", altEs: ["Si tratta di un semplice malinteso."], grammar: [g.enclitics-literary, g.bureaucratic-italian], vocab: [w.malinteso] }
      - { es: "Dicesi commedia un'opera teatrale a lieto fine.", en: "A comedy is defined as a play with a happy ending.", altEs: ["Si dice commedia un'opera teatrale a lieto fine."], grammar: [g.enclitics-literary], vocab: [w.dicesi, w.commedia, w.opera-teatrale] }
      - { es: "Si vende una villa con giardino.", en: "A villa with a garden is for sale.", altEs: ["Si vende villa con giardino."], grammar: [g.enclitics-literary, g.si-passivante], vocab: [w.villa], transform: { instruction: "Write it as a sign with the enclitic form", answer: "Vendesi villa con giardino.", alt: [], en: "Villa with garden for sale." } }
      - { es: "Si cerca un pizzaiolo per l'estate.", en: "We're looking for a pizza chef for the summer.", altEs: ["Cerchiamo un pizzaiolo per l'estate."], grammar: [g.enclitics-literary, g.si-passivante], vocab: [w.pizzaiolo], transform: { instruction: "Write it as an ad with the enclitic form", answer: "Cercasi pizzaiolo per l'estate.", alt: ["Cercasi pizzaiolo per la stagione estiva."], en: "Pizza chef wanted for the summer." } }
      - { es: "Vendesi barca usata in ottimo stato.", en: "Used boat in excellent condition for sale.", grammar: [g.enclitics-literary], vocab: [w.vendesi, w.barca], error: { wrong: "Vendasi barca usata in ottimo stato.", explain: "The fixed formula is vendesi (vende + si), not vendasi.", grammar: g.enclitics-literary } }
      - { es: "Sei personaggi in cerca d'autore è l'esempio più celebre di metateatro.", en: "Six Characters in Search of an Author is the most famous example of metatheatre.", grammar: [g.superlatives], vocab: [w.metateatro] }
      - { es: "Alla prima, a Roma nel 1921, una parte del pubblico gridò «Manicomio!».", en: "At the premiere, in Rome in 1921, part of the audience shouted 'Madhouse!'.", grammar: [g.passato-remoto-forms], vocab: [w.rappresentazione] }
      - { es: "Nel secondo atto la scena si svolge in un salotto borghese.", en: "In the second act the scene takes place in a middle-class drawing room.", grammar: [g.present-ere-ire], vocab: [w.atto, w.scena] }
      - { es: "Il monologo finale dura dieci minuti e in sala nessuno respira.", en: "The final monologue lasts ten minutes and nobody in the audience breathes.", grammar: [g.present-are], vocab: [w.monologo] }
      - { es: "Chi interpreta il Padre in questa messa in scena?", en: "Who plays the Father in this production?", altEs: ["Chi fa la parte del Padre in questa messa in scena?"], grammar: [g.question-words, g.word-order-marked], vocab: [w.interpretare, w.messa-in-scena] }
      - { es: "Grazia Deledda, nata a Nuoro, vinse il premio Nobel per la letteratura nel 1926.", en: "Grazia Deledda, born in Nuoro, won the Nobel Prize for Literature in 1926.", grammar: [g.passato-remoto-irregular], vocab: [w.premio-nobel] }
      - { es: "Negli ultimi anni la critica letteraria ha riscoperto molti autori sardi.", en: "In recent years literary criticism has rediscovered many Sardinian authors.", grammar: [g.passato-prossimo-avere], vocab: [w.critica-letteraria] }
      - { es: "Prima del teatro, Pirandello fu poeta: la sua prima raccolta di poesie è del 1889.", en: "Before the theatre, Pirandello was a poet: his first collection of poems dates from 1889.", grammar: [g.passato-remoto-forms], vocab: [w.poeta, w.poesia] }
    exchanges:
      - q: { es: "Che cosa c'è scritto sul cartello?", en: "What does the sign say?" }
        a: { es: "«Affittasi»: la casa è in affitto, non in vendita.", en: "'To let': the house is for rent, not for sale." }
        alt: ["Affittasi.", "Che la casa si affitta."]
        grammar: [g.enclitics-literary]
        vocab: [w.affittasi, w.vendita]
      - q: { es: "Hai visto la nuova messa in scena dei Sei personaggi?", en: "Have you seen the new production of Six Characters?" }
        a: { es: "Sì, e gli attori interpretano benissimo il gioco tra realtà e finzione.", en: "Yes, and the actors play the game between reality and fiction brilliantly." }
        alt: ["Sì, bellissima.", "Non ancora, ho i biglietti per sabato."]
        grammar: [g.gia-ancora-mai]
        vocab: [w.messa-in-scena, w.interpretare, w.finzione]
      - q: { es: "È una commedia o una tragedia?", en: "Is it a comedy or a tragedy?" }
        a: { es: "Tutte e due: con Pirandello prima si ride e poi si pensa.", en: "Both: with Pirandello you laugh first and then you think." }
        alt: ["Un dramma, direi.", "Una commedia amara."]
        grammar: [g.si-impersonale]
        vocab: [w.commedia, w.tragedia, w.dramma]
      - q: { es: "Chi è stata la prima italiana a vincere il Nobel per la letteratura?", en: "Who was the first Italian woman to win the Nobel Prize for Literature?" }
        a: { es: "Grazia Deledda, una scrittrice sarda, nel 1926.", en: "Grazia Deledda, a Sardinian writer, in 1926." }
        alt: ["Grazia Deledda.", "La Deledda, nel 1926."]
        grammar: [g.passato-prossimo-essere]
        vocab: [w.premio-nobel, w.scrittore]
      - q: { es: "Cercate ancora attori per la compagnia teatrale?", en: "Are you still looking for actors for the theatre company?" }
        a: { es: "Sì, ci manca un'attrice per il monologo del terzo atto.", en: "Yes, we need an actress for the monologue in the third act." }
        alt: ["No, siamo al completo.", "Sì: cercasi attrice, scriva pure."]
        grammar: [g.enclitics-literary]
        vocab: [w.compagnia-teatrale, w.monologo, w.interpretazione]
    texts:
      - title: "Annunci a Porto Cervo"
        es: ["Vendesi villa con piscina e vista sull'arcipelago.", "Affittasi barca a vela, anche per una sola settimana.", "Cercasi cuoco per ristorante sul porto, da maggio a ottobre."]
        en: ["Villa with pool and view of the archipelago for sale.", "Sailing boat for hire, even for just one week.", "Cook wanted for harbour restaurant, May to October."]
        grammar: [g.enclitics-literary]
        vocab: [w.vendesi, w.affittasi, w.cercasi]
      - title: "Locandina"
        es: ["Sei personaggi in cerca d'autore, di Luigi Pirandello.", "Messa in scena della Compagnia del Molo, in tre atti.", "Rappresentazione all'aperto, sabato alle 21."]
        en: ["Six Characters in Search of an Author, by Luigi Pirandello.", "Production by the Compagnia del Molo, in three acts.", "Open-air performance, Saturday at 9 p.m."]
        grammar: [g.nominalization]
        vocab: [w.messa-in-scena, w.rappresentazione, w.atto]
    spicy:
      - { es: "Cercasi compagno di ballo per stasera: richiesta pazienza, ritmo facoltativo.", en: "Dance partner wanted for tonight: patience required, rhythm optional.", altEs: ["Cercasi compagna di ballo per stasera: richiesta pazienza, ritmo facoltativo."], grammar: [g.enclitics-literary], vocab: [w.cercasi] }
      - { es: "Affittasi cuore, ben tenuto, con vista mare; astenersi perditempo.", en: "Heart to let, well kept, sea view; time-wasters need not apply.", grammar: [g.enclitics-literary], vocab: [w.affittasi] }
      - { es: "Dicesi «colpo di fulmine» quello che mi è successo quando sei entrato in scena.", en: "'Love at first sight' is the name for what happened to me when you came on stage.", altEs: ["Dicesi «colpo di fulmine» quello che mi è successo quando sei entrata in scena."], grammar: [g.enclitics-literary], vocab: [w.dicesi, w.fulmine, w.scena] }
      - { es: "Nel primo atto mi ignori, nel secondo mi sorridi: il terzo lo scriviamo a cena?", en: "In the first act you ignore me, in the second you smile at me: shall we write the third over dinner?", grammar: [g.dislocation], vocab: [w.atto] }
      - { es: "La tua interpretazione del ragazzo timido è perfetta, ma nessuno ci crede.", en: "Your performance as the shy boy is perfect, but nobody believes it.", altEs: ["La tua interpretazione della ragazza timida è perfetta, ma nessuno ci crede."], grammar: [g.ci-place], vocab: [w.interpretazione] }
dialogues:
  - id: c1.u09.d1
    title: Un libro sotto l'ombrellone
    context: "On a beach on the Costa Smeralda, Gavino, a local, finds Nives reading Verga for her exam."
    lines:
      - { speaker: Gavino, es: "Che cosa leggi di bello sotto codesto ombrellone?", en: "What are you reading under that beach umbrella of yours?" }
      - { speaker: Nives, es: "«Codesto»? Parli come un libro dell'Ottocento! Leggo I Malavoglia, per l'esame.", en: "'Codesto'? You talk like a nineteenth-century book! I'm reading I Malavoglia, for my exam." }
      - { speaker: Gavino, es: "Verga in Costa Smeralda? Ci vuole coraggio, tra yacht e ville di lusso.", en: "Verga on the Costa Smeralda? That takes courage, among the yachts and luxury villas." }
      - { speaker: Nives, es: "Appunto: qui tutti vincono, lì tutti perdono. Senti questa: «Il mare non ha paese nemmeno lui, ed è di tutti quelli che lo stanno ad ascoltare.»", en: "Exactly: here everyone wins, there everyone loses. Listen to this: 'The sea has no home town either, and belongs to all those who stop to listen to it.'" }
      - { speaker: Gavino, es: "Bella. Ma chi parla? Il narratore?", en: "Lovely. But who's speaking? The narrator?" }
      - { speaker: Nives, es: "È il bello del romanzo: sembra che parli tutto il paese. È il discorso indiretto libero.", en: "That's the beauty of the novel: it seems as if the whole village is speaking. It's free indirect speech." }
      - { speaker: Gavino, es: "Io, da buon sardo, preferisco la Deledda. Premio Nobel nel 1926, eh.", en: "Me, as a good Sardinian, I prefer Deledda. Nobel Prize in 1926, you know." }
      - { speaker: Nives, es: "Lo so, lo so. E Pirandello nel 1934. Le isole hanno vinto tutto!", en: "I know, I know. And Pirandello in 1934. The islands have won everything!" }
      - { speaker: Gavino, es: "Allora stasera niente discoteca: affittasi barca, cercasi lettrice per Canne al vento al tramonto.", en: "So no club tonight: boat for hire, reader wanted for Reeds in the Wind at sunset." }
      - { speaker: Nives, es: "Vabbè, ma prima finisco il capitolo. Padron 'Ntoni ha appena perso la Provvidenza.", en: "All right, but first I'll finish the chapter. Padron 'Ntoni has just lost the Provvidenza." }
    questions:
      - { q: "Che cosa legge Nives?", options: ["Canne al vento", "I Malavoglia", "Il fu Mattia Pascal"], answer: 1, explain: "She says: Leggo I Malavoglia, per l'esame." }
      - { q: "Perché Nives dice che Gavino parla come un libro dell'Ottocento?", options: ["Perché usa la parola «codesto»", "Perché parla in sardo", "Perché cita Verga"], answer: 0, explain: "Codesto is a literary form typical of old texts (and of Tuscany)." }
      - { q: "Secondo Nives, chi sembra parlare nel romanzo di Verga?", options: ["Solo il narratore", "Tutto il paese", "Lo stesso Verga"], answer: 1, explain: "Sembra che parli tutto il paese: that's Verga's free indirect speech." }
      - { q: "Quale scrittrice preferisce Gavino?", options: ["Grazia Deledda", "Elsa Morante", "Natalia Ginzburg"], answer: 0, explain: "Io, da buon sardo, preferisco la Deledda." }
writing:
  - task: "Write the opening of a short story in the style of Verga's verismo: a poor family of fishermen in a Sicilian village, fate and resignation, the passato remoto and a few literary forms (egli, talvolta, sovente)."
    min: 110
    max: 180
    use: [w.fato, w.umile, w.rassegnazione, w.mestiere, w.disgrazia]
    grammar: [g.literary-language]
    expect:
      - { pattern: "\\b(fu|furono|andò|partì|pianse|crebbero|crebbe|disse|morì|ebbe|venne|si lamentò)(?![a-zà-ù])", hint: "Narrate with the passato remoto: la pesca andò male, partì, pianse…" }
      - { pattern: "\\b(egli|ella|esso|essa|essi|colui|costui|sovente|talvolta|alquanto|giammai|ove)\\b", hint: "Add a literary touch: egli, talvolta, sovente…" }
    model: { es: "I Russo erano pescatori da sempre, come il padre e il padre del padre, ad Aci Trezza, dove il mare dà il pane e talvolta se lo riprende. Il vecchio Turi aveva una barca sola e cinque figli da mantenere. Egli diceva sovente che il mestiere del pescatore è umile, ma onesto, e che a ciascuno tocca la sua parte. Quell'anno, però, la pesca andò male, e i debiti crebbero come l'erba nei campi. Il figlio maggiore, Antonio, partì per fare il soldato, e la madre pianse in silenzio. Poi venne la disgrazia: una notte di tempesta la barca non tornò. Nessuno si lamentò: in quella casa si accettava il fato con rassegnazione, come si accettano la pioggia e il vento.", en: "The Russos had always been fishermen, like their father and their father's father, in Aci Trezza, where the sea gives you bread and sometimes takes it back. Old Turi had a single boat and five children to support. He often said that the fisherman's trade is humble but honest, and that everyone gets his share. That year, however, the fishing went badly, and the debts grew like grass in the fields. The eldest son, Antonio, left to be a soldier, and his mother wept in silence. Then misfortune came: one stormy night the boat did not return. Nobody complained: in that house fate was accepted with resignation, as rain and wind are accepted." }
  - task: "Write a passage in free indirect speech (discorso indiretto libero): the thoughts of a young man in a Sicilian village who decides to leave for the city. Let his voice come through (exclamations, questions, conditional for future plans)."
    min: 110
    max: 180
    use: [w.molo, w.zolfara, w.ostinazione, w.sconforto, w.disgrazia]
    grammar: [g.discorso-indiretto-libero]
    expect:
      - { pattern: "\\b(sarebbe|avrebbe|sarebbero|avrebbero)\\s+\\S+", hint: "Use the conditional for his plans: sarebbe partito, avrebbe trovato…" }
      - { pattern: "[!?]", hint: "Let his voice come through with exclamations and questions." }
    model: { es: "Salvatore guardava le barche dal molo, come ogni sera. Basta, non ne poteva più di quel paese! Sarebbe partito, finalmente, con il primo treno del mattino. Che cosa gli restava lì? Un lavoro da fame nella zolfara, la madre che piangeva per ogni disgrazia, e quella ragazza, Lucia, che non lo guardava nemmeno. In città, invece, avrebbe trovato un posto in fabbrica, avrebbe guadagnato bene e un giorno sarebbe tornato con un vestito elegante e le scarpe nuove. E il padre? Ah, il padre non avrebbe capito: lui non aveva mai lasciato il paese, con quella sua ostinazione da vecchio. Lo sconforto lo prese per un attimo. Poi si alzò: no, questa volta niente e nessuno lo avrebbe fermato.", en: "Salvatore watched the boats from the pier, as he did every evening. Enough, he couldn't stand that village any longer! He would leave, at last, on the first train in the morning. What was left for him there? A starvation wage in the sulphur mine, his mother weeping over every misfortune, and that girl, Lucia, who didn't even look at him. In the city, on the other hand, he would find a job in a factory, earn good money and one day come back in an elegant suit and new shoes. And his father? Ah, his father wouldn't understand: he had never left the village, with that old man's stubbornness of his. Despair seized him for a moment. Then he stood up: no, this time nothing and nobody would stop him." }
  - task: "Write a short reflection on identity inspired by Pirandello's «Uno, nessuno e centomila»: summarise the idea, then argue whether others see us as we see ourselves today."
    min: 120
    max: 190
    use: [w.identità, w.apparenza, w.relativismo, w.riflessione, w.follia]
    grammar: [g.literary-language]
    expect:
      - { pattern: "\\bpirandello\\b", hint: "Refer to Pirandello and his novel." }
      - { pattern: "\\b(ritengo|a mio avviso|a mio parere|credo che|penso che|mi sembra)\\b", hint: "Give your own view: a mio avviso, ritengo che…" }
    model: { es: "Nel romanzo «Uno, nessuno e centomila», Vitangelo Moscarda scopre un giorno, guardandosi allo specchio, che il suo naso pende un po' verso destra. Da questo piccolo dettaglio nasce una crisi profonda: se gli altri lo vedono in modo diverso da come si vede lui, chi è davvero? Per Pirandello ciascuno di noi non ha una sola identità, ma tante quante sono le persone che ci guardano. A mio avviso, questa riflessione è ancora molto attuale. Oggi, sui social, ognuno costruisce un'idea di sé che spesso è solo apparenza. Tuttavia ritengo che il relativismo di Pirandello non debba portarci alla follia, come accade al protagonista, bensì a una maggiore tolleranza: se nessuno conosce la verità sugli altri, forse dovremmo giudicare di meno.", en: "In the novel One, No One and One Hundred Thousand, Vitangelo Moscarda discovers one day, looking at himself in the mirror, that his nose leans slightly to the right. From this small detail a deep crisis arises: if others see him differently from how he sees himself, who is he really? For Pirandello each of us does not have a single identity, but as many as there are people looking at us. In my view, this reflection is still very relevant. Today, on social media, everyone builds an idea of themselves that is often mere appearance. However, I believe Pirandello's relativism should lead us not to madness, as happens to the protagonist, but to greater tolerance: if nobody knows the truth about others, perhaps we should judge less." }
  - task: "Write some small ads for a theatre company in the old-fashioned enclitic style (cercasi, affittasi, vendesi), then explain in modern Italian how these forms work."
    min: 110
    max: 180
    use: [w.cercasi, w.affittasi, w.vendesi, w.compagnia-teatrale, w.dicesi]
    grammar: [g.enclitics-literary]
    expect:
      - { pattern: "\\b(vendesi|affittasi|cercasi|dicesi|leggesi|parlasi)\\b", hint: "Use enclitic forms: cercasi, affittasi, vendesi…" }
      - { pattern: "\\b(si cercano|si cerca|si affitta|si vende|si vendono|si dice)\\b", hint: "Explain them in modern Italian: cercasi = si cerca…" }
    model: { es: "Cercasi attori e attrici, anche senza esperienza, per la messa in scena di «Così è (se vi pare)» di Pirandello. La compagnia teatrale Isola Scena offre un rimborso spese. Affittasi sala prove in centro, cinquanta posti, con palcoscenico e luci. Vendesi vestiti d'epoca e vecchi mobili di scena. Per informazioni, chiamare dopo le diciotto. In italiano moderno, cercasi attori vuol dire si cercano attori: il pronome si viene messo alla fine del verbo, come nell'italiano antico. Allo stesso modo affittasi significa si affitta e vendesi significa si vende. Queste forme oggi si usano quasi solo negli annunci e nei cartelli dei negozi, mentre dicesi si trova ancora in alcuni testi un po' antichi.", en: "Wanted: actors and actresses, even without experience, for a production of Pirandello's Right You Are (If You Think So). The Isola Scena theatre company offers expenses. To let: rehearsal room in the centre, fifty seats, with stage and lights. For sale: period clothes and old stage furniture. For information, call after six p.m. In modern Italian, cercasi attori means si cercano attori: the pronoun si is placed at the end of the verb, as in old Italian. In the same way affittasi means si affitta and vendesi means si vende. Today these forms are used almost only in adverts and shop signs, while dicesi is still found in some rather old texts." }
