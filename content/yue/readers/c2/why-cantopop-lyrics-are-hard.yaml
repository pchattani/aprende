id: r.c2.why-cantopop-lyrics-are-hard
level: c2
title: 填詞點解咁難？
kind: text
intro: "A magazine feature about a (fictional) Hong Kong lyricist teaching a lyric-writing workshop in Guangzhou. She explains why Cantonese lyrics must follow the melody's contour, the 0243 rule of thumb, what 倒字 is, why most Cantopop is written in a literary style, and why Sam Hui's colloquial lyrics were a revolution. No song lyrics are quoted."
allow: [林小姐, 許冠傑, 黃霑, 林夕, 顧嘉煇, 獅子山下, 鬼馬雙星, 天河路, ling4, ji6, sei3, saam1, maa1, maa4, la, so]
paragraphs:
  - { es: "星期六朝早，廣州天河路一間錄音室入面坐滿二十幾個後生仔女。佢哋有啲係音樂學院嘅學生，有啲係返工族，有一個仲係專登由東莞坐車嚟嘅中學生。佢哋嚟上課，係因為想學一樣好多人覺得「識講廣東話就識」嘅嘢：寫廣東歌嘅歌詞。導師林小姐喺香港做咗二十年填詞人，佢一開口就潑冷水：「識講廣東話，唔代表識填詞。廣東話填詞，係世界上最難嘅填詞之一。」", en: "On Saturday morning, a recording studio on Tianhe Road in Guangzhou is packed with twenty-odd young men and women. Some are music college students, some office workers, and one is a secondary-school student who came all the way from Dongguan. They're here because they want to learn something many people think 'anyone who speaks Cantonese can do': writing lyrics for Cantonese songs. The teacher, Ms Lam, has been a lyricist in Hong Kong for twenty years, and the first thing she does is pour cold water on them: 'Speaking Cantonese doesn't mean you can write lyrics. Writing lyrics in Cantonese is one of the hardest kinds of lyric writing in the world.'" }
  - { es: "點解咁講？林小姐喺白板寫咗個「媽」字。「媽，maa1，第一聲，好高。如果首歌嘅旋律喺呢個位係一個好低嘅音，你唱『媽』，人哋會聽成『麻』，maa4。呢個就叫倒字。普通話歌唔怕，因為普通話唱歌嘅時候，聲調差唔多會冇咗，靠上文下理都聽得明；但係廣東話有六個聲調，字嘅意思同音高綁死咗，旋律一定要順住字嘅聲調行，唔係就會鬧笑話。」", en: "Why does she say that? Ms Lam writes the character 媽 on the whiteboard. '媽, maa1, first tone, very high. If the melody has a very low note at this point and you sing 媽 \"mum\", people will hear 麻 maa4 \"hemp\". That's called 倒字, an inverted word. Mandarin songs don't have this problem, because in Mandarin singing the tones more or less disappear and you understand from context; but Cantonese has six tones, the meaning of a word is tied to its pitch, so the melody must follow the tones of the words, or you'll make a fool of yourself.'" }
  - { es: "跟住佢教大家一個行內嘅口訣：「0243」。「你哋讀吓呢四個數字：零、二、四、三。零係第四聲，最低；二係第六聲；四係第三聲；三係第一聲，最高。旋律入面有四個高低唔同嘅位，就可以用呢四個字嘅聲調去對。即係話，旋律最低嘅音，揀第四聲嘅字；最高嘅音，揀第一聲嘅字。至於第二、第五聲嗰啲升調，就比較有彈性。」", en: "Then she teaches them a rule of thumb from the trade: '0243'. 'Say these four numbers: 零, 二, 四, 三 – zero, two, four, three. 零 is fourth tone, the lowest; 二 is sixth tone; 四 is third tone; 三 is first tone, the highest. When the melody has four different pitch levels, you match them with the tones of these four words. That is, for the lowest note in the melody choose a fourth-tone word; for the highest, a first-tone word. As for the rising tones, the second and fifth, they're more flexible.'" }
  - { es: "有個學生舉手：「咁即係先有曲，後有詞？」林小姐點頭：「香港樂壇九成歌都係先有旋律，填詞人再將字一粒一粒填入去，所以叫『填詞』，唔叫『寫詞』。好似砌拼圖噉，你想講『我愛你』，但係個位嘅音高唔啱，你就要搵另一句意思差唔多、聲調又啱嘅說話。好多時諗一個字，要諗成個鐘。」", en: "A student raises his hand: 'So the music comes first and the words afterwards?' Ms Lam nods: 'Ninety per cent of songs in the Hong Kong music scene have the melody first, and the lyricist fills in the words one by one – that's why it's called 填詞, \"filling in words\", not 寫詞, \"writing words\". It's like doing a jigsaw: you want to say \"I love you\", but the pitch at that point is wrong, so you have to find another phrase with roughly the same meaning and the right tones. Often one word takes a whole hour of thinking.'" }
  - { es: "第二樣難嘅嘢係語體。林小姐問：「你哋留意吓，大部分廣東歌嘅歌詞，用『嘅』定『的』？用『佢』定『他』？」大家諗咗一陣，先發覺原來大部分流行曲都係用書面語寫，例如「我的」、「你們」，不過用廣東話讀音唱。林小姐話：「呢個係傳統，覺得書面語比較有詩意，比較靚。真係用口語寫嘅歌，反而係少數，而且係刻意嘅選擇。」", en: "The second difficulty is register. Ms Lam asks: 'Have you noticed – do most Cantonese song lyrics use 嘅 or 的? 佢 or 他?' Everyone thinks for a moment and only then realises that most pop songs are written in standard written Chinese – 我的 'my', 你們 'you (plural)' – but sung with Cantonese pronunciation. Ms Lam says: 'That's the tradition: written language is felt to be more poetic, more beautiful. Songs really written in colloquial Cantonese are the minority, and they're a deliberate choice.'" }
  - { es: "講到口語歌，就一定要講許冠傑。七十年代，佢寫咗好多用地道廣東話嘅歌，講打工仔嘅辛苦、講搵食艱難，好似同街坊傾偈噉。嗰陣好多人覺得廣東歌老土，聽英文歌先型，許冠傑就證明咗，日常嘅廣東話都可以好好聽。後來黃霑、林夕呢啲填詞人，就喺書面語同口語之間搵到自己嘅平衡。林小姐話：「冇佢哋，就冇今日嘅廣東歌。」", en: "When it comes to colloquial songs, you have to talk about Sam Hui. In the seventies he wrote lots of songs in down-to-earth Cantonese about the hardships of working people and how hard it is to make a living, as if chatting with the neighbours. At the time many people thought Cantonese songs were uncool and that English songs were the stylish thing to listen to, and Sam Hui proved that everyday Cantonese could sound great. Later lyricists such as James Wong and Lin Xi found their own balance between written language and speech. Ms Lam says: 'Without them, there would be no Cantonese pop as we know it today.'" }
  - { es: "第三樣嘢係押韻。廣東話有好多韻母，連 p、t、k 收尾嘅入聲都可以押韻。林小姐話：「普通話押得到嘅韻，廣東話唔一定押得到；廣東話押得好靚嘅入聲韻，普通話一唱就冇晒。所以一首普通話歌翻唱做廣東歌，唔係將歌詞翻譯咁簡單，係要成首重新寫過。」", en: "The third thing is rhyme. Cantonese has many finals, and even the entering tones ending in p, t and k can rhyme. Ms Lam says: 'A rhyme that works in Mandarin doesn't necessarily work in Cantonese, and the beautiful entering-tone rhymes of Cantonese vanish the moment you sing them in Mandarin. So turning a Mandarin song into a Cantonese one isn't as simple as translating the lyrics: you have to rewrite the whole thing.'" }
  - { es: "落堂之前，林小姐出咗份功課：用一段八小節嘅旋律，填一段講自己屋企附近一條街嘅歌詞，要用口語，唔准倒字。東莞嚟嗰個中學生苦口苦面：「我諗咗一個字，啱聲但係唔啱意思；啱意思又唔啱聲。」林小姐笑：「歡迎嚟到填詞人嘅世界。我寫咗二十年，到而家都係日日噉。不過當你終於搵到嗰個又啱聲、又啱意思嘅字，嗰種開心，好似食咗世一嘅雙皮奶咁爽。」", en: "Before the end of the class, Ms Lam sets some homework: take an eight-bar melody and fill it with lyrics about a street near your home, in colloquial Cantonese, with no inverted words. The secondary-school student from Dongguan pulls a long face: 'I thought of a word that fits the tone but not the meaning; the ones that fit the meaning don't fit the tone.' Ms Lam laughs: 'Welcome to the lyricist's world. I've been doing it for twenty years and it's still like that every day. But when you finally find the word that fits both the tone and the meaning, the joy of it is as satisfying as eating the world's best double-skin milk.'" }
questions:
  - { q: "乜嘢叫「倒字」？", options: ["將歌詞寫錯字", "旋律同字嘅聲調唔夾，令個字聽落變咗另一個字", "倒轉唱一首歌"], answer: 1, explain: "If 媽 maa1 is sung on a low note it is heard as 麻 maa4: the melody has 'inverted' the word." }
  - { q: "「0243」入面，邊個字代表最低嘅音？", options: ["零（第四聲）", "二（第六聲）", "三（第一聲）"], answer: 0, explain: "零 ling4 is fourth tone, the lowest; 三 saam1 is first tone, the highest." }
  - { q: "點解香港叫「填詞」，唔叫「寫詞」？", options: ["因為大部分歌都係先有旋律，再將字填入去", "因為填詞人唔識寫字", "因為歌詞要填喺表格度"], answer: 0, explain: "Most Cantopop is composed melody-first; the lyricist fills words into the tune." }
  - { q: "大部分廣東流行曲嘅歌詞係用乜嘢語體寫？", options: ["全部用口語", "多數用書面語，用廣東話讀音唱", "用英文"], answer: 1, explain: "Most lyrics use written-style Chinese (我的, 你們) sung with Cantonese sounds; colloquial lyrics are a deliberate choice." }
  - { q: "許冠傑對廣東歌有咩貢獻？", options: ["佢發明咗0243", "佢證明咗日常嘅廣東話都可以寫出好聽嘅歌", "佢將所有廣東歌翻譯做英文"], answer: 1, explain: "In the 1970s Sam Hui's colloquial lyrics showed that everyday Cantonese could make great pop songs." }
