id: r.b1.o-queijo-da-canastra
level: b1
title: O queijo da Canastra
kind: text
intro: A food journalist from São Paulo travels to the Serra da Canastra to interview a famous cheesemaker. Nothing goes as planned. The story is told with the past perfect (tinha + participle).
allow: [canastra, são, roque, minas, francisco, otávio, dalva, ok, sp]
paragraphs:
  - { es: "Eu tinha planejado tudo com cuidado. Fazia meses que eu queria escrever uma reportagem sobre o queijo canastra, um dos queijos mais famosos do Brasil, e tinha conseguido uma entrevista com o seu Otávio, um produtor que já tinha ganhado prêmios até na França. Combinamos às oito da manhã de sábado, na fazenda dele, perto de São Roque de Minas.", en: "I had planned everything carefully. For months I'd wanted to write a feature on queijo canastra, one of Brazil's most famous cheeses, and I'd managed to get an interview with Seu Otávio, a producer who had won prizes even in France. We agreed on eight o'clock on Saturday morning, at his farm, near São Roque de Minas." }
  - { es: "Saí de São Paulo na sexta à tarde. Quando cheguei à cidade, já era quase meia-noite e todos os restaurantes tinham fechado. Jantei um pacote de biscoitos no quarto da pousada e dormi pensando no queijo.", en: "I left São Paulo on Friday afternoon. When I got to the town it was already almost midnight and all the restaurants had closed. I had a packet of biscuits for dinner in my guesthouse room and fell asleep thinking about the cheese." }
  - { es: "No sábado, acordei às seis, mas logo percebi o primeiro problema: tinha chovido a noite toda, e a estrada de terra até a fazenda estava cheia de lama. O meu carro, pequeno e baixo, não era para aquilo. Levei uma hora e meia para fazer vinte quilômetros e, quando finalmente cheguei à fazenda, eram nove e meia.", en: "On Saturday I woke up at six, but I soon noticed the first problem: it had rained all night, and the dirt road to the farm was full of mud. My car, small and low, wasn't made for that. It took me an hour and a half to do twenty kilometres and, when I finally got to the farm, it was half past nine." }
  - { es: "Quem me recebeu foi a dona Dalva, a mulher do seu Otávio. — Ih, meu filho, ele já saiu. Esperou você até as nove, mas tinha que levar os queijos para a cidade. Hoje é dia de entrega.", en: "The person who met me was Dona Dalva, Seu Otávio's wife. 'Oh dear, son, he's already gone. He waited for you until nine, but he had to take the cheeses into town. Today is delivery day.'" }
  - { es: "Eu quase chorei. Tinha viajado quase quinhentos quilômetros para nada. Mas a dona Dalva olhou para a minha roupa suja de lama e riu. — Calma. Entra, toma um café. Quem faz o queijo aqui sou eu mesma, ele só vende.", en: "I nearly cried. I had travelled almost five hundred kilometres for nothing. But Dona Dalva looked at my mud-covered clothes and laughed. 'Calm down. Come in, have a coffee. I'm the one who makes the cheese here; he only sells it.'" }
  - { es: "Passei o resto do dia com ela. Ela me mostrou como o leite cru é tirado das vacas de manhã cedo e coalhado ainda morno, como a massa é colocada nas formas e virada à mão, e como os queijos ficam semanas numas prateleiras de madeira, até a casca ficar amarela. — O segredo é o pingo — explicou ela —, um pouco do soro do queijo do dia anterior. A minha mãe fazia assim, e a mãe dela também.", en: "I spent the rest of the day with her. She showed me how the raw milk is taken from the cows early in the morning and curdled while still warm, how the curd is put into moulds and turned by hand, and how the cheeses sit for weeks on wooden shelves until the rind turns yellow. 'The secret is the pingo,' she explained, 'a bit of the whey from the previous day's cheese. My mother did it like that, and her mother too.'" }
  - { es: "À tarde, ela me levou até um mirante. Lá embaixo, vi a serra verde e, ao longe, uma cachoeira enorme caindo das pedras. — Ali nasce o rio São Francisco — disse ela. — Ele atravessa cinco estados até chegar ao mar. Aqui ele é só um riozinho.", en: "In the afternoon she took me to a viewpoint. Down below I saw the green mountains and, in the distance, an enormous waterfall falling from the rocks. 'That's where the São Francisco river begins,' she said. 'It crosses five states before reaching the sea. Here it's just a little stream.'" }
  - { es: "Quando voltamos, o seu Otávio já tinha chegado. Pediu mil desculpas e respondeu a todas as minhas perguntas. Mas, sinceramente, a melhor entrevista eu já tinha feito. Naquela noite, enquanto eu dirigia de volta, vi um lobo-guará atravessar a estrada, devagar, como se a serra fosse dele. No banco do carro, eu levava três queijos e a certeza de que nenhuma viagem perdida é totalmente perdida.", en: "When we got back, Seu Otávio had already arrived. He apologised profusely and answered all my questions. But, honestly, I had already done the best interview. That night, as I drove back, I saw a maned wolf cross the road, slowly, as if the mountains belonged to it. On the car seat I carried three cheeses and the certainty that no wasted trip is completely wasted." }
questions:
  - { q: "Por que o jornalista jantou biscoitos na sexta?", options: ["Porque não gostava da comida da pousada", "Porque chegou tarde e os restaurantes tinham fechado", "Porque estava sem dinheiro"], answer: 1, explain: "«Quando cheguei à cidade, já era quase meia-noite e todos os restaurantes tinham fechado.»" }
  - { q: "Por que ele chegou atrasado à fazenda?", options: ["Porque acordou tarde", "Porque a estrada estava cheia de lama depois da chuva", "Porque se perdeu"], answer: 1, explain: "«Tinha chovido a noite toda, e a estrada de terra até a fazenda estava cheia de lama.»" }
  - { q: "Quem faz o queijo na fazenda?", options: ["O seu Otávio", "A dona Dalva", "A mãe do seu Otávio"], answer: 1, explain: "Dona Dalva says «Quem faz o queijo aqui sou eu mesma, ele só vende.»" }
  - { q: "O que é o «pingo», segundo a dona Dalva?", options: ["Um tipo de leite", "Um pouco do soro do queijo do dia anterior", "A casca amarela do queijo"], answer: 1, explain: "«O segredo é o pingo, um pouco do soro do queijo do dia anterior.»" }
  - { q: "O que nasce na Serra da Canastra?", options: ["O rio São Francisco", "O rio Amazonas", "O queijo minas"], answer: 0, explain: "«Ali nasce o rio São Francisco. Ele atravessa cinco estados até chegar ao mar.»" }
