id: r.b2.turismo-si-pero-no-asi
level: b2
title: Turismo sí, pero no así
kind: text
intro: An opinion article on mass tourism in Spanish cities, written as a model argumentative essay with introduction, thesis, developed arguments, concession and conclusion.
allow: [barcelona, sevilla, canarias, baleares]
paragraphs:
  - { es: "En la actualidad, España recibe más de ochenta millones de turistas al año, casi el doble de su población. El turismo es, sin duda, uno de los motores de la economía: genera empleo, llena los hoteles y mantiene vivos muchos pueblos. Ahora bien, en los últimos años el debate ha cambiado. En Barcelona, Sevilla, Canarias o Baleares miles de vecinos se han manifestado con un mensaje claro: turismo sí, pero no así. En este artículo defenderé que el problema no es el turista, sino la falta de límites.", en: "Nowadays, Spain receives more than eighty million tourists a year, almost twice its population. Tourism is, without doubt, one of the engines of the economy: it generates jobs, fills hotels and keeps many villages alive. However, in recent years the debate has changed. In Barcelona, Seville, the Canaries or the Balearics thousands of residents have demonstrated with a clear message: tourism yes, but not like this. In this article I will argue that the problem is not the tourist but the lack of limits." }
  - { es: "En primer lugar, cabe destacar el efecto sobre la vivienda. Cuando un piso se alquila a turistas por semanas, deja de alquilarse a familias por años. Prueba de ello es que, en los barrios más visitados, los alquileres han subido más de un cuarenta por ciento en una década mientras que la población local ha disminuido. Los jóvenes, sencillamente, no pueden quedarse.", en: "Firstly, the effect on housing should be highlighted. When a flat is rented to tourists by the week, it stops being rented to families by the year. Proof of this is that, in the most visited neighbourhoods, rents have risen by more than forty per cent in a decade while the local population has decreased. Young people simply cannot stay." }
  - { es: "En segundo lugar, el turismo masivo transforma los barrios. Las tiendas de siempre se convierten en tiendas de recuerdos; los bares donde desayunaban los vecinos, en locales de comida rápida. Es más, el ruido nocturno y la suciedad hacen que vivir en el centro resulte cada vez más difícil. Una ciudad que expulsa a sus habitantes acaba siendo un decorado.", en: "Secondly, mass tourism transforms neighbourhoods. The shops that were always there turn into souvenir shops; the bars where residents had breakfast, into fast-food outlets. What is more, night-time noise and dirt make living in the centre more and more difficult. A city that drives out its inhabitants ends up being a stage set." }
  - { es: "Es cierto que el turismo crea empleo, y no pretendo negarlo. Sin embargo, conviene matizar: se trata, en gran parte, de empleo temporal y mal pagado. Además, los beneficios se concentran en pocas manos, mientras que los costes —transporte, limpieza, seguridad, vivienda— los paga toda la ciudad.", en: "It is true that tourism creates jobs, and I do not intend to deny it. However, this needs qualifying: it is, to a large extent, temporary and badly paid work. Moreover, the profits are concentrated in few hands, while the costs — transport, cleaning, security, housing — are paid by the whole city." }
  - { es: "¿Qué puede hacerse? Algunas ciudades ya han empezado. Se puede limitar el número de pisos turísticos, como ha hecho Barcelona; se puede cobrar una tasa por noche, como en Baleares, y destinar ese dinero a los barrios; y se puede, sobre todo, repartir el turismo por todo el territorio en lugar de concentrarlo en cinco calles.", en: "What can be done? Some cities have already started. The number of holiday flats can be limited, as Barcelona has done; a per-night tax can be charged, as in the Balearics, and that money put towards the neighbourhoods; and, above all, tourism can be spread across the whole territory instead of concentrating it in five streets." }
  - { es: "En definitiva, no se trata de cerrar las puertas, sino de decidir cuántas abrimos y a qué precio. Por todo ello, considero que los ayuntamientos deberían tratar el turismo como lo que es: una industria que, bien regulada, enriquece a todos y que, sin regular, empobrece a la mayoría. Dicho esto, la decisión final no es de los políticos, sino de los ciudadanos que eligen dónde dormir, qué comer y a quién dejar su dinero cuando viajan.", en: "In short, it is not a matter of closing the doors, but of deciding how many we open and at what price. For all these reasons, I consider that town councils should treat tourism as what it is: an industry which, well regulated, enriches everyone and which, unregulated, impoverishes the majority. That said, the final decision is not the politicians' but that of the citizens who choose where to sleep, what to eat and whom to give their money to when they travel." }
questions:
  - { q: "What is the author's thesis?", options: ["Tourism should be banned in big cities", "The problem is not the tourist but the lack of limits", "Tourists should pay for everything"], answer: 1 }
  - { q: "What evidence is given about housing?", options: ["Rents have risen more than forty per cent in a decade in visited areas", "Hotels have closed", "Young people prefer to rent to tourists"], answer: 0 }
  - { q: "What concession does the author make?", options: ["That tourists are badly behaved", "That tourism creates jobs", "That cities are too noisy"], answer: 1 }
  - { q: "Which measure is NOT mentioned?", options: ["Limiting holiday flats", "Charging a per-night tax", "Closing airports"], answer: 2 }
  - { q: "Who, according to the conclusion, makes the final decision?", options: ["The politicians", "The hotel owners", "The citizens who travel"], answer: 2 }
