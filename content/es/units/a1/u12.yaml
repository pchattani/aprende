id: a1.u12
title: Planes y repaso
lessons:
  - id: a1.u12.l1
    title: Planes para el futuro
    teach: [g.ir-a-future]
    vocab: [w.plan, w.futuro, w.sueno.plan, w.examen, w.curso, w.nota, w.boda, w.navidad, w.pasado-manana, w.dentro-de, w.pronto.phr, w.quizas, w.seguro, w.creer]
    sentences:
      - { es: "¿Qué planes tienes para el fin de semana?", en: "What plans do you have for the weekend?", grammar: [g.question-words], vocab: [w.plan, w.fin-de-semana] }
      - { es: "El año que viene voy a vivir en Valencia.", en: "Next year I'm going to live in Valencia.", grammar: [g.ir-a-future], vocab: [w.vivir, w.que-viene] }
      - { es: "Pienso estudiar medicina en el futuro.", en: "I plan to study medicine in the future.", grammar: [g.ir-a-future], vocab: [w.pensar, w.futuro] }
      - { es: "Pasado mañana tengo un examen muy importante.", en: "The day after tomorrow I have a very important exam.", grammar: [g.ir-a-future], vocab: [w.pasado-manana, w.examen] }
      - { es: "Dentro de dos semanas empieza el curso.", en: "In two weeks the course starts.", grammar: [g.ir-a-future], vocab: [w.dentro-de, w.curso] }
      - { es: "Quiero sacar buenas notas este año.", en: "I want to get good marks this year.", grammar: [g.querer-present], vocab: [w.nota, w.ano] }
      - { es: "La boda de mi hermana es en junio.", en: "My sister's wedding is in June.", grammar: [g.ser-vs-estar-basics], vocab: [w.boda, w.junio] }
      - { es: "En Navidad vamos a visitar a los abuelos.", en: "At Christmas we're going to visit our grandparents.", grammar: [g.ir-a-future, g.a-personal], vocab: [w.navidad, w.visitar] }
      - { es: "Quizás vamos a la playa, no estoy seguro.", en: "Maybe we'll go to the beach, I'm not sure.", grammar: [g.ir-a-future], vocab: [w.quizas, w.seguro] }
      - { es: "Creo que va a llover esta tarde.", en: "I think it's going to rain this afternoon.", grammar: [g.ir-a-future], vocab: [w.creer, w.llover] }
      - { es: "Tengo una idea: vamos a cenar fuera.", en: "I have an idea: let's eat out.", grammar: [g.ir-a-infinitive], vocab: [w.sueno.plan, w.cenar] }
      - { es: "Te contesto lo antes posible.", en: "I'll answer you as soon as possible.", grammar: [g.ir-a-future], vocab: [w.pronto.phr, w.contestar] }
      - { es: "Voy a aprender a cocinar.", en: "I'm going to learn to cook.", grammar: [g.ir-a-future], vocab: [w.aprender, w.cocinar], transform: { instruction: "Change to 'she'", answer: "Va a aprender a cocinar.", alt: ["Ella va a aprender a cocinar."] } }
  - id: a1.u12.l2
    title: Conectar ideas
    teach: [g.connectors-basic, g.tambien-tampoco]
    vocab: [w.deber.plan, w.entonces, w.ademas, w.finalmente, w.si.conj, w.que.conj, w.dejar, w.cambiar, w.invitar, w.celebrar, w.enviar, w.recibir, w.contestar, w.olvidar]
    sentences:
      - { es: "Me gusta el café, pero no me gusta el té.", en: "I like coffee, but I don't like tea.", grammar: [g.connectors-basic], vocab: [w.pero, w.cafe] }
      - { es: "No voy a la fiesta porque estoy cansado.", en: "I'm not going to the party because I'm tired.", grammar: [g.connectors-basic], vocab: [w.porque, w.fiesta] }
      - { es: "Estudio mucho; por eso tengo buenas notas.", en: "I study a lot; that's why I get good marks.", grammar: [g.connectors-basic], vocab: [w.deber.plan, w.nota] }
      - { es: "Primero desayuno, luego trabajo y finalmente descanso.", en: "First I have breakfast, then I work and finally I rest.", grammar: [g.connectors-basic], vocab: [w.primero, w.luego, w.finalmente] }
      - { es: "Si hace sol, vamos a la playa.", en: "If it's sunny, we'll go to the beach.", grammar: [g.connectors-basic], vocab: [w.si.conj, w.sol] }
      - { es: "Creo que es verdad.", en: "I think it's true.", grammar: [g.connectors-basic], vocab: [w.que.conj, w.verdad, w.creer] }
      - { es: "Además, el hotel es barato y está cerca.", en: "Besides, the hotel is cheap and it's close.", grammar: [g.connectors-basic], vocab: [w.ademas, w.barato] }
      - { es: "¿Entonces vienes o no?", en: "So, are you coming or not?", grammar: [g.connectors-basic], vocab: [w.entonces, w.venir] }
      - { es: "Te invito a mi cumpleaños. Vamos a celebrarlo el sábado.", en: "I'm inviting you to my birthday. We're going to celebrate it on Saturday.", grammar: [g.direct-object-intro], vocab: [w.invitar, w.celebrar] }
      - { es: "Envío un mensaje y recibo la respuesta rápidamente.", en: "I send a message and receive the reply quickly.", grammar: [g.regular-er-ir-present], vocab: [w.enviar, w.recibir, w.mensaje] }
      - { es: "Siempre olvido las llaves en casa.", en: "I always forget my keys at home.", grammar: [g.frequency-adverbs], vocab: [w.olvidar, w.llave] }
      - { es: "Dejo el coche en el garaje y cambio de ropa.", en: "I leave the car in the garage and change clothes.", grammar: [g.regular-ar-present], vocab: [w.dejar, w.cambiar, w.ropa] }
      - { es: "Ella también habla francés, y yo tampoco hablo alemán.", en: "She also speaks French, and I don't speak German either.", grammar: [g.tambien-tampoco], vocab: [w.tambien, w.tampoco], error: { wrong: "Ella también habla francés, y yo también no hablo alemán.", explain: "también no is wrong; use tampoco.", grammar: g.tambien-tampoco } }
      - { es: "No tengo coche. — Yo tampoco.", en: "I don't have a car. — Me neither.", grammar: [g.tambien-tampoco], vocab: [w.tampoco, w.coche] }
  - id: a1.u12.l3
    title: Repaso del presente
    teach: [g.present-review]
    vocab: [w.feliz, w.ultimo, w.mismo, w.especial, w.verdad, w.vida]
    sentences:
      - { es: "Los lunes trabajo, pero los sábados duermo hasta tarde.", en: "On Mondays I work, but on Saturdays I sleep till late.", grammar: [g.present-review], vocab: [w.trabajar, w.dormir] }
      - { es: "¿Qué hacéis? Estamos viendo una película.", en: "What are you doing? We're watching a film.", grammar: [g.present-review, g.estar-gerund], vocab: [w.hacer, w.ver] }
      - { es: "Mi hermana no sabe conducir pero quiere aprender.", en: "My sister can't drive but wants to learn.", grammar: [g.present-review], vocab: [w.saber, w.conducir, w.querer] }
      - { es: "Salgo de casa a las ocho y llego al trabajo a las nueve.", en: "I leave home at eight and get to work at nine.", grammar: [g.present-review], vocab: [w.salir, w.llegar] }
      - { es: "Ellos viven en Londres pero vienen a España cada verano.", en: "They live in London but come to Spain every summer.", grammar: [g.present-review], vocab: [w.vivir, w.venir] }
      - { es: "Es el último día del curso y estamos muy felices.", en: "It's the last day of the course and we're very happy.", grammar: [g.ser-vs-estar-basics], vocab: [w.ultimo, w.feliz, w.curso] }
      - { es: "Vivimos en la misma calle.", en: "We live on the same street.", grammar: [g.adjectives-position], vocab: [w.mismo, w.calle] }
      - { es: "Hoy es un día especial: es mi cumpleaños.", en: "Today is a special day: it's my birthday.", grammar: [g.ser-present], vocab: [w.especial, w.cumpleanos] }
      - { es: "La vida en el pueblo es tranquila.", en: "Life in the village is quiet.", grammar: [g.adjective-agreement], vocab: [w.vida, w.pueblo, w.tranquilo] }
      - { es: "¿Es verdad que hablas cinco idiomas?", en: "Is it true that you speak five languages?", grammar: [g.present-review], vocab: [w.verdad, w.idioma] }
      - { es: "Tengo veinte años, soy de Irlanda y estudio español en Granada.", en: "I'm twenty, I'm from Ireland and I study Spanish in Granada.", grammar: [g.present-review], vocab: [w.tener, w.ser, w.estudiar] }
      - { es: "Me levanto a las siete, desayuno y voy al trabajo en metro.", en: "I get up at seven, have breakfast and go to work by metro.", grammar: [g.present-review], vocab: [w.levantarse, w.desayunar, w.ir] }
      - { es: "Ella hace deporte y toca la guitarra.", en: "She does sport and plays the guitar.", grammar: [g.present-review], vocab: [w.hacer, w.tocar], transform: { instruction: "Change to 'I'", answer: "Hago deporte y toco la guitarra.", alt: ["Yo hago deporte y toco la guitarra."] } }
      - { es: "Hablo español, pero no hablo portugués.", en: "I speak Spanish, but I don't speak Portuguese.", grammar: [g.present-review], vocab: [w.hablar], error: { wrong: "Hablo español, pero no habló portugués.", explain: "habló (with accent) is the past tense; the present is hablo.", grammar: g.stress-and-tilde } }
  - id: a1.u12.l4
    title: ¡Felicidades!
    teach: [g.ir-a-future]
    vocab: [w.suerte.phr, w.felicidades]
    sentences:
      - { es: "¡Felicidades! ¡Feliz cumpleaños!", en: "Congratulations! Happy birthday!", grammar: [g.greetings], vocab: [w.felicidades, w.feliz] }
      - { es: "¡Buena suerte en el examen!", en: "Good luck in the exam!", grammar: [g.greetings], vocab: [w.suerte.phr, w.examen] }
      - { es: "¡Feliz Navidad y feliz año nuevo!", en: "Merry Christmas and happy new year!", grammar: [g.adjective-agreement], vocab: [w.navidad, w.nuevo] }
      - { es: "Vamos a celebrar la boda en el campo.", en: "We're going to celebrate the wedding in the countryside.", grammar: [g.ir-a-future], vocab: [w.celebrar, w.boda, w.campo] }
      - { es: "Mis amigos van a venir a la fiesta.", en: "My friends are going to come to the party.", grammar: [g.ir-a-future], vocab: [w.venir, w.fiesta] }
      - { es: "Esta noche vamos a cenar en un restaurante especial.", en: "Tonight we're going to have dinner at a special restaurant.", grammar: [g.ir-a-future], vocab: [w.especial, w.cenar] }
      - { es: "¿Vas a invitar a toda la familia?", en: "Are you going to invite the whole family?", grammar: [g.ir-a-future, g.a-personal], vocab: [w.invitar, w.familia] }
      - { es: "Después de la fiesta voy a estar muy cansado.", en: "After the party I'm going to be very tired.", grammar: [g.ir-a-future], vocab: [w.cansado, w.despues] }
      - { es: "El próximo curso voy a estudiar en Salamanca.", en: "Next year I'm going to study in Salamanca.", grammar: [g.ir-a-future], vocab: [w.proximo, w.curso] }
      - { es: "Estoy muy feliz porque voy a ver a mi familia.", en: "I'm very happy because I'm going to see my family.", grammar: [g.ir-a-future, g.connectors-basic], vocab: [w.feliz, w.ver] }
      - { es: "¿Qué vas a hacer en las vacaciones? Voy a descansar.", en: "What are you going to do on holiday? I'm going to rest.", grammar: [g.ir-a-future], vocab: [w.vacaciones, w.descansar] }
      - { es: "Ya hablo un poco de español y voy a seguir aprendiendo.", en: "I already speak a little Spanish and I'm going to keep learning.", grammar: [g.ir-a-future], vocab: [w.ya, w.seguir, w.aprender] }
dialogues:
  - id: a1.u12.d1
    title: El último día de clase
    context: The Spanish course is ending. Tom, Yuki and the teacher talk about their plans.
    lines:
      - { speaker: Profesora, es: "Bueno, hoy es el último día del curso. ¿Qué vais a hacer ahora?", en: "Well, today is the last day of the course. What are you going to do now?" }
      - { speaker: Tom, es: "Yo voy a viajar por España dos semanas. Primero Sevilla y luego Granada.", en: "I'm going to travel around Spain for two weeks. First Seville and then Granada." }
      - { speaker: Yuki, es: "¡Qué suerte! Yo tengo que trabajar, pero en agosto voy a Japón a ver a mi familia.", en: "How lucky! I have to work, but in August I'm going to Japan to see my family." }
      - { speaker: Profesora, es: "¿Y vais a seguir estudiando español?", en: "And are you going to keep studying Spanish?" }
      - { speaker: Tom, es: "Claro. Voy a hacer el curso de A2 en septiembre.", en: "Of course. I'm going to do the A2 course in September." }
      - { speaker: Yuki, es: "Yo también. Además, mi novio es español, por eso practico todos los días.", en: "Me too. Besides, my boyfriend is Spanish, that's why I practise every day." }
      - { speaker: Profesora, es: "¡Perfecto! Entonces nos vemos en septiembre. Tenéis que hacer el examen primero, ¿vale?", en: "Perfect! Then we'll see each other in September. You have to take the exam first, OK?" }
      - { speaker: Tom, es: "No hay problema. ¡Buena suerte a todos!", en: "No problem. Good luck everyone!" }
      - { speaker: Yuki, es: "Gracias por todo, Carmen. ¡Hasta pronto!", en: "Thanks for everything, Carmen. See you soon!" }
    questions:
      - { q: "What is Tom going to do first?", options: ["Work", "Travel around Spain", "Go to Japan"], answer: 1 }
      - { q: "Why does Yuki practise every day?", options: ["She has an exam", "Her boyfriend is Spanish", "She lives in Spain"], answer: 1 }
      - { q: "When does the A2 course start?", options: ["In August", "In September", "Next year"], answer: 1 }
