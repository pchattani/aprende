    sentences:
      - { es: "Segunda, terça, quarta, quinta, sexta.", en: "Monday, Tuesday, Wednesday, Thursday, Friday.", altEs: ["Segunda-feira, terça-feira, quarta-feira, quinta-feira, sexta-feira."], grammar: [g.days-months], vocab: [w.segunda-feira, w.terça-feira, w.quarta-feira, w.quinta-feira, w.sexta-feira], kinds: [dictation, listen, typeEs, order] }
      - { es: "Sábado e domingo é fim de semana!", en: "Saturday and Sunday are the weekend!", altEs: ["Sábado e domingo são o fim de semana!"], grammar: [g.days-months], vocab: [w.sábado, w.domingo, w.fim-de-semana] }
      - { es: "Hoje é sexta-feira!", en: "Today is Friday!", altEs: ["Hoje é sexta!"], altEn: ["It's Friday today!"], grammar: [g.days-months], vocab: [w.hoje, w.sexta-feira] }
      - { es: "Na segunda eu trabalho até tarde.", en: "On Monday I work until late.", altEs: ["Na segunda-feira eu trabalho até tarde.", "Segunda eu trabalho até tarde."], grammar: [g.days-months], vocab: [w.segunda-feira], error: { wrong: "No segunda eu trabalho até tarde.", explain: "segunda (segunda-feira) is feminine: na segunda. Only sábado and domingo take no.", grammar: g.days-months } }
      - { es: "No sábado eu vou à praia.", en: "On Saturday I go to the beach.", altEs: ["No sábado vou à praia.", "Sábado eu vou à praia."], grammar: [g.days-months], vocab: [w.sábado] }
      - { es: "Janeiro, fevereiro, março, abril, maio, junho.", en: "January, February, March, April, May, June.", grammar: [g.days-months], vocab: [w.janeiro, w.fevereiro, w.março, w.abril, w.maio, w.junho], kinds: [dictation, listen, typeEs, order] }
      - { es: "Julho, agosto, setembro, outubro, novembro, dezembro.", en: "July, August, September, October, November, December.", grammar: [g.days-months], vocab: [w.julho, w.agosto, w.setembro, w.outubro, w.novembro, w.dezembro], kinds: [dictation, listen, typeEs, order] }
      - { es: "Meu aniversário é dia vinte de agosto.", en: "My birthday is on the twentieth of August.", altEs: ["O meu aniversário é no dia vinte de agosto."], altEn: ["My birthday is August the twentieth."], grammar: [g.days-months], vocab: [w.dia, w.agosto] }
      - { es: "O Carnaval é em fevereiro ou março.", en: "Carnival is in February or March.", altEs: ["O Carnaval é em fevereiro ou em março."], grammar: [g.days-months], vocab: [w.fevereiro, w.março], note: "Months take a small letter and em, with no article: em março." }
      - { es: "Eu sempre tomo café de manhã.", en: "I always have coffee in the morning.", altEs: ["Sempre tomo café de manhã."], grammar: [g.frequency-adverbs], vocab: [w.sempre], transform: { instruction: "Say you never have coffee in the morning", answer: "Eu nunca tomo café de manhã.", alt: ["Nunca tomo café de manhã.", "Eu não tomo café de manhã nunca."], en: "I never have coffee in the morning." } }
      - { es: "Às vezes eu almoço em casa.", en: "Sometimes I have lunch at home.", altEs: ["Às vezes almoço em casa.", "Eu almoço em casa às vezes."], grammar: [g.frequency-adverbs], vocab: [w.às-vezes], error: { wrong: "As vezes eu almoço em casa.", explain: "Às vezes (sometimes) has a grave accent; as vezes means 'the times'.", grammar: g.frequency-adverbs } }
      - { es: "Ele nunca chega na hora.", en: "He never arrives on time.", altEs: ["Ele não chega nunca na hora."], grammar: [g.frequency-adverbs], vocab: [w.nunca] }
      - { es: "Corro três vezes por semana.", en: "I run three times a week.", altEs: ["Eu corro três vezes por semana."], grammar: [g.frequency-adverbs], vocab: [w.vez, w.semana], transform: { instruction: "Say once a week", answer: "Corro uma vez por semana.", alt: ["Eu corro uma vez por semana."], en: "I run once a week." } }
      - { es: "Geralmente eu durmo cedo, mas no fim de semana durmo tarde.", en: "I usually go to sleep early, but at the weekend I go to sleep late.", altEs: ["Normalmente eu durmo cedo, mas no fim de semana durmo tarde."], grammar: [g.frequency-adverbs, g.days-months], vocab: [w.geralmente, w.normalmente, w.fim-de-semana] }
      - { es: "Quase todo dia eu pego o bonde.", en: "I take the tram almost every day.", altEs: ["Eu pego o bonde quase todo dia."], grammar: [g.frequency-adverbs], vocab: [w.quase, w.todo-dia], variant: "In Portugal: quase todos os dias apanho o elétrico." }
      - { es: "Em dezembro faz muito calor no Rio.", en: "In December it's very hot in Rio.", altEs: ["Faz muito calor no Rio em dezembro."], grammar: [g.days-months], vocab: [w.dezembro] }
    exchanges:
      - q: { es: "Que dia é hoje?", en: "What day is it today?" }
