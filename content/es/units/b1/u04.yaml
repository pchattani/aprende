id: b1.u04
title: Consejos y mandatos
lessons:
  - id: b1.u04.l1
    title: No hables, no corras
    teach: [g.imperative-negative]
    vocab: [w.castigo, w.prohibicion, w.exceso, w.comportarse, w.comportamiento, w.evitar, w.peligro, w.casco, w.cinturon, w.interrumpir, w.en-voz-alta, w.permiso, w.carnet, w.alcohol, w.limite, w.peaton, w.acera, w.frenar, w.borracho, w.norma, w.respetar, w.voz]
    tip: "Negative commands use the present subjunctive for every person: no hables, no hable, no habléis, no hablen."
    sentences:
      - { es: "No hables en voz alta en la biblioteca, por favor.", en: "Don't talk loudly in the library, please.", altEs: ["No hables alto en la biblioteca, por favor.", "Por favor, no hables en voz alta en la biblioteca."], grammar: [g.imperative-negative], vocab: [w.en-voz-alta, w.biblioteca] }
      - { es: "No conduzcas después de beber alcohol.", en: "Don't drive after drinking alcohol.", altEs: ["No conduzcas si has bebido alcohol.", "No conduzcas después de beber."], grammar: [g.imperative-negative], vocab: [w.conducir, w.alcohol, w.beber] }
      - { es: "No conduzcáis por encima del límite de velocidad.", en: "Don't drive over the speed limit.", grammar: [g.imperative-negative], vocab: [w.limite, w.velocidad, w.conducir] }
      - { es: "No montes en bici sin casco.", en: "Don't ride a bike without a helmet.", altEs: ["No vayas en bici sin casco.", "No montes en bicicleta sin casco."], grammar: [g.imperative-negative], vocab: [w.casco, w.bici, w.montar] }
      - { es: "No viajes nunca sin el cinturón de seguridad.", en: "Never travel without your seat belt.", altEs: ["Nunca viajes sin el cinturón de seguridad.", "No viajes nunca sin cinturón."], grammar: [g.imperative-negative], vocab: [w.cinturon, w.viajar] }
      - { es: "No frenes de repente en la autopista.", en: "Don't brake suddenly on the motorway.", grammar: [g.imperative-negative], vocab: [w.frenar, w.de-repente, w.autopista] }
      - { es: "No interrumpas al profesor cuando está explicando.", en: "Don't interrupt the teacher when he's explaining.", grammar: [g.imperative-negative], vocab: [w.interrumpir, w.explicar, w.profesor], error: { wrong: "No interrumpes al profesor cuando está explicando.", explain: "Negative tú commands take the subjunctive: no interrumpas, not no interrumpes.", grammar: g.imperative-negative } }
      - { es: "Niños, no os comportéis así delante de los invitados.", en: "Children, don't behave like that in front of the guests.", grammar: [g.imperative-negative], vocab: [w.comportarse, w.invitar, w.delante] }
      - { es: "No salgas de casa sin permiso de tus padres.", en: "Don't leave the house without your parents' permission.", altEs: ["No salgas de casa sin el permiso de tus padres."], grammar: [g.imperative-negative], vocab: [w.permiso, w.salir, w.padres] }
      - { es: "No cojas el coche: todavía no tienes carnet.", en: "Don't take the car: you don't have a licence yet.", altEs: ["No cojas el coche: aún no tienes carnet.", "No cojas el coche: todavía no tienes el carnet."], grammar: [g.imperative-negative], vocab: [w.carnet, w.coger, w.coche], variant: "In Latin America coger is avoided (it is vulgar in several countries): no tomes el coche." }
      - { es: "No aparquéis en la acera; molesta a los peatones.", en: "Don't park on the pavement; it bothers pedestrians.", altEs: ["No aparquéis en la acera; molesta a la gente.", "No aparquéis en la acera: molesta a los peatones."], grammar: [g.imperative-negative], vocab: [w.acera, w.peaton, w.molestar] }
      - { es: "No vuelvas a casa borracho; tus padres se van a preocupar.", en: "Don't come home drunk; your parents are going to worry.", grammar: [g.imperative-negative], vocab: [w.borracho, w.preocuparse, w.volver] }
      - { es: "El exceso de velocidad es la primera causa de accidentes; no corráis.", en: "Speeding is the first cause of accidents; don't drive fast.", grammar: [g.imperative-negative], vocab: [w.exceso, w.velocidad, w.accidente] }
      - { es: "No fuméis dentro: hay una prohibición de fumar en todos los bares.", en: "Don't smoke inside: there's a smoking ban in all bars.", grammar: [g.imperative-negative], vocab: [w.prohibicion, w.fumar, w.bar] }
      - { es: "Evita el peligro: no nades en el río después de la tormenta.", en: "Avoid danger: don't swim in the river after the storm.", grammar: [g.imperative-negative, g.imperative-tu], vocab: [w.evitar, w.peligro, w.nadar, w.tormenta] }
      - { es: "Abre la ventana.", en: "Open the window.", grammar: [g.imperative-negative], vocab: [w.abrir, w.ventana], transform: { instruction: "Make the command negative", answer: "No abras la ventana." } }
    exchanges:
      - q: { es: "¿Puedo ir en bici al colegio?", en: "Can I cycle to school?" }
        a: { es: "Sí, pero no vayas sin casco.", en: "Yes, but don't go without a helmet." }
        alt: ["Vale, pero no cruces con el semáforo en rojo.", "No, hoy no; hay demasiado tráfico."]
        grammar: [g.imperative-negative]
        vocab: [w.casco]
      - q: { es: "Voy a coger el coche para volver de la fiesta.", en: "I'm going to take the car to come back from the party." }
        a: { es: "No conduzcas si has bebido; coge un taxi.", en: "Don't drive if you've been drinking; take a taxi." }
        alt: ["Ni se te ocurra; has bebido alcohol.", "No cojas el coche: todavía no tienes carnet."]
        grammar: [g.imperative-negative]
        vocab: [w.alcohol, w.carnet]
      - q: { es: "¿Dónde aparco?", en: "Where do I park?" }
        a: { es: "No aparques en la acera; molesta a los peatones.", en: "Don't park on the pavement; it bothers pedestrians." }
        alt: ["Aparca en la plaza, pero no dejes el coche delante de la puerta.", "Aquí no; mira la señal."]
        grammar: [g.imperative-negative]
        vocab: [w.acera, w.peaton]
      - q: { es: "Niños, ¿podemos jugar aquí?", en: "Children, can we play here?" }
        a: { es: "Sí, pero no gritéis ni corráis por el pasillo.", en: "Yes, but don't shout or run in the corridor." }
        alt: ["No, aquí no juguéis; id al patio.", "Vale, pero no habléis en voz alta."]
        grammar: [g.imperative-negative]
        vocab: [w.en-voz-alta]
      - q: { es: "Perdone, ¿puedo decir algo?", en: "Excuse me, can I say something?" }
        a: { es: "Sí, pero no interrumpas a tu compañera; espera tu turno.", en: "Yes, but don't interrupt your classmate; wait your turn." }
        alt: ["Ahora no; no interrumpas, por favor.", "Claro, habla."]
        grammar: [g.imperative-negative]
        vocab: [w.interrumpir]
    texts:
      - title: "Normas del gimnasio"
        es: ["No corráis por el pasillo ni gritéis.", "No entréis sin la tarjeta y respetad el turno de los demás.", "No olvidéis apagar la luz al salir."]
        en: ["Don't run in the corridor or shout.", "Don't come in without your card and respect other people's turns.", "Don't forget to switch off the light when you leave."]
        grammar: [g.imperative-negative, g.imperative-vosotros]
        vocab: [w.norma, w.respetar]
      - title: "Mensaje de una madre"
        es: ["Hijo, no vuelvas tarde y no cojas el coche de tu padre.", "No bebas alcohol; mañana tienes el examen de conducir.", "Y no te olvides del cinturón, por favor."]
        en: ["Son, don't come back late and don't take your father's car.", "Don't drink alcohol; tomorrow you have your driving test.", "And don't forget your seat belt, please."]
        grammar: [g.imperative-negative]
        vocab: [w.alcohol, w.cinturon]
    spicy:
      - { es: "No me mires así delante de mis padres; van a pensar que estamos juntos.", en: "Don't look at me like that in front of my parents; they'll think we're together.", altEs: ["No me mires así delante de mis padres: van a pensar que estamos juntos."], grammar: [g.imperative-negative], vocab: [w.delante] }
      - { es: "No bebáis más, chicos; nadie baila bien borracho.", en: "Don't drink any more, guys; nobody dances well drunk.", altEs: ["No bebáis más, chicos: nadie baila bien borracho."], grammar: [g.imperative-negative, g.imperative-vosotros], vocab: [w.beber, w.borracho] }
      - { es: "No interrumpas cuando te digo que estás guapo; di gracias y sonríe.", en: "Don't interrupt when I tell you you look handsome; say thank you and smile.", altEs: ["No interrumpas cuando te digo que estás guapa; di gracias y sonríe."], grammar: [g.imperative-negative, g.imperative-tu], vocab: [w.interrumpir] }
      - { es: "No conduzcas tan rápido; prefiero llegar tarde a la cita y llegar vivo.", en: "Don't drive so fast; I'd rather be late for the date and arrive alive.", altEs: ["No conduzcas tan rápido, prefiero llegar tarde a la cita y llegar viva."], grammar: [g.imperative-negative], vocab: [w.conducir, w.velocidad] }
      - { es: "No abras la ventana: el vecino de enfrente ya nos ha visto bailar en la cocina.", en: "Don't open the window: the neighbour opposite has already seen us dancing in the kitchen.", altEs: ["No abras la ventana; el vecino de enfrente ya nos ha visto bailar en la cocina."], grammar: [g.imperative-negative], vocab: [w.abrir, w.ventana] }
  - id: b1.u04.l2
    title: No te preocupes, no se lo digas
    teach: [g.imperative-negative]
    vocab: [w.estresarse, w.tranquilizarse, w.ofender, w.herir, w.celos, w.celoso, w.de-ninguna-manera, w.relajarse, w.culpar, w.sentimiento, w.confianza, w.juzgar, w.dejar-en-paz, w.meterse, w.ni-se-te-ocurra, w.manera, w.animar, w.distraerse, w.honesto, w.sinceridad, w.demas, w.enfadarse, w.culpa, w.animo]
    tip: "With negative commands the pronouns go before the verb: no te preocupes, no me lo digas, no os vayáis."
    sentences:
      - { es: "No te preocupes tanto por el examen; vas a aprobar.", en: "Don't worry so much about the exam; you're going to pass.", altEs: ["No te preocupes tanto por el examen; aprobarás.", "No te preocupes tanto por el examen: vas a aprobar."], grammar: [g.imperative-negative], vocab: [w.preocuparse, w.examen] }
      - { es: "No te estreses: todavía quedan dos semanas para entregar el proyecto.", en: "Don't get stressed: there are still two weeks to hand in the project.", grammar: [g.imperative-negative], vocab: [w.estresarse, w.entregar, w.proyecto] }
      - { es: "No se lo digas a nadie; es un secreto.", en: "Don't tell anyone; it's a secret.", altEs: ["No se lo cuentes a nadie; es un secreto."], grammar: [g.imperative-negative, g.double-object-pronouns], vocab: [w.decir, w.secreto, w.nadie], error: { wrong: "No díselo a nadie; es un secreto.", explain: "In negative commands the pronouns go before the verb: no se lo digas. Attached pronouns (díselo) are only for affirmative commands.", grammar: g.imperative-negative } }
      - { es: "No culpes a tu hermano de tus problemas.", en: "Don't blame your brother for your problems.", altEs: ["No culpes a tu hermano por tus problemas.", "No le eches la culpa a tu hermano de tus problemas."], grammar: [g.imperative-negative], vocab: [w.culpar, w.hermano, w.problema] }
      - { es: "No te metas en los asuntos de los demás.", en: "Don't meddle in other people's business.", grammar: [g.imperative-negative], vocab: [w.meterse, w.demas] }
      - { es: "No la juzgues sin conocer toda la historia.", en: "Don't judge her without knowing the whole story.", altEs: ["No la juzgues sin saber toda la historia."], grammar: [g.imperative-negative], vocab: [w.juzgar, w.conocer, w.historia] }
      - { es: "No la ofendas: lo que dices hiere sus sentimientos.", en: "Don't offend her: what you say hurts her feelings.", grammar: [g.imperative-negative], vocab: [w.ofender, w.herir, w.sentimiento] }
      - { es: "No seas celoso; los celos acaban con la confianza.", en: "Don't be jealous; jealousy destroys trust.", altEs: ["No seas celoso; los celos terminan con la confianza.", "No seas celosa; los celos acaban con la confianza."], grammar: [g.imperative-negative], vocab: [w.celoso, w.celos, w.confianza], note: "acabar con = to destroy, to put an end to." }
      - { es: "No os relajéis demasiado; todavía queda mucho trabajo.", en: "Don't relax too much; there's still a lot of work left.", grammar: [g.imperative-negative], vocab: [w.relajarse, w.quedar, w.trabajo] }
      - { es: "No te distraigas con el móvil mientras conduces.", en: "Don't get distracted by your phone while you're driving.", grammar: [g.imperative-negative], vocab: [w.distraerse, w.movil, w.conducir] }
      - { es: "Déjame en paz, no me hables de esa manera.", en: "Leave me alone, don't talk to me like that.", altEs: ["Déjame en paz, no me hables así.", "Déjame en paz y no me hables de esa manera."], grammar: [g.imperative-negative, g.imperative-tu], vocab: [w.dejar-en-paz, w.hablar, w.manera] }
      - { es: "¿Puedo coger tu coche? — ¡Ni se te ocurra! De ninguna manera.", en: "Can I take your car? — Don't even think about it! No way.", grammar: [g.imperative-negative], vocab: [w.ni-se-te-ocurra, w.de-ninguna-manera, w.coger] }
      - { es: "Anímate y no pienses más en eso.", en: "Cheer up and don't think about it any more.", altEs: ["Venga, anímate y no pienses más en eso."], grammar: [g.imperative-negative, g.imperative-tu], vocab: [w.animar, w.pensar] }
      - { es: "Sé honesto con ella y no le hagas daño: la sinceridad es lo más importante.", en: "Be honest with her and don't hurt her: sincerity is what matters most.", grammar: [g.imperative-negative], vocab: [w.honesto, w.sinceridad, w.hacerse-dano] }
      - { es: "No os pongáis nerviosos; tranquilizaos y respirad despacio.", en: "Don't get nervous; calm down and breathe slowly.", grammar: [g.imperative-negative], vocab: [w.tranquilizarse, w.nervioso, w.respirar], note: "Vosotros imperative of reflexive verbs drops the d: tranquilizaos, levantaos." }
      - { es: "Levántate temprano.", en: "Get up early.", grammar: [g.imperative-negative], vocab: [w.levantarse, w.temprano], transform: { instruction: "Make the command negative", answer: "No te levantes temprano." } }
    exchanges:
      - q: { es: "Estoy muy nervioso por la entrevista de mañana.", en: "I'm very nervous about tomorrow's interview." }
        a: { es: "No te preocupes; tranquilízate y duerme bien.", en: "Don't worry; calm down and sleep well." }
        alt: ["No te estreses; lo vas a hacer bien.", "Relájate: tienes experiencia."]
        grammar: [g.imperative-negative]
        vocab: [w.tranquilizarse, w.estresarse, w.relajarse]
      - q: { es: "¿Le cuento a Marta lo de Luis?", en: "Shall I tell Marta about Luis?" }
        a: { es: "No, no se lo digas; es un secreto.", en: "No, don't tell her; it's a secret." }
        alt: ["Ni se te ocurra; no es asunto nuestro.", "No te metas en eso."]
        grammar: [g.imperative-negative, g.double-object-pronouns]
        vocab: [w.ni-se-te-ocurra, w.meterse]
      - q: { es: "Mi hermano ha roto el ordenador y me siento culpable.", en: "My brother has broken the computer and I feel guilty." }
        a: { es: "No te culpes; tú no tienes la culpa.", en: "Don't blame yourself; it isn't your fault." }
        alt: ["No te enfades con él; ha sido sin querer.", "No pienses más en eso."]
        grammar: [g.imperative-negative]
        vocab: [w.culpar, w.culpa, w.enfadarse]
      - q: { es: "¿Puedo usar tu móvil para llamar?", en: "Can I use your phone to make a call?" }
        a: { es: "Sí, pero no te distraigas con mis mensajes.", en: "Yes, but don't get distracted by my messages." }
        alt: ["De ninguna manera.", "Vale, pero no tardes."]
        grammar: [g.imperative-negative]
        vocab: [w.distraerse, w.de-ninguna-manera]
      - q: { es: "Creo que mi novia está con otro.", en: "I think my girlfriend is seeing someone else." }
        a: { es: "No seas celoso y no la juzgues sin pruebas; habla con ella.", en: "Don't be jealous and don't judge her without proof; talk to her." }
        alt: ["No te enfades antes de hablar con ella.", "No pienses eso; confía en ella."]
        grammar: [g.imperative-negative]
        vocab: [w.celoso, w.juzgar, w.confianza]
    texts:
      - title: "Mensaje de ánimo"
        es: ["No te estreses por el examen; has estudiado mucho.", "No pienses en la nota, piensa en lo que sabes.", "¡Ánimo, mañana lo celebramos!"]
        en: ["Don't stress about the exam; you've studied a lot.", "Don't think about the grade, think about what you know.", "Chin up, tomorrow we'll celebrate!"]
        grammar: [g.imperative-negative]
        vocab: [w.estresarse, w.animo]
      - title: "Consejos de una amiga"
        es: ["No le hables así a tu hermana; la vas a herir.", "No la culpes de todo y no te metas en su relación.", "Sé honesta con ella, pero no la ofendas."]
        en: ["Don't talk to your sister like that; you're going to hurt her.", "Don't blame her for everything and don't meddle in her relationship.", "Be honest with her, but don't offend her."]
        grammar: [g.imperative-negative]
        vocab: [w.herir, w.culpar, w.meterse, w.honesto, w.ofender]
    spicy:
      - { es: "No te pongas celoso; el camarero solo me ha sonreído porque le he dejado propina.", en: "Don't get jealous; the waiter only smiled at me because I left him a tip.", altEs: ["No te pongas celosa; el camarero solo me ha sonreído porque le he dejado propina."], grammar: [g.imperative-negative], vocab: [w.celoso, w.celos] }
      - { es: "No se lo digas a mi hermano, pero me gustas desde la boda.", en: "Don't tell my brother, but I've liked you since the wedding.", altEs: ["No se lo digas a mi hermano: me gustas desde la boda."], grammar: [g.imperative-negative, g.double-object-pronouns], vocab: [w.decir, w.hermano] }
      - { es: "Ni se te ocurra cancelar la cita: ya he limpiado el piso y he escondido al perro.", en: "Don't even think about cancelling the date: I've already cleaned the flat and hidden the dog.", altEs: ["Ni se te ocurra cancelar la cita; ya he limpiado el piso y escondido al perro."], grammar: [g.imperative-negative], vocab: [w.ni-se-te-ocurra] }
      - { es: "No me juzgues: solo he mirado su foto quince veces.", en: "Don't judge me: I've only looked at his photo fifteen times.", altEs: ["No me juzgues; solo he mirado su foto quince veces."], grammar: [g.imperative-negative], vocab: [w.juzgar] }
      - { es: "No te relajes tanto; es la primera cita, no el sofá de tu casa.", en: "Don't relax so much; it's a first date, not your sofa at home.", altEs: ["No te relajes tanto: es la primera cita, no el sofá de tu casa."], grammar: [g.imperative-negative], vocab: [w.relajarse] }
  - id: b1.u04.l3
    title: Te recomiendo que descanses
    teach: [g.subjunctive-advice]
    vocab: [w.sugerencia, w.recomendacion, w.grasa, w.terapia, w.especialista, w.vacuna, w.en-forma, w.mantener, w.alimentacion, w.ansiedad, w.revision, w.psicologo, w.apuntes, w.repasar, w.concentrarse, w.matricularse, w.peso, w.al-menos, w.tension, w.postura, w.estirar, w.aconsejar, w.sugerir, w.proponer, w.doctor]
    tip: "recomendar / aconsejar / sugerir que + subjunctive; or use deberías + infinitive, yo que tú + conditional, es mejor que + subjunctive."
    sentences:
      - { es: "Te recomiendo que descanses al menos ocho horas.", en: "I recommend that you rest at least eight hours.", altEs: ["Te aconsejo que descanses al menos ocho horas.", "Te recomiendo descansar al menos ocho horas."], grammar: [g.subjunctive-advice], vocab: [w.recomendar, w.descansar, w.al-menos] }
      - { es: "El médico me aconseja que haga una revisión cada año.", en: "The doctor advises me to have a check-up every year.", altEs: ["El médico me recomienda que haga una revisión cada año.", "El médico me aconseja hacer una revisión cada año."], grammar: [g.subjunctive-advice], vocab: [w.medico, w.revision] }
      - { es: "Es mejor que vayas a un especialista si el dolor sigue.", en: "It's better to go to a specialist if the pain continues.", altEs: ["Es mejor que vayas a un especialista si el dolor continúa.", "Si el dolor sigue, es mejor que vayas a un especialista."], grammar: [g.subjunctive-advice], vocab: [w.especialista, w.dolor, w.seguir] }
      - { es: "Yo que tú, me pondría la vacuna de la gripe antes del invierno.", en: "If I were you, I'd get the flu vaccine before winter.", grammar: [g.subjunctive-advice, g.conditional-simple], vocab: [w.vacuna, w.gripe, w.invierno] }
      - { es: "Conviene que reduzcas la grasa y el azúcar en tu alimentación.", en: "It's advisable to cut down the fat and sugar in your diet.", altEs: ["Es conveniente que reduzcas la grasa y el azúcar en tu alimentación.", "Conviene que reduzcas la grasa y el azúcar en tu dieta."], grammar: [g.subjunctive-advice], vocab: [w.grasa, w.azucar, w.alimentacion] }
      - { es: "Deberías mantenerte en forma: camina media hora al día.", en: "You should stay fit: walk half an hour a day.", grammar: [g.subjunctive-advice, g.imperative-tu], vocab: [w.mantener, w.en-forma, w.caminar] }
      - { es: "Mi recomendación es que hables con un psicólogo sobre tu ansiedad.", en: "My recommendation is that you talk to a psychologist about your anxiety.", grammar: [g.subjunctive-advice], vocab: [w.recomendacion, w.psicologo, w.ansiedad] }
      - { es: "La terapia me ha ayudado mucho; te aconsejo que la pruebes.", en: "Therapy has helped me a lot; I advise you to try it.", altEs: ["La terapia me ha ayudado mucho; te recomiendo que la pruebes."], grammar: [g.subjunctive-advice, g.present-perfect], vocab: [w.terapia, w.probar, w.ayudar] }
      - { es: "¿Por qué no te matriculas en un curso de español por la tarde?", en: "Why don't you enrol in an evening Spanish course?", grammar: [g.subjunctive-advice], vocab: [w.matricularse, w.curso] }
      - { es: "Os recomiendo que repaséis los apuntes antes del examen.", en: "I recommend you go over your notes before the exam.", altEs: ["Os aconsejo que repaséis los apuntes antes del examen.", "Os recomiendo repasar los apuntes antes del examen."], grammar: [g.subjunctive-advice], vocab: [w.repasar, w.apuntes, w.examen], error: { wrong: "Os recomiendo que repasáis los apuntes antes del examen.", explain: "After recomendar que use the subjunctive: repaséis, not repasáis.", grammar: g.subjunctive-advice } }
      - { es: "Si quieres concentrarte, es mejor que apagues el móvil.", en: "If you want to concentrate, it's better to switch off your phone.", grammar: [g.subjunctive-advice], vocab: [w.concentrarse, w.apagar, w.movil] }
      - { es: "Tienes la tensión alta: hay que evitar la sal.", en: "Your blood pressure is high: you have to avoid salt.", grammar: [g.subjunctive-advice], vocab: [w.tension, w.evitar, w.sal, w.hay-que] }
      - { es: "Le recomiendo que cambie de postura a menudo cuando trabaja con el ordenador.", en: "I recommend you change position often when working at the computer.", grammar: [g.subjunctive-advice], vocab: [w.postura, w.cambiar, w.a-menudo, w.ordenador], note: "Formal usted: le recomiendo que cambie." }
      - { es: "Estira las piernas y la espalda después de correr.", en: "Stretch your legs and back after running.", grammar: [g.subjunctive-advice, g.imperative-tu], vocab: [w.estirar, w.pierna, w.espalda] }
      - { es: "Mi sugerencia es que no te preocupes tanto por el peso.", en: "My suggestion is that you don't worry so much about your weight.", grammar: [g.subjunctive-advice], vocab: [w.sugerencia, w.peso, w.preocuparse] }
      - { es: "Deberías dormir más.", en: "You should sleep more.", altEs: ["Tendrías que dormir más.", "Te recomiendo que duermas más."], grammar: [g.subjunctive-advice], vocab: [w.dormir], transform: { instruction: "Rewrite with 'Te recomiendo que…'", answer: "Te recomiendo que duermas más.", alt: ["Te aconsejo que duermas más."] } }
    exchanges:
      - q: { es: "Me duele la espalda cuando trabajo con el ordenador.", en: "My back hurts when I work at the computer." }
        a: { es: "Te recomiendo que cambies de postura a menudo y que estires.", en: "I recommend you change position often and stretch." }
        alt: ["Yo que tú, iría a un especialista.", "Te aconsejo que te levantes cada hora."]
        grammar: [g.subjunctive-advice]
        vocab: [w.postura, w.estirar, w.especialista]
      - q: { es: "No consigo concentrarme para estudiar.", en: "I can't manage to concentrate to study." }
        a: { es: "Te sugiero que apagues el móvil y repases los apuntes en la biblioteca.", en: "I suggest you switch off your phone and go over your notes in the library." }
        alt: ["Es mejor que estudies por la mañana.", "¿Por qué no estudias con un compañero?"]
        grammar: [g.subjunctive-advice]
        vocab: [w.concentrarse, w.sugerir, w.repasar, w.apuntes]
      - q: { es: "Quiero mantenerme en forma, pero no tengo tiempo.", en: "I want to stay fit, but I don't have time." }
        a: { es: "Mi recomendación es que camines al menos media hora al día.", en: "My recommendation is that you walk at least half an hour a day." }
        alt: ["Te aconsejo que vayas al trabajo en bici.", "Deberías mejorar también la alimentación."]
        grammar: [g.subjunctive-advice]
        vocab: [w.en-forma, w.mantener, w.recomendacion, w.al-menos]
      - q: { es: "¿Qué me aconseja, doctor?", en: "What do you advise, doctor?" }
        a: { es: "Le aconsejo que se ponga la vacuna de la gripe y que reduzca la sal.", en: "I advise you to get the flu vaccine and to cut down on salt." }
        alt: ["Le recomiendo que haga una revisión cada año.", "Es mejor que descanse unos días."]
        grammar: [g.subjunctive-advice]
        vocab: [w.aconsejar, w.doctor, w.vacuna, w.revision]
      - q: { es: "Últimamente tengo mucha ansiedad.", en: "Lately I have a lot of anxiety." }
        a: { es: "Te propongo que hables con un psicólogo; a mí la terapia me ayudó mucho.", en: "I suggest you talk to a psychologist; therapy helped me a lot." }
        alt: ["Te aconsejo que duermas al menos ocho horas.", "Yo que tú, pediría cita con un especialista."]
        grammar: [g.subjunctive-advice]
        vocab: [w.ansiedad, w.proponer, w.psicologo, w.terapia]
    texts:
      - title: "Consejos del médico"
        es: ["Le recomiendo que reduzca la grasa y el azúcar.", "Es importante que camine al menos treinta minutos al día.", "Y le aconsejo que vuelva en tres meses para una revisión."]
        en: ["I recommend that you cut down on fat and sugar.", "It's important that you walk at least thirty minutes a day.", "And I advise you to come back in three months for a check-up."]
        grammar: [g.subjunctive-advice]
        vocab: [w.grasa, w.al-menos, w.aconsejar, w.revision]
      - title: "Mensaje a un compañero de clase"
        es: ["Te sugiero que repases los apuntes del tema tres.", "Yo que tú, me matricularía en el curso de la tarde.", "Y no te preocupes tanto por la nota: lo importante es aprender."]
        en: ["I suggest you go over the notes from unit three.", "If I were you, I'd enrol in the afternoon course.", "And don't worry so much about the grade: the important thing is to learn."]
        grammar: [g.subjunctive-advice]
        vocab: [w.sugerir, w.repasar, w.apuntes, w.matricularse]
    spicy:
      - { es: "Te recomiendo que apagues el móvil en la cita; tu ex puede esperar.", en: "I recommend you switch off your phone on the date; your ex can wait.", altEs: ["Te aconsejo que apagues el móvil en la cita; tu ex puede esperar."], grammar: [g.subjunctive-advice], vocab: [w.recomendar, w.apagar, w.movil] }
      - { es: "Yo que tú me cambiaría de camisa antes de la cita: es un consejo de amiga.", en: "If I were you, I'd change my shirt before the date: friendly advice.", altEs: ["Yo que tú me cambiaría la camisa antes de la cita: es un consejo de amiga."], grammar: [g.subjunctive-advice, g.conditional-simple], vocab: [w.cambiar] }
      - { es: "Te sugiero que evites hablar de tu madre en la primera cena.", en: "I suggest you avoid talking about your mother at the first dinner.", altEs: ["Te sugiero que no hables de tu madre en la primera cena."], grammar: [g.subjunctive-advice], vocab: [w.sugerir, w.evitar] }
      - { es: "Es mejor que descanses esta noche: mañana bailamos hasta que cierren el bar.", en: "It's better that you rest tonight: tomorrow we dance until the bar closes.", altEs: ["Es mejor que descanses esta noche; mañana bailamos hasta que cierren el bar."], grammar: [g.subjunctive-advice], vocab: [w.descansar] }
      - { es: "El especialista me aconseja que camine al menos una hora al día; yo propongo que caminemos juntos.", en: "The specialist advises me to walk at least an hour a day; I propose we walk together.", altEs: ["El especialista me aconseja caminar al menos una hora al día; yo propongo que caminemos juntos."], grammar: [g.subjunctive-advice], vocab: [w.aconsejar, w.caminar, w.al-menos, w.proponer, w.especialista] }
  - id: b1.u04.l4
    title: Dice que vengas
    teach: [g.indirect-commands]
    vocab: [w.orden, w.encargar, w.turno, w.presentacion, w.cuanto-antes, w.advertencia, w.redactar, w.ambos, w.cualquiera, w.convocar, w.becario, w.archivar, w.archivo, w.imprimir, w.proveedor, w.almacen, w.despacho, w.practicas, w.plantilla]
    tip: "decir / pedir / mandar que + subjunctive reports an order; que + subjunctive on its own passes one on: Que pase."
    sentences:
      - { es: "La jefa dice que vengas a su despacho cuanto antes.", en: "The boss says you should come to her office as soon as possible.", altEs: ["La jefa dice que vayas a su despacho cuanto antes.", "La jefa dice que vengas a su despacho lo antes posible."], grammar: [g.indirect-commands], vocab: [w.jefe, w.despacho, w.cuanto-antes] }
      - { es: "Nos ha pedido que redactemos el informe antes del viernes.", en: "She has asked us to write up the report before Friday.", altEs: ["Nos ha pedido que escribamos el informe antes del viernes."], grammar: [g.indirect-commands], vocab: [w.redactar, w.informe, w.pedir] }
      - { es: "El director manda que los becarios archiven las facturas de este mes.", en: "The director orders the interns to file this month's invoices.", grammar: [g.indirect-commands], vocab: [w.becario, w.archivar, w.factura, w.director] }
      - { es: "¿El señor Ruiz está esperando? — Que pase, por favor.", en: "Is Mr Ruiz waiting? — Let him in, please.", grammar: [g.indirect-commands], vocab: [w.esperar, w.pasar], note: "que + subjunctive passes an order on to a third person." }
      - { es: "Dice el proveedor que le enviemos la dirección del almacén.", en: "The supplier says we should send him the warehouse address.", altEs: ["El proveedor dice que le enviemos la dirección del almacén.", "Dice el proveedor que le mandemos la dirección del almacén."], grammar: [g.indirect-commands], vocab: [w.proveedor, w.almacen, w.enviar, w.direccion] }
      - { es: "Te he dicho mil veces que no imprimas los correos: es malo para el medio ambiente.", en: "I've told you a thousand times not to print the emails: it's bad for the environment.", grammar: [g.indirect-commands], vocab: [w.imprimir, w.correo, w.medio-ambiente], error: { wrong: "Te he dicho mil veces que no imprimes los correos.", explain: "decir que + subjunctive when it reports an order (que no imprimas); the indicative (imprimes) would only report information.", grammar: g.indirect-commands } }
      - { es: "Han convocado una reunión y dicen que vayan ambos equipos.", en: "They've called a meeting and say both teams should go.", altEs: ["Han convocado una reunión y dicen que vayan los dos equipos."], grammar: [g.indirect-commands], vocab: [w.convocar, w.reunion, w.ambos, w.equipo] }
      - { es: "Mi madre insiste en que coma más verdura.", en: "My mother insists that I eat more vegetables.", altEs: ["Mi madre insiste en que yo coma más verdura."], grammar: [g.indirect-commands], vocab: [w.comer, w.verdura] }
      - { es: "El médico me ha dicho que no trabaje en el turno de noche.", en: "The doctor has told me not to work the night shift.", grammar: [g.indirect-commands], vocab: [w.turno, w.trabajar, w.noche] }
      - { es: "Que lo haga cualquiera de la plantilla; no hace falta que seas tú.", en: "Let anyone on the staff do it; it doesn't have to be you.", grammar: [g.indirect-commands], vocab: [w.cualquiera, w.plantilla] }
      - { es: "La jefa ha dado la orden de que nadie salga antes de las seis.", en: "The boss has given the order that nobody leaves before six.", grammar: [g.indirect-commands], vocab: [w.orden, w.salir, w.nadie] }
      - { es: "Me han encargado que prepare la presentación para los clientes.", en: "They've put me in charge of preparing the presentation for the clients.", altEs: ["Me han pedido que prepare la presentación para los clientes."], grammar: [g.indirect-commands], vocab: [w.encargar, w.presentacion, w.cliente] }
      - { es: "Última advertencia: que nadie toque el ordenador del despacho.", en: "Last warning: nobody is to touch the office computer.", grammar: [g.indirect-commands], vocab: [w.advertencia, w.tocar, w.ordenador] }
      - { es: "Mis padres quieren que haga unas prácticas en una empresa este verano.", en: "My parents want me to do an internship at a company this summer.", grammar: [g.indirect-commands, g.subjunctive-wishes], vocab: [w.practicas, w.empresa, w.verano] }
      - { es: "El jefe dice que guardes el archivo y se lo envíes hoy.", en: "The boss says you should save the file and send it to him today.", altEs: ["El jefe dice que guardes el archivo y que se lo envíes hoy.", "El jefe dice que guardes el archivo y se lo mandes hoy."], grammar: [g.indirect-commands, g.double-object-pronouns], vocab: [w.archivo, w.guardar, w.enviar] }
      - { es: "La jefa: «Venid a las ocho.»", en: "The boss: 'Come at eight.'", grammar: [g.indirect-commands], vocab: [w.venir], transform: { instruction: "Report the order: La jefa dice que…", answer: "La jefa dice que vengamos a las ocho.", alt: ["La jefa dice que vayamos a las ocho."] } }
    exchanges:
      - q: { es: "¿Qué ha dicho la jefa?", en: "What did the boss say?" }
        a: { es: "Dice que vayas a su despacho cuanto antes.", en: "She says you should go to her office as soon as possible." }
        alt: ["Que redactemos el informe antes del viernes.", "Dice que no imprimáis más correos."]
        grammar: [g.indirect-commands]
        vocab: [w.despacho, w.cuanto-antes]
      - q: { es: "El proveedor está al teléfono. ¿Qué le digo?", en: "The supplier is on the phone. What shall I tell him?" }
        a: { es: "Que nos envíe la factura y que llame mañana.", en: "Tell him to send us the invoice and to call tomorrow." }
        alt: ["Dile que espere un momento.", "Que hable con el almacén."]
        grammar: [g.indirect-commands]
        vocab: [w.proveedor, w.almacen]
      - q: { es: "¿Quién prepara la presentación para los clientes?", en: "Who's preparing the presentation for the clients?" }
        a: { es: "Me han encargado a mí que la prepare.", en: "They've put me in charge of preparing it." }
        alt: ["Que la haga cualquiera de la plantilla.", "Dice la jefa que la preparen los becarios."]
        grammar: [g.indirect-commands]
        vocab: [w.presentacion, w.encargar, w.plantilla, w.becario]
      - q: { es: "¿Puedo salir antes de las seis hoy?", en: "Can I leave before six today?" }
        a: { es: "La jefa ha dado la orden de que nadie salga antes de las seis.", en: "The boss has given the order that nobody leaves before six." }
        alt: ["Hoy no; dice el director que terminemos el informe.", "Sí, pero que no te vea la jefa."]
        grammar: [g.indirect-commands]
        vocab: [w.orden]
      - q: { es: "El señor Ruiz está esperando en la entrada.", en: "Mr Ruiz is waiting at the entrance." }
        a: { es: "Que pase, por favor.", en: "Let him in, please." }
        alt: ["Que espere cinco minutos.", "Dile que suba al despacho."]
        grammar: [g.indirect-commands]
        vocab: [w.despacho]
    texts:
      - title: "Nota de la jefa"
        es: ["Buenos días a todos.", "El director dice que archivemos las facturas de este mes antes del viernes.", "Que los becarios no impriman nada: es malo para el medio ambiente.", "Y que nadie toque el ordenador del despacho."]
        en: ["Good morning, everyone.", "The director says we should file this month's invoices before Friday.", "The interns are not to print anything: it's bad for the environment.", "And nobody is to touch the office computer."]
        grammar: [g.indirect-commands]
        vocab: [w.archivar, w.becario, w.imprimir, w.despacho]
      - title: "Mensaje a un becario"
        es: ["Hola, Luis. Dice el jefe que redactes el aviso para el proveedor.", "Me ha pedido que te lo diga cuanto antes.", "Y última advertencia: que no llegues tarde al turno de mañana."]
        en: ["Hi, Luis. The boss says you should write up the notice for the supplier.", "He's asked me to tell you as soon as possible.", "And last warning: don't be late for tomorrow's shift."]
        grammar: [g.indirect-commands]
        vocab: [w.redactar, w.proveedor, w.cuanto-antes, w.advertencia, w.turno]
    spicy:
      - { es: "Mi perro manda que salgas de su sofá; yo pido que te quedes a comer.", en: "My dog orders you off his sofa; I'm asking you to stay for lunch.", altEs: ["Mi perro manda que salgas de su sofá, y yo pido que te quedes a comer."], grammar: [g.indirect-commands], vocab: [w.pedir, w.comer, w.salir] }
      - { es: "Mi jefe dice que trabaje este sábado; mi novia dice que ni se me ocurra.", en: "My boss says I should work this Saturday; my girlfriend says I shouldn't even think about it.", altEs: ["Mi jefe dice que trabaje este sábado; mi novio dice que ni se me ocurra."], grammar: [g.indirect-commands], vocab: [w.jefe, w.trabajar] }
      - { es: "Que pase el siguiente candidato; el anterior ha hablado dos horas de su coche.", en: "Send in the next candidate; the previous one talked about his car for two hours.", altEs: ["Que pase el siguiente; el anterior ha hablado dos horas de su coche."], grammar: [g.indirect-commands], vocab: [w.pasar] }
      - { es: "Dile que me envíe su dirección cuanto antes; quiero mandarle flores, no un correo.", en: "Tell her to send me her address as soon as possible; I want to send her flowers, not an email.", altEs: ["Dile que me mande su dirección cuanto antes; quiero enviarle flores, no un correo."], grammar: [g.indirect-commands], vocab: [w.enviar, w.direccion, w.cuanto-antes, w.correo] }
      - { es: "Mis amigos me piden que no toque la guitarra en las citas; yo les pido que no vengan a mis citas.", en: "My friends ask me not to play the guitar on dates; I ask them not to come to my dates.", altEs: ["Mis amigos me piden que no toque la guitarra en las citas, y yo les pido que no vengan a mis citas."], grammar: [g.indirect-commands], vocab: [w.pedir, w.tocar, w.venir] }
dialogues:
  - id: b1.u04.d1
    title: Consejos de una amiga
    context: Marta has had a terrible week at work; her friend Lucía gives her advice over a coffee.
    lines:
      - { speaker: Lucía, es: "¿Qué te pasa, Marta? Tienes mala cara.", en: "What's wrong, Marta? You look terrible." }
      - { speaker: Marta, es: "Estoy agotada. Mi jefe dice que termine el informe para el lunes y que, además, prepare la presentación de los clientes.", en: "I'm exhausted. My boss says I have to finish the report for Monday and, on top of that, prepare the clients' presentation." }
      - { speaker: Lucía, es: "No te estreses tanto. Yo que tú, hablaría con él y le pediría más tiempo.", en: "Don't get so stressed. If I were you, I'd talk to him and ask him for more time." }
      - { speaker: Marta, es: "Es que me da miedo que se enfade.", en: "The thing is I'm afraid he'll get angry." }
      - { speaker: Lucía, es: "No pienses eso. Te recomiendo que le expliques el problema sin miedo. Y, sobre todo, no trabajes este fin de semana.", en: "Don't think that. I recommend you explain the problem to him without fear. And above all, don't work this weekend." }
      - { speaker: Marta, es: "Imposible. Además, no duermo bien y me duele la espalda.", en: "Impossible. Besides, I don't sleep well and my back hurts." }
      - { speaker: Lucía, es: "Pues es mejor que vayas al médico cuanto antes. Y deberías estirar un poco cada mañana.", en: "Then it's better you go to the doctor as soon as possible. And you should stretch a bit every morning." }
      - { speaker: Marta, es: "Vale, vale. ¿Algo más, doctora?", en: "OK, OK. Anything else, doctor?" }
      - { speaker: Lucía, es: "Sí: no te rías, lo digo en serio. Tu salud es lo primero.", en: "Yes: don't laugh, I mean it. Your health comes first." }
      - { speaker: Marta, es: "Tienes razón. Mañana mismo pido cita.", en: "You're right. I'll make an appointment tomorrow." }
    questions:
      - { q: "¿Qué le ha pedido el jefe a Marta?", options: ["Que termine el informe y prepare una presentación", "Que vaya al médico cuanto antes", "Que trabaje desde casa el fin de semana"], answer: 0 }
      - { q: "¿Por qué no quiere Marta hablar con su jefe?", options: ["Porque está de vacaciones", "Porque tiene miedo de que se enfade", "Porque ya le ha pedido más tiempo"], answer: 1 }
      - { q: "¿Qué consejo le da Lucía sobre el fin de semana?", options: ["Que no trabaje", "Que estire la espalda cada mañana", "Que prepare la presentación el lunes"], answer: 0 }
      - { q: "¿Qué va a hacer Marta mañana?", options: ["Pedir cita con el médico", "Terminar la presentación", "Hablar otra vez con Lucía"], answer: 0, explain: "Lucía tells her to see a doctor as soon as possible; Marta replies 'Mañana mismo pido cita'." }
writing:
  - task: "Your friend is going to drive in Argentina for the first time. Write advice: what to do and what not to do (no corras, no bebas …)."
    min: 50
    max: 100
    use: [w.cinturon, w.limite, w.alcohol, w.peaton, w.respetar]
    useAtLeast: 3
    grammar: [g.imperative-negative]
    expect:
      - { pattern: "\\bno (te |lo |la |le |los |las )?(corras|bebas|conduzcas|hables|uses|aparques|olvides|pares|frenes|cruces|lleves|pases|vayas|toques|pongas|hagas|digas|salgas|comas|duermas|mires|dejes)\\b", hint: "Use negative tú commands: no corras, no bebas, no uses …" }
      - { pattern: "\\b(ponte|respeta|lleva|para|frena|ten|mira|deja|usa|conduce)\\b", hint: "Add positive advice too: ponte el cinturón, respeta los límites …" }
    model: { es: "Antes de salir, ponte siempre el cinturón y respeta los límites de velocidad. No corras en la carretera, aunque no haya tráfico. No bebas alcohol si vas a conducir, ni siquiera una cerveza. En la ciudad, ten cuidado con los peatones y no aparques en la acera. Y por favor, no uses el móvil mientras conduces.", en: "Before you set off, always put your seatbelt on and respect the speed limits. Don't speed on the road, even if there's no traffic. Don't drink alcohol if you're going to drive, not even a beer. In the city, watch out for pedestrians and don't park on the pavement. And please, don't use your phone while you're driving." }
  - task: "Your friend is jealous and upset. Calm her down with negative commands, some with pronouns (no te preocupes, no lo culpes, no se lo cuentes …)."
    es: "Mi novio no me contesta los mensajes y estoy muy celosa. ¿Qué hago?"
    min: 50
    max: 100
    use: [w.tranquilizarse, w.celos, w.confianza, w.culpar, w.enfadarse]
    useAtLeast: 3
    grammar: [g.imperative-negative]
    expect:
      - { pattern: "no te (preocupes|enfades|pongas|agobies|estreses|vuelvas)", hint: "Use negative commands with te: no te preocupes, no te enfades …" }
      - { pattern: "\\bno (se lo|se la|lo|la|le|les|me) [a-záéíóúñ]+(es|as)\\b", hint: "Add a negative command with an object pronoun: no lo culpes, no se lo cuentes …" }
    model: { es: "Tranquilízate, por favor, y no te preocupes tanto. Seguro que está ocupado. No le escribas veinte mensajes en una hora y no lo culpes antes de hablar con él. Los celos destruyen la confianza. Si quieres hablar del tema, hazlo con tranquilidad y no te enfades. Y, por favor, no se lo cuentes a toda la familia.", en: "Calm down, please, and don't worry so much. I'm sure he's busy. Don't send him twenty messages in an hour and don't blame him before talking to him. Jealousy destroys trust. If you want to talk about it, do it calmly and don't get angry. And please don't tell the whole family." }
  - task: "Give advice to a stressed student, using te recomiendo que, te aconsejo que, te sugiero que + subjunctive."
    es: "Tengo exámenes finales en dos semanas y estoy fatal: no duermo y como mal."
    min: 50
    max: 100
    use: [w.aconsejar, w.sugerir, w.repasar, w.concentrarse, w.ansiedad]
    useAtLeast: 3
    grammar: [g.subjunctive-advice]
    expect:
      - { pattern: "te (recomiendo|aconsejo|sugiero|propongo) que|es (mejor|importante|recomendable) que", hint: "Give advice with que + subjunctive: te recomiendo que …, te aconsejo que …" }
    model: { es: "Te recomiendo que hagas un plan de estudio y que repases un poco cada día. También te aconsejo que duermas al menos siete horas, porque sin descanso no podrás concentrarte. Te sugiero que comas más fruta y menos grasa. Si la ansiedad no se va, es mejor que hables con un psicólogo. ¡Mucho ánimo!", en: "I recommend you make a study plan and revise a little every day. I also advise you to sleep at least seven hours, because without rest you won't be able to concentrate. I suggest you eat more fruit and less fat. If the anxiety doesn't go away, it's better to talk to a psychologist. Hang in there!" }
  - task: "Your boss left a note for your colleague Pablo. Pass on her instructions (Dice que …, Quiere que …, Te pide que …)."
    es: "Pablo: imprime la presentación, archiva los contratos y llama al proveedor cuanto antes. Prepara también mi despacho para la reunión."
    min: 50
    max: 100
    use: [w.imprimir, w.archivar, w.proveedor, w.cuanto-antes, w.presentacion]
    useAtLeast: 3
    grammar: [g.indirect-commands]
    expect:
      - { pattern: "\\b(dice|ha dicho|pide|quiere|manda) que\\b", hint: "Pass on the order: dice que …, quiere que …" }
