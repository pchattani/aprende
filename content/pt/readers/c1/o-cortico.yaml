id: r.c1.o-cortico
level: c1
title: "O cortiço acorda"
kind: literature
author: Aluísio Azevedo (1857–1913)
source: "O Cortiço (1890), capítulo I (excertos) e capítulo III (início). Ortografia atualizada; cortes marcados com (…). Domínio público."
intro: "The great Brazilian naturalist novel describes a Rio tenement (cortiço) as if it were a living organism. First, the miserly Portuguese immigrant João Romão builds his fortune; then the cortiço wakes up at five in the morning. Read for the senses: the long lists of sounds and smells, the impersonal se (ouviam-se, trocavam-se) and the animal metaphors that are the hallmark of naturalism."
allow: [aluísio, azevedo, joão, romão, botafogo]
paragraphs:
  - { es: "João Romão foi, dos treze aos vinte e cinco anos, empregado de um vendeiro que enriqueceu entre as quatro paredes de uma suja e obscura taverna nos refolhos do bairro do Botafogo; e tanto economizou do pouco que ganhara nessa dúzia de anos, que, ao retirar-se o patrão para a terra, lhe deixou, em pagamento de ordenados vencidos, nem só a venda com o que estava dentro, como ainda um conto e quinhentos em dinheiro.", en: "From the age of thirteen to twenty-five, João Romão was employed by a shopkeeper who grew rich within the four walls of a dirty, dark tavern in the depths of the Botafogo district; and he saved so much of the little he had earned in that dozen years that, when his master retired to the old country, he left him, in payment of wages owed, not only the shop and everything in it but also one conto and five hundred in cash." }
  - { es: "Proprietário e estabelecido por sua conta, o rapaz atirou-se à labutação ainda com mais ardor, possuindo-se de tal delírio de enriquecer, que afrontava resignado as mais duras privações. Dormia sobre o balcão da própria venda, em cima de uma esteira, fazendo travesseiro de um saco de estopa cheio de palha. (…)", en: "Now an owner, set up on his own account, the young man threw himself into his toil with even greater zeal, seized by such a frenzy to grow rich that he faced the harshest privations with resignation. He slept on the counter of his own shop, on a straw mat, using as a pillow a burlap sack full of straw. (…)" }
  - { es: "E naquela terra encharcada e fumegante, naquela umidade quente e lodosa, começou a minhocar, a esfervilhar, a crescer, um mundo, uma coisa viva, uma geração, que parecia brotar espontânea, ali mesmo, daquele lameiro, e multiplicar-se como larvas no esterco. (…)", en: "And in that soaked, steaming earth, in that hot, muddy dampness, there began to wriggle, to swarm, to grow, a world, a living thing, a generation, which seemed to sprout spontaneously, right there, out of that mire, and to multiply like larvae in dung. (…)" }
  - { es: "Eram cinco horas da manhã e o cortiço acordava, abrindo, não os olhos, mas a sua infinidade de portas e janelas alinhadas. Um acordar alegre e farto de quem dormiu de uma assentada sete horas de chumbo. Como que se sentiam ainda na indolência de neblina as derradeiras notas da última guitarra da noite antecedente, dissolvendo-se à luz loura e tenra da aurora, que nem um suspiro de saudade perdido em terra alheia.", en: "It was five in the morning and the tenement was waking up, opening not its eyes but its infinity of doors and windows in a row. The cheerful, sated waking of someone who has slept seven leaden hours at a stretch. It was as if one could still feel, in the idleness of the mist, the last notes of the last guitar of the night before, dissolving in the soft blond light of dawn, like a sigh of longing lost in a foreign land." }
  - { es: "A roupa lavada, que ficara de véspera nos coradouros, umedecia o ar e punha-lhe um farto acre de sabão ordinário. As pedras do chão, esbranquiçadas no lugar da lavagem e em alguns pontos azuladas pelo anil, mostravam uma palidez grisalha e triste, feita de acumulações de espumas secas.", en: "The washing, left out since the day before on the bleaching lines, moistened the air and gave it a sharp reek of cheap soap. The paving stones, whitened where the washing was done and in places tinged blue by the laundry blue, showed a sad, greyish pallor, made of layers of dried foam." }
  - { es: "Entretanto, das portas surgiam cabeças congestionadas de sono; ouviam-se amplos bocejos, fortes como o marulhar das ondas; pigarreava-se grosso por toda a parte; começavam as xícaras a tilintar; o cheiro quente do café aquecia, suplantando todos os outros; trocavam-se de janela para janela as primeiras palavras, os bons-dias; reatavam-se conversas interrompidas à noite; a pequenada cá fora traquinava já, e lá dentro das casas vinham choros abafados de crianças que ainda não andam.", en: "Meanwhile, heads swollen with sleep appeared at the doors; one heard wide yawns, loud as the roar of the waves; there was heavy throat-clearing everywhere; the cups began to clink; the warm smell of coffee warmed the air, overpowering all the others; the first words, the good-mornings, were exchanged from window to window; conversations broken off at night were taken up again; the little ones outside were already up to mischief, and from inside the houses came the muffled crying of babies who cannot yet walk." }
  - { es: "No confuso rumor que se formava, destacavam-se risos, sons de vozes que altercavam, sem se saber onde, grasnar de marrecos, cantar de galos, cacarejar de galinhas. De alguns quartos saíam mulheres que vinham pendurar cá fora, na parede, a gaiola do papagaio, e os louros, à semelhança dos donos, cumprimentavam-se ruidosamente, espanejando-se à luz nova do dia.", en: "In the confused din that was forming, there stood out laughter, the sound of voices quarrelling, no one knew where, the quacking of ducks, the crowing of cocks, the clucking of hens. From some rooms came women who hung the parrot's cage outside on the wall, and the parrots, like their owners, greeted each other noisily, fluffing their feathers in the new light of day." }
  - { es: "Daí a pouco, em volta das bicas era um zunzum crescente; uma aglomeração tumultuosa de machos e fêmeas. Uns, após outros, lavavam a cara, incomodamente, debaixo do fio de água que escorria da altura de uns cinco palmos. O chão inundava-se. As mulheres precisavam já prender as saias entre as coxas para não as molhar; via-se-lhes a tostada nudez dos braços e do pescoço, que elas despiam, suspendendo o cabelo todo para o alto do casco; os homens, esses não se preocupavam em não molhar o pelo, ao contrário metiam a cabeça bem debaixo da água e esfregavam com força as ventas e as barbas, fossando e fungando contra as palmas da mão.", en: "Soon around the taps there was a growing buzz, a tumultuous crowd of males and females. One after another they washed their faces, awkwardly, under the trickle of water that ran down from a height of about five hand-spans. The ground was flooded. The women already had to hold their skirts between their thighs so as not to wet them; one could see the tanned bareness of their arms and necks, which they uncovered, piling all their hair on top of their heads; the men, for their part, did not worry about wetting their hair; on the contrary, they put their heads right under the water and scrubbed their noses and beards hard, snorting and snuffling into the palms of their hands." }
  - { es: "As portas das latrinas não descansavam, era um abrir e fechar de cada instante, um entrar e sair sem tréguas. (…) O rumor crescia, condensando-se; o zunzum de todos os dias acentuava-se; já se não destacavam vozes dispersas, mas um só ruído compacto que enchia todo o cortiço. Começavam a fazer compras na venda; ensarilhavam-se discussões e resingas; ouviam-se gargalhadas e pragas; já se não falava, gritava-se.", en: "The latrine doors never rested; it was an opening and closing every moment, a coming and going without respite. (…) The noise grew, thickening; the everyday hubbub swelled; separate voices could no longer be made out, only a single solid din that filled the whole tenement. People began to shop at the store; arguments and squabbles got tangled up; there were roars of laughter and curses; people no longer talked, they shouted." }
  - { es: "Sentia-se naquela fermentação sanguínea, naquela gula viçosa de plantas rasteiras que mergulham os pés vigorosos na lama preta e nutriente da vida, o prazer animal de existir, a triunfante satisfação de respirar sobre a terra.", en: "One could feel in that sanguine fermentation, in that lush greed of creeping plants that plunge their vigorous feet into the black, nourishing mud of life, the animal pleasure of existing, the triumphant satisfaction of breathing upon the earth." }
questions:
  - { q: "Como João Romão começou a sua fortuna?", options: ["Recebeu uma herança da família", "Ganhou na loteria", "O patrão, ao voltar para a terra, deixou-lhe a venda e algum dinheiro como pagamento de salários", "Casou com uma mulher rica"], answer: 2, explain: "His former master left him the shop and one conto and five hundred in payment of overdue wages; João Romão then lived in extreme thrift to grow rich." }
  - { q: "Que detalhe mostra a obsessão de João Romão por economizar?", options: ["Ele dormia sobre o balcão da venda, com um saco de palha como travesseiro", "Ele comprava roupas caras", "Ele viajava todo ano", "Ele dava festas no cortiço"], answer: 0, explain: "He faced 'as mais duras privações', sleeping on the shop counter on a straw mat." }
  - { q: "No início do capítulo III, como o cortiço é apresentado?", options: ["Como um lugar abandonado", "Como um ser vivo que acorda, abrindo portas e janelas em vez de olhos", "Como uma fábrica", "Como um palácio"], answer: 1, explain: "Personification: the tenement wakes up 'abrindo, não os olhos, mas a sua infinidade de portas e janelas'." }
  - { q: "Que cheiro domina todos os outros pela manhã?", options: ["O do sabão", "O da chuva", "O do café quente", "O do peixe"], answer: 2, explain: "'O cheiro quente do café aquecia, suplantando todos os outros.'" }
  - { q: "Que efeito produzem as longas listas de sons (bocejos, xícaras, risos, galos, galinhas)?", options: ["Mostram que o cortiço é silencioso", "Mostram o cortiço como uma multidão viva e barulhenta, quase animal", "Explicam a história de João Romão", "Descrevem a natureza fora da cidade"], answer: 1, explain: "Naturalism piles up sensations and animal images (machos e fêmeas, larvas no esterco) to show human beings shaped by their environment." }
