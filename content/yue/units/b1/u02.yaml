id: b1.u02
title: 行上大帽山
lessons:
  - id: b1.u02.l1
    title: 行上山頂睇日出
    teach: [g.compound-directionals]
    vocab: [w.soeng5-heoi3, w.lok6-heoi3, w.soeng5-lai4, w.lok6-lai4, w.ceot1-lai4, w.hei2-lai4, w.daai6-mou6-saan1, w.paa4-saan1, w.saan1-lou6, w.saan1-goek3, w.ce4, w.deng2.b, w.soeng5-saan1, w.wan4-hoi2, w.jat6-ceot1, w.jat6-lok6, w.paan1, w.kei5-hei2-san1, w.co5-dai1, w.fan3-dai1, w.haang4-lok6-heoi3, w.paau2-ceot1-heoi3, w.ce4-lou6, w.ging2-sik1, w.sek6-tau4, w.bui3-nong4, w.hei2.c]
    tip: "Main verb + direction (上 up, 落 down, 入 in, 出 out) + 嚟 (towards me) or 去 (away): 行上去, 跑出嚟. A place goes after the direction word: 行上大帽山."
    sentences:
      - { es: "我哋聽朝五點行上大帽山睇日出。", en: "We're walking up Tai Mo Shan at five tomorrow morning to watch the sunrise.", altEs: ["聽朝五點我哋行上大帽山睇日出。"], grammar: [g.compound-directionals, g.serial-verbs], vocab: [w.daai6-mou6-saan1, w.jat6-ceot1],
          error: { wrong: "我哋聽朝五點行大帽山上睇日出。", explain: "The direction word comes straight after the verb and the place follows it: 行上大帽山.", grammar: g.compound-directionals } }
      - { es: "大帽山係香港最高嘅山，有九百五十七米高。", en: "Tai Mo Shan is the highest mountain in Hong Kong, 957 metres high.", altEs: ["大帽山係全香港最高嘅山，有九百五十七米高。"], grammar: [g.zeoi-superlative, g.adj-ge-noun], vocab: [w.daai6-mou6-saan1] }
      - { es: "條山路好斜，我哋行慢啲啦。", en: "The trail is really steep, let's walk more slowly.", altEs: ["呢條山路好斜，我哋行慢啲啦。"], grammar: [g.laa1-suggestion], vocab: [w.saan1-lou6, w.ce4] }
      - { es: "你喺山腳等我，我行落去搵你。", en: "Wait for me at the foot of the hill, I'll walk down to find you.", altEs: ["你喺山腳等我，我落去搵你。"], grammar: [g.compound-directionals], vocab: [w.saan1-goek3, w.lok6-heoi3, w.haang4-lok6-heoi3],
          transform: { instruction: "Now you're at the bottom: tell your friend to come down to you", answer: "你行落嚟搵我啦。", alt: ["你落嚟搵我啦。", "你行落嚟啦。"], en: "Come down and find me." } }
      - { es: "天氣好嘅話，喺山頂可以睇到雲海。", en: "If the weather's good, you can see a sea of clouds from the top.", altEs: ["如果天氣好，喺山頂可以睇到雲海。"], grammar: [g.jyu-gwo-zau], vocab: [w.wan4-hoi2, w.saan1-deng2] }
      - { es: "啲細路一放學就跑咗出去玩。", en: "The kids ran out to play as soon as school finished.", altEs: ["啲細路一放學就跑出去玩。"], grammar: [g.compound-directionals], vocab: [w.paau2-ceot1-heoi3] }
      - { es: "你上嚟啦，上面啲景色好靚！", en: "Come up, the view up here is gorgeous!", altEs: ["你快啲上嚟啦，上面啲景色好靚！"], grammar: [g.compound-directionals], vocab: [w.soeng5-lai4, w.ging2-sik1],
          transform: { instruction: "You're still at the bottom: tell your friend to go up", answer: "你上去啦，上面啲景色好靚！", alt: ["你先上去啦。"], en: "Go on up, the view up there is gorgeous!" } }
      - { es: "我哋行到山頂先坐低休息。", en: "We only sat down to rest once we'd reached the top.", altEs: ["行到山頂我哋先坐低休息。"], grammar: [g.compound-directionals, g.sin-final], vocab: [w.co5-dai1, w.deng2.b] }
      - { es: "坐咗咁耐，企起身郁吓啦。", en: "You've been sitting for ages, stand up and move about.", altEs: ["坐咗咁耐喇，企起身郁吓啦。"], grammar: [g.compound-directionals], vocab: [w.kei5-hei2-san1],
          transform: { instruction: "Say the opposite: you've walked for ages, sit down and rest", answer: "行咗咁耐，坐低休息吓啦。", alt: ["行咗咁耐喇，坐低休息吓啦。"], en: "You've walked for ages, sit down and have a rest." } }
      - { es: "好攰呀，我想瞓低一陣。", en: "I'm so tired, I want to lie down for a bit.", altEs: ["好攰，我想瞓低一陣。", "我好攰，想瞓低一陣。"], grammar: [g.compound-directionals], vocab: [w.fan3-dai1] }
      - { es: "呢度要攀住啲石頭爬上去。", en: "Here you have to hold on to the rocks and climb up.", altEs: ["呢度要攀住石頭爬上去。"], grammar: [g.compound-directionals, g.zyu-continuous], vocab: [w.paan1, w.sek6-tau4] }
      - { es: "落山比上山易，不過都要小心。", en: "Going down is easier than going up, but you still need to be careful.", altEs: ["落山比上山容易，不過都要小心。"], grammar: [g.bei2-comparison], vocab: [w.soeng5-saan1] }
      - { es: "日落之前我哋一定要落到山腳。", en: "We must get down to the foot of the hill before sunset.", altEs: ["我哋一定要喺日落之前落到山腳。"], grammar: [g.ji-cin-ji-hau], vocab: [w.jat6-lok6, w.saan1-goek3] }
      - { es: "佢由背囊入面拎咗張地圖出嚟。", en: "She took a map out of her backpack.", altEs: ["佢喺背囊入面拎咗張地圖出嚟。"], altEn: ["He took a map out of his backpack."], grammar: [g.compound-directionals], vocab: [w.bui3-nong4, w.ceot1-lai4, w.ling1-ceot1-lai4],
          error: { wrong: "佢由背囊入面拎咗出嚟張地圖。", explain: "An ordinary object goes between the verb and the direction words: 拎咗張地圖出嚟.", grammar: g.compound-directionals } }
      - { es: "落完雨，太陽又出嚟喇。", en: "The rain's stopped and the sun has come out again.", altEs: ["落完雨，太陽出返嚟喇。"], grammar: [g.compound-directionals, g.jyun-hou], vocab: [w.ceot1-lai4] }
      - { es: "爬山爬到一半，佢唱起歌嚟。", en: "Halfway up the mountain, she started singing.", altEs: ["爬到一半，佢唱起歌嚟。"], altEn: ["Halfway up the mountain, he burst into song."], grammar: [g.compound-directionals], vocab: [w.paa4-saan1, w.hei2-lai4] }
    exchanges:
      - q: { es: "你哋幾點出發行上山呀？", en: "What time are you setting off up the mountain?" }
        a: { es: "五點出發，想喺山頂睇日出。", en: "We set off at five; we want to watch the sunrise from the top." }
        alt: ["五點。", "好早，想睇日出。"]
        grammar: [g.compound-directionals]
        vocab: [w.deng2.b, w.jat6-ceot1]
      - q: { es: "上面啲景色點呀？", en: "What's the view like up there?" }
        a: { es: "好靚呀，有雲海，你快啲上嚟啦！", en: "Gorgeous, there's a sea of clouds, come up quick!" }
        alt: ["好靚呀！", "有雲海，好靚。"]
        grammar: [g.compound-directionals]
        vocab: [w.wan4-hoi2, w.soeng5-lai4]
      - q: { es: "你喺邊度呀？", en: "Where are you?" }
        a: { es: "我喺山腳，你行落嚟啦。", en: "I'm at the foot of the hill, come down." }
        alt: ["喺山腳。", "我喺山頂，你上嚟啦。"]
        grammar: [g.compound-directionals]
        vocab: [w.saan1-goek3, w.lok6-lai4]
      - q: { es: "條山路斜唔斜呀？", en: "Is the trail steep?" }
        a: { es: "好斜，一路都係斜路，有啲地方要攀住石頭爬上去。", en: "Very, it's uphill all the way, and in some places you have to hold on to the rocks and climb up." }
        alt: ["好斜。", "唔係好斜。"]
        grammar: [g.compound-directionals]
        vocab: [w.ce4, w.ce4-lou6, w.paan1]
      - q: { es: "你仲行得郁嗎？", en: "Can you still keep walking?" }
        a: { es: "行唔郁喇，我要坐低休息吓。", en: "I can't go on, I need to sit down and rest." }
        alt: ["行得郁。", "仲得，行慢啲啦。"]
        grammar: [g.potential-resultatives, g.compound-directionals]
        vocab: [w.co5-dai1]
    texts:
      - title: "行山相簿"
        es: ["我哋朝早四點出發行上大帽山。", "去到山頂，啱啱睇到日出同雲海。", "落山嗰陣，我兩隻腳攰到郁唔到。"]
        en: ["We set off at four in the morning to walk up Tai Mo Shan.", "When we reached the top, we were just in time for the sunrise and the sea of clouds.", "On the way down, my legs were so tired I could hardly move."]
        grammar: [g.compound-directionals]
        vocab: [w.daai6-mou6-saan1, w.wan4-hoi2]
      - title: "郊野公園告示"
        es: ["日落之前請落山。", "唔好行出山路。", "天黑之後，山上面好危險。"]
        en: ["Please come down before sunset.", "Don't leave the trail.", "After dark it's dangerous up on the mountain."]
        grammar: [g.compound-directionals, g.m-hou-dont]
        vocab: [w.jat6-lok6, w.saan1-lou6]
    spicy:
      - { es: "上嚟飲杯茶先走啦，真係淨係飲茶咋。", en: "Come up for a cup of tea before you go, really just tea.", altEs: ["你上嚟飲杯茶先走啦，真係淨係飲茶咋。"], grammar: [g.compound-directionals, g.zaa3-ze1-only], vocab: [w.soeng5-lai4] }
      - { es: "我爬咗九百幾米上嚟，就係想同你一齊睇日出。", en: "I climbed over nine hundred metres to get up here, just to watch the sunrise with you.", altEs: ["我行咗九百幾米上嚟，就係想同你睇日出。"], grammar: [g.compound-directionals], vocab: [w.jat6-ceot1] }
      - { es: "你企起身吖，等我睇清楚你條裙。", en: "Stand up, let me get a proper look at your dress.", altEs: ["你企起身，等我睇清楚你條裙。"], grammar: [g.compound-directionals, g.resultative-complements], vocab: [w.kei5-hei2-san1] }
      - { es: "日落之後先落山啦，咁靚嘅景色，唔好咁快走。", en: "Let's go down after sunset, with a view this lovely, don't leave so soon.", altEs: ["日落之後先落山啦，景色咁靚，唔好咁快走。"], grammar: [g.compound-directionals, g.ji-cin-ji-hau], vocab: [w.jat6-lok6] }
      - { es: "條山路咁斜，你拖住我隻手上去啦。", en: "The path is so steep, hold my hand on the way up.", altEs: ["條路咁斜，你拖住我隻手上去啦。"], grammar: [g.compound-directionals, g.zyu-continuous], vocab: [w.ce4, w.soeng5-heoi3] }
  - id: b1.u02.l2
    title: 拎過嚟定拎過去？
    teach: [g.directional-complements]
    vocab: [w.gwo3-heoi3, w.gwo3-lai4, w.lau4-tai1, w.sing1-gong3-gei1, w.fu4-sau2-din6-tai1, w.lau4-soeng6, w.dei6-haa2, w.tin1-toi4, w.jap6-uk1, w.lok6-lau4, w.ling1-ceot1-lai4, w.fong3-jap6-heoi3, w.bun1-soeng5-heoi3, w.gwaa3.b, w.diu3, w.tek3, w.deng3, w.paau1, w.paak3, w.tit3-lou6, w.daai6-bou3-heoi1, w.dang3, w.dung6, w.tong4-lau2, w.zi2-pei4-soeng1, w.dim2-syun3]
    tip: "嚟 after a verb points towards the speaker, 去 away: 拎過嚟 'bring it over (here)', 拎過去 'take it over (there)'. 搬去大埔 'move to Tai Po'."
    sentences:
      - { es: "唔該你拎張櫈過嚟。", en: "Please bring a stool over here.", altEs: ["唔該拎張櫈過嚟。", "唔該你拎張櫈嚟。"], grammar: [g.directional-complements], vocab: [w.gwo3-lai4, w.dang3],
          transform: { instruction: "Ask them to take it over there instead", answer: "唔該你拎張櫈過去。", alt: ["唔該拎張櫈過去。"], en: "Please take a stool over there." } }
      - { es: "我哋下個月搬去大埔住。", en: "We're moving to Tai Po next month.", altEs: ["我哋下個月搬去大埔。", "下個月我哋搬去大埔住。"], grammar: [g.directional-complements], vocab: [w.daai6-bou3],
          transform: { instruction: "You already live in Tai Po: say they're moving here", answer: "佢哋下個月搬嚟大埔住。", alt: ["佢哋下個月搬嚟大埔。"], en: "They're moving here to Tai Po next month." } }
      - { es: "你行過嚟啦，呢度睇得清楚啲。", en: "Come over here, you can see better from here.", altEs: ["你過嚟啦，呢度睇得清楚啲。"], grammar: [g.directional-complements, g.dak-descriptive], vocab: [w.gwo3-lai4] }
      - { es: "我寄咗啲手信去英國畀表姐。", en: "I sent some souvenirs to my cousin in the UK.", altEs: ["我寄咗啲手信過去英國畀表姐。"], grammar: [g.directional-complements], vocab: [w.sau2-seon3] }
      - { es: "部升降機壞咗，我哋要行樓梯上去。", en: "The lift is broken, we have to take the stairs up.", altEs: ["升降機壞咗，我哋要行樓梯上去。"], grammar: [g.compound-directionals], vocab: [w.sing1-gong3-gei1, w.lau4-tai1] }
      - { es: "呢棟唐樓冇升降機，啲紙皮箱要自己搬上去。", en: "This walk-up has no lift, we'll have to carry the boxes up ourselves.", altEs: ["呢棟唐樓冇升降機，啲紙皮箱要我哋自己搬上去。"], grammar: [g.compound-directionals], vocab: [w.bun1-soeng5-heoi3, w.tong4-lau2] }
      - { es: "你喺地下等我，我而家落樓。", en: "Wait for me on the ground floor, I'm coming down now.", altEs: ["你喺地下等我，我而家就落樓。"], grammar: [g.directional-complements], vocab: [w.dei6-haa2, w.lok6-lau4] }
      - { es: "細佬喺天台踢波，個波飛咗落街。", en: "My little brother was playing football on the roof and the ball flew down into the street.", altEs: ["細佬喺天台踢波，個波跌咗落街。"], grammar: [g.compound-directionals], vocab: [w.tin1-toi4, w.tek3] }
      - { es: "唔好由樓上掟嘢落嚟，好危險！", en: "Don't throw things down from upstairs, it's dangerous!", altEs: ["唔好喺樓上掟嘢落嚟，好危險！"], grammar: [g.compound-directionals, g.m-hou-dont], vocab: [w.deng3, w.lau4-soeng6] }
      - { es: "件褸掛喺門後面啦。", en: "Hang the jacket behind the door.", altEs: ["件褸掛咗喺門後面啦。"], grammar: [g.position-words], vocab: [w.gwaa3.b] }
      - { es: "佢哋喺天台吊咗好多燈籠。", en: "They've hung lots of lanterns on the rooftop.", altEs: ["天台吊咗好多燈籠。"], grammar: [g.zo-perfective], vocab: [w.diu3, w.dang1-lung4] }
      - { es: "啲書放入去個紙皮箱度啦。", en: "Put the books into the cardboard box.", altEs: ["啲書放入個紙皮箱度啦。"], grammar: [g.compound-directionals], vocab: [w.fong3-jap6-heoi3, w.zi2-pei4-soeng1] }
      - { es: "你泊咗架車喺邊度呀？", en: "Where did you park the car?", altEs: ["你架車泊咗喺邊度呀？"], grammar: [g.question-words], vocab: [w.paak3] }
      - { es: "拋個波過嚟！", en: "Throw the ball over here!", altEs: ["拋個波過嚟啦！", "掟個波過嚟！"], grammar: [g.directional-complements], vocab: [w.paau1],
          error: { wrong: "拋過嚟個波！", explain: "An ordinary object goes between the verb and the direction word: 拋個波過嚟.", grammar: g.directional-complements } }
      - { es: "搭扶手電梯上嚟，我喺二樓等你。", en: "Take the escalator up, I'm waiting for you on the first floor.", altEs: ["你搭扶手電梯上嚟啦，我喺二樓等你。"], altEn: ["Take the escalator up, I'm waiting on the second floor."], grammar: [g.compound-directionals], vocab: [w.fu4-sau2-din6-tai1] }
      - { es: "大埔有間鐵路博物館，你可以行入舊火車入面睇吓。", en: "Tai Po has a railway museum, and you can walk inside the old trains.", altEs: ["大埔有間鐵路博物館，你可以行入啲舊火車度睇吓。"], grammar: [g.compound-directionals], vocab: [w.tit3-lou6, w.bok3-mat6-gun2] }
    exchanges:
      - q: { es: "你哋幾時搬去大埔呀？", en: "When are you moving to Tai Po?" }
        a: { es: "下個月，不過好多嘢已經搬咗過去。", en: "Next month, but a lot of our things have already been moved over." }
        alt: ["下個月。", "下個禮拜搬過去。"]
        grammar: [g.directional-complements]
        vocab: [w.gwo3-heoi3]
      - q: { es: "部升降機壞咗，點算呀？", en: "The lift is broken, what now?" }
        a: { es: "行樓梯上去囉，得三層咋。", en: "We'll take the stairs, it's only three floors." }
        alt: ["行樓梯啦。", "等佢整好先啦。"]
        grammar: [g.compound-directionals]
        vocab: [w.sing1-gong3-gei1, w.lau4-tai1]
      - q: { es: "你泊咗架車喺邊度呀？", en: "Where did you park the car?" }
        a: { es: "泊咗喺地下停車場。", en: "In the car park on the ground floor." }
        alt: ["喺停車場。", "泊咗喺樓下。"]
        grammar: [g.hai2-location]
        vocab: [w.paak3, w.ting4-ce1-coeng4]
      - q: { es: "我喺樓下喇，你落唔落嚟呀？", en: "I'm downstairs, are you coming down?" }
        a: { es: "等我兩分鐘，我而家落樓。", en: "Give me two minutes, I'm coming down now." }
        alt: ["即刻落嚟。", "你上嚟先啦。"]
        grammar: [g.directional-complements]
        vocab: [w.lok6-lau4]
      - q: { es: "個波呢？", en: "Where's the ball?" }
        a: { es: "細佬喺天台踢波，個波飛咗落街。", en: "My brother was playing on the roof and the ball flew down into the street." }
        alt: ["飛咗落街。", "我唔知呀。"]
        grammar: [g.compound-directionals]
        vocab: [w.tin1-toi4, w.tek3]
    texts:
      - title: "搬屋"
        es: ["我哋上個禮拜搬咗嚟大埔。", "新屋喺十二樓，有升降機。", "阿媽好開心，因為唔使再行樓梯上去。"]
        en: ["We moved to Tai Po last week.", "The new flat is on the twelfth floor and has a lift.", "Mum is really happy, because she doesn't have to take the stairs up any more."]
        grammar: [g.directional-complements]
        vocab: [w.sing1-gong3-gei1, w.lau4-tai1]
      - title: "鐵路博物館"
        es: ["香港鐵路博物館喺大埔墟。", "以前呢度係大埔墟火車站。", "你可以行上舊火車，坐喺入面影相。"]
        en: ["The Hong Kong Railway Museum is in Tai Po Market.", "It used to be Tai Po Market railway station.", "You can climb aboard the old trains and sit inside to take photos."]
        grammar: [g.compound-directionals]
        vocab: [w.tit3-lou6, w.daai6-bou3-heoi1]
    spicy:
      - { es: "你行過嚟啲啦，我又唔會咬你。", en: "Come over a bit closer, I'm not going to bite.", altEs: ["行過嚟啲啦，我唔會咬你㗎。"], grammar: [g.directional-complements], vocab: [w.gwo3-lai4] }
      - { es: "你一行入嚟，成間房都靜晒。", en: "The moment you walked in, the whole room went quiet.", altEs: ["你一行入嚟，成間房即刻靜晒。"], grammar: [g.compound-directionals, g.saai-all], vocab: [w.jap6-uk1], jp: "nei5 jat1 haang4 jap6 lai4 seng4 gaan1 fong2 dou1 zing6 saai3" }
      - { es: "你搬嚟大埔啦，我哋可以日日一齊踩單車。", en: "Move to Tai Po, then we can go cycling together every day.", altEs: ["不如你搬嚟大埔啦，我哋可以日日一齊踩單車。"], grammar: [g.directional-complements], vocab: [w.daai6-bou3] }
      - { es: "你喺樓下等等，我換好衫就落嚟。", en: "Wait downstairs, I'll come down as soon as I've changed.", altEs: ["你喺樓下等吓，我換好衫就落嚟。"], grammar: [g.directional-complements, g.jyun-hou], vocab: [w.lok6-lai4] }
      - { es: "唔好喺樓下嗌我個名喇，上嚟坐啦。", en: "Stop shouting my name from downstairs, come up and sit down.", altEs: ["唔好再喺樓下嗌我個名喇，上嚟坐啦。"], grammar: [g.compound-directionals, g.m-hou-dont], vocab: [w.soeng5-lai4], jp: "m4 hou2 hai2 lau4 haa6 aai3 ngo5 go3 meng2 laa3 soeng5 lai4 co5 laa1" }
  - id: b1.u02.l3
    title: 返屋企、好返晒
    teach: [g.faan-back]
    vocab: [w.faan1.b, w.faan1-heoi3, w.faan1-zyun3-tau4, w.bei2-faan1, w.hoi1-faan1, w.bun1-faan1, w.zoek3-faan1, w.jam2-faan1, w.gong2-faan1, w.hoeng3, w.ciu4, w.ho4.b, w.jyun4-zyu6, w.jat1-lou6, w.cyun1-gwo3, w.seoi6-dou6, w.tin1-kiu4, w.kiu4, w.laang5-can1, w.lo2]
    tip: "返 after a verb means 'back' (畀返 'give back'), 'again / resume' (講返 'get back to') or 'back to normal' (好返 'get better'). It comes right after the verb: 攞返本書."
    sentences:
      - { es: "你上個月借我嗰五百蚊，幾時畀返我呀？", en: "When are you giving me back the five hundred dollars I lent you last month?", altEs: ["上個月借你嗰五百蚊，你幾時畀返我呀？"], grammar: [g.faan-back, g.relative-classifier], vocab: [w.bei2-faan1] }
      - { es: "佢冷親咗成個禮拜，而家好返好多。", en: "She had a chill for a whole week, but she's much better now.", altEs: ["佢冷親咗一個禮拜，而家好返好多喇。"], altEn: ["He had a chill for a whole week, but he's much better now."], grammar: [g.faan-back], vocab: [w.hou2-faan1, w.laang5-can1],
          transform: { instruction: "Ask a friend if they're better yet", answer: "你好返未呀？", alt: ["你好返啲未呀？"], en: "Are you better yet?" } }
      - { es: "收工之後，我哋去大埔墟飲返杯啦。", en: "After work, let's go and have a drink in Tai Po Market.", altEs: ["收工我哋去大埔墟飲返杯啦。"], grammar: [g.faan-back, g.laa1-suggestion], vocab: [w.jam2-faan1], jp: "sau1 gung1 zi1 hau6 ngo5 dei6 heoi3 daai6 bou3 heoi1 jam2 faan1 bui1 laa1" }
      - { es: "間茶餐廳放咗一個月假，聽日開返。", en: "The cafe has been closed for a month and reopens tomorrow.", altEs: ["嗰間茶餐廳放咗成個月假，聽日開返。"], grammar: [g.faan-back], vocab: [w.hoi1-faan1, w.faan1.b],
          transform: { instruction: "Say it reopened yesterday", answer: "間茶餐廳尋日開返喇。", alt: ["間茶餐廳尋日已經開返。"], en: "The cafe reopened yesterday." } }
      - { es: "出面好凍，着返件褸先出去。", en: "It's cold outside, put your jacket back on before you go out.", altEs: ["出面凍，着返件褸先出去啦。"], grammar: [g.faan-back, g.sin-zoi-sequence], vocab: [w.zoek3-faan1] }
      - { es: "唔該畀返張單我。", en: "Please give me back the receipt.", altEs: ["唔該你畀返張單我。", "唔該畀返張收據我。"], grammar: [g.faan-back, g.bei-give], vocab: [w.bei2-faan1],
          error: { wrong: "唔該畀張單返我。", explain: "返 goes right after the verb, before the object: 畀返張單我.", grammar: g.faan-back } }
      - { es: "我唔記得帶銀包，要返去攞。", en: "I forgot my wallet, I have to go back and get it.", altEs: ["我唔記得帶銀包，要返去攞返。"], grammar: [g.faan-back], vocab: [w.faan1-heoi3] }
      - { es: "行錯路喇，我哋返轉頭啦。", en: "We've gone the wrong way, let's turn back.", altEs: ["我哋行錯路喇，返轉頭啦。"], grammar: [g.laa1-suggestion], vocab: [w.faan1-zyun3-tau4] }
      - { es: "沿住林村河一路行，就會行到大埔墟火車站。", en: "Follow the Lam Tsuen River all the way and you'll reach Tai Po Market station.", altEs: ["沿住林村河一直行，就會行到大埔墟火車站。"], grammar: [g.jyu-gwo-zau], vocab: [w.jyun4-zyu6, w.jat1-lou6, w.ho4.b] }
      - { es: "穿過條隧道，再過條橋就到。", en: "Go through the tunnel, cross the bridge and you're there.", altEs: ["穿過隧道，再過條橋就到喇。"], grammar: [g.sin-zoi-sequence], vocab: [w.cyun1-gwo3, w.seoi6-dou6, w.kiu4] }
      - { es: "你向前行，見到天橋就上去。", en: "Walk straight ahead, and when you see the footbridge, go up.", altEs: ["你一直向前行，見到天橋就上去。"], grammar: [g.asking-directions], vocab: [w.hoeng3, w.tin1-kiu4] }
      - { es: "我間房朝住海，日日都睇到日出。", en: "My room faces the sea, I can see the sunrise every day.", altEs: ["我間房向住海，日日都睇到日出。"], grammar: [g.zyu-continuous], vocab: [w.ciu4], jp: "ngo5 gaan1 fong2 ciu4 zyu6 hoi2 jat6 jat6 dou1 tai2 dou2 jat6 ceot1" }
      - { es: "傾咗咁耐，不如講返正經嘢啦。", en: "We've chatted for ages, let's get back to business.", altEs: ["傾咗咁耐，我哋講返正經嘢啦。"], grammar: [g.faan-back, g.bat-jyu-suggest], vocab: [w.gong2-faan1, w.zing3-ging1] }
      - { es: "佢喺英國讀完書，搬返香港住。", en: "After finishing her studies in the UK, she moved back to Hong Kong.", altEs: ["佢喺英國讀完書就搬返嚟香港住。"], altEn: ["He moved back to Hong Kong after studying in the UK."], grammar: [g.faan-back, g.jyun-hou], vocab: [w.bun1-faan1] }
      - { es: "睇完書記得放返落書架。", en: "When you've finished reading, remember to put the book back on the shelf.", altEs: ["睇完本書記得放返喺書架度。"], grammar: [g.faan-back, g.jyun-hou], vocab: [w.fong3-faan1, w.syu1-gaa2] }
    exchanges:
      - q: { es: "你而家好返未呀？", en: "Are you better now?" }
        a: { es: "好返好多喇，唔該晒。", en: "Much better, thanks a lot." }
        alt: ["仲未好返。", "好返晒喇。"]
        grammar: [g.faan-back, g.mei-questions]
        vocab: [w.hou2-faan1]
      - q: { es: "間茶餐廳幾時開返呀？", en: "When does the cafe reopen?" }
        a: { es: "聽日開返，佢哋放咗成個月假。", en: "Tomorrow, they've been closed for a whole month." }
        alt: ["聽日開返。", "下個禮拜先開返。"]
        grammar: [g.faan-back]
        vocab: [w.hoi1-faan1]
      - q: { es: "火車站點去呀？", en: "How do I get to the station?" }
        a: { es: "沿住條河一路行，見到天橋就上去。", en: "Follow the river all the way, and when you see the footbridge, go up." }
        alt: ["一直行，過咗橋就到。", "穿過隧道就到。"]
        grammar: [g.asking-directions]
        vocab: [w.jyun4-zyu6, w.tin1-kiu4]
      - q: { es: "你幾時畀返本書我呀？", en: "When are you giving me my book back?" }
        a: { es: "我睇完就畀返你。", en: "I'll give it back as soon as I've finished it." }
        alt: ["聽日畀返你。", "睇完就還返畀你。"]
        grammar: [g.faan-back, g.jyun-hou]
        vocab: [w.bei2-faan1]
      - q: { es: "我哋係咪行錯咗路呀？", en: "Have we gone the wrong way?" }
        a: { es: "好似係，不如返轉頭啦。", en: "Looks like it, let's turn back." }
        alt: ["冇錯，一直行就到。", "係呀，返轉頭啦。"]
        grammar: [g.bat-jyu-suggest]
        vocab: [w.faan1-zyun3-tau4]
    texts:
      - title: "留言"
        es: ["我出咗去，十點前返嚟。", "你攞返本書，就放喺枱面啦。", "記得閂埋門。"]
        en: ["I've gone out, I'll be back before ten.", "When you've picked up your book, just leave it on the table.", "Remember to shut the door."]
        grammar: [g.faan-back]
        vocab: [w.lo2-faan1]
      - title: "大埔墟散步"
        es: ["由大埔墟火車站行出嚟，沿住林村河一路行。", "穿過公園，再過一條橋。", "行到海邊，休息吓先返去。"]
        en: ["Walk out of Tai Po Market station and follow the Lam Tsuen River all the way.", "Go through the park and cross a bridge.", "When you reach the sea, have a rest before you head back."]
        grammar: [g.compound-directionals, g.faan-back]
        vocab: [w.jyun4-zyu6, w.kiu4, w.faan1-heoi3]
    spicy:
      - { es: "你唔使畀返件褸我，下次着住佢嚟見我就得。", en: "You don't need to give my jacket back, just wear it when you come to see me next time.", altEs: ["件褸唔使畀返我，下次着住佢嚟見我就得。"], grammar: [g.faan-back, g.zyu-continuous], vocab: [w.bei2-faan1] }
      - { es: "同你傾完偈，我個心情好返晒。", en: "After chatting with you, I'm in a good mood again.", altEs: ["同你傾完偈，我心情好返晒。"], grammar: [g.faan-back, g.saai-all], vocab: [w.hou2-faan1] }
      - { es: "我哋講返正經嘢：你幾時得閒同我食飯？", en: "Back to serious business: when are you free to have dinner with me?", altEs: ["講返正經嘢：你幾時得閒同我食飯呀？"], grammar: [g.faan-back], vocab: [w.gong2-faan1] }
      - { es: "你返轉頭望我嗰陣，我就知道你都鍾意我。", en: "When you turned round to look at me, I knew you liked me too.", altEs: ["你返轉頭望我，我就知你都鍾意我。"], grammar: [g.ge-si-hau], vocab: [w.faan1-zyun3-tau4] }
      - { es: "收工飲返杯啦，飲完我送你返屋企。", en: "Let's have a drink after work, and afterwards I'll take you home.", altEs: ["放工飲返杯啦，飲完我送你返屋企。"], grammar: [g.faan-back, g.jyun-hou], vocab: [w.jam2-faan1], jp: "sau1 gung1 jam2 faan1 bui1 laa1 jam2 jyun4 ngo5 sung3 nei5 faan1 uk1 kei2" }
  - id: b1.u02.l4
    title: 我都去埋
    teach: [g.maai-closer]
    vocab: [w.maai4, w.maai4.b, w.haang4-maai4, w.lin4-maai4, w.si1-zi2-saan1, w.si1-zi2-saan1-haa6, w.ging2-sik1, w.buk6-bou3, w.kai1, w.wu4.b, w.sek6-tau4, w.sek6, w.sam1-lam4, w.jing4-dei6, w.jing4, w.bui3-nong4, w.seoi2-zeon1, w.je6-ging2, w.dai2.b, w.cai4, w.gaa1-zeon3, w.wing6-si1, w.gwai6-tung2]
    tip: "埋 after a verb: 'closer' (行埋嚟), 'as well, along too' (我都去埋, often with 都), 'finish off' (食埋佢) or 'closed' (閂埋門). 連埋 = including."
    sentences:
      - { es: "企埋啲啦，我影唔晒你哋。", en: "Stand a bit closer, I can't get you all in the picture.", altEs: ["企埋啲，我影唔晒你哋。", "行埋啲啦，我影唔晒你哋。"], grammar: [g.maai-closer, g.potential-resultatives], vocab: [w.maai4] }
      - { es: "你哋去獅子山呀？我都想去埋。", en: "You're going to Lion Rock? I'd like to come along too.", altEs: ["你哋去獅子山呀？我都去埋。"], grammar: [g.maai-closer, g.dou-also], vocab: [w.si1-zi2-saan1, w.maai4],
          transform: { instruction: "Say your older sister wants to come too", answer: "我家姐都想去埋。", alt: ["我家姐都想一齊去。"], en: "My sister wants to come along too." },
          error: { wrong: "你哋去獅子山呀？我埋都想去。", explain: "埋 'as well' goes after the verb; 都 goes before it: 我都想去埋.", grammar: g.maai-closer } }
      - { es: "叫埋你細佬一齊嚟行山啦。", en: "Bring your little brother along hiking too.", altEs: ["叫埋你細佬嚟行山啦。"], grammar: [g.maai-closer], vocab: [w.maai4],
          transform: { instruction: "Invite their girlfriend along instead", answer: "叫埋你女朋友一齊嚟行山啦。", alt: ["叫埋你女朋友嚟行山啦。"], en: "Bring your girlfriend along hiking too." } }
      - { es: "連埋我，一共六個人。", en: "Including me, there are six of us.", altEs: ["連埋我一共六個人。", "連我在內一共六個人。"], grammar: [g.maai-closer], vocab: [w.lin4-maai4] }
      - { es: "出門之前記得閂埋窗同熄燈。", en: "Remember to shut the windows and turn off the lights before you go out.", altEs: ["出門前記得閂埋窗同熄燈。"], grammar: [g.maai-closer, g.ji-cin-ji-hau], vocab: [w.maai4] }
      - { es: "獅子山下呢首歌，好多香港人都識唱。", en: "Lots of Hong Kong people can sing the song 'Below the Lion Rock'.", altEs: ["好多香港人都識唱獅子山下呢首歌。"], grammar: [g.sik-know-how], vocab: [w.si1-zi2-saan1-haa6] }
      - { es: "由獅子山頂望落去，成個九龍都睇到。", en: "Looking down from the top of Lion Rock, you can see the whole of Kowloon.", altEs: ["喺獅子山頂望落去，成個九龍都睇得到。"], grammar: [g.compound-directionals], vocab: [w.si1-zi2-saan1], jp: "jau4 si1 zi2 saan1 deng2 mong6 lok6 heoi3 seng4 go3 gau2 lung4 dou1 tai2 dou2" }
      - { es: "呢度有條溪，沿住佢行就見到個瀑布。", en: "There's a stream here; follow it and you'll see the waterfall.", altEs: ["呢度有條溪，跟住佢行就會見到個瀑布。"], grammar: [g.jyu-gwo-zau], vocab: [w.kai1, w.buk6-bou3] }
      - { es: "湖邊有好多大石，我哋坐喺度食飯啦。", en: "There are lots of big rocks by the lake, let's sit here and eat.", altEs: ["湖邊有好多大石頭，我哋坐喺度食飯啦。"], grammar: [g.jau-have], vocab: [w.wu4.b, w.sek6] }
      - { es: "森林入面好靜，淨係聽到雀仔叫。", en: "It's very quiet in the forest, all you can hear is birds singing.", altEs: ["森林裡面好靜，淨係聽到雀仔叫。"], grammar: [g.zing-hai-only], vocab: [w.sam1-lam4, w.zoek3-zai2] }
      - { es: "我哋今晚喺營地搭營，聽朝先行埋去山頂。", en: "Tonight we'll pitch the tent at the campsite, and tomorrow morning we'll finish the walk to the top.", altEs: ["今晚我哋喺營地搭營，聽朝先行上山頂。"], grammar: [g.maai-closer, g.sin-final], vocab: [w.jing4-dei6, w.jing4], jp: "ngo5 dei6 gam1 maan5 hai2 jing4 dei6 daap3 jing4 ting1 ziu1 sin1 haang4 maai4 heoi3 saan1 deng2" }
      - { es: "地圖同水樽放咗入背囊，你帶埋手機未呀？", en: "The map and water bottle are in the backpack; have you brought your phone too?", altEs: ["地圖同水樽喺背囊度，你帶埋手機未呀？"], grammar: [g.maai-closer, g.mei-questions], vocab: [w.bui3-nong4, w.seoi2-zeon1] }
      - { es: "晚黑喺獅子山睇九龍嘅夜景，真係好靚。", en: "The night view of Kowloon from Lion Rock is really beautiful.", altEs: ["夜晚喺獅子山睇九龍嘅夜景，真係好靚。"], grammar: [g.adj-ge-noun], vocab: [w.je6-ging2] }
      - { es: "你個水樽喺背囊最底。", en: "Your water bottle is at the very bottom of the backpack.", altEs: ["你個水樽喺背囊嘅最底。"], grammar: [g.hai2-location], vocab: [w.dai2.b, w.seoi2-zeon1] }
      - { es: "細佬收埋咗啲朱古力喺櫃桶度。", en: "My little brother has hidden the chocolate in the drawer.", altEs: ["細佬將啲朱古力收埋咗喺櫃桶度。"], grammar: [g.maai-closer], vocab: [w.sau1-maai4, w.gwai6-tung2] }
      - { es: "河邊有隻狗行埋嚟，好得意。", en: "A dog came over to us by the river, it was so cute.", altEs: ["喺河邊有隻狗行埋嚟，好得意。"], grammar: [g.maai-closer, g.jau-jan-someone], vocab: [w.haang4-maai4, w.maai4.b] }
    exchanges:
      - q: { es: "我哋聽日去行獅子山，你去唔去呀？", en: "We're hiking Lion Rock tomorrow, are you coming?" }
        a: { es: "去！叫埋我家姐得唔得？", en: "Yes! Can I bring my sister along too?" }
        alt: ["去，我都去埋。", "唔去喇，我要返工。"]
        grammar: [g.maai-closer, g.a-not-a-questions]
        vocab: [w.si1-zi2-saan1, w.maai4]
      - q: { es: "你帶齊嘢未呀？", en: "Have you got everything?" }
        a: { es: "帶齊喇，水樽、地圖、電話都放咗入背囊。", en: "Yes, the water bottle, map and phone are all in the backpack." }
        alt: ["帶齊喇。", "仲未，等我拎埋水樽。"]
        grammar: [g.mei-questions]
        vocab: [w.cai4, w.bui3-nong4]
      - q: { es: "一共幾多個人呀？", en: "How many people altogether?" }
        a: { es: "連埋我，一共八個。", en: "Eight, including me." }
        alt: ["八個。", "連埋你一共八個人。"]
        grammar: [g.maai-closer, g.gei-how-many]
        vocab: [w.lin4-maai4]
      - q: { es: "個瀑布喺邊度呀？", en: "Where's the waterfall?" }
        a: { es: "沿住條溪行十分鐘就到。", en: "Follow the stream for ten minutes and you're there." }
        alt: ["前面就係。", "沿住條溪一路行。"]
        grammar: [g.asking-directions]
        vocab: [w.buk6-bou3, w.kai1]
      - q: { es: "你哋今晚瞓邊度呀？", en: "Where are you sleeping tonight?" }
        a: { es: "瞓營，個營地喺湖邊。", en: "In a tent, the campsite is by the lake." }
        alt: ["喺營地瞓。", "瞓營。"]
        grammar: [g.hai2-location]
        vocab: [w.jing4, w.jing4-dei6, w.wu4.b]
    texts:
      - title: "行山訊息"
        es: ["聽朝八點喺黃大仙站等。", "我哋行上獅子山，睇完景色先落山。", "想去嘅叫埋朋友，記得帶多啲水。"]
        en: ["Meet at Wong Tai Sin station at eight tomorrow morning.", "We'll walk up Lion Rock and come down after enjoying the view.", "If you want to come, bring your friends too, and remember to bring plenty of water."]
        grammar: [g.maai-closer]
        vocab: [w.si1-zi2-saan1, w.maai4]
      - title: "露營"
        es: ["我哋喺湖邊搭營。", "晚黑大家坐埋一齊睇星。", "森林好靜，我好快就瞓着咗。"]
        en: ["We pitched our tent by the lake.", "In the evening we all sat close together and looked at the stars.", "The forest was so quiet I fell asleep very quickly."]
        grammar: [g.maai-closer]
        vocab: [w.jing4, w.sam1-lam4]
    spicy:
      - { es: "行埋啲啦，山頂咁凍，兩個人企埋一齊暖啲。", en: "Come closer, it's so cold at the top, two people standing together are warmer.", altEs: ["企埋啲啦，山頂咁凍，兩個人企埋一齊會暖啲。"], grammar: [g.maai-closer], vocab: [w.haang4-maai4] }
      - { es: "你去邊度，我都跟埋去。", en: "Wherever you go, I'll tag along.", altEs: ["你去邊我都跟埋去。"], grammar: [g.maai-closer], vocab: [w.maai4] }
      - { es: "你食晒啲朱古力，連埋我嗰份都冇放過！", en: "You ate all the chocolate, you didn't even spare my share!", altEs: ["你食晒啲朱古力，連我嗰份都冇放過！"], grammar: [g.maai-closer, g.saai-all], vocab: [w.lin4-maai4] }
      - { es: "我收埋咗你封信，每晚都攞出嚟睇吓。", en: "I've hidden your letter away, and every night I take it out and read it.", altEs: ["你封信我收埋咗，每晚都攞出嚟睇吓。"], grammar: [g.maai-closer, g.compound-directionals], vocab: [w.sau1-maai4] }
      - { es: "營入面得一張被，我哋要瞓埋啲喇。", en: "There's only one blanket in the tent, we'll have to sleep a bit closer.", altEs: ["個營得一張被，我哋要瞓埋啲喇。"], grammar: [g.maai-closer], vocab: [w.jing4, w.pei5], jp: "jing4 jap6 min6 dak1 jat1 zoeng1 pei5 ngo5 dei6 jiu3 fan3 maai4 di1 laa3" }
dialogues:
  - id: b1.u02.d1
    title: 行上大帽山
    context: Ka-chun and Wing-si are hiking up Tai Mo Shan from Lam Tsuen in Tai Po, past the waterfalls.
    lines:
      - { speaker: 家俊, es: "詠詩，行快啲啦！我哋要喺日落之前行上大帽山。", en: "Wing-si, walk faster! We need to get up Tai Mo Shan before sunset." }
      - { speaker: 詠詩, es: "條山路咁斜，我行唔郁喇。我想坐低休息吓。", en: "The trail is so steep, I can't go on. I want to sit down and rest." }
      - { speaker: 家俊, es: "好啦，坐低飲啲水先。你帶埋水樽未呀？", en: "OK, sit down and have some water first. Did you bring your water bottle?" }
      - { speaker: 詠詩, es: "帶咗，不過頭先喺瀑布嗰度飲晒喇。", en: "I did, but I drank it all back at the waterfall." }
      - { speaker: 家俊, es: "唔緊要，飲我嘅啦。你睇吓，下面條溪幾靚。", en: "Never mind, have some of mine. Look how pretty the stream is down there." }
      - { speaker: 詠詩, es: "嘩，由呢度望落去，連埋大埔都睇到！", en: "Wow, looking down from here, you can even see Tai Po!" }
      - { speaker: 家俊, es: "上到山頂仲靚，好彩嘅話仲有雲海添。", en: "It's even better at the top, and if we're lucky there'll be a sea of clouds too." }
      - { speaker: 詠詩, es: "噉我哋行上去啦。不過落山嗰陣，你要拖住我。", en: "Then let's go up. But on the way down, you have to hold my hand." }
      - { speaker: 家俊, es: "冇問題。天黑之前一定要落到山腳。", en: "No problem. We must be back at the foot of the mountain before dark." }
    questions:
      - { q: "點解詠詩想坐低？", options: ["佢肚餓", "條山路好斜，佢行唔郁", "佢想影相"], answer: 1, explain: "條山路咁斜，我行唔郁喇: the path is too steep for her." }
      - { q: "詠詩啲水去咗邊？", options: ["喺瀑布嗰度飲晒", "唔記得帶", "畀咗家俊"], answer: 0, explain: "頭先喺瀑布嗰度飲晒喇: she drank it all at the waterfall." }
      - { q: "由佢哋休息嗰度望落去，可以睇到乜嘢？", options: ["雲海", "大埔", "日出"], answer: 1, explain: "連埋大埔都睇到: they can even see Tai Po. The sea of clouds might be at the top." }
      - { q: "佢哋要喺幾時之前返到山腳？", options: ["食晏之前", "天黑之前", "日出之前"], answer: 1, explain: "天黑之前一定要返到山腳: before dark." }
writing:
  - task: "Write a short account of your sunrise hike up Tai Mo Shan: walking up, sitting down at the top and coming back down."
    min: 50
    max: 100
    use: [w.saan1-goek3, w.ce4, w.jat6-ceot1, w.wan4-hoi2, w.co5-dai1]
    useAtLeast: 3
    grammar: [g.compound-directionals, g.directional-complements]
    expect:
      - { pattern: "(行|爬|跑)(上|落)", hint: "Describe the movement: 行上山, 行落嚟." }
      - { pattern: "(上|落|出|入|過|起)(嚟|去)", hint: "Add a direction: 上去, 落嚟, 出嚟…" }
    model: { es: "我哋朝早四點喺大帽山山腳開始行上山。山路好斜，我行到好攰。到咗山頂，我哋坐低睇日出，仲見到雲海，好靚！之後我哋慢慢行落嚟。", en: "We started walking up Tai Mo Shan from the foot of the mountain at four in the morning. The path was steep and I got very tired. At the top we sat down to watch the sunrise and even saw a sea of clouds. Beautiful! Then we slowly walked back down." }
  - task: "You're moving into an old tenement flat with no lift. Tell your friends where to carry things, using directional complements."
    min: 40
    max: 90
    use: [w.dung6, w.tong4-lau2, w.sing1-gong3-gei1, w.bun1-soeng5-heoi3, w.zi2-pei4-soeng1]
    useAtLeast: 3
    grammar: [g.directional-complements]
    expect:
      - { pattern: "(上|落|過|入|出)(嚟|去)", hint: "Say which way: 搬上去, 拎過嚟…" }
    model: { es: "呢棟唐樓冇升降機，要行樓梯。唔該你哋幫手，啲紙皮箱搬上去五樓，張櫈拎過嚟呢度。我喺天台等你哋。", en: "This tenement building has no lift, so we have to take the stairs. Please help: carry the cardboard boxes up to the fifth floor and bring the stool over here. I'll wait for you on the rooftop." }
  - task: "Your friend forgot their jacket at your flat. Text them about getting it back, using 返."
    min: 40
    max: 80
    use: [w.bei2-faan1, w.zoek3-faan1, w.lo2, w.faan1-lai4]
    useAtLeast: 3
    grammar: [g.faan-back]
    expect:
      - { pattern: "返", hint: "Use 返 for 'back': 畀返你, 返嚟攞, 着返." }
    model: { es: "你唔記得咗件外套喺我屋企呀！我聽日返工嘅時候畀返你。如果今晚好凍，你可以而家返嚟攞，着返先走。", en: "You forgot your jacket at my place! I'll give it back to you tomorrow on my way to work. If it's cold tonight, you can come back now to get it and put it on before you go." }
  - task: "Your friends are hiking Lion Rock tomorrow. Say you'll join them with 埋, and ask them to bring something for you too."
    es: "我哋聽日去行獅子山，你去唔去呀？"
    min: 40
    max: 80
    use: [w.maai4, w.lin4-maai4, w.je6-ging2, w.seoi2-zeon1]
    useAtLeast: 2
    grammar: [g.maai-closer]
    expect:
      - { pattern: "埋", hint: "Join in with verb + 埋: 我都去埋！" }
    model: { es: "好呀，我都去埋！我可以帶埋相機，影獅子山嘅夜景。你哋記得帶多啲水樽，連埋我嗰份，唔該晒！我哋幾點喺邊度等呀？", en: "Great, I'll come too! I can bring my camera as well to photograph the night view from Lion Rock. Remember to bring more water bottles, including one for me. Thanks! What time and where shall we meet?" }
