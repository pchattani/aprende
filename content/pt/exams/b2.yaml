title: Level check B2
passScore: 0.8
reading:
  text: |
    Quando Fernanda aceitou o cargo de diretora da colônia de pescadores da sua cidade natal, no litoral da Bahia, muitos acharam que ela tinha ficado louca. Fazia quinze anos que trabalhava em São Paulo, numa grande empresa, e tinha acabado de ser promovida. “Se tivessem me oferecido esse cargo aos trinta anos, eu teria recusado sem pensar duas vezes”, admite hoje. “Mas aos quarenta e cinco a gente se cansa de passar a vida no trânsito.”

    A colônia, fundada em 1978, tinha sido durante décadas o coração da cidade: dela viviam muitas famílias, além das lojas, dos bares e até da escola. Nos últimos anos, porém, vinha perdendo clientes e, por mais que os pescadores se esforçassem, a cada verão o dinheiro dava para menos. Quando Fernanda chegou, sobravam sessenta sócios, e todos davam como certo que a colônia fecharia em dois anos.

    A primeira coisa que ela fez foi ouvir. Durante um mês, não tomou nenhuma decisão; apenas conversou com cada pescador. “Os pescadores sabiam exatamente o que estava errado; o que acontece é que ninguém nunca tinha perguntado nada para eles”, explica. Depois, pôs em prática três mudanças: criou-se uma marca própria, investiu-se em barcos novos e passou-se a vender pela internet para restaurantes de Salvador e de São Paulo.

    É verdade que o primeiro ano foi muito duro e que ela própria quase desistiu. Hoje, no entanto, a colônia tem cem sócios e é considerada um exemplo de pesca sustentável no Nordeste. Fernanda, contudo, não aceita elogios. “Não fui eu que salvei a colônia, foram as pessoas que estavam nela havia trinta anos. Eu só ouvi o que elas diziam”, insiste. E acrescenta, rindo: “O que mudou mesmo é que agora eu vou para o trabalho a pé, olhando o mar.”
