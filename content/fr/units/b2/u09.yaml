id: b2.u09
title: "Cluny, l'abbaye qui régnait sur l'Europe"
lessons:
  - id: b2.u09.l1
    title: Bien qu'elle soit en ruines
    teach: [g.concession]
    vocab: [w.abbatial, w.monastère, w.monastique, w.abbé, w.chrétien, w.chrétienté, w.moyen-âge, w.médiéval, w.réseau, w.diriger, w.détruire, w.destruction, w.reconstruire, w.reconstruction, w.édifice, w.nef, w.clocher, w.vitrail, w.modeste, w.gigantesque, w.énorme, w.concession, w.concéder, w.admettre, w.tout-de-même, w.quand-même, w.néanmoins, w.en-dépit-de, w.certes, w.détour, w.rayonnement, w.rayonner, w.apogée, w.déclin, w.décliner, w.essor, w.ère, w.démolir, w.debout]
    tip: "Bien que and quoique take the subjonctif; même si takes the indicative; malgré and en dépit de take a noun; avoir beau + infinitive means 'however much…': J'ai beau chercher, je ne trouve pas."
    sentences:
      - { es: "Bien que l'abbaye ait été en grande partie détruite, elle attire des milliers de visiteurs chaque année.", en: "Although the abbey was largely destroyed, it attracts thousands of visitors every year.", altEs: ["Bien que l'abbaye ait été en grande partie détruite, elle attire chaque année des milliers de visiteurs.", "Même si l'abbaye a été en grande partie détruite, elle attire des milliers de visiteurs chaque année."], grammar: [g.concession, g.subjonctif-passe], vocab: [w.détruire, w.attirer] }
      - { es: "Malgré la taille modeste de la ville, l'abbaye de Cluny dirigeait un réseau de plus de mille monastères.", en: "Despite the town's modest size, the abbey of Cluny ran a network of more than a thousand monasteries.", altEs: ["En dépit de la taille modeste de la ville, l'abbaye de Cluny dirigeait un réseau de plus de mille monastères."], grammar: [g.concession], vocab: [w.modeste, w.diriger, w.réseau, w.monastère] }
      - { es: "Même si l'église est en ruines, on devine encore sa taille gigantesque.", en: "Even though the church is in ruins, you can still imagine its gigantic size.", altEs: ["Bien que l'église soit en ruines, on devine encore sa taille gigantesque."], grammar: [g.concession], vocab: [w.ruine, w.deviner, w.gigantesque] }
      - { es: "J'ai beau lire des livres d'histoire, j'oublie toujours en quelle année l'abbaye a été fondée.", en: "However many history books I read, I always forget what year the abbey was founded.", altEs: ["J'ai beau lire des livres d'histoire, j'oublie toujours l'année de fondation de l'abbaye."], grammar: [g.concession, g.indirect-questions], vocab: [w.oublier, w.fonder], note: "It was 910." }
      - { es: "Il ne reste presque rien de la grande nef ; pourtant, le clocher de l'Eau-Bénite impressionne toujours.", en: "Almost nothing is left of the great nave; yet the Holy Water bell tower is still impressive.", altEs: ["Il ne reste presque rien de la grande nef ; cependant, le clocher de l'Eau-Bénite impressionne toujours."], grammar: [g.concession], vocab: [w.nef, w.clocher, w.impressionner] }
      - { es: "Certes, il faut faire un détour, mais Cluny vaut vraiment le voyage.", en: "Admittedly you have to make a detour, but Cluny is really worth the trip.", altEs: ["Certes, c'est un détour, mais Cluny vaut vraiment le voyage."], grammar: [g.concession], vocab: [w.certes, w.détour, w.valoir] }
      - { es: "En dépit des destructions, la ville garde le souvenir de son rayonnement médiéval.", en: "Despite the destruction, the town keeps the memory of its medieval influence.", altEs: ["Malgré les destructions, la ville garde le souvenir de son rayonnement médiéval."], grammar: [g.concession], vocab: [w.en-dépit-de, w.destruction, w.rayonnement, w.médiéval] }
      - { es: "Quoiqu'une reconstruction complète soit impossible, des images en 3D montrent l'édifice tel qu'il était.", en: "Although a complete reconstruction is impossible, 3D images show the building as it was.", altEs: ["Bien qu'une reconstruction complète soit impossible, des images en 3D montrent l'édifice tel qu'il était."], grammar: [g.concession, g.subjonctif-conjonctions], vocab: [w.quoique, w.reconstruction, w.édifice] }
      - { es: "À son apogée, au XIIe siècle, Cluny rayonnait sur toute la chrétienté ; son déclin était néanmoins proche.", en: "At its peak, in the 12th century, Cluny shone over the whole of Christendom; its decline was nevertheless near.", altEs: ["À son apogée, au XIIe siècle, Cluny rayonnait sur toute la chrétienté ; néanmoins, son déclin était proche."], grammar: [g.concession, g.imparfait-uses], vocab: [w.apogée, w.rayonner, w.chrétienté, w.déclin, w.néanmoins] }
      - { es: "Tout puissant qu'il était, l'ordre de Cluny a connu un long déclin.", en: "Powerful as it was, the order of Cluny went through a long decline.", altEs: ["Bien qu'il ait été très puissant, l'ordre de Cluny a connu un long déclin."], grammar: [g.concession], vocab: [w.puissant, w.déclin] }
      - { es: "Je dois admettre que ces vitraux modernes sont réussis, même si je préfère l'art médiéval.", en: "I have to admit these modern stained-glass windows work well, even if I prefer medieval art.", altEs: ["J'avoue que ces vitraux modernes sont réussis, même si je préfère l'art médiéval."], grammar: [g.concession], vocab: [w.admettre, w.vitrail, w.réussir] }
      - { es: "L'abbaye est en ruines, mais elle impressionne encore.", en: "The abbey is in ruins, but it is still impressive.", grammar: [g.concession], vocab: [w.ruine], transform: { instruction: "Rewrite with bien que", answer: "Bien que l'abbaye soit en ruines, elle impressionne encore.", alt: ["Bien qu'elle soit en ruines, l'abbaye impressionne encore."], en: "Although the abbey is in ruins, it is still impressive." } }
      - { es: "Il pleuvait, mais nous avons visité tout le site.", en: "It was raining, but we visited the whole site.", grammar: [g.concession], vocab: [w.site], transform: { instruction: "Rewrite with malgré + noun", answer: "Malgré la pluie, nous avons visité tout le site.", alt: ["En dépit de la pluie, nous avons visité tout le site."], en: "Despite the rain, we visited the whole site." } }
      - { es: "Nous cherchons l'entrée depuis une heure, mais nous ne la trouvons pas.", en: "We've been looking for the entrance for an hour, but we can't find it.", grammar: [g.concession], vocab: [w.entrée, w.chercher], transform: { instruction: "Rewrite with avoir beau", answer: "Nous avons beau chercher l'entrée, nous ne la trouvons pas.", alt: ["On a beau chercher l'entrée, on ne la trouve pas."], en: "However hard we look for the entrance, we can't find it." } }
      - { es: "Bien que le site soit fermé, on peut voir le clocher depuis la rue.", en: "Although the site is closed, you can see the bell tower from the street.", altEs: ["Même si le site est fermé, on peut voir le clocher depuis la rue."], grammar: [g.concession], vocab: [w.clocher, w.fermé], error: { wrong: "Bien que le site est fermé, on peut voir le clocher depuis la rue.", explain: "Bien que always takes the subjonctif: soit, not est.", grammar: g.concession } }
      - { es: "Même si l'abbaye a été démolie, son influence reste énorme.", en: "Even though the abbey was demolished, its influence remains enormous.", altEs: ["Bien que l'abbaye ait été démolie, son influence reste énorme."], grammar: [g.concession], vocab: [w.démolir, w.influence, w.énorme], error: { wrong: "Même si l'abbaye ait été démolie, son influence reste énorme.", explain: "Même si takes the indicative (a été), never the subjonctif.", grammar: g.concession } }
    exchanges:
      - q: { es: "Ça vaut la peine d'aller à Cluny ? Il ne reste presque rien.", en: "Is it worth going to Cluny? There's almost nothing left." }
        a: { es: "Oui, ça vaut quand même le détour : même en ruines, l'abbaye impressionne.", en: "Yes, it's still worth the detour: even in ruins, the abbey is impressive." }
        alt: ["Oui, ça vaut le détour malgré tout.", "Certes, il reste peu de choses, mais ça vaut le détour."]
        grammar: [g.concession]
        vocab: [w.détour, w.quand-même]
      - q: { es: "Pourquoi l'abbaye est-elle si célèbre ?", en: "Why is the abbey so famous?" }
        a: { es: "Bien que Cluny soit une petite ville, son abbaye a dirigé un immense réseau au Moyen Âge.", en: "Although Cluny is a small town, its abbey ran a huge network in the Middle Ages." }
        alt: ["Parce qu'au Moyen Âge, elle dirigeait un immense réseau de monastères.", "Malgré sa petite taille, elle a dominé l'Europe chrétienne."]
        grammar: [g.concession]
        vocab: [w.moyen-âge, w.réseau]
      - q: { es: "Il a plu pendant toute la visite ?", en: "Did it rain throughout the visit?" }
        a: { es: "Oui, mais malgré la pluie, on a tout vu.", en: "Yes, but despite the rain, we saw everything." }
        alt: ["Oui, mais on a tout visité quand même.", "Oui, néanmoins on a tout vu."]
        grammar: [g.concession]
        vocab: [w.quand-même]
      - q: { es: "Tu es d'accord avec le guide ?", en: "Do you agree with the guide?" }
        a: { es: "Je concède qu'il connaît son sujet ; néanmoins, il parlait beaucoup trop vite.", en: "I grant you he knows his subject; nevertheless, he spoke far too fast." }
        alt: ["Plus ou moins.", "Certes, il connaît son sujet, mais il parlait trop vite."]
        grammar: [g.concession]
        vocab: [w.concéder, w.néanmoins]
      - q: { es: "Tu as compris l'histoire des trois églises successives ?", en: "Did you understand the story of the three successive churches?" }
        a: { es: "J'ai beau écouter, je mélange toujours Cluny II et Cluny III.", en: "However hard I listen, I always mix up Cluny II and Cluny III." }
        alt: ["Pas vraiment, malgré les explications.", "Oui, enfin, à peu près."]
        grammar: [g.concession]
        vocab: [w.mélanger]
    texts:
      - title: "Dépliant touristique"
        es: ["Fondée en 910, l'abbaye de Cluny a été l'un des plus grands centres de la chrétienté.", "Bien qu'elle ait été démolie au XIXe siècle, ses vestiges restent impressionnants.", "En dépit des destructions, le clocher de l'Eau-Bénite est toujours debout."]
        en: ["Founded in 910, the abbey of Cluny was one of the greatest centres of Christendom.", "Although it was demolished in the 19th century, its remains are still impressive.", "Despite the destruction, the Holy Water bell tower is still standing."]
        grammar: [g.concession]
        vocab: [w.chrétienté, w.démolir, w.vestige, w.clocher]
      - title: "Note d'un visiteur"
        es: ["Certes, il faut beaucoup d'imagination.", "Il ne reste qu'une petite partie de l'église abbatiale, mais on mesure quand même son essor.", "J'ai beau être sceptique, je suis reparti impressionné."]
        en: ["Admittedly you need a lot of imagination.", "Only a small part of the abbey church is left, but you can still grasp how it flourished.", "Sceptical as I am, I left impressed."]
        grammar: [g.concession]
        vocab: [w.abbatial, w.essor]
    spicy:
      - { es: "Bien que tu ronfles comme un moine, je dors très bien à côté de toi.", en: "Although you snore like a monk, I sleep very well next to you.", altEs: ["Même si tu ronfles comme un moine, je dors très bien à côté de toi."], grammar: [g.concession], vocab: [w.moine] }
      - { es: "J'ai beau faire semblant de regarder les vitraux, je ne regarde que toi.", en: "However much I pretend to look at the stained glass, I'm only looking at you.", altEs: ["J'ai beau faire semblant d'admirer les vitraux, je ne regarde que toi."], grammar: [g.concession], vocab: [w.vitrail] }
      - { es: "Certes, je suis arrivée en retard, mais avoue que ça valait le détour.", en: "Admittedly I was late, but admit it was worth the wait.", altEs: ["Certes, je suis arrivé en retard, mais avoue que ça valait le détour."], grammar: [g.concession], vocab: [w.certes, w.détour] }
      - { es: "Même si tu n'es pas mon genre, j'accepte un deuxième café… par politesse, évidemment.", en: "Even though you're not my type, I'll accept a second coffee… out of politeness, obviously.", altEs: ["Bien que tu ne sois pas mon genre, j'accepte un deuxième café… par politesse, évidemment."], grammar: [g.concession], vocab: [] }
      - { es: "Malgré mes résolutions, je t'ai écrit à minuit ; néanmoins, je n'ai envoyé que trois messages.", en: "Despite my resolutions, I texted you at midnight; nevertheless, I only sent three messages.", altEs: ["En dépit de mes résolutions, je t'ai écrit à minuit ; néanmoins, je n'ai envoyé que trois messages."], grammar: [g.concession], vocab: [w.néanmoins] }
  - id: b2.u09.l2
    title: Afin que rien ne se perde
    teach: [g.purpose-clauses]
    vocab: [w.restaurer, w.restauration, w.rénover, w.rénovation, w.préservation, w.maquette, w.manuscrit, w.copiste, w.enluminure, w.de-manière-à, w.dans-le-but-de, w.prière, w.réveiller, w.fatigue, w.mécène, w.mécénat, w.classer, w.monument-historique, w.budget, w.culture, w.héritage, w.civilisation, w.archéologue, w.archéologie, w.fouille, w.vestige, w.témoignage, w.historien, w.histoire-de-l-art, w.mener, w.amener, w.emmener, w.ramener, w.fondation, w.grandeur, w.roman.adj, w.recopier, w.dur]
    tip: "Same subject: pour / afin de + infinitive. Different subject: pour que / afin que + subjonctif. De peur que (ne) + subjonctif for what you want to avoid; de sorte que + subjonctif for purpose, + indicative for result."
    sentences:
      - { es: "Les moines se levaient en pleine nuit pour prier.", en: "The monks got up in the middle of the night to pray.", altEs: ["Les moines se levaient au milieu de la nuit pour prier."], grammar: [g.purpose-clauses, g.pronominal-verbs], vocab: [w.moine, w.prier] }
      - { es: "Les copistes recopiaient les manuscrits à la main afin de les conserver.", en: "The copyists copied out the manuscripts by hand in order to preserve them.", altEs: ["Les copistes recopiaient les manuscrits à la main pour les conserver."], grammar: [g.purpose-clauses], vocab: [w.copiste, w.manuscrit, w.conserver] }
      - { es: "On a construit une maquette afin que le public comprenne la taille de l'ancienne abbaye.", en: "A scale model was built so that the public could understand the size of the old abbey.", altEs: ["On a construit une maquette pour que le public comprenne la taille de l'ancienne abbaye."], grammar: [g.purpose-clauses, g.subjonctif-conjonctions], vocab: [w.maquette, w.public] }
      - { es: "Ils ont caché les manuscrits de peur qu'on ne les détruise.", en: "They hid the manuscripts for fear they would be destroyed.", altEs: ["Ils ont caché les manuscrits de peur qu'on les détruise.", "Ils ont caché les manuscrits de crainte qu'on ne les détruise."], grammar: [g.purpose-clauses, g.ne-expletif], vocab: [w.manuscrit, w.cacher, w.détruire] }
      - { es: "Mettez-vous ici, de sorte que tout le monde voie la maquette.", en: "Stand here, so that everyone can see the model.", altEs: ["Mettez-vous là, de sorte que tout le monde voie la maquette."], grammar: [g.purpose-clauses, g.imperative], vocab: [w.maquette] }
      - { es: "Le site a été classé monument historique en 1862 pour qu'il soit protégé.", en: "The site was listed as a historic monument in 1862 so that it would be protected.", altEs: ["Le site a été classé monument historique en 1862 afin qu'il soit protégé."], grammar: [g.purpose-clauses, g.passive-voice], vocab: [w.classer, w.monument-historique, w.protéger] }
      - { es: "Les archéologues fouillent le sol de manière à retrouver les fondations de l'église.", en: "The archaeologists are digging the ground so as to find the church's foundations.", altEs: ["Les archéologues fouillent le sol afin de retrouver les fondations de l'église."], grammar: [g.purpose-clauses], vocab: [w.archéologue, w.de-manière-à, w.fondation] }
      - { es: "Des mécènes ont financé la restauration dans le but de préserver ce témoignage du passé.", en: "Patrons funded the restoration with the aim of preserving this testimony to the past.", altEs: ["Des mécènes ont financé la restauration afin de préserver ce témoignage du passé."], grammar: [g.purpose-clauses], vocab: [w.mécène, w.restauration, w.dans-le-but-de, w.témoignage] }
      - { es: "La ville rénove ses maisons romanes pour que le centre garde son caractère médiéval.", en: "The town is renovating its Romanesque houses so that the centre keeps its medieval character.", altEs: ["La ville rénove ses maisons romanes afin que le centre garde son caractère médiéval."], grammar: [g.purpose-clauses], vocab: [w.rénover, w.roman.adj] }
      - { es: "Les enluminures étaient peintes avec de l'or pour que les livres impressionnent les visiteurs.", en: "The illuminations were painted with gold so that the books would impress visitors.", altEs: ["Les enluminures étaient peintes à l'or afin que les livres impressionnent les visiteurs."], grammar: [g.purpose-clauses, g.passive-voice], vocab: [w.enluminure, w.or] }
      - { es: "J'emmène mes parents à Cluny dimanche pour qu'ils voient les vestiges de l'abbaye.", en: "I'm taking my parents to Cluny on Sunday so they can see the remains of the abbey.", altEs: ["J'emmène mes parents à Cluny dimanche afin qu'ils voient les vestiges de l'abbaye."], grammar: [g.purpose-clauses], vocab: [w.emmener, w.vestige] }
      - { es: "Ramène-moi une carte postale de la maquette, que je l'accroche au bureau !", en: "Bring me back a postcard of the model so I can put it up at the office!", altEs: ["Ramène-moi une carte postale de la maquette pour que je l'accroche au bureau !"], grammar: [g.purpose-clauses, g.imperative-with-pronouns], vocab: [w.ramener, w.accrocher], note: "Imperative + que + subjonctif is a spoken way to express purpose." }
      - { es: "Je t'écris. Je veux que tu saches la vérité sur la fouille.", en: "I'm writing to you. I want you to know the truth about the dig.", grammar: [g.purpose-clauses], vocab: [w.fouille, w.vérité], transform: { instruction: "Join with pour que", answer: "Je t'écris pour que tu saches la vérité sur la fouille.", alt: ["Je t'écris afin que tu saches la vérité sur la fouille."], en: "I'm writing so that you know the truth about the dig." } }
      - { es: "Elle part tôt. Elle veut éviter la foule devant l'abbaye.", en: "She's leaving early. She wants to avoid the crowd in front of the abbey.", grammar: [g.purpose-clauses], vocab: [w.éviter, w.foule], transform: { instruction: "Join with afin de + infinitive", answer: "Elle part tôt afin d'éviter la foule devant l'abbaye.", alt: ["Elle part tôt pour éviter la foule devant l'abbaye."], en: "She's leaving early to avoid the crowd in front of the abbey." } }
      - { es: "Je travaille dur pour réussir mon examen d'histoire de l'art.", en: "I'm working hard to pass my art history exam.", altEs: ["Je travaille dur afin de réussir mon examen d'histoire de l'art."], grammar: [g.purpose-clauses, g.pour-sans-infinitive], vocab: [w.histoire-de-l-art, w.réussir], error: { wrong: "Je travaille dur pour que je réussisse mon examen d'histoire de l'art.", explain: "Same subject in both clauses: use pour + infinitive, not pour que + subjonctif.", grammar: g.purpose-clauses } }
      - { es: "Ils ont restauré l'abbaye pour que les visiteurs puissent imaginer sa grandeur.", en: "They restored the abbey so that visitors could imagine its grandeur.", altEs: ["Ils ont restauré l'abbaye afin que les visiteurs puissent imaginer sa grandeur."], grammar: [g.purpose-clauses], vocab: [w.restaurer, w.grandeur], error: { wrong: "Ils ont restauré l'abbaye pour que les visiteurs peuvent imaginer sa grandeur.", explain: "Pour que takes the subjonctif: puissent, not peuvent.", grammar: g.purpose-clauses } }
    exchanges:
      - q: { es: "Pourquoi les moines copiaient-ils tous ces livres ?", en: "Why did the monks copy all those books?" }
        a: { es: "Afin de les conserver et pour que d'autres monastères puissent les lire.", en: "In order to preserve them and so that other monasteries could read them." }
        alt: ["Pour les conserver.", "Afin que le savoir ne se perde pas."]
        grammar: [g.purpose-clauses]
        vocab: [w.monastère, w.conserver]
      - q: { es: "À quoi sert cette maquette ?", en: "What is this model for?" }
        a: { es: "Elle sert à ce que les visiteurs imaginent l'abbaye entière, avant sa destruction.", en: "It's there so that visitors can picture the whole abbey, before it was destroyed." }
        alt: ["À montrer l'abbaye avant sa destruction.", "Pour qu'on imagine l'abbaye entière."]
        grammar: [g.purpose-clauses]
        vocab: [w.maquette, w.destruction]
      - q: { es: "Qui paie la restauration ?", en: "Who pays for the restoration?" }
        a: { es: "L'État et des mécènes, dans le but de préserver cet héritage européen.", en: "The State and private patrons, with the aim of preserving this European heritage." }
        alt: ["Surtout des mécènes.", "L'État, grâce au mécénat."]
        grammar: [g.purpose-clauses]
        vocab: [w.mécène, w.héritage]
      - q: { es: "Tu amènes qui à la visite ?", en: "Who are you bringing to the tour?" }
        a: { es: "J'amène mon cousin, pour qu'il découvre enfin l'archéologie.", en: "I'm bringing my cousin, so that he finally discovers archaeology." }
        alt: ["Mon cousin, il adore l'archéologie.", "Personne, j'y vais seule."]
        grammar: [g.purpose-clauses]
        vocab: [w.amener, w.archéologie]
      - q: { es: "Pourquoi tu parles si bas ?", en: "Why are you speaking so quietly?" }
        a: { es: "De peur qu'on ne m'entende : c'est l'heure de la prière.", en: "So that no one hears me: it's prayer time." }
        alt: ["Pour ne déranger personne.", "Pour ne pas réveiller les autres."]
        grammar: [g.purpose-clauses, g.ne-expletif]
        vocab: [w.prière]
    texts:
      - title: "Appel aux dons"
        es: ["Aidez-nous à restaurer le clocher, afin que les générations futures puissent l'admirer.", "Chaque don compte pour que ce chantier avance.", "Le mécénat des entreprises est aussi le bienvenu."]
        en: ["Help us restore the bell tower, so that future generations can admire it.", "Every donation counts in moving this project forward.", "Corporate sponsorship is also welcome."]
        grammar: [g.purpose-clauses]
        vocab: [w.restaurer, w.don, w.mécénat]
      - title: "Programme de l'historien"
        es: ["Ce livre a été écrit dans le but de raconter la civilisation clunisienne.", "L'auteur mène le lecteur à travers dix siècles de culture.", "Il rédige chaque chapitre de manière à être compris de tous."]
        en: ["This book was written with the aim of telling the story of Cluniac civilisation.", "The author leads the reader through ten centuries of culture.", "He writes each chapter so as to be understood by everyone."]
        grammar: [g.purpose-clauses]
        vocab: [w.civilisation, w.mener, w.culture, w.de-manière-à]
    spicy:
      - { es: "Je me suis assise au premier rang pour que le guide me remarque ; il ne regardait que la maquette.", en: "I sat in the front row so that the guide would notice me; he only looked at the model.", altEs: ["Je me suis assise au premier rang afin que le guide me remarque ; il ne regardait que la maquette."], grammar: [g.purpose-clauses], vocab: [w.maquette, w.remarquer] }
      - { es: "Je t'emmène dîner afin que tu oublies la fatigue de la semaine… et peut-être ton ex.", en: "I'm taking you to dinner so you forget the week's tiredness… and maybe your ex.", altEs: ["Je t'emmène dîner pour que tu oublies la fatigue de la semaine… et peut-être ton ex."], grammar: [g.purpose-clauses], vocab: [w.emmener, w.fatigue] }
      - { es: "Il a appris l'histoire de l'art dans le seul but d'impressionner la guide.", en: "He learned art history with the sole aim of impressing the guide.", altEs: ["Il a appris l'histoire de l'art dans l'unique but d'impressionner la guide."], grammar: [g.purpose-clauses], vocab: [w.histoire-de-l-art, w.impressionner] }
      - { es: "Viens près de moi, que je te montre un vitrail… le prétexte n'est pas très original, je sais.", en: "Come closer so I can show you a stained-glass window… not a very original excuse, I know.", altEs: ["Approche, que je te montre un vitrail… le prétexte n'est pas très original, je sais."], grammar: [g.purpose-clauses], vocab: [w.vitrail, w.prétexte] }
      - { es: "Je parle doucement de peur de réveiller le moine en toi.", en: "I'm speaking softly for fear of waking the monk in you.", altEs: ["Je parle tout bas de peur de réveiller le moine qui sommeille en toi."], grammar: [g.purpose-clauses], vocab: [w.réveiller, w.moine] }
  - id: b2.u09.l3
    title: Étant donné qu'elle a été vendue
    teach: [g.cause-advanced]
    vocab: [w.étant-donné-que, w.vu-que, w.du-fait-de, w.en-raison-de, w.faute-de, w.sous-prétexte-que, w.prétexte, w.moyen, w.moyen.adj, w.moyenne, w.crise, w.chômeur, w.pauvreté, w.richesse, w.inégalité, w.sans-abri, w.jeunesse, w.vieillesse, w.personne-âgée, w.âgé, w.handicapé, w.intégration, w.racisme, w.égalité, w.violence, w.sécurité, w.pouvoir.n, w.autorité, w.influence, w.influencer, w.influent, w.à-force-de, w.foyer, w.lutter, w.population]
    tip: "Étant donné que / vu que + clause (a known fact); vu / étant donné + noun; en raison de / du fait de + noun (formal); faute de + noun (for lack of); sous prétexte que when you doubt the reason; à force de for repeated effort."
    sentences:
      - { es: "Étant donné que l'abbaye a été vendue en 1798, il en reste très peu de chose.", en: "Given that the abbey was sold in 1798, very little of it remains.", altEs: ["Vu que l'abbaye a été vendue en 1798, il en reste très peu de chose."], grammar: [g.cause-advanced, g.pronoun-en], vocab: [w.étant-donné-que, w.vendre], note: "After the Revolution it was sold and largely used as a stone quarry." }
      - { es: "Le site est fermé en raison des travaux de restauration.", en: "The site is closed due to restoration work.", altEs: ["Le site est fermé du fait des travaux de restauration."], grammar: [g.cause-advanced], vocab: [w.en-raison-de, w.travaux, w.restauration] }
      - { es: "Faute de moyens, la restauration du clocher a pris des années.", en: "For lack of funds, the restoration of the bell tower took years.", altEs: ["Faute d'argent, la restauration du clocher a pris des années."], grammar: [g.cause-advanced], vocab: [w.faute-de, w.moyen, w.clocher] }
      - { es: "Il n'est pas venu à la visite, sous prétexte qu'il était malade.", en: "He didn't come on the tour, supposedly because he was ill.", altEs: ["Il n'est pas venu à la visite sous prétexte qu'il était malade."], grammar: [g.cause-advanced], vocab: [w.sous-prétexte-que, w.malade], note: "Sous prétexte que suggests you don't believe the reason." }
      - { es: "Du fait de sa puissance, l'abbé de Cluny avait une grande autorité sur les rois.", en: "Because of his power, the abbot of Cluny had great authority over kings.", altEs: ["En raison de sa puissance, l'abbé de Cluny avait une grande autorité sur les rois."], grammar: [g.cause-advanced], vocab: [w.du-fait-de, w.abbé, w.autorité] }
      - { es: "À force de travail et de prières, les moines ont rendu leur ordre très influent.", en: "Through hard work and prayer, the monks made their order very influential.", altEs: ["À force de travail et de prières, les moines ont fait de leur ordre un ordre très influent."], grammar: [g.cause-advanced], vocab: [w.influent, w.prière] }
      - { es: "En raison de la crise, le nombre de chômeurs a augmenté dans la région.", en: "Because of the crisis, the number of unemployed people in the region has risen.", altEs: ["Du fait de la crise, le nombre de chômeurs a augmenté dans la région."], grammar: [g.cause-advanced], vocab: [w.crise, w.chômeur] }
      - { es: "Faute de places dans les foyers, trop de sans-abri dorment dehors en hiver.", en: "For lack of places in shelters, too many homeless people sleep outside in winter.", altEs: ["Faute de place dans les foyers, trop de sans-abri dorment dehors en hiver."], grammar: [g.cause-advanced], vocab: [w.sans-abri, w.foyer] }
      - { es: "Vu que la population vieillit, la ville a besoin de services pour les personnes âgées.", en: "Seeing that the population is ageing, the town needs services for elderly people.", altEs: ["Étant donné que la population vieillit, la ville a besoin de services pour les personnes âgées."], grammar: [g.cause-advanced], vocab: [w.personne-âgée, w.vieillir] }
      - { es: "Faute d'ascenseur, les personnes handicapées ne pouvaient pas monter voir la maquette.", en: "For lack of a lift, disabled people couldn't go up to see the model.", altEs: ["Comme il n'y avait pas d'ascenseur, les personnes handicapées ne pouvaient pas monter voir la maquette."], grammar: [g.cause-advanced], vocab: [w.handicapé, w.ascenseur] }
      - { es: "L'association lutte contre le racisme, d'autant plus que les inégalités augmentent.", en: "The association fights racism, all the more so because inequality is growing.", altEs: ["L'association se bat contre le racisme, d'autant plus que les inégalités augmentent."], grammar: [g.cause-advanced], vocab: [w.racisme, w.inégalité, w.lutter] }
      - { es: "Non que le guide soit ennuyeux, mais il parle vraiment trop vite.", en: "Not that the guide is boring, but he really talks too fast.", altEs: ["Ce n'est pas que le guide soit ennuyeux, mais il parle vraiment trop vite."], grammar: [g.cause-advanced, g.subjonctif-doute], vocab: [w.ennuyeux] }
      - { es: "Sous prétexte de sécurité, on a fermé l'accès au clocher.", en: "On the pretext of safety, access to the bell tower has been closed.", altEs: ["Sous prétexte de sécurité, l'accès au clocher a été fermé."], grammar: [g.cause-advanced], vocab: [w.prétexte, w.sécurité, w.accès] }
      - { es: "Comme il fait mauvais, on reste à l'intérieur du musée.", en: "As the weather is bad, we're staying inside the museum.", grammar: [g.cause-advanced], vocab: [w.mauvais], transform: { instruction: "Use vu + noun", answer: "Vu le temps, on reste à l'intérieur du musée.", alt: ["Étant donné le temps, on reste à l'intérieur du musée.", "Vu le mauvais temps, on reste à l'intérieur du musée."], en: "Given the weather, we're staying inside the museum." } }
      - { es: "Je n'ai pas fini la visite parce que je n'avais pas assez de temps.", en: "I didn't finish the tour because I didn't have enough time.", grammar: [g.cause-advanced], vocab: [w.visite], transform: { instruction: "Use faute de + noun", answer: "Faute de temps, je n'ai pas fini la visite.", en: "For lack of time, I didn't finish the tour." } }
      - { es: "Le marché est annulé en raison de la pluie.", en: "The market is cancelled because of the rain.", altEs: ["Le marché est annulé à cause de la pluie."], grammar: [g.cause-advanced], vocab: [w.annuler, w.pluie], error: { wrong: "Le marché est annulé en raison qu'il pleut.", explain: "En raison de is followed by a noun only: en raison de la pluie.", grammar: g.cause-advanced } }
    exchanges:
      - q: { es: "Pourquoi l'abbaye a-t-elle été démolie ?", en: "Why was the abbey demolished?" }
        a: { es: "Étant donné qu'elle avait été vendue après la Révolution, on s'en est servi comme carrière de pierres.", en: "Given that it had been sold after the Revolution, it was used as a stone quarry." }
        alt: ["Parce qu'elle a été vendue après la Révolution.", "Faute de protection, on a pris ses pierres."]
        grammar: [g.cause-advanced]
        vocab: [w.étant-donné-que, w.pierre]
      - q: { es: "Le clocher est ouvert aujourd'hui ?", en: "Is the bell tower open today?" }
        a: { es: "Non, il est fermé en raison du vent.", en: "No, it's closed because of the wind." }
        alt: ["Non, à cause des travaux.", "Non, pour des raisons de sécurité."]
        grammar: [g.cause-advanced]
        vocab: [w.en-raison-de, w.vent]
      - q: { es: "Pourquoi Thomas n'est pas là ?", en: "Why isn't Thomas here?" }
        a: { es: "Il est resté à l'hôtel sous prétexte qu'il avait mal à la tête ; à mon avis, il voulait dormir.", en: "He stayed at the hotel, supposedly because he had a headache; if you ask me, he wanted to sleep." }
        alt: ["Il est malade, paraît-il.", "Il avait mal à la tête, soi-disant."]
        grammar: [g.cause-advanced, g.avoir-mal]
        vocab: [w.sous-prétexte-que]
      - q: { es: "Pourquoi l'abbé était-il si influent ?", en: "Why was the abbot so influential?" }
        a: { es: "Du fait de la richesse de l'ordre et de son réseau dans toute l'Europe.", en: "Because of the order's wealth and its network all over Europe." }
        alt: ["À cause de la richesse de l'ordre.", "Grâce à son réseau de monastères."]
        grammar: [g.cause-advanced]
        vocab: [w.richesse, w.influent]
      - q: { es: "Il y a beaucoup de jeunes à Cluny ?", en: "Are there many young people in Cluny?" }
        a: { es: "Oui, vu qu'il y a une grande école d'ingénieurs dans l'ancienne abbaye.", en: "Yes, seeing as there's a big engineering school in the former abbey." }
        alt: ["Oui, grâce à l'école d'ingénieurs.", "Pas tellement, la moyenne d'âge est assez élevée."]
        grammar: [g.cause-advanced]
        vocab: [w.vu-que, w.ingénieur]
    texts:
      - title: "Avis de la mairie"
        es: ["En raison des travaux, la place de l'abbaye sera fermée jusqu'au 30 juin.", "Faute de parking, merci de vous garer à l'entrée de la ville.", "Nous nous excusons pour la gêne occasionnée."]
        en: ["Due to building work, the abbey square will be closed until 30 June.", "As there is no car park, please park at the edge of town.", "We apologise for any inconvenience caused."]
        grammar: [g.cause-advanced]
        vocab: [w.en-raison-de, w.faute-de]
      - title: "Rapport d'une association"
        es: ["Du fait de la crise, la pauvreté touche davantage la jeunesse et la vieillesse.", "Étant donné ces chiffres, l'égalité des chances reste un objectif lointain.", "L'intégration passe d'abord par le travail et la sécurité."]
        en: ["Because of the crisis, poverty is hitting young and old people harder.", "Given these figures, equal opportunity remains a distant goal.", "Integration starts with work and security."]
        grammar: [g.cause-advanced]
        vocab: [w.pauvreté, w.jeunesse, w.vieillesse, w.égalité, w.intégration]
    spicy:
      - { es: "Je suis venue sous prétexte de voir l'abbaye ; en réalité, c'était pour te voir.", en: "I came on the pretext of seeing the abbey; actually, it was to see you.", altEs: ["Je suis venu sous prétexte de voir l'abbaye ; en réalité, c'était pour te voir."], grammar: [g.cause-advanced], vocab: [w.prétexte] }
      - { es: "Faute de parapluie, nous avons dû partager le tien ; quel dommage !", en: "For lack of an umbrella, we had to share yours; what a shame!", altEs: ["Faute de parapluie, on a dû partager le tien ; quel dommage !"], grammar: [g.cause-advanced], vocab: [w.faute-de, w.parapluie] }
      - { es: "Vu ton sourire, je suppose que la réponse est oui.", en: "Given your smile, I assume the answer is yes.", altEs: ["Étant donné ton sourire, je suppose que la réponse est oui."], grammar: [g.cause-advanced], vocab: [w.vu-que, w.sourire] }
      - { es: "Étant donné que tu as déjà mangé mon dessert, tu me dois au moins un dîner.", en: "Given that you've already eaten my dessert, you owe me at least a dinner.", altEs: ["Vu que tu as déjà mangé mon dessert, tu me dois au moins un dîner."], grammar: [g.cause-advanced], vocab: [w.étant-donné-que, w.dessert] }
      - { es: "Il a une influence terrible sur moi : à force de l'écouter, je commence à aimer le jazz.", en: "He has a terrible influence on me: from listening to him so much, I'm starting to like jazz.", altEs: ["Il a une influence terrible sur moi : à force de l'écouter, je me mets à aimer le jazz."], grammar: [g.cause-advanced], vocab: [w.influence] }
  - id: b2.u09.l4
    title: D'une part, d'autre part
    teach: [g.concession, g.cause-advanced]
    vocab: [w.argumenter, w.réfuter, w.objection, w.contradiction, w.d-une-part, w.d-autre-part, w.en-outre, w.de-plus, w.par-ailleurs, w.ainsi, w.c-est-à-dire, w.autrement-dit, w.europe.nm, w.européen, w.impressionnisme, w.nature-morte, w.autoportrait, w.paysagiste, w.exposer, w.galerie, w.collection, w.œuvre, w.sculpture, w.sculpteur, w.architecture, w.architecte, w.antique, w.antiquité, w.millénaire, w.empire, w.empereur, w.à-travers, w.de-travers, w.travers, w.raisonnement, w.nombreux, w.unir, w.modèle]
    tip: "A structured argument: d'une part… d'autre part, en outre / de plus / par ailleurs to add, certes… mais to concede, ainsi or c'est pourquoi to conclude, c'est-à-dire / autrement dit to rephrase."
    sentences:
      - { es: "D'une part, Cluny a uni l'Europe chrétienne ; d'autre part, elle a accumulé d'énormes richesses.", en: "On the one hand, Cluny united Christian Europe; on the other hand, it amassed enormous wealth.", altEs: ["D'un côté, Cluny a uni l'Europe chrétienne ; de l'autre, elle a accumulé d'énormes richesses."], grammar: [g.concession], vocab: [w.d-une-part, w.d-autre-part, w.richesse] }
      - { es: "En outre, les moines ont recopié de nombreux textes de l'Antiquité.", en: "Furthermore, the monks copied out many texts from Antiquity.", altEs: ["De plus, les moines ont recopié de nombreux textes de l'Antiquité."], grammar: [g.passe-compose-avoir], vocab: [w.en-outre, w.antiquité, w.nombreux] }
      - { es: "De plus, l'abbaye attirait des architectes et des sculpteurs venant de toute l'Europe.", en: "Moreover, the abbey attracted architects and sculptors from all over Europe.", altEs: ["En outre, l'abbaye attirait des architectes et des sculpteurs de toute l'Europe."], grammar: [g.participe-present], vocab: [w.de-plus, w.architecte, w.sculpteur] }
      - { es: "Certains historiens voient ainsi dans Cluny une première forme d'Europe unie.", en: "Some historians thus see in Cluny an early form of united Europe.", altEs: ["Ainsi, certains historiens voient dans Cluny une première forme d'Europe unie."], grammar: [g.present-er], vocab: [w.ainsi, w.historien, w.europe.nm] }
      - { es: "Je voudrais réfuter cet argument : l'empire de Charlemagne existait déjà un siècle avant Cluny.", en: "I'd like to refute that argument: Charlemagne's empire already existed a century before Cluny.", altEs: ["J'aimerais réfuter cet argument : l'empire de Charlemagne existait déjà un siècle avant Cluny."], grammar: [g.conditional-politeness], vocab: [w.réfuter, w.empire], note: "Charlemagne was crowned emperor in 800; Cluny was founded in 910." }
      - { es: "Une objection, cependant : bien que l'empereur ait été puissant, son empire n'a pas duré.", en: "One objection, however: although the emperor was powerful, his empire didn't last.", altEs: ["Une objection, toutefois : bien que l'empereur ait été puissant, son empire n'a pas duré."], grammar: [g.concession, g.subjonctif-passe], vocab: [w.objection, w.empereur] }
      - { es: "Il y a une contradiction dans ton raisonnement : tu dis que l'abbaye était pauvre et riche à la fois.", en: "There's a contradiction in your reasoning: you're saying the abbey was poor and rich at the same time.", altEs: ["Ton raisonnement contient une contradiction : tu dis que l'abbaye était à la fois pauvre et riche."], grammar: [g.discours-indirect], vocab: [w.contradiction, w.raisonnement] }
      - { es: "Par ailleurs, l'architecture de Cluny a inspiré des églises dans toute l'Europe.", en: "Furthermore, Cluny's architecture inspired churches all over Europe.", altEs: ["En outre, l'architecture de Cluny a inspiré des églises dans toute l'Europe."], grammar: [g.passe-compose-avoir], vocab: [w.par-ailleurs, w.architecture] }
      - { es: "À travers l'histoire de cette abbaye, c'est tout un millénaire européen qu'on découvre.", en: "Through the history of this abbey, it's a whole European millennium that you discover.", altEs: ["À travers l'histoire de cette abbaye, on découvre tout un millénaire européen."], grammar: [g.mise-en-relief], vocab: [w.à-travers, w.millénaire, w.européen] }
      - { es: "Le musée expose des sculptures médiévales et quelques objets antiques.", en: "The museum exhibits medieval sculptures and a few ancient objects.", altEs: ["Le musée présente des sculptures médiévales et quelques objets antiques."], grammar: [g.present-er], vocab: [w.exposer, w.sculpture, w.antique] }
      - { es: "Bien que je préfère l'impressionnisme, j'ai adoré la collection d'art roman.", en: "Although I prefer Impressionism, I loved the collection of Romanesque art.", altEs: ["Même si je préfère l'impressionnisme, j'ai adoré la collection d'art roman."], grammar: [g.concession], vocab: [w.impressionnisme, w.collection, w.roman.adj] }
      - { es: "Dans la galerie d'à côté, il y a des natures mortes, des autoportraits et des toiles de paysagistes.", en: "In the gallery next door, there are still lifes, self-portraits and paintings by landscape artists.", altEs: ["Dans la galerie voisine, il y a des natures mortes, des autoportraits et des toiles de paysagistes."], grammar: [g.il-y-a], vocab: [w.galerie, w.nature-morte, w.autoportrait, w.paysagiste] }
      - { es: "Tu as tout compris de travers : je n'ai jamais dit que cette œuvre était laide.", en: "You've got it all wrong: I never said this work was ugly.", altEs: ["Tu as tout compris de travers, je n'ai jamais dit que cette œuvre était laide."], grammar: [g.negation-jamais-plus-rien], vocab: [w.de-travers, w.œuvre] }
      - { es: "Les moines étaient riches. Pourtant, ils vivaient simplement.", en: "The monks were rich. Yet they lived simply.", grammar: [g.concession], vocab: [w.riche, w.simplement], transform: { instruction: "Join with bien que", answer: "Bien que les moines aient été riches, ils vivaient simplement.", alt: ["Bien que les moines soient riches, ils vivaient simplement.", "Même si les moines étaient riches, ils vivaient simplement."], en: "Although the monks were rich, they lived simply." } }
      - { es: "L'abbaye avait un grand pouvoir, car elle était très riche.", en: "The abbey had great power because it was very rich.", grammar: [g.cause-advanced], vocab: [w.pouvoir.n, w.riche], transform: { instruction: "Use du fait de + noun", answer: "Du fait de sa richesse, l'abbaye avait un grand pouvoir.", alt: ["En raison de sa richesse, l'abbaye avait un grand pouvoir."], en: "Because of its wealth, the abbey had great power." } }
      - { es: "Malgré ses défauts, ce projet mérite d'être soutenu.", en: "Despite its flaws, this project deserves support.", altEs: ["En dépit de ses défauts, ce projet mérite d'être soutenu."], grammar: [g.concession], vocab: [w.mériter], error: { wrong: "Malgré que ses défauts, ce projet mérite d'être soutenu.", explain: "Malgré is followed directly by a noun. Malgré que is a clause connector frowned upon in careful French; use bien que + subjonctif for a clause.", grammar: g.concession } }
    exchanges:
      - q: { es: "Alors, ton article sur Cluny, il avance ?", en: "So, how's your article on Cluny coming along?" }
        a: { es: "Oui : d'une part je parle de l'abbaye, d'autre part de l'Europe d'aujourd'hui.", en: "Yes: on the one hand I talk about the abbey, on the other about today's Europe." }
        alt: ["Oui, j'ai presque fini.", "Pas vraiment, faute de temps."]
        grammar: [g.concession]
        vocab: [w.d-une-part, w.d-autre-part]
      - q: { es: "Tu as une objection ?", en: "Do you have an objection?" }
        a: { es: "Oui : vu que l'abbaye a été détruite, on ne peut pas parler de modèle européen.", en: "Yes: given that the abbey was destroyed, you can't call it a European model." }
        alt: ["Non, aucune.", "Une seule : ton argument est un peu faible."]
        grammar: [g.cause-advanced]
        vocab: [w.objection, w.européen]
      - q: { es: "Qu'est-ce que tu veux dire par là ?", en: "What do you mean by that?" }
        a: { es: "Autrement dit, Cluny était riche, certes, mais elle partageait aussi sa culture.", en: "In other words, Cluny was rich, admittedly, but it also shared its culture." }
        alt: ["C'est-à-dire que l'abbaye partageait sa culture.", "Je veux dire que ce n'est pas si simple."]
        grammar: [g.concession]
        vocab: [w.autrement-dit, w.culture]
      - q: { es: "Tu sais argumenter en français maintenant ?", en: "Can you argue in French now?" }
        a: { es: "J'ai beau connaître les connecteurs, je les oublie dès que je parle.", en: "However well I know the connectors, I forget them as soon as I speak." }
        alt: ["Un peu, grâce à cette leçon.", "Pas encore, mais j'y travaille."]
        grammar: [g.concession]
        vocab: [w.argumenter]
      - q: { es: "Le musée a une belle collection ?", en: "Does the museum have a good collection?" }
        a: { es: "Oui, notamment des sculptures de l'ancienne église ; en outre, l'entrée est gratuite le dimanche.", en: "Yes, notably sculptures from the old church; what's more, entry is free on Sundays." }
        alt: ["Oui, surtout des sculptures.", "Assez petite, mais intéressante."]
        grammar: [g.connectors-advanced]
        vocab: [w.collection, w.en-outre]
    texts:
      - title: "Tribune : Cluny, une idée européenne ?"
        es: ["Certes, l'abbaye a été détruite il y a plus de deux siècles.", "Néanmoins, son réseau de monastères a relié des régions très différentes.", "En outre, les moines ont transmis l'héritage antique à travers tout le continent.", "Ainsi, Cluny reste, à mes yeux, une leçon pour l'Europe d'aujourd'hui."]
        en: ["Admittedly, the abbey was destroyed more than two centuries ago.", "Nevertheless, its network of monasteries linked very different regions.", "Furthermore, the monks passed on the heritage of Antiquity across the whole continent.", "Thus, in my eyes, Cluny remains a lesson for today's Europe."]
        grammar: [g.concession, g.connectors-advanced]
        vocab: [w.certes, w.néanmoins, w.en-outre, w.ainsi]
      - title: "Réponse d'un lecteur"
        es: ["Votre article est intéressant ; il contient toutefois une contradiction.", "D'une part, vous admirez la richesse de Cluny ; d'autre part, vous louez la simplicité des moines.", "Autrement dit, il faudrait choisir !"]
        en: ["Your article is interesting; it does, however, contain a contradiction.", "On the one hand you admire Cluny's wealth; on the other, you praise the monks' simplicity.", "In other words, you'd have to choose!"]
        grammar: [g.concession]
        vocab: [w.contradiction, w.d-une-part, w.d-autre-part, w.autrement-dit]
    spicy:
      - { es: "D'une part, tu es en retard ; d'autre part, tu es magnifique : je te pardonne.", en: "On the one hand, you're late; on the other, you look stunning: I forgive you.", altEs: ["D'un côté, tu es en retard ; de l'autre, tu es magnifique : je te pardonne."], grammar: [g.concession], vocab: [w.d-une-part, w.d-autre-part] }
      - { es: "Je n'ai aucune objection à un deuxième rendez-vous ; en outre, je connais un très bon restaurant.", en: "I have no objection to a second date; what's more, I know a very good restaurant.", altEs: ["Je n'ai aucune objection à un deuxième rendez-vous ; de plus, je connais un très bon restaurant."], grammar: [g.ni-ni-aucun], vocab: [w.objection, w.en-outre] }
      - { es: "Tu dis que tu ne m'aimes pas, mais tu as gardé mon pull : il y a une contradiction, non ?", en: "You say you don't love me, but you kept my jumper: there's a contradiction, isn't there?", altEs: ["Tu dis que tu ne m'aimes pas, pourtant tu as gardé mon pull : il y a une contradiction, non ?"], grammar: [g.concession], vocab: [w.contradiction] }
      - { es: "Autrement dit, quand tu dis « on verra », ça veut dire oui ?", en: "In other words, when you say 'we'll see', it means yes?", altEs: ["C'est-à-dire que quand tu dis « on verra », ça veut dire oui ?"], grammar: [g.yes-no-questions], vocab: [w.autrement-dit] }
      - { es: "Je pourrais réfuter tous tes arguments, mais j'ai d'autres projets pour ce soir.", en: "I could refute all your arguments, but I have other plans for tonight.", altEs: ["Je pourrais réfuter tous tes arguments, mais j'ai mieux à faire ce soir."], grammar: [g.conditionnel-present], vocab: [w.réfuter, w.argument] }
dialogues:
  - id: b2.u09.d1
    title: Faut-il reconstruire l'abbaye ?
    context: Hugo and Nadia, two students on a visit to Cluny, argue about whether the great church should be rebuilt.
    lines:
      - { speaker: Hugo, es: "À mon avis, on devrait reconstruire la grande église, afin que les visiteurs comprennent vraiment sa taille.", en: "In my opinion, they should rebuild the great church, so that visitors really understand its size." }
      - { speaker: Nadia, es: "Reconstruire ? Bien que l'idée soit séduisante, ce serait une copie, pas un monument historique.", en: "Rebuild it? Although the idea is tempting, it would be a copy, not a historic monument." }
      - { speaker: Hugo, es: "Certes, mais une copie vaut mieux que des ruines que personne ne comprend.", en: "Admittedly, but a copy is better than ruins that nobody understands." }
      - { speaker: Nadia, es: "Je ne suis pas d'accord. D'une part, ça coûterait une fortune ; d'autre part, faute de plans précis, on inventerait la moitié.", en: "I don't agree. On the one hand, it would cost a fortune; on the other, for lack of precise plans, half of it would be invented." }
      - { speaker: Hugo, es: "Les archéologues ont pourtant fait des fouilles pendant des années.", en: "And yet archaeologists have been excavating for years." }
      - { speaker: Nadia, es: "Justement, et ils ont créé des images en 3D pour qu'on puisse imaginer l'édifice. C'est suffisant, non ?", en: "Exactly, and they've created 3D images so that we can imagine the building. That's enough, isn't it?" }
      - { speaker: Hugo, es: "Une image, ce n'est pas pareil ! On a beau regarder un écran, on ne sent pas la pierre.", en: "An image isn't the same! However long you look at a screen, you don't feel the stone." }
      - { speaker: Nadia, es: "Vu le budget de la culture, on ferait mieux de restaurer ce qui existe encore.", en: "Given the culture budget, we'd do better to restore what still exists." }
      - { speaker: Hugo, es: "Bon, je concède que le clocher a besoin de travaux en premier.", en: "OK, I grant you the bell tower needs work first." }
      - { speaker: Nadia, es: "Ah, enfin un argument raisonnable ! On va prendre un café pour fêter ça ?", en: "Ah, a reasonable argument at last! Shall we get a coffee to celebrate?" }
    questions:
      - { q: "Pourquoi Hugo veut-il reconstruire l'église ?", options: ["Pour attirer des mécènes", "Pour que les visiteurs comprennent sa taille", "Parce que les ruines sont dangereuses"], answer: 1, explain: "Afin que les visiteurs comprennent vraiment sa taille." }
      - { q: "Quel est l'un des arguments de Nadia ?", options: ["On n'a pas de plans précis.", "Les touristes n'aiment pas les ruines.", "Le clocher est trop petit."], answer: 0, explain: "Faute de plans précis, on inventerait la moitié." }
      - { q: "Selon Nadia, que faudrait-il faire avec l'argent ?", options: ["Construire un nouveau musée", "Restaurer ce qui existe encore", "Acheter des écrans"], answer: 1, explain: "Vu le budget de la culture, on ferait mieux de restaurer ce qui existe encore." }
      - { q: "Que concède Hugo à la fin ?", options: ["Que la reconstruction est impossible", "Que le clocher a besoin de travaux en premier", "Que les images en 3D sont meilleures"], answer: 1, explain: "Je concède que le clocher a besoin de travaux en premier." }
