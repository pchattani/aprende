- id: g.subjunctive-nuance
  level: c1
  title: "Mood as meaning — indicative vs subjunctive to shade intention"
  summary: "The same verb changes meaning with the mood: dice que vengas / dice que vienes; busco a alguien que sabe / sepa; aunque es / sea."
  explanation: |
    At C1 the subjunctive is not a rule to obey but a resource:
    - **Information vs influence**: *Dice que vienes* (reports) / *Dice que vengas* (orders). *Insiste en que es verdad* / *Insiste en que vayamos.*
    - **Known vs sought**: *Hay alguien que puede ayudarte* / *¿Hay alguien que pueda ayudarte?*
    - **Fact vs conceded hypothesis**: *Aunque es caro* / *Aunque sea caro.*
    - **Commitment to truth**: *No dijo que viniera* (denies the claim) / *No dijo que venía* (she said it, but not that).
    - **Perception negated**: *No veo que haya problema.*
    - **Temporal reinterpretation**: *Cuando quieras* (open), *cuando quieres* (habit).
    - **Verbs of thinking in the negative with indicative** signal a quoted belief: *No creo que viene* (I don't believe [the claim] 'he's coming') — marked, colloquial.
  examples:
    - { es: "El jefe sugiere que el informe está incompleto; la secretaria sugiere que lo revisemos.", en: "The boss suggests (hints) the report is incomplete; the secretary suggests (proposes) we review it." }
    - { es: "Siento que estés mal; siento que algo va mal.", en: "I'm sorry you're unwell; I sense something is wrong." }
  drills:
    - { es: "No es que no me guste, es que no me apetece.", en: "It's not that I don't like it, it's that I don't feel like it." }
    - { es: "Que yo sepa, nadie ha llamado.", en: "As far as I know, nobody has called." }
- id: g.subjunctive-relative-advanced
  level: c1
  title: "Relatives and the subjunctive — quienquiera, cualquiera que, el que + subjunctive"
  summary: "Generalising relatives (whoever, whatever, wherever) and open-ended descriptions take the subjunctive."
  explanation: |
    - *el que / la que / quien + subjunctive* — whoever: *El que llegue primero, que abra.*
    - *cualquiera que, quienquiera que, dondequiera que, comoquiera que* (literary): *Cualquiera que sea el resultado, lo aceptaremos.*
    - *lo que + subjunctive* — whatever: *Haz lo que te parezca.*
    - *donde / cuando / como + subjunctive*: *Vive donde quieras.*
    - Reduplicative: *sea quien sea, venga de donde venga, cueste lo que cueste.*
    - After superlatives with doubt: *Es el mejor libro que haya leído* (that I may have read) vs *que he leído* (that I have read).
  examples:
    - { es: "Quienquiera que haya sido, pagará por ello.", en: "Whoever it was will pay for it." }
    - { es: "Es la propuesta más sensata que se haya presentado.", en: "It's the most sensible proposal that has been presented." }
  drills:
    - { es: "Sea como sea, hay que decidirlo hoy.", en: "Be that as it may, it has to be decided today." }
    - { es: "Que lo haga quien pueda.", en: "Let whoever can do it." }
- id: g.el-hecho-de-que
  level: c1
  title: "El hecho de que, que + subjunctive as subject, infinitive clauses"
  summary: "Noun clauses as subjects: El (hecho de) que llegue tarde…, Que haya venido significa mucho."
  explanation: |
    - *El hecho de que + subjunctive* (default) / indicative when the fact is highlighted as new: *El hecho de que lo diga él no lo hace verdad.*
    - *Que + subjunctive* as sentence subject: *Que haya venido ya es un éxito.*
    - *El que + subjunctive*: *El que no hayas llamado me duele.*
    - Infinitive subject with a general or same subject: *Fumar perjudica la salud. Me encanta nadar.*
    - *Eso de que…*, *lo de que…* — that business of: *Lo de que vende la casa es mentira.*
  examples:
    - { es: "El hecho de que no haya respondido es significativo.", en: "The fact that he hasn't replied is significant." }
    - { es: "Que lo sepan tus padres no cambia nada.", en: "Your parents knowing it doesn't change anything." }
  drills:
    - { es: "Eso de que nunca llueve aquí no es cierto.", en: "That idea that it never rains here isn't true." }
    - { es: "El que estés aquí lo dice todo.", en: "You being here says it all." }
- id: g.future-subjunctive
  level: c1
  title: "The future subjunctive — hubiere, fuere, viniere"
  summary: "Archaic; survives in legal texts and set phrases: sea lo que fuere, adonde fueres haz lo que vieres."
  explanation: |
    Formed from the imperfect subjunctive stem with *-re* endings: *hablare, hablares, hablare, habláremos, hablareis, hablaren; hubiere hablado.*
    - Legal Spanish: *El que matare a otro… Si el contrato no se cumpliere…* — now replaced by the present subjunctive in modern legislation.
    - Proverbs and fixed phrases: *Adonde fueres, haz lo que vieres. Sea lo que fuere. Venga lo que viniere.*
    - Recognise it in Golden Age literature and old contracts; do not use it in your own writing except playfully.
  examples:
    - { es: "Quien incumpliere esta norma será sancionado.", en: "Whoever breaches this rule shall be penalised." }
    - { es: "Sea lo que fuere, actuaremos.", en: "Whatever it may be, we shall act." }
  drills:
    - { es: "Adonde fueres, haz lo que vieres.", en: "Wherever you go, do as you see (when in Rome…)." }
    - { es: "Si alguien lo supiere, que lo declare.", en: "If anyone should know it, let him declare it." }
- id: g.legal-register
  level: c1
  title: "Legal and administrative Spanish"
  summary: "Formulas of contracts, laws and official letters: el abajo firmante, por la presente, en virtud de, a efectos de."
  explanation: |
    - Fixed formulas: *por la presente* (hereby), *el/la abajo firmante* (the undersigned), *en virtud de* (by virtue of), *a efectos de* (for the purposes of), *sin perjuicio de* (without prejudice to), *salvo* (except), *en su caso* (where applicable), *conforme a / de acuerdo con*, *dicho/a* (said), *el mismo / la misma* (the same), *lo dispuesto en el artículo 5*.
    - Verb forms: present subjunctive for hypotheses (*el que cometa*), future subjunctive in old texts, periphrastic *deberá / habrá de*, passive *se* (*se procederá*), nominalisations (*la presentación de la solicitud*).
    - Structure: *EXPONE … SOLICITA …* in applications; *Primero. – Segundo. –* numbered clauses.
    - Plain-language reform (*lenguaje claro*) is reducing archaisms; prefer short sentences when you write.
  examples:
    - { es: "Por la presente, el abajo firmante solicita la renovación de su permiso de residencia.", en: "The undersigned hereby applies for the renewal of their residence permit." }
    - { es: "Sin perjuicio de lo dispuesto en el artículo anterior, el arrendatario deberá…", en: "Without prejudice to the provisions of the previous article, the tenant shall…" }
  drills:
    - { es: "Se procederá al cobro de la tasa correspondiente.", en: "The corresponding fee will be charged." }
    - { es: "En su caso, aporte la documentación acreditativa.", en: "Where applicable, provide supporting documentation." }
- id: g.discourse-markers-advanced
  level: c1
  title: "Advanced discourse markers"
  summary: "Reformulating, digressing, closing, intensifying: es decir, o sea, a saber, por cierto, en cualquier caso, en definitiva, ni mucho menos."
  explanation: |
    - **Reformulation**: *es decir, o sea, esto es, a saber, en otras palabras, dicho de otro modo, mejor dicho*
    - **Digression / return**: *por cierto, a propósito, dicho sea de paso, volviendo al tema, como decía*
    - **Attitude**: *la verdad es que, francamente, sinceramente, por desgracia, afortunadamente, curiosamente*
    - **Scalar**: *incluso, hasta, ni siquiera, ni mucho menos, cuando menos, como mínimo, a lo sumo*
    - **Closing**: *en fin, total, en definitiva, al fin y al cabo, a fin de cuentas, en resumidas cuentas*
    - **Conversational**: *bueno, pues, vamos, hombre, mira, oye, ya, claro, desde luego, ¿sabes?, ¿no?, ¿verdad?*
  examples:
    - { es: "No vino nadie, ni siquiera su hermano; en fin, lo pasamos bien de todos modos.", en: "Nobody came, not even his brother; anyway, we had a good time all the same." }
    - { es: "Por cierto, ¿has hablado con Marta? Volviendo al tema…", en: "By the way, have you talked to Marta? Back to the subject…" }
  drills:
    - { es: "Al fin y al cabo, es su decisión.", en: "At the end of the day, it's his decision." }
    - { es: "Dicho de otro modo, no hay presupuesto.", en: "In other words, there's no budget." }
- id: g.anaphora-cohesion
  level: c1
  title: "Cohesion — reference, ellipsis and lexical chains"
  summary: "Keeping track of who and what across a text: este / aquel, dicho, el mismo, ello, lo anterior, synonyms and hypernyms."
  explanation: |
    - **Demonstratives**: *este/esta* for the nearest mention, *aquel/aquella* for the earlier one: *Juan habló con Pedro; este (Pedro) no respondió.*
    - **Formal anaphora**: *dicho informe, el citado autor, el mismo, la misma, el susodicho* (ironic), *lo anterior, lo expuesto, ello* (neuter 'it' after prepositions: *por ello, para ello*).
    - **Ellipsis**: Spanish drops repeated subjects and nouns: *Compré dos camisas: una azul y otra blanca.*
    - **Lexical chains**: repeat with synonyms / hypernyms: *el perro → el animal → el can → la mascota.*
    - **Cataphora**: *Lo dijo claramente: no volvería.*
    - Avoid ambiguous *su*: specify *de él / de ella / de ellos* or restructure.
  examples:
    - { es: "El Gobierno presentó la ley; dicha norma entrará en vigor en enero. Ello supondrá cambios para las empresas.", en: "The government presented the law; said regulation will come into force in January. This will mean changes for companies." }
    - { es: "Hablé con el director y con la jefa de estudios; esta se mostró más receptiva que aquel.", en: "I spoke with the headmaster and the head of studies; the latter was more receptive than the former." }
  drills:
    - { es: "Para ello, es necesario presentar la solicitud.", en: "To that end, the application must be submitted." }
    - { es: "Lo anterior demuestra la gravedad del problema.", en: "The above demonstrates the seriousness of the problem." }
- id: g.text-types
  level: c1
  title: "Text types and their conventions"
  summary: "Narrative, descriptive, expository, argumentative, instructional and conversational texts each have typical tenses, persons and markers."
  explanation: |
    | type | typical tenses / forms | markers |
    |---|---|---|
    | narrative | preterite, imperfect, pluperfect; historical present | *entonces, de repente, al cabo de, mientras* |
    | descriptive | imperfect / present, ser/estar, adjectives, comparisons | *a la derecha, al fondo, parecía* |
    | expository | present, passive se, nominalisation, 3rd person | *es decir, por ejemplo, en primer lugar* |
    | argumentative | present, conditional, subjunctive of concession, 1st person plural | *sin embargo, por tanto, cabe señalar* |
    | instructional | imperative, infinitive, se + 3rd person, hay que | *primero, a continuación, por último* |
    | conversational | all tenses, ellipsis, fillers, tag questions | *bueno, pues, ¿no?, o sea* |

    Genre markers: *Érase una vez* (tales), *Según fuentes* (news), *Estimado/a* (letters), *Se ruega* (notices), *Agítese antes de usar* (instructions).
  examples:
    - { es: "Agítese bien antes de usar. Manténgase fuera del alcance de los niños.", en: "Shake well before use. Keep out of reach of children." }
    - { es: "Según fuentes del ministerio, la reforma se aprobará en otoño.", en: "According to ministry sources, the reform will be approved in autumn." }
  drills:
    - { es: "Érase una vez un rey que tenía tres hijas.", en: "Once upon a time there was a king who had three daughters." }
    - { es: "Se ruega silencio.", en: "Silence please." }
- id: g.idioms
  level: c1
  title: "Idioms — frequent Spanish expressions"
  summary: "estar en las nubes, meter la pata, tomar el pelo, no tener pelos en la lengua, costar un ojo de la cara, ponerse las pilas."
  explanation: |
    - *meter la pata* — put one's foot in it · *tomar el pelo a alguien* — pull someone's leg · *no tener pelos en la lengua* — speak one's mind
    - *estar en las nubes* — have one's head in the clouds · *estar hecho polvo* — be exhausted · *estar como una cabra* — be nuts
    - *costar un ojo de la cara / un riñón* — cost an arm and a leg · *tirar la casa por la ventana* — spare no expense
    - *ponerse las pilas* — get one's act together · *dar en el clavo* — hit the nail on the head · *hacer la vista gorda* — turn a blind eye
    - *ser pan comido* — be a piece of cake · *estar entre la espada y la pared* — be between a rock and a hard place
    - *llover a cántaros* — pour · *a otro perro con ese hueso* — pull the other one · *ir al grano* — get to the point
    - *quedarse en blanco* — go blank · *tener mala leche* — be bad-tempered · *de tal palo, tal astilla* — like father like son
    Idioms are register-sensitive: most are colloquial; avoid them in formal writing.
  examples:
    - { es: "Metí la pata al preguntarle por su exmujer.", en: "I put my foot in it by asking about his ex-wife." }
    - { es: "El piso nos costó un ojo de la cara.", en: "The flat cost us an arm and a leg." }
  drills:
    - { es: "Venga, ponte las pilas, que el examen es mañana.", en: "Come on, get your act together, the exam is tomorrow." }
    - { es: "Está lloviendo a cántaros.", en: "It's pouring." }
- id: g.proverbs
  level: c1
  title: "Proverbs and sayings (refranes)"
  summary: "Más vale tarde que nunca. No hay mal que por bien no venga. A quien madruga, Dios le ayuda."
  explanation: |
    Refranes are quoted constantly, often only the first half (*A quien madruga…*):
    - *Más vale tarde que nunca.* — Better late than never.
    - *No hay mal que por bien no venga.* — Every cloud has a silver lining.
    - *A quien madruga, Dios le ayuda.* — The early bird catches the worm.
    - *Más vale pájaro en mano que ciento volando.* — A bird in the hand…
    - *Ojos que no ven, corazón que no siente.* — Out of sight, out of mind.
    - *En boca cerrada no entran moscas.* — Silence is golden.
    - *Dime con quién andas y te diré quién eres.* — You are known by the company you keep.
    - *El que no llora, no mama.* — The squeaky wheel gets the grease.
    - *Quien mucho abarca, poco aprieta.* — Don't bite off more than you can chew.
    - *No por mucho madrugar amanece más temprano.* — Things take the time they take.
    - *Cría cuervos y te sacarán los ojos.* — Nurse a viper in your bosom.
    - *A caballo regalado no le mires el diente.* — Don't look a gift horse in the mouth.
  examples:
    - { es: "Llegaste a las once, pero bueno, más vale tarde que nunca.", en: "You arrived at eleven, but well, better late than never." }
    - { es: "Perdió el trabajo y encontró otro mejor: no hay mal que por bien no venga.", en: "He lost his job and found a better one: every cloud has a silver lining." }
  drills:
    - { es: "Ya sabes: a quien madruga, Dios le ayuda.", en: "You know: the early bird catches the worm." }
    - { es: "En boca cerrada no entran moscas.", en: "Silence is golden." }
- id: g.fixed-expressions
  level: c1
  title: "Fixed expressions and prepositional phrases"
  summary: "a menudo, de repente, en cuanto a, a raíz de, con respecto a, a falta de, de golpe, a lo largo de, al cabo de."
  explanation: |
    Many adverbial and prepositional phrases must be learnt as units:
    - **Time**: *de repente, de golpe, de pronto, al cabo de, a lo largo de, a principios / mediados / finales de, de vez en cuando, a la larga, a corto / largo plazo, hoy por hoy*
    - **Manner**: *a ciegas, a tientas, a escondidas, de memoria, de pie, de rodillas, a propósito, sin querer, a la fuerza, de buena / mala gana, a toda prisa, a regañadientes*
    - **Topic / relation**: *en cuanto a, con respecto a, respecto de, en lo que se refiere a, a propósito de, acerca de, en torno a*
    - **Cause / condition**: *a raíz de, a causa de, debido a, gracias a, a falta de, en caso de, a no ser por*
    - **Quantity**: *a montones, de sobra, al menos, a lo sumo, como mucho, por lo menos, en absoluto*
    - **Others**: *a lo mejor, a lo largo y ancho, de hecho, en cambio, por si acaso, sin embargo, a pesar de todo*
  examples:
    - { es: "En cuanto al presupuesto, a lo sumo podemos gastar mil euros.", en: "As for the budget, at most we can spend a thousand euros." }
    - { es: "A raíz del accidente, cambiaron la normativa.", en: "As a result of the accident, they changed the regulations." }
  drills:
    - { es: "Lo aprendí de memoria a regañadientes.", en: "I learnt it by heart reluctantly." }
    - { es: "Llévate el paraguas por si acaso.", en: "Take the umbrella just in case." }
- id: g.academic-register
  level: c1
  title: "Academic Spanish"
  summary: "Objectivity, nominalisation, hedging, citation and the impersonal voice in essays and papers."
  explanation: |
    - **Impersonality**: *se analiza, se observa, cabe señalar, es preciso destacar, el presente trabajo, los datos muestran*; avoid *yo*; *nosotros* inclusive is acceptable (*consideramos*).
    - **Hedging**: *parece indicar, podría deberse a, en cierta medida, en líneas generales, no es descartable que*
    - **Nominalisation and heavy noun phrases**: *la implementación de medidas de carácter preventivo*
    - **Connectors**: *asimismo, por consiguiente, en este sentido, por otra parte, en cuanto a, dicho esto, en síntesis*
    - **Citation**: *según X (2020), como señala X, de acuerdo con, en palabras de, X sostiene / afirma / plantea / cuestiona*
    - **Structure**: *introducción, marco teórico, metodología, resultados, discusión, conclusiones; resumen (abstract), palabras clave*
    - Spanish academic prose tolerates longer sentences than English; keep agreement and reference clear.
  examples:
    - { es: "Los resultados parecen indicar una correlación, si bien esta no es estadísticamente significativa.", en: "The results seem to indicate a correlation, although it is not statistically significant." }
    - { es: "Como señala García (2019), la cuestión sigue abierta.", en: "As García (2019) points out, the question remains open." }
  drills:
    - { es: "En este sentido, cabe destacar tres factores.", en: "In this regard, three factors should be highlighted." }
    - { es: "El presente estudio analiza la evolución del fenómeno.", en: "This study analyses the evolution of the phenomenon." }
- id: g.formal-reports
  level: c1
  title: "Reports, minutes and professional writing"
  summary: "Informes, actas, memorandos: structure, tense use, bullet conventions, and the language of recommendations."
  explanation: |
    - **Informe**: *Objeto, Antecedentes, Análisis, Conclusiones, Recomendaciones.* Present and perfect; *se recomienda, se propone, sería conveniente, resulta necesario.*
    - **Acta de reunión**: *Asistentes, Orden del día, Desarrollo, Acuerdos, Próxima reunión.* Preterite / present: *Se acuerda, se aprueba por unanimidad, toma la palabra, queda pendiente.*
    - **Correo profesional**: *Asunto:* line; *Estimado/a, Hola + nombre* (semi-formal); *Te escribo en relación con…; Quedo a la espera; Un saludo cordial.*
    - **Recommendations** with modal softening: *convendría, cabría considerar, se sugiere valorar, podría plantearse.*
    - Bullets: start with infinitives or nouns consistently; numbers as figures; dates *3 de mayo de 2026.*
  examples:
    - { es: "Se acuerda por unanimidad aplazar la decisión hasta la próxima reunión.", en: "It is unanimously agreed to postpone the decision until the next meeting." }
    - { es: "Convendría revisar el procedimiento antes de su implantación.", en: "It would be advisable to review the procedure before its implementation." }
  drills:
    - { es: "Queda pendiente el punto tres del orden del día.", en: "Item three on the agenda remains pending." }
    - { es: "Asunto: solicitud de presupuesto.", en: "Subject: request for a quote." }
- id: g.presentations
  level: c1
  title: "Giving a presentation"
  summary: "Opening, signposting, handling data, transitions, closing and questions."
  explanation: |
    - **Opening**: *Buenos días a todos. Hoy voy a hablarles de… Mi intervención se divide en tres partes… Empezaré por…*
    - **Signposting**: *En primer lugar… Pasemos ahora a… Como pueden ver en esta gráfica… Esto nos lleva a… Volviendo a lo que decía antes…*
    - **Data**: *la cifra asciende a, ha aumentado / disminuido un 20 %, se ha duplicado, la mitad / un tercio de, en comparación con*
    - **Emphasis**: *Quiero subrayar que… Lo fundamental es… Cabe destacar…*
    - **Closing**: *Para terminar / En resumen… Muchas gracias por su atención. ¿Alguna pregunta?*
    - **Handling questions**: *Buena pregunta. Si le he entendido bien… Permítame matizar… No dispongo de ese dato ahora mismo, pero…*
  examples:
    - { es: "Como pueden ver en la gráfica, las ventas se han duplicado desde 2020.", en: "As you can see in the chart, sales have doubled since 2020." }
    - { es: "Esto nos lleva al tercer punto: los costes.", en: "This brings us to the third point: costs." }
  drills:
    - { es: "Permítanme subrayar un dato clave.", en: "Allow me to underline a key fact." }
    - { es: "Muchas gracias por su atención; quedo a su disposición para preguntas.", en: "Thank you for your attention; I'm happy to take questions." }
- id: g.subordination-complex
  level: c1
  title: "Complex subordination and long sentences"
  summary: "Embedding relative, noun and adverbial clauses; controlling agreement and reference across a long sentence."
  explanation: |
    - Spanish prose allows multiple embedded clauses: *El informe que el comité, cuya composición se renovó en marzo, elaboró tras consultar a los expertos que habían participado en el proyecto anterior, concluye que…*
    - Keep the **subject-verb link** visible; if the subject is far from the verb, repeat it with a pronoun or restructure.
    - Use **punctuation**: commas around non-defining clauses, semicolons between related independent clauses, colons before explanations, dashes for asides.
    - **Correlatives**: *tanto … como, no solo … sino también, ya sea … ya sea, bien … bien, o bien … o bien, ni … ni.*
    - **Mood agreement** travels down the chain: *Quiero que me digas qué hiciste cuando llegaste* (subjunctive only where triggered).
    - **Participial / gerund clauses** condense: *Terminada la reunión, se fueron. Habiendo oído a las partes…*
  examples:
    - { es: "No solo no vino, sino que tampoco avisó, lo cual, dadas las circunstancias, resulta inexplicable.", en: "Not only did he not come, but he didn't let anyone know either, which, given the circumstances, is inexplicable." }
    - { es: "La casa que compraron mis padres, que había pertenecido a un pintor cuyas obras hoy cuestan una fortuna, se vendió por muy poco.", en: "The house my parents bought, which had belonged to a painter whose works now cost a fortune, was sold for very little." }
  drills:
    - { es: "Tanto los alumnos como los profesores apoyaron la propuesta.", en: "Both students and teachers supported the proposal." }
    - { es: "Ya sea por miedo, ya sea por pereza, nunca lo intentó.", en: "Whether out of fear or laziness, he never tried." }
- id: g.gerund-uses-advanced
  level: c1
  title: "The gerund — correct and incorrect uses"
  summary: "Simultaneity, manner, cause, condition; not for sequence or as an adjective (*una caja conteniendo*)."
  explanation: |
    **Correct**: 
    - manner / simultaneity: *Salió corriendo. Aprendí escuchando.*
    - cause / condition: *Siendo así, me voy. Estudiando, aprobarás.*
    - with perception verbs: *Vi a Juan cruzando la calle.*
    - periphrases: *estar, seguir, ir, venir, andar, llevar + gerund*
    - *en + gerund* (archaic, 'as soon as'): *En acabando, nos vamos.*

    **Avoid** (common errors):
    - posteriority: *Salió de casa cerrando la puerta* ✗ → *y cerró la puerta*
    - adjectival use with nouns: *una caja conteniendo libros* ✗ → *que contiene*
    - *gerundio de BOE*: *Se aprueba la ley regulando…* ✗
    Accepted exceptions: *agua hirviendo, hombre ardiendo.*
  examples:
    - { es: "Pasó la tarde leyendo en el jardín.", en: "She spent the afternoon reading in the garden." }
    - { es: "Habiendo terminado el trabajo, se permitió un descanso.", en: "Having finished the work, he allowed himself a rest." }
  drills:
    - { es: "Conociéndolo, llegará tarde.", en: "Knowing him, he'll be late." }
    - { es: "Entró gritando como un loco.", en: "He came in shouting like a madman." }
- id: g.absolute-constructions
  level: c1
  title: "Absolute constructions — terminada la cena, una vez firmado, al amanecer"
  summary: "Participle or infinitive clauses without a main verb, typical of written Spanish."
  explanation: |
    - **Participle + noun** (agreeing): *Terminada la reunión, se fueron. Dicho esto, continuemos. Hechas las presentaciones, empezó la cena.*
    - **una vez + participle**: *Una vez aprobada la ley, entrará en vigor.*
    - **al + infinitive**: *Al amanecer, salimos. Al no recibir respuesta, insistí.*
    - **de + infinitive** (condition, formal): *De haberlo sabido, habría venido. De ser cierto, es grave.*
    - **con + noun + participle**: *Con el trabajo acabado, podemos descansar.*
    - **noun + adjective / adverb**: *Cabeza alta, entró en la sala. Llave en mano, abrió.*
    These condense a clause and are a hallmark of good written style; in speech use full clauses.
  examples:
    - { es: "Una vez resueltos los problemas técnicos, la emisión continuó.", en: "Once the technical problems were solved, the broadcast continued." }
    - { es: "De no llegar a un acuerdo, iremos a juicio.", en: "If we don't reach an agreement, we'll go to court." }
  drills:
    - { es: "Dicho esto, pasemos al siguiente punto.", en: "That said, let's move to the next point." }
    - { es: "Al no haber luz, usamos velas.", en: "As there was no light, we used candles." }
- id: g.pragmatics
  level: c1
  title: "Pragmatics — what people mean versus what they say"
  summary: "Indirect requests, softeners, hedges, turn-taking and politeness strategies in Spanish."
  explanation: |
    - **Indirect requests**: *¿No tendrás un boli? ¿Te importa si abro la ventana? Si pudieras pasarme la sal…*
    - **Softeners**: *un poco, algo, quizá, igual, a lo mejor, ¿no?, ¿vale?, si te parece, cuando puedas*
    - **Pre-sequences**: *Oye, una cosa… Te quería pedir un favor… ¿Puedo hacerte una pregunta?*
    - **Refusals**: rarely a bare *no*: *Es que…, me encantaría, pero…, lo siento, pero…, otro día sin falta*
    - **Compliments and responses**: *¡Qué bien te queda! — Bueno, es muy viejo.* (downplaying)
    - **Interrupting / holding the floor**: *Perdona que te interrumpa… Déjame terminar… Un momento…*
    - Spanish often uses imperatives and directness among friends where English hedges; it is not rude.
  examples:
    - { es: "¿No tendrías cinco minutos para echarle un vistazo?", en: "You wouldn't have five minutes to take a look, would you?" }
    - { es: "Me encantaría, pero es que ya he quedado.", en: "I'd love to, but the thing is I've already got plans." }
  drills:
    - { es: "Perdona que te interrumpa, pero creo que hay un error.", en: "Sorry to interrupt, but I think there's a mistake." }
    - { es: "Si te parece, lo hablamos mañana.", en: "If it suits you, we'll talk about it tomorrow." }
- id: g.irony-humor
  level: c1
  title: "Irony, humour and understatement"
  summary: "Recognising sarcasm, hyperbole, understatement, puns and cultural humour."
  explanation: |
    - **Sarcasm markers**: exaggerated praise with falling intonation, *¡Qué bien!, ¡Genial!, ¡Lo que me faltaba!, ¡No me digas!, ¡Vaya!, Sí, claro…, Ya, ya.*
    - **Hyperbole**: *Me muero de hambre. Llevo mil años esperando. Es más lento que una tortuga.*
    - **Understatement**: *No está mal* (= it's great), *Un poco caro* (= very expensive), *Algo tarde* (= very late).
    - **Ironic formulas**: *Ni que + imperfect subjunctive* (*¡Ni que fueras rico!*), *Anda que…* (*¡Anda que no has tardado!* = you took ages), *Menudo / menuda* (*¡Menudo lío!*), *Vaya + noun* (*¡Vaya coche!*).
    - **Puns and set humour**: double meanings (*banco, muñeca*), *chistes de Lepe*, Jaimito, wordplay in headlines.
    - Culture: self-deprecation and teasing (*tomar el pelo, vacilar*) express closeness.
  examples:
    - { es: "¡Anda que no has tardado! Solo dos horas.", en: "Well, you didn't take long! Only two hours." }
    - { es: "¿Otro examen? Lo que me faltaba.", en: "Another exam? Just what I needed." }
  drills:
    - { es: "Menudo día llevo.", en: "What a day I'm having." }
    - { es: "No está mal para ser tu primera paella.", en: "Not bad for your first paella (= impressive)." }
- id: g.politeness-strategies
  level: c1
  title: "Politeness — distance, deference and solidarity"
  summary: "Choosing tú/usted, titles, softeners and formulas across Spain and Latin America."
  explanation: |
    - **Forms of address**: *usted* with age, hierarchy, officialdom; *tú* by default in Spain among adults under 60; *don / doña + first name* (*don Antonio*) as respectful-familiar; *señor/a + surname*; *doctor/a, profesor/a, licenciado* (LatAm).
    - **Offering**: *¿Te apetece…? ¿Le pongo…? Estás en tu casa. Sírvete.* Accepting after a ritual refusal is common.
    - **Thanks and replies**: *Muchas gracias — De nada / No hay de qué / A ti / Faltaría más.*
    - **Apologising**: *Perdón, perdona/e, lo siento, disculpa/e, no era mi intención, te pido disculpas.*
    - **Formulas**: *¡Que aproveche! ¡Buen provecho! ¡Que te mejores! ¡Que descanses! ¡Enhorabuena! ¡Mi más sentido pésame!*
    - Latin American Spanish tends to more verbal politeness (*¿sería tan amable de…?, con permiso, a la orden, provecho*); Peninsular Spanish is more direct and relies on tone.
  examples:
    - { es: "¿Sería tan amable de indicarme la salida?", en: "Would you be so kind as to show me the exit?" }
    - { es: "Con permiso. — Propio.", en: "Excuse me (passing). — Go ahead. (Mexico)" }
  drills:
    - { es: "Faltaría más, es un placer.", en: "Not at all, it's a pleasure." }
    - { es: "Le pido disculpas por las molestias.", en: "I apologise for the inconvenience." }
- id: g.literary-language
  level: c1
  title: "Reading literature — devices and vocabulary"
  summary: "Figures of speech, narrative voice, register shifts and poetic word order."
  explanation: |
    - **Figures**: *metáfora, símil (como), hipérbole, personificación, antítesis, ironía, metonimia, sinestesia, anáfora, hipérbaton* (inverted word order), *elipsis, polisíndeton, aliteración.*
    - **Narrative voice**: *narrador omnisciente, en primera persona, testigo; estilo directo / indirecto / indirecto libre; monólogo interior.*
    - **Poetic word order**: adjective before noun (*la blanca nieve*), verb-final clauses, postposed subjects (*Volverán las oscuras golondrinas*).
    - **Literary vocabulary**: *mas* (pero), *empero, acaso, antaño, otrora, do* (donde), *doquier, aqueste, cual* (como), *harto* (muy).
    - **Tenses**: historical present, *-se* subjunctive, future subjunctive in older texts, *hube cantado* (pretérito anterior).
    - Public-domain authors for practice: Cervantes, Quevedo, Lope, Bécquer, Galdós, Clarín, Unamuno, Machado, Rubén Darío, Horacio Quiroga.
  examples:
    - { es: "Volverán las oscuras golondrinas en tu balcón sus nidos a colgar. (Bécquer)", en: "The dark swallows will return to hang their nests on your balcony." }
    - { es: "En un lugar de la Mancha, de cuyo nombre no quiero acordarme… (Cervantes)", en: "In a village of La Mancha, the name of which I have no desire to call to mind…" }
  drills:
    - { es: "Era la noche oscura y fría; mas él no sentía el frío.", en: "The night was dark and cold; but he did not feel the cold." }
    - { es: "Caminante, no hay camino, se hace camino al andar. (Machado)", en: "Traveller, there is no road; the road is made by walking." }
- id: g.narrative-tenses-literary
  level: c1
  title: "Narrative tenses in literature — historical present, -se forms, free indirect style"
  summary: "How writers manipulate tense and mood for rhythm, immediacy and point of view."
  explanation: |
    - **Historical present**: *En 1492 Colón llega a América.* — immediacy in history and fiction.
    - **Imperfect of narration**: *Al día siguiente moría el rey* — a dramatic imperfect for a sudden event.
    - **-se subjunctive** as a stylistic variant, sometimes as a pluperfect indicative in literary / journalistic style: *el libro que escribiese en 1920* (= había escrito) — recognise but avoid.
    - **Free indirect style**: the narrator borrows the character's voice without *dijo que*: *¿Qué iba a hacer ahora? Nada. Todo estaba perdido.*
    - **Conditional of rumour** (journalistic, criticised): *El ministro habría aceptado el soborno.*
    - **Future of conjecture** in narration: *Tendría treinta años.*
  examples:
    - { es: "Cervantes publica la primera parte del Quijote en 1605 y muere en 1616.", en: "Cervantes publishes the first part of Don Quixote in 1605 and dies in 1616." }
    - { es: "Se detuvo en la puerta. ¿Y si no estaba? ¿Y si había cambiado de opinión?", en: "He stopped at the door. What if she wasn't there? What if she had changed her mind?" }
  drills:
    - { es: "Diez años después, el pueblo era un desierto.", en: "Ten years later, the village was a desert." }
    - { es: "Según algunas fuentes, el acuerdo se habría firmado en secreto.", en: "According to some sources, the agreement was allegedly signed in secret." }
- id: g.preterite-anterior
  level: c1
  title: "The pretérito anterior — hubo terminado"
  summary: "A literary tense for an action immediately before another in the past: Apenas hubo terminado, salió."
  explanation: |
    Formed with the preterite of *haber* + participle: *hube, hubiste, hubo, hubimos, hubisteis, hubieron + hablado.*
    - Used after *apenas, en cuanto, tan pronto como, cuando, después de que, no bien, luego que* to mark immediacy: *Apenas hubo salido el sol, partieron.*
    - Almost extinct in speech; replaced by the preterite (*apenas salió*) or the pluperfect.
    - Recognise it in 19th-century prose and in formal narrative; use it only for stylistic effect.
  examples:
    - { es: "Cuando hubo terminado de hablar, nadie se atrevió a responder.", en: "When he had finished speaking, no one dared to answer." }
    - { es: "No bien hubo llegado, lo llamaron de nuevo.", en: "No sooner had he arrived than they called him again." }
  drills:
    - { es: "Apenas hubo amanecido, se pusieron en marcha.", en: "As soon as it had dawned, they set off." }
    - { es: "Tan pronto como hubieron firmado, se despidieron.", en: "As soon as they had signed, they said goodbye." }
- id: g.journalistic-language
  level: c1
  title: "The language of the press"
  summary: "Headline syntax, the structure of a news item, reporting verbs, and the conditional of rumour."
  explanation: |
    - **Headlines**: no articles, present tense for past events, nominalisation, colon for attribution: *Dimite el ministro tras el escándalo. Sánchez: «No habrá elecciones».*
    - **Lead** (*entradilla*): who, what, when, where, why in two sentences.
    - **Attribution**: *según, de acuerdo con, fuentes cercanas a, afirmó, aseguró, declaró, señaló, indicó, apuntó, matizó, negó, reconoció, advirtió.*
    - **Distance markers**: *presunto, supuesto, al parecer, según ha podido saber este diario, habría + participle* (conditional of rumour, criticised but common).
    - **Clichés to recognise**: *dar luz verde, tomar cartas en el asunto, en el punto de mira, a la orden del día, sin precedentes, un antes y un después.*
    - **Sections**: *portada, nacional, internacional, economía, sociedad, cultura, deportes, opinión, editorial, columna, cartas al director.*
  examples:
    - { es: "El Gobierno da luz verde a la reforma educativa pese a las críticas de la oposición.", en: "The government gives the green light to the education reform despite criticism from the opposition." }
    - { es: "El presunto autor del robo habría actuado solo, según fuentes policiales.", en: "The alleged perpetrator of the robbery allegedly acted alone, according to police sources." }
  drills:
    - { es: "Sube el paro por tercer mes consecutivo.", en: "Unemployment rises for the third month in a row." }
    - { es: "La ministra negó cualquier irregularidad.", en: "The minister denied any irregularity." }
- id: g.headlines
  level: c1
  title: "Headline and caption grammar"
  summary: "Ellipsis, nominal style, verbs in present, quotes with colon, abbreviations and numerals."
  explanation: |
    - Dropped articles and auxiliaries: *Detenido un hombre por…* (= Ha sido detenido)
    - Present for past: *Muere el escritor… Gana el Barça.*
    - Infinitive or noun for future/plan: *El Gobierno, a punto de aprobar… Plan para reducir…*
    - Colon for speech: *Rajoy: «Es un gran día».* Spanish uses « » quotes in the press.
    - Numerals: *20 muertos, 3,5 millones, un 15 %* (space before %).
    - Captions (*pies de foto*): present tense, no final full stop in many style guides, *ayer, en Madrid.*
    - Abbreviations: *EE. UU., CC. OO., ONU, PIB, IVA, RR. HH.*
  examples:
    - { es: "Hallado sano y salvo el niño desaparecido en la sierra.", en: "Missing boy found safe and sound in the mountains." }
    - { es: "Los reyes, ayer, durante la recepción en el Palacio Real", en: "The king and queen, yesterday, during the reception at the Royal Palace" }
  drills:
    - { es: "El paro baja un 2 % en abril.", en: "Unemployment falls 2% in April." }
    - { es: "Fallece a los 90 años el pintor sevillano.", en: "The Sevillian painter dies at 90." }
- id: g.quotation
  level: c1
  title: "Quotation and punctuation conventions"
  summary: "« » and \" \", the dash for dialogue, colon and inverted question marks, capitalisation rules."
  explanation: |
    - **Quotation marks**: hierarchy *«… “… ‘…’ …” …»*; punctuation goes **outside** the closing quote: *Dijo «no».*
    - **Dialogue** uses the long dash (raya) without spaces inside: *—¿Vienes? —preguntó Ana—. Es tarde.*
    - **Colon** introduces quotes and lists; after *Estimado señor:* in letters.
    - **¿ ¡** open every question / exclamation, even mid-sentence: *Si vienes, ¿me avisas?*
    - **Capitals**: not for days, months, languages, nationalities, titles (*el rey, el papa*), or after a colon (except quotes). Capitals for institutions (*el Ministerio de Educación*), proper names, the first word of titles (*Cien años de soledad*).
    - **Accents on capitals** are obligatory: *África, ÉL.*
    - **Decimal comma**, thousands with space or point: *3,5; 10 000 or 10.000.*
  examples:
    - { es: "—No sé —dijo ella—. Quizá mañana.", en: "“I don't know,” she said. “Maybe tomorrow.”" }
    - { es: "El director afirmó: «Nunca hemos recibido una queja».", en: "The director stated: \"We have never received a complaint.\"" }
  drills:
    - { es: "Si tienes tiempo, ¿me ayudas con esto?", en: "If you have time, can you help me with this?" }
    - { es: "Leímos Cien años de soledad en clase.", en: "We read One Hundred Years of Solitude in class." }
- id: g.word-formation
  level: c1
  title: "Word formation — derivation and composition"
  summary: "Building and decoding words: -ción, -miento, -dad, -ez, -able, -izar, des-, re-, in-, sobre-, compound nouns."
  explanation: |
    - **Nouns from verbs**: *-ción/-sión* (*traducción*), *-miento* (*crecimiento*), *-aje* (*aprendizaje*), *-ada/-ida* (*llegada, salida*), *-dor/-dora* (*trabajador, lavadora*), *-ante/-ente* (*cantante*).
    - **Nouns from adjectives**: *-dad* (*felicidad*), *-ez/-eza* (*vejez, belleza*), *-ura* (*altura*), *-ía* (*alegría*), *-ismo* (*optimismo*).
    - **Adjectives**: *-able/-ible* (*amable, increíble*), *-oso* (*peligroso*), *-al* (*nacional*), *-ivo* (*creativo*), *-ísimo*.
    - **Verbs**: *-ear* (*golpear*), *-izar* (*realizar*), *-ificar* (*clarificar*), *-ecer* (*envejecer*), *a-…-ar* (*aterrizar*), *en-…-ar* (*enriquecer*).
    - **Prefixes**: *des-/in-/im-/a-* (negation), *re-* (again / intensifier), *pre-/pos-*, *sobre-/sub-*, *anti-*, *auto-*, *inter-*, *tele-*, *súper-* / *hiper-*.
    - **Compounds**: *verb + noun* (*abrelatas, paraguas, sacacorchos, lavaplatos*), *noun + adjective* (*pelirrojo*), *adjective + noun* (*mediodía*), *noun + noun* (*bocacalle, telaraña*).
  examples:
    - { es: "El envejecimiento de la población es imparable.", en: "The ageing of the population is unstoppable." }
    - { es: "Necesito un sacacorchos y un abrelatas.", en: "I need a corkscrew and a tin opener." }
  drills:
    - { es: "La lavadora está estropeada.", en: "The washing machine is broken." }
    - { es: "Es una persona insoportable pero inteligentísima.", en: "He's an unbearable but extremely intelligent person." }
- id: g.prefixes-suffixes
  level: c1
  title: "Prefixes and suffixes with meaning shifts"
  summary: "Spotting nuance: -azo (blow), -ada (collective/action), -ero (container/trade), -eria (shop), -ismo/-ista, des- vs in-."
  explanation: |
    - **-azo**: blow or big: *portazo, codazo, puñetazo; cochazo.*
    - **-ada**: action or group: *mirada, patada, llamada; manada, docena.*
    - **-ero/-era**: trade or container: *panadero, zapatero; azucarero, papelera, cartera.*
    - **-ería**: shop or quality: *panadería, librería; tontería, grosería.*
    - **-ismo / -ista**: doctrine / follower: *ecologismo, ecologista.*
    - **-dero/-dor** place/instrument: *comedor, lavadero, mirador.*
    - **des-** undoes (*deshacer, desconectar*) vs **in-/im-/i-** negates a quality (*inútil, imposible, ilegal*).
    - **re-**: again (*releer*) or very (*rebueno*, colloquial).
    - **-ón** (big / abrupt / person): *empujón, tirón; llorón, dormilón.*
    - Suffixes can change gender: *el manzano / la manzana, el cerezo / la cereza* (tree / fruit).
  examples:
    - { es: "Dio un portazo y se fue sin decir nada.", en: "He slammed the door and left without a word." }
    - { es: "Mi hijo es un dormilón: duerme doce horas.", en: "My son is a sleepyhead: he sleeps twelve hours." }
  drills:
    - { es: "Hay una papelera al lado de la panadería.", en: "There's a bin next to the bakery." }
    - { es: "Deja de decir tonterías.", en: "Stop talking nonsense." }
- id: g.false-friends-advanced
  level: c1
  title: "False friends and tricky pairs"
  summary: "actual, realizar, asistir, embarazada, éxito, carpeta, constipado, sensible, discutir, ignorar, pretender."
  explanation: |
    | Spanish | means | not |
    |---|---|---|
    | *actualmente* | currently | actually (= *en realidad*) |
    | *realizar* | carry out | realise (= *darse cuenta*) |
    | *asistir a* | attend | assist (= *ayudar*) |
    | *embarazada* | pregnant | embarrassed (= *avergonzado*) |
    | *éxito* | success | exit (= *salida*) |
    | *carpeta* | folder | carpet (= *alfombra*) |
    | *constipado* | having a cold | constipated (= *estreñido*) |
    | *sensible* | sensitive | sensible (= *sensato*) |
    | *discutir* | argue | discuss (= *hablar de, debatir*) |
    | *ignorar* | not know / ignore | — (both exist; context) |
    | *pretender* | aim to | pretend (= *fingir*) |
    | *soportar* | bear, put up with | support (= *apoyar*) |
    | *librería* | bookshop | library (= *biblioteca*) |
    | *introducir* | insert | introduce a person (= *presentar*) |
    | *recordar* | remember / remind | record (= *grabar*) |
    | *suceso* | event, incident | success (= *éxito*) |
    | *largo* | long | large (= *grande*) |
    | *molestar* | bother | molest (= *abusar de*) |
    | *compromiso* | commitment | compromise (= *acuerdo*) |
  examples:
    - { es: "Actualmente trabajo en una librería, pero en realidad soy bibliotecario.", en: "Currently I work in a bookshop, but actually I'm a librarian." }
    - { es: "No pretendo ser perfecto; solo intento mejorar.", en: "I don't aim to be perfect; I just try to improve." }
  drills:
    - { es: "Estoy constipado, no estreñido.", en: "I have a cold, I'm not constipated." }
    - { es: "Fue un éxito; la salida está por allí.", en: "It was a success; the exit is over there." }
- id: g.c1-review
  level: c1
  title: "C1 review — flexibility, precision and register"
  summary: "Mood for nuance, complex syntax, cohesive formal texts, idiomatic and pragmatic competence, reading literature and press critically."
  explanation: |
    At C1 you should be able to:
    - choose indicative or subjunctive to **shade meaning**, not just to follow triggers;
    - build **long, controlled sentences** with correlatives, absolute clauses and clear reference;
    - write **cohesive formal texts** (reports, essays, letters) with academic connectors and nominalisation;
    - recognise and use **idioms, proverbs and fixed phrases** appropriately for the register;
    - read **press and literature** critically, spotting attribution, irony, literary devices and archaic forms;
    - handle **pragmatics**: indirect requests, softeners, humour, politeness across varieties.

    Remaining frontier (C2): dialect and sociolect, Golden Age and modern literature in depth, rhetoric, translation nuance, specialised registers, wordplay.
  examples:
    - { es: "Si bien el estudio es riguroso, cabe cuestionar que sus conclusiones sean extrapolables, lo cual, dicho sea de paso, reconocen los propios autores.", en: "While the study is rigorous, it is questionable whether its conclusions can be generalised, which, incidentally, the authors themselves acknowledge." }
  drills:
    - { es: "Fuera cual fuera el motivo, la reacción fue desproporcionada.", en: "Whatever the reason, the reaction was disproportionate." }
    - { es: "Que yo recuerde, nunca se habló de ello.", en: "As far as I remember, it was never discussed." }
