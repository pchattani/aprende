id: a2.u06
title: Pronombres
lessons:
  - id: a2.u06.l1
    title: Lo, la, los, las
    teach: [g.direct-object-pronouns]
    vocab: [w.devolver, w.prestar, w.guardar, w.entregar, w.boligrafo, w.cuaderno, w.diccionario, w.lapiz, w.goma, w.rotulador, w.fecha, w.pedir-prestado]
    sentences:
      - { es: "¿Tienes mi bolígrafo? Sí, lo tengo aquí.", en: "Do you have my pen? Yes, I have it here.", altEs: ["¿Tienes mi bolígrafo? Sí, aquí lo tengo."], grammar: [g.direct-object-pronouns], vocab: [w.boligrafo] }
      - { es: "¿Me prestas tu diccionario? Te lo devuelvo mañana.", en: "Can you lend me your dictionary? I'll give it back to you tomorrow.", grammar: [g.double-object-pronouns], vocab: [w.prestar, w.diccionario, w.devolver] }
      - { es: "He perdido el cuaderno. ¿Lo has visto?", en: "I've lost my notebook. Have you seen it?", altEs: ["Perdí el cuaderno. ¿Lo has visto?"], grammar: [g.direct-object-pronouns], vocab: [w.cuaderno, w.ver] }
      - { es: "Los lápices los guardo en el cajón.", en: "I keep the pencils in the drawer.", altEs: ["Guardo los lápices en el cajón."], grammar: [g.pronoun-redundancy], vocab: [w.lapiz, w.guardar] }
      - { es: "La goma la necesito ahora.", en: "I need the eraser now.", altEs: ["Necesito la goma ahora."], grammar: [g.direct-object-pronouns], vocab: [w.goma, w.necesitar] }
      - { es: "¿Conoces a mi hermana? Sí, la conocí en tu fiesta.", en: "Do you know my sister? Yes, I met her at your party.", grammar: [g.direct-object-pronouns, g.a-personal], vocab: [w.conocer, w.hermana] }
      - { es: "Te quiero mucho.", en: "I love you a lot.", grammar: [g.direct-object-pronouns], vocab: [w.querer] }
      - { es: "¿Nos esperas en la puerta?", en: "Will you wait for us at the door?", altEs: ["¿Nos esperas en la entrada?"], grammar: [g.direct-object-pronouns], vocab: [w.esperar, w.puerta] }
      - { es: "Los deberes hay que entregarlos el viernes.", en: "The homework has to be handed in on Friday.", grammar: [g.pronoun-placement], vocab: [w.entregar, w.deberes] }
      - { es: "He pedido prestados unos rotuladores.", en: "I've borrowed some marker pens.", grammar: [g.present-perfect], vocab: [w.pedir-prestado, w.rotulador] }
      - { es: "¿Sabes la fecha del examen? No, no la sé.", en: "Do you know the date of the exam? No, I don't know it.", altEs: ["¿Sabes la fecha del examen? No, no lo sé."], grammar: [g.direct-object-pronouns], vocab: [w.fecha, w.saber] }
      - { es: "No lo entiendo. ¿Puedes repetirlo?", en: "I don't understand it. Can you repeat it?", grammar: [g.pronoun-placement], vocab: [w.entender, w.repetir], error: { wrong: "No entiendo lo. ¿Puedes repetir lo?", explain: "Pronouns go before a conjugated verb (lo entiendo) or attached to the infinitive (repetirlo).", grammar: g.pronoun-placement } }
      - { es: "Compré las entradas ayer.", en: "I bought the tickets yesterday.", altEs: ["Ayer compré las entradas."], grammar: [g.direct-object-pronouns], vocab: [w.comprar, w.entrada], transform: { instruction: "Replace 'las entradas' with a pronoun", answer: "Las compré ayer." } }
    exchanges:
      - q: { es: "¿Tienes mi bolígrafo?", en: "Do you have my pen?" }
        a: { es: "Sí, lo tengo aquí.", en: "Yes, I have it here." }
        alt: ["Sí, aquí lo tengo.", "No, no lo tengo."]
        grammar: [g.direct-object-pronouns]
        vocab: [w.boligrafo]
      - q: { es: "¿Me prestas tu diccionario?", en: "Can you lend me your dictionary?" }
        a: { es: "Claro, pero devuélvemelo mañana.", en: "Of course, but give it back to me tomorrow." }
        alt: ["Sí, claro.", "Sí, te lo presto."]
        grammar: [g.double-object-pronouns, g.pronoun-placement]
        vocab: [w.prestar, w.diccionario, w.devolver]
      - q: { es: "¿Has visto mi cuaderno?", en: "Have you seen my notebook?" }
        a: { es: "No, no lo he visto.", en: "No, I haven't seen it." }
        alt: ["Sí, lo he visto en la mesa.", "No."]
        grammar: [g.direct-object-pronouns, g.participles-irregular]
        vocab: [w.cuaderno, w.ver]
      - q: { es: "¿Sabes la fecha del examen?", en: "Do you know the date of the exam?" }
        a: { es: "No, no la sé.", en: "No, I don't know it." }
        alt: ["Sí, es el viernes.", "No la sé."]
        grammar: [g.direct-object-pronouns]
        vocab: [w.fecha, w.saber]
      - q: { es: "¿Cuándo hay que entregar los deberes?", en: "When does the homework have to be handed in?" }
        a: { es: "Hay que entregarlos el viernes.", en: "It has to be handed in on Friday." }
        alt: ["El viernes.", "Los entregamos el viernes."]
        grammar: [g.pronoun-placement]
        vocab: [w.entregar, w.deberes]
    texts:
      - title: "Mensaje de la profesora"
        es: ["Los deberes hay que entregarlos el viernes.", "Si no los entendéis, preguntadme en clase.", "Y traed el diccionario: lo vamos a necesitar."]
        en: ["The homework has to be handed in on Friday.", "If you don't understand it, ask me in class.", "And bring the dictionary: we're going to need it."]
        grammar: [g.direct-object-pronouns, g.pronoun-placement]
        vocab: [w.entregar, w.deberes, w.diccionario]
  - id: a2.u06.l2
    title: Le, les
    teach: [g.indirect-object-pronouns]
    vocab: [w.regalar, w.contar, w.explicar, w.ensenar, w.mostrar, w.traer, w.recomendar, w.ofrecer, w.carta, w.paquete, w.consejo, w.ayuda, w.respuesta, w.informacion, w.opinion, w.cartero]
    sentences:
      - { es: "Le he regalado un libro a mi padre.", en: "I've given my father a book.", altEs: ["Le regalé un libro a mi padre."], grammar: [g.indirect-object-pronouns], vocab: [w.regalar, w.libro] }
      - { es: "¿Me cuentas qué pasó?", en: "Will you tell me what happened?", altEs: ["¿Me cuentas lo que pasó?"], grammar: [g.indirect-object-pronouns], vocab: [w.contar] }
      - { es: "La profesora nos explica la gramática muy bien.", en: "The teacher explains the grammar to us very well.", altEs: ["La profesora nos explica muy bien la gramática."], grammar: [g.indirect-object-pronouns], vocab: [w.explicar, w.profesor] }
      - { es: "Mi abuela me enseñó a cocinar.", en: "My grandmother taught me to cook.", altEs: ["Mi abuela me ha enseñado a cocinar."], grammar: [g.indirect-object-pronouns], vocab: [w.ensenar, w.cocinar] }
      - { es: "¿Les has mostrado las fotos a tus amigos?", en: "Have you shown the photos to your friends?", grammar: [g.indirect-object-pronouns], vocab: [w.mostrar, w.foto] }
      - { es: "El cartero le ha traído un paquete.", en: "The postman has brought her a parcel.", grammar: [g.indirect-object-pronouns], vocab: [w.traer, w.paquete, w.cartero] }
      - { es: "Te recomiendo este restaurante.", en: "I recommend this restaurant to you.", altEs: ["Yo te recomiendo este restaurante."], grammar: [g.indirect-object-pronouns], vocab: [w.recomendar, w.restaurante] }
      - { es: "Nos ofrecieron un café y un consejo.", en: "They offered us a coffee and some advice.", grammar: [g.indirect-object-pronouns], vocab: [w.ofrecer, w.consejo] }
      - { es: "Le escribí una carta a mi abuela.", en: "I wrote a letter to my grandmother.", altEs: ["Escribí una carta a mi abuela."], grammar: [g.indirect-object-pronouns], vocab: [w.carta, w.escribir] }
      - { es: "¿Me das tu opinión?", en: "Will you give me your opinion?", grammar: [g.indirect-object-pronouns], vocab: [w.opinion, w.dar] }
      - { es: "Les pedí ayuda a mis vecinos.", en: "I asked my neighbours for help.", altEs: ["Pedí ayuda a mis vecinos."], grammar: [g.indirect-object-pronouns], vocab: [w.ayuda, w.pedir] }
      - { es: "Todavía no me han dado una respuesta.", en: "They still haven't given me an answer.", altEs: ["Todavía no me han dado ninguna respuesta."], grammar: [g.indirect-object-pronouns], vocab: [w.respuesta, w.dar] }
      - { es: "¿Le has preguntado al médico? Sí, le he pedido información.", en: "Have you asked the doctor? Yes, I've asked him for information.", grammar: [g.indirect-object-pronouns], vocab: [w.informacion, w.preguntar], error: { wrong: "¿Lo has preguntado al médico?", explain: "Asking someone takes the indirect pronoun: le has preguntado.", grammar: g.indirect-object-pronouns } }
      - { es: "Mi hermano me presta dinero.", en: "My brother lends me money.", grammar: [g.indirect-object-pronouns], vocab: [w.prestar, w.dinero], transform: { instruction: "Change 'me' to 'us'", answer: "Mi hermano nos presta dinero." } }
    exchanges:
      - q: { es: "¿Qué le has regalado a tu padre?", en: "What have you given your father?" }
        a: { es: "Le he regalado un libro.", en: "I've given him a book." }
        alt: ["Un libro.", "Le regalé un libro."]
        grammar: [g.indirect-object-pronouns]
        vocab: [w.regalar, w.libro]
      - q: { es: "¿Me cuentas qué pasó?", en: "Will you tell me what happened?" }
        a: { es: "Claro, te lo cuento ahora.", en: "Of course, I'll tell you now." }
        alt: ["Sí, claro.", "Ahora te lo cuento."]
        grammar: [g.indirect-object-pronouns, g.double-object-pronouns]
        vocab: [w.contar]
      - q: { es: "¿Quién te enseñó a cocinar?", en: "Who taught you to cook?" }
        a: { es: "Me enseñó mi abuela.", en: "My grandmother taught me." }
        alt: ["Mi abuela.", "Mi abuela me enseñó."]
        grammar: [g.indirect-object-pronouns]
        vocab: [w.ensenar, w.cocinar]
      - q: { es: "¿Te han dado ya una respuesta?", en: "Have they given you an answer yet?" }
        a: { es: "No, todavía no me han dado ninguna respuesta.", en: "No, they still haven't given me any answer." }
        alt: ["Todavía no.", "Sí, me han dicho que sí."]
        grammar: [g.indirect-object-pronouns, g.ya-todavia]
        vocab: [w.respuesta, w.dar]
    texts:
      - title: "Nota para el cartero"
        es: ["Buenos días.", "Si no estoy en casa, deje el paquete a mi vecina del segundo piso.", "Ella me lo entregará por la tarde.", "Gracias."]
        en: ["Good morning.", "If I'm not at home, leave the parcel with my neighbour on the second floor.", "She'll hand it to me in the afternoon.", "Thank you."]
        grammar: [g.indirect-object-pronouns, g.imperative-usted]
        vocab: [w.cartero, w.paquete, w.entregar]
  - id: a2.u06.l3
    title: Se lo doy
    teach: [g.double-object-pronouns]
    tip: "le + lo = se lo. Indirect before direct: me lo, te la, se los."
    vocab: [w.se, w.vender, w.agradecer, w.mentira, w.secreto, w.factura, w.prestamo, w.flores.phr, w.pulsera, w.anillo, w.reloj.phr, w.portero, w.sobre.noun, w.sello, w.direccion]
    sentences:
      - { es: "¿Me das tu número? Sí, te lo doy ahora.", en: "Will you give me your number? Yes, I'll give it to you now.", grammar: [g.double-object-pronouns], vocab: [w.numero, w.dar] }
      - { es: "Le compré una pulsera a Marta y se la di en su cumpleaños.", en: "I bought Marta a bracelet and gave it to her on her birthday.", grammar: [g.double-object-pronouns], vocab: [w.pulsera, w.cumpleanos], error: { wrong: "Le compré una pulsera a Marta y le la di en su cumpleaños.", explain: "le becomes se before la: se la di.", grammar: g.double-object-pronouns } }
      - { es: "¿Las llaves? Se las he dejado al portero.", en: "The keys? I've left them with the porter.", grammar: [g.double-object-pronouns], vocab: [w.llave, w.portero] }
      - { es: "El anillo se lo regaló su abuela.", en: "Her grandmother gave her the ring.", grammar: [g.double-object-pronouns], vocab: [w.anillo, w.regalar] }
      - { es: "Nos lo explicó muy bien.", en: "He explained it to us very well.", altEs: ["Él nos lo explicó muy bien."], grammar: [g.double-object-pronouns], vocab: [w.explicar] }
      - { es: "¿Puedes enviármelo mañana?", en: "Can you send it to me tomorrow?", altEs: ["¿Me lo puedes enviar mañana?"], grammar: [g.pronoun-placement], vocab: [w.enviar] }
      - { es: "Te lo agradezco mucho.", en: "I'm very grateful to you for it.", altEs: ["Te lo agradezco de verdad."], grammar: [g.double-object-pronouns], vocab: [w.agradecer] }
      - { es: "Es un secreto; no se lo digas a nadie.", en: "It's a secret; don't tell anyone.", grammar: [g.imperative-negative, g.double-object-pronouns], vocab: [w.secreto, w.decir] }
      - { es: "Me vendió el coche y me lo trajo a casa.", en: "He sold me the car and brought it to my house.", altEs: ["Me vendió el coche y me lo llevó a casa."], grammar: [g.double-object-pronouns], vocab: [w.vender, w.traer] }
      - { es: "La factura se la mandan al cliente por correo.", en: "They send the invoice to the customer by post.", altEs: ["La factura se la envían al cliente por correo."], grammar: [g.double-object-pronouns], vocab: [w.factura, w.enviar.phr] }
      - { es: "El banco nos ha dado el préstamo.", en: "The bank has given us the loan.", altEs: ["El banco nos dio el préstamo."], grammar: [g.indirect-object-pronouns], vocab: [w.prestamo, w.banco] }
      - { es: "Compré un sobre y un sello y escribí la dirección.", en: "I bought an envelope and a stamp and wrote the address.", grammar: [g.preterite-regular], vocab: [w.sobre.noun, w.sello, w.direccion] }
      - { es: "Le llevé un ramo de flores a mi madre.", en: "I took my mother a bunch of flowers.", grammar: [g.indirect-object-pronouns], vocab: [w.flores.phr, w.llevar], transform: { instruction: "Replace 'un ramo de flores' with a pronoun", answer: "Se lo llevé a mi madre." } }
      - { es: "Eso es mentira: nunca me lo dijo.", en: "That's a lie: he never told me.", altEs: ["Eso es mentira: jamás me lo dijo."], grammar: [g.double-object-pronouns], vocab: [w.mentira, w.decir] }
    exchanges:
      - q: { es: "¿Me das tu número?", en: "Will you give me your number?" }
        a: { es: "Sí, te lo doy ahora.", en: "Yes, I'll give it to you now." }
        alt: ["Claro, te lo doy.", "Sí, ahora te lo doy."]
        grammar: [g.double-object-pronouns]
        vocab: [w.numero, w.dar]
      - q: { es: "¿Quién le regaló el anillo?", en: "Who gave her the ring?" }
        a: { es: "Se lo regaló su abuela.", en: "Her grandmother gave it to her." }
        alt: ["Su abuela.", "Su abuela se lo regaló."]
        grammar: [g.double-object-pronouns]
        vocab: [w.anillo, w.regalar]
      - q: { es: "¿Dónde están las llaves?", en: "Where are the keys?" }
        a: { es: "Se las he dejado al portero.", en: "I've left them with the porter." }
        alt: ["Las tiene el portero.", "Se las di al portero."]
        grammar: [g.double-object-pronouns]
        vocab: [w.llave, w.portero]
      - q: { es: "¿Puedes enviármelo mañana?", en: "Can you send it to me tomorrow?" }
        a: { es: "Sí, te lo envío mañana por la mañana.", en: "Yes, I'll send it to you tomorrow morning." }
        alt: ["Sí, claro.", "Sí, mañana te lo envío."]
        grammar: [g.pronoun-placement, g.double-object-pronouns]
        vocab: [w.enviar]
    texts:
      - title: "Mensaje de Marta"
        es: ["Le compré la pulsera a Lucía.", "Se la doy el sábado en la fiesta.", "Es un secreto, no se lo digas a nadie."]
        en: ["I bought the bracelet for Lucía.", "I'll give it to her on Saturday at the party.", "It's a secret, don't tell anyone."]
        grammar: [g.double-object-pronouns, g.imperative-negative]
        vocab: [w.pulsera, w.secreto]
  - id: a2.u06.l4
    title: ¿Dónde va el pronombre?
    teach: [g.pronoun-placement]
    vocab: [w.favor.phr, w.verdad.phr, w.gracias.phr, w.enviar.phr, w.perdonar, w.creer.phr, w.hacer-caso]
    sentences:
      - { es: "Quiero verlo. — Lo quiero ver.", en: "I want to see it.", altEs: ["Lo quiero ver."], grammar: [g.pronoun-placement], vocab: [w.ver, w.querer] }
      - { es: "Estoy haciéndolo ahora mismo.", en: "I'm doing it right now.", altEs: ["Lo estoy haciendo ahora mismo."], grammar: [g.pronoun-placement], vocab: [w.hacer] }
      - { es: "Dímelo, por favor.", en: "Tell me, please.", altEs: ["Por favor, dímelo."], grammar: [g.pronoun-placement], vocab: [w.decir] }
      - { es: "No me lo digas.", en: "Don't tell me.", altEs: ["No me lo cuentes."], grammar: [g.imperative-negative], vocab: [w.decir], error: { wrong: "No dímelo.", explain: "With a negative command the pronouns go before the verb: no me lo digas.", grammar: g.pronoun-placement } }
      - { es: "¿Me haces un favor? Claro, dime.", en: "Can you do me a favour? Of course, tell me.", grammar: [g.pronoun-placement], vocab: [w.favor.phr] }
      - { es: "Dile la verdad.", en: "Tell him the truth.", altEs: ["Cuéntale la verdad."], grammar: [g.pronoun-placement], vocab: [w.verdad.phr, w.decir] }
      - { es: "Tenemos que darles las gracias.", en: "We have to thank them.", altEs: ["Les tenemos que dar las gracias."], grammar: [g.pronoun-placement], vocab: [w.gracias.phr] }
      - { es: "Mándame un mensaje cuando llegues.", en: "Send me a message when you arrive.", altEs: ["Envíame un mensaje cuando llegues."], grammar: [g.pronoun-placement], vocab: [w.enviar.phr, w.mensaje] }
      - { es: "Perdóname, no quería molestarte.", en: "Forgive me, I didn't mean to bother you.", altEs: ["Perdóname, no quería molestar."], grammar: [g.pronoun-placement], vocab: [w.perdonar, w.molestar] }
      - { es: "¿Me crees? — Sí, te creo.", en: "Do you believe me? — Yes, I believe you.", grammar: [g.direct-object-pronouns], vocab: [w.creer.phr] }
      - { es: "No le hagas caso.", en: "Don't pay attention to him.", grammar: [g.imperative-negative], vocab: [w.hacer-caso] }
      - { es: "Voy a comprármelo.", en: "I'm going to buy it for myself.", altEs: ["Me lo voy a comprar."], grammar: [g.pronoun-placement], vocab: [w.comprar] }
      - { es: "Levántate y vístete.", en: "Get up and get dressed.", altEs: ["Levántate y ponte la ropa."], grammar: [g.pronoun-placement], vocab: [w.levantarse, w.vestirse] }
      - { es: "Se lo voy a explicar.", en: "I'm going to explain it to her.", altEs: ["Voy a explicárselo."], grammar: [g.pronoun-placement], vocab: [w.explicar], transform: { instruction: "Attach the pronouns to the infinitive", answer: "Voy a explicárselo." } }
    exchanges:
      - q: { es: "¿Me haces un favor?", en: "Can you do me a favour?" }
        a: { es: "Claro, dime.", en: "Of course, tell me." }
        alt: ["Sí, claro.", "Depende, ¿qué favor?"]
        grammar: [g.pronoun-placement]
        vocab: [w.favor.phr]
      - q: { es: "¿Qué hago con el paquete?", en: "What do I do with the parcel?" }
        a: { es: "Dáselo al portero.", en: "Give it to the porter." }
        alt: ["Se lo das al portero.", "Déjaselo al portero."]
        grammar: [g.pronoun-placement, g.double-object-pronouns]
        vocab: [w.paquete, w.dar]
      - q: { es: "¿Me crees?", en: "Do you believe me?" }
        a: { es: "Sí, te creo.", en: "Yes, I believe you." }
        alt: ["Claro que te creo.", "No, no te creo."]
        grammar: [g.direct-object-pronouns]
        vocab: [w.creer.phr]
      - q: { es: "¿Te lo explico otra vez?", en: "Shall I explain it to you again?" }
        a: { es: "Sí, explícamelo otra vez, por favor.", en: "Yes, explain it to me again, please." }
        alt: ["Sí, por favor.", "No, ya lo entiendo."]
        grammar: [g.pronoun-placement]
        vocab: [w.explicar, w.repetir]
    texts:
      - title: "Mensaje de mamá"
        es: ["Levántate ya, que son las ocho.", "El desayuno está en la cocina; cómetelo todo.", "Mándame un mensaje cuando llegues al instituto."]
        en: ["Get up now, it's eight o'clock.", "Breakfast is in the kitchen; eat it all.", "Send me a message when you get to school."]
        grammar: [g.pronoun-placement, g.imperative-tu]
        vocab: [w.levantarse, w.desayuno, w.enviar.phr]
dialogues:
  - id: a2.u06.d1
    title: El regalo
    context: Marta and Tom decide what to give their friend Lucía for her birthday.
    lines:
      - { speaker: Marta, es: "El sábado es el cumpleaños de Lucía. ¿Qué le regalamos?", en: "Saturday is Lucía's birthday. What shall we give her?" }
      - { speaker: Tom, es: "¿Un libro? Le gusta mucho leer.", en: "A book? She loves reading." }
      - { speaker: Marta, es: "Ya se lo regalé yo el año pasado. ¿Y una pulsera?", en: "I already gave her one last year. What about a bracelet?" }
      - { speaker: Tom, es: "Buena idea. ¿La compramos juntos? Yo te doy la mitad del dinero.", en: "Good idea. Shall we buy it together? I'll give you half the money." }
      - { speaker: Marta, es: "Vale. La vi en una tienda del centro. Se la enseño a Pablo primero para saber su opinión.", en: "OK. I saw one in a shop in the centre. I'll show it to Pablo first to get his opinion." }
      - { speaker: Tom, es: "¿Y la tarjeta? ¿La escribes tú?", en: "And the card? Will you write it?" }
      - { speaker: Marta, es: "Sí, la escribo yo y tú se la das en la fiesta.", en: "Yes, I'll write it and you give it to her at the party." }
      - { speaker: Tom, es: "Perfecto. Oye, ¿me prestas veinte euros hasta el viernes? Te los devuelvo sin falta.", en: "Perfect. Hey, can you lend me twenty euros until Friday? I'll pay you back without fail." }
      - { speaker: Marta, es: "¡Siempre me pides dinero! Toma, pero no se lo digas a nadie.", en: "You're always asking me for money! Here, but don't tell anyone." }
      - { speaker: Tom, es: "Gracias, te lo agradezco mucho.", en: "Thanks, I really appreciate it." }
    questions:
