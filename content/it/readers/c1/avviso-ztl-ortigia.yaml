id: r.c1.avviso-ztl-ortigia
level: c1
title: L'avviso e la traduzione
kind: text
intro: "A (fictional) notice from the municipality of Syracuse about the limited-traffic zone on the island of Ortigia, followed by a local blogger's plain-Italian 'translation'. Compare the two registers: bureaucratic Italian (il sottoscritto, ai sensi di, previa, si rende noto, participio assoluto) against everyday Italian. This is the contrast of c1.u03."
allow: [siracusa, ortigia, ztl, brenta, blog, p, v]
paragraphs:
  - { es: "COMUNE DI SIRACUSA – Settore Mobilità e Trasporti. AVVISO. Oggetto: disciplina della Zona a Traffico Limitato (ZTL) dell'isola di Ortigia nel periodo estivo.", en: "MUNICIPALITY OF SYRACUSE – Mobility and Transport Department. NOTICE. Subject: rules for the Limited Traffic Zone (ZTL) on the island of Ortigia during the summer period." }
  - { es: "Si rende noto che, ai sensi dell'ordinanza dirigenziale in data odierna, a decorrere dal 1° giugno e fino al 30 settembre p.v. l'accesso dei veicoli a motore all'interno della ZTL di Ortigia è consentito esclusivamente ai titolari di apposita autorizzazione, nelle fasce orarie indicate dalla segnaletica. Il transito non autorizzato sarà rilevato mediante il sistema elettronico di controllo dei varchi e comporterà l'applicazione delle sanzioni previste dalla normativa vigente.", en: "Notice is hereby given that, pursuant to the executive order of today's date, from 1 June until 30 September next, access for motor vehicles within the Ortigia ZTL is permitted exclusively to holders of the appropriate authorisation, during the times indicated by the road signs. Unauthorised transit will be detected by the electronic gate-control system and will entail the application of the penalties provided for by current legislation." }
  - { es: "I residenti e i soggetti aventi diritto possono richiedere il rilascio del permesso, previa presentazione della domanda redatta sull'apposito modulo, corredata da copia del documento di identità e del libretto di circolazione. Le istanze dovranno pervenire entro e non oltre il 20 maggio p.v. Decorso tale termine, le domande non saranno prese in considerazione. Si prega di non inviare documentazione incompleta.", en: "Residents and other entitled parties may apply for the issue of a permit, subject to submission of an application completed on the appropriate form, accompanied by a copy of their identity document and vehicle registration document. Applications must arrive no later than 20 May next. After that deadline, applications will not be considered. Please do not send incomplete documentation." }
  - { es: "Per ogni ulteriore informazione, la cittadinanza potrà rivolgersi agli uffici del Settore, siti in via Brenta, nei giorni e negli orari di apertura al pubblico. Il Dirigente del Settore.", en: "For any further information, citizens may contact the Department's offices, located in Via Brenta, on the days and at the times when they are open to the public. The Head of Department." }
  - { es: "Fin qui l'avviso. Lo hanno letto in molti, l'hanno capito in pochi. Per questo, sul mio blog, ho deciso di tradurlo. Sì, tradurlo: dall'italiano burocratico all'italiano che parliamo tutti i giorni al bar. Ci ho messo dieci minuti, due caffè e un po' di pazienza. Eccolo.", en: "That's the notice. Many people read it, few understood it. That's why, on my blog, I decided to translate it. Yes, translate it: from bureaucratic Italian into the Italian we all speak every day at the bar. It took me ten minutes, two coffees and a bit of patience. Here it is." }
  - { es: "Dal primo giugno al trenta settembre, in macchina o in moto, in Ortigia potete entrare solo se avete un permesso. Gli orari in cui non si entra li trovate scritti sui cartelli all'ingresso dell'isola. Attenzione: ci sono le telecamere. Se entrate senza permesso, vi fotografano la targa e qualche settimana dopo vi arriva a casa la multa. Niente scuse.", en: "From the first of June to the thirtieth of September, by car or by motorbike, you can only get into Ortigia if you've got a permit. You'll find the times when you can't go in written on the signs at the entrance to the island. Watch out: there are cameras. If you drive in without a permit, they photograph your number plate and a few weeks later the fine arrives at your house. No excuses." }
  - { es: "Chi può avere il permesso? Chi abita in Ortigia e qualche altra categoria (per esempio chi ci lavora o chi ha un posto auto privato: per i dettagli, chiedete in Comune). Come si chiede? Riempite il modulo, ci attaccate una fotocopia della carta d'identità e del libretto della macchina, e lo consegnate. Quando? Entro il venti maggio. Non il ventuno: il venti. Se arrivate tardi, la domanda finisce nel cestino. E non dimenticate niente, perché se manca un foglio vi rimandano indietro.", en: "Who can get a permit? People who live in Ortigia and a few other categories (for example people who work there or who have a private parking space: for the details, ask at the town hall). How do you apply? Fill in the form, attach a photocopy of your ID card and your car's registration document, and hand it in. When? By the twentieth of May. Not the twenty-first: the twentieth. If you're late, your application goes in the bin. And don't forget anything, because if a sheet is missing they'll send you back." }
  - { es: "Avete domande? Andate negli uffici di via Brenta, quando sono aperti. Fine.", en: "Got questions? Go to the offices in Via Brenta when they're open. That's it." }
  - { es: "Notate una cosa: nell'avviso nessuno fa niente. Non c'è mai qualcuno che agisce: «si rende noto», «sarà rilevato», «le istanze dovranno pervenire». Le domande arrivano da sole, le multe partono da sole. È un trucco tipico della burocrazia: con il passivo e il si impersonale, l'amministrazione non dice mai chi decide e chi è responsabile. Nella mia versione, invece, ci sono delle persone: voi che entrate in macchina, loro che vi fotografano, l'impiegato che vi rimanda indietro. Il contenuto è lo stesso, ma adesso si capisce chi fa che cosa.", en: "Notice one thing: in the notice nobody does anything. There's never anyone acting: 'notice is given', 'will be detected', 'applications must arrive'. Applications arrive by themselves, fines go out by themselves. It's a typical bureaucratic trick: with the passive and impersonal si, the administration never says who decides and who is responsible. In my version, on the other hand, there are people: you driving in, them photographing you, the clerk sending you back. The content is the same, but now you can see who does what." }
  - { es: "Qualcuno mi ha scritto che esagero, che il linguaggio della pubblica amministrazione deve essere preciso e che la precisione ha un prezzo. È vero in parte. Espressioni come «entro e non oltre» o «previa presentazione» hanno un significato giuridico chiaro, e un avviso ufficiale non può parlare come un amico al bar. Ma un testo pubblico che la maggior parte dei cittadini non capisce ha fallito il suo scopo principale. Non a caso, già da anni esistono linee guida per semplificare il linguaggio amministrativo: frasi brevi, verbi attivi, parole comuni. Basterebbe applicarle.", en: "Someone wrote to tell me I'm exaggerating, that the language of public administration has to be precise and that precision has a price. That's partly true. Expressions like 'no later than' or 'subject to submission' have a clear legal meaning, and an official notice can't talk like a friend at the bar. But a public text that most citizens don't understand has failed in its main purpose. It's no coincidence that for years there have been guidelines for simplifying administrative language: short sentences, active verbs, common words. It would be enough to apply them." }
  - { es: "Nel frattempo, se ricevete una lettera del Comune e non capite niente, mandatemela pure. La traduzione è gratuita, come il caffè che mi offrirete per ringraziarmi.", en: "Meanwhile, if you receive a letter from the council and don't understand a thing, feel free to send it to me. The translation is free – like the coffee you'll buy me to say thank you." }
questions:
  - { q: "Che cosa significa «a decorrere dal 1° giugno»?", options: ["Fino al 1° giugno", "A partire dal 1° giugno", "Solo il 1° giugno"], answer: 1, explain: "a decorrere da = a partire da (starting from). Bureaucratic Italian prefers such fixed formulas." }
  - { q: "Nella frase «Decorso tale termine, le domande non saranno prese in considerazione», «decorso tale termine» è…", options: ["un participio assoluto: «quando questo termine sarà passato»", "un imperativo", "un gerundio composto"], answer: 0, explain: "A participio assoluto: a past participle agreeing with its own noun (tale termine) = once this deadline has passed." }
  - { q: "Che cosa succede, secondo la traduzione, a chi entra in Ortigia senza permesso?", options: ["Viene fermato dai vigili all'ingresso", "Le telecamere fotografano la targa e arriva una multa a casa", "Deve tornare indietro, ma non paga niente"], answer: 1, explain: "«vi fotografano la targa e qualche settimana dopo vi arriva a casa la multa» = «sarà rilevato… e comporterà l'applicazione delle sanzioni»." }
  - { q: "Quali documenti bisogna allegare alla domanda?", options: ["Solo il modulo", "Una copia della carta d'identità e del libretto di circolazione", "Il passaporto e una foto"], answer: 1, explain: "«corredata da copia del documento di identità e del libretto di circolazione»." }
  - { q: "Qual è l'opinione finale del blogger sul linguaggio burocratico?", options: ["Va eliminato completamente", "La precisione è importante, ma un testo che i cittadini non capiscono ha fallito il suo scopo", "È perfetto così com'è"], answer: 1, explain: "He concedes a point («È vero in parte») and then rebuts it («Ma un testo pubblico che… non capisce ha fallito il suo scopo»)." }
