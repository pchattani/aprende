        vocab: [w.compleanno, w.novanta, w.insieme]
      - title: "Domande per Tom"
        es: ["Quanti anni hai, Tom?", "Quando è il tuo compleanno?", "E perché sei a Roma da solo?"]
        en: ["How old are you, Tom?", "When is your birthday?", "And why are you in Rome on your own?"]
