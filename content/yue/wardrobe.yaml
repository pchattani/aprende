# Wardrobe: accessories that come in colours, earned on errands once the regional souvenirs
# thin out (see src/engine/wardrobe.ts). {colour} is replaced by the colour word; Cantonese
# colours don't agree, so each is a single word and the classifier stays with the item.
kinds:
  beret:
    name: 一頂{colour}貝雷帽
  cap:
    name: 一頂{colour}鴨舌帽
  beanie:
    name: 一頂{colour}冷帽
  sunhat:
    name: 一頂{colour}太陽帽
  bucket-hat:
    name: 一頂{colour}漁夫帽
  sunglasses:
    name: 一副{colour}太陽眼鏡
  round-glasses:
    name: 一副{colour}圓框眼鏡
  scarf:
    name: 一條{colour}頸巾
  bandana:
    name: 一條{colour}方巾
  bowtie:
    name: 一個{colour}煲呔
  umbrella:
    name: 一把{colour}遮
  balloon:
    name: 一個{colour}氣球
colours:
  red: 紅色
  blue: 藍色
  green: 綠色
  yellow: 黃色
  purple: 紫色
  pink: 粉紅色
  orange: 橙色
  black: 黑色
