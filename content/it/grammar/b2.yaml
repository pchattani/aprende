# B2 grammar notes (the South). Explanations use light markdown: ### headings,
# bullets, tables, **bold**, *italic* (italic = Italian example inline).
- id: g.congiuntivo-imperfetto
  level: b2
  title: "The congiuntivo imperfetto: parlassi, avessi, fossi"
  summary: "Stem of the imperfetto + -ssi, -ssi, -sse, -ssimo, -ste, -ssero; essere → fossi, dare → dessi, stare → stessi."
  explanation: |
    | | parlare | credere | dormire | essere |
    |---|---|---|---|---|
    | che io | parla**ssi** | crede**ssi** | dormi**ssi** | **fossi** |
    | che tu | parla**ssi** | crede**ssi** | dormi**ssi** | **fossi** |
    | che lui / lei | parla**sse** | crede**sse** | dormi**sse** | **fosse** |
    | che noi | parla**ssimo** | crede**ssimo** | dormi**ssimo** | **fossimo** |
    | che voi | parla**ste** | crede**ste** | dormi**ste** | **foste** |
    | che loro | parla**ssero** | crede**ssero** | dormi**ssero** | **fossero** |

    ### Irregulars
    - *essere → fossi*, *dare → dessi*, *stare → stessi*.
    - Verbs with a long imperfetto stem keep it: *fare → facessi, dire → dicessi, bere → bevessi, tradurre → traducessi*.
    - *Avere* is regular: *avessi*.

    ### When
    1. After a trigger in the **past** or **conditional**: *Pensavo che fosse vero. Vorrei che tu venissi.*
    2. In unreal conditions: *Se avessi tempo…*
    3. After *come se, magari, se solo*.
  examples:
    - { es: "Pensavo che Napoli fosse più caotica.", en: "I thought Naples was more chaotic." }
    - { es: "Volevano che restassimo a cena.", en: "They wanted us to stay for dinner." }
    - { es: "Era importante che tutti sapessero la verità.", en: "It was important for everyone to know the truth." }
    - { es: "Benché facesse caldo, siamo saliti sul Vesuvio.", en: "Although it was hot, we climbed Vesuvius." }
  pitfalls:
    - "*Fossi*, not *essessi*; *stessi*, not *stassi*; *dessi*, not *dassi*."
    - "The voi form has only one s: *foste, parlaste*."
    - "Spanish speakers: *hablara / hablase* → *parlassi*; *fuera* → *fossi*."
  variant: "In southern speech you may hear the congiuntivo imperfetto replaced by the conditional or the indicative; in Naples *si avessi saputo…* in dialect. Standard Italian keeps the forms above."
  related: [g.congiuntivo-presente-forms, g.periodo-ipotetico-2, g.concordanza-congiuntivo]
  drills:
    - { es: "Credevo che tu dormissi.", en: "I thought you were asleep." }
    - { es: "Non sapevo che fossero già partiti.", en: "I didn't know they had already left." }
    - { es: "Mi sembrava che stesse male.", en: "He seemed unwell to me." }
    - { es: "Speravo che facesse bel tempo.", en: "I was hoping the weather would be nice." }
- id: g.periodo-ipotetico-2
  level: b2
  title: "Se avessi tempo, verrei — possible and unreal conditions"
  summary: "se + congiuntivo imperfetto, + condizionale presente: unlikely, imaginary or impossible in the present."
  explanation: |
    The second type of *periodo ipotetico* describes something **unlikely or contrary to fact** now or in the future:

    | se + congiuntivo imperfetto | condizionale presente |
    |---|---|
    | *Se avessi più tempo,* | *imparerei il napoletano.* |
    | *Se fossi in te,* | *non lo farei.* |
    | *Se vincessimo la lotteria,* | *compreremmo una casa a Capri.* |

    - The order can be reversed: *Verrei se potessi.*
    - **Never** the conditional after *se*: *se avrei* is a famous mistake.
    - *Se fossi in te* / *Al tuo posto* = If I were you.

    Compare type 1: *Se ho tempo, vengo.* (likely) vs type 2: *Se avessi tempo, verrei.* (unlikely).
  examples:
    - { es: "Se abitassi a Napoli, mangerei pizza tutti i giorni.", en: "If I lived in Naples, I'd eat pizza every day." }
    - { es: "Che cosa faresti se perdessi il lavoro?", en: "What would you do if you lost your job?" }
    - { es: "Se fossi in te, prenderei il traghetto.", en: "If I were you, I'd take the ferry." }
    - { es: "Se non piovesse, andremmo in spiaggia.", en: "If it weren't raining, we'd go to the beach." }
  pitfalls:
    - "Never *se avrei*: after *se* use the congiuntivo: *se avessi*."
    - "The conditional goes in the result clause, not the *se* clause."
    - "Spanish speakers: *si tuviera, iría* → *se avessi, andrei*: same structure."
  related: [g.congiuntivo-imperfetto, g.periodo-ipotetico-1, g.periodo-ipotetico-3]
  drills:
    - { es: "Se avessi una barca, andrei a Procida.", en: "If I had a boat, I'd go to Procida." }
    - { es: "Se fosse più vicino, ci andremmo a piedi.", en: "If it were closer, we'd walk there." }
    - { es: "Se sapessi cucinare, aprirei una trattoria.", en: "If I could cook, I'd open a trattoria." }
    - { es: "Mi aiuteresti se te lo chiedessi?", en: "Would you help me if I asked you?" }
- id: g.come-se
  level: b2
  title: "Come se + congiuntivo — as if"
  summary: "come se is always followed by the congiuntivo imperfetto or trapassato."
  explanation: |
    - Same time: **congiuntivo imperfetto**: *Parla come se fosse il capo.* — He talks as if he were the boss.
    - Earlier action: **congiuntivo trapassato**: *Mi guarda come se non mi avesse mai visto.* — She looks at me as if she'd never seen me.

    The main verb can be in any tense: *Si comportava come se niente fosse.* (He behaved as if nothing had happened.)

    ### Related expressions
    - *Come se niente fosse* — as if nothing had happened (fixed phrase).
    - *Quasi* + congiuntivo (literary): *quasi fosse…*
    - Ironic *Neanche fossi…!* — As if I were…!
  examples:
    - { es: "Spende come se fosse ricco.", en: "He spends as if he were rich." }
    - { es: "Mi tratta come se fossi una bambina.", en: "She treats me as if I were a child." }
    - { es: "È uscito come se niente fosse.", en: "He went out as if nothing had happened." }
    - { es: "Ne parla come se ci fosse stato.", en: "He talks about it as if he'd been there." }
  pitfalls:
    - "Never the indicative: *come se fosse*, not *come se è*."
    - "Never the present congiuntivo: *come se sia* is wrong."
    - "Spanish speakers: *como si fuera* → *come se fosse*: identical logic."
  related: [g.congiuntivo-imperfetto, g.congiuntivo-trapassato]
  drills:
    - { es: "Guida come se fosse in Formula 1.", en: "He drives as if he were in Formula 1." }
    - { es: "Fai come se fossi a casa tua.", en: "Make yourself at home." }
    - { es: "Mi ha salutato come se non fosse successo niente.", en: "He greeted me as if nothing had happened." }
- id: g.congiuntivo-trapassato
  level: b2
  title: "The congiuntivo trapassato: avessi fatto, fossi andato"
  summary: "congiuntivo imperfetto of avere / essere + participle: earlier action after a past trigger; past unreal conditions."
  explanation: |
    | | avere | essere |
    |---|---|---|
    | che io / tu | avessi visto | fossi partito/a |
    | che lui / lei | avesse visto | fosse partito/a |
    | che noi | avessimo visto | fossimo partiti/e |
    | che voi | aveste visto | foste partiti/e |
    | che loro | avessero visto | fossero partiti/e |

    ### Uses
    1. After a **past** trigger, for an **earlier** action: *Pensavo che avessi già mangiato.* — I thought you had already eaten.
    2. In past unreal conditions: *Se l'avessi saputo…* — If I had known…
    3. After *magari, se solo, come se* for the past: *Magari fossi venuto!*

    | trigger | same time | earlier |
    |---|---|---|
    | *Pensavo che…* | *…fosse a casa.* | *…fosse uscito.* |
  examples:
    - { es: "Credevo che fossi già tornato da Bari.", en: "I thought you'd already got back from Bari." }
    - { es: "Mi sembrava strano che non avesse chiamato.", en: "It seemed strange to me that he hadn't called." }
    - { es: "Benché avessimo prenotato, non c'era posto.", en: "Although we had booked, there was no room." }
    - { es: "Pensavo che fossi già stato a Napoli.", en: "I thought you'd already been to Naples." }
  pitfalls:
    - "Don't use the trapassato indicativo after a trigger: *pensavo che avesse finito*, not *che aveva finito* (in careful style)."
    - "Agreement with *essere*: *pensavo che fosse arrivata*."
    - "Spanish speakers: *hubiera hecho* → *avessi fatto*; *hubiera ido* → *fossi andato*."
  related: [g.congiuntivo-imperfetto, g.periodo-ipotetico-3, g.concordanza-congiuntivo]
  drills:
    - { es: "Non sapevo che avessero venduto la casa.", en: "I didn't know they had sold the house." }
    - { es: "Era contenta che fossimo venuti.", en: "She was happy we had come." }
    - { es: "Pensavo che te l'avesse detto.", en: "I thought he'd told you." }
- id: g.periodo-ipotetico-3
  level: b2
  title: "Se l'avessi saputo, sarei venuto — past unreal conditions"
  summary: "se + congiuntivo trapassato, + condizionale passato: a past that did not happen."
  explanation: |
    | se + congiuntivo trapassato | condizionale passato |
    |---|---|
    | *Se l'avessi saputo,* | *sarei venuto.* |
    | *Se fossimo partiti prima,* | *non avremmo perso il traghetto.* |
    | *Se non avesse piovuto,* | *saremmo andati a Pompei.* |

    ### Spoken alternative: double imperfetto
    In everyday speech Italians often say *Se lo sapevo, venivo.* (If I'd known, I would have come.) It is very common and accepted in informal speech, but avoid it in writing.

    ### Inversion (formal)
    *Avessi saputo, sarei venuto.* — Had I known, I would have come.
  examples:
    - { es: "Se avessimo prenotato, avremmo trovato posto.", en: "If we had booked, we would have found a table." }
    - { es: "Se non mi avessi chiamato, mi sarei perso.", en: "If you hadn't called me, I would have got lost." }
    - { es: "Se lo sapevo, non venivo.", en: "If I'd known, I wouldn't have come. (colloquial)" }
    - { es: "Avessi studiato di più, avrei passato l'esame.", en: "Had I studied more, I'd have passed the exam." }
  pitfalls:
    - "Not *se avrei saputo*: never the conditional after *se*."
    - "The double imperfetto (*se lo sapevo, venivo*) is spoken only."
    - "Spanish speakers: *si hubiera sabido, habría venido* → *se avessi saputo, sarei venuto*."
  related: [g.congiuntivo-trapassato, g.periodo-ipotetico-2, g.periodo-ipotetico-misto]
  drills:
    - { es: "Se fosse arrivato in tempo, avrebbe visto lo spettacolo.", en: "If he had arrived on time, he would have seen the show." }
    - { es: "Se mi avessi ascoltato, non saresti in questa situazione.", en: "If you had listened to me, you wouldn't be in this situation." }
    - { es: "Se avessero vinto, avrebbero festeggiato tutta la notte.", en: "If they had won, they'd have celebrated all night." }
- id: g.periodo-ipotetico-misto
  level: b2
  title: "Mixed conditionals: se avessi studiato, ora sarei medico"
  summary: "Past condition with present result, or permanent condition with past result."
  explanation: |
    ### Past condition → present result
    se + congiuntivo **trapassato**, + condizionale **presente**:
    - *Se avessi studiato medicina, adesso sarei medico.* — If I had studied medicine, I'd be a doctor now.
    - *Se non avessimo perso il treno, ora saremmo a Lecce.*

    ### Present / permanent condition → past result
    se + congiuntivo **imperfetto**, + condizionale **passato**:
    - *Se fossi più coraggioso, gliel'avrei già detto.* — If I were braver, I'd have told her already.
    - *Se non fosse così pigro, avrebbe finito ieri.*

    ### Summary of the three types
    | type | se… | result |
    |---|---|---|
    | 1 real | presente / futuro | presente / futuro / imperativo |
    | 2 unreal now | cong. imperfetto | condizionale presente |
    | 3 unreal past | cong. trapassato | condizionale passato |
  examples:
    - { es: "Se ieri non avessi bevuto tanto, oggi starei meglio.", en: "If I hadn't drunk so much yesterday, I'd feel better today." }
    - { es: "Se parlassi napoletano, avresti capito la battuta.", en: "If you spoke Neapolitan, you'd have understood the joke." }
    - { es: "Se avessimo comprato casa allora, oggi saremmo ricchi.", en: "If we'd bought a house back then, we'd be rich today." }
  pitfalls:
    - "Match each half to its own time: past condition (*avessi studiato*) + present result (*sarei*)."
    - "Don't let English 'would have' push you into the wrong half: the *se* clause never takes the conditional."
    - "Spanish speakers: the mixed patterns work exactly as in Spanish."
  related: [g.periodo-ipotetico-2, g.periodo-ipotetico-3]
  drills:
    - { es: "Se fossi nato a Bari, parlerei il barese.", en: "If I'd been born in Bari, I'd speak the Bari dialect." }
    - { es: "Se avessi accettato quel lavoro, ora vivrei a Napoli.", en: "If I'd accepted that job, I'd be living in Naples now." }
    - { es: "Se fosse più attento, non avrebbe fatto quell'errore.", en: "If he were more careful, he wouldn't have made that mistake." }
- id: g.magari-se-solo
  level: b2
  title: "Magari! Se solo… — wishes and regrets"
  summary: "magari / se solo + congiuntivo imperfetto (present wish) or trapassato (past regret)."
  explanation: |
    ### Unlikely wishes about now or the future
    *Magari* / *Se solo* / *Oh, se* + **congiuntivo imperfetto**:
    - *Magari fosse vero!* — If only it were true!
    - *Se solo avessi più tempo!*

    ### Regrets about the past
    + **congiuntivo trapassato**:
    - *Magari l'avessi saputo prima!* — If only I'd known before!
    - *Se solo fossimo partiti un giorno prima!*

    ### Magari has other meanings
    - Alone, as an answer = 'I wish!': *Vai in vacanza? — Magari!*
    - + indicative = 'maybe': *Magari viene domani.* (Maybe he'll come tomorrow.)

    Other regret phrases: *Avrei dovuto…*, *Mi pento di (non) aver…*, *Peccato che…* + congiuntivo.
  examples:
    - { es: "Magari potessi vivere a Positano!", en: "If only I could live in Positano!" }
    - { es: "Se solo non avessi detto quella cosa!", en: "If only I hadn't said that!" }
    - { es: "Hai vinto la lotteria? Magari!", en: "Did you win the lottery? I wish!" }
    - { es: "Magari ci vediamo stasera.", en: "Maybe we'll see each other tonight." }
  pitfalls:
    - "Wish *magari* + congiuntivo; 'maybe' *magari* + indicative: *Magari fosse qui!* vs *Magari è qui.*"
    - "Never the present congiuntivo: *magari fosse*, not *magari sia*."
    - "Spanish speakers: *ojalá* → *magari*, but only with the imperfetto / trapassato (not the present)."
  related: [g.congiuntivo-imperfetto, g.vorrei-che, g.modals-condizionale-passato]
  drills:
    - { es: "Magari fossi in vacanza!", en: "I wish I were on holiday!" }
    - { es: "Se solo avessimo più soldi!", en: "If only we had more money!" }
    - { es: "Magari ci fossi andato!", en: "If only I'd gone!" }
- id: g.vorrei-che
  level: b2
  title: "Vorrei che tu venissi — conditional + congiuntivo imperfetto"
  summary: "After a conditional trigger (vorrei, preferirei, sarebbe meglio), use the congiuntivo imperfetto."
  explanation: |
    When the main verb is in the **conditional**, the dependent verb goes into the **congiuntivo imperfetto** (or trapassato for an earlier action):
    - *Vorrei che tu venissi con me.* — I'd like you to come with me.
    - *Preferirei che non lo dicessi a nessuno.*
    - *Sarebbe meglio che partissimo subito.*
    - *Mi piacerebbe che fossero qui.*

    | main verb | dependent |
    |---|---|
    | *Voglio che…* | *…tu venga.* (present) |
    | *Vorrei che…* | *…tu venissi.* (imperfetto) |
    | *Avrei voluto che…* | *…tu venissi / fossi venuto.* |

    Same subject → infinitive: *Vorrei venire.*
  examples:
    - { es: "Vorrei che mi chiamassi più spesso.", en: "I'd like you to call me more often." }
    - { es: "Sarebbe bello che venissero anche i nonni.", en: "It would be nice if the grandparents came too." }
    - { es: "Avrei preferito che me lo dicessi subito.", en: "I'd have preferred you to tell me straight away." }
  pitfalls:
    - "*Vorrei che tu venga* is a frequent error: say *vorrei che tu venissi*."
    - "Same subject: *vorrei andare*, not *vorrei che io andassi*."
    - "Spanish speakers: *me gustaría que vinieras* → *mi piacerebbe che venissi*: same tense logic."
  related: [g.concordanza-congiuntivo, g.condizionale-uses, g.magari-se-solo]
  drills:
    - { es: "Vorrei che fosse sempre estate.", en: "I wish it were always summer." }
    - { es: "Preferiremmo che pagaste in contanti.", en: "We'd prefer you to pay in cash." }
    - { es: "Mi piacerebbe che tu conoscessi mia madre.", en: "I'd like you to meet my mother." }
- id: g.concordanza-congiuntivo
  level: b2
  title: "Sequence of tenses with the congiuntivo"
  summary: "Present trigger → presente / passato; past or conditional trigger → imperfetto / trapassato."
  explanation: |
    | main verb | same time / later | earlier |
    |---|---|---|
    | **present / future** *penso che* | cong. **presente**: *sia* | cong. **passato**: *sia stato* |
    | **past** *pensavo, ho pensato che* | cong. **imperfetto**: *fosse* | cong. **trapassato**: *fosse stato* |
    | **conditional** *vorrei che* | cong. **imperfetto**: *fosse* | cong. **trapassato** |

    ### Future seen from the past
    After a past trigger, a later action uses the **condizionale passato** (not a congiuntivo): *Pensavo che sarebbe venuto.* (I thought he would come.)

    ### Examples across the table
    - *Credo che Marco sia a Bari.* / *Credo che sia stato a Bari.*
    - *Credevo che Marco fosse a Bari.* / *Credevo che fosse stato a Bari.*
    - *Credevo che sarebbe andato a Bari.*
  examples:
    - { es: "Spero che tu abbia dormito bene.", en: "I hope you slept well." }
    - { es: "Speravo che tu dormissi bene.", en: "I was hoping you were sleeping well." }
    - { es: "Non immaginavo che fosse già finito.", en: "I didn't imagine it had already finished." }
    - { es: "Ero sicuro che avrebbe piovuto.", en: "I was sure it would rain." }
  pitfalls:
    - "*Pensavo che sia* is a mismatch: past trigger → *fosse*."
    - "*Ero sicuro che* takes the indicative or conditional (certainty), not the congiuntivo."
    - "Spanish speakers: the system is the same as Spanish *consecutio temporum*."
  related: [g.congiuntivo-imperfetto, g.congiuntivo-trapassato, g.congiuntivo-passato]
  drills:
    - { es: "Mi sembra che sia stanca.", en: "She seems tired to me." }
    - { es: "Mi sembrava che fosse stanca.", en: "She seemed tired to me." }
    - { es: "Mi sembrava che fosse stata male.", en: "It seemed to me she had been ill." }
    - { es: "Pensavo che non saresti venuto.", en: "I thought you wouldn't come." }
- id: g.passive-essere
  level: b2
  title: "The passive with essere: è stato costruito"
  summary: "essere + past participle (agreeing) + da: Il Colosseo fu costruito dai Romani."
  explanation: |
    The passive is formed with **essere** in any tense + participle **agreeing with the subject**; the agent is introduced by **da**:

    | tense | example |
    |---|---|
    | presente | *Il museo è visitato da molti turisti.* |
    | passato prossimo | *La chiesa è stata restaurata nel 2010.* |
    | imperfetto | *Le strade erano illuminate da lanterne.* |
    | passato remoto | *Pompei fu distrutta dal Vesuvio nel 79 d.C.* |
    | futuro | *Il ponte sarà inaugurato a maggio.* |

    - The passive of the passato prossimo has **two** participles of *essere*: *è stato costruito*.
    - Only **transitive** verbs (with a direct object) can be passive.
    - The agent is often omitted: *La città fu fondata nel VII secolo a.C.*
  examples:
    - { es: "Pompei fu sepolta dalla cenere del Vesuvio.", en: "Pompeii was buried by the ash of Vesuvius." }
    - { es: "Il nuovo ponte è stato progettato da un architetto barese.", en: "The new bridge was designed by an architect from Bari." }
    - { es: "Le chiese rupestri di Matera erano scavate nella roccia.", en: "Matera's rock churches were carved into the rock." }
    - { es: "I risultati saranno pubblicati domani.", en: "The results will be published tomorrow." }
  pitfalls:
    - "Agreement: *la casa è stata venduta*, not *è stato venduto*."
    - "The agent takes *da* (+ article): *dai Romani*, not *per i Romani*."
    - "Spanish speakers: *fue construido por* → *fu costruito da*."
  related: [g.passive-venire, g.si-passivante, g.passive-andare]
  drills:
    - { es: "La pizza margherita fu creata a Napoli nel 1889.", en: "The margherita pizza was created in Naples in 1889." }
    - { es: "Il castello è stato costruito dagli Svevi.", en: "The castle was built by the Swabians." }
    - { es: "Siamo stati invitati a un matrimonio a Lecce.", en: "We've been invited to a wedding in Lecce." }
    - { es: "Il film è stato girato a Matera.", en: "The film was shot in Matera." }
- id: g.passive-venire
  level: b2
  title: "The passive with venire: viene servito"
  summary: "venire + participle = passive in simple tenses, stressing the action: Il caffè viene servito caldo."
  explanation: |
    *Venire* can replace *essere* in the passive, but **only in simple tenses** (presente, imperfetto, futuro, passato remoto, condizionale):
    - *La mozzarella viene prodotta in Campania.*
    - *Le porte venivano chiuse alle dieci.*
    - *Il premio verrà consegnato domani.*

    ### Why use venire?
    It avoids ambiguity and stresses the **action** rather than the state:
    | essere | venire |
    |---|---|
    | *La porta è chiusa.* (state: it is closed) | *La porta viene chiusa alle otto.* (action: it gets closed) |

    ### Not in compound tenses
    *è stato chiuso*, never *è venuto chiuso*.
  examples:
    - { es: "Il limoncello viene servito freddo.", en: "Limoncello is served cold." }
    - { es: "Ogni anno la statua del santo viene portata in processione.", en: "Every year the saint's statue is carried in procession." }
    - { es: "I biglietti verranno venduti all'ingresso.", en: "Tickets will be sold at the entrance." }
    - { es: "Le olive venivano raccolte a mano.", en: "The olives used to be picked by hand." }
  pitfalls:
    - "No *venire* in compound tenses: *è stata venduta*, not *è venuta venduta*."
    - "*Viene servito* (passive) ≠ *è venuto* (came): context shows which."
    - "Spanish has no equivalent; English 'gets done' is often the best translation."
  related: [g.passive-essere, g.passive-andare]
  drills:
    - { es: "La pasta viene cotta al dente.", en: "The pasta is cooked al dente." }
    - { es: "Il pane veniva fatto in casa.", en: "Bread used to be made at home." }
    - { es: "La decisione verrà presa domani.", en: "The decision will be taken tomorrow." }
- id: g.passive-andare
  level: b2
  title: "Va fatto così — andare + participle (must be done)"
  summary: "andare + participle = must be / should be done: La pizza va mangiata calda."
  explanation: |
    *Andare* + past participle is a passive with a sense of **obligation or necessity**:
    - *La pizza va mangiata subito.* — Pizza must be eaten straight away.
    - *Questi documenti vanno firmati.* — These documents need signing.
    - *Il vino rosso va servito a temperatura ambiente.*

    - Only in **simple tenses**: *va fatto, andava fatto, andrà fatto*.
    - Negative = must not be: *Non va detto a nessuno.*

    ### Also: loss
    With verbs like *perdere, distruggere, smarrire*, *andare* means 'get lost / destroyed': *Molti documenti sono andati perduti.* (Many documents were lost.)
  examples:
    - { es: "La mozzarella va consumata entro due giorni.", en: "Mozzarella should be eaten within two days." }
    - { es: "Il modulo va compilato in stampatello.", en: "The form must be filled in in block capitals." }
    - { es: "Questa cosa andava detta prima.", en: "This should have been said earlier." }
    - { es: "Durante la guerra molte opere andarono distrutte.", en: "Many works were destroyed during the war." }
  pitfalls:
    - "*Va fatto* means 'must be done', not 'is going to be done'."
    - "Agreement: *le tasse vanno pagate*, *il conto va pagato*."
    - "Spanish speakers: *hay que hacerlo* → *va fatto*."
  related: [g.passive-essere, g.passive-venire, g.bisogna-avere-bisogno]
  drills:
    - { es: "Le scarpe vanno tolte prima di entrare.", en: "Shoes must be taken off before going in." }
    - { es: "Il caffè va bevuto senza zucchero.", en: "Coffee should be drunk without sugar." }
    - { es: "Questo problema va risolto subito.", en: "This problem must be solved immediately." }
- id: g.concessive-clauses
  level: b2
  title: "Concession: benché, sebbene, nonostante, anche se, malgrado"
  summary: "benché / sebbene / nonostante / malgrado + congiuntivo; anche se + indicative; nonostante / malgrado + noun."
  explanation: |
    | connector | mood | example |
    |---|---|---|
    | *benché, sebbene, nonostante (che), malgrado (che), quantunque* | congiuntivo | *Benché sia tardi, resto.* |
    | *anche se* | indicative | *Anche se è tardi, resto.* |
    | *nonostante, malgrado* + noun | — | *Nonostante la pioggia, siamo usciti.* |
    | *pur* + gerund | — | *Pur essendo stanco, sono uscito.* |
    | *eppure, tuttavia, comunque* (main clause) | indicative | *Era stanco, eppure è uscito.* |

    ### Anche se + congiuntivo?
    *Anche se* + congiuntivo imperfetto expresses a **hypothetical** concession: *Anche se fosse vero, non cambierebbe niente.* (Even if it were true…)

    ### Per quanto
    *Per quanto* + congiuntivo = however much: *Per quanto ci provi, non ci riesco.*
  examples:
    - { es: "Benché fosse agosto, a Matera faceva fresco la sera.", en: "Although it was August, it was cool in Matera in the evening." }
    - { es: "Anche se non parlo il dialetto, lo capisco.", en: "Even though I don't speak the dialect, I understand it." }
    - { es: "Nonostante il traffico, siamo arrivati in tempo.", en: "Despite the traffic, we arrived on time." }
    - { es: "Per quanto mi sforzi, non riesco a ricordare.", en: "However hard I try, I can't remember." }
  pitfalls:
    - "*Anche se* + indicative for real facts: *anche se piove*, not *anche se piova*."
    - "*Benché* never takes the indicative in standard Italian: *benché sia*."
    - "Spanish speakers: *aunque* splits: *anche se* (real) / *benché* (always congiuntivo)."
  related: [g.congiuntivo-conjunctions, g.pur-gerundio, g.connectors-contrast]
  drills:
    - { es: "Sebbene sia ricco, vive in modo semplice.", en: "Although he's rich, he lives simply." }
    - { es: "Malgrado tutto, sono contento.", en: "Despite everything, I'm happy." }
    - { es: "Anche se fosse gratis, non ci andrei.", en: "Even if it were free, I wouldn't go." }
    - { es: "Nonostante abbia piovuto, la festa è riuscita.", en: "Although it rained, the party was a success." }
- id: g.chiunque-qualunque
  level: b2
  title: "Chiunque, qualunque, dovunque, comunque — whoever, whatever"
  summary: "Indefinite relatives take the congiuntivo: chiunque venga, qualunque cosa succeda, dovunque tu vada."
  explanation: |
    | word | meaning | example |
    |---|---|---|
    | *chiunque* | whoever, anyone | *Chiunque arrivi, deve aspettare.* |
    | *qualunque / qualsiasi* (+ noun) | whatever, any | *Qualunque cosa succeda, chiamami.* |
    | *dovunque / ovunque* | wherever | *Dovunque tu vada, ti seguo.* |
    | *comunque* | however, in whatever way | *Comunque vada, sarà un successo.* |
    | *quando che sia* (rare) | whenever | — |

    - In these clauses the verb is in the **congiuntivo**.
    - *Qualunque, qualsiasi* are invariable and take a singular noun: *qualunque persona, qualsiasi giorno*.
    - As plain pronouns, without a clause, no congiuntivo: *Lo sa chiunque.* (Anyone knows that.) *Un giorno qualunque.* (An ordinary day.)
    - *Comunque* alone = anyway, however.
  examples:
    - { es: "Qualunque cosa tu decida, io ci sarò.", en: "Whatever you decide, I'll be there." }
    - { es: "Chiunque abbia visto qualcosa, contatti la polizia.", en: "Anyone who saw anything should contact the police." }
    - { es: "Ovunque andiamo, troviamo turisti.", en: "Wherever we go, we find tourists." }
    - { es: "Comunque vada, ne è valsa la pena.", en: "However it turns out, it was worth it." }
  pitfalls:
    - "*Qualunque cosa succeda*, not *qualunque cose*: always singular."
    - "*Chiunque* + congiuntivo in a clause: *chiunque venga*, not *chiunque viene* (in writing)."
    - "Spanish speakers: *quienquiera que* → *chiunque*; *cualquier cosa que* → *qualunque cosa*."
  related: [g.indefinites, g.concessive-clauses]
  drills:
    - { es: "Puoi chiedere a chiunque.", en: "You can ask anyone." }
    - { es: "Qualsiasi treno prendiate, arriverete tardi.", en: "Whichever train you take, you'll arrive late." }
    - { es: "Dovunque io sia, penso a te.", en: "Wherever I am, I think of you." }
- id: g.pur-gerundio
  level: b2
  title: "Pur essendo stanco — concession with pur + gerund"
  summary: "pur + gerund = although / even though, same subject: Pur sapendolo, non ha detto niente."
  explanation: |
    *Pur* + gerund is a compact, elegant way to say 'although' when **both clauses share the subject**:
    - *Pur essendo stanco, sono uscito.* = *Benché fossi stanco, sono uscito.*
    - *Pur sapendo la verità, non ha detto niente.*
    - *Pur avendo studiato, non ha passato l'esame.* (compound gerund for an earlier action)

    Pronouns attach to the gerund: *Pur conoscendolo bene, non lo capisco.*

    Also with participle or adjective (formal): *pur se stanco, pur nella difficoltà*.
  examples:
    - { es: "Pur abitando a Napoli da anni, non ho mai visto Capri.", en: "Although I've lived in Naples for years, I've never seen Capri." }
    - { es: "Pur volendo, non potrei aiutarti.", en: "Even if I wanted to, I couldn't help you." }
    - { es: "Pur avendo vinto, la squadra non era soddisfatta.", en: "Despite having won, the team wasn't satisfied." }
  pitfalls:
    - "The subject must be the same: *Pur essendo tardi* (impersonal) is fine, but don't link two different people."
    - "*Pur* is a shortened *pure*: don't write *pure essendo* in formal style."
    - "Spanish speakers: *aun siendo* → *pur essendo*."
  related: [g.concessive-clauses, g.gerundio-uses, g.gerundio-composto]
  drills:
    - { es: "Pur essendo stanchi, abbiamo continuato.", en: "Although we were tired, we carried on." }
    - { es: "Pur non parlando inglese, si è fatto capire.", en: "Despite not speaking English, he made himself understood." }
    - { es: "Pur conoscendola da anni, non so niente di lei.", en: "Although I've known her for years, I know nothing about her." }
- id: g.pronominal-verbs
  level: b2
  title: "Pronominal verbs: andarsene, farcela, cavarsela, prendersela"
  summary: "Verbs with fixed ci, ne, la that change meaning: me ne vado, ce la faccio, me la cavo."
  explanation: |
    | verb | meaning | present | past |
    |---|---|---|---|
    | *andarsene* | to leave, go away | *me ne vado* | *me ne sono andato/a* |
    | *farcela* | to manage, make it | *ce la faccio* | *ce l'ho fatta* |
    | *cavarsela* | to get by, cope | *me la cavo* | *me la sono cavata* |
    | *prendersela* | to take offence, get upset | *me la prendo* | *me la sono presa* |
    | *avercela con* | to have it in for | *ce l'ho con te* | *ce l'avevo con lui* |
    | *smetterla* | to stop it | *smettila!* | *l'ho smessa* |
    | *sentirsela* | to feel up to | *non me la sento* | *non me la sono sentita* |
    | *volerci* | to take (time) | *ci vuole* | *ci è voluto* |
    | *metterci* | to take (person) | *ci metto* | *ci ho messo* |
    | *intendersene* | to be an expert | *me ne intendo* | — |

    - The pronouns combine (*me ne, ce la, me la*) and the participle agrees with *la*: *ce l'ho fatta, me la sono cavata*.
    - Imperatives: *Vattene! Smettila! Fattene una ragione!* (Get over it!)
  examples:
    - { es: "È tardi, me ne vado.", en: "It's late, I'm off." }
    - { es: "Ce l'abbiamo fatta! Siamo arrivati in cima.", en: "We made it! We got to the top." }
    - { es: "Non prendertela, scherzavo!", en: "Don't get upset, I was joking!" }
    - { es: "Con l'inglese me la cavo.", en: "I get by in English." }
  pitfalls:
    - "*Ce l'ho fatta* (I managed), with feminine agreement because of *la*."
    - "*Me ne sono andato* uses *essere*; *ce l'ho fatta* uses *avere*."
    - "Spanish speakers: *irse* → *andarsene* (with *ne*): *me voy* = *me ne vado*."
  related: [g.ce-ne-ce-lo, g.combined-pronouns, g.metterci-volerci]
  drills:
    - { es: "Non ce la faccio più!", en: "I can't take it any more!" }
    - { es: "Ce l'hai ancora con me?", en: "Are you still angry with me?" }
    - { es: "Se ne sono andati senza salutare.", en: "They left without saying goodbye." }
    - { es: "Non me la sento di guidare stasera.", en: "I don't feel up to driving tonight." }
- id: g.fare-causative
  level: b2
  title: "Fare + infinitive: mi faccio tagliare i capelli"
  summary: "fare + infinitive = have / make someone do something; farsi + infinitive = have something done for yourself."
  explanation: |
    ### Make / have someone do something
    - *Faccio riparare la macchina.* — I'm having the car repaired.
    - *Il film mi ha fatto ridere.* — The film made me laugh.
    - *Fammi vedere!* — Let me see! (make me see)

    ### Who does the action?
    If the infinitive has its own object, the person becomes **indirect** (*a* / *gli, le*):
    - *Faccio leggere i bambini.* → *Li faccio leggere.*
    - *Faccio leggere la lettera **a** Marco.* → *Gliela faccio leggere.*

    ### farsi + infinitive (for yourself)
    *Mi sono fatto tagliare i capelli.* (I had my hair cut.) — *Si è fatta prestare la macchina.*

    ### Pronouns go before fare (or attach to it)
    *Lo faccio riparare. Fallo entrare! Fammelo vedere.*
  examples:
    - { es: "Ho fatto pulire il tappeto.", en: "I had the rug cleaned." }
    - { es: "Fammi sapere quando arrivi a Bari.", en: "Let me know when you get to Bari." }
    - { es: "Mi sono fatta fare un vestito da una sarta di Napoli.", en: "I had a dress made by a dressmaker in Naples." }
    - { es: "Non farmi aspettare!", en: "Don't keep me waiting!" }
  pitfalls:
    - "Pronouns go with *fare*, not the infinitive: *lo faccio riparare*, not *faccio ripararlo*."
    - "'Make someone happy' is *rendere felice*, not *fare felice* (though *far felice* exists colloquially)."
    - "Spanish speakers: *hacer + infinitivo* works similarly: *me hice cortar el pelo* → *mi sono fatto tagliare i capelli*."
  related: [g.lasciare-infinitive, g.imperativo-short-forms]
  drills:
    - { es: "Devo far controllare i freni.", en: "I need to get the brakes checked." }
    - { es: "Mi hai fatto spaventare!", en: "You gave me a fright!" }
    - { es: "Fallo entrare, per favore.", en: "Let him in, please." }
    - { es: "Si è fatto portare la colazione in camera.", en: "He had breakfast brought to his room." }
- id: g.lasciare-infinitive
  level: b2
  title: "Lasciare + infinitive: lasciami parlare"
  summary: "lasciare + infinitive = let / allow someone do something; lasciar perdere = let it go."
  explanation: |
    - *Lasciami parlare!* — Let me speak!
    - *I miei genitori non mi lasciavano uscire la sera.* — My parents didn't let me go out at night.
    - *Lascia stare / Lascia perdere.* — Forget it / Leave it.
    - *Lasciarsi andare* — to let oneself go.

    ### Alternatives
    - *lasciare che* + congiuntivo (formal): *Lascia che ti spieghi.* (Let me explain.)
    - *permettere di* + infinitive: *Mi permette di passare?*

    Pronouns: before *lasciare* or attached to it: *Lo lascio dormire. Lascialo dormire.*
    The final *-e* of *lasciare* often drops before an infinitive: *lasciar perdere, lasciar correre*.
  examples:
    - { es: "Lasciami pensare un momento.", en: "Let me think for a moment." }
    - { es: "Non l'hanno lasciato entrare in discoteca.", en: "They didn't let him into the club." }
    - { es: "Lascia perdere, non vale la pena.", en: "Forget it, it's not worth it." }
    - { es: "Lascia che ti racconti cosa è successo.", en: "Let me tell you what happened." }
  pitfalls:
    - "*Lasciami stare!* = Leave me alone! (not 'let me stay')."
    - "Don't use *fare* for permission: *mi lascia uscire* (lets me), *mi fa uscire* (makes me / gets me out)."
    - "Spanish speakers: *déjame hablar* → *lasciami parlare*; *déjalo* → *lascia stare*."
  related: [g.fare-causative, g.imperativo-pronouns]
  drills:
    - { es: "Lasciali giocare ancora un po'.", en: "Let them play a bit longer." }
    - { es: "Mi lasci passare, per favore?", en: "Will you let me through, please?" }
    - { es: "Lasciamo stare, ne parliamo domani.", en: "Let's leave it, we'll talk about it tomorrow." }
- id: g.relative-il-quale
  level: b2
  title: "Il quale, la quale, i quali, le quali"
  summary: "A formal alternative to che and cui that shows gender and number and avoids ambiguity."
  explanation: |
    | | singular | plural |
    |---|---|---|
    | masculine | *il quale* | *i quali* |
    | feminine | *la quale* | *le quali* |

    With prepositions it fuses: *del quale, alla quale, nei quali, con il quale, per la quale*.

    ### When to use it
    1. **Formal writing**, instead of *cui* after a preposition: *la ditta per la quale lavoro* = *per cui lavoro*.
    2. To **avoid ambiguity**, since it shows gender and number: *Ho parlato con la sorella di Marco, la quale abita a Bari.* (the sister lives in Bari, not Marco)
    3. As subject after a comma (non-defining clause, formal): *Il sindaco, il quale era presente, ha parlato.*

    It is **not** used as a direct object in modern Italian: *il libro che leggo*, not *il libro il quale leggo*.
  examples:
    - { es: "Il professore con il quale ho fatto la tesi insegna a Salerno.", en: "The professor I did my thesis with teaches in Salerno." }
    - { es: "Ho conosciuto la madre di Luca, la quale è di Reggio.", en: "I met Luca's mother, who is from Reggio." }
    - { es: "Sono questi i motivi per i quali ho rinunciato.", en: "These are the reasons for which I gave up." }
    - { es: "Le persone alle quali ho scritto non hanno risposto.", en: "The people I wrote to haven't replied." }
  pitfalls:
    - "Not for direct objects: *la casa che ho comprato*, not *la quale ho comprato*."
    - "The article must fuse with the preposition: *nella quale*, not *in la quale*."
    - "Spanish speakers: *el cual, la cual* → *il quale, la quale*, used in similar formal contexts."
  related: [g.relative-cui, g.relative-il-cui, g.relative-advanced]
  drills:
    - { es: "L'azienda per la quale lavoro ha sede a Napoli.", en: "The company I work for is based in Naples." }
    - { es: "È un tema sul quale ci sarebbe molto da dire.", en: "It's a subject on which there would be much to say." }
    - { es: "Gli amici dai quali siamo stati ospiti sono di Lecce.", en: "The friends we stayed with are from Lecce." }
- id: g.relative-advanced
  level: b2
  title: "Il che, per cui, ciò che, dove — advanced relatives"
  summary: "il che (which = the whole idea), per cui (so / that's why), dove, quanto, the relative + congiuntivo."
  explanation: |
    ### il che — which (referring to a whole clause)
    *È arrivato in ritardo, il che mi ha irritato.* — He arrived late, which annoyed me.
    (Also *la qual cosa*, *cosa che* in speech.)

    ### per cui — so, which is why
    *Ero stanco, per cui sono rimasto a casa.*

    ### dove / in cui
    *Il paese dove sono nato* = *in cui sono nato*.

    ### quanto — all that
    *Ti ringrazio per quanto hai fatto.* = *per tutto quello che hai fatto*.

    ### Relative clauses with the congiuntivo
    For something **sought or hypothetical**, the relative takes the congiuntivo:
    - *Cerco una casa che abbia il giardino.* (any house that has one)
    - *È la persona più gentile che io conosca.* (after a superlative)
    - *Non c'è nessuno che lo sappia.*
  examples:
    - { es: "Ha piovuto tutto il giorno, il che ci ha rovinato la gita.", en: "It rained all day, which ruined our trip." }
    - { es: "Non ho la macchina, per cui prendo il treno.", en: "I don't have a car, so I take the train." }
    - { es: "Cerchiamo un ristorante che sia aperto il lunedì.", en: "We're looking for a restaurant that's open on Mondays." }
    - { es: "È il posto più bello che abbia mai visto.", en: "It's the most beautiful place I've ever seen." }
  pitfalls:
    - "*Il che* refers to a whole idea; *che* alone can't do this after a comma."
    - "A real, known thing takes the indicative: *Ho una casa che ha il giardino.*"
    - "Spanish speakers: *lo cual* → *il che*; *busco una casa que tenga* → *cerco una casa che abbia*."
  related: [g.relative-il-quale, g.relative-chi-quello-che, g.congiuntivo-nuance]
  drills:
    - { es: "Ha vinto, il che non mi sorprende.", en: "He won, which doesn't surprise me." }
    - { es: "Non c'è niente che tu possa fare.", en: "There's nothing you can do." }
    - { es: "Grazie di quanto avete fatto per noi.", en: "Thank you for all you've done for us." }
- id: g.gerundio-composto
  level: b2
  title: "The compound gerund: avendo finito, essendo arrivati"
  summary: "avendo / essendo + participle: an action completed before the main one (cause or time)."
  explanation: |
    | auxiliary | example |
    |---|---|
    | *avendo* + participle | *Avendo finito il lavoro, sono uscito.* |
    | *essendo* + participle (agrees) | *Essendo arrivata tardi, ha perso l'inizio.* |

    It expresses an action **before** the main one, often with a sense of **cause**:
    - *Avendo perso il treno, abbiamo preso l'autobus.* — Having missed the train, we took the bus.
    - *Non avendo capito, ho chiesto di nuovo.* — Not having understood, I asked again.
    - *Essendosi svegliato tardi, non ha fatto colazione.* (pronoun attached to *essendo*)

    It belongs to written and formal speech; conversation prefers *Siccome avevo finito…* or *Dopo aver finito…*.
  examples:
    - { es: "Avendo vissuto a Napoli, conosco bene il dialetto.", en: "Having lived in Naples, I know the dialect well." }
    - { es: "Essendo partiti all'alba, siamo arrivati a Matera per pranzo.", en: "Having left at dawn, we reached Matera for lunch." }
    - { es: "Non avendo ricevuto risposta, Le scrivo di nuovo.", en: "Not having received a reply, I am writing to you again." }
  pitfalls:
    - "Agreement after *essendo*: *essendo uscite* (women)."
    - "The subject should be the same as the main clause."
    - "Spanish speakers: *habiendo terminado* → *avendo finito*; *habiendo llegado* → *essendo arrivato* (essere!)."
  related: [g.gerundio-uses, g.pur-gerundio, g.participio-assoluto]
  drills:
    - { es: "Avendo studiato molto, ha superato l'esame.", en: "Having studied hard, she passed the exam." }
    - { es: "Essendo già stati a Pompei, siamo andati a Ercolano.", en: "Having already been to Pompeii, we went to Herculaneum." }
    - { es: "Avendolo saputo prima, ti avrei avvisato.", en: "Had I known it earlier, I'd have warned you." }
- id: g.reported-speech-advanced
  level: b2
  title: "Advanced reported speech: full tense shifts"
  summary: "Reporting with past verbs: congiuntivo, conditional and imperative all shift."
  explanation: |
    After a past reporting verb (*disse, ha detto, aveva detto*):

    | direct | reported |
    |---|---|
    | presente *'È tardi.'* | imperfetto *…che era tardi* |
    | passato prossimo / remoto *'Ho finito.'* | trapassato *…che aveva finito* |
    | futuro / condizionale *'Verrò.' 'Verrei.'* | condizionale passato *…che sarebbe venuto* |
    | futuro anteriore *'Avrò finito.'* | condizionale passato *…che avrebbe finito* |
    | cong. presente *'Penso che sia vero.'* | cong. imperfetto *…che pensava che fosse vero* |
    | cong. passato *'Credo che sia partito.'* | cong. trapassato *…che fosse partito* |
    | imperativo *'Vieni!'* | *di* + inf. / *che* + cong. imperf. *…di venire / che venissi* |
    | periodo ipotetico 2 / 3 | type 3: *…che se avesse avuto tempo, sarebbe venuto* |

    Imperfetto, trapassato and conditional past **don't change**.
  examples:
    - { es: "Disse che sarebbe tornato a Napoli l'anno dopo.", en: "He said he would come back to Naples the following year." }
    - { es: "Mi spiegò che pensava che fosse troppo tardi.", en: "She explained that she thought it was too late." }
    - { es: "Ci ordinò che uscissimo subito.", en: "He ordered us to leave immediately." }
    - { es: "Ha detto che se avesse avuto soldi, avrebbe comprato una barca.", en: "He said that if he had money, he would buy a boat." }
  pitfalls:
    - "Future in the past is always the past conditional: *disse che sarebbe venuto*."
    - "A reported congiuntivo presente becomes imperfetto: *pensava che fosse*."
    - "Spanish speakers: Italian uses the past conditional where Spanish uses the simple conditional (*dijo que vendría*)."
  related: [g.discorso-indiretto-past, g.deictic-shift, g.reporting-verbs]
  drills:
    - { es: "Ha promesso che avrebbe chiamato appena arrivato.", en: "He promised he'd call as soon as he arrived." }
    - { es: "Disse che non credeva che fosse possibile.", en: "She said she didn't believe it was possible." }
    - { es: "Mi ha chiesto di aspettarlo davanti al teatro.", en: "He asked me to wait for him in front of the theatre." }
- id: g.deictic-shift
  level: b2
  title: "Oggi → quel giorno, qui → lì — shifting time and place"
  summary: "In reported speech, words for 'now', 'here', 'this' shift to 'then', 'there', 'that'."
  explanation: |
    | direct | reported |
    |---|---|
    | *oggi* | *quel giorno* |
    | *ieri* | *il giorno prima / precedente* |
    | *domani* | *il giorno dopo / seguente* |
    | *stasera* | *quella sera* |
    | *la settimana scorsa* | *la settimana prima / precedente* |
    | *la settimana prossima* | *la settimana dopo / seguente* |
    | *fa* (ago) | *prima* |
    | *adesso, ora* | *allora, in quel momento* |
    | *qui, qua* | *lì, là* |
    | *questo* | *quello* |
    | *venire* | *andare* (often) |

    These shifts only apply if time and place have **really changed**. Reporting something said this morning about tomorrow, keep *domani*.
  examples:
    - { es: "'Parto domani', disse. → Disse che sarebbe partito il giorno dopo.", en: "'I'm leaving tomorrow,' he said. → He said he'd leave the next day." }
    - { es: "Mi raccontò che due anni prima aveva vissuto a Bari.", en: "She told me that two years before she had lived in Bari." }
    - { es: "Disse che in quel momento non poteva parlare.", en: "He said he couldn't talk at that moment." }
  pitfalls:
    - "*Fa* becomes *prima* in reported speech: *due anni prima*, not *due anni fa*."
    - "Don't shift if the time frame hasn't changed: *Ha detto che viene domani* (said today about tomorrow)."
    - "Spanish speakers: the same shifts as Spanish (*al día siguiente, allí*)."
  related: [g.reported-speech-advanced, g.discorso-indiretto-past]
  drills:
    - { es: "Disse che quella sera sarebbe rimasto a casa.", en: "He said he'd stay home that evening." }
    - { es: "Mi scrisse che il giorno prima aveva visto Marco.", en: "She wrote that she had seen Marco the day before." }
    - { es: "Spiegò che lì la vita era più tranquilla.", en: "He explained that life was quieter there." }
- id: g.reporting-verbs
  level: b2
  title: "Reporting verbs: ammettere, negare, sostenere, promettere…"
  summary: "Choose a precise verb instead of always dire: each has its own structure (che / di + infinitive)."
  explanation: |
    | verb | meaning | structure |
    |---|---|---|
    | *affermare, dichiarare, sostenere* | state, claim, maintain | *che* + ind. (*sostenere* also + cong.) |
    | *ammettere* | admit | *che* + ind. / *di* + inf. |
    | *negare* | deny | *di* + inf. / *che* + cong. |
    | *promettere* | promise | *di* + inf. / *che* + cond. passato |
    | *minacciare* | threaten | *di* + inf. |
    | *rifiutare / rifiutarsi* | refuse | *di* + inf. |
    | *consigliare, suggerire* | advise, suggest | *di* + inf. / *che* + cong. |
    | *pregare, supplicare* | beg | *di* + inf. |
    | *lamentarsi* | complain | *che* + ind. / *di* + noun |
    | *spiegare, precisare, aggiungere* | explain, specify, add | *che* + ind. |
    | *rispondere, ribattere* | reply, retort | *che* + ind. |

    *Negare* is followed by the **congiuntivo**: *Ha negato che fosse vero.*
  examples:
    - { es: "Il sindaco ha ammesso di aver sbagliato.", en: "The mayor admitted he had made a mistake." }
    - { es: "Ha negato di conoscerlo.", en: "She denied knowing him." }
    - { es: "Mi ha suggerito di visitare Lecce.", en: "He suggested I visit Lecce." }
    - { es: "Ribatté che non era affar mio.", en: "He retorted that it was none of my business." }
  pitfalls:
    - "*Suggerire di* + infinitive, not *suggerire* + gerund like English 'suggest going'."
    - "*Negare che* + congiuntivo: *nega che sia vero*."
    - "*Pretendere* means 'demand / expect', not 'pretend' (*fingere*)."
  related: [g.reported-commands-di, g.reported-speech-advanced]
  drills:
    - { es: "Ha promesso di non farlo più.", en: "He promised not to do it again." }
    - { es: "Si è rifiutato di pagare.", en: "He refused to pay." }
    - { es: "Ha precisato che il museo era chiuso il lunedì.", en: "She specified that the museum was closed on Mondays." }
- id: g.register-formal-informal
  level: b2
  title: "Register: colloquial, neutral, formal"
  summary: "Choosing words and structures to match the situation, from 'Che fai?' to 'Desidererei sapere…'."
  explanation: |
    | colloquial | neutral | formal |
    |---|---|---|
    | *Che vuoi?* | *Che cosa desideri?* | *Desidera?* |
    | *Mi sa che…* | *Credo che…* | *Ritengo che…* |
    | *beccare* | *trovare, prendere* | *rinvenire* |
    | *un sacco di* | *molto* | *numerosi / considerevole* |
    | *sbrigarsi* | *fare presto* | *affrettarsi* |
    | *Ciao!* | *Buongiorno.* | *Distinti saluti.* |
    | *c'ho* | *ho* | *possiedo* |
    | *tipo* (like) | *per esempio* | *ad esempio, quale* |

    ### Grammar markers of register
    - Formal: congiuntivo kept everywhere, *il quale*, passive, *si* impersonal, nominal style (*la realizzazione del progetto*), *egli / esso* in writing.
    - Colloquial: indicative after *penso che*, *che* for everything (*il giorno che ci siamo visti*), dislocations (*Il caffè lo prendo dopo*), *ci* + *avere* (*c'ho fame*), *mica*, *tipo*, *cioè*.
  examples:
    - { es: "Mi sa che domani piove.", en: "I reckon it's going to rain tomorrow. (colloquial)" }
    - { es: "Si prega di non fumare.", en: "Please refrain from smoking. (formal)" }
    - { es: "C'era un sacco di gente in piazza.", en: "There were loads of people in the square. (colloquial)" }
    - { es: "Desidererei ricevere ulteriori informazioni.", en: "I would like to receive further information. (formal)" }
  pitfalls:
    - "Don't write *c'ho* or *un sacco di* in a formal email."
    - "Over-formality in conversation (*egli*, *il quale*) sounds bookish."
    - "*Tipo* as a filler ('like') is very common among young people but marks very informal speech."
  related: [g.colloquial-italian, g.lei-forms, g.academic-register]
  drills:
    - { es: "Sbrigati, è tardi!", en: "Hurry up, it's late!" }
    - { es: "La preghiamo di attendere in linea.", en: "Please hold the line. (formal)" }
    - { es: "Ci vediamo dopo, tipo alle sei?", en: "See you later, like at six?" }
- id: g.suffixes-alterati
  level: b2
  title: "Diminutives, augmentatives and pejoratives: -ino, -one, -accio"
  summary: "Suffixes add size and attitude: casetta, librone, tempaccio, ragazzino."
  explanation: |
    | type | suffixes | examples |
    |---|---|---|
    | diminutive (small, cute) | *-ino, -etto, -ello, -uccio* | *tavolino, casetta, alberello, cappelluccio* |
    | augmentative (big) | *-one* (often masculine) | *librone, nasone, un donnone* |
    | pejorative (bad, ugly) | *-accio, -astro* | *tempaccio, parolaccia, giovinastro* |
    | affectionate | *-uccio, -otto* | *tesoruccio, ragazzotto* |

    ### Watch out
    - Some altered words are **separate words**: *il telefonino* (mobile phone), *il fazzoletto* (handkerchief), *il cassetto* (drawer), *il bottone* (button), *il rubinetto* (tap), *il mattone* (brick). Don't analyse them.
    - Feminine nouns with *-one* often become masculine: *la porta → il portone* (main door).
    - Adjectives and adverbs too: *benino* (fairly well), *pochino*, *carino* (cute), *bellino*.
    - Names: *Giovannino, Paoletta*.

    Southern Italy loves diminutives in speech: *un caffettino, un attimino*.
  examples:
    - { es: "Abbiamo affittato una casetta sul mare.", en: "We rented a little house by the sea." }
    - { es: "Che tempaccio oggi!", en: "What horrible weather today!" }
    - { es: "Mi aspetti un attimino?", en: "Can you wait a sec?" }
    - { es: "Ha regalato un librone di ricette a sua madre.", en: "He gave his mother a big fat recipe book." }
  pitfalls:
    - "Not every -ino word is a diminutive: *il telefonino* is a mobile, *il postino* a postman."
    - "Don't overuse pejoratives: *parolaccia* (swear word) is itself a pejorative."
    - "Spanish speakers: *-ito* → *-ino / -etto*; *-ón* → *-one*; *-azo* is *-one* or *-ata* (*una gomitata*)."
  related: [g.word-formation, g.register-formal-informal]
  drills:
    - { es: "Che bel gattino!", en: "What a lovely kitten!" }
    - { es: "Mi sono comprato uno zainetto.", en: "I bought myself a little backpack." }
    - { es: "Ho fatto un erroraccio.", en: "I made a terrible mistake." }
    - { es: "Sto benino, grazie.", en: "I'm fairly well, thanks." }
- id: g.colloquial-italian
  level: b2
  title: "Colloquial Italian: che polivalente, c'ho, mica, cioè"
  summary: "Structures of everyday speech that textbooks often skip."
  explanation: |
    ### Che for everything
    In speech *che* often replaces *in cui, quando, perché*: *il giorno che ci siamo conosciuti* (= in cui), *Vieni che ti offro un caffè* (= perché).

    ### Ci + avere
    *C'hai fame? Non c'ho tempo.* (Spelled *c'ho* informally, *ci ho* rarely.)

    ### Imperfetto in hypotheses and requests
    *Se lo sapevo, venivo.* — *Volevo un caffè.*

    ### Discourse words
    | word | use |
    |---|---|
    | *cioè* | I mean, that is |
    | *allora* | so, well |
    | *insomma* | in short, well… |
    | *mica* | not at all, not exactly (*Non è mica facile*) |
    | *magari* | maybe / I wish |
    | *boh* | dunno |
    | *dai* | come on |
    | *praticamente* | basically |

    ### Gli for loro / le
    *Gli ho detto* for 'I told them' is standard; for 'I told her' it is colloquial and frowned upon in writing.
  examples:
    - { es: "Non c'ho voglia di uscire.", en: "I can't be bothered to go out." }
    - { es: "Ti ricordi l'estate che siamo andati a Ischia?", en: "Do you remember the summer we went to Ischia?" }
    - { es: "Mica male questa pizza!", en: "This pizza's not bad at all!" }
    - { es: "Boh, non lo so, cioè, forse.", en: "Dunno, I mean, maybe." }
  pitfalls:
    - "Don't write *c'ho* in formal texts; in speech it is everywhere."
    - "*Gli* meaning 'to her' is colloquial: use *le* in writing."
    - "*Mica* is not 'a bit': *non è mica vero* = it's not true at all."
  related: [g.register-formal-informal, g.discourse-particles, g.dislocation]
  drills:
    - { es: "Dai, vieni con noi!", en: "Come on, come with us!" }
    - { es: "Allora, che facciamo stasera?", en: "So, what are we doing tonight?" }
    - { es: "Insomma, non è andata benissimo.", en: "Well, it didn't go that well." }
- id: g.argumentation-connectors
  level: b2
  title: "Connectors for arguing: innanzitutto, inoltre, d'altra parte, in conclusione"
  summary: "Ordering, adding, contrasting, giving examples and concluding in an argument."
  explanation: |
    | function | connectors |
    |---|---|
    | opening | *innanzitutto, in primo luogo, per cominciare* |
    | adding | *inoltre, in più, per di più, oltre a ciò, non solo… ma anche* |
    | contrasting | *d'altra parte, d'altro canto, al contrario, tuttavia, ciononostante* |
    | example | *ad esempio, per esempio, come dimostra, si pensi a* |
    | clarifying | *cioè, vale a dire, in altre parole, ovvero* |
    | cause / effect | *dal momento che, poiché, di conseguenza, pertanto* |
    | conceding | *è vero che… ma, sebbene, pur riconoscendo che* |
    | concluding | *in conclusione, per concludere, insomma, in definitiva, tutto sommato* |

    *Ovvero* means 'that is / namely' (sometimes 'or'); *pertanto* = therefore (formal); *tutto sommato* = all things considered.
  examples:
    - { es: "Innanzitutto, il turismo porta lavoro; inoltre, valorizza il territorio.", en: "First of all, tourism brings jobs; moreover, it enhances the area." }
    - { es: "D'altra parte, bisogna considerare l'impatto ambientale.", en: "On the other hand, we must consider the environmental impact." }
    - { es: "Si pensi, ad esempio, ai trulli di Alberobello.", en: "Consider, for example, the trulli of Alberobello." }
    - { es: "Tutto sommato, i vantaggi superano gli svantaggi.", en: "All things considered, the advantages outweigh the disadvantages." }
  pitfalls:
    - "*Inoltre* (moreover) ≠ *invece* (instead)."
    - "*Ovvero* in formal Italian usually means 'that is', not 'or'."
    - "Spanish speakers: *además* → *inoltre*; *por otro lado* → *d'altra parte*; *por lo tanto* → *pertanto / quindi*."
  related: [g.connectors-cause-consequence, g.essay-structure, g.discourse-markers-advanced]
  drills:
    - { es: "In primo luogo, vorrei ringraziare tutti.", en: "First of all, I'd like to thank everyone." }
    - { es: "Non solo è economico, ma anche veloce.", en: "It's not only cheap but also fast." }
    - { es: "In conclusione, la proposta va migliorata.", en: "In conclusion, the proposal needs improving." }
- id: g.opinion-structures
  level: b2
  title: "Expressing and qualifying opinions: a mio avviso, non è detto che"
  summary: "Nuanced opinions with indicative or congiuntivo: è innegabile che, non è detto che, mi pare evidente che."
  explanation: |
    ### Stating a view
    *A mio avviso, a mio parere, dal mio punto di vista, personalmente* + indicative.
    *Ritengo / Credo / Sono convinto che* + congiuntivo (*sono convinto che* also takes the indicative).

    ### Certainty → indicative
    *È evidente / innegabile / chiaro / indubbio che* + indicative: *È innegabile che il Sud abbia… / ha…* (the indicative stresses fact; the congiuntivo is also found in formal style).

    ### Doubt and hedging → congiuntivo
    *Non è detto che* (it doesn't follow that), *Non è affatto certo che, Può darsi che, Dubito che*:
    - *Non è detto che i turisti portino solo vantaggi.*

    ### Agreeing / disagreeing in debate
    *Condivido in pieno…, Concordo con…, Non sono affatto d'accordo…, Mi permetto di dissentire…, Su questo punto ha ragione, però…*
  examples:
    - { es: "A mio avviso, il problema è più complesso.", en: "In my view, the problem is more complex." }
    - { es: "Non è detto che sia la scelta giusta.", en: "It's not necessarily the right choice." }
    - { es: "È innegabile che la città è cambiata.", en: "It's undeniable that the city has changed." }
    - { es: "Mi permetto di dissentire.", en: "Allow me to disagree." }
  pitfalls:
    - "*Non è detto che* + congiuntivo: *non è detto che piova*."
    - "*Condividere* an opinion = to share / agree with it: *condivido la tua idea*."
    - "Don't overuse *secondo me* in essays: vary with *a mio avviso, ritengo che*."
  related: [g.opinions, g.congiuntivo-opinion, g.argumentation-connectors]
  drills:
    - { es: "Dal mio punto di vista, è una buona idea.", en: "From my point of view, it's a good idea." }
    - { es: "Dubito che la situazione migliori presto.", en: "I doubt the situation will improve soon." }
    - { es: "Condivido in pieno quello che hai detto.", en: "I fully agree with what you said." }
- id: g.essay-structure
  level: b2
  title: "Structuring an argumentative text (il testo argomentativo)"
  summary: "Introduction with a thesis, arguments, counter-argument and rebuttal, conclusion."
  explanation: |
    ### The classic Italian *tema argomentativo*
    1. **Introduzione** — present the issue and your **tesi**: *Negli ultimi anni si discute molto di… In questo testo sosterrò che…*
    2. **Argomenti** — two or three points, each with an example: *In primo luogo… Un esempio significativo è…*
    3. **Antitesi** — the opposing view: *È vero che… / Qualcuno potrebbe obiettare che…*
    4. **Confutazione** — your reply: *Tuttavia… / Ciononostante…*
    5. **Conclusione** — restate and broaden: *In conclusione… Per questi motivi ritengo che…*

    ### Style tips
    - Impersonal constructions: *si ritiene, è opportuno, va detto che*.
    - Nominal style for density: *l'aumento dei prezzi* rather than *i prezzi aumentano*.
    - One idea per paragraph; link paragraphs with connectors.
  examples:
    - { es: "Negli ultimi anni si discute molto del turismo di massa.", en: "In recent years there has been much debate about mass tourism." }
    - { es: "Qualcuno potrebbe obiettare che il turismo crea lavoro.", en: "Someone might object that tourism creates jobs." }
    - { es: "Per questi motivi ritengo che serva un limite agli ingressi.", en: "For these reasons I believe a cap on entries is needed." }
  pitfalls:
    - "State your thesis early: Italian examiners expect it in the introduction."
    - "Avoid *io penso* in every paragraph; use impersonal forms."
    - "Don't end with a new argument: the conclusion summarises."
  related: [g.argumentation-connectors, g.opinion-structures, g.text-types]
  drills:
    - { es: "In questo testo sosterrò che le città d'arte vanno protette.", en: "In this essay I will argue that art cities must be protected." }
    - { es: "Un esempio significativo è quello di Venezia.", en: "A significant example is Venice." }
    - { es: "Ciononostante, i vantaggi restano evidenti.", en: "Nevertheless, the advantages remain clear." }
- id: g.dislocation
  level: b2
  title: "Il caffè lo prendo amaro — left and right dislocation"
  summary: "Move the topic to the front or the end and repeat it with a pronoun."
  explanation: |
    Spoken Italian often puts the **topic** first and repeats it with a pronoun (*lo, la, li, le, ne, ci, gli*):

    ### Left dislocation (topic first)
    - *Il caffè **lo** prendo amaro.* — Coffee, I take it black.
    - *A Marco **gli** ho già scritto.* (colloquial double)
    - *Di pizze **ne** ho mangiate tre.*
    - *A Napoli **ci** vado ogni anno.*

    ### Right dislocation (topic after, as an afterthought)
    - ***L'**hai visto, il film?* — Did you see it, the film?
    - ***Ne** vuoi ancora, di pasta?*

    The pronoun is **compulsory** when a direct object comes first: *La pizza la mangio*, not *La pizza mangio* (which sounds contrastive or poetic).

    This is normal, natural Italian, not an error — but in formal writing use the plain order.
  examples:
    - { es: "Le chiavi le hai prese tu?", en: "Did you take the keys?" }
    - { es: "Il napoletano non lo parlo, ma lo capisco.", en: "I don't speak Neapolitan, but I understand it." }
    - { es: "Ce l'hai, il biglietto?", en: "Have you got it, the ticket?" }
    - { es: "Di questo ne parliamo domani.", en: "We'll talk about this tomorrow." }
  pitfalls:
    - "A fronted direct object needs its pronoun: *Il libro l'ho letto*."
    - "*Di questo ne parliamo* is acceptable in speech; in writing prefer *Ne parliamo domani* or *Parliamo di questo domani*."
    - "Spanish speakers: Spanish does the same (*el café lo tomo solo*), so it transfers easily."
  related: [g.cleft-sentences, g.direct-object-pronouns, g.colloquial-italian]
  drills:
    - { es: "Il pesce lo compro al mercato.", en: "I buy fish at the market." }
    - { es: "Quel film l'ho visto tre volte.", en: "I've seen that film three times." }
    - { es: "Li hai chiamati, i tuoi?", en: "Have you called them, your parents?" }
    - { es: "A Bari ci torno a Natale.", en: "I'm going back to Bari at Christmas." }
- id: g.cleft-sentences
  level: b2
  title: "È lui che… / È stato Marco a… — cleft sentences"
  summary: "Emphasise one element with essere + element + che, or essere + subject + a + infinitive."
  explanation: |
    ### essere + element + che
    - *È Marco che ha chiamato.* — It was Marco who called.
    - *È a Napoli che ci siamo conosciuti.* — It was in Naples that we met.
    - *È per questo che sono venuto.* — That's why I came.

    ### essere + subject + a + infinitive (very Italian)
    - *È stato Marco a chiamare.* — It was Marco who called.
    - *Sono stati i vicini a chiamare la polizia.*
    - *Sei tu a decidere.* — It's up to you to decide.

    The verb *essere* agrees with the emphasised subject (*sono stati i vicini*) and takes the tense of the sentence.

    ### Other emphatic patterns
    *Quello che mi piace è… / Ciò che conta è… / Il fatto è che…*
  examples:
    - { es: "È stata Giulia a organizzare la festa.", en: "It was Giulia who organised the party." }
    - { es: "È proprio questo che non capisco.", en: "That's exactly what I don't understand." }
    - { es: "Non è stato il caso a farci incontrare.", en: "It wasn't chance that brought us together." }
    - { es: "Quello che mi manca di più è il mare.", en: "What I miss most is the sea." }
  pitfalls:
    - "Agreement: *sono stati loro a dirlo*, not *è stato loro*."
    - "With the *a* + infinitive pattern, the subject must do the action of the infinitive."
    - "Spanish speakers: *fue Marco quien llamó* → *è stato Marco a chiamare* (the *a* structure is preferred)."
  related: [g.dislocation, g.focus-particles]
  drills:
    - { es: "È per te che lo faccio.", en: "It's for you that I'm doing it." }
    - { es: "Sono stati i nonni a insegnarmi il dialetto.", en: "It was my grandparents who taught me the dialect." }
    - { es: "Sei tu che devi scegliere.", en: "You're the one who has to choose." }
- id: g.focus-particles
  level: b2
  title: "Proprio, perfino, addirittura, persino, appunto"
  summary: "Focus words that add emphasis, surprise or precision."
  explanation: |
    | word | meaning | example |
    |---|---|---|
    | *proprio* | exactly, really, right | *Abita proprio qui. È proprio bello.* |
    | *perfino / persino* | even | *Ha mangiato perfino il dolce.* |
    | *addirittura* | even, no less (surprise) | *Ha aspettato addirittura tre ore!* |
    | *appunto* | precisely, exactly (agreeing) | *È appunto quello che dicevo.* |
    | *solo / soltanto / solamente* | only | *Ne voglio solo uno.* |
    | *anche* | also, even | *Anche i bambini lo sanno.* |
    | *nemmeno / neanche / neppure* | not even | *Non mi ha nemmeno salutato.* |
    | *mica* | not at all (colloquial) | *Non sono mica scemo!* |

    ### Proprio in replies
    *Proprio così!* (Exactly!) — *Non proprio.* (Not really.) — *Proprio adesso?* (Right now?)

    Placement: the particle goes just **before** the word it focuses.
  examples:
    - { es: "È proprio la casa che cercavo.", en: "It's exactly the house I was looking for." }
    - { es: "Ha nevicato persino a Bari!", en: "It even snowed in Bari!" }
    - { es: "Ci ha messo addirittura cinque ore.", en: "It took him a whopping five hours." }
    - { es: "Non ho nemmeno avuto il tempo di pranzare.", en: "I didn't even have time to have lunch." }
  pitfalls:
    - "*Proprio* as an adjective means 'own' (*la propria casa*); as an adverb 'really, exactly'."
    - "*Neanche* after the verb needs *non*: *non lo so neanche io*."
    - "Spanish speakers: *incluso* → *perfino / persino*; *justo* → *proprio*."
  related: [g.cleft-sentences, g.anche-neanche]
  drills:
    - { es: "Sei proprio tu!", en: "It's really you!" }
    - { es: "Lo sa perfino mia nonna.", en: "Even my grandmother knows that." }
    - { es: "Appunto, è quello che ti stavo dicendo.", en: "Exactly, that's what I was telling you." }
- id: g.italian-varieties-overview
  level: b2
  title: "One language, many Italians: standard, regional, dialect"
  summary: "Standard Italian, regional Italian and the dialects form a spectrum every Italian moves along."
  explanation: |
    ### Three layers
    | layer | what it is | example |
    |---|---|---|
    | **standard Italian** | the written norm, based on Florentine, used in schools and the media | *Che cosa fai?* |
    | **regional Italian** | Italian with local accent, words and grammar | Milan *Cosa fai?*, Rome *Che stai a fa'?* |
    | **dialects** | local Romance languages descended from Latin, not 'bad Italian' | Neapolitan *Che staje facenno?* |

    ### Some well-known regional differences
    - **North**: *la Maria* (article with names), passato prossimo for all past events, *tipo, figo*.
    - **Centre**: Tuscan *codesto*, *noi si va* (we go), the *gorgia* (*la hasa* for *la casa*); Roman *mo'*, *annamo*.
    - **South**: passato remoto in speech, *tenere* for 'have', *stare* for 'be', *a* before direct objects (*ho visto a Mario*), *mi sono seduto* → *mi sono assettato* in Neapolitan-influenced speech.

    ### Vocabulary
    *anguria / cocomero / melone d'acqua* (watermelon), *stracchino / crescenza*, *cornetto / brioche*.
  examples:
    - { es: "A Milano si dice brioche, a Roma cornetto.", en: "In Milan they say brioche, in Rome cornetto." }
    - { es: "Mia nonna parla il dialetto, io capisco ma non lo parlo.", en: "My grandmother speaks dialect; I understand it but don't speak it." }
    - { es: "In Toscana si sente spesso 'noi si va' invece di 'noi andiamo'.", en: "In Tuscany you often hear 'noi si va' instead of 'noi andiamo' (we go)." }
  pitfalls:
    - "Dialects are not 'broken Italian': many are as old as Italian itself."
    - "Regional features are normal in speech; the written standard is the same everywhere."
    - "Don't imitate a regional feature you can't place: it can sound mocking."
  variant: "Words differ by region: *anguria* (North), *cocomero* (Centre), *mellone* (South) all mean watermelon."
  related: [g.regional-italian-south, g.dialects-overview]
  drills:
    - { es: "In Toscana si dice cocomero, al Nord anguria.", en: "In Tuscany they say cocomero, in the North anguria." }
    - { es: "Molti italiani parlano sia l'italiano sia un dialetto.", en: "Many Italians speak both Italian and a dialect." }
    - { es: "L'italiano standard si basa sul fiorentino.", en: "Standard Italian is based on Florentine." }
- id: g.regional-italian-south
  level: b2
  title: "Regional Italian in the South"
  summary: "Passato remoto in speech, tenere and stare, accusative a, a me mi, and the Neapolitan touch."
  explanation: |
    You will hear these features in Naples, Bari, Calabria and Sicily. Understand them; use the standard forms yourself.

    | regional (South) | standard | meaning |
    |---|---|---|
    | *Ieri andai al mare.* | *Ieri sono andato al mare.* | passato remoto for recent past |
    | *Tengo fame. Tengo due figli.* | *Ho fame. Ho due figli.* | *tenere* = *avere* |
    | *Sto a casa. Sta stanco.* | *Sono a casa. È stanco.* | *stare* = *essere* |
    | *Ho visto a Mario.* | *Ho visto Mario.* | *a* before a person object |
    | *Esci il cane!* | *Porta fuori il cane!* | *uscire, salire, scendere* used transitively |
    | *A me mi piace.* | *A me piace.* | double pronoun |
    | *Si è imparato la lezione.* | *Ha imparato la lezione.* | reflexive *si* for emphasis |

    ### Typical words and expressions
    *guaglione* (boy, Naples), *jamme!* (let's go), *uè!* (hey!), *mannaggia!* (damn!), *magari* (I wish), *sciò!* (shoo!), *picciotto* (lad, Sicily), *amunì* (come on, Sicily).
  examples:
    - { es: "Tengo fame, andiamo a mangiare!", en: "I'm hungry, let's go and eat! (southern)" }
    - { es: "Quando arrivasti a Bari?", en: "When did you get to Bari? (southern passato remoto)" }
    - { es: "Ho chiamato a tua sorella.", en: "I called your sister. (southern; standard: ho chiamato tua sorella)" }
    - { es: "Scendi la valigia, per favore.", en: "Bring the suitcase down, please. (southern)" }
  pitfalls:
    - "Don't copy *tengo fame* into standard writing: *ho fame*."
    - "The southern passato remoto is not old-fashioned there: it is normal speech."
    - "Spanish speakers: *tengo hambre* and *vi a María* look 'right' to you because southern Italian shares these features with Spanish, but standard Italian does not."
  variant: "Neapolitan, Barese, Calabrian and Sicilian are distinct dialects; the features above are regional Italian, the Italian that southerners speak when they are not speaking dialect."
  related: [g.italian-varieties-overview, g.passato-remoto-vs-prossimo, g.regional-italian-features]
  drills:
    - { es: "Sto a casa, vieni pure.", en: "I'm at home, come over. (southern; standard: sono a casa)" }
    - { es: "Mannaggia, ho perso il treno!", en: "Damn, I missed the train!" }
    - { es: "Uè, guaglio', come stai?", en: "Hey, mate, how are you? (Neapolitan)" }
- id: g.b2-review
  level: b2
  title: "B2 review: hypotheses, passive, emphasis"
  summary: "All congiuntivo tenses, the periodo ipotetico, the passive, causatives, dislocation and register."
  explanation: |
    ### The four congiuntivo tenses
    | | present / future | past |
    |---|---|---|
    | after present trigger | *sia* | *sia stato* |
    | after past / conditional trigger | *fosse* | *fosse stato* |

    ### Periodo ipotetico
    | | |
    |---|---|
    | real | *Se piove, resto a casa.* |
    | possible / unreal now | *Se piovesse, resterei a casa.* |
    | unreal past | *Se fosse piovuto, sarei rimasto a casa.* |
    | mixed | *Se fosse piovuto, ora sarei a casa.* |

    ### Passive and causative
    *è stato costruito / viene servito / va fatto / si vendono / mi sono fatto tagliare i capelli / lasciami parlare*.

    ### Emphasis and register
    Dislocation (*Il caffè lo prendo amaro*), clefts (*È stato lui a…*), focus particles, colloquial vs formal choices, regional Italian.
  examples:
    - { es: "Se avessi saputo che venivi, avrei preparato la parmigiana.", en: "If I'd known you were coming, I'd have made parmigiana." }
    - { es: "Il palazzo, che fu costruito nel Seicento, va restaurato.", en: "The palace, which was built in the 17th century, needs restoring." }
    - { es: "Benché fosse stanca, è stata lei a guidare fino a Lecce.", en: "Although she was tired, it was she who drove to Lecce." }
    - { es: "Vorrei che tu mi lasciassi finire.", en: "I'd like you to let me finish." }
  pitfalls:
    - "Never the conditional after *se*."
    - "*Venire* passive only in simple tenses."
    - "Match the congiuntivo tense to the main verb: *pensavo che fosse*, not *pensavo che sia*."
  related: [g.concordanza-congiuntivo, g.periodo-ipotetico-3, g.passive-essere]
  drills:
    - { es: "Magari avessi più tempo per viaggiare!", en: "If only I had more time to travel!" }
    - { es: "Chiunque abbia preso le mie chiavi, me le restituisca.", en: "Whoever took my keys, give them back." }
    - { es: "Me ne sono andato prima che finisse il concerto.", en: "I left before the concert ended." }
    - { es: "Questo modulo va firmato e consegnato entro venerdì.", en: "This form must be signed and handed in by Friday." }
