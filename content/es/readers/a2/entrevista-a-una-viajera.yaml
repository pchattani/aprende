id: r.a2.entrevista-a-una-viajera
level: a2
title: Entrevista a una viajera
kind: dialogue
intro: A radio programme interviews Inés, who has just returned from a year travelling around Latin America.
allow: [inés, locutor, latinoamérica, méxico, perú, colombia, bolivia, chile, machu, picchu, patagonia, mexicana, peruano, salsa]
paragraphs:
  - { es: "Locutor: Esta tarde hablamos con Inés, que acaba de volver de un año de viaje por Latinoamérica. Inés, bienvenida. ¿Por dónde has viajado?", en: "Presenter: This afternoon we're talking to Inés, who has just come back from a year travelling around Latin America. Inés, welcome. Where have you travelled?" }
  - { es: "Inés: Gracias. He recorrido seis países: empecé en México y terminé en Chile, pasando por Colombia, Perú y Bolivia. En total, unos quince mil kilómetros.", en: "Inés: Thank you. I've travelled through six countries: I started in Mexico and finished in Chile, passing through Colombia, Peru and Bolivia. In total, about fifteen thousand kilometres." }
  - { es: "Locutor: ¿Has viajado sola todo el tiempo?", en: "Presenter: Have you travelled alone the whole time?" }
  - { es: "Inés: Casi siempre. Pero nunca me he sentido sola: en los albergues siempre hay alguien con quien hablar, y la gente local me ha ayudado muchísimo. Nadie me ha tratado mal en ningún sitio.", en: "Inés: Almost always. But I've never felt lonely: in hostels there's always someone to talk to, and local people have helped me enormously. Nobody treated me badly anywhere." }
  - { es: "Locutor: ¿Cuál ha sido el mejor momento?", en: "Presenter: What has been the best moment?" }
  - { es: "Inés: Es difícil elegir. Ver Machu Picchu al amanecer fue impresionante. Pero quizás lo mejor fue una semana en un pueblo de Bolivia, donde una familia me invitó a quedarme con ellos. Aprendí a cocinar sus platos típicos y a hablar un poco de su idioma.", en: "Inés: It's hard to choose. Seeing Machu Picchu at dawn was impressive. But perhaps the best was a week in a village in Bolivia, where a family invited me to stay with them. I learnt to cook their typical dishes and to speak a bit of their language." }
  - { es: "Locutor: ¿Y algún momento difícil?", en: "Presenter: And any difficult moments?" }
  - { es: "Inés: Alguno, sí. En Colombia me robaron la mochila con el pasaporte y el cargador del móvil. Estaba haciendo cola en la estación de autobuses y, cuando me di cuenta, ya no estaba. Pero la policía me ayudó y en tres días tenía un pasaporte nuevo.", en: "Inés: A few, yes. In Colombia my backpack was stolen with my passport and my phone charger. I was queuing at the bus station and, when I realised, it was gone. But the police helped me and in three days I had a new passport." }
  - { es: "Locutor: ¿Qué consejo le darías a alguien que quiere hacer un viaje así?", en: "Presenter: What advice would you give someone who wants to do a trip like that?" }
  - { es: "Inés: Tres cosas. Primero, no tengas miedo: la gente es buena en todas partes. Segundo, aprende el idioma antes de salir; cambia completamente el viaje. Y tercero, viaja despacio: es mejor conocer bien tres lugares que pasar corriendo por diez.", en: "Inés: Three things. First, don't be afraid: people are good everywhere. Second, learn the language before you leave; it completely changes the trip. And third, travel slowly: it's better to get to know three places well than to rush through ten." }
  - { es: "Locutor: ¿Volverías?", en: "Presenter: Would you go back?" }
  - { es: "Inés: Mañana mismo. Ya estoy ahorrando para el próximo viaje.", en: "Inés: Tomorrow. I'm already saving for the next trip." }
questions:
  - { q: "How many countries did Inés visit?", options: ["Three", "Six", "Fifteen"], answer: 1 }
  - { q: "What happened in Colombia?", options: ["She got ill", "Her backpack was stolen", "She missed a bus"], answer: 1 }
  - { q: "What is her third piece of advice?", options: ["Travel fast", "Travel slowly", "Travel alone"], answer: 1 }
glossary:
  - { es: tratar, en: to treat }
  - { es: amanecer, en: dawn }
  - { es: consejo, en: advice }
  - { es: en todas partes, en: everywhere }
