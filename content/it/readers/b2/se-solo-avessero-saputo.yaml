id: r.b2.se-solo-avessero-saputo
level: b2
title: Se solo avessero saputo
kind: text
intro: What happened at Pompeii in AD 79, and what might have happened if its inhabitants had understood the signs. Past hypotheses with the congiuntivo trapassato and the condizionale passato.
allow: [pompei, ercolano, plinio, vesuvio, stabia, miseno, tacito, fiorelli, giuseppe, romani]
paragraphs:
  - { es: "Quando si cammina oggi per le strade di Pompei, tra le botteghe, le terme e le case decorate con affreschi, si ha l'impressione che gli abitanti siano usciti un momento e stiano per tornare. Sui muri ci sono ancora le scritte elettorali, le pubblicità delle taverne, perfino gli insulti tra vicini. Poi si arriva davanti ai calchi delle vittime, e ci si ricorda di come sia finita.", en: "When you walk through the streets of Pompeii today, among the shops, the baths and the houses decorated with frescoes, you get the impression that the inhabitants have just popped out and are about to come back. On the walls there are still election slogans, advertisements for taverns, even insults between neighbours. Then you come to the casts of the victims, and you remember how it ended." }
  - { es: "Nel 79 dopo Cristo, Pompei era una città ricca di circa diecimila abitanti, ai piedi del Vesuvio. Nessuno sapeva che quella montagna verde, coperta di vigne, fosse un vulcano. L'ultima grande eruzione era avvenuta molti secoli prima, e nessuno se ne ricordava. Eppure i segnali c'erano stati. Diciassette anni prima, nel 62, un forte terremoto aveva distrutto buona parte della città, e molti edifici erano ancora in ricostruzione. Nei giorni prima della catastrofe, inoltre, la terra aveva tremato più volte e alcune fontane si erano seccate.", en: "In AD 79 Pompeii was a wealthy town of about ten thousand inhabitants at the foot of Vesuvius. Nobody knew that the green mountain, covered in vineyards, was a volcano. The last major eruption had happened many centuries earlier, and nobody remembered it. And yet there had been signs. Seventeen years earlier, in 62, a strong earthquake had destroyed a good part of the town, and many buildings were still being rebuilt. In the days before the disaster, moreover, the ground had shaken several times and some fountains had dried up." }
  - { es: "Se gli abitanti avessero capito quei segnali, forse se ne sarebbero andati in tempo. Ma per i Romani i terremoti erano un fatto normale in Campania, e nessuno li aveva mai collegati alla montagna. Così, quando, verso l'una del pomeriggio del giorno dell'eruzione, un'enorme nuvola a forma di pino si alzò sopra il Vesuvio, molti rimasero a guardarla con curiosità, invece di scappare.", en: "If the inhabitants had understood those signs, perhaps they would have left in time. But for the Romans earthquakes were a normal fact of life in Campania, and nobody had ever connected them with the mountain. So when, at around one in the afternoon on the day of the eruption, an enormous cloud shaped like a pine tree rose above Vesuvius, many people stood watching it with curiosity instead of running away." }
  - { es: "Sappiamo tutto questo grazie a Plinio il Giovane, che vide l'eruzione da Miseno, dall'altra parte del golfo, e che anni dopo la descrisse in due lettere allo storico Tacito. Suo zio, Plinio il Vecchio, era il comandante della flotta romana. Partì con le navi per salvare gli abitanti della costa, ma morì a Stabia, probabilmente soffocato dai gas. Se fosse rimasto a Miseno, si sarebbe salvato; ma allora non sarebbe stato il primo, nella storia, a morire cercando di aiutare le vittime di un vulcano.", en: "We know all this thanks to Pliny the Younger, who watched the eruption from Misenum, on the other side of the bay, and who years later described it in two letters to the historian Tacitus. His uncle, Pliny the Elder, was the commander of the Roman fleet. He set out with his ships to rescue the people of the coast, but died at Stabiae, probably suffocated by the gases. If he had stayed in Misenum, he would have been saved; but then he wouldn't have been the first person in history to die trying to help the victims of a volcano." }
  - { es: "Per molte ore su Pompei cadde una pioggia di pietre leggere e di cenere, che fece crollare i tetti. Chi fuggì subito, probabilmente si salvò. Chi invece restò in casa, sperando che tutto finisse presto, fu ucciso la mattina dopo da una nube di gas e cenere bollente che scese dal vulcano a grande velocità. In pochi minuti la città scomparve sotto sei metri di materiale.", en: "For many hours a rain of light stones and ash fell on Pompeii, making the roofs collapse. Those who fled straight away probably survived. Those who stayed at home instead, hoping it would all end soon, were killed the next morning by a cloud of scalding gas and ash that came down the volcano at great speed. In a few minutes the town disappeared under six metres of material." }
  - { es: "Paradossalmente, se il Vesuvio non avesse distrutto Pompei, oggi non sapremmo quasi niente della vita quotidiana dei Romani. La cenere ha conservato tutto: il pane nei forni, i graffiti, i colori delle pareti. Nell'Ottocento l'archeologo Giuseppe Fiorelli ebbe l'idea di versare il gesso nei vuoti lasciati dai corpi nella cenere: è così che sono nati i calchi che ancora oggi ci commuovono.", en: "Paradoxically, if Vesuvius hadn't destroyed Pompeii, today we would know almost nothing about the daily life of the Romans. The ash preserved everything: the bread in the ovens, the graffiti, the colours of the walls. In the nineteenth century the archaeologist Giuseppe Fiorelli had the idea of pouring plaster into the hollows left by the bodies in the ash: that is how the casts that still move us today came into being." }
  - { es: "E il Vesuvio? È ancora lì, tranquillo solo in apparenza. Oggi, almeno, i segnali li sappiamo leggere.", en: "And Vesuvius? It's still there, calm only on the surface. Today, at least, we know how to read the signs." }
questions:
  - { q: "Che cosa non sapevano gli abitanti di Pompei?", options: ["Che il Vesuvio fosse un vulcano", "Che ci fossero terremoti", "Che la città fosse ricca"], answer: 0, explain: "The mountain was green and covered in vineyards, and its last big eruption was centuries earlier." }
  - { q: "Perché molti non scapparono quando videro la nuvola?", options: ["Perché non avevano paura dei terremoti e non collegavano la montagna al pericolo", "Perché era notte", "Perché le strade erano chiuse"], answer: 0, explain: "Earthquakes were normal to them and nobody connected them with the mountain; they watched the cloud out of curiosity." }
  - { q: "Come conosciamo i fatti dell'eruzione?", options: ["Da un affresco di Pompei", "Dalle lettere di Plinio il Giovane a Tacito", "Da un libro di Plinio il Vecchio"], answer: 1, explain: "Pliny the Younger watched from Misenum and later described it in two letters to Tacitus." }
  - { q: "Che cosa sarebbe successo se Plinio il Vecchio fosse rimasto a Miseno?", options: ["Si sarebbe salvato", "Avrebbe salvato Pompei", "Avrebbe scritto le lettere"], answer: 0, explain: "«Se fosse rimasto a Miseno, si sarebbe salvato» – a past hypothesis (periodo ipotetico del terzo tipo)." }
  - { q: "Che cosa fece l'archeologo Giuseppe Fiorelli?", options: ["Scoprì Pompei", "Versò il gesso nei vuoti lasciati dai corpi, creando i calchi", "Scrisse la storia della città"], answer: 1, explain: "Pouring plaster into the hollows in the ash produced the famous casts of the victims." }
