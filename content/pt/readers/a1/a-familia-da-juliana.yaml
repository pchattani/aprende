id: r.a1.a-familia-da-juliana
level: a1
title: A família da Juliana
kind: text
intro: Juliana, a nurse from Rio, introduces her big family, from her grandmother in Santa Teresa to her little nephew.
allow: [juliana, marcos, fernanda, gabriel, rosa, joão, santa, teresa, botafogo]
paragraphs:
  - { es: "Oi! Eu me chamo Juliana e tenho trinta anos. Sou enfermeira e trabalho num hospital no centro do Rio. Sou carioca: moro em Botafogo, um bairro perto da praia, com meu marido, o Marcos.", en: "Hi! My name is Juliana and I'm thirty. I'm a nurse and I work in a hospital in the centre of Rio. I'm from Rio: I live in Botafogo, a neighbourhood near the beach, with my husband, Marcos." }
  - { es: "O Marcos é professor de inglês numa escola. Ele é alto, magro e tem o cabelo cacheado. É muito engraçado e trabalhador. Nós não temos filhos, mas temos um gato preto. O nome dele é Feijão!", en: "Marcos is an English teacher at a school. He's tall, thin and has curly hair. He's very funny and hard-working. We don't have children, but we have a black cat. His name is Feijão!" }
  - { es: "Minha família é grande. Meu pai se chama João e tem sessenta e dois anos. Ele é motorista de táxi e conhece todas as ruas da cidade. Minha mãe, Rosa, é cozinheira. Ela faz uma feijoada deliciosa todo sábado.", en: "My family is big. My father's name is João and he's sixty-two. He's a taxi driver and knows every street in the city. My mother, Rosa, is a cook. She makes a delicious feijoada every Saturday." }
  - { es: "Eu tenho um irmão e uma irmã. Meu irmão, Gabriel, tem vinte e cinco anos e é estudante de engenharia. Ele é solteiro e adora futebol. Minha irmã, Fernanda, tem trinta e cinco anos. Ela é casada e tem um filho, o Pedro. O Pedro tem quatro anos e é muito alegre. Ele é meu sobrinho favorito... e o único!", en: "I have a brother and a sister. My brother, Gabriel, is twenty-five and an engineering student. He's single and loves football. My sister, Fernanda, is thirty-five. She's married and has a son, Pedro. Pedro is four and very cheerful. He's my favourite nephew... and the only one!" }
  - { es: "Minha avó tem oitenta e sete anos e mora sozinha numa casa antiga em Santa Teresa. A casa tem um jardim com muitas flores. Ela é pequena, tem o cabelo branco e é muito inteligente. Ela lê o jornal todo dia e fala com todos os vizinhos.", en: "My grandmother is eighty-seven and lives alone in an old house in Santa Teresa. The house has a garden with lots of flowers. She's small, has white hair and is very intelligent. She reads the newspaper every day and talks to all the neighbours." }
  - { es: "No domingo, a família toda almoça na casa da minha avó. Meu pai traz o pão, minha mãe faz o almoço e o Pedro brinca no jardim com o cachorro dos vizinhos. É o meu dia favorito da semana.", en: "On Sundays, the whole family has lunch at my grandmother's house. My father brings the bread, my mother makes lunch and Pedro plays in the garden with the neighbours' dog. It's my favourite day of the week." }
questions:
  - { q: "Qual é a profissão da Juliana?", options: ["Professora", "Enfermeira", "Cozinheira"], answer: 1, explain: "«Sou enfermeira e trabalho num hospital.» Her husband is the teacher and her mother is the cook." }
  - { q: "Quem é o Feijão?", options: ["O gato da Juliana e do Marcos", "O irmão da Juliana", "O cachorro dos vizinhos"], answer: 0, explain: "«Nós não temos filhos, mas temos um gato preto. O nome dele é Feijão!»" }
  - { q: "O que o pai da Juliana faz?", options: ["É engenheiro", "É motorista de táxi", "É estudante"], answer: 1, explain: "«Ele é motorista de táxi e conhece todas as ruas da cidade.»" }
  - { q: "Quem é o Pedro?", options: ["O marido da Juliana", "O filho da Fernanda", "O avô da Juliana"], answer: 1, explain: "Fernanda «é casada e tem um filho, o Pedro» — so Pedro is Juliana's nephew." }
  - { q: "Onde a família almoça no domingo?", options: ["Num restaurante em Botafogo", "Na casa da avó, em Santa Teresa", "Na praia"], answer: 1, explain: "«No domingo, a família toda almoça na casa da minha avó.» The grandmother lives in Santa Teresa." }
glossary:
  - { es: sobrinho, en: nephew }
  - { es: único, en: only (one) }
  - { es: engenharia, en: engineering }
