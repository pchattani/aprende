id: r.c1.cronica-do-ver-o-peso
level: c1
title: "Crônica: o dia em que tentei pechinchar no Ver-o-Peso"
kind: text
intro: "A crônica, the short, personal and ironic newspaper column that Brazilians love, about a visitor from São Paulo trying to bargain at Belém's great riverside market. Enjoy the self-mocking humour, the idioms, the gap between what people say and what they mean, and the Amazonian words of Tupi origin (açaí, tucupi, jambu, maniva)."
allow: [coroa, belém, ver-o-peso, guajará, pará, paulista, paulistas, são, paulo, dona, socorro, açaí, tucupi, jambu, maniva, maniçoba, tacacá, cupuaçu, bacuri, pirarucu, filhote, tapioca, piracema, uirapuru, círio]
paragraphs:
  - { es: "Dizem que o paulista é a única pessoa no mundo capaz de chegar a um mercado às seis da manhã com uma lista de compras e um aplicativo de comparação de preços. Pois foi exatamente assim que eu cheguei ao Ver-o-Peso, em Belém, na minha primeira manhã no Pará. Tinha lido em algum lugar que ali se pechincha, e eu, que nunca pechinchei nem em feira de bairro, estava decidido a provar que tinha aprendido o jeito local antes mesmo do café.", en: "They say the paulista is the only person in the world capable of arriving at a market at six in the morning with a shopping list and a price-comparison app. Well, that is exactly how I arrived at the Ver-o-Peso, in Belém, on my first morning in Pará. I had read somewhere that you bargain there, and I, who had never bargained even at a neighbourhood street market, was determined to prove I had learned the local way before I'd even had coffee." }
  - { es: "O mercado, para quem não conhece, é uma pequena cidade às margens da baía do Guajará. Tem a parte dos peixes, onde filhotes e pirarucus do tamanho de um adulto descansam sobre o gelo; tem a das frutas, com nomes que eu só conhecia de sorvete, como cupuaçu e bacuri; tem as barracas de ervas, que prometem curar de dor nas costas a coração partido; e tem, sobretudo, a feira do açaí, que começa de madrugada, quando os barcos chegam das ilhas carregados de cestos roxos.", en: "The market, for those who don't know it, is a small city on the shores of Guajará Bay. There is the fish section, where filhotes and pirarucus the size of an adult rest on ice; there is the fruit section, with names I only knew from ice cream, like cupuaçu and bacuri; there are the herb stalls, which promise to cure everything from backache to a broken heart; and there is, above all, the açaí fair, which starts before dawn, when the boats arrive from the islands loaded with purple baskets." }
  - { es: "O nome, aliás, já é uma lição de história. No século XVII, os portugueses instalaram ali um posto onde tudo o que chegava pelo rio tinha que ser pesado para pagar imposto à Coroa: era preciso “ver o peso”. Quase quatrocentos anos depois, ainda se pesa tudo, só que agora quem cobra não é o rei, é a dona da barraca. E, como eu ia descobrir, ela cobra com muito mais competência.", en: "The name, incidentally, is already a history lesson. In the seventeenth century the Portuguese set up a post there where everything that arrived by river had to be weighed to pay tax to the Crown: one had to 'see the weight'. Almost four hundred years later, everything is still weighed, except that now the one who collects is not the king but the stallholder. And, as I was about to discover, she collects far more competently." }
  - { es: "Escolhi a minha vítima: uma senhora de uns setenta anos, sentada atrás de uma montanha de ervas e garrafinhas, que se apresentou como dona Socorro. Perguntei, com a naturalidade de quem faz isso todo dia, quanto custava um vidro de um líquido escuro cujo rótulo dizia apenas “para tudo”. Ela disse o preço. Eu, seguindo o roteiro que tinha ensaiado no hotel, fiz cara de espanto, olhei para os lados e ofereci a metade.", en: "I chose my victim: a lady of about seventy, sitting behind a mountain of herbs and little bottles, who introduced herself as Dona Socorro. I asked, with the casualness of someone who does this every day, how much a jar of dark liquid cost whose label said only 'for everything'. She told me the price. Following the script I had rehearsed at the hotel, I put on a look of astonishment, glanced around and offered half." }
  - { es: "Dona Socorro me olhou de cima a baixo, demoradamente, como quem examina um peixe de procedência duvidosa. Depois sorriu. “O senhor é de fora, né?” Confirmei, um pouco decepcionado com a rapidez do diagnóstico. “Então vou fazer um preço especial para o senhor”, disse ela, e me deu um valor ligeiramente mais alto do que o primeiro. Achei que tivesse entendido mal. Não tinha.", en: "Dona Socorro looked me up and down, slowly, the way you examine a fish of doubtful origin. Then she smiled. 'You're not from here, are you?' I confirmed it, a little disappointed at how quickly I'd been diagnosed. 'Then I'll give you a special price,' she said, and gave me a figure slightly higher than the first. I thought I must have misunderstood. I hadn't." }
  - { es: "Protestei, claro. Ela explicou, com toda a calma do mundo, que o preço especial incluía uma aula. E deu a aula ali mesmo: que aquela erva era para dormir, aquela outra para atrair namorado, que o tucupi tem que ferver muitas horas porque, cru, é veneno, e que a maniçoba leva sete dias para ficar pronta, porque a folha da mandioca, a maniva, também é venenosa antes de cozinhar. “Aqui no Pará a gente aprende cedo que nem tudo que parece bom é bom, e nem tudo que parece perigoso é perigoso”, concluiu. Não sei se falava das plantas ou de mim.", en: "I protested, of course. She explained, with all the calm in the world, that the special price included a lesson. And she gave the lesson right there: that this herb was for sleeping, that one for attracting a boyfriend, that tucupi has to boil for many hours because raw it's poison, and that maniçoba takes seven days to be ready, because the cassava leaf, the maniva, is also poisonous before it is cooked. 'Here in Pará we learn early that not everything that looks good is good, and not everything that looks dangerous is dangerous,' she concluded. I don't know whether she was talking about the plants or about me." }
  - { es: "No fim, paguei o preço especial, que, convenhamos, continuava sendo barato para os padrões de São Paulo, e saí com o vidro “para tudo”, um saquinho de ervas para dormir e a promessa de voltar para o Círio de Nazaré, em outubro, “quando Belém fica do avesso”. Dona Socorro ainda me deu de presente um ramo de alguma coisa cheirosa e um conselho: “Da próxima vez, o senhor não pechincha. O senhor conversa. Quem conversa, ganha desconto. Quem pechincha, ganha aula.”", en: "In the end I paid the special price, which, let's face it, was still cheap by São Paulo standards, and left with the 'for everything' jar, a little bag of herbs for sleeping and the promise to come back for the Círio de Nazaré in October, 'when Belém turns upside down'. Dona Socorro even gave me a sprig of something fragrant as a present, and a piece of advice: 'Next time, don't bargain. Talk. Those who talk get a discount. Those who bargain get a lesson.'" }
  - { es: "Fui tomar o meu primeiro açaí de verdade numa barraca ali perto, servido do jeito paraense: grosso, sem açúcar, com farinha de tapioca e peixe frito. Os paulistas que me desculpem, mas o que a gente toma lá no Sul com granola e banana é outra coisa, quase uma ofensa. Enquanto comia, vi um rapaz, claramente turista, de mochila e chapéu, aproximar-se da barraca de dona Socorro com o celular na mão. Ele perguntou o preço. Fez cara de espanto. Ofereceu a metade.", en: "I went to have my first real açaí at a stall nearby, served the Pará way: thick, unsweetened, with tapioca flour and fried fish. My fellow paulistas will forgive me, but what we have down South with granola and banana is something else, almost an insult. While I was eating, I saw a young man, clearly a tourist, with a backpack and a hat, approach Dona Socorro's stall with his phone in his hand. He asked the price. He put on a look of astonishment. He offered half." }
  - { es: "Daqui de longe, não deu para ouvir a resposta. Mas, pelo sorriso dela, tenho certeza de que ele também ia ganhar um preço especial.", en: "From where I was, I couldn't hear the answer. But, judging by her smile, I'm sure he was going to get a special price too." }
questions:
  - { q: "Qual era o plano do narrador ao chegar ao Ver-o-Peso?", options: ["Comprar peixe para o hotel", "Entrevistar os vendedores", "Provar que sabia pechinchar como os moradores locais", "Vender produtos de São Paulo"], answer: 2, explain: "He had read that people bargain there and was determined to prove he had learned the local way." }
  - { q: "O que significa o “preço especial” de dona Socorro?", options: ["Um preço mais alto, que incluía uma aula", "Um desconto grande", "Um presente grátis", "O preço para moradores de Belém"], answer: 0, explain: "Irony: the 'special price' for the outsider was higher than the first, and she said it included a lesson." }
  - { q: "Por que o tucupi precisa ferver por muitas horas?", options: ["Para ficar mais doce", "Porque cru é venenoso", "Porque é feito de peixe", "Para mudar de cor"], answer: 1, explain: "Tucupi, made from wild cassava, is poisonous raw; maniçoba likewise needs days of cooking." }
  - { q: "Qual é o conselho final de dona Socorro?", options: ["Nunca voltar ao mercado", "Comprar só de manhã cedo", "Não pechinchar, mas conversar: quem conversa ganha desconto", "Pagar sempre a metade"], answer: 2, explain: "'Quem conversa, ganha desconto. Quem pechincha, ganha aula.' — relationships matter more than haggling tactics." }
  - { q: "Qual é o efeito da cena final com o turista de mochila?", options: ["Mostra que o narrador ficou com raiva", "Repete a situação do narrador e fecha a crônica com humor", "Explica a história do mercado", "Mostra que dona Socorro mudou de ideia"], answer: 1, explain: "The young tourist repeats exactly the narrator's 'script', and her smile suggests he too will get a 'special price' — a typical circular ending for a crônica." }
