dialogues:
  - id: a1.u11.d1
    title: Perdue sur les quais
    context: Claire, a visitor, asks a bouquiniste on the quays of the Seine for directions.
    lines:
      - { speaker: Claire, es: "Excusez-moi, monsieur. Parlez-vous anglais ?", en: "Excuse me, sir. Do you speak English?" }
      - { speaker: Bouquiniste, es: "Un peu… mais on peut parler français, non ?", en: "A little... but we can speak French, can't we?" }
      - { speaker: Claire, es: "D'accord ! Je suis perdue. Pour aller à Notre-Dame, s'il vous plaît ?", en: "OK! I'm lost. How do I get to Notre-Dame, please?" }
      - { speaker: Bouquiniste, es: "Continuez tout droit sur le quai, puis traversez le deuxième pont.", en: "Carry on straight along the quay, then cross the second bridge." }
      - { speaker: Claire, es: "C'est loin ?", en: "Is it far?" }
      - { speaker: Bouquiniste, es: "Non, à huit cents mètres. Dix minutes à pied.", en: "No, eight hundred metres. Ten minutes on foot." }
      - { speaker: Claire, es: "Et après, je prends le métro pour aller à Montmartre ?", en: "And afterwards, do I take the metro to go to Montmartre?" }
      - { speaker: Bouquiniste, es: "Oui, la ligne 4. Vous changez à Barbès et vous prenez la ligne 2.", en: "Yes, line 4. You change at Barbès and take line 2." }
      - { speaker: Claire, es: "Merci beaucoup ! Vous vendez des cartes postales ?", en: "Thank you very much! Do you sell postcards?" }
      - { speaker: Bouquiniste, es: "Bien sûr ! Et de vieux livres sur Paris, pour apprendre le français.", en: "Of course! And old books about Paris, to learn French." }
    questions:
      - { q: "Où veut aller Claire ?", options: ["À la tour Eiffel.", "À Notre-Dame.", "Au Louvre."], answer: 1, explain: "« Pour aller à Notre-Dame, s'il vous plaît ? »" }
      - { q: "C'est à combien de minutes à pied ?", options: ["Deux minutes.", "Dix minutes.", "Une heure."], answer: 1, explain: "« Dix minutes à pied. »" }
      - { q: "Quel pont est-ce qu'elle doit traverser ?", options: ["Le premier pont.", "Le deuxième pont.", "Le troisième pont."], answer: 1, explain: "« Traversez le deuxième pont. »" }
      - { q: "Qu'est-ce que le bouquiniste vend ?", options: ["Des billets de métro.", "Des cartes postales et des livres.", "Des vêtements."], answer: 1, explain: "He sells postcards and « de vieux livres sur Paris »." }
