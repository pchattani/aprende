id: r.b2.el-ultimo-relojero
level: b2
title: El último relojero
kind: text
intro: A short story about an old watchmaker whose trade is slowly disappearing, told with the verbal periphrases of unit 8.
allow: [antonio, dani, cuenca]
paragraphs:
  - { es: "Don Antonio lleva cincuenta y dos años arreglando relojes en la misma tienda de la calle Mayor. Empezó como aprendiz a los catorce, cuando el oficio todavía daba para vivir, y acabó quedándose con el negocio cuando su maestro se jubiló. Hoy tiene setenta y cuatro años y sigue abriendo cada mañana a las nueve en punto.", en: "Don Antonio has been repairing watches in the same shop on the Calle Mayor for fifty-two years. He started as an apprentice at fourteen, when the trade still made a living, and ended up keeping the business when his master retired. Today he is seventy-four and still opens every morning at nine o'clock sharp." }
  - { es: "Los clientes, sin embargo, van desapareciendo. Antes la gente arreglaba sus relojes; ahora los tira y se compra otro. Antonio viene observando el cambio desde hace veinte años. «Al principio venían diez personas al día. Luego cinco. Ahora hay semanas en que no entra nadie», cuenta sin amargura.", en: "The customers, however, are gradually disappearing. People used to repair their watches; now they throw them away and buy another. Antonio has been observing the change for twenty years. 'At first ten people a day came in. Then five. Now there are weeks when nobody comes in', he says without bitterness." }
  - { es: "Sus hijos llevan años diciéndole que cierre. «Papá, has de descansar; te lo tienes merecido», le repite su hija cada domingo. Él siempre responde lo mismo: que lo dará por terminado cuando no quede ningún reloj por arreglar en el cajón. Y en el cajón siempre queda alguno.", en: "His children have been telling him for years to close. 'Dad, you must rest; you've earned it', his daughter repeats every Sunday. He always answers the same thing: that he will consider it finished when there isn't a single watch left to repair in the drawer. And there is always one left in the drawer." }
  - { es: "El año pasado ocurrió algo que nadie esperaba. Su nieto Dani, de diecinueve años, suspendió el primer curso de la universidad y se quedó sin saber qué hacer. Para no pasarse el verano en casa, empezó a ir a la tienda por las mañanas. Al principio solo barría y atendía el teléfono; poco a poco fue aprendiendo a abrir un reloj sin romperlo.", en: "Last year something happened that nobody expected. His grandson Dani, nineteen, failed the first year of university and was left not knowing what to do. So as not to spend the summer at home, he started going to the shop in the mornings. At first he only swept and answered the phone; little by little he learned to open a watch without breaking it." }
  - { es: "«Tiene manos de relojero», dice Antonio, y se le nota el orgullo. Dani lleva ya quince relojes arreglados él solo. Sigue cometiendo errores, claro, pero cada vez menos. Lo que más le cuesta es la paciencia: un reloj antiguo viene a necesitar entre cuatro y seis horas de trabajo, y los jóvenes están acostumbrados a que todo sea rápido.", en: "'He has a watchmaker's hands', says Antonio, and the pride shows. Dani has already repaired fifteen watches on his own. He still makes mistakes, of course, but fewer and fewer. What he finds hardest is patience: an old watch needs between four and six hours of work, and young people are used to everything being quick." }
  - { es: "Dani no sabe si llegará a ser relojero. Está por volver a la universidad, pero también está por quedarse. «Lo bueno de este trabajo es que, cuando terminas, algo que estaba muerto vuelve a funcionar», explica. Su abuelo lo escucha en silencio y asiente.", en: "Dani doesn't know if he will end up becoming a watchmaker. He is about to go back to university, but he is also inclined to stay. 'The good thing about this job is that, when you finish, something that was dead works again', he explains. His grandfather listens in silence and nods." }
  - { es: "Antonio tiene preparada una sorpresa. En el cajón del fondo guarda las herramientas de su propio maestro, envueltas en un paño desde 1971. Se las dará a Dani el día que decida quedarse, si es que lo decide. Mientras tanto, los dos siguen abriendo la tienda a las nueve, uno al lado del otro, y la calle Mayor va cambiando a su alrededor.", en: "Antonio has a surprise ready. In the bottom drawer he keeps his own master's tools, wrapped in a cloth since 1971. He will give them to Dani the day he decides to stay, if he does decide. Meanwhile, the two keep opening the shop at nine, side by side, and the Calle Mayor goes on changing around them." }
questions:
  - { q: "How did Antonio come to own the shop?", options: ["He inherited it from his father", "He started as an apprentice and kept the business when his master retired", "He bought it after university"], answer: 1 }
  - { q: "When does Antonio say he will stop working?", options: ["When he turns seventy-five", "When his children ask him to", "When there is no watch left to repair in the drawer"], answer: 2 }
  - { q: "Why did Dani start going to the shop?", options: ["He failed his first year at university and had nothing to do", "His grandfather was ill", "He wanted to sell the shop"], answer: 0 }
  - { q: "What does Antonio keep in the bottom drawer?", options: ["Money for Dani's studies", "His master's tools, to give Dani if he stays", "His first watch"], answer: 1 }
glossary:
  - { es: relojero, en: watchmaker }
  - { es: dar para vivir, en: to be enough to live on }
  - { es: en punto, en: sharp, on the dot }
  - { es: amargura, en: bitterness }
  - { es: tenerlo merecido, en: to deserve it }
  - { es: cajón, en: drawer }
  - { es: barrer, en: to sweep }
  - { es: asentir, en: to nod }
  - { es: envuelto, en: wrapped }
  - { es: paño, en: cloth }
