id: r.a1.ciao-sono-emma
level: a1
title: Ciao, sono Emma!
kind: text
intro: Emma, an American student, has just landed at Fiumicino and introduces herself, her teacher and her Roman host family.
allow: [emma, boston, paola, rossi, luca, yuki]
paragraphs:
  - { es: "Ciao! Mi chiamo Emma e sono americana, di Boston. Ho ventidue anni e sono studentessa. Oggi sono a Roma: sono all'aeroporto di Fiumicino e sono molto contenta!", en: "Hi! My name is Emma and I'm American, from Boston. I'm twenty-two and I'm a student. Today I'm in Rome: I'm at Fiumicino airport and I'm very happy!" }
  - { es: "Sono a Roma per studiare l'italiano. L'italiano è una lingua bellissima, ma non è facile. Parlo inglese e un po' di spagnolo. La mia insegnante di italiano si chiama Paola. È romana, è giovane ed è molto simpatica.", en: "I'm in Rome to study Italian. Italian is a beautiful language, but it isn't easy. I speak English and a bit of Spanish. My Italian teacher is called Paola. She's from Rome, she's young and she's very nice." }
  - { es: "A Roma abito con una famiglia italiana, in un appartamento a Trastevere. Il signor Rossi è medico e la signora Rossi è giornalista. Sono molto gentili. Hanno un figlio, Luca. Luca ha diciannove anni, è alto, moro e un po' timido. La famiglia ha anche un cane piccolo e vecchio: si chiama Bruno.", en: "In Rome I live with an Italian family, in a flat in Trastevere. Mr Rossi is a doctor and Mrs Rossi is a journalist. They are very kind. They have a son, Luca. Luca is nineteen, tall, dark-haired and a bit shy. The family also has a small, old dog: he's called Bruno." }
  - { es: "In casa c'è anche un'altra ragazza straniera. Si chiama Yuki, ha venticinque anni ed è giapponese. Yuki studia musica all'università. È allegra e molto intelligente. Noi due parliamo sempre in italiano, perché lei non parla bene l'inglese e io non parlo giapponese!", en: "There's also another foreign girl in the house. Her name is Yuki, she's twenty-five and she's Japanese. Yuki studies music at the university. She's cheerful and very intelligent. The two of us always speak Italian, because she doesn't speak English well and I don't speak Japanese!" }
  - { es: "Domani comincia la scuola. La prima lezione è alle nove. Sono un po' nervosa, ma sono anche felice. Roma è grande, antica e bellissima, e io sono qui! Ciao, a presto!", en: "Tomorrow school starts. The first lesson is at nine. I'm a bit nervous, but I'm happy too. Rome is big, ancient and beautiful, and I'm here! Bye, see you soon!" }
questions:
  - { q: "Di dove è Emma?", options: ["Di Roma", "Di Boston", "Del Giappone"], answer: 1, explain: "Emma says «sono americana, di Boston»." }
  - { q: "Perché Emma è a Roma?", options: ["Per lavorare", "Per studiare l'italiano", "Per visitare la famiglia"], answer: 1, explain: "«Sono a Roma per studiare l'italiano.»" }
  - { q: "Chi è Luca?", options: ["Il figlio dei signori Rossi", "L'insegnante di Emma", "Il cane della famiglia"], answer: 0, explain: "The Rossis «hanno un figlio, Luca». The dog is Bruno and the teacher is Paola." }
  - { q: "Che cosa studia Yuki?", options: ["Italiano", "Medicina", "Musica"], answer: 2, explain: "«Yuki studia musica all'università.»" }
  - { q: "Perché Emma e Yuki parlano in italiano?", options: ["Perché sono italiane", "Perché Yuki non parla bene l'inglese", "Perché la scuola è domani"], answer: 1, explain: "Yuki doesn't speak English well and Emma doesn't speak Japanese, so Italian is their shared language." }
glossary:
  - { es: antica, en: ancient }
