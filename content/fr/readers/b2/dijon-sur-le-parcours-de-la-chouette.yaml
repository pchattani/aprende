id: r.b2.dijon-sur-le-parcours-de-la-chouette
level: b2
title: Dijon, sur le parcours de la chouette
kind: text
intro: A travel article that follows the «owl trail» through Dijon, former capital of the dukes of Burgundy. Notice the present participles and participial clauses (arrivant à Dijon, construit et agrandi, ayant fini…).
allow: [félix, kir, philippe, hardi, téméraire, jean, peur, ok, centre]
paragraphs:
  - { es: "Arrivant à Dijon pour la première fois, la plupart des visiteurs pensent à la moutarde. Ils ont raison, mais seulement en partie. Car Dijon fut, pendant plus d'un siècle, la capitale d'un des États les plus puissants d'Europe : le duché de Bourgogne. Pour le découvrir, rien de plus simple : il suffit de baisser les yeux et de suivre les petites plaques triangulaires, ornées d'une chouette, incrustées dans le trottoir. C'est le parcours de la chouette, un circuit d'une vingtaine d'étapes à travers le centre historique.", en: "Arriving in Dijon for the first time, most visitors think of mustard. They're right, but only partly. For Dijon was, for more than a century, the capital of one of the most powerful states in Europe: the Duchy of Burgundy. To discover it, nothing could be simpler: you just have to look down and follow the little triangular plaques, decorated with an owl, set into the pavement. This is the owl trail, a circuit of about twenty stops through the historic centre." }
  - { es: "Le parcours commence au palais des ducs. Construit et agrandi entre le quatorzième et le quinzième siècle, il abrite aujourd'hui la mairie et le musée des Beaux-Arts. De 1363 à 1477, quatre ducs s'y sont succédé, portant des surnoms inoubliables : Philippe le Hardi, Jean sans Peur, Philippe le Bon et Charles le Téméraire. Régnant sur un territoire allant de la Bourgogne jusqu'aux Pays-Bas actuels, ils étaient parfois plus riches que le roi de France lui-même. Au musée, on peut voir les tombeaux de Philippe le Hardi et de Jean sans Peur, entourés de petites statues de moines en pleurs.", en: "The trail begins at the palace of the dukes. Built and enlarged between the fourteenth and fifteenth centuries, it now houses the town hall and the Musée des Beaux-Arts. From 1363 to 1477 four dukes succeeded one another there, bearing unforgettable nicknames: Philip the Bold, John the Fearless, Philip the Good and Charles the Rash. Ruling over a territory stretching from Burgundy to what is now the Netherlands, they were sometimes richer than the King of France himself. In the museum you can see the tombs of Philip the Bold and John the Fearless, surrounded by little statues of weeping monks." }
  - { es: "Les plus courageux monteront ensuite les trois cent seize marches de la tour Philippe le Bon. Arrivé au sommet, à quarante-six mètres de hauteur, on découvre les toits de la ville, dont certains sont couverts de tuiles vernissées aux couleurs vives, typiques de la Bourgogne.", en: "The bravest will then climb the three hundred and sixteen steps of the Philippe le Bon tower. Having reached the top, forty-six metres up, you discover the roofs of the city, some of which are covered in brightly coloured glazed tiles, typical of Burgundy." }
  - { es: "Quelques rues plus loin, on arrive à l'étape la plus célèbre : l'église Notre-Dame. Sur un de ses murs extérieurs, dans une petite rue, se trouve une chouette sculptée dans la pierre. La tradition veut qu'on la caresse de la main gauche en faisant un vœu. Caressée par des millions de mains depuis des siècles, elle a presque perdu sa forme. En 2001, ayant été gravement abîmée par un vandale, elle a dû être restaurée, ce qui a provoqué une vive émotion chez les Dijonnais. Sachant cela, la plupart des visiteurs la touchent avec beaucoup de délicatesse.", en: "A few streets further on, you reach the most famous stop: the church of Notre-Dame. On one of its outside walls, in a little street, is an owl carved in the stone. Tradition has it that you stroke it with your left hand while making a wish. Stroked by millions of hands over the centuries, it has almost lost its shape. In 2001, having been badly damaged by a vandal, it had to be restored, which caused great distress among the people of Dijon. Knowing this, most visitors touch it very gently." }
  - { es: "Après tant d'histoire, il est temps de goûter la ville. La moutarde, d'abord. Contrairement à ce que l'on pourrait croire, la « moutarde de Dijon » est une recette, et non une appellation d'origine : la plupart des graines utilisées viennent du Canada, même si des agriculteurs bourguignons en cultivent de nouveau. Il y a aussi le pain d'épices, fabriqué ici depuis des siècles, et le cassis, avec lequel on prépare le kir. Ce cocktail de vin blanc et de crème de cassis porte le nom du chanoine Félix Kir, ancien maire de la ville, qui le servait à tous ses invités officiels.", en: "After so much history, it's time to taste the city. Mustard first. Contrary to what you might think, 'Dijon mustard' is a recipe, not a designation of origin: most of the seeds used come from Canada, although Burgundian farmers are growing them again. There's also gingerbread, made here for centuries, and blackcurrant, with which kir is made. This cocktail of white wine and crème de cassis is named after Canon Félix Kir, a former mayor of the city, who served it to all his official guests." }
  - { es: "Ayant fini le parcours, on comprend mieux pourquoi les Dijonnais sont si fiers de leur ville. Et en repartant, on ne peut s'empêcher de passer une dernière fois devant la chouette, la main gauche tendue. Au cas où.", en: "Having finished the trail, you understand better why the people of Dijon are so proud of their city. And on the way out, you can't resist passing by the owl one last time, left hand outstretched. Just in case." }
questions:
  - { q: "Comment suit-on le parcours de la chouette ?", options: ["Avec un guide obligatoire", "En suivant des plaques triangulaires dans le trottoir", "En prenant un petit train"], answer: 1, explain: "«Suivre les petites plaques triangulaires, ornées d'une chouette, incrustées dans le trottoir.»" }
  - { q: "Qu'abrite aujourd'hui le palais des ducs ?", options: ["Un hôtel de luxe", "La mairie et le musée des Beaux-Arts", "Une université"], answer: 1, explain: "«Il abrite aujourd'hui la mairie et le musée des Beaux-Arts.»" }
  - { q: "Que faut-il faire, selon la tradition, devant la chouette ?", options: ["La caresser de la main gauche en faisant un vœu", "La prendre en photo", "Lui laisser une pièce"], answer: 0, explain: "«La tradition veut qu'on la caresse de la main gauche en faisant un vœu.»" }
  - { q: "Qu'est-ce que la « moutarde de Dijon » selon l'article ?", options: ["Une appellation d'origine protégée", "Une recette", "Une moutarde fabriquée uniquement avec des graines de Bourgogne"], answer: 1, explain: "«La moutarde de Dijon est une recette, et non une appellation d'origine» – most seeds come from Canada." }
  - { q: "D'où vient le nom du kir ?", options: ["D'un duc de Bourgogne", "Du chanoine Félix Kir, ancien maire de Dijon", "D'un village de la région"], answer: 1, explain: "It's named after «le chanoine Félix Kir, ancien maire de la ville»." }
  - { q: "« Ayant fini le parcours, on comprend mieux… » Que signifie « ayant fini » ?", options: ["En train de finir", "Après avoir fini", "Avant de finir"], answer: 1, explain: "The past participle clause (ayant + participle) shows an action completed before the main one: après avoir fini." }
