id: r.a2.learning-cantonese
level: a2
title: 我識講少少廣東話
kind: text
intro: In a post for her blog, Ana writes about learning Cantonese in Hong Kong - the six tones, the rules she has learned and the mistakes that made her friends laugh.
paragraphs:
  - { es: "我嚟咗香港三個月，而家識講少少廣東話。我喺西班牙已經識講英文同法文，所以我以為學廣東話唔會太難。點知廣東話真係好難㗎！", en: "I've been in Hong Kong for three months, and now I can speak a little Cantonese. In Spain I already spoke English and French, so I thought learning Cantonese wouldn't be too hard. But it turns out Cantonese is really hard!" }
  - { es: "最難係聲調。廣東話有六個聲調，同一個音，聲調唔同，意思就唔同。例如「買」同「賣」，聽落好似一樣，但係一個係 maai5，一個係 maai6，意思啱啱相反！我第一次去街市，我想買魚，但係我講咗「我想賣魚」，老闆笑到停唔到。", en: "The hardest thing is the tones. Cantonese has six tones: the same sound with a different tone has a different meaning. For example, 買 and 賣 sound almost the same, but one is maai5 and the other is maai6, and their meanings are exact opposites! The first time I went to the market I wanted to buy fish, but I said \"I want to sell fish\", and the stallholder couldn't stop laughing." }
  - { es: "我而家每個禮拜上三堂廣東話堂。我老師好有耐性，佢教我用粵拼寫低每個生字嘅讀音。佢話：「你一定要日日練習，唔可以怕醜。講錯唔緊要，最緊要係講！」", en: "Now I have three Cantonese lessons a week. My teacher is very patient; she taught me to write down the pronunciation of every new word in Jyutping. She says: \"You must practise every day, and you mustn't be shy. Making mistakes doesn't matter; what matters is speaking!\"" }
  - { es: "所以我日日都練習。我喺茶餐廳用廣東話叫嘢食，喺的士度同司機傾偈，喺屋企睇電視劇。我仲識唱一首廣東歌！而家我聽得明伙記講乜嘢，不過佢哋講得太快，我有時都要問：「唔該，可唔可以講慢啲呀？」", en: "So I practise every day. I order food in Cantonese at cha chaan tengs, chat with drivers in taxis and watch TV dramas at home. I can even sing a Cantopop song! Now I can understand what the waiters say, but when they talk too fast I sometimes still have to ask: \"Excuse me, could you speak a bit more slowly?\"" }
  - { es: "我啲香港朋友好好人。Mandy成日讚我講得好，但係我知佢講笑。Kelvin就成日教我講啲奇怪嘅嘢，例如「冇問題」同「搞掂」。上個禮拜我同老師講「搞掂」，佢好驚訝，問我邊個教我㗎！", en: "My Hong Kong friends are lovely. Mandy is always praising my Cantonese, but I know she's joking. Kelvin, on the other hand, keeps teaching me odd expressions like 冇問題 \"no problem\" and 搞掂 \"sorted\". Last week I said 搞掂 to my teacher, and she was so surprised she asked me who had taught me!" }
  - { es: "我知道我嘅廣東話仲未夠好，但係我會繼續努力。我希望一年之後，我可以同香港人講廣東話講得好流利。如果你都想學廣東話，記住：唔好怕講錯，加油！", en: "I know my Cantonese isn't good enough yet, but I'll keep working at it. I hope that a year from now I'll be able to speak Cantonese fluently with Hongkongers. If you want to learn Cantonese too, remember: don't be afraid of making mistakes. Go for it!" }
questions:
  - { q: "Ana話廣東話乜嘢最難？", options: ["寫字", "聲調", "生字"], answer: 1, explain: "最難係聲調: the six tones." }
  - { q: "Ana喺街市講錯咗乜嘢？", options: ["佢話想賣魚", "佢話想買菜", "佢話唔鍾意魚"], answer: 0, explain: "She wanted to buy fish (買 maai5) but said 我想賣魚 (賣 maai6, sell)." }
  - { q: "Ana一個禮拜上幾多堂廣東話？", options: ["一堂", "兩堂", "三堂"], answer: 2, explain: "我而家每個禮拜上三堂廣東話堂." }
  - { q: "老師話乜嘢最緊要？", options: ["寫字寫得靚", "講", "唔好講錯"], answer: 1, explain: "講錯唔緊要，最緊要係講！" }
  - { q: "邊個教Ana講「搞掂」？", options: ["Mandy", "Kelvin", "老師"], answer: 1, explain: "Kelvin就成日教我講啲奇怪嘅嘢, including 搞掂." }
glossary:
  - { es: 點知, en: "but it turned out, who knew" }
  - { es: 相反, en: opposite }
  - { es: 驚訝, en: surprised }
  - { es: 例如, en: for example }
  - { es: 寫低, en: to write down }
