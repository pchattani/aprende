      - { es: "我好忙，但係你約我，我就得閒。", en: "I'm very busy, but if you ask me out, I'm free.", altEs: ["我好忙，不過你約我，我就得閒。"], grammar: [g.adjective-predicates], vocab: [w.mong4, w.dak1-haan4] }
