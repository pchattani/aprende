id: r.c2.poderoso-caballero
level: c2
title: Poderoso caballero es don Dinero
kind: literature
author: Francisco de Quevedo (1580–1645)
source: "Letrilla satírica «Poderoso caballero es don Dinero», publicada en Flores de poetas ilustres (1605); texto citado con la ortografía modernizada."
intro: "Quevedo's most famous satirical letrilla is a festival of wordplay: coins (doblón, escudo, cuarto, blanca) double as nobility, love-sickness and even cats. The text is quoted with modernised spelling; each stanza is one paragraph and the refrain closes every one."
allow: [indias, génova, españa, oriente, castilla, blanca, dinero, humillo, amarillo, doblón, enterrado, acompaña, fiero, galán, quebrado, moro, decoro, quebranta, fuero, descendiente, venas, reales, iguales, duque, ganadero, maravilla, gloria, tasa, silla, cobarde, guerrero, escudos, armas, dobles, robles, codicia, minero, importar, tratos, consejos, viejos, recatos, ablanda, severo, majestad, duelos, hartos, cuartos, autoridad, calidad, pordiosero, damas, ingratas, afición, caras, baratas, bravatas, bolsa, cuero, sagaz, rodelas, entierra, forastero, pues, cuanto, continuo, amante, amado, honrado, propio]
paragraphs:
  - { es: "Madre, yo al oro me humillo; / él es mi amante y mi amado, / pues, de puro enamorado, / de continuo anda amarillo; / que pues, doblón o sencillo, / hace todo cuanto quiero, / poderoso caballero / es don Dinero.", en: "Mother, I bow down to gold; he is my lover and my beloved, for, out of sheer love-sickness, he is forever pale and yellow; and since, as a doubloon or a small coin, he does everything I want, a powerful gentleman is Sir Money." }
  - { es: "Nace en las Indias honrado, / donde el mundo le acompaña; / viene a morir en España, / y es en Génova enterrado. / Y pues quien le trae al lado / es hermoso, aunque sea fiero, / poderoso caballero / es don Dinero.", en: "He is born honoured in the Indies, where the whole world keeps him company; he comes to die in Spain and is buried in Genoa. And since whoever carries him at his side is handsome, however ugly he may be, a powerful gentleman is Sir Money." }
  - { es: "Es galán y es como un oro, / tiene quebrado el color, / persona de gran valor, / tan cristiano como moro. / Pues que da y quita el decoro / y quebranta cualquier fuero, / poderoso caballero / es don Dinero.", en: "He is gallant and as good as gold, his colour is broken and pale, a person of great worth, as Christian as he is Moorish. Since he gives and takes away respectability and breaks any law, a powerful gentleman is Sir Money." }
  - { es: "Son sus padres principales, / y es de nobles descendiente, / porque en las venas de Oriente / todas las sangres son reales; / y pues es quien hace iguales / al duque y al ganadero, / poderoso caballero / es don Dinero.", en: "His parents are of the first rank, and he descends from nobles, because in the veins of the East all bloods are royal (and all coins are reales); and since he is the one who makes the duke and the cattle-farmer equal, a powerful gentleman is Sir Money." }
  - { es: "Mas ¿a quién no maravilla / ver en su gloria sin tasa / que es lo menos de su casa / doña Blanca de Castilla? / Pero, pues da al bajo silla / y al cobarde hace guerrero, / poderoso caballero / es don Dinero.", en: "But whom does it not astonish to see, in his boundless glory, that the least of his household is Lady Blanca of Castile (the blanca, the smallest coin)? Yet, since he gives the lowly a seat and makes the coward a warrior, a powerful gentleman is Sir Money." }
  - { es: "Sus escudos de armas nobles / son siempre tan principales, / que sin sus escudos reales / no hay escudos de armas dobles; / y pues a los mismos robles / da codicia su minero, / poderoso caballero / es don Dinero.", en: "His noble coats of arms are always so distinguished that without his royal escudos (coins) there are no double coats of arms; and since his mine makes even the oak trees greedy, a powerful gentleman is Sir Money." }
  - { es: "Por importar en los tratos / y dar tan buenos consejos, / en las casas de los viejos / gatos le guardan de gatos. / Y pues él rompe recatos / y ablanda al juez más severo, / poderoso caballero / es don Dinero.", en: "Because he matters in every deal and gives such good advice, in the houses of the old, money-bags (gatos) guard him from thieves (also gatos). And since he breaks down modesty and softens the sternest judge, a powerful gentleman is Sir Money." }
  - { es: "Y es tanta su majestad / (aunque son sus duelos hartos), / que con haberle hecho cuartos, / no pierde su autoridad; / pero, pues da calidad / al noble y al pordiosero, / poderoso caballero / es don Dinero.", en: "And so great is his majesty (though his sorrows are many) that even after being cut into quarters (cuartos, small coins) he loses none of his authority; but, since he gives standing to the nobleman and to the beggar, a powerful gentleman is Sir Money." }
  - { es: "Nunca vi damas ingratas / a su gusto y afición; / que a las caras de un doblón / hacen sus caras baratas; / y pues las hace bravatas / desde una bolsa de cuero, / poderoso caballero / es don Dinero.", en: "I never saw ladies ungrateful to his taste and liking; for to the faces on a doubloon they make their own faces cheap; and since he makes them bold from inside a leather purse, a powerful gentleman is Sir Money." }
  - { es: "Más valen en cualquier tierra / (mirad si es harto sagaz) / sus escudos en la paz / que rodelas en la guerra. / Y pues al pobre le entierra / y hace propio al forastero, / poderoso caballero / es don Dinero.", en: "In any land his escudos (coins and shields) are worth more in peace (see how exceedingly shrewd he is) than round shields in war. And since he buries the poor man and makes the stranger a native, a powerful gentleman is Sir Money." }
questions:
  - { q: "Why is Sir Money 'always yellow' in the first stanza?", options: ["Because gold is yellow and lovers were said to turn pale", "Because he is ill", "Because he is Chinese"], answer: 0 }
  - { q: "What is the joke behind 'es en Génova enterrado'?", options: ["Quevedo loved Italy", "Spanish silver from the Indies ended up with Genoese bankers", "Genoa had the best cemeteries"], answer: 1 }
  - { q: "Which double meaning does 'escudos' carry?", options: ["Coins and coats of arms / shields", "Schools and students", "Horses and knights"], answer: 0 }
  - { q: "What does 'gatos le guardan de gatos' play on?", options: ["Cats hunting mice", "gato as money-bag and gato as thief", "A proverb about dogs"], answer: 1 }
  - { q: "What is the overall message of the letrilla?", options: ["Money is a blessing from God", "Money levels all ranks and corrupts honour, justice and love", "Spain should mint more coins"], answer: 1 }
