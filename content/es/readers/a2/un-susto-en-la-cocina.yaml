id: r.a2.un-susto-en-la-cocina
level: a2
title: Un susto en la cocina
kind: text
intro: "A short story: an ordinary Sunday that nearly ended badly."
allow: [rubén, marta]
paragraphs:
  - { es: "Era domingo por la mañana y llovía. Marta estaba preparando el desayuno mientras Rubén, su marido, leía el periódico en el salón. Los niños todavía dormían.", en: "It was Sunday morning and it was raining. Marta was making breakfast while Rubén, her husband, was reading the newspaper in the living room. The children were still asleep." }
  - { es: "Marta puso aceite en la sartén y encendió el fuego. En ese momento sonó el teléfono. Era su madre, que quería hablar de la comida de Navidad. Marta salió de la cocina y se sentó en la escalera para hablar tranquilamente.", en: "Marta put oil in the frying pan and lit the stove. At that moment the phone rang. It was her mother, who wanted to talk about the Christmas meal. Marta left the kitchen and sat on the stairs to talk in peace." }
  - { es: "Diez minutos después, Rubén notó un olor extraño. Se levantó, abrió la puerta de la cocina y vio humo por todas partes. ¡La sartén estaba en llamas!", en: "Ten minutes later, Rubén noticed a strange smell. He got up, opened the kitchen door and saw smoke everywhere. The frying pan was on fire!" }
  - { es: "Rubén no gritó. Apagó el fuego, cogió una tapa grande y la puso encima de la sartén. El fuego desapareció enseguida. Después abrió todas las ventanas.", en: "Rubén didn't shout. He turned off the stove, grabbed a big lid and put it on top of the pan. The fire went out immediately. Then he opened all the windows." }
  - { es: "Cuando Marta volvió a la cocina, se asustó mucho. «¡Lo siento! Me olvidé completamente del aceite», dijo. Rubén se rio: «Menos mal que no estaba durmiendo yo también».", en: "When Marta came back to the kitchen, she got a terrible fright. 'I'm sorry! I completely forgot about the oil,' she said. Rubén laughed: 'Thank goodness I wasn't asleep too.'" }
  - { es: "Al final desayunaron tostadas frías en el salón, con las ventanas abiertas y los abrigos puestos. Los niños se despertaron y preguntaron por qué la casa olía a humo. Nadie resultó herido, pero Marta nunca ha vuelto a dejar una sartén sola.", en: "In the end they had cold toast in the living room, with the windows open and their coats on. The children woke up and asked why the house smelt of smoke. Nobody was hurt, but Marta has never again left a frying pan unattended." }
questions:
  - { q: "What was Marta doing when the phone rang?", options: ["Reading the newspaper", "Making breakfast", "Sleeping"], answer: 1 }
  - { q: "How did Rubén put out the fire?", options: ["With water", "With a big lid", "He called the fire brigade"], answer: 1 }
  - { q: "Where did they eat breakfast in the end?", options: ["In the kitchen", "In the living room", "In a café"], answer: 1 }
glossary:
  - { es: olor, en: smell }
  - { es: en llamas, en: on fire }
  - { es: tapa, en: lid }
  - { es: oler a, en: to smell of }
  - { es: tostada, en: toast }
