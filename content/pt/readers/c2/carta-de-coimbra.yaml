id: r.c2.carta-de-coimbra
level: c2
title: "Carta de Coimbra"
kind: text
intro: "A Brazilian student doing a semester in Coimbra writes to a friend in Belo Horizonte about everything that is the same language and not the same language: vocabulary, clitic placement, forms of address, mesoclisis in official letters and the bats of the Joanina Library. The letter is in Brazilian Portuguese and quotes European Portuguese, so you can compare the two side by side."
allow: [coimbra, belo, horizonte, minas, gabi, júlia, joanina, mondego, queima, fitas, lisboa, porto, portugal, brasil, tiago, dona, fernanda, sé, velha, quebra-costas, eça, pessoa, camões, cristina]
paragraphs:
  - { es: "Coimbra, 14 de novembro. Querida Gabi, prometi escrever assim que me instalasse e já se passaram dois meses, então me perdoa. A desculpa é boa: estou ocupada demais aprendendo a língua que eu achava que já falava. Antes de vir, todo mundo me dizia que em Portugal eu ia entender tudo. Pois na primeira semana eu não entendi nem o motorista do ônibus, que aqui se chama autocarro, nem a moça da padaria, que me perguntou se eu queria “um galão e uma torrada” como se fosse a coisa mais óbvia do mundo.", en: "Coimbra, 14 November. Dear Gabi, I promised to write as soon as I'd settled in and two months have already gone by, so forgive me. The excuse is a good one: I'm too busy learning the language I thought I already spoke. Before I came, everyone told me I'd understand everything in Portugal. Well, in the first week I didn't understand the bus driver — the bus here is an autocarro — or the girl at the bakery, who asked me if I wanted 'um galão e uma torrada' as if it were the most obvious thing in the world." }
  - { es: "O problema não é o vocabulário, que a gente aprende rápido: o trem é comboio, o celular é telemóvel, o café da manhã é pequeno-almoço, a fila é bicha (não ri!) e o banheiro é casa de banho. O problema é o ritmo. Os portugueses engolem as vogais que não são tônicas, de modo que “telefone” vira algo como “tlfón” e “pequeno” vira “pqueno”. Minha colega de casa, a Júlia, que é de Lisboa, diz que somos nós que falamos devagar, “a cantar”. Acho que as duas temos razão.", en: "The problem isn't the vocabulary, which you pick up fast: the train is comboio, the cell phone is telemóvel, breakfast is pequeno-almoço, a queue is bicha (don't laugh!) and the bathroom is casa de banho. The problem is the rhythm. The Portuguese swallow unstressed vowels, so that telefone becomes something like 'tlfón' and pequeno becomes 'pqueno'. My housemate, Júlia, who is from Lisbon, says it's us who speak slowly, 'singing'. I think we're both right." }
  - { es: "Depois vem a gramática, que é a mesma e não é. Aqui ninguém diz “me dá um café”; diz “dá-me um café”, com o pronome depois do verbo. Mas se a frase tiver um “não”, um “que” ou um “já”, o pronome volta para a frente: “não me dês isso”, “já te disse”. Passei uma semana inteira ouvindo e anotando, como uma cientista, até perceber a regra. Também aprendi que, para ser simpática com alguém da minha idade, devo usar tu com o verbo certo: “tu és”, “tu foste”, “tu fizeste”. No Brasil, quem usa tu costuma dizer “tu foi”, e aqui isso soa quase como um erro.", en: "Then comes the grammar, which is the same and isn't. Here nobody says 'me dá um café'; they say 'dá-me um café', with the pronoun after the verb. But if the sentence has a não, a que or a já, the pronoun moves back to the front: 'não me dês isso', 'já te disse'. I spent a whole week listening and taking notes, like a scientist, until I understood the rule. I also learned that, to be friendly with someone my age, I should use tu with the right verb: tu és, tu foste, tu fizeste. In Brazil, people who use tu tend to say 'tu foi', and here that sounds almost like a mistake." }
  - { es: "E o “você”, Gabi! No Brasil é a coisa mais normal do mundo, mas aqui pode soar frio ou até mal-educado, dependendo de quem ouve. Com os professores e com a senhora da secretaria, o certo é “a senhora” ou “a professora”, ou então usar o nome: “A dona Fernanda já viu o meu requerimento?” Ontem recebi uma carta da universidade que dizia: “A documentação ser-lhe-á enviada por correio eletrónico.” Li três vezes antes de perceber que “ser-lhe-á” é só “vai ser enviada a você”. A Júlia riu tanto que quase caiu da cadeira e disse que nem os portugueses falam assim; só escrevem.", en: "And você, Gabi! In Brazil it's the most normal thing in the world, but here it can sound cold or even rude, depending on who hears it. With professors and the lady in the admissions office, the right thing is a senhora or a professora, or else to use the name: 'Has Dona Fernanda already seen my application?' Yesterday I got a letter from the university saying: 'A documentação ser-lhe-á enviada por correio eletrónico.' I read it three times before I realised that ser-lhe-á is just 'will be sent to you'. Júlia laughed so much she nearly fell off her chair and said not even the Portuguese talk like that; they only write it." }
  - { es: "Mas não pense que é tudo dificuldade. Coimbra é linda. A universidade fica no alto da cidade, e para chegar lá eu subo todos os dias umas ruelas medievais tão íngremes que uma delas se chama Quebra-Costas. Na Biblioteca Joanina, que é do século XVIII e toda dourada, vivem morcegos que saem à noite para comer os insetos que estragariam os livros antigos. Os funcionários cobrem as mesas com panos todas as tardes, por causa do… bom, você imagina. Achei a coisa mais portuguesa que já vi: resolver um problema moderno com uma solução de trezentos anos.", en: "But don't think it's all hardship. Coimbra is beautiful. The university is at the top of the town, and to get there I climb every day medieval alleys so steep that one of them is called Quebra-Costas (Back-Breaker). In the Joanina Library, which is eighteenth-century and all gilded, there live bats that come out at night to eat the insects that would ruin the old books. The staff cover the tables with cloths every afternoon, because of the… well, you can imagine. I thought it was the most Portuguese thing I'd ever seen: solving a modern problem with a three-hundred-year-old solution." }
  - { es: "Os estudantes daqui ainda usam a capa preta em ocasiões especiais, e em maio tem a Queima das Fitas, uma festa enorme de fim de curso. Também ouvi o fado de Coimbra, que é diferente do de Lisboa: é cantado só por homens, de capa, e as serenatas acontecem de noite, nas escadas da Sé Velha. Ninguém aplaude; quando a canção acaba, a gente tosse, como sinal de aprovação. Eu, claro, aplaudi na primeira vez. Ainda estou aprendendo.", en: "The students here still wear the black cape on special occasions, and in May there's the Queima das Fitas, a huge end-of-course festival. I've also heard Coimbra fado, which is different from Lisbon fado: it's sung only by men, in capes, and the serenades take place at night on the steps of the Old Cathedral. Nobody claps; when the song ends, people cough as a sign of approval. I, of course, clapped the first time. I'm still learning." }
  - { es: "Às vezes me dá saudade de casa, do pão de queijo, do nosso jeito de falar alto e rir de tudo. Mas descobri uma coisa que não esperava: estou ficando mais brasileira aqui do que era aí. Nunca pensei tanto na minha própria língua. Quando voltar, acho que vou ouvir o português do Brasil como se fosse a primeira vez. Escreve, tá? Ou melhor, como diria a Júlia: “Escreve-me, está bem?” Um beijo enorme da tua, ou melhor, da sua Cristina.", en: "Sometimes I get homesick, for pão de queijo, for our way of talking loudly and laughing at everything. But I've discovered something I didn't expect: I'm becoming more Brazilian here than I was there. I've never thought so much about my own language. When I go back, I think I'll hear Brazilian Portuguese as if for the first time. Write, OK? Or rather, as Júlia would say: 'Escreve-me, está bem?' A huge kiss from your Cristina." }
questions:
  - { q: "Que palavras portuguesas correspondem a “ônibus”, “trem” e “celular”?", options: ["Carro, metro e telefone", "Elétrico, comboio e móvel", "Autocarro, comboio e telemóvel", "Autocarro, bicha e galão"], answer: 2, explain: "The letter lists autocarro, comboio and telemóvel (also pequeno-almoço, bicha, casa de banho)." }
  - { q: "Segundo Cristina, qual é a maior dificuldade para entender os portugueses?", options: ["O ritmo, porque engolem as vogais átonas", "O vocabulário", "A velocidade dos professores", "A ortografia"], answer: 0, explain: "Vocabulary is learned fast; the rhythm — dropping unstressed vowels — is the real challenge." }
  - { q: "Porque é que em Portugal se diz “já te disse” e não “já disse-te”?", options: ["Porque é Brasil", "Porque palavras como já, não e que atraem o pronome para antes do verbo", "Porque é futuro", "Porque é uma pergunta"], answer: 1, explain: "Enclisis is the default in EP (dá-me), but attractors like não, que and já trigger proclisis." }
  - { q: "O que significa “A documentação ser-lhe-á enviada”?", options: ["A documentação foi perdida", "A documentação deve ser enviada por ela", "A documentação vai ser enviada à destinatária", "A documentação não será enviada"], answer: 2, explain: "Mesoclisis: ser-lhe-á = lhe será = vai ser enviada a você. Typical of formal written EP." }
  - { q: "Como o público mostra aprovação no fado de Coimbra?", options: ["Aplaudindo muito", "Tossindo", "Cantando junto", "Batendo os pés"], answer: 1, explain: "Tradition: no applause at Coimbra serenades; people cough instead — Cristina clapped the first time." }
  - { q: "Que descoberta inesperada Cristina faz no fim da carta?", options: ["Que está ficando mais brasileira em Portugal, pensando mais na própria língua", "Que prefere o português europeu", "Que quer ficar em Coimbra para sempre", "Que esqueceu o português do Brasil"], answer: 0, explain: "Living abroad made her more aware of her own variety: 'estou ficando mais brasileira aqui do que era aí'." }
glossary:
  - { es: galão, en: milky coffee in a glass (EP) }
  - { es: torrada, en: buttered toast (EP) }
  - { es: bicha, en: queue (EP; in Brazil an offensive word) }
  - { es: tônicas, en: stressed (vowels) }
  - { es: dês, en: give (negative tu imperative / subjunctive of dar) }
  - { es: secretaria, en: (admissions) office }
  - { es: ser-lhe-á, en: will be ... to you (mesoclisis) }
  - { es: eletrónico, en: electronic (EP spelling; BR eletrônico) }
  - { es: íngremes, en: steep }
  - { es: morcegos, en: bats }
  - { es: insetos, en: insects }
  - { es: panos, en: cloths }
  - { es: capa, en: cape, gown }
  - { es: serenatas, en: serenades }
  - { es: tosse, en: coughs }
