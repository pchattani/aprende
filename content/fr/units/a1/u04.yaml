dialogues:
  - id: a1.u04.d1
    title: "Un appartement dans le Marais"
    context: "Emma visits a flat for rent in the Marais with the owner, Madame Lévy."
    lines:
      - { speaker: Mme Lévy, es: "Bonjour ! Voici l'appartement. C'est au troisième étage.", en: "Hello! Here's the flat. It's on the third floor." }
      - { speaker: Emma, es: "C'est joli ! Il y a combien de pièces ?", en: "It's nice! How many rooms are there?" }
      - { speaker: Mme Lévy, es: "Il y a deux pièces : un salon et une chambre. La cuisine est petite, mais moderne.", en: "There are two rooms: a living room and a bedroom. The kitchen is small, but modern." }
      - { speaker: Emma, es: "Et la salle de bains ?", en: "And the bathroom?" }
      - { speaker: Mme Lévy, es: "Elle est à côté de la chambre. Il y a une douche.", en: "It's next to the bedroom. There's a shower." }
      - { speaker: Emma, es: "Il y a un balcon ?", en: "Is there a balcony?" }
      - { speaker: Mme Lévy, es: "Non, il n'y a pas de balcon, mais il y a une grande fenêtre sur la place.", en: "No, there's no balcony, but there's a big window onto the square." }
      - { speaker: Emma, es: "Le quartier est calme ?", en: "Is the neighbourhood quiet?" }
      - { speaker: Mme Lévy, es: "Le soir, oui. Et il y a une boulangerie en face de l'immeuble.", en: "In the evening, yes. And there's a bakery opposite the building." }
      - { speaker: Emma, es: "Parfait ! C'est près du métro ?", en: "Perfect! Is it near the metro?" }
      - { speaker: Mme Lévy, es: "Oui, la station est au coin de la rue.", en: "Yes, the station is on the corner of the street." }
    questions:
      - { q: "L'appartement est à quel étage ?", options: ["au premier étage", "au deuxième étage", "au troisième étage"], answer: 2, explain: "« C'est au troisième étage. »" }
      - { q: "Il y a combien de pièces ?", options: ["une", "deux", "trois"], answer: 1, explain: "Two rooms: a living room and a bedroom." }
      - { q: "Qu'est-ce qu'il n'y a pas dans l'appartement ?", options: ["une douche", "un balcon", "une fenêtre"], answer: 1, explain: "« Il n'y a pas de balcon. »" }
      - { q: "Où est la boulangerie ?", options: ["en face de l'immeuble", "au coin de la rue", "à côté de la chambre"], answer: 0, explain: "« Il y a une boulangerie en face de l'immeuble. »" }
