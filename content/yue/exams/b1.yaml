level: b1
title: Level check B1
passScore: 0.8
reading:
  text: |
    上個月，我哋一家人去咗西貢行山。嗰日天氣好好，我哋朝早九點坐巴士入去，打算行到海灘再坐船返嚟。我老公話條路好易行，兩個鐘就行得完，所以我哋淨係帶咗兩支水。

    點知行到一半，我個仔突然話佢隻腳好痛，行唔郁。原來佢對鞋太細，著住行咗咁耐，腳都損咗。我哋只好坐低休息，將佢對鞋除咗佢，換咗對拖鞋。跟住天氣越嚟越熱，我哋啲水好快就飲晒。我老公一路講「就快到喇」，但係我哋行咗成個鐘，都仲未見到個海灘。

    好彩有一班行山友經過，佢哋畀咗兩支水我哋，仲話我哋行錯咗路。佢哋帶我哋行返去正確嗰條路，再行半個鐘，終於見到個海灘。我個仔一見到海，就忘記晒隻腳痛，即刻跑落去玩水。

    結果我哋行咗五個鐘先坐到船返去。返到屋企，大家都攰到唔想講嘢。我老公話：「下次我一定會睇清楚地圖先出發。」我話：「下次應該由我嚟睇地圖，你負責孭水就得喇。」
  questions:
    - { q: "Why did the family only bring two bottles of water?", options: ["The husband said the walk was easy and would take two hours", "They forgot to buy more", "The shop was closed"], answer: 0 }
    - { q: "What happened to the son halfway through the walk?", options: ["He got lost", "His feet hurt because his shoes were too small", "He fell into the sea"], answer: 1 }
    - { q: "How did the group of hikers help them?", options: ["They gave them water and showed them the right path", "They called a taxi", "They carried the son"], answer: 0 }
    - { q: "How long did the walk take in the end?", options: ["Two hours", "Three hours", "Five hours"], answer: 2 }
    - { q: "What does the writer suggest for next time?", options: ["Not to go hiking again", "She will read the map and her husband will carry the water", "To take a taxi to the beach"], answer: 1 }
