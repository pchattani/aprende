id: r.c1.o-encontro-das-aguas
level: c1
title: "Reportagem: por que as águas não se misturam"
kind: text
intro: "An invented newspaper report, based on real facts, on the Meeting of the Waters near Manaus, where the dark Rio Negro and the muddy Solimões run side by side for kilometres. It is a model of journalistic Portuguese: a headline in the present tense, a lead paragraph that answers who, what, where and why, quotations introduced by segundo, afirma and explica, and reporting verbs in the conditional for unconfirmed claims."
allow: [manaus, amazonas, negro, solimões, andes, marcela, tavares, josé, ribamar, celsius, material, laboratório]
paragraphs:
  - { es: "PESQUISADORES EXPLICAM FENÔMENO QUE ATRAI MILHARES DE TURISTAS A MANAUS. Estudo mostra que diferença de temperatura, velocidade e densidade impede que os rios Negro e Solimões se misturem por vários quilômetros; especialistas alertam para efeitos da seca.", en: "RESEARCHERS EXPLAIN THE PHENOMENON THAT DRAWS THOUSANDS OF TOURISTS TO MANAUS. A study shows that differences in temperature, speed and density prevent the Negro and Solimões rivers from mixing for several kilometres; experts warn of the effects of drought." }
  - { es: "Quem passa de barco pelo Encontro das Águas, a poucos quilômetros do centro de Manaus, tem a impressão de atravessar uma fronteira desenhada no rio. De um lado, a água escura, cor de chá forte, do rio Negro; do outro, a água barrenta, cor de café com leite, do Solimões. Durante quilômetros, as duas correm lado a lado sem se misturar, até formarem, mais adiante, o rio que os brasileiros chamam de Amazonas.", en: "Anyone passing by boat through the Meeting of the Waters, a few kilometres from the centre of Manaus, has the impression of crossing a border drawn on the river. On one side, the dark water, the colour of strong tea, of the Rio Negro; on the other, the muddy water, the colour of milky coffee, of the Solimões. For kilometres the two run side by side without mixing, until further on they form the river Brazilians call the Amazonas." }
  - { es: "O fenômeno, que atrai cerca de cem mil visitantes por ano, não é exatamente um mistério, mas só agora começa a ser medido com precisão. De acordo com um estudo divulgado nesta semana por pesquisadores de uma universidade de Manaus, três fatores explicam por que as águas resistem a se misturar: a temperatura, a velocidade e a quantidade de material que cada rio transporta.", en: "The phenomenon, which attracts about a hundred thousand visitors a year, is not exactly a mystery, but only now is it beginning to be measured precisely. According to a study released this week by researchers at a university in Manaus, three factors explain why the waters resist mixing: temperature, speed and the amount of material each river carries." }
  - { es: "“O Negro é mais quente, mais lento e mais leve, porque traz pouca terra e muita matéria orgânica da floresta, que é o que lhe dá essa cor escura”, explica a geógrafa Marcela Tavares, coordenadora da pesquisa. “Já o Solimões vem dos Andes carregando uma enorme quantidade de sedimentos. É mais frio, mais rápido e mais denso. É como tentar misturar óleo e vinagre: com o tempo se mistura, mas não de uma vez.”", en: "'The Negro is warmer, slower and lighter, because it carries little earth and a lot of organic matter from the forest, which is what gives it that dark colour,' explains geographer Marcela Tavares, the coordinator of the research. 'The Solimões, on the other hand, comes from the Andes carrying an enormous amount of sediment. It is colder, faster and denser. It's like trying to mix oil and vinegar: in time it mixes, but not all at once.'" }
  - { es: "Segundo o estudo, a diferença de temperatura entre os dois rios pode chegar a seis graus Celsius em algumas épocas do ano. A velocidade também varia bastante: enquanto o Negro corre a cerca de dois quilômetros por hora, o Solimões pode chegar a seis. A mistura completa só acontece depois de muitos quilômetros, quando a turbulência finalmente vence as diferenças.", en: "According to the study, the temperature difference between the two rivers can reach six degrees Celsius at some times of year. The speed also varies considerably: while the Negro flows at about two kilometres an hour, the Solimões can reach six. Complete mixing only happens after many kilometres, when turbulence finally overcomes the differences." }
  - { es: "A ciência, porém, não é a única a ter uma explicação. Entre os ribeirinhos, contam-se histórias de que os dois rios seriam um casal que brigou e que, desde então, caminha lado a lado sem se tocar. Outros dizem que o Negro, orgulhoso, não aceita perder o nome para o irmão mais forte. Para a pesquisadora, essas narrativas não competem com os dados: “Elas mostram que as pessoas daqui observam o rio há séculos. Muitas vezes, o que a gente mede com instrumentos os moradores já tinham percebido a olho nu.”", en: "Science, however, is not the only one with an explanation. Among the river dwellers, stories are told that the two rivers are a couple who quarrelled and who, ever since, walk side by side without touching. Others say that the Negro, out of pride, refuses to lose its name to its stronger brother. For the researcher, these narratives do not compete with the data: 'They show that people here have been observing the river for centuries. Often, what we measure with instruments the residents had already noticed with the naked eye.'" }
  - { es: "Os pesquisadores chamam a atenção, no entanto, para um fator que preocupa: as secas cada vez mais fortes na região. Em anos recentes, o nível do rio Negro em Manaus chegou aos valores mais baixos já registrados, deixando comunidades isoladas e barcos parados na lama. “Com menos água, o comportamento dos rios muda, e o próprio encontro pode mudar de lugar ou de forma”, afirma Tavares, que pede mais investimento em monitoramento.", en: "The researchers draw attention, however, to a worrying factor: increasingly severe droughts in the region. In recent years the level of the Rio Negro at Manaus has reached the lowest values ever recorded, leaving communities isolated and boats stranded in the mud. 'With less water, the behaviour of the rivers changes, and the meeting itself could change position or shape,' says Tavares, who is calling for more investment in monitoring." }
  - { es: "Para quem vive do turismo, a notícia é motivo de atenção. O barqueiro José Ribamar, que há vinte anos leva visitantes ao local, conta que já viu o encontro “mais apertado” durante a seca. “O turista quer ver a linha certinha no meio do rio. Quando a água baixa demais, a gente tem que explicar que a natureza não é cartão-postal”, diz, rindo. Segundo ele, alguns colegas teriam deixado de trabalhar no último ano por falta de passageiros, informação que a associação dos barqueiros não confirma.", en: "For those who make a living from tourism, the news calls for attention. Boatman José Ribamar, who has been taking visitors to the spot for twenty years, says he has seen the meeting 'squeezed' during drought. 'Tourists want to see the neat line in the middle of the river. When the water drops too much, we have to explain that nature isn't a postcard,' he says, laughing. According to him, some colleagues have reportedly stopped working in the last year for lack of passengers, a claim the boatmen's association does not confirm." }
  - { es: "Tombado como patrimônio nacional desde 2010, o Encontro das Águas também é tema de debate entre ambientalistas e defensores de obras no porto da cidade. Para os pesquisadores, entender o fenômeno é o primeiro passo para protegê-lo. “Não se trata só de uma paisagem bonita”, resume Tavares. “É um laboratório natural, onde a gente vê, a olho nu, como a floresta e os Andes conversam através da água.”", en: "Listed as national heritage since 2010, the Meeting of the Waters is also the subject of debate between environmentalists and supporters of works at the city's port. For the researchers, understanding the phenomenon is the first step towards protecting it. 'It's not just a pretty landscape,' Tavares sums up. 'It's a natural laboratory, where we can see with the naked eye how the forest and the Andes talk to each other through water.'" }
questions:
  - { q: "Quais três fatores explicam por que os rios não se misturam?", options: ["Profundidade, vento e peixes", "Cor, chuva e marés", "Temperatura, velocidade e densidade (quantidade de material transportado)", "Poluição, barcos e turistas"], answer: 2, explain: "The headline and the third paragraph name temperature, speed and density, i.e. the amount of sediment each river carries." }
  - { q: "Por que o rio Negro é escuro?", options: ["Por causa da matéria orgânica da floresta que ele carrega", "Por causa da poluição", "Porque é muito profundo", "Porque vem dos Andes"], answer: 0, explain: "Tavares: 'traz pouca terra e muita matéria orgânica da floresta, que é o que lhe dá essa cor escura'." }
  - { q: "Qual é a preocupação dos pesquisadores?", options: ["O excesso de turistas", "As secas cada vez mais fortes, que podem mudar o comportamento dos rios", "A construção de uma ponte", "A falta de peixes"], answer: 1, explain: "Record low water levels could make the meeting change position or shape." }
  - { q: "Por que o jornalista usa o condicional em “alguns colegas teriam deixado de trabalhar”?", options: ["Porque é uma hipótese impossível", "Porque é um pedido educado", "Porque é uma informação não confirmada, atribuída ao barqueiro", "Porque fala do futuro"], answer: 2, explain: "The journalistic conditional (teriam deixado) marks a claim the paper has not verified; the association does not confirm it." }
  - { q: "Como a coordenadora resume a importância do Encontro das Águas?", options: ["É só um cartão-postal", "É um laboratório natural onde se vê a floresta e os Andes conversando através da água", "É um problema para o porto", "É um lugar perigoso"], answer: 1, explain: "Her closing quotation: 'É um laboratório natural (…)'." }
