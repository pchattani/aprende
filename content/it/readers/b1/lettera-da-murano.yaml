id: r.b1.lettera-da-murano
level: b1
title: Lettera da Murano
kind: text
intro: Nonno Bepi, a glassmaker on the island of Murano, writes to his grandson Nicola, who lives in London. Listen for wishes, hopes and feelings expressed with the congiuntivo (spero che tu venga, mi dispiace che…).
allow: [bepi, nicola, murano, londra, burano, anna, veneziani]
paragraphs:
  - { es: "Caro Nicola, ho ricevuto la tua lettera e sono contentissimo che tu stia bene. La nonna l'ha letta tre volte e poi l'ha messa sul comodino, vicino alla tua foto. Mi dispiace solo che tu lavori così tanto: spero che a Londra tu abbia anche il tempo di riposarti e di mangiare bene, non solo panini davanti al computer.", en: "Dear Nicola, I got your letter and I'm delighted that you're well. Grandma read it three times and then put it on the bedside table, next to your photo. I'm only sorry that you work so much: I hope that in London you also have time to rest and eat properly, not just sandwiches in front of the computer." }
  - { es: "Qui a Murano le cose vanno come sempre. La mattina alle sei accendo la fornace e lavoro fino all'ora di pranzo. Il vetro ha bisogno di pazienza: bisogna che il fuoco sia sempre alla temperatura giusta, più di mille gradi, e che le mani si muovano veloci ma senza fretta. Quando un pezzo è finito, lo lascio raffreddare lentamente per un giorno intero: se si raffredda troppo in fretta, si rompe. Tu lo sai, mi hai guardato tante volte quando eri piccolo.", en: "Here in Murano things are going as usual. In the morning at six I light the furnace and I work until lunchtime. Glass needs patience: the fire must always be at the right temperature, over a thousand degrees, and the hands must move quickly but without hurrying. When a piece is finished, I leave it to cool slowly for a whole day: if it cools too quickly, it breaks. You know, you watched me so many times when you were little." }
  - { es: "Sai che i vetrai lavorano a Murano dal 1291? Quell'anno la Repubblica di Venezia decise di portare tutte le fornaci sull'isola, perché aveva paura degli incendi in città. Da allora, per più di settecento anni, il mestiere è passato da padre in figlio. Mio nonno l'ha insegnato a mio padre, mio padre l'ha insegnato a me.", en: "Did you know that glassmakers have worked in Murano since 1291? That year the Republic of Venice decided to move all the furnaces to the island, because it was afraid of fires in the city. Since then, for more than seven hundred years, the craft has passed from father to son. My grandfather taught it to my father, my father taught it to me." }
  - { es: "Ed è proprio di questo che ti volevo parlare. Le fornaci di Murano sono sempre meno. Il gas costa troppo, i turisti comprano vetro falso fatto all'estero, e i giovani preferiscono lavorare a Venezia o andare via, come te. Non te lo dico per farti sentire in colpa, Nicola. Sono felice che tu abbia trovato la tua strada. Ma ho paura che tra qualche anno nessuno sappia più fare quello che facevo io.", en: "And that's exactly what I wanted to talk to you about. There are fewer and fewer furnaces in Murano. Gas costs too much, tourists buy fake glass made abroad, and young people prefer to work in Venice or move away, like you. I'm not telling you this to make you feel guilty, Nicola. I'm happy you've found your own path. But I'm afraid that in a few years nobody will know how to do what I did any more." }
  - { es: "Per questo ho deciso una cosa: quest'estate vorrei insegnare il mestiere a qualcuno. Ho già parlato con la scuola del vetro dell'isola e mi hanno detto che ci sono due ragazze molto brave che vorrebbero imparare. È strano, vero? Ai miei tempi le donne non entravano nemmeno in fornace. Sono contento che le cose siano cambiate.", en: "That's why I've decided something: this summer I'd like to teach the craft to someone. I've already spoken to the island's glass school and they told me there are two very talented girls who'd like to learn. Strange, isn't it? In my day women didn't even go into the furnace. I'm glad things have changed." }
  - { es: "Ora ti chiedo un favore. Spero che tu venga a trovarci ad agosto, almeno per una settimana. Vorrei che tu vedessi la fornace un'ultima volta prima che io vada in pensione, e mi piacerebbe che tu conoscessi le mie nuove apprendiste. Andremo anche a Burano, come quando eri bambino, a mangiare il risotto di pesce e a guardare le case colorate.", en: "Now I'm asking you a favour. I hope you'll come and see us in August, at least for a week. I'd like you to see the furnace one last time before I retire, and I'd love you to meet my new apprentices. We'll go to Burano too, like when you were a child, to eat fish risotto and look at the coloured houses." }
  - { es: "La nonna ti manda un bacio e dice che ti preparerà le sarde in saor. Ti aspettiamo. Con tutto il mio affetto, il tuo nonno Bepi.", en: "Grandma sends you a kiss and says she'll make you sarde in saor. We're waiting for you. With all my love, your Grandpa Bepi." }
questions:
  - { q: "Di che cosa si dispiace il nonno?", options: ["Che Nicola lavori troppo", "Che Nicola non abbia scritto", "Che la nonna stia male"], answer: 0, explain: "«Mi dispiace solo che tu lavori così tanto» – dispiacere che + congiuntivo." }
  - { q: "Perché i vetrai si sono trasferiti a Murano nel 1291?", options: ["Perché a Murano c'era più sabbia", "Perché la Repubblica di Venezia temeva gli incendi in città", "Perché i turisti volevano visitare l'isola"], answer: 1, explain: "The Republic moved the furnaces to Murano for fear of fires in Venice." }
  - { q: "Di che cosa ha paura il nonno?", options: ["Che nessuno sappia più lavorare il vetro", "Che Nicola torni a Venezia", "Che la fornace sia troppo calda"], answer: 0, explain: "«Ho paura che tra qualche anno nessuno sappia più fare quello che facevo io.»" }
  - { q: "Che cosa ha deciso di fare il nonno quest'estate?", options: ["Vendere la fornace", "Insegnare il mestiere a due ragazze", "Trasferirsi a Londra"], answer: 1, explain: "The glass school found two talented girls who want to learn: they'll be his apprentices." }
  - { q: "Che cosa spera il nonno?", options: ["Che Nicola venga a trovarli ad agosto", "Che Nicola diventi vetraio", "Che Nicola gli mandi dei soldi"], answer: 0, explain: "«Spero che tu venga a trovarci ad agosto.»" }
glossary:
  - { es: contentissimo, en: delighted, very happy }
  - { es: fornace, en: (glass) furnace }
  - { es: fornaci, en: furnaces }
  - { es: muovano, en: move (congiuntivo) }
  - { es: raffreddare, en: to cool }
  - { es: raffredda, en: cools }
  - { es: decise, en: decided (passato remoto) }
  - { es: mestiere, en: craft, trade }
  - { es: gas, en: gas }
  - { es: estero, en: abroad (all'estero) }
  - { es: sentire in colpa, en: to feel guilty }
  - { es: apprendiste, en: (female) apprentices }
  - { es: sarde in saor, en: sweet-and-sour Venetian sardines }
  - { es: sarde, en: sardines }
  - { es: saor, en: (Venetian) sweet-and-sour marinade }
  - { es: tempi, en: times (ai miei tempi = in my day) }
