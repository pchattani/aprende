id: r.c1.bonifacio-bon-ben-du-coup
level: c1
title: Bonifacio, bon, ben, du coup…
kind: dialogue
intro: "Léa, a Parisian, visits Bonifacio with her Corsican friend Antoine. Their very natural conversation is full of discourse markers (bon, ben, du coup, enfin, quoi, bref), understatement (c'est pas mal, il fait pas chaud) and things said without being said. Try to work out what each speaker really means."
allow: [insulté, bretagne, arthur, bonifacio, léa, antoine, corse, corses, sardaigne, aragon, ajaccio, paris, ok, waouh, bah]
paragraphs:
  - { es: "Léa : Bon, on y va, à cette promenade en bateau ? Parce que si on attend encore, il va y avoir un monde fou au port.", en: "Léa: Right, are we going on this boat trip or not? Because if we wait any longer, the harbour's going to be packed." }
  - { es: "Antoine : Ben, j'attendais que tu finisses ton café, moi. Mais bon, si tu es prête… Ma grand-mère m'a dit de prendre celui de neuf heures, il y a moins de touristes. Enfin, moins… disons qu'on peut encore respirer.", en: "Antoine: Well, I was waiting for you to finish your coffee. But fine, if you're ready… My grandmother told me to take the nine o'clock one, there are fewer tourists. Well, fewer… let's say you can still breathe." }
  - { es: "Léa : Ta grand-mère, elle a le cœur sur la main, hein. Hier soir, elle m'a fait goûter tout ce qu'il y avait dans la cuisine. Je crois que j'ai pris deux kilos.", en: "Léa: Your grandmother is so generous. Last night she made me taste everything in the kitchen. I think I've put on two kilos." }
  - { es: "Antoine : C'est sa façon de dire qu'elle t'aime bien. Si elle ne t'avait rien proposé, là, ç'aurait été inquiétant ! Bref. Le bateau longe les falaises, puis il entre dans les grottes, et au retour on voit la ville d'en bas. Tu vas voir, c'est pas mal.", en: "Antoine: That's her way of saying she likes you. If she hadn't offered you anything, now that would have been worrying! Anyway. The boat goes along the cliffs, then into the caves, and on the way back you see the town from below. You'll see, it's not bad." }
  - { es: "Léa : « Pas mal » ? Venant de toi, ça veut dire que c'est magnifique, non ?", en: "Léa: 'Not bad'? Coming from you, that means it's magnificent, doesn't it?" }
  - { es: "Antoine : Disons que… oui. Mais je ne veux pas que tu sois déçue.", en: "Antoine: Let's say… yes. But I don't want you to be disappointed." }
  - { es: "Léa (une demi-heure plus tard) : Waouh… Les maisons sont vraiment construites au bord du vide ! Elles ne tombent jamais ?", en: "Léa (half an hour later): Wow… The houses really are built on the edge of the drop! Don't they ever fall?" }
  - { es: "Antoine : Ça arrive que des morceaux de falaise tombent, oui. Du coup, il y a des endroits où on n'a plus le droit de construire. Mais la vieille ville est là depuis des siècles, hein. Tu vois, là, cet escalier creusé dans la roche ? C'est l'escalier du roi d'Aragon.", en: "Antoine: Bits of cliff do sometimes fall, yes. So there are places where you're not allowed to build any more. But the old town has been there for centuries, you know. See that staircase cut into the rock over there? That's the King of Aragon's staircase." }
  - { es: "Léa : Celui que les soldats auraient creusé en une seule nuit ? J'ai lu ça dans le guide.", en: "Léa: The one the soldiers are supposed to have dug in a single night? I read that in the guidebook." }
  - { es: "Antoine : Voilà. Selon la légende, pendant un siège, les soldats du roi d'Aragon l'ont creusé en une nuit pour attaquer la ville. Bon, en réalité, il est sûrement plus ancien, et une nuit, pour presque deux cents marches, c'est un peu court, quoi. Mais c'est une belle histoire, et à Bonifacio on n'aime pas trop qu'on touche à nos belles histoires.", en: "Antoine: That's it. According to the legend, during a siege, the King of Aragon's soldiers dug it in one night to attack the town. Well, in reality it's surely older, and one night for almost two hundred steps is a bit short, you know. But it's a nice story, and in Bonifacio people don't much like you messing with their nice stories." }
  - { es: "Léa : Je comprends. Chez moi, en Bretagne, c'est pareil avec les légendes du roi Arthur. Tout le monde sait que ce n'est pas vrai, mais si tu le dis tout haut, on te regarde comme si tu avais insulté la famille.", en: "Léa: I understand. Back home in Brittany it's the same with the legends of King Arthur. Everyone knows it isn't true, but if you say so out loud, people look at you as if you'd insulted the family." }
  - { es: "Antoine : Voilà, tu as tout compris. Ici, on est un peu comme ça aussi. On peut critiquer la Corse entre nous, mais si quelqu'un d'autre le fait… enfin, tu vois ce que je veux dire.", en: "Antoine: There you go, you've got it. Here we're a bit like that too. We can criticise Corsica among ourselves, but if someone else does it… well, you see what I mean." }
  - { es: "Léa : Message reçu, je ne dirai rien ! Et là-bas, de l'autre côté, c'est quoi, ces montagnes ?", en: "Léa: Message received, I won't say a word! And over there, on the other side, what are those mountains?" }
  - { es: "Antoine : C'est la Sardaigne. Elle est à une douzaine de kilomètres seulement. Par beau temps, comme aujourd'hui, on la voit très bien. Mais quand le vent souffle dans les Bouches, je te promets que tu n'as pas envie d'être sur un bateau. Il y a des gens qui sont tombés dans les pommes rien qu'en regardant les vagues.", en: "Antoine: That's Sardinia. It's only about twelve kilometres away. In fine weather, like today, you can see it very clearly. But when the wind blows in the Strait, I promise you, you don't want to be on a boat. Some people have passed out just looking at the waves." }
  - { es: "Léa : Tu exagères un peu, non ? Enfin… il ne fait pas chaud, quand même, avec ce vent.", en: "Léa: You're exaggerating a bit, aren't you? Mind you… it's not exactly warm, with this wind." }
  - { es: "Antoine : Tiens, prends ma veste. Ça, c'est la manière parisienne de dire « j'ai froid », je commence à connaître.", en: "Antoine: Here, take my jacket. That's the Parisian way of saying 'I'm cold', I'm starting to get it." }
  - { es: "Léa : Merci, tu es un ange. Bon, et après le bateau, on fait quoi ? On monte dans la vieille ville ?", en: "Léa: Thanks, you're an angel. Right, and after the boat, what shall we do? Shall we go up to the old town?" }
  - { es: "Antoine : On pourrait, oui. Mais je te préviens : les restaurants sur le port, ils coûtent les yeux de la tête. Ma grand-mère a dit qu'elle préparait des beignets pour midi… Enfin, je dis ça, je dis rien.", en: "Antoine: We could, yes. But I'm warning you: the restaurants on the harbour cost an arm and a leg. My grandmother said she was making fritters for lunch… Well, I'm just saying." }
  - { es: "Léa : J'ai compris, j'ai compris. On rentre manger chez ta grand-mère. Mais cette fois, je ne prends qu'une seule assiette !", en: "Léa: I get it, I get it. We'll go back and eat at your grandmother's. But this time I'm only having one plateful!" }
  - { es: "Antoine : C'est ce que tout le monde dit. Personne n'y arrive. Allez, on y va, le bateau part.", en: "Antoine: That's what everyone says. Nobody manages it. Come on, let's go, the boat's leaving." }
questions:
  - { q: "Que veut dire Léa par « elle a le cœur sur la main » ?", options: ["Que la grand-mère est malade", "Que la grand-mère est très généreuse", "Que la grand-mère cuisine mal"], answer: 1, explain: "avoir le cœur sur la main = to be very generous: she made Léa taste everything in the kitchen." }
  - { q: "Que signifie vraiment le « c'est pas mal » d'Antoine ?", options: ["Que c'est moyen", "Que c'est magnifique : c'est une litote", "Que c'est dangereux"], answer: 1, explain: "A litotes says less to mean more; Léa understands at once: «Venant de toi, ça veut dire que c'est magnifique»." }
  - { q: "Que dit la légende de l'escalier du roi d'Aragon ?", options: ["Qu'il a été creusé en une nuit par des soldats pendant un siège", "Qu'il a été construit par les Romains", "Qu'il mène en Sardaigne"], answer: 0, explain: "«Selon la légende, pendant un siège, les soldats du roi d'Aragon l'ont creusé en une nuit.» Antoine adds that it is surely older." }
  - { q: "Que comprend Antoine quand Léa dit « il ne fait pas chaud, quand même » ?", options: ["Qu'elle veut rentrer à Paris", "Qu'elle a froid et aimerait sa veste", "Qu'elle parle de la météo de demain"], answer: 1, explain: "An implicit request: he offers his jacket, «Ça, c'est la manière parisienne de dire j'ai froid»." }
  - { q: "Que suggère Antoine avec « je dis ça, je dis rien » ?", options: ["Qu'il ne sait pas quoi dire", "Qu'il vaudrait mieux aller manger chez sa grand-mère plutôt qu'au restaurant", "Qu'il veut se taire"], answer: 1, explain: "He mentions the expensive restaurants and his grandmother's fritters, then pretends he said nothing — a classic way of suggesting without insisting." }
glossary:
  - { es: falaises, en: cliffs }
  - { es: vide, en: "void, drop" }
  - { es: siège, en: siege }
  - { es: bouches, en: "(les Bouches de Bonifacio) the Strait of Bonifacio" }
  - { es: pommes, en: "(tomber dans les pommes) to pass out" }
  - { es: ange, en: angel }
  - { es: beignets, en: fritters }
  - { es: souffle, en: blows }
