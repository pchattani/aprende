      - q: { es: "Encore un peu de gâteau ?", en: "A bit more cake?" }
        a: { es: "Oui, encore un petit morceau, merci.", en: "Yes, another small piece, thanks." }
        alt: ["Non merci, ça va.", "Avec plaisir !"]
        grammar: [g.quantities]
        vocab: [w.encore]
    texts:
      - title: "Au revoir, Paris !"
        es: ["J'habite à Paris depuis un an.", "Je viens de finir mon cours de français.", "Demain, je rentre chez moi avec beaucoup de souvenirs."]
        en: ["I've been living in Paris for a year.", "I've just finished my French course.", "Tomorrow I'm going home with lots of memories."]
