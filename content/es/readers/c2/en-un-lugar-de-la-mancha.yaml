id: r.c2.en-un-lugar-de-la-mancha
level: c2
title: En un lugar de la Mancha
kind: literature
author: Miguel de Cervantes
source: "El ingenioso hidalgo don Quijote de la Mancha, primera parte, capítulo I (1605)"
intro: The opening of chapter I of Don Quixote, quoted in the original spelling of 1605 (della, mesmo, celebro, efeto); one short digression on the hidalgo's surname is omitted. Read it for the Golden Age features studied in this unit, with the glossary as support; the text is public domain.
allow: [mancha, quijada, quesada, quejana, della, dél, deste, dellos, mesmo, letura, celebro, efeto, estraño]
paragraphs:
  - { es: "En un lugar de la Mancha, de cuyo nombre no quiero acordarme, no ha mucho tiempo que vivía un hidalgo de los de lanza en astillero, adarga antigua, rocín flaco y galgo corredor.", en: "In a village of La Mancha, whose name I do not care to remember, not long ago there lived one of those gentlemen who keep a lance in the rack, an old leather shield, a lean nag and a greyhound for coursing." }
  - { es: "Una olla de algo más vaca que carnero, salpicón las más noches, duelos y quebrantos los sábados, lantejas los viernes, algún palomino de añadidura los domingos, consumían las tres partes de su hacienda. El resto della concluían sayo de velarte, calzas de velludo para las fiestas, con sus pantuflos de lo mesmo, y los días de entresemana se honraba con su vellorí de lo más fino.", en: "A stew of rather more beef than mutton, hash most nights, eggs and bacon on Saturdays, lentils on Fridays, and a young pigeon as a treat on Sundays consumed three quarters of his income. The rest of it went on a doublet of fine cloth, velvet breeches for feast days, with slippers to match, and on weekdays he made a brave figure in his best homespun." }
  - { es: "Tenía en su casa una ama que pasaba de los cuarenta, y una sobrina que no llegaba a los veinte, y un mozo de campo y plaza, que así ensillaba el rocín como tomaba la podadera. Frisaba la edad de nuestro hidalgo con los cincuenta años; era de complexión recia, seco de carnes, enjuto de rostro, gran madrugador y amigo de la caza.", en: "He had in his house a housekeeper past forty, a niece not yet twenty, and a lad for the field and the market who saddled the nag as readily as he handled the pruning hook. The age of our gentleman bordered on fifty; he was of a hardy constitution, spare of flesh, lean of face, a great early riser and a lover of the hunt." }
  - { es: "Es, pues, de saber que este sobredicho hidalgo, los ratos que estaba ocioso, que eran los más del año, se daba a leer libros de caballerías, con tanta afición y gusto, que olvidó casi de todo punto el ejercicio de la caza, y aun la administración de su hacienda; y llegó a tanto su curiosidad y desatino en esto, que vendió muchas hanegas de tierra de sembradura para comprar libros de caballerías en que leer, y así, llevó a su casa todos cuantos pudo haber dellos.", en: "You must know, then, that the above-named gentleman, in the moments when he was idle, which was most of the year, gave himself up to reading books of chivalry with such relish and delight that he almost entirely forgot the pursuit of the hunt and even the management of his estate; and his curiosity and folly in this went so far that he sold many acres of arable land to buy books of chivalry to read, and so he brought home all he could lay hands on." }
  - { es: "En resolución, él se enfrascó tanto en su letura, que se le pasaban las noches leyendo de claro en claro, y los días de turbio en turbio; y así, del poco dormir y del mucho leer, se le secó el celebro, de manera que vino a perder el juicio.", en: "In short, he became so absorbed in his reading that he spent his nights reading from dusk to dawn and his days from dawn to dusk; and so, from little sleep and much reading, his brain dried up, so that he came to lose his wits." }
  - { es: "Llenósele la fantasía de todo aquello que leía en los libros, así de encantamentos como de pendencias, batallas, desafíos, heridas, requiebros, amores, tormentas y disparates imposibles; y asentósele de tal modo en la imaginación que era verdad toda aquella máquina de aquellas soñadas invenciones que leía, que para él no había otra historia más cierta en el mundo.", en: "His fancy filled with everything he read in the books, enchantments as much as quarrels, battles, challenges, wounds, courtships, loves, storms and impossible absurdities; and it took such hold of his imagination that the whole fabric of those dreamed-up inventions he read was true, that for him there was no history more certain in the world." }
  - { es: "En efeto, rematado ya su juicio, vino a dar en el más estraño pensamiento que jamás dio loco en el mundo, y fue que le pareció convenible y necesario, así para el aumento de su honra como para el servicio de su república, hacerse caballero andante y irse por todo el mundo con sus armas y caballo a buscar las aventuras y a ejercitarse en todo aquello que él había leído que los caballeros andantes se ejercitaban, deshaciendo todo género de agravio y poniéndose en ocasiones y peligros donde, acabándolos, cobrase eterno nombre y fama.", en: "In fact, his wits now quite gone, he hit upon the strangest notion that ever a madman in this world hit upon: it seemed to him fitting and necessary, both for the increase of his honour and for the service of his country, to make himself a knight errant and go through the world with his arms and horse in search of adventures, and to practise everything he had read that knights errant practised, righting every kind of wrong and exposing himself to perils and dangers from which, by overcoming them, he would win eternal name and fame." }
questions:
  - { q: "How does the narrator describe the hidalgo's finances?", options: ["He was very rich", "Three quarters of his income went on food, the rest on clothes", "He had no income at all"], answer: 1 }
  - { q: "Who lives in the hidalgo's house?", options: ["His wife and two sons", "A housekeeper, a niece and a farm lad", "Sancho Panza and a priest"], answer: 1 }
  - { q: "What did the hidalgo sell in order to buy books of chivalry?", options: ["His horse", "His greyhound", "Many acres of arable land"], answer: 2 }
  - { q: "Why did he lose his wits, according to the text?", options: ["From little sleep and much reading", "From a blow to the head", "From hunger"], answer: 0 }
  - { q: "Which archaic feature appears in 'Llenósele la fantasía'?", options: ["The future subjunctive", "An enclitic pronoun after the conjugated verb", "The form vuestra merced"], answer: 1 }
