grammar:
  - { prompt: "Se eu ___ (ter) mais tempo, aprenderia a tocar piano.", options: ["teria", "tenho", "tivesse"], answer: 2, explain: "Unreal present condition: se + imperfect subjunctive (tivesse) + conditional (aprenderia)." }
  - { prompt: "Ele fala da empresa como se ___ (ser) o dono.", options: ["é", "fosse", "seria"], answer: 1, explain: "como se always takes the imperfect (or pluperfect) subjunctive." }
  - { prompt: "Que bom que vocês ___ (chegar) bem ontem!", options: ["tenham chegado", "têm chegado", "chegariam"], answer: 0, explain: "Emotion about a completed action: perfect subjunctive tenham chegado." }
  - { prompt: "Se você me ___ (avisar), eu teria ido te buscar no aeroporto.", options: ["tivesse avisado", "teria avisado", "avisasse"], answer: 0, explain: "Past unreal condition: se + pluperfect subjunctive + conditional perfect." }
  - { prompt: "___ eu tivesse estudado mais quando era jovem!", options: ["Espero que", "Quem dera", "Acho que"], answer: 1, explain: "Quem dera + imperfect / pluperfect subjunctive expresses a wish or regret." }
  - { prompt: "Você estava com febre; ___ ter ido ao médico.", options: ["deve", "deverá", "deveria"], answer: 2, explain: "Reproach about the past: deveria ter + participle." }
  - { prompt: "Mesmo que ___ (chover) amanhã, vamos para a serra.", options: ["chove", "choverá", "chova"], answer: 2, explain: "mesmo que (even if) takes the subjunctive." }
  - { prompt: "Por mais que ele ___ (trabalhar), nunca termina a tempo.", options: ["trabalhe", "trabalha", "trabalhará"], answer: 0, explain: "Concessive por mais que takes the subjunctive." }
  - { prompt: "___ o trânsito, chegamos na hora.", options: ["Embora o", "Apesar do", "Mesmo que o"], answer: 1, explain: "apesar de + noun (de + o = do); embora and mesmo que need a clause with a verb." }
  - { prompt: "Vou com vocês, desde que ___ (voltar) cedo.", options: ["voltamos", "voltaremos", "voltemos"], answer: 2, explain: "desde que meaning 'provided that' takes the subjunctive." }
  - { prompt: "O chefe pediu que nós ___ (chegar) mais cedo.", options: ["chegamos", "chegássemos", "chegaremos"], answer: 1, explain: "Reported request in the past: imperfect subjunctive chegássemos." }
  - { prompt: "A nova ponte ___ construída desde o ano passado.", options: ["está sendo", "é sido", "foi sendo"], answer: 0, explain: "Passive in progress: estar sendo + participle." }
  - { prompt: "Os preços ___ subindo pouco a pouco desde janeiro.", options: ["andam a", "vêm", "são"], answer: 1, explain: "vir + gerund: a gradual process up to now (vêm subindo)." }
  - { prompt: "Quando você voltar, eu já ___ (terminar) o relatório.", options: ["terminei", "terminaria", "terei terminado"], answer: 2, explain: "Future perfect for an action completed before a future point: terei terminado." }
  - { prompt: "Escrita formal: ___ que a obra termine em maio.", options: ["Espera-se", "Se espera", "Esperam-se"], answer: 0, explain: "Written norm avoids starting a sentence with a clitic: espera-se (in speech Brazilians say se espera)." }
writing:
  prompt: "A Brazilian newspaper has invited readers to send opinion articles on the question: As cidades turísticas deveriam limitar o número de visitantes? Write an article of at least 180 words. Give it a title; introduce the topic and state your thesis; develop two or three arguments with connectors (em primeiro lugar, além disso, aliás); concede a point and rebut it (é verdade que…, no entanto…; não é que…, mas sim…); use at least one passive or impersonal structure and one unreal condition (se as prefeituras tivessem…); finish with a conclusion and a recommendation (em suma, seria importante que…)."
  minWords: 180
  modelAnswer: |
    Turismo, sim, mas com regras

    Nos últimos anos, cidades como Paraty, Ouro Preto e Fernando de Noronha passaram a receber mais visitantes do que conseguem suportar. Neste artigo, defendo que as cidades turísticas deveriam controlar o número de visitantes, não para fechar as portas, mas para continuarem a ser cidades.

    Em primeiro lugar, é preciso considerar a questão da moradia. Quando um apartamento é alugado para turistas por temporada, deixa de ser alugado para famílias por anos; prova disso é que, nos bairros mais visitados, os aluguéis subiram muito em pouco tempo. Além disso, os jovens são obrigados a sair do centro, que acaba virando um lugar sem moradores.

    É verdade que o turismo gera empregos e que muitas cidades teriam desaparecido sem ele. No entanto, trata-se muitas vezes de trabalho temporário e mal pago. Não é que o turista seja o problema, mas sim que ninguém estabeleceu regras. Se as prefeituras tivessem controlado os aluguéis de temporada há dez anos, hoje não precisariam escolher entre moradores e visitantes.

    Em suma, é preciso decidir quantas portas abrimos e a que preço. Por isso, seria importante que as prefeituras controlassem os aluguéis de temporada, cobrassem uma taxa dos visitantes e levassem o turismo para toda a região. Só assim todos sairão ganhando.
  checklist:
    - "I gave the article a title and stated my thesis in the introduction (neste artigo, defendo que…)."
    - "I organised the arguments with connectors (em primeiro lugar, além disso, aliás, prova disso) and one idea per paragraph."
    - "I conceded a point and rebutted it (é verdade que… no entanto…; não é que… mas sim…) with the subjunctive after não é que."
    - "I used at least one passive or impersonal structure (é alugado, trata-se de, é preciso)."
    - "I used an unreal condition correctly (se as prefeituras tivessem controlado…, hoje não precisariam…)."
    - "I closed with a conclusion and a recommendation using the imperfect subjunctive (seria importante que as prefeituras controlassem…)."
