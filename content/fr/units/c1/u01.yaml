writing:
  - task: "Write the opening of a short story set in the port of Bordeaux in the eighteenth century: the background in the imparfait, the events in the passé simple."
    min: 110
    max: 190
    use: [w.négociant, w.cargaison, w.brume, w.s-approcher, w.accoster]
    useAtLeast: 3
    grammar: [g.passe-simple-forms, g.passe-simple-usage]
    expect:
      - { pattern: "(?<![a-zàâçéèêëîïôûùœ])[a-zàâçéèêëîïôûùœ]{2,}(èrent|irent|urent|inrent)(?![a-zàâçéèêëîïôûùœ])|(?<![a-zàâçéèêëîïôûùœ])(fut|eut|fit|dit|prit|vit|mit|vint|tint|naquit|mourut|sut|put|dut|vécut|connut|parut|reçut|courut|lut|but|ouvrit|découvrit|sortit|partit|devint|revint|entendit|répondit|attendit|descendit|perdit|aperçut)(?![a-zàâçéèêëîïôûùœ])|(?<![a-zàâçéèêëîïôûùœ])[a-zàâçéèêëîïôûùœ]{3,}(ra|la|ta|na|cha|va|ga|qua|ça|da|pa|ma|sa|ya|ia)(?![a-zàâçéèêëîïôûùœ])", hint: "Tell the events in the passé simple: il arriva, elle vit, ils partirent…" }
      - { pattern: "(?<![a-zàâçéèêëîïôûùœ])(?!(mais|jamais|fais|fait|vais|sais|sait|frais|lait|parfait|anglais|fran[cç]ais|palais|vrais|mauvais)(?![a-zàâçéèêëîïôûùœ]))[a-zàâçéèêëîïôûùœ]{2,}(ais|ait|aient)(?![a-zàâçéèêëîïôûùœ])", hint: "Set the scene in the imparfait: la brume couvrait le fleuve…" }
    model: { es: "En ce matin de novembre 1765, une brume grise couvrait la Garonne. Sur les quais du port de la Lune, les marchands attendaient en silence, et l'on n'entendait que les mouettes, au loin. Jean Lacaze, jeune négociant bordelais, se tenait près des entrepôts. Il attendait depuis trois semaines un navire venu des Antilles, dont la cargaison devait faire sa fortune. Soudain, une silhouette sombre apparut sur le fleuve. Le jeune homme s'approcha de l'eau et reconnut les voiles de La Belle Hélène. Le navire accosta lentement. Le capitaine descendit le premier, mais son visage était tout blanc. Il s'avança vers Lacaze et lui dit d'une voix grave qu'une tempête avait emporté la moitié des barriques.", en: "On that November morning in 1765, a grey mist covered the Garonne. On the quays of the Port of the Moon the merchants waited in silence, and nothing could be heard but the gulls in the distance. Jean Lacaze, a young Bordeaux merchant, stood near the warehouses. For three weeks he had been waiting for a ship from the West Indies, whose cargo was to make his fortune. Suddenly a dark shape appeared on the river. The young man approached the water and recognised the sails of La Belle Hélène. The ship slowly came alongside. The captain came down first, but his face was white as a sheet. He stepped towards Lacaze and told him in a grave voice that a storm had carried away half of the barrels." }
  - task: "Write a short biography of Montesquieu (or another writer from Bordeaux) in a formal written style, using the passé simple (il naquit, il publia, il mourut…)."
    min: 110
    max: 190
    use: [w.philosophe, w.essai, w.publier, w.magistrat, w.séparation-des-pouvoirs]
    useAtLeast: 3
    grammar: [g.passe-simple-usage]
    expect:
      - { pattern: "(?<![a-zàâçéèêëîïôûùœ])(naquit|v[eé]cut|mourut|publia|devint|fut|[eé]crivit|h[eé]rita|[eé]pousa|voyagea|entra|s['’][eé]teignit|connut|re[cç]ut|quitta|revint|passa|consacra|r[eé]digea|obtint|parut|parurent|furent)(?![a-zàâçéèêëîïôûùœ])", hint: "Use the passé simple for a written biography: il naquit, il publia, il mourut…" }
    model: { es: "Charles-Louis de Secondat, plus connu sous le nom de Montesquieu, naquit en 1689 au château de La Brède, près de Bordeaux. Issu d'une famille de magistrats, il étudia le droit et devint conseiller au parlement de Bordeaux. À la mort de son oncle, il hérita de sa charge et de sa fortune. En 1721, il publia un roman par lettres qui connut un immense succès : à travers l'histoire de deux Persans en visite à Paris, il y critiquait les mœurs de la société française. Il voyagea ensuite pendant plusieurs années en Europe. En 1748 parut son œuvre majeure, De l'esprit des lois, dans laquelle il défendit la séparation des pouvoirs. Ce grand philosophe des Lumières s'éteignit à Paris en 1755.", en: "Charles-Louis de Secondat, better known as Montesquieu, was born in 1689 at the Château de La Brède, near Bordeaux. From a family of magistrates, he studied law and became a councillor at the Bordeaux parliament. On his uncle's death he inherited his office and his fortune. In 1721 he published an epistolary novel that was a huge success: through the story of two Persians visiting Paris, he criticised the customs of French society. He then travelled in Europe for several years. In 1748 his major work, The Spirit of the Laws, appeared, in which he defended the separation of powers. This great philosopher of the Enlightenment died in Paris in 1755." }
  - task: "Write a short scene with dialogue in the style of a novel, using inverted speech verbs (« Non », répliqua-t-elle ; s'écria-t-il ; murmura-t-elle…)."
    min: 110
    max: 190
    use: [w.répliquer, w.s-écrier, w.murmurer, w.soupirer, w.chuchoter]
    useAtLeast: 3
    grammar: [g.passe-simple-usage]
    expect:
      - { pattern: "[a-zàâçéèêëîïôûùœ]+-(t-)?(il|elle|ils|elles|on)\\b", hint: "Invert the speech verb after the quotation: « … », répliqua-t-elle." }
      - { pattern: "[«»\"“”]", hint: "Put the spoken words in quotation marks (« … »)." }
    model: { es: "Le soir tombait sur les quais de Bordeaux, et la brume montait lentement du fleuve. Hélène attendait depuis une heure, assise sur une barrique, lorsque Paul apparut enfin. « Tu es en retard », dit-elle froidement. Il baissa les yeux. « Je sais, murmura-t-il. Le navire est arrivé plus tôt que prévu. » Elle eut un sourire triste. « Toujours ton navire ! s'écria-t-elle. Et moi, je compte pour quoi ? » Paul s'approcha d'elle et lui prit la main. « Pour tout, chuchota-t-il. Demain, je pars pour les Antilles, mais je reviendrai avant l'hiver. » Hélène soupira longuement. « Tu dis toujours cela », répliqua-t-elle. Puis, sans un mot de plus, elle s'éloigna dans la brume. Paul resta seul sur le quai, sans bouger, jusqu'à la nuit.", en: "Night was falling over the quays of Bordeaux, and the mist was slowly rising from the river. Hélène had been waiting for an hour, sitting on a barrel, when Paul at last appeared. 'You're late,' she said coldly. He lowered his eyes. 'I know,' he murmured. 'The ship arrived earlier than expected.' She gave a sad smile. 'Always your ship!' she cried. 'And what do I count for?' Paul went up to her and took her hand. 'For everything,' he whispered. 'Tomorrow I leave for the West Indies, but I'll be back before winter.' Hélène sighed deeply. 'You always say that,' she retorted. Then, without another word, she walked away into the mist. Paul stayed alone on the quay, without moving, until nightfall." }
  - task: "Continue the story of a ship arriving in Bordeaux: tell what happened as soon as it had docked, using the passé antérieur (dès que le navire eut accosté…, à peine fut-il descendu que…)."
    min: 110
    max: 190
    use: [w.aussitôt-que, w.à-peine-que, w.se-précipiter, w.surgir, w.s-enfuir]
    useAtLeast: 3
    grammar: [g.passe-anterieur, g.passe-simple-forms]
    expect:
      - { pattern: "(?<![a-zàâçéèêëîïôûùœ])(eut|eurent|fut|furent|e[uû]mes|f[uû]mes) [a-zàâçéèêëîïôûùœ]+(é|ée|és|ées|i|ie|is|u|ue|us|it|ert|ort)(?![a-zàâçéèêëîïôûùœ])", hint: "Use the passé antérieur: quand il eut fini, dès qu'ils furent arrivés…" }
      - { pattern: "\\b(d[eè]s qu|aussit[oô]t qu|apr[eè]s qu|lorsqu|quand|sit[oô]t qu|peine)", hint: "Introduce it with dès que, aussitôt que, lorsque, à peine… que." }
    model: { es: "Dès que le navire eut accosté, une foule de marchands se précipita sur le quai. Le capitaine, lui, attendit que les marins eussent fini leur travail avant de descendre. Aussitôt qu'il eut posé le pied à terre, un homme surgit de la foule et lui remit une lettre cachetée. Le capitaine la lut en silence, puis devint tout blanc. À peine eut-il fini sa lecture qu'il ordonna de fermer les entrepôts. Lorsque les policiers furent arrivés sur le quai, il était déjà trop tard : le mystérieux passager de la cabine numéro trois avait disparu. On apprit plus tard qu'il s'était enfui par les ruelles du quartier Saint-Michel, emportant avec lui le secret de la cargaison.", en: "As soon as the ship had docked, a crowd of merchants rushed onto the quay. The captain waited until the sailors had finished their work before going ashore. As soon as he had set foot on land, a man appeared out of the crowd and handed him a sealed letter. The captain read it in silence, then went white. Hardly had he finished reading when he ordered the warehouses to be closed. When the police officers had arrived on the quay, it was already too late: the mysterious passenger in cabin number three had vanished. It was later learnt that he had fled through the alleys of the Saint-Michel district, taking the secret of the cargo with him." }
