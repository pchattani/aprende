id: c1.u01
title: Matices del subjuntivo
lessons:
  - id: c1.u01.l1
    title: Dice que vienes, dice que vengas
    teach: [g.subjunctive-nuance]
    vocab: [w.insinuar, w.dar-a-entender, w.intencion, w.suplicar, w.sensato, w.propuesta, w.senalar, w.sostener, w.cuestionar, w.descartar, w.pretender, w.exigencia, w.aparentar, w.percibir, w.intuir, w.aconsejable, w.oportuno, w.adecuado, w.directiva, w.traslado]
    tip: "With verbs like decir, insistir, sugerir, advertir the mood changes the meaning: indicative reports a fact (dice que vienes), subjunctive transmits a wish or order (dice que vengas)."
    sentences:
      - { es: "La jefa dice que el informe está incompleto; la jefa dice que lo revisemos antes del viernes.", en: "The boss says the report is incomplete; the boss says we should review it before Friday.", altEn: ["The boss says the report is incomplete; the boss tells us to review it before Friday."], grammar: [g.subjunctive-nuance], vocab: [w.revisar, w.informe, w.jefe], note: "Indicative = information; subjunctive = instruction." }
      - { es: "¿Insistes en que la propuesta es buena o insistes en que la aceptemos?", en: "Are you insisting that the proposal is good, or insisting that we accept it?", grammar: [g.subjunctive-nuance], vocab: [w.propuesta, w.insistir, w.aceptar] }
      - { es: "Marta sugiere que el cliente no está contento; yo sugiero que lo llamemos hoy mismo.", en: "Marta suggests (hints) that the client isn't happy; I suggest we call him today.", altEs: ["Marta sugiere que el cliente no está contento; yo sugiero que le llamemos hoy mismo."], grammar: [g.subjunctive-nuance], vocab: [w.sugerir, w.cliente, w.llamar] }
      - { es: "El director advirtió que el plazo era imposible, pero nadie le hizo caso.", en: "The director warned that the deadline was impossible, but nobody listened to him.", grammar: [g.subjunctive-nuance], vocab: [w.advertir, w.director, w.plazo], note: "advertir que + indicative = to warn that (a fact)." }
      - { es: "Te advierto que no firmes nada sin leerlo dos veces.", en: "I'm warning you not to sign anything without reading it twice.", altEs: ["Te advierto que no firmes nada sin leerlo antes."], grammar: [g.subjunctive-nuance], vocab: [w.advertir, w.firmar], note: "advertir que + subjunctive = to warn someone to (do something)." }
      - { es: "No es lo mismo decir que el proyecto fracasa que decir que el proyecto fracase.", en: "Saying that the project is failing is not the same as saying that the project should fail.", grammar: [g.subjunctive-nuance], vocab: [w.proyecto, w.fracasar] }
      - { es: "Busco un compañero que sepa hablar con la directiva sin ponerse nervioso.", en: "I'm looking for a colleague who can talk to the management without getting nervous.", altEs: ["Busco a un compañero que sepa hablar con la directiva sin ponerse nervioso."], grammar: [g.subjunctive-nuance], vocab: [w.directiva, w.companero, w.nervioso], note: "sepa: the colleague is sought, not yet identified." }
      - { es: "Tengo un compañero que sabe hablar con la directiva: pregúntale a Luis.", en: "I have a colleague who knows how to talk to the management: ask Luis.", grammar: [g.subjunctive-nuance], vocab: [w.directiva, w.companero] }
      - { es: "Aunque la oferta es tentadora, la voy a rechazar; aunque sea tentadora, no me conviene.", en: "Although the offer is tempting, I'm going to turn it down; however tempting it may be, it doesn't suit me.", grammar: [g.subjunctive-nuance], vocab: [w.oferta, w.rechazar, w.convenir], note: "Aunque + indicative concedes a fact; aunque + subjunctive concedes a hypothesis." }
      - { es: "El jefe no pretende que trabajemos los fines de semana, solo da a entender que el plazo es corto.", en: "The boss doesn't intend for us to work at weekends; he's only implying that the deadline is short.", grammar: [g.subjunctive-nuance], vocab: [w.pretender, w.dar-a-entender, w.plazo, w.jefe] }
      - { es: "¿Qué insinúas? ¿Que la directiva nos oculta algo?", en: "What are you insinuating? That the management is hiding something from us?", grammar: [g.subjunctive-nuance], vocab: [w.insinuar, w.directiva, w.ocultar] }
      - { es: "Se rumorea que van a cerrar la oficina de Sevilla, pero nadie lo ha confirmado.", en: "It's rumoured that they're going to close the Seville office, but nobody has confirmed it.", grammar: [g.subjunctive-nuance], vocab: [w.rumorearse, w.oficina, w.confirmar] }
      - { es: "Sería aconsejable que matizaras tus palabras en la reunión: sonaron muy duras.", en: "It would be advisable for you to qualify your words at the meeting: they sounded very harsh.", grammar: [g.subjunctive-nuance], vocab: [w.aconsejable, w.matizar, w.reunion, w.duro] }
      - { es: "Intuyo que la propuesta se descartará, aunque todos aparentan estar convencidos.", en: "I sense that the proposal will be ruled out, even though everyone appears to be convinced.", grammar: [g.subjunctive-nuance], vocab: [w.intuir, w.descartar, w.aparentar, w.convencer] }
      - { es: "La directiva sostiene que los resultados son adecuados; los empleados cuestionan esa lectura.", en: "The management maintains that the results are adequate; the employees question that reading.", grammar: [g.subjunctive-nuance], vocab: [w.sostener, w.adecuado, w.cuestionar, w.resultado, w.empleado] }
      - { es: "El cliente me dice que le envíe el presupuesto hoy.", en: "The client tells me to send him the quote today.", grammar: [g.subjunctive-nuance], vocab: [w.cliente, w.enviar, w.presupuesto], error: { wrong: "El cliente me dice que le envío el presupuesto hoy.", explain: "Here decir transmits an order, so the subordinate verb takes the subjunctive: que le envíe.", grammar: g.subjunctive-nuance }, transform: { instruction: "Turn the order into a report of what the client says he is doing", answer: "El cliente me dice que me envía el presupuesto hoy.", alt: ["El cliente dice que me envía el presupuesto hoy."] } }
    exchanges:
      - q: { es: "¿Qué ha dicho exactamente la directiva sobre el plazo?", en: "What exactly did the management say about the deadline?" }
        a: { es: "Ha dicho que es muy ajustado, pero no ha dicho que lo cambiemos.", en: "They said it's very tight, but they didn't say we should change it." }
        alt: ["Que es muy ajustado; no ha dicho que lo cambiemos."]
        grammar: [g.subjunctive-nuance]
        vocab: [w.directiva, w.plazo]
      - q: { es: "¿Hay alguien en el equipo que pueda traducir el contrato al alemán?", en: "Is there anyone on the team who can translate the contract into German?" }
        a: { es: "Que yo sepa, no; pero hay una becaria que habla alemán perfectamente.", en: "Not as far as I know; but there's an intern who speaks German perfectly." }
        alt: ["No, que yo sepa.", "Hay una becaria que habla alemán perfectamente."]
        grammar: [g.subjunctive-nuance]
        vocab: [w.traducir, w.contrato]
      - q: { es: "Luis insinúa que el error fue mío. ¿Tú qué opinas?", en: "Luis is hinting that the mistake was mine. What do you think?" }
        a: { es: "Opino que, aunque lo insinúe, no tiene pruebas; no te preocupes.", en: "I think that, even if he hints at it, he has no proof; don't worry." }
        alt: ["Aunque lo insinúe, no tiene pruebas."]
        grammar: [g.subjunctive-nuance]
        vocab: [w.insinuar, w.prueba]
      - q: { es: "¿Me recomiendas que acepte el traslado a Bilbao?", en: "Do you recommend that I accept the transfer to Bilbao?" }
        a: { es: "Te recomiendo que lo pienses bien: es una ciudad cara, aunque el sueldo sea mejor.", en: "I recommend you think it over carefully: it's an expensive city, even if the salary is better." }
        alt: ["Piénsalo bien: es una ciudad cara, aunque el sueldo sea mejor."]
        grammar: [g.subjunctive-nuance]
        vocab: [w.recomendar, w.traslado, w.sueldo]
    texts:
      - title: "Nota interna"
        es: ["La dirección informa de que la reunión del jueves se mantiene a las nueve.", "Se ruega que cada departamento envíe su informe antes del miércoles.", "Quien no pueda asistir, que avise a su responsable con antelación."]
        en: ["The management informs you that Thursday's meeting remains at nine.", "Each department is requested to send its report before Wednesday.", "Anyone who cannot attend should notify their manager in advance."]
        grammar: [g.subjunctive-nuance]
        vocab: [w.informe, w.departamento]
      - title: "Mensaje de Marta"
        es: ["Oye, el jefe dice que la propuesta está floja.", "No ha dicho que la rehagamos, pero yo lo haría.", "¿Quedamos a las cinco para revisarla juntos?"]
        en: ["Hey, the boss says the proposal is weak.", "He hasn't said we should redo it, but I would.", "Shall we meet at five to review it together?"]
        grammar: [g.subjunctive-nuance]
        vocab: [w.propuesta, w.revisar]
  - id: c1.u01.l2
    title: No es que no quiera
    teach: [g.subjunctive-nuance]
    vocab: [w.que-yo-sepa, w.indignar, w.inquietar, w.engano, w.incertidumbre, w.dolido, w.distanciarse, w.consolar]
    tip: "Negating a verb of saying, thinking or perceiving usually triggers the subjunctive (no digo que mientas), but the indicative keeps the claim alive as a quote (no dijo que venía). No es que + subjunctive corrects a wrong assumption."
    sentences:
      - { es: "No es que no quiera verte, es que esta semana no tengo ni un minuto libre.", en: "It's not that I don't want to see you, it's that this week I don't have a single free minute.", grammar: [g.subjunctive-nuance], vocab: [w.no-es-que, w.libre] }
      - { es: "Ana no dijo que viniera a la cena; dijo que lo intentaría.", en: "Ana didn't say she would come to the dinner; she said she'd try.", grammar: [g.subjunctive-nuance], vocab: [w.cena, w.intentar], note: "no dijo que viniera denies the claim itself." }
      - { es: "No dijo que venía a la cena, dijo que venía al café de después.", en: "She didn't say she was coming to the dinner, she said she was coming to the coffee afterwards.", grammar: [g.subjunctive-nuance], vocab: [w.cena, w.cafe], note: "Indicative: she did say something, just not that." }
      - { es: "Que yo sepa, Pablo nunca ha traicionado a un amigo.", en: "As far as I know, Pablo has never betrayed a friend.", grammar: [g.subjunctive-nuance], vocab: [w.que-yo-sepa, w.traicionar, w.amigo] }
      - { es: "No veo que haya ningún malentendido entre vosotros; solo veo que estáis cansados.", en: "I don't see that there's any misunderstanding between you; I only see that you're tired.", altEs: ["No veo que haya ningún malentendido entre ustedes; solo veo que están cansados."], grammar: [g.subjunctive-nuance], vocab: [w.malentendido, w.cansado] }
      - { es: "Siento que estés dolida, pero también siento que algo no me has contado.", en: "I'm sorry you're hurt, but I also sense that there's something you haven't told me.", grammar: [g.subjunctive-nuance], vocab: [w.dolido, w.contar], note: "sentir que + subjunctive = to be sorry; + indicative = to sense." }
      - { es: "¿No te indigna que finja no conocerte después de tantos años de amistad?", en: "Doesn't it outrage you that he pretends not to know you after so many years of friendship?", grammar: [g.subjunctive-nuance], vocab: [w.indignar, w.fingir, w.amistad] }
      - { es: "No es que te reproche nada; es que me inquieta tu silencio.", en: "It's not that I'm reproaching you for anything; it's that your silence worries me.", grammar: [g.subjunctive-nuance], vocab: [w.no-es-que, w.reprochar, w.inquietar, w.silencio] }
      - { es: "Mi hermana disimula, pero yo sé que le guarda rencor a su ex.", en: "My sister hides it, but I know she bears a grudge against her ex.", grammar: [g.subjunctive-nuance], vocab: [w.disimular, w.rencor, w.hermano] }
      - { es: "No creo que sea un engaño; creo que es, simplemente, un malentendido.", en: "I don't think it's a deception; I think it's simply a misunderstanding.", grammar: [g.subjunctive-nuance], vocab: [w.engano, w.malentendido] }
      - { es: "La desconfianza nació de una tontería, y la incertidumbre la hizo crecer.", en: "The distrust was born of something silly, and uncertainty made it grow.", grammar: [g.subjunctive-nuance, g.preterite-regular], vocab: [w.desconfianza, w.incertidumbre, w.tonteria, w.crecer] }
      - { es: "No niego que me haya distanciado de ellos; niego que haya sido por falta de cariño.", en: "I don't deny that I've grown apart from them; I deny that it was for lack of affection.", grammar: [g.subjunctive-nuance], vocab: [w.distanciarse, w.carino, w.negar] }
      - { es: "¡Aclaradlo de una vez y reconciliaos, que la vida es muy corta!", en: "Clear it up once and for all and make up, life is too short!", altEs: ["¡Acláralo de una vez y reconcíliate con ella, que la vida es muy corta!"], grammar: [g.subjunctive-nuance, g.imperative-vosotros], vocab: [w.aclarar, w.reconciliarse, w.vida] }
      - { es: "Lo que más me duele no es el reproche, sino que lo hiciera delante de todos.", en: "What hurts me most isn't the reproach, but that he did it in front of everyone.", grammar: [g.subjunctive-nuance], vocab: [w.reproche, w.doler] }
      - { es: "Nadie dice que seas desleal; dicen que eres demasiado fiel a quien no lo merece.", en: "Nobody is saying you're disloyal; they're saying you're too loyal to someone who doesn't deserve it.", grammar: [g.subjunctive-nuance], vocab: [w.fiel, w.lealtad, w.merecer], error: { wrong: "Nadie dice que eres desleal; dicen que seas demasiado fiel.", explain: "Negated decir takes the subjunctive (nadie dice que seas); affirmative decir reporting a fact takes the indicative (dicen que eres).", grammar: g.subjunctive-nuance } }
      - { es: "No quiero verte porque estoy enfadada.", en: "I don't want to see you because I'm angry.", grammar: [g.subjunctive-nuance], vocab: [w.enfadado, w.ver], transform: { instruction: "Deny that assumption with no es que… es que… and say you are tired", answer: "No es que no quiera verte, es que estoy cansada.", alt: ["No es que no quiera verte; es que estoy cansada."] } }
    exchanges:
      - q: { es: "¿Por qué no has venido a mi cumpleaños? ¿Ya no te importo?", en: "Why didn't you come to my birthday? Don't I matter to you any more?" }
        a: { es: "No es que no me importes, es que me enteré tarde; nadie me avisó.", en: "It's not that you don't matter to me, it's that I found out late; nobody told me." }
        alt: ["No es que no me importes; me enteré tarde."]
        grammar: [g.subjunctive-nuance]
        vocab: [w.no-es-que, w.cumpleanos]
      - q: { es: "¿Sabes si Carla sigue enfadada conmigo?", en: "Do you know if Carla is still angry with me?" }
        a: { es: "Que yo sepa, no; pero no te digo que la llames hoy, dale un día más.", en: "Not as far as I know; but I'm not telling you to call her today, give her one more day." }
        alt: ["Que yo sepa, ya no está enfadada."]
        grammar: [g.subjunctive-nuance]
        vocab: [w.que-yo-sepa, w.enfadado]
      - q: { es: "Dijo que me perdonaba, ¿no?", en: "She said she forgave me, didn't she?" }
        a: { es: "No dijo que te perdonara; dijo que necesitaba tiempo, que no es lo mismo.", en: "She didn't say she forgave you; she said she needed time, which isn't the same thing." }
        alt: ["No, dijo que necesitaba tiempo."]
        grammar: [g.subjunctive-nuance]
        vocab: [w.perdonar, w.tiempo]
      - q: { es: "¿Crees que Jorge finge estar bien?", en: "Do you think Jorge is pretending to be fine?" }
        a: { es: "No creo que finja; creo que disimula para no preocuparnos, que es distinto.", en: "I don't think he's pretending; I think he's playing it down so as not to worry us, which is different." }
        alt: ["Creo que disimula para no preocuparnos."]
        grammar: [g.subjunctive-nuance]
        vocab: [w.fingir, w.disimular]
      - q: { es: "Me siento traicionada por mi mejor amiga. ¿Qué hago?", en: "I feel betrayed by my best friend. What do I do?" }
        a: { es: "Habla con ella antes de que el rencor crezca; tal vez haya un malentendido.", en: "Talk to her before the resentment grows; maybe there's a misunderstanding." }
        alt: ["Habla con ella; tal vez haya un malentendido."]
        grammar: [g.subjunctive-nuance]
        vocab: [w.traicionar, w.rencor, w.malentendido]
    texts:
      - title: "Mensaje de voz transcrito"
        es: ["Hola, soy yo.", "No es que esté enfadado, es que me dolió que no me contaras lo de tu nuevo trabajo.", "Que yo sepa, siempre nos lo hemos contado todo.", "Llámame cuando quieras, de verdad."]
        en: ["Hi, it's me.", "It's not that I'm angry, it's that it hurt me that you didn't tell me about your new job.", "As far as I know, we've always told each other everything.", "Call me whenever you want, honestly."]
        grammar: [g.subjunctive-nuance]
        vocab: [w.no-es-que, w.que-yo-sepa]
  - id: c1.u01.l3
    title: Sea quien sea
    teach: [g.subjunctive-relative-advanced]
    vocab: [w.quienquiera, w.dondequiera, w.sea-como-sea, w.cueste-lo-que-cueste, w.pase-lo-que-pase, w.digan-lo-que-digan, w.sea-quien-sea, w.sensatez, w.obstaculo, w.perseverar, w.a-toda-costa, w.carecer, w.carencia, w.plazo-de-entrega, w.jurado, w.critico, w.concurso, w.talento, w.admirar, w.alejarse, w.calma]
    tip: "Generalising relatives (whoever, whatever, wherever) take the subjunctive: el que llegue, cualquiera que sea, lo que te parezca. Reduplicative forms repeat the verb: sea quien sea, cueste lo que cueste."
    sentences:
      - { es: "Quienquiera que haya filtrado la noticia tendrá que dar explicaciones.", en: "Whoever leaked the news will have to give explanations.", altEs: ["Quien haya filtrado la noticia tendrá que dar explicaciones."], grammar: [g.subjunctive-relative-advanced], vocab: [w.quienquiera, w.noticia, w.explicacion] }
      - { es: "Cualquiera que sea el resultado del concurso, el jurado lo anunciará mañana.", en: "Whatever the result of the competition may be, the jury will announce it tomorrow.", grammar: [g.subjunctive-relative-advanced], vocab: [w.cualquiera, w.resultado, w.jurado, w.concurso] }
      - { es: "El aspirante que presente la mejor candidatura se llevará la beca.", en: "The applicant who submits the best application will get the scholarship.", grammar: [g.subjunctive-relative-advanced], vocab: [w.aspirante, w.candidatura, w.beca] }
      - { es: "Haz lo que te parezca más sensato; sea como sea, yo te apoyaré.", en: "Do whatever seems most sensible to you; be that as it may, I'll support you.", grammar: [g.subjunctive-relative-advanced], vocab: [w.sea-como-sea, w.sensato, w.apoyar] }
      - { es: "Vive donde quieras, pero no te alejes de la gente que te quiere.", en: "Live wherever you want, but don't move away from the people who love you.", altEs: ["Vive dondequiera que quieras, pero no te alejes de la gente que te quiere."], grammar: [g.subjunctive-relative-advanced], vocab: [w.dondequiera, w.alejarse, w.gente] }
      - { es: "Cueste lo que cueste, terminaremos el proyecto dentro del plazo de entrega.", en: "Whatever it takes, we'll finish the project within the deadline.", grammar: [g.subjunctive-relative-advanced], vocab: [w.cueste-lo-que-cueste, w.plazo-de-entrega, w.proyecto] }
      - { es: "Sea quien sea el nuevo director, tendrá que superar los mismos obstáculos que la anterior.", en: "Whoever the new director is, he'll have to overcome the same obstacles as the previous one.", grammar: [g.subjunctive-relative-advanced], vocab: [w.sea-quien-sea, w.obstaculo, w.superar, w.director] }
      - { es: "Digan lo que digan los críticos, es la mejor novela que se haya publicado este año.", en: "Whatever the critics say, it's the best novel to have been published this year.", grammar: [g.subjunctive-relative-advanced], vocab: [w.digan-lo-que-digan, w.critico, w.novela, w.publicar], note: "Superlative + que haya: the speaker admits uncertainty." }
      - { es: "Es la mejor novela que he leído este año; la terminé anoche.", en: "It's the best novel I've read this year; I finished it last night.", grammar: [g.subjunctive-relative-advanced], vocab: [w.novela, w.leer, w.terminar], note: "Indicative: a fact about the speaker's own reading." }
      - { es: "Pase lo que pase en la entrevista, no pierdas la sensatez ni la calma.", en: "Whatever happens at the interview, don't lose your good sense or your calm.", grammar: [g.subjunctive-relative-advanced], vocab: [w.pase-lo-que-pase, w.sensatez, w.calma, w.entrevista] }
      - { es: "Quien persevere, aunque carezca de talento, llegará más lejos que el ambicioso que se rinde.", en: "Whoever perseveres, even if they lack talent, will get further than the ambitious person who gives up.", grammar: [g.subjunctive-relative-advanced], vocab: [w.perseverar, w.carecer, w.talento, w.ambicioso, w.rendirse] }
      - { es: "No admiro los logros conseguidos a toda costa; admiro el mérito del que lo intenta.", en: "I don't admire achievements won at all costs; I admire the merit of the one who tries.", grammar: [g.subjunctive-relative-advanced], vocab: [w.logro, w.a-toda-costa, w.merito, w.admirar] }
      - { es: "Venga de donde venga la crítica, escúchala; luego decide tú.", en: "Wherever the criticism comes from, listen to it; then decide for yourself.", grammar: [g.subjunctive-relative-advanced], vocab: [w.critica, w.escuchar, w.decidir] }
      - { es: "¿Hay alguna carencia en mi candidatura que deba corregir antes del lunes?", en: "Is there any shortcoming in my application that I should correct before Monday?", grammar: [g.subjunctive-relative-advanced], vocab: [w.carencia, w.candidatura] }
      - { es: "El que llegue primero, que encienda las luces y prepare la sala.", en: "Whoever arrives first should switch on the lights and prepare the room.", grammar: [g.subjunctive-relative-advanced], vocab: [w.llegar, w.encender], error: { wrong: "El que llega primero, que encienda las luces y prepare la sala.", explain: "The person is not identified yet (whoever arrives first), so the relative clause takes the subjunctive: el que llegue.", grammar: g.subjunctive-relative-advanced } }
      - { es: "Haremos lo que decida el jurado.", en: "We'll do what the jury decides.", grammar: [g.subjunctive-relative-advanced], vocab: [w.jurado, w.decidir], transform: { instruction: "Make it a reduplicative 'whatever it decides' with decidir", answer: "Haremos lo que decida el jurado, decida lo que decida.", alt: ["Decida lo que decida el jurado, lo haremos."] } }
    exchanges:
      - q: { es: "¿A quién le damos el premio si hay un empate?", en: "Who do we give the prize to if there's a tie?" }
        a: { es: "A quien el jurado considere más original; sea quien sea, habrá que explicarlo bien.", en: "To whoever the jury considers most original; whoever it is, we'll have to explain it well." }
        alt: ["A quien el jurado considere más original."]
        grammar: [g.subjunctive-relative-advanced]
        vocab: [w.jurado, w.considerar, w.premio]
      - q: { es: "¿Y si los críticos destrozan la película?", en: "And what if the critics tear the film apart?" }
        a: { es: "Digan lo que digan, nosotros estamos orgullosos de ella.", en: "Whatever they say, we're proud of it." }
        alt: ["Pase lo que pase, estamos orgullosos de ella."]
        grammar: [g.subjunctive-relative-advanced]
        vocab: [w.digan-lo-que-digan, w.critico, w.orgulloso]
      - q: { es: "¿Dónde quieres que celebremos la reunión de antiguos alumnos?", en: "Where do you want us to hold the alumni reunion?" }
        a: { es: "Donde sea más cómodo para la mayoría; a mí me da igual.", en: "Wherever is most convenient for the majority; I don't mind." }
        alt: ["Donde queráis; a mí me da igual.", "Dondequiera que sea cómodo para la mayoría."]
        grammar: [g.subjunctive-relative-advanced]
        vocab: [w.dondequiera, w.mayoria]
      - q: { es: "¿Vas a presentar tu candidatura aunque te falte experiencia?", en: "Are you going to put in your application even though you lack experience?" }
        a: { es: "Sí, cueste lo que cueste; el que no lo intenta ya ha perdido.", en: "Yes, whatever it takes; whoever doesn't try has already lost." }
        alt: ["Sí, cueste lo que cueste."]
        grammar: [g.subjunctive-relative-advanced]
        vocab: [w.candidatura, w.cueste-lo-que-cueste, w.experiencia]
    texts:
      - title: "Bases del concurso"
        es: ["Podrá participar cualquier persona que resida en España y sea mayor de dieciocho años.", "Quienquiera que presente más de un relato quedará descalificado.", "El jurado premiará el texto que mejor combine originalidad y sensatez narrativa.", "Sea cual sea su decisión, será inapelable."]
        en: ["Anyone who lives in Spain and is over eighteen may take part.", "Whoever submits more than one story will be disqualified.", "The jury will reward the text that best combines originality and narrative good sense.", "Whatever its decision may be, it will be final."]
        grammar: [g.subjunctive-relative-advanced]
        vocab: [w.quienquiera, w.jurado, w.sensatez]
      - title: "Cartel en la cocina de la oficina"
        es: ["El que use la cafetera, que la limpie.", "Quien termine la leche, que compre más.", "Pase lo que pase, la cocina se cierra a las ocho."]
        en: ["Whoever uses the coffee maker should clean it.", "Whoever finishes the milk should buy more.", "Whatever happens, the kitchen closes at eight."]
        grammar: [g.subjunctive-relative-advanced]
        vocab: [w.pase-lo-que-pase]
  - id: c1.u01.l4
    title: El hecho de que
    teach: [g.el-hecho-de-que]
    vocab: [w.lo-de-que, w.significativo, w.relevante, w.alarmante, w.llamativo, w.natalidad, w.participacion, w.abstencion, w.perjudicial, w.beneficiar, w.implicar, w.conllevar, w.indicio, w.indiferencia, w.voto, w.votante, w.promesa, w.incumplir, w.transparencia, w.dudoso, w.significar]
    tip: "A clause can be the subject of a sentence: El hecho de que + subjunctive (default), Que + subjunctive, El que + subjunctive. Eso de que / lo de que introduce a claim you distance yourself from and takes the indicative."
    sentences:
      - { es: "El hecho de que la natalidad siga bajando es un indicio alarmante para las pensiones.", en: "The fact that the birth rate keeps falling is an alarming sign for pensions.", grammar: [g.el-hecho-de-que], vocab: [w.el-hecho-de-que, w.natalidad, w.indicio, w.alarmante, w.pension] }
      - { es: "Que la mitad de los votantes se quedara en casa dice mucho sobre la indiferencia de la ciudadanía.", en: "The fact that half of the voters stayed at home says a lot about the citizens' indifference.", grammar: [g.el-hecho-de-que], vocab: [w.votante, w.indiferencia, w.ciudadania, w.mitad] }
      - { es: "El que el Gobierno haya incumplido su promesa no sorprende a nadie, por desgracia.", en: "The government having broken its promise surprises nobody, unfortunately.", grammar: [g.el-hecho-de-que], vocab: [w.incumplir, w.promesa, w.gobierno] }
      - { es: "Eso de que los jóvenes no se interesan por la política no es cierto; participan de otra manera.", en: "That idea that young people aren't interested in politics isn't true; they take part in a different way.", grammar: [g.el-hecho-de-que], vocab: [w.politico, w.participar, w.joven], note: "eso de que + indicative: a claim quoted to be rejected." }
      - { es: "Lo de que el escándalo de corrupción no afectará al partido me parece muy dudoso.", en: "The claim that the corruption scandal won't affect the party seems very doubtful to me.", grammar: [g.el-hecho-de-que], vocab: [w.lo-de-que, w.escandalo, w.corrupcion, w.partido, w.dudoso] }
      - { es: "¿No te resulta llamativo que la abstención sea mayor en las ciudades que en los pueblos?", en: "Don't you find it striking that abstention is higher in the cities than in the villages?", grammar: [g.el-hecho-de-que], vocab: [w.llamativo, w.abstencion, w.resultar, w.ciudad, w.pueblo] }
      - { es: "El hecho de que lo diga un ministro no lo convierte en verdad.", en: "The fact that a minister says it doesn't make it true.", altEs: ["Que lo diga un ministro no lo convierte en verdad."], grammar: [g.el-hecho-de-que], vocab: [w.el-hecho-de-que, w.ministro, w.verdad] }
      - { es: "Votar es un derecho, pero también implica informarse; la democracia conlleva esfuerzo.", en: "Voting is a right, but it also implies keeping informed; democracy entails effort.", grammar: [g.el-hecho-de-que], vocab: [w.votar, w.implicar, w.conllevar, w.democracia, w.esfuerzo, w.derecho], note: "Infinitive as subject: Votar es un derecho." }
      - { es: "Que haya más transparencia beneficia a todos; que haya menos solo perjudica a la ciudadanía.", en: "There being more transparency benefits everyone; there being less only harms the citizens.", grammar: [g.el-hecho-de-que], vocab: [w.transparencia, w.beneficiar, w.perjudicar, w.ciudadania] }
      - { es: "El envejecimiento de la población es un dato relevante, no una opinión.", en: "The ageing of the population is a relevant fact, not an opinion.", grammar: [g.el-hecho-de-que], vocab: [w.envejecimiento, w.poblacion, w.relevante, w.dato] }
      - { es: "Es significativo que ningún candidato haya mencionado el medio ambiente en su discurso.", en: "It's significant that no candidate has mentioned the environment in their speech.", grammar: [g.el-hecho-de-que, g.subjunctive-impersonal], vocab: [w.significativo, w.candidato, w.discurso, w.medio-ambiente, w.mencionar] }
      - { es: "El hecho de que la participación aumentara un diez por ciento se debe, sobre todo, al voto joven.", en: "The fact that turnout rose by ten percent is due, above all, to the youth vote.", grammar: [g.el-hecho-de-que], vocab: [w.el-hecho-de-que, w.participacion, w.aumentar, w.voto] }
      - { es: "¡Que nadie proteste por algo tan perjudicial es lo que más me indigna!", en: "That nobody protests about something so harmful is what outrages me most!", grammar: [g.el-hecho-de-que], vocab: [w.protestar, w.perjudicial, w.indignar] }
      - { es: "El hecho de que la ley sea nueva no significa que sea mejor.", en: "The fact that the law is new doesn't mean it's better.", grammar: [g.el-hecho-de-que], vocab: [w.el-hecho-de-que, w.ley, w.significar], error: { wrong: "El hecho de que la ley es nueva no significa que sea mejor.", explain: "El hecho de que normally takes the subjunctive (sea), because the fact is presented as a topic, not as new information.", grammar: g.el-hecho-de-que } }
      - { es: "Ha subido la abstención y eso me preocupa.", en: "Abstention has risen and that worries me.", grammar: [g.el-hecho-de-que], vocab: [w.abstencion, w.subir, w.preocuparse], transform: { instruction: "Rewrite with el hecho de que as the subject", answer: "El hecho de que haya subido la abstención me preocupa.", alt: ["Que haya subido la abstención me preocupa.", "El que haya subido la abstención me preocupa."] } }
      - { es: "Lo de que nunca llueve en Almería es una exageración.", en: "That business about it never raining in Almería is an exaggeration.", grammar: [g.el-hecho-de-que], vocab: [w.lo-de-que, w.llover] }
    exchanges:
      - q: { es: "¿Te parece grave que la abstención haya llegado al cuarenta por ciento?", en: "Do you think it's serious that abstention has reached forty percent?" }
        a: { es: "Gravísimo; el hecho de que tanta gente no vote debilita la democracia.", en: "Extremely serious; the fact that so many people don't vote weakens democracy." }
        alt: ["Sí, que tanta gente no vote debilita la democracia."]
        grammar: [g.el-hecho-de-que]
        vocab: [w.abstencion, w.el-hecho-de-que, w.democracia]
      - q: { es: "Dicen que el escándalo no va a tener consecuencias. ¿Tú qué crees?", en: "They say the scandal won't have any consequences. What do you think?" }
        a: { es: "Lo de que no va a tener consecuencias ya lo veremos; el hecho de que se hable tanto de él ya es una.", en: "That claim that it won't have consequences, we'll see; the fact that people talk about it so much is already one." }
        alt: ["Eso de que no va a tener consecuencias no me lo creo."]
        grammar: [g.el-hecho-de-que]
        vocab: [w.lo-de-que, w.escandalo, w.consecuencia]
      - q: { es: "¿Qué dato del informe te ha parecido más llamativo?", en: "Which fact from the report struck you most?" }
        a: { es: "Que la natalidad haya bajado por quinto año consecutivo.", en: "That the birth rate has fallen for the fifth year in a row." }
        alt: ["El hecho de que la natalidad haya bajado otra vez."]
        grammar: [g.el-hecho-de-que]
        vocab: [w.llamativo, w.natalidad]
      - q: { es: "¿Cambia algo que el ministro haya pedido perdón?", en: "Does it change anything that the minister has apologised?" }
        a: { es: "Que haya pedido perdón está bien, pero no basta: tiene que dimitir.", en: "Him apologising is fine, but it's not enough: he has to resign." }
        alt: ["No basta: tiene que dimitir."]
        grammar: [g.el-hecho-de-que]
        vocab: [w.ministro, w.dimitir]
    texts:
      - title: "Titular y entradilla"
        es: ["La participación sube por primera vez en diez años.", "El hecho de que casi dos millones de jóvenes votaran por primera vez explica gran parte del aumento.", "Los expertos señalan, sin embargo, que la abstención sigue siendo alarmante en los barrios más pobres."]
        en: ["Turnout rises for the first time in ten years.", "The fact that almost two million young people voted for the first time explains a large part of the increase.", "Experts point out, however, that abstention remains alarming in the poorest neighbourhoods."]
        grammar: [g.el-hecho-de-que]
        vocab: [w.participacion, w.el-hecho-de-que, w.senalar, w.abstencion]
      - title: "Comentario en un foro"
        es: ["Eso de que todos los políticos son iguales es una excusa para no votar.", "Que haya corrupción en un partido no implica que la haya en todos.", "El que no participe luego no tiene derecho a quejarse."]
        en: ["That idea that all politicians are the same is an excuse not to vote.", "There being corruption in one party doesn't imply there is in all of them.", "Whoever doesn't take part has no right to complain afterwards."]
        grammar: [g.el-hecho-de-que, g.subjunctive-relative-advanced]
        vocab: [w.corrupcion, w.implicar, w.participar]
dialogues:
  - id: c1.u01.d1
    title: Lo que dijo la directiva
    context: Two colleagues, Elena and Raúl, try to interpret an ambiguous message from the management about a possible office closure.
    lines:
      - { speaker: Elena, es: "¿Has leído el correo de la directiva? Dice que la oficina de Sevilla «se encuentra en revisión».", en: "Have you read the management's email? It says the Seville office 'is under review'." }
      - { speaker: Raúl, es: "Lo he leído tres veces. No dice que la cierren, pero tampoco dice que la mantengan.", en: "I've read it three times. It doesn't say they're closing it, but it doesn't say they're keeping it either." }
      - { speaker: Elena, es: "Da a entender que habrá cambios. Que yo sepa, nadie de Sevilla ha sido informado.", en: "It implies there will be changes. As far as I know, nobody in Seville has been informed." }
      - { speaker: Raúl, es: "Se rumorea que buscan a alguien que dirija una oficina nueva en Málaga.", en: "It's rumoured they're looking for someone to run a new office in Malaga." }
      - { speaker: Elena, es: "¿Alguien que dirija o alguien que ya dirige? No es lo mismo.", en: "Someone to run it or someone who already runs it? It's not the same thing." }
      - { speaker: Raúl, es: "Alguien que dirija: todavía no hay nadie. Sea quien sea, lo sabremos pronto.", en: "Someone to run it: there's nobody yet. Whoever it is, we'll know soon." }
      - { speaker: Elena, es: "El hecho de que no nos lo cuenten directamente me indigna, la verdad.", en: "The fact that they don't tell us directly outrages me, honestly." }
      - { speaker: Raúl, es: "No es que quieran ocultarlo; es que la decisión no está tomada. Aunque sea frustrante, hay que esperar.", en: "It's not that they want to hide it; it's that the decision hasn't been made. However frustrating it is, we have to wait." }
      - { speaker: Elena, es: "Pase lo que pase, yo voy a preguntar en la reunión del jueves. Digan lo que digan, tenemos derecho a saberlo.", en: "Whatever happens, I'm going to ask at Thursday's meeting. Whatever they say, we have a right to know." }
      - { speaker: Raúl, es: "Hazlo, pero matiza las palabras: sugiere que nos informen, no exijas que lo hagan.", en: "Do it, but choose your words carefully: suggest that they inform us, don't demand that they do." }
    questions:
      - { q: "What does the management's email actually say about the Seville office?", options: ["That it will close in March", "That it is under review", "That it is moving to Malaga"], answer: 1 }
      - { q: "Why does Elena stress 'alguien que dirija' versus 'alguien que ya dirige'?", options: ["The subjunctive shows the person has not been found yet", "The indicative is more polite", "Both mean exactly the same"], answer: 0 }
      - { q: "What does Raúl advise Elena to do at the meeting?", options: ["Stay silent", "Demand an immediate answer", "Suggest rather than demand that they inform the staff"], answer: 2 }
