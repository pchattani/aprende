id: b2.u01
title: 原來係噉㗎
lessons:
  - id: b2.u01.l1
    title: 佢話佢唔嚟喎
    teach: [g.wo5-hearsay]
    vocab: [w.wo3, w.cyun4-man4, w.baat3-gwaa3, w.gong2-si6-fei1, w.si6-fei1, w.tung1-zi1, w.tung1-gou3, w.gou3-si6, w.gong2-ming4, w.zi1-seon3, w.siu1-sik1-ling4-tung1, w.zan1-ding6-gaa2, w.kei4-zung1, w.gam3-ngaam1, w.hoi2-dou6, w.fong4, w.mei5-baan1, w.zaam6-ting4, w.paau3-toi4, w.aa3-fan1, w.gok3-wai2, w.sing4-haak3, w.zyu3-ji3, w.ok3-lyut3, w.zeon6-faai3]
    tip: "喎 with a low rising tone (wo5) at the very end passes on what someone else said: 佢話唔嚟喎 'he says he isn't coming'."
    sentences:
      - { es: "天文台話聽日會打風喎。", en: "The Observatory says there'll be a typhoon tomorrow.", altEs: ["天文台話聽日打風喎。", "聽講聽日會打風喎。"], altEn: ["The Observatory says a typhoon is coming tomorrow."], grammar: [g.wo5-hearsay], vocab: [w.wo3], jp: "tin1 man4 toi4 waa6 ting1 jat6 wui5 daa2 fung1 wo5" }
      - { es: "纜車今日暫停。", en: "The cable car is suspended today.", altEs: ["今日纜車暫停。"], grammar: [g.wo5-hearsay], vocab: [w.wo3], transform: { instruction: "Pass it on as something the staff said (職員話…喎)", answer: "職員話纜車今日暫停喎。", alt: ["職員話今日纜車暫停喎。"], en: "The staff say the cable car is suspended today." } }
      - { es: "佢話佢喺東涌站等我哋喎。", en: "He says he's waiting for us at Tung Chung station.", altEs: ["佢話喺東涌站等我哋喎。"], altEn: ["She says she's waiting for us at Tung Chung station."], grammar: [g.wo5-hearsay], vocab: [w.wo3], jp: "keoi5 waa6 keoi5 hai2 dung1 cung1 zaam6 dang2 ngo5 dei6 wo5" }
      - { es: "聽講東涌炮台以前係用嚟防海盜嘅喎。", en: "Apparently Tung Chung Fort used to be for keeping pirates away.", altEs: ["聽講東涌炮台以前用嚟防海盜嘅喎。"], altEn: ["They say Tung Chung Fort was once used to guard against pirates."], grammar: [g.wo5-hearsay], vocab: [w.wo3, w.paau3-toi4, w.hoi2-dou6], jp: "teng1 gong2 dung1 cung1 paau3 toi4 ji5 cin4 hai6 jung6 lai4 fong4 hoi2 dou6 ge3 wo5" }
      - { es: "通告話今晚十點之後冇船喎。", en: "The notice says there are no boats after ten tonight.", altEs: ["張通告話今晚十點之後冇船喎。"], grammar: [g.wo5-hearsay], vocab: [w.tung1-gou3], jp: "tung1 gou3 waa6 gam1 maan5 sap6 dim2 zi1 hau6 mou5 syun4 wo5" }
      - { es: "告示話呢度唔准食嘢喎。", en: "The sign says no eating here.", altEs: ["個告示話呢度唔准食嘢喎。", "告示話呢度唔可以食嘢喎。"], altEn: ["The sign says you can't eat here."], grammar: [g.wo5-hearsay], vocab: [w.gou3-si6], jp: "gou3 si6 waa6 ni1 dou6 m4 zeon2 sik6 je5 wo5" }
      - { es: "經理叫你即刻覆佢電話喎。", en: "The manager wants you to call him back right away.", altEs: ["經理叫你即刻覆電話喎。"], altEn: ["The manager says to call him back straight away."], grammar: [g.wo5-hearsay], vocab: [w.wo3], jp: "ging1 lei5 giu3 nei5 zik1 hak1 fuk1 keoi5 din6 waa2 wo5" }
      - { es: "佢今晚唔嚟，要加班。", en: "He isn't coming tonight, he has to work late.", altEs: ["佢今晚唔嚟呀，要加班。"], altEn: ["She isn't coming tonight, she has to work overtime."], grammar: [g.wo5-hearsay], vocab: [w.wo3], transform: { instruction: "Make it something he told you (佢話…喎)", answer: "佢話佢今晚唔嚟喎，要加班。", alt: ["佢話今晚唔嚟喎，要加班。"], en: "He says he isn't coming tonight, he has to work late." } }
      - { es: "公司通知我哋聽日唔使返工喎。", en: "The company has told us we don't need to go to work tomorrow.", altEs: ["公司通知我哋聽日唔使返工。"], altEn: ["The company says we don't have to work tomorrow."], grammar: [g.wo5-hearsay], vocab: [w.tung1-zi1], jp: "gung1 si1 tung1 zi1 ngo5 dei6 ting1 jat6 m4 sai2 faan1 gung1 wo5" }
      - { es: "佢都未講明，你唔好講是非啦。", en: "She hasn't made it clear yet, so stop gossiping.", altEs: ["佢都未講明，唔好講是非啦。"], altEn: ["He hasn't said anything clearly yet, so don't gossip."], grammar: [g.m-hou-dont], vocab: [w.gong2-ming4, w.gong2-si6-fei1] }
      - { es: "呢個傳聞，真定假㗎？", en: "This rumour — is it true or not?", altEs: ["呢個傳聞係真定假㗎？", "呢個傳聞真定假？"], altEn: ["Is this rumour true or false?"], grammar: [g.gaa3-explaining], vocab: [w.cyun4-man4, w.zan1-ding6-gaa2] }
      - { es: "我哋其中一個朋友話佢以前喺東涌住喎。", en: "One of our friends says he used to live in Tung Chung.", altEs: ["其中一個朋友話佢以前喺東涌住喎。"], altEn: ["One of our friends says she used to live in Tung Chung."], grammar: [g.wo5-hearsay], vocab: [w.kei4-zung1], jp: "ngo5 dei6 kei4 zung1 jat1 go3 pang4 jau5 waa6 keoi5 ji5 cin4 hai2 dung1 cung1 zyu6 wo5" }
      - { es: "咁啱佢都喺東涌，佢話一陣同我哋一齊上昂坪喎。", en: "As it happens he's in Tung Chung too; he says he'll go up to Ngong Ping with us in a bit.", altEs: ["咁啱佢都喺東涌，佢話等陣同我哋一齊上昂坪喎。"], altEn: ["She happens to be in Tung Chung too; she says she'll come up to Ngong Ping with us later."], grammar: [g.wo5-hearsay], vocab: [w.gam3-ngaam1], jp: "gam3 ngaam1 keoi5 dou1 hai2 dung1 cung1 keoi5 waa6 jat1 zan6 tung4 ngo5 dei6 jat1 cai4 soeng5 ngong4 ping4 wo5" }
      - { es: "阿姨好消息靈通，佢話尾班纜車六點喎。", en: "Auntie is always well informed; she says the last cable car is at six.", altEs: ["阿姨消息好靈通，佢話尾班纜車六點喎。"], grammar: [g.wo5-hearsay], vocab: [w.siu1-sik1-ling4-tung1], jp: "aa3 ji1 hou2 siu1 sik1 ling4 tung1 keoi5 waa6 mei5 baan1 laam6 ce1 luk6 dim2 wo5" }
      - { es: "佢話喎今晚唔嚟。", en: "He says he's not coming tonight.", altEs: ["佢話今晚唔嚟喎。"], grammar: [g.wo5-hearsay], vocab: [w.wo3], error: { wrong: "佢話喎今晚唔嚟。", explain: "Hearsay 喎 goes at the very end of the sentence: 佢話今晚唔嚟喎.", grammar: g.wo5-hearsay }, jp: "keoi5 waa6 wo5 gam1 maan5 m4 lai4" }
      - { es: "網上啲資訊唔一定啱，佢話自己問職員好啲喎。", en: "Online information isn't always right; he says it's better to ask the staff yourself.", altEs: ["網上嘅資訊唔一定啱，佢話自己問職員好啲喎。"], grammar: [g.wo5-hearsay], vocab: [w.zi1-seon3], jp: "mong5 soeng6 di1 zi1 seon3 m4 jat1 ding6 ngaam1 keoi5 waa6 zi6 gei2 man6 zik1 jyun4 hou2 di1 wo5" }
    exchanges:
      - q: { es: "阿明幾點到呀？", en: "What time is Ming getting here?" }
        a: { es: "佢話佢遲半個鐘喎，塞緊車。", en: "He says he'll be half an hour late; he's stuck in traffic." }
        alt: ["佢話遲啲到喎。", "佢話塞車喎，遲半個鐘。"]
        grammar: [g.wo5-hearsay]
        vocab: [w.wo3]
      - q: { es: "今日纜車開唔開呀？", en: "Is the cable car running today?" }
        a: { es: "唔開喎，通告話維修緊。", en: "Not running, apparently — the notice says it's under maintenance." }
        alt: ["職員話今日暫停喎。", "唔開呀，維修緊喎。"]
        grammar: [g.wo5-hearsay]
        vocab: [w.tung1-gou3]
      - q: { es: "你聽講咗未？阿芬要辭職喎。", en: "Have you heard? Fan is quitting, apparently." }
        a: { es: "真定假㗎？唔好講是非啦。", en: "True or false? Don't gossip." }
        alt: ["真㗎？邊個話㗎？", "唔好咁八卦啦。"]
        grammar: [g.wo5-hearsay, g.gaa3-explaining]
        vocab: [w.zan1-ding6-gaa2, w.gong2-si6-fei1]
      - q: { es: "老細有冇講幾時開會？", en: "Did the boss say when the meeting is?" }
        a: { es: "冇講明，佢話一陣再通知我哋喎。", en: "He didn't say clearly; he says he'll let us know later." }
        alt: ["佢話聽日再通知喎。", "冇呀，佢話遲啲通知喎。"]
        grammar: [g.wo5-hearsay]
        vocab: [w.gong2-ming4, w.tung1-zi1]
      - q: { es: "點解你咁清楚佢屋企啲嘢㗎？", en: "How come you know so much about her family?" }
        a: { es: "我唔係八卦呀，係佢自己話我知㗎。", en: "I'm not being nosy, she told me herself." }
        alt: ["佢自己講㗎。", "唔係我八卦，佢自己講㗎。"]
        grammar: [g.gaa3-explaining]
        vocab: [w.baat3-gwaa3]
    texts:
      - title: "WhatsApp 訊息"
        es: ["喂，阿詩話佢遲啲先到喎。", "佢話東涌站好多人，叫我哋喺纜車站等佢喎。", "仲有，天文台話晏晝會落大雨喎，記得帶遮。"]
        en: ["Hey, Sze says she'll be a bit late.", "She says Tung Chung station is packed and wants us to wait for her at the cable car station.", "Also, the Observatory says it'll pour this afternoon, remember your umbrella."]
        grammar: [g.wo5-hearsay]
        vocab: [w.wo3]
      - title: "纜車站告示"
        es: ["各位乘客請注意。", "因為天氣惡劣，纜車暫停服務。", "有新嘅資訊，我哋會盡快通知大家。"]
        en: ["Attention, all passengers.", "Because of bad weather, the cable car is suspended.", "We will let everyone know as soon as possible when there is new information."]
        grammar: [g.wo5-hearsay]
        vocab: [w.zi1-seon3, w.tung1-zi1]
    spicy:
      - { es: "我朋友話你好靚仔喎。", en: "My friend says you're really handsome.", altEs: ["我朋友話你好靚女喎。", "我個朋友話你好靚仔喎。"], altEn: ["My friend says you're really pretty."], grammar: [g.wo5-hearsay], vocab: [w.wo3], jp: "ngo5 pang4 jau5 waa6 nei5 hou2 leng3 zai2 wo5" }
      - { es: "聽講你未有女朋友喎，真定假㗎？", en: "I hear you don't have a girlfriend yet — true or false?", altEs: ["聽講你未有男朋友喎，真定假㗎？"], altEn: ["Word is you're still single — is that true?"], grammar: [g.wo5-hearsay], vocab: [w.zan1-ding6-gaa2], jp: "teng1 gong2 nei5 mei6 jau5 neoi5 pang4 jau5 wo5 zan1 ding6 gaa2 gaa3" }
      - { es: "你朋友話你成日提起我喎，係咪呀？", en: "Your friend says you talk about me all the time — is that right?", altEs: ["你個朋友話你成日提起我喎，係唔係呀？"], grammar: [g.wo5-hearsay], vocab: [w.wo3], jp: "nei5 pang4 jau5 waa6 nei5 seng4 jat6 tai4 hei2 ngo5 wo5 hai6 mai6 aa3" }
      - { es: "阿媽話你今晚可以嚟食飯喎……佢好想睇吓你係咪真係咁靚仔。", en: "Mum says you can come for dinner tonight... she really wants to see if you're as handsome as I say.", altEs: ["阿媽話你今晚可以嚟食飯喎。"], grammar: [g.wo5-hearsay], vocab: [w.wo3], jp: "aa3 maa1 waa6 nei5 gam1 maan5 ho2 ji5 lai4 sik6 faan6 wo5 keoi5 hou2 soeng2 tai2 haa5 nei5 hai6 mai6 zan1 hai6 gam3 leng3 zai2" }
      - { es: "佢話我太八卦喎，我只係想知你得唔得閒啫。", en: "He says I'm too nosy; I just want to know if you're free.", altEs: ["佢話我好八卦喎，我只係想知你得唔得閒。"], grammar: [g.wo5-hearsay], vocab: [w.baat3-gwaa3], jp: "keoi5 waa6 ngo5 taai3 baat3 gwaa3 wo5 ngo5 zi2 hai6 soeng2 zi1 nei5 dak1 m4 dak1 haan4 ze1" }
  - id: b2.u01.l2
    title: 嘩，好靚喎！
    teach: [g.wo3-noticing]
    vocab: [w.hai6-wo3, w.m4-hai6-wo3, w.faat3-gok3, w.lau4-ji3, w.zyu3-ji3, w.ging2-jin4, w.geoi1-jin4, w.tai2-m4-ceot1, w.gu2-m4-dou2, w.gwo2-jin4, w.gwaai3-m4-zi1-dak1, w.gwaai3-bat1-dak1, w.hai6-gam2, w.tai4-seng2]
    tip: "Mid-level 喎 (wo3) says 'oh, I notice!' or 'mind you': 好靚喎 'oh, it's lovely!', 記住喎 'remember, now'."
    sentences:
      - { es: "嘩，呢度啲景色好靚喎！", en: "Wow, the scenery here is gorgeous!", altEs: ["嘩，呢度嘅景色好靚喎！", "嘩，呢度好靚喎！"], altEn: ["Wow, the view here is beautiful!"], grammar: [g.wo3-noticing], vocab: [w.wo3] }
      - { es: "咦，落雨喎。", en: "Oh, it's raining.", altEs: ["咦，落緊雨喎。"], altEn: ["Hey, it's raining."], grammar: [g.wo3-noticing], vocab: [w.wo3] }
      - { es: "原來你識講廣東話喎！", en: "Oh, so you speak Cantonese!", altEs: ["原來你識廣東話喎！"], grammar: [g.wo3-noticing, g.jyun-loi-turns-out], vocab: [w.wo3], error: { wrong: "原來你識講廣東話嗎！", explain: "嗎 asks a yes/no question; to say 'oh, I see that…' use 喎.", grammar: g.wo3-noticing } }
      - { es: "係喎，今日係星期日，纜車要排好耐。", en: "Oh right, it's Sunday today — there'll be a long queue for the cable car.", altEs: ["係喎，今日星期日，纜車要排好耐隊。"], grammar: [g.wo3-noticing], vocab: [w.hai6-wo3] }
      - { es: "唔係喎，纜車站喺港鐵站隔籬，唔使坐巴士。", en: "No, actually, the cable car station is next to the MTR station — no need for a bus.", altEs: ["唔係喎，纜車站就喺港鐵站隔籬，唔使搭巴士。"], grammar: [g.wo3-noticing], vocab: [w.m4-hai6-wo3] }
      - { es: "我而家先發覺，東涌原來好近機場。", en: "I've only just realised Tung Chung is really close to the airport.", altEs: ["我而家先發覺東涌好近機場。"], grammar: [g.wo3-noticing, g.jyun-loi-turns-out], vocab: [w.faat3-gok3], jp: "ngo5 ji4 gaa1 sin1 faat3 gok3 dung1 cung1 jyun4 loi4 hou2 kan5 gei1 coeng4" }
      - { es: "你有冇留意到纜車下面有條山路？", en: "Did you notice there's a mountain path under the cable car?", altEs: ["你有冇留意纜車下面有條山路？"], grammar: [g.wo3-noticing], vocab: [w.lau4-ji3] }
      - { es: "佢竟然一個人行咗上昂坪喎！", en: "He actually walked all the way up to Ngong Ping on his own!", altEs: ["佢居然一個人行咗上昂坪喎！"], altEn: ["She actually walked up to Ngong Ping by herself!"], grammar: [g.wo3-noticing], vocab: [w.ging2-jin4] }
      - { es: "睇唔出你咁鍾意行山喎。", en: "I'd never have guessed you liked hiking so much.", altEs: ["真係睇唔出你咁鍾意行山喎。"], grammar: [g.wo3-noticing], vocab: [w.tai2-m4-ceot1] }
      - { es: "估唔到東涌有咁多嘢食喎。", en: "I didn't expect Tung Chung to have so much food.", altEs: ["真係估唔到東涌有咁多嘢食喎。"], altEn: ["Who knew Tung Chung had so many places to eat!"], grammar: [g.wo3-noticing], vocab: [w.gu2-m4-dou2] }
      - { es: "怪唔之得咁多人，原來今日放假。", en: "No wonder it's so crowded — it's a holiday today.", altEs: ["怪不得咁多人，原來今日放假。", "唔怪得咁多人，原來今日放假。"], grammar: [g.jyun-loi-turns-out], vocab: [w.gwaai3-m4-zi1-dak1, w.gwaai3-bat1-dak1] }
      - { es: "果然好多人排隊喎。", en: "Sure enough, there are loads of people queuing.", altEs: ["果然有好多人排隊喎。"], grammar: [g.wo3-noticing], vocab: [w.gwo2-jin4] }
      - { es: "呢度啲樓梯好斜。", en: "The steps here are steep.", altEs: ["呢度嘅樓梯好斜。"], grammar: [g.wo3-noticing], vocab: [w.zyu3-ji3], transform: { instruction: "Turn it into a warning: start with 注意 and end with 喎", answer: "注意喎，呢度啲樓梯好斜。", alt: ["注意喎，呢度嘅樓梯好斜。"], en: "Careful, the steps here are steep." } }
      - { es: "記得提醒佢帶遮喎。", en: "Remember to remind him to bring an umbrella.", altEs: ["記住提醒佢帶遮喎。"], altEn: ["Don't forget to remind her to take an umbrella."], grammar: [g.wo3-noticing], vocab: [w.tai4-seng2] }
      - { es: "居然冇人排隊喎，好彩！", en: "There's actually no queue — lucky us!", altEs: ["竟然冇人排隊喎，好彩！"], grammar: [g.wo3-noticing], vocab: [w.geoi1-jin4] }
      - { es: "原來係噉。", en: "So that's how it is.", altEs: ["原來係咁。"], altEn: ["Oh, I see."], grammar: [g.wo3-noticing], vocab: [w.hai6-gam2], transform: { instruction: "Add 喎 to show you've just realised it", answer: "原來係噉喎。", alt: ["原來係咁喎。"], en: "Oh, so that's how it is!" } }
    exchanges:
      - q: { es: "你睇吓，纜車上面可以睇到機場喎！", en: "Look, you can see the airport from the cable car!" }
        a: { es: "係喎！啱啱有架飛機起飛。", en: "Oh yes! A plane has just taken off." }
        alt: ["係喎，好清楚喎！", "嘩，真係睇到喎！"]
        grammar: [g.wo3-noticing]
        vocab: [w.hai6-wo3]
      - q: { es: "尾班纜車係七點，係咪？", en: "The last cable car is at seven, right?" }
        a: { es: "唔係喎，平日係六點。", en: "No, actually, on weekdays it's six." }
        alt: ["唔係喎，係六點。", "係呀，週末係七點。"]
        grammar: [g.wo3-noticing]
        vocab: [w.m4-hai6-wo3]
      - q: { es: "你發覺未？今日好少人喎。", en: "Have you noticed? There aren't many people today." }
        a: { es: "係喎，怪唔之得唔使排隊。", en: "True — no wonder we didn't have to queue." }
        alt: ["係喎，好彩！", "梗係啦，今日返工嘛。"]
        grammar: [g.wo3-noticing]
        vocab: [w.faat3-gok3, w.gwaai3-m4-zi1-dak1]
      - q: { es: "我啱啱見到佢喺東涌街市買餸。", en: "I just saw her buying groceries at Tung Chung market." }
        a: { es: "估唔到佢住喺東涌喎！", en: "I'd never have guessed she lived in Tung Chung!" }
        alt: ["原來佢住喺東涌喎！", "真係睇唔出喎。"]
        grammar: [g.wo3-noticing]
        vocab: [w.gu2-m4-dou2]
      - q: { es: "你知唔知點解啲樓梯咁濕？", en: "Do you know why the steps are so wet?" }
        a: { es: "啱啱落完雨，注意吓，唔好跌親喎。", en: "It's just stopped raining — watch out, don't slip." }
        alt: ["落完雨嘛，小心喎。", "小心喎，好滑。"]
        grammar: [g.wo3-noticing]
        vocab: [w.zyu3-ji3]
    texts:
      - title: "東涌一日遊"
        es: ["一出港鐵站，我就發覺纜車站好近。", "估唔到排隊嘅人咁少喎！", "坐上纜車，個海同機場都睇得好清楚，真係好靚。"]
        en: ["As soon as I came out of the MTR station, I noticed how close the cable car station was.", "I didn't expect so few people in the queue!", "On the cable car you could see the sea and the airport clearly — really beautiful."]
        grammar: [g.wo3-noticing]
        vocab: [w.faat3-gok3, w.gu2-m4-dou2]
    spicy:
      - { es: "嘩，你今日好香喎。", en: "Wow, you smell nice today.", altEs: ["嘩，你今日好香喎！"], grammar: [g.wo3-noticing], vocab: [w.wo3] }
      - { es: "估唔到你笑起上嚟咁好睇喎。", en: "I didn't expect you to look so good when you smile.", altEs: ["估唔到你笑起嚟咁好睇喎。"], grammar: [g.wo3-noticing], vocab: [w.gu2-m4-dou2] }
      - { es: "我啱啱先發覺，你個樣好似我下一個男朋友喎。", en: "I've only just noticed — you look a lot like my next boyfriend.", altEs: ["我啱啱先發覺，你個樣好似我下一個女朋友喎。"], altEn: ["I just realised you look a lot like my next girlfriend."], grammar: [g.wo3-noticing], vocab: [w.faat3-gok3], jp: "ngo5 ngaam1 ngaam1 sin1 faat3 gok3 nei5 go3 joeng2 hou2 ci5 ngo5 haa6 jat1 go3 naam4 pang4 jau5 wo3" }
      - { es: "睇唔出你咁識氹人喎，你成日都噉㗎？", en: "Who knew you were such a charmer — are you always like this?", altEs: ["睇唔出你咁識氹人喎。"], grammar: [g.wo3-noticing, g.gaa3-explaining], vocab: [w.tai2-m4-ceot1] }
      - { es: "記住喎，下次約會到你畀錢。", en: "Remember, next date it's your turn to pay.", altEs: ["記住喎，下次約會你畀錢。"], grammar: [g.wo3-noticing], vocab: [w.gei3-zyu6], jp: "gei3 zyu6 wo3 haa6 ci3 joek3 wui6 dou3 nei5 bei2 cin2" }
  - id: b2.u01.l3
    title: 呢個係規則嚟㗎
    teach: [g.gaa3-explaining]
    vocab: [w.gei3-zyu6, w.cin1-kei4, w.san1-fan2-zing3, w.zing3-gin2, w.min5-fai3, w.sau1-fai3, w.jau1-wai6, w.wui2-jyun4, w.kwai1-zak1, w.mou5-lei5-jau4, w.dim2-wui5, w.ng6-wui6, w.ng6-wui6.b, w.zoeng2-ze2, w.siu2-tung4, w.ce1-soeng1, w.hap6-zok3]
    tip: "㗎 (gaa3) = 嘅 + 呀: it explains or insists, like 'you know, you see'. 係…嚟㗎 says what something is."
    sentences:
      - { es: "坐纜車唔係免費㗎。", en: "The cable car isn't free, you know.", altEs: ["坐纜車唔係免費嘅。"], grammar: [g.gaa3-explaining], vocab: [w.min5-fai3], jp: "co5 laam6 ce1 m4 hai6 min5 fai3 gaa3", transform: { instruction: "Say the opposite: it IS free", answer: "坐纜車係免費㗎。", alt: ["坐纜車免費㗎。"], en: "The cable car is free, you know." } }
      - { es: "會員有優惠㗎，你有冇會員卡？", en: "Members get a discount, you know — do you have a membership card?", altEs: ["做會員有優惠㗎，你有冇會員卡呀？"], grammar: [g.gaa3-explaining], vocab: [w.wui2-jyun4, w.jau1-wai6], jp: "wui2 jyun4 jau5 jau1 wai6 gaa3 nei5 jau5 mou5 wui2 jyun4 kaa1" }
      - { es: "記住帶證件，買優惠飛要睇㗎。", en: "Remember to bring ID — they need to see it for discount tickets.", altEs: ["記得帶證件，買優惠飛要睇㗎。"], grammar: [g.gaa3-explaining], vocab: [w.gei3-zyu6, w.zing3-gin2], jp: "gei3 zyu6 daai3 zing3 gin2 maai5 jau1 wai6 fei1 jiu3 tai2 gaa3" }
      - { es: "長者坐纜車有優惠。", en: "Seniors get a discount on the cable car.", altEs: ["長者搭纜車有優惠。"], grammar: [g.gaa3-explaining], vocab: [w.jau1-wai6, w.zoeng2-ze2], transform: { instruction: "Add 㗎 to explain it as something the listener should know", answer: "長者坐纜車有優惠㗎。", alt: ["長者搭纜車有優惠㗎。"], en: "Seniors get a discount on the cable car, you know." } }
      - { es: "千祈唔好喺纜車入面食嘢，係規則嚟㗎。", en: "Whatever you do, don't eat inside the cable car — it's the rules.", altEs: ["千祈唔好喺纜車度食嘢，係規則嚟㗎。"], grammar: [g.gaa3-explaining], vocab: [w.cin1-kei4, w.kwai1-zak1] }
      - { es: "呢個係東涌炮台嚟㗎，差唔多有二百年歷史。", en: "This is Tung Chung Fort, you see — it's almost two hundred years old.", altEs: ["呢度係東涌炮台嚟㗎，差唔多有二百年歷史。"], grammar: [g.gaa3-explaining], vocab: [w.paau3-toi4] }
      - { es: "點會唔記得㗎？我細細個嚟過。", en: "How could I forget? I came here when I was little.", altEs: ["我點會唔記得㗎？我細細個嚟過。"], grammar: [g.gaa3-explaining], vocab: [w.dim2-wui5, w.sai3-sai3-go3], jp: "dim2 wui5 m4 gei3 dak1 gaa3 ngo5 sai3 sai3 go3 lai4 gwo3" }
      - { es: "冇理由㗎，我明明訂咗位。", en: "That can't be — I definitely booked.", altEs: ["冇理由嘅，我明明訂咗位。"], grammar: [g.gaa3-explaining], vocab: [w.mou5-lei5-jau4, w.ming4-ming4] }
      - { es: "你誤會咗喇，佢唔係我男朋友嚟㗎。", en: "You've got it wrong — he's not my boyfriend.", altEs: ["你誤會咗，佢唔係我男朋友嚟㗎。"], grammar: [g.gaa3-explaining], vocab: [w.ng6-wui6.b] }
      - { es: "呢個只係一個誤會，唔使嬲㗎。", en: "It's just a misunderstanding, no need to be angry.", altEs: ["呢個只係誤會，唔使嬲㗎。"], grammar: [g.gaa3-explaining], vocab: [w.ng6-wui6], jp: "ni1 go3 zi2 hai6 jat1 go3 ng6 wui6 m4 sai2 nau1 gaa3" }
      - { es: "呢個展覽係免費㗎，唔使買飛。", en: "This exhibition is free, you don't need a ticket.", altEs: ["呢個展覽免費㗎，唔使買飛。"], grammar: [g.gaa3-explaining], vocab: [w.min5-fai3], jp: "ni1 go3 zin2 laam5 hai6 min5 fai3 gaa3 m4 sai2 maai5 fei1" }
      - { es: "停車場點收費㗎？", en: "How does the car park charge, then?", altEs: ["個停車場點樣收費㗎？"], grammar: [g.gaa3-explaining], vocab: [w.sau1-fai3], jp: "ting4 ce1 coeng4 dim2 sau1 fai3 gaa3" }
      - { es: "記住喎，尾班纜車好早㗎。", en: "Remember, the last cable car is pretty early.", altEs: ["記得喎，尾班纜車好早㗎。"], grammar: [g.gaa3-explaining, g.wo3-noticing], vocab: [w.gei3-zyu6], jp: "gei3 zyu6 wo3 mei5 baan1 laam6 ce1 hou2 zou2 gaa3" }
      - { es: "冇身份證唔可以入去㗎。", en: "You can't go in without an ID card, you know.", altEs: ["冇身份證入唔到去㗎。"], grammar: [g.gaa3-explaining], vocab: [w.san1-fan2-zing3], jp: "mou5 san1 fan2 zing3 m4 ho2 ji5 jap6 heoi3 gaa3" }
      - { es: "呢個係會員卡嚟㗎。", en: "This is a membership card, you see.", altEs: ["呢張係會員卡嚟㗎。"], grammar: [g.gaa3-explaining], vocab: [w.wui2-jyun4], error: { wrong: "呢個係會員卡嚟。", explain: "To say what something is, use 係…嚟㗎 (or 係…嚟嘅): don't drop the final 㗎.", grammar: g.gaa3-explaining } }
    exchanges:
      - q: { es: "呢個係咩嚟㗎？", en: "What's this, then?" }
        a: { es: "係東涌炮台嘅舊大炮嚟㗎。", en: "It's an old cannon from Tung Chung Fort." }
        alt: ["係大炮嚟㗎。", "舊大炮嚟㗎。"]
        grammar: [g.gaa3-explaining]
        vocab: [w.paau3-toi4]
      - q: { es: "細路仔坐纜車使唔使錢㗎？", en: "Do kids have to pay for the cable car?" }
        a: { es: "使㗎，不過有小童優惠。", en: "They do, but there's a child discount." }
        alt: ["要錢㗎，不過平啲。", "使呀，不過有優惠。"]
        grammar: [g.gaa3-explaining]
        vocab: [w.jau1-wai6]
      - q: { es: "我可唔可以喺入面影相？", en: "Can I take photos inside?" }
        a: { es: "唔得㗎，規則係唔准影相。", en: "No, you can't — the rule is no photos." }
        alt: ["唔可以㗎。", "千祈唔好，唔准影相㗎。"]
        grammar: [g.gaa3-explaining]
        vocab: [w.kwai1-zak1]
      - q: { es: "你係咪唔鍾意我呀？", en: "Do you not like me?" }
        a: { es: "唔係呀，你誤會咗㗎。", en: "No, you've misunderstood." }
        alt: ["點會㗎？你誤會咗。", "冇理由㗎，你諗多咗。"]
        grammar: [g.gaa3-explaining]
        vocab: [w.ng6-wui6.b, w.dim2-wui5]
      - q: { es: "使唔使帶身份證？", en: "Do I need to bring my ID card?" }
        a: { es: "要㗎，記住帶埋。", en: "Yes, you do — remember to bring it." }
        alt: ["要㗎，千祈唔好唔記得。", "使㗎。"]
        grammar: [g.gaa3-explaining]
        vocab: [w.san1-fan2-zing3, w.gei3-zyu6]
    texts:
      - title: "纜車站提示"
        es: ["會員買飛有九折優惠。", "長者同小童記住帶證件。", "千祈唔好喺車廂入面食嘢，多謝合作。"]
        en: ["Members get ten per cent off tickets.", "Seniors and children, remember to bring ID.", "Please don't eat inside the cabin. Thank you for your cooperation."]
        grammar: [g.gaa3-explaining]
        vocab: [w.wui2-jyun4, w.jau1-wai6, w.zing3-gin2, w.cin1-kei4]
      - title: "阿婆嘅訊息"
        es: ["你哋唔好誤會呀，我唔係唔想去。", "我坐纜車會頭暈㗎。", "你哋去啦，我喺東涌飲茶等你哋。"]
        en: ["Don't get me wrong, it's not that I don't want to go.", "The cable car makes me dizzy, you see.", "You go ahead — I'll have dim sum in Tung Chung and wait for you."]
        grammar: [g.gaa3-explaining]
        vocab: [w.ng6-wui6.b]
    spicy:
      - { es: "我唔係成日咁主動㗎，淨係對你啫。", en: "I'm not always this forward, you know — just with you.", altEs: ["我唔係成日咁主動㗎，只係對你。"], grammar: [g.gaa3-explaining], vocab: [w.gaa3.b], jp: "ngo5 m4 hai6 seng4 jat6 gam3 zyu2 dung6 gaa3 zing6 hai6 deoi3 nei5 ze1" }
      - { es: "千祈唔好誤會，我請你飲嘢係因為我好人㗎。", en: "Don't get the wrong idea — I'm buying you a drink because I'm a nice person.", altEs: ["唔好誤會，我請你飲嘢係因為我好人㗎。"], grammar: [g.gaa3-explaining], vocab: [w.cin1-kei4, w.ng6-wui6.b], jp: "cin1 kei4 m4 hou2 ng6 wui6 ngo5 cing2 nei5 jam2 je5 hai6 jan1 wai6 ngo5 hou2 jan4 gaa3" }
      - { es: "我嘅電話號碼係免費㗎，你要唔要？", en: "My phone number is free, you know — do you want it?", altEs: ["我個電話號碼免費㗎，你要唔要？"], grammar: [g.gaa3-explaining], vocab: [w.min5-fai3], jp: "ngo5 ge3 din6 waa2 hou6 maa5 hai6 min5 fai3 gaa3 nei5 jiu3 m4 jiu3" }
      - { es: "做我嘅會員有優惠㗎：每個星期一次免費晚餐。", en: "Being my member comes with perks: one free dinner a week.", altEs: ["做我會員有優惠㗎：每個禮拜一次免費晚餐。"], grammar: [g.gaa3-explaining], vocab: [w.wui2-jyun4, w.jau1-wai6], jp: "zou6 ngo5 ge3 wui2 jyun4 jau5 jau1 wai6 gaa3 mui5 go3 sing1 kei4 jat1 ci3 min5 fai3 maan5 caan1" }
  - id: b2.u01.l4
    title: 究竟你點知㗎？
    teach: [g.gaa3-explaining]
    vocab: [w.sai3-sai3-go3, w.waa6-saai3, w.ci2-zung1, w.jau4-kei4, w.zyu2-jiu3, w.gei1-bun2-soeng6, w.si6-sat6-soeng6, w.sat6-zai3-soeng6, w.gau3-ging2, w.dou3-dai2, w.zi1-liu2, w.zi1-sik1, w.soeng4-sik1]
    tip: "Put 㗎 on a question that already has a question word: 你點知㗎？ sounds curious or surprised. 真㗎？ (gaa2) means 'really?'"
    sentences:
      - { es: "你點知㗎？", en: "How did you know?", altEs: ["你點樣知㗎？"], grammar: [g.gaa3-explaining], vocab: [w.gaa3.b], jp: "nei5 dim2 zi1 gaa3" }
      - { es: "真㗎？由東涌坐纜車上昂坪要成二十五分鐘？", en: "Really? It takes a whole twenty-five minutes from Tung Chung to Ngong Ping by cable car?", altEs: ["真㗎？由東涌搭纜車上昂坪要成二十五分鐘？"], grammar: [g.gaa3-explaining], vocab: [w.gaa3.b], jp: "zan1 gaa2 jau4 dung1 cung1 co5 laam6 ce1 soeng5 ngong4 ping4 jiu3 seng4 ji6 sap6 ng5 fan1 zung1" }
      - { es: "究竟邊個話你知㗎？", en: "Who on earth told you?", altEs: ["到底邊個話你知㗎？"], grammar: [g.gaa3-explaining], vocab: [w.gau3-ging2], jp: "gau3 ging2 bin1 go3 waa6 nei5 zi1 gaa3" }
      - { es: "到底你想去邊度㗎？", en: "Where on earth do you want to go?", altEs: ["你到底想去邊度㗎？", "究竟你想去邊度㗎？"], grammar: [g.gaa3-explaining], vocab: [w.dou3-dai2] }
      - { es: "你想去邊度？", en: "Where do you want to go?", altEs: ["你想去邊呀？"], grammar: [g.gaa3-explaining], vocab: [w.gau3-ging2], transform: { instruction: "Sound impatient: add 究竟 and 㗎", answer: "你究竟想去邊度㗎？", alt: ["究竟你想去邊度㗎？", "你到底想去邊度㗎？"], en: "Where on earth do you want to go?" } }
      - { es: "基本上好多東涌人都喺機場返工。", en: "Basically, lots of people in Tung Chung work at the airport.", altEs: ["基本上好多住東涌嘅人都喺機場返工。"], grammar: [g.gaa3-explaining], vocab: [w.gei1-bun2-soeng6] }
      - { es: "事實上，東涌以前係一條漁村嚟㗎。", en: "In fact, Tung Chung used to be a fishing village.", altEs: ["事實上東涌以前係條漁村嚟㗎。"], grammar: [g.gaa3-explaining], vocab: [w.si6-sat6-soeng6] }
      - { es: "實際上，行上昂坪要成四個鐘。", en: "Actually, walking up to Ngong Ping takes a good four hours.", altEs: ["實際上行上昂坪要差唔多四個鐘。"], grammar: [g.gaa3-explaining], vocab: [w.sat6-zai3-soeng6], jp: "sat6 zai3 soeng6 haang4 soeng5 ngong4 ping4 jiu3 seng4 sei3 go3 zung1" }
      - { es: "我尤其鍾意喺纜車上面睇海。", en: "I especially like looking at the sea from the cable car.", altEs: ["我尤其是鍾意喺纜車度睇海。"], grammar: [g.gaa3-explaining], vocab: [w.jau4-kei4], transform: { instruction: "Ask why, sounding curious: 點解…㗎？", answer: "點解你咁鍾意喺纜車上面睇海㗎？", alt: ["你點解咁鍾意喺纜車上面睇海㗎？"], en: "Why do you like looking at the sea from the cable car so much?" } }
      - { es: "我搭纜車主要係因為佢快，唔係因為佢平。", en: "I take the cable car mainly because it's fast, not because it's cheap.", altEs: ["我坐纜車主要係因為快，唔係因為平。"], grammar: [g.gaa3-explaining], vocab: [w.zyu2-jiu3] }
      - { es: "佢始終係你阿哥，你唔好咁嬲啦。", en: "He's your brother after all, don't be so angry.", altEs: ["佢始終係你哥哥，唔好咁嬲啦。"], grammar: [g.gaa3-explaining], vocab: [w.ci2-zung1] }
      - { es: "話晒你都係老師，你應該知㗎。", en: "You're a teacher after all — you ought to know.", altEs: ["你話晒都係老師，應該知㗎。"], grammar: [g.gaa3-explaining], vocab: [w.waa6-saai3], jp: "waa6 saai3 nei5 dou1 hai6 lou5 si1 nei5 jing1 goi1 zi1 gaa3" }
      - { es: "呢啲係常識嚟㗎，個個都知。", en: "That's common knowledge, everyone knows it.", altEs: ["呢啲係常識嚟㗎，人人都知。"], grammar: [g.gaa3-explaining], vocab: [w.soeng4-sik1] }
      - { es: "你啲資料係喺邊度搵㗎？", en: "Where did you find your information?", altEs: ["你啲資料喺邊度搵㗎？"], grammar: [g.gaa3-explaining], vocab: [w.zi1-liu2], jp: "nei5 di1 zi1 liu2 hai6 hai2 bin1 dou6 wan2 gaa3" }
      - { es: "佢細細個已經好多知識，乜都識。", en: "Even as a little kid he knew a lot — he knew everything.", altEs: ["佢細細個已經好有知識，乜都識。"], grammar: [g.gaa3-explaining], vocab: [w.sai3-sai3-go3, w.zi1-sik1] }
      - { es: "你係唔係香港人㗎？", en: "Are you from Hong Kong, then?", altEs: ["你係咪香港人㗎？"], grammar: [g.gaa3-explaining], vocab: [w.gaa3.b], error: { wrong: "你係香港人㗎？", explain: "㗎 doesn't make a question on its own: it needs a question word or an A-not-A form (你係唔係香港人㗎？).", grammar: g.gaa3-explaining }, jp: "nei5 hai6 m4 hai6 hoeng1 gong2 jan4 gaa3" }
    exchanges:
      - q: { es: "你係唔係香港人㗎？", en: "Are you from Hong Kong, then?" }
        a: { es: "係呀，我細細個已經住喺東涌㗎。", en: "Yes, I've lived in Tung Chung since I was little." }
        alt: ["係㗎，我喺東涌大㗎。", "唔係呀，我係英國人。"]
        grammar: [g.gaa3-explaining]
        vocab: [w.sai3-sai3-go3]
      - q: { es: "我聽講東涌炮台係一八三二年起㗎。", en: "I heard Tung Chung Fort was built in 1832." }
        a: { es: "真㗎？你啲資料喺邊度搵㗎？", en: "Really? Where did you get your information?" }
        alt: ["真㗎？你點知㗎？", "係咩？好耐喎。"]
        grammar: [g.gaa3-explaining]
        vocab: [w.zi1-liu2]
      - q: { es: "究竟你想坐纜車定坐巴士㗎？", en: "So do you want the cable car or the bus, then?" }
        a: { es: "坐纜車啦，主要係想睇風景。", en: "The cable car — mainly because I want to see the view." }
        alt: ["坐纜車啦。", "坐巴士啦，平啲。"]
        grammar: [g.gaa3-explaining]
        vocab: [w.gau3-ging2, w.zyu2-jiu3]
      - q: { es: "你鍾唔鍾意東涌？", en: "Do you like Tung Chung?" }
        a: { es: "鍾意㗎，尤其係晚黑喺海邊散步。", en: "I do — especially walking by the sea at night." }
        alt: ["幾鍾意㗎。", "鍾意，尤其係海邊。"]
        grammar: [g.gaa3-explaining]
        vocab: [w.jau4-kei4]
      - q: { es: "點解佢咁快就搵到路㗎？", en: "How come he found the way so quickly?" }
        a: { es: "佢始終係本地人嚟㗎。", en: "He's a local after all." }
        alt: ["佢係本地人嚟㗎嘛。", "話晒佢都住喺度㗎。"]
        grammar: [g.gaa3-explaining]
        vocab: [w.ci2-zung1]
    texts:
      - title: "旅遊書"
        es: ["東涌喺大嶼山北邊，以前係一條漁村。", "事實上，好多遊客唔知東涌有個炮台。", "東涌炮台基本上係免費參觀㗎。"]
        en: ["Tung Chung is on the north of Lantau and used to be a fishing village.", "In fact, many tourists don't know Tung Chung has a fort.", "Tung Chung Fort is basically free to visit."]
        grammar: [g.gaa3-explaining]
        vocab: [w.si6-sat6-soeng6, w.gei1-bun2-soeng6, w.min5-fai3]
    spicy:
      - { es: "究竟你想同我食飯，定係淨係想同我影相㗎？", en: "So do you actually want to have dinner with me, or just take photos with me?", altEs: ["你究竟想同我食飯定係淨係想同我影相㗎？"], grammar: [g.gaa3-explaining], vocab: [w.gau3-ging2], jp: "gau3 ging2 nei5 soeng2 tung4 ngo5 sik6 faan6 ding6 hai6 zing6 hai6 soeng2 tung4 ngo5 jing2 soeng2 gaa3" }
      - { es: "你點知我鍾意食雪糕㗎？你係咪成日留意我呀？", en: "How did you know I like ice cream? Have you been watching me?", altEs: ["你點知我鍾意食雪糕㗎？"], grammar: [g.gaa3-explaining], vocab: [w.lau4-ji3], jp: "nei5 dim2 zi1 ngo5 zung1 ji3 sik6 syut3 gou1 gaa3 nei5 hai6 mai6 seng4 jat6 lau4 ji3 ngo5 aa3" }
      - { es: "我主要係嚟睇風景，你只係附送嘅。", en: "I'm mainly here for the view; you're just a bonus.", altEs: ["我主要係嚟睇風景，你係附送嘅。"], grammar: [g.gaa3-explaining], vocab: [w.zyu2-jiu3] }
      - { es: "到底你幾時先肯約我㗎？", en: "When on earth are you going to ask me out?", altEs: ["你到底幾時先肯約我㗎？", "究竟你幾時先肯約我㗎？"], grammar: [g.gaa3-explaining], vocab: [w.dou3-dai2], jp: "dou3 dai2 nei5 gei2 si4 sin1 hang2 joek3 ngo5 gaa3" }
dialogues:
  - id: b2.u01.d1
    title: 東涌纜車站
    context: Ka-yan and her friend Hoi are queuing for the Ngong Ping cable car in Tung Chung on a Sunday morning.
    lines:
      - { speaker: 嘉欣, es: "嘩，排隊嘅人好多喎！", en: "Wow, there are so many people queuing!" }
      - { speaker: 阿凱, es: "梗係啦，今日星期日。職員話要等一個鐘喎。", en: "Of course, it's Sunday. The staff say there's an hour's wait." }
      - { speaker: 嘉欣, es: "一個鐘？早知坐巴士啦。", en: "An hour? We should have taken the bus." }
      - { speaker: 阿凱, es: "唔係喎，你睇吓告示，會員有快速通道㗎。", en: "No, actually — look at the sign, members get a fast lane." }
      - { speaker: 嘉欣, es: "係喎！我細細個阿媽幫我申請過會員，張卡仲喺我銀包度。", en: "Oh right! Mum signed me up as a member when I was little — the card's still in my wallet." }
      - { speaker: 阿凱, es: "真㗎？你點會帶住㗎？", en: "Really? Why on earth would you have it on you?" }
      - { speaker: 嘉欣, es: "我乜嘢卡都帶㗎。不過職員話要睇埋身份證喎。", en: "I carry every card, you know. But the staff say they need to see my ID card too." }
      - { speaker: 阿凱, es: "冇問題，我哋兩個都有帶。", en: "No problem, we've both got ours." }
      - { speaker: 嘉欣, es: "好彩！原來做會員係有用㗎。", en: "Lucky! So being a member is actually useful." }
    questions:
      - { q: "職員話要等幾耐？", options: ["半個鐘", "一個鐘", "兩個鐘"], answer: 1, explain: "阿凱 passes on what the staff said: 要等一個鐘喎 (an hour's wait)." }
      - { q: "點解佢哋唔使排一個鐘？", options: ["因為佢哋坐巴士", "因為會員有快速通道", "因為今日冇人排隊"], answer: 1, explain: "The sign says members get a fast lane (會員有快速通道), and 嘉欣 still has her card." }
      - { q: "嘉欣幾時開始做會員？", options: ["上個月", "今日", "細細個嘅時候"], answer: 2, explain: "She says 我細細個阿媽幫我申請過會員: her mum signed her up when she was little." }
      - { q: "除咗會員卡，職員仲要睇乜嘢？", options: ["身份證", "飛", "銀包"], answer: 0, explain: "職員話要睇埋身份證喎: they also need to see her ID card." }
writing:
  - task: "You're at the Tung Chung pier. Pass on two pieces of news to your family with hearsay 喎: what the notice says about the last boat, and what your friend Fan told you."
    min: 60
    max: 120
    use: [w.wo3, w.gou3-si6, w.ok3-lyut3, w.zaam6-ting4, w.zeon6-faai3]
    useAtLeast: 3
    grammar: [g.wo5-hearsay]
    expect:
      - { pattern: "喎", hint: "Pass on what others said with 喎 at the end." }
      - { pattern: "話", hint: "Say who said it: 告示話…, 阿芬話…" }
    model: { es: "碼頭個告示話因為天氣惡劣，今晚尾班船暫停喎。職員叫我哋盡快坐巴士返東涌。仲有，阿芬話佢今晚唔嚟食飯喎，佢要加班。我哋可能要遲啲先返到屋企，你哋唔使等我哋食飯。", en: "The notice at the pier says the last boat tonight is suspended because of the bad weather. The staff told us to take a bus back to Tung Chung as soon as possible. Also, Fan says she's not coming to dinner tonight; she has to work late. We might get home late, so don't wait for us for dinner." }
  - task: "You're visiting the old fort at Tung Chung. Write a message reacting to what you suddenly notice, with 喎 and words like 竟然 or 估唔到."
    min: 60
    max: 110
    use: [w.wo3, w.paau3-toi4, w.gu2-m4-dou2, w.ging2-jin4, w.hai6-wo3]
    useAtLeast: 3
    grammar: [g.wo3-noticing]
    expect:
      - { pattern: "喎", hint: "React to what you notice with 喎: 好靚喎！" }
      - { pattern: "竟然|估唔到|居然|原來|果然", hint: "Show surprise: 竟然, 估唔到…" }
    model: { es: "嘩，東涌炮台原來咁大㗎！我仲以為好細添。估唔到入面竟然有咁多遊客喎。係喎，你講得啱，呢度啲風景真係好靚喎！我哋影咗好多相，返到屋企畀你睇。下次你一定要嚟埋！", en: "Wow, the Tung Chung fort is so big! I thought it would be small. I didn't expect so many tourists inside. Oh yes, you were right: the scenery here really is beautiful! We took lots of photos; I'll show you when I get home. Next time you must come too!" }
  - task: "A visitor is upset about having to pay full fare. Explain the rule politely but firmly, using 㗎."
    min: 60
    max: 110
    use: [w.kwai1-zak1, w.zoeng2-ze2, w.jau1-wai6, w.san1-fan2-zing3, w.ng6-wui6]
    useAtLeast: 3
    grammar: [g.gaa3-explaining]
    expect:
      - { pattern: "㗎", hint: "Explain and insist with 㗎." }
    model: { es: "先生，唔好誤會，呢度嘅規則係噉㗎：長者同小童有優惠，不過一定要帶身份證㗎。如果冇證件，就要畀全部車費㗎。我哋都係照規則做嘅。如果你有身份證，我可以即刻幫你改返。", en: "Sir, please don't misunderstand. The rule here is this: seniors and children get a discount, but they must bring their ID card. Without ID you have to pay the full fare. We're just following the rules. If you have your ID card, I can change it for you right away." }
  - task: "Write a formal notice for a clubhouse in Tung Chung: members get free entry, non-members pay, and everyone must bring ID."
    min: 60
    max: 120
    use: [w.gok3-wai2, w.wui2-jyun4, w.min5-fai3, w.sau1-fai3, w.zyu3-ji3]
    useAtLeast: 4
    grammar: []
    expect:
      - { pattern: "各位|請注意|請", hint: "Address the reader formally: 各位會員請注意…" }
      - { pattern: "免費|收費", hint: "State the fees: 免費, 收費…" }
    model: { es: "各位會員請注意：由下個月開始，會員可以免費使用泳池同健身室。唔係會員嘅人每次收費五十蚊。入場嘅時候請帶身份證或者其他證件。如果有問題，可以問管理處嘅職員。多謝各位合作。", en: "Attention, members: from next month, members may use the pool and gym free of charge. Non-members will be charged fifty dollars per visit. Please bring your ID card or another identity document when entering. If you have any questions, please ask the staff at the management office. Thank you for your cooperation." }
