    model: { es: "Oi, Bia! Chegamos a Barreirinhas ontem à noite. A pousada fica pertinho do rio e é um casarão antigo, lindo! Hoje comemos um peixe delicioso com arroz e tomamos um cafezinho na praça. Amanhã a gente vai acordar cedinho para ver os Lençóis: o guia vem buscar a gente rapidinho às cinco, com um carrão enorme. Então vou dormir agora. Estou com um pouquinho de saudade de você! Um beijinho e tchauzinho! Quando eu voltar, te conto tudo com calma, prometo.", en: "Hi, Bia! We got to Barreirinhas last night. The guesthouse is really close to the river and it's a lovely big old house! Today we ate some delicious fish with rice and had a little coffee in the square. Tomorrow we're getting up nice and early to see the Lençóis: the guide is coming to pick us up at five on the dot, in a huge car. So I'm off to bed now. I'm missing you a little bit! Kisses and bye for now! When I get back I'll tell you everything at leisure, I promise." }
