    texts:
      - title: "我嘅屋企人"
        es: ["我爸爸好高，好瘦。", "我媽媽好叻，又好有耐性。", "我細佬好好笑，不過有時好惡。"]
        en: ["My dad is tall and thin.", "My mum is clever and very patient too.", "My younger brother is really funny, but sometimes he's grumpy."]
        grammar: [g.adjective-predicates]
        vocab: [w.gou1, w.sau3, w.lek1, w.noi6-sing3, w.hou2-siu3]
      - title: "Leo"
        es: ["Leo好可愛，又好得意。", "佢好肥，因為佢日日都食好多。"]
        en: ["Leo is lovely and very cute.", "He's fat, because he eats a lot every day."]
        grammar: [g.adjective-predicates]
        vocab: [w.ho2-oi3, w.dak1-ji3, w.fei4]
