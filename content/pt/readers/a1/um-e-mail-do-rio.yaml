id: r.a1.um-e-mail-do-rio
level: a1
title: Um e-mail do Rio
kind: text
intro: After three weeks in Rio, Kate writes to her friend Emily in Boston about the city and her plans for the last weekend, using ir + infinitive.
allow: [kate, emily, boston, rafa, sandra, niterói, niemeyer, maracanã, flamengo, tijuca, santa, teresa, mac]
paragraphs:
  - { es: "Oi, Emily! Tudo bem com você? Desculpa, eu não escrevo há três semanas, mas a minha vida aqui no Rio é muito corrida. Eu estudo português de manhã e passeio pela cidade à tarde. O meu português está melhor: agora eu entendo quase tudo quando as pessoas falam devagar!", en: "Hi, Emily! How are you? Sorry, I haven't written for three weeks, but my life here in Rio is very busy. I study Portuguese in the morning and go around the city in the afternoon. My Portuguese is better: now I understand almost everything when people speak slowly!" }
  - { es: "O Rio é uma cidade incrível. Tem praia, morro, floresta e muita música. Aqui é verão e faz muito calor: hoje a temperatura é de trinta e oito graus! Eu tomo muita água de coco e como açaí quase todo dia.", en: "Rio is an incredible city. It has beaches, hills, forest and lots of music. It's summer here and it's very hot: today the temperature is thirty-eight degrees! I drink lots of coconut water and eat açaí almost every day." }
  - { es: "Este fim de semana é o meu último fim de semana no Rio, e eu tenho muitos planos. No sábado de manhã, eu vou subir o Corcovado de trem com a minha professora, a Sandra. Lá em cima, eu vou ver o Cristo Redentor e a vista da cidade toda. À tarde, nós vamos pegar o bondinho do Pão de Açúcar.", en: "This weekend is my last weekend in Rio, and I have lots of plans. On Saturday morning, I'm going to go up Corcovado by train with my teacher, Sandra. Up there, I'm going to see Christ the Redeemer and the view of the whole city. In the afternoon, we're going to take the cable car up Sugarloaf Mountain." }
  - { es: "No sábado à noite, eu vou à Lapa com o Rafa e os amigos dele. Nós vamos dançar samba num bar perto dos Arcos. Eu não danço bem, mas não tem problema: os cariocas são muito simpáticos e ajudam todo mundo!", en: "On Saturday night, I'm going to Lapa with Rafa and his friends. We're going to dance samba in a bar near the Arches. I don't dance well, but it doesn't matter: people from Rio are very friendly and help everyone!" }
  - { es: "No domingo, a família do Rafa vai ao Maracanã. O Flamengo vai jogar, e o senhor Lima tem um ingresso para mim. Eu não entendo muito de futebol, mas eu quero ver o estádio. Depois do jogo, nós vamos comer churrasco para comemorar... se o Flamengo ganhar, claro!", en: "On Sunday, Rafa's family is going to the Maracanã. Flamengo are playing, and Mr Lima has a ticket for me. I don't know much about football, but I want to see the stadium. After the game, we're going to eat barbecue to celebrate... if Flamengo win, of course!" }
  - { es: "Na segunda-feira, eu volto para Boston. Eu vou sentir muita saudade do Rio, da família Lima e do Bolinha. Mas no próximo ano eu vou voltar, com certeza. E você vai comigo! Um beijo grande, Kate.", en: "On Monday, I go back to Boston. I'm going to miss Rio, the Lima family and Bolinha a lot. But next year I'm going to come back, for sure. And you're coming with me! A big kiss, Kate." }
questions:
  - { q: "Por que a Kate não escreve há três semanas?", options: ["Porque está doente", "Porque a vida dela no Rio é muito corrida", "Porque não tem internet"], answer: 1, explain: "«A minha vida aqui no Rio é muito corrida» — corrida = busy, hectic." }
  - { q: "Como a Kate vai subir o Corcovado?", options: ["De trem", "De bondinho", "A pé"], answer: 0, explain: "«Eu vou subir o Corcovado de trem.» The bondinho (cable car) is for Sugarloaf Mountain." }
  - { q: "O que a Kate vai fazer na Lapa?", options: ["Ver um jogo de futebol", "Dançar samba num bar", "Visitar um museu"], answer: 1, explain: "«Nós vamos dançar samba num bar perto dos Arcos.»" }
  - { q: "Quem tem um ingresso para o jogo do Flamengo?", options: ["O Rafa", "A Sandra", "O senhor Lima"], answer: 2, explain: "«O senhor Lima tem um ingresso para mim.»" }
  - { q: "Quando a Kate volta para Boston?", options: ["No domingo", "Na segunda-feira", "No próximo ano"], answer: 1, explain: "«Na segunda-feira, eu volto para Boston.» Next year is when she plans to come back to Rio." }
glossary:
  - { es: corrida, en: busy, hectic }
  - { es: melhor, en: better }
  - { es: incrível, en: incredible }
  - { es: churrasco, en: barbecue }
  - { es: vida, en: life }
  - { es: floresta, en: forest }
  - { es: bondinho, en: cable car }
  - { es: estádio, en: stadium }
  - { es: certeza, en: certainty (com certeza = for sure) }
