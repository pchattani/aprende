id: r.b2.beaune-c-est-ici-qu-on-vend-les-vins
level: b2
title: Beaune, c'est ici qu'on vend les vins
kind: dialogue
intro: In the courtyard of the Hospices de Beaune, a wine merchant, Bertrand, explains the history of the place and its famous charity auction to two visitors. Listen for emphasis (c'est… qui, ce qui… c'est, ce vin, je l'adore).
allow: [der, laura, marc, bertrand, rolin, guigone, salins, weyden, rogier, ok, centre]
paragraphs:
  - { es: "Bertrand : Regardez ce toit. C'est lui que tout le monde vient photographier. Ces tuiles vernissées, jaunes, rouges, vertes et noires, qui forment des motifs géométriques, on les trouve partout en Bourgogne aujourd'hui, mais c'est ici qu'elles sont les plus célèbres.", en: "Bertrand: Look at this roof. That's what everyone comes to photograph. These glazed tiles, yellow, red, green and black, forming geometric patterns – you find them all over Burgundy today, but it's here that they're most famous." }
  - { es: "Laura : C'est magnifique. Mais c'était quoi, exactement, ce bâtiment ? Un palais ?", en: "Laura: It's magnificent. But what exactly was this building? A palace?" }
  - { es: "Bertrand : Pas du tout. C'était un hôpital pour les pauvres. C'est Nicolas Rolin, le chancelier du duc de Bourgogne Philippe le Bon, qui l'a fondé en 1443, avec sa femme, Guigone de Salins. La guerre de Cent Ans venait de se terminer, et la région était ravagée par la misère et les épidémies. Ce qui est extraordinaire, c'est que l'hôpital a fonctionné jusqu'en 1971 !", en: "Bertrand: Not at all. It was a hospital for the poor. It was Nicolas Rolin, chancellor to the Duke of Burgundy Philip the Good, who founded it in 1443, with his wife, Guigone de Salins. The Hundred Years' War had just ended, and the region was ravaged by poverty and epidemics. What's extraordinary is that the hospital kept working until 1971!" }
  - { es: "Marc : Il paraît que Rolin était un homme très riche, mais pas très honnête…", en: "Marc: Apparently Rolin was a very rich man, but not very honest…" }
  - { es: "Bertrand : (sourire) C'est ce qu'on raconte, oui. Certains disent qu'il a construit l'hôpital pour se faire pardonner. Le roi Louis XI aurait dit qu'il était bien juste qu'il construise une maison pour les pauvres, après en avoir fait tant ! Quoi qu'il en soit, à l'intérieur, vous verrez la grande salle des malades, avec ses lits rouges alignés, et un chef-d'œuvre de la peinture flamande : le Jugement dernier, de Rogier van der Weyden.", en: "Bertrand: (smiling) That's what people say, yes. Some say he built the hospital to be forgiven. King Louis XI is said to have remarked that it was only right he should build a house for the poor, after making so many of them poor! Be that as it may, inside you'll see the great hall for the sick, with its rows of red beds, and a masterpiece of Flemish painting: the Last Judgement by Rogier van der Weyden." }
  - { es: "Laura : Et le vin, dans tout ça ? On nous a dit que c'est ici qu'a lieu une vente aux enchères très célèbre.", en: "Laura: And where does wine come into it? We were told that a very famous auction takes place here." }
  - { es: "Bertrand : Exactement. Au fil des siècles, de nombreuses familles ont donné des vignes aux Hospices pour aider les malades. Aujourd'hui, les Hospices possèdent une soixantaine d'hectares de vignes, parmi les meilleures de la région. Chaque année, depuis 1859, le troisième dimanche de novembre, le vin de l'année est vendu aux enchères. C'est l'une des ventes de charité les plus célèbres du monde. L'argent, c'est à l'hôpital et à des œuvres caritatives qu'il revient.", en: "Bertrand: Exactly. Over the centuries many families gave vineyards to the Hospices to help the sick. Today the Hospices own about sixty hectares of vines, among the best in the region. Every year since 1859, on the third Sunday in November, the year's wine has been sold at auction. It's one of the most famous charity auctions in the world. The money goes to the hospital and to charities." }
  - { es: "Marc : Et vous, vous y participez ?", en: "Marc: And do you take part?" }
  - { es: "Bertrand : Bien sûr. Les acheteurs, ce sont surtout des négociants comme moi, mais aussi des collectionneurs du monde entier. L'ambiance, je vous assure, elle est incroyable : la ville est pleine, il y a des dégustations dans toutes les caves, et les prix montent parfois très haut. Ce que les gens oublient souvent, c'est qu'on n'achète pas des bouteilles, mais des tonneaux de vin nouveau, qui doit encore vieillir.", en: "Bertrand: Of course. The buyers are mostly merchants like me, but also collectors from all over the world. The atmosphere, I assure you, is incredible: the town is full, there are tastings in every cellar, and prices sometimes go very high. What people often forget is that you don't buy bottles but barrels of new wine, which still has to age." }
  - { es: "Laura : J'ai lu aussi que les vignes de Bourgogne sont classées par l'UNESCO.", en: "Laura: I also read that the vineyards of Burgundy are listed by UNESCO." }
  - { es: "Bertrand : Oui, depuis 2015. Ce sont les « climats » qui ont été classés : de petites parcelles de vigne, chacune avec son nom, son sol, son exposition au soleil. Deux parcelles voisines peuvent donner des vins complètement différents. C'est ça, la Bourgogne : chaque mètre compte. Bon, assez parlé. Ce qui compte vraiment, c'est de goûter. Venez, ma cave est au coin de la rue.", en: "Bertrand: Yes, since 2015. It's the 'climats' that were listed: small plots of vines, each with its own name, its soil, its exposure to the sun. Two neighbouring plots can produce completely different wines. That's Burgundy: every metre counts. Right, enough talk. What really matters is tasting. Come on, my cellar is on the corner." }
questions:
  - { q: "Qu'était à l'origine le bâtiment des Hospices ?", options: ["Un palais ducal", "Un hôpital pour les pauvres", "Une cave à vin"], answer: 1, explain: "«C'était un hôpital pour les pauvres», founded in 1443." }
  - { q: "Jusqu'à quand l'hôpital a-t-il fonctionné ?", options: ["Jusqu'en 1443", "Jusqu'en 1859", "Jusqu'en 1971"], answer: 2, explain: "«Ce qui est extraordinaire, c'est que l'hôpital a fonctionné jusqu'en 1971 !»" }
  - { q: "D'où viennent les vignes des Hospices ?", options: ["De dons de familles au fil des siècles", "Elles ont été achetées par Rolin", "Elles appartiennent à l'État"], answer: 0, explain: "«De nombreuses familles ont donné des vignes aux Hospices pour aider les malades.»" }
  - { q: "Qu'achète-t-on à la vente des Hospices ?", options: ["Des bouteilles de vieux vin", "Des tonneaux de vin nouveau", "Des parcelles de vigne"], answer: 1, explain: "«On n'achète pas des bouteilles, mais des tonneaux de vin nouveau, qui doit encore vieillir.»" }
  - { q: "Que sont les « climats » de Bourgogne ?", options: ["Les saisons", "De petites parcelles de vigne avec leur nom et leur sol", "Les prévisions météo"], answer: 1, explain: "«De petites parcelles de vigne, chacune avec son nom, son sol, son exposition au soleil.»" }
  - { q: "« Ce toit, c'est lui que tout le monde vient photographier. » Quel est l'effet de cette construction ?", options: ["Elle exprime un doute", "Elle met le toit en relief", "Elle exprime le futur"], answer: 1, explain: "C'est… que is a cleft sentence that puts the toit in focus." }
