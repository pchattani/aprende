id: r.c2.le-bourgeois-gentilhomme
level: c2
title: "Le Bourgeois gentilhomme : la leçon de philosophie"
kind: literature
author: Molière (1622–1673)
source: "Le Bourgeois gentilhomme, comédie-ballet, acte II, scène 4 (1670). Domaine public. Texte légèrement abrégé d'après l'édition numérique de Théâtre Classique (corpus FreDraCor) ; les coupures sont marquées par (…), la ponctuation est légèrement normalisée (virgules, ligature œ) et les phrases du billet sont mises entre guillemets."
intro: "Monsieur Jourdain, a rich merchant who wants to become a gentleman, takes a lesson from his philosophy teacher — and discovers that he has been speaking prose all his life. The first paragraph is an editorial introduction written for this course; the rest is Molière's text, with cuts marked (…). Notice the classical French: ne… point, pronouns placed before the infinitive's governing verb (vous la voulez faire, on les peut mettre), the imperfect subjunctive (m'aidassiez, susse, fût) and the comedy of repetition."
allow: [naïveté, marquer, diverses, molière, jourdain, nicole, marquise, louis, xiv, chambord, lully, philosophie, philosophe, almanach, articulations, admirable, curiosités, prose, vers, galant, galante, orthographe, consonnes, consonne, voyelles, voyelle, lune, fa, f]
paragraphs:
  - { es: "Le Bourgeois gentilhomme fut joué pour la première fois en 1670 devant Louis XIV, au château de Chambord, avec une musique de Lully. Monsieur Jourdain, un riche marchand, rêve d'être pris pour un homme de qualité : il s'habille comme un noble, prend des leçons de danse, de musique, d'armes et de philosophie, et tout le monde profite de sa naïveté.", en: "Le Bourgeois gentilhomme (The Would-Be Gentleman) was first performed in 1670 before Louis XIV at the château of Chambord, with music by Lully. Monsieur Jourdain, a rich merchant, dreams of being taken for a man of quality: he dresses like a nobleman, takes lessons in dancing, music, fencing and philosophy, and everyone takes advantage of his naivety." }
  - { es: "Le maître de philosophie : Que voulez-vous donc que je vous apprenne ? — Monsieur Jourdain : Apprenez-moi l'orthographe. — Le maître de philosophie : Très volontiers. — Monsieur Jourdain : Après vous m'apprendrez l'almanach, pour savoir quand il y a de la Lune, et quand il n'y en a point.", en: "The philosophy teacher: What would you like me to teach you, then? — Monsieur Jourdain: Teach me spelling. — The philosophy teacher: Very willingly. — Monsieur Jourdain: After that you will teach me the almanac, so that I know when there is a moon and when there isn't." }
  - { es: "Le maître de philosophie : Soit. Pour bien suivre votre pensée et traiter cette matière en philosophe, il faut commencer selon l'ordre des choses, par une exacte connaissance de la nature des lettres, et de la différente manière de les prononcer toutes. Et là-dessus j'ai à vous dire, que les lettres sont divisées en voyelles, ainsi dites voyelles, parce qu'elles expriment les voix ; et en consonnes, ainsi appelées consonnes parce qu'elles sonnent avec les voyelles, et ne font que marquer les diverses articulations des voix. Il y a cinq voyelles ou voix : A, E, I, O, U. — Monsieur Jourdain : J'entends tout cela.", en: "The philosophy teacher: Very well. To follow your thinking properly and treat this subject as a philosopher, we must begin in the order of things, with an exact knowledge of the nature of letters and of the different ways of pronouncing them all. And on that point I must tell you that letters are divided into vowels, so called because they express the voices; and into consonants, so called because they sound with the vowels and merely mark the various articulations of the voices. There are five vowels or voices: A, E, I, O, U. — Monsieur Jourdain: I understand all that." }
  - { es: "Le maître de philosophie : La voix A se forme en ouvrant fort la bouche : A. — Monsieur Jourdain : A, A, oui. — Le maître de philosophie : La voix E se forme en rapprochant la mâchoire d'en bas de celle d'en haut : A, E. — Monsieur Jourdain : A, E, A, E. Ma foi oui. Ah que cela est beau ! — Le maître de philosophie : Et la voix I, en rapprochant encore davantage les mâchoires l'une de l'autre, et écartant les deux coins de la bouche vers les oreilles : A, E, I. — Monsieur Jourdain : A, E, I, I, I, I. Cela est vrai. Vive la science !", en: "The philosophy teacher: The voice A is formed by opening the mouth wide: A. — Monsieur Jourdain: A, A, yes. — The philosophy teacher: The voice E is formed by bringing the lower jaw closer to the upper one: A, E. — Monsieur Jourdain: A, E, A, E. My word, yes. Ah, how beautiful that is! — The philosophy teacher: And the voice I, by bringing the jaws even closer together and stretching the two corners of the mouth towards the ears: A, E, I. — Monsieur Jourdain: A, E, I, I, I, I. That's true. Long live science!" }
  - { es: "Le maître de philosophie : La voix O se forme en rouvrant les mâchoires, et rapprochant les lèvres par les deux coins, le haut et le bas : O. — Monsieur Jourdain : O, O. Il n'y a rien de plus juste. A, E, I, O, I, O. Cela est admirable ! I, O, I, O. (…) Ah la belle chose, que de savoir quelque chose ! (…) — Le maître de philosophie : Vos deux lèvres s'allongent comme si vous faisiez la moue : d'où vient que si vous la voulez faire à quelqu'un, et vous moquer de lui, vous ne sauriez lui dire que U. — Monsieur Jourdain : U, U. Cela est vrai. Ah que n'ai-je étudié plus tôt, pour savoir tout cela !", en: "The philosophy teacher: The voice O is formed by opening the jaws again and bringing the lips together at the two corners, top and bottom: O. — Monsieur Jourdain: O, O. Nothing could be more correct. A, E, I, O, I, O. That is admirable! I, O, I, O. (…) Ah, what a fine thing it is to know something! (…) — The philosophy teacher: Your two lips stretch out as if you were pulling a face: which is why, if you want to pull one at someone and make fun of him, all you can say to him is U. — Monsieur Jourdain: U, U. That's true. Ah, why didn't I study sooner, to know all that!" }
  - { es: "(…) Monsieur Jourdain : (…) Au reste il faut que je vous fasse une confidence. Je suis amoureux d'une personne de grande qualité, et je souhaiterais que vous m'aidassiez à lui écrire quelque chose dans un petit billet que je veux laisser tomber à ses pieds. — Le maître de philosophie : Fort bien. — Monsieur Jourdain : Cela sera galant, oui. — Le maître de philosophie : Sans doute. Sont-ce des vers que vous lui voulez écrire ?", en: "(…) Monsieur Jourdain: (…) Besides, I must tell you something in confidence. I am in love with a lady of high rank, and I should like you to help me write her something in a little note that I mean to drop at her feet. — The philosophy teacher: Very good. — Monsieur Jourdain: It will be gallant, yes. — The philosophy teacher: No doubt. Is it verse you wish to write to her?" }
  - { es: "Monsieur Jourdain : Non, non, point de vers. — Le maître de philosophie : Vous ne voulez que de la prose ? — Monsieur Jourdain : Non, je ne veux ni prose ni vers. — Le maître de philosophie : Il faut bien que ce soit l'un, ou l'autre. — Monsieur Jourdain : Pourquoi ? — Le maître de philosophie : Par la raison, Monsieur, qu'il n'y a pour s'exprimer que la prose, ou les vers. — Monsieur Jourdain : Il n'y a que la prose ou les vers ? — Le maître de philosophie : Non, Monsieur : tout ce qui n'est point prose, est vers ; et tout ce qui n'est point vers, est prose.", en: "Monsieur Jourdain: No, no, no verse. — The philosophy teacher: You want only prose? — Monsieur Jourdain: No, I want neither prose nor verse. — The philosophy teacher: It has to be one or the other. — Monsieur Jourdain: Why? — The philosophy teacher: For the reason, Sir, that there is no way of expressing oneself except prose or verse. — Monsieur Jourdain: There is only prose or verse? — The philosophy teacher: No, Sir: everything that is not prose is verse, and everything that is not verse is prose." }
  - { es: "Monsieur Jourdain : Et comme l'on parle, qu'est-ce que c'est donc que cela ? — Le maître de philosophie : De la prose. — Monsieur Jourdain : Quoi, quand je dis, « Nicole, apportez-moi mes pantoufles, et me donnez mon bonnet de nuit », c'est de la prose ? — Le maître de philosophie : Oui, Monsieur. — Monsieur Jourdain : Par ma foi ! Il y a plus de quarante ans que je dis de la prose sans que j'en susse rien ; et je vous suis le plus obligé du monde, de m'avoir appris cela.", en: "Monsieur Jourdain: And the way we speak, what is that, then? — The philosophy teacher: Prose. — Monsieur Jourdain: What! When I say, 'Nicole, bring me my slippers and give me my nightcap', that's prose? — The philosophy teacher: Yes, Sir. — Monsieur Jourdain: Upon my word! For more than forty years I have been speaking prose without knowing anything about it; and I am most obliged to you for having taught me that." }
  - { es: "Monsieur Jourdain : Je voudrais donc lui mettre dans un billet : « Belle Marquise, vos beaux yeux me font mourir d'amour » ; mais je voudrais que cela fût mis d'une manière galante, que cela fût tourné gentiment. — Le maître de philosophie : Mettre que les feux de ses yeux réduisent votre cœur en cendres ; que vous souffrez nuit et jour pour elle les violences d'un… — Monsieur Jourdain : Non, non, non, je ne veux point tout cela ; je ne veux que ce que je vous ai dit : « Belle Marquise, vos beaux yeux me font mourir d'amour. »", en: "Monsieur Jourdain: So I should like to put in a note to her: 'Fair Marquise, your beautiful eyes make me die of love'; but I should like it to be put in a gallant way, nicely turned. — The philosophy teacher: Write that the fire of her eyes reduces your heart to ashes; that night and day you suffer for her the violence of a… — Monsieur Jourdain: No, no, no, I don't want any of that; I want only what I told you: 'Fair Marquise, your beautiful eyes make me die of love.'" }
  - { es: "Le maître de philosophie : Il faut bien étendre un peu la chose. — Monsieur Jourdain : Non, vous dis-je, je ne veux que ces seules paroles-là dans le billet ; mais tournées à la mode, bien arrangées comme il faut. Je vous prie de me dire un peu, pour voir, les diverses manières dont on les peut mettre. — Le maître de philosophie : On les peut mettre premièrement comme vous avez dit : « Belle Marquise, vos beaux yeux me font mourir d'amour. » Ou bien : « D'amour mourir me font, belle Marquise, vos beaux yeux. » Ou bien : « Vos yeux beaux d'amour me font, belle Marquise, mourir. » Ou bien : « Mourir vos beaux yeux, belle Marquise, d'amour me font. » Ou bien : « Me font vos yeux beaux mourir, belle Marquise, d'amour. »", en: "The philosophy teacher: You really must expand on it a little. — Monsieur Jourdain: No, I tell you, I want only those very words in the note; but turned fashionably, properly arranged. Please tell me, just to see, the various ways one can put them. — The philosophy teacher: One can put them, first, as you said: 'Fair Marquise, your beautiful eyes make me die of love.' Or else: 'Of love to die make me, fair Marquise, your beautiful eyes.' Or else: 'Your eyes beautiful of love make me, fair Marquise, die.' Or else: 'Die your beautiful eyes, fair Marquise, of love make me.' Or else: 'Make me your eyes beautiful die, fair Marquise, of love.'" }
  - { es: "Monsieur Jourdain : Mais de toutes ces façons-là, laquelle est la meilleure ? — Le maître de philosophie : Celle que vous avez dite : « Belle Marquise, vos beaux yeux me font mourir d'amour. » — Monsieur Jourdain : Cependant je n'ai point étudié, et j'ai fait cela tout du premier coup.", en: "Monsieur Jourdain: But of all those ways, which is the best? — The philosophy teacher: The one you said: 'Fair Marquise, your beautiful eyes make me die of love.' — Monsieur Jourdain: And yet I have never studied, and I did it right first time." }
questions:
  - { q: "Que demande d'abord Monsieur Jourdain à son maître ?", options: ["De lui apprendre la danse", "De lui apprendre l'orthographe, puis l'almanach", "De lui écrire une pièce de théâtre"], answer: 1, explain: "«Apprenez-moi l'orthographe… Après vous m'apprendrez l'almanach» — he has just refused logic, ethics and physics." }
  - { q: "Pourquoi la leçon sur les voyelles est-elle comique ?", options: ["Parce que le maître se trompe", "Parce que Monsieur Jourdain s'émerveille de choses qu'il fait tous les jours sans y penser", "Parce que le maître parle latin"], answer: 1, explain: "He marvels at how to say A, E, I, O, U («Vive la science !»), something every speaker does without thinking." }
  - { q: "Que découvre Monsieur Jourdain sur la prose ?", options: ["Qu'il ne sait pas écrire", "Qu'il fait de la prose depuis plus de quarante ans sans le savoir", "Que la prose est réservée aux nobles"], answer: 1, explain: "«Il y a plus de quarante ans que je dis de la prose sans que j'en susse rien.»" }
  - { q: "Quelle est, selon le maître, la meilleure manière d'écrire le billet ?", options: ["La plus compliquée", "Celle que Monsieur Jourdain a dite lui-même", "Celle qui est en vers"], answer: 1, explain: "After five absurd word orders, the best is the simplest: «Celle que vous avez dite» — and Jourdain is very proud of himself." }
  - { q: "Que montre la phrase « Sont-ce des vers que vous lui voulez écrire ? » sur le français classique ?", options: ["Le pronom se place devant le verbe conjugué (lui voulez écrire) et non devant l'infinitif", "Le verbe vouloir n'existait pas", "On n'utilisait pas l'inversion"], answer: 0, explain: "Classical French places the object pronoun before the governing verb: vous lui voulez écrire (modern: vous voulez lui écrire); likewise on les peut mettre." }
