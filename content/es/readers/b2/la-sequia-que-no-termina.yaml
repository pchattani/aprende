id: r.b2.la-sequia-que-no-termina
level: b2
title: La sequía que no termina
kind: text
intro: A news feature on a long drought in eastern Spain. Farmers, scientists and residents concede points and contrast ideas with aunque, por mucho que and a pesar de.
allow: [valencia, ribera, manuel, ferrer, clara, soler, marta, vidal, golf, infinita, denuncian, instalado, pesimistas, veintiocho]
paragraphs:
  - { es: "VALENCIA. Hace tres años que en la comarca de la Ribera no llueve lo suficiente. Los agricultores miran al cielo cada mañana, y cada mañana el cielo está azul. «Aunque llueva ahora, ya es tarde para la cosecha de este año», dice Manuel Ferrer, que cultiva naranjas desde que tenía dieciséis años.", en: "VALENCIA. For three years it has not rained enough in the Ribera district. The farmers look at the sky every morning, and every morning the sky is blue. 'Even if it rains now, it's already too late for this year's harvest,' says Manuel Ferrer, who has grown oranges since he was sixteen." }
  - { es: "La sequía no es un fenómeno nuevo en el este de España; sin embargo, los científicos advierten de que las olas de calor son cada vez más largas y de que las lluvias, cuando llegan, lo hacen de golpe y se pierden en el mar.", en: "Drought is not a new phenomenon in eastern Spain; however, scientists warn that heatwaves are getting longer and longer and that the rains, when they come, come all at once and are lost into the sea." }
  - { es: "A pesar de las medidas de ahorro, el consumo de agua en la región apenas ha bajado. Por mucho que el gobierno pida responsabilidad, los campos de golf y los pisos turísticos siguen gastando como si el agua fuera infinita, denuncian los vecinos.", en: "Despite the saving measures, water consumption in the region has hardly fallen. However much the government asks for responsibility, the golf courses and the tourist flats keep consuming as if water were infinite, residents complain." }
  - { es: "No obstante, hay señales de cambio. En varios pueblos se han instalado sistemas para reutilizar el agua, y algunas empresas han cambiado los cultivos tradicionales por otros que necesitan menos riego. «Pese a lo que digan los pesimistas, el campo se adapta», afirma la ingeniera Clara Soler.", en: "Nevertheless, there are signs of change. In several villages systems to reuse water have been installed, and some companies have replaced traditional crops with others that need less irrigation. 'Despite what the pessimists say, the countryside adapts,' states the engineer Clara Soler." }
  - { es: "El problema, explica Soler, es el tiempo. «Aunque hoy empezáramos a hacerlo todo bien, los ríos tardarían décadas en recuperarse». Mientras tanto, los pueblos pequeños pierden habitantes: digan lo que digan las estadísticas, un campo sin agua es un campo sin futuro.", en: "The problem, Soler explains, is time. 'Even if we started doing everything right today, the rivers would take decades to recover.' Meanwhile, the small villages are losing inhabitants: whatever the statistics say, land without water is land without a future." }
  - { es: "Los jóvenes agricultores son los más preocupados. Marta Vidal, de veintiocho años, acaba de heredar la granja de su padre. «Por muy duro que sea, no pienso tirar la toalla», dice. «Y eso que mis amigos me llaman loca».", en: "Young farmers are the most worried. Marta Vidal, twenty-eight, has just inherited her father's farm. 'However hard it is, I don't intend to throw in the towel,' she says. 'And that despite my friends calling me mad.'" }
  - { es: "Los expertos coinciden en una cosa: no basta con esperar la lluvia. Aun así, cuando le preguntamos a Manuel Ferrer qué haría si pudiera pedir un deseo, no duda ni un segundo: «Que llueva una semana entera. Aunque sea en agosto».", en: "The experts agree on one thing: waiting for rain is not enough. Even so, when we ask Manuel Ferrer what he would do if he could make a wish, he doesn't hesitate for a second: 'For it to rain a whole week. Even if it's in August.'" }
questions:
  - { q: "What does Manuel Ferrer say about rain now?", options: ["It would save this year's harvest", "It is already too late for this year's harvest", "It never rains in August"], answer: 1 }
  - { q: "Who do residents accuse of wasting water?", options: ["Farmers", "Golf courses and tourist flats", "Schools"], answer: 1 }
  - { q: "What sign of change does the article mention?", options: ["New dams", "Systems to reuse water and crops that need less irrigation", "A ban on tourism"], answer: 1 }
  - { q: "What is Marta Vidal's attitude?", options: ["She wants to sell the farm", "She refuses to give up", "She is moving to the city"], answer: 1 }
glossary:
  - { es: de golpe, en: all at once }
  - { es: infinito, en: infinite }
  - { es: denunciar, en: to denounce, to complain publicly }
  - { es: instalar, en: to install }
  - { es: reutilizar, en: to reuse }
  - { es: riego, en: irrigation }
  - { es: pesimista, en: pessimist }
  - { es: recuperarse, en: to recover }
  - { es: loco, en: mad, crazy }
  - { es: bastar, en: to be enough }
