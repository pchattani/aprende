id: r.b2.ela-pediu-que-eu-viesse
level: b2
title: Ela pediu que eu viesse
kind: text
intro: Otávio, a young engineer from São Paulo, travels to Natal because his grandmother asked him to come for her 90th birthday. Everything people say to him is reported — a showcase of advanced reported speech.
allow: [otávio, natal, genipabu, pirangi, reis, magos, ponta, negra, potiguar, potiguares, dalva, ok, rio, grande, norte]
paragraphs:
  - { es: "Foi a minha mãe quem me ligou, numa terça-feira à noite. Disse que a vó Dalva ia fazer noventa anos em agosto e que tinha pedido, de maneira muito especial, que todos os netos viessem a Natal para a festa. Acrescentou que a avó tinha mencionado o meu nome duas vezes, porque eu era o único neto que nunca tinha ido visitá-la. Eu respondi que estava cheio de trabalho, mas a minha mãe me interrompeu e disse que, se eu não fosse, ela nunca me perdoaria.", en: "It was my mother who called me, one Tuesday night. She said Grandma Dalva was turning ninety in August and had asked, very specially, that all the grandchildren come to Natal for the party. She added that Grandma had mentioned my name twice, because I was the only grandchild who had never been to visit her. I replied that I was swamped with work, but my mother interrupted me and said that if I didn't go, she would never forgive me." }
  - { es: "Então eu fui. Quando cheguei ao aeroporto, a minha prima me esperava com um cartaz escrito «Finalmente!». No carro, ela me contou que a vó tinha passado a semana inteira perguntando se eu viria mesmo e que tinha mandado fazer a minha comida preferida, carne de sol com macaxeira, «para o menino de São Paulo não passar fome».", en: "So I went. When I arrived at the airport, my cousin was waiting for me with a sign that said 'Finally!'. In the car she told me Grandma had spent the whole week asking whether I was really coming and had ordered my favourite food, carne de sol with cassava, 'so that the boy from São Paulo doesn't go hungry'." }
  - { es: "A vó Dalva me recebeu na porta da casa, em Ponta Negra. Segurou o meu rosto com as duas mãos e disse que eu estava magro demais, que São Paulo não fazia bem para ninguém e que eu ia ficar pelo menos uma semana. Eu disse que só tinha quatro dias. Ela sorriu e respondeu que isso ainda veríamos.", en: "Grandma Dalva met me at the door of her house in Ponta Negra. She held my face in both hands and said I was far too thin, that São Paulo did nobody any good and that I was going to stay at least a week. I said I only had four days. She smiled and replied that we would see about that." }
  - { es: "No dia seguinte, os primos insistiram que eu fizesse o passeio de bugue pelas dunas de Genipabu. Antes de sairmos, o bugueiro perguntou se queríamos o passeio «com emoção ou sem emoção». Eu perguntei qual era a diferença, e ele explicou, rindo, que «sem emoção» era para quem tinha medo e «com emoção» era para quem queria descer as dunas como numa montanha-russa. Os meus primos responderam por mim que era com emoção, claro. Durante uma hora, eu gritei mais do que em toda a minha vida.", en: "The next day my cousins insisted that I do the buggy tour of the Genipabu dunes. Before we left, the driver asked whether we wanted the trip 'with thrills or without thrills'. I asked what the difference was, and he explained, laughing, that 'without thrills' was for people who were scared and 'with thrills' was for those who wanted to go down the dunes as if on a roller coaster. My cousins answered for me that it was with thrills, of course. For an hour, I screamed more than in my whole life." }
  - { es: "Depois, fomos ver o cajueiro de Pirangi. Um guia nos contou que era considerado o maior cajueiro do mundo, que ocupava uma área de mais de oito mil metros quadrados e que, por causa de uma anomalia genética, os galhos cresciam para os lados e criavam raízes novas quando tocavam o chão. Disse também que um único pé produzia, em boas safras, toneladas de caju. Eu confesso que pensei que fosse uma floresta inteira.", en: "Afterwards, we went to see the Pirangi cashew tree. A guide told us it was considered the largest cashew tree in the world, that it covered an area of more than eight thousand square metres and that, because of a genetic anomaly, its branches grew sideways and put down new roots when they touched the ground. He also said that a single tree produced, in good harvests, tonnes of cashew fruit. I confess I thought it was a whole forest." }
  - { es: "Na noite da festa, a casa estava cheia: filhos, netos, bisnetos, vizinhos. Quando chegou a hora do parabéns, a vó pediu silêncio e disse que queria falar uma coisa. Contou que, quando tinha a minha idade, tinha recusado um emprego no Rio porque a mãe dela tinha pedido que ela ficasse. Disse que nunca tinha se arrependido, mas que, por isso mesmo, entendia os netos que iam embora. Depois olhou para mim e pediu que, pelo menos uma vez por ano, eu voltasse para ver o mar de onde a nossa família tinha saído.", en: "On the night of the party, the house was full: children, grandchildren, great-grandchildren, neighbours. When it was time for Happy Birthday, Grandma asked for silence and said she wanted to say something. She told us that, when she was my age, she had turned down a job in Rio because her mother had asked her to stay. She said she had never regretted it but that, precisely because of that, she understood the grandchildren who left. Then she looked at me and asked that, at least once a year, I come back to see the sea our family had come from." }
  - { es: "Eu prometi que voltaria. E, no dia seguinte, liguei para o meu chefe e disse que ia ficar mais três dias. Ele perguntou se estava tudo bem. Respondi que sim, que estava tudo ótimo, e que a minha avó tinha pedido. Ele não fez mais perguntas.", en: "I promised I would come back. And, the next day, I called my boss and told him I was going to stay three more days. He asked if everything was OK. I answered yes, everything was great, and that my grandmother had asked me to. He didn't ask any more questions." }
questions:
  - { q: "Por que a mãe do Otávio insistiu que ele fosse a Natal?", options: ["Porque a avó tinha pedido que todos os netos viessem", "Porque ele precisava trabalhar lá", "Porque a prima ia se casar"], answer: 0, explain: "She said Grandma «tinha pedido... que todos os netos viessem a Natal para a festa»." }
  - { q: "O que a avó disse quando viu o Otávio?", options: ["Que ele estava magro demais e ia ficar uma semana", "Que ele tinha chegado tarde", "Que ele precisava cortar o cabelo"], answer: 0, explain: "«Disse que eu estava magro demais... e que eu ia ficar pelo menos uma semana.»" }
  - { q: "O que significa o passeio «com emoção»?", options: ["Um passeio mais lento e tranquilo", "Descer as dunas como numa montanha-russa", "Um passeio à noite"], answer: 1, explain: "«Com emoção» was «para quem queria descer as dunas como numa montanha-russa»." }
  - { q: "Por que o cajueiro de Pirangi é tão grande?", options: ["Porque é muito antigo e regado todos os dias", "Por causa de uma anomalia genética que faz os galhos criarem raízes", "Porque são vários cajueiros plantados juntos"], answer: 1, explain: "«Por causa de uma anomalia genética, os galhos cresciam para os lados e criavam raízes novas quando tocavam o chão.»" }
  - { q: "O que a avó pediu ao Otávio na festa?", options: ["Que ele se mudasse para Natal", "Que voltasse pelo menos uma vez por ano", "Que recusasse o emprego em São Paulo"], answer: 1, explain: "«Pediu que, pelo menos uma vez por ano, eu voltasse para ver o mar.»" }
