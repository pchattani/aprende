id: r.b2.les-traboules
level: b2
title: Les traboules, pour que vous ne vous perdiez pas
kind: dialogue
intro: A guided tour of the traboules of Vieux-Lyon and the Croix-Rousse – the secret passageways that cut through buildings from one street to the next. Listen for the subjunctive after conjunctions (pour que, à condition que, bien que, avant que, sans que).
allow: [trans-ambulare, mathilde, voraces, ok, centre]
paragraphs:
  - { es: "Mathilde (la guide) : Bonjour à tous et bienvenue dans le Vieux-Lyon ! Avant que nous commencions, deux règles. D'abord, restez bien groupés pour que personne ne se perde : les traboules sont un vrai labyrinthe. Ensuite, nous allons entrer dans des immeubles privés. Les habitants acceptent qu'on traverse leurs cours, à condition que nous restions discrets. Alors, on parle à voix basse, d'accord ?", en: "Mathilde (the guide): Hello everyone and welcome to Vieux-Lyon! Before we start, two rules. First, stay close together so that nobody gets lost: the traboules are a real labyrinth. Second, we're going into private buildings. The residents agree to let us cross their courtyards, provided we stay discreet. So we speak quietly, all right?" }
  - { es: "Un touriste : Mais qu'est-ce que c'est exactement, une traboule ?", en: "A tourist: But what exactly is a traboule?" }
  - { es: "Mathilde : C'est un passage qui traverse un ou plusieurs immeubles et qui permet d'aller d'une rue à une autre sans passer par la rue principale. Le mot viendrait du latin trans-ambulare, « passer à travers ». Regardez cette porte : rien n'indique qu'elle cache quoi que ce soit. Et pourtant… Suivez-moi.", en: "Mathilde: It's a passage that goes through one or more buildings and lets you get from one street to another without going along the main street. The word is said to come from the Latin trans-ambulare, 'to pass through'. Look at this door: nothing suggests it's hiding anything at all. And yet… Follow me." }
  - { es: "Une touriste : Oh ! C'est magnifique ! Une cour intérieure avec une tour, des escaliers en spirale, des galeries…", en: "A tourist: Oh! It's magnificent! An inner courtyard with a tower, spiral staircases, galleries…" }
  - { es: "Mathilde : Nous sommes dans un immeuble de la Renaissance. Au seizième siècle, Lyon était une ville très riche, grâce au commerce et aux banquiers italiens qui s'y étaient installés. Les maisons étaient étroites et profondes, et les traboules permettaient d'accéder aux bâtiments situés au fond des cours. Il en existe plusieurs centaines dans la ville, mais seulement quelques dizaines sont ouvertes au public.", en: "Mathilde: We're in a Renaissance building. In the sixteenth century Lyon was a very rich city, thanks to trade and to the Italian bankers who had settled there. The houses were narrow and deep, and the traboules gave access to the buildings at the back of the courtyards. There are several hundred in the city, but only a few dozen are open to the public." }
  - { es: "Un touriste : On m'a dit qu'elles servaient aux ouvriers de la soie. C'est vrai ?", en: "A tourist: I was told they were used by silk workers. Is that true?" }
  - { es: "Mathilde : Oui, surtout sur la colline de la Croix-Rousse, où nous irons tout à l'heure. Au dix-neuvième siècle, des milliers de tisserands, qu'on appelait les canuts, y travaillaient la soie sur d'immenses métiers à tisser. Selon la tradition, ils utilisaient les traboules pour transporter les pièces de soie jusqu'aux marchands, en bas de la colline, sans qu'elles soient abîmées par la pluie.", en: "Mathilde: Yes, especially on the Croix-Rousse hill, where we'll go shortly. In the nineteenth century thousands of weavers, known as canuts, worked silk there on huge looms. According to tradition, they used the traboules to carry the pieces of silk down to the merchants at the bottom of the hill, without the rain damaging them." }
  - { es: "Une touriste : Les canuts, ce ne sont pas ceux qui se sont révoltés ?", en: "A tourist: The canuts – aren't they the ones who rebelled?" }
  - { es: "Mathilde : Exactement. En 1831, ils se sont révoltés parce que leurs salaires étaient trop bas. Leur devise était : « Vivre en travaillant ou mourir en combattant ». Ils ont recommencé en 1834. On dit que les traboules les aidaient à échapper aux soldats, qui ne connaissaient pas ces passages. Et pendant la Seconde Guerre mondiale, la Résistance s'en est servie de la même façon. Bien qu'elles paraissent tranquilles aujourd'hui, ces cours ont vu passer beaucoup d'histoire.", en: "Mathilde: Exactly. In 1831 they rebelled because their wages were too low. Their motto was: 'Live working or die fighting'. They rose up again in 1834. It's said the traboules helped them escape from the soldiers, who didn't know these passages. And during the Second World War the Resistance used them in the same way. Although they seem peaceful today, these courtyards have seen a great deal of history." }
  - { es: "Un touriste : Et comment est-ce qu'on les trouve, si on veut revenir seul ?", en: "A tourist: And how do you find them if you want to come back on your own?" }
  - { es: "Mathilde : Cherchez les petites plaques, près des portes, qui indiquent les traboules ouvertes au public. Mais je vous conseille de télécharger un plan avant de partir, à moins que vous ne vouliez passer l'après-midi à tourner en rond ! Et surtout, refermez bien les portes derrière vous, pour que les habitants continuent à nous les ouvrir. Bien, on monte maintenant à la Croix-Rousse. Il y a beaucoup de marches, mais je vous promets une vue extraordinaire.", en: "Mathilde: Look for the little plaques near the doors that show which traboules are open to the public. But I'd advise you to download a map before you go, unless you want to spend the afternoon going round in circles! And above all, close the doors properly behind you, so that the residents keep opening them for us. Right, now we're going up to the Croix-Rousse. There are lots of steps, but I promise you an extraordinary view." }
questions:
  - { q: "Pourquoi les visiteurs doivent-ils rester groupés ?", options: ["Pour que personne ne se perde", "Parce que les habitants l'exigent", "Pour avoir une meilleure vue"], answer: 0, explain: "«Restez bien groupés pour que personne ne se perde : les traboules sont un vrai labyrinthe.»" }
  - { q: "À quelle condition les habitants acceptent-ils les visiteurs ?", options: ["À condition qu'ils paient", "À condition qu'ils restent discrets", "À condition qu'ils viennent le matin"], answer: 1, explain: "«À condition que nous restions discrets.» À condition que + subjunctive." }
  - { q: "À quoi servaient les traboules pour les canuts, selon la tradition ?", options: ["À transporter la soie à l'abri de la pluie", "À cacher leur argent", "À aller à l'église"], answer: 0, explain: "They carried the silk down to the merchants «sans qu'elles soient abîmées par la pluie»." }
  - { q: "Pourquoi les canuts se sont-ils révoltés en 1831 ?", options: ["À cause de la guerre", "Parce que leurs salaires étaient trop bas", "Parce qu'on voulait fermer les traboules"], answer: 1, explain: "«Ils se sont révoltés parce que leurs salaires étaient trop bas.»" }
  - { q: "Comment reconnaît-on une traboule ouverte au public ?", options: ["Grâce à une petite plaque près de la porte", "La porte est toujours rouge", "Il y a un guide devant"], answer: 0, explain: "«Cherchez les petites plaques, près des portes, qui indiquent les traboules ouvertes au public.»" }
  - { q: "« Bien qu'elles paraissent tranquilles… » Pourquoi « paraissent » est-il au subjonctif ?", options: ["Parce que bien que exige le subjonctif", "Parce que c'est une question", "Ce n'est pas le subjonctif"], answer: 0, explain: "Bien que (although) is always followed by the subjunctive." }
