id: r.b2.la-plaza-mayor-de-madrid
level: b2
title: Breve historia de la Plaza Mayor
kind: text
intro: An encyclopaedia-style text on the history of Madrid's Plaza Mayor, written in the objective, passive style of formal Spanish.
allow: [madrid, felipe, juan, gómez, mora, villanueva, giambologna, tacca, arrabal, panadería, carlos, franco, ii, iii, xv, xvii, xix]
paragraphs:
  - { es: "La Plaza Mayor de Madrid es uno de los lugares más visitados de España. Cada año pasan por ella millones de turistas, pero pocos conocen su historia, que es la historia de la propia ciudad: fue construida, destruida por el fuego y reconstruida varias veces a lo largo de cuatro siglos.", en: "Madrid's Plaza Mayor is one of the most visited places in Spain. Every year millions of tourists pass through it, but few know its history, which is the history of the city itself: it was built, destroyed by fire and rebuilt several times over four centuries." }
  - { es: "En el siglo XV, el espacio que hoy ocupa la plaza era un mercado situado fuera de las murallas. Se llamaba Plaza del Arrabal y en ella se vendía pan, carne y pescado. Cuando Felipe II trasladó la corte a Madrid en 1561, se decidió que la ciudad necesitaba una plaza digna de una capital.", en: "In the fifteenth century, the space the square occupies today was a market located outside the city walls. It was called Plaza del Arrabal and bread, meat and fish were sold there. When Philip II moved the court to Madrid in 1561, it was decided that the city needed a square worthy of a capital." }
  - { es: "La construcción de la plaza actual fue encargada por Felipe III al arquitecto Juan Gómez de Mora y se llevó a cabo entre 1617 y 1619. El resultado fue un gran rectángulo rodeado de edificios de cinco plantas, con balcones desde los que se contemplaban las fiestas.", en: "The construction of the current square was commissioned by Philip III from the architect Juan Gómez de Mora and was carried out between 1617 and 1619. The result was a large rectangle surrounded by five-storey buildings, with balconies from which the festivities were watched." }
  - { es: "Sin embargo, la plaza sufrió tres grandes incendios: en 1631, en 1672 y en 1790. El último fue el más grave. Tras aquel incendio, la reconstrucción fue dirigida por Juan de Villanueva, quien redujo la altura de los edificios a tres plantas y cerró las esquinas con grandes arcos. Es la plaza que se conserva hoy.", en: "However, the square suffered three great fires: in 1631, in 1672 and in 1790. The last was the most serious. After that fire, the reconstruction was directed by Juan de Villanueva, who reduced the height of the buildings to three storeys and closed the corners with large arches. It is the square that is preserved today." }
  - { es: "Durante siglos, la plaza fue utilizada para todo tipo de acontecimientos: mercados, corridas de toros, procesiones religiosas, ceremonias reales e incluso ejecuciones públicas. Se calcula que en algunas celebraciones se reunían más de cincuenta mil personas.", en: "For centuries, the square was used for all kinds of events: markets, bullfights, religious processions, royal ceremonies and even public executions. It is estimated that at some celebrations more than fifty thousand people gathered." }
  - { es: "En el centro de la plaza se encuentra la estatua de Felipe III a caballo. Fue realizada por los escultores italianos Giambologna y Pietro Tacca a principios del siglo XVII, pero no fue colocada en la plaza hasta 1848. Antes había estado en otro lugar de la ciudad durante más de doscientos años.", en: "In the centre of the square stands the statue of Philip III on horseback. It was made by the Italian sculptors Giambologna and Pietro Tacca at the beginning of the seventeenth century, but it was not placed in the square until 1848. Before that it had stood elsewhere in the city for more than two hundred years." }
  - { es: "El edificio más conocido es la Casa de la Panadería, llamada así porque en él se vendía el pan de la ciudad. Su fachada está decorada con pinturas de colores que, aunque parecen antiguas, fueron pintadas en 1992 por el artista Carlos Franco.", en: "The best-known building is the Casa de la Panadería, so called because the city's bread was sold in it. Its façade is decorated with colourful paintings which, although they look old, were painted in 1992 by the artist Carlos Franco." }
  - { es: "Hoy la plaza ya no es un mercado de carne ni un lugar de ejecuciones. Es un espacio para el turismo, los cafés y el mercado de Navidad. En 2017 se celebró su cuarto centenario con conciertos y exposiciones. Lo curioso es que, cuatrocientos años después, sigue cumpliendo la función para la que fue creada: reunir a la gente.", en: "Today the square is no longer a meat market or a place of executions. It is a space for tourism, cafés and the Christmas market. In 2017 its fourth centenary was celebrated with concerts and exhibitions. The curious thing is that, four hundred years later, it still fulfils the function for which it was created: bringing people together." }
questions:
  - { q: "What was on the site of the square in the fifteenth century?", options: ["A royal palace", "A market outside the city walls", "A church"], answer: 1 }
  - { q: "Who directed the reconstruction after the fire of 1790?", options: ["Juan Gómez de Mora", "Felipe III", "Juan de Villanueva"], answer: 2 }
  - { q: "When was the statue of Philip III placed in the square?", options: ["In 1619", "In 1848", "In 1992"], answer: 1 }
  - { q: "What is surprising about the paintings on the Casa de la Panadería?", options: ["They are much more recent than they look", "They were painted by Giambologna", "They were destroyed in a fire"], answer: 0 }
