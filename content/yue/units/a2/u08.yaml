id: a2.u08
title: 睇醫生
lessons:
  - id: a2.u08.l1
    title: 我頭痛
    teach: [g.body-pain]
    tip: "No 'have' with symptoms: body part + 痛. 我頭痛 'I've got a headache', 我喉嚨痛 'I've got a sore throat'."
    vocab: [w.tung3, w.tau4-tung3, w.tou5-tung3, w.ngaa4-tung3, w.hau4-lung4-tung3, w.m4-syu1-fuk6, w.san1-tai2, w.tau4, w.tau4-faat3, w.min6.b, w.ngaan5, w.ngaan5-zing1, w.ji5-zai2, w.bei6, w.hau2, w.zeoi2, w.ngaa4, w.geng2, w.hau4-lung4, w.ngaa4-ji1, w.tau4-wan4]
    sentences:
      - { es: "我由今朝開始頭痛。", en: "I've had a headache since this morning.", altEs: ["我今朝開始頭痛。", "由今朝開始我就頭痛。"], altEn: ["My head has been hurting since this morning."], grammar: [g.body-pain], vocab: [w.tau4-tung3, w.hoi1-ci2] }
      - { es: "你邊度唔舒服呀？", en: "What seems to be the problem?", altEs: ["你邊度唔舒服？", "邊度唔舒服呀？"], altEn: ["Where don't you feel well?", "What's wrong?"], grammar: [g.body-pain, g.question-words], vocab: [w.m4-syu1-fuk6] }
      - { es: "我有啲肚痛，唔想食嘢。", en: "My stomach hurts a bit, I don't want to eat.", altEs: ["我有少少肚痛，唔想食嘢。", "我有啲肚痛，唔想食嘢呀。"], altEn: ["I've got a bit of a stomach ache and don't feel like eating."], grammar: [g.body-pain, g.jau-di-a-bit], vocab: [w.tou5-tung3, w.sik6-je5] }
      - { es: "我隻牙好痛，尋晚瞓唔着。", en: "My tooth really hurts, I couldn't sleep last night.", altEs: ["我隻牙好痛，尋晚瞓唔着覺。"], altEn: ["I've got terrible toothache and couldn't sleep last night."], grammar: [g.body-pain, g.potential-complements], vocab: [w.ngaa4, w.tung3, w.cam4-maan5] }
      - { es: "你牙痛就去睇牙醫啦。", en: "If you've got toothache, go and see a dentist.", altEs: ["牙痛就去睇牙醫啦。", "你牙痛就要去睇牙醫。"], grammar: [g.body-pain, g.zau-then], vocab: [w.ngaa4-tung3, w.ngaa4-ji1] }
      - { es: "尋晚喺紅館睇演唱會，我跟住唱，而家喉嚨痛。", en: "At the concert at the Coliseum last night I sang along, and now my throat hurts.", altEs: ["尋晚我喺紅館睇演唱會，跟住唱，而家喉嚨痛。"], altEn: ["I sang along at the Coliseum concert last night, and now I've got a sore throat."], grammar: [g.body-pain], vocab: [w.hau4-lung4-tung3, w.jin2-coeng3-wui2] }
      - { es: "我隻耳仔有啲痛。", en: "My ear hurts a bit.", altEs: ["我隻耳仔有少少痛。", "我有啲耳仔痛。"], grammar: [g.body-pain, g.jau-di-a-bit], vocab: [w.ji5-zai2] }
      - { es: "我塊面好熱，係咪發燒呀？", en: "My face is really hot, have I got a fever?", altEs: ["我塊面好熱，係唔係發燒呀？"], altEn: ["My face feels hot, do I have a temperature?"], grammar: [g.body-pain, g.a-not-a-questions], vocab: [w.min6.b, w.faat3-siu1] }
      - { es: "我條頸好痛，郁唔到。", en: "My neck really hurts, I can't move it.", altEs: ["我條頸好痛，郁都郁唔到。"], grammar: [g.body-pain, g.potential-complements], vocab: [w.geng2, w.juk1] }
      - { es: "佢個鼻好紅，好似感冒咗。", en: "His nose is very red, it looks like he's caught a cold.", altEs: ["佢個鼻好紅，好似傷風咗。"], altEn: ["Her nose is really red, she seems to have a cold."], grammar: [g.body-pain], vocab: [w.bei6, w.gam2-mou6] }
      - { es: "我身體好好，好少病。", en: "I'm very healthy, I rarely get ill.", altEs: ["我身體好好，好少生病。", "我身體好好，好少病㗎。"], altEn: ["I'm in good health and seldom get sick."], grammar: [g.adjective-predicates, g.frequency-adverbs], vocab: [w.san1-tai2, w.beng6.b] }
      - { es: "佢頭髮好長，眼睛好大。", en: "She has long hair and big eyes.", altEs: ["佢啲頭髮好長，眼睛好大。"], altEn: ["Her hair is long and her eyes are big."], grammar: [g.adjective-predicates], vocab: [w.tau4-faat3, w.ngaan5-zing1] }
      - { es: "張開口，講「啊」。", en: "Open your mouth and say 'ah'.", altEs: ["張開個口，講「啊」。", "擘大口，講「啊」。"], altEn: ["Open wide and say 'ah'."], grammar: [g.body-pain], vocab: [w.hau2] }
      - { es: "我有啲頭暈，想坐低。", en: "I feel a bit dizzy, I want to sit down.", altEs: ["我有少少頭暈，想坐一陣。"], grammar: [g.body-pain, g.jau-di-a-bit], vocab: [w.tau4-wan4, w.co5] }
      - { es: "我頭痛。", en: "I've got a headache.", altEs: ["我好頭痛。"], altEn: ["My head hurts."], grammar: [g.body-pain], vocab: [w.tau4-tung3], error: { wrong: "我有頭痛。", explain: "Symptoms take no 有: just body part + 痛, 我頭痛.", grammar: g.body-pain } }
      - { es: "我肚痛。", en: "I've got a stomach ache.", altEs: ["我好肚痛。"], grammar: [g.body-pain], vocab: [w.tou5-tung3], transform: { instruction: "Say it only hurts a bit, with 有啲", answer: "我有啲肚痛。", alt: ["我有少少肚痛。"], en: "My stomach hurts a bit." } }
      - { es: "佢喉嚨痛。", en: "She has a sore throat.", altEs: ["佢喉嚨好痛。"], altEn: ["He's got a sore throat."], grammar: [g.body-pain], vocab: [w.hau4-lung4-tung3], transform: { instruction: "Turn it into a question with 係咪", answer: "佢係咪喉嚨痛呀？", alt: ["佢係唔係喉嚨痛呀？", "佢係咪喉嚨痛？"], en: "Has she got a sore throat?" } }
    exchanges:
      - q: { es: "你邊度唔舒服呀？", en: "What's the matter?" }
        a: { es: "我頭痛，喉嚨又痛。", en: "I've got a headache and a sore throat too." }
        alt: ["我頭痛。", "我喉嚨痛。", "我有啲肚痛。"]
        grammar: [g.body-pain]
        vocab: [w.tau4-tung3, w.hau4-lung4-tung3]
      - q: { es: "痛咗幾耐呀？", en: "How long has it been hurting?" }
        a: { es: "痛咗兩日喇。", en: "For two days now." }
        alt: ["兩日喇。", "由尋日開始痛。"]
        grammar: [g.body-pain, g.duration]
        vocab: [w.tung3, w.gei2-noi6]
      - q: { es: "你冇事呀？你好似好唔舒服。", en: "Are you OK? You look really unwell." }
        a: { es: "我有啲頭暈，唞吓就冇事。", en: "I'm a bit dizzy, I'll be fine after a rest." }
        alt: ["冇事，有啲攰咋。", "我有啲肚痛。"]
        grammar: [g.body-pain, g.zau-then]
        vocab: [w.tau4-wan4, w.m4-syu1-fuk6]
      - q: { es: "你點解唔食嘢呀？", en: "Why aren't you eating?" }
        a: { es: "因為我隻牙好痛。", en: "Because my tooth really hurts." }
        alt: ["我牙痛。", "我有啲肚痛。"]
        grammar: [g.body-pain, g.jan-wai-so-ji]
        vocab: [w.ngaa4, w.ngaa4-tung3]
      - q: { es: "邊度痛呀？", en: "Where does it hurt?" }
        a: { es: "呢度，個頭同條頸都痛。", en: "Here, my head and my neck both hurt." }
        alt: ["個頭痛。", "條頸痛。"]
        grammar: [g.body-pain, g.dou-also]
        vocab: [w.tau4, w.geng2]
    texts:
      - title: "Leo嘅訊息"
        es: ["尋晚喺紅館睇演唱會，好開心！", "不過今朝起身，我喉嚨好痛，頭又痛。", "我今日唔返工喇。"]
        en: ["Last night I went to a concert at the Coliseum, it was great!", "But when I got up this morning my throat was really sore and I had a headache too.", "I'm not going to work today."]
        grammar: [g.body-pain, g.laa3-change]
        vocab: [w.hau4-lung4, w.tau4]
    spicy:
      - { es: "你咁靚，我望到眼都痛喇。", jp: "nei5 gam3 leng3 ngo5 mong6 dou3 ngaan5 dou1 tung3 laa3", en: "You're so gorgeous, I've stared until my eyes hurt.", altEs: ["你咁靚，我望到對眼都痛喇。"], grammar: [g.body-pain, g.laa3-change], vocab: [w.ngaan5, w.tung3] }
      - { es: "我頭痛，醫生話我要多啲同你飲茶。", en: "I've got a headache, the doctor said I need to have tea with you more often.", altEs: ["我頭痛，醫生叫我多啲同你飲茶。"], grammar: [g.body-pain], vocab: [w.tau4-tung3, w.ji1-sang1] }
      - { es: "你邊度唔舒服呀？等我幫你睇吓。", jp: "nei5 bin1 dou6 m4 syu1 fuk6 aa3 dang2 ngo5 bong1 nei5 tai2 haa5", en: "Where does it hurt? Let me have a look for you.", altEs: ["你邊度唔舒服？我幫你睇吓吖。"], grammar: [g.body-pain, g.bong-help], vocab: [w.m4-syu1-fuk6, w.bong1] }
      - { es: "我喉嚨痛，因為尋晚同你傾咗五個鐘。", en: "My throat hurts because I talked with you for five hours last night.", altEs: ["我喉嚨痛，因為尋晚同你傾咗五個鐘偈。"], grammar: [g.body-pain, g.jan-wai-so-ji], vocab: [w.hau4-lung4-tung3, w.king1] }
      - { es: "你對眼睛好靚，我每次望住你都唔記得講嘢。", en: "Your eyes are so beautiful, every time I look at you I forget what to say.", altEs: ["你對眼好靚，我每次望住你都唔記得講嘢。"], grammar: [g.adjective-predicates], vocab: [w.ngaan5-zing1, w.gong2-je5] }
  - id: a2.u08.l2
    title: 因為我病咗
    teach: [g.jan-wai-so-ji]
    tip: "Reason first, result second: 因為落雨，所以我冇去. Either word alone is fine too."
    vocab: [w.tai2-ji1-sang1, w.can2-so2, w.beng6, w.beng6.b, w.beng6-jan4, w.gam2-mou6, w.soeng1-fung1, w.faat3-siu1, w.kat1, w.kat1-joek6-seoi2, w.lau4-bei6-seoi2, w.jan1-wai6, w.so2-ji5, w.ceng2-beng6-gaa3, w.beng6-gaa3, w.ceng2-gaa3, w.au2, w.tou5-o1, w.ji1-sang1-zi2]
    sentences:
      - { es: "因為我發燒，所以今日冇返工。", en: "I didn't go to work today because I had a fever.", altEs: ["因為我發燒，所以我今日冇返工。", "我發燒，所以今日冇返工。"], altEn: ["Because I had a fever, I didn't go to work today."], grammar: [g.jan-wai-so-ji, g.mou-past-negation], vocab: [w.jan1-wai6, w.so2-ji5, w.faat3-siu1] }
      - { es: "佢病咗，所以今日請病假。", en: "She's ill, so she's taken sick leave today.", altEs: ["因為佢病咗，所以今日請病假。", "佢病咗，所以今日請咗病假。"], altEn: ["He's sick, so he's off sick today."], grammar: [g.jan-wai-so-ji, g.zo-perfective], vocab: [w.beng6.b, w.ceng2-beng6-gaa3] }
      - { es: "點解你遲到呀？因為我去咗睇醫生。", en: "Why are you late? Because I went to see the doctor.", altEs: ["你點解遲到呀？因為我去咗睇醫生。"], grammar: [g.jan-wai-so-ji, g.question-words], vocab: [w.ci4-dou3, w.tai2-ji1-sang1] }
      - { es: "我感冒咗，又咳又流鼻水。", en: "I've caught a cold, I'm coughing and I've got a runny nose.", altEs: ["我感冒咗，又咳，又流鼻水。", "我傷風咗，又咳又流鼻水。"], grammar: [g.zo-perfective, g.zoi-vs-jau], vocab: [w.gam2-mou6, w.kat1, w.lau4-bei6-seoi2] }
      - { es: "紅磡站附近有間診所，我哋去嗰度啦。", en: "There's a clinic near Hung Hom station, let's go there.", altEs: ["紅磡站附近有一間診所，我哋去嗰度啦。"], grammar: [g.jau-have, g.laa1-suggestion], vocab: [w.can2-so2, w.fu6-gan6] }
      - { es: "診所好多病人，要等一個鐘。", en: "The clinic is full of patients, we have to wait an hour.", altEs: ["間診所好多病人，要等一個鐘。", "診所好多病人，要等成個鐘。"], grammar: [g.duration], vocab: [w.beng6-jan4, w.dang2] }
      - { es: "我咳得好犀利，晚晚都瞓唔着。", en: "My cough is really bad, I can't sleep at night.", altEs: ["我咳得好犀利，晚晚都瞓唔着覺。"], altEn: ["I'm coughing terribly, I can't sleep any night."], grammar: [g.dak-descriptive, g.potential-complements], vocab: [w.kat1, w.sai1-lei6] }
      - { es: "佢食錯嘢，又嘔又肚屙。", en: "He ate something bad and has been vomiting and has diarrhoea.", altEs: ["佢食錯咗嘢，又嘔又肚屙。"], altEn: ["She ate something off: she's throwing up and has diarrhoea."], grammar: [g.zoi-vs-jau], vocab: [w.au2, w.tou5-o1] }
      - { es: "我傷風啫，唔使睇醫生。", en: "It's just a cold, there's no need to see a doctor.", altEs: ["我傷風咋，唔使睇醫生。", "傷風啫，唔使睇醫生。"], grammar: [g.zaa3-ze1-only, g.jiu-must-m-sai], vocab: [w.soeng1-fung1, w.tai2-ji1-sang1] }
      - { es: "醫生，我呢個病嚴重唔嚴重呀？", en: "Doctor, is this illness of mine serious?", altEs: ["醫生，我個病嚴唔嚴重呀？", "醫生，我呢個病嚴重嗎？"], grammar: [g.a-not-a-questions], vocab: [w.beng6, w.jim4-zung6] }
      - { es: "我同老細講咗，聽日請假。", en: "I've told the boss, I'm taking tomorrow off.", altEs: ["我同老細講咗聽日請假。", "我話咗畀老細知，聽日請假。"], grammar: [g.zo-perfective], vocab: [w.ceng2-gaa3, w.lou5-sai3] }
      - { es: "因為佢成日咳，所以醫生畀咗樽咳藥水佢。", en: "Because she kept coughing, the doctor gave her a bottle of cough syrup.", altEs: ["佢成日咳，所以醫生畀咗樽咳藥水佢。"], altEn: ["He was coughing all the time, so the doctor gave him some cough syrup."], grammar: [g.jan-wai-so-ji, g.bei-give], vocab: [w.kat1-joek6-seoi2, w.zeon1] }
      - { es: "請病假要拎醫生紙。", en: "To take sick leave you need a doctor's note.", altEs: ["請病假要有醫生紙。"], altEn: ["You need a medical certificate for sick leave."], grammar: [g.jiu-must-m-sai], vocab: [w.ji1-sang1-zi2, w.ceng2-beng6-gaa3], note: "A 醫生紙 (doctor's paper) is the sick note Hong Kong employers ask for." }
      - { es: "我冇去飲茶，係因為我唔舒服。", en: "I didn't go for yum cha because I wasn't feeling well.", altEs: ["我冇去飲茶係因為我唔舒服。"], grammar: [g.jan-wai-so-ji], vocab: [w.jan1-wai6, w.m4-syu1-fuk6], note: "Result first, then 係因為 + reason." }
      - { es: "因為我發燒，所以冇去紅館。", en: "I didn't go to the Coliseum because I had a fever.", altEs: ["因為我發燒，所以我冇去紅館。"], grammar: [g.jan-wai-so-ji], vocab: [w.faat3-siu1, w.so2-ji5], error: { wrong: "因為我發燒，我所以冇去紅館。", explain: "所以 starts the result clause, before the subject: 所以我冇去.", grammar: g.jan-wai-so-ji } }
      - { es: "我好攰，我想早啲瞓。", en: "I'm tired; I want to sleep early.", altEs: ["我好攰，想早啲瞓。"], grammar: [g.jan-wai-so-ji], vocab: [w.gui6, w.zou2-di1], transform: { instruction: "Join the two parts with 所以", answer: "我好攰，所以想早啲瞓。", alt: ["我好攰，所以我想早啲瞓。", "因為我好攰，所以想早啲瞓。"], en: "I'm tired, so I want to sleep early." } }
      - { es: "我今日冇返工。", en: "I didn't go to work today.", altEs: ["今日我冇返工。"], grammar: [g.mou-past-negation], vocab: [w.faan1-gung1], transform: { instruction: "Give the reason 我病咗 first, with 因為…所以…", answer: "因為我病咗，所以今日冇返工。", alt: ["因為我病咗，所以我今日冇返工。"], en: "Because I was ill, I didn't go to work today." } }
    exchanges:
      - q: { es: "點解你今日冇返工呀？", en: "Why didn't you go to work today?" }
        a: { es: "因為我發燒。", en: "Because I had a fever." }
        alt: ["我病咗。", "因為我唔舒服。", "因為我感冒咗。"]
        grammar: [g.jan-wai-so-ji]
        vocab: [w.jan1-wai6, w.faat3-siu1]
      - q: { es: "你咳咗幾耐呀？", en: "How long have you been coughing?" }
        a: { es: "咳咗三日喇。", en: "For three days now." }
        alt: ["三日喇。", "由星期一開始。"]
        grammar: [g.duration]
        vocab: [w.kat1]
      - q: { es: "醫生，我係咪感冒呀？", en: "Doctor, have I got a cold?" }
        a: { es: "係呀，係感冒，唔嚴重。", en: "Yes, it's a cold, nothing serious." }
        alt: ["係，你感冒咗。", "唔係，你冇事。"]
        grammar: [g.hai6-identity]
        vocab: [w.gam2-mou6, w.jim4-zung6]
      - q: { es: "你今日點解唔嚟呀？", en: "Why aren't you coming today?" }
        a: { es: "我肚屙，所以喺屋企唞吓。", en: "I've got diarrhoea, so I'm resting at home." }
        alt: ["因為我唔舒服。", "我病咗。"]
        grammar: [g.jan-wai-so-ji]
        vocab: [w.tou5-o1, w.tau2]
      - q: { es: "邊度有診所呀？", en: "Where's there a clinic?" }
        a: { es: "紅磡站附近有一間。", en: "There's one near Hung Hom station." }
        alt: ["站附近有一間。", "前面有一間。"]
        grammar: [g.jau-have, g.position-words]
        vocab: [w.can2-so2]
    texts:
      - title: "請假"
        es: ["陳生，對唔住，我今日唔舒服。", "因為我發燒，又咳得好犀利，所以今日想請病假。", "我下晝會去睇醫生，拎埋醫生紙。"]
        en: ["Mr Chan, I'm sorry, I'm not feeling well today.", "I've got a fever and a bad cough, so I'd like to take sick leave today.", "I'll see a doctor this afternoon and get a sick note too."]
        grammar: [g.jan-wai-so-ji]
        vocab: [w.ceng2-beng6-gaa3, w.ji1-sang1-zi2, w.tai2-ji1-sang1]
    spicy:
      - { es: "我冇病，我淨係見唔到你就唔舒服。", en: "I'm not ill, I just feel unwell when I can't see you.", altEs: ["我冇病呀，我淨係見唔到你就唔舒服。"], grammar: [g.zing-hai-only, g.zau-then], vocab: [w.beng6.b, w.m4-syu1-fuk6] }
      - { es: "因為我成日諗住你，所以晚晚都瞓唔着。", en: "Because I'm always thinking of you, I can't sleep at night.", altEs: ["因為成日諗住你，所以晚晚都瞓唔着。"], grammar: [g.jan-wai-so-ji], vocab: [w.jan1-wai6, w.so2-ji5, w.nam2] }
      - { es: "我今日請病假，唔係因為病，係因為想見你。", en: "I'm off sick today, not because I'm ill, but because I want to see you.", altEs: ["我今日請病假，唔係因為病，係因為我想見你。"], grammar: [g.jan-wai-so-ji], vocab: [w.ceng2-beng6-gaa3, w.beng6] }
      - { es: "你感冒呀？我煲湯畀你飲吖。", en: "You've got a cold? Let me make you some soup.", altEs: ["你感冒咗呀？我煲湯畀你飲吖。"], grammar: [g.aa1-offer, g.bei-give], vocab: [w.gam2-mou6, w.bou1, w.tong1] }
      - { es: "我個心跳得好快，係咪病咗呀？定係因為你喺度？", en: "My heart's beating really fast, am I ill? Or is it because you're here?", altEs: ["我個心跳得好快，係唔係病咗呀？定係因為你喺度？"], grammar: [g.jan-wai-so-ji, g.dak-descriptive], vocab: [w.beng6.b, w.jan1-wai6] }
  - id: a2.u08.l3
    title: 如果發燒就睇醫生
    teach: [g.jyu-gwo-zau]
    tip: "如果 + condition, subject + 就 + result. 就 sits after the subject: 如果落雨，我哋就唔去."
    vocab: [w.jyu4-gwo2, w.ge3-waa2, w.sau6-soeng1, w.dit3-can1, w.zing2-can1, w.dit3, w.can1, w.jim4-zung6, w.gau3-wu6-ce1, w.gap1-zing3-sat1, w.man5-gam2, w.daa2-zam1, w.hyut3, w.lau4-hyut3, w.pei4-fu1, w.han4, w.ji1, w.sau2.b, w.sau2-zi2, w.goek3, w.bok3-tau4]
    sentences:
      - { es: "如果你唔舒服，就留喺屋企啦。", en: "If you don't feel well, stay at home.", altEs: ["如果唔舒服，就留喺屋企啦。", "如果你唔舒服，你就留喺屋企啦。"], grammar: [g.jyu-gwo-zau, g.laa1-suggestion], vocab: [w.jyu4-gwo2, w.lau4.b] }
      - { es: "如果聽日仲發燒，你就要睇醫生。", en: "If you've still got a fever tomorrow, you'll need to see a doctor.", altEs: ["如果你聽日仲發燒，就要睇醫生。", "聽日仲發燒嘅話，你就要睇醫生。"], grammar: [g.jyu-gwo-zau], vocab: [w.jyu4-gwo2, w.faat3-siu1] }
      - { es: "佢踢波跌親，隻腳好痛。", en: "He fell over playing football and his foot really hurts.", altEs: ["佢踢波嗰陣跌親，隻腳好痛。"], altEn: ["She hurt herself falling while playing football; her leg really hurts."], grammar: [g.body-pain], vocab: [w.dit3-can1, w.goek3, w.tek3-bo1] }
      - { es: "我煮飯嗰陣整親隻手指。", en: "I hurt my finger while I was cooking.", altEs: ["我煮飯嗰陣整親咗隻手指。"], grammar: [g.ge-si-hau], vocab: [w.zing2-can1, w.sau2-zi2] }
      - { es: "如果流好多血，就要去急症室。", en: "If it's bleeding a lot, you need to go to A&E.", altEs: ["如果流好多血，你就要去急症室。", "流好多血嘅話，就要去急症室。"], grammar: [g.jyu-gwo-zau], vocab: [w.lau4-hyut3, w.gap1-zing3-sat1] }
      - { es: "如果好嚴重，就即刻叫救護車。", en: "If it's serious, call an ambulance right away.", altEs: ["如果好嚴重，就即刻叫白車。", "好嚴重嘅話，就即刻叫救護車。"], grammar: [g.jyu-gwo-zau], vocab: [w.jim4-zung6, w.gau3-wu6-ce1, w.zik1-hak1], note: "Hongkongers often call an ambulance 白車, 'the white car'." }
      - { es: "我對海鮮敏感，食完皮膚會好痕。", en: "I'm allergic to seafood; after I eat it my skin gets really itchy.", altEs: ["我對海鮮敏感，食完會好痕。"], grammar: [g.wui-will], vocab: [w.man5-gam2, w.pei4-fu1, w.han4] }
      - { es: "你係咪受傷呀？使唔使去醫院？", en: "Are you hurt? Do you need to go to hospital?", altEs: ["你係唔係受傷呀？使唔使去醫院呀？"], grammar: [g.a-not-a-questions, g.jiu-must-m-sai], vocab: [w.sau6-soeng1, w.ji1-jyun2] }
      - { es: "醫生話要打針，我好驚。", en: "The doctor says I need an injection, I'm scared.", altEs: ["醫生話我要打針，我好驚呀。"], grammar: [g.jiu-must-m-sai], vocab: [w.daa2-zam1, w.geng1] }
      - { es: "佢膊頭痛咗成個禮拜。", en: "Her shoulder has been hurting for a whole week.", altEs: ["佢膊頭痛咗成個星期。"], altEn: ["His shoulder has hurt for a week."], grammar: [g.body-pain, g.duration], vocab: [w.bok3-tau4, w.seng4-go3] }
      - { es: "要係你今日唔得閒，我就陪你去醫院。", en: "If you're busy, I'll go to the hospital with you.", altEs: ["如果你今日唔得閒，我就陪你去醫院。"], altEn: ["If you can't make time, I'll take you to the hospital."], grammar: [g.jyu-gwo-zau], vocab: [w.pui4, w.ji1-jyun2], note: "要係 is a colloquial 'if'." }
      - { es: "落雨嘅話，我哋就唔去踢波。", en: "If it rains, we won't go and play football.", altEs: ["如果落雨，我哋就唔去踢波。", "落雨嘅話，就唔去踢波。"], grammar: [g.jyu-gwo-zau], vocab: [w.ge3-waa2, w.tek3-bo1] }
      - { es: "呢種病好易醫，唔使擔心。", en: "This illness is easy to treat, don't worry.", altEs: ["呢種病好易醫㗎，唔使擔心。"], grammar: [g.jiu-must-m-sai], vocab: [w.ji1, w.beng6, w.daam1-sam1] }
      - { es: "如果落雨，我哋就唔去。", en: "If it rains, we won't go.", altEs: ["如果落雨，我哋就唔去喇。"], grammar: [g.jyu-gwo-zau], vocab: [w.jyu4-gwo2], error: { wrong: "如果落雨，就我哋唔去。", explain: "就 comes after the subject, right before the verb: 我哋就唔去.", grammar: g.jyu-gwo-zau } }
      - { es: "聽日落雨，我哋唔去行山。", en: "It's raining tomorrow; we're not going hiking.", altEs: ["聽日落雨，我哋唔行山。"], grammar: [g.jyu-gwo-zau], vocab: [w.lok6-jyu5, w.haang4-saan1], transform: { instruction: "Make it a condition with 如果…就", answer: "如果聽日落雨，我哋就唔去行山。", alt: ["如果聽日落雨，我哋就唔去行山喇。", "聽日落雨嘅話，我哋就唔去行山。"], en: "If it rains tomorrow, we won't go hiking." } }
      - { es: "你發燒，要睇醫生。", en: "You've got a fever, you need to see a doctor.", altEs: ["你發燒，你要睇醫生。"], grammar: [g.jyu-gwo-zau], vocab: [w.faat3-siu1], transform: { instruction: "Make it an if-sentence with 如果…就", answer: "如果你發燒，就要睇醫生。", alt: ["如果發燒，就要睇醫生。", "如果你發燒，你就要睇醫生。"], en: "If you have a fever, you need to see a doctor." } }
    exchanges:
      - q: { es: "如果食咗藥都唔好，點做呀？", en: "What if I've taken the medicine and it doesn't get better?" }
        a: { es: "噉你就要再嚟睇醫生。", en: "Then you'll need to come back and see the doctor." }
        alt: ["噉就再嚟啦。", "噉你就再嚟搵我啦。"]
        grammar: [g.jyu-gwo-zau, g.zoi-vs-jau]
        vocab: [w.joek6, w.tai2-ji1-sang1]
      - q: { es: "你隻手做咩呀？", en: "What happened to your hand?" }
        a: { es: "打波嗰陣整親。", en: "I hurt it playing ball." }
        alt: ["我跌親。", "整親咗。"]
        grammar: [g.ge-si-hau]
        vocab: [w.sau2.b, w.zing2-can1]
      - q: { es: "你對咩嘢敏感呀？", en: "What are you allergic to?" }
        a: { es: "我對海鮮敏感。", en: "I'm allergic to seafood." }
        alt: ["海鮮。", "我冇敏感。"]
        grammar: [g.question-words]
        vocab: [w.man5-gam2, w.hoi2-sin1]
      - q: { es: "使唔使叫救護車呀？", en: "Should we call an ambulance?" }
        a: { es: "唔使，唔嚴重，我自己去急症室得喇。", en: "No need, it's not serious, I can go to A&E myself." }
        alt: ["唔使，唔嚴重。", "要呀，快啲叫啦！"]
        grammar: [g.jiu-must-m-sai]
        vocab: [w.gau3-wu6-ce1, w.gap1-zing3-sat1]
      - q: { es: "你驚唔驚打針呀？", en: "Are you scared of injections?" }
        a: { es: "有少少驚，不過唔痛。", en: "A little bit scared, but it doesn't hurt." }
        alt: ["唔驚。", "好驚呀！"]
        grammar: [g.a-not-a-questions]
        vocab: [w.daa2-zam1, w.geng1]
    texts:
      - title: "急症室告示"
        es: ["如果你流好多血，或者好嚴重，請即刻嚟急症室。", "如果唔係好嚴重，就最好去診所。", "急症室要排隊，可能要等好耐。"]
        en: ["If you are bleeding a lot or it is serious, please come to A&E immediately.", "If it is not very serious, it's better to go to a clinic.", "There is a queue in A&E and you may have to wait a long time."]
        grammar: [g.jyu-gwo-zau, g.zeoi-hou-better]
        vocab: [w.gap1-zing3-sat1, w.lau4-hyut3, w.jim4-zung6]
    spicy:
      - { es: "如果你今晚唔得閒，我就喺紅館門口等到你得閒。", jp: "jyu4 gwo2 nei5 gam1 maan5 m4 dak1 haan4 ngo5 zau6 hai2 hung4 gun2 mun4 hau2 dang2 dou3 nei5 dak1 haan4", en: "If you're not free, I'll wait at the Coliseum entrance until you are.", altEs: ["要係你今晚唔得閒，我就喺紅館門口等到你得閒。"], grammar: [g.jyu-gwo-zau], vocab: [w.jyu4-gwo2, w.dak1-haan4] }
      - { es: "如果你跌親，我就抱你返屋企。", en: "If you fall and hurt yourself, I'll carry you home.", altEs: ["要係你跌親，我就抱你返屋企。"], grammar: [g.jyu-gwo-zau], vocab: [w.dit3-can1, w.pou5] }
      - { es: "我對你敏感：見到你，塊面就紅。", en: "I'm allergic to you: when I see you, my face goes red.", altEs: ["我對你敏感，見到你塊面就紅。"], grammar: [g.zau-then], vocab: [w.man5-gam2, w.min6.b] }
      - { es: "如果你同我食飯，我個病就會即刻好返。", en: "If you have dinner with me, I'll get better right away.", altEs: ["你同我食飯嘅話，我個病就會即刻好返。"], grammar: [g.jyu-gwo-zau], vocab: [w.hou2-faan1, w.beng6] }
      - { es: "要係你受傷，我就日日嚟醫院陪你。", en: "If you got hurt, I'd come to the hospital to keep you company every day.", altEs: ["如果你受傷，我就日日嚟醫院陪你。"], grammar: [g.jyu-gwo-zau], vocab: [w.sau6-soeng1, w.pui4] }
  - id: a2.u08.l4
    title: 你最好休息吓
    teach: [g.zeoi-hou-better]
    tip: "最好 + verb gives advice ('you'd better'); 最好唔好 + verb is 'better not'; 不如…啦 is a soft 'why don't you'."
    vocab: [w.zeoi3-hou2.b, w.joek6, w.sik6-joek6, w.joek6-fong4, w.hou2-faan1, w.gin6-hong1, w.gaai3-hau2, w.tau2, w.ji1-liu4, w.tou5, w.bui3-zek3, w.jiu1, w.sam1, w.faan6-hau6]
    sentences:
      - { es: "你最好休息吓，唔好返工住。", jp: "nei5 zeoi3 hou2 jau1 sik1 haa5 m4 hou2 faan1 gung1 zyu6", en: "You'd better rest, don't go back to work yet.", altEs: ["你最好休息吓，暫時唔好返工。", "你最好休息吓，唔好咁快返工。"], grammar: [g.zeoi-hou-better, g.m-hou-dont], vocab: [w.zeoi3-hou2.b, w.jau1-sik1] }
      - { es: "最好飲多啲暖水。", en: "It's best to drink more warm water.", altEs: ["你最好飲多啲暖水。", "最好多飲啲暖水。"], altEn: ["You should drink plenty of warm water."], grammar: [g.zeoi-hou-better], vocab: [w.zeoi3-hou2.b, w.nyun5, w.seoi2] }
      - { es: "你最好唔好食辣嘢同凍嘢。", en: "You'd better not eat spicy or cold food.", altEs: ["最好唔好食辣嘢同凍嘢。", "你最好唔好食辣嘢，凍嘢都唔好。"], grammar: [g.zeoi-hou-better, g.m-hou-dont], vocab: [w.laat6, w.dung3] }
      - { es: "不如去睇醫生啦，你咳咗成個禮拜喇。", en: "Why don't you see a doctor, you've been coughing for a whole week.", altEs: ["不如去睇醫生啦，咳咗成個禮拜喇。"], grammar: [g.zeoi-hou-better, g.duration], vocab: [w.bat1-jyu4, w.kat1] }
      - { es: "呢啲藥一日食三次，飯後食。", en: "Take this medicine three times a day, after meals.", altEs: ["呢啲藥一日食三次，食完飯先食。"], grammar: [g.body-pain], vocab: [w.joek6, w.sik6-joek6, w.faan6-hau6, w.ci3] }
      - { es: "藥房喺診所隔籬。", en: "The pharmacy is next to the clinic.", altEs: ["藥房就喺診所隔籬。", "間藥房喺診所隔籬。"], grammar: [g.hai2-location, g.position-words], vocab: [w.joek6-fong4, w.gaak3-lei4] }
      - { es: "食咗藥，佢好返好多喇。", en: "Since taking the medicine, he's a lot better.", altEs: ["佢食咗藥，好返好多喇。", "食咗藥之後，佢好返好多喇。"], altEn: ["She's much better now that she's taken the medicine."], grammar: [g.laa3-change, g.zo-perfective], vocab: [w.hou2-faan1, w.sik6-joek6] }
      - { es: "我背脊好痛，最好唔好拎重嘢。", en: "My back really hurts, I'd better not carry anything heavy.", altEs: ["我背脊好痛，最好唔好拎咁重嘅嘢。"], grammar: [g.zeoi-hou-better, g.body-pain], vocab: [w.bui3-zek3, w.cung5] }
      - { es: "你條腰仲痛唔痛呀？", en: "Does your lower back still hurt?", altEs: ["你條腰仲痛唔痛？", "你條腰仲係咪好痛呀？"], grammar: [g.a-not-a-questions, g.body-pain], vocab: [w.jiu1] }
      - { es: "醫生叫我戒口，唔准食辣嘢。", en: "The doctor told me to watch what I eat, no spicy food allowed.", altEs: ["醫生叫我戒口，唔可以食辣嘢。"], grammar: [g.giu-someone, g.jiu-must-m-sai], vocab: [w.gaai3-hau2, w.m4-zeon2] }
      - { es: "你應該早啲瞓，身體健康最重要。", en: "You should go to bed earlier, your health matters most.", altEs: ["你應該早啲去瞓覺，身體健康最重要。"], grammar: [g.zeoi-superlative], vocab: [w.jing1-goi1, w.gin6-hong1, w.zung6-jiu3] }
      - { es: "你個肚仲痛，唞吓先啦。", jp: "nei5 go3 tou5 zung6 tung3 tau2 haa5 sin1 laa1", en: "Your stomach still hurts, have a rest first.", altEs: ["你個肚仲痛，唞一陣先啦。"], grammar: [g.laa1-suggestion, g.sin-zoi-sequence], vocab: [w.tou5, w.tau2] }
      - { es: "香港睇醫生好方便，每條街都有診所。", en: "Seeing a doctor in Hong Kong is very convenient, there are clinics on every street.", altEs: ["喺香港睇醫生好方便，每條街都有診所。"], grammar: [g.dou-also], vocab: [w.fong1-bin6, w.can2-so2] }
      - { es: "最好唔好飲凍嘢，飲熱茶啦。", en: "Better not have cold drinks, have hot tea.", altEs: ["最好唔好飲凍飲，飲熱茶啦。"], grammar: [g.zeoi-hou-better, g.laa1-suggestion], vocab: [w.dung3, w.jit6] }
      - { es: "你最好唔好食辣嘢。", en: "You'd better not eat spicy food.", altEs: ["最好唔好食辣嘢。"], grammar: [g.zeoi-hou-better], vocab: [w.zeoi3-hou2.b, w.laat6], error: { wrong: "你唔最好食辣嘢。", explain: "'Better not' is 最好唔好 + verb; 唔 never goes in front of 最好.", grammar: g.zeoi-hou-better } }
      - { es: "你休息吓。", jp: "nei5 jau1 sik1 haa5", en: "Rest a bit.", altEs: ["你休息吓啦。"], grammar: [g.haa-briefly], vocab: [w.jau1-sik1], transform: { instruction: "Turn it into advice with 最好", answer: "你最好休息吓。", alt: ["你最好休息吓啦。", "最好休息吓。"], en: "You'd better have a rest." } }
      - { es: "我哋坐的士去醫院。", en: "We're taking a taxi to the hospital.", altEs: ["我哋搭的士去醫院。"], grammar: [g.transport-verbs], vocab: [w.dik1-si2, w.ji1-jyun2], transform: { instruction: "Make it a soft suggestion with 不如…啦", answer: "不如我哋坐的士去醫院啦。", alt: ["不如我哋搭的士去醫院啦。", "不如坐的士去醫院啦。"], en: "Why don't we take a taxi to the hospital?" } }
    exchanges:
      - q: { es: "醫生，我要食幾耐藥呀？", en: "Doctor, how long do I have to take the medicine for?" }
        a: { es: "食三日，一日三次。", en: "Three days, three times a day." }
        alt: ["三日。", "食三日，飯後食。"]
        grammar: [g.duration]
        vocab: [w.sik6-joek6, w.ci3]
      - q: { es: "我可唔可以飲凍嘢呀？", en: "Can I have cold drinks?" }
        a: { es: "最好唔好，飲暖水好啲。", en: "Better not, warm water is better." }
        alt: ["最好唔好。", "唔得，飲暖水啦。"]
        grammar: [g.zeoi-hou-better, g.ho-ji-can-may]
        vocab: [w.zeoi3-hou2.b, w.nyun5]
      - q: { es: "你好返未呀？", en: "Are you better yet?" }
        a: { es: "好返好多喇，多謝。", en: "Much better now, thanks." }
        alt: ["仲未好返。", "好啲喇。", "好返喇。"]
        grammar: [g.mei-questions, g.laa3-change]
        vocab: [w.hou2-faan1]
      - q: { es: "邊度有藥房呀？", en: "Where's a pharmacy?" }
        a: { es: "診所隔籬就有一間。", en: "There's one right next to the clinic." }
        alt: ["隔籬有一間。", "前面有一間。"]
        grammar: [g.position-words, g.zau-then]
        vocab: [w.joek6-fong4, w.gaak3-lei4]
      - q: { es: "我條腰好痛，我應該點做呀？", en: "My lower back really hurts, what should I do?" }
        a: { es: "你最好唞吓，唔好拎咁多嘢。", en: "You'd better rest and not carry so much." }
        alt: ["你最好休息吓。", "不如去睇醫生啦。"]
        grammar: [g.zeoi-hou-better, g.m-hou-dont]
        vocab: [w.jiu1, w.tau2]
    texts:
      - title: "醫生嘅話"
        es: ["呢啲藥一日食三次，飯後食。", "你最好戒口，唔好食辣嘢同煎嘢。", "如果三日之後都未好返，就再嚟啦。"]
        en: ["Take this medicine three times a day, after meals.", "You'd better watch your diet: no spicy or fried food.", "If you're not better after three days, come back."]
        grammar: [g.zeoi-hou-better, g.jyu-gwo-zau]
        vocab: [w.faan6-hau6, w.gaai3-hau2, w.hou2-faan1]
    spicy:
      - { es: "醫生話我最好多啲笑，所以我嚟搵你。", en: "The doctor said I'd better laugh more, so I came to find you.", altEs: ["醫生話我最好多啲笑，所以我嚟咗搵你。"], grammar: [g.zeoi-hou-better, g.jan-wai-so-ji], vocab: [w.zeoi3-hou2.b, w.siu3] }
      - { es: "你最好唔好望住我笑，我會唔記得食藥。", en: "You'd better not smile at me like that, I'll forget to take my medicine.", altEs: ["你最好唔好對住我笑，我會唔記得食藥。"], grammar: [g.zeoi-hou-better, g.wui-will], vocab: [w.sik6-joek6, w.m4-gei3-dak1] }
      - { es: "不如我陪你戒口啦，你食咩我就食咩。", en: "Why don't I watch my diet with you: whatever you eat, I'll eat.", altEs: ["不如我陪你戒口啦，你食乜我就食乜。"], grammar: [g.zeoi-hou-better, g.laa1-suggestion], vocab: [w.gaai3-hau2, w.pui4] }
      - { es: "你嘅藥就係我：一日見三次，飯後見。", en: "I'm your medicine: see me three times a day, after meals.", altEs: ["我就係你嘅藥：一日見三次，飯後見。"], grammar: [g.body-pain], vocab: [w.joek6, w.faan6-hau6] }
      - { es: "你最好唞吓，我喺度陪住你。", jp: "nei5 zeoi3 hou2 tau2 haa5 ngo5 hai2 dou6 pui4 zyu6 nei5", en: "You'd better rest, I'll stay here with you.", altEs: ["你最好休息吓，我喺度陪住你。"], grammar: [g.zeoi-hou-better, g.zyu-continuous], vocab: [w.tau2, w.pui4] }
dialogues:
  - id: a2.u08.d1
    title: 喺紅磡睇醫生
    context: The morning after a concert at the Hong Kong Coliseum, Leo goes to a clinic in Hung Hom.
    lines:
      - { speaker: 醫生, es: "你好，你邊度唔舒服呀？", en: "Hello, what seems to be the problem?" }
      - { speaker: Leo, es: "醫生，我喉嚨好痛，仲有啲發燒。", en: "Doctor, my throat really hurts and I've got a bit of a fever." }
      - { speaker: 醫生, es: "痛咗幾耐呀？", en: "How long has it been hurting?" }
      - { speaker: Leo, es: "由尋晚開始。我喺紅館睇演唱會，大聲唱咗三個鐘。", en: "Since last night. I was at a concert at the Coliseum and sang at the top of my voice for three hours." }
      - { speaker: 醫生, es: "張開口，講「啊」。你喉嚨好紅，有冇咳呀？", en: "Open your mouth and say 'ah'. Your throat is very red. Are you coughing?" }
      - { speaker: Leo, es: "有少少咳，但係冇流鼻水。", en: "A little bit of a cough, but no runny nose." }
      - { speaker: 醫生, es: "你感冒咗，唔係好嚴重。呢啲藥一日食三次，飯後食。", en: "You've caught a cold, it's not very serious. Take this medicine three times a day after meals." }
      - { speaker: Leo, es: "我今晚仲想去睇多場演唱會，得唔得呀？", en: "I'd like to go to another concert tonight, is that OK?" }
      - { speaker: 醫生, es: "你最好唔好去喇。如果聽日仲發燒，就要再嚟睇我。", en: "You'd better not go. If you still have a fever tomorrow, come back and see me." }
      - { speaker: Leo, es: "好啦，噉我留喺屋企休息啦。", en: "All right, then I'll stay home and rest." }
    questions:
      - { q: "Leo邊度唔舒服？", options: ["喉嚨痛同發燒", "肚痛同嘔", "隻腳受傷"], answer: 0, explain: "Leo says 我喉嚨好痛，仲有啲發燒." }
      - { q: "Leo點解喉嚨痛？", options: ["因為佢食咗辣嘢", "因為佢喺紅館大聲唱歌", "因為佢飲咗凍嘢"], answer: 1, explain: "He sang loudly for three hours at a concert at the Coliseum." }
      - { q: "醫生叫Leo今晚做咩？", options: ["去睇演唱會", "留喺屋企休息", "去急症室"], answer: 1, explain: "The doctor says 你最好唔好去喇, so Leo stays home to rest." }
      - { q: "如果聽日仲發燒，Leo要做咩？", options: ["再嚟睇醫生", "去藥房買藥", "叫救護車"], answer: 0, explain: "如果聽日仲發燒，就要再嚟睇我: come back to the doctor." }
