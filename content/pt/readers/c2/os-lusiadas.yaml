id: r.c2.os-lusiadas
level: c2
title: "Os Lusíadas: as armas e os barões"
kind: literature
author: Luís Vaz de Camões (c. 1524–1580)
source: "Os Lusíadas (1572): Canto I, estâncias 1–3; Canto III, estância 120; Canto IV, estâncias 94–95; Canto V, estância 39. Ortografia parcialmente atualizada. Domínio público. Os parágrafos em prosa são uma introdução escrita para este curso."
intro: "Seven stanzas from Portugal's national epic, which tells the story of Vasco da Gama's voyage to India (1497–1499). The eight lines of each stanza (ABABABCC, ten syllables) are separated by slashes. Expect Latinate inversion, archaic forms (cũa, ũa, cum, fermoso, aspeito) and mythology; read the English line by line, then the Portuguese aloud. The prose paragraphs, in European Portuguese, are the course's own introduction."
allow: [camões, luís, vaz, gama, vasco, lusíadas, lusitana, lusitano, taprobana, grego, troiano, alexandro, trajano, neptuno, marte, musa, inês, castro, mondego, adamastor, restelo, belém, índia, calecute, tormentório, boa, esperança, macau, goa, coimbra, áfrica, ásia, ceilão, sri, lanka]
paragraphs:
  - { es: "Publicado em 1572, Os Lusíadas conta a viagem de Vasco da Gama, que partiu da praia do Restelo, em Belém, em 1497, e chegou à Índia no ano seguinte, abrindo o caminho marítimo para o Oriente. Mas o verdadeiro herói do poema não é Gama: é o povo português, os “lusíadas”, descendentes míticos de Luso. Camões, que conhecera a guerra em África, a prisão e o naufrágio, escreveu-o ao longo de anos de exílio no Oriente; conta a lenda que, num naufrágio perto da costa do atual Camboja, salvou o manuscrito a nado, segurando-o acima da água.", en: "Published in 1572, The Lusiads tells of the voyage of Vasco da Gama, who left from the beach of Restelo, in Belém, in 1497 and reached India the following year, opening the sea route to the East. But the true hero of the poem is not Gama: it is the Portuguese people, the 'Lusiads', mythical descendants of Lusus. Camões, who had known war in Africa, prison and shipwreck, wrote it over years of exile in the East; legend has it that in a shipwreck off the coast of present-day Cambodia he saved the manuscript by swimming, holding it above the water." }
  - { es: "CANTO I, 1. As armas e os barões assinalados / Que da ocidental praia Lusitana / Por mares nunca de antes navegados / Passaram ainda além da Taprobana, / Em perigos e guerras esforçados / Mais do que prometia a força humana, / E entre gente remota edificaram / Novo Reino, que tanto sublimaram;", en: "CANTO I, 1. The arms and the illustrious men / who from the western Lusitanian shore / over seas never sailed before / passed even beyond Taprobana (Sri Lanka), / in dangers and wars more valiant / than human strength promised, / and among remote peoples built / a new Kingdom, which they so exalted;" }
  - { es: "2. E também as memórias gloriosas / Daqueles Reis que foram dilatando / A Fé, o Império, e as terras viciosas / De África e de Ásia andaram devastando, / E aqueles que por obras valerosas / Se vão da lei da Morte libertando, / Cantando espalharei por toda parte, / Se a tanto me ajudar o engenho e arte.", en: "2. and also the glorious memories / of those Kings who went on spreading / the Faith and the Empire, and laid waste / the sinful lands of Africa and Asia, / and those who by valiant deeds / free themselves from the law of Death — / singing, I shall spread them everywhere, / if talent and art help me so far." }
  - { es: "3. Cessem do sábio Grego e do Troiano / As navegações grandes que fizeram; / Cale-se de Alexandro e de Trajano / A fama das vitórias que tiveram; / Que eu canto o peito ilustre Lusitano, / A quem Neptuno e Marte obedeceram. / Cesse tudo o que a Musa antiga canta, / Que outro valor mais alto se alevanta.", en: "3. Let the great voyages of the wise Greek (Ulysses) / and the Trojan (Aeneas) cease to be told; / let the fame of the victories of Alexander / and Trajan be silenced; / for I sing the illustrious Lusitanian heart, / which Neptune and Mars obeyed. / Let all that the ancient Muse sings cease, / for another, higher valour arises." }
  - { es: "O episódio mais famoso do Canto III é a morte de Inês de Castro, a dama galega amada pelo príncipe D. Pedro e mandada matar em Coimbra, em 1355, por razões de Estado. Camões trata-a como uma heroína trágica, apanhada pela Fortuna no meio da felicidade.", en: "The most famous episode of Canto III is the death of Inês de Castro, the Galician lady loved by Prince Pedro and put to death in Coimbra in 1355 for reasons of State. Camões treats her as a tragic heroine, caught by Fortune in the midst of happiness." }
  - { es: "CANTO III, 120. Estavas, linda Inês, posta em sossego, / De teus anos colhendo doce fruto, / Naquele engano da alma, ledo e cego, / Que a Fortuna não deixa durar muito, / Nos saudosos campos do Mondego, / De teus fermosos olhos nunca enxuto, / Aos montes ensinando e às ervinhas / O nome que no peito escrito tinhas.", en: "CANTO III, 120. You were at peace, lovely Inês, / gathering the sweet fruit of your years, / in that happy, blind self-deception of the soul / which Fortune does not let last long, / in the longing fields of the Mondego, / with your beautiful eyes never dry, / teaching the hills and the little grasses / the name you had written in your heart." }
  - { es: "No momento da partida, no Restelo, entre a multidão que chora, ergue-se um velho que condena a viagem. O “Velho do Restelo” tornou-se em Portugal o nome de quem se opõe a qualquer novidade, mas o seu discurso é mais profundo do que isso: é a voz que lembra o preço da glória.", en: "At the moment of departure, at Restelo, amid the weeping crowd, an old man rises who condemns the voyage. The 'Old Man of Restelo' has become, in Portugal, the name for anyone who opposes any novelty, but his speech is deeper than that: it is the voice that recalls the price of glory." }
  - { es: "CANTO IV, 94. Mas um velho, de aspeito venerando, / Que ficava nas praias, entre a gente, / Postos em nós os olhos, meneando / Três vezes a cabeça, descontente, / A voz pesada um pouco alevantando, / Que nós no mar ouvimos claramente, / Cum saber só de experiências feito, / Tais palavras tirou do experto peito:", en: "CANTO IV, 94. But an old man of venerable appearance, / who stayed on the beach among the people, / with his eyes fixed on us, shaking / his head three times, displeased, / raising his heavy voice a little, / so that we heard it clearly at sea, / with a wisdom made only of experience, / drew these words from his expert breast:" }
  - { es: "95. — Ó glória de mandar, ó vã cobiça / Desta vaidade a quem chamamos Fama! / Ó fraudulento gosto, que se atiça / Cũa aura popular, que honra se chama! / Que castigo tamanho e que justiça / Fazes no peito vão que muito te ama! / Que mortes, que perigos, que tormentas, / Que crueldades neles experimentas!", en: "95. 'O glory of command, O vain greed / for this vanity we call Fame! / O fraudulent pleasure, kindled / by a popular breeze that is called honour! / What great punishment and what justice / you deal out to the vain heart that loves you much! / What deaths, what dangers, what storms, / what cruelties you put them through!'" }
  - { es: "CANTO V, 39. Não acabava, quando ũa figura / Se nos mostra no ar, robusta e válida, / De disforme e grandíssima estatura; / O rosto carregado, a barba esquálida, / Os olhos encovados, e a postura / Medonha e má e a cor terrena e pálida; / Cheios de terra e crespos os cabelos, / A boca negra, os dentes amarelos.", en: "CANTO V, 39. I had not finished when a figure / appeared to us in the air, robust and strong, / of misshapen and enormous stature; / its face scowling, its beard filthy, / its eyes sunken, and its bearing / fearsome and evil, its colour earthy and pale; / its hair full of earth and curly, / its mouth black, its teeth yellow." }
  - { es: "É o gigante Adamastor, o Cabo das Tormentas transformado em monstro, que ameaça os navegadores que ousaram entrar no seu mar. Mais adiante, o próprio gigante conta a sua história: foi um dos titãs, apaixonou-se por uma ninfa do mar e, castigado pelos deuses, viu o seu corpo transformar-se em terra e rochedo, cercado para sempre pelas ondas da mulher que amava. Depois de vencido o cabo, ele passaria a chamar-se da Boa Esperança: em quatro estâncias, Camões resume toda a ambição e todo o medo de um século.", en: "It is the giant Adamastor, the Cape of Storms turned into a monster, who threatens the navigators who dared to enter his sea. Further on, the giant himself tells his story: he was one of the Titans, fell in love with a sea nymph and, punished by the gods, saw his body turn into earth and rock, surrounded for ever by the waves of the woman he loved. Once the cape had been rounded, it would come to be called the Cape of Good Hope: in four stanzas Camões sums up all the ambition and all the fear of a century." }
questions:
  - { q: "Quem é o verdadeiro herói de Os Lusíadas?", options: ["Vasco da Gama sozinho", "O gigante Adamastor", "O povo português, os “lusíadas”", "Inês de Castro"], answer: 2, explain: "The introduction explains that the hero is collective: the Portuguese people, mythical descendants of Lusus." }
  - { q: "Na estância 3 do Canto I, o que o poeta pede?", options: ["Que se calem as glórias antigas, porque o valor português é mais alto", "Que se cantem os heróis gregos e troianos", "Que Neptuno destrua as naus", "Que a Musa o ajude a esquecer"], answer: 0, explain: "'Cesse tudo o que a Musa antiga canta, / Que outro valor mais alto se alevanta' — Portuguese deeds surpass those of Ulysses, Aeneas, Alexander and Trajan." }
  - { q: "Qual é o “engano da alma, ledo e cego” de Inês?", options: ["Uma doença", "A felicidade do amor, que a Fortuna não deixa durar", "Uma mentira que ela contou", "A ambição de ser rainha"], answer: 1, explain: "Her happy, blind illusion is her love and contentment, which Fortune soon destroys." }
  - { q: "O que critica o Velho do Restelo?", options: ["A falta de coragem dos marinheiros", "O mau tempo", "A cobiça e a vaidade da glória, que custam mortes e sofrimento", "A religião"], answer: 2, explain: "'Ó glória de mandar, ó vã cobiça' — he denounces the price of fame and empire." }
  - { q: "Que figura representa o Cabo das Tormentas?", options: ["Neptuno", "O gigante Adamastor", "Inês de Castro", "O Velho do Restelo"], answer: 1, explain: "Adamastor is the personification of the Cape of Storms, later the Cape of Good Hope." }
  - { q: "Que traço da sintaxe clássica se vê em “As armas e os barões assinalados (…) Cantando espalharei”?", options: ["O objeto aparece muito antes do verbo principal, por inversão", "O verbo vem sempre primeiro", "Não há verbos", "Usa-se o gerúndio como sujeito"], answer: 0, explain: "The objects of 'cantando espalharei' (the arms, the men, the memories) occupy almost two stanzas before the main verb arrives — Latinate hyperbaton." }
