id: r.b2.se-eu-morasse-em-salvador
level: b2
title: Se eu morasse em Salvador
kind: text
intro: A columnist from São Paulo returns from a week in Salvador and daydreams about the life she would have if she lived there. The text is built on the imperfect subjunctive and unreal conditions.
allow: [salvador, bahia, pelourinho, barra, rio, vermelho, itapuã, bonfim, iemanjá, olodum, lacerda, ok, dendê]
paragraphs:
  - { es: "Voltei de Salvador há três dias e ainda não consegui voltar completamente. O corpo está em São Paulo, no trânsito da Marginal, mas a cabeça continua lá, num fim de tarde no Farol da Barra. Por isso, resolvi fazer um exercício perigoso: imaginar como seria a minha vida se eu morasse em Salvador.", en: "I got back from Salvador three days ago and I still haven't completely come back. My body is in São Paulo, in the traffic on the Marginal, but my head is still there, at the end of an afternoon at the Farol da Barra. So I decided to do a dangerous exercise: imagine what my life would be like if I lived in Salvador." }
  - { es: "Se eu morasse em Salvador, acordaria mais cedo, não por obrigação, mas porque o sol entraria pela janela às cinco e meia sem pedir licença. Tomaria café olhando o mar, e não a parede do prédio vizinho. Talvez eu trocasse o metrô lotado por um ônibus que passasse pela orla, e chegaria ao trabalho atrasada, como todo mundo, mas sem ninguém reclamar.", en: "If I lived in Salvador, I'd wake up earlier, not out of obligation, but because the sun would come in through the window at half past five without asking permission. I'd have breakfast looking at the sea, not at the wall of the building next door. Maybe I'd swap the packed metro for a bus that ran along the seafront, and I'd get to work late, like everyone else, but without anyone complaining." }
  - { es: "Se eu morasse lá, o almoço de sexta-feira seria sagrado. Comeria moqueca com pirão numa barraca à beira-mar e, no fim da tarde, um acarajé da baiana da esquina, com vatapá, camarão e muita pimenta, embora o meu estômago paulista talvez não concordasse. Aprenderia, enfim, a diferença entre o acarajé e o abará, que até hoje me confunde.", en: "If I lived there, Friday lunch would be sacred. I'd eat moqueca with pirão at a stall by the sea and, at the end of the afternoon, an acarajé from the baiana on the corner, with vatapá, shrimp and lots of chilli, even though my São Paulo stomach might not agree. I'd finally learn the difference between acarajé and abará, which still confuses me." }
  - { es: "Se eu vivesse em Salvador, subiria as ladeiras do Pelourinho sem pressa, toda terça-feira, para ouvir os tambores do Olodum ensaiando. Entenderia melhor por que a cidade, que foi a primeira capital do Brasil e um dos maiores portos de pessoas escravizadas das Américas, é hoje o centro da cultura afro-brasileira. Talvez eu frequentasse uma roda de capoeira, ainda que só para assistir, e quem sabe um dia tivesse coragem de entrar.", en: "If I lived in Salvador, I'd climb the steep streets of Pelourinho without hurrying, every Tuesday, to hear the Olodum drums rehearsing. I'd understand better why the city, which was Brazil's first capital and one of the largest ports for enslaved people in the Americas, is today the centre of Afro-Brazilian culture. Maybe I'd go to a capoeira circle, even if only to watch, and who knows, one day I'd have the courage to join in." }
  - { es: "No dia dois de fevereiro, eu me vestiria de branco e levaria flores para Iemanjá, no Rio Vermelho, junto com milhares de pessoas. Na segunda quinta-feira de janeiro, participaria da lavagem do Bonfim e amarraria no pulso uma fitinha colorida, fazendo três pedidos. Dizem que, se a gente cortasse a fita antes de ela cair sozinha, os pedidos não se realizariam. Eu nunca cortaria.", en: "On the second of February, I'd dress in white and take flowers to Iemanjá, in Rio Vermelho, together with thousands of people. On the second Thursday of January, I'd take part in the washing of Bonfim and tie a coloured ribbon round my wrist, making three wishes. They say that if you cut the ribbon before it falls off by itself, the wishes won't come true. I'd never cut it." }
  - { es: "Claro que eu sei que isso é uma fantasia de turista. Se eu realmente morasse em Salvador, enfrentaria problemas que o visitante não vê: o desemprego alto, a desigualdade, a violência em alguns bairros, o calor que não dá trégua em março. Os amigos baianos que conheci fizeram questão de me lembrar disso, com o bom humor de quem ama a cidade, mas não a idealiza.", en: "Of course I know this is a tourist's fantasy. If I really lived in Salvador, I'd face problems the visitor doesn't see: high unemployment, inequality, violence in some neighbourhoods, the heat that gives no respite in March. The Bahian friends I met made a point of reminding me of that, with the good humour of people who love the city but don't idealise it." }
  - { es: "Mesmo assim, se alguém me oferecesse amanhã um emprego em Salvador, não sei se eu teria coragem de recusar. Por enquanto, guardo a fitinha do Bonfim no pulso, já meio desbotada, e repito a mim mesma que, se eu não posso morar lá, pelo menos posso voltar. E vou voltar.", en: "Even so, if someone offered me a job in Salvador tomorrow, I don't know if I'd have the courage to say no. For now, I keep the Bonfim ribbon on my wrist, already a bit faded, and I tell myself that if I can't live there, at least I can go back. And I'm going back." }
questions:
  - { q: "Por que a autora diria que acordaria mais cedo em Salvador?", options: ["Por obrigação do trabalho", "Porque o sol entraria pela janela muito cedo", "Por causa do barulho do trânsito"], answer: 1, explain: "«Acordaria mais cedo, não por obrigação, mas porque o sol entraria pela janela às cinco e meia.»" }
  - { q: "O que confunde a autora até hoje?", options: ["A diferença entre acarajé e abará", "O caminho até o Pelourinho", "O sotaque baiano"], answer: 0, explain: "«Aprenderia, enfim, a diferença entre o acarajé e o abará, que até hoje me confunde.»" }
  - { q: "Segundo o texto, o que Salvador foi no passado?", options: ["A capital do Império", "A primeira capital do Brasil e um grande porto de pessoas escravizadas", "Uma pequena vila de pescadores"], answer: 1, explain: "The city «foi a primeira capital do Brasil e um dos maiores portos de pessoas escravizadas das Américas»." }
  - { q: "O que acontece, segundo a tradição, se você cortar a fitinha do Bonfim?", options: ["Ganha mais três pedidos", "Os pedidos não se realizam", "Tem que voltar a Salvador"], answer: 1, explain: "«Se a gente cortasse a fita antes de ela cair sozinha, os pedidos não se realizariam.»" }
  - { q: "Qual é a atitude dos amigos baianos da autora?", options: ["Idealizam a cidade", "Amam a cidade, mas lembram os seus problemas", "Querem mudar para São Paulo"], answer: 1, explain: "They reminded her of the problems «com o bom humor de quem ama a cidade, mas não a idealiza»." }
