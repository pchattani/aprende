id: r.b2.fired-and-stood-up
level: b2
title: 炒魷魚同放飛機
kind: dialogue
intro: Over late-night snacks, Kelvin tells Mandy about the worst week of his life. Their conversation is packed with everyday Cantonese idioms - see how many you can work out before reading the glossary.
paragraphs:
  - { es: "星期五夜晚十一點，Mandy同Kelvin喺佐敦一間糖水舖食宵夜。Kelvin一坐低就嘆氣：「唉，我今個禮拜真係衰到貼地。」Mandy：「咩事呀？你個樣好似食咗死貓噉。」", en: "At eleven on Friday night, Mandy and Kelvin were having a late-night snack at a dessert shop in Jordan. As soon as Kelvin sat down he sighed: \"Ugh, this week has been an absolute disaster.\" Mandy: \"What's wrong? You look like you've been blamed for something you didn't do.\"" }
  - { es: "Kelvin：「你講啱咗，我真係食死貓。星期一，我哋部門有份報告寄錯咗畀客戶，其實係我同事擺烏龍，但係老細以為係我做嘅。我想解釋，佢話：『唔使講耶穌喇，下次小心啲。』我成肚氣。」", en: "Kelvin: \"You've got it - I really did get the blame. On Monday our department sent a report to the wrong client. Actually it was my colleague who messed up, but the boss thought it was me. I tried to explain, and he said: 'Spare me the sermon, just be more careful next time.' I was fuming.\"" }
  - { es: "Mandy：「咁你點解唔同佢講清楚呀？」Kelvin：「我個同事係老細嘅親戚嚟㗎，我講咗都冇用啦。仲有更衰嘅：星期三，公司話要裁員，我哋組有兩個人畀人炒魷魚。好彩唔係我，不過而家個個都驚到腳軟。」", en: "Mandy: \"So why didn't you set him straight?\" Kelvin: \"That colleague is the boss's relative - it'd be no use even if I said something. And there's worse: on Wednesday the company announced layoffs, and two people in our team got fired. Luckily not me, but now everyone's scared stiff.\"" }
  - { es: "Mandy：「嘩，咁都幾慘喎。不過你冇事就好。」Kelvin：「重未講完呀！星期四我約咗個女仔睇戲，等咗佢一個鐘，佢都冇出現。打電話又冇人聽。最後佢send咗個message畀我，話佢唔記得咗，同朋友去咗打邊爐。我畀人放飛機呀！」", en: "Mandy: \"Wow, that's pretty rough. But at least you're OK.\" Kelvin: \"I haven't finished yet! On Thursday I'd arranged to see a film with a girl. I waited an hour and she never showed up. No answer when I called either. Finally she sent me a message saying she'd forgotten and gone for hotpot with her friends. I got stood up!\"" }
  - { es: "Mandy忍唔住笑咗出嚟：「對唔住，我唔係笑你……好啦，我係笑你。你上次咪話佢好有心嘅？」Kelvin：「我以為佢有心啫，原來佢只係口痕，同咩人都噉傾。我而家完全心淡喇。」", en: "Mandy couldn't help laughing: \"Sorry, I'm not laughing at you... OK, I am laughing at you. Didn't you say last time that she was really thoughtful?\" Kelvin: \"I thought she was, but it turns out she just likes to chat - she talks like that with everyone. I've completely lost interest now.\"" }
  - { es: "Mandy：「其實呢，你成日都太容易信人，耳仔又軟，人哋講乜你都信。你記唔記得舊年你個表哥叫你買嗰隻股票？結果蝕咗兩萬蚊。」Kelvin：「你唔好再提喇，我已經頭大到爆。」", en: "Mandy: \"Honestly, you always trust people too easily. You're so gullible, you believe whatever anyone tells you. Remember last year when your cousin told you to buy that stock? You ended up losing twenty thousand dollars.\" Kelvin: \"Please don't bring that up again, my head's already about to explode.\"" }
  - { es: "Mandy：「好啦好啦。講返正經嘢，你份工應該冇問題嘅，你做嘢咁勤力，老細唔會咁冇眼光啩。至於嗰個女仔，佢甩你底，係佢執輸，唔係你。」Kelvin：「你真係識講嘢。不過我諗我都係要搵份新工，我唔想日日喺公司提心吊膽。」", en: "Mandy: \"All right, all right. Seriously though, your job should be fine. You work so hard; surely your boss isn't that blind. As for the girl, if she stood you up, it's her loss, not yours.\" Kelvin: \"You really know what to say. But I think I'm going to look for a new job anyway. I don't want to spend every day at work on tenterhooks.\"" }
  - { es: "Mandy：「好呀，我支持你。不過今晚唔好諗啲咁大頭嘅嘢喇，食多碗芝麻糊先，我請！」Kelvin：「Mandy，你真係好人。噉我要兩碗！」Mandy：「喂，你唔好得寸進尺呀！」", en: "Mandy: \"Good, I'll back you. But don't think about such big things tonight. Have another bowl of black sesame soup - my treat!\" Kelvin: \"Mandy, you really are a good person. In that case I'll have two bowls!\" Mandy: \"Hey, don't push your luck!\"" }
questions:
  - { q: "「食死貓」係乜嘢意思？", options: ["食咗唔好食嘅嘢", "幫人孭黑鑊，畀人冤枉", "好肚餓"], answer: 1, explain: "食死貓 means taking the blame for something you didn't do: Kelvin's colleague made the mistake." }
  - { q: "邊個擺烏龍寄錯份報告？", options: ["Kelvin", "Kelvin嘅同事", "老細"], answer: 1, explain: "其實係我同事擺烏龍，但係老細以為係我做嘅." }
  - { q: "Kelvin公司有幾多人畀人炒魷魚？", options: ["冇人", "兩個", "成個部門"], answer: 1, explain: "我哋組有兩個人畀人炒魷魚. Kelvin kept his job." }
  - { q: "「放飛機」喺呢度係乜嘢意思？", options: ["約咗人但係冇出現", "去機場", "玩紙飛機"], answer: 0, explain: "The girl never showed up for their film date: 我畀人放飛機呀！" }
  - { q: "Mandy覺得Kelvin嘅缺點係乜嘢？", options: ["太懶", "耳仔軟，太容易信人", "太孤寒"], answer: 1, explain: "你成日都太容易信人，耳仔又軟." }
  - { q: "最後Mandy點解話「你唔好得寸進尺」？", options: ["因為Kelvin要兩碗芝麻糊", "因為Kelvin遲到", "因為Kelvin唔想搵新工"], answer: 0, explain: "Mandy offers one more bowl and Kelvin asks for two." }
glossary:
  - { es: 糖水舖, en: dessert shop }
  - { es: 嘆氣, en: to sigh }
  - { es: 衰到貼地, en: unlucky in the extreme }
  - { es: 成肚氣, en: "fuming, full of anger" }
  - { es: 裁員, en: to lay off staff }
  - { es: 組, en: "team, group" }
  - { es: send, en: to send (a message) }
  - { es: message, en: (text) message }
  - { es: 蝕, en: to lose (money) }
  - { es: 頭大到爆, en: totally stressed out }
  - { es: 正經嘢, en: serious matters }
  - { es: 甩底, en: "to stand someone up, fail to show" }
  - { es: 提心吊膽, en: on tenterhooks }
  - { es: 芝麻糊, en: black sesame soup }
  - { es: 得寸進尺, en: to give an inch and take a mile }
  - { es: 孭黑鑊, en: to take the blame }
  - { es: 冤枉, en: "to wrong (someone), accuse unjustly" }
