      - { es: "Você está com frio? Quer o meu casaco?", en: "Are you cold? Do you want my jacket?", altEs: ["Tá com frio? Quer o meu casaco?", "Você está com frio? Quer meu casaco?"], grammar: [g.estar-com, g.querer-present], vocab: [w.frio.n, w.casaco] }
      - { es: "As crianças estão com sono.", en: "The children are sleepy.", grammar: [g.estar-com], vocab: [w.criança, w.sono] }
      - { es: "Estou com pressa: o samba começa às dez.", en: "I'm in a hurry: the samba starts at ten.", altEs: ["Tô com pressa: o samba começa às dez.", "Estou com pressa, o samba começa às dez."], grammar: [g.estar-com, g.telling-time], vocab: [w.pressa, w.começar] }
      - { es: "O Leo está com medo do mar.", en: "Leo is scared of the sea.", altEs: ["O Leo tem medo do mar."], altEn: ["Leo is afraid of the sea."], grammar: [g.estar-com, g.contractions-de], vocab: [w.medo, w.mar] }
      - { es: "Estou com saudade da minha família.", en: "I miss my family.", altEs: ["Estou com saudades da minha família.", "Tô com saudade da minha família."], grammar: [g.estar-com, g.contractions-de], vocab: [w.saudade, w.família], note: "saudade has no one-word English equivalent: a longing for someone or something you love." }
      - { es: "Ele está com dor de cabeça.", en: "He has a headache.", altEs: ["Ele tá com dor de cabeça."], altEn: ["He's got a headache."], grammar: [g.estar-com], vocab: [w.dor, w.cabeça] }
      - { es: "Depois do samba, estou com dor nos pés.", en: "After the samba, my feet hurt.", altEs: ["Depois do samba, tô com dor nos pés."], altEn: ["After the samba, I've got sore feet."], grammar: [g.estar-com, g.contractions-em], vocab: [w.dor, w.pé, w.depois] }
      - { es: "Que calor! Estou com muita sede.", en: "It's so hot! I'm really thirsty.", altEs: ["Que calor! Tô com muita sede."], grammar: [g.estar-com], vocab: [w.calor, w.sede] }
      - { es: "Estou com frio, vamos entrar.", en: "I'm cold, let's go in.", altEs: ["Tô com frio, vamos entrar."], grammar: [g.estar-com], vocab: [w.frio.n, w.entrar], error: { wrong: "Estou frio, vamos entrar.", explain: "Estou frio means you are cold to the touch; to feel cold, say estou com frio.", grammar: g.estar-com } }
      - { es: "A mão dele está fria.", en: "His hand is cold.", altEs: ["A mão dele tá fria."], grammar: [g.ser-vs-estar-basics, g.possessives], vocab: [w.mão, w.frio] }
      - { es: "Depois da academia, estou com dor no corpo todo.", en: "After the gym, my whole body aches.", altEs: ["Depois da academia, tô com dor no corpo todo."], grammar: [g.estar-com, g.todo-tudo], vocab: [w.corpo, w.dor, w.academia] }
      - { es: "O cachorro tem orelhas grandes.", en: "The dog has big ears.", altEs: ["O cachorro tem as orelhas grandes."], grammar: [g.adjective-position, g.ter-present], vocab: [w.orelha, w.cachorro] }
      - { es: "O Cristo Redentor está de braços abertos para a cidade.", en: "Christ the Redeemer has his arms open to the city.", altEn: ["Christ the Redeemer stands with open arms over the city."], grammar: [g.estar-present], vocab: [w.braço, w.cidade] }
      - { es: "Eu estou com sono.", en: "I'm sleepy.", altEs: ["Estou com sono.", "Tô com sono."], grammar: [g.estar-com], vocab: [w.sono], transform: { instruction: "Change to 'we'", answer: "Nós estamos com sono.", alt: ["Estamos com sono.", "A gente está com sono."], en: "We're sleepy." } }
