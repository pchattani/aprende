# C2 grammar notes (the French-speaking world, ending in Québec City).
# Explanations use light markdown: ### headings, bullets, tables, **bold**,
# *italic* (italic = French inline).
- id: g.belgian-french
  level: c2
  title: "Belgian French: une fois, savoir, s'il vous plaît, endéans"
  summary: "Standard French with Belgian vocabulary (GSM, kot, drache, chicon, pistolet), grammar (savoir = pouvoir, avoir facile), politeness (s'il vous plaît when handing over) and the filler une fois."
  explanation: |
    About 4.5 million people speak French in Belgium (Wallonia and, with Dutch, Brussels). The grammar is standard; the differences are mostly in vocabulary, a few constructions and the influence of Dutch and Walloon.

    ### Vocabulary
    | Belgium | France | English |
    |---|---|---|
    | *un GSM* | *un portable* | mobile phone |
    | *un kot* | *une chambre d'étudiant* | student room |
    | *la drache* | *l'averse* | downpour |
    | *un chicon* | *une endive* | chicory |
    | *un pistolet* | *un petit pain* | bread roll |
    | *une farde* | *une chemise, un classeur* | folder |
    | *un essuie* | *une serviette* | towel |
    | *une friterie / fritkot* | *une baraque à frites* | chip stall |
    | *la toilette* | *les toilettes* | the toilet |
    | *endéans* | *dans un délai de* | within |

    ### Grammar and usage
    - *savoir* = be able to: *Je ne sais pas venir demain.* (France: *je ne peux pas*)
    - *avoir facile / difficile*: *J'ai difficile avec les maths.* (I find maths hard)
    - *une fois* as a softener: *Viens ici une fois.* (just come here) — often caricatured.
    - *s'il vous plaît* when handing something over (France: *voilà / tenez*).
    - *À tantôt !* = see you later today; *tantôt* = this afternoon.
    - *Il n'y a pas de quoi* → also *Avec plaisir !* as "you're welcome".

    Numbers *septante, nonante* and meal names *déjeuner, dîner, souper* are covered in their own notes.
  examples:
    - { es: "Tu me passes ton GSM une fois ?", en: "Can you pass me your phone?" }
    - { es: "Il drache depuis ce matin sur la Grand-Place.", en: "It's been pouring on the Grand-Place since this morning." }
    - { es: "Je ne sais pas venir ce soir, j'ai trop de travail.", en: "I can't come tonight, I've got too much work." }
    - { es: "Voici votre cornet de frites, s'il vous plaît.", en: "Here's your cone of chips." }
  pitfalls:
    - "*Je ne sais pas venir* means 'I can't come' in Belgium, not 'I don't know how to come'."
    - "Don't overuse *une fois*: Belgians are tired of the caricature."
  variant: "Many Belgian words are shared with northern France (Lille, Picardy) or Switzerland (*septante, nonante, souper*)."
  related: [g.regional-numbers, g.regional-meals, g.swiss-french]
  drills:
    - { es: "On se voit à tantôt ?", en: "See you later today?" }
    - { es: "Elle loue un kot à Louvain-la-Neuve.", en: "She rents a student room in Louvain-la-Neuve." }
    - { es: "Vous devez répondre endéans les huit jours.", en: "You must reply within a week." }
- id: g.regional-numbers
  level: c2
  title: "Septante, huitante, nonante: regional numbers"
  summary: "Belgium and Switzerland: septante (70), nonante (90); Vaud, Valais and Fribourg: huitante (80). France, Québec and most of Africa: soixante-dix, quatre-vingts, quatre-vingt-dix."
  explanation: |
    | number | France, Québec, most of Africa | Belgium | Switzerland (Romandie) |
    |---|---|---|---|
    | 70 | *soixante-dix* | ***septante*** | ***septante*** |
    | 71 | *soixante et onze* | *septante et un* | *septante et un* |
    | 80 | *quatre-vingts* | *quatre-vingts* | ***huitante*** (Vaud, Valais, Fribourg) / *quatre-vingts* (Geneva, Neuchâtel, Jura) |
    | 90 | *quatre-vingt-dix* | ***nonante*** | ***nonante*** |
    | 99 | *quatre-vingt-dix-neuf* | *nonante-neuf* | *nonante-neuf* |

    ### History
    The forms *septante, octante, nonante* are the older Latin-based ones and were used in France until the 17th century; standard French then generalised the vigesimal (base-20) forms. *Octante* survives only in old texts.

    ### Ordinals and derived words
    *septantième, nonantième*; *les années septante* (the seventies); *un nonagénaire* (in all varieties).

    Understanding both systems is essential when hearing prices and phone numbers in Brussels or Geneva.
  examples:
    - { es: "Ça fait septante-cinq euros, s'il vous plaît.", en: "That's seventy-five euros, please. (Belgium)" }
    - { es: "Mon grand-père a huitante-deux ans.", en: "My grandfather is eighty-two. (Vaud)" }
    - { es: "Le tram nonante-deux passe toutes les dix minutes.", en: "The number 92 tram comes every ten minutes." }
  pitfalls:
    - "Belgians say *quatre-vingts*, not *huitante*."
    - "Don't mix systems in one text: *septante* with *quatre-vingt-dix* sounds odd."
  related: [g.numbers-70-100, g.belgian-french, g.swiss-french]
  drills:
    - { es: "Il y a septante personnes dans la salle.", en: "There are seventy people in the room." }
    - { es: "Elle est née en mille neuf cent nonante.", en: "She was born in 1990." }
    - { es: "Ça coûte nonante francs.", en: "It costs ninety francs." }
- id: g.regional-meals
  level: c2
  title: "Déjeuner, dîner, souper: meals across the French-speaking world"
  summary: "France: petit-déjeuner / déjeuner / dîner. Belgium, Switzerland, Québec (and Cajun Louisiana): déjeuner / dîner / souper."
  explanation: |
    | meal | France | Belgium, Switzerland, Québec |
    |---|---|---|
    | breakfast | *le petit-déjeuner* | ***le déjeuner*** |
    | lunch | *le déjeuner* | ***le dîner*** |
    | dinner, evening meal | *le dîner* | ***le souper*** |
    | late-night meal | *le souper* (after a show) | — |

    The verbs follow: *déjeuner, dîner, souper*. Québec: *Qu'est-ce qu'on mange pour souper ?*

    ### Why?
    The Belgian–Swiss–Québec system is the **older** French system (17th–18th c.). Paris shifted meal times later in the 19th century, so the names slid along: *déjeuner* (literally "break the fast") became lunch, and breakfast became *petit-déjeuner*.

    ### Practical advice
    An invitation *à dîner* in Montréal or Lausanne means **lunch**. Ask *à quelle heure ?* if in doubt.

    Other food terms: *la collation* (snack, Québec, Belgium), *le goûter* (afternoon snack, France), *les quatre-heures* (Switzerland).
  examples:
    - { es: "À Montréal, on dîne vers midi et on soupe vers dix-huit heures.", en: "In Montreal people have lunch around noon and dinner around six." }
    - { es: "Tu viens dîner à la maison dimanche ? On mange à midi et demi.", en: "Are you coming for lunch on Sunday? We eat at half past twelve." }
    - { es: "Au déjeuner, les Belges aiment les tartines au chocolat.", en: "At breakfast Belgians like bread with chocolate spread." }
  pitfalls:
    - "*Dîner* in Brussels, Geneva or Québec is lunch: don't turn up at eight in the evening."
    - "*Souper* in France is a late supper after the theatre."
  related: [g.belgian-french, g.swiss-french, g.quebec-vocabulary]
  drills:
    - { es: "Qu'est-ce qu'on mange pour souper ?", en: "What are we having for dinner? (Québec)" }
    - { es: "On dîne à la cafétéria à midi.", en: "We have lunch in the cafeteria at noon. (Québec)" }
    - { es: "Le déjeuner est servi à sept heures.", en: "Breakfast is served at seven. (Switzerland)" }
- id: g.swiss-french
  level: c2
  title: "Swiss French: natel, votation, ça joue, adieu"
  summary: "Romandie French: vocabulary from Franco-Provençal, German and local institutions (natel, panosse, votation, syndic), expressions like ça joue ?, service !, and adieu as a greeting."
  explanation: |
    About two million people speak French in Switzerland (Romandie: Geneva, Vaud, Neuchâtel, Jura, French-speaking Valais and Fribourg).

    ### Vocabulary
    | Switzerland | France | English |
    |---|---|---|
    | *un natel* | *un portable* | mobile phone |
    | *une panosse* | *une serpillière* | mop, floor cloth |
    | *un cornet* | *un sac (en plastique)* | carrier bag |
    | *la bonne-main* | *le pourboire* | tip |
    | *une votation* | *un référendum* | popular vote |
    | *le / la syndic(que)* | *le maire* | mayor (Vaud, Fribourg) |
    | *s'encoubler* | *trébucher* | to trip |
    | *un linge* | *une serviette* | towel |
    | *un bancomat* | *un distributeur* | cash machine |
    | *la maturité* | *le baccalauréat* | school-leaving exam |

    ### Expressions
    - *Ça joue ?* — Is that OK? / *Ça joue !* — That's fine.
    - *Service !* — You're welcome.
    - *Adieu !* — hello or goodbye in parts of Romandie (in France: farewell forever).
    - *À tout bientôt*, *y a pas le feu au lac* (there's no hurry).
    - *septante, huitante, nonante*; *déjeuner, dîner, souper*.

    The Swiss *passé surcomposé* (*quand j'ai eu fini*) is more alive than in France.
  examples:
    - { es: "Je t'appelle sur ton natel ce soir, ça joue ?", en: "I'll call you on your mobile tonight, OK?" }
    - { es: "Les Genevois votent ce dimanche sur une nouvelle loi.", en: "The people of Geneva vote this Sunday on a new law." }
    - { es: "Merci beaucoup ! — Service !", en: "Thank you very much! — You're welcome!" }
    - { es: "Doucement, y a pas le feu au lac !", en: "Take it easy, there's no rush!" }
  pitfalls:
    - "*Adieu* as a greeting is Swiss and southern French; in Paris it sounds like a final farewell."
    - "*Natel* was a brand name: it's understood only in Switzerland."
  related: [g.belgian-french, g.regional-numbers, g.regional-meals]
  drills:
    - { es: "Tu as un cornet ?", en: "Have you got a bag?" }
    - { es: "Je me suis encoublé dans l'escalier.", en: "I tripped on the stairs." }
    - { es: "On laisse la bonne-main au serveur.", en: "We leave the tip for the waiter." }
- id: g.stylistic-registers
  level: c2
  title: "Stylistic control: shifting register within and between texts"
  summary: "Master the full range from argot to littéraire; recognise the five common register labels (populaire, familier, courant, soutenu, littéraire) and switch deliberately for effect."
  explanation: |
    ### Five registers
    | register | features | example (to die) |
    |---|---|---|
    | *populaire / argotique* | slang, verlan, grammar "errors" | *crever, clamser* |
    | *familier* | no *ne*, *ça*, short forms | *casser sa pipe* |
    | *courant* | neutral standard | *mourir* |
    | *soutenu* | inversion, rare words, nominal style | *décéder, s'éteindre* |
    | *littéraire / poétique* | passé simple, imparfait du subjonctif, figures | *rendre l'âme, trépasser* |

    ### Levers of register
    - **Lexis**: *bouquin / livre / ouvrage*, *bagnole / voiture / véhicule*.
    - **Syntax**: interrogation, negation, dislocation, inversion, subordination depth.
    - **Tense system**: passé composé vs passé simple.
    - **Sound**: e-caduc deletion, liaisons facultatives (more liaisons = more formal).

    ### Deliberate shifts
    Writers and speakers mix registers for **irony** (formal words for trivial things: *Je me suis sustenté d'un sandwich*), **emphasis**, or **characterisation** (dialogue). Diplomats in Geneva master the *langue de bois* (wooden language): abstract nouns, passive, hedging.

    C2 control means you can choose — and you know what each choice signals.
  examples:
    - { es: "Le délégué a pris acte des préoccupations exprimées par les parties.", en: "The delegate took note of the concerns expressed by the parties." }
    - { es: "Bon, en clair, ils sont pas d'accord, quoi.", en: "Basically, they don't agree." }
    - { es: "Je me suis sustenté d'un modeste sandwich au bord du lac.", en: "I sustained myself with a humble sandwich by the lake. (ironic)" }
  pitfalls:
    - "Unintended mixing (a slang word in a formal letter) looks like a mistake, not style."
    - "*Soutenu* is not the same as pompous: clarity first."
  related: [g.register-levels, g.figures-of-style, g.literary-prose-style]
  drills:
    - { es: "Il a cassé sa pipe.", en: "He kicked the bucket. (familiar)" }
    - { es: "Elle s'est éteinte paisiblement.", en: "She passed away peacefully. (formal)" }
    - { es: "Nous prenons acte de votre décision.", en: "We take note of your decision." }
- id: g.feminisation
  level: c2
  title: "Feminine job titles and inclusive writing"
  summary: "la ministre, une autrice / auteure, une professeure, une cheffe; inclusive options: doublets (toutes et tous), epicene words (les personnes), the point médian (étudiant·e·s), and the debated pronoun iel."
  explanation: |
    ### Feminine job titles
    Québec led the way (official recommendations from 1979), followed by Belgium (1993) and Switzerland; in France the Académie française accepted feminisation in 2019.

    | pattern | examples |
    |---|---|
    | same form, article changes | *la ministre, la juge, la médecin, une architecte* |
    | -e | *une avocate, une députée, une professeure, une auteure* |
    | -eur → -euse | *une chercheuse, une footballeuse* |
    | -teur → -trice | *une directrice, une autrice, une rectrice* |
    | -ier → -ière | *une pompière, une policière* |
    | special | *une cheffe, une écrivaine, une maire* |

    *Auteure* and *professeure* are frequent in Québec and Switzerland; *autrice* is now widespread in France and Belgium.

    ### Inclusive writing (écriture inclusive)
    | technique | example |
    |---|---|
    | doublets | *les citoyennes et les citoyens, toutes et tous* |
    | epicene / collective nouns | *les personnes, le public, le corps enseignant, les élèves* |
    | point médian (contested) | *les étudiant·e·s* |
    | neutral pronoun (rare, contested) | *iel* (in Le Robert online since 2021) |

    France's education ministry banned the point médian in schools in 2021; many administrations prefer doublets and epicene words.
  examples:
    - { es: "La ministre a rencontré les ambassadrices à Genève.", en: "The minister met the ambassadors in Geneva." }
    - { es: "Mesdames et Messieurs, chères citoyennes et chers citoyens…", en: "Ladies and gentlemen, dear citizens…" }
    - { es: "Elle est autrice de plusieurs romans.", en: "She's the author of several novels." }
  pitfalls:
    - "*Madame le ministre* is now old-fashioned in most contexts; *Madame la ministre* is standard."
    - "Choose one inclusive strategy per text and apply it consistently."
  related: [g.gender-nouns, g.stylistic-registers, g.neologisms]
  drills:
    - { es: "Notre directrice est absente.", en: "Our director is away." }
    - { es: "Bonjour à toutes et à tous.", en: "Hello everyone." }
    - { es: "C'est une excellente cheffe.", en: "She's an excellent chef." }
- id: g.african-french
  level: c2
  title: "French in Africa: Senegal, Côte d'Ivoire, Congo, Cameroon"
  summary: "Vocabulary created locally (essencerie, dibiterie, grin), shifted meanings (gâter, fréquenter, doigter), loans from Wolof, Lingala and others, emphatic -là, and urban varieties such as nouchi and camfranglais."
  explanation: |
    French is an official language in some twenty African countries, and Africa is where most of its daily users live and where the language is growing fastest.

    ### Local creations and shifted meanings
    | word | where | meaning |
    |---|---|---|
    | *une essencerie* | Senegal | petrol station (a coinage attributed to Senghor) |
    | *une dibiterie* | Senegal | grilled-meat stall |
    | *le grin* | Mali, Burkina Faso | group of friends drinking tea |
    | *gâter* | West Africa | to break (*la radio est gâtée*) |
    | *fréquenter* | widespread | to go to school (*il fréquente encore*) |
    | *un maquis* | Côte d'Ivoire | open-air restaurant |
    | *un taxi-brousse* | widespread | bush taxi |
    | *la Téranga* (Wolof) | Senegal | hospitality |
    | *On dit quoi ?* | Cameroon | What's up? |
    | *Je suis en route* | widespread | I'm on my way |

    ### Grammar and discourse
    - Emphatic postposed *-là*: *La fille-là, elle est forte.*
    - *Il y a quoi ?* (What's going on?), *Tu as fait comment ?*
    - Rich greeting rituals; *tonton, tata* for elders.

    ### Urban varieties
    *Nouchi* (Abidjan) and *camfranglais* (Cameroon) mix French with local languages and English; in Kinshasa, French alternates with Lingala.

    These are full varieties with their own norms — not "errors".
  examples:
    - { es: "Il faut passer à l'essencerie avant de quitter Dakar.", en: "We need to stop at the petrol station before leaving Dakar." }
    - { es: "Ma radio est gâtée depuis hier.", en: "My radio has been broken since yesterday." }
    - { es: "Bienvenue au Sénégal, le pays de la Téranga !", en: "Welcome to Senegal, the land of hospitality!" }
    - { es: "Le garçon-là, il fréquente toujours ?", en: "That boy, is he still at school?" }
  pitfalls:
    - "Don't treat African varieties as 'bad French': many words fill real gaps."
    - "Avoid imitating accents or slang you don't master: it can come across as mockery."
  related: [g.francophonie-overview, g.neologisms, g.creole-and-french]
  drills:
    - { es: "On dit quoi ?", en: "What's up? (Cameroon)" }
    - { es: "On va manger au maquis ce soir.", en: "We're going to eat at the open-air restaurant tonight." }
    - { es: "Je suis en route, j'arrive.", en: "I'm on my way, I'll be there soon." }
- id: g.francophonie-overview
  level: c2
  title: "La Francophonie: history, institutions and debates"
  summary: "francophonie (the French-speaking world) vs Francophonie (the OIF); some 320 million speakers; a history of empire, Senghor's vision, and debates on norms, identity and power."
  explanation: |
    ### Two words
    - ***francophonie*** (small f): all the people and places where French is spoken.
    - ***Francophonie*** (capital F): the institution, the *Organisation internationale de la Francophonie* (OIF), with some 88 member, associate and observer states and governments.

    ### Key facts
    | | |
    |---|---|
    | speakers | about 320 million (OIF estimate, 2022) |
    | founding | 1970 in Niamey (Agence de coopération culturelle et technique), driven by Senghor (Senegal), Bourguiba (Tunisia), Diori (Niger) and Sihanouk (Cambodia) |
    | largest French-speaking city | Kinshasa (DR Congo), ahead of Paris by population |
    | official status | French is official in about 30 countries |

    ### Debates
    - **Colonial legacy**: French spread through empire; writers like Kateb Yacine called it a "butin de guerre" (spoils of war).
    - **Norm**: whose French is correct? Dictionaries now include Belgian, Swiss, Québec and African words.
    - **Littérature-monde**: the 2007 manifesto rejecting the label *littérature francophone* as a hierarchy with Paris at the centre.
    - **Multilingualism**: in Africa French usually coexists with national languages.
  examples:
    - { es: "Senghor voyait dans la Francophonie un humanisme intégral.", en: "Senghor saw the Francophonie as an integral humanism." }
    - { es: "Kinshasa est aujourd'hui la plus grande ville francophone du monde.", en: "Kinshasa is now the largest French-speaking city in the world." }
    - { es: "Pour beaucoup d'écrivains, le français est une langue en partage, non une propriété de la France.", en: "For many writers, French is a shared language, not France's property." }
  pitfalls:
    - "Capital F for the institution, small f for the linguistic community."
    - "Speaker figures vary with the definition of 'speaker': cite the source."
  related: [g.african-french, g.neologisms, g.quebec-vocabulary]
  drills:
    - { es: "Le français est langue officielle dans une trentaine de pays.", en: "French is an official language in about thirty countries." }
    - { es: "La Journée de la Francophonie a lieu le 20 mars.", en: "International Francophonie Day is on 20 March." }
    - { es: "La francophonie est d'abord une réalité africaine.", en: "The French-speaking world is first of all an African reality." }
- id: g.versification
  level: c2
  title: "French verse: syllables, the alexandrin, rhyme and the sonnet"
  summary: "Count syllables, not stresses: the e muet counts before a consonant and is elided before a vowel or at line end. The alexandrin (12 syllables, caesura at 6), rhyme types and the sonnet."
  explanation: |
    ### Counting syllables
    - Every pronounced vowel counts; the ***e* muet** counts before a consonant, is **elided** before a vowel, and never counts at the end of a line.
    - *Diérèse* (splitting vowels: *li-on*, *pa-ssi-on*) and *synérèse* (merging) adjust the count.

    *Je / suis / bel / l'ô / mor / tels // com / m'un / rê / ve / de / pier(re)* — 12 syllables (Baudelaire, *La Beauté*).

    ### Common metres
    | metre | syllables | example |
    |---|---|---|
    | alexandrin | 12, caesura after 6 (*hémistiches*) | classical tragedy, Baudelaire |
    | décasyllabe | 10 | medieval epic |
    | octosyllabe | 8 | song, ballads |
    | hexasyllabe | 6 | *Il pleure dans mon cœur* (Verlaine) |
    | vers libre / verset | free | Apollinaire, Senghor's long *versets* |

    ### Rhyme
    - *Rimes plates* AABB, *croisées* ABAB, *embrassées* ABBA.
    - *Masculine* (no final e: *cœur / langueur*) vs *féminine* (*ville / tranquille*), traditionally alternated.
    - Richness: *pauvre* (1 shared sound), *suffisante* (2), *riche* (3+).

    ### Forms and effects
    The **sonnet**: two quatrains + two tercets (Rimbaud, *Le Dormeur du val*). **Enjambement** runs a sentence over the line; a ***rejet*** is the short word pushed to the next line for emphasis.
  examples:
    - { es: "Il pleure dans mon cœur / Comme il pleut sur la ville.", en: "There is weeping in my heart / As it rains on the town. (Verlaine)" }
    - { es: "Je suis belle, ô mortels ! comme un rêve de pierre.", en: "I am beautiful, O mortals, like a dream of stone. (Baudelaire)" }
    - { es: "Un alexandrin compte douze syllabes, avec une césure à l'hémistiche.", en: "An alexandrine has twelve syllables, with a caesura at the half-line." }
  pitfalls:
    - "Count the *e* muet before a consonant inside the line: *bel-le ro-se* = 4 syllables."
    - "Rhyme is about sound, not spelling: *pied / clé* rhyme."
  related: [g.poetic-syntax, g.figures-of-style, g.elision-liaison]
  drills:
    - { es: "Le sonnet compte quatorze vers.", en: "The sonnet has fourteen lines." }
    - { es: "Les rimes sont embrassées : ABBA.", en: "The rhymes are enclosed: ABBA." }
    - { es: "Ce vers présente un enjambement.", en: "This line has an enjambment." }
- id: g.neologisms
  level: c2
  title: "Neologisms: how French makes new words"
  summary: "Derivation (ubériser), compounding (mot-dièse), blends (courriel, divulgâcher), clipping (texto, appli), loans (selfie / égoportrait), and official terminology commissions in France and Québec."
  explanation: |
    | process | examples |
    |---|---|
    | derivation | *ubériser, googliser, désintox, déconfinement* |
    | compounding | *mot-dièse* (hashtag), *mot de passe*, *covoiturage* |
    | blend (*mot-valise*) | *courriel* (courrier électronique), *divulgâcher* (divulguer + gâcher: spoil), *franglais*, *adulescent* |
    | clipping | *appli, texto, info, ado, resto* |
    | acronym | *sida, ovni, PACS (pacser)* |
    | loan | *selfie, liker, spoiler* |
    | semantic shift | *souris* (mouse), *toile* (web), *nuage* (cloud) |
    | African coinages | *essencerie, droit-de-l'hommiste* |

    ### Official terminology
    - France: the *Commission d'enrichissement de la langue française* publishes official terms in the *Journal officiel*: *logiciel* (software), *infox* (fake news, 2018), *mot-dièse*, *courriel*.
    - Québec: the *Office québécois de la langue française* (OQLF) proposes *courriel, clavardage* (chat), *égoportrait* (selfie), *balado* (podcast). Many Québec terms are more successful at home than France's.

    *Ordinateur* itself was coined in 1955 for IBM France by the philologist Jacques Perret.
  examples:
    - { es: "Ne me divulgâche pas la fin du film !", en: "Don't spoil the end of the film for me!" }
    - { es: "Le mot « courriel » vient du Québec.", en: "The word 'courriel' comes from Québec." }
    - { es: "L'ubérisation transforme le marché du travail à Kinshasa comme ailleurs.", en: "Uberisation is transforming the job market in Kinshasa as elsewhere." }
  pitfalls:
    - "Official terms are not always used in practice: *e-mail / mail* remains common in France."
    - "New verbs from English take regular -er endings: *je like, nous likons* (casual)."
  related: [g.derivation-affixes, g.anglicisms-calques, g.african-french]
  drills:
    - { es: "J'ai téléchargé une nouvelle appli.", en: "I've downloaded a new app." }
    - { es: "Il a publié un égoportrait.", en: "He posted a selfie. (Québec)" }
    - { es: "Méfiez-vous des infox.", en: "Beware of fake news." }
- id: g.verlan-slang
  level: c2
  title: "Verlan and argot: meuf, relou, ouf, chelou"
  summary: "Verlan reverses syllables (à l'envers → verlan): femme → meuf, fou → ouf, lourd → relou, louche → chelou. Argot: fric, bosser, kiffer, une bagnole. Recognise; use sparingly."
  explanation: |
    ### Verlan
    Syllables are inverted, and vowels often change:

    | word | verlan | meaning |
    |---|---|---|
    | *femme* | ***meuf*** | woman, girlfriend |
    | *mec* | ***keum*** | guy |
    | *fou* | ***ouf*** | crazy, amazing (*c'est ouf !*) |
    | *lourd* | ***relou*** | annoying |
    | *louche* | ***chelou*** | shady, weird |
    | *énervé* | ***vénère*** | angry |
    | *fête* | ***teuf*** | party |
    | *bizarre* | ***zarbi*** | weird |
    | *laisse tomber* | ***laisse béton*** | forget it (Renaud's 1977 song) |

    Some verlan words are re-verlanised: *meuf → feumeu*. Many (*meuf, ouf, relou*) are now everyday familiar French.

    ### Argot and familiar vocabulary
    *le fric, la thune* (money), *bosser* (work), *kiffer* (like, from Arabic), *une bagnole* (car), *un pote* (mate), *la bouffe* (food), *se casser* (leave), *grave* (really: *je kiffe grave*), *wesh* (hey).

    ### Across the Francophonie
    Every city has its slang: *nouchi* in Abidjan, *indoubil* in Kinshasa, *joual* in Montréal, *brusseleir* in Brussels.
  examples:
    - { es: "C'est ouf, cette ville !", en: "This city is amazing!" }
    - { es: "Il est trop relou, ton pote.", en: "Your mate is so annoying." }
    - { es: "On va à une teuf ce soir ?", en: "Shall we go to a party tonight?" }
    - { es: "Je kiffe grave cette chanson.", en: "I really love this song." }
  pitfalls:
    - "Slang ages fast and depends on milieu: what's cool for teenagers can sound ridiculous from an adult learner."
    - "Some slang is offensive or ethnically loaded: know the word before you use it."
  related: [g.register-levels, g.wordplay, g.neologisms]
  drills:
    - { es: "C'est chelou, ce bruit.", en: "That noise is weird." }
    - { es: "Laisse béton !", en: "Forget it!" }
    - { es: "J'ai plus de thune.", en: "I'm out of cash." }
- id: g.wordplay
  level: c2
  title: "Wordplay: calembours, contrepèteries and double meanings"
  summary: "Puns on homophones (calembours), sound swaps (contrepèteries: Sonnez, trompettes ! → Trompez, sonnettes !), punning names (Assurancetourix), headlines and ads."
  explanation: |
    French is rich in **homophones** (*vers, vert, verre, ver, vair*; *mer, mère, maire*), which fuels wordplay.

    | device | example | how it works |
    |---|---|---|
    | *calembour* (pun) | *Quel est le comble pour un électricien ? Ne pas être au courant.* | double meaning (*courant* = current / informed) |
    | punning names | *Astérix, Obélix, Assurancetourix* (*assurance tous risques*), *Panoramix* | names that hide phrases |
    | *contrepèterie* | *Sonnez, trompettes !* → *Trompez, sonnettes !* | swap sounds between words |
    | *à-peu-près* | *Il fait un froid de canard* → *un froid de Canada* | near-homophone |
    | *mot-valise* | *franglais, divulgâcher* | blend |
    | *holorime* | lines that sound alike | full-line homophony |
    | *antanaclase* | *Le cœur a ses raisons que la raison ne connaît point* (Pascal) | same word, two meanings |
    | Belgian surrealism | *Ceci n'est pas une pipe* (Magritte) | word vs image |

    ### Where you meet it
    Headlines (*Libération* and *Le Canard enchaîné* are famous for them), shop names (*Hair du temps*, *Au pain de mon cœur*), ads, comedy and song lyrics — from Brussels comics to Kinshasa rumba.

    Contrepèteries are often risqué; recognising one is a mark of advanced fluency, but be careful whom you tell it to.
  examples:
    - { es: "Le salon de coiffure s'appelle « L'Hair du temps ».", en: "The hairdresser's is called 'L'Hair du temps' (a pun on l'air du temps, the spirit of the times)." }
    - { es: "Assurancetourix, c'est « assurance tous risques ».", en: "Cacofonix's French name is 'comprehensive insurance'." }
    - { es: "Sonnez, trompettes ! Trompez, sonnettes !", en: "Sound, trumpets! Deceive, doorbells! (a contrepèterie)" }
  pitfalls:
    - "Puns rarely survive translation: explain, don't translate."
    - "Many contrepèteries hide a vulgar meaning: check before repeating one."
  related: [g.verlan-slang, g.figures-of-style, g.press-headlines]
  drills:
    - { es: "Le maire est allé à la mer avec sa mère.", en: "The mayor went to the seaside with his mother." }
    - { es: "Il a bu un verre vert.", en: "He drank a green glass." }
    - { es: "Ceci n'est pas une pipe.", en: "This is not a pipe." }
- id: g.creole-and-french
  level: c2
  title: "Antillean Créole and French"
  summary: "Martinican and Guadeloupean Créole take most words from French but have their own grammar: invariable verbs with markers ka, té, ké; postposed article -la; pronouns mwen, ou, i, nou, zot, yo."
  explanation: |
    Créole is a **language in its own right**, born on the plantations of the 17th century from contact between French and African languages. It is recognised as a regional language of France and taught in schools; French and Créole coexist in daily life (*diglossia*).

    ### Grammar at a glance (Martinique)
    | | Créole | French |
    |---|---|---|
    | pronouns | *mwen, ou, i, nou, zot, yo* | je, tu, il/elle, nous, vous, ils |
    | present / progressive | *mwen **ka** manjé* | je mange / je suis en train de manger |
    | past | *mwen **té** manjé* | j'avais mangé / je mangeais |
    | future | *mwen **ké** manjé* | je mangerai |
    | completed | *mwen manjé* | j'ai mangé |
    | negation | *mwen **pa** sav* | je ne sais pas |
    | definite article (after the noun) | *liv**-la*** | le livre |
    | plural | ***sé** liv-la* | les livres |

    The verb never changes; meaning comes from small markers placed before it.

    ### Literature
    Aimé Césaire wrote in French (*Cahier d'un retour au pays natal*, 1939) and coined *négritude*. Later, Jean Bernabé, Patrick Chamoiseau and Raphaël Confiant's *Éloge de la créolité* (1989) championed Créole and a mixed, Caribbean identity; Chamoiseau's novels weave Créole into French.

    Common Créole words in Antillean French: *doudou* (darling), *zouk*, *ti-punch*, *an nou ay* (let's go).
  examples:
    - { es: "En créole martiniquais, « mwen ka manjé » veut dire « je mange ».", en: "In Martinican Créole, 'mwen ka manjé' means 'I'm eating'." }
    - { es: "Le créole n'est pas du français déformé, c'est une langue à part entière.", en: "Créole isn't distorted French; it's a language in its own right." }
    - { es: "Césaire a forgé le mot « négritude » dans les années 1930.", en: "Césaire coined the word 'négritude' in the 1930s." }
  pitfalls:
    - "Créole is not a dialect of French; speakers of standard French don't understand it without learning it."
    - "Haitian, Martinican, Guadeloupean, Guianese and Réunionese Créoles differ from each other."
  related: [g.african-french, g.francophonie-overview, g.figures-of-style]
  drills:
    - { es: "An nou ay !", en: "Let's go! (Créole)" }
    - { es: "Le créole est enseigné dans les écoles martiniquaises.", en: "Créole is taught in Martinican schools." }
    - { es: "Mwen pa sav.", en: "I don't know. (Créole)" }
- id: g.poetic-syntax
  level: c2
  title: "Poetic syntax: inversion, ellipsis, apostrophe and poetic licence"
  summary: "Poetry bends word order (De la musique avant toute chose), drops words (ellipsis), addresses absent beings (Ô temps, suspends ton vol !) and allows spellings like encor."
  explanation: |
    | device | example | effect |
    |---|---|---|
    | **inversion** (*hyperbate*) | *De la musique avant toute chose* (Verlaine) | foregrounds the key idea |
    | complement before the verb | *Mon cœur, lassé de tout, même de l'espérance…* | delays the main verb |
    | **ellipsis** | *Ici, le silence. Là-bas, la mer.* | compression |
    | **apostrophe** | *Ô temps ! suspends ton vol* (Lamartine) | direct address |
    | **anaphora** | *Ma bouche sera… ma voix…* (Césaire) | incantation |
    | **asyndeton** | *Je suis venu, j'ai vu…* | speed, accumulation |
    | **parallelism** | balanced clauses | rhythm |
    | poetic licence | *encor* for *encore*, *je croi* for *je crois* (rhyme, metre) | fits the metre |
    | archaic negation | *point* for *pas* | elevation |

    ### Reading tips
    1. Find the subject and main verb first; restore normal order in your head.
    2. Count syllables to understand elisions and licences.
    3. Ask what the unusual order emphasises.

    Césaire's *Cahier* mixes prose and verse, accumulation and anaphora, to build an oratorical rhythm.
  examples:
    - { es: "De la musique avant toute chose.", en: "Music above all else. (Verlaine)" }
    - { es: "Ô temps, suspends ton vol !", en: "O time, suspend your flight! (Lamartine)" }
    - { es: "Ma bouche sera la bouche des malheurs qui n'ont point de bouche.", en: "My mouth shall be the mouth of those calamities that have no mouth. (Césaire)" }
  pitfalls:
    - "Don't copy poetic inversion into prose: it sounds affected."
    - "*Point* in poetry = *pas*, not 'point'."
  related: [g.versification, g.figures-of-style, g.literary-inversion]
  drills:
    - { es: "Sous le pont Mirabeau coule la Seine.", en: "Under the Mirabeau bridge flows the Seine. (Apollinaire)" }
    - { es: "Ici, la mer ; là-bas, le volcan.", en: "Here, the sea; over there, the volcano." }
    - { es: "Ô mon pays, je te reviens.", en: "O my country, I return to you." }
- id: g.figures-of-style
  level: c2
  title: "Figures of style: métaphore, oxymore, chiasme, gradation…"
  summary: "Name and use the main figures: comparaison, métaphore, personnification, hyperbole, antithèse, oxymore, chiasme, anaphore, gradation, allitération, métonymie, périphrase."
  explanation: |
    | figure | definition | French example |
    |---|---|---|
    | *comparaison* | with *comme, tel, pareil à* | *belle comme le jour* |
    | *métaphore* | implicit comparison | *Cette île est un jardin.* |
    | *personnification* | human traits to things | *La ville dort.* |
    | *hyperbole* | exaggeration | *Je meurs de faim.* |
    | *antithèse* | opposed ideas | *Je vis, je meurs* (Louise Labé) |
    | *oxymore* | contradictory words joined | *Cette obscure clarté qui tombe des étoiles* (Corneille) |
    | *chiasme* | ABBA structure | *Il faut manger pour vivre et non pas vivre pour manger* (Molière) |
    | *anaphore* | repetition at the start | *Ma bouche… ma voix…* (Césaire) |
    | *gradation* | rising sequence | *Va, cours, vole, et nous venge* (Corneille) |
    | *allitération* | repeated consonants | *Pour qui sont ces serpents qui sifflent sur vos têtes ?* (Racine) |
    | *assonance* | repeated vowels | *Tout m'afflige et me nuit et conspire à me nuire* (Racine) |
    | *métonymie* | part / container for the whole | *boire un verre*, *l'Élysée a annoncé* |
    | *périphrase* | description instead of the name | *la Ville Lumière* (Paris), *l'île aux fleurs* (Martinique) |
    | *litote / euphémisme* | saying less (see C1) | *Va, je ne te hais point.* |

    Analysing a text (*commentaire*): name the figure, quote it, explain its **effect** — naming alone earns nothing.
  examples:
    - { es: "La Martinique, l'île aux fleurs, est une périphrase célèbre.", en: "Martinique, 'the island of flowers', is a famous periphrasis." }
    - { es: "« Cette obscure clarté qui tombe des étoiles » est un oxymore.", en: "'That dark light falling from the stars' is an oxymoron." }
    - { es: "Le vers de Racine imite le sifflement des serpents par une allitération en s.", en: "Racine's line imitates the hissing of snakes with an alliteration in s." }
  pitfalls:
    - "A comparison needs a comparison word (*comme*); without it, it's a metaphor."
    - "Always explain the effect of a figure, not just its name."
  related: [g.poetic-syntax, g.litotes-euphemism, g.stylistic-registers, g.wordplay]
  drills:
    - { es: "Paris, la Ville Lumière.", en: "Paris, the City of Light." }
    - { es: "Je meurs de soif.", en: "I'm dying of thirst." }
    - { es: "Un silence assourdissant.", en: "A deafening silence." }
- id: g.acadian-french
  level: c2
  title: "Acadian and Cajun French: asteur, je vas, ils parlont"
  summary: "French of the Maritime provinces and Louisiana, shaped by the 1755 deportation: old forms (asteur, icitte, itou), -ont in the 3rd plural (ils parlont), je vas, and heavy English contact (chiac, Cajun loans)."
  explanation: |
    ### History
    Acadia (today's Nova Scotia, New Brunswick, Prince Edward Island) was settled from western France in the 17th century. In 1755 the British deported thousands of Acadians (*le Grand Dérangement*); many eventually settled in Louisiana, where *Acadiens* became *Cadiens* / *Cajuns*.

    ### Features (shared by many Acadian and Cajun speakers)
    | feature | example | standard |
    |---|---|---|
    | *-ont* in the 3rd plural | *ils parl**ont**, ils mange**ont*** | *ils parlent* |
    | *je vas* | ***Je vas** au magasin.* | *je vais* |
    | old words | *asteur* (à cette heure = now), *icitte* (ici), *itou* (aussi), *ouère* (voir) | |
    | *espérer* = wait (Cajun) | *Espère-moi !* | *attends-moi* |
    | Cajun nature words | *chaoui* (raccoon), *bayou*, *boucane* (smoke) | |
    | English loans | *watcher la télé, checker, le truck* | *regarder, vérifier, le camion* |

    ### Chiac (Moncton)
    A mixed variety of French and English: *J'ai checké mes messages, pis c'était right weird.* — once stigmatised, now celebrated in songs and novels.

    ### Revival
    Louisiana's CODOFIL (1968) and immersion schools; New Brunswick is Canada's only officially bilingual province. Cajun music (accordion, fiddle) keeps the language alive: *Laissez les bons temps rouler !*
  examples:
    - { es: "Asteur, on va au bal cadien.", en: "Now we're going to the Cajun dance." }
    - { es: "Ils parlont français à la maison, mais anglais à l'école.", en: "They speak French at home but English at school. (Acadian)" }
    - { es: "Laissez les bons temps rouler !", en: "Let the good times roll!" }
    - { es: "Le Grand Dérangement a dispersé les Acadiens en 1755.", en: "The Great Upheaval scattered the Acadians in 1755." }
  pitfalls:
    - "*Je vas* and *ils parlont* are regular in these varieties, not mistakes; don't use them in standard written French."
    - "*Cadien* (French spelling) and *Cajun* (English) refer to the same people."
  related: [g.classical-french, g.quebecois-grammar, g.anglicisms-calques]
  drills:
    - { es: "Je vas t'espérer icitte.", en: "I'll wait for you here. (Cajun)" }
    - { es: "Moi itou.", en: "Me too. (Acadian)" }
    - { es: "Ils avont fini.", en: "They've finished. (Acadian)" }
- id: g.classical-french
  level: c2
  title: "Classical French: reading Molière and La Fontaine"
  summary: "17th-century French: clitic climbing (je le veux voir), ne … point, si = aussi, words whose meaning has changed (ennui, gêne, charmant, amant, honnête homme), and old spellings (il avoit)."
  explanation: |
    ### Grammar
    | classical | modern | |
    |---|---|---|
    | *Je **le** veux voir.* | *Je veux **le** voir.* | pronoun before the modal |
    | *Je **ne** le sais **point**.* | *Je ne le sais pas.* | *point* = pas |
    | *Il n'est **si** beau.* | *aussi beau* | *si* = aussi |
    | *devant que* + subj. | *avant que* | |
    | *Quand* + conditional | *même si* | *Quand il le voudrait…* |
    | subject pronoun omitted | *Suffit !*, *Fais ce que dois.* | fixed phrases |

    ### False friends in time
    | word | 17th century | today |
    |---|---|---|
    | *ennui* | deep despair, torment | boredom |
    | *gêne* | torture | embarrassment |
    | *étonner* | to stun (as by thunder) | to surprise |
    | *charmant* | bewitching (magic) | charming |
    | *amant* | one who loves and is loved (suitor) | lover |
    | *honnête homme* | cultivated, well-mannered gentleman | honest man |
    | *fortune* | fate, luck | wealth |

    ### Spelling
    Before 1835 imperfects were written *-oit*: *il avoit, ils étoient*. Many editions modernise this.

    ### La Fontaine
    *Maître Corbeau, sur un arbre perché, / Tenait en son bec un fromage.* — note the inversion and *en son bec* (= dans son bec).
  examples:
    - { es: "Rien ne sert de courir ; il faut partir à point.", en: "There's no point running; you must set off on time. (La Fontaine)" }
    - { es: "Il faut manger pour vivre, et non pas vivre pour manger.", en: "One must eat to live, not live to eat. (Molière)" }
    - { es: "Maître Corbeau, sur un arbre perché, tenait en son bec un fromage.", en: "Master Crow, perched on a tree, held a cheese in his beak. (La Fontaine)" }
  pitfalls:
    - "*L'ennui* in Racine is anguish, not boredom."
    - "*À point* in La Fontaine = at the right time, not 'medium rare'."
  related: [g.acadian-french, g.subjonctif-imparfait, g.ne-litteraire, g.literary-prose-style]
  drills:
    - { es: "Je ne le veux point.", en: "I do not want it. (classical)" }
    - { es: "La raison du plus fort est toujours la meilleure.", en: "Might is right. (La Fontaine)" }
    - { es: "Je le veux voir.", en: "I want to see him. (classical)" }
- id: g.anglicisms-calques
  level: c2
  title: "Anglicisms and calques: France vs Québec"
  summary: "France borrows English words freely (parking, week-end, mail) and invents fake ones (footing, brushing, pressing); Québec resists word loans (stationnement, fin de semaine, courriel) but absorbs calques (prendre une marche, à date, faire du sens)."
  explanation: |
    ### Word loans
    | France | Québec | English |
    |---|---|---|
    | *le parking* | *le stationnement* | car park |
    | *le week-end* | *la fin de semaine* | weekend |
    | *le mail / l'e-mail* | *le courriel* | email |
    | *faire du shopping* | *magasiner* | go shopping |
    | *STOP* (road sign) | *ARRÊT* | stop |
    | *le chat* | *le clavardage* | chat |
    | *un podcast* | *un balado* | podcast |

    ### Fake anglicisms (France)
    *le footing* (jogging), *le brushing* (blow-dry), *le pressing* (dry cleaner's), *un relooking* (makeover), *un tennisman*, *un camping-car* (motorhome), *le smoking* (dinner jacket).

    ### Calques (word-for-word translations)
    | calque | standard French | English |
    |---|---|---|
    | *prendre une marche* (Québec) | *faire une promenade* | take a walk |
    | *à date* (Québec) | *jusqu'à présent* | to date |
    | *faire du sens* (spreading everywhere) | *avoir du sens* | make sense |
    | *appliquer pour un emploi* | *postuler à un emploi* | apply for |
    | *être en charge de* | *être chargé de* | be in charge of |
    | *réaliser que* | *se rendre compte que* | realise |

    ### Language policy
    France's *loi Toubon* (1994) requires French in advertising, contracts and the workplace. Québec's *Charte de la langue française* (Bill 101, 1977) makes French the language of work, signs and schooling. In Louisiana, Cajun French takes English words freely (*watcher, le truck*).
  examples:
    - { es: "À Paris, on cherche un parking ; à Montréal, un stationnement.", en: "In Paris you look for a 'parking'; in Montreal, a 'stationnement'." }
    - { es: "Je vais faire un footing le long de la Seine.", en: "I'm going for a jog along the Seine." }
    - { es: "Ça a du sens, mais on entend de plus en plus « ça fait du sens ».", en: "It makes sense, but you increasingly hear 'ça fait du sens'." }
  pitfalls:
    - "*Footing, brushing, pressing* don't mean anything in English: don't use them abroad."
    - "Using France's anglicisms in Québec (*le week-end, le parking*) can sound careless; Québec's terms are understood in France."
  related: [g.quebec-vocabulary, g.neologisms, g.acadian-french]
  drills:
    - { es: "On magasine en fin de semaine.", en: "We go shopping at the weekend. (Québec)" }
    - { es: "Je me suis rendu compte de mon erreur.", en: "I realised my mistake." }
    - { es: "Elle a postulé à un emploi à Lafayette.", en: "She applied for a job in Lafayette." }
- id: g.quebecois-grammar
  level: c2
  title: "Québec French grammar: tu viens-tu ?, chu, pantoute"
  summary: "Spoken Québec French: the question particle -tu (C'est-tu loin ?), reduced forms (chu, j'vas, y'a), moé / toé, pantoute, être après + infinitive, à cause que, and affricated t/d (tu [tsy], dire [dzir])."
  explanation: |
    | feature | example | standard |
    |---|---|---|
    | question particle ***-tu*** | *Tu viens**-tu** ? C'est**-tu** loin ? Ça se peut**-tu** ?* | *Est-ce que tu viens ?* |
    | reduced *je suis* | ***Chu** fatigué.* | *Je suis fatigué.* |
    | *je vais* | ***J'vas** y aller.* | *Je vais y aller.* |
    | *il / lui* → *y* | ***Y** est parti. Dis-**y**.* | *Il est parti. Dis-lui.* |
    | *moé, toé* | *C'est pour **moé**.* | *moi, toi* |
    | ***pantoute*** | *J'aime pas ça **pantoute**.* | *pas du tout* |
    | *être après* + inf. | ***Chu après** manger.* | *Je suis en train de manger.* |
    | *à cause que* | *…**à cause qu'**il pleut.* | *parce que* |
    | *Qu'est-ce que* → *quessé* | ***Quessé** tu fais ?* | *Qu'est-ce que tu fais ?* |
    | *là* (filler) | *Je sais pas, **là**.* | |
    | *ça me tente* | *Ça me tente pas.* | *Je n'en ai pas envie.* |

    ### Pronunciation
    - *t, d* before *i, u* become [ts, dz]: *tu* [tsy], *dire* [dzir].
    - Long vowels diphthongise: *père* [paɛ̯ʁ], *fête*.
    - *-oi* can sound [we]: *moé, toé* (old Parisian pronunciation).

    ### Joual
    The most colloquial Montréal speech, named after the pronunciation of *cheval*; Michel Tremblay's play *Les Belles-sœurs* (1968) brought it to the stage.

    Formal Québec French (news, government) is close to the international standard.
  examples:
    - { es: "Tu viens-tu au show à soir ?", en: "Are you coming to the show tonight?" }
    - { es: "Chu pas mal fatigué, là.", en: "I'm pretty tired." }
    - { es: "J'ai pas aimé ça pantoute.", en: "I didn't like it at all." }
    - { es: "Est-ce que le métro est loin ? — C'est-tu loin, le métro ?", en: "Is the metro far? (standard / Québec)" }
  pitfalls:
    - "The *-tu* particle works with any subject: *Il vient-tu ?* (Is he coming?)."
    - "Don't imitate joual in formal settings or with people you don't know: it can sound mocking."
  related: [g.quebec-vocabulary, g.quebec-sacres, g.yes-no-questions, g.acadian-french]
  drills:
    - { es: "C'est-tu vrai ?", en: "Is that true?" }
    - { es: "Ça me tente pas.", en: "I don't feel like it." }
    - { es: "Y est où, ton char ?", en: "Where's your car?" }
- id: g.quebec-vocabulary
  level: c2
  title: "Québec vocabulary: char, dépanneur, tuque, blonde, magasiner"
  summary: "Everyday Québec words: char, dépanneur, tuque, bas, blonde / chum, jaser, achaler, niaiser, c'est plate, piasse, cellulaire, breuvage, bienvenue, allô."
  explanation: |
    | Québec | France | English |
    |---|---|---|
    | *un char* | *une voiture* | car |
    | *un dépanneur* | *une épicerie de quartier* | corner shop |
    | *une tuque* | *un bonnet* | woolly hat |
    | *des bas* | *des chaussettes* | socks |
    | *ma blonde / mon chum* | *ma copine / mon copain* | girlfriend / boyfriend (*chum* also = buddy) |
    | *jaser* | *bavarder* | to chat |
    | *achaler* | *embêter* | to bother |
    | *niaiser* | *plaisanter, perdre son temps* | to kid around |
    | *c'est plate* | *c'est ennuyeux* | it's boring |
    | *une piasse* | *un dollar* | a buck |
    | *un cellulaire / cell* | *un portable* | mobile |
    | *un breuvage* | *une boisson* | a drink |
    | *une liqueur* | *un soda* | a soft drink |
    | *une sacoche* | *un sac à main* | handbag |
    | *une gougoune* | *une tong* | flip-flop |
    | *le cégep* | *(≈ lycée / prépa)* | pre-university college |
    | *Bienvenue !* | *De rien !* | You're welcome! |
    | *Allô !* | *Salut !* | Hi! |
    | *Tiguidou !* | *Parfait !* | All good! |

    ### Traps
    - In Québec, *les gosses* is vulgar (testicles): say *les enfants* or *les jeunes*.
    - *Une suce* = a dummy (pacifier); *une débarbouillette* = a facecloth.
    - *Déjeuner / dîner / souper* = breakfast / lunch / dinner.
  examples:
    - { es: "Je vais au dépanneur m'acheter une liqueur.", en: "I'm going to the corner shop to buy a soft drink." }
    - { es: "Mets ta tuque, il fait frette dehors !", en: "Put your hat on, it's freezing outside!" }
    - { es: "Ma blonde et moi, on a jasé toute la soirée.", en: "My girlfriend and I chatted all evening." }
    - { es: "Merci ! — Bienvenue !", en: "Thanks! — You're welcome!" }
  pitfalls:
    - "*Bienvenue* = you're welcome in Québec; in France only 'welcome (to a place)'."
    - "*Ma blonde* doesn't mean she's blonde."
  related: [g.quebecois-grammar, g.anglicisms-calques, g.regional-meals]
  drills:
    - { es: "J'ai pas de char.", en: "I don't have a car." }
    - { es: "Arrête de m'achaler !", en: "Stop bothering me!" }
    - { es: "C'est plate, il pleut.", en: "It's a drag, it's raining." }
- id: g.quebec-sacres
  level: c2
  title: "Québec sacres: swearing with church words"
  summary: "Québec swear words come from Catholic liturgy (tabarnak, câlisse, hostie, ciboire, sacrament); they form verbs, adverbs and intensifiers. Recognise them; prefer the softened forms (tabarouette, câline, mosus)."
  explanation: |
    For centuries the Catholic Church dominated Québec life; when people swore, they profaned what was most sacred. The result is the *sacre*, a system unlike French swearing (which is mostly sexual or scatological).

    ### Sources
    | sacre | from | softened form (minced oath) |
    |---|---|---|
    | *tabarnak* | *tabernacle* | *tabarouette, tabarnouche* |
    | *câlisse* | *calice* (chalice) | *câline, câlique* |
    | *hostie / esti* | *hostie* (host) | *mautadit, mosus* |
    | *ciboire* | *ciboire* (ciborium) | *cibole* |
    | *sacrament* | *sacrement* | *sapristi* |

    ### Grammar: very productive
    - Interjection: *Tabarnouche !*
    - Intensifier: *C'est beau en tabarouette !* (really beautiful)
    - Adjective with *de*: *mon mautadit char* (my damn car)
    - Verbs: *se câlisser de* (not care about), *câlisser dehors* (kick out), *crisser son camp* (clear off)
    - Accumulation for emphasis — the more, the stronger.

    ### Use with care
    The real sacres are strong and vulgar; in a learner's mouth they can shock. The softened forms are acceptable in relaxed company and very common: *Tabarouette, il fait frette !*
  examples:
    - { es: "Tabarouette, il fait frette à matin !", en: "Gosh, it's freezing this morning!" }
    - { es: "C'est bon en mautadit, cette poutine !", en: "This poutine is darn good!" }
    - { es: "Mon mosus de cellulaire marche plus.", en: "My blasted phone doesn't work any more." }
  pitfalls:
    - "Don't use the real sacres in public, at work or with people you don't know well."
    - "French from France doesn't use these words: *tabarnak* in Paris marks you as Québécois (or as imitating them)."
  related: [g.quebecois-grammar, g.quebec-vocabulary, g.register-levels]
  drills:
    - { es: "Câline, j'ai oublié mes clés !", en: "Darn, I forgot my keys!" }
    - { es: "Il fait chaud en tabarnouche.", en: "It's really hot." }
    - { es: "Mautadit, le bus est parti !", en: "Dang, the bus has left!" }
- id: g.literary-prose-style
  level: c2
  title: "Literary prose: rhythm, free indirect speech and the long sentence"
  summary: "Read prose as style: Flaubert's mot juste and free indirect speech, Proust's long periodic sentence, ternary rhythm and cadence, and Québec writers from Gabrielle Roy to Michel Tremblay."
  explanation: |
    ### Free indirect speech (*style indirect libre*)
    The narrator takes on a character's thoughts without *il pensa que*: tense shifts as in reported speech, but exclamations and questions remain.
    *Elle regardait la pluie. Partirait-il demain ? Non, il ne la quitterait pas, il l'avait promis !* — Flaubert made this a hallmark of the modern novel.

    ### Rhythm
    - **Ternary rhythm**: groups of three (*Il vint, il vit, il vainquit* pattern) give balance.
    - **Cadence majeure** (members getting longer) ends strongly; **cadence mineure** (getting shorter) ends abruptly.
    - Flaubert tested sentences aloud in his *gueuloir* (bellowing room).

    ### The long sentence
    Proust's periodic sentence piles up subordinates, parentheses and comparisons before closing: read it by finding the main clause, then the branches. It opens with *Longtemps, je me suis couché de bonne heure* (*Du côté de chez Swann*, 1913).

    ### Québec voices
    Gabrielle Roy (*Bonheur d'occasion*, 1945), Anne Hébert, Réjean Ducharme, Michel Tremblay (joual on stage), Dany Laferrière: Québec literature moves between standard French and Québec speech.

    Public-domain classics to read: Hugo, Flaubert, Maupassant, Proust (*Swann*), Baudelaire's prose poems.
  examples:
    - { es: "Longtemps, je me suis couché de bonne heure.", en: "For a long time, I went to bed early. (Proust)" }
    - { es: "Il regarda le fleuve. Reviendrait-elle un jour à Québec ? Il n'osait plus l'espérer.", en: "He looked at the river. Would she ever come back to Québec? He no longer dared hope so." }
    - { es: "Flaubert cherchait sans relâche le mot juste.", en: "Flaubert searched relentlessly for the right word." }
  pitfalls:
    - "Free indirect speech has no quotation marks and no *il dit que*: watch the tenses to spot it."
    - "Don't imitate Proust's sentence length in essays: clarity first."
  related: [g.passe-simple-usage, g.stylistic-registers, g.figures-of-style, g.classical-french]
  drills:
    - { es: "Elle hésita. Fallait-il vraiment partir ?", en: "She hesitated. Did she really have to leave?" }
    - { es: "Le roman est écrit au style indirect libre.", en: "The novel is written in free indirect speech." }
    - { es: "La phrase s'achève sur une cadence majeure.", en: "The sentence ends on a rising cadence." }
- id: g.native-fluency-markers
  level: c2
  title: "Sounding native: rhythm, reductions, reactions and interjections"
  summary: "Final-syllable stress and linked rhythm, e-caduc deletion (j'te l'dis), natural backchannels (ah bon ?, sans blague !, carrément), interjections (bof, ouf, aïe, oups, beurk, chut) and well-placed fillers."
  explanation: |
    ### Rhythm and sound
    - French stresses the **last syllable of a word group**, not each word: *Je vais au marché ce MATIN.*
    - The **e caduc** drops in fast speech: *je ne sais pas → j'sais pas*, *je te le dis → j'te l'dis*, *samedi → sam'di*.
    - **Enchaînement**: words run together: *une amie* [y.na.mi].
    - Fewer optional liaisons in casual speech, more in formal speech.

    ### Backchannels (showing you're listening)
    *Ah bon ? — C'est vrai ? — Sans blague ! — Carrément ! — Grave ! — Mmh. — D'accord. — Je vois. — Tu m'étonnes !* (= I'm not surprised) — *N'importe quoi !*

    ### Interjections
    | | meaning |
    |---|---|
    | *bof* | meh |
    | *ouf* | phew |
    | *aïe* | ouch |
    | *oups* | oops |
    | *beurk* | yuck |
    | *miam* | yum |
    | *chut* | shh |
    | *hop* | (doing something quickly) |
    | *bah* | well, er |
    | *oh là là* | oh dear / wow |
    | *pfff* | (exasperation) |

    ### Québec equivalents
    *Ben voyons !* (come on!), *Ayoye !* (ouch / wow), *Coudonc* (well then), *Pas pire !* (not bad = good), *Tiguidou !*
  examples:
    - { es: "Tu as vu le Château Frontenac ? — Carrément, c'est magnifique !", en: "Did you see the Château Frontenac? — Totally, it's magnificent!" }
    - { es: "Il neige en mai ? Sans blague !", en: "It's snowing in May? No way!" }
    - { es: "Bof, le film était pas terrible.", en: "Meh, the film wasn't great." }
    - { es: "Ayoye, c'est beau, le fleuve !", en: "Wow, the river's beautiful! (Québec)" }
  pitfalls:
    - "*Pas terrible* = not great; *terrible* alone (casual) = fantastic."
    - "*Tu m'étonnes* (ironic) = I'm not at all surprised."
  related: [g.discourse-markers, g.spoken-negation, g.quebecois-grammar, g.elision-liaison]
  drills:
    - { es: "Ah bon ? Je savais pas.", en: "Really? I didn't know." }
    - { es: "Ouf, on a eu le train !", en: "Phew, we caught the train!" }
    - { es: "Pas pire, ton français !", en: "Your French is pretty good! (Québec)" }
- id: g.c2-review
  level: c2
  title: "Journey's end: the twelve checks of a near-native French"
  summary: "A final review of the points that still trip up advanced learners: gender, articles, pronoun order, être verbs and agreement, passé composé vs imparfait, the subjonctif, si-clauses, relatives, prepositions, register, faux amis and typography."
  explanation: |
    | check | the rule in one line | test sentence |
    |---|---|---|
    | 1. gender | learn every noun with its article | *le musée, la plage, le problème* |
    | 2. articles | French needs one; partitive for amounts; *de* after negation | *Je ne bois pas de café, j'aime le thé.* |
    | 3. pronoun order | *me le, le lui, y en*; imperative *donne-le-moi* | *Je te l'ai dit.* |
    | 4. être verbs | movement / change of state + all pronominal verbs | *Elle s'est levée et elle est sortie.* |
    | 5. agreement with avoir | with a preceding direct object | *Les photos que j'ai prises.* |
    | 6. PC vs imparfait | events vs background | *Il pleuvait quand je suis arrivé.* |
    | 7. subjonctif | will, emotion, doubt, necessity, certain conjunctions | *Bien qu'il soit tard, il faut que je finisse.* |
    | 8. si-clauses | never the conditional after *si* | *Si j'avais su, je serais venu.* |
    | 9. relatives | *qui / que / dont / où / lequel* | *la ville dont je rêve, où je vis* |
    | 10. prepositions | *à Québec, en France, au Canada; penser à; dépendre de* | *Je pense à mon voyage au Québec.* |
    | 11. register | match vocabulary, syntax and tense to the situation | *Tu viens ? / Viendrez-vous ?* |
    | 12. faux amis | *actuellement* = currently, *éventuellement* = possibly, *librairie* = bookshop, *assister à* = attend | |

    ### Typography (France)
    A thin space before **; : ! ?** and inside « guillemets »; Québec uses a space only before the colon. Decimal comma (*3,5*), space for thousands (*12 000*).

    *Je me souviens* — Québec's motto — is a fitting end: everything in this course is now yours to remember and use.
  examples:
    - { es: "Si j'avais su que Québec était si belle, je serais venue plus tôt.", en: "If I'd known Québec was so beautiful, I'd have come sooner." }
    - { es: "Bien que le voyage soit fini, je continuerai à parler français.", en: "Although the journey is over, I'll go on speaking French." }
    - { es: "C'est la ville dont je rêvais depuis le début du voyage.", en: "It's the city I'd been dreaming of since the start of the journey." }
    - { es: "Je me souviens de tous ceux que j'ai rencontrés en chemin.", en: "I remember everyone I met along the way." }
  pitfalls:
    - "*Actuellement* means 'currently', not 'actually' (*en fait*)."
    - "*Éventuellement* means 'possibly', not 'eventually' (*finalement*)."
  related: [g.si-plus-que-parfait, g.subjonctif-conjonctions, g.double-object-pronouns, g.relative-dont, g.pc-vs-imparfait]
  drills:
    - { es: "Je te l'avais bien dit !", en: "I told you so!" }
    - { es: "Les lettres qu'elle m'a écrites sont ici.", en: "The letters she wrote me are here." }
    - { es: "Je me souviens.", en: "I remember." }
