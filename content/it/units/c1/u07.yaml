id: c1.u07
title: Sintassi complessa
lessons:
  - id: c1.u07.l1
    title: Pur conoscendo il rischio
    teach: [g.subordination-implicit]
    tip: "When the subject is the same, swap the full clause for a gerund, a participle or an infinitive: Tornando da Agrigento…, Arrivati in cima…, Dopo aver finito…, Pur sapendo…"
    vocab: [w.biodiversità, w.ecosistema, w.estinzione, w.desertificazione, w.deforestazione, w.sostenibilità, w.transizione-ecologica, w.combustibili-fossili, w.carbone, w.petrolio, w.nucleare, w.centrale, w.impronta-ecologica, w.surriscaldamento, w.anidride-carbonica, w.ozono, w.compensare, w.compensazione, w.pur-di, w.mandorlo, w.piantare, w.aria, w.proprio.adj, w.sopralluogo]
    sentences:
      - { es: "Pur conoscendo il rischio di desertificazione, la regione ha fatto poco per prevenirla.", en: "Despite knowing the risk of desertification, the region has done little to prevent it.", altEs: ["Pur sapendo del rischio di desertificazione, la regione ha fatto poco per prevenirla.", "Pur conoscendo il rischio di desertificazione, la Regione ha fatto poco per prevenirlo."], grammar: [g.subordination-implicit, g.pur-gerundio], vocab: [w.desertificazione] }
      - { es: "Arrivati in cima alla collina, abbiamo visto il Tempio della Concordia illuminato.", en: "Having reached the top of the hill, we saw the Temple of Concord lit up.", altEs: ["Arrivati in cima alla collina, abbiamo visto il Tempio della Concordia tutto illuminato.", "Una volta arrivati in cima alla collina, abbiamo visto il Tempio della Concordia illuminato."], grammar: [g.subordination-implicit, g.participio-assoluto], vocab: [w.collina] }
      - { es: "Riducendo il consumo di carbone e petrolio, si riducono anche le emissioni di anidride carbonica.", en: "By reducing the use of coal and oil, carbon dioxide emissions are also reduced.", altEs: ["Riducendo l'uso di carbone e petrolio, si riducono anche le emissioni di anidride carbonica."], grammar: [g.subordination-implicit, g.gerundio-uses], vocab: [w.carbone, w.petrolio, w.anidride-carbonica] }
      - { es: "A sentire gli esperti, il surriscaldamento del Mediterraneo è già una realtà.", en: "To hear the experts tell it, the overheating of the Mediterranean is already a reality.", altEs: ["A sentire gli esperti, il surriscaldamento del Mar Mediterraneo è già una realtà.", "Secondo gli esperti, il surriscaldamento del Mediterraneo è già una realtà."], grammar: [g.subordination-implicit], vocab: [w.surriscaldamento] }
      - { es: "Per compensare le emissioni del viaggio, abbiamo piantato dieci alberi.", en: "To offset the emissions from the trip, we planted ten trees.", altEs: ["Per compensare le emissioni del nostro viaggio, abbiamo piantato dieci alberi."], grammar: [g.subordination-implicit], vocab: [w.compensare, w.piantare] }
      - { es: "La compensazione delle emissioni non basta: bisogna inquinare meno.", en: "Offsetting emissions isn't enough: we need to pollute less.", altEs: ["Compensare le emissioni non basta: bisogna inquinare meno."], grammar: [g.nominalization], vocab: [w.compensazione] }
      - { es: "Pur di non prendere l'aereo, è venuto da Milano in treno e in traghetto.", en: "Just to avoid flying, he came from Milan by train and ferry.", altEs: ["Pur di non prendere l'aereo, è venuto da Milano in treno e traghetto."], grammar: [g.subordination-implicit], vocab: [w.pur-di, w.traghetto] }
      - { es: "Chiusa la centrale a carbone, l'aria della zona è migliorata.", en: "Once the coal-fired power station closed, the air in the area got better.", altEs: ["Una volta chiusa la centrale a carbone, l'aria della zona è migliorata.", "Dopo la chiusura della centrale a carbone, l'aria della zona è migliorata."], grammar: [g.subordination-implicit, g.participio-assoluto], vocab: [w.centrale, w.carbone] }
      - { es: "Avendo perso il suo habitat, la specie rischia l'estinzione.", en: "Having lost its habitat, the species is at risk of extinction.", altEs: ["Avendo perduto il suo habitat, la specie rischia l'estinzione.", "Perso il suo habitat, la specie rischia l'estinzione."], grammar: [g.subordination-implicit, g.gerundio-composto], vocab: [w.estinzione, w.habitat] }
      - { es: "Essendo un ecosistema fragile, la costa va protetta con particolare attenzione.", en: "Being a fragile ecosystem, the coast must be protected with special care.", altEs: ["Essendo un ecosistema fragile, la costa deve essere protetta con particolare attenzione."], grammar: [g.subordination-implicit, g.passive-andare], vocab: [w.ecosistema] }
      - { es: "A pensarci bene, l'energia nucleare divide ancora gli italiani.", en: "Come to think of it, nuclear energy still divides Italians.", altEs: ["A pensarci bene, il nucleare divide ancora gli italiani."], grammar: [g.subordination-implicit], vocab: [w.nucleare] }
      - { es: "Si parla tanto di transizione ecologica, ma i combustibili fossili restano la prima fonte di energia.", en: "There's a lot of talk about the ecological transition, but fossil fuels remain the main source of energy.", altEs: ["Si parla molto di transizione ecologica, ma i combustibili fossili restano la principale fonte di energia."], grammar: [g.si-impersonale], vocab: [w.transizione-ecologica, w.combustibili-fossili] }
      - { es: "Calcolando la propria impronta ecologica, molti scoprono di inquinare più del previsto.", en: "When they calculate their ecological footprint, many people find they pollute more than expected.", altEs: ["Calcolando la loro impronta ecologica, molti scoprono di inquinare più del previsto."], grammar: [g.subordination-implicit, g.gerundio-uses], vocab: [w.impronta-ecologica] }
      - { es: "Mentre tornavamo da Agrigento, abbiamo visto i mandorli in fiore.", en: "While we were coming back from Agrigento, we saw the almond trees in blossom.", altEs: ["Mentre rientravamo da Agrigento, abbiamo visto i mandorli in fiore."], grammar: [g.subordination-implicit, g.mentre-quando], vocab: [w.mandorlo], transform: { instruction: "Use a gerund instead of Mentre + imperfetto", answer: "Tornando da Agrigento, abbiamo visto i mandorli in fiore.", alt: ["Rientrando da Agrigento, abbiamo visto i mandorli in fiore."], en: "Coming back from Agrigento, we saw the almond trees in blossom." } }
      - { es: "Dopo che ebbero finito il sopralluogo, i tecnici scrissero la relazione.", en: "After they had finished the inspection, the technicians wrote the report.", grammar: [g.subordination-implicit, g.trapassato-remoto], vocab: [w.sopralluogo, w.relazione], transform: { instruction: "Use dopo + past infinitive", answer: "Dopo aver finito il sopralluogo, i tecnici scrissero la relazione.", alt: ["Dopo avere finito il sopralluogo, i tecnici scrissero la relazione.", "Finito il sopralluogo, i tecnici scrissero la relazione."], en: "After finishing the inspection, the technicians wrote the report." } }
      - { es: "Pur essendo stanchi, abbiamo visitato tutti i templi.", en: "Although we were tired, we visited all the temples.", altEs: ["Pur essendo stanche, abbiamo visitato tutti i templi.", "Anche se eravamo stanchi, abbiamo visitato tutti i templi."], grammar: [g.subordination-implicit, g.pur-gerundio], vocab: [w.tempio], error: { wrong: "Pure essendo stanchi, abbiamo visitato tutti i templi.", explain: "The concessive form is the short pur + gerund: pur essendo.", grammar: g.subordination-implicit } }
    exchanges:
      - q: { es: "Perché sei venuto in traghetto?", en: "Why did you come by ferry?" }
        a: { es: "Pur di non prendere l'aereo, sarei venuto anche a piedi!", en: "Just to avoid flying, I'd even have come on foot!" }
        alt: ["Per non prendere l'aereo.", "Pur di non volare, ho preso il traghetto."]
        grammar: [g.subordination-implicit, g.condizionale-passato]
        vocab: [w.pur-di, w.traghetto]
      - q: { es: "Come pensate di compensare le emissioni del convegno?", en: "How are you planning to offset the conference's emissions?" }
        a: { es: "Piantando cento alberi, d'accordo con il parco archeologico.", en: "By planting a hundred trees, in agreement with the archaeological park." }
        alt: ["Piantando alberi.", "Con un progetto di riforestazione."]
        grammar: [g.subordination-implicit, g.gerundio-uses]
        vocab: [w.compensare, w.piantare]
      - q: { es: "Sei favorevole al nucleare?", en: "Are you in favour of nuclear power?" }
        a: { es: "Pur capendo le ragioni di chi è favorevole, resto contraria.", en: "Although I understand the arguments of those in favour, I'm still against it." }
        alt: ["No, pur capendo le ragioni degli altri.", "Pur avendo qualche dubbio, sì."]
        grammar: [g.subordination-implicit, g.pur-gerundio]
        vocab: [w.nucleare]
      - q: { es: "Che cosa minaccia la biodiversità dell'isola?", en: "What threatens the island's biodiversity?" }
        a: { es: "Soprattutto la desertificazione e il surriscaldamento del mare.", en: "Above all desertification and the warming of the sea." }
        alt: ["La desertificazione.", "Il surriscaldamento del mare e il turismo di massa."]
        grammar: [g.nominalization]
        vocab: [w.biodiversità, w.desertificazione, w.surriscaldamento]
      - q: { es: "Hai visto il tempio al tramonto?", en: "Did you see the temple at sunset?" }
        a: { es: "Sì, e a vederlo così mi sono quasi commossa.", en: "Yes, and seeing it like that I was almost moved to tears." }
        alt: ["Sì, è stupendo.", "No, ci torno domani sera."]
        grammar: [g.subordination-implicit]
        vocab: [w.tempio]
    texts:
      - title: "Diario di viaggio"
        es: ["Arrivati ad Agrigento, siamo saliti subito alla Valle dei Templi.", "Passeggiando tra i mandorli, abbiamo raggiunto il Tempio della Concordia.", "Pur essendo stanchissimi, siamo rimasti fino al tramonto."]
        en: ["Once we got to Agrigento, we went straight up to the Valley of the Temples.", "Strolling among the almond trees, we reached the Temple of Concord.", "Although we were exhausted, we stayed until sunset."]
        grammar: [g.subordination-implicit, g.participio-assoluto]
        vocab: [w.mandorlo, w.tempio]
      - title: "Scheda informativa"
        es: ["Secondo diversi studi, la Sicilia è tra le regioni italiane più esposte alla desertificazione.", "Riducendo gli sprechi d'acqua e fermando la deforestazione, si può rallentare il fenomeno.", "Pur trattandosi di un processo lento, gli effetti sono già visibili."]
        en: ["According to several studies, Sicily is among the Italian regions most exposed to desertification.", "By cutting water waste and stopping deforestation, the process can be slowed down.", "Although it is a slow process, the effects are already visible."]
        grammar: [g.subordination-implicit, g.pur-gerundio]
        vocab: [w.desertificazione, w.deforestazione]
    spicy:
      - { es: "Pur di vederti, ho fatto tre ore di autobus sotto il sole di Agrigento.", en: "Just to see you, I spent three hours on a bus under the Agrigento sun.", altEs: ["Pur di vederti ho fatto tre ore di pullman sotto il sole di Agrigento."], grammar: [g.subordination-implicit], vocab: [w.pur-di] }
      - { es: "A guardarti bene, sei più affascinante del Tempio della Concordia al tramonto.", en: "Looking at you closely, you're more charming than the Temple of Concord at sunset.", grammar: [g.subordination-implicit], vocab: [w.tempio] }
      - { es: "Finita la cena, mi hai proposto di compensare le calorie con una passeggiata tra i templi.", en: "Once dinner was over, you suggested offsetting the calories with a walk among the temples.", altEs: ["Finita la cena, mi hai proposto di bruciare le calorie con una passeggiata tra i templi."], grammar: [g.participio-assoluto, g.subordination-implicit], vocab: [w.compensare] }
      - { es: "Pur essendo un'ambientalista convinta, con te spreco ore intere al telefono.", en: "Despite being a committed environmentalist, I waste whole hours on the phone with you.", altEs: ["Pur essendo un ambientalista convinto, con te spreco ore intere al telefono."], grammar: [g.pur-gerundio], vocab: [w.ambientalista] }
      - { es: "Avendo calcolato la mia impronta ecologica, propongo di andare in vacanza insieme: in due si inquina meno.", en: "Having calculated my ecological footprint, I suggest we go on holiday together: two people pollute less.", grammar: [g.gerundio-composto, g.subordination-implicit], vocab: [w.impronta-ecologica] }
  - id: c1.u07.l2
    title: Qualora piovesse
    teach: [g.conditional-conjunctions]
    tip: "qualora, nel caso in cui, a patto che, salvo che, ammesso che all take the congiuntivo; qualora never takes the conditional."
    vocab: [w.nel-caso-in-cui, w.a-patto-che, w.fermo-restando-che, w.salvo-che, w.tranne-che, w.fuorché, w.salvo, w.dissesto-idrogeologico, w.frana, w.erosione, w.falda-acquifera, w.urgente, w.urgenza, w.allarmante, w.preoccupante, w.irreversibile, w.ambientalista, w.attivista, w.allerta, w.spettare, w.divieto, w.garanzia, w.accesso, w.pulizia]
    sentences:
      - { es: "Qualora la pioggia continuasse, la strada per la Scala dei Turchi verrebbe chiusa.", en: "Should the rain continue, the road to the Scala dei Turchi would be closed.", altEs: ["Qualora continuasse a piovere, la strada per la Scala dei Turchi verrebbe chiusa.", "Nel caso in cui la pioggia continuasse, la strada per la Scala dei Turchi sarebbe chiusa."], grammar: [g.conditional-conjunctions, g.congiuntivo-imperfetto], vocab: [w.qualora] }
      - { es: "Nel caso in cui ci sia un'allerta meteo, la visita sarà rinviata.", en: "If there is a weather warning, the visit will be postponed.", altEs: ["Nel caso in cui ci fosse un'allerta meteo, la visita verrebbe rinviata.", "In caso di allerta meteo, la visita sarà rinviata."], grammar: [g.conditional-conjunctions], vocab: [w.nel-caso-in-cui, w.allerta] }
      - { es: "Vi accompagno alla riserva, a patto che restiate sul sentiero.", en: "I'll take you to the reserve, provided you stay on the path.", altEs: ["Vi accompagno nella riserva, a patto che restiate sul sentiero.", "Vi accompagno alla riserva, purché restiate sul sentiero."], grammar: [g.conditional-conjunctions], vocab: [w.a-patto-che, w.sentiero] }
      - { es: "Nel 1966 una grande frana colpì Agrigento e migliaia di persone dovettero lasciare la propria casa.", en: "In 1966 a huge landslide hit Agrigento and thousands of people had to leave their homes.", altEs: ["Nel 1966 una grande frana colpì Agrigento e migliaia di persone dovettero lasciare le loro case."], grammar: [g.passato-remoto-forms], vocab: [w.frana] }
      - { es: "Il dissesto idrogeologico è un'urgenza nazionale, non soltanto siciliana.", en: "Hydrogeological instability is a national emergency, not just a Sicilian one.", altEs: ["Il dissesto idrogeologico è un'urgenza nazionale, non solo siciliana."], grammar: [g.conditional-conjunctions], vocab: [w.dissesto-idrogeologico, w.urgenza] }
      - { es: "L'erosione della costa è preoccupante, ma non ancora irreversibile.", en: "The erosion of the coast is worrying, but not yet irreversible.", altEs: ["L'erosione della costa preoccupa, ma non è ancora irreversibile."], grammar: [g.adjective-agreement], vocab: [w.erosione, w.preoccupante, w.irreversibile] }
      - { es: "Si può fare il bagno ovunque, salvo che sia indicato un divieto.", en: "You can swim anywhere, unless a ban is signposted.", altEs: ["Si può fare il bagno dappertutto, salvo che ci sia un divieto.", "Si può fare il bagno ovunque, a meno che non ci sia un divieto."], grammar: [g.conditional-conjunctions], vocab: [w.salvo-che, w.divieto] }
      - { es: "I dati sulla falda acquifera sono allarmanti: in alcuni pozzi l'acqua è diventata salata.", en: "The data on the water table are alarming: in some wells the water has turned salty.", altEs: ["I dati sulla falda acquifera sono allarmanti: in certi pozzi l'acqua è diventata salata."], grammar: [g.passato-prossimo-essere], vocab: [w.falda-acquifera, w.allarmante, w.pozzo] }
      - { es: "Fermo restando che la decisione spetta al comune, noi ambientalisti chiediamo di essere ascoltati.", en: "While the decision does of course lie with the council, we environmentalists ask to be heard.", altEs: ["Fermo restando che la decisione spetta al Comune, noi ambientalisti chiediamo di essere ascoltati."], grammar: [g.conditional-conjunctions], vocab: [w.fermo-restando-che, w.spettare, w.ambientalista] }
      - { es: "Tutti erano d'accordo, fuorché il sindaco.", en: "Everyone agreed, except the mayor.", altEs: ["Erano tutti d'accordo, fuorché il sindaco.", "Tutti erano d'accordo, tranne il sindaco."], grammar: [g.conditional-conjunctions], vocab: [w.fuorché, w.sindaco] }
      - { es: "Il museo è aperto tutti i giorni, salvo il lunedì mattina.", en: "The museum is open every day, except Monday mornings.", altEs: ["Il museo è aperto tutti i giorni, tranne il lunedì mattina."], grammar: [g.conditional-conjunctions], vocab: [w.salvo] }
      - { es: "Gli attivisti non lasceranno la spiaggia, tranne che arrivi una garanzia scritta.", en: "The activists won't leave the beach unless a written guarantee arrives.", altEs: ["Gli attivisti non lasceranno la spiaggia, a meno che non arrivi una garanzia scritta."], grammar: [g.conditional-conjunctions], vocab: [w.attivista, w.tranne-che] }
      - { es: "Ammesso che il progetto venga approvato, chi pagherà i lavori urgenti?", en: "Assuming the project is approved, who will pay for the urgent works?", altEs: ["Ammesso che il progetto sia approvato, chi pagherà i lavori urgenti?"], grammar: [g.conditional-conjunctions, g.passive-venire], vocab: [w.ammesso-che, w.urgente] }
      - { es: "Se non riceve la conferma, ci contatti.", en: "If you don't receive the confirmation, contact us.", altEs: ["Se non riceve conferma, ci contatti."], grammar: [g.conditional-conjunctions, g.imperativo-lei], vocab: [w.conferma], transform: { instruction: "Make it formal with qualora", answer: "Qualora non ricevesse la conferma, ci contatti.", alt: ["Nel caso in cui non riceva la conferma, ci contatti.", "Qualora non ricevesse conferma, ci contatti."], en: "Should you not receive the confirmation, please contact us." } }
      - { es: "Ti presto la macchina se me la riporti stasera.", en: "I'll lend you the car if you bring it back tonight.", altEs: ["Ti presto l'auto se me la riporti stasera."], grammar: [g.conditional-conjunctions, g.combined-pronouns], vocab: [w.prestare], transform: { instruction: "Use a patto che", answer: "Ti presto la macchina, a patto che tu me la riporti stasera.", alt: ["Ti presto la macchina a patto che me la riporti stasera.", "Ti presto la macchina, purché tu me la riporti stasera."], en: "I'll lend you the car, provided you bring it back tonight." } }
      - { es: "Qualora fosse necessario, La contatteremo.", en: "Should it be necessary, we will contact you.", altEs: ["Qualora fosse necessario, la contatteremo.", "Nel caso in cui fosse necessario, La contatteremo."], grammar: [g.conditional-conjunctions, g.lei-forms], vocab: [w.qualora], error: { wrong: "Qualora sarebbe necessario, La contatteremo.", explain: "qualora never takes the conditional: qualora fosse.", grammar: g.conditional-conjunctions } }
    exchanges:
      - q: { es: "E se domani piove?", en: "And what if it rains tomorrow?" }
        a: { es: "Nel caso in cui piova, visitiamo il museo archeologico.", en: "If it rains, we'll visit the archaeological museum." }
        alt: ["In caso di pioggia, andiamo al museo.", "Se piove, andiamo al museo archeologico."]
        grammar: [g.conditional-conjunctions]
        vocab: [w.nel-caso-in-cui]
      - q: { es: "Posso venire anch'io all'escursione?", en: "Can I come on the hike too?" }
        a: { es: "Certo, a patto che tu abbia delle scarpe adatte.", en: "Of course, provided you have suitable shoes." }
        alt: ["Certo, purché tu sia puntuale.", "Sì, a patto che non ti lamenti del caldo."]
        grammar: [g.conditional-conjunctions]
        vocab: [w.a-patto-che]
      - q: { es: "Il fenomeno è ancora reversibile?", en: "Can the process still be reversed?" }
        a: { es: "Sì, a condizione che si smetta di costruire sulla costa.", en: "Yes, on condition that people stop building on the coast." }
        alt: ["Sì, purché si intervenga subito.", "Purtroppo no, è irreversibile."]
        grammar: [g.conditional-conjunctions]
        vocab: [w.irreversibile]
      - q: { es: "Chi ha votato contro il progetto?", en: "Who voted against the project?" }
        a: { es: "Nessuno, fuorché due consiglieri dell'opposizione.", en: "Nobody, except two opposition councillors." }
        alt: ["Solo due consiglieri.", "Nessuno, salvo due consiglieri dell'opposizione."]
        grammar: [g.conditional-conjunctions]
        vocab: [w.fuorché, w.consigliere]
      - q: { es: "Che cosa chiedono gli ambientalisti?", en: "What are the environmentalists asking for?" }
        a: { es: "Un piano urgente contro il dissesto idrogeologico.", en: "An urgent plan against hydrogeological instability." }
        alt: ["Un piano contro le frane.", "Che si intervenga subito sulla costa."]
        grammar: [g.nominalization]
        vocab: [w.ambientalista, w.urgente, w.dissesto-idrogeologico]
    texts:
      - title: "Avviso del parco"
        es: ["Qualora le condizioni meteo peggiorassero, i sentieri saranno chiusi.", "Nel caso in cui si verifichi una frana, seguite le indicazioni del personale.", "L'accesso è consentito a tutti, salvo diversa indicazione."]
        en: ["Should the weather get worse, the paths will be closed.", "In the event of a landslide, follow the staff's instructions.", "Access is open to all, unless otherwise indicated."]
        grammar: [g.conditional-conjunctions]
        vocab: [w.qualora, w.frana, w.salvo]
      - title: "Volantino"
        es: ["Sabato mattina: pulizia della spiaggia di Realmonte.", "Si parte alle nove, a patto che non piova.", "Portate guanti e acqua; i sacchi li forniamo noi."]
        en: ["Saturday morning: clean-up of the beach at Realmonte.", "We start at nine, provided it doesn't rain.", "Bring gloves and water; we'll provide the bags."]
        grammar: [g.conditional-conjunctions, g.dislocation]
        vocab: [w.a-patto-che]
    spicy:
      - { es: "Qualora ti sentissi solo stasera, il mio numero è sempre lo stesso.", en: "Should you feel lonely tonight, my number hasn't changed.", altEs: ["Qualora ti sentissi sola stasera, il mio numero è sempre lo stesso."], grammar: [g.conditional-conjunctions, g.congiuntivo-imperfetto], vocab: [w.qualora] }
      - { es: "Ti offro la cena, a patto che il dolce lo scelga io.", en: "I'll buy you dinner, provided I get to choose the dessert.", altEs: ["Ti offro la cena, purché il dolce lo scelga io."], grammar: [g.conditional-conjunctions, g.dislocation], vocab: [w.a-patto-che] }
      - { es: "Nel caso in cui tu voglia un'altra passeggiata al tramonto, sono libera tutta la settimana.", en: "In case you want another sunset walk, I'm free all week.", altEs: ["Nel caso in cui tu voglia un'altra passeggiata al tramonto, sono libero tutta la settimana."], grammar: [g.conditional-conjunctions], vocab: [w.nel-caso-in-cui] }
      - { es: "Mi piace tutto di te, fuorché il tuo gusto in fatto di musica.", en: "I like everything about you, except your taste in music.", altEs: ["Mi piace tutto di te, tranne i tuoi gusti musicali."], grammar: [g.conditional-conjunctions], vocab: [w.fuorché] }
      - { es: "La situazione è preoccupante ma non irreversibile: mi sto innamorando, salvo che tu mi dica di smettere.", en: "The situation is worrying but not irreversible: I'm falling in love, unless you tell me to stop.", grammar: [g.conditional-conjunctions], vocab: [w.preoccupante, w.irreversibile, w.salvo-che] }
  - id: c1.u07.l3
    title: Al fine di proteggere
    teach: [g.subordination-implicit, g.conditional-conjunctions]
    tip: "Purpose with the same subject takes an infinitive: al fine di, allo scopo di, in modo da, così da + infinitive. anziché + infinitive means 'instead of'."
    vocab: [w.anziché, w.al-fine-di, w.allo-scopo-di, w.in-modo-da, w.così-da, w.oltre-che, w.smaltimento, w.discarica, w.inceneritore, w.depurazione, w.riciclo, w.economia-circolare, w.mobilità-sostenibile, w.inquinante, w.tossico, w.ecologico, w.habitat, w.fauna, w.flora, w.riserva-naturale, w.parco-nazionale, w.tutela-ambientale, w.tartaruga, w.impianto, w.navetta, w.selvatico, w.nido, w.sostanza, w.avvicinarsi]
    sentences:
      - { es: "Al fine di ridurre i rifiuti, il comune ha introdotto la raccolta porta a porta.", en: "In order to reduce waste, the council has introduced door-to-door collection.", altEs: ["Allo scopo di ridurre i rifiuti, il comune ha introdotto la raccolta porta a porta."], grammar: [g.subordination-implicit], vocab: [w.al-fine-di, w.rifiuti] }
      - { es: "Allo scopo di proteggere i nidi delle tartarughe, una parte della spiaggia è chiusa di notte.", en: "With the aim of protecting the turtles' nests, part of the beach is closed at night.", altEs: ["Al fine di proteggere i nidi delle tartarughe, una parte della spiaggia è chiusa di notte."], grammar: [g.subordination-implicit], vocab: [w.allo-scopo-di, w.tartaruga] }
      - { es: "Anziché costruire un inceneritore, la regione dovrebbe investire nel riciclo.", en: "Instead of building an incinerator, the region should invest in recycling.", altEs: ["Invece di costruire un inceneritore, la Regione dovrebbe investire nel riciclo."], grammar: [g.subordination-implicit, g.condizionale-uses], vocab: [w.anziché, w.inceneritore, w.riciclo] }
      - { es: "Separate bene la plastica, in modo da facilitare lo smaltimento.", en: "Separate the plastic properly, so as to make disposal easier.", altEs: ["Separate bene la plastica, così da facilitare lo smaltimento."], grammar: [g.subordination-implicit, g.imperativo-noi-voi], vocab: [w.in-modo-da, w.smaltimento] }
      - { es: "Hanno piantato solo specie locali, così da ricreare l'habitat originario.", en: "They planted only local species, so as to recreate the original habitat.", altEs: ["Hanno piantato solo specie locali, in modo da ricreare l'habitat originario."], grammar: [g.subordination-implicit], vocab: [w.così-da, w.habitat] }
      - { es: "La discarica è stata chiusa perché alcune sostanze tossiche erano finite nella falda.", en: "The landfill was closed because some toxic substances had got into the water table.", altEs: ["Hanno chiuso la discarica perché alcune sostanze tossiche erano finite nella falda."], grammar: [g.trapassato-prossimo, g.passive-essere], vocab: [w.discarica, w.tossico] }
      - { es: "Senza un impianto di depurazione, gli scarichi finiscono direttamente in mare.", en: "Without a treatment plant, waste water goes straight into the sea.", altEs: ["Senza un impianto di depurazione, gli scarichi vanno direttamente in mare."], grammar: [g.present-ere-ire], vocab: [w.impianto, w.depurazione] }
      - { es: "L'economia circolare trasforma i rifiuti in risorse.", en: "The circular economy turns waste into resources.", altEs: ["Con l'economia circolare i rifiuti diventano risorse."], grammar: [g.present-are], vocab: [w.economia-circolare] }
      - { es: "Oltre che inquinante, il traffico estivo è un incubo per chi vive a San Leone.", en: "As well as being polluting, summer traffic is a nightmare for people who live in San Leone.", altEs: ["Oltre a essere inquinante, il traffico estivo è un incubo per chi vive a San Leone."], grammar: [g.subordination-implicit], vocab: [w.oltre-che, w.inquinante] }
      - { es: "Nella riserva naturale di Torre Salsa la flora e la fauna sono rigorosamente protette.", en: "In the Torre Salsa nature reserve the flora and fauna are strictly protected.", altEs: ["Nella riserva di Torre Salsa flora e fauna sono rigorosamente protette."], grammar: [g.passive-essere], vocab: [w.riserva-naturale, w.flora, w.fauna] }
      - { es: "La Valle dei Templi non è un parco nazionale, ma un parco archeologico e paesaggistico.", en: "The Valley of the Temples isn't a national park, but an archaeological and landscape park.", grammar: [g.negation], vocab: [w.parco-nazionale] }
      - { es: "Per favorire la mobilità sostenibile, il parco mette a disposizione biciclette elettriche.", en: "To encourage sustainable mobility, the park provides electric bikes.", altEs: ["Per favorire la mobilità sostenibile, il parco offre biciclette elettriche."], grammar: [g.subordination-implicit], vocab: [w.mobilità-sostenibile] }
      - { es: "La tutela ambientale non deve fermare il turismo, a patto che sia un turismo responsabile.", en: "Environmental protection needn't stop tourism, provided it is responsible tourism.", grammar: [g.conditional-conjunctions], vocab: [w.tutela-ambientale, w.a-patto-che] }
      - { es: "Il parco chiude alcuni sentieri perché vuole proteggere la flora.", en: "The park closes some paths because it wants to protect the plant life.", grammar: [g.subordination-implicit], vocab: [w.flora, w.sentiero], transform: { instruction: "Use al fine di + infinitive", answer: "Il parco chiude alcuni sentieri al fine di proteggere la flora.", alt: ["Il parco chiude alcuni sentieri allo scopo di proteggere la flora.", "Il parco chiude alcuni sentieri per proteggere la flora."], en: "The park closes some paths in order to protect the plant life." } }
      - { es: "Invece di usare l'auto, prendiamo la navetta ecologica.", en: "Instead of using the car, let's take the eco-friendly shuttle bus.", altEs: ["Invece di prendere la macchina, prendiamo la navetta ecologica."], grammar: [g.subordination-implicit], vocab: [w.navetta, w.ecologico], transform: { instruction: "Use anziché", answer: "Anziché usare l'auto, prendiamo la navetta ecologica.", alt: ["Anziché prendere la macchina, prendiamo la navetta ecologica."], en: "Rather than using the car, let's take the eco-friendly shuttle bus." } }
      - { es: "Ho preso il treno anziché l'aereo.", en: "I took the train rather than the plane.", altEs: ["Ho preso il treno invece dell'aereo."], grammar: [g.subordination-implicit], vocab: [w.anziché], error: { wrong: "Ho preso il treno anzi che l'aereo.", explain: "anziché is one word with an accent.", grammar: g.subordination-implicit } }
    exchanges:
      - q: { es: "Perché non avete costruito l'inceneritore?", en: "Why didn't you build the incinerator?" }
        a: { es: "Anziché bruciare i rifiuti, abbiamo preferito puntare sul riciclo.", en: "Rather than burning the waste, we preferred to focus on recycling." }
        alt: ["Abbiamo preferito il riciclo.", "Anziché bruciarli, li ricicliamo."]
        grammar: [g.subordination-implicit]
        vocab: [w.anziché, w.inceneritore, w.riciclo]
      - q: { es: "Come si arriva alla Scala dei Turchi?", en: "How do you get to the Scala dei Turchi?" }
        a: { es: "Lasciata la macchina al parcheggio, si scende a piedi in dieci minuti.", en: "Once you've left the car in the car park, you walk down in ten minutes." }
        alt: ["In macchina fino al parcheggio, poi a piedi.", "Si scende a piedi dal parcheggio."]
        grammar: [g.participio-assoluto, g.si-impersonale]
        vocab: [w.parcheggio]
      - q: { es: "A che cosa serve il nuovo impianto di depurazione?", en: "What is the new treatment plant for?" }
        a: { es: "A pulire gli scarichi, in modo da rendere il mare di nuovo balneabile.", en: "To clean the waste water, so as to make the sea safe for swimming again." }
        alt: ["A pulire gli scarichi.", "A rendere il mare più pulito."]
        grammar: [g.subordination-implicit]
        vocab: [w.impianto, w.depurazione, w.in-modo-da]
      - q: { es: "Si può entrare nella riserva con il cane?", en: "Can you go into the reserve with a dog?" }
        a: { es: "Sì, a patto che sia al guinzaglio, così da non disturbare gli animali selvatici.", en: "Yes, provided it's on a lead, so as not to disturb the wild animals." }
        alt: ["Sì, ma al guinzaglio.", "No, i cani non sono ammessi."]
        grammar: [g.conditional-conjunctions, g.subordination-implicit]
        vocab: [w.così-da, w.selvatico]
      - q: { es: "Perché compri solo prodotti locali?", en: "Why do you only buy local products?" }
        a: { es: "Per ridurre la mia impronta ecologica, oltre che per aiutare i contadini della zona.", en: "To reduce my ecological footprint, as well as to help local farmers." }
        alt: ["Per inquinare meno.", "Per aiutare i contadini della zona."]
        grammar: [g.subordination-implicit]
        vocab: [w.oltre-che, w.impronta-ecologica]
    texts:
      - title: "Regolamento della riserva"
        es: ["Al fine di tutelare la flora e la fauna, è vietato uscire dai sentieri.", "I rifiuti vanno riportati a casa, in modo da non lasciare tracce.", "Qualora si incontrassero animali selvatici, è vietato avvicinarsi."]
        en: ["In order to protect the flora and fauna, leaving the paths is forbidden.", "Rubbish must be taken home, so as to leave no trace.", "Should you come across wild animals, approaching them is forbidden."]
        grammar: [g.subordination-implicit, g.conditional-conjunctions]
        vocab: [w.al-fine-di, w.in-modo-da, w.selvatico]
      - title: "Il giardino della Kolymbethra"
        es: ["Nella Valle dei Templi c'è un giardino antico, recuperato dal FAI.", "Vi si coltivano agrumi, irrigati con canali scavati nella roccia.", "Visitandolo, si capisce che tutela ambientale e storia possono andare d'accordo."]
        en: ["In the Valley of the Temples there is an ancient garden, restored by FAI.", "Citrus fruit is grown there, watered by channels dug into the rock.", "Visiting it, you realise that environmental protection and history can go hand in hand."]
        grammar: [g.subordination-implicit, g.si-passivante]
        vocab: [w.tutela-ambientale]
    spicy:
      - { es: "Anziché guardare il telefono, potresti guardare me: sono più ecologica e non ho bisogno di essere ricaricata.", en: "Instead of looking at your phone, you could look at me: I'm more eco-friendly and I don't need recharging.", altEs: ["Anziché guardare il telefono, potresti guardare me: sono più ecologico e non ho bisogno di essere ricaricato."], grammar: [g.subordination-implicit], vocab: [w.anziché, w.ecologico] }
      - { es: "Ti ho invitato al fine di discutere di economia circolare; il vino è solo un dettaglio.", en: "I invited you in order to discuss the circular economy; the wine is just a detail.", altEs: ["Ti ho invitata al fine di discutere di economia circolare; il vino è solo un dettaglio."], grammar: [g.subordination-implicit], vocab: [w.al-fine-di, w.economia-circolare] }
      - { es: "Oltre che bello, sei pure ecologico: vai ovunque in bicicletta.", en: "As well as being good-looking, you're eco-friendly too: you go everywhere by bike.", altEs: ["Oltre che bella, sei pure ecologica: vai ovunque in bicicletta."], grammar: [g.subordination-implicit], vocab: [w.oltre-che, w.ecologico] }
      - { es: "Allo scopo di proteggere la tua fauna selvatica, cioè i tuoi tre gatti, propongo di vederci da me.", en: "With the aim of protecting your wildlife, that is your three cats, I suggest we meet at my place.", altEs: ["Allo scopo di proteggere la tua fauna selvatica, cioè i tuoi tre gatti, ti propongo di vederci da me."], grammar: [g.subordination-implicit], vocab: [w.allo-scopo-di, w.fauna, w.selvatico] }
      - { es: "Mi sono vestita bene, in modo da non passare inosservata alla riunione degli ambientalisti.", en: "I dressed up so as not to go unnoticed at the environmentalists' meeting.", altEs: ["Mi sono vestito bene, in modo da non passare inosservato alla riunione degli ambientalisti."], grammar: [g.subordination-implicit], vocab: [w.in-modo-da, w.ambientalista] }
  - id: c1.u07.l4
    title: È arrivata la primavera
    teach: [g.word-order-marked]
    tip: "Put the subject after the verb when it is the news (È arrivato Marco), and in questions (Che cosa ha detto il sindaco?). Front a word without a pronoun to contrast it: TE ho invitato, non lui."
    vocab: [w.incremento, w.decremento, w.calo, w.impennata, w.stabilizzarsi, w.peggioramento, w.miglioramento, w.progressivo, w.graduale, w.proposizione, w.subordinazione, w.inciso, w.dislocazione, w.enfatico, w.marcato, w.anteporre, w.posporre, w.inversione, w.gerarchia, w.fiorire]
    sentences:
      - { es: "È arrivata la primavera e sono fioriti i mandorli.", en: "Spring has arrived and the almond trees have blossomed.", altEs: ["È arrivata la primavera e i mandorli sono fioriti."], grammar: [g.word-order-marked, g.passato-prossimo-essere], vocab: [w.mandorlo] }
      - { es: "Ha telefonato il direttore del parco: domani si apre un'ora prima.", en: "The park director phoned: tomorrow we open an hour early.", altEs: ["Ha chiamato il direttore del parco: domani si apre un'ora prima."], grammar: [g.word-order-marked], vocab: [w.direttore] }
      - { es: "Che cosa ha detto il sindaco sulla frana?", en: "What did the mayor say about the landslide?", altEs: ["Cos'ha detto il sindaco sulla frana?", "Che ha detto il sindaco sulla frana?"], grammar: [g.word-order-marked, g.question-words], vocab: [w.sindaco, w.frana], error: { wrong: "Che cosa il sindaco ha detto sulla frana?", explain: "In questions with che cosa, the subject goes after the verb: che cosa ha detto il sindaco?", grammar: g.word-order-marked } }
      - { es: "Si è registrata un'impennata di visitatori durante la Sagra del Mandorlo in Fiore.", en: "There was a surge in visitors during the Almond Blossom Festival.", altEs: ["Durante la Sagra del Mandorlo in Fiore si è registrata un'impennata di visitatori."], grammar: [g.word-order-marked, g.si-passivante], vocab: [w.impennata, w.mandorlo] }
      - { es: "Dopo anni di calo, il numero dei turisti si è stabilizzato.", en: "After years of decline, the number of tourists has levelled off.", altEs: ["Dopo anni di calo, il numero di turisti si è stabilizzato."], grammar: [g.reflexive-passato-prossimo], vocab: [w.calo, w.stabilizzarsi] }
      - { es: "Il miglioramento della qualità dell'aria è graduale ma costante.", en: "The improvement in air quality is gradual but steady.", grammar: [g.nominalization], vocab: [w.miglioramento, w.graduale] }
      - { es: "Di fronte al progressivo peggioramento della siccità, la regione ha dichiarato lo stato di emergenza.", en: "Faced with the gradual worsening of the drought, the region declared a state of emergency.", altEs: ["Davanti al progressivo peggioramento della siccità, la Regione ha dichiarato lo stato di emergenza."], grammar: [g.nominalization], vocab: [w.progressivo, w.peggioramento, w.siccità] }
      - { es: "Del decremento della popolazione parleremo nel prossimo incontro.", en: "We'll talk about the population decline at the next meeting.", altEs: ["Del calo della popolazione parleremo nel prossimo incontro.", "Parleremo del decremento della popolazione nel prossimo incontro."], grammar: [g.word-order-marked], vocab: [w.decremento] }
      - { es: "L'incremento delle temperature è evidente: lo dicono tutti i dati.", en: "The rise in temperatures is clear: all the data say so.", altEs: ["L'aumento delle temperature è evidente: lo dicono tutti i dati."], grammar: [g.word-order-marked, g.dislocation], vocab: [w.incremento] }
      - { es: "Nacque qui vicino, nel 1867, Luigi Pirandello.", en: "Luigi Pirandello was born near here, in 1867.", altEs: ["Luigi Pirandello nacque qui vicino, nel 1867.", "È nato qui vicino, nel 1867, Luigi Pirandello."], grammar: [g.word-order-marked, g.passato-remoto-irregular], vocab: [w.nascere], transform: { instruction: "Put it in neutral order (subject first)", answer: "Luigi Pirandello nacque qui vicino, nel 1867.", alt: ["Luigi Pirandello nacque nel 1867, qui vicino."], en: "Luigi Pirandello was born near here, in 1867." } }
      - { es: "Marco è arrivato.", en: "Marco has arrived.", altEs: ["Marco è arrivato!"], grammar: [g.word-order-marked], vocab: [w.arrivare], transform: { instruction: "Put the subject after the verb (Marco is the news)", answer: "È arrivato Marco.", alt: ["È arrivato Marco!"], en: "Marco's here!" } }
      - { es: "Selinunte ho visitato, non Segesta!", en: "It was Selinunte I visited, not Segesta!", altEs: ["Non Segesta, ma Selinunte ho visitato!"], grammar: [g.word-order-marked], vocab: [w.visitare] }
      - { es: "In questa frase la proposizione subordinata è anteposta alla principale.", en: "In this sentence the subordinate clause comes before the main clause.", altEs: ["In questa frase la subordinata è anteposta alla principale."], grammar: [g.word-order-marked], vocab: [w.proposizione, w.anteporre] }
      - { es: "L'inciso, messo tra due virgole, interrompe la frase senza cambiarne il senso.", en: "The parenthetical clause, placed between two commas, interrupts the sentence without changing its meaning.", grammar: [g.word-order-marked], vocab: [w.inciso] }
      - { es: "Con la dislocazione a sinistra la frase diventa più enfatica: il caffè lo prendo amaro.", en: "With left dislocation the sentence becomes more emphatic: coffee, I take it black.", grammar: [g.word-order-marked, g.dislocation], vocab: [w.dislocazione, w.enfatico] }
      - { es: "Nella gerarchia delle priorità, per noi viene prima l'acqua.", en: "In our hierarchy of priorities, water comes first.", altEs: ["Nella gerarchia delle priorità, l'acqua viene prima di tutto."], grammar: [g.word-order-marked], vocab: [w.gerarchia] }
    exchanges:
      - q: { es: "Chi ha vinto il concorso di fotografia?", en: "Who won the photography competition?" }
        a: { es: "Ha vinto una ragazza di Licata, con una foto dei mandorli in fiore.", en: "A girl from Licata won, with a photo of the almond trees in blossom." }
        alt: ["Una ragazza di Licata.", "L'ha vinto una ragazza di Licata."]
        grammar: [g.word-order-marked]
        vocab: [w.concorso, w.mandorlo]
      - q: { es: "Il caffè, lo vuoi amaro?", en: "Your coffee, do you want it without sugar?" }
        a: { es: "No, lo prendo con un po' di zucchero.", en: "No, I take it with a little sugar." }
        alt: ["Sì, amaro, grazie.", "Con un cucchiaino di zucchero, grazie."]
        grammar: [g.dislocation, g.word-order-marked]
        vocab: [w.amaro]
      - q: { es: "Che cosa è successo sulla statale?", en: "What happened on the main road?" }
        a: { es: "È caduta una frana e hanno chiuso la strada per due giorni.", en: "There's been a landslide and they've closed the road for two days." }
        alt: ["È caduta una frana.", "C'è stata una frana."]
        grammar: [g.word-order-marked, g.passato-prossimo-essere]
        vocab: [w.frana]
      - q: { es: "Com'è andata la stagione turistica?", en: "How did the tourist season go?" }
        a: { es: "Benissimo: c'è stata un'impennata di presenze straniere.", en: "Really well: there was a surge in foreign visitors." }
        alt: ["Bene, i numeri si sono stabilizzati.", "Male: c'è stato un calo di presenze."]
        grammar: [g.word-order-marked]
        vocab: [w.impennata]
      - q: { es: "La conosci, la Scala dei Turchi?", en: "Do you know it, the Scala dei Turchi?" }
        a: { es: "Certo che la conosco: ci andavo d'estate da piccola.", en: "Of course I know it: I used to go there in summer as a little girl." }
        alt: ["Certo che la conosco.", "No, non ci sono mai stato."]
        grammar: [g.dislocation, g.imperfetto-uses]
        vocab: [w.conoscere]
    texts:
      - title: "Notizia"
        es: ["È crollato ieri un tratto di costa vicino a Realmonte.", "Non ci sono stati feriti.", "Dell'erosione della zona si parla da anni, ma i lavori non sono mai cominciati."]
        en: ["A stretch of coastline near Realmonte collapsed yesterday.", "Nobody was injured.", "The erosion in the area has been talked about for years, but work has never started."]
        grammar: [g.word-order-marked]
        vocab: [w.erosione]
      - title: "Appunti di grammatica"
        es: ["Nella frase «È arrivato Marco», il soggetto è posposto al verbo.", "L'ordine marcato mette in evidenza l'informazione nuova.", "Nella frase «Il vino lo voglio rosso», invece, c'è una dislocazione a sinistra."]
        en: ["In the sentence 'È arrivato Marco', the subject is placed after the verb.", "Marked word order highlights the new information.", "In the sentence 'Il vino lo voglio rosso', on the other hand, there is a left dislocation."]
        grammar: [g.word-order-marked, g.dislocation]
        vocab: [w.posporre, w.marcato, w.dislocazione, w.inversione, w.subordinazione]
    spicy:
      - { es: "È arrivata la primavera, sono fioriti i mandorli e, guarda caso, sei arrivato anche tu.", en: "Spring has arrived, the almond trees have blossomed and, what a coincidence, you've arrived too.", altEs: ["È arrivata la primavera, sono fioriti i mandorli e, guarda caso, sei arrivata anche tu."], grammar: [g.word-order-marked], vocab: [w.mandorlo] }
      - { es: "Te ho invitato, non tuo cugino!", en: "It was you I invited, not your cousin!", altEs: ["Te ho invitata, non tua cugina!"], grammar: [g.word-order-marked], vocab: [] }
      - { es: "Il tuo numero, me lo dai o devo chiederlo al cameriere?", en: "Your number: are you giving it to me or do I have to ask the waiter?", grammar: [g.dislocation, g.combined-pronouns], vocab: [] }
      - { es: "Si registra un'impennata del mio buonumore ogni volta che sorridi.", en: "My good mood surges every time you smile.", grammar: [g.word-order-marked], vocab: [w.impennata] }
      - { es: "Nella gerarchia delle mie priorità, sei salito al primo posto, subito dopo il cannolo.", en: "In my hierarchy of priorities, you've moved up to first place, right after cannoli.", altEs: ["Nella gerarchia delle mie priorità, sei salita al primo posto, subito dopo il cannolo."], grammar: [g.word-order-marked], vocab: [w.gerarchia] }
dialogues:
  - id: c1.u07.d1
    title: Il sopralluogo
    context: "Near Realmonte, on the coast of Agrigento, a local journalist, Carmela, interviews Calogero, an engineer inspecting the eroded cliffs."
    lines:
      - { speaker: Carmela, es: "Allora, ingegnere, la situazione è davvero così grave?", en: "So, how serious is the situation really?" }
      - { speaker: Calogero, es: "Grave, sì; irreversibile, no. A patto che si intervenga subito.", en: "Serious, yes; irreversible, no. Provided action is taken straight away." }
      - { speaker: Carmela, es: "E qualora non si intervenisse?", en: "And should nothing be done?" }
      - { speaker: Calogero, es: "Nel caso in cui arrivassero altre piogge forti, potremmo perdere un altro tratto di costa.", en: "If more heavy rain came, we could lose another stretch of coast." }
      - { speaker: Carmela, es: "Pur sapendo tutto questo, il comune non ha ancora deciso niente?", en: "Even knowing all this, the council still hasn't decided anything?" }
      - { speaker: Calogero, es: "Ha deciso, ma a parole. Fermo restando che i fondi devono arrivare dalla Regione.", en: "It has decided, but only on paper. Bearing in mind that the funds have to come from the Region." }
      - { speaker: Carmela, es: "E i turisti? Possono ancora salire sulla scogliera?", en: "And the tourists? Can they still climb onto the cliff?" }
      - { speaker: Calogero, es: "No, è vietato. Al fine di proteggere la roccia bianca, la si può guardare solo dalla spiaggia.", en: "No, it's forbidden. To protect the white rock, you can only look at it from the beach." }
      - { speaker: Carmela, es: "Ultima domanda: che cosa possono fare i cittadini?", en: "Last question: what can ordinary people do?" }
      - { speaker: Calogero, es: "Rispettare i divieti, anziché lamentarsi. E chiedere alla politica di ascoltare i tecnici.", en: "Respect the bans, instead of complaining. And ask politicians to listen to the experts." }
    questions:
