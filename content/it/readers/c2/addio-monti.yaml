id: r.c2.addio-monti
level: c2
title: Addio, monti
kind: literature
author: Alessandro Manzoni (1785–1873)
source: "I promessi sposi, capitolo VIII (edizione definitiva, 1840–1842), finale. Dominio pubblico. Testo integrale del brano, dalla traversata del lago alla fine del capitolo."
intro: "Lucia, forced to flee her village at night with Renzo and her mother Agnese, crosses the lake by moonlight and silently says goodbye to everything she knows. The famous 'Addio, monti' is a lyrical passage in prose: listen to the anaphora (Addio… addio…), the series of three, and the shift from the emigrant who leaves by choice to the one who is driven away."
allow: [manzoni, lucia, rodrigo, adda, don, addio, de', que', d', a']
paragraphs:
  - { es: "Non tirava un alito di vento; il lago giaceva liscio e piano, e sarebbe parso immobile, se non fosse stato il tremolare e l'ondeggiar leggiero della luna, che vi si specchiava da mezzo il cielo. S'udiva soltanto il fiotto morto e lento frangersi sulle ghiaie del lido, il gorgoglìo più lontano dell'acqua rotta tra le pile del ponte, e il tonfo misurato di que' due remi, che tagliavano la superficie azzurra del lago, uscivano a un colpo grondanti, e si rituffavano.", en: "Not a breath of wind was stirring; the lake lay smooth and flat, and would have seemed motionless but for the trembling and gentle swaying of the moon, which was mirrored in it from the middle of the sky. All that could be heard was the dead, slow wash breaking on the gravel of the shore, the more distant gurgling of the water broken among the piers of the bridge, and the measured splash of those two oars, which cut the blue surface of the lake, came out together dripping, and plunged in again." }
  - { es: "L'onda segata dalla barca, riunendosi dietro la poppa, segnava una striscia increspata, che s'andava allontanando dal lido. I passeggieri silenziosi, con la testa voltata indietro, guardavano i monti, e il paese rischiarato dalla luna, e variato qua e là di grand'ombre. Si distinguevano i villaggi, le case, le capanne: il palazzotto di don Rodrigo, con la sua torre piatta, elevato sopra le casucce ammucchiate alla falda del promontorio, pareva un feroce che, ritto nelle tenebre, in mezzo a una compagnia d'addormentati, vegliasse, meditando un delitto.", en: "The water cut by the boat, closing again behind the stern, left a rippled trail that drew further and further from the shore. The silent passengers, their heads turned back, looked at the mountains and at the village lit by the moon and broken here and there by great shadows. They could make out the villages, the houses, the huts: Don Rodrigo's mansion, with its flat tower, rising above the cottages huddled at the foot of the headland, looked like a savage creature standing upright in the darkness among a company of sleepers, keeping watch and plotting a crime." }
  - { es: "Lucia lo vide, e rabbrividì; scese con l'occhio giù giù per la china, fino al suo paesello, guardò fisso all'estremità, scoprì la sua casetta, scoprì la chioma folta del fico che sopravanzava il muro del cortile, scoprì la finestra della sua camera; e, seduta, com'era, nel fondo della barca, posò il braccio sulla sponda, posò sul braccio la fronte, come per dormire, e pianse segretamente.", en: "Lucia saw it and shuddered; her eye travelled down and down the slope to her own little village, looked hard at the far end of it, found her cottage, found the thick crown of the fig tree that rose above the courtyard wall, found the window of her room; and, sitting as she was in the bottom of the boat, she rested her arm on the side, rested her forehead on her arm as if to sleep, and wept in secret." }
  - { es: "Addio, monti sorgenti dall'acque, ed elevati al cielo; cime inuguali, note a chi è cresciuto tra voi, e impresse nella sua mente, non meno che lo sia l'aspetto de' suoi più familiari; torrenti, de' quali distingue lo scroscio, come il suono delle voci domestiche; ville sparse e biancheggianti sul pendìo, come branchi di pecore pascenti; addio! Quanto è tristo il passo di chi, cresciuto tra voi, se ne allontana!", en: "Farewell, mountains rising from the waters and lifted up to the sky; uneven peaks, known to whoever has grown up among you and stamped on his mind no less than the faces of his own family; streams whose roar he can tell apart like the sound of voices at home; villages scattered white on the slopes like flocks of grazing sheep; farewell! How sad is the step of one who, having grown up among you, goes away from you!" }
  - { es: "Alla fantasia di quello stesso che se ne parte volontariamente, tratto dalla speranza di fare altrove fortuna, si disabbelliscono, in quel momento, i sogni della ricchezza; egli si maraviglia d'essersi potuto risolvere, e tornerebbe allora indietro, se non pensasse che, un giorno, tornerà dovizioso.", en: "Even to the imagination of one who leaves of his own free will, drawn by the hope of making his fortune elsewhere, the dreams of wealth lose their beauty at that moment; he marvels that he could ever have made up his mind, and he would turn back then and there, if he did not think that one day he will return a rich man." }
  - { es: "Quanto più si avanza nel piano, il suo occhio si ritira, disgustato e stanco, da quell'ampiezza uniforme; l'aria gli par gravosa e morta; s'inoltra mesto e disattento nelle città tumultuose; le case aggiunte a case, le strade che sboccano nelle strade, pare che gli levino il respiro; e davanti agli edifizi ammirati dallo straniero, pensa, con desiderio inquieto, al campicello del suo paese, alla casuccia a cui ha già messo gli occhi addosso, da gran tempo, e che comprerà, tornando ricco a' suoi monti.", en: "The further he goes into the plain, the more his eye withdraws, sickened and weary, from that uniform expanse; the air seems heavy and dead to him; he makes his way, sad and inattentive, into the noisy cities; the houses piled on houses, the streets opening into streets, seem to take his breath away; and in front of the buildings admired by strangers he thinks, with restless longing, of the little field in his village, of the cottage he set his heart on long ago and will buy when he returns rich to his mountains." }
  - { es: "Ma chi non aveva mai spinto al di là di quelli neppure un desiderio fuggitivo, chi aveva composti in essi tutti i disegni dell'avvenire, e n'è sbalzato lontano, da una forza perversa! Chi, staccato a un tempo dalle più care abitudini, e disturbato nelle più care speranze, lascia que' monti, per avviarsi in traccia di sconosciuti che non ha mai desiderato di conoscere, e non può con l'immaginazione arrivare a un momento stabilito per il ritorno!", en: "But one who had never sent even a passing wish beyond those mountains, who had laid all the plans of the future among them, and is flung far away by a perverse force! One who, torn at once from the dearest habits and troubled in the dearest hopes, leaves those mountains to set off in search of strangers he has never wished to know, and cannot even in imagination reach a fixed moment for his return!" }
  - { es: "Addio, casa natìa, dove, sedendo, con un pensiero occulto, s'imparò a distinguere dal rumore de' passi comuni il rumore d'un passo aspettato con un misterioso timore. Addio, casa ancora straniera, casa sogguardata tante volte alla sfuggita, passando, e non senza rossore; nella quale la mente si figurava un soggiorno tranquillo e perpetuo di sposa.", en: "Farewell, house where I was born, where, sitting with a secret thought, I learned to tell from the sound of ordinary footsteps the sound of one step awaited with a mysterious fear. Farewell, house still not mine, house glanced at so many times in passing, and not without blushing; where my mind pictured a calm and lasting home as a wife." }
  - { es: "Addio, chiesa, dove l'animo tornò tante volte sereno, cantando le lodi del Signore; dov'era promesso, preparato un rito; dove il sospiro segreto del cuore doveva essere solennemente benedetto, e l'amore venir comandato, e chiamarsi santo; addio! Chi dava a voi tanta giocondità è per tutto; e non turba mai la gioia de' suoi figli, se non per prepararne loro una più certa e più grande. Di tal genere, se non tali appunto, erano i pensieri di Lucia, e poco diversi i pensieri degli altri due pellegrini, mentre la barca gli andava avvicinando alla riva destra dell'Adda.", en: "Farewell, church, where my soul so often grew calm again as I sang the praises of the Lord; where a rite had been promised and prepared; where the secret sigh of the heart was to be solemnly blessed, and love was to be commanded and called holy; farewell! He who gave you so much joy is everywhere; and He never disturbs the happiness of His children except to prepare for them one that is surer and greater. Of this kind, if not exactly these, were Lucia's thoughts, and the thoughts of the other two pilgrims were not very different, while the boat carried them nearer to the right bank of the Adda." }
questions:
  - { q: "Com'è il lago durante la traversata notturna?", options: ["Agitato da un forte vento", "Liscio e immobile, illuminato dalla luna", "Coperto di nebbia"], answer: 1, explain: "«Non tirava un alito di vento; il lago giaceva liscio e piano»." }
  - { q: "A che cosa è paragonato il palazzotto di don Rodrigo?", options: ["A un pastore che protegge il gregge", "A un feroce che veglia tra gli addormentati, meditando un delitto", "A una chiesa illuminata"], answer: 1, explain: "«pareva un feroce che, ritto nelle tenebre, in mezzo a una compagnia d'addormentati, vegliasse, meditando un delitto» – the villain's house dominates the sleeping village." }
  - { q: "Che differenza fa il narratore tra chi parte per cercare fortuna e chi parte come Lucia?", options: ["Nessuna: soffrono allo stesso modo", "Il primo può pensare di tornare ricco; chi è cacciato da «una forza perversa» non sa nemmeno se tornerà", "Il primo è più triste di Lucia"], answer: 1, explain: "The emigrant 'tornerà dovizioso'; the exile 'non può con l'immaginazione arrivare a un momento stabilito per il ritorno'." }
  - { q: "Che cos'è la «casa ancora straniera»?", options: ["La casa di Renzo, dove Lucia avrebbe vissuto da sposa", "Una casa in un'altra città", "Il castello di don Rodrigo"], answer: 0, explain: "The house she glanced at 'non senza rossore', imagining 'un soggiorno tranquillo e perpetuo di sposa' – Renzo's home after the wedding that never took place." }
  - { q: "Quale figura retorica domina il brano «Addio, monti… Addio, casa natìa… Addio, chiesa…»?", options: ["L'anafora: la ripetizione di «addio» all'inizio delle frasi", "L'ossimoro", "La litote"], answer: 0, explain: "Anaphora – the same word repeated at the start of successive clauses (c2.u04 rhetorical figures)." }
