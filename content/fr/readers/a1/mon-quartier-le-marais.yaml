id: r.a1.mon-quartier-le-marais
level: a1
title: Mon quartier, le Marais
kind: text
intro: Nicolas writes to a friend about his new flat and his neighbourhood in the Marais, one of the oldest parts of Paris.
allow: [antoine, lucas, centre]
paragraphs:
  - { es: "Salut Lucas !", en: "Hi Lucas!" }
  - { es: "Ça va ? Moi, ça va très bien. J'ai un nouvel appartement à Paris ! Il est dans le Marais, un vieux quartier au centre de la ville. Mon immeuble est ancien et très joli. L'appartement est au quatrième étage, mais il n'y a pas d'ascenseur… Il y a beaucoup d'escaliers !", en: "How are you? I'm very well. I have a new flat in Paris! It's in the Marais, an old neighbourhood in the centre of the city. My building is old and very pretty. The flat is on the fourth floor, but there's no lift… There are lots of stairs!" }
  - { es: "L'appartement n'est pas grand. Il y a un salon, une chambre, une petite cuisine et une salle de bains. Dans le salon, il y a un canapé bleu, une table, deux chaises et mon bureau avec l'ordinateur. Dans la chambre, il y a un lit et une grande fenêtre. Il n'y a pas de balcon, mais j'ai des fleurs sur la fenêtre.", en: "The flat isn't big. There's a living room, a bedroom, a small kitchen and a bathroom. In the living room there's a blue sofa, a table, two chairs and my desk with the computer. In the bedroom there's a bed and a big window. There's no balcony, but I have flowers on the window." }
  - { es: "J'adore le quartier. Les rues sont petites et anciennes, et il y a beaucoup de magasins, de cafés et de restaurants. En face de mon immeuble, il y a une boulangerie. Les croissants sont délicieux ! À côté, il y a une pharmacie et un petit supermarché. Le marché est dans la rue derrière.", en: "I love the neighbourhood. The streets are small and old, and there are lots of shops, cafés and restaurants. Opposite my building there's a bakery. The croissants are delicious! Next door there's a pharmacy and a small supermarket. The market is in the street behind." }
  - { es: "Près de chez moi, il y a aussi la place des Vosges. C'est une très belle place, avec un parc, des arbres et de vieilles maisons rouges. Le dimanche, il y a des musiciens et des familles dans le parc. C'est calme et très joli.", en: "Near my place there's also the Place des Vosges. It's a very beautiful square, with a park, trees and old red houses. On Sundays there are musicians and families in the park. It's quiet and very pretty." }
  - { es: "Mais le quartier n'est pas parfait. Le samedi soir, ma rue est très bruyante : il y a un bar à côté de l'immeuble. Et le loyer est cher, très cher ! Mon voisin, Antoine, est sympa. Il est musicien et il joue du piano… à minuit.", en: "But the neighbourhood isn't perfect. On Saturday evenings my street is very noisy: there's a bar next to the building. And the rent is expensive, very expensive! My neighbour, Antoine, is nice. He's a musician and he plays the piano… at midnight." }
  - { es: "Tu as des vacances en juin ? Il y a un lit dans le salon pour toi. Le canapé est petit, mais il est confortable !", en: "Do you have holidays in June? There's a bed in the living room for you. The sofa is small, but it's comfortable!" }
  - { es: "À bientôt !", en: "See you soon!" }
  - { es: "Nicolas", en: "Nicolas" }
questions:
  - { q: "L'appartement de Nicolas est à quel étage ?", options: ["Au premier étage", "Au quatrième étage", "Au sixième étage"], answer: 1, explain: "«L'appartement est au quatrième étage, mais il n'y a pas d'ascenseur.»" }
  - { q: "Qu'est-ce qu'il n'y a pas dans l'appartement ?", options: ["Un balcon", "Une cuisine", "Une salle de bains"], answer: 0, explain: "«Il n'y a pas de balcon, mais j'ai des fleurs sur la fenêtre.»" }
  - { q: "Qu'est-ce qu'il y a en face de l'immeuble ?", options: ["Une pharmacie", "Un supermarché", "Une boulangerie"], answer: 2, explain: "«En face de mon immeuble, il y a une boulangerie.» The pharmacy and supermarket are next door." }
  - { q: "Pourquoi la rue est bruyante le samedi soir ?", options: ["Il y a un marché", "Il y a un bar à côté", "Il y a des musiciens"], answer: 1, explain: "«Il y a un bar à côté de l'immeuble.» The musicians play on Sundays in the Place des Vosges." }
  - { q: "Que fait Antoine à minuit ?", options: ["Il dort", "Il joue du piano", "Il regarde la télévision"], answer: 1, explain: "«Il est musicien et il joue du piano… à minuit.»" }
glossary:
  - { es: ascenseur, en: "lift, elevator" }
  - { es: musiciens, en: musicians }
  - { es: musicien, en: musician }
  - { es: vacances, en: holidays }
  - { es: confortable, en: comfortable }
