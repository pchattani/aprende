  - id: b1.u02.l4
    title: Les gens avec qui je vis
    teach: [g.relative-preposition]
    tip: "French never ends on a preposition: la personne avec qui je parle, l'ami à qui j'écris, les gens chez qui je dors."
    vocab: [w.confiance, w.faire-confiance, w.jaloux, w.jalousie, w.amitié, w.camarade, w.proche, w.s-aimer, w.embrasser, w.baiser, w.câlin, w.se-fâcher, w.se-réconcilier, w.dispute, w.lequel]
    sentences:
      - { es: "Le monsieur à qui j'ai demandé le chemin m'a accompagnée jusqu'à la basilique.", en: "The man I asked for directions walked me all the way to the basilica.", altEs: ["Le monsieur à qui j'ai demandé le chemin m'a accompagné jusqu'à la basilique."], grammar: [g.relative-preposition], vocab: [w.accompagner] }
      - { es: "Ce sont des amis chez qui je dors quand je vais à Marseille.", en: "They're friends I stay with when I go to Marseille.", altEs: ["Ce sont des amis chez qui je dors quand je viens à Marseille."], grammar: [g.relative-preposition], vocab: [] }
      - { es: "C'est une amie à qui je fais entièrement confiance.", en: "She's a friend I trust completely.", altEs: ["C'est une amie à qui je fais totalement confiance."], grammar: [g.relative-preposition], vocab: [w.faire-confiance], error: { wrong: "C'est une amie que je fais entièrement confiance.", explain: "faire confiance à quelqu'un → à qui: une amie à qui je fais confiance.", grammar: g.relative-preposition } }
      - { es: "Le camarade avec qui je partageais ma chambre est devenu un ami proche.", en: "The classmate I shared my room with became a close friend.", grammar: [g.relative-preposition], vocab: [w.camarade, w.proche] }
      - { es: "La personne pour qui j'ai acheté ces fleurs ne le sait pas encore.", en: "The person I bought these flowers for doesn't know yet.", grammar: [g.relative-preposition], vocab: [] }
      - { es: "C'est la collègue avec qui je me suis disputé hier ; on s'est réconciliés ce matin.", en: "She's the colleague I argued with yesterday; we made up this morning.", altEs: ["C'est la collègue avec qui je me suis disputée hier ; on s'est réconciliées ce matin."], grammar: [g.relative-preposition], vocab: [w.collègue, w.se-réconcilier] }
      - { es: "Mon frère est jaloux de tous les garçons avec qui sa copine parle.", en: "My brother is jealous of all the guys his girlfriend talks to.", altEs: ["Mon frère est jaloux de tous les garçons à qui sa copine parle."], grammar: [g.relative-preposition], vocab: [w.jaloux] }
      - { es: "La jalousie, c'est le défaut contre lequel je me bats tous les jours.", en: "Jealousy is the flaw I fight against every day.", grammar: [g.relative-preposition], vocab: [w.jalousie, w.lequel] }
      - { es: "La terrasse sur laquelle ils se sont embrassés pour la première fois est toujours là.", en: "The terrace where they first kissed is still there.", altEs: ["La terrasse où ils se sont embrassés pour la première fois est toujours là."], altEn: ["The terrace they kissed on for the first time is still there."], grammar: [g.relative-preposition], vocab: [w.embrasser, w.lequel] }
      - { es: "Les voisins chez qui j'ai grandi m'ont appris ce qu'est l'amitié.", en: "The neighbours I grew up with taught me what friendship is.", grammar: [g.relative-preposition], vocab: [w.amitié] }
      - { es: "Pour qui est ce câlin ? — Pour la personne qui m'a fait le meilleur café du monde.", en: "Who's this hug for? — For the person who made me the best coffee in the world.", grammar: [g.relative-preposition, g.relative-qui-que], vocab: [w.câlin] }
      - { es: "Ils se sont fâchés pour rien, mais ils s'aiment beaucoup.", en: "They got angry over nothing, but they love each other a lot.", altEs: ["Ils se sont fâchés pour rien mais ils s'aiment beaucoup."], grammar: [g.pronominal-passe-compose], vocab: [w.se-fâcher, w.s-aimer] }
      - { es: "Il y a eu une dispute entre les voisins avec qui nous partageons le jardin.", en: "There was an argument between the neighbours we share the garden with.", grammar: [g.relative-preposition], vocab: [w.dispute] }
      - { es: "Je travaille avec cette femme. Elle est provençale.", en: "I work with this woman. She's from Provence.", grammar: [g.relative-preposition], vocab: [w.provençal], transform: { instruction: "Join the two sentences with avec qui", answer: "La femme avec qui je travaille est provençale.", alt: ["Cette femme avec qui je travaille est provençale."], en: "The woman I work with is from Provence." } }
      - { es: "J'ai écrit à cet ami. Il ne m'a pas répondu.", en: "I wrote to this friend. He hasn't answered me.", grammar: [g.relative-preposition], vocab: [], transform: { instruction: "Join the two sentences with à qui", answer: "L'ami à qui j'ai écrit ne m'a pas répondu.", alt: ["Cet ami à qui j'ai écrit ne m'a pas répondu."], en: "The friend I wrote to hasn't answered me." } }
      - { es: "Elle lui a envoyé un baiser depuis le bateau qui partait.", en: "She blew him a kiss from the departing boat.", altEs: ["Depuis le bateau qui partait, elle lui a envoyé un baiser."], altEn: ["She sent him a kiss from the boat that was leaving."], grammar: [g.relative-qui-que], vocab: [w.baiser] }
    exchanges:
