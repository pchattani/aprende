id: a2.u08
title: "Ci vado volentieri"
lessons:
  - id: a2.u08.l1
    title: Ci vado domani
    teach: [g.ci-place]
    tip: "ci replaces a place with a, in, da, su: Vai a Greve? Sì, ci vado. It goes before the verb, or on the end of an infinitive (voglio andarci)."
    vocab: [w.posta, w.ospedale, w.biblioteca, w.pasticceria, w.panetteria, w.macelleria, w.edicola, w.tabaccheria, w.fruttivendolo, w.gelateria, w.alimentari, w.lavanderia, w.parrucchiere, w.barbiere]
    sentences:
      - { es: "Vai a Greve domani? Sì, ci vado con mia sorella.", en: "Are you going to Greve tomorrow? Yes, I'm going (there) with my sister.", altEs: ["Vai a Greve domani? Sì, ci vado con mia sorella!", "Domani vai a Greve? Sì, ci vado con mia sorella."], grammar: [g.ci-place], vocab: [w.andare, w.sorella] }
      - { es: "Sei mai stato nel Chianti? Sì, ci sono stato due volte.", en: "Have you ever been to Chianti? Yes, I've been there twice.", altEs: ["Sei mai stata nel Chianti? Sì, ci sono stata due volte."], grammar: [g.ci-place, g.gia-ancora-mai], vocab: [w.volta] }
      - { es: "Devo andare in posta: ci vado prima di pranzo.", en: "I have to go to the post office: I'll go before lunch.", altEs: ["Devo andare alla posta: ci vado prima di pranzo.", "Devo andare in posta, ci vado prima di pranzo."], grammar: [g.ci-place, g.potere-dovere], vocab: [w.posta, w.pranzo] }
      - { es: "La biblioteca chiude alle sei, quindi ci andiamo adesso.", en: "The library closes at six, so we're going there now.", altEs: ["La biblioteca chiude alle sei, allora ci andiamo adesso."], grammar: [g.ci-place, g.time-telling], vocab: [w.biblioteca, w.chiudere] }
      - { es: "Quando torni dal parrucchiere? Ci torno sabato.", en: "When are you going back to the hairdresser's? I'm going back on Saturday.", altEs: ["Quando torni dalla parrucchiera? Ci torno sabato."], grammar: [g.ci-place], vocab: [w.parrucchiere, w.tornare] }
      - { es: "Conosci la macelleria in piazza? Ci compro sempre la carne.", en: "Do you know the butcher's in the square? I always buy my meat there.", altEs: ["Conosci la macelleria in piazza? Compro sempre la carne lì."], grammar: [g.ci-place, g.frequency-adverbs], vocab: [w.macelleria, w.carne] }
      - { es: "Non ci credo! Hai trovato una tabaccheria aperta di domenica?", en: "I don't believe it! You found a tobacconist's open on a Sunday?", altEs: ["Non ci credo, hai trovato una tabaccheria aperta di domenica?"], grammar: [g.ci-place], vocab: [w.tabaccheria, w.credere], note: "Ci also replaces a + thing: credere a qualcosa → crederci." }
      - { es: "Pensi ancora alla vacanza? Sì, ci penso ogni giorno.", en: "Are you still thinking about the holiday? Yes, I think about it every day.", grammar: [g.ci-place], vocab: [w.pensare, w.vacanza] }
      - { es: "Mi accompagni in lavanderia? Non ci voglio andare da solo.", en: "Will you come with me to the launderette? I don't want to go there alone.", altEs: ["Mi accompagni in lavanderia? Non voglio andarci da solo.", "Mi accompagni in lavanderia? Non ci voglio andare da sola."], grammar: [g.ci-place], vocab: [w.lavanderia, w.accompagnare] }
      - { es: "Vai in pasticceria? Sì, ci vado subito.", en: "Are you going to the cake shop? Yes, I'm going right now.", altEs: ["Vai in pasticceria? Sì, ci vado adesso."], grammar: [g.ci-place], vocab: [w.pasticceria, w.subito], error: { wrong: "Vai in pasticceria? Sì, vado ci subito.", explain: "ci goes before the conjugated verb: ci vado.", grammar: g.ci-place } }
      - { es: "Mio nonno è in ospedale: ci andiamo stasera.", en: "My grandfather is in hospital: we're going there tonight.", altEs: ["Il nonno è in ospedale: ci andiamo stasera."], grammar: [g.ci-place], vocab: [w.ospedale, w.stasera] }
      - { es: "Vado dal fruttivendolo ogni mattina.", en: "I go to the greengrocer's every morning.", altEs: ["Ogni mattina vado dal fruttivendolo."], grammar: [g.ci-place, g.prepositions-motion], vocab: [w.fruttivendolo, w.ogni], transform: { instruction: "Replace dal fruttivendolo with ci", answer: "Ci vado ogni mattina.", alt: ["Ogni mattina ci vado."], en: "I go there every morning." } }
      - { es: "La gelateria vicino al ponte? Ci sono andata ieri sera.", en: "The ice-cream shop near the bridge? I went there last night.", altEs: ["La gelateria vicino al ponte? Ci sono andato ieri sera."], grammar: [g.ci-place, g.passato-prossimo-essere], vocab: [w.gelateria, w.ieri-sera] }
      - { es: "Il negozio di alimentari è piccolo, ma ci trovi tutto.", en: "The grocer's is small, but you can find everything there.", altEs: ["L'alimentari è piccolo, ma ci trovi tutto."], grammar: [g.ci-place], vocab: [w.alimentari, w.trovare] }
      - { es: "L'edicola è chiusa: ci torno domani mattina.", en: "The newsstand is closed: I'll go back tomorrow morning.", altEs: ["L'edicola è chiusa, ci torno domattina."], grammar: [g.ci-place, g.present-for-future], vocab: [w.edicola] , transform: { instruction: "Say you want to go back (voglio + infinitive)", answer: "L'edicola è chiusa: voglio tornarci domani mattina.", alt: ["L'edicola è chiusa: ci voglio tornare domani mattina."], en: "The newsstand is closed: I want to go back tomorrow morning." } }
      - { es: "C'è una panetteria qui vicino? Sì, ci vado tutte le mattine.", en: "Is there a bakery near here? Yes, I go there every morning.", altEs: ["C'è una panetteria qui vicino? Sì, ci vado ogni mattina."], grammar: [g.ci-place, g.c-e-ci-sono], vocab: [w.panetteria, w.vicino], note: "c'è (there is) and ci vado (I go there) use the same little word." }
    exchanges:
      - q: { es: "Sei mai stato a Greve in Chianti?", en: "Have you ever been to Greve in Chianti?" }
        a: { es: "Sì, ci sono stato l'anno scorso per la festa del vino.", en: "Yes, I went there last year for the wine festival." }
        alt: ["Sì, ci sono stata l'anno scorso.", "No, non ci sono mai stato.", "No, ma ci vado domani."]
        grammar: [g.ci-place, g.gia-ancora-mai]
        vocab: [w.scorso, w.festa]
      - q: { es: "Vieni in biblioteca con me?", en: "Are you coming to the library with me?" }
        a: { es: "Oggi no, ci vado domani.", en: "Not today, I'm going tomorrow." }
        alt: ["Sì, ci vengo volentieri.", "No, ci vado domani."]
        grammar: [g.ci-place]
        vocab: [w.biblioteca, w.venire]
      - q: { es: "Quando vai dal barbiere?", en: "When are you going to the barber's?" }
        a: { es: "Ci vado venerdì pomeriggio.", en: "I'm going on Friday afternoon." }
        alt: ["Venerdì pomeriggio.", "Ci vado domani."]
        grammar: [g.ci-place]
        vocab: [w.barbiere]
      - q: { es: "Hai pensato al regalo per la mamma?", en: "Have you thought about the present for Mum?" }
        a: { es: "Non ancora, ma ci penso stasera.", en: "Not yet, but I'll think about it tonight." }
        alt: ["Sì, ci penso io!", "No, non ci ho pensato."]
        grammar: [g.ci-place, g.gia-ancora-mai]
        vocab: [w.regalo, w.pensare]
      - q: { es: "Scusi, c'è una tabaccheria qui vicino?", en: "Excuse me, is there a tobacconist's near here?" }
        a: { es: "Sì, in piazza. Ci arriva a piedi in due minuti.", en: "Yes, in the square. You can walk there in two minutes." }
        alt: ["Sì, in piazza.", "No, mi dispiace."]
        grammar: [g.ci-place, g.tu-vs-lei]
        vocab: [w.tabaccheria, w.a-piedi]
    texts:
      - title: "Il sabato a Greve"
        es: ["Il sabato vado sempre a Greve.", "Ci vado per il mercato in piazza.", "Prima passo in panetteria, poi dal fruttivendolo.", "E alla fine? In gelateria, ovviamente!"]
        en: ["On Saturdays I always go to Greve.", "I go there for the market in the square.", "First I stop at the bakery, then the greengrocer's.", "And at the end? The ice-cream shop, of course!"]
        grammar: [g.ci-place]
        vocab: [w.panetteria, w.fruttivendolo, w.gelateria, w.mercato]
    spicy:
      - { es: "Vai a quella festa? Allora ci vengo anch'io.", en: "Are you going to that party? Then I'm coming too.", altEs: ["Vai a quella festa? Allora ci vengo anche io."], grammar: [g.ci-place], vocab: [w.festa, w.venire] }
      - { es: "Pensi ancora a me? Io ci penso tutto il giorno.", en: "Do you still think about me? I think about it all day.", altEs: ["Pensi ancora a me? Io ci penso tutto il giorno!"], grammar: [g.ci-place, g.stressed-pronouns], vocab: [w.pensare] }
      - { es: "Il parrucchiere è carino: ci torno anche con i capelli perfetti.", en: "The hairdresser is cute: I'm going back even with perfect hair.", altEs: ["La parrucchiera è carina: ci torno anche con i capelli perfetti."], grammar: [g.ci-place], vocab: [w.parrucchiere, w.capelli] }
      - { es: "In biblioteca? Ci vado solo perché ci lavori tu.", en: "The library? I only go there because you work there.", grammar: [g.ci-place], vocab: [w.biblioteca, w.lavorare] }
      - { es: "Non ci credo: mi hai invitato tu a cena!", en: "I don't believe it: you invited me to dinner!", altEs: ["Non ci credo: mi hai invitata tu a cena!"], grammar: [g.ci-place, g.direct-object-pronouns], vocab: [w.invitare, w.cena] }

  - id: a2.u08.l2
    title: Quanti ne vuole?
    teach: [g.ne-partitive]
    tip: "ne stands for 'of it / of them' when you say how much: Quante bottiglie? Ne vorrei due. Keep the number, drop the noun."
    vocab: [w.ne, w.paio, w.alcuni, w.qualche, w.parecchio, w.un-sacco-di, w.metà, w.doppio, w.intero, w.pezzo, w.fetta, w.lattina, w.vasetto, w.dozzina, w.fornaio]
    sentences:
      - { es: "Quante bottiglie di Chianti vuole? Ne vorrei due.", en: "How many bottles of Chianti would you like? I'd like two.", altEs: ["Quante bottiglie di Chianti vuole? Ne prendo due."], grammar: [g.ne-partitive, g.volere-vorrei], vocab: [w.ne, w.bottiglia] }
      - { es: "Hai fratelli? Sì, ne ho uno.", en: "Do you have any brothers? Yes, I have one.", altEs: ["Hai dei fratelli? Sì, ne ho uno."], altEn: ["Do you have brothers and sisters? Yes, I've got one."], grammar: [g.ne-partitive], vocab: [w.fratello], error: { wrong: "Hai fratelli? Sì, ho uno.", explain: "When you answer 'how many' with a number, keep ne: ne ho uno.", grammar: g.ne-partitive } }
      - { es: "Vuoi una fetta di torta? Sì, ne prendo una piccola.", en: "Do you want a slice of cake? Yes, I'll have a small one.", altEs: ["Vuoi una fetta di torta? Sì, ne prendo una piccola, grazie."], grammar: [g.ne-partitive], vocab: [w.fetta, w.torta] }
      - { es: "Quanti anni hai? Ne ho trentadue.", en: "How old are you? I'm thirty-two.", altEs: ["Quanti anni hai? Ho trentadue anni."], grammar: [g.ne-partitive, g.avere-expressions], vocab: [w.anno] }
      - { es: "Le uova? Ne compro una dozzina per la torta.", en: "The eggs? I'm buying a dozen for the cake.", altEs: ["Le uova? Ne prendo una dozzina per la torta."], grammar: [g.ne-partitive, g.irregular-plurals-body], vocab: [w.dozzina, w.uovo] }
      - { es: "Il pane intero è troppo: ne prendo la metà.", en: "A whole loaf is too much: I'll take half.", altEs: ["Un pane intero è troppo, ne prendo metà."], grammar: [g.ne-partitive], vocab: [w.intero, w.metà, w.pane] }
      - { es: "Mi dà un vasetto di marmellata? No, ne prendo due.", en: "Can I have a jar of jam? No, actually I'll take two.", altEs: ["Mi dà un vasetto di marmellata? Anzi, ne prendo due."], grammar: [g.ne-partitive, g.imperativo-lei], vocab: [w.vasetto, w.marmellata] }
      - { es: "Ho parecchi amici a Siena, ma a Firenze non ne ho nessuno.", en: "I have quite a few friends in Siena, but in Florence I don't have any.", altEs: ["A Siena ho parecchi amici, ma a Firenze non ne ho nessuno."], grammar: [g.ne-partitive, g.double-negation], vocab: [w.parecchio, w.amico] }
      - { es: "Nel Chianti ci sono un sacco di vigne e alcuni castelli antichi.", en: "In Chianti there are loads of vineyards and a few old castles.", altEs: ["Nel Chianti ci sono tantissime vigne e alcuni castelli antichi."], grammar: [g.c-e-ci-sono], vocab: [w.un-sacco-di, w.alcuni, w.vigna, w.castello] }
      - { es: "Quanti pezzi di pecorino vuole? Ne prendo un paio.", en: "How many pieces of pecorino would you like? I'll take a couple.", altEs: ["Quanti pezzi di pecorino vuole? Ne prendo due."], grammar: [g.ne-partitive], vocab: [w.pezzo, w.paio, w.pecorino] }
      - { es: "Vuole del vino? Sì, ne bevo un bicchiere, grazie.", en: "Would you like some wine? Yes, I'll have a glass, thanks.", altEs: ["Vuole del vino? Sì, ne prendo un bicchiere, grazie."], grammar: [g.ne-partitive, g.partitive-di], vocab: [w.vino, w.bicchiere] }
      - { es: "Non ne ho idea!", en: "I have no idea!", altEs: ["Non ne ho la minima idea!"], grammar: [g.ne-partitive], vocab: [w.idea] }
      - { es: "Parliamo del viaggio? Ne parliamo domani a cena.", en: "Shall we talk about the trip? We'll talk about it tomorrow at dinner.", altEs: ["Parliamo del viaggio? Ne parliamo domani sera a cena."], grammar: [g.ne-partitive], vocab: [w.viaggio, w.parlare], note: "ne also replaces di + something: parlare di → parlarne." }
      - { es: "Ho tre cugini a Greve.", en: "I have three cousins in Greve.", grammar: [g.ne-partitive], vocab: [w.cugino], transform: { instruction: "Answer 'Quanti cugini hai a Greve?' with ne", answer: "Ne ho tre.", alt: ["A Greve ne ho tre."], en: "I have three (of them)." } }
      - { es: "Bevo un sacco di caffè: il doppio di mio marito!", en: "I drink loads of coffee: twice as much as my husband!", altEs: ["Bevo tantissimo caffè: il doppio di mio marito!"], grammar: [g.molto-poco-troppo], vocab: [w.doppio, w.un-sacco-di] }
      - { es: "Il fornaio ha ancora qualche pane toscano: ne vuole uno?", en: "The baker still has a few Tuscan loaves: would you like one?", altEs: ["Il fornaio ha ancora qualche pane toscano. Ne vuole uno?"], grammar: [g.ne-partitive], vocab: [w.fornaio, w.qualche, w.toscano], note: "qualche always takes a singular noun. Tuscan bread is made without salt." , transform: { instruction: "Ask a friend (tu) instead of Lei", answer: "Il fornaio ha ancora qualche pane toscano: ne vuoi uno?", alt: ["Il fornaio ha ancora qualche pane toscano. Ne vuoi uno?"], en: "The baker still has a few Tuscan loaves: do you want one?" } }
    exchanges:
      - q: { es: "Quante fette di prosciutto Le do?", en: "How many slices of ham shall I give you?" }
        a: { es: "Ne vorrei sei, grazie.", en: "I'd like six, thanks." }
        alt: ["Sei, grazie.", "Ne prendo sei.", "Me ne dia sei, per favore."]
        grammar: [g.ne-partitive, g.volere-vorrei]
        vocab: [w.fetta, w.prosciutto]
      - q: { es: "Hai dei cantucci?", en: "Have you got any cantucci?" }
        a: { es: "Sì, ne ho un sacco! Ne vuoi uno?", en: "Yes, I've got loads! Do you want one?" }
        alt: ["Sì, ne ho alcuni.", "No, non ne ho."]
        grammar: [g.ne-partitive]
        vocab: [w.cantucci, w.un-sacco-di]
      - q: { es: "Quanti figli avete?", en: "How many children do you have?" }
        a: { es: "Ne abbiamo due, un figlio e una figlia.", en: "We have two, a son and a daughter." }
        alt: ["Ne abbiamo due.", "Non ne abbiamo.", "Ne abbiamo tre."]
        grammar: [g.ne-partitive]
        vocab: [w.figlio]
      - q: { es: "Quanto latte compriamo?", en: "How much milk shall we buy?" }
        a: { es: "Ne compriamo due litri.", en: "Let's buy two litres." }
        alt: ["Due litri.", "Ne prendiamo un litro."]
        grammar: [g.ne-partitive]
        vocab: [w.latte, w.litro]
      - q: { es: "Quante lattine di birra ci sono in frigo?", en: "How many cans of beer are there in the fridge?" }
        a: { es: "Ce ne sono quattro.", en: "There are four." }
        alt: ["Quattro.", "Non ce ne sono più."]
        grammar: [g.ne-partitive, g.c-e-ci-sono]
        vocab: [w.lattina, w.birra]
    texts:
      - title: "Lista della spesa"
        es: ["Pane toscano: ne prendo uno intero.", "Uova: ne servono una dozzina.", "Marmellata: ne compro un vasetto.", "Birra: due lattine, non di più!"]
        en: ["Tuscan bread: I'll take a whole one.", "Eggs: we need a dozen.", "Jam: I'll buy a jar.", "Beer: two cans, no more!"]
        grammar: [g.ne-partitive]
        vocab: [w.intero, w.dozzina, w.vasetto, w.lattina]
    spicy:
      - { es: "Quanti baci vuoi? Ne ho un sacco per te.", en: "How many kisses do you want? I've got loads for you.", grammar: [g.ne-partitive], vocab: [w.bacio, w.un-sacco-di] }
      - { es: "Hai un ragazzo? No? Ne cerchi uno?", en: "Do you have a boyfriend? No? Are you looking for one?", altEs: ["Hai una ragazza? No? Ne cerchi una?"], grammar: [g.ne-partitive], vocab: [w.ragazzo, w.cercare] }
      - { es: "Una fetta di torta? Ne prendo metà, l'altra metà è tua.", en: "A slice of cake? I'll have half, the other half is yours.", grammar: [g.ne-partitive], vocab: [w.fetta, w.metà] }
      - { es: "Ho qualche idea per stasera. Ne vuoi sentire una?", en: "I've got a few ideas for tonight. Do you want to hear one?", grammar: [g.ne-partitive], vocab: [w.qualche, w.idea] }
      - { es: "Di ragazzi simpatici ne conosco parecchi, ma carini come te nessuno.", en: "I know quite a few nice guys, but none as cute as you.", altEs: ["Di ragazze simpatiche ne conosco parecchie, ma carine come te nessuna."], grammar: [g.ne-partitive, g.double-negation], vocab: [w.parecchio, w.carino] }

  - id: a2.u08.l3
    title: Ne ho comprate tre
    teach: [g.ne-participle-agreement]
    tip: "With ne in the passato prossimo, the participle agrees with what you counted: Quante pizze? Ne ho mangiate due."
    vocab: [w.farmacista, w.postino, w.idraulico, w.elettricista, w.meccanico, w.vigile, w.pompiere, w.contadino, w.pescatore]
    sentences:
      - { es: "Quante bottiglie avete comprato? Ne abbiamo comprate sei.", en: "How many bottles did you buy? We bought six.", altEs: ["Quante bottiglie avete preso? Ne abbiamo prese sei."], grammar: [g.ne-participle-agreement], vocab: [w.bottiglia, w.comprare], transform: { instruction: "Change to 'I'", answer: "Ne ho comprate sei.", alt: ["Quante bottiglie hai comprato? Ne ho comprate sei."], en: "I bought six." } }
      - { es: "Quanti vini hai assaggiato? Ne ho assaggiati cinque.", en: "How many wines did you taste? I tasted five.", grammar: [g.ne-participle-agreement], vocab: [w.assaggiare, w.vino] }
      - { es: "Di foto ne ho fatte centinaia!", en: "I took hundreds of photos!", altEs: ["Ne ho fatte centinaia, di foto!"], grammar: [g.ne-participle-agreement], vocab: [w.foto, w.centinaio] }
      - { es: "Quante cartoline hai scritto? Ne ho scritta solo una.", en: "How many postcards did you write? I only wrote one.", grammar: [g.ne-participle-agreement], vocab: [w.cartolina, w.scrivere] }
      - { es: "Hai mangiato delle olive? Sì, ne ho mangiate troppe.", en: "Did you eat some olives? Yes, I ate too many.", grammar: [g.ne-participle-agreement, g.partitive-di], vocab: [w.oliva, w.troppo] }
      - { es: "Ho chiamato tre idraulici, ma non ne è venuto nessuno.", en: "I called three plumbers, but none of them came.", altEs: ["Ho chiamato tre idraulici, ma nessuno è venuto."], grammar: [g.ne-participle-agreement, g.double-negation], vocab: [w.idraulico, w.chiamare] }
      - { es: "Quante lettere ha portato il postino? Ne ha portate due.", en: "How many letters did the postman bring? He brought two.", altEs: ["Quante lettere ha portato la postina? Ne ha portate due."], grammar: [g.ne-participle-agreement], vocab: [w.postino, w.lettera, w.portare] }
      - { es: "Il meccanico ha cambiato un pezzo della macchina? Sì, ne ha cambiati tre.", en: "Did the mechanic change a part of the car? Yes, he changed three.", grammar: [g.ne-participle-agreement], vocab: [w.meccanico, w.pezzo, w.cambiare] }
      - { es: "Di contadini ne ho conosciuti tanti, ma lui è il più simpatico.", en: "I've met lots of farmers, but he's the nicest.", grammar: [g.ne-participle-agreement, g.superlatives], vocab: [w.contadino, w.conoscere] }
      - { es: "Ieri al porto i pescatori erano pochi: ne ho visti solo tre.", en: "Yesterday at the harbour there were few fishermen: I only saw three.", grammar: [g.ne-participle-agreement, g.passato-prossimo-vs-imperfetto], vocab: [w.pescatore, w.porto] }
      - { es: "Quante pizze avete mangiato? Ne abbiamo mangiate quattro.", en: "How many pizzas did you eat? We ate four.", grammar: [g.ne-participle-agreement], vocab: [w.pizza], error: { wrong: "Quante pizze avete mangiato? Ne abbiamo mangiato quattro.", explain: "With ne the participle agrees with what is counted: le pizze → mangiate.", grammar: g.ne-participle-agreement } }
      - { es: "Il farmacista mi ha dato delle compresse: ne ho prese due.", en: "The pharmacist gave me some tablets: I took two.", altEs: ["La farmacista mi ha dato delle compresse: ne ho prese due."], grammar: [g.ne-participle-agreement, g.indirect-object-pronouns], vocab: [w.farmacista, w.compressa] }
      - { es: "I vigili hanno fatto un sacco di multe: ne hanno fatte venti in un'ora!", en: "The traffic wardens gave out loads of fines: they gave twenty in an hour!", grammar: [g.ne-participle-agreement], vocab: [w.vigile, w.multa] }
      - { es: "Quanta pasta hai cucinato? Ne ho cucinata un chilo!", en: "How much pasta did you cook? I cooked a kilo!", grammar: [g.ne-participle-agreement], vocab: [w.pasta, w.chilo], error: { wrong: "Quanta pasta hai cucinato? Ne ho cucinati un chilo!", explain: "La pasta is feminine singular, so the participle is cucinata.", grammar: g.ne-participle-agreement } }
      - { es: "L'elettricista ha cambiato le lampade? Ne ha cambiate solo due.", en: "Has the electrician changed the lamps? He's only changed two.", grammar: [g.ne-participle-agreement], vocab: [w.elettricista, w.lampada] }
      - { es: "Quanti caffè hai preso oggi? Ne ho presi tre.", en: "How many coffees have you had today? I've had three.", grammar: [g.ne-participle-agreement], vocab: [w.caffè], transform: { instruction: "Answer that you've had only one", answer: "Ne ho preso solo uno.", alt: ["Ne ho preso uno.", "Ne ho preso solo uno oggi."], en: "I've only had one." } }
    exchanges:
      - q: { es: "Quanti vini avete assaggiato?", en: "How many wines did you taste?" }
        a: { es: "Ne abbiamo assaggiati sei, tutti buonissimi.", en: "We tasted six, all really good." }
        alt: ["Ne abbiamo assaggiati sei.", "Troppi!", "Ne abbiamo assaggiato solo uno."]
        grammar: [g.ne-participle-agreement]
        vocab: [w.assaggiare]
      - q: { es: "Hai fatto tante foto?", en: "Did you take lots of photos?" }
        a: { es: "Sì, ne ho fatte più di cento!", en: "Yes, I took more than a hundred!" }
        alt: ["Sì, ne ho fatte un sacco.", "No, ne ho fatte poche."]
        grammar: [g.ne-participle-agreement]
        vocab: [w.foto]
      - q: { es: "Quante uova hai usato per la torta?", en: "How many eggs did you use for the cake?" }
        a: { es: "Ne ho usate tre.", en: "I used three." }
        alt: ["Tre.", "Ne ho usate quattro."]
        grammar: [g.ne-participle-agreement, g.irregular-plurals-body]
        vocab: [w.uovo]
      - q: { es: "Hai trovato un idraulico?", en: "Have you found a plumber?" }
        a: { es: "Ne ho chiamati due, ma oggi nessuno può venire.", en: "I've called two, but nobody can come today." }
        alt: ["Sì, ne ho trovato uno.", "No, non ancora."]
        grammar: [g.ne-participle-agreement, g.double-negation]
        vocab: [w.idraulico]
      - q: { es: "Quanti chilometri avete fatto in bici?", en: "How many kilometres did you do by bike?" }
        a: { es: "Ne abbiamo fatti quaranta, tra le vigne.", en: "We did forty, among the vineyards." }
        alt: ["Quaranta.", "Ne abbiamo fatti un sacco."]
        grammar: [g.ne-participle-agreement]
        vocab: [w.chilometro, w.vigna]
    texts:
      - title: "Una giornata nel Chianti"
        es: ["Oggi abbiamo visitato tre cantine.", "Di vini ne abbiamo assaggiati dodici!", "Bottiglie? Ne abbiamo comprate solo due, per fortuna."]
        en: ["Today we visited three wine cellars.", "We tasted twelve wines!", "Bottles? We only bought two, luckily."]
        grammar: [g.ne-participle-agreement]
        vocab: [w.cantina, w.assaggiare]
      - title: "Messaggio dal porto"
        es: ["Sono al porto con i pescatori.", "Stamattina hanno preso tanti pesci.", "Ne ho comprati due per stasera!"]
        en: ["I'm at the harbour with the fishermen.", "This morning they caught lots of fish.", "I bought two for tonight!"]
        grammar: [g.ne-participle-agreement]
        vocab: [w.pescatore, w.porto]
    spicy:
      - { es: "Di cuori ne ho rotti parecchi, ma il tuo no.", en: "I've broken quite a few hearts, but not yours.", grammar: [g.ne-participle-agreement], vocab: [w.cuore, w.rompere] }
      - { es: "Quanti messaggi ti ho mandato? Ne ho mandati troppi, lo so.", en: "How many messages have I sent you? I've sent too many, I know.", grammar: [g.ne-participle-agreement], vocab: [w.messaggio, w.mandare] }
      - { es: "Di ragazzi ne ho conosciuti tanti, ma nessuno cucina come te.", en: "I've met lots of guys, but none of them cooks like you.", altEs: ["Di ragazze ne ho conosciute tante, ma nessuna cucina come te."], grammar: [g.ne-participle-agreement, g.double-negation], vocab: [w.conoscere, w.cucinare] }
      - { es: "Bicchieri di vino? Ne abbiamo bevuti due, e poi abbiamo ballato.", en: "Glasses of wine? We had two, and then we danced.", grammar: [g.ne-participle-agreement], vocab: [w.bicchiere, w.ballare] }
      - { es: "Di pompieri ne ho visti tanti, ma nessuno carino come te.", en: "I've seen lots of firefighters, but none as cute as you.", grammar: [g.ne-participle-agreement, g.double-negation], vocab: [w.pompiere, w.carino] }

  - id: a2.u08.l4
    title: Quanto ci vuole?
    teach: [g.metterci-volerci]
    tip: "ci vuole / ci vogliono = it takes (in general); ci metto, ci metti… = it takes me, you… Past: ci è voluto, ci ho messo."
    vocab: [w.metterci, w.volerci, w.nuoto, w.ciclismo, w.escursionismo, w.allenarsi, w.allenamento, w.gara, w.campionato, w.tifoso, w.giocatore, w.allenatore, w.segnare, w.gol, w.pareggiare]
    sentences:
      - { es: "Quanto ci vuole da Firenze a Greve in macchina?", en: "How long does it take from Florence to Greve by car?", altEs: ["Quanto ci vuole in macchina da Firenze a Greve?"], grammar: [g.metterci-volerci, g.prepositions-transport], vocab: [w.volerci, w.macchina] }
      - { es: "Ci vogliono tre ore per fare il giro delle vigne a piedi.", en: "It takes three hours to walk round the vineyards.", altEs: ["Per fare il giro delle vigne a piedi ci vogliono tre ore."], grammar: [g.metterci-volerci], vocab: [w.volerci, w.vigna, w.a-piedi], error: { wrong: "Ci vuole tre ore per fare il giro delle vigne a piedi.", explain: "With a plural (tre ore) use ci vogliono.", grammar: g.metterci-volerci } }
      - { es: "Quanto ci metti per andare al lavoro? Ci metto venti minuti in bici.", en: "How long does it take you to get to work? It takes me twenty minutes by bike.", altEs: ["Quanto ci metti ad andare al lavoro? Ci metto venti minuti in bici."], grammar: [g.metterci-volerci, g.prepositions-transport], vocab: [w.metterci, w.lavoro], transform: { instruction: "Answer for 'my sister'", answer: "Mia sorella ci mette venti minuti in bici.", alt: ["Mia sorella ci mette venti minuti in bicicletta."], en: "It takes my sister twenty minutes by bike." } }
      - { es: "Ci ho messo un'ora a trovare parcheggio a Siena!", en: "It took me an hour to find a parking space in Siena!", altEs: ["Ci ho messo un'ora per trovare parcheggio a Siena!"], grammar: [g.metterci-volerci], vocab: [w.metterci, w.parcheggio], transform: { instruction: "Change to 'we'", answer: "Ci abbiamo messo un'ora a trovare parcheggio a Siena!", alt: ["Ci abbiamo messo un'ora per trovare parcheggio a Siena!"], en: "It took us an hour to find a parking space in Siena!" } }
      - { es: "Per l'Eroica ci vuole una bici d'epoca.", en: "For the Eroica you need a vintage bike.", grammar: [g.metterci-volerci], vocab: [w.volerci, w.epoca], note: "L'Eroica is a ride for old bikes on the white gravel roads around Gaiole in Chianti." }
      - { es: "Il ciclismo mi piace, ma per salire a Radda ci metto un'ora!", en: "I like cycling, but it takes me an hour to ride up to Radda!", altEs: ["Mi piace il ciclismo, ma per salire a Radda ci metto un'ora!"], grammar: [g.metterci-volerci], vocab: [w.ciclismo, w.metterci, w.salire] }
      - { es: "Mi alleno tre volte alla settimana per la gara.", en: "I train three times a week for the race.", altEs: ["Per la gara mi alleno tre volte alla settimana."], grammar: [g.reflexive-present], vocab: [w.allenarsi, w.gara] }
      - { es: "Quanto ci hai messo a finire la gara? Ci ho messo sei ore!", en: "How long did it take you to finish the race? It took me six hours!", grammar: [g.metterci-volerci], vocab: [w.metterci, w.gara, w.finire] }
      - { es: "Ci sono voluti due mesi di allenamento.", en: "It took two months of training.", altEs: ["Ci sono voluti due mesi di allenamenti."], grammar: [g.metterci-volerci, g.passato-prossimo-essere], vocab: [w.volerci, w.allenamento], note: "volerci takes essere in the past and agrees: ci è voluta un'ora, ci sono voluti due mesi." }
      - { es: "Il nostro giocatore ha segnato due gol, ma abbiamo pareggiato.", en: "Our player scored two goals, but we drew.", altEs: ["Il nostro giocatore ha fatto due gol, ma abbiamo pareggiato."], grammar: [g.passato-prossimo-avere], vocab: [w.giocatore, w.segnare, w.gol, w.pareggiare] }
      - { es: "L'allenatore dice sempre che ci vuole pazienza.", en: "The coach always says it takes patience.", altEs: ["L'allenatrice dice sempre che ci vuole pazienza."], grammar: [g.metterci-volerci], vocab: [w.allenatore, w.pazienza] }
      - { es: "Per diventare un buon giocatore ci vogliono anni.", en: "It takes years to become a good player.", altEs: ["Ci vogliono anni per diventare un buon giocatore."], grammar: [g.metterci-volerci], vocab: [w.diventare, w.giocatore] }
      - { es: "Per l'escursionismo nel Chianti ci vogliono scarpe comode.", en: "For hiking in Chianti you need comfortable shoes.", grammar: [g.metterci-volerci], vocab: [w.escursionismo, w.scarpa, w.comodo] }
      - { es: "Quanto ci mettete a prepararvi? Ci mettiamo dieci minuti!", en: "How long do you take to get ready? We take ten minutes!", grammar: [g.metterci-volerci, g.reflexive-present], vocab: [w.metterci, w.prepararsi], transform: { instruction: "Ask one friend (tu)", answer: "Quanto ci metti a prepararti?", alt: ["Quanto tempo ci metti a prepararti?"], en: "How long do you take to get ready?" } }
      - { es: "Mi piace il nuoto, ma ci metto mezz'ora ad arrivare in piscina.", en: "I like swimming, but it takes me half an hour to get to the pool.", grammar: [g.metterci-volerci], vocab: [w.nuoto, w.piscina] }
      - { es: "I tifosi della Fiorentina sperano di vincere il campionato.", en: "Fiorentina fans hope to win the league.", altEs: ["I tifosi della Fiorentina sperano di vincere lo scudetto."], grammar: [g.verbs-with-prepositions], vocab: [w.tifoso, w.campionato, w.sperare] }
    exchanges:
      - q: { es: "Quanto ci vuole da Siena a Firenze?", en: "How long does it take from Siena to Florence?" }
        a: { es: "In autobus ci vuole più di un'ora.", en: "By bus it takes more than an hour." }
        alt: ["Più di un'ora.", "In macchina ci vuole un'ora."]
        grammar: [g.metterci-volerci, g.prepositions-transport]
        vocab: [w.volerci, w.autobus]
      - q: { es: "Quanto ci metti a prepararti?", en: "How long do you take to get ready?" }
        a: { es: "Ci metto cinque minuti, davvero!", en: "I take five minutes, honestly!" }
        alt: ["Cinque minuti!", "Ci metto un'ora."]
        grammar: [g.metterci-volerci]
        vocab: [w.metterci, w.prepararsi]
      - q: { es: "Com'è finita la partita?", en: "How did the match end?" }
        a: { es: "Abbiamo pareggiato: uno a uno.", en: "We drew: one all." }
        alt: ["Uno a uno.", "Abbiamo vinto due a zero!", "Abbiamo perso."]
        grammar: [g.passato-prossimo-avere]
        vocab: [w.pareggiare, w.partita]
      - q: { es: "Ti alleni ancora?", en: "Do you still train?" }
        a: { es: "Sì, faccio nuoto due volte alla settimana.", en: "Yes, I swim twice a week." }
        alt: ["Sì, tutti i giorni.", "No, non mi alleno più."]
        grammar: [g.reflexive-present]
        vocab: [w.allenarsi, w.nuoto]
      - q: { es: "Quanto ci hai messo a fare l'Eroica?", en: "How long did it take you to do the Eroica?" }
        a: { es: "Ci ho messo otto ore, ma è stata un'esperienza bellissima.", en: "It took me eight hours, but it was a wonderful experience." }
        alt: ["Otto ore.", "Ci ho messo tutto il giorno!"]
        grammar: [g.metterci-volerci]
        vocab: [w.metterci, w.esperienza]
    texts:
      - title: "Messaggio dell'allenatore"
        es: ["Ragazzi, domani c'è la gara.", "Ci vogliono tanta pazienza e poca paura.", "Partiamo alle otto: ci mettiamo un'ora ad arrivare."]
        en: ["Guys, tomorrow is the race.", "It takes lots of patience and little fear.", "We leave at eight: it takes us an hour to get there."]
        grammar: [g.metterci-volerci]
        vocab: [w.gara, w.allenatore]
    spicy:
      - { es: "Quanto ci metti a dire di sì? Io ho tempo.", en: "How long will it take you to say yes? I've got time.", grammar: [g.metterci-volerci], vocab: [w.metterci] }
      - { es: "Per invitarmi a cena ci vogliono due cose: pizza e pazienza.", en: "To invite me to dinner, it takes two things: pizza and patience.", grammar: [g.metterci-volerci], vocab: [w.volerci, w.pazienza] }
      - { es: "Ci ho messo tre settimane a invitarti. Sono timido.", en: "It took me three weeks to invite you. I'm shy.", altEs: ["Ci ho messo tre settimane a invitarti. Sono timida."], grammar: [g.metterci-volerci], vocab: [w.metterci, w.timido] }
      - { es: "Il mio allenamento preferito? Ballare con te tutta la notte.", en: "My favourite workout? Dancing with you all night.", grammar: [g.stressed-pronouns], vocab: [w.allenamento, w.ballare] }
      - { es: "Hai segnato un gol: il mio cuore è tuo.", en: "You've scored a goal: my heart is yours.", grammar: [g.passato-prossimo-avere], vocab: [w.segnare, w.gol, w.cuore] }

dialogues:
  - id: a2.u08.d1
    title: In cantina
    context: Anna visits a small winery near Greve in Chianti. Bruno, the winemaker, offers her a tasting.
    lines:
      - { speaker: Bruno, es: "Benvenuta! È la prima volta che viene nel Chianti?", en: "Welcome! Is this the first time you've come to Chianti?" }
      - { speaker: Anna, es: "Io sì, ma mio marito ci è già stato due volte.", en: "For me, yes, but my husband has already been here twice." }
      - { speaker: Bruno, es: "Allora cominciamo. Questo è il nostro Chianti Classico: vuole assaggiarlo?", en: "Then let's begin. This is our Chianti Classico: would you like to taste it?" }
      - { speaker: Anna, es: "Volentieri! Quante bottiglie fate ogni anno?", en: "Gladly! How many bottles do you make every year?" }
      - { speaker: Bruno, es: "Ne facciamo circa trentamila. Non sono molte.", en: "We make about thirty thousand. That's not many." }
      - { speaker: Anna, es: "E quanto ci vuole per fare un buon vino?", en: "And how long does it take to make a good wine?" }
      - { speaker: Bruno, es: "Ci vogliono due anni, a volte di più. E tanta pazienza.", en: "It takes two years, sometimes more. And lots of patience." }
      - { speaker: Anna, es: "È buonissimo. Ne prendo sei.", en: "It's delicious. I'll take six." }
      - { speaker: Bruno, es: "Ottimo. Domani cominciamo la vendemmia: ci viene anche Lei?", en: "Excellent. Tomorrow we start the grape harvest: will you come too?" }
      - { speaker: Anna, es: "Certo che ci vengo! Quanto ci metto da Greve?", en: "Of course I'll come! How long will it take me from Greve?" }
      - { speaker: Bruno, es: "In macchina ci mette dieci minuti. Ci vediamo alle sette!", en: "By car it'll take you ten minutes. See you at seven!" }
    questions:
      - { q: "Chi è già stato nel Chianti?", options: ["Anna", "Il marito di Anna", "Nessuno dei due"], answer: 1, explain: "Anna says: mio marito ci è già stato due volte." }
      - { q: "Quanto ci vuole per fare un buon vino, secondo Bruno?", options: ["Due mesi", "Due anni o di più", "Dieci anni"], answer: 1, explain: "Ci vogliono due anni, a volte di più." }
      - { q: "Quante bottiglie compra Anna?", options: ["Due", "Sei", "Trenta"], answer: 1, explain: "Ne prendo sei: ne stands for the bottles." }
      - { q: "Che cosa c'è domani?", options: ["La vendemmia", "Una gara di ciclismo", "Il mercato di Greve"], answer: 0, explain: "Domani cominciamo la vendemmia." }
writing:
  - task: "Answer a friend's questions about places you go, replacing the place with ci."
    es: "Vai spesso in biblioteca? Quando vai alla posta? Sei mai stato in Chianti?"
    min: 30
    max: 65
    use: [w.biblioteca, w.posta, w.ci, w.spesso]
    grammar: [g.ci-place]
    expect:
      - { pattern: "\\bci\\s+(vado|vai|va|andiamo|andate|vanno|sono|siamo|torno|torniamo|passo|resto|vengo|abito)\\b", hint: "Replace the place with ci: ci vado, ci sono stato, ci torno…" }
    model: { es: "In biblioteca ci vado ogni martedì, perché è tranquilla. Alla posta ci vado domani mattina: devo spedire un pacco. In Chianti? Sì, ci sono stato l'anno scorso con mio fratello e ci torno sabato: il vino è ottimo!", en: "I go to the library every Tuesday, because it's quiet. I'm going to the post office tomorrow morning: I have to send a parcel. Chianti? Yes, I went there last year with my brother and I'm going back on Saturday: the wine is excellent!" }
  - task: "You are buying food for a picnic in a Chianti village shop. Answer the shopkeeper and ask for more things, using ne for quantities."
    es: "Buongiorno! Quanti panini vuole? E di prosciutto, quanto ne prende?"
    min: 25
    max: 60
    use: [w.ne, w.etto, w.pezzo, w.dozzina, w.panino]
    grammar: [g.ne-partitive]
    expect:
      - { pattern: "\\bne\\s+(vorrei|voglio|prendo|compro|ho|vuole|prende|bastano|basta|servono|serve)\\b", hint: "Use ne for quantities: ne vorrei sei, ne prendo due etti." }
    model: { es: "Buongiorno! Di panini ne vorrei sei, per favore. Di prosciutto ne prendo due etti. Ha anche del formaggio? Allora ne prendo un pezzo. E le uova? Ne vorrei una dozzina. Quant'è?", en: "Good morning! I'd like six rolls, please. I'll take two hundred grams of ham. Have you got any cheese too? Then I'll take a piece. And eggs? I'd like a dozen. How much is it?" }
  - task: "Tell a friend about your shopping at a market in Chianti: say how many things you bought, using ne with a past participle that agrees (ne ho comprate tre)."
    min: 25
    max: 60
    use: [w.ne, w.bottiglia, w.un-sacco-di, w.alcuni, w.comprare]
    grammar: [g.ne-participle-agreement]
    expect:
      - { pattern: "\\bne\\s+(ho|abbiamo|hai|ha)\\s+\\S+(at|ut|it|s|tt)[oaie]\\b", hint: "Use ne + agreeing participle: ne ho comprate tre, ne ho presi due." }
    model: { es: "Oggi al mercato ho comprato un sacco di cose! Vendevano bottiglie di vino buonissimo: ne ho comprate tre. Le pesche sembravano buone e ne ho prese sei. Ho visto anche alcuni formaggi, ma non ne ho comprati.", en: "Today at the market I bought loads of things! They were selling bottles of excellent wine: I bought three. The peaches looked good and I took six. I also saw some cheeses, but I didn't buy any." }
  - task: "Explain how long things take: getting from Florence to the Chianti hills, training for a race, cooking a dish. Use ci vuole / ci vogliono and metterci."
    min: 30
    max: 65
    use: [w.volerci, w.metterci, w.allenarsi, w.gara, w.ciclismo]
    grammar: [g.metterci-volerci]
    expect:
      - { pattern: "\\bci (vuole|vogliono|è voluto|è voluta|sono voluti|sono volute|volevano|voleva)\\b|\\bci vuole|\\bci (metto|metti|mette|mettiamo|mettete|mettono|ho messo|abbiamo messo|hai messo|ha messo)\\b", hint: "Say how long it takes: ci vuole un'ora, ci metto venti minuti." }
    model: { es: "Da Firenze al Chianti ci vuole un'ora in macchina, ma in bicicletta io ci metto quasi tre ore! Mi alleno ogni domenica per una gara di ciclismo a ottobre. Per prepararsi bene ci vogliono due o tre mesi.", en: "From Florence to Chianti it takes an hour by car, but by bike it takes me almost three hours! I train every Sunday for a cycling race in October. To get ready properly you need two or three months." }
