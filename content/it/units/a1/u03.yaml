      - { es: "Perché sei così carino? — Perché mangio tanta frutta.", en: "Why are you so cute? — Because I eat lots of fruit.", altEs: ["Perché sei così carina? — Perché mangio tanta frutta."], grammar: [g.question-words], vocab: [w.perché] }
