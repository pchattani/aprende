id: r.c1.la-casa-del-nespolo
level: c1
title: La casa del nespolo
kind: literature
author: Giovanni Verga (1840–1922)
source: "I Malavoglia, capitolo I (1881), inizio. Dominio pubblico. Testo dell'edizione Treves; il taglio è segnato con (…)."
intro: "The opening of Verga's great novel of a fishing family in Aci Trezza, near Catania. The narrator speaks with the voice of the village – proverbs, nicknames, gossip – rather than from above: this is Verga's verismo and his free indirect style. Notice how the family is built up like the fingers of a hand."
allow: [verga, malavoglia, trezza, ognina, aci, castello, toscano, ntoni, provvidenza, concetta, cola, fortunato, cipolla, bastiano, bastianazzo, cristoforo, longa, luca, mena, filomena, agata, alessi, alessio, lia, rosalia, silvestro, borboni, franceschello]
paragraphs:
  - { es: "Un tempo i Malavoglia erano stati numerosi come i sassi della strada vecchia di Trezza; ce n'erano persino ad Ognina, e ad Aci Castello, tutti buona e brava gente di mare, proprio all'opposto di quel che sembrava dal nomignolo, come dev'essere. Veramente nel libro della parrocchia si chiamavano Toscano, ma questo non voleva dir nulla, poiché da che il mondo era mondo, all'Ognina, a Trezza e ad Aci Castello, li avevano sempre conosciuti per Malavoglia, di padre in figlio, che avevano sempre avuto delle barche sull'acqua, e delle tegole al sole.", en: "Once the Malavoglias had been as many as the stones on the old road to Trezza; there were some even at Ognina and at Aci Castello, all good, decent seafaring folk, the very opposite of what their nickname suggested, as is only right. Strictly speaking, in the parish register they were called Toscano, but that meant nothing, because since the world began, at Ognina, Trezza and Aci Castello, they had always been known as Malavoglia, from father to son, people who had always had boats on the water and roof tiles in the sun." }
  - { es: "Adesso a Trezza non rimanevano che i Malavoglia di padron 'Ntoni, quelli della casa del nespolo, e della Provvidenza ch'era ammarrata sul greto, sotto il lavatoio, accanto alla Concetta dello zio Cola, e alla paranza di padron Fortunato Cipolla.", en: "Now in Trezza there were only the Malavoglias of Padron 'Ntoni left, the ones from the house with the medlar tree, and of the Provvidenza, which was moored on the shingle below the wash-house, next to Uncle Cola's Concetta and Padron Fortunato Cipolla's fishing boat." }
  - { es: "Le burrasche che avevano disperso di qua e di là gli altri Malavoglia, erano passate senza far gran danno sulla casa del nespolo e sulla barca ammarrata sotto il lavatoio; e padron 'Ntoni, per spiegare il miracolo, soleva dire, mostrando il pugno chiuso – un pugno che sembrava fatto di legno di noce – «Per menare il remo bisogna che le cinque dita s'aiutino l'un l'altro». Diceva pure, «Gli uomini son fatti come le dita della mano: il dito grosso deve far da dito grosso, e il dito piccolo deve far da dito piccolo».", en: "The storms that had scattered the other Malavoglias here and there had passed without doing much harm to the house with the medlar tree or to the boat moored below the wash-house; and Padron 'Ntoni, to explain the miracle, used to say, showing his clenched fist – a fist that seemed made of walnut wood – 'To pull an oar the five fingers have to help one another.' He also said, 'Men are made like the fingers of a hand: the thumb must act as the thumb, and the little finger must act as the little finger.'" }
  - { es: "E la famigliuola di padron 'Ntoni era realmente disposta come le dita della mano. Prima veniva lui, il dito grosso, che comandava le feste e le quarant'ore; poi suo figlio Bastiano, Bastianazzo, perché era grande e grosso quanto il San Cristoforo che c'era dipinto sotto l'arco della pescheria della città; e così grande e grosso com'era filava diritto alla manovra comandata, e non si sarebbe soffiato il naso se suo padre non gli avesse detto «sòffiati il naso» tanto che s'era tolta in moglie la Longa quando gli avevano detto «pìgliatela».", en: "And Padron 'Ntoni's little family really was arranged like the fingers of a hand. First came he himself, the thumb, who ordered the feast days and the Forty Hours' devotions; then his son Bastiano, called Bastianazzo because he was as big and burly as the Saint Christopher painted under the arch of the fish market in town; and big and burly as he was, he carried out every order to the letter, and he wouldn't have blown his nose unless his father had told him 'blow your nose' – so much so that he had taken the Longa as his wife when they told him 'take her'." }
  - { es: "Poi veniva la Longa, una piccina che badava a tessere, salare le acciughe, e far figliuoli, da buona massaia; infine i nipoti, in ordine di anzianità: 'Ntoni, il maggiore, un bighellone di vent'anni, che si buscava tutt'ora qualche scappellotto dal nonno, e qualche pedata più giù per rimettere l'equilibrio, quando lo scappellotto era stato troppo forte; Luca, «che aveva più giudizio del grande» ripeteva il nonno; Mena (Filomena) soprannominata «Sant'Agata» perché stava sempre al telaio, e si suol dire «donna di telaio, gallina di pollaio, e triglia di gennaio»; Alessi (Alessio) un moccioso tutto suo nonno colui!; e Lia (Rosalia) ancora né carne né pesce. – Alla domenica, quando entravano in chiesa, l'uno dietro l'altro, pareva una processione.", en: "Then came the Longa, a tiny woman who saw to the weaving, the salting of anchovies and the bearing of children, like a good housewife; and finally the grandchildren, in order of age: 'Ntoni, the eldest, a twenty-year-old idler who still earned the odd clip round the ear from his grandfather, and the odd kick lower down to restore the balance when the clip had been too hard; Luca, 'who had more sense than the big one', as his grandfather kept saying; Mena (Filomena), nicknamed 'Saint Agatha' because she was always at the loom, and as the saying goes, 'a woman at the loom, a hen in the coop and a red mullet in January'; Alessi (Alessio), a snotty little boy, the spitting image of his grandfather; and Lia (Rosalia), still neither fish nor fowl. On Sundays, when they went into church one behind the other, they looked like a procession." }
  - { es: "Padron 'Ntoni sapeva anche certi motti e proverbi che aveva sentito dagli antichi, «perché il motto degli antichi mai mentì»: – «Senza pilota barca non cammina» – «Per far da papa bisogna saper far da sagrestano» – oppure – «Fa il mestiere che sai, che se non arricchisci camperai» – «Contentati di quel che t'ha fatto tuo padre; se non altro non sarai un birbante» ed altre sentenze giudiziose.", en: "Padron 'Ntoni also knew certain sayings and proverbs he had heard from the old folk, 'because the saying of the ancients never lied': 'Without a pilot a boat won't go' – 'To be pope you must know how to be sexton' – or else – 'Do the trade you know: if you don't get rich, you'll get by' – 'Be content with what your father made you; if nothing else, you won't be a rogue' – and other wise maxims." }
  - { es: "Ecco perché la casa del nespolo prosperava, e padron 'Ntoni passava per testa quadra, al punto che a Trezza l'avrebbero fatto consigliere comunale, se don Silvestro, il segretario, il quale la sapeva lunga, non avesse predicato che era un codino marcio, un reazionario di quelli che proteggono i Borboni, e che cospirava pel ritorno di Franceschello, onde poter spadroneggiare nel villaggio, come spadroneggiava in casa propria.", en: "That is why the house with the medlar tree prospered, and Padron 'Ntoni was thought a level-headed man, so much so that in Trezza they would have made him a town councillor, if Don Silvestro, the town clerk, who knew a thing or two, hadn't gone about preaching that he was a rotten old reactionary, one of those who stand up for the Bourbons, and that he was plotting for the return of Franceschello so that he could lord it over the village as he lorded it over his own house." }
  - { es: "Padron 'Ntoni invece non lo conosceva neanche di vista Franceschello, e badava agli affari suoi, e soleva dire: «Chi ha carico di casa non può dormire quando vuole» perché «chi comanda ha da dar conto». (…) Nel dicembre 1863, 'Ntoni, il maggiore dei nipoti, era stato chiamato per la leva di mare.", en: "Padron 'Ntoni, on the other hand, didn't even know Franceschello by sight, and minded his own business, and used to say: 'He who has a household to look after can't sleep when he likes', because 'he who gives the orders must answer for them'. (…) In December 1863 'Ntoni, the eldest grandson, had been called up for service in the navy." }
questions:
  - { q: "Da chi deriva il punto di vista del narratore in queste pagine?", options: ["Da uno storico che studia la Sicilia", "Dalla comunità del paese, con i suoi proverbi e soprannomi", "Da 'Ntoni, il nipote maggiore, che racconta in prima persona"], answer: 1, explain: "Verga's narrator speaks like a villager of Aci Trezza (come dev'essere, colui!, si suol dire): the 'regression' of the narrator typical of verismo." }
  - { q: "Qual è il vero cognome dei Malavoglia?", options: ["Cipolla", "Toscano", "Provvidenza"], answer: 1, explain: "«nel libro della parrocchia si chiamavano Toscano». Malavoglia ('ill will') is a nickname – the opposite of what they are." }
  - { q: "Che cosa vuole insegnare padron 'Ntoni con l'immagine delle dita della mano?", options: ["Che ognuno deve fare la sua parte e aiutare gli altri", "Che il più forte deve comandare da solo", "Che bisogna lavorare con le mani e non con la testa"], answer: 0, explain: "«Per menare il remo bisogna che le cinque dita s'aiutino l'un l'altro» – family solidarity and a fixed place for everyone." }
  - { q: "Com'è descritto Bastianazzo?", options: ["Furbo e indipendente", "Grande e grosso, ma obbedisce in tutto al padre", "Piccolo e malato"], answer: 1, explain: "He would not even blow his nose unless his father told him to, and married the Longa because he was told «pìgliatela»." }
  - { q: "Perché padron 'Ntoni non è diventato consigliere comunale?", options: ["Perché non sapeva leggere", "Perché don Silvestro diceva che era un reazionario dei Borboni", "Perché non voleva lasciare la barca"], answer: 1, explain: "Note the periodo ipotetico of the past: l'avrebbero fatto consigliere… se don Silvestro… non avesse predicato che era un codino marcio." }
