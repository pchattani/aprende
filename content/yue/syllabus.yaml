  - id: b2
    title: B2
    name: Vantage
    description: Interact with fluency and spontaneity with native speakers. Read attitude and stance in the particles people use, express emphasis with 連…都, 一…就 and 越…越, use everyday idioms, argue a point in a debate and talk about Hong Kong culture on the Outlying Islands.
    wordTarget: 5000
    canDo:
      - Understand and use the attitude particles 喎, 囉, 啩, 嘛, 咩 and 㗎.
      - Express emphasis, immediacy and escalation with 連…都, 一…就 and 越…越.
      - Use common Cantonese idioms and colloquial expressions naturally.
      - Take part in a debate, add points, concede and sum up.
      - Follow films, radio phone-ins and conversations about culture and the environment.
    units:
      - id: b2.u01
        title: 原來係噉㗎
        subtitle: Attitude particles I - 喎 and 㗎
        authored: true
        canDo:
          - "Pass on what someone else said with 喎."
          - "React to something I've just noticed with 喎."
          - "Explain and insist with 㗎."
        grammar: [g.wo5-hearsay, g.wo3-noticing, g.gaa3-explaining]
      - id: b2.u02
        title: 梗係啦，咁簡單嘛
        subtitle: Attitude particles II - 囉, 嘛 and 咩
        authored: true
        canDo:
          - "Say \"that's just how it is\" with 囉."
          - "Point out the obvious with 嘛."
          - "Show surprise or disbelief with 咩."
        grammar: [g.lo1-obvious, g.maa3-as-you-know, g.me1-surprise]
      - id: b2.u03
        title: 應該係噉啩
        subtitle: Guessing and particle combinations
        authored: true
        canDo:
          - "Make a tentative guess with 啩."
          - "Understand particle clusters like 㗎喇 and 咋嘛."
          - "Hear how the tone of a particle changes its meaning."
        grammar: [g.gwaa3-guess, g.particle-clusters, g.particle-tones]
      - id: b2.u04
        title: 連阿婆都識用
        subtitle: Even - 連…都 and universal 都
        authored: true
        canDo:
          - 'Say "even …" with 連…都.'
          - 'Say "not a single one" with 一…都唔/冇.'
          - 'Say "everyone", "everything" and "anywhere" with question word + 都.'
        grammar: [g.lin-dou-even, g.jat-dou-negative, g.wh-dou-every]
      - id: b2.u05
        title: 一落船就食海鮮
        subtitle: As soon as, the more, as long as
        authored: true
        canDo:
          - "Say one thing happens as soon as another does."
          - "Say the more …, the more … ."
          - "State a minimum condition with 只要…就."
        grammar: [g.jat-zau-as-soon-as, g.jyut-jyut-the-more, g.zi-jiu-zau-as-long-as]
      - id: b2.u06
