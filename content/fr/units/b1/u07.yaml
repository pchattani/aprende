    model: { es: "La semaine dernière, j'ai eu un malentendu avec mon ami Karim. Il m'avait invité à son anniversaire, mais il avait envoyé le message à mon ancien numéro ! Je ne suis donc pas venu à la fête. Karim était vexé, parce qu'il pensait que je l'avais oublié exprès. Quand je me suis rendu compte de l'erreur, je me suis excusé et je lui ai tout expliqué. Il m'a pardonné et nous avons bien ri.", en: "Last week I had a misunderstanding with my friend Karim. He had invited me to his birthday, but he had sent the message to my old number! So I didn't come to the party. Karim was hurt, because he thought I had forgotten on purpose. When I realised the mistake, I apologised and explained everything. He forgave me and we had a good laugh." }
