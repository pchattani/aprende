id: r.c1.canne-al-vento
level: c1
title: Canne al vento
kind: literature
author: Grazia Deledda (1871–1936)
source: "Canne al vento, capitolo I (1913), inizio. Dominio pubblico. Testo della prima edizione; accenti normalizzati all'uso moderno; i tagli sono segnati con (…)."
intro: "The opening of the Sardinian novel by Grazia Deledda, Nobel Prize for Literature 1926. Efix, the old servant of three impoverished noblewomen, rests at sunset above the little farm he has tended for thirty years; as night falls, the valley fills with the spirits of Sardinian folklore. Notice the long descriptive sentences and how the narration slips into Efix's own thoughts (perché ricordare il passato? Rimpianto inutile)."
allow: [deledda, efix, pintor, colombi, ester, galte, panas, ammattadore, janas, cananèa, filirèa, signora, rimedio]
paragraphs:
  - { es: "Tutto il giorno Efix, il servo delle dame Pintor, aveva lavorato a rinforzare l'argine primitivo da lui stesso costruito un po' per volta a furia d'anni e di fatica, giù in fondo al poderetto lungo il fiume: e al cader della sera contemplava la sua opera dall'alto, seduto davanti alla capanna sotto il ciglione glauco di canne a mezza costa sulla bianca collina dei Colombi.", en: "All day long Efix, the servant of the Pintor ladies, had worked at strengthening the rough embankment he had built himself, little by little, through years of toil, down at the bottom of the small farm along the river; and as evening fell he gazed at his work from above, sitting in front of his hut beneath the blue-green ridge of reeds halfway up the white Hill of the Doves." }
  - { es: "Eccolo tutto ai suoi piedi, silenzioso e qua e là scintillante d'acque nel crepuscolo, il poderetto che Efix considerava più suo che delle sue padrone: trent'anni di possesso e di lavoro lo han fatto ben suo, e le siepi di fichi d'India che lo chiudono dall'alto in basso come due muri grigi serpeggianti di scaglione in scaglione dalla collina al fiume, gli sembrano i confini del mondo.", en: "There it lay at his feet, silent and here and there glinting with water in the twilight, the little farm that Efix thought of as more his own than his mistresses': thirty years of holding it and working it have made it truly his, and the hedges of prickly pear that enclose it from top to bottom, like two grey walls winding down from terrace to terrace, from the hill to the river, seem to him the edges of the world." }
  - { es: "Il servo non guardava al di là del poderetto anche perché i terreni da una parte e dall'altra erano un tempo appartenuti alle sue padrone: perché ricordare il passato? Rimpianto inutile. Meglio pensare all'avvenire e sperare nell'aiuto di Dio.", en: "The servant did not look beyond the little farm, partly because the land on either side had once belonged to his mistresses: why remember the past? Useless regret. Better to think of the future and hope for God's help." }
  - { es: "E Dio prometteva una buona annata, o per lo meno faceva ricoprir di fiori tutti i mandorli e i peschi della valle; e questa, fra due file di colline bianche, con lontananze cerule di monti ad occidente e di mare ad oriente, coperta di vegetazione primaverile, d'acque, di macchie, di fiori, dava l'idea di una culla gonfia di veli verdi, di nastri azzurri, col mormorio del fiume monotono come quello di un bambino che s'addormentava.", en: "And God was promising a good year, or at least he was covering every almond and peach tree in the valley with blossom; and the valley, between two rows of white hills, with sky-blue distances of mountains to the west and sea to the east, covered in spring growth, in water, in scrub, in flowers, looked like a cradle swollen with green veils and blue ribbons, with the murmur of the river as monotonous as that of a child falling asleep." }
  - { es: "Ma le giornate eran già troppo calde ed Efix pensava anche alle piogge torrenziali che gonfiano il fiume senz'argini e lo fanno balzare come un mostro e distruggere ogni cosa: sperare, sì, ma non fidarsi anche; star vigili come le canne sopra il ciglione che ad ogni soffio di vento si battono l'una contro l'altra le foglie come per avvertirsi del pericolo.", en: "But the days were already too hot, and Efix was also thinking of the torrential rains that swell the unbanked river and make it leap like a monster and destroy everything: hope, yes, but not trust too much; stay watchful like the reeds on the ridge, which at every breath of wind beat their leaves against one another as if to warn each other of danger." }
  - { es: "Per questo aveva lavorato tutto il giorno e adesso, in attesa della notte, mentre per non perder tempo intesseva una stuoia di giunchi, pregava perché Dio rendesse valido il suo lavoro. Che cosa è un piccolo argine se Dio non lo rende, col suo volere, formidabile come una montagna?", en: "That was why he had worked all day, and now, waiting for night, while he wove a rush mat so as not to waste time, he prayed that God would make his work hold. What is a little embankment if God, by His will, does not make it as mighty as a mountain?" }
  - { es: "(…) La luna saliva davanti a lui, e le voci della sera avvertivano l'uomo che la sua giornata era finita. Era il grido cadenzato del cuculo, il zirlio dei grilli precoci, qualche gemito d'uccello; era il sospiro delle canne e la voce sempre più chiara del fiume: ma era soprattutto un soffio, un ansito misterioso che pareva uscire dalla terra stessa; sì, la giornata dell'uomo lavoratore era finita, ma cominciava la vita fantastica dei folletti, delle fate, degli spiriti erranti.", en: "(…) The moon was rising before him, and the voices of the evening told the man that his day was over. There was the rhythmic call of the cuckoo, the chirping of the early crickets, the odd moan of a bird; there was the sighing of the reeds and the ever clearer voice of the river: but above all there was a breath, a mysterious panting that seemed to come from the earth itself; yes, the working man's day was over, but the fantastic life of the goblins, the fairies, the wandering spirits was beginning." }
  - { es: "I fantasmi degli antichi Baroni scendevano dalle rovine del castello sopra il paese di Galte, su, all'orizzonte a sinistra di Efix, e percorrevano le sponde del fiume alla caccia dei cinghiali e delle volpi: le loro armi scintillavano in mezzo ai bassi ontani della riva, e l'abbaiar fioco dei cani in lontananza indicava il loro passaggio.", en: "The ghosts of the old Barons came down from the ruins of the castle above the village of Galte, up there on the horizon to Efix's left, and rode along the riverbanks hunting boar and foxes: their weapons glinted among the low alders on the bank, and the faint barking of dogs in the distance marked their passing." }
  - { es: "Efix sentiva il rumore che le panas (donne morte di parto) facevano nel lavar i loro panni giù al fiume, battendoli con uno stinco di morto e credeva di intraveder l'ammattadore, folletto con sette berretti entro i quali conserva un tesoro, balzar di qua e di là sotto il bosco di mandorli, inseguito dai vampiri con la coda di acciaio. (…) Specialmente nelle notti di luna tutto questo popolo misterioso anima le colline e le valli: l'uomo non ha diritto a turbarlo con la sua presenza, come gli spiriti han rispettato lui durante il corso del sole; è dunque tempo di ritirarsi e chiuder gli occhi sotto la protezione degli angeli custodi.", en: "Efix could hear the noise the panas (women who had died in childbirth) made as they washed their linen down at the river, beating it with a dead man's shinbone, and he thought he glimpsed the ammattadore, a goblin with seven caps in which he keeps a treasure, leaping here and there under the almond grove, chased by vampires with steel tails. (…) Especially on moonlit nights this whole mysterious people brings the hills and valleys to life: man has no right to disturb it with his presence, just as the spirits have respected him while the sun was in the sky; so it is time to withdraw and close one's eyes under the protection of the guardian angels." }
questions:
  - { q: "Che cosa ha fatto Efix per tutta la giornata?", options: ["Ha pescato nel fiume", "Ha rinforzato l'argine del poderetto lungo il fiume", "Ha lavorato nella casa delle sue padrone"], answer: 1, explain: "«aveva lavorato a rinforzare l'argine primitivo da lui stesso costruito» – the trapassato prossimo sets the day's work before the evening scene." }
  - { q: "Perché Efix considera il poderetto «più suo che delle sue padrone»?", options: ["Perché l'ha comprato", "Perché ci lavora e lo custodisce da trent'anni", "Perché le padrone glielo hanno regalato"], answer: 1, explain: "«trent'anni di possesso e di lavoro lo han fatto ben suo» – note the switch to the present tense, as if we were inside Efix's mind." }
  - { q: "«perché ricordare il passato? Rimpianto inutile.» Chi parla in queste frasi?", options: ["Le dame Pintor", "Il narratore, che riporta i pensieri di Efix senza «disse» o «pensò»", "Un ragazzo del paese"], answer: 1, explain: "This is discorso indiretto libero: Efix's thoughts enter the narration directly, without a verb of saying." }
  - { q: "Che cosa teme Efix, nonostante la bella primavera?", options: ["La siccità", "Le piogge torrenziali che gonfiano il fiume", "I ladri"], answer: 1, explain: "«pensava anche alle piogge torrenziali che gonfiano il fiume senz'argini e lo fanno balzare come un mostro»." }
  - { q: "Che cosa succede, secondo le credenze popolari, quando finisce la giornata dell'uomo?", options: ["Comincia la vita dei folletti, delle fate e degli spiriti", "Le campane chiamano tutti in chiesa", "I pastori tornano con le pecore"], answer: 0, explain: "«la giornata dell'uomo lavoratore era finita, ma cominciava la vita fantastica dei folletti, delle fate, degli spiriti erranti»." }
