      - { es: "你哋幾時結婚呀？", en: "When are you getting married?", altEs: ["你哋幾時結婚？"], grammar: [g.question-words], vocab: [w.git3-fan1], error: { wrong: "你哋幾時結婚嗎？", explain: "Never add 嗎 to a question that already has a question word (幾時); use 呀.", grammar: g.question-words } }
