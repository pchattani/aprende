id: a2.u07
title: 啦、喇、吖、咋
lessons:
  - id: a2.u07.l1
    title: 坐啦，唔好客氣
    teach: [g.laa1-suggestion]
    tip: "啦 (laa1) turns a plain sentence into a friendly invitation or nudge: 坐 'sit' becomes 坐啦 'do sit down'."
    vocab: [w.hou2-laa1, w.syun3-laa1, w.maan6-maan2-lai4, w.ceoi4-bin2, w.m4-hou2-haak3-hei3, w.haak3-hei3, w.zau2-sin1, w.do1-ze6-saai3, w.mai5-zyu6, w.ci4-tong4.b, w.jing2, w.pui4]
    sentences:
      - { es: "入嚟坐啦，唔好客氣。", en: "Come in and sit down, make yourself at home.", altEs: ["入嚟坐啦，唔使客氣。", "請入嚟坐啦，唔好客氣。", "入嚟坐啦，唔好咁客氣。"], altEn: ["Come in and have a seat, don't be shy."], grammar: [g.laa1-suggestion], vocab: [w.jap6-lai4, w.co5, w.m4-hou2-haak3-hei3] }
      - { es: "食多啲啦，仲有好多。", en: "Have some more, there's plenty left.", altEs: ["食多啲啦，仲有好多㗎。", "多食啲啦，仲有好多。"], altEn: ["Eat some more, there's lots left."], grammar: [g.laa1-suggestion], vocab: [w.sik6, w.do1-di1] }
      - { es: "我哋入去南蓮園池行吓啦。", jp: "ngo5 dei6 jap6 heoi3 naam4 lin4 jyun4 ci4 haang4 haa5 laa1", en: "Let's go into Nan Lian Garden for a stroll.", altEs: ["我哋入南蓮園池行吓啦。", "我哋去南蓮園池行吓啦。"], altEn: ["Let's go and have a walk in Nan Lian Garden."], grammar: [g.laa1-suggestion, g.haa-briefly], vocab: [w.jap6-heoi3, w.haang4] }
      - { es: "慢慢嚟啦，仲有時間。", en: "Take your time, there's still time.", altEs: ["慢慢嚟，仲有時間。", "慢慢嚟啦，仲有時間㗎。"], grammar: [g.laa1-suggestion], vocab: [w.maan6-maan2-lai4, w.si4-gaan3] }
      - { es: "好啦，好啦，我陪你去啦。", en: "OK, OK, I'll go with you.", altEs: ["好啦，我陪你去啦。", "好啦好啦，我陪你去啦。"], altEn: ["All right, all right, I'll come with you."], grammar: [g.laa1-suggestion], vocab: [w.hou2-laa1, w.pui4] }
      - { es: "你揀啦，我隨便。", en: "You choose, I'm easy.", altEs: ["你揀啦，我隨便呀。", "隨便啦，你揀啦。"], altEn: ["You pick, anything's fine with me.", "You choose, I don't mind."], grammar: [g.laa1-suggestion], vocab: [w.gaan2, w.ceoi4-bin2] }
      - { es: "算啦，我哋下次再嚟啦。", en: "Never mind, let's come again next time.", altEs: ["算啦，下次再嚟啦。", "算啦，我哋下次再嚟過啦。"], altEn: ["Forget it, we'll come back next time."], grammar: [g.laa1-suggestion, g.zoi-vs-jau], vocab: [w.syun3-laa1, w.haa6-ci3] }
      - { es: "我哋喺池塘旁邊影張相啦。", en: "Let's take a photo next to the pond.", altEs: ["我哋喺個池塘旁邊影張相啦。", "喺池塘旁邊影張相啦。"], altEn: ["Let's take a picture by the pond."], grammar: [g.laa1-suggestion], vocab: [w.ci4-tong4.b, w.pong4-bin1, w.jing2-soeng2], transform: { instruction: "Say you already did it: use 咗 and drop 啦", answer: "我哋喺池塘旁邊影咗張相。", alt: ["我哋喺個池塘旁邊影咗張相。"], en: "We took a photo next to the pond." } }
      - { es: "我鍾意行公園啦、睇書啦、飲茶啦。", en: "I like walks in the park, reading, having tea, that kind of thing.", altEs: ["我鍾意行公園啦、睇書啦、飲茶啦，好多嘢。"], altEn: ["I like strolling in parks, reading books, drinking tea and so on."], grammar: [g.laa1-suggestion, g.zung-ji-like], vocab: [w.zung1-ji3, w.gung1-jyun2, w.tai2-syu1, w.jam2-caa4], note: "啦 after each item of a list means 'and so on, things like that'." }
      - { es: "你哋走先啦，我等陣嚟。", en: "You go on ahead, I'll come in a bit.", altEs: ["你哋走先啦，我一陣嚟。", "你哋先走啦，我等陣嚟。"], altEn: ["You all go first, I'll follow later."], grammar: [g.laa1-suggestion], vocab: [w.zau2-sin1, w.dang2-zan6] }
      - { es: "多謝晒！下次我請你飲茶啦。", en: "Thanks so much! Next time I'll treat you to yum cha.", altEs: ["唔該晒！下次我請你飲茶啦。", "多謝晒！下次到我請你飲茶啦。"], grammar: [g.laa1-suggestion], vocab: [w.do1-ze6-saai3, w.ceng2, w.jam2-caa4] }
      - { es: "咪住，等佢一陣啦。", en: "Hold on, let's wait for him a moment.", altEs: ["咪住，等佢一陣先啦。", "咪住先，等佢一陣啦。"], altEn: ["Wait a minute, let's wait for her a bit."], grammar: [g.laa1-suggestion], vocab: [w.mai5-zyu6, w.dang2, w.jat1-zan6] }
      - { es: "你坐啦，我企得㗎。", en: "You sit down, I'm fine standing.", altEs: ["你坐啦，我企就得。", "你坐啦，我企得。"], altEn: ["You take the seat, I can stand."], grammar: [g.laa1-suggestion], vocab: [w.co5, w.kei5], error: { wrong: "你坐喇，我企得㗎。", explain: "To invite someone to do something use 啦 (laa1). 喇 (laa3) announces a change, so 你坐喇 sounds like 'you've sat down now'.", grammar: g.laa1-suggestion } }
      - { es: "我哋去飲茶。", en: "We're going for yum cha.", altEs: ["我哋去飲茶呀。"], grammar: [g.laa1-suggestion], vocab: [w.jam2-caa4], transform: { instruction: "Turn it into a friendly suggestion with 啦", answer: "我哋去飲茶啦。", alt: ["不如我哋去飲茶啦。"], en: "Let's go for yum cha." } }
      - { es: "快啲啦，就嚟閂門喇！", en: "Hurry up, they're about to close!", altEs: ["快啲啦，就快閂門喇！", "快啲啦，佢哋就嚟閂門喇！"], altEn: ["Quick, it's closing soon!"], grammar: [g.laa1-suggestion, g.laa3-change], vocab: [w.faai3-di1, w.zau6-lai4, w.saan1-mun4], error: { wrong: "快啲喇，就嚟閂門啦！", explain: "The particles are swapped: 快啲啦 (laa1) urges, and 就嚟…喇 (laa3) announces what is about to happen.", grammar: g.laa1-suggestion } }
    exchanges:
      - q: { es: "我可唔可以坐呢度呀？", en: "Can I sit here?" }
        a: { es: "坐啦，唔好客氣。", en: "Go ahead, sit down." }
        alt: ["坐啦。", "可以，坐啦。", "坐啦，唔使客氣。"]
        grammar: [g.laa1-suggestion]
        vocab: [w.co5, w.m4-hou2-haak3-hei3]
      - q: { es: "你想食咩呀？", en: "What do you want to eat?" }
        a: { es: "隨便啦，你揀啦。", en: "Anything, you choose." }
        alt: ["我隨便，你揀啦。", "你揀啦。"]
        grammar: [g.laa1-suggestion]
        vocab: [w.ceoi4-bin2, w.gaan2]
      - q: { es: "我哋係咪要走喇？", en: "Do we have to go now?" }
        a: { es: "慢慢嚟啦，仲早。", en: "Take your time, it's still early." }
        alt: ["唔使，慢慢嚟啦。", "仲早，慢慢嚟啦。"]
        grammar: [g.laa1-suggestion]
        vocab: [w.maan6-maan2-lai4, w.zou2]
      - q: { es: "多謝晒你今日陪我。", en: "Thanks so much for keeping me company today." }
        a: { es: "唔好客氣，下次再約啦。", en: "Don't mention it, let's meet up again next time." }
        alt: ["唔使客氣。", "唔好客氣，下次再嚟啦。"]
        grammar: [g.laa1-suggestion]
        vocab: [w.do1-ze6-saai3, w.pui4, w.joek3]
      - q: { es: "我唔知揀邊個好。", en: "I don't know which one to pick." }
        a: { es: "試吓呢個啦，好好食㗎。", en: "Try this one, it's really good." }
        alt: ["揀呢個啦。", "你試吓呢個啦。"]
        grammar: [g.laa1-suggestion, g.haa-briefly]
        vocab: [w.si3, w.gaan2]
    texts:
      - title: "訊息"
        es: ["我哋十點喺鑽石山站等啦。", "由地鐵站行五分鐘就到南蓮園池。", "記得帶遮啦，天文台話會落雨。"]
        en: ["Let's meet at Diamond Hill station at ten.", "From the MTR station it's a five-minute walk to Nan Lian Garden.", "Remember to bring an umbrella, the Observatory says it'll rain."]
        grammar: [g.laa1-suggestion]
        vocab: [w.zaam6, w.ze1, w.gei3-dak1]
    spicy:
      - { es: "坐近啲啦，我好友善㗎。", en: "Sit a bit closer, I'm very friendly.", altEs: ["坐埋嚟啦，我好友善㗎。"], altEn: ["Come sit closer, I'm really friendly."], grammar: [g.laa1-suggestion], vocab: [w.co5, w.jau5-sin6] }
      - { es: "你陪我行多個鐘啦，啲花冇你咁靚。", en: "Walk with me for another hour; the flowers aren't as pretty as you.", altEs: ["陪我行多個鐘啦，啲花冇你咁靚。"], grammar: [g.laa1-suggestion, g.mou-gam-not-as], vocab: [w.pui4, w.faa1, w.leng3] }
      - { es: "唔好客氣，叫我靚仔啦。", en: "Don't be so formal, just call me handsome.", altEs: ["唔使客氣，叫我靚仔啦。", "唔好客氣，叫我靚女啦。"], altEn: ["No need to be polite, call me gorgeous."], grammar: [g.laa1-suggestion], vocab: [w.m4-hou2-haak3-hei3, w.leng3-zai2] }
      - { es: "飲多杯茶啦，我仲未想你走。", en: "Have another cup of tea, I don't want you to leave yet.", altEs: ["飲多杯啦，我仲未想你走。"], grammar: [g.laa1-suggestion], vocab: [w.jam2, w.caa4, w.zau2.b] }
      - { es: "你揀餐廳啦，我淨係想望住你。", en: "You choose the restaurant, I just want to look at you.", altEs: ["你揀間餐廳啦，我淨係想望住你。"], grammar: [g.laa1-suggestion, g.zing-hai-only], vocab: [w.gaan2, w.caan1-teng1, w.mong6] }
  - id: a2.u07.l2
    title: 落雨喇！
    teach: [g.laa3-change]
    tip: "喇 (laa3) reports news: something is different now. 落雨喇 'it's started raining'; 唔去喇 'not going any more'."
    vocab: [w.laak3, w.gau3-laa3, w.o4, w.waa1, w.aai1-aa4, w.aai1, w.mou5-gai2, w.gam2, w.gam2-joeng2, w.gam3-joeng2, w.m4-gwaai3-dak1, w.gwaai3-m4-dak1, w.zaai1-coi3, w.ho4-faa1, w.faat3-jing4]
    sentences:
      - { es: "落雨喇！快啲入嚟啦。", en: "It's started raining! Come inside, quick.", altEs: ["落雨喇，快啲入嚟啦！", "落雨嘞！快啲入嚟啦。"], altEn: ["It's raining now! Come in quickly."], grammar: [g.laa3-change, g.laa1-suggestion], vocab: [w.lok6-jyu5, w.jap6-lai4] }
      - { es: "到喇，呢度就係南蓮園池。", jp: "dou3 laa3 ni1 dou6 zau6 hai6 naam4 lin4 jyun4 ci4", en: "We're here, this is Nan Lian Garden.", altEs: ["到喇，呢度就係南蓮園池喇。", "到嘞，呢度就係南蓮園池。"], grammar: [g.laa3-change, g.zau-then], vocab: [w.dou3.b, w.zau6-hai6] }
      - { es: "我食飽喇，唔該。", en: "I'm full now, thanks.", altEs: ["我好飽喇，唔該。", "我飽喇，唔該。"], altEn: ["I've had enough, thank you."], grammar: [g.laa3-change], vocab: [w.sik6-baau2] }
      - { es: "夠喇，唔好再買喇。", en: "That's enough, don't buy any more.", altEs: ["夠喇夠喇，唔好再買喇。", "夠喇，唔使再買喇。"], grammar: [g.laa3-change, g.m-hou-dont], vocab: [w.gau3-laa3, w.maai5] }
      - { es: "嘩，啲荷花開咗好多喇！", en: "Wow, lots of the lotus flowers are out now!", altEs: ["嘩，啲荷花開咗好多嘞！"], altEn: ["Wow, so many lotus flowers have opened now!"], grammar: [g.laa3-change, g.zo-perfective], vocab: [w.waa1, w.ho4-faa1] }
      - { es: "哎呀，部相機冇電喇！", en: "Oh no, the camera's battery is dead!", altEs: ["哎呀，部相機冇晒電喇！", "哎呀，我部相機冇電喇！"], altEn: ["Oh no, the camera's run out of battery!"], grammar: [g.laa3-change], vocab: [w.aai1-aa4, w.soeng2-gei1, w.mou5-din6] }
      - { es: "唉，冇計喇，我哋聽日再嚟啦。", en: "Sigh, nothing we can do, let's come back tomorrow.", altEs: ["唉，冇計喇，聽日再嚟啦。", "冇計喇，我哋聽日再嚟啦。"], grammar: [g.laa3-change, g.zoi-vs-jau], vocab: [w.aai1, w.mou5-gai2, w.ting1-jat6] }
      - { es: "佢走咗喇，你遲咗少少。", en: "She's already left, you're a little late.", altEs: ["佢已經走咗喇，你遲咗少少。", "佢走咗嘞，你遲咗少少。"], altEn: ["He's gone already, you're a bit late."], grammar: [g.laa3-change, g.zo-perfective], vocab: [w.zau2.b, w.ci4] }
      - { es: "我唔去喇，我好攰。", en: "I'm not going after all, I'm really tired.", altEs: ["我唔去喇，好攰。", "我唔去嘞，我好攰。"], altEn: ["I'm not going any more, I'm exhausted."], grammar: [g.laa3-change], vocab: [w.gui6] }
      - { es: "就嚟閂門喇，我哋要走喇。", en: "It's about to close, we have to go now.", altEs: ["就快閂門喇，我哋要走喇。", "就嚟閂門喇，我哋走喇。"], grammar: [g.laa3-change], vocab: [w.zau6-lai4, w.saan1-mun4] }
      - { es: "哦，係噉樣呀，唔怪得啦。", en: "Oh, so that's how it is, no wonder.", altEs: ["哦，係噉樣，唔怪得啦。", "哦，係噉樣呀，怪唔得啦。"], altEn: ["Ah, I see, that explains it."], grammar: [g.laa3-change], vocab: [w.o4, w.gam2-joeng2, w.m4-gwaai3-dak1] }
      - { es: "唔怪得咁多人，今日放假嘛。", en: "No wonder there are so many people, it's a holiday today.", altEs: ["怪唔得咁多人，今日放假嘛。", "唔怪得咁多人啦，今日放假。"], grammar: [g.laa3-change], vocab: [w.m4-gwaai3-dak1, w.fong3-gaa3] }
      - { es: "我識用筷子喇！", en: "I can use chopsticks now!", altEs: ["我識用筷子嘞！", "我而家識用筷子喇！"], grammar: [g.laa3-change, g.sik-know-how], vocab: [w.sik1, w.faai3-zi2] }
      - { es: "噉我哋入去叫啲齋菜啦。", en: "In that case, let's go in and order some vegetarian dishes.", altEs: ["噉不如我哋入去叫啲齋菜啦。", "噉我哋入去叫齋菜食啦。"], altEn: ["Then let's go in and eat vegetarian."], grammar: [g.laa1-suggestion], vocab: [w.gam2, w.zaai1-coi3] }
      - { es: "我明白。", en: "I understand.", altEs: ["我明。"], grammar: [g.laa3-change], vocab: [w.ming4-baak6], transform: { instruction: "Say you understand now (a change): add 喇", answer: "我明白喇。", alt: ["我明喇。", "我明白嘞。"], en: "I get it now." } }
      - { es: "我飲咖啡。", en: "I drink coffee.", altEs: ["我飲咖啡㗎。"], grammar: [g.laa3-change], vocab: [w.gaa3-fe1], transform: { instruction: "Say you don't drink it any more: 唔 + verb + 喇", answer: "我唔飲咖啡喇。", alt: ["我唔飲咖啡嘞。"], en: "I don't drink coffee any more." } }
      - { es: "落雨喇，我哋喺入面等啦。", en: "It's started raining, let's wait inside.", altEs: ["落雨喇，喺入面等啦。"], grammar: [g.laa3-change, g.laa1-suggestion], vocab: [w.lok6-jyu5, w.jap6-min6], error: { wrong: "落雨啦，我哋喺入面等喇。", explain: "落雨喇 reports a new situation (laa3), and 等啦 is the suggestion (laa1); here the two particles are swapped.", grammar: g.laa3-change } }
    exchanges:
      - q: { es: "到咗未呀？", en: "Are we there yet?" }
        a: { es: "就嚟到喇，等多一陣啦。", en: "We're nearly there, hang on a bit longer." }
        alt: ["到喇。", "仲未到，就快喇。", "就嚟到喇。"]
        grammar: [g.laa3-change, g.mei-questions]
        vocab: [w.zau6-lai4, w.dou3.b]
      - q: { es: "你仲食唔食呀？", en: "Are you having any more?" }
        a: { es: "唔食喇，我好飽。", en: "No more for me, I'm full." }
        alt: ["夠喇，唔該。", "我食飽喇。", "唔食喇，唔該。"]
        grammar: [g.laa3-change]
        vocab: [w.baau2, w.gau3-laa3]
      - q: { es: "部相機仲有冇電呀？", en: "Is there any battery left in the camera?" }
        a: { es: "冇電喇，用我部手機影啦。", en: "It's dead, use my phone to take it." }
        alt: ["冇電喇。", "冇晒電喇。"]
        grammar: [g.laa3-change, g.laa1-suggestion]
        vocab: [w.soeng2-gei1, w.mou5-din6, w.sau2-gei1]
      - q: { es: "你仲學唔學鋼琴呀？", en: "Are you still learning the piano?" }
        a: { es: "唔學喇，我太忙。", en: "Not any more, I'm too busy." }
        alt: ["唔學喇。", "冇學喇，太忙。", "唔學喇，冇時間。"]
        grammar: [g.laa3-change]
        vocab: [w.gong3-kam4, w.si4-gaan3]
      - q: { es: "今日點解咁多人嘅？", en: "Why are there so many people today?" }
        a: { es: "啲荷花開咗喇，個個都嚟影相。", en: "The lotus flowers are out now, everyone's come to take photos." }
        alt: ["因為啲荷花開咗喇。", "今日放假吖嘛。"]
        grammar: [g.laa3-change, g.jan-wai-so-ji]
        vocab: [w.ho4-faa1, w.jing2-soeng2]
    texts:
      - title: "日記"
        es: ["嘩，落雨喇！", "我哋喺南蓮園池行咗一個鐘，都有啲攰喇。", "冇計喇，入去叫啲齋菜，飲杯茶啦。"]
        en: ["Wow, it's started raining!", "We've been walking around Nan Lian Garden for an hour and we're a bit tired now.", "Nothing for it, let's go in, order some vegetarian dishes and have a cup of tea."]
        grammar: [g.laa3-change, g.duration]
        vocab: [w.waa1, w.mou5-gai2, w.zaai1-coi3, w.jing2]
    spicy:
      - { es: "夠鐘喇，我送你返屋企啦。", en: "It's time, I'll take you home.", altEs: ["夠鐘喇，等我送你返屋企啦。"], altEn: ["Time's up, let me walk you home."], grammar: [g.laa3-change, g.laa1-suggestion], vocab: [w.gau3-zung1, w.sung3.b] }
      - { es: "我唔飲喇，望住你已經夠開心喇。", en: "No more drinks for me, looking at you makes me happy enough.", altEs: ["我唔飲喇，望住你已經好開心喇。"], grammar: [g.laa3-change], vocab: [w.mong6, w.hoi1-sam1] }
      - { es: "哎呀，落雨喇！我把遮好細，你要企近啲喇。", en: "Oh no, it's raining! My umbrella's tiny, you'll have to stand closer.", altEs: ["哎呀，落雨喇！我把遮好細，你企近啲啦。"], grammar: [g.laa3-change], vocab: [w.aai1-aa4, w.ze1, w.kei5] }
      - { es: "哦，你單身？噉我今晚得閒喇。", en: "Oh, you're single? Then I'm free tonight.", altEs: ["哦，你單身呀？噉我今晚得閒喇。"], grammar: [g.laa3-change], vocab: [w.o4, w.daan1-san1, w.dak1-haan4] }
