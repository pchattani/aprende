id: r.c1.a-opera-na-floresta
level: c1
title: "A ópera no meio da floresta"
kind: text
intro: "A magazine feature on Manaus, the rubber boom and the Teatro Amazonas, written in the cohesive, densely subordinated style of quality Brazilian journalism. Watch the discourse markers (com efeito, em contrapartida, no que tange a), the absolute participles (inaugurado o teatro) and the way reference is kept clear with este, esse, tal and o referido."
allow: [tropical, industrial, automóvel, elétricos, mineral, símbolo, henry, londres, manaus, amazonas, amazônia, teatro, carrara, europa, paris, lisboa, inglaterra, ásia, malásia, wickham, belém, fitzcarraldo, herzog, negro, solimões]
paragraphs:
  - { es: "Quem chega a Manaus pela primeira vez costuma ter a mesma reação: como é possível que, no meio da maior floresta tropical do mundo, a mais de mil quilômetros do oceano, exista um teatro de ópera com cúpula colorida, mármore italiano e lustres franceses? A pergunta, por mais óbvia que pareça, leva a uma das histórias mais extraordinárias e mais contraditórias do Brasil: a do ciclo da borracha.", en: "Anyone arriving in Manaus for the first time tends to react the same way: how is it possible that, in the middle of the world's largest tropical forest, more than a thousand kilometres from the ocean, there should be an opera house with a coloured dome, Italian marble and French chandeliers? The question, however obvious it may seem, leads to one of the most extraordinary and contradictory stories in Brazil: that of the rubber cycle." }
  - { es: "Durante séculos, os povos indígenas da Amazônia usaram o látex da seringueira para fazer bolas, recipientes e objetos à prova d’água. Foi só no século XIX, porém, que a borracha se tornou indispensável ao mundo industrial. Descoberta a vulcanização, que a tornava resistente ao calor e ao frio, e inventados a bicicleta e, mais tarde, o automóvel, a demanda explodiu. Com efeito, entre 1880 e 1910, a Amazônia era praticamente a única fonte de borracha do planeta.", en: "For centuries, the Indigenous peoples of the Amazon used the latex of the rubber tree to make balls, containers and waterproof objects. It was only in the nineteenth century, however, that rubber became indispensable to the industrial world. Once vulcanisation had been discovered, making it resistant to heat and cold, and once the bicycle and later the car had been invented, demand exploded. Indeed, between 1880 and 1910 the Amazon was practically the only source of rubber on the planet." }
  - { es: "Manaus, até então uma vila modesta às margens do rio Negro, transformou-se em poucas décadas numa das cidades mais ricas do país. Ganhou bondes elétricos antes de muitas capitais europeias, porto flutuante, iluminação pública e avenidas inspiradas em Paris. Os chamados barões da borracha, enriquecidos da noite para o dia, mandavam lavar a roupa em Lisboa, importavam água mineral da Europa e, segundo uma lenda que a cidade gosta de repetir, acendiam charutos com notas de dinheiro.", en: "Manaus, until then a modest town on the banks of the Rio Negro, was transformed in a few decades into one of the richest cities in the country. It got electric trams before many European capitals, a floating port, street lighting and avenues inspired by Paris. The so-called rubber barons, enriched overnight, sent their laundry to be washed in Lisbon, imported mineral water from Europe and, according to a legend the city likes to repeat, lit cigars with banknotes." }
  - { es: "É nesse contexto que surge o Teatro Amazonas. Inaugurado em 1896, depois de mais de dez anos de obras interrompidas, o teatro foi construído com materiais vindos quase todos da Europa: o mármore, de Carrara; o ferro, da Inglaterra; os lustres e os espelhos, da França. A cúpula, coberta de milhares de peças de cerâmica nas cores da bandeira, tornou-se o símbolo da cidade. Diz-se até que a rua em frente foi feita de borracha, para que o barulho das carruagens não atrapalhasse os espetáculos.", en: "It is in this context that the Teatro Amazonas appears. Inaugurated in 1896, after more than ten years of interrupted works, the theatre was built with materials that almost all came from Europe: the marble from Carrara, the iron from England, the chandeliers and mirrors from France. The dome, covered in thousands of ceramic tiles in the colours of the flag, became the symbol of the city. It is even said that the street in front was paved with rubber so that the noise of the carriages would not disturb the performances." }
  - { es: "Em contrapartida, a riqueza das avenidas tinha um preço que raramente aparece nos cartões-postais. Quem extraía o látex era o seringueiro, em geral um migrante nordestino que fugia da seca e chegava à floresta já endividado. Obrigado a comprar comida e ferramentas nos armazéns do próprio patrão, a preços abusivos, dificilmente conseguia pagar a dívida, de modo que vivia numa situação muito próxima da escravidão. No que tange aos povos indígenas, o ciclo da borracha significou, em muitas regiões, violência, doenças e expulsão das suas terras.", en: "On the other hand, the wealth of the avenues had a price that rarely appears on postcards. The person who extracted the latex was the rubber tapper, usually a migrant from the North-East fleeing drought who arrived in the forest already in debt. Forced to buy food and tools in his own boss's stores, at extortionate prices, he could hardly ever pay off the debt, so that he lived in a situation very close to slavery. As regards the Indigenous peoples, the rubber cycle meant, in many regions, violence, disease and expulsion from their lands." }
  - { es: "O fim veio tão depressa quanto a riqueza. Em 1876, o inglês Henry Wickham levou para Londres milhares de sementes de seringueira, que acabariam plantadas em grandes fazendas na Ásia, sobretudo na Malásia. Organizadas em fileiras e sem as pragas da floresta, essas plantações produziam mais e mais barato. Por volta de 1912, o preço da borracha amazônica despencou, e Manaus, que tinha vivido como se o dinheiro nunca fosse acabar, entrou numa longa decadência.", en: "The end came as quickly as the wealth. In 1876 the Englishman Henry Wickham took thousands of rubber-tree seeds to London, which would end up planted on large estates in Asia, above all in Malaysia. Organised in rows and free of the forest's pests, those plantations produced more and more cheaply. Around 1912 the price of Amazonian rubber collapsed, and Manaus, which had lived as if the money would never run out, entered a long decline." }
  - { es: "Hoje, o teatro voltou a ser o coração cultural da cidade. Restaurado mais de uma vez, abriga todos os anos um festival de ópera que atrai público do Brasil inteiro, além de concertos gratuitos e visitas guiadas. Os guias, aliás, não escondem a história menos gloriosa do prédio: falam dos barões, mas também dos seringueiros, e lembram que cada pedra importada foi paga com o trabalho de gente que nunca pôs os pés na plateia.", en: "Today the theatre is once again the cultural heart of the city. Restored more than once, it hosts an opera festival every year that draws audiences from all over Brazil, as well as free concerts and guided tours. The guides, incidentally, do not hide the less glorious history of the building: they talk about the barons but also about the rubber tappers, and point out that every imported stone was paid for with the labour of people who never set foot in the stalls." }
  - { es: "Talvez seja esse o maior valor do Teatro Amazonas: não o luxo em si, mas a contradição que ele torna visível. Tal como a própria Amazônia, o prédio é ao mesmo tempo beleza e advertência. Quem sai de um espetáculo numa noite quente, com o som dos sapos misturado ao das últimas palmas, entende por que a cidade continua a contar essa história, e por que é bom que a conte inteira.", en: "Perhaps that is the greatest value of the Teatro Amazonas: not the luxury itself, but the contradiction it makes visible. Like the Amazon itself, the building is at once beauty and warning. Anyone leaving a performance on a hot night, with the sound of frogs mixed with the last applause, understands why the city goes on telling this story, and why it is good that it tells it in full." }
questions:
  - { q: "Por que a borracha se tornou indispensável no século XIX?", options: ["Porque os indígenas começaram a vendê-la", "Porque o ouro tinha acabado", "Por causa da vulcanização e da invenção da bicicleta e do automóvel", "Porque a Europa proibiu o ferro"], answer: 2, explain: "Vulcanisation made rubber resistant to heat and cold, and bicycles and cars created huge demand." }
  - { q: "De onde vieram os materiais do Teatro Amazonas?", options: ["Quase todos da Europa: mármore da Itália, ferro da Inglaterra, lustres da França", "Da própria floresta", "Do Rio de Janeiro", "Da Ásia"], answer: 0, explain: "The text lists Carrara marble, English iron and French chandeliers and mirrors." }
  - { q: "Qual era a situação dos seringueiros?", options: ["Eram ricos e livres", "Viviam endividados com o patrão, numa situação próxima da escravidão", "Eram funcionários públicos", "Trabalhavam só no teatro"], answer: 1, explain: "Forced to buy at their boss's stores at abusive prices, they could rarely pay their debts." }
  - { q: "O que provocou o fim do ciclo da borracha?", options: ["Um incêndio em Manaus", "Uma lei do governo brasileiro", "As plantações na Ásia, feitas com sementes levadas da Amazônia, que produziam mais barato", "A falta de chuva"], answer: 2, explain: "Wickham's seeds became Asian plantations; by around 1912 Amazonian rubber prices collapsed." }
  - { q: "Que conector introduz o lado negativo da história no quinto parágrafo?", options: ["Com efeito", "Em contrapartida", "Aliás", "Por volta de"], answer: 1, explain: "Em contrapartida (on the other hand) introduces a contrast; com efeito confirms or reinforces what was said before." }
  - { q: "Segundo a conclusão, qual é o maior valor do teatro?", options: ["Tornar visível a contradição entre beleza e exploração", "O luxo dos materiais", "Ser o maior teatro do mundo", "Atrair turistas estrangeiros"], answer: 0, explain: "The author argues that the building is 'ao mesmo tempo beleza e advertência' and that the city should tell its story in full." }
