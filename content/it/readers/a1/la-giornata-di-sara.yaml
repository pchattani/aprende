id: r.a1.la-giornata-di-sara
level: a1
title: La giornata di Sara
kind: text
intro: Sara is a waitress in a trattoria in Trastevere. She describes a normal working day, from the alarm clock to bedtime.
allow: [sara, tevere, gianicolo]
paragraphs:
  - { es: "Mi chiamo Sara e faccio la cameriera in una trattoria a Trastevere. Il mio lavoro è bello, ma il mio orario è un po' strano: comincio tardi e finisco tardi.", en: "My name is Sara and I work as a waitress in a trattoria in Trastevere. My job is nice, but my hours are a bit strange: I start late and I finish late." }
  - { es: "La mattina mi sveglio alle nove e mezza. Non mi alzo subito: rimango a letto e leggo le notizie sul cellulare. Alle dieci mi alzo, mi faccio la doccia e mi vesto. Poi faccio colazione al bar sotto casa: prendo sempre un cappuccino e un cornetto.", en: "In the morning I wake up at half past nine. I don't get up straight away: I stay in bed and read the news on my phone. At ten I get up, have a shower and get dressed. Then I have breakfast at the bar downstairs: I always have a cappuccino and a croissant." }
  - { es: "Prima del lavoro ho un po' di tempo libero. Di solito faccio una passeggiata lungo il Tevere o vado in palestra. A volte pulisco la casa, ma non spesso: non mi piace!", en: "Before work I have a bit of free time. I usually go for a walk along the Tiber or go to the gym. Sometimes I clean the house, but not often: I don't like it!" }
  - { es: "Alle dodici comincio a lavorare. A pranzo in trattoria ci sono molti turisti e molti impiegati degli uffici vicini. Tutti hanno fretta! Alle tre e mezza mangio con i miei colleghi: il cuoco prepara sempre un piatto di pasta per noi. Poi mi riposo un'ora a casa.", en: "At twelve I start work. At lunchtime there are lots of tourists in the trattoria and lots of office workers from the offices nearby. Everyone is in a hurry! At half past three I eat with my colleagues: the cook always makes a plate of pasta for us. Then I rest for an hour at home." }
  - { es: "Alle sette torno in trattoria. La sera è il momento più difficile: la gente cena tardi e rimane a tavola a parlare. Finisco di lavorare a mezzanotte, a volte all'una. Sono stanca, ma contenta.", en: "At seven I go back to the trattoria. The evening is the hardest part: people have dinner late and stay at the table talking. I finish work at midnight, sometimes at one. I'm tired, but happy." }
  - { es: "Quando arrivo a casa, bevo un bicchiere di latte caldo e mi addormento subito. Il lunedì la trattoria è chiusa: è il mio giorno libero. Il lunedì dormo fino a tardi e la sera ceno con i miei amici... in un'altra trattoria!", en: "When I get home, I drink a glass of warm milk and fall asleep straight away. On Mondays the trattoria is closed: it's my day off. On Mondays I sleep in and in the evening I have dinner with my friends... in another trattoria!" }
questions:
  - { q: "A che ora si sveglia Sara?", options: ["Alle sette", "Alle nove e mezza", "Alle dodici"], answer: 1, explain: "«La mattina mi sveglio alle nove e mezza.» She gets up at ten." }
  - { q: "Dove fa colazione Sara?", options: ["A casa", "In trattoria", "Al bar sotto casa"], answer: 2, explain: "«Faccio colazione al bar sotto casa.»" }
  - { q: "Che cosa fa Sara prima del lavoro, di solito?", options: ["Pulisce la casa", "Fa una passeggiata o va in palestra", "Dorme"], answer: 1, explain: "«Di solito faccio una passeggiata lungo il Tevere o vado in palestra.» She cleans only sometimes." }
  - { q: "Perché la sera è difficile?", options: ["Perché la gente cena tardi e resta a parlare", "Perché il cuoco non c'è", "Perché ci sono pochi clienti"], answer: 0, explain: "People eat late and stay at the table talking, so Sara finishes at midnight or later." }
  - { q: "Che cosa fa Sara il lunedì sera?", options: ["Lavora in trattoria", "Va in palestra", "Cena con gli amici"], answer: 2, explain: "Monday is her day off: «la sera ceno con i miei amici... in un'altra trattoria!»" }
glossary:
  - { es: strano, en: strange }
  - { es: lungo, en: along }
  - { es: momento, en: moment, time }
  - { es: tavola, en: table (for eating) }
