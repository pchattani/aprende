id: r.b1.c-est-en-sentant-qu-on-apprend
level: b1
title: Grasse, c'est en sentant qu'on apprend
kind: text
intro: "Lina, 24, is training to become a «nez» – a perfume creator – in Grasse, the French capital of perfume. She describes her apprenticeship. Notice the gérondif (en sentant, en travaillant) that says how and while."
allow: [lina, ok]
paragraphs:
  - { es: "Je m'appelle Lina, j'ai vingt-quatre ans et j'apprends le métier de parfumeur à Grasse. On dit souvent « un nez » pour parler d'un parfumeur. Ce n'est pas parce que nous avons un nez plus grand que les autres ! C'est parce que notre travail, c'est de sentir, de reconnaître et de mélanger des odeurs pour créer des parfums.", en: "My name is Lina, I'm twenty-four and I'm learning to be a perfumer in Grasse. People often say 'a nose' to talk about a perfumer. It's not because we have bigger noses than other people! It's because our job is to smell, recognise and mix scents to create perfumes." }
  - { es: "J'ai découvert ma passion en aidant ma grand-mère dans son jardin, près de Nice. Elle cultivait des roses, du jasmin et de la lavande, et elle me faisait deviner les fleurs les yeux fermés. Après mon baccalauréat, j'ai fait des études de chimie, puis je suis venue à Grasse en apprentissage. Je travaille dans une parfumerie trois jours par semaine et je vais à l'école les deux autres jours. Je gagne un petit salaire tout en apprenant.", en: "I discovered my passion while helping my grandmother in her garden, near Nice. She grew roses, jasmine and lavender, and she made me guess the flowers with my eyes closed. After my baccalaureate I studied chemistry, then I came to Grasse as an apprentice. I work in a perfume house three days a week and go to school the other two days. I earn a small salary while I'm learning." }
  - { es: "Grasse est la capitale du parfum depuis plusieurs siècles. Mais au début, c'était une ville de cuir. Au seizième siècle, les gants en cuir avaient une odeur très désagréable. Les artisans de Grasse ont eu l'idée de les parfumer avec des fleurs, et les gants parfumés sont devenus à la mode chez les riches. Peu à peu, la ville a abandonné le cuir pour se consacrer au parfum. Grâce au climat doux de la région, on peut y cultiver beaucoup de fleurs. En 2018, les savoir-faire du parfum en pays de Grasse ont été inscrits au patrimoine culturel immatériel de l'humanité par l'UNESCO.", en: "Grasse has been the capital of perfume for several centuries. But at first it was a leather town. In the sixteenth century, leather gloves had a very unpleasant smell. The craftsmen of Grasse had the idea of perfuming them with flowers, and perfumed gloves became fashionable among the rich. Little by little, the town gave up leather to devote itself to perfume. Thanks to the region's mild climate, lots of flowers can be grown there. In 2018, the perfume skills of the Pays de Grasse were added to UNESCO's list of the intangible cultural heritage of humanity." }
  - { es: "Comment devient-on un nez ? En sentant, en sentant et en sentant encore ! Chaque matin, en arrivant au laboratoire, je prends des petites bandes de papier, les mouillettes, et je les trempe dans des flacons. Je dois reconnaître chaque odeur en la sentant une seule fois. Mon maître, qui travaille ici depuis quarante ans, en reconnaît des milliers. Moi, j'en connais environ cinq cents. Il me dit que c'est en se trompant qu'on progresse, et qu'il faut au moins dix ans pour devenir un vrai parfumeur.", en: "How do you become a nose? By smelling, smelling and smelling again! Every morning, when I arrive at the laboratory, I take small strips of paper, called mouillettes, and dip them into bottles. I have to recognise each scent by smelling it only once. My master, who has worked here for forty years, recognises thousands. I know about five hundred. He tells me it's by making mistakes that you make progress, and that it takes at least ten years to become a real perfumer." }
  - { es: "Ce que je préfère, c'est la récolte du jasmin, à la fin de l'été. Les fleurs sont cueillies à la main, très tôt le matin, avant que le soleil ne soit trop chaud, parce que c'est à ce moment-là que leur odeur est la plus forte. Il faut des centaines de kilos de fleurs pour obtenir un seul kilo d'essence. C'est pour ça que le jasmin de Grasse coûte si cher. En mai, c'est la rose centifolia qu'on récolte, et toute la ville sent la rose.", en: "What I like best is the jasmine harvest, at the end of summer. The flowers are picked by hand, very early in the morning, before the sun gets too hot, because that's when their scent is strongest. It takes hundreds of kilos of flowers to get a single kilo of essence. That's why Grasse jasmine is so expensive. In May it's the centifolia rose that is harvested, and the whole town smells of roses." }
  - { es: "Mon rêve ? Créer un jour un parfum qui porte mon nom. En attendant, je fais attention à ma santé : je ne fume pas, je ne mange pas trop épicé et je ne porte jamais de parfum moi-même. Les gens trouvent ça bizarre, mais c'est en protégeant son nez qu'on garde son talent !", en: "My dream? To create one day a perfume that bears my name. Meanwhile, I look after my health: I don't smoke, I don't eat food that's too spicy, and I never wear perfume myself. People find that strange, but it's by protecting your nose that you keep your talent!" }
questions:
  - { q: "Pourquoi appelle-t-on un parfumeur « un nez » ?", options: ["Parce qu'il a un grand nez", "Parce que son travail est de sentir et de reconnaître les odeurs", "Parce qu'il travaille dans un laboratoire"], answer: 1, explain: "«C'est parce que notre travail, c'est de sentir, de reconnaître et de mélanger des odeurs.»" }
  - { q: "Comment Lina a-t-elle découvert sa passion ?", options: ["En aidant sa grand-mère dans son jardin", "En lisant un livre", "En travaillant à Paris"], answer: 0, explain: "«J'ai découvert ma passion en aidant ma grand-mère dans son jardin.» A gérondif of manner." }
  - { q: "Pourquoi les artisans de Grasse ont-ils commencé à parfumer les gants ?", options: ["Parce que le cuir sentait mauvais", "Parce que le roi l'avait demandé", "Pour vendre plus de fleurs"], answer: 0, explain: "«Les gants en cuir avaient une odeur très désagréable.»" }
  - { q: "Pourquoi cueille-t-on le jasmin très tôt le matin ?", options: ["Parce qu'il fait trop froid l'après-midi", "Parce que c'est le moment où son odeur est la plus forte", "Parce que les ouvriers commencent tôt"], answer: 1, explain: "«C'est à ce moment-là que leur odeur est la plus forte.»" }
  - { q: "Pourquoi Lina ne porte-t-elle jamais de parfum ?", options: ["Elle n'aime pas ça", "Pour protéger son nez", "C'est trop cher"], answer: 1, explain: "«C'est en protégeant son nez qu'on garde son talent !»" }
