id: r.c2.forty-seven-minutes-home
level: c2
title: 四十七分鐘返屋企
kind: text
intro: "A personal essay by a (fictional) learner from abroad, written on the high-speed train from Guangzhou South to West Kowloon at the end of a year of studying Cantonese. She looks back on everything the language turned out to contain: slang and taboos, opera and poetry, written Chinese and the many ways Cantonese is spoken on both sides of the border."
allow: [廣州南, 廣州南站, 西九龍, 莎拉, 愛爾蘭, 都柏林, wifi, ok, chur, hea]
paragraphs:
  - { es: "廣州南站，下晝五點。我拖住個喼，入閘，上車，搵到自己個位。車廂好靜，隔籬嘅阿叔一坐低就打開個飯盒，對面兩個大學生戴住耳筒睇劇。車開動嗰陣，我望住窗外啲高樓一棟棟向後退，突然諗起：一年前我啱啱嚟嘅時候，連「唔該」同「多謝」都分唔清。", en: "Guangzhou South Station, five in the afternoon. I drag my suitcase through the gate, board the train and find my seat. The carriage is quiet; the uncle next to me opens a lunchbox as soon as he sits down, and opposite me two university students watch a drama with their earphones on. As the train pulls out, I watch the tower blocks slide backwards one after another and suddenly think: a year ago, when I'd just arrived, I couldn't even tell 唔該 from 多謝." }
  - { es: "我叫莎拉，喺愛爾蘭出世。三年前喺都柏林一間茶餐廳打工，老闆娘成日用廣東話鬧佢老公，我覺得好好聽，好似唱歌噉，於是就開始學。後來我搬咗嚟香港，再嚟廣州住咗大半年。我以為學一種語言，就係學一啲詞同文法；原來我學嘅，係一個好大嘅世界。", en: "My name is Sarah and I was born in Ireland. Three years ago I worked in a cha chaan teng in Dublin, and the owner's wife was always scolding her husband in Cantonese. I thought it sounded beautiful, like singing, so I started learning. Later I moved to Hong Kong, then came to live in Guangzhou for most of a year. I thought learning a language meant learning some words and grammar; it turned out I was learning an enormous world." }
  - { es: "最初，世界好細：茶餐廳嘅餐牌、港鐵嘅廣播、街市阿姐嘅價錢。跟住，世界大咗：我識得用「喎」講人哋講過嘅嘢，用「囉」表示冇辦法，用「啩」估吓估吓。我第一次喺同事面前講「佢今日唔嚟喎」，佢哋拍晒手，好似我贏咗獎噉。", en: "At first the world was small: the menu at the cha chaan teng, the announcements on the MTR, the prices from the auntie at the market. Then the world grew: I learned to use 喎 to pass on what someone else had said, 囉 to show there was nothing to be done, and 啩 to make a guess. The first time I said 佢今日唔嚟喎 'he says he isn't coming today' in front of my colleagues, they all applauded, as if I'd won a prize." }
  - { es: "再之後，我發覺廣東話其實係兩種語言。一種係我哋講嘅口語，一種係報紙、新聞、公文用嘅書面語，但係兩樣都用廣東話讀。我喺澳門嗰陣，對住一張「閒人免進」嘅告示諗咗好耐，又喺電台新聞聽到「據悉」、「涉嫌」，一頭霧水。後來我先明白，識廣東話嘅人，其實日日都喺兩種語體之間轉來轉去，好似換衫噉自然。", en: "After that, I discovered that Cantonese is really two languages. One is the spoken language we talk in, the other the written Chinese used in newspapers, the news and official documents, but both are read in Cantonese. When I was in Macau, I stared at a notice saying 閒人免進 'staff only' for ages, and heard 據悉 'it is understood' and 涉嫌 'suspected of' on the radio news without understanding a thing. Only later did I realise that people who know Cantonese switch between the two registers every day, as naturally as changing clothes." }
  - { es: "嚟到廣州，世界又再變大。喺佛山，我聽一個伯伯唱南音，聽唔明一半，但係喊咗。喺珠江嘅船上面，有個退休老師讀招子庸嘅粵謳，我先知道兩百年前已經有人用廣東話寫文學。喺順德，我學識咗唔好送鐘、唔好分梨，仲畀人笑我「黃皮樹了哥——唔熟唔食」，因為我淨係肯去熟嘅餐廳。", en: "In Guangzhou the world grew bigger again. In Foshan I listened to an old man singing 南音; I didn't understand half of it, but I cried. On a boat on the Pearl River a retired teacher read Zhao Ziyong's songs, and I learned that two hundred years ago people were already writing literature in Cantonese. In Shunde I learned never to give a clock or share a pear, and people teased me as 'the myna in the wampee tree, which only eats what's ripe', because I'd only go to restaurants I knew." }
  - { es: "我最鍾意嘅，係用廣東話讀唐詩。我讀柳宗元嘅〈江雪〉，「絕、滅、雪」三個入聲字一個接一個斷咗，好似雪落喺江面上，冇聲冇氣。我嘅普通話老師話呢首詩押韻，但係佢讀出嚟，我聽唔到嗰種冷。用廣東話讀，我第一次覺得自己唔係喺度學一種語言，而係喺度聽一千幾年前嘅人講嘢。", en: "What I love most is reading Tang poems in Cantonese. When I read Liu Zongyuan's 'River Snow', the three entering-tone rhymes 絕, 滅, 雪 break off one after another, like snow falling silently on the river. My Mandarin teacher said the poem rhymes, but when she read it I couldn't hear that coldness. Reading it in Cantonese, for the first time I felt I wasn't learning a language but listening to someone speak from more than a thousand years ago." }
  - { es: "當然，我都講錯過好多嘢。我試過喺茶樓叫個阿伯做「靚仔」，佢笑到差啲跌低；又試過想講「好chur」，講成「好chill」，同事以為我好hea。仲有一次，我話我想「食花生」，個朋友即刻遞包花生畀我，原來佢唔知我學咗潮語。語言就係噉，一路講錯，一路學識。", en: "Of course, I've said lots of things wrong too. I once called an old man in a teahouse 靚仔 'handsome boy', and he laughed so hard he nearly fell over; another time I meant to say I was 好chur 'really overworked' but said 好chill, and my colleagues thought I was slacking off. And once, I said I wanted to 'eat peanuts' (watch the drama), and my friend immediately handed me a bag of peanuts – he didn't know I'd learned the slang. That's what language is like: you keep getting things wrong, and you keep learning." }
  - { es: "列車廣播話就快到西九龍。四十七分鐘，由廣州返到香港，一年嘅旅程，好似一下子就完。我諗起廣州陳伯講過：「語言好似條河，一路流一路變，最緊要係仲有人講。」我唔知我嘅廣東話會唔會有一日講得好似本地人咁好，但係我知道，由今日開始，我都係條河入面嘅一滴水。", en: "The train announcement says we'll soon arrive at West Kowloon. Forty-seven minutes from Guangzhou back to Hong Kong, and a year's journey seems to be over in an instant. I think of what old Uncle Chan in Guangzhou said: 'A language is like a river: it changes as it flows, and the most important thing is that people still speak it.' I don't know if my Cantonese will one day be as good as a local's, but I know that from today, I'm a drop of water in that river too." }
  - { es: "落車嗰陣，隔籬個阿叔執好個飯盒，同我講：「靚女，你廣東話講得好好喎，喺邊度學㗎？」我笑住答：「一路行，一路學。」佢比咗個大拇指我：「正！」我拖住個喼行出車站，外面已經天黑，維港兩邊嘅大廈開始亮燈。我深呼吸，用最地道嘅廣東話同自己講：「返到嚟喇。」", en: "As we get off, the uncle next to me tidies away his lunchbox and says to me: 'Young lady, your Cantonese is really good! Where did you learn it?' I answer with a smile: 'Along the way, as I went.' He gives me a thumbs up: 'Brilliant!' I drag my suitcase out of the station; it's already dark outside, and the towers on both sides of the harbour are lighting up. I take a deep breath and tell myself in the most authentic Cantonese I can: 'I'm back.'" }
questions:
  - { q: "莎拉當初點解想學廣東話？", options: ["因為佢要喺香港返工", "因為佢覺得茶餐廳老闆娘講廣東話好似唱歌", "因為佢喺學校讀過"], answer: 1, explain: "She heard the owner's wife of a Dublin cha chaan teng scolding her husband and thought it sounded like singing." }
  - { q: "莎拉話廣東話其實係「兩種語言」，係指乜嘢？", options: ["香港話同廣州話", "口語同書面語，但兩樣都用廣東話讀", "廣東話同普通話"], answer: 1, explain: "Spoken Cantonese and standard written Chinese, both read aloud in Cantonese." }
  - { q: "點解莎拉覺得用廣東話讀〈江雪〉特別好？", options: ["因為三個入聲韻腳一個接一個斷咗，好似雪落喺江面", "因為佢嘅普通話老師讀錯咗", "因為首詩好短"], answer: 0, explain: "The entering-tone rhymes 絕, 滅, 雪 keep their clipped -t endings in Cantonese." }
  - { q: "朋友點解遞包花生畀莎拉？", options: ["因為佢肚餓", "因為佢唔知「食花生」係潮語，意思係睇熱鬧", "因為花生係廣州嘅手信"], answer: 1, explain: "食花生 is slang for watching a drama unfold as a bystander; her friend took it literally." }
  - { q: "最後阿叔讚莎拉嘅時候講「正！」，即係乜嘢意思？", options: ["好嘢、好叻", "坐正啲", "啱啱好"], answer: 0, explain: "正 is everyday slang for 'great, excellent'." }
