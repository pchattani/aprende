grammar:
  - { prompt: "Espero que você ___ (ter) uma ótima viagem.", options: ["tenha", "tem", "terá"], answer: 0, explain: "Wishes with esperar que take the present subjunctive: tenha." }
  - { prompt: "Fico feliz que vocês ___ (estar) aqui.", options: ["estão", "estarem", "estejam"], answer: 2, explain: "Emotion + que → subjunctive; estar is irregular: estejam." }
  - { prompt: "É possível que ___ (chover) amanhã.", options: ["chove", "chova", "choverá"], answer: 1, explain: "Impersonal expressions of possibility take the subjunctive." }
  - { prompt: "Duvido que ele ___ (saber) a resposta.", options: ["saiba", "sabe", "saberá"], answer: 0, explain: "Doubt triggers the subjunctive; saber → saiba." }
  - { prompt: "Acho que ela ___ (vir) hoje.", options: ["vem", "venha", "vier"], answer: 0, explain: "Affirmative achar que takes the indicative; não acho que would take the subjunctive." }
  - { prompt: "Quando você ___ (chegar), me avisa.", options: ["chega", "chegar", "chegue"], answer: 1, explain: "quando + future reference → future subjunctive: chegar." }
  - { prompt: "Se ___ (fazer) sol amanhã, vamos à praia.", options: ["fazer", "faz", "fizer"], answer: 2, explain: "Real condition about the future: se + future subjunctive; fazer → fizer." }
  - { prompt: "Quem ___ (querer) pode vir com a gente.", options: ["quer", "queira", "quiser"], answer: 2, explain: "Whoever (future reference): quem + future subjunctive quiser." }
  - { prompt: "O professor falou devagar para os alunos ___ (entender).", options: ["entenderem", "entender", "entendam"], answer: 0, explain: "Personal infinitive after para with its own subject: para os alunos entenderem." }
  - { prompt: "Quando cheguei, o filme já ___ (começar).", options: ["começou", "tinha começado", "começava"], answer: 1, explain: "Action before another past action: pluperfect tinha começado." }
  - { prompt: "Esse é o escritor ___ livros eu mais gosto.", options: ["que", "onde", "cujos"], answer: 2, explain: "Possessive relative cujo agrees with what is owned: cujos livros (with gostar de, formal: de cujos livros)." }
  - { prompt: "A ponte ___ construída em 1974.", options: ["esteve", "foi", "ficou"], answer: 1, explain: "Passive with ser: foi construída." }
  - { prompt: "___ casas na praia.", options: ["Alugam-se", "Aluga-se", "Alugam"], answer: 0, explain: "Passive se agrees with the plural noun in the written norm: alugam-se casas." }
  - { prompt: "Ela disse que ___ (estar) cansada.", options: ["está", "estava", "esteja"], answer: 1, explain: "Reported speech in the past: está → estava." }
  - { prompt: "___ esteja chovendo, vou correr.", options: ["Porque", "Mesmo", "Embora"], answer: 2, explain: "embora (although) takes the subjunctive." }
writing:
  prompt: "Write a formal e-mail to the town council of a Brazilian city where you are living, complaining about a problem in your street (noise, rubbish, lighting or traffic). Describe the problem, say how long it has been going on, explain how it affects residents, and say what you would like the council to do. Use a formal opening and closing."
  minWords: 130
  modelAnswer: |
    Prezados senhores,

    Meu nome é Thomas Becker e moro na Rua das Flores, no bairro Santa Tereza, há dois anos. Escrevo para informar sobre um problema que tem preocupado todos os moradores da rua.

    Há quase três meses, as luzes da rua não funcionam. À noite, a rua fica completamente escura, e muitos vizinhos, principalmente os mais velhos, têm medo de sair de casa. Na semana passada, uma senhora caiu na calçada porque não conseguia ver o caminho. Além disso, alguns carros foram roubados, o que nunca tinha acontecido antes.

    Já ligamos várias vezes para a prefeitura, mas até agora nada foi feito. Por isso, peço que a prefeitura mande uma equipe consertar as luzes o mais rápido possível. Também seria importante que houvesse mais segurança no bairro durante a noite.

    Agradeço desde já a atenção e fico à disposição para mais informações.

    Atenciosamente,
    Thomas Becker
  checklist:
    - "I used a formal opening and closing (Prezados senhores, Atenciosamente) and kept the register formal throughout."
    - "I said how long the problem has been going on (há três meses, desde…) and used the present perfect (tem preocupado) or similar."
    - "I described past events with the preterite and the pluperfect (caiu, nunca tinha acontecido)."
    - "I made my request with peço que / é importante que + subjunctive."
    - "I used at least two connectors (além disso, por isso, mas, até agora)."
    - "I organised the e-mail in paragraphs: introduction, problem, consequences, request."
