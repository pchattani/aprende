id: r.b1.correos-sobre-la-huelga
level: b1
title: Correos sobre la huelga
kind: dialogue
intro: Lucía, a nurse in Madrid, and Marcos, a teacher in Seville, exchange emails reacting to the week's news.
allow: [lucía, marcos, madrid, sevilla, re, alumnos, pacientes, abrazo]
paragraphs:
  - { es: "De: Lucía. Para: Marcos. Asunto: la huelga. Hola, Marcos. Acabo de ver las noticias y he pensado en ti enseguida. ¿Es verdad que los profesores vais a hacer huelga la semana que viene? Cuéntame, que aquí en Madrid los medios de comunicación casi no hablan de eso.", en: "From: Lucía. To: Marcos. Subject: the strike. Hi Marcos. I've just seen the news and thought of you straight away. Is it true that you teachers are going on strike next week? Tell me about it, because here in Madrid the media hardly talk about it." }
  - { es: "De: Marcos. Para: Lucía. Asunto: RE: la huelga. Hola, Lucía. Sí, es verdad. El gobierno quiere que tengamos más alumnos por clase y que trabajemos dos horas más a la semana sin subir el salario. Es indignante que tomen estas medidas sin hablar con nosotros. Creo que es necesario que protestemos, aunque me da pena que los niños pierdan clases.", en: "From: Marcos. To: Lucía. Subject: RE: the strike. Hi Lucía. Yes, it's true. The government wants us to have more pupils per class and to work two more hours a week without raising our salary. It's outrageous that they take these measures without talking to us. I think it's necessary that we protest, although I feel bad that the children are missing lessons." }
  - { es: "De: Lucía. Asunto: RE: RE: la huelga. Te entiendo muy bien. En la sanidad pasa lo mismo: cada año somos menos enfermeros para más pacientes. Me parece lógico que hagáis huelga, y es una vergüenza que los políticos solo se acuerden de la educación antes de las elecciones. ¿Hay manifestación? Si es un sábado, a lo mejor voy.", en: "From: Lucía. Subject: RE: RE: the strike. I understand you very well. In healthcare the same thing happens: every year there are fewer of us nurses for more patients. It seems logical to me that you're going on strike, and it's a disgrace that politicians only remember education before elections. Is there a demonstration? If it's on a Saturday, maybe I'll go." }
  - { es: "De: Marcos. Asunto: RE: RE: RE: la huelga. Sí, el sábado a las doce, delante del ayuntamiento. Me alegro mucho de que quieras venir. Por cierto, ¿has leído lo de los alquileres? Dicen que en Sevilla han subido un quince por ciento en un año. Es absurdo que un piso pequeño cueste ahora lo mismo que mi sueldo.", en: "From: Marcos. Subject: RE: RE: RE: the strike. Yes, on Saturday at twelve, in front of the town hall. I'm really glad you want to come. By the way, have you read the thing about rents? They say that in Seville they've gone up fifteen percent in one year. It's absurd that a small flat now costs the same as my salary." }
  - { es: "De: Lucía. Asunto: alquileres. Lo he leído, sí. Aquí es todavía peor: mi compañera de trabajo ha tenido que volver a casa de sus padres con treinta y cinco años. Me da rabia que nadie haga nada. Es fundamental que haya más vivienda pública, pero dudo que el gobierno tome medidas antes de las elecciones.", en: "From: Lucía. Subject: rents. Yes, I've read it. Here it's even worse: my colleague at work has had to move back in with her parents at thirty-five. It makes me angry that nobody does anything. It's fundamental that there's more public housing, but I doubt the government will take action before the elections." }
  - { es: "De: Marcos. Asunto: calor. Y para terminar con las buenas noticias: ¿has visto la temperatura que vamos a tener este fin de semana? Cuarenta grados en abril. Es preocupante que cada año haga más calor y que los incendios empiecen antes. Mi madre, que tiene setenta años, está muy nerviosa con la sequía.", en: "From: Marcos. Subject: heat. And to finish with the good news: have you seen the temperature we're going to have this weekend? Forty degrees in April. It's worrying that every year it gets hotter and the wildfires start earlier. My mother, who is seventy, is very nervous about the drought." }
  - { es: "De: Lucía. Asunto: RE: calor. Es terrible, sí. Pero no todo es malo: ayer leí que en mi barrio van a abrir un centro de salud nuevo. ¡Qué alivio! Y me hace mucha ilusión que vengas a Madrid en mayo. Es imprescindible que cenemos juntos y que hablemos de algo que no sean las noticias. ¡Un abrazo y suerte con la huelga!", en: "From: Lucía. Subject: RE: heat. It's terrible, yes. But not everything is bad: yesterday I read that they're going to open a new health centre in my neighbourhood. What a relief! And I'm really excited that you're coming to Madrid in May. It's essential that we have dinner together and talk about something other than the news. A hug, and good luck with the strike!" }
questions:
  - { q: "Why are the teachers going on strike?", options: ["Larger classes and more hours without a pay rise", "A new school building", "Fewer holidays"], answer: 0 }
  - { q: "When is the demonstration?", options: ["Saturday at twelve", "Sunday morning", "Friday afternoon"], answer: 0 }
  - { q: "What happened to Lucía's colleague?", options: ["She bought a flat", "She moved back in with her parents", "She moved to Seville"], answer: 1 }
  - { q: "What good news does Lucía mention?", options: ["Rents are falling", "A new health centre in her neighbourhood", "The strike has ended"], answer: 1 }
glossary:
  - { es: asunto, en: subject (of an email) }
  - { es: alumno, en: pupil }
  - { es: paciente, en: patient }
  - { es: por cierto, en: by the way }
  - { es: lo de, en: the thing about }
  - { es: abrazo, en: hug }
