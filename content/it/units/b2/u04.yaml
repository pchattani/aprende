id: b2.u04
title: "È stata costruita dai Romani"
lessons:
  - id: b2.u04.l1
    title: Furono costruiti dai Greci
    teach: [g.passive-essere]
    vocab: [w.tempio, w.colonia, w.magna-grecia, w.romani, w.tomba, w.necropoli, w.reperto, w.archeologico, w.anfora, w.risalire, w.rovine, w.moneta-antica, w.archeologo, w.foro, w.resti, w.attribuire, w.ritrovamento, w.preistoria, w.greco-antico, w.scavare, w.celebre, w.antichità, w.archeologia, w.scavo, w.colonna, w.sarcofago]
    tip: "Passive = essere (in any tense) + participle agreeing with the subject; the agent takes da: I templi furono costruiti dai Greci. In the passato prossimo there are two participles: è stata scoperta."
    sentences:
      - { es: "I templi di Paestum furono costruiti dai Greci tra il VI e il V secolo a.C.", en: "The temples of Paestum were built by the Greeks between the 6th and 5th centuries BC.", altEs: ["I templi di Paestum sono stati costruiti dai Greci tra il VI e il V secolo a.C."], grammar: [g.passive-essere, g.passato-remoto-recognition], vocab: [w.tempio, w.costruire] }
      - { es: "La città fu fondata come colonia della Magna Grecia con il nome di Poseidonia.", en: "The city was founded as a colony of Magna Graecia under the name of Poseidonia.", altEs: ["La città è stata fondata come colonia della Magna Grecia con il nome di Poseidonia."], grammar: [g.passive-essere], vocab: [w.colonia, w.magna-grecia, w.fondare] }
      - { es: "Più tardi Paestum fu conquistata dai Romani.", en: "Later Paestum was conquered by the Romans.", altEs: ["Più tardi Paestum è stata conquistata dai Romani."], grammar: [g.passive-essere], vocab: [w.romani, w.conquistare] }
      - { es: "La Tomba del Tuffatore è stata scoperta nel 1968 in una necropoli vicino a Paestum.", en: "The Tomb of the Diver was discovered in 1968 in a necropolis near Paestum.", altEs: ["La Tomba del Tuffatore fu scoperta nel 1968 in una necropoli vicino a Paestum."], grammar: [g.passive-essere], vocab: [w.tomba, w.necropoli, w.scoprire] }
      - { es: "I reperti più importanti sono esposti nel museo archeologico.", en: "The most important finds are on display in the archaeological museum.", altEs: ["I reperti più importanti vengono esposti nel museo archeologico."], grammar: [g.passive-essere], vocab: [w.reperto, w.archeologico, w.museo] }
      - { es: "Questa anfora risale al IV secolo a.C. ed è stata restaurata l'anno scorso.", en: "This amphora dates back to the 4th century BC and was restored last year.", altEs: ["Quest'anfora risale al IV secolo a.C. ed è stata restaurata l'anno scorso."], grammar: [g.passive-essere], vocab: [w.anfora, w.risalire, w.restaurare] }
      - { es: "Per secoli le rovine di Paestum furono dimenticate.", en: "For centuries the ruins of Paestum were forgotten.", altEs: ["Per secoli le rovine di Paestum sono state dimenticate."], grammar: [g.passive-essere], vocab: [w.rovine, w.dimenticare] }
      - { es: "Le monete antiche trovate nello scavo saranno studiate dagli archeologi dell'università.", en: "The ancient coins found in the dig will be studied by the university's archaeologists.", altEs: ["Le monete antiche trovate durante lo scavo saranno studiate dagli archeologi dell'università."], grammar: [g.passive-essere, g.futuro-semplice], vocab: [w.moneta-antica, w.archeologo, w.scavo] }
      - { es: "Il foro era circondato da negozi, templi e colonne.", en: "The forum was surrounded by shops, temples and columns.", altEs: ["Il foro era circondato da templi, negozi e colonne."], grammar: [g.passive-essere], vocab: [w.foro, w.colonna, w.circondare] }
      - { es: "Questi resti sono stati attribuiti a una villa romana del I secolo.", en: "These remains have been attributed to a 1st-century Roman villa.", altEs: ["Questi resti furono attribuiti a una villa romana del I secolo."], grammar: [g.passive-essere], vocab: [w.resti, w.attribuire, w.villa] }
      - { es: "Il ritrovamento è stato annunciato ieri dal direttore del parco.", en: "The find was announced yesterday by the park director.", altEs: ["Ieri il direttore del parco ha annunciato il ritrovamento."], grammar: [g.passive-essere], vocab: [w.ritrovamento, w.annunciare] }
      - { es: "Nella grotta sono stati trovati oggetti che risalgono alla preistoria.", en: "Objects dating back to prehistory have been found in the cave.", altEs: ["Nella grotta furono trovati oggetti che risalgono alla preistoria."], grammar: [g.passive-essere, g.relative-che], vocab: [w.preistoria, w.grotta, w.oggetto] }
      - { es: "Il greco antico era parlato in tutte le città della Magna Grecia.", en: "Ancient Greek was spoken in all the cities of Magna Graecia.", altEs: ["Il greco antico veniva parlato in tutte le città della Magna Grecia."], grammar: [g.passive-essere, g.passive-venire], vocab: [w.greco-antico, w.magna-grecia] }
      - { es: "La chiesa è stata costruita nel Medioevo.", en: "The church was built in the Middle Ages.", altEs: ["La chiesa fu costruita nel Medioevo."], grammar: [g.passive-essere], vocab: [w.chiesa, w.medioevo], error: { wrong: "La chiesa è stato costruito nel Medioevo.", explain: "In the passive both participles agree with the subject: la chiesa è stata costruita.", grammar: g.passive-essere } }
      - { es: "Gli archeologi hanno scavato tre tombe.", en: "The archaeologists have excavated three tombs.", grammar: [g.passato-prossimo-avere], vocab: [w.scavare, w.tomba], transform: { instruction: "Make it passive, starting with Tre tombe…", answer: "Tre tombe sono state scavate dagli archeologi.", alt: ["Tre tombe furono scavate dagli archeologi."], en: "Three tombs have been excavated by the archaeologists." } }
      - { es: "Un celebre archeologo guiderà la visita.", en: "A famous archaeologist will lead the tour.", grammar: [g.futuro-semplice], vocab: [w.celebre, w.guidare], transform: { instruction: "Make it passive, starting with La visita…", answer: "La visita sarà guidata da un celebre archeologo.", alt: ["La visita verrà guidata da un celebre archeologo."], en: "The tour will be led by a famous archaeologist." } }
    exchanges:
      - q: { es: "Chi ha costruito i templi di Paestum?", en: "Who built the temples of Paestum?" }
        a: { es: "Furono costruiti dai Greci, molto prima dell'arrivo dei Romani.", en: "They were built by the Greeks, long before the Romans arrived." }
        alt: ["I Greci.", "Sono stati costruiti dai Greci."]
        grammar: [g.passive-essere]
        vocab: [w.tempio, w.romani]
      - q: { es: "Quando è stata scoperta la Tomba del Tuffatore?", en: "When was the Tomb of the Diver discovered?" }
        a: { es: "Nel 1968, durante gli scavi in una necropoli a sud della città.", en: "In 1968, during excavations in a necropolis south of the town." }
        alt: ["Nel 1968.", "È stata scoperta nel 1968."]
        grammar: [g.passive-essere]
        vocab: [w.tomba, w.necropoli, w.scavo]
      - q: { es: "Che cosa studia l'archeologia?", en: "What does archaeology study?" }
        a: { es: "Studia l'antichità attraverso i resti che sono stati lasciati dall'uomo.", en: "It studies antiquity through the remains left behind by humans." }
        alt: ["Studia l'antichità.", "I resti del passato."]
        grammar: [g.passive-essere]
        vocab: [w.archeologia, w.antichità, w.resti]
      - q: { es: "Dove si possono vedere i reperti?", en: "Where can you see the finds?" }
        a: { es: "Sono conservati nel museo, proprio accanto agli scavi.", en: "They're kept in the museum, right next to the excavations." }
        alt: ["Nel museo archeologico.", "Sono esposti nel museo."]
        grammar: [g.passive-essere]
        vocab: [w.reperto, w.conservare]
      - q: { es: "Di che cosa è fatto questo sarcofago?", en: "What is this sarcophagus made of?" }
        a: { es: "È stato scolpito in un unico blocco di pietra.", en: "It was carved from a single block of stone." }
        alt: ["Di pietra.", "È di pietra, scolpita a mano."]
        grammar: [g.passive-essere]
        vocab: [w.sarcofago, w.scolpire, w.pietra]
    texts:
      - title: "Cartello all'ingresso del parco"
        es: ["Benvenuti a Paestum.", "I templi che vedete furono costruiti tra il VI e il V secolo a.C.", "Il sito è stato dichiarato patrimonio UNESCO nel 1998."]
        en: ["Welcome to Paestum.", "The temples you can see were built between the 6th and 5th centuries BC.", "The site was declared a UNESCO World Heritage Site in 1998."]
        grammar: [g.passive-essere]
        vocab: [w.tempio, w.patrimonio]
      - title: "Notizia dagli scavi"
        es: ["Una piccola necropoli è stata scoperta durante i lavori per una strada.", "Le tombe sono state scavate in pochi giorni.", "Tutti i reperti saranno portati al museo archeologico."]
        en: ["A small necropolis was discovered during roadworks.", "The tombs were excavated in a few days.", "All the finds will be taken to the archaeological museum."]
        grammar: [g.passive-essere]
        vocab: [w.necropoli, w.scavare, w.reperto]
    spicy:
      - { es: "Il nostro primo bacio fu dato davanti al tempio di Nettuno: anche gli dei erano gelosi.", en: "Our first kiss was given in front of the Temple of Neptune: even the gods were jealous.", altEs: ["Il nostro primo bacio è stato dato davanti al tempio di Nettuno: anche gli dei erano gelosi."], grammar: [g.passive-essere], vocab: [w.tempio, w.bacio, w.geloso] }
      - { es: "Sono stata invitata a cena da un archeologo: dice che più sono antica, più gli piaccio.", en: "I've been invited to dinner by an archaeologist: he says the older I am, the more he likes me.", altEs: ["Sono stato invitato a cena da un'archeologa: dice che più sono antico, più le piaccio."], grammar: [g.passive-essere], vocab: [w.archeologo, w.antico] }
      - { es: "Questo sarcofago è stato chiuso per duemila anni; il mio cuore, solo per tre mesi.", en: "This sarcophagus was closed for two thousand years; my heart, only for three months.", altEs: ["Questo sarcofago è rimasto chiuso per duemila anni; il mio cuore, solo per tre mesi."], grammar: [g.passive-essere], vocab: [w.sarcofago, w.cuore] }
      - { es: "Il tuo numero è stato conservato con la cura di un reperto prezioso.", en: "Your number has been kept with the care given to a precious find.", altEs: ["Il tuo numero è stato custodito con la cura di un reperto prezioso."], grammar: [g.passive-essere], vocab: [w.reperto, w.conservare] }
      - { es: "Tra le colonne del foro sono stato colpito da un fulmine: era il tuo sorriso.", en: "Among the columns of the forum I was struck by lightning: it was your smile.", altEs: ["Tra le colonne del foro sono stata colpita da un fulmine: era il tuo sorriso."], grammar: [g.passive-essere], vocab: [w.colonna, w.foro, w.colpire] }
  - id: b2.u04.l2
    title: Il limoncello viene servito freddo
    teach: [g.passive-venire]
    vocab: [w.adottare, w.arte-romana, w.bronzo, w.scolpire, w.scultura, w.calcare, w.ritratto, w.commissionare, w.affrescato, w.illuminare, w.dedicare, w.terme, w.acquedotto, w.territorio, w.valorizzare, w.mecenate, w.mosaico, w.conservare, w.committente, w.dorato, w.mattone, w.pietra, w.pittura, w.dedicato, w.conservazione, w.mulino, w.restauratore]
    tip: "venire + participle is a passive that stresses the action, and works only in simple tenses: viene servito, veniva fatto, verrà inaugurato. In compound tenses use essere: è stato servito."
    sentences:
      - { es: "I limoni della Costiera vengono raccolti a mano, spesso su terrazze ripidissime.", en: "The Amalfi Coast's lemons are picked by hand, often on extremely steep terraces.", altEs: ["I limoni della Costiera sono raccolti a mano, spesso su terrazze ripidissime."], grammar: [g.passive-venire], vocab: [w.limone, w.raccogliere, w.terrazza] }
      - { es: "Il limoncello viene servito freddo, alla fine del pranzo.", en: "Limoncello is served cold, at the end of lunch.", altEs: ["Il limoncello si serve freddo, alla fine del pranzo."], grammar: [g.passive-venire], vocab: [w.servire, w.freddo] }
      - { es: "Molte tecniche greche vennero adottate dall'arte romana.", en: "Many Greek techniques were adopted by Roman art.", altEs: ["Molte tecniche greche furono adottate dall'arte romana."], grammar: [g.passive-venire, g.passato-remoto-recognition], vocab: [w.adottare, w.arte-romana] }
      - { es: "La statua di bronzo verrà restaurata entro l'estate.", en: "The bronze statue will be restored by the summer.", altEs: ["La statua di bronzo sarà restaurata entro l'estate."], grammar: [g.passive-venire, g.futuro-semplice], vocab: [w.bronzo, w.statua] }
      - { es: "Le sculture venivano scolpite nel calcare della costa.", en: "The sculptures were carved from the limestone of the coast.", altEs: ["Le sculture erano scolpite nel calcare della costa."], grammar: [g.passive-venire], vocab: [w.scultura, w.scolpire, w.calcare] }
      - { es: "Il ritratto venne commissionato da un ricco mercante di Amalfi.", en: "The portrait was commissioned by a rich merchant from Amalfi.", altEs: ["Il ritratto fu commissionato da un ricco mercante di Amalfi."], grammar: [g.passive-venire, g.passato-remoto-recognition], vocab: [w.ritratto, w.commissionare] }
      - { es: "Le sale della villa vennero affrescate da pittori napoletani.", en: "The rooms of the villa were frescoed by Neapolitan painters.", altEs: ["Le sale della villa furono affrescate da pittori napoletani."], grammar: [g.passive-venire], vocab: [w.affrescato, w.pittore] }
      - { es: "Ogni sera la cupola del duomo viene illuminata.", en: "Every evening the cathedral dome is lit up.", altEs: ["Tutte le sere la cupola del duomo viene illuminata."], grammar: [g.passive-venire], vocab: [w.illuminare, w.cupola, w.duomo] }
      - { es: "La cattedrale di Amalfi venne dedicata a Sant'Andrea.", en: "Amalfi cathedral was dedicated to Saint Andrew.", altEs: ["La cattedrale di Amalfi fu dedicata a Sant'Andrea."], grammar: [g.passive-venire], vocab: [w.dedicare, w.cattedrale] }
      - { es: "Le terme venivano frequentate da tutta la città, ricchi e poveri.", en: "The baths were used by the whole city, rich and poor.", altEs: ["Le terme erano frequentate da tutta la città, ricchi e poveri."], grammar: [g.passive-venire], vocab: [w.terme, w.frequentare] }
      - { es: "L'acqua veniva portata in città da un acquedotto lungo trenta chilometri.", en: "Water was brought into the city by an aqueduct thirty kilometres long.", altEs: ["L'acqua era portata in città da un acquedotto lungo trenta chilometri."], grammar: [g.passive-venire], vocab: [w.acquedotto, w.acqua] }
      - { es: "Oggi il territorio viene valorizzato anche grazie al turismo.", en: "Today the area is being enhanced thanks to tourism too.", altEs: ["Oggi il territorio è valorizzato anche grazie al turismo."], grammar: [g.passive-venire], vocab: [w.territorio, w.valorizzare, w.turismo] }
      - { es: "Gli artisti venivano protetti da un mecenate, che pagava le loro opere.", en: "Artists were protected by a patron, who paid for their works.", altEs: ["Gli artisti erano protetti da un mecenate, che pagava le loro opere."], grammar: [g.passive-venire], vocab: [w.mecenate, w.opera] }
      - { es: "La mostra è stata inaugurata ieri.", en: "The exhibition was opened yesterday.", altEs: ["Ieri hanno inaugurato la mostra."], grammar: [g.passive-essere, g.passive-venire], vocab: [w.inaugurare, w.mostra], error: { wrong: "La mostra è venuta inaugurata ieri.", explain: "venire cannot form the passive in compound tenses: use essere (è stata inaugurata).", grammar: g.passive-venire } }
      - { es: "Raccolgono le olive a novembre.", en: "They pick the olives in November.", grammar: [g.irregular-present], vocab: [w.oliva, w.raccogliere], transform: { instruction: "Make it passive with venire: Le olive…", answer: "Le olive vengono raccolte a novembre.", alt: ["Le olive sono raccolte a novembre.", "A novembre le olive vengono raccolte."], en: "The olives are picked in November." } }
      - { es: "Puliscono il mosaico ogni settimana.", en: "They clean the mosaic every week.", grammar: [g.present-isc], vocab: [w.mosaico, w.pulire], transform: { instruction: "Make it passive with venire: Il mosaico…", answer: "Il mosaico viene pulito ogni settimana.", alt: ["Il mosaico è pulito ogni settimana.", "Ogni settimana il mosaico viene pulito."], en: "The mosaic is cleaned every week." } }
    exchanges:
      - q: { es: "Come viene fatto il limoncello?", en: "How is limoncello made?" }
        a: { es: "Le bucce dei limoni vengono lasciate nell'alcol per qualche giorno, poi viene aggiunto lo zucchero.", en: "The lemon peels are left in alcohol for a few days, then the sugar is added." }
        alt: ["Con le bucce dei limoni, l'alcol e lo zucchero.", "Vengono usate solo le bucce dei limoni."]
        grammar: [g.passive-venire]
        vocab: [w.limone, w.zucchero]
      - q: { es: "Chi pagava gli artisti nel Rinascimento?", en: "Who paid artists in the Renaissance?" }
        a: { es: "Di solito venivano pagati da un committente ricco: un mecenate, una famiglia nobile o la Chiesa.", en: "They were usually paid by a rich client: a patron, a noble family or the Church." }
        alt: ["Un mecenate o la Chiesa.", "Venivano pagati dai committenti."]
        grammar: [g.passive-venire]
        vocab: [w.committente, w.mecenate]
      - q: { es: "Perché la cupola di Positano sembra d'oro?", en: "Why does the dome in Positano look golden?" }
        a: { es: "Le sue maioliche vengono illuminate dal sole del tramonto e sembrano dorate.", en: "Its majolica tiles are lit by the setting sun and look golden." }
        alt: ["Per il sole del tramonto.", "Perché viene illuminata dal sole."]
        grammar: [g.passive-venire]
        vocab: [w.dorato, w.cupola, w.illuminare]
      - q: { es: "Come venivano costruite le case romane?", en: "How were Roman houses built?" }
        a: { es: "Venivano costruite con mattoni e pietra, e i muri venivano decorati con la pittura.", en: "They were built with bricks and stone, and the walls were decorated with painting." }
        alt: ["Con mattoni e pietra.", "Di pietra e mattoni."]
        grammar: [g.passive-venire]
        vocab: [w.mattone, w.pietra, w.pittura]
      - q: { es: "Il mosaico è originale?", en: "Is the mosaic original?" }
        a: { es: "Sì, ma viene conservato in una sala chiusa, per proteggerlo dall'umidità.", en: "Yes, but it's kept in a closed room to protect it from the damp." }
        alt: ["Sì, è originale.", "No, l'originale viene conservato al museo."]
        grammar: [g.passive-venire]
        vocab: [w.mosaico, w.conservare]
    texts:
      - title: "La Valle dei Mulini"
        es: ["Nel Medioevo, ad Amalfi, la carta veniva prodotta a mano nei mulini lungo il torrente.", "Gli stracci di cotone venivano battuti con la forza dell'acqua fino a diventare una pasta.", "Ancora oggi alcuni fogli vengono fatti con lo stesso metodo."]
        en: ["In the Middle Ages, in Amalfi, paper was made by hand in the mills along the stream.", "Cotton rags were pounded by the force of the water until they became a pulp.", "Even today some sheets are made with the same method."]
        grammar: [g.passive-venire]
        vocab: [w.mulino, w.carta]
      - title: "Un'opera dedicata"
        es: ["Questo affresco è dedicato alla Madonna.", "Venne commissionato da una famiglia nobile di Ravello.", "Oggi la sua conservazione viene seguita dai restauratori della Soprintendenza."]
        en: ["This fresco is dedicated to the Virgin Mary.", "It was commissioned by a noble family from Ravello.", "Today its conservation is overseen by the restorers of the Heritage Office."]
        grammar: [g.passive-venire, g.passive-essere]
        vocab: [w.dedicato, w.commissionare, w.conservazione, w.restauratore]
    spicy:
      - { es: "Il limoncello viene servito freddo; i miei complimenti, invece, vengono serviti caldi.", en: "Limoncello is served cold; my compliments, on the other hand, are served warm.", altEs: ["Il limoncello si serve freddo; i miei complimenti, invece, li servo caldi."], grammar: [g.passive-venire], vocab: [w.servire, w.caldo] }
      - { es: "Ogni sera la cupola viene illuminata dal tramonto, e io vengo illuminato dal tuo sorriso.", en: "Every evening the dome is lit up by the sunset, and I'm lit up by your smile.", altEs: ["Ogni sera la cupola viene illuminata dal tramonto, e io vengo illuminata dal tuo sorriso."], grammar: [g.passive-venire], vocab: [w.illuminare, w.cupola] }
      - { es: "Questo ritratto è stato commissionato da me: sei tu, ma più bella non si poteva.", en: "I commissioned this portrait: it's you, but it couldn't have been more beautiful.", altEs: ["Questo ritratto l'ho commissionato io: sei tu, ma più bella non si poteva."], grammar: [g.passive-essere], vocab: [w.ritratto, w.commissionare] }
      - { es: "Sembri una scultura greca, ma per fortuna sorridi e mi offri il caffè.", en: "You look like a Greek sculpture, but luckily you smile and buy me coffee.", altEs: ["Sembri una statua greca, ma per fortuna sorridi e mi offri il caffè."], grammar: [g.present-ere-ire], vocab: [w.scultura, w.sorridere] }
      - { es: "Mi hai portato in una villa affrescata solo per baciarmi davanti agli angeli?", en: "Did you bring me to a frescoed villa just to kiss me in front of the angels?", altEs: ["Mi hai portata in una villa affrescata solo per baciarmi davanti agli angeli?"], grammar: [g.passato-prossimo-avere], vocab: [w.affrescato, w.baciare] }
  - id: b2.u04.l3
    title: Va visitata in primavera
    teach: [g.passive-andare]
    vocab: [w.andare-fatto, w.reliquia, w.tutelare, w.tutela, w.porre, w.inaugurazione, w.ricorrere, w.inaugurare, w.santuario, w.attivo, w.sorvegliare, w.onore, w.mortale, w.immobile, w.percorrere, w.coprire, w.sospendere]
    tip: "andare + participle = must be done: La sfogliatella va mangiata calda. Le regole vanno rispettate. Only simple tenses (va, andava, andrà). With perdere or distruggere it means 'get lost / destroyed': molte opere andarono distrutte."
    sentences:
      - { es: "La Costiera va visitata in primavera, quando ci sono meno turisti.", en: "The Amalfi Coast should be visited in spring, when there are fewer tourists.", altEs: ["La Costiera andrebbe visitata in primavera, quando ci sono meno turisti."], grammar: [g.passive-andare], vocab: [w.andare-fatto, w.primavera] }
      - { es: "Il biglietto va conservato fino all'uscita.", en: "The ticket must be kept until the exit.", altEs: ["Il biglietto va tenuto fino all'uscita."], grammar: [g.passive-andare], vocab: [w.conservare, w.biglietto] }
      - { es: "Le reliquie vanno trattate con il massimo rispetto.", en: "Relics must be treated with the utmost respect.", altEs: ["Le reliquie devono essere trattate con il massimo rispetto."], grammar: [g.passive-andare], vocab: [w.reliquia, w.rispetto] }
      - { es: "Il patrimonio culturale va tutelato da tutti, non solo dallo Stato.", en: "Cultural heritage must be protected by everyone, not only by the State.", altEs: ["Il patrimonio culturale deve essere tutelato da tutti, non solo dallo Stato."], grammar: [g.passive-andare], vocab: [w.tutelare, w.patrimonio] }
      - { es: "Le regole per la tutela del paesaggio vanno rispettate.", en: "The rules for protecting the landscape must be respected.", altEs: ["Le norme per la tutela del paesaggio vanno rispettate."], grammar: [g.passive-andare], vocab: [w.tutela, w.paesaggio, w.regola] }
      - { es: "Questa domanda andava posta prima dell'inaugurazione.", en: "This question should have been asked before the opening.", altEs: ["Questa domanda doveva essere posta prima dell'inaugurazione."], grammar: [g.passive-andare], vocab: [w.porre, w.inaugurazione, w.domanda], note: "andava + participle about the past = should have been done." }
      - { es: "Bisognerà ricorrere a un restauratore esperto: il dipinto va pulito con molta cura.", en: "We'll have to turn to an expert restorer: the painting must be cleaned very carefully.", altEs: ["Bisognerà ricorrere a un restauratore esperto, perché il dipinto va pulito con molta cura."], grammar: [g.passive-andare], vocab: [w.ricorrere, w.restauratore, w.dipinto] }
      - { es: "Il nuovo museo sarà inaugurato a maggio, e i biglietti andranno prenotati online.", en: "The new museum will be opened in May, and tickets will have to be booked online.", altEs: ["Il nuovo museo verrà inaugurato a maggio, e i biglietti andranno prenotati online."], grammar: [g.passive-andare, g.passive-essere], vocab: [w.inaugurare, w.prenotare] }
      - { es: "Nel santuario il silenzio va rispettato e il cappello va tolto.", en: "In the sanctuary silence must be respected and your hat must be taken off.", altEs: ["Nel santuario va rispettato il silenzio e va tolto il cappello."], grammar: [g.passive-andare], vocab: [w.santuario, w.silenzio, w.togliere] }
      - { es: "Il Vesuvio è ancora attivo e va sorvegliato giorno e notte.", en: "Vesuvius is still active and must be monitored day and night.", altEs: ["Il Vesuvio è ancora attivo e deve essere sorvegliato giorno e notte."], grammar: [g.passive-andare], vocab: [w.attivo, w.sorvegliare] }
      - { es: "In onore di Sant'Andrea, ogni anno la statua viene portata in processione.", en: "In honour of Saint Andrew, every year the statue is carried in procession.", altEs: ["Ogni anno, in onore di Sant'Andrea, la statua viene portata in processione."], grammar: [g.passive-venire], vocab: [w.onore, w.processione] }
      - { es: "Durante la guerra molte opere d'arte andarono distrutte.", en: "During the war many works of art were destroyed.", altEs: ["Durante la guerra molte opere d'arte sono andate distrutte."], grammar: [g.passive-andare, g.passato-remoto-recognition], vocab: [w.distruggere, w.opera], note: "With distruggere, perdere, smarrire, andare means 'end up destroyed / lost'." }
      - { es: "Un errore in montagna può essere mortale: il Sentiero degli Dei va percorso con scarpe adatte.", en: "A mistake in the mountains can be fatal: the Path of the Gods must be walked in suitable shoes.", altEs: ["In montagna un errore può essere mortale: il Sentiero degli Dei va fatto con scarpe adatte."], grammar: [g.passive-andare], vocab: [w.mortale, w.percorrere, w.adatto] }
      - { es: "Le prenotazioni vanno fatte entro venerdì.", en: "Bookings must be made by Friday.", altEs: ["Le prenotazioni devono essere fatte entro venerdì."], grammar: [g.passive-andare], vocab: [w.prenotazione], error: { wrong: "Le prenotazioni va fatto entro venerdì.", explain: "andare and the participle agree with the subject: le prenotazioni vanno fatte.", grammar: g.passive-andare } }
      - { es: "Bisogna prenotare il traghetto in anticipo.", en: "You need to book the ferry in advance.", grammar: [g.bisogna-avere-bisogno], vocab: [w.traghetto, w.anticipare], transform: { instruction: "Rewrite with andare + participle: Il traghetto…", answer: "Il traghetto va prenotato in anticipo.", alt: ["Il traghetto andrebbe prenotato in anticipo."], en: "The ferry must be booked in advance." } }
      - { es: "Si devono spegnere i telefoni durante la messa.", en: "Phones must be switched off during Mass.", grammar: [g.si-impersonale, g.potere-dovere], vocab: [w.spegnere], transform: { instruction: "Rewrite with andare + participle: I telefoni…", answer: "I telefoni vanno spenti durante la messa.", alt: ["Durante la messa i telefoni vanno spenti."], en: "Phones must be switched off during Mass." } }
    exchanges:
      - q: { es: "Come va mangiata la sfogliatella?", en: "How should a sfogliatella be eaten?" }
        a: { es: "Va mangiata calda, appena uscita dal forno.", en: "It should be eaten warm, straight out of the oven." }
        alt: ["Calda!", "Va mangiata calda, con un caffè."]
        grammar: [g.passive-andare]
        vocab: [w.andare-fatto, w.sfogliatella]
      - q: { es: "Posso fare foto nel chiostro?", en: "Can I take photos in the cloister?" }
        a: { es: "Sì, ma il flash non va usato.", en: "Yes, but you mustn't use the flash." }
        alt: ["Sì, ma senza flash.", "Certo, ma il flash va spento."]
        grammar: [g.passive-andare]
        vocab: [w.chiostro]
      - q: { es: "Quando sarà inaugurata la nuova sala?", en: "When will the new room be opened?" }
        a: { es: "A giugno, in onore dei cento anni del museo.", en: "In June, in honour of the museum's hundredth anniversary." }
        alt: ["A giugno.", "Verrà inaugurata a giugno."]
        grammar: [g.passive-essere]
        vocab: [w.inaugurare, w.onore]
      - q: { es: "Perché la guida è rimasta immobile?", en: "Why did the guide stand still?" }
        a: { es: "Voleva che anche noi restassimo immobili ad ascoltare: nel chiostro il silenzio va rispettato.", en: "She wanted us to stand still and listen too: in the cloister silence must be respected." }
        alt: ["Per farci ascoltare il silenzio.", "Perché nel chiostro il silenzio va rispettato."]
        grammar: [g.passive-andare, g.congiuntivo-imperfetto]
        vocab: [w.immobile, w.silenzio]
      - q: { es: "Che cosa c'è da sapere prima di visitare il santuario?", en: "What do you need to know before visiting the sanctuary?" }
        a: { es: "Le spalle vanno coperte e le reliquie non vanno toccate.", en: "Shoulders must be covered and the relics mustn't be touched." }
        alt: ["Le spalle vanno coperte.", "Va rispettato il silenzio."]
        grammar: [g.passive-andare]
        vocab: [w.santuario, w.reliquia, w.coprire]
    texts:
      - title: "Regolamento del Duomo"
        es: ["Si entra in silenzio: il luogo va rispettato.", "Le spalle e le gambe vanno coperte.", "Le offerte vanno lasciate nella cassetta all'uscita."]
        en: ["Enter in silence: the place must be respected.", "Shoulders and legs must be covered.", "Donations should be left in the box at the exit."]
        grammar: [g.passive-andare]
        vocab: [w.andare-fatto, w.offerta]
      - title: "Avviso del Parco del Vesuvio"
        es: ["Il vulcano è attivo ed è sorvegliato dall'Osservatorio Vesuviano.", "Il sentiero va percorso solo negli orari di apertura.", "In caso di vento forte, la salita al cratere va sospesa."]
        en: ["The volcano is active and is monitored by the Vesuvius Observatory.", "The path may only be walked during opening hours.", "In case of strong wind, the climb to the crater must be suspended."]
        grammar: [g.passive-andare, g.passive-essere]
        vocab: [w.attivo, w.sorvegliare, w.sospendere]
    spicy:
      - { es: "Il limoncello va bevuto freddo; i baci, invece, vanno dati caldi.", en: "Limoncello should be drunk cold; kisses, on the other hand, should be given warm.", altEs: ["Il limoncello va bevuto freddo, i baci vanno dati caldi."], grammar: [g.passive-andare], vocab: [w.bacio, w.freddo] }
      - { es: "Certe cose non vanno dette al primo appuntamento, per esempio che ho già scelto il nome del nostro cane.", en: "Some things shouldn't be said on a first date, for example that I've already chosen our dog's name.", altEs: ["Certe cose non vanno dette al primo appuntamento: per esempio, che ho già scelto il nome del nostro cane."], grammar: [g.passive-andare], vocab: [w.appuntamento, w.cane] }
      - { es: "Questa serata va ricordata: è la prima volta che mi lasci scegliere il ristorante.", en: "This evening should go down in history: it's the first time you've let me choose the restaurant.", altEs: ["Questa serata va ricordata: è la prima volta che mi fai scegliere il ristorante."], grammar: [g.passive-andare, g.lasciare-infinitive], vocab: [w.ricordare, w.ristorante] }
      - { es: "Un uomo che cucina così va tutelato come patrimonio dell'UNESCO.", en: "A man who cooks like that should be protected as a UNESCO heritage site.", altEs: ["Una donna che cucina così va tutelata come patrimonio dell'UNESCO."], grammar: [g.passive-andare], vocab: [w.tutelare, w.patrimonio] }
      - { es: "Le tue lettere vanno conservate come reliquie: le rileggo ogni sera.", en: "Your letters should be kept like relics: I reread them every evening.", altEs: ["Le tue lettere vanno custodite come reliquie: le rileggo ogni sera."], grammar: [g.passive-andare], vocab: [w.reliquia, w.lettera] }
  - id: b2.u04.l4
    title: Fu distrutta e ricostruita
    teach: [g.passive-essere, g.passive-venire]
    vocab: [w.barocco, w.crollare, w.ricostruire, w.chiostro, w.convento, w.edificare, w.seppellire, w.cenere, w.eruzione, w.lava, w.cono, w.potente, w.bordo, w.cratere, w.rupestre, w.basilica, w.romanico, w.gotico, w.neoclassico, w.monastero, w.cattedrale, w.erigere, w.immenso, w.crollo, w.ricostruzione, w.fortezza, w.picco, w.sepolto, w.distruzione, w.vulcano, w.abbazia, w.distruggere, w.cimitero, w.cripta, w.fango]
    tip: "Historical passives usually take the passato remoto: fu costruita, furono distrutti, venne ricostruito. The agent with da: fu distrutta dal terremoto, dalla lava, dai pirati."
    sentences:
      - { es: "L'interno del Duomo di Amalfi fu rinnovato in stile barocco nel Settecento.", en: "The interior of Amalfi Cathedral was renovated in Baroque style in the 18th century.", altEs: ["Nel Settecento l'interno del Duomo di Amalfi fu rinnovato in stile barocco."], grammar: [g.passive-essere, g.passato-remoto-recognition], vocab: [w.barocco, w.stile] }
      - { es: "La facciata crollò nel 1861 e fu ricostruita alla fine dell'Ottocento.", en: "The façade collapsed in 1861 and was rebuilt at the end of the 19th century.", altEs: ["La facciata crollò nel 1861 e venne ricostruita alla fine dell'Ottocento."], grammar: [g.passive-essere, g.passato-remoto-recognition], vocab: [w.crollare, w.ricostruire, w.facciata] }
      - { es: "Il Chiostro del Paradiso fu costruito nel Duecento come cimitero per le famiglie nobili.", en: "The Cloister of Paradise was built in the 13th century as a cemetery for noble families.", altEs: ["Il Chiostro del Paradiso venne costruito nel Duecento come cimitero per le famiglie nobili."], grammar: [g.passive-essere], vocab: [w.chiostro, w.cimitero] }
      - { es: "Le reliquie di Sant'Andrea furono portate ad Amalfi da Costantinopoli nel 1208.", en: "The relics of Saint Andrew were brought to Amalfi from Constantinople in 1208.", altEs: ["Le reliquie di Sant'Andrea vennero portate ad Amalfi da Costantinopoli nel 1208."], grammar: [g.passive-essere, g.passive-venire], vocab: [w.reliquia] }
      - { es: "Questo antico convento è stato trasformato in un albergo di lusso.", en: "This old convent has been turned into a luxury hotel.", altEs: ["Questo vecchio convento è stato trasformato in un albergo di lusso."], grammar: [g.passive-essere], vocab: [w.convento, w.trasformare, w.albergo] }
      - { es: "Le torri lungo la costa furono edificate per difendere i paesi dai pirati.", en: "The towers along the coast were built to defend the villages from pirates.", altEs: ["Le torri lungo la costa vennero edificate per difendere i paesi dai pirati."], grammar: [g.passive-essere, g.passive-venire], vocab: [w.edificare, w.torre, w.difendere] }
      - { es: "Nel 79 d.C. Pompei ed Ercolano furono sepolte dall'eruzione del Vesuvio.", en: "In AD 79 Pompeii and Herculaneum were buried by the eruption of Vesuvius.", altEs: ["Nel 79 d.C. Pompei ed Ercolano vennero sepolte dall'eruzione del Vesuvio."], grammar: [g.passive-essere], vocab: [w.seppellire, w.eruzione] }
      - { es: "Durante l'eruzione del 1944 il paese di San Sebastiano fu distrutto dalla lava.", en: "During the 1944 eruption the village of San Sebastiano was destroyed by the lava.", altEs: ["Durante l'eruzione del 1944 il paese di San Sebastiano venne distrutto dalla lava."], grammar: [g.passive-essere], vocab: [w.lava, w.distruggere] }
      - { es: "Il cono del vulcano viene sorvegliato da strumenti molto potenti.", en: "The cone of the volcano is monitored by very powerful instruments.", altEs: ["Il cono del vulcano è sorvegliato da strumenti molto potenti."], grammar: [g.passive-venire], vocab: [w.cono, w.potente, w.strumento] }
      - { es: "Sul bordo del cratere sono stati messi dei cartelli per i turisti.", en: "Signs have been put up on the rim of the crater for the tourists.", altEs: ["Sul bordo del cratere hanno messo dei cartelli per i turisti."], grammar: [g.passive-essere], vocab: [w.bordo, w.cratere, w.cartello] }
      - { es: "Le chiese rupestri di Matera erano scavate nella roccia.", en: "Matera's rock churches were carved into the rock.", altEs: ["Le chiese rupestri di Matera furono scavate nella roccia."], grammar: [g.passive-essere], vocab: [w.rupestre, w.roccia] }
      - { es: "La basilica è stata costruita in stile romanico, ma l'interno è gotico.", en: "The basilica was built in Romanesque style, but the interior is Gothic.", altEs: ["La basilica fu costruita in stile romanico, ma l'interno è gotico."], grammar: [g.passive-essere], vocab: [w.basilica, w.romanico, w.gotico] }
      - { es: "Il palazzo neoclassico fu progettato da un architetto napoletano.", en: "The neoclassical palace was designed by a Neapolitan architect.", altEs: ["Il palazzo neoclassico venne progettato da un architetto napoletano."], grammar: [g.passive-essere], vocab: [w.neoclassico, w.progettare, w.architetto] }
      - { es: "Il monastero fu fondato nel XII secolo.", en: "The monastery was founded in the 12th century.", altEs: ["Il monastero venne fondato nel XII secolo.", "Il monastero è stato fondato nel XII secolo."], grammar: [g.passive-essere], vocab: [w.monastero, w.fondare], error: { wrong: "Il monastero fu fondata nel XII secolo.", explain: "The participle agrees with the subject: il monastero (masculine) fu fondato.", grammar: g.passive-essere } }
      - { es: "Il terremoto distrusse la cattedrale.", en: "The earthquake destroyed the cathedral.", grammar: [g.passato-remoto-recognition], vocab: [w.terremoto, w.cattedrale], transform: { instruction: "Make it passive, starting with La cattedrale…", answer: "La cattedrale fu distrutta dal terremoto.", alt: ["La cattedrale venne distrutta dal terremoto.", "La cattedrale è stata distrutta dal terremoto."], en: "The cathedral was destroyed by the earthquake." } }
      - { es: "Gli architetti hanno eretto un monumento immenso.", en: "The architects have erected an immense monument.", grammar: [g.passato-prossimo-avere], vocab: [w.erigere, w.immenso, w.monumento], transform: { instruction: "Make it passive, starting with Un monumento immenso…", answer: "Un monumento immenso è stato eretto dagli architetti.", alt: ["Un monumento immenso fu eretto dagli architetti."], en: "An immense monument has been erected by the architects." } }
    exchanges:
      - q: { es: "Perché la facciata del Duomo sembra così nuova?", en: "Why does the cathedral façade look so new?" }
        a: { es: "Perché fu ricostruita dopo il crollo del 1861.", en: "Because it was rebuilt after the collapse of 1861." }
        alt: ["È stata ricostruita nell'Ottocento.", "Perché quella originale crollò."]
        grammar: [g.passive-essere]
        vocab: [w.crollo, w.ricostruire]
      - q: { es: "Quanto è durata la ricostruzione?", en: "How long did the rebuilding take?" }
        a: { es: "Circa vent'anni: i lavori furono terminati alla fine dell'Ottocento.", en: "About twenty years: the work was finished at the end of the 19th century." }
        alt: ["Circa vent'anni.", "Molti anni."]
        grammar: [g.passive-essere]
        vocab: [w.ricostruzione]
      - q: { es: "Che cos'è quella fortezza sul picco?", en: "What's that fortress on the peak?" }
        a: { es: "È un castello medievale: fu costruito per controllare la valle.", en: "It's a medieval castle: it was built to control the valley." }
        alt: ["Un castello medievale.", "Una vecchia fortezza contro i pirati."]
        grammar: [g.passive-essere]
        vocab: [w.fortezza, w.picco, w.castello]
      - q: { es: "Ercolano fu distrutta come Pompei?", en: "Was Herculaneum destroyed like Pompeii?" }
        a: { es: "Sì, ma fu sepolta da un fango che ha conservato perfino il legno.", en: "Yes, but it was buried by a mud that even preserved the wood." }
        alt: ["Sì, nella stessa eruzione.", "Sì, ma in modo diverso."]
        grammar: [g.passive-essere]
        vocab: [w.sepolto, w.fango, w.legno]
      - q: { es: "Perché il Vesuvio è considerato così pericoloso?", en: "Why is Vesuvius considered so dangerous?" }
        a: { es: "Perché è un vulcano attivo ed è circondato da città dove vivono centinaia di migliaia di persone.", en: "Because it's an active volcano and it's surrounded by towns where hundreds of thousands of people live." }
        alt: ["Perché è circondato da città.", "Perché un'eruzione causerebbe una distruzione enorme."]
        grammar: [g.passive-essere]
        vocab: [w.vulcano, w.pericoloso]
    texts:
      - title: "Guida turistica: Ravello"
        es: ["Villa Rufolo fu costruita nel Duecento da una ricca famiglia di mercanti.", "Nel 1880 fu visitata da Richard Wagner, che ne rimase incantato.", "Oggi i suoi giardini vengono usati per i concerti del Ravello Festival."]
        en: ["Villa Rufolo was built in the 13th century by a rich family of merchants.", "In 1880 it was visited by Richard Wagner, who was enchanted by it.", "Today its gardens are used for the concerts of the Ravello Festival."]
        grammar: [g.passive-essere, g.passive-venire]
        vocab: [w.giardino, w.concerto]
      - title: "Notizia: l'abbazia rinasce"
        es: ["L'antica abbazia, distrutta da un terremoto nel Seicento, sarà restaurata.", "I lavori di ricostruzione verranno pagati dalla Regione e da alcuni privati.", "La riapertura è prevista tra due anni."]
        en: ["The ancient abbey, destroyed by an earthquake in the 17th century, will be restored.", "The rebuilding work will be paid for by the Region and some private donors.", "The reopening is planned in two years' time."]
        grammar: [g.passive-essere, g.passive-venire]
        vocab: [w.abbazia, w.ricostruzione]
    spicy:
      - { es: "Questa cattedrale fu costruita in duecento anni; a me sono bastati due minuti per innamorarmi di te.", en: "This cathedral was built over two hundred years; it took me just two minutes to fall for you.", altEs: ["Questa cattedrale venne costruita in duecento anni; a me sono bastati due minuti per innamorarmi di te."], grammar: [g.passive-essere], vocab: [w.cattedrale, w.innamorarsi] }
      - { es: "Il mio cuore è stato distrutto e ricostruito tante volte, ma è ancora in stile romantico.", en: "My heart has been destroyed and rebuilt many times, but it's still in Romantic style.", altEs: ["Il mio cuore è stato distrutto e ricostruito molte volte, ma è ancora in stile romantico."], grammar: [g.passive-essere], vocab: [w.ricostruire, w.cuore] }
      - { es: "Il castello era stato costruito per resistere ai pirati, ma non al tuo sorriso.", en: "The castle had been built to resist pirates, but not your smile.", altEs: ["Il castello fu costruito per resistere ai pirati, ma non al tuo sorriso."], grammar: [g.passive-essere, g.trapassato-prossimo], vocab: [w.castello, w.resistere] }
      - { es: "Sei più potente di un vulcano: da quando ti conosco, il mio telefono è sempre in eruzione.", en: "You're more powerful than a volcano: since I met you, my phone has been constantly erupting.", altEs: ["Sei più potente di un vulcano: da quando ti conosco, il mio cellulare è sempre in eruzione."], grammar: [g.comparatives], vocab: [w.potente, w.vulcano, w.eruzione] }
      - { es: "Nel chiostro mi hai detto che sono la tua opera d'arte preferita; spero che non intendessi «antica».", en: "In the cloister you told me I'm your favourite work of art; I hope you didn't mean 'ancient'.", altEs: ["Nel chiostro mi hai detto che sono la tua opera d'arte preferita: spero che non intendessi «antica»."], grammar: [g.concordanza-congiuntivo], vocab: [w.chiostro, w.opera] }
dialogues:
  - id: b2.u04.d1
    title: Davanti al Duomo di Amalfi
    context: Concetta, a local guide, shows Filippo round Amalfi Cathedral.
    lines:
      - { speaker: Concetta, es: "Benvenuto al Duomo di Amalfi. La scalinata va salita con calma: sono sessantadue gradini.", en: "Welcome to Amalfi Cathedral. The staircase should be climbed slowly: there are sixty-two steps." }
      - { speaker: Filippo, es: "La facciata è splendida. Quando è stata costruita?", en: "The façade is splendid. When was it built?" }
      - { speaker: Concetta, es: "Quella originale crollò nel 1861; questa fu ricostruita alla fine dell'Ottocento.", en: "The original one collapsed in 1861; this one was rebuilt at the end of the 19th century." }
      - { speaker: Filippo, es: "E la chiesa a chi è dedicata?", en: "And who is the church dedicated to?" }
      - { speaker: Concetta, es: "A Sant'Andrea. Le sue reliquie furono portate qui da Costantinopoli nel 1208 e vengono conservate nella cripta.", en: "To Saint Andrew. His relics were brought here from Constantinople in 1208 and are kept in the crypt." }
      - { speaker: Filippo, es: "Si possono vedere?", en: "Can they be seen?" }
      - { speaker: Concetta, es: "Sì, ma la cripta va visitata in silenzio e le foto con il flash non vanno fatte.", en: "Yes, but the crypt must be visited in silence and flash photos must not be taken." }
      - { speaker: Filippo, es: "Capito. E il chiostro?", en: "Understood. And the cloister?" }
      - { speaker: Concetta, es: "Il Chiostro del Paradiso fu costruito nel Duecento come cimitero per le famiglie nobili.", en: "The Cloister of Paradise was built in the 13th century as a cemetery for the noble families." }
      - { speaker: Filippo, es: "Un cimitero? Con quelle colonne e quei fiori sembra un giardino!", en: "A cemetery? With those columns and flowers it looks like a garden!" }
      - { speaker: Concetta, es: "Infatti oggi è uno dei luoghi più fotografati di Amalfi.", en: "Indeed, today it's one of the most photographed places in Amalfi." }
    questions:
      - { q: "A chi è dedicato il Duomo di Amalfi?", options: ["A San Gennaro.", "A Sant'Andrea.", "A San Francesco."], answer: 1, explain: "La chiesa è dedicata a Sant'Andrea, whose relics arrived from Constantinople in 1208." }
