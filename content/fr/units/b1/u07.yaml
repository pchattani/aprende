id: b1.u07
title: "Arles, sur les pas de Van Gogh"
lessons:
  - id: b1.u07.l1
    title: Il avait déjà peint des tournesols
    teach: [g.plus-que-parfait]
    vocab: [w.arène, w.romain, w.réaliser, w.conserver, w.tournesol, w.fou, w.folie, w.génie, w.chef-d-œuvre, w.toile, w.pinceau, w.souffrir, w.hôpital-psychiatrique, w.auparavant, w.précédent, w.reconnu, w.décorer, w.impressionniste, w.repeindre, w.romantique]
    tip: "The plus-que-parfait (j'avais vu, elle était partie) takes you one step further back: it's what had already happened before another past event."
    sentences:
      - { es: "Quand Van Gogh est arrivé à Arles, il avait déjà vécu deux ans à Paris.", en: "When Van Gogh arrived in Arles, he had already lived in Paris for two years.", altEs: ["Lorsque Van Gogh est arrivé à Arles, il avait déjà vécu deux ans à Paris.", "Quand Van Gogh est arrivé à Arles, il avait déjà passé deux ans à Paris."], altEn: ["When Van Gogh got to Arles, he had already spent two years in Paris."], grammar: [g.plus-que-parfait, g.time-clauses], vocab: [w.vivre] }
      - { es: "Il n'avait jamais vu une lumière pareille.", en: "He had never seen light like that.", altEs: ["Il n'avait jamais vu une telle lumière.", "Il n'avait jamais vu de lumière pareille."], altEn: ["He had never seen such light."], grammar: [g.plus-que-parfait, g.negation-jamais-plus-rien], vocab: [w.lumière], transform: { instruction: "Change to 'nous'", answer: "Nous n'avions jamais vu une lumière pareille.", alt: ["Nous n'avions jamais vu une telle lumière.", "On n'avait jamais vu une lumière pareille."], en: "We had never seen light like that." } }
      - { es: "Auparavant, il avait surtout peint des paysans aux couleurs sombres.", en: "Before that, he had mostly painted peasants in dark colours.", altEs: ["Avant, il avait surtout peint des paysans aux couleurs sombres.", "Auparavant, il avait surtout peint des paysans dans des couleurs sombres."], altEn: ["Previously, he had mainly painted peasants in dark colours."], grammar: [g.plus-que-parfait], vocab: [w.auparavant, w.peindre] }
      - { es: "Van Gogh a peint les arènes que les Romains avaient construites au premier siècle.", en: "Van Gogh painted the arena that the Romans had built in the first century.", altEs: ["Van Gogh a peint les arènes, que les Romains avaient construites au premier siècle."], altEn: ["Van Gogh painted the amphitheatre the Romans had built in the first century."], grammar: [g.plus-que-parfait, g.pc-object-agreement], vocab: [w.arène, w.romain], error: { wrong: "Van Gogh a peint les arènes que les Romains avaient construit au premier siècle.", explain: "The direct object (que = les arènes, feminine plural) comes before the verb, so the participle agrees: construites.", grammar: g.plus-que-parfait } }
      - { es: "Le tableau que j'avais vu dans un livre était bien plus petit en vrai.", en: "The painting I had seen in a book was much smaller in real life.", altEs: ["Le tableau que j'avais vu dans un livre était beaucoup plus petit en vrai.", "En vrai, le tableau que j'avais vu dans un livre était bien plus petit."], grammar: [g.plus-que-parfait, g.relative-qui-que], vocab: [w.tableau] }
      - { es: "Nous avions réservé une visite, mais le musée était fermé.", en: "We had booked a tour, but the museum was closed.", altEs: ["On avait réservé une visite, mais le musée était fermé."], grammar: [g.plus-que-parfait], vocab: [w.réserver], transform: { instruction: "Change to 'je'", answer: "J'avais réservé une visite, mais le musée était fermé.", en: "I had booked a tour, but the museum was closed." } }
      - { es: "Il était épuisé : il n'avait pas dormi depuis deux jours.", en: "He was exhausted: he hadn't slept for two days.", altEs: ["Il était épuisé, il n'avait pas dormi depuis deux jours.", "Il était très fatigué : il n'avait pas dormi depuis deux jours."], grammar: [g.plus-que-parfait, g.pc-vs-imparfait], vocab: [w.dormir] }
      - { es: "Avais-tu déjà vu un chef-d'œuvre de si près ?", en: "Had you ever seen a masterpiece so close up?", altEs: ["Tu avais déjà vu un chef-d'œuvre de si près ?", "Est-ce que tu avais déjà vu un chef-d'œuvre de si près ?"], grammar: [g.plus-que-parfait, g.inversion-questions], vocab: [w.chef-d-œuvre] }
      - { es: "Quand nous sommes arrivés au café, nos amis étaient déjà partis.", en: "When we got to the café, our friends had already left.", altEs: ["Quand on est arrivés au café, nos amis étaient déjà partis.", "Lorsque nous sommes arrivés au café, nos amis étaient déjà partis."], grammar: [g.plus-que-parfait, g.passe-compose-etre], vocab: [w.partir], error: { wrong: "Quand nous sommes arrivés au café, nos amis avaient déjà partis.", explain: "Partir takes être in every compound tense, including the plus-que-parfait: ils étaient partis.", grammar: g.plus-que-parfait } }
      - { es: "Les gens d'Arles le trouvaient fou ; personne n'avait compris son génie.", en: "The people of Arles thought he was mad; nobody had understood his genius.", altEs: ["Les Arlésiens le trouvaient fou ; personne n'avait compris son génie.", "Les gens d'Arles le croyaient fou ; personne n'avait compris son génie."], grammar: [g.plus-que-parfait, g.indefinite-pronouns], vocab: [w.fou, w.génie] }
      - { es: "Il avait beaucoup souffert avant d'entrer à l'hôpital psychiatrique de Saint-Rémy.", en: "He had suffered a great deal before going into the psychiatric hospital at Saint-Rémy.", altEs: ["Il avait beaucoup souffert avant d'aller à l'hôpital psychiatrique de Saint-Rémy."], grammar: [g.plus-que-parfait, g.apres-avoir-avant-de], vocab: [w.souffrir, w.hôpital-psychiatrique], note: "In May 1889 Van Gogh left Arles for the asylum of Saint-Paul-de-Mausole in Saint-Rémy-de-Provence." }
      - { es: "Il avait acheté ses pinceaux et ses toiles avec l'argent de son frère Théo.", en: "He had bought his brushes and canvases with his brother Theo's money.", altEs: ["Il avait acheté ses toiles et ses pinceaux avec l'argent de son frère Théo."], grammar: [g.plus-que-parfait, g.possessives], vocab: [w.pinceau, w.toile] }
      - { es: "À Paris, il avait découvert les couleurs vives des impressionnistes.", en: "In Paris he had discovered the bright colours of the Impressionists.", altEs: ["Il avait découvert les couleurs vives des impressionnistes à Paris."], grammar: [g.plus-que-parfait], vocab: [w.découvrir, w.couleur] }
      - { es: "On a conservé des centaines de lettres qu'il avait écrites à son frère.", en: "Hundreds of letters he had written to his brother have been preserved.", altEs: ["On a gardé des centaines de lettres qu'il avait écrites à son frère."], altEn: ["Hundreds of the letters he had written to his brother have survived."], grammar: [g.plus-que-parfait, g.pc-object-agreement], vocab: [w.conserver, w.lettre] }
      - { es: "J'ai tout de suite reconnu le café : on l'avait repeint en jaune, comme dans le tableau.", en: "I recognised the café straight away: they had repainted it yellow, like in the painting.", altEs: ["J'ai reconnu le café tout de suite : on l'avait repeint en jaune, comme dans le tableau."], grammar: [g.plus-que-parfait], vocab: [w.reconnaître, w.jaune] }
      - { es: "Les deux années précédentes, à Paris, il avait réalisé plus de deux cents tableaux.", en: "In the two previous years, in Paris, he had produced more than two hundred paintings.", altEs: ["Les deux années précédentes, à Paris, il avait peint plus de deux cents tableaux.", "Pendant les deux années précédentes, à Paris, il avait réalisé plus de deux cents tableaux."], grammar: [g.plus-que-parfait, g.numbers-100-plus], vocab: [w.précédent, w.réaliser] }
    exchanges:
      - q: { es: "Tu étais déjà venu à Arles ?", en: "Had you been to Arles before?" }
        a: { es: "Non, jamais. Mais j'avais vu beaucoup de photos de la ville.", en: "No, never. But I had seen lots of photos of the town." }
        alt: ["Oui, j'étais déjà venu il y a dix ans.", "Non, c'est la première fois."]
        grammar: [g.plus-que-parfait]
        vocab: [w.photo]
      - q: { es: "Pourquoi tu n'es pas venue au musée avec nous ?", en: "Why didn't you come to the museum with us?" }
        a: { es: "Parce que je l'avais déjà visité l'année dernière.", en: "Because I had already visited it last year." }
        alt: ["Je l'avais déjà vu.", "J'avais déjà visité le musée."]
        grammar: [g.plus-que-parfait]
        vocab: [w.musée, w.visiter]
      - q: { es: "Pourquoi Van Gogh est-il venu à Arles ?", en: "Why did Van Gogh come to Arles?" }
        a: { es: "On lui avait parlé de la lumière du Midi, et il cherchait le soleil.", en: "People had told him about the southern light, and he was looking for the sun." }
        alt: ["Il cherchait le soleil et la lumière.", "On lui avait parlé de la lumière du Midi."]
        grammar: [g.plus-que-parfait, g.pc-vs-imparfait]
        vocab: [w.lumière, w.soleil]
      - q: { es: "Le restaurant était bien ?", en: "Was the restaurant good?" }
        a: { es: "On n'a pas pu manger : on n'avait pas réservé et c'était complet.", en: "We couldn't eat: we hadn't booked and it was full." }
        alt: ["Nous n'avions pas réservé, alors c'était complet.", "C'était complet, on n'avait pas réservé."]
        grammar: [g.plus-que-parfait]
        vocab: [w.réserver, w.complet]
      - q: { es: "Tu as aimé les Tournesols ?", en: "Did you like the Sunflowers?" }
        a: { es: "Oui, mais je les avais imaginés plus grands.", en: "Yes, but I had imagined them bigger." }
        alt: ["Oui, c'est un vrai chef-d'œuvre.", "Oui, beaucoup !"]
        grammar: [g.plus-que-parfait, g.pc-object-agreement]
        vocab: [w.tournesol, w.imaginer]
    texts:
      - title: "Carte postale d'Arles"
        es: ["Chers parents, nous voici à Arles !", "Avant de venir, j'avais lu les lettres de Van Gogh à son frère.", "Aujourd'hui, j'ai vu les endroits qu'il avait peints, et c'était magique."]
        en: ["Dear Mum and Dad, here we are in Arles!", "Before coming, I had read Van Gogh's letters to his brother.", "Today I saw the places he had painted, and it was magical."]
        grammar: [g.plus-que-parfait]
        vocab: [w.lettre, w.endroit]
      - title: "Au musée : Les Tournesols"
        es: ["Pendant l'été 1888, Van Gogh a peint plusieurs bouquets de tournesols.", "Il les avait prévus pour décorer la chambre de son ami Gauguin.", "Aujourd'hui, ces toiles sont conservées dans des musées du monde entier."]
        en: ["In the summer of 1888, Van Gogh painted several bunches of sunflowers.", "He had intended them to decorate his friend Gauguin's room.", "Today these canvases are kept in museums all over the world."]
        grammar: [g.plus-que-parfait]
        vocab: [w.tournesol, w.toile, w.conserver]
    spicy:
      - { es: "Je t'avais dit que j'étais fou de toi, mais tu ne m'avais pas cru.", en: "I'd told you I was crazy about you, but you hadn't believed me.", altEs: ["Je t'avais dit que j'étais folle de toi, mais tu ne m'avais pas cru."], grammar: [g.plus-que-parfait], vocab: [w.fou] }
      - { es: "Je n'avais jamais trouvé un musée romantique avant de t'y rencontrer.", en: "I had never found a museum romantic before I met you there.", grammar: [g.plus-que-parfait, g.apres-avoir-avant-de], vocab: [w.musée] }
      - { es: "Tu étais déjà parti quand j'ai enfin trouvé le courage de te sourire.", en: "You had already left when I finally found the courage to smile at you.", altEs: ["Tu étais déjà partie quand j'ai enfin trouvé le courage de te sourire."], grammar: [g.plus-que-parfait], vocab: [w.courage, w.sourire.v] }
      - { es: "Tu avais prévu de visiter les arènes, et finalement tu as passé l'après-midi à me regarder.", en: "You had planned to visit the arena, and in the end you spent the afternoon looking at me.", grammar: [g.plus-que-parfait], vocab: [w.arène] }
      - { es: "Je n'avais pas compris que c'était un rendez-vous : j'avais amené ma mère.", en: "I hadn't understood it was a date: I'd brought my mother.", grammar: [g.plus-que-parfait], vocab: [w.rendez-vous] }
  - id: b1.u07.l2
    title: Après avoir vu les arènes
    teach: [g.apres-avoir-avant-de]
    vocab: [w.après-avoir, w.avant-de, w.visite-guidée, w.appareil-photo, w.appareil, w.photographie, w.photographe, w.reconnaître, w.suivant, w.récent, w.actuel, w.actuellement, w.désormais]
    tip: "Avant de + infinitive (avant de partir); après avoir / après être + participle (après avoir mangé, après être arrivée). Both actions need the same subject."
    sentences:
      - { es: "Après avoir visité les arènes, nous sommes allés voir le théâtre antique.", en: "After visiting the arena, we went to see the Roman theatre.", altEs: ["Après avoir visité les arènes, on est allés voir le théâtre antique."], altEn: ["After we visited the arena, we went to see the Roman theatre."], grammar: [g.apres-avoir-avant-de], vocab: [w.après-avoir, w.arène] }
      - { es: "Avant de partir, vérifie que tu as ton appareil photo.", en: "Before leaving, check you've got your camera.", altEs: ["Avant de partir, vérifie que tu as bien ton appareil photo.", "Vérifie que tu as ton appareil photo avant de partir."], altEn: ["Before you leave, check you have your camera."], grammar: [g.apres-avoir-avant-de, g.imperative], vocab: [w.avant-de, w.appareil-photo], transform: { instruction: "Say it to someone you call vous", answer: "Avant de partir, vérifiez que vous avez votre appareil photo.", alt: ["Avant de partir, vérifiez que vous avez bien votre appareil photo."], en: "Before leaving, check you've got your camera." } }
      - { es: "Après être arrivée à Arles, elle a tout de suite cherché la maison jaune.", en: "After arriving in Arles, she immediately went looking for the Yellow House.", altEs: ["Après être arrivée à Arles, elle a cherché tout de suite la maison jaune."], grammar: [g.apres-avoir-avant-de, g.passe-compose-etre], vocab: [w.après-avoir, w.chercher], error: { wrong: "Après avoir arrivée à Arles, elle a tout de suite cherché la maison jaune.", explain: "Arriver takes être, so the past infinitive is être arrivée (agreeing with elle).", grammar: g.apres-avoir-avant-de } }
      - { es: "Il faut acheter les billets avant d'entrer dans le musée.", en: "You have to buy the tickets before going into the museum.", altEs: ["Il faut acheter ses billets avant d'entrer dans le musée.", "On doit acheter les billets avant d'entrer dans le musée."], grammar: [g.apres-avoir-avant-de, g.il-faut], vocab: [w.avant-de, w.billet], error: { wrong: "Il faut acheter les billets avant entrer dans le musée.", explain: "Before an infinitive, avant needs de: avant d'entrer.", grammar: g.apres-avoir-avant-de } }
      - { es: "Après s'être reposés à l'hôtel, ils sont ressortis pour dîner.", en: "After resting at the hotel, they went out again for dinner.", altEs: ["Après s'être reposés à l'hôtel, ils sont sortis dîner."], grammar: [g.apres-avoir-avant-de, g.pronominal-passe-compose], vocab: [w.se-reposer] }
      - { es: "Réfléchis bien avant de choisir une photo pour l'exposition.", en: "Think carefully before choosing a photo for the exhibition.", altEs: ["Réfléchis bien avant de choisir la photo pour l'exposition."], grammar: [g.apres-avoir-avant-de, g.imperative], vocab: [w.réfléchir, w.exposition] }
      - { es: "Après avoir pris des centaines de photos, le photographe n'en a gardé que trois.", en: "After taking hundreds of photos, the photographer kept only three.", altEs: ["Après avoir fait des centaines de photos, le photographe n'en a gardé que trois."], grammar: [g.apres-avoir-avant-de, g.en-quantities], vocab: [w.photographe, w.garder] }
      - { es: "Depuis 1970, les Rencontres d'Arles présentent chaque été des photographes du monde entier.", en: "Since 1970 the Rencontres d'Arles have presented photographers from all over the world every summer.", altEs: ["Chaque été depuis 1970, les Rencontres d'Arles présentent des photographes du monde entier."], grammar: [g.depuis-present], vocab: [w.photographe, w.présenter], note: "Les Rencontres d'Arles is one of the world's best-known photography festivals." }
      - { es: "Je préfère regarder les tableaux avant de lire les explications.", en: "I prefer to look at the paintings before reading the explanations.", altEs: ["Je préfère regarder les tableaux avant de lire l'explication."], grammar: [g.apres-avoir-avant-de, g.aimer-preferer], vocab: [w.explication, w.préférer] }
      - { es: "Après avoir vu l'exposition, tu reconnaîtras tous les endroits de ses tableaux.", en: "After seeing the exhibition, you'll recognise all the places in his paintings.", altEs: ["Après avoir vu l'exposition, tu vas reconnaître tous les endroits de ses tableaux."], grammar: [g.apres-avoir-avant-de, g.futur-irregular-stems], vocab: [w.reconnaître, w.endroit] }
      - { es: "Actuellement, le musée présente des photos récentes à côté des tableaux anciens.", en: "At the moment the museum is showing recent photos next to the old paintings.", altEs: ["En ce moment, le musée présente des photos récentes à côté des tableaux anciens."], grammar: [g.adjective-agreement], vocab: [w.actuellement, w.récent] }
      - { es: "Désormais, je ne partirai plus jamais en voyage sans mon appareil.", en: "From now on, I'll never go travelling without my camera again.", altEs: ["Désormais, je ne partirai plus en voyage sans mon appareil.", "À partir de maintenant, je ne partirai plus jamais en voyage sans mon appareil."], grammar: [g.negation-jamais-plus-rien, g.futur-simple-forms], vocab: [w.désormais, w.appareil] }
      - { es: "La visite guidée suivante commence à quinze heures : prenez un café avant d'y aller.", en: "The next guided tour starts at three: have a coffee before going.", altEs: ["La prochaine visite guidée commence à quinze heures : prenez un café avant d'y aller."], grammar: [g.apres-avoir-avant-de, g.pronoun-y], vocab: [w.visite-guidée, w.suivant] }
      - { es: "Tu as éteint ton téléphone avant d'entrer ?", en: "Did you turn your phone off before going in?", altEs: ["Est-ce que tu as éteint ton téléphone avant d'entrer ?", "As-tu éteint ton téléphone avant d'entrer ?"], grammar: [g.apres-avoir-avant-de], vocab: [w.éteindre, w.téléphone] }
      - { es: "Nous avons pris un café, puis nous avons visité le musée.", en: "We had a coffee, then we visited the museum.", altEs: ["On a pris un café, puis on a visité le musée."], grammar: [g.apres-avoir-avant-de, g.narrative-connectors], vocab: [w.café], transform: { instruction: "Link the two actions with après avoir", answer: "Après avoir pris un café, nous avons visité le musée.", alt: ["Après avoir pris un café, on a visité le musée."], en: "After having a coffee, we visited the museum." } }
      - { es: "Elle est rentrée à l'hôtel et elle a regardé ses photos.", en: "She went back to the hotel and looked at her photos.", altEs: ["Elle est rentrée à l'hôtel, puis elle a regardé ses photos."], grammar: [g.apres-avoir-avant-de, g.passe-compose-etre], vocab: [w.photo], transform: { instruction: "Link the two actions with après être", answer: "Après être rentrée à l'hôtel, elle a regardé ses photos.", en: "After going back to the hotel, she looked at her photos." } }
    exchanges:
      - q: { es: "On mange avant ou après la visite ?", en: "Shall we eat before or after the visit?" }
        a: { es: "Après : je préfère manger après avoir tout vu.", en: "After: I'd rather eat after seeing everything." }
        alt: ["Avant, j'ai trop faim !", "Après la visite."]
        grammar: [g.apres-avoir-avant-de]
        vocab: [w.après-avoir, w.visite]
      - q: { es: "Qu'est-ce que tu as fait après avoir quitté le musée ?", en: "What did you do after leaving the museum?" }
        a: { es: "Je me suis promené au bord du Rhône avant de rentrer.", en: "I went for a walk along the Rhône before going home." }
        alt: ["Je me suis promenée au bord du Rhône avant de rentrer.", "Je suis allé boire un verre avant de rentrer."]
        grammar: [g.apres-avoir-avant-de, g.pronominal-passe-compose]
        vocab: [w.quitter, w.se-promener]
      - q: { es: "Je peux prendre une photo ?", en: "Can I take a photo?" }
        a: { es: "Oui, mais demandez toujours avant de photographier les gens.", en: "Yes, but always ask before photographing people." }
        alt: ["Oui, mais sans flash.", "Oui, bien sûr."]
        grammar: [g.apres-avoir-avant-de, g.imperative]
        vocab: [w.avant-de, w.photo]
      - q: { es: "Tu as acheté ton nouvel appareil photo ?", en: "Have you bought your new camera?" }
        a: { es: "Pas encore : je veux lire des avis avant de choisir.", en: "Not yet: I want to read some reviews before choosing." }
        alt: ["Pas encore.", "Oui, je l'ai acheté hier."]
        grammar: [g.apres-avoir-avant-de]
        vocab: [w.appareil-photo, w.avis]
      - q: { es: "Quand est-ce que tu t'es intéressée à la photographie ?", en: "When did you get interested in photography?" }
        a: { es: "Après être venue aux Rencontres d'Arles, il y a cinq ans.", en: "After coming to the Rencontres d'Arles, five years ago." }
        alt: ["Il y a cinq ans, après être venue à Arles.", "Quand j'étais petite."]
        grammar: [g.apres-avoir-avant-de]
        vocab: [w.photographie, w.s-intéresser]
    texts:
      - title: "Programme de la journée"
        es: ["Le matin, visite guidée des arènes.", "Après avoir vu le théâtre antique, déjeuner libre.", "L'après-midi, exposition de photographie, avant de finir la journée au café."]
        en: ["In the morning, guided tour of the arena.", "After seeing the Roman theatre, lunch on your own.", "In the afternoon, a photography exhibition, before ending the day at the café."]
        grammar: [g.apres-avoir-avant-de]
        vocab: [w.visite-guidée, w.photographie]
      - title: "Message de Léa"
        es: ["Je suis arrivée !", "Après avoir posé mes valises, je vais faire un tour au marché.", "On se retrouve devant les arènes avant d'aller dîner ?"]
        en: ["I've arrived!", "After dropping off my suitcases, I'm going to have a look round the market.", "Shall we meet in front of the arena before going for dinner?"]
        grammar: [g.apres-avoir-avant-de]
        vocab: [w.valise, w.marché]
    spicy:
      - { es: "Après avoir vu ton sourire, j'ai oublié le nom de tous les peintres.", en: "After seeing your smile, I forgot the names of all the painters.", grammar: [g.apres-avoir-avant-de], vocab: [w.après-avoir, w.sourire] }
      - { es: "Réfléchis bien avant de dire non : je cuisine très bien.", en: "Think carefully before saying no: I'm a very good cook.", altEs: ["Réfléchis bien avant de me dire non : je cuisine très bien."], grammar: [g.apres-avoir-avant-de, g.imperative], vocab: [w.avant-de, w.réfléchir] }
      - { es: "Après être tombée amoureuse de cette ville, je suis tombée amoureuse de son guide.", en: "After falling in love with this town, I fell in love with its tour guide.", altEs: ["Après être tombé amoureux de cette ville, je suis tombé amoureux de sa guide."], grammar: [g.apres-avoir-avant-de, g.passe-compose-etre], vocab: [w.tomber-amoureux] }
      - { es: "Prends une photo de nous deux avant de partir… pour le souvenir.", en: "Take a photo of the two of us before you leave… as a keepsake.", grammar: [g.apres-avoir-avant-de, g.imperative], vocab: [w.photo, w.souvenir] }
      - { es: "Il m'a embrassée après m'avoir demandé la permission. Très bien élevé !", en: "He kissed me after asking my permission. Very well brought up!", altEs: ["Elle m'a embrassé après m'avoir demandé la permission. Très bien élevée !"], grammar: [g.apres-avoir-avant-de, g.pc-object-agreement], vocab: [w.embrasser] }
  - id: b1.u07.l3
    title: Dès qu'il a vu la lumière
    teach: [g.time-clauses]
    vocab: [w.une-fois-que, w.au-moment-où, w.aussitôt, w.jusqu-à-ce-que, w.tandis-que, w.rater, w.manquer, w.se-rendre-compte, w.s-apercevoir, w.remarquer, w.rejoindre]
    tip: "Quand / lorsque (when), dès que / aussitôt que (as soon as), pendant que (while), tandis que (whereas), depuis que (since): all take the indicative. Only jusqu'à ce que (until) takes the subjonctif."
    sentences:
      - { es: "Lorsque Gauguin est arrivé à Arles, Van Gogh avait préparé sa chambre.", en: "When Gauguin arrived in Arles, Van Gogh had got his room ready.", altEs: ["Quand Gauguin est arrivé à Arles, Van Gogh avait préparé sa chambre."], grammar: [g.time-clauses, g.plus-que-parfait], vocab: [w.préparer, w.chambre] }
      - { es: "Dès que Van Gogh a vu la lumière de Provence, il a voulu la peindre.", en: "As soon as Van Gogh saw the light of Provence, he wanted to paint it.", altEs: ["Dès que Van Gogh a découvert la lumière de Provence, il a voulu la peindre."], grammar: [g.time-clauses, g.direct-object-pronouns], vocab: [w.lumière, w.peindre], transform: { instruction: "Replace dès que with aussitôt que", answer: "Aussitôt que Van Gogh a vu la lumière de Provence, il a voulu la peindre.", en: "As soon as Van Gogh saw the light of Provence, he wanted to paint it." } }
      - { es: "Van Gogh aimait peindre dehors, tandis que Gauguin préférait travailler de mémoire.", en: "Van Gogh liked painting outdoors, whereas Gauguin preferred to work from memory.", altEs: ["Van Gogh aimait peindre dehors, alors que Gauguin préférait travailler de mémoire."], grammar: [g.time-clauses, g.connectors-opposition], vocab: [w.tandis-que, w.mémoire] }
      - { es: "Pendant que tu visites le musée, je vais faire des courses au marché.", en: "While you visit the museum, I'll do some shopping at the market.", altEs: ["Pendant que tu visites le musée, je fais des courses au marché.", "Je vais faire des courses au marché pendant que tu visites le musée."], grammar: [g.time-clauses], vocab: [w.faire-les-courses, w.marché], error: { wrong: "Pendant tu visites le musée, je vais faire des courses au marché.", explain: "Pendant goes with a noun (pendant la visite); before a clause you need pendant que.", grammar: g.time-clauses } }
      - { es: "Depuis qu'elle habite à Arles, elle peint tous les jours.", en: "Since she's been living in Arles, she paints every day.", altEs: ["Depuis qu'elle vit à Arles, elle peint tous les jours."], altEn: ["Ever since she moved to Arles, she's painted every day."], grammar: [g.time-clauses, g.depuis-present], vocab: [w.habiter, w.peindre], transform: { instruction: "Change to 'nous'", answer: "Depuis que nous habitons à Arles, nous peignons tous les jours.", alt: ["Depuis que nous vivons à Arles, nous peignons tous les jours."], en: "Since we've been living in Arles, we paint every day." } }
      - { es: "Au moment où nous sommes sortis du musée, il a commencé à pleuvoir.", en: "Just as we came out of the museum, it started to rain.", altEs: ["Au moment où on est sortis du musée, il a commencé à pleuvoir.", "Juste au moment où nous sommes sortis du musée, il a commencé à pleuvoir."], grammar: [g.time-clauses], vocab: [w.au-moment-où, w.pleuvoir] }
      - { es: "Une fois qu'on a payé l'entrée, on peut rester toute la journée.", en: "Once you've paid to get in, you can stay all day.", altEs: ["Une fois l'entrée payée, on peut rester toute la journée."], grammar: [g.time-clauses], vocab: [w.une-fois-que, w.entrée] }
      - { es: "Je me suis rendu compte que j'avais oublié mon billet quand le contrôleur est arrivé.", en: "I realised I had forgotten my ticket when the inspector came along.", altEs: ["Je me suis rendu compte que j'avais oublié mon billet lorsque le contrôleur est arrivé.", "Je me suis aperçu que j'avais oublié mon billet quand le contrôleur est arrivé."], grammar: [g.time-clauses, g.plus-que-parfait], vocab: [w.se-rendre-compte, w.billet] }
      - { es: "Attends-moi ici jusqu'à ce que je revienne.", en: "Wait for me here until I come back.", altEs: ["Attends ici jusqu'à ce que je revienne."], grammar: [g.time-clauses, g.subjonctif-irregular], vocab: [w.jusqu-à-ce-que, w.attendre], note: "jusqu'à ce que is the one common time conjunction that takes the subjonctif." }
      - { es: "Dès que tu arriveras à la gare, appelle-moi.", en: "As soon as you get to the station, call me.", altEs: ["Aussitôt que tu arriveras à la gare, appelle-moi.", "Appelle-moi dès que tu arriveras à la gare."], grammar: [g.time-clauses, g.quand-futur], vocab: [w.gare, w.appeler] }
      - { es: "Quand j'ai remarqué l'heure, le dernier bus était déjà parti.", en: "When I noticed the time, the last bus had already gone.", altEs: ["Lorsque j'ai remarqué l'heure, le dernier bus était déjà parti."], grammar: [g.time-clauses, g.plus-que-parfait], vocab: [w.remarquer, w.bus] }
      - { es: "On a raté le début du spectacle parce que le train avait du retard.", en: "We missed the start of the show because the train was late.", altEs: ["Nous avons raté le début du spectacle parce que le train avait du retard.", "On a manqué le début du spectacle parce que le train avait du retard."], grammar: [g.pc-vs-imparfait], vocab: [w.rater, w.retard] }
      - { es: "Aussitôt arrivé, il a écrit à son frère.", en: "As soon as he arrived, he wrote to his brother.", altEs: ["Dès qu'il est arrivé, il a écrit à son frère.", "Aussitôt qu'il est arrivé, il a écrit à son frère."], grammar: [g.time-clauses], vocab: [w.aussitôt, w.écrire] }
      - { es: "Ma famille me manque depuis que je vis ici.", en: "I've missed my family since I've been living here.", altEs: ["Ma famille me manque depuis que j'habite ici."], grammar: [g.time-clauses, g.verbs-prepositions], vocab: [w.manquer, w.famille], note: "Manquer works backwards: ma famille me manque = I miss my family.", transform: { instruction: "Say 'my friends' instead of 'my family'", answer: "Mes amis me manquent depuis que je vis ici.", alt: ["Mes amis me manquent depuis que j'habite ici."], en: "I've missed my friends since I've been living here." } }
      - { es: "Tu t'es aperçu de l'heure ? Le musée ferme dans cinq minutes !", en: "Have you noticed the time? The museum closes in five minutes!", altEs: ["Tu as vu l'heure ? Le musée ferme dans cinq minutes !", "Tu t'es aperçue de l'heure ? Le musée ferme dans cinq minutes !"], grammar: [g.pronominal-passe-compose], vocab: [w.s-apercevoir, w.fermer] }
    exchanges:
      - q: { es: "Tu m'appelles quand tu arrives ?", en: "Will you call me when you get there?" }
        a: { es: "Oui, je t'appelle dès que j'arrive à l'hôtel.", en: "Yes, I'll call you as soon as I get to the hotel." }
        alt: ["Promis, dès que j'arrive.", "Oui, dès que je serai à l'hôtel."]
        grammar: [g.time-clauses]
        vocab: [w.appeler, w.hôtel]
      - q: { es: "Qu'est-ce que tu fais pendant que je visite le musée ?", en: "What will you do while I visit the museum?" }
        a: { es: "Je t'attends au café jusqu'à ce que tu sortes.", en: "I'll wait for you at the café until you come out." }
        alt: ["Je vais au marché.", "Je fais un tour au bord du Rhône."]
        grammar: [g.time-clauses]
        vocab: [w.jusqu-à-ce-que, w.attendre]
      - q: { es: "Depuis quand tu fais de la photo ?", en: "How long have you been doing photography?" }
        a: { es: "Depuis que j'ai reçu un appareil pour mes vingt ans.", en: "Since I got a camera for my twentieth birthday." }
        alt: ["Depuis deux ans.", "Depuis que je suis petite."]
        grammar: [g.time-clauses, g.depuis-present]
        vocab: [w.appareil, w.recevoir]
      - q: { es: "Tu as vu le coucher de soleil sur le Rhône ?", en: "Did you see the sunset over the Rhône?" }
        a: { es: "Non, je l'ai raté : au moment où je suis arrivé, il faisait déjà nuit.", en: "No, I missed it: by the time I got there, it was already dark." }
        alt: ["Oui, c'était magnifique.", "Non, je l'ai manqué."]
        grammar: [g.time-clauses, g.pc-vs-imparfait]
        vocab: [w.rater, w.au-moment-où]
      - q: { es: "Ta ville ne te manque pas ?", en: "Don't you miss your town?" }
        a: { es: "Si, un peu, surtout quand je vois mes amis sur les photos.", en: "Yes, a little, especially when I see my friends in photos." }
        alt: ["Si, beaucoup.", "Non, pas vraiment."]
        grammar: [g.verbs-prepositions, g.time-clauses]
        vocab: [w.manquer, w.ville]
    texts:
      - title: "Une amitié difficile"
        es: ["En octobre 1888, Gauguin rejoint Van Gogh dans la maison jaune.", "Pendant quelques semaines, les deux peintres travaillent ensemble.", "Mais Van Gogh peint très vite, tandis que Gauguin prend son temps.", "En décembre, après une violente dispute, Gauguin quitte Arles."]
        en: ["In October 1888, Gauguin joins Van Gogh in the Yellow House.", "For a few weeks, the two painters work together.", "But Van Gogh paints very fast, whereas Gauguin takes his time.", "In December, after a violent quarrel, Gauguin leaves Arles."]
        grammar: [g.time-clauses]
        vocab: [w.tandis-que, w.peintre]
      - title: "Texto"
        es: ["Je suis à la gare et le train a du retard.", "Attends-moi au café jusqu'à ce que j'arrive.", "Dès que je sors, je t'appelle."]
        en: ["I'm at the station and the train is late.", "Wait for me at the café until I get there.", "As soon as I get out, I'll call you."]
        grammar: [g.time-clauses]
        vocab: [w.jusqu-à-ce-que, w.retard]
    spicy:
      - { es: "Dès que je t'ai vu, j'ai oublié pourquoi j'étais venue au musée.", en: "As soon as I saw you, I forgot why I'd come to the museum.", altEs: ["Dès que je t'ai vue, j'ai oublié pourquoi j'étais venu au musée."], grammar: [g.time-clauses, g.plus-que-parfait], vocab: [w.oublier] }
      - { es: "Tu me manques dès que tu quittes la pièce. C'est grave, docteur ?", en: "I miss you as soon as you leave the room. Is it serious, doctor?", grammar: [g.time-clauses, g.verbs-prepositions], vocab: [w.manquer, w.pièce] }
      - { es: "Pendant que tu regardais les tableaux, moi, je te regardais.", en: "While you were looking at the paintings, I was looking at you.", grammar: [g.time-clauses, g.imparfait-uses], vocab: [w.regarder, w.tableau] }
      - { es: "Je reste sur cette terrasse jusqu'à ce que le café ferme… ou jusqu'à ce que tu viennes.", en: "I'm staying on this terrace until the café closes… or until you come over.", grammar: [g.time-clauses, g.subjonctif-irregular], vocab: [w.jusqu-à-ce-que, w.terrasse] }
      - { es: "Au moment où tu as souri, j'ai raté mon arrêt de bus.", en: "The moment you smiled, I missed my bus stop.", grammar: [g.time-clauses], vocab: [w.au-moment-où, w.rater] }
  - id: b1.u07.l4
    title: Un malentendu
    teach: [g.plus-que-parfait, g.apres-avoir-avant-de]
    vocab: [w.malentendu, w.s-excuser, w.excuse, w.pardonner, w.faire-exprès, w.exprès, w.par-hasard, w.hasard, w.coïncidence, w.explication, w.quiproquo, w.vexé, w.blesser, w.erreur, w.responsable, w.coupable, w.innocent]
    tip: "To explain a mix-up, the plus-que-parfait says what you had thought or done before: j'avais cru que…, je m'étais trompé de jour."
    sentences:
      - { es: "Excuse-moi, je n'avais pas compris que tu m'attendais.", en: "Sorry, I hadn't realised you were waiting for me.", altEs: ["Pardon, je n'avais pas compris que tu m'attendais.", "Excuse-moi, je n'avais pas compris que tu m'attendais là."], altEn: ["Sorry, I hadn't understood you were waiting for me."], grammar: [g.plus-que-parfait], vocab: [w.excusez-moi, w.comprendre], transform: { instruction: "Say it politely to a stranger (vous)", answer: "Excusez-moi, je n'avais pas compris que vous m'attendiez.", alt: ["Pardon, je n'avais pas compris que vous m'attendiez."], en: "Excuse me, I hadn't realised you were waiting for me." } }
      - { es: "Pardon, je ne l'ai pas fait exprès : je croyais que c'était mon verre.", en: "Sorry, I didn't do it on purpose: I thought it was my glass.", altEs: ["Désolé, je ne l'ai pas fait exprès : je croyais que c'était mon verre.", "Pardon, je ne l'ai pas fait exprès, je pensais que c'était mon verre."], grammar: [g.pc-vs-imparfait], vocab: [w.faire-exprès, w.verre] }
      - { es: "Il s'est excusé d'être arrivé en retard.", en: "He apologised for arriving late.", altEs: ["Il s'est excusé d'être venu en retard."], altEn: ["He apologised for being late."], grammar: [g.apres-avoir-avant-de, g.reporting-verbs], vocab: [w.s-excuser, w.en-retard], note: "s'excuser de + past infinitive (avoir / être + participle) for something already done." }
      - { es: "C'était un malentendu : elle avait cru que le rendez-vous était devant les arènes.", en: "It was a misunderstanding: she had thought the meeting point was in front of the arena.", altEs: ["C'était un malentendu, elle avait cru que le rendez-vous était devant les arènes."], grammar: [g.plus-que-parfait], vocab: [w.malentendu, w.rendez-vous] }
      - { es: "Je suis vexé parce que tu avais promis de venir.", en: "I'm hurt because you had promised to come.", altEs: ["Je suis vexée parce que tu avais promis de venir.", "Je suis vexé, car tu avais promis de venir."], grammar: [g.plus-que-parfait], vocab: [w.vexé, w.promettre], transform: { instruction: "Change to 'nous'", answer: "Nous sommes vexés parce que tu avais promis de venir.", alt: ["Nous sommes vexées parce que tu avais promis de venir.", "On est vexés parce que tu avais promis de venir."], en: "We're hurt because you had promised to come." } }
      - { es: "Ce que tu m'as dit hier m'a blessé.", en: "What you said to me yesterday hurt me.", altEs: ["Ce que tu m'as dit hier m'a blessée."], grammar: [g.ce-qui-ce-que], vocab: [w.blesser] }
      - { es: "On s'est retrouvés par hasard dans le même hôtel. Quelle coïncidence !", en: "We ran into each other by chance in the same hotel. What a coincidence!", altEs: ["Nous nous sommes retrouvés par hasard dans le même hôtel. Quelle coïncidence !"], grammar: [g.pronominal-passe-compose], vocab: [w.par-hasard, w.coïncidence] }
      - { es: "Après avoir entendu son explication, je lui ai pardonné.", en: "After hearing his explanation, I forgave him.", altEs: ["Après avoir écouté son explication, je lui ai pardonné."], altEn: ["After hearing her explanation, I forgave her."], grammar: [g.apres-avoir-avant-de, g.indirect-object-pronouns], vocab: [w.explication, w.pardonner] }
      - { es: "Ce n'est pas ta faute, c'est moi qui m'étais trompé de date.", en: "It's not your fault, I'm the one who'd got the date wrong.", altEs: ["Ce n'est pas ta faute, c'est moi qui m'étais trompée de date.", "Ce n'est pas de ta faute, c'est moi qui m'étais trompé de date."], grammar: [g.plus-que-parfait, g.pronominal-verbs], vocab: [w.faute, w.se-tromper], error: { wrong: "Ce n'est pas ta faute, c'est moi qui s'était trompé de date.", explain: "After c'est moi qui, the verb agrees with moi: je m'étais trompé.", grammar: g.plus-que-parfait } }
      - { es: "Le serveur s'était trompé de table : voilà l'origine du quiproquo.", en: "The waiter had gone to the wrong table: that's where the mix-up came from.", altEs: ["Le serveur s'était trompé de table, c'est l'origine du quiproquo."], grammar: [g.plus-que-parfait, g.pronominal-verbs], vocab: [w.quiproquo, w.serveur] }
      - { es: "Qui est responsable de cette erreur ?", en: "Who is responsible for this mistake?", altEs: ["Qui est le responsable de cette erreur ?"], grammar: [g.question-words], vocab: [w.responsable, w.erreur] }
      - { es: "Le chat a l'air innocent, mais c'est lui le coupable : il avait mangé le fromage.", en: "The cat looks innocent, but he's the culprit: he had eaten the cheese.", altEs: ["Le chat a l'air innocent, mais c'est lui, le coupable : il avait mangé le fromage."], grammar: [g.plus-que-parfait, g.stressed-pronouns], vocab: [w.innocent, w.coupable] }
      - { es: "Avant de te fâcher, écoute mon explication.", en: "Before you get angry, listen to my explanation.", altEs: ["Avant de te mettre en colère, écoute mon explication.", "Écoute mon explication avant de te fâcher."], grammar: [g.apres-avoir-avant-de, g.imperative], vocab: [w.avant-de, w.explication] }
      - { es: "Je te présente mes excuses : j'avais complètement oublié ton anniversaire.", en: "Please accept my apologies: I had completely forgotten your birthday.", altEs: ["Je te fais mes excuses : j'avais complètement oublié ton anniversaire."], altEn: ["I apologise: I had completely forgotten your birthday."], grammar: [g.plus-que-parfait], vocab: [w.excuse, w.anniversaire] }
      - { es: "Je ne savais pas que tu avais déjà réservé une table ; j'en avais réservé une autre.", en: "I didn't know you had already booked a table; I'd booked another one.", altEs: ["Je ne savais pas que tu avais déjà réservé une table, j'en avais réservé une autre."], grammar: [g.plus-que-parfait, g.pronoun-en], vocab: [w.réserver] }
      - { es: "Ce n'était pas un hasard : il avait tout organisé.", en: "It wasn't chance: he had organised everything.", altEs: ["Ce n'était pas le hasard : il avait tout organisé."], grammar: [g.plus-que-parfait], vocab: [w.hasard, w.organiser] }
    exchanges:
      - q: { es: "Pourquoi tu n'es pas venu hier soir ?", en: "Why didn't you come last night?" }
        a: { es: "Je suis désolé, j'avais compris que c'était ce soir !", en: "I'm so sorry, I'd understood it was tonight!" }
        alt: ["Pardon, je m'étais trompé de jour.", "Désolé, j'avais complètement oublié."]
        grammar: [g.plus-que-parfait]
        vocab: [w.comprendre]
      - q: { es: "Tu l'as fait exprès ?", en: "Did you do it on purpose?" }
        a: { es: "Mais non, pas du tout ! C'était un accident.", en: "No, not at all! It was an accident." }
        alt: ["Non, je te le jure.", "Pas du tout !"]
        grammar: [g.negation-ne-pas]
        vocab: [w.faire-exprès, w.accident]
      - q: { es: "Tu es encore vexée ?", en: "Are you still upset?" }
        a: { es: "Un peu, mais j'accepte tes excuses.", en: "A little, but I accept your apology." }
        alt: ["Non, c'est oublié.", "Plus maintenant."]
        grammar: [g.adjective-agreement]
        vocab: [w.vexé, w.excuse]
      - q: { es: "Excusez-moi, c'est ma place, je crois.", en: "Excuse me, I think that's my seat." }
        a: { es: "Oh, pardon ! J'avais lu le mauvais numéro.", en: "Oh, sorry! I'd read the wrong number." }
        alt: ["Pardon, je me suis trompé.", "Désolée, je n'avais pas vu."]
        grammar: [g.plus-que-parfait]
        vocab: [w.place, w.numéro]
      - q: { es: "Comment vous vous êtes rencontrés ?", en: "How did you meet?" }
        a: { es: "Par hasard : on avait réservé la même table dans le même restaurant !", en: "By chance: we'd booked the same table in the same restaurant!" }
        alt: ["Par hasard, à Arles.", "Grâce à un malentendu !"]
        grammar: [g.plus-que-parfait]
        vocab: [w.par-hasard, w.réserver]
    texts:
      - title: "Message d'excuses"
        es: ["Salut Hugo, je suis vraiment désolée pour hier soir.", "J'avais noté le mauvais jour dans mon agenda.", "Je ne l'ai pas fait exprès : laisse-moi t'inviter samedi pour me faire pardonner."]
        en: ["Hi Hugo, I'm really sorry about last night.", "I had written down the wrong day in my diary.", "I didn't do it on purpose: let me take you out on Saturday to make up for it."]
        grammar: [g.plus-que-parfait]
        vocab: [w.faire-exprès, w.pardonner]
      - title: "Le quiproquo"
        es: ["Paul attendait Julie devant les arènes.", "Julie, elle, l'attendait au café, car elle avait mal compris son message.", "Au bout d'une heure, ils se sont enfin appelés et ils ont beaucoup ri."]
        en: ["Paul was waiting for Julie in front of the arena.", "Julie, for her part, was waiting for him at the café, because she had misunderstood his message.", "After an hour, they finally called each other and laughed a lot."]
        grammar: [g.plus-que-parfait, g.pc-vs-imparfait]
        vocab: [w.quiproquo, w.message]
    spicy:
      - { es: "Pardon, je ne l'ai pas fait exprès… enfin si, un peu.", en: "Sorry, I didn't do it on purpose… well, actually, a little.", grammar: [g.negation-ne-pas], vocab: [w.faire-exprès] }
      - { es: "Ce n'était pas un hasard : j'avais demandé au serveur de nous placer côte à côte.", en: "It wasn't chance: I had asked the waiter to seat us side by side.", grammar: [g.plus-que-parfait], vocab: [w.hasard, w.serveur] }
      - { es: "Je plaide coupable : c'est moi qui avais mangé ton dessert.", en: "I plead guilty: I'm the one who had eaten your dessert.", grammar: [g.plus-que-parfait], vocab: [w.coupable, w.dessert] }
      - { es: "Tu es vexé ? Laisse-moi me faire pardonner autour d'un dîner.", en: "Are you upset? Let me make it up to you over dinner.", altEs: ["Tu es vexée ? Laisse-moi me faire pardonner autour d'un dîner."], grammar: [g.imperative], vocab: [w.vexé, w.pardonner] }
      - { es: "Innocent, moi ? Je t'avais seulement proposé de regarder les étoiles… depuis mon balcon.", en: "Me, innocent? I'd only suggested looking at the stars… from my balcony.", altEs: ["Innocente, moi ? Je t'avais seulement proposé de regarder les étoiles… depuis mon balcon."], grammar: [g.plus-que-parfait], vocab: [w.innocent, w.étoile] }
dialogues:
  - id: b1.u07.d1
    title: Rendez-vous manqué place du Forum
    context: Chloé has been waiting for Malik at the café on the place du Forum, the one Van Gogh painted. Malik finally turns up, convinced he was in the right place.
    lines:
      - { speaker: Chloé, es: "Enfin ! Ça fait une heure que je t'attends !", en: "At last! I've been waiting for you for an hour!" }
