    model: { es: "Monsieur le Maire, je vous écris pour vous donner mon avis sur le carnaval de Nice. Je pense que c'est une fête magnifique, car elle attire des milliers de visiteurs. Cependant, je ne crois pas que les habitants sachent toujours quand les rues sont fermées. Par conséquent, la circulation devient très difficile. Je vous propose donc de mettre un plan des rues fermées sur le site de la mairie. Je vous remercie de votre attention.", en: "Dear Mr Mayor, I am writing to give you my opinion about the Nice carnival. I think it is a magnificent festival, because it attracts thousands of visitors. However, I don't believe residents always know when streets are closed. As a result, traffic becomes very difficult. I therefore suggest putting a map of the closed streets on the town hall website. Thank you for your attention." }
