id: a1.u10
title: 坐港鐵、問路
lessons:
  - id: a1.u10.l1
    title: 你去邊度呀？
    teach: [g.heoi-lai]
    vocab: [w.heoi3, w.lai4, w.faan1, w.dou3.b, w.gwo3, w.faan1-lai4, w.jap6-heoi3, w.ceot1-heoi3, w.jap6-lai4, w.zau6-lai4, w.haang4, w.wan2, w.gin3-dou2, w.jau4-haak3, w.hoi2, w.hoi2-bin1, w.saan1.b, w.saan1-deng2, w.gung1-jyun2, w.ji1-jyun2, w.sai2-sau2-gaan1, w.ci3-so2, w.zim1-saa1-zeoi2, w.wong6-gok3, w.gam1-zung1, w.bak1-gok3, w.gin1-nei4-dei6-sing4, w.zak1-jyu4-cung1, w.paau2-maa5-dei2, w.cek3-cyu5, w.hoeng1-gong2-zai2, w.wai4-do1-lei6-aa3-gong2, w.wai4-gong2, w.taai3-ping4-saan1, w.hoi2-joeng4-gung1-jyun2]
    tip: "去 is \"go\" (away from here), 嚟 is \"come\" (towards here), 返 is \"go back\" to home, work or school. None of them needs a word for \"to\"."
    sentences:
      - { es: "你去邊度呀？", en: "Where are you going?", altEs: ["你去邊度？", "去邊度呀？", "你去邊呀？"], grammar: [g.heoi-lai, g.question-words], vocab: [w.heoi3] }
      - { es: "我去香港仔。", en: "I'm going to Aberdeen.", altEs: ["我去香港仔呀。"], grammar: [g.heoi-lai], vocab: [w.heoi3, w.hoeng1-gong2-zai2], transform: { instruction: "Say you're going home instead (use 返)", answer: "我返屋企。", alt: ["我返屋企呀。"], en: "I'm going home." } }
      - { es: "我哋聽日去海洋公園。", en: "We're going to Ocean Park tomorrow.", altEs: ["聽日我哋去海洋公園。"], grammar: [g.heoi-lai, g.time-before-verb], vocab: [w.hoi2-joeng4-gung1-jyun2], transform: { instruction: "Ask your friend when they are going to Ocean Park", answer: "你幾時去海洋公園呀？", alt: ["你幾時去海洋公園？"], en: "When are you going to Ocean Park?" } }
      - { es: "嚟呢度啦！", en: "Come here!", altEs: ["過嚟啦！", "嚟呢度呀！"], grammar: [g.heoi-lai, g.particles-aa-laa], vocab: [w.lai4] }
      - { es: "我要返工喇。", en: "I have to go to work now.", altEs: ["我要返工啦。", "我要返工喇，拜拜。"], grammar: [g.heoi-lai], vocab: [w.faan1] }
      - { es: "你嚟我屋企食飯啦。", en: "Come to my place for dinner.", altEs: ["嚟我屋企食飯啦。"], grammar: [g.heoi-lai, g.serial-verbs], vocab: [w.lai4], transform: { instruction: "Say you'll go to his place instead", answer: "我去你屋企食飯啦。", en: "I'll come to your place for dinner." } }
      - { es: "我聽日去你屋企。", en: "I'll come to your place tomorrow.", altEs: ["聽日我去你屋企。"], grammar: [g.heoi-lai], vocab: [w.heoi3], error: { wrong: "我聽日嚟你屋企。", explain: "嚟 means coming to where the speaker is; going to someone else's place is 去.", grammar: g.heoi-lai } }
      - { es: "我哋去金鐘。", en: "We're going to Admiralty.", altEs: ["我哋去金鐘呀。"], grammar: [g.heoi-lai], vocab: [w.gam1-zung1], error: { wrong: "我哋去到金鐘。", explain: "去 takes the place directly; 去到 means \"have reached\".", grammar: g.heoi-lai } }
      - { es: "我入去睇吓。", en: "I'll go in and have a look.", altEs: ["我入去睇一睇。"], grammar: [g.heoi-lai, g.serial-verbs], vocab: [w.jap6-heoi3] }
      - { es: "我哋出去行吓啦！", en: "Let's go out for a walk!", altEs: ["出去行吓啦！"], grammar: [g.heoi-lai, g.particles-aa-laa], vocab: [w.ceot1-heoi3, w.haang4] }
      - { es: "唔好意思，我搵洗手間。", en: "Excuse me, I'm looking for the toilet.", altEs: ["唔好意思，我搵廁所。", "唔好意思，我想搵洗手間。"], grammar: [g.heoi-lai], vocab: [w.wan2, w.sai2-sau2-gaan1, w.ci3-so2] }
      - { es: "我見到維港呀！", en: "I can see Victoria Harbour!", altEs: ["我見到維多利亞港呀！"], grammar: [g.heoi-lai], vocab: [w.gin3-dou2, w.wai4-gong2, w.wai4-do1-lei6-aa3-gong2] }
      - { es: "好多遊客去太平山山頂。", en: "Lots of tourists go up Victoria Peak.", altEs: ["好多遊客上山頂。", "有好多遊客去山頂。"], grammar: [g.heoi-lai], vocab: [w.jau4-haak3, w.saan1-deng2, w.taai3-ping4-saan1, w.saan1.b] }
      - { es: "我就嚟，等我一陣。", en: "I'm coming, wait for me a moment.", altEs: ["我就嚟喇，等我一陣。", "就嚟，等我一陣。"], grammar: [g.heoi-lai], vocab: [w.zau6-lai4] }
      - { es: "你幾時返嚟呀？", en: "When are you coming back?", altEs: ["你幾時返嚟？"], grammar: [g.heoi-lai, g.question-words], vocab: [w.faan1-lai4] }
      - { es: "我哋去海邊行吓啦。", en: "Let's go for a walk by the sea.", altEs: ["去海邊行吓啦。"], grammar: [g.heoi-lai, g.serial-verbs], vocab: [w.hoi2-bin1, w.hoi2] }
    exchanges:
      - q: { es: "你去邊度呀？", en: "Where are you going?" }
        a: { es: "我去香港仔。", en: "I'm going to Aberdeen." }
        alt: ["去香港仔。", "返屋企。", "我去海洋公園。"]
        grammar: [g.heoi-lai]
        vocab: [w.heoi3, w.hoeng1-gong2-zai2]
      - q: { es: "你幾時返嚟呀？", en: "When are you coming back?" }
        a: { es: "我夜晚八點返嚟。", en: "I'll be back at eight tonight." }
        alt: ["八點。", "聽日返嚟。"]
        grammar: [g.heoi-lai, g.time-before-verb]
        vocab: [w.faan1-lai4]
      - q: { es: "你嚟唔嚟我屋企食飯呀？", en: "Will you come to my place for dinner?" }
        a: { es: "好呀，幾點呀？", en: "Sure, what time?" }
        alt: ["好呀！", "今晚唔得，聽晚啦。"]
        grammar: [g.heoi-lai, g.a-not-a-questions]
        vocab: [w.lai4]
      - q: { es: "你搵乜嘢呀？", en: "What are you looking for?" }
        a: { es: "我搵洗手間。", en: "I'm looking for the toilet." }
        alt: ["洗手間。", "我搵便利店。"]
        grammar: [g.question-words]
        vocab: [w.wan2, w.sai2-sau2-gaan1]
      - q: { es: "你去唔去山頂呀？", en: "Are you going up the Peak?" }
        a: { es: "去，我想睇維港。", en: "Yes, I want to see the harbour." }
        alt: ["唔去喇。", "去呀！"]
        grammar: [g.heoi-lai, g.a-not-a-questions]
        vocab: [w.saan1-deng2, w.wai4-gong2]
    texts:
      - title: "香港仔"
        es: ["香港仔喺香港島南邊。", "好多遊客嚟香港仔坐船。", "海洋公園都喺附近。"]
        en: ["Aberdeen is on the south side of Hong Kong Island.", "Lots of tourists come to Aberdeen to take a boat ride.", "Ocean Park is nearby too."]
        grammar: [g.heoi-lai, g.hai2-location]
        vocab: [w.hoeng1-gong2-zai2, w.jau4-haak3, w.hoi2-joeng4-gung1-jyun2]
      - title: "Luna 嘅短訊"
        es: ["我而家喺山頂。", "我見到維港，好靚呀！", "我七點返嚟。"]
        en: ["I'm at the Peak now.", "I can see the harbour, it's beautiful!", "I'll be back at seven."]
        grammar: [g.heoi-lai]
        vocab: [w.saan1-deng2, w.gin3-dou2, w.faan1-lai4]
    spicy:
      - { es: "你去邊度呀？我同你一齊去，好唔好？", en: "Where are you going? Shall I come with you?", altEs: ["你去邊度？我同你一齊去，好唔好？"], grammar: [g.heoi-lai, g.a-not-a-questions], vocab: [w.heoi3] }
      - { es: "嚟我度飲杯嘢啦。", en: "Come over to my place for a drink.", altEs: ["嚟我屋企飲杯嘢啦。"], grammar: [g.heoi-lai, g.particles-aa-laa], vocab: [w.lai4] }
      - { es: "唔好返屋企住，我哋去海邊行吓啦。", en: "Don't go home yet, let's go for a walk by the sea.", altEs: ["唔好咁快返屋企，我哋去海邊行吓啦。"], grammar: [g.heoi-lai], vocab: [w.faan1, w.hoi2-bin1] }
      - { es: "我見到你，就唔想返工喇。", en: "When I see you, I don't want to go to work any more.", altEs: ["見到你，我就唔想返工喇。"], grammar: [g.heoi-lai], vocab: [w.gin3-dou2] }
      - { es: "你返嚟喇？我等你好耐喇。", en: "You're back? I've been waiting for you for ages.", altEs: ["你返嚟喇？我等咗你好耐喇。"], grammar: [g.heoi-lai], vocab: [w.faan1-lai4] }
  - id: a1.u10.l2
    title: 坐港鐵定坐巴士？
    teach: [g.transport-verbs]
    vocab: [w.gong2-tit3, w.dei6-tit3, w.zaam6, w.ce1-zaam6, w.baa1-si2, w.baa1-si2-zaam6, w.siu2-baa1, w.dik1-si2, w.din6-ce1, w.ding1-ding1, w.syun4, w.siu2-leon4, w.laam6-ce1, w.fo2-ce1, w.daan1-ce1, w.sin3, w.co5, w.daap3.b, w.zaa1-ce1, w.haang4-lou6, w.soeng5-ce1, w.lok6-ce1, w.zyun3-ce1, w.ce1-fai3, w.fei1, w.gwo3-hoi2, w.tin1-sing1-siu2-leon4]
    tip: "Say how you travel before where you go: 坐 or 搭 + vehicle + 去 + place: 我坐港鐵去中環."
    sentences:
      - { es: "我坐港鐵去中環。", en: "I take the MTR to Central.", altEs: ["我搭港鐵去中環。", "我搭地鐵去中環。"], grammar: [g.transport-verbs, g.serial-verbs], vocab: [w.co5, w.gong2-tit3, w.dei6-tit3], transform: { instruction: "Say you take the bus to Aberdeen", answer: "我坐巴士去香港仔。", alt: ["我搭巴士去香港仔。"], en: "I take the bus to Aberdeen." }, error: { wrong: "我去中環坐港鐵。", explain: "The vehicle comes before the destination: 坐港鐵去中環. 去中環坐港鐵 means you go to Central to catch the MTR.", grammar: g.transport-verbs } }
      - { es: "佢每日坐電車返工。", en: "She takes the tram to work every day.", altEs: ["佢日日坐叮叮返工。", "佢每日都坐電車返工。"], altEn: ["He takes the tram to work every day."], grammar: [g.transport-verbs], vocab: [w.din6-ce1, w.ding1-ding1], transform: { instruction: "Ask how she gets to work", answer: "佢點樣返工呀？", alt: ["佢點返工呀？", "佢點樣返工？"], en: "How does she get to work?" } }
      - { es: "我哋搭的士去香港仔啦。", en: "Let's take a taxi to Aberdeen.", altEs: ["我哋坐的士去香港仔啦。"], grammar: [g.transport-verbs, g.particles-aa-laa], vocab: [w.daap3.b, w.dik1-si2], transform: { instruction: "Use 坐 and the minibus instead", answer: "我哋坐小巴去香港仔啦。", alt: ["我哋搭小巴去香港仔啦。"], en: "Let's take a minibus to Aberdeen." } }
      - { es: "你點樣去海洋公園呀？", en: "How are you getting to Ocean Park?", altEs: ["你點去海洋公園呀？", "你點樣去海洋公園？"], grammar: [g.transport-verbs, g.question-words], vocab: [w.hoi2-joeng4-gung1-jyun2] }
      - { es: "我喺金鐘轉車去海洋公園。", en: "I change at Admiralty for Ocean Park.", altEs: ["我喺金鐘站轉車去海洋公園。"], grammar: [g.transport-verbs], vocab: [w.zyun3-ce1] }
      - { es: "我哋搭天星小輪過海。", en: "We're taking the Star Ferry across the harbour.", altEs: ["我哋坐天星小輪過海。"], grammar: [g.transport-verbs], vocab: [w.tin1-sing1-siu2-leon4, w.siu2-leon4, w.gwo3-hoi2] }
      - { es: "我爸爸揸車返工。", en: "My dad drives to work.", altEs: ["我阿爸揸車返工。"], grammar: [g.transport-verbs], vocab: [w.zaa1-ce1] }
      - { es: "我行路返屋企，好近咋。", jp: "ngo5 haang4 lou6 faan1 uk1 kei2 hou2 kan5 zaa3", en: "I'm walking home, it's really close.", altEs: ["我行路返屋企，好近㗎咋。"], grammar: [g.transport-verbs], vocab: [w.haang4-lou6] }
      - { es: "巴士站喺邊度呀？", en: "Where's the bus stop?", altEs: ["巴士站喺邊度？", "請問巴士站喺邊度呀？"], grammar: [g.hai2-location, g.question-words], vocab: [w.baa1-si2-zaam6] }
      - { es: "坐小巴去赤柱好快。", en: "Taking a minibus to Stanley is quick.", altEs: ["搭小巴去赤柱好快。"], grammar: [g.transport-verbs], vocab: [w.siu2-baa1] }
      - { es: "叮叮好慢，不過好平。", jp: "ding1 ding1 hou2 maan6 bat1 gwo3 hou2 peng4", en: "The tram is slow, but it's very cheap.", altEs: ["電車好慢，不過好平。"], grammar: [g.adjective-predicates], vocab: [w.ding1-ding1] }
      - { es: "我哋坐纜車上山頂。", en: "We take the Peak Tram up to the Peak.", altEs: ["我哋搭纜車上山頂。"], grammar: [g.transport-verbs], vocab: [w.laam6-ce1] }
      - { es: "唔該，前面落車！", en: "Getting off up ahead, please!", altEs: ["唔該，前面有落！", "前面落車，唔該！"], grammar: [g.mgoi-doze], vocab: [w.lok6-ce1], note: "What you call out to a minibus driver when you want to get off." }
      - { es: "我坐的士去機場。", en: "I'm taking a taxi to the airport.", altEs: ["我搭的士去機場。"], grammar: [g.transport-verbs], vocab: [w.dik1-si2], error: { wrong: "我揸的士去機場。", explain: "揸 means drive: 揸的士 means you are the taxi driver. As a passenger, say 坐的士.", grammar: g.transport-verbs } }
      - { es: "我唔識揸車，我踩單車。", en: "I can't drive; I ride a bike.", altEs: ["我唔識揸車，所以我踩單車。"], grammar: [g.transport-verbs], vocab: [w.daan1-ce1] }
      - { es: "唔該，一張去澳門嘅船飛。", en: "One ferry ticket to Macau, please.", altEs: ["唔該，一張去澳門嘅飛。"], grammar: [g.transport-verbs, g.adj-ge-noun], vocab: [w.fei1, w.syun4] }
    exchanges:
      - q: { es: "你點樣返工呀？", en: "How do you get to work?" }
        a: { es: "我坐港鐵返工。", en: "I take the MTR to work." }
        alt: ["坐港鐵。", "我行路返工。", "搭巴士。"]
        grammar: [g.transport-verbs, g.question-words]
        vocab: [w.gong2-tit3, w.co5]
      - q: { es: "去海洋公園坐乜嘢車呀？", en: "What do you take to get to Ocean Park?" }
        a: { es: "坐港鐵，喺金鐘轉車。", en: "The MTR, changing at Admiralty." }
        alt: ["坐巴士。", "搭港鐵。"]
        grammar: [g.transport-verbs]
        vocab: [w.zyun3-ce1]
      - q: { es: "你揸唔揸車㗎？", en: "Do you drive?" }
        a: { es: "唔揸，我坐巴士。", en: "No, I take the bus." }
        alt: ["揸呀。", "我唔識揸車。"]
        grammar: [g.transport-verbs, g.a-not-a-questions]
        vocab: [w.zaa1-ce1, w.baa1-si2]
      - q: { es: "車費幾錢呀？", en: "How much is the fare?" }
        a: { es: "十二蚊。", en: "Twelve dollars." }
        alt: ["十二蚊半。", "三蚊。"]
        grammar: [g.prices-gei-do-cin]
        vocab: [w.ce1-fai3]
      - q: { es: "我哋點樣過海呀？", en: "How shall we cross the harbour?" }
        a: { es: "搭天星小輪啦！", en: "Let's take the Star Ferry!" }
        alt: ["坐港鐵啦。", "搭的士啦。"]
        grammar: [g.transport-verbs, g.particles-aa-laa]
        vocab: [w.gwo3-hoi2, w.tin1-sing1-siu2-leon4]
    texts:
      - title: "去香港仔"
        es: ["我喺中環坐巴士去香港仔。", "大概三十分鐘就到。", "喺香港仔，我哋坐船睇海。"]
        en: ["I take the bus from Central to Aberdeen.", "It takes about thirty minutes.", "In Aberdeen we take a boat to see the sea."]
        grammar: [g.transport-verbs, g.serial-verbs]
        vocab: [w.baa1-si2, w.syun4]
      - title: "Kelvin 返工"
        es: ["我住喺北角。", "我每日坐叮叮返工。", "叮叮好慢，不過我好鍾意。"]
        en: ["I live in North Point.", "I take the tram to work every day.", "The tram is slow, but I love it."]
        grammar: [g.transport-verbs]
        vocab: [w.ding1-ding1, w.bak1-gok3]
    spicy:
      - { es: "我揸車，你坐我隔籬啦。", en: "I'll drive; you sit next to me.", altEs: ["我揸車，你坐喺我隔籬啦。"], grammar: [g.transport-verbs, g.position-words], vocab: [w.zaa1-ce1] }
      - { es: "冇巴士喇，我哋行路返屋企啦。", en: "There are no more buses; let's walk home.", altEs: ["冇車喇，我哋行路返屋企啦。"], grammar: [g.transport-verbs], vocab: [w.baa1-si2, w.haang4-lou6] }
      - { es: "坐的士？唔好啦，同你行路好開心。", en: "A taxi? No way, walking with you is lovely.", altEs: ["搭的士？唔好啦，同你行路好開心。"], grammar: [g.transport-verbs], vocab: [w.dik1-si2, w.haang4-lou6] }
      - { es: "電車好慢，不過同你一齊，慢啲都好。", en: "The tram is slow, but with you, slower is fine.", altEs: ["叮叮好慢，不過同你一齊，慢啲都好。"], grammar: [g.transport-verbs], vocab: [w.din6-ce1] }
      - { es: "最後一班船？咁我哋喺海邊坐多陣啦。", en: "The last ferry? Then let's sit by the sea a bit longer.", altEs: ["最後一班船呀？咁我哋喺海邊坐多一陣啦。"], grammar: [g.transport-verbs], vocab: [w.syun4] }
  - id: a1.u10.l3
    title: 喺銀行隔籬
    teach: [g.position-words]
    vocab: [w.zo2, w.jau6, w.zo2-bin1, w.jau6-bin1, w.cin4-min6, w.hau6-min6, w.soeng6-min6, w.haa6-min6, w.jap6-min6, w.ceot1-min6, w.gaak3-lei4, w.deoi3-min6, w.zung1-gaan1, w.pong4-bin1, w.fu6-gan6, w.bin1.b, w.ni1-bin1, w.go2-bin1, w.lau4-haa6, w.mun4-hau2, w.dung1, w.naam4, w.sai1, w.bak1]
    tip: "Position words go after the thing they refer to, usually with 喺 in front: 喺銀行隔籬 \"next to the bank\"."
    sentences:
      - { es: "你部手機喺枱上面。", en: "Your phone is on the table.", altEs: ["你部手機喺枱面。"], grammar: [g.position-words, g.hai2-location], vocab: [w.soeng6-min6], error: { wrong: "你部手機喺上面枱。", explain: "The position word comes after the noun: 枱上面, not 上面枱.", grammar: g.position-words } }
      - { es: "便利店喺銀行隔籬。", en: "The convenience store is next to the bank.", altEs: ["便利店喺銀行旁邊。"], grammar: [g.position-words], vocab: [w.gaak3-lei4], transform: { instruction: "Say it's opposite the bank", answer: "便利店喺銀行對面。", en: "The convenience store is opposite the bank." }, error: { wrong: "便利店喺隔籬銀行。", explain: "The position word follows the reference noun: 銀行隔籬.", grammar: g.position-words } }
      - { es: "我屋企附近有個街市。", en: "There's a market near my home.", altEs: ["我屋企附近有一個街市。"], grammar: [g.position-words, g.jau-have], vocab: [w.fu6-gan6] }
