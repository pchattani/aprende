id: r.c1.dear-sir-or-madam
level: c1
title: 敬啟者
kind: text
intro: "A short story: a young Hong Kong employee at a hotel company in Cotai has to write his first formal Chinese business email, and his Macanese manager teaches him the set formulas of business correspondence – 敬啟者, 煩請, 如有查詢, 順頌商祺 – and the difference between writing an email and sending a chat message."
allow: [志明, 梁經理, 梁小姐, 陳生, whatsapp, email, ok]
paragraphs:
  - { es: "志明喺香港讀完大學，第一份工就嚟咗路氹一間酒店集團做市場部助理。佢每日坐船過澳門，英文email寫得好流利，同同事講廣東話又冇問題。第一個星期，佢覺得呢份工好輕鬆。直到星期五下晝，部門經理梁小姐行埋嚟，放低一份文件：「志明，幫我寫封信畀珠海嗰間供應商，用中文，要正式，今日寄出。」", en: "Chi-ming finished university in Hong Kong, and his first job brought him to a hotel group in Cotai as a marketing assistant. Every day he takes the ferry to Macau. He writes fluent English emails and has no trouble speaking Cantonese with his colleagues. In the first week he thought the job was easy. Until Friday afternoon, when the department manager, Ms Leung, came over and put down a document: 'Chi-ming, write a letter to that supplier in Zhuhai for me – in Chinese, formal, sent today.'" }
  - { es: "志明對住個螢幕，打咗第一句：「陳生你好！我係酒店嘅志明，想問吓你哋上次報價嗰批枱布幾時送到？」佢讀咗一次，覺得幾好，好清楚，就send咗畀梁小姐睇。五分鐘之後，梁小姐打內線電話畀佢：「志明，你入嚟我房一陣。」", en: "Chi-ming stared at the screen and typed his first sentence: 'Hi Mr Chan! I'm Chi-ming from the hotel. Just wanted to ask when the tablecloths you quoted for last time will be delivered?' He read it through once, thought it was fine, nice and clear, and sent it to Ms Leung to check. Five minutes later Ms Leung called him on the internal line: 'Chi-ming, come into my office for a moment.'" }
  - { es: "梁小姐冇鬧佢，反而笑咗：「你寫得好清楚，不過呢個係WhatsApp，唔係公函。第一，我哋同佢哋未熟，唔可以一開口就『陳生你好』，要用『敬啟者』，或者『陳先生台鑒』。第二，唔好寫『我係』、『你哋』，要寫『本公司』、『貴公司』。第三，信嘅內容要分段：先講背景，再講要求，最後講你希望對方點做。」", en: "Ms Leung didn't scold him; she laughed: 'You've written it very clearly, but this is a WhatsApp message, not a business letter. First, we don't know them well yet, so you can't open with \"Hi Mr Chan\" – use 敬啟者 \"Dear Sir/Madam\", or 陳先生台鑒 \"Dear Mr Chan\". Second, don't write \"I'm\" or \"you guys\"; write \"our company\" and \"your esteemed company\". Third, the content has to be in paragraphs: first the background, then the request, and finally what you'd like the other side to do.'" }
  - { es: "志明拎起枝筆抄低。梁小姐繼續講：「仲有啲字，口語同書面語唔同。『幾時』要寫『何時』或者『日期』，『送到』可以寫『送達』，『想問吓』就寫『煩請告知』。結尾唔好寫『唔該晒』，要寫『如有查詢，歡迎致電本人』，最後加一句『順頌商祺』。」志明問：「商祺係乜嘢嚟㗎？」梁小姐話：「即係祝你生意好，不過冇人會講出口，淨係寫。」", en: "Chi-ming picked up a pen and took notes. Ms Leung went on: 'Also, some words are different in speech and in writing. 幾時 \"when\" should be 何時 or 日期 \"date\", 送到 \"deliver\" can be 送達, and 想問吓 \"just wanted to ask\" becomes 煩請告知 \"kindly inform us\". Don't end with 唔該晒 \"thanks a lot\"; write \"Should you have any queries, please feel free to call me\", and finish with 順頌商祺.' Chi-ming asked: 'What's 商祺?' Ms Leung said: 'It means \"wishing you good business\", but nobody ever says it out loud. You only write it.'" }
  - { es: "志明返到座位，重新寫過。佢寫寫吓，發覺書面語好似砌積木，每一句都有固定嘅格式。寫好之後，封信變成噉：「敬啟者：本公司於上月十五日收到貴公司之報價單，並已確認訂購枱布五百張。煩請告知該批貨品之送達日期，以便本公司安排人手接收。如有查詢，歡迎致電本人。順頌商祺。」佢讀咗兩次，覺得自己好似一個五十歲嘅經理。", en: "Chi-ming went back to his desk and started again. As he wrote, he found that written Chinese was like building with blocks: every sentence has a fixed format. When he'd finished, the letter read: 'Dear Sir/Madam, Our company received your company's quotation on the fifteenth of last month and has confirmed an order for five hundred tablecloths. Kindly inform us of the delivery date of the said goods, so that our company may arrange staff to receive them. Should you have any queries, please feel free to call me. With best regards.' He read it twice and felt like a fifty-year-old manager." }
  - { es: "寫完之後，佢上網查咗一陣，發覺原來「敬啟者」用喺唔知對方名嘅時候，好似英文嘅 Dear Sir or Madam；如果知道對方個名，就可以寫「陳先生台鑒」。佢心諗：原來中文同英文都有自己一套規矩，只不過以前喺學校，老師教嘅時候佢喺度瞓覺。", en: "When he'd finished, he looked it up online for a while and found that 敬啟者 is used when you don't know the recipient's name, like English 'Dear Sir or Madam'; if you know their name, you can write 陳先生台鑒. He thought: so Chinese and English each have their own set of rules – it's just that back at school, when the teacher taught this, he'd been asleep." }
  - { es: "梁小姐睇完，點頭：「好好多。不過有一樣嘢你要記住：書面語係用嚟表示尊重，唔係用嚟扮嘢。如果你寫到連自己都睇唔明，對方都唔會明。」佢指住「以便」兩個字：「呢個用得好，即係『等我哋可以』。好啦，寄出去啦。」志明撳咗send，鬆咗一口氣。", en: "Ms Leung read it and nodded: 'Much better. But remember one thing: written Chinese is for showing respect, not for showing off. If you write so that even you can't understand it, the other side won't understand it either.' She pointed at the word 以便: 'This is well used – it means \"so that we can\". Fine, send it.' Chi-ming clicked send and breathed a sigh of relief." }
  - { es: "星期一朝早，志明收到陳生嘅回覆，一樣咁正式：「梁經理台鑒：來函收悉。該批貨品將於本月二十日送達貴酒店。不便之處，敬請原諒。」但係一個鐘頭之後，佢部手機響，係一個唔識嘅號碼。對方講：「喂，係咪志明呀？我陳生呀。封信收到喇，啲枱布星期三就到，你叫保安開定門畀我哋架車啦，唔該晒！」", en: "On Monday morning Chi-ming received Mr Chan's reply, just as formal: 'Dear Manager Leung, Your letter is duly received. The said goods will be delivered to your esteemed hotel on the twentieth of this month. We apologise for any inconvenience.' But an hour later his mobile rang – an unknown number. The caller said: 'Hello, is that Chi-ming? It's Mr Chan. Got your letter. The tablecloths will arrive on Wednesday – get security to open the gate for our van, will you? Thanks a lot!'" }
  - { es: "志明收線之後笑咗好耐。佢終於明白：寫信要正式，因為封信會存檔，會畀好多人睇；但係傾電話就可以講返人話，因為大家要嘅係搞掂件事。佢喺記事簿寫低：「書面語講禮貌，口語講效率。兩樣都要識。」下晝梁小姐經過，見到佢寫嘅嘢，話：「呢句寫得好，不過記住，二十號同星期三唔係同一日，你最好覆封信確認吓。」志明一睇日曆，即刻冒汗。", en: "After hanging up, Chi-ming laughed for a long time. He finally understood: letters have to be formal because they're filed and read by many people, but on the phone you can talk like a normal human being, because what everyone wants is to get the job done. He wrote in his notebook: 'Written Chinese is about courtesy, spoken Cantonese is about efficiency. You need both.' That afternoon Ms Leung walked past, saw what he'd written, and said: 'Nicely put. But remember, the twentieth and Wednesday aren't the same day – you'd better reply to the letter to confirm.' Chi-ming looked at the calendar and broke into a sweat." }
questions:
  - { q: "梁小姐點解話志明第一封信唔得？", options: ["因為佢寫錯咗枱布嘅數量", "因為佢寫得似WhatsApp，唔夠正式", "因為佢用咗英文"], answer: 1, explain: "The content was clear but the register was chat-style; a business letter needs 敬啟者, 本公司/貴公司 and set formulas." }
  - { q: "書面信入面，「你哋公司」應該寫做？", options: ["本公司", "貴公司", "敝公司"], answer: 1, explain: "貴公司 'your esteemed company' honours the other side; 本公司 / 敝公司 refer to your own." }
  - { q: "「煩請告知」用口語講即係？", options: ["唔該話我知", "唔好話畀人知", "我已經知道"], answer: 0, explain: "煩請 'kindly (trouble you to)' + 告知 'inform' ≈ 唔該話我知." }
  - { q: "梁小姐認為書面語係用嚟做乜嘢？", options: ["扮嘢，顯得自己好叻", "表示尊重", "令人睇唔明"], answer: 1, explain: "書面語係用嚟表示尊重，唔係用嚟扮嘢." }
  - { q: "故事最後，志明點解冒汗？", options: ["因為陳生嬲咗佢", "因為佢發覺信同電話講嘅送貨日期唔同", "因為佢唔記得陳生個電話號碼"], answer: 1, explain: "The letter says the 20th, the phone call says Wednesday – he has to confirm which is right." }
