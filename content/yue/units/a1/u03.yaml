id: a1.u03
title: 我哋係朋友
lessons:
  - id: a1.u03.l1
    title: 我哋、你哋、佢哋
    teach: [g.dei-plural]
    tip: "哋 goes only on pronouns: 我哋, 你哋, 佢哋. Nouns have no plural ending: 朋友 is 'friend' or 'friends'."
    vocab: [w.ngo5-dei6, w.nei5-dei6, w.keoi5-dei6, w.dei6, w.jan4, w.hou2-pang4-jau5, w.naam4-zai2, w.neoi5-zai2, w.naam4-jan2, w.neoi5-jan2, w.jat1-cai4, w.tung4, w.tung4-maai4, w.king1-gai2, w.saan1-deng2, w.laam6-ce1, w.faai3-di1, w.laam6-ce1-zaam6]
    sentences:
      - { es: "我哋係朋友。", en: "We're friends.", altEs: ["我同佢係朋友。"], altEn: ["We are friends."], grammar: [g.dei-plural, g.hai6-identity], vocab: [w.ngo5-dei6],
          transform: { instruction: "Change 'we' to 'they'", answer: "佢哋係朋友。" } }
      - { es: "你哋係學生嗎？", en: "Are you students?", altEs: ["你哋係唔係學生呀？"], altEn: ["Are you (all) students?"], grammar: [g.dei-plural, g.maa-questions], vocab: [w.nei5-dei6],
          transform: { instruction: "Ask with 係唔係 instead of 嗎", answer: "你哋係唔係學生呀？" } }
      - { es: "佢哋喺山頂。", en: "They're at the Peak.", altEs: ["佢哋而家喺山頂。"], grammar: [g.dei-plural, g.hai2-location], vocab: [w.keoi5-dei6],
          transform: { instruction: "Make it negative", answer: "佢哋唔喺山頂。" } }
      - { es: "我哋一齊坐纜車去山頂啦。", en: "Let's take the Peak Tram up together.", altEn: ["Let's take the Peak Tram to the Peak together."], altEs: ["我哋一齊坐纜車上山頂啦。", "一齊坐纜車去山頂啦。"], grammar: [g.dei-plural, g.particles-aa-laa], vocab: [w.jat1-cai4] }
      - { es: "佢哋係我嘅好朋友。", en: "They're my good friends.", altEs: ["佢哋係我好朋友。"], altEn: ["They are my best friends."], grammar: [g.dei-plural], vocab: [w.hou2-pang4-jau5] }
      - { es: "佢哋係我朋友。", en: "They're my friends.", altEs: ["佢哋係我嘅朋友。"], grammar: [g.dei-plural, g.personal-pronouns], vocab: [w.keoi5-dei6],
          error: { wrong: "佢哋係我朋友哋。", explain: "哋 goes only on pronouns; 朋友 already means 'friends'.", grammar: g.dei-plural } }
      - { es: "嗰個男仔係我同學。", en: "That boy is my classmate.", altEs: ["嗰個男仔係我嘅同學。"], altEn: ["That guy is my classmate."], grammar: [g.demonstratives, g.hai6-identity], vocab: [w.naam4-zai2] }
      - { es: "嗰兩個女仔係邊個呀？", en: "Who are those two girls?", altEs: ["嗰兩個女仔係邊個？"], altEn: ["Who are those two young women?"], grammar: [g.demonstratives, g.question-words], vocab: [w.neoi5-zai2] }
      - { es: "呢個男人係陳生，嗰個女人係陳太。", en: "This man is Mr Chan and that woman is Mrs Chan.", altEs: ["呢位係陳生，嗰位係陳太。"], grammar: [g.demonstratives, g.hai6-identity], vocab: [w.naam4-jan2, w.neoi5-jan2] }
      - { es: "我同佢係同學。", en: "He and I are classmates.", altEs: ["我同埋佢係同學。", "我哋係同學。"], altEn: ["She and I are classmates."], grammar: [g.dei-plural], vocab: [w.tung4] }
      - { es: "我哋喺山頂傾偈。", en: "We're chatting at the Peak.", altEs: ["我哋喺山頂度傾偈。"], altEn: ["We chat at the Peak."], grammar: [g.dei-plural, g.hai2-location], vocab: [w.king1-gai2] }
      - { es: "佢哋同我一齊住。", en: "They live with me.", altEs: ["佢哋同我住。"], grammar: [g.dei-plural], vocab: [w.tung4, w.jat1-cai4] }
      - { es: "山頂有好多人。", en: "There are lots of people at the Peak.", altEs: ["山頂好多人。"], grammar: [g.jau-have], vocab: [w.jan4] }
      - { es: "我哋屋企喺灣仔。", en: "Our home is in Wan Chai.", altEs: ["我哋嘅屋企喺灣仔。"], grammar: [g.dei-plural, g.hai2-location], vocab: [w.ngo5-dei6] }
      - { es: "我有一個好朋友同埋兩個同學喺度。", en: "I have one good friend and two classmates here.", altEs: ["我有一個好朋友同兩個同學喺度。"], grammar: [g.jau-have], vocab: [w.tung4-maai4, w.hou2-pang4-jau5] }
    exchanges:
      - q: { es: "你哋係唔係同學呀？", en: "Are you classmates?" }
        a: { es: "係呀，我哋係同學。", en: "Yes, we're classmates." }
        alt: ["唔係，我哋係朋友。", "係呀。"]
        grammar: [g.dei-plural, g.a-not-a-questions]
        vocab: [w.nei5-dei6, w.ngo5-dei6]
      - q: { es: "佢哋係邊個呀？", en: "Who are they?" }
        a: { es: "佢哋係我朋友。", en: "They're my friends." }
        alt: ["係我同學。", "佢哋係我好朋友。"]
        grammar: [g.dei-plural]
        vocab: [w.keoi5-dei6]
      - q: { es: "你哋喺邊度呀？", en: "Where are you (all)?" }
        a: { es: "我哋喺山頂。", en: "We're at the Peak." }
        alt: ["喺山頂。", "我哋而家喺山頂。"]
        grammar: [g.dei-plural, g.hai2-location]
        vocab: [w.nei5-dei6]
      - q: { es: "你同邊個一齊嚟呀？", en: "Who did you come with?" }
        a: { es: "我同我朋友一齊嚟。", en: "I came with my friend." }
        alt: ["同我朋友。", "我自己一個人嚟。"]
        grammar: [g.dei-plural]
        vocab: [w.jat1-cai4, w.tung4]
      - q: { es: "嗰個女仔係邊個呀？", en: "Who's that girl?" }
        a: { es: "佢係Mandy，我同學。", en: "That's Mandy, my classmate." }
        alt: ["我唔知。", "佢係我朋友。"]
        grammar: [g.demonstratives]
        vocab: [w.neoi5-zai2]
    texts:
      - title: "山頂"
        es: ["我哋而家喺山頂。", "我同兩個朋友一齊坐纜車上嚟。", "呢度好靚，好多人！"]
        en: ["We're at the Peak now.", "I came up on the Peak Tram with two friends.", "It's beautiful here, and so crowded!"]
        grammar: [g.dei-plural, g.hai2-location]
        vocab: [w.ngo5-dei6, w.jat1-cai4]
      - title: "WhatsApp"
        es: ["你哋喺邊度呀？", "我哋喺纜車站等你哋。", "快啲嚟啦！"]
        en: ["Where are you (all)?", "We're waiting for you at the tram station.", "Come quickly!"]
        grammar: [g.dei-plural]
        vocab: [w.nei5-dei6]
    spicy:
      - { es: "我哋係朋友，不過我想做你男朋友。", en: "We're friends, but I'd like to be your boyfriend.", altEs: ["我哋係朋友，不過我想做你女朋友。"], altEn: ["We're friends, but I'd like to be your girlfriend."], grammar: [g.dei-plural], vocab: [w.ngo5-dei6] }
      - { es: "佢哋去山頂，我哋兩個去飲嘢啦。", en: "They're going up the Peak. Let's us two go for a drink.", altEs: ["佢哋去山頂，我同你去飲嘢啦。"], grammar: [g.dei-plural, g.particles-aa-laa], vocab: [w.keoi5-dei6, w.ngo5-dei6] }
      - { es: "嗰個男仔好靚仔，佢有冇女朋友呀？", en: "That guy is really cute. Does he have a girlfriend?", altEs: ["嗰個女仔好靚，佢有冇男朋友呀？"], altEn: ["That girl is really pretty. Does she have a boyfriend?"], grammar: [g.demonstratives, g.jau-have], vocab: [w.naam4-zai2] }
      - { es: "我哋一齊坐纜車，你坐我隔籬啦。", en: "Let's take the tram together. Sit next to me.", altEs: ["我哋一齊坐纜車啦，你坐我隔籬。"], grammar: [g.dei-plural, g.particles-aa-laa], vocab: [w.jat1-cai4] }
      - { es: "你哋兩個係咪一齊㗎？唔係？好嘢。", en: "Are you two together? No? Great.", altEs: ["你哋兩個係唔係一齊㗎？唔係？好嘢。"], grammar: [g.dei-plural, g.a-not-a-questions], vocab: [w.nei5-dei6, w.jat1-cai4] }
  - id: a1.u03.l2
    title: 我都係！
    teach: [g.dou-also]
    tip: "都 always goes before the verb, never at the end like 'too': 我都係學生. 'Me too!' is 我都係！"
    vocab: [w.dou1, w.zou6-je5, w.gung1-zok3, w.ji1-sang1, w.si1-gei1, w.ging2-caat3, w.wu6-si6, w.cyu4-si1, w.fan6, w.jan4-gung1, w.daan6-hai6, w.bat1-gwo3, w.waak6-ze2, w.gou1, w.ji1-jyun2, w.dak1, w.waa6]
    sentences:
      - { es: "我都係學生。", en: "I'm a student too.", altEs: ["我都係學生嚟㗎。"], altEn: ["I am a student too."], grammar: [g.dou-also], vocab: [w.dou1],
          transform: { instruction: "Say 'I'm not a student either'", answer: "我都唔係學生。" },
          error: { wrong: "我係學生都。", explain: "都 goes before the verb, never at the end: 我都係學生.", grammar: g.dou-also } }
      - { es: "我哋都係香港人。", en: "We're all Hongkongers.", altEs: ["我哋全部都係香港人。"], altEn: ["We are both from Hong Kong."], grammar: [g.dou-also, g.dei-plural], vocab: [w.dou1],
          error: { wrong: "都我哋係香港人。", explain: "都 can't come before the subject: 我哋都係香港人.", grammar: g.dou-also } }
      - { es: "佢哋都唔去。", en: "None of them are going.", altEs: ["佢哋都唔去呀。"], altEn: ["Neither of them is going."], grammar: [g.dou-also, g.m-negation], vocab: [w.dou1] }
      - { es: "我都唔知。", en: "I don't know either.", altEs: ["我都唔知呀。"], grammar: [g.dou-also, g.m-negation], vocab: [w.dou1] }
      - { es: "我係醫生，佢都係醫生。", en: "I'm a doctor and she's a doctor too.", altEs: ["我係醫生，佢都係。"], altEn: ["I'm a doctor and he's a doctor too."], grammar: [g.dou-also], vocab: [w.ji1-sang1],
          transform: { instruction: "Say 'we are both doctors'", answer: "我哋都係醫生。" } }
      - { es: "佢做司機。", en: "He's a driver.", altEs: ["佢係司機。"], altEn: ["He works as a driver.", "She's a driver."], grammar: [g.hai6-identity], vocab: [w.zou6, w.si1-gei1],
          transform: { instruction: "Say he's a police officer instead", answer: "佢做警察。", alt: ["佢係警察。"] } }
      - { es: "你做乜嘢工作呀？", en: "What do you do for a living?", altEs: ["你做咩工作呀？", "你做乜嘢工呀？"], altEn: ["What's your job?"], grammar: [g.question-words], vocab: [w.gung1-zok3, w.zou6] }
      - { es: "我做護士，佢做警察。", en: "I'm a nurse and she's a police officer.", altEs: ["我係護士，佢係警察。"], altEn: ["I'm a nurse and he's a police officer."], grammar: [g.hai6-identity], vocab: [w.wu6-si6, w.ging2-caat3] }
      - { es: "佢係廚師，喺中環做嘢。", en: "He's a chef and works in Central.", altEs: ["佢係廚師，喺中環返工。"], altEn: ["She's a cook and works in Central."], grammar: [g.hai2-location], vocab: [w.cyu4-si1, w.zou6-je5] }
      - { es: "呢份工作人工好高。", en: "This job pays very well.", altEs: ["呢份工人工好高。"], altEn: ["The salary for this job is very high."], grammar: [g.classifiers-intro], vocab: [w.fan6, w.jan4-gung1], jp: "ni1 fan6 gung1 zok3 jan4 gung1 hou2 gou1" }
      - { es: "我鍾意我份工作，但係好忙。", en: "I like my job, but it's very busy.", altEs: ["我鍾意我份工，但係好忙。", "我鍾意我份工作，不過好忙。"], grammar: [g.classifier-as-the], vocab: [w.daan6-hai6, w.fan6] }
      - { es: "佢唔係醫生，不過佢喺醫院做嘢。", en: "She isn't a doctor, but she works in a hospital.", altEs: ["佢唔係醫生，但係佢喺醫院做嘢。"], altEn: ["He isn't a doctor, but he works in a hospital."], grammar: [g.m-negation, g.hai2-location], vocab: [w.bat1-gwo3] }
      - { es: "我哋去山頂或者去中環都得。", en: "We can go to the Peak or to Central, either is fine.", altEs: ["去山頂或者中環都得。"], grammar: [g.dou-also], vocab: [w.waak6-ze2] }
      - { es: "兩個都好。", en: "Both are good.", altEs: ["兩個都好好。"], altEn: ["They're both good."], grammar: [g.dou-also], vocab: [w.dou1] }
      - { es: "我都係！", en: "Me too!", altEs: ["我都係呀！"], altEn: ["So am I!"], grammar: [g.dou-also], vocab: [w.dou1] }
    exchanges:
      - q: { es: "我係學生，你呢？", en: "I'm a student, and you?" }
        a: { es: "我都係！", en: "Me too!" }
        alt: ["我都係學生。", "我唔係，我做嘢喇。"]
        grammar: [g.dou-also, g.ne-follow-up]
        vocab: [w.dou1]
      - q: { es: "你做乜嘢工作呀？", en: "What do you do?" }
        a: { es: "我做護士。", en: "I'm a nurse." }
        alt: ["我係護士。", "我喺醫院做護士。"]
        grammar: [g.hai6-identity]
        vocab: [w.gung1-zok3, w.wu6-si6]
      - q: { es: "佢哋去唔去山頂呀？", en: "Are they going to the Peak?" }
        a: { es: "佢哋都唔去。", en: "None of them are going." }
        alt: ["佢哋都去。", "唔去。"]
        grammar: [g.dou-also, g.a-not-a-questions]
        vocab: [w.dou1]
      - q: { es: "你人工高唔高呀？", en: "Is your salary good?" }
        a: { es: "唔係好高，不過我鍾意我份工作。", en: "Not very, but I like my job." }
        alt: ["幾高。", "麻麻哋啦。"]
        grammar: [g.a-not-a-questions]
        vocab: [w.jan4-gung1, w.bat1-gwo3]
      - q: { es: "你哋兩個都係醫生？", en: "Are you both doctors?" }
        a: { es: "係呀，我哋都係醫生。", en: "Yes, we're both doctors." }
        alt: ["唔係，佢係護士。", "係呀。"]
        grammar: [g.dou-also]
        vocab: [w.ji1-sang1]
    texts:
      - title: "我嘅工作"
        es: ["我叫阿Ben，係廚師。", "我喺山頂一間餐廳做嘢。", "我太太都喺度做嘢。"]
        en: ["I'm Ben and I'm a chef.", "I work in a restaurant at the Peak.", "My wife works there too."]
        grammar: [g.dou-also, g.hai2-location]
        vocab: [w.cyu4-si1, w.zou6-je5]
      - title: "纜車司機"
        es: ["呢個係纜車司機陳生。", "佢日日都喺度做嘢。", "佢話山頂好靚，不過好多人。"]
        en: ["This is Mr Chan, the Peak Tram driver.", "He works here every day.", "He says the Peak is beautiful, but very crowded."]
        grammar: [g.dou-also]
        vocab: [w.si1-gei1, w.bat1-gwo3]
    spicy:
      - { es: "我都鍾意你。", en: "I like you too.", altEs: ["我都好鍾意你。"], grammar: [g.dou-also], vocab: [w.dou1] }
      - { es: "你係廚師？我哋唔使出去食飯喇。", en: "You're a chef? Then we never need to eat out again.", altEs: ["你係廚師呀？我哋唔使出去食飯喇。"], grammar: [g.hai6-identity], vocab: [w.cyu4-si1] }
      - { es: "我人工唔高，不過請你飲咖啡都得。", en: "My salary isn't high, but I can still buy you a coffee.", altEs: ["我人工唔高，但係請你飲咖啡都得。"], grammar: [g.dou-also], vocab: [w.jan4-gung1, w.bat1-gwo3], jp: "ngo5 jan4 gung1 m4 gou1 bat1 gwo3 ceng2 nei5 jam2 gaa3 fe1 dou1 dak1" }
      - { es: "我哋都冇男朋友，你哋呢？", en: "Neither of us has a boyfriend. What about you two?", altEs: ["我哋都冇女朋友，你哋呢？"], grammar: [g.dou-also, g.mou-negation], vocab: [w.dou1] }
      - { es: "你都坐纜車？我都係！一齊坐啦。", en: "You're taking the tram too? Me too! Let's sit together.", altEs: ["你都坐纜車呀？我都係！一齊坐啦。"], grammar: [g.dou-also], vocab: [w.dou1] }
  - id: a1.u03.l3
    title: 你係唔係英國人呀？
    teach: [g.a-not-a-questions]
    tip: "The most natural yes/no question repeats the verb: 係唔係, 去唔去, 識唔識. 係咪 is the fast spoken form of 係唔係."
    vocab: [w.hai6-mai6, w.hai6-m4-hai6, w.ding6-hai6, w.ding6, w.daap3, w.ji3-si1, w.hok6, w.duk6-syu1, w.duk6, w.daai6-hok6, w.hoeng1-gong2-jan4, w.zung1-gwok3-jan4, w.ngoi6-gwok3-jan4, w.jing1-gwok3-jan4, w.mei5-gwok3-jan4, w.jat6-bun2-jan4, w.gwok3-gaa1, w.zung1-gwok3, w.jing1-gwok3, w.mei5-gwok3, w.jat6-bun2, w.gan2, w.tai2, w.bin1, w.zung1-m4-zung1-ji3, w.jau4-haak3]
    sentences:
      - { es: "你係唔係英國人呀？", en: "Are you British?", altEs: ["你係英國人嗎？", "你係咪英國人呀？"], grammar: [g.a-not-a-questions, g.nationality-language], vocab: [w.hai6-m4-hai6, w.jing1-gwok3-jan4],
          transform: { instruction: "Ask with 嗎 instead", answer: "你係英國人嗎？" } }
      - { es: "唔係，我係美國人。", en: "No, I'm American.", altEs: ["唔係呀，我係美國人。"], grammar: [g.hai6-identity, g.nationality-language], vocab: [w.mei5-gwok3-jan4],
          transform: { instruction: "Answer that you're Japanese", answer: "唔係，我係日本人。", alt: ["唔係呀，我係日本人。"] } }
      - { es: "你係咪日本人呀？", en: "You're Japanese, right?", altEs: ["你係唔係日本人呀？"], altEn: ["Are you Japanese?"], grammar: [g.a-not-a-questions], vocab: [w.hai6-mai6, w.jat6-bun2-jan4] }
      - { es: "佢係中國人定係香港人呀？", en: "Is she from mainland China or from Hong Kong?", altEs: ["佢係中國人定香港人呀？"], altEn: ["Is he Chinese or a Hongkonger?"], grammar: [g.a-not-a-questions, g.nationality-language], vocab: [w.ding6-hai6, w.zung1-gwok3-jan4, w.hoeng1-gong2-jan4] }
      - { es: "你識唔識佢呀？", en: "Do you know him?", altEs: ["你識佢嗎？"], altEn: ["Do you know her?"], grammar: [g.a-not-a-questions], vocab: [w.sik1],
          transform: { instruction: "Ask about 'them' instead", answer: "你識唔識佢哋呀？", alt: ["你識佢哋嗎？"] } }
      - { es: "你飲咖啡定茶呀？", en: "Coffee or tea?", altEs: ["你飲咖啡定係飲茶呀？", "咖啡定茶呀？"], altEn: ["Would you like coffee or tea?"], grammar: [g.a-not-a-questions], vocab: [w.ding6] }
      - { es: "你係唔係學緊廣東話呀？", en: "Are you learning Cantonese?", altEs: ["你係咪學緊廣東話呀？", "你學緊廣東話嗎？"], grammar: [g.a-not-a-questions], vocab: [w.hok6] }
      - { es: "我喺大學讀書。", en: "I study at university.", altEs: ["我喺大學讀緊書。"], altEn: ["I'm at university."], grammar: [g.hai2-location], vocab: [w.daai6-hok6, w.duk6-syu1],
          error: { wrong: "我讀書喺大學。", explain: "The 喺 + place phrase comes before the verb: 我喺大學讀書.", grammar: g.hai2-location } }
