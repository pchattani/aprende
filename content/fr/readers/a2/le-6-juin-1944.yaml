id: r.a2.le-6-juin-1944
level: a2
title: Le 6 juin 1944
kind: text
intro: Lucas visits the D-Day beaches with his grandfather Jean, who was ten years old in June 1944 and lived in a village near the coast.
allow: [lucas, jean, américains, américain, canadiens, britanniques, centre]
paragraphs:
  - { es: "L'été dernier, je suis allé en Normandie avec mon grand-père, Jean. Il a plus de quatre-vingt-dix ans, mais il marche encore très bien. Nous avons visité les plages du Débarquement : Omaha, Utah, Gold, Juno et Sword. Sur la plage d'Omaha, il s'est arrêté et il m'a raconté son histoire.", en: "Last summer I went to Normandy with my grandfather, Jean. He's over ninety, but he still walks very well. We visited the D-Day beaches: Omaha, Utah, Gold, Juno and Sword. On Omaha beach he stopped and told me his story." }
  - { es: "« En 1944, j'avais dix ans. J'habitais avec mes parents dans une petite ferme, à cinq kilomètres de la mer. C'était la guerre, et les soldats allemands étaient partout. On n'avait pas beaucoup à manger, mais on avait des vaches, alors on avait du lait et du beurre.", en: "'In 1944 I was ten. I lived with my parents on a little farm, five kilometres from the sea. It was the war, and German soldiers were everywhere. We didn't have much to eat, but we had cows, so we had milk and butter." }
  - { es: "Dans la nuit du 5 au 6 juin, je dormais quand un bruit terrible m'a réveillé. Il y avait des avions partout dans le ciel. Mon père a ouvert la fenêtre et il a dit : « Ça y est, ils arrivent ! » Ma mère pleurait. On est descendus à la cave et on y est restés toute la nuit.", en: "On the night of the 5th to the 6th of June, I was sleeping when a terrible noise woke me up. There were planes everywhere in the sky. My father opened the window and said: 'This is it, they're coming!' My mother was crying. We went down to the cellar and stayed there all night." }
  - { es: "Le matin, tout était silencieux. Je suis sorti avec mon père. Dans notre champ, il y avait un parachute blanc dans un arbre. Tout à coup, un jeune soldat est sorti de derrière la maison. Il était américain et il avait dix-neuf ans. Il ne parlait pas français, et nous ne parlions pas anglais. Ma mère lui a donné du pain et du lait. Il a souri et il m'a offert du chocolat. C'était la première fois que je mangeais du chocolat depuis quatre ans ! »", en: "In the morning everything was silent. I went out with my father. In our field there was a white parachute in a tree. Suddenly a young soldier came out from behind the house. He was American and he was nineteen. He didn't speak French, and we didn't speak English. My mother gave him bread and milk. He smiled and gave me some chocolate. It was the first time I'd eaten chocolate in four years!'" }
  - { es: "Ce jour-là, des milliers de soldats américains, britanniques et canadiens ont débarqué sur ces plages. Beaucoup sont morts. Après la plage, nous sommes allés au cimetière américain de Colleville-sur-Mer. Il y a plus de neuf mille tombes blanches, toutes pareilles, devant la mer. Mon grand-père n'a rien dit pendant longtemps.", en: "That day thousands of American, British and Canadian soldiers landed on these beaches. Many died. After the beach we went to the American cemetery at Colleville-sur-Mer. There are more than nine thousand white graves, all the same, facing the sea. My grandfather said nothing for a long time." }
  - { es: "Le lendemain, nous avons visité Bayeux et sa célèbre tapisserie. Elle raconte une autre bataille, en 1066, quand un duc de Normandie, Guillaume, est devenu roi d'Angleterre. Elle est très longue, presque soixante-dix mètres ! Dans le train du retour, mon grand-père m'a dit : « Tu vois, Lucas, l'histoire, ce n'est pas seulement dans les livres. Il faut la raconter. »", en: "The next day we visited Bayeux and its famous tapestry. It tells the story of another battle, in 1066, when a duke of Normandy, William, became king of England. It's very long, almost seventy metres! On the train home my grandfather said to me: 'You see, Lucas, history isn't only in books. You have to tell it.'" }
questions:
  - { q: "Quel âge avait Jean en 1944 ?", options: ["Dix ans", "Dix-neuf ans", "Quatre-vingt-dix ans"], answer: 0, explain: "«En 1944, j'avais dix ans.» He's over ninety today; the soldier was nineteen." }
  - { q: "Qu'est-ce qui a réveillé Jean pendant la nuit ?", options: ["Sa mère", "Le bruit des avions", "Les vaches"], answer: 1, explain: "«Un bruit terrible m'a réveillé. Il y avait des avions partout dans le ciel.»" }
  - { q: "Où la famille a-t-elle passé la nuit ?", options: ["Dans le champ", "À la cave", "Sur la plage"], answer: 1, explain: "«On est descendus à la cave et on y est restés toute la nuit.»" }
  - { q: "Qu'est-ce que le soldat a donné à Jean ?", options: ["Du pain", "Du lait", "Du chocolat"], answer: 2, explain: "His mother gave the soldier bread and milk; the soldier «m'a offert du chocolat»." }
  - { q: "Que raconte la tapisserie de Bayeux ?", options: ["Le Débarquement de 1944", "Une bataille de 1066", "La vie de Jeanne d'Arc"], answer: 1, explain: "«Elle raconte une autre bataille, en 1066», when Duke William became king of England." }
glossary:
  - { es: terrible, en: terrible }
  - { es: "ça y est", en: "this is it, that's it" }
  - { es: cave, en: cellar }
  - { es: silencieux, en: silent }
  - { es: Guillaume, en: William }
  - { es: retour, en: return journey }
