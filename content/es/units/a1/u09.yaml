id: a1.u09
title: Ir, hacer, poder
lessons:
  - id: a1.u09.l1
    title: ¿Adónde vas?
    teach: [g.ir-present, g.al-del-contractions]
    vocab: [w.ir, w.venir, w.playa, w.montana, w.campo, w.mar, w.rio, w.pueblo, w.aeropuerto, w.avion, w.bici, w.taxi, w.pie.phrase, w.adonde]
    sentences:
      - { es: "¿Adónde vas? Voy al cine.", en: "Where are you going? I'm going to the cinema.", grammar: [g.ir-present, g.al-del-contractions], vocab: [w.ir, w.adonde, w.cine], error: { wrong: "Voy a el cine.", explain: "a + el contracts to al.", grammar: g.al-del-contractions } }
      - { es: "Vamos a la playa en verano.", en: "We go to the beach in summer.", grammar: [g.ir-present], vocab: [w.playa] }
      - { es: "Mis padres van a la montaña en invierno.", en: "My parents go to the mountains in winter.", grammar: [g.ir-present], vocab: [w.montana] }
      - { es: "Voy al trabajo en metro.", en: "I go to work by metro.", grammar: [g.ir-present, g.prepositions-movement], vocab: [w.metro, w.trabajo] }
      - { es: "¿Vais a la universidad a pie?", en: "Do you (all) walk to university?", grammar: [g.ir-present], vocab: [w.pie.phrase, w.universidad] }
      - { es: "Ella va al pueblo de sus abuelos en coche.", en: "She goes to her grandparents' village by car.", grammar: [g.ir-present], vocab: [w.pueblo, w.coche] }
      - { es: "Vengo del aeropuerto en taxi.", en: "I'm coming from the airport by taxi.", grammar: [g.al-del-contractions], vocab: [w.venir, w.aeropuerto, w.taxi] }
      - { es: "¿Vienes a mi casa esta noche?", en: "Are you coming to my house tonight?", grammar: [g.stem-changing-present], vocab: [w.venir, w.esta-noche] }
      - { es: "El avión a Londres sale a las diez.", en: "The plane to London leaves at ten.", grammar: [g.time-telling], vocab: [w.avion, w.salir] }
      - { es: "Voy en bici al campo.", en: "I cycle to the countryside.", grammar: [g.prepositions-movement], vocab: [w.bici, w.campo] }
      - { es: "El río llega al mar.", en: "The river reaches the sea.", grammar: [g.al-del-contractions], vocab: [w.rio, w.mar, w.llegar] }
      - { es: "Los domingos vamos al parque con el perro.", en: "On Sundays we go to the park with the dog.", grammar: [g.ir-present], vocab: [w.parque, w.domingo], transform: { instruction: "Change to 'I'", answer: "Los domingos voy al parque con el perro." } }
  - id: a1.u09.l2
    title: Voy a…
    teach: [g.ir-a-infinitive]
    vocab: [w.viajar, w.visitar, w.pasear, w.esperar, w.viaje, w.vacaciones, w.fiesta, w.concierto, w.pelicula, w.teatro, w.billete, w.entrada, w.esta-noche, w.que-viene, w.proximo]
    sentences:
      - { es: "Mañana voy a visitar a mi abuela.", en: "Tomorrow I'm going to visit my grandmother.", grammar: [g.ir-a-infinitive, g.a-personal], vocab: [w.visitar] }
      - { es: "¿Qué vais a hacer este fin de semana?", en: "What are you (all) going to do this weekend?", grammar: [g.ir-a-infinitive], vocab: [w.hacer, w.fin-de-semana] }
      - { es: "Vamos a viajar a Portugal en las vacaciones.", en: "We're going to travel to Portugal in the holidays.", grammar: [g.ir-a-infinitive], vocab: [w.viajar, w.vacaciones] }
      - { es: "Esta noche voy a ver una película.", en: "Tonight I'm going to watch a film.", grammar: [g.ir-a-infinitive], vocab: [w.pelicula, w.esta-noche] }
      - { es: "El sábado que viene hay una fiesta en casa de Ana.", en: "Next Saturday there is a party at Ana's house.", grammar: [g.hay], vocab: [w.fiesta, w.que-viene] }
      - { es: "Van a comprar las entradas para el concierto.", en: "They are going to buy the tickets for the concert.", grammar: [g.ir-a-infinitive], vocab: [w.entrada, w.concierto], error: { wrong: "Van comprar las entradas para el concierto.", explain: "ir a + infinitive: the a is required.", grammar: g.ir-a-infinitive } }
      - { es: "No voy a trabajar la semana próxima.", en: "I'm not going to work next week.", grammar: [g.ir-a-infinitive], vocab: [w.proximo, w.semana] }
      - { es: "¿Vas a venir al teatro con nosotros?", en: "Are you going to come to the theatre with us?", grammar: [g.ir-a-infinitive], vocab: [w.teatro, w.venir] }
      - { es: "Necesito un billete de tren para Sevilla.", en: "I need a train ticket to Seville.", grammar: [g.prepositions-movement], vocab: [w.billete, w.tren] }
      - { es: "Vamos a pasear por el centro.", en: "We're going to walk around the centre.", grammar: [g.ir-a-infinitive, g.prepositions-movement], vocab: [w.pasear, w.centro] }
      - { es: "Te espero en la estación a las seis.", en: "I'll wait for you at the station at six.", grammar: [g.direct-object-intro], vocab: [w.esperar, w.estacion] }
      - { es: "El viaje a Madrid es largo.", en: "The trip to Madrid is long.", grammar: [g.ser-present], vocab: [w.viaje, w.largo] }
      - { es: "Va a llover esta tarde.", en: "It's going to rain this afternoon.", grammar: [g.ir-a-infinitive, g.weather], vocab: [w.tarde] }
  - id: a1.u09.l3
    title: ¿Qué haces?
    teach: [g.hacer-present]
    vocab: [w.hacer, w.poner, w.dar, w.decir, w.saber, w.conocer, w.deporte, w.pregunta, w.preguntar, w.llamar, w.ayudar, w.entrar, w.ahora, w.pronto, w.ya, w.todavia]
    sentences:
      - { es: "¿Qué haces? Hago los deberes.", en: "What are you doing? I'm doing my homework.", grammar: [g.hacer-present], vocab: [w.hacer, w.deberes] }
      - { es: "Hago deporte tres veces a la semana.", en: "I do sport three times a week.", grammar: [g.hacer-present, g.frequency-adverbs], vocab: [w.deporte, w.vez] }
      - { es: "Mi madre hace una paella fantástica.", en: "My mother makes a fantastic paella.", grammar: [g.hacer-present], vocab: [w.hacer] }
      - { es: "¿Qué hacéis los domingos? No hacemos nada.", en: "What do you do on Sundays? We don't do anything.", grammar: [g.hacer-present, g.negation], vocab: [w.nada, w.domingo] }
      - { es: "Pongo la mesa para la cena.", en: "I set the table for dinner.", grammar: [g.regular-er-ir-present], vocab: [w.poner, w.mesa] }
      - { es: "Te doy mi número de teléfono.", en: "I'll give you my phone number.", grammar: [g.regular-ar-present], vocab: [w.dar, w.numero] }
      - { es: "¿Qué dices? No te oigo.", en: "What are you saying? I can't hear you.", grammar: [g.stem-changing-present], vocab: [w.decir] }
      - { es: "No sé la respuesta.", en: "I don't know the answer.", grammar: [g.saber-vs-conocer], vocab: [w.saber] }
      - { es: "¿Conoces a mi hermano? Sí, lo conozco.", en: "Do you know my brother? Yes, I know him.", grammar: [g.saber-vs-conocer], vocab: [w.conocer] }
      - { es: "El profesor hace una pregunta y los estudiantes contestan.", en: "The teacher asks a question and the students answer.", grammar: [g.hacer-present], vocab: [w.pregunta, w.profesor] }
      - { es: "¿Puedo preguntar algo? Claro.", en: "Can I ask something? Of course.", grammar: [g.poder-present], vocab: [w.preguntar, w.algo] }
      - { es: "Te llamo esta tarde, ¿vale?", en: "I'll call you this afternoon, OK?", grammar: [g.direct-object-intro], vocab: [w.llamar, w.tarde] }
      - { es: "¿Me ayudas con los deberes? Ahora no, pronto.", en: "Can you help me with the homework? Not now, soon.", grammar: [g.regular-ar-present], vocab: [w.ayudar, w.ahora, w.pronto] }
      - { es: "¿Ya estás en casa? No, todavía estoy en el trabajo.", en: "Are you home already? No, I'm still at work.", grammar: [g.estar-location], vocab: [w.ya, w.todavia] }
      - { es: "Entramos en el museo a las diez.", en: "We go into the museum at ten.", grammar: [g.prepositions-movement], vocab: [w.entrar, w.museo] }
  - id: a1.u09.l4
    title: ¿Puedo?
    teach: [g.poder-present]
    vocab: [w.poder, w.despacio, w.rapido, w.juntos, w.momento, w.favor, w.problema]
    sentences:
      - { es: "¿Puedes hablar más despacio, por favor?", en: "Can you speak more slowly, please?", grammar: [g.poder-present], vocab: [w.poder, w.despacio] }
      - { es: "¿Puedo pagar con tarjeta?", en: "Can I pay by card?", grammar: [g.poder-present], vocab: [w.pagar, w.tarjeta] }
      - { es: "No podemos ir mañana, tenemos que trabajar.", en: "We can't go tomorrow, we have to work.", grammar: [g.poder-present, g.tener-que], vocab: [w.poder, w.trabajar] }
      - { es: "¿Puede repetir, por favor?", en: "Can you repeat, please? (formal)", grammar: [g.poder-present, g.tu-vs-usted], vocab: [w.poder] }
      - { es: "¿Pueden ustedes esperar un momento?", en: "Can you (formal pl.) wait a moment?", grammar: [g.poder-present], vocab: [w.esperar, w.momento] }
      - { es: "Ella puede venir a las cinco.", en: "She can come at five.", grammar: [g.poder-present], vocab: [w.venir], transform: { instruction: "Change to 'you all' (vosotros)", answer: "Podéis venir a las cinco.", alt: ["Vosotros podéis venir a las cinco."] } }
      - { es: "¿Me haces un favor?", en: "Can you do me a favour?", grammar: [g.hacer-present], vocab: [w.favor, w.hacer] }
      - { es: "No hay problema.", en: "No problem.", grammar: [g.hay], vocab: [w.problema] }
      - { es: "Mi coche es muy rápido.", en: "My car is very fast.", grammar: [g.adjective-agreement], vocab: [w.rapido, w.coche] }
      - { es: "¿Podemos ir juntos al concierto?", en: "Can we go to the concert together?", grammar: [g.poder-present], vocab: [w.juntos, w.concierto] }
      - { es: "¿Se puede aparcar aquí? No, no se puede.", en: "Can you park here? No, you can't.", grammar: [g.poder-present], vocab: [w.aqui] }
      - { es: "No puedo más, estoy muy cansado.", en: "I can't go on, I'm very tired.", grammar: [g.poder-present], vocab: [w.cansado] }
      - { es: "¿Puedes ayudarme con este problema?", en: "Can you help me with this problem?", grammar: [g.poder-present], vocab: [w.ayudar, w.problema], error: { wrong: "¿Puedes a ayudarme con este problema?", explain: "poder + infinitive, no preposition.", grammar: g.poder-present } }
dialogues:
  - id: a1.u09.d1
    title: Planes para el fin de semana
    context: Pablo and Lucía make plans on the phone.
    lines:
      - { speaker: Pablo, es: "Hola, Lucía. ¿Qué vas a hacer este fin de semana?", en: "Hi, Lucía. What are you going to do this weekend?" }
      - { speaker: Lucía, es: "El sábado por la mañana voy a hacer deporte y por la tarde no sé. ¿Por qué?", en: "On Saturday morning I'm going to do sport and in the afternoon I don't know. Why?" }
      - { speaker: Pablo, es: "Hay un concierto en el parque a las siete. ¿Quieres venir?", en: "There's a concert in the park at seven. Do you want to come?" }
      - { speaker: Lucía, es: "¡Claro! ¿Cuánto cuestan las entradas?", en: "Of course! How much are the tickets?" }
      - { speaker: Pablo, es: "Es gratis. Podemos ir juntos en bici.", en: "It's free. We can go together by bike." }
      - { speaker: Lucía, es: "Vale. ¿Y el domingo? Mis padres van al pueblo y yo voy a visitar a mi abuela.", en: "OK. And on Sunday? My parents are going to the village and I'm going to visit my grandmother." }
      - { speaker: Pablo, es: "¿Puedo ir contigo? Conozco a tu abuela, es muy simpática.", en: "Can I come with you? I know your grandmother, she's very nice." }
      - { speaker: Lucía, es: "Sí, pero tenemos que salir temprano. El tren sale a las nueve.", en: "Yes, but we have to leave early. The train leaves at nine." }
      - { speaker: Pablo, es: "No hay problema. Te espero en la estación a las ocho y media.", en: "No problem. I'll wait for you at the station at half past eight." }
      - { speaker: Lucía, es: "Perfecto. Hasta el sábado.", en: "Perfect. See you Saturday." }
    questions:
      - { q: "What is happening on Saturday at seven?", options: ["A film", "A concert in the park", "A party"], answer: 1 }
      - { q: "How will they get to the concert?", options: ["By bike", "By bus", "On foot"], answer: 0 }
      - { q: "What time does the train leave on Sunday?", options: ["Eight thirty", "Nine", "Ten"], answer: 1 }
