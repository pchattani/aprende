id: a1.u18
title: 咖啡同點心
lessons:
  - id: a1.u18.l1
    title: 咖啡同茶
    teach: [g.sik-jam]
    skills: [listen, speak, read]
    tip: "咖啡 gaa3 fe1 sounds like 'coffee'. 茶 caa4 is tea, said low and falling. 'To drink' is 飲 jam2: 飲咖啡, 飲茶. 飲茶 also means going for yum cha: tea and dim sum! 同 tung4 is 'and' (咖啡同茶 'coffee and tea'); in a question, 定 ding6 is 'or': 咖啡定茶呀？ 'coffee or tea?'"
    vocab: [w.gaa3-fe1, w.caa4, w.jam2, w.jam2-caa4, w.bui1, w.tung4, w.ding6]
    sentences:
      - { es: "咖啡。", en: "Coffee.", grammar: [g.sik-jam], vocab: [w.gaa3-fe1] }
      - { es: "茶。", en: "Tea.", grammar: [g.sik-jam], vocab: [w.caa4] }
      - { es: "一杯咖啡。", en: "A cup of coffee.", altEn: ["One coffee.", "A coffee."], grammar: [g.sik-jam, g.classifiers-intro], vocab: [w.gaa3-fe1, w.bui1] }
      - { es: "一杯茶。", en: "A cup of tea.", altEn: ["One tea.", "A tea."], grammar: [g.sik-jam, g.classifiers-intro], vocab: [w.caa4, w.bui1] }
      - { es: "我飲咖啡。", en: "I drink coffee.", altEn: ["I'm drinking coffee.", "I'll have coffee."], grammar: [g.sik-jam], vocab: [w.jam2, w.gaa3-fe1] }
      - { es: "我飲茶。", en: "I drink tea.", altEn: ["I'm drinking tea.", "I'll have tea."], grammar: [g.sik-jam], vocab: [w.jam2, w.caa4] }
      - { es: "你飲咖啡呀？", en: "Are you having coffee?", altEn: ["You're drinking coffee?"], grammar: [g.sik-jam], vocab: [w.jam2, w.gaa3-fe1] }
      - { es: "咖啡定茶呀？", en: "Coffee or tea?", grammar: [g.sik-jam], vocab: [w.gaa3-fe1, w.caa4] }
      - { es: "我哋飲茶。", en: "We're having yum cha.", altEn: ["We're having tea.", "We're having dim sum."], grammar: [g.sik-jam], vocab: [w.jam2-caa4], note: "飲茶 is 'drink tea' and also 'have yum cha' (tea with dim sum)." }
      - { es: "咖啡同茶。", en: "Coffee and tea.", grammar: [g.sik-jam], vocab: [w.gaa3-fe1, w.tung4, w.caa4] }
    exchanges:
      - q: { es: "咖啡定茶呀？", en: "Coffee or tea?" }
        a: { es: "茶，唔該。", en: "Tea, please." }
        alt: ["咖啡，唔該。"]
        grammar: [g.sik-jam, g.mgoi-doze]
        vocab: [w.caa4, w.gaa3-fe1]
      - q: { es: "你飲唔飲咖啡呀？", en: "Would you like a coffee?" }
        a: { es: "飲，唔該。", en: "Yes, please." }
        alt: ["唔飲，多謝。", "唔該。"]
        grammar: [g.sik-jam, g.a-not-a-questions]
        vocab: [w.jam2, w.gaa3-fe1]
      - q: { es: "你飲咩呀？", en: "What would you like to drink?" }
        a: { es: "我飲茶。", en: "I'll have tea." }
        alt: ["我飲咖啡。", "茶，唔該。"]
        grammar: [g.sik-jam]
        vocab: [w.jam2, w.caa4]
    texts:
      - title: "咖啡定茶？"
        es: ["Sam飲咖啡。", "Mandy飲茶。"]
        en: ["Sam drinks coffee.", "Mandy drinks tea."]
        grammar: [g.sik-jam]
        vocab: [w.gaa3-fe1, w.caa4]
  - id: a1.u18.l2
    title: 點心、餃子、菠蘿包
    teach: [g.sik-jam]
    skills: [listen, speak, read]
    tip: "食 sik6 is 'to eat'. 菠蘿包 bo1 lo4 baau1 is a 'pineapple bun', but there's no pineapple inside: the crunchy sugar top just looks like one! 點心 dim2 sam1 is dim sum, 餃子 gaau2 zi2 are dumplings."
    vocab: [w.sik6, w.dim2-sam1, w.gaau2-zi2, w.bo1-lo4-baau1, w.go3]
    sentences:
      - { es: "點心。", en: "Dim sum.", grammar: [g.sik-jam], vocab: [w.dim2-sam1] }
      - { es: "餃子。", en: "Dumplings.", altEn: ["A dumpling."], grammar: [g.sik-jam], vocab: [w.gaau2-zi2] }
      - { es: "菠蘿包。", en: "A pineapple bun.", altEn: ["Pineapple bun.", "Pineapple buns."], grammar: [g.sik-jam], vocab: [w.bo1-lo4-baau1] }
      - { es: "我食點心。", en: "I eat dim sum.", altEn: ["I'm eating dim sum.", "I'm having dim sum."], grammar: [g.sik-jam], vocab: [w.sik6, w.dim2-sam1] }
      - { es: "我食餃子。", en: "I eat dumplings.", altEn: ["I'm eating dumplings.", "I'm having dumplings."], grammar: [g.sik-jam], vocab: [w.sik6, w.gaau2-zi2] }
      - { es: "一個菠蘿包。", en: "One pineapple bun.", altEn: ["A pineapple bun."], grammar: [g.sik-jam, g.classifiers-intro], vocab: [w.bo1-lo4-baau1, w.go3] }
      - { es: "三個菠蘿包。", en: "Three pineapple buns.", grammar: [g.sik-jam, g.classifiers-intro], vocab: [w.bo1-lo4-baau1, w.go3] }
      - { es: "你食菠蘿包呀？", en: "Are you having a pineapple bun?", altEn: ["You're eating a pineapple bun?"], grammar: [g.sik-jam], vocab: [w.sik6, w.bo1-lo4-baau1] }
      - { es: "Bonchita食菠蘿包。", en: "Bonchita eats a pineapple bun.", altEn: ["Bonchita is eating a pineapple bun."], grammar: [g.sik-jam], vocab: [w.sik6, w.bo1-lo4-baau1] }
      - { es: "點心同茶。", en: "Dim sum and tea.", grammar: [g.sik-jam], vocab: [w.dim2-sam1, w.caa4] }
    exchanges:
      - q: { es: "你食咩呀？", en: "What are you having?" }
        a: { es: "我食點心。", en: "I'm having dim sum." }
        alt: ["我食餃子。", "菠蘿包。"]
        grammar: [g.sik-jam]
        vocab: [w.sik6, w.dim2-sam1]
      - q: { es: "你食唔食菠蘿包呀？", en: "Would you like a pineapple bun?" }
        a: { es: "食，唔該。", en: "Yes, please." }
        alt: ["唔食，多謝。", "唔該。"]
        grammar: [g.sik-jam, g.a-not-a-questions]
        vocab: [w.bo1-lo4-baau1]
      - q: { es: "幾多個菠蘿包呀？", en: "How many pineapple buns?" }
        a: { es: "三個。", en: "Three." }
        alt: ["一個。", "兩個。"]
        grammar: [g.classifiers-intro]
        vocab: [w.go3]
    texts:
      - title: "佢哋食咩？"
        es: ["Bonchita食菠蘿包。", "Leo食餃子。", "Luna食點心。"]
        en: ["Bonchita eats a pineapple bun.", "Leo eats dumplings.", "Luna eats dim sum."]
        grammar: [g.sik-jam]
        vocab: [w.bo1-lo4-baau1, w.gaau2-zi2, w.dim2-sam1]
  - id: a1.u18.l3
    title: 牛肉同炒飯
    teach: [g.sik-jam, g.classifiers-intro]
    skills: [listen, speak, read]
    tip: "炒飯 caau2 faan6 is fried rice ('stir-fry rice'). 牛肉 ngau4 juk6 is beef ('cow meat'). Together they make a café classic: 牛肉炒飯, beef fried rice. A plate of something is 一碟 jat1 dip2."
    vocab: [w.ngau4-juk6, w.caau2-faan6, w.dip2]
    sentences:
      - { es: "牛肉。", en: "Beef.", grammar: [g.sik-jam], vocab: [w.ngau4-juk6] }
      - { es: "炒飯。", en: "Fried rice.", grammar: [g.sik-jam], vocab: [w.caau2-faan6] }
      - { es: "牛肉炒飯。", en: "Beef fried rice.", grammar: [g.sik-jam], vocab: [w.ngau4-juk6, w.caau2-faan6] }
      - { es: "一碟炒飯。", en: "A plate of fried rice.", altEn: ["One plate of fried rice.", "One fried rice."], grammar: [g.classifiers-intro], vocab: [w.dip2, w.caau2-faan6] }
      - { es: "我食炒飯。", en: "I eat fried rice.", altEn: ["I'm having fried rice.", "I'm eating fried rice."], grammar: [g.sik-jam], vocab: [w.sik6, w.caau2-faan6] }
      - { es: "我唔食牛肉。", en: "I don't eat beef.", grammar: [g.sik-jam, g.m-negation], vocab: [w.ngau4-juk6] }
      - { es: "牛肉餃子。", en: "Beef dumplings.", grammar: [g.sik-jam], vocab: [w.ngau4-juk6, w.gaau2-zi2] }
      - { es: "咖啡、茶、點心。", en: "Coffee, tea, dim sum.", grammar: [g.sik-jam], vocab: [w.gaa3-fe1, w.caa4, w.dim2-sam1] }
      - { es: "菠蘿包同咖啡。", en: "A pineapple bun and a coffee.", altEn: ["Pineapple bun and coffee."], grammar: [g.sik-jam], vocab: [w.bo1-lo4-baau1, w.gaa3-fe1] }
    exchanges:
      - q: { es: "你食唔食牛肉呀？", en: "Do you eat beef?" }
        a: { es: "唔食，多謝。", en: "No, thank you." }
        alt: ["食，唔該。", "食呀。"]
        grammar: [g.sik-jam, g.a-not-a-questions]
        vocab: [w.ngau4-juk6]
      - q: { es: "你食咩呀？", en: "What are you having?" }
        a: { es: "我食牛肉炒飯。", en: "I'm having beef fried rice." }
        alt: ["炒飯。", "我食炒飯。"]
        grammar: [g.sik-jam]
        vocab: [w.ngau4-juk6, w.caau2-faan6]
      - q: { es: "一碟定兩碟呀？", en: "One plate or two?" }
        a: { es: "一碟，唔該。", en: "One plate, please." }
        alt: ["兩碟，唔該。"]
        grammar: [g.classifiers-intro]
        vocab: [w.dip2]
    texts:
      - title: "食咩好？"
        es: ["我食牛肉炒飯。", "我飲茶。"]
        en: ["I'm having beef fried rice.", "I'm drinking tea."]
        grammar: [g.sik-jam]
        vocab: [w.ngau4-juk6, w.caau2-faan6]
writing:
  - task: "Write what you drink and what you don't drink: 我飲… 唔飲…"
    min: 4
    max: 14
    use: [w.jam2, w.gaa3-fe1, w.caa4]
    useAtLeast: 3
    grammar: [g.sik-jam]
    expect:
      - { pattern: "飲", hint: "Use 飲 for drinks: 我飲…" }
    model: { es: "我飲咖啡，唔飲茶。", en: "I drink coffee, not tea." }
  - task: "You're at yum cha. Write two things you eat, joined with 同."
    min: 5
    max: 14
    use: [w.sik6, w.dim2-sam1, w.gaau2-zi2, w.tung4, w.bo1-lo4-baau1]
    useAtLeast: 3
    grammar: [g.sik-jam]
    expect:
      - { pattern: "食", hint: "Use 食 for food: 我食…" }
      - { pattern: "同", hint: "Join two foods with 同." }
    model: { es: "我食點心同餃子。", en: "I eat dim sum and dumplings." }
  - task: "A friend asks whether you drink coffee or tea. Answer with a number and 杯."
    es: "你飲咖啡定茶呀？"
    min: 4
    max: 12
    use: [w.bui1, w.caa4, w.jam2, w.gaa3-fe1]
    useAtLeast: 2
    grammar: [g.sik-jam, g.classifiers-intro]
    expect:
      - { pattern: "杯", hint: "Count drinks with 杯: 一杯茶." }
    model: { es: "我飲一杯茶。", en: "I'll drink a cup of tea." }
  - task: "Write a short food list with measure words: a plate of fried rice, two pineapple buns and a cup of coffee."
    min: 10
    max: 20
    use: [w.dip2, w.caau2-faan6, w.go3, w.bo1-lo4-baau1, w.bui1]
    useAtLeast: 3
    grammar: [g.classifiers-intro]
    expect:
      - { pattern: "碟炒飯", hint: "A plate of fried rice: 一碟炒飯." }
      - { pattern: "個菠蘿包", hint: "Pineapple buns take 個: 兩個菠蘿包." }
      - { pattern: "杯咖啡", hint: "A cup of coffee: 一杯咖啡." }
    model: { es: "一碟炒飯，兩個菠蘿包，一杯咖啡。", en: "A plate of fried rice, two pineapple buns, a cup of coffee." }
