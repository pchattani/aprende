id: a2.u06
title: "Che cosa farai a Pisa?"
lessons:
  - id: a2.u06.l1
    title: Che cosa farai dopo?
    teach: [g.futuro-semplice]
    vocab: [w.futuro, w.in-futuro, w.sperare, w.pensare, w.promettere, w.trovare-lavoro, w.carriera, w.stipendio, w.colloquio, w.azienda, w.ditta, w.capo, w.dipendente, w.disoccupato]
    tip: "Drop the final -e and add -ò, -ai, -à, -emo, -ete, -anno. -are verbs change a to e: parlare → parlerò. Cercare → cercherò, mangiare → mangerò."
    sentences:
      - { es: "L'estate prossima visiteremo Pisa e Lucca.", en: "Next summer we'll visit Pisa and Lucca.", altEs: ["Visiteremo Pisa e Lucca l'estate prossima."], grammar: [g.futuro-semplice], vocab: [w.visitare, w.prossimo] }
      - { es: "Domani prenderò il treno per Pisa alle nove.", en: "Tomorrow I'll take the train to Pisa at nine.", altEs: ["Domani alle nove prenderò il treno per Pisa."], grammar: [g.futuro-semplice], vocab: [w.prendere, w.treno] }
      - { es: "Ti prometto che ti scriverò ogni giorno.", en: "I promise I'll write to you every day.", altEs: ["Ti prometto che ti scriverò tutti i giorni."], grammar: [g.futuro-semplice, g.indirect-object-pronouns], vocab: [w.promettere, w.scrivere] }
      - { es: "Spero di trovare lavoro a Pisa: così resterò qui.", en: "I hope to find a job in Pisa: that way I'll stay here.", altEs: ["Spero di trovare un lavoro a Pisa: così resterò qui."], grammar: [g.futuro-semplice], vocab: [w.sperare, w.trovare-lavoro] }
      - { es: "Che cosa farai l'anno prossimo? — Penso di restare qui.", en: "What will you do next year? — I'm thinking of staying here.", altEs: ["Cosa farai l'anno prossimo? — Penso di restare qui."], grammar: [g.futuro-semplice], vocab: [w.pensare, w.restare] }
      - { es: "In futuro lavorerò in una grande azienda.", en: "In the future I'll work for a big company.", altEs: ["In futuro lavorerò per una grande azienda."], grammar: [g.futuro-semplice], vocab: [w.in-futuro, w.azienda, w.lavorare] }
      - { es: "Il colloquio comincerà alle dieci in punto.", en: "The interview will start at ten sharp.", altEs: ["Il colloquio inizierà alle dieci in punto."], grammar: [g.futuro-semplice], vocab: [w.colloquio, w.cominciare] }
      - { es: "Con il nuovo stipendio pagheremo l'affitto senza problemi.", en: "With the new salary we'll pay the rent with no problem.", altEs: ["Con il nuovo stipendio pagheremo l'affitto senza nessun problema."], grammar: [g.futuro-semplice], vocab: [w.stipendio, w.pagare, w.affitto] }
      - { es: "A settembre la ditta cercherà nuovi dipendenti.", en: "In September the firm will be looking for new employees.", altEs: ["La ditta cercherà nuovi dipendenti a settembre."], grammar: [g.futuro-semplice], vocab: [w.ditta, w.dipendente, w.cercare] }
      - { es: "Mio fratello è disoccupato, ma troverà lavoro presto.", en: "My brother is unemployed, but he'll find a job soon.", altEs: ["Mio fratello è disoccupato, ma presto troverà lavoro."], grammar: [g.futuro-semplice], vocab: [w.disoccupato, w.trovare-lavoro] }
      - { es: "Farai una bella carriera, sono sicura.", en: "You'll have a great career, I'm sure.", altEs: ["Farai una bella carriera, sono sicuro."], grammar: [g.futuro-irregular], vocab: [w.carriera, w.sicuro] }
      - { es: "Il futuro? Ci penserò dopo l'esame.", en: "The future? I'll think about it after the exam.", altEs: ["Al futuro ci penserò dopo l'esame."], grammar: [g.futuro-semplice], vocab: [w.futuro, w.pensare, w.esame] }
      - { es: "Domani parlerò con il capo.", en: "Tomorrow I'll talk to the boss.", altEs: ["Parlerò con il capo domani."], grammar: [g.futuro-semplice], vocab: [w.parlare, w.capo], error: { wrong: "Domani parlarò con il capo.", explain: "-are verbs change a to e in the future: parlerò.", grammar: g.futuro-semplice } }
      - { es: "Stasera mangeremo in piazza, vicino alla Torre.", en: "Tonight we'll eat in the square, near the Tower.", altEs: ["Stasera mangeremo in piazza vicino alla Torre."], grammar: [g.futuro-semplice], vocab: [w.mangiare, w.stasera], error: { wrong: "Stasera mangieremo in piazza, vicino alla Torre.", explain: "-giare verbs drop the i in the future: mangeremo.", grammar: g.futuro-semplice } }
      - { es: "Domani visito la Torre.", en: "Tomorrow I'm visiting the Tower.", grammar: [g.futuro-semplice, g.present-for-future], vocab: [w.visitare], transform: { instruction: "Use the future tense", answer: "Domani visiterò la Torre.", alt: ["Visiterò la Torre domani."], en: "Tomorrow I'll visit the Tower." } }
      - { es: "Pago io.", en: "I'm paying.", grammar: [g.futuro-semplice], vocab: [w.pagare], transform: { instruction: "Use the future tense: 'I'll pay this time'", answer: "Pagherò io questa volta.", alt: ["Questa volta pagherò io.", "Pagherò io."], en: "I'll pay this time." } }
    exchanges:
      - q: { es: "Che cosa farai dopo l'università?", en: "What will you do after university?" }
        a: { es: "Cercherò lavoro in un'azienda di Pisa.", en: "I'll look for a job at a company in Pisa." }
        alt: ["Viaggerò per un anno.", "Non lo so ancora."]
        grammar: [g.futuro-semplice]
        vocab: [w.azienda]
      - q: { es: "Quando comincerà il colloquio?", en: "When will the interview start?" }
        a: { es: "Alle dieci. Ti chiamerò appena finisce.", en: "At ten. I'll call you as soon as it's over." }
        alt: ["Alle dieci.", "Domani mattina."]
        grammar: [g.futuro-semplice]
        vocab: [w.colloquio]
      - q: { es: "Mi scriverai?", en: "Will you write to me?" }
        a: { es: "Certo, te lo prometto: ti scriverò ogni sera.", en: "Of course, I promise: I'll write to you every evening." }
        alt: ["Sì, promesso!", "Ti telefonerò."]
        grammar: [g.futuro-semplice]
        vocab: [w.promettere]
      - q: { es: "Com'è il nuovo lavoro?", en: "What's the new job like?" }
        a: { es: "Lo stipendio è buono e il capo è simpatico. Speriamo bene!", en: "The salary's good and the boss is nice. Fingers crossed!" }
        alt: ["Benissimo.", "Il capo è antipatico."]
        grammar: [g.essere-present]
        vocab: [w.stipendio, w.capo, w.sperare]
      - q: { es: "A che ora arriverete?", en: "What time will you arrive?" }
        a: { es: "Arriveremo verso le sette, se il treno è in orario.", en: "We'll arrive around seven, if the train's on time." }
        alt: ["Alle sette.", "Tardi, purtroppo."]
        grammar: [g.futuro-semplice]
        vocab: [w.arrivare]
    texts:
      - title: "Messaggio a Marta"
        es: ["Domani avrò il colloquio con l'azienda di Pisa.", "Partirò alle otto e arriverò in centro verso le nove.", "Se va bene, faremo festa con una pizza!"]
        en: ["Tomorrow I've got the interview with the company in Pisa.", "I'll leave at eight and get to the centre around nine.", "If it goes well, we'll celebrate with a pizza!"]
        grammar: [g.futuro-semplice, g.periodo-ipotetico-1]
        vocab: [w.colloquio, w.azienda]
      - title: "Buoni propositi"
        es: ["Quest'anno troverò lavoro e smetterò di dormire fino a mezzogiorno.", "Risparmierò un po' ogni mese.", "E prima o poi visiterò la Torre di Pisa!"]
        en: ["This year I'll find a job and stop sleeping until noon.", "I'll save a bit every month.", "And sooner or later I'll visit the Leaning Tower of Pisa!"]
        grammar: [g.futuro-semplice]
        vocab: [w.trovare-lavoro, w.risparmiare, w.prima-o-poi]
    spicy:
      - { es: "Ti prometto una cosa: stasera pagherò io. Domani paghi tu.", en: "I promise you one thing: tonight I'll pay. Tomorrow you pay.", grammar: [g.futuro-semplice], vocab: [w.promettere, w.pagare] }
      - { es: "In futuro cercherò un capo simpatico come te.", en: "In the future I'll look for a boss as nice as you.", altEs: ["In futuro cercherò una capa simpatica come te."], grammar: [g.futuro-semplice], vocab: [w.in-futuro, w.capo] }
      - { es: "Il colloquio? È andato bene. Ma penserò a te tutto il giorno, non al lavoro.", en: "The interview? It went well. But I'll be thinking about you all day, not about work.", grammar: [g.futuro-semplice], vocab: [w.colloquio, w.pensare] }
      - { es: "Spero di vederti stasera. E domani. E dopodomani.", en: "I hope to see you tonight. And tomorrow. And the day after.", grammar: [g.futuro-semplice], vocab: [w.sperare] }
      - { es: "Ti porterò sulla Torre di Pisa: pende lei, non io.", en: "I'll take you up the Leaning Tower: it's the one that leans, not me.", grammar: [g.futuro-semplice], vocab: [w.portare] }
  - id: a2.u06.l2
    title: Sarò a Pisa per la Luminara
    teach: [g.futuro-irregular]
    vocab: [w.esame, w.corso, w.laurea, w.pensione, w.andare-in-pensione, w.pendere, w.costruzione, w.costruire, w.stabile, w.battistero]
    tip: "Only the stem is irregular: sar-, avr-, andr-, potr-, dovr-, vedr-, far-, verr-, vorr-, berr-, rimarr-. The endings stay the same."
    sentences:
      - { es: "Sarò a Pisa per la Luminara di San Ranieri.", en: "I'll be in Pisa for the Luminara of San Ranieri.", altEs: ["Per la Luminara di San Ranieri sarò a Pisa."], grammar: [g.futuro-irregular], vocab: [w.essere], note: "On the evening of 16 June, thousands of candles light up the buildings along the Arno." }
      - { es: "Che cosa farai dopo la laurea?", en: "What will you do after you graduate?", altEs: ["Cosa farai dopo la laurea?"], altEn: ["What will you do after your degree?"], grammar: [g.futuro-irregular], vocab: [w.laurea, w.fare] }
      - { es: "Verremo a trovarti a Pisa a maggio.", en: "We'll come and see you in Pisa in May.", altEs: ["A maggio verremo a trovarti a Pisa."], grammar: [g.futuro-irregular], vocab: [w.venire] }
      - { es: "Non potrò venire: avrò un esame lunedì.", en: "I won't be able to come: I've got an exam on Monday.", altEs: ["Non potrò venire perché avrò un esame lunedì."], grammar: [g.futuro-irregular], vocab: [w.esame, w.potere] }
      - { es: "Mio padre andrà in pensione tra due anni.", en: "My father will retire in two years.", altEs: ["Tra due anni mio padre andrà in pensione."], grammar: [g.futuro-irregular, g.fra-tra-per], vocab: [w.andare-in-pensione] }
      - { es: "Quando sarai in pensione, che cosa farai tutto il giorno?", en: "When you're retired, what will you do all day?", altEs: ["Che cosa farai tutto il giorno quando sarai in pensione?"], grammar: [g.futuro-irregular], vocab: [w.pensione], note: "After quando about the future, Italian uses the future: quando sarai." }
      - { es: "Dovremo prenotare i biglietti per la Torre.", en: "We'll have to book the tickets for the Tower.", altEs: ["Dovremo prenotare i biglietti della Torre."], grammar: [g.futuro-irregular], vocab: [w.dovere, w.prenotare] }
      - { es: "La Torre pende, ma non cadrà: adesso è stabile.", en: "The Tower leans, but it won't fall: it's stable now.", altEs: ["La Torre pende ma non cadrà, adesso è stabile."], grammar: [g.futuro-irregular], vocab: [w.pendere, w.stabile, w.cadere] }
      - { es: "La costruzione della Torre è cominciata nel 1173.", en: "Construction of the Tower began in 1173.", grammar: [g.passato-prossimo-essere], vocab: [w.costruzione] }
      - { es: "Costruiranno un nuovo ponte sull'Arno.", en: "They'll build a new bridge over the Arno.", altEs: ["Sull'Arno costruiranno un nuovo ponte."], grammar: [g.futuro-semplice], vocab: [w.costruire, w.ponte] }
      - { es: "Vedrai anche il battistero: è il più grande d'Italia.", en: "You'll see the baptistery too: it's the biggest in Italy.", grammar: [g.futuro-irregular], vocab: [w.battistero, w.vedere] }
      - { es: "Rimarremo a Pisa tre giorni e poi andremo a Lucca.", en: "We'll stay in Pisa three days and then go to Lucca.", altEs: ["Resteremo a Pisa tre giorni e poi andremo a Lucca."], grammar: [g.futuro-irregular], vocab: [w.rimanere, w.andare], transform: { instruction: "Change to 'I'", answer: "Rimarrò a Pisa tre giorni e poi andrò a Lucca.", alt: ["Resterò a Pisa tre giorni e poi andrò a Lucca."], en: "I'll stay in Pisa three days and then go to Lucca." } }
      - { es: "Il corso comincerà a ottobre e durerà un anno.", en: "The course will start in October and last a year.", grammar: [g.futuro-semplice], vocab: [w.corso, w.durare] }
      - { es: "Andrò a Pisa in treno.", en: "I'll go to Pisa by train.", altEs: ["Andrò a Pisa con il treno."], grammar: [g.futuro-irregular], vocab: [w.andare], error: { wrong: "Anderò a Pisa in treno.", explain: "andare loses its vowel in the future: andrò, not anderò.", grammar: g.futuro-irregular } }
      - { es: "Verrò con te, se vuoi.", en: "I'll come with you, if you like.", altEs: ["Se vuoi, verrò con te."], grammar: [g.futuro-irregular, g.periodo-ipotetico-1], vocab: [w.venire], error: { wrong: "Verò con te, se vuoi.", explain: "venire has a double r in the future: verrò.", grammar: g.futuro-irregular } }
      - { es: "Ho più tempo.", en: "I have more time.", grammar: [g.futuro-irregular], vocab: [w.tempo], transform: { instruction: "Use the future: 'next year'", answer: "L'anno prossimo avrò più tempo.", alt: ["Avrò più tempo l'anno prossimo."], en: "Next year I'll have more time." } }
    exchanges:
      - q: { es: "Quando sarai a Pisa?", en: "When will you be in Pisa?" }
        a: { es: "Sarò lì sabato, per la Luminara.", en: "I'll be there on Saturday, for the Luminara." }
        alt: ["Sabato.", "Non lo so ancora."]
        grammar: [g.futuro-irregular]
        vocab: [w.essere]
      - q: { es: "Verrai alla festa di laurea di Giulia?", en: "Will you come to Giulia's graduation party?" }
        a: { es: "Purtroppo no: avrò un esame il giorno dopo.", en: "Unfortunately not: I'll have an exam the day after." }
        alt: ["Sì, certo!", "Forse."]
        grammar: [g.futuro-irregular]
        vocab: [w.laurea, w.esame]
      - q: { es: "Quando andrà in pensione tua madre?", en: "When will your mother retire?" }
        a: { es: "L'anno prossimo. Dice che viaggerà in tutto il mondo!", en: "Next year. She says she'll travel all over the world!" }
        alt: ["Tra due anni.", "Non lo so."]
        grammar: [g.futuro-irregular]
        vocab: [w.andare-in-pensione]
      - q: { es: "La Torre cadrà?", en: "Will the Tower fall?" }
        a: { es: "No, dopo i lavori è stabile.", en: "No, after the works it's stable." }
        alt: ["No, non cadrà.", "Speriamo di no!"]
        grammar: [g.futuro-irregular]
        vocab: [w.stabile]
      - q: { es: "Che cosa vedremo domani?", en: "What will we see tomorrow?" }
        a: { es: "Il Duomo, il battistero e, naturalmente, la Torre.", en: "The cathedral, the baptistery and, of course, the Tower." }
        alt: ["La Torre.", "Tutta Piazza dei Miracoli."]
        grammar: [g.futuro-irregular]
        vocab: [w.battistero, w.duomo]
    texts:
      - title: "Il programma"
        es: ["Sabato mattina andremo in Piazza dei Miracoli.", "Saliremo sulla Torre e vedremo il battistero.", "La sera rimarremo sul lungarno per la Luminara."]
        en: ["On Saturday morning we'll go to Piazza dei Miracoli.", "We'll go up the Tower and see the baptistery.", "In the evening we'll stay by the river for the Luminara."]
        grammar: [g.futuro-irregular]
        vocab: [w.battistero]
      - title: "Lettera del nonno"
        es: ["Caro Luca, a giugno andrò finalmente in pensione.", "Avrò tempo per voi e verrò spesso a Pisa.", "Ma non farò il nonno-taxi tutti i giorni!"]
        en: ["Dear Luca, in June I'll finally retire.", "I'll have time for you all and I'll come to Pisa often.", "But I won't be the grandpa-taxi every day!"]
        grammar: [g.futuro-irregular]
        vocab: [w.andare-in-pensione]
    spicy:
      - { es: "Sarò sincero: non sono venuto per la Torre.", en: "I'll be honest: I didn't come for the Tower.", altEs: ["Sarò sincera: non sono venuta per la Torre."], grammar: [g.futuro-irregular], vocab: [w.essere] }
      - { es: "Domani avrò un esame, ma stasera avrò te. Priorità.", en: "Tomorrow I've got an exam, but tonight I've got you. Priorities.", grammar: [g.futuro-irregular], vocab: [w.esame] }
      - { es: "Verrai a cena da me? Farò la pasta. Bene, spero.", en: "Will you come to dinner at mine? I'll make pasta. Well, I hope.", grammar: [g.futuro-irregular], vocab: [w.venire, w.fare] }
      - { es: "La Torre pende da ottocento anni. Io pendo verso di te da dieci minuti.", en: "The Tower has been leaning for eight hundred years. I've been leaning towards you for ten minutes.", grammar: [g.futuro-irregular], vocab: [w.pendere] }
      - { es: "Quando andrò in pensione, vorrò ancora ballare con te.", en: "When I retire, I'll still want to dance with you.", grammar: [g.futuro-irregular], vocab: [w.andare-in-pensione] }
  - id: a2.u06.l3
    title: Che tempo farà?
    teach: [g.futuro-probability]
    vocab: [w.probabilmente, w.sicuramente, w.chissà, w.magari, w.indovinare, w.previsioni-del-tempo, w.temporale, w.nebbia, w.grandine, w.umido, w.afa, w.coperto, w.migliorare, w.peggiorare]
    tip: "The future can mean 'probably' about the present: Che ore saranno? — Saranno le tre. (I wonder what time it is. — It must be about three.)"
    sentences:
      - { es: "Che ore saranno? — Saranno le tre.", en: "I wonder what time it is. — It must be about three.", altEs: ["Che ore sono? — Saranno le tre."], grammar: [g.futuro-probability], vocab: [w.ora], error: { wrong: "Che ore saranno? — Sarà le tre.", explain: "Times use the plural: saranno le tre (but sarà l'una).", grammar: g.futuro-probability } }
      - { es: "Dov'è Luca? — Sarà ancora in biblioteca.", en: "Where's Luca? — He's probably still in the library.", altEs: ["Dov'è Luca? — Sarà ancora alla biblioteca."], altEn: ["Where's Luca? — He must still be in the library."], grammar: [g.futuro-probability], vocab: [w.biblioteca] }
      - { es: "Non risponde: sarà sotto la doccia.", en: "She's not answering: she must be in the shower.", altEs: ["Non risponde, sarà sotto la doccia."], grammar: [g.futuro-probability], vocab: [w.rispondere, w.doccia] }
      - { es: "Quanti anni avrà la Torre? Avrà più di ottocento anni.", en: "How old can the Tower be? It must be over eight hundred years old.", grammar: [g.futuro-probability], vocab: [w.anno] }
      - { es: "Domani probabilmente pioverà.", en: "Tomorrow it will probably rain.", altEs: ["Probabilmente domani pioverà."], grammar: [g.futuro-semplice, g.weather], vocab: [w.probabilmente, w.piovere] }
      - { es: "Le previsioni del tempo dicono che stasera ci sarà un temporale.", en: "The weather forecast says there'll be a thunderstorm this evening.", altEs: ["Secondo le previsioni del tempo, stasera ci sarà un temporale."], grammar: [g.futuro-semplice], vocab: [w.previsioni-del-tempo, w.temporale] }
      - { es: "Stamattina c'è nebbia: l'aereo partirà in ritardo.", en: "There's fog this morning: the plane will leave late.", altEs: ["C'è nebbia stamattina, l'aereo partirà in ritardo."], grammar: [g.futuro-semplice], vocab: [w.nebbia, w.aereo] }
      - { es: "Ieri è caduta la grandine sulle vigne del Chianti.", en: "Yesterday hail fell on the vineyards of Chianti.", altEs: ["Ieri sulle vigne del Chianti è caduta la grandine."], grammar: [g.passato-prossimo-essere], vocab: [w.grandine, w.vigna] }
      - { es: "D'estate a Pisa c'è afa: è tutto umido.", en: "In summer it's muggy in Pisa: everything is damp.", altEs: ["A Pisa d'estate c'è afa e fa un caldo umido."], grammar: [g.weather], vocab: [w.afa, w.umido] }
      - { es: "Il cielo è coperto: sicuramente pioverà.", en: "The sky is overcast: it's definitely going to rain.", altEs: ["Il cielo è coperto, pioverà sicuramente."], grammar: [g.futuro-semplice], vocab: [w.coperto, w.sicuramente, w.cielo] }
      - { es: "Secondo le previsioni, domani il tempo peggiorerà.", en: "According to the forecast, the weather will get worse tomorrow.", grammar: [g.futuro-semplice], vocab: [w.peggiorare] }
      - { es: "Chissà dove sarà Marco adesso.", en: "I wonder where Marco is now.", altEs: ["Chissà dov'è Marco adesso."], altEn: ["Who knows where Marco is now."], grammar: [g.futuro-probability], vocab: [w.chissà] }
      - { es: "Magari domani farà bello e andremo al mare.", en: "Maybe tomorrow it'll be nice and we'll go to the seaside.", altEs: ["Forse domani farà bello e andremo al mare."], grammar: [g.futuro-irregular], vocab: [w.magari, w.mare] }
      - { es: "Indovina: quanti gradini avrà la Torre?", en: "Guess: how many steps do you think the Tower has?", grammar: [g.futuro-probability, g.imperativo-tu], vocab: [w.indovinare, w.gradino] }
      - { es: "Probabilmente è stanco.", en: "He's probably tired.", altEs: ["È stanco, probabilmente."], grammar: [g.futuro-probability], vocab: [w.probabilmente, w.stanco], transform: { instruction: "Use the future to make the guess", answer: "Sarà stanco.", alt: ["Sarà stanco, probabilmente."], en: "He must be tired." } }
      - { es: "Forse ha fame.", en: "Maybe she's hungry.", grammar: [g.futuro-probability], vocab: [w.fame], transform: { instruction: "Use the future to make the guess", answer: "Avrà fame.", en: "She must be hungry." } }
    exchanges:
      - q: { es: "Che tempo farà domani?", en: "What will the weather be like tomorrow?" }
        a: { es: "Le previsioni dicono pioggia al mattino, poi migliorerà.", en: "The forecast says rain in the morning, then it'll improve." }
        alt: ["Farà bello.", "Pioverà, purtroppo."]
        grammar: [g.futuro-semplice]
        vocab: [w.previsioni-del-tempo, w.migliorare]
      - q: { es: "Chi sarà a quest'ora?", en: "Who can that be at this time?" }
        a: { es: "Sarà il vicino: ha sempre bisogno di qualcosa.", en: "It'll be the neighbour: he always needs something." }
        alt: ["Sarà Marco.", "Chissà!"]
        grammar: [g.futuro-probability]
        vocab: [w.chissà]
      - q: { es: "Quanto costerà quella villa?", en: "I wonder how much that villa costs." }
        a: { es: "Costerà almeno due milioni!", en: "It must cost at least two million!" }
        alt: ["Chissà!", "Troppo per noi."]
        grammar: [g.futuro-probability]
        vocab: [w.villa]
      - q: { es: "Perché Giulia non è venuta?", en: "Why didn't Giulia come?" }
        a: { es: "Sarà malata. O magari ha dimenticato!", en: "She must be ill. Or maybe she forgot!" }
        alt: ["Chissà.", "Sarà stanca."]
        grammar: [g.futuro-probability]
        vocab: [w.magari]
      - q: { es: "Prendo l'ombrello?", en: "Shall I take the umbrella?" }
        a: { es: "Sì, il cielo è coperto: sicuramente ci sarà un temporale.", en: "Yes, the sky's overcast: there's definitely going to be a storm." }
        alt: ["Sì, è meglio.", "No, farà bello."]
        grammar: [g.futuro-semplice]
        vocab: [w.coperto, w.temporale]
    texts:
      - title: "Previsioni del tempo"
        es: ["Domani mattina ci sarà nebbia sulla costa.", "Nel pomeriggio il tempo peggiorerà e ci saranno temporali.", "Da domenica migliorerà, ma resterà umido."]
        en: ["Tomorrow morning there will be fog on the coast.", "In the afternoon the weather will get worse and there will be thunderstorms.", "From Sunday it will improve, but it will stay humid."]
        grammar: [g.futuro-semplice]
        vocab: [w.nebbia, w.peggiorare, w.temporale, w.migliorare, w.umido]
      - title: "Dove sarà?"
        es: ["Sono le nove e Marco non è ancora arrivato.", "Sarà nel traffico, o sarà ancora in ufficio.", "Chissà: magari ha perso il treno!"]
        en: ["It's nine o'clock and Marco hasn't arrived yet.", "He must be stuck in traffic, or still at the office.", "Who knows: maybe he's missed the train!"]
        grammar: [g.futuro-probability]
        vocab: [w.chissà, w.magari]
    spicy:
      - { es: "Indovina chi pensa a te in questo momento.", en: "Guess who's thinking about you right now.", grammar: [g.futuro-probability], vocab: [w.indovinare] }
      - { es: "Non risponde... sarà con un'altra? No, sarà sotto la doccia. Spero.", en: "He's not answering... could he be with someone else? No, he must be in the shower. I hope.", altEs: ["Non risponde... sarà con un altro? No, sarà sotto la doccia. Spero."], grammar: [g.futuro-probability], vocab: [w.doccia] }
      - { es: "C'è afa, è vero. Ma forse sei tu che fai caldo.", en: "It's muggy, it's true. But maybe it's you making it hot.", grammar: [g.weather], vocab: [w.afa] }
      - { es: "Le previsioni dicono temporale. Magari restiamo a casa?", en: "The forecast says thunderstorms. Maybe we should stay in?", grammar: [g.futuro-probability], vocab: [w.magari, w.temporale] }
      - { es: "Quanti anni avrai? Trenta? Non importa: sei sicuramente il più bello della piazza.", en: "How old must you be? Thirty? Doesn't matter: you're definitely the best-looking in the square.", altEs: ["Quanti anni avrai? Trenta? Non importa: sei sicuramente la più bella della piazza."], grammar: [g.futuro-probability], vocab: [w.sicuramente] }
  - id: a2.u06.l4
    title: Se farà bel tempo...
    teach: [g.periodo-ipotetico-1]
    vocab: [w.caso, w.prima-o-poi, w.risparmiare, w.mettere-da-parte, w.prestito, w.bolletta, w.sogno, w.desiderio, w.obiettivo, w.intenzione]
    tip: "Real conditions: se + present, present (Se piove, restiamo a casa) or se + future, future (Se pioverà, resteremo a casa). Never the conditional after se here."
    sentences:
      - { es: "Se piove, restiamo a casa.", en: "If it rains, we'll stay at home.", altEs: ["Se piove restiamo a casa.", "Se pioverà, resteremo a casa."], grammar: [g.periodo-ipotetico-1], vocab: [w.piovere, w.restare] }
      - { es: "Se farà bel tempo, andremo al mare a Marina di Pisa.", en: "If the weather's nice, we'll go to the seaside at Marina di Pisa.", altEs: ["Se fa bel tempo, andiamo al mare a Marina di Pisa."], grammar: [g.periodo-ipotetico-1, g.futuro-irregular], vocab: [w.mare] }
      - { es: "Se hai fame, mangia qualcosa!", en: "If you're hungry, eat something!", altEs: ["Mangia qualcosa, se hai fame!"], grammar: [g.periodo-ipotetico-1, g.imperativo-tu], vocab: [w.fame, w.qualcosa] }
      - { es: "Se non studi, non passi l'esame.", en: "If you don't study, you won't pass the exam.", altEs: ["Se non studierai, non passerai l'esame."], grammar: [g.periodo-ipotetico-1], vocab: [w.studiare, w.esame] }
      - { es: "Se risparmieremo, prima o poi compreremo una casa.", en: "If we save, sooner or later we'll buy a house.", altEs: ["Se risparmiamo, prima o poi compriamo una casa."], grammar: [g.periodo-ipotetico-1, g.futuro-semplice], vocab: [w.risparmiare, w.prima-o-poi] }
      - { es: "Se metti da parte cento euro al mese, in estate potrai viaggiare.", en: "If you put aside a hundred euros a month, in the summer you'll be able to travel.", grammar: [g.periodo-ipotetico-1, g.futuro-irregular], vocab: [w.mettere-da-parte, w.viaggiare] }
      - { es: "Se la banca ci darà il prestito, apriremo un ristorante.", en: "If the bank gives us the loan, we'll open a restaurant.", altEs: ["Se la banca ci dà il prestito, apriamo un ristorante."], grammar: [g.periodo-ipotetico-1], vocab: [w.prestito, w.banca] }
      - { es: "Se non paghi la bolletta, ti tagliano la luce!", en: "If you don't pay the bill, they'll cut off your electricity!", altEs: ["Se non pagherai la bolletta, ti taglieranno la luce!"], grammar: [g.periodo-ipotetico-1], vocab: [w.bolletta, w.luce] }
      - { es: "Se per caso vedi Laura, salutala da parte mia.", en: "If by any chance you see Laura, say hi from me.", altEs: ["Se vedi Laura per caso, salutala da parte mia."], grammar: [g.periodo-ipotetico-1, g.imperativo-tu], vocab: [w.caso, w.salutare] }
      - { es: "Il mio sogno è vivere a Pisa: se troverò lavoro qui, resterò.", en: "My dream is to live in Pisa: if I find work here, I'll stay.", grammar: [g.periodo-ipotetico-1], vocab: [w.sogno, w.trovare-lavoro] }
      - { es: "Il mio desiderio per l'anno nuovo? Se studio ogni giorno, parlerò bene l'italiano.", en: "My wish for the new year? If I study every day, I'll speak Italian well.", grammar: [g.periodo-ipotetico-1], vocab: [w.desiderio] }
      - { es: "Il mio obiettivo è finire il corso entro giugno: se ci riesco, faccio una festa!", en: "My goal is to finish the course by June: if I manage it, I'll throw a party!", grammar: [g.periodo-ipotetico-1], vocab: [w.obiettivo, w.entro] }
      - { es: "Non ho intenzione di partire: se resti tu, resto anch'io.", en: "I've no intention of leaving: if you stay, I'll stay too.", grammar: [g.periodo-ipotetico-1], vocab: [w.intenzione] }
      - { es: "Se ho tempo, vengo con te.", en: "If I have time, I'll come with you.", altEs: ["Se avrò tempo, verrò con te."], grammar: [g.periodo-ipotetico-1], vocab: [w.tempo, w.venire], error: { wrong: "Se avrei tempo, vengo con te.", explain: "For a real condition, se takes the present or the future, never the conditional: se ho tempo.", grammar: g.periodo-ipotetico-1 } }
      - { es: "Piove. Restiamo a casa.", en: "It's raining. We're staying at home.", grammar: [g.periodo-ipotetico-1], vocab: [w.piovere], transform: { instruction: "Join the two sentences with se", answer: "Se piove, restiamo a casa.", alt: ["Se pioverà, resteremo a casa."], en: "If it rains, we'll stay at home." } }
      - { es: "Se hai tempo, vieni.", en: "If you've got time, come.", grammar: [g.periodo-ipotetico-1], vocab: [w.venire], transform: { instruction: "Put both halves in the future", answer: "Se avrai tempo, verrai.", en: "If you have time, you'll come." } }
    exchanges:
      - q: { es: "Che cosa farete domani?", en: "What will you do tomorrow?" }
        a: { es: "Se fa bello, andiamo al mare; se piove, visitiamo la Torre.", en: "If it's nice, we'll go to the seaside; if it rains, we'll visit the Tower." }
        alt: ["Dipende dal tempo.", "Se fa bello, andremo al mare."]
        grammar: [g.periodo-ipotetico-1]
        vocab: [w.mare]
      - q: { es: "Mi presti cinquanta euro?", en: "Will you lend me fifty euros?" }
        a: { es: "Sì, se mi restituisci i soldi venerdì.", en: "Yes, if you give me the money back on Friday." }
        alt: ["Sì, ma è un prestito!", "Non posso, devo pagare le bollette."]
        grammar: [g.periodo-ipotetico-1]
        vocab: [w.prestito, w.restituire]
      - q: { es: "Qual è il tuo sogno?", en: "What's your dream?" }
        a: { es: "Aprire un piccolo albergo. Se risparmio, prima o poi ci riuscirò.", en: "To open a small hotel. If I save, sooner or later I'll manage it." }
        alt: ["Vivere in Toscana.", "Fare il giro del mondo."]
        grammar: [g.periodo-ipotetico-1]
        vocab: [w.sogno, w.risparmiare, w.prima-o-poi]
      - q: { es: "Hai intenzione di cambiare lavoro?", en: "Do you intend to change jobs?" }
        a: { es: "Se trovo qualcosa di meglio, sì.", en: "If I find something better, yes." }
        alt: ["No, per ora no.", "Prima o poi."]
        grammar: [g.periodo-ipotetico-1]
        vocab: [w.intenzione]
      - q: { es: "E se perdiamo il treno?", en: "And if we miss the train?" }
        a: { es: "Se perdiamo il treno, prenderemo l'autobus.", en: "If we miss the train, we'll take the bus." }
        alt: ["Prendiamo un taxi.", "Aspettiamo il prossimo."]
        grammar: [g.periodo-ipotetico-1]
        vocab: [w.perdere]
    texts:
      - title: "Il nostro piano"
        es: ["Il nostro obiettivo è una casa vicino al mare.", "Se mettiamo da parte trecento euro al mese, in cinque anni avremo abbastanza.", "Se la banca ci darà un prestito, sarà ancora prima!"]
        en: ["Our goal is a house near the sea.", "If we put aside three hundred euros a month, in five years we'll have enough.", "If the bank gives us a loan, it'll be even sooner!"]
        grammar: [g.periodo-ipotetico-1]
        vocab: [w.obiettivo, w.mettere-da-parte, w.prestito]
      - title: "Nota sul frigo"
        es: ["Se esci, compra il pane.", "Se vedi il postino, chiedi della bolletta.", "E se torni prima delle otto, cuciniamo insieme!"]
        en: ["If you go out, buy some bread.", "If you see the postman, ask about the bill.", "And if you're back before eight, we'll cook together!"]
        grammar: [g.periodo-ipotetico-1]
        vocab: [w.bolletta]
    spicy:
      - { es: "Se mi dai il tuo numero, ti prometto un messaggio solo al giorno.", en: "If you give me your number, I promise just one message a day.", grammar: [g.periodo-ipotetico-1], vocab: [w.promettere] }
      - { es: "Se stasera piove, ti presto il mio ombrello. E la mia giacca. E il mio divano.", en: "If it rains tonight, I'll lend you my umbrella. And my jacket. And my sofa.", grammar: [g.periodo-ipotetico-1], vocab: [w.prestare, w.ombrello] }
      - { es: "Il mio sogno? Una cena con te. Se dici di sì, il sogno diventa un piano.", en: "My dream? Dinner with you. If you say yes, the dream becomes a plan.", grammar: [g.periodo-ipotetico-1], vocab: [w.sogno] }
      - { es: "Non ho intenzione di andare via. Se vai via tu, vengo con te.", en: "I've no intention of leaving. If you go, I'm coming with you.", grammar: [g.periodo-ipotetico-1], vocab: [w.intenzione] }
      - { es: "Prima o poi mi inviterai a cena. Se vuoi, anche prima.", en: "Sooner or later you'll invite me to dinner. If you like, even sooner.", grammar: [g.periodo-ipotetico-1, g.futuro-semplice], vocab: [w.prima-o-poi] }
dialogues:
  - id: a2.u06.d1
    title: Dopo la laurea
    context: Irene and Federico, two students at the University of Pisa, are waiting for a friend near the Leaning Tower.
    lines:
      - { speaker: Irene, es: "Allora, Federico, che cosa farai dopo la laurea?", en: "So, Federico, what will you do after you graduate?" }
      - { speaker: Federico, es: "Se tutto va bene, mi laureerò a luglio e poi cercherò lavoro a Milano.", en: "If all goes well, I'll graduate in July and then look for a job in Milan." }
      - { speaker: Irene, es: "A Milano? Pisa ti mancherà!", en: "Milan? You'll miss Pisa!" }
      - { speaker: Federico, es: "Sicuramente. Ma lo stipendio sarà più alto. E tu?", en: "Definitely. But the salary will be higher. What about you?" }
      - { speaker: Irene, es: "Io resterò qui: farò un corso all'università e magari insegnerò.", en: "I'll stay here: I'll do a course at the university and maybe I'll teach." }
      - { speaker: Federico, es: "Senti, dov'è Marco? Doveva arrivare alle sei.", en: "Listen, where's Marco? He was supposed to arrive at six." }
      - { speaker: Irene, es: "Saranno le sei e mezza... sarà ancora in biblioteca, come sempre.", en: "It must be half past six... he'll still be in the library, as always." }
      - { speaker: Federico, es: "O sarà sotto la Torre a fare la foto classica con i turisti!", en: "Or he'll be under the Tower taking the classic photo with the tourists!" }
      - { speaker: Irene, es: "Se non arriva tra dieci minuti, andiamo a cena senza di lui.", en: "If he doesn't arrive in ten minutes, we'll go to dinner without him." }
      - { speaker: Federico, es: "D'accordo. Ma se arriva, paga lui!", en: "OK. But if he turns up, he's paying!" }
    questions:
      - { q: "Quando si laureerà Federico?", options: ["A giugno", "A luglio", "A settembre"], answer: 1, explain: "Mi laureerò a luglio." }
      - { q: "Dove cercherà lavoro Federico?", options: ["A Pisa", "A Milano", "A Firenze"], answer: 1, explain: "Poi cercherò lavoro a Milano." }
      - { q: "Che cosa farà Irene?", options: ["Andrà a Milano", "Resterà a Pisa e farà un corso", "Cercherà lavoro a Firenze"], answer: 1, explain: "Io resterò qui: farò un corso all'università." }
      - { q: "Secondo Irene, dov'è Marco?", options: ["In biblioteca", "A casa", "Sul treno"], answer: 0, explain: "Sarà ancora in biblioteca, come sempre." }
writing:
  - task: "Write about your plans after this trip: what you will do next year, with your studies or your work, and what you hope for."
    min: 30
    max: 65
    use: [w.futuro, w.sperare, w.trovare-lavoro, w.esame, w.laurea]
    grammar: [g.futuro-semplice, g.futuro-irregular]
    expect:
      - { pattern: "\\S+(rò|rai|rà|remo|rete|ranno)(?![a-zà-ù])", hint: "Use the future: tornerò, farò, sarà…" }
    model: { es: "Dopo questo viaggio tornerò a Londra e finirò l'università. L'anno prossimo farò gli ultimi esami e, se tutto va bene, prenderò la laurea a giugno. Poi spero di trovare lavoro in Italia: sarà difficile, ma ci proverò!", en: "After this trip I'll go back to London and finish university. Next year I'll take my last exams and, if all goes well, I'll graduate in June. Then I hope to find work in Italy: it'll be hard, but I'll try!" }
  - task: "Write the weather forecast for Tuscany for tomorrow and the weekend."
    min: 30
    max: 65
    use: [w.previsioni-del-tempo, w.nebbia, w.temporale, w.migliorare, w.probabilmente]
    grammar: [g.futuro-semplice, g.futuro-probability]
    expect:
      - { pattern: "\\b(pioverà|nevicherà|farà|ci sarà|ci saranno|sarà|migliorerà|peggiorerà)", hint: "Describe the weather in the future: pioverà, farà caldo, ci sarà il sole…" }
      - { pattern: "\\b(domani|sabato|domenica|fine settimana|weekend)\\b", hint: "Say when: domani, sabato, nel fine settimana…" }
    model: { es: "Previsioni del tempo per la Toscana: domani mattina ci sarà nebbia in campagna, ma nel pomeriggio il tempo migliorerà. Sabato farà caldo, circa trenta gradi. Domenica probabilmente ci saranno temporali sulla costa, quindi portate l'ombrello!", en: "Weather forecast for Tuscany: tomorrow morning there will be fog in the countryside, but in the afternoon the weather will improve. On Saturday it will be hot, about thirty degrees. On Sunday there will probably be storms on the coast, so take an umbrella!" }
  - task: "Your friend Marco is late and doesn't answer the phone. Write 3–4 guesses about where he is and what he is doing, using the future of probability."
    es: "Marco è in ritardo di un'ora e non risponde al telefono!"
    min: 25
    max: 60
    use: [w.chissà, w.forse, w.magari, w.sicuramente, w.probabilmente]
    grammar: [g.futuro-probability]
    expect:
      - { pattern: "\\b(sarà|saranno|avrà|avranno|starà|staranno|dormirà|farà|arriverà)", hint: "Guess with the future: sarà in treno, starà dormendo…" }
    model: { es: "Chissà dov'è Marco! Sarà ancora in treno, perché ci sono sempre ritardi. O forse starà dormendo: ieri sera è tornato tardi. Avrà il telefono in borsa e non lo sentirà. Magari arriverà tra dieci minuti!", en: "Who knows where Marco is! He's probably still on the train, because there are always delays. Or maybe he's sleeping: he came home late last night. He must have his phone in his bag and can't hear it. Maybe he'll arrive in ten minutes!" }
  - task: "Write about your plans for the weekend and for the future, depending on the weather and your money: use se + future (Se farà bel tempo, …)."
    min: 30
    max: 65
    use: [w.sogno, w.risparmiare, w.prima-o-poi, w.desiderio]
    useAtLeast: 2
    grammar: [g.periodo-ipotetico-1, g.futuro-semplice]
    expect:
      - { pattern: "\\bse\\b", hint: "Use se for conditions: Se farà bel tempo, …" }
      - { pattern: "\\S+(rò|rai|rà|remo|rete|ranno)(?![a-zà-ù])", hint: "Use the future in the result: andrò, resteremo…" }
    model: { es: "Se sabato farà bel tempo, andrò a Pisa con Giulia e saliremo sulla Torre. Se pioverà, resteremo a casa e guarderemo un film. Il mio sogno è fare un viaggio in Sicilia: se risparmierò un po' di soldi, prima o poi ci andrò!", en: "If the weather is nice on Saturday, I'll go to Pisa with Giulia and we'll climb the Tower. If it rains, we'll stay at home and watch a film. My dream is to take a trip to Sicily: if I save a bit of money, sooner or later I'll go there!" }
