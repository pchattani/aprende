id: r.c2.un-dia-en-tres-registros
level: c2
title: Un día en tres registros
kind: text
intro: In a single day the narrator meets the medical, the technical and the bureaucratic register, and learns to translate each of them into plain Spanish.
allow: [hacienda, laura, dni]
paragraphs:
  - { es: "El martes empezó en el hospital. Mi padre llevaba una semana con molestias en el pecho y, tras una analítica y un electrocardiograma, la cardióloga nos reunió en su despacho. Habló primero para el informe y después para nosotros: «Se observa una leve inflamación sin signos de infarto; no procede el ingreso». Y luego, mirándonos: «Está bien. Es una inflamación del músculo, no del corazón. Se va a casa hoy».", en: "Tuesday began at the hospital. My father had had chest discomfort for a week and, after a blood test and an electrocardiogram, the cardiologist gathered us in her office. She spoke first for the report and then for us: 'A mild inflammation is observed without signs of infarction; admission is not indicated.' And then, looking at us: 'He's fine. It's an inflammation of the muscle, not the heart. He's going home today.'" }
  - { es: "Me fijé en la doble lengua. Para la historia clínica, impersonal y exacta: se observa, no procede, dosis de 500 mg cada ocho horas. Para el paciente, frases cortas en segunda persona y palabras de todos los días: pecho, músculo, casa. La misma mujer, el mismo diagnóstico, dos registros. Le dieron el alta a las doce.", en: "I noticed the double language. For the clinical record, impersonal and exact: it is observed, it is not indicated, a dose of 500 mg every eight hours. For the patient, short sentences in the second person and everyday words: chest, muscle, home. The same woman, the same diagnosis, two registers. He was discharged at twelve." }
  - { es: "A las cuatro, en la oficina, se cayó el servidor. El correo dejó de funcionar y el desarrollador de guardia nos envió un aviso que nadie entendió: «Fallo en el despliegue de la actualización; se procede a restaurar la copia de seguridad y a reiniciar los servicios. Tiempo estimado: 40 minutos. No cerrar sesión». Mi compañera Laura preguntó en voz alta qué significaba todo aquello.", en: "At four, in the office, the server went down. The email stopped working and the developer on duty sent us a notice that nobody understood: 'Failure in the deployment of the update; the backup is being restored and services restarted. Estimated time: 40 minutes. Do not log out.' My colleague Laura asked out loud what all that meant." }
  - { es: "Se lo traduje: han actualizado el programa, algo ha salido mal, vuelven a la versión de ayer y en cuarenta minutos funciona; mientras tanto, no toques nada. Me di cuenta de que el registro técnico no es difícil por las palabras, que casi todas son transparentes, sino por la forma: infinitivos, pasivas con se, sustantivos donde nosotros pondríamos verbos. Es un lenguaje para máquinas y para quien habla con ellas.", en: "I translated it for her: they've updated the program, something has gone wrong, they're going back to yesterday's version and in forty minutes it will work; in the meantime, don't touch anything. I realised that the technical register is not difficult because of the words, almost all of which are transparent, but because of the form: infinitives, passives with se, nouns where we would put verbs. It is a language for machines and for those who talk to them." }
  - { es: "Al volver a casa me esperaba la tercera lengua del día: una carta de Hacienda. «Se le requiere para que, en el plazo de diez días hábiles a contar desde el siguiente a la notificación, subsane la documentación aportada, aportando copia compulsada del DNI del solicitante. Transcurrido dicho plazo sin que se haya procedido a la subsanación, se le tendrá por desistido de su solicitud».", en: "When I got home the third language of the day was waiting for me: a letter from the tax office. 'You are required, within ten working days counting from the day after notification, to rectify the documentation submitted, providing a certified copy of the applicant's ID card. Once this period has elapsed without the rectification having been carried out, you will be deemed to have withdrawn your application.'" }
  - { es: "Leí el párrafo tres veces. Luego lo pasé a lenguaje claro, como habría hecho la cardióloga: falta una copia compulsada de mi DNI; tengo diez días laborables para llevarla; si no la llevo, pierdo la solicitud. Tres frases, cero misterios. ¿Por qué no lo escriben así? Por costumbre, por miedo a equivocarse y porque la fórmula de siempre parece más segura que la frase clara.", en: "I read the paragraph three times. Then I turned it into plain language, as the cardiologist would have done: a certified copy of my ID card is missing; I have ten working days to bring it; if I don't, I lose the application. Three sentences, zero mysteries. Why don't they write it like that? Out of habit, out of fear of making a mistake and because the usual formula seems safer than the clear sentence." }
  - { es: "Esa noche pensé que los tres registros tienen algo en común: existen para ser precisos entre especialistas y se vuelven un muro cuando salen de ese círculo. La diferencia está en quién se toma la molestia de traducir. La cardióloga lo hizo sola; al desarrollador lo traduje yo; a Hacienda, nadie. Al día siguiente pedí cita previa en la sede electrónica, compulsé la copia en la ventanilla tres y, por si las moscas, guardé una foto del resguardo en la nube.", en: "That night I thought that the three registers have something in common: they exist to be precise among specialists and become a wall when they leave that circle. The difference lies in who takes the trouble to translate. The cardiologist did it herself; the developer I translated; the tax office, nobody. The next day I booked an appointment on the online portal, had the copy certified at counter three and, just in case, saved a photo of the receipt to the cloud." }
questions:
  - { q: "How does the cardiologist change her language for the family?", options: ["She speaks louder", "She uses short second-person sentences and everyday words", "She uses more Latin terms"], answer: 1 }
  - { q: "What does the narrator say makes the technical register hard?", options: ["Its vocabulary, which is opaque", "Its form: infinitives, se-passives and nouns instead of verbs", "Its English words"], answer: 1 }
  - { q: "What does the letter from Hacienda actually require?", options: ["Payment of a fee", "A certified copy of the ID card within ten working days", "Attendance at an interview"], answer: 1 }
  - { q: "What happens if the narrator does not respond in time?", options: ["A fine is applied", "The application is considered withdrawn", "Nothing"], answer: 1 }
  - { q: "Who translated each register, according to the final paragraph?", options: ["The cardiologist herself, the narrator for the developer, nobody for the tax office", "The narrator in all three cases", "Nobody"], answer: 0 }
glossary:
  - { es: historia clínica, en: medical record }
  - { es: músculo, en: muscle }
  - { es: estimado, en: estimated }
  - { es: restaurar, en: to restore }
  - { es: transparente, en: transparent, self-evident }
  - { es: transcurrido, en: having elapsed }
  - { es: dicho, en: said, the aforementioned }
  - { es: desistir, en: to withdraw, to desist }
  - { es: laborable, en: working (day) }
  - { es: fórmula, en: formula, set phrase }
  - { es: círculo, en: circle }
  - { es: resguardo, en: receipt, proof of submission }
