id: r.b1.exam-week-in-sha-tin
level: b1
title: 做完功課先出街
kind: text
intro: Wing-si, a Form Four student in Sha Tin, writes in her diary during exam week - the revision she has finished, the mistakes she has made, and a promise to her grandmother at Che Kung Temple.
paragraphs:
  - { es: "三月十號，星期一。聽日就開始考試，今晚我一定要溫晒中文同英文。媽媽話：「你溫完書先可以玩電話。」所以佢將我部手機收埋咗喺佢間房。我覺得好唔公平，但係我知佢講得啱。", en: "Monday, 10 March. The exams start tomorrow, and tonight I absolutely have to finish revising Chinese and English. Mum said: \"You can play with your phone after you've finished revising.\" So she has hidden my phone in her room. I think it's really unfair, but I know she's right." }
  - { es: "我由七點溫到十一點，終於溫完中文。英文仲有好多生字未記低，我寫低咗喺一本細簿度，聽朝喺巴士上面再睇。我好眼瞓，寫字寫到成張紙都係錯字。算啦，瞓醒先講。", en: "I revised from seven until eleven and finally finished Chinese. There are still lots of English words I haven't memorised. I've written them down in a little notebook to look at again on the bus tomorrow morning. I'm so sleepy that the whole page is full of mistakes. Never mind, I'll deal with it after I've slept." }
  - { es: "三月十一號，星期二。今日考中文。我七點就醒咗，但係我啲同學仲早，阿詩話佢五點就起身溫書。考試嘅時候，我睇錯咗一條題目，答錯咗。出到課室，美琪同我講正確嘅答案，我先發現自己搞錯咗。好嬲呀！", en: "Tuesday, 11 March. Today was the Chinese exam. I woke up at seven, but my classmates were even earlier: Ah Si said she got up at five to revise. In the exam I misread one question and got it wrong. When I got out of the classroom, Mei-kei told me the correct answer and only then did I realise I'd made a mistake. So annoying!" }
  - { es: "下晝考英文。好彩我喺巴士上面睇咗啲生字，有幾個真係喺試卷度出現！不過最後一部分係聆聽，我聽唔清楚，有幾題要估。考完試，全班同學都好攰，有啲人仲喺課室瞓着咗。", en: "In the afternoon there was the English exam. Luckily I had looked at the vocabulary on the bus, and a few of the words really did come up! But the last part was listening, and I couldn't hear it clearly, so I had to guess a few questions. After the exam the whole class was exhausted, and some people even fell asleep in the classroom." }
  - { es: "三月十二號，星期三。今日考數學，係我最怕嘅一科。我做晒所有題目之後，仲有十五分鐘，所以我由頭到尾檢查咗一次，發現原來計錯咗兩題！我即刻改啱佢哋，好彩冇交白卷。坐我前面嘅家俊就冇咁好彩，佢太緊張，寫錯咗自己個名，交咗卷先發現。", en: "Wednesday, 12 March. Today was maths, the subject I'm most afraid of. After I'd done all the questions I still had fifteen minutes left, so I checked everything from start to finish, and I actually found two calculations I'd got wrong! I corrected them straight away. Lucky I checked. Ka-chun, who sits in front of me, wasn't so lucky: he was so nervous he wrote his own name wrong, and only noticed after handing in his paper." }
  - { es: "三月十四號，星期五。今日終於考完晒！成個禮拜我都冇點瞓過，而家只係想瞓三日三夜。放學之後，我同阿詩、美琪去沙田新城市廣場食雪糕、睇戲。我哋講好咗，派成績表之前，唔講考試嘅嘢。", en: "Friday, 14 March. The exams are finally all over today! I hardly slept all week, and now I just want to sleep for three days and three nights. After school, Ah Si, Mei-kei and I went to New Town Plaza in Sha Tin for ice cream and a film. We agreed not to talk about the exams until the report cards come out." }
  - { es: "夜晚，嫲嫲問我考成點。我話：「中文唔係幾好，英文應該合格。」嫲嫲話：「唔緊要，你盡力做咗就得喇。新年我哋去車公廟轉風車，車公會保佑你㗎！」每年年初二，好多人去沙田車公廟轉風車，希望新一年有好運。", en: "In the evening Grandma asked me how the exams went. I said: \"Chinese wasn't great, but I should pass English.\" Grandma said: \"Never mind, as long as you did your best. At New Year we'll go to Che Kung Temple and turn the windmill, and Che Kung will protect you!\" Every year on the second day of Chinese New Year, many people go to Che Kung Temple in Sha Tin and turn the windmill, hoping for good luck in the new year." }
  - { es: "我答應咗嫲嫲：明年我一定會早啲開始溫書，唔會等到考試前一晚先做。不過我諗我舊年都係噉講……", en: "I promised Grandma that next year I'll definitely start revising earlier and won't wait until the night before an exam. Though I think I said exactly the same thing last year..." }
questions:
  - { q: "點解媽媽將詠詩部手機收埋？", options: ["因為部手機整爛咗", "因為佢想詠詩溫完書先玩", "因為詠詩唔記得交功課"], answer: 1, explain: "你溫完書先可以玩電話: the phone comes back only after the revision is done." }
  - { q: "詠詩考中文嗰陣有咩問題？", options: ["佢遲到", "佢睇錯咗一條題目", "佢唔記得帶筆"], answer: 1, explain: "我睇錯咗一條題目，答錯咗." }
  - { q: "點解有幾個英文生字幫到佢？", options: ["因為佢喺巴士上面溫過", "因為美琪教佢", "因為老師講咗答案"], answer: 0, explain: "好彩我喺巴士上面睇咗啲生字，有幾個真係喺試卷度出現." }
  - { q: "考完試之後，詠詩同朋友講好咗乜嘢？", options: ["一齊去旅行", "派成績表之前唔講考試", "每日一齊溫書"], answer: 1, explain: "派成績表之前，唔講考試嘅嘢." }
  - { q: "車公廟轉風車係幾時嘅習俗？", options: ["年初一", "年初二", "中秋節"], answer: 1, explain: "每年年初二，好多人去沙田車公廟轉風車." }
  - { q: "最後一段話我哋知道啲乜嘢？", options: ["詠詩舊年都講過一樣嘅嘢", "詠詩已經開始溫明年嘅書", "嫲嫲唔相信詠詩"], answer: 0, explain: "The ending is a joke: 我諗我舊年都係噉講 - she made the same promise last year." }
glossary:
  - { es: 聆聽, en: listening (exam paper) }
  - { es: 正確, en: correct }
  - { es: 新城市廣場, en: New Town Plaza (shopping mall in Sha Tin) }
  - { es: 成績表, en: report card }
  - { es: 盡力, en: "to do one's best" }
  - { es: 保佑, en: "to protect, bless (of a god)" }
  - { es: 試卷, en: exam paper }
  - { es: 出現, en: to appear }
  - { es: 改, en: to correct }
