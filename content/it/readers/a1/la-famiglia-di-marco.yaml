id: r.a1.la-famiglia-di-marco
level: a1
title: La famiglia di Marco
kind: text
intro: Marco, a cook from Testaccio, describes his family and the flat where they all live.
allow: [marco, giulia, sofia, pietro, anna, testaccio, ostia]
paragraphs:
  - { es: "Buongiorno! Mi chiamo Marco, ho trentotto anni e sono romano. Sono cuoco: lavoro in una trattoria a Testaccio, un quartiere vecchio e molto famoso di Roma. Qui la gente ama mangiare bene!", en: "Good morning! My name is Marco, I'm thirty-eight and I'm from Rome. I'm a cook: I work in a trattoria in Testaccio, an old and very famous neighbourhood of Rome. People here love eating well!" }
  - { es: "Mia moglie si chiama Giulia. Ha trentasei anni ed è infermiera in un ospedale vicino a casa. Abbiamo due figli: Sofia ha dieci anni e Pietro ha sei anni. Sofia è bionda come la mamma ed è molto sportiva. Pietro è moro, piccolo e un po' timido, ma a casa è molto divertente.", en: "My wife's name is Giulia. She's thirty-six and she's a nurse in a hospital near home. We have two children: Sofia is ten and Pietro is six. Sofia is blond like her mum and very sporty. Pietro is dark-haired, small and a bit shy, but at home he's very funny." }
  - { es: "Anche mia madre, Anna, abita con noi. Ha settantadue anni. Mio padre non c'è più. La nonna è molto brava in cucina e la domenica prepara la pasta per tutta la famiglia. Ho anche una sorella, ma lei abita a Ostia, vicino al mare, con suo marito e i suoi tre figli.", en: "My mother, Anna, lives with us too. She's seventy-two. My father has passed away. Grandma is very good in the kitchen and on Sundays she makes pasta for the whole family. I also have a sister, but she lives in Ostia, near the sea, with her husband and her three children." }
  - { es: "La nostra casa è un appartamento al terzo piano di un palazzo vecchio. Non c'è l'ascensore! C'è una cucina grande, un soggiorno con un divano rosso, tre camere da letto e due bagni. Il balcone è piccolo, ma è pieno di piante: sono della nonna.", en: "Our home is a flat on the third floor of an old building. There's no lift! There's a big kitchen, a living room with a red sofa, three bedrooms and two bathrooms. The balcony is small, but it's full of plants: they're Grandma's." }
  - { es: "Il quartiere è tranquillo e comodo. Sotto casa ci sono un bar, una farmacia e un supermercato, e la scuola dei bambini è a cinque minuti. Il mercato di Testaccio è vicino: lì la nonna compra frutta e verdura. Per me Testaccio è il posto più bello di Roma!", en: "The neighbourhood is quiet and convenient. Downstairs there's a bar, a pharmacy and a supermarket, and the children's school is five minutes away. The Testaccio market is nearby: Grandma buys fruit and vegetables there. For me Testaccio is the most beautiful place in Rome!" }
questions:
  - { q: "Che lavoro fa Marco?", options: ["È medico", "È cuoco", "È infermiere"], answer: 1, explain: "«Sono cuoco: lavoro in una trattoria a Testaccio.» It's his wife Giulia who is a nurse." }
  - { q: "Quanti figli hanno Marco e Giulia?", options: ["Uno", "Due", "Tre"], answer: 1, explain: "«Abbiamo due figli»: Sofia and Pietro. The three children belong to Marco's sister." }
  - { q: "Chi prepara la pasta la domenica?", options: ["Marco", "Giulia", "La nonna"], answer: 2, explain: "Marco's mother Anna, «la nonna», cooks pasta for everyone on Sundays." }
  - { q: "Dove abita la sorella di Marco?", options: ["A Testaccio", "A Ostia", "A Trastevere"], answer: 1, explain: "«Lei abita a Ostia, vicino al mare.»" }
  - { q: "Che cosa c'è sul balcone?", options: ["Molte piante", "Un divano rosso", "Un tavolo grande"], answer: 0, explain: "The balcony is small «ma è pieno di piante». The red sofa is in the living room." }
glossary:
  - { es: ospedale, en: hospital }
  - { es: "non c'è più", en: has passed away (lit. is no longer here) }
  - { es: pieno, en: full }
  - { es: piante, en: plants }
