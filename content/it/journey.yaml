# The journey: regions (one per level), stops (one per unit, in unit order), souvenirs.
# Text in `es` is the target language (Italian here); `en` is English.
regions:
  - level: a1
    name: Roma
    es: La Città Eterna
    stops:
      - name: Fiumicino
        emoji: 🛬
        es: Ciao, Italia!
        en: Hello, Italy!
        fact:
          es: "L'aeroporto di Fiumicino si chiama anche Leonardo da Vinci. È il più grande aeroporto d'Italia. È vicino al mare, a circa 30 km da Roma."
          en: "Fiumicino airport is also called Leonardo da Vinci. It is the biggest airport in Italy. It is near the sea, about 30 km from Rome."
      - name: Colosseo
        emoji: 🏟️
        es: Il gigante di pietra
        en: The stone giant
        fact:
          es: "Il Colosseo è molto antico: apre nell'anno 80. Ha posto per circa 50.000 persone. Oggi milioni di persone lo visitano ogni anno."
          en: "The Colosseum is very old: it opens in the year 80. It has room for about 50,000 people. Today millions of people visit it every year."
      - name: Foro Romano
        emoji: 🏛️
        es: Il cuore di Roma antica
        en: The heart of ancient Rome
        fact:
          es: "Il Foro Romano è il centro della Roma antica. È tra il Palatino e il Campidoglio. Qui ci sono templi, archi e strade di pietra."
          en: "The Roman Forum is the centre of ancient Rome. It is between the Palatine and the Capitoline hill. Here there are temples, arches and stone streets."
      - name: Trastevere
        emoji: 🍝
        es: Cena in trattoria
        en: Dinner in a trattoria
        fact:
          es: "Trastevere è un quartiere di Roma. Il nome significa «oltre il Tevere», il fiume di Roma. Ha strade piccole, piazze e molte trattorie."
          en: "Trastevere is a neighbourhood of Rome. The name means “beyond the Tiber”, the river of Rome. It has small streets, squares and lots of trattorias."
      - name: Fontana di Trevi
        emoji: 🪙
        es: Una moneta nella fontana
        en: A coin in the fountain
        fact:
          es: "La Fontana di Trevi è la fontana più famosa di Roma. Ogni giorno le persone lanciano monete nell'acqua. Le monete vanno alla Caritas, per le persone povere."
          en: "The Trevi Fountain is the most famous fountain in Rome. Every day people throw coins into the water. The coins go to Caritas, for poor people."
      - name: Piazza Navona
        emoji: ⛲
        es: Tre fontane in piazza
        en: Three fountains in the square
        fact:
          es: "Piazza Navona ha la forma di uno stadio antico, lo Stadio di Domiziano. Ha tre fontane. Al centro c'è la Fontana dei Quattro Fiumi di Bernini."
          en: "Piazza Navona has the shape of an ancient stadium, the Stadium of Domitian. It has three fountains. In the centre is Bernini's Fountain of the Four Rivers."
      - name: Pantheon
        emoji: ☀️
        es: Un buco nel tetto
        en: A hole in the roof
        fact:
          es: "Il Pantheon ha più di 1.800 anni. Ha una grande cupola con un buco in alto, l'oculo. Quando piove, l'acqua entra nella chiesa."
          en: "The Pantheon is more than 1,800 years old. It has a big dome with a hole at the top, the oculus. When it rains, the water comes into the church."
      - name: Campo de' Fiori
        emoji: 🍅
        es: Al mercato
        en: At the market
        fact:
          es: "Campo de' Fiori è una piazza con un mercato. La mattina ci sono frutta, verdura e fiori. Al centro c'è la statua di Giordano Bruno."
          en: "Campo de' Fiori is a square with a market. In the morning there is fruit, vegetables and flowers. In the centre is the statue of Giordano Bruno."
      - name: Vaticano e San Pietro
        emoji: ⛪
        es: La piazza del Papa
        en: The Pope's square
        fact:
          es: "La Città del Vaticano è lo stato più piccolo del mondo. È dentro Roma. Qui vive il Papa e qui c'è la Basilica di San Pietro."
          en: "Vatican City is the smallest state in the world. It is inside Rome. The Pope lives here and here is St Peter's Basilica."
      - name: Villa Borghese
        emoji: 🌳
        es: Un pomeriggio al parco
        en: An afternoon in the park
        fact:
          es: "Villa Borghese è un grande parco nel centro di Roma. Ha alberi, un piccolo lago, musei e uno zoo, il Bioparco. I cani amano correre qui."
          en: "Villa Borghese is a big park in the centre of Rome. It has trees, a small lake, museums and a zoo, the Bioparco. Dogs love running here."
      - name: Testaccio
        emoji: 🏺
        es: Mangiare come un romano
        en: Eating like a Roman
        fact:
          es: "Testaccio è un quartiere di Roma. Ha una piccola collina speciale, il Monte dei Cocci: è fatta di pezzi di anfore antiche. Qui ci sono molte trattorie."
          en: "Testaccio is a neighbourhood of Rome. It has a special little hill, the Monte dei Cocci: it is made of pieces of ancient amphorae. There are lots of trattorias here."
      - name: Piazza di Spagna
        emoji: 🌸
        es: Arrivederci, Roma!
        en: Goodbye, Rome!
        fact:
          es: "Piazza di Spagna ha una scalinata famosa con 135 gradini. In alto c'è la chiesa di Trinità dei Monti. In primavera la scalinata ha molti fiori."
          en: "Piazza di Spagna has a famous staircase with 135 steps. At the top is the church of Trinità dei Monti. In spring the staircase has lots of flowers."
  - level: a2
    name: Toscana
    es: Colline, arte e cipressi
    stops:
      - name: Firenze, il Duomo
        emoji: ⛪
        es: La cupola di Brunelleschi
        en: Brunelleschi's dome
        fact:
          es: "La cupola del Duomo di Firenze è opera di Filippo Brunelleschi. I lavori sono finiti nel 1436. Per arrivare in cima bisogna salire 463 gradini, ma la vista sulla città è bellissima."
          en: "The dome of Florence Cathedral is the work of Filippo Brunelleschi. The work was finished in 1436. To reach the top you have to climb 463 steps, but the view over the city is beautiful."
      - name: Ponte Vecchio
        emoji: 💍
        es: Gioielli sul fiume
        en: Jewels over the river
        fact:
          es: "Il Ponte Vecchio attraversa l'Arno. Una volta qui c'erano i macellai; nel 1593 il granduca Ferdinando I li ha mandati via e sono arrivati gli orefici. Ancora oggi ci sono gioiellerie."
          en: "The Ponte Vecchio crosses the Arno. Butchers used to be here; in 1593 Grand Duke Ferdinando I sent them away and the goldsmiths arrived. There are still jewellers' shops today."
      - name: Uffizi
        emoji: 🖼️
        es: Botticelli e Venere
        en: Botticelli and Venus
        fact:
          es: "Gli Uffizi sono nati come uffici per il governo di Cosimo I de' Medici: il nome viene da lì. Oggi sono un museo famoso, con la Nascita di Venere e la Primavera di Botticelli."
          en: "The Uffizi were built as offices for the government of Cosimo I de' Medici: that's where the name comes from. Today they are a famous museum, with Botticelli's Birth of Venus and Primavera."
      - name: Siena, Piazza del Campo
        emoji: 🐎
        es: Il Palio
        en: The Palio
        fact:
          es: "Piazza del Campo, a Siena, ha la forma di una conchiglia. Due volte all'anno, il 2 luglio e il 16 agosto, ospita il Palio: una corsa di cavalli tra le contrade della città."
          en: "Piazza del Campo, in Siena, is shaped like a shell. Twice a year, on 2 July and 16 August, it hosts the Palio: a horse race between the city's districts, the contrade."
      - name: San Gimignano
        emoji: 🏰
        es: La città delle torri
        en: The town of towers
        fact:
          es: "San Gimignano è famosa per le sue torri medievali. Nel Medioevo erano circa 72; oggi ne restano 14. Il centro storico è patrimonio UNESCO dal 1990."
          en: "San Gimignano is famous for its medieval towers. In the Middle Ages there were about 72; today 14 remain. The historic centre has been a UNESCO World Heritage Site since 1990."
      - name: Pisa
        emoji: 🗼
        es: La torre che pende
        en: The tower that leans
        fact:
          es: "La Torre di Pisa è il campanile del Duomo. Ha cominciato a pendere già durante la costruzione, iniziata nel 1173. Dopo lavori finiti nel 2001, oggi è più stabile."
          en: "The Leaning Tower of Pisa is the cathedral's bell tower. It started to lean while it was being built, from 1173. After works finished in 2001, it is more stable today."
      - name: Lucca
        emoji: 🚲
        es: In bici sulle mura
        en: Cycling on the walls
        fact:
          es: "Lucca ha mura del Cinquecento e del Seicento, lunghe circa 4 km e ancora intatte. Sopra c'è un parco dove la gente passeggia e va in bicicletta. Qui è nato Giacomo Puccini."
          en: "Lucca has 16th- and 17th-century walls, about 4 km long and still intact. On top there is a park where people stroll and cycle. Giacomo Puccini was born here."
      - name: Chianti
        emoji: 🍇
        es: Tra le vigne
        en: Among the vineyards
        fact:
          es: "Il Chianti è una zona di colline tra Firenze e Siena. È famoso per il vino rosso, fatto soprattutto con uva Sangiovese. Il simbolo del Chianti Classico è un gallo nero."
          en: "Chianti is an area of hills between Florence and Siena. It is famous for its red wine, made mainly from Sangiovese grapes. The symbol of Chianti Classico is a black rooster."
      - name: Montepulciano
        emoji: 🍷
        es: Il Vino Nobile
        en: The Vino Nobile
        fact:
          es: "Montepulciano è un paese su una collina, a circa 600 metri. È famoso per il Vino Nobile di Montepulciano e per i suoi palazzi del Rinascimento."
          en: "Montepulciano is a town on a hill, at about 600 metres. It is famous for Vino Nobile di Montepulciano and for its Renaissance palaces."
      - name: Val d'Orcia
        emoji: 🌾
        es: Colline e cipressi
        en: Hills and cypresses
        fact:
          es: "La Val d'Orcia, nel sud della provincia di Siena, è patrimonio UNESCO dal 2004. Le sue colline dolci, i cipressi e i campi di grano sono apparsi in molte foto e in molti film."
          en: "The Val d'Orcia, in the south of the province of Siena, has been a UNESCO World Heritage Site since 2004. Its gentle hills, cypresses and wheat fields have appeared in many photos and films."
      - name: Volterra
        emoji: ⚱️
        es: La città dell'alabastro
        en: The alabaster town
        fact:
          es: "Volterra era un'importante città etrusca. Ancora oggi si può passare sotto la Porta all'Arco, una porta etrusca. Gli artigiani di Volterra lavorano l'alabastro da secoli."
          en: "Volterra was an important Etruscan city. Today you can still walk under the Porta all'Arco, an Etruscan gate. Volterra's craftsmen have worked alabaster for centuries."
      - name: Isola d'Elba
        emoji: 🏝️
        es: Il mare di Napoleone
        en: Napoleon's sea
        fact:
          es: "L'Isola d'Elba è la più grande isola dell'Arcipelago Toscano. Napoleone ci ha vissuto in esilio per circa dieci mesi, tra il 1814 e il 1815."
          en: "Elba is the largest island of the Tuscan Archipelago. Napoleon lived there in exile for about ten months, between 1814 and 1815."
  - level: b1
    name: Nord Italia
    es: Laghi, canali e montagne
    stops:
      - name: Milano, il Duomo
        emoji: ⛪
        es: Guglie e marmo
        en: Spires and marble
        fact:
          es: "Il Duomo di Milano ha richiesto quasi sei secoli di lavori: è stato cominciato nel 1386 e la facciata è stata completata solo nell'Ottocento. Sulla guglia più alta brilla la Madonnina, simbolo della città."
          en: "Milan Cathedral took almost six centuries of work: it was begun in 1386 and the façade was only completed in the 19th century. On the highest spire shines the Madonnina, the symbol of the city."
      - name: Navigli
        emoji: 🛶
        es: Aperitivo sui canali
        en: Aperitivo by the canals
        fact:
          es: "I Navigli sono canali che un tempo collegavano Milano a laghi e fiumi; servivano anche a trasportare il marmo per il Duomo. Oggi il Naviglio Grande e il Naviglio Pavese sono pieni di locali per l'aperitivo."
          en: "The Navigli are canals that once linked Milan to lakes and rivers; they were also used to carry the marble for the cathedral. Today the Naviglio Grande and the Naviglio Pavese are full of bars for aperitivo."
      - name: Lago di Como
        emoji: 🏞️
        es: Ville sull'acqua
        en: Villas on the water
        fact:
          es: "Il Lago di Como ha la forma di una Y rovesciata ed è uno dei laghi più profondi d'Europa, con oltre 400 metri. Bellagio si trova proprio nel punto in cui i due rami del lago si separano."
          en: "Lake Como is shaped like an upside-down Y and is one of the deepest lakes in Europe, at over 400 metres. Bellagio sits right at the point where the lake's two branches split."
      - name: Verona
        emoji: 💌
        es: Il balcone di Giulietta
        en: Juliet's balcony
        fact:
          es: "Verona è la città di Romeo e Giulietta di Shakespeare. L'Arena, un anfiteatro romano del I secolo, ospita ogni estate un famoso festival d'opera. Alla Casa di Giulietta i turisti lasciano lettere d'amore."
          en: "Verona is the city of Shakespeare's Romeo and Juliet. The Arena, a 1st-century Roman amphitheatre, hosts a famous opera festival every summer. At Juliet's House tourists leave love letters."
      - name: Venezia
        emoji: 🚣
        es: In gondola
        en: By gondola
        fact:
          es: "Venezia è costruita su più di cento isole, collegate da circa 400 ponti. Non ci sono auto: ci si sposta a piedi o in barca, per esempio con il vaporetto. Il Canal Grande attraversa la città a forma di S."
          en: "Venice is built on more than a hundred islands, linked by about 400 bridges. There are no cars: people get around on foot or by boat, for example by vaporetto. The Grand Canal crosses the city in an S shape."
      - name: Murano e Burano
        emoji: 🎨
        es: Vetro e merletti
        en: Glass and lace
        fact:
          es: "Nel 1291 i vetrai di Venezia sono stati trasferiti a Murano, anche per evitare incendi in città. Burano, invece, è famosa per il merletto e per le sue case dipinte con colori vivaci."
          en: "In 1291 Venice's glassmakers were moved to Murano, partly to avoid fires in the city. Burano, on the other hand, is famous for its lace and its houses painted in bright colours."
      - name: Dolomiti
        emoji: 🏔️
        es: Montagne che diventano rosa
        en: Mountains that turn pink
        fact:
          es: "Le Dolomiti prendono il nome da Déodat de Dolomieu, il geologo francese che ne ha studiato la roccia. Sono patrimonio UNESCO dal 2009. Al tramonto le pareti diventano rosa: è l'enrosadira."
          en: "The Dolomites are named after Déodat de Dolomieu, the French geologist who studied their rock. They have been a UNESCO World Heritage Site since 2009. At sunset the rock faces turn pink: the enrosadira."
      - name: Bologna
        emoji: 🍝
        es: La Dotta, la Grassa, la Rossa
        en: The Learned, the Fat, the Red
        fact:
          es: "L'Università di Bologna, fondata secondo la tradizione nel 1088, è considerata la più antica del mondo occidentale. I portici della città sono patrimonio UNESCO dal 2021. Il ragù alla bolognese si mangia tradizionalmente con le tagliatelle."
          en: "The University of Bologna, traditionally founded in 1088, is considered the oldest in the Western world. The city's porticoes have been a UNESCO World Heritage Site since 2021. Bolognese ragù is traditionally eaten with tagliatelle."
      - name: Parma
        emoji: 🧀
        es: Parmigiano e prosciutto
        en: Parmesan and ham
        fact:
          es: "Parma è famosa per il prosciutto di Parma e per il Parmigiano Reggiano: una forma pesa circa 40 chili e stagiona almeno 12 mesi. Giuseppe Verdi è nato in provincia di Parma, a Roncole di Busseto."
          en: "Parma is famous for Parma ham and Parmigiano Reggiano: one wheel weighs about 40 kilos and is aged for at least 12 months. Giuseppe Verdi was born in the province of Parma, at Roncole di Busseto."
      - name: Torino
        emoji: 🍫
        es: Cioccolato e Mole
        en: Chocolate and the Mole
        fact:
          es: "Torino è stata la prima capitale del Regno d'Italia, dal 1861 al 1865. Il suo simbolo è la Mole Antonelliana, che oggi ospita il Museo Nazionale del Cinema. Qui è nato il gianduiotto, cioccolatino alle nocciole."
          en: "Turin was the first capital of the Kingdom of Italy, from 1861 to 1865. Its symbol is the Mole Antonelliana, which now houses the National Cinema Museum. The gianduiotto, a hazelnut chocolate, was born here."
      - name: Genova
        emoji: ⚓
        es: Pesto e porto
        en: Pesto and the port
        fact:
          es: "Genova, grande porto sul Mar Ligure, è la città del pesto alla genovese, fatto con basilico, pinoli, aglio, olio e formaggio. Secondo la maggior parte degli storici, Cristoforo Colombo è nato qui nel 1451."
          en: "Genoa, a great port on the Ligurian Sea, is the home of pesto alla genovese, made with basil, pine nuts, garlic, oil and cheese. According to most historians, Christopher Columbus was born here in 1451."
      - name: Cinque Terre
        emoji: 🌈
        es: Cinque paesi sul mare
        en: Five villages by the sea
        fact:
          es: "Le Cinque Terre sono cinque paesi della costa ligure: Monterosso, Vernazza, Corniglia, Manarola e Riomaggiore. Sono collegate da sentieri e dal treno; Corniglia è l'unica che non si affaccia direttamente sul mare. Sono patrimonio UNESCO dal 1997."
          en: "The Cinque Terre are five villages on the Ligurian coast: Monterosso, Vernazza, Corniglia, Manarola and Riomaggiore. They are linked by footpaths and by train; Corniglia is the only one not directly on the sea. They have been UNESCO-listed since 1997."
  - level: b2
    name: Sud Italia
    es: Vulcani, limoni e trulli
    stops:
      - name: Napoli
        emoji: 🍕
        es: Dove è nata la pizza
        en: Where pizza was born
        fact:
          es: "Secondo la tradizione, la pizza margherita è nata a Napoli nel 1889 in onore della regina Margherita: pomodoro, mozzarella e basilico, i colori della bandiera. Nel 2017 l'arte del pizzaiuolo napoletano è entrata nel patrimonio UNESCO."
          en: "According to tradition, pizza margherita was born in Naples in 1889 in honour of Queen Margherita: tomato, mozzarella and basil, the colours of the flag. In 2017 the art of the Neapolitan pizzaiuolo joined UNESCO's heritage list."
      - name: Pompei
        emoji: 🏺
        es: La città sepolta
        en: The buried city
        fact:
          es: "Nel 79 d.C. l'eruzione del Vesuvio seppellì Pompei sotto metri di cenere e lapilli. Gli scavi, cominciati nel 1748, hanno riportato alla luce strade, case, affreschi e perfino le scritte sui muri."
          en: "In AD 79 the eruption of Vesuvius buried Pompeii under metres of ash and pumice. The excavations, begun in 1748, have brought to light streets, houses, frescoes and even the writing on the walls."
      - name: Vesuvio
        emoji: 🌋
        es: Sul bordo del cratere
        en: On the crater's rim
        fact:
          es: "L'ultima eruzione del Vesuvio risale al 1944, ma il vulcano è ancora attivo ed è sorvegliato giorno e notte dall'Osservatorio Vesuviano, fondato nel 1841: il più antico osservatorio vulcanologico del mondo. Un sentiero sale fino al cratere."
          en: "Vesuvius last erupted in 1944, but the volcano is still active and is watched day and night by the Vesuvius Observatory, founded in 1841: the oldest volcano observatory in the world. A path climbs up to the crater."
      - name: Costiera Amalfitana
        emoji: 🍋
        es: Limoni e curve
        en: Lemons and hairpin bends
        fact:
          es: "La Costiera Amalfitana, patrimonio UNESCO dal 1997, è famosa per i paesi a picco sul mare e per i limoni, usati anche per il limoncello. Amalfi è stata una potente repubblica marinara tra il IX e l'XI secolo."
          en: "The Amalfi Coast, a UNESCO World Heritage Site since 1997, is famous for its clifftop villages and its lemons, also used for limoncello. Amalfi was a powerful maritime republic between the 9th and 11th centuries."
      - name: Capri
        emoji: 🔵
        es: La Grotta Azzurra
        en: The Blue Grotto
        fact:
          es: "Nella Grotta Azzurra di Capri si entra su piccole barche a remi: per passare dall'ingresso, alto circa un metro, bisogna sdraiarsi. La luce del sole che filtra sott'acqua colora la grotta di un blu intenso."
          en: "You enter Capri's Blue Grotto on small rowing boats: to get through the entrance, about a metre high, you have to lie down. Sunlight filtering in under the water turns the cave an intense blue."
      - name: Procida
        emoji: 🏘️
        es: Case colorate
        en: Colourful houses
        fact:
          es: "Procida, la più piccola delle tre grandi isole del golfo di Napoli, è stata Capitale italiana della cultura nel 2022. Le case colorate della Marina Corricella sono famose anche grazie al film «Il postino» di Massimo Troisi."
          en: "Procida, the smallest of the three main islands in the Bay of Naples, was Italian Capital of Culture in 2022. The colourful houses of Marina Corricella are also famous thanks to Massimo Troisi's film Il Postino."
      - name: Matera
        emoji: 🪨
        es: I Sassi
        en: The Sassi
        fact:
          es: "I Sassi di Matera sono quartieri di case scavate nella roccia, abitati fin dalla preistoria. Negli anni Cinquanta gli abitanti furono trasferiti per le condizioni di vita difficili; oggi i Sassi sono patrimonio UNESCO e nel 2019 Matera è stata Capitale europea della cultura."
          en: "The Sassi of Matera are districts of homes carved into the rock, inhabited since prehistoric times. In the 1950s the residents were moved out because of harsh living conditions; today the Sassi are UNESCO-listed and in 2019 Matera was European Capital of Culture."
      - name: Alberobello
        emoji: 🛖
        es: I trulli
        en: The trulli
        fact:
          es: "Alberobello, in Puglia, conta più di mille trulli: case di pietra a secco con il tetto a cono. Secondo la tradizione, si costruivano senza malta per poterle smontare in fretta ed evitare le tasse. Sono patrimonio UNESCO dal 1996."
          en: "Alberobello, in Puglia, has more than a thousand trulli: dry-stone houses with conical roofs. According to tradition, they were built without mortar so they could be taken apart quickly to avoid taxes. They have been UNESCO-listed since 1996."
      - name: Lecce
        emoji: 🌅
        es: Il barocco di pietra dorata
        en: Baroque in golden stone
        fact:
          es: "Lecce è chiamata «la Firenze del Sud» per il suo barocco. Chiese e palazzi sono costruiti con la pietra leccese, un calcare morbido color miele, facile da scolpire. In pieno centro c'è anche un anfiteatro romano."
          en: "Lecce is called “the Florence of the South” for its Baroque architecture. Churches and palaces are built of Lecce stone, a soft honey-coloured limestone that is easy to carve. Right in the centre there is also a Roman amphitheatre."
      - name: Bari
        emoji: 🥟
        es: Orecchiette in strada
        en: Orecchiette in the street
        fact:
          es: "Nella Basilica di San Nicola, a Bari, si trovano le reliquie del santo, portate da Myra dai marinai baresi nel 1087. Nei vicoli di Bari Vecchia molte donne preparano le orecchiette a mano davanti alla porta di casa."
          en: "The Basilica of San Nicola in Bari holds the saint's relics, brought from Myra by sailors from Bari in 1087. In the alleys of Bari Vecchia many women make orecchiette by hand outside their front doors."
      - name: Tropea
        emoji: 🧅
        es: Cipolle rosse e mare
        en: Red onions and the sea
        fact:
          es: "Tropea, in Calabria, è costruita su uno sperone di roccia a picco sul mare. Davanti alla città, su uno scoglio, si trova il santuario di Santa Maria dell'Isola. La zona è famosa per la cipolla rossa di Tropea, dolce e protetta dal marchio IGP."
          en: "Tropea, in Calabria, is built on a rocky spur above the sea. In front of the town, on a rock, stands the sanctuary of Santa Maria dell'Isola. The area is famous for the sweet red Tropea onion, protected by the IGP label."
      - name: Paestum
        emoji: 🏛️
        es: Templi greci
        en: Greek temples
        fact:
          es: "Paestum, fondata dai Greci con il nome di Poseidonia intorno al 600 a.C., conserva tre grandi templi dorici in ottimo stato. Nel museo si trova la Tomba del Tuffatore, una rara pittura greca di un uomo che si tuffa."
          en: "Paestum, founded by the Greeks as Poseidonia around 600 BC, preserves three large Doric temples in excellent condition. Its museum holds the Tomb of the Diver, a rare Greek painting of a man diving."
  - level: c1
    name: Sicilia e Sardegna
    es: Le grandi isole
    stops:
      - name: Palermo
        emoji: 🍊
        es: Mercati e arancine
        en: Markets and arancine
        fact:
          es: "Palermo fu araba, normanna e spagnola, e ogni dominazione ha lasciato tracce nell'architettura e nella cucina. Nei mercati storici, come Ballarò e la Vucciria, si mangiano panelle, sfincione e arancine, che qui sono rigorosamente al femminile."
          en: "Palermo was Arab, Norman and Spanish, and each rule left its mark on the architecture and the cooking. In the historic markets, such as Ballarò and the Vucciria, people eat panelle, sfincione and arancine, which here are strictly feminine."
      - name: Monreale
        emoji: ✨
        es: Mosaici d'oro
        en: Golden mosaics
        fact:
          es: "Il Duomo di Monreale, voluto dal re normanno Guglielmo II nel 1174, è rivestito da oltre 6.000 metri quadrati di mosaici a fondo oro. Fa parte del percorso arabo-normanno di Palermo, Cefalù e Monreale, patrimonio UNESCO dal 2015."
          en: "Monreale Cathedral, commissioned by the Norman king William II in 1174, is covered in more than 6,000 square metres of gold-ground mosaics. It is part of the Arab-Norman route of Palermo, Cefalù and Monreale, UNESCO-listed since 2015."
      - name: Cefalù
        emoji: 🏖️
        es: La Rocca e il Duomo
        en: The Rock and the cathedral
        fact:
          es: "Cefalù si stende tra il mare e una grande rocca. Secondo la leggenda, il suo Duomo normanno nacque da un voto di Ruggero II, scampato a una tempesta; i lavori iniziarono nel 1131. Nell'abside domina il Cristo Pantocratore."
          en: "Cefalù stretches between the sea and a great rock. Legend says its Norman cathedral was born of a vow by Roger II, who survived a storm; work began in 1131. Christ Pantocrator dominates the apse."
      - name: Etna
        emoji: 🌋
        es: "'A Muntagna"
        en: The Mountain
        fact:
          es: "L'Etna, alto oltre 3.300 metri, è il vulcano attivo più alto d'Europa e uno dei più attivi al mondo. I catanesi lo chiamano «a Muntagna». È patrimonio UNESCO dal 2013 e sulle sue pendici fertili crescono vigneti e i pistacchi di Bronte."
          en: "Etna, over 3,300 metres high, is the tallest active volcano in Europe and one of the most active in the world. Locals call it “a Muntagna”. It has been UNESCO-listed since 2013, and vineyards and Bronte pistachios grow on its fertile slopes."
      - name: Catania
        emoji: 🐘
        es: U Liotru
        en: The lava elephant
        fact:
          es: "Dopo il terremoto del 1693, Catania fu ricostruita in stile barocco usando anche la pietra lavica dell'Etna: per questo molti edifici hanno toni grigi e neri. Il simbolo della città è un elefante di pietra lavica, «u Liotru», in piazza del Duomo."
          en: "After the earthquake of 1693, Catania was rebuilt in Baroque style, partly with lava stone from Etna: that is why many buildings are grey and black. The city's symbol is a lava-stone elephant, “u Liotru”, in Piazza del Duomo."
      - name: Siracusa e Ortigia
        emoji: 📐
        es: La città di Archimede
        en: Archimedes' city
        fact:
          es: "Siracusa, fondata dai Corinzi nel 734 a.C., fu una delle città più potenti del mondo greco e la patria di Archimede. Sull'isola di Ortigia, il Duomo ingloba ancora le colonne di un tempio dorico dedicato ad Atena."
          en: "Syracuse, founded by the Corinthians in 734 BC, was one of the most powerful cities of the Greek world and the birthplace of Archimedes. On the island of Ortigia, the cathedral still incorporates the columns of a Doric temple to Athena."
      - name: Agrigento, Valle dei Templi
        emoji: 🏛️
        es: La Valle dei Templi
        en: The Valley of the Temples
        fact:
          es: "La Valle dei Templi conserva i resti di Akragas, fondata dai Greci nel VI secolo a.C. Il Tempio della Concordia è tra i templi dorici meglio conservati al mondo, anche perché alla fine del VI secolo d.C. fu trasformato in chiesa."
          en: "The Valley of the Temples preserves the remains of Akragas, founded by the Greeks in the 6th century BC. The Temple of Concord is among the best-preserved Doric temples in the world, partly because it was turned into a church at the end of the 6th century AD."
      - name: Cagliari
        emoji: 🦩
        es: I fenicotteri
        en: The flamingos
        fact:
          es: "Cagliari, capoluogo della Sardegna, si affaccia sul golfo degli Angeli. Nello stagno di Molentargius, a due passi dalla città, nidificano migliaia di fenicotteri rosa. Dal quartiere medievale di Castello lo sguardo spazia sul porto e sul mare."
          en: "Cagliari, the capital of Sardinia, looks out over the Gulf of Angels. In the Molentargius lagoon, a stone's throw from the city, thousands of pink flamingos nest. From the medieval Castello district the view sweeps over the port and the sea."
      - name: Costa Smeralda
        emoji: 💎
        es: Acqua color smeraldo
        en: Emerald-coloured water
        fact:
          es: "La Costa Smeralda, nel nord-est della Sardegna, fu trasformata in località turistica di lusso negli anni Sessanta da un consorzio guidato dal principe Karim Aga Khan. Porto Cervo ne è il cuore, ma sono le spiagge di granito e l'acqua trasparente ad attirare i visitatori."
          en: "The Costa Smeralda, in north-east Sardinia, was turned into a luxury resort in the 1960s by a consortium led by Prince Karim Aga Khan. Porto Cervo is its heart, but it is the granite beaches and clear water that draw visitors."
      - name: Alghero
        emoji: 🪸
        es: La piccola Barcellona
        en: Little Barcelona
        fact:
          es: "Ad Alghero, conquistata dagli Aragonesi nel 1354, una parte degli abitanti parla ancora una varietà di catalano: per questo la città è chiamata «Barceloneta». Il suo mare è famoso per il corallo rosso, lavorato da secoli dagli artigiani locali."
          en: "In Alghero, conquered by the Aragonese in 1354, some of the inhabitants still speak a variety of Catalan: that is why the town is called “Barceloneta”. Its sea is famous for red coral, worked for centuries by local craftsmen."
  - level: c2
    name: Centro Italia
    es: Il cuore verde, e ritorno
    stops:
      - name: Assisi
        emoji: 🕊️
        es: La città di San Francesco
        en: St Francis's town
        fact:
          es: "Assisi è la città di San Francesco, patrono d'Italia insieme a Santa Caterina da Siena. La Basilica di San Francesco, con gli affreschi attribuiti a Giotto, fu gravemente danneggiata dal terremoto del 1997 e riaperta dopo appena due anni di restauri."
          en: "Assisi is the town of St Francis, patron saint of Italy together with St Catherine of Siena. The Basilica of St Francis, with frescoes attributed to Giotto, was badly damaged by the 1997 earthquake and reopened after just two years of restoration."
      - name: Perugia
        emoji: 🍫
        es: Baci e jazz
        en: Kisses and jazz
        fact:
          es: "Perugia ospita l'Università per Stranieri, dove studenti di tutto il mondo vengono a imparare l'italiano. In città nascono dal 1922 i Baci Perugina, e ogni luglio le piazze del centro si riempiono di musica con Umbria Jazz."
          en: "Perugia is home to the University for Foreigners, where students from all over the world come to learn Italian. Baci Perugina chocolates have been made here since 1922, and every July the squares fill with music for Umbria Jazz."
      - name: Urbino
        emoji: 🎨
        es: La città di Raffaello
        en: Raphael's town
        fact:
          es: "Urbino, dove nacque Raffaello Sanzio nel 1483, fu una delle capitali del Rinascimento sotto il duca Federico da Montefeltro. Il Palazzo Ducale ospita oggi la Galleria Nazionale delle Marche, e il centro storico è patrimonio UNESCO dal 1998."
          en: "Urbino, where Raphael was born in 1483, was one of the capitals of the Renaissance under Duke Federico da Montefeltro. The Ducal Palace now houses the National Gallery of the Marche, and the historic centre has been UNESCO-listed since 1998."
      - name: Ravenna
        emoji: 🧩
        es: Mosaici bizantini
        en: Byzantine mosaics
        fact:
          es: "Ravenna fu capitale dell'Impero romano d'Occidente, poi del regno degli Ostrogoti e infine dell'esarcato bizantino. Otto suoi monumenti paleocristiani, ricchi di mosaici, sono patrimonio UNESCO. Qui è sepolto Dante Alighieri, morto in esilio nel 1321."
          en: "Ravenna was the capital of the Western Roman Empire, then of the Ostrogothic kingdom and finally of the Byzantine exarchate. Eight of its early Christian monuments, rich in mosaics, are UNESCO-listed. Dante Alighieri, who died in exile in 1321, is buried here."
      - name: Gubbio
        emoji: 🕯️
        es: La Corsa dei Ceri
        en: The Race of the Candles
        fact:
          es: "Ogni 15 maggio Gubbio celebra la Corsa dei Ceri: tre squadre corrono per le vie della città fino alla basilica sul monte Ingino, portando a spalla tre enormi strutture di legno, ognuna sormontata dalla statua di un santo."
          en: "Every 15 May Gubbio celebrates the Corsa dei Ceri: three teams race through the town's streets up to the basilica on Monte Ingino, carrying on their shoulders three huge wooden structures, each topped by the statue of a saint."
      - name: Orvieto
        emoji: 🌀
        es: Il Pozzo di San Patrizio
        en: St Patrick's Well
        fact:
          es: "Orvieto sorge su una rupe di tufo. Il Pozzo di San Patrizio, profondo circa 54 metri, fu voluto da papa Clemente VII dopo il sacco di Roma del 1527: due scale elicoidali indipendenti permettevano di scendere e risalire senza incrociarsi."
          en: "Orvieto stands on a cliff of tuff. St Patrick's Well, about 54 metres deep, was commissioned by Pope Clement VII after the Sack of Rome in 1527: two independent spiral staircases let people go down and come back up without crossing paths."
      - name: Civita di Bagnoregio
        emoji: 🌉
        es: La città che muore
        en: The dying town
        fact:
          es: "Civita di Bagnoregio, soprannominata «la città che muore», si raggiunge soltanto attraverso un lungo ponte pedonale. La rupe di tufo e argilla su cui sorge viene lentamente erosa, e oggi in paese vivono tutto l'anno pochissimi residenti."
          en: "Civita di Bagnoregio, nicknamed “the dying town”, can only be reached by a long footbridge. The cliff of tuff and clay it stands on is slowly being eroded, and today very few residents live there all year round."
      - name: Ritorno a Roma
        emoji: 🏠
        es: Arrivederci, Italia!
        en: Goodbye, Italy!
        fact:
          es: "Roma è detta «la Città Eterna» e, secondo la leggenda, fu fondata da Romolo il 21 aprile del 753 a.C.; ancora oggi ogni 21 aprile si festeggia il Natale di Roma. E chi getta una moneta nella Fontana di Trevi, dice la tradizione, ci tornerà."
          en: "Rome is called “the Eternal City” and, according to legend, was founded by Romulus on 21 April 753 BC; Rome's birthday is still celebrated every 21 April. And whoever throws a coin into the Trevi Fountain, tradition says, will return."
