id: a1.u13
title: 數數字
lessons:
  - id: a1.u13.l1
    title: 一到五
    teach: [g.counting-1-10]
    skills: [listen, speak, read, write]
    write: [一, 二, 三]
    tip: "Numbers first! 一 jat1, 二 ji6, 三 saam1, 四 sei3, 五 ng5. The digit after each syllable is the tone: 1 is high and flat, 6 is low. 一, 二, 三 are just one, two and three lines, drawn from top to bottom."
    vocab: [w.jat1, w.ji6, w.saam1, w.sei3, w.ng5]
    sentences:
      - { es: "一。", en: "One.", grammar: [g.counting-1-10], vocab: [w.jat1] }
      - { es: "二。", en: "Two.", grammar: [g.counting-1-10], vocab: [w.ji6] }
      - { es: "三。", en: "Three.", grammar: [g.counting-1-10], vocab: [w.saam1] }
      - { es: "四。", en: "Four.", grammar: [g.counting-1-10], vocab: [w.sei3] }
      - { es: "五。", en: "Five.", grammar: [g.counting-1-10], vocab: [w.ng5] }
      - { es: "一、二、三。", en: "One, two, three.", grammar: [g.counting-1-10], vocab: [w.jat1, w.ji6, w.saam1], kinds: [dictation, listen, typeEs, order, speak] }
      - { es: "三、四、五。", en: "Three, four, five.", grammar: [g.counting-1-10], vocab: [w.saam1, w.sei3, w.ng5], kinds: [dictation, listen, typeEs, order, speak] }
      - { es: "一、二、三、四、五。", en: "One, two, three, four, five.", grammar: [g.counting-1-10], vocab: [w.jat1, w.ji6, w.saam1, w.sei3, w.ng5], kinds: [dictation, listen, typeEs, order, speak] }
      - { es: "五、四、三、二、一！", en: "Five, four, three, two, one!", grammar: [g.counting-1-10], vocab: [w.ng5, w.sei3, w.saam1, w.ji6, w.jat1], kinds: [dictation, listen, typeEs, order, speak] }
      - { es: "二同三。", en: "Two and three.", grammar: [g.counting-1-10], vocab: [w.ji6, w.saam1] }
    exchanges:
      - q: { es: "一、二、三……", en: "One, two, three..." }
        a: { es: "四、五！", en: "Four, five!" }
        alt: ["四！"]
        grammar: [g.counting-1-10]
        vocab: [w.sei3, w.ng5]
      - q: { es: "二加三係幾多呀？", en: "What's two plus three?" }
        a: { es: "五。", en: "Five." }
        alt: ["係五。"]
        grammar: [g.counting-1-10]
        vocab: [w.ng5]
      - q: { es: "一加一係幾多呀？", en: "What's one plus one?" }
        a: { es: "二！", en: "Two!" }
        alt: ["係二。"]
        grammar: [g.counting-1-10]
        vocab: [w.ji6]
    texts:
      - title: "數數字"
        es: ["一、二、三。", "四、五！"]
        en: ["One, two, three.", "Four, five!"]
        grammar: [g.counting-1-10]
        vocab: [w.jat1, w.ng5]
  - id: a1.u13.l2
    title: 六到十
    teach: [g.counting-1-10]
    skills: [listen, speak, read, write]
    write: [四, 五, 六]
    tip: "六 luk6, 七 cat1, 八 baat3, 九 gau2, 十 sap6. 九 (nine) sounds exactly like 狗 (dog), so it is Leo, Bonchita and Luna's favourite number! 十 ends in a silent p: just close your lips."
    vocab: [w.luk6, w.cat1, w.baat3, w.gau2, w.sap6]
    sentences:
      - { es: "六。", en: "Six.", grammar: [g.counting-1-10], vocab: [w.luk6] }
      - { es: "七。", en: "Seven.", grammar: [g.counting-1-10], vocab: [w.cat1] }
      - { es: "八。", en: "Eight.", grammar: [g.counting-1-10], vocab: [w.baat3] }
      - { es: "九。", en: "Nine.", grammar: [g.counting-1-10], vocab: [w.gau2] }
      - { es: "十。", en: "Ten.", grammar: [g.counting-1-10], vocab: [w.sap6] }
      - { es: "六、七、八。", en: "Six, seven, eight.", grammar: [g.counting-1-10], vocab: [w.luk6, w.cat1, w.baat3], kinds: [dictation, listen, typeEs, order, speak] }
      - { es: "八、九、十！", en: "Eight, nine, ten!", grammar: [g.counting-1-10], vocab: [w.baat3, w.gau2, w.sap6], kinds: [dictation, listen, typeEs, order, speak] }
      - { es: "四、五、六。", en: "Four, five, six.", grammar: [g.counting-1-10], vocab: [w.sei3, w.ng5, w.luk6], kinds: [dictation, listen, typeEs, order, speak] }
      - { es: "十、九、八、七、六。", en: "Ten, nine, eight, seven, six.", grammar: [g.counting-1-10], vocab: [w.sap6, w.gau2, w.baat3, w.cat1, w.luk6], kinds: [dictation, listen, typeEs, order, speak] }
      - { es: "一、二、三、四、五、六、七、八、九、十。", en: "One, two, three, four, five, six, seven, eight, nine, ten.", grammar: [g.counting-1-10], vocab: [w.jat1, w.sap6], kinds: [dictation, listen, typeEs, order, speak] }
      - { es: "七同八。", en: "Seven and eight.", grammar: [g.counting-1-10], vocab: [w.cat1, w.baat3] }
    exchanges:
      - q: { es: "五、六、七……", en: "Five, six, seven..." }
        a: { es: "八、九、十！", en: "Eight, nine, ten!" }
        alt: ["八！"]
        grammar: [g.counting-1-10]
        vocab: [w.baat3, w.gau2, w.sap6]
      - q: { es: "五加五係幾多呀？", en: "What's five plus five?" }
        a: { es: "十。", en: "Ten." }
        alt: ["係十。"]
        grammar: [g.counting-1-10]
        vocab: [w.sap6]
      - q: { es: "九定十呀？", en: "Nine or ten?" }
        a: { es: "九。", en: "Nine." }
        alt: ["十。", "係九。"]
        grammar: [g.counting-1-10]
        vocab: [w.gau2, w.sap6]
    texts:
      - title: "數到十"
        es: ["一、二、三、四、五。", "六、七、八、九、十！"]
        en: ["One, two, three, four, five.", "Six, seven, eight, nine, ten!"]
        grammar: [g.counting-1-10]
        vocab: [w.sap6]
  - id: a1.u13.l3
    title: 零，十一到二十
    teach: [g.numbers-1-99]
    skills: [listen, speak, read, write]
    write: [七, 八, 九]
    tip: "Eleven is 'ten one': 十一. Twelve is 十二, and so on up to 十九. Twenty is 'two ten': 二十. Zero is 零 ling4."
    vocab: [w.ling4]
    sentences:
      - { es: "零。", en: "Zero.", grammar: [g.numbers-1-99], vocab: [w.ling4] }
      - { es: "十一。", en: "Eleven.", grammar: [g.numbers-1-99], vocab: [w.sap6, w.jat1] }
      - { es: "十二。", en: "Twelve.", grammar: [g.numbers-1-99], vocab: [w.sap6, w.ji6] }
      - { es: "十五。", en: "Fifteen.", grammar: [g.numbers-1-99], vocab: [w.sap6, w.ng5] }
      - { es: "十九。", en: "Nineteen.", grammar: [g.numbers-1-99], vocab: [w.sap6, w.gau2] }
      - { es: "二十。", en: "Twenty.", grammar: [g.numbers-1-99], vocab: [w.ji6, w.sap6] }
      - { es: "零、一、二。", en: "Zero, one, two.", grammar: [g.numbers-1-99], vocab: [w.ling4, w.jat1, w.ji6], kinds: [dictation, listen, typeEs, order, speak] }
      - { es: "十一、十二、十三。", en: "Eleven, twelve, thirteen.", grammar: [g.numbers-1-99], vocab: [w.sap6], kinds: [dictation, listen, typeEs, order, speak] }
      - { es: "十八、十九、二十！", en: "Eighteen, nineteen, twenty!", grammar: [g.numbers-1-99], vocab: [w.sap6, w.baat3, w.gau2], kinds: [dictation, listen, typeEs, order, speak] }
      - { es: "十四、十五、十六、十七。", en: "Fourteen, fifteen, sixteen, seventeen.", grammar: [g.numbers-1-99], vocab: [w.sap6, w.cat1], kinds: [dictation, listen, typeEs, order, speak] }
      - { es: "十加十係二十。", en: "Ten plus ten is twenty.", grammar: [g.numbers-1-99], vocab: [w.sap6, w.ji6] }
    exchanges:
      - q: { es: "十加一係幾多呀？", en: "What's ten plus one?" }
        a: { es: "十一。", en: "Eleven." }
        alt: ["係十一。"]
        grammar: [g.numbers-1-99]
        vocab: [w.sap6, w.jat1]
      - q: { es: "十加五係幾多呀？", en: "What's ten plus five?" }
        a: { es: "十五。", en: "Fifteen." }
        alt: ["係十五。"]
        grammar: [g.numbers-1-99]
        vocab: [w.sap6, w.ng5]
      - q: { es: "十二定二十呀？", en: "Twelve or twenty?" }
        a: { es: "十二。", en: "Twelve." }
        alt: ["二十。", "係十二。"]
        grammar: [g.numbers-1-99]
        vocab: [w.sap6, w.ji6]
    texts:
      - title: "十幾"
        es: ["十一、十二、十三、十四、十五。", "十六、十七、十八、十九、二十！"]
        en: ["Eleven, twelve, thirteen, fourteen, fifteen.", "Sixteen, seventeen, eighteen, nineteen, twenty!"]
        grammar: [g.numbers-1-99]
        vocab: [w.sap6]
  - id: a1.u13.l4
    title: 二十一到九十九
    teach: [g.numbers-1-99]
    skills: [listen, speak, read, write]
    write: [十, 四, 五, 九]
    tip: "Tens are 'number + ten': 三十 thirty, 九十 ninety. Then add the last digit: 三十五 is 35, 九十九 is 99. Careful: 十四 is 14, but 四十 is 40!"
    vocab: [w.sou2, w.sou3-zi6]
    sentences:
      - { es: "二十一。", en: "Twenty-one.", altEs: ["廿一。"], grammar: [g.numbers-1-99], vocab: [w.ji6, w.sap6, w.jat1] }
      - { es: "三十。", en: "Thirty.", grammar: [g.numbers-1-99], vocab: [w.saam1, w.sap6] }
      - { es: "四十四。", en: "Forty-four.", grammar: [g.numbers-1-99], vocab: [w.sei3, w.sap6] }
      - { es: "五十五。", en: "Fifty-five.", grammar: [g.numbers-1-99], vocab: [w.ng5, w.sap6] }
      - { es: "九十九。", en: "Ninety-nine.", grammar: [g.numbers-1-99], vocab: [w.gau2, w.sap6] }
      - { es: "三十、四十、五十。", en: "Thirty, forty, fifty.", grammar: [g.numbers-1-99], vocab: [w.saam1, w.sei3, w.ng5, w.sap6], kinds: [dictation, listen, typeEs, order, speak] }
      - { es: "六十、七十、八十、九十。", en: "Sixty, seventy, eighty, ninety.", grammar: [g.numbers-1-99], vocab: [w.luk6, w.cat1, w.baat3, w.gau2], kinds: [dictation, listen, typeEs, order, speak] }
      - { es: "十四，唔係四十！", en: "Fourteen, not forty!", grammar: [g.numbers-1-99], vocab: [w.sap6, w.sei3] }
      - { es: "我數到九十九。", en: "I count to ninety-nine.", altEn: ["I'm counting to ninety-nine.", "I'll count to ninety-nine."], grammar: [g.numbers-1-99], vocab: [w.sou2, w.gau2], jp: "ngo5 sou2 dou3 gau2 sap6 gau2" }
      - { es: "好多數字！", en: "Lots of numbers!", altEn: ["So many numbers!"], grammar: [g.numbers-1-99], vocab: [w.sou3-zi6] }
    exchanges:
      - q: { es: "十四定四十呀？", en: "Fourteen or forty?" }
        a: { es: "四十。", en: "Forty." }
        alt: ["十四。", "係四十。"]
        grammar: [g.numbers-1-99]
        vocab: [w.sei3, w.sap6]
      - q: { es: "二十加三十係幾多呀？", en: "What's twenty plus thirty?" }
        a: { es: "五十。", en: "Fifty." }
        alt: ["係五十。"]
        grammar: [g.numbers-1-99]
        vocab: [w.ng5, w.sap6]
      - q: { es: "九十加九係幾多呀？", en: "What's ninety plus nine?" }
        a: { es: "九十九！", en: "Ninety-nine!" }
        alt: ["係九十九。"]
        grammar: [g.numbers-1-99]
        vocab: [w.gau2, w.sap6]
    texts:
      - title: "數字"
        es: ["十、二十、三十、四十、五十。", "六十、七十、八十、九十。", "九十九！"]
        en: ["Ten, twenty, thirty, forty, fifty.", "Sixty, seventy, eighty, ninety.", "Ninety-nine!"]
        grammar: [g.numbers-1-99]
        vocab: [w.sou3-zi6]
