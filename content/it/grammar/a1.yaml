# A1 grammar notes (Rome). Explanations use light markdown: ### headings,
# bullets, tables, **bold**, *italic* (italic = Italian example inline).
# Field `es` always holds the Italian text.
- id: g.greetings
  level: a1
  title: "Greetings and goodbyes"
  summary: "Ciao, buongiorno, buonasera, buonanotte, arrivederci, a presto."
  explanation: |
    ### Saying hello
    - *Ciao* is informal and works for both hello and goodbye, with friends, family and people your age.
    - *Buongiorno* (good morning / good day) until early afternoon; *buonasera* (good evening) from mid-afternoon on. In shops and offices these are the safe default.
    - *Salve* is a neutral hello, handy when you are unsure whether to be formal.
    - *Buonanotte* is only for going to bed or leaving late at night.

    ### Saying goodbye
    | Informal | Neutral / formal |
    |---|---|
    | *Ciao!* | *Arrivederci* (to one or more people) |
    | *Ci vediamo!* (see you) | *ArrivederLa* (very formal, to one person) |
    | *A dopo / a presto / a domani* | *Buona giornata / buona serata* (have a nice day / evening) |

    ### How are you?
    - *Come stai?* (informal) / *Come sta?* (formal).
    - Replies: *Bene, grazie. E tu? / E Lei?*, *Benissimo*, *Non c'è male* (not bad), *Così così*, *Male*.
  examples:
    - { es: "Ciao, Marco! Come stai?", en: "Hi, Marco! How are you?" }
    - { es: "Buongiorno, signora Rossi.", en: "Good morning, Mrs Rossi." }
    - { es: "Bene, grazie. E Lei?", en: "Fine, thanks. And you? (formal)" }
    - { es: "Arrivederci e buona giornata!", en: "Goodbye and have a nice day!" }
  pitfalls:
    - "*Ciao* is too familiar for a shopkeeper or an older stranger: use *buongiorno* or *buonasera*."
    - "*Buonanotte* is not 'good evening': Italians say *buonasera* when they arrive in the evening."
    - "Spanish speakers: *buongiorno* is one word and has no plural like *buenos días*."
  related: [g.tu-vs-lei, g.stare-present]
  drills:
    - { es: "Buonasera, come sta?", en: "Good evening, how are you? (formal)" }
    - { es: "Ciao, a domani!", en: "Bye, see you tomorrow!" }
    - { es: "Non c'è male, e tu?", en: "Not bad, and you?" }
    - { es: "Buona serata, ragazzi!", en: "Have a nice evening, guys!" }
- id: g.subject-pronouns
  level: a1
  title: "Subject pronouns (io, tu, lui, lei…)"
  summary: "The verb ending already shows the subject, so Italian usually drops the pronoun."
  explanation: |
    | Person | Singular | Plural |
    |---|---|---|
    | 1st | *io* (I) | *noi* (we) |
    | 2nd | *tu* (you, informal) | *voi* (you all) |
    | 3rd | *lui* (he), *lei* (she), *Lei* (you, formal) | *loro* (they) |

    ### Dropping the pronoun
    *Sono italiano* can only mean "I am Italian", so *io* is not needed. Use the pronoun for **contrast** or **emphasis**: *Io sono di Roma, e tu?* — *Pago io!* (I'll pay!)

    ### Notes
    - *io* has no capital letter unless it starts a sentence.
    - *Lei* (formal "you") uses the **third-person** verb, exactly like *lei* (she): *Lei è molto gentile.*
    - *voi* is the normal plural "you", for friends or strangers alike.
    - *egli, ella, esso, essi* are written and literary forms you will meet later.
  examples:
    - { es: "Io sono Giulia e lui è Paolo.", en: "I'm Giulia and he is Paolo." }
    - { es: "Voi siete di Roma?", en: "Are you (all) from Rome?" }
    - { es: "Lei è il professor Bianchi?", en: "Are you Professor Bianchi? (formal)" }
    - { es: "Loro sono amici.", en: "They are friends." }
  pitfalls:
    - "There is no subject pronoun for 'it': *È bello* = it's nice."
    - "Using *io* in every sentence sounds insistent; drop it unless you contrast."
    - "Spanish speakers: *noi* and *voi* have no feminine form (no *nosotras*), and *lei* means both 'she' and formal 'you'."
  related: [g.essere-present, g.tu-vs-lei]
  drills:
    - { es: "Noi siamo studenti.", en: "We are students." }
    - { es: "Tu sei americano?", en: "Are you American?" }
    - { es: "Lei è di Napoli, lui è di Milano.", en: "She is from Naples, he is from Milan." }
- id: g.essere-present
  level: a1
  title: "The verb essere (to be)"
  summary: "sono, sei, è, siamo, siete, sono — identity, origin, profession, description."
  explanation: |
    | | essere |
    |---|---|
    | io | **sono** |
    | tu | **sei** |
    | lui / lei / Lei | **è** |
    | noi | **siamo** |
    | voi | **siete** |
    | loro | **sono** |

    Use *essere* for:
    - **identity**: *Sono Marco.* *È mia sorella.*
    - **origin and nationality**: *Siamo di Torino. Sei inglese?*
    - **profession**: *Sono medico.*
    - **description**: *La casa è grande. Luca è simpatico.*
    - **location** of people and things: *Il bagno è a destra. Sono a Roma.*

    Note the accent: *è* (is) is a verb; *e* (and) is a conjunction. *Sono* is both "I am" and "they are"; context makes it clear.
  examples:
    - { es: "Sono studente.", en: "I am a student." }
    - { es: "Sei di Roma?", en: "Are you from Rome?" }
    - { es: "Il Colosseo è molto grande.", en: "The Colosseum is very big." }
    - { es: "Siamo a casa.", en: "We are at home." }
  pitfalls:
    - "Don't forget the accent: *è* = is, *e* = and."
    - "No article with professions after *essere*: *sono insegnante*, not *sono un insegnante*."
    - "Spanish speakers: Italian uses *essere* for location (*Dov'è il bagno?*), where Spanish uses *estar*."
  related: [g.subject-pronouns, g.stare-present, g.essere-di]
  drills:
    - { es: "Voi siete molto gentili.", en: "You are very kind." }
    - { es: "Loro sono di Firenze.", en: "They are from Florence." }
    - { es: "È una bella città.", en: "It is a beautiful city." }
    - { es: "Dove sei adesso?", en: "Where are you now?" }
- id: g.chiamarsi
  level: a1
  title: "Mi chiamo… — saying your name"
  summary: "chiamarsi means 'to call oneself': mi chiamo, ti chiami, si chiama."
  explanation: |
    | | chiamarsi |
    |---|---|
    | io | **mi chiamo** |
    | tu | **ti chiami** |
    | lui / lei / Lei | **si chiama** |
    | noi | **ci chiamiamo** |
    | voi | **vi chiamate** |
    | loro | **si chiamano** |

    - *Come ti chiami?* — What's your name? (informal)
    - *Come si chiama?* — What's your name? (formal) / What's his or her name?
    - *Mi chiamo Anna.* — My name is Anna.

    The little word in front (*mi, ti, si…*) is a reflexive pronoun; you will meet it again with daily-routine verbs. You can also say *Il mio nome è Anna*, which is correct but more formal. To introduce someone: *Questo è Marco. / Questa è Sara.*
  examples:
    - { es: "Ciao, mi chiamo Luca. E tu?", en: "Hi, my name is Luca. And you?" }
    - { es: "Come si chiama Suo figlio?", en: "What's your son's name? (formal)" }
    - { es: "Lei si chiama Francesca.", en: "Her name is Francesca." }
    - { es: "Piacere, sono Elena.", en: "Nice to meet you, I'm Elena." }
  pitfalls:
    - "Never *mi chiamo è Anna*: either *mi chiamo Anna* or *il mio nome è Anna*."
    - "*Ch* is pronounced like English k: *chiamo* = 'kyah-mo'."
    - "*Piacere* (nice to meet you) is said on meeting; *molto lieto / lieta* is more formal."
  related: [g.reflexive-present, g.greetings]
  drills:
    - { es: "Come ti chiami?", en: "What's your name?" }
    - { es: "Ci chiamiamo Marta e Davide.", en: "Our names are Marta and Davide." }
    - { es: "Questa è mia sorella, si chiama Chiara.", en: "This is my sister, her name is Chiara." }
- id: g.tu-vs-lei
  level: a1
  title: "Tu or Lei? Informal and formal 'you'"
  summary: "tu for friends, family and young people; Lei, with a third-person verb, for strangers and formal situations."
  explanation: |
    - **tu** (informal) takes the second-person verb: *Come stai? Di dove sei?*
    - **Lei** (formal) takes the **third-person** verb, like *lei* (she): *Come sta? Di dove è?*
    - **voi** is the plural for both: *Come state?*

    ### When to use Lei
    Shop assistants, waiters, officials, doctors, older people, anyone you would call *signore / signora*. Among young people, students and colleagues *tu* is normal. If someone says *Diamoci del tu!* (let's use tu), switch.

    | | informal | formal |
    |---|---|---|
    | How are you? | *Come stai?* | *Come sta?* |
    | Where are you from? | *Di dove sei?* | *Di dov'è?* |
    | What's your name? | *Come ti chiami?* | *Come si chiama?* |

    In writing, *Lei* is often capitalised to show respect, especially in letters.
  examples:
    - { es: "Scusi, Lei è il signor Ferri?", en: "Excuse me, are you Mr Ferri?" }
    - { es: "Ciao, tu sei la sorella di Luca?", en: "Hi, are you Luca's sister?" }
    - { es: "Possiamo darci del tu?", en: "Can we use tu with each other?" }
    - { es: "Signora, come sta?", en: "How are you, madam?" }
  pitfalls:
    - "*Lei* is grammatically third person: *Lei è*, never *Lei sei*."
    - "*Scusa* (tu) and *scusi* (Lei) both mean 'excuse me': pick the one that matches."
    - "Spanish speakers: *usted* becomes *Lei* (not *Ella*), and the plural *ustedes* is normally just *voi*."
  variant: "In parts of the South, older speakers may use *voi* as a polite singular ('Voi come state?'). *Loro* as a formal plural survives only in very formal service language."
  related: [g.subject-pronouns, g.lei-forms]
  drills:
    - { es: "Di dov'è, signora?", en: "Where are you from, madam?" }
    - { es: "Di dove sei, Anna?", en: "Where are you from, Anna?" }
    - { es: "Come si chiama, scusi?", en: "Excuse me, what's your name? (formal)" }
- id: g.accents
  level: a1
  title: "Written accents: è, perché, città, più"
  summary: "Italian writes an accent only on a stressed final vowel and on a few short words, where it changes the meaning."
  explanation: |
    ### When Italian writes an accent
    1. **Stressed final vowel** in words of two or more syllables: *città, caffè, perché, più, così, virtù, università, lunedì, però*.
    2. **Some one-syllable words**, to tell them apart from a twin without an accent:

    | with accent | without accent |
    |---|---|
    | *è* (is) | *e* (and) |
    | *sì* (yes) | *si* (oneself, impersonal) |
    | *là, lì* (there) | *la, li* (the, her, them) |
    | *dà* (gives) | *da* (from) |
    | *né* (nor) | *ne* (of it) |
    | *tè* (tea) | *te* (you) |
    | *sé* (oneself) | *se* (if) |

    Also always: *può, più, già, giù, ciò*.

    ### Grave or acute?
    - Most accents are **grave** (`) : *à, è, ì, ò, ù*.
    - Closed *é* takes the **acute** (´): *perché, poiché, benché, affinché, né, sé, ventitré*.
    - *è* (is) and *caffè, tè* have an open sound: grave.

    ### No accent on these
    *qui, qua, fa, va, sta, do, so, sto, re, tre, su, blu, me* — and *po'* (= *poco*) takes an apostrophe, not an accent.

    On a keyboard without accents, never write *e'* for *è* in formal writing: use the accented letter (on phones, hold the key).
  examples:
    - { es: "Lui è di Roma e lei è di Napoli.", en: "He is from Rome and she is from Naples." }
    - { es: "Sì, mi piace il tè.", en: "Yes, I like tea." }
    - { es: "Perché la città è così bella?", en: "Why is the city so beautiful?" }
    - { es: "Non posso più aspettare, è già tardi.", en: "I can't wait any longer, it's already late." }
  pitfalls:
    - "*E* without an accent means 'and': *Marco è alto* (is), *Marco e Anna* (and)."
    - "*Perché, poiché, benché* take an acute accent (é), not a grave one."
    - "*Qui, qua, fa, va, sto, so* have no accent, and *po'* takes an apostrophe: *un po'*."
    - "Spanish speakers: Italian marks only final stress, so no accent on *musica* or *telefono*, even though Spanish writes *música, teléfono*."
  related: [g.essere-present, g.negation, g.question-words]
  drills:
    - { es: "È vero, la stazione è lì.", en: "It's true, the station is there." }
    - { es: "Lunedì vado all'università.", en: "On Monday I'm going to the university." }
    - { es: "Non voglio né caffè né tè.", en: "I want neither coffee nor tea." }
    - { es: "Mi dà un po' di pane?", en: "Can you give me a bit of bread?" }
- id: g.gender-nouns
  level: a1
  title: "Gender: every noun is masculine or feminine"
  summary: "Most nouns in -o are masculine, most in -a feminine; nouns in -e can be either."
  explanation: |
    Every Italian noun has a gender, even objects: *il libro* (m), *la casa* (f).

    ### Usually masculine
    - nouns in **-o**: *il ragazzo, il vino, il treno*
    - nouns ending in a consonant (mostly foreign words): *il bar, lo sport, il computer*
    - nouns in **-ore**: *il fiore, il colore, il dottore*

    ### Usually feminine
    - nouns in **-a**: *la ragazza, la pizza, la chiesa*
    - nouns in **-zione, -sione, -tà, -tù**: *la stazione, la città, la virtù*

    ### Nouns in -e: learn them with the article
    *il pane, il mare, il nome* (m) — *la notte, la chiave, la lezione* (f).

    ### Watch out
    - Masculine in **-a**: *il problema, il programma, il tema, il sistema, il cinema, il papà*.
    - Feminine in **-o**: *la mano, la radio, la foto, la moto* (short for *fotografia, motocicletta*).
    - People: *il ragazzo / la ragazza, lo studente / la studentessa, il / la cantante*.
  examples:
    - { es: "Il problema è il traffico.", en: "The problem is the traffic." }
    - { es: "La stazione è vicina.", en: "The station is close." }
    - { es: "La mano e il piede.", en: "The hand and the foot." }
    - { es: "Il pane e la notte.", en: "The bread and the night." }
  pitfalls:
    - "Gender is grammatical, not about meaning: *la persona* is feminine even for a man."
    - "Spanish speakers: gender often differs: *il latte* (la leche), *il fiore* (la flor), *il mare* (el mar but always masculine), *la frutta*, *il sangue* (la sangre)."
    - "Nouns in -e give no clue: always learn them with *il* or *la*."
  related: [g.articles, g.plural-nouns]
  drills:
    - { es: "La città è bella.", en: "The city is beautiful." }
    - { es: "Il sistema è semplice.", en: "The system is simple." }
    - { es: "La chiave è sul tavolo.", en: "The key is on the table." }
    - { es: "Il latte è freddo.", en: "The milk is cold." }
- id: g.articles
  level: a1
  title: "Articles: il, lo, l', la, i, gli, le (and un, uno, una, un')"
  summary: "'the' and 'a' depend on gender, number and the sound the next word starts with."
  explanation: |
    | | singular | plural | used before |
    |---|---|---|---|
    | masculine | **il** libro | **i** libri | most consonants |
    | masculine | **lo** studente, **lo** zaino | **gli** studenti, **gli** zaini | s + consonant, z, gn, ps, y, x |
    | masculine | **l'**amico | **gli** amici | vowels |
    | feminine | **la** casa | **le** case | consonants |
    | feminine | **l'**amica | **le** amiche | vowels |

    ### How to choose
    1. Look at the **first sound** of the word right after the article (noun or adjective).
    2. *s + consonant* (*sp, st, sc…*), *z*, *gn*, *ps* → **lo / gli**: *lo sport, lo zio, gli gnocchi, lo psicologo*.
    3. Vowel → **l'** in the singular (both genders); plural masculine **gli**, feminine **le**.

    ### When Italian uses 'the' and English does not
    - General statements: *Il caffè è buono. Amo la musica.*
    - Possessives: *la mia casa* (my house).
    - Countries and regions: *l'Italia è bella, la Toscana*.
    - Titles: *il signor Rossi, la dottoressa Bruni* (but not when you speak to them).

    ### The indefinite article follows the same sound rules
    *un libro, un amico* — *uno studente, uno zaino* — *una casa* — *un'amica*. Only the feminine takes an apostrophe (see the indefinite article in unit 4).
  examples:
    - { es: "Lo zaino e gli occhiali sono qui.", en: "The backpack and the glasses are here." }
    - { es: "L'amico di Marco è simpatico.", en: "Marco's friend is nice." }
    - { es: "Gli studenti e le studentesse.", en: "The male and female students." }
    - { es: "Il caffè italiano è forte.", en: "Italian coffee is strong." }
  pitfalls:
    - "The article depends on the next word, not the noun: *lo stesso libro*, *il vecchio amico*, *l'altro zio*."
    - "*Gli* before vowels and s + consonant: *gli amici, gli studenti*, never *i amici*."
    - "Spanish speakers: *lo* here is a masculine article (*lo sport*), not the neuter *lo* of Spanish."
  related: [g.gender-nouns, g.articles-indefinite, g.articulated-prepositions]
  drills:
    - { es: "Gli zii arrivano domani.", en: "The uncles arrive tomorrow." }
    - { es: "L'acqua è fresca.", en: "The water is cool." }
    - { es: "Lo specchio è nel bagno.", en: "The mirror is in the bathroom." }
    - { es: "Le amiche di Sara sono qui.", en: "Sara's friends are here." }
    - { es: "Il treno è in ritardo.", en: "The train is late." }
- id: g.adjective-agreement
  level: a1
  title: "Adjectives agree with the noun"
  summary: "alto / alta / alti / alte; grande / grandi — adjectives change for gender and number."
  explanation: |
    ### Adjectives in -o: four forms
    | | singular | plural |
    |---|---|---|
    | masculine | *alto* | *alti* |
    | feminine | *alta* | *alte* |

    *un ragazzo alto, una ragazza alta, due ragazzi alti, due ragazze alte.*

    ### Adjectives in -e: two forms
    Same for masculine and feminine: *grande → grandi, inglese → inglesi, gentile → gentili*.
    *un uomo gentile, una donna gentile, persone gentili.*

    ### Mixed groups
    A mixed group takes the masculine plural: *Marco e Anna sono simpatici.*

    ### Invariable adjectives
    Some colours (*blu, rosa, viola, beige*) and *pari, dispari* never change: *le scarpe blu*.
  examples:
    - { es: "La pizza è buona e calda.", en: "The pizza is good and hot." }
    - { es: "I ragazzi sono stanchi.", en: "The boys are tired." }
    - { es: "Le case sono grandi.", en: "The houses are big." }
    - { es: "Mia madre è inglese, mio padre è italiano.", en: "My mother is English, my father is Italian." }
  pitfalls:
    - "Adjectives in -e do not have a feminine in -a: *una ragazza inglese*, never *inglesa*."
    - "Adjectives in -co, -go often add -h- in the plural: *bianco → bianchi, lungo → lunghi* (but *simpatico → simpatici*)."
    - "Spanish speakers: the plural is a vowel change, not -s: *alti, alte*, not *altos*."
  related: [g.gender-nouns, g.plural-nouns, g.adjective-position]
  drills:
    - { es: "Le ragazze sono simpatiche.", en: "The girls are nice." }
    - { es: "Un libro interessante.", en: "An interesting book." }
    - { es: "Due città italiane.", en: "Two Italian cities." }
    - { es: "I vestiti sono bianchi.", en: "The clothes are white." }
- id: g.essere-di
  level: a1
  title: "Di dove sei? — origin and nationality"
  summary: "essere di + city; essere + nationality adjective; abitare a / in."
  explanation: |
    - *Di dove sei?* (informal) / *Di dov'è?* (formal) — Where are you from?
    - Answer with **essere di + city**: *Sono di Roma. Siamo di Londra.*
    - Or with a nationality adjective: *Sono inglese. Lei è americana.*
    - For countries, use the adjective or *vengo da*: *Sono irlandese* / *Vengo dall'Irlanda.*

    ### Where you live
    - *Abito a* + city: *Abito a Roma.*
    - *Abito in* + country or region: *Abito in Italia, in Toscana.*

    ### Common nationalities
    | -o / -a | -e (m and f) |
    |---|---|
    | *italiano/a, americano/a, spagnolo/a, tedesco/a, russo/a* | *inglese, francese, irlandese, canadese, cinese, giapponese* |

    Nationalities and languages are written in lower case: *italiano*, but *l'Italia*.
  examples:
    - { es: "Sono di Manchester, ma abito a Roma.", en: "I'm from Manchester, but I live in Rome." }
    - { es: "Lei è spagnola?", en: "Are you Spanish? (formal, to a woman)" }
    - { es: "I miei amici sono tedeschi.", en: "My friends are German." }
    - { es: "Abitiamo in Italia da un anno.", en: "We have lived in Italy for a year." }
  pitfalls:
    - "With cities use *di*, not *da*: *Sono di Milano*. *Vengo da Milano* is also fine."
    - "*Abito a Roma* but *abito in Italia*: *a* for cities, *in* for countries and regions."
    - "No capital letters for nationalities: *sono canadese*."
  related: [g.essere-present, g.adjective-agreement, g.prepositions-motion]
  drills:
    - { es: "Di dove siete? Siamo di Dublino.", en: "Where are you from? We're from Dublin." }
    - { es: "Mia nonna è francese.", en: "My grandmother is French." }
    - { es: "Abito a Roma ma sono di Napoli.", en: "I live in Rome but I'm from Naples." }
- id: g.negation
  level: a1
  title: "Saying no: non before the verb"
  summary: "Put non directly before the verb; answer with No, non…"
  explanation: |
    - **non** goes immediately before the verb (and before any pronoun attached to it): *Non sono di qui. Non mi chiamo Paolo.*
    - To answer a question: *Sei medico? — No, non sono medico.* (Yes = *sì*, with an accent.)
    - There is no helper verb like English 'do': *non parlo* = I don't speak.
    - *No* alone is the answer word; *non* is the word that negates a verb.

    ### Common negative words
    *Non… mai* (never), *non… niente* (nothing), *non… nessuno* (nobody) wrap round the verb: *Non mangio mai carne.* You will see more in A2.
  examples:
    - { es: "Non parlo tedesco.", en: "I don't speak German." }
    - { es: "Non è la mia borsa.", en: "It isn't my bag." }
    - { es: "No, grazie, non bevo caffè.", en: "No, thanks, I don't drink coffee." }
    - { es: "Non ci sono problemi.", en: "There are no problems." }
  pitfalls:
    - "Use *non*, not *no*, before a verb: *non sono*, never *no sono*."
    - "*Sì* (yes) has an accent; *si* without it is a pronoun."
    - "Spanish speakers: *no* + verb in Spanish becomes *non* + verb in Italian."
  related: [g.double-negation, g.essere-present]
  drills:
    - { es: "Lei non è italiana.", en: "She isn't Italian." }
    - { es: "Non abitiamo a Roma.", en: "We don't live in Rome." }
    - { es: "No, non capisco.", en: "No, I don't understand." }
- id: g.avere-present
  level: a1
  title: "The verb avere (to have)"
  summary: "ho, hai, ha, abbiamo, avete, hanno — possession, age, and many fixed expressions."
  explanation: |
    | | avere |
    |---|---|
    | io | **ho** |
    | tu | **hai** |
    | lui / lei / Lei | **ha** |
    | noi | **abbiamo** |
    | voi | **avete** |
    | loro | **hanno** |

    The **h** is silent: *ho* sounds like 'o', *hanno* like 'anno'. It is there to tell *ho* (I have) from *o* (or), *ha* (has) from *a* (to), *hanno* (they have) from *anno* (year).

    ### Uses
    - Possession: *Ho una sorella. Hai una penna?*
    - **Age**: *Quanti anni hai? — Ho vent'anni.* (literally "I have twenty years")
    - Feelings and states: *ho fame, ho sete* (see *avere* expressions).
    - It is also the helper verb for most past tenses (A2).
  examples:
    - { es: "Ho due fratelli.", en: "I have two brothers." }
    - { es: "Quanti anni ha tua madre?", en: "How old is your mother?" }
    - { es: "Abbiamo una casa a Roma.", en: "We have a house in Rome." }
    - { es: "Hanno un cane e due gatti.", en: "They have a dog and two cats." }
  pitfalls:
    - "Age uses *avere*, not *essere*: *ho trent'anni*, never *sono trenta anni*."
    - "Don't pronounce the h: *hanno* = 'AN-no'."
    - "*Hanno* (they have) needs the h; *anno* (year) does not."
  related: [g.avere-expressions, g.numbers-0-100]
  drills:
    - { es: "Hai fratelli o sorelle?", en: "Do you have brothers or sisters?" }
    - { es: "Mio nonno ha ottant'anni.", en: "My grandfather is eighty." }
    - { es: "Avete una macchina?", en: "Do you have a car?" }
    - { es: "Non ho tempo oggi.", en: "I don't have time today." }
- id: g.possessives
  level: a1
  title: "Possessives: il mio, la tua, i suoi…"
  summary: "Possessives agree with the thing owned and normally come with the article."
  explanation: |
    | owner | m. sing. | f. sing. | m. plural | f. plural |
    |---|---|---|---|---|
    | io | *il mio* | *la mia* | *i miei* | *le mie* |
    | tu | *il tuo* | *la tua* | *i tuoi* | *le tue* |
    | lui / lei / Lei | *il suo* | *la sua* | *i suoi* | *le sue* |
    | noi | *il nostro* | *la nostra* | *i nostri* | *le nostre* |
    | voi | *il vostro* | *la vostra* | *i vostri* | *le vostre* |
    | loro | *il loro* | *la loro* | *i loro* | *le loro* |

    ### Key points
    - The possessive agrees with the **thing owned**, not the owner: *Marco e la sua casa* (his house), *Anna e il suo libro* (her book).
    - *suo* means both 'his' and 'her' (and formal 'your', often written *Suo*).
    - *loro* never changes.
    - Italian normally keeps the article: *la mia macchina* (my car), *un mio amico* (a friend of mine).
    - Without the article after *essere*: *È mio.* (It's mine.)
  examples:
    - { es: "La mia casa è vicino al Pantheon.", en: "My house is near the Pantheon." }
    - { es: "Dove sono i tuoi libri?", en: "Where are your books?" }
    - { es: "Paolo e la sua ragazza.", en: "Paolo and his girlfriend." }
    - { es: "Questa è la loro macchina.", en: "This is their car." }
  pitfalls:
    - "*Il suo* agrees with the object: Anna's car is *la sua macchina*, Marco's car is also *la sua macchina*."
    - "Don't drop the article: *la mia borsa*, not *mia borsa* (except with family, see next note)."
    - "Spanish speakers: Italian says *il mio libro*, not *mi libro*; the article stays."
  related: [g.possessives-family, g.articles]
  drills:
    - { es: "Il nostro appartamento è piccolo.", en: "Our flat is small." }
    - { es: "Le sue amiche sono simpatiche.", en: "Her friends are nice." }
    - { es: "Questo è il vostro tavolo.", en: "This is your table." }
    - { es: "I miei genitori abitano a Bari.", en: "My parents live in Bari." }
- id: g.possessives-family
  level: a1
  title: "Mia madre, i miei fratelli — possessives with family"
  summary: "No article with a singular, unmodified family noun: mia madre; but i miei fratelli, la mia mamma."
  explanation: |
    With **singular family nouns** the article disappears:
    - *mio padre, mia madre, mio fratello, mia sorella, mio zio, tua nonna, suo marito, sua moglie, nostro figlio*

    The article **comes back** when:
    | case | example |
    |---|---|
    | plural | *i miei fratelli, le mie sorelle* |
    | the possessive is *loro* | *la loro madre* |
    | the noun has an adjective | *la mia sorella maggiore, il mio caro zio* |
    | affectionate / altered forms | *la mia mamma, il mio papà, la mia sorellina* |
    | *fidanzato/a, ragazzo/a, compagno/a* (not strictly family) | *il mio ragazzo, la mia fidanzata* |

    *Famiglia* itself always takes the article: *la mia famiglia*.
  examples:
    - { es: "Mia sorella si chiama Laura.", en: "My sister's name is Laura." }
    - { es: "I miei nonni abitano a Frascati.", en: "My grandparents live in Frascati." }
    - { es: "La loro figlia ha sei anni.", en: "Their daughter is six." }
    - { es: "Il mio fratello maggiore è medico.", en: "My older brother is a doctor." }
  pitfalls:
    - "Never *la mia madre* in standard Italian: say *mia madre*."
    - "But always *i miei genitori, le mie cugine*: plurals keep the article."
    - "*Mamma* and *papà* usually keep it: *la mia mamma*, although *mia mamma* is common in the North."
  variant: "In northern Italy *mia mamma* and *mio papà* without the article are widespread in speech; in Tuscany and Rome *la mi' mamma* or *mi' madre* may be heard in dialect."
  related: [g.possessives, g.articles]
  drills:
    - { es: "Mio padre lavora in banca.", en: "My father works in a bank." }
    - { es: "Le mie cugine sono di Milano.", en: "My cousins are from Milan." }
    - { es: "Come si chiama tua moglie?", en: "What's your wife's name?" }
    - { es: "La mia famiglia è grande.", en: "My family is big." }
- id: g.plural-nouns
  level: a1
  title: "Plural nouns: -o → -i, -a → -e, -e → -i"
  summary: "Italian makes plurals by changing the final vowel; some nouns never change."
  explanation: |
    | singular | plural | example |
    |---|---|---|
    | -o (m) | **-i** | *il libro → i libri* |
    | -a (f) | **-e** | *la casa → le case* |
    | -e (m or f) | **-i** | *il pane → i pani, la chiave → le chiavi* |
    | -a (m) | **-i** | *il problema → i problemi* |

    ### Nouns that never change
    - stressed final vowel: *la città → le città, il caffè → i caffè, l'università → le università*
    - one-syllable words: *il re → i re*
    - foreign words: *il bar → i bar, lo sport → gli sport, il film → i film*
    - shortened words: *la foto → le foto, la moto → le moto, il cinema → i cinema*
    - nouns in -i and -ie: *la crisi → le crisi, la serie → le serie*

    ### Spelling: -co, -go, -ca, -ga
    - *-ca, -ga* always add **h**: *l'amica → le amiche, la riga → le righe*
    - *-go* usually: *il lago → i laghi*; *-co* depends on stress: *il parco → i parchi*, but *l'amico → gli amici, il medico → i medici*.
  examples:
    - { es: "Due caffè, per favore.", en: "Two coffees, please." }
    - { es: "Le chiavi sono sul tavolo.", en: "The keys are on the table." }
    - { es: "Roma e Firenze sono due città bellissime.", en: "Rome and Florence are two beautiful cities." }
    - { es: "Ho tre amiche italiane.", en: "I have three Italian (female) friends." }
  pitfalls:
    - "Never add -s: *i film*, not *i films*; *due caffè*, not *due caffès*."
    - "Some plurals are irregular: *l'uomo → gli uomini, l'uovo → le uova, il dito → le dita* (more in A2)."
    - "Spanish speakers: Italian plurals change the vowel instead of adding -s: *ragazzi*, not *ragazzos*."
  related: [g.gender-nouns, g.adjective-agreement, g.irregular-plurals-body]
  drills:
    - { es: "I treni sono in ritardo.", en: "The trains are late." }
    - { es: "Le università sono chiuse.", en: "The universities are closed." }
    - { es: "Gli amici di Luca sono simpatici.", en: "Luca's friends are nice." }
    - { es: "Due pizze e due birre.", en: "Two pizzas and two beers." }
- id: g.numbers-0-100
  level: a1
  title: "Numbers 0–100"
  summary: "zero, uno, due… venti, ventuno, ventotto, trenta… cento."
  explanation: |
    | | | | |
    |---|---|---|---|
    | 0 zero | 1 uno | 2 due | 3 tre |
    | 4 quattro | 5 cinque | 6 sei | 7 sette |
    | 8 otto | 9 nove | 10 dieci | 11 undici |
    | 12 dodici | 13 tredici | 14 quattordici | 15 quindici |
    | 16 sedici | 17 diciassette | 18 diciotto | 19 diciannove |

    **Tens**: *venti, trenta, quaranta, cinquanta, sessanta, settanta, ottanta, novanta, cento.*

    ### Building 21–99
    Join tens and units in one word: *ventidue, trentacinque, quarantasei*.
    - Before *uno* and *otto* the tens **drop their final vowel**: *ventuno, ventotto, trentuno, trentotto*.
    - Numbers ending in *tre* take an accent: *ventitré, trentatré*.
    - *uno* behaves like the article before a noun: *ventun anni* or *ventuno anni* (both used).
  examples:
    - { es: "Ho ventotto anni.", en: "I'm twenty-eight." }
    - { es: "Il numero è trentatré.", en: "The number is thirty-three." }
    - { es: "Il 64 va a San Pietro.", en: "The (bus) 64 goes to St Peter's." }
    - { es: "Siamo in diciannove.", en: "There are nineteen of us." }
  pitfalls:
    - "*Ventuno, ventotto* (not *ventiuno, ventiotto*): the final vowel drops before 1 and 8."
    - "Don't forget the accent on *ventitré, trentatré*."
    - "Spanish speakers: no *y* between tens and units: *trentadue*, not *trenta e due*."
  related: [g.numbers-100-plus, g.avere-present]
  drills:
    - { es: "Mia sorella ha quarantun anni.", en: "My sister is forty-one." }
    - { es: "Il mio numero è il diciassette.", en: "My number is seventeen." }
    - { es: "Novantanove più uno fa cento.", en: "Ninety-nine plus one makes a hundred." }
    - { es: "Abito al numero cinquantotto.", en: "I live at number fifty-eight." }
- id: g.question-words
  level: a1
  title: "Question words: chi, che cosa, dove, come, quando, quanto, perché"
  summary: "Questions often keep normal word order; intonation does the work."
  explanation: |
    | word | meaning | example |
    |---|---|---|
    | *chi?* | who? | *Chi è?* |
    | *che cosa? / cosa? / che?* | what? | *Che cosa fai?* |
    | *dove?* | where? | *Dove abiti?* |
    | *come?* | how? / what… like? | *Come stai? Com'è Roma?* |
    | *quando?* | when? | *Quando arrivi?* |
    | *quanto/a/i/e?* | how much / how many? | *Quanti anni hai?* |
    | *perché?* | why? (and 'because') | *Perché studi italiano?* |
    | *quale / quali?* | which? | *Qual è il tuo numero?* |

    ### Yes/no questions
    Just raise your voice at the end: *Sei italiano?* — the word order does not change.

    ### Elision
    *Dove è → dov'è, come è → com'è, cosa è → cos'è*. *Qual è* has **no** apostrophe.
  examples:
    - { es: "Chi è quel ragazzo?", en: "Who is that boy?" }
    - { es: "Dove abita tua sorella?", en: "Where does your sister live?" }
    - { es: "Qual è il tuo numero di telefono?", en: "What's your phone number?" }
    - { es: "Perché sei qui? Perché lavoro qui.", en: "Why are you here? Because I work here." }
  pitfalls:
    - "*Qual è* has no apostrophe: *qual'è* is a very common error."
    - "*Quanto* agrees: *quanta pasta, quanti anni, quante persone*."
    - "Use *qual è* (which/what) for a number, name or address, not *che cosa è*."
  related: [g.quanto-costa, g.essere-present]
  drills:
    - { es: "Come si chiama il tuo cane?", en: "What's your dog called?" }
    - { es: "Quando parte il treno?", en: "When does the train leave?" }
    - { es: "Che cosa mangiamo stasera?", en: "What are we eating tonight?" }
    - { es: "Quante persone ci sono?", en: "How many people are there?" }
- id: g.c-e-ci-sono
  level: a1
  title: "C'è / ci sono — there is, there are"
  summary: "c'è + singular, ci sono + plural; dov'è? asks where a known thing is."
  explanation: |
    - **c'è** (*ci è*) + singular: *C'è un bar qui vicino.*
    - **ci sono** + plural: *Ci sono due farmacie in questa via.*
    - Negative: *Non c'è latte. Non ci sono taxi.*
    - Question: *C'è un bancomat? Ci sono posti liberi?*

    ### c'è or è?
    - *C'è* introduces something new (existence): *C'è una fontana in piazza.*
    - *È* locates something already known, usually with *il/la*: *La fontana è in piazza.* — *Dov'è la stazione?*

    | existence | location |
    |---|---|
    | *C'è una farmacia?* | *Dov'è la farmacia?* |
    | *Ci sono dei negozi.* | *I negozi sono in centro.* |

    *C'è Marco?* also means "Is Marco in/there?" — on the phone or at the door.
  examples:
    - { es: "Nel mio quartiere c'è un mercato.", en: "There's a market in my neighbourhood." }
    - { es: "Ci sono molti turisti a Trastevere.", en: "There are lots of tourists in Trastevere." }
    - { es: "Scusi, dov'è la metro?", en: "Excuse me, where is the metro?" }
    - { es: "Pronto, c'è Giulia?", en: "Hello, is Giulia there?" }
  pitfalls:
    - "Don't use *c'è* with a definite thing you are locating: *Dov'è il Colosseo?*, not *Dove c'è il Colosseo?*"
    - "Plural needs *ci sono*: *ci sono due bagni*, not *c'è due bagni*."
    - "Spanish speakers: *hay* has two forms in Italian, *c'è* and *ci sono*."
  related: [g.essere-present, g.articles-indefinite, g.ci-place]
  drills:
    - { es: "C'è un supermercato qui vicino?", en: "Is there a supermarket near here?" }
    - { es: "In cucina ci sono quattro sedie.", en: "There are four chairs in the kitchen." }
    - { es: "Non c'è nessuno a casa.", en: "There's nobody at home." }
    - { es: "Dove sono i bagni?", en: "Where are the toilets?" }
- id: g.articles-indefinite
  level: a1
  title: "The indefinite article: un, uno, una, un'"
  summary: "un libro, uno zaino, una casa, un'amica — 'a/an' follows the same sound rules as il/lo/la."
  explanation: |
    | | before | example |
    |---|---|---|
    | **un** | masculine, most consonants and all vowels | *un libro, un amico* |
    | **uno** | masculine, s + consonant, z, gn, ps, y | *uno studente, uno zio, uno yogurt* |
    | **una** | feminine, consonants | *una casa, una stanza* |
    | **un'** | feminine, vowels | *un'amica, un'ora* |

    ### The apostrophe test
    *un amico* (m, no apostrophe) vs *un'amica* (f, apostrophe). The apostrophe shows that a vowel (*una*) was dropped.

    ### Plural 'some'
    There is no plural *un*: use *dei, degli, delle* (see partitive) or nothing: *Ho degli amici a Roma / Ho amici a Roma.*
  examples:
    - { es: "C'è uno specchio in bagno.", en: "There's a mirror in the bathroom." }
    - { es: "Ho un'idea!", en: "I've got an idea!" }
    - { es: "Vorrei un panino e una birra.", en: "I'd like a sandwich and a beer." }
    - { es: "Marco è un amico di Luca.", en: "Marco is a friend of Luca's." }
  pitfalls:
    - "*Un amico* has no apostrophe; *un'amica* does. Getting this wrong is the classic written mistake."
    - "*Uno* before s + consonant and z: *uno sconto, uno zaino*, not *un zaino*."
    - "No article with professions after *essere*: *È ingegnere*, not *è un ingegnere*."
  related: [g.articles, g.partitive-di]
  drills:
    - { es: "Un'amica mia abita a Testaccio.", en: "A friend of mine lives in Testaccio." }
    - { es: "Lui è uno psicologo bravo.", en: "He is a good psychologist." }
    - { es: "Abbiamo una camera e un bagno.", en: "We have a bedroom and a bathroom." }
    - { es: "C'è un ufficio postale?", en: "Is there a post office?" }
- id: g.simple-prepositions
  level: a1
  title: "Simple prepositions: di, a, da, in, con, su, per, tra/fra"
  summary: "The eight basic prepositions, and the place words built with them."
  explanation: |
    | prep. | main meanings | example |
    |---|---|---|
    | *di* | of, from (origin), possession | *il libro di Anna, sono di Roma* |
    | *a* | to, at, in (cities) | *vado a Roma, a casa* |
    | *da* | from, at/to someone's place, since | *da Milano, da Marco* |
    | *in* | in, to (countries, rooms, shops) | *in Italia, in cucina* |
    | *con* | with | *con gli amici* |
    | *su* | on | *su un tavolo* |
    | *per* | for, through | *per te, per strada* |
    | *tra / fra* | between, among, in (time) | *tra la banca e il bar* |

    ### Place expressions (with *a* or *di*)
    *vicino a* (near), *accanto a* (next to), *davanti a* (in front of), *di fronte a* (opposite), *dietro* (behind), *sotto* (under), *sopra* (above), *dentro* (inside), *fuori* (outside), *lontano da* (far from).

    Many prepositions fuse with the article (*a + il = al*): see articulated prepositions.
  examples:
    - { es: "Il gatto è sotto il letto.", en: "The cat is under the bed." }
    - { es: "La farmacia è vicino a casa mia.", en: "The pharmacy is near my house." }
    - { es: "Il bar è tra la banca e la chiesa.", en: "The bar is between the bank and the church." }
    - { es: "Vivo con due amici.", en: "I live with two friends." }
  pitfalls:
    - "*Vicino a*, *davanti a*, *accanto a* need *a*: *vicino a me*, not *vicino me*."
    - "*Lontano da*, not *lontano di*."
    - "Spanish speakers: *en* splits into *in* (countries, rooms) and *a* (cities, home): *a Roma, in Italia, a casa*."
  related: [g.articulated-prepositions, g.prepositions-motion]
  drills:
    - { es: "Le chiavi sono dentro la borsa.", en: "The keys are inside the bag." }
    - { es: "Il divano è davanti alla televisione.", en: "The sofa is in front of the television." }
    - { es: "La scuola è lontano da qui.", en: "The school is far from here." }
    - { es: "Un caffè per me, grazie.", en: "A coffee for me, thanks." }
- id: g.articulated-prepositions
  level: a1
  title: "Articulated prepositions: al, del, nella, sui…"
  summary: "di, a, da, in, su merge with the definite article: a + il = al, in + la = nella."
  explanation: |
    | | il | lo | l' | la | i | gli | le |
    |---|---|---|---|---|---|---|---|
    | **di** | del | dello | dell' | della | dei | degli | delle |
    | **a** | al | allo | all' | alla | ai | agli | alle |
    | **da** | dal | dallo | dall' | dalla | dai | dagli | dalle |
    | **in** | nel | nello | nell' | nella | nei | negli | nelle |
    | **su** | sul | sullo | sull' | sulla | sui | sugli | sulle |

    ### How to build them
    1. Choose the article the noun needs (*lo stadio*).
    2. Fuse: *a + lo = allo* → *allo stadio*. Forms with *l* double it: *della, alla, nella*. *In* becomes *ne-*.
    3. *Con* and *per* normally stay separate: *con il / col, per la*.

    ### Typical uses
    - *al bar, al mare, alla stazione* (to/at)
    - *nel centro, nella borsa* (in)
    - *sul tavolo* (on), *dal medico* (at the doctor's), *la casa dei nonni* (of the)
  examples:
    - { es: "Il libro è sul tavolo.", en: "The book is on the table." }
    - { es: "Andiamo al bar?", en: "Shall we go to the bar?" }
    - { es: "Il latte è nel frigo.", en: "The milk is in the fridge." }
    - { es: "Il centro della città è bellissimo.", en: "The city centre is beautiful." }
  pitfalls:
    - "Don't write *a il* or *in la*: the fusion is obligatory: *al, nella*."
    - "No article (so no fusion) with *a casa, in centro, in cucina, in Italia*: these are fixed bare expressions."
    - "Spanish has only *al* and *del*; Italian fuses five prepositions with every article."
  related: [g.simple-prepositions, g.articles, g.partitive-di]
  drills:
    - { es: "Le chiavi sono nella borsa.", en: "The keys are in the bag." }
    - { es: "Vado dal dentista alle tre.", en: "I'm going to the dentist at three." }
    - { es: "La foto è sullo scaffale.", en: "The photo is on the shelf." }
    - { es: "Il bagno è in fondo al corridoio.", en: "The bathroom is at the end of the corridor." }
    - { es: "Parliamo degli amici di Sara.", en: "Let's talk about Sara's friends." }
- id: g.questo
  level: a1
  title: "Questo, questa — this, these"
  summary: "questo / questa / questi / queste, for things near you; also 'this one'."
  explanation: |
    | | singular | plural |
    |---|---|---|
    | masculine | *questo* | *questi* |
    | feminine | *questa* | *queste* |

    - As an adjective: *questo libro, questa casa, questi ragazzi, queste chiavi*.
    - Before a vowel, *quest'* is common in the singular: *quest'anno, quest'estate*.
    - As a pronoun ('this one'): *Quale vuoi? — Questo.*
    - Introducing people: *Questo è mio fratello. Questa è Giulia.*
    - *Stamattina, stasera, stanotte, stavolta* come from *questa mattina, questa sera…*

    The 'that' word, *quello*, has forms like the article: see *quello* in unit 8.
  examples:
    - { es: "Questa è la mia camera.", en: "This is my bedroom." }
    - { es: "Questi sono i miei vicini.", en: "These are my neighbours." }
    - { es: "Quest'anno abito a Roma.", en: "This year I live in Rome." }
    - { es: "Ci vediamo stasera?", en: "Shall we meet tonight?" }
  pitfalls:
    - "*Questo* agrees with the noun: *queste scarpe*, not *questo scarpe*."
    - "No article after *questo*: *questo libro*, never *questo il libro*."
    - "Spanish speakers: *esto* (neuter) is also *questo* in Italian: *Che cos'è questo?*"
  related: [g.quello-forms, g.articles]
  drills:
    - { es: "Questo appartamento è luminoso.", en: "This flat is bright." }
    - { es: "Queste sedie sono nuove.", en: "These chairs are new." }
    - { es: "Che cos'è questo?", en: "What is this?" }
    - { es: "Questa settimana lavoro molto.", en: "This week I'm working a lot." }
- id: g.present-are
  level: a1
  title: "Present tense of -are verbs (parlare)"
  summary: "parlo, parli, parla, parliamo, parlate, parlano — the biggest verb group."
  explanation: |
    Drop **-are** and add the endings:

    | | parlare | mangiare | cercare |
    |---|---|---|---|
    | io | parl**o** | mangi**o** | cerc**o** |
    | tu | parl**i** | mang**i** | cerc**hi** |
    | lui / lei / Lei | parl**a** | mangi**a** | cerc**a** |
    | noi | parl**iamo** | mang**iamo** | cerc**hiamo** |
    | voi | parl**ate** | mangi**ate** | cerc**ate** |
    | loro | parl**ano** | mangi**ano** | cerc**ano** |

    ### Spelling rules
    - Verbs in **-iare** keep one *i*: *mangi, mangiamo* (not *mangii*).
    - Verbs in **-care, -gare** add *h* before *i* to keep the hard sound: *cerchi, paghiamo*.

    ### Stress
    The *loro* form is stressed on the stem, not the ending: *PAR-la-no, a-BI-ta-no, TE-le-fo-na-no*.

    Common -are verbs: *abitare, lavorare, studiare, mangiare, comprare, pagare, ordinare, aspettare, ascoltare, guardare, arrivare, tornare, cominciare, cucinare*.
  examples:
    - { es: "Lavoro in un ristorante.", en: "I work in a restaurant." }
    - { es: "Che cosa mangiate stasera?", en: "What are you eating tonight?" }
    - { es: "Paghi tu o pago io?", en: "Are you paying or am I?" }
    - { es: "I ragazzi ascoltano la musica.", en: "The boys are listening to music." }
  pitfalls:
    - "*Mangiare* → *tu mangi*, not *mangii*; *cominciare* → *cominci*."
    - "*Pagare* → *paghi, paghiamo* with h, or the g goes soft."
    - "The Italian present also means 'I am doing': *Che cosa fai? — Guardo un film.*"
  related: [g.present-ere-ire, g.present-isc, g.subject-pronouns]
  drills:
    - { es: "Abiti a Roma?", en: "Do you live in Rome?" }
    - { es: "Studiamo italiano da un mese.", en: "We've been studying Italian for a month." }
    - { es: "Ordiniamo una pizza?", en: "Shall we order a pizza?" }
    - { es: "Loro arrivano domani.", en: "They arrive tomorrow." }
- id: g.volere-vorrei
  level: a1
  title: "Volere and vorrei — wanting and ordering politely"
  summary: "voglio, vuoi, vuole, vogliamo, volete, vogliono; vorrei = I would like."
  explanation: |
    | | volere |
    |---|---|
    | io | **voglio** |
    | tu | **vuoi** |
    | lui / lei / Lei | **vuole** |
    | noi | **vogliamo** |
    | voi | **volete** |
    | loro | **vogliono** |

    - *Volere* + noun: *Voglio un gelato.*
    - *Volere* + infinitive: *Vogliamo visitare il Vaticano.*

    ### Ordering: vorrei
    *Voglio* sounds blunt in a shop or bar. Use **vorrei** (I would like) — the conditional, learnt as a phrase:
    - *Vorrei un cappuccino, per favore.*
    - *Vorrei prenotare un tavolo per due.*

    Other polite ways to order: *Per me un caffè. — Prendo una pizza margherita. — Mi dà un etto di prosciutto?*
  examples:
    - { es: "Vorrei un caffè e un cornetto.", en: "I'd like a coffee and a croissant." }
    - { es: "Vuoi qualcosa da bere?", en: "Do you want something to drink?" }
    - { es: "I bambini vogliono un gelato.", en: "The children want an ice cream." }
    - { es: "Che cosa volete fare stasera?", en: "What do you want to do tonight?" }
  pitfalls:
    - "*Voglio un caffè* to a waiter sounds rude; say *vorrei* or *prendo*."
    - "No preposition before the infinitive: *voglio mangiare*, not *voglio di mangiare*."
    - "Spanish speakers: *quiero* → *voglio*; for 'I'd like' use *vorrei* (not *quisiera*-style *volessi*)."
  related: [g.potere-dovere, g.condizionale-courtesy]
  drills:
    - { es: "Vorrei un bicchiere d'acqua.", en: "I'd like a glass of water." }
    - { es: "Vogliamo andare al mare.", en: "We want to go to the seaside." }
    - { es: "Lei vuole un tavolo fuori?", en: "Would you like a table outside?" }
- id: g.piacere-intro
  level: a1
  title: "Mi piace — saying what you like"
  summary: "mi piace + singular noun or infinitive; the thing liked is the subject."
  explanation: |
    *Piacere* works backwards compared with English: the thing you like is the subject, and the person is an indirect object.

    | | |
    |---|---|
    | *mi piace* | I like (it pleases me) |
    | *ti piace* | you like |
    | *gli piace / le piace* | he likes / she likes |
    | *Le piace* | you like (formal) |
    | *ci piace* | we like |
    | *vi piace* | you all like |
    | *gli piace* | they like |

    - With a singular noun: *Mi piace la pizza.*
    - With a verb (infinitive): *Mi piace cucinare.*
    - Negative: *Non mi piace il caffè americano.*
    - With a name, use *a*: *A Marco piace il calcio. A me piace, a te?*

    Plural things (*mi piacciono i dolci*) come in unit 10.
  examples:
    - { es: "Mi piace molto la cucina romana.", en: "I really like Roman cooking." }
    - { es: "Ti piace il vino rosso?", en: "Do you like red wine?" }
    - { es: "A mia sorella piace ballare.", en: "My sister likes dancing." }
    - { es: "Non ci piace aspettare.", en: "We don't like waiting." }
  pitfalls:
    - "Not *io piaccio la pizza*: the pizza does the pleasing: *mi piace la pizza*."
    - "Keep the article with the noun: *mi piace la pasta*, not *mi piace pasta*."
    - "Spanish speakers: same logic as *gustar*, but 'a mí me gusta' is *a me piace* (no double pronoun)."
  related: [g.piacere-plural, g.stressed-pronouns]
  drills:
    - { es: "Le piace questo ristorante?", en: "Do you like this restaurant? (formal)" }
    - { es: "Mi piace leggere la sera.", en: "I like reading in the evening." }
    - { es: "A Paolo non piace il pesce.", en: "Paolo doesn't like fish." }
- id: g.partitive-di
  level: a1
  title: "Some: del pane, dell'acqua, dei pomodori"
  summary: "di + article means 'some'; un po' di is the everyday alternative."
  explanation: |
    The partitive is the articulated preposition *di + article*:

    | | singular (uncountable) | plural (countable) |
    |---|---|---|
    | masculine | *del pane, dello zucchero, dell'olio* | *dei pomodori, degli spaghetti* |
    | feminine | *della frutta, dell'acqua* | *delle olive* |

    - Singular = 'some' of something you can't count: *Vorrei del pane.*
    - Plural = 'some' / 'a few': *Ho comprato delle mele.*

    ### Alternatives
    - *un po' di* + singular: *un po' di latte, un po' di pazienza*.
    - *qualche* + **singular** noun (for plural meaning): *qualche oliva* = some olives.
    - Often nothing at all: *Compro pane e latte.*
    - In negative sentences, no partitive: *Non ho pane.*
  examples:
    - { es: "Vorrei dell'acqua naturale, per favore.", en: "I'd like some still water, please." }
    - { es: "Prendiamo delle olive?", en: "Shall we get some olives?" }
    - { es: "C'è un po' di zucchero?", en: "Is there a bit of sugar?" }
    - { es: "Ho degli amici a Roma.", en: "I have some friends in Rome." }
  pitfalls:
    - "*Un po' di* has an apostrophe, not an accent: *po'*, never *pò*."
    - "*Qualche* is always followed by a singular noun: *qualche giorno*, not *qualche giorni*."
    - "No partitive after *non*: *non ho soldi*, not *non ho dei soldi*."
  related: [g.articulated-prepositions, g.ne-partitive]
  drills:
    - { es: "Mi dà del prosciutto?", en: "Can you give me some ham?" }
    - { es: "Compro delle pesche al mercato.", en: "I'm buying some peaches at the market." }
    - { es: "Vuoi un po' di vino?", en: "Do you want a bit of wine?" }
    - { es: "Ci sono degli spaghetti in cucina.", en: "There's some spaghetti in the kitchen." }
- id: g.present-ere-ire
  level: a1
  title: "Present tense of -ere and -ire verbs (prendere, dormire)"
  summary: "prendo, prendi, prende, prendiamo, prendete, prendono; dormo… dormite, dormono."
  explanation: |
    | | prendere | dormire |
    |---|---|---|
    | io | prend**o** | dorm**o** |
    | tu | prend**i** | dorm**i** |
    | lui / lei / Lei | prend**e** | dorm**e** |
    | noi | prend**iamo** | dorm**iamo** |
    | voi | prend**ete** | dorm**ite** |
    | loro | prend**ono** | dorm**ono** |

    Only the **voi** form differs: *-ete* vs *-ite*.

    ### Common verbs
    - -ere: *leggere, scrivere, vedere, vivere, chiudere, mettere, ricevere, chiedere, rispondere, correre, perdere*
    - -ire: *dormire, partire, aprire, sentire, offrire, seguire*

    ### Pronunciation of -cere, -gere
    The sound changes with the vowel: *leggo* (hard g), *leggi* (soft g), *leggono* (hard). *Vinco / vinci*. Spelling stays the same.
  examples:
    - { es: "Leggo il giornale ogni mattina.", en: "I read the paper every morning." }
    - { es: "A che ora parte l'autobus?", en: "What time does the bus leave?" }
    - { es: "Dormite bene qui?", en: "Do you sleep well here?" }
    - { es: "Prendiamo un taxi.", en: "We'll take a taxi." }
  pitfalls:
    - "*Leggo* has a hard g, *leggi* a soft one: the spelling doesn't add h."
    - "Stress the stem in the *loro* form: *PREN-do-no, SCRI-vo-no, DOR-mo-no*."
    - "Many -ire verbs add *-isc-* (*capisco*): check the next note."
  related: [g.present-are, g.present-isc, g.irregular-present]
  drills:
    - { es: "Scrivi molti messaggi?", en: "Do you write a lot of messages?" }
    - { es: "Apriamo la finestra?", en: "Shall we open the window?" }
    - { es: "Loro vivono in centro.", en: "They live in the centre." }
    - { es: "Partite domani?", en: "Are you leaving tomorrow?" }
- id: g.present-isc
  level: a1
  title: "-isc- verbs (capire, finire, preferire)"
  summary: "Many -ire verbs add -isc- in four forms: capisco, capisci, capisce, capiscono."
  explanation: |
    | | capire |
    |---|---|
    | io | cap**isc**o |
    | tu | cap**isc**i |
    | lui / lei / Lei | cap**isc**e |
    | noi | capiamo |
    | voi | capite |
    | loro | cap**isc**ono |

    *Noi* and *voi* have **no** -isc-.

    ### Pronunciation
    *-isco, -iscono* are pronounced with a hard 'sk'; *-isci, -isce* with 'sh': *ca-PI-sko, ca-PI-shi, ca-PI-she*.

    ### Common -isc- verbs
    *capire, finire, preferire, pulire, spedire, costruire, restituire, suggerire, sparire*.
    Dictionaries mark them; *dormire, partire, sentire, aprire, offrire* do **not** take -isc-.
  examples:
    - { es: "Scusi, non capisco.", en: "Sorry, I don't understand." }
    - { es: "A che ora finisci di lavorare?", en: "What time do you finish work?" }
    - { es: "Preferisco il tè al caffè.", en: "I prefer tea to coffee." }
    - { es: "Puliamo la casa il sabato.", en: "We clean the house on Saturdays." }
  pitfalls:
    - "No -isc- with *noi* and *voi*: *capiamo, finite*, not *capisciamo*."
    - "*Capisco* = 'ka-PI-sko' (hard), *capisci* = 'ka-PI-shi' (soft)."
    - "Spanish speakers: *prefiero* → *preferisco*; there is no e→ie change in Italian."
  related: [g.present-ere-ire]
  drills:
    - { es: "Capisci l'italiano?", en: "Do you understand Italian?" }
    - { es: "I negozi chiudono quando finisce la festa.", en: "The shops close when the party ends." }
    - { es: "Preferite la pizza o la pasta?", en: "Do you prefer pizza or pasta?" }
    - { es: "Loro capiscono tutto.", en: "They understand everything." }
- id: g.reflexive-present
  level: a1
  title: "Reflexive verbs (alzarsi, lavarsi)"
  summary: "mi alzo, ti alzi, si alza, ci alziamo, vi alzate, si alzano."
  explanation: |
    A reflexive verb has a pronoun that refers back to the subject. In the dictionary it ends in **-si**: *alzarsi, svegliarsi, lavarsi, vestirsi, chiamarsi*.

    | | alzarsi |
    |---|---|
    | io | **mi** alzo |
    | tu | **ti** alzi |
    | lui / lei / Lei | **si** alza |
    | noi | **ci** alziamo |
    | voi | **vi** alzate |
    | loro | **si** alzano |

    - The pronoun goes **before** the conjugated verb: *Mi sveglio alle sette.*
    - With an infinitive it attaches to the end: *Devo alzarmi presto* (or *Mi devo alzare presto*).
    - Many daily-routine verbs are reflexive: *svegliarsi, alzarsi, lavarsi, farsi la doccia, vestirsi, pettinarsi, riposarsi, addormentarsi*.
    - Body parts take the article, not a possessive: *Mi lavo i denti.*
  examples:
    - { es: "Mi sveglio alle sette e mi alzo alle sette e un quarto.", en: "I wake up at seven and get up at a quarter past seven." }
    - { es: "Ti fai la doccia la mattina o la sera?", en: "Do you shower in the morning or in the evening?" }
    - { es: "Ci vestiamo in fretta.", en: "We get dressed quickly." }
    - { es: "I bambini si lavano i denti.", en: "The children brush their teeth." }
  pitfalls:
    - "Don't forget the pronoun: *mi alzo*, not *alzo* (that means 'I lift')."
    - "*Mi lavo le mani*, not *lavo le mie mani*."
    - "Spanish speakers: *nos* → *ci* and *os* → *vi*."
  related: [g.chiamarsi, g.reflexive-passato-prossimo, g.time-telling]
  drills:
    - { es: "A che ora ti alzi?", en: "What time do you get up?" }
    - { es: "Mi riposo un po' dopo pranzo.", en: "I rest a bit after lunch." }
    - { es: "Vi divertite a Roma?", en: "Are you having fun in Rome?" }
    - { es: "Si addormenta sempre davanti alla TV.", en: "He always falls asleep in front of the TV." }
- id: g.time-telling
  level: a1
  title: "Telling the time: Che ore sono? Sono le tre."
  summary: "È l'una, sono le due… e un quarto, e mezza, meno un quarto; a che ora? alle otto."
  explanation: |
    - *Che ore sono?* / *Che ora è?* — What time is it?
    - *È l'una.* (1:00 — singular) / *Sono le due, le tre…* (plural)
    - *È mezzogiorno. È mezzanotte.*

    | | |
    |---|---|
    | 3:05 | *le tre e cinque* |
    | 3:15 | *le tre e un quarto* |
    | 3:30 | *le tre e mezza* (or *mezzo*) |
    | 3:45 | *le quattro meno un quarto* / *le tre e quarantacinque* |
    | 3:50 | *le quattro meno dieci* |

    ### At what time?
    - *A che ora…?* — *Alle otto. All'una. A mezzogiorno.*
    - Parts of the day: *di mattina, di pomeriggio, di sera, di notte*: *alle nove di sera*.
    - Timetables use the 24-hour clock: *Il treno parte alle 18.40* (*diciotto e quaranta*).
  examples:
    - { es: "Scusi, che ore sono? Sono le dieci e mezza.", en: "Excuse me, what time is it? It's half past ten." }
    - { es: "Pranziamo all'una.", en: "We have lunch at one." }
    - { es: "Il museo apre alle nove e chiude alle diciannove.", en: "The museum opens at nine and closes at seven p.m." }
    - { es: "Ci vediamo alle otto meno un quarto.", en: "Let's meet at a quarter to eight." }
  pitfalls:
    - "*È l'una* is singular; all other hours use *sono le*."
    - "*Alle* (a + le), not *a le*: *alle cinque*."
    - "Spanish speakers: *y media* → *e mezza*; *menos cuarto* → *meno un quarto* (with *un*)."
  related: [g.numbers-0-100, g.articulated-prepositions]
  drills:
    - { es: "Sono le sette e venti.", en: "It's twenty past seven." }
    - { es: "A che ora cominci a lavorare?", en: "What time do you start work?" }
    - { es: "Arrivo a mezzogiorno.", en: "I arrive at noon." }
    - { es: "La lezione finisce alle cinque e un quarto.", en: "The lesson ends at a quarter past five." }
- id: g.frequency-adverbs
  level: a1
  title: "How often: sempre, spesso, a volte, mai"
  summary: "Frequency adverbs usually go after the verb; mai needs non before the verb."
  explanation: |
    | | |
    |---|---|
    | *sempre* | always |
    | *di solito* | usually |
    | *spesso* | often |
    | *a volte / qualche volta* | sometimes |
    | *raramente* | rarely |
    | *non… mai* | never |

    - Position: usually **after** the verb: *Vado spesso al cinema. Mangio sempre a casa.* *Di solito* and *a volte* often start the sentence.
    - **Never** wraps round the verb: *Non bevo mai caffè.* (*Mai* alone at the start is emphatic: *Mai!*)
    - Expressions: *ogni giorno* (every day), *tutti i giorni, una volta alla settimana, due volte al mese, il lunedì* (on Mondays).
  examples:
    - { es: "Di solito faccio colazione al bar.", en: "I usually have breakfast at the bar." }
    - { es: "Non guardo mai la televisione.", en: "I never watch television." }
    - { es: "Vado in palestra due volte alla settimana.", en: "I go to the gym twice a week." }
    - { es: "A volte lavoro anche il sabato.", en: "Sometimes I work on Saturdays too." }
  pitfalls:
    - "*Non… mai*: Italian keeps *non* even with *mai* after the verb (*non esco mai*), unlike English 'I never go out'."
    - "*Sempre* goes after the verb: *mangio sempre*, not *sempre mangio* (which is emphatic or poetic)."
    - "*Ogni* takes a singular noun: *ogni giorno*, not *ogni giorni*."
  related: [g.double-negation, g.days-months]
  drills:
    - { es: "Ceno sempre alle otto.", en: "I always have dinner at eight." }
    - { es: "Non arriva mai in orario.", en: "He never arrives on time." }
    - { es: "Ci vediamo spesso il venerdì.", en: "We often see each other on Fridays." }
    - { es: "Di solito vado al lavoro in autobus.", en: "I usually go to work by bus." }
- id: g.stare-present
  level: a1
  title: "The verb stare: come stai? sto bene"
  summary: "sto, stai, sta, stiamo, state, stanno — health and mood, staying, and fixed phrases."
  explanation: |
    | | stare |
    |---|---|
    | io | **sto** |
    | tu | **stai** |
    | lui / lei / Lei | **sta** |
    | noi | **stiamo** |
    | voi | **state** |
    | loro | **stanno** |

    ### Uses
    - **How someone is** (health, wellbeing): *Come stai? — Sto bene / male / così così.*
    - **To stay, remain**: *Stasera sto a casa. Quanto tempo stai a Roma?*
    - **stare + gerund** for actions in progress (unit 11): *Sto mangiando.*
    - Fixed phrases: *stare zitto* (keep quiet), *stare attento* (be careful), *stare fermo* (keep still), *Sta' tranquillo!* (Don't worry!).

    ### essere or stare?
    For description and location Italian uses **essere**: *È stanco. È a casa.* *Stare* is mainly for wellbeing and staying, so it is far less common than Spanish *estar*.
  examples:
    - { es: "Come sta Sua madre? Sta meglio, grazie.", en: "How is your mother? She's better, thanks." }
    - { es: "Oggi sto a casa, sono stanco.", en: "Today I'm staying at home, I'm tired." }
    - { es: "State attenti alle borse!", en: "Watch your bags!" }
    - { es: "Quanto tempo state a Roma?", en: "How long are you staying in Rome?" }
  pitfalls:
    - "Description uses *essere*: *è stanca*, *è contento* (not *sta stanca* in standard Italian)."
    - "Location uses *essere*: *Dov'è il bagno?*, not *dove sta il bagno?* (which is southern regional)."
    - "Spanish speakers: don't map *estar* onto *stare*: *estoy cansado* = *sono stanco*."
  variant: "In southern Italy and Rome, *stare* is often used for location and states (*Sta a casa*, *Dove stai?* = where are you?). It is regional, not standard."
  related: [g.essere-present, g.stare-gerundio, g.greetings]
  drills:
    - { es: "Ciao, come stai? Sto benissimo!", en: "Hi, how are you? I'm great!" }
    - { es: "I bambini stanno male oggi.", en: "The children are unwell today." }
    - { es: "Sta' zitto, per favore!", en: "Be quiet, please!" }
- id: g.adjective-position
  level: a1
  title: "Where adjectives go"
  summary: "Most adjectives follow the noun; a few common ones often come before it."
  explanation: |
    ### After the noun (normal)
    Colours, nationalities, shapes and most descriptive adjectives: *una macchina rossa, un ristorante cinese, un tavolo rotondo, una ragazza simpatica*.

    ### Often before the noun
    Short, common evaluative adjectives: *bello, buono, brutto, grande, piccolo, giovane, vecchio, nuovo, lungo, caro, vero*: *una bella giornata, un piccolo problema, un vecchio amico*.

    ### Meaning can change
    | before | after |
    |---|---|
    | *un vecchio amico* (a long-standing friend) | *un amico vecchio* (an old, elderly friend) |
    | *un grande uomo* (a great man) | *un uomo grande* (a big man) |
    | *un caro amico* (a dear friend) | *un ristorante caro* (an expensive restaurant) |
    | *diversi libri* (several books) | *libri diversi* (different books) |

    *Molto, poco, tanto, ogni, qualche* and numbers always go before.
  examples:
    - { es: "Abito in una casa piccola ma bella.", en: "I live in a small but lovely house." }
    - { es: "Che bella giornata!", en: "What a lovely day!" }
    - { es: "Paolo è un caro amico.", en: "Paolo is a dear friend." }
    - { es: "È un ristorante caro.", en: "It's an expensive restaurant." }
  pitfalls:
    - "Colours and nationalities always follow: *una borsa nera*, not *una nera borsa*."
    - "*Caro* before = dear, after = expensive."
    - "English puts adjectives before the noun: resist *un italiano ristorante*."
  related: [g.adjective-agreement, g.bello-buono]
  drills:
    - { es: "Ho una nuova macchina.", en: "I have a new car." }
    - { es: "È un uomo molto simpatico.", en: "He's a very nice man." }
    - { es: "Una vecchia amica di mia madre.", en: "An old friend of my mother's." }
    - { es: "Mangiamo in un ristorante giapponese.", en: "We're eating in a Japanese restaurant." }
- id: g.bello-buono
  level: a1
  title: "Bello and buono before a noun: bel, bell', begli, buon"
  summary: "Before the noun, bello takes article-like forms (bel, bello, bell', bei, begli) and buono shortens like un."
  explanation: |
    ### bello before a noun (like *il, lo, l', i, gli*)
    | | singular | plural |
    |---|---|---|
    | like *il / i* | *un **bel** ragazzo* | *dei **bei** ragazzi* |
    | like *lo / gli* | *un **bello** spettacolo* | *dei **begli** spettacoli* |
    | like *l' / gli* (vowel) | *un **bell'**albero* | *dei **begli** alberi* |
    | feminine | *una **bella** casa, una **bell'**idea* | *delle **belle** case* |

    ### buono before a noun (like *un, uno, una, un'*)
    *un **buon** vino, un **buon** amico, un **buono** stipendio, una **buona** pizza, una **buon'**amica*. Plural is regular: *buoni, buone*.

    ### After the noun or a verb: normal forms
    *Il ragazzo è bello. Questo vino è buono. Che bello!*

    Greetings: *Buon giorno / buongiorno, buon appetito, buon viaggio, buona sera, buona notte, buon compleanno!*
  examples:
    - { es: "Che bel quadro!", en: "What a beautiful painting!" }
    - { es: "Roma ha dei begli edifici.", en: "Rome has some beautiful buildings." }
    - { es: "È un buon ristorante.", en: "It's a good restaurant." }
    - { es: "Buon appetito!", en: "Enjoy your meal!" }
  pitfalls:
    - "*Un bel ragazzo*, not *un bello ragazzo*; *dei bei fiori*, not *dei belli fiori*."
    - "*Buon* has no apostrophe before a masculine vowel: *un buon amico* (like *un amico*)."
    - "After the noun the forms are regular: *un ragazzo bello* (rare, emphatic), *dei fiori belli*."
  related: [g.adjective-position, g.quello-forms, g.articles]
  drills:
    - { es: "Un bell'appartamento in centro.", en: "A beautiful flat in the centre." }
    - { es: "Buon viaggio e buone vacanze!", en: "Have a good trip and a good holiday!" }
    - { es: "Sono dei begli occhi.", en: "They're beautiful eyes." }
    - { es: "Che bella sorpresa!", en: "What a lovely surprise!" }
- id: g.avere-expressions
  level: a1
  title: "Avere fame, avere freddo — states with avere"
  summary: "Italian says 'I have hunger, I have cold': ho fame, ho sete, ho freddo, ho sonno, ho ragione."
  explanation: |
    | Italian | English |
    |---|---|
    | *avere fame* | to be hungry |
    | *avere sete* | to be thirsty |
    | *avere caldo / freddo* | to be hot / cold (people) |
    | *avere sonno* | to be sleepy |
    | *avere paura (di)* | to be afraid (of) |
    | *avere fretta* | to be in a hurry |
    | *avere ragione / torto* | to be right / wrong |
    | *avere voglia di* | to feel like |
    | *avere bisogno di* | to need |
    | *avere … anni* | to be … years old |

    To intensify use **molta / molto** (they are nouns): *Ho molta fame. Ho molto freddo.* *Fame, sete, paura, fretta, voglia* are feminine; *freddo, caldo, sonno* masculine.

    Weather uses *fare*, not *avere*: *Fa freddo* (it's cold), but *Ho freddo* (I'm cold).
  examples:
    - { es: "Ho una fame da lupi!", en: "I'm starving! (lit. I have a wolf's hunger)" }
    - { es: "Hai ragione, è tardi.", en: "You're right, it's late." }
    - { es: "Abbiamo voglia di un gelato.", en: "We feel like an ice cream." }
    - { es: "Mio figlio ha paura dei cani.", en: "My son is afraid of dogs." }
  pitfalls:
    - "Not *sono affamato* for everyday hunger: say *ho fame*."
    - "*Molta fame*, not *molto fame*: *fame* is feminine."
    - "Don't confuse *ho caldo* (I'm hot) with *fa caldo* (it's hot weather)."
  related: [g.avere-present, g.weather, g.bisogna-avere-bisogno]
  drills:
    - { es: "Hai sete? Vuoi dell'acqua?", en: "Are you thirsty? Do you want some water?" }
    - { es: "Ho molto sonno stamattina.", en: "I'm very sleepy this morning." }
    - { es: "Non ho voglia di uscire.", en: "I don't feel like going out." }
    - { es: "Abbiamo fretta, il treno parte!", en: "We're in a hurry, the train is leaving!" }
- id: g.molto-poco-troppo
  level: a1
  title: "Molto, poco, troppo, tanto — adjective or adverb?"
  summary: "Before a noun they agree (molti amici); before an adjective or after a verb they don't change (molto bello, lavoro molto)."
  explanation: |
    ### With a noun: they agree (adjective)
    | | m. sing. | f. sing. | m. pl. | f. pl. |
    |---|---|---|---|---|
    | *molto* | molto vino | molta gente | molti amici | molte cose |
    | *poco* | poco tempo | poca pazienza | pochi soldi | poche persone |
    | *troppo* | troppo traffico | troppa acqua | troppi turisti | troppe macchine |

    ### With an adjective, adverb or verb: invariable (adverb)
    - *Roma è **molto** bella. Le ragazze sono **molto** simpatiche.*
    - *Lavori **troppo**. Mangio **poco**.*
    - *molto bene, troppo tardi*

    *Tanto* works the same way and is very common in speech: *tanti auguri!*, *Ti voglio tanto bene.*
    *Un po'* (a bit) never changes: *un po' stanco*.
  examples:
    - { es: "Ci sono molti turisti oggi.", en: "There are lots of tourists today." }
    - { es: "Le pizze sono molto buone.", en: "The pizzas are very good." }
    - { es: "Abbiamo poco tempo.", en: "We have little time." }
    - { es: "Tu parli troppo!", en: "You talk too much!" }
  pitfalls:
    - "Before an adjective *molto* never changes: *molto belle*, not *molte belle*."
    - "Before a noun it must agree: *molte persone*, not *molto persone*."
    - "*Poco* means 'not much'; for 'a little' use *un po'*: *un po' di pane*."
  related: [g.adjective-agreement, g.partitive-di]
  drills:
    - { es: "Ho troppi compiti.", en: "I have too much homework." }
    - { es: "La lezione è molto interessante.", en: "The lesson is very interesting." }
    - { es: "C'è poca gente in piazza.", en: "There are few people in the square." }
    - { es: "Grazie tante!", en: "Thanks a lot!" }
- id: g.numbers-100-plus
  level: a1
  title: "Numbers from 100: cento, mille, un milione"
  summary: "centodue, duecento, mille, duemila, un milione di euro — written as one word."
  explanation: |
    | | |
    |---|---|
    | 100 | *cento* |
    | 101 | *centouno* |
    | 200 | *duecento* |
    | 350 | *trecentocinquanta* |
    | 1.000 | *mille* |
    | 2.000 | *duemila* |
    | 1.500 | *millecinquecento* |
    | 1.000.000 | *un milione* |

    - Numbers are written as **one word**: *duemilaventisei*.
    - *Mille* has the plural **-mila**: *tremila, diecimila*.
    - *Cento* and *mille* take no *un*: *cento euro, mille grazie*.
    - *Milione, miliardo* are nouns: *un milione **di** abitanti, due milioni di euro*.
    - Italian uses a **point** for thousands and a **comma** for decimals: *1.250,50 €* (*milleduecentocinquanta euro e cinquanta*).
    - Years: *il 1990* (*millenovecentonovanta*), *nel 2026* (*duemilaventisei*).
  examples:
    - { es: "Roma ha quasi tre milioni di abitanti.", en: "Rome has almost three million inhabitants." }
    - { es: "Costa duecentocinquanta euro.", en: "It costs two hundred and fifty euros." }
    - { es: "Sono nato nel millenovecentonovantacinque.", en: "I was born in 1995." }
    - { es: "Mille grazie!", en: "Thanks a million!" }
  pitfalls:
    - "*Duemila*, not *due mille*: the plural of *mille* is *-mila*."
    - "*Un milione di persone*: *di* after *milione*."
    - "The comma is the decimal mark: *2,50 €* = two euros fifty."
  related: [g.numbers-0-100, g.quanto-costa]
  drills:
    - { es: "Il biglietto costa centoventi euro.", en: "The ticket costs a hundred and twenty euros." }
    - { es: "Ci sono cinquemila persone allo stadio.", en: "There are five thousand people at the stadium." }
    - { es: "L'appartamento costa trecentomila euro.", en: "The flat costs three hundred thousand euros." }
- id: g.quanto-costa
  level: a1
  title: "Quanto costa? Quanto costano? — prices and quantities"
  summary: "costa for one thing, costano for several; quanto agrees with the noun."
  explanation: |
    - *Quanto costa?* (one thing) — *Quanto costano?* (more than one): *Quanto costano le pesche?*
    - *Quant'è?* / *Quanto fa?* — How much is it (all together)?
    - Answers: *Costa dieci euro. Costano tre euro al chilo. Sono venti euro.*

    ### Quanto as an adjective
    | | singular | plural |
    |---|---|---|
    | masculine | *quanto pane?* | *quanti pomodori?* |
    | feminine | *quanta frutta?* | *quante mele?* |

    ### At the market
    *un etto* (100 g), *mezzo chilo, un chilo, un litro*, *un pezzo di*, *una fetta di*, *una bottiglia di*, *una scatola di*.
    *Mi dà due etti di prosciutto?* — *Altro?* (Anything else?) — *Basta così, grazie.* (That's all, thanks.)
  examples:
    - { es: "Quanto costa questa borsa?", en: "How much is this bag?" }
    - { es: "Quanto costano i carciofi?", en: "How much are the artichokes?" }
    - { es: "Mi dà mezzo chilo di ciliegie?", en: "Can I have half a kilo of cherries?" }
    - { es: "Quant'è in tutto?", en: "How much is it altogether?" }
  pitfalls:
    - "Plural things need *costano*: *Quanto costano le scarpe?*"
    - "*Un etto* (100 g) is the normal unit at the deli counter; don't ask for *cento grammi* every time."
    - "*Quante mele?*: *quanto* agrees with the noun."
  related: [g.numbers-100-plus, g.question-words]
  drills:
    - { es: "Quanto costano i biglietti?", en: "How much are the tickets?" }
    - { es: "Vorrei tre etti di formaggio.", en: "I'd like 300 grams of cheese." }
    - { es: "Basta così, grazie. Quant'è?", en: "That's all, thanks. How much is it?" }
    - { es: "Quante bottiglie prendiamo?", en: "How many bottles shall we get?" }
- id: g.quello-forms
  level: a1
  title: "Quello — that, those (quel, quello, quell', quei, quegli)"
  summary: "Before a noun quello changes like the article: quel libro, quello zaino, quell'uomo, quei ragazzi, quegli amici."
  explanation: |
    ### Before a noun (adjective)
    | article | quello | example |
    |---|---|---|
    | il | **quel** | *quel vestito* |
    | lo | **quello** | *quello specchio* |
    | l' | **quell'** | *quell'albero, quell'amica* |
    | la | **quella** | *quella gonna* |
    | i | **quei** | *quei pantaloni* |
    | gli | **quegli** | *quegli stivali, quegli occhiali* |
    | le | **quelle** | *quelle scarpe* |

    ### Alone (pronoun): regular forms
    *quello, quella, quelli, quelle*: *Quale vuoi? — Quello. Questi o quelli?*

    *Questo* = near me, *quello* = over there / away from me.
  examples:
    - { es: "Quanto costa quel cappotto?", en: "How much is that coat?" }
    - { es: "Mi piacciono quegli stivali neri.", en: "I like those black boots." }
    - { es: "Vorrei provare quella gonna.", en: "I'd like to try on that skirt." }
    - { es: "Questo o quello? Quello rosso.", en: "This one or that one? The red one." }
  pitfalls:
    - "*Quel libro*, not *quello libro*; *quei libri*, not *quelli libri*."
    - "Alone it is regular: *Prendo quelli*, not *Prendo quei*."
    - "Spanish speakers: Italian has two demonstratives (*questo, quello*), not three; *ese* and *aquel* are both *quello*."
  related: [g.questo, g.articles, g.bello-buono]
  drills:
    - { es: "Quei pomodori sono molto buoni.", en: "Those tomatoes are very good." }
    - { es: "Chi è quell'uomo?", en: "Who's that man?" }
    - { es: "Preferisco quelle scarpe.", en: "I prefer those shoes." }
    - { es: "Quegli zaini costano troppo.", en: "Those backpacks cost too much." }
- id: g.colours
  level: a1
  title: "Colours"
  summary: "Most colours agree like adjectives; blu, rosa, viola, beige never change."
  explanation: |
    | -o (4 forms) | -e (2 forms) | invariable |
    |---|---|---|
    | *rosso, nero, bianco, giallo, grigio* | *verde, marrone, arancione* | *blu, rosa, viola, beige* |

    - Colours **follow** the noun: *una maglietta rossa, due maglie verdi, le scarpe blu*.
    - Plurals with h: *bianco → bianchi, bianche*; *grigio → grigi, grigie*.
    - Shades are invariable: *una camicia verde chiaro, i pantaloni blu scuro*.
    - Colour as a noun is masculine: *Il rosso mi piace. Di che colore è?*
  examples:
    - { es: "Cerco una camicia bianca.", en: "I'm looking for a white shirt." }
    - { es: "Ha gli occhi verdi e i capelli neri.", en: "She has green eyes and black hair." }
    - { es: "Mi piacciono quelle scarpe blu.", en: "I like those blue shoes." }
    - { es: "Di che colore è la tua macchina?", en: "What colour is your car?" }
  pitfalls:
    - "*Rosa* and *viola* don't change: *le magliette rosa*, not *rose*."
    - "*Marrone* (brown) is used for objects; brown hair or eyes are *castani*."
    - "Spanish speakers: *azul* is *blu* (dark) or *azzurro* (light/sky blue), and *rojo* is *rosso*."
  related: [g.adjective-agreement, g.adjective-position]
  drills:
    - { es: "Vorrei una borsa nera.", en: "I'd like a black bag." }
    - { es: "Le foglie sono gialle e rosse.", en: "The leaves are yellow and red." }
    - { es: "Hai una gonna grigio scuro?", en: "Do you have a dark grey skirt?" }
    - { es: "Il cielo è azzurro oggi.", en: "The sky is blue today." }
- id: g.lo-prendo
  level: a1
  title: "Lo prendo! — first object pronouns in the shop"
  summary: "lo, la, li, le replace a noun and go before the verb: La prendo. Li provo."
  explanation: |
    When you have already named the thing, replace it with a pronoun **before the verb**:

    | the noun | pronoun | example |
    |---|---|---|
    | masculine singular | **lo** | *Il cappello? Lo prendo.* |
    | feminine singular | **la** | *La giacca? La provo.* |
    | masculine plural | **li** | *I sandali? Li compro.* |
    | feminine plural | **le** | *Le scarpe? Le prendo.* |

    - Negative: *Non lo prendo.*
    - Before a vowel *lo* and *la* often become *l'*: *L'ascolto.*
    - With an infinitive the pronoun can go at the end: *Posso provarla?* = *La posso provare?*

    Shop phrases: *Posso provarlo?* (Can I try it on?) — *Lo prendo.* (I'll take it.) — *Ci penso.* (I'll think about it.)
  examples:
    - { es: "Questo vestito mi piace. Lo prendo!", en: "I like this dress. I'll take it!" }
    - { es: "Le scarpe? Le provo subito.", en: "The shoes? I'll try them on right away." }
    - { es: "Posso provarla?", en: "Can I try it on? (the jacket)" }
    - { es: "Non lo so.", en: "I don't know (it)." }
  pitfalls:
    - "The pronoun goes before the verb: *lo prendo*, not *prendo lo*."
    - "*Li* is the masculine plural, *le* the feminine plural: *i pantaloni → li*."
    - "Spanish speakers: *los* → *li*, *las* → *le* (careful: Italian *le* is not Spanish indirect *le*)."
  related: [g.direct-object-pronouns, g.quello-forms]
  drills:
    - { es: "Il pane? Lo compro io.", en: "The bread? I'll buy it." }
    - { es: "Questi pantaloni sono belli, li provo.", en: "These trousers are nice, I'll try them on." }
    - { es: "La borsa costa troppo, non la prendo.", en: "The bag costs too much, I'm not taking it." }
    - { es: "Posso vederle?", en: "Can I see them? (the shoes)" }
- id: g.andare-venire
  level: a1
  title: "Andare and venire — to go and to come"
  summary: "vado, vai, va, andiamo, andate, vanno; vengo, vieni, viene, veniamo, venite, vengono."
  explanation: |
    | | andare | venire |
    |---|---|---|
    | io | **vado** | **vengo** |
    | tu | **vai** | **vieni** |
    | lui / lei / Lei | **va** | **viene** |
    | noi | andiamo | veniamo |
    | voi | andate | venite |
    | loro | **vanno** | **vengono** |

    ### andare or venire?
    - *Andare* = to go (away from where the speaker is).
    - *Venire* = to come towards the speaker **or the listener**, or to join them: *Vieni con noi?* (Are you coming with us?) — *Sì, vengo!* (Yes, I'm coming!)

    ### Common patterns
    - *andare a* + infinitive: *Vado a mangiare.* (I'm going to eat — movement + purpose)
    - *andare a piedi, in macchina, in treno* (see prepositions)
    - *Andiamo!* = Let's go! *Come va?* = How's it going?
    - *venire da* = to come from: *Vengo dall'Inghilterra.*
  examples:
    - { es: "Stasera andiamo al cinema. Vieni anche tu?", en: "We're going to the cinema tonight. Are you coming too?" }
    - { es: "Vengo da Londra.", en: "I come from London." }
    - { es: "Dove vai in vacanza?", en: "Where are you going on holiday?" }
    - { es: "I miei amici vengono a cena sabato.", en: "My friends are coming to dinner on Saturday." }
  pitfalls:
    - "When you move towards the listener, Italian uses *venire*: *Vengo da te alle otto* (I'll come to yours at eight)."
    - "*Andare a* + infinitive means going somewhere to do something; it is not a general future like 'going to'."
    - "Spanish speakers: *voy* → *vado*, and *ir a + infinitive* for the future does not translate: use the present or future."
  related: [g.prepositions-motion, g.present-for-future]
  drills:
    - { es: "Vado a lavorare in bici.", en: "I go to work by bike." }
    - { es: "Venite alla festa?", en: "Are you coming to the party?" }
    - { es: "Va tutto bene?", en: "Is everything OK?" }
    - { es: "Vanno a fare la spesa.", en: "They're going to do the shopping." }
- id: g.fare-present
  level: a1
  title: "The verb fare (to do, to make)"
  summary: "faccio, fai, fa, facciamo, fate, fanno — and dozens of expressions."
  explanation: |
    | | fare |
    |---|---|
    | io | **faccio** |
    | tu | **fai** |
    | lui / lei / Lei | **fa** |
    | noi | **facciamo** |
    | voi | **fate** |
    | loro | **fanno** |

    ### Expressions with fare
    | | |
    |---|---|
    | *fare colazione* | to have breakfast |
    | *fare la spesa* | to do the food shopping |
    | *fare spese / shopping* | to go shopping |
    | *fare una passeggiata* | to go for a walk |
    | *fare la doccia* | to have a shower |
    | *fare una foto* | to take a photo |
    | *fare sport, fare yoga* | to do sport, yoga |
    | *fare il medico* | to work as a doctor |
    | *fare caldo / freddo* | to be hot / cold (weather) |
    | *fare la fila* | to queue |

    *Che cosa fai?* = What are you doing? / What do you do (for a living)?
  examples:
    - { es: "Che lavoro fai? Faccio l'insegnante.", en: "What do you do? I'm a teacher." }
    - { es: "Facciamo una passeggiata a Villa Borghese?", en: "Shall we go for a walk in Villa Borghese?" }
    - { es: "Fanno colazione al bar.", en: "They have breakfast at the bar." }
    - { es: "Posso fare una foto?", en: "Can I take a photo?" }
  pitfalls:
    - "'Take a photo' is *fare* (not *prendere*) *una foto*."
    - "*Faccio il cameriere* (with the article) = I work as a waiter; *sono cameriere* is also fine."
    - "*Fare* + infinitive means 'have something done' (B2), not 'make someone happy' (= *rendere felice*)."
  related: [g.weather, g.irregular-present]
  drills:
    - { es: "Cosa fate stasera?", en: "What are you doing tonight?" }
    - { es: "Faccio la spesa il sabato mattina.", en: "I do the shopping on Saturday morning." }
    - { es: "Mio fratello fa il cuoco.", en: "My brother is a cook." }
    - { es: "Facciamo la fila per il Vaticano.", en: "We queue for the Vatican." }
- id: g.irregular-present
  level: a1
  title: "Other irregular presents: dare, dire, uscire, bere, rimanere, tenere"
  summary: "A handful of very common verbs have irregular stems: dico, esco, bevo, rimango, tengo, do."
  explanation: |
    | | dare | dire | uscire | bere | rimanere | tenere |
    |---|---|---|---|---|---|---|
    | io | do | dico | esco | bevo | rimango | tengo |
    | tu | dai | dici | esci | bevi | rimani | tieni |
    | lui/lei | dà | dice | esce | beve | rimane | tiene |
    | noi | diamo | diciamo | usciamo | beviamo | rimaniamo | teniamo |
    | voi | date | dite | uscite | bevete | rimanete | tenete |
    | loro | danno | dicono | escono | bevono | rimangono | tengono |

    ### Patterns
    - **-go verbs**: *rimanere → rimango, tenere → tengo, venire → vengo, salire → salgo, scegliere → scelgo*. The **g** appears in *io* and *loro*.
    - *uscire*: **e-** where the stress falls on the stem (*esco, esci, esce, escono*), **u-** elsewhere.
    - *bere* works like an -ere verb on the stem *bev-*; *dire* on *dic-* (*voi dite* is the exception).
    - *Dà* (gives) has an accent to tell it from *da* (from).
  examples:
    - { es: "Esco con gli amici stasera.", en: "I'm going out with friends tonight." }
    - { es: "Che cosa bevi? Bevo un succo.", en: "What are you drinking? I'm having a juice." }
    - { es: "Dico sempre la verità.", en: "I always tell the truth." }
    - { es: "Rimaniamo a Roma fino a domenica.", en: "We're staying in Rome until Sunday." }
  pitfalls:
    - "*Uscire*: *esco, esci, esce* but *usciamo, uscite*."
    - "*Voi dite*, not *dicete*."
    - "*Lui dà* (gives) has an accent; *da* (from) doesn't."
  related: [g.andare-venire, g.fare-present]
  drills:
    - { es: "A che ora uscite dal lavoro?", en: "What time do you leave work?" }
    - { es: "Non bevono alcol.", en: "They don't drink alcohol." }
    - { es: "Mi dai il tuo numero?", en: "Will you give me your number?" }
    - { es: "Tengo le chiavi io.", en: "I'll keep the keys." }
- id: g.potere-dovere
  level: a1
  title: "Potere and dovere — can and must"
  summary: "posso, puoi, può, possiamo, potete, possono; devo, devi, deve, dobbiamo, dovete, devono."
  explanation: |
    | | potere | dovere |
    |---|---|---|
    | io | **posso** | **devo** |
    | tu | **puoi** | **devi** |
    | lui / lei / Lei | **può** | **deve** |
    | noi | possiamo | dobbiamo |
    | voi | potete | dovete |
    | loro | **possono** | **devono** |

    Modal verbs are followed directly by an **infinitive**, with no preposition:
    - *Posso entrare?* — May I come in?
    - *Devo lavorare domani.* — I have to work tomorrow.
    - *Può ripetere, per favore?* — Could you repeat, please? (formal)

    ### Asking permission and favours
    - *Posso…?* (May I…?) — *Si può fumare qui?* (Is smoking allowed here?)
    - *Puoi / Può…?* (Can you…?) — *Mi puoi aiutare?*

    ### Ability: potere or sapere?
    *Potere* = be able / allowed; *sapere* + infinitive = know how to: *So nuotare, ma oggi non posso.*

    *Dovere* + noun = to owe: *Quanto Le devo?* (How much do I owe you?)
  examples:
    - { es: "Scusi, posso pagare con la carta?", en: "Excuse me, can I pay by card?" }
    - { es: "Devo comprare il biglietto prima.", en: "I have to buy the ticket first." }
    - { es: "Non possiamo venire, dobbiamo studiare.", en: "We can't come, we have to study." }
    - { es: "Quanto Le devo?", en: "How much do I owe you?" }
  pitfalls:
    - "No preposition after modals: *devo andare*, not *devo di andare*."
    - "*Può* has an accent: *Lei può*."
    - "'Can you swim?' is *Sai nuotare?* (know how), not *Puoi nuotare?*"
  related: [g.volere-vorrei, g.sapere-conoscere, g.bisogna-avere-bisogno]
  drills:
    - { es: "Posso aprire la finestra?", en: "Can I open the window?" }
    - { es: "Devi prendere l'autobus 40.", en: "You have to take the number 40 bus." }
    - { es: "Potete parlare più piano?", en: "Can you speak more slowly?" }
    - { es: "I bambini devono andare a letto.", en: "The children have to go to bed." }
- id: g.prepositions-motion
  level: a1
  title: "Going places: a Roma, in Italia, al mare, da Marco"
  summary: "a for cities, in for countries and rooms, da for people, a/in + article for many places."
  explanation: |
    The same prepositions are used for **going to** and **being in**:

    | preposition | with | example |
    |---|---|---|
    | **a** | cities, small islands | *vado a Roma, sono a Capri* |
    | **in** | countries, regions, big islands | *in Italia, in Toscana, in Sicilia* |
    | **in** | rooms, many places (no article) | *in cucina, in centro, in banca, in farmacia, in piscina, in ufficio, in montagna, in vacanza* |
    | **a** | fixed places (no article) | *a casa, a scuola, a letto, a teatro* |
    | **a + article** | other places | *al mare, al cinema, al bar, allo stadio, alla stazione* |
    | **da** | people, a person's place or shop | *da Marco, dal medico, dalla nonna, dal parrucchiere* |

    ### Coming from
    *da* + place: *Vengo da Roma, dal mercato, dall'Italia.*
  examples:
    - { es: "Quest'estate andiamo in Sicilia e poi a Palermo.", en: "This summer we're going to Sicily and then to Palermo." }
    - { es: "Stasera vado da Giulia.", en: "Tonight I'm going to Giulia's." }
    - { es: "Sono in ufficio fino alle sei.", en: "I'm at the office until six." }
    - { es: "Andate al mare o in montagna?", en: "Are you going to the seaside or the mountains?" }
  pitfalls:
    - "Cities take *a*: *vado a Milano*, not *in Milano* (which means 'within Milan')."
    - "Going to a person is *da*: *vado dal dottore*, not *al dottore*."
    - "Spanish speakers: *a casa* means both 'home' and 'at home'; there's no *en casa* distinction."
  related: [g.simple-prepositions, g.articulated-prepositions, g.prepositions-transport]
  drills:
    - { es: "Abito in Inghilterra, a Londra.", en: "I live in England, in London." }
    - { es: "Domani vado dal dentista.", en: "Tomorrow I'm going to the dentist." }
    - { es: "Andiamo in pizzeria?", en: "Shall we go to the pizzeria?" }
    - { es: "Torno a casa alle sette.", en: "I get home at seven." }
- id: g.weather
  level: a1
  title: "Che tempo fa? — the weather"
  summary: "fa caldo, fa freddo, fa bel tempo; piove, nevica; c'è il sole, c'è vento; è nuvoloso."
  explanation: |
    | with *fare* | with *esserci* | verbs | with *essere* |
    |---|---|---|---|
    | *fa caldo* (it's hot) | *c'è il sole* (it's sunny) | *piove* (it's raining) | *è nuvoloso* (it's cloudy) |
    | *fa freddo* (it's cold) | *c'è vento* (it's windy) | *nevica* (it's snowing) | *è sereno* (it's clear) |
    | *fa bel / brutto tempo* | *c'è nebbia* (it's foggy) | *grandina* (it's hailing) | *è umido* (it's humid) |

    - *Che tempo fa?* — What's the weather like?
    - *Quanti gradi ci sono?* — *Ci sono trenta gradi.* (It's 30 degrees.)
    - Weather verbs have no subject: *Piove.* (not *Esso piove*).
    - Intensify: *Fa molto caldo. Piove forte. Fa un freddo cane!* (colloquial)
  examples:
    - { es: "Oggi fa bel tempo e c'è il sole.", en: "Today the weather is nice and it's sunny." }
    - { es: "A Roma d'agosto fa molto caldo.", en: "In Rome it's very hot in August." }
    - { es: "Piove, prendi l'ombrello!", en: "It's raining, take the umbrella!" }
    - { es: "In montagna nevica.", en: "It's snowing in the mountains." }
  pitfalls:
    - "Weather is *fa caldo*, but people *hanno caldo*: *Fa caldo e ho caldo.*"
    - "Not *è caldo* for the weather: that describes a thing (*il caffè è caldo*)."
    - "Spanish speakers: *hace sol* → *c'è il sole*; *hace viento* → *c'è vento*."
  related: [g.avere-expressions, g.fare-present]
  drills:
    - { es: "Che tempo fa a Londra?", en: "What's the weather like in London?" }
    - { es: "Fa freddo, ci sono due gradi.", en: "It's cold, it's two degrees." }
    - { es: "C'è molto vento al mare.", en: "It's very windy at the seaside." }
    - { es: "Oggi è nuvoloso ma non piove.", en: "Today it's cloudy but it isn't raining." }
- id: g.days-months
  level: a1
  title: "Days, months, seasons and dates"
  summary: "lunedì… domenica; gennaio… dicembre; il 15 aprile; il lunedì = on Mondays."
  explanation: |
    ### Days (masculine, except *domenica*)
    *lunedì, martedì, mercoledì, giovedì, venerdì, sabato, domenica*

    - *lunedì* (no article) = this coming Monday: *Lunedì vado a Napoli.*
    - *il lunedì* = every Monday: *Il lunedì i musei sono chiusi.*

    ### Months (masculine)
    *gennaio, febbraio, marzo, aprile, maggio, giugno, luglio, agosto, settembre, ottobre, novembre, dicembre* — *a / in maggio*.

    ### Seasons
    *la primavera, l'estate (f), l'autunno, l'inverno* — *in primavera, d'estate / in estate, d'inverno*.

    ### Dates
    - *Che giorno è oggi? — Oggi è martedì 3 marzo.*
    - Use the article + cardinal number: *il 15 aprile, il 2 giugno*.
    - Only the 1st is ordinal: *il primo maggio*.
    - Birthdays: *Il mio compleanno è il 10 luglio.*
  examples:
    - { es: "Il sabato non lavoro.", en: "I don't work on Saturdays." }
    - { es: "Ci vediamo venerdì?", en: "Shall we meet on Friday?" }
    - { es: "Il Natale di Roma è il 21 aprile.", en: "Rome's birthday is on 21 April." }
    - { es: "D'estate andiamo al mare.", en: "In summer we go to the seaside." }
  pitfalls:
    - "Days and months have no capital letters: *lunedì, maggio*."
    - "Not *il primo* for every date: *il due, il tre*; only the 1st is *il primo*."
    - "*Il lunedì* = on Mondays (habit); *lunedì* = on (this) Monday."
  related: [g.numbers-0-100, g.frequency-adverbs]
  drills:
    - { es: "Oggi è giovedì dodici ottobre.", en: "Today is Thursday the twelfth of October." }
    - { es: "Il primo gennaio è festa.", en: "The first of January is a holiday." }
    - { es: "In inverno fa freddo.", en: "In winter it's cold." }
    - { es: "La domenica pranziamo dai nonni.", en: "On Sundays we have lunch at our grandparents'." }
- id: g.piacere-plural
  level: a1
  title: "Mi piacciono — liking plural things; anche a me, neanche a me"
  summary: "mi piace + singular or infinitive; mi piacciono + plural; a me sì, a me no."
  explanation: |
    | thing liked | verb | example |
    |---|---|---|
    | singular noun | **piace** | *Mi piace il mare.* |
    | infinitive(s) | **piace** | *Mi piace nuotare e leggere.* |
    | plural noun | **piacciono** | *Mi piacciono i film italiani.* |

    ### Reacting
    | statement | agree | disagree |
    |---|---|---|
    | *Mi piace il calcio.* | *Anche a me.* | *A me no.* |
    | *Non mi piace il calcio.* | *Neanche a me.* | *A me sì.* |

    ### Emphasis with a me, a te…
    *A me piace il tè, a lui piace il caffè.* The stressed forms *a me, a te, a lui, a lei, a noi, a voi, a loro* are used for contrast or alone.

    Talking about hobbies: *Mi piace molto / tanto / abbastanza / non mi piace per niente.*
  examples:
    - { es: "Ti piacciono i gatti? Sì, moltissimo.", en: "Do you like cats? Yes, very much." }
    - { es: "Mi piace andare in bici. E a te?", en: "I like cycling. And you?" }
    - { es: "Non mi piacciono le discoteche. Neanche a me.", en: "I don't like nightclubs. Neither do I." }
    - { es: "A Marco piacciono gli sport invernali.", en: "Marco likes winter sports." }
  pitfalls:
    - "Plural subject → *piacciono*: *mi piacciono i dolci*, not *mi piace i dolci*."
    - "Agree with *anche a me*, not *anch'io* (which would mean 'I am pleasing too')."
    - "*Non mi piace per niente* = I don't like it at all."
  related: [g.piacere-intro, g.anche-neanche, g.stressed-pronouns]
  drills:
    - { es: "Le piacciono i musei?", en: "Do you like museums? (formal)" }
    - { es: "Ci piace molto cucinare.", en: "We really like cooking." }
    - { es: "A me sì, a mio marito no.", en: "I do, my husband doesn't." }
    - { es: "Non mi piace per niente aspettare.", en: "I don't like waiting at all." }
- id: g.sapere-conoscere
  level: a1
  title: "Sapere or conoscere? — to know"
  summary: "sapere = know a fact or how to do something; conoscere = know a person, place or thing."
  explanation: |
    | | sapere | conoscere |
    |---|---|---|
    | io | **so** | conosco |
    | tu | **sai** | conosci |
    | lui / lei | **sa** | conosce |
    | noi | **sappiamo** | conosciamo |
    | voi | sapete | conoscete |
    | loro | **sanno** | conoscono |

    ### sapere
    - a fact or information: *So che sei stanco. Sai dov'è la stazione? Non lo so.*
    - **how to** do something (+ infinitive): *Sai nuotare? So cucinare bene.*

    ### conoscere
    - people: *Conosci Marco?*
    - places: *Conosco bene Roma.*
    - to meet for the first time (later, in the past tense): *Ho conosciuto Sara a una festa.*
  examples:
    - { es: "Sai parlare inglese?", en: "Can you speak English?" }
    - { es: "Conosci un buon ristorante qui vicino?", en: "Do you know a good restaurant near here?" }
    - { es: "Non so a che ora apre.", en: "I don't know what time it opens." }
    - { es: "Conosciamo bene la famiglia di Luca.", en: "We know Luca's family well." }
  pitfalls:
    - "'I don't know' is *non lo so*: the *lo* is normal and natural."
    - "Knowing a person is always *conoscere*: *Conosci mia sorella?*, never *sai mia sorella*."
    - "*Conosco* has a hard 'k' sound; *conosci, conosce* a soft 'sh'."
  related: [g.potere-dovere, g.irregular-present]
  drills:
    - { es: "Sapete dov'è la fermata?", en: "Do you know where the stop is?" }
    - { es: "Conosco un posto fantastico.", en: "I know a fantastic place." }
    - { es: "Mia figlia sa suonare il violino.", en: "My daughter can play the violin." }
    - { es: "Non conosco nessuno qui.", en: "I don't know anyone here." }
- id: g.giocare-suonare
  level: a1
  title: "Giocare, suonare, fare — playing games, instruments and sports"
  summary: "giocare a calcio, suonare la chitarra, fare nuoto: three verbs for English 'play' and 'do'."
  explanation: |
    | verb | used for | example |
    |---|---|---|
    | **giocare a** | games and ball sports | *giocare a calcio, a tennis, a carte, a scacchi* |
    | **suonare** | instruments (with the article) | *suonare la chitarra, il pianoforte* |
    | **fare** | many sports and activities | *fare nuoto, fare yoga, fare sci, fare una partita* |

    - *Giocare* adds h before i: *giochi, giochiamo*.
    - *Suonare* also means 'to ring': *Suona il telefono.*
    - Other hobbies: *andare in bici, correre, nuotare, ballare, dipingere, cantare*.
  examples:
    - { es: "Giochi a calcio il sabato?", en: "Do you play football on Saturdays?" }
    - { es: "Mia sorella suona il pianoforte.", en: "My sister plays the piano." }
    - { es: "Facciamo yoga due volte alla settimana.", en: "We do yoga twice a week." }
    - { es: "I nonni giocano a carte al bar.", en: "Grandpa and his friends play cards at the bar." }
  pitfalls:
    - "*Giocare* is for games, *suonare* for instruments: *suono la chitarra*, never *gioco la chitarra*."
    - "*Giocare a* + sport needs *a* (no article): *gioco a tennis*."
    - "Spanish speakers: *tocar la guitarra* → *suonare la chitarra*; *tocare* in Italian means 'to touch'."
  related: [g.fare-present, g.piacere-plural]
  drills:
    - { es: "Sai suonare la batteria?", en: "Can you play the drums?" }
    - { es: "Giochiamo a pallavolo in spiaggia.", en: "We play volleyball on the beach." }
    - { es: "Fai sport?", en: "Do you do any sport?" }
    - { es: "Il telefono suona!", en: "The phone is ringing!" }
- id: g.stare-gerundio
  level: a1
  title: "Sto mangiando — stare + gerund"
  summary: "stare + gerund (-ando, -endo) for something happening right now."
  explanation: |
    ### The gerund
    | -are | -ere | -ire |
    |---|---|---|
    | parl**ando** | legg**endo** | dorm**endo** |

    Irregular: *fare → facendo, dire → dicendo, bere → bevendo*.

    ### stare + gerund
    *sto, stai, sta, stiamo, state, stanno* + gerund:
    - *Sto mangiando.* — I'm eating (right now).
    - *Che cosa stai facendo?* — What are you doing?
    - *Stiamo arrivando!* — We're on our way!

    ### Present or stare + gerund?
    The simple present also means 'I'm doing': *Che fai? — Leggo.* Use *stare + gerund* to stress that something is **in progress at this moment**. It is **not** used for the future or with *essere, avere, stare* themselves.
  examples:
    - { es: "Non posso parlare, sto guidando.", en: "I can't talk, I'm driving." }
    - { es: "Che cosa state facendo?", en: "What are you doing?" }
    - { es: "Sta piovendo, prendi l'ombrello.", en: "It's raining, take the umbrella." }
    - { es: "I bambini stanno dormendo.", en: "The children are sleeping." }
  pitfalls:
    - "Not for the future: 'I'm leaving tomorrow' is *parto domani*, not *sto partendo domani*."
    - "Not with *essere*: 'he's being nice' is *è gentile*, not *sta essendo gentile*."
    - "Pronouns go before *stare* or on the gerund: *mi sto lavando* / *sto lavandomi*."
  related: [g.stare-present, g.stare-gerundio-past, g.gerundio-uses]
  drills:
    - { es: "Sto cercando la fermata dell'autobus.", en: "I'm looking for the bus stop." }
    - { es: "Mia madre sta cucinando.", en: "My mother is cooking." }
    - { es: "Stiamo guardando un film.", en: "We're watching a film." }
    - { es: "Cosa stai bevendo?", en: "What are you drinking?" }
- id: g.imperative-directions
  level: a1
  title: "Giri a destra! — giving directions"
  summary: "Lei: giri, prenda, vada, attraversi; tu: gira, prendi, vai, attraversa."
  explanation: |
    To give directions Italians use the imperative. Learn these forms as phrases for now:

    | | tu (informal) | Lei (formal) |
    |---|---|---|
    | turn | *gira* | *giri* |
    | go | *vai* | *vada* |
    | take | *prendi* | *prenda* |
    | cross | *attraversa* | *attraversi* |
    | continue | *continua* | *continui* |
    | go straight on | *vai dritto* | *vada dritto* |

    **Pattern**: the vowels swap. -are verbs: *tu gira → Lei giri*; -ere/-ire verbs: *tu prendi → Lei prenda*.

    ### Direction words
    *a destra* (right), *a sinistra* (left), *dritto* (straight), *all'incrocio* (at the crossroads), *al semaforo* (at the lights), *in fondo alla strada* (at the end of the street), *la prima / seconda a destra*.

    ### Asking
    *Scusi, per andare al Pantheon? — Scusi, dov'è…? — È lontano?*
  examples:
    - { es: "Vada dritto e poi giri a sinistra.", en: "Go straight on and then turn left." }
    - { es: "Prendi la seconda a destra.", en: "Take the second on the right." }
    - { es: "Attraversi la piazza e continui fino al semaforo.", en: "Cross the square and carry on to the traffic lights." }
    - { es: "Scusi, per andare a Piazza Navona?", en: "Excuse me, how do I get to Piazza Navona?" }
  pitfalls:
    - "Formal -are verbs end in -i (*giri*), -ere/-ire verbs in -a (*prenda*): the opposite of the present."
    - "*Destra* is right, *diritto / dritto* is straight on: don't mix them up."
    - "Spanish speakers: *derecha* → *destra*; *derecho* (straight) → *dritto*."
  related: [g.imperativo-tu, g.imperativo-lei, g.ordinal-numbers]
  drills:
    - { es: "Giri a destra al semaforo.", en: "Turn right at the traffic lights." }
    - { es: "Vai sempre dritto.", en: "Keep going straight on." }
    - { es: "Prenda l'autobus numero 8.", en: "Take bus number 8." }
    - { es: "Attraversa il ponte.", en: "Cross the bridge." }
- id: g.bisogna-avere-bisogno
  level: a1
  title: "Bisogna, avere bisogno di — what is needed"
  summary: "bisogna + infinitive = one must; avere bisogno di = to need; è necessario = it's necessary."
  explanation: |
    ### bisogna (impersonal)
    *Bisogna* + infinitive: 'you have to / it's necessary', for everyone in general:
    - *Bisogna prenotare.* — You need to book.
    - *Non bisogna pagare.* — You don't have to pay.

    ### avere bisogno di (personal)
    - + noun: *Ho bisogno di una mappa.*
    - + infinitive: *Abbiamo bisogno di riposare.*

    ### Other ways
    - *È necessario* + infinitive: *È necessario avere il passaporto.*
    - *Dovere* for a person: *Devo prenotare.*
    - *Serve / servono* (it's needed): *Serve un biglietto? — Mi serve una penna.*
  examples:
    - { es: "Per entrare nei Musei Vaticani bisogna fare la fila.", en: "To get into the Vatican Museums you have to queue." }
    - { es: "Ho bisogno di un caffè!", en: "I need a coffee!" }
    - { es: "Ti serve qualcosa?", en: "Do you need anything?" }
    - { es: "Non bisogna prenotare, è gratis.", en: "You don't need to book, it's free." }
  pitfalls:
    - "*Bisogna* never changes: *bisogna partire*, not *bisognano*."
    - "*Avere bisogno di*: don't forget *di*."
    - "*Mi servono due biglietti*: plural thing → *servono*."
  related: [g.potere-dovere, g.avere-expressions]
  drills:
    - { es: "Bisogna comprare il biglietto prima di salire.", en: "You need to buy the ticket before getting on." }
    - { es: "Avete bisogno di aiuto?", en: "Do you need help?" }
    - { es: "Mi servono due francobolli.", en: "I need two stamps." }
- id: g.ordinal-numbers
  level: a1
  title: "Ordinal numbers: primo, secondo, terzo…"
  summary: "primo… decimo, then -esimo: undicesimo, ventesimo; they agree like adjectives."
  explanation: |
    | | | | |
    |---|---|---|---|
    | 1st *primo* | 2nd *secondo* | 3rd *terzo* | 4th *quarto* |
    | 5th *quinto* | 6th *sesto* | 7th *settimo* | 8th *ottavo* |
    | 9th *nono* | 10th *decimo* | 11th *undicesimo* | 20th *ventesimo* |

    - From 11th: drop the final vowel and add **-esimo**: *dodicesimo, ventitreesimo, centesimo*.
    - They agree: *la prima strada, il secondo piano, le prime volte*.
    - Written: *1°, 2ª* or *I, II* (Roman numerals for centuries and popes).
    - Uses: floors (*abito al terzo piano*), streets (*la seconda a sinistra*), centuries (*il Seicento*, *il XVII secolo*), kings and popes (*Papa Giovanni XXIII* = *ventitreesimo*).
  examples:
    - { es: "Prenda la prima a destra.", en: "Take the first on the right." }
    - { es: "Abitiamo al quarto piano.", en: "We live on the fourth floor." }
    - { es: "È la mia prima volta a Roma.", en: "It's my first time in Rome." }
    - { es: "La seconda strada a sinistra.", en: "The second street on the left." }
  pitfalls:
    - "Ordinals agree: *la prima volta*, not *il primo volta*."
    - "The ground floor is *il piano terra*; *il primo piano* is one floor up."
    - "Dates use cardinals except the 1st: *il primo maggio, il due maggio*."
  related: [g.imperative-directions, g.days-months, g.numbers-0-100]
  drills:
    - { es: "L'ufficio è al secondo piano.", en: "The office is on the second floor." }
    - { es: "È la terza volta che chiamo!", en: "It's the third time I've called!" }
    - { es: "Giri alla seconda a destra.", en: "Turn at the second on the right." }
- id: g.present-for-future
  level: a1
  title: "The present for future plans"
  summary: "Domani parto, stasera esco: Italian uses the present tense for planned future events."
  explanation: |
    Italian very often uses the **simple present** with a time expression to talk about the future:
    - *Domani vado a Ostia.* — Tomorrow I'm going to Ostia.
    - *Stasera ceniamo fuori.* — We're eating out tonight.
    - *Il treno parte alle nove.* — The train leaves at nine.

    ### Useful time expressions
    *stasera, domani, dopodomani, sabato, il fine settimana / il weekend, la settimana prossima, il mese prossimo, l'anno prossimo, tra due giorni*.

    ### Making plans
    - *Che fai sabato?* — What are you doing on Saturday?
    - *Hai programmi per stasera?*
    - Suggestions: *Perché non andiamo al mare? — Andiamo al cinema? — Ti va di…?* (Do you fancy…?)
    - Accepting / refusing: *Volentieri! — Perché no? — Mi dispiace, non posso.*

    The future tense (*andrò*) comes in A2; in everyday speech the present is more common for near, definite plans.
  examples:
    - { es: "Sabato andiamo a vedere la partita.", en: "On Saturday we're going to see the match." }
    - { es: "Che fai stasera? Esco con Luca.", en: "What are you doing tonight? I'm going out with Luca." }
    - { es: "Ti va di mangiare una pizza domani?", en: "Do you fancy a pizza tomorrow?" }
    - { es: "L'anno prossimo studio a Bologna.", en: "Next year I'm studying in Bologna." }
  pitfalls:
    - "Don't translate 'I'm going to' with *vado a* + infinitive unless you are physically going: *Domani compro una bici*, not *vado a comprare* (unless you go to a shop)."
    - "*Prossimo* goes after the noun: *la settimana prossima*."
    - "Spanish speakers: no *voy a + infinitivo* future in Italian: just use the present."
  related: [g.andare-venire, g.futuro-semplice, g.days-months]
  drills:
    - { es: "Domani lavoro fino alle otto.", en: "Tomorrow I'm working until eight." }
    - { es: "Ti va di venire con noi?", en: "Do you fancy coming with us?" }
    - { es: "Il weekend prossimo visitiamo i Castelli Romani.", en: "Next weekend we're visiting the Castelli Romani." }
    - { es: "Mi dispiace, sabato non posso.", en: "Sorry, I can't on Saturday." }
- id: g.connectors-basic
  level: a1
  title: "Basic connectors: e, ma, o, perché, quindi, poi"
  summary: "Link ideas with e (and), ma (but), o (or), perché (because), quindi (so), poi (then)."
  explanation: |
    | connector | meaning | example |
    |---|---|---|
    | *e* (*ed* before e-) | and | *Io e Marco. Lui ed Elena.* |
    | *ma* | but | *È piccola ma bella.* |
    | *o / oppure* | or | *Tè o caffè?* |
    | *perché* | because | *Resto a casa perché piove.* |
    | *quindi / allora* | so | *Piove, quindi resto a casa.* |
    | *poi / dopo* | then / afterwards | *Prima mangio, poi esco.* |
    | *anche* | also, too | *Vengo anche io.* |
    | *quando* | when | *Quando piove, leggo.* |

    ### Sequencing a short text
    *Prima… poi… dopo… alla fine…* — *Prima faccio colazione, poi vado al lavoro, alla fine torno a casa.*

    *Perché* means both 'why?' and 'because' — note the accent.
  examples:
    - { es: "Mi piace Roma ma c'è troppo traffico.", en: "I like Rome but there's too much traffic." }
    - { es: "Non esco perché sono stanca.", en: "I'm not going out because I'm tired." }
    - { es: "È tardi, quindi prendiamo un taxi.", en: "It's late, so let's get a taxi." }
    - { es: "Prima andiamo al museo, poi mangiamo.", en: "First we go to the museum, then we eat." }
  pitfalls:
    - "*Perché* has an acute accent (é); *perche* without it is wrong."
    - "*E* becomes *ed* before a word starting with e: *Marco ed Elena*."
    - "Spanish speakers: *pero* → *ma*; Italian *però* means 'however' and sounds stronger."
  related: [g.anche-neanche, g.narrative-connectors]
  drills:
    - { es: "Vuoi la pizza o la pasta?", en: "Do you want pizza or pasta?" }
    - { es: "Studio l'italiano perché amo l'Italia.", en: "I study Italian because I love Italy." }
    - { es: "Prima mi lavo, poi mi vesto.", en: "First I wash, then I get dressed." }
    - { es: "Non ho fame, quindi non mangio.", en: "I'm not hungry, so I'm not eating." }
- id: g.anche-neanche
  level: a1
  title: "Anche, neanche — too, neither"
  summary: "anche io / anch'io = me too; neanche io = me neither; non… neanche = not even."
  explanation: |
    | statement | agree | disagree |
    |---|---|---|
    | *Sono stanco.* | *Anch'io.* | *Io no.* |
    | *Non sono stanco.* | *Neanch'io.* / *Nemmeno io.* | *Io sì.* |

    - *Anche* goes **before** the word it refers to: *Anche Marco viene. Parlo anche francese.*
    - *Neanche / nemmeno / neppure* = neither, not even. After the verb they need *non*: *Non lo so neanche io. Non ho neanche un euro.*
    - Before the verb, no *non*: *Neanche Luca lo sa.*

    With *piacere* the pronoun changes: *anche a me, neanche a me* (see *mi piacciono*).
  examples:
    - { es: "Io vado a casa. Anch'io.", en: "I'm going home. Me too." }
    - { es: "Non parlo tedesco. Neanch'io.", en: "I don't speak German. Me neither." }
    - { es: "Non ho neanche un minuto.", en: "I don't even have a minute." }
    - { es: "Anche mia sorella abita a Roma.", en: "My sister lives in Rome too." }
  pitfalls:
    - "*Anche* goes before the word: *anche io*, not *io anche*."
    - "After the verb, keep *non*: *non vengo neanche io*."
    - "With *piacere*: *anche a me*, not *anch'io*."
  related: [g.connectors-basic, g.piacere-plural, g.double-negation]
  drills:
    - { es: "Ho fame. Anch'io!", en: "I'm hungry. Me too!" }
    - { es: "Non mi piace il pesce. Neanche a me.", en: "I don't like fish. Neither do I." }
    - { es: "Non lo sa nemmeno lui.", en: "Even he doesn't know." }
    - { es: "Vengo anch'io!", en: "I'm coming too!" }
- id: g.a1-review
  level: a1
  title: "A1 review: the present tense and the basics"
  summary: "Regular -are/-ere/-ire, -isc-, irregular verbs, articles and prepositions in one place."
  explanation: |
    ### Present tense endings
    | | -are | -ere | -ire | -ire (isc) |
    |---|---|---|---|---|
    | io | -o | -o | -o | -isco |
    | tu | -i | -i | -i | -isci |
    | lui/lei | -a | -e | -e | -isce |
    | noi | -iamo | -iamo | -iamo | -iamo |
    | voi | -ate | -ete | -ite | -ite |
    | loro | -ano | -ono | -ono | -iscono |

    ### Key irregular verbs
    *essere, avere, stare, andare, venire, fare, dare, dire, uscire, bere, rimanere, tenere, volere, potere, dovere, sapere*.

    ### Checklist
    - Articles: *il / lo / l' / la — i / gli / le — un / uno / una / un'*.
    - Articulated prepositions: *al, del, nel, sul, dal…*
    - *C'è / ci sono*, *mi piace / mi piacciono*, possessives (*mia madre*, *la mia casa*).
    - *Tu* or *Lei*? Third-person verb for *Lei*.
    - Present for the near future: *Domani parto.*
  examples:
    - { es: "Mi chiamo Tom, sono inglese e abito a Roma da un mese.", en: "My name is Tom, I'm English and I've been living in Rome for a month." }
    - { es: "Ogni mattina mi alzo alle sette e faccio colazione al bar.", en: "Every morning I get up at seven and have breakfast at the bar." }
    - { es: "Nel mio quartiere ci sono molti ristoranti.", en: "There are many restaurants in my neighbourhood." }
    - { es: "Sabato andiamo a Ostia perché fa caldo.", en: "On Saturday we're going to Ostia because it's hot." }
  pitfalls:
    - "*Lei* (formal) takes the third person: *Lei è, Lei ha, Lei va*."
    - "Choose the article by the next sound: *lo zaino, l'amico, gli studenti*."
    - "Remember *non* before the verb and *non… mai* round it."
  related: [g.present-are, g.present-ere-ire, g.present-isc, g.irregular-present]
  drills:
    - { es: "Mia sorella capisce l'italiano ma non lo parla.", en: "My sister understands Italian but doesn't speak it." }
    - { es: "Che cosa fai di solito il fine settimana?", en: "What do you usually do at the weekend?" }
    - { es: "Ci sono due bagni nella mia casa.", en: "There are two bathrooms in my house." }
    - { es: "Mi piacciono i musei, ma non mi piace fare la fila.", en: "I like museums, but I don't like queuing." }
