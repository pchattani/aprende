id: a1.u02
title: "Tu es d'où ?"
lessons:
  - id: a1.u02.l1
    title: "Je suis de Londres"
    teach: [g.adjective-agreement]
    tip: "Nationalities agree with the person: il est canadien, elle est canadienne. They take a small letter in French."
    vocab: [w.de, w.où, w.d-où, w.pays, w.ville, w.nationalité, w.français, w.anglais, w.américain, w.canadien, w.allemand, w.espagnol, w.italien, w.belge, w.suisse, w.japonais, w.chinois, w.portugais, w.mexicain, w.marocain, w.brésilien, w.parisien, w.venir, w.touriste]
    sentences:
      - { es: "Tu es d'où ? — Je suis de Londres.", en: "Where are you from? — I'm from London.", altEs: ["Tu viens d'où ? — Je viens de Londres.", "D'où tu es ? — Je suis de Londres.", "Tu es d'où ? — De Londres."], grammar: [g.question-words, g.etre-present], vocab: [w.d-où, w.de] }
      - { es: "Je suis anglaise et mon ami est américain.", en: "I'm English and my friend is American.", altEs: ["Je suis anglais et mon ami est américain.", "Moi, je suis anglaise et mon ami est américain."], grammar: [g.adjective-agreement], vocab: [w.anglais, w.américain] }
      - { es: "Elle est canadienne, de Montréal.", en: "She's Canadian, from Montreal.", altEs: ["Elle est canadienne. Elle est de Montréal."], grammar: [g.adjective-agreement], vocab: [w.canadien], error: { wrong: "Elle est canadien, de Montréal.", explain: "The adjective agrees with elle: canadien becomes canadienne.", grammar: g.adjective-agreement } }
      - { es: "Ils sont allemands et elles sont espagnoles.", en: "They're German and they (the women) are Spanish.", altEn: ["The men are German and the women are Spanish."], grammar: [g.adjective-agreement, g.subject-pronouns], vocab: [w.allemand, w.espagnol] }
      - { es: "Marco est italien, mais sa femme est suisse.", en: "Marco is Italian, but his wife is Swiss.", altEs: ["Marco est italien mais sa femme est suisse."], grammar: [g.adjective-agreement], vocab: [w.italien, w.suisse] }
      - { es: "Vous êtes belge, madame ?", en: "Are you Belgian, madam?", altEs: ["Est-ce que vous êtes belge, madame ?", "Madame, vous êtes belge ?"], grammar: [g.adjective-agreement, g.yes-no-questions], vocab: [w.belge], note: "belge and suisse already end in -e: same form for men and women." }
      - { es: "Les touristes japonais sont devant la tour Eiffel.", en: "The Japanese tourists are in front of the Eiffel Tower.", grammar: [g.adjective-agreement, g.articles-definite], vocab: [w.touriste, w.japonais] }
      - { es: "Nous sommes chinois, de Shanghai.", en: "We're Chinese, from Shanghai.", altEs: ["On est chinois, de Shanghai."], grammar: [g.adjective-agreement], vocab: [w.chinois], transform: { instruction: "Two women are speaking", answer: "Nous sommes chinoises, de Shanghai.", alt: ["On est chinoises, de Shanghai."], en: "We're Chinese, from Shanghai." } }
      - { es: "Ma copine est portugaise et elle parle très bien français.", en: "My girlfriend is Portuguese and she speaks French very well.", altEs: ["Ma copine est portugaise et parle très bien français.", "Ma copine est portugaise, et elle parle très bien le français."], altEn: ["My friend is Portuguese and she speaks very good French."], grammar: [g.adjective-agreement], vocab: [w.portugais, w.copain] }
      - { es: "Mes voisins sont mexicains.", en: "My neighbours are Mexican.", altEs: ["Mes voisines sont mexicaines."], grammar: [g.adjective-agreement, g.plural-nouns], vocab: [w.mexicain] }
      - { es: "Karim est marocain et Ana est brésilienne.", en: "Karim is Moroccan and Ana is Brazilian.", grammar: [g.adjective-agreement], vocab: [w.marocain, w.brésilien], transform: { instruction: "Replace Karim with Nadia (a woman)", answer: "Nadia est marocaine et Ana est brésilienne.", en: "Nadia is Moroccan and Ana is Brazilian." } }
      - { es: "Je ne suis pas parisien, je suis de Lille.", en: "I'm not from Paris, I'm from Lille.", altEs: ["Je ne suis pas parisienne, je suis de Lille.", "Je suis pas parisien, je suis de Lille."], altEn: ["I'm not Parisian, I'm from Lille."], grammar: [g.negation-ne-pas, g.adjective-agreement], vocab: [w.parisien] }
      - { es: "Quelle est votre nationalité ?", en: "What's your nationality?", altEs: ["Vous êtes de quelle nationalité ?", "Quelle est ta nationalité ?"], grammar: [g.question-words], vocab: [w.nationalité, w.quel] }
      - { es: "Le Canada est un grand pays.", en: "Canada is a big country.", grammar: [g.articles-definite], vocab: [w.pays, w.grand] }
      - { es: "Lyon est une belle ville.", en: "Lyon is a beautiful city.", altEs: ["Lyon, c'est une belle ville."], grammar: [g.gender-nouns], vocab: [w.ville] }
      - { es: "Elle vient d'où, ta copine ?", en: "Where does your girlfriend come from?", altEs: ["D'où vient ta copine ?", "Ta copine vient d'où ?", "Elle est d'où, ta copine ?"], altEn: ["Where's your friend from?"], grammar: [g.question-words], vocab: [w.venir, w.d-où, w.où] }
    exchanges:
      - q: { es: "Tu es d'où ?", en: "Where are you from?" }
        a: { es: "Je suis de Madrid. Je suis espagnol.", en: "I'm from Madrid. I'm Spanish." }
        alt: ["De Madrid.", "Je suis espagnole, de Madrid."]
        grammar: [g.adjective-agreement, g.question-words]
        vocab: [w.d-où, w.espagnol]
      - q: { es: "Vous êtes américaine ?", en: "Are you American?" }
        a: { es: "Non, je suis canadienne, de Montréal.", en: "No, I'm Canadian, from Montreal." }
        alt: ["Oui, je suis américaine.", "Non, canadienne."]
        grammar: [g.adjective-agreement]
        vocab: [w.américain, w.canadien]
      - q: { es: "Il est d'où, Marco ?", en: "Where's Marco from?" }
        a: { es: "Il est italien, de Rome.", en: "He's Italian, from Rome." }
        alt: ["De Rome.", "Il est de Rome."]
        grammar: [g.adjective-agreement]
        vocab: [w.italien]
      - q: { es: "Quelle est ta nationalité ?", en: "What's your nationality?" }
        a: { es: "Je suis japonaise.", en: "I'm Japanese." }
        alt: ["Japonaise.", "Je suis japonais."]
        grammar: [g.adjective-agreement, g.question-words]
        vocab: [w.nationalité, w.japonais]
      - q: { es: "Elles sont belges ?", en: "Are they Belgian?" }
        a: { es: "Non, elles sont suisses, de Genève.", en: "No, they're Swiss, from Geneva." }
        alt: ["Oui, elles sont belges.", "Non, suisses."]
        grammar: [g.adjective-agreement, g.plural-nouns]
        vocab: [w.belge, w.suisse]
    texts:
      - title: "Au pied de la tour Eiffel"
        es: ["Devant la tour Eiffel, il y a des touristes de tous les pays.", "Les filles sont japonaises, le monsieur est mexicain.", "Et moi ? Je suis anglaise !"]
        en: ["In front of the Eiffel Tower there are tourists from every country.", "The girls are Japanese, the man is Mexican.", "And me? I'm English!"]
        grammar: [g.adjective-agreement]
        vocab: [w.touriste, w.pays, w.japonais, w.mexicain]
      - title: "Carte postale"
        es: ["Salut, Hugo !", "Je suis à Paris avec Ana, une amie brésilienne.", "Elle est très sympa, et la ville est très belle."]
        en: ["Hi, Hugo!", "I'm in Paris with Ana, a Brazilian friend.", "She's really nice, and the city is very beautiful."]
        grammar: [g.adjective-agreement]
        vocab: [w.brésilien, w.ville]
    spicy:
      - { es: "Tu es italien ? C'est pour ça que tu es si beau ?", en: "You're Italian? Is that why you're so handsome?", altEs: ["Tu es italienne ? C'est pour ça que tu es si belle ?"], grammar: [g.adjective-agreement], vocab: [w.italien] }
      - { es: "Je ne suis pas parisienne, mais pour toi, je reste à Paris.", en: "I'm not Parisian, but for you, I'll stay in Paris.", altEs: ["Je ne suis pas parisien, mais pour toi, je reste à Paris."], grammar: [g.adjective-agreement, g.negation-ne-pas], vocab: [w.parisien] }
      - { es: "Tu es d'où ? Du paradis ?", en: "Where are you from? Heaven?", altEs: ["Tu viens d'où ? Du paradis ?"], grammar: [g.question-words], vocab: [w.d-où] }
      - { es: "Il est belge : il a des frites et un beau sourire. Parfait !", en: "He's Belgian: he has fries and a lovely smile. Perfect!", altEs: ["Elle est belge : elle a des frites et un beau sourire. Parfait !"], grammar: [g.adjective-agreement], vocab: [w.belge] }
      - { es: "Ton pays est loin, mais ton sourire est ici.", en: "Your country is far away, but your smile is here.", grammar: [g.gender-nouns], vocab: [w.pays] }
  - id: a1.u02.l2
    title: "La Dame de fer"
    teach: [g.gender-nouns, g.articles-definite]
    tip: "Learn every noun with its article: le livre, la table, l'hôtel. Le and la become l' before a vowel or a silent h."
    vocab: [w.le, w.tour, w.monument, w.fer, w.colline, w.île, w.photo, w.voiture, w.livre, w.table, w.musique, w.école, w.gare, w.hôtel, w.capitale, w.monde]
    sentences:
      - { es: "La tour Eiffel est en fer.", en: "The Eiffel Tower is made of iron.", altEn: ["The Eiffel Tower is iron."], grammar: [g.articles-definite, g.gender-nouns], vocab: [w.le, w.tour, w.fer], note: "On l'appelle la Dame de fer: the Iron Lady." }
      - { es: "Le monument est très grand.", en: "The monument is very big.", altEn: ["The monument is very tall."], grammar: [g.articles-definite], vocab: [w.monument] }
      - { es: "Paris est la capitale de la France.", en: "Paris is the capital of France.", grammar: [g.articles-definite], vocab: [w.capitale] }
      - { es: "L'hôtel est près de la gare.", en: "The hotel is near the station.", altEs: ["L'hôtel est à côté de la gare."], grammar: [g.articles-definite, g.elision-liaison], vocab: [w.hôtel, w.gare], error: { wrong: "Le hôtel est près de la gare.", explain: "le becomes l' before a vowel or a silent h: l'hôtel.", grammar: g.articles-definite } }
      - { es: "Les photos de Montmartre sont très belles.", en: "The photos of Montmartre are very beautiful.", grammar: [g.articles-definite, g.plural-nouns], vocab: [w.photo] }
      - { es: "La voiture de Paul est devant l'école.", en: "Paul's car is in front of the school.", grammar: [g.articles-definite, g.gender-nouns], vocab: [w.voiture, w.école] }
      - { es: "Le livre est sur la table.", en: "The book is on the table.", grammar: [g.articles-definite, g.gender-nouns], vocab: [w.livre, w.table], transform: { instruction: "Make it plural (the books)", answer: "Les livres sont sur la table.", en: "The books are on the table." } }
      - { es: "J'aime la musique française.", en: "I love French music.", altEs: ["Moi, j'aime la musique française."], altEn: ["I like French music."], grammar: [g.articles-definite, g.aimer-preferer], vocab: [w.musique, w.aimer], error: { wrong: "J'aime musique française.", explain: "French keeps the article with likes: j'aime la musique.", grammar: g.articles-definite } }
      - { es: "Le Sacré-Cœur est sur la colline de Montmartre.", en: "The Sacré-Cœur is on the hill of Montmartre.", altEn: ["The Sacré-Cœur is on Montmartre hill."], grammar: [g.articles-definite], vocab: [w.colline] }
      - { es: "L'île de la Cité est sur la Seine.", en: "The Île de la Cité is on the Seine.", grammar: [g.articles-definite, g.elision-liaison], vocab: [w.île] }
      - { es: "Il y a beaucoup de monde à la tour Eiffel.", en: "There are lots of people at the Eiffel Tower.", altEs: ["Il y a du monde à la tour Eiffel."], altEn: ["It's very crowded at the Eiffel Tower."], grammar: [g.il-y-a, g.gender-nouns], vocab: [w.monde, w.tour], note: "Beaucoup de monde = a lot of people; le monde is also 'the world'." }
      - { es: "Le français est une belle langue.", en: "French is a beautiful language.", altEs: ["Le français, c'est une belle langue."], grammar: [g.articles-definite, g.gender-nouns], vocab: [w.langue, w.français] }
      - { es: "Où est la gare, s'il vous plaît ?", en: "Where's the station, please?", altEs: ["La gare, s'il vous plaît ?", "Où est la gare, s'il te plaît ?"], grammar: [g.articles-definite, g.question-words], vocab: [w.gare, w.où] }
      - { es: "Le musée d'Orsay est fermé le lundi.", en: "The Musée d'Orsay is closed on Mondays.", grammar: [g.articles-definite, g.days-months-dates], vocab: [w.lundi], transform: { instruction: "Make it about the museums (plural)", answer: "Les musées sont fermés le lundi.", en: "The museums are closed on Mondays." } }
    exchanges:
      - q: { es: "C'est quoi, ce monument ?", en: "What's this monument?" }
        a: { es: "C'est la tour Eiffel !", en: "It's the Eiffel Tower!" }
        alt: ["La tour Eiffel.", "C'est la Dame de fer."]
        grammar: [g.articles-definite]
        vocab: [w.monument, w.tour]
      - q: { es: "Où est l'hôtel ?", en: "Where's the hotel?" }
        a: { es: "Il est près de la gare.", en: "It's near the station." }
        alt: ["Près de la gare.", "L'hôtel est près de la gare."]
        grammar: [g.articles-definite, g.gender-nouns]
        vocab: [w.hôtel, w.gare]
      - q: { es: "Tu aimes la musique française ?", en: "Do you like French music?" }
        a: { es: "Oui, j'adore la musique française !", en: "Yes, I love French music!" }
        alt: ["Oui, beaucoup.", "Non, pas trop."]
        grammar: [g.articles-definite, g.aimer-preferer]
        vocab: [w.musique]
      - q: { es: "Quelle est la capitale de la Belgique ?", en: "What's the capital of Belgium?" }
        a: { es: "C'est Bruxelles.", en: "It's Brussels." }
        alt: ["Bruxelles.", "La capitale, c'est Bruxelles."]
        grammar: [g.articles-definite]
        vocab: [w.capitale]
      - q: { es: "Le livre est sur la table ?", en: "Is the book on the table?" }
        a: { es: "Oui, il est sur la table.", en: "Yes, it's on the table." }
        alt: ["Oui.", "Non, il est dans la voiture."]
        grammar: [g.gender-nouns]
        vocab: [w.livre, w.table]
    texts:
      - title: "La Dame de fer"
        es: ["La tour Eiffel est un monument en fer.", "Elle est grande et très belle.", "Les touristes adorent la tour : photo, photo, photo !"]
        en: ["The Eiffel Tower is an iron monument.", "It's tall and very beautiful.", "The tourists love the tower: photo, photo, photo!"]
        grammar: [g.articles-definite, g.gender-nouns]
        vocab: [w.tour, w.monument, w.fer, w.photo]
      - title: "Carte postale de Paris"
        es: ["Bonjour de Paris !", "L'hôtel est près de la tour Eiffel.", "La ville est très belle, et il y a de la musique dans les rues !"]
        en: ["Greetings from Paris!", "The hotel is near the Eiffel Tower.", "The city is very beautiful, and there's music in the streets!"]
        grammar: [g.articles-definite]
        vocab: [w.hôtel, w.musique]
    spicy:
      - { es: "La tour Eiffel est belle, mais la vue avec toi est plus belle.", en: "The Eiffel Tower is beautiful, but the view with you is more beautiful.", grammar: [g.articles-definite, g.gender-nouns], vocab: [w.tour] }
      - { es: "La photo ? D'accord, mais avec toi sur la photo.", en: "The photo? OK, but with you in the photo.", grammar: [g.articles-definite], vocab: [w.photo] }
      - { es: "J'aime la musique, la France… et l'homme à côté de la tour.", en: "I love music, France… and the man next to the tower.", altEs: ["J'aime la musique, la France… et la femme à côté de la tour."], grammar: [g.articles-definite, g.aimer-preferer], vocab: [w.musique, w.tour] }
      - { es: "L'hôtel est près de la gare… et près de chez toi.", en: "The hotel is near the station… and near your place.", grammar: [g.articles-definite, g.elision-liaison], vocab: [w.hôtel, w.gare] }
      - { es: "Le livre est sur la table, et mon numéro est dans le livre.", en: "The book is on the table, and my number is in the book.", grammar: [g.articles-definite], vocab: [w.livre, w.table] }
  - id: a1.u02.l3
    title: "Ce n'est pas loin"
    teach: [g.negation-ne-pas]
    tip: "Wrap ne … pas around the verb: je ne suis pas, il n'est pas. In everyday speech you will often hear the ne dropped."
    vocab: [w.un, w.grand, w.petit, w.content, w.marié, w.sportif, w.vrai, w.faux, w.loin, w.près, w.lundi, w.travailler, w.étudier]
    sentences:
      - { es: "Je ne suis pas marié.", en: "I'm not married.", altEs: ["Je ne suis pas mariée.", "Je suis pas marié."], grammar: [g.negation-ne-pas], vocab: [w.marié] }
      - { es: "La tour Eiffel n'est pas loin.", en: "The Eiffel Tower isn't far.", altEs: ["La tour Eiffel, ce n'est pas loin.", "La tour Eiffel, c'est pas loin."], grammar: [g.negation-ne-pas], vocab: [w.loin], error: { wrong: "La tour Eiffel ne est pas loin.", explain: "ne becomes n' before a vowel: n'est pas.", grammar: g.negation-ne-pas } }
      - { es: "Ce n'est pas vrai !", en: "That's not true!", altEs: ["C'est pas vrai !"], altEn: ["It's not true!", "No way!"], grammar: [g.negation-ne-pas], vocab: [w.vrai] }
      - { es: "Non, c'est faux : Paul n'est pas canadien.", en: "No, that's wrong: Paul isn't Canadian.", altEs: ["Non, c'est faux : Paul est pas canadien."], altEn: ["No, that's false: Paul isn't Canadian."], grammar: [g.negation-ne-pas, g.adjective-agreement], vocab: [w.faux] }
      - { es: "Il n'est pas grand, il est petit.", en: "He isn't tall, he's short.", altEs: ["Il est pas grand, il est petit."], grammar: [g.negation-ne-pas, g.adjective-agreement], vocab: [w.grand, w.petit], transform: { instruction: "Talk about a woman (elle)", answer: "Elle n'est pas grande, elle est petite.", alt: ["Elle est pas grande, elle est petite."], en: "She isn't tall, she's short." } }
      - { es: "Nous ne sommes pas contents.", en: "We aren't happy.", altEs: ["On n'est pas contents.", "Nous ne sommes pas contentes."], altEn: ["We're not pleased."], grammar: [g.negation-ne-pas, g.adjective-agreement], vocab: [w.content] }
      - { es: "Elle est très sportive.", en: "She's very sporty.", grammar: [g.adjective-agreement], vocab: [w.sportif] }
      - { es: "Je ne travaille pas le lundi.", en: "I don't work on Mondays.", altEs: ["Je travaille pas le lundi."], grammar: [g.negation-ne-pas, g.present-er], vocab: [w.travailler, w.lundi], transform: { instruction: "Make it positive", answer: "Je travaille le lundi.", en: "I work on Mondays." } }
      - { es: "Ils n'étudient pas ici, ils étudient à Lyon.", en: "They don't study here, they study in Lyon.", altEs: ["Ils étudient pas ici, ils étudient à Lyon."], grammar: [g.negation-ne-pas, g.present-er], vocab: [w.étudier] }
      - { es: "C'est un grand pays.", en: "It's a big country.", grammar: [g.articles-indefinite, g.adjective-agreement], vocab: [w.un, w.grand] }
      - { es: "Ce n'est pas une église, c'est un musée.", en: "It's not a church, it's a museum.", altEs: ["C'est pas une église, c'est un musée."], grammar: [g.negation-ne-pas, g.articles-indefinite], vocab: [w.un] }
      - { es: "La gare est près d'ici ?", en: "Is the station near here?", altEs: ["Est-ce que la gare est près d'ici ?", "La gare, c'est près d'ici ?"], grammar: [g.yes-no-questions], vocab: [w.près] }
      - { es: "Mon hôtel n'est pas près de la tour.", en: "My hotel isn't near the tower.", altEs: ["Mon hôtel est pas près de la tour."], grammar: [g.negation-ne-pas], vocab: [w.près, w.hôtel] }
      - { es: "Elle n'est pas française, elle est belge.", en: "She isn't French, she's Belgian.", altEs: ["Elle est pas française, elle est belge."], grammar: [g.negation-ne-pas, g.adjective-agreement], vocab: [w.français, w.belge] }
    exchanges:
      - q: { es: "Tu es marié ?", en: "Are you married?" }
        a: { es: "Non, je ne suis pas marié.", en: "No, I'm not married." }
        alt: ["Non.", "Oui, je suis marié.", "Non, je suis pas marié."]
        grammar: [g.negation-ne-pas]
        vocab: [w.marié]
      - q: { es: "C'est loin, la tour Eiffel ?", en: "Is the Eiffel Tower far?" }
        a: { es: "Non, ce n'est pas loin. C'est tout près.", en: "No, it's not far. It's very close." }
        alt: ["Non, c'est près.", "Non, pas loin."]
        grammar: [g.negation-ne-pas]
        vocab: [w.loin, w.près]
      - q: { es: "Paul est canadien, c'est vrai ?", en: "Paul is Canadian, is that true?" }
        a: { es: "Non, c'est faux. Il est belge.", en: "No, that's wrong. He's Belgian." }
        alt: ["Oui, c'est vrai.", "Non, il est belge."]
        grammar: [g.negation-ne-pas, g.yes-no-questions]
        vocab: [w.vrai, w.faux]
      - q: { es: "Tu travailles le lundi ?", en: "Do you work on Mondays?" }
        a: { es: "Non, je ne travaille pas le lundi.", en: "No, I don't work on Mondays." }
        alt: ["Oui, je travaille le lundi.", "Non, pas le lundi."]
        grammar: [g.negation-ne-pas, g.present-er]
        vocab: [w.travailler, w.lundi]
      - q: { es: "Vous êtes contents de l'hôtel ?", en: "Are you happy with the hotel?" }
        a: { es: "Oui, très contents ! Il est petit, mais joli.", en: "Yes, very happy! It's small, but nice." }
        alt: ["Non, pas trop.", "Oui, très."]
        grammar: [g.adjective-agreement]
        vocab: [w.content, w.petit]
    texts:
      - title: "Mon ami Louis"
        es: ["Louis n'est pas parisien, il est de Lille.", "Il n'est pas grand, mais il est très sportif.", "Il travaille à Paris, mais il n'habite pas ici."]
        en: ["Louis isn't from Paris, he's from Lille.", "He isn't tall, but he's very sporty.", "He works in Paris, but he doesn't live here."]
        grammar: [g.negation-ne-pas, g.adjective-agreement]
        vocab: [w.grand, w.sportif, w.travailler]
      - title: "Message d'Emma"
        es: ["Je suis à l'hôtel.", "Ce n'est pas loin de la tour Eiffel.", "Tu es là lundi ?"]
        en: ["I'm at the hotel.", "It isn't far from the Eiffel Tower.", "Are you around on Monday?"]
        grammar: [g.negation-ne-pas]
        vocab: [w.loin, w.lundi]
    spicy:
      - { es: "Je ne suis pas marié… et toi ?", en: "I'm not married… and you?", altEs: ["Je ne suis pas mariée… et toi ?", "Je suis pas marié… et toi ?"], grammar: [g.negation-ne-pas], vocab: [w.marié] }
