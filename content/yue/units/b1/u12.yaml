id: b1.u12
title: 我嘅將來
lessons:
  - id: b1.u12.l1
    title: 為咗將來
    teach: [g.wai-zo-purpose]
    vocab: [w.wai6-zo2, w.wai6, w.muk6-dik1, w.jung6-lai4, w.dang2.b, w.fai3-si6, w.cou5, w.zeon3-sau1, w.sek6-si6, w.hok6-wai2, w.lau4-hok6, w.ji4-man4, w.ceot1-gwok3, w.gei6-nang4, w.zing3-syu1, w.taap3, w.cit3-gai3, w.zoeng1-loi4]
    tip: "為咗 + goal usually comes first: 為咗儲錢，我好少出街食飯. 等 + clause means 'so that': 講慢啲，等佢聽得明."
    sentences:
      - { es: "為咗學好廣東話，我日日都聽電台。", en: "To get good at Cantonese, I listen to the radio every day.", altEs: ["為咗學好廣東話，我每日都聽電台。"], grammar: [g.wai-zo-purpose], vocab: [w.wai6-zo2] }
      - { es: "佢為咗屋企人好努力咁做嘢。", en: "He works very hard for his family.", altEs: ["佢為咗屋企人好努力做嘢。", "為咗屋企人，佢好努力咁做嘢。"], altEn: ["She works very hard for her family's sake."], grammar: [g.wai-zo-purpose], vocab: [w.wai6-zo2] }
      - { es: "為咗儲錢去留學，佢做兩份兼職。", en: "To save up to study abroad, she has two part-time jobs.", altEs: ["佢為咗儲錢去留學，做兩份兼職。"], altEn: ["He does two part-time jobs to save up for studying abroad."], grammar: [g.wai-zo-purpose], vocab: [w.cou5, w.lau4-hok6] }
      - { es: "我想讀碩士，所以要進修英文。", en: "I want to do a master's, so I need to take some more English classes.", altEs: ["我想讀碩士，所以要進修吓英文。"], grammar: [g.jan-wai-so-ji], vocab: [w.sek6-si6, w.zeon3-sau1] }
      - { es: "佢去英國留學，目的係學設計。", en: "She's going to the UK to study, and her aim is to learn design.", altEs: ["佢去英國讀書，目的係學設計。"], altEn: ["He's studying in the UK in order to learn design."], grammar: [g.wai-zo-purpose], vocab: [w.lau4-hok6, w.muk6-dik1] }
      - { es: "你為咗乜嘢要出國讀書？", en: "Why do you want to study abroad?", altEs: ["你點解要出國讀書？", "你為咩要出國讀書？"], grammar: [g.wai-zo-purpose], vocab: [w.ceot1-gwok3] }
      - { es: "你早啲訂機票，等可以平啲。", en: "Book your plane ticket early so it's cheaper.", altEs: ["早啲訂機票，等可以平啲。"], grammar: [g.wai-zo-purpose], vocab: [w.dang2.b] }
      - { es: "我帶埋遮，費事淋濕。", en: "I'll bring an umbrella too, so I don't get soaked.", altEs: ["我帶埋把遮，費事淋濕。"], grammar: [g.wai-zo-purpose], vocab: [w.fai3-si6] }
      - { es: "呢張證書係用嚟搵工嘅。", en: "This certificate is for job-hunting.", altEs: ["呢張證書用嚟搵工嘅。"], grammar: [g.wai-zo-purpose], vocab: [w.zing3-syu1, w.jung6-lai4] }
      - { es: "學多一種技能，將來搵工易啲。", en: "Learn one more skill, and finding a job will be easier in future.", altEs: ["學多種技能，將來搵工會易啲。"], grammar: [g.wai-zo-purpose], vocab: [w.gei6-nang4] }
      - { es: "佢有咗學位，仲想讀碩士。", en: "She has her degree, and now she wants a master's too.", altEs: ["佢讀完學位，仲想讀碩士。"], altEn: ["He's got his degree and still wants to do a master's."], grammar: [g.zung-still], vocab: [w.hok6-wai2, w.sek6-si6] }
      - { es: "為咗呢張證書，佢溫咗三個月書。", en: "He revised for three months for this certificate.", altEs: ["佢為咗呢張證書溫咗三個月書。"], altEn: ["She studied for three months to get this certificate."], grammar: [g.wai-zo-purpose, g.duration], vocab: [w.zing3-syu1] }
      - { es: "我為咗睇聚星樓，第一次去屏山。", en: "I went to Ping Shan for the first time to see the Tsui Sing Lau pagoda.", altEs: ["為咗睇聚星樓，我第一次去屏山。"], grammar: [g.wai-zo-purpose], vocab: [w.wai6-zo2, w.taap3] }
      - { es: "為咗健康，我日日行樓梯。", en: "For my health, I take the stairs every day.", altEs: ["為咗健康，我每日都行樓梯。"], grammar: [g.wai-zo-purpose], vocab: [w.wai6], error: { wrong: "我日日行樓梯為咗健康。", explain: "Put the 為咗 purpose first: 為咗健康，我日日行樓梯.", grammar: g.wai-zo-purpose } }
      - { es: "我想學廣東話，所以我嚟咗香港。", en: "I wanted to learn Cantonese, so I came to Hong Kong.", altEs: ["我想學廣東話，所以嚟咗香港。"], grammar: [g.wai-zo-purpose], vocab: [w.wai6-zo2], transform: { instruction: "Rephrase with 為咗 at the start", answer: "為咗學廣東話，我嚟咗香港。", alt: ["為咗學廣東話，我嚟香港。"], en: "I came to Hong Kong to learn Cantonese." } }
      - { es: "講大聲啲，大家先聽到。", en: "Speak up, or people won't hear.", altEs: ["講大聲啲，大家先聽得到。"], grammar: [g.wai-zo-purpose, g.sin-final], vocab: [w.dang2.b], transform: { instruction: "Use 等 'so that'", answer: "講大聲啲，等大家聽到。", alt: ["講大聲啲，等大家聽得到。"], en: "Speak up so everyone can hear." } }
    exchanges:
      - q: { es: "你點解學廣東話？", en: "Why are you learning Cantonese?" }
        a: { es: "為咗同我男朋友屋企人傾偈。", en: "So I can chat with my boyfriend's family." }
        alt: ["為咗搵工。", "為咗同我女朋友屋企人傾偈。"]
        grammar: [g.wai-zo-purpose]
        vocab: [w.wai6-zo2]
      - q: { es: "你為咗乜嘢儲錢？", en: "What are you saving up for?" }
        a: { es: "為咗出國留學。", en: "To study abroad." }
        alt: ["為咗去旅行。", "為咗買樓。"]
        grammar: [g.wai-zo-purpose]
        vocab: [w.cou5, w.ceot1-gwok3, w.lau4-hok6]
      - q: { es: "呢張證書有咩用？", en: "What's this certificate for?" }
        a: { es: "用嚟搵工嘅。", en: "It's for job-hunting." }
        alt: ["係用嚟搵工嘅。", "冇乜用。"]
        grammar: [g.wai-zo-purpose]
        vocab: [w.zing3-syu1, w.jung6-lai4]
      - q: { es: "你點解帶咁多嘢？", en: "Why are you bringing so much stuff?" }
        a: { es: "費事唔夠用囉。", en: "So I don't run short." }
        alt: ["費事要再買。", "以防萬一囉。"]
        grammar: [g.wai-zo-purpose]
        vocab: [w.fai3-si6]
      - q: { es: "佢點解移民？", en: "Why did she emigrate?" }
        a: { es: "佢話係為咗個仔嘅將來。", en: "She says it's for her son's future." }
        alt: ["為咗個仔。", "為咗搵工。"]
        grammar: [g.wai-zo-purpose, g.reported-speech]
        vocab: [w.ji4-man4]
    texts:
      - title: "屏山文物徑"
        es: ["為咗認識新界嘅歷史，我去咗屏山文物徑。", "我睇咗祠堂同聚星樓。", "聽講呢座塔好舊㗎。"]
        en: ["To learn about the history of the New Territories, I went to the Ping Shan Heritage Trail.", "I saw the ancestral hall and the Tsui Sing Lau pagoda.", "I hear this pagoda is very old."]
        grammar: [g.wai-zo-purpose]
        vocab: [w.wai6-zo2, w.taap3]
      - title: "留學計劃"
        es: ["為咗讀碩士，我要儲兩年錢。", "我仲要考一張英文證書。", "目的係將來搵一份好工。"]
        en: ["To do a master's, I need to save for two years.", "I also need to get an English certificate.", "The aim is to find a good job in future."]
        grammar: [g.wai-zo-purpose, g.zung-still]
        vocab: [w.sek6-si6, w.cou5, w.zing3-syu1, w.muk6-dik1]
    spicy:
      - { es: "為咗見你，我今朝五點就起身。", en: "I got up at five this morning just to see you.", altEs: ["為咗見你，我今朝五點已經起身。"], grammar: [g.wai-zo-purpose], vocab: [w.wai6-zo2] }
      - { es: "我學廣東話，目的係同你傾偈。", en: "I'm learning Cantonese so I can chat with you.", altEs: ["我學廣東話嘅目的係同你傾偈。"], grammar: [g.wai-zo-purpose], vocab: [w.muk6-dik1] }
      - { es: "我坐近啲，等我聽清楚你講乜。", en: "I'll sit a bit closer so I can hear what you're saying.", altEs: ["我坐近啲，等我聽清楚你講咩。"], grammar: [g.wai-zo-purpose], vocab: [w.dang2.b] }
      - { es: "費事你唔記得我，我每日都會打電話畀你。", en: "So you don't forget me, I'll call you every day.", altEs: ["費事你唔記得我，我日日都會打畀你。"], grammar: [g.wai-zo-purpose], vocab: [w.fai3-si6] }
      - { es: "為咗你，我食齋一個月都得。", en: "For you, I'd even eat vegetarian for a month.", altEs: ["為咗你，食齋一個月我都得。"], grammar: [g.wai-zo-purpose], vocab: [w.wai6-zo2] }
  - id: b1.u12.l2
    title: 我嘅夢想
    teach: [g.hei-mong-hope]
    vocab: [w.hei1-mong6, w.hei1-mong6.b, w.mung6-soeng2, w.lei5-soeng2, w.muk6-biu1, w.zoeng1-loi4, w.mei6-loi4, w.jyun6-mong6, w.sam1-jyun6, w.waan4-jau4-sai3-gaai3, w.saang1-zai2, w.cong3-jip6, w.zung2-jau5-jat1-jat6, w.jan4-sang1, w.faai3-lok6, w.zi6-jau4, w.wan2-ding6]
    tip: "希望 takes a whole clause: 我希望你早日康復. 將來 'in future' goes before the verb; 夢想 is a long-term dream."
    sentences:
      - { es: "我希望將來可以喺屏山附近買屋。", en: "I hope I can buy a house near Ping Shan one day.", altEs: ["我希望將來可以喺屏山附近買樓。"], grammar: [g.hei-mong-hope], vocab: [w.hei1-mong6, w.zoeng1-loi4] }
      - { es: "你將來想做咩工？", en: "What job do you want to do in future?", altEs: ["你將來想做乜嘢工？", "將來你想做咩工呀？"], grammar: [g.hei-mong-hope], vocab: [w.zoeng1-loi4] }
      - { es: "佢嘅夢想係喺屏山開間茶餐廳。", en: "Her dream is to open a cha chaan teng in Ping Shan.", altEs: ["佢嘅夢想係喺屏山開一間茶餐廳。"], altEn: ["His dream is to open a café in Ping Shan."], grammar: [g.hei-mong-hope], vocab: [w.mung6-soeng2] }
      - { es: "希望聽日唔好落雨。", en: "Hopefully it won't rain tomorrow.", altEs: ["希望聽日唔會落雨。", "我希望聽日唔好落雨。"], grammar: [g.hei-mong-hope], vocab: [w.hei1-mong6] }
      - { es: "佢嘅理想係做醫生。", en: "His ambition is to be a doctor.", altEs: ["佢嘅理想係做一個醫生。"], altEn: ["Her ambition is to become a doctor."], grammar: [g.hei-mong-hope], vocab: [w.lei5-soeng2] }
      - { es: "我今年嘅目標係學識游水。", en: "My goal this year is to learn to swim.", altEs: ["今年我嘅目標係學識游水。"], grammar: [g.hei-mong-hope], vocab: [w.muk6-biu1] }
      - { es: "未來十年，香港會有好大改變。", en: "Over the next ten years, Hong Kong will change a lot.", altEs: ["未來十年，香港會改變好多。"], grammar: [g.wui-will], vocab: [w.mei6-loi4] }
      - { es: "我嘅願望係屋企人身體健康。", en: "My wish is for my family to be healthy.", altEs: ["我嘅願望係屋企人個個都身體健康。"], grammar: [g.hei-mong-hope], vocab: [w.jyun6-mong6] }
      - { es: "佢希望三十歲之前生仔。", en: "She hopes to have a baby before she's thirty.", altEs: ["佢希望三十歲前生仔。"], altEn: ["He hopes to have a child before he's thirty."], grammar: [g.hei-mong-hope, g.ji-cin-ji-hau], vocab: [w.saang1-zai2] }
      - { es: "好多後生仔都想創業，自己做老闆。", en: "Lots of young people want to start their own business and be their own boss.", altEs: ["好多年輕人都想創業，自己做老闆。"], grammar: [g.hei-mong-hope], vocab: [w.cong3-jip6] }
      - { es: "我想要一份穩定嘅工。", en: "I want a stable job.", altEs: ["我想搵一份穩定嘅工。"], grammar: [g.adj-ge-noun], vocab: [w.wan2-ding6] }
      - { es: "我希望生活可以自由啲。", en: "I hope I can have a bit more freedom in life.", altEs: ["我希望生活自由啲。"], grammar: [g.hei-mong-hope], vocab: [w.zi6-jau4] }
      - { es: "你有冇咩心願？", en: "Do you have a wish?", altEs: ["你有冇乜嘢心願？"], altEn: ["Is there anything you wish for?"], grammar: [g.hei-mong-hope], vocab: [w.sam1-jyun6] }
      - { es: "我希望你哋玩得開心。", en: "I hope you all have a great time.", altEs: ["希望你哋玩得開心。"], grammar: [g.hei-mong-hope], vocab: [w.hei1-mong6], error: { wrong: "我希望係你哋玩得開心。", explain: "希望 takes a clause directly; don't add 係: 我希望你哋玩得開心.", grammar: g.hei-mong-hope } }
      - { es: "我想做老師。", en: "I want to be a teacher.", altEs: ["我想當老師。"], grammar: [g.hei-mong-hope], vocab: [w.zoeng1-loi4], transform: { instruction: "Add 將來: in future I'd like to be a teacher", answer: "我將來想做老師。", alt: ["將來我想做老師。"] } }
      - { es: "我想環遊世界。", en: "I want to travel round the world.", altEs: ["我好想環遊世界。"], grammar: [g.hei-mong-hope], vocab: [w.waan4-jau4-sai3-gaai3], transform: { instruction: "Say it's your dream: 我嘅夢想係…", answer: "我嘅夢想係環遊世界。", alt: ["我嘅夢想就係環遊世界。"], en: "My dream is to travel round the world." } }
    exchanges:
      - q: { es: "你將來想做乜嘢？", en: "What do you want to do in future?" }
        a: { es: "我想做老師，教細路。", en: "I want to be a teacher and teach children." }
        alt: ["做老師。", "我想創業。"]
        grammar: [g.hei-mong-hope]
        vocab: [w.zoeng1-loi4]
      - q: { es: "你嘅夢想係乜嘢？", en: "What's your dream?" }
        a: { es: "環遊世界，去晒所有國家。", en: "To travel the world and visit every country." }
        alt: ["環遊世界。", "開一間自己嘅舖頭。"]
        grammar: [g.hei-mong-hope, g.saai-all]
        vocab: [w.mung6-soeng2, w.waan4-jau4-sai3-gaai3]
      - q: { es: "你今年有咩目標？", en: "What are your goals this year?" }
        a: { es: "我希望可以考到車牌。", en: "I hope I can pass my driving test." }
        alt: ["考車牌。", "減肥囉。"]
        grammar: [g.hei-mong-hope]
        vocab: [w.muk6-biu1, w.hei1-mong6]
      - q: { es: "你想唔想生仔？", en: "Do you want to have children?" }
        a: { es: "想呀，不過唔係而家。", en: "Yes, but not now." }
        alt: ["想呀。", "未諗好。"]
        grammar: [g.hei-mong-hope]
        vocab: [w.saang1-zai2]
      - q: { es: "你點解想創業？", en: "Why do you want to start a business?" }
        a: { es: "因為我想自由啲，唔使返工。", en: "Because I want more freedom and not to have to go to work." }
        alt: ["想自己做老闆。", "因為我想自由啲。"]
        grammar: [g.jan-wai-so-ji]
        vocab: [w.cong3-jip6, w.zi6-jau4]
    texts:
      - title: "我嘅將來"
        es: ["我今年二十二歲，啱啱畢業。", "我嘅夢想係創業，開一間自己嘅茶餐廳。", "我希望總有一日可以做到。"]
        en: ["I'm twenty-two and have just graduated.", "My dream is to start my own business and open my own cha chaan teng.", "I hope one day I can make it happen."]
        grammar: [g.hei-mong-hope]
        vocab: [w.mung6-soeng2, w.cong3-jip6, w.hei1-mong6, w.zung2-jau5-jat1-jat6]
      - title: "新年心願"
        es: ["我嘅新年心願好簡單。", "希望屋企人身體健康，自己有份穩定嘅工。", "人生最緊要係快樂。"]
        en: ["My New Year wish is very simple.", "I hope my family stays healthy and I have a stable job.", "The most important thing in life is to be happy."]
        grammar: [g.hei-mong-hope]
        vocab: [w.sam1-jyun6, w.wan2-ding6, w.jan4-sang1, w.faai3-lok6]
    spicy:
      - { es: "我嘅夢想係同你環遊世界。", en: "My dream is to travel the world with you.", altEs: ["我嘅夢想就係同你一齊環遊世界。"], grammar: [g.hei-mong-hope], vocab: [w.mung6-soeng2, w.waan4-jau4-sai3-gaai3] }
      - { es: "我希望你今晚唔好咁早走。", en: "I hope you won't leave so early tonight.", altEs: ["希望你今晚唔好咁早走。"], grammar: [g.hei-mong-hope], vocab: [w.hei1-mong6] }
      - { es: "將來嘅事我唔知，但係今晚我想同你食飯。", en: "I don't know about the future, but tonight I want to have dinner with you.", altEs: ["將來嘅事我唔知，不過今晚我想同你食飯。"], grammar: [g.hei-mong-hope], vocab: [w.zoeng1-loi4] }
      - { es: "我嘅新年願望係：你約我出街。", en: "My New Year's wish: that you'll ask me out.", altEs: ["我嘅新年願望就係你約我出街。"], grammar: [g.hei-mong-hope], vocab: [w.jyun6-mong6] }
      - { es: "人生咁短，不如今晚就去約會？", en: "Life's short; how about a date tonight?", altEs: ["人生咁短，不如今晚去約會？"], grammar: [g.hou-m-hou-suggestions], vocab: [w.jan4-sang1] }
  - id: b1.u12.l3
    title: 仲未…，仲要…
    teach: [g.zung-still]
    vocab: [w.zung6-jiu3.b, w.gik6, w.zeon3-bou6, w.teoi3-bou6, w.zaap6-gwaan3, w.gaai3, w.gaai3-jin1, w.gaam2-fei4, w.haau2-paai4, w.hok6-ce1, w.hong1-fuk6, w.zou2-jat6-hong1-fuk6, w.zou2-jat6, w.ci4-zou2, w.goi2-bin3, w.gaam2]
    tip: "仲 before the verb: 'still' (仲未食), 'also, on top' (仲要), or 'even more' with adjectives (仲貴)."
    sentences:
      - { es: "已經一點喇，你仲未瞓呀？", en: "It's already one o'clock and you're still not in bed?", altEs: ["已經一點，你仲未瞓？"], grammar: [g.zung-still], vocab: [w.zung6-jiu3.b] }
      - { es: "佢嘅廣東話仲好過我。", en: "His Cantonese is even better than mine.", altEs: ["佢嘅廣東話仲好過我嘅。"], altEn: ["Her Cantonese is even better than mine."], grammar: [g.zung-still, g.adj-gwo-comparison], vocab: [] }
      - { es: "我哋仲要行幾耐先到聚星樓？", jp: "ngo5 dei6 zung6 jiu3 haang4 gei2 noi6 sin1 dou3 zeoi6 sing1 lau4", en: "How much longer do we have to walk to get to Tsui Sing Lau?", altEs: ["仲要行幾耐先到聚星樓呀？"], grammar: [g.zung-still, g.sin-final], vocab: [w.zung6-jiu3.b] }
      - { es: "我學咗三個月車，仲未考牌。", en: "I've had three months of driving lessons and still haven't taken the test.", altEs: ["我學咗三個月車，仲未去考牌。"], grammar: [g.zung-still, g.duration], vocab: [w.hok6-ce1, w.haau2-paai4] }
      - { es: "佢戒咗煙，仲日日跑步。", en: "He's quit smoking, and he goes running every day too.", altEs: ["佢戒咗煙，仲每日都跑步。"], altEn: ["She's given up smoking and runs every day as well."], grammar: [g.zung-still], vocab: [w.gaai3-jin1, w.gaai3] }
      - { es: "我減緊肥，所以唔食甜品。", en: "I'm on a diet, so I'm not having dessert.", altEs: ["我減緊肥，所以唔食糖水。"], grammar: [g.gan-progressive], vocab: [w.gaam2-fei4] }
      - { es: "你嘅廣東話進步咗好多！", en: "Your Cantonese has improved a lot!", altEs: ["你嘅廣東話進步咗好多喎！"], grammar: [g.zo-perfective], vocab: [w.zeon3-bou6] }
      - { es: "佢幾個月冇練習，退步咗。", en: "She hasn't practised for months, and she's slipped back.", altEs: ["佢幾個月冇練習，退步咗好多。"], altEn: ["He hasn't practised for months and has got worse."], grammar: [g.zo-perfective], vocab: [w.teoi3-bou6] }
      - { es: "我想改變一啲壞習慣。", en: "I want to change some bad habits.", altEs: ["我想改變啲壞習慣。"], grammar: [g.hei-mong-hope], vocab: [w.goi2-bin3, w.zaap6-gwaan3] }
      - { es: "祝你早日康復！", en: "Get well soon!", altEs: ["希望你早日康復！"], grammar: [g.hei-mong-hope], vocab: [w.zou2-jat6-hong1-fuk6, w.zou2-jat6] }
      - { es: "佢遲早會明白。", en: "He'll understand sooner or later.", altEs: ["佢遲早都會明白。"], altEn: ["She'll get it sooner or later."], grammar: [g.wui-will], vocab: [w.ci4-zou2] }
      - { es: "溫極都唔記得，點算好？", en: "However much I revise, I still can't remember it. What should I do?", altEs: ["溫極都記唔到，點算好？"], grammar: [g.zung-still], vocab: [w.gik6] }
      - { es: "我阿爺八十幾歲，仲日日行山。", en: "My grandpa is over eighty and still goes hiking every day.", altEs: ["我爺爺八十幾歲，仲每日行山。"], grammar: [g.zung-still], vocab: [] }
      - { es: "佢仲喺屏山。", en: "She's still in Ping Shan.", altEs: ["佢仲喺屏山度。"], altEn: ["He's still at Ping Shan."], grammar: [g.zung-still], vocab: [], error: { wrong: "佢喺屏山仲。", explain: "仲 for 'still' goes before the verb: 佢仲喺屏山.", grammar: g.zung-still } }
      - { es: "我未食飯。", en: "I haven't eaten.", altEs: ["我未食嘢。"], grammar: [g.zung-still], vocab: [], transform: { instruction: "Add 仲: I *still* haven't eaten", answer: "我仲未食飯。", alt: ["我仲未食嘢。"] } }
      - { es: "今日好凍。", en: "It's cold today.", altEs: ["今日好冷。"], grammar: [g.zung-still], vocab: [], transform: { instruction: "Say today is *even* colder (仲)", answer: "今日仲凍。", alt: ["今日仲凍過尋日。"], en: "Today is even colder." } }
    exchanges:
      - q: { es: "你仲未瞓呀？", en: "You're still up?" }
        a: { es: "未呀，仲要溫書。", en: "Yes, I've still got revising to do." }
        alt: ["未呀。", "仲未，仲有功課。"]
        grammar: [g.zung-still]
        vocab: [w.zung6-jiu3.b]
      - q: { es: "你學車學成點？", en: "How are your driving lessons going?" }
        a: { es: "學咗兩個月，下個月考牌。", en: "Two months so far; I take the test next month." }
        alt: ["仲未考牌。", "幾好，就快考牌。"]
        grammar: [g.duration]
        vocab: [w.hok6-ce1, w.haau2-paai4]
      - q: { es: "你戒咗煙未呀？", en: "Have you quit smoking yet?" }
        a: { es: "戒咗喇，為咗健康。", en: "Yes, for my health." }
        alt: ["戒咗喇。", "仲未，好難戒。"]
        grammar: [g.wai-zo-purpose]
        vocab: [w.gaai3-jin1]
      - q: { es: "仲有冇其他嘢呀？", en: "Is there anything else?" }
        a: { es: "冇喇，多謝。", en: "No, that's all, thanks." }
        alt: ["仲有一樣嘢。", "冇喇。"]
        grammar: [g.zung-still]
        vocab: []
      - q: { es: "你屋企人好返未呀？", en: "Is your family member better yet?" }
        a: { es: "好返好多，醫生話就快康復。", en: "Much better; the doctor says they'll soon recover." }
        alt: ["好返啲喇。", "仲未好。"]
        grammar: [g.reported-speech]
        vocab: [w.hong1-fuk6]
    texts:
      - title: "新年計劃"
        es: ["今年我要改變啲壞習慣。", "我要戒煙，仲要減肥。", "希望年尾嘅時候，我會健康啲。"]
        en: ["This year I'm going to change some bad habits.", "I'm going to quit smoking, and lose weight too.", "I hope I'll be healthier by the end of the year."]
        grammar: [g.zung-still, g.hei-mong-hope]
        vocab: [w.goi2-bin3, w.zaap6-gwaan3, w.gaai3-jin1, w.gaam2-fei4]
    spicy:
      - { es: "已經十二點，你仲唔想走？", en: "It's already midnight and you still don't want to leave?", altEs: ["已經十二點喇，你仲唔想走呀？"], grammar: [g.zung-still], vocab: [] }
      - { es: "你今日仲靚過尋日。", en: "You look even better today than yesterday.", altEs: ["你今日仲靚仔過尋日。"], grammar: [g.zung-still, g.adj-gwo-comparison], vocab: [] }
      - { es: "我減緊肥，不過同你食飯就唔計。", en: "I'm on a diet, but dinner with you doesn't count.", altEs: ["我減緊肥，但係同你食飯唔計。"], grammar: [g.gan-progressive], vocab: [w.gaam2-fei4] }
      - { es: "我學車係為咗將來可以揸車接你。", en: "I'm learning to drive so I can pick you up one day.", altEs: ["我學車係為咗將來揸車接你。"], grammar: [g.wai-zo-purpose], vocab: [w.hok6-ce1] }
      - { es: "你嘅廣東話進步咗好多，係咪有人教你？", en: "Your Cantonese has improved so much. Has someone been teaching you?", altEs: ["你嘅廣東話進步咗好多，係唔係有人教你？"], grammar: [g.zo-perfective], vocab: [w.zeon3-bou6] }
  - id: b1.u12.l4
    title: 堅持落去
    teach: [g.hei-mong-hope, g.zung-still]
    vocab: [w.gin1-ci4, w.fong3-hei3, w.sat1-baai6, w.cing1-ceon1, w.sing4-zau6, w.sing4-nok6, w.sat6-jin6, w.zou6-dou2, w.zyun1-sam1, w.jau5-hang4-sam1, w.seon3-sam1, w.soeng4-si3, w.seon6-lei6, w.hau6, w.gei3.b, w.mong4.b]
    tip: "Encouragement: 唔好放棄！ 堅持落去！ 你一定做得到！ Wishes: 希望你考試順利！"
    sentences:
      - { es: "唔好放棄，堅持落去！", en: "Don't give up; keep going!", altEs: ["唔好放棄呀，堅持落去！"], grammar: [g.m-hou-dont], vocab: [w.fong3-hei3, w.gin1-ci4] }
      - { es: "失敗唔緊要，最緊要再試。", en: "Failing doesn't matter; what matters is trying again.", altEs: ["失敗唔緊要，最緊要係再試。"], grammar: [g.zeoi-superlative], vocab: [w.sat1-baai6] }
      - { es: "青春好短，要做自己鍾意嘅嘢。", en: "Youth is short; do what you love.", altEs: ["青春好短，要做自己鍾意做嘅嘢。"], grammar: [g.relative-ge], vocab: [w.cing1-ceon1] }
      - { es: "佢好專心，一定會成功。", en: "She's very focused; she'll definitely succeed.", altEs: ["佢咁專心，一定會成功。"], altEn: ["He's really focused; he's bound to succeed."], grammar: [g.probability], vocab: [w.zyun1-sam1] }
      - { es: "我畀過你嘅承諾，一定會做到。", en: "The promise I made you, I'll definitely keep.", altEs: ["我答應過你嘅嘢，一定會做到。"], grammar: [g.relative-ge], vocab: [w.sing4-nok6, w.zou6-dou2] }
      - { es: "佢好有恆心，學咗十年鋼琴。", en: "He's very persistent; he's been learning the piano for ten years.", altEs: ["佢好有恆心，學咗鋼琴十年。"], altEn: ["She's very persistent; she's studied piano for ten years."], grammar: [g.duration], vocab: [w.jau5-hang4-sam1] }
      - { es: "你要對自己有信心。", en: "You need to believe in yourself.", altEs: ["你要對自己有啲信心。"], grammar: [g.jiu-must-m-sai], vocab: [w.seon3-sam1] }
      - { es: "我想嘗試做啲新嘢。", en: "I want to try doing something new.", altEs: ["我想試吓做啲新嘢。"], grammar: [g.hei-mong-hope], vocab: [w.soeng4-si3] }
      - { es: "希望你考試順利！", en: "Good luck in your exams!", altEs: ["祝你考試順利！"], altEn: ["I hope your exams go well!"], grammar: [g.hei-mong-hope], vocab: [w.seon6-lei6] }
      - { es: "佢三十歲已經有好多成就。", en: "At thirty, she has already achieved a lot.", altEs: ["佢三十歲就已經有好多成就。"], altEn: ["He's only thirty and has already achieved a great deal."], grammar: [g.ji-ging-already], vocab: [w.sing4-zau6] }
      - { es: "堅持落去，夢想總有一日會實現。", en: "Keep going, and one day your dream will come true.", altEs: ["堅持落去，總有一日夢想會實現。"], grammar: [g.wui-will], vocab: [w.gin1-ci4, w.sat6-jin6] }
      - { es: "為咗實現夢想，佢搬咗去英國。", en: "To make her dream come true, she moved to the UK.", altEs: ["佢為咗實現夢想，搬咗去英國。"], altEn: ["He moved to the UK to pursue his dream."], grammar: [g.wai-zo-purpose], vocab: [w.sat6-jin6] }
      - { es: "你做得到㗎，我信你！", en: "You can do it, I believe in you!", altEs: ["你一定做得到，我信你！"], grammar: [g.potential-complements], vocab: [w.zou6-dou2] }
      - { es: "佢仲未放棄，仲日日練習。", en: "She still hasn't given up and practises every day.", altEs: ["佢仲未放棄，仲每日都練習。"], altEn: ["He hasn't given up yet; he still practises every day."], grammar: [g.zung-still], vocab: [w.fong3-hei3], error: { wrong: "佢放棄仲未，仲日日練習。", explain: "仲 goes before the verb (here before 未): 佢仲未放棄.", grammar: g.zung-still } }
      - { es: "佢學鋼琴。", en: "He learns the piano.", altEs: ["佢學彈鋼琴。"], altEn: ["She's learning the piano."], grammar: [g.zung-still], vocab: [w.jau5-hang4-sam1], transform: { instruction: "Say he's *still* learning the piano (仲 + 緊)", answer: "佢仲學緊鋼琴。", alt: ["佢仲喺度學鋼琴。", "佢仲學緊彈鋼琴。"] } }
      - { es: "我想你成功。", en: "I want you to succeed.", altEs: ["我好想你成功。"], grammar: [g.hei-mong-hope], vocab: [], transform: { instruction: "Use 希望 + clause: I hope you succeed", answer: "我希望你成功。", alt: ["希望你成功。"] } }
    exchanges:
      - q: { es: "我好想放棄。", en: "I really want to give up." }
        a: { es: "唔好放棄，仲有希望㗎！", en: "Don't give up; there's still hope!" }
        alt: ["堅持落去啦！", "唔好放棄，你一定做得到！"]
        grammar: [g.m-hou-dont]
        vocab: [w.fong3-hei3, w.hei1-mong6.b]
      - q: { es: "你點解咁有信心？", en: "Why are you so confident?" }
        a: { es: "因為我準備咗好耐。", en: "Because I've been preparing for ages." }
        alt: ["因為我練習咗好耐。", "我都唔知。"]
        grammar: [g.jan-wai-so-ji]
        vocab: [w.seon3-sam1]
      - q: { es: "你考試順唔順利？", en: "Did your exam go well?" }
        a: { es: "幾順利，希望可以合格。", en: "Pretty well; I hope I pass." }
        alt: ["好順利。", "唔係幾順利。"]
        grammar: [g.hei-mong-hope]
        vocab: [w.seon6-lei6]
      - q: { es: "你學鋼琴學咗幾耐？", en: "How long have you been learning the piano?" }
        a: { es: "十年喇，我仲日日練習。", en: "Ten years now, and I still practise every day." }
        alt: ["十年。", "好耐喇。"]
        grammar: [g.zung-still, g.duration]
        vocab: [w.jau5-hang4-sam1]
      - q: { es: "失敗咗點算？", en: "What if I fail?" }
        a: { es: "再試多次囉，失敗唔緊要。", en: "Try again; failing doesn't matter." }
        alt: ["唔緊要，再嚟過。", "再試囉。"]
        grammar: [g.zung-still]
        vocab: [w.sat1-baai6]
    texts:
      - title: "畢業禮致辭"
        es: ["多謝老師同屋企人嘅支持。", "將來可能會失敗，不過我哋唔好放棄。", "希望大家都可以實現自己嘅夢想。"]
        en: ["Thank you to our teachers and families for their support.", "We may fail in the future, but we mustn't give up.", "I hope everyone can make their dreams come true."]
        grammar: [g.hei-mong-hope, g.probability]
        vocab: [w.sat1-baai6, w.fong3-hei3, w.sat6-jin6]
      - title: "畀自己嘅信"
        es: ["十年後嘅我：你仲記唔記得今日嘅夢想？", "希望你仲係咁有信心。", "唔好忘記，青春只有一次。"]
        en: ["To me, ten years from now: do you still remember today's dream?", "I hope you're still this confident.", "Don't forget, you're only young once."]
        grammar: [g.zung-still, g.hei-mong-hope]
        vocab: [w.seon3-sam1, w.cing1-ceon1]
    spicy:
      - { es: "我唔會放棄，你一日唔答應，我一日都約你。", en: "I won't give up: every day you don't say yes, I'll ask you out again.", altEs: ["我唔會放棄㗎，你一日唔答應，我一日都約你。"], grammar: [g.zung-still], vocab: [w.fong3-hei3] }
      - { es: "我對你好有恆心：已經約咗你九次喇。", en: "I'm very persistent with you: I've asked you out nine times already.", altEs: ["我對你真係好有恆心，已經約咗你九次。"], grammar: [g.ji-ging-already], vocab: [w.jau5-hang4-sam1] }
      - { es: "我好有信心，你今晚會覆我。", en: "I'm very confident you'll reply to me tonight.", altEs: ["我好有信心你今晚會覆我。"], grammar: [g.probability], vocab: [w.seon3-sam1] }
      - { es: "嘗試同我約會一次，失敗都唔緊要。", en: "Try going on one date with me; it doesn't matter if it doesn't work out.", altEs: ["試吓同我約會一次，失敗都唔緊要。"], grammar: [g.hei-mong-hope], vocab: [w.soeng4-si3, w.sat1-baai6] }
      - { es: "我嘅承諾：每次飲茶，最後一粒蝦餃都係你嘅。", en: "My promise: every time we have dim sum, the last prawn dumpling is yours.", altEs: ["我嘅承諾係：每次飲茶，最後一粒蝦餃都畀你。"], grammar: [g.ge-possessive], vocab: [w.sing4-nok6] }
dialogues:
  - id: b1.u12.d1
    title: 喺屏山講將來
    context: Si and Chi-ming walk the Ping Shan Heritage Trail and talk about their plans.
    lines:
      - { speaker: 阿詩, es: "終於到聚星樓喇！聽講呢座塔好舊㗎。", en: "We're finally at Tsui Sing Lau! I hear this pagoda is really old." }
      - { speaker: 志明, es: "係呀。我為咗睇佢，由屯門坐輕鐵嚟。", en: "Yes. I came all the way from Tuen Mun on the Light Rail to see it." }
      - { speaker: 阿詩, es: "話時話，你畢業之後打算做乜嘢？", en: "By the way, what are you planning to do after graduating?" }
      - { speaker: 志明, es: "我希望可以去英國讀碩士。", en: "I hope to do a master's in the UK." }
      - { speaker: 阿詩, es: "為咗乜嘢呀？", en: "What for?" }
      - { speaker: 志明, es: "為咗學建築。我嘅夢想係設計好似呢度咁靚嘅建築。", en: "To study architecture. My dream is to design buildings as beautiful as these." }
      - { speaker: 阿詩, es: "好有理想呀！咁你儲夠錢未？", en: "That's ambitious! So have you saved enough money?" }
      - { speaker: 志明, es: "仲未，我仲要做多一年兼職。", en: "Not yet, I still need to work part-time for another year." }
      - { speaker: 阿詩, es: "唔好放棄，你一定做得到。", en: "Don't give up; you can definitely do it." }
      - { speaker: 志明, es: "多謝！你呢？你將來想做乜嘢？", en: "Thanks! And you? What do you want to do in future?" }
      - { speaker: 阿詩, es: "我想創業，喺屏山開一間茶餐廳。", en: "I want to start a business: a cha chaan teng in Ping Shan." }
      - { speaker: 志明, es: "好呀，到時我第一個嚟食！", en: "Great, I'll be your first customer!" }
    questions:
      - { q: "志明點樣嚟屏山？", options: ["坐輕鐵", "揸車", "行路"], answer: 0, explain: "由屯門坐輕鐵嚟: he came from Tuen Mun on the Light Rail." }
      - { q: "志明想去英國做乜嘢？", options: ["讀碩士", "旅行", "搵工"], answer: 0, explain: "我希望可以去英國讀碩士." }
      - { q: "點解志明仲要做兼職？", options: ["佢仲未儲夠錢", "佢鍾意返工", "佢想學建築"], answer: 0, explain: "儲夠錢未？ 仲未: he hasn't saved enough yet." }
      - { q: "阿詩嘅夢想係乜嘢？", options: ["做老師", "開茶餐廳", "環遊世界"], answer: 1, explain: "我想創業，喺屏山開一間茶餐廳." }
