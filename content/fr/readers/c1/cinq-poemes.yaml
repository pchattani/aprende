id: r.c1.cinq-poemes
level: c1
title: "Cinq poèmes : Hugo, Verlaine, Rimbaud"
kind: literature
author: Victor Hugo (1802–1885), Paul Verlaine (1844–1896), Arthur Rimbaud (1854–1891)
source: "Hugo, « Demain, dès l'aube… », Les Contemplations, livre IV (1856) ; Verlaine, « Chanson d'automne », Poèmes saturniens (1866), et « Il pleure dans mon cœur… », Romances sans paroles (1874) ; Rimbaud, « Le Dormeur du val » et « Ma Bohème » (1870), d'après Œuvres de Arthur Rimbaud. Vers et proses, éd. Paterne Berrichon. Domaine public. Poèmes cités en entier d'après les éditions du Projet Gutenberg (n° 29844, 15112, 56708) ; la ligature œ et les accents sur les majuscules sont rétablis."
intro: "Five short poems that every French reader knows, quoted in full; the lines are separated by a slash. The short paragraphs before each poem are editorial introductions written for this course. Notice the future of resolution in Hugo, Verlaine's music of short lines and repeated sounds, and the shock of the last line of Le Dormeur du val."
allow: [sons, verbes, identiques, splendides, fantastiques, élastiques, hugo, verlaine, rimbaud, léopoldine, villequier, harfleur, seine, saturniens, romances, ardennes, charleville, poucet, grande-ourse, muse, contemplations, prusse, poèmes, poème, poète, sonnet, sonnets, harmonie]
paragraphs:
  - { es: "En 1843, Léopoldine, la fille aînée de Victor Hugo, se noie dans la Seine à Villequier, avec son mari, quelques mois après leur mariage. Le poème suivant est daté du 3 septembre 1847, la veille de l'anniversaire de sa mort : le poète s'adresse à sa fille comme à une vivante, et l'on ne comprend qu'à la fin vers quel lieu il marche.", en: "In 1843 Léopoldine, Victor Hugo's eldest daughter, drowned in the Seine at Villequier with her husband, a few months after their wedding. The following poem is dated 3 September 1847, the day before the anniversary of her death: the poet speaks to his daughter as if she were alive, and only at the end do we understand where he is walking to." }
  - { es: "Demain, dès l'aube, à l'heure où blanchit la campagne, / Je partirai. Vois-tu, je sais que tu m'attends. / J'irai par la forêt, j'irai par la montagne. / Je ne puis demeurer loin de toi plus longtemps. / Je marcherai les yeux fixés sur mes pensées, / Sans rien voir au dehors, sans entendre aucun bruit, / Seul, inconnu, le dos courbé, les mains croisées, / Triste, et le jour pour moi sera comme la nuit. / Je ne regarderai ni l'or du soir qui tombe, / Ni les voiles au loin descendant vers Harfleur, / Et, quand j'arriverai, je mettrai sur ta tombe / Un bouquet de houx vert et de bruyère en fleur.", en: "Tomorrow, at dawn, at the hour when the countryside grows pale, / I will set out. You see, I know that you are waiting for me. / I will go through the forest, I will go over the mountain. / I cannot stay far from you any longer. / I will walk with my eyes fixed on my thoughts, / Seeing nothing around me, hearing no sound, / Alone, unknown, my back bent, my hands crossed, / Sad, and the day for me will be like night. / I will look neither at the gold of the falling evening, / Nor at the sails in the distance going down towards Harfleur, / And when I arrive, I will lay on your grave / A bunch of green holly and flowering heather." }
  - { es: "Paul Verlaine voulait que la poésie soit d'abord une musique. Dans « Chanson d'automne », publiée en 1866 dans son premier recueil, les vers très courts et les sons répétés imitent la plainte des violons ; dans « Il pleure dans mon cœur », écrit quelques années plus tard, il joue sur deux verbes presque identiques, pleurer et pleuvoir.", en: "Paul Verlaine wanted poetry to be music above all. In 'Autumn Song', published in 1866 in his first collection, the very short lines and repeated sounds imitate the lament of violins; in 'It weeps in my heart', written a few years later, he plays on two almost identical verbs, pleurer (to weep) and pleuvoir (to rain)." }
  - { es: "CHANSON D'AUTOMNE. Les sanglots longs / Des violons / De l'automne / Blessent mon cœur / D'une langueur / Monotone. / Tout suffocant / Et blême, quand / Sonne l'heure, / Je me souviens / Des jours anciens / Et je pleure ; / Et je m'en vais / Au vent mauvais / Qui m'emporte / Deçà, delà, / Pareil à la / Feuille morte.", en: "AUTUMN SONG. The long sobs / Of the violins / Of autumn / Wound my heart / With a monotonous / Languor. / All breathless / And pale, when / The hour strikes, / I remember / The days of old / And I weep; / And I go off / On the evil wind / That carries me / Here and there, / Like the / Dead leaf." }
  - { es: "Il pleure dans mon cœur / Comme il pleut sur la ville, / Quelle est cette langueur / Qui pénètre mon cœur ? / Ô bruit doux de la pluie / Par terre et sur les toits ! / Pour un cœur qui s'ennuie, / Ô le chant de la pluie ! / Il pleure sans raison / Dans ce cœur qui s'écœure. / Quoi ! nulle trahison ? / Ce deuil est sans raison. / C'est bien la pire peine / De ne savoir pourquoi, / Sans amour et sans haine, / Mon cœur a tant de peine !", en: "It weeps in my heart / As it rains on the town, / What is this languor / That pierces my heart? / Oh, gentle sound of the rain / On the ground and on the roofs! / For a heart that is weary, / Oh, the song of the rain! / It weeps without reason / In this heart that sickens of itself. / What! No betrayal? / This grief has no reason. / It is truly the worst pain / Not to know why, / Without love and without hate, / My heart has so much pain!" }
  - { es: "Arthur Rimbaud avait à peine seize ans quand il écrivit ces deux sonnets, à l'automne 1870, pendant la guerre contre la Prusse. Il s'enfuyait souvent de Charleville, sa ville natale des Ardennes, pour marcher sur les routes. Le premier poème décrit un jeune soldat endormi dans la nature ; le second raconte, avec humour, la vie libre du poète vagabond.", en: "Arthur Rimbaud was barely sixteen when he wrote these two sonnets, in the autumn of 1870, during the war against Prussia. He often ran away from Charleville, his home town in the Ardennes, to walk the roads. The first poem describes a young soldier asleep in the countryside; the second tells, with humour, of the free life of the vagabond poet." }
  - { es: "LE DORMEUR DU VAL. C'est un trou de verdure où chante une rivière / Accrochant follement aux herbes des haillons / D'argent, où le soleil, de la montagne fière, / Luit ; c'est un petit val qui mousse de rayons. / Un soldat jeune, bouche ouverte, tête nue / Et la nuque baignant dans le frais cresson bleu, / Dort : il est étendu dans l'herbe, sous la nue, / Pâle dans son lit vert où la lumière pleut. / Les pieds dans les glaïeuls, il dort. Souriant comme / Sourirait un enfant malade, il fait un somme. / Nature, berce-le chaudement : il a froid ! / Les parfums ne font pas frissonner sa narine ; / Il dort dans le soleil, la main sur sa poitrine / Tranquille. Il a deux trous rouges au côté droit.", en: "THE SLEEPER IN THE VALLEY. It is a green hollow where a river sings, / Madly catching rags of silver / On the grass, where the sun, from the proud mountain, / Shines: it is a little valley foaming with light. / A young soldier, mouth open, head bare, / The nape of his neck bathing in cool blue watercress, / Sleeps: he is stretched out in the grass, under the sky, / Pale in his green bed where the light rains down. / His feet in the gladioli, he sleeps. Smiling as / A sick child would smile, he is taking a nap. / Nature, rock him warmly: he is cold! / The scents do not make his nostril quiver; / He sleeps in the sun, his hand on his chest, / At peace. He has two red holes in his right side." }
  - { es: "MA BOHÈME. Je m'en allais, les poings dans mes poches crevées. / Mon paletot aussi devenait idéal. / J'allais sous le ciel, Muse, et j'étais ton féal : / Oh là là, que d'amours splendides j'ai rêvées ! / Mon unique culotte avait un large trou. / Petit-Poucet rêveur, j'égrenais dans ma course / Des rimes. Mon auberge était à la Grande-Ourse. / Mes étoiles au ciel avaient un doux frou-frou. / Et je les écoutais, assis au bord des routes, / Ces bons soirs de septembre où je sentais des gouttes / De rosée à mon front, comme un vin de vigueur ; / Où, rimant au milieu des ombres fantastiques, / Comme des lyres, je tirais les élastiques / De mes souliers blessés, un pied contre mon cœur !", en: "MY BOHEMIAN LIFE. I went off, fists in my torn pockets. / My overcoat too was becoming ideal. / I walked under the sky, Muse, and I was your faithful one: / Oh my, what splendid loves I dreamed of! / My only pair of trousers had a big hole. / A dreamy Tom Thumb, I scattered rhymes / As I went. My inn was at the Great Bear. / My stars in the sky made a soft rustle. / And I listened to them, sitting by the roadside, / Those fine September evenings when I felt drops / Of dew on my forehead, like a strong wine; / When, rhyming amid fantastic shadows, / Like lyres, I plucked the elastic laces / Of my wounded shoes, one foot against my heart!" }
questions:
  - { q: "À qui le poète s'adresse-t-il dans « Demain, dès l'aube » ?", options: ["À une femme qu'il va épouser", "À sa fille morte, dont il va visiter la tombe", "À un ami qui l'attend en Normandie"], answer: 1, explain: "The last lines reveal it: «je mettrai sur ta tombe / Un bouquet de houx vert». He speaks to Léopoldine as if she were alive." }
  - { q: "Quel temps verbal domine dans le poème de Hugo, et pourquoi ?", options: ["Le passé simple, pour raconter un souvenir", "Le futur simple, pour exprimer une résolution ferme", "L'imparfait, pour décrire une habitude"], answer: 1, explain: "partirai, irai, marcherai, regarderai, mettrai: the future expresses a firm decision; nothing will distract him from his goal." }
  - { q: "Sur quel jeu de mots repose « Il pleure dans mon cœur » ?", options: ["Sur pleurer et pleuvoir", "Sur cœur et chœur", "Sur ville et vie"], answer: 0, explain: "«Il pleure dans mon cœur / Comme il pleut sur la ville»: Verlaine invents an impersonal il pleure, modelled on il pleut." }
  - { q: "Que comprend-on au dernier vers du « Dormeur du val » ?", options: ["Que le soldat rêve", "Que le soldat est mort, tué par deux balles", "Que le soldat est guéri"], answer: 1, explain: "«Il a deux trous rouges au côté droit»: the 'sleeper' is dead; the details (pâle, il a froid, sa narine ne frissonne pas) prepared the shock." }
  - { q: "Comment Rimbaud se présente-t-il dans « Ma Bohème » ?", options: ["Comme un riche voyageur", "Comme un poète vagabond, pauvre mais heureux et libre", "Comme un soldat"], answer: 1, explain: "Torn pockets, one pair of trousers with a hole, worn-out shoes — yet the stars are his inn and he dreams of «amours splendides»." }
