id: r.b2.entrevista-a-elena-roca
level: b2
title: Entrevista a Elena Roca
kind: dialogue
intro: A newspaper interview with a novelist about her new bestseller. She reports what her publisher, her grandmother and the journalists told her, and uses a few idioms along the way.
allow: [elena, roca, quinta, suavizara]
paragraphs:
  - { es: "Periodista: Elena Roca acaba de publicar su quinta novela, un éxito de ventas que ya se traduce a doce idiomas. Elena, bienvenida. Dicen que su editor le pidió que cambiara el final. ¿Es cierto?", en: "Journalist: Elena Roca has just published her fifth novel, a bestseller that is already being translated into twelve languages. Elena, welcome. They say your publisher asked you to change the ending. Is that true?" }
  - { es: "Elena Roca: Es cierto, y no fue la primera vez. Me pidió que lo suavizara, que el lector saliera del libro más tranquilo. Yo le dije que no, que si quería un final feliz, que lo escribiera él. No di mi brazo a torcer y hoy me alegro de que el final sea el que es.", en: "Elena Roca: It's true, and it wasn't the first time. He asked me to soften it, so that the reader would come out of the book feeling calmer. I told him no, that if he wanted a happy ending, he should write it himself. I didn't give in and today I'm glad the ending is what it is." }
  - { es: "Periodista: En una entrevista anterior declaró que ojalá nunca hubiera escrito su primera novela. ¿Lo mantiene?", en: "Journalist: In a previous interview you declared that you wished you had never written your first novel. Do you stand by that?" }
  - { es: "Elena Roca: Lo dije con la boca pequeña, y los periodistas pusieron el grito en el cielo. Lo que quería decir es que, si hubiera esperado unos años, habría escrito un libro mejor. Pero sin aquel primer libro no existirían los otros cuatro, así que no me arrepiento.", en: "Elena Roca: I said it half-heartedly, and the journalists hit the roof. What I meant is that, if I had waited a few years, I would have written a better book. But without that first book the other four wouldn't exist, so I don't regret it." }
  - { es: "Periodista: Hablemos de la nueva novela. La protagonista es una profesora de idiomas que recibe cartas de una persona que no conoce. ¿De dónde salió la idea?", en: "Journalist: Let's talk about the new novel. The protagonist is a language teacher who receives letters from someone she doesn't know. Where did the idea come from?" }
  - { es: "Elena Roca: De mi abuela. Cuando yo era pequeña me contaba que, durante la guerra, su hermano le escribía desde el exilio y que las cartas llegaban abiertas, leídas por la censura. Ella siempre me decía que guardara aquellas cartas y que algún día escribiera sobre ellas. Tardé treinta años en hacerle caso.", en: "Elena Roca: From my grandmother. When I was little she used to tell me that, during the war, her brother wrote to her from exile and that the letters arrived opened, read by the censors. She always told me to keep those letters and to write about them one day. It took me thirty years to listen to her." }
  - { es: "Periodista: Sus personajes hablan mucho y actúan poco. Algunos periodistas dicen que la trama no tiene ni pies ni cabeza.", en: "Journalist: Your characters talk a lot and act little. Some journalists say the plot makes no sense at all." }
  - { es: "Elena Roca: Lo sé, y no voy a echar más leña al fuego. Solo diré que la vida tampoco tiene una trama perfecta. Mis personajes se andan con rodeos porque la gente real se anda con rodeos; nadie dice lo que piensa a la primera. Si quisiera acción, escribiría novelas policíacas.", en: "Elena Roca: I know, and I'm not going to add fuel to the fire. I'll only say that life doesn't have a perfect plot either. My characters beat about the bush because real people beat about the bush; nobody says what they think straight away. If I wanted action, I'd write crime novels." }
  - { es: "Periodista: ¿Qué le aconsejaría a alguien que quiere escribir?", en: "Journalist: What would you advise someone who wants to write?" }
  - { es: "Elena Roca: Que lea mucho más de lo que escribe. Que no publique nada hasta que no lo haya dejado reposar un mes. Y que no haga caso a nadie que le diga que escribir no da dinero… aunque sea verdad.", en: "Elena Roca: To read much more than they write. Not to publish anything until they have let it rest for a month. And not to listen to anyone who tells them that writing doesn't pay… even if it's true." }
  - { es: "Periodista: Última pregunta: ¿qué le diría hoy a la Elena de veinte años?", en: "Journalist: Last question: what would you say today to the twenty-year-old Elena?" }
  - { es: "Elena Roca: Le diría que tuviera paciencia, que la primera novela no tiene que ser perfecta y que, pase lo que pase, no dejara de escribir. Y le pediría que guardara las cartas de la abuela en un sitio mejor que una caja de zapatos.", en: "Elena Roca: I'd tell her to be patient, that the first novel doesn't have to be perfect and that, whatever happens, she shouldn't stop writing. And I'd ask her to keep Grandmother's letters somewhere better than a shoebox." }
questions:
  - { q: "What did Elena's publisher ask her to do?", options: ["Write a longer book", "Soften the ending", "Change the title"], answer: 1 }
  - { q: "Where did the idea for the new novel come from?", options: ["A film she saw", "Letters her grandmother received from her brother in exile", "A news story"], answer: 1 }
  - { q: "How does Elena respond to the criticism that her plot makes no sense?", options: ["She says life has no perfect plot either", "She promises to write more action", "She refuses to answer"], answer: 0 }
  - { q: "What does she advise would-be writers?", options: ["To publish quickly", "To read much more than they write and let their work rest", "To write only crime novels"], answer: 1 }
glossary:
  - { es: suavizar, en: to soften }
  - { es: acción, en: action }
  - { es: a la primera, en: straight away, at the first attempt }
  - { es: reposar, en: to rest, to settle }
