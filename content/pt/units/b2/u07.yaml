id: b2.u07
title: "Fundada pelos portugueses"
lessons:
  - id: b2.u07.l1
    title: "Construído pelos holandeses"
    teach: [g.passive-advanced]
    vocab: [w.forte.n, w.arma, w.povo, w.conquista, w.descobrimento, w.holandês, w.colonizar, w.colonizador, w.indígena, w.aldeia, w.colono, w.expedição, w.coroa, w.caravela, w.muralha, w.restaurar, w.colonização, w.monarquia, w.abolir, w.proclamação, w.invasor, w.invasão, w.fé, w.jesuíta, w.missão, w.reconstruir]
    tip: "Every tense has a passive: foi construído, tinha sido avisado, está sendo restaurado, vem sendo debatido, precisa ser feito. The participle agrees with the subject."
    sentences:
      - { es: "O primeiro forte de Fortaleza foi construído pelos holandeses em 1649.", en: "Fortaleza's first fort was built by the Dutch in 1649.", altEs: ["Em 1649, o primeiro forte de Fortaleza foi construído pelos holandeses.", "O primeiro forte de Fortaleza foi erguido pelos holandeses em 1649."], grammar: [g.passive-advanced, g.passive-ser], vocab: [w.forte.n, w.holandês, w.construir] }
      - { es: "Quando os holandeses foram expulsos, o forte passou a ser controlado pelos portugueses.", en: "When the Dutch were driven out, the fort came to be controlled by the Portuguese.", altEs: ["Quando os holandeses foram expulsos, o forte passou para o controle dos portugueses."], grammar: [g.passive-advanced], vocab: [w.holandês, w.forte.n] }
      - { es: "O Brasil foi colonizado pelos portugueses durante mais de três séculos.", en: "Brazil was colonised by the Portuguese for more than three centuries.", altEs: ["O Brasil foi colonizado por Portugal durante mais de três séculos.", "Durante mais de três séculos, o Brasil foi colonizado pelos portugueses."], altEn: ["Brazil was colonized by the Portuguese for more than three centuries."], grammar: [g.passive-advanced, g.passive-ser], vocab: [w.colonizar] }
      - { es: "Antes da chegada dos colonizadores, estas terras eram habitadas por vários povos indígenas.", en: "Before the colonisers arrived, these lands were inhabited by several indigenous peoples.", altEs: ["Antes de os colonizadores chegarem, estas terras eram habitadas por vários povos indígenas.", "Antes da chegada dos colonizadores, essas terras eram habitadas por vários povos indígenas."], grammar: [g.passive-advanced, g.nominalization], vocab: [w.colonizador, w.povo, w.indígena] }
      - { es: "Muitas aldeias já tinham sido abandonadas quando os primeiros colonos chegaram.", en: "Many villages had already been abandoned when the first settlers arrived.", altEs: ["Quando os primeiros colonos chegaram, muitas aldeias já tinham sido abandonadas."], grammar: [g.passive-advanced, g.pluperfect], vocab: [w.aldeia, w.colono], transform: { instruction: "Make it negative: the villages had NOT yet been abandoned", answer: "Muitas aldeias ainda não tinham sido abandonadas quando os primeiros colonos chegaram.", alt: ["Quando os primeiros colonos chegaram, muitas aldeias ainda não tinham sido abandonadas."] } }
      - { es: "A expedição de Cabral foi enviada pela Coroa portuguesa em 1500.", en: "Cabral's expedition was sent by the Portuguese Crown in 1500.", altEs: ["Em 1500, a expedição de Cabral foi enviada pela Coroa portuguesa.", "A expedição de Cabral foi mandada pela Coroa portuguesa em 1500."], grammar: [g.passive-advanced, g.passive-ser], vocab: [w.expedição, w.coroa] }
      - { es: "Na época dos descobrimentos, as caravelas eram consideradas os navios mais modernos.", en: "In the age of discovery, caravels were considered the most modern ships.", altEs: ["As caravelas eram consideradas os navios mais modernos na época dos descobrimentos."], grammar: [g.passive-advanced, g.superlatives], vocab: [w.caravela, w.descobrimento, w.navio] }
      - { es: "A muralha do forte está sendo restaurada e só vai ser reaberta em março.", en: "The fort's wall is being restored and will only be reopened in March.", altEs: ["A muralha do forte está sendo restaurada e só será reaberta em março."], grammar: [g.passive-advanced], vocab: [w.muralha, w.restaurar], transform: { instruction: "Change to the plural: as muralhas", answer: "As muralhas do forte estão sendo restauradas e só vão ser reabertas em março.", alt: ["As muralhas do forte estão sendo restauradas e só serão reabertas em março."] }, variant: "Portugal: A muralha do forte está a ser restaurada." }
      - { es: "O tema da colonização vem sendo debatido nas escolas há anos.", en: "The subject of colonisation has been debated in schools for years.", altEs: ["Há anos o tema da colonização vem sendo debatido nas escolas.", "O tema da colonização tem sido debatido nas escolas há anos."], grammar: [g.passive-advanced, g.ha-faz-time], vocab: [w.colonização] }
      - { es: "Essa história precisa ser contada também do ponto de vista indígena.", en: "This history also needs to be told from the indigenous point of view.", altEs: ["Essa história também precisa ser contada do ponto de vista indígena.", "Esta história precisa ser contada também do ponto de vista indígena."], grammar: [g.passive-advanced], vocab: [w.indígena], error: { wrong: "Essa história precisa ser contado também do ponto de vista indígena.", explain: "The participle agrees with the subject: história is feminine, so contada.", grammar: g.passive-advanced }, variant: "Portugal: Essa história precisa de ser contada…" }
      - { es: "A monarquia foi abolida em 1889, com a proclamação da República.", en: "The monarchy was abolished in 1889, with the proclamation of the Republic.", altEs: ["Em 1889, com a proclamação da República, a monarquia foi abolida."], grammar: [g.passive-advanced, g.nominalization], vocab: [w.monarquia, w.proclamação, w.abolir] }
      - { es: "Os invasores holandeses foram derrotados depois de mais de vinte anos de guerra.", en: "The Dutch invaders were defeated after more than twenty years of war.", grammar: [g.passive-advanced], vocab: [w.invasor, w.holandês] }
      - { es: "A invasão holandesa ainda é lembrada em Pernambuco e no Ceará.", en: "The Dutch invasion is still remembered in Pernambuco and Ceará.", altEs: ["A invasão holandesa é lembrada até hoje em Pernambuco e no Ceará."], grammar: [g.passive-advanced], vocab: [w.invasão, w.holandês] }
      - { es: "Foram encontradas armas antigas perto da muralha.", en: "Old weapons were found near the wall.", altEs: ["Armas antigas foram encontradas perto da muralha."], grammar: [g.passive-advanced, g.passive-ser], vocab: [w.arma, w.muralha], transform: { instruction: "Say they have been found repeatedly (present perfect passive)", answer: "Têm sido encontradas armas antigas perto da muralha.", alt: ["Armas antigas têm sido encontradas perto da muralha."] } }
      - { es: "A fé católica foi trazida pelos jesuítas, que fundaram missões no interior.", en: "The Catholic faith was brought by the Jesuits, who founded missions inland.", altEs: ["A fé católica foi trazida pelos jesuítas, que criaram missões no interior."], grammar: [g.passive-advanced, g.relative-que-quem], vocab: [w.fé, w.jesuíta, w.missão] }
      - { es: "Os moradores não tinham sido avisados da conquista do forte.", en: "The residents had not been told about the capture of the fort.", altEs: ["Ninguém tinha avisado os moradores da conquista do forte."], grammar: [g.passive-advanced, g.pluperfect], vocab: [w.conquista] }
    exchanges:
      - q: { es: "Quem construiu o primeiro forte daqui?", en: "Who built the first fort here?" }
        a: { es: "Ele foi construído pelos holandeses, em 1649.", en: "It was built by the Dutch, in 1649." }
        alt: ["Foi construído pelos holandeses.", "Os holandeses, em 1649."]
        grammar: [g.passive-advanced]
        vocab: [w.holandês]
      - q: { es: "O museu do forte está aberto?", en: "Is the fort museum open?" }
        a: { es: "Ainda não, ele está sendo restaurado e deve ser reaberto em março.", en: "Not yet, it's being restored and should reopen in March." }
        alt: ["Ainda não, está sendo restaurado.", "Não, está fechado para restauração."]
        grammar: [g.passive-advanced]
        vocab: [w.restaurar]
      - q: { es: "Quando a monarquia foi abolida no Brasil?", en: "When was the monarchy abolished in Brazil?" }
        a: { es: "Em 1889, com a proclamação da República.", en: "In 1889, with the proclamation of the Republic." }
        alt: ["Em 1889.", "Foi abolida em 1889."]
        grammar: [g.passive-advanced, g.nominalization]
        vocab: [w.monarquia, w.abolir, w.proclamação]
      - q: { es: "O que precisa ser feito com a muralha?", en: "What needs to be done with the wall?" }
        a: { es: "Ela precisa ser limpa e protegida da água do mar.", en: "It needs to be cleaned and protected from the seawater." }
        alt: ["Precisa ser limpa e protegida.", "Precisa ser restaurada."]
        grammar: [g.passive-advanced]
        vocab: [w.muralha]
      - q: { es: "Os povos indígenas foram consultados pela Coroa?", en: "Were the indigenous peoples consulted by the Crown?" }
        a: { es: "Nunca. As terras deles foram ocupadas sem nenhuma consulta.", en: "Never. Their lands were occupied without any consultation." }
        alt: ["Não, nunca foram consultados.", "Não, nunca foram ouvidos."]
        grammar: [g.passive-advanced]
        vocab: [w.povo, w.indígena, w.coroa]
    texts:
      - title: "Placa na entrada do forte"
        es: ["Este forte foi construído pelos holandeses em 1649.", "Em 1654, passou a ser controlado pelos portugueses.", "O prédio atual foi reconstruído em pedra no século XIX."]
        en: ["This fort was built by the Dutch in 1649.", "In 1654 it came under Portuguese control.", "The current building was rebuilt in stone in the 19th century."]
        grammar: [g.passive-advanced]
        vocab: [w.holandês, w.reconstruir]
      - title: "Aviso aos visitantes"
        es: ["Atenção: a muralha leste está sendo restaurada.", "As visitas devem ser feitas pelo portão principal.", "Agradecemos a compreensão."]
        en: ["Please note: the east wall is being restored.", "Visits must be made through the main gate.", "Thank you for your understanding."]
        grammar: [g.passive-advanced]
        vocab: [w.muralha, w.restaurar]
    spicy:
      - { es: "Fui conquistado por uma tapioca e por um par de olhos cearenses.", en: "I was won over by a tapioca and a pair of eyes from Ceará.", altEs: ["Fui conquistada por uma tapioca e por um par de olhos cearenses."], grammar: [g.passive-advanced, g.passive-ser], vocab: [w.conquista] }
      - { es: "Esse beijo precisa ser repetido, só para fins históricos.", en: "That kiss needs to be repeated, purely for historical purposes.", altEs: ["Esse beijo precisa ser repetido, apenas para fins históricos."], grammar: [g.passive-advanced], vocab: [] }
      - { es: "Meu coração foi invadido sem aviso, igualzinho ao forte em 1649.", en: "My heart was invaded without warning, just like the fort in 1649.", altEs: ["Meu coração foi invadido sem aviso, igual ao forte em 1649."], grammar: [g.passive-advanced], vocab: [w.invasão] }
      - { es: "A muralha que você construiu em volta do coração está sendo derrubada aos poucos.", en: "The wall you built around your heart is slowly being knocked down.", altEs: ["Aos poucos, a muralha que você construiu em volta do coração está sendo derrubada."], grammar: [g.passive-advanced], vocab: [w.muralha, w.derrubar] }
      - { es: "Nosso primeiro encontro há de ser estudado pelos historiadores.", en: "Our first date is bound to be studied by historians.", altEs: ["Nosso primeiro encontro vai ser estudado pelos historiadores."], grammar: [g.passive-advanced, g.periphrases-modal], vocab: [w.historiador] }
  - id: b2.u07.l2
    title: "Estima-se que…"
    teach: [g.impersonal-expressions]
    vocab: [w.dado, w.estimar, w.agricultor, w.migrar, w.fluxo, w.queda, w.índice, w.cálculo, w.amostra, w.fonte, w.método, w.geração, w.calcular, w.redução, w.registrar, w.ocorrência, w.historiador, w.descendente, w.antepassado, w.migração, w.ocorrer, w.estatística]
    tip: "Formal texts avoid eu and a gente: sabe-se que, estima-se que, acredita-se que, vale lembrar que, cabe ressaltar que, há quem diga que, trata-se de."
    sentences:
      - { es: "Estima-se que mais de dois milhões de pessoas vivam hoje em Fortaleza.", en: "It is estimated that more than two million people live in Fortaleza today.", altEs: ["Estima-se que hoje mais de dois milhões de pessoas vivam em Fortaleza.", "Calcula-se que mais de dois milhões de pessoas vivam hoje em Fortaleza."], grammar: [g.impersonal-expressions, g.subjunctive-doubt], vocab: [w.estimar] }
      - { es: "Sabe-se que muitos agricultores migraram do sertão para a capital durante as grandes secas.", en: "It is known that many farmers migrated from the sertão to the capital during the great droughts.", altEs: ["É sabido que muitos agricultores migraram do sertão para a capital durante as grandes secas."], grammar: [g.impersonal-expressions], vocab: [w.agricultor, w.migrar, w.sertão, w.seca] }
      - { es: "Acredita-se que a seca de 1877 tenha provocado um enorme fluxo de pessoas para o litoral.", en: "It is believed that the drought of 1877 caused a huge flow of people to the coast.", altEs: ["Acredita-se que a seca de 1877 provocou um enorme fluxo de pessoas para o litoral."], grammar: [g.impersonal-expressions, g.subjunctive-perfect], vocab: [w.fluxo, w.seca] }
      - { es: "Segundo os dados mais recentes, observa-se uma queda no índice de pobreza da região.", en: "According to the latest data, a fall in the region's poverty rate can be observed.", altEs: ["De acordo com os dados mais recentes, observa-se uma queda no índice de pobreza da região."], grammar: [g.impersonal-expressions], vocab: [w.dado, w.queda, w.índice, w.pobreza] }
      - { es: "Vale lembrar que esses números são apenas um cálculo aproximado.", en: "It is worth remembering that these figures are only a rough calculation.", altEs: ["Vale lembrar que estes números são apenas um cálculo aproximado."], grammar: [g.impersonal-expressions], vocab: [w.cálculo] }
      - { es: "Cabe ressaltar que a amostra da pesquisa foi pequena.", en: "It should be stressed that the survey sample was small.", altEs: ["Cabe ressaltar que a amostra usada na pesquisa foi pequena."], grammar: [g.impersonal-expressions], vocab: [w.amostra, w.pesquisa] }
      - { es: "Há quem diga que a jangada foi inventada pelos povos indígenas.", en: "Some say that the jangada was invented by the indigenous peoples.", altEs: ["Tem gente que diz que a jangada foi inventada pelos povos indígenas."], grammar: [g.impersonal-expressions, g.passive-advanced], vocab: [w.jangada, w.povo, w.indígena], error: { wrong: "Há quem digam que a jangada foi inventada pelos povos indígenas.", explain: "Há quem takes a singular verb: há quem diga.", grammar: g.impersonal-expressions } }
      - { es: "Convém consultar mais de uma fonte antes de citar qualquer número.", en: "It's advisable to check more than one source before quoting any figure.", altEs: ["É bom consultar mais de uma fonte antes de citar qualquer número."], grammar: [g.impersonal-expressions], vocab: [w.fonte] }
      - { es: "Trata-se de um método simples, usado há gerações pelos pescadores.", en: "It is a simple method, used for generations by fishermen.", altEs: ["É um método simples, usado há gerações pelos pescadores."], grammar: [g.impersonal-expressions, g.ha-faz-time], vocab: [w.método, w.geração, w.pescador] }
      - { es: "Calcula-se que a redução da pesca tenha afetado milhares de famílias.", en: "It is calculated that the reduction in fishing has affected thousands of families.", altEs: ["Calcula-se que a redução da pesca afetou milhares de famílias."], grammar: [g.impersonal-expressions, g.subjunctive-perfect], vocab: [w.calcular, w.redução, w.pesca] }
      - { es: "Registraram-se mais de cem ocorrências na orla durante o feriado.", en: "More than a hundred incidents were recorded on the seafront over the holiday.", altEs: ["Mais de cem ocorrências foram registradas na orla durante o feriado."], grammar: [g.impersonal-expressions, g.se-passive], vocab: [w.registrar, w.ocorrência, w.orla], error: { wrong: "Registrou-se mais de cem ocorrências na orla durante o feriado.", explain: "In the written norm the verb agrees with the plural noun: registraram-se… ocorrências.", grammar: g.impersonal-expressions }, variant: "Portugal: Registaram-se mais de cem ocorrências…" }
      - { es: "Segundo o historiador, muitos cearenses são descendentes de indígenas e de portugueses.", en: "According to the historian, many people from Ceará are descendants of indigenous people and the Portuguese.", altEs: ["De acordo com o historiador, muitos cearenses são descendentes de indígenas e de portugueses."], altEn: ["According to the historian, many people from Ceará are descended from indigenous people and the Portuguese."], grammar: [g.impersonal-expressions], vocab: [w.historiador, w.descendente, w.cearense, w.indígena] }
      - { es: "Nota-se que as novas gerações já não querem pescar como os seus antepassados.", en: "It can be seen that the new generations no longer want to fish like their ancestors.", altEs: ["Nota-se que as novas gerações não querem mais pescar como os seus antepassados."], grammar: [g.impersonal-expressions], vocab: [w.geração, w.antepassado] }
      - { es: "Diz-se que o cearense tem o humor mais afiado do Brasil.", en: "People say that the people of Ceará have the sharpest sense of humour in Brazil.", altEs: ["Dizem que o cearense tem o humor mais afiado do Brasil."], altEn: ["It is said that people from Ceará have the sharpest humour in Brazil."], grammar: [g.impersonal-expressions], vocab: [w.cearense], transform: { instruction: "Start with Há quem diga", answer: "Há quem diga que o cearense tem o humor mais afiado do Brasil." } }
      - { es: "Observa-se que a migração do campo para a cidade ocorreu de forma muito rápida.", en: "It can be seen that migration from the countryside to the city happened very quickly.", altEs: ["Nota-se que a migração do campo para a cidade ocorreu muito rapidamente."], grammar: [g.impersonal-expressions, g.nominalization], vocab: [w.migração, w.ocorrer] }
      - { es: "A gente acha que o turismo cresceu muito.", en: "We think tourism has grown a lot.", grammar: [g.a-gente, g.achar-que], vocab: [w.turismo], transform: { instruction: "Rewrite it in formal impersonal style with Acredita-se", answer: "Acredita-se que o turismo tenha crescido muito.", alt: ["Acredita-se que o turismo cresceu muito."] } }
    exchanges:
      - q: { es: "Quantas pessoas visitam a Praia do Futuro por ano?", en: "How many people visit Praia do Futuro each year?" }
        a: { es: "Não se sabe ao certo, mas estima-se que sejam milhões.", en: "Nobody knows for sure, but it's estimated to be millions." }
        alt: ["Estima-se que sejam milhões.", "Não se sabe ao certo."]
        grammar: [g.impersonal-expressions]
        vocab: [w.estimar]
      - q: { es: "De onde vêm esses dados?", en: "Where does this data come from?" }
        a: { es: "De fontes oficiais: do IBGE e da prefeitura.", en: "From official sources: the IBGE and the city council." }
        alt: ["De fontes oficiais.", "Do IBGE."]
        grammar: [g.impersonal-expressions]
        vocab: [w.fonte]
      - q: { es: "Por que tanta gente migrou para Fortaleza?", en: "Why did so many people migrate to Fortaleza?" }
        a: { es: "Acredita-se que tenha sido por causa das secas no sertão.", en: "It's believed it was because of the droughts in the sertão." }
        alt: ["Por causa das secas.", "Sabe-se que foi por causa das secas no sertão."]
        grammar: [g.impersonal-expressions, g.subjunctive-perfect]
        vocab: [w.migrar]
      - q: { es: "Os seus antepassados eram pescadores?", en: "Were your ancestors fishermen?" }
        a: { es: "Eram, sim. Há quatro gerações a minha família vive do mar.", en: "Yes, they were. My family has lived off the sea for four generations." }
        alt: ["Eram, sim.", "Não, eram agricultores."]
        grammar: [g.ha-faz-time]
        vocab: [w.antepassado, w.geração]
      - q: { es: "Esse método é confiável?", en: "Is this method reliable?" }
        a: { es: "Até certo ponto; convém comparar com outra amostra.", en: "Up to a point; it's advisable to compare it with another sample." }
        alt: ["Até certo ponto.", "Convém comparar com outra amostra."]
        grammar: [g.impersonal-expressions, g.opinion-structures]
        vocab: [w.método, w.amostra]
    texts:
      - title: "Trecho de um relatório"
        es: ["Observa-se, nos últimos anos, uma redução no número de jangadas na orla.", "Acredita-se que isso se deva ao custo da pesca e ao crescimento do turismo.", "Faz-se necessário ouvir os pescadores antes de qualquer decisão."]
        en: ["In recent years, a reduction in the number of jangadas on the seafront has been observed.", "It is believed that this is due to the cost of fishing and the growth of tourism.", "It is necessary to listen to the fishermen before any decision is made."]
        grammar: [g.impersonal-expressions, g.nominalization]
        vocab: [w.redução]
      - title: "Legenda de um gráfico"
        es: ["Fonte: dados da prefeitura.", "Estima-se que o fluxo de visitantes tenha dobrado em dez anos."]
        en: ["Source: city council data.", "It is estimated that the flow of visitors has doubled in ten years."]
        grammar: [g.impersonal-expressions]
        vocab: [w.fonte, w.estimar, w.fluxo]
    spicy:
      - { es: "Estima-se que eu tenha olhado para você umas trinta vezes nesta festa.", en: "It is estimated that I've looked at you about thirty times at this party.", altEs: ["Estima-se que eu tenha olhado pra você umas trinta vezes nesta festa."], grammar: [g.impersonal-expressions, g.subjunctive-perfect], vocab: [w.estimar] }
      - { es: "Há quem diga que forró sem par não vale. Convém não arriscar.", en: "Some say forró without a partner doesn't count. Best not to risk it.", grammar: [g.impersonal-expressions], vocab: [w.forró] }
      - { es: "Segundo as minhas estatísticas, você sorri mais quando eu chego.", en: "According to my statistics, you smile more when I arrive.", altEs: ["Segundo minhas estatísticas, você sorri mais quando eu chego."], grammar: [g.impersonal-expressions], vocab: [w.estatística] }
      - { es: "Vale lembrar que o meu número continua o mesmo.", en: "It's worth remembering that my number is still the same.", altEs: ["Vale lembrar que meu número continua o mesmo."], grammar: [g.impersonal-expressions], vocab: [] }
      - { es: "Trata-se de uma pesquisa séria: preciso de mais uma amostra do seu beijo.", en: "This is serious research: I need one more sample of your kiss.", grammar: [g.impersonal-expressions], vocab: [w.amostra] }
  - id: b2.u07.l3
    title: "A Terra da Luz"
    teach: [g.nominalization]
    vocab: [w.abolição, w.engenho, w.cana-de-açúcar, w.resistência, w.quilombola, w.quilombo, w.alforria, w.realização, w.assembleia, w.heroico, w.insígnia, w.escravizado, w.restauração]
    tip: "Formal style turns clauses into nouns: depois que a família real chegou → após a chegada da família real; porque os preços aumentaram → devido ao aumento dos preços."
    sentences:
      - { es: "O Ceará aboliu a escravidão em 1884, quatro anos antes do resto do Brasil.", en: "Ceará abolished slavery in 1884, four years before the rest of Brazil.", altEs: ["Em 1884, o Ceará aboliu a escravidão, quatro anos antes do resto do Brasil."], grammar: [g.preterite-regular, g.dates-years], vocab: [w.abolir, w.escravidão], transform: { instruction: "Start with the noun: A abolição…", answer: "A abolição da escravidão no Ceará ocorreu em 1884, quatro anos antes do resto do Brasil.", alt: ["A abolição da escravidão no Ceará aconteceu em 1884, quatro anos antes do resto do Brasil."] } }
      - { es: "Após a abolição, o Ceará passou a ser chamado de Terra da Luz.", en: "After abolition, Ceará came to be called the Land of Light.", altEs: ["Depois da abolição, o Ceará passou a ser chamado de Terra da Luz."], grammar: [g.nominalization, g.passive-advanced], vocab: [w.abolição] }
      - { es: "A greve dos jangadeiros em 1881 foi decisiva para o fim da escravidão no estado.", en: "The jangada men's strike in 1881 was decisive for the end of slavery in the state.", grammar: [g.nominalization], vocab: [w.jangadeiro, w.greve, w.escravidão] }
      - { es: "Com a construção dos engenhos, a cana-de-açúcar tomou conta do litoral.", en: "With the building of the sugar mills, sugar cane took over the coast.", altEs: ["Com a construção de engenhos, a cana-de-açúcar tomou conta do litoral."], grammar: [g.nominalization], vocab: [w.engenho, w.cana-de-açúcar, w.construção] }
      - { es: "A resistência dos quilombolas de Palmares durou quase um século.", en: "The resistance of the people of the Palmares quilombo lasted almost a century.", grammar: [g.nominalization], vocab: [w.resistência, w.quilombola] }
      - { es: "Fugir para um quilombo era uma forma de resistência.", en: "Escaping to a quilombo was a form of resistance.", altEs: ["A fuga para um quilombo era uma forma de resistência."], grammar: [g.nominalization], vocab: [w.quilombo, w.resistência] }
      - { es: "A compra da alforria podia custar uma vida inteira de trabalho.", en: "Buying one's freedom could cost a whole lifetime of work.", grammar: [g.nominalization], vocab: [w.alforria] }
      - { es: "Devido ao aumento do preço do açúcar, os engenhos se multiplicaram.", en: "Owing to the rise in the price of sugar, the sugar mills multiplied.", altEs: ["Por causa do aumento do preço do açúcar, os engenhos se multiplicaram."], grammar: [g.nominalization, g.connectors-cause-consequence], vocab: [w.aumento, w.engenho], transform: { instruction: "Use a verb instead of the noun: Porque o preço do açúcar…", answer: "Porque o preço do açúcar aumentou, os engenhos se multiplicaram.", alt: ["Como o preço do açúcar aumentou, os engenhos se multiplicaram."] } }
      - { es: "A realização da assembleia foi adiada por causa da chuva.", en: "The holding of the assembly was postponed because of the rain.", altEs: ["A assembleia foi adiada por causa da chuva."], grammar: [g.nominalization, g.passive-advanced], vocab: [w.realização, w.assembleia, w.adiar] }
      - { es: "A chegada da notícia provocou festas nas ruas de Fortaleza.", en: "The arrival of the news set off celebrations in the streets of Fortaleza.", altEs: ["A chegada da notícia provocou festa nas ruas de Fortaleza."], grammar: [g.nominalization], vocab: [w.chegada, w.notícia] }
      - { es: "O gesto dos jangadeiros é lembrado até hoje como heroico.", en: "The jangada men's gesture is still remembered as heroic.", altEs: ["Até hoje, o gesto dos jangadeiros é lembrado como heroico."], grammar: [g.passive-advanced], vocab: [w.heroico, w.jangadeiro] }
      - { es: "O Dragão do Mar é considerado um herói do povo cearense.", en: "The Dragão do Mar is considered a hero of the people of Ceará.", grammar: [g.passive-advanced], vocab: [w.herói, w.povo, w.cearense], note: "Dragão do Mar (Sea Dragon) was the nickname of Francisco José do Nascimento, the jangada man who led the 1881 strike." }
      - { es: "A decisão foi tomada após uma longa discussão.", en: "The decision was taken after a long discussion.", grammar: [g.nominalization, g.passive-advanced], vocab: [w.decisão, w.discussão], error: { wrong: "A decisão foi tomado após uma longa discussão.", explain: "decisão is feminine (all nouns in -ção are), so the participle is tomada.", grammar: g.nominalization } }
      - { es: "Depois que a família real chegou, o Rio mudou muito.", en: "After the royal family arrived, Rio changed a lot.", grammar: [g.antes-depois-de, g.preterite-regular], vocab: [], transform: { instruction: "Use a noun: Após a chegada…", answer: "Após a chegada da família real, o Rio mudou muito.", alt: ["Depois da chegada da família real, o Rio mudou muito."] } }
      - { es: "No uniforme dos guias aparece a insígnia do museu.", en: "The museum's badge appears on the guides' uniform.", altEs: ["A insígnia do museu aparece no uniforme dos guias."], grammar: [g.nominalization], vocab: [w.insígnia] }
      - { es: "A mudança de nome da cidade não agradou a todos.", en: "The change of the city's name did not please everyone.", grammar: [g.nominalization], vocab: [w.mudança] }
    exchanges:
      - q: { es: "Por que o Ceará é chamado de Terra da Luz?", en: "Why is Ceará called the Land of Light?" }
        a: { es: "Por causa da abolição precoce da escravidão, em 1884.", en: "Because of the early abolition of slavery, in 1884." }
        alt: ["Por causa da abolição, em 1884.", "Porque aboliu a escravidão antes do resto do Brasil."]
        grammar: [g.nominalization]
        vocab: [w.abolição]
      - q: { es: "O que foi a greve de 1881?", en: "What was the 1881 strike?" }
        a: { es: "Foi a recusa dos jangadeiros em levar escravizados até os navios.", en: "It was the jangada men's refusal to take enslaved people out to the ships." }
        alt: ["Os jangadeiros se recusaram a levar escravizados até os navios."]
        grammar: [g.nominalization]
        vocab: [w.escravizado]
      - q: { es: "O que era um quilombo?", en: "What was a quilombo?" }
        a: { es: "Uma comunidade formada por pessoas que fugiam da escravidão.", en: "A community formed by people escaping slavery." }
        alt: ["Uma comunidade de pessoas que fugiam da escravidão."]
        grammar: [g.relative-que-quem]
        vocab: [w.quilombo]
      - q: { es: "Quando vai ser a assembleia?", en: "When is the assembly going to be?" }
        a: { es: "A realização foi adiada para depois do feriado.", en: "It has been postponed until after the holiday." }
        alt: ["Foi adiada para depois do feriado.", "Ainda não se sabe."]
        grammar: [g.nominalization, g.passive-advanced]
        vocab: [w.assembleia, w.realização]
    texts:
      - title: "Linha do tempo"
        es: ["1881: greve dos jangadeiros no porto de Fortaleza.", "1884: abolição da escravidão no Ceará.", "1888: assinatura da Lei Áurea e fim da escravidão no Brasil."]
        en: ["1881: the jangada men's strike in the port of Fortaleza.", "1884: abolition of slavery in Ceará.", "1888: signing of the Golden Law and the end of slavery in Brazil."]
        grammar: [g.nominalization]
        vocab: [w.abolição]
      - title: "Legenda de exposição"
        es: ["Jangada do século XIX.", "Após a sua restauração, foi doada ao museu por uma família de pescadores."]
        en: ["Nineteenth-century jangada.", "After its restoration, it was donated to the museum by a family of fishermen."]
        grammar: [g.nominalization, g.passive-advanced]
        vocab: [w.restauração]
    spicy:
      - { es: "A sua chegada à festa provocou uma queda geral de concentração.", en: "Your arrival at the party caused a general drop in concentration.", altEs: ["Sua chegada à festa provocou uma queda geral de concentração."], grammar: [g.nominalization], vocab: [w.chegada, w.queda] }
      - { es: "Após uma longa análise, concluí que o problema é a sua beleza.", en: "After a long analysis, I concluded that the problem is your beauty.", altEs: ["Depois de uma longa análise, concluí que o problema é a sua beleza."], grammar: [g.nominalization], vocab: [w.análise, w.beleza] }
      - { es: "A sua resistência ao meu charme está com os dias contados.", en: "Your resistance to my charm is on its last legs.", altEs: ["Sua resistência ao meu charme está com os dias contados."], grammar: [g.nominalization], vocab: [w.resistência] }
      - { es: "A realização deste jantar exigiu meses de coragem.", en: "Making this dinner happen took months of courage.", grammar: [g.nominalization], vocab: [w.realização] }
      - { es: "Exijo a abolição imediata dessa distância entre nós.", en: "I demand the immediate abolition of this distance between us.", grammar: [g.nominalization], vocab: [w.abolição] }
  - id: b2.u07.l4
    title: "Patrimônio tombado"
    teach: [g.passive-advanced, g.nominalization]
    vocab: [w.tombar, w.demolir, w.capela, w.convento, w.azulejo, w.farol, w.preservação, w.ruína, w.fóssil, w.escavação, w.arqueólogo, w.documentar, w.arqueologia, w.medieval, w.mosteiro, w.antiguidade, w.contemporâneo, w.civilização, w.milênio, w.preservar]
    tip: "Tombado = listed (protected by law). Notices and guides mix passives and nouns: O prédio foi tombado em 1964. A restauração está sendo feita pelo IPHAN."
    sentences:
      - { es: "O Theatro José de Alencar foi inaugurado em 1910 e tombado pelo patrimônio histórico décadas depois.", en: "The José de Alencar Theatre opened in 1910 and was listed as a heritage building decades later.", altEs: ["O Theatro José de Alencar foi inaugurado em 1910 e, décadas depois, foi tombado pelo patrimônio histórico."], grammar: [g.passive-advanced], vocab: [w.tombar, w.inaugurar, w.patrimônio] }
      - { es: "Um prédio tombado não pode ser demolido nem alterado sem autorização.", en: "A listed building cannot be demolished or altered without permission.", altEs: ["Um prédio tombado não pode ser derrubado nem alterado sem autorização."], grammar: [g.passive-advanced], vocab: [w.tombar, w.demolir] }
      - { es: "A capela do antigo convento está sendo restaurada por uma equipe de especialistas.", en: "The chapel of the old convent is being restored by a team of specialists.", altEs: ["Uma equipe de especialistas está restaurando a capela do antigo convento."], grammar: [g.passive-advanced], vocab: [w.capela, w.convento, w.restaurar], variant: "Portugal: está a ser restaurada por uma equipa de especialistas." }
      - { es: "Os azulejos da fachada tinham sido roubados antes da restauração.", en: "The tiles on the façade had been stolen before the restoration.", altEs: ["Antes da restauração, os azulejos da fachada tinham sido roubados."], grammar: [g.passive-advanced, g.nominalization], vocab: [w.azulejo, w.restauração] }
      - { es: "O antigo farol do Mucuripe foi transformado em museu.", en: "The old Mucuripe lighthouse was turned into a museum.", grammar: [g.passive-advanced], vocab: [w.farol], transform: { instruction: "Say it is being turned into a museum right now", answer: "O antigo farol do Mucuripe está sendo transformado em museu." } }
      - { es: "A preservação das ruínas deve ser garantida pelo município.", en: "The preservation of the ruins must be guaranteed by the municipality.", altEs: ["O município deve garantir a preservação das ruínas."], grammar: [g.passive-advanced, g.nominalization], vocab: [w.preservação, w.ruína] }
      - { es: "Na Chapada do Araripe, no sul do Ceará, foram encontrados fósseis com mais de cem milhões de anos.", en: "In the Chapada do Araripe, in the south of Ceará, fossils more than a hundred million years old have been found.", altEs: ["Foram encontrados fósseis com mais de cem milhões de anos na Chapada do Araripe, no sul do Ceará."], grammar: [g.passive-advanced], vocab: [w.fóssil] }
      - { es: "A escavação está sendo acompanhada por arqueólogos da universidade.", en: "The excavation is being supervised by archaeologists from the university.", altEs: ["Arqueólogos da universidade estão acompanhando a escavação."], grammar: [g.passive-advanced, g.nominalization], vocab: [w.escavação, w.arqueólogo] }
      - { es: "Cada objeto encontrado precisa ser fotografado e documentado.", en: "Every object found needs to be photographed and documented.", altEs: ["Cada objeto encontrado tem de ser fotografado e documentado."], grammar: [g.passive-advanced], vocab: [w.documentar], transform: { instruction: "Change to the plural: Todos os objetos…", answer: "Todos os objetos encontrados precisam ser fotografados e documentados." } }
      - { es: "A arqueologia mostra que esta região é habitada há milhares de anos.", en: "Archaeology shows that this region has been inhabited for thousands of years.", grammar: [g.passive-advanced, g.ha-faz-time], vocab: [w.arqueologia] }
      - { es: "No Brasil não há castelos medievais, mas há fortes e mosteiros coloniais.", en: "In Brazil there are no medieval castles, but there are colonial forts and monasteries.", altEs: ["No Brasil não existem castelos medievais, mas existem fortes e mosteiros coloniais."], grammar: [g.tem-there-is], vocab: [w.medieval, w.mosteiro, w.colonial] }
      - { es: "O museu reúne peças da Antiguidade e obras de artistas contemporâneos.", en: "The museum brings together pieces from Antiquity and works by contemporary artists.", grammar: [g.nominalization], vocab: [w.antiguidade, w.contemporâneo] }
      - { es: "Essas pedras foram deixadas por uma civilização que viveu aqui há mais de um milênio.", en: "These stones were left by a civilisation that lived here more than a millennium ago.", grammar: [g.passive-advanced, g.ha-faz-time], vocab: [w.civilização, w.milênio], variant: "Portugal: milénio." }
      - { es: "O convento foi preservado; o mosteiro, infelizmente, virou ruína.", en: "The convent was preserved; the monastery, unfortunately, fell into ruin.", grammar: [g.passive-advanced], vocab: [w.preservar, w.convento, w.mosteiro, w.ruína], error: { wrong: "O convento foi preservada; o mosteiro, infelizmente, virou ruína.", explain: "The participle agrees with convento (masculine singular): preservado.", grammar: g.passive-advanced } }
      - { es: "As obras na praça terão sido concluídas antes do Carnaval?", en: "Will the works in the square have been finished before Carnival?", altEs: ["As obras na praça vão estar concluídas antes do Carnaval?"], grammar: [g.passive-advanced, g.future-perfect], vocab: [] }
    exchanges:
      - q: { es: "Esse casarão pode ser demolido?", en: "Can this mansion be demolished?" }
        a: { es: "Não pode: ele foi tombado em 1980.", en: "It can't: it was listed in 1980." }
        alt: ["Não, ele é tombado.", "Não, foi tombado."]
        grammar: [g.passive-advanced]
        vocab: [w.tombar, w.casarão, w.demolir]
      - q: { es: "Quem está fazendo a restauração da capela?", en: "Who is doing the restoration of the chapel?" }
        a: { es: "Ela está sendo feita por uma equipe da universidade.", en: "It's being done by a team from the university." }
        alt: ["Uma equipe da universidade.", "Está sendo feita pela universidade."]
        grammar: [g.passive-advanced, g.nominalization]
        vocab: [w.restauração, w.capela]
      - q: { es: "O que foi encontrado na escavação?", en: "What was found in the excavation?" }
        a: { es: "Foram encontrados restos de cerâmica e alguns fósseis.", en: "Fragments of pottery and a few fossils were found." }
        alt: ["Alguns fósseis.", "Restos de cerâmica e fósseis."]
        grammar: [g.passive-advanced]
        vocab: [w.escavação, w.fóssil]
      - q: { es: "Dá para visitar o farol?", en: "Can you visit the lighthouse?" }
        a: { es: "Dá, mas a subida precisa ser agendada.", en: "Yes, but the climb has to be booked in advance." }
        alt: ["Dá, sim.", "Precisa ser agendada antes."]
        grammar: [g.passive-advanced, g.nominalization]
        vocab: [w.farol]
      - q: { es: "Por que esses azulejos são tão importantes?", en: "Why are these tiles so important?" }
        a: { es: "Porque foram trazidos de Portugal no século XIX.", en: "Because they were brought from Portugal in the 19th century." }
        alt: ["Foram trazidos de Portugal.", "Porque são do século XIX."]
        grammar: [g.passive-advanced]
        vocab: [w.azulejo]
    texts:
      - title: "Placa de obra"
        es: ["Este prédio está sendo restaurado.", "As obras são acompanhadas pelo IPHAN.", "Previsão de conclusão: dezembro."]
        en: ["This building is being restored.", "The works are being supervised by IPHAN.", "Expected completion: December."]
        grammar: [g.passive-advanced, g.nominalization]
        vocab: [w.restaurar]
      - title: "Guia de bolso"
        es: ["O Theatro José de Alencar foi inaugurado em 1910.", "A estrutura de ferro foi trazida da Escócia.", "Hoje o teatro é tombado e recebe espetáculos quase todas as noites."]
        en: ["The José de Alencar Theatre opened in 1910.", "Its iron structure was brought from Scotland.", "Today the theatre is listed and hosts shows almost every night."]
        grammar: [g.passive-advanced]
        vocab: [w.tombar]
    spicy:
      - { es: "Você devia ser tombado pelo patrimônio histórico.", en: "You should be listed as a national heritage site.", altEs: ["Você devia ser tombada pelo patrimônio histórico.", "Você deveria ser tombado pelo patrimônio histórico."], grammar: [g.passive-advanced, g.deveria-ter], vocab: [w.tombar] }
      - { es: "Esse sorriso precisa ser preservado para as próximas gerações.", en: "That smile needs to be preserved for future generations.", grammar: [g.passive-advanced], vocab: [w.preservar, w.geração] }
      - { es: "Fui escavar o passado e encontrei o seu número antigo. Ainda funciona?", en: "I went digging into the past and found your old number. Does it still work?", grammar: [g.nominalization], vocab: [] }
      - { es: "A nossa história ainda está sendo escrita, mas o primeiro capítulo foi ótimo.", en: "Our story is still being written, but the first chapter was great.", altEs: ["Nossa história ainda está sendo escrita, mas o primeiro capítulo foi ótimo."], grammar: [g.passive-advanced], vocab: [] }
      - { es: "Não sou ruína, sou patrimônio. Me trate com cuidado.", en: "I'm not a ruin, I'm heritage. Handle me with care.", altEs: ["Não sou ruína, sou patrimônio. Trate-me com cuidado."], grammar: [g.passive-advanced, g.imperative-formal], vocab: [w.ruína, w.patrimônio] }
dialogues:
  - id: b2.u07.d1
    title: "Visita guiada na Fortaleza"
    context: "Leo joins a guided tour of the old fort that gave Fortaleza its name. The guide, Socorro, mixes history with a few corrections from a visitor."
    lines:
      - { speaker: "Socorro", es: "Bem-vindos! Este forte foi construído pelos holandeses em 1649, mas o nome atual foi dado pelos portugueses.", en: "Welcome! This fort was built by the Dutch in 1649, but its current name was given by the Portuguese." }
      - { speaker: "Leo", es: "E a cidade nasceu ao redor dele?", en: "And the city grew up around it?" }
      - { speaker: "Socorro", es: "Isso. Sabe-se que a vila só foi criada oficialmente em 1726.", en: "That's right. We know the town was only officially created in 1726." }
      - { speaker: "Leo", es: "E esta muralha é a original?", en: "And is this wall the original one?" }
      - { speaker: "Socorro", es: "Não. Ela foi reconstruída em pedra no século XIX e agora está sendo restaurada.", en: "No. It was rebuilt in stone in the 19th century and is now being restored." }
      - { speaker: "Visitante", es: "Vale lembrar que antes disso tudo aqui já viviam povos indígenas, né?", en: "It's worth remembering that indigenous peoples already lived here before all that, right?" }
      - { speaker: "Socorro", es: "Com certeza. Essa parte da história precisa ser contada com mais cuidado.", en: "Absolutely. That part of the story needs to be told with more care." }
      - { speaker: "Leo", es: "E aquela exposição sobre a abolição?", en: "And that exhibition about abolition?" }
      - { speaker: "Socorro", es: "Trata-se da greve dos jangadeiros de 1881. Após a abolição, em 1884, o Ceará ficou conhecido como Terra da Luz.", en: "It's about the jangada men's strike of 1881. After abolition in 1884, Ceará became known as the Land of Light." }
      - { speaker: "Leo", es: "Que história! Pode ser fotografada a exposição?", en: "What a story! Can the exhibition be photographed?" }
      - { speaker: "Socorro", es: "Pode, mas sem flash, por favor.", en: "Yes, but without flash, please." }
    questions:
      - { q: "Quem construiu o forte?", options: ["Os portugueses", "Os holandeses", "Os jesuítas"], answer: 1, explain: "Socorro says it was built by the Dutch in 1649; the Portuguese gave it its current name." }
      - { q: "O que está acontecendo com a muralha agora?", options: ["Está sendo restaurada.", "Está sendo demolida.", "Foi fechada para sempre."], answer: 0, explain: "It was rebuilt in the 19th century and is now being restored (está sendo restaurada)." }
      - { q: "Segundo o visitante, quem vivia ali antes do forte?", options: ["Colonos portugueses", "Pescadores holandeses", "Povos indígenas"], answer: 2, explain: "The visitor points out that indigenous peoples already lived there." }
      - { q: "Por que o Ceará ficou conhecido como Terra da Luz?", options: ["Por causa do sol forte", "Por causa da abolição de 1884", "Por causa do farol"], answer: 1, explain: "After abolishing slavery in 1884, Ceará became known as the Land of Light." }
