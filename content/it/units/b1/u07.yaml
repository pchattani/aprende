id: b1.u07
title: "Prima che sia troppo tardi"
lessons:
  - id: b1.u07.l1
    title: Purché non nevichi
    teach: [g.congiuntivo-conjunctions]
    vocab: [w.affinché, w.purché, w.a-condizione-che, w.a-meno-che, w.in-modo-che, w.nel-caso-che, w.alpi, w.dolomiti, w.rifugio, w.sci, w.sciatore, w.funivia, w.seggiovia, w.pista, w.vetta, w.attrezzatura, w.scarponi, w.alpino, w.valle, w.ghiacciaio, w.scopo, w.prudente, w.imprudente, w.alpinista, w.cioccolata]
    tip: "Purpose (affinché, perché 'so that') and condition (purché, a condizione che, a meno che, nel caso che) always take the congiuntivo: Vengo purché tu guidi piano."
    sentences:
      - { es: "Prendiamo la funivia, purché non ci sia troppa gente.", en: "Let's take the cable car, provided there aren't too many people.", altEs: ["Prendiamo la funivia, a condizione che non ci sia troppa gente.", "Prendiamo la funivia purché non ci sia troppa gente."], altEn: ["We'll take the cable car, as long as there aren't too many people."], grammar: [g.congiuntivo-conjunctions], vocab: [w.funivia, w.purché] }
      - { es: "Ti presto i miei scarponi affinché tu possa venire con noi.", en: "I'll lend you my boots so that you can come with us.", altEs: ["Ti presto i miei scarponi perché tu possa venire con noi.", "Ti presto gli scarponi affinché tu possa venire con noi."], grammar: [g.congiuntivo-conjunctions], vocab: [w.scarponi, w.affinché] }
      - { es: "Saliamo in vetta, a meno che non cambi il tempo.", en: "We'll climb to the summit, unless the weather changes.", altEs: ["Saliamo in vetta, a meno che il tempo non cambi.", "Saliamo sulla vetta, a meno che non cambi il tempo."], altEn: ["We're going up to the summit, unless the weather changes."], grammar: [g.congiuntivo-conjunctions], vocab: [w.vetta, w.a-meno-che] }
      - { es: "La guida parla piano affinché tutti la capiscano.", en: "The guide speaks slowly so that everyone understands her.", altEs: ["La guida parla piano perché tutti la capiscano.", "La guida parla lentamente affinché tutti la capiscano."], grammar: [g.congiuntivo-conjunctions], vocab: [w.affinché], error: { wrong: "La guida parla piano affinché tutti la capiscono.", explain: "affinché (so that) always takes the congiuntivo: capiscano, not capiscono.", grammar: g.congiuntivo-conjunctions } }
      - { es: "Ti lascio il mio numero nel caso che tu abbia bisogno di aiuto.", en: "I'll leave you my number in case you need help.", altEs: ["Ti lascio il mio numero nel caso tu abbia bisogno di aiuto.", "Ti do il mio numero nel caso che tu abbia bisogno di aiuto."], grammar: [g.congiuntivo-conjunctions], vocab: [w.nel-caso-che] }
      - { es: "Può noleggiare gli sci a condizione che lasci un documento.", en: "You can rent the skis on condition that you leave an ID.", altEs: ["Lei può noleggiare gli sci a condizione che lasci un documento.", "Può noleggiare gli sci purché lasci un documento."], altEn: ["You can hire the skis on condition that you leave an ID."], grammar: [g.congiuntivo-conjunctions, g.tu-vs-lei], vocab: [w.sci, w.a-condizione-che] }
      - { es: "Il maestro spiega le regole in modo che nessuno si faccia male.", en: "The instructor explains the rules so that nobody gets hurt.", altEs: ["Il maestro di sci spiega le regole in modo che nessuno si faccia male.", "Il maestro spiega le regole affinché nessuno si faccia male."], grammar: [g.congiuntivo-conjunctions], vocab: [w.in-modo-che] }
      - { es: "Non salite sul ghiacciaio, a meno che non siate con una guida alpina.", en: "Don't go up onto the glacier unless you're with an alpine guide.", altEs: ["Non salite sul ghiacciaio a meno che non siate con una guida alpina."], grammar: [g.congiuntivo-conjunctions, g.imperativo-negative], vocab: [w.ghiacciaio, w.alpino, w.a-meno-che] }
      - { es: "Vengo anch'io, purché la pista non sia nera!", en: "I'll come too, provided the slope isn't a black run!", altEs: ["Vengo anche io, purché la pista non sia nera!", "Vengo anch'io, a condizione che la pista non sia nera!"], grammar: [g.congiuntivo-conjunctions], vocab: [w.pista, w.purché] }
      - { es: "Ti accompagno al rifugio purché tu guidi piano.", en: "I'll come with you to the mountain hut provided you drive slowly.", altEs: ["Ti accompagno al rifugio a condizione che tu guidi piano."], grammar: [g.congiuntivo-conjunctions], vocab: [w.rifugio, w.purché], transform: { instruction: "Change 'tu' to 'voi'", answer: "Vi accompagno al rifugio purché guidiate piano.", alt: ["Vi accompagno al rifugio purché voi guidiate piano."], en: "I'll come with you (all) to the mountain hut provided you drive slowly." } }
      - { es: "Non essere imprudente: porta l'attrezzatura giusta, nel caso che il tempo cambi.", en: "Don't be reckless: bring the right equipment, in case the weather changes.", altEs: ["Non essere imprudente: porta l'attrezzatura giusta nel caso che il tempo cambi.", "Non essere imprudente: porta l'attrezzatura giusta, nel caso cambi il tempo."], grammar: [g.congiuntivo-conjunctions, g.imperativo-negative], vocab: [w.imprudente, w.attrezzatura, w.nel-caso-che] }
      - { es: "Dormiamo in un rifugio, in modo che domani possiamo partire presto.", en: "We're sleeping in a mountain hut so that tomorrow we can set off early.", altEs: ["Dormiamo in rifugio, in modo che domani possiamo partire presto.", "Dormiamo in un rifugio affinché domani possiamo partire presto."], grammar: [g.congiuntivo-conjunctions], vocab: [w.rifugio, w.in-modo-che] }
      - { es: "Torniamo a valle in funivia, a meno che non vogliate camminare due ore.", en: "We'll go back down to the valley by cable car, unless you want to walk for two hours.", altEs: ["Torniamo a valle con la funivia, a meno che non vogliate camminare due ore."], grammar: [g.congiuntivo-conjunctions], vocab: [w.valle, w.funivia], transform: { instruction: "Change 'voi' to 'tu'", answer: "Torniamo a valle in funivia, a meno che tu non voglia camminare due ore.", alt: ["Torniamo a valle in funivia, a meno che non voglia camminare due ore."], en: "We'll go back down to the valley by cable car, unless you want to walk for two hours." } }
      - { es: "Il rifugio resta aperto affinché gli sciatori possano mangiare qualcosa di caldo.", en: "The hut stays open so that skiers can eat something hot.", altEs: ["Il rifugio rimane aperto affinché gli sciatori possano mangiare qualcosa di caldo.", "Il rifugio resta aperto perché gli sciatori possano mangiare qualcosa di caldo."], grammar: [g.congiuntivo-conjunctions], vocab: [w.sciatore, w.rifugio] }
      - { es: "Qual è lo scopo di questa escursione? — Vedere le Dolomiti dall'alto.", en: "What's the aim of this hike? — To see the Dolomites from above.", altEs: ["Qual è lo scopo dell'escursione? — Vedere le Dolomiti dall'alto."], grammar: [g.question-words], vocab: [w.scopo, w.dolomiti] }
      - { es: "Sulle Alpi un alpinista prudente non parte a meno che il meteo non sia buono.", en: "In the Alps a careful climber doesn't set off unless the forecast is good.", altEs: ["Sulle Alpi un alpinista prudente non parte, a meno che il meteo non sia buono."], grammar: [g.congiuntivo-conjunctions], vocab: [w.prudente, w.alpi, w.a-meno-che], transform: { instruction: "Make it plural: 'careful climbers'", answer: "Sulle Alpi gli alpinisti prudenti non partono a meno che il meteo non sia buono.", alt: ["Sulle Alpi gli alpinisti prudenti non partono, a meno che il meteo non sia buono."], en: "In the Alps careful climbers don't set off unless the forecast is good." } }
    exchanges:
      - q: { es: "Vieni a sciare domani?", en: "Are you coming skiing tomorrow?" }
        a: { es: "Sì, purché non faccia troppo freddo.", en: "Yes, provided it's not too cold." }
        alt: ["Sì, a condizione che ci sia il sole.", "Vengo, a meno che non nevichi troppo.", "Sì, purché tu mi aspetti in fondo alla pista."]
        grammar: [g.congiuntivo-conjunctions]
        vocab: [w.purché]
      - q: { es: "Perché mi dai la cartina?", en: "Why are you giving me the map?" }
        a: { es: "Te la do affinché tu non ti perda.", en: "I'm giving it to you so that you don't get lost." }
        alt: ["Perché tu non ti perda.", "Così non ti perdi.", "Nel caso che tu ti perda."]
        grammar: [g.congiuntivo-conjunctions, g.combined-pronouns]
        vocab: [w.affinché]
      - q: { es: "Prendiamo la seggiovia o saliamo a piedi?", en: "Shall we take the chairlift or walk up?" }
        a: { es: "La seggiovia, a meno che tu non voglia fare fatica.", en: "The chairlift, unless you want to wear yourself out." }
        alt: ["Saliamo a piedi, purché andiamo piano.", "La seggiovia: è più comoda.", "A piedi, a meno che non piova."]
        grammar: [g.congiuntivo-conjunctions]
        vocab: [w.seggiovia, w.a-meno-che]
      - q: { es: "Buongiorno, posso noleggiare gli scarponi qui?", en: "Good morning, can I rent boots here?" }
        a: { es: "Certo, a condizione che Lei lasci un documento.", en: "Of course, on condition that you leave an ID." }
        alt: ["Sì, purché lasci un documento.", "Certo, ci serve solo un documento."]
        grammar: [g.congiuntivo-conjunctions, g.tu-vs-lei]
        vocab: [w.scarponi, w.a-condizione-che]
      - q: { es: "Perché porti due giacche?", en: "Why are you taking two jackets?" }
        a: { es: "Nel caso che faccia freddo in vetta.", en: "In case it's cold on the summit." }
        alt: ["Nel caso che il tempo cambi.", "Perché in vetta fa sempre freddo."]
        grammar: [g.congiuntivo-conjunctions]
        vocab: [w.nel-caso-che, w.vetta]
    texts:
      - title: "Avviso alla funivia"
        es: ["La funivia per la vetta parte ogni venti minuti, a meno che non ci sia vento forte.", "Gli sciatori possono salire con gli sci, purché li portino in mano.", "Il rifugio in cima resta aperto fino alle cinque, affinché tutti possano riposarsi."]
        en: ["The cable car to the summit leaves every twenty minutes, unless there is a strong wind.", "Skiers can go up with their skis, provided they carry them in their hands.", "The hut at the top stays open until five, so that everyone can rest."]
        grammar: [g.congiuntivo-conjunctions]
        vocab: [w.funivia, w.vetta, w.sciatore, w.rifugio]
      - title: "Messaggio di Ilaria"
        es: ["Domani saliamo al rifugio, purché il tempo sia bello.", "Porta gli scarponi e una giacca pesante, nel caso che faccia freddo.", "Ti aspetto alla seggiovia alle otto!"]
        en: ["Tomorrow we're going up to the hut, provided the weather is good.", "Bring your boots and a heavy jacket, in case it's cold.", "I'll wait for you at the chairlift at eight!"]
        grammar: [g.congiuntivo-conjunctions]
        vocab: [w.rifugio, w.scarponi, w.seggiovia]
    spicy:
      - { es: "Ti insegno a sciare, purché dopo tu mi offra una cioccolata calda.", en: "I'll teach you to ski, provided you buy me a hot chocolate afterwards.", altEs: ["Ti insegno a sciare a condizione che dopo tu mi offra una cioccolata calda."], grammar: [g.congiuntivo-conjunctions], vocab: [w.purché] }
      - { es: "Scendo dalla pista nera solo affinché tu mi veda: in realtà ho una paura terribile.", en: "I'm only going down the black run so that you'll see me: actually I'm terrified.", altEs: ["Scendo dalla pista nera solo perché tu mi veda: in realtà ho una paura terribile."], grammar: [g.congiuntivo-conjunctions], vocab: [w.pista, w.affinché] }
      - { es: "Puoi dormire nel mio rifugio, a condizione che tu non russi.", en: "You can sleep in my hut, on condition that you don't snore.", altEs: ["Puoi dormire nel mio rifugio, purché tu non russi."], grammar: [g.congiuntivo-conjunctions], vocab: [w.rifugio, w.a-condizione-che] }
      - { es: "Ti presto i miei guanti, in modo che tu debba ridarmeli stasera, a cena.", en: "I'll lend you my gloves, so that you'll have to give them back to me tonight, at dinner.", altEs: ["Ti presto i miei guanti in modo che tu debba ridarmeli stasera a cena."], grammar: [g.congiuntivo-conjunctions, g.combined-pronouns], vocab: [w.in-modo-che] }
      - { es: "Saliamo in vetta, a meno che tu non preferisca restare davanti al camino con me.", en: "Let's climb to the summit, unless you'd rather stay in front of the fire with me.", altEs: ["Saliamo sulla vetta, a meno che tu non preferisca restare davanti al camino con me."], grammar: [g.congiuntivo-conjunctions], vocab: [w.vetta, w.a-meno-che] }
  - id: b1.u07.l2
    title: Benché faccia freddo
    teach: [g.congiuntivo-conjunctions]
    vocab: [w.benché, w.sebbene, w.senza-che, w.gelo, w.ghiaccio, w.gelato.adj, w.congelare, w.sciogliere, w.legna, w.camino, w.stufa, w.riscaldamento, w.malga, w.pascolo, w.mucca-al-pascolo, w.cervo, w.orso, w.aquila, w.volpe, w.roccia, w.ramo, w.profondo, w.lago-di-garda, w.faticoso, w.fatica, w.solido, w.sottile, w.superficie, w.cibo, w.muovere]
    tip: "benché and sebbene (although) take the congiuntivo; anche se (even though) takes the indicative: Benché piova… / Anche se piove…"
    sentences:
      - { es: "Benché faccia freddo, i bambini giocano sulla neve.", en: "Although it's cold, the children are playing in the snow.", altEs: ["Sebbene faccia freddo, i bambini giocano sulla neve.", "Benché faccia freddo, i bambini giocano nella neve."], grammar: [g.congiuntivo-conjunctions], vocab: [w.benché] }
      - { es: "Sebbene sia maggio, sulla strada c'è ancora ghiaccio.", en: "Although it's May, there's still ice on the road.", altEs: ["Benché sia maggio, sulla strada c'è ancora ghiaccio.", "Sebbene sia maggio, c'è ancora ghiaccio sulla strada."], grammar: [g.congiuntivo-conjunctions], vocab: [w.sebbene, w.ghiaccio] }
      - { es: "Anche se fa freddo, la malga è aperta.", en: "Even though it's cold, the dairy hut is open.", altEs: ["La malga è aperta anche se fa freddo."], grammar: [g.congiuntivo-conjunctions], vocab: [w.malga], error: { wrong: "Anche se faccia freddo, la malga è aperta.", explain: "anche se takes the indicative (fa); only benché and sebbene need the congiuntivo.", grammar: g.congiuntivo-conjunctions } }
      - { es: "Le volpi entrano nel giardino senza che il cane se ne accorga.", en: "The foxes come into the garden without the dog noticing.", altEs: ["Le volpi entrano in giardino senza che il cane se ne accorga."], grammar: [g.congiuntivo-conjunctions], vocab: [w.volpe, w.senza-che] }
      - { es: "Benché sia stanca, Ilaria porta la legna per la stufa.", en: "Although she's tired, Ilaria carries the firewood for the stove.", altEs: ["Sebbene sia stanca, Ilaria porta la legna per la stufa."], grammar: [g.congiuntivo-conjunctions], vocab: [w.legna, w.stufa, w.benché] }
      - { es: "Sebbene la malga non abbia il riscaldamento, con il camino acceso fa caldo.", en: "Although the dairy hut has no heating, it's warm with the fire lit.", altEs: ["Benché la malga non abbia il riscaldamento, con il camino acceso fa caldo.", "Sebbene la malga non abbia riscaldamento, col camino acceso fa caldo."], grammar: [g.congiuntivo-conjunctions], vocab: [w.riscaldamento, w.camino, w.malga] }
      - { es: "Le mucche al pascolo non si muovono, benché piova.", en: "The grazing cows don't move, even though it's raining.", altEs: ["Le mucche al pascolo non si muovono, sebbene piova.", "Benché piova, le mucche al pascolo non si muovono."], grammar: [g.congiuntivo-conjunctions], vocab: [w.mucca-al-pascolo, w.pascolo] }
      - { es: "Benché gli orsi siano rari qui, è meglio non lasciare cibo fuori.", en: "Although bears are rare here, it's better not to leave food outside.", altEs: ["Sebbene gli orsi siano rari qui, è meglio non lasciare cibo fuori."], grammar: [g.congiuntivo-conjunctions], vocab: [w.orso] }
      - { es: "Benché le rocce siano altissime, l'aquila ci costruisce il suo nido.", en: "Although the rocks are very high, the eagle builds its nest there.", altEs: ["Sebbene le rocce siano altissime, l'aquila ci costruisce il nido."], grammar: [g.congiuntivo-conjunctions], vocab: [w.aquila, w.roccia] }
      - { es: "Sebbene il lago sia profondo, l'acqua è chiarissima.", en: "Although the lake is deep, the water is crystal clear.", altEs: ["Benché il lago sia profondo, l'acqua è chiarissima."], altEn: ["Although the lake is deep, the water is very clear."], grammar: [g.congiuntivo-conjunctions], vocab: [w.profondo, w.sebbene] }
      - { es: "Fa freddo, ma usciamo lo stesso.", en: "It's cold, but we're going out anyway.", altEs: ["Fa freddo, però usciamo lo stesso."], grammar: [g.connectors-basic], vocab: [], transform: { instruction: "Join the two ideas with benché", answer: "Benché faccia freddo, usciamo.", alt: ["Usciamo benché faccia freddo.", "Sebbene faccia freddo, usciamo.", "Benché faccia freddo, usciamo lo stesso."], en: "Although it's cold, we're going out." } }
      - { es: "Al sole il ghiaccio si scioglie, benché l'aria sia ancora gelata.", en: "In the sun the ice melts, although the air is still icy.", altEs: ["Al sole il ghiaccio si scioglie, sebbene l'aria sia ancora gelata."], grammar: [g.congiuntivo-conjunctions], vocab: [w.sciogliere, w.gelato.adj, w.ghiaccio] }
      - { es: "Sebbene il gelo sia forte, il fiume non si congela mai del tutto.", en: "Although the frost is severe, the river never freezes completely.", altEs: ["Benché il gelo sia forte, il fiume non si congela mai del tutto."], grammar: [g.congiuntivo-conjunctions], vocab: [w.gelo, w.congelare] }
      - { es: "Benché la salita sia faticosa, dal Monte Baldo si vede tutto il lago di Garda.", en: "Although the climb is tiring, from Monte Baldo you can see the whole of Lake Garda.", altEs: ["Sebbene la salita sia faticosa, dal Monte Baldo si vede tutto il lago di Garda."], grammar: [g.congiuntivo-conjunctions], vocab: [w.faticoso, w.lago-di-garda], transform: { instruction: "Replace benché with anche se", answer: "Anche se la salita è faticosa, dal Monte Baldo si vede tutto il lago di Garda.", en: "Even though the climb is tiring, from Monte Baldo you can see the whole of Lake Garda." } }
      - { es: "Sebbene sia una fatica, ogni mattina il nonno taglia i rami per la stufa.", en: "Although it's hard work, every morning Grandpa cuts branches for the stove.", altEs: ["Benché sia una fatica, ogni mattina il nonno taglia i rami per la stufa."], grammar: [g.congiuntivo-conjunctions], vocab: [w.fatica, w.ramo] }
      - { es: "Hai visto il cervo? È passato vicino a noi senza fare rumore!", en: "Did you see the deer? It went right past us without making a sound!", altEs: ["Hai visto il cervo? È passato accanto a noi senza fare rumore!"], grammar: [g.passato-prossimo-essere], vocab: [w.cervo], note: "Same subject: senza + infinitive (senza fare). Different subject: senza che + congiuntivo." }
    exchanges:
      - q: { es: "Esci con questo tempo?", en: "Are you going out in this weather?" }
        a: { es: "Sì, benché nevichi, devo portare dentro la legna.", en: "Yes, although it's snowing, I have to bring the firewood in." }
        alt: ["Sì, anche se nevica.", "No, fa troppo freddo.", "Sì, sebbene nevichi, devo portare dentro la legna."]
        grammar: [g.congiuntivo-conjunctions]
        vocab: [w.benché, w.legna]
      - q: { es: "Hai freddo?", en: "Are you cold?" }
        a: { es: "Un po', sebbene la stufa sia accesa.", en: "A bit, although the stove is on." }
        alt: ["No, il camino scalda bene.", "Sì, benché abbia due maglioni.", "Un po', anche se la stufa è accesa."]
        grammar: [g.congiuntivo-conjunctions]
        vocab: [w.stufa, w.sebbene]
      - q: { es: "Ci sono orsi in questa valle?", en: "Are there bears in this valley?" }
        a: { es: "Qualcuno sì, benché sia difficile vederli.", en: "A few, though it's hard to see them." }
        alt: ["Pochi, ma è raro vederli.", "Sì, benché siano rari.", "No, solo cervi e volpi."]
        grammar: [g.congiuntivo-conjunctions]
        vocab: [w.orso]
      - q: { es: "Possiamo partire?", en: "Can we go?" }
        a: { es: "Sì, ma piano, senza che il cane ci senta: vuole sempre venire anche lui!", en: "Yes, but quietly, without the dog hearing us: he always wants to come too!" }
        alt: ["Sì, andiamo.", "Aspetta, prima chiudo la porta."]
        grammar: [g.congiuntivo-conjunctions]
        vocab: [w.senza-che]
      - q: { es: "Il lago è gelato?", en: "Is the lake frozen?" }
        a: { es: "In superficie sì, ma benché sembri solido, il ghiaccio è sottile.", en: "On the surface, yes, but although it looks solid, the ice is thin." }
        alt: ["Sì, ma il ghiaccio è sottile.", "Non ancora: fa troppo caldo."]
        grammar: [g.congiuntivo-conjunctions]
        vocab: [w.gelato.adj, w.ghiaccio]
    texts:
      - title: "Diario di montagna"
        es: ["Benché sia giugno, sulle rocce c'è ancora un po' di ghiaccio.", "Stamattina abbiamo visto un cervo vicino alla malga.", "Sebbene la salita sia stata faticosa, la vista era meravigliosa."]
        en: ["Although it's June, there's still a little ice on the rocks.", "This morning we saw a deer near the dairy hut.", "Although the climb was tiring, the view was wonderful."]
        grammar: [g.congiuntivo-conjunctions, g.congiuntivo-passato]
        vocab: [w.roccia, w.ghiaccio, w.cervo, w.malga, w.faticoso]
      - title: "Cartello al lago"
        es: ["Attenzione: benché il lago sembri gelato, il ghiaccio è sottile.", "Non camminate sul lago, anche se vi sembra solido."]
        en: ["Warning: although the lake looks frozen, the ice is thin.", "Do not walk on the lake, even if it looks solid to you."]
        grammar: [g.congiuntivo-conjunctions]
        vocab: [w.gelato.adj, w.ghiaccio]
    spicy:
      - { es: "Benché fuori ci sia il gelo, accanto a te ho caldo.", en: "Although it's freezing outside, next to you I'm warm.", altEs: ["Sebbene fuori ci sia il gelo, accanto a te ho caldo."], grammar: [g.congiuntivo-conjunctions], vocab: [w.gelo, w.benché] }
      - { es: "Sebbene tu sia un orso la mattina, a cena sei adorabile.", en: "Although you're a bear in the morning, at dinner you're adorable.", altEs: ["Benché tu sia un orso la mattina, a cena sei adorabile."], grammar: [g.congiuntivo-conjunctions], vocab: [w.orso, w.sebbene] }
      - { es: "Ogni sera mi rubi il posto vicino al camino senza che io possa dire niente.", en: "Every evening you steal my spot by the fire without me being able to say a thing.", altEs: ["Ogni sera mi rubi il posto accanto al camino senza che io possa dire niente."], grammar: [g.congiuntivo-conjunctions], vocab: [w.camino, w.senza-che] }
      - { es: "Anche se fa freddo, non ti presto la mia coperta, a meno che tu non ci stia sotto con me.", en: "Even though it's cold, I won't lend you my blanket, unless you get under it with me.", altEs: ["Anche se fa freddo, non ti do la mia coperta, a meno che tu non ci stia sotto con me."], grammar: [g.congiuntivo-conjunctions], vocab: [w.a-meno-che] }
      - { es: "Benché tu sia furbo come una volpe, stasera paghi tu.", en: "Although you're as cunning as a fox, tonight you're paying.", altEs: ["Sebbene tu sia furbo come una volpe, stasera paghi tu.", "Benché tu sia furba come una volpe, stasera paghi tu."], grammar: [g.congiuntivo-conjunctions], vocab: [w.volpe, w.benché] }
  - id: b1.u07.l3
    title: Prima che faccia buio
    teach: [g.prima-che-prima-di]
    vocab: [w.prima-che, w.troppo-tardi, w.rischio, w.rischiare, w.valanga, w.emergenza, w.soccorso, w.salvataggio, w.pericolo, w.evitare, w.prevedere, w.prevenire, w.preparazione, w.prepararsi-a, w.allinizio, w.inizio, w.dora-in-poi, w.affacciarsi, w.occidentale, w.orientale]
    tip: "Same subject: prima di + infinitive (prima di partire). Different subject: prima che + congiuntivo (prima che tu parta). After: dopo che + indicative."
    sentences:
      - { es: "Torniamo al rifugio prima che faccia buio.", en: "Let's go back to the hut before it gets dark.", altEs: ["Rientriamo al rifugio prima che faccia buio.", "Torniamo al rifugio prima che venga buio."], grammar: [g.prima-che-prima-di], vocab: [w.prima-che] }
      - { es: "Prima di partire, controlla il rischio di valanghe.", en: "Before setting off, check the avalanche risk.", altEs: ["Controlla il rischio di valanghe prima di partire."], grammar: [g.prima-che-prima-di, g.imperativo-tu], vocab: [w.rischio, w.valanga] }
      - { es: "Dobbiamo scendere prima che sia troppo tardi.", en: "We have to go down before it's too late.", altEs: ["Bisogna scendere prima che sia troppo tardi.", "Dobbiamo scendere a valle prima che sia troppo tardi."], grammar: [g.prima-che-prima-di], vocab: [w.troppo-tardi, w.prima-che] }
      - { es: "Chiudi la finestra prima che entri il freddo.", en: "Close the window before the cold gets in.", altEs: ["Chiudi la finestra prima che entri freddo."], grammar: [g.prima-che-prima-di, g.imperativo-tu], vocab: [w.prima-che], error: { wrong: "Chiudi la finestra prima che entra il freddo.", explain: "prima che always takes the congiuntivo: prima che entri.", grammar: g.prima-che-prima-di } }
      - { es: "Dopo che è arrivato il soccorso alpino, ci siamo tutti calmati.", en: "After the mountain rescue arrived, we all calmed down.", altEs: ["Quando è arrivato il soccorso alpino, ci siamo tutti calmati."], grammar: [g.prima-che-prima-di, g.reflexive-passato-prossimo], vocab: [w.soccorso], error: { wrong: "Dopo che sia arrivato il soccorso alpino, ci siamo tutti calmati.", explain: "dopo che describes a real event, so it takes the indicative: dopo che è arrivato.", grammar: g.prima-che-prima-di } }
      - { es: "Prima di cominciare il salvataggio, la squadra aspetta che il vento diminuisca.", en: "Before starting the rescue, the team waits for the wind to drop.", altEs: ["Prima di iniziare il salvataggio, la squadra aspetta che il vento diminuisca."], grammar: [g.prima-che-prima-di, g.congiuntivo-vs-infinitive], vocab: [w.salvataggio] }
      - { es: "In caso di emergenza, chiamate il soccorso prima di fare qualsiasi altra cosa.", en: "In an emergency, call for help before doing anything else.", altEs: ["In caso di emergenza, chiamate i soccorsi prima di fare qualsiasi altra cosa."], grammar: [g.prima-che-prima-di, g.imperativo-noi-voi], vocab: [w.emergenza, w.soccorso] }
      - { es: "Partiamo all'alba per evitare il caldo, prima che il sole sciolga la neve.", en: "We'll leave at dawn to avoid the heat, before the sun melts the snow.", altEs: ["Partiamo all'alba per evitare il caldo, prima che il sole sciolga la neve sul sentiero."], grammar: [g.prima-che-prima-di], vocab: [w.evitare, w.sciogliere] }
      - { es: "Nessuno può prevedere una valanga, ma possiamo ridurre il pericolo.", en: "No one can predict an avalanche, but we can reduce the danger.", altEs: ["Nessuno può prevedere le valanghe, ma possiamo ridurre il pericolo."], grammar: [g.potere-dovere], vocab: [w.prevedere, w.pericolo, w.valanga] }
      - { es: "Per prevenire gli incidenti, all'inizio della stagione il rifugio organizza un corso, prima che arrivino gli sciatori.", en: "To prevent accidents, at the start of the season the hut runs a course, before the skiers arrive.", altEs: ["Per prevenire incidenti, all'inizio della stagione il rifugio organizza un corso, prima che arrivino gli sciatori."], grammar: [g.prima-che-prima-di], vocab: [w.prevenire, w.inizio] }
      - { es: "All'inizio avevo paura; dopo che la guida mi ha spiegato tutto, mi sono calmato.", en: "At first I was scared; after the guide explained everything to me, I calmed down.", altEs: ["All'inizio avevo paura; dopo che la guida mi ha spiegato tutto, mi sono calmata."], grammar: [g.prima-che-prima-di, g.passato-prossimo-vs-imperfetto], vocab: [w.allinizio] }
      - { es: "Mangio qualcosa prima di partire.", en: "I'll eat something before I leave.", altEs: ["Prima di partire mangio qualcosa."], altEn: ["I'm eating something before leaving."], grammar: [g.prima-che-prima-di], vocab: [], transform: { instruction: "Change to 'before you leave' (tu)", answer: "Mangio qualcosa prima che tu parta.", alt: ["Prima che tu parta mangio qualcosa."], en: "I'll eat something before you leave." } }
      - { es: "La preparazione dura mesi: ci prepariamo alla salita molto prima di partire.", en: "The preparation takes months: we prepare for the climb long before we leave.", altEs: ["La preparazione dura mesi: ci prepariamo alla salita molto prima della partenza."], grammar: [g.prima-che-prima-di, g.reflexive-present], vocab: [w.preparazione, w.prepararsi-a] }
      - { es: "La mia camera si affaccia sulla valle: guardala prima che faccia buio!", en: "My room looks out over the valley: look at it before it gets dark!", altEs: ["La mia camera si affaccia sulla valle: guardala prima che venga buio!"], grammar: [g.prima-che-prima-di, g.imperativo-pronouns], vocab: [w.affacciarsi] }
      - { es: "Dalla finestra orientale vedi l'alba; da quella occidentale, il tramonto.", en: "From the east window you see the sunrise; from the west one, the sunset.", altEs: ["Dalla finestra a oriente vedi l'alba; da quella a occidente, il tramonto."], grammar: [g.quello-forms], vocab: [w.orientale, w.occidentale] }
      - { es: "Non rischiare: d'ora in poi torna indietro prima che il tempo peggiori.", en: "Don't take risks: from now on, turn back before the weather gets worse.", altEs: ["Non rischiare: d'ora in poi torna indietro prima che peggiori il tempo."], grammar: [g.prima-che-prima-di, g.imperativo-negative], vocab: [w.rischiare, w.dora-in-poi], transform: { instruction: "Change to 'voi'", answer: "Non rischiate: d'ora in poi tornate indietro prima che il tempo peggiori.", alt: ["Non rischiate: d'ora in poi tornate indietro prima che peggiori il tempo."], en: "Don't take risks: from now on, turn back before the weather gets worse." } }
    exchanges:
      - q: { es: "Quando partiamo?", en: "When are we leaving?" }
        a: { es: "Domani all'alba, prima che faccia caldo.", en: "Tomorrow at dawn, before it gets hot." }
        alt: ["All'alba.", "Prima che arrivino gli altri.", "Domani, prima che cambi il tempo."]
        grammar: [g.prima-che-prima-di]
        vocab: [w.prima-che]
      - q: { es: "Avete chiamato il soccorso alpino?", en: "Did you call the mountain rescue?" }
        a: { es: "Sì, subito dopo che è caduta la valanga.", en: "Yes, right after the avalanche came down." }
        alt: ["Sì, li abbiamo chiamati subito.", "Non ancora: prima vogliamo capire dove siamo."]
        grammar: [g.prima-che-prima-di]
        vocab: [w.soccorso, w.valanga]
      - q: { es: "Cosa fai prima di una salita difficile?", en: "What do you do before a difficult climb?" }
        a: { es: "Prima di partire, controllo il meteo e l'attrezzatura.", en: "Before setting off, I check the weather forecast and the equipment." }
        alt: ["Controllo sempre il meteo prima di partire.", "Mi preparo per settimane."]
        grammar: [g.prima-che-prima-di]
        vocab: [w.attrezzatura]
      - q: { es: "Posso fare una foto?", en: "Can I take a photo?" }
        a: { es: "Sì, ma in fretta, prima che il sole sparisca dietro la montagna.", en: "Yes, but quickly, before the sun disappears behind the mountain." }
        alt: ["Sì, prima che faccia buio.", "Certo, ma sbrigati."]
        grammar: [g.prima-che-prima-di]
        vocab: [w.prima-che]
      - q: { es: "Qual è il pericolo più grande in inverno?", en: "What's the biggest danger in winter?" }
        a: { es: "Le valanghe, soprattutto dopo che ha nevicato molto.", en: "Avalanches, especially after it has snowed a lot." }
        alt: ["Il ghiaccio sulle strade.", "Le valanghe."]
        grammar: [g.prima-che-prima-di]
        vocab: [w.pericolo, w.valanga]
    texts:
      - title: "Regole del rifugio"
        es: ["Prima di entrare, togliete gli scarponi.", "Spegnete le luci prima che cominci il silenzio, alle dieci.", "In caso di emergenza, chiamate subito il gestore."]
        en: ["Before coming in, take off your boots.", "Switch off the lights before quiet time begins, at ten.", "In an emergency, call the manager immediately."]
        grammar: [g.prima-che-prima-di]
        vocab: [w.emergenza, w.scarponi]
      - title: "Messaggio alla mamma"
        es: ["Ciao mamma, siamo al rifugio e stiamo bene.", "Domani vogliamo partire prima che arrivi il temporale.", "Ti chiamo prima di scendere a valle."]
        en: ["Hi Mum, we're at the hut and we're fine.", "Tomorrow we want to leave before the storm arrives.", "I'll call you before going down to the valley."]
        grammar: [g.prima-che-prima-di]
        vocab: [w.prima-che, w.rifugio]
    spicy:
      - { es: "Dammi un bacio prima che tornino gli altri dal rifugio.", en: "Give me a kiss before the others come back from the hut.", altEs: ["Dammi un bacio prima che gli altri tornino dal rifugio."], grammar: [g.prima-che-prima-di, g.imperativo-short-forms], vocab: [w.prima-che] }
      - { es: "Prima di conoscerti odiavo la montagna; adesso odio solo scendere a valle.", en: "Before I met you I hated the mountains; now I only hate going back down to the valley.", altEs: ["Prima di conoscerti odiavo la montagna; ora odio solo scendere a valle."], grammar: [g.prima-che-prima-di], vocab: [w.valle] }
      - { es: "Chiedimi di uscire prima che sia troppo tardi... cioè, prima che finisca la stagione.", en: "Ask me out before it's too late... I mean, before the season ends.", grammar: [g.prima-che-prima-di], vocab: [w.troppo-tardi] }
      - { es: "Dopo che mi hai visto sciare, hai ancora il coraggio di invitarmi a cena?", en: "After seeing me ski, do you still have the courage to invite me to dinner?", altEs: ["Dopo che mi hai visto sciare, hai ancora il coraggio di invitarmi fuori a cena?"], grammar: [g.prima-che-prima-di], vocab: [] }
      - { es: "D'ora in poi, prima di dire che sei un campione di sci, prova almeno la pista blu.", en: "From now on, before you say you're a skiing champion, at least try the blue run.", grammar: [g.prima-che-prima-di], vocab: [w.dora-in-poi, w.pista] }
  - id: b1.u07.l4
    title: Penso che ce l'abbiano fatta
    teach: [g.congiuntivo-passato]
    vocab: [w.scalare, w.arrampicarsi, w.raggiungere, w.ottenere, w.risolvere, w.affrontare, w.allenato, w.sforzo, w.resistere, w.superare, w.successo, w.fallire, w.fallimento, w.tentare, w.tentativo, w.almeno, w.continuamente, w.facilmente, w.finora, w.scommessa, w.colpo]
    tip: "Present trigger + past action = congiuntivo passato: Penso che sia arrivato. Spero che abbiate dormito bene. Verbs with essere agree: Credo che sia partita."
    sentences:
      - { es: "Sono contenta che tu ce l'abbia fatta!", en: "I'm glad you made it!", altEs: ["Sono contento che tu ce l'abbia fatta!", "Sono felice che tu ce l'abbia fatta!"], grammar: [g.congiuntivo-passato, g.congiuntivo-wishes-emotion], vocab: [w.farcela] }
      - { es: "Credo che Marta sia già partita.", en: "I think Marta has already left.", altEs: ["Penso che Marta sia già partita."], grammar: [g.congiuntivo-passato], vocab: [], error: { wrong: "Credo che Marta abbia già partita.", explain: "partire takes essere, so the congiuntivo passato is sia partita.", grammar: g.congiuntivo-passato } }
      - { es: "Mi dispiace che il tuo tentativo sia fallito.", en: "I'm sorry your attempt failed.", altEs: ["Mi dispiace che il tuo tentativo non sia riuscito."], grammar: [g.congiuntivo-passato, g.congiuntivo-wishes-emotion], vocab: [w.tentativo, w.fallire] }
      - { es: "È incredibile che abbiano scalato quella parete in un giorno solo.", en: "It's incredible that they climbed that rock face in just one day.", altEs: ["È incredibile che abbiano scalato quella parete in un solo giorno."], grammar: [g.congiuntivo-passato, g.congiuntivo-impersonal], vocab: [w.scalare] }
      - { es: "Non credo che si sia arrampicato da solo: è troppo pericoloso.", en: "I don't think he climbed alone: it's too dangerous.", altEs: ["Non penso che si sia arrampicato da solo: è troppo pericoloso."], grammar: [g.congiuntivo-passato], vocab: [w.arrampicarsi] }
      - { es: "Benché abbia fatto un grande sforzo, non è riuscito a superare l'ultimo tratto.", en: "Although he made a huge effort, he didn't manage to get past the last stretch.", altEs: ["Sebbene abbia fatto un grande sforzo, non è riuscito a superare l'ultimo tratto."], grammar: [g.congiuntivo-passato, g.congiuntivo-conjunctions], vocab: [w.sforzo, w.superare] }
      - { es: "È possibile che abbiano già risolto il problema della funivia.", en: "It's possible they've already fixed the problem with the cable car.", altEs: ["Può darsi che abbiano già risolto il problema della funivia."], grammar: [g.congiuntivo-passato, g.congiuntivo-impersonal], vocab: [w.risolvere] }
      - { es: "Pare che la squadra abbia ottenuto un grande successo.", en: "It seems the team achieved a great success.", altEs: ["Sembra che la squadra abbia ottenuto un grande successo."], grammar: [g.congiuntivo-passato], vocab: [w.ottenere, w.successo] }
      - { es: "Penso che arrivino stasera.", en: "I think they're arriving this evening.", altEs: ["Credo che arrivino stasera."], grammar: [g.congiuntivo-opinion], vocab: [], transform: { instruction: "Put the arrival in the past: 'yesterday evening'", answer: "Penso che siano arrivati ieri sera.", alt: ["Credo che siano arrivati ieri sera."], en: "I think they arrived yesterday evening." } }
      - { es: "Dubito che finora qualcuno abbia affrontato questa parete d'inverno.", en: "I doubt anyone has tackled this face in winter so far.", altEs: ["Dubito che qualcuno abbia affrontato finora questa parete d'inverno."], grammar: [g.congiuntivo-passato], vocab: [w.finora, w.affrontare] }
      - { es: "Sono felice che almeno tu sia tornato sano e salvo.", en: "I'm happy that at least you came back safe and sound.", altEs: ["Sono felice che almeno tu sia tornata sana e salva.", "Sono contento che almeno tu sia tornato sano e salvo."], grammar: [g.congiuntivo-passato, g.congiuntivo-wishes-emotion], vocab: [w.almeno], transform: { instruction: "Change 'tu' to 'voi'", answer: "Sono felice che almeno voi siate tornati sani e salvi.", alt: ["Sono felice che almeno siate tornati sani e salvi."], en: "I'm happy that at least you (all) came back safe and sound." } }
      - { es: "Mi sembra che tu sia molto allenato: hai resistito fino in cima senza fermarti!", en: "You seem very fit to me: you kept going right to the top without stopping!", altEs: ["Mi sembra che tu sia molto allenata: hai resistito fino in cima senza fermarti!"], grammar: [g.congiuntivo-opinion], vocab: [w.allenato, w.resistere] }
      - { es: "Credo che il fallimento li abbia resi più forti.", en: "I think failure has made them stronger.", altEs: ["Penso che il fallimento li abbia resi più forti."], grammar: [g.congiuntivo-passato], vocab: [w.fallimento] }
      - { es: "Pensi che abbiano tentato la salita anche ieri?", en: "Do you think they attempted the climb yesterday too?", altEs: ["Credi che abbiano tentato la salita anche ieri?"], grammar: [g.congiuntivo-passato], vocab: [w.tentare] }
      - { es: "Non è vero che abbia vinto facilmente: si è allenata per anni.", en: "It's not true that she won easily: she trained for years.", altEs: ["Non è vero che abbia vinto facilmente; si è allenata per anni."], grammar: [g.congiuntivo-passato], vocab: [w.facilmente] }
      - { es: "Mi dispiace che tu abbia dovuto aspettare: il telefono squillava continuamente.", en: "I'm sorry you had to wait: the phone kept ringing.", altEs: ["Mi dispiace che tu abbia dovuto aspettare, il telefono squillava continuamente."], grammar: [g.congiuntivo-passato, g.imperfetto-uses], vocab: [w.continuamente] }
    exchanges:
      - q: { es: "Com'è andata la salita?", en: "How did the climb go?" }
        a: { es: "Benissimo! Credo che sia stata la giornata più bella dell'estate.", en: "Brilliantly! I think it was the best day of the summer." }
        alt: ["Bene, ce l'abbiamo fatta!", "Faticosa, ma bellissima."]
        grammar: [g.congiuntivo-passato]
        vocab: []
      - q: { es: "Dov'è Luca? Non lo vedo.", en: "Where's Luca? I can't see him." }
        a: { es: "Penso che sia già sceso a valle.", en: "I think he's already gone down to the valley." }
        alt: ["Credo che sia andato al rifugio.", "Non so, forse è già partito."]
        grammar: [g.congiuntivo-passato]
        vocab: [w.valle]
      - q: { es: "Avete raggiunto la vetta?", en: "Did you reach the summit?" }
        a: { es: "No, purtroppo. È possibile che abbiamo sbagliato sentiero.", en: "No, unfortunately. It's possible we took the wrong path." }
        alt: ["Sì, finalmente!", "No, il tempo è cambiato."]
        grammar: [g.congiuntivo-passato]
        vocab: [w.raggiungere, w.vetta]
      - q: { es: "Hai saputo? Marta ha scalato il Cervino!", en: "Have you heard? Marta has climbed the Matterhorn!" }
        a: { es: "Davvero? Sono contenta che ce l'abbia fatta!", en: "Really? I'm glad she made it!" }
        alt: ["Che brava!", "Non ci credo che l'abbia fatto davvero!", "Sono contento che ce l'abbia fatta!"]
        grammar: [g.congiuntivo-passato]
        vocab: [w.scalare]
      - q: { es: "Perché sei così stanco?", en: "Why are you so tired?" }
        a: { es: "Penso che la salita di ieri sia stata troppo faticosa.", en: "I think yesterday's climb was too tiring." }
        alt: ["Ho dormito male.", "Ieri ho camminato otto ore."]
        grammar: [g.congiuntivo-passato]
        vocab: [w.faticoso]
    texts:
      - title: "Dalla vetta"
        es: ["Ce l'abbiamo fatta: siamo in vetta!", "Spero che anche voi abbiate passato una bella giornata.", "Mi dispiace che Luca non sia potuto venire."]
        en: ["We made it: we're on the summit!", "I hope you had a nice day too.", "I'm sorry Luca couldn't come."]
        grammar: [g.congiuntivo-passato]
        vocab: [w.vetta]
      - title: "Notizia dal rifugio"
        es: ["Due giovani sciatori hanno raggiunto il rifugio dopo una notte nella neve.", "Sembra che abbiano perso il sentiero a causa della nebbia.", "Per fortuna, il soccorso alpino li ha trovati presto."]
        en: ["Two young skiers reached the hut after a night in the snow.", "It seems they lost the path because of the fog.", "Fortunately, the mountain rescue found them quickly."]
        grammar: [g.congiuntivo-passato]
        vocab: [w.raggiungere, w.sciatore, w.soccorso]
    spicy:
      - { es: "Spero che tu abbia portato due tazze: la cioccolata è per due.", en: "I hope you brought two mugs: the hot chocolate is for two.", grammar: [g.congiuntivo-passato], vocab: [] }
      - { es: "Credo che tu ti sia allenato tutto l'inverno solo per fare colpo su di me.", en: "I think you trained all winter just to impress me.", altEs: ["Credo che tu ti sia allenata tutto l'inverno solo per fare colpo su di me."], grammar: [g.congiuntivo-passato], vocab: [w.allenato] }
      - { es: "Mi dispiace che tu abbia perso la scommessa: adesso mi devi una cena.", en: "I'm sorry you lost the bet: now you owe me a dinner.", altEs: ["Mi dispiace che tu abbia perso la scommessa: ora mi devi una cena."], grammar: [g.congiuntivo-passato], vocab: [] }
      - { es: "Non credo che tu sia caduto per caso proprio davanti a me.", en: "I don't think you fell by accident right in front of me.", altEs: ["Non credo che tu sia caduta per caso proprio davanti a me."], grammar: [g.congiuntivo-passato], vocab: [] }
      - { es: "È strano che nessuno ti abbia ancora invitato a ballare. Lo faccio io.", en: "It's strange that nobody has asked you to dance yet. I'll do it.", altEs: ["È strano che nessuno ti abbia ancora invitata a ballare. Lo faccio io."], grammar: [g.congiuntivo-passato, g.congiuntivo-impersonal], vocab: [] }
dialogues:
  - id: b1.u07.d1
    title: Al rifugio, al tramonto
    context: Ilaria and Tobias are at a mountain hut in the Dolomites, planning tomorrow's climb as the sun sets.
    lines:
      - { speaker: Tobias, es: "Che spettacolo! Guarda le rocce: stanno diventando rosa.", en: "What a sight! Look at the rocks: they're turning pink." }
      - { speaker: Ilaria, es: "È l'enrosadira. Fai una foto prima che faccia buio!", en: "It's the enrosadira. Take a photo before it gets dark!" }
      - { speaker: Tobias, es: "Domani saliamo in vetta, vero?", en: "Tomorrow we're climbing to the summit, right?" }
      - { speaker: Ilaria, es: "Sì, purché il tempo sia bello. Il gestore dice che potrebbe arrivare un temporale.", en: "Yes, provided the weather is good. The manager says a storm might come." }
      - { speaker: Tobias, es: "Allora partiamo all'alba, prima che arrivino le nuvole.", en: "Then let's leave at dawn, before the clouds arrive." }
      - { speaker: Ilaria, es: "D'accordo, ma prima di partire controlliamo il meteo.", en: "OK, but before we leave let's check the forecast." }
      - { speaker: Tobias, es: "E Paolo? Pensi che sia già arrivato al rifugio più in basso?", en: "And Paolo? Do you think he's already reached the hut further down?" }
