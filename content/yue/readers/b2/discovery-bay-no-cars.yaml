id: r.b2.discovery-bay-no-cars
level: b2
title: 原來係噉㗎
kind: dialogue
intro: Ana takes the ferry from Central to visit her colleague Ah Sum in Discovery Bay. On the way and around the neighbourhood she keeps discovering things that surprise her - and Ah Sum's particles show exactly how he feels about each one.
allow: [阿琛]
paragraphs:
  - { es: "星期六朝早，Ana喺中環碼頭等船，準備去愉景灣搵同事阿琛。阿琛一早喺電話度提醒佢：「記住喺三號碼頭搭船呀，唔係去長洲嗰班喎！」Ana上咗船先發現，原來去愉景灣嘅船二十四個鐘都有，半夜都有船。", en: "On Saturday morning Ana was waiting for a ferry at the Central piers, heading to Discovery Bay to visit her colleague Ah Sum. Ah Sum had reminded her on the phone earlier: \"Remember to take the boat from Pier 3 - not the Cheung Chau one, mind!\" Only after boarding did Ana discover that the Discovery Bay ferry runs twenty-four hours a day, even in the middle of the night." }
  - { es: "落船嘅時候，阿琛已經喺碼頭等緊。Ana：「嘩，呢度好似外國噉喎！有沙灘，有咖啡店，仲有咁多狗。」阿琛：「係呀，呢度住咗好多外國人，週末成日有人喺沙灘度跑步、玩狗。我搬嚟之前都唔知原來香港有個咁嘅地方㗎。」", en: "When she got off the ferry, Ah Sum was already waiting at the pier. Ana: \"Wow, this place feels like abroad! There's a beach, cafés, and so many dogs.\" Ah Sum: \"Yeah, lots of foreigners live here, and at weekends people are always jogging and playing with their dogs on the beach. Before I moved here I had no idea Hong Kong had a place like this.\"" }
  - { es: "佢哋行咗一陣，Ana忽然停低：「咦，點解成條街一架私家車都冇嘅？」阿琛笑咗：「你而家先發覺咩？愉景灣唔准私家車入嚟㗎。居民出入主要靠巴士同渡輪，有啲人就揸高爾夫球車。」Ana：「高爾夫球車？好得意喎！咁有冇的士呀？」阿琛：「冇喎，有急事就要打電話叫專線巴士或者救護車囉。」", en: "After walking for a while, Ana suddenly stopped: \"Hey, why isn't there a single private car on the whole street?\" Ah Sum laughed: \"You've only just noticed? Private cars aren't allowed into Discovery Bay. Residents mainly get around by bus and ferry, and some people drive golf carts.\" Ana: \"Golf carts? That's so cute! So are there any taxis?\" Ah Sum: \"Nope. If it's urgent you call the shuttle bus or an ambulance, that's all.\"" }
  - { es: "Ana：「噉住喺度咪好唔方便？」阿琛：「一開始我都係噉諗。但係住咗兩年，我發覺冇車真係好舒服：空氣好啲，又靜，細路可以喺街度踩單車，父母都唔使擔心。不過買傢俬就麻煩啲，要搵公司用貨車由專門嘅路送入嚟，運費貴到嚇死人。」", en: "Ana: \"Isn't living here really inconvenient, then?\" Ah Sum: \"That's what I thought at first. But after two years I've found that having no cars is really pleasant: the air is better, it's quiet, and kids can cycle in the street without their parents worrying. Buying furniture is more of a hassle, though: you have to get a company to bring it in by van on a special road, and the delivery charge is shockingly expensive.\"" }
  - { es: "佢哋喺廣場一間餐廳坐低食早餐。Ana留意到隔籬枱有個阿伯同侍應講英文，跟住同另一個客講廣東話，再同佢隻狗講普通話。Ana：「佢識講三種語言喎！」阿琛：「呢度係噉㗎喇，大家都中英夾雜，有時一句說話入面有三種語言。你住耐咗都會變成噉㗎。」", en: "They sat down for breakfast at a restaurant in the plaza. Ana noticed that an old man at the next table spoke English to the waiter, then Cantonese to another customer, and then Mandarin to his dog. Ana: \"He speaks three languages!\" Ah Sum: \"That's just how it is here. Everyone mixes Chinese and English; sometimes there are three languages in one sentence. Live here long enough and you'll end up the same.\"" }
  - { es: "食完早餐，阿琛帶Ana行上山睇風景。由山上面望落去，可以睇到成個海灣同對面嘅港島。Ana：「呢度啲樓好新喎，係咪最近先起㗎？」阿琛：「唔係喎，第一批居民八十年代初已經搬咗入嚟，呢度都有四十年歷史㗎喇。」", en: "After breakfast Ah Sum took Ana up the hill to see the view. From up there you could see the whole bay and Hong Kong Island across the water. Ana: \"The buildings here look really new. Were they built recently?\" Ah Sum: \"No, actually. The first residents moved in back in the early eighties, so this place has forty years of history.\"" }
  - { es: "夕陽落山嘅時候，佢哋返到碼頭。Ana話：「我以為香港淨係得高樓同塞車，原來有啲地方係完全唔同㗎。」阿琛：「香港唔止得中環同旺角嘛。下次帶你去南丫島，嗰度都冇車㗎，不過同愉景灣又係兩個世界嚟㗎喇。」Ana：「好呀，我一定要去！」", en: "As the sun set, they went back to the pier. Ana said: \"I thought Hong Kong was all tall buildings and traffic jams, but it turns out some places are completely different.\" Ah Sum: \"There's more to Hong Kong than Central and Mong Kok, you know. Next time I'll take you to Lamma Island. There are no cars there either, but it's a whole different world from Discovery Bay.\" Ana: \"Great, I've got to go!\"" }
questions:
  - { q: "阿琛提醒Ana乜嘢？", options: ["喺三號碼頭搭船", "帶遮", "早啲出門"], answer: 0, explain: "記住喺三號碼頭搭船呀，唔係去長洲嗰班喎！ 喎 marks it as a reminder." }
  - { q: "愉景灣啲居民主要坐乜嘢去其他地方？", options: ["私家車", "巴士同渡輪", "的士"], answer: 1, explain: "居民出入主要靠巴士同渡輪，有啲人就揸高爾夫球車." }
  - { q: "阿琛覺得冇車有咩好處？", options: ["空氣好啲，又靜，細路安全", "買傢俬方便", "運費平"], answer: 0, explain: "空氣好啲，又靜，細路可以喺街度踩單車. Furniture delivery is the downside." }
  - { q: "隔籬枱個阿伯同佢隻狗講乜嘢話？", options: ["英文", "廣東話", "普通話"], answer: 2, explain: "再同佢隻狗講普通話. English was for the waiter and Cantonese for another customer." }
  - { q: "愉景灣第一批居民幾時搬入去？", options: ["八十年代初", "九十年代", "最近"], answer: 0, explain: "第一批居民八十年代初已經搬咗入嚟." }
  - { q: "阿琛話「唔係喎」嘅時候係咩語氣？", options: ["話畀Ana知佢諗錯咗", "好嬲", "好驚"], answer: 0, explain: "唔係喎 politely corrects what someone has just assumed: the buildings are not new." }
glossary:
