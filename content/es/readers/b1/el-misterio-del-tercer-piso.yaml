id: r.b1.el-misterio-del-tercer-piso
level: b1
title: El misterio del tercer piso
kind: text
intro: Nobody has seen señor Ortega, the neighbour on the third floor, for a week, and the whole building starts speculating about what has happened to him.
allow: [ortega, lucía, tomás]
paragraphs:
  - { es: "Hace una semana que nadie ve al señor Ortega, el vecino del tercero. Es un hombre mayor, callado y muy puntual: todas las mañanas, a las ocho en punto, baja a comprar el periódico. Pero desde el lunes pasado su puerta está cerrada y las luces, apagadas.", en: "Nobody has seen señor Ortega, the neighbour on the third floor, for a week. He is an elderly man, quiet and very punctual: every morning, at eight o'clock sharp, he goes down to buy the newspaper. But since last Monday his door has been shut and the lights off." }
  - { es: "En el edificio todos tienen una teoría. La portera dice que estará en el pueblo con su hermana, porque en verano suele pasar allí unos días. Sin embargo, estamos en noviembre y el señor Ortega nunca viaja en invierno.", en: "In the building everyone has a theory. The caretaker says he is probably in the village with his sister, because in summer he usually spends a few days there. However, it is November and señor Ortega never travels in winter." }
  - { es: "Lucía, la vecina del segundo, no está tan tranquila. Anteayer oyó ruidos extraños en el piso de arriba a las dos de la madrugada: pasos, una puerta y después silencio. «Si estuviera de viaje, no habría nadie en casa», piensa. «Alguien tiene que haber entrado».", en: "Lucía, the neighbour on the second floor, is not so calm. The day before yesterday she heard strange noises in the flat upstairs at two in the morning: footsteps, a door and then silence. 'If he were away, there would be nobody at home,' she thinks. 'Someone must have got in.'" }
  - { es: "Su marido, Tomás, no le da importancia. «Habrá sido el gato», dice. «O los vecinos del cuarto, que siempre llegan tarde. Yo que tú no me preocuparía». Pero Lucía no está convencida: el señor Ortega no tiene gato, y los del cuarto están de vacaciones.", en: "Her husband, Tomás, does not think it matters. 'It'll have been the cat,' he says. 'Or the neighbours on the fourth floor, who always get home late. If I were you I wouldn't worry.' But Lucía is not convinced: señor Ortega does not have a cat, and the people on the fourth floor are on holiday." }
  - { es: "El miércoles, Lucía decide averiguar qué ha pasado. Llama a la puerta del tercero varias veces y nadie contesta. Entonces se da cuenta de un detalle: el buzón está lleno de cartas y hay huellas de barro en la escalera. Huellas grandes, de hombre, y recientes.", en: "On Wednesday, Lucía decides to find out what has happened. She knocks on the door of the third floor several times and nobody answers. Then she notices a detail: the letterbox is full of letters and there are muddy footprints on the stairs. Big footprints, a man's, and recent ones." }
  - { es: "Esa misma noche vuelve a oír los pasos. Esta vez no espera: coge el móvil y llama a la policía. Serían las once cuando llegan dos agentes. Suben despacio, llaman y, como nadie responde, abren la puerta con la ayuda de la portera.", en: "That same night she hears the footsteps again. This time she does not wait: she picks up her phone and calls the police. It must be about eleven when two officers arrive. They go up slowly, knock and, as nobody answers, open the door with the caretaker's help." }
  - { es: "Dentro, sentado en el sofá con una taza de té, está el señor Ortega. Está pálido y lleva una pierna vendada. Explica que se cayó en el baño hace una semana y que su sobrino, que es enfermero, viene cada noche después del trabajo para cuidarlo. «No quería molestar a nadie», dice, sorprendido de ver a tanta gente en su salón.", en: "Inside, sitting on the sofa with a cup of tea, is señor Ortega. He is pale and has a bandaged leg. He explains that he fell in the bathroom a week ago and that his nephew, who is a nurse, comes every night after work to look after him. 'I didn't want to bother anyone,' he says, surprised to see so many people in his living room." }
  - { es: "Lucía se pone roja de vergüenza, pero el señor Ortega se ríe: «No se preocupe. Es bueno saber que alguien vigila». Al día siguiente, a las ocho en punto, Lucía le sube el periódico.", en: "Lucía goes red with embarrassment, but señor Ortega laughs: 'Don't worry. It's good to know that someone is keeping watch.' The next day, at eight o'clock sharp, Lucía takes the newspaper up to him." }
questions:
  - { q: "Why does the caretaker's theory not convince the neighbours?", options: ["Señor Ortega has no sister", "Señor Ortega never travels in winter", "Señor Ortega hates the village"], answer: 1 }
  - { q: "What did Lucía hear at two in the morning?", options: ["A cat", "Music from the fourth floor", "Footsteps and a door"], answer: 2 }
  - { q: "What detail does Lucía notice on Wednesday?", options: ["The door is open", "The letterbox is full and there are muddy footprints", "The lights are on"], answer: 1 }
  - { q: "Who had been coming to the flat at night?", options: ["A burglar", "Señor Ortega's nephew, a nurse", "The police"], answer: 1 }
glossary:
  - { es: teoría, en: theory }
  - { es: portera, en: caretaker (woman) }
  - { es: dar importancia, en: to think something matters }
  - { es: convencido, en: convinced }
  - { es: barro, en: mud }
  - { es: agente, en: (police) officer }
  - { es: responder, en: to answer }
  - { es: pálido, en: pale }
  - { es: vendado, en: bandaged }
  - { es: sobrino, en: nephew }
  - { es: cuidar, en: to look after }
  - { es: vergüenza, en: embarrassment }
