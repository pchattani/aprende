id: r.a2.quand-j-etais-petite-a-etretat
level: a2
title: Quand j'étais petite, à Étretat
kind: text
intro: Monique, a grandmother, remembers the summers of her childhood in Étretat, the Normandy seaside town famous for its white cliffs.
allow: [monique, arsène, lupin, leblanc, maurice, ok]
paragraphs:
  - { es: "Quand j'étais petite, je passais tous mes étés à Étretat, chez mes grands-parents. Ils avaient une vieille maison près de la plage. Nous partions de Paris en juillet et nous restions deux mois. Pour moi, c'était le paradis.", en: "When I was little, I spent all my summers in Étretat, at my grandparents' house. They had an old house near the beach. We left Paris in July and stayed for two months. For me it was paradise." }
  - { es: "Le matin, mon grand-père m'emmenait au port. Il connaissait tous les pêcheurs et il achetait du poisson pour le déjeuner. Moi, je regardais les bateaux et les mouettes. Ma grand-mère restait à la maison : elle faisait la cuisine et elle chantait toujours.", en: "In the morning my grandfather took me to the harbour. He knew all the fishermen and bought fish for lunch. I watched the boats and the seagulls. My grandmother stayed at home: she cooked and was always singing." }
  - { es: "L'après-midi, nous allions à la plage. À Étretat, il n'y a pas de sable : la plage est en galets. Ce n'était pas très confortable, mais je m'en fichais ! Je me baignais avec mes cousins, même quand l'eau était froide. Nous cherchions des coquillages et nous jouions au ballon.", en: "In the afternoon we went to the beach. In Étretat there's no sand: the beach is made of pebbles. It wasn't very comfortable, but I didn't care! I swam with my cousins, even when the water was cold. We looked for shells and played ball." }
  - { es: "Le plus beau, c'étaient les falaises. Elles sont blanches, très hautes, et il y a des arches dans la mer. Il y a aussi une grande pierre au milieu de l'eau : on l'appelle l'Aiguille. Le dimanche, nous montions sur la falaise avec mon père. Le vent était fort, et en haut, on voyait la mer partout. J'avais un peu peur, mais c'était magnifique.", en: "The most beautiful thing was the cliffs. They're white, very high, and there are arches in the sea. There's also a big rock in the middle of the water: it's called the Needle. On Sundays we climbed up the cliff with my father. The wind was strong, and at the top you could see the sea everywhere. I was a bit scared, but it was magnificent." }
  - { es: "Le soir, mon grand-père racontait des histoires. Il adorait les romans de Maurice Leblanc. Leblanc habitait à Étretat et il écrivait les aventures d'Arsène Lupin, un voleur très élégant. Dans un roman, Lupin cache un trésor dans l'Aiguille ! Moi, je croyais que c'était vrai. Je regardais l'Aiguille par la fenêtre et je cherchais le voleur.", en: "In the evening my grandfather told stories. He loved Maurice Leblanc's novels. Leblanc lived in Étretat and wrote the adventures of Arsène Lupin, a very elegant thief. In one novel, Lupin hides a treasure in the Needle! I believed it was true. I looked at the Needle through the window and searched for the thief." }
  - { es: "Aujourd'hui, j'ai soixante-quinze ans. Mes grands-parents sont morts depuis longtemps et la maison n'est plus à notre famille. Mais chaque été, je retourne à Étretat avec mes petits-enfants. Ils se baignent, ils cherchent des coquillages… et ils cherchent toujours le trésor d'Arsène Lupin.", en: "Today I'm seventy-five. My grandparents died a long time ago and the house no longer belongs to our family. But every summer I go back to Étretat with my grandchildren. They swim, they look for shells… and they're still looking for Arsène Lupin's treasure." }
questions:
  - { q: "Où Monique passait-elle ses étés ?", options: ["À Paris", "Chez ses grands-parents à Étretat", "Au Mont-Saint-Michel"], answer: 1, explain: "«Je passais tous mes étés à Étretat, chez mes grands-parents.»" }
  - { q: "Que faisait le grand-père le matin ?", options: ["Il faisait la cuisine", "Il allait au port et achetait du poisson", "Il dormait"], answer: 1, explain: "«Mon grand-père m'emmenait au port… il achetait du poisson pour le déjeuner.»" }
  - { q: "Comment est la plage d'Étretat ?", options: ["Elle est en sable blanc", "Elle est en galets", "Il n'y a pas de plage"], answer: 1, explain: "«Il n'y a pas de sable : la plage est en galets.»" }
  - { q: "Qu'est-ce que l'Aiguille ?", options: ["Une grande pierre dans la mer", "Un bateau", "Une maison sur la falaise"], answer: 0, explain: "«Une grande pierre au milieu de l'eau : on l'appelle l'Aiguille.»" }
  - { q: "Qui est Arsène Lupin ?", options: ["Un pêcheur d'Étretat", "Le grand-père de Monique", "Un voleur dans les romans de Maurice Leblanc"], answer: 2, explain: "Leblanc «écrivait les aventures d'Arsène Lupin, un voleur très élégant»." }
