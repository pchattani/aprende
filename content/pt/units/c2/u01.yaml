id: c2.u01
title: "Olá, estás bom?"
lessons:
  - id: c2.u01.l1
    title: Então, estás bom?
    teach: [g.ep-tu-forms]
    vocab: [w.estás-bom, w.está-lá, w.pá, w.malta, w.fixe, w.porreiro, w.giro, w.bué, w.ora, w.ti]
    tip: "In Portugal tu has its own verb forms in every tense (tu falas, tu foste, se tu quiseres); tu vai sounds Brazilian."
    sentences:
      - { es: "Olá, Rita! Então, estás boa?", en: "Hi, Rita! So, how are you?", altEs: ["Olá, Rita! Estás boa?", "Olá, Rita! Então, tudo bem?", "Oi, Rita! Tudo bem?", "Oi, Rita! Você está bem?"], altEn: ["Hi, Rita! So, are you well?"], grammar: [g.ep-tu-forms, g.greetings], vocab: [w.estás-bom] }
      - { es: "Tu és de Lisboa ou estás cá de férias?", en: "Are you from Lisbon or are you here on holiday?", altEs: ["És de Lisboa ou estás cá de férias?", "Tu és de Lisboa ou estás cá de passagem?", "Você é de Lisboa ou está aqui de férias?"], altEn: ["Are you from Lisbon or are you here on vacation?"], grammar: [g.ep-tu-forms, g.ser-vs-estar-basics] }
      - { es: "Moras em Alfama há muito tempo?", en: "Have you lived in Alfama for long?", altEs: ["Vives em Alfama há muito tempo?", "Tu moras em Alfama há muito tempo?", "Você mora em Alfama há muito tempo?"], altEn: ["Have you been living in Alfama for a long time?"], grammar: [g.ep-tu-forms, g.ha-faz-time] }
      - { es: "Onde foste ontem à noite? Ninguém te viu na tasca.", en: "Where did you go last night? Nobody saw you at the tasca.", altEs: ["Aonde foste ontem à noite? Ninguém te viu na tasca.", "Onde é que foste ontem à noite? Ninguém te viu na tasca.", "Aonde você foi ontem à noite? Ninguém te viu no boteco."], grammar: [g.ep-tu-forms, g.preterite-ser-ir], vocab: [w.tasca], error: { wrong: "Onde fostes ontem à noite? Ninguém te viu na tasca.", explain: "The tu preterite ends in -ste with no final s: foste, falaste, fizeste.", grammar: g.ep-tu-forms } }
      - { es: "Tens bué de sorte: a tua casa tem vista para o rio.", en: "You're really lucky: your house has a view of the river.", altEs: ["Tens imensa sorte: a tua casa tem vista para o rio.", "Tens muita sorte: a tua casa tem vista para o rio.", "Você tem muita sorte: sua casa tem vista para o rio."], altEn: ["You're so lucky: your house looks out over the river."], grammar: [g.ep-tu-forms, g.ep-articles-names-possessives], vocab: [w.bué], note: "Bué (de) is Lisbon youth slang for 'loads, very', borrowed from Angolan Portuguese." }
      - { es: "Se quiseres, mostro-te o Miradouro de Santa Luzia.", en: "If you like, I'll show you the Santa Luzia viewpoint.", altEs: ["Se tu quiseres, mostro-te o Miradouro de Santa Luzia.", "Se quiseres, eu mostro-te o Miradouro de Santa Luzia.", "Se você quiser, te mostro o Mirante de Santa Luzia."], altEn: ["If you want, I'll show you the Santa Luzia viewpoint."], grammar: [g.ep-tu-forms, g.future-subjunctive-se, g.ep-enclisis], vocab: [w.miradouro], transform: { instruction: "Say it the Brazilian way, to someone you call você", answer: "Se você quiser, te mostro o Miradouro de Santa Luzia.", alt: ["Se você quiser, eu te mostro o Miradouro de Santa Luzia.", "Se você quiser, te mostro o Mirante de Santa Luzia."] } }
      - { es: "Esta malta é bué fixe; vens connosco ao arraial?", en: "These guys are really cool; are you coming to the street party with us?", altEs: ["Esta malta é muito fixe; vens connosco ao arraial?", "A malta é bué fixe; vens connosco ao arraial?", "Essa galera é muito legal; você vem com a gente pro arraial?"], altEn: ["This crowd is really cool; are you coming to the street party with us?"], grammar: [g.ep-tu-forms, g.vir-vs-ver], vocab: [w.malta, w.fixe, w.arraial] }
      - { es: "Que giro! Fizeste tu este azulejo?", en: "How cute! Did you make this tile yourself?", altEs: ["Que giro! Foste tu que fizeste este azulejo?", "Que giro! Este azulejo fizeste tu?", "Que bonitinho! Foi você que fez esse azulejo?"], altEn: ["How lovely! Did you make this tile?"], grammar: [g.ep-tu-forms, g.preterite-irregular], vocab: [w.giro] }
      - { es: "Está lá? Pedro, ouves-me bem?", en: "Hello? Pedro, can you hear me all right?", altEs: ["Estou? Pedro, ouves-me bem?", "Está lá? Ó Pedro, ouves-me bem?", "Alô? Pedro, você está me ouvindo bem?"], altEn: ["Hello? Pedro, can you hear me OK?"], grammar: [g.ep-tu-forms, g.ep-enclisis], vocab: [w.está-lá], note: "On the phone, Portugal answers Está lá? or Estou?; Brazil says Alô?" }
      - { es: "Não sabes onde fica a casa de fados da Dona Amélia?", en: "Don't you know where Dona Amélia's fado house is?", altEs: ["Sabes onde fica a casa de fados da Dona Amélia?", "Não sabes onde é a casa de fados da Dona Amélia?", "Você não sabe onde fica a casa de fados da Dona Amélia?"], grammar: [g.ep-tu-forms, g.saber-vs-conhecer], vocab: [w.casa-de-fados] }
      - { es: "Pá, tu tinhas razão: o fado aqui é outra coisa.", en: "Man, you were right: fado here is something else.", altEs: ["Pá, tinhas razão: o fado aqui é outra coisa.", "Pá, tu tinhas razão, o fado aqui é outra coisa.", "Cara, você tinha razão: o fado aqui é outra coisa."], altEn: ["Mate, you were right: fado here is something else."], grammar: [g.ep-tu-forms, g.imperfect], vocab: [w.pá, w.fado] }
      - { es: "Ora, isso depende de ti.", en: "Well, that depends on you.", altEs: ["Ora, isso é contigo.", "Ora bem, isso depende de ti.", "Bom, isso depende de você."], altEn: ["Well, that's up to you."], grammar: [g.ep-tu-forms, g.prepositional-pronouns], vocab: [w.ora, w.ti] }
      - { es: "Quando vieres a Lisboa outra vez, ficas cá em casa.", en: "When you come to Lisbon again, you'll stay at our place.", altEs: ["Quando vieres outra vez a Lisboa, ficas cá em casa.", "Quando tu vieres a Lisboa outra vez, ficas cá em casa.", "Quando você vier a Lisboa de novo, fica aqui em casa."], altEn: ["Next time you come to Lisbon, you'll stay with us."], grammar: [g.ep-tu-forms, g.future-subjunctive-time], transform: { instruction: "Say it to two friends (vocês)", answer: "Quando vierem a Lisboa outra vez, ficam cá em casa.", alt: ["Quando vocês vierem a Lisboa outra vez, ficam cá em casa.", "Quando vierem outra vez a Lisboa, ficam cá em casa."] } }
      - { es: "O concerto foi porreiro, mas tu cantaste melhor do que a fadista.", en: "The concert was great, but you sang better than the fado singer.", altEs: ["O concerto foi porreiro, mas cantaste melhor do que a fadista.", "O concerto foi porreiro, mas tu cantaste melhor que a fadista.", "O show foi ótimo, mas você cantou melhor do que a fadista."], grammar: [g.ep-tu-forms, g.comparatives], vocab: [w.porreiro, w.fadista, w.concerto] }
      - { es: "Tu vais ao arraial de Santo António?", en: "Are you going to the Santo António street party?", altEs: ["Vais ao arraial de Santo António?", "Tu vais ao arraial do Santo António?", "Você vai ao arraial de Santo Antônio?"], grammar: [g.ep-tu-forms, g.ir-present], vocab: [w.arraial], error: { wrong: "Tu vai ao arraial de Santo António?", explain: "In Portugal tu takes its own second-person form: tu vais, not tu vai.", grammar: g.ep-tu-forms } }
    exchanges:
      - q: { es: "Olá! Então, estás bom?", en: "Hi! So, how are you?" }
        a: { es: "Estou ótimo, e tu?", en: "I'm great, and you?" }
        alt: ["Estou bem, obrigado. E tu?", "Tudo bem, e tu?", "Mais ou menos, e tu?"]
        grammar: [g.ep-tu-forms, g.greetings]
        vocab: [w.estás-bom]
      - q: { es: "Onde estiveste o fim de semana todo?", en: "Where were you all weekend?" }
        a: { es: "Fui ao Porto ver os meus pais.", en: "I went to Porto to see my parents." }
        alt: ["Estive no Porto com os meus pais.", "Fiquei em casa a descansar."]
        grammar: [g.ep-tu-forms, g.preterite-irregular]
        vocab: [w.fim-de-semana]
      - q: { es: "Queres vir connosco ao miradouro?", en: "Do you want to come to the viewpoint with us?" }
        a: { es: "Quero, claro! Esperas por mim cinco minutos?", en: "I do, of course! Will you wait five minutes for me?" }
        alt: ["Claro que quero!", "Hoje não posso, mas obrigado."]
        grammar: [g.ep-tu-forms]
        vocab: [w.miradouro]
      - q: { es: "Está lá? Quem fala?", en: "Hello? Who's speaking?" }
        a: { es: "Sou eu, a Marta. Não reconheces a minha voz?", en: "It's me, Marta. Don't you recognise my voice?" }
        alt: ["É a Marta. Não me reconheces?", "Sou eu, pá!"]
        grammar: [g.ep-tu-forms, g.ep-articles-names-possessives]
        vocab: [w.está-lá]
      - q: { es: "Gostaste do fado ontem?", en: "Did you like the fado yesterday?" }
        a: { es: "Bué! A fadista tinha uma voz incrível.", en: "Loads! The fado singer had an incredible voice." }
        alt: ["Gostei imenso.", "Adorei, foi porreiro."]
        grammar: [g.ep-tu-forms, g.preterite-regular]
        vocab: [w.bué, w.fadista]
    texts:
      - title: "Mensagem da Rita"
        es: ["Olá! Estás boa?", "Logo à noite a malta vai ao arraial em Alfama.", "Se quiseres vir, encontramo-nos às nove no miradouro."]
        en: ["Hi! How are you?", "Tonight the gang is going to the street party in Alfama.", "If you want to come, we'll meet at nine at the viewpoint."]
        grammar: [g.ep-tu-forms, g.future-subjunctive-se]
        vocab: [w.estás-bom, w.malta, w.arraial, w.miradouro]
      - title: "Postal de Lisboa"
        es: ["Querida Ana, estou em Alfama e tu tinhas razão: isto é bué giro.", "Ontem ouvi fado numa tasca pequenina.", "Quando vieres, levo-te lá."]
        en: ["Dear Ana, I'm in Alfama and you were right: it's really lovely.", "Yesterday I heard fado in a tiny tasca.", "When you come, I'll take you there."]
        grammar: [g.ep-tu-forms, g.future-subjunctive-time]
        vocab: [w.bué, w.giro, w.tasca]
    spicy:
      - { es: "Tu és sempre assim tão giro ou só quando há fado?", en: "Are you always this cute or only when there's fado?", altEs: ["Tu és sempre assim tão gira ou só quando há fado?", "És sempre assim tão giro ou só quando há fado?", "Você é sempre bonitinho assim ou só quando tem fado?"], grammar: [g.ep-tu-forms], vocab: [w.giro, w.fado] }
      - { es: "Se cantares assim outra vez, apaixono-me já aqui na tasca.", en: "If you sing like that again, I'll fall in love right here in the tasca.", altEs: ["Se tu cantares assim outra vez, apaixono-me já aqui na tasca.", "Se você cantar assim de novo, me apaixono aqui mesmo no boteco."], grammar: [g.ep-tu-forms, g.future-subjunctive-se], vocab: [w.tasca] }
      - { es: "Onde aprendeste a dançar assim, pá? Quero aulas particulares.", en: "Where did you learn to dance like that, mate? I want private lessons.", altEs: ["Onde é que aprendeste a dançar assim, pá? Quero aulas particulares.", "Onde você aprendeu a dançar assim, cara? Quero aulas particulares."], grammar: [g.ep-tu-forms, g.preterite-regular], vocab: [w.pá] }
      - { es: "Tens namorado, ou posso convidar-te para uma ginjinha?", en: "Do you have a boyfriend, or can I invite you for a ginjinha?", altEs: ["Tens namorada, ou posso convidar-te para uma ginjinha?", "Tens namorado ou posso convidar-te para uma ginjinha?", "Você tem namorado, ou posso te convidar para uma ginjinha?"], grammar: [g.ep-tu-forms, g.ep-enclisis], vocab: [w.ginjinha] }
      - { es: "Ontem fugiste a meio do arraial; hoje não te deixo fugir.", en: "Yesterday you ran off halfway through the street party; tonight I'm not letting you get away.", altEs: ["Ontem fugiste a meio do arraial, hoje não te deixo fugir.", "Ontem você fugiu no meio do arraial; hoje não te deixo fugir."], grammar: [g.ep-tu-forms, g.preterite-irregular], vocab: [w.arraial] }
  - id: c2.u01.l2
    title: O senhor deseja?
    teach: [g.ep-forms-of-address]
    vocab: [w.menina, w.senhor-doutor, w.cerimónia, w.se-faz-favor, w.ora-essa, w.cumprimentar, w.cumprimento, w.tratar-por-tu, w.à-vontade]
    tip: "With strangers, drop the pronoun or say o senhor / a senhora; with acquaintances, use their name in the third person. Save você for when you are sure."
    sentences:
      - { es: "O senhor deseja mais alguma coisa?", en: "Would you like anything else, sir?", altEs: ["Deseja mais alguma coisa?", "O senhor quer mais alguma coisa?", "O senhor vai querer mais alguma coisa?"], altEn: ["Anything else, sir?"], grammar: [g.ep-forms-of-address] }
      - { es: "A conta, se faz favor.", en: "The bill, please.", altEs: ["A conta, por favor.", "Pode trazer a conta, se faz favor?", "Traz-me a conta, se faz favor."], altEn: ["Could I have the bill, please?", "The check, please."], grammar: [g.ep-forms-of-address, g.polite-requests], vocab: [w.se-faz-favor] }
      - { es: "A menina é brasileira? Fala tão bem!", en: "Are you Brazilian, miss? You speak so well!", altEs: ["A senhora é brasileira? Fala tão bem!", "É brasileira? Fala tão bem!", "Você é brasileira? Fala tão bem!"], grammar: [g.ep-forms-of-address], vocab: [w.menina], transform: { instruction: "Ask a friend the same thing, using tu", answer: "És brasileira? Falas tão bem!", alt: ["Tu és brasileira? Falas tão bem!"] } }
      - { es: "A Dona Fernanda já almoçou?", en: "Have you had lunch yet, Dona Fernanda?", altEs: ["A senhora já almoçou, Dona Fernanda?", "Dona Fernanda, a senhora já almoçou?"], altEn: ["Have you eaten lunch yet, Dona Fernanda?"], grammar: [g.ep-forms-of-address], note: "Said to Dona Fernanda herself: using someone's name in the third person is polite in Portugal." }
      - { es: "O senhor doutor faz o favor de assinar aqui.", en: "Would you sign here, please, doctor.", altEs: ["O senhor doutor pode assinar aqui, se faz favor?", "Faz favor de assinar aqui, senhor doutor.", "O senhor pode assinar aqui, doutor?"], altEn: ["Please sign here, doctor."], grammar: [g.ep-forms-of-address, g.formal-address-titles], vocab: [w.senhor-doutor] }
      - { es: "Em Portugal, tratar alguém por você pode parecer distante.", en: "In Portugal, addressing someone as você can seem distant.", altEs: ["Em Portugal, tratar uma pessoa por você pode parecer distante.", "Em Portugal, chamar alguém de você pode parecer distante."], altEn: ["In Portugal, calling someone você can come across as distant."], grammar: [g.ep-forms-of-address], vocab: [w.tratar-por-tu] }
      - { es: "Deixe-se de cerimónias e trate-me por tu!", en: "Stop being so formal and call me tu!", altEs: ["Deixa-te de cerimónias e trata-me por tu!", "Deixe-se de cerimónias: trate-me por tu!", "Deixe de cerimônia e me trate por tu!"], altEn: ["Drop the formalities and call me tu!"], grammar: [g.ep-forms-of-address, g.imperative-formal], vocab: [w.cerimónia, w.tratar-por-tu] }
      - { es: "Esteja à vontade, a casa é sua.", en: "Make yourself at home, the house is yours.", altEs: ["Fique à vontade, a casa é sua.", "Está à vontade, a casa é tua.", "Esteja à vontade, que a casa é sua."], altEn: ["Make yourself at home."], grammar: [g.ep-forms-of-address, g.imperative-formal], vocab: [w.à-vontade] }
      - { es: "Muito obrigada pela ajuda! — Ora essa, não tem de quê.", en: "Thank you so much for your help! — Don't mention it.", altEs: ["Muito obrigada pela ajuda! — Ora essa!", "Muito obrigada pela ajuda! — Imagina, não tem de quê."], altEn: ["Thanks a lot for the help! — Not at all."], grammar: [g.ep-forms-of-address, g.greetings], vocab: [w.ora-essa] }
      - { es: "Em Portugal, as pessoas cumprimentam-se com dois beijinhos.", en: "In Portugal, people greet each other with two kisses on the cheek.", altEs: ["Em Portugal, cumprimenta-se com dois beijinhos.", "Em Portugal, as pessoas se cumprimentam com dois beijinhos."], grammar: [g.ep-forms-of-address, g.ep-enclisis], vocab: [w.cumprimentar], note: "Men usually shake hands with each other; between women, or a man and a woman, it's two kisses, right cheek first." }
      - { es: "Dê os meus cumprimentos à sua mãe.", en: "Give my regards to your mother.", altEs: ["Dê cumprimentos meus à sua mãe.", "Dê os meus cumprimentos à senhora sua mãe.", "Mande lembranças minhas para a sua mãe."], altEn: ["Send my regards to your mother."], grammar: [g.ep-forms-of-address, g.imperative-formal], vocab: [w.cumprimento] }
      - { es: "O Pedro quer sentar-se? Há aqui uma cadeira livre.", en: "Would you like to sit down, Pedro? There's a free chair here.", altEs: ["Quer sentar-se, Pedro? Há aqui uma cadeira livre.", "O Pedro quer sentar-se? Está aqui uma cadeira livre.", "Você quer se sentar, Pedro? Tem uma cadeira livre aqui."], grammar: [g.ep-forms-of-address, g.ep-enclisis], transform: { instruction: "Ask an older man the same thing, using o senhor", answer: "O senhor quer sentar-se? Há aqui uma cadeira livre.", alt: ["O senhor quer sentar-se? Está aqui uma cadeira livre."] } }
      - { es: "A senhora quer um café?", en: "Would you like a coffee, madam?", altEs: ["Quer um café?", "A senhora deseja um café?", "A senhora aceita um café?"], altEn: ["Would you like a coffee?"], grammar: [g.ep-forms-of-address], error: { wrong: "Você quer um café?", explain: "To an older Portuguese woman, você can sound distant or even rude: say a senhora, or just use the verb.", grammar: g.ep-forms-of-address } }
      - { es: "Os senhores precisam de ajuda com as malas?", en: "Do you need help with your bags?", altEs: ["Precisam de ajuda com as malas?", "Os senhores precisam de ajuda com a bagagem?", "Vocês precisam de ajuda com as malas?"], altEn: ["Do you (all) need a hand with your bags?"], grammar: [g.ep-forms-of-address, g.precisar-de] }
    exchanges:
      - q: { es: "Bom dia. O senhor deseja?", en: "Good morning. What would you like, sir?" }
        a: { es: "Uma bica e um pastel de nata, se faz favor.", en: "An espresso and a custard tart, please." }
        alt: ["Um café, se faz favor.", "Uma água, por favor."]
        grammar: [g.ep-forms-of-address, g.polite-requests]
        vocab: [w.se-faz-favor, w.bica, w.pastel-de-nata]
      - q: { es: "Posso tratá-lo por tu?", en: "May I call you tu?" }
        a: { es: "Claro, à vontade! Sem cerimónias.", en: "Of course, go ahead! No need to stand on ceremony." }
        alt: ["Claro, trata-me por tu.", "Claro que pode."]
        grammar: [g.ep-forms-of-address, g.ep-enclisis]
        vocab: [w.tratar-por-tu, w.à-vontade, w.cerimónia]
      - q: { es: "A menina deseja mais alguma coisa?", en: "Would you like anything else, miss?" }
        a: { es: "Não, obrigada. Era só isso.", en: "No, thank you. That's all." }
        alt: ["Não, obrigada.", "Só a conta, se faz favor."]
        grammar: [g.ep-forms-of-address, g.ep-imperfect-for-conditional]
        vocab: [w.menina]
      - q: { es: "Muito obrigado pela boleia!", en: "Thanks a lot for the lift!" }
        a: { es: "Ora essa! Foi um prazer.", en: "Don't mention it! It was a pleasure." }
        alt: ["Não tem de quê.", "De nada!"]
        grammar: [g.ep-forms-of-address, g.greetings]
        vocab: [w.ora-essa, w.boleia]
      - q: { es: "A Dona Fernanda quer que lhe leve as compras?", en: "Would you like me to carry your shopping, Dona Fernanda?" }
        a: { es: "Ai, o menino é um amor. Deixe ficar, que eu consigo.", en: "Oh, you're a sweetheart, young man. Leave it, I can manage." }
        alt: ["Agradeço, mas eu consigo.", "Se não for maçada, agradeço."]
        grammar: [g.ep-forms-of-address, g.subjunctive-wishes]
        vocab: [w.menina]
    texts:
      - title: "Na tasca"
        es: ["— A menina deseja?", "— Um prato de sardinhas e um copo de vinho, se faz favor.", "— Com certeza. E o senhor doutor, o costume?"]
        en: ["— What would you like, miss?", "— A plate of sardines and a glass of wine, please.", "— Certainly. And you, doctor, the usual?"]
        grammar: [g.ep-forms-of-address]
        vocab: [w.menina, w.se-faz-favor, w.senhor-doutor, w.sardinha]
      - title: "Conselho de uma amiga"
        es: ["Em Portugal, não digas você à senhora da mercearia.", "Diz só «Quer?» ou «A senhora quer?».", "E se ela te tratar por tu, podes fazer o mesmo."]
        en: ["In Portugal, don't say você to the lady at the grocer's.", "Just say 'Would you like…?' or 'Would you like…, madam?'.", "And if she calls you tu, you can do the same."]
        grammar: [g.ep-forms-of-address, g.ep-imperative-tu]
        vocab: [w.tratar-por-tu, w.mercearia]
    spicy:
      - { es: "A menina está sozinha ou posso sentar-me consigo?", en: "Are you on your own, miss, or may I sit with you?", altEs: ["A senhora está sozinha ou posso sentar-me consigo?", "Está sozinha ou posso sentar-me consigo?", "Você está sozinha ou posso me sentar com você?"], grammar: [g.ep-forms-of-address, g.ep-enclisis], vocab: [w.menina] }
      - { es: "O senhor doutor também trata corações partidos?", en: "Doctor, do you treat broken hearts too?", altEs: ["O senhor doutor também cuida de corações partidos?", "Doutor, o senhor também trata corações partidos?"], grammar: [g.ep-forms-of-address, g.formal-address-titles], vocab: [w.senhor-doutor] }
      - { es: "Deixe-se de cerimónias: já dançámos juntos três vezes.", en: "Drop the formalities: we've already danced together three times.", altEs: ["Deixa-te de cerimónias: já dançámos juntos três vezes.", "Deixa de cerimônia: a gente já dançou junto três vezes."], grammar: [g.ep-forms-of-address, g.imperative-formal], vocab: [w.cerimónia] }
      - { es: "Ora essa, o prazer foi todo meu... e espero que se repita.", en: "Don't mention it, the pleasure was all mine... and I hope it happens again.", altEs: ["Ora essa, o prazer foi meu... e espero que se repita.", "Imagina, o prazer foi todo meu... e espero que se repita."], grammar: [g.ep-forms-of-address, g.subjunctive-wishes], vocab: [w.ora-essa] }
      - { es: "Esteja à vontade, mas não tanto que se esqueça do meu nome.", en: "Make yourself at home, but not so much that you forget my name.", altEs: ["Está à vontade, mas não tanto que te esqueças do meu nome.", "Fique à vontade, mas não tanto que se esqueça do meu nome."], grammar: [g.ep-forms-of-address, g.imperative-formal], vocab: [w.à-vontade] }
  - id: c2.u01.l3
    title: Diz-me por onde vou
    teach: [g.ep-imperative-tu]
    vocab: [w.ó, w.gajo, w.miúdo, w.rapariga, w.cota, w.viela]
    tip: "Affirmative tu commands use the ele form with the pronoun after (fala, diz-me); negative ones use the subjunctive with the pronoun before (não fales, não me digas)."
    sentences:
      - { es: "Sobe esta escada e vira à esquerda no fim da viela.", en: "Go up these steps and turn left at the end of the alley.", altEs: ["Sobe estas escadas e vira à esquerda no fim da viela.", "Sobe a escada e vira à esquerda no fim da viela.", "Suba essa escada e vire à esquerda no fim do beco."], altEn: ["Climb these stairs and turn left at the end of the alley."], grammar: [g.ep-imperative-tu, g.imperative-directions], vocab: [w.escada, w.viela] }
      - { es: "Não vires já; o miradouro é mais acima.", en: "Don't turn yet; the viewpoint is further up.", altEs: ["Não vires ainda; o miradouro é mais acima.", "Não vires já, que o miradouro é mais acima.", "Não vire ainda; o mirante é mais pra cima."], grammar: [g.ep-imperative-tu, g.imperative-negative], vocab: [w.miradouro] }
      - { es: "Diz-me uma coisa: tu gostas mesmo de fado?", en: "Tell me something: do you really like fado?", altEs: ["Diz-me uma coisa: gostas mesmo de fado?", "Diz-me lá: tu gostas mesmo de fado?", "Me diz uma coisa: você gosta mesmo de fado?"], grammar: [g.ep-imperative-tu, g.ep-enclisis], vocab: [w.fado] }
      - { es: "Não digas nada à avó, que é surpresa.", en: "Don't say anything to Grandma, it's a surprise.", altEs: ["Não digas nada à avó, é surpresa.", "Não digas nada à avó, que é uma surpresa.", "Não fala nada pra vó, que é surpresa."], grammar: [g.ep-imperative-tu, g.imperative-negative], error: { wrong: "Não diz nada à avó, que é surpresa.", explain: "Negative tu commands use the subjunctive in Portugal: não digas, not não diz.", grammar: g.ep-imperative-tu } }
      - { es: "Ó miúdo, anda cá e ajuda-me com estes sacos!", en: "Hey kid, come here and help me with these bags!", altEs: ["Ó miúdo, vem cá e ajuda-me com estes sacos!", "Ó miúdo, anda cá ajudar-me com estes sacos!", "Ô garoto, vem cá e me ajuda com essas sacolas!"], grammar: [g.ep-imperative-tu, g.ep-enclisis], vocab: [w.ó, w.miúdo], note: "Anda cá! (come here!) is the everyday Portuguese call; Brazil says Vem cá!" }
      - { es: "Não te preocupes, eu levo-te a casa.", en: "Don't worry, I'll take you home.", altEs: ["Não te preocupes, levo-te a casa.", "Não te preocupes que eu levo-te a casa.", "Não se preocupe, eu te levo em casa."], grammar: [g.ep-imperative-tu, g.ep-proclisis-attractors] }
      - { es: "Sê simpático com os vizinhos, que aqui toda a gente se conhece.", en: "Be nice to the neighbours, everyone knows everyone here.", altEs: ["Sê simpática com os vizinhos, que aqui toda a gente se conhece.", "Sê simpático com os vizinhos; aqui toda a gente se conhece.", "Seja simpático com os vizinhos, que aqui todo mundo se conhece."], altEn: ["Be friendly with the neighbours, everybody knows each other here."], grammar: [g.ep-imperative-tu, g.imperative-irregular] }
      - { es: "Põe o casaco, que lá em cima, no Castelo, faz vento.", en: "Put your coat on, it's windy up at the Castle.", altEs: ["Põe o casaco, que lá em cima no Castelo faz vento.", "Veste o casaco, que lá em cima, no Castelo, faz vento.", "Coloca o casaco, que lá em cima, no Castelo, venta."], grammar: [g.ep-imperative-tu, g.imperative-irregular], transform: { instruction: "Say it to two friends (vocês)", answer: "Ponham o casaco, que lá em cima, no Castelo, faz vento.", alt: ["Ponham o casaco, que lá em cima no Castelo faz vento.", "Vistam o casaco, que lá em cima, no Castelo, faz vento."] } }
      - { es: "Olha para aquele gajo da guitarra: é o neto da Dona Fernanda.", en: "Look at that guy with the guitar: he's Dona Fernanda's grandson.", altEs: ["Olha aquele gajo da guitarra: é o neto da Dona Fernanda.", "Olha para aquele gajo da guitarra, é o neto da Dona Fernanda.", "Olha aquele cara do violão: é o neto da Dona Fernanda."], grammar: [g.ep-imperative-tu, g.ep-articles-names-possessives], vocab: [w.gajo] }
      - { es: "Pergunta àquela rapariga onde fica a paragem do elétrico.", en: "Ask that girl where the tram stop is.", altEs: ["Pergunta à rapariga onde é a paragem do elétrico.", "Pergunta àquela rapariga onde é a paragem do elétrico.", "Pergunta para aquela moça onde fica o ponto do bonde."], grammar: [g.ep-imperative-tu, g.contractions-a], vocab: [w.rapariga, w.paragem, w.elétrico], note: "Rapariga is the everyday word for 'girl' in Portugal but offensive in Brazil, where you say moça or garota." }
      - { es: "Liga aos teus cotas e diz-lhes que chegaste bem.", en: "Call your folks and tell them you got here safely.", altEs: ["Liga aos teus pais e diz-lhes que chegaste bem.", "Liga aos teus cotas a dizer que chegaste bem.", "Liga pros seus pais e fala pra eles que você chegou bem."], altEn: ["Ring your parents and tell them you arrived safely."], grammar: [g.ep-imperative-tu, g.ep-enclisis], vocab: [w.cota] }
      - { es: "Não vás por aí, que essa viela não tem saída.", en: "Don't go that way, that alley's a dead end.", altEs: ["Não vás por aí; essa viela não tem saída.", "Não vás por aí, que aquela viela não tem saída.", "Não vai por aí, que esse beco não tem saída."], grammar: [g.ep-imperative-tu, g.imperative-irregular], vocab: [w.viela], transform: { instruction: "Say it to an older stranger, using the formal form", answer: "Não vá por aí, que essa viela não tem saída.", alt: ["O senhor não vá por aí, que essa viela não tem saída.", "A senhora não vá por aí, que essa viela não tem saída."] } }
      - { es: "Espera por mim à porta da Sé, não demoro nada.", en: "Wait for me at the cathedral door, I won't be a minute.", altEs: ["Espera-me à porta da Sé, não demoro nada.", "Espera por mim à porta da Sé; não demoro.", "Me espera na porta da Sé, não demoro nada."], grammar: [g.ep-imperative-tu] }
      - { es: "Não sejas tímido: canta connosco!", en: "Don't be shy: sing with us!", altEs: ["Não sejas tímida: canta connosco!", "Não sejas tímido, canta connosco!", "Não seja tímido: canta com a gente!"], grammar: [g.ep-imperative-tu, g.imperative-negative] }
      - { es: "Ouve: quando a fadista cantar, não fales nem batas palmas.", en: "Listen: while the fado singer is singing, don't talk or clap.", altEs: ["Ouve: enquanto a fadista cantar, não fales nem batas palmas.", "Ouve lá: quando a fadista cantar, não fales nem batas palmas.", "Escuta: quando a fadista cantar, não fala nem bate palma."], grammar: [g.ep-imperative-tu, g.future-subjunctive-time], vocab: [w.fadista], note: "In a fado house the room falls silent while the fadista sings: «Silêncio, que se vai cantar o fado!»" }
    exchanges:
      - q: { es: "Desculpa, onde fica o Miradouro da Graça?", en: "Excuse me, where is the Graça viewpoint?" }
        a: { es: "Sobe esta rua até ao fim e depois pergunta outra vez.", en: "Go up this street to the end and then ask again." }
        alt: ["Segue sempre em frente e sobe.", "Apanha o elétrico 28, é mais fácil."]
        grammar: [g.ep-imperative-tu, g.imperative-directions]
        vocab: [w.miradouro]
      - q: { es: "Posso pôr a mochila aqui?", en: "Can I put my backpack here?" }
        a: { es: "Põe, à vontade.", en: "Go ahead, put it there." }
        alt: ["Põe, claro.", "Aí não; põe ali no canto."]
        grammar: [g.ep-imperative-tu, g.imperative-irregular]
        vocab: [w.à-vontade]
      - q: { es: "Vou contar tudo à Rita.", en: "I'm going to tell Rita everything." }
        a: { es: "Não lhe digas nada, por favor!", en: "Don't tell her anything, please!" }
        alt: ["Não digas nada!", "Nem penses!"]
        grammar: [g.ep-imperative-tu, g.ep-proclisis-attractors]
      - q: { es: "Mãe, posso ir ao arraial com a malta?", en: "Mum, can I go to the street party with the gang?" }
        a: { es: "Vai, mas não chegues tarde.", en: "Go, but don't be back late." }
        alt: ["Podes ir, mas liga-me.", "Vai, mas não te demores."]
        grammar: [g.ep-imperative-tu, g.imperative-negative]
        vocab: [w.arraial, w.malta]
      - q: { es: "Estou perdido nestas vielas...", en: "I'm lost in these alleys..." }
        a: { es: "Não te preocupes: diz-me onde estás e eu vou buscar-te.", en: "Don't worry: tell me where you are and I'll come and get you." }
        alt: ["Manda-me a tua localização.", "Calma, espera aí que eu vou ter contigo."]
        grammar: [g.ep-imperative-tu, g.ep-enclisis]
        vocab: [w.viela]
    texts:
      - title: "Instruções da Dona Fernanda"
        es: ["Sai do elétrico na Sé e sobe a rua à esquerda.", "Não te percas nas vielas: não vires antes da igreja.", "Bate à porta verde duas vezes e espera, que eu demoro a descer."]
        en: ["Get off the tram at the cathedral and go up the street on the left.", "Don't get lost in the alleys: don't turn before the church.", "Knock twice on the green door and wait, I take a while to come down."]
        grammar: [g.ep-imperative-tu, g.imperative-negative]
        vocab: [w.elétrico, w.viela]
    spicy:
      - { es: "Olha para mim quando cantas, não para a guitarra.", en: "Look at me when you sing, not at the guitar.", altEs: ["Olha para mim enquanto cantas, não para a guitarra.", "Olha pra mim quando você canta, não pro violão."], grammar: [g.ep-imperative-tu, g.ep-tu-forms] }
      - { es: "Não sejas tímido: diz-me o teu nome antes que acabe o fado.", en: "Don't be shy: tell me your name before the fado ends.", altEs: ["Não sejas tímida: diz-me o teu nome antes que acabe o fado.", "Não seja tímido: me diz seu nome antes que o fado acabe."], grammar: [g.ep-imperative-tu, g.ep-enclisis] }
      - { es: "Senta-te ao pé de mim, que a viela é estreita e a noite é longa.", en: "Sit next to me, the alley is narrow and the night is long.", altEs: ["Senta-te aqui ao pé de mim, que a viela é estreita e a noite é longa.", "Senta aqui do meu lado, que o beco é estreito e a noite é longa."], grammar: [g.ep-imperative-tu, g.ep-enclisis], vocab: [w.viela] }
      - { es: "Não me olhes assim, que eu fico vermelha.", en: "Don't look at me like that, you'll make me blush.", altEs: ["Não me olhes assim, que eu fico vermelho.", "Não me olha assim, que eu fico vermelha."], grammar: [g.ep-imperative-tu, g.imperative-negative] }
      - { es: "Ó gajo da guitarra, toca outra vez, que a minha amiga gostou de ti.", en: "Hey, guitar guy, play it again, my friend likes you.", altEs: ["Ó gajo da guitarra, toca outra vez, que a minha amiga gostou muito de ti.", "Ô cara do violão, toca de novo, que minha amiga gostou de você."], grammar: [g.ep-imperative-tu, g.ep-articles-names-possessives], vocab: [w.ó, w.gajo] }
  - id: c2.u01.l4
    title: Tu, você ou o senhor?
    teach: [g.ep-forms-of-address, g.ep-tu-forms]
    vocab: [w.tuga, w.zuca, w.lusodescendente, w.ora-bem, w.lisboeta]
    tip: "Moving from o senhor to tu is the older person's call: wait until you hear Trata-me por tu."
    sentences:
      - { es: "Ora bem, vamos lá ver: tu és zuca ou tuga?", en: "Right then, let's see: are you Brazilian or Portuguese?", altEs: ["Ora bem, vamos lá ver: és zuca ou tuga?", "Ora bem: tu és zuca ou tuga?", "Bom, vamos ver: você é brasileiro ou português?"], grammar: [g.ep-tu-forms, g.slang-br-pt], vocab: [w.ora-bem, w.zuca, w.tuga], note: "Zuca and tuga are slang: friendly among friends, but not for strangers." }
      - { es: "No Brasil toda a gente diz você; aqui dizes tu aos amigos e o senhor aos mais velhos.", en: "In Brazil everyone says você; here you say tu to your friends and o senhor to older people.", altEs: ["No Brasil toda a gente diz você; aqui diz-se tu aos amigos e o senhor aos mais velhos.", "No Brasil todo mundo diz você; aqui você diz tu aos amigos e o senhor aos mais velhos."], grammar: [g.ep-forms-of-address, g.address-across-lusophone] }
      - { es: "A Júlia é lusodescendente: nasceu em São Paulo, mas os avós eram de Alfama.", en: "Júlia is of Portuguese descent: she was born in São Paulo, but her grandparents were from Alfama.", altEs: ["A Júlia é lusodescendente; nasceu em São Paulo, mas os avós dela eram de Alfama.", "Júlia é lusodescendente: nasceu em São Paulo, mas os avós eram de Alfama."], grammar: [g.ep-articles-names-possessives, g.preterite-vs-imperfect], vocab: [w.lusodescendente] }
      - { es: "Quando conheceste a Dona Fernanda, trataste-a por tu?", en: "When you met Dona Fernanda, did you call her tu?", altEs: ["Quando conheceste a Dona Fernanda, trataste-a logo por tu?", "Quando você conheceu a Dona Fernanda, tratou ela por tu?"], grammar: [g.ep-tu-forms, g.ep-forms-of-address], vocab: [w.tratar-por-tu], error: { wrong: "Quando conhecestes a Dona Fernanda, trataste-a por tu?", explain: "The tu preterite ends in -ste: conheceste (conhecestes is non-standard).", grammar: g.ep-tu-forms } }
      - { es: "Nem pensar! Tratei-a por senhora até ela me dizer: «Trata-me por tu, filha.»", en: "No way! I called her senhora until she said to me: 'Call me tu, dear.'", altEs: ["Nem pensar! Tratei-a por a senhora até ela me dizer: «Trata-me por tu, filha.»", "Que nada! Chamei ela de senhora até ela me dizer: «Me chama de tu, filha.»"], grammar: [g.ep-forms-of-address, g.ep-imperative-tu] }
      - { es: "O senhor importa-se que eu me sente aqui?", en: "Do you mind if I sit here, sir?", altEs: ["Importa-se que eu me sente aqui?", "O senhor importa-se que me sente aqui?", "O senhor se importa se eu me sentar aqui?"], grammar: [g.ep-forms-of-address, g.subjunctive-emotion], transform: { instruction: "Ask a friend the same thing, using tu", answer: "Importas-te que eu me sente aqui?", alt: ["Importas-te que me sente aqui?", "Tu importas-te que eu me sente aqui?"] } }
      - { es: "Se tratares a minha avó por você, ela fica ofendida.", en: "If you call my grandmother você, she'll be offended.", altEs: ["Se tratares a minha avó por você, ela ofende-se.", "Se tu tratares a minha avó por você, ela fica ofendida.", "Se você chamar minha avó de você, ela fica ofendida."], grammar: [g.ep-forms-of-address, g.future-subjunctive-se] }
      - { es: "Para chamar o empregado de mesa, basta dizer «Faz favor!».", en: "To call the waiter over, you just say 'Excuse me!'.", altEs: ["Para chamar o empregado, basta dizer «Faz favor!».", "Para chamar o empregado de mesa, chega dizer «Faz favor!».", "Para chamar o garçom, basta dizer «Por favor!»."], grammar: [g.ep-forms-of-address], vocab: [w.empregado-de-mesa] }
      - { es: "Os senhores vieram ver os casamentos de Santo António?", en: "Have you come to see the Santo António weddings?", altEs: ["Vieram ver os casamentos de Santo António?", "Os senhores vieram ver os Casamentos de Santo António?", "Vocês vieram ver os casamentos de Santo Antônio?"], grammar: [g.ep-forms-of-address, g.preterite-dar-ver-vir], note: "Every June, on the eve of Santo António, Lisbon's popular saint, the city holds a group wedding for couples from its neighbourhoods." }
      - { es: "Falas como uma lisboeta; ninguém diria que és brasileira.", en: "You talk like a Lisbon local; nobody would guess you're Brazilian.", altEs: ["Tu falas como uma lisboeta; ninguém diria que és brasileira.", "Falas como uma lisboeta, ninguém diria que és brasileira.", "Você fala como uma lisboeta; ninguém diria que é brasileira."], grammar: [g.ep-tu-forms, g.conditional-simple], vocab: [w.lisboeta], transform: { instruction: "Say it to an older woman, using a senhora", answer: "A senhora fala como uma lisboeta; ninguém diria que é brasileira.", alt: ["Fala como uma lisboeta; ninguém diria que é brasileira."] }, error: { wrong: "Tu fala como uma lisboeta; ninguém diria que és brasileira.", explain: "Don't mix tu with você forms: tu falas.", grammar: g.ep-tu-forms } }
      - { es: "Em Portugal, quem tem licenciatura é muitas vezes tratado por doutor.", en: "In Portugal, anyone with a degree is often addressed as doutor.", altEs: ["Em Portugal, quem tem uma licenciatura é muitas vezes tratado por doutor.", "Em Portugal, quem tem faculdade é muitas vezes chamado de doutor."], grammar: [g.ep-forms-of-address, g.passive-ser], vocab: [w.licenciatura, w.senhor-doutor] }
      - { es: "Pá, deixa-te de cerimónias: somos amigos há dez anos!", en: "Come on, drop the formalities: we've been friends for ten years!", altEs: ["Pá, deixa-te de cerimónias, somos amigos há dez anos!", "Cara, deixa de cerimônia: a gente é amigo há dez anos!"], grammar: [g.ep-imperative-tu, g.ha-faz-time], vocab: [w.pá, w.cerimónia] }
      - { es: "Se não souberes como tratar alguém, usa só o verbo: «Quer um café?»", en: "If you don't know how to address someone, just use the verb: 'Would you like a coffee?'", altEs: ["Se não souberes como tratar alguém, usa apenas o verbo: «Quer um café?»", "Se você não souber como tratar alguém, use só o verbo: «Quer um café?»"], grammar: [g.ep-forms-of-address, g.future-subjunctive-se] }
      - { es: "Os tugas dizem «estás bom?» e os zucas dizem «tudo bem?».", en: "The Portuguese say 'estás bom?' and Brazilians say 'tudo bem?'.", altEs: ["Os tugas perguntam «estás bom?» e os zucas «tudo bem?».", "Os portugueses dizem «estás bom?» e os brasileiros dizem «tudo bem?»."], grammar: [g.ep-tu-forms, g.slang-br-pt], vocab: [w.tuga, w.zuca, w.estás-bom] }
    exchanges:
      - q: { es: "Como é que trato a tua avó?", en: "How should I address your grandmother?" }
        a: { es: "Diz Dona Lurdes ou a senhora; você, nunca.", en: "Say Dona Lurdes or a senhora; never você." }
        alt: ["Trata-a por Dona Lurdes.", "Por Dona Lurdes, e nunca por você."]
        grammar: [g.ep-forms-of-address, g.ep-imperative-tu]
      - q: { es: "És zuca, não és?", en: "You're Brazilian, aren't you?" }
        a: { es: "Sou, sim! Nota-se muito o sotaque?", en: "I am! Is my accent that obvious?" }
        alt: ["Sou, de São Paulo.", "Não, sou tuga, mas vivi no Rio."]
        grammar: [g.ep-tu-forms, g.yes-no-answers]
        vocab: [w.zuca, w.tuga]
      - q: { es: "Posso tratar-te por tu?", en: "Can I call you tu?" }
        a: { es: "Claro! Aqui toda a gente se trata por tu.", en: "Of course! Everyone here calls each other tu." }
        alt: ["Claro que sim.", "Deves, até!"]
        grammar: [g.ep-forms-of-address, g.ep-enclisis]
        vocab: [w.tratar-por-tu]
      - q: { es: "O senhor é daqui do bairro?", en: "Are you from this neighbourhood, sir?" }
        a: { es: "Sou, nasci nesta rua há oitenta anos.", en: "I am, I was born on this street eighty years ago." }
        alt: ["Sou, sim senhora.", "Não, sou do Porto, mas vivo cá há muito tempo."]
        grammar: [g.ep-forms-of-address, g.ha-faz-time]
      - q: { es: "Ora bem, o que é que vamos comer?", en: "Right then, what are we going to eat?" }
        a: { es: "Sardinhas, claro! Estamos em junho.", en: "Sardines, of course! It's June." }
        alt: ["Umas sardinhas assadas.", "O que quiseres, eu como tudo."]
        grammar: [g.ep-tu-forms]
        vocab: [w.ora-bem, w.sardinha]
    texts:
      - title: "Guia rápido para brasileiros em Lisboa"
        es: ["Aos amigos, diz tu e usa as formas próprias: tu falas, tu foste.", "Aos mais velhos, diz o senhor ou a senhora.", "Na dúvida, usa só o verbo e um sorriso."]
        en: ["With friends, say tu and use its own forms: tu falas, tu foste.", "With older people, say o senhor or a senhora.", "When in doubt, just use the verb and a smile."]
        grammar: [g.ep-forms-of-address, g.ep-tu-forms]
        vocab: [w.tratar-por-tu]
      - title: "Santos Populares"
        es: ["Em junho, Alfama enche-se de manjericos, sardinhas e música.", "Os vizinhos tratam-se todos por tu e a malta dança na rua até de manhã.", "Ora bem: quem não gosta de um arraial?"]
        en: ["In June, Alfama fills up with pots of basil, sardines and music.", "The neighbours all call each other tu and the crowd dances in the street until morning.", "Right then: who doesn't love a street party?"]
        grammar: [g.ep-tu-forms, g.ep-enclisis]
        vocab: [w.santos-populares, w.manjerico, w.arraial, w.ora-bem]
    spicy:
      - { es: "Já me trataste por tu; agora só falta tratares-me por «querida».", en: "You've already called me tu; now all that's left is for you to call me 'darling'.", altEs: ["Já me trataste por tu; agora só falta tratares-me por «querido».", "Você já me chamou de tu; agora só falta me chamar de «querida»."], grammar: [g.ep-tu-forms, g.personal-infinitive-uses], vocab: [w.tratar-por-tu] }
      - { es: "Ora bem: és zuca, és giro e estás sozinho. Coincidência?", en: "Right then: you're Brazilian, you're cute and you're on your own. Coincidence?", altEs: ["Ora bem: és zuca, és gira e estás sozinha. Coincidência?", "Bom: você é brasileiro, é bonitinho e está sozinho. Coincidência?"], grammar: [g.ep-tu-forms], vocab: [w.ora-bem, w.zuca, w.giro] }
      - { es: "A sua mãe sabe que o filho dança assim tão bem?", en: "Does your mother know her son dances this well?", altEs: ["A senhora sua mãe sabe que o filho dança assim tão bem?", "Sua mãe sabe que o filho dela dança tão bem assim?"], grammar: [g.ep-forms-of-address, g.ep-articles-names-possessives] }
      - { es: "Comecei por tratar-te por você, depois por tu... e agora por «amor».", en: "I started by calling you você, then tu... and now 'love'.", altEs: ["Comecei por te tratar por você, depois por tu... e agora por «amor».", "Comecei te chamando de você, depois de tu... e agora de «amor»."], grammar: [g.ep-forms-of-address, g.ep-tu-forms], vocab: [w.tratar-por-tu] }
      - { es: "Tuga ou zuca, tanto faz: dançaste comigo a noite toda.", en: "Portuguese or Brazilian, who cares: you danced with me all night.", altEs: ["Tuga ou zuca, tanto faz, dançaste comigo a noite toda.", "Português ou brasileiro, tanto faz: você dançou comigo a noite toda."], grammar: [g.ep-tu-forms, g.preterite-regular], vocab: [w.tuga, w.zuca] }
dialogues:
  - id: c2.u01.d1
    title: Na casa de fados
    context: Bia, a Brazilian traveller, arrives at a small fado house in Alfama run by Dona Fernanda, whose grandson Duarte plays the Portuguese guitar.
    lines:
      - { speaker: Dona Fernanda, es: "Boa noite! A menina tem mesa reservada?", en: "Good evening! Do you have a table booked, miss?" }
      - { speaker: Bia, es: "Tenho, sim. Em nome de Beatriz Souza.", en: "Yes, I do. Under the name Beatriz Souza." }
      - { speaker: Dona Fernanda, es: "Ah, a menina brasileira! Faça favor, sente-se ali ao pé da janela.", en: "Ah, the Brazilian girl! Please, sit over there by the window." }
      - { speaker: Bia, es: "Obrigada. A senhora é a dona da casa?", en: "Thank you. Are you the owner?" }
      - { speaker: Dona Fernanda, es: "Sou, há quarenta anos. E este é o meu neto, o Duarte, que toca guitarra portuguesa.", en: "I am, for forty years now. And this is my grandson, Duarte, who plays the Portuguese guitar." }
      - { speaker: Duarte, es: "Olá! Trata-me por tu, que a minha avó é que gosta de cerimónias.", en: "Hi! Call me tu, it's my grandmother who likes formalities." }
      - { speaker: Bia, es: "Combinado. Então diz-me: quando é que começa o fado?", en: "Deal. So tell me: when does the fado start?" }
      - { speaker: Duarte, es: "Daqui a dez minutos. Mas olha, quando a fadista cantar, não fales, que a avó zanga-se.", en: "In ten minutes. But listen, when the singer is singing, don't talk, or Grandma gets cross." }
      - { speaker: Dona Fernanda, es: "Ó Duarte, deixa a menina em paz e vai preparar a guitarra!", en: "Duarte, leave the young lady alone and go and get the guitar ready!" }
      - { speaker: Bia, es: "Não se preocupe, Dona Fernanda. O seu neto foi muito simpático.", en: "Don't worry, Dona Fernanda. Your grandson has been very kind." }
    questions:
      - { q: "Como é que a Dona Fernanda trata a Bia quando ela chega?", options: ["Por tu", "Por «a menina»", "Por você"], answer: 1, explain: "She asks «A menina tem mesa reservada?»: a menina is the polite way to address a young woman in Portugal." }
      - { q: "Quem é o Duarte?", options: ["O empregado de mesa", "O neto da Dona Fernanda", "O namorado da Bia", "Um turista brasileiro"], answer: 1, explain: "Dona Fernanda introduces him: «este é o meu neto, o Duarte»." }
      - { q: "O que é que a Bia não deve fazer quando a fadista cantar?", options: ["Bater palmas no fim", "Falar", "Pedir vinho"], answer: 1, explain: "Duarte says «quando a fadista cantar, não fales»: people keep silent during fado." }
      - { q: "Porque é que o Duarte pede à Bia que o trate por tu?", options: ["Porque são primos", "Porque ele não gosta de cerimónias", "Porque a avó mandou"], answer: 1, explain: "He says it's his grandmother who likes formalities, not him." }
