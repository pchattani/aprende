id: r.b1.tomara-que-de-certo
level: b1
title: Tomara que dê certo
kind: text
intro: Renata and Tiago have left their office jobs to open a boteco in Belo Horizonte, the city of bars. The night before the opening, Renata writes about her hopes and fears.
allow: [di, renata, tiago, belo, horizonte, bh, savassi, santa, tereza, cida, ok, boteco, botecos, buteco, uai]
paragraphs:
  - { es: "Amanhã, às seis da tarde, a gente abre as portas do Boteco da Cida. São onze horas da noite, o Tiago já foi dormir e eu estou aqui na cozinha, sem sono, escrevendo estas linhas. Tomara que tudo dê certo. Na verdade, eu espero que dê mais do que certo: espero que este lugar mude a nossa vida.", en: "Tomorrow, at six in the evening, we open the doors of Boteco da Cida. It's eleven at night, Tiago has already gone to bed and I'm here in the kitchen, not sleepy, writing these lines. I hope everything goes well. In fact, I hope it goes better than well: I hope this place changes our lives." }
  - { es: "Há um ano, nós dois trabalhávamos num escritório no centro de Belo Horizonte. Eu era contadora e o Tiago trabalhava com informática. Tínhamos bons salários, carteira assinada e uma vida tranquila. Mas toda sexta-feira, quando a gente se encontrava com os amigos num boteco do bairro Santa Tereza, o Tiago dizia a mesma coisa: «Um dia eu ainda vou ter o meu próprio bar.» Eu ria e respondia: «Tomara, amor, tomara.»", en: "A year ago, we both worked in an office in the centre of Belo Horizonte. I was an accountant and Tiago worked in IT. We had good salaries, formal contracts and a quiet life. But every Friday, when we met our friends at a boteco in the Santa Tereza neighbourhood, Tiago said the same thing: 'One day I'll have my own bar.' I'd laugh and answer: 'I hope so, love, I hope so.'" }
  - { es: "Quem conhece BH sabe que a cidade é chamada de capital nacional dos botecos. Dizem que tem mais bares por habitante do que qualquer outra capital do Brasil. Aqui, o boteco não é só um lugar para beber: é onde a gente comemora aniversário, discute futebol, faz as pazes com o namorado e conhece os vizinhos. Todo ano, a cidade organiza até um concurso, o Comida di Buteco, para escolher o melhor petisco da cidade.", en: "Anyone who knows BH knows the city is called the national capital of botecos. They say it has more bars per inhabitant than any other state capital in Brazil. Here, the boteco isn't just a place to drink: it's where we celebrate birthdays, argue about football, make up with our boyfriends and get to know the neighbours. Every year the city even organises a competition, Comida di Buteco, to choose the city's best bar snack." }
  - { es: "No ano passado, a avó do Tiago, a dona Cida, ficou doente e foi morar com a gente. Ela é a melhor cozinheira que eu conheço. Uma noite, depois do jantar, ela nos ensinou a receita do torresmo dela e do seu famoso feijão tropeiro. O Tiago olhou para mim e eu entendi tudo. Duas semanas depois, nós pedimos demissão.", en: "Last year, Tiago's grandmother, Dona Cida, got ill and came to live with us. She's the best cook I know. One night, after dinner, she taught us the recipe for her pork crackling and her famous feijão tropeiro. Tiago looked at me and I understood everything. Two weeks later, we resigned." }
  - { es: "Não foi fácil. A gente gastou todas as economias para alugar e reformar o espaço. A burocracia foi um pesadelo: alvará, licença, vistoria dos bombeiros. A minha mãe ainda não acredita que eu deixei um bom emprego para «servir cerveja». Ela diz que espera que eu não me arrependa. Eu também espero.", en: "It wasn't easy. We spent all our savings renting and renovating the place. The bureaucracy was a nightmare: permits, licences, fire inspection. My mother still can't believe I left a good job to 'serve beer'. She says she hopes I don't regret it. I hope so too." }
  - { es: "Mas hoje, quando eu olho para o bar pronto, com as mesas de madeira, a geladeira cheia e a foto da dona Cida na parede, eu sinto mais esperança do que medo. Os vizinhos já passaram aqui para desejar boa sorte. O seu Josué, da padaria da esquina, prometeu trazer os amigos do futebol. E a dona Cida disse que vai ficar na cozinha amanhã, «só para ver se vocês não estragam a minha receita».", en: "But today, when I look at the finished bar, with the wooden tables, the full fridge and Dona Cida's photo on the wall, I feel more hope than fear. The neighbours have already stopped by to wish us luck. Seu Josué, from the bakery on the corner, promised to bring his football friends. And Dona Cida said she'll be in the kitchen tomorrow, 'just to see that you don't ruin my recipe'." }
  - { es: "Então, aqui vão os meus desejos para amanhã: que faça uma noite bonita, sem chuva; que a cerveja esteja bem gelada; que ninguém reclame do preço; e que, daqui a um ano, a gente participe do Comida di Buteco. Tomara. Agora vou dormir, porque amanhã o dia vai ser longo, uai!", en: "So here are my wishes for tomorrow: may it be a lovely night, with no rain; may the beer be ice-cold; may nobody complain about the prices; and may we take part in Comida di Buteco a year from now. Fingers crossed. Now I'm going to bed, because tomorrow is going to be a long day, uai!" }
questions:
  - { q: "O que a Renata e o Tiago faziam antes de abrir o bar?", options: ["Trabalhavam num restaurante", "Trabalhavam num escritório", "Estudavam na universidade"], answer: 1, explain: "«Há um ano, nós dois trabalhávamos num escritório no centro de Belo Horizonte.»" }
  - { q: "Por que Belo Horizonte é chamada de capital dos botecos?", options: ["Porque tem muitos bares por habitante", "Porque os bares são muito antigos", "Porque a cerveja é barata"], answer: 0, explain: "«Dizem que tem mais bares por habitante do que qualquer outra capital do Brasil.»" }
  - { q: "O que fez o casal decidir abrir o bar?", options: ["Um concurso de petiscos", "As receitas da dona Cida", "Um conselho da mãe da Renata"], answer: 1, explain: "After Dona Cida taught them her recipes, «o Tiago olhou para mim e eu entendi tudo. Duas semanas depois, nós pedimos demissão»." }
  - { q: "O que a mãe da Renata pensa da decisão?", options: ["Está muito orgulhosa", "Ainda não acredita e espera que a filha não se arrependa", "Quer trabalhar no bar"], answer: 1, explain: "«A minha mãe ainda não acredita... Ela diz que espera que eu não me arrependa.»" }
  - { q: "Qual destes NÃO é um desejo da Renata para amanhã?", options: ["Que não chova", "Que a cerveja esteja gelada", "Que a dona Cida não vá à cozinha"], answer: 2, explain: "Her wishes are no rain, cold beer, no complaints about prices and Comida di Buteco next year. Dona Cida's presence in the kitchen is welcome." }
