id: b2.u01
title: Si tuviera tiempo
lessons:
  - id: b2.u01.l1
    title: Quería que vinieras
    teach: [g.subjunctive-imperfect]
    vocab: [w.ambicion, w.ambicioso, w.exigente, w.ascender, w.cargo, w.directivo, w.sector, w.especializarse, w.competencia, w.competitivo, w.rendimiento, w.logro, w.desempleo, w.desempleado, w.indefinido, w.despido, w.indemnizacion, w.mercado-laboral, w.plantearse, w.proponerse, w.formarse, w.reciclarse, w.recursos-humanos, w.perfil, w.trayectoria, w.dispuesto, w.gran, w.distinto, w.varios, w.tras]
    tip: "Take the ellos preterite, drop -ron, add -ra / -se: quisieron → quisiera, quisiese. Use it after a past main verb: Quería que vinieras."
    sentences:
      - { es: "Mi jefa quería que me especializara en recursos humanos.", en: "My boss wanted me to specialise in human resources.", altEs: ["Mi jefa quería que me especializase en recursos humanos."], grammar: [g.subjunctive-imperfect], vocab: [w.especializarse, w.recursos-humanos, w.jefe] }
      - { es: "Era necesario que todos los directivos estuvieran de acuerdo con el plan.", en: "It was necessary for all the managers to agree with the plan.", altEs: ["Era necesario que todos los directivos estuviesen de acuerdo con el plan."], altEn: ["All the managers needed to agree with the plan."], grammar: [g.subjunctive-imperfect], vocab: [w.directivo, w.estar-de-acuerdo, w.plan] }
      - { es: "¿Te pidieron que presentaras tu perfil antes de la entrevista?", en: "Did they ask you to present your profile before the interview?", altEs: ["¿Te pidieron que presentases tu perfil antes de la entrevista?"], grammar: [g.subjunctive-imperfect], vocab: [w.perfil, w.entrevista, w.presentar] }
      - { es: "No creía que el sector fuera tan competitivo.", en: "I didn't think the sector was so competitive.", altEs: ["No creía que el sector fuese tan competitivo."], grammar: [g.subjunctive-imperfect], vocab: [w.sector, w.competitivo] }
      - { es: "El director nos exigió que mejoráramos el rendimiento en tres meses.", en: "The director demanded that we improve our performance in three months.", altEs: ["El director nos exigió que mejorásemos el rendimiento en tres meses."], grammar: [g.subjunctive-imperfect], vocab: [w.exigir, w.rendimiento, w.director], note: "Note the accent on the nosotros form: mejoráramos." }
      - { es: "Le aconsejaron que se formara en otro sector mientras estaba desempleado.", en: "They advised him to train in another sector while he was unemployed.", altEs: ["Le aconsejaron que se formase en otro sector mientras estaba desempleado."], grammar: [g.subjunctive-imperfect], vocab: [w.aconsejar, w.formarse, w.desempleado] }
      - { es: "La empresa buscaba a alguien que tuviera varios años de experiencia y una gran trayectoria.", en: "The company was looking for someone who had several years' experience and a great track record.", altEs: ["La empresa buscaba a alguien que tuviese varios años de experiencia y una gran trayectoria."], grammar: [g.subjunctive-imperfect], vocab: [w.varios, w.gran, w.trayectoria, w.experiencia] }
      - { es: "No había nadie que quisiera aceptar un cargo tan exigente.", en: "There was nobody who wanted to accept such a demanding post.", altEs: ["No había nadie que quisiese aceptar un cargo tan exigente."], altEn: ["Nobody wanted to accept such a demanding position."], grammar: [g.subjunctive-imperfect, g.indefinite-pronouns], vocab: [w.cargo, w.exigente, w.aceptar] }
      - { es: "Nos sorprendió que la competencia ofreciera sueldos tan distintos a los nuestros.", en: "It surprised us that our competitors offered salaries so different from ours.", altEs: ["Nos sorprendió que la competencia ofreciese sueldos tan distintos a los nuestros."], grammar: [g.subjunctive-imperfect], vocab: [w.competencia, w.distinto, w.sueldo, w.sorprender] }
      - { es: "Tras el despido, pidió que le pagaran la indemnización completa.", en: "After the dismissal, he asked them to pay him the full compensation.", altEs: ["Tras el despido, pidió que le pagasen la indemnización completa.", "Después del despido, pidió que le pagaran la indemnización completa."], grammar: [g.subjunctive-imperfect], vocab: [w.tras, w.despido, w.indemnizacion, w.pagar] }
      - { es: "Era una pena que un logro tan grande no se reconociera en la empresa.", en: "It was a shame that such a big achievement wasn't recognised in the company.", altEs: ["Era una pena que un logro tan grande no se reconociese en la empresa."], grammar: [g.subjunctive-imperfect, g.se-passive], vocab: [w.logro, w.reconocer, w.pena] }
      - { es: "Mis padres preferían que estudiara Derecho, pero yo quería reciclarme y trabajar en tecnología.", en: "My parents preferred me to study law, but I wanted to retrain and work in technology.", altEs: ["Mis padres preferían que estudiase Derecho, pero yo quería reciclarme y trabajar en tecnología."], grammar: [g.subjunctive-imperfect], vocab: [w.preferir, w.reciclarse, w.tecnologia] }
      - { es: "El mercado laboral exigía que los candidatos fueran ambiciosos y, sobre todo, flexibles.", en: "The job market demanded that candidates be ambitious and, above all, flexible.", altEs: ["El mercado laboral exigía que los candidatos fuesen ambiciosos y, sobre todo, flexibles."], grammar: [g.subjunctive-imperfect], vocab: [w.mercado-laboral, w.ambicioso, w.candidato, w.flexible] }
      - { es: "¡Qué ambición! Se propuso que nadie en la oficina trabajara más horas que ella.", en: "What ambition! She resolved that nobody in the office would work more hours than her.", altEs: ["¡Qué ambición! Se propuso que nadie en la oficina trabajase más horas que ella."], grammar: [g.subjunctive-imperfect], vocab: [w.ambicion, w.proponerse, w.oficina] }
      - { es: "Quería que vinieras a la reunión del lunes.", en: "I wanted you to come to Monday's meeting.", altEs: ["Quería que vinieses a la reunión del lunes."], grammar: [g.subjunctive-imperfect], vocab: [w.reunion, w.venir], error: { wrong: "Quería que vengas a la reunión del lunes.", explain: "The main verb is in the past (quería), so the subjunctive must be imperfect: vinieras, not vengas.", grammar: g.subjunctive-imperfect } }
      - { es: "Quiero que te plantees el ascenso.", en: "I want you to consider the promotion.", grammar: [g.subjunctive-imperfect], vocab: [w.plantearse, w.ascenso], transform: { instruction: "Put the main verb in the imperfect (Quería…) and adjust the subjunctive", answer: "Quería que te plantearas el ascenso.", alt: ["Quería que te planteases el ascenso."] } }
    exchanges:
      - q: { es: "¿Qué te dijo la de recursos humanos?", en: "What did the HR woman tell you?" }
        a: { es: "Que esperara su llamada; me avisarían esta semana.", en: "To wait for her call; they'd let me know this week." }
        alt: ["Me dijo que esperara su llamada.", "Que esperase su llamada; me avisarían esta semana."]
        grammar: [g.subjunctive-imperfect]
        vocab: [w.recursos-humanos, w.avisar]
      - q: { es: "¿Por qué dejaste aquel trabajo?", en: "Why did you leave that job?" }
        a: { es: "Porque querían que trabajara los sábados y yo no estaba dispuesto.", en: "Because they wanted me to work Saturdays and I wasn't willing." }
        alt: ["Porque querían que trabajase los sábados.", "Querían que trabajara los sábados y no quise."]
        grammar: [g.subjunctive-imperfect]
        vocab: [w.dispuesto, w.sabado]
      - q: { es: "¿Te sorprendió que ascendieran a Marta?", en: "Were you surprised that they promoted Marta?" }
        a: { es: "No, era lógico que la ascendieran: tiene una trayectoria impresionante.", en: "No, it was logical for them to promote her: she has an impressive track record." }
        alt: ["No, era lógico que la ascendieran.", "Para nada; se lo merecía."]
        grammar: [g.subjunctive-imperfect]
        vocab: [w.ascender, w.trayectoria]
      - q: { es: "¿Qué te recomendó tu antiguo jefe?", en: "What did your old boss recommend?" }
        a: { es: "Que me formara en otro sector y que no tuviera miedo de cambiar.", en: "That I train in another sector and not be afraid of changing." }
        alt: ["Que me formase en otro sector y que no tuviese miedo de cambiar.", "Me recomendó que me formara en otro sector."]
        grammar: [g.subjunctive-imperfect]
        vocab: [w.formarse, w.sector]
    texts:
      - title: "Oferta de empleo"
        es: ["Buscamos a una persona que tenga experiencia en el sector y ganas de crecer.", "Hace un año pedíamos que los candidatos hablaran tres idiomas; hoy pedimos dos.", "Ofrecemos contrato indefinido y formación a cargo de la empresa.", "Envía tu perfil antes del viernes."]
        en: ["We are looking for a person who has experience in the sector and a desire to grow.", "A year ago we asked candidates to speak three languages; today we ask for two.", "We offer a permanent contract and training paid for by the company.", "Send your profile before Friday."]
        grammar: [g.subjunctive-imperfect]
        vocab: [w.indefinido, w.perfil, w.candidato]
  - id: b2.u01.l2
    title: Si tuviera otro trabajo
    teach: [g.si-clauses-unreal]
    vocab: [w.a-gusto, w.huir, w.sencillez, w.escoger, w.patrimonio, w.renta, w.derrochar, w.capricho, w.tacano, w.generoso, w.generosidad, w.fama, w.anonimo, w.ocio, w.vocacion, w.pasion, w.apasionante, w.fundacion, w.voluntariado, w.sin-animo-de-lucro, w.justicia, w.injusticia, w.junto-a, w.frente-a, w.alla]
    tip: "si + imperfect subjunctive, + conditional: Si tuviera dinero, viajaría. Never the conditional after si."
    sentences:
      - { es: "Si tuviera más tiempo libre, dedicaría las tardes al voluntariado.", en: "If I had more free time, I'd devote my afternoons to volunteering.", altEs: ["Si tuviese más tiempo libre, dedicaría las tardes al voluntariado."], grammar: [g.si-clauses-unreal], vocab: [w.voluntariado, w.tiempo, w.libre] }
      - { es: "¿Qué harías si no necesitaras trabajar para vivir?", en: "What would you do if you didn't need to work for a living?", altEs: ["¿Qué harías si no necesitases trabajar para vivir?"], grammar: [g.si-clauses-unreal], vocab: [w.necesitar, w.trabajar] }
      - { es: "Si fuera millonario, no derrocharía el dinero en caprichos; crearía una fundación.", en: "If I were a millionaire, I wouldn't squander my money on whims; I'd set up a foundation.", altEs: ["Si fuese millonario, no derrocharía el dinero en caprichos; crearía una fundación."], grammar: [g.si-clauses-unreal], vocab: [w.millonario, w.derrochar, w.capricho, w.fundacion, w.crear] }
      - { es: "Si viviéramos en el campo, estaríamos más a gusto, pero ganaríamos menos.", en: "If we lived in the country, we'd be more at ease, but we'd earn less.", altEs: ["Si viviésemos en el campo, estaríamos más a gusto, pero ganaríamos menos."], grammar: [g.si-clauses-unreal], vocab: [w.a-gusto, w.campo, w.ganar] }
      - { es: "Si pudiera huir de la ciudad, no lo haría: me encanta el ruido.", en: "If I could flee the city, I wouldn't: I love the noise.", altEs: ["Si pudiese huir de la ciudad, no lo haría: me encanta el ruido."], grammar: [g.si-clauses-unreal], vocab: [w.huir, w.ruido, w.encantar] }
      - { es: "Si mis padres no fueran tan tacaños, viajarían mucho más.", en: "If my parents weren't so stingy, they'd travel a lot more.", altEs: ["Si mis padres no fuesen tan tacaños, viajarían mucho más."], grammar: [g.si-clauses-unreal], vocab: [w.tacano, w.viajar] }
      - { es: "Si la gente escogiera su trabajo por vocación y no por dinero, sería más feliz.", en: "If people chose their job out of vocation and not for money, they'd be happier.", altEs: ["Si la gente escogiese su trabajo por vocación y no por dinero, sería más feliz.", "Si la gente eligiera su trabajo por vocación y no por dinero, sería más feliz."], grammar: [g.si-clauses-unreal], vocab: [w.escoger, w.vocacion, w.feliz] }
      - { es: "Si tuviera fama, echaría de menos la vida anónima.", en: "If I were famous, I'd miss my anonymous life.", altEs: ["Si tuviese fama, echaría de menos la vida anónima.", "Si fuera famoso, echaría de menos la vida anónima."], grammar: [g.si-clauses-unreal], vocab: [w.fama, w.anonimo, w.echar], note: "echar de menos = to miss (someone or something)." }
      - { es: "Si subiera la renta de las familias, también crecería el gasto en ocio.", en: "If families' income went up, spending on leisure would grow too.", altEs: ["Si subiese la renta de las familias, también crecería el gasto en ocio."], grammar: [g.si-clauses-unreal], vocab: [w.renta, w.ocio, w.gasto, w.crecer] }
      - { es: "Si no existiera la injusticia, no haría falta la justicia.", en: "If injustice didn't exist, there would be no need for justice.", altEs: ["Si no existiese la injusticia, no haría falta la justicia."], grammar: [g.si-clauses-unreal], vocab: [w.injusticia, w.justicia, w.hacer-falta, w.existir] }
      - { es: "Viviría con más sencillez si no me importara tanto la opinión de los demás.", en: "I'd live more simply if I didn't care so much about other people's opinion.", altEs: ["Viviría con más sencillez si no me importase tanto la opinión de los demás."], grammar: [g.si-clauses-unreal], vocab: [w.sencillez, w.importar, w.opinion], note: "The si clause can come second." }
      - { es: "Si yo fuera tú, donaría una parte del patrimonio a una organización sin ánimo de lucro.", en: "If I were you, I'd donate part of the estate to a non-profit organisation.", altEs: ["Si yo fuese tú, donaría una parte del patrimonio a una organización sin ánimo de lucro.", "Yo que tú donaría una parte del patrimonio a una organización sin ánimo de lucro."], grammar: [g.si-clauses-unreal], vocab: [w.donar, w.patrimonio, w.sin-animo-de-lucro, w.organizacion] }
      - { es: "¿Serías tan generoso si no tuvieras tanto dinero? — Desde luego; la generosidad no depende de la cuenta del banco.", en: "Would you be so generous if you didn't have so much money? — Of course; generosity doesn't depend on your bank account.", altEs: ["¿Serías tan generoso si no tuvieses tanto dinero? — Desde luego; la generosidad no depende de la cuenta del banco."], grammar: [g.si-clauses-unreal], vocab: [w.generoso, w.generosidad, w.desde-luego, w.depender] }
      - { es: "Si pudiera elegir, trabajaría en algo apasionante, allá donde fuera.", en: "If I could choose, I'd work on something thrilling, wherever that might be.", altEs: ["Si pudiese elegir, trabajaría en algo apasionante, allá donde fuese."], grammar: [g.si-clauses-unreal], vocab: [w.apasionante, w.alla, w.elegir], note: "allá donde fuera = wherever it might be." }
      - { es: "Si tuviera dinero, compraría una casa frente al mar.", en: "If I had money, I'd buy a house opposite the sea.", altEs: ["Si tuviese dinero, compraría una casa frente al mar."], grammar: [g.si-clauses-unreal], vocab: [w.frente-a, w.comprar, w.mar], error: { wrong: "Si tendría dinero, compraría una casa frente al mar.", explain: "Never the conditional after si: the unreal condition takes the imperfect subjunctive, tuviera.", grammar: g.si-clauses-unreal } }
      - { es: "No tengo vocación, así que no soy feliz en mi trabajo.", en: "I have no vocation, so I'm not happy in my job.", grammar: [g.si-clauses-unreal, g.narration-connectors], vocab: [w.vocacion, w.asi-que], transform: { instruction: "Turn it into an unreal condition with si", answer: "Si tuviera vocación, sería feliz en mi trabajo.", alt: ["Si tuviese vocación, sería feliz en mi trabajo."] } }
    exchanges:
      - q: { es: "¿Qué harías si te tocara la lotería?", en: "What would you do if you won the lottery?" }
        a: { es: "Dejaría de trabajar y me dedicaría a mi pasión: la música.", en: "I'd stop working and devote myself to my passion: music." }
        alt: ["Dejaría de trabajar.", "No cambiaría nada; estoy a gusto así."]
        grammar: [g.si-clauses-unreal]
        vocab: [w.tocar-la-loteria, w.pasion]
      - q: { es: "Si pudieras vivir en cualquier ciudad, ¿cuál escogerías?", en: "If you could live in any city, which would you choose?" }
        a: { es: "Escogería una pequeña, junto al mar, donde todo el mundo se conociera.", en: "I'd choose a small one, by the sea, where everybody knew each other." }
        alt: ["Una pequeña junto al mar.", "Me quedaría en la mía; no la cambiaría por nada."]
        grammar: [g.si-clauses-unreal]
        vocab: [w.escoger, w.junto-a]
      - q: { es: "¿Y si tu jefe te ofreciera mucho más sueldo por trabajar los domingos?", en: "And if your boss offered you a lot more salary for working Sundays?" }
        a: { es: "Ni así; si aceptara, no tendría vida.", en: "Not even then; if I accepted, I'd have no life." }
        alt: ["Ni así lo aceptaría.", "Lo pensaría, pero creo que diría que no."]
        grammar: [g.si-clauses-unreal]
        vocab: [w.sueldo, w.aceptar]
      - q: { es: "¿Donarías tu patrimonio si fueras rico?", en: "Would you donate your estate if you were rich?" }
        a: { es: "Una parte sí; no sería tan generoso como para darlo todo.", en: "Part of it, yes; I wouldn't be so generous as to give it all away." }
        alt: ["Una parte, sí.", "Sí, todo; el dinero no da la felicidad."]
        grammar: [g.si-clauses-unreal]
        vocab: [w.patrimonio, w.generoso, w.donar]
    texts:
      - title: "Anuncio de una fundación"
        es: ["Si cada vecino diera una hora a la semana, este barrio sería distinto.", "Buscamos voluntarios para acompañar a personas mayores.", "No hace falta experiencia, solo ganas.", "Apúntate en la web de la fundación."]
        en: ["If every neighbour gave one hour a week, this neighbourhood would be different.", "We are looking for volunteers to keep elderly people company.", "No experience needed, just enthusiasm.", "Sign up on the foundation's website."]
        grammar: [g.si-clauses-unreal]
        vocab: [w.fundacion, w.voluntario, w.distinto, w.acompanar]
      - title: "Nota en la nevera"
        es: ["Si llegaras antes de las ocho, podríamos cenar juntos.", "Si no, te dejo la cena en el horno.", "¡Y no derroches el agua caliente como ayer!"]
        en: ["If you got home before eight, we could have dinner together.", "If not, I'll leave your dinner in the oven.", "And don't waste the hot water like yesterday!"]
        grammar: [g.si-clauses-unreal]
        vocab: [w.derrochar, w.horno]
  - id: b2.u01.l3
    title: Como si fuera el jefe
    teach: [g.como-si]
    vocab: [w.actuar, w.fingir, w.presumir, w.presumido, w.creido, w.disimular, w.ignorar, w.actitud, w.gesto, w.mirada, w.experto, w.sabelotodo, w.humilde, w.modesto, w.arrogante, w.grosero, w.burlarse, w.tomar-el-pelo, w.en-broma, w.ni-que, w.tratar, w.superior, w.semejante]
    tip: "como si is always followed by the imperfect subjunctive: Habla como si fuera el jefe. The ironic ¡Ni que…! works the same way."
    sentences:
      - { es: "Habla como si fuera el jefe, pero solo lleva una semana en la empresa.", en: "He talks as if he were the boss, but he's only been at the company a week.", altEs: ["Habla como si fuese el jefe, pero solo lleva una semana en la empresa."], grammar: [g.como-si], vocab: [w.jefe, w.llevar.phr, w.hablar] }
      - { es: "Me miró como si no me conociera. ¡Qué grosero!", en: "He looked at me as if he didn't know me. How rude!", altEs: ["Me miró como si no me conociese. ¡Qué grosero!"], grammar: [g.como-si], vocab: [w.grosero, w.mirar, w.conocer] }
      - { es: "Actúa como si lo supiera todo; es el típico sabelotodo.", en: "He acts as if he knew everything; he's the typical know-it-all.", altEs: ["Actúa como si lo supiese todo; es el típico sabelotodo."], grammar: [g.como-si], vocab: [w.actuar, w.sabelotodo, w.tipico, w.saber] }
      - { es: "No me ignores; actúas como si yo no existiera.", en: "Don't ignore me; you act as if I didn't exist.", altEs: ["No me ignores; actúas como si yo no existiese."], grammar: [g.como-si, g.imperative-negative], vocab: [w.ignorar, w.actuar, w.existir] }
      - { es: "¿Por qué presumes tanto? ¡Ni que fueras un experto!", en: "Why do you show off so much? Anyone would think you were an expert!", altEs: ["¿Por qué presumes tanto? ¡Ni que fueses un experto!"], grammar: [g.como-si], vocab: [w.presumir, w.ni-que, w.experto], note: "¡Ni que…! + imperfect subjunctive: ironic 'as if…!'." }
      - { es: "Gastaba dinero como si fuera millonario y, en realidad, no tenía ni para el alquiler.", en: "He spent money as if he were a millionaire and, in reality, he didn't even have enough for the rent.", altEs: ["Gastaba dinero como si fuese millonario y, en realidad, no tenía ni para el alquiler."], grammar: [g.como-si], vocab: [w.gastar, w.millonario, w.en-realidad, w.alquiler] }
      - { es: "Mi hermano me trata como si todavía tuviera diez años.", en: "My brother treats me as if I were still ten years old.", altEs: ["Mi hermano me trata como si todavía tuviese diez años."], grammar: [g.como-si], vocab: [w.tratar, w.hermano, w.todavia] }
      - { es: "Recibió el premio con una actitud muy humilde, como si no fuera para ella.", en: "She received the prize with a very humble attitude, as if it weren't for her.", altEs: ["Recibió el premio con una actitud muy humilde, como si no fuese para ella."], grammar: [g.como-si], vocab: [w.actitud, w.humilde, w.premio, w.recibir] }
      - { es: "Lo dijo en broma, pero su gesto era serio, como si de verdad estuviera enfadado.", en: "He said it as a joke, but his expression was serious, as if he were really angry.", altEs: ["Lo dijo en broma, pero su gesto era serio, como si de verdad estuviese enfadado."], grammar: [g.como-si], vocab: [w.en-broma, w.gesto, w.serio, w.enfadado] }
      - { es: "¿Me estás tomando el pelo? Hablas como si el examen fuera fácil.", en: "Are you pulling my leg? You talk as if the exam were easy.", altEs: ["¿Me estás tomando el pelo? Hablas como si el examen fuese fácil."], grammar: [g.como-si, g.estar-gerund], vocab: [w.tomar-el-pelo, w.examen, w.facil] }
      - { es: "Con esa mirada arrogante parece como si se burlara de nosotros, y no es así.", en: "With that arrogant look it seems as if he were making fun of us, and that's not the case.", altEs: ["Con esa mirada arrogante parece como si se burlase de nosotros, y no es así."], grammar: [g.como-si], vocab: [w.mirada, w.arrogante, w.burlarse, w.parecer] }
      - { es: "Es modesto: nunca habla de sus logros, como si no tuvieran importancia.", en: "He's modest: he never talks about his achievements, as if they didn't matter.", altEs: ["Es modesto: nunca habla de sus logros, como si no tuviesen importancia."], grammar: [g.como-si], vocab: [w.modesto, w.logro, w.nunca] }
      - { es: "El nuevo directivo da órdenes como si fuera nuestro superior desde hace años.", en: "The new manager gives orders as if he had been our superior for years.", altEs: ["El nuevo directivo da órdenes como si fuese nuestro superior desde hace años."], grammar: [g.como-si, g.desde-hace], vocab: [w.directivo, w.superior, w.orden] }
      - { es: "¡Semejante creído! Entró en la sala como si todos lo estuviéramos esperando.", en: "What a conceited man! He walked into the room as if we were all waiting for him.", altEs: ["¡Semejante creído! Entró en la sala como si todos lo estuviésemos esperando."], grammar: [g.como-si], vocab: [w.semejante, w.creido, w.sala, w.entrar] }
      - { es: "Habla como si supiera más que nadie.", en: "He talks as if he knew more than anyone.", altEs: ["Habla como si supiese más que nadie."], grammar: [g.como-si], vocab: [w.saber, w.nadie], error: { wrong: "Habla como si sabe más que nadie.", explain: "como si never takes the indicative: it needs the imperfect subjunctive, supiera.", grammar: g.como-si } }
      - { es: "Finge que no le importa.", en: "She pretends she doesn't care.", grammar: [g.como-si], vocab: [w.fingir, w.importar], transform: { instruction: "Rephrase with como si", answer: "Actúa como si no le importara.", alt: ["Se comporta como si no le importara.", "Actúa como si no le importase.", "Hace como si no le importara."] } }
    exchanges:
      - q: { es: "¿Qué tal el nuevo compañero?", en: "How's the new colleague?" }
        a: { es: "Un poco presumido: habla como si llevara aquí toda la vida.", en: "A bit full of himself: he talks as if he'd been here all his life." }
        alt: ["Un poco presumido.", "Habla como si llevase aquí toda la vida.", "Simpático, aunque algo creído."]
        grammar: [g.como-si]
        vocab: [w.presumido, w.companero]
      - q: { es: "¿Te saludó Carlos en la fiesta?", en: "Did Carlos say hello to you at the party?" }
        a: { es: "¡Qué va! Pasó a mi lado como si no me conociera.", en: "Not at all! He walked past me as if he didn't know me." }
        alt: ["No; pasó a mi lado como si no me conociese.", "Ni me miró."]
        grammar: [g.como-si]
        vocab: [w.saludar, w.conocer]
      - q: { es: "¿Está enfadada contigo?", en: "Is she angry with you?" }
        a: { es: "Creo que sí, pero disimula como si no pasara nada.", en: "I think so, but she hides it as if nothing were wrong." }
        alt: ["Creo que sí, pero lo disimula.", "Sí, aunque actúa como si no pasase nada."]
        grammar: [g.como-si]
        vocab: [w.disimular, w.enfadado]
      - q: { es: "¿Por qué te ríes?", en: "Why are you laughing?" }
        a: { es: "Porque mi hijo de cinco años da órdenes como si fuera el jefe de la casa.", en: "Because my five-year-old gives orders as if he were the boss of the house." }
        alt: ["Porque mi hijo da órdenes como si fuese el jefe de la casa.", "Por nada, cosas de mi hijo."]
        grammar: [g.como-si]
        vocab: [w.orden, w.hijo]
      - q: { es: "Oye, ¿me estás tomando el pelo?", en: "Hey, are you pulling my leg?" }
        a: { es: "¡Para nada! Lo digo totalmente en serio.", en: "Not at all! I mean it completely seriously." }
        alt: ["No, lo digo en serio.", "Un poco, sí. Era en broma."]
        grammar: [g.como-si]
        vocab: [w.tomar-el-pelo, w.totalmente, w.en-serio, w.en-broma]
    texts:
      - title: "Reseña de una película"
        es: ["La protagonista actúa como si nada le importara, pero cada gesto dice lo contrario.", "El director trata el humor con una sencillez impresionante.", "Dos horas que pasan como si fueran veinte minutos."]
        en: ["The lead actress acts as if nothing mattered to her, but every gesture says the opposite.", "The director handles humour with impressive simplicity.", "Two hours that pass as if they were twenty minutes."]
        grammar: [g.como-si]
        vocab: [w.actuar, w.gesto, w.tratar]
      - title: "Mensaje de grupo"
        es: ["Chicos, Luis ha vuelto de Londres y habla como si fuera inglés.", "No os burléis de él, por favor.", "Bueno, un poco sí."]
        en: ["Guys, Luis is back from London and he talks as if he were English.", "Don't make fun of him, please.", "Well, a little bit is fine."]
        grammar: [g.como-si, g.imperative-negative]
        vocab: [w.burlarse]
  - id: b2.u01.l4
    title: Quisiera pedirle un favor
    teach: [g.subjunctive-imperfect]
    vocab: [w.quisiera, w.ya-era-hora, w.carril-bici, w.peatonal, w.zona-verde, w.gratuito, w.accesible, w.subvencion, w.subvencionar, w.tasa, w.recaudar, w.ciudadania, w.concejal, w.reclamar, w.manifestarse, w.transporte-publico, w.infraestructura, w.limpieza, w.delincuencia, w.prioridad, w.mediante]
    tip: "The imperfect subjunctive also softens wishes and requests: Ojalá hubiera más parques. Quisiera hablar con usted. Me gustaría que vinieras."
    sentences:
      - { es: "Quisiera hablar con la concejala de transporte, por favor.", en: "I'd like to speak to the councillor for transport, please.", altEs: ["Querría hablar con la concejala de transporte, por favor.", "Me gustaría hablar con la concejala de transporte, por favor."], grammar: [g.subjunctive-imperfect], vocab: [w.quisiera, w.concejal, w.transporte] }
      - { es: "Ojalá hubiera más zonas verdes en este barrio.", en: "If only there were more green spaces in this neighbourhood.", altEs: ["Ojalá hubiese más zonas verdes en este barrio."], altEn: ["I wish there were more green spaces in this neighbourhood."], grammar: [g.subjunctive-imperfect], vocab: [w.zona-verde, w.barrio, w.ojala] }
      - { es: "Ya era hora de que el ayuntamiento arreglara el carril bici.", en: "It was about time the council fixed the cycle lane.", altEs: ["Ya era hora de que el ayuntamiento arreglase el carril bici."], grammar: [g.subjunctive-imperfect], vocab: [w.ya-era-hora, w.carril-bici, w.ayuntamiento, w.arreglar] }
      - { es: "Los vecinos pedían que la calle fuera peatonal y que el aparcamiento fuera gratuito.", en: "The residents were asking for the street to be pedestrianised and for the car park to be free.", altEs: ["Los vecinos pedían que la calle fuese peatonal y que el aparcamiento fuese gratuito."], grammar: [g.subjunctive-imperfect], vocab: [w.peatonal, w.gratuito, w.aparcamiento, w.vecino] }
      - { es: "Me gustaría que el transporte público llegara hasta el hospital.", en: "I'd like public transport to reach the hospital.", altEs: ["Me gustaría que el transporte público llegase hasta el hospital."], grammar: [g.subjunctive-imperfect], vocab: [w.transporte-publico, w.hospital, w.gustaria] }
      - { es: "Sería estupendo que la biblioteca abriera también los domingos, ¿no crees?", en: "It would be great if the library opened on Sundays too, don't you think?", altEs: ["Sería estupendo que la biblioteca abriese también los domingos, ¿no crees?"], grammar: [g.subjunctive-imperfect], vocab: [w.biblioteca, w.estupendo, w.domingo] }
      - { es: "¿No sería mejor que el gobierno subvencionara la vivienda en lugar de los coches?", en: "Wouldn't it be better if the government subsidised housing instead of cars?", altEs: ["¿No sería mejor que el gobierno subvencionase la vivienda en lugar de los coches?"], grammar: [g.subjunctive-imperfect], vocab: [w.subvencionar, w.vivienda, w.en-lugar-de, w.gobierno] }
      - { es: "Ojalá la ciudadanía se manifestara más contra la injusticia.", en: "If only citizens demonstrated more against injustice.", altEs: ["Ojalá la ciudadanía se manifestase más contra la injusticia."], grammar: [g.subjunctive-imperfect], vocab: [w.ciudadania, w.manifestarse, w.injusticia] }
      - { es: "Nos encantaría que los museos fueran accesibles para todos, mediante entradas gratuitas y ascensores.", en: "We'd love museums to be accessible to everyone, through free tickets and lifts.", altEs: ["Nos encantaría que los museos fuesen accesibles para todos, mediante entradas gratuitas y ascensores."], grammar: [g.subjunctive-imperfect], vocab: [w.accesible, w.mediante, w.museo, w.ascensor] }
      - { es: "La ciudadanía reclamaba que se recaudaran más impuestos a las grandes empresas y menos a las familias.", en: "Citizens were demanding that more taxes be collected from big companies and fewer from families.", altEs: ["La ciudadanía reclamaba que se recaudasen más impuestos a las grandes empresas y menos a las familias."], grammar: [g.subjunctive-imperfect, g.se-passive], vocab: [w.reclamar, w.recaudar, w.impuesto, w.empresa] }
      - { es: "Quisiéramos que la limpieza de las calles fuera una prioridad, no un lujo.", en: "We would like street cleaning to be a priority, not a luxury.", altEs: ["Quisiéramos que la limpieza de las calles fuese una prioridad, no un lujo."], grammar: [g.subjunctive-imperfect], vocab: [w.limpieza, w.prioridad, w.lujo] }
      - { es: "¡Ojalá bajara la tasa de desempleo tan rápido como suben los alquileres!", en: "If only the unemployment rate fell as fast as rents go up!", altEs: ["¡Ojalá bajase la tasa de desempleo tan rápido como suben los alquileres!"], grammar: [g.subjunctive-imperfect, g.comparatives], vocab: [w.tasa, w.desempleo, w.bajar, w.subir] }
      - { es: "Tras las elecciones, muchos esperaban que la delincuencia bajara en el centro.", en: "After the elections, many hoped that crime would fall in the city centre.", altEs: ["Tras las elecciones, muchos esperaban que la delincuencia bajase en el centro."], grammar: [g.subjunctive-imperfect], vocab: [w.tras, w.elecciones, w.delincuencia] }
      - { es: "Preferiría que gastaran en infraestructura antes que en fiestas.", en: "I'd prefer them to spend on infrastructure rather than in festivities.", altEs: ["Preferiría que gastasen en infraestructura antes que en fiestas."], grammar: [g.subjunctive-imperfect], vocab: [w.gastar, w.infraestructura, w.fiesta] }
      - { es: "Quisiera que me ayudaras con la solicitud de la subvención.", en: "I'd like you to help me with the application for the grant.", altEs: ["Quisiera que me ayudases con la solicitud de la subvención."], grammar: [g.subjunctive-imperfect], vocab: [w.subvencion, w.solicitud, w.ayudar], error: { wrong: "Quisiera que me ayudes con la solicitud de la subvención.", explain: "After quisiera (itself an imperfect subjunctive), the dependent verb goes into the imperfect subjunctive too: ayudaras.", grammar: g.subjunctive-imperfect } }
      - { es: "Quiero que el ayuntamiento construya un carril bici.", en: "I want the council to build a cycle lane.", grammar: [g.subjunctive-imperfect], vocab: [w.construir, w.carril-bici], transform: { instruction: "Soften the request with quisiera", answer: "Quisiera que el ayuntamiento construyera un carril bici.", alt: ["Quisiera que el ayuntamiento construyese un carril bici."] } }
    exchanges:
      - q: { es: "¿Qué cambiarías de tu barrio?", en: "What would you change about your neighbourhood?" }
        a: { es: "Ojalá hubiera menos coches y más zonas verdes.", en: "I wish there were fewer cars and more green spaces." }
        alt: ["Ojalá hubiese menos coches y más zonas verdes.", "Pondría más zonas verdes y quitaría coches."]
        grammar: [g.subjunctive-imperfect]
        vocab: [w.zona-verde, w.barrio]
      - q: { es: "Buenos días, ¿en qué puedo ayudarle?", en: "Good morning, how can I help you?" }
        a: { es: "Quisiera presentar una reclamación por el ruido de las obras.", en: "I'd like to file a complaint about the noise from the roadworks." }
        alt: ["Quería presentar una reclamación por el ruido de las obras.", "Querría poner una reclamación por el ruido."]
        grammar: [g.subjunctive-imperfect]
        vocab: [w.quisiera, w.reclamacion, w.obra]
      - q: { es: "¿Qué pedían los vecinos en la manifestación?", en: "What were the residents asking for at the demonstration?" }
        a: { es: "Que el transporte público fuera gratuito para los mayores.", en: "For public transport to be free for the elderly." }
        alt: ["Que el transporte público fuese gratuito para los mayores.", "Pedían transporte público gratuito para los mayores."]
        grammar: [g.subjunctive-imperfect]
        vocab: [w.transporte-publico, w.gratuito, w.manifestacion]
      - q: { es: "¿Han arreglado ya la plaza?", en: "Have they fixed the square yet?" }
        a: { es: "Sí, por fin. Ya era hora de que hicieran algo.", en: "Yes, at last. It was about time they did something." }
        alt: ["Sí, por fin. Ya era hora de que hiciesen algo.", "Sí, ya era hora."]
        grammar: [g.subjunctive-imperfect]
        vocab: [w.ya-era-hora, w.plaza, w.por-fin]
    texts:
      - title: "Carta al periódico"
        es: ["Quisiera dar las gracias al ayuntamiento por el nuevo carril bici.", "Ojalá todas las obras fueran tan rápidas.", "Ahora solo falta que la calle del mercado sea peatonal.", "Un vecino de toda la vida."]
        en: ["I would like to thank the council for the new cycle lane.", "If only all the works were so quick.", "Now all that's missing is for Market Street to be pedestrianised.", "A lifelong resident."]
        grammar: [g.subjunctive-imperfect]
        vocab: [w.quisiera, w.carril-bici, w.peatonal]
dialogues:
  - id: b2.u01.d1
    title: Una entrevista de trabajo
    context: Daniel is being interviewed for a post in a technology company. The interviewer asks about his past and about hypothetical situations.
    lines:
      - { speaker: Entrevistadora, es: "Buenos días, Daniel. Cuénteme, ¿por qué dejó su último trabajo?", en: "Good morning, Daniel. Tell me, why did you leave your last job?" }
      - { speaker: Daniel, es: "Querían que me trasladara a otra ciudad y, la verdad, no me planteaba mudarme.", en: "They wanted me to relocate to another city and, honestly, I wasn't considering moving." }
      - { speaker: Entrevistadora, es: "Entiendo. Si pudiera escoger cualquier puesto en esta empresa, ¿cuál escogería?", en: "I see. If you could choose any post in this company, which would you choose?" }
      - { speaker: Daniel, es: "Uno en el que pudiera formarme y crecer; la ambición sin formación no sirve de nada.", en: "One where I could train and grow; ambition without training is no use at all." }
      - { speaker: Entrevistadora, es: "¿Y cómo se lleva con los jefes exigentes?", en: "And how do you get on with demanding bosses?" }
      - { speaker: Daniel, es: "Bien, mientras no me traten como si fuera un niño.", en: "Fine, as long as they don't treat me as if I were a child." }
      - { speaker: Entrevistadora, es: "Me alegra oírlo. Su antiguo jefe nos dijo que usted era muy competitivo.", en: "Glad to hear it. Your old boss told us you were very competitive." }
      - { speaker: Daniel, es: "Es verdad. Si no fuera competitivo, no estaría aquí frente a usted.", en: "That's true. If I weren't competitive, I wouldn't be here in front of you." }
      - { speaker: Entrevistadora, es: "Una última pregunta: ¿qué haría si le ofreciéramos el puesto hoy mismo?", en: "One last question: what would you do if we offered you the post today?" }
      - { speaker: Daniel, es: "Fingiría que tengo que pensarlo… y aceptaría mañana a primera hora.", en: "I'd pretend I have to think about it… and I'd accept first thing tomorrow." }
      - { speaker: Entrevistadora, es: "Pues ya era hora de que alguien contestara con sinceridad. Le llamaremos esta semana.", en: "Well, it was about time someone answered sincerely. We'll call you this week." }
    questions:
      - { q: "Why did Daniel leave his previous job?", options: ["He was dismissed", "They wanted him to move to another city", "The salary was too low"], answer: 1 }
      - { q: "What kind of post would Daniel choose?", options: ["One where he could train and grow", "A managerial post", "One with no demanding bosses"], answer: 0 }
      - { q: "What would Daniel do if offered the job today?", options: ["Refuse politely", "Accept immediately", "Pretend to think about it, then accept"], answer: 2 }
