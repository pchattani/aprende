- id: g.subjunctive-present-forms
  level: b1
  title: "The present subjunctive — forms"
  summary: "Start from the yo form, swap the vowel: -ar → -e, -er/-ir → -a. hable, coma, viva; tenga, haga, conozca."
  explanation: |
    The subjunctive is a **mood**, not a tense: it marks what is wished, doubted, felt, or not yet real. First the forms:

    | | hablar | comer | vivir |
    |---|---|---|---|
    | yo | habl**e** | com**a** | viv**a** |
    | tú | habl**es** | com**as** | viv**as** |
    | él/ella/usted | habl**e** | com**a** | viv**a** |
    | nosotros | habl**emos** | com**amos** | viv**amos** |
    | vosotros | habl**éis** | com**áis** | viv**áis** |
    | ellos/ustedes | habl**en** | com**an** | viv**an** |

    ### Build it from the yo form of the present
    *tengo → tenga, hago → haga, digo → diga, pongo → ponga, conozco → conozca, veo → vea, salgo → salga, oigo → oiga.*

    ### Stem changes
    -ar / -er keep the boot pattern: *piense, pienses, piense, pensemos, penséis, piensen; vuelva … volvamos.*
    -ir verbs also change nosotros/vosotros: *pida, pidamos; sienta, sintamos; duerma, durmamos.*

    ### Spelling
    *busque, pague, empiece, coja, siga, dirija.*
  examples:
    - { es: "Quiero que hables con ella.", en: "I want you to talk to her." }
    - { es: "Es importante que comamos bien.", en: "It's important that we eat well." }
    - { es: "No creo que tengan tiempo.", en: "I don't think they have time." }
  pitfalls:
    - "The subjunctive endings look like the imperative for usted — because formal commands *are* subjunctive forms."
  drills:
    - { es: "Espero que vivas muchos años.", en: "I hope you live many years." }
    - { es: "Ojalá que vuelvan pronto.", en: "I hope they come back soon." }
- id: g.subjunctive-wishes
  level: b1
  title: "Wishes — querer que, esperar que, ojalá"
  summary: "When one person wants another to do something, the second verb goes in the subjunctive."
  explanation: |
    **Same subject → infinitive**: *Quiero viajar.* (I want to travel.)
    **Different subjects → que + subjunctive**: *Quiero que viajes.* (I want you to travel.)

    Triggers of wish and will:
    - *querer que, desear que, esperar que, preferir que, necesitar que*
    - *pedir que, rogar que, exigir que, insistir en que*
    - *ojalá (que)* + subjunctive — I hope / if only: *Ojalá llueva.*
    - *que + subjunctive* alone — a wish: *¡Que tengas buen viaje! ¡Que aproveche!*
  examples:
    - { es: "Mis padres quieren que estudie medicina.", en: "My parents want me to study medicine." }
    - { es: "Espero que te guste el regalo.", en: "I hope you like the present." }
    - { es: "¡Que te mejores!", en: "Get well soon!" }
  pitfalls:
    - "*Espero que + subjunctive* (I hope), but *espero + infinitive* when it's about me: *Espero verte pronto.*"
  drills:
    - { es: "Prefiero que vengas mañana.", en: "I'd rather you came tomorrow." }
    - { es: "Te pido que no digas nada.", en: "I ask you not to say anything." }
- id: g.subjunctive-irregular
  level: b1
  title: "Irregular present subjunctives"
  summary: "ser → sea, estar → esté, ir → vaya, haber → haya, saber → sepa, dar → dé."
  explanation: |
    Six verbs do not follow the yo-form rule:

    | verb | subjunctive |
    |---|---|
    | ser | sea, seas, sea, seamos, seáis, sean |
    | estar | esté, estés, esté, estemos, estéis, estén |
    | ir | vaya, vayas, vaya, vayamos, vayáis, vayan |
    | haber | haya, hayas, haya, hayamos, hayáis, hayan (*hay → haya*) |
    | saber | sepa, sepas, sepa, sepamos, sepáis, sepan |
    | dar | dé, des, dé, demos, deis, den |

    All other "irregular" verbs simply use the yo form: *tenga, venga, haga, diga, oiga, traiga, quepa, conozca, produzca.*
  examples:
    - { es: "Espero que estés bien.", en: "I hope you are well." }
    - { es: "No creo que haya problema.", en: "I don't think there's a problem." }
    - { es: "Quiero que vayamos juntos.", en: "I want us to go together." }
  drills:
    - { es: "Ojalá sepan la respuesta.", en: "I hope they know the answer." }
    - { es: "Es mejor que le des el libro.", en: "It's better that you give him the book." }
- id: g.subjunctive-emotion
  level: b1
  title: "Emotions and reactions — me alegro de que, siento que"
  summary: "After feelings about someone else's action: alegrarse de que, sentir que, me molesta que, tener miedo de que, es una pena que."
  explanation: |
    When you express an emotion about what someone else does, that action takes the subjunctive:
    - *Me alegro de que estés aquí.* — I'm glad you're here.
    - *Siento que no puedas venir.* — I'm sorry you can't come.
    - *Me molesta / me fastidia que fumen.* — It bothers me that they smoke.
    - *Tengo miedo de que llueva.* — I'm afraid it will rain.
    - *Me sorprende que no lo sepas.* — I'm surprised you don't know.
    - *Es una pena / es una lástima que…* — It's a shame that…
    - *Me gusta / me encanta / odio que…*

    Same subject → infinitive: *Me alegro de estar aquí.*
  examples:
    - { es: "Me encanta que cocines para mí.", en: "I love that you cook for me." }
    - { es: "Es una pena que no tengamos más tiempo.", en: "It's a shame we don't have more time." }
    - { es: "Me da rabia que siempre llegue tarde.", en: "It makes me angry that he always arrives late." }
  drills:
    - { es: "Nos alegramos de que hayáis venido.", en: "We're glad you came." }
    - { es: "Me sorprende que vivan tan lejos.", en: "I'm surprised they live so far away." }
- id: g.subjunctive-impersonal
  level: b1
  title: "Impersonal judgements — es importante que, es necesario que"
  summary: "es + adjective + que + subjunctive, except es verdad / es evidente / está claro que + indicative."
  explanation: |
    - **Subjunctive** after value judgements and necessity: *es importante que, es necesario que, es mejor que, es normal que, es raro que, es lógico que, es posible que, es probable que, es increíble que, hace falta que, conviene que.*
    - **Indicative** after statements of fact: *es verdad que, es cierto que, es evidente que, es obvio que, está claro que, es seguro que* (but negated → subjunctive: *no es verdad que sea…*).
    - With no specific subject, use the infinitive: *Es importante estudiar.* vs *Es importante que estudies.*
  examples:
    - { es: "Es necesario que llegues antes de las ocho.", en: "You need to arrive before eight." }
    - { es: "Es posible que mañana llueva.", en: "It's possible it will rain tomorrow." }
    - { es: "Es verdad que trabaja mucho.", en: "It's true that he works a lot." }
  pitfalls:
    - "No *de* here: *es importante que*, not *es importante de que*."
  drills:
    - { es: "Es mejor que no digas nada.", en: "It's better that you don't say anything." }
    - { es: "Está claro que tienes razón.", en: "It's clear you're right." }
- id: g.subjunctive-vs-infinitive
  level: b1
  title: "Subjunctive or infinitive?"
  summary: "One subject → infinitive. Two subjects → que + subjunctive."
  explanation: |
    | one subject | two subjects |
    |---|---|
    | *Quiero salir.* | *Quiero que salgas.* |
    | *Me alegro de verte.* | *Me alegro de que vengas.* |
    | *Es importante dormir.* | *Es importante que duermas.* |
    | *Antes de salir, llámame.* | *Antes de que salgas, llámame.* |
    | *Para aprender hay que practicar.* | *Te lo explico para que aprendas.* |

    Prepositions keep *de/para/sin/antes de/después de* in both versions; *que* appears only with a new subject.
  examples:
    - { es: "Necesito descansar. / Necesito que descanses.", en: "I need to rest. / I need you to rest." }
    - { es: "Prefiero quedarme en casa. / Prefiero que te quedes en casa.", en: "I prefer to stay at home. / I prefer you to stay at home." }
  drills:
    - { es: "Espero aprobar el examen.", en: "I hope to pass the exam." }
    - { es: "Espero que apruebes el examen.", en: "I hope you pass the exam." }
- id: g.subjunctive-doubt
  level: b1
  title: "Doubt and probability — dudo que, es posible que"
  summary: "Doubt, denial and uncertainty trigger the subjunctive: dudo que, no es seguro que, es posible que, puede que."
  explanation: |
    - *Dudo que venga.* — I doubt he'll come.
    - *No es seguro que lo sepa.* — It's not certain that she knows.
    - *Es posible / probable que llueva.* · *Puede (ser) que llueva.* — It may rain.
    - *No estoy seguro de que sea verdad.*
    - *Niego que haya dicho eso.* — I deny having said that.

    Certainty keeps the indicative: *Estoy seguro de que viene. Es seguro que viene. Sé que viene.*
  examples:
    - { es: "Dudo que terminen a tiempo.", en: "I doubt they'll finish on time." }
    - { es: "Puede que me equivoque.", en: "I may be wrong." }
    - { es: "Estoy seguro de que te va a gustar.", en: "I'm sure you'll like it." }
  drills:
    - { es: "No es probable que gane.", en: "It isn't likely that he'll win." }
    - { es: "Es posible que ya lo sepan.", en: "They may already know." }
- id: g.creer-no-creer
  level: b1
  title: "Creo que + indicative, no creo que + subjunctive"
  summary: "Affirming an opinion → indicative; negating it → subjunctive. Pensar, parecer, creer."
  explanation: |
    - *Creo que tienes razón.* (indicative) → *No creo que tengas razón.* (subjunctive)
    - *Pienso que es caro.* → *No pienso que sea caro.*
    - *Me parece que viene.* → *No me parece que venga.*
    - Questions with *¿crees que…?* usually keep the indicative: *¿Crees que lloverá?*
    - *No dudo que* (I don't doubt) often takes the indicative because it expresses certainty.
  examples:
    - { es: "Creo que la película es buena, pero no creo que sea la mejor del año.", en: "I think the film is good, but I don't think it's the best of the year." }
    - { es: "No me parece que sea una buena idea.", en: "I don't think it's a good idea." }
    - { es: "¿Crees que vendrán? No creo que vengan.", en: "Do you think they'll come? I don't think they will." }
  drills:
    - { es: "No pienso que tengas que preocuparte.", en: "I don't think you need to worry." }
    - { es: "Creo que ya han llegado.", en: "I think they have already arrived." }
- id: g.quizas-tal-vez
  level: b1
  title: "Quizás, tal vez, a lo mejor, probablemente"
  summary: "quizás / tal vez / probablemente + subjunctive (or indicative); a lo mejor always indicative."
  explanation: |
    - **quizás, quizá, tal vez, posiblemente, probablemente** + subjunctive when doubt is strong, indicative when the speaker feels fairly sure: *Quizás venga / Quizás viene.*
    - **a lo mejor, igual, lo mismo** (colloquial) → always **indicative**: *A lo mejor viene.*
    - **seguramente** → indicative or future: *Seguramente llegará tarde.*
    - Placed after the verb they take the indicative: *Viene, quizás.*
  examples:
    - { es: "Quizás vaya al cine esta noche.", en: "Maybe I'll go to the cinema tonight." }
    - { es: "A lo mejor nos vemos mañana.", en: "Maybe we'll see each other tomorrow." }
    - { es: "Tal vez tengas razón.", en: "You may be right." }
  drills:
    - { es: "Probablemente lleguen tarde.", en: "They'll probably arrive late." }
    - { es: "Igual no viene.", en: "Maybe he won't come." }
- id: g.imperative-negative
  level: b1
  title: "Negative commands — no hables, no comas, no te vayas"
  summary: "no + present subjunctive for all persons; pronouns go before the verb."
  explanation: |
    | | hablar | tener | irse |
    |---|---|---|---|
    | tú | no hables | no tengas | no te vayas |
    | usted | no hable | no tenga | no se vaya |
    | nosotros | no hablemos | no tengamos | no nos vayamos |
    | vosotros | no habléis | no tengáis | no os vayáis |
    | ustedes | no hablen | no tengan | no se vayan |

    Compare affirmative / negative with pronouns: *dímelo / no me lo digas; levántate / no te levantes; hazlo / no lo hagas.*
  examples:
    - { es: "No llegues tarde.", en: "Don't be late." }
    - { es: "No se preocupe, señora.", en: "Don't worry, madam." }
    - { es: "No lo toquéis, está caliente.", en: "Don't touch it, it's hot." }
  pitfalls:
    - "Affirmative *tú* = indicative form (*habla*), negative = subjunctive (*no hables*)."
  drills:
    - { es: "No me esperes, llegaré tarde.", en: "Don't wait for me, I'll be late." }
    - { es: "No comáis tanto chocolate.", en: "Don't eat so much chocolate." }
- id: g.subjunctive-advice
  level: b1
  title: "Advice — te recomiendo que, te aconsejo que, es mejor que"
  summary: "Verbs of advice and recommendation take que + subjunctive; or use the conditional / imperative."
  explanation: |
    Ways to advise:
    - **Subjunctive**: *Te recomiendo que descanses. Te aconsejo que vayas al médico. Te sugiero que lo pienses. Es mejor que esperes.*
    - **Conditional**: *Deberías descansar. Yo que tú, iría al médico. Yo en tu lugar, esperaría.*
    - **Imperative**: *Descansa. Ve al médico.*
    - **Impersonal**: *Hay que descansar. Conviene esperar.*
    - **¿Por qué no…?** *¿Por qué no descansas?*
  examples:
    - { es: "Te recomiendo que pruebes el pescado.", en: "I recommend you try the fish." }
    - { es: "Yo que tú, no compraría ese coche.", en: "If I were you, I wouldn't buy that car." }
    - { es: "Le aconsejo que llegue pronto.", en: "I advise you (formal) to arrive early." }
  drills:
    - { es: "Te sugiero que hables con tu jefe.", en: "I suggest you talk to your boss." }
    - { es: "Es mejor que no salgas con fiebre.", en: "It's better not to go out with a fever." }
- id: g.indirect-commands
  level: b1
  title: "Indirect commands — dice que vengas, que pase"
  summary: "Reporting an order or wish: decir / pedir / mandar que + subjunctive; que + subjunctive to pass on a command."
  explanation: |
    - *Mi madre dice que vengas a cenar.* — My mother says (that) you should come to dinner. (*decir que* + subjunctive = an order; + indicative = information: *dice que viene* = she says she's coming.)
    - *El médico me ha dicho que no fume.*
    - *Te pido que me escuches. Nos mandan que esperemos.*
    - **Que + subjunctive** on its own relays a command or wish to a third person: *¿El señor López? — Que pase. Que lo haga Juan. Que no toquen nada.*
  examples:
    - { es: "El profesor dice que entreguemos los deberes mañana.", en: "The teacher says we should hand in the homework tomorrow." }
    - { es: "Que venga ahora mismo.", en: "Tell him to come right now." }
    - { es: "Dice que está enfermo.", en: "He says he's ill." }
  drills:
    - { es: "Te he dicho que no corras.", en: "I told you not to run." }
    - { es: "Que lo pague él.", en: "Let him pay for it." }
- id: g.subjunctive-time-clauses
  level: b1
  title: "Cuando tenga tiempo — future time clauses"
  summary: "cuando, en cuanto, hasta que, después de que, antes de que + subjunctive when the action is still to come."
  explanation: |
    - Future or not-yet-happened → **subjunctive**: *Cuando llegue, te llamo. En cuanto termine, salimos. Espera hasta que vuelva.*
    - Habit or past fact → **indicative**: *Cuando llego a casa, ceno. Cuando llegué, cené.*
    - **antes de que** always takes the subjunctive: *Vámonos antes de que llueva.*
    - Same subject with *antes de / después de / hasta* → infinitive: *Antes de salir, cierra la puerta.*
    - Other time links: *mientras, tan pronto como, siempre que, cada vez que, una vez que.*
  examples:
    - { es: "Cuando seas mayor, lo entenderás.", en: "When you're older, you'll understand." }
    - { es: "Te escribo en cuanto aterrice el avión.", en: "I'll write to you as soon as the plane lands." }
    - { es: "Cuando era pequeño, iba a la playa cada verano.", en: "When I was little, I went to the beach every summer." }
  pitfalls:
    - "Never the future after *cuando*: *cuando llegue*, not *cuando llegaré*."
  drills:
    - { es: "Hasta que no termines, no sales.", en: "You're not going out until you finish." }
    - { es: "Avísame cuando estés lista.", en: "Let me know when you're ready." }
- id: g.subjunctive-purpose
  level: b1
  title: "Purpose — para que, a fin de que"
  summary: "para que + subjunctive when the person who acts changes; para + infinitive otherwise."
  explanation: |
    - *Estudio para aprobar.* (same subject — infinitive)
    - *Te lo explico para que lo entiendas.* (different subject — subjunctive)
    - Also: *a fin de que, con el fin de que, de modo que, de manera que* (so that), *sin que* (without): *Salió sin que nadie lo viera.*
  examples:
    - { es: "Habla despacio para que todos te entiendan.", en: "Speak slowly so that everyone understands you." }
    - { es: "Te dejo las llaves para que riegues las plantas.", en: "I'll leave you the keys so you can water the plants." }
    - { es: "Entró sin que lo oyéramos.", en: "He came in without us hearing him." }
  drills:
    - { es: "Ahorro para que mis hijos puedan estudiar.", en: "I save so that my children can study." }
    - { es: "Lo repito para que quede claro.", en: "I'll repeat it so it's clear." }
- id: g.si-clauses-real
  level: b1
  title: "Real conditions — si + present; si + perfect; a menos que"
  summary: "si + present → present / future / imperative; si + perfect for completed conditions; a menos que + subjunctive."
  explanation: |
    - **si + present**: *Si tengo tiempo, te llamo / te llamaré / llámame tú.*
    - **si + present perfect**: *Si has terminado, puedes irte.*
    - **si + imperfect / preterite** for the past: *Si llovía, nos quedábamos en casa.*
    - Never *si + present subjunctive* or *si + future*.
    - **a menos que / a no ser que / salvo que + subjunctive** (unless): *Iré a menos que llueva.*
    - **en caso de que + subjunctive** (in case): *Llévate el paraguas en caso de que llueva.*
    - **siempre que / con tal de que + subjunctive** (as long as): *Te ayudo siempre que me escuches.*
  examples:
    - { es: "Si no te das prisa, perderemos el tren.", en: "If you don't hurry, we'll miss the train." }
    - { es: "Si has visto la película, no me cuentes el final.", en: "If you've seen the film, don't tell me the ending." }
    - { es: "Saldremos a menos que haga mal tiempo.", en: "We'll go out unless the weather is bad." }
  drills:
    - { es: "Si quieres, vamos juntos.", en: "If you want, we'll go together." }
    - { es: "Llámame en caso de que necesites algo.", en: "Call me in case you need anything." }
- id: g.pluperfect
  level: b1
  title: "The past perfect — había hecho"
  summary: "había, habías, había, habíamos, habíais, habían + participle: an action before another past action."
  explanation: |
    **imperfect of haber + participle**: *había comido, habías salido, habíamos visto.*

    It places one past action before another:
    - *Cuando llegué, la película ya había empezado.* — When I arrived, the film had already started.
    - *No comí porque ya había cenado.*
    - *Nunca había visto el mar.* — I had never seen the sea (until then).

    Markers: *ya, todavía no, nunca, antes, cuando, porque.*
  examples:
    - { es: "Cuando llamaste, ya me había dormido.", en: "When you called, I had already fallen asleep." }
    - { es: "Me dijo que había perdido las llaves.", en: "She told me she had lost her keys." }
    - { es: "Hasta entonces nunca habíamos viajado en avión.", en: "Until then we had never travelled by plane." }
  drills:
    - { es: "Ya habían cerrado cuando llegamos.", en: "They had already closed when we arrived." }
    - { es: "No sabía que habías vuelto.", en: "I didn't know you had come back." }
- id: g.sequence-of-past
  level: b1
  title: "Four past tenses together"
  summary: "perfect (recent), preterite (events), imperfect (background), pluperfect (earlier past)."
  explanation: |
    Think of a timeline:
    1. **Pluperfect** — before the story: *Había llovido toda la noche.*
    2. **Imperfect** — the scene: *Las calles estaban mojadas y no había nadie.*
    3. **Preterite** — the events: *Salí de casa, resbalé y me caí.*
    4. **Perfect** — connects to now: *Hoy todavía me duele la pierna.*

    *Esta mañana me he levantado tarde porque anoche me acosté a las tres: estuve en una fiesta que había organizado mi vecino, y lo pasamos muy bien.*
  examples:
    - { es: "Cuando entré, todos se callaron: alguien había contado un secreto.", en: "When I came in, everyone fell silent: someone had told a secret." }
    - { es: "Estaba cansado porque había trabajado doce horas, así que me acosté pronto.", en: "I was tired because I had worked twelve hours, so I went to bed early." }
  drills:
    - { es: "Ya había salido el tren cuando llegamos a la estación.", en: "The train had already left when we got to the station." }
    - { es: "Esta semana he dormido poco porque tenía mucho trabajo.", en: "This week I've slept little because I had a lot of work." }
- id: g.antes-despues-de
  level: b1
  title: "Antes de, después de, al + infinitive"
  summary: "antes de salir, después de comer, al llegar; antes de que + subjunctive, después de que + indicative/subjunctive."
  explanation: |
    - **antes de + infinitive**: *Antes de salir, apaga la luz.*
    - **después de + infinitive**: *Después de cenar, vemos una película.*
    - **al + infinitive** = when / on doing: *Al llegar a casa, me duché.*
    - **antes de que + subjunctive**: *Antes de que llegue, prepara todo.*
    - **después de que + indicative** (past) / **subjunctive** (future): *Después de que llegó, cenamos. / Después de que llegue, cenaremos.*
    - **nada más + infinitive** (as soon as): *Nada más entrar, lo vi.*
  examples:
    - { es: "Lávate las manos antes de comer.", en: "Wash your hands before eating." }
    - { es: "Al verme, sonrió.", en: "On seeing me, she smiled." }
    - { es: "Después de que termine la reunión, te llamo.", en: "After the meeting ends, I'll call you." }
  drills:
    - { es: "Después de trabajar voy al gimnasio.", en: "After work I go to the gym." }
    - { es: "Cierra la puerta antes de que entre el gato.", en: "Close the door before the cat comes in." }
- id: g.relative-que-quien
  level: b1
  title: "Relative clauses — que, quien, el que, lo que"
  summary: "que for people and things; quien(es) for people after a preposition; el/la que; lo que = what."
  explanation: |
    - **que** — the universal relative: *el libro que leo, la chica que canta, el hombre que vi.*
    - **preposition + el / la / los / las que** or **quien / quienes** (people): *la casa en la que vivo, el amigo con quien / con el que viajé.*
    - **lo que** — what / the thing that: *No entiendo lo que dices.*
    - **quien** without an antecedent = whoever: *Quien quiera venir, que venga.*
    - **el cual / la cual** — formal alternative to *el que*.
    - No comma for defining clauses; commas for extra information: *Mi hermano, que vive en Londres, viene mañana.*
  examples:
    - { es: "El restaurante al que fuimos ayer es nuevo.", en: "The restaurant we went to yesterday is new." }
    - { es: "Es la persona en quien más confío.", en: "She's the person I trust most." }
    - { es: "Lo que más me gusta es la música.", en: "What I like most is music." }
  pitfalls:
    - "The preposition goes before the relative, never at the end: *la ciudad en la que vivo*."
  drills:
    - { es: "La chica con la que hablaba es mi prima.", en: "The girl I was talking to is my cousin." }
    - { es: "No sé lo que quiere.", en: "I don't know what he wants." }
- id: g.relative-donde-cuyo
  level: b1
  title: "Donde, cuando, cuyo, el cual"
  summary: "donde = where; cuando = when (relative); cuyo/a/os/as = whose (agrees with the thing owned); el cual = formal."
  explanation: |
    - **donde** (= en el que): *la ciudad donde nací*; **adonde** with movement.
    - **cuando**: *el día cuando / en que nos conocimos* (*en que* is more common).
    - **cuyo, cuya, cuyos, cuyas** — whose; agrees with the noun that follows, not the owner: *el escritor cuya novela leí; la empresa cuyos empleados protestan.* Formal / written.
    - **como** — the way in which: *la manera como lo hizo.*
    - **el cual / la cual / los cuales / las cuales** — formal, after prepositions: *las razones por las cuales…*
  examples:
    - { es: "Este es el pueblo donde viven mis abuelos.", en: "This is the village where my grandparents live." }
    - { es: "Es un autor cuyos libros se venden en todo el mundo.", en: "He's an author whose books sell all over the world." }
    - { es: "Recuerdo el verano en que nos conocimos.", en: "I remember the summer we met." }
  drills:
    - { es: "La casa donde nací ya no existe.", en: "The house where I was born no longer exists." }
    - { es: "Es una mujer cuya opinión respeto.", en: "She's a woman whose opinion I respect." }
- id: g.relative-subjunctive
  level: b1
  title: "Busco un piso que tenga… — subjunctive in relative clauses"
  summary: "Known, specific thing → indicative; unknown, hypothetical or non-existent → subjunctive."
  explanation: |
    - *Tengo un piso que tiene terraza.* (it exists — indicative)
    - *Busco un piso que tenga terraza.* (any flat with a terrace, maybe none — subjunctive)
    - *No hay nadie que sepa la respuesta.* (non-existent — subjunctive)
    - *¿Conoces a alguien que hable japonés?* (unknown — subjunctive)
    - *Haz lo que quieras. Ven cuando puedas. Vive donde te guste.* — whatever / whenever / wherever.
  examples:
    - { es: "Necesito a alguien que me ayude con la mudanza.", en: "I need someone to help me with the move." }
    - { es: "Quiero un coche que no gaste mucho.", en: "I want a car that doesn't use much fuel." }
    - { es: "Conozco a una chica que habla cinco idiomas.", en: "I know a girl who speaks five languages." }
  drills:
    - { es: "No conozco a nadie que viva allí.", en: "I don't know anyone who lives there." }
    - { es: "Busco un libro que explique bien el subjuntivo.", en: "I'm looking for a book that explains the subjunctive well." }
- id: g.se-impersonal
  level: b1
  title: "Impersonal se — se habla español, se puede, se dice"
  summary: "se + 3rd person singular for 'one / you / people in general'."
  explanation: |
    - *Aquí se habla español.* — Spanish is spoken here / people speak Spanish here.
    - *¿Se puede fumar?* — Can one smoke? *No se puede aparcar.*
    - *Se dice que…* — People say that… *Se cree, se piensa, se sabe.*
    - *¿Cómo se dice "book" en español?* *¿Cómo se escribe?* *¿Cómo se va al centro?*
    - Alternatives: *la gente, uno/una* (*Uno nunca sabe*), third person plural (*Dicen que…*), *tú* generic (*Si trabajas mucho, te cansas*).
  examples:
    - { es: "En España se cena muy tarde.", en: "In Spain people have dinner very late." }
    - { es: "¿Cómo se llega a la estación?", en: "How do you get to the station?" }
    - { es: "Se dice que va a subir el precio del pan.", en: "They say the price of bread is going to go up." }
  drills:
    - { es: "Aquí no se puede fumar.", en: "You can't smoke here." }
    - { es: "¿Cómo se pronuncia esta palabra?", en: "How do you pronounce this word?" }
- id: g.se-passive
  level: b1
  title: "Passive se — se venden pisos, se abrió la tienda"
  summary: "se + verb agreeing with the thing: se vende una casa, se venden casas."
  explanation: |
    When the agent does not matter, Spanish prefers **se + verb** to the *ser* passive:
    - *Se vende piso.* / *Se venden pisos.* (the verb agrees with the thing)
    - *Se construyó el puente en 1920.* *Se han cerrado tres fábricas.*
    - *La tortilla se hace con huevos y patatas.*
    - Instructions and recipes: *Se cortan las patatas y se fríen.*

    Difference from impersonal *se*: the passive *se* has a thing as subject and the verb can be plural; the impersonal *se* is always singular and often refers to people.
  examples:
    - { es: "Se alquilan habitaciones.", en: "Rooms for rent." }
    - { es: "El Quijote se publicó en 1605.", en: "Don Quixote was published in 1605." }
    - { es: "Se necesitan camareros con experiencia.", en: "Experienced waiters needed." }
  drills:
    - { es: "Aquí se venden las mejores naranjas.", en: "The best oranges are sold here." }
    - { es: "Se ha perdido un perro negro.", en: "A black dog has been lost." }
- id: g.passive-ser
  level: b1
  title: "The passive with ser — fue construido por"
  summary: "ser + participle (agreeing) + por + agent. Formal, written, news. Spoken Spanish prefers se or the active voice."
  explanation: |
    - *La catedral fue construida en el siglo XIII.* (participle agrees: *construida*)
    - *Los ladrones fueron detenidos por la policía.*
    - *El libro ha sido traducido a veinte idiomas.*
    - **estar + participle** describes the resulting state: *La puerta está cerrada* (it is closed) vs *La puerta fue cerrada por el portero* (it was closed by).

    Use it mainly in news, history and formal writing. In conversation: *Construyeron la catedral…* / *Se construyó la catedral…*
  examples:
    - { es: "La novela fue escrita por una autora chilena.", en: "The novel was written by a Chilean author." }
    - { es: "Los resultados serán publicados mañana.", en: "The results will be published tomorrow." }
    - { es: "Las ventanas están rotas.", en: "The windows are broken." }
  pitfalls:
    - "The participle agrees with the subject here (*fueron detenidos*), unlike in *han detenido*."
  drills:
    - { es: "El museo fue inaugurado por el rey.", en: "The museum was opened by the king." }
    - { es: "La carta ha sido enviada esta mañana.", en: "The letter has been sent this morning." }
- id: g.se-accidental
  level: b1
  title: "Accidental se — se me ha caído, se me olvidó"
  summary: "se + indirect pronoun + verb agreeing with the thing: unplanned events happen 'to' you."
  explanation: |
    To present an event as unintentional, Spanish uses **se + me/te/le/nos/os/les + verb**, and the thing is the subject:
    - *Se me ha caído el vaso.* — I dropped the glass (it fell on me).
    - *Se me olvidaron las llaves.* — I forgot the keys. (plural → *olvidaron*)
    - *Se le rompió el móvil.* — His phone broke.
    - *Se nos ha acabado la leche.* — We've run out of milk.
    - *Se te ha manchado la camisa.* — You've stained your shirt.

    Common verbs: *caer, olvidar, romper, perder, acabar, quemar, estropear, ocurrir* (*se me ocurre una idea* = an idea occurs to me).
  examples:
    - { es: "Perdona, se me ha olvidado tu nombre.", en: "Sorry, I've forgotten your name." }
    - { es: "Se les ha estropeado el coche.", en: "Their car has broken down." }
    - { es: "¿Se te ha ocurrido algo?", en: "Have you thought of anything?" }
  drills:
    - { es: "Se me ha quemado la cena.", en: "I've burnt the dinner." }
    - { es: "Se nos perdieron las maletas.", en: "We lost our suitcases." }
- id: g.reported-speech-present
  level: b1
  title: "Reported speech — dice que, pregunta si"
  summary: "With a present reporting verb nothing changes except the person: Dice que está cansado. Pregunta si vienes."
  explanation: |
    - Statements: *"Estoy cansado" → Dice que está cansado.*
    - Yes/no questions: *"¿Vienes?" → Pregunta si vienes.*
    - Question words keep their accent: *"¿Dónde vives?" → Pregunta dónde vives.*
    - Commands → *que + subjunctive*: *"Ven" → Dice que vengas.*
    - Adjust pronouns, possessives and place words: *"Mi casa está aquí" → Dice que su casa está allí.*
  examples:
    - { es: "Ana dice que no puede venir hoy.", en: "Ana says she can't come today." }
    - { es: "Me pregunta si tengo hermanos.", en: "She asks me whether I have siblings." }
    - { es: "El jefe dice que terminemos antes de las seis.", en: "The boss says we should finish before six." }
  drills:
    - { es: "Dice que llegará tarde.", en: "He says he'll be late." }
    - { es: "Preguntan cuánto cuesta.", en: "They ask how much it costs." }
- id: g.reported-speech-past
  level: b1
  title: "Reported speech in the past — dijo que vendría"
  summary: "present → imperfect; preterite/perfect → pluperfect; future → conditional; imperative → imperfect subjunctive."
  explanation: |
    When the reporting verb is in the past (*dijo, contó, explicó, preguntó*), tenses shift back:

    | direct | reported |
    |---|---|
    | *"Estoy cansado."* (present) | *Dijo que estaba cansado.* (imperfect) |
    | *"He comido." / "Comí."* | *Dijo que había comido.* (pluperfect) |
    | *"Vendré."* (future) | *Dijo que vendría.* (conditional) |
    | *"Voy a salir."* | *Dijo que iba a salir.* |
    | *"Ven."* (imperative) | *Dijo que viniera.* (imperfect subjunctive, B2) |
    | *"Estaba lloviendo."* (imperfect) | *Dijo que estaba lloviendo.* (no change) |

    Time words shift too: *hoy → ese día, ayer → el día anterior, mañana → el día siguiente, ahora → entonces, aquí → allí.*
  examples:
    - { es: "Me dijo que tenía mucho trabajo y que llegaría tarde.", en: "She told me she had a lot of work and would be late." }
    - { es: "Explicó que había vivido en México diez años.", en: "He explained that he had lived in Mexico for ten years." }
    - { es: "Preguntaron si íbamos a ir a la fiesta.", en: "They asked if we were going to go to the party." }
  drills:
    - { es: "Dijo que no podía venir porque estaba enfermo.", en: "He said he couldn't come because he was ill." }
    - { es: "Me contó que había perdido el tren.", en: "She told me she had missed the train." }
- id: g.reported-questions
  level: b1
  title: "Reported questions and useful reporting verbs"
  summary: "preguntar si / qué / dónde…; contar, explicar, comentar, asegurar, prometer, pedir, recomendar."
  explanation: |
    - **preguntar si** for yes/no questions; **preguntar + question word** otherwise. Word order is statement order: *Me preguntó dónde vivía* (not *dónde vivía yo* inverted as in English questions).
    - Reporting verbs with their meaning: *contar* (tell a story), *explicar, comentar* (mention), *asegurar* (assure), *prometer* (promise), *admitir, reconocer* (admit), *negar* (deny — subjunctive), *pedir / rogar que* (ask to), *recomendar / aconsejar que*, *proponer / sugerir que*.
    - *según + person* reports a source: *Según Juan, la fiesta es mañana.*
  examples:
    - { es: "Le pregunté si quería venir y me contestó que sí.", en: "I asked her if she wanted to come and she said yes." }
    - { es: "Nos aseguró que todo estaba bien.", en: "He assured us that everything was fine." }
    - { es: "Me recomendó que visitara Granada.", en: "She recommended that I visit Granada." }
  drills:
    - { es: "Me preguntaron qué hora era.", en: "They asked me what time it was." }
    - { es: "Prometió que llamaría.", en: "He promised he would call." }
- id: g.future-conditional-probability
  level: b1
  title: "Guessing about the present and the past — estará, estaría, habrá sido"
  summary: "future = probably (now); conditional = probably (then); future perfect = probably has."
  explanation: |
    | about | tense | example |
    |---|---|---|
    | the present | future | *Estará en casa.* (He's probably at home.) |
    | the past (imperfect idea) | conditional | *Serían las diez cuando llegó.* (It was probably ten.) |
    | the recent past | future perfect | *Habrá salido ya.* (He has probably left.) |
    | the remote past | conditional perfect | *Habría salido antes.* (He had probably left.) |

    Questions as wondering: *¿Qué hora será? ¿Dónde estarían?* — I wonder…
  examples:
    - { es: "No contesta. Estará ocupado.", en: "He isn't answering. He must be busy." }
    - { es: "Llegó tarde; habría perdido el tren.", en: "He arrived late; he had probably missed the train." }
    - { es: "¿Habrán recibido mi correo?", en: "I wonder if they've received my email." }
  drills:
    - { es: "Tendría unos treinta años cuando lo conocí.", en: "He must have been about thirty when I met him." }
    - { es: "Ya habrán cenado.", en: "They've probably had dinner already." }
- id: g.deber-de
  level: b1
  title: "Deber de, tener que, poder — probability with modal verbs"
  summary: "debe de ser (must be), tiene que ser (has to be), puede ser (may be)."
  explanation: |
    - **deber de + infinitive** — probable: *Debe de estar enfermo.* (He must be ill.) In practice *debe estar* is also used.
    - **tener que + infinitive** — strong deduction: *Tiene que ser él, lleva su chaqueta.*
    - **poder + infinitive** — possibility: *Puede estar en el trabajo.*
    - With the perfect infinitive for the past: *Debe de haber salido. Tiene que haber sido Juan.*
  examples:
    - { es: "Deben de ser las ocho ya.", en: "It must be eight already." }
    - { es: "No ha venido; debe de haber tenido un problema.", en: "He hasn't come; he must have had a problem." }
    - { es: "Puede ser que lleguen tarde.", en: "They may arrive late." }
  drills:
    - { es: "Tiene que estar cerca, oigo su voz.", en: "He must be close, I can hear his voice." }
    - { es: "Debe de costar mucho dinero.", en: "It must cost a lot of money." }
- id: g.conditional-hypothetical
  level: b1
  title: "What would you do? — the conditional for hypotheses"
  summary: "Yo compraría una casa. ¿Qué harías? Me gustaría… Sería mejor…"
  explanation: |
    - Imagined situations: *Con más dinero, viajaría por el mundo.*
    - Advice: *Yo no lo haría. Deberías hablar con él.*
    - Wishes and polite requests: *Me gustaría… ¿Podrías…?*
    - *En tu lugar / Yo que tú + conditional.*
    - The full unreal condition *si tuviera dinero, viajaría* needs the imperfect subjunctive (B2). At B1, use *con / sin + noun* or *en caso de + noun*: *Sin coche, no podría ir.*
  examples:
    - { es: "¿Qué harías con un millón de euros? Dejaría de trabajar.", en: "What would you do with a million euros? I'd stop working." }
    - { es: "Sería mejor salir ahora.", en: "It would be better to leave now." }
    - { es: "Yo en tu lugar aceptaría el trabajo.", en: "In your place I'd accept the job." }
  drills:
    - { es: "Me encantaría vivir junto al mar.", en: "I'd love to live by the sea." }
    - { es: "Nunca diría eso.", en: "I'd never say that." }
- id: g.connectors-cause-consequence
  level: b1
  title: "Cause and consequence — porque, como, ya que, así que, por lo tanto"
  summary: "porque, como (at the start), ya que, puesto que, debido a; así que, por eso, por lo tanto, de modo que."
  explanation: |
    **Cause**
    - *porque* (because — mid-sentence), *como* (as — at the start), *ya que / puesto que / dado que* (since — formal), *debido a + noun / debido a que* (due to), *gracias a* (thanks to), *por culpa de* (because of — negative), *por + noun/infinitive*: *Lo multaron por aparcar mal.*

    **Consequence**
    - *así que, por eso, por lo tanto, por consiguiente* (formal), *de modo que, de manera que, en consecuencia, total que* (informal).
    - *tan … que / tanto … que*: *Hacía tanto frío que no salimos.*
  examples:
    - { es: "Como no tenía dinero, me quedé en casa.", en: "As I had no money, I stayed at home." }
    - { es: "El vuelo se canceló debido a la tormenta; por lo tanto, llegamos un día tarde.", en: "The flight was cancelled due to the storm; therefore, we arrived a day late." }
    - { es: "Estaba tan cansado que me dormí en el sofá.", en: "I was so tired that I fell asleep on the sofa." }
  drills:
    - { es: "Ya que estás aquí, ayúdame.", en: "Since you're here, help me." }
    - { es: "Llovía mucho, así que cogimos un taxi.", en: "It was raining hard, so we took a taxi." }
- id: g.connectors-contrast
  level: b1
  title: "Contrast — pero, sin embargo, aunque, a pesar de, en cambio"
  summary: "pero, sino, sin embargo, no obstante, aunque, a pesar de (que), en cambio, mientras que, por un lado … por otro."
  explanation: |
    - **pero** (but) · **sino** (but rather, after a negative): *No es francés, sino belga.* **sino que** before a verb.
    - **sin embargo / no obstante** (however — formal, between commas).
    - **aunque** (although) + indicative for facts: *Aunque llueve, salimos.* (+ subjunctive for hypotheses at B2: *aunque llueva*).
    - **a pesar de + noun / infinitive**, **a pesar de que + verb** (despite).
    - **en cambio / por el contrario / mientras que** (whereas, on the other hand).
    - **por un lado … por otro (lado)** (on the one hand … on the other).
  examples:
    - { es: "Me gusta la ciudad; sin embargo, prefiero vivir en el campo.", en: "I like the city; however, I prefer living in the country." }
    - { es: "No quiero té, sino café.", en: "I don't want tea, but coffee." }
    - { es: "A pesar de la lluvia, el concierto fue un éxito.", en: "Despite the rain, the concert was a success." }
  pitfalls:
    - "*sino* corrects a negative; *pero* adds a contrast: *no es caro, sino barato* / *es caro, pero bueno.*"
  drills:
    - { es: "Aunque estaba cansada, terminó el trabajo.", en: "Although she was tired, she finished the work." }
    - { es: "Yo soy madrugadora; en cambio, mi hermano se levanta tarde.", en: "I'm an early riser; my brother, on the other hand, gets up late." }
- id: g.connectors-order
  level: b1
  title: "Organising a text — en primer lugar, además, por último, en resumen"
  summary: "Opening, adding, exemplifying, summarising and closing a structured text."
  explanation: |
    - **Opening**: *en primer lugar, para empezar, ante todo*
    - **Adding**: *además, también, asimismo, por otra parte, igualmente*
    - **Sequencing**: *en segundo lugar, a continuación, después, luego, por último, finalmente*
    - **Examples**: *por ejemplo, como, es decir, o sea* (that is)
    - **Emphasis**: *sobre todo, especialmente, de hecho*
    - **Summarising / closing**: *en resumen, en conclusión, en definitiva, para terminar, total que* (informal)
    - **Opinion markers**: *en mi opinión, a mi modo de ver, desde mi punto de vista, personalmente*
  examples:
    - { es: "En primer lugar, la ciudad es cara; además, hay mucho tráfico. En resumen, prefiero el pueblo.", en: "Firstly, the city is expensive; moreover, there is a lot of traffic. In short, I prefer the village." }
    - { es: "Me gustan los deportes de equipo, es decir, el fútbol y el baloncesto.", en: "I like team sports, that is, football and basketball." }
  drills:
    - { es: "Por último, quiero dar las gracias a mi familia.", en: "Finally, I want to thank my family." }
    - { es: "De hecho, ya lo había pensado.", en: "In fact, I had already thought of it." }
- id: g.formal-letters
  level: b1
  title: "Formal emails and letters"
  summary: "Estimado/a señor/a: … Le escribo para … Quedo a la espera de su respuesta. Atentamente,"
  explanation: |
    ### Opening
    - *Estimado señor García: / Estimada señora López: / Estimados señores:* (colon, not comma)
    - *A quien corresponda:* (To whom it may concern)
    - *Muy señor mío:* (very formal, dated)

    ### Body
    - *Le escribo para solicitar información sobre… / para presentar una queja / en relación con…*
    - *Me dirijo a ustedes con el fin de…*
    - *Les agradecería que me enviaran…* (I would be grateful if you sent…)
    - *Adjunto / Le envío adjunto mi currículum.*

    ### Closing
    - *Quedo a la espera de su respuesta. / En espera de sus noticias,*
    - *Le saluda atentamente, / Atentamente, / Un cordial saludo,* (semi-formal)
    - Informal: *Querido/a Ana: … Un abrazo, / Besos, / Hasta pronto,*

    Use *usted* throughout, avoid contractions and slang, and write dates as *Madrid, 3 de mayo de 2026.*
  examples:
    - { es: "Estimada señora Ruiz: Le escribo para confirmar mi asistencia a la reunión del lunes.", en: "Dear Mrs Ruiz, I am writing to confirm my attendance at Monday's meeting." }
    - { es: "Les agradecería que me informaran sobre los precios.", en: "I would be grateful if you could inform me about the prices." }
    - { es: "Quedo a su disposición para cualquier consulta. Atentamente, Marta Gil.", en: "I remain at your disposal for any queries. Yours sincerely, Marta Gil." }
  drills:
    - { es: "Me dirijo a usted para solicitar una beca.", en: "I am writing to you to apply for a grant." }
    - { es: "Adjunto le envío los documentos.", en: "Please find the documents attached." }
- id: g.ser-estar-advanced
  level: b1
  title: "Ser and estar — advanced"
  summary: "Adjectives that change meaning, estar + participle for states, ser for events and passives, estar for progress and prices."
  explanation: |
    ### Adjectives with two meanings
    | with ser | with estar |
    |---|---|
    | *es listo* — clever | *está listo* — ready |
    | *es aburrido* — boring | *está aburrido* — bored |
    | *es rico* — rich | *está rico* — tasty |
    | *es malo* — bad | *está malo* — ill |
    | *es verde* — green | *está verde* — unripe / inexperienced |
    | *es seguro* — safe | *está seguro* — sure |
    | *es despierto* — sharp | *está despierto* — awake |
    | *es orgulloso* — arrogant | *está orgulloso* — proud |

    ### Other uses
    - **ser** + participle = passive action; **estar** + participle = resulting state: *fue cerrado / está cerrado.*
    - **ser** for events: *La reunión es a las diez.* **estar** for location of things / people.
    - **estar** for prices that vary, dates, in a job temporarily: *Las fresas están a tres euros. Estamos a 10 de mayo. Está de camarero.*
    - **estar + bien / mal / claro / de acuerdo / de moda / de vacaciones.**
  examples:
    - { es: "El examen es mañana y estoy muy nervioso.", en: "The exam is tomorrow and I'm very nervous." }
    - { es: "Mi hermano es muy listo, pero nunca está listo a tiempo.", en: "My brother is very clever, but he's never ready on time." }
    - { es: "¿A cuánto están los tomates hoy?", en: "How much are tomatoes today?" }
  drills:
    - { es: "La sopa está buenísima.", en: "The soup is delicious." }
    - { es: "Estamos de vacaciones hasta el lunes.", en: "We're on holiday until Monday." }
- id: g.verbal-periphrases
  level: b1
  title: "Verbal periphrases — seguir, llevar, dejar de, volver a, acabar de, ponerse a"
  summary: "Aspect through verb phrases: start, continue, repeat, stop, duration, result."
  explanation: |
    | phrase | meaning | example |
    |---|---|---|
    | *empezar / comenzar a + inf.* | start | *Empezó a llover.* |
    | *ponerse a + inf.* | start suddenly | *Se puso a gritar.* |
    | *seguir / continuar + gerund* | keep on | *Sigue lloviendo.* |
    | *llevar + time + gerund* | have been doing | *Llevo una hora esperando.* |
    | *llevar + participle* | have done so far | *Llevo leídas cien páginas.* |
    | *dejar de + inf.* | stop | *Dejó de fumar.* |
    | *volver a + inf.* | do again | *Volvió a llamar.* |
    | *acabar de + inf.* | have just | *Acabo de llegar.* |
    | *estar a punto de + inf.* | be about to | *Está a punto de salir.* |
    | *ir + gerund* | gradually | *Va mejorando.* |
    | *andar + gerund* | go around doing | *Anda diciendo tonterías.* |
    | *tener que / deber / haber de + inf.* | obligation | *He de irme.* |
    | *soler + inf.* | usually | *Suelo madrugar.* |
  examples:
    - { es: "Lleva tres años viviendo en Berlín y sigue sin hablar alemán.", en: "He's been living in Berlin for three years and still doesn't speak German." }
    - { es: "Estaba a punto de llamarte cuando llegaste.", en: "I was about to call you when you arrived." }
    - { es: "Poco a poco va aprendiendo.", en: "Little by little he's learning." }
  drills:
    - { es: "Deja de quejarte y ponte a trabajar.", en: "Stop complaining and get to work." }
    - { es: "Volvieron a perder el partido.", en: "They lost the match again." }
- id: g.b1-review
  level: b1
  title: "B1 review — the subjunctive map"
  summary: "When the present subjunctive appears: wish, emotion, judgement, doubt, purpose, future time, unknown antecedent, negative commands."
  explanation: |
    | trigger | example |
    |---|---|
    | wish / will | *Quiero que vengas.* |
    | emotion | *Me alegro de que estés aquí.* |
    | judgement / necessity | *Es importante que estudies.* |
    | doubt / denial | *No creo que sea verdad.* |
    | purpose | *Te lo digo para que lo sepas.* |
    | future time | *Cuando llegue, te llamo.* |
    | unknown / non-existent antecedent | *Busco a alguien que hable ruso.* |
    | negative command | *No hables.* |
    | wishes with que / ojalá | *Ojalá apruebe. ¡Que te vaya bien!* |

    **Indicative** stays for facts, certainty, affirmed opinions, habits and the past: *Sé que viene. Creo que es verdad. Cuando llego, ceno.*

    Also at B1: pluperfect, reported speech, relative clauses, *se* constructions, cause/contrast connectors, formal letters, periphrases.
  examples:
    - { es: "Espero que, cuando leas esto, ya hayas aprobado.", en: "I hope that, when you read this, you'll already have passed." }
    - { es: "No creo que haya nadie que sepa la respuesta.", en: "I don't think there's anyone who knows the answer." }
  drills:
    - { es: "Es raro que no haya llamado todavía.", en: "It's strange that he hasn't called yet." }
    - { es: "Dime lo que quieras, no voy a cambiar de opinión.", en: "Say what you like, I'm not going to change my mind." }
