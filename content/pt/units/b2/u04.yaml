id: b2.u04
title: "Embora chova"
lessons:
  - id: b2.u04.l1
    title: Embora esteja calor
    teach: [g.embora-concession]
    vocab: [w.embora.conj, w.ainda-que, w.mesmo-que, w.se-bem-que, w.umidade, w.abafado, w.mormaço, w.sensação-térmica, w.capa-de-chuva, w.temporada, w.chuvoso, w.sombra, w.insolação, w.desidratação, w.hidratar-se, w.ventilador, w.ar-condicionado, w.brisa, w.terrível, w.desfilar]
    tip: "embora, ainda que and mesmo que always take the subjunctive, even for real facts: Embora esteja calor… Mesmo + adjective or gerund is the easy spoken shortcut: Mesmo cansada, ela foi."
    sentences:
      - { es: "Embora esteja muito calor, vamos subir até o Alto da Sé.", en: "Although it's very hot, we're going to walk up to the Alto da Sé.", altEs: ["Embora esteja fazendo muito calor, vamos subir até o Alto da Sé.", "Embora esteja muito quente, vamos subir até o Alto da Sé."], grammar: [g.embora-concession], vocab: [w.embora.conj], note: "The Alto da Sé is the hilltop square of Olinda, with a view over Recife.", error: { wrong: "Embora está muito calor, vamos subir até o Alto da Sé.", explain: "embora always takes the subjunctive, even for a real fact: esteja.", grammar: g.embora-concession } }
      - { es: "Embora a umidade seja alta, a brisa do mar ajuda.", en: "Although the humidity is high, the sea breeze helps.", grammar: [g.embora-concession], vocab: [w.umidade], variant: "Portugal: humidade." }
      - { es: "Mesmo que chova, o bloco vai sair.", en: "Even if it rains, the carnival group will go out.", altEs: ["Mesmo que chova, o bloco sai."], grammar: [g.embora-concession], vocab: [w.mesmo-que, w.bloco] }
      - { es: "Ainda que o dia esteja abafado, ninguém deixa de dançar frevo.", en: "Even though the day is muggy, nobody stops dancing frevo.", altEs: ["Embora o dia esteja abafado, ninguém deixa de dançar frevo."], grammar: [g.embora-concession], vocab: [w.ainda-que, w.abafado] }
      - { es: "Hoje faz trinta e dois graus, se bem que a sensação térmica é de quarenta.", en: "It's thirty-two degrees today, though it feels like forty.", altEs: ["Hoje faz trinta e dois graus, se bem que a sensação térmica seja de quarenta."], grammar: [g.embora-concession, g.weather], vocab: [w.se-bem-que, w.sensação-térmica], note: "In speech se bem que often works like 'mind you' and takes the indicative." }
      - { es: "Mesmo com esse mormaço, os turistas sobem as ladeiras de Olinda.", en: "Even in this sultry haze, the tourists climb the steep streets of Olinda.", grammar: [g.embora-concession, g.apesar-de], vocab: [w.mormaço] }
      - { es: "Leve a capa de chuva, mesmo que o céu esteja azul: na temporada de chuvas, o tempo muda rápido.", en: "Take your raincoat, even if the sky is blue: in the rainy season, the weather changes fast.", altEs: ["Leva a capa de chuva, mesmo que o céu esteja azul: na temporada de chuvas, o tempo muda rápido."], grammar: [g.embora-concession, g.imperative-formal], vocab: [w.capa-de-chuva, w.temporada], variant: "Portugal: gabardina or impermeável." }
      - { es: "Embora julho seja um mês chuvoso, Olinda continua cheia de turistas.", en: "Although July is a rainy month, Olinda is still full of tourists.", grammar: [g.embora-concession], vocab: [w.chuvoso] }
      - { es: "Fique na sombra, mesmo que pareça exagero: insolação não é brincadeira.", en: "Stay in the shade, even if it seems over the top: sunstroke is no joke.", altEs: ["Fica na sombra, mesmo que pareça exagero: insolação não é brincadeira."], grammar: [g.embora-concession, g.imperative-formal], vocab: [w.sombra, w.insolação] }
      - { es: "Embora tenha bebido muita água, ela teve desidratação no segundo dia de Carnaval.", en: "Although she had drunk lots of water, she got dehydrated on the second day of Carnival.", altEs: ["Embora tivesse bebido muita água, ela teve desidratação no segundo dia de Carnaval."], grammar: [g.embora-concession, g.subjunctive-perfect], vocab: [w.desidratação] }
      - { es: "Hidrate-se bem, ainda que não sinta sede.", en: "Drink plenty of water, even if you don't feel thirsty.", altEs: ["Se hidrate bem, ainda que não sinta sede.", "Se hidrate bem, mesmo que não sinta sede."], grammar: [g.embora-concession, g.imperative-formal], vocab: [w.hidratar-se], note: "Hidrate-se is the written form; in speech Brazilians say Se hidrata!" }
      - { es: "Embora o quarto tenha ventilador, eu preferia ar-condicionado.", en: "Although the room has a fan, I'd rather have air conditioning.", altEs: ["Embora o quarto tenha ventilador, eu preferiria ar-condicionado."], grammar: [g.embora-concession], vocab: [w.ventilador, w.ar-condicionado] }
      - { es: "Mesmo cansada, ela dançou até o sol nascer.", en: "Even though she was tired, she danced until the sun came up.", altEs: ["Mesmo cansada, ela dançou até o dia nascer."], grammar: [g.embora-concession], vocab: [], note: "mesmo + adjective: a short way to say embora estivesse cansada." }
      - { es: "Mesmo chovendo, fomos ver os bonecos no Carnaval.", en: "Even though it was raining, we went to see the giant puppets at Carnival.", altEs: ["Mesmo com chuva, fomos ver os bonecos no Carnaval."], grammar: [g.embora-concession, g.estar-gerund-past], vocab: [w.boneco] }
      - { es: "Está chovendo, mas vamos sair.", en: "It's raining, but we're going out.", grammar: [g.estar-gerund], vocab: [], transform: { instruction: "Join the two ideas with Embora…", answer: "Embora esteja chovendo, vamos sair.", alt: ["Embora esteja chovendo, a gente vai sair.", "Mesmo chovendo, vamos sair."], en: "Although it's raining, we're going out." } }
      - { es: "Ele estava cansado, mas foi ao ensaio do bloco.", en: "He was tired, but he went to the carnival group's rehearsal.", grammar: [g.imperfect], vocab: [w.bloco], transform: { instruction: "Join with embora (past: imperfect subjunctive)", answer: "Embora estivesse cansado, ele foi ao ensaio do bloco.", alt: ["Embora estivesse cansado, foi ao ensaio do bloco.", "Mesmo cansado, ele foi ao ensaio do bloco."], en: "Although he was tired, he went to the carnival group's rehearsal." } }
    exchanges:
      - q: { es: "Vamos subir a ladeira agora?", en: "Shall we walk up the hill now?" }
        a: { es: "Vamos, embora o sol esteja forte.", en: "Let's, although the sun is strong." }
        alt: ["Vamos, mesmo com esse calor.", "Agora não; melhor esperar o fim da tarde."]
        grammar: [g.embora-concession]
        vocab: [w.embora.conj]
      - q: { es: "Você vai ao Carnaval mesmo com chuva?", en: "Are you going to Carnival even with the rain?" }
        a: { es: "Vou, mesmo que chova o dia todo!", en: "I am, even if it rains all day!" }
        alt: ["Claro, mesmo que chova.", "Vou, nem que seja de capa de chuva."]
        grammar: [g.embora-concession]
        vocab: [w.mesmo-que]
      - q: { es: "O quarto tem ar-condicionado?", en: "Does the room have air conditioning?" }
        a: { es: "Não, só ventilador, se bem que à noite a temperatura cai um pouco.", en: "No, just a fan, though at night the temperature drops a bit." }
        alt: ["Tem, sim.", "Só ventilador."]
        grammar: [g.embora-concession]
        vocab: [w.ar-condicionado, w.ventilador, w.se-bem-que]
      - q: { es: "Por que você está tão vermelho?", en: "Why are you so red?" }
        a: { es: "Fiquei no sol sem chapéu; acho que é insolação.", en: "I stayed in the sun without a hat; I think it's sunstroke." }
        alt: ["Esqueci o protetor.", "É o calor; preciso me hidratar."]
        grammar: [g.preterite-regular]
        vocab: [w.insolação]
      - q: { es: "Quando é a alta temporada em Olinda?", en: "When is high season in Olinda?" }
        a: { es: "No Carnaval, embora tenha turistas o ano todo.", en: "At Carnival, although there are tourists all year round." }
        alt: ["Em fevereiro, no Carnaval.", "No verão."]
        grammar: [g.embora-concession, g.tem-there-is]
        vocab: [w.temporada]
    texts:
      - title: "Previsão do tempo"
        es: ["Recife e Olinda: máxima de 31 graus, com sensação térmica de 36.", "Embora não haja previsão de chuva, a umidade continua alta.", "Hidrate-se e evite o sol entre as 11 e as 15 horas."]
        en: ["Recife and Olinda: high of 31 degrees, feeling like 36.", "Although no rain is forecast, the humidity remains high.", "Drink plenty of water and avoid the sun between 11 am and 3 pm."]
        grammar: [g.embora-concession, g.imperative-formal]
        vocab: [w.sensação-térmica, w.umidade, w.hidratar-se]
      - title: "Dica de um morador"
        es: ["Embora o Carnaval seja em fevereiro, os blocos ensaiam desde janeiro.", "Leve água e procure a sombra, mesmo que pareça exagero.", "As ladeiras de Olinda não perdoam!"]
        en: ["Although Carnival is in February, the carnival groups rehearse from January.", "Take water and look for shade, even if it seems over the top.", "Olinda's steep streets show no mercy!"]
        grammar: [g.embora-concession]
        vocab: [w.sombra, w.bloco]
    spicy:
      - { es: "Embora esteja calor, eu não me importaria de dançar bem pertinho de você.", en: "Even though it's hot, I wouldn't mind dancing really close to you.", altEs: ["Embora esteja calor, eu não me importaria de dançar bem pertinho com você."], grammar: [g.embora-concession], vocab: [w.embora.conj] }
      - { es: "Mesmo que chova, o nosso encontro está de pé.", en: "Even if it rains, our date is still on.", altEs: ["Mesmo que chova, nosso encontro está de pé."], grammar: [g.embora-concession], vocab: [w.mesmo-que] }
      - { es: "Embora a sensação térmica seja de quarenta graus, quem me deixa com calor é você.", en: "Although it feels like forty degrees, the one making me hot is you.", grammar: [g.embora-concession], vocab: [w.sensação-térmica] }
      - { es: "Ainda que o ventilador esteja ligado, este quarto esquentou quando você chegou.", en: "Even though the fan is on, this room heated up when you arrived.", grammar: [g.embora-concession], vocab: [w.ainda-que, w.ventilador] }
      - { es: "Fique na sombra comigo, mesmo que o sol esteja lindo.", en: "Stay in the shade with me, even if the sun is lovely.", altEs: ["Fica na sombra comigo, mesmo que o sol esteja lindo."], grammar: [g.embora-concession], vocab: [w.sombra] }
  - id: b2.u04.l2
    title: Por mais que eu tente
    teach: [g.por-mais-que]
    vocab: [w.por-mais-que, w.nem-que, w.obstáculo, w.dificuldade, w.desafio, w.persistência, w.persistir, w.determinação, w.força-de-vontade, w.esforço, w.esforçar-se, w.exaustivo, w.árduo, w.queimar, w.clarear, w.amenizar, w.boneco, w.ateliê]
    tip: "por mais que + subjunctive = however much; put adjectives and nouns in the middle: por mais difícil que seja, por mais esforço que eu faça. nem que seja = even if it's only…"
    sentences:
      - { es: "Por mais que eu tente, não consigo subir essa ladeira sem parar.", en: "However hard I try, I can't get up this hill without stopping.", altEs: ["Por mais que eu tente, não consigo subir esta ladeira sem parar."], grammar: [g.por-mais-que], vocab: [w.por-mais-que], error: { wrong: "Por mais que eu tento, não consigo subir essa ladeira sem parar.", explain: "por mais que always takes the subjunctive: tente.", grammar: g.por-mais-que } }
      - { es: "Por mais difícil que seja, vou carregar o boneco no Carnaval.", en: "However hard it is, I'm going to carry the giant puppet at Carnival.", altEs: ["Por mais difícil que seja, eu vou carregar o boneco no Carnaval."], grammar: [g.por-mais-que], vocab: [w.boneco], note: "Olinda's giant puppets, the bonecos gigantes, are carried by one person inside each figure." }
      - { es: "Por mais que chova, a festa continua.", en: "However much it rains, the party goes on.", grammar: [g.por-mais-que], vocab: [w.por-mais-que] }
      - { es: "Por mais cansados que estivessem, os músicos tocaram a noite toda.", en: "However tired they were, the musicians played all night.", grammar: [g.por-mais-que, g.subjunctive-imperfect], vocab: [] }
      - { es: "Vou terminar a pintura hoje, nem que seja de madrugada.", en: "I'm going to finish the painting today, even if it's in the early hours.", altEs: ["Vou acabar a pintura hoje, nem que seja de madrugada."], grammar: [g.por-mais-que, g.como-se], vocab: [w.nem-que] }
      - { es: "Por maior que fosse o obstáculo, ela não desistia.", en: "However big the obstacle, she didn't give up.", grammar: [g.por-mais-que, g.subjunctive-imperfect], vocab: [w.obstáculo], note: "maior replaces mais grande: por maior que fosse." }
      - { es: "Por mais dificuldades que tenha, o artista não sai de Olinda.", en: "However many difficulties he has, the artist won't leave Olinda.", grammar: [g.por-mais-que], vocab: [w.dificuldade] }
      - { es: "Carregar um boneco gigante é um desafio, por mais forte que você seja.", en: "Carrying a giant puppet is a challenge, however strong you are.", grammar: [g.por-mais-que], vocab: [w.desafio, w.boneco] }
      - { es: "Se você persistir, por mais devagar que seja, vai conseguir.", en: "If you persist, however slowly, you'll get there.", grammar: [g.por-mais-que, g.future-subjunctive-se], vocab: [w.persistir] }
      - { es: "A determinação dela impressiona: por mais que digam não, ela continua.", en: "Her determination is impressive: however often they say no, she carries on.", grammar: [g.por-mais-que], vocab: [w.determinação] }
      - { es: "Por mais força de vontade que eu tenha, não resisto a uma tapioca no Alto da Sé.", en: "However much willpower I have, I can't resist a tapioca at the Alto da Sé.", grammar: [g.por-mais-que], vocab: [w.força-de-vontade] }
      - { es: "Por mais esforço que faça, ele não consegue dançar frevo.", en: "However much effort he makes, he can't dance frevo.", altEs: ["Por mais que se esforce, ele não consegue dançar frevo."], grammar: [g.por-mais-que], vocab: [w.esforço, w.esforçar-se] }
      - { es: "Foi um dia exaustivo, por mais bonito que tenha sido.", en: "It was an exhausting day, however beautiful it was.", grammar: [g.por-mais-que, g.subjunctive-perfect], vocab: [w.exaustivo] }
      - { es: "O sol queima, por mais protetor que a gente passe.", en: "The sun burns, however much sunscreen we put on.", altEs: ["O sol queima, por mais protetor que nós passemos."], grammar: [g.por-mais-que, g.a-gente], vocab: [w.queimar] }
      - { es: "Eu explico muitas vezes, mas ele não entende.", en: "I explain many times, but he doesn't understand.", grammar: [g.connectors-contrast], vocab: [], transform: { instruction: "Rewrite with Por mais que…", answer: "Por mais que eu explique, ele não entende.", alt: ["Por mais que explique, ele não entende."], en: "However much I explain, he doesn't understand." } }
      - { es: "A ladeira é difícil, mas vamos subir.", en: "The hill is hard, but we're going up.", grammar: [g.connectors-contrast], vocab: [], transform: { instruction: "Rewrite with Por mais + adjective + que…", answer: "Por mais difícil que seja a ladeira, vamos subir.", alt: ["Por mais difícil que a ladeira seja, vamos subir.", "Por mais difícil que seja a ladeira, a gente vai subir."], en: "However hard the hill is, we're going up." } }
    exchanges:
      - q: { es: "Você ainda vai subir até a igreja?", en: "Are you still going to climb up to the church?" }
        a: { es: "Vou, nem que seja devagarinho.", en: "I am, even if I have to go really slowly." }
        alt: ["Vou, nem que seja a última coisa que eu faça!", "Hoje não, amanhã."]
        grammar: [g.por-mais-que]
        vocab: [w.nem-que]
      - q: { es: "Qual foi o maior desafio da viagem?", en: "What was the biggest challenge of the trip?" }
        a: { es: "As ladeiras de Olinda; por mais que eu treinasse, ficava sem ar.", en: "Olinda's steep streets; however much I trained, I ran out of breath." }
        alt: ["O calor.", "Carregar o boneco no Carnaval."]
        grammar: [g.por-mais-que, g.subjunctive-imperfect]
        vocab: [w.desafio]
      - q: { es: "Como ela conseguiu abrir o ateliê?", en: "How did she manage to open her studio?" }
        a: { es: "Com muita persistência e força de vontade.", en: "With lots of persistence and willpower." }
        alt: ["Com muito esforço.", "Trabalhando dia e noite."]
        grammar: [g.por-mais-que]
        vocab: [w.persistência, w.força-de-vontade]
      - q: { es: "Você conseguiu convencer o seu pai?", en: "Did you manage to convince your father?" }
        a: { es: "Não; por mais que eu insista, ele não muda de ideia.", en: "No; however much I insist, he doesn't change his mind." }
        alt: ["Ainda não, mas vou persistir.", "Consegui, depois de muito esforço."]
        grammar: [g.por-mais-que]
        vocab: [w.por-mais-que]
      - q: { es: "Esse calor vai passar?", en: "Is this heat going to let up?" }
        a: { es: "Dizem que à tarde o céu vai clarear e o vento vai amenizar o calor.", en: "They say the sky will clear up in the afternoon and the wind will ease the heat." }
        alt: ["Só à noite.", "Tomara que sim!"]
        grammar: [g.future-spoken-vs-written]
        vocab: [w.clarear, w.amenizar]
    texts:
      - title: "Depoimento de um carregador de boneco"
        es: ["Carrego o boneco do meu bairro há dez anos.", "Por mais pesado que seja, é uma alegria.", "No fim do dia, é exaustivo, mas eu não troco por nada."]
        en: ["I've carried my neighbourhood's giant puppet for ten years.", "However heavy it is, it's a joy.", "By the end of the day it's exhausting, but I wouldn't swap it for anything."]
        grammar: [g.por-mais-que, g.ha-faz-time]
        vocab: [w.boneco, w.exaustivo]
      - title: "Mensagem motivacional"
        es: ["Por mais árduo que pareça o caminho, não desista.", "Cada obstáculo ensina alguma coisa.", "Persista, nem que seja um passo por dia."]
        en: ["However hard the road may seem, don't give up.", "Every obstacle teaches you something.", "Keep going, even if it's just one step a day."]
        grammar: [g.por-mais-que, g.imperative-formal]
        vocab: [w.árduo, w.obstáculo, w.persistir, w.nem-que]
    spicy:
      - { es: "Por mais que eu tente, não consigo parar de olhar para você.", en: "However hard I try, I can't stop looking at you.", altEs: ["Por mais que eu tente, não consigo parar de olhar pra você."], grammar: [g.por-mais-que], vocab: [w.por-mais-que] }
      - { es: "Vou dançar com você esta noite, nem que seja a última música.", en: "I'm going to dance with you tonight, even if it's the last song.", altEs: ["Vou dançar com você hoje à noite, nem que seja a última música."], grammar: [g.por-mais-que], vocab: [w.nem-que] }
      - { es: "Por mais bonito que você seja, não subo essa ladeira de novo, a não ser que você me carregue.", en: "However good-looking you are, I'm not climbing that hill again, unless you carry me.", altEs: ["Por mais bonita que você seja, não subo essa ladeira de novo, a não ser que você me carregue."], grammar: [g.por-mais-que, g.conditional-conjunctions], vocab: [] }
      - { es: "Esquecer você é um desafio árduo, por mais força de vontade que eu tenha.", en: "Forgetting you is a tough challenge, however much willpower I have.", grammar: [g.por-mais-que], vocab: [w.desafio, w.árduo, w.força-de-vontade] }
      - { es: "O sol de Olinda queima, mas o seu olhar queima mais.", en: "The Olinda sun burns, but your gaze burns more.", grammar: [g.comparatives], vocab: [w.queimar] }
  - id: b2.u04.l3
    title: Apesar da seca
    teach: [g.apesar-de]
    vocab: [w.apesar-de, w.apesar-disso, w.de-qualquer-forma, w.de-qualquer-jeito, w.em-todo-caso, w.todavia, w.sertão, w.caatinga, w.mandacaru, w.açude, w.retirante, w.vaqueiro, w.gibão, w.cangaço, w.cangaceiro, w.estiagem, w.irrigação, w.cisterna, w.couro, w.espinho, w.florescer]
    tip: "apesar de + noun (apesar da seca), + infinitive (apesar de estar cansada) or + personal infinitive when the subject changes (apesar de eles serem jovens). Never drop the de."
    sentences:
      - { es: "Apesar da seca, o mandacaru continua verde.", en: "Despite the drought, the mandacaru cactus stays green.", grammar: [g.apesar-de], vocab: [w.apesar-de, w.mandacaru], note: "In the sertão, a flowering mandacaru is said to announce rain." }
      - { es: "Apesar de morar no sertão, ele nunca tinha visto a caatinga tão seca.", en: "Despite living in the sertão, he had never seen the caatinga so dry.", grammar: [g.apesar-de, g.pluperfect], vocab: [w.sertão, w.caatinga] }
      - { es: "Apesar de o açude estar quase vazio, ainda há água para os animais.", en: "Although the reservoir is almost empty, there's still water for the animals.", altEs: ["Apesar do açude estar quase vazio, ainda tem água para os animais."], grammar: [g.apesar-de, g.personal-infinitive-uses], vocab: [w.açude], note: "Written norm: apesar de o açude; in speech: apesar do açude." }
      - { es: "Choveu pouco este ano; apesar disso, a colheita foi razoável.", en: "It rained little this year; even so, the harvest was reasonable.", grammar: [g.apesar-de], vocab: [w.apesar-disso] }
      - { es: "Muitos retirantes deixaram o sertão por causa da seca, apesar de amarem a terra.", en: "Many migrants left the sertão because of the drought, despite loving the land.", grammar: [g.apesar-de, g.personal-infinitive-uses], vocab: [w.retirante] }
      - { es: "O vaqueiro usa gibão de couro, apesar do calor, para se proteger dos espinhos da caatinga.", en: "The cowboy wears a leather jacket, despite the heat, to protect himself from the caatinga's thorns.", grammar: [g.apesar-de], vocab: [w.vaqueiro, w.gibão, w.caatinga] }
      - { es: "Apesar de ter sido cangaceiro, Lampião virou herói em muitas canções.", en: "Despite having been a bandit, Lampião became a hero in many songs.", grammar: [g.apesar-de], vocab: [w.cangaceiro], note: "Lampião (1898–1938), born in the sertão of Pernambuco, was the best-known leader of the cangaço." }
      - { es: "A estiagem durou meses; de qualquer forma, ninguém perdeu a esperança.", en: "The dry spell lasted months; in any case, nobody lost hope.", grammar: [g.apesar-de], vocab: [w.estiagem, w.de-qualquer-forma] }
      - { es: "Apesar da irrigação, as plantações sofreram com o calor.", en: "Despite the irrigation, the crops suffered in the heat.", grammar: [g.apesar-de], vocab: [w.irrigação] }
      - { es: "Graças à cisterna, a família tem água, apesar de a chuva ser rara.", en: "Thanks to the water tank, the family has water, even though rain is rare.", altEs: ["Graças à cisterna, a família tem água, apesar da chuva ser rara."], grammar: [g.apesar-de, g.personal-infinitive-uses], vocab: [w.cisterna] }
      - { es: "Não sei se vai chover; em todo caso, vamos encher a cisterna.", en: "I don't know if it'll rain; in any case, let's fill the water tank.", grammar: [g.apesar-de], vocab: [w.em-todo-caso, w.cisterna] }
      - { es: "O artesanato do sertão é simples; todavia, é muito valorizado em Olinda.", en: "Crafts from the sertão are simple; however, they are highly valued in Olinda.", grammar: [g.connectors-contrast], vocab: [w.todavia], note: "todavia is formal and written; in speech: mas, só que." }
      - { es: "Vou comprar esse quadro de qualquer jeito, apesar de ser caro.", en: "I'm going to buy that painting anyway, even though it's expensive.", grammar: [g.apesar-de], vocab: [w.de-qualquer-jeito] }
      - { es: "Apesar do trânsito, chegamos a tempo ao mercado.", en: "Despite the traffic, we got to the market in time.", altEs: ["Apesar do trânsito, a gente chegou a tempo ao mercado."], grammar: [g.apesar-de], vocab: [w.apesar-de], error: { wrong: "Apesar o trânsito, chegamos a tempo ao mercado.", explain: "apesar always needs de: apesar do trânsito (de + o).", grammar: g.apesar-de } }
      - { es: "Ela estava cansada, mas foi à feira.", en: "She was tired, but she went to the market.", grammar: [g.connectors-contrast], vocab: [], transform: { instruction: "Rewrite with Apesar de + infinitive", answer: "Apesar de estar cansada, ela foi à feira.", alt: ["Apesar de estar cansada, foi à feira.", "Mesmo cansada, ela foi à feira."], en: "Despite being tired, she went to the market." } }
      - { es: "Eles são jovens, mas são responsáveis.", en: "They're young, but they're responsible.", grammar: [g.connectors-contrast], vocab: [], transform: { instruction: "Rewrite with Apesar de + personal infinitive", answer: "Apesar de eles serem jovens, são responsáveis.", alt: ["Apesar de serem jovens, eles são responsáveis.", "Apesar deles serem jovens, são responsáveis."], en: "Despite being young, they're responsible." } }
    exchanges:
      - q: { es: "Como está o sertão este ano?", en: "How's the sertão this year?" }
        a: { es: "Seco; apesar disso, o mandacaru floresceu.", en: "Dry; even so, the mandacaru has flowered." }
        alt: ["Muito seco.", "Choveu um pouco, graças a Deus."]
        grammar: [g.apesar-de]
        vocab: [w.apesar-disso, w.mandacaru]
      - q: { es: "Por que o vaqueiro usa gibão?", en: "Why does the cowboy wear a leather jacket?" }
        a: { es: "Para se proteger da caatinga, apesar do calor.", en: "To protect himself from the caatinga, despite the heat." }
        alt: ["Por causa dos espinhos.", "É a tradição do sertão."]
        grammar: [g.apesar-de]
        vocab: [w.vaqueiro, w.gibão]
      - q: { es: "Você conhece a história do cangaço?", en: "Do you know the history of the cangaço?" }
        a: { es: "Conheço; apesar de ser uma história dura, é fascinante.", en: "I do; even though it's a harsh story, it's fascinating." }
        alt: ["Só a história de Lampião.", "Não muito."]
        grammar: [g.apesar-de]
        vocab: [w.cangaço]
      - q: { es: "A família ainda tem água?", en: "Does the family still have water?" }
        a: { es: "Tem, graças à cisterna; de qualquer forma, está economizando.", en: "They do, thanks to the water tank; still, they're saving it." }
        alt: ["Tem, mas pouca.", "Por enquanto tem."]
        grammar: [g.apesar-de]
        vocab: [w.cisterna, w.de-qualquer-forma]
      - q: { es: "Vai chover amanhã?", en: "Is it going to rain tomorrow?" }
        a: { es: "Ninguém sabe; em todo caso, leve guarda-chuva.", en: "Nobody knows; in any case, take an umbrella." }
        alt: ["Acho que não.", "Tomara! A estiagem já dura meses."]
        grammar: [g.imperative-formal]
        vocab: [w.em-todo-caso]
    texts:
      - title: "Legenda de um quadro numa galeria de Olinda"
        es: ["Retirantes, 1950.", "Apesar da fome e da seca, a família segue unida pela estrada.", "Ao fundo, um mandacaru e um açude vazio."]
        en: ["Migrants, 1950.", "Despite hunger and drought, the family carries on together along the road.", "In the background, a mandacaru cactus and an empty reservoir."]
        grammar: [g.apesar-de]
        vocab: [w.retirante, w.mandacaru, w.açude]
      - title: "Notícia"
        es: ["A estiagem no sertão de Pernambuco já dura oito meses.", "Apesar disso, as cisternas garantem água para milhares de famílias.", "O governo promete ampliar a irrigação ainda este ano."]
        en: ["The dry spell in the Pernambuco sertão has already lasted eight months.", "Even so, the water tanks guarantee water for thousands of families.", "The government promises to expand irrigation this year."]
        grammar: [g.apesar-de, g.reporting-verbs]
        vocab: [w.estiagem, w.cisterna, w.irrigação]
    spicy:
      - { es: "Apesar de ser vaqueiro, ele dança forró como se tivesse nascido num salão.", en: "Despite being a cowboy, he dances forró as if he'd been born on a dance floor.", grammar: [g.apesar-de, g.como-se], vocab: [w.vaqueiro] }
      - { es: "Apesar do calor do sertão, quem me deixa sem ar é você.", en: "Despite the heat of the sertão, the one who leaves me breathless is you.", grammar: [g.apesar-de], vocab: [w.sertão] }
      - { es: "Apesar de a gente ter se conhecido ontem, parece que te conheço há anos.", en: "Even though we only met yesterday, it feels like I've known you for years.", altEs: ["Apesar da gente ter se conhecido ontem, parece que te conheço há anos.", "Apesar de nós termos nos conhecido ontem, parece que conheço você há anos."], grammar: [g.apesar-de, g.personal-infinitive-uses], vocab: [w.apesar-de] }
      - { es: "Comprei o quadro de qualquer jeito: o artista era bonito demais para eu dizer não.", en: "I bought the painting anyway: the artist was far too good-looking for me to say no.", altEs: ["Comprei o quadro de qualquer jeito: a artista era bonita demais para eu dizer não."], grammar: [g.personal-infinitive-uses], vocab: [w.de-qualquer-jeito] }
      - { es: "Apesar do gibão de couro, o vaqueiro não resistiu ao meu sorriso.", en: "Despite his leather jacket, the cowboy couldn't resist my smile.", grammar: [g.apesar-de], vocab: [w.gibão, w.vaqueiro] }
  - id: b2.u04.l4
    title: Mesmo com chuva
    teach: [g.embora-concession, g.apesar-de]
    vocab: [w.colchão, w.travesseiro, w.lençol, w.cobertor, w.trovoada, w.relâmpago, w.raio, w.granizo, w.furacão, w.vendaval, w.garoar, w.gerador]
    tip: "Choose your concession by what follows: a clause → embora / ainda que + subjunctive; a noun or infinitive → apesar de; a single word → mesmo (mesmo cansado, mesmo assim, mesmo com chuva)."
    sentences:
      - { es: "Embora haja trovoada esta noite, a pousada é segura.", en: "Although there's a thunderstorm tonight, the guesthouse is safe.", altEs: ["Embora tenha trovoada esta noite, a pousada é segura."], grammar: [g.embora-concession], vocab: [w.trovoada] }
      - { es: "Apesar dos relâmpagos, as crianças dormiram a noite toda.", en: "Despite the lightning, the children slept all night.", grammar: [g.apesar-de], vocab: [w.relâmpago] }
      - { es: "Mesmo que caia um raio perto, não saia de casa.", en: "Even if lightning strikes nearby, don't leave the house.", altEs: ["Mesmo que caia um raio perto, não sai de casa."], grammar: [g.embora-concession, g.imperative-negative], vocab: [w.raio] }
      - { es: "Apesar de ser verão, caiu granizo na serra.", en: "Even though it was summer, hail fell in the hills.", grammar: [g.apesar-de], vocab: [w.granizo] }
      - { es: "Embora o Brasil quase não tenha furacões, um vendaval pode ser muito forte.", en: "Although Brazil hardly ever has hurricanes, a gale can be very strong.", grammar: [g.embora-concession], vocab: [w.furacão, w.vendaval] }
      - { es: "Garoou a tarde toda; mesmo assim, fomos ao Alto da Sé.", en: "It drizzled all afternoon; even so, we went to the Alto da Sé.", grammar: [g.connectors-contrast], vocab: [w.garoar] }
      - { es: "Embora o colchão seja duro, dormi como uma pedra.", en: "Although the mattress is hard, I slept like a log.", altEs: ["Embora o colchão seja duro, dormi feito pedra."], grammar: [g.embora-concession], vocab: [w.colchão], note: "dormir como uma pedra = to sleep like a log." }
      - { es: "Pedi outro travesseiro, apesar de a cama já ter três.", en: "I asked for another pillow, even though the bed already has three.", altEs: ["Pedi outro travesseiro, apesar da cama já ter três."], grammar: [g.apesar-de, g.personal-infinitive-uses], vocab: [w.travesseiro], variant: "Portugal: almofada for a pillow." }
      - { es: "Mesmo com o calor, ela dorme com lençol.", en: "Even with the heat, she sleeps with a sheet.", grammar: [g.apesar-de], vocab: [w.lençol] }
      - { es: "Por mais quente que esteja, a minha mãe sempre leva um cobertor.", en: "However hot it is, my mother always takes a blanket.", altEs: ["Por mais quente que esteja, minha mãe sempre leva um cobertor."], grammar: [g.por-mais-que], vocab: [w.cobertor] }
      - { es: "Ainda que tivesse medo de raio, ela foi até a janela ver a tempestade.", en: "Even though she was scared of lightning, she went to the window to watch the storm.", grammar: [g.embora-concession, g.subjunctive-imperfect], vocab: [w.raio] }
      - { es: "Choveu tanto que, apesar da capa de chuva, cheguei molhado.", en: "It rained so much that, despite my raincoat, I arrived soaked.", altEs: ["Choveu tanto que, apesar da capa de chuva, cheguei molhada."], grammar: [g.apesar-de, g.consequence-clauses], vocab: [w.capa-de-chuva] }
      - { es: "Embora o furacão tenha passado longe, o vento derrubou árvores na cidade.", en: "Although the hurricane passed far away, the wind brought down trees in the city.", grammar: [g.embora-concession, g.subjunctive-perfect], vocab: [w.furacão, w.derrubar] }
      - { es: "Apesar de estarmos cansados, vamos ver os bonecos amanhã cedo.", en: "Although we're tired, we're going to see the giant puppets early tomorrow.", altEs: ["Apesar de a gente estar cansado, vamos ver os bonecos amanhã cedo."], grammar: [g.apesar-de, g.personal-infinitive-uses], vocab: [w.boneco], error: { wrong: "Apesar de nós estar cansados, vamos ver os bonecos amanhã cedo.", explain: "With nós, apesar de takes the personal infinitive: estarmos.", grammar: g.apesar-de } }
      - { es: "Estava ventando muito, mas o barco saiu.", en: "It was very windy, but the boat set off.", grammar: [g.estar-gerund-past], vocab: [], transform: { instruction: "Join with embora (past: imperfect subjunctive)", answer: "Embora estivesse ventando muito, o barco saiu.", alt: ["Embora ventasse muito, o barco saiu.", "Mesmo ventando muito, o barco saiu."], en: "Although it was very windy, the boat set off." } }
      - { es: "Choveu, mas o show aconteceu.", en: "It rained, but the show went ahead.", grammar: [g.connectors-contrast], vocab: [], transform: { instruction: "Rewrite with Apesar de + noun", answer: "Apesar da chuva, o show aconteceu.", alt: ["Mesmo com a chuva, o show aconteceu.", "Mesmo com chuva, o show aconteceu."], en: "Despite the rain, the show went ahead." } }
    exchanges:
      - q: { es: "Você conseguiu dormir com a trovoada?", en: "Did you manage to sleep with the thunderstorm?" }
        a: { es: "Consegui, apesar dos relâmpagos.", en: "I did, despite the lightning." }
        alt: ["Mais ou menos.", "Não preguei o olho."]
        grammar: [g.apesar-de]
        vocab: [w.trovoada, w.relâmpago]
      - q: { es: "Precisa de mais alguma coisa no quarto?", en: "Do you need anything else in the room?" }
        a: { es: "Só mais um travesseiro, por favor; o cobertor não precisa, apesar do ar-condicionado.", en: "Just one more pillow, please; I don't need the blanket, despite the air conditioning." }
        alt: ["Um cobertor, por favor.", "Não, obrigado, está tudo ótimo."]
        grammar: [g.apesar-de]
        vocab: [w.travesseiro, w.cobertor]
      - q: { es: "Que barulho é esse?", en: "What's that noise?" }
        a: { es: "É granizo! Embora pareça grave, não vai durar muito.", en: "It's hail! Although it seems serious, it won't last long." }
        alt: ["É só granizo.", "Acho que é trovoada."]
        grammar: [g.embora-concession]
        vocab: [w.granizo]
      - q: { es: "Aqui tem furacão?", en: "Do you get hurricanes here?" }
        a: { es: "Não; embora venha vendaval de vez em quando, furacão quase nunca tem.", en: "No; although we get a gale now and then, there are almost never hurricanes." }
        alt: ["Quase nunca.", "Não, só vendaval."]
        grammar: [g.embora-concession]
        vocab: [w.furacão, w.vendaval]
      - q: { es: "Está chovendo forte?", en: "Is it raining hard?" }
        a: { es: "Não, só garoando; dá para sair, mesmo sem guarda-chuva.", en: "No, just drizzling; we can go out, even without an umbrella." }
        alt: ["Está, melhor esperar.", "Só uma garoa."]
        grammar: [g.estar-gerund]
        vocab: [w.garoar]
    texts:
      - title: "Aviso da pousada"
        es: ["Embora a previsão indique trovoadas esta noite, a pousada tem gerador.", "Há cobertores e travesseiros extras no armário.", "Em caso de raios, evitem a piscina."]
        en: ["Although the forecast says there'll be thunderstorms tonight, the guesthouse has a generator.", "There are extra blankets and pillows in the wardrobe.", "If there's lightning, please stay away from the pool."]
        grammar: [g.embora-concession, g.imperative-formal]
        vocab: [w.trovoada, w.cobertor, w.travesseiro, w.raio]
      - title: "Mensagem de um hóspede"
        es: ["Que noite! Caiu granizo, apesar de ser verão.", "Mesmo assim, dormi bem: o colchão é ótimo.", "Hoje o céu clareou e vamos ver os bonecos."]
        en: ["What a night! Hail fell, even though it's summer.", "Even so, I slept well: the mattress is great.", "Today the sky has cleared and we're going to see the giant puppets."]
        grammar: [g.apesar-de]
        vocab: [w.granizo, w.colchão, w.clarear]
    spicy:
      - { es: "Embora só tenha um cobertor, acho que a gente se vira.", en: "Although there's only one blanket, I think we'll manage.", grammar: [g.embora-concession], vocab: [w.cobertor] }
      - { es: "Apesar da trovoada, o único raio que me assustou foi o seu olhar.", en: "Despite the thunderstorm, the only bolt of lightning that scared me was your gaze.", grammar: [g.apesar-de], vocab: [w.trovoada, w.raio] }
      - { es: "Você rouba o lençol a noite toda, mesmo que diga que não.", en: "You steal the sheet all night, even if you say you don't.", grammar: [g.embora-concession], vocab: [w.lençol] }
      - { es: "Mesmo que caia granizo, eu levo você para jantar.", en: "Even if it hails, I'm taking you to dinner.", altEs: ["Mesmo que caia granizo, eu te levo para jantar."], grammar: [g.embora-concession], vocab: [w.granizo] }
      - { es: "Por mais forte que seja o vendaval, eu não solto a sua mão.", en: "However strong the gale, I won't let go of your hand.", altEs: ["Por mais forte que seja o vendaval, não solto a sua mão."], grammar: [g.por-mais-que], vocab: [w.vendaval] }
dialogues:
  - id: b2.u04.d1
    title: O boneco da Dona Socorro
    context: The day before Carnival in Olinda, Lucas visits Dona Socorro, who makes giant puppets in her studio, and asks to carry one in the parade.
    lines:
      - { speaker: Lucas, es: "Dona Socorro, embora esteja um calor terrível, eu quero carregar o boneco amanhã.", en: "Dona Socorro, even though it's terribly hot, I want to carry the puppet tomorrow." }
      - { speaker: Socorro, es: "Meu filho, o boneco pesa quinze quilos. Por mais forte que você seja, as ladeiras não perdoam.", en: "My dear, the puppet weighs fifteen kilos. However strong you are, the hills show no mercy." }
      - { speaker: Lucas, es: "Eu sei, mas treinei o mês todo. Nem que seja só uma hora, eu quero carregar.", en: "I know, but I trained all month. Even if it's only for an hour, I want to carry it." }
      - { speaker: Socorro, es: "Apesar de você ser jovem, precisa se hidratar. No ano passado, um rapaz teve insolação.", en: "Even though you're young, you need to drink plenty. Last year a young man got sunstroke." }
      - { speaker: Lucas, es: "Vou levar água e ficar na sombra sempre que der.", en: "I'll take water and stay in the shade whenever I can." }
      - { speaker: Socorro, es: "E se chover? A previsão diz que pode ter trovoada.", en: "And what if it rains? The forecast says there might be a thunderstorm." }
      - { speaker: Lucas, es: "Mesmo que chova, o bloco sai. É Carnaval em Olinda!", en: "Even if it rains, the group goes out. It's Carnival in Olinda!" }
      - { speaker: Socorro, es: "Isso é verdade. Apesar disso, leve uma capa de chuva.", en: "That's true. Even so, take a raincoat." }
      - { speaker: Lucas, es: "Combinado. E a senhora? Vai desfilar também?", en: "Deal. And you? Are you going to parade too?" }
      - { speaker: Socorro, es: "Eu? Eu fico na janela, aplaudindo os meus bonecos.", en: "Me? I stay at the window, applauding my puppets." }
    questions:
      - { q: "Quanto pesa o boneco?", options: ["Cinco quilos", "Quinze quilos", "Cinquenta quilos"], answer: 1, explain: "o boneco pesa quinze quilos." }
      - { q: "O que aconteceu com um rapaz no ano passado?", options: ["Teve insolação", "Caiu na ladeira", "Perdeu o boneco"], answer: 0, explain: "No ano passado, um rapaz teve insolação." }
      - { q: "O que o Lucas diz sobre a chuva?", options: ["Que o bloco não sai", "Que o bloco sai mesmo que chova", "Que ele vai ficar em casa"], answer: 1, explain: "Mesmo que chova, o bloco sai." }
      - { q: "O que a Dona Socorro vai fazer no Carnaval?", options: ["Carregar um boneco", "Vender água na ladeira", "Ficar na janela aplaudindo"], answer: 2, explain: "Eu fico na janela, aplaudindo os meus bonecos." }
