id: r.b2.se-vivessi-a-napoli
level: b2
title: Se vivessi a Napoli
kind: text
intro: A columnist from Milan imagines what her life would be like if she moved to Naples – and has to admit that the city has already won her over. Hypotheses with the congiuntivo imperfetto and the condizionale, plus come se.
allow: [napoli, napoletani, napoletano, milano, milanese, spaccanapoli, vomero, posillipo, chiaia, maradona, toledo, sanità, gaiola]
paragraphs:
  - { es: "Ogni volta che torno da Napoli, i miei amici milanesi mi fanno la stessa domanda, a metà tra la curiosità e la preoccupazione: «Ma ci vivresti davvero?» E ogni volta rispondo di sì, troppo in fretta, come se avessi paura di cambiare idea. Allora, per onestà, ho provato a immaginarlo seriamente. Se vivessi a Napoli, come sarebbe la mia giornata?", en: "Every time I come back from Naples, my Milanese friends ask me the same question, somewhere between curiosity and concern: 'But would you really live there?' And every time I say yes, too quickly, as if I were afraid of changing my mind. So, in all honesty, I've tried to imagine it seriously. If I lived in Naples, what would my day be like?" }
  - { es: "Prima di tutto, se vivessi a Napoli, non prenderei mai più il caffè in piedi in trenta secondi, come faccio a Milano tra una riunione e l'altra. Il barista mi chiederebbe come sto, e non per gentilezza: vorrebbe davvero saperlo. Probabilmente arriverei in ritardo al lavoro, ma nessuno se ne stupirebbe, perché anche il mio capo sarebbe ancora al bar.", en: "First of all, if I lived in Naples, I would never again drink my coffee standing up in thirty seconds, as I do in Milan between one meeting and the next. The barman would ask me how I am, and not out of politeness: he'd really want to know. I'd probably get to work late, but nobody would be surprised, because my boss would still be at the bar too." }
  - { es: "Se abitassi nei Quartieri Spagnoli, i panni stesi tra un balcone e l'altro sarebbero il mio panorama, e la vicina del piano di sopra saprebbe tutto di me entro una settimana. A Milano non conosco nemmeno il nome di chi abita sul mio pianerottolo. Qui, invece, mi tratterebbero come se fossi una di famiglia, nel bene e nel male: con le porzioni di parmigiana di melanzane lasciate davanti alla porta, ma anche con i consigli non richiesti sul mio fidanzato.", en: "If I lived in the Quartieri Spagnoli, the washing hung out between one balcony and the next would be my view, and the neighbour upstairs would know everything about me within a week. In Milan I don't even know the name of the person who lives on my landing. Here, on the other hand, they'd treat me as if I were one of the family, for better and for worse: with portions of aubergine parmigiana left outside my door, but also with unrequested advice about my boyfriend." }
  - { es: "Non sarebbe tutto facile, naturalmente. Se dovessi spostarmi in macchina, impazzirei nel traffico, dove le regole del codice stradale sembrano piuttosto dei suggerimenti. Se avessi bisogno di un documento in un ufficio pubblico, forse dovrei tornarci tre volte. E se mi lamentassi, qualcuno mi risponderebbe con un sorriso: «Signo', e che fretta tenete?»", en: "It wouldn't all be easy, of course. If I had to get around by car, I'd go mad in the traffic, where the rules of the highway code seem more like suggestions. If I needed a document from a public office, I might have to go back three times. And if I complained, someone would answer me with a smile: 'Signora, what's the hurry?'" }
  - { es: "Ma la sera, se vivessi a Napoli, potrei camminare fino al lungomare e guardare il Vesuvio diventare viola mentre il sole tramonta dietro Posillipo. La domenica andrei a fare il bagno alla Gaiola, o passerei il pomeriggio a mangiare babà in qualche pasticceria del Vomero. Il sabato mi perderei nei vicoli di Spaccanapoli, tra le botteghe dei presepi di San Gregorio Armeno, che espongono le statuine di Natale anche ad agosto. E a qualunque ora del giorno ci sarebbe qualcuno che canta, qualcuno che litiga e qualcuno che ride, spesso la stessa persona.", en: "But in the evening, if I lived in Naples, I could walk down to the seafront and watch Vesuvius turn violet as the sun sets behind Posillipo. On Sundays I'd go swimming at the Gaiola, or spend the afternoon eating babà in some pastry shop in the Vomero. On Saturdays I'd get lost in the alleys of Spaccanapoli, among the nativity-scene workshops of San Gregorio Armeno, which display their Christmas figurines even in August. And at any hour of the day there would be someone singing, someone arguing and someone laughing, often the same person." }
  - { es: "Forse è proprio questo che mi attira. A Milano tutto funziona, e io ne sono grata, ma a volte ho l'impressione di vivere come se qualcuno mi stesse cronometrando. A Napoli il tempo ha un'altra forma, più larga, più rumorosa, più umana.", en: "Maybe that's exactly what attracts me. In Milan everything works, and I'm grateful for it, but sometimes I feel as if I were living with someone timing me. In Naples time has a different shape, wider, noisier, more human." }
  - { es: "Allora, amici milanesi, ecco la mia risposta definitiva: sì, ci vivrei. Se trovassi un lavoro, ci andrei domani. E se non lo trovassi, beh, a Napoli si trova sempre il modo di arrangiarsi.", en: "So, my Milanese friends, here's my final answer: yes, I'd live there. If I found a job, I'd go tomorrow. And if I didn't, well, in Naples there's always a way to get by." }
questions:
  - { q: "Come risponde di solito l'autrice alla domanda degli amici?", options: ["Dice di no", "Dice di sì, troppo in fretta", "Non risponde"], answer: 1, explain: "«Rispondo di sì, troppo in fretta, come se avessi paura di cambiare idea.»" }
  - { q: "Perché, secondo l'autrice, nessuno si stupirebbe del suo ritardo?", options: ["Perché a Napoli non si lavora", "Perché anche il capo sarebbe ancora al bar", "Perché lavorerebbe da casa"], answer: 1, explain: "A humorous hypothesis: even her boss would still be having his coffee." }
  - { q: "Che cosa dice dei vicini di casa?", options: ["Che la ignorerebbero, come a Milano", "Che la tratterebbero come una di famiglia, nel bene e nel male", "Che sarebbero troppo rumorosi"], answer: 1, explain: "Food left at the door, but also unwanted advice about her boyfriend." }
  - { q: "Quale aspetto negativo NON menziona l'autrice?", options: ["Il traffico", "La burocrazia", "Il clima"], answer: 2, explain: "She mentions traffic and public offices, but not the weather." }
  - { q: "Che cosa la attira di più di Napoli?", options: ["Il fatto che tutto funzioni", "Un modo diverso, più umano, di vivere il tempo", "I prezzi bassi"], answer: 1, explain: "«A Napoli il tempo ha un'altra forma, più larga, più rumorosa, più umana.»" }
