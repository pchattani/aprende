id: a1.u05
title: Comida y bebida
lessons:
  - id: a1.u05.l1
    title: En el bar
    teach: [g.querer-present]
    tip: "Quiero un café, por favor is perfectly polite in a Spanish bar."
    vocab: [w.comida, w.desayuno, w.cena, w.pan, w.agua, w.leche, w.cafe, w.te.noun, w.zumo, w.cerveza, w.vino, w.querer, w.tomar, w.beber, w.vaso, w.taza, w.botella, w.cuenta]
    sentences:
      - { es: "Quiero un café con leche, por favor.", en: "I want a coffee with milk, please.", altEs: ["Yo quiero un café con leche, por favor."], altEn: ["I'd like a coffee with milk, please."], grammar: [g.querer-present], vocab: [w.querer, w.cafe, w.leche] }
      - { es: "¿Qué quieres tomar?", en: "What do you want to have?", altEn: ["What do you want to drink?"], grammar: [g.querer-present], vocab: [w.querer, w.tomar] }
      - { es: "Un vaso de agua y un zumo de naranja.", en: "A glass of water and an orange juice.", grammar: [g.articles-indefinite], vocab: [w.vaso, w.agua, w.zumo, w.naranja] }
      - { es: "Queremos dos cervezas y una botella de vino.", en: "We want two beers and a bottle of wine.", altEs: ["Nosotros queremos dos cervezas y una botella de vino."], grammar: [g.querer-present, g.plural-nouns], vocab: [w.cerveza, w.botella, w.vino] }
      - { es: "Una taza de té, por favor.", en: "A cup of tea, please.", grammar: [g.articles-indefinite], vocab: [w.taza, w.te.noun] }
      - { es: "¿Bebes café por la mañana?", en: "Do you drink coffee in the morning?", grammar: [g.regular-er-ir-present], vocab: [w.beber, w.cafe, w.manana.noun] }
      - { es: "No bebo vino, bebo agua.", en: "I don't drink wine, I drink water.", grammar: [g.negation, g.regular-er-ir-present], vocab: [w.beber, w.vino, w.agua] }
      - { es: "El desayuno es a las ocho.", en: "Breakfast is at eight.", grammar: [g.time-telling], vocab: [w.desayuno] }
      - { es: "La comida y la cena son en casa.", en: "Lunch and dinner are at home.", grammar: [g.ser-present], vocab: [w.comida, w.cena] }
      - { es: "La cuenta, por favor.", en: "The bill, please.", grammar: [g.articles-definite], vocab: [w.cuenta] }
      - { es: "¿Quieres pan con la comida?", en: "Do you want bread with the meal?", grammar: [g.querer-present], vocab: [w.pan, w.comida] }
      - { es: "Mis padres toman un café después de comer.", en: "My parents have a coffee after lunch.", grammar: [g.regular-ar-present], vocab: [w.tomar, w.despues] }
      - { es: "Ella quiere una botella de agua fría.", en: "She wants a bottle of cold water.", grammar: [g.querer-present, g.adjective-agreement], vocab: [w.querer, w.botella, w.frio], transform: { instruction: "Change to 'we'", answer: "Queremos una botella de agua fría.", alt: ["Nosotros queremos una botella de agua fría."] } }
  - id: a1.u05.l2
    title: Comer bien
    teach: [g.regular-ar-present]
    vocab: [w.azucar, w.sal, w.aceite, w.huevo, w.queso, w.jamon, w.pollo, w.carne, w.pescado, w.arroz, w.sopa, w.ensalada, w.verdura, w.fruta, w.comer, w.desayunar, w.cenar, w.cocinar, w.comprar, w.necesitar]
    sentences:
      - { es: "Desayuno pan con aceite y un café.", en: "I have bread with oil and a coffee for breakfast.", altEs: ["Yo desayuno pan con aceite y un café."], grammar: [g.regular-ar-present], vocab: [w.desayunar, w.pan, w.aceite] }
      - { es: "¿Qué comes normalmente?", en: "What do you normally eat?", grammar: [g.regular-er-ir-present], vocab: [w.comer, w.normalmente] }
      - { es: "Como pollo con arroz y ensalada.", en: "I eat chicken with rice and salad.", grammar: [g.regular-er-ir-present], vocab: [w.pollo, w.arroz, w.ensalada] }
      - { es: "No comemos carne, comemos pescado.", en: "We don't eat meat, we eat fish.", grammar: [g.negation], vocab: [w.carne, w.pescado, w.comer] }
      - { es: "Mi madre cocina una sopa de verduras.", en: "My mother cooks a vegetable soup.", grammar: [g.regular-ar-present], vocab: [w.cocinar, w.sopa, w.verdura] }
      - { es: "Compro huevos, queso y jamón en el mercado.", en: "I buy eggs, cheese and ham at the market.", grammar: [g.regular-ar-present, g.plural-nouns], vocab: [w.comprar, w.huevo, w.queso, w.jamon] }
      - { es: "Necesitamos sal y azúcar.", en: "We need salt and sugar.", grammar: [g.regular-ar-present], vocab: [w.necesitar, w.sal, w.azucar] }
      - { es: "Cenamos a las nueve de la noche.", en: "We have dinner at nine in the evening.", grammar: [g.regular-ar-present, g.time-telling], vocab: [w.cenar, w.noche] }
      - { es: "¿Cocinas tú o cocina tu pareja?", en: "Do you cook or does your partner cook?", grammar: [g.regular-ar-present], vocab: [w.cocinar, w.pareja] }
      - { es: "La fruta es buena para la salud.", en: "Fruit is good for your health.", grammar: [g.articles-definite], vocab: [w.fruta, w.bueno, w.para] }
      - { es: "Los españoles comen a las dos.", en: "Spaniards have lunch at two.", grammar: [g.articles-definite], vocab: [w.comer, w.espanol] }
      - { es: "Ella desayuna fruta y yogur.", en: "She has fruit and yoghurt for breakfast.", grammar: [g.regular-ar-present], vocab: [w.desayunar, w.fruta], transform: { instruction: "Change to 'they'", answer: "Ellos desayunan fruta y yogur.", alt: ["Desayunan fruta y yogur.", "Ellas desayunan fruta y yogur."] } }
  - id: a1.u05.l3
    title: Me gusta
    teach: [g.gustar]
    tip: "With gustar, the thing you like is the subject: me gusta el café, me gustan las tapas."
    vocab: [w.gustar, w.encantar, w.me, w.te, w.le, w.nos, w.os, w.manzana, w.naranja, w.platano, w.tomate, w.patata, w.cebolla, w.tortilla, w.bocadillo, w.tapa, w.postre, w.helado, w.chocolate, w.tarta]
    sentences:
      - { es: "Me gusta el café.", en: "I like coffee.", grammar: [g.gustar], vocab: [w.gustar, w.cafe], error: { wrong: "Yo gusto el café.", explain: "The thing liked is the subject: me gusta el café.", grammar: g.gustar } }
      - { es: "Me gustan las manzanas y los plátanos.", en: "I like apples and bananas.", grammar: [g.gustar, g.gustar-plural], vocab: [w.manzana, w.platano] }
      - { es: "¿Te gusta la tortilla de patatas?", en: "Do you like Spanish omelette?", grammar: [g.gustar], vocab: [w.tortilla, w.patata] }
      - { es: "No me gusta la cebolla.", en: "I don't like onion.", grammar: [g.gustar, g.negation], vocab: [w.cebolla] }
      - { es: "A mi hermano le encanta el chocolate.", en: "My brother loves chocolate.", grammar: [g.gustar-plural], vocab: [w.encantar, w.chocolate, w.le] }
      - { es: "Nos gustan mucho las tapas.", en: "We like tapas a lot.", grammar: [g.gustar-plural], vocab: [w.tapa, w.nos] }
      - { es: "¿Os gusta el helado de fresa?", en: "Do you (all) like strawberry ice cream?", grammar: [g.gustar], vocab: [w.helado, w.os] }
      - { es: "Me encanta la tarta de mi abuela.", en: "I love my grandmother's cake.", grammar: [g.gustar-plural], vocab: [w.encantar, w.tarta] }
      - { es: "De postre quiero un helado.", en: "For dessert I want an ice cream.", grammar: [g.querer-present], vocab: [w.postre, w.helado] }
      - { es: "Un bocadillo de jamón y queso, por favor.", en: "A ham and cheese sandwich, please.", grammar: [g.articles-indefinite], vocab: [w.bocadillo, w.jamon, w.queso] }
      - { es: "Les gustan los tomates y las naranjas.", en: "They like tomatoes and oranges.", grammar: [g.gustar-plural], vocab: [w.tomate, w.naranja, w.le] }
      - { es: "¿Te gusta cocinar? Sí, me encanta.", en: "Do you like cooking? Yes, I love it.", grammar: [g.gustar-plural], vocab: [w.cocinar, w.encantar], transform: { instruction: "Say you (singular) love cooking as a statement", answer: "Te encanta cocinar." } }
      - { es: "A Marta le gusta el pescado pero no le gusta la carne.", en: "Marta likes fish but she doesn't like meat.", grammar: [g.gustar-plural, g.connectors-basic], vocab: [w.pescado, w.carne] }
  - id: a1.u05.l4
    title: Mucho, poco, algo
    teach: [g.quantity-words]
    vocab: [w.poco, w.un-poco, w.bastante, w.demasiado, w.algo, w.nada, w.otro, w.rico, w.caliente, w.frio, w.dulce, w.plato, w.menu, w.pagar, w.para, w.sin]
    sentences:
      - { es: "Como mucha fruta y pocas verduras.", en: "I eat a lot of fruit and few vegetables.", grammar: [g.quantity-words], vocab: [w.mucho, w.poco, w.fruta, w.verdura] }
      - { es: "Quiero un poco de pan, por favor.", en: "I want a little bread, please.", grammar: [g.quantity-words], vocab: [w.un-poco, w.pan] }
      - { es: "Hay bastante comida para todos.", en: "There is enough food for everyone.", grammar: [g.quantity-words], vocab: [w.bastante, w.comida, w.todo] }
      - { es: "Bebes demasiado café.", en: "You drink too much coffee.", grammar: [g.quantity-words], vocab: [w.demasiado, w.beber] }
      - { es: "¿Quieres algo más? No, nada más, gracias.", en: "Do you want anything else? No, nothing else, thanks.", grammar: [g.quantity-words], vocab: [w.algo, w.nada] }
      - { es: "Otro café, por favor.", en: "Another coffee, please.", grammar: [g.articles-indefinite], vocab: [w.otro, w.cafe], error: { wrong: "Un otro café, por favor.", explain: "otro never takes un/una.", grammar: g.articles-indefinite } }
      - { es: "La sopa está muy rica y caliente.", en: "The soup is very tasty and hot.", grammar: [g.ser-vs-estar-basics], vocab: [w.rico, w.caliente, w.sopa] }
      - { es: "El helado está frío y dulce.", en: "The ice cream is cold and sweet.", grammar: [g.ser-vs-estar-basics], vocab: [w.frio, w.dulce, w.helado] }
      - { es: "El menú del día cuesta doce euros.", en: "The set menu costs twelve euros.", grammar: [g.al-del-contractions], vocab: [w.menu, w.doce] }
      - { es: "¿Pagamos la cuenta?", en: "Shall we pay the bill?", altEn: ["Do we pay the bill?"], grammar: [g.regular-ar-present], vocab: [w.pagar, w.cuenta] }
      - { es: "Un plato de arroz con pollo para mí.", en: "A plate of rice with chicken for me.", grammar: [g.prepositions-movement], vocab: [w.plato, w.arroz, w.para] }
      - { es: "Quiero un café sin azúcar.", en: "I want a coffee without sugar.", grammar: [g.querer-present], vocab: [w.sin, w.azucar] }
      - { es: "No hay nada en la nevera.", en: "There is nothing in the fridge.", grammar: [g.hay, g.negation], vocab: [w.nada, w.haber] }
dialogues:
  - id: a1.u05.d1
    title: En el restaurante
    context: Tom and Marta order lunch in a small restaurant in Madrid.
    lines:
      - { speaker: Camarero, es: "Buenas tardes. ¿Qué quieren tomar?", en: "Good afternoon. What would you like to have?" }
      - { speaker: Marta, es: "Para mí, el menú del día. De primero, una ensalada.", en: "For me, the set menu. For the first course, a salad." }
      - { speaker: Camarero, es: "¿Y de segundo?", en: "And for the main course?" }
      - { speaker: Marta, es: "Pollo con patatas, por favor.", en: "Chicken with potatoes, please." }
      - { speaker: Tom, es: "Yo quiero la sopa y después pescado con arroz.", en: "I want the soup and then fish with rice." }
      - { speaker: Camarero, es: "Muy bien. ¿Para beber?", en: "Very good. To drink?" }
      - { speaker: Tom, es: "Una cerveza y un vaso de agua, por favor.", en: "A beer and a glass of water, please." }
      - { speaker: Marta, es: "Yo, un zumo de naranja. ¿Hay postre?", en: "For me, an orange juice. Is there dessert?" }
      - { speaker: Camarero, es: "Sí, hay helado, tarta de chocolate o fruta.", en: "Yes, there's ice cream, chocolate cake or fruit." }
      - { speaker: Marta, es: "Me encanta el chocolate. Tarta, por favor.", en: "I love chocolate. Cake, please." }
      - { speaker: Tom, es: "Para mí nada, gracias. Y la cuenta, por favor.", en: "Nothing for me, thanks. And the bill, please." }
    questions:
      - { q: "What does Marta order as a main course?", options: ["Fish with rice", "Chicken with potatoes", "Soup"], answer: 1 }
      - { q: "What does Tom drink?", options: ["Orange juice", "Beer and water", "Wine"], answer: 1 }
      - { q: "Which dessert does Marta choose?", options: ["Ice cream", "Fruit", "Chocolate cake"], answer: 2 }
