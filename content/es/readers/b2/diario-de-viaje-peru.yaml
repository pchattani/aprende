id: r.b2.diario-de-viaje-peru
level: b2
title: Diario de viaje por Perú
kind: text
intro: A travel blog in diary form. The writer reacts to what she sees with the perfect and pluperfect subjunctive and imagines how things might have gone differently.
allow: [perú, lima, cusco, machu, picchu, puno, titicaca, arequipa, incas, peruana, peruano, quitado, curvas, variada, capas]
paragraphs:
  - { es: "Día 1, Lima. Por fin en Perú. Hace un año, cuando mi hermana me propuso este viaje, dudé mucho de que pudiéramos pagarlo. Hoy, sentada frente al mar, me alegro de que no hayamos esperado más. Si no hubiéramos comprado los billetes aquel día de oferta, probablemente seguiríamos hablando del viaje en lugar de hacerlo.", en: "Day 1, Lima. In Peru at last. A year ago, when my sister suggested this trip, I really doubted we could afford it. Today, sitting opposite the sea, I'm glad we didn't wait any longer. If we hadn't bought the tickets on that sale day, we'd probably still be talking about the trip instead of doing it." }
  - { es: "Día 4, Cusco. Me sorprende que una ciudad tan alta tenga tanta vida. Nos habían advertido de que la altura podía ser un problema, y lo fue: el primer día no podíamos subir una escalera sin parar. El dueño del hostal nos aconsejó que bebiéramos té de coca y que no comiéramos mucho. Funcionó.", en: "Day 4, Cusco. I'm surprised that such a high city has so much life. We had been warned that the altitude could be a problem, and it was: the first day we couldn't climb a staircase without stopping. The owner of the hostel advised us to drink coca tea and not to eat much. It worked." }
  - { es: "Día 6, Machu Picchu. No tengo palabras. Es increíble que los incas construyeran esto sin ruedas ni hierro, y más increíble todavía que los conquistadores nunca lo encontraran. El guía nos contó que, hasta 1911, casi nadie creía que una ciudad así hubiera existido.", en: "Day 6, Machu Picchu. I have no words. It's incredible that the Incas built this without wheels or iron, and more incredible still that the conquistadors never found it. The guide told us that, until 1911, hardly anyone believed that a city like this had existed." }
  - { es: "Día 9, Puno. Hoy hemos visitado las islas del lago Titicaca. Me molestó un poco que algunos turistas trataran a la gente como si fuera parte de un museo. A la vuelta, una mujer nos explicó que, si no hubiera turismo, muchos jóvenes habrían tenido que marcharse a la ciudad. Todo tiene dos caras.", en: "Day 9, Puno. Today we visited the islands of Lake Titicaca. It bothered me a little that some tourists treated the people as if they were part of a museum. On the way back, a woman explained to us that, if there were no tourism, many young people would have had to leave for the city. Everything has two sides." }
  - { es: "Día 12, Arequipa. ¡Qué pena que solo tengamos dos días aquí! La ciudad es blanca, tranquila y tiene la mejor comida del viaje. Si lo hubiéramos sabido, habríamos quitado días a Lima.", en: "Day 12, Arequipa. What a shame we only have two days here! The city is white, calm and has the best food of the trip. If we had known, we would have taken days away from Lima." }
  - { es: "Día 15, en el autobús. Doce horas de carretera. Es posible que me haya equivocado al escoger el asiento de la ventana: hay un desierto de curvas que no termina nunca. Mi hermana duerme como si estuviera en su cama.", en: "Day 15, on the bus. Twelve hours on the road. It's possible I made a mistake choosing the window seat: there is a desert of bends that never ends. My sister sleeps as if she were in her own bed." }
  - { es: "Día 18, de vuelta en Lima. Ya en el aeropuerto, pienso en todo lo que no sabía hace tres semanas. No sabía que la comida peruana fuera tan variada, ni que la historia de este país tuviera tantas capas: la inca, la colonial, la de la independencia y la de hoy.", en: "Day 18, back in Lima. Already at the airport, I think about everything I didn't know three weeks ago. I didn't know that Peruvian food was so varied, nor that the history of this country had so many layers: the Inca one, the colonial one, the one of independence and today's." }
  - { es: "Si hubiera hecho este viaje a los veinte años, habría visto otras cosas; a los treinta y cinco, veo a las personas. Ojalá hayamos dejado algo bueno aquí, además de dinero. Y ojalá volvamos.", en: "If I had made this trip at twenty, I would have seen other things; at thirty-five, I see the people. I hope we have left something good here, besides money. And I hope we come back." }
questions:
  - { q: "Why does the writer say they are glad they didn't wait?", options: ["The flights got cheaper", "Otherwise they would still be talking about the trip instead of doing it", "Her sister moved abroad"], answer: 1 }
  - { q: "What did the hostel owner advise in Cusco?", options: ["To sleep all day", "To drink coca tea and eat little", "To take a taxi everywhere"], answer: 1 }
  - { q: "What did the woman on Lake Titicaca explain?", options: ["That tourism should be banned", "That without tourism many young people would have had to leave", "That the islands were closing"], answer: 1 }
  - { q: "What does the writer regret about Arequipa?", options: ["Only having two days there", "The food", "The weather"], answer: 0 }
glossary:
  - { es: altura, en: altitude, height }
  - { es: hostal, en: hostel, guesthouse }
  - { es: coca, en: coca (plant) }
  - { es: hierro, en: iron }
  - { es: quitar, en: to take away }
  - { es: curva, en: bend, curve }
  - { es: variado, en: varied }
  - { es: capa, en: layer }
