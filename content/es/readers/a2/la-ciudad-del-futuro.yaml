id: r.a2.la-ciudad-del-futuro
level: a2
title: La ciudad del futuro
kind: text
intro: A school magazine article in which students imagine their city in 2050.
allow: [robots, robot, eléctricos, eléctrico, solar, drones, dron, túneles, bicicleta, autor]
paragraphs:
  - { es: "¿Cómo será nuestra ciudad dentro de veinticinco años? Preguntamos a los alumnos del instituto y estas son algunas de sus respuestas.", en: "What will our city be like in twenty-five years? We asked the students at the secondary school and these are some of their answers." }
  - { es: "Lucía, 15 años: «En 2050 no habrá coches en el centro. Todo el mundo irá en bici, en metro o andando. Las calles tendrán más árboles y menos ruido, y el aire estará mucho más limpio que ahora».", en: "Lucía, 15: 'In 2050 there won't be cars in the centre. Everyone will go by bike, by metro or on foot. The streets will have more trees and less noise, and the air will be much cleaner than now.'" }
  - { es: "Marcos, 16 años: «Yo creo que los robots harán los trabajos aburridos y peligrosos. Las personas trabajarán menos horas y tendrán más tiempo para la familia y los amigos. Pero, en mi opinión, también habrá menos trabajo para algunas personas, y eso será un problema».", en: "Marcos, 16: 'I think robots will do the boring and dangerous jobs. People will work fewer hours and have more time for family and friends. But, in my opinion, there will also be less work for some people, and that will be a problem.'" }
  - { es: "Aisha, 15 años: «Las casas producirán su propia energía con el sol y no gastaremos tanta agua. Reciclaremos todo. Si no cuidamos el planeta ahora, en 2050 será demasiado tarde».", en: "Aisha, 15: 'Houses will produce their own energy from the sun and we won't use so much water. We'll recycle everything. If we don't look after the planet now, by 2050 it will be too late.'" }
  - { es: "Daniel, 17 años: «Probablemente compraremos todo por internet y los drones traerán los paquetes a casa. Las tiendas del barrio desaparecerán. A mí no me gusta esa idea: me parece que las tiendas son importantes para conocer a los vecinos».", en: "Daniel, 17: 'We'll probably buy everything online and drones will bring the parcels home. The neighbourhood shops will disappear. I don't like that idea: I think shops are important for getting to know your neighbours.'" }
  - { es: "Todos están de acuerdo en una cosa: la ciudad del futuro depende de lo que hagamos hoy. Como dijo Lucía: «El futuro no llega solo; lo construimos nosotros».", en: "They all agree on one thing: the city of the future depends on what we do today. As Lucía said: 'The future doesn't arrive by itself; we build it.'" }
questions:
  - { q: "According to Lucía, how will people move around the centre in 2050?", options: ["By car", "By bike, metro or on foot", "By plane"], answer: 1 }
  - { q: "What problem does Marcos see with robots?", options: ["They are dangerous", "Some people will have less work", "They are expensive"], answer: 1 }
  - { q: "Why does Daniel dislike online shopping?", options: ["It is slow", "Neighbourhood shops help people meet neighbours", "Drones are noisy"], answer: 1 }
glossary:
  - { es: todo el mundo, en: everyone }
  - { es: producir, en: to produce }
  - { es: paquete, en: parcel }
  - { es: construir, en: to build }
