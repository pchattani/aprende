id: c2.u04
title: "Far-se-á"
lessons:
  - id: c2.u04.l1
    title: Far-se-á tudo
    teach: [g.mesoclisis]
    vocab: [w.mesóclise, w.deliberar, w.deliberação, w.despacho, w.diário-da-república, w.diário-oficial, w.outrem, w.mui, w.concurso, w.revisão, w.reitor, w.matricular-se, w.júri, w.praxe, w.serenata]
    tip: "A pronoun can't follow a future or conditional: it goes inside, between the infinitive and the ending (dar-te-ei, dir-lhe-ia). With an attractor, put it in front instead (não te darei)."
    sentences:
      - { es: "Realizar-se-á uma reunião do conselho científico na próxima quarta-feira.", en: "A meeting of the scientific council will be held next Wednesday.", altEs: ["Vai realizar-se uma reunião do conselho científico na próxima quarta-feira.", "Na próxima quarta-feira realizar-se-á uma reunião do conselho científico.", "Será realizada uma reunião do conselho científico na próxima quarta-feira."], grammar: [g.mesoclisis, g.se-passive] }
      - { es: "Dir-se-ia que o tempo parou na Biblioteca Joanina.", en: "You'd think time had stood still in the Joanina Library.", altEs: ["Dir-se-ia que o tempo parou na Joanina.", "Dir-se-ia que na Biblioteca Joanina o tempo parou.", "Parece que o tempo parou na Biblioteca Joanina."], altEn: ["One would say time has stopped in the Joanina Library."], grammar: [g.mesoclisis, g.conditional-simple], note: "The Baroque Joanina Library is home to a colony of bats that eat the insects that would otherwise damage the books." }
      - { es: "Dar-te-ei uma resposta quando sair o resultado do concurso.", en: "I'll give you an answer when the results of the competition come out.", altEs: ["Dar-te-ei uma resposta assim que sair o resultado do concurso.", "Dou-te uma resposta quando sair o resultado do concurso.", "Vou te dar uma resposta quando sair o resultado do concurso."], grammar: [g.mesoclisis, g.future-subjunctive-time], vocab: [w.concurso], transform: { instruction: "Say it in everyday European speech, with ir + infinitive", answer: "Vou dar-te uma resposta quando sair o resultado do concurso.", alt: ["Vou-te dar uma resposta quando sair o resultado do concurso."] } }
      - { es: "O júri deliberará amanhã, e a deliberação publicar-se-á no Diário da República.", en: "The panel will deliberate tomorrow, and the decision will be published in the official gazette.", altEs: ["O júri delibera amanhã e a deliberação será publicada no Diário da República.", "O júri deliberará amanhã; a deliberação publicar-se-á no Diário da República.", "O júri vai deliberar amanhã, e a deliberação será publicada no Diário Oficial."], grammar: [g.mesoclisis, g.ep-formal-writing], vocab: [w.júri, w.deliberar, w.deliberação, w.diário-da-república, w.diário-oficial], note: "Portugal's official gazette is the Diário da República; Brazil's is the Diário Oficial da União." }
      - { es: "Se o despacho sair a tempo, matricular-me-ei em outubro.", en: "If the ruling comes out in time, I'll enrol in October.", altEs: ["Se o despacho sair a tempo, vou matricular-me em outubro.", "Se o despacho sair a tempo, matriculo-me em outubro.", "Se o despacho sair a tempo, eu me matricularei em outubro."], grammar: [g.mesoclisis, g.future-subjunctive-se], vocab: [w.despacho, w.matricular-se], error: { wrong: "Se o despacho sair a tempo, matricularei-me em outubro.", explain: "A pronoun never follows a future: it goes inside it (matricular-me-ei).", grammar: g.mesoclisis } }
      - { es: "Ninguém te dirá que a praxe é obrigatória, porque não é.", en: "Nobody will tell you the praxe is compulsory, because it isn't.", altEs: ["Ninguém te vai dizer que a praxe é obrigatória, porque não é.", "Ninguém te dirá que a praxe é obrigatória: não é.", "Ninguém vai te dizer que o trote é obrigatório, porque não é."], grammar: [g.mesoclisis, g.ep-proclisis-attractors], vocab: [w.praxe], note: "With an attractor such as ninguém, the pronoun goes before the future: te dirá, not dir-te-á. The praxe is the set of student initiation rites in Portuguese universities." }
      - { es: "Pedir-se-á a revisão da prova se houver dúvidas na correção.", en: "A review of the exam will be requested if there are doubts about the marking.", altEs: ["Pedir-se-á a revisão da prova caso haja dúvidas na correção.", "Será pedida a revisão da prova se houver dúvidas na correção.", "Vai ser pedida a revisão da prova se houver dúvidas na correção."], grammar: [g.mesoclisis, g.future-subjunctive-se], vocab: [w.revisão] }
      - { es: "«Mui ilustre Senhor Reitor», começava a carta, num tom de outro século.", en: "'Most illustrious Rector,' the letter began, in a tone from another century.", altEs: ["A carta começava assim: «Mui ilustre Senhor Reitor», num tom de outro século.", "«Mui ilustre Senhor Reitor», assim começava a carta, num tom de outro século."], grammar: [g.ep-formal-writing, g.classical-portuguese], vocab: [w.mui, w.reitor] }
      - { es: "Não faças a outrem o que não queres que te façam a ti.", en: "Do not do unto others what you would not have them do unto you.", altEs: ["Não faças aos outros o que não queres que te façam a ti.", "Não faça aos outros o que não quer que façam com você."], altEn: ["Don't do to others what you wouldn't want done to you."], grammar: [g.proverbs, g.ep-imperative-tu], vocab: [w.outrem], note: "Outrem (another person) survives mainly in proverbs and legal language." }
      - { es: "A Universidade de Coimbra tornar-se-ia Património Mundial em 2013.", en: "The University of Coimbra would go on to become a World Heritage Site in 2013.", altEs: ["A Universidade de Coimbra viria a tornar-se Património Mundial em 2013.", "A Universidade de Coimbra tornar-se-ia Património Mundial da UNESCO em 2013.", "A Universidade de Coimbra se tornaria Patrimônio Mundial em 2013."], grammar: [g.mesoclisis, g.narrative-tenses-literary] }
      - { es: "Encontrar-nos-íamos mais vezes se não vivesses tão longe.", en: "We'd see each other more often if you didn't live so far away.", altEs: ["Encontrar-nos-íamos mais vezes se tu não vivesses tão longe.", "A gente se encontraria mais vezes se você não morasse tão longe."], grammar: [g.mesoclisis, g.se-clauses-unreal], transform: { instruction: "Use the everyday European imperfect instead of the conditional", answer: "Encontrávamo-nos mais vezes se não vivesses tão longe.", alt: ["Encontrávamo-nos mais vezes se tu não vivesses tão longe."] } }
      - { es: "Fá-lo-ei com todo o gosto, senhor doutor.", en: "I'll do it with pleasure, doctor.", altEs: ["Fá-lo-ei com muito gosto, senhor doutor.", "Faço-o com todo o gosto, senhor doutor.", "Vou fazê-lo com todo o gosto, senhor doutor.", "Farei isso com todo o prazer, doutor."], grammar: [g.mesoclisis, g.ep-forms-of-address], vocab: [w.senhor-doutor], note: "fazer + o in the future: far- + lo + ei → fá-lo-ei." }
      - { es: "Na mesóclise, o pronome fica no meio do verbo: dir-lhe-ei.", en: "In mesoclisis, the pronoun sits in the middle of the verb: dir-lhe-ei.", altEs: ["Na mesóclise, o pronome vai para o meio do verbo: dir-lhe-ei.", "Na mesóclise o pronome fica no meio do verbo, como em dir-lhe-ei."], grammar: [g.mesoclisis], vocab: [w.mesóclise] }
      - { es: "No Brasil, quase ninguém usa a mesóclise a falar; em Portugal, ouve-se nas notícias.", en: "In Brazil hardly anyone uses mesoclisis in speech; in Portugal you hear it on the news.", altEs: ["No Brasil quase ninguém usa a mesóclise na fala; em Portugal ouve-se nas notícias.", "No Brasil, quase ninguém usa mesóclise falando; em Portugal, ela aparece nos noticiários."], grammar: [g.mesoclisis, g.se-passive], vocab: [w.mesóclise] }
      - { es: "Os candidatos admitidos ao concurso receberão uma mensagem; os restantes informar-se-ão por carta.", en: "Candidates admitted to the competition will receive a message; the rest will be informed by letter.", altEs: ["Os candidatos admitidos receberão uma mensagem; os restantes serão informados por carta.", "Os candidatos admitidos no concurso vão receber uma mensagem; os demais serão informados por carta."], grammar: [g.mesoclisis, g.ep-formal-writing], vocab: [w.concurso] }
    exchanges:
      - q: { es: "Quando é que me dás a resposta?", en: "When will you give me the answer?" }
        a: { es: "Dar-ta-ei amanhã, prometo.", en: "I'll give it to you tomorrow, I promise." }
        alt: ["Dou-ta amanhã.", "Amanhã, sem falta."]
        grammar: [g.mesoclisis, g.clitic-contractions]
      - q: { es: "Já saiu o despacho?", en: "Has the ruling come out yet?" }
        a: { es: "Ainda não; publicar-se-á no Diário da República na segunda.", en: "Not yet; it will be published in the official gazette on Monday." }
        alt: ["Ainda não saiu.", "Já, saiu ontem."]
        grammar: [g.mesoclisis]
        vocab: [w.despacho, w.diário-da-república]
      - q: { es: "Dirias isso ao reitor?", en: "Would you say that to the rector?" }
        a: { es: "Dir-lho-ia, mas só por escrito.", en: "I would say it to him, but only in writing." }
        alt: ["Nunca lho diria!", "Diria, claro."]
        grammar: [g.mesoclisis, g.clitic-contractions]
        vocab: [w.reitor]
      - q: { es: "Achas que te aceitam no doutoramento?", en: "Do you think they'll accept you for the PhD?" }
        a: { es: "Se me aceitarem, mudar-me-ei para Coimbra.", en: "If they accept me, I'll move to Coimbra." }
        alt: ["Espero que sim.", "Saberei em julho."]
        grammar: [g.mesoclisis, g.future-subjunctive-se]
        vocab: [w.doutoramento]
      - q: { es: "Quem vai deliberar sobre o concurso?", en: "Who will decide on the competition?" }
        a: { es: "O júri; reunir-se-á na próxima semana.", en: "The panel; it will meet next week." }
        alt: ["Um júri de três professores.", "Ainda não se sabe."]
        grammar: [g.mesoclisis]
        vocab: [w.júri, w.deliberar, w.concurso]
    texts:
      - title: "Aviso da reitoria"
        es: ["A Universidade de Coimbra informa que o concurso abrirá a 2 de maio.", "As candidaturas far-se-ão exclusivamente pela internet.", "A deliberação do júri publicar-se-á no Diário da República."]
        en: ["The University of Coimbra announces that the competition will open on 2 May.", "Applications will be made exclusively online.", "The panel's decision will be published in the official gazette."]
        grammar: [g.mesoclisis, g.ep-formal-writing]
        vocab: [w.concurso, w.júri, w.deliberação, w.diário-da-república]
      - title: "Mensagem de um estudante"
        es: ["Mãe, a Queima das Fitas é já na próxima semana.", "Dar-te-ia mais notícias, mas tenho exames.", "Ligar-te-ei depois da serenata, prometo!"]
        en: ["Mum, the Queima das Fitas is next week already.", "I'd give you more news, but I have exams.", "I shall call you after the serenade, I promise!"]
        grammar: [g.mesoclisis]
        vocab: [w.serenata]
    spicy:
      - { es: "Dar-te-ei um beijo na Ponte de Santa Clara, se o fado for bom.", en: "I shall give you a kiss on the Santa Clara Bridge, if the fado is good.", altEs: ["Dou-te um beijo na Ponte de Santa Clara, se o fado for bom.", "Vou te dar um beijo na Ponte de Santa Clara, se o fado for bom."], grammar: [g.mesoclisis, g.future-subjunctive-se] }
      - { es: "Dir-se-ia que vieste a Coimbra só para me ouvir cantar.", en: "One would think you came to Coimbra just to hear me sing.", altEs: ["Dir-se-ia que vieste a Coimbra só para me ouvires cantar.", "Parece que você veio a Coimbra só pra me ouvir cantar."], grammar: [g.mesoclisis, g.ep-tu-forms] }
      - { es: "Escrever-te-ei uma serenata, mas cantá-la-á o meu amigo, que tem melhor voz.", en: "I shall write you a serenade, but my friend will sing it, as he has a better voice.", altEs: ["Escrever-te-ei uma serenata, mas quem a cantará é o meu amigo, que tem melhor voz.", "Vou te escrever uma serenata, mas quem vai cantar é meu amigo, que tem uma voz melhor."], grammar: [g.mesoclisis], vocab: [w.serenata] }
      - { es: "Ver-nos-emos à meia-noite junto à Sé Velha... para a serenata, claro.", en: "We shall meet at midnight by the Old Cathedral... for the serenade, of course.", altEs: ["Vemo-nos à meia-noite junto à Sé Velha... para a serenata, claro.", "A gente se vê à meia-noite perto da Sé Velha... pra serenata, claro."], grammar: [g.mesoclisis], vocab: [w.serenata], note: "During the Queima das Fitas, the Serenata Monumental is sung at midnight on the steps of Coimbra's Old Cathedral." }
      - { es: "Não te direi o meu nome; descobri-lo-ás no fim da noite.", en: "I won't tell you my name; you'll find it out at the end of the night.", altEs: ["Não te digo o meu nome; descobri-lo-ás no fim da noite.", "Não vou te dizer meu nome; você vai descobrir no fim da noite."], grammar: [g.mesoclisis, g.ep-proclisis-attractors] }
  - id: c2.u04.l2
    title: Gostava de ficar
    teach: [g.ep-imperfect-for-conditional]
    vocab: [w.subsídio, w.baixa, w.atestado, w.segurança-social, w.finanças, w.recibo-verde, w.conjuntura, w.défice, w.déficit, w.austeridade, w.recessão, w.função-pública, w.repartição, w.licenciado]
    tip: "In everyday European speech the imperfect replaces the conditional: Gostava de…, Podia…?, Se tivesse tempo, ia. Era capaz de = it might."
    sentences:
      - { es: "Gostava de ficar em Coimbra depois do doutoramento.", en: "I'd like to stay in Coimbra after my PhD.", altEs: ["Gostaria de ficar em Coimbra depois do doutoramento.", "Gostava imenso de ficar em Coimbra depois do doutoramento.", "Eu gostaria de ficar em Coimbra depois do doutorado."], grammar: [g.ep-imperfect-for-conditional], vocab: [w.doutoramento] }
      - { es: "Podia dizer-me onde fica a Segurança Social?", en: "Could you tell me where the Social Security office is?", altEs: ["Podia dizer-me onde é a Segurança Social?", "Pode dizer-me onde fica a Segurança Social?", "Poderia me dizer onde fica a Previdência Social?"], grammar: [g.ep-imperfect-for-conditional, g.ep-enclisis], vocab: [w.segurança-social] }
      - { es: "Se tivesse contrato, não precisava de passar recibos verdes.", en: "If I had a contract, I wouldn't need to work on freelance receipts.", altEs: ["Se tivesse contrato, não tinha de passar recibos verdes.", "Se eu tivesse contrato, não precisava de passar recibos verdes.", "Se eu tivesse contrato, não precisaria emitir recibo de autônomo."], grammar: [g.ep-imperfect-for-conditional, g.se-clauses-unreal], vocab: [w.recibo-verde], note: "A recibo verde is the receipt self-employed workers issue in Portugal; viver a recibos verdes means precarious freelance work.", error: { wrong: "Se tivesse contrato, não precisasse de passar recibos verdes.", explain: "The main clause of an unreal condition takes the imperfect indicative (precisava) or the conditional (precisaria), not the subjunctive.", grammar: g.ep-imperfect-for-conditional } }
      - { es: "Estou de baixa há uma semana; o médico passou-me um atestado.", en: "I've been on sick leave for a week; the doctor gave me a sick note.", altEs: ["Estou de baixa há uma semana e o médico passou-me um atestado.", "Há uma semana que estou de baixa; o médico passou-me um atestado.", "Estou de licença médica há uma semana; o médico me deu um atestado."], grammar: [g.ep-enclisis, g.ha-faz-time], vocab: [w.baixa, w.atestado] }
      - { es: "Dava-me jeito que me enviasse o atestado por correio eletrónico.", en: "It would help me if you sent me the certificate by email.", altEs: ["Dava-me jeito que me mandasse o atestado por e-mail.", "Dava-me jeito que me enviasse o atestado por e-mail.", "Seria bom se você me mandasse o atestado por e-mail."], grammar: [g.ep-imperfect-for-conditional, g.subjunctive-imperfect], vocab: [w.atestado, w.dar-jeito] }
      - { es: "Devias ir às Finanças antes que acabe o prazo.", en: "You should go to the tax office before the deadline runs out.", altEs: ["Devias ir às Finanças antes de acabar o prazo.", "Devias ir às Finanças antes que o prazo acabe.", "Você deveria ir à Receita antes que o prazo acabe."], grammar: [g.ep-imperfect-for-conditional, g.dever-ter-que], vocab: [w.finanças], note: "Ir às Finanças = go to the tax office; in Brazil, ir à Receita (Federal)." }
      - { es: "Era capaz de haver greve na função pública na próxima semana.", en: "There might be a civil service strike next week.", altEs: ["É capaz de haver greve na função pública na próxima semana.", "Era capaz de haver greve na função pública para a semana.", "Pode ser que haja greve no funcionalismo público na semana que vem."], grammar: [g.ep-imperfect-for-conditional], vocab: [w.função-pública], transform: { instruction: "Say it the Brazilian way", answer: "Pode ser que haja greve no funcionalismo público na semana que vem.", alt: ["Pode ser que haja greve na função pública na próxima semana.", "Pode ser que tenha greve no funcionalismo público na semana que vem."] } }
      - { es: "Com esta conjuntura, ninguém arriscava abrir uma empresa.", en: "In this economic climate, nobody would risk starting a business.", altEs: ["Com esta conjuntura, ninguém arriscaria abrir uma empresa.", "Nesta conjuntura, ninguém arriscava abrir uma empresa.", "Nessa conjuntura, ninguém arriscaria abrir uma empresa."], grammar: [g.ep-imperfect-for-conditional], vocab: [w.conjuntura] }
      - { es: "Durante a austeridade, muitos jovens licenciados emigraram.", en: "During austerity, many young graduates emigrated.", altEs: ["Nos anos da austeridade, muitos jovens licenciados emigraram.", "Durante a austeridade, emigraram muitos jovens licenciados.", "Durante a austeridade, muitos jovens formados emigraram."], grammar: [g.preterite-regular], vocab: [w.austeridade, w.licenciado] }
      - { es: "O défice baixou, mas o país quase entrou em recessão.", en: "The deficit came down, but the country almost went into recession.", altEs: ["O défice desceu, mas o país quase entrou em recessão.", "O défice baixou, mas o país esteve quase a entrar em recessão.", "O déficit caiu, mas o país quase entrou em recessão."], grammar: [g.preterite-regular, g.connectors-contrast], vocab: [w.défice, w.déficit, w.recessão], note: "Défice in Portugal, déficit in Brazil." }
      - { es: "Se o subsídio de desemprego chegasse, eu não trabalhava aos fins de semana.", en: "If the unemployment benefit were enough, I wouldn't work at weekends.", altEs: ["Se o subsídio de desemprego chegasse, não trabalhava aos fins de semana.", "Se o subsídio de desemprego desse, eu não trabalhava aos fins de semana.", "Se o seguro-desemprego desse, eu não trabalharia nos fins de semana."], grammar: [g.ep-imperfect-for-conditional, g.se-clauses-unreal], vocab: [w.subsídio] }
      - { es: "Apetecia-me tanto um café na Baixa, mas tenho aulas até às seis.", en: "I'd love a coffee down in the Baixa, but I have classes until six.", altEs: ["Apetecia-me imenso um café na Baixa, mas tenho aulas até às seis.", "Apetecia-me tanto um café na Baixa, só que tenho aulas até às seis.", "Eu queria tanto um café na Baixa, mas tenho aula até as seis."], grammar: [g.ep-imperfect-for-conditional, g.ep-enclisis], vocab: [w.apetecer], note: "The Baixa (capital B) is downtown Coimbra; estar de baixa is to be on sick leave." }
      - { es: "Queria marcar uma consulta, se faz favor.", en: "I'd like to make an appointment, please.", altEs: ["Queria marcar uma consulta, por favor.", "Eu queria marcar uma consulta, se faz favor.", "Eu gostaria de marcar uma consulta, por favor."], grammar: [g.ep-imperfect-for-conditional, g.polite-requests], vocab: [w.se-faz-favor], transform: { instruction: "Make it more formal, with the conditional", answer: "Gostaria de marcar uma consulta, se faz favor.", alt: ["Desejaria marcar uma consulta, se faz favor.", "Gostaria de marcar uma consulta, por favor."] } }
      - { es: "Era melhor irmos já, que a repartição fecha ao meio-dia.", en: "We'd better go now, the office closes at noon.", altEs: ["Era melhor irmos já, porque a repartição fecha ao meio-dia.", "Era melhor irmos agora, que a repartição fecha ao meio-dia.", "Seria melhor a gente ir agora, que a repartição fecha ao meio-dia."], grammar: [g.ep-imperfect-for-conditional, g.personal-infinitive-uses], vocab: [w.repartição] }
      - { es: "Sou capaz de chegar atrasado à defesa da tese.", en: "I might be late for the thesis defence.", altEs: ["Sou capaz de chegar atrasada à defesa da tese.", "Sou capaz de me atrasar para a defesa da tese.", "Acho que vou chegar atrasado na defesa da tese."], grammar: [g.ep-imperfect-for-conditional], note: "Ser capaz de here means 'might', not 'be able to'." }
    exchanges:
      - q: { es: "Bom dia. O que é que desejava?", en: "Good morning. What can I do for you?" }
        a: { es: "Queria pedir um atestado de residência, se faz favor.", en: "I'd like to request a certificate of residence, please." }
        alt: ["Vinha entregar uns documentos.", "Queria falar com a doutora Sousa."]
        grammar: [g.ep-imperfect-for-conditional, g.polite-requests]
        vocab: [w.atestado]
      - q: { es: "Podia ajudar-me com este formulário?", en: "Could you help me with this form?" }
        a: { es: "Com certeza. Diga-me onde tem dúvidas.", en: "Certainly. Tell me where you're unsure." }
        alt: ["Claro, sente-se.", "Agora não posso, mas daqui a cinco minutos sim."]
        grammar: [g.ep-imperfect-for-conditional, g.ep-enclisis]
      - q: { es: "Vais à manifestação contra a austeridade?", en: "Are you going to the anti-austerity demonstration?" }
        a: { es: "Ia, mas estou de baixa.", en: "I would, but I'm on sick leave." }
        alt: ["Vou, claro.", "Era capaz de ir, se não chovesse."]
        grammar: [g.ep-imperfect-for-conditional]
        vocab: [w.austeridade, w.baixa]
      - q: { es: "O que fazias se ganhasses a lotaria?", en: "What would you do if you won the lottery?" }
        a: { es: "Deixava os recibos verdes e ia viver para o Algarve.", en: "I'd give up freelancing and go and live in the Algarve." }
        alt: ["Comprava uma casa na Alta.", "Não mudava nada."]
        grammar: [g.ep-imperfect-for-conditional, g.se-clauses-unreal]
        vocab: [w.recibo-verde]
      - q: { es: "Achas que a economia vai melhorar?", en: "Do you think the economy will improve?" }
        a: { es: "Com esta conjuntura, era capaz de piorar antes de melhorar.", en: "In this climate, it might get worse before it gets better." }
        alt: ["Duvido muito.", "Oxalá!"]
        grammar: [g.ep-imperfect-for-conditional]
        vocab: [w.conjuntura]
    texts:
      - title: "Conselhos de um colega"
        es: ["Se fosse a ti, tratava já do número de contribuinte.", "Depois inscrevia-me na Segurança Social.", "E, se pudesse, evitava os recibos verdes."]
        en: ["If I were you, I'd sort out your tax number straight away.", "Then I'd register with Social Security.", "And, if I could, I'd avoid freelance work."]
        grammar: [g.ep-imperfect-for-conditional, g.se-clauses-unreal]
        vocab: [w.contribuinte, w.segurança-social, w.recibo-verde]
      - title: "Na repartição"
        es: ["— Bom dia, queria tratar do subsídio.", "— Precisava do seu cartão de cidadão e de um atestado.", "— Podia voltar amanhã com os documentos?"]
        en: ["— Good morning, I'd like to sort out my benefit.", "— I'd need your ID card and a certificate.", "— Could you come back tomorrow with the documents?"]
        grammar: [g.ep-imperfect-for-conditional, g.polite-requests]
        vocab: [w.subsídio, w.cartão-de-cidadão, w.atestado, w.repartição]
    spicy:
      - { es: "Gostava de te convidar para jantar, mas só se fores tu a escolher o vinho.", en: "I'd like to invite you to dinner, but only if you choose the wine.", altEs: ["Gostava de convidar-te para jantar, mas só se fores tu a escolher o vinho.", "Eu gostaria de te convidar pra jantar, mas só se você escolher o vinho."], grammar: [g.ep-imperfect-for-conditional, g.future-subjunctive-se] }
      - { es: "Apetecia-me um passeio pelo Mondego contigo... sem a tua tese.", en: "I'd fancy a walk along the Mondego with you... without your thesis.", altEs: ["Apetecia-me um passeio junto ao Mondego contigo... sem a tese.", "Eu queria um passeio pelo Mondego com você... sem a sua tese."], grammar: [g.ep-imperfect-for-conditional], vocab: [w.apetecer] }
      - { es: "Se eu fosse a ti, não me deixava ir embora tão cedo.", en: "If I were you, I wouldn't let me leave so early.", altEs: ["Se fosse a ti, não me deixava ir embora tão cedo.", "Se eu fosse você, não me deixaria ir embora tão cedo."], grammar: [g.ep-imperfect-for-conditional, g.se-clauses-unreal] }
      - { es: "Era capaz de me apaixonar, se não estivesses sempre a falar do défice.", en: "I might fall in love, if you weren't always talking about the deficit.", altEs: ["Era capaz de me apaixonar por ti, se não estivesses sempre a falar do défice.", "Eu podia me apaixonar, se você não ficasse falando do déficit o tempo todo."], grammar: [g.ep-imperfect-for-conditional, g.ep-estar-a-infinitive], vocab: [w.défice] }
      - { es: "Dava-me jeito um abraço antes do exame; ofereces-te?", en: "A hug before the exam would come in handy; are you volunteering?", altEs: ["Dava-me jeito um abraço antes do exame. Ofereces-te?", "Um abraço antes da prova ia me ajudar; você se oferece?"], grammar: [g.ep-imperfect-for-conditional, g.ep-enclisis], vocab: [w.dar-jeito] }
  - id: c2.u04.l3
    title: Exmo. Senhor Reitor
    teach: [g.ep-formal-writing]
    vocab: [w.venho-por-este-meio, w.com-os-melhores-cumprimentos, w.atentamente, w.requerimento, w.deferimento, w.fatura, w.seguimento, w.telefónico, w.aquando, w.pelo-que, w.balcão, w.atendimento, w.comprovativo]
    tip: "European formal letters open with Exmo. Senhor / Exma. Senhora or Caro…, use phrases like No seguimento de… and Relativamente a…, and close with Com os melhores cumprimentos or Atentamente."
    sentences:
      - { es: "Exmo. Senhor Reitor, venho por este meio solicitar a equivalência do meu diploma brasileiro.", en: "Dear Rector, I am writing to request recognition of my Brazilian degree.", altEs: ["Exmo. Senhor Reitor, venho por este meio requerer a equivalência do meu diploma brasileiro.", "Exmo. Sr. Reitor, venho por este meio solicitar a equivalência do meu diploma brasileiro.", "Prezado Senhor Reitor, venho por meio desta solicitar a equivalência do meu diploma brasileiro."], grammar: [g.ep-formal-writing], vocab: [w.venho-por-este-meio, w.reitor] }
      - { es: "No seguimento do nosso contacto telefónico, envio em anexo o requerimento.", en: "Further to our phone call, please find the application attached.", altEs: ["No seguimento do nosso contacto telefónico, junto envio o requerimento.", "No seguimento do contacto telefónico, envio em anexo o requerimento.", "Conforme nosso contato telefônico, segue em anexo o requerimento."], grammar: [g.ep-formal-writing], vocab: [w.seguimento, w.telefónico, w.requerimento], transform: { instruction: "Say it the Brazilian way", answer: "Conforme nosso contato telefônico, segue em anexo o requerimento.", alt: ["Conforme o nosso contato telefônico, segue em anexo o requerimento.", "Em relação ao nosso contato telefônico, segue em anexo o requerimento."] } }
      - { es: "O requerimento teve deferimento: já posso inscrever-me.", en: "The application was approved: I can now enrol.", altEs: ["O requerimento teve deferimento, já posso inscrever-me.", "O meu requerimento teve deferimento: já me posso inscrever.", "O requerimento foi deferido: já posso me inscrever."], grammar: [g.ep-formal-writing, g.clitics-verb-phrases], vocab: [w.deferimento, w.requerimento] }
      - { es: "Relativamente à fatura de março, informamos que o pagamento já foi efetuado.", en: "With regard to the March invoice, we inform you that payment has already been made.", altEs: ["Relativamente à fatura de março, informamos que o pagamento já foi feito.", "No que respeita à fatura de março, informamos que o pagamento já foi efetuado.", "Com relação à fatura de março, informamos que o pagamento já foi efetuado."], grammar: [g.ep-formal-writing, g.passive-ser], vocab: [w.fatura] }
      - { es: "Aquando da sua visita a Coimbra, o ministro inaugurou a nova biblioteca.", en: "At the time of his visit to Coimbra, the minister opened the new library.", altEs: ["Aquando da visita a Coimbra, o ministro inaugurou a nova biblioteca.", "Aquando da sua vinda a Coimbra, o ministro inaugurou a nova biblioteca.", "Por ocasião da sua visita a Coimbra, o ministro inaugurou a nova biblioteca."], grammar: [g.ep-formal-writing], vocab: [w.aquando], note: "Aquando de is European and formal; Brazil says por ocasião de." }
      - { es: "O prazo terminou ontem, pelo que o pedido não pode ser aceite.", en: "The deadline ended yesterday, so the request cannot be accepted.", altEs: ["O prazo terminou ontem, pelo que o pedido não poderá ser aceite.", "O prazo acabou ontem, pelo que o pedido não pode ser aceite.", "O prazo terminou ontem, portanto o pedido não pode ser aceito."], grammar: [g.ep-formal-writing, g.connectors-cause-consequence], vocab: [w.pelo-que], note: "Aceite is the European participle; Brazil says aceito.", error: { wrong: "O prazo terminou ontem, pelo qual o pedido não pode ser aceite.", explain: "The formal connector meaning 'so, therefore' is pelo que.", grammar: g.ep-formal-writing } }
      - { es: "Dirija-se ao balcão número três, se faz favor.", en: "Please go to counter number three.", altEs: ["Dirija-se ao balcão n.º 3, se faz favor.", "Faz favor de se dirigir ao balcão número três.", "Por favor, dirija-se ao balcão número três."], grammar: [g.imperative-formal, g.ep-enclisis], vocab: [w.balcão] }
      - { es: "O horário de atendimento ao público é das nove às quatro.", en: "Opening hours for the public are from nine to four.", altEs: ["O atendimento ao público é das nove às quatro.", "O horário de atendimento ao público é das 9h às 16h.", "O atendimento ao público funciona das nove às quatro."], grammar: [g.telling-time], vocab: [w.atendimento] }
      - { es: "Informa-se que os serviços estarão encerrados no dia 4 de julho, feriado municipal.", en: "Please note that the offices will be closed on 4 July, a municipal holiday.", altEs: ["Informa-se que os serviços estarão fechados a 4 de julho, feriado municipal.", "Informa-se que no dia 4 de julho, feriado municipal, os serviços estarão encerrados.", "Informamos que os serviços estarão fechados no dia 4 de julho, feriado municipal."], grammar: [g.ep-formal-writing, g.ep-enclisis], note: "4 July, the feast of the Rainha Santa Isabel, is Coimbra's municipal holiday." }
      - { es: "Agradeço desde já a atenção. Com os melhores cumprimentos, Rita Moura.", en: "Thank you in advance for your attention. Best regards, Rita Moura.", altEs: ["Agradeço desde já a atenção. Atentamente, Rita Moura.", "Agradeço desde já a vossa atenção. Com os melhores cumprimentos, Rita Moura.", "Desde já agradeço a atenção. Atenciosamente, Rita Moura."], grammar: [g.ep-formal-writing], vocab: [w.com-os-melhores-cumprimentos, w.atentamente] }
      - { es: "Face ao exposto, solicito a revisão da minha nota.", en: "In view of the above, I request a review of my grade.", altEs: ["Face ao exposto, venho solicitar a revisão da minha nota.", "Face ao exposto, solicito a revisão da nota.", "Diante do exposto, solicito a revisão da minha nota."], grammar: [g.ep-formal-writing], vocab: [w.revisão] }
      - { es: "Em Portugal escreve-se «Atentamente»; no Brasil, «Atenciosamente».", en: "In Portugal you write 'Atentamente'; in Brazil, 'Atenciosamente'.", altEs: ["Em Portugal escreve-se «Atentamente», e no Brasil, «Atenciosamente».", "Em Portugal se escreve «Atentamente»; no Brasil, «Atenciosamente»."], grammar: [g.ep-formal-writing, g.se-passive], vocab: [w.atentamente] }
      - { es: "Junto envio cópia do cartão de cidadão e do comprovativo de morada.", en: "Please find enclosed a copy of my ID card and proof of address.", altEs: ["Envio em anexo cópia do cartão de cidadão e do comprovativo de morada.", "Junto envio uma cópia do cartão de cidadão e o comprovativo de morada.", "Segue em anexo cópia da identidade e do comprovante de endereço."], grammar: [g.ep-formal-writing], vocab: [w.cartão-de-cidadão, w.comprovativo], transform: { instruction: "Say it the Brazilian way", answer: "Segue em anexo cópia da identidade e do comprovante de endereço.", alt: ["Segue em anexo cópia do documento de identidade e do comprovante de endereço.", "Segue em anexo cópia da carteira de identidade e do comprovante de residência."] } }
      - { es: "Ficamos a aguardar o envio da fatura corrigida.", en: "We look forward to receiving the corrected invoice.", altEs: ["Ficamos a aguardar a fatura corrigida.", "Aguardamos o envio da fatura corrigida.", "Ficamos no aguardo da fatura corrigida."], grammar: [g.ep-formal-writing, g.ep-estar-a-infinitive], vocab: [w.fatura] }
      - { es: "Caro Professor Almeida, na sequência da reunião de ontem, envio-lhe a ata.", en: "Dear Professor Almeida, following yesterday's meeting, I am sending you the minutes.", altEs: ["Caro Professor Almeida, no seguimento da reunião de ontem, envio-lhe a ata.", "Caro Prof. Almeida, na sequência da reunião de ontem, junto envio a ata.", "Prezado Professor Almeida, conforme a reunião de ontem, envio a ata."], grammar: [g.ep-formal-writing, g.ep-enclisis], vocab: [w.seguimento] }
    exchanges:
      - q: { es: "Bom dia. É aqui o atendimento ao público?", en: "Good morning. Is this the public service desk?" }
        a: { es: "É, sim. Tire uma senha e aguarde a sua vez.", en: "Yes, it is. Take a ticket and wait your turn." }
        alt: ["É no balcão ao lado.", "Sim, faça favor."]
        grammar: [g.imperative-formal]
        vocab: [w.atendimento]
      - q: { es: "Como começo uma carta ao reitor?", en: "How do I start a letter to the rector?" }
        a: { es: "Com «Exmo. Senhor Reitor» e depois «Venho por este meio…».", en: "With 'Dear Rector' and then 'I am writing to…'." }
        alt: ["Com «Exmo. Senhor Reitor».", "Escreve «Exmo. Senhor Reitor» e vai direto ao assunto."]
        grammar: [g.ep-formal-writing]
        vocab: [w.reitor, w.venho-por-este-meio]
      - q: { es: "E como é que termino?", en: "And how do I finish?" }
        a: { es: "Com os melhores cumprimentos, ou simplesmente Atentamente.", en: "Best regards, or simply Yours sincerely." }
        alt: ["Atentamente, e o teu nome.", "Com os melhores cumprimentos."]
        grammar: [g.ep-formal-writing]
        vocab: [w.com-os-melhores-cumprimentos, w.atentamente]
      - q: { es: "O meu requerimento já teve deferimento?", en: "Has my application been approved yet?" }
        a: { es: "Ainda não; a decisão sairá no prazo de trinta dias.", en: "Not yet; the decision will come out within thirty days." }
        alt: ["Já, recebeu o deferimento ontem.", "Está a aguardar despacho."]
        grammar: [g.ep-formal-writing, g.future-simple]
        vocab: [w.requerimento, w.deferimento]
      - q: { es: "Onde pago esta fatura?", en: "Where do I pay this invoice?" }
        a: { es: "Pode pagar ao balcão ou no multibanco.", en: "You can pay at the counter or at a cash machine." }
        alt: ["Aqui mesmo, ao balcão.", "No multibanco, com a referência."]
        grammar: [g.poder-present]
        vocab: [w.fatura, w.balcão, w.multibanco]
    texts:
      - title: "Carta formal"
        es: ["Exmo. Senhor Diretor,", "No seguimento do nosso contacto telefónico, venho por este meio apresentar o meu requerimento de equivalência.", "Junto envio os documentos solicitados.", "Com os melhores cumprimentos, Caio Mendes"]
        en: ["Dear Director,", "Further to our telephone conversation, I hereby submit my application for recognition of my degree.", "Please find the requested documents enclosed.", "Yours sincerely, Caio Mendes"]
        grammar: [g.ep-formal-writing]
        vocab: [w.seguimento, w.telefónico, w.venho-por-este-meio, w.requerimento, w.com-os-melhores-cumprimentos]
      - title: "Aviso aos utentes"
        es: ["Informa-se que o atendimento ao balcão passa a ser feito apenas com marcação.", "Os pedidos de revisão deverão ser entregues até ao dia 15.", "Gratos pela compreensão."]
        en: ["Please note that service at the counter will now be by appointment only.", "Requests for review must be submitted by the 15th.", "Thank you for your understanding."]
        grammar: [g.ep-formal-writing, g.ep-enclisis]
        vocab: [w.atendimento, w.balcão, w.revisão]
    spicy:
      - { es: "Exma. Senhora: venho por este meio convidá-la para um café.", en: "Dear Madam: I hereby invite you for a coffee.", altEs: ["Exma. Senhora, venho por este meio convidá-la para um café.", "Prezada Senhora: venho por meio desta convidá-la para um café."], grammar: [g.ep-formal-writing, g.ep-enclisis], vocab: [w.venho-por-este-meio] }
      - { es: "No seguimento do nosso olhar de ontem, gostaria de lhe pedir o número.", en: "Further to our exchange of glances yesterday, I would like to ask for your number.", altEs: ["No seguimento do nosso olhar de ontem, gostaria de pedir-lhe o número.", "Conforme nosso olhar de ontem, gostaria de pedir seu número."], grammar: [g.ep-formal-writing, g.clitics-verb-phrases], vocab: [w.seguimento] }
      - { es: "Face ao exposto, solicito um jantar com a maior brevidade possível.", en: "In view of the above, I request a dinner at your earliest convenience.", altEs: ["Face ao exposto, venho solicitar um jantar com a maior brevidade possível.", "Diante do exposto, solicito um jantar o mais rápido possível."], grammar: [g.ep-formal-writing] }
      - { es: "O seu pedido de beijo teve deferimento; dirija-se ao balcão.", en: "Your request for a kiss has been approved; please proceed to the counter.", altEs: ["O seu pedido de beijo teve deferimento: dirija-se ao balcão.", "Seu pedido de beijo foi deferido; dirija-se ao balcão."], grammar: [g.ep-formal-writing, g.imperative-formal], vocab: [w.deferimento, w.balcão] }
      - { es: "Com os melhores cumprimentos e um sorriso que não cabe na carta.", en: "Best regards, and a smile too big for this letter.", altEs: ["Com os melhores cumprimentos, e um sorriso que não cabe na carta.", "Atenciosamente, e com um sorriso que não cabe na carta."], grammar: [g.ep-formal-writing], vocab: [w.com-os-melhores-cumprimentos] }
  - id: c2.u04.l4
    title: Assine aqui, se faz favor
    teach: [g.ep-formal-writing, g.mesoclisis]
    vocab: [w.outorgante, w.signatário, w.abaixo-assinado, w.ofício, w.circular, w.memorando, w.minuta, w.rubricar, w.carimbar, w.autenticar, w.certificar, w.notário, w.reitoria, w.universitário]
    tip: "Contracts, notices and official letters in Portugal love the future with mesoclisis (Proceder-se-á…) and the se passive (Informa-se que…)."
    sentences:
      - { es: "Os outorgantes rubricarão todas as páginas do contrato.", en: "The parties will initial every page of the contract.", altEs: ["Os outorgantes vão rubricar todas as páginas do contrato.", "Todas as páginas do contrato serão rubricadas pelos outorgantes."], grammar: [g.ep-formal-writing, g.future-simple], vocab: [w.outorgante, w.rubricar] }
      - { es: "Rubrique cada página e assine na última, se faz favor.", en: "Initial each page and sign the last one, please.", altEs: ["Rubrique todas as páginas e assine a última, se faz favor.", "Rubrique cada página e assine na última, por favor."], grammar: [g.imperative-formal], vocab: [w.rubricar] }
      - { es: "Os signatários exigem que a residência universitária não feche no verão.", en: "The signatories demand that the university residence stay open in the summer.", altEs: ["Os signatários exigem que a residência universitária se mantenha aberta no verão.", "Os signatários exigem que a residência estudantil não feche no verão."], grammar: [g.ep-formal-writing, g.indirect-commands], vocab: [w.signatário, w.universitário] }
      - { es: "Mais de mil estudantes assinaram o abaixo-assinado em defesa das repúblicas.", en: "Over a thousand students signed the petition in defence of the repúblicas.", altEs: ["Mais de mil estudantes assinaram o abaixo-assinado a defender as repúblicas.", "Mais de mil estudantes assinaram o abaixo-assinado em defesa das repúblicas de Coimbra."], grammar: [g.preterite-regular], vocab: [w.abaixo-assinado], note: "In Coimbra, repúblicas are student houses run as self-governing communities, a long-standing tradition of the city." }
      - { es: "O ofício da reitoria chegou ontem, carimbado e assinado.", en: "The official letter from the rector's office arrived yesterday, stamped and signed.", altEs: ["Chegou ontem o ofício da reitoria, carimbado e assinado.", "O ofício da reitoria chegou ontem, assinado e carimbado."], grammar: [g.past-participles], vocab: [w.ofício, w.carimbar, w.reitoria] }
      - { es: "Enviar-se-á uma circular a todos os departamentos.", en: "A circular will be sent to all departments.", altEs: ["Vai enviar-se uma circular a todos os departamentos.", "Será enviada uma circular a todos os departamentos.", "Vai ser enviada uma circular para todos os departamentos."], grammar: [g.mesoclisis, g.se-passive], vocab: [w.circular] }
      - { es: "Segundo o memorando, as aulas recomeçam a 15 de setembro.", en: "According to the memo, classes start again on 15 September.", altEs: ["Segundo o memorando, as aulas voltam a começar a 15 de setembro.", "De acordo com o memorando, as aulas recomeçam no dia 15 de setembro."], grammar: [g.dates-years], vocab: [w.memorando] }
      - { es: "Antes de assinarmos, quero ler a minuta com calma.", en: "Before we sign, I want to read the draft carefully.", altEs: ["Antes de assinarmos, quero ler a minuta com atenção.", "Antes de a gente assinar, quero ler a minuta com calma."], grammar: [g.personal-infinitive-uses, g.antes-depois-de], vocab: [w.minuta] }
      - { es: "Tem de autenticar a cópia do diploma num notário.", en: "You have to get the copy of your degree certificate certified by a notary.", altEs: ["Tem de autenticar a cópia do diploma no notário.", "Tem de mandar autenticar a cópia do diploma num notário.", "Você tem que autenticar a cópia do diploma num cartório."], grammar: [g.ter-que], vocab: [w.autenticar, w.notário], note: "Portugal: notário or conservatória; Brazil: cartório." }
      - { es: "A secretaria certificar-lhe-á as notas no prazo de cinco dias úteis.", en: "The admin office will certify your grades within five working days.", altEs: ["A secretaria vai certificar-lhe as notas no prazo de cinco dias úteis.", "A secretaria certificará as suas notas no prazo de cinco dias úteis.", "A secretaria vai certificar suas notas no prazo de cinco dias úteis."], grammar: [g.mesoclisis], vocab: [w.certificar], transform: { instruction: "Make it negative (não pulls the pronoun before the verb)", answer: "A secretaria não lhe certificará as notas no prazo de cinco dias úteis." } }
      - { es: "Carimbe-me este documento, se faz favor.", en: "Could you stamp this document for me, please.", altEs: ["Carimbe-me este documento, por favor.", "Pode carimbar-me este documento, se faz favor?", "Carimbe este documento pra mim, por favor."], grammar: [g.ep-enclisis, g.imperative-formal], vocab: [w.carimbar] }
      - { es: "O presente contrato produzirá efeitos a partir da data da sua assinatura.", en: "This contract shall take effect from the date of its signature.", altEs: ["O presente contrato produz efeitos a partir da data da sua assinatura.", "Este contrato produzirá efeitos a partir da data da sua assinatura."], grammar: [g.ep-formal-writing, g.legal-register] }
      - { es: "Nos termos da lei, os signatários comprometem-se a cumprir o regulamento.", en: "Under the terms of the law, the signatories undertake to comply with the regulations.", altEs: ["Nos termos da lei, os signatários obrigam-se a cumprir o regulamento.", "Nos termos da lei, os signatários comprometem-se a respeitar o regulamento."], grammar: [g.legal-register, g.ep-enclisis], vocab: [w.signatário], error: { wrong: "Nos termos da lei, os signatários se comprometem a cumprir o regulamento.", explain: "In European formal writing a plain subject does not pull the pronoun forward: comprometem-se (proclisis here is Brazilian).", grammar: g.ep-enclisis } }
      - { es: "Proceder-se-á à assinatura do contrato na presença de ambos os outorgantes.", en: "The contract will be signed in the presence of both parties.", altEs: ["A assinatura do contrato far-se-á na presença de ambos os outorgantes.", "O contrato será assinado na presença de ambos os outorgantes."], grammar: [g.mesoclisis, g.ep-formal-writing], vocab: [w.outorgante], error: { wrong: "Procederá-se à assinatura do contrato na presença de ambos os outorgantes.", explain: "A pronoun never follows a future: proceder-se-á.", grammar: g.mesoclisis } }
      - { es: "Os estudantes entregarão o abaixo-assinado ao reitor durante a Queima das Fitas.", en: "The students will hand the petition to the rector during the Queima das Fitas.", altEs: ["Os estudantes vão entregar o abaixo-assinado ao reitor durante a Queima das Fitas.", "Durante a Queima das Fitas, os estudantes entregarão o abaixo-assinado ao reitor."], grammar: [g.future-simple, g.mesoclisis], vocab: [w.abaixo-assinado, w.reitor], note: "The Queima das Fitas is Coimbra's week-long student festival in May, marking the end of the academic year.", transform: { instruction: "Replace o abaixo-assinado with a pronoun (use mesoclisis)", answer: "Os estudantes entregá-lo-ão ao reitor durante a Queima das Fitas.", alt: ["Os estudantes vão entregá-lo ao reitor durante a Queima das Fitas."] } }
    exchanges:
      - q: { es: "Onde é que assino?", en: "Where do I sign?" }
        a: { es: "Assine aqui em baixo e rubrique as outras páginas.", en: "Sign down here and initial the other pages." }
        alt: ["Na última página, ao fundo.", "Aqui, ao lado do carimbo."]
        grammar: [g.imperative-formal]
        vocab: [w.rubricar]
      - q: { es: "Já leste a minuta do contrato?", en: "Have you read the draft contract yet?" }
        a: { es: "Li, e há duas cláusulas que eu mudava.", en: "I have, and there are two clauses I'd change." }
        alt: ["Ainda não, leio-a hoje à noite.", "Li, está tudo bem."]
        grammar: [g.ep-imperfect-for-conditional]
        vocab: [w.minuta]
      - q: { es: "Quantos signatários tem o abaixo-assinado?", en: "How many signatures does the petition have?" }
        a: { es: "Já vai em mil e duzentos.", en: "It's already up to twelve hundred." }
        alt: ["Mais de mil.", "Ainda poucos, ajuda-me a divulgá-lo."]
        grammar: [g.numbers-100-plus]
        vocab: [w.signatário, w.abaixo-assinado]
      - q: { es: "É preciso autenticar a cópia?", en: "Does the copy need to be certified?" }
        a: { es: "É, senão não lha aceitam.", en: "Yes, otherwise they won't accept it from you." }
        alt: ["Não, basta a cópia simples.", "É, no notário."]
        grammar: [g.clitic-contractions, g.ep-proclisis-attractors]
        vocab: [w.autenticar]
      - q: { es: "Recebeste a circular da faculdade?", en: "Did you get the circular from the faculty?" }
        a: { es: "Recebi; diz que as inscrições se farão pela internet.", en: "I did; it says registration will be done online." }
        alt: ["Ainda não.", "Recebi, mas ainda não a li."]
        grammar: [g.ep-proclisis-attractors, g.future-simple]
        vocab: [w.circular]
    texts:
      - title: "Abaixo-assinado"
        es: ["Nós, abaixo assinados, estudantes da Universidade de Coimbra,", "vimos por este meio pedir que a residência universitária se mantenha aberta no verão.", "Entregar-se-á este documento ao Senhor Reitor no dia 30 de abril."]
        en: ["We, the undersigned, students of the University of Coimbra,", "hereby request that the university residence remain open in the summer.", "This document will be handed to the Rector on 30 April."]
        grammar: [g.ep-formal-writing, g.mesoclisis]
        vocab: [w.abaixo-assinado, w.venho-por-este-meio, w.reitor, w.universitário]
      - title: "Memorando interno"
        es: ["Assunto: obras na Biblioteca Joanina.", "A partir de segunda-feira, a biblioteca estará encerrada ao público.", "Os investigadores serão atendidos na Biblioteca Geral."]
        en: ["Subject: works at the Joanina Library.", "From Monday, the library will be closed to the public.", "Researchers will be seen at the General Library."]
        grammar: [g.ep-formal-writing, g.passive-ser]
        vocab: [w.memorando]
    spicy:
      - { es: "Rubrico todas as páginas, desde que a última seja um convite para jantar.", en: "I'll initial every page, as long as the last one is a dinner invitation.", altEs: ["Rubrico as páginas todas, desde que a última seja um convite para jantar.", "Rubrico todas as páginas, contanto que a última seja um convite pra jantar."], grammar: [g.ep-formal-writing, g.conditional-conjunctions], vocab: [w.rubricar] }
      - { es: "Certificar-te-ei, com carimbo e tudo, que és a pessoa mais gira de Coimbra.", en: "I shall certify, stamp and all, that you're the cutest person in Coimbra.", altEs: ["Vou certificar-te, com carimbo e tudo, que és a pessoa mais gira de Coimbra.", "Vou te certificar, com carimbo e tudo, que você é a pessoa mais bonita de Coimbra."], grammar: [g.mesoclisis, g.superlatives], vocab: [w.certificar, w.giro] }
      - { es: "Os signatários deste beijo comprometem-se a repeti-lo amanhã.", en: "The signatories of this kiss undertake to repeat it tomorrow.", altEs: ["Os signatários deste beijo comprometem-se a repeti-lo já amanhã.", "Os signatários deste beijo se comprometem a repeti-lo amanhã."], grammar: [g.legal-register, g.ep-enclisis], vocab: [w.signatário] }
      - { es: "Minuta de declaração de amor: rever, corrigir e entregar em mão.", en: "Draft declaration of love: revise, correct and deliver by hand.", altEs: ["Minuta da declaração de amor: rever, corrigir e entregar em mão.", "Rascunho de declaração de amor: revisar, corrigir e entregar em mãos."], grammar: [g.ep-formal-writing, g.infinitive-clauses-advanced], vocab: [w.minuta] }
      - { es: "Lançar-se-á um abaixo-assinado para que voltes a cantar na serenata.", en: "A petition will be launched for you to sing at the serenade again.", altEs: ["Vai lançar-se um abaixo-assinado para que voltes a cantar na serenata.", "Vai ser lançado um abaixo-assinado pra você voltar a cantar na serenata."], grammar: [g.mesoclisis, g.subjunctive-purpose], vocab: [w.abaixo-assinado, w.serenata] }
dialogues:
  - id: c2.u04.d1
    title: Na secretaria da universidade
    context: Lívia, a Brazilian graduate, goes to the University of Coimbra's admin office to apply for recognition of her degree before starting a master's.
    lines:
      - { speaker: Funcionária, es: "Bom dia. Faça favor, o que é que desejava?", en: "Good morning. Go ahead, what can I do for you?" }
      - { speaker: Lívia, es: "Bom dia. Queria entregar o requerimento de equivalência do meu diploma.", en: "Good morning. I'd like to hand in my application for recognition of my degree." }
      - { speaker: Funcionária, es: "Trouxe a cópia autenticada e o comprovativo de pagamento da fatura?", en: "Did you bring the certified copy and the proof of payment for the invoice?" }
      - { speaker: Lívia, es: "Trouxe a cópia, mas a fatura ainda não a paguei. Podia pagá-la aqui ao balcão?", en: "I brought the copy, but I haven't paid the invoice yet. Could I pay it here at the counter?" }
      - { speaker: Funcionária, es: "Podia, mas o multibanco está avariado. Era capaz de lhe dar mais jeito ir à tesouraria, no primeiro andar.", en: "You could, but the card machine is out of order. It might be easier for you to go to the cashier's office on the first floor." }
      - { speaker: Lívia, es: "Está bem. E quanto tempo demora a resposta?", en: "All right. And how long does the answer take?" }
      - { speaker: Funcionária, es: "O processo será analisado pelo conselho científico; a deliberação comunicar-se-á por ofício no prazo de sessenta dias.", en: "The case will be examined by the scientific council; the decision will be communicated by official letter within sixty days." }
      - { speaker: Lívia, es: "Sessenta dias? Gostava de começar o mestrado em setembro...", en: "Sixty days? I'd like to start my master's in September..." }
      - { speaker: Funcionária, es: "Se o requerimento der entrada esta semana, ainda vai a tempo. Mas despache-se!", en: "If the application goes in this week, you'll still make it. But hurry!" }
      - { speaker: Lívia, es: "Muito obrigada. Dar-lhe-ei notícias, então!", en: "Thank you very much. I'll let you know how it goes, then!" }
      - { speaker: Funcionária, es: "Ora essa. Boa sorte!", en: "Not at all. Good luck!" }
    questions:
      - { q: "O que é que a Lívia quer entregar?", options: ["Um abaixo-assinado", "Um requerimento de equivalência", "Uma reclamação"], answer: 1, explain: "«Queria entregar o requerimento de equivalência do meu diploma.»" }
      - { q: "Porque é que a Lívia não paga a fatura ao balcão?", options: ["Porque o balcão está fechado", "Porque o multibanco está avariado", "Porque não tem dinheiro"], answer: 1, explain: "The official says «o multibanco está avariado» and sends her to the cashier's office." }
      - { q: "Como será comunicada a decisão?", options: ["Por telefone", "Por ofício", "Ao balcão, pessoalmente"], answer: 1, explain: "«A deliberação comunicar-se-á por ofício»: by official letter." }
      - { q: "Quando é que a Lívia gostava de começar o mestrado?", options: ["Em janeiro", "Em setembro", "Daqui a sessenta dias"], answer: 1, explain: "«Gostava de começar o mestrado em setembro.»" }
