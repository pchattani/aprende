  - { es: marmotte, en: marmots }
  - { es: ogni tanto, en: every so often }
  - { es: esagerasse, en: was exaggerating }
  - { es: freddissimo, en: freezing, very cold }
  - { es: tuoni, en: (claps of) thunder }
  - { es: tratto, en: stretch }
  - { es: indossato, en: put on, worn }
  - { es: pastore, en: herdsman, shepherd }
  - { es: incredibile, en: incredible }
  - { es: colorava, en: coloured }
  - { es: dolomia, en: dolomite (the rock) }
  - { es: riflette, en: reflects }
