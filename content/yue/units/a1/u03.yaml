        vocab: [w.pou2-tung1-waa2, w.zung1-man2]
      - q: { es: "佢係邊個國家嘅人呀？", en: "What country is she from?" }
        a: { es: "佢係新加坡人。", en: "She's from Singapore." }
        alt: ["新加坡人。", "佢係新加坡嚟嘅。"]
        grammar: [g.nationality-language]
        vocab: [w.gwok3-gaa1, w.san1-gaa3-bo1]
      - q: { es: "你喺邊度學廣東話呀？", en: "Where are you learning Cantonese?" }
        a: { es: "喺大學。", en: "At university." }
        alt: ["喺香港。", "我自己學。"]
        grammar: [g.hai2-location]
        vocab: [w.gwong2-dung1-waa2]
    texts:
      - title: "自我介紹"
        es: ["我叫Ana，係西班牙人。", "我識講英文同法文，仲講少少廣東話。", "我而家喺香港讀書。"]
        en: ["My name is Ana and I'm Spanish.", "I can speak English and French, and a little Cantonese too.", "I'm studying in Hong Kong now."]
        grammar: [g.nationality-language]
        vocab: [w.sai1-baan1-ngaa4, w.jing1-man2, w.faat3-man2]
      - title: "山頂"
        es: ["山頂好多遊客。", "有人講英文，有人講普通話，有人講日文。", "我哋講廣東話！"]
        en: ["The Peak is full of tourists.", "Some speak English, some speak Mandarin, some speak Japanese.", "We speak Cantonese!"]
        grammar: [g.nationality-language]
        vocab: [w.pou2-tung1-waa2, w.jat6-man2, w.gwong2-dung1-waa2]
    spicy:
