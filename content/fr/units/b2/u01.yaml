id: b2.u01
title: "Les traboules, pour que tu ne te perdes pas"
lessons:
  - id: b2.u01.l1
    title: Pour que tu ne te perdes pas
    teach: [g.subjonctif-conjonctions]
    tip: "Different subjects: pour que / afin que / sans que + subjonctif. Same subject: pour / afin de / sans + infinitive. Je te fais un plan pour que tu ne te perdes pas, but je prends un plan pour ne pas me perdre."
    vocab: [w.pour-que, w.afin-que, w.sans-que, w.de-sorte-que, w.traboule, w.passage, w.cour-intérieure, w.couloir, w.voûte, w.s-égarer, w.égaré, w.labyrinthe, w.dédale, w.ruelle, w.pavé, w.recoin, w.repère, w.se-repérer, w.mémoriser, w.itinéraire, w.guide-conférencier, w.déboucher, w.contourner, w.souterrain, w.souterrain.n]
    sentences:
      - { es: "Je te dessine un plan pour que tu ne te perdes pas dans les traboules.", en: "I'll draw you a map so that you don't get lost in the traboules.", altEs: ["Je te dessine un plan afin que tu ne te perdes pas dans les traboules.", "Je vais te dessiner un plan pour que tu ne te perdes pas dans les traboules."], altEn: ["I'm drawing you a map so you don't get lost in the traboules."], grammar: [g.subjonctif-conjonctions], vocab: [w.pour-que, w.traboule], transform: { instruction: "Make it same-subject: 'I'm taking a map so I don't get lost'", answer: "Je prends un plan pour ne pas me perdre.", alt: ["Je prends un plan afin de ne pas me perdre."], en: "I'm taking a map so I don't get lost." } }
      - { es: "Le guide-conférencier parle lentement afin que tout le groupe le comprenne.", en: "The tour guide speaks slowly so that the whole group understands him.", altEs: ["Le guide-conférencier parle lentement pour que tout le groupe le comprenne.", "La guide-conférencière parle lentement afin que tout le groupe la comprenne."], altEn: ["The tour guide is speaking slowly so the whole group can understand him."], grammar: [g.subjonctif-conjonctions], vocab: [w.guide-conférencier, w.afin-que], error: { wrong: "Le guide-conférencier parle lentement afin que tout le groupe le comprend.", explain: "afin que takes the subjonctif: qu'il comprenne, not comprend.", grammar: g.subjonctif-conjonctions } }
      - { es: "On peut traverser tout le quartier sans que personne nous voie.", en: "You can cross the whole district without anyone seeing you.", altEs: ["On peut traverser tout le quartier sans que personne ne nous voie."], altEn: ["We can cross the whole district without anyone seeing us."], grammar: [g.subjonctif-conjonctions], vocab: [w.sans-que] }
      - { es: "Le guide nous a fait passer par un long couloir, de sorte que nous sommes arrivés directement dans la cour intérieure.", en: "The guide took us through a long corridor, so we came out right in the inner courtyard.", altEs: ["Le guide nous a fait passer par un long couloir, si bien que nous sommes arrivés directement dans la cour intérieure."], grammar: [g.subjonctif-conjonctions], vocab: [w.couloir, w.de-sorte-que, w.cour-intérieure], note: "de sorte que + indicative = result (so); + subjonctif = purpose (so that)." }
      - { es: "Mémorise quelques repères afin de te repérer sans carte.", en: "Memorise a few landmarks so you can find your way without a map.", altEs: ["Mémorise quelques repères pour te repérer sans carte."], grammar: [g.subjonctif-conjonctions], vocab: [w.mémoriser, w.repère, w.se-repérer], error: { wrong: "Mémorise quelques repères afin que tu te repères sans carte.", explain: "Same subject (tu … tu): use afin de + infinitive, not afin que + subjonctif.", grammar: g.subjonctif-conjonctions } }
      - { es: "Le guide nous fait contourner la place pour que nous évitions la foule.", en: "The guide takes us round the square so that we avoid the crowd.", altEs: ["Le guide nous fait contourner la place afin que nous évitions la foule."], grammar: [g.subjonctif-conjonctions], vocab: [w.contourner] }
      - { es: "Je t'envoie l'itinéraire pour que tu puisses venir seul.", en: "I'm sending you the route so that you can come on your own.", altEs: ["Je t'envoie l'itinéraire afin que tu puisses venir seul.", "Je t'envoie l'itinéraire pour que tu puisses venir seule."], grammar: [g.subjonctif-conjonctions], vocab: [w.itinéraire, w.pour-que], transform: { instruction: "Change 'tu' to 'vous'", answer: "Je vous envoie l'itinéraire pour que vous puissiez venir seul.", alt: ["Je vous envoie l'itinéraire pour que vous puissiez venir seuls.", "Je vous envoie l'itinéraire pour que vous puissiez venir seule.", "Je vous envoie l'itinéraire pour que vous puissiez venir seules.", "Je vous envoie l'itinéraire afin que vous puissiez venir seul."], en: "I'm sending you the route so that you can come on your own." } }
      - { es: "Selon la légende, ce souterrain permettait de sortir de la ville sans que personne le sache.", en: "According to legend, this underground passage made it possible to leave the city without anyone knowing.", altEs: ["Selon la légende, ce souterrain permettait de quitter la ville sans que personne le sache.", "D'après la légende, ce souterrain permettait de sortir de la ville sans que personne le sache."], grammar: [g.subjonctif-conjonctions], vocab: [w.souterrain.n, w.sans-que] }
      - { es: "Restez près de moi pour ne pas vous égarer dans ce dédale.", en: "Stay close to me so you don't get lost in this maze.", altEs: ["Restez près de moi afin de ne pas vous égarer dans ce dédale.", "Restez près de moi pour ne pas vous perdre dans ce dédale."], altEn: ["Stay near me so you don't get lost in this maze."], grammar: [g.subjonctif-conjonctions, g.pour-sans-infinitive], vocab: [w.s-égarer, w.dédale] }
      - { es: "Où débouche ce passage ? — Sur la rue du Bœuf.", en: "Where does this passage come out? — On rue du Bœuf.", altEs: ["Ce passage débouche où ? — Sur la rue du Bœuf.", "Où est-ce que ce passage débouche ? — Sur la rue du Bœuf."], grammar: [g.question-words], vocab: [w.passage, w.déboucher] }
      - { es: "Allume ta lampe pour qu'on voie les marches dans ce recoin.", en: "Turn on your torch so that we can see the steps in this nook.", altEs: ["Allume ta lampe pour que nous voyions les marches dans ce recoin.", "Allume ta lampe afin qu'on voie les marches dans ce recoin."], altEn: ["Switch on your torch so we can see the steps in this corner."], grammar: [g.subjonctif-conjonctions], vocab: [w.recoin] }
      - { es: "Je ne veux pas partir sans que tu voies la cour de la Tour Rose.", en: "I don't want to leave without you seeing the courtyard of the Tour Rose.", altEs: ["Je ne veux pas partir avant que tu voies la cour de la Tour Rose."], grammar: [g.subjonctif-conjonctions], vocab: [w.sans-que] }
      - { es: "Les pavés sont glissants quand il pleut : mets de bonnes chaussures pour ne pas tomber.", en: "The cobblestones are slippery when it rains: wear good shoes so you don't fall.", altEs: ["Les pavés sont glissants quand il pleut, mets de bonnes chaussures pour ne pas tomber."], grammar: [g.pour-sans-infinitive], vocab: [w.pavé] }
      - { es: "Sous la voûte, le guide baisse la voix pour que les habitants ne l'entendent pas.", en: "Under the arch, the guide lowers his voice so that the residents don't hear him.", altEs: ["Sous la voûte, le guide baisse la voix afin que les habitants ne l'entendent pas."], grammar: [g.subjonctif-conjonctions], vocab: [w.voûte] }
      - { es: "Cette ruelle est un vrai labyrinthe ; sans plan, on se sent vite égaré.", en: "This alley is a real maze; without a map, you soon feel lost.", altEs: ["Cette ruelle est un vrai labyrinthe : sans plan, on se sent vite égaré."], grammar: [g.pour-sans-infinitive], vocab: [w.ruelle, w.labyrinthe, w.égaré] }
      - { es: "Il y a un passage souterrain sous la place, mais il est fermé au public.", en: "There's an underground passage under the square, but it's closed to the public.", altEs: ["Sous la place, il y a un passage souterrain, mais il est fermé au public."], grammar: [g.il-y-a], vocab: [w.souterrain, w.passage] }
    exchanges:
      - q: { es: "Tu me fais un plan ? J'ai peur de me perdre.", en: "Will you draw me a map? I'm afraid of getting lost." }
        a: { es: "Bien sûr, je te le dessine pour que tu trouves la traboule facilement.", en: "Of course, I'll draw it for you so that you find the traboule easily." }
        alt: ["Je t'envoie l'itinéraire pour que tu ne te perdes pas.", "Pas besoin : suis les repères et tu ne t'égareras pas."]
        grammar: [g.subjonctif-conjonctions]
        vocab: [w.pour-que, w.traboule]
      - q: { es: "Pourquoi le guide parle-t-il si bas ?", en: "Why is the guide speaking so quietly?" }
        a: { es: "Pour que les habitants ne soient pas dérangés.", en: "So that the residents aren't disturbed." }
        alt: ["Pour ne pas déranger les habitants.", "Afin que les habitants ne l'entendent pas."]
        grammar: [g.subjonctif-conjonctions]
        vocab: [w.pour-que]
      - q: { es: "Comment on sort de ce dédale ?", en: "How do we get out of this maze?" }
        a: { es: "Suis le couloir de gauche : il débouche sur la rue Saint-Jean.", en: "Follow the corridor on the left: it comes out on rue Saint-Jean." }
        alt: ["Par le couloir de gauche.", "Suis-moi, je connais un passage."]
        grammar: [g.imperative]
        vocab: [w.dédale, w.couloir, w.déboucher]
      - q: { es: "Pourquoi tu photographies chaque porte ?", en: "Why are you photographing every door?" }
        a: { es: "Pour me repérer : ce soir, je veux revenir sans que tu m'accompagnes.", en: "To find my way: tonight I want to come back without you coming with me." }
        alt: ["Pour pouvoir retrouver le chemin ce soir.", "Pour mémoriser l'itinéraire."]
        grammar: [g.subjonctif-conjonctions]
        vocab: [w.se-repérer, w.sans-que]
      - q: { es: "Le souterrain est ouvert au public ?", en: "Is the underground passage open to the public?" }
        a: { es: "Non, il est fermé pour que personne ne s'y égare.", en: "No, it's closed so that nobody gets lost in it." }
        alt: ["Non, il est fermé au public.", "Seulement avec un guide-conférencier."]
        grammar: [g.subjonctif-conjonctions]
        vocab: [w.souterrain.n, w.s-égarer]
    texts:
      - title: "Message de Manon"
        es: ["Je t'attends devant la cathédrale Saint-Jean à dix heures.", "Je t'ai envoyé l'itinéraire pour que tu ne te perdes pas.", "Prends la deuxième ruelle à gauche, puis passe sous la voûte."]
        en: ["I'll wait for you in front of Saint-Jean cathedral at ten.", "I've sent you the route so that you don't get lost.", "Take the second alley on the left, then go under the arch."]
        grammar: [g.subjonctif-conjonctions]
        vocab: [w.itinéraire, w.ruelle, w.voûte]
      - title: "Conseils du guide"
        es: ["Dans les traboules, on se repère mal : restez ensemble.", "Je m'arrêterai à chaque cour afin que tout le monde puisse me rejoindre.", "Et ne partez pas sans que je vous aie donné le plan du quartier !"]
        en: ["In the traboules it's hard to find your way: stay together.", "I'll stop at each courtyard so that everyone can catch up with me.", "And don't leave without my giving you the map of the district!"]
        grammar: [g.subjonctif-conjonctions]
        vocab: [w.se-repérer, w.afin-que, w.sans-que]
    spicy:
      - { es: "Je te prends la main pour que tu ne te perdes pas… et pas du tout parce que j'en ai envie.", en: "I'm taking your hand so you don't get lost… and not at all because I want to.", altEs: ["Je te prends la main afin que tu ne te perdes pas… et pas du tout parce que j'en ai envie."], grammar: [g.subjonctif-conjonctions], vocab: [w.pour-que] }
      - { es: "Je reste à côté de toi dans le couloir pour que tu n'aies pas peur. Moi, je n'ai pas peur du tout.", en: "I'm staying next to you in the corridor so you won't be scared. Me, I'm not scared at all.", altEs: ["Je reste près de toi dans le couloir pour que tu n'aies pas peur. Moi, je n'ai pas peur du tout."], grammar: [g.subjonctif-conjonctions], vocab: [w.couloir] }
      - { es: "Je t'ai dessiné un plan de sorte que tu arrives directement chez moi.", en: "I've drawn you a map so that you end up right at my place.", altEs: ["Je t'ai dessiné un plan pour que tu arrives directement chez moi."], grammar: [g.subjonctif-conjonctions], vocab: [w.de-sorte-que] }
      - { es: "On s'égare dans le dédale ? Je connais un recoin parfait pour attendre que le groupe s'en aille.", en: "Shall we get lost in the maze? I know a perfect nook to wait in until the group has gone.", grammar: [g.subjonctif-conjonctions], vocab: [w.s-égarer, w.dédale, w.recoin] }
      - { es: "Mémorise bien l'itinéraire : je veux que tu reviennes sans que j'aie besoin de t'inviter.", en: "Memorise the route well: I want you to come back without my needing to invite you.", grammar: [g.subjonctif-conjonctions, g.subjonctif-volonte], vocab: [w.mémoriser, w.itinéraire, w.sans-que] }
  - id: b2.u01.l2
    title: Bien que ce soit touristique
    teach: [g.subjonctif-conjonctions]
    tip: "Concession and condition also take the subjonctif: bien que, quoique, à condition que, pourvu que, jusqu'à ce que. But même si takes the indicative: même s'il pleut."
    vocab: [w.quoique, w.à-condition-de, w.condition, w.avoir-beau, w.accès, w.privé, w.résident, w.discrétion, w.discret, w.respect, w.gêne, w.nuisance, w.tolérer, w.cohabiter, w.fréquentation, w.afflux, w.surtourisme, w.insolite, w.pittoresque, w.emblématique, w.incontournable, w.méconnu, w.réputé]
    sentences:
      - { es: "Bien que le Vieux-Lyon soit très touristique, des gens y vivent toute l'année.", en: "Although Vieux-Lyon is very touristy, people live there all year round.", altEs: ["Quoique le Vieux-Lyon soit très touristique, des gens y vivent toute l'année.", "Même si le Vieux-Lyon est très touristique, des gens y vivent toute l'année."], grammar: [g.subjonctif-conjonctions], vocab: [w.quoique], error: { wrong: "Bien que le Vieux-Lyon est très touristique, des gens y vivent toute l'année.", explain: "bien que always takes the subjonctif: bien qu'il soit, not est.", grammar: g.subjonctif-conjonctions } }
      - { es: "La plupart des traboules sont privées : on y entre à condition de respecter le calme des résidents.", en: "Most traboules are private: you can go in provided you respect the residents' peace and quiet.", altEs: ["La plupart des traboules sont privées, on y entre à condition de respecter le calme des résidents."], grammar: [g.subjonctif-conjonctions], vocab: [w.privé, w.à-condition-de, w.résident] }
      - { es: "Les habitants tolèrent les visiteurs, à condition qu'ils restent discrets.", en: "The residents put up with the visitors, provided they stay discreet.", altEs: ["Les habitants tolèrent les visiteurs, pourvu qu'ils restent discrets.", "Les habitants tolèrent les visiteurs à condition qu'ils restent discrets."], grammar: [g.subjonctif-conjonctions], vocab: [w.tolérer, w.discret, w.condition] }
      - { es: "Quoique cette traboule soit méconnue, c'est la plus pittoresque du quartier.", en: "Although this traboule is little-known, it's the most picturesque in the district.", altEs: ["Bien que cette traboule soit méconnue, c'est la plus pittoresque du quartier."], grammar: [g.subjonctif-conjonctions, g.superlatives], vocab: [w.quoique, w.méconnu, w.pittoresque] }
      - { es: "J'ai beau expliquer aux touristes que c'est privé, ils entrent quand même.", en: "However often I explain to the tourists that it's private, they come in anyway.", altEs: ["J'ai beau dire aux touristes que c'est privé, ils entrent quand même."], altEn: ["No matter how often I tell the tourists it's private, they come in anyway."], grammar: [g.subjonctif-conjonctions], vocab: [w.avoir-beau, w.privé], note: "avoir beau + infinitive = however much / in vain." }
      - { es: "L'afflux de visiteurs crée des nuisances, si bien que certains habitants ont fermé leur porte.", en: "The influx of visitors causes disturbances, so some residents have closed their doors.", altEs: ["L'afflux de visiteurs crée des nuisances, de sorte que certains habitants ont fermé leur porte."], grammar: [g.subjonctif-conjonctions, g.connectors-cause-consequence], vocab: [w.afflux, w.nuisance], note: "si bien que (result) takes the indicative." }
      - { es: "Pour que touristes et habitants puissent cohabiter, la mairie a passé des accords avec les propriétaires.", en: "So that tourists and residents can live side by side, the city council has made agreements with the owners.", altEs: ["Afin que touristes et habitants puissent cohabiter, la mairie a passé des accords avec les propriétaires."], grammar: [g.subjonctif-conjonctions], vocab: [w.cohabiter] }
      - { es: "Pourvu que la fréquentation reste raisonnable, les résidents acceptent les visites.", en: "As long as visitor numbers stay reasonable, the residents accept the tours.", altEs: ["À condition que la fréquentation reste raisonnable, les résidents acceptent les visites."], grammar: [g.subjonctif-conjonctions], vocab: [w.fréquentation, w.résident] }
      - { es: "Le surtourisme est un vrai problème, même si le quartier vit en partie grâce aux visiteurs.", en: "Overtourism is a real problem, even if the district partly lives off visitors.", grammar: [g.subjonctif-conjonctions], vocab: [w.surtourisme], transform: { instruction: "Replace 'même si' with 'bien que'", answer: "Le surtourisme est un vrai problème, bien que le quartier vive en partie grâce aux visiteurs.", alt: ["Le surtourisme est un vrai problème, quoique le quartier vive en partie grâce aux visiteurs."], en: "Overtourism is a real problem, although the district partly lives off visitors." } }
      - { es: "Bien qu'elle soit très réputée, la Tour Rose reste un lieu calme le matin.", en: "Although it's very famous, the Tour Rose remains a quiet spot in the morning.", altEs: ["Quoiqu'elle soit très réputée, la Tour Rose reste un lieu calme le matin."], grammar: [g.subjonctif-conjonctions], vocab: [w.réputé] }
      - { es: "Qu'est-ce qui est incontournable dans le Vieux-Lyon ? — La cathédrale et les traboules, bien sûr.", en: "What's unmissable in Vieux-Lyon? — The cathedral and the traboules, of course.", altEs: ["Qu'est-ce qu'il ne faut pas rater dans le Vieux-Lyon ? — La cathédrale et les traboules, bien sûr."], grammar: [g.ce-qui-ce-que], vocab: [w.incontournable] }
      - { es: "Les résidents demandent qu'on limite l'accès aux traboules le soir, pour qu'ils puissent dormir tranquilles.", en: "The residents are asking for access to the traboules to be limited in the evening, so that they can sleep in peace.", grammar: [g.subjonctif-conjonctions, g.subjonctif-volonte], vocab: [w.accès, w.résident] }
      - { es: "Je trouve ce passage insolite, quoiqu'un peu sombre.", en: "I find this passage unusual, though a little dark.", altEs: ["Je trouve ce passage insolite, bien qu'un peu sombre."], grammar: [g.subjonctif-conjonctions], vocab: [w.insolite, w.quoique], note: "bien que / quoique can be followed directly by an adjective." }
      - { es: "La gêne est réelle pour les habitants, bien que la plupart des visiteurs soient polis.", en: "The disturbance is real for the residents, although most visitors are polite.", altEs: ["La gêne est réelle pour les habitants, quoique la plupart des visiteurs soient polis."], grammar: [g.subjonctif-conjonctions], vocab: [w.gêne] }
      - { es: "Faites preuve de discrétion : ici, des gens vivent et travaillent.", en: "Please be discreet: people live and work here.", altEs: ["Faites preuve de discrétion, ici des gens vivent et travaillent."], grammar: [g.imperative], vocab: [w.discrétion] }
      - { es: "La cathédrale Saint-Jean est le monument emblématique du quartier, et on y entre en silence, par respect.", en: "Saint-Jean cathedral is the iconic monument of the district, and people go in silently, out of respect.", grammar: [g.pronoun-y], vocab: [w.emblématique, w.respect] }
    exchanges:
      - q: { es: "On a le droit d'entrer dans cette cour ?", en: "Are we allowed to go into this courtyard?" }
        a: { es: "Oui, à condition de ne pas faire de bruit.", en: "Yes, provided we don't make any noise." }
        alt: ["Oui, pourvu qu'on reste discrets.", "Oui, mais c'est un lieu privé : soyez discrets."]
        grammar: [g.subjonctif-conjonctions]
        vocab: [w.à-condition-de]
      - q: { es: "Tu as aimé la visite ?", en: "Did you like the tour?" }
        a: { es: "Beaucoup, bien qu'il y ait trop de monde le samedi.", en: "A lot, although there are too many people on Saturdays." }
        alt: ["Oui, quoique ce soit un peu touristique.", "Oui, même s'il y avait du monde."]
        grammar: [g.subjonctif-conjonctions]
        vocab: [w.quoique]
      - q: { es: "Les habitants supportent les touristes ?", en: "Do the residents put up with the tourists?" }
        a: { es: "Ils les tolèrent, à condition qu'ils respectent le calme.", en: "They tolerate them, provided they respect the peace and quiet." }
        alt: ["Plus ou moins : le surtourisme crée des nuisances.", "Oui, pourvu qu'ils soient discrets."]
        grammar: [g.subjonctif-conjonctions]
        vocab: [w.tolérer, w.surtourisme, w.nuisance]
      - q: { es: "C'est un endroit connu ?", en: "Is it a well-known place?" }
        a: { es: "Non, c'est assez méconnu, bien que ce soit très pittoresque.", en: "No, it's quite little-known, although it's very picturesque." }
        alt: ["Pas vraiment, c'est un lieu méconnu.", "Non, mais c'est incontournable."]
        grammar: [g.subjonctif-conjonctions]
        vocab: [w.méconnu, w.pittoresque]
      - q: { es: "Tu as trouvé la traboule ?", en: "Have you found the traboule?" }
        a: { es: "J'ai beau chercher, je ne la trouve pas !", en: "However hard I look, I can't find it!" }
        alt: ["Non, j'ai beau chercher, rien.", "Oui, enfin !"]
        grammar: [g.negation-ne-pas]
        vocab: [w.avoir-beau]
    texts:
      - title: "Panneau dans une cour"
        es: ["Vous entrez dans une propriété privée.", "La visite est libre, à condition que vous respectiez le calme des résidents.", "Merci de votre discrétion."]
        en: ["You are entering private property.", "Visiting is free, provided you respect the residents' peace and quiet.", "Thank you for your discretion."]
        grammar: [g.subjonctif-conjonctions]
        vocab: [w.privé, w.résident, w.discrétion]
      - title: "Courrier d'un habitant"
        es: ["J'habite le Vieux-Lyon depuis trente ans.", "Bien que j'aime mon quartier, l'afflux de touristes devient difficile à tolérer.", "Je ne demande pas qu'on ferme les traboules, mais qu'on respecte ceux qui y vivent."]
        en: ["I've lived in Vieux-Lyon for thirty years.", "Although I love my district, the influx of tourists is becoming hard to put up with.", "I'm not asking for the traboules to be closed, but for the people who live there to be respected."]
        grammar: [g.subjonctif-conjonctions, g.subjonctif-volonte]
        vocab: [w.afflux, w.tolérer]
    spicy:
      - { es: "Bien que tu sois toujours en retard, je t'attends toujours avec plaisir.", en: "Although you're always late, I always wait for you with pleasure.", altEs: ["Quoique tu sois toujours en retard, je t'attends toujours avec plaisir."], grammar: [g.subjonctif-conjonctions], vocab: [w.quoique] }
      - { es: "Tu peux rester dormir, à condition que tu fasses le petit-déjeuner.", en: "You can stay the night, provided you make breakfast.", altEs: ["Tu peux rester dormir, pourvu que tu fasses le petit-déjeuner."], grammar: [g.subjonctif-conjonctions], vocab: [w.condition] }
      - { es: "J'ai beau faire semblant de regarder la voûte, c'est toi que je regarde.", en: "However much I pretend to look at the arch, it's you I'm looking at.", grammar: [g.subjonctif-conjonctions], vocab: [w.avoir-beau, w.voûte] }
      - { es: "Quoique tu sois très discret, j'ai remarqué que tu me regardes depuis le début de la visite.", en: "Although you're very discreet, I've noticed you've been looking at me since the start of the tour.", altEs: ["Quoique tu sois très discrète, j'ai remarqué que tu me regardes depuis le début de la visite."], grammar: [g.subjonctif-conjonctions], vocab: [w.quoique, w.discret] }
      - { es: "Je te montre ma traboule préférée, pourvu que tu ne la montres à personne.", en: "I'll show you my favourite traboule, as long as you don't show it to anyone.", altEs: ["Je te montre ma traboule préférée, à condition que tu ne la montres à personne."], grammar: [g.subjonctif-conjonctions], vocab: [w.traboule] }
  - id: b2.u01.l3
    title: Avant qu'il ne pleuve
    teach: [g.ne-expletif]
    tip: "After avant que, à moins que, de peur que and in comparisons, careful French adds a ne that is NOT negative: avant qu'il ne pleuve = before it rains. In speech you can leave it out."
    vocab: [w.avant-que, w.à-moins-que, w.de-peur-que, w.de-crainte-que, w.crainte, w.abri, w.cacher, w.se-cacher, w.caché, w.obscur, w.canut, w.tissu, w.tisser, w.ouvrier, w.révolte, w.transporter, w.soierie, w.suspendre, w.débouché]
    sentences:
      - { es: "Les canuts transportaient leurs tissus par les traboules, de peur que la pluie ne les abîme.", en: "The silk workers carried their cloth through the traboules for fear the rain would damage it.", altEs: ["Les canuts transportaient leurs tissus par les traboules, de crainte que la pluie ne les abîme.", "Les canuts transportaient leurs tissus par les traboules, de peur que la pluie les abîme."], grammar: [g.ne-expletif, g.subjonctif-conjonctions], vocab: [w.canut, w.transporter, w.tissu, w.de-peur-que] }
      - { es: "Dépêchons-nous de visiter la Croix-Rousse avant qu'il ne pleuve.", en: "Let's hurry up and visit the Croix-Rousse before it rains.", altEs: ["Dépêchons-nous de visiter la Croix-Rousse avant qu'il pleuve."], grammar: [g.ne-expletif], vocab: [w.avant-que], transform: { instruction: "Drop the ne explétif, as in everyday speech", answer: "Dépêchons-nous de visiter la Croix-Rousse avant qu'il pleuve.", en: "Let's hurry up and visit the Croix-Rousse before it rains." } }
      - { es: "On visitera l'atelier de soierie demain, à moins qu'il ne soit fermé.", en: "We'll visit the silk workshop tomorrow, unless it's closed.", altEs: ["On visitera l'atelier de soierie demain, à moins qu'il soit fermé.", "Nous visiterons l'atelier de soierie demain, à moins qu'il ne soit fermé."], grammar: [g.ne-expletif], vocab: [w.soierie, w.à-moins-que], error: { wrong: "On visitera l'atelier de soierie demain, à moins qu'il n'est fermé.", explain: "à moins que takes the subjonctif: qu'il ne soit fermé.", grammar: g.subjonctif-conjonctions } }
      - { es: "Pendant la révolte de 1831, les canuts ont tenu la ville quelques jours avant que l'armée ne la reprenne.", en: "During the 1831 revolt, the silk workers held the city for a few days before the army took it back.", altEs: ["Pendant la révolte de 1831, les canuts ont tenu la ville quelques jours avant que l'armée la reprenne."], grammar: [g.ne-expletif], vocab: [w.révolte, w.canut] }
      - { es: "Le guide craint que le groupe ne soit trop grand pour l'atelier.", en: "The guide is afraid the group is too big for the workshop.", altEs: ["Le guide craint que le groupe soit trop grand pour l'atelier.", "Le guide a peur que le groupe ne soit trop grand pour l'atelier."], grammar: [g.ne-expletif, g.subjonctif-emotion], vocab: [] }
      - { es: "J'ai peur que le guide ne vienne pas : il est déjà dix heures et quart.", en: "I'm afraid the guide isn't coming: it's already quarter past ten.", altEs: ["J'ai peur que le guide ne vienne pas, il est déjà dix heures et quart."], grammar: [g.ne-expletif, g.subjonctif-emotion], vocab: [], note: "With pas it's a real negative: j'ai peur qu'il ne vienne pas = I'm afraid he won't come." }
      - { es: "Dans ce passage obscur, je tiens la main de ma fille de peur qu'elle ne tombe.", en: "In this dark passage, I hold my daughter's hand for fear she might fall.", altEs: ["Dans ce passage obscur, je tiens la main de ma fille de crainte qu'elle ne tombe.", "Dans ce passage obscur, je tiens la main de ma fille de peur qu'elle tombe."], grammar: [g.ne-expletif], vocab: [w.obscur, w.de-peur-que] }
      - { es: "On raconte que les canuts cachaient des messages dans le tissu, de crainte que la police ne les découvre.", en: "People say the silk workers hid messages in the cloth, for fear the police would discover them.", altEs: ["On raconte que les canuts cachaient des messages dans le tissu, de peur que la police ne les découvre."], grammar: [g.ne-expletif], vocab: [w.cacher, w.tissu, w.de-crainte-que] }
      - { es: "Ici, on se mettait à l'abri avant que l'orage n'arrive.", en: "People took shelter here before the storm arrived.", altEs: ["Ici, on se mettait à l'abri avant que l'orage arrive."], grammar: [g.ne-expletif, g.imparfait-uses], vocab: [w.abri] }
      - { es: "Ma grand-mère tissait la soie à la Croix-Rousse avant que les ateliers ne ferment.", en: "My grandmother wove silk in the Croix-Rousse before the workshops closed.", altEs: ["Ma grand-mère tissait la soie à la Croix-Rousse avant que les ateliers ferment."], grammar: [g.ne-expletif, g.imparfait-uses], vocab: [w.tisser, w.ouvrier] }
      - { es: "La visite est suspendue jusqu'à ce que la pluie s'arrête.", en: "The tour is suspended until the rain stops.", altEs: ["La visite est interrompue jusqu'à ce que la pluie s'arrête."], grammar: [g.subjonctif-conjonctions], vocab: [w.suspendre], note: "No ne explétif after jusqu'à ce que." }
      - { es: "La soie lyonnaise trouvait des débouchés dans toute l'Europe, avant que la concurrence ne devienne trop forte.", en: "Lyon silk found markets all over Europe, before competition became too strong.", altEs: ["La soie de Lyon trouvait des débouchés dans toute l'Europe, avant que la concurrence ne devienne trop forte."], grammar: [g.ne-expletif], vocab: [w.débouché] }
      - { es: "La Croix-Rousse ? C'est plus haut que je ne pensais !", en: "The Croix-Rousse? It's higher up than I thought!", altEs: ["La Croix-Rousse ? C'est plus haut que je pensais !", "La Croix-Rousse ? C'est plus haut que je ne le pensais !", "La Croix-Rousse ? C'est plus haut que je le pensais !"], grammar: [g.ne-expletif, g.comparatives], vocab: [], error: { wrong: "La Croix-Rousse ? C'est plus haut que je ne pensais pas !", explain: "The ne explétif is not a negative: no pas after it.", grammar: g.ne-expletif } }
      - { es: "Il y a une cour cachée au bout de ce couloir ; peu de touristes la connaissent.", en: "There's a hidden courtyard at the end of this corridor; few tourists know about it.", altEs: ["Au bout de ce couloir, il y a une cour cachée ; peu de touristes la connaissent."], grammar: [g.il-y-a], vocab: [w.caché] }
      - { es: "On dit que les ouvriers se cachaient dans les traboules pour que les soldats ne les trouvent pas.", en: "People say the workers hid in the traboules so that the soldiers wouldn't find them.", altEs: ["On dit que les ouvriers se cachaient dans les traboules afin que les soldats ne les trouvent pas."], grammar: [g.subjonctif-conjonctions], vocab: [w.se-cacher, w.ouvrier], note: "pour que … ne … pas is a real negative." }
      - { es: "Ne partez pas sans votre veste, à moins que vous ne vouliez avoir froid.", en: "Don't leave without your jacket, unless you want to be cold.", altEs: ["Ne partez pas sans votre veste, à moins que vous vouliez avoir froid."], grammar: [g.ne-expletif], vocab: [w.à-moins-que] }
    exchanges:
      - q: { es: "On y va maintenant ?", en: "Shall we go now?" }
        a: { es: "Oui, partons avant qu'il ne commence à pleuvoir.", en: "Yes, let's go before it starts raining." }
        alt: ["Oui, avant qu'il pleuve.", "Attendons un peu, à moins que tu ne sois pressé."]
        grammar: [g.ne-expletif]
        vocab: [w.avant-que]
      - q: { es: "Pourquoi les canuts passaient-ils par les traboules ?", en: "Why did the silk workers go through the traboules?" }
        a: { es: "Pour transporter leurs tissus à l'abri, de peur que la pluie ne les abîme.", en: "To carry their cloth under cover, for fear the rain would damage it." }
        alt: ["Pour protéger la soie de la pluie.", "Pour rester à l'abri avec leurs tissus."]
        grammar: [g.ne-expletif]
        vocab: [w.canut, w.transporter, w.abri]
      - q: { es: "On peut visiter un atelier de soierie ?", en: "Can we visit a silk workshop?" }
        a: { es: "Oui, à moins qu'il ne soit complet ce week-end.", en: "Yes, unless it's fully booked this weekend." }
        alt: ["Oui, à condition de réserver.", "Oui, mais il faut réserver avant qu'il ne soit complet."]
        grammar: [g.ne-expletif]
        vocab: [w.soierie, w.à-moins-que]
      - q: { es: "Tu as peur de quoi ?", en: "What are you afraid of?" }
        a: { es: "J'ai peur que le dernier métro ne soit déjà parti.", en: "I'm afraid the last metro has already gone." }
        alt: ["Que le dernier métro soit parti.", "De rater le dernier métro."]
        grammar: [g.ne-expletif, g.subjonctif-passe]
        vocab: []
      - q: { es: "Elle était comment, la visite ?", en: "What was the tour like?" }
        a: { es: "Plus longue que je ne pensais, mais passionnante.", en: "Longer than I thought, but fascinating." }
        alt: ["Plus longue que prévu, mais passionnante.", "Passionnante !"]
        grammar: [g.ne-expletif, g.comparatives]
        vocab: []
    texts:
      - title: "Note du guide"
        es: ["Ici vivaient et travaillaient les canuts.", "En 1831, ils se sont révoltés pour défendre leurs salaires.", "Leur devise : « Vivre en travaillant ou mourir en combattant »."]
        en: ["The silk workers lived and worked here.", "In 1831 they revolted to defend their wages.", "Their motto: 'Live working or die fighting'."]
        grammar: [g.gerondif]
        vocab: [w.canut, w.révolte]
      - title: "Message de Karim"
        es: ["Le guide a un peu de retard.", "Mettez-vous à l'abri sous la voûte avant qu'il ne pleuve.", "On commence dès qu'il arrive, à moins qu'il ne soit vraiment trop tard."]
        en: ["The guide is running a bit late.", "Take shelter under the arch before it rains.", "We'll start as soon as he arrives, unless it's really too late."]
        grammar: [g.ne-expletif]
        vocab: [w.abri, w.avant-que, w.à-moins-que]
    spicy:
      - { es: "Embrasse-moi vite, avant que le groupe ne nous remarque.", en: "Kiss me quickly, before the group notices us.", altEs: ["Embrasse-moi vite, avant que le groupe nous remarque."], grammar: [g.ne-expletif], vocab: [w.avant-que] }
      - { es: "Je garde ta main dans la mienne, de peur que tu ne t'égares… ou que tu ne partes avec le guide.", en: "I'm keeping your hand in mine, for fear you get lost… or run off with the guide.", grammar: [g.ne-expletif], vocab: [w.de-peur-que, w.s-égarer] }
      - { es: "On se cache dans la cour, à moins que tu ne préfères écouter l'histoire de la soie pendant deux heures.", en: "Let's hide in the courtyard, unless you'd rather listen to the history of silk for two hours.", grammar: [g.ne-expletif], vocab: [w.se-cacher, w.à-moins-que] }
      - { es: "Tu es encore plus charmant que je ne l'imaginais.", en: "You're even more charming than I imagined.", altEs: ["Tu es encore plus charmante que je ne l'imaginais.", "Tu es encore plus charmant que je l'imaginais."], grammar: [g.ne-expletif, g.comparatives], vocab: [] }
      - { es: "Rentre avant qu'il ne pleuve… ou reste chez moi jusqu'à ce que ça s'arrête.", en: "Go home before it rains… or stay at my place until it stops.", grammar: [g.ne-expletif, g.subjonctif-conjonctions], vocab: [w.avant-que] }
  - id: b2.u01.l4
    title: Bien que les canuts aient disparu
    teach: [g.subjonctif-passe]
    tip: "For an action already completed, use the past subjonctif: que j'aie fini, qu'elle soit partie. Je suis content que tu sois venu = you came."
    vocab: [w.historique, w.classé, w.inscrit, w.authentique, w.renaissance, w.gothique, w.copieux, w.repas, w.tablier-de-sapeur, w.tablier, w.sapeur-pompier, w.pompier, w.imiter]
    sentences:
      - { es: "Je suis ravi que vous ayez aimé la visite des traboules.", en: "I'm delighted you enjoyed the traboule tour.", altEs: ["Je suis ravie que vous ayez aimé la visite des traboules.", "Je suis très content que vous ayez aimé la visite des traboules."], grammar: [g.subjonctif-passe, g.subjonctif-emotion], vocab: [] }
      - { es: "Bien que les canuts aient disparu, la Croix-Rousse garde leur mémoire.", en: "Although the silk workers have gone, the Croix-Rousse keeps their memory alive.", altEs: ["Quoique les canuts aient disparu, la Croix-Rousse garde leur mémoire."], grammar: [g.subjonctif-passe, g.subjonctif-conjonctions], vocab: [w.canut], error: { wrong: "Bien que les canuts ont disparu, la Croix-Rousse garde leur mémoire.", explain: "bien que + subjonctif: aient disparu, not ont disparu.", grammar: g.subjonctif-passe } }
      - { es: "Le site historique de Lyon est inscrit au patrimoine mondial de l'UNESCO depuis 1998.", en: "The historic site of Lyon has been on UNESCO's World Heritage list since 1998.", altEs: ["Depuis 1998, le site historique de Lyon est inscrit au patrimoine mondial de l'UNESCO."], grammar: [g.depuis-present], vocab: [w.historique, w.inscrit] }
      - { es: "C'est le repas le plus copieux que j'aie jamais mangé !", en: "It's the most filling meal I've ever eaten!", altEs: ["C'est le repas le plus copieux que j'ai jamais mangé !"], grammar: [g.subjonctif-passe, g.subjonctif-relatives], vocab: [w.repas, w.copieux], transform: { instruction: "Change 'je' to 'nous'", answer: "C'est le repas le plus copieux que nous ayons jamais mangé !", alt: ["C'est le repas le plus copieux qu'on ait jamais mangé !"], en: "It's the most filling meal we've ever eaten!" } }
      - { es: "Je ne crois pas que le guide ait dit la vérité sur ce souterrain.", en: "I don't think the guide told the truth about that underground passage.", altEs: ["Je ne pense pas que le guide ait dit la vérité sur ce souterrain."], grammar: [g.subjonctif-passe, g.opinion-mood], vocab: [w.souterrain.n] }
      - { es: "On dit que le tablier de sapeur doit son nom au tablier de cuir que portaient les sapeurs.", en: "They say the tablier de sapeur owes its name to the leather apron the sappers used to wear.", grammar: [g.relative-qui-que], vocab: [w.tablier-de-sapeur, w.tablier] }
      - { es: "Il faut que vous ayez réservé avant vendredi, sinon le bouchon sera complet.", en: "You need to have booked before Friday, otherwise the bouchon will be full.", altEs: ["Il faut que vous ayez réservé avant vendredi, sinon le bouchon risque d'être complet."], grammar: [g.subjonctif-passe, g.subjonctif-necessite], vocab: [] }
      - { es: "Dommage que tu n'aies pas vu la cathédrale gothique de l'intérieur.", en: "Shame you didn't see the Gothic cathedral from the inside.", altEs: ["C'est dommage que tu n'aies pas vu la cathédrale gothique de l'intérieur."], grammar: [g.subjonctif-passe], vocab: [w.gothique] }
      - { es: "Bien que ces façades Renaissance aient été restaurées, elles restent authentiques.", en: "Although these Renaissance façades have been restored, they remain authentic.", altEs: ["Quoique ces façades Renaissance aient été restaurées, elles restent authentiques."], grammar: [g.subjonctif-passe, g.subjonctif-conjonctions], vocab: [w.renaissance, w.authentique] }
      - { es: "Les habitants sont fiers que leur quartier ait été classé.", en: "The residents are proud that their district has been listed.", altEs: ["Les habitants sont fiers que leur quartier soit classé."], grammar: [g.subjonctif-passe, g.subjonctif-emotion], vocab: [w.classé] }
      - { es: "Mon fils imite le guide depuis qu'on est rentrés : « Ici, mesdames et messieurs, vivaient les canuts… »", en: "My son has been imitating the guide since we got back: 'Here, ladies and gentlemen, lived the silk workers…'", grammar: [g.depuis-present], vocab: [w.imiter] }
      - { es: "Je regrette que nous n'ayons pas eu le temps de monter à Fourvière.", en: "I'm sorry we didn't have time to go up to Fourvière.", altEs: ["Je regrette qu'on n'ait pas eu le temps de monter à Fourvière."], grammar: [g.subjonctif-passe, g.subjonctif-emotion], vocab: [], transform: { instruction: "Change 'nous' to 'tu'", answer: "Je regrette que tu n'aies pas eu le temps de monter à Fourvière.", en: "I'm sorry you didn't have time to go up to Fourvière." } }
      - { es: "Mon oncle, qui est sapeur-pompier, est fier que ce plat porte presque le nom de son métier.", en: "My uncle, who is a firefighter, is proud that this dish almost bears the name of his job.", grammar: [g.subjonctif-emotion], vocab: [w.sapeur-pompier] }
      - { es: "Je suis surpris que tu aies fini ton assiette : c'était énorme !", en: "I'm surprised you finished your plate: it was huge!", altEs: ["Je suis surprise que tu aies fini ton assiette, c'était énorme !"], grammar: [g.subjonctif-passe, g.subjonctif-emotion], vocab: [] }
      - { es: "Heureusement que les pompiers sont arrivés vite, bien que la ruelle soit très étroite.", en: "Luckily the firefighters got there fast, although the alley is very narrow.", grammar: [g.subjonctif-conjonctions], vocab: [w.pompier, w.ruelle] }
      - { es: "Il est le seul serveur du bouchon qui ait goûté tous les plats de la carte.", en: "He's the only waiter in the bouchon who has tasted every dish on the menu.", altEs: ["C'est le seul serveur du bouchon qui ait goûté tous les plats de la carte."], grammar: [g.subjonctif-passe, g.subjonctif-relatives], vocab: [] }
    exchanges:
      - q: { es: "Vous avez aimé la visite ?", en: "Did you enjoy the tour?" }
        a: { es: "Beaucoup ! Je suis content qu'on ait pris un guide.", en: "Very much! I'm glad we took a guide." }
        alt: ["Oui, je suis ravie qu'on soit venus.", "Oui, c'était passionnant."]
        grammar: [g.subjonctif-passe]
        vocab: []
      - q: { es: "Tu as goûté le tablier de sapeur ?", en: "Did you try the tablier de sapeur?" }
        a: { es: "Oui, et c'est le plat le plus étonnant que j'aie jamais mangé.", en: "Yes, and it's the most surprising dish I've ever eaten." }
        alt: ["Oui, bien que j'aie eu un peu peur au début.", "Non, pas encore."]
        grammar: [g.subjonctif-passe, g.subjonctif-relatives]
        vocab: [w.tablier-de-sapeur]
      - q: { es: "Pourquoi le quartier est-il classé ?", en: "Why is the district listed?" }
        a: { es: "Parce que ses maisons Renaissance sont restées authentiques.", en: "Because its Renaissance houses have stayed authentic." }
        alt: ["Pour son patrimoine historique.", "Il est inscrit à l'UNESCO depuis 1998."]
        grammar: [g.passe-compose-etre]
        vocab: [w.classé, w.renaissance, w.authentique]
      - q: { es: "Il est déjà parti, le guide ?", en: "Has the guide already gone?" }
        a: { es: "Je crains qu'il ne soit parti il y a dix minutes.", en: "I'm afraid he left ten minutes ago." }
        alt: ["Oui, je crois qu'il est parti.", "Il me semble que oui."]
        grammar: [g.subjonctif-passe, g.ne-expletif]
        vocab: []
      - q: { es: "Tu es déçu de ne pas avoir vu Fourvière ?", en: "Are you disappointed not to have seen Fourvière?" }
        a: { es: "Un peu ; dommage qu'on n'ait pas eu le temps.", en: "A bit; shame we didn't have time." }
        alt: ["Un peu, mais on reviendra.", "Non, on ira demain."]
        grammar: [g.subjonctif-passe]
        vocab: []
    texts:
      - title: "Avis sur un bouchon"
        es: ["Repas copieux et authentique, servi sur des nappes à carreaux.", "Bien que nous n'ayons pas réservé, le patron nous a trouvé une table.", "C'est le meilleur tablier de sapeur que j'aie jamais goûté."]
        en: ["A hearty, authentic meal, served on checked tablecloths.", "Although we hadn't booked, the owner found us a table.", "It's the best tablier de sapeur I've ever tasted."]
        grammar: [g.subjonctif-passe]
        vocab: [w.repas, w.copieux, w.tablier-de-sapeur]
      - title: "Carte postale"
        es: ["Chère maman, je suis ravie que tu m'aies conseillé ce voyage.", "Le Vieux-Lyon est inscrit à l'UNESCO, et on comprend pourquoi.", "Dommage que tu ne sois pas venue avec moi !"]
        en: ["Dear Mum, I'm delighted you recommended this trip to me.", "Vieux-Lyon is on the UNESCO list, and you can see why.", "Shame you didn't come with me!"]
        grammar: [g.subjonctif-passe]
        vocab: [w.inscrit]
    spicy:
      - { es: "Je suis ravi que tu m'aies suivi dans cette traboule… même si on s'est perdus.", en: "I'm delighted you followed me into this traboule… even if we got lost.", altEs: ["Je suis ravie que tu m'aies suivie dans cette traboule… même si on s'est perdus."], grammar: [g.subjonctif-passe], vocab: [w.traboule] }
      - { es: "C'est le repas le plus copieux que j'aie jamais mangé, et le serveur le plus charmant que j'aie jamais vu.", en: "It's the most filling meal I've ever eaten, and the most charming waiter I've ever seen.", grammar: [g.subjonctif-passe, g.subjonctif-relatives], vocab: [w.repas, w.copieux] }
      - { es: "Bien que tu aies mangé tout le tablier de sapeur, je te trouve toujours aussi séduisant.", en: "Although you ate the whole tablier de sapeur, I still find you just as attractive.", altEs: ["Bien que tu aies mangé tout le tablier de sapeur, je te trouve toujours aussi séduisante."], grammar: [g.subjonctif-passe], vocab: [w.tablier-de-sapeur] }
      - { es: "Je doute que tu aies vraiment regardé les façades Renaissance : tu me regardais tout le temps.", en: "I doubt you really looked at the Renaissance façades: you were looking at me the whole time.", grammar: [g.subjonctif-passe, g.subjonctif-doute], vocab: [w.renaissance] }
      - { es: "Dommage que tu aies refusé le dessert : je l'aurais partagé avec toi.", en: "Shame you turned down dessert: I'd have shared it with you.", grammar: [g.subjonctif-passe, g.conditionnel-passe], vocab: [] }
dialogues:
  - id: b2.u01.d1
    title: Visite guidée des traboules
    context: "Bernard, a tour guide, takes Chloé and Hugo through the traboules of Vieux-Lyon."
    lines:
      - { speaker: Bernard, es: "Bienvenue dans le Vieux-Lyon ! Restez bien ensemble pour que personne ne s'égare.", en: "Welcome to Vieux-Lyon! Stay close together so that nobody gets lost." }
      - { speaker: Chloé, es: "On va vraiment traverser les immeubles ?", en: "Are we really going to go through the buildings?" }
      - { speaker: Bernard, es: "Oui, mais les traboules sont privées : vous pouvez entrer à condition de parler bas.", en: "Yes, but the traboules are private: you can go in provided you speak quietly." }
      - { speaker: Hugo, es: "Pourquoi est-ce qu'on les a construites ?", en: "Why were they built?" }
      - { speaker: Bernard, es: "D'abord pour descendre plus vite vers la Saône. Plus tard, les canuts de la Croix-Rousse transportaient leurs tissus par des passages semblables, de peur que la pluie ne les abîme.", en: "First, to get down to the Saône more quickly. Later, the silk workers of the Croix-Rousse carried their cloth through similar passages, for fear the rain would damage it." }
      - { speaker: Chloé, es: "Et cette porte, là ? Elle est fermée.", en: "And that door there? It's closed." }
      - { speaker: Bernard, es: "Oui, les habitants l'ont fermée, bien que la mairie les aide à entretenir le passage. Trop de bruit, trop de visiteurs.", en: "Yes, the residents closed it, even though the city council helps them maintain the passage. Too much noise, too many visitors." }
      - { speaker: Hugo, es: "Je les comprends. Mais dommage qu'on n'ait pas pu voir cette cour.", en: "I understand them. But it's a shame we couldn't see that courtyard." }
      - { speaker: Bernard, es: "Allons maintenant à la Tour Rose, avant qu'il n'y ait trop de monde. Suivez-moi sans faire de bruit.", en: "Let's go to the Tour Rose now, before there are too many people. Follow me without making any noise." }
      - { speaker: Chloé, es: "Oh ! C'est encore plus beau que je ne l'imaginais.", en: "Oh! It's even more beautiful than I imagined." }
    questions:
      - { q: "Pourquoi faut-il parler bas dans les traboules ?", options: ["Parce qu'elles sont privées et que des gens y habitent", "Parce que le guide est fatigué", "Parce que la visite est interdite"], answer: 0, explain: "Bernard says the traboules are private: you may go in « à condition de parler bas »." }
      - { q: "Selon Bernard, pourquoi les canuts utilisaient-ils ces passages ?", options: ["Pour cacher de l'argent", "Pour transporter leurs tissus à l'abri de la pluie", "Pour aller plus vite à l'église"], answer: 1, explain: "« de peur que la pluie ne les abîme »: to protect their cloth from the rain." }
      - { q: "Pourquoi la porte est-elle fermée ?", options: ["Parce qu'il pleut", "Parce que les habitants en ont assez du bruit et des visiteurs", "Parce que la mairie l'a interdit"], answer: 1, explain: "« Trop de bruit, trop de visiteurs »: the residents closed it." }
      - { q: "Que pense Chloé de la Tour Rose ?", options: ["C'est moins beau que prévu", "C'est plus beau qu'elle ne l'imaginait", "Il y a trop de monde"], answer: 1, explain: "« C'est encore plus beau que je ne l'imaginais »: the ne is explétif, not negative." }
writing:
  - task: "A friend is visiting Vieux-Lyon alone. Write instructions for exploring the traboules so that he or she doesn't get lost (pour que, avant que, à moins que, sans que + subjonctif)."
    min: 80
    max: 150
    use: [w.traboule, w.se-repérer, w.pour-que, w.sans-que, w.itinéraire]
    useAtLeast: 3
    grammar: [g.subjonctif-conjonctions]
    expect:
      - { pattern: "\\b(pour qu|afin qu|sans qu|avant qu|moins qu|bien qu|quoiqu|de sorte qu|de peur qu|de crainte qu|jusqu['’][aà] ce qu)", hint: "Use a conjunction + subjonctif: pour que tu ne te perdes pas, avant qu'il fasse nuit…" }
    model: { es: "Pour que tu ne te perdes pas dans le Vieux-Lyon, voici mon itinéraire. Commence par la rue Saint-Jean, avant que les groupes de touristes arrivent. Les traboules sont des passages entre les rues : pousse doucement la porte, sans que les habitants soient dérangés. Pour te repérer, suis les petites plaques de bronze sur les murs. À moins que tu sois très fatigué, monte ensuite à Fourvière par les escaliers. Je te prête mon plan afin que tu puisses trouver la longue traboule de la Tour Rose. Bonne promenade !", en: "So that you don't get lost in Vieux-Lyon, here's my route. Start with the rue Saint-Jean, before the tour groups arrive. The traboules are passageways between the streets: push the door gently, without the residents being disturbed. To find your way, follow the little bronze plaques on the walls. Unless you're very tired, then climb up to Fourvière by the stairs. I'm lending you my map so that you can find the long traboule of the Tour Rose. Have a nice walk!" }
  - task: "Write a formal letter to Lyon town hall about tourists in the traboules: acknowledge the advantages but express your concerns as a resident (bien que, quoique, à condition que)."
    min: 80
    max: 150
    use: [w.résident, w.nuisance, w.surtourisme, w.cohabiter, w.respect]
    useAtLeast: 3
    grammar: [g.subjonctif-conjonctions]
    expect:
      - { pattern: "\\b(bien qu|quoiqu|condition qu|pour qu|afin qu|sans qu|moins qu)", hint: "Use bien que / quoique / à condition que + subjonctif." }
      - { pattern: "\\b(madame|monsieur|veuillez|cordialement|salutations|je vous)\\b", hint: "Use a formal register: Madame, Monsieur, … je vous prie d'agréer…" }
    model: { es: "Madame, Monsieur, je suis résidente de la rue du Bœuf depuis quinze ans. Bien que les visites des traboules soient une richesse pour le quartier, la fréquentation devient difficile à supporter. Chaque jour, des groupes entrent dans notre cour, parlent fort et laissent des déchets. Je ne suis pas contre le tourisme, à condition que les visiteurs respectent notre calme. Quoique la mairie ait déjà installé quelques panneaux, les nuisances continuent. Je vous propose de limiter les heures de visite afin que les touristes et les habitants puissent cohabiter. Je vous remercie de votre attention et vous prie de recevoir, Madame, Monsieur, mes sentiments distingués.", en: "Dear Sir or Madam, I have lived in the rue du Bœuf for fifteen years. Although visits to the traboules are an asset for the neighbourhood, the number of visitors is becoming hard to bear. Every day, groups come into our courtyard, talk loudly and leave litter. I am not against tourism, provided that visitors respect our calm. Although the town hall has already put up a few signs, the nuisance continues. I suggest limiting visiting hours so that tourists and residents can live side by side. Thank you for your attention. Yours faithfully." }
  - task: "Plan an evening walk in Vieux-Lyon for your group and add warnings, using the ne explétif (avant qu'il ne pleuve, à moins que…, de peur que…)."
    min: 80
    max: 150
    use: [w.avant-que, w.à-moins-que, w.de-peur-que, w.abri, w.canut]
    useAtLeast: 3
    grammar: [g.ne-expletif, g.subjonctif-conjonctions]
    expect:
      - { pattern: "\\b(avant qu|moins qu|de peur qu|de crainte qu)[^.!?]{0,20}\\bn(e\\s|['’])", hint: "After avant que, à moins que, de peur que, add the ne explétif: avant qu'il ne pleuve." }
    model: { es: "Salut tout le monde ! Ce soir, on part de la place Saint-Jean à dix-huit heures, avant qu'il ne fasse nuit. La météo annonce de l'orage : il faut traverser les traboules avant qu'il ne pleuve, car elles sont un bon abri. Ensuite, on montera à la Croix-Rousse pour voir les maisons des canuts, à moins que vous ne soyez trop fatigués. Prenez une lampe, de peur que les passages ne soient trop sombres. Restez ensemble, de crainte que quelqu'un ne se perde. On finira dans un bouchon. À ce soir !", en: "Hi everyone! Tonight we're leaving from the place Saint-Jean at six, before it gets dark. The forecast says there'll be a storm: we need to go through the traboules before it rains, as they make a good shelter. Then we'll go up to the Croix-Rousse to see the silk workers' houses, unless you're too tired. Bring a torch, in case the passages are too dark. Stay together, in case anyone gets lost. We'll finish in a bouchon. See you tonight!" }
  - task: "Write about the history of the canuts, Lyon's silk workers, and how you feel about it today, using the past subjonctif (bien que les canuts aient disparu, je suis content(e) qu'on ait gardé…)."
    min: 80
    max: 150
    use: [w.canut, w.soierie, w.révolte, w.ouvrier, w.historique]
    useAtLeast: 3
    grammar: [g.subjonctif-passe]
    expect:
      - { pattern: "\\bqu(e\\s|['’])[^.!?]{0,30}\\b(aie|aies|ait|ayons|ayez|aient|sois|soit|soyons|soyez|soient) [a-zàâçéèêëîïôûùœ]+(é|ée|és|ées|i|ie|is|ies|u|ue|us|it|ert|eint|ort)(?![a-zàâçéèêëîïôûùœ])", hint: "Use the past subjonctif: que + avoir / être in the subjonctif + participle (bien qu'ils aient disparu)." }
    model: { es: "Au dix-neuvième siècle, des milliers de canuts travaillaient dans les ateliers de la Croix-Rousse. Ils fabriquaient la soierie la plus réputée d'Europe, mais leurs conditions de travail étaient très dures. En 1831, ces ouvriers ont mené une révolte historique. Bien que les canuts aient disparu depuis longtemps, leur histoire reste vivante. Je suis heureux qu'on ait gardé leurs grands immeubles aux hautes fenêtres. Je regrette pourtant que beaucoup d'ateliers soient devenus des appartements de luxe. Il est important que les jeunes Lyonnais aient appris cette histoire à l'école.", en: "In the nineteenth century, thousands of canuts worked in the workshops of the Croix-Rousse. They made the most famous silk in Europe, but their working conditions were very hard. In 1831 these workers led a historic revolt. Although the canuts disappeared long ago, their story is still alive. I'm glad their big buildings with tall windows have been kept. I'm sorry, though, that many workshops have become luxury flats. It's important that young people in Lyon have learnt this history at school." }
