id: r.c1.bordeaux-la-belle-endormie
level: c1
title: Bordeaux, la belle endormie s'est réveillée
kind: text
intro: "A magazine feature on Bordeaux, from its eighteenth-century golden age to its recent rebirth and the way it now faces the darker side of its past. Notice the passé simple in the historical paragraphs (fit, devint, s'endormit) and the passé composé when the article comes back to the present."
allow: [plantations, symbole, centimètres, bordeaux, bordelais, bordelaise, garonne, gironde, antilles, chartrons, juppé, testas, aquitaine, unesco, tgv, montesquieu]
paragraphs:
  - { es: "Quand on arrive à Bordeaux par le pont de pierre, la ville apparaît d'un seul coup, le long du fleuve : des kilomètres de façades blondes, toutes de la même hauteur, qui suivent la courbe de la Garonne. C'est cette courbe, en forme de croissant, qui a donné au port son surnom de « port de la Lune ». Il y a trente ans, pourtant, peu de visiteurs s'arrêtaient ici. Les quais étaient couverts de hangars et de parkings, les façades étaient noires de pollution, et l'on parlait de Bordeaux comme d'une « belle endormie ».", en: "When you arrive in Bordeaux over the stone bridge, the city appears all at once along the river: kilometres of pale golden façades, all the same height, following the curve of the Garonne. It is this crescent-shaped curve that gave the port its nickname, the 'port of the Moon'. Thirty years ago, however, few visitors stopped here. The quays were covered with warehouses and car parks, the façades were black with pollution, and people spoke of Bordeaux as a 'sleeping beauty'." }
  - { es: "Ce sommeil avait suivi un long âge d'or. Au XVIIIe siècle, Bordeaux devint l'un des premiers ports de France. Des centaines de navires partaient chaque année vers les Antilles et en revenaient chargés de sucre, de café et de cacao, que les négociants revendaient ensuite dans toute l'Europe, avec le vin de la région. Grâce à cette richesse, la ville se transforma : on abattit les vieux remparts, on traça de larges avenues, on construisit la place de la Bourse et le Grand-Théâtre. Les négociants, eux, firent bâtir dans le quartier des Chartrons de belles maisons au-dessus de leurs entrepôts.", en: "This sleep had followed a long golden age. In the eighteenth century Bordeaux became one of the leading ports of France. Hundreds of ships left every year for the West Indies and came back loaded with sugar, coffee and cocoa, which the merchants then resold all over Europe, along with the wine of the region. Thanks to this wealth the city was transformed: the old ramparts were pulled down, wide avenues were laid out, the Place de la Bourse and the Grand-Théâtre were built. The merchants, for their part, had fine houses built above their warehouses in the Chartrons district." }
  - { es: "Mais cette prospérité avait une face cachée. Une partie de la fortune bordelaise venait de la traite des Noirs : des navires armés à Bordeaux allaient acheter des captifs sur les côtes d'Afrique pour les vendre comme esclaves dans les plantations des Antilles. Au XVIIIe siècle, Bordeaux fut ainsi l'un des principaux ports négriers de France, derrière Nantes. Pendant longtemps, la ville préféra ne pas en parler ; on admirait les façades sans se demander comment elles avaient été payées.", en: "But this prosperity had a hidden side. Part of Bordeaux's fortune came from the slave trade: ships fitted out in Bordeaux went to buy captives on the coasts of Africa in order to sell them as slaves on the plantations of the West Indies. In the eighteenth century Bordeaux was thus one of the main slave-trading ports of France, after Nantes. For a long time the city preferred not to talk about it; people admired the façades without asking how they had been paid for." }
  - { es: "Au XXe siècle, les grands navires ne pouvaient plus remonter le fleuve jusqu'au centre, et le port s'installa plus près de l'océan. Les quais furent abandonnés aux voitures et aux entrepôts vides, et la ville s'endormit. Le réveil commença à la fin des années 1990. En quelques années, Bordeaux nettoya ses façades, créa un tramway, dont la première ligne fut mise en service en 2003, et transforma ses quais en une longue promenade où l'on se promène, court ou fait du vélo au bord de l'eau. En 2007, le port de la Lune fut inscrit au patrimoine mondial de l'UNESCO.", en: "In the twentieth century large ships could no longer sail up the river to the centre, and the port moved closer to the ocean. The quays were left to cars and empty warehouses, and the city fell asleep. The awakening began at the end of the 1990s. Within a few years Bordeaux cleaned its façades, created a tramway, whose first line came into service in 2003, and turned its quays into a long promenade where people walk, run or cycle by the water. In 2007 the Port of the Moon was added to the UNESCO World Heritage List." }
  - { es: "Le symbole de cette renaissance est sans doute le miroir d'eau, inauguré en 2006 face à la place de la Bourse. Il s'agit d'une immense dalle de granit, recouverte de seulement deux centimètres d'eau, dans laquelle se reflètent les façades du XVIIIe siècle. Régulièrement, un brouillard frais s'en élève, puis disparaît. Les jours de chaleur, les enfants y courent pieds nus, les touristes y prennent des photos et les Bordelais y viennent simplement pour regarder leur ville à l'envers.", en: "The symbol of this rebirth is undoubtedly the water mirror, opened in 2006 opposite the Place de la Bourse. It is a huge granite slab covered with just two centimetres of water, in which the eighteenth-century façades are reflected. At regular intervals a cool mist rises from it and then disappears. On hot days children run across it barefoot, tourists take photos and the people of Bordeaux come simply to look at their city upside down." }
  - { es: "Ce succès a eu son prix. Depuis l'arrivée du TGV, qui relie Paris à Bordeaux en un peu plus de deux heures depuis 2017, beaucoup de Parisiens se sont installés en Gironde, et les loyers du centre ont fortement augmenté. Certains habitants ont l'impression que leur ville est devenue trop chère pour eux. D'autres répondent qu'une ville vivante vaut mieux qu'une ville endormie, et que le défi consiste désormais à partager ce renouveau.", en: "This success has come at a price. Since the arrival of the high-speed train, which has linked Paris to Bordeaux in just over two hours since 2017, many Parisians have settled in the Gironde, and rents in the centre have risen sharply. Some residents feel their city has become too expensive for them. Others reply that a lively city is better than a sleeping one, and that the challenge now is to share this renewal." }
  - { es: "Le réveil a aussi été celui de la mémoire. Depuis 2009, le musée d'Aquitaine consacre plusieurs salles au commerce atlantique et à l'esclavage. En 2019, une statue de Modeste Testas, une femme africaine réduite en esclavage par deux négociants bordelais, a été installée sur les quais. Plus récemment, des plaques ont été posées dans certaines rues portant le nom de négriers, pour expliquer qui ils étaient. Bordeaux n'efface pas son passé : elle apprend à le regarder en face, comme on regarde ses façades dans le miroir d'eau.", en: "The awakening has also been one of memory. Since 2009 the Musée d'Aquitaine has devoted several rooms to the Atlantic trade and to slavery. In 2019 a statue of Modeste Testas, an African woman enslaved by two Bordeaux merchants, was put up on the quays. More recently, plaques have been placed in some streets that bear the names of slave traders, to explain who they were. Bordeaux is not erasing its past: it is learning to look it in the face, just as you look at its façades in the water mirror." }
questions:
  - { q: "D'où vient le surnom « port de la Lune » ?", options: ["Des fêtes nocturnes sur les quais", "De la courbe en croissant que forme la Garonne", "D'un ancien phare"], answer: 1, explain: "«C'est cette courbe, en forme de croissant, qui a donné au port son surnom.»" }
  - { q: "Sur quoi reposait la richesse de Bordeaux au XVIIIe siècle ?", options: ["Uniquement sur le vin", "Sur le commerce avec les Antilles, y compris la traite des Noirs", "Sur l'industrie automobile"], answer: 1, explain: "Sugar, coffee and cocoa from the West Indies, wine — and, the article stresses, the slave trade." }
  - { q: "Pourquoi la ville s'est-elle « endormie » au XXe siècle ?", options: ["Parce que le port s'est déplacé vers l'océan et que les quais ont été abandonnés", "À cause d'une guerre", "Parce que le vin ne se vendait plus"], answer: 0, explain: "Large ships could no longer reach the centre; the quays were left to cars and empty warehouses." }
  - { q: "Quel problème le succès récent a-t-il créé ?", options: ["Il y a trop de bateaux sur la Garonne", "Les loyers du centre ont fortement augmenté", "Le tramway ne fonctionne plus"], answer: 1, explain: "With the high-speed train many Parisians moved in and «les loyers du centre ont fortement augmenté»." }
  - { q: "Que fait aujourd'hui la ville face à son passé négrier ?", options: ["Elle l'efface des livres", "Elle l'explique : salles de musée, statue de Modeste Testas, plaques dans les rues", "Elle refuse d'en parler"], answer: 1, explain: "«Bordeaux n'efface pas son passé : elle apprend à le regarder en face.»" }
  - { q: "Pourquoi l'article emploie-t-il « devint », « fut », « s'endormit » ?", options: ["Ce sont des formes du passé simple, temps du récit historique écrit", "Ce sont des fautes", "Ce sont des formes du subjonctif"], answer: 0, explain: "The passé simple narrates the historical past in writing; when the article returns to the present-day situation, it switches to the passé composé (ont augmenté, a été installée)." }
