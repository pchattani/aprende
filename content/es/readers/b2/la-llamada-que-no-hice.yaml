id: r.b2.la-llamada-que-no-hice
level: b2
title: La llamada que no hice
kind: text
intro: A short story about a small mistake and a big regret, told with the conditional perfect, ojalá hubiera and deber haber.
allow: []
paragraphs:
  - { es: "El teléfono sonó a las nueve y cuarto. Vi el nombre en la pantalla —Papá— y lo dejé sonar. Estaba a punto de entrar en una reunión importante; pensé que lo llamaría después. Nunca lo hice.", en: "The phone rang at a quarter past nine. I saw the name on the screen — Dad — and I let it ring. I was about to go into an important meeting; I thought I would call him afterwards. I never did." }
  - { es: "Cuando salí de la reunión eran las doce. Tenía tres llamadas perdidas y un mensaje de mi hermana: «Llámame. Es urgente». Ojalá hubiera mirado el móvil antes. Ojalá hubiera salido de aquella sala en cuanto vi el nombre de mi padre.", en: "When I came out of the meeting it was twelve. I had three missed calls and a message from my sister: 'Call me. It's urgent.' I wish I had looked at my phone earlier. I wish I had left that room as soon as I saw my father's name." }
  - { es: "Mi padre había tenido un accidente en la cocina; nada grave, decían los médicos, pero querían operarlo esa misma tarde. Cuando llegué al hospital ya estaba dormido. Mi hermana me miró como si yo fuera un extraño. «Podrías haber contestado», me dijo. Tenía razón.", en: "My father had had an accident in the kitchen; nothing serious, the doctors said, but they wanted to operate on him that same afternoon. When I got to the hospital he was already asleep. My sister looked at me as if I were a stranger. 'You could have answered,' she said. She was right." }
  - { es: "Durante la semana siguiente lo visité cada día. Hablamos de cosas sin importancia: del fútbol, del tiempo, de la vecina que había vuelto a aparcar en su plaza. Ninguno de los dos mencionó la llamada. Yo quería pedirle perdón, pero cada vez que abría la boca me faltaba el valor.", en: "During the following week I visited him every day. We talked about unimportant things: football, the weather, the neighbour who had parked in his space again. Neither of us mentioned the call. I wanted to apologise, but every time I opened my mouth I lacked the courage." }
  - { es: "Una tarde, mientras dormía, encontré su móvil en la mesilla. No debería haberlo hecho, pero lo cogí. En la pantalla todavía estaba la llamada de las nueve y cuarto. Y debajo, un mensaje que nunca envió: «Hijo, no es nada. Solo quería oír tu voz antes de entrar».", en: "One afternoon, while he was sleeping, I found his phone on the bedside table. I shouldn't have done it, but I picked it up. On the screen was still the call from a quarter past nine. And below it, a message he never sent: 'Son, it's nothing. I just wanted to hear your voice before going in.'" }
  - { es: "Me senté en la silla del hospital y me quedé así mucho tiempo. Habría dado cualquier cosa por volver a aquella mañana. Habría salido de la reunión, habría cogido el teléfono, habría dicho «aquí estoy». No lo hice, y nadie puede cambiar eso.", en: "I sat down on the hospital chair and stayed like that for a long time. I would have given anything to go back to that morning. I would have left the meeting, I would have picked up the phone, I would have said 'I'm here.' I didn't, and nobody can change that." }
  - { es: "Mi padre se recuperó. Hoy pasea, discute con la vecina y me llama los domingos. Yo siempre contesto, aunque esté en una reunión, aunque el jefe me mire mal, aunque sea para hablar del tiempo. Él no sabe por qué. Yo no se lo he contado.", en: "My father recovered. Today he goes for walks, argues with the neighbour and calls me on Sundays. I always answer, even if I'm in a meeting, even if the boss gives me a look, even if it's only to talk about the weather. He doesn't know why. I haven't told him." }
  - { es: "Hay errores que se perdonan y errores que uno no se perdona. El mío fue pequeño: una llamada que no hice. Pero aprendí la lección mejor que en cualquier libro: lo urgente no siempre llega con una señal; a veces es solo un nombre en la pantalla a las nueve y cuarto.", en: "There are mistakes that are forgiven and mistakes one doesn't forgive oneself. Mine was small: a call I didn't make. But I learnt the lesson better than from any book: what is urgent doesn't always come with a signal; sometimes it is just a name on a screen at a quarter past nine." }
questions:
  - { q: "Why didn't the narrator answer the phone?", options: ["He was asleep", "He was about to go into an important meeting", "His phone was switched off"], answer: 1 }
  - { q: "What did the sister say at the hospital?", options: ["That it was not his fault", "That he could have answered", "That the father was angry"], answer: 1 }
  - { q: "What did the narrator find on his father's phone?", options: ["A message that was never sent", "A photo of the family", "A call from the hospital"], answer: 0 }
  - { q: "What does the narrator do now when his father calls?", options: ["He lets it ring and calls back later", "He always answers, whatever he is doing", "He asks his sister to answer"], answer: 1 }
glossary:
  - { es: faltar, en: to be lacking }
  - { es: mesilla, en: bedside table }
  - { es: recuperarse, en: to recover }
