id: r.b2.a-renda-de-bilro
level: b2
title: A renda de bilro do Ceará
kind: text
intro: A magazine article about bobbin lace, the craft brought by Portuguese women and kept alive by the lacemakers of Fortaleza and the Ceará coast. Notice the formal passive and impersonal style (foi trazida, é feita, estima-se que).
allow: [ceará, fortaleza, aquiraz, prainha, iracema, ok, açores, cearense, cearenses, madeira]
paragraphs:
  - { es: "Quem visita Fortaleza dificilmente volta para casa sem uma peça de renda. Nas lojas do Mercado Central, nas feiras da Beira-Mar e nas barracas das praias, toalhas, blusas e vestidos de renda branca são vendidos lado a lado com castanha de caju e garrafinhas de areia colorida. Poucos turistas sabem, no entanto, que por trás de cada peça há uma técnica de mais de quatrocentos anos e um trabalho que pode levar semanas.", en: "Anyone who visits Fortaleza rarely goes home without a piece of lace. In the shops of the Mercado Central, at the stalls on the Beira-Mar and on the beaches, white lace tablecloths, blouses and dresses are sold side by side with cashew nuts and little bottles of coloured sand. Few tourists know, however, that behind each piece there is a technique more than four hundred years old and work that can take weeks." }
  - { es: "A renda de bilro foi trazida ao Brasil pelas mulheres portuguesas durante o período colonial. Acredita-se que a técnica tenha se desenvolvido na Europa no século dezesseis e que tenha chegado ao litoral do Nordeste com as famílias de colonos e de pescadores. No Ceará, ela foi adotada pelas mulheres das comunidades do litoral, que passaram a ensiná-la de mãe para filha. Com o tempo, foram criados desenhos próprios, inspirados na natureza local: flores do sertão, ondas do mar, estrelas.", en: "Bobbin lace was brought to Brazil by Portuguese women during the colonial period. It is believed that the technique developed in Europe in the sixteenth century and reached the coast of the Northeast with families of settlers and fishermen. In Ceará it was adopted by women in coastal communities, who began to teach it from mother to daughter. Over time, their own designs were created, inspired by local nature: flowers of the sertão, sea waves, stars." }
  - { es: "A técnica é tão simples de descrever quanto difícil de executar. A rendeira trabalha sentada, com uma almofada cilíndrica apoiada nas pernas. Sobre a almofada é fixado um papelão perfurado, chamado pique, que traz o desenho da peça. Em cada furo é colocado um alfinete ou um espinho de mandacaru. Os fios são enrolados em dezenas de bilros, pequenas peças de madeira, que são cruzados e trocados de lugar num ritmo rapidíssimo. O barulho dos bilros batendo uns nos outros é inconfundível.", en: "The technique is as simple to describe as it is difficult to carry out. The lacemaker works seated, with a cylindrical cushion resting on her legs. A perforated piece of card, called a pique, which carries the design of the piece, is fixed to the cushion. A pin or a mandacaru cactus thorn is placed in each hole. The threads are wound on dozens of bobbins, small pieces of wood, which are crossed and swapped at a very fast pace. The sound of the bobbins knocking against each other is unmistakable." }
  - { es: "Estima-se que uma toalha de mesa grande exija mais de um mês de trabalho diário. Apesar disso, o preço pago às rendeiras costuma ser baixo. Grande parte do lucro fica com os intermediários, que compram as peças nas comunidades e as revendem nas cidades por valores muito mais altos. Esse é considerado, pelos pesquisadores, um dos principais motivos pelos quais as jovens têm se afastado da profissão.", en: "It is estimated that a large tablecloth requires more than a month of daily work. Despite this, the price paid to lacemakers tends to be low. A large part of the profit goes to middlemen, who buy the pieces in the communities and resell them in the cities for much higher prices. Researchers consider this one of the main reasons why young women have been moving away from the craft." }
  - { es: "Nas últimas décadas, porém, várias iniciativas têm sido criadas para valorizar o trabalho. Em algumas praias próximas de Fortaleza, como a Prainha, em Aquiraz, foram organizados centros e associações de rendeiras, onde as peças são produzidas e vendidas diretamente ao público. Assim, o turista pode conhecer as artesãs, ver como a renda é feita e pagar um preço justo. Cursos têm sido oferecidos para meninas e meninos das comunidades, e algumas mestras rendeiras já foram homenageadas pelo governo do estado como guardiãs da cultura popular.", en: "In recent decades, however, several initiatives have been created to give value to the work. On some beaches near Fortaleza, such as Prainha, in Aquiraz, lacemakers' centres and associations have been organised, where the pieces are produced and sold directly to the public. In this way, tourists can meet the artisans, see how the lace is made and pay a fair price. Courses have been offered to girls and boys in the communities, and some master lacemakers have been honoured by the state government as guardians of popular culture." }
  - { es: "Não se trata apenas de economia. Para muitas rendeiras, a almofada é também um espaço de convivência. Em várias comunidades, as mulheres se reúnem à tarde, na sombra das casas, para trabalhar juntas, conversar e cantar. «Enquanto a gente faz renda, a gente conta a vida», disse uma rendeira de setenta e oito anos à reportagem. «Se a renda acabar, acaba também essa conversa.»", en: "It's not just a matter of economics. For many lacemakers, the cushion is also a space for socialising. In several communities, women gather in the afternoon, in the shade of the houses, to work together, talk and sing. 'While we make lace, we tell our lives,' a seventy-eight-year-old lacemaker told our reporter. 'If lace ends, that conversation ends too.'" }
  - { es: "Na próxima vez em que uma peça de renda for oferecida a você numa praia do Ceará, vale a pena perguntar quem a fez, onde e quanto tempo levou. É bem provável que a resposta seja uma história.", en: "Next time you're offered a piece of lace on a beach in Ceará, it's worth asking who made it, where and how long it took. It's very likely that the answer will be a story." }
questions:
  - { q: "Quem trouxe a renda de bilro para o Brasil?", options: ["Os indígenas", "As mulheres portuguesas", "Os turistas"], answer: 1, explain: "«A renda de bilro foi trazida ao Brasil pelas mulheres portuguesas durante o período colonial.»" }
  - { q: "O que é o «pique»?", options: ["Um papelão perfurado com o desenho da peça", "Um tipo de fio", "A almofada da rendeira"], answer: 0, explain: "«Sobre a almofada é fixado um papelão perfurado, chamado pique, que traz o desenho da peça.»" }
  - { q: "Por que muitas jovens têm se afastado da profissão?", options: ["Porque a técnica é proibida", "Porque o preço pago às rendeiras é baixo e o lucro fica com intermediários", "Porque não há mais turistas"], answer: 1, explain: "«O preço pago às rendeiras costuma ser baixo. Grande parte do lucro fica com os intermediários.»" }
  - { q: "Qual é a vantagem das associações de rendeiras?", options: ["As peças são vendidas diretamente ao público por um preço justo", "As peças são feitas por máquinas", "As rendeiras trabalham à noite"], answer: 0, explain: "In the associations «as peças são produzidas e vendidas diretamente ao público» and tourists can «pagar um preço justo»." }
  - { q: "Segundo a rendeira de setenta e oito anos, o que se perderia se a renda acabasse?", options: ["Muito dinheiro", "A conversa e a convivência entre as mulheres", "As praias"], answer: 1, explain: "«Enquanto a gente faz renda, a gente conta a vida... Se a renda acabar, acaba também essa conversa.»" }
