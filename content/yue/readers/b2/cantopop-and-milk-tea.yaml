id: r.b2.cantopop-and-milk-tea
level: b2
title: 港式文化：奶茶、廣東歌同中英夾雜
kind: text
intro: Ana gives a talk to her Cantonese class on what she sees as the three pillars of Hong Kong pop culture - silk-stocking milk tea, Cantopop and the habit of mixing Cantonese and English in the same sentence.
paragraphs:
  - { es: "各位同學，今日我想同大家分享我眼中嘅港式文化。我嚟咗香港兩年，發覺香港文化好難用一句說話形容：佢唔係純粹中國文化，又唔係純粹西方文化，而係兩樣溝埋一齊之後，變成一種好獨特嘅嘢。我揀咗三樣我最鍾意嘅例子：奶茶、廣東歌同中英夾雜。", en: "Classmates, today I'd like to share with you Hong Kong culture as I see it. I've been in Hong Kong for two years, and I've found that Hong Kong culture is hard to describe in a single sentence: it isn't purely Chinese culture, nor purely Western culture; it's the two mixed together, turned into something truly unique. I've chosen my three favourite examples: milk tea, Cantopop and mixing Chinese and English." }
  - { es: "第一樣係港式奶茶。奶茶本身係英國人飲下午茶嘅習慣，但係香港人將佢改良咗：用幾種紅茶撈埋一齊，用一個好似絲襪噉嘅布袋隔茶，再加淡奶，所以又叫「絲襪奶茶」。一杯好嘅奶茶要夠滑、夠香，茶味要濃。二零一七年，港式奶茶製作技藝仲列入咗香港非物質文化遺產代表作名錄。我第一次飲覺得太濃，而家一日唔飲就成身唔自在。", en: "The first is Hong Kong-style milk tea. Milk tea itself comes from the British habit of afternoon tea, but Hongkongers improved on it: they blend several kinds of black tea, strain it through a cloth bag that looks like a silk stocking, and add evaporated milk - which is why it's also called \"silk-stocking milk tea\". A good cup of milk tea has to be smooth and fragrant, with a strong tea flavour. In 2017 the craft of making Hong Kong-style milk tea was even included in Hong Kong's representative list of intangible cultural heritage. The first time I tried it I found it too strong; now if I go a day without it I feel out of sorts." }
  - { es: "喺茶餐廳，奶茶通常同菠蘿油、西多士一齊食。茶餐廳本身就係中西合璧嘅最佳例子：一張餐牌上面，可以同時有雲吞麵、焗豬扒飯同意粉。伙記落單仲有自己嘅密碼，例如「鴛鴦」係咖啡溝奶茶，「飛沙走奶」係唔要糖唔要奶。我第一次聽到，以為佢哋講緊外星話。", en: "At a cha chaan teng, milk tea usually goes with a pineapple bun with butter or French toast. The cha chaan teng itself is the best example of East meets West: one menu can have wonton noodles, baked pork chop rice and spaghetti all at once. The waiters even have their own code for orders: \"yuenyeung\" is coffee mixed with milk tea, and \"fei sa jau naai\" means no sugar and no milk. The first time I heard it, I thought they were speaking an alien language." }
  - { es: "第二樣係廣東歌。八九十年代係廣東歌嘅黃金時期，好多歌星唔單止喺香港紅，仲紅到成個亞洲。一九七九年嘅《獅子山下》到而家仍然好多人識唱，因為佢講出咗香港人互相幫助、努力拼搏嘅精神。我老師話，佢後生嗰陣，成班同學會喺演唱會門口排通宵買飛。雖然而家多咗人聽英文歌同韓國歌，但係近年又有好多新嘅本地歌手同樂隊爆紅，廣東歌又再流行返。", en: "The second is Cantopop. The eighties and nineties were the golden age of Cantopop; many singers were famous not just in Hong Kong but all over Asia. Lots of people can still sing \"Below the Lion Rock\" from 1979, because it captured Hongkongers' spirit of helping each other and striving hard. My teacher says that when she was young, her whole class would queue overnight outside the concert venue to buy tickets. Although more people listen to English and Korean songs now, in recent years many new local singers and bands have suddenly become hugely popular, and Cantopop is in fashion again." }
  - { es: "我覺得學廣東歌係學廣東話最好嘅方法之一。因為廣東話有九聲六調，寫歌詞嘅人要配合旋律揀字，所以每個字嘅聲調都要啱。唱得多，聲調自然就準咗。我而家識唱五首歌，雖然唱得唔係好好聽，但係去卡拉OK都唔會冇面。", en: "I think learning Cantopop is one of the best ways to learn Cantonese. Because Cantonese has nine tones in six pitches, lyricists have to choose words that fit the melody, so the tone of every word has to be right. The more you sing, the more accurate your tones naturally become. I can sing five songs now, and although I don't sing them very well, I don't embarrass myself at karaoke." }
  - { es: "第三樣係中英夾雜。香港人講嘢成日一句入面有中文又有英文，例如：「我今日好busy，等陣要開個meeting，你send個email畀我先啦。」有啲人批評話咁樣講嘢唔標準，但係我覺得呢個係香港歷史嘅一部分。仲有好多英文字已經變成咗廣東話，例如的士、巴士、芝士、貼士同士多，好多香港人甚至唔知原來佢哋係外來語。", en: "The third is mixing Chinese and English. Hongkongers often use both Chinese and English in the same sentence, for example: \"I'm really busy today, I've got a meeting in a bit, just send me an email first.\" Some people criticise this way of speaking as not proper, but I think it's part of Hong Kong's history. And many English words have already become Cantonese, such as 的士 (taxi), 巴士 (bus), 芝士 (cheese), 貼士 (tips) and 士多 (store); many Hongkongers don't even realise they're loanwords." }
  - { es: "總括嚟講，港式文化最大嘅特色就係「溝」：茶同奶溝、中同西溝、廣東話同英文溝。正正因為咁，佢先咁有活力。多謝大家，我講完喇。如果有問題，我哋可以落堂之後一齊去飲杯鴛鴦，慢慢傾。", en: "To sum up, the biggest feature of Hong Kong culture is mixing: tea mixed with milk, East with West, Cantonese with English. That's exactly what makes it so vibrant. Thank you, everyone, that's the end of my talk. If you have any questions, we can go for a cup of yuenyeung together after class and talk it over." }
questions:
  - { q: "點解港式奶茶又叫「絲襪奶茶」？", options: ["因為隔茶個布袋好似絲襪", "因為係用絲襪整嘅", "因為係女仔飲嘅"], answer: 0, explain: "用一個好似絲襪噉嘅布袋隔茶." }
  - { q: "「飛沙走奶」係乜嘢意思？", options: ["咖啡溝奶茶", "唔要糖唔要奶", "加多啲奶"], answer: 1, explain: "「飛沙走奶」係唔要糖唔要奶. 鴛鴦 is coffee mixed with milk tea." }
  - { q: "廣東歌嘅黃金時期係幾時？", options: ["六七十年代", "八九十年代", "近年"], answer: 1, explain: "八九十年代係廣東歌嘅黃金時期." }
  - { q: "Ana點解覺得學廣東歌可以幫到學廣東話？", options: ["因為歌詞嘅聲調要配合旋律，唱多咗聲調會準啲", "因為歌詞好簡單", "因為可以識朋友"], answer: 0, explain: "每個字嘅聲調都要啱. 唱得多，聲調自然就準咗." }
  - { q: "以下邊個唔係外來語？", options: ["的士", "芝士", "奶茶"], answer: 2, explain: "的士 (taxi) and 芝士 (cheese) come from English; 奶茶 is a native compound." }
  - { q: "Ana覺得港式文化最大嘅特色係乜嘢？", options: ["溝", "快", "貴"], answer: 0, explain: "港式文化最大嘅特色就係「溝」." }
