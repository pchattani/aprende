id: c2.u06
title: 用粵語讀唐詩
lessons:
  - id: c2.u06.l1
    title: 千山鳥飛絕
    teach: [g.entering-tones]
    vocab: [w.tong4-si1, w.si1, w.si1-jan4.b, w.jap6-sing1, w.gu2-jam1, w.zung1-gu2-hon3-jyu5, w.gu1-zau1, w.so1-lap1-jung1, w.hon4, w.diu3.b, w.zyut6, w.mit6, w.zung1.d, w.gong1, w.niu5, w.gu2-si1, w.si1-ci4, w.sung3-ci4, w.hon3-zi6, w.man4-jan4, w.lau5-zung1-jyun4, w.bui6-zung6]
    tip: "Cantonese still ends syllables in -p, -t, -k, as Middle Chinese did. Poems that rhyme on these clipped syllables, like 〈江雪〉, only really rhyme when read in Cantonese."
    sentences:
      - { es: "廣東話保留咗中古漢語嘅入聲，普通話就冇晒。", en: "Cantonese has kept the entering tones of Middle Chinese; Mandarin has lost them all.", altEs: ["廣東話保留咗中古漢語嘅入聲，普通話就冇咗。", "廣東話仲保留住中古漢語嘅入聲，普通話就冇晒。"], grammar: [g.entering-tones], vocab: [w.zung1-gu2-hon3-jyu5, w.jap6-sing1], transform: { instruction: "Turn it into a question: has Cantonese kept the entering tones?", answer: "廣東話有冇保留中古漢語嘅入聲？", alt: ["廣東話保留咗中古漢語嘅入聲未？", "廣東話有冇保留到中古漢語嘅入聲？"], en: "Has Cantonese kept the entering tones of Middle Chinese?" } }
      - { es: "入聲字讀得好短，最尾會突然收住。", en: "Entering-tone characters are read very short, and they stop abruptly at the end.", altEs: ["入聲字讀得好短，最後會突然收住。", "入聲字好短，最尾突然收住。"], grammar: [g.entering-tones], vocab: [w.jap6-sing1] }
      - { es: "「一」、「六」、「八」都係入聲字。", en: "'One', 'six' and 'eight' are all entering-tone characters.", altEs: ["「一」、「六」同「八」都係入聲字。"], grammar: [g.entering-tones], vocab: [w.jap6-sing1] }
      - { es: "用廣東話讀〈江雪〉，「絕」、「滅」、「雪」押韻押得好清楚。", en: "Read 'River Snow' in Cantonese and you can clearly hear 'vanish', 'die out' and 'snow' rhyme.", altEs: ["用廣東話讀〈江雪〉，「絕」、「滅」、「雪」好明顯押韻。"], grammar: [g.entering-tones, g.cantonese-rhyme], vocab: [w.zyut6, w.mit6, w.aap3-wan5] }
      - { es: "千山鳥飛絕，萬徑人蹤滅。", en: "A thousand hills, no birds in flight; ten thousand paths, no human trace.", grammar: [g.entering-tones], vocab: [w.niu5, w.zyut6, w.zung1.d, w.mit6] }
      - { es: "孤舟蓑笠翁，獨釣寒江雪。", en: "In a lone boat, an old man in a straw cape and hat fishes alone in the cold river snow.", grammar: [g.entering-tones], vocab: [w.gu1-zau1, w.so1-lap1-jung1, w.diu3.b, w.hon4, w.gong1] }
      - { es: "條江上面冇人，雀仔都飛晒，得返一個阿伯喺度釣魚。", en: "There's no one on the river and the birds have all flown away; only one old man is left, fishing.", altEs: ["江上面冇人，雀仔都飛晒，淨係得一個阿伯喺度釣魚。"], grammar: [g.entering-tones, g.classical-grammar], vocab: [w.gong1, w.diu3.b], note: "A colloquial retelling of 〈江雪〉." }
      - { es: "用普通話讀呢首詩，啲韻腳就唔似押韻喇。", en: "Read this poem in Mandarin and the rhyme words no longer sound like they rhyme.", altEs: ["用普通話讀呢首詩，啲韻腳聽落唔似押韻。"], grammar: [g.entering-tones], vocab: [w.si1, w.wan5-goek3], error: { wrong: "用普通話讀呢首詩，啲韻腳仲押韻得好清楚。", explain: "Mandarin lost the -t endings of 絕, 滅, 雪, so the rhyme fades; it is Cantonese that keeps it clear.", grammar: g.entering-tones } }
      - { es: "廣東話保留咗好多古音，所以讀唐詩特別有味道。", en: "Cantonese keeps a lot of the old pronunciation, so reading Tang poems in it is especially satisfying.", altEs: ["廣東話保存咗好多古音，所以讀唐詩特別有味道。"], grammar: [g.entering-tones], vocab: [w.gu2-jam1, w.tong4-si1] }
      - { es: "柳宗元寫〈江雪〉嗰陣，人喺好遠嘅南方，好孤單。", en: "When Liu Zongyuan wrote 'River Snow', he was far away in the south and very lonely.", altEs: ["柳宗元寫〈江雪〉嘅時候，人喺好遠嘅南方，好孤單。"], grammar: [g.entering-tones], vocab: [w.lau5-zung1-jyun4, w.si1-jan4.b] }
      - { es: "你唔好將入聲讀得太長，要收得乾淨。", en: "Don't drag out the entering tones; cut them off cleanly.", altEs: ["唔好將入聲讀得咁長，要收得乾淨啲。", "你唔好讀到入聲咁長，要收得乾淨。"], grammar: [g.entering-tones], vocab: [w.jap6-sing1], transform: { instruction: "Make it a positive instruction: read the entering tones short", answer: "你要將入聲讀得短啲，收得乾淨。", alt: ["你要將入聲讀短啲，收得乾淨。", "入聲要讀得短啲，收得乾淨。"] } }
      - { es: "「雪」同「說」都係入聲字，你聽唔聽得出？", en: "'Snow' and 'say' are both entering-tone characters; can you hear it?", altEs: ["「雪」同「說」都係入聲字，你聽得出嗎？"], grammar: [g.entering-tones], vocab: [w.jap6-sing1] }
      - { es: "唐詩宋詞，用廣東話讀先至夠味道。", en: "Tang poems and Song lyrics only taste right when you read them in Cantonese.", altEs: ["唐詩宋詞要用廣東話讀先夠味道。", "唐詩同宋詞，用廣東話讀先夠味。"], grammar: [g.entering-tones], vocab: [w.tong4-si1, w.sung3-ci4] }
      - { es: "古時嘅文人都係用自己鄉下嘅口音讀詩。", en: "Scholars in the old days read poetry in the accent of their own home region.", altEs: ["以前嘅文人都係用自己鄉下嘅口音讀詩。"], grammar: [g.entering-tones], vocab: [w.man4-jan4, w.si1] }
      - { es: "每個漢字都係一個音節，所以入聲好容易分辨。", en: "Every Chinese character is one syllable, so the entering tones are easy to pick out.", altEs: ["每個漢字得一個音節，所以入聲好易分辨。"], grammar: [g.entering-tones], vocab: [w.hon3-zi6] }
      - { es: "我細個學古詩，老師成日叫我哋大聲讀出嚟。", en: "When I learnt classical poems as a child, the teacher always made us read them aloud.", altEs: ["我細個學古詩，老師成日要我哋大聲讀出嚟。"], grammar: [g.entering-tones], vocab: [w.gu2-si1] }
    exchanges:
      - q: { es: "點解唐詩用廣東話讀會押韻啲？", en: "Why do Tang poems rhyme better in Cantonese?" }
        a: { es: "因為廣東話保留咗入聲，好多韻腳都係入聲字。", en: "Because Cantonese kept the entering tones, and many of the rhyme words are entering-tone characters." }
        alt: ["因為廣東話仲有入聲。", "廣東話保留咗入聲囉。"]
        grammar: [g.entering-tones]
        vocab: [w.jap6-sing1, w.tong4-si1]
      - q: { es: "「六」係唔係入聲字？", en: "Is 'six' an entering-tone character?" }
        a: { es: "係，佢讀得好短，最尾收得好快。", en: "Yes, it's read very short and cut off quickly at the end." }
        alt: ["係呀。", "係入聲字。"]
        grammar: [g.entering-tones]
        vocab: [w.jap6-sing1]
      - q: { es: "〈江雪〉係邊個寫㗎？", en: "Who wrote 'River Snow'?" }
        a: { es: "柳宗元，唐朝嘅詩人。", en: "Liu Zongyuan, a Tang dynasty poet." }
        alt: ["柳宗元寫嘅。", "係柳宗元。"]
        grammar: [g.entering-tones]
        vocab: [w.lau5-zung1-jyun4, w.si1-jan4.b]
      - q: { es: "用普通話讀〈江雪〉有咩問題？", en: "What's the problem with reading 'River Snow' in Mandarin?" }
        a: { es: "「絕」、「滅」、「雪」聽落唔再似押韻。", en: "'Vanish', 'die out' and 'snow' no longer sound like they rhyme." }
        alt: ["啲韻腳唔押韻。", "冇咗入聲，唔押韻。"]
        grammar: [g.entering-tones]
        vocab: [w.zyut6, w.mit6]
      - q: { es: "你識唔識背誦〈江雪〉？", en: "Can you recite 'River Snow' by heart?" }
        a: { es: "識少少，「千山鳥飛絕」之後就唔記得喇。", en: "A little; after 'a thousand hills, no birds in flight' I forget." }
        alt: ["識呀，四句都識。", "唔係好識。"]
        grammar: [g.entering-tones]
        vocab: [w.zyut6]
    texts:
      - title: "佛山祖廟嘅詩詞班"
        es: ["佛山祖廟附近有個詩詞班，老師用廣東話教唐詩。", "佢話入聲字要讀得短，好似敲一下木魚咁。", "Leo 讀「獨釣寒江雪」，讀到好似唱粵劇。"]
        en: ["Near Foshan Ancestral Temple there's a poetry class where the teacher teaches Tang poems in Cantonese.", "She says entering-tone characters must be short, like one knock on a wooden fish.", "Leo reads 'fishing alone in the cold river snow' as if he were singing Cantonese opera."]
        grammar: [g.entering-tones]
        vocab: [w.si1-ci4, w.tong4-si1, w.jap6-sing1]
    spicy:
      - { es: "你嘅回覆好似入聲字咁短，係咪唔想理我？", en: "Your replies are as short as entering tones; don't you want to talk to me?", altEs: ["你覆我嘅訊息短過入聲字，係咪唔想理我？"], grammar: [g.entering-tones], vocab: [w.jap6-sing1] }
      - { es: "我唔想好似個蓑笠翁咁一個人坐喺孤舟度，你陪我好唔好？", en: "I don't want to sit alone in a lone boat like the old man in the straw cape. Will you keep me company?", altEs: ["我唔想好似蓑笠翁咁一個人坐喺孤舟度，你陪吓我好唔好？"], grammar: [g.entering-tones], vocab: [w.so1-lap1-jung1, w.gu1-zau1] }
      - { es: "千山鳥飛絕都唔緊要，你唔好飛走就得。", en: "A thousand hills without a bird is fine, as long as you don't fly away.", altEs: ["千山鳥飛絕冇所謂，你唔好飛走就得。"], grammar: [g.entering-tones], vocab: [w.niu5, w.zyut6] }
      - { es: "你答我一個「得」字，短過入聲，但係我開心咗成晚。", en: "You answered me with one word, 'OK', shorter than an entering tone, but it made me happy all night.", altEs: ["你淨係答我一個「得」字，短過入聲，不過我開心咗成晚。"], grammar: [g.entering-tones], vocab: [w.jap6-sing1] }
  - id: c2.u06.l2
    title: 床前明月光
    teach: [g.ping-zak]
    vocab: [w.ping4-zak1, w.ping4-sing1, w.zak1-sing1, w.soeng5-sing1, w.heoi3-sing1, w.lei5-baak6, w.zing6-je6-si1, w.ming4-jyut6, w.jyut6-gwong1, w.soeng1.c, w.geoi2-tau4, w.dai1-tau4, w.gu3-hoeng1, w.si1-hoeng1, w.hoeng1-sau4, w.ji4.c, w.dei6-soeng6, w.si1.b, w.hoeng1.c, w.deoi3-zoeng6, w.ng5-jin4, w.cat1-jin4, w.zyut6-geoi3, w.leot6-si1.b, w.si1-geoi3, w.zak1.b]
    tip: "平 (level) = tones 1 and 4; 仄 (oblique) = tones 2, 3, 5, 6 and every entering tone. 月 jyut6 is short and oblique, so 床前明月光 runs 平平平仄平."
    sentences:
      - { es: "床前明月光，疑是地上霜。", en: "Before my bed, the bright moonlight: I took it for frost on the ground.", grammar: [g.ping-zak], vocab: [w.ming4-jyut6, w.ji4.c, w.dei6-soeng6, w.soeng1.c], jp: "cong4 cin4 ming4 jyut6 gwong1 ji4 si6 dei6 soeng6 soeng1" }
      - { es: "舉頭望明月，低頭思故鄉。", en: "I raise my head to gaze at the bright moon, lower it and think of home.", grammar: [g.ping-zak], vocab: [w.geoi2-tau4, w.ming4-jyut6, w.dai1-tau4, w.si1.b, w.gu3-hoeng1], jp: "geoi2 tau4 mong6 ming4 jyut6 dai1 tau4 si1 gu3 hoeng1" }
      - { es: "第一聲同第四聲屬於平聲，其他聲調就屬於仄聲。", en: "Tones 1 and 4 are level tones; the other tones are oblique.", altEs: ["第一同第四聲係平聲，其他聲調係仄聲。", "第一聲同第四聲屬於平聲，其餘嘅屬於仄聲。"], grammar: [g.ping-zak], vocab: [w.ping4-sing1, w.zak1-sing1] }
      - { es: "入聲字一定係仄聲，就算讀第一聲都係。", en: "Entering-tone characters are always oblique, even when they're read in tone 1.", altEs: ["入聲字實係仄聲，就算讀第一聲都係。"], grammar: [g.ping-zak, g.entering-tones], vocab: [w.jap6-sing1, w.zak1-sing1], error: { wrong: "「一」讀第一聲，所以係平聲。", explain: "一 (jat1) is an entering tone, and entering tones are always oblique (仄), whatever their pitch.", grammar: g.ping-zak } }
      - { es: "「光」、「霜」、「鄉」都係平聲，而且屬於同一個韻部。", en: "'Light', 'frost' and 'home' are all level tones, and they belong to the same rhyme group.", altEs: ["「光」、「霜」、「鄉」全部都係平聲，又屬於同一個韻部。"], grammar: [g.ping-zak, g.cantonese-rhyme], vocab: [w.ping4-sing1, w.soeng1.c, w.hoeng1.c] }
      - { es: "李白喺一個好靜嘅晚上，望住月光就諗起屋企。", en: "On a very quiet night, Li Bai gazed at the moonlight and thought of home.", altEs: ["李白喺一個好安靜嘅晚上，望住月光就諗起屋企。"], grammar: [g.ping-zak, g.classical-grammar], vocab: [w.lei5-baak6, w.jyut6-gwong1] }
      - { es: "「床前明月光」嘅平仄係平平平仄平。", en: "The tone pattern of 'before my bed, the bright moonlight' is level, level, level, oblique, level.", altEs: ["「床前明月光」係平平平仄平。"], grammar: [g.ping-zak], vocab: [w.ping4-zak1, w.zak1.b], transform: { instruction: "Ask what the tone pattern of this line is", answer: "「床前明月光」嘅平仄係點樣㗎？", alt: ["「床前明月光」係咩平仄？", "「床前明月光」嘅平仄係乜嘢？"] } }
      - { es: "律詩要講平仄，中間兩聯仲要對仗。", en: "Regulated verse has to follow the tone pattern, and its two middle couplets must be parallel.", altEs: ["律詩要跟平仄，中間兩聯仲要對仗。"], grammar: [g.ping-zak], vocab: [w.leot6-si1.b, w.ping4-zak1, w.deoi3-zoeng6] }
      - { es: "一首絕句有四句，一首律詩有八句。", en: "A quatrain has four lines; a regulated poem has eight.", altEs: ["絕句有四句，律詩有八句。"], grammar: [g.ping-zak], vocab: [w.zyut6-geoi3, w.leot6-si1.b], transform: { instruction: "Ask how many lines a regulated poem has", answer: "一首律詩有幾多句？", alt: ["一首律詩有幾句？", "律詩有幾多句？"] } }
      - { es: "五言詩每句五個字，七言詩每句七個字。", en: "Five-character poems have five characters a line; seven-character poems have seven.", altEs: ["五言詩一句五個字，七言詩一句七個字。"], grammar: [g.ping-zak], vocab: [w.ng5-jin4, w.cat1-jin4] }
      - { es: "普通話有啲入聲字變咗平聲，所以平仄好難聽得出。", en: "In Mandarin some entering-tone characters became level tones, so the tone pattern is hard to hear.", altEs: ["普通話入面有啲入聲字變咗平聲，所以好難聽得出平仄。"], grammar: [g.ping-zak, g.entering-tones], vocab: [w.ping4-sing1, w.ping4-zak1] }
      - { es: "你試吓用廣東話讀〈靜夜思〉，聽吓邊啲字係仄聲。", en: "Try reading 'Quiet Night Thoughts' in Cantonese and listen for which characters are oblique.", altEs: ["試吓用廣東話讀〈靜夜思〉，聽吓邊啲係仄聲字。"], grammar: [g.ping-zak], vocab: [w.zing6-je6-si1, w.zak1-sing1] }
      - { es: "離開屋企咁耐，佢一望到月光就有鄉愁。", en: "He's been away from home so long that whenever he sees the moonlight he feels homesick.", altEs: ["離開咗屋企咁耐，佢一見到月光就有鄉愁。"], altEn: ["She's been away from home so long that whenever she sees the moonlight she feels homesick."], grammar: [g.ping-zak], vocab: [w.jyut6-gwong1, w.hoeng1-sau4] }
      - { es: "對聯嘅上聯通常收仄聲，下聯就收平聲。", en: "The first line of a couplet usually ends on an oblique tone, the second on a level tone.", altEs: ["對聯上聯通常收仄聲，下聯收平聲。"], grammar: [g.ping-zak], vocab: [w.zak1-sing1, w.ping4-sing1], jp: "deoi3 lyun4 ge3 soeng6 lyun4 tung1 soeng4 sau1 zak1 sing1 haa6 lyun4 zau6 sau1 ping4 sing1" }
      - { es: "「上聲」同「去聲」都屬於仄聲。", en: "The 'rising' and 'departing' tones both count as oblique.", altEs: ["上聲同去聲都係仄聲。"], grammar: [g.ping-zak], vocab: [w.soeng5-sing1, w.heoi3-sing1, w.zak1-sing1] }
      - { es: "呢句詩寫得好，因為平仄同意思都配合得好好。", en: "This line is well written because the tone pattern and the meaning match beautifully.", altEs: ["呢句詩寫得好，平仄同意思都夾得好好。"], grammar: [g.ping-zak], vocab: [w.si1-geoi3, w.ping4-zak1] }
    exchanges:
      - q: { es: "平聲包括邊幾個聲調？", en: "Which tones count as level?" }
        a: { es: "第一聲同第四聲，不過入聲字唔計。", en: "Tones 1 and 4, but not entering-tone characters." }
        alt: ["第一同第四聲。", "第一聲同第四聲囉。"]
        grammar: [g.ping-zak]
        vocab: [w.ping4-sing1]
      - q: { es: "「月」係平聲定仄聲？", en: "Is 'moon' level or oblique?" }
        a: { es: "仄聲，因為佢係入聲字。", en: "Oblique, because it's an entering-tone character." }
        alt: ["仄聲。", "係仄聲，入聲嚟㗎。"]
        grammar: [g.ping-zak]
        vocab: [w.zak1-sing1]
      - q: { es: "〈靜夜思〉講咩㗎？", en: "What's 'Quiet Night Thoughts' about?" }
        a: { es: "講李白晚上望住月光，諗起故鄉。", en: "It's about Li Bai looking at the moonlight at night and thinking of home." }
        alt: ["講思鄉。", "講李白掛住屋企。"]
        grammar: [g.ping-zak]
        vocab: [w.zing6-je6-si1, w.lei5-baak6, w.gu3-hoeng1]
      - q: { es: "律詩同絕句有咩分別？", en: "What's the difference between regulated verse and a quatrain?" }
        a: { es: "絕句得四句，律詩有八句，仲要講對仗。", en: "A quatrain has only four lines; regulated verse has eight and needs parallel couplets." }
        alt: ["絕句四句，律詩八句。", "律詩長啲，要對仗。"]
        grammar: [g.ping-zak]
        vocab: [w.zyut6-geoi3, w.leot6-si1.b, w.deoi3-zoeng6]
      - q: { es: "你點解成日望住個月亮？", en: "Why do you keep staring at the moon?" }
        a: { es: "有啲思鄉，諗起屋企人。", en: "I'm a bit homesick; I'm thinking of my family." }
        alt: ["思鄉囉。", "掛住屋企。"]
        grammar: [g.ping-zak]
        vocab: [w.si1-hoeng1]
    texts:
      - title: "Luna 嘅短訊"
        es: ["今晚佛山個月好圓。", "我舉頭望明月，低頭就諗起香港。", "原來我都有少少鄉愁。"]
        en: ["The moon over Foshan is very round tonight.", "I raise my head to the bright moon, lower it and think of Hong Kong.", "It turns out I'm a little homesick too."]
        grammar: [g.ping-zak]
        vocab: [w.geoi2-tau4, w.dai1-tau4, w.hoeng1-sau4]
      - title: "平仄筆記"
        es: ["平聲：第一聲、第四聲。", "仄聲：第二、三、五、六聲，同埋所有入聲。", "「明月光」就係平仄平。"]
        en: ["Level tones: tones 1 and 4.", "Oblique tones: tones 2, 3, 5 and 6, plus every entering tone.", "'Bright moonlight' is level, oblique, level."]
        grammar: [g.ping-zak]
        vocab: [w.ping4-sing1, w.zak1-sing1, w.ping4-zak1]
    spicy:
      - { es: "舉頭望明月，低頭望你，我發覺你靚過個月亮。", en: "I raise my head to the bright moon, lower it to you, and find you're prettier than the moon.", altEs: ["舉頭望明月，低頭望住你，我發覺你仲靚過個月亮。"], grammar: [g.ping-zak], vocab: [w.geoi2-tau4, w.dai1-tau4] }
      - { es: "你唔喺度，我晚晚都好似李白咁對住月光，不過我諗嘅唔係故鄉，係你。", en: "With you away, every night I'm like Li Bai facing the moonlight, except what I'm thinking of isn't home, it's you.", altEs: ["你唔喺度，我晚晚都好似李白咁望住月光，不過我諗嘅係你，唔係故鄉。"], grammar: [g.ping-zak], vocab: [w.lei5-baak6, w.jyut6-gwong1, w.gu3-hoeng1] }
      - { es: "我哋好似一副對聯，你平我仄，啱啱好。", en: "We're like a couplet: you're level, I'm oblique, a perfect match.", altEs: ["我哋好似一副對聯咁，你平我仄，啱啱好。"], grammar: [g.ping-zak], vocab: [w.zak1.b] }
      - { es: "你係我嘅故鄉，一見到你，我就冇晒鄉愁。", en: "You're my home: the moment I see you, all my homesickness is gone.", altEs: ["你就係我嘅故鄉，見到你我就冇晒鄉愁。"], grammar: [g.ping-zak], vocab: [w.gu3-hoeng1, w.hoeng1-sau4] }
  - id: c2.u06.l3
    title: 春眠不覺曉
    teach: [g.classical-grammar]
    vocab: [w.maang6-hou6-jin4, w.ceon1-hiu2, w.hiu2, w.min4, w.tai4.b, w.fung1-jyu5, w.fung1-kiu4-je6-bok6, w.hon4-saan1-zi6, w.fung1.c, w.jyu4-fo2, w.sau4, w.zung1-sing1, w.haak3-syun4, w.baak6-jat6, w.wong4-ho4, w.muk6, w.gang3-soeng5-jat1-cang4-lau4, w.hung4-dau2, w.naam4-gwok3, w.ceon1-fung1, w.lau5, w.ngon6, w.luk6.b, w.gong1-naam4, w.zoeng1-gai3, w.wong4-zi1-wun6, w.gu1-sou1, w.saang2-loek6, w.gaan2-git3, w.soeng1-si1-dau2, w.wong4-wai4]
    tip: "Classical verse is terse: one character is often one word, the subject is usually left out, and a noun like 綠 'green' can act as a verb, 'to make green'."
    sentences:
      - { es: "春眠不覺曉，處處聞啼鳥。", en: "Sleeping in spring, I miss the dawn; everywhere I hear birds singing.", grammar: [g.classical-grammar], vocab: [w.min4, w.hiu2, w.tai4.b, w.niu5], jp: "ceon1 min4 bat1 gok3 hiu2 cyu3 cyu3 man4 tai4 niu5" }
      - { es: "夜來風雨聲，花落知多少。", en: "Last night came the sound of wind and rain; who knows how many blossoms fell.", grammar: [g.classical-grammar], vocab: [w.fung1-jyu5], jp: "je6 loi4 fung1 jyu5 sing1 faa1 lok6 zi1 do1 siu2" }
      - { es: "古詩成日省略主語，〈靜夜思〉由頭到尾都冇講過「我」。", en: "Classical poems often leave out the subject: 'Quiet Night Thoughts' never once says 'I'.", altEs: ["古詩經常冇主語，〈靜夜思〉由頭到尾都冇「我」字。"], grammar: [g.classical-grammar], vocab: [w.gu2-si1, w.zing6-je6-si1, w.saang2-loek6] }
      - { es: "「舉頭望明月」用廣東話講，即係「抬起個頭望住個月亮」。", en: "In everyday Cantonese, 'raise head, gaze at bright moon' means 'lift your head and look at the moon'.", altEs: ["「舉頭望明月」即係「抬起個頭望住個月亮」。"], grammar: [g.classical-grammar], vocab: [w.geoi2-tau4, w.ming4-jyut6] }
      - { es: "「春風又綠江南岸」入面，「綠」用咗做動詞。", en: "In 'the spring wind greens the south bank again', 'green' is used as a verb.", altEs: ["「春風又綠江南岸」嘅「綠」係用做動詞。"], grammar: [g.classical-grammar], vocab: [w.ceon1-fung1, w.luk6.b, w.gong1-naam4, w.ngon6], transform: { instruction: "Say it in colloquial Cantonese: the spring wind has made the south bank green again", answer: "春風又將江南嘅河岸吹綠咗。", alt: ["春風又令江南嘅河岸變綠咗。", "春風又吹到江南嘅河岸綠晒。"] } }
      - { es: "月落烏啼霜滿天，江楓漁火對愁眠。", en: "The moon sets, crows caw, frost fills the sky; river maples and fishing lights face my sorrowful sleep.", grammar: [g.classical-grammar], vocab: [w.soeng1.c, w.fung1.c, w.jyu4-fo2, w.sau4, w.min4], jp: "jyut6 lok6 wu1 tai4 soeng1 mun5 tin1 gong1 fung1 jyu4 fo2 deoi3 sau4 min4" }
      - { es: "姑蘇城外寒山寺，夜半鐘聲到客船。", en: "From Hanshan Temple outside Gusu, the midnight bell reaches the traveller's boat.", grammar: [g.classical-grammar], vocab: [w.gu1-sou1, w.hon4-saan1-zi6, w.zung1-sing1, w.haak3-syun4] }
      - { es: "張繼喺船上面瞓唔着，聽到寒山寺嘅鐘聲，就寫咗〈楓橋夜泊〉。", en: "Zhang Ji couldn't sleep on his boat; he heard the bell of Hanshan Temple and wrote 'Night Mooring by Maple Bridge'.", altEs: ["張繼喺船度瞓唔着，聽到寒山寺嘅鐘聲，寫咗〈楓橋夜泊〉。"], grammar: [g.classical-grammar], vocab: [w.zoeng1-gai3, w.hon4-saan1-zi6, w.fung1-kiu4-je6-bok6] }
      - { es: "白日依山盡，黃河入海流。", en: "The white sun sinks behind the mountains; the Yellow River flows into the sea.", grammar: [g.classical-grammar], vocab: [w.baak6-jat6, w.wong4-ho4] }
      - { es: "欲窮千里目，更上一層樓。", en: "To see a thousand li further, climb one more storey.", grammar: [g.classical-grammar], vocab: [w.cin1-lei5, w.muk6, w.gang3-soeng5-jat1-cang4-lau4] }
      - { es: "想睇得更遠，就要行多一層樓。", en: "If you want to see further, you have to climb another floor.", altEs: ["想睇遠啲，就要行上多一層。", "想睇得更加遠，就要再上一層樓。"], grammar: [g.classical-grammar], vocab: [w.gang3-soeng5-jat1-cang4-lau4], jp: "soeng2 tai2 dak1 gang3 jyun5 zau6 jiu3 haang4 do1 jat1 cang4 lau2", note: "A colloquial retelling of Wang Zhihuan's lines." }
      - { es: "紅豆生南國，春來發幾枝。", en: "Red beans grow in the southern land; in spring, how many sprigs come forth?", grammar: [g.classical-grammar], vocab: [w.hung4-dau2, w.naam4-gwok3] }
      - { es: "王維用紅豆代表思念，所以紅豆又叫相思豆。", en: "Wang Wei used red beans to stand for longing, so they're also called 'lovesick beans'.", altEs: ["王維用紅豆代表相思，所以紅豆又叫相思豆。"], grammar: [g.classical-grammar], vocab: [w.wong4-wai4, w.hung4-dau2, w.soeng1-si1-dau2], transform: { instruction: "Ask why red beans are also called lovesick beans", answer: "點解紅豆又叫相思豆？", alt: ["紅豆點解又叫相思豆㗎？", "點解紅豆又叫做相思豆？"] } }
      - { es: "古文入面嘅「之」，大概等於廣東話嘅「嘅」。", en: "Classical 之 roughly corresponds to Cantonese 嘅.", altEs: ["古文嘅「之」，差唔多等於廣東話嘅「嘅」。"], grammar: [g.classical-grammar], vocab: [w.gu2-man4], error: { wrong: "古文入面嘅「之」，大概等於廣東話嘅「咗」。", explain: "之 marks possession like 嘅 (or stands for 'it', like 佢); it has nothing to do with the aspect marker 咗.", grammar: g.classical-grammar } }
      - { es: "唔好逐個字咁譯，要先明白成句嘅意思。", en: "Don't translate word by word; understand the whole line first.", altEs: ["唔好一個字一個字咁譯，要先明白成句嘅意思。"], grammar: [g.classical-grammar], vocab: [w.si1-geoi3] }
      - { es: "孟浩然一覺瞓到天光，連雀仔叫都唔知。", en: "Meng Haoran slept right through till daybreak and didn't even hear the birds.", altEs: ["孟浩然瞓到天光，連雀仔叫都聽唔到。"], grammar: [g.classical-grammar], vocab: [w.maang6-hou6-jin4], jp: "maang6 hou6 jin4 jat1 gaau3 fan3 dou3 tin1 gwong1 lin4 zoek3 zai2 giu3 dou1 m4 zi1" }
    exchanges:
      - q: { es: "「春眠不覺曉」係咩意思？", en: "What does 'sleeping in spring, I miss the dawn' mean?" }
        a: { es: "春天瞓得太舒服，唔知唔覺已經天光。", en: "You sleep so comfortably in spring that before you know it, it's light." }
        alt: ["春天瞓到天光都唔知。", "即係春天好好瞓。"]
        grammar: [g.classical-grammar]
        vocab: [w.ceon1-hiu2]
      - q: { es: "點解古詩成日冇主語？", en: "Why do classical poems so often have no subject?" }
        a: { es: "因為古詩好簡潔，主語靠讀者自己估。", en: "Because classical verse is terse; the reader works out the subject." }
        alt: ["因為大家都知係詩人自己。", "古詩要簡潔囉。"]
        grammar: [g.classical-grammar]
        vocab: [w.gu2-si1]
      - q: { es: "寒山寺喺邊度㗎？", en: "Where is Hanshan Temple?" }
        a: { es: "喺蘇州，即係詩入面嘅姑蘇。", en: "In Suzhou, the 'Gusu' of the poem." }
        alt: ["喺蘇州。", "姑蘇，即係蘇州。"]
        grammar: [g.classical-grammar]
        vocab: [w.hon4-saan1-zi6, w.gu1-sou1]
      - q: { es: "「更上一層樓」而家點用？", en: "How is 'climb one more storey' used today?" }
        a: { es: "用嚟鼓勵人再進步，例如「祝你嘅廣東話更上一層樓」。", en: "To encourage people to improve further, as in 'may your Cantonese reach new heights'." }
        alt: ["祝人再進步。", "即係希望人再好啲。"]
        grammar: [g.classical-grammar]
        vocab: [w.gang3-soeng5-jat1-cang4-lau4]
      - q: { es: "紅豆點解代表相思？", en: "Why do red beans stand for longing?" }
        a: { es: "因為王維寫咗〈相思〉，用紅豆講掛住一個人。", en: "Because Wang Wei wrote 'Longing', using red beans for missing someone." }
        alt: ["因為王維嘅詩。", "王維寫過囉。"]
        grammar: [g.classical-grammar]
        vocab: [w.hung4-dau2, w.wong4-wai4]
    texts:
      - title: "用廣東話講〈春曉〉"
        es: ["春天瞓得好舒服，唔知唔覺就天光。", "周圍都聽到雀仔叫。", "尋晚又風又雨，唔知啲花跌咗幾多呢？"]
        en: ["Spring sleep is so comfortable that before you know it, it's daylight.", "You can hear birds singing all around.", "There was wind and rain last night; I wonder how many blossoms fell?"]
        grammar: [g.classical-grammar]
        vocab: [w.ceon1-hiu2]
      - title: "由蘇州寄嚟嘅明信片"
        es: ["Leo，我喺蘇州寒山寺寫緊呢張明信片。", "頭先聽到鐘聲，我即刻諗起〈楓橋夜泊〉。", "你喺佛山記得幫我睇醒獅！"]
        en: ["Leo, I'm writing this postcard at Hanshan Temple in Suzhou.", "I just heard the bell and immediately thought of 'Night Mooring by Maple Bridge'.", "Watch the lion dance for me in Foshan!"]
        grammar: [g.classical-grammar]
        vocab: [w.hon4-saan1-zi6, w.zung1-sing1, w.fung1-kiu4-je6-bok6]
    spicy:
      - { es: "春眠不覺曉，因為我成晚都夢見你。", en: "I slept through the spring dawn, because I dreamt of you all night.", altEs: ["春眠不覺曉，因為我發咗成晚夢，夢見你。"], grammar: [g.classical-grammar], vocab: [w.hiu2, w.min4], jp: "ceon1 min4 bat1 gok3 hiu2 jan1 wai6 ngo5 seng4 maan5 dou1 mung6 gin3 nei5" }
      - { es: "紅豆生南國，我就想坐喺你隔籬。", en: "Red beans grow in the south; I just want to sit next to you.", altEs: ["紅豆生南國，我淨係想坐喺你隔籬。"], grammar: [g.classical-grammar], vocab: [w.hung4-dau2, w.naam4-gwok3] }
      - { es: "欲窮千里目，更上一層樓；想追到你，我要更加努力。", en: "To see further, climb another storey; to win you over, I'll have to try harder.", altEs: ["欲窮千里目，更上一層樓；想追到你，我要再努力啲。"], grammar: [g.classical-grammar], vocab: [w.gang3-soeng5-jat1-cang4-lau4] }
      - { es: "古詩唔使講主語，我都唔使講名，你知我掛住邊個。", en: "Classical poems don't need a subject, and I don't need to say a name: you know who I miss.", altEs: ["古詩唔使主語，我都唔使講名，你知我掛住邊個啦。"], grammar: [g.classical-grammar], vocab: [w.gu2-si1] }
  - id: c2.u06.l4
    title: 西出陽關無故人
    teach: [g.classical-grammar, g.entering-tones]
    vocab: [w.wong4-wai4, w.dou6-fu2, w.baak6-geoi1-ji6, w.coeng4-on1, w.joeng4-gwaan1, w.hyun3, w.gu3-jan4, w.bui6-zung6, w.bui6-syu1, w.jam4, w.jam4-si1, w.long5-zung6, w.ging2-mat6, w.syu1-faat3, w.cing4-waai4, w.saan1-seoi2, w.tin4-jyun4, w.bin1-coi3, w.gu2-man4, w.coi4-zi2, w.ming4-geoi3, w.lau4-cyun4, w.cin1-gu2, w.si1-ji3, w.cin1-lei5, w.sai1-on1]
    tip: "Reciting poems aloud is how Cantonese speakers learn them: read slowly, keep the entering tones short and paraphrase each line in colloquial Cantonese afterwards."
    sentences:
      - { es: "細個背唐詩，我淨係識讀，唔明意思。", en: "When I memorised Tang poems as a child, I could only recite them without understanding them.", altEs: ["細個背唐詩，我淨係識讀，唔知咩意思。"], grammar: [g.classical-grammar], vocab: [w.tong4-si1], jp: "sai3 go3 bui6 tong4 si1 ngo5 zing6 hai6 sik1 duk6 m4 ming4 ji3 si1" }
      - { es: "白居易嘅詩好淺白，相傳佢寫完會讀畀阿婆聽。", en: "Bai Juyi's poems are very plain; legend says he read each one to an old woman when he'd finished it.", altEs: ["白居易啲詩好淺白，聽講佢寫完會讀畀阿婆聽。"], grammar: [g.classical-grammar], vocab: [w.baak6-geoi1-ji6] }
      - { es: "大家叫李白做「詩仙」，叫杜甫做「詩聖」。", en: "People call Li Bai the 'Immortal of Poetry' and Du Fu the 'Sage of Poetry'.", altEs: ["李白叫做「詩仙」，杜甫叫做「詩聖」。"], grammar: [g.classical-grammar], vocab: [w.lei5-baak6, w.dou6-fu2] }
      - { es: "王維嘅山水詩好有詩意，人哋話佢「詩中有畫」。", en: "Wang Wei's landscape poems are deeply poetic; people say 'there are paintings in his poems'.", altEs: ["王維啲山水詩好有詩意，大家話佢「詩中有畫」。"], grammar: [g.classical-grammar], vocab: [w.wong4-wai4, w.saan1-seoi2, w.si1-ji3] }
      - { es: "勸君更盡一杯酒，西出陽關無故人。", en: "I urge you to drain one more cup of wine: west of Yangguan Pass you'll have no old friends.", grammar: [g.classical-grammar], vocab: [w.hyun3, w.joeng4-gwaan1, w.gu3-jan4], jp: "hyun3 gwan1 gang3 zeon6 jat1 bui1 zau2 sai1 ceot1 joeng4 gwaan1 mou4 gu3 jan4" }
      - { es: "呢兩句係王維送朋友去邊塞嗰陣寫嘅。", en: "Wang Wei wrote these two lines when seeing off a friend to the frontier.", altEs: ["呢兩句係王維送朋友去邊塞嘅時候寫嘅。"], grammar: [g.classical-grammar], vocab: [w.wong4-wai4, w.bin1-coi3], transform: { instruction: "Turn it into a question: when did Wang Wei write these two lines?", answer: "呢兩句係王維幾時寫嘅？", alt: ["王維幾時寫呢兩句㗎？", "呢兩句王維係幾時寫嘅？"] } }
      - { es: "長安係唐朝嘅首都，即係而家嘅西安。", en: "Chang'an was the capital of the Tang dynasty, today's Xi'an.", altEs: ["唐朝嘅首都係長安，即係而家嘅西安。"], grammar: [g.classical-grammar], vocab: [w.coeng4-on1, w.sai1-on1] }
      - { es: "朗誦唐詩要慢慢讀，入聲字要收得乾淨。", en: "Recite Tang poems slowly, and cut the entering tones off cleanly.", altEs: ["朗誦唐詩要讀慢啲，入聲字收得乾淨啲。"], grammar: [g.entering-tones], vocab: [w.long5-zung6, w.jap6-sing1] }
      - { es: "呢首田園詩寫鄉下生活，好平靜。", en: "This pastoral poem is about country life; it's very peaceful.", altEs: ["呢首田園詩寫鄉村生活，好寧靜。"], grammar: [g.classical-grammar], vocab: [w.tin4-jyun4] }
      - { es: "邊塞詩寫打仗同大漠，同山水詩嘅意境好唔同。", en: "Frontier poems are about war and the great desert; their mood is very different from landscape poems.", altEs: ["邊塞詩寫打仗同沙漠，意境同山水詩好唔同。"], grammar: [g.classical-grammar], vocab: [w.bin1-coi3, w.saan1-seoi2, w.ji3-ging2] }
      - { es: "呢句名句流傳咗千幾年，到而家仲有人用。", en: "This famous line has been handed down for over a thousand years, and people still use it today.", altEs: ["呢句名句流傳咗一千幾年，到而家仲有人引用。"], grammar: [g.classical-grammar], vocab: [w.ming4-geoi3, w.lau4-cyun4] }
      - { es: "古時嘅才子個個都識吟詩作對。", en: "In the old days every gifted scholar could chant poems and compose couplets.", altEs: ["以前嘅才子個個都識吟詩作對。"], grammar: [g.classical-grammar], vocab: [w.coi4-zi2, w.jam4-si1] }
      - { es: "你唔使背晒成首，記住啲名句已經夠。", en: "You don't need to memorise the whole poem; remembering the famous lines is enough.", altEs: ["唔使背晒成首，記得啲名句就夠。"], grammar: [g.classical-grammar], vocab: [w.ming4-geoi3], jp: "nei5 m4 sai2 bui6 saai3 seng4 sau2 gei3 zyu6 di1 ming4 geoi3 ji5 ging1 gau3", error: { wrong: "你唔使背晒成首，記住啲名句已經唔夠。", explain: "The point is that remembering the famous lines is enough (已經夠), so 唔使 'no need' makes sense.", grammar: g.classical-grammar } }
      - { es: "詩人借景物抒發自己嘅情懷。", en: "Poets use the scenery to express their own feelings.", altEs: ["詩人用景物抒發自己嘅情懷。"], grammar: [g.classical-grammar], vocab: [w.si1-jan4.b, w.ging2-mat6, w.syu1-faat3, w.cing4-waai4] }
      - { es: "呢個比賽要用廣東話吟一首千古傳誦嘅詩。", en: "This competition asks you to chant, in Cantonese, a poem recited through the ages.", altEs: ["呢個比賽要參加嘅人用廣東話吟一首千古傳誦嘅詩。"], grammar: [g.entering-tones], vocab: [w.jam4, w.cin1-gu2] }
      - { es: "佢背書好叻，一首律詩讀兩次就背到。", en: "He's great at learning by heart: he can memorise a regulated poem after reading it twice.", altEs: ["佢好識背書，一首律詩讀兩次就背得到。"], altEn: ["She's great at learning by heart: she can memorise a regulated poem after reading it twice."], grammar: [g.classical-grammar], vocab: [w.bui6-syu1, w.leot6-si1.b], jp: "keoi5 bui6 syu1 hou2 lek1 jat1 sau2 leot6 si1 duk6 loeng5 ci3 zau6 bui6 dou2", transform: { instruction: "Say it about yourself, negatively: I'm bad at learning by heart; I can't memorise it even after ten readings", answer: "我背書好差，一首律詩讀十次都背唔到。", alt: ["我唔識背書，一首律詩讀十次都背唔到。"] } }
    exchanges:
      - q: { es: "你細個要唔要背誦唐詩？", en: "Did you have to memorise Tang poems as a kid?" }
        a: { es: "要呀，日日都要背誦，唔識就要罰抄。", en: "Yes, we had to recite every day, and if we couldn't we had to copy them out as punishment." }
        alt: ["要，日日都要背誦。", "梗係要啦。"]
        grammar: [g.classical-grammar]
        vocab: [w.bui6-zung6, w.tong4-si1]
      - q: { es: "王維嘅詩有咩特色？", en: "What's special about Wang Wei's poems?" }
        a: { es: "好多都寫山水同田園，好似一幅畫咁。", en: "Many are about landscapes and the countryside, like a painting." }
        alt: ["好有詩意。", "詩中有畫囉。"]
        grammar: [g.classical-grammar]
        vocab: [w.wong4-wai4, w.saan1-seoi2, w.tin4-jyun4]
      - q: { es: "「西出陽關無故人」係咩意思？", en: "What does 'west of Yangguan Pass you'll have no old friends' mean?" }
        a: { es: "出咗陽關之後，身邊就冇老朋友喇。", en: "Once you're past Yangguan Pass, there'll be no old friends around you." }
        alt: ["出咗陽關就冇朋友喇。", "即係去到好遠，冇朋友喺身邊。"]
        grammar: [g.classical-grammar]
        vocab: [w.joeng4-gwaan1, w.gu3-jan4]
      - q: { es: "你點解記得咁快嘅？", en: "How do you memorise so fast?" }
        a: { es: "我用廣東話吟，有節奏，好易記。", en: "I chant it in Cantonese; it has a rhythm, so it's easy to remember." }
        alt: ["吟出嚟就易記。", "用廣東話吟囉。"]
        grammar: [g.entering-tones]
        vocab: [w.jam4]
      - q: { es: "你最鍾意邊句唐詩？", en: "Which line of Tang poetry do you like best?" }
        a: { es: "「欲窮千里目，更上一層樓」，好激勵人。", en: "'To see a thousand li further, climb one more storey'; it's so inspiring." }
        alt: ["「舉頭望明月，低頭思故鄉」。", "〈靜夜思〉嗰兩句。"]
        grammar: [g.classical-grammar]
        vocab: [w.gang3-soeng5-jat1-cang4-lau4, w.cin1-lei5]
    texts:
      - title: "朗誦比賽通告"
        es: ["下個月學校會搞中文朗誦比賽。", "參加嘅同學要用廣東話朗誦一首唐詩。", "請喺星期五之前搵中文老師報名。"]
        en: ["Next month the school is holding a Chinese recitation competition.", "Students taking part must recite a Tang poem in Cantonese.", "Please sign up with your Chinese teacher before Friday."]
        grammar: [g.entering-tones]
        vocab: [w.long5-zung6, w.tong4-si1]
      - title: "佛山之夜"
        es: ["晚上，我哋喺祖廟門口睇完醒獅。", "Bonchita 對住月亮吟咗句「舉頭望明月」。", "隔籬個阿伯拍手，仲幫佢接埋下一句。"]
        en: ["In the evening we watched the lion dance at the gate of the Ancestral Temple.", "Bonchita chanted 'I raise my head to gaze at the bright moon' at the moon.", "An old man next to us clapped and even gave her the next line."]
        grammar: [g.classical-grammar]
        vocab: [w.jam4, w.geoi2-tau4]
    spicy:
      - { es: "勸君更盡一杯酒，飲完呢杯，你仲未答應同我食飯。", en: "I urge you to drain one more cup; and when you've finished it, you still haven't agreed to dinner with me.", altEs: ["勸君更盡一杯酒，飲完呢杯你都未答應同我食飯。"], grammar: [g.classical-grammar], vocab: [w.hyun3], jp: "hyun3 gwan1 gang3 zeon6 jat1 bui1 zau2 jam2 jyun4 ni1 bui1 nei5 zung6 mei6 daap3 jing3 tung4 ngo5 sik6 faan6" }
      - { es: "你朗誦情詩嗰陣把聲好吸引，我差啲連自己個名都唔記得。", en: "Your voice is so captivating when you recite love poems that I nearly forgot my own name.", altEs: ["你朗誦情詩嘅時候把聲好吸引，我差啲連自己個名都唔記得。"], grammar: [g.classical-grammar], vocab: [w.long5-zung6], jp: "nei5 long5 zung6 cing4 si1 go2 zan6 baa2 seng1 hou2 kap1 jan5 ngo5 caa1 di1 lin4 zi6 gei2 go3 meng2 dou1 m4 gei3 dak1" }
      - { es: "我唔係才子，但係為咗你，我肯學吟詩。", en: "I'm no gifted scholar, but for you I'm willing to learn to chant poetry.", altEs: ["我唔係乜嘢才子，不過為咗你，我肯學吟詩。"], grammar: [g.classical-grammar], vocab: [w.coi4-zi2, w.jam4-si1] }
      - { es: "西出陽關無故人，不過我去到邊都會帶住你。", en: "West of Yangguan there are no old friends, but wherever I go I'll take you with me.", altEs: ["西出陽關無故人，但係我去到邊度都會帶住你。"], grammar: [g.classical-grammar], vocab: [w.joeng4-gwaan1, w.gu3-jan4], jp: "sai1 ceot1 joeng4 gwaan1 mou4 gu3 jan4 bat1 gwo3 ngo5 heoi3 dou3 bin1 dou1 wui5 daai3 zyu6 nei5" }
      - { es: "呢句千古名句我背咗，你個電話號碼我都背咗。", en: "I've learnt this timeless line by heart, and your phone number too.", altEs: ["呢句千古名句我背熟咗，你個電話號碼我都背熟咗。"], grammar: [g.classical-grammar], vocab: [w.cin1-gu2, w.ming4-geoi3], jp: "ni1 geoi3 cin1 gu2 ming4 geoi3 ngo5 bui6 zo2 nei5 go3 din6 waa2 hou6 maa5 ngo5 dou1 bui6 zo2" }
dialogues:
  - id: c2.u06.d1
    title: 祖廟門口嘅詩詞課
    context: Outside Foshan Ancestral Temple after the lion dance show, Leo asks the teacher of the poetry class how to read Tang poems in Cantonese.
    lines:
      - { speaker: 老師, es: "Leo，你嚟咗佛山幾日，學到啲咩新嘢呀？", en: "Leo, you've been in Foshan a few days now. What new things have you learnt?" }
      - { speaker: Leo, es: "我學咗用廣東話讀〈江雪〉，原來「絕」、「滅」、「雪」係押韻嘅。", en: "I've learnt to read 'River Snow' in Cantonese. It turns out 'vanish', 'die out' and 'snow' rhyme." }
      - { speaker: 老師, es: "啱，因為佢哋都係入聲字。用普通話讀，就聽唔出嚟。", en: "Right, because they're all entering-tone characters. Read them in Mandarin and you can't hear it." }
      - { speaker: Leo, es: "噉平仄又點分呢？我成日都搞亂。", en: "And how do you tell level from oblique? I always mix them up." }
      - { speaker: 老師, es: "好簡單，第一同第四聲係平聲，其他都係仄聲，入聲一定係仄。", en: "It's simple: tones 1 and 4 are level, the rest are oblique, and entering tones are always oblique." }
      - { speaker: Leo, es: "噉「床前明月光」就係平平平仄平？", en: "So 'before my bed, the bright moonlight' is level, level, level, oblique, level?" }
      - { speaker: 老師, es: "完全正確！你聽吓，「月」字特別短。", en: "Exactly right! Listen: the character 'moon' is especially short." }
      - { speaker: Leo, es: "不過「疑是地上霜」，點解冇講係邊個以為係霜？", en: "But in 'I took it for frost on the ground', why doesn't it say who thought it was frost?" }
      - { speaker: 老師, es: "古詩成日省略主語，讀者自然明白係詩人自己。", en: "Classical poems often leave out the subject; readers naturally understand it's the poet himself." }
      - { speaker: Leo, es: "明白！今晚我要對住月亮朗誦一次。", en: "Got it! Tonight I'm going to recite it to the moon." }
    questions:
      - { q: "點解〈江雪〉用廣東話讀會押韻？", options: ["因為佢哋都係平聲", "因為佢哋都係入聲字", "因為佢哋係同一個字"], answer: 1, explain: "絕, 滅 and 雪 are all entering-tone characters ending in -t, which Cantonese keeps." }
      - { q: "平聲係邊啲聲調？", options: ["第一同第四聲", "第二同第五聲", "所有入聲"], answer: 0, explain: "The teacher says 第一同第四聲係平聲." }
      - { q: "「月」字點解特別短？", options: ["因為佢係入聲字", "因為佢係平聲", "因為佢係第二聲"], answer: 0, explain: "月 (jyut6) is an entering tone: short, clipped and oblique." }
      - { q: "點解「疑是地上霜」冇講主語？", options: ["李白寫漏咗", "古詩成日省略主語", "主語喺下一首詩"], answer: 1, explain: "古詩成日省略主語: readers understand it's the poet." }
