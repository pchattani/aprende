id: r.b1.mi-piacerebbe-vivere-a-bologna
level: b1
title: Mi piacerebbe vivere a Bologna
kind: text
intro: A post on a forum for students. Ilaria, from a small town in Sicily, has to choose where to study next year and asks for advice. She weighs up life in Bologna using the conditional.
allow: [part, time, sara, ilaria, ragusa, bologna, bolognesi, alma, mater, studiorum, asinelli, garisenda, archiginnasio]
paragraphs:
  - { es: "Ciao a tutti! Mi chiamo Ilaria, ho diciannove anni e vengo da un paesino vicino a Ragusa, in Sicilia. A luglio finirò il liceo e a settembre vorrei iscrivermi all'università per studiare lettere. Ho tre possibilità: Palermo, Roma o Bologna. Il mio cuore dice Bologna, ma la mia testa non ne è sicura. Mi date un consiglio?", en: "Hi everyone! My name's Ilaria, I'm nineteen and I come from a small town near Ragusa, in Sicily. In July I'll finish secondary school and in September I'd like to enrol at university to study literature. I've got three options: Palermo, Rome or Bologna. My heart says Bologna, but my head isn't sure about it. Can you give me some advice?" }
  - { es: "Perché Bologna? Prima di tutto per l'università. L'Alma Mater Studiorum è la più antica del mondo occidentale: è stata fondata nel 1088. Mi piacerebbe tantissimo studiare in un posto con così tanta storia, e seguire le lezioni negli stessi palazzi dove hanno studiato Dante e Petrarca... o almeno così dicono.", en: "Why Bologna? First of all because of the university. The Alma Mater Studiorum is the oldest in the Western world: it was founded in 1088. I'd love to study in a place with so much history, and follow lectures in the same buildings where Dante and Petrarch studied... or so they say." }
  - { es: "Poi per la città. Ci sono stata una volta, in gita con la scuola, e me ne sono innamorata. Bologna ha quasi quaranta chilometri di portici: potrei andare dappertutto a piedi, anche quando piove, senza ombrello! La città è piena di studenti, ci sono librerie, concerti, mostre, e si mangia benissimo. Mi vedrei proprio bene seduta in Piazza Maggiore con un piatto di tagliatelle al ragù.", en: "Then because of the city. I went there once, on a school trip, and I fell in love with it. Bologna has almost forty kilometres of porticoes: I could walk everywhere, even when it rains, without an umbrella! The city is full of students, there are bookshops, concerts, exhibitions, and the food is wonderful. I can really picture myself sitting in Piazza Maggiore with a plate of tagliatelle al ragù." }
  - { es: "C'è anche un motivo meno serio, lo ammetto. La mia migliore amica, Sara, si è trasferita a Bologna l'anno scorso per studiare medicina. Mi manda continuamente foto delle Due Torri, delle osterie e delle feste con i suoi coinquilini. Mi ha detto che, se andassi anch'io, potrei dividere la camera con lei per i primi mesi, finché non trovo una stanza tutta mia. Sarebbe bellissimo ricominciare insieme in una città nuova.", en: "There's also a less serious reason, I admit. My best friend, Sara, moved to Bologna last year to study medicine. She keeps sending me photos of the Two Towers, the osterias and the parties with her flatmates. She told me that, if I went too, I could share her room for the first few months, until I find a room of my own. It would be wonderful to start again together in a new city." }
  - { es: "Però ci sono anche dei problemi. Il primo è l'affitto. Ho letto che una stanza singola costa almeno cinquecento euro al mese, e i miei genitori non potrebbero pagarmela per cinque anni. Dovrei trovare un lavoro part-time, magari in un bar o in una libreria, oppure chiedere una borsa di studio.", en: "But there are problems too. The first is the rent. I've read that a single room costs at least five hundred euros a month, and my parents couldn't pay for it for five years. I'd have to find a part-time job, maybe in a bar or a bookshop, or apply for a grant." }
  - { es: "Il secondo problema è il clima. Io sono abituata al sole e al mare. A Bologna d'inverno c'è la nebbia e fa freddo, e d'estate fa un caldo terribile. Mia nonna dice che mi ammalerei il primo mese. Il terzo problema è la distanza: da Bologna a Ragusa ci vogliono quasi due ore di aereo, più il viaggio fino a Catania. Non potrei tornare a casa ogni fine settimana.", en: "The second problem is the climate. I'm used to sunshine and the sea. In Bologna there's fog in winter and it's cold, and in summer it's terribly hot. My grandmother says I'd get sick in the first month. The third problem is the distance: from Bologna to Ragusa it takes almost two hours by plane, plus the journey to Catania. I couldn't go home every weekend." }
  - { es: "A Palermo, invece, sarei vicina alla famiglia e spenderei molto meno. Ma forse è proprio questo il punto: vorrei mettermi alla prova, conoscere persone nuove, diventare più indipendente. Avrei paura, certo, ma credo che ne varrebbe la pena.", en: "In Palermo, on the other hand, I'd be close to my family and I'd spend much less. But maybe that's exactly the point: I'd like to test myself, meet new people, become more independent. I'd be scared, of course, but I think it would be worth it." }
  - { es: "Voi che cosa fareste al mio posto? Se qualcuno studia a Bologna, potrebbe raccontarmi com'è davvero la vita lì? E conoscete qualche quartiere dove gli affitti non siano troppo cari? Grazie in anticipo a chi mi risponderà!", en: "What would you do in my place? If anyone studies in Bologna, could you tell me what life there is really like? And do you know any neighbourhoods where the rents aren't too expensive? Thanks in advance to anyone who replies!" }
questions:
  - { q: "Che cosa vorrebbe studiare Ilaria?", options: ["Medicina", "Lettere", "Economia"], answer: 1, explain: "«Vorrei iscrivermi all'università per studiare lettere.»" }
  - { q: "Perché l'università di Bologna è speciale?", options: ["È la più grande d'Italia", "È la più antica del mondo occidentale", "È gratis"], answer: 1, explain: "Founded in 1088, it's considered the oldest university in the Western world." }
  - { q: "Perché a Bologna si può camminare senza ombrello?", options: ["Perché non piove mai", "Perché ci sono quasi quaranta chilometri di portici", "Perché la città è piccola"], answer: 1, explain: "The famous porticoes cover almost 40 km of streets." }
  - { q: "Quale NON è uno dei problemi di cui parla Ilaria?", options: ["L'affitto", "Il clima", "La lingua"], answer: 2, explain: "She mentions rent, climate and distance – not language." }
  - { q: "Perché, alla fine, Ilaria pensa di scegliere Bologna?", options: ["Perché vuole mettersi alla prova e diventare più indipendente", "Perché i genitori vogliono così", "Perché costa meno di Palermo"], answer: 0, explain: "«Vorrei mettermi alla prova, conoscere persone nuove, diventare più indipendente.»" }
glossary:
  - { es: liceo, en: secondary school (academic) }
  - { es: tantissimo, en: very much }
  - { es: oppure, en: or (else) }
  - { es: ricominciare, en: to start again }
  - { es: lettere, en: (study of) literature, humanities }
  - { es: portici, en: porticoes, arcades }
  - { es: dappertutto, en: everywhere }
  - { es: mi vedrei, en: I can picture myself }
  - { es: terribile, en: terrible }
  - { es: distanza, en: distance }
  - { es: mettermi alla prova, en: to test myself }
  - { es: indipendente, en: independent }
  - { es: varrebbe, en: (ne varrebbe la pena) it would be worth it }
  - { es: in anticipo, en: in advance }
