id: r.b2.magari-fossi-rimasta-a-procida
level: b2
title: Magari fossi rimasta a Procida
kind: text
intro: Teresa left the island of Procida for Milan twenty years ago. In a letter to her old school friend Anna, who never left, she looks back with wishes and regrets. Notice magari, se solo, vorrei che and the sequence of tenses.
allow: [teresa, anna, procida, corricella, troisi, massimo, neruda, ischia, milano, procidani, terra, murata, pozzuoli]
paragraphs:
  - { es: "Cara Anna, ieri sera, tornando a casa sotto la pioggia, ho visto in una vetrina una foto della Corricella: le case rosa, gialle e azzurre, le barche dei pescatori, la chiesa in alto. Mi sono fermata a guardarla per cinque minuti, come una stupida, mentre la gente mi passava accanto con gli ombrelli. E ho pensato: magari fossi lì adesso.", en: "Dear Anna, yesterday evening, walking home in the rain, I saw a photo of the Corricella in a shop window: the pink, yellow and blue houses, the fishing boats, the church up above. I stopped and looked at it for five minutes, like an idiot, while people brushed past me with their umbrellas. And I thought: if only I were there now." }
  - { es: "Sono passati vent'anni da quando ho preso il traghetto per Pozzuoli con due valigie e un contratto di lavoro in tasca. Ricordi? Tu mi accompagnasti al porto e mi dicesti: «Vedrai che tornerai.» Io ti risposi che Procida era troppo piccola per me, che volevo una vita vera, una carriera, una grande città. Avevo ventitré anni e credevo di sapere tutto.", en: "It's been twenty years since I took the ferry to Pozzuoli with two suitcases and a job contract in my pocket. Remember? You came with me to the harbour and said: 'You'll see, you'll come back.' I replied that Procida was too small for me, that I wanted a real life, a career, a big city. I was twenty-three and I thought I knew everything." }
  - { es: "Non voglio lamentarmi troppo. Milano mi ha dato molto: un buon lavoro, un appartamento luminoso, amici interessanti. Ma da qualche tempo mi sveglio la mattina con la sensazione di aver sbagliato qualcosa. Vorrei che qualcuno mi avesse detto, allora, che la «vita vera» non si misura in metri quadrati o in riunioni importanti. Se solo ti avessi ascoltata!", en: "I don't want to complain too much. Milan has given me a lot: a good job, a bright flat, interesting friends. But for some time now I've been waking up in the morning with the feeling that I got something wrong. I wish someone had told me back then that 'real life' isn't measured in square metres or important meetings. If only I'd listened to you!" }
  - { es: "Mi mancano cose piccolissime. Mi manca l'odore del pane la mattina presto in via Vittorio Emanuele. Mi mancano i limoni enormi del giardino di tua madre, e il silenzio dell'isola d'inverno, quando i turisti se ne sono andati e restiamo solo noi procidani. Mi manca perfino il vento che ci faceva perdere il traghetto. Qui a Milano nessuno perde il treno per colpa del vento: lo perde per colpa di una riunione.", en: "I miss tiny things. I miss the smell of bread early in the morning in Via Vittorio Emanuele. I miss the huge lemons in your mother's garden, and the silence of the island in winter, when the tourists have gone and only we Procidans are left. I even miss the wind that used to make us miss the ferry. Here in Milan nobody misses the train because of the wind: they miss it because of a meeting." }
  - { es: "Ho letto che nel 2022 Procida è stata Capitale italiana della Cultura e che da allora l'isola si è riempita di visitatori. Mia madre mi ha detto che anche il bar di tuo zio, quello dove girarono una scena del film «Il Postino» con Massimo Troisi, adesso è sempre pieno. Sono contenta per voi, davvero. Però, egoisticamente, speravo che l'isola restasse com'era, come se mi stesse aspettando.", en: "I read that in 2022 Procida was the Italian Capital of Culture and that since then the island has filled up with visitors. My mother told me that even your uncle's bar, the one where they filmed a scene of 'Il Postino' with Massimo Troisi, is always full now. I'm happy for you, really. But, selfishly, I hoped the island would stay as it was, as if it were waiting for me." }
  - { es: "Ti scrivo anche per un motivo pratico. L'azienda per cui lavoro permette di lavorare da remoto. Sto pensando seriamente di tornare, almeno per qualche mese all'anno. Non so se sia una follia. Magari tra un anno mi pentirò anche di questa decisione. Ma preferirei pentirmi di aver provato che di non averlo fatto.", en: "I'm also writing for a practical reason. The company I work for allows remote working. I'm seriously thinking of coming back, at least for a few months a year. I don't know if it's crazy. Maybe in a year I'll regret this decision too. But I'd rather regret having tried than not having done it." }
  - { es: "Tu che cosa ne pensi? Avevi ragione tu, vent'anni fa. Vorrei che me lo dicessi anche adesso, sinceramente, come solo tu sai fare. Ti abbraccio forte, Teresa.", en: "What do you think? You were right, twenty years ago. I'd like you to tell me now too, honestly, as only you can. A big hug, Teresa." }
questions:
  - { q: "Che cosa ha fatto pensare Teresa a Procida?", options: ["Una telefonata di Anna", "Una foto della Corricella in una vetrina", "Un film alla televisione"], answer: 1, explain: "She saw a photo of the Corricella in a shop window while walking home in the rain." }
  - { q: "Che cosa disse Anna a Teresa al porto, vent'anni fa?", options: ["«Vedrai che tornerai»", "«Non tornare mai»", "«Vengo anch'io»"], answer: 0, explain: "Note the passato remoto in the letter (mi dicesti, ti risposi) for a distant past event – common in the South." }
  - { q: "Di che cosa si rammarica Teresa?", options: ["Di non aver ascoltato Anna", "Di aver comprato casa a Milano", "Di aver perso il lavoro"], answer: 0, explain: "«Se solo ti avessi ascoltata!» – a regret about the past with se solo + congiuntivo trapassato." }
  - { q: "Che cosa è successo a Procida nel 2022?", options: ["È stata Capitale italiana della Cultura", "Hanno girato «Il Postino»", "Hanno chiuso il porto"], answer: 0, explain: "Procida was Italian Capital of Culture in 2022. Il Postino was filmed there in the 1990s." }
  - { q: "Che cosa sta pensando di fare Teresa?", options: ["Lasciare il lavoro", "Tornare a Procida per qualche mese all'anno, lavorando da remoto", "Comprare il bar dello zio di Anna"], answer: 1, explain: "Her company allows remote work, so she's considering spending part of the year on the island." }
