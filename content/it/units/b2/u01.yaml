id: b2.u01
title: "Se avessi tempo..."
lessons:
  - id: b2.u01.l1
    title: Pensavo che fosse più facile
    teach: [g.congiuntivo-imperfetto]
    vocab: [w.colloquio-di-lavoro, w.flessibile, w.sede, w.delegare, w.impegnativo, w.stimolante, w.presso, w.coordinare, w.efficiente, w.affidabile, w.competente, w.assumersi, w.gestione, w.gestire, w.concedere, w.escludere, w.retribuzione, w.concorso, w.carriera-accademica, w.autonomia, w.autonomo, w.efficienza, w.produttività, w.approvazione, w.gratificante, w.condizione, w.assistente]
    tip: "After a verb in the past (pensavo, volevano, era importante) the congiuntivo moves to the imperfetto: pensavo che fosse, volevano che lavorassi. Essere → fossi, stare → stessi, dare → dessi, fare → facessi."
    sentences:
      - { es: "Pensavo che il colloquio di lavoro fosse più facile.", en: "I thought the job interview would be easier.", altEs: ["Credevo che il colloquio di lavoro fosse più facile.", "Pensavo che il colloquio fosse più facile."], altEn: ["I thought the job interview was going to be easier."], grammar: [g.congiuntivo-imperfetto], vocab: [w.colloquio-di-lavoro] }
      - { es: "Il direttore voleva che fossi flessibile con gli orari.", en: "The manager wanted me to be flexible with the hours.", altEs: ["Il direttore voleva che io fossi flessibile con gli orari.", "La direttrice voleva che fossi flessibile con gli orari."], grammar: [g.congiuntivo-imperfetto], vocab: [w.flessibile, w.direttore] }
      - { es: "Speravo che la sede dell'azienda fosse a Napoli e non a Milano.", en: "I was hoping the company's head office would be in Naples and not in Milan.", altEs: ["Speravo che la sede della ditta fosse a Napoli e non a Milano.", "Speravo che la sede dell'azienda fosse a Napoli, non a Milano."], grammar: [g.congiuntivo-imperfetto], vocab: [w.sede, w.azienda] }
      - { es: "Era importante che il nuovo capo sapesse delegare.", en: "It was important that the new boss knew how to delegate.", altEs: ["Era importante che la nuova capa sapesse delegare.", "Bisognava che il nuovo capo sapesse delegare."], grammar: [g.congiuntivo-imperfetto, g.congiuntivo-impersonal], vocab: [w.delegare, w.capo] }
      - { es: "Non immaginavo che il lavoro fosse così impegnativo, ma anche così stimolante.", en: "I didn't imagine the job would be so demanding, but also so stimulating.", altEs: ["Non pensavo che il lavoro fosse così impegnativo, ma anche così stimolante.", "Non immaginavo che il lavoro fosse tanto impegnativo, ma anche tanto stimolante."], grammar: [g.congiuntivo-imperfetto], vocab: [w.impegnativo, w.stimolante] }
      - { es: "Mi hanno chiesto se lavorassi già presso un'altra azienda.", en: "They asked me whether I was already working at another company.", altEs: ["Mi hanno domandato se lavorassi già presso un'altra azienda.", "Mi hanno chiesto se lavoravo già presso un'altra azienda."], grammar: [g.congiuntivo-imperfetto, g.reported-questions], vocab: [w.presso], note: "In careful Italian, indirect questions after a past verb take the congiuntivo; in speech you will also hear the indicative (lavoravo)." }
      - { es: "Bisognava che qualcuno coordinasse la squadra di Napoli e quella di Roma.", en: "Someone needed to coordinate the Naples team and the Rome one.", altEs: ["Era necessario che qualcuno coordinasse la squadra di Napoli e quella di Roma."], grammar: [g.congiuntivo-imperfetto, g.congiuntivo-impersonal], vocab: [w.coordinare, w.squadra] }
      - { es: "Il capo non credeva che fossimo abbastanza efficienti.", en: "The boss didn't believe we were efficient enough.", altEs: ["Il capo non pensava che fossimo abbastanza efficienti."], grammar: [g.congiuntivo-imperfetto, g.congiuntivo-opinion], vocab: [w.efficiente], transform: { instruction: "Change 'we' to 'you (plural)'", answer: "Il capo non credeva che foste abbastanza efficienti.", alt: ["Il capo non credeva che voi foste abbastanza efficienti."], en: "The boss didn't believe you were efficient enough." } }
      - { es: "Volevano che dimostrassi di essere affidabile e competente.", en: "They wanted me to show that I was reliable and competent.", altEs: ["Volevano che io dimostrassi di essere affidabile e competente.", "Volevano che dimostrassi di essere competente e affidabile."], grammar: [g.congiuntivo-imperfetto, g.congiuntivo-vs-infinitive], vocab: [w.affidabile, w.competente, w.dimostrare] }
      - { es: "Era strano che nessuno si assumesse la responsabilità della gestione.", en: "It was strange that nobody took on responsibility for the management.", altEs: ["Era strano che nessuno si prendesse la responsabilità della gestione."], grammar: [g.congiuntivo-imperfetto, g.congiuntivo-impersonal], vocab: [w.assumersi, w.gestione, w.responsabilità] }
      - { es: "Pensavi davvero che ti concedessero lo smart working il primo giorno?", en: "Did you really think they would grant you remote working on the first day?", altEs: ["Credevi davvero che ti concedessero lo smart working il primo giorno?", "Pensavi sul serio che ti concedessero lo smart working il primo giorno?"], grammar: [g.congiuntivo-imperfetto], vocab: [w.concedere, w.smart-working] }
      - { es: "Non escludevano che la retribuzione aumentasse dopo il primo anno.", en: "They didn't rule out the pay going up after the first year.", altEs: ["Non escludevano che la retribuzione salisse dopo il primo anno."], grammar: [g.congiuntivo-imperfetto], vocab: [w.escludere, w.retribuzione, w.aumentare] }
      - { es: "Mio padre sperava che vincessi il concorso e facessi carriera accademica.", en: "My father hoped I would win the competitive exam and have an academic career.", altEs: ["Mio padre sperava che io vincessi il concorso e facessi carriera accademica.", "Mio papà sperava che vincessi il concorso e facessi carriera accademica."], grammar: [g.congiuntivo-imperfetto, g.congiuntivo-wishes-emotion], vocab: [w.concorso, w.carriera-accademica] }
      - { es: "Credevo che fossi già in ufficio.", en: "I thought you were already at the office.", altEs: ["Pensavo che fossi già in ufficio.", "Credevo che tu fossi già in ufficio."], grammar: [g.congiuntivo-imperfetto, g.concordanza-congiuntivo], vocab: [w.ufficio], error: { wrong: "Credevo che eri già in ufficio.", explain: "After a past verb of opinion (credevo) standard Italian uses the congiuntivo imperfetto: fossi. 'Che eri' is very colloquial.", grammar: g.congiuntivo-imperfetto } }
      - { es: "Volevano che stessi in sede fino alle sei.", en: "They wanted me to stay at head office until six.", altEs: ["Volevano che io stessi in sede fino alle sei.", "Volevano che restassi in sede fino alle sei."], grammar: [g.congiuntivo-imperfetto], vocab: [w.sede], error: { wrong: "Volevano che stassi in sede fino alle sei.", explain: "stare has an irregular congiuntivo imperfetto: stessi, not stassi (like dare → dessi).", grammar: g.congiuntivo-imperfetto } }
      - { es: "Voglio che tu gestisca il progetto.", en: "I want you to manage the project.", altEs: ["Voglio che sia tu a gestire il progetto."], grammar: [g.congiuntivo-imperfetto, g.concordanza-congiuntivo], vocab: [w.gestire, w.progetto], transform: { instruction: "Put the main verb in the past: Volevo che…", answer: "Volevo che tu gestissi il progetto.", alt: ["Volevo che gestissi il progetto."], en: "I wanted you to manage the project." } }
    exchanges:
      - q: { es: "Com'è andato il colloquio di lavoro?", en: "How did the job interview go?" }
        a: { es: "Bene, anche se pensavo che mi facessero più domande sulla gestione della squadra.", en: "Well, although I thought they'd ask me more questions about managing the team." }
        alt: ["Benissimo: credevo che fosse più difficile.", "Male: volevano che parlassi tedesco."]
        grammar: [g.congiuntivo-imperfetto]
        vocab: [w.colloquio-di-lavoro, w.gestione]
      - q: { es: "Che cosa ti hanno chiesto?", en: "What did they ask you?" }
        a: { es: "Volevano sapere se fossi capace di lavorare in autonomia.", en: "They wanted to know whether I was able to work independently." }
        alt: ["Se sapessi lavorare in autonomia.", "Mi hanno chiesto se fossi una persona autonoma."]
        grammar: [g.congiuntivo-imperfetto, g.reported-questions]
        vocab: [w.autonomia, w.autonomo]
      - q: { es: "Ti hanno concesso l'orario flessibile?", en: "Did they give you flexible hours?" }
        a: { es: "Sì, anche se temevo che il direttore non desse la sua approvazione.", en: "Yes, though I was afraid the manager wouldn't give his approval." }
        alt: ["Sì, finalmente!", "No, volevano che fossi in sede alle otto."]
        grammar: [g.congiuntivo-imperfetto, g.congiuntivo-wishes-emotion]
        vocab: [w.orario-flessibile, w.approvazione, w.concedere]
      - q: { es: "Che tipo di persona cercava l'azienda?", en: "What kind of person was the company looking for?" }
        a: { es: "Cercava qualcuno che fosse efficiente e che sapesse coordinare una squadra.", en: "It was looking for someone who was efficient and who knew how to coordinate a team." }
        alt: ["Qualcuno che fosse affidabile.", "Cercavano una persona che sapesse lavorare in autonomia."]
        grammar: [g.congiuntivo-imperfetto]
        vocab: [w.efficiente, w.coordinare]
      - q: { es: "Perché hai lasciato il posto a Caserta?", en: "Why did you leave the job in Caserta?" }
        a: { es: "Era un lavoro gratificante, ma il viaggio ogni giorno era troppo: volevo che la sede fosse più vicina.", en: "It was a rewarding job, but the journey every day was too much: I wanted the office to be closer." }
        alt: ["Volevo che la sede fosse più vicina a casa.", "Per il viaggio: due ore al giorno erano troppe."]
        grammar: [g.congiuntivo-imperfetto]
        vocab: [w.gratificante, w.sede]
    texts:
      - title: "Messaggio a un'amica"
        es: ["Ciao Giulia, il colloquio presso la sede di Napoli è andato bene!", "Pensavo che cercassero solo un assistente, invece volevano qualcuno che coordinasse tutto l'ufficio.", "Mi hanno detto che per loro l'efficienza conta più dell'orario."]
        en: ["Hi Giulia, the interview at the Naples office went well!", "I thought they were only looking for an assistant, but they wanted someone to coordinate the whole office.", "They told me that for them efficiency matters more than the hours."]
        grammar: [g.congiuntivo-imperfetto]
        vocab: [w.presso, w.coordinare, w.efficienza, w.assistente]
      - title: "Dal diario di Marco"
        es: ["Il primo giorno credevo che tutti fossero più competenti di me.", "Il capo voleva che lavorassi in autonomia, ma nessuno mi spiegava niente.", "Le condizioni non erano facili, eppure la produttività della squadra era altissima."]
        en: ["On the first day I thought everyone was more competent than me.", "The boss wanted me to work independently, but nobody explained anything to me.", "The conditions weren't easy, and yet the team's productivity was very high."]
        grammar: [g.congiuntivo-imperfetto]
        vocab: [w.competente, w.autonomia, w.condizione, w.produttività]
    spicy:
      - { es: "Durante il colloquio credevo che mi guardassi per il curriculum, poi mi hai chiesto il numero di telefono.", en: "During the interview I thought you were looking at me because of my CV, then you asked for my phone number.", altEs: ["Durante il colloquio pensavo che mi guardassi per il curriculum, poi mi hai chiesto il numero."], grammar: [g.congiuntivo-imperfetto], vocab: [w.colloquio-di-lavoro] }
      - { es: "Speravo che la riunione finisse presto: il caffè con te al bar sotto la sede era molto più stimolante.", en: "I was hoping the meeting would finish early: coffee with you at the bar below the office was much more stimulating.", altEs: ["Speravo che la riunione finisse presto, perché il caffè con te al bar sotto la sede era molto più stimolante."], grammar: [g.congiuntivo-imperfetto], vocab: [w.stimolante, w.sede] }
      - { es: "Non immaginavo che un collega così efficiente sapesse anche ballare la tarantella.", en: "I didn't imagine that such an efficient colleague could also dance the tarantella.", altEs: ["Non pensavo che un collega così efficiente sapesse anche ballare la tarantella.", "Non immaginavo che una collega così efficiente sapesse anche ballare la tarantella."], grammar: [g.congiuntivo-imperfetto], vocab: [w.efficiente, w.collega] }
      - { es: "Mia madre voleva che sposassi un uomo affidabile; io volevo che sapesse fare la pizza.", en: "My mother wanted me to marry a reliable man; I wanted him to know how to make pizza.", altEs: ["Mia madre voleva che sposassi una donna affidabile; io volevo che sapesse fare la pizza."], grammar: [g.congiuntivo-imperfetto], vocab: [w.affidabile, w.sposarsi] }
      - { es: "Pensavo che volessi coordinare il progetto, non i nostri appuntamenti.", en: "I thought you wanted to coordinate the project, not our dates.", altEs: ["Credevo che volessi coordinare il progetto, non i nostri appuntamenti."], grammar: [g.congiuntivo-imperfetto], vocab: [w.coordinare, w.appuntamento] }
  - id: b2.u01.l2
    title: Se vincessi alla lotteria
    teach: [g.periodo-ipotetico-2]
    vocab: [w.lotteria, w.ereditare, w.mutuo, w.eredità, w.risparmi, w.investire, w.interessi, w.reddito, w.raddoppiare, w.debito, w.credito, w.merce, w.guadagnare, w.conto-corrente, w.bonifico, w.pagamento, w.valere, w.guadagno, w.netto, w.rata, w.spesa, w.prelevare, w.fattura, w.finanza, w.investimento, w.ristrutturazione, w.bilancio, w.parziale, w.bancario, w.cancellazione, w.limite, w.ricchezza, w.povertà, w.artigianale, w.rischioso, w.gratuito]
    tip: "Unlikely or imaginary: se + congiuntivo imperfetto, then the condizionale. Se avessi i soldi, comprerei… Never 'se avrei'."
    sentences:
      - { es: "Se vincessi alla lotteria, comprerei una casa con vista sul golfo di Napoli.", en: "If I won the lottery, I'd buy a house with a view over the Bay of Naples.", altEs: ["Se vincessi la lotteria, comprerei una casa con vista sul golfo di Napoli.", "Comprerei una casa con vista sul golfo di Napoli, se vincessi alla lotteria."], grammar: [g.periodo-ipotetico-2], vocab: [w.lotteria, w.golfo] }
      - { es: "Se ereditassi qualcosa dai nonni, pagherei subito tutto il mutuo.", en: "If I inherited something from my grandparents, I'd pay off the whole mortgage straight away.", altEs: ["Se ereditassi qualcosa dai miei nonni, pagherei subito tutto il mutuo."], grammar: [g.periodo-ipotetico-2], vocab: [w.ereditare, w.mutuo] }
      - { es: "Che cosa faresti con l'eredità, se fosse tutta tua?", en: "What would you do with the inheritance, if it were all yours?", altEs: ["Cosa faresti con l'eredità, se fosse tutta tua?", "Se l'eredità fosse tutta tua, che cosa ne faresti?"], grammar: [g.periodo-ipotetico-2], vocab: [w.eredità] }
      - { es: "Se avessimo più risparmi, li investiremmo in una piccola pizzeria.", en: "If we had more savings, we'd invest them in a small pizzeria.", altEs: ["Se avessimo più risparmi, li investiremmo in una pizzeria piccola."], grammar: [g.periodo-ipotetico-2, g.direct-object-pronouns], vocab: [w.risparmi, w.investire, w.pizzeria] }
      - { es: "Se gli interessi fossero più bassi, chiederei un prestito alla banca.", en: "If interest rates were lower, I'd ask the bank for a loan.", altEs: ["Chiederei un prestito alla banca, se gli interessi fossero più bassi."], grammar: [g.periodo-ipotetico-2], vocab: [w.interessi, w.prestito, w.banca] }
      - { es: "Se il mio reddito raddoppiasse, smetterei di fare i conti a fine mese.", en: "If my income doubled, I'd stop doing my sums at the end of the month.", altEs: ["Se il mio reddito raddoppiasse, smetterei di fare i conti alla fine del mese."], grammar: [g.periodo-ipotetico-2], vocab: [w.reddito, w.raddoppiare] }
      - { es: "Se non avessi debiti, dormirei molto meglio.", en: "If I didn't have any debts, I'd sleep much better.", altEs: ["Dormirei molto meglio se non avessi debiti."], grammar: [g.periodo-ipotetico-2], vocab: [w.debito, w.dormire] }
      - { es: "Se la banca mi desse credito, aprirei un negozio di merce artigianale a Spaccanapoli.", en: "If the bank gave me credit, I'd open a shop selling handmade goods in Spaccanapoli.", altEs: ["Se la banca mi concedesse credito, aprirei un negozio di merce artigianale a Spaccanapoli."], grammar: [g.periodo-ipotetico-2], vocab: [w.credito, w.merce, w.artigianale] }
      - { es: "Se guadagnassi di più, non controllerei il conto corrente ogni mattina.", en: "If I earned more, I wouldn't check my current account every morning.", altEs: ["Se guadagnassi di più, non guarderei il conto corrente ogni mattina."], grammar: [g.periodo-ipotetico-2], vocab: [w.guadagnare, w.conto-corrente, w.controllare] }
      - { es: "Se facessi il bonifico oggi, il pagamento arriverebbe domani.", en: "If you made the transfer today, the payment would arrive tomorrow.", altEs: ["Se tu facessi il bonifico oggi, il pagamento arriverebbe domani.", "Se facessi oggi il bonifico, il pagamento arriverebbe domani."], grammar: [g.periodo-ipotetico-2], vocab: [w.bonifico, w.pagamento] }
      - { es: "Varrebbe la pena se il guadagno netto fosse almeno il doppio.", en: "It would be worth it if the net profit were at least double.", altEs: ["Ne varrebbe la pena se il guadagno netto fosse almeno il doppio."], grammar: [g.periodo-ipotetico-2], vocab: [w.valere, w.guadagno, w.netto, w.doppio] }
      - { es: "Se pagassimo a rate, la spesa sarebbe meno pesante.", en: "If we paid in instalments, the expense would be less of a burden.", altEs: ["La spesa sarebbe meno pesante se pagassimo a rate."], grammar: [g.periodo-ipotetico-2], vocab: [w.rata, w.spesa, w.pesante] }
      - { es: "Se la finanza fosse una scienza esatta, nessuno perderebbe soldi in borsa.", en: "If finance were an exact science, nobody would lose money on the stock market.", altEs: ["Nessuno perderebbe soldi in borsa, se la finanza fosse una scienza esatta."], grammar: [g.periodo-ipotetico-2], vocab: [w.finanza, w.scienza, w.perdere] }
      - { es: "Se avessi i soldi, comprerei una barca.", en: "If I had the money, I'd buy a boat.", altEs: ["Comprerei una barca, se avessi i soldi.", "Se avessi i soldi comprerei una barca."], grammar: [g.periodo-ipotetico-2], vocab: [w.barca, w.soldi], error: { wrong: "Se avrei i soldi, comprerei una barca.", explain: "Never the conditional after se: the se clause takes the congiuntivo imperfetto (se avessi); the conditional goes in the result.", grammar: g.periodo-ipotetico-2 } }
      - { es: "Se ho tempo, vengo a Napoli.", en: "If I have time, I'll come to Naples.", grammar: [g.periodo-ipotetico-1], vocab: [w.tempo, w.venire], transform: { instruction: "Make the condition unlikely (type 2)", answer: "Se avessi tempo, verrei a Napoli.", alt: ["Se avessi tempo verrei a Napoli.", "Verrei a Napoli se avessi tempo."], en: "If I had time, I'd come to Naples." } }
      - { es: "Se prelevo i soldi oggi, non posso pagare la fattura.", en: "If I withdraw the money today, I can't pay the invoice.", grammar: [g.periodo-ipotetico-1], vocab: [w.prelevare, w.fattura], transform: { instruction: "Make it hypothetical (se + congiuntivo imperfetto)", answer: "Se prelevassi i soldi oggi, non potrei pagare la fattura.", alt: ["Se oggi prelevassi i soldi, non potrei pagare la fattura."], en: "If I withdrew the money today, I couldn't pay the invoice." } }
    exchanges:
      - q: { es: "Che cosa faresti se vincessi alla lotteria?", en: "What would you do if you won the lottery?" }
        a: { es: "Investirei metà dei soldi e con l'altra metà farei il giro del mondo.", en: "I'd invest half the money and with the other half I'd go round the world." }
        alt: ["Farei il giro del mondo.", "Comprerei una casa a Posillipo e smetterei di lavorare."]
        grammar: [g.periodo-ipotetico-2]
        vocab: [w.lotteria, w.investire]
      - q: { es: "Chiederesti un mutuo per comprare casa a Napoli?", en: "Would you take out a mortgage to buy a house in Naples?" }
        a: { es: "Solo se gli interessi fossero più bassi: adesso sarebbe un investimento troppo rischioso.", en: "Only if interest rates were lower: right now it would be too risky an investment." }
        alt: ["Solo se gli interessi fossero più bassi.", "No, se lo facessi, non dormirei più."]
        grammar: [g.periodo-ipotetico-2]
        vocab: [w.mutuo, w.interessi, w.investimento, w.rischioso]
      - q: { es: "Perché non ristrutturate la casa?", en: "Why don't you renovate the house?" }
        a: { es: "Se avessimo i soldi, faremmo subito la ristrutturazione, ma il bilancio di quest'anno è già in rosso.", en: "If we had the money, we'd do the renovation straight away, but this year's budget is already in the red." }
        alt: ["Se avessimo i soldi, la faremmo subito.", "Perché costerebbe troppo."]
        grammar: [g.periodo-ipotetico-2]
        vocab: [w.ristrutturazione, w.bilancio]
      - q: { es: "Accetterebbe un pagamento parziale?", en: "Would you accept a partial payment?" }
        a: { es: "Sì, se il resto arrivasse entro un mese con un bonifico bancario.", en: "Yes, if the rest arrived within a month by bank transfer." }
        alt: ["Sì, se il resto arrivasse entro un mese.", "No, mi dispiace: preferirei ricevere tutto insieme."]
        grammar: [g.periodo-ipotetico-2, g.lei-forms]
        vocab: [w.pagamento, w.parziale, w.bancario, w.bonifico]
      - q: { es: "Se cancellassi l'abbonamento oggi, dovrei pagare qualcosa?", en: "If I cancelled the subscription today, would I have to pay anything?" }
        a: { es: "No, se lo cancellasse entro il limite di trenta giorni, la cancellazione sarebbe gratuita.", en: "No, if you cancelled it within the thirty-day limit, the cancellation would be free." }
        alt: ["No, entro trenta giorni la cancellazione sarebbe gratuita.", "Sì, dovrebbe pagare l'ultima rata."]
        grammar: [g.periodo-ipotetico-2, g.lei-forms]
        vocab: [w.cancellazione, w.limite, w.abbonamento, w.gratuito]
    texts:
      - title: "Sondaggio in piazza del Plebiscito"
        es: ["Abbiamo chiesto ai napoletani: che cosa fareste se diventaste ricchi?", "Molti hanno risposto che aiuterebbero prima la famiglia.", "Una signora ha detto: «Se avessi tanta ricchezza, la userei contro la povertà del quartiere.»"]
        en: ["We asked the people of Naples: what would you do if you became rich?", "Many answered that they would help their family first.", "One lady said: “If I had so much wealth, I'd use it against the poverty in the neighbourhood.”"]
        grammar: [g.periodo-ipotetico-2]
        vocab: [w.ricchezza, w.povertà]
      - title: "Conti di casa"
        es: ["Se pagassimo la ristrutturazione a rate, ogni mese spenderemmo trecento euro.", "Se invece usassimo i risparmi, non avremmo più niente sul conto.", "Che cosa ne dici?"]
        en: ["If we paid for the renovation in instalments, we'd spend three hundred euros every month.", "If instead we used our savings, we'd have nothing left in the account.", "What do you think?"]
        grammar: [g.periodo-ipotetico-2]
        vocab: [w.ristrutturazione, w.rata, w.risparmi]
    spicy:
      - { es: "Se avessi un euro per ogni volta che ti penso, sarei l'uomo più ricco di Napoli.", en: "If I had a euro for every time I think of you, I'd be the richest man in Naples.", altEs: ["Se avessi un euro per ogni volta che ti penso, sarei la donna più ricca di Napoli."], grammar: [g.periodo-ipotetico-2, g.superlatives], vocab: [w.euro, w.ricco] }
      - { es: "Se il tuo sorriso fosse un investimento, ci metterei tutti i miei risparmi.", en: "If your smile were an investment, I'd put all my savings into it.", altEs: ["Se il tuo sorriso fosse un investimento, ci investirei tutti i miei risparmi."], grammar: [g.periodo-ipotetico-2, g.ci-place], vocab: [w.investimento, w.risparmi, w.sorriso] }
      - { es: "Se fossi una banca, ti darei credito senza limite: di baci, non di soldi.", en: "If I were a bank, I'd give you unlimited credit: in kisses, not money.", altEs: ["Se fossi una banca, ti concederei un credito senza limite: di baci, non di soldi."], grammar: [g.periodo-ipotetico-2], vocab: [w.credito, w.limite, w.bacio] }
      - { es: "Se mi invitassi a cena sul lungomare, cancellerei tutti i miei impegni.", en: "If you invited me to dinner on the seafront, I'd cancel all my plans.", altEs: ["Se mi invitassi a cena sul lungomare, annullerei tutti i miei impegni."], grammar: [g.periodo-ipotetico-2], vocab: [w.lungomare, w.impegno] }
      - { es: "Se pagassi tu la cena, io pagherei il gelato... a rate.", en: "If you paid for dinner, I'd pay for the ice cream... in instalments.", altEs: ["Se tu pagassi la cena, io pagherei il gelato... a rate."], grammar: [g.periodo-ipotetico-2], vocab: [w.rata, w.gelato] }
  - id: b2.u01.l3
    title: Se fossi in te
    teach: [g.periodo-ipotetico-2, g.congiuntivo-imperfetto]
    vocab: [w.se-fossi-in-te, w.promozione, w.ambizioso, w.qualora, w.promuovere, w.tempo-indeterminato, w.tempo-determinato, w.precariato, w.partita-iva, w.libero-professionista, w.imprenditore, w.sfruttamento, w.mercato-del-lavoro, w.esigente, w.rendimento, w.traguardo, w.realizzarsi, w.dimettersi, w.dimissioni, w.ipotesi, w.settore, w.insoddisfatto, w.licenza, w.soddisfatto, w.soddisfazione, w.ambizione, w.realizzare, w.eventuale, w.eventualmente, w.precario, w.frustrazione, w.ipotetico]
    tip: "Se fossi in te… / Al tuo posto… = If I were you. Qualora + congiuntivo is a formal 'if' / 'in the event that': Qualora ci fossero problemi, mi chiami."
    sentences:
      - { es: "Se fossi in te, chiederei una promozione: sei la più competente dell'ufficio.", en: "If I were you, I'd ask for a promotion: you're the most competent person in the office.", altEs: ["Al tuo posto, chiederei una promozione: sei la più competente dell'ufficio.", "Se fossi in te, chiederei una promozione: sei il più competente dell'ufficio."], grammar: [g.periodo-ipotetico-2], vocab: [w.se-fossi-in-te, w.promozione] }
      - { es: "Se fossi più ambizioso, cercherei un posto da direttore.", en: "If I were more ambitious, I'd look for a manager's job.", altEs: ["Se fossi più ambiziosa, cercherei un posto da direttrice."], grammar: [g.periodo-ipotetico-2], vocab: [w.ambizioso, w.direttore] }
      - { es: "Qualora la promuovessero, si trasferirebbe a Bari?", en: "If they promoted you, would you move to Bari?", altEs: ["Se la promuovessero, si trasferirebbe a Bari?"], altEn: ["Should they promote you, would you move to Bari?"], grammar: [g.periodo-ipotetico-2, g.lei-forms], vocab: [w.qualora, w.promuovere, w.trasferirsi] }
      - { es: "Se avessi un contratto a tempo indeterminato, potrei finalmente chiedere un mutuo.", en: "If I had a permanent contract, I could finally apply for a mortgage.", altEs: ["Con un contratto a tempo indeterminato, potrei finalmente chiedere un mutuo."], grammar: [g.periodo-ipotetico-2], vocab: [w.tempo-indeterminato, w.contratto, w.mutuo] }
      - { es: "Se il mio contratto non fosse a tempo determinato, non vivrei nel precariato.", en: "If my contract weren't fixed-term, I wouldn't be living in job insecurity.", altEs: ["Non vivrei nel precariato, se il mio contratto non fosse a tempo determinato."], grammar: [g.periodo-ipotetico-2], vocab: [w.tempo-determinato, w.precariato] }
      - { es: "Se aprissi la partita IVA, diventerei libero professionista.", en: "If I registered as self-employed, I'd become a freelance professional.", altEs: ["Se aprissi la partita IVA, diventerei una libera professionista."], grammar: [g.periodo-ipotetico-2], vocab: [w.partita-iva, w.libero-professionista], note: "Aprire la partita IVA = to register for VAT, i.e. to set up as self-employed." }
      - { es: "Se fossi un imprenditore, non accetterei mai lo sfruttamento dei giovani.", en: "If I were an entrepreneur, I would never accept the exploitation of young people.", altEs: ["Se fossi un'imprenditrice, non accetterei mai lo sfruttamento dei giovani."], grammar: [g.periodo-ipotetico-2], vocab: [w.imprenditore, w.sfruttamento, w.giovane] }
      - { es: "Il mercato del lavoro al Sud sarebbe diverso se ci fossero più investimenti.", en: "The labour market in the South would be different if there were more investment.", altEs: ["Se ci fossero più investimenti, il mercato del lavoro al Sud sarebbe diverso."], grammar: [g.periodo-ipotetico-2], vocab: [w.mercato-del-lavoro, w.investimento] }
      - { es: "Se il capo fosse meno esigente, il mio rendimento sarebbe migliore.", en: "If the boss were less demanding, my performance would be better.", altEs: ["Il mio rendimento sarebbe migliore se il capo fosse meno esigente."], grammar: [g.periodo-ipotetico-2, g.comparatives-irregular], vocab: [w.esigente, w.rendimento] }
      - { es: "Se raggiungessi questo traguardo, mi sentirei finalmente realizzata.", en: "If I reached this goal, I'd finally feel fulfilled.", altEs: ["Se raggiungessi questo traguardo, mi sentirei finalmente realizzato."], grammar: [g.periodo-ipotetico-2], vocab: [w.traguardo, w.realizzarsi, w.raggiungere] }
      - { es: "Ti dimetteresti se ti offrissero un lavoro più gratificante?", en: "Would you resign if they offered you a more rewarding job?", altEs: ["Se ti offrissero un lavoro più gratificante, ti dimetteresti?"], grammar: [g.periodo-ipotetico-2], vocab: [w.dimettersi, w.gratificante, w.offrire] }
      - { es: "Se presentassi le dimissioni domani, il mio capo non ci crederebbe.", en: "If I handed in my resignation tomorrow, my boss wouldn't believe it.", altEs: ["Se domani presentassi le dimissioni, il mio capo non ci crederebbe."], grammar: [g.periodo-ipotetico-2], vocab: [w.dimissioni, w.presentare] }
      - { es: "Un'ipotesi: se il settore turistico crescesse ancora, a Napoli servirebbero più guide.", en: "One hypothesis: if the tourist sector grew further, Naples would need more guides.", altEs: ["Facciamo un'ipotesi: se il settore turistico crescesse ancora, a Napoli servirebbero più guide."], grammar: [g.periodo-ipotetico-2], vocab: [w.ipotesi, w.settore, w.guida] }
      - { es: "Se fossi in te, non lo farei.", en: "If I were you, I wouldn't do it.", altEs: ["Al tuo posto non lo farei.", "Io, se fossi in te, non lo farei."], grammar: [g.periodo-ipotetico-2], vocab: [w.se-fossi-in-te], error: { wrong: "Se sarei in te, non lo farei.", explain: "After se use the congiuntivo imperfetto (fossi), never the conditional (sarei).", grammar: g.periodo-ipotetico-2 } }
      - { es: "Sono insoddisfatto, quindi cambio lavoro.", en: "I'm dissatisfied, so I'm changing jobs.", altEs: ["Sono insoddisfatta, quindi cambio lavoro."], grammar: [g.connectors-cause-consequence], vocab: [w.insoddisfatto], transform: { instruction: "Make it hypothetical: Se…", answer: "Se fossi insoddisfatto, cambierei lavoro.", alt: ["Se fossi insoddisfatta, cambierei lavoro.", "Cambierei lavoro se fossi insoddisfatto."], en: "If I were dissatisfied, I'd change jobs." } }
      - { es: "Se ottengo la licenza, apro un bar sul lungomare.", en: "If I get the licence, I'll open a bar on the seafront.", grammar: [g.periodo-ipotetico-1], vocab: [w.licenza, w.ottenere, w.lungomare], transform: { instruction: "Make the condition unlikely (type 2)", answer: "Se ottenessi la licenza, aprirei un bar sul lungomare.", alt: ["Aprirei un bar sul lungomare se ottenessi la licenza."], en: "If I got the licence, I'd open a bar on the seafront." } }
    exchanges:
      - q: { es: "Tu che cosa faresti al mio posto?", en: "What would you do in my place?" }
        a: { es: "Se fossi in te, accetterei la promozione, anche se è a Milano.", en: "If I were you, I'd accept the promotion, even though it's in Milan." }
        alt: ["Se fossi in te, accetterei.", "Al tuo posto resterei a Napoli."]
        grammar: [g.periodo-ipotetico-2]
        vocab: [w.se-fossi-in-te, w.promozione]
      - q: { es: "Sei soddisfatto del tuo lavoro?", en: "Are you satisfied with your job?" }
        a: { es: "Abbastanza, ma avrei più soddisfazione se il contratto fosse meno precario.", en: "Fairly, but I'd get more satisfaction if the contract were less precarious." }
        alt: ["Abbastanza.", "Sarei più soddisfatto se guadagnassi di più."]
        grammar: [g.periodo-ipotetico-2]
        vocab: [w.soddisfatto, w.soddisfazione, w.precario]
      - q: { es: "Qual è la tua più grande ambizione?", en: "What's your greatest ambition?" }
        a: { es: "Realizzare un progetto mio: se potessi, aprirei una libreria nel centro storico.", en: "To carry out a project of my own: if I could, I'd open a bookshop in the old town." }
        alt: ["Aprire una libreria nel centro storico.", "Se potessi, vivrei di musica."]
        grammar: [g.periodo-ipotetico-2]
        vocab: [w.ambizione, w.realizzare, w.libreria]
      - q: { es: "Qualora ci fossero eventuali problemi, a chi dovrei scrivere?", en: "Should there be any problems, who should I write to?" }
        a: { es: "Eventualmente può scrivere a me o all'ufficio del personale.", en: "If necessary, you can write to me or to the personnel office." }
        alt: ["Può scrivere direttamente a me.", "All'ufficio del personale."]
        grammar: [g.periodo-ipotetico-2, g.lei-forms]
        vocab: [w.qualora, w.eventuale, w.eventualmente]
      - q: { es: "Come ti senti dopo sei anni di contratti a termine?", en: "How do you feel after six years of fixed-term contracts?" }
        a: { es: "Provo una grande frustrazione: se avessi un contratto stabile, sarei un'altra persona.", en: "I feel very frustrated: if I had a stable contract, I'd be a different person." }
        alt: ["Molto frustrato.", "Se avessi un posto fisso, sarei più tranquilla."]
        grammar: [g.periodo-ipotetico-2]
        vocab: [w.frustrazione, w.contratto]
    texts:
      - title: "Il consiglio di Carmela"
        es: ["Se fossi in te, non mollerei adesso.", "Lo so che il lavoro è precario e che la frustrazione è tanta.", "Ma se avessi la pazienza di aspettare un altro anno, potresti ottenere il contratto a tempo indeterminato."]
        en: ["If I were you, I wouldn't give up now.", "I know the job is precarious and the frustration is huge.", "But if you had the patience to wait another year, you could get the permanent contract."]
        grammar: [g.periodo-ipotetico-2]
        vocab: [w.se-fossi-in-te, w.precario, w.frustrazione, w.tempo-indeterminato]
      - title: "Esercizio di scrittura: un caso ipotetico"
        es: ["Immagina un caso ipotetico.", "Se fossi il sindaco di Napoli per un giorno, che cosa cambieresti?", "Scrivi almeno dieci righe e usa il congiuntivo imperfetto."]
        en: ["Imagine a hypothetical case.", "If you were mayor of Naples for a day, what would you change?", "Write at least ten lines and use the imperfect subjunctive."]
        grammar: [g.periodo-ipotetico-2, g.congiuntivo-imperfetto]
        vocab: [w.ipotetico, w.sindaco]
    spicy:
      - { es: "Se fossi in te, mi inviterei a cena: sono una persona molto affidabile, soprattutto a tavola.", en: "If I were you, I'd invite me to dinner: I'm a very reliable person, especially at the table.", altEs: ["Al tuo posto, mi inviterei a cena: sono una persona molto affidabile, soprattutto a tavola."], grammar: [g.periodo-ipotetico-2], vocab: [w.se-fossi-in-te, w.affidabile] }
      - { es: "Il mio traguardo per stasera? Se accettassi un aperitivo, sarebbe già una promozione.", en: "My goal for tonight? If you accepted a drink, it would already be a promotion.", altEs: ["Il mio traguardo per stasera? Se tu accettassi un aperitivo, sarebbe già una promozione."], grammar: [g.periodo-ipotetico-2], vocab: [w.traguardo, w.promozione, w.aperitivo] }
      - { es: "Se fossi meno timido, ti chiederei di uscire senza parlare mezz'ora del tempo.", en: "If I were less shy, I'd ask you out without talking about the weather for half an hour.", altEs: ["Se fossi meno timida, ti chiederei di uscire senza parlare mezz'ora del tempo."], grammar: [g.periodo-ipotetico-2], vocab: [w.timido, w.uscire] }
      - { es: "Qualora cercassi compagnia per il concerto di stasera, sono libero professionista... e libero anche stasera.", en: "Should you be looking for company for tonight's concert, I'm a freelancer... and free tonight too.", altEs: ["Qualora cercassi compagnia per il concerto di stasera, sono libera professionista... e libera anche stasera."], grammar: [g.periodo-ipotetico-2], vocab: [w.qualora, w.libero-professionista, w.concerto] }
  - id: b2.u01.l4
    title: Come se niente fosse
    teach: [g.come-se]
    vocab: [w.come-se, w.mollare-tutto, w.anno-sabbatico, w.volontario, w.trasferirsi-allestero, w.fare-il-giro-del-mondo, w.volontariato, w.avere-tempo, w.smart-working, w.estero, w.cambiare-vita, w.pendolarismo, w.orario-flessibile, w.esperto, w.associazione]
    tip: "come se is always followed by the congiuntivo: imperfetto for the same time (come se fosse), trapassato for something earlier (come se l'avesse visto). Fai come se fossi a casa tua = make yourself at home."
    sentences:
      - { es: "Parla di Napoli come se ci fosse nato, ma è di Torino.", en: "He talks about Naples as if he'd been born there, but he's from Turin.", altEs: ["Parla di Napoli come se ci fosse nato, però è di Torino.", "Parla di Napoli come se ci fosse nata, ma è di Torino."], grammar: [g.come-se, g.ci-place], vocab: [w.come-se, w.nascere] }
      - { es: "Spende come se fosse ricco, ma ha un mutuo enorme.", en: "He spends as if he were rich, but he has an enormous mortgage.", altEs: ["Spende come se fosse ricca, ma ha un mutuo enorme."], grammar: [g.come-se], vocab: [w.come-se, w.spendere, w.mutuo] }
      - { es: "Da quando ha mollato tutto, vive come se non avesse più problemi.", en: "Since she dropped everything, she's been living as if she had no more problems.", altEs: ["Da quando ha mollato tutto, vive come se non avesse nessun problema."], grammar: [g.come-se, g.da-since], vocab: [w.mollare-tutto, w.problema] }
      - { es: "Parla del suo anno sabbatico come se fosse una vacanza, ma ha lavorato ogni giorno come volontario.", en: "He talks about his gap year as if it were a holiday, but he worked every day as a volunteer.", altEs: ["Racconta il suo anno sabbatico come se fosse una vacanza, ma ha lavorato ogni giorno come volontario."], grammar: [g.come-se], vocab: [w.anno-sabbatico, w.volontario, w.vacanza] }
      - { es: "Si comporta come se trasferirsi all'estero fosse la soluzione a tutto.", en: "He behaves as if moving abroad were the solution to everything.", altEs: ["Fa come se trasferirsi all'estero fosse la soluzione a tutto."], grammar: [g.come-se], vocab: [w.trasferirsi-allestero, w.soluzione] }
      - { es: "Mi guardi come se fossi pazzo, ma voglio davvero fare il giro del mondo.", en: "You're looking at me as if I were mad, but I really want to go round the world.", altEs: ["Mi guardi come se fossi pazza, ma voglio davvero fare il giro del mondo."], grammar: [g.come-se], vocab: [w.fare-il-giro-del-mondo, w.pazzo] }
      - { es: "Fai come se fossi a casa tua!", en: "Make yourself at home!", altEs: ["Fate come se foste a casa vostra!", "Faccia come se fosse a casa Sua!"], grammar: [g.come-se, g.imperativo-tu], vocab: [w.casa], note: "Literally 'do as if you were in your own home': the standard welcome to a guest." }
      - { es: "Il volontariato nel quartiere mi ha fatto sentire come se avessi una seconda famiglia.", en: "Volunteering in the neighbourhood made me feel as if I had a second family.", altEs: ["Fare volontariato nel quartiere mi ha fatto sentire come se avessi una seconda famiglia."], grammar: [g.come-se], vocab: [w.volontariato, w.quartiere] }
      - { es: "Vive come se avesse tutto il tempo del mondo.", en: "He lives as if he had all the time in the world.", altEs: ["Vive come se avesse tutto il tempo che vuole."], grammar: [g.come-se], vocab: [w.avere-tempo] }
      - { es: "Con lo smart working lavoro dal balcone, come se fossi in vacanza a Procida.", en: "With remote working I work from the balcony, as if I were on holiday in Procida.", altEs: ["Con lo smart working lavoro dal balcone come se fossi in vacanza a Procida."], grammar: [g.come-se], vocab: [w.smart-working, w.balcone] }
      - { es: "Mio nonno parlava dell'estero come se fosse un altro pianeta.", en: "My grandfather talked about abroad as if it were another planet.", altEs: ["Mio nonno parlava dell'estero come se fosse un altro mondo."], grammar: [g.come-se], vocab: [w.estero, w.pianeta] }
      - { es: "Non è ricco, eppure si veste come se lo fosse.", en: "He isn't rich, and yet he dresses as if he were.", altEs: ["Non è ricca, eppure si veste come se lo fosse."], grammar: [g.come-se, g.connectors-contrast], vocab: [w.vestirsi, w.ricco], note: "lo stands for the adjective: come se lo fosse = as if he were (rich)." }
      - { es: "Da quando è finito il pendolarismo, è come se le giornate durassero di più.", en: "Since the commuting ended, it's as if the days lasted longer.", altEs: ["Da quando non faccio più il pendolare, è come se le giornate durassero di più."], grammar: [g.come-se], vocab: [w.pendolarismo, w.durare] }
      - { es: "Mi tratta come se fossi una bambina.", en: "She treats me as if I were a little girl.", altEs: ["Mi tratta come se fossi un bambino."], altEn: ["He treats me like a child."], grammar: [g.come-se], vocab: [], error: { wrong: "Mi tratta come se sono una bambina.", explain: "come se always takes the congiuntivo (imperfetto or trapassato), never the indicative: come se fossi.", grammar: g.come-se } }
      - { es: "Parla come un esperto, ma non lo è.", en: "He talks like an expert, but he isn't one.", grammar: [g.come-se], vocab: [w.esperto], transform: { instruction: "Rewrite with come se", answer: "Parla come se fosse un esperto.", alt: ["Parla come se fosse un esperto, ma non lo è."], en: "He talks as if he were an expert." } }
      - { es: "Secondo lui cambiare vita è facile.", en: "According to him, changing your life is easy.", grammar: [g.come-se], vocab: [w.cambiare-vita], transform: { instruction: "Rewrite starting with Ne parla come se…", answer: "Ne parla come se cambiare vita fosse facile.", alt: ["Parla come se cambiare vita fosse facile."], en: "He talks about it as if changing your life were easy." } }
    exchanges:
      - q: { es: "Perché Luca ha mollato tutto?", en: "Why did Luca drop everything?" }
        a: { es: "Si sentiva come se la sua vita fosse ferma; adesso fa volontariato in un'associazione di Napoli.", en: "He felt as if his life had stopped still; now he volunteers for an association in Naples." }
        alt: ["Si sentiva come se la sua vita fosse ferma.", "Voleva cambiare vita."]
        grammar: [g.come-se]
        vocab: [w.mollare-tutto, w.volontariato, w.associazione]
      - q: { es: "Com'è vivere all'estero?", en: "What's it like living abroad?" }
        a: { es: "All'inizio ti senti come se tutti parlassero troppo veloce.", en: "At first you feel as if everyone were talking too fast." }
        alt: ["Difficile all'inizio, poi bellissimo.", "È come se ogni giorno fosse un esame."]
        grammar: [g.come-se]
        vocab: [w.estero]
      - q: { es: "Ti piace il nuovo orario flessibile?", en: "Do you like the new flexible hours?" }
        a: { es: "Moltissimo: è come se avessi un giorno libero in più ogni settimana.", en: "Very much: it's as if I had an extra day off every week." }
        alt: ["Sì, è come se avessi più tempo.", "Moltissimo."]
        grammar: [g.come-se]
        vocab: [w.orario-flessibile]
      - q: { es: "Che cosa farai durante l'anno sabbatico?", en: "What will you do during your gap year?" }
        a: { es: "Farò il giro del mondo, come se avessi di nuovo vent'anni.", en: "I'll go round the world, as if I were twenty again." }
        alt: ["Farò il giro del mondo.", "Lavorerò come volontaria in Africa."]
        grammar: [g.come-se, g.futuro-semplice]
        vocab: [w.anno-sabbatico, w.fare-il-giro-del-mondo]
      - q: { es: "Hai visto Marco? Sembra un'altra persona.", en: "Have you seen Marco? He seems like a different person." }
        a: { es: "Sì, cammina come se avesse vinto alla lotteria.", en: "Yes, he walks as if he'd won the lottery." }
        alt: ["Sì, sorride come se fosse innamorato.", "Sì, sembra che abbia cambiato vita."]
        grammar: [g.come-se, g.congiuntivo-trapassato]
        vocab: [w.lotteria]
    texts:
      - title: "Post di Chiara"
        es: ["Sei mesi fa ho mollato tutto e mi sono trasferita a Napoli.", "La prima settimana mi sentivo come se fossi dentro un film.", "Adesso conosco i vicoli del quartiere come se ci abitassi da sempre."]
        en: ["Six months ago I dropped everything and moved to Naples.", "The first week I felt as if I were in a film.", "Now I know the alleys of the neighbourhood as if I'd always lived there."]
        grammar: [g.come-se]
        vocab: [w.mollare-tutto, w.vicolo]
      - title: "Lettera dall'estero"
        es: ["Caro nonno, qui a Berlino lavoro in smart working e ho un orario flessibile.", "Ma quando sento il profumo del caffè, è come se fossi di nuovo a casa.", "Torno a Natale, promesso."]
        en: ["Dear Grandad, here in Berlin I work remotely and I have flexible hours.", "But when I smell coffee, it's as if I were back home again.", "I'm coming home at Christmas, I promise."]
        grammar: [g.come-se]
        vocab: [w.estero, w.smart-working, w.orario-flessibile]
    spicy:
      - { es: "Mi guardi come se fossi l'ultima sfogliatella della pasticceria.", en: "You're looking at me as if I were the last sfogliatella in the pastry shop.", altEs: ["Mi guardi come se fossi l'ultima sfogliatella in pasticceria."], grammar: [g.come-se], vocab: [w.sfogliatella, w.pasticceria] }
      - { es: "Balliamo come se nessuno ci guardasse, anche se tua zia ci guarda dal balcone.", en: "Let's dance as if nobody were watching, even though your aunt is watching us from the balcony.", altEs: ["Balliamo come se nessuno ci vedesse, anche se tua zia ci guarda dal balcone."], grammar: [g.come-se], vocab: [w.ballare, w.balcone, w.zio] }
      - { es: "Mi hai baciato come se fosse la cosa più naturale del mondo; forse lo era.", en: "You kissed me as if it were the most natural thing in the world; maybe it was.", altEs: ["Mi hai baciata come se fosse la cosa più naturale del mondo; forse lo era."], grammar: [g.come-se], vocab: [w.baciare] }
      - { es: "Fai come se fossi a casa tua, ma il lato destro del divano è mio.", en: "Make yourself at home, but the right side of the sofa is mine.", altEs: ["Fai come se fossi a casa tua, però il lato destro del divano è mio."], grammar: [g.come-se], vocab: [w.divano, w.lato] }
      - { es: "Parli di me alle tue amiche come se fossi un principe; poi mi vedono lavare i piatti.", en: "You talk about me to your friends as if I were a prince; then they see me washing the dishes.", altEs: ["Parli di me alle tue amiche come se fossi un principe, poi mi vedono lavare i piatti."], grammar: [g.come-se], vocab: [w.principe, w.piatto] }
dialogues:
  - id: b2.u01.d1
    title: Al bar sul lungomare
    context: Gennaro and Assunta, two old friends, have a coffee on the Naples seafront after work and play the 'what if' game.
    lines:
      - { speaker: Assunta, es: "Gennaro, che faccia! Sembri stanco come se non dormissi da una settimana.", en: "Gennaro, look at your face! You look as tired as if you hadn't slept for a week." }
      - { speaker: Gennaro, es: "Quasi. Il capo voleva che finissi il bilancio entro stasera.", en: "Almost. The boss wanted me to finish the budget by tonight." }
      - { speaker: Assunta, es: "Se fossi in te, chiederei un orario flessibile. Lavori troppo.", en: "If I were you, I'd ask for flexible hours. You work too much." }
      - { speaker: Gennaro, es: "Lo so. A volte penso: se vincessi alla lotteria, mollerei tutto domani.", en: "I know. Sometimes I think: if I won the lottery, I'd drop everything tomorrow." }
      - { speaker: Assunta, es: "E che cosa faresti? Il giro del mondo?", en: "And what would you do? Go round the world?" }
      - { speaker: Gennaro, es: "No, resterei a Napoli. Aprirei una pizzeria proprio qui, sul lungomare.", en: "No, I'd stay in Naples. I'd open a pizzeria right here, on the seafront." }
      - { speaker: Assunta, es: "Ma tu non sai nemmeno fare la pizza!", en: "But you can't even make pizza!" }
      - { speaker: Gennaro, es: "Assumerei un pizzaiolo bravo e io gestirei la cassa, come se fossi un vero imprenditore.", en: "I'd hire a good pizza maker and I'd run the till, as if I were a real entrepreneur." }
      - { speaker: Assunta, es: "E se la pizzeria non guadagnasse niente?", en: "And if the pizzeria didn't earn anything?" }
      - { speaker: Gennaro, es: "Allora tornerei in ufficio, ma con una bella storia da raccontare.", en: "Then I'd go back to the office, but with a good story to tell." }
    questions:
      - { q: "Perché Gennaro è stanco?", options: ["Ha fatto il giro del mondo.", "Il capo voleva che finisse il bilancio.", "Ha lavorato in pizzeria tutta la notte."], answer: 1, explain: "Il capo voleva che finissi il bilancio entro stasera: the boss wanted him to finish the budget by tonight." }
      - { q: "Che cosa consiglia Assunta a Gennaro?", options: ["Di chiedere un orario flessibile.", "Di trasferirsi all'estero.", "Di comprare un biglietto della lotteria."], answer: 0, explain: "Se fossi in te, chiederei un orario flessibile." }
      - { q: "Dove aprirebbe la pizzeria Gennaro?", options: ["A Milano.", "All'estero.", "Sul lungomare di Napoli."], answer: 2, explain: "Resterei a Napoli… proprio qui, sul lungomare." }
      - { q: "Chi farebbe le pizze?", options: ["Gennaro.", "Assunta.", "Un pizzaiolo assunto da Gennaro."], answer: 2, explain: "Assumerei un pizzaiolo bravo e io gestirei la cassa: he would hire a pizza maker and run the till himself." }
writing:
  - task: "What would you do if you won the lottery? Write a short text with se + congiuntivo imperfetto and the conditional, and end with your view on whether money brings happiness."
    min: 80
    max: 140
    use: [w.lotteria, w.investire, w.risparmi, w.mutuo, w.ricchezza]
    grammar: [g.periodo-ipotetico-2, g.congiuntivo-imperfetto]
    expect:
      - { pattern: "\\bse\\s+(\\S+\\s+){0,2}(fossi|fosse|fossimo|avessi|avesse|avessimo|potessi|potesse|\\S+(assi|essi|issi|asse|esse|isse|assimo|essimo|issimo))\\b", hint: "Use se + congiuntivo imperfetto: se vincessi, se avessi…" }
      - { pattern: "\\b\\S+(rei|resti|rebbe|remmo|reste|rebbero)\\b", hint: "Give the consequence in the conditional: smetterei, investirei…" }
    model: { es: "Se vincessi alla lotteria, non smetterei subito di lavorare, perché mi annoierei. Prima di tutto pagherei il mutuo della casa dei miei genitori e metterei da parte un po' di risparmi per il futuro. Poi investirei una parte dei soldi in un piccolo ristorante: mi piacerebbe aprire una pizzeria artigianale a Napoli, vicino al mare. Se avessi ancora soldi, farei il giro del mondo con la mia ragazza. Però non credo che la ricchezza renda felici: se fossi troppo ricco, avrei paura di perdere i veri amici.", en: "If I won the lottery, I wouldn't stop working straight away, because I'd get bored. First of all I'd pay off my parents' mortgage and put some savings aside for the future. Then I'd invest part of the money in a small restaurant: I'd like to open an artisan pizzeria in Naples, near the sea. If I still had money, I'd travel round the world with my girlfriend. But I don't think wealth makes people happy: if I were too rich, I'd be afraid of losing my real friends." }
  - task: "Write to a friend about a job interview you had in Naples: what you thought and expected beforehand, and what it was really like (pensavo che fosse…, credevo che mi chiedessero…)."
    min: 80
    max: 140
    use: [w.colloquio-di-lavoro, w.impegnativo, w.stimolante, w.retribuzione, w.flessibile]
    grammar: [g.congiuntivo-imperfetto]
    expect:
      - { pattern: "\\b(pensavo|credevo|immaginavo|speravo|temevo|avevo paura|mi sembrava|non sapevo|volevano|voleva|non immaginavo) che\\b", hint: "Use a past verb + che + congiuntivo imperfetto: pensavo che fosse…" }
      - { pattern: "\\b(fosse|fossero|fossi|avesse|avessero|facesse|dessero|desse|\\S+(asse|esse|isse|assero|essero|issero|essi|issi))\\b", hint: "Use the congiuntivo imperfetto: fosse, chiedessero, dessero…" }
    model: { es: "Ciao Marta! Ieri ho fatto il colloquio di lavoro nella sede di Napoli. Pensavo che fosse una cosa veloce, invece è durato due ore! Credevo che mi chiedessero soprattutto delle mie esperienze, ma volevano che risolvessi un problema pratico davanti a loro. Il lavoro sembra impegnativo ma stimolante, e l'orario è flessibile. Non immaginavo che la retribuzione fosse così buona! Speravo che mi dessero una risposta subito, ma mi hanno detto che mi chiameranno la settimana prossima. Speriamo bene, ti faccio sapere!", en: "Hi Marta! Yesterday I had the job interview at the Naples office. I thought it would be quick, but it lasted two hours! I thought they'd mainly ask me about my experience, but they wanted me to solve a practical problem in front of them. The job seems demanding but stimulating, and the hours are flexible. I didn't imagine the pay would be so good! I was hoping they'd give me an answer straight away, but they told me they'll call me next week. Fingers crossed, I'll let you know!" }
  - task: "A friend asks for your advice. Answer with se fossi in te…, hypotheses with se + congiuntivo imperfetto and the conditional."
    es: "Mi hanno offerto una promozione a Milano, ma dovrei lasciare Napoli. Non so cosa fare!"
    min: 80
    max: 140
    use: [w.se-fossi-in-te, w.promozione, w.tempo-indeterminato, w.soddisfatto, w.realizzarsi]
    grammar: [g.periodo-ipotetico-2]
    expect:
      - { pattern: "se fossi in te|al posto tuo", hint: "Give advice: Se fossi in te… / Al posto tuo…" }
      - { pattern: "\\bse\\s+(\\S+\\s+){0,2}(fossi|fosse|andassi|restassi|avessi|potessi|\\S+(assi|essi|issi|asse|esse|isse))\\b", hint: "Add a hypothesis: se andassi a Milano…" }
    model: { es: "Che bella notizia, bravo! Se fossi in te, ci penserei bene prima di rifiutare. È un contratto a tempo indeterminato? Se lo fosse, io accetterei senza dubbi: oggi è difficile trovare un posto sicuro. Se invece fosse un contratto precario, rimarrei a Napoli. Mi hai sempre detto che non sei soddisfatto del tuo lavoro e che vorresti realizzarti: questa potrebbe essere l'occasione giusta. Certo, se andassi a Milano, ti mancherebbero il mare e la famiglia, ma potresti tornare nei weekend. Fammi sapere!", en: "What great news, well done! If I were you, I'd think hard before saying no. Is it a permanent contract? If it were, I'd accept without a doubt: these days it's hard to find a secure job. If, on the other hand, it were a temporary contract, I'd stay in Naples. You've always told me you're not satisfied with your job and that you'd like to fulfil yourself: this could be the right opportunity. Of course, if you went to Milan, you'd miss the sea and your family, but you could come back at weekends. Let me know!" }
  - task: "Describe someone you know who changed their life completely and now behaves as if… (come se + congiuntivo)."
    min: 80
    max: 140
    use: [w.come-se, w.mollare-tutto, w.cambiare-vita, w.anno-sabbatico, w.volontariato]
    grammar: [g.come-se]
    expect:
      - { pattern: "\\bcome se\\b", hint: "Use come se + congiuntivo: come se fosse nato lì…" }
    model: { es: "Mio cugino Paolo ha mollato tutto l'anno scorso. Lavorava in banca a Milano, ma un giorno ha deciso di cambiare vita e si è preso un anno sabbatico. Adesso fa volontariato in un'associazione dei Quartieri Spagnoli, a Napoli, e parla napoletano come se fosse nato lì! Quando i vecchi colleghi lo chiamano, risponde come se niente fosse, come se la banca non fosse mai esistita. Si alza tardi, prende il caffè al bar sotto casa e saluta tutti come se li conoscesse da sempre. Io lo invidio un po'!", en: "My cousin Paolo dropped everything last year. He worked in a bank in Milan, but one day he decided to change his life and took a sabbatical year. Now he does voluntary work for an association in the Quartieri Spagnoli in Naples, and he speaks Neapolitan as if he'd been born there! When his old colleagues call him, he answers as if nothing had happened, as if the bank had never existed. He gets up late, has his coffee at the bar downstairs and greets everyone as if he'd known them forever. I envy him a bit!" }
