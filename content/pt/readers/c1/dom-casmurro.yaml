id: r.c1.dom-casmurro
level: c1
title: "Dom Casmurro: o título e os olhos de Capitu"
kind: literature
author: Machado de Assis (1839–1908)
source: "Dom Casmurro (1899), capítulos I («Do título»), II («Do livro», início) e XXXII («Olhos de ressaca», excerto). Ortografia atualizada; cortes marcados com (…). Domínio público."
intro: "Bento Santiago, now an old man living alone in a Rio suburb, explains how he got his nickname and why he is writing; then he remembers the eyes of Capitu, the girl next door. Notice the narrator's ironic asides to the reader, the European-style enclisis (cumprimentou-me, vi-lhe) that was normal written Brazilian Portuguese in 1899, and the literary pluperfect (dera, vira)."
allow: [machado, assis, casmurro, bento, santiago, capitu, engenho, novo, central, petrópolis, renânia, matacavalos, josé, dias]
paragraphs:
  - { es: "DO TÍTULO. Uma noite destas, vindo da cidade para o Engenho Novo, encontrei no trem da Central um rapaz aqui do bairro, que eu conheço de vista e de chapéu. Cumprimentou-me, sentou-se ao pé de mim, falou da lua e dos ministros, e acabou recitando-me versos. A viagem era curta, e os versos pode ser que não fossem inteiramente maus. Sucedeu, porém, que, como eu estava cansado, fechei os olhos três ou quatro vezes; tanto bastou para que ele interrompesse a leitura e metesse os versos no bolso.", en: "ON THE TITLE. One night not long ago, coming from the city to Engenho Novo, I met on the Central line train a young man from around here whom I know by sight and by hat. He greeted me, sat down beside me, talked about the moon and the ministers, and ended up reciting verses to me. The journey was short, and the verses may not have been altogether bad. It happened, however, that, as I was tired, I closed my eyes three or four times; that was enough for him to break off the reading and put the verses in his pocket." }
  - { es: "— Continue, disse eu acordando. — Já acabei, murmurou ele. — São muito bonitos. Vi-lhe fazer um gesto para tirá-los outra vez do bolso, mas não passou do gesto; estava amuado. No dia seguinte entrou a dizer de mim nomes feios, e acabou alcunhando-me Dom Casmurro. Os vizinhos, que não gostam dos meus hábitos reclusos e calados, deram curso à alcunha, que afinal pegou. Nem por isso me zanguei.", en: "'Go on,' I said, waking up. 'I've finished,' he murmured. 'They are very pretty.' I saw him make a gesture to take them out of his pocket again, but it went no further than the gesture; he was sulking. The next day he began calling me names, and ended up nicknaming me Dom Casmurro. The neighbours, who do not like my reclusive, silent habits, spread the nickname, which in the end stuck. I did not get angry about it." }
  - { es: "Contei a anedota aos amigos da cidade, e eles, por graça, chamam-me assim, alguns em bilhetes: “Dom Casmurro, domingo vou jantar com você.” — “Vou para Petrópolis, Dom Casmurro; a casa é a mesma da Renânia; vê se deixas essa caverna do Engenho Novo, e vai lá passar uns quinze dias comigo.” — “Meu caro Dom Casmurro, não cuide que o dispenso do teatro amanhã; venha e dormirá aqui na cidade; dou-lhe camarote, dou-lhe chá, dou-lhe cama; só não lhe dou moça.”", en: "I told the anecdote to my friends in the city, and they, as a joke, call me that, some of them in notes: 'Dom Casmurro, I'm coming to dinner on Sunday.' — 'I'm going to Petrópolis, Dom Casmurro; the house is the same one as in the Rhineland; see if you can leave that cave of yours in Engenho Novo and go and spend a fortnight there with me.' — 'My dear Dom Casmurro, don't think I'm letting you off the theatre tomorrow; come, and you'll sleep here in town; I'll give you a box, I'll give you tea, I'll give you a bed; the only thing I won't give you is a girl.'" }
  - { es: "Não consultes dicionários. Casmurro não está aqui no sentido que eles lhe dão, mas no que lhe pôs o vulgo de homem calado e metido consigo. Dom veio por ironia, para atribuir-me fumos de fidalgo. Tudo por estar cochilando! Também não achei melhor título para a minha narração; se não tiver outro daqui até ao fim do livro, vai este mesmo.", en: "Do not consult dictionaries. Casmurro is not used here in the sense they give it, but in the one the common people gave it, of a silent man who keeps to himself. Dom came by way of irony, to credit me with airs of nobility. All because I was nodding off! Nor did I find a better title for my narrative; if I don't find another between now and the end of the book, this one will do." }
  - { es: "O meu poeta do trem ficará sabendo que não lhe guardo rancor. E com pequeno esforço, sendo o título seu, poderá cuidar que a obra é sua. Há livros que apenas terão isso dos seus autores; alguns nem tanto.", en: "My poet of the train will learn that I bear him no grudge. And with a little effort, since the title is his, he may think the work is his too. There are books that owe only that to their authors; some not even that." }
  - { es: "DO LIVRO. Agora que expliquei o título, passo a escrever o livro. Antes disso, porém, digamos os motivos que me põem a pena na mão. Vivo só, com um criado. A casa em que moro é própria; fi-la construir de propósito, levado de um desejo tão particular que me vexa imprimi-lo, mas vá lá. Um dia, há bastantes anos, lembrou-me reproduzir no Engenho Novo a casa em que me criei na antiga Rua de Matacavalos, dando-lhe o mesmo aspecto e economia daquela outra, que desapareceu. (…) O meu fim evidente era atar as duas pontas da vida, e restaurar na velhice a adolescência. Pois, senhor, não consegui recompor o que foi nem o que fui. Em tudo, se o rosto é igual, a fisionomia é diferente.", en: "ON THE BOOK. Now that I have explained the title, I shall go on to write the book. Before that, however, let us state the reasons that put the pen in my hand. I live alone, with a servant. The house I live in is my own; I had it built on purpose, driven by a wish so peculiar that I am embarrassed to put it in print, but here goes. One day, a good many years ago, it occurred to me to reproduce in Engenho Novo the house I grew up in on the old Rua de Matacavalos, giving it the same look and layout as that other one, which has disappeared. (…) My obvious aim was to tie together the two ends of life, and to restore adolescence in old age. Well, sir, I did not manage to put back together what was, nor what I was. In everything, if the face is the same, the expression is different." }
  - { es: "OLHOS DE RESSACA. (…) Tinha-me lembrado a definição que José Dias dera deles, “olhos de cigana oblíqua e dissimulada”. Eu não sabia o que era oblíqua, mas dissimulada sabia, e queria ver se se podiam chamar assim. Capitu deixou-se fitar e examinar. Só me perguntava o que era, se nunca os vira; eu nada achei extraordinário; a cor e a doçura eram minhas conhecidas.", en: "UNDERTOW EYES. (…) I had remembered the definition José Dias had given of them: 'the eyes of a gypsy, sidelong and sly'. I did not know what sidelong meant, but sly I knew, and I wanted to see whether they could be called that. Capitu let herself be stared at and examined. She only asked me what it was, whether I had never seen them before; I found nothing extraordinary; their colour and their sweetness were known to me." }
  - { es: "Retórica dos namorados, dá-me uma comparação exata e poética para dizer o que foram aqueles olhos de Capitu. Não me acode imagem capaz de dizer, sem quebra da dignidade do estilo, o que eles foram e me fizeram. Olhos de ressaca? Vá, de ressaca. É o que me dá ideia daquela feição nova. Traziam não sei que fluido misterioso e enérgico, uma força que arrastava para dentro, como a vaga que se retira da praia, nos dias de ressaca.", en: "Rhetoric of lovers, give me an exact and poetic comparison to say what those eyes of Capitu's were. No image comes to me that can say, without loss of dignity of style, what they were and what they did to me. Undertow eyes? So be it: undertow. That is what gives me an idea of that new look. They held some mysterious, energetic fluid, a force that dragged one inwards, like the wave that draws back from the beach on days of heavy surf." }
  - { es: "Para não ser arrastado, agarrei-me às outras partes vizinhas, às orelhas, aos braços, aos cabelos espalhados pelos ombros; mas tão depressa buscava as pupilas, a onda que saía delas vinha crescendo, cava e escura, ameaçando envolver-me, puxar-me e tragar-me.", en: "So as not to be dragged away, I clung to the other parts nearby, to her ears, her arms, her hair spread over her shoulders; but as soon as I sought her pupils, the wave that came out of them kept growing, hollow and dark, threatening to envelop me, pull me in and swallow me." }
questions:
  - { q: "Por que o narrador ganhou o apelido de Dom Casmurro?", options: ["Porque era um nobre de verdade", "Porque escreveu um livro com esse título", "Porque cochilou enquanto um rapaz lia versos para ele no trem", "Porque brigou com os vizinhos"], answer: 2, explain: "The young poet, offended that Bento closed his eyes during the recital, began calling him names and invented the nickname, which the neighbours then spread." }
  - { q: "Em que sentido a palavra “casmurro” é usada no livro, segundo o narrador?", options: ["No sentido popular de homem calado e fechado em si mesmo", "No sentido do dicionário", "No sentido de homem rico", "No sentido de poeta ruim"], answer: 0, explain: "He tells us not to consult dictionaries: the word is meant in the popular sense of 'homem calado e metido consigo'." }
  - { q: "Qual é a ironia final do primeiro capítulo?", options: ["O narrador vai processar o poeta", "O poeta pode achar que o livro é dele, já que o título é dele", "Os amigos não sabem do apelido", "O livro não tem título"], answer: 1, explain: "Machado jokes that since the title is the poet's, the poet may think the whole work is his; some books owe their authors no more than that." }
  - { q: "O que o narrador queria fazer ao escrever o livro?", options: ["Ganhar dinheiro", "Responder ao poeta do trem", "Atar as duas pontas da vida e restaurar na velhice a adolescência", "Descrever a cidade do Rio"], answer: 2, explain: "Chapter II: 'O meu fim evidente era atar as duas pontas da vida' — and he admits he failed." }
  - { q: "Por que os olhos de Capitu são chamados “de ressaca”?", options: ["Porque ela tinha bebido demais", "Porque tinham uma força que puxava para dentro, como a onda que se retira da praia", "Porque eram verdes como o mar", "Porque estavam cansados"], answer: 1, explain: "Here ressaca means a heavy, dragging surf (undertow), not a hangover: her eyes pull him in like a wave drawing back from the beach." }
