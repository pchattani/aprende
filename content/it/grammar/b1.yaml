# B1 grammar notes (the North). Explanations use light markdown: ### headings,
# bullets, tables, **bold**, *italic* (italic = Italian example inline).
- id: g.combined-pronouns
  level: b1
  title: "Combined pronouns: me lo, te la, glielo"
  summary: "Indirect + direct pronoun: mi → me, ti → te, gli/le → glie-: me lo dai? glielo dico."
  explanation: |
    When an indirect pronoun (*to me, to him*) and a direct pronoun (*it, them*) meet, the indirect comes **first** and changes its *-i* to *-e*:

    | | + lo | + la | + li | + le | + ne |
    |---|---|---|---|---|---|
    | mi | **me lo** | me la | me li | me le | me ne |
    | ti | **te lo** | te la | te li | te le | te ne |
    | gli / le / Le | **glielo** | gliela | glieli | gliele | gliene |
    | ci | **ce lo** | ce la | ce li | ce le | ce ne |
    | vi | **ve lo** | ve la | ve li | ve le | ve ne |
    | gli (loro) | **glielo** | gliela | glieli | gliele | gliene |

    - *Gli* and *le* both become **glie-** and join the second pronoun in **one word**: *glielo* = it to him / to her / to them / to you (formal).
    - Position: before the conjugated verb, or attached to an infinitive / gerund / imperative: *Te lo presto. Posso prestartelo? Dammelo!*
    - Reflexive *si* + *lo* → **se lo**: *Se lo è mangiato tutto.*
  examples:
    - { es: "Mi presti la macchina? Sì, te la presto.", en: "Will you lend me the car? Yes, I'll lend it to you." }
    - { es: "Hai dato il libro a Marco? Sì, glielo do domani.", en: "Did you give Marco the book? Yes, I'll give it to him tomorrow." }
    - { es: "Ce lo dici o no?", en: "Are you going to tell us or not?" }
    - { es: "Signora, gliela incarto?", en: "Madam, shall I wrap it for you?" }
  pitfalls:
    - "*Mi lo* and *ti la* don't exist: always *me lo, te la*."
    - "*Glielo* is one word, and covers him, her, them and formal you: context decides."
    - "Spanish speakers: *se lo* (to him) → *glielo*; Italian *se lo* is only reflexive."
  related: [g.indirect-object-pronouns, g.direct-object-pronouns, g.combined-pronouns-past]
  drills:
    - { es: "Me lo spieghi di nuovo?", en: "Will you explain it to me again?" }
    - { es: "Le scarpe? Gliele compro io.", en: "The shoes? I'll buy them for her." }
    - { es: "Ve lo prometto.", en: "I promise you (all)." }
    - { es: "Non te lo posso dire.", en: "I can't tell you." }
    - { es: "Devo mandarglielo entro stasera.", en: "I have to send it to him by tonight." }
- id: g.combined-pronouns-past
  level: b1
  title: "Combined pronouns in the past: gliel'ho detto, te le ho comprate"
  summary: "With compound tenses the participle agrees with the direct pronoun: me l'ha data, glieli ho mandati."
  explanation: |
    - *Lo* and *la* elide before *ho, ha, hanno*: *me l'ha detto, gliel'ho dato*.
    - The participle agrees with the **direct** pronoun (*lo, la, li, le, ne*), not the indirect one:

    | | |
    |---|---|
    | *La chiave? **Me l'**ha dat**a** Marco.* | (la → -a) |
    | *I soldi? **Glieli** ho restituit**i**.* | (li → -i) |
    | *Le foto? **Te le** ho mandat**e** ieri.* | (le → -e) |
    | *Dei consigli? **Ce ne** ha dat**i** tanti.* | (ne → agrees with the noun) |

    Because *l'* hides gender, the participle tells you: *Gliel'ho dato* (it, m.) vs *Gliel'ho data* (it, f.).
  examples:
    - { es: "Chi ti ha detto questa cosa? Me l'ha detta Luca.", en: "Who told you this? Luca told me." }
    - { es: "Le lettere? Gliele ho spedite ieri.", en: "The letters? I sent them to him yesterday." }
    - { es: "Ve l'avevo detto!", en: "I told you so!" }
    - { es: "Il regalo? Gliel'abbiamo portato a Milano.", en: "The present? We took it to her in Milan." }
  pitfalls:
    - "Agreement follows the direct pronoun: *gliel'ho data* (the key), even if 'him' is male."
    - "*Glieli ho*, not *gli li ho* and not *glie li ho*: one word."
    - "In speech agreement after *ne* and *l'* is sometimes skipped, but write it."
  related: [g.combined-pronouns, g.pronoun-participle-agreement]
  drills:
    - { es: "La notizia? Me l'hanno data stamattina.", en: "The news? They gave it to me this morning." }
    - { es: "I biglietti? Te li ho già mandati.", en: "The tickets? I've already sent them to you." }
    - { es: "Gliel'hai detto?", en: "Did you tell him?" }
- id: g.ce-ne-ce-lo
  level: b1
  title: "Ce n'è, ce ne sono, ce l'ho"
  summary: "ci + ne = ce n'è (there's some); ci + lo with avere = ce l'ho (I've got it)."
  explanation: |
    ### ci + ne: quantities that exist
    | question | answer |
    |---|---|
    | *C'è del latte?* | *Sì, ce n'è un po'.* / *No, non ce n'è.* |
    | *Ci sono dei bar qui?* | *Sì, ce ne sono tanti.* |
    | *Quanti posti ci sono?* | *Ce ne sono due.* |

    ### ce l'ho, ce li ho: colloquial 'have got'
    With *avere* + direct pronoun, spoken Italian adds *ci*, which becomes *ce*:
    - *Hai il biglietto? — Sì, **ce l'ho**.* (Yes, I've got it.)
    - *Hai le chiavi? — No, non **ce le** ho.*
    - *Ce la fai?* (Can you manage?) is a fixed expression: *farcela* (B2).

    *Ci* here has no meaning of its own; it makes the sentence sound natural, like English 'got'.
  examples:
    - { es: "Ci sono ancora biglietti? Sì, ce ne sono pochi.", en: "Are there any tickets left? Yes, there are a few." }
    - { es: "Hai la carta d'identità? Sì, ce l'ho.", en: "Have you got your ID card? Yes, I have." }
    - { es: "Non ce n'è più, l'abbiamo finito.", en: "There's none left, we finished it." }
    - { es: "Hai gli occhiali? No, non ce li ho.", en: "Have you got your glasses? No, I haven't." }
  pitfalls:
    - "*Ce n'è* (one / uncountable) vs *ce ne sono* (plural)."
    - "Don't answer *Hai il biglietto?* with *Sì, l'ho*: say *Sì, ce l'ho*."
    - "*C'ho* (I've got) is common in speech and informal writing but not standard spelling."
  related: [g.c-e-ci-sono, g.ne-partitive, g.pronominal-verbs]
  drills:
    - { es: "C'è ancora del caffè? No, non ce n'è.", en: "Is there any coffee left? No, there isn't." }
    - { es: "Hai una penna? Sì, ce l'ho.", en: "Have you got a pen? Yes, I have." }
    - { es: "Quanti musei ci sono a Torino? Ce ne sono tantissimi.", en: "How many museums are there in Turin? There are loads." }
- id: g.imperativo-pronouns
  level: b1
  title: "Imperative with pronouns: fallo! diteglielo! non farlo!"
  summary: "Pronouns attach to the end of tu, noi, voi commands; with non they can go either side."
  explanation: |
    ### Affirmative tu, noi, voi: pronouns attach
    | | |
    |---|---|
    | *Prendilo!* | Take it! |
    | *Alzati!* | Get up! |
    | *Mangiamola!* | Let's eat it! |
    | *Ditemelo!* | Tell me (you all)! |
    | *Vacci!* | Go there! |
    | *Prendine due!* | Take two! |

    The stress stays where it was: *PREN-di-lo, MAN-gia-me-lo*.

    ### Negative
    - tu: *non* + infinitive, pronoun attached (drop the -e) or before: *Non farlo! / Non lo fare!*
    - noi, voi: *Non ditelo! / Non lo dite!*

    ### Lei: pronouns before (see the next notes)
    *Lo prenda! Si accomodi! Me lo dica!*
  examples:
    - { es: "Questo libro è bellissimo, leggilo!", en: "This book is wonderful, read it!" }
    - { es: "Svegliati, sono le otto!", en: "Wake up, it's eight o'clock!" }
    - { es: "Non preoccupatevi, va tutto bene.", en: "Don't worry (all of you), everything's fine." }
    - { es: "Non dirlo a nessuno!", en: "Don't tell anyone!" }
  pitfalls:
    - "Affirmative tu commands attach the pronoun: *Fallo!*, not *Lo fa'!*"
    - "Negative tu: *non farlo* or *non lo fare*, never *non fallo*."
    - "Spanish speakers: same idea as *dímelo, no me lo digas*, but Italian negative tu uses the infinitive."
  related: [g.imperativo-tu, g.imperativo-negative, g.imperativo-short-forms]
  drills:
    - { es: "Chiamami quando arrivi a Milano.", en: "Call me when you get to Milan." }
    - { es: "Ragazzi, sbrigatevi!", en: "Guys, hurry up!" }
    - { es: "Non arrabbiarti!", en: "Don't get angry!" }
    - { es: "Compriamoli adesso.", en: "Let's buy them now." }
- id: g.imperativo-short-forms
  level: b1
  title: "Dammi, fammi, dillo, vacci — doubling with short imperatives"
  summary: "da', fa', di', sta', va' + a pronoun double its consonant: dammi, fallo, dimmelo, stacci, vattene."
  explanation: |
    The five one-syllable tu imperatives **double the first consonant** of the attached pronoun:

    | imperative | + pronoun | example |
    |---|---|---|
    | *da'* | *dammi, dallo, dalle, dacci, danne* | *Dammi una mano!* |
    | *fa'* | *fammi, fallo, facci, fanne* | *Fammi vedere!* |
    | *di'* | *dimmi, dillo, dicci, digli* | *Dimmi la verità.* |
    | *sta'* | *stammi, stacci* | *Stammi bene!* (Take care!) |
    | *va'* | *vattene, vacci* | *Vacci tu!* |

    - **Exception**: *gli* never doubles: *digli, fagli, dagli*.
    - Combined: *dammelo, fammelo, diglielo, vattene* (*va' + te + ne*).
    - The doubling only happens with the short forms; *vai* and *fai* + pronoun don't exist as imperatives.
  examples:
    - { es: "Dimmi cosa è successo.", en: "Tell me what happened." }
    - { es: "Fammi sapere quando arrivi.", en: "Let me know when you arrive." }
    - { es: "Dagli il mio numero.", en: "Give him my number." }
    - { es: "Vattene, sono arrabbiato!", en: "Go away, I'm angry!" }
  pitfalls:
    - "*Dimmi*, not *dimi*; *fallo*, not *falo*."
    - "No doubling with *gli*: *digli*, not *diggli*."
    - "*Fammi sapere* (let me know) is extremely common at the end of messages."
  related: [g.imperativo-pronouns, g.imperativo-tu]
  drills:
    - { es: "Dammelo, per favore.", en: "Give it to me, please." }
    - { es: "Fammi un favore.", en: "Do me a favour." }
    - { es: "Diccelo subito!", en: "Tell us right now!" }
    - { es: "Stammi bene!", en: "Take care!" }
- id: g.imperativo-lei-pronouns
  level: b1
  title: "Formal commands with pronouns: mi dica, si accomodi, lo prenda"
  summary: "With Lei, pronouns always go before the verb: Me lo porti. Non si preoccupi."
  explanation: |
    The *Lei* imperative is a subjunctive form, so pronouns go **before**, never attached:

    | tu | Lei |
    |---|---|
    | *Dimmi!* | **Mi dica!** |
    | *Accomodati!* | **Si accomodi!** |
    | *Prendilo!* | **Lo prenda!** |
    | *Dammelo!* | **Me lo dia!** |
    | *Non preoccuparti!* | **Non si preoccupi!** |
    | *Fammi sapere.* | **Mi faccia sapere.** |

    Everyday service Italian is full of these: *Mi dica. — Si sieda. — Me lo incarti, per favore. — Si figuri!* (Not at all!) — *Mi scusi.*
  examples:
    - { es: "Buongiorno, mi dica.", en: "Good morning, how can I help?" }
    - { es: "Si accomodi, il dottore arriva subito.", en: "Have a seat, the doctor will be right with you." }
    - { es: "Me lo può incartare? Sì, me lo incarti pure.", en: "Can you wrap it? Yes, please wrap it for me." }
    - { es: "Non si preoccupi, glielo porto io.", en: "Don't worry, I'll bring it to you." }
  pitfalls:
    - "Never attach with *Lei*: *mi dica*, not *dicami*."
    - "*Si figuri* (formal) = *figurati* (informal): 'don't mention it'."
    - "Spanish speakers: Spanish attaches (*dígame, siéntese*); Italian puts them before (*mi dica, si sieda*)."
  related: [g.imperativo-lei, g.imperativo-pronouns, g.lei-forms]
  drills:
    - { es: "Mi faccia vedere il passaporto.", en: "Let me see your passport." }
    - { es: "Si sieda qui.", en: "Sit here." }
    - { es: "Me lo ripeta, per favore.", en: "Please repeat it for me." }
    - { es: "Grazie mille! Si figuri.", en: "Thanks so much! Not at all." }
- id: g.condizionale-uses
  level: b1
  title: "Uses of the conditional"
  summary: "Wishes, polite requests, advice, hypotheses, opinions softened: vorrei, potresti, dovresti, direi."
  explanation: |
    | use | example |
    |---|---|
    | wish | *Mi piacerebbe vivere a Bologna.* |
    | polite request | *Mi passeresti il sale?* |
    | advice | *Dovresti parlarne con lei.* |
    | hypothesis (with *se*, B2) | *Che faresti con un milione?* |
    | softened opinion | *Direi che è troppo tardi. Non saprei.* |
    | doubt about the facts | *Sarebbe a Torino, ma non ne sono sicuro.* |
    | future in the past (perfect form) | *Ha detto che sarebbe venuto.* |

    ### Softening phrases
    *Direi* (I'd say), *non saprei* (I wouldn't know), *preferirei* (I'd rather), *avrei bisogno di* (I'd need), *sarebbe meglio* (it would be better), *bisognerebbe* (one should).
  examples:
    - { es: "Ci vorrebbe più tempo per vedere Venezia.", en: "You'd need more time to see Venice." }
    - { es: "Direi di prendere il vaporetto.", en: "I'd say we take the vaporetto." }
    - { es: "Che ne diresti di una gita sul lago?", en: "How about a trip to the lake?" }
    - { es: "Non saprei, dovresti chiedere a Giulia.", en: "I wouldn't know, you should ask Giulia." }
  pitfalls:
    - "After *se* use the congiuntivo, not the conditional: *se potessi, verrei* (B2)."
    - "*Vorrei che* + congiuntivo imperfetto: *vorrei che tu venissi*, not *che tu vieni*."
    - "Spanish speakers: *me gustaría* → *mi piacerebbe*; same uses."
  related: [g.condizionale-presente, g.condizionale-passato, g.condizionale-hearsay]
  drills:
    - { es: "Preferirei restare a casa stasera.", en: "I'd rather stay at home tonight." }
    - { es: "Bisognerebbe prenotare prima.", en: "One ought to book in advance." }
    - { es: "Ti andrebbe un aperitivo sui Navigli?", en: "Would you fancy an aperitivo on the Navigli?" }
    - { es: "Sarebbe bello vederci più spesso.", en: "It would be nice to see each other more often." }
- id: g.condizionale-passato
  level: b1
  title: "The past conditional: avrei fatto, sarei andato"
  summary: "avere / essere in the conditional + participle: would have; also the future seen from the past."
  explanation: |
    | | avere | essere |
    |---|---|---|
    | io | avrei mangiato | sarei andato/a |
    | tu | avresti mangiato | saresti andato/a |
    | lui / lei | avrebbe mangiato | sarebbe andato/a |
    | noi | avremmo mangiato | saremmo andati/e |
    | voi | avreste mangiato | sareste andati/e |
    | loro | avrebbero mangiato | sarebbero andati/e |

    ### Uses
    1. **Unrealised wishes and regret**: *Avrei voluto vederti.* (I would have liked to see you.)
    2. **Results of unreal past conditions** (B2): *Se l'avessi saputo, sarei venuto.*
    3. **Future in the past** — where English uses 'would': *Ha detto che sarebbe arrivato alle otto.* (He said he would arrive at eight.)

    Use 3 is a big difference from English and Spanish: Italian requires the **past** conditional, even if the arrival may still happen.
  examples:
    - { es: "Sarei venuto volentieri, ma ero malato.", en: "I would gladly have come, but I was ill." }
    - { es: "Mi avevi promesso che mi avresti chiamato!", en: "You promised me you would call!" }
    - { es: "Avremmo preferito un tavolo vicino alla finestra.", en: "We would have preferred a table by the window." }
    - { es: "Sapevo che avresti capito.", en: "I knew you would understand." }
  pitfalls:
    - "Future in the past is *sarebbe venuto*, not *verrebbe*: *Ha detto che sarebbe venuto*."
    - "Agreement after *essere*: *Anna sarebbe partita*."
    - "Spanish speakers: *dijo que vendría* → *ha detto che sarebbe venuto* (past conditional)."
  related: [g.condizionale-presente, g.modals-condizionale-passato, g.discorso-indiretto-past]
  drills:
    - { es: "Avrei dovuto dirtelo prima.", en: "I should have told you earlier." }
    - { es: "Pensavo che sarebbe stato più facile.", en: "I thought it would be easier." }
    - { es: "Ci saremmo divertiti di più a Verona.", en: "We would have had more fun in Verona." }
    - { es: "Ha promesso che avrebbe pagato lui.", en: "He promised he would pay." }
- id: g.modals-condizionale-passato
  level: b1
  title: "Avrei dovuto, avresti potuto — should have, could have"
  summary: "Modal verbs in the past conditional express regret and reproach: avrei dovuto studiare."
  explanation: |
    | Italian | English |
    |---|---|
    | *avrei dovuto* + inf. | I should have / ought to have |
    | *avrei potuto* + inf. | I could have |
    | *avrei voluto* + inf. | I would have liked to |

    - *Avresti dovuto dirmelo!* — You should have told me!
    - *Avremmo potuto prendere il treno.* — We could have taken the train.

    ### Auxiliary
    With a verb that takes *essere*, the modal can take *essere* too (careful style): *Sarei dovuto partire prima* / *Avrei dovuto partire prima* (both used).

    ### Spoken shortcut: imperfetto
    In speech the imperfetto of modals often replaces this: *Dovevi dirmelo!* (You should have told me!) *Potevi chiamare!* (You could have called!)
  examples:
    - { es: "Avresti dovuto vedere la faccia di Marco!", en: "You should have seen Marco's face!" }
    - { es: "Avrei potuto vincere, ma sono caduto.", en: "I could have won, but I fell." }
    - { es: "Saremmo dovuti partire all'alba.", en: "We should have left at dawn." }
    - { es: "Potevi avvisarmi!", en: "You could have warned me!" }
  pitfalls:
    - "Not *dovrei avere fatto*: Italian puts the modal in the past: *avrei dovuto fare*."
    - "*Avrei potuto* (I could have) vs *potrei* (I could): don't mix them up."
    - "Spanish speakers: *debería haberlo hecho* → *avrei dovuto farlo*."
  related: [g.condizionale-passato, g.potere-dovere]
  drills:
    - { es: "Avrei voluto studiare medicina.", en: "I would have liked to study medicine." }
    - { es: "Non avresti dovuto mangiare tutto.", en: "You shouldn't have eaten everything." }
    - { es: "Avreste potuto aspettarci!", en: "You could have waited for us!" }
- id: g.condizionale-hearsay
  level: b1
  title: "Secondo la polizia, sarebbe fuggito — the conditional of hearsay"
  summary: "The news uses the conditional to report unconfirmed information."
  explanation: |
    Journalists use the conditional to say 'reportedly, allegedly' — the writer does not vouch for the facts:
    - *Secondo alcune fonti, il ministro **sarebbe** pronto a dimettersi.* — According to some sources, the minister is reportedly ready to resign.
    - *Il ladro **sarebbe fuggito** in moto.* — The thief allegedly escaped on a motorbike.

    - Present conditional = reported present state.
    - Past conditional = reported past event.
    - Often with *secondo* (according to), *stando a* (according to), *pare che, sembra che* (+ congiuntivo).

    You also hear it in conversation: *Marco sarebbe a Torino, ma non ne sono sicuro.*
  examples:
    - { es: "Secondo i testimoni, l'incendio sarebbe partito dalla cucina.", en: "According to witnesses, the fire apparently started in the kitchen." }
    - { es: "La nuova linea della metro sarebbe pronta entro due anni.", en: "The new metro line will reportedly be ready within two years." }
    - { es: "Il cantante si sarebbe sposato in segreto a Como.", en: "The singer allegedly got married in secret on Lake Como." }
  pitfalls:
    - "This conditional is not 'would': translate with 'reportedly, apparently, allegedly'."
    - "Don't use it for facts you state yourself: that would sound like you doubt them."
    - "Spanish uses it too in journalism (*el ladrón habría huido*), but Italian uses it far more often."
  related: [g.condizionale-uses, g.journalistic-language]
  drills:
    - { es: "Secondo la stampa, l'accordo sarebbe vicino.", en: "According to the press, a deal is close." }
    - { es: "Il quadro sarebbe stato rubato negli anni Settanta.", en: "The painting was reportedly stolen in the seventies." }
    - { es: "Stando alle prime notizie, non ci sarebbero feriti.", en: "According to early reports, there are no injuries." }
- id: g.trapassato-prossimo
  level: b1
  title: "The trapassato prossimo: avevo fatto, ero andato"
  summary: "imperfetto of avere / essere + participle: an action before another past action."
  explanation: |
    | | avere | essere |
    |---|---|---|
    | io | avevo visto | ero partito/a |
    | tu | avevi visto | eri partito/a |
    | lui / lei | aveva visto | era partito/a |
    | noi | avevamo visto | eravamo partiti/e |
    | voi | avevate visto | eravate partiti/e |
    | loro | avevano visto | erano partiti/e |

    Same auxiliary choice and agreement as the passato prossimo.

    ### Use
    The 'past before the past' (English 'had done'):
    - *Quando sono arrivato in stazione, il treno **era** già **partito**.*
    - *Non **avevo** mai **visto** Venezia prima.*
    - *Mi ha detto che **aveva perso** le chiavi.*
  examples:
    - { es: "Quando siamo arrivati, il concerto era già cominciato.", en: "When we arrived, the concert had already started." }
    - { es: "Non ero mai stato a Trieste prima di quel viaggio.", en: "I had never been to Trieste before that trip." }
    - { es: "Ha detto che aveva già mangiato.", en: "She said she had already eaten." }
    - { es: "Avevamo prenotato, ma non c'era posto.", en: "We had booked, but there was no room." }
  pitfalls:
    - "Don't use the passato prossimo for the earlier action: *era già partito*, not *è già partito*."
    - "Agreement with *essere*: *Le ragazze erano uscite*."
    - "Spanish speakers: *había salido* → *era uscito* (essere with movement verbs)."
  related: [g.passato-prossimo-vs-imperfetto, g.past-infinitive, g.trapassato-remoto]
  drills:
    - { es: "Quando ho chiamato, era già uscita.", en: "When I called, she had already gone out." }
    - { es: "Mi avevano detto che era chiuso.", en: "They had told me it was closed." }
    - { es: "Non avevo capito niente!", en: "I hadn't understood a thing!" }
    - { es: "Eravamo appena arrivati quando ha cominciato a piovere.", en: "We had just arrived when it started to rain." }
- id: g.futuro-anteriore
  level: b1
  title: "The futuro anteriore: avrò finito, sarò arrivato"
  summary: "future of avere / essere + participle: will have done; and guesses about the past."
  explanation: |
    | | avere | essere |
    |---|---|---|
    | io | avrò finito | sarò arrivato/a |
    | tu | avrai finito | sarai arrivato/a |
    | lui / lei | avrà finito | sarà arrivato/a |
    | noi | avremo finito | saremo arrivati/e |
    | voi | avrete finito | sarete arrivati/e |
    | loro | avranno finito | saranno arrivati/e |

    ### Uses
    1. **Completed before a future moment**: *Alle sei avrò finito.* — I'll have finished by six.
    2. **After quando, appena, dopo che** for the earlier of two future actions: *Quando avrai finito, chiamami.* — When you've finished, call me. (English uses the present perfect!)
    3. **Guessing about the past**: *Sarà già partito.* — He must have already left. *Dove avrò messo le chiavi?* — Where can I have put my keys?
  examples:
    - { es: "Appena avrò trovato casa, ti darò l'indirizzo.", en: "As soon as I've found a flat, I'll give you the address." }
    - { es: "Entro giugno avremo finito i lavori.", en: "We'll have finished the work by June." }
    - { es: "Non risponde, avrà dimenticato il telefono.", en: "He's not answering, he must have forgotten his phone." }
    - { es: "Quando sarete arrivati a Verona, mandateci un messaggio.", en: "When you've got to Verona, send us a message." }
  pitfalls:
    - "After *quando / appena* about the future, use a future tense: *quando avrai finito*, not *quando hai finito* (common in speech, but less careful)."
    - "*Avrà perso il treno* is usually a guess ('he must have'), not a prediction."
    - "Spanish speakers: *cuando hayas terminado* (subjunctive) → *quando avrai finito* (future perfect)."
  related: [g.futuro-semplice, g.futuro-probability]
  drills:
    - { es: "Dopo che avrai letto il libro, prestamelo.", en: "After you've read the book, lend it to me." }
    - { es: "Che cosa sarà successo?", en: "What can have happened?" }
    - { es: "A quest'ora saranno già arrivati a Milano.", en: "By now they'll have arrived in Milan." }
- id: g.past-infinitive
  level: b1
  title: "Dopo aver mangiato, prima di uscire — linking actions"
  summary: "prima di + infinitive; dopo + past infinitive (aver fatto, essere arrivato)."
  explanation: |
    When both actions have the **same subject**, Italian uses an infinitive:

    ### prima di + infinitive (before doing)
    *Prima di uscire, chiudo le finestre.* — Before going out, I close the windows.

    ### dopo + past infinitive (after doing)
    The past infinitive = *avere* / *essere* + participle (the *-e* of *avere* is usually dropped):
    - *Dopo aver mangiato, siamo andati a passeggio.*
    - *Dopo essere arrivata a Bologna, Anna mi ha chiamato.* (agreement with *essere*)
    - *Dopo essermi svegliato…* (reflexive pronoun attached)

    ### Other uses of the past infinitive
    - *Grazie di / per avermi aiutato.* — Thanks for helping me.
    - *Mi dispiace di non essere venuto.* — I'm sorry I didn't come.
    - *Sono contento di averti conosciuto.*

    Different subjects → *prima che* + congiuntivo / *dopo che* + indicative (next units).
  examples:
    - { es: "Prima di partire, controlla il passaporto.", en: "Before leaving, check your passport." }
    - { es: "Dopo aver visto il Cenacolo, abbiamo pranzato in centro.", en: "After seeing the Last Supper, we had lunch in the centre." }
    - { es: "Grazie per essere venuti!", en: "Thank you for coming!" }
    - { es: "Mi pento di non aver studiato di più.", en: "I regret not having studied more." }
  pitfalls:
    - "*Dopo* + present infinitive is wrong: *dopo aver mangiato*, not *dopo mangiare*."
    - "*Prima di*, not *prima*: *prima di uscire*."
    - "Spanish speakers: *después de comer* → *dopo aver mangiato* (Italian needs the past infinitive)."
  related: [g.trapassato-prossimo, g.prima-che-prima-di, g.verbs-with-prepositions]
  drills:
    - { es: "Lavati le mani prima di mangiare.", en: "Wash your hands before eating." }
    - { es: "Dopo essersi laureata, si è trasferita a Torino.", en: "After graduating, she moved to Turin." }
    - { es: "Grazie di avermi aspettato.", en: "Thanks for waiting for me." }
    - { es: "Dopo aver finito il lavoro, andiamo a cena.", en: "After finishing work, we'll go to dinner." }
- id: g.congiuntivo-presente-forms
  level: b1
  title: "The congiuntivo presente: forms"
  summary: "-are verbs: parli, parli, parli, parliamo, parliate, parlino; -ere/-ire: prenda, senta, finisca."
  explanation: |
    | | parlare | prendere | sentire | finire |
    |---|---|---|---|---|
    | che io | parl**i** | prend**a** | sent**a** | fin**isca** |
    | che tu | parl**i** | prend**a** | sent**a** | fin**isca** |
    | che lui / lei | parl**i** | prend**a** | sent**a** | fin**isca** |
    | che noi | parl**iamo** | prend**iamo** | sent**iamo** | fin**iamo** |
    | che voi | parl**iate** | prend**iate** | sent**iate** | fin**iate** |
    | che loro | parl**ino** | prend**ano** | sent**ano** | fin**iscano** |

    ### Key facts
    - The three singular forms are **identical**, so the subject pronoun is often needed: *Penso che tu abbia ragione.*
    - *Noi* is the same as the indicative; *voi* ends in *-iate*.
    - Spelling: *cercare → cerchi, pagare → paghi, mangiare → mangi*.
    - The *Lei* imperative (*parli! prenda!*) is this same form.

    ### When?
    Mostly in subordinate clauses after *che*, when the main verb expresses opinion, doubt, wish, emotion or necessity — see the following notes.
  examples:
    - { es: "Penso che Milano sia molto cara.", en: "I think Milan is very expensive." }
    - { es: "Voglio che tu parli con lui.", en: "I want you to talk to him." }
    - { es: "Spero che prendiate il treno giusto.", en: "I hope you take the right train." }
    - { es: "È meglio che finiscano prima di sera.", en: "It's better if they finish before evening." }
  pitfalls:
    - "Singular forms are identical: add the pronoun if it's unclear: *che io parli / che lui parli*."
    - "-are verbs take -i, -ere/-ire take -a: the opposite of the indicative vowel."
    - "Spanish speakers: same vowel swap as Spanish (*hable, coma*), but the *-isc-* verbs keep *-isc-* (*finisca*)."
  related: [g.congiuntivo-irregular, g.congiuntivo-opinion, g.imperativo-lei]
  drills:
    - { es: "Credo che lavori in banca.", en: "I think he works in a bank." }
    - { es: "Bisogna che tu dorma di più.", en: "You need to sleep more." }
    - { es: "Non penso che capiscano.", en: "I don't think they understand." }
    - { es: "Preferisco che paghiamo con la carta.", en: "I'd prefer us to pay by card." }
- id: g.congiuntivo-irregular
  level: b1
  title: "Irregular congiuntivo: sia, abbia, vada, faccia, possa…"
  summary: "Most irregulars come from the io present: vengo → venga, faccio → faccia; essere and avere are special."
  explanation: |
    ### essere, avere, and five short verbs
    | | essere | avere | dare | stare | sapere |
    |---|---|---|---|---|---|
    | io/tu/lui | **sia** | **abbia** | **dia** | **stia** | **sappia** |
    | noi | siamo | abbiamo | diamo | stiamo | sappiamo |
    | voi | siate | abbiate | diate | stiate | sappiate |
    | loro | **siano** | **abbiano** | **diano** | **stiano** | **sappiano** |

    ### From the io form of the present
    | io present | congiuntivo (io/tu/lui) | loro |
    |---|---|---|
    | *vado* | **vada** | vadano |
    | *faccio* | **faccia** | facciano |
    | *vengo* | **venga** | vengano |
    | *dico* | **dica** | dicano |
    | *esco* | **esca** | escano |
    | *posso* | **possa** | possano |
    | *voglio* | **voglia** | vogliano |
    | *devo* | **debba** | debbano |
    | *bevo* | **beva** | bevano |
    | *rimango* | **rimanga** | rimangano |

    *Noi* and *voi* go back to the regular stem: *andiamo, andiate; veniamo, veniate*.
  examples:
    - { es: "Spero che tu stia meglio.", en: "I hope you're feeling better." }
    - { es: "Penso che sia la soluzione migliore.", en: "I think it's the best solution." }
    - { es: "È importante che vengano tutti.", en: "It's important that everyone comes." }
    - { es: "Non credo che possa venire.", en: "I don't think she can come." }
  pitfalls:
    - "*Che io sia*, not *che io sono*, after a trigger."
    - "*Vadano* and *facciano* follow the io stem; *andiamo, facciamo* do not change."
    - "Spanish speakers: *sea → sia, tenga → abbia* (avere), *vaya → vada*, *haga → faccia*."
  related: [g.congiuntivo-presente-forms, g.irregular-present]
  drills:
    - { es: "Voglio che tu sappia la verità.", en: "I want you to know the truth." }
    - { es: "Mi sembra che abbiano ragione.", en: "It seems to me they're right." }
    - { es: "Speriamo che faccia bel tempo a Como.", en: "Let's hope the weather's nice on Lake Como." }
    - { es: "Bisogna che diciate la verità.", en: "You must tell the truth." }
- id: g.congiuntivo-opinion
  level: b1
  title: "Penso che sia… — opinion, belief and doubt"
  summary: "penso che, credo che, mi sembra che, dubito che, non sono sicuro che + congiuntivo."
  explanation: |
    In standard Italian, verbs of **opinion, belief, doubt and supposition** take the congiuntivo:
    - *Penso che, credo che, ritengo che, suppongo che, immagino che*
    - *Mi sembra che, mi pare che*
    - *Dubito che, non sono sicuro che, non so se* (often)

    | indicative (fact, certainty) | congiuntivo (opinion, doubt) |
    |---|---|
    | *So che è a Milano.* | *Penso che sia a Milano.* |
    | *Sono sicuro che viene.* | *Non sono sicuro che venga.* |
    | *È vero che costa poco.* | *Non è vero che costi poco.* |

    ### Same subject? Use di + infinitive
    *Penso di avere ragione* (I think I'm right), not *penso che io abbia ragione*.

    ### Spoken Italian
    In casual speech many people use the indicative after *penso che*; it is common, but the congiuntivo is expected in writing and careful speech.
  examples:
    - { es: "Credo che il museo chiuda alle sei.", en: "I think the museum closes at six." }
    - { es: "Mi sembra che Torino sia una città elegante.", en: "Turin seems an elegant city to me." }
    - { es: "Dubito che arrivino in tempo.", en: "I doubt they'll arrive in time." }
    - { es: "Penso di partire domani.", en: "I'm thinking of leaving tomorrow." }
  pitfalls:
    - "*So che* and *sono sicuro che* take the indicative: they express certainty."
    - "Same subject → *di* + infinitive: *credo di sapere*, not *credo che io sappia*."
    - "Spanish speakers: Spanish *creo que es* uses the indicative; Italian *credo che sia* uses the congiuntivo."
  related: [g.congiuntivo-presente-forms, g.opinions, g.congiuntivo-vs-infinitive]
  drills:
    - { es: "Penso che tu abbia ragione.", en: "I think you're right." }
    - { es: "Non sono sicura che sia una buona idea.", en: "I'm not sure it's a good idea." }
    - { es: "Mi pare che piova.", en: "I think it's raining." }
    - { es: "Credo di aver capito.", en: "I think I've understood." }
- id: g.congiuntivo-wishes-emotion
  level: b1
  title: "Voglio che, spero che, sono contento che — wishes and feelings"
  summary: "Wishing, wanting, hoping, fearing and feeling about someone else's actions takes the congiuntivo."
  explanation: |
    ### Will and wish
    *volere che, preferire che, desiderare che, sperare che, chiedere che, aspettare che, lasciare che*
    - *Voglio che tu venga a Venezia.* — I want you to come to Venice.

    ### Emotion
    *essere contento / felice che, mi dispiace che, ho paura che, temere che, mi piace che, mi stupisce che, sono sorpreso che*
    - *Mi dispiace che tu non stia bene.* — I'm sorry you're not well.
    - *Ho paura che piova.* — I'm afraid it'll rain.

    ### Useful formula
    *Speriamo che…* (let's hope that), *Che bello che sei venuto!* (colloquial: indicative after *che bello che*).

    The congiuntivo presente refers to the present **or** the future: *Spero che venga* = I hope he comes / will come.
  examples:
    - { es: "Preferisco che ci vediamo in centro.", en: "I'd prefer us to meet in the centre." }
    - { es: "Sono felice che tu sia qui.", en: "I'm happy you're here." }
    - { es: "Ho paura che il treno sia in ritardo.", en: "I'm afraid the train is late." }
    - { es: "Speriamo che domani non nevichi.", en: "Let's hope it doesn't snow tomorrow." }
  pitfalls:
    - "*Voglio che tu venga*, not *voglio te venire* (English 'I want you to come')."
    - "*Sperare che* + congiuntivo: *spero che stia bene*, not *spero che sta bene*."
    - "Spanish speakers: same as Spanish (*quiero que vengas*), but use *spero che* + congiuntivo even when Spanish *espero que* would."
  related: [g.congiuntivo-vs-infinitive, g.congiuntivo-impersonal]
  drills:
    - { es: "Voglio che mi dica la verità.", en: "I want him to tell me the truth." }
    - { es: "Mi dispiace che non possiate venire.", en: "I'm sorry you can't come." }
    - { es: "Spero che vi piaccia Venezia.", en: "I hope you like Venice." }
    - { es: "Mia madre preferisce che io torni presto.", en: "My mother prefers me to come back early." }
- id: g.congiuntivo-impersonal
  level: b1
  title: "È importante che, bisogna che — impersonal expressions"
  summary: "Impersonal expressions of necessity, possibility and judgement take the congiuntivo."
  explanation: |
    | expression | example |
    |---|---|
    | *è importante che* | *È importante che tu dorma.* |
    | *è necessario che / bisogna che* | *Bisogna che partiamo presto.* |
    | *è meglio che* | *È meglio che non lo sappia.* |
    | *è possibile / può darsi che* | *Può darsi che piova.* |
    | *è probabile che* | *È probabile che arrivi tardi.* |
    | *è strano / normale / giusto che* | *È strano che non risponda.* |
    | *è un peccato che* | *È un peccato che tu parta.* |
    | *sembra / pare che* | *Sembra che sia chiuso.* |

    ### But certainty takes the indicative
    *È vero che, è chiaro che, è certo che, è evidente che, si vede che* + indicative: *È chiaro che ha ragione.*

    ### No subject? Use the infinitive
    *È importante dormire.* (in general) vs *È importante che tu dorma.* (you specifically)
  examples:
    - { es: "Bisogna che tu prenoti il vaporetto.", en: "You need to book the water bus." }
    - { es: "È un peccato che piova proprio oggi.", en: "It's a shame it's raining today of all days." }
    - { es: "Può darsi che il negozio sia chiuso.", en: "Maybe the shop is closed." }
    - { es: "È chiaro che non vuole venire.", en: "It's clear he doesn't want to come." }
  pitfalls:
    - "*È vero che* takes the indicative; *non è vero che* takes the congiuntivo."
    - "*Bisogna che* + congiuntivo, but *bisogna* + infinitive with no subject: *bisogna partire*."
    - "*Può darsi che* (maybe) is followed by the congiuntivo: *può darsi che venga*."
  related: [g.congiuntivo-wishes-emotion, g.bisogna-avere-bisogno, g.congiuntivo-vs-infinitive]
  drills:
    - { es: "È meglio che tu stia a casa.", en: "You'd better stay at home." }
    - { es: "È normale che tu sia stanco.", en: "It's normal that you're tired." }
    - { es: "Sembra che il ponte sia chiuso.", en: "It seems the bridge is closed." }
    - { es: "È importante che tutti lo sappiano.", en: "It's important that everyone knows." }
- id: g.congiuntivo-vs-infinitive
  level: b1
  title: "Spero di venire / spero che tu venga — congiuntivo or infinitive?"
  summary: "Same subject → di + infinitive; different subject → che + congiuntivo."
  explanation: |
    | same subject | different subject |
    |---|---|
    | *Spero **di** vincere.* (I hope I win) | *Spero **che** tu vinca.* |
    | *Penso **di** partire.* | *Penso **che** lei parta.* |
    | *Sono contento **di** essere qui.* | *Sono contento **che** tu sia qui.* |
    | *Ho paura **di** sbagliare.* | *Ho paura **che** lui sbagli.* |
    | *Voglio partire.* (no *di*) | *Voglio **che** partiate.* |

    - *Volere, preferire, desiderare* take the infinitive **without** *di*.
    - For a past action with the same subject: past infinitive: *Penso di aver sbagliato.*
    - English 'I want him to…' is always *voglio che lui…*: Italian never says *voglio lui fare*.
  examples:
    - { es: "Spero di rivederti presto.", en: "I hope to see you again soon." }
    - { es: "Spero che tu ritorni presto.", en: "I hope you come back soon." }
    - { es: "Siamo felici di essere a Bologna.", en: "We're happy to be in Bologna." }
    - { es: "Preferisco guidare io.", en: "I'd rather drive myself." }
  pitfalls:
    - "Not *spero che io vinca*: same subject → *spero di vincere*."
    - "Not *voglio di andare*: *voglio andare*."
    - "Spanish speakers: *espero verte* → *spero di vederti* (Italian needs *di*)."
  related: [g.congiuntivo-wishes-emotion, g.congiuntivo-opinion, g.past-infinitive]
  drills:
    - { es: "Credo di avere la febbre.", en: "I think I have a temperature." }
    - { es: "Credo che lei abbia la febbre.", en: "I think she has a temperature." }
    - { es: "Ho paura di perdere il treno.", en: "I'm afraid of missing the train." }
    - { es: "Voglio che tu sia felice.", en: "I want you to be happy." }
- id: g.congiuntivo-conjunctions
  level: b1
  title: "Conjunctions with the congiuntivo: perché, affinché, purché, benché, a meno che"
  summary: "Purpose, condition, concession and time-before always take the congiuntivo."
  explanation: |
    | meaning | conjunctions | example |
    |---|---|---|
    | purpose | *perché, affinché* (so that) | *Te lo dico perché tu lo sappia.* |
    | condition | *purché, a patto che, a condizione che* (provided that) | *Vengo purché paghi tu.* |
    | exception | *a meno che (non)* (unless) | *Usciamo, a meno che non piova.* |
    | concession | *benché, sebbene, nonostante* (although) | *Benché sia tardi, resto.* |
    | negation | *senza che* (without) | *Esce senza che nessuno lo veda.* |
    | time before | *prima che* | *Prima che arrivi Marco.* |

    ### perché: two meanings
    - + indicative = because: *Esco perché ho fame.*
    - + congiuntivo = so that: *Parlo piano perché tu capisca.*

    *Anche se* (even if / although) takes the **indicative**: *Anche se piove, esco.*
  examples:
    - { es: "Ti presto la bici purché me la riporti stasera.", en: "I'll lend you the bike provided you bring it back tonight." }
    - { es: "Benché sia inverno, fa abbastanza caldo.", en: "Although it's winter, it's quite warm." }
    - { es: "Ti scrivo l'indirizzo perché tu non ti perda.", en: "I'll write down the address so you don't get lost." }
    - { es: "Andiamo in montagna, a meno che non nevichi troppo.", en: "We'll go to the mountains, unless it snows too much." }
  pitfalls:
    - "*Anche se* takes the indicative; *benché, sebbene* the congiuntivo."
    - "*A meno che* is usually followed by a 'non' that has no negative meaning: *a meno che non piova* = unless it rains."
    - "Spanish speakers: *para que* → *perché / affinché*; *aunque* → *anche se* (indicative) or *benché* (congiuntivo)."
  related: [g.prima-che-prima-di, g.concessive-clauses, g.congiuntivo-passato]
  drills:
    - { es: "Lo faccio affinché tu sia contento.", en: "I'm doing it so that you'll be happy." }
    - { es: "Sebbene sia stanca, vengo alla festa.", en: "Although I'm tired, I'll come to the party." }
    - { es: "Puoi restare a patto che tu stia zitto.", en: "You can stay as long as you keep quiet." }
    - { es: "Esco senza che nessuno mi veda.", en: "I go out without anyone seeing me." }
- id: g.congiuntivo-passato
  level: b1
  title: "The congiuntivo passato: abbia fatto, sia arrivato"
  summary: "congiuntivo of avere / essere + participle: a past action after a present trigger."
  explanation: |
    | | avere | essere |
    |---|---|---|
    | che io / tu / lui | **abbia** visto | **sia** partito/a |
    | che noi | abbiamo visto | siamo partiti/e |
    | che voi | abbiate visto | siate partiti/e |
    | che loro | **abbiano** visto | **siano** partiti/e |

    ### Use
    When the trigger is in the present and the action is **past** (or completed):
    - *Penso che sia già partito.* — I think he has already left / he left.
    - *Mi dispiace che tu non abbia potuto venire.* — I'm sorry you couldn't come.
    - *Spero che abbiate dormito bene.* — I hope you slept well.
    - *Benché abbia studiato, non ha passato l'esame.*

    | | |
    |---|---|
    | *Penso che venga.* | I think he's coming. (present / future) |
    | *Penso che sia venuto.* | I think he came / has come. (past) |
  examples:
    - { es: "Credo che abbiano già chiuso.", en: "I think they've already closed." }
    - { es: "Sono contenta che vi siate divertiti a Verona.", en: "I'm glad you had fun in Verona." }
    - { es: "È strano che non abbia chiamato.", en: "It's strange he hasn't called." }
    - { es: "Non penso che sia stata lei.", en: "I don't think it was her." }
  pitfalls:
    - "Agreement with *essere*: *penso che sia uscita* (she)."
    - "Don't use the passato prossimo after a trigger: *penso che abbia capito*, not *penso che ha capito* (in writing)."
    - "Spanish speakers: *haya hecho* → *abbia fatto*, *haya ido* → *sia andato*."
  related: [g.congiuntivo-presente-forms, g.congiuntivo-trapassato, g.concordanza-congiuntivo]
  drills:
    - { es: "Spero che tu abbia trovato tutto.", en: "I hope you found everything." }
    - { es: "Mi sembra che sia già arrivato.", en: "I think he's already arrived." }
    - { es: "Dubito che abbiano capito.", en: "I doubt they understood." }
- id: g.prima-che-prima-di
  level: b1
  title: "Prima che, prima di; dopo che, dopo"
  summary: "prima di + infinitive (same subject), prima che + congiuntivo (different); dopo che + indicative."
  explanation: |
    | | same subject | different subject |
    |---|---|---|
    | before | *prima di* + infinitive | *prima che* + **congiuntivo** |
    | after | *dopo* + past infinitive | *dopo che* + **indicative** |
    | until | *finché* / *fino a quando* + indicative | *finché (non)* + indicative or congiuntivo |

    - *Prima di uscire, chiudo la porta.* (I go out, I close)
    - *Chiudi la porta prima che entri il gatto.* (you close, the cat enters)
    - *Dopo aver cenato, usciamo.* / *Dopo che i bambini hanno cenato, usciamo.*

    *Dopo che* takes the indicative because the event is real: *dopo che è arrivato*.
  examples:
    - { es: "Torna a casa prima che faccia buio.", en: "Come home before it gets dark." }
    - { es: "Prima di andare a Torino, studia un po' la mappa.", en: "Before going to Turin, study the map a bit." }
    - { es: "Dopo che siete partiti, è arrivato Luca.", en: "After you left, Luca arrived." }
    - { es: "Aspetto finché non arrivi.", en: "I'll wait until you arrive." }
  pitfalls:
    - "*Prima che* + congiuntivo even for future facts: *prima che arrivi*, not *prima che arriva*."
    - "*Dopo che* + indicative: *dopo che è partito*, not *dopo che sia partito*."
    - "Spanish speakers: *antes de que llegues* → *prima che tu arrivi*; same logic."
  related: [g.past-infinitive, g.congiuntivo-conjunctions]
  drills:
    - { es: "Ti chiamo prima di partire.", en: "I'll call you before I leave." }
    - { es: "Ti chiamo prima che tu parta.", en: "I'll call you before you leave." }
    - { es: "Dopo che hanno mangiato, sono andati al lago.", en: "After they had eaten, they went to the lake." }
- id: g.relative-che
  level: b1
  title: "The relative pronoun che"
  summary: "che = who, which, that — for subjects and direct objects, people and things; never omitted."
  explanation: |
    *Che* is the most common relative pronoun. It is **invariable** and refers to people or things, as **subject** or **direct object**:
    - *La ragazza **che** parla è mia cugina.* (subject)
    - *Il libro **che** sto leggendo è di Calvino.* (object)
    - *Gli amici **che** abbiamo incontrato a Verona.*

    ### Never drop it
    English can omit 'that': 'the book I'm reading'. Italian **cannot**: *il libro che leggo*.

    ### No preposition
    After a preposition use *cui* (next note): *la persona con cui parlo*, not *con che*.

    ### Agreement in compound tenses
    *Che* as object does not trigger agreement: *La torta che ho fatto* (participle in -o, though *fatta* is also seen in older texts).
  examples:
    - { es: "Il ristorante che mi hai consigliato è ottimo.", en: "The restaurant you recommended is excellent." }
    - { es: "Conosci il ragazzo che abita al piano di sopra?", en: "Do you know the guy who lives upstairs?" }
    - { es: "Le foto che hai fatto a Venezia sono bellissime.", en: "The photos you took in Venice are beautiful." }
    - { es: "È una città che cambia continuamente.", en: "It's a city that's constantly changing." }
  pitfalls:
    - "Never omit *che*: *la casa che ho comprato*, not *la casa ho comprato*."
    - "No *che* after a preposition: *la città in cui vivo*, not *in che vivo*."
    - "Spanish speakers: *que* → *che*; *quien* has no direct equivalent after a noun (use *che* or *cui*)."
  related: [g.relative-cui, g.relative-chi-quello-che]
  drills:
    - { es: "La signora che lavora in farmacia è molto gentile.", en: "The lady who works at the pharmacy is very kind." }
    - { es: "Il film che abbiamo visto era noioso.", en: "The film we saw was boring." }
    - { es: "Ho perso il libro che mi avevi regalato.", en: "I lost the book you'd given me." }
- id: g.relative-cui
  level: b1
  title: "Il ragazzo con cui esco — cui after prepositions"
  summary: "cui follows a preposition (di cui, a cui, con cui, in cui, per cui); a can be dropped: le persone (a) cui scrivo."
  explanation: |
    After a **preposition**, use **cui** (invariable):

    | | example |
    |---|---|
    | *di cui* | *Il libro di cui ti ho parlato.* (the book I told you about) |
    | *a cui* | *L'amica a cui ho scritto.* (the friend I wrote to) |
    | *con cui* | *Il ragazzo con cui esco.* (the guy I go out with) |
    | *in cui* | *La città in cui vivo.* (the city I live in) |
    | *da cui* | *Il paese da cui vengo.* |
    | *per cui* | *Il motivo per cui sono qui.* (the reason why) |
    | *su cui* | *La sedia su cui sei seduto.* |

    - *A cui* can drop the *a*: *la persona cui ho scritto* (formal).
    - *In cui* for time and place: *il giorno in cui ci siamo conosciuti*; also *dove* for place: *la città dove vivo*.
    - English puts the preposition at the end ('the city I live in'); Italian puts it **before** *cui*.
  examples:
    - { es: "Questa è la casa in cui è nato mio padre.", en: "This is the house my father was born in." }
    - { es: "Non è l'argomento di cui volevo parlare.", en: "It's not the subject I wanted to talk about." }
    - { es: "Ecco l'amico a cui ho prestato la macchina.", en: "Here's the friend I lent the car to." }
    - { es: "Il motivo per cui studio italiano è semplice.", en: "The reason I study Italian is simple." }
  pitfalls:
    - "The preposition goes before *cui*: *la persona con cui parlo*, never *la persona che parlo con*."
    - "Not *di che* or *con che*: always *cui* after a preposition."
    - "Spanish speakers: *el chico con el que salgo* → *il ragazzo con cui esco* (no article needed)."
  related: [g.relative-che, g.relative-il-cui, g.relative-il-quale]
  drills:
    - { es: "È il giorno in cui ci siamo conosciuti.", en: "It's the day we met." }
    - { es: "La ragazza con cui lavoro è di Genova.", en: "The girl I work with is from Genoa." }
    - { es: "Il problema di cui parli è risolto.", en: "The problem you're talking about is solved." }
    - { es: "Ecco il quartiere da cui vengo.", en: "Here's the neighbourhood I come from." }
- id: g.relative-il-cui
  level: b1
  title: "Il cui, la cui — whose"
  summary: "article + cui + noun = whose: lo scrittore il cui libro…; the article agrees with the thing owned."
  explanation: |
    For 'whose', Italian uses **definite article + cui + noun**. The article agrees with the **thing possessed**, not the owner:

    | | example |
    |---|---|
    | *il cui* | *L'autore il cui romanzo ho letto.* |
    | *la cui* | *Il palazzo la cui facciata è stata restaurata.* |
    | *i cui* | *La signora i cui figli abitano a Milano.* |
    | *le cui* | *La città le cui strade sono strette.* |

    With a preposition: *lo scrittore **del cui** libro parlavamo* (of whose book).

    In speech, people often rephrase: *l'autore che ha scritto il romanzo che ho letto*.
  examples:
    - { es: "Ho conosciuto una ragazza il cui padre è di Trieste.", en: "I met a girl whose father is from Trieste." }
    - { es: "È un architetto le cui opere si trovano in tutto il mondo.", en: "He's an architect whose works are all over the world." }
    - { es: "Il paese, i cui abitanti sono pochissimi, è sul lago.", en: "The village, whose inhabitants are very few, is on the lake." }
  pitfalls:
    - "The article agrees with the noun after *cui*: *il ragazzo la cui madre*, not *il cui madre*."
    - "'Whose?' as a question is *di chi?*: *Di chi è questa borsa?*, not *il cui*."
    - "Spanish speakers: *cuyo, cuya* → *il cui, la cui* (Italian adds the article)."
  related: [g.relative-cui, g.relative-il-quale]
  drills:
    - { es: "È un pittore i cui quadri amo molto.", en: "He's a painter whose paintings I love." }
    - { es: "La famiglia la cui casa abbiamo affittato è molto gentile.", en: "The family whose house we rented is very kind." }
    - { es: "Il professore del cui corso ti ho parlato insegna a Padova.", en: "The professor whose course I told you about teaches in Padua." }
- id: g.relative-chi-quello-che
  level: b1
  title: "Chi, quello che, ciò che — whoever, what"
  summary: "chi = the person who (singular verb); quello che / ciò che = what, the thing that."
  explanation: |
    ### chi = he who, anyone who, those who
    *Chi* contains its own antecedent and takes a **singular** verb:
    - *Chi dorme non piglia pesci.* — The early bird catches the worm (lit. he who sleeps doesn't catch fish).
    - *C'è chi dice che…* — There are people who say that…
    - *Chi vuole venire, alzi la mano.*

    ### quello che / ciò che / quel che = what, the thing(s) that
    - *Non capisco quello che dici.* — I don't understand what you're saying.
    - *Ciò che conta è la salute.* (more formal)
    - *Tutto quello che / tutto ciò che* = everything that.

    ### quelli che = those who (plural)
    *Quelli che arrivano tardi non entrano.*
  examples:
    - { es: "Chi trova un amico trova un tesoro.", en: "Whoever finds a friend finds a treasure." }
    - { es: "Fa' quello che vuoi.", en: "Do what you want." }
    - { es: "Tutto ciò che ho imparato lo devo a te.", en: "Everything I've learnt I owe to you." }
    - { es: "C'è chi preferisce il mare e chi la montagna.", en: "Some people prefer the sea and some the mountains." }
  pitfalls:
    - "'What' in the middle of a sentence is *quello che*, not *che cosa*: *non so quello che vuoi* (or *non so che cosa vuoi* as an indirect question)."
    - "*Chi* takes a singular verb: *chi viene*, even meaning 'those who'."
    - "Spanish speakers: *lo que* → *quello che / ciò che*; *quien* (he who) → *chi*."
  related: [g.relative-che, g.relative-advanced]
  drills:
    - { es: "Non è quello che pensi.", en: "It's not what you think." }
    - { es: "Chi ha finito può uscire.", en: "Whoever has finished can go." }
    - { es: "Dimmi tutto quello che sai.", en: "Tell me everything you know." }
    - { es: "Ciò che mi piace di Milano è il design.", en: "What I like about Milan is the design." }
- id: g.si-impersonale
  level: b1
  title: "Si mangia bene — the impersonal si"
  summary: "si + third-person singular verb = one / people / you in general."
  explanation: |
    *Si* + 3rd person singular makes a statement about **people in general** (English 'you, one, people, they'):
    - *In Italia si mangia bene.* — You eat well in Italy.
    - *Qui si parla italiano.* — Italian is spoken here.
    - *Come si dice 'fork' in italiano?* — How do you say 'fork' in Italian?
    - *Non si sa mai.* — You never know.

    ### With essere + adjective: plural adjective
    *Quando si è giovani, si è ottimisti.* — When you're young, you're optimistic. (The adjective is **plural**.)

    ### Compound tenses: essere
    *Si è mangiato bene.* (participle in -o for verbs that normally take *avere*)
    *Si è arrivati tardi.* (participle plural for verbs that normally take *essere*)

    ### Si with reflexive verbs → ci si
    See the next notes: *Ci si alza presto.*
  examples:
    - { es: "A Bologna si mangia benissimo.", en: "You eat really well in Bologna." }
    - { es: "Da qui si vede il Monte Rosa.", en: "You can see Monte Rosa from here." }
    - { es: "Come si arriva al Castello Sforzesco?", en: "How do you get to the Sforza Castle?" }
    - { es: "Quando si è stanchi, si sbaglia di più.", en: "When you're tired, you make more mistakes." }
  pitfalls:
    - "With *essere* the adjective is plural: *si è contenti*, not *si è contento*."
    - "Don't translate 'you' literally in general statements: *Qui si paga prima*, not *Qui tu paghi prima*."
    - "Spanish speakers: *se come bien* → *si mangia bene*; very close to Spanish *se*."
  related: [g.si-passivante, g.ci-si]
  drills:
    - { es: "Si parte alle otto.", en: "We're leaving at eight. / Departure is at eight." }
    - { es: "Non si fuma qui.", en: "No smoking here." }
    - { es: "In montagna si dorme bene.", en: "You sleep well in the mountains." }
    - { es: "Si è parlato molto della nuova legge.", en: "There was a lot of talk about the new law." }
- id: g.si-passivante
  level: b1
  title: "Si vendono biglietti — the si passivante"
  summary: "si + verb agreeing with the thing: si vende la casa, si vendono case."
  explanation: |
    With a **transitive verb and a direct object**, *si* makes a passive meaning, and the verb **agrees with the object**:
    - *Si vende casa.* / *Si vendono appartamenti.*
    - *In questo negozio si accettano carte.*
    - *Si cercano camerieri.* — Waiters wanted.

    | singular | plural |
    |---|---|
    | *Si affitta camera.* | *Si affittano camere.* |
    | *Si parla inglese.* | *Si parlano molte lingue.* |

    ### In recipes and instructions
    *Si tagliano le verdure, si aggiunge il sale, si cuoce per venti minuti.*

    ### Compound tenses
    *essere* + agreeing participle: *Si sono vendute tutte le copie.* (All the copies were sold.)
  examples:
    - { es: "Si affittano appartamenti sul lago.", en: "Flats for rent on the lake." }
    - { es: "Prima si fa soffriggere la cipolla, poi si aggiunge il riso.", en: "First you fry the onion, then you add the rice." }
    - { es: "A Torino si producono ottime auto.", en: "Excellent cars are produced in Turin." }
    - { es: "Si sono spesi troppi soldi.", en: "Too much money was spent." }
  pitfalls:
    - "Plural object → plural verb: *si vendono biglietti*, not *si vende biglietti* (common in speech, but wrong in writing)."
    - "Compound tenses use *essere* + agreement: *si sono vendute*, not *si hanno venduto*."
    - "Spanish speakers: *se venden pisos* → *si vendono appartamenti*: same agreement rule."
  related: [g.si-impersonale, g.passive-essere]
  drills:
    - { es: "Si cercano commessi per l'estate.", en: "Shop assistants wanted for the summer." }
    - { es: "Qui si parla tedesco e italiano.", en: "German and Italian are spoken here." }
    - { es: "Si lavano le zucchine e si tagliano a rondelle.", en: "Wash the courgettes and slice them into rounds." }
    - { es: "Si sono raccolti molti soldi per la festa.", en: "A lot of money was collected for the festival." }
- id: g.ci-si
  level: b1
  title: "Ci si alza presto — impersonal si with reflexive verbs"
  summary: "A reflexive verb can't say si si: the first si becomes ci → ci si diverte, ci si annoia."
  explanation: |
    The impersonal *si* plus a reflexive *si* would give *si si*, so the reflexive one becomes **ci**:
    - *alzarsi → Ci si alza presto in campagna.* — People get up early in the country.
    - *divertirsi → A Milano ci si diverte.*
    - *abituarsi → Ci si abitua a tutto.* — You get used to everything.

    ### Other combinations
    - with *ne*: *se ne parla* (people talk about it)
    - with *lo / la*: *lo si fa* (it is done), more formal
    - with *ci* (there): *ci si va in treno* (you go there by train)

    Compound tenses: *Ci si è divertiti.* (plural participle)
  examples:
    - { es: "In questa città ci si sente sicuri.", en: "You feel safe in this city." }
    - { es: "Con questo freddo ci si veste a strati.", en: "In this cold you dress in layers." }
    - { es: "Ci si vede domani!", en: "See you tomorrow! (colloquial)" }
    - { es: "A Venezia ci si perde facilmente.", en: "It's easy to get lost in Venice." }
  pitfalls:
    - "Never *si si alza*: say *ci si alza*."
    - "*Ci si vede!* is a casual Tuscan-style goodbye, now common everywhere."
    - "The adjective is plural: *ci si sente stanchi*."
  related: [g.si-impersonale, g.reflexive-present]
  drills:
    - { es: "D'estate ci si alza presto.", en: "In summer people get up early." }
    - { es: "Ci si abitua presto alla nebbia.", en: "You soon get used to the fog." }
    - { es: "Alla festa ci si è divertiti molto.", en: "Everyone had a great time at the party." }
- id: g.discorso-indiretto-present
  level: b1
  title: "Reported speech with a present verb: dice che…"
  summary: "When the reporting verb is present (dice, scrive), tenses don't change; pronouns and possessives do."
  explanation: |
    When you report with a **present** verb (*dice, scrive, racconta, chiede*), the tense stays the same:
    - *'Sono stanca.'* → *Dice che è stanca.*
    - *'Ho perso il treno.'* → *Scrive che ha perso il treno.*
    - *'Verrò domani.'* → *Dice che verrà domani.*

    ### What changes
    | direct | reported |
    |---|---|
    | *io, mi, mio* | *lui / lei, gli / le, suo* |
    | *tu, ti, tuo* | *io, mi, mio* (if said to me) |
    | *questo* | *quello* (sometimes) |
    | *qui* | *lì* (if the place changes) |

    - *'Mi piace la tua casa.'* → *Dice che le piace la mia casa.*
    - Imperatives become *di* + infinitive: *Dice di aspettare.*
  examples:
    - { es: "Marco dice che arriva alle otto.", en: "Marco says he's arriving at eight." }
    - { es: "Mia madre scrive che a Genova piove.", en: "My mother writes that it's raining in Genoa." }
    - { es: "Giulia dice che le è piaciuto il film.", en: "Giulia says she liked the film." }
    - { es: "Dice di non preoccuparti.", en: "She says not to worry." }
  pitfalls:
    - "Change the person: *'Sono stanco' → dice che è stanco*, not *dice che sono stanco*."
    - "Don't omit *che*: *dice che viene*, not *dice viene*."
    - "Spanish speakers: same as Spanish (*dice que viene*)."
  related: [g.discorso-indiretto-past, g.reported-commands-di]
  drills:
    - { es: "Luca dice che non può venire.", en: "Luca says he can't come." }
    - { es: "Scrivono che si sono divertiti a Trento.", en: "They write that they had fun in Trento." }
    - { es: "Il medico dice che devo riposare.", en: "The doctor says I have to rest." }
- id: g.discorso-indiretto-past
  level: b1
  title: "Reported speech in the past: ha detto che era…"
  summary: "After a past reporting verb, tenses shift back: presente → imperfetto, passato prossimo → trapassato, futuro → condizionale passato."
  explanation: |
    | direct speech | reported (after *ha detto / disse*) |
    |---|---|
    | presente: *'Sono stanca.'* | imperfetto: *Ha detto che era stanca.* |
    | passato prossimo: *'Ho finito.'* | trapassato: *Ha detto che aveva finito.* |
    | imperfetto: *'Ero a casa.'* | imperfetto (no change) |
    | futuro: *'Verrò.'* | condizionale passato: *Ha detto che sarebbe venuto.* |
    | condizionale: *'Verrei.'* | condizionale passato: *Ha detto che sarebbe venuto.* |
    | imperativo: *'Aspetta!'* | *di* + infinitive: *Mi ha detto di aspettare.* |

    ### Time and place words often shift
    *oggi → quel giorno, domani → il giorno dopo, ieri → il giorno prima, qui → lì* (B2 deals with this in detail).

    In conversation, if the fact is still true, the present is often kept: *Mi ha detto che abita a Trieste.*
  examples:
    - { es: "Paola ha detto che aveva già visto la mostra.", en: "Paola said she had already seen the exhibition." }
    - { es: "Mi ha detto che sarebbe arrivato in ritardo.", en: "He told me he would be late." }
    - { es: "Hanno detto che erano stanchi e che volevano tornare.", en: "They said they were tired and wanted to go back." }
    - { es: "Ci ha detto di non toccare niente.", en: "He told us not to touch anything." }
  pitfalls:
    - "Future in the past → past conditional: *ha detto che sarebbe venuto*, not *che verrebbe*."
    - "Don't keep the passato prossimo: *ha detto che aveva perso*, not *che ha perso* (in careful style)."
    - "Spanish speakers: *dijo que vendría* → *ha detto che sarebbe venuto*."
  related: [g.discorso-indiretto-present, g.condizionale-passato, g.reported-speech-advanced]
  drills:
    - { es: "Ha detto che il ristorante era chiuso.", en: "She said the restaurant was closed." }
    - { es: "Mi avevi detto che mi avresti aiutato!", en: "You told me you'd help me!" }
    - { es: "Ci hanno detto che avevano perso il volo.", en: "They told us they had missed the flight." }
- id: g.reported-questions
  level: b1
  title: "Mi ha chiesto se… — reported questions"
  summary: "Yes/no questions → se; question words stay: mi ha chiesto dove abitavo."
  explanation: |
    ### Yes/no questions → se
    - *'Vieni?'* → *Mi chiede se vengo. / Mi ha chiesto se venivo.*

    ### Question-word questions keep the word
    - *'Dove abiti?'* → *Mi ha chiesto dove abitavo.*
    - *'Che ore sono?'* → *Mi ha chiesto che ore erano.*
    - *'Perché sei qui?'* → *Mi ha chiesto perché ero lì.*

    ### Same tense shifts as statements
    After a past verb: presente → imperfetto, etc.

    ### Indirect questions in general
    *Non so se…, Mi domando se…, Dimmi dove…, Vorrei sapere quando…*
    In formal style these can take the congiuntivo: *Mi chiedo se sia vero.*
  examples:
    - { es: "Il cameriere ci ha chiesto se volevamo il dolce.", en: "The waiter asked us if we wanted dessert." }
    - { es: "Mi ha chiesto da quanto tempo studiavo italiano.", en: "She asked me how long I'd been studying Italian." }
    - { es: "Non so se il museo sia aperto.", en: "I don't know if the museum is open." }
    - { es: "Mi domando perché non abbia chiamato.", en: "I wonder why he hasn't called." }
  pitfalls:
    - "Don't keep the question word order or the question mark: *mi ha chiesto dove abitavo.*"
    - "*Se* (if) in reported questions, never *che se*."
    - "Spanish speakers: *me preguntó si* → *mi ha chiesto se*: same structure."
  related: [g.discorso-indiretto-past, g.question-words]
  drills:
    - { es: "Mi ha chiesto se ero italiana.", en: "He asked me if I was Italian." }
    - { es: "Ci hanno chiesto quanto costava la camera.", en: "They asked us how much the room cost." }
    - { es: "Vorrei sapere a che ora parte l'ultimo treno.", en: "I'd like to know what time the last train leaves." }
- id: g.reported-commands-di
  level: b1
  title: "Mi ha detto di aspettare — reported commands"
  summary: "Commands and requests become di + infinitive: dire di, chiedere di, consigliare di."
  explanation: |
    | direct | reported |
    |---|---|
    | *'Aspettami!'* | *Mi ha detto di aspettarlo.* |
    | *'Non fumate!'* | *Ci ha detto di non fumare.* |
    | *'Può chiudere la porta?'* | *Mi ha chiesto di chiudere la porta.* |
    | *'Dovresti riposare.'* | *Mi ha consigliato di riposare.* |

    Reporting verbs + *di* + infinitive: *dire, chiedere, ordinare, consigliare, suggerire, pregare, ricordare, proibire*.

    The person told is an **indirect** object: *Gli ho detto di venire. Le ho chiesto di aspettare.*

    With a different subject you can also use *che* + congiuntivo (more formal): *Ha detto che aspettassi* (B2).
  examples:
    - { es: "Il medico mi ha detto di non bere alcol.", en: "The doctor told me not to drink alcohol." }
    - { es: "Le ho chiesto di chiamarmi quando arriva.", en: "I asked her to call me when she arrives." }
    - { es: "Ci hanno consigliato di visitare il lago d'Orta.", en: "They advised us to visit Lake Orta." }
    - { es: "Ricordagli di comprare il pane.", en: "Remind him to buy the bread." }
  pitfalls:
    - "Indirect object: *gli ho detto di venire*, not *l'ho detto di venire*."
    - "Negative: *di non* + infinitive: *mi ha detto di non uscire*."
    - "Spanish speakers: *me dijo que esperara* → *mi ha detto di aspettare* (infinitive, not subjunctive)."
  related: [g.discorso-indiretto-past, g.reporting-verbs]
  drills:
    - { es: "Mi ha detto di stare attento.", en: "He told me to be careful." }
    - { es: "Gli abbiamo chiesto di abbassare la musica.", en: "We asked them to turn the music down." }
    - { es: "La guida ci ha detto di non fare foto.", en: "The guide told us not to take photos." }
- id: g.connectors-cause-consequence
  level: b1
  title: "Cause and consequence: siccome, poiché, quindi, perciò, dunque"
  summary: "Cause: perché, siccome, poiché, dato che, visto che; consequence: quindi, perciò, dunque, per questo, così."
  explanation: |
    ### Cause
    | connector | position | note |
    |---|---|---|
    | *perché* | after the main clause | *Resto a casa perché piove.* |
    | *siccome* | at the start | *Siccome piove, resto a casa.* |
    | *poiché* | either; formal | *Poiché il treno è in ritardo…* |
    | *dato che, visto che* | either; spoken | *Visto che sei qui, aiutami.* |
    | *a causa di* + noun | — | *a causa della nebbia* |
    | *grazie a* + noun | positive cause | *grazie al tuo aiuto* |

    ### Consequence
    *quindi, perciò, dunque, per questo, così, di conseguenza, per cui*:
    - *Ero stanco, quindi sono andato a letto.*
    - *Ha nevicato, perciò le strade sono chiuse.*
    - *così… che* (so… that): *Era così stanca che si è addormentata.*
  examples:
    - { es: "Siccome c'era la nebbia, l'aereo non è partito.", en: "Since it was foggy, the plane didn't take off." }
    - { es: "Visto che hai la macchina, mi dai un passaggio?", en: "Since you've got the car, will you give me a lift?" }
    - { es: "Ho perso il treno, perciò sono arrivata tardi.", en: "I missed the train, so I arrived late." }
    - { es: "A causa dello sciopero, i musei sono chiusi.", en: "Because of the strike, the museums are closed." }
  pitfalls:
    - "*Siccome* goes at the start; don't put it after the main clause."
    - "*A causa di* + noun, *perché* + verb: *a causa della pioggia* / *perché piove*."
    - "Spanish speakers: *como* (since) → *siccome*; *así que* → *quindi / così*."
  related: [g.connectors-contrast, g.connectors-basic, g.argumentation-connectors]
  drills:
    - { es: "Siccome era tardi, abbiamo preso un taxi.", en: "As it was late, we took a taxi." }
    - { es: "Il negozio era chiuso, quindi siamo tornati.", en: "The shop was closed, so we went back." }
    - { es: "Grazie a te ho trovato lavoro.", en: "Thanks to you I found a job." }
    - { es: "Era così buono che ne ho mangiati tre.", en: "It was so good I ate three." }
- id: g.connectors-contrast
  level: b1
  title: "Contrast: però, invece, tuttavia, mentre, anzi"
  summary: "ma, però, tuttavia, invece, mentre, anzi, comunque — saying 'but' with nuance."
  explanation: |
    | connector | meaning | example |
    |---|---|---|
    | *ma* | but | *È caro ma bello.* |
    | *però* | but / however (can follow) | *È caro, però è bello. / È bello, è caro però.* |
    | *tuttavia* | however, nevertheless (formal) | *Tuttavia, il problema resta.* |
    | *invece* | instead, on the other hand | *Io resto, tu invece vai.* |
    | *mentre* | whereas | *Io amo il mare, mentre lui preferisce la montagna.* |
    | *anzi* | on the contrary, or rather | *Non è brutto, anzi!* |
    | *comunque* | anyway, however | *Comunque, ci vediamo domani.* |
    | *eppure* | and yet | *Eppure ti avevo avvisato!* |

    - *Invece di* + infinitive / noun = instead of: *Invece di lamentarti, aiutami.*
    - *Al contrario* = on the contrary, *d'altra parte* = on the other hand.
  examples:
    - { es: "Volevo andare a Verona, invece sono rimasto a Milano.", en: "I wanted to go to Verona, but I stayed in Milan instead." }
    - { es: "Non sono arrabbiato, anzi, sono contento.", en: "I'm not angry; on the contrary, I'm pleased." }
    - { es: "Il Nord è più ricco, mentre il Sud ha più sole.", en: "The North is richer, whereas the South has more sun." }
    - { es: "Ha studiato molto, eppure non ha passato l'esame.", en: "He studied a lot, and yet he didn't pass the exam." }
  pitfalls:
    - "*Invece* can go after the subject: *Tu invece…*; *ma* only at the start of its clause."
    - "*Mentre* means both 'while' (time) and 'whereas' (contrast)."
    - "Spanish speakers: *sin embargo* → *tuttavia / però*; *en cambio* → *invece*."
  related: [g.connectors-cause-consequence, g.concessive-clauses]
  drills:
    - { es: "Mi piace Torino, però fa troppo freddo.", en: "I like Turin, but it's too cold." }
    - { es: "Invece di guardare la TV, leggi un libro.", en: "Read a book instead of watching TV." }
    - { es: "Non è caro, anzi, è un affare!", en: "It's not expensive; actually, it's a bargain!" }
    - { es: "Comunque, grazie lo stesso.", en: "Anyway, thanks all the same." }
- id: g.lei-forms
  level: b1
  title: "Lei in full: La, Le, Suo, si accomodi"
  summary: "The formal 'you' uses third-person feminine forms for everyone: La ringrazio, Le scrivo, il Suo indirizzo."
  explanation: |
    *Lei* (formal you) borrows every third-person **feminine** form, whether you speak to a man or a woman:

    | function | form | example |
    |---|---|---|
    | subject | *Lei* | *Lei è molto gentile.* |
    | direct object | *La* | *La ringrazio. La chiamo domani.* |
    | indirect object | *Le* | *Le scrivo per… Le piace?* |
    | possessive | *Suo, Sua, Suoi, Sue* | *il Suo indirizzo, la Sua lettera* |
    | stressed | *Lei* | *per Lei, con Lei* |
    | reflexive | *si* | *Si accomodi. Come si chiama?* |
    | combined | *Glielo* | *Glielo mando subito.* |

    ### Agreement
    Adjectives and participles agree with the **real** gender: *Signor Rossi, Lei è stato molto gentile.* — *Signora, Lei è stata molto gentile.*

    Capitals (*La, Le, Suo*) are optional in modern usage but common in letters to show respect.
  examples:
    - { es: "La ringrazio per la Sua cortesia.", en: "Thank you for your kindness." }
    - { es: "Le mando il documento in allegato.", en: "I'm sending you the document as an attachment." }
    - { es: "Dottore, Lei è stato molto disponibile.", en: "Doctor, you've been very helpful. (to a man)" }
    - { es: "Posso offrirLe qualcosa?", en: "Can I offer you something?" }
  pitfalls:
    - "*La ringrazio* even to a man: the pronoun is feminine, the participle follows the person."
    - "Don't mix *tu* and *Lei* in the same message: *Le scrivo… il tuo indirizzo* is a classic error."
    - "Spanish speakers: *se lo envío* (a usted) → *Glielo mando*; *su* → *Suo* with the article: *il Suo nome*."
  related: [g.tu-vs-lei, g.formal-letters, g.imperativo-lei-pronouns]
  drills:
    - { es: "Le dispiace se apro la finestra?", en: "Do you mind if I open the window?" }
    - { es: "La aspetto domani alle dieci.", en: "I'll expect you tomorrow at ten." }
    - { es: "Mi può dare il Suo numero di telefono?", en: "Can you give me your phone number?" }
    - { es: "Glielo spedisco oggi stesso.", en: "I'll send it to you today." }
- id: g.formal-letters
  level: b1
  title: "Formal letters and emails"
  summary: "Gentile / Egregio, Le scrivo per, In attesa di un Suo riscontro, Cordiali saluti."
  explanation: |
    ### Opening
    | to | opening |
    |---|---|
    | a man / woman (standard) | *Gentile signor Rossi / Gentile signora Bianchi,* |
    | a title | *Gentile dottoressa Conti, Gentile professore,* |
    | very formal (man) | *Egregio Direttore, Egregio avvocato,* |
    | unknown | *Gentili Signori, / Spettabile Ditta* (to a company) |

    ### Body phrases
    - *Le scrivo per chiedere informazioni su…* (I'm writing to ask about…)
    - *In riferimento a… / Con riferimento alla Sua mail del 3 maggio…*
    - *Le sarei grato/a se potesse…* (I would be grateful if you could…)
    - *In allegato Le invio…* (Please find attached…)
    - *Resto a disposizione per qualsiasi chiarimento.*

    ### Closing
    *In attesa di un Suo cortese riscontro* (Looking forward to your reply), *Cordiali saluti, Distinti saluti* (more formal), *La ringrazio anticipatamente.*

    Informal: *Caro Marco, / Cara Giulia,* … *Un abbraccio, A presto, Baci.*
  examples:
    - { es: "Gentile signora Ferri, Le scrivo in merito alla Sua offerta di lavoro.", en: "Dear Mrs Ferri, I'm writing regarding your job offer." }
    - { es: "Le sarei grato se potesse inviarmi il programma del corso.", en: "I would be grateful if you could send me the course programme." }
    - { es: "In attesa di un Suo cortese riscontro, porgo distinti saluti.", en: "Looking forward to your reply, yours faithfully." }
    - { es: "In allegato Le invio il mio curriculum.", en: "Please find attached my CV." }
  pitfalls:
    - "Don't start a formal letter with *Caro*: use *Gentile* or *Egregio*."
    - "Keep *Lei* throughout; *Le scrivo… ti ringrazio* is inconsistent."
    - "*Egregio* is only for men; *Gentile* works for everyone."
  related: [g.lei-forms, g.connectors-cause-consequence]
  drills:
    - { es: "Gentile Direttrice, Le scrivo per presentare la mia candidatura.", en: "Dear Director, I'm writing to apply for the position." }
    - { es: "Resto a disposizione per ulteriori informazioni.", en: "I remain available for further information." }
    - { es: "La ringrazio anticipatamente. Cordiali saluti.", en: "Thank you in advance. Kind regards." }
- id: g.gerundio-uses
  level: b1
  title: "Uses of the gerund: leggendo si impara"
  summary: "The gerund expresses manner, means, time, cause and condition when the subject is the same."
  explanation: |
    Besides *stare + gerundio*, the gerund on its own links two actions with the **same subject**:

    | meaning | example | = |
    |---|---|---|
    | means / manner | *Sbagliando s'impara.* | by making mistakes |
    | time (while) | *Tornando a casa, ho incontrato Marco.* | while going home |
    | cause | *Essendo stanco, sono andato a letto.* | as I was tired |
    | condition | *Volendo, possiamo partire domani.* | if we want |

    ### Pronouns attach
    *Vedendolo, ho capito. Alzandomi, sono caduto.*

    ### Watch out
    - The subject of the gerund is normally the **subject of the main verb**: *Ho visto Marco uscendo* = I saw Marco as I was leaving (not as he was leaving).
    - English '-ing' as a noun is an **infinitive** in Italian: *Nuotare fa bene* (Swimming is good for you), *Mi piace leggere*.
  examples:
    - { es: "Leggendo il giornale, ho scoperto la notizia.", en: "While reading the paper, I found out the news." }
    - { es: "Si impara una lingua parlandola.", en: "You learn a language by speaking it." }
    - { es: "Essendo domenica, i negozi erano chiusi.", en: "It being Sunday, the shops were closed." }
    - { es: "Camminando lungo il Po, abbiamo visto il tramonto.", en: "Walking along the Po, we saw the sunset." }
  pitfalls:
    - "'-ing' as a subject or object is an infinitive: *Fumare fa male*, not *Fumando fa male*."
    - "'After -ing' and 'before -ing' are *dopo aver* / *prima di* + infinitive, not the gerund."
    - "Spanish speakers: the gerund works like Spanish (*caminando*), but Italian never uses it as an adjective (*una scatola contenente* uses a present participle)."
  related: [g.stare-gerundio, g.gerundio-composto, g.pur-gerundio]
  drills:
    - { es: "Ascoltando la radio, ho imparato molte parole.", en: "By listening to the radio, I learnt lots of words." }
    - { es: "Uscendo dal cinema, abbiamo incontrato Sara.", en: "As we left the cinema, we met Sara." }
    - { es: "Volendo, potete dormire da noi.", en: "If you like, you can sleep at ours." }
    - { es: "Vedendola, ho capito tutto.", en: "When I saw her, I understood everything." }
- id: g.passato-remoto-recognition
  level: b1
  title: "Recognising the passato remoto: fu, nacque, andò"
  summary: "The literary and historical past: parlò, credette, partì, fu, ebbe, nacque, morì."
  explanation: |
    You will meet the *passato remoto* in novels, fairy tales, history, museums and the South. At B1, aim to **recognise** it.

    ### Regular endings
    | | parlare | credere | partire |
    |---|---|---|---|
    | io | parl**ai** | cred**ei / -etti** | part**ii** |
    | tu | parl**asti** | cred**esti** | part**isti** |
    | lui / lei | parl**ò** | cred**é / -ette** | part**ì** |
    | noi | parl**ammo** | cred**emmo** | part**immo** |
    | voi | parl**aste** | cred**este** | part**iste** |
    | loro | parl**arono** | cred**erono / -ettero** | part**irono** |

    ### The forms you'll see most (3rd person)
    *fu* (was), *furono* (were), *ebbe* (had), *nacque* (was born), *morì* (died), *visse* (lived), *fece* (did), *disse* (said), *vide* (saw), *venne* (came), *scrisse* (wrote), *costruì* (built), *divenne* (became).

    Museum labels: *Leonardo nacque a Vinci nel 1452 e morì in Francia nel 1519.*
  examples:
    - { es: "Il Cenacolo fu dipinto da Leonardo tra il 1494 e il 1498.", en: "The Last Supper was painted by Leonardo between 1494 and 1498." }
    - { es: "Manzoni visse a Milano per quasi tutta la vita.", en: "Manzoni lived in Milan for almost all his life." }
    - { es: "Quando lo vide, la principessa disse di sì.", en: "When she saw him, the princess said yes." }
    - { es: "Torino fu la prima capitale d'Italia.", en: "Turin was the first capital of Italy." }
  pitfalls:
    - "*Fu* = was (essere), *andò* = went (andare): don't confuse *fu* with *fece* (did)."
    - "Stress is on the ending in *parlò, partì*: the accent is written."
    - "Spanish speakers: it corresponds to the *indefinido* in form and meaning (*habló, nació*), but in northern Italian speech it is almost never used."
  variant: "In Tuscany and much of the South the passato remoto is still used in everyday speech for past events; in the North it is almost exclusively written."
  related: [g.passato-remoto-forms, g.passato-prossimo-avere]
  drills:
    - { es: "Garibaldi nacque a Nizza nel 1807.", en: "Garibaldi was born in Nice in 1807." }
    - { es: "Il ponte fu costruito nel Cinquecento.", en: "The bridge was built in the sixteenth century." }
    - { es: "Ebbero tre figli e vissero felici.", en: "They had three children and lived happily." }
    - { es: "Arrivò a Venezia e scrisse una lettera alla madre.", en: "He arrived in Venice and wrote a letter to his mother." }
- id: g.b1-review
  level: b1
  title: "B1 review: pronouns, congiuntivo and complex sentences"
  summary: "Combined pronouns, the conditional, trapassato, the congiuntivo presente and passato, relatives, si, reported speech."
  explanation: |
    ### Pronoun combinations
    *me lo, te la, glielo, ce ne, ce l'ho* — attached to imperatives: *dimmelo, fallo, non farlo*.

    ### Moods and tenses
    | | |
    |---|---|
    | condizionale | *vorrei, dovresti, sarebbe* |
    | condizionale passato | *avrei voluto; ha detto che sarebbe venuto* |
    | trapassato | *era già partito* |
    | futuro anteriore | *quando avrai finito* |
    | congiuntivo presente | *penso che sia, spero che venga* |
    | congiuntivo passato | *credo che abbia capito* |

    ### Triggers of the congiuntivo
    Opinion, doubt, wish, emotion, impersonal expressions, and conjunctions (*benché, perché* 'so that', *purché, prima che, a meno che, senza che*).

    ### Complex sentences
    Relatives (*che, cui, il cui, chi, quello che*), *si* impersonal and passive, reported speech (*ha detto che era…, mi ha chiesto se…, mi ha detto di…*), gerund.
  examples:
    - { es: "Penso che sia la città in cui vorrei vivere.", en: "I think it's the city I'd like to live in." }
    - { es: "Me l'ha detto Paolo, ma non credo che sia vero.", en: "Paolo told me, but I don't think it's true." }
    - { es: "Ci ha detto che sarebbe venuto, ma non si è visto.", en: "He told us he'd come, but he never showed up." }
    - { es: "Benché sia tardi, si decide di continuare.", en: "Although it's late, the decision is to carry on." }
  pitfalls:
    - "Same subject → infinitive (*spero di venire*); different subject → congiuntivo (*spero che tu venga*)."
    - "Future in the past is the past conditional."
    - "Plural agreement with *si* and *essere*: *si è stanchi*."
  related: [g.combined-pronouns, g.congiuntivo-presente-forms, g.discorso-indiretto-past]
  drills:
    - { es: "Glielo dico appena lo vedo.", en: "I'll tell him as soon as I see him." }
    - { es: "Non so se sia già arrivato.", en: "I don't know if he's arrived yet." }
    - { es: "È il libro di cui tutti parlano.", en: "It's the book everyone's talking about." }
    - { es: "Qui si vive bene, purché si abbia un lavoro.", en: "Life is good here, provided you have a job." }
