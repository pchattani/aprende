id: b1.u02
title: Emociones y valoraciones
lessons:
  - id: b1.u02.l1
    title: Me alegro de que…
    teach: [g.subjunctive-emotion]
    vocab: [w.sentir, w.fastidiar, w.rabia, w.pena, w.lastima, w.verguenza, w.asco, w.dar-igual, w.extranar, w.emocionar, w.emocionante, w.orgulloso, w.decepcionar, w.harto, w.envidia, w.odiar, w.agradecido]
    tip: "Feeling + que + subjunctive when the feeling is about someone else's action: Me alegro de que vengas. Same subject → infinitive: Me alegro de venir."
    sentences:
      - { es: "Siento mucho que no puedas venir a la boda.", en: "I'm really sorry you can't come to the wedding.", altEs: ["Me da mucha pena que no puedas venir a la boda.", "Lamento mucho que no puedas venir a la boda."], grammar: [g.subjunctive-emotion], vocab: [w.sentir, w.poder, w.boda], note: "sentir que = to be sorry that." }
      - { es: "Me fastidia que mis compañeros lleguen tarde a todas las reuniones.", en: "It annoys me that my colleagues are late to every meeting.", grammar: [g.subjunctive-emotion], vocab: [w.fastidiar, w.llegar, w.reunion] }
      - { es: "Me da rabia que suban el precio del transporte otra vez.", en: "It makes me angry that they're putting up the price of transport again.", altEs: ["Me da rabia que vuelvan a subir el precio del transporte."], grammar: [g.subjunctive-emotion], vocab: [w.rabia, w.subir, w.transporte] }
      - { es: "Es una pena que la biblioteca del barrio cierre los sábados.", en: "It's a shame the neighbourhood library closes on Saturdays.", altEs: ["Es una lástima que la biblioteca del barrio cierre los sábados.", "Qué pena que la biblioteca del barrio cierre los sábados."], grammar: [g.subjunctive-emotion], vocab: [w.pena, w.biblioteca, w.cerrar] }
      - { es: "Me da vergüenza que mi padre cante en público.", en: "I'm embarrassed that my father sings in public.", grammar: [g.subjunctive-emotion], vocab: [w.verguenza, w.cantar, w.publico] }
      - { es: "Me da asco que la gente tire basura al río.", en: "It disgusts me that people throw rubbish into the river.", grammar: [g.subjunctive-emotion], vocab: [w.asco, w.tirar, w.basura, w.rio] }
      - { es: "Me extraña que Luis no conteste; siempre tiene el móvil encendido.", en: "I'm surprised Luis isn't answering; he always has his phone on.", altEs: ["Me sorprende que Luis no conteste; siempre tiene el móvil encendido.", "Me extraña que Luis no responda; siempre tiene el móvil encendido."], grammar: [g.subjunctive-emotion], vocab: [w.extranar, w.contestar, w.movil], variant: "In Latin America extrañar usually means to miss someone: te extraño." }
      - { es: "Me emociona que mis antiguos estudiantes me escriban después de tantos años.", en: "It moves me that my former students write to me after so many years.", grammar: [g.subjunctive-emotion], vocab: [w.emocionar, w.estudiante, w.escribir] }
      - { es: "Estoy orgulloso de que mi hija estudie lo que le gusta.", en: "I'm proud that my daughter is studying what she likes.", altEs: ["Estoy orgullosa de que mi hija estudie lo que le gusta.", "Me siento orgulloso de que mi hija estudie lo que le gusta."], grammar: [g.subjunctive-emotion], vocab: [w.orgulloso, w.hijo, w.estudiar] }
      - { es: "Me decepciona que el ayuntamiento no cumpla lo que prometió.", en: "I'm disappointed that the council isn't doing what it promised.", grammar: [g.subjunctive-emotion, g.preterite-regular], vocab: [w.decepcionar, w.cumplir, w.prometer] }
      - { es: "Estoy harta de que siempre me toque a mí fregar los platos.", en: "I'm fed up with it always being my turn to wash the dishes.", grammar: [g.subjunctive-emotion], vocab: [w.harto, w.tocar, w.fregar], note: "tocarle a alguien = to be someone's turn." }
      - { es: "Odio que la gente hable alto en el tren.", en: "I hate it when people talk loudly on the train.", altEs: ["Odio que la gente hable en voz alta en el tren.", "Me molesta que la gente hable alto en el tren."], grammar: [g.subjunctive-emotion], vocab: [w.odiar, w.hablar, w.tren] }
      - { es: "Estoy muy agradecido de que me ayudéis a pintar el piso.", en: "I'm very grateful that you're helping me paint the flat.", grammar: [g.subjunctive-emotion], vocab: [w.agradecido, w.ayudar, w.pintar] }
      - { es: "Es emocionante que todo el barrio participe en la fiesta.", en: "It's exciting that the whole neighbourhood is taking part in the festival.", grammar: [g.subjunctive-emotion], vocab: [w.emocionante, w.barrio, w.participar] }
      - { es: "Me alegro de que estés mejor.", en: "I'm glad you're better.", altEs: ["Me alegra que estés mejor.", "Me alegro mucho de que estés mejor."], grammar: [g.subjunctive-emotion], vocab: [w.alegrarse, w.estar, w.mejor], error: { wrong: "Me alegro de que estás mejor.", explain: "After alegrarse de que, the verb goes in the subjunctive: estés.", grammar: g.subjunctive-emotion } }
      - { es: "Me molesta el ruido. (los vecinos / hacer ruido)", en: "It bothers me that the neighbours make noise.", grammar: [g.subjunctive-emotion], vocab: [w.molestar, w.vecino, w.ruido], transform: { instruction: "Say it with que + subjunctive", answer: "Me molesta que los vecinos hagan ruido.", alt: ["Me molesta que mis vecinos hagan ruido."] } }
    exchanges:
      - q: { es: "No puedo ir a tu cumpleaños el sábado.", en: "I can't come to your birthday on Saturday." }
        a: { es: "¡Qué pena que no puedas venir! Te vamos a echar de menos.", en: "What a shame you can't come! We're going to miss you." }
        alt: ["Siento mucho que no puedas venir.", "Qué lástima; otra vez será."]
        grammar: [g.subjunctive-emotion]
        vocab: [w.pena, w.lastima]
      - q: { es: "¿Qué te fastidia de tus compañeros?", en: "What annoys you about your colleagues?" }
        a: { es: "Me fastidia que lleguen tarde y que nunca pidan perdón.", en: "It annoys me that they arrive late and never apologise." }
        alt: ["Me da rabia que hablen tan alto.", "Odio que no limpien la cocina de la oficina."]
        grammar: [g.subjunctive-emotion]
        vocab: [w.fastidiar, w.rabia, w.odiar]
      - q: { es: "Mi hija ha aprobado todos los exámenes.", en: "My daughter has passed all her exams." }
        a: { es: "¡Enhorabuena! Estarás muy orgullosa de que estudie tanto.", en: "Congratulations! You must be very proud that she studies so much." }
        alt: ["Me alegro mucho. ¡Enhorabuena a las dos!", "¡Qué bien! Seguro que estás muy orgullosa."]
        grammar: [g.subjunctive-emotion, g.future-probability]
        vocab: [w.orgulloso, w.enhorabuena]
      - q: { es: "¿Te importa que abra la ventana?", en: "Do you mind if I open the window?" }
        a: { es: "No, me da igual; abre si quieres.", en: "No, I don't mind; open it if you want." }
        alt: ["Para nada, abre.", "Prefiero que no; tengo frío."]
        grammar: [g.subjunctive-emotion]
        vocab: [w.dar-igual]
      - q: { es: "Luis no me ha contestado todavía.", en: "Luis hasn't answered me yet." }
        a: { es: "Me extraña que no conteste; siempre tiene el móvil encendido.", en: "I'm surprised he isn't answering; he always has his phone on." }
        alt: ["Qué raro que no te conteste.", "No te preocupes, seguro que está ocupado."]
        grammar: [g.subjunctive-emotion]
        vocab: [w.extranar]
      - q: { es: "¿Estás harto de tu trabajo?", en: "Are you fed up with your job?" }
        a: { es: "Sí, estoy harto de que siempre me toque a mí quedarme hasta tarde.", en: "Yes, I'm fed up with it always being my turn to stay late." }
        alt: ["Un poco; me fastidia que nadie me escuche.", "No, me gusta mucho mi trabajo."]
        grammar: [g.subjunctive-emotion]
        vocab: [w.harto, w.fastidiar]
    texts:
      - title: "Mensaje a una amiga"
        es: ["Marta, siento mucho que no puedas venir a la cena.", "Me da pena que no veas a los demás, pero lo entiendo.", "Me alegro de que estés mejor; ¡descansa!"]
        en: ["Marta, I'm really sorry you can't come to the dinner.", "It's a shame you won't see the others, but I understand.", "I'm glad you're better; rest!"]
        grammar: [g.subjunctive-emotion]
        vocab: [w.sentir, w.pena]
      - title: "Comentario en una red social"
        es: ["Estoy orgullosa de que mi barrio participe en la fiesta del río.", "Me emociona que tanta gente limpie el parque cada domingo.", "Pero me da asco que algunos sigan tirando basura al agua."]
        en: ["I'm proud that my neighbourhood takes part in the river festival.", "It moves me that so many people clean the park every Sunday.", "But it disgusts me that some people keep throwing rubbish into the water."]
        grammar: [g.subjunctive-emotion]
        vocab: [w.orgulloso, w.emocionar, w.asco]
  - id: b1.u02.l2
    title: Es importante que…
    teach: [g.subjunctive-impersonal]
    vocab: [w.fundamental, w.imprescindible, w.necesario, w.logico, w.justo, w.injusto, w.absurdo, w.ridiculo, w.vergonzoso, w.conveniente, w.recomendable, w.preferible, w.urgente, w.esencial, w.evidente, w.obvio, w.cierto, w.falso, w.hacer-falta, w.convenir, w.descanso, w.alumno]
    tip: "es + adjective + que + subjunctive for judgements (es importante que vengas); es verdad / evidente / cierto que + indicative for facts."
    sentences:
      - { es: "Es fundamental que los niños duerman bien: el descanso también es salud.", en: "It's fundamental that children sleep well: rest is health too.", grammar: [g.subjunctive-impersonal], vocab: [w.fundamental, w.descanso, w.dormir] }
      - { es: "Es imprescindible que lleves el pasaporte para viajar fuera de Europa.", en: "It's essential that you take your passport to travel outside Europe.", altEs: ["Es imprescindible llevar el pasaporte para viajar fuera de Europa.", "Es necesario que lleves el pasaporte para viajar fuera de Europa."], grammar: [g.subjunctive-impersonal], vocab: [w.imprescindible, w.llevar, w.pasaporte] }
      - { es: "Es lógico que los trabajadores pidan un sueldo mejor.", en: "It's understandable that the workers are asking for a better salary.", altEs: ["Es normal que los trabajadores pidan un sueldo mejor.", "Es lógico que los trabajadores pidan un salario mejor."], grammar: [g.subjunctive-impersonal], vocab: [w.logico, w.trabajador, w.sueldo] }
      - { es: "No es justo que las mujeres ganen menos por el mismo trabajo.", en: "It isn't fair that women earn less for the same work.", grammar: [g.subjunctive-impersonal], vocab: [w.justo, w.mujer, w.ganar] }
      - { es: "Es injusto que los jóvenes paguen alquileres tan altos.", en: "It's unfair that young people pay such high rents.", grammar: [g.subjunctive-impersonal], vocab: [w.injusto, w.joven, w.alquiler] }
      - { es: "Es absurdo que un café cueste cinco euros, y ridículo que el agua cueste tres.", en: "It's absurd that a coffee costs five euros, and ridiculous that water costs three.", grammar: [g.subjunctive-impersonal], vocab: [w.absurdo, w.ridiculo, w.costar] }
      - { es: "Es vergonzoso que los políticos no contesten a las preguntas de los periodistas.", en: "It's shameful that politicians don't answer journalists' questions.", grammar: [g.subjunctive-impersonal], vocab: [w.vergonzoso, w.politico, w.contestar, w.periodista] }
      - { es: "Es conveniente que reservéis con tiempo, y es recomendable que llevéis efectivo.", en: "It's advisable to book in advance, and it's recommended that you take cash.", grammar: [g.subjunctive-impersonal], vocab: [w.conveniente, w.recomendable, w.reservar, w.en-efectivo] }
      - { es: "Es preferible que hablemos de esto en persona.", en: "It's better that we talk about this in person.", altEs: ["Es mejor que hablemos de esto en persona.", "Prefiero que hablemos de esto en persona."], grammar: [g.subjunctive-impersonal], vocab: [w.preferible, w.hablar, w.persona] }
      - { es: "Es urgente que alguien limpie la cocina: hace falta que esté lista antes de la cena.", en: "It's urgent that someone cleans the kitchen: it needs to be ready before dinner.", grammar: [g.subjunctive-impersonal, g.subjunctive-irregular], vocab: [w.urgente, w.hacer-falta, w.limpiar, w.cocina] }
      - { es: "Es evidente que la ciudad necesita más transporte público, y es esencial que sea barato.", en: "It's obvious that the city needs more public transport, and it's essential that it's cheap.", grammar: [g.subjunctive-impersonal], vocab: [w.evidente, w.esencial, w.transporte, w.barato], note: "es evidente que + indicative (fact); es esencial que + subjunctive (judgement)." }
      - { es: "Es obvio que no quiere venir, pero no es cierto que esté enfadado.", en: "It's obvious he doesn't want to come, but it isn't true that he's angry.", altEs: ["Está claro que no quiere venir, pero no es cierto que esté enfadado.", "Es evidente que no quiere venir, pero no es verdad que esté enfadado."], grammar: [g.subjunctive-impersonal], vocab: [w.obvio, w.cierto, w.enfadado], note: "no es cierto que → subjunctive." }
      - { es: "Es falso que el azúcar moreno sea más sano que el blanco.", en: "It's false that brown sugar is healthier than white sugar.", altEs: ["No es cierto que el azúcar moreno sea más sano que el blanco."], grammar: [g.subjunctive-impersonal, g.comparatives], vocab: [w.falso, w.azucar, w.sano] }
      - { es: "Conviene que llegues media hora antes al aeropuerto.", en: "You'd do well to arrive at the airport half an hour early.", altEs: ["Es conveniente que llegues media hora antes al aeropuerto.", "Conviene llegar media hora antes al aeropuerto."], grammar: [g.subjunctive-impersonal], vocab: [w.convenir, w.llegar, w.aeropuerto] }
      - { es: "Es necesario que vayas al médico.", en: "You need to go to the doctor.", altEs: ["Hace falta que vayas al médico.", "Es necesario que vayas al doctor."], grammar: [g.subjunctive-impersonal, g.subjunctive-irregular], vocab: [w.necesario, w.ir, w.medico], error: { wrong: "Es necesario de que vayas al médico.", explain: "No de here: es necesario que, not es necesario de que.", grammar: g.subjunctive-impersonal } }
      - { es: "Es importante hacer deporte.", en: "It's important to do sport.", grammar: [g.subjunctive-impersonal], vocab: [w.importante, w.deporte], transform: { instruction: "Make it about los niños with que + subjunctive", answer: "Es importante que los niños hagan deporte.", alt: ["Es importante que hagan deporte los niños."] } }
    exchanges:
      - q: { es: "¿Qué hace falta para viajar a Marruecos?", en: "What do you need to travel to Morocco?" }
        a: { es: "Es imprescindible que lleves el pasaporte.", en: "It's essential that you take your passport." }
        alt: ["Es necesario llevar el pasaporte.", "Hace falta pasaporte y es recomendable que cambies dinero antes."]
        grammar: [g.subjunctive-impersonal]
        vocab: [w.imprescindible, w.hacer-falta]
      - q: { es: "¿Es verdad que el café es malo para la salud?", en: "Is it true that coffee is bad for your health?" }
        a: { es: "No, no es cierto que el café sea malo; es falso.", en: "No, it isn't true that coffee is bad; it's false." }
        alt: ["Es falso; no está demostrado.", "No es cierto; lo malo es el azúcar."]
        grammar: [g.subjunctive-impersonal]
        vocab: [w.cierto, w.falso]
      - q: { es: "¿Reservamos el restaurante ahora o la semana que viene?", en: "Shall we book the restaurant now or next week?" }
        a: { es: "Es conveniente que reservéis ya; en agosto está todo lleno.", en: "You'd better book now; in August everything's full." }
        alt: ["Es mejor que lo reservéis cuanto antes.", "Conviene reservar ahora."]
        grammar: [g.subjunctive-impersonal]
        vocab: [w.conveniente, w.convenir]
      - q: { es: "¿Por qué es urgente que hablemos?", en: "Why is it urgent that we talk?" }
        a: { es: "Porque es evidente que hay un problema y es preferible que lo resolvamos hoy.", en: "Because it's obvious there's a problem and it's better that we solve it today." }
        alt: ["Porque hace falta que decidamos algo antes del viernes.", "No es urgente, pero es importante."]
        grammar: [g.subjunctive-impersonal]
        vocab: [w.urgente, w.evidente, w.preferible]
      - q: { es: "Los alumnos piden más descanso entre las clases.", en: "The pupils are asking for more rest between classes." }
        a: { es: "Es lógico que lo pidan; es fundamental que descansen.", en: "It's understandable that they ask for it; it's fundamental that they rest." }
        alt: ["Me parece justo que lo pidan.", "Es absurdo que solo tengan cinco minutos."]
        grammar: [g.subjunctive-impersonal]
        vocab: [w.alumno, w.descanso, w.logico, w.fundamental]
    texts:
      - title: "Aviso en la escuela"
        es: ["Es necesario que los alumnos lleguen antes de las nueve.", "Es recomendable que traigan agua y algo de fruta.", "No es obligatorio llevar uniforme, pero es conveniente que vengan con ropa cómoda."]
        en: ["Pupils need to arrive before nine.", "It's recommended that they bring water and some fruit.", "It isn't compulsory to wear a uniform, but it's advisable that they come in comfortable clothes."]
        grammar: [g.subjunctive-impersonal]
        vocab: [w.necesario, w.recomendable, w.alumno]
      - title: "Opinión de un lector"
        es: ["Es injusto que los jóvenes paguen alquileres tan altos.", "Es evidente que la ciudad necesita más vivienda pública.", "Y es urgente que el ayuntamiento haga algo ya."]
        en: ["It's unfair that young people pay such high rents.", "It's obvious that the city needs more public housing.", "And it's urgent that the council does something now."]
        grammar: [g.subjunctive-impersonal]
        vocab: [w.injusto, w.evidente, w.urgente]
  - id: b1.u02.l3
    title: ¿Subjuntivo o infinitivo?
    teach: [g.subjunctive-vs-infinitive]
    vocab: [w.huelga, w.manifestacion, w.protesta, w.protestar, w.ley, w.gobierno, w.ministro, w.elecciones, w.resultado, w.acuerdo, w.crisis, w.impuesto, w.vivienda, w.salario, w.pension, w.sanidad, w.educacion, w.ciudadano, w.sociedad, w.medida, w.conciliar, w.situacion, w.durar, w.recortar, w.solucion]
    tip: "One subject → infinitive (Quiero votar). Two subjects → que + subjunctive (Quiero que votes). Prepositions stay the same: antes de salir / antes de que salgas."
    sentences:
      - { es: "Los trabajadores quieren hacer huelga; el gobierno quiere que vuelvan al trabajo.", en: "The workers want to go on strike; the government wants them to go back to work.", grammar: [g.subjunctive-vs-infinitive], vocab: [w.huelga, w.gobierno, w.volver] }
      - { es: "Queremos protestar y queremos que el ministro nos escuche.", en: "We want to protest and we want the minister to listen to us.", altEs: ["Queremos protestar y que el ministro nos escuche."], grammar: [g.subjunctive-vs-infinitive], vocab: [w.protestar, w.ministro, w.escuchar] }
      - { es: "Antes de cambiar la ley, el gobierno debería escuchar a la sociedad.", en: "Before changing the law, the government should listen to society.", grammar: [g.subjunctive-vs-infinitive, g.conditional-simple], vocab: [w.ley, w.gobierno, w.sociedad] }
      - { es: "Espero conocer los resultados esta noche; espero que sean claros.", en: "I hope to know the results tonight; I hope they're clear.", altEs: ["Espero saber los resultados esta noche; espero que sean claros."], grammar: [g.subjunctive-vs-infinitive], vocab: [w.resultado, w.conocer, w.esperar] }
      - { es: "Los partidos necesitan llegar a un acuerdo; los ciudadanos necesitan que lo hagan pronto.", en: "The parties need to reach an agreement; the citizens need them to do it soon.", grammar: [g.subjunctive-vs-infinitive], vocab: [w.acuerdo, w.partido, w.ciudadano] }
      - { es: "Nadie quiere pagar más impuestos, pero todos queremos que la sanidad sea buena.", en: "Nobody wants to pay more taxes, but we all want healthcare to be good.", grammar: [g.subjunctive-vs-infinitive], vocab: [w.impuesto, w.sanidad, w.pagar] }
      - { es: "Para comprar una vivienda hace falta ahorrar durante años.", en: "To buy a home you need to save for years.", altEs: ["Para comprar una casa hace falta ahorrar durante años.", "Para comprar una vivienda es necesario ahorrar durante años."], grammar: [g.subjunctive-vs-infinitive], vocab: [w.vivienda, w.ahorrar, w.hacer-falta] }
      - { es: "Después de la crisis, los trabajadores exigen un salario mejor y exigen que el gobierno los escuche.", en: "After the crisis, the workers are demanding a better salary and demanding that the government listens to them.", grammar: [g.subjunctive-vs-infinitive], vocab: [w.crisis, w.salario, w.exigir] }
      - { es: "Mis abuelos quieren vivir de su pensión sin pedir ayuda a nadie.", en: "My grandparents want to live on their pension without asking anyone for help.", altEs: ["Mis abuelos quieren vivir de su pensión sin pedirle ayuda a nadie."], grammar: [g.subjunctive-vs-infinitive], vocab: [w.pension, w.vivir, w.pedir, w.ayuda], note: "sin + infinitive (same subject)." }
      - { es: "La educación pública necesita más profesores; necesitamos que el gobierno invierta en educación.", en: "Public education needs more teachers; we need the government to invest in education.", grammar: [g.subjunctive-vs-infinitive], vocab: [w.educacion, w.invertir, w.profesor] }
      - { es: "El gobierno ha tomado medidas para bajar el precio de la luz.", en: "The government has taken measures to lower the price of electricity.", grammar: [g.subjunctive-vs-infinitive, g.present-perfect], vocab: [w.medida, w.bajar, w.luz], note: "para + infinitive; para que + subjunctive when the subject changes." }
      - { es: "Quiero conciliar trabajo y familia, y quiero que mi empresa lo permita.", en: "I want to balance work and family, and I want my company to allow it.", altEs: ["Quiero conciliar el trabajo y la familia, y quiero que mi empresa lo permita."], grammar: [g.subjunctive-vs-infinitive], vocab: [w.conciliar, w.familia, w.permitir] }
      - { es: "Mañana hay una protesta delante del ayuntamiento; te lo digo para que vengas.", en: "Tomorrow there's a protest in front of the town hall; I'm telling you so that you come.", grammar: [g.subjunctive-vs-infinitive, g.subjunctive-purpose], vocab: [w.protesta, w.ayuntamiento, w.venir] }
      - { es: "La situación es difícil, pero no creo que la huelga dure más de dos días.", en: "The situation is difficult, but I don't think the strike will last more than two days.", grammar: [g.subjunctive-vs-infinitive, g.creer-no-creer], vocab: [w.situacion, w.durar, w.huelga] }
      - { es: "Quiero ir a la manifestación contigo.", en: "I want to go to the demonstration with you.", altEs: ["Quiero ir contigo a la manifestación."], grammar: [g.subjunctive-vs-infinitive], vocab: [w.manifestacion, w.ir], error: { wrong: "Quiero que ir a la manifestación contigo.", explain: "Same subject (yo) → infinitive, with no que: quiero ir.", grammar: g.subjunctive-vs-infinitive } }
      - { es: "Espero aprobar las oposiciones.", en: "I hope to pass the civil-service exams.", altEs: ["Espero aprobar la oposición."], grammar: [g.subjunctive-vs-infinitive], vocab: [w.aprobar, w.oposicion], transform: { instruction: "Make the second verb refer to mi hermana", answer: "Espero que mi hermana apruebe las oposiciones.", alt: [] } }
    exchanges:
      - q: { es: "¿Vas a ir a la manifestación?", en: "Are you going to the demonstration?" }
        a: { es: "Sí, quiero protestar contra la nueva ley.", en: "Yes, I want to protest against the new law." }
        alt: ["Sí, y quiero que vengas conmigo.", "No, prefiero quedarme en casa."]
        grammar: [g.subjunctive-vs-infinitive]
        vocab: [w.manifestacion, w.protestar, w.ley]
      - q: { es: "¿Qué espera la gente del nuevo gobierno?", en: "What do people expect from the new government?" }
        a: { es: "Espera que baje los impuestos y que mejore la sanidad.", en: "They expect it to lower taxes and improve healthcare." }
        alt: ["Que llegue a un acuerdo con los trabajadores.", "Espera una solución para la vivienda."]
        grammar: [g.subjunctive-vs-infinitive]
        vocab: [w.gobierno, w.impuesto, w.sanidad]
      - q: { es: "¿Cuánto va a durar la huelga?", en: "How long is the strike going to last?" }
        a: { es: "No lo sé; los trabajadores necesitan que la empresa los escuche.", en: "I don't know; the workers need the company to listen to them." }
        alt: ["Espero que dure poco.", "Nadie lo sabe; depende del acuerdo."]
        grammar: [g.subjunctive-vs-infinitive]
        vocab: [w.durar, w.huelga]
      - q: { es: "¿Qué necesitas para conciliar trabajo y familia?", en: "What do you need to balance work and family?" }
        a: { es: "Necesito trabajar menos horas y necesito que mi jefe lo entienda.", en: "I need to work fewer hours and I need my boss to understand that." }
        alt: ["Necesito que mi empresa permita el teletrabajo.", "Un horario más flexible."]
        grammar: [g.subjunctive-vs-infinitive]
        vocab: [w.conciliar]
      - q: { es: "¿Quieres que hablemos de las elecciones?", en: "Do you want us to talk about the elections?" }
        a: { es: "Prefiero no hablar de política hoy.", en: "I'd rather not talk about politics today." }
        alt: ["Vale, pero quiero que escuches mi opinión.", "No, gracias; prefiero que cambiemos de tema."]
        grammar: [g.subjunctive-vs-infinitive]
        vocab: [w.elecciones]
    texts:
      - title: "Titular y entrada"
        es: ["Los ciudadanos exigen una solución para la vivienda.", "Muchas personas salieron ayer a la calle para protestar.", "Quieren que el gobierno tome medidas antes de las elecciones."]
        en: ["Citizens demand a solution for housing.", "Many people took to the streets yesterday to protest.", "They want the government to take measures before the elections."]
        grammar: [g.subjunctive-vs-infinitive]
        vocab: [w.ciudadano, w.solucion, w.vivienda, w.medida]
      - title: "Aviso a los trabajadores"
        es: ["Mañana hay huelga en toda la empresa.", "Queremos protestar contra la bajada de los salarios y queremos que la dirección nos escuche.", "Esperamos que la huelga no dure más de un día."]
        en: ["Tomorrow there's a strike across the whole company.", "We want to protest against the cut in salaries and we want management to listen to us.", "We hope the strike doesn't last more than a day."]
        grammar: [g.subjunctive-vs-infinitive]
        vocab: [w.huelga, w.salario, w.durar]
  - id: b1.u02.l4
    title: Reaccionar a las noticias
    teach: [g.subjunctive-emotion]
    vocab: [w.igualdad, w.desigualdad, w.violencia, w.pobreza, w.incendio, w.inundacion, w.sequia, w.temperatura, w.subida, w.bajada, w.aumento, w.reducir, w.poblacion, w.inmigracion, w.victima, w.titular, w.portada, w.cambio-climatico, w.medio-de-comunicacion, w.indignante, w.preocupante, w.decepcion, w.alivio, w.curioso, w.habitual]
    tip: "React to news with a feeling + que + subjunctive: Es indignante que…, Me preocupa que…, ¡Qué alivio que…! The facts you report stay in the indicative."
    sentences:
      - { es: "¿Has visto el titular de hoy? Es indignante que haya otra subida del precio de la luz.", en: "Have you seen today's headline? It's outrageous that there's another rise in the price of electricity.", grammar: [g.subjunctive-emotion, g.subjunctive-irregular], vocab: [w.titular, w.indignante, w.subida] }
      - { es: "Me preocupa que la desigualdad siga creciendo en las grandes ciudades.", en: "It worries me that inequality keeps growing in the big cities.", altEs: ["Me preocupa que la desigualdad siga aumentando en las grandes ciudades.", "Es preocupante que la desigualdad siga creciendo en las grandes ciudades."], grammar: [g.subjunctive-emotion], vocab: [w.desigualdad, w.preocuparse, w.crecer, w.seguir-gerundio] }
      - { es: "Es una vergüenza que haya tanta pobreza y tanta violencia en un país tan rico.", en: "It's a disgrace that there's so much poverty and so much violence in such a rich country.", altEs: ["Es vergonzoso que haya tanta pobreza y tanta violencia en un país tan rico."], grammar: [g.subjunctive-emotion], vocab: [w.pobreza, w.violencia, w.verguenza, w.rico] }
      - { es: "Me alegro de que la igualdad entre hombres y mujeres esté en la portada.", en: "I'm glad that equality between men and women is on the front page.", grammar: [g.subjunctive-emotion], vocab: [w.igualdad, w.portada, w.alegrarse] }
      - { es: "Es preocupante que los incendios empiecen ya en mayo.", en: "It's worrying that the wildfires are already starting in May.", altEs: ["Me preocupa que los incendios empiecen ya en mayo."], grammar: [g.subjunctive-emotion], vocab: [w.incendio, w.preocupante, w.empezar], note: "empezar → empiece: z becomes c before e." }
      - { es: "Siento mucho que haya víctimas en las inundaciones de Valencia.", en: "I'm very sorry there are victims in the floods in Valencia.", altEs: ["Lamento mucho que haya víctimas en las inundaciones de Valencia."], grammar: [g.subjunctive-emotion], vocab: [w.victima, w.inundacion, w.sentir] }
      - { es: "Tengo miedo de que la sequía no termine este año.", en: "I'm afraid the drought won't end this year.", altEs: ["Me da miedo que la sequía no termine este año.", "Tengo miedo de que la sequía no acabe este año."], grammar: [g.subjunctive-emotion], vocab: [w.sequia, w.tener-miedo.phr, w.terminar] }
      - { es: "No es normal que las temperaturas lleguen a cuarenta grados en junio.", en: "It isn't normal for temperatures to reach forty degrees in June.", grammar: [g.subjunctive-emotion, g.subjunctive-impersonal], vocab: [w.temperatura, w.llegar, w.grado] }
      - { es: "Es una buena noticia que el ayuntamiento quiera reducir el tráfico en el centro.", en: "It's good news that the council wants to reduce traffic in the centre.", grammar: [g.subjunctive-emotion], vocab: [w.reducir, w.ayuntamiento, w.trafico] }
      - { es: "¡Qué alivio que la portada de hoy hable de una bajada de los precios!", en: "What a relief that today's front page is talking about a fall in prices!", grammar: [g.subjunctive-emotion], vocab: [w.alivio, w.bajada, w.precio] }
      - { es: "Me extraña que los medios de comunicación no hablen más del cambio climático.", en: "I'm surprised that the media don't talk more about climate change.", altEs: ["Me sorprende que los medios de comunicación no hablen más del cambio climático."], grammar: [g.subjunctive-emotion], vocab: [w.medio-de-comunicacion, w.cambio-climatico, w.extranar] }
      - { es: "Es curioso que la población del pueblo aumente en verano y baje en invierno.", en: "It's curious that the village's population goes up in summer and down in winter.", grammar: [g.subjunctive-emotion], vocab: [w.curioso, w.poblacion, w.aumentar] }
      - { es: "Es habitual que la inmigración sea noticia antes de las elecciones.", en: "It's usual for immigration to be in the news before elections.", grammar: [g.subjunctive-emotion, g.subjunctive-irregular], vocab: [w.habitual, w.inmigracion, w.elecciones] }
      - { es: "Para mí ha sido una decepción que el aumento de las pensiones sea tan pequeño.", en: "For me it's been a disappointment that the increase in pensions is so small.", grammar: [g.subjunctive-emotion, g.present-perfect], vocab: [w.decepcion, w.aumento, w.pension] }
      - { es: "Me molesta que los periódicos hablen solo de fútbol.", en: "It bothers me that the newspapers only talk about football.", altEs: ["Me molesta que los periódicos solo hablen de fútbol.", "Me fastidia que los periódicos hablen solo de fútbol."], grammar: [g.subjunctive-emotion], vocab: [w.molestar, w.periodico, w.futbol], error: { wrong: "Me molesta que los periódicos hablan solo de fútbol.", explain: "A reaction (me molesta que) takes the subjunctive: hablen.", grammar: g.subjunctive-emotion } }
      - { es: "Los jóvenes no pueden pagar un alquiler. (es injusto)", en: "It's unfair that young people can't pay rent.", grammar: [g.subjunctive-emotion], vocab: [w.injusto, w.joven, w.alquiler], transform: { instruction: "React with Es injusto que…", answer: "Es injusto que los jóvenes no puedan pagar un alquiler.", alt: [] } }
    exchanges:
      - q: { es: "¿Has leído la portada de hoy?", en: "Have you read today's front page?" }
        a: { es: "Sí, es indignante que suban otra vez el precio de la luz.", en: "Yes, it's outrageous that they're putting up the price of electricity again." }
        alt: ["Todavía no. ¿Qué dice?", "Sí; me preocupa que la sequía siga."]
        grammar: [g.subjunctive-emotion]
        vocab: [w.portada, w.indignante, w.subida]
      - q: { es: "Hay incendios otra vez en Galicia.", en: "There are wildfires again in Galicia." }
        a: { es: "Qué preocupante que empiecen tan pronto este año.", en: "How worrying that they're starting so early this year." }
        alt: ["Es terrible que haya incendios ya en mayo.", "Espero que no haya víctimas."]
        grammar: [g.subjunctive-emotion]
        vocab: [w.incendio, w.preocupante]
      - q: { es: "Dicen que los precios van a bajar.", en: "They say prices are going to fall." }
        a: { es: "¡Qué alivio que por fin haya una bajada!", en: "What a relief that there's finally a fall!" }
        alt: ["Me alegro de que bajen, pero no me lo creo.", "Ojalá sea verdad."]
        grammar: [g.subjunctive-emotion]
        vocab: [w.alivio, w.bajada]
      - q: { es: "¿Qué te parece el aumento de las pensiones?", en: "What do you think about the increase in pensions?" }
        a: { es: "Es una decepción que sea tan pequeño.", en: "It's a disappointment that it's so small." }
        alt: ["Me parece bien que las suban, aunque sea poco.", "Me da igual; yo todavía no tengo pensión."]
        grammar: [g.subjunctive-emotion]
        vocab: [w.aumento, w.decepcion]
      - q: { es: "¿Por qué la inmigración es siempre noticia antes de las elecciones?", en: "Why is immigration always in the news before elections?" }
        a: { es: "Es habitual; me molesta que los medios hablen de eso solo entonces.", en: "It's usual; it bothers me that the media only talk about it then." }
        alt: ["No lo sé, pero es curioso que pase todos los años.", "Porque a los políticos les interesa."]
        grammar: [g.subjunctive-emotion]
        vocab: [w.inmigracion, w.habitual, w.curioso]
    texts:
      - title: "Titular y entrada"
        es: ["Las temperaturas llegan a los cuarenta grados en junio.", "Es preocupante que la subida empiece cada año antes.", "Los científicos piden que se hable más del cambio climático."]
        en: ["Temperatures reach forty degrees in June.", "It's worrying that the rise starts earlier every year.", "Scientists are asking that climate change be talked about more."]
        grammar: [g.subjunctive-emotion]
        vocab: [w.temperatura, w.subida, w.cambio-climatico]
      - title: "Comentario de una lectora"
        es: ["Me alegro de que la igualdad esté por fin en la portada.", "Pero es una vergüenza que haya tanta pobreza en una ciudad tan rica.", "Siento mucho que las víctimas de la inundación sigan sin casa."]
        en: ["I'm glad that equality is finally on the front page.", "But it's a disgrace that there's so much poverty in such a rich city.", "I'm very sorry that the victims of the flood are still without a home."]
        grammar: [g.subjunctive-emotion]
        vocab: [w.igualdad, w.pobreza, w.victima, w.inundacion]
dialogues:
  - id: b1.u02.d1
    title: Las noticias del desayuno
    context: Nuria and Pablo share a flat. Over breakfast they react to the news on Pablo's phone.
    lines:
      - { speaker: Pablo, es: "Mira este titular: van a cerrar el centro de salud del barrio por las tardes.", en: "Look at this headline: they're going to close the neighbourhood health centre in the afternoons." }
      - { speaker: Nuria, es: "¡Qué vergüenza! Es indignante que recorten en sanidad otra vez.", en: "How shameful! It's outrageous that they're cutting healthcare again." }
      - { speaker: Pablo, es: "Y aquí dice que los alquileres han subido un diez por ciento este año.", en: "And here it says rents have gone up ten percent this year." }
      - { speaker: Nuria, es: "Me da rabia que nadie haga nada. Es lógico que los jóvenes se vayan del barrio.", en: "It makes me angry that nobody does anything. It's understandable that young people are leaving the neighbourhood." }
      - { speaker: Pablo, es: "Bueno, no todo es malo. Es una buena noticia que abran una biblioteca nueva en la plaza.", en: "Well, it's not all bad. It's good news that they're opening a new library in the square." }
      - { speaker: Nuria, es: "Es verdad, eso me alegra. Y me da envidia que tú tengas tiempo para leer.", en: "That's true, that makes me happy. And I envy you having time to read." }
      - { speaker: Pablo, es: "¡Qué lástima que no vivamos más cerca! Podríamos ir juntos.", en: "What a shame we don't live closer! We could go together." }
      - { speaker: Nuria, es: "A mí me da igual que esté lejos; lo importante es que exista.", en: "I don't mind that it's far; the important thing is that it exists." }
      - { speaker: Pablo, es: "Oye, es necesario que salgamos ya. Es la una menos cuarto.", en: "Hey, we need to leave now. It's a quarter to one." }
      - { speaker: Nuria, es: "¡Es increíble que siempre lleguemos tarde por culpa de las noticias!", en: "It's unbelievable that we're always late because of the news!" }
    questions:
      - { q: "What is going to happen to the health centre?", options: ["It will open at weekends", "It will close in the afternoons", "It will move to the square"], answer: 1 }
      - { q: "What good news does Pablo mention?", options: ["Rents are falling", "A new library is opening", "A new job"], answer: 1 }
