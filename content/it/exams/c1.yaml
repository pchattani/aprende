reading:
  text: |
    Nel 1934 Luigi Pirandello ricevette il premio Nobel per la letteratura. Era nato nel 1867 ad Agrigento, in una località che, con un nome che pare inventato da lui stesso, si chiamava Caos. A chi gli chiedeva delle sue origini, rispondeva volentieri di essere «figlio del Caos», e non soltanto per il luogo di nascita: tutta la sua opera, dalle novelle ai romanzi al teatro, parte dall'idea che la realtà non abbia un ordine stabile e che ciascuno di noi sia, per gli altri, qualcosa di diverso da ciò che crede di essere.

    Sarebbe tuttavia un errore leggere Pirandello soltanto come un autore di idee. La sua forza sta piuttosto nel trasformare situazioni comuni, spesso perfino ridicole, in vere e proprie crisi d'identità. Un uomo scopre di avere il naso storto e, da quel momento, si rende conto che gli altri lo vedono in un modo che lui non aveva mai immaginato; un altro, creduto morto per errore, approfitta dell'occasione per ricominciare una nuova vita, salvo accorgersi che senza un nome e senza documenti non si può vivere affatto. Il lettore ride, ma è un riso amaro: Pirandello stesso lo chiamava «umorismo», distinguendolo dal semplice comico.

    Non va dimenticato, infine, il legame con la Sicilia. Pur avendo vissuto a lungo a Roma e avendo viaggiato in tutta Europa con la sua compagnia teatrale, Pirandello non smise mai di raccontare la Sicilia in molte delle sue storie. La provincia siciliana, con le sue regole severe e i suoi pettegolezzi, gli offriva il palcoscenico ideale per mostrare quanto le apparenze possano diventare una prigione. Ancora oggi, chi visita la sua casa natale, a pochi chilometri dalla Valle dei Templi, può vedere la pietra sotto la quale, secondo la sua volontà, riposano le sue ceneri.
  questions:
    - { q: "Why did Pirandello call himself 'figlio del Caos'?", options: ["Only because he had a chaotic childhood", "Because he was born in a place called Caos, and because his work is about a reality without stable order", "Because his family was poor"], answer: 1 }
    - { q: "According to the text, what is Pirandello's real strength?", options: ["Writing philosophical treatises", "Turning ordinary, even trivial situations into crises of identity", "Describing Sicilian landscapes"], answer: 1 }
    - { q: "What does the man believed dead discover?", options: ["That his family is happy to see him again", "That you cannot live at all without a name and documents", "That he is famous"], answer: 1 }
    - { q: "How does Pirandello's 'umorismo' differ from the simply comic?", options: ["It makes you laugh, but bitterly", "It is only for children", "It never makes you laugh"], answer: 0 }
    - { q: "Why did Pirandello set so many stories in Sicily?", options: ["Because he never left the island", "Because its rigid social rules and gossip showed how appearances can become a prison", "Because his publisher asked him to"], answer: 1 }
