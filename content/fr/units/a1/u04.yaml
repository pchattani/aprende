      - { es: "L'église est très ancienne.", en: "The church is very old.", grammar: [g.elision-liaison, g.adjective-agreement], vocab: [w.église, w.ancien], transform: { instruction: "Make it plural (the churches)", answer: "Les églises sont très anciennes.", en: "The churches are very old." } }
      - { es: "Le musée Picasso est dans le Marais.", en: "The Picasso Museum is in the Marais.", grammar: [g.prepositions-place], vocab: [w.musée] }
      - { es: "On va au cinéma ce soir ?", en: "Shall we go to the cinema tonight?", altEs: ["On va au ciné ce soir ?", "Nous allons au cinéma ce soir ?"], altEn: ["Shall we go to the movies tonight?"], grammar: [g.contractions-au-du, g.on-nous], vocab: [w.cinéma] }
      - { es: "Mes amis sont dans un petit café.", en: "My friends are in a little café.", grammar: [g.elision-liaison, g.articles-indefinite], vocab: [w.café, w.ami], note: "Liaison: mes‿amis [me.za.mi]." }
      - { es: "L'hôpital n'est pas loin d'ici.", en: "The hospital isn't far from here.", altEs: ["L'hôpital est pas loin d'ici."], grammar: [g.elision-liaison, g.negation-ne-pas], vocab: [w.hôpital] }
      - { es: "C'est beau, Paris !", en: "Paris is beautiful!", altEs: ["Paris, c'est beau !"], altEn: ["It's beautiful, Paris!"], grammar: [g.c-est-il-est], vocab: [w.beau], note: "C'est + adjective for a general idea stays masculine: Paris, c'est beau." }
      - { es: "La place des Vosges ? Elle est très belle.", en: "The Place des Vosges? It's very beautiful.", grammar: [g.c-est-il-est, g.adjective-agreement], vocab: [w.beau] }
