      - { es: "Não estou com fome. Estou com saudade de você.", en: "I'm not hungry. I miss you.", altEs: ["Não tô com fome. Tô com saudade de você.", "Não estou com fome. Estou com saudades de você."], grammar: [g.estar-com, g.negation], vocab: [w.fome, w.saudade] }
