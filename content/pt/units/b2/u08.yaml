id: b2.u08
title: "Vou levando"
lessons:
  - id: b2.u08.l1
    title: "A gente vai se virando"
    teach: [g.periphrases-aspect]
    vocab: [w.se-virar, w.ir-levando, w.correria, w.suar, w.suor, w.informal, w.apertado, w.folgado, w.bico, w.instrutor, w.kitesurf, w.autônomo, w.vale-transporte, w.vale-refeição, w.décimo-terceiro, w.ter-a-ver-com, w.renda-extra, w.juntar, w.ralar, w.batalhar, w.pagar-as-contas, w.gradualmente, w.vila, w.atualmente, w.anteriormente, w.hoje-em-dia]
    tip: "ir + gerund = little by little (vou levando); vir + gerund = building up until now (venho pensando); andar + gerund = lately (ando dormindo mal); sair + gerund = off he went (saiu correndo); acabar + gerund = ended up."
    sentences:
      - { es: "E aí, como vai a vida em Jeri? — Vou levando.", en: "So, how's life in Jeri? — Getting by.", altEs: ["E aí, como está a vida em Jeri? — Vou levando."], altEn: ["So, how's life in Jeri? — I'm getting by."], grammar: [g.periphrases-aspect], vocab: [w.ir-levando] }
      - { es: "Aqui em Jericoacoara a gente vai se virando com o turismo.", en: "Here in Jericoacoara we get by on tourism.", altEs: ["Aqui em Jericoacoara nós vamos nos virando com o turismo.", "Aqui em Jeri a gente vai se virando com o turismo."], grammar: [g.periphrases-aspect, g.a-gente], vocab: [w.se-virar, w.turismo] }
      - { es: "Os preços das pousadas vêm subindo desde o ano passado.", en: "Guesthouse prices have been going up since last year.", altEs: ["Desde o ano passado, os preços das pousadas vêm subindo."], grammar: [g.periphrases-aspect], vocab: [w.pousada, w.preço], transform: { instruction: "Say they have gone up gradually (ir + gerund, past)", answer: "Os preços das pousadas foram subindo desde o ano passado." } }
      - { es: "Ando trabalhando demais: faço bico de instrutor de kitesurf nos fins de semana.", en: "I've been working too much lately: I do odd jobs as a kitesurfing instructor at weekends.", altEs: ["Ultimamente ando trabalhando demais: faço bico de instrutor de kitesurf nos fins de semana."], grammar: [g.periphrases-aspect], vocab: [w.bico, w.instrutor, w.kitesurf] }
      - { es: "Ela saiu correndo para a duna para não perder o pôr do sol.", en: "She rushed off to the dune so as not to miss the sunset.", altEs: ["Ela saiu correndo pra duna pra não perder o pôr do sol."], grammar: [g.periphrases-aspect], vocab: [w.duna, w.pôr-do-sol], variant: "Portugal: Ela saiu a correr para a duna." }
      - { es: "A gente veio para passar uma semana e acabou ficando um mês.", en: "We came to spend a week and ended up staying a month.", altEs: ["Nós viemos para passar uma semana e acabamos ficando um mês.", "A gente veio passar uma semana e acabou ficando um mês."], grammar: [g.periphrases-aspect, g.a-gente], vocab: [], transform: { instruction: "Change to eu", answer: "Eu vim para passar uma semana e acabei ficando um mês.", alt: ["Vim para passar uma semana e acabei ficando um mês.", "Eu vim passar uma semana e acabei ficando um mês."] } }
      - { es: "Como sou autônomo, não tenho vale-transporte, vale-refeição nem décimo terceiro.", en: "As I'm self-employed, I don't get a transport voucher, meal vouchers or a thirteenth-month salary.", altEs: ["Como sou autônoma, não tenho vale-transporte, vale-refeição nem décimo terceiro.", "Como eu sou autônomo, não tenho vale-transporte, vale-refeição nem décimo terceiro."], grammar: [g.ser-present, g.negation], vocab: [w.autônomo, w.vale-transporte, w.vale-refeição, w.décimo-terceiro], note: "Décimo terceiro (salário): the extra month's pay that Brazilian employees receive at the end of the year." }
      - { es: "O meu cansaço não tem a ver com o trabalho, e sim com o calor.", en: "My tiredness has nothing to do with work; it's the heat.", altEs: ["Meu cansaço não tem a ver com o trabalho, e sim com o calor."], altEn: ["My tiredness isn't to do with work, but with the heat."], grammar: [g.negation], vocab: [w.ter-a-ver-com] }
      - { es: "No começo foi difícil, mas fui me acostumando com o vento.", en: "At first it was hard, but little by little I got used to the wind.", altEs: ["No começo foi difícil, mas aos poucos fui me acostumando com o vento."], grammar: [g.periphrases-aspect, g.clitics-verb-phrases], vocab: [w.acostumar-se, w.vento] }
      - { es: "Como o dinheiro anda apertado, ele faz uns bicos para ter uma renda extra.", en: "Since money has been tight lately, he does some odd jobs for extra income.", altEs: ["Como o dinheiro anda apertado, ele faz uns bicos pra ter uma renda extra."], grammar: [g.periphrases-aspect], vocab: [w.apertado, w.bico, w.renda-extra] }
      - { es: "Venho juntando dinheiro há dois anos para abrir minha própria pousada.", en: "I've been saving money for two years to open my own guesthouse.", altEs: ["Há dois anos venho juntando dinheiro para abrir minha própria pousada.", "Venho juntando dinheiro há dois anos para abrir a minha própria pousada."], grammar: [g.periphrases-aspect, g.ha-faz-time], vocab: [w.juntar, w.pousada] }
      - { es: "Na alta temporada é uma correria: a gente rala de manhã à noite.", en: "In high season it's a mad rush: we slog from morning till night.", altEs: ["Na alta temporada é uma correria: nós ralamos de manhã à noite."], grammar: [g.a-gente], vocab: [w.correria, w.ralar] }
      - { es: "Com esse calor, a gente sua só de olhar para a areia.", en: "In this heat, we sweat just from looking at the sand.", altEs: ["Com este calor, a gente sua só de olhar pra areia."], grammar: [g.a-gente], vocab: [w.suar, w.areia] }
      - { es: "Meu pai batalhou a vida inteira para pagar as contas.", en: "My father struggled his whole life to pay the bills.", altEs: ["O meu pai batalhou a vida inteira para pagar as contas."], grammar: [g.preterite-regular], vocab: [w.batalhar, w.pagar-as-contas] }
      - { es: "Gradualmente, a vila foi crescendo e virou um destino internacional.", en: "Gradually, the village grew and became an international destination.", altEs: ["Aos poucos, a vila foi crescendo e virou um destino internacional."], grammar: [g.periphrases-aspect], vocab: [w.gradualmente, w.destino, w.vila] }
      - { es: "Vou enviar o orçamento amanhã.", en: "I'll send the quote tomorrow.", altEs: ["Envio o orçamento amanhã.", "Amanhã vou enviar o orçamento.", "Mando o orçamento amanhã."], grammar: [g.periphrases-aspect, g.ir-infinitive], vocab: [], transform: { instruction: "Use the simple present instead of ir + infinitive", answer: "Envio o orçamento amanhã.", alt: ["Amanhã envio o orçamento.", "Mando o orçamento amanhã."] }, error: { wrong: "Vou estar enviando o orçamento amanhã.", explain: "This is the mocked 'gerundismo' of call centres. Say Vou enviar or Envio amanhã.", grammar: g.periphrases-aspect } }
    exchanges:
      - q: { es: "E aí, tudo bem? Como vão as coisas?", en: "Hey, all good? How are things?" }
        a: { es: "Vou levando, com a correria da alta temporada.", en: "Getting by, with the high-season rush." }
        alt: ["Vou levando.", "Vamos levando."]
        grammar: [g.periphrases-aspect]
        vocab: [w.ir-levando]
      - q: { es: "Você vive só do kitesurf?", en: "Do you live off kitesurfing alone?" }
        a: { es: "Não, eu me viro: dou aula, faço bico de garçom e alugo um quarto.", en: "No, I get by: I give lessons, do odd jobs as a waiter and rent out a room." }
        alt: ["Não, faço uns bicos.", "Não, eu me viro como posso."]
        grammar: [g.present-regular-ar]
        vocab: [w.se-virar, w.bico, w.kitesurf]
      - q: { es: "Por que você anda tão cansado?", en: "Why have you been so tired lately?" }
        a: { es: "Ando dormindo mal por causa do barulho do vento.", en: "I've been sleeping badly because of the noise of the wind." }
        alt: ["Ando dormindo mal.", "Por causa do vento, ando dormindo mal."]
        grammar: [g.periphrases-aspect]
        vocab: []
      - q: { es: "Como foi a trilha até a Pedra Furada?", en: "How was the walk to the Pedra Furada?" }
        a: { es: "Linda, mas cheguei pingando de suor.", en: "Beautiful, but I arrived dripping with sweat." }
        alt: ["Linda, mas muito quente.", "Cansativa, mas valeu a pena."]
        grammar: [g.periphrases-aspect]
        vocab: [w.suor]
      - q: { es: "E o seu colega de quarto?", en: "And your roommate?" }
        a: { es: "É meio folgado: anda deixando a louça toda para mim.", en: "He's a bit of a slacker: lately he's been leaving all the washing-up to me." }
        alt: ["É folgado.", "Anda deixando tudo para mim."]
        grammar: [g.periphrases-aspect]
        vocab: [w.folgado]
      - q: { es: "Atualmente, você vive só do turismo?", en: "Do you currently live off tourism alone?" }
        a: { es: "Vivo, mas no mercado informal, sem carteira assinada.", en: "I do, but in the informal economy, without a formal contract." }
        alt: ["Vivo, sim.", "Não, faço outros bicos também."]
        grammar: [g.present-regular-er-ir]
        vocab: [w.atualmente, w.informal]
    texts:
      - title: "Mensagem para a mãe"
        es: ["Oi, mãe! Por aqui vou levando.", "Ando trabalhando muito na pousada, mas venho juntando um dinheirinho.", "No fim do ano, quero ir te visitar."]
        en: ["Hi, Mum! I'm getting by here.", "I've been working a lot at the guesthouse, but I've been putting a bit of money aside.", "At the end of the year, I want to come and visit you."]
        grammar: [g.periphrases-aspect]
        vocab: [w.juntar, w.ir-levando]
      - title: "Como Jeri mudou"
        es: ["Anteriormente, Jeri era uma vila de pescadores.", "Com o tempo, foram chegando os turistas e as pousadas.", "Hoje em dia, quase todo mundo vive do turismo."]
        en: ["In the past, Jeri was a fishing village.", "Over time, the tourists and guesthouses gradually arrived.", "Today, almost everyone lives off tourism."]
        grammar: [g.periphrases-aspect, g.imperfect]
        vocab: [w.anteriormente, w.vila, w.hoje-em-dia]
    spicy:
      - { es: "Vim só ver o pôr do sol e acabei vendo você.", en: "I only came to see the sunset and ended up seeing you.", altEs: ["Eu vim só ver o pôr do sol e acabei vendo você."], grammar: [g.periphrases-aspect], vocab: [w.pôr-do-sol] }
      - { es: "Ando pensando em você mais do que no vento.", en: "Lately I've been thinking about you more than about the wind.", altEs: ["Ultimamente ando pensando mais em você do que no vento."], grammar: [g.periphrases-aspect], vocab: [w.vento] }
      - { es: "Quando você apareceu na duna, meu instrutor saiu correndo e eu fiquei.", en: "When you appeared on the dune, my instructor ran off and I stayed.", grammar: [g.periphrases-aspect], vocab: [w.duna, w.instrutor] }
      - { es: "A gente foi se conhecendo devagar… e acabou dividindo a mesma rede.", en: "We got to know each other slowly… and ended up sharing the same hammock.", grammar: [g.periphrases-aspect, g.a-gente], vocab: [w.rede] }
      - { es: "Venho treinando esse sorriso há semanas, só para você.", en: "I've been practising this smile for weeks, just for you.", altEs: ["Há semanas venho treinando esse sorriso só pra você."], grammar: [g.periphrases-aspect, g.ha-faz-time], vocab: [] }
  - id: b2.u08.l2
    title: "Há de dar certo"
    teach: [g.periphrases-modal]
    vocab: [w.haver-de, w.pôr-se-a, w.dar-conta, w.estar-a-fim-de, w.dar-se-bem, w.dar-se-mal, w.sentir-falta, w.estar-prestes-a, w.jardineira, w.estar-para, w.tornar-a, w.vir-a, w.prancha]
    tip: "haver de = surely will (há de dar certo); chegar a = even, went so far as; estar para / estar prestes a = about to; estar por = still to be done; tornar a = again; pôr-se a = start to."
    sentences:
      - { es: "Calma, tudo há de dar certo.", en: "Don't worry, it's all bound to work out.", altEs: ["Calma, vai dar tudo certo.", "Fica calmo, tudo há de dar certo."], grammar: [g.periphrases-modal], vocab: [w.haver-de] }
      - { es: "Um dia hei de morar numa casinha de frente para o mar.", en: "One day I shall live in a little house facing the sea.", altEs: ["Um dia eu hei de morar numa casinha de frente pro mar."], grammar: [g.periphrases-modal], vocab: [w.haver-de, w.casinha] }
      - { es: "O barco está prestes a sair: corre!", en: "The boat is about to leave: run!", altEs: ["O barco está para sair: corre!", "O barco está quase saindo: corre!"], grammar: [g.periphrases-modal, g.imperative-informal], vocab: [w.estar-prestes-a] }
      - { es: "A jardineira para Jijoca está para partir.", en: "The open-air truck to Jijoca is about to leave.", altEs: ["A jardineira para Jijoca está prestes a partir."], grammar: [g.periphrases-modal], vocab: [w.estar-para, w.jardineira], note: "Jardineira: the open-sided 4x4 trucks that take visitors across the sand from Jijoca to Jericoacoara." }
      - { es: "Cheguei a pensar em desistir do curso, mas continuei.", en: "I even thought about giving up the course, but I kept going.", altEs: ["Eu cheguei a pensar em desistir do curso, mas continuei."], grammar: [g.periphrases-modal], vocab: [w.desistir] }
      - { es: "Muita coisa ainda está por fazer na pousada.", en: "A lot still remains to be done at the guesthouse.", altEs: ["Ainda tem muita coisa por fazer na pousada."], grammar: [g.periphrases-modal], vocab: [w.pousada], error: { wrong: "Muita coisa ainda está para fazer na pousada.", explain: "estar por = still to be done; estar para = about to happen.", grammar: g.periphrases-modal } }
      - { es: "Quando viu a conta, ela se pôs a rir.", en: "When she saw the bill, she started laughing.", altEs: ["Quando ela viu a conta, se pôs a rir.", "Quando viu a conta, ela começou a rir."], grammar: [g.periphrases-modal], vocab: [w.pôr-se-a] }
      - { es: "Depois de dez anos, ele tornou a visitar a Pedra Furada.", en: "After ten years, he visited the Pedra Furada again.", altEs: ["Depois de dez anos, ele voltou a visitar a Pedra Furada."], grammar: [g.periphrases-modal], vocab: [w.tornar-a] }
      - { es: "O escritor veio a ser reconhecido só depois de morto.", en: "The writer only came to be recognised after his death.", grammar: [g.periphrases-aspect, g.passive-advanced], vocab: [w.vir-a] }
      - { es: "Não sei se vou dar conta de tanto trabalho.", en: "I don't know if I'll be able to cope with so much work.", altEs: ["Não sei se eu vou dar conta de tanto trabalho."], grammar: [g.periphrases-modal], vocab: [w.dar-conta] }
      - { es: "Consegui um lugar no último buggy para a Lagoa do Paraíso.", en: "I managed to get a seat on the last buggy to the Lagoa do Paraíso.", altEs: ["Eu consegui um lugar no último buggy para a Lagoa do Paraíso."], grammar: [g.periphrases-modal], vocab: [w.conseguir, w.lagoa] }
      - { es: "Você está a fim de subir a duna comigo amanhã cedo?", en: "Do you fancy climbing the dune with me early tomorrow?", altEs: ["Tá a fim de subir a duna comigo amanhã cedo?"], grammar: [g.periphrases-modal], vocab: [w.estar-a-fim-de, w.duna] }
      - { es: "Ele se deu bem no kitesurf, mas se deu mal no windsurf.", en: "He did well at kitesurfing, but badly at windsurfing.", grammar: [g.reflexive-verbs-present], vocab: [w.dar-se-bem, w.dar-se-mal, w.kitesurf] }
      - { es: "Quando eu voltar para casa, vou sentir falta deste vento.", en: "When I go back home, I'll miss this wind.", altEs: ["Quando eu voltar pra casa, vou sentir falta desse vento."], grammar: [g.future-subjunctive-time], vocab: [w.sentir-falta, w.vento] }
      - { es: "Tenho de devolver a prancha hoje.", en: "I have to give the board back today.", altEs: ["Tenho que devolver a prancha hoje.", "Preciso devolver a prancha hoje."], grammar: [g.ter-que, g.periphrases-modal], vocab: [w.prancha], transform: { instruction: "Say it's bound to happen (haver de)", answer: "Hei de devolver a prancha hoje.", alt: ["Eu hei de devolver a prancha hoje."] } }
      - { es: "Ninguém conseguiu dormir com o barulho da festa.", en: "Nobody managed to sleep with the noise of the party.", grammar: [g.periphrases-modal, g.indefinite-pronouns], vocab: [w.conseguir, w.barulho], transform: { instruction: "Change to eu (I couldn't sleep)", answer: "Eu não consegui dormir com o barulho da festa.", alt: ["Não consegui dormir com o barulho da festa."] } }
    exchanges:
      - q: { es: "Será que vai ventar amanhã?", en: "Do you think it'll be windy tomorrow?" }
        a: { es: "Há de ventar; aqui o vento nunca falha nessa época.", en: "It's bound to be; the wind never fails here at this time of year." }
        alt: ["Há de ventar.", "Deve ventar, sim."]
        grammar: [g.periphrases-modal]
        vocab: [w.haver-de, w.vento]
      - q: { es: "O ônibus já saiu?", en: "Has the bus left yet?" }
        a: { es: "Ainda não, mas está prestes a sair.", en: "Not yet, but it's about to leave." }
        alt: ["Está para sair.", "Ainda não, mas está quase saindo."]
        grammar: [g.periphrases-modal]
        vocab: [w.estar-prestes-a]
      - q: { es: "Você chegou a ver a Pedra Furada?", en: "Did you actually get to see the Pedra Furada?" }
        a: { es: "Cheguei, mas a maré estava alta e não deu para passar por baixo.", en: "I did, but the tide was high and I couldn't go under it." }
        alt: ["Cheguei, sim.", "Não cheguei a ver."]
        grammar: [g.periphrases-modal]
        vocab: [w.maré]
      - q: { es: "Você está dando conta de tudo sozinha?", en: "Are you coping with everything on your own?" }
        a: { es: "Mais ou menos; a cozinha ainda está por arrumar.", en: "More or less; the kitchen still needs tidying." }
        alt: ["Mais ou menos.", "Não estou dando conta, não."]
        grammar: [g.periphrases-modal]
        vocab: [w.dar-conta]
      - q: { es: "Vamos tentar de novo amanhã?", en: "Shall we try again tomorrow?" }
        a: { es: "Vamos. Se a gente tornar a cair, pelo menos a água está quente.", en: "Let's. If we fall again, at least the water's warm." }
        alt: ["Vamos, sim.", "Amanhã a gente tenta de novo."]
        grammar: [g.periphrases-modal, g.future-subjunctive-se]
        vocab: [w.tornar-a]
    texts:
      - title: "Recado no quadro da pousada"
        es: ["A jardineira para Jijoca está para sair às 14h.", "Quem estiver a fim de ir à lagoa, avise na recepção.", "Os quartos 3 e 5 ainda estão por arrumar."]
        en: ["The truck to Jijoca is due to leave at 2 p.m.", "Anyone who fancies going to the lagoon, let reception know.", "Rooms 3 and 5 still need to be made up."]
        grammar: [g.periphrases-modal]
        vocab: [w.jardineira, w.estar-para, w.estar-a-fim-de]
    spicy:
      - { es: "Hei de aprender kitesurf, nem que seja só para impressionar você.", en: "I shall learn to kitesurf, even if it's only to impress you.", altEs: ["Eu hei de aprender kitesurf, nem que seja só pra impressionar você."], grammar: [g.periphrases-modal], vocab: [w.haver-de, w.kitesurf] }
      - { es: "Cheguei a ensaiar o que ia te dizer, mas esqueci tudo quando você sorriu.", en: "I even rehearsed what I was going to say to you, but I forgot everything when you smiled.", grammar: [g.periphrases-modal], vocab: [] }
      - { es: "Estou prestes a fazer um convite. Finja surpresa.", en: "I'm about to ask you out. Act surprised.", grammar: [g.periphrases-modal, g.imperative-formal], vocab: [w.estar-prestes-a] }
      - { es: "Tô a fim de você e do seu açaí, nessa ordem.", en: "I fancy you and your açaí, in that order.", altEs: ["Estou a fim de você e do seu açaí, nessa ordem."], grammar: [g.periphrases-modal, g.spoken-reductions], vocab: [w.estar-a-fim-de] }
      - { es: "Se eu tornar a cair da prancha, você me salva?", en: "If I fall off the board again, will you rescue me?", grammar: [g.periphrases-modal, g.future-subjunctive-se], vocab: [w.tornar-a, w.prancha] }
  - id: b2.u08.l3
    title: "Até lá, terei terminado"
    teach: [g.future-perfect]
    vocab: [w.até-lá, w.a-essa-altura, w.desempenho, w.gerir, w.sobrecarregado, w.finalizar, w.cumprir, w.conclusão, w.gestão, w.empenho, w.iniciativa, w.sobrecarga, w.exausto, w.esgotamento, w.jornada, w.expediente, w.produtividade, w.carga-horária, w.produtivo, w.acumular, w.posteriormente, w.desempenhar, w.eficiência, w.constantemente, w.eventualmente, w.aturar, w.adiantar, w.encarar]
    tip: "terei / terá / teremos / terão + participle = will have done. In speech: vou ter terminado. It also guesses about the past: Ele já terá saído (he'll have left by now)."
    sentences:
      - { es: "Até o fim da temporada, terei pagado todas as minhas dívidas.", en: "By the end of the season, I'll have paid off all my debts.", altEs: ["Até o fim da temporada, vou ter pagado todas as minhas dívidas.", "Até o fim da temporada, terei pago todas as minhas dívidas."], grammar: [g.future-perfect], vocab: [w.dívida, w.temporada] }
      - { es: "Quando você chegar, eu já terei finalizado o relatório.", en: "When you arrive, I'll already have finished the report.", altEs: ["Quando você chegar, eu já vou ter finalizado o relatório."], grammar: [g.future-perfect, g.future-subjunctive-time], vocab: [w.finalizar, w.relatório], error: { wrong: "Quando você terá chegado, eu já terei finalizado o relatório.", explain: "After quando use the future subjunctive (chegar / tiver chegado), never terei / terá.", grammar: g.future-perfect } }
      - { es: "Às oito, a gente já vai ter jantado.", en: "By eight, we'll already have had dinner.", altEs: ["Às oito, nós já teremos jantado.", "Às oito a gente já vai ter jantado."], grammar: [g.future-perfect, g.a-gente], vocab: [], transform: { instruction: "Rewrite in formal written style with nós", answer: "Às oito, nós já teremos jantado.", alt: ["Às oito já teremos jantado."] } }
      - { es: "Até lá, a obra da recepção terá sido concluída.", en: "By then, the work on the reception will have been completed.", altEs: ["Até lá, a obra da recepção vai ter sido concluída."], grammar: [g.future-perfect, g.passive-advanced], vocab: [w.até-lá, w.obra] }
      - { es: "A essa altura, ela já terá chegado a Fortaleza.", en: "By now, she'll have reached Fortaleza.", altEs: ["A essa altura, ela já deve ter chegado a Fortaleza."], grammar: [g.future-perfect], vocab: [w.a-essa-altura] }
      - { es: "O que terá acontecido com o guia? Ele nunca se atrasa.", en: "What can have happened to the guide? He's never late.", altEs: ["O que será que aconteceu com o guia? Ele nunca se atrasa."], grammar: [g.future-perfect, g.sera-que], vocab: [w.guia] }
      - { es: "Em junho, terei morado aqui dez anos.", en: "In June, I'll have lived here for ten years.", altEs: ["Em junho, vou ter morado aqui dez anos.", "Em junho, fará dez anos que moro aqui."], grammar: [g.future-perfect], vocab: [], transform: { instruction: "Change to nós", answer: "Em junho, teremos morado aqui dez anos.", alt: ["Em junho, a gente vai ter morado aqui dez anos."] } }
      - { es: "Se não cumprirmos o prazo, o cliente terá desistido do contrato.", en: "If we don't meet the deadline, the client will have pulled out of the contract.", grammar: [g.future-perfect, g.future-subjunctive-se], vocab: [w.cumprir, w.prazo, w.contrato] }
      - { es: "A conclusão do projeto foi adiada por falta de gestão.", en: "The completion of the project was postponed because of poor management.", altEs: ["A conclusão do projeto foi adiada por falta de uma boa gestão."], grammar: [g.nominalization, g.passive-advanced], vocab: [w.conclusão, w.gestão] }
      - { es: "Ele trabalha com empenho e tem muita iniciativa.", en: "He works with dedication and shows a lot of initiative.", grammar: [g.present-regular-ar], vocab: [w.empenho, w.iniciativa] }
      - { es: "Com tanta sobrecarga, ela anda exausta e à beira de um esgotamento.", en: "With so much overload, she has been exhausted lately and on the verge of burnout.", grammar: [g.periphrases-aspect], vocab: [w.sobrecarga, w.exausto, w.esgotamento] }
      - { es: "Na alta temporada a jornada é de doze horas, e o expediente só acaba à meia-noite.", en: "In high season the working day is twelve hours, and the shift only ends at midnight.", grammar: [g.present-regular-ar], vocab: [w.jornada, w.expediente] }
      - { es: "Reduzir a carga horária nem sempre diminui a produtividade.", en: "Reducing working hours doesn't always lower productivity.", grammar: [g.present-regular-er-ir], vocab: [w.carga-horária, w.produtividade] }
      - { es: "Quem gere bem o tempo é mais produtivo e acumula menos tarefas.", en: "Whoever manages their time well is more productive and builds up fewer tasks.", grammar: [g.relative-que-quem], vocab: [w.gerir, w.produtivo, w.acumular] }
      - { es: "O desempenho da equipe será avaliado posteriormente.", en: "The team's performance will be assessed later.", altEs: ["O desempenho da equipe vai ser avaliado depois."], grammar: [g.passive-advanced], vocab: [w.desempenho, w.posteriormente], variant: "Portugal: o desempenho da equipa." }
      - { es: "Ela desempenha a função de gerente com muita eficiência.", en: "She performs the role of manager very efficiently.", grammar: [g.present-regular-ar], vocab: [w.desempenhar, w.eficiência] }
    exchanges:
      - q: { es: "Você vai ter terminado o curso até dezembro?", en: "Will you have finished the course by December?" }
        a: { es: "Até lá, já terei feito todas as provas.", en: "By then, I'll have taken all the exams." }
        alt: ["Vou ter terminado, sim.", "Até lá, já vou ter feito todas as provas."]
        grammar: [g.future-perfect]
        vocab: [w.até-lá]
      - q: { es: "Onde estará o Rafa? Ele marcou às sete.", en: "Where can Rafa be? He said seven o'clock." }
        a: { es: "Ele terá perdido a jardineira de Jijoca.", en: "He'll have missed the truck from Jijoca." }
        alt: ["Deve ter perdido a jardineira.", "Vai ver perdeu a jardineira."]
        grammar: [g.future-perfect]
        vocab: [w.jardineira]
      - q: { es: "Por que você está tão exausta?", en: "Why are you so exhausted?" }
        a: { es: "A jornada é longa e o gerente muda o expediente constantemente.", en: "The working day is long and the manager keeps changing the shifts." }
        alt: ["Trabalhei doze horas hoje.", "Por causa da sobrecarga de trabalho."]
        grammar: [g.present-regular-ar]
        vocab: [w.jornada, w.expediente, w.exausto, w.constantemente]
      - q: { es: "Você trabalha aos domingos?", en: "Do you work on Sundays?" }
        a: { es: "Eventualmente, quando a pousada está lotada.", en: "Occasionally, when the guesthouse is full." }
        alt: ["Só eventualmente.", "Às vezes."]
        grammar: [g.frequency-adverbs]
        vocab: [w.eventualmente]
      - q: { es: "Como você atura esse chefe?", en: "How do you put up with that boss?" }
        a: { es: "Não adianta reclamar; eu encaro um dia de cada vez.", en: "There's no point complaining; I face it one day at a time." }
        alt: ["Não adianta reclamar.", "Um dia de cada vez."]
        grammar: [g.present-regular-ar]
        vocab: [w.aturar, w.adiantar, w.encarar]
      - q: { es: "Quando o relatório fica pronto?", en: "When will the report be ready?" }
        a: { es: "Amanhã a essa hora já vou ter enviado.", en: "By this time tomorrow I'll have sent it." }
        alt: ["Amanhã já terei enviado.", "Amanhã de manhã."]
        grammar: [g.future-perfect, g.null-object]
        vocab: []
    texts:
      - title: "E-mail para a gerente"
        es: ["Prezada Cláudia, até sexta terei finalizado o relatório de desempenho.", "Até lá, os dados de produtividade terão sido revisados.", "Atenciosamente, Rafael."]
        en: ["Dear Cláudia, by Friday I will have finished the performance report.", "By then, the productivity data will have been revised.", "Kind regards, Rafael."]
        grammar: [g.future-perfect, g.formal-email]
        vocab: [w.finalizar, w.produtividade, w.até-lá]
      - title: "Plano para o ano"
        es: ["Em dezembro, terei juntado dinheiro suficiente.", "Em março, a reforma da pousada terá terminado.", "E em julho, com o vento, terei aberto as portas."]
        en: ["In December, I'll have saved enough money.", "In March, the renovation of the guesthouse will have finished.", "And in July, with the wind, I'll have opened the doors."]
        grammar: [g.future-perfect]
        vocab: [w.juntar]
    spicy:
      - { es: "Até o fim da noite, você terá aprendido o meu nome e o meu passo de forró.", en: "By the end of the night, you'll have learnt my name and my forró step.", grammar: [g.future-perfect], vocab: [w.forró] }
      - { es: "A essa altura, minha mãe já terá contado para a família toda que eu tenho um encontro.", en: "By now, my mother will have told the whole family that I have a date.", altEs: ["A essa altura, a minha mãe já vai ter contado pra família toda que eu tenho um encontro."], grammar: [g.future-perfect], vocab: [w.a-essa-altura] }
      - { es: "Quando você ler esta mensagem, eu já terei mudado de ideia… ou não.", en: "When you read this message, I'll already have changed my mind… or not.", grammar: [g.future-perfect, g.future-subjunctive-time], vocab: [] }
      - { es: "Ando sobrecarregado, mas para um café com você sempre há tempo.", en: "I've been overloaded lately, but there's always time for a coffee with you.", altEs: ["Ando sobrecarregada, mas pra um café com você sempre tem tempo."], grammar: [g.periphrases-aspect], vocab: [w.sobrecarregado] }
      - { es: "Amanhã a essa hora, a gente já vai ter dançado três xotes e um baião.", en: "By this time tomorrow, we'll have danced three xotes and a baião.", grammar: [g.future-perfect, g.a-gente], vocab: [w.xote, w.baião] }
  - id: b2.u08.l4
    title: "Vou dar um jeito"
    teach: [g.periphrases-modal, g.periphrases-aspect]
    vocab: [w.dar-um-jeito, w.quebrar-o-galho, w.empurrar-com-a-barriga, w.ficar-de, w.dar-uma-mão, w.ter-jeito-para, w.deixar-pra-lá, w.cair-a-ficha, w.pegar-mal, w.pegar-bem, w.fazer-questão, w.fazer-de-conta, w.levar-a-sério, w.levar-em-conta, w.não-ter-nada-a-ver, w.dar-bola, w.aproveitar-se, w.tomada, w.torneira, w.cano, w.enrolar, w.parafuso, w.chave-de-fenda, w.martelo, w.prego, w.furadeira, w.fita-adesiva, w.fio, w.interruptor, w.lâmpada, w.pincel, w.tinta, w.ferramenta, w.atrapalhar]
    tip: "Brazilians always 'dar um jeito' (find a way). Quebrar o galho = help out or make do; empurrar com a barriga = put things off; ficar de = to say you'll do something."
    sentences:
      - { es: "A torneira do banheiro anda pingando; vou dar um jeito nisso hoje.", en: "The bathroom tap has been dripping lately; I'll sort it out today.", altEs: ["A torneira do banheiro está pingando; vou dar um jeito nisso hoje."], grammar: [g.periphrases-aspect, g.ir-infinitive], vocab: [w.torneira, w.dar-um-jeito] }
      - { es: "O dono ficou de mandar alguém para consertar o cano, mas está enrolando.", en: "The owner said he'd send someone to fix the pipe, but he's stalling.", altEs: ["O dono ficou de mandar alguém pra consertar o cano, mas está enrolando."], grammar: [g.periphrases-modal, g.estar-gerund], vocab: [w.ficar-de, w.cano, w.enrolar, w.consertar] }
      - { es: "Você tem uma chave de fenda? Só preciso apertar um parafuso.", en: "Have you got a screwdriver? I just need to tighten a screw.", altEs: ["Tem uma chave de fenda? Só preciso apertar um parafuso."], grammar: [g.precisar-de], vocab: [w.chave-de-fenda, w.parafuso], variant: "Portugal: uma chave de fendas." }
      - { es: "Me empresta o martelo e uns pregos? Quero pendurar esse quadro.", en: "Can you lend me the hammer and some nails? I want to hang this picture.", altEs: ["Você me empresta o martelo e uns pregos? Quero pendurar esse quadro.", "Empresta-me o martelo e uns pregos? Quero pendurar este quadro."], grammar: [g.pronoun-placement-brazil, g.polite-requests], vocab: [w.martelo, w.prego] }
      - { es: "A furadeira está para acabar a bateria.", en: "The drill's battery is about to run out.", altEs: ["A bateria da furadeira está prestes a acabar."], grammar: [g.periphrases-modal], vocab: [w.furadeira, w.estar-para] }
      - { es: "A fita adesiva quebra o galho até a gente comprar uma tomada nova.", en: "The tape will do the job until we buy a new socket.", altEs: ["A fita adesiva quebra o galho até nós comprarmos uma tomada nova."], grammar: [g.personal-infinitive-uses], vocab: [w.fita-adesiva, w.quebrar-o-galho, w.tomada], variant: "Portugal: a fita-cola." }
      - { es: "Não mexa nesse fio antes de desligar o interruptor!", en: "Don't touch that wire before you turn off the switch!", altEs: ["Não mexe nesse fio antes de desligar o interruptor!"], grammar: [g.imperative-negative], vocab: [w.fio, w.interruptor] }
      - { es: "Troquei a lâmpada e tornei a ligar a luz: funcionou!", en: "I changed the bulb and switched the light on again: it worked!", altEs: ["Troquei a lâmpada e voltei a ligar a luz: funcionou!"], grammar: [g.periphrases-modal, g.preterite-regular], vocab: [w.lâmpada, w.tornar-a] }
      - { es: "Ela tem jeito para pintar; eu só sujo o pincel e a parede de tinta.", en: "She has a knack for painting; I just get paint on the brush and the wall.", grammar: [g.present-regular-ar], vocab: [w.ter-jeito-para, w.pincel, w.tinta] }
      - { es: "Pode deixar que eu te dou uma mão com as ferramentas.", en: "Leave it to me, I'll give you a hand with the tools.", altEs: ["Pode deixar, eu te dou uma mão com as ferramentas."], grammar: [g.pronoun-placement-brazil], vocab: [w.dar-uma-mão, w.ferramenta] }
      - { es: "Você está empurrando o conserto com a barriga há meses.", en: "You've been putting off the repair for months.", altEs: ["Há meses você está empurrando o conserto com a barriga."], grammar: [g.estar-gerund, g.ha-faz-time], vocab: [w.empurrar-com-a-barriga], transform: { instruction: "Change to vocês", answer: "Vocês estão empurrando o conserto com a barriga há meses.", alt: ["Há meses vocês estão empurrando o conserto com a barriga."] } }
      - { es: "Só caiu a ficha quando vi a conta de água: o cano estava vazando.", en: "The penny only dropped when I saw the water bill: the pipe was leaking.", grammar: [g.preterite-vs-imperfect], vocab: [w.cair-a-ficha, w.cano] }
      - { es: "Pega mal chegar atrasado no primeiro dia de trabalho.", en: "It looks bad to arrive late on your first day at work.", altEs: ["Pega muito mal chegar atrasado no primeiro dia de trabalho."], grammar: [g.subjunctive-vs-infinitive], vocab: [w.pegar-mal], transform: { instruction: "Say the opposite (it looks good to arrive early)", answer: "Pega bem chegar cedo no primeiro dia de trabalho." } }
      - { es: "O dono faz questão de levar a sério cada reclamação dos clientes.", en: "The owner makes a point of taking every customer complaint seriously.", grammar: [g.present-regular-er-ir], vocab: [w.fazer-questão, w.levar-a-sério] }
      - { es: "Leve em conta que o vento atrapalha qualquer conserto no telhado.", en: "Bear in mind that the wind gets in the way of any repair on the roof.", altEs: ["Leva em conta que o vento atrapalha qualquer conserto no telhado."], grammar: [g.imperative-formal], vocab: [w.levar-em-conta, w.atrapalhar, w.telhado] }
      - { es: "Isso não tem nada a ver com a instalação; o problema é a tomada.", en: "This has nothing to do with the wiring; the problem is the socket.", grammar: [g.negation], vocab: [w.não-ter-nada-a-ver, w.tomada], error: { wrong: "Isso não tem nada que ver com a instalação; o problema é a tomada.", explain: "Brazilian Portuguese says ter a ver com (ter que ver is European and old-fashioned in Brazil).", grammar: g.periphrases-modal } }
    exchanges:
      - q: { es: "O chuveiro quebrou de novo. E agora?", en: "The shower's broken again. What now?" }
        a: { es: "Calma, eu dou um jeito. Me passa a chave de fenda?", en: "Relax, I'll sort it out. Can you pass me the screwdriver?" }
        alt: ["Eu dou um jeito.", "Vou chamar alguém para consertar."]
        grammar: [g.periphrases-modal, g.pronoun-placement-brazil]
        vocab: [w.dar-um-jeito, w.chave-de-fenda]
      - q: { es: "Você pode me dar uma mão com a pintura?", en: "Can you give me a hand with the painting?" }
        a: { es: "Posso, mas não tenho muito jeito para isso.", en: "I can, but I'm not much good at it." }
        alt: ["Claro, cadê o pincel?", "Posso, sim."]
        grammar: [g.poder-present]
        vocab: [w.dar-uma-mão, w.ter-jeito-para]
      - q: { es: "O dono já mandou o eletricista?", en: "Has the owner sent the electrician yet?" }
        a: { es: "Ficou de mandar, mas está enrolando há uma semana.", en: "He said he would, but he's been stalling for a week." }
        alt: ["Ainda não.", "Ficou de mandar amanhã."]
        grammar: [g.periphrases-modal]
        vocab: [w.ficar-de, w.enrolar]
      - q: { es: "Ela não me deu bola na festa. Pego o telefone dela?", en: "She didn't pay me any attention at the party. Shall I get her number?" }
        a: { es: "Deixa pra lá e faz de conta que não liga: pega bem.", en: "Let it go and pretend you don't care: it goes down well." }
        alt: ["Deixa pra lá.", "Não leva tão a sério."]
        grammar: [g.imperative-informal]
        vocab: [w.dar-bola, w.deixar-pra-lá, w.fazer-de-conta, w.pegar-bem]
      - q: { es: "Por que você não reclamou do barulho?", en: "Why didn't you complain about the noise?" }
        a: { es: "Não quis me aproveitar da situação; eles já tinham pedido desculpas.", en: "I didn't want to take advantage of the situation; they'd already apologised." }
        alt: ["Deixei pra lá.", "Não quis criar confusão."]
        grammar: [g.pluperfect]
        vocab: [w.aproveitar-se]
    texts:
      - title: "Lista do faz-tudo"
        es: ["Trocar a lâmpada da varanda.", "Consertar a torneira da cozinha.", "Pintar o portão: comprar tinta e um pincel novo."]
        en: ["Change the porch light bulb.", "Fix the kitchen tap.", "Paint the gate: buy paint and a new brush."]
        grammar: [g.ir-infinitive]
        vocab: [w.lâmpada, w.torneira, w.tinta, w.pincel]
      - title: "Bilhete para o vizinho"
        es: ["Oi, Seu Zé! Você me empresta a furadeira até amanhã?", "Prometo devolver com a bateria cheia.", "Se precisar de uma mão com o telhado, pode contar comigo."]
        en: ["Hi, Mr Zé! Could you lend me the drill until tomorrow?", "I promise to give it back fully charged.", "If you need a hand with the roof, you can count on me."]
        grammar: [g.polite-requests, g.future-subjunctive-se]
        vocab: [w.furadeira]
    spicy:
      - { es: "Não tenho jeito para consertar nada, mas tenho muito jeito para te fazer rir.", en: "I'm hopeless at fixing things, but I'm very good at making you laugh.", grammar: [g.present-regular-er-ir], vocab: [w.ter-jeito-para] }
      - { es: "Você fica fazendo de conta que não me dá bola, mas eu vi o seu sorriso.", en: "You keep pretending you're not interested in me, but I saw your smile.", grammar: [g.periphrases-aspect], vocab: [w.fazer-de-conta, w.dar-bola] }
      - { es: "Faço questão de pagar o jantar; a sobremesa fica por sua conta.", en: "I insist on paying for dinner; dessert is on you.", grammar: [g.present-irregular-first-person], vocab: [w.fazer-questão] }
      - { es: "Vem cá, me dá uma mão… com essa lâmpada, claro.", en: "Come here, give me a hand… with this light bulb, of course.", grammar: [g.imperative-informal], vocab: [w.dar-uma-mão, w.lâmpada] }
      - { es: "Você está empurrando esse convite com a barriga há três semanas.", en: "You've been putting off asking me out for three weeks.", grammar: [g.estar-gerund], vocab: [w.empurrar-com-a-barriga] }
dialogues:
  - id: b2.u08.d1
    title: "No fim da tarde, na duna"
    context: "Marina runs a small guesthouse in Jericoacoara. On Sunset Dune she bumps into Rafael, an old friend from Fortaleza who has come for the weekend."
    lines:
      - { speaker: "Rafael", es: "Marina! Quanto tempo! E aí, como vai a vida em Jeri?", en: "Marina! Long time no see! So, how's life in Jeri?" }
      - { speaker: "Marina", es: "Vou levando. A pousada vem crescendo, mas é uma correria.", en: "Getting by. The guesthouse has been growing, but it's a mad rush." }
      - { speaker: "Rafael", es: "Você chegou a pensar em voltar para Fortaleza?", en: "Did you ever think of going back to Fortaleza?" }
      - { speaker: "Marina", es: "Cheguei, no primeiro ano. Mas fui me acostumando e acabei ficando.", en: "I did, in the first year. But I gradually got used to it and ended up staying." }
      - { speaker: "Rafael", es: "E a reforma que você estava planejando?", en: "And the renovation you were planning?" }
      - { speaker: "Marina", es: "Ainda está por fazer. Até julho, espero ter juntado dinheiro suficiente.", en: "It's still to be done. By July, I hope to have saved enough money." }
      - { speaker: "Rafael", es: "Se precisar, eu te dou uma mão. Tenho jeito para pintura.", en: "If you need it, I'll give you a hand. I'm good at painting." }
      - { speaker: "Marina", es: "Vou te cobrar, hein! Olha, o sol está prestes a se pôr.", en: "I'll hold you to that! Look, the sun is about to set." }
      - { speaker: "Rafael", es: "Que lindo… Amanhã a essa hora eu já terei voltado para o escritório.", en: "How beautiful… By this time tomorrow I'll already be back at the office." }
      - { speaker: "Marina", es: "Deixa pra lá o escritório. Um dia você há de se mudar para cá também.", en: "Forget the office. One day you're bound to move here too." }
    questions:
      - { q: "Como está a vida da Marina em Jeri?", options: ["Muito tranquila, sem trabalho", "Corrida, mas ela vai levando", "Ruim: ela quer voltar"], answer: 1, explain: "Vou levando… é uma correria: she's getting by, and it's busy." }
      - { q: "A Marina chegou a pensar em voltar para Fortaleza?", options: ["Sim, no primeiro ano", "Nunca", "Sim, está voltando agora"], answer: 0, explain: "Cheguei, no primeiro ano: she did think about it, then got used to life there." }
      - { q: "O que a Marina espera ter feito até julho?", options: ["Ter vendido a pousada", "Ter juntado dinheiro para a reforma", "Ter aprendido kitesurf"], answer: 1, explain: "Até julho, espero ter juntado dinheiro suficiente for the renovation." }
      - { q: "Como o Rafael pode ajudar?", options: ["Emprestando dinheiro", "Pintando a pousada", "Cuidando da recepção"], answer: 1, explain: "Tenho jeito para pintura: he offers to help with the painting." }
writing:
  - task: "A friend asks how life is going in Jericoacoara. Describe how you are getting by, using aspect periphrases (vou levando, a gente vai se virando, ando trabalhando…)."
    es: "E aí, como está a vida em Jeri?"
    min: 80
    max: 140
    use: [w.se-virar, w.ir-levando, w.bico, w.renda-extra, w.ralar]
    useAtLeast: 3
    grammar: [g.periphrases-aspect]
    expect:
      - { pattern: '(?<!\p{L})(vou|vai|vamos|v[aã]o|ando|anda|andamos|est(ou|á|amos|ão)) (me |se |nos )?[a-zà-ú]+(ando|endo|indo)(?!\p{L})', hint: "Use periphrases with the gerund: vou levando, a gente vai se virando…" }
    model: { es: "Vou levando! O trabalho de instrutor de kitesurf é ótimo, mas não paga todas as contas. Por isso, faço uns bicos à noite num restaurante da vila para ter uma renda extra. A minha namorada também anda trabalhando muito: ela vende artesanato na praia. Não é fácil, a gente rala bastante, mas vai se virando. Hoje em dia, pelo menos, temos o que precisamos e ainda vemos o pôr do sol todo dia na duna! Se a gente continuar juntando dinheiro, no ano que vem vamos abrir a nossa própria escola.", en: "I'm getting by! The kitesurfing instructor job is great, but it doesn't pay all the bills. So I do some odd jobs in the evenings at a restaurant in the village to make extra money. My girlfriend has been working a lot too: she sells crafts on the beach. It isn't easy, we work really hard, but we're managing. These days, at least, we have what we need and we still watch the sunset from the dune every day! If we keep saving, next year we're going to open our own school." }
  - task: "Write an encouraging message to a friend who is about to start something difficult (Você está prestes a…, Há de dar certo, Você vai se dar bem…)."
    min: 80
    max: 140
    use: [w.haver-de, w.estar-prestes-a, w.dar-se-bem, w.dar-conta, w.sentir-falta]
    useAtLeast: 3
    grammar: [g.periphrases-modal]
    expect:
      - { pattern: '(\b(h[aá]|hei|h[aã]o) de\b|\best[aá] prestes a\b|\best[aá] para\b|\bse dar bem\b|\bd[aá] conta\b|\bvem a\b|\btorna a\b)', hint: "Use modal periphrases: Há de dar certo, está prestes a…" }
    model: { es: "Oi, Marina! Fiquei sabendo que você está prestes a começar o novo emprego em Fortaleza. Que orgulho! Sei que você está nervosa, mas você vai se dar bem, tenho certeza. Você sempre dá conta de tudo! No começo, você vai sentir falta de Jeri, da praia e dos amigos, mas há de se acostumar. Se um dia estiver a fim de conversar, me liga. Há de dar tudo certo! Lembra que, no ano passado, você também estava com medo e acabou adorando o curso? Vai ser igual!", en: "Hi, Marina! I heard you're about to start your new job in Fortaleza. I'm so proud! I know you're nervous, but you'll do well, I'm sure. You always cope with everything! At first you'll miss Jeri, the beach and your friends, but you're bound to get used to it. If you ever feel like talking, call me. It's bound to work out! Remember last year you were scared too and ended up loving the course? It'll be the same!" }
  - task: "Your manager asks how a project is going. Write a semi-formal update on what will have been done by the deadline (Até quarta, terei finalizado…, A essa altura, teremos…)."
    min: 80
    max: 140
    use: [w.até-lá, w.a-essa-altura, w.finalizar, w.cumprir, w.desempenho]
    useAtLeast: 3
    grammar: [g.future-perfect]
    expect:
      - { pattern: '\b(terei|teremos|ter[aá]|ter[aã]o) [a-zà-ú]+(ado|ido|ito|isto|eito|osto)\b', hint: "Use the future perfect: Até sexta, terei terminado…" }
    model: { es: "Prezada Senhora Lima, o projeto está andando bem. Até quarta-feira, terei finalizado o relatório de desempenho e teremos analisado todos os dados do semestre. Na quinta, a equipe já terá preparado a reunião com os clientes. Até lá, também terei conversado com o fornecedor sobre o novo contrato. A essa altura, acredito que teremos cumprido todas as etapas dentro do prazo. Na sexta, a essa altura, o projeto já terá sido entregue ao cliente. Caso haja alguma mudança, eu a aviso imediatamente. Atenciosamente, Pedro. ", en: "Dear Ms Lima, the project is going well. By Wednesday I will have finished the performance report and we will have analysed all the data for the semester. On Thursday the team will already have prepared the meeting with the clients. By then I will also have spoken to the supplier about the new contract. At that point I believe we will have completed every stage on time. On Friday, by then, the project will already have been delivered to the client. Should anything change, I will let you know immediately. Kind regards, Pedro. " }
  - task: "Something broke at home and you fixed it yourself, Brazilian style. Tell the story with colloquial expressions (dei um jeito, quebrou o galho, caiu a ficha, deixar pra lá…)."
    min: 80
    max: 140
    use: [w.dar-um-jeito, w.quebrar-o-galho, w.cair-a-ficha, w.ferramenta, w.fita-adesiva]
    useAtLeast: 3
    grammar: [g.periphrases-modal, g.periphrases-aspect]
    expect:
      - { pattern: '(d(ei|eu|ar) um jeito|quebr(ei|ou|ar|a) o galho|caiu a ficha|deixar pra l[aá]|empurrar com a barriga|fiz quest[aã]o|fazer de conta|dar uma m[aã]o|tenho jeito|ter jeito)', hint: "Use colloquial expressions: dei um jeito, quebrou o galho, caiu a ficha…" }
    model: { es: "No domingo à noite, o cano da pia da cozinha começou a soltar água. Era tarde e nenhum encanador atendia. Primeiro, tentei empurrar com a barriga e deixar pra lá, mas a água não parava. Aí caiu a ficha: eu tinha que fazer alguma coisa! Peguei as ferramentas do meu pai, mas não tenho jeito para essas coisas. No final, dei um jeito: enrolei o cano com fita adesiva e coloquei uma panela embaixo. Quebrou o galho até segunda, quando o encanador veio e consertou tudo.", en: "On Sunday night the pipe under the kitchen sink started leaking. It was late and no plumber was answering. At first I tried to put it off and forget about it, but the water wouldn't stop. Then the penny dropped: I had to do something! I got out my father's tools, but I'm hopeless at that kind of thing. In the end I found a way: I wrapped the pipe in tape and put a pan underneath. It did the trick until Monday, when the plumber came and fixed everything." }
