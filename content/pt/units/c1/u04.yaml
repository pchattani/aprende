id: c1.u04
title: "Expressões idiomáticas"
lessons:
  - id: c1.u04.l1
    title: Enfiar o pé na jaca
    teach: [g.idioms]
    vocab: [w.pulga-atrás-da-orelha, w.enfiar-o-pé-na-jaca, w.remar-contra-a-maré, w.chutar-o-balde, w.pagar-o-pato, w.ficar-de-molho, w.dar-com-a-língua-nos-dentes, w.pisar-em-ovos, w.fazer-vista-grossa, w.engolir-sapo, w.dar-o-braço-a-torcer, w.falar-pelos-cotovelos, w.pulga, w.enfiar, w.jaca, w.remar, w.remo, w.sapo, w.balde, w.molho, w.expressão-idiomática, w.sentido-figurado, w.chutar, w.engolir]
    tip: "Idioms conjugate like any verb phrase (enfiei o pé na jaca, ela fala pelos cotovelos), but the words inside them are fixed: don't swap them for synonyms."
    sentences:
      - { es: "No jantar da pousada, enfiei o pé na jaca.", en: "At dinner at the lodge, I overdid it.", altEs: ["No jantar da pousada eu enfiei o pé na jaca."], altEn: ["At dinner at the guesthouse, I went overboard."], grammar: [g.idioms], vocab: [w.enfiar-o-pé-na-jaca, w.pousada], transform: { instruction: "Say it in plain language with exagerar", answer: "No jantar da pousada, exagerei na comida.", alt: ["No jantar da pousada, comi demais.", "No jantar da pousada, exagerei."], en: "At dinner at the lodge, I ate too much." } }
      - { es: "Fiquei com a pulga atrás da orelha quando o guia disse que o passeio era “rapidinho”.", en: "I smelled a rat when the guide said the trip was 'a quick one'.", altEn: ["I got suspicious when the guide said the trip was 'quick'."], grammar: [g.idioms, g.diminutives-augmentatives], vocab: [w.pulga-atrás-da-orelha, w.guia] }
      - { es: "Remar contra a correnteza cansa; remar contra a maré, no sentido figurado, também.", en: "Rowing against the current is tiring; swimming against the tide, in the figurative sense, is too.", grammar: [g.idioms], vocab: [w.remar, w.remar-contra-a-maré, w.sentido-figurado, w.correnteza] }
      - { es: "Depois de três horas sem ver um boto, o Diego chutou o balde e voltou para a pousada.", en: "After three hours without seeing a dolphin, Diego gave up and went back to the lodge.", grammar: [g.idioms, g.preterite-regular], vocab: [w.chutar-o-balde, w.boto] }
      - { es: "Eu sempre pago o pato pelos erros do Rui.", en: "I always take the blame for Rui's mistakes.", grammar: [g.idioms], vocab: [w.pagar-o-pato, w.erro], transform: { instruction: "Put it in the past: 'Yesterday…'", answer: "Ontem eu paguei o pato pelos erros do Rui.", alt: ["Ontem paguei o pato pelos erros do Rui."], en: "Yesterday I took the blame for Rui's mistakes." } }
      - { es: "Peguei um resfriado e fiquei de molho na rede o dia inteiro.", en: "I caught a cold and rested up in the hammock all day.", grammar: [g.idioms], vocab: [w.ficar-de-molho, w.resfriado, w.rede], note: "In ficar de molho (to soak, to rest up) molho has an open o; in molho de pimenta (sauce), a closed o." }
      - { es: "Era surpresa, mas a minha irmã deu com a língua nos dentes.", en: "It was a surprise, but my sister spilled the beans.", altEs: ["Era surpresa, mas minha irmã deu com a língua nos dentes."], grammar: [g.idioms], vocab: [w.dar-com-a-língua-nos-dentes, w.surpresa] }
      - { es: "Com o chefe nervoso, a equipe passou a semana pisando em ovos.", en: "With the boss on edge, the team spent the week walking on eggshells.", grammar: [g.idioms, g.gerund-uses-advanced], vocab: [w.pisar-em-ovos, w.equipe], variant: "In Portugal: a equipa." }
      - { es: "O fiscal fez vista grossa e deixou o barco sair com gente demais.", en: "The inspector turned a blind eye and let the boat leave with too many people on board.", grammar: [g.idioms], vocab: [w.fazer-vista-grossa, w.fiscal] }
      - { es: "Tive que engolir sapo quando o guia corrigiu o meu português na frente de todos.", en: "I had to grin and bear it when the guide corrected my Portuguese in front of everyone.", grammar: [g.idioms, g.ter-que], vocab: [w.engolir-sapo, w.corrigir] }
      - { es: "Ele nunca dá o braço a torcer, nem quando está claramente errado.", en: "He never admits he's wrong, not even when he clearly is.", grammar: [g.idioms], vocab: [w.dar-o-braço-a-torcer, w.errado], error: { wrong: "Ele nunca dá a mão a torcer, nem quando está claramente errado.", explain: "Idioms are fixed: dar o braço a torcer (literally 'give your arm to be twisted').", grammar: g.idioms } }
      - { es: "A guia falava pelos cotovelos, mas sabia tudo sobre as ilhas.", en: "The guide talked nineteen to the dozen, but she knew everything about the islands.", grammar: [g.idioms, g.imperfect], vocab: [w.falar-pelos-cotovelos, w.ilha] }
      - { es: "“Enfiar o pé na jaca” é uma expressão idiomática: ninguém pisa numa jaca de verdade.", en: "'Enfiar o pé na jaca' is an idiom: nobody actually steps into a jackfruit.", grammar: [g.idioms], vocab: [w.expressão-idiomática, w.jaca, w.enfiar] }
      - { es: "Uma pulga no cachorro da pousada, um sapo na pia do banheiro: bem-vindo à floresta!", en: "A flea on the lodge's dog, a toad in the bathroom sink: welcome to the forest!", grammar: [g.idioms], vocab: [w.pulga, w.sapo, w.pia] }
      - { es: "Esse molho de pimenta é forte demais para mim.", en: "This chilli sauce is too strong for me.", grammar: [g.demonstratives], vocab: [w.molho, w.pimenta] }
      - { es: "Perdi um remo, e o balde que usávamos para tirar a água furou.", en: "I lost an oar, and the bucket we were using to bail out the water got a hole in it.", grammar: [g.preterite-vs-imperfect], vocab: [w.remo, w.balde, w.furar] }
    exchanges:
      - q: { es: "Você acreditou no guia?", en: "Did you believe the guide?" }
        a: { es: "Não muito; fiquei com a pulga atrás da orelha.", en: "Not really; I smelled a rat." }
        alt: ["Acreditei.", "Mais ou menos."]
        grammar: [g.idioms]
        vocab: [w.pulga-atrás-da-orelha]
      - q: { es: "Como foi o jantar na pousada?", en: "How was dinner at the lodge?" }
        a: { es: "Ótimo, mas enfiei o pé na jaca: comi peixe até não aguentar mais.", en: "Great, but I overdid it: I ate fish until I couldn't take any more." }
        alt: ["Comi demais.", "Delicioso."]
        grammar: [g.idioms]
        vocab: [w.enfiar-o-pé-na-jaca, w.aguentar]
      - q: { es: "Quem contou a ela sobre a festa surpresa?", en: "Who told her about the surprise party?" }
        a: { es: "O Diego, claro: deu com a língua nos dentes.", en: "Diego, of course: he spilled the beans." }
        alt: ["Foi o Diego.", "Não sei, mas alguém falou."]
        grammar: [g.idioms]
        vocab: [w.dar-com-a-língua-nos-dentes]
      - q: { es: "Você vai fazer a trilha amanhã?", en: "Are you doing the trail tomorrow?" }
        a: { es: "Não, vou ficar de molho; ainda estou com febre.", en: "No, I'm going to rest up; I've still got a temperature." }
        alt: ["Vou, se eu melhorar.", "Não, vou descansar."]
        grammar: [g.idioms, g.estar-com]
        vocab: [w.ficar-de-molho, w.trilha, w.febre]
      - q: { es: "Ele admitiu o erro?", en: "Did he admit his mistake?" }
        a: { es: "Que nada! Ele nunca dá o braço a torcer.", en: "Not a chance! He never admits he's wrong." }
        alt: ["Admitiu, finalmente.", "Não, fingiu que não era com ele."]
        grammar: [g.idioms]
        vocab: [w.dar-o-braço-a-torcer]
    texts:
      - title: "Mensagem de Novo Airão"
        es: ["Chegamos a Novo Airão!", "O guia fala pelos cotovelos, mas sabe tudo sobre o arquipélago.", "Amanhã vamos remar entre as ilhas: me deseje sorte."]
        en: ["We've arrived in Novo Airão!", "The guide talks nineteen to the dozen, but he knows everything about the archipelago.", "Tomorrow we're going to paddle between the islands: wish me luck."]
        grammar: [g.idioms]
        vocab: [w.falar-pelos-cotovelos, w.remar, w.arquipélago]
      - title: "Diário"
        es: ["Hoje paguei o pato: o Rui virou a canoa e quem caiu na água fui eu.", "Engoli sapo e não reclamei.", "Pelo menos agora entendo o sentido figurado de “remar contra a maré”."]
        en: ["Today I took the blame: Rui capsized the canoe and I was the one who fell in the water.", "I swallowed my pride and didn't complain.", "At least now I understand the figurative sense of 'remar contra a maré'."]
        grammar: [g.idioms, g.emphatic-structures]
        vocab: [w.pagar-o-pato, w.engolir-sapo, w.sentido-figurado, w.canoa]
    spicy:
      - { es: "Fiquei com a pulga atrás da orelha: por que você só quer remar quando eu estou na canoa?", en: "I'm suspicious: why do you only want to paddle when I'm in the canoe?", grammar: [g.idioms], vocab: [w.pulga-atrás-da-orelha, w.remar, w.canoa] }
      - { es: "Enfiei o pé na jaca no forró de ontem: dancei com você até as três.", en: "I overdid it at the forró last night: I danced with you until three.", grammar: [g.idioms, g.preterite-regular], vocab: [w.enfiar-o-pé-na-jaca, w.dançar] }
      - { es: "Pode dar com a língua nos dentes: conte para todo mundo que eu gosto de você.", en: "Go ahead and spill the beans: tell everyone I like you.", grammar: [g.idioms, g.imperative-formal], vocab: [w.dar-com-a-língua-nos-dentes] }
      - { es: "Não precisa pisar em ovos comigo; pode dizer que me achou bonito.", en: "You don't need to walk on eggshells with me; you can say you thought I was good-looking.", grammar: [g.idioms], vocab: [w.pisar-em-ovos, w.achar] }
      - { es: "Dou o braço a torcer: você dança melhor do que eu.", en: "I'll admit it: you dance better than I do.", grammar: [g.idioms, g.irregular-comparatives], vocab: [w.dar-o-braço-a-torcer, w.dançar] }
  - id: c1.u04.l2
    title: Nem que a vaca tussa
    teach: [g.idioms]
    vocab: [w.tirar-o-cavalinho-da-chuva, w.acertar-na-mosca, w.com-a-corda-no-pescoço, w.chorar-pitangas, w.encher-linguiça, w.quebrar-o-gelo, w.ver-navios, w.procurar-pelo-em-ovo, w.tirar-de-letra, w.tempestade-em-copo-dágua, w.a-vaca-foi-pro-brejo, w.cara-de-pau, w.dor-de-cotovelo, w.bater-as-botas, w.nem-que-a-vaca-tussa, w.dar-uma-de, w.brejo, w.corda, w.pitanga, w.gelo, w.pelo.n, w.letra, w.acertar, w.curiosidade, w.ousadia]
    tip: "Many idioms are informal: perfect with friends, odd in a report. Some keep old grammar inside them, like the subjunctive in nem que a vaca tussa."
    sentences:
      - { es: "Pode tirar o cavalinho da chuva: com o rio tão baixo, não tem passeio de canoa hoje.", en: "You can forget it: with the river so low, there's no canoe trip today.", grammar: [g.idioms, g.tem-there-is], vocab: [w.tirar-o-cavalinho-da-chuva, w.canoa] }
      - { es: "Você acertou na mosca: o melhor lugar para ver botos é o flutuante de Novo Airão.", en: "You hit the nail on the head: the best place to see river dolphins is the floating platform in Novo Airão.", grammar: [g.idioms, g.superlatives], vocab: [w.acertar-na-mosca, w.flutuante] }
      - { es: "Depois de comprar a lancha a prazo, ele ficou com a corda no pescoço.", en: "After buying the speedboat in instalments, he was up to his neck in debt.", grammar: [g.idioms, g.antes-depois-de], vocab: [w.com-a-corda-no-pescoço, w.lancha] }
      - { es: "Pare de chorar pitangas: a chuva passa em meia hora.", en: "Stop moaning: the rain will pass in half an hour.", grammar: [g.idioms, g.imperative-formal], vocab: [w.chorar-pitangas, w.chuva] }
      - { es: "O relatório tinha vinte páginas, mas metade era só para encher linguiça.", en: "The report was twenty pages long, but half of it was just padding.", grammar: [g.idioms], vocab: [w.encher-linguiça, w.relatório] }
      - { es: "Para quebrar o gelo, o guia contou a lenda do boto.", en: "To break the ice, the guide told the legend of the river dolphin.", grammar: [g.idioms], vocab: [w.quebrar-o-gelo, w.lenda] }
      - { es: "Chegamos ao porto às dez e cinco e ficamos a ver navios: o barco tinha saído às dez.", en: "We got to the port at five past ten and were left high and dry: the boat had left at ten.", grammar: [g.idioms, g.pluperfect], vocab: [w.ver-navios, w.porto] }
      - { es: "Ela procura pelo em ovo: reclamou até da cor da rede.", en: "She splits hairs: she even complained about the colour of the hammock.", grammar: [g.idioms], vocab: [w.procurar-pelo-em-ovo, w.reclamar, w.rede] }
      - { es: "A prova de natação? Tirei de letra.", en: "The swimming test? It was a piece of cake.", grammar: [g.idioms], vocab: [w.tirar-de-letra, w.natação], transform: { instruction: "Change it to the future (vou…)", answer: "A prova de natação? Vou tirar de letra.", alt: ["A prova de natação? Tiro de letra.", "A prova de natação? Vou tirar isso de letra."], en: "The swimming test? I'll sail through it." } }
      - { es: "Foi uma tempestade em copo d'água: o barco atrasou dez minutos e ele quis falar com o gerente.", en: "It was a storm in a teacup: the boat was ten minutes late and he wanted to speak to the manager.", grammar: [g.idioms], vocab: [w.tempestade-em-copo-dágua, w.gerente] }
      - { es: "Choveu, o motor quebrou e o almoço acabou: a vaca foi pro brejo.", en: "It rained, the engine broke down and lunch ran out: everything went down the drain.", grammar: [g.idioms, g.preterite-regular], vocab: [w.a-vaca-foi-pro-brejo, w.motor] }
      - { es: "Que cara de pau! Ele furou a fila do barco e ainda reclamou.", en: "What a nerve! He jumped the queue for the boat and then complained.", grammar: [g.idioms], vocab: [w.cara-de-pau, w.furar, w.fila] }
      - { es: "Quando ela começou a namorar outro, ele ficou com dor de cotovelo.", en: "When she started going out with someone else, he got jealous.", grammar: [g.idioms, g.ficar-change-of-state], vocab: [w.dor-de-cotovelo, w.namorar], transform: { instruction: "Say it in plain language with ciúme", answer: "Quando ela começou a namorar outro, ele ficou com ciúme.", alt: ["Quando ela começou a namorar outro, ele ficou com ciúmes.", "Quando ela começou a namorar outro, ele ficou enciumado."], en: "When she started going out with someone else, he got jealous." } }
      - { es: "O velho barqueiro bateu as botas aos noventa anos, contando histórias até o fim.", en: "The old boatman kicked the bucket at ninety, telling stories to the very end.", grammar: [g.idioms, g.gerund-uses-advanced], vocab: [w.bater-as-botas, w.barqueiro] }
      - { es: "Não entro nesse rio cheio de piranhas nem que a vaca tussa!", en: "I'm not going into that piranha-filled river in a million years!", grammar: [g.idioms, g.subjunctive-irregular], vocab: [w.nem-que-a-vaca-tussa, w.piranha], error: { wrong: "Não entro nesse rio cheio de piranhas nem que a vaca tosse!", explain: "The idiom keeps the present subjunctive after nem que: tossir → tussa.", grammar: g.idioms } }
      - { es: "Ele deu uma de guia e acabou perdendo todo mundo na trilha.", en: "He played the guide and ended up getting everyone lost on the trail.", grammar: [g.idioms, g.periphrases-aspect], vocab: [w.dar-uma-de, w.trilha] }
    exchanges:
      - q: { es: "Ainda dá para pegar o barco das dez?", en: "Can we still catch the ten o'clock boat?" }
        a: { es: "Pode tirar o cavalinho da chuva: já saiu faz meia hora.", en: "Forget it: it left half an hour ago." }
        alt: ["Não, já saiu.", "Só se a gente correr muito."]
        grammar: [g.idioms, g.ha-faz-time]
        vocab: [w.tirar-o-cavalinho-da-chuva]
      - q: { es: "Como foi a apresentação do Diego?", en: "How did Diego's presentation go?" }
        a: { es: "Ele encheu linguiça por vinte minutos e não disse nada.", en: "He waffled for twenty minutes and said nothing." }
        alt: ["Foi ótima.", "Ele tirou de letra."]
        grammar: [g.idioms]
        vocab: [w.encher-linguiça, w.apresentação]
      - q: { es: "Por que o Rui está tão quieto?", en: "Why is Rui so quiet?" }
        a: { es: "Dor de cotovelo: a ex dele está no mesmo barco.", en: "Jealousy: his ex is on the same boat." }
        alt: ["Está cansado.", "Ele brigou com o guia."]
        grammar: [g.idioms]
        vocab: [w.dor-de-cotovelo, w.quieto]
      - q: { es: "O que você achou da reclamação dele?", en: "What did you think of his complaint?" }
        a: { es: "Tempestade em copo d'água: o atraso foi de cinco minutos.", en: "A storm in a teacup: the delay was five minutes." }
        alt: ["Exagero.", "Ele tinha razão."]
        grammar: [g.idioms]
        vocab: [w.tempestade-em-copo-dágua, w.reclamação]
      - q: { es: "Você nadaria no rio à noite?", en: "Would you swim in the river at night?" }
        a: { es: "Nem que a vaca tussa!", en: "Not in a million years!" }
        alt: ["De jeito nenhum!", "Só com o guia."]
        grammar: [g.idioms, g.conditional-simple]
        vocab: [w.nem-que-a-vaca-tussa]
    texts:
      - title: "Avaliação de uma pousada"
        es: ["Ficamos três noites e tiramos o calor de letra.", "O dono é um cara de pau simpático: cobrou a água e ainda pediu cinco estrelas.", "Mesmo assim, acertamos na mosca ao escolher este lugar."]
        en: ["We stayed three nights and handled the heat with ease.", "The owner is a likeable chancer: he charged for the water and still asked for five stars.", "Even so, we hit the nail on the head choosing this place."]
        grammar: [g.idioms]
        vocab: [w.tirar-de-letra, w.cara-de-pau, w.acertar-na-mosca, w.pousada]
      - title: "Mensagem no grupo"
        es: ["Gente, a vaca foi pro brejo: perdemos o barco.", "Ficamos a ver navios no porto.", "Sem chorar pitangas: vamos de lancha amanhã cedo."]
        en: ["Guys, it's all gone wrong: we missed the boat.", "We were left high and dry at the port.", "No moaning: we're going by speedboat early tomorrow."]
        grammar: [g.idioms, g.a-gente]
        vocab: [w.a-vaca-foi-pro-brejo, w.ver-navios, w.chorar-pitangas]
    spicy:
      - { es: "Quebrei o gelo com uma piada ruim, e você riu: acertei na mosca.", en: "I broke the ice with a bad joke, and you laughed: bullseye.", grammar: [g.idioms, g.preterite-regular], vocab: [w.quebrar-o-gelo, w.acertar-na-mosca, w.piada] }
      - { es: "Pode tirar o cavalinho da chuva: hoje eu não danço com mais ninguém.", en: "You can forget it: tonight I'm not dancing with anyone else.", grammar: [g.idioms], vocab: [w.tirar-o-cavalinho-da-chuva, w.dançar] }
      - { es: "Que ousadia: você pediu o meu número para “emergências na trilha”.", en: "What a cheek: you asked for my number for 'trail emergencies'.", altEs: ["Que ousadia: você pediu meu número para “emergências na trilha”."], grammar: [g.idioms], vocab: [w.ousadia, w.emergência] }
      - { es: "Se você for embora sem me dar um beijo, eu fico a ver navios.", en: "If you leave without giving me a kiss, I'll be left high and dry.", grammar: [g.idioms, g.future-subjunctive-se], vocab: [w.ver-navios, w.beijo] }
      - { es: "Não é dor de cotovelo, é curiosidade: com quem você estava dançando?", en: "It's not jealousy, it's curiosity: who were you dancing with?", grammar: [g.idioms, g.estar-gerund-past], vocab: [w.dor-de-cotovelo, w.curiosidade] }
  - id: c1.u04.l3
    title: Quem não tem cão caça com gato
    teach: [g.proverbs]
    vocab: [w.quem-não-tem-cão-caça-com-gato, w.de-grão-em-grão-a-galinha-enche-o-papo, w.mais-vale-um-pássaro-na-mão-do-que-dois-voando, w.quem-vê-cara-não-vê-coração, w.cão-que-ladra-não-morde, w.o-seguro-morreu-de-velho, w.devagar-se-vai-ao-longe, w.a-pressa-é-inimiga-da-perfeição, w.casa-de-ferreiro-espeto-de-pau, w.filho-de-peixe-peixinho-é, w.em-boca-fechada-não-entra-mosca, w.antes-tarde-do-que-nunca, w.água-mole-em-pedra-dura-tanto-bate-até-que-fura, w.deus-ajuda-quem-cedo-madruga, w.em-terra-de-cego-quem-tem-um-olho-é-rei, w.provérbio, w.ditado, w.grão, w.cego, w.mole, w.pedra, w.furar, w.madrugar, w.colchonete]
    tip: "Proverbs keep their old wording even when it looks odd, and speakers often quote only the first half: Bom, quem não tem cão…"
    sentences:
      - { es: "Não tínhamos remo, então usamos uma tábua: quem não tem cão caça com gato.", en: "We didn't have a paddle, so we used a plank: you make do with what you've got.", grammar: [g.proverbs, g.imperfect], vocab: [w.quem-não-tem-cão-caça-com-gato, w.tábua] }
      - { es: "Economizei um pouco por mês para esta viagem; de grão em grão a galinha enche o papo.", en: "I saved a little each month for this trip; every little helps.", grammar: [g.proverbs], vocab: [w.de-grão-em-grão-a-galinha-enche-o-papo, w.economizar] }
      - { es: "Vou ficar com o quarto que temos; mais vale um pássaro na mão do que dois voando.", en: "I'll keep the room we've got; a bird in the hand is worth two in the bush.", grammar: [g.proverbs], vocab: [w.mais-vale-um-pássaro-na-mão-do-que-dois-voando, w.quarto], transform: { instruction: "Put the first part in the past (fiquei…); the proverb stays the same", answer: "Fiquei com o quarto que tínhamos; mais vale um pássaro na mão do que dois voando.", en: "I kept the room we had; a bird in the hand is worth two in the bush." }, variant: "In Portugal: mais vale um pássaro na mão do que dois a voar." }
      - { es: "O barqueiro parecia antipático, mas era um amor: quem vê cara não vê coração.", en: "The boatman seemed unfriendly, but he was a sweetheart: you can't judge a book by its cover.", grammar: [g.proverbs, g.imperfect], vocab: [w.quem-vê-cara-não-vê-coração, w.antipático] }
      - { es: "O dono da pousada grita muito, mas cão que ladra não morde.", en: "The lodge owner shouts a lot, but his bark is worse than his bite.", altEs: ["O dono da pousada grita muito, mas cachorro que late não morde."], grammar: [g.proverbs], vocab: [w.cão-que-ladra-não-morde, w.gritar] }
      - { es: "Leve um remo extra; o seguro morreu de velho.", en: "Take a spare paddle; better safe than sorry.", grammar: [g.proverbs, g.imperative-formal], vocab: [w.o-seguro-morreu-de-velho, w.remo], transform: { instruction: "Say it to a group (vocês)", answer: "Levem um remo extra; o seguro morreu de velho.", en: "Take a spare paddle, all of you; better safe than sorry." } }
      - { es: "Remamos devagar, mas chegamos à última ilha: devagar se vai ao longe.", en: "We paddled slowly, but we reached the last island: slow and steady wins the race.", grammar: [g.proverbs, g.preterite-regular], vocab: [w.devagar-se-vai-ao-longe, w.remar] }
      - { es: "Calma, verifique as cordas antes de sair: a pressa é inimiga da perfeição.", en: "Easy now, check the ropes before you set off: haste makes waste.", grammar: [g.proverbs, g.imperative-formal], vocab: [w.a-pressa-é-inimiga-da-perfeição, w.verificar, w.corda] }
      - { es: "O pai é guia há trinta anos e não sabe nadar: casa de ferreiro, espeto de pau.", en: "Her father has been a guide for thirty years and can't swim: the shoemaker's children go barefoot.", grammar: [g.proverbs, g.ha-faz-time], vocab: [w.casa-de-ferreiro-espeto-de-pau, w.nadar] }
      - { es: "A filha do pescador já pesca melhor do que ele: filho de peixe peixinho é.", en: "The fisherman's daughter already fishes better than he does: like father, like daughter.", grammar: [g.proverbs, g.irregular-comparatives], vocab: [w.filho-de-peixe-peixinho-é, w.pescador] }
      - { es: "Ninguém sabia a resposta, então fiquei calado: em boca fechada não entra mosca.", en: "Nobody knew the answer, so I kept quiet: silence is golden.", grammar: [g.proverbs], vocab: [w.em-boca-fechada-não-entra-mosca, w.calado] }
      - { es: "O barco chegou com duas horas de atraso, mas antes tarde do que nunca.", en: "The boat arrived two hours late, but better late than never.", grammar: [g.proverbs], vocab: [w.antes-tarde-do-que-nunca, w.atraso] }
      - { es: "Ela pediu a licença dez vezes até conseguir: água mole em pedra dura, tanto bate até que fura.", en: "She applied for the permit ten times until she got it: constant dripping wears away the stone.", grammar: [g.proverbs], vocab: [w.água-mole-em-pedra-dura-tanto-bate-até-que-fura, w.mole, w.pedra, w.furar], error: { wrong: "Ela pediu a licença dez vezes até conseguir: água mole em pedra dura, tanto bate até que fure.", explain: "The proverb is fixed with the indicative: até que fura. Proverbs keep their traditional wording.", grammar: g.proverbs } }
      - { es: "Saímos às cinco para ver os pássaros: Deus ajuda quem cedo madruga.", en: "We left at five to see the birds: the early bird catches the worm.", grammar: [g.proverbs], vocab: [w.deus-ajuda-quem-cedo-madruga, w.madrugar, w.pássaro] }
      - { es: "Sei pouco de plantas, mas aqui sou a especialista: em terra de cego, quem tem um olho é rei.", en: "I know little about plants, but here I'm the expert: in the land of the blind, the one-eyed man is king.", grammar: [g.proverbs], vocab: [w.em-terra-de-cego-quem-tem-um-olho-é-rei, w.cego, w.planta] }
      - { es: "Todo provérbio tem um fundo de verdade, mas nem todo ditado envelhece bem; de grão em grão, a gente aprende quais usar.", en: "Every proverb has a grain of truth, but not every saying ages well; little by little, you learn which ones to use.", grammar: [g.proverbs], vocab: [w.provérbio, w.ditado, w.grão, w.envelhecer] }
    exchanges:
      - q: { es: "Não tem mais rede na pousada. E agora?", en: "There are no hammocks left at the lodge. What now?" }
        a: { es: "Quem não tem cão caça com gato: a gente dorme no colchonete.", en: "You make do with what you've got: we'll sleep on the camping mat." }
        alt: ["A gente dá um jeito.", "Dormimos no chão."]
        grammar: [g.proverbs, g.a-gente]
        vocab: [w.quem-não-tem-cão-caça-com-gato, w.colchonete]
      - q: { es: "Será que vale a pena trocar de quarto?", en: "Do you think it's worth changing rooms?" }
        a: { es: "Melhor não: mais vale um pássaro na mão do que dois voando.", en: "Better not: a bird in the hand is worth two in the bush." }
        alt: ["Não, fica com esse.", "Melhor não arriscar."]
        grammar: [g.proverbs, g.sera-que]
        vocab: [w.mais-vale-um-pássaro-na-mão-do-que-dois-voando]
      - q: { es: "Que horas a gente sai amanhã?", en: "What time are we leaving tomorrow?" }
        a: { es: "Às cinco: Deus ajuda quem cedo madruga.", en: "At five: the early bird catches the worm." }
        alt: ["Bem cedo.", "Às cinco em ponto."]
        grammar: [g.proverbs]
        vocab: [w.deus-ajuda-quem-cedo-madruga]
      - q: { es: "O Rui finalmente chegou!", en: "Rui has finally arrived!" }
        a: { es: "Antes tarde do que nunca.", en: "Better late than never." }
        alt: ["Até que enfim!", "Já não era sem tempo."]
        grammar: [g.proverbs]
        vocab: [w.antes-tarde-do-que-nunca]
      - q: { es: "Você vai contar para o guia que perdemos o remo?", en: "Are you going to tell the guide we lost the paddle?" }
        a: { es: "Melhor não: em boca fechada não entra mosca.", en: "Better not: least said, soonest mended." }
        alt: ["Conto, claro.", "Vamos contar juntos."]
        grammar: [g.proverbs]
        vocab: [w.em-boca-fechada-não-entra-mosca]
    texts:
      - title: "Conselhos da avó"
        es: ["A minha avó tinha um ditado para tudo.", "Se eu reclamava do dinheiro, dizia: “De grão em grão a galinha enche o papo.”", "Se eu tinha pressa, respondia: “Devagar se vai ao longe.”"]
        en: ["My grandmother had a saying for everything.", "If I complained about money, she'd say: 'Every little helps.'", "If I was in a hurry, she'd answer: 'Slow and steady wins the race.'"]
        grammar: [g.proverbs, g.imperfect-uses]
        vocab: [w.ditado, w.de-grão-em-grão-a-galinha-enche-o-papo, w.devagar-se-vai-ao-longe]
      - title: "Bilhete do guia"
        es: ["Saída às cinco da manhã.", "Quem chegar atrasado perde o barco: Deus ajuda quem cedo madruga.", "Levem água e capa de chuva; o seguro morreu de velho."]
        en: ["Departure at five in the morning.", "Anyone who arrives late misses the boat: the early bird catches the worm.", "Bring water and a raincoat; better safe than sorry."]
        grammar: [g.proverbs, g.future-subjunctive-relative]
        vocab: [w.deus-ajuda-quem-cedo-madruga, w.o-seguro-morreu-de-velho]
    spicy:
      - { es: "Quem vê cara não vê coração, mas, no seu caso, a cara já ajuda muito.", en: "You can't judge a book by its cover, but in your case the cover helps a lot.", grammar: [g.proverbs], vocab: [w.quem-vê-cara-não-vê-coração] }
      - { es: "Insisti tanto que você aceitou jantar comigo: água mole em pedra dura…", en: "I insisted so much that you agreed to have dinner with me: constant dripping…", grammar: [g.proverbs, g.consequence-clauses], vocab: [w.água-mole-em-pedra-dura-tanto-bate-até-que-fura, w.insistir] }
      - { es: "Cheguei atrasado ao encontro, mas trouxe flores: antes tarde do que nunca.", en: "I was late for our date, but I brought flowers: better late than never.", grammar: [g.proverbs, g.preterite-irregular], vocab: [w.antes-tarde-do-que-nunca, w.flor] }
      - { es: "Você diz que não gosta de mim, mas cão que ladra não morde.", en: "You say you don't like me, but your bark is worse than your bite.", grammar: [g.proverbs], vocab: [w.cão-que-ladra-não-morde] }
      - { es: "Mais vale um beijo hoje do que duas promessas amanhã.", en: "One kiss today is worth more than two promises tomorrow.", grammar: [g.proverbs, g.comparatives], vocab: [w.beijo, w.promessa] }
  - id: c1.u04.l4
    title: À toa, à beça, de cabo a rabo
    teach: [g.fixed-expressions]
    vocab: [w.tábua-de-salvação, w.de-cabo-a-rabo, w.à-toa, w.à-beça, w.são-e-salvo, w.custar-os-olhos-da-cara, w.tábua, w.caça, w.caçar, w.cabo, w.rabo, w.são, w.ferreiro, w.espeto, w.monge, w.mosca, w.cobra, w.pote, w.anzol]
    tip: "Learn verb + noun pairs as blocks: tomar uma decisão, fazer uma pergunta, prestar atenção, correr um risco, levar a sério, dar um jeito."
    sentences:
      - { es: "Lemos o regulamento do parque de cabo a rabo antes de entrar.", en: "We read the park rules from start to finish before going in.", grammar: [g.fixed-expressions], vocab: [w.de-cabo-a-rabo, w.regulamento] }
      - { es: "Não fiquei mais uma semana à toa: queria ver as ilhas na cheia.", en: "I didn't stay another week for no reason: I wanted to see the islands in the flood season.", grammar: [g.fixed-expressions], vocab: [w.à-toa, w.cheia] }
      - { es: "Tem mosquito à beça na margem, mas no meio do rio quase nenhum.", en: "There are loads of mosquitoes on the bank, but hardly any in the middle of the river.", grammar: [g.fixed-expressions, g.tem-there-is], vocab: [w.à-beça, w.mosquito, w.margem] }
      - { es: "Depois de dois dias perdidos na trilha, os dois voltaram sãos e salvos.", en: "After two days lost on the trail, the two of them came back safe and sound.", grammar: [g.fixed-expressions, g.adjective-agreement], vocab: [w.são-e-salvo, w.perdido] }
      - { es: "A lancha particular custou os olhos da cara.", en: "The private speedboat cost an arm and a leg.", grammar: [g.fixed-expressions], vocab: [w.custar-os-olhos-da-cara, w.particular], transform: { instruction: "Say it in plain language", answer: "A lancha particular custou muito caro.", alt: ["A lancha particular foi caríssima.", "A lancha particular custou caríssimo."], en: "The private speedboat was very expensive." } }
      - { es: "Quando o motor parou, o remo foi a nossa tábua de salvação.", en: "When the engine stopped, the paddle was our lifeline.", grammar: [g.fixed-expressions], vocab: [w.tábua-de-salvação, w.motor] }
      - { es: "A caça é proibida dentro do parque nacional.", en: "Hunting is prohibited inside the national park.", grammar: [g.passive-estar-ficar], vocab: [w.caça, w.parque] }
      - { es: "Antigamente, os moradores caçavam e pescavam para comer.", en: "In the old days, the local people hunted and fished for food.", grammar: [g.imperfect-uses], vocab: [w.caçar, w.morador] }
      - { es: "Uma cobra atravessou a trilha bem na nossa frente.", en: "A snake crossed the trail right in front of us.", grammar: [g.preterite-regular], vocab: [w.cobra, w.trilha] }
      - { es: "Fui com muita sede ao pote e paguei caro demais pelo passeio.", en: "I was too eager and paid far too much for the trip.", grammar: [g.fixed-expressions], vocab: [w.pote], note: "ir com muita sede ao pote = to rush in too eagerly." }
      - { es: "O hábito não faz o monge: o guia mais calado era o mais corajoso.", en: "Clothes don't make the man: the quietest guide was the bravest.", grammar: [g.proverbs, g.superlatives], vocab: [w.monge, w.hábito, w.corajoso] }
      - { es: "O avô dele era ferreiro e fazia anzóis e espetos à mão.", en: "His grandfather was a blacksmith and made fishhooks and skewers by hand.", grammar: [g.imperfect], vocab: [w.ferreiro, w.espeto, w.anzol] }
      - { es: "Fora da temporada, a pousada fica às moscas.", en: "Out of season, the lodge is dead (literally: left to the flies).", grammar: [g.fixed-expressions], vocab: [w.mosca, w.temporada] }
      - { es: "Prestem atenção nas instruções antes de entrar na canoa.", en: "Pay attention to the instructions before getting into the canoe.", altEs: ["Prestem atenção às instruções antes de entrar na canoa."], grammar: [g.fixed-expressions, g.imperative-formal], vocab: [w.prestar, w.atenção, w.instrução] }
      - { es: "Precisamos tomar uma decisão até amanhã: ficamos ou voltamos?", en: "We need to make a decision by tomorrow: do we stay or go back?", grammar: [g.fixed-expressions], vocab: [w.decisão], error: { wrong: "Precisamos fazer uma decisão até amanhã: ficamos ou voltamos?", explain: "In Portuguese you take a decision: tomar uma decisão. Fazer uma decisão is an English calque.", grammar: g.fixed-expressions } }
      - { es: "Ele levou o aviso do guia muito a sério e não saiu da trilha.", en: "He took the guide's warning very seriously and didn't leave the trail.", grammar: [g.fixed-expressions], vocab: [w.aviso], transform: { instruction: "Make it negative: he didn't take it seriously and got lost", answer: "Ele não levou o aviso do guia a sério e se perdeu.", alt: ["Ele não levou a sério o aviso do guia e se perdeu."], en: "He didn't take the guide's warning seriously and got lost." } }
    exchanges:
      - q: { es: "Você leu o contrato da pousada?", en: "Did you read the lodge's contract?" }
        a: { es: "Li de cabo a rabo; não tem nenhuma surpresa.", en: "I read it from start to finish; there are no surprises." }
        alt: ["Li tudo.", "Só por cima."]
        grammar: [g.fixed-expressions]
        vocab: [w.de-cabo-a-rabo]
      - q: { es: "Por que você está rindo?", en: "Why are you laughing?" }
        a: { es: "À toa. Lembrei do Rui caindo da canoa.", en: "No reason. I remembered Rui falling out of the canoe." }
        alt: ["Por nada.", "Nada, não."]
        grammar: [g.fixed-expressions]
        vocab: [w.à-toa]
      - q: { es: "Tinha muita gente no passeio?", en: "Were there many people on the trip?" }
        a: { es: "Gente à beça: três barcos lotados.", en: "Loads of people: three full boats." }
        alt: ["Muita gente.", "Pouca, era baixa temporada."]
        grammar: [g.fixed-expressions]
        vocab: [w.à-beça, w.lotado]
      - q: { es: "E os meninos voltaram da trilha?", en: "And did the boys come back from the trail?" }
        a: { es: "Voltaram sãos e salvos, só com muita fome.", en: "They came back safe and sound, just very hungry." }
        alt: ["Voltaram, graças a Deus.", "Ainda não."]
        grammar: [g.fixed-expressions]
        vocab: [w.são-e-salvo]
      - q: { es: "Quanto custou o hotel de selva?", en: "How much did the jungle lodge cost?" }
        a: { es: "Custou os olhos da cara, mas valeu a pena.", en: "It cost an arm and a leg, but it was worth it." }
        alt: ["Uma fortuna.", "Foi caríssimo."]
        grammar: [g.fixed-expressions]
        vocab: [w.custar-os-olhos-da-cara]
    texts:
      - title: "Relato de viagem"
        es: ["Na primeira noite, saímos de canoa para ver jacarés.", "O motor quebrou no meio do igapó, e o remo foi a nossa tábua de salvação.", "Voltamos sãos e salvos, mas com picadas de mosquito à beça."]
        en: ["On the first night, we went out by canoe to see caimans.", "The engine broke down in the middle of the flooded forest, and the paddle was our lifeline.", "We came back safe and sound, but with loads of mosquito bites."]
        grammar: [g.fixed-expressions]
        vocab: [w.tábua-de-salvação, w.são-e-salvo, w.à-beça, w.igapó]
      - title: "Regras do parque"
        es: ["É proibida a caça dentro do parque.", "Preste atenção às placas e não saia da trilha.", "Por via das dúvidas, ande sempre com um guia."]
        en: ["Hunting is prohibited inside the park.", "Pay attention to the signs and don't leave the trail.", "Just in case, always go with a guide."]
        grammar: [g.fixed-expressions, g.imperative-formal]
        vocab: [w.caça, w.prestar, w.atenção]
    spicy:
      - { es: "Não sorri para você à toa: estava planejando isso há uma semana.", en: "I didn't smile at you for no reason: I'd been planning it for a week.", grammar: [g.fixed-expressions, g.estar-gerund-past], vocab: [w.à-toa, w.planejar] }
      - { es: "Você é a minha tábua de salvação nesta festa: não conheço mais ninguém.", en: "You're my lifeline at this party: I don't know anyone else.", altEs: ["Você é minha tábua de salvação nesta festa: não conheço mais ninguém."], grammar: [g.fixed-expressions], vocab: [w.tábua-de-salvação] }
      - { es: "Esse vestido deve ter custado os olhos da cara; valeu cada centavo.", en: "That dress must have cost an arm and a leg; it was worth every cent.", grammar: [g.fixed-expressions, g.dever-probability], vocab: [w.custar-os-olhos-da-cara, w.vestido] }
      - { es: "Fui com muita sede ao pote e te chamei para jantar no primeiro minuto.", en: "I was too eager and asked you to dinner in the first minute.", grammar: [g.fixed-expressions], vocab: [w.pote] }
      - { es: "Levo você muito a sério, menos quando você tenta dançar forró.", en: "I take you very seriously, except when you try to dance forró.", grammar: [g.fixed-expressions], vocab: [w.dançar] }
dialogues:
  - id: c1.u04.d1
    title: Chegada a Anavilhanas
    context: Tiago and Renata arrive at a jungle lodge in the Anavilhanas archipelago. Cida, their guide, explains the plans for the next day.
    lines:
      - { speaker: Cida, es: "Bem-vindos a Anavilhanas! Amanhã cedo vamos de canoa entre as ilhas.", en: "Welcome to Anavilhanas! Early tomorrow we're going by canoe between the islands." }
      - { speaker: Tiago, es: "Cedo quanto? Eu estou de férias…", en: "How early? I'm on holiday…" }
      - { speaker: Cida, es: "Às cinco. Deus ajuda quem cedo madruga: é a hora dos pássaros e dos botos.", en: "At five. The early bird catches the worm: it's the time for birds and dolphins." }
      - { speaker: Renata, es: "Pode deixar, eu acordo o Tiago. Ele fala pelos cotovelos, mas dorme feito pedra.", en: "Leave it to me, I'll wake Tiago. He talks nineteen to the dozen, but he sleeps like a log." }
      - { speaker: Cida, es: "E levem repelente. No rio Negro tem pouco mosquito, mas o seguro morreu de velho.", en: "And bring repellent. There aren't many mosquitoes on the Rio Negro, but better safe than sorry." }
      - { speaker: Tiago, es: "É verdade que dá para ver jacarés à noite?", en: "Is it true you can see caimans at night?" }
      - { speaker: Cida, es: "Dá, sim. Só peço uma coisa: prestem atenção e não ponham a mão na água.", en: "Yes, you can. I only ask one thing: pay attention and don't put your hands in the water." }
      - { speaker: Renata, es: "Nem que a vaca tussa! Eu vou ficar bem no meio da canoa.", en: "Not in a million years! I'm staying right in the middle of the canoe." }
      - { speaker: Tiago, es: "E se a canoa virar?", en: "And what if the canoe capsizes?" }
      - { speaker: Cida, es: "Tiago, não precisa chorar pitangas antes da hora. Em vinte anos, todo mundo voltou são e salvo.", en: "Tiago, no need to moan before anything's happened. In twenty years, everyone has come back safe and sound." }
      - { speaker: Renata, es: "Viu? Tempestade em copo d'água, como sempre.", en: "See? A storm in a teacup, as always." }
    questions:
      - { q: "A que horas sai o passeio de canoa?", options: ["Às cinco da manhã", "Às nove", "À noite"], answer: 0, explain: "Às cinco. Deus ajuda quem cedo madruga." }
      - { q: "O que Cida diz sobre os mosquitos no rio Negro?", options: ["Que há muitos", "Que há poucos, mas é bom levar repelente", "Que não há nenhum"], answer: 1, explain: "Tem pouco mosquito, mas o seguro morreu de velho: better safe than sorry." }
      - { q: "Na fala de Cida, o que quer dizer “chorar pitangas”?", options: ["Reclamar e se lamentar", "Comer frutas", "Rir muito"], answer: 0, explain: "chorar pitangas = to moan, to complain (pitanga is a small red fruit)." }
      - { q: "Qual é a regra durante a observação de jacarés?", options: ["Não falar alto", "Não pôr a mão na água", "Não usar lanterna"], answer: 1, explain: "Prestem atenção e não ponham a mão na água." }
writing:
  - task: "Tell the story of someone's blunder at an office party, using at least three idioms (enfiar o pé na jaca, dar com a língua nos dentes, pagar o pato, pisar em ovos…)."
    min: 110
    max: 190
    use: [w.enfiar-o-pé-na-jaca, w.pagar-o-pato, w.dar-com-a-língua-nos-dentes, w.pisar-em-ovos, w.engolir-sapo]
    useAtLeast: 3
    grammar: [g.idioms]
    expect:
      - { pattern: '(enfi(ei|ou|aram|ar) o p[eé] na jaca|pag(uei|ou|aram|ar) o pato|d(eu|ei|ar) com a l[ií]ngua nos dentes|pis(ar|ando|ei|ou) em ovos|engol(i|iu|ir) (um |muito )?sapo|chut(ei|ou|ar) o balde|vista grossa|pelos cotovelos|pulga atr[aá]s da orelha)', hint: "Use idioms: enfiar o pé na jaca, pagar o pato, dar com a língua nos dentes…" }
    model: { es: "Na festa de fim de ano da empresa, o Carlos enfiou o pé na jaca: bebeu demais, dançou em cima da mesa e, pior, deu com a língua nos dentes. Contou para todo mundo que a diretora ia ser demitida. No dia seguinte, quem pagou o pato fui eu, porque eu era a única pessoa que sabia do segredo e ela achou que eu tinha falado. Durante semanas, tive que pisar em ovos com ela e engolir muito sapo nas reuniões. O Carlos, que fala pelos cotovelos, nem pediu desculpas. Ainda bem que a verdade apareceu e, no fim, ela acabou fazendo as pazes comigo. Moral da história: em festa de empresa, é melhor não beber demais.", en: "At the company's end-of-year party, Carlos went completely overboard: he drank too much, danced on the table and, worse, spilled the beans. He told everyone the director was going to be fired. The next day I was the one who took the blame, because I was the only person who knew the secret and she thought I'd told. For weeks I had to tread on eggshells with her and swallow a lot in meetings. Carlos, who never stops talking, didn't even apologise. Fortunately the truth came out and, in the end, she made it up with me. Moral of the story: at a work party, it's better not to drink too much." }
  - task: "A friend wants to quit a stable job to open a guesthouse in Anavilhanas. Give honest advice using at least three idioms (tirar o cavalinho da chuva, tirar de letra, com a corda no pescoço, nem que a vaca tussa…)."
    min: 110
    max: 190
    use: [w.tirar-o-cavalinho-da-chuva, w.nem-que-a-vaca-tussa, w.com-a-corda-no-pescoço, w.tirar-de-letra, w.a-vaca-foi-pro-brejo]
    useAtLeast: 3
    grammar: [g.idioms]
    expect:
      - { pattern: '(cavalinho da chuva|nem que a vaca tussa|vaca (foi|for|vai) pro brejo|tirar de letra|tira de letra|quebrar o gelo|na mosca|corda no pesco[cç]o|chorar pitangas|encher lingui[cç]a|ver navios|pelo em ovo|copo d.?[aá]gua|cara de pau|dor de cotovelo)', hint: "Use idioms: tirar o cavalinho da chuva, tirar de letra, nem que a vaca tussa…" }
    model: { es: "Olha, eu entendo o seu sonho, mas se você acha que vai ficar rico com uma pousada nas Anavilhanas no primeiro ano, pode tirar o cavalinho da chuva. É muito trabalho e o dinheiro demora a chegar. Por outro lado, você tem experiência com turismo e fala inglês, então vai tirar de letra a parte dos turistas estrangeiros. Só não largue o emprego sem ter uma reserva de dinheiro, senão você vai ficar com a corda no pescoço e, se a vaca for pro brejo, não vai ter para onde voltar. Mas eu te conheço: nem que a vaca tussa você vai desistir. Então faça um bom planejamento e conte comigo!", en: "Look, I understand your dream, but if you think you'll get rich from a guesthouse in Anavilhanas in the first year, you can forget it. It's a lot of work and the money takes a while to come. On the other hand, you have experience in tourism and speak English, so you'll breeze through the foreign-tourist side. Just don't quit your job without some savings, or you'll be up to your neck in debt and, if it all goes wrong, you'll have nowhere to go back to. But I know you: you'll never give up, come what may. So plan it well and count on me!" }
  - task: "Write a short crônica about saving money or being patient, using two or three proverbs appropriately (de grão em grão…, a pressa é inimiga da perfeição, devagar se vai ao longe…)."
    min: 110
    max: 190
    use: [w.de-grão-em-grão-a-galinha-enche-o-papo, w.devagar-se-vai-ao-longe, w.a-pressa-é-inimiga-da-perfeição, w.provérbio, w.ditado]
    useAtLeast: 3
    grammar: [g.proverbs]
    expect:
      - { pattern: '(de gr[aã]o em gr[aã]o|devagar se vai ao longe|a pressa [eé] inimiga|mais vale um p[aá]ssaro|quem n[aã]o tem c[aã]o|quem v[eê] cara|c[aã]o que ladra|o seguro morreu de velho|casa de ferreiro|filho de peixe|em boca fechada|antes tarde do que nunca|[aá]gua mole em pedra dura|deus ajuda quem cedo madruga|em terra de cego)', hint: "Use proverbs: De grão em grão…, Devagar se vai ao longe…" }
    model: { es: "Quando comecei a juntar dinheiro para conhecer a Amazônia, todo mundo riu de mim. Eu guardava vinte reais por semana, e um amigo dizia que assim eu só ia viajar aos oitenta anos. Mas a minha avó sempre repetia um velho ditado: de grão em grão, a galinha enche o papo. Ela tinha razão. Em dois anos, eu tinha o suficiente para a passagem e para uma semana nas Anavilhanas. Também aprendi que a pressa é inimiga da perfeição: em vez de comprar o primeiro pacote barato, procurei muito e encontrei uma pousada maravilhosa. Hoje, quando alguém me pergunta como consegui, respondo com outro provérbio: devagar se vai ao longe.", en: "When I started saving to see the Amazon, everyone laughed at me. I put aside twenty reais a week, and a friend said that at that rate I'd only travel at eighty. But my grandmother always repeated an old saying: grain by grain, the hen fills her crop. She was right. In two years I had enough for the ticket and a week in Anavilhanas. I also learned that haste is the enemy of perfection: instead of buying the first cheap package, I researched a lot and found a wonderful guesthouse. Today, when someone asks me how I did it, I answer with another proverb: slow and steady wins the race." }
  - task: "Describe a trip that went badly but ended well, using fixed expressions (custar os olhos da cara, à toa, à beça, de cabo a rabo, tábua de salvação, são e salvo)."
    min: 110
    max: 190
    use: [w.à-toa, w.à-beça, w.de-cabo-a-rabo, w.são-e-salvo, w.custar-os-olhos-da-cara]
    useAtLeast: 3
    grammar: [g.fixed-expressions]
    expect:
      - { pattern: '([aà] toa|[aà] be[cç]a|de cabo a rabo|s[aã]os? e salvos?|olhos da cara|t[aá]bua de salva[cç][aã]o)', hint: "Use fixed expressions: à toa, à beça, de cabo a rabo, são e salvo…" }
    model: { es: "A viagem de barco pelas Anavilhanas tinha tudo para dar errado. O passeio custou os olhos da cara e, logo no primeiro dia, o motor quebrou no meio do rio. Ficamos horas à toa, esperando ajuda, enquanto chovia à beça. O guia conhecia o rio de cabo a rabo, mas não sabia consertar motores. A nossa tábua de salvação foi um pescador que passou de canoa e nos levou até uma comunidade ali perto. Lá, comemos peixe assado, dormimos em redes e vimos botos ao amanhecer. No final, voltamos sãos e salvos a Manaus, cansados, mas felizes. Por incrível que pareça, foi a melhor parte da viagem. Hoje, quando conto essa história, todo mundo ri.", en: "The boat trip through Anavilhanas had everything going for it to go wrong. The tour cost an arm and a leg and, on the very first day, the engine broke down in the middle of the river. We spent hours hanging around waiting for help while it poured with rain. The guide knew the river inside out, but didn't know how to fix engines. Our lifeline was a fisherman who came by in a canoe and took us to a community nearby. There we ate grilled fish, slept in hammocks and saw river dolphins at dawn. In the end we got back to Manaus safe and sound, tired but happy. Incredible as it may seem, it was the best part of the trip. Today, when I tell this story, everyone laughs." }
