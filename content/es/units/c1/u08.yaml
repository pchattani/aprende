id: c1.u08
title: Literatura I
lessons:
  - id: c1.u08.l1
    title: Volverán las oscuras golondrinas
    teach: [g.literary-language]
    vocab: [w.poesia, w.poeta, w.rima, w.metafora, w.simil, w.personificacion, w.hiperbaton, w.figura, w.imagen, w.simbolo, w.inspiracion, w.golondrina, w.nido, w.ala, w.pupila, w.melancolia, w.melancolico, w.alma, w.suspiro, w.suspirar, w.llanto, w.crepusculo, w.poetico, w.adjetivo, w.amor, w.brillar, w.literatura]
    tip: "Poetry bends normal word order (hipérbaton): Volverán las oscuras golondrinas en tu balcón sus nidos a colgar = las golondrinas volverán a colgar sus nidos en tu balcón. Learn the names of the figures: metáfora, símil, personificación, hipérbole, anáfora."
    sentences:
      - { es: "«Volverán las oscuras golondrinas en tu balcón sus nidos a colgar» (Bécquer): el verbo va al final y el adjetivo delante del nombre.", en: "'The dark swallows will return to hang their nests on your balcony' (Bécquer): the verb goes at the end and the adjective before the noun.", grammar: [g.literary-language, g.quotation], vocab: [w.golondrina, w.nido, w.balcon, w.colgar, w.hiperbaton, w.oscuro], note: "Rima LIII. In prose: las golondrinas volverán a colgar sus nidos en tu balcón." }
      - { es: "¿Qué es poesía?, dices mientras clavas en mi pupila tu pupila azul. ¿Qué es poesía? ¿Y tú me lo preguntas? Poesía… eres tú.", en: "What is poetry?, you say while you fix your blue pupil on my pupil. What is poetry? And you ask me? Poetry… is you.", grammar: [g.literary-language, g.quotation], vocab: [w.poesia, w.pupila, w.azul], note: "Bécquer, Rima XXI. The repeated question is an anaphora." }
      - { es: "Los suspiros son aire y van al aire; las lágrimas son agua y van al mar.", en: "Sighs are air and go to the air; tears are water and go to the sea.", grammar: [g.literary-language], vocab: [w.suspiro, w.lagrima, w.aire, w.mar], note: "Bécquer, Rima XXXVIII. Two parallel metaphors." }
      - { es: "Una metáfora identifica dos cosas sin «como»; un símil las compara con «como»: «sus ojos eran dos luceros» frente a «sus ojos brillaban como luceros».", en: "A metaphor identifies two things without 'like'; a simile compares them with 'like': 'her eyes were two bright stars' versus 'her eyes shone like bright stars'.", grammar: [g.literary-language], vocab: [w.metafora, w.simil, w.comparar, w.brillar] }
      - { es: "Cuando el poeta escribe que «el viento suspira entre los olmos», está usando una personificación.", en: "When the poet writes that 'the wind sighs among the elms', he is using personification.", grammar: [g.literary-language], vocab: [w.personificacion, w.poeta, w.suspirar, w.viento, w.olmo] }
      - { es: "¡Qué melancolía hay en estos versos! Hablan del alma como si fuera un nido vacío.", en: "What melancholy there is in these lines! They speak of the soul as if it were an empty nest.", grammar: [g.literary-language, g.como-si], vocab: [w.melancolia, w.verso, w.alma, w.nido, w.vacio] }
      - { es: "No confundas la rima con el ritmo: dos versos pueden rimar y, sin embargo, sonar torpes.", en: "Don't confuse rhyme with rhythm: two lines can rhyme and yet sound clumsy.", grammar: [g.literary-language, g.imperative-negative], vocab: [w.rima, w.ritmo, w.verso, w.sonar, w.torpe] }
      - { es: "La golondrina es, en la poesía romántica, símbolo del amor que vuelve y, a la vez, imagen del tiempo que no vuelve.", en: "In Romantic poetry the swallow is a symbol of love that returns and, at the same time, an image of time that does not return.", grammar: [g.literary-language], vocab: [w.golondrina, w.simbolo, w.imagen, w.romanticismo, w.tiempo] }
      - { es: "«Del salón en el ángulo oscuro, de su dueña tal vez olvidada, silenciosa y cubierta de polvo, veíase el arpa» (Bécquer).", en: "'In the dark corner of the drawing room, perhaps forgotten by its owner, silent and covered in dust, the harp could be seen' (Bécquer).", grammar: [g.literary-language, g.quotation], vocab: [w.oscuro, w.silencioso, w.cubrir], note: "Rima VII. veíase = se veía: in older texts the pronoun attaches to the verb." }
      - { es: "El crepúsculo y el llanto son dos palabras que los poetas del siglo XIX usaban con una frecuencia casi cómica.", en: "Twilight and weeping are two words that nineteenth-century poets used with almost comic frequency.", grammar: [g.literary-language], vocab: [w.crepusculo, w.llanto, w.poeta, w.siglo] }
      - { es: "¿De dónde sacaba Bécquer la inspiración? De un amor imposible y de unas alas que nunca lo llevaron lejos de Sevilla.", en: "Where did Bécquer get his inspiration from? From an impossible love and from wings that never carried him far from Seville.", grammar: [g.literary-language], vocab: [w.inspiracion, w.ala, w.imposible, w.amor] }
      - { es: "Las golondrinas volverán a colgar sus nidos en tu balcón.", en: "The swallows will return to hang their nests on your balcony.", grammar: [g.literary-language], vocab: [w.golondrina, w.nido, w.balcon], transform: { instruction: "Reorder it as poetic hipérbaton: adjective before the noun, infinitive at the end (the Bécquer line)", answer: "Volverán las oscuras golondrinas en tu balcón sus nidos a colgar.", alt: ["Volverán las golondrinas en tu balcón sus nidos a colgar."] } }
      - { es: "La blanca nieve cubría los campos.", en: "The white snow covered the fields.", grammar: [g.literary-language], vocab: [w.nieve, w.cubrir, w.campo], error: { wrong: "La nieve blanco cubría los campos.", explain: "Even in poetic position before or after the noun, the adjective agrees: la nieve blanca / la blanca nieve.", grammar: g.literary-language }, note: "Adjective before the noun = literary, descriptive (epíteto)." }
      - { es: "Dicen que la poesía no se traduce; yo diría más bien que se traduce dos veces: la letra y la música.", en: "They say poetry can't be translated; I would say rather that it is translated twice: the words and the music.", grammar: [g.literary-language, g.se-passive], vocab: [w.poesia, w.traducir, w.musica] }
      - { es: "El poema es melancólico, mas no triste: hay en él una alegría pálida, como de atardecer.", en: "The poem is melancholy, but not sad: there is in it a pale joy, like dusk.", grammar: [g.literary-language], vocab: [w.melancolico, w.mas, w.palido, w.atardecer], note: "mas (no accent) = pero, literary." }
      - { es: "Subraya las figuras retóricas del texto y escribe al margen qué efecto producen.", en: "Underline the figures of speech in the text and write in the margin what effect they produce.", grammar: [g.literary-language, g.imperative-tu], vocab: [w.subrayar, w.figura, w.efecto, w.producir] }
    exchanges:
      - q: { es: "¿Qué figura hay en «el viento suspira entre los olmos»?", en: "What figure is there in 'the wind sighs among the elms'?" }
        a: { es: "Una personificación: el viento hace algo humano.", en: "A personification: the wind does something human." }
        alt: ["Es una personificación."]
        grammar: [g.literary-language]
        vocab: [w.figura, w.personificacion, w.suspirar]
      - q: { es: "¿Por qué pone Bécquer el verbo al final del verso?", en: "Why does Bécquer put the verb at the end of the line?" }
        a: { es: "Por la rima y por el ritmo; es un hipérbaton típico de la poesía.", en: "For the rhyme and the rhythm; it's a typical poetic inversion." }
        alt: ["Es un hipérbaton."]
        grammar: [g.literary-language]
        vocab: [w.hiperbaton, w.rima, w.verso]
      - q: { es: "¿Qué simboliza la golondrina en la rima?", en: "What does the swallow symbolise in the poem?" }
        a: { es: "El amor que vuelve cada año; pero «aquellas» golondrinas, las de los dos, no volverán.", en: "The love that returns every year; but 'those' swallows, the couple's own, will not return." }
        alt: ["El amor que vuelve y el tiempo que no vuelve."]
        grammar: [g.literary-language]
        vocab: [w.simbolo, w.golondrina, w.amor]
      - q: { es: "¿Te parece triste el poema?", en: "Do you find the poem sad?" }
        a: { es: "Melancólico más que triste; es más un suspiro que un llanto.", en: "Melancholy more than sad; it's more a sigh than a cry." }
        alt: ["Más melancólico que triste."]
        grammar: [g.literary-language]
        vocab: [w.melancolico, w.suspiro, w.llanto]
    texts:
      - title: "Nota de clase sobre la Rima LIII"
        es: ["Bécquer escribe «volverán las oscuras golondrinas», no «las golondrinas oscuras volverán».", "El adjetivo delante del nombre y el verbo al principio son marcas de lenguaje poético.", "La última estrofa rompe la promesa: esas golondrinas, las que aprendieron nuestros nombres, no volverán."]
        en: ["Bécquer writes 'volverán las oscuras golondrinas', not 'las golondrinas oscuras volverán'.", "The adjective before the noun and the verb at the start are marks of poetic language.", "The last stanza breaks the promise: those swallows, the ones that learnt our names, will not return."]
        grammar: [g.literary-language]
        vocab: [w.golondrina, w.estrofa, w.poetico, w.adjetivo]
  - id: c1.u08.l2
    title: La heroica ciudad dormía la siesta
    teach: [g.narrative-tenses-literary]
    vocab: [w.omnisciente, w.narrativa, w.estilo, w.siesta, w.aldea, w.caminante, w.viajero, w.sendero, w.llanura, w.arroyo, w.olmo, w.encina, w.serpiente, w.cazador, w.cazar, w.escopeta, w.orilla, w.barca, w.arena, w.niebla, w.llama, w.escalofrio, w.pluma, w.almohadon, w.heroico, w.luna-de-miel, w.detenerse, w.moverse, w.preterito]
    tip: "Writers play with tense: the historical present (En 1605 Cervantes publica el Quijote) gives immediacy; the imperfect can narrate a sudden event (Al día siguiente moría el rey); free indirect style borrows the character's voice without dijo que."
    sentences:
      - { es: "«La heroica ciudad dormía la siesta» (Clarín): con un imperfecto y una ironía empieza La Regenta.", en: "'The heroic city was taking its siesta' (Clarín): La Regenta begins with an imperfect and an irony.", grammar: [g.narrative-tenses-literary, g.quotation], vocab: [w.heroico, w.ciudad, w.siesta, w.ironia], note: "The narrator is omniscient and ironic: the city is anything but heroic." }
      - { es: "Cervantes publica la primera parte del Quijote en 1605 y muere en 1616, el mismo año que Shakespeare.", en: "Cervantes publishes the first part of Don Quixote in 1605 and dies in 1616, the same year as Shakespeare.", grammar: [g.narrative-tenses-literary], vocab: [w.publicar, w.morir, w.ano], note: "Historical present." }
      - { es: "«Su luna de miel fue un largo escalofrío» (Quiroga): una sola frase anuncia todo el cuento.", en: "'Their honeymoon was one long shiver' (Quiroga): a single sentence announces the whole story.", grammar: [g.narrative-tenses-literary, g.quotation], vocab: [w.luna-de-miel, w.escalofrio, w.cuento], note: "El almohadón de plumas (1907)." }
      - { es: "Se detuvo en la orilla. ¿Y si la barca no volvía? ¿Y si nadie había oído sus gritos?", en: "She stopped on the bank. What if the boat didn't come back? What if nobody had heard her shouts?", grammar: [g.narrative-tenses-literary], vocab: [w.detenerse, w.orilla, w.barca, w.grito], note: "Free indirect style: the questions are the character's, not the narrator's." }
      - { es: "Diez años después, la aldea era un desierto de arena y niebla; de los olmos no quedaba ni uno.", en: "Ten years later, the village was a desert of sand and fog; of the elms not a single one remained.", grammar: [g.narrative-tenses-literary], vocab: [w.aldea, w.desierto, w.arena, w.niebla, w.olmo] }
      - { es: "El cazador tendría cincuenta años; caminaba despacio, con la escopeta al hombro, sin mirar el sendero.", en: "The hunter must have been about fifty; he walked slowly, his shotgun on his shoulder, without looking at the path.", grammar: [g.narrative-tenses-literary, g.future-conditional-probability], vocab: [w.cazador, w.escopeta, w.hombro, w.sendero] }
      - { es: "Al día siguiente moría el viejo hidalgo, y con él moría un mundo.", en: "The next day the old hidalgo died, and with him a world died.", grammar: [g.narrative-tenses-literary], vocab: [w.morir, w.hidalgo, w.mundo], note: "Dramatic imperfect for a sudden event." }
      - { es: "El narrador omnisciente lo sabe todo: lo que el viajero piensa, lo que la serpiente espera entre las encinas.", en: "The omniscient narrator knows everything: what the traveller is thinking, what the snake is waiting for among the holm oaks.", grammar: [g.narrative-tenses-literary], vocab: [w.narrador, w.omnisciente, w.viajero, w.serpiente, w.encina] }
      - { es: "En estilo indirecto libre, el narrador presta su voz al personaje: no dice «pensó que estaba perdido», sino «Estaba perdido. Nadie vendría».", en: "In free indirect style, the narrator lends his voice to the character: he doesn't say 'he thought he was lost', but 'He was lost. Nobody would come'.", grammar: [g.narrative-tenses-literary, g.quotation], vocab: [w.estilo, w.narrador, w.voz, w.personaje] }
      - { es: "Según algunas fuentes, Galdós habría escrito el primer capítulo en una sola noche; es, probablemente, una leyenda.", en: "According to some sources, Galdós allegedly wrote the first chapter in a single night; it is probably a legend.", grammar: [g.narrative-tenses-literary], vocab: [w.fuente, w.capitulo, w.leyenda], note: "Conditional of rumour: habría escrito." }
      - { es: "El caminante que llegase a la aldea al anochecer no encontraría posada: todas cerraban al caer el sol.", en: "Any traveller who reached the village at nightfall would find no inn: they all closed at sunset.", grammar: [g.narrative-tenses-literary, g.relative-subjunctive], vocab: [w.caminante, w.aldea, w.anochecer], note: "-se form of the imperfect subjunctive, typical of literary prose." }
      - { es: "La narrativa de Quiroga está llena de selva, de víboras y de hombres que cazan solos en la orilla del río.", en: "Quiroga's fiction is full of jungle, vipers and men who hunt alone on the riverbank.", grammar: [g.narrative-tenses-literary], vocab: [w.narrativa, w.selva, w.cazar, w.orilla, w.rio] }
      - { es: "En 1492 Colón llegó a América.", en: "In 1492 Columbus reached America.", grammar: [g.narrative-tenses-literary], vocab: [w.llegar], transform: { instruction: "Rewrite in the historical present", answer: "En 1492 Colón llega a América.", alt: ["Colón llega a América en 1492."] } }
      - { es: "Ella encendió la llama y, en el almohadón de plumas, algo se movió.", en: "She lit the flame and, in the feather pillow, something moved.", grammar: [g.narrative-tenses-literary], vocab: [w.encender, w.llama, w.almohadon, w.pluma, w.moverse], error: { wrong: "Ella encendía la llama y, en el almohadón de plumas, algo se movía.", explain: "A sequence of completed events in narration takes the preterite (encendió, se movió); the imperfect would describe a background or habit.", grammar: g.narrative-tenses-literary } }
      - { es: "Cruzaron la llanura sin hablar; a lo lejos, un arroyo brillaba como una cuchilla.", en: "They crossed the plain without speaking; in the distance, a stream shone like a blade.", grammar: [g.narrative-tenses-literary], vocab: [w.cruzar, w.llanura, w.arroyo, w.brillar] }
      - { es: "¿Quién narra la historia? Si el narrador dice «yo» y no lo sabe todo, es un narrador testigo.", en: "Who narrates the story? If the narrator says 'I' and doesn't know everything, he is a witness narrator.", grammar: [g.narrative-tenses-literary], vocab: [w.narrar, w.narrador, w.historia, w.testigo] }
    exchanges:
      - q: { es: "¿Por qué está el verbo en presente si habla de 1605?", en: "Why is the verb in the present if it's talking about 1605?" }
        a: { es: "Es el presente histórico: acerca los hechos al lector.", en: "It's the historical present: it brings the events closer to the reader." }
        alt: ["Es un presente histórico."]
        grammar: [g.narrative-tenses-literary]
        vocab: [w.lector]
      - q: { es: "¿Quién piensa «¿y si no volvía?», el narrador o ella?", en: "Who thinks 'what if he didn't come back?', the narrator or her?" }
        a: { es: "Ella; el narrador solo le presta la voz. Es estilo indirecto libre.", en: "Her; the narrator only lends her his voice. It's free indirect style." }
        alt: ["Ella: es estilo indirecto libre."]
        grammar: [g.narrative-tenses-literary]
        vocab: [w.narrador, w.estilo, w.voz]
      - q: { es: "¿Es cierto que Galdós escribió el capítulo en una noche?", en: "Is it true that Galdós wrote the chapter in one night?" }
        a: { es: "Lo habría escrito en una noche, según la leyenda; nadie lo ha demostrado.", en: "He allegedly wrote it in one night, according to legend; nobody has proved it." }
        alt: ["Eso dicen, pero nadie lo ha demostrado."]
        grammar: [g.narrative-tenses-literary]
        vocab: [w.leyenda, w.demostrar]
      - q: { es: "¿Cuántos años tendría el cazador?", en: "How old must the hunter have been?" }
        a: { es: "Tendría unos cincuenta; el texto no lo dice.", en: "He must have been about fifty; the text doesn't say." }
        alt: ["Unos cincuenta, supongo."]
        grammar: [g.narrative-tenses-literary, g.future-conditional-probability]
        vocab: [w.cazador]
    texts:
      - title: "Inicio de un cuento"
        es: ["La aldea dormía bajo la niebla.", "El viajero se detuvo en la orilla del arroyo y miró atrás: nadie lo seguía.", "¿Y si se había equivocado de sendero? Imposible; conocía cada encina de aquella llanura.", "Siguió andando. Al día siguiente, la aldea entera lo buscaba."]
        en: ["The village slept under the fog.", "The traveller stopped on the bank of the stream and looked back: nobody was following him.", "What if he had taken the wrong path? Impossible; he knew every holm oak on that plain.", "He kept walking. The next day, the whole village was looking for him."]
        grammar: [g.narrative-tenses-literary]
        vocab: [w.aldea, w.niebla, w.viajero, w.orilla, w.arroyo, w.sendero, w.encina, w.llanura]
      - title: "Ficha de lectura"
        es: ["Título: El almohadón de plumas, de Horacio Quiroga (1907).", "Narrador omnisciente; tiempo principal, el pretérito; estilo seco y preciso.", "Primera frase: «Su luna de miel fue un largo escalofrío»."]
        en: ["Title: The Feather Pillow, by Horacio Quiroga (1907).", "Omniscient narrator; main tense, the preterite; dry, precise style.", "First sentence: 'Their honeymoon was one long shiver'."]
        grammar: [g.narrative-tenses-literary, g.quotation]
        vocab: [w.almohadon, w.pluma, w.omnisciente, w.estilo, w.escalofrio]
  - id: c1.u08.l3
    title: Apenas hubo terminado
    teach: [g.preterite-anterior]
    vocab: [w.no-bien, w.partir, w.hallar, w.ponerse-en-marcha, w.criado, w.caballero, w.hidalgo, w.lanza, w.mendigo, w.limosna, w.miseria, w.cura, w.campana, w.duelo, w.posada]
    tip: "The pretérito anterior (hube, hubiste, hubo, hubimos, hubisteis, hubieron + participle) marks an action immediately before another in the past, after apenas, en cuanto, tan pronto como, cuando, no bien, luego que: Apenas hubo salido el sol, partieron. Recognise it in 19th-century prose; in speech use the preterite."
    sentences:
      - { es: "Apenas hubo terminado de hablar el cura, las campanas empezaron a sonar.", en: "Scarcely had the priest finished speaking when the bells began to ring.", altEs: ["Apenas terminó de hablar el cura, las campanas empezaron a sonar."], grammar: [g.preterite-anterior], vocab: [w.cura, w.campana, w.sonar, w.terminar] }
      - { es: "No bien hubo llegado el caballero a la posada, le pidieron que partiera de nuevo.", en: "No sooner had the gentleman arrived at the inn than they asked him to set off again.", grammar: [g.preterite-anterior], vocab: [w.no-bien, w.caballero, w.partir] }
      - { es: "Cuando el criado hubo cerrado la puerta, el hidalgo se dejó caer en la silla y lloró.", en: "When the servant had closed the door, the hidalgo let himself fall into the chair and wept.", grammar: [g.preterite-anterior], vocab: [w.criado, w.hidalgo, w.cerrar, w.llorar] }
      - { es: "Tan pronto como hubieron firmado el testamento, los hermanos dejaron de hablarse.", en: "As soon as they had signed the will, the brothers stopped speaking to each other.", grammar: [g.preterite-anterior], vocab: [w.tan-pronto-como, w.firmar, w.testamento, w.dejar-de] }
      - { es: "El mendigo pidió limosna a la puerta de la iglesia y, en cuanto hubo recibido unas monedas, desapareció entre la niebla.", en: "The beggar asked for alms at the church door and, as soon as he had received a few coins, disappeared into the fog.", grammar: [g.preterite-anterior], vocab: [w.mendigo, w.limosna, w.iglesia, w.desaparecer] }
      - { es: "Luego que hubo amanecido, los dos hombres se pusieron en marcha hacia la aldea, lanza en mano.", en: "As soon as it had dawned, the two men set off towards the village, lance in hand.", grammar: [g.preterite-anterior, g.absolute-constructions], vocab: [w.amanecer, w.ponerse-en-marcha, w.aldea, w.lanza, w.en-mano] }
      - { es: "¿Hubo salido ya el sol cuando partieron? Sí: «apenas hubo salido el sol, partieron», dice el texto.", en: "Had the sun already risen when they left? Yes: 'scarcely had the sun risen when they set off', says the text.", grammar: [g.preterite-anterior, g.quotation], vocab: [w.sol, w.partir, w.salir] }
      - { es: "Hoy nadie dice «hube comido»; decimos «comí» o «había comido», y el pretérito anterior vive solo en los libros.", en: "Nobody says 'hube comido' today; we say 'comí' or 'había comido', and the pretérito anterior lives only in books.", grammar: [g.preterite-anterior], vocab: [w.comer, w.libro, w.vivir] }
      - { es: "Cuando hubo hallado la carta, comprendió la miseria en que había vivido su padre.", en: "When he had found the letter, he understood the poverty in which his father had lived.", grammar: [g.preterite-anterior, g.pluperfect], vocab: [w.hallar, w.carta, w.comprender, w.miseria] }
      - { es: "Apenas hubo terminado el duelo, el vencedor hincó la rodilla junto al hombre caído.", en: "Scarcely had the duel ended when the victor knelt beside the fallen man.", grammar: [g.preterite-anterior], vocab: [w.duelo, w.vencer, w.rodilla] }
      - { es: "Apenas hubo terminado la cena, se despidió sin dar explicaciones.", en: "As soon as dinner was over, he said goodbye without giving any explanation.", grammar: [g.preterite-anterior], vocab: [w.cena, w.despedirse, w.explicacion], error: { wrong: "Apenas hubo terminando la cena, se despidió sin dar explicaciones.", explain: "The pretérito anterior is hubo + participle (terminado), never a gerund.", grammar: g.preterite-anterior } }
      - { es: "En cuanto el cura terminó la misa, los vecinos salieron a la plaza.", en: "As soon as the priest finished mass, the neighbours went out into the square.", grammar: [g.preterite-anterior], vocab: [w.cura, w.vecino, w.plaza], transform: { instruction: "Rewrite in literary style with the pretérito anterior", answer: "En cuanto el cura hubo terminado la misa, los vecinos salieron a la plaza.", alt: ["Apenas hubo terminado el cura la misa, los vecinos salieron a la plaza."] } }
      - { es: "El hidalgo, que no tenía más riqueza que su honor y su lanza, no bien hubo oído la ofensa, pidió un duelo.", en: "The hidalgo, who had no wealth but his honour and his lance, no sooner had heard the insult than he demanded a duel.", grammar: [g.preterite-anterior, g.subordination-complex], vocab: [w.hidalgo, w.riqueza, w.lanza, w.no-bien, w.duelo] }
      - { es: "El criado halló al caballero muerto en el jardín; nadie supo nunca quién lo había matado.", en: "The servant found the gentleman dead in the garden; nobody ever knew who had killed him.", grammar: [g.preterite-anterior, g.pluperfect], vocab: [w.criado, w.hallar, w.caballero] }
      - { es: "¡Qué miseria la de aquellos pueblos, donde el cura era el único que sabía leer!", en: "What poverty there was in those villages, where the priest was the only one who could read!", grammar: [g.preterite-anterior], vocab: [w.miseria, w.pueblo, w.cura, w.leer] }
    exchanges:
      - q: { es: "¿Qué significa «hubo terminado»?", en: "What does 'hubo terminado' mean?" }
        a: { es: "Lo mismo que «terminó», pero marca que la otra acción ocurrió justo después.", en: "The same as 'terminó', but it marks that the other action happened immediately afterwards." }
        alt: ["Es como «terminó», en estilo literario."]
        grammar: [g.preterite-anterior]
        vocab: [w.terminar]
      - q: { es: "¿Se usa el pretérito anterior al hablar?", en: "Is the pretérito anterior used in speech?" }
        a: { es: "Casi nunca; hoy decimos «apenas llegó» o «cuando había llegado».", en: "Almost never; today we say 'apenas llegó' or 'cuando había llegado'." }
        alt: ["No, solo en los libros."]
        grammar: [g.preterite-anterior]
        vocab: [w.hablar, w.libro]
      - q: { es: "¿Cuándo partieron los caballeros?", en: "When did the gentlemen set off?" }
        a: { es: "Apenas hubo amanecido, según cuenta el narrador.", en: "As soon as it had dawned, according to the narrator." }
        alt: ["Al amanecer."]
        grammar: [g.preterite-anterior]
        vocab: [w.partir, w.amanecer, w.caballero]
      - q: { es: "¿Qué hizo el mendigo con la limosna?", en: "What did the beggar do with the alms?" }
        a: { es: "No bien la hubo recibido, desapareció entre la niebla.", en: "No sooner had he received it than he disappeared into the fog." }
        alt: ["Desapareció en cuanto la recibió."]
        grammar: [g.preterite-anterior]
        vocab: [w.mendigo, w.limosna, w.no-bien]
    texts:
      - title: "Fragmento de una novela del siglo XIX"
        es: ["Apenas hubo sonado la campana, el criado abrió la puerta de la posada.", "Entró un caballero cubierto de polvo, que pidió una cama y silencio.", "No bien se hubo sentado, llamaron de nuevo: era un mendigo que pedía limosna.", "El caballero le dio su última moneda y, cuando el hombre hubo partido, se quedó mirando la niebla."]
        en: ["Scarcely had the bell rung when the servant opened the door of the inn.", "A gentleman covered in dust came in and asked for a bed and silence.", "No sooner had he sat down than there was another knock: it was a beggar asking for alms.", "The gentleman gave him his last coin and, when the man had left, stayed there staring at the fog."]
        grammar: [g.preterite-anterior]
        vocab: [w.campana, w.criado, w.caballero, w.no-bien, w.mendigo, w.limosna, w.partir, w.niebla]
  - id: c1.u08.l4
    title: Poderoso caballero es don Dinero
    teach: [g.literary-language]
    vocab: [w.mas, w.acaso, w.antano, w.doquier, w.princesa, w.dorado, w.divino, w.tesoro, w.fresa, w.cisne, w.mariposa, w.rosa.n, w.dichoso, w.pesadumbre, w.poderoso, w.muro, w.patria, w.eterno, w.fugaz, w.en-vano, w.franco, w.sabio, w.necio, w.locura, w.clasico, w.romanticismo, w.realismo, w.modernismo, w.obra-maestra]
    tip: "Classic texts keep words that everyday Spanish has lost: mas (pero), acaso (quizá), antaño (en otro tiempo), doquier (en todas partes), harto (muy), cual (como), and attach pronouns to the verb (quedóse, veíase). Learn to read them, not to use them."
    sentences:
      - { es: "«La princesa está triste… ¿qué tendrá la princesa? Los suspiros se escapan de su boca de fresa» (Rubén Darío).", en: "'The princess is sad… what can be the matter with the princess? Sighs escape from her strawberry mouth' (Rubén Darío).", grammar: [g.literary-language, g.quotation, g.future-conditional-probability], vocab: [w.princesa, w.suspiro, w.fresa], note: "Sonatina (1896), a masterpiece of modernismo." }
      - { es: "«Juventud, divino tesoro, ¡ya te vas para no volver!» —escribe Darío—. «Cuando quiero llorar, no lloro… y a veces lloro sin querer».", en: "'Youth, divine treasure, you are leaving, never to return!' writes Darío. 'When I want to cry, I don't cry… and sometimes I cry without meaning to'.", grammar: [g.literary-language, g.quotation], vocab: [w.juventud, w.divino, w.tesoro, w.llorar] }
      - { es: "«Dichoso el árbol, que es apenas sensitivo, […] pues no hay dolor más grande que el dolor de ser vivo, ni mayor pesadumbre que la vida consciente».", en: "'Happy the tree, which is barely sentient, […] for there is no greater pain than the pain of being alive, nor greater sorrow than conscious life'.", grammar: [g.literary-language, g.quotation], vocab: [w.dichoso, w.arbol, w.dolor, w.pesadumbre, w.consciente], note: "Darío, Lo fatal." }
      - { es: "«En un lugar de la Mancha, de cuyo nombre no quiero acordarme, no ha mucho tiempo que vivía un hidalgo…»: así empieza la obra maestra de Cervantes.", en: "'In a village of La Mancha, the name of which I have no desire to call to mind, not long ago there lived a hidalgo…': so begins Cervantes' masterpiece.", grammar: [g.literary-language, g.quotation], vocab: [w.lugar, w.cuyo, w.acordarse, w.hidalgo, w.obra-maestra], note: "no ha mucho tiempo = no hace mucho tiempo (archaic haber for hacer)." }
      - { es: "«Poderoso caballero es don Dinero», escribió Quevedo hace cuatro siglos, y la frase sigue siendo verdad.", en: "'A powerful gentleman is Sir Money', Quevedo wrote four centuries ago, and the phrase is still true.", grammar: [g.literary-language, g.quotation], vocab: [w.poderoso, w.caballero, w.don, w.dinero, w.siglo] }
      - { es: "«Miré los muros de la patria mía, si un tiempo fuertes, ya desmoronados» (Quevedo): el poeta ve en las ruinas su propia vejez.", en: "'I looked upon the walls of my homeland, once strong, now crumbling' (Quevedo): the poet sees his own old age in the ruins.", grammar: [g.literary-language, g.quotation], vocab: [w.muro, w.patria, w.fuerte, w.vejez], note: "la patria mía = mi patria: possessive after the noun is literary." }
      - { es: "«¿Qué es la vida? Un frenesí. ¿Qué es la vida? Una ilusión, una sombra, una ficción… que toda la vida es sueño, y los sueños, sueños son» (Calderón).", en: "'What is life? A frenzy. What is life? An illusion, a shadow, a fiction… for all of life is a dream, and dreams are only dreams' (Calderón).", grammar: [g.literary-language, g.quotation], vocab: [w.vida, w.ilusion, w.sombra, w.sueno], note: "La vida es sueño (1635). The final verb-last order (sueños son) is a hipérbaton." }
      - { es: "«Cultivo una rosa blanca, en julio como en enero, para el amigo sincero que me da su mano franca» (José Martí).", en: "'I grow a white rose, in July as in January, for the sincere friend who gives me his open hand' (José Martí).", grammar: [g.literary-language, g.quotation], vocab: [w.rosa.n, w.sincero, w.franco, w.mano], note: "Versos sencillos (1891)." }
      - { es: "Antaño los poetas comparaban a la amada con un cisne o una mariposa; hoy, acaso, con un mensaje sin respuesta.", en: "In the old days poets compared the beloved to a swan or a butterfly; today, perhaps, to an unanswered message.", grammar: [g.literary-language], vocab: [w.antano, w.comparar, w.cisne, w.mariposa, w.acaso] }
      - { es: "Era la noche oscura y fría; mas él no sentía el frío, porque por doquier lo seguía el recuerdo de ella.", en: "The night was dark and cold; but he did not feel the cold, because everywhere the memory of her followed him.", grammar: [g.literary-language], vocab: [w.mas, w.frio, w.doquier, w.recuerdo], note: "mas = pero; doquier = en todas partes." }
      - { es: "El Romanticismo busca lo eterno en lo fugaz; el Realismo, en cambio, describe la calle, la miseria y el dinero.", en: "Romanticism seeks the eternal in the fleeting; Realism, on the other hand, describes the street, poverty and money.", grammar: [g.literary-language], vocab: [w.romanticismo, w.eterno, w.fugaz, w.realismo, w.describir] }
      - { es: "El Modernismo de Darío llena los versos de oro, cisnes y princesas; es un mundo dorado que sabe que va a morir.", en: "Darío's modernismo fills its lines with gold, swans and princesses; it is a golden world that knows it is going to die.", grammar: [g.literary-language], vocab: [w.modernismo, w.oro, w.cisne, w.princesa, w.dorado] }
      - { es: "¿Fue don Quijote un necio o un sabio? Cervantes deja que el lector decida si su locura es en vano.", en: "Was Don Quixote a fool or a wise man? Cervantes lets the reader decide whether his madness is in vain.", grammar: [g.literary-language], vocab: [w.necio, w.sabio, w.lector, w.locura, w.en-vano] }
      - { es: "El poema es bello, pero demasiado largo.", en: "The poem is beautiful, but too long.", grammar: [g.literary-language], vocab: [w.poema, w.largo], transform: { instruction: "Rewrite in literary register replacing pero with mas and demasiado with harto", answer: "El poema es bello, mas harto largo.", alt: ["El poema es bello, mas demasiado largo."] } }
      - { es: "Quedóse un momento parado en la puerta, mirando al cielo.", en: "He stood still a moment in the doorway, looking at the sky.", grammar: [g.literary-language, g.pronoun-placement], vocab: [w.quedarse, w.momento, w.puerta, w.cielo], error: { wrong: "Se quedóse un momento parado en la puerta, mirando al cielo.", explain: "The pronoun goes either before the verb (se quedó) or attached after it in literary style (quedóse), never both.", grammar: g.literary-language }, note: "Unamuno, Niebla (1914): quedóse = se quedó." }
      - { es: "Leer a los clásicos no es un lujo de sabios, sino la manera más barata de viajar al pasado.", en: "Reading the classics isn't a luxury for the learned, but the cheapest way to travel to the past.", grammar: [g.literary-language], vocab: [w.clasico, w.lujo, w.sabio, w.pasado] }
    exchanges:
      - q: { es: "¿Qué significa «mas» sin tilde en un texto antiguo?", en: "What does 'mas' without an accent mean in an old text?" }
        a: { es: "Significa «pero»; con tilde, «más» es la cantidad.", en: "It means 'but'; with the accent, 'más' is the quantity." }
        alt: ["Es «pero» en estilo literario."]
        grammar: [g.literary-language]
        vocab: [w.mas, w.tilde]
      - q: { es: "¿Por qué está triste la princesa de Darío?", en: "Why is Darío's princess sad?" }
        a: { es: "El poema no lo dice; acaso porque vive en un palacio de oro y no puede salir.", en: "The poem doesn't say; perhaps because she lives in a palace of gold and cannot leave." }
        alt: ["No se sabe; quizá porque no puede salir del palacio."]
        grammar: [g.literary-language]
        vocab: [w.princesa, w.acaso, w.palacio, w.oro]
      - q: { es: "¿Qué quiere decir Quevedo con «poderoso caballero es don Dinero»?", en: "What does Quevedo mean by 'a powerful gentleman is Sir Money'?" }
        a: { es: "Que el dinero manda más que cualquier noble; es una sátira.", en: "That money rules more than any nobleman; it's a satire." }
        alt: ["Que el dinero lo puede todo."]
        grammar: [g.literary-language]
        vocab: [w.poderoso, w.dinero]
      - q: { es: "¿Cuál es la obra maestra de Calderón?", en: "What is Calderón's masterpiece?" }
        a: { es: "La vida es sueño, donde los sueños, sueños son.", en: "Life is a Dream, where dreams are only dreams." }
        alt: ["La vida es sueño."]
        grammar: [g.literary-language]
        vocab: [w.obra-maestra, w.sueno]
    texts:
      - title: "Entrada de una enciclopedia escolar"
        es: ["Rubén Darío (1867–1916), poeta nicaragüense, es la gran figura del Modernismo.", "Sus versos, llenos de cisnes, princesas y oro, buscan la belleza por encima de todo.", "Mas tras el mundo dorado se esconde la pesadumbre de Lo fatal: el dolor de ser vivo."]
        en: ["Rubén Darío (1867–1916), a Nicaraguan poet, is the great figure of modernismo.", "His lines, full of swans, princesses and gold, seek beauty above all else.", "But behind the golden world hides the sorrow of Lo fatal: the pain of being alive."]
        grammar: [g.literary-language]
        vocab: [w.poeta, w.modernismo, w.cisne, w.princesa, w.dorado, w.pesadumbre]
      - title: "Mensaje a un compañero de clase"
        es: ["Oye, para el examen de literatura hay que saber tres frases famosas.", "La de Cervantes del lugar de la Mancha, la de Quevedo de don Dinero y la de Calderón de los sueños.", "Y acuérdate: «mas» sin tilde es «pero», no «más»."]
        en: ["Hey, for the literature exam we have to know three famous sentences.", "Cervantes' about the village of La Mancha, Quevedo's about Sir Money and Calderón's about dreams.", "And remember: 'mas' without an accent is 'but', not 'more'."]
        grammar: [g.literary-language]
        vocab: [w.literatura, w.mas, w.tilde]
dialogues:
  - id: c1.u08.d1
    title: Club de lectura
    context: Inés and Tomás, members of a reading club, discuss the Bécquer poems and the Quiroga story they read that month.
    lines:
      - { speaker: Inés, es: "¿Qué te han parecido las Rimas? A mí la de las golondrinas me ha dejado un suspiro en el pecho.", en: "What did you think of the Rimas? The one about the swallows left a sigh in my chest." }
      - { speaker: Tomás, es: "Melancólica, sin duda, mas no triste. Lo que me fascina es el orden de las palabras: «en tu balcón sus nidos a colgar».", en: "Melancholy, no doubt, but not sad. What fascinates me is the word order: 'on your balcony their nests to hang'." }
      - { speaker: Inés, es: "Es un hipérbaton. En prosa diríamos «volverán a colgar sus nidos en tu balcón», y se perdería toda la música.", en: "It's a hyperbaton. In prose we'd say 'they'll return to hang their nests on your balcony', and all the music would be lost." }
      - { speaker: Tomás, es: "Y luego está Quiroga: «Su luna de miel fue un largo escalofrío». Apenas hube leído esa frase, supe que el cuento acabaría mal.", en: "And then there's Quiroga: 'Their honeymoon was one long shiver'. Scarcely had I read that sentence when I knew the story would end badly." }
      - { speaker: Inés, es: "¡Mira que usas el pretérito anterior para presumir! Nadie dice «hube leído» desde el siglo XIX.", en: "Look at you using the pretérito anterior to show off! Nobody has said 'hube leído' since the nineteenth century." }
      - { speaker: Tomás, es: "Es que me he leído medio Galdós este mes; se me pega el estilo. Volviendo al cuento: ¿quién narra, en tu opinión?", en: "The thing is I've read half of Galdós this month; the style rubs off on me. Back to the story: who narrates, in your opinion?" }
      - { speaker: Inés, es: "Un narrador omnisciente, frío como un médico. Cuando Alicia piensa «¿y si no volvía?», es estilo indirecto libre: la voz es de ella.", en: "An omniscient narrator, cold as a doctor. When Alicia thinks 'what if he didn't come back?', it's free indirect style: the voice is hers." }
      - { speaker: Tomás, es: "Y el almohadón de plumas es una metáfora de la casa entera: blanco, suave y lleno de algo que la mata poco a poco.", en: "And the feather pillow is a metaphor for the whole house: white, soft and full of something that kills her little by little." }
      - { speaker: Inés, es: "Para el mes que viene propongo a Darío: la princesa triste, el cisne, el oro. Un mundo dorado que sabe que va a morir.", en: "For next month I propose Darío: the sad princess, the swan, the gold. A golden world that knows it's going to die." }
      - { speaker: Tomás, es: "Acepto, con una condición: que acabemos con Quevedo. Dichoso el club que lee a don Dinero sin tener ni un euro.", en: "I accept, on one condition: that we finish with Quevedo. Happy the club that reads Sir Money without having a single euro." }
