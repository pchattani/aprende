id: r.a2.une-journee-a-giverny
level: a2
title: Je suis allée à Giverny
kind: text
intro: Camille tells her friend about a day trip from Paris to Giverny, the village where Claude Monet lived and painted his famous water lilies.
allow: [vernon, monet, inès, centre]
paragraphs:
  - { es: "Chère Inès,", en: "Dear Inès," }
  - { es: "Mardi, je suis allée à Giverny avec ma mère. Nous sommes parties de Paris très tôt, à huit heures. Nous sommes montées dans le train à la gare Saint-Lazare et nous sommes descendues à Vernon. Ensuite, nous avons pris une navette jusqu'au village. Le voyage n'a pas duré longtemps : une heure environ.", en: "On Tuesday I went to Giverny with my mother. We left Paris very early, at eight o'clock. We got on the train at Saint-Lazare station and got off at Vernon. Then we took a shuttle bus to the village. The journey didn't take long: about an hour." }
  - { es: "Le peintre Claude Monet est arrivé à Giverny en 1883 et il est resté dans cette maison jusqu'à sa mort, en 1926. Il a créé un grand jardin avec des fleurs de toutes les couleurs, et un étang avec des nénuphars. Il a peint ces nénuphars pendant presque trente ans ! Les tableaux s'appellent les « Nymphéas ».", en: "The painter Claude Monet arrived in Giverny in 1883 and stayed in this house until his death in 1926. He created a big garden with flowers of every colour, and a pond with water lilies. He painted these water lilies for almost thirty years! The paintings are called the 'Nymphéas'." }
  - { es: "D'abord, nous sommes entrées dans la maison. Elle est rose avec des fenêtres vertes. La cuisine est toute bleue et la salle à manger toute jaune. C'est très joli ! Après, nous sommes allées dans le jardin. Il y avait des roses, des tulipes et beaucoup d'autres fleurs. Ma mère a pris cent photos !", en: "First we went into the house. It's pink with green windows. The kitchen is all blue and the dining room all yellow. It's very pretty! Afterwards we went into the garden. There were roses, tulips and lots of other flowers. My mother took a hundred photos!" }
  - { es: "Ensuite, nous sommes passées sous la route pour voir l'étang. Il y a un petit pont vert japonais et des arbres au-dessus de l'eau. Nous sommes restées longtemps sur le pont. C'est exactement comme sur les tableaux ! Mais il y avait beaucoup de touristes, et ils voulaient tous une photo sur le pont…", en: "Then we went under the road to see the pond. There's a little green Japanese bridge and trees over the water. We stayed on the bridge for a long time. It's exactly like in the paintings! But there were lots of tourists, and they all wanted a photo on the bridge…" }
  - { es: "À midi, nous avons pique-niqué près de la rivière. L'après-midi, il a commencé à pleuvoir, alors nous sommes rentrées plus tôt. Dans le train, ma mère s'est endormie tout de suite. Moi, j'ai regardé les photos.", en: "At noon we had a picnic near the river. In the afternoon it started to rain, so we went home earlier. On the train my mother fell asleep straight away. I looked at the photos." }
  - { es: "Le jardin est ouvert d'avril à octobre. Tu dois y aller au printemps, quand il y a toutes les fleurs. Et va tôt le matin, avant les touristes !", en: "The garden is open from April to October. You must go in spring, when all the flowers are out. And go early in the morning, before the tourists!" }
  - { es: "Grosses bises, Camille", en: "Lots of love, Camille" }
questions:
  - { q: "Comment sont-elles allées à Giverny ?", options: ["En voiture", "En train, puis en navette", "À vélo"], answer: 1, explain: "They took the train from Saint-Lazare to Vernon, then «une navette jusqu'au village»." }
  - { q: "Combien de temps Monet a-t-il habité à Giverny ?", options: ["De 1883 à 1926", "Pendant trois ans", "De 1926 à 1950"], answer: 0, explain: "He arrived «en 1883» and stayed «jusqu'à sa mort, en 1926»." }
  - { q: "De quelle couleur est la cuisine ?", options: ["Jaune", "Rose", "Bleue"], answer: 2, explain: "«La cuisine est toute bleue et la salle à manger toute jaune.» The house itself is pink." }
  - { q: "Quel était le problème sur le pont japonais ?", options: ["Il était fermé", "Il y avait beaucoup de touristes", "Il pleuvait"], answer: 1, explain: "«Il y avait beaucoup de touristes, et ils voulaient tous une photo sur le pont.»" }
  - { q: "Quel conseil donne Camille à Inès ?", options: ["Aller au printemps, tôt le matin", "Aller en hiver", "Aller le soir"], answer: 0, explain: "«Tu dois y aller au printemps… Et va tôt le matin, avant les touristes !»" }
glossary:
  - { es: tulipes, en: tulips }
  - { es: au-dessus, en: above }
  - { es: endormie, en: asleep }
  - { es: pique-niqué, en: had a picnic }
  - { es: "grosses bises", en: "lots of love (end of a letter)" }
