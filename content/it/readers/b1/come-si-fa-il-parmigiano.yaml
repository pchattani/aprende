id: r.b1.come-si-fa-il-parmigiano
level: b1
title: Come si fa il Parmigiano
kind: text
intro: A visit to a dairy near Parma, where Parmigiano Reggiano is still made the traditional way. The guide's explanation is full of the impersonal si and the si passivante (si usa, si mettono, si lascia).
allow: [spino, parmigiano, reggiano, parma, reggio, emilia, modena, mantova, reno, giorgio, dop]
paragraphs:
  - { es: "Sono le sei di mattina e nel caseificio di Giorgio fa già caldo. Davanti a noi ci sono grandi caldaie di rame, piene di latte. «Qui si lavora tutti i giorni dell'anno, anche a Natale,» ci spiega Giorgio, che fa il casaro da trent'anni. «Le mucche non vanno in vacanza, e il latte non può aspettare.»", en: "It's six in the morning and it's already hot in Giorgio's dairy. In front of us there are big copper vats full of milk. 'Here we work every day of the year, even at Christmas,' Giorgio explains, who has been a cheesemaker for thirty years. 'The cows don't go on holiday, and the milk can't wait.'" }
  - { es: "Il Parmigiano Reggiano si può produrre solo in una zona precisa: le province di Parma, Reggio Emilia e Modena, e una parte di quelle di Bologna e di Mantova. Per fare il formaggio si usano solo tre ingredienti: latte, sale e caglio. Non si aggiunge niente altro. «Il segreto,» dice Giorgio, «è che non ci sono segreti. Ci vogliono solo buon latte, tempo e pazienza.»", en: "Parmigiano Reggiano can only be produced in a specific area: the provinces of Parma, Reggio Emilia and Modena, and part of those of Bologna and Mantua. Only three ingredients are used to make the cheese: milk, salt and rennet. Nothing else is added. 'The secret,' says Giorgio, 'is that there are no secrets. All you need is good milk, time and patience.'" }
  - { es: "Il latte della sera si lascia riposare tutta la notte, e la mattina si mescola con quello appena munto. Poi si scalda nelle caldaie e si aggiunge il caglio. Dopo pochi minuti il latte diventa una massa morbida, che si rompe in piccolissimi pezzi con un attrezzo antico chiamato «spino». Si scalda ancora, fino a cinquantacinque gradi, e i pezzi scendono sul fondo della caldaia.", en: "The evening milk is left to rest all night, and in the morning it's mixed with the freshly milked milk. Then it's heated in the vats and the rennet is added. After a few minutes the milk becomes a soft mass, which is broken into tiny pieces with an ancient tool called a 'spino'. It's heated again, to fifty-five degrees, and the pieces sink to the bottom of the vat." }
  - { es: "Questo è il momento più spettacolare. Due casari sollevano dal fondo una grande massa bianca con un telo, la tagliano in due e la mettono in due forme rotonde. Da ogni caldaia, infatti, si ottengono sempre due forme, che qui si chiamano «gemelle». Per fare una forma di circa quaranta chili ci vogliono più di cinquecento litri di latte.", en: "This is the most spectacular moment. Two cheesemakers lift a big white mass from the bottom with a cloth, cut it in two and put it into two round moulds. From each vat, in fact, you always get two wheels, which are called 'twins' here. To make a wheel of about forty kilos you need more than five hundred litres of milk." }
  - { es: "Dopo qualche giorno le forme si mettono in una vasca di acqua e sale, dove restano per circa tre settimane. Poi si portano nel magazzino, un'enorme sala dove migliaia di forme riposano su scaffali di legno alti fino al soffitto. Lì il formaggio deve stagionare almeno dodici mesi, ma il Parmigiano migliore si mangia dopo ventiquattro o trenta mesi.", en: "After a few days the wheels are put in a tank of salt water, where they stay for about three weeks. Then they're taken to the warehouse, an enormous room where thousands of wheels rest on wooden shelves reaching up to the ceiling. There the cheese has to age for at least twelve months, but the best Parmigiano is eaten after twenty-four or thirty months." }
  - { es: "Dopo dodici mesi arriva un esperto del Consorzio, che batte ogni forma con un piccolo martello e ascolta il suono. Se il suono non è perfetto, vuol dire che dentro c'è un difetto, e la forma non può essere venduta come Parmigiano Reggiano. «È come un medico che ascolta il cuore,» sorride Giorgio.", en: "After twelve months an expert from the Consortium arrives, who taps each wheel with a small hammer and listens to the sound. If the sound isn't perfect, it means there's a flaw inside, and the wheel can't be sold as Parmigiano Reggiano. 'It's like a doctor listening to your heart,' Giorgio smiles." }
  - { es: "Alla fine della visita si assaggia, naturalmente. Si prova un pezzo di dodici mesi, morbido e dolce, e uno di trenta, più duro e saporito, con quei piccoli cristalli bianchi che scricchiolano sotto i denti. Giorgio ci consiglia di mangiarlo con qualche goccia di aceto balsamico di Modena. Non si discute: ha ragione lui.", en: "At the end of the visit there's a tasting, of course. You try a piece aged twelve months, soft and sweet, and one aged thirty, harder and more flavourful, with those little white crystals that crunch between your teeth. Giorgio advises us to eat it with a few drops of balsamic vinegar from Modena. No arguments: he's right." }
questions:
  - { q: "Perché nel caseificio si lavora anche a Natale?", options: ["Perché ci sono molti turisti", "Perché le mucche producono latte ogni giorno", "Perché il formaggio deve essere venduto"], answer: 1, explain: "«Le mucche non vanno in vacanza, e il latte non può aspettare.»" }
  - { q: "Quali sono gli ingredienti del Parmigiano Reggiano?", options: ["Latte, sale e caglio", "Latte, panna e sale", "Latte, burro e aceto"], answer: 0, explain: "Only three ingredients: milk, salt and rennet." }
  - { q: "Perché le due forme si chiamano «gemelle»?", options: ["Perché nascono dalla stessa caldaia", "Perché pesano due chili", "Perché si mangiano insieme"], answer: 0, explain: "The curd from each vat is cut in two, giving two 'twin' wheels." }
  - { q: "Per quanto tempo deve stagionare almeno il Parmigiano?", options: ["Tre settimane", "Dodici mesi", "Trenta mesi"], answer: 1, explain: "«Il formaggio deve stagionare almeno dodici mesi.» Three weeks is the salt bath." }
  - { q: "Che cosa fa l'esperto del Consorzio?", options: ["Assaggia ogni forma", "Batte le forme con un martello e ascolta il suono", "Pesa il latte"], answer: 1, explain: "The sound of the hammer reveals any hidden flaw inside the wheel." }
