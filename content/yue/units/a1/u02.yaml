id: a1.u02
title: 我喺香港
lessons:
  - id: a1.u02.l1
    title: 我喺中環
    teach: [g.hai2-location]
    tip: "喺 (hai2) says where something is; 係 (hai6) says what or who it is. The 喺 + place phrase goes before the verb: 我喺中環返工."
    vocab: [w.hai2, w.zyu6, w.uk1-kei2, w.uk1, w.fong2, w.lau2, w.ni1-dou6, w.go2-dou6, w.bin1-dou6, w.dou6, w.hai2-dou6, w.hoeng1-gong2, w.hoeng1-gong2-dou2, w.gong2-dou2, w.zung1-waan4, w.waan1-zai2, w.tung4-lo4-waan1, w.soeng6-waan4, w.zi6-gei2, w.faan1-gung1, w.jap6-min6, w.gaan1, w.gung1-si1, w.ngan4-hong4, w.kan5, w.gong2-tit3, w.zaam6]
    sentences:
      - { es: "我而家喺中環。", en: "I'm in Central now.", altEs: ["我喺中環。", "我而家喺中環呀。"], grammar: [g.hai2-location], vocab: [w.hai2, w.zung1-waan4] }
      - { es: "你喺邊度呀？", en: "Where are you?", altEs: ["你而家喺邊度呀？", "你喺邊度？"], altEn: ["Where are you now?"], grammar: [g.hai2-location, g.question-words], vocab: [w.bin1-dou6] }
      - { es: "我喺屋企。", en: "I'm at home.", altEs: ["我喺屋企呀。"], grammar: [g.hai2-location], vocab: [w.uk1-kei2],
          transform: { instruction: "Make it negative", answer: "我唔喺屋企。" } }
      - { es: "佢住喺灣仔。", en: "She lives in Wan Chai.", altEs: ["佢喺灣仔住。"], altEn: ["He lives in Wan Chai."], grammar: [g.hai2-location], vocab: [w.zyu6, w.waan1-zai2],
          transform: { instruction: "Say that you live in Causeway Bay", answer: "我住喺銅鑼灣。", alt: ["我喺銅鑼灣住。"] } }
      - { es: "我喺中環返工。", en: "I work in Central.", altEs: ["我喺中環做嘢。"], grammar: [g.hai2-location], vocab: [w.hai2, w.zung1-waan4],
          error: { wrong: "我返工喺中環。", explain: "The 喺 + place phrase comes before the verb: 我喺中環返工.", grammar: g.hai2-location } }
      - { es: "陳生唔喺度。", en: "Mr Chan isn't here.", altEs: ["陳先生唔喺度。", "陳生而家唔喺度。"], grammar: [g.hai2-location, g.m-negation], vocab: [w.hai2-dou6], note: "A very common phrase on the phone and at the office." }
      - { es: "我屋企喺上環。", en: "My home is in Sheung Wan.", altEs: ["我屋企喺上環呀。", "我住喺上環。"], altEn: ["I live in Sheung Wan."], grammar: [g.hai2-location], vocab: [w.uk1-kei2, w.soeng6-waan4] }
      - { es: "呢度係中環，嗰度係上環。", en: "This is Central and over there is Sheung Wan.", altEs: ["呢度係中環，嗰邊係上環。"], grammar: [g.hai6-identity, g.demonstratives], vocab: [w.ni1-dou6, w.go2-dou6] }
      - { es: "我係香港人，我住喺香港島。", en: "I'm a Hongkonger and I live on Hong Kong Island.", altEs: ["我係香港人，住喺香港島。", "我係香港人，我住喺港島。"], grammar: [g.hai2-location, g.hai6-identity], vocab: [w.hoeng1-gong2-dou2],
          error: { wrong: "我喺香港人，我住喺香港島。", explain: "Identity takes 係 (hai6): 我係香港人. 喺 (hai2) is only for location.", grammar: g.hai2-location } }
      - { es: "佢喺房入面。", en: "He's in his room.", altEs: ["佢喺間房入面。"], altEn: ["She's in her room."], grammar: [g.hai2-location], vocab: [w.fong2] }
      - { es: "我自己一個人住。", en: "I live on my own.", altEs: ["我自己住。", "我一個人住。"], altEn: ["I live by myself."], grammar: [g.hai2-location], vocab: [w.zi6-gei2] }
      - { es: "我住喺十樓。", en: "I live on the tenth floor.", altEs: ["我喺十樓住。"], grammar: [g.hai2-location], vocab: [w.lau2], jp: "ngo5 zyu6 hai2 sap6 lau2" }
      - { es: "你哋喺邊度食飯呀？", en: "Where do you eat?", altEs: ["你哋喺邊度食飯？"], altEn: ["Where are you (all) eating?"], grammar: [g.hai2-location], vocab: [w.bin1-dou6] }
      - { es: "我哋喺銅鑼灣食飯。", en: "We eat in Causeway Bay.", altEs: ["我哋去銅鑼灣食飯。"], altEn: ["We're eating in Causeway Bay."], grammar: [g.hai2-location], vocab: [w.tung4-lo4-waan1] }
      - { es: "佢間屋喺港島。", en: "His flat is on Hong Kong Island.", altEs: ["佢屋企喺港島。"], altEn: ["Her flat is on Hong Kong Island.", "His house is on Hong Kong Island."], grammar: [g.hai2-location], vocab: [w.uk1, w.gong2-dou2] }
      - { es: "佢喺唔喺度呀？", en: "Is she here?", altEs: ["佢喺度嗎？"], altEn: ["Is he here?", "Is he in?"], grammar: [g.hai2-location, g.a-not-a-questions], vocab: [w.hai2-dou6, w.dou6], jp: "keoi5 hai2 m4 hai2 dou6 aa3" }
    exchanges:
      - q: { es: "你喺邊度呀？", en: "Where are you?" }
        a: { es: "我喺中環。", en: "I'm in Central." }
        alt: ["我喺屋企。", "喺中環。", "我而家喺銅鑼灣。"]
        grammar: [g.hai2-location]
        vocab: [w.bin1-dou6, w.zung1-waan4]
      - q: { es: "你住喺邊度呀？", en: "Where do you live?" }
        a: { es: "我住喺灣仔。", en: "I live in Wan Chai." }
        alt: ["灣仔。", "我喺灣仔住。"]
        grammar: [g.hai2-location]
        vocab: [w.zyu6, w.waan1-zai2]
      - q: { es: "陳生喺度嗎？", en: "Is Mr Chan in?" }
        a: { es: "唔喺度呀，佢喺公司。", en: "He's not here; he's at the office." }
        alt: ["佢唔喺度。", "喺度，等陣。"]
        grammar: [g.hai2-location, g.m-negation]
        vocab: [w.hai2-dou6]
      - q: { es: "你喺邊度返工呀？", en: "Where do you work?" }
        a: { es: "我喺中環返工。", en: "I work in Central." }
        alt: ["喺中環。", "中環。"]
        grammar: [g.hai2-location]
        vocab: [w.zung1-waan4]
      - q: { es: "你屋企喺邊度呀？", en: "Where's your home?" }
        a: { es: "喺上環。", en: "In Sheung Wan." }
        alt: ["我屋企喺上環。", "上環。"]
        grammar: [g.hai2-location]
        vocab: [w.uk1-kei2, w.soeng6-waan4]
    texts:
      - title: "WhatsApp"
        es: ["我而家喺中環。", "你喺邊度呀？", "我喺銀行門口等你。"]
        en: ["I'm in Central now.", "Where are you?", "I'm waiting for you at the entrance of the bank."]
        grammar: [g.hai2-location]
        vocab: [w.zung1-waan4, w.bin1-dou6]
      - title: "我"
        es: ["我叫Mandy，係香港人。", "我住喺銅鑼灣，喺中環返工。", "我屋企好細，不過好近港鐵站。"]
        en: ["My name is Mandy and I'm a Hongkonger.", "I live in Causeway Bay and work in Central.", "My home is very small, but it's very close to the MTR station."]
        grammar: [g.hai2-location, g.hai6-identity]
        vocab: [w.tung4-lo4-waan1, w.uk1-kei2]
    spicy:
      - { es: "我唔喺屋企，我喺你樓下。", en: "I'm not at home. I'm downstairs from you.", altEs: ["我而家唔喺屋企，我喺你樓下。"], grammar: [g.hai2-location], vocab: [w.uk1-kei2] }
      - { es: "你喺度，我就好開心。", en: "When you're here, I'm really happy.", altEs: ["有你喺度，我就好開心。"], grammar: [g.hai2-location], vocab: [w.hai2-dou6] }
      - { es: "你住喺邊度呀？近唔近我呀？", en: "Where do you live? Anywhere near me?", altEs: ["你住喺邊度？近唔近我屋企呀？"], grammar: [g.hai2-location], vocab: [w.zyu6] }
      - { es: "中環有好多人，不過我淨係睇到你。", en: "There are so many people in Central, but you're the only one I can see.", altEs: ["中環好多人，不過我淨係睇到你。"], grammar: [g.hai2-location], vocab: [w.zung1-waan4] }
      - { es: "你今晚喺唔喺屋企呀？我帶飯嚟。", en: "Are you home tonight? I'll bring dinner.", altEs: ["你今晚喺屋企嗎？我帶飯嚟。"], grammar: [g.hai2-location, g.a-not-a-questions], vocab: [w.uk1-kei2] }
  - id: a1.u02.l2
    title: 中環有好多銀行
    teach: [g.jau-have]
    tip: "有 is both 'have' and 'there is'. For 'there is', start with the place: 中環有好多銀行. Ask with 有冇…？"
    vocab: [w.jau5, w.jau5-mou5, w.sau2-gei1, w.din6-waa2, w.din6-nou5, w.ce1, w.je5, w.bou6, w.gaa3, w.hok6-haau6, w.dei6-fong1, w.daai6-haa6, w.zo6, w.cang4, w.san1, w.hou2-do1, w.sai2-sau2-gaan1, w.si6, w.si4-gaan3, w.gou1-lau4, w.zung6-jau5, w.caan1-teng1, w.waai6]
    sentences:
      - { es: "我有一部新手機。", en: "I have a new mobile phone.", altEs: ["我有部新手機。"], grammar: [g.jau-have, g.classifiers-intro], vocab: [w.jau5, w.sau2-gei1, w.bou6],
          transform: { instruction: "Ask whether he has a new phone", answer: "佢有冇新手機呀？", alt: ["佢有新手機嗎？", "佢有冇新手機？"] } }
      - { es: "你有冇電腦呀？", en: "Do you have a computer?", altEs: ["你有電腦嗎？", "你有冇電腦？"], grammar: [g.jau-have, g.a-not-a-questions], vocab: [w.jau5-mou5, w.din6-nou5],
          error: { wrong: "你有唔有電腦呀？", explain: "The question form of 有 is 有冇, never 有唔有.", grammar: g.jau-have } }
      - { es: "有，我有。", en: "Yes, I do.", altEs: ["有呀，我有。", "有。"], altEn: ["Yes, I have one."], grammar: [g.jau-have], vocab: [w.jau5] }
      - { es: "中環有好多銀行同公司。", en: "There are lots of banks and companies in Central.", altEs: ["中環有好多銀行同埋公司。"], altEn: ["Central has lots of banks and companies."], grammar: [g.jau-have], vocab: [w.ngan4-hong4, w.gung1-si1] }
      - { es: "呢度有冇銀行呀？", en: "Is there a bank here?", altEs: ["呢度有銀行嗎？", "附近有冇銀行呀？"], altEn: ["Is there a bank around here?"], grammar: [g.jau-have], vocab: [w.jau5-mou5, w.ngan4-hong4],
          transform: { instruction: "Ask about a school instead", answer: "呢度有冇學校呀？", alt: ["呢度有學校嗎？"] } }
      - { es: "嗰度有一間學校。", en: "There's a school over there.", altEs: ["嗰度有間學校。"], grammar: [g.jau-have, g.classifiers-intro], vocab: [w.hok6-haau6, w.gaan1] }
      - { es: "佢有一架車。", en: "He has a car.", altEs: ["佢有架車。"], altEn: ["She has a car."], grammar: [g.jau-have, g.classifiers-intro], vocab: [w.ce1, w.gaa3],
          transform: { instruction: "Make it negative", answer: "佢冇車。", alt: ["佢冇架車。"] } }
      - { es: "我哋公司喺嗰座大廈。", en: "Our company is in that building.", altEs: ["我哋間公司喺嗰座大廈。"], grammar: [g.hai2-location, g.dei-plural], vocab: [w.daai6-haa6, w.zo6] }
      - { es: "呢座大廈有四十層。", en: "This building has forty floors.", altEs: ["呢座大廈有四十層樓。"], grammar: [g.jau-have], vocab: [w.zo6, w.cang4], jp: "ni1 zo6 daai6 haa6 jau5 sei3 sap6 cang4",
          error: { wrong: "呢座大廈有四十個層。", explain: "層 is itself a measure word: 四十層, with no 個.", grammar: g.classifiers-intro } }
      - { es: "你有冇嘢食呀？", en: "Do you have anything to eat?", altEs: ["你有嘢食嗎？"], altEn: ["Have you got something to eat?"], grammar: [g.jau-have], vocab: [w.je5] }
      - { es: "我有兩部電話。", en: "I have two phones.", altEs: ["我有兩部手機。"], grammar: [g.jau-have, g.loeng-vs-ji], vocab: [w.din6-waa2, w.bou6] }
      - { es: "香港有好多好靚嘅地方。", en: "Hong Kong has lots of beautiful places.", altEs: ["香港有好多靚嘅地方。"], grammar: [g.jau-have], vocab: [w.dei6-fong1] }
      - { es: "佢間公司喺中環。", en: "Her company is in Central.", altEs: ["佢嘅公司喺中環。"], altEn: ["His company is in Central."], grammar: [g.hai2-location], vocab: [w.gung1-si1, w.gaan1] }
      - { es: "呢間銀行有冇洗手間呀？", en: "Does this bank have a toilet?", altEs: ["呢間銀行有洗手間嗎？"], grammar: [g.jau-have], vocab: [w.ngan4-hong4, w.gaan1], jp: "ni1 gaan1 ngan4 hong4 jau5 mou5 sai2 sau2 gaan1 aa3" }
      - { es: "我有電腦，冇電話。", en: "I have a computer, but no phone.", altEs: ["我有電腦，但係冇電話。"], grammar: [g.jau-have, g.mou-negation], vocab: [w.din6-nou5, w.din6-waa2] }
    exchanges:
      - q: { es: "你有冇手機呀？", en: "Do you have a mobile phone?" }
        a: { es: "有，我有兩部。", en: "Yes, I have two." }
        alt: ["有。", "冇呀。"]
        grammar: [g.jau-have]
        vocab: [w.sau2-gei1, w.bou6]
      - q: { es: "呢度有冇銀行呀？", en: "Is there a bank here?" }
        a: { es: "有，嗰度有一間。", en: "Yes, there's one over there." }
        alt: ["有，喺嗰度。", "冇呀。"]
        grammar: [g.jau-have]
        vocab: [w.ngan4-hong4, w.gaan1]
      - q: { es: "你有冇車呀？", en: "Do you have a car?" }
        a: { es: "冇，我坐港鐵。", en: "No, I take the MTR." }
        alt: ["有，我有一架。", "冇呀。"]
        grammar: [g.jau-have, g.mou-negation]
        vocab: [w.ce1]
      - q: { es: "你間公司喺邊度呀？", en: "Where's your company?" }
        a: { es: "喺中環，嗰座大廈。", en: "In Central, in that building." }
        alt: ["喺中環。", "中環。"]
        grammar: [g.hai2-location]
        vocab: [w.gung1-si1, w.daai6-haa6]
      - q: { es: "你有冇時間呀？", en: "Have you got a moment?" }
        a: { es: "有，乜嘢事呀？", en: "Yes, what's up?" }
        alt: ["有呀。", "冇呀，我好忙。"]
        grammar: [g.jau-have]
        vocab: [w.jau5-mou5]
    texts:
      - title: "中環"
        es: ["中環有好多高樓。", "呢度有銀行、公司，仲有好多餐廳。", "我哋公司喺嗰座大廈。"]
        en: ["Central has lots of tall buildings.", "There are banks and companies here, and lots of restaurants too.", "Our company is in that building."]
        grammar: [g.jau-have, g.hai2-location]
        vocab: [w.ngan4-hong4, w.gung1-si1, w.daai6-haa6]
      - title: "WhatsApp"
        es: ["你有冇電腦呀？", "我部電腦壞咗。", "唔該晒！"]
        en: ["Do you have a computer?", "My computer is broken.", "Thanks a lot!"]
        grammar: [g.jau-have]
        vocab: [w.din6-nou5]
    spicy:
      - { es: "我有一部新手機，不過冇你個電話號碼。", en: "I've got a new phone, but I don't have your number.", altEs: ["我有部新手機，不過冇你電話號碼。"], grammar: [g.jau-have, g.mou-negation], vocab: [w.sau2-gei1] }
      - { es: "你有冇男朋友呀？冇？好嘢！", en: "Do you have a boyfriend? No? Yay!", altEs: ["你有冇女朋友呀？冇？好嘢！"], altEn: ["Do you have a girlfriend? No? Yay!"], grammar: [g.jau-have], vocab: [w.jau5-mou5] }
      - { es: "中環有好多高樓，不過你最高。", en: "Central has lots of tall buildings, but you're the tallest.", altEs: ["中環好多高樓，不過你最高。"], grammar: [g.jau-have], vocab: [w.zung1-waan4] }
      - { es: "你有冇時間呀？我有好多時間。", jp: "nei5 jau5 mou5 si4 gaan3 aa3 ngo5 jau5 hou2 do1 si4 gaan3", en: "Do you have time? I've got plenty.", altEs: ["你有時間嗎？我有好多時間。"], grammar: [g.jau-have], vocab: [w.jau5-mou5] }
      - { es: "我冇車，不過我有八達通同成晚時間。", en: "I don't have a car, but I've got an Octopus card and all night.", altEs: ["我冇車，但係我有八達通同成晚時間。"], grammar: [g.jau-have, g.mou-negation], vocab: [w.ce1] }
  - id: a1.u02.l3
    title: 唔知、冇問題
    teach: [g.m-negation, g.mou-negation]
    tip: "唔 negates verbs and adjectives (唔知, 唔貴); 冇 means 'not have' or 'there isn't' (冇時間). Never say 唔有."
    vocab: [w.m4, w.m4-hai6, w.mou5, w.man6-tai4, w.zi1, w.m4-zi1, w.jung6, w.mou5-so2-wai6, w.mou5-din6, w.mou5-jan4, w.dou1-hai6, w.gaan2, w.daa2, w.sik1-gong2, w.soeng2.b, w.wan2]
    sentences:
      - { es: "我唔知。", en: "I don't know.", altEs: ["唔知呀。", "我唔知呀。"], grammar: [g.m-negation], vocab: [w.m4-zi1, w.zi1] }
      - { es: "佢唔係老師。", en: "She isn't a teacher.", altEs: ["佢唔係老師嚟㗎。"], altEn: ["He isn't a teacher."], grammar: [g.m-negation, g.hai6-identity], vocab: [w.m4-hai6],
          transform: { instruction: "Make it positive", answer: "佢係老師。" },
          error: { wrong: "佢冇係老師。", explain: "冇 means 'not have'. 'Isn't' is 唔係: 佢唔係老師.", grammar: g.mou-negation } }
      - { es: "我冇時間。", jp: "ngo5 mou5 si4 gaan3", en: "I don't have time.", altEs: ["我冇時間呀。"], altEn: ["I have no time."], grammar: [g.mou-negation], vocab: [w.mou5],
          transform: { instruction: "Make it positive", answer: "我有時間。" },
          error: { wrong: "我唔有時間。", explain: "The negative of 有 is always 冇, never 唔有.", grammar: g.mou-negation } }
      - { es: "呢度冇人。", en: "There's nobody here.", altEs: ["呢度一個人都冇。"], altEn: ["Nobody's here."], grammar: [g.mou-negation], vocab: [w.mou5-jan4] }
      - { es: "冇問題！", en: "No problem!", altEs: ["冇問題呀！"], grammar: [g.mou-negation], vocab: [w.mou5-man6-tai4] }
      - { es: "我部手機冇電。", en: "My phone's battery is dead.", altEs: ["我部手機冇電喇。"], altEn: ["My phone is out of battery."], grammar: [g.mou-negation, g.classifier-as-the], vocab: [w.mou5-din6] }
      - { es: "我唔用電腦。", en: "I don't use a computer.", altEs: ["我唔用電腦㗎。"], grammar: [g.m-negation], vocab: [w.jung6],
          transform: { instruction: "Say you don't use a mobile phone", answer: "我唔用手機。" } }
      - { es: "冇所謂，你揀啦。", en: "I don't mind, you choose.", altEs: ["冇所謂呀，你揀啦。", "你揀啦，冇所謂。"], altEn: ["Whatever you like, you choose."], grammar: [g.mou-negation], vocab: [w.mou5-so2-wai6] }
      - { es: "佢都係學生。", en: "She's a student too.", altEs: ["佢都係學生嚟㗎。"], altEn: ["He's a student too."], grammar: [g.dou-also, g.hai6-identity], vocab: [w.dou1-hai6] }
      - { es: "我唔住喺中環，我住喺灣仔。", en: "I don't live in Central, I live in Wan Chai.", altEs: ["我唔係住喺中環，我住喺灣仔。"], grammar: [g.m-negation, g.hai2-location], vocab: [w.m4] }
