id: r.a1.at-the-wan-chai-market
level: a1
title: 喺灣仔街市買餸
kind: dialogue
intro: On Sunday morning Ana goes shopping for food with Mandy's mother, Mrs Chan, at a wet market in Wan Chai. Listen to how they ask prices and how Mrs Chan bargains.
paragraphs:
  - { es: "星期日朝早九點，Ana同Mandy嘅媽媽陳太去灣仔街市買餸。街市好多人，好嘈。有好多舖頭，賣生果、菜、肉同魚。", en: "At nine on Sunday morning, Ana goes food shopping at the Wan Chai market with Mandy's mother, Mrs Chan. The market is very crowded and very noisy. There are lots of stalls selling fruit, vegetables, meat and fish." }
  - { es: "陳太：「Ana，你鍾唔鍾意食魚呀？」Ana：「鍾意！我好鍾意食魚。」陳太：「好，我哋先買魚。」", en: "Mrs Chan: \"Ana, do you like fish?\" Ana: \"Yes! I love fish.\" Mrs Chan: \"Good, let's buy the fish first.\"" }
  - { es: "陳太：「老闆，早晨！呢條魚幾錢呀？」老闆：「早晨，陳太！呢條六十蚊。嗰條細啲，四十五蚊。」", en: "Mrs Chan: \"Good morning! How much is this fish?\" Stallholder: \"Morning, Mrs Chan! This one is sixty dollars. That one is smaller, forty-five dollars.\"" }
  - { es: "陳太：「六十蚊？咁貴！五十蚊得唔得呀？」老闆：「好啦好啦，五十蚊啦。」陳太畀一張一百蚊，老闆找錢畀佢。", en: "Mrs Chan: \"Sixty dollars? That's expensive! Would fifty be OK?\" Stallholder: \"All right, all right, fifty then.\" Mrs Chan hands over a hundred-dollar note and the stallholder gives her the change." }
  - { es: "跟住佢哋去買菜。陳太：「呢啲白菜新唔新鮮呀？」老闆：「好新鮮，今朝嘅！一斤十二蚊。」陳太：「畀兩斤我啦，唔該。」", en: "Then they go to buy vegetables. Mrs Chan: \"Is this pak choi fresh?\" Stallholder: \"Very fresh, it came in this morning! Twelve dollars a catty.\" Mrs Chan: \"Give me two catties, please.\"" }
  - { es: "Ana想買生果。Ana：「唔該，我想要六個橙同一斤蘋果。幾多錢呀？」老闆：「六個橙二十蚊，一斤蘋果十八蚊，一共三十八蚊。」", en: "Ana wants to buy some fruit. Ana: \"Excuse me, I'd like six oranges and a catty of apples. How much is that?\" Stallholder: \"Six oranges are twenty dollars and a catty of apples is eighteen, thirty-eight dollars altogether.\"" }
  - { es: "Ana：「我冇散紙，得唔得呀？」佢畀一張一百蚊。老闆：「冇問題，我找錢畀你：六十二蚊。你嘅廣東話好叻喎！」Ana好開心：「多謝！」", en: "Ana: \"I don't have any change, is that OK?\" She hands over a hundred-dollar note. Stallholder: \"No problem, here is your change: sixty-two dollars. Your Cantonese is very good!\" Ana is delighted: \"Thank you!\"" }
  - { es: "最後，陳太仲買一斤豬肉同十隻雞蛋。陳太：「今晚我煮飯，你同Mandy一齊返嚟食啦！」Ana：「好呀！唔該晒，陳太！」", en: "Finally, Mrs Chan also buys a catty of pork and ten eggs. Mrs Chan: \"I'm cooking tonight, so you and Mandy come back and eat together!\" Ana: \"Great! Thank you so much, Mrs Chan!\"" }
questions:
  - { q: "條魚最後幾錢？", options: ["六十蚊", "五十蚊", "四十五蚊"], answer: 1, explain: "The stallholder asks sixty, but Mrs Chan bargains him down: 好啦好啦，五十蚊啦." }
  - { q: "陳太要幾多斤白菜？", options: ["一斤", "兩斤", "十二斤"], answer: 1, explain: "畀兩斤我啦: give me two catties. Twelve dollars is the price per catty." }
  - { q: "Ana買乜嘢生果？", options: ["橙同蘋果", "香蕉同橙", "蘋果同香蕉"], answer: 0, explain: "我想要六個橙同一斤蘋果." }
  - { q: "老闆要畀幾多錢Ana？", options: ["三十八蚊", "六十二蚊", "一百蚊"], answer: 1, explain: "The fruit costs 38 dollars and Ana pays with a 100-dollar note, so she gets 62 back: 我找錢畀你：六十二蚊." }
  - { q: "今晚邊個煮飯？", options: ["Ana", "Mandy", "陳太"], answer: 2, explain: "Mrs Chan says 今晚我煮飯." }
