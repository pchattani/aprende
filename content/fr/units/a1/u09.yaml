    sentences:
      - { es: "On va au cinéma ce soir ?", en: "Shall we go to the cinema tonight?", altEs: ["Nous allons au cinéma ce soir ?", "On va au cinéma, ce soir ?"], altEn: ["Are we going to the cinema tonight?", "Shall we go to the movies tonight?"], grammar: [g.on-nous, g.aller-present], vocab: [], error: { wrong: "On allons au cinéma ce soir ?", explain: "On always takes the il/elle form of the verb: on va, even when it means 'we'.", grammar: g.on-nous } }
      - { es: "Nous, on habite à Montmartre.", en: "We live in Montmartre.", altEs: ["Nous habitons à Montmartre."], altEn: ["As for us, we live in Montmartre."], grammar: [g.on-nous], vocab: [], note: "Nous, on… is a very common spoken way to stress 'we'." }
      - { es: "On y va ? — Allez, on y va !", en: "Shall we go? — Come on, let's go!", altEn: ["Are we going? — Come on, let's go!"], grammar: [g.on-nous], vocab: [w.on-y-va, w.allez] }
      - { es: "En France, on dîne vers vingt heures.", en: "In France, people have dinner around eight p.m.", altEn: ["In France, people eat dinner at about 8 pm.", "In France, we have dinner around eight in the evening."], grammar: [g.on-nous, g.time-telling], vocab: [] }
      - { es: "On fait les courses ensemble ?", en: "Shall we do the shopping together?", altEs: ["On fait les courses ensemble, alors ?"], grammar: [g.on-nous, g.faire-present], vocab: [w.ensemble], transform: { instruction: "Use nous instead of on", answer: "Nous faisons les courses ensemble ?", alt: ["Est-ce que nous faisons les courses ensemble ?"], en: "Shall we do the shopping together?" } }
      - { es: "J'ai une idée : on va au parc !", en: "I have an idea: let's go to the park!", altEs: ["J'ai une idée, on va au parc !"], altEn: ["I've got an idea: let's go to the park!"], grammar: [g.on-nous], vocab: [w.idée] }
      - { es: "Je propose une promenade sur les quais.", en: "I suggest a walk along the quays.", altEn: ["I suggest a walk on the quays."], grammar: [g.present-er], vocab: [w.proposer] }
      - { es: "Un café ? — Pourquoi pas !", en: "A coffee? — Why not!", altEs: ["Un café ? — Oui, pourquoi pas !"], grammar: [g.question-words], vocab: [w.pourquoi-pas] }
      - { es: "Tu penses qu'on va avoir le temps ?", en: "Do you think we'll have time?", altEs: ["Tu penses que nous allons avoir le temps ?", "Vous pensez qu'on va avoir le temps ?"], altEn: ["Do you think we're going to have time?"], grammar: [g.on-nous, g.futur-proche], vocab: [w.penser] }
      - { es: "On est contents d'être ici.", en: "We're happy to be here.", altEs: ["On est contentes d'être ici."], altEn: ["We're glad to be here."], grammar: [g.on-nous], vocab: [], transform: { instruction: "Use nous instead of on", answer: "Nous sommes contents d'être ici.", alt: ["Nous sommes contentes d'être ici."], en: "We're happy to be here." }, error: { wrong: "On sont contents d'être ici.", explain: "On takes a singular verb (on est), even when it means 'we'; only the adjective may be plural.", grammar: g.on-nous } }
      - { es: "Super ! On se voit à huit heures devant le métro.", en: "Great! We'll meet at eight in front of the metro.", altEs: ["Super ! On se voit à vingt heures devant le métro."], altEn: ["Great! See you at eight in front of the metro."], grammar: [g.on-nous, g.time-telling], vocab: [w.super] }
      - { es: "On sonne à la porte.", en: "Someone's ringing at the door.", altEn: ["Somebody is ringing the doorbell.", "Someone is at the door."], grammar: [g.on-nous], vocab: [], note: "On can also mean 'someone'." }
      - { es: "Ici, on parle français.", en: "French is spoken here.", altEn: ["We speak French here.", "People speak French here."], grammar: [g.on-nous], vocab: [] }
      - { es: "Ils proposent le théâtre, mais nous, on préfère le cinéma.", en: "They're suggesting the theatre, but we prefer the cinema.", altEs: ["Ils proposent le théâtre, mais nous préférons le cinéma."], grammar: [g.on-nous, g.aimer-preferer], vocab: [w.proposer, w.théâtre] }
      - { es: "On revient demain, d'accord ?", en: "We'll come back tomorrow, OK?", altEn: ["We're coming back tomorrow, all right?"], grammar: [g.on-nous], vocab: [w.revenir], transform: { instruction: "Use nous instead of on", answer: "Nous revenons demain, d'accord ?", en: "We'll come back tomorrow, OK?" } }
      - { es: "C'est génial, on est ensemble à Paris !", en: "It's brilliant, we're together in Paris!", altEs: ["C'est génial, nous sommes ensemble à Paris !"], altEn: ["This is great, we're together in Paris!"], grammar: [g.on-nous], vocab: [w.génial, w.ensemble] }
