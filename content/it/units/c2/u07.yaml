id: c2.u07
title: Giochi di parole
lessons:
  - id: c2.u07.l1
    title: Il colmo per un elettricista
    teach: [g.wordplay]
    vocab: [w.gioco-di-parole, w.calembour, w.doppio-senso, w.indovinello, w.paronomasia, w.equivoco-linguistico, w.storpiare, w.storpiatura, w.lapsus, w.arguzia, w.arguto, w.battutista, w.spunto, w.pettine, w.insulto]
    tip: "Many Italian puns play on words with two meanings (pesca, riso, corrente) or take idioms literally. Puns rarely survive translation: explain them or replace them."
    sentences:
      - { es: "Qual è il colmo per un elettricista? Non essere al corrente.", en: "What's the height of irony for an electrician? Not being 'al corrente' (up to date / on the current).", grammar: [g.wordplay], vocab: [w.colmo, w.elettricista], error: { wrong: "Qual'è il colmo per un elettricista? Non essere al corrente.", explain: "Qual è has no apostrophe: qual is a shortened form, not an elision.", grammar: g.wordplay } }
      - { es: "Vado a pesca e mangio una pesca: è il gioco di parole più vecchio del mondo.", en: "I go fishing and eat a peach: it's the oldest pun in the world.", altEs: ["Vado a pesca e mangio una pesca: è il gioco di parole più antico del mondo."], grammar: [g.wordplay, g.superlatives], vocab: [w.gioco-di-parole] }
      - { es: "Il riso fa buon sangue, e il risotto ancora di più.", en: "Laughter is good for you, and risotto even more so.", altEn: ["Laughter is the best medicine, and risotto is even better."], grammar: [g.wordplay, g.proverbs], vocab: [], note: "Il riso = laughter and rice: the proverb il riso fa buon sangue means laughter keeps you healthy." }
      - { es: "Ho perso la testa per te. — E dove l'hai lasciata?", en: "I've lost my head over you. — And where did you leave it?", grammar: [g.wordplay, g.idioms], vocab: [] }
      - { es: "Il calembour funziona solo in italiano: tradotto, perde tutto.", en: "The pun only works in Italian: translated, it loses everything.", altEs: ["Il calembour funziona solo in italiano: se lo traduci, perde tutto."], grammar: [g.wordplay, g.translation-nuance], vocab: [w.calembour] }
      - { es: "Attenzione ai doppi sensi: a una cena di lavoro certe battute vanno evitate.", en: "Watch out for double meanings: at a work dinner some jokes are best avoided.", altEs: ["Attenzione ai doppi sensi: a una cena di lavoro certe battute sono da evitare."], grammar: [g.wordplay, g.passive-andare], vocab: [w.doppio-senso] }
      - { es: "Ecco un indovinello: che cosa ha i denti ma non morde? Il pettine!", en: "Here's a riddle: what has teeth but doesn't bite? A comb!", grammar: [g.wordplay], vocab: [w.indovinello, w.pettine] }
      - { es: "La paronomasia accosta parole dal suono simile: «traduttore, traditore».", en: "Paronomasia puts together words that sound alike: 'traduttore, traditore' (translator, traitor).", grammar: [g.wordplay, g.rhetorical-figures], vocab: [w.paronomasia, w.traduttore] }
      - { es: "La chiamano «la città che muore», ma Civita, più che morire, si fa desiderare.", en: "They call it 'the dying town', but rather than dying, Civita plays hard to get.", grammar: [g.wordplay], vocab: [] }
      - { es: "Mi è scappato un lapsus: ho chiamato il mio capo «papà».", en: "I made a slip of the tongue: I called my boss 'Dad'.", altEs: ["Ho fatto un lapsus: ho chiamato il mio capo «papà»."], grammar: [g.wordplay], vocab: [w.lapsus] }
      - { es: "Mio nonno storpia tutti i nomi stranieri: per lui Netflix è «Neflì».", en: "My grandfather mangles every foreign name: for him Netflix is 'Neflì'.", grammar: [g.wordplay], vocab: [w.storpiare], transform: { instruction: "Put it in the imperfetto (he used to mangle…)", answer: "Mio nonno storpiava tutti i nomi stranieri: per lui Netflix era «Neflì».", en: "My grandfather used to mangle every foreign name: for him Netflix was 'Neflì'." } }
      - { es: "Certe storpiature sono diventate battute di famiglia.", en: "Some of those mangled words have become family jokes.", grammar: [g.wordplay], vocab: [w.storpiatura] }
      - { es: "Non era un insulto, era un equivoco linguistico: lui pensava a un altro significato della parola.", en: "It wasn't an insult, it was a linguistic misunderstanding: he was thinking of another meaning of the word.", grammar: [g.wordplay, g.passato-prossimo-vs-imperfetto], vocab: [w.equivoco-linguistico, w.insulto] }
      - { es: "È un battutista nato: ha sempre la risposta pronta.", en: "He's a born wisecracker: he always has a comeback ready.", altEs: ["È una battutista nata: ha sempre la risposta pronta."], grammar: [g.wordplay], vocab: [w.battutista], transform: { instruction: "Make it about my two aunts (feminine plural)", answer: "Sono due battutiste nate: hanno sempre la risposta pronta.", alt: ["Le mie zie sono due battutiste nate: hanno sempre la risposta pronta."], en: "They're born wisecrackers: they always have a comeback ready." } }
      - { es: "Ammiro la sua arguzia: con un commento arguto ha fatto ridere tutta la sala.", en: "I admire her wit: with one sharp remark she had the whole room laughing.", altEs: ["Ammiro la sua arguzia: con un commento arguto ha fatto ridere la sala intera."], grammar: [g.wordplay, g.fare-causative], vocab: [w.arguzia, w.arguto] }
      - { es: "Quella conversazione mi ha dato lo spunto per un articolo sui giochi di parole.", en: "That conversation gave me the idea for an article on wordplay.", grammar: [g.wordplay], vocab: [w.spunto, w.gioco-di-parole] }
    exchanges:
      - q: { es: "Qual è il colmo per un idraulico?", en: "What's the height of irony for a plumber?" }
        a: { es: "Non capire un tubo!", en: "Not understanding a thing! (non capire un tubo = not understand a pipe)" }
        alt: ["Non capire un tubo.", "Non capirci un tubo!"]
        grammar: [g.wordplay, g.idioms]
        vocab: [w.colmo, w.idraulico]
      - q: { es: "Qual è il colmo per un giardiniere?", en: "What's the height of irony for a gardener?" }
        a: { es: "Piantare in asso la fidanzata.", en: "Leaving his girlfriend in the lurch. (piantare = to plant / to dump)" }
        alt: ["Piantare in asso la ragazza.", "Piantare in asso la fidanzata!"]
        grammar: [g.wordplay, g.idioms]
        vocab: [w.colmo]
      - q: { es: "Perché ridi?", en: "Why are you laughing?" }
        a: { es: "Ho fatto un lapsus in riunione: invece di «dati» ho detto «datteri».", en: "I made a slip in the meeting: instead of 'data' I said 'dates'." }
        alt: ["Mi è scappato un lapsus in riunione.", "Per un lapsus: ho detto «datteri» invece di «dati»."]
        grammar: [g.wordplay]
        vocab: [w.lapsus]
      - q: { es: "Hai capito la battuta?", en: "Did you get the joke?" }
        a: { es: "Sì, ma è un doppio senso un po' spinto per una cena con i suoceri.", en: "Yes, but it's a slightly risqué double meaning for a dinner with the in-laws." }
        alt: ["Sì, ma era un doppio senso.", "No, me la spieghi?"]
        grammar: [g.wordplay]
        vocab: [w.doppio-senso]
      - q: { es: "Sai un indovinello?", en: "Do you know a riddle?" }
        a: { es: "Sì: più è grande, meno si vede. Che cos'è? Il buio!", en: "Yes: the bigger it is, the less you see. What is it? The dark!" }
        alt: ["Che cosa ha i denti ma non morde? Il pettine!", "Sì, ma non mi ricordo la soluzione."]
        grammar: [g.wordplay, g.comparatives]
        vocab: [w.indovinello]
    texts:
      - title: "Titoli di giornale"
        es: ["Civita di Bagnoregio, la città che muore… di turisti.", "Calcio, la Roma resta in bianco: zero a zero all'Olimpico.", "Nuovo ponte per Civita: i turisti passano, i problemi restano."]
        en: ["Civita di Bagnoregio, the town that's dying… of tourists.", "Football: Roma draw a blank, nil-nil at the Olimpico.", "New bridge for Civita: the tourists pass, the problems remain."]
        grammar: [g.wordplay, g.journalistic-language]
        vocab: []
      - title: "Dal diario di Tancredi"
        es: ["Oggi a Civita ho attraversato il ponte con il fiato corto.", "Una guida ha detto: «Qui il tufo cade a pezzi, ma noi no».", "Mi è piaciuta l'arguzia di quella frase, e l'ho scritta subito."]
        en: ["Today in Civita I crossed the bridge out of breath.", "A guide said: 'Here the tuff falls to pieces, but we don't.'", "I liked the wit of that line, and I wrote it down straight away."]
        grammar: [g.wordplay, g.pronoun-participle-agreement]
        vocab: [w.arguzia, w.tufo]
    spicy:
      - { es: "Ho perso la testa per te. Se la trovi, tienila pure.", en: "I've lost my head over you. If you find it, feel free to keep it.", grammar: [g.wordplay, g.imperativo-pronouns], vocab: [] }
      - { es: "Qual è il colmo per un elettricista? Prendere la scossa ogni volta che lei gli sfiora la mano.", en: "What's the height of irony for an electrician? Getting a shock every time she brushes his hand.", altEs: ["Qual è il colmo per un'elettricista? Prendere la scossa ogni volta che lui le sfiora la mano."], grammar: [g.wordplay], vocab: [w.colmo, w.elettricista] }
      - { es: "Mi è scappato un lapsus: volevo dire «buonanotte», ho detto «resta».", en: "It was a slip of the tongue: I meant to say 'goodnight', I said 'stay'.", grammar: [g.wordplay], vocab: [w.lapsus] }
      - { es: "Non è un doppio senso: è un invito a cena, e basta. Per ora.", en: "It's not a double meaning: it's a dinner invitation, that's all. For now.", grammar: [g.wordplay], vocab: [w.doppio-senso] }
      - { es: "Sei così arguto che quando ridi mi dimentico tutte le battute che avevo preparato.", en: "You're so witty that when you laugh I forget all the jokes I'd prepared.", altEs: ["Sei così arguta che quando ridi mi dimentico tutte le battute che avevo preparato."], grammar: [g.wordplay, g.trapassato-prossimo], vocab: [w.arguto] }
  - id: c2.u07.l2
    title: Enigmistica e scioglilingua
    teach: [g.wordplay]
    vocab: [w.rebus, w.enigmistica, w.cruciverba, w.anagramma, w.palindromo, w.scioglilingua, w.filastrocca, w.nonsense, w.saccente, w.altezzoso, w.giocoso, w.ludico, w.panca, w.capra]
    tip: "Some words are spelt the same but stressed differently (àncora 'anchor' / ancóra 'again', prìncipi 'princes' / princìpi 'principles'). Normal spelling doesn't mark the stress: context decides."
    sentences:
      - { es: "La Settimana Enigmistica, nata nel 1932, si trova in tutte le edicole d'Italia.", en: "La Settimana Enigmistica, founded in 1932, can be found at every newsstand in Italy.", grammar: [g.wordplay, g.si-passivante], vocab: [w.enigmistica] }
      - { es: "L'enigmistica ha una funzione ludica, ma allena anche la memoria.", en: "Puzzles are a game, but they also train the memory.", altEs: ["L'enigmistica è un gioco, ma allena anche la memoria."], grammar: [g.wordplay], vocab: [w.enigmistica, w.ludico] }
      - { es: "Non riesco a finire il cruciverba: mi manca una parola di sette lettere.", en: "I can't finish the crossword: I'm missing a seven-letter word.", grammar: [g.wordplay], vocab: [w.cruciverba], transform: { instruction: "Make it plural: we can't finish the crosswords", answer: "Non riusciamo a finire i cruciverba: ci manca una parola di sette lettere.", alt: ["Non riusciamo a finire i cruciverba: ci mancano parole di sette lettere."], en: "We can't finish the crosswords: we're missing a seven-letter word." } }
      - { es: "In pullman ho finito due cruciverba e un rebus.", en: "On the coach I finished two crosswords and a rebus.", grammar: [g.wordplay, g.plural-nouns], vocab: [w.cruciverba, w.rebus], error: { wrong: "In pullman ho finito due cruciverbi e un rebus.", explain: "Cruciverba is invariable: un cruciverba, due cruciverba.", grammar: g.wordplay } }
      - { es: "«Roma» è l'anagramma di «amor», ma anche di «ramo», «mora» e «orma».", en: "'Roma' is an anagram of 'amor', but also of 'ramo' (branch), 'mora' (blackberry) and 'orma' (footprint).", grammar: [g.wordplay], vocab: [w.anagramma] }
      - { es: "«I topi non avevano nipoti» è il palindromo italiano più famoso.", en: "'I topi non avevano nipoti' (the mice had no nephews) is the most famous Italian palindrome.", grammar: [g.wordplay, g.superlatives], vocab: [w.palindromo] }
      - { es: "Sopra la panca la capra campa, sotto la panca la capra crepa.", en: "On the bench the goat lives, under the bench the goat dies. (tongue-twister)", grammar: [g.wordplay], vocab: [w.panca, w.capra], kinds: [dictation, listen, speak, typeEs, order] }
      - { es: "Prova a dire questo scioglilingua tre volte di fila senza sbagliare.", en: "Try saying this tongue-twister three times in a row without a mistake.", grammar: [g.wordplay, g.imperativo-tu], vocab: [w.scioglilingua] }
      - { es: "Da piccolo mia nonna mi cantava una filastrocca per farmi addormentare.", en: "When I was little my grandmother would sing me a nursery rhyme to get me to sleep.", altEs: ["Quando ero piccolo mia nonna mi cantava una filastrocca per farmi addormentare.", "Da piccola mia nonna mi cantava una filastrocca per farmi addormentare."], grammar: [g.wordplay, g.imperfetto-uses], vocab: [w.filastrocca] }
      - { es: "Il nonsense gioca con la logica: frasi perfette che non vogliono dire niente.", en: "Nonsense verse plays with logic: perfect sentences that mean nothing at all.", grammar: [g.wordplay], vocab: [w.nonsense] }
      - { es: "Ancora un'ancora? Questa barca ne perde una al mese!", en: "Another anchor? This boat loses one a month!", grammar: [g.wordplay, g.ne-partitive], vocab: [], note: "àncora (anchor) / ancóra (again): same spelling, different stress." }
      - { es: "I principi del regno non avevano molti principi.", en: "The princes of the kingdom didn't have many principles.", grammar: [g.wordplay], vocab: [], note: "prìncipi (princes) / princìpi (principles)." }
      - { es: "Non fare il saccente: anche tu hai sbagliato la definizione.", en: "Don't be a know-it-all: you got the definition wrong too.", altEs: ["Non fare la saccente: anche tu hai sbagliato la definizione."], grammar: [g.wordplay, g.imperativo-negative], vocab: [w.saccente] }
      - { es: "È così altezzoso che non saluta nemmeno il portiere.", en: "He's so haughty he doesn't even say hello to the porter.", altEs: ["È così altezzoso che non saluta neanche il portiere."], grammar: [g.wordplay], vocab: [w.altezzoso], transform: { instruction: "Make it about two women", answer: "Sono così altezzose che non salutano nemmeno il portiere.", alt: ["Sono così altezzose che non salutano neanche il portiere."], en: "They're so haughty they don't even say hello to the porter." } }
      - { es: "Il tono giocoso dell'articolo rende leggero un tema serio.", en: "The playful tone of the article makes a serious subject feel light.", grammar: [g.wordplay], vocab: [w.giocoso] }
    exchanges:
      - q: { es: "Sai uno scioglilingua difficile?", en: "Do you know a difficult tongue-twister?" }
        a: { es: "Trentatré trentini entrarono a Trento tutti e trentatré trotterellando.", en: "Thirty-three people from Trento entered Trento, all thirty-three of them trotting." }
        alt: ["Sopra la panca la capra campa, sotto la panca la capra crepa.", "Sì, ma non riesco a dirlo velocemente."]
        grammar: [g.wordplay]
        vocab: [w.scioglilingua]
      - q: { es: "Che parole si leggono uguali nei due sensi?", en: "Which words read the same both ways?" }
        a: { es: "«Osso», «ama» o «radar»: sono palindromi.", en: "'Osso', 'ama' or 'radar': they're palindromes." }
        alt: ["I palindromi, come «osso».", "Per esempio «radar» e «osso»."]
        grammar: [g.wordplay]
        vocab: [w.palindromo]
      - q: { es: "Ti piacciono i cruciverba?", en: "Do you like crosswords?" }
        a: { es: "Moltissimo, ma solo quelli facili: i rebus mi fanno impazzire.", en: "I love them, but only the easy ones: rebuses drive me mad." }
        alt: ["Sì, li faccio ogni sera.", "No, preferisco i rebus."]
        grammar: [g.wordplay]
        vocab: [w.cruciverba, w.rebus]
      - q: { es: "Qual è l'anagramma di «Roma»?", en: "What's an anagram of 'Roma'?" }
        a: { es: "«Amor», ma anche «ramo», «mora» e «orma».", en: "'Amor', but also 'ramo', 'mora' and 'orma'." }
        alt: ["«Amor».", "«Amor» o «ramo»."]
        grammar: [g.wordplay]
        vocab: [w.anagramma]
      - q: { es: "Ti ricordi una filastrocca di quando eri piccolo?", en: "Do you remember a nursery rhyme from when you were little?" }
        a: { es: "Sì, quella dei mesi: «Trenta giorni ha novembre, con april, giugno e settembre».", en: "Yes, the one about the months: 'Thirty days hath November, April, June and September'." }
        alt: ["Sì, me la cantava sempre mia nonna.", "Poche, ma quella dei mesi sì."]
        grammar: [g.wordplay, g.imperfetto-uses]
        vocab: [w.filastrocca]
    texts:
      - title: "Cartolina da Civita"
        es: ["Civita di Bagnoregio, detta in fretta, sembra uno scioglilingua.", "Per arrivarci si attraversa a piedi un ponte lunghissimo.", "In paese vivono pochissime persone, ma i gatti sono tanti."]
        en: ["Civita di Bagnoregio, said quickly, sounds like a tongue-twister.", "To get there you cross a very long bridge on foot.", "Very few people live in the village, but there are plenty of cats."]
        grammar: [g.wordplay, g.si-impersonale]
        vocab: [w.scioglilingua]
      - title: "Regole del gioco"
        es: ["Ogni squadra riceve un rebus e un cruciverba.", "Vince chi trova per primo la parola nascosta.", "Vietato usare il telefono: lo spirito è ludico, non competitivo."]
        en: ["Each team gets a rebus and a crossword.", "The first to find the hidden word wins.", "No phones allowed: the spirit is playful, not competitive."]
        grammar: [g.wordplay, g.relative-chi-quello-che]
        vocab: [w.rebus, w.cruciverba, w.ludico]
    spicy:
      - { es: "Sei il mio rebus preferito: ti guardo per ore e ancora non ti capisco.", en: "You're my favourite rebus: I look at you for hours and I still can't work you out.", grammar: [g.wordplay], vocab: [w.rebus] }
      - { es: "«Amor» è l'anagramma di «Roma»: prossima tappa la capitale, insieme?", en: "'Amor' is an anagram of 'Roma': next stop the capital, together?", grammar: [g.wordplay], vocab: [w.anagramma] }
      - { es: "Non fare l'altezzoso: lo so che il bigliettino nel cruciverba l'hai lasciato tu.", en: "Don't play hard to get: I know you're the one who left the note in the crossword.", altEs: ["Non fare l'altezzosa: lo so che il bigliettino nel cruciverba l'hai lasciato tu."], grammar: [g.wordplay, g.dislocation], vocab: [w.altezzoso, w.cruciverba] }
      - { es: "Dimmi uno scioglilingua: voglio vedere se ti si scioglie anche il cuore.", en: "Tell me a tongue-twister: I want to see if your heart melts too.", grammar: [g.wordplay, g.imperativo-pronouns], vocab: [w.scioglilingua] }
      - { es: "Sei come un palindromo: da qualunque parte ti guardi, sei perfetto.", en: "You're like a palindrome: whichever way I look at you, you're perfect.", altEs: ["Sei come un palindromo: da qualunque parte ti guardi, sei perfetta."], grammar: [g.wordplay, g.chiunque-qualunque], vocab: [w.palindromo] }
  - id: c2.u07.l3
    title: Bella, raga!
    teach: [g.slang-giovanile]
    vocab: [w.raga, w.bro, w.sbatti, w.figata, w.cringe, w.flexare, w.tvb, w.cmq, w.sclerare, w.sbroccare, w.svalvolare, w.gasato, w.gasarsi, w.a-bomba, w.paccare, w.scialla, w.ciaone, w.gergo-giovanile, w.slang, w.boomer, w.maturità]
    tip: "Slang marks age and region: understand it everywhere, use it only with friends. Texting shortcuts like cmq (comunque) and tvb (ti voglio bene) never belong in formal writing."
    sentences:
      - { es: "Bella, raga! Che si fa stasera?", en: "Hey guys! What are we doing tonight?", altEs: ["Bella raga, che si fa stasera?", "Bella, raga! Cosa si fa stasera?"], grammar: [g.slang-giovanile, g.si-impersonale], vocab: [w.raga] }
      - { es: "Scialla, bro, non c'è fretta.", en: "Chill, bro, there's no rush.", altEs: ["Scialla bro, non c'è fretta."], grammar: [g.slang-giovanile], vocab: [w.scialla, w.bro], transform: { instruction: "Say it in neutral Italian", answer: "Tranquillo, non c'è fretta.", alt: ["Stai tranquillo, non c'è fretta.", "Rilassati, non c'è fretta.", "Calma, non c'è fretta."], en: "Relax, there's no rush." } }
      - { es: "Che sbatti andare a Civita a piedi con questo caldo!", en: "What a hassle walking up to Civita in this heat!", altEs: ["Che sbatti salire a Civita a piedi con questo caldo!"], grammar: [g.slang-giovanile], vocab: [w.sbatti] }
      - { es: "Che figata il ponte di Civita al tramonto!", en: "How amazing the Civita bridge is at sunset!", altEn: ["The Civita bridge at sunset is so cool!"], grammar: [g.slang-giovanile], vocab: [w.figata] }
      - { es: "Non postare quella foto, è troppo cringe.", en: "Don't post that photo, it's way too cringe.", altEs: ["Non pubblicare quella foto, è troppo cringe."], grammar: [g.slang-giovanile, g.imperativo-negative], vocab: [w.cringe, w.postare] }
      - { es: "Smettila di flexare con la macchina di tuo padre.", en: "Stop showing off with your dad's car.", grammar: [g.slang-giovanile, g.imperativo-pronouns], vocab: [w.flexare] }
      - { es: "Cmq ci vediamo dopo in piazza, tvb.", en: "Anyway, see you later in the square, love you.", grammar: [g.slang-giovanile], vocab: [w.cmq, w.tvb], transform: { instruction: "Write it out in full, without texting abbreviations", answer: "Comunque ci vediamo dopo in piazza, ti voglio bene.", en: "Anyway, see you later in the square, love you." } }
      - { es: "Ho sclerato quando ho visto il voto dell'esame.", en: "I freaked out when I saw my exam mark.", grammar: [g.slang-giovanile, g.auxiliary-choice], vocab: [w.sclerare], error: { wrong: "Sono sclerato quando ho visto il voto dell'esame.", explain: "Sclerare takes avere in the passato prossimo: ho sclerato.", grammar: g.slang-giovanile } }
      - { es: "Se mi paccano un'altra volta, sbrocco.", en: "If they stand me up one more time, I'll lose it.", altEs: ["Se mi paccano ancora una volta, sbrocco."], grammar: [g.slang-giovanile, g.periodo-ipotetico-1], vocab: [w.paccare, w.sbroccare] }
      - { es: "Dopo tre ore di coda Tancredi ha svalvolato completamente.", en: "After three hours in the queue Tancredi completely lost it.", grammar: [g.slang-giovanile], vocab: [w.svalvolare] }
      - { es: "Sono gasatissimo per il concerto di stasera!", en: "I'm so pumped for tonight's concert!", altEs: ["Sono gasatissima per il concerto di stasera!"], grammar: [g.slang-giovanile, g.superlatives], vocab: [w.gasato], transform: { instruction: "Say it in standard Italian", answer: "Sono entusiasta per il concerto di stasera!", alt: ["Non vedo l'ora del concerto di stasera!", "Sono emozionatissimo per il concerto di stasera!"], en: "I'm thrilled about tonight's concert!" } }
      - { es: "Non gasarti troppo, è solo una partita tra amici.", en: "Don't get too worked up, it's only a game between friends.", altEs: ["Non ti gasare troppo, è solo una partita tra amici."], grammar: [g.slang-giovanile, g.imperativo-negative], vocab: [w.gasarsi] }
      - { es: "Stiamo studiando a bomba per la maturità.", en: "We're studying flat out for our final exams.", grammar: [g.slang-giovanile, g.stare-gerundio], vocab: [w.a-bomba, w.maturità] }
      - { es: "Ciaone! Se pensa che io lo aspetti, si sbaglia di grosso.", en: "Bye-bye! If he thinks I'm waiting for him, he's very much mistaken.", grammar: [g.slang-giovanile, g.congiuntivo-opinion], vocab: [w.ciaone] }
      - { es: "Il gergo giovanile cambia così in fretta che lo slang di oggi domani sembra roba da boomer.", en: "Youth slang changes so fast that today's slang sounds like boomer stuff tomorrow.", grammar: [g.slang-giovanile], vocab: [w.gergo-giovanile, w.slang, w.boomer] }
    exchanges:
      - q: { es: "Raga, stasera pizza?", en: "Guys, pizza tonight?" }
        a: { es: "Ci sto! Ma niente sbatti: prendiamo quella sotto casa.", en: "I'm in! But no hassle: let's get the one downstairs." }
        alt: ["Ci sto!", "Ci sto, ma niente sbatti."]
        grammar: [g.slang-giovanile]
        vocab: [w.raga, w.sbatti]
      - q: { es: "Com'è andato il concerto?", en: "How was the concert?" }
        a: { es: "Una figata pazzesca, ero gasatissimo!", en: "Totally amazing, I was so pumped!" }
        alt: ["Una figata!", "Bellissimo, ero gasatissima!"]
        grammar: [g.slang-giovanile]
        vocab: [w.figata, w.gasato]
      - q: { es: "Perché sei così nervoso?", en: "Why are you so on edge?" }
        a: { es: "Mi hanno paccato di nuovo, sto per sbroccare.", en: "They've stood me up again, I'm about to lose it." }
        alt: ["Mi hanno paccato, che rabbia!", "Mi hanno paccato un'altra volta."]
        grammar: [g.slang-giovanile, g.stare-per]
        vocab: [w.paccare, w.sbroccare]
      - q: { es: "Vieni alla festa di Ruggero sabato?", en: "Are you coming to Ruggero's party on Saturday?" }
        a: { es: "No, raga: sabato studio a bomba per l'esame.", en: "No, guys: on Saturday I'm studying flat out for the exam." }
        alt: ["Non posso, devo studiare a bomba.", "Scialla, ci sono!"]
        grammar: [g.slang-giovanile]
        vocab: [w.a-bomba]
      - q: { es: "Che vuol dire «tvb»?", en: "What does 'tvb' mean?" }
        a: { es: "«Ti voglio bene»: si usa con gli amici e in famiglia.", en: "'Love you': it's used with friends and family." }
        alt: ["Ti voglio bene.", "È l'abbreviazione di «ti voglio bene»."]
        grammar: [g.slang-giovanile]
        vocab: [w.tvb]
    texts:
      - title: "Chat di gruppo"
        es: ["Raga, cmq domani niente lezione: il prof è malato.", "Scialla, allora andiamo a Civita?", "Che sbatti il ponte a piedi… ma ok, ci sto."]
        en: ["Guys, anyway, no class tomorrow: the teacher's ill.", "Chill, so shall we go to Civita?", "What a hassle the bridge on foot is… but OK, I'm in."]
        grammar: [g.slang-giovanile]
        vocab: [w.raga, w.cmq, w.scialla, w.sbatti]
      - title: "Dal blog di una linguista"
        es: ["Il gergo giovanile prende parole dai dialetti, dall'inglese e dai social.", "«Scialla» viene da Roma, «ganzo» dalla Toscana, «cringe» dalla rete.", "Molte parole durano una stagione; alcune finiscono nel vocabolario."]
        en: ["Youth slang takes words from dialects, from English and from social media.", "'Scialla' comes from Rome, 'ganzo' from Tuscany, 'cringe' from the internet.", "Many words last one season; some end up in the dictionary."]
        grammar: [g.slang-giovanile]
        vocab: [w.gergo-giovanile, w.scialla, w.cringe]
    spicy:
      - { es: "Che figata la tua risata: la metterei come suoneria.", en: "Your laugh is so cool: I'd use it as my ringtone.", grammar: [g.slang-giovanile, g.condizionale-presente], vocab: [w.figata] }
      - { es: "Se stasera mi pacchi, sbrocco. Se vieni, mi gaso.", en: "If you stand me up tonight, I'll lose it. If you come, I'll be over the moon.", grammar: [g.slang-giovanile, g.periodo-ipotetico-1], vocab: [w.paccare, w.sbroccare, w.gasarsi] }
      - { es: "Non flexare, bro: lo so che la macchina è di tuo padre, e mi piaci lo stesso.", en: "Don't show off, bro: I know the car is your dad's, and I like you anyway.", grammar: [g.slang-giovanile, g.imperativo-negative], vocab: [w.flexare, w.bro] }
      - { es: "Scialla, non è un appuntamento: è solo una pizza in due a lume di candela.", en: "Chill, it's not a date: it's just a pizza for two by candlelight.", grammar: [g.slang-giovanile], vocab: [w.scialla] }
      - { es: "Ti ho scritto «tvb» per sbaglio… o forse no.", en: "I texted you 'love you' by mistake… or maybe not.", grammar: [g.slang-giovanile], vocab: [w.tvb] }
  - id: c2.u07.l4
    title: Petaloso e altre parole nuove
    teach: [g.neologisms]
    vocab: [w.spoilerare, w.postare, w.ghostare, w.bannare, w.taggare, w.shippare, w.petaloso, w.buonismo, w.webete, w.femminicidio, w.neologismo, w.coniare, w.neoformazione, w.acronimo, w.sigla, w.abbreviazione, w.emoji, w.meme, w.hashtag, w.virale, w.like, w.condivisione, w.googlare, w.selfie, w.alunno, w.calanco]
    tip: "New verbs from English join the regular -are conjugation: googlare, postare, ghostare → io googlo, tu posti, lei ghosta."
    sentences:
      - { es: "Nel 2016 un alunno di otto anni inventò la parola «petaloso», e l'Accademia della Crusca gli rispose.", en: "In 2016 an eight-year-old pupil invented the word 'petaloso', and the Accademia della Crusca wrote back to him.", grammar: [g.neologisms, g.passato-remoto-forms], vocab: [w.petaloso, w.alunno] }
      - { es: "La Crusca spiegò che «petaloso» è una parola ben formata, come «coraggioso» o «peloso».", en: "The Crusca explained that 'petaloso' is a well-formed word, like 'coraggioso' (brave) or 'peloso' (hairy).", grammar: [g.neologisms, g.word-formation], vocab: [w.petaloso] }
      - { es: "Chi ha coniato il termine «apericena»?", en: "Who coined the term 'apericena'?", grammar: [g.neologisms], vocab: [w.coniare] }
      - { es: "Ogni anno i dizionari registrano centinaia di neologismi.", en: "Every year dictionaries record hundreds of new words.", grammar: [g.neologisms], vocab: [w.neologismo, w.dizionario] }
      - { es: "«Femminicidio» è un neologismo entrato nell'uso comune negli ultimi vent'anni.", en: "'Femminicidio' (femicide) is a neologism that has come into common use in the last twenty years.", grammar: [g.neologisms], vocab: [w.femminicidio, w.neologismo] }
      - { es: "Il buonismo, dicono i critici, non risolve i problemi.", en: "Do-goodism, the critics say, doesn't solve problems.", grammar: [g.neologisms], vocab: [w.buonismo] }
      - { es: "Googlo tutto, perfino le ricette della nonna.", en: "I google everything, even grandma's recipes.", altEs: ["Io googlo tutto, perfino le ricette della nonna.", "Googlo tutto, anche le ricette della nonna."], grammar: [g.neologisms, g.present-are], vocab: [w.googlare], error: { wrong: "Googleo tutto, perfino le ricette della nonna.", explain: "Googlare is a regular -are verb: io googlo, tu googli, lui googla.", grammar: g.neologisms } }
      - { es: "Mi ha ghostato dopo due appuntamenti: niente messaggi, niente chiamate.", en: "He ghosted me after two dates: no messages, no calls.", altEs: ["Mi ha ghostata dopo due appuntamenti: niente messaggi, niente chiamate."], altEn: ["She ghosted me after two dates: no texts, no calls."], grammar: [g.neologisms, g.pronoun-participle-agreement], vocab: [w.ghostare], transform: { instruction: "Change 'me' to 'her' (he ghosted her)", answer: "L'ha ghostata dopo due appuntamenti: niente messaggi, niente chiamate.", en: "He ghosted her after two dates: no messages, no calls." } }
      - { es: "Ho postato la foto del ponte e mi hanno taggato in cento commenti.", en: "I posted the photo of the bridge and they tagged me in a hundred comments.", altEs: ["Ho postato la foto del ponte e mi hanno taggata in cento commenti."], grammar: [g.neologisms, g.pronoun-participle-agreement], vocab: [w.postare, w.taggare], transform: { instruction: "Change to 'we'", answer: "Abbiamo postato la foto del ponte e ci hanno taggati in cento commenti.", alt: ["Abbiamo postato la foto del ponte e ci hanno taggate in cento commenti."], en: "We posted the photo of the bridge and they tagged us in a hundred comments." } }
      - { es: "Il moderatore ha bannato tre utenti per insulti.", en: "The moderator banned three users for insults.", grammar: [g.neologisms], vocab: [w.bannare, w.insulto] }
      - { es: "Tutti shippano i due protagonisti della serie.", en: "Everyone ships the two main characters of the series.", grammar: [g.neologisms], vocab: [w.shippare] }
      - { es: "Non spoilerarmi il finale: lo guardo stasera!", en: "Don't spoil the ending for me: I'm watching it tonight!", altEs: ["Non mi spoilerare il finale: lo guardo stasera!"], grammar: [g.neologisms, g.imperativo-negative], vocab: [w.spoilerare] }
      - { es: "Il video è diventato virale in poche ore: due milioni di like e migliaia di condivisioni.", en: "The video went viral in a few hours: two million likes and thousands of shares.", grammar: [g.neologisms], vocab: [w.virale, w.like, w.condivisione] }
      - { es: "Quel meme con il gatto di Civita gira su tutti i gruppi.", en: "That meme with the Civita cat is going round all the group chats.", grammar: [g.neologisms], vocab: [w.meme] }
      - { es: "Per la campagna hanno inventato un hashtag che nessuno usa.", en: "For the campaign they invented a hashtag that nobody uses.", grammar: [g.neologisms, g.relative-che], vocab: [w.hashtag] }
      - { es: "«Webete» unisce «web» ed «ebete»: è una neoformazione offensiva.", en: "'Webete' blends 'web' and 'ebete' (idiot): it's an offensive coinage.", grammar: [g.neologisms, g.word-formation], vocab: [w.webete, w.neoformazione] }
    exchanges:
      - q: { es: "Hai visto il video di Tancredi?", en: "Have you seen Tancredi's video?" }
        a: { es: "Sì, è diventato virale: centomila like in un giorno.", en: "Yes, it went viral: a hundred thousand likes in a day." }
        alt: ["Sì, è diventato virale!", "Sì, l'ho anche condiviso."]
        grammar: [g.neologisms]
        vocab: [w.virale, w.like]
      - q: { es: "Che cosa vuol dire «shippare»?", en: "What does 'shippare' mean?" }
        a: { es: "Sperare che due personaggi si mettano insieme.", en: "Hoping that two characters get together." }
        alt: ["Fare il tifo per una coppia.", "Tifare perché due personaggi stiano insieme."]
        grammar: [g.neologisms, g.congiuntivo-wishes-emotion]
        vocab: [w.shippare]
      - q: { es: "Perché non rispondi più a Benedetta?", en: "Why aren't you answering Benedetta any more?" }
        a: { es: "Non la sto ghostando, giuro: ho il telefono rotto.", en: "I'm not ghosting her, I swear: my phone's broken." }
        alt: ["Non la ghosto, ho solo il telefono rotto.", "Ho il telefono rotto, non la sto ghostando!"]
        grammar: [g.neologisms, g.stare-gerundio]
        vocab: [w.ghostare]
      - q: { es: "Che cosa significa la sigla «PIL»?", en: "What do the initials 'PIL' stand for?" }
        a: { es: "Prodotto interno lordo.", en: "Gross domestic product." }
        alt: ["È la sigla di «prodotto interno lordo».", "Prodotto interno lordo, in inglese GDP."]
        grammar: [g.neologisms]
        vocab: [w.sigla]
      - q: { es: "Che emoji mi mandi se ti invito a cena?", en: "Which emoji will you send me if I invite you to dinner?" }
        a: { es: "Quella con gli occhi a cuore, ovviamente.", en: "The one with heart eyes, obviously." }
        alt: ["Un cuore, ovviamente.", "Dipende dal ristorante!"]
        grammar: [g.neologisms, g.periodo-ipotetico-1]
        vocab: [w.emoji]
    texts:
      - title: "Dalla risposta della Crusca (2016), in breve"
        es: ["La parola che hai inventato è bella e chiara.", "È formata bene, come «peloso» da «pelo» e «coraggioso» da «coraggio».", "Ma una parola entra nel vocabolario solo quando la usano in tanti."]
        en: ["The word you invented is lovely and clear.", "It's well formed, like 'peloso' from 'pelo' and 'coraggioso' from 'coraggio'.", "But a word only gets into the dictionary when lots of people use it."]
        grammar: [g.neologisms, g.word-formation]
        vocab: [w.petaloso]
      - title: "Abbreviazioni da chat"
        es: ["«Cmq» è l'abbreviazione di «comunque».", "«Fiat» è nata come acronimo di Fabbrica Italiana Automobili Torino.", "Un'emoji, invece, a volte sostituisce una frase intera."]
        en: ["'Cmq' is the abbreviation of 'comunque' (anyway).", "'Fiat' started out as an acronym of Fabbrica Italiana Automobili Torino.", "An emoji, on the other hand, sometimes replaces a whole sentence."]
        grammar: [g.neologisms]
        vocab: [w.abbreviazione, w.acronimo, w.emoji, w.cmq]
    spicy:
      - { es: "Non ghostarmi dopo questo bacio, ti prego: almeno un'emoji.", en: "Don't ghost me after this kiss, please: at least an emoji.", grammar: [g.neologisms, g.imperativo-negative], vocab: [w.ghostare, w.emoji] }
      - { es: "Ti shippo con me da tre settimane: tu quando te ne accorgi?", en: "I've been shipping you with me for three weeks: when are you going to notice?", grammar: [g.neologisms, g.da-since], vocab: [w.shippare] }
      - { es: "Ho coniato una parola nuova per te: «sorrisoso». Vuol dire pieno di sorrisi.", en: "I've coined a new word for you: 'sorrisoso'. It means full of smiles.", grammar: [g.neologisms, g.word-formation], vocab: [w.coniare] }
      - { es: "Il tuo selfie è diventato virale nel mio telefono: l'ho guardato quaranta volte.", en: "Your selfie has gone viral on my phone: I've looked at it forty times.", grammar: [g.neologisms], vocab: [w.selfie, w.virale] }
      - { es: "Se posti la foto della cena, taggami: voglio che lo sappiano tutti.", en: "If you post the photo of our dinner, tag me: I want everyone to know.", grammar: [g.neologisms, g.imperativo-pronouns], vocab: [w.postare, w.taggare] }
dialogues:
  - id: c2.u07.d1
    title: Sul ponte di Civita
    context: Tancredi, nineteen, is walking up the long footbridge to Civita di Bagnoregio with his aunt Ludovica, a linguist who studies new words.
    lines:
      - { speaker: Tancredi, es: "Zia, che sbatti questo ponte! Quanto manca?", en: "Auntie, what a pain this bridge is! How much further?" }
      - { speaker: Ludovica, es: "Poco. E comunque «sbatti», alla tua età, non l'avrei capito.", en: "Not far. And anyway, at your age I wouldn't have understood 'sbatti'." }
      - { speaker: Tancredi, es: "Scialla, zia, è solo slang. Tipo «cringe» o «ghostare».", en: "Chill, Auntie, it's just slang. Like 'cringe' or 'ghostare'." }
      - { speaker: Ludovica, es: "Lo so, studio i neologismi per lavoro. Ma lo sai che «scialla» viene da Roma?", en: "I know, I study new words for a living. But did you know that 'scialla' comes from Rome?" }
      - { speaker: Tancredi, es: "Davvero? Pensavo che venisse da TikTok!", en: "Really? I thought it came from TikTok!" }
      - { speaker: Ludovica, es: "Molte parole nascono nei dialetti e poi diventano virali. Alcune finiscono perfino nel vocabolario, come «petaloso».", en: "Lots of words are born in dialects and then go viral. Some even end up in the dictionary, like 'petaloso'." }
      - { speaker: Tancredi, es: "Petaloso? Che figata. Allora domani conio una parola anch'io.", en: "Petaloso? How cool. Then tomorrow I'll coin a word too." }
      - { speaker: Ludovica, es: "Prova. Ma ricordati: una parola vive solo se la usano in tanti.", en: "Try. But remember: a word only lives if lots of people use it." }
      - { speaker: Tancredi, es: "Facile: la posto, tutti la condividono e diventa virale.", en: "Easy: I post it, everyone shares it and it goes viral." }
      - { speaker: Ludovica, es: "Ecco, siamo arrivati. Guarda la valle: anche «calanchi» è una parola bellissima e quasi intraducibile.", en: "Here we are. Look at the valley: 'calanchi' is a beautiful, almost untranslatable word too." }
      - { speaker: Tancredi, es: "Calanchi? Sembra uno scioglilingua. Aspetta, faccio una foto per i follower.", en: "Calanchi? It sounds like a tongue-twister. Hang on, I'll take a photo for my followers." }
    questions:
      - { q: "Che cosa pensa Tancredi del ponte?", options: ["Che è una figata", "Che è faticoso e noioso", "Che è pericoloso"], answer: 1, explain: "Che sbatti! = what a hassle: he finds the climb tiring." }
      - { q: "Da dove viene «scialla», secondo Ludovica?", options: ["Da internet", "Dall'inglese", "Da Roma"], answer: 2, explain: "Ludovica says scialla comes from Rome; Tancredi thought it came from TikTok." }
      - { q: "Quando una parola nuova sopravvive, secondo Ludovica?", options: ["Quando la inventa un bambino", "Quando la usano in tanti", "Quando la approva il governo"], answer: 1, explain: "A word only lives if lots of people use it." }
      - { q: "Che lavoro fa Ludovica?", options: ["Studia i neologismi", "Fa la guida turistica", "Scrive cruciverba"], answer: 0, explain: "She says she studies new words for a living." }
