id: a1.u03
title: "La mia famiglia"
lessons:
  - id: a1.u03.l1
    title: Mio padre, mia madre
    teach: [g.avere-present, g.possessives-family]
    vocab: [w.avere, w.famiglia, w.padre, w.madre, w.papà, w.mamma, w.genitore, w.figlio, w.fratello, w.sorella, w.nonno, w.figlio-unico, w.mio, w.tuo, w.suo]
    tip: "No article with one family member: mio padre, tua sorella. The article comes back in the plural (i miei genitori) and with la mia famiglia."
    sentences:
      - { es: "Ho un fratello e una sorella.", en: "I have a brother and a sister.", altEs: ["Io ho un fratello e una sorella."], altEn: ["I've got a brother and a sister."], grammar: [g.avere-present], vocab: [w.avere, w.fratello, w.sorella] }
      - { es: "Hai fratelli?", en: "Do you have any brothers or sisters?", altEs: ["Tu hai fratelli?", "Hai fratelli o sorelle?"], altEn: ["Do you have siblings?", "Have you got any brothers or sisters?"], grammar: [g.avere-present], vocab: [w.avere, w.fratello] }
      - { es: "No, sono figlio unico.", en: "No, I'm an only child.", altEs: ["No, sono figlia unica.", "No, io sono figlio unico."], grammar: [g.negation], vocab: [w.figlio-unico] }
      - { es: "Mio padre si chiama Paolo e mia madre si chiama Rita.", en: "My father is called Paolo and my mother is called Rita.", altEs: ["Mio padre si chiama Paolo e mia madre Rita."], altEn: ["My father's name is Paolo and my mother's name is Rita."], grammar: [g.possessives-family, g.chiamarsi], vocab: [w.padre, w.madre, w.mio], error: { wrong: "Il mio padre si chiama Paolo e mia madre si chiama Rita.", explain: "No article with a single family member: mio padre, not il mio padre.", grammar: g.possessives-family } }
      - { es: "La mia famiglia è piccola.", en: "My family is small.", altEs: ["Ho una famiglia piccola."], grammar: [g.possessives-family], vocab: [w.famiglia, w.mio], transform: { instruction: "Say it about your friend's family (tu)", answer: "La tua famiglia è piccola." } }
      - { es: "Mia sorella ha un figlio.", en: "My sister has a son.", altEn: ["My sister has a child."], grammar: [g.possessives-family, g.avere-present], vocab: [w.sorella, w.figlio] }
      - { es: "I miei genitori sono di Napoli.", en: "My parents are from Naples.", grammar: [g.possessives-family, g.essere-di], vocab: [w.genitore], error: { wrong: "Miei genitori sono di Napoli.", explain: "Plural family nouns keep the article: i miei genitori.", grammar: g.possessives-family } }
      - { es: "Tuo fratello è simpatico!", en: "Your brother is nice!", grammar: [g.possessives-family], vocab: [w.tuo, w.fratello] }
      - { es: "Sua madre è inglese e suo padre è italiano.", en: "His mother is English and his father is Italian.", altEn: ["Her mother is English and her father is Italian."], grammar: [g.possessives-family], vocab: [w.suo, w.madre, w.padre] }
      - { es: "Abbiamo due figli: un figlio e una figlia.", en: "We have two children: a son and a daughter.", altEs: ["Noi abbiamo due figli: un figlio e una figlia.", "Abbiamo due figli, un maschio e una femmina."], grammar: [g.avere-present], vocab: [w.avere, w.figlio], transform: { instruction: "Change to 'they'", answer: "Hanno due figli: un figlio e una figlia.", alt: ["Loro hanno due figli: un figlio e una figlia."] } }
      - { es: "Il nonno e la nonna abitano con noi.", en: "Grandad and Grandma live with us.", altEs: ["I nonni abitano con noi."], altEn: ["My grandfather and grandmother live with us."], grammar: [g.plural-nouns], vocab: [w.nonno] }
      - { es: "Avete una famiglia grande?", en: "Do you (all) have a big family?", altEs: ["Voi avete una famiglia grande?", "Avete una famiglia numerosa?"], grammar: [g.avere-present], vocab: [w.avere, w.famiglia] }
      - { es: "La mia mamma è bravissima in cucina.", en: "My mum is a great cook.", altEs: ["Mia mamma è bravissima in cucina."], altEn: ["My mum is brilliant in the kitchen."], grammar: [g.possessives-family], vocab: [w.mamma], note: "mamma and papà usually keep the article: la mia mamma, il mio papà." }
      - { es: "Il mio papà lavora a Roma.", en: "My dad works in Rome.", altEs: ["Mio papà lavora a Roma."], grammar: [g.possessives-family], vocab: [w.papà] }
      - { es: "Mia figlia è piccola: ha tre anni.", en: "My daughter is little: she's three.", altEs: ["Mia figlia è piccola, ha tre anni."], grammar: [g.possessives-family, g.avere-present], vocab: [w.figlio, w.avere] }
    exchanges:
      - q: { es: "Hai fratelli?", en: "Do you have any brothers or sisters?" }
        a: { es: "Sì, ho un fratello e una sorella.", en: "Yes, I have a brother and a sister." }
        alt: ["No, sono figlio unico.", "Sì, ho una sorella.", "No, sono figlia unica."]
        grammar: [g.avere-present]
        vocab: [w.fratello, w.sorella]
      - q: { es: "Come si chiama tuo padre?", en: "What's your father's name?" }
        a: { es: "Mio padre si chiama Paolo.", en: "My father's name is Paolo." }
        alt: ["Si chiama Paolo.", "Paolo."]
        grammar: [g.possessives-family, g.chiamarsi]
        vocab: [w.padre, w.tuo]
      - q: { es: "La tua famiglia è grande?", en: "Is your family big?" }
        a: { es: "No, è piccola: i miei genitori, mio fratello e io.", en: "No, it's small: my parents, my brother and me." }
        alt: ["Sì, molto grande.", "No, è piccola."]
        grammar: [g.possessives-family]
        vocab: [w.famiglia, w.genitore]
      - q: { es: "Avete figli?", en: "Do you (all) have children?" }
        a: { es: "Sì, abbiamo una figlia.", en: "Yes, we have a daughter." }
        alt: ["No, non abbiamo figli.", "Sì, abbiamo due figli."]
        grammar: [g.avere-present]
        vocab: [w.figlio, w.avere]
      - q: { es: "Di dove sono i tuoi genitori?", en: "Where are your parents from?" }
        a: { es: "Mia madre è di Roma e mio padre è di Bari.", en: "My mother is from Rome and my father is from Bari." }
        alt: ["Sono di Roma.", "I miei genitori sono di Napoli."]
        grammar: [g.possessives-family, g.essere-di]
        vocab: [w.madre, w.padre, w.genitore]
    texts:
      - title: "La mia famiglia"
        es: ["La mia famiglia è piccola.", "Ho un fratello, ma non ho sorelle.", "I miei genitori abitano a Roma con mia nonna."]
        en: ["My family is small.", "I have a brother, but I don't have any sisters.", "My parents live in Rome with my grandmother."]
        grammar: [g.possessives-family, g.avere-present]
        vocab: [w.famiglia, w.fratello, w.genitore, w.nonno]
      - title: "Messaggio di Giulia"
        es: ["Tom, oggi mia sorella è a Roma!", "Si chiama Chiara e ha un figlio piccolo.", "Ceniamo insieme stasera?"]
        en: ["Tom, my sister is in Rome today!", "Her name is Chiara and she has a little boy.", "Shall we have dinner together tonight?"]
        grammar: [g.possessives-family, g.avere-present]
        vocab: [w.sorella, w.figlio]
    spicy:
      - { es: "Hai la ragazza? Ah, no? Perfetto.", en: "Have you got a girlfriend? Oh, no? Perfect.", altEs: ["Hai il ragazzo? Ah, no? Perfetto."], altEn: ["Do you have a girlfriend? Oh, no? Perfect."], grammar: [g.avere-present, g.possessives-family], vocab: [w.avere] }
      - { es: "Mia madre dice che sei molto carino.", en: "My mother says you're very cute.", altEs: ["Mia madre dice che sei molto carina."], grammar: [g.possessives-family], vocab: [w.madre, w.mio] }
      - { es: "Tua sorella è simpatica, ma io preferisco te.", en: "Your sister is nice, but I prefer you.", altEs: ["Tuo fratello è simpatico, ma io preferisco te."], grammar: [g.possessives-family], vocab: [w.tuo, w.sorella] }
      - { es: "Ho un gatto, un divano e tempo per te.", en: "I have a cat, a sofa and time for you.", altEs: ["Io ho un gatto, un divano e tempo per te."], grammar: [g.avere-present], vocab: [w.avere] }
      - { es: "Mia nonna ha ottant'anni e balla meglio di te.", en: "My grandma is eighty and she dances better than you.", altEs: ["Mia nonna ha ottanta anni e balla meglio di te."], grammar: [g.avere-present, g.possessives-family], vocab: [w.nonno] }
  - id: a1.u03.l2
    title: Zii, cugini e animali
    teach: [g.possessives, g.plural-nouns]
    vocab: [w.zio, w.cugino, w.nipote, w.marito, w.moglie, w.fidanzato, w.compagno, w.sposato, w.single, w.nostro, w.vostro, w.loro.det, w.cane, w.gatto, w.uccello, w.cavallo, w.pesce-rosso, w.animale, w.lupo]
    tip: "Possessives agree with the thing owned: il nostro cane, la nostra casa, i nostri gatti. Loro never changes: il loro, la loro, i loro."
    sentences:
      - { es: "Mio zio e mia zia hanno tre figli.", en: "My uncle and my aunt have three children.", altEs: ["I miei zii hanno tre figli."], altEn: ["My uncle and aunt have three kids."], grammar: [g.possessives-family, g.avere-present], vocab: [w.zio] }
      - { es: "I miei cugini abitano a Milano.", en: "My cousins live in Milan.", altEs: ["Le mie cugine abitano a Milano."], grammar: [g.possessives, g.plural-nouns], vocab: [w.cugino] }
      - { es: "Sua moglie si chiama Elena.", en: "His wife is called Elena.", altEs: ["La moglie si chiama Elena."], altEn: ["His wife's name is Elena."], grammar: [g.possessives-family], vocab: [w.moglie] }
      - { es: "Il mio fidanzato è romano.", en: "My boyfriend is Roman.", altEs: ["Il mio ragazzo è romano.", "La mia fidanzata è romana."], altEn: ["My fiancé is Roman."], grammar: [g.possessives], vocab: [w.fidanzato], note: "fidanzato, ragazzo and compagno keep the article: il mio fidanzato." }
      - { es: "Sei sposato o single?", en: "Are you married or single?", altEs: ["Sei sposata o single?"], grammar: [g.essere-present], vocab: [w.sposato, w.single] }
      - { es: "Abbiamo un cane e due gatti.", en: "We have a dog and two cats.", altEs: ["Noi abbiamo un cane e due gatti."], grammar: [g.plural-nouns, g.avere-present], vocab: [w.cane, w.gatto], transform: { instruction: "Change to 'they'", answer: "Hanno un cane e due gatti.", alt: ["Loro hanno un cane e due gatti."] } }
      - { es: "Il nostro cane si chiama Leo.", en: "Our dog is called Leo.", altEn: ["Our dog's name is Leo."], grammar: [g.possessives], vocab: [w.nostro, w.cane], transform: { instruction: "Make it plural: our dogs, Leo and Bonchita", answer: "I nostri cani si chiamano Leo e Bonchita." } }
      - { es: "La vostra casa è bellissima!", en: "Your (pl.) house is gorgeous!", altEs: ["La vostra casa è molto bella!"], altEn: ["Your house is beautiful!"], grammar: [g.possessives], vocab: [w.vostro] }
      - { es: "I loro figli sono grandi.", en: "Their children are grown up.", altEn: ["Their kids are big now."], grammar: [g.possessives, g.plural-nouns], vocab: [w.loro.det, w.figlio], error: { wrong: "I lori figli sono grandi.", explain: "loro never changes: il loro, la loro, i loro, le loro.", grammar: g.possessives } }
      - { es: "Romolo e Remo sono fratelli, e una lupa è la loro «mamma».", en: "Romulus and Remus are brothers, and a she-wolf is their «mum».", altEs: ["Romolo e Remo sono due fratelli e una lupa è la loro «mamma»."], grammar: [g.possessives], vocab: [w.lupo, w.loro.det] }
      - { es: "Mio nipote ha un pesce rosso.", en: "My nephew has a goldfish.", altEn: ["My grandson has a goldfish."], grammar: [g.possessives-family], vocab: [w.nipote, w.pesce-rosso] }
      - { es: "Le mie nipoti amano gli animali.", en: "My nieces love animals.", altEn: ["My granddaughters love animals."], grammar: [g.possessives, g.plural-nouns], vocab: [w.nipote, w.animale] }
      - { es: "Il mio compagno è francese.", en: "My partner is French.", altEs: ["La mia compagna è francese."], grammar: [g.possessives], vocab: [w.compagno] }
      - { es: "Ci sono tanti uccelli al Foro Romano.", en: "There are lots of birds at the Roman Forum.", altEs: ["Al Foro Romano ci sono tanti uccelli.", "Ci sono molti uccelli al Foro Romano."], grammar: [g.plural-nouns], vocab: [w.uccello] }
      - { es: "Mia moglie e io siamo sposati da dieci anni.", en: "My wife and I have been married for ten years.", altEs: ["Io e mia moglie siamo sposati da dieci anni."], grammar: [g.possessives-family], vocab: [w.moglie, w.sposato] }
      - { es: "Suo marito ama i cavalli.", en: "Her husband loves horses.", grammar: [g.possessives-family, g.plural-nouns], vocab: [w.marito, w.cavallo] }
    exchanges:
      - q: { es: "Sei sposata?", en: "Are you married?" }
        a: { es: "No, sono single.", en: "No, I'm single." }
        alt: ["Sì, sono sposata.", "No, ma ho un fidanzato."]
        grammar: [g.essere-present]
        vocab: [w.sposato, w.single]
      - q: { es: "Avete animali?", en: "Do you (all) have any pets?" }
        a: { es: "Sì, abbiamo un cane e due gatti.", en: "Yes, we have a dog and two cats." }
        alt: ["No, non abbiamo animali.", "Sì, un gatto."]
        grammar: [g.plural-nouns, g.avere-present]
        vocab: [w.animale, w.cane, w.gatto]
      - q: { es: "Come si chiama il vostro cane?", en: "What's your (pl.) dog called?" }
        a: { es: "Il nostro cane si chiama Leo.", en: "Our dog is called Leo." }
        alt: ["Si chiama Leo.", "Leo."]
        grammar: [g.possessives]
        vocab: [w.vostro, w.nostro, w.cane]
      - q: { es: "Chi sono loro?", en: "Who are they?" }
        a: { es: "Sono i miei cugini, Luca e Sara.", en: "They're my cousins, Luca and Sara." }
        alt: ["Sono i miei cugini.", "Sono i miei zii."]
        grammar: [g.possessives, g.plural-nouns]
        vocab: [w.cugino]
      - q: { es: "Tua moglie è italiana?", en: "Is your wife Italian?" }
        a: { es: "Sì, mia moglie è di Roma.", en: "Yes, my wife is from Rome." }
        alt: ["No, è inglese.", "Sì, è romana."]
        grammar: [g.possessives-family]
        vocab: [w.moglie]
    texts:
      - title: "Foto di famiglia"
        es: ["Questi sono i miei zii e i loro figli.", "I miei cugini sono tre: due ragazzi e una ragazza.", "Il cane bianco è il loro cane, Bruno."]
        en: ["These are my uncle and aunt and their children.", "I have three cousins: two boys and a girl.", "The white dog is their dog, Bruno."]
        grammar: [g.possessives, g.plural-nouns]
        vocab: [w.zio, w.cugino, w.loro.det, w.cane]
      - title: "Al Foro Romano"
        es: ["Romolo e Remo sono due fratelli.", "Nella storia di Roma, una lupa è la loro «mamma».", "Oggi la lupa è il simbolo della città."]
        en: ["Romulus and Remus are two brothers.", "In the story of Rome, a she-wolf is their «mum».", "Today the she-wolf is the symbol of the city."]
        grammar: [g.possessives]
        vocab: [w.lupo, w.loro.det]
    spicy:
      - { es: "Sei single? I miei gatti vogliono saperlo.", en: "Are you single? My cats want to know.", altEs: ["Sei single? I miei gatti lo vogliono sapere."], grammar: [g.possessives, g.plural-nouns], vocab: [w.single, w.gatto] }
      - { es: "I miei cani sono belli, ma tu sei più bello.", en: "My dogs are handsome, but you're more handsome.", altEs: ["I miei cani sono belli, ma tu sei più bella."], grammar: [g.possessives, g.plural-nouns], vocab: [w.cane] }
      - { es: "Mi fai una foto? È per le mie cugine: non mi credono.", en: "Will you take a photo of me? It's for my cousins: they don't believe me.", grammar: [g.possessives, g.plural-nouns], vocab: [w.cugino] }
      - { es: "Non ho un fidanzato, ma ho due gatti molto simpatici.", en: "I don't have a boyfriend, but I have two very friendly cats.", altEs: ["Non ho una fidanzata, ma ho due gatti molto simpatici."], grammar: [g.plural-nouns], vocab: [w.fidanzato, w.gatto] }
      - { es: "I nostri cani sono già fidanzati. E noi?", en: "Our dogs are already a couple. What about us?", altEs: ["I nostri cani sono già fidanzati... e noi?"], grammar: [g.possessives, g.plural-nouns], vocab: [w.nostro, w.cane, w.fidanzato] }
  - id: a1.u03.l3
    title: Da zero a venti
    teach: [g.numbers-0-100]
    vocab: [w.zero, w.due, w.tre, w.quattro, w.cinque, w.sei, w.sette, w.otto, w.nove, w.dieci, w.undici, w.dodici, w.tredici, w.quattordici, w.quindici, w.sedici, w.diciassette, w.diciotto, w.diciannove, w.venti, w.numero, w.telefono, w.cellulare, w.messaggio, w.email, w.computer]
    tip: "Age uses avere: ho diciotto anni (I have eighteen years). Phone numbers are usually read one digit at a time."
    sentences:
      - { es: "Uno, due, tre, quattro, cinque.", en: "One, two, three, four, five.", grammar: [g.numbers-0-100], vocab: [w.due, w.tre, w.quattro, w.cinque], kinds: [dictation, listen, typeEs, order] }
      - { es: "Sei, sette, otto, nove, dieci.", en: "Six, seven, eight, nine, ten.", grammar: [g.numbers-0-100], vocab: [w.sei, w.sette, w.otto, w.nove, w.dieci], kinds: [dictation, listen, typeEs, order] }
      - { es: "Undici, dodici, tredici, quattordici, quindici.", en: "Eleven, twelve, thirteen, fourteen, fifteen.", grammar: [g.numbers-0-100], vocab: [w.undici, w.dodici, w.tredici, w.quattordici, w.quindici], kinds: [dictation, listen, typeEs, order] }
      - { es: "Sedici, diciassette, diciotto, diciannove, venti.", en: "Sixteen, seventeen, eighteen, nineteen, twenty.", grammar: [g.numbers-0-100], vocab: [w.sedici, w.diciassette, w.diciotto, w.diciannove, w.venti], kinds: [dictation, listen, typeEs, order] }
      - { es: "Ho diciotto anni.", en: "I'm eighteen.", altEs: ["Io ho diciotto anni."], altEn: ["I am eighteen years old."], grammar: [g.avere-present, g.numbers-0-100], vocab: [w.diciotto, w.anno], error: { wrong: "Sono diciotto anni.", explain: "Age uses avere: ho diciotto anni.", grammar: g.avere-present } }
      - { es: "Mio fratello ha quindici anni.", en: "My brother is fifteen.", altEn: ["My brother is fifteen years old."], grammar: [g.numbers-0-100, g.avere-present], vocab: [w.quindici], transform: { instruction: "Change to 'my sisters' (17)", answer: "Le mie sorelle hanno diciassette anni." } }
      - { es: "Qual è il tuo numero di telefono?", en: "What's your phone number?", altEs: ["Qual è il tuo numero?", "Mi dai il tuo numero di telefono?"], grammar: [g.question-words], vocab: [w.numero, w.telefono], error: { wrong: "Qual'è il tuo numero di telefono?", explain: "qual è never takes an apostrophe.", grammar: g.question-words } }
      - { es: "Il mio numero di cellulare è tre, quattro, sette, due, zero, nove, cinque.", en: "My mobile number is three, four, seven, two, zero, nine, five.", grammar: [g.numbers-0-100], vocab: [w.cellulare, w.zero], kinds: [dictation, listen, typeEn] }
      - { es: "Ho dodici messaggi e venti email!", en: "I have twelve messages and twenty emails!", altEs: ["Ho dodici messaggi e venti mail!"], grammar: [g.numbers-0-100, g.plural-nouns], vocab: [w.messaggio, w.email], note: "email, like most foreign words, doesn't change in the plural." }
      - { es: "Il computer è nuovo, ma il cellulare è vecchio.", en: "The computer is new, but the mobile is old.", altEn: ["The computer is new, but the cell phone is old."], grammar: [g.adjective-agreement], vocab: [w.computer, w.cellulare] }
      - { es: "Mia figlia ha sedici anni e mio figlio tredici.", en: "My daughter is sixteen and my son thirteen.", altEs: ["Mia figlia ha sedici anni e mio figlio ne ha tredici."], grammar: [g.numbers-0-100, g.possessives-family], vocab: [w.sedici, w.tredici] }
      - { es: "Abbiamo sette gatti!", en: "We have seven cats!", altEs: ["Noi abbiamo sette gatti!"], grammar: [g.numbers-0-100, g.plural-nouns], vocab: [w.sette], transform: { instruction: "Change to 'she'", answer: "Ha sette gatti!", alt: ["Lei ha sette gatti!"] } }
      - { es: "Dieci più cinque fa quindici.", en: "Ten plus five makes fifteen.", altEs: ["Dieci più cinque è quindici."], altEn: ["Ten plus five is fifteen."], grammar: [g.numbers-0-100], vocab: [w.dieci, w.cinque, w.quindici] }
      - { es: "Scrivi il tuo numero qui, per favore.", en: "Write your number here, please.", altEs: ["Per favore, scrivi qui il tuo numero."], grammar: [g.possessives], vocab: [w.numero] }
      - { es: "L'autobus numero otto va a Trastevere.", en: "The number eight bus goes to Trastevere.", altEs: ["Il bus numero otto va a Trastevere."], altEn: ["Bus number eight goes to Trastevere."], grammar: [g.numbers-0-100], vocab: [w.numero, w.otto] }
    exchanges:
      - q: { es: "Quanti anni hai?", en: "How old are you?" }
        a: { es: "Ho diciannove anni.", en: "I'm nineteen." }
        alt: ["Diciannove.", "Ho vent'anni.", "Ho diciotto anni."]
        grammar: [g.avere-present, g.numbers-0-100]
        vocab: [w.diciannove, w.anno]
      - q: { es: "Qual è il tuo numero?", en: "What's your number?" }
        a: { es: "È tre, quattro, sette, due, zero, otto, uno.", en: "It's three, four, seven, two, zero, eight, one." }
        alt: ["Tre, quattro, sette, due, zero, otto, uno."]
        grammar: [g.numbers-0-100, g.question-words]
        vocab: [w.numero, w.zero]
      - q: { es: "Quanti fratelli hai?", en: "How many brothers and sisters do you have?" }
        a: { es: "Ho tre fratelli.", en: "I have three siblings." }
        alt: ["Tre.", "Non ho fratelli.", "Ho due sorelle."]
        grammar: [g.numbers-0-100, g.avere-present]
        vocab: [w.tre]
      - q: { es: "Quanti gatti avete?", en: "How many cats do you (all) have?" }
        a: { es: "Abbiamo quattro gatti!", en: "We have four cats!" }
        alt: ["Quattro.", "Due.", "Non abbiamo gatti."]
        grammar: [g.numbers-0-100, g.avere-present]
        vocab: [w.quattro]
      - q: { es: "Hai il cellulare?", en: "Do you have your mobile?" }
        a: { es: "Sì, ecco il mio numero.", en: "Yes, here's my number." }
        alt: ["Sì, certo.", "No, oggi no."]
        grammar: [g.avere-present]
        vocab: [w.cellulare, w.numero]
    texts:
      - title: "Biglietto"
        es: ["Ciao! Sono Marco, il cugino di Giulia.", "Il mio numero è tre, tre, otto, sei, due, uno, nove.", "Scrivi un messaggio!"]
        en: ["Hi! I'm Marco, Giulia's cousin.", "My number is three, three, eight, six, two, one, nine.", "Send a message!"]
        grammar: [g.numbers-0-100]
        vocab: [w.numero, w.messaggio]
      - title: "Mia sorella"
        es: ["Mia sorella Chiara ha quindici anni.", "Ha un cellulare nuovo e scrive cento messaggi al giorno.", "Mamma mia!"]
        en: ["My sister Chiara is fifteen.", "She has a new mobile and writes a hundred messages a day.", "Good heavens!"]
        grammar: [g.numbers-0-100, g.avere-present]
        vocab: [w.quindici, w.cellulare, w.messaggio, w.mamma-mia]
    spicy:
      - { es: "Mi dai il tuo numero? O preferisci il mio?", en: "Will you give me your number? Or do you prefer mine?", altEs: ["Mi dai il tuo numero di telefono? O preferisci il mio?"], grammar: [g.possessives], vocab: [w.numero] }
      - { es: "Ho vent'anni e zero fidanzati.", en: "I'm twenty and I have zero boyfriends.", altEs: ["Ho vent'anni e zero fidanzate.", "Ho venti anni e zero fidanzati."], grammar: [g.numbers-0-100, g.avere-present], vocab: [w.venti, w.zero] }
      - { es: "Il mio numero è facile: uno, due, tre... mi chiami?", en: "My number is easy: one, two, three... will you call me?", grammar: [g.numbers-0-100], vocab: [w.numero, w.due, w.tre] }
      - { es: "Dieci su dieci. Tu, non la pizza.", en: "Ten out of ten. You, not the pizza.", altEs: ["Dieci su dieci: tu, non la pizza."], grammar: [g.numbers-0-100], vocab: [w.dieci] }
      - { es: "Diciotto messaggi in un'ora? Qualcuno è innamorato!", en: "Eighteen messages in an hour? Someone's in love!", altEs: ["Diciotto messaggi in un'ora? Qualcuno è innamorata!"], grammar: [g.numbers-0-100], vocab: [w.diciotto, w.messaggio] }
  - id: a1.u03.l4
    title: Quanti anni hai?
    teach: [g.question-words]
    vocab: [w.trenta, w.quaranta, w.cinquanta, w.sessanta, w.settanta, w.ottanta, w.novanta, w.quanto, w.quale, w.quando, w.anno, w.età, w.compleanno, w.maggiore, w.minore, w.solo, w.insieme]
    tip: "Quanto agrees with its noun: quanti anni, quante sorelle. Tens drop their vowel before uno and otto: ventuno, trentotto."
    sentences:
      - { es: "Quanti anni hai? — Ho ventun anni.", en: "How old are you? — I'm twenty-one.", altEs: ["Quanti anni hai? — Ho ventuno anni.", "Quanti anni hai? — Ventuno."], grammar: [g.question-words, g.numbers-0-100], vocab: [w.quanto, w.anno] }
      - { es: "Mia madre ha cinquantadue anni.", en: "My mother is fifty-two.", altEn: ["My mother is fifty-two years old."], grammar: [g.numbers-0-100], vocab: [w.cinquanta] }
      - { es: "Mio nonno ha ottantotto anni!", en: "My grandfather is eighty-eight!", grammar: [g.numbers-0-100], vocab: [w.ottanta], error: { wrong: "Mio nonno ha ottantaotto anni!", explain: "Tens drop their final vowel before otto and uno: ottantotto, ventuno.", grammar: g.numbers-0-100 } }
      - { es: "Trenta, quaranta, cinquanta, sessanta.", en: "Thirty, forty, fifty, sixty.", grammar: [g.numbers-0-100], vocab: [w.trenta, w.quaranta, w.cinquanta, w.sessanta], kinds: [dictation, listen, typeEs, order] }
      - { es: "Settanta, ottanta, novanta, cento.", en: "Seventy, eighty, ninety, one hundred.", grammar: [g.numbers-0-100], vocab: [w.settanta, w.ottanta, w.novanta], kinds: [dictation, listen, typeEs, order] }
      - { es: "Quando è il tuo compleanno?", en: "When is your birthday?", altEs: ["Quand'è il tuo compleanno?", "Il tuo compleanno quand'è?"], grammar: [g.question-words], vocab: [w.quando, w.compleanno] }
      - { es: "Mia sorella maggiore ha trentatré anni.", en: "My older sister is thirty-three.", altEs: ["La mia sorella maggiore ha trentatré anni."], grammar: [g.numbers-0-100, g.possessives-family], vocab: [w.maggiore, w.trenta], note: "trentatré, ventitré: numbers ending in tre take an accent. With maggiore and minore you hear both mia sorella maggiore and la mia sorella maggiore." }
      - { es: "Mio fratello minore si chiama Luca.", en: "My younger brother is called Luca.", altEs: ["Il mio fratello minore si chiama Luca."], grammar: [g.possessives-family], vocab: [w.minore] }
      - { es: "Chi è la ragazza nella foto? — È mia cugina.", en: "Who's the girl in the photo? — She's my cousin.", altEs: ["Chi è la ragazza della foto? — È mia cugina."], grammar: [g.question-words], vocab: [w.cugino] }
      - { es: "Perché studi italiano? — Perché mia moglie è italiana.", en: "Why are you studying Italian? — Because my wife is Italian.", altEs: ["Perché studi l'italiano? — Perché mia moglie è italiana."], grammar: [g.question-words, g.accents], vocab: [w.perché] }
      - { es: "Dove abitano i tuoi nonni?", en: "Where do your grandparents live?", altEs: ["I tuoi nonni dove abitano?"], grammar: [g.question-words, g.possessives-family], vocab: [w.dove, w.nonno] }
      - { es: "Che età ha tua nonna?", en: "How old is your grandmother?", altEs: ["Quanti anni ha tua nonna?"], altEn: ["What age is your grandmother?"], grammar: [g.question-words], vocab: [w.età] }
      - { es: "Quanti fratelli hai?", en: "How many brothers and sisters do you have?", altEs: ["Tu quanti fratelli hai?"], altEn: ["How many siblings do you have?"], grammar: [g.question-words], vocab: [w.quanto], transform: { instruction: "Ask formally (Lei)", answer: "Quanti fratelli ha?", alt: ["Lei quanti fratelli ha?"] } }
      - { es: "Abito da solo, ma la domenica ceniamo tutti insieme.", en: "I live alone, but on Sundays we all have dinner together.", altEs: ["Abito da sola, ma la domenica ceniamo tutti insieme."], grammar: [g.question-words], vocab: [w.solo, w.insieme] }
      - { es: "Quale foto preferisci, questa o quella?", en: "Which photo do you prefer, this one or that one?", altEs: ["Quale foto preferisci: questa o quella?"], grammar: [g.question-words], vocab: [w.quale] }
      - { es: "Com'è tuo padre? — È alto e molto simpatico.", en: "What's your father like? — He's tall and very nice.", altEs: ["Come è tuo padre? — È alto e molto simpatico."], grammar: [g.question-words], vocab: [w.come, w.padre] }
    exchanges:
      - q: { es: "Quando è il tuo compleanno?", en: "When is your birthday?" }
        a: { es: "È domani!", en: "It's tomorrow!" }
