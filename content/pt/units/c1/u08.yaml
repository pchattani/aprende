id: c1.u08
title: "Leitura literária"
lessons:
  - id: c1.u08.l1
    title: Olhos de cigana oblíqua e dissimulada
    teach: [g.literary-language]
    vocab: [w.cigano, w.oblíquo, w.dissimulado, w.olhar.n, w.fitar, w.contemplar, w.adultério, w.alienista, w.loucura, w.delírio, w.defunto, w.póstumo, w.verme, w.capítulo, w.prefácio, w.epígrafe, w.estilo, w.narrativa, w.narrar, w.verossimilhança, w.realismo, w.cadáver, w.internar, w.hospício, w.ciência, w.digressão, w.contradição, w.confiável, w.cometer, w.escandalizar, w.realista, w.arrastar]
    tip: "Machado's narrators chat with the reader, joke and mislead. Expect inversion, classical clitics (dir-se-ia, pareceu-me) and long sentences: read with a dictionary."
    sentences:
      - { es: "Capitu tinha olhos de cigana oblíqua e dissimulada.", en: "Capitu had the eyes of a sly, deceitful gypsy.", altEn: ["Capitu had the eyes of a sidelong, dissembling gypsy."], grammar: [g.literary-language], vocab: [w.cigano, w.oblíquo, w.dissimulado], note: "José Dias's famous description of Capitu in Dom Casmurro (1899)." }
      - { es: "Em Dom Casmurro, o narrador nunca prova o adultério de Capitu.", en: "In Dom Casmurro, the narrator never proves Capitu's adultery.", altEs: ["Em Dom Casmurro, o narrador jamais prova o adultério de Capitu."], grammar: [g.literary-language], vocab: [w.adultério, w.narrador, w.provar] }
      - { es: "Leitor, não te apresses: este capítulo é curto, mas importa.", en: "Reader, do not hurry: this chapter is short, but it matters.", altEs: ["Leitor, não se apresse: este capítulo é curto, mas importa."], grammar: [g.literary-language, g.imperative-negative], vocab: [w.leitor, w.apressar-se, w.capítulo], note: "The narrator addresses the reader with tu, as Machado does." }
      - { es: "Dir-se-ia que o tempo havia parado naquela sala.", en: "One would say that time had stopped in that room.", altEs: ["Parecia que o tempo tinha parado naquela sala.", "Dir-se-ia que o tempo parara naquela sala."], grammar: [g.literary-language], vocab: [w.parar, w.sala], error: { wrong: "Diria-se que o tempo havia parado naquela sala.", explain: "In literary style the pronoun goes inside the conditional (mesoclisis): dir-se-ia. In everyday Brazilian, say Parecia que…", grammar: g.literary-language } }
      - { es: "Memórias Póstumas de Brás Cubas é narrado por um defunto.", en: "The Posthumous Memoirs of Brás Cubas is narrated by a dead man.", altEs: ["As Memórias Póstumas de Brás Cubas são narradas por um defunto."], grammar: [g.literary-language, g.passive-ser], vocab: [w.póstumo, w.narrar, w.defunto], note: "Brás Cubas calls himself a defunto autor: not an author who died, but a dead man who writes." }
      - { es: "O livro é dedicado ao verme que primeiro comeu o cadáver do narrador.", en: "The book is dedicated to the worm that first gnawed the narrator's corpse.", altEs: ["O livro é dedicado ao verme que comeu primeiro o cadáver do narrador."], grammar: [g.literary-language, g.passive-ser], vocab: [w.verme, w.cadáver] }
      - { es: "Em O Alienista, um médico interna quase a cidade inteira por loucura.", en: "In The Alienist, a doctor commits nearly the whole town to the asylum for madness.", altEs: ["Em O Alienista, um médico manda internar quase a cidade inteira por loucura."], grammar: [g.literary-language], vocab: [w.alienista, w.internar, w.loucura] }
      - { es: "Brás Cubas tem um delírio em que viaja até a origem dos séculos.", en: "Brás Cubas has a delirium in which he travels back to the origin of the centuries.", altEs: ["Brás Cubas tem um delírio no qual viaja até a origem dos séculos."], grammar: [g.literary-language, g.relative-o-qual], vocab: [w.delírio, w.origem, w.século] }
      - { es: "Bentinho fitava Capitu sem saber se ela o enganava.", en: "Bentinho stared at Capitu without knowing whether she was deceiving him.", altEs: ["Bentinho olhava fixamente para Capitu sem saber se ela o enganava."], grammar: [g.literary-language, g.imperfect], vocab: [w.fitar, w.enganar-se] }
      - { es: "Pareceu-me que ela contemplava o rio com outros olhos.", en: "It seemed to me that she was contemplating the river with different eyes.", altEs: ["Me pareceu que ela contemplava o rio com outros olhos."], grammar: [g.literary-language, g.clitic-placement-norm], vocab: [w.contemplar, w.parecer], variant: "Starting with the pronoun (Me pareceu…) is normal in Brazilian speech; Pareceu-me… is literary in Brazil and standard in Portugal." }
      - { es: "O estilo de Machado é feito de ironia, digressões e capítulos curtíssimos.", en: "Machado's style is made of irony, digressions and very short chapters.", grammar: [g.literary-language], vocab: [w.estilo, w.ironia, w.digressão] }
      - { es: "Com o realismo, a narrativa brasileira trocou o herói perfeito pelo personagem cheio de contradições.", en: "With realism, Brazilian narrative swapped the perfect hero for the character full of contradictions.", grammar: [g.literary-language], vocab: [w.realismo, w.narrativa, w.herói, w.contradição] }
      - { es: "A verossimilhança não exige que a história seja verdadeira, só que pareça.", en: "Verisimilitude does not require the story to be true, only to seem so.", altEs: ["A verossimilhança não exige que a história seja verdadeira, apenas que pareça."], grammar: [g.literary-language, g.subjunctive-impersonal], vocab: [w.verossimilhança, w.exigir] }
      - { es: "O olhar de Capitu é chamado de “olhos de ressaca”: puxa as pessoas para dentro, como o mar.", en: "Capitu's gaze is called “undertow eyes”: it pulls people in, like the sea.", grammar: [g.literary-language], vocab: [w.olhar.n, w.ressaca, w.puxar], note: "Ressaca here is the undertow of the sea (it also means hangover)." }
      - { es: "Parecia que o tempo tinha parado.", en: "It seemed that time had stopped.", grammar: [g.literary-language], vocab: [w.parecer], transform: { instruction: "Rewrite in literary style, with mesoclisis and haver", answer: "Dir-se-ia que o tempo havia parado.", alt: ["Dir-se-ia que o tempo parara.", "Dir-se-ia que o tempo tinha parado."], en: "One would say that time had stopped." } }
      - { es: "Me pareceu que ela sorria.", en: "It seemed to me that she was smiling.", grammar: [g.literary-language, g.clitic-placement-norm], vocab: [w.sorrir], transform: { instruction: "Use classical enclisis", answer: "Pareceu-me que ela sorria." } }
    exchanges:
      - q: { es: "Afinal, Capitu traiu ou não traiu Bentinho?", en: "So did Capitu cheat on Bentinho or not?" }
        a: { es: "Ninguém sabe: o narrador é suspeito, e Machado nunca dá a resposta.", en: "Nobody knows: the narrator is biased, and Machado never gives the answer." }
        alt: ["Depende do leitor.", "Ninguém sabe ao certo."]
        grammar: [g.literary-language]
        vocab: [w.trair, w.narrador, w.suspeito]
      - q: { es: "Por que o narrador de Memórias Póstumas é tão estranho?", en: "Why is the narrator of the Posthumous Memoirs so strange?" }
        a: { es: "Porque é um defunto autor, que começa o livro pela própria morte.", en: "Because he's a dead author, who starts the book with his own death." }
        alt: ["Porque ele já morreu.", "Porque narra depois de morto."]
        grammar: [g.literary-language]
        vocab: [w.defunto, w.morte]
      - q: { es: "O que o leitor encontra em O Alienista?", en: "What does the reader find in The Alienist?" }
        a: { es: "Uma sátira da ciência: no fim, o próprio médico acaba internado no hospício.", en: "A satire of science: in the end, the doctor himself ends up committed to the asylum." }
        alt: ["Uma sátira da ciência.", "Uma história sobre loucura e poder."]
        grammar: [g.literary-language]
        vocab: [w.alienista, w.sátira, w.hospício]
      - q: { es: "Você tem dificuldade com o estilo de Machado?", en: "Do you find Machado's style difficult?" }
        a: { es: "No começo, sim: as frases longas e as inversões exigem um dicionário ao lado.", en: "At first, yes: the long sentences and inversions need a dictionary by your side." }
        alt: ["Um pouco, mas vale a pena.", "Não, adoro o estilo dele."]
        grammar: [g.literary-language]
        vocab: [w.estilo, w.inversão, w.dicionário]
      - q: { es: "O que quer dizer “olhos de ressaca”?", en: "What does “undertow eyes” mean?" }
        a: { es: "É o olhar de Capitu: um olhar que arrasta a pessoa para dentro, como a onda do mar.", en: "It's Capitu's gaze: a gaze that drags you in, like a wave of the sea." }
        alt: ["É o olhar de Capitu.", "Um olhar que puxa a pessoa, como o mar."]
        grammar: [g.literary-language]
        vocab: [w.olhar.n, w.arrastar]
    texts:
      - title: "Contracapa de Dom Casmurro"
        es: ["Bento Santiago, já velho, decide narrar a própria vida.", "No centro da narrativa está Capitu, a dos olhos oblíquos e dissimulados.", "Teria ela cometido adultério? O leitor que decida."]
        en: ["Bento Santiago, now an old man, decides to narrate his own life.", "At the centre of the narrative is Capitu, she of the sidelong, dissembling eyes.", "Did she commit adultery? Let the reader decide."]
        grammar: [g.literary-language]
        vocab: [w.narrar, w.narrativa, w.adultério]
      - title: "Nota da professora"
        es: ["Leiam o prefácio e a epígrafe antes do primeiro capítulo.", "Prestem atenção às conversas do narrador com o leitor.", "Nelas está a ironia machadiana."]
        en: ["Read the preface and the epigraph before the first chapter.", "Pay attention to the narrator's conversations with the reader.", "That's where Machado's irony lies."]
        grammar: [g.literary-language]
        vocab: [w.prefácio, w.epígrafe, w.capítulo]
    spicy:
      - { es: "Você tem olhos de cigana oblíqua e dissimulada, e eu tenho a paciência do Bentinho: pouca.", en: "You have the eyes of a sly, deceitful gypsy, and I have Bentinho's patience: very little.", altEs: ["Você tem olhos de cigana oblíqua e dissimulada, e eu, a paciência do Bentinho: pouca."], grammar: [g.literary-language], vocab: [w.oblíquo, w.dissimulado, w.paciência] }
      - { es: "Leitor, não te escandalizes: ela só me beijou no capítulo seguinte.", en: "Reader, be not shocked: she only kissed me in the following chapter.", altEs: ["Leitor, não se escandalize: ela só me beijou no capítulo seguinte."], grammar: [g.literary-language, g.imperative-negative], vocab: [w.escandalizar, w.capítulo] }
      - { es: "Dir-se-ia que você me fitava; dir-se-ia, também, que eu gostava.", en: "One would say you were staring at me; one would also say I liked it.", altEs: ["Parecia que você me olhava; e parecia, também, que eu gostava."], grammar: [g.literary-language], vocab: [w.fitar] }
      - { es: "O meu estilo de paquera é realista: poucas palavras e muito olhar.", en: "My flirting style is realist: few words and a lot of looking.", altEs: ["Meu estilo de paquera é realista: poucas palavras, muito olhar."], grammar: [g.literary-language], vocab: [w.estilo, w.paquera, w.olhar.n] }
      - { es: "Prometo ser um narrador confiável: tudo o que eu contar sobre esta noite será verossímil.", en: "I promise to be a reliable narrator: everything I tell about tonight will be believable.", altEs: ["Prometo ser um narrador confiável: tudo o que eu contar desta noite será verossímil."], grammar: [g.literary-language, g.future-subjunctive-relative], vocab: [w.narrador, w.confiável, w.verossímil] }

  - id: c1.u08.l2
    title: O navio já partira
    teach: [g.narrative-tenses-literary]
    vocab: [w.entardecer, w.amanhecer, w.anoitecer, w.crepúsculo, w.aurora, w.embranquecer, w.outrora, w.deveras, w.assaz, w.porventura, w.eis, w.algures, w.alhures, w.doravante, w.mister, w.ensejo, w.intento, w.ímpeto, w.baía, w.horizonte, w.palacete, w.abandonar, w.trecho, w.vapor]
    tip: "falara, fizera, dissera = tinha falado, tinha feito, tinha dito. Form: eles preterite minus -m. In speech it survives in Quem dera!, Pudera! and Tomara!"
    sentences:
      - { es: "Quando chegamos ao porto de Belém, o navio já partira.", en: "When we reached the port of Belém, the ship had already sailed.", altEs: ["Quando chegamos ao porto de Belém, o navio já tinha partido.", "Quando chegamos ao porto de Belém, o navio já havia partido."], grammar: [g.narrative-tenses-literary, g.pluperfect], vocab: [w.navio, w.partir] }
      - { es: "Nunca vira tanta água junta como na baía do Guajará.", en: "He had never seen so much water in one place as in Guajará Bay.", altEs: ["Nunca tinha visto tanta água junta como na baía do Guajará."], grammar: [g.narrative-tenses-literary], vocab: [w.baía, w.junto] }
      - { es: "Em 1616, os portugueses fundam o Forte do Presépio, origem de Belém.", en: "In 1616, the Portuguese found Fort Presépio, the origin of Belém.", altEs: ["Em 1616, os portugueses fundaram o Forte do Presépio, origem de Belém."], grammar: [g.narrative-tenses-literary], vocab: [w.fundar, w.forte.n, w.origem], note: "Historic present: past events told in the present for vividness." }
      - { es: "Fora eu rico, compraria um palacete na Cidade Velha.", en: "Were I rich, I would buy a mansion in the Old Town.", altEs: ["Se eu fosse rico, compraria um palacete na Cidade Velha.", "Fosse eu rico, compraria um palacete na Cidade Velha."], grammar: [g.narrative-tenses-literary, g.conditional-hypothetical], vocab: [w.rico, w.palacete] }
      - { es: "Quem dera eu pudesse ver o Círio de Nazaré pelo menos uma vez!", en: "If only I could see the Círio de Nazaré at least once!", altEs: ["Tomara que eu possa ver o Círio de Nazaré pelo menos uma vez!", "Quem me dera ver o Círio de Nazaré pelo menos uma vez!"], grammar: [g.narrative-tenses-literary, g.quem-dera], vocab: [w.quem-dera], note: "The Círio de Nazaré, on the second Sunday of October, is Belém's great religious festival." }
      - { es: "Está exausto? Pudera: carregou caixas de peixe no Ver-o-Peso desde a aurora.", en: "Is he exhausted? No wonder: he's been carrying crates of fish at Ver-o-Peso since dawn.", altEs: ["Está exausto? Também, carregou caixas de peixe no Ver-o-Peso desde a aurora."], grammar: [g.narrative-tenses-literary], vocab: [w.exausto, w.carregar, w.caixa, w.aurora] }
      - { es: "Ao anoitecer, as luzes do Theatro da Paz acendiam-se uma a uma.", en: "At nightfall, the lights of the Theatro da Paz came on one by one.", altEs: ["Ao anoitecer, as luzes do Theatro da Paz se acendiam uma a uma."], grammar: [g.narrative-tenses-literary, g.imperfect], vocab: [w.anoitecer, w.luz, w.acender] }
      - { es: "Outrora, a borracha fizera de Belém uma das cidades mais ricas do Brasil.", en: "In days gone by, rubber had made Belém one of the richest cities in Brazil.", altEs: ["Antigamente, a borracha tinha feito de Belém uma das cidades mais ricas do Brasil."], grammar: [g.narrative-tenses-literary], vocab: [w.outrora, w.borracha, w.rico] }
      - { es: "O crepúsculo pintava de vermelho as águas da baía.", en: "The twilight was painting the waters of the bay red.", altEs: ["O crepúsculo pintava as águas da baía de vermelho."], grammar: [g.narrative-tenses-literary, g.imperfect], vocab: [w.crepúsculo, w.pintar, w.baía] }
      - { es: "Os cabelos do velho embranqueceram, mas o ímpeto da juventude não o abandonara.", en: "The old man's hair had turned white, but the impetus of youth had not deserted him.", altEs: ["Os cabelos do velho embranqueceram, mas o ímpeto da juventude não o tinha abandonado."], grammar: [g.narrative-tenses-literary], vocab: [w.embranquecer, w.ímpeto, w.juventude, w.abandonar] }
      - { es: "Eis que, ao entardecer, surge no horizonte o navio tão esperado.", en: "And lo, at dusk, the long-awaited ship appears on the horizon.", altEs: ["Eis que, ao entardecer, surge no horizonte o tão esperado navio."], grammar: [g.narrative-tenses-literary, g.subordination-complex], vocab: [w.eis, w.entardecer, w.horizonte] }
      - { es: "Achou a proposta assaz generosa e, deveras comovido, aceitou.", en: "He found the offer most generous and, truly moved, accepted.", altEs: ["Achou a proposta bastante generosa e, realmente comovido, aceitou."], grammar: [g.narrative-tenses-literary], vocab: [w.assaz, w.deveras, w.generoso, w.comovido] }
      - { es: "Se porventura o leitor encontrar este livro algures, não o empreste a ninguém.", en: "Should the reader perchance come across this book somewhere, let him lend it to no one.", altEs: ["Se por acaso o leitor encontrar este livro em algum lugar, não o empreste a ninguém."], grammar: [g.narrative-tenses-literary, g.future-subjunctive-se], vocab: [w.porventura, w.algures, w.emprestar] }
      - { es: "Ela já dissera que não viria.", en: "She had already said she wouldn't come.", altEs: ["Ela já tinha dito que não viria.", "Ela já havia dito que não viria."], grammar: [g.narrative-tenses-literary], vocab: [w.dizer, w.vir], error: { wrong: "Ela já dissesse que não viria.", explain: "The simple pluperfect is dissera (= tinha dito, indicative); dissesse is the imperfect subjunctive.", grammar: g.narrative-tenses-literary } }
      - { es: "Quando ele chegou, ela já tinha saído.", en: "When he arrived, she had already gone out.", grammar: [g.narrative-tenses-literary, g.pluperfect], vocab: [w.sair], transform: { instruction: "Use the simple pluperfect", answer: "Quando ele chegou, ela já saíra.", alt: ["Quando chegou, ela já saíra."] } }
      - { es: "Em 1878, inaugurou-se o Theatro da Paz.", en: "In 1878, the Theatro da Paz was opened.", grammar: [g.narrative-tenses-literary, g.se-passive], vocab: [w.inaugurar], transform: { instruction: "Retell it in the historic present", answer: "Em 1878, inaugura-se o Theatro da Paz.", alt: ["Em 1878, o Theatro da Paz é inaugurado."] } }
    exchanges:
      - q: { es: "O que quer dizer “fizera” neste trecho?", en: "What does “fizera” mean in this passage?" }
        a: { es: "Quer dizer “tinha feito”: é o mais-que-perfeito simples, típico da literatura.", en: "It means “had done”: it's the simple pluperfect, typical of literature." }
        alt: ["Quer dizer “tinha feito”.", "É o mesmo que “havia feito”."]
        grammar: [g.narrative-tenses-literary]
        vocab: [w.trecho, w.típico]
      - q: { es: "Você vai ao Círio este ano?", en: "Are you going to the Círio this year?" }
        a: { es: "Quem dera! Tenho plantão no hospital.", en: "I wish! I'm on duty at the hospital." }
        alt: ["Quem dera!", "Vou, se Deus quiser."]
        grammar: [g.narrative-tenses-literary, g.quem-dera]
        vocab: [w.quem-dera, w.plantão]
      - q: { es: "Qual era o intento do escritor com esse prefácio?", en: "What was the writer's purpose with that preface?" }
        a: { es: "Avisar o leitor de que, doravante, nada do que o narrador disser será totalmente confiável.", en: "To warn the reader that, from now on, nothing the narrator says will be entirely reliable." }
        alt: ["Avisar o leitor.", "Preparar o leitor para a ironia."]
        grammar: [g.narrative-tenses-literary, g.future-subjunctive-relative]
        vocab: [w.intento, w.doravante, w.prefácio]
      - q: { es: "Onde se passa a segunda parte do romance?", en: "Where is the second part of the novel set?" }
        a: { es: "Alhures: o escritor nunca diz o nome da cidade.", en: "Elsewhere: the author never names the town." }
        alt: ["Numa cidade sem nome.", "O escritor não diz."]
        grammar: [g.narrative-tenses-literary]
        vocab: [w.alhures, w.romance]
      - q: { es: "Por que o herói escreveu a carta tão tarde?", en: "Why did the hero write the letter so late?" }
        a: { es: "Faltara-lhe o ensejo; quando o encontrou, já era mister ser breve.", en: "He had lacked the opportunity; when he found it, brevity had become a necessity." }
        alt: ["Não tivera oportunidade antes.", "Faltou-lhe a ocasião."]
        grammar: [g.narrative-tenses-literary, g.literary-language]
        vocab: [w.ensejo, w.mister]
    texts:
      - title: "Início de um conto"
        es: ["Era já noite quando o vapor chegou a Belém.", "O jovem bacharel nunca vira tanta gente num só porto.", "Fizera a viagem inteira em silêncio, e ninguém lhe perguntara o nome."]
        en: ["It was already night when the steamer reached Belém.", "The young graduate had never seen so many people in a single port.", "He had made the whole journey in silence, and nobody had asked him his name."]
        grammar: [g.narrative-tenses-literary]
        vocab: [w.vapor, w.bacharel, w.silêncio]
      - title: "Linha do tempo de Belém"
        es: ["1616: os portugueses fundam o Forte do Presépio.", "1878: inaugura-se o Theatro da Paz.", "1912: a borracha da Ásia derruba os preços, e a riqueza de outrora começa a desaparecer."]
        en: ["1616: the Portuguese found Fort Presépio.", "1878: the Theatro da Paz is opened.", "1912: Asian rubber brings prices crashing down, and the wealth of former days begins to vanish."]
        grammar: [g.narrative-tenses-literary]
        vocab: [w.outrora, w.riqueza, w.derrubar]
    spicy:
      - { es: "Quem dera eu fosse o seu despertador: acordaria você todo amanhecer com um beijo.", en: "If only I were your alarm clock: I'd wake you every dawn with a kiss.", altEs: ["Quem dera eu fosse o seu despertador: te acordaria todo amanhecer com um beijo."], grammar: [g.narrative-tenses-literary, g.quem-dera], vocab: [w.despertador, w.amanhecer, w.beijo] }
      - { es: "Eis que, ao entardecer, você aparece de vestido branco e eu esqueço o meu próprio nome.", en: "And lo, at dusk, you appear in a white dress and I forget my own name.", altEs: ["Eis que, ao entardecer, você aparece de vestido branco e eu esqueço meu próprio nome."], grammar: [g.narrative-tenses-literary], vocab: [w.eis, w.entardecer, w.vestido] }
      - { es: "Nunca vira ninguém dançar carimbó assim; doravante, não quero ver mais ninguém.", en: "I had never seen anyone dance carimbó like that; from now on, I don't want to see anyone else.", altEs: ["Nunca tinha visto ninguém dançar carimbó assim; daqui em diante, não quero ver mais ninguém."], grammar: [g.narrative-tenses-literary], vocab: [w.carimbó, w.doravante] }
      - { es: "Se porventura você estiver livre hoje à noite, conheço um lugar na Cidade Velha com o melhor açaí de Belém.", en: "If perchance you're free tonight, I know a place in the Old Town with the best açaí in Belém.", altEs: ["Se por acaso você estiver livre hoje à noite, conheço um lugar na Cidade Velha com o melhor açaí de Belém."], grammar: [g.narrative-tenses-literary, g.future-subjunctive-se], vocab: [w.porventura, w.açaí] }
      - { es: "Não foi intento meu me apaixonar, mas o ímpeto foi maior do que a razão.", en: "Falling in love was not my intention, but the impulse was stronger than reason.", altEs: ["Não era meu intento me apaixonar, mas o ímpeto foi mais forte do que a razão."], grammar: [g.narrative-tenses-literary], vocab: [w.intento, w.ímpeto, w.apaixonar-se] }

  - id: c1.u08.l3
    title: Vinde e vede
    teach: [g.vos-archaic]
    vocab: [w.vós, w.vos, w.vosso, w.convosco, w.alma, w.espírito, w.eterno, w.eternidade, w.lágrima, w.pranto, w.suspirar, w.suspiro, w.fronte, w.leito, w.mangueira, w.norte, w.viúva, w.solene, w.bíblico, w.cômico, w.padre, w.missa, w.religioso, w.lábio]
    tip: "vós sois, tendes, ides; imperative falai, vinde, ide, sede. You meet it in prayers, the Bible, solemn speeches and northern Portugal; vos and convosco are still everyday object forms in Portugal."
    sentences:
      - { es: "Ave Maria, cheia de graça, o Senhor é convosco.", en: "Hail Mary, full of grace, the Lord is with thee.", grammar: [g.vos-archaic], vocab: [w.convosco, w.graça, w.cheio], note: "In prayers, vós is used to address God and the saints with reverence." }
      - { es: "Pai Nosso, que estais no céu, santificado seja o vosso nome.", en: "Our Father, who art in heaven, hallowed be thy name.", grammar: [g.vos-archaic], vocab: [w.vosso, w.céu] }
      - { es: "No Círio de Nazaré, milhares de fiéis cantam com lágrimas nos olhos.", en: "At the Círio de Nazaré, thousands of the faithful sing with tears in their eyes.", altEs: ["No Círio de Nazaré, milhares de fiéis cantam com os olhos cheios de lágrimas."], grammar: [g.vos-archaic], vocab: [w.fiel, w.lágrima, w.cantar] }
      - { es: "Senhoras e senhores, eu vos agradeço a presença nesta noite.", en: "Ladies and gentlemen, I thank you for your presence this evening.", altEs: ["Senhoras e senhores, agradeço a presença de vocês nesta noite.", "Senhoras e senhores, agradeço-vos a presença nesta noite."], grammar: [g.vos-archaic, g.formal-address-titles], vocab: [w.vos, w.agradecer, w.presença], variant: "In Portugal vos is the normal object form for vocês: Agradeço-vos a presença." }
      - { es: "Ide em paz, e que o Senhor vos acompanhe.", en: "Go in peace, and may the Lord be with you.", altEs: ["Vão em paz, e que o Senhor os acompanhe."], grammar: [g.vos-archaic, g.subjunctive-wishes], vocab: [w.paz, w.acompanhar] }
      - { es: "Sede bem-vindos a Belém, a cidade das mangueiras!", en: "Be welcome to Belém, the city of mango trees!", altEs: ["Sejam bem-vindos a Belém, a cidade das mangueiras!"], grammar: [g.vos-archaic], vocab: [w.bem-vindo, w.mangueira], note: "Sede is both the vós imperative of ser and the noun 'thirst'." }
      - { es: "Que fizestes vós da vossa juventude?", en: "What have ye done with your youth?", altEs: ["O que vocês fizeram da sua juventude?"], grammar: [g.vos-archaic], vocab: [w.vós, w.juventude] }
      - { es: "Vós sabeis que a alma não envelhece.", en: "Ye know that the soul does not grow old.", altEs: ["Vocês sabem que a alma não envelhece."], grammar: [g.vos-archaic], vocab: [w.alma, w.envelhecer] }
      - { es: "Tendes razão, senhores: o espírito desta festa é eterno.", en: "You are right, gentlemen: the spirit of this festival is eternal.", altEs: ["Vocês têm razão, senhores: o espírito desta festa é eterno."], grammar: [g.vos-archaic], vocab: [w.espírito, w.eterno, w.razão] }
      - { es: "No norte de Portugal, ainda se ouve “vós sois” na fala do dia a dia.", en: "In northern Portugal you still hear “vós sois” in everyday speech.", grammar: [g.vos-archaic], vocab: [w.norte, w.falar, w.dia-a-dia] }
      - { es: "A viúva passou a noite em pranto ao lado do leito.", en: "The widow spent the night weeping beside the bed.", altEs: ["A viúva passou a noite chorando ao lado do leito."], grammar: [g.vos-archaic, g.literary-language], vocab: [w.viúva, w.pranto, w.leito] }
      - { es: "Ele suspirou, passou a mão pela fronte e não disse nada.", en: "He sighed, passed his hand across his brow and said nothing.", altEs: ["Ele suspirou, passou a mão na testa e não disse nada."], grammar: [g.vos-archaic, g.literary-language], vocab: [w.suspirar, w.fronte, w.mão] }
      - { es: "Vós sois muito gentis.", en: "Ye are very kind.", altEs: ["Vocês são muito gentis."], grammar: [g.vos-archaic], vocab: [w.vós, w.gentil], error: { wrong: "Vós são muito gentis.", explain: "Vós has its own verb forms: sois, tendes, ides, estais.", grammar: g.vos-archaic } }
      - { es: "Eu vos agradeço, meus amigos.", en: "I thank you, my friends.", altEs: ["Eu agradeço a vocês, meus amigos.", "Agradeço-vos, meus amigos."], grammar: [g.vos-archaic], vocab: [w.vos, w.agradecer], error: { wrong: "Eu vós agradeço, meus amigos.", explain: "The object pronoun is vos, with no accent; vós is the subject form.", grammar: g.vos-archaic } }
      - { es: "Vocês têm razão.", en: "You are right.", grammar: [g.vos-archaic], vocab: [w.razão], transform: { instruction: "Rewrite it in the solemn vós form", answer: "Vós tendes razão.", alt: ["Tendes razão."], en: "Ye are right." } }
      - { es: "Venham e vejam!", en: "Come and see!", grammar: [g.vos-archaic, g.imperative-irregular], vocab: [w.vir, w.ver], transform: { instruction: "Use the archaic vós imperative", answer: "Vinde e vede!", en: "Come ye and see!" } }
    exchanges:
      - q: { es: "Onde ainda se usa “vós” hoje em dia?", en: "Where is “vós” still used nowadays?" }
        a: { es: "Nas orações, na Bíblia, em discursos solenes e em algumas regiões do norte de Portugal.", en: "In prayers, in the Bible, in solemn speeches and in some regions of northern Portugal." }
        alt: ["Nas orações e na Bíblia.", "No norte de Portugal, por exemplo."]
        grammar: [g.vos-archaic]
        vocab: [w.vós, w.oração, w.solene]
      - q: { es: "O que o padre diz no começo da missa?", en: "What does the priest say at the start of Mass?" }
        a: { es: "“O Senhor esteja convosco”, e todo mundo responde “Ele está no meio de nós”.", en: "“The Lord be with you,” and everyone answers “He is among us.”" }
        alt: ["O Senhor esteja convosco."]
        grammar: [g.vos-archaic, g.subjunctive-wishes]
        vocab: [w.convosco, w.padre, w.missa]
      - q: { es: "O que é o Círio de Nazaré?", en: "What is the Círio de Nazaré?" }
        a: { es: "Uma grande festa religiosa em Belém, no segundo domingo de outubro, que reúne mais de dois milhões de pessoas.", en: "A huge religious festival in Belém, on the second Sunday of October, which draws more than two million people." }
        alt: ["A maior festa religiosa de Belém.", "Uma festa religiosa em outubro, em Belém."]
        grammar: [g.vos-archaic]
        vocab: [w.religioso, w.reunir]
      - q: { es: "Por que ela chorou no fim do livro?", en: "Why did she cry at the end of the book?" }
        a: { es: "Porque o herói morre no leito, com o nome dela nos lábios.", en: "Because the hero dies in his bed, with her name on his lips." }
        alt: ["Porque o herói morre.", "Porque o final é muito triste."]
        grammar: [g.literary-language]
        vocab: [w.leito, w.lábio, w.herói]
      - q: { es: "Posso usar “vós” numa conversa com os amigos?", en: "Can I use “vós” in a conversation with friends?" }
        a: { es: "Melhor não: soa bíblico ou cômico. Use “vocês”.", en: "Better not: it sounds biblical or comic. Use “vocês”." }
        alt: ["Não, use “vocês”.", "Só se quiser fazer graça."]
        grammar: [g.vos-archaic]
        vocab: [w.vós, w.soar]
    texts:
      - title: "Oração da manhã"
        es: ["Senhor, a vós entrego o meu dia.", "Dai-me paciência no trabalho e alegria em casa.", "E que a vossa paz esteja conosco."]
        en: ["Lord, to thee I give my day.", "Give me patience at work and joy at home.", "And may thy peace be with us."]
        grammar: [g.vos-archaic]
        vocab: [w.vós, w.vosso, w.entregar]
      - title: "Discurso de formatura"
        es: ["Caros colegas, eu vos agradeço estes cinco anos de convivência.", "Ide pelo mundo, mas não esqueçais de onde viestes.", "Sede felizes!"]
        en: ["Dear classmates, I thank you for these five years together.", "Go out into the world, but forget not whence you came.", "Be happy!"]
        grammar: [g.vos-archaic]
        vocab: [w.vos, w.convivência, w.formatura]
    spicy:
      - { es: "Senhoras e senhores, eu vos apresento a pessoa mais bonita desta festa.", en: "Ladies and gentlemen, I present to you the most beautiful person at this party.", altEs: ["Senhoras e senhores, apresento a vocês a pessoa mais bonita desta festa."], grammar: [g.vos-archaic], vocab: [w.vos, w.apresentar] }
      - { es: "Vinde dançar, vós que estais sentados, que a música não espera!", en: "Come and dance, ye who are sitting down, for the music waits for no one!", altEs: ["Venham dançar, vocês que estão sentados, que a música não espera!"], grammar: [g.vos-archaic], vocab: [w.vós, w.sentar-se] }
      - { es: "Ela suspirou, ele corou, e o resto da noite ficou entre os dois.", en: "She sighed, he blushed, and the rest of the night stayed between the two of them.", altEs: ["Ela suspirou, ele ficou vermelho, e o resto da noite ficou entre os dois."], grammar: [g.literary-language], vocab: [w.suspirar, w.corar] }
      - { es: "Uma lágrima de emoção, um suspiro e um sorriso: eis a minha cara quando você chega.", en: "A tear of emotion, a sigh and a smile: that's my face when you arrive.", altEs: ["Uma lágrima de emoção, um suspiro e um sorriso: essa é a minha cara quando você chega."], grammar: [g.literary-language], vocab: [w.lágrima, w.suspiro, w.sorriso] }
      - { es: "Não te prometo a eternidade, mas te prometo um açaí no Ver-o-Peso todo domingo.", en: "I don't promise you eternity, but I promise you an açaí at Ver-o-Peso every Sunday.", altEs: ["Não prometo a eternidade, mas prometo um açaí no Ver-o-Peso todo domingo."], grammar: [g.vos-archaic], vocab: [w.eternidade, w.prometer] }

  - id: c1.u08.l4
    title: Um sarau na Belle Époque
    teach: [g.literary-language, g.narrative-tenses-literary]
    vocab: [w.melancolia, w.melancólico, w.lânguido, w.efêmero, w.sorriso, w.rubor, w.corar, w.aposento, w.sarau, w.baile, w.valsa, w.carruagem, w.sinhá, w.agregado, w.bacharel, w.barão, w.visconde, w.romântico, w.romantismo, w.naturalismo, w.parnasianismo, w.escapar, w.retirar-se, w.superlativo, w.idealizar, w.examinar, w.piedade, w.cortiço, w.moda, w.ousado, w.plantação, w.despencar, w.humano, w.nação, w.idealizado]
    tip: "Rubber money turned Belém into a tropical Paris: barons, carriages, waltzes and soirées. Its novels mix the simple pluperfect with the vocabulary of the 19th-century salon."
    sentences:
      - { es: "Na Belle Époque, os barões da borracha davam saraus nos palacetes de Belém.", en: "In the Belle Époque, the rubber barons threw soirées in Belém's mansions.", altEs: ["Na Belle Époque, os barões da borracha faziam saraus nos palacetes de Belém."], grammar: [g.literary-language, g.imperfect], vocab: [w.barão, w.borracha, w.sarau, w.palacete] }
      - { es: "Chegavam de carruagem ao Theatro da Paz, vestidos à moda de Paris.", en: "They arrived at the Theatro da Paz by carriage, dressed in the Paris fashion.", grammar: [g.literary-language, g.imperfect], vocab: [w.carruagem, w.moda] }
      - { es: "No baile, o jovem bacharel convidou a filha do visconde para uma valsa.", en: "At the ball, the young law graduate asked the viscount's daughter for a waltz.", altEs: ["No baile, o jovem bacharel tirou a filha do visconde para uma valsa."], grammar: [g.literary-language], vocab: [w.baile, w.bacharel, w.visconde, w.valsa] }
      - { es: "Ela corou, e o rubor não escapou aos olhos da mãe.", en: "She blushed, and the flush did not escape her mother's eyes.", altEs: ["Ela corou, e o rubor não escapou dos olhos da mãe."], grammar: [g.literary-language], vocab: [w.corar, w.rubor, w.escapar] }
      - { es: "Com um sorriso lânguido, a sinhá retirou-se para o seu aposento.", en: "With a languid smile, the mistress withdrew to her chamber.", altEs: ["Com um sorriso lânguido, a sinhá se retirou para o seu aposento."], grammar: [g.literary-language, g.clitic-placement-norm], vocab: [w.sorriso, w.lânguido, w.sinhá, w.aposento, w.retirar-se], note: "Sinhá was the title enslaved people used for the mistress of the house." }
      - { es: "José Dias, o agregado da família, tinha sempre um superlativo na ponta da língua.", en: "José Dias, the family's hanger-on, always had a superlative on the tip of his tongue.", grammar: [g.literary-language], vocab: [w.agregado, w.superlativo, w.língua], note: "In Dom Casmurro, José Dias loves superlatives: gravíssimo, lindíssimo." }
      - { es: "O romantismo idealizava o amor; o realismo o examinava sem piedade.", en: "Romanticism idealised love; realism examined it without mercy.", altEs: ["O romantismo idealizava o amor, e o realismo o examinava sem piedade."], grammar: [g.literary-language, g.imperfect], vocab: [w.romantismo, w.idealizar, w.realismo, w.piedade] }
      - { es: "O parnasianismo de Olavo Bilac buscava a forma perfeita do verso.", en: "Olavo Bilac's Parnassianism sought the perfect form of the verse.", grammar: [g.literary-language], vocab: [w.parnasianismo, w.forma, w.verso] }
      - { es: "O naturalismo de Aluísio Azevedo mostrou a vida dura dos cortiços.", en: "Aluísio Azevedo's naturalism showed the harsh life of the tenements.", grammar: [g.literary-language], vocab: [w.naturalismo, w.cortiço], note: "O Cortiço (1890) is the classic Brazilian naturalist novel." }
      - { es: "A glória da borracha foi efêmera: em poucas décadas, a riqueza acabara.", en: "The glory of rubber was short-lived: within a few decades the wealth was gone.", altEs: ["A glória da borracha foi efêmera: em poucas décadas, a riqueza tinha acabado."], grammar: [g.narrative-tenses-literary], vocab: [w.efêmero, w.glória, w.década] }
      - { es: "Uma melancolia doce tomava conta da cidade ao fim da tarde.", en: "A sweet melancholy took hold of the city at the end of the afternoon.", altEs: ["Uma doce melancolia tomava conta da cidade ao fim da tarde."], grammar: [g.literary-language, g.imperfect], vocab: [w.melancolia] }
      - { es: "Era um poeta romântico e melancólico, que morreu jovem, como mandava a moda.", en: "He was a romantic, melancholic poet, who died young, as fashion required.", grammar: [g.literary-language], vocab: [w.romântico, w.melancólico, w.poeta] }
      - { es: "Em Iracema, José de Alencar transformou uma lenda indígena num poema em prosa.", en: "In Iracema, José de Alencar turned an indigenous legend into a prose poem.", grammar: [g.literary-language], vocab: [w.lenda, w.indígena, w.prosa] }
      - { es: "Os barões da borracha haviam construído palacetes enormes.", en: "The rubber barons had built enormous mansions.", altEs: ["Os barões da borracha tinham construído palacetes enormes."], grammar: [g.narrative-tenses-literary, g.pluperfect], vocab: [w.barão, w.construir, w.palacete], error: { wrong: "Os barões da borracha haviam construídos palacetes enormes.", explain: "With ter / haver the participle never agrees: haviam construído.", grammar: g.narrative-tenses-literary } }
      - { es: "Quando o baile começou, ela já tinha chegado.", en: "When the ball began, she had already arrived.", grammar: [g.narrative-tenses-literary], vocab: [w.baile], transform: { instruction: "Use the simple pluperfect", answer: "Quando o baile começou, ela já chegara." } }
      - { es: "Se ele fosse mais ousado, teria pedido uma valsa.", en: "If he had been bolder, he would have asked for a waltz.", grammar: [g.narrative-tenses-literary, g.se-clauses-unreal], vocab: [w.ousado, w.valsa], transform: { instruction: "Use the literary conditional with fora + subject", answer: "Fora ele mais ousado, teria pedido uma valsa.", alt: ["Fosse ele mais ousado, teria pedido uma valsa."], en: "Had he been bolder, he would have asked for a waltz." } }
    exchanges:
      - q: { es: "Como era um sarau no século XIX?", en: "What was a soirée like in the 19th century?" }
        a: { es: "Lia-se poesia, tocava-se piano, e as moças trocavam olhares com os bacharéis.", en: "Poetry was read, the piano was played, and the young ladies exchanged glances with the graduates." }
        alt: ["Tinha música, poesia e muita conversa.", "Lia-se poesia e tocava-se piano."]
        grammar: [g.literary-language, g.se-passive]
        vocab: [w.sarau, w.poesia, w.bacharel]
      - q: { es: "Por que a era da borracha foi tão efêmera?", en: "Why was the rubber era so short-lived?" }
        a: { es: "Porque as sementes levadas para a Ásia deram plantações mais baratas, e os preços despencaram.", en: "Because the seeds taken to Asia produced cheaper plantations, and prices collapsed." }
        alt: ["Por causa da concorrência da Ásia.", "Porque os preços despencaram."]
        grammar: [g.literary-language]
        vocab: [w.efêmero, w.semente, w.plantação, w.despencar]
      - q: { es: "Você prefere o romantismo ou o realismo?", en: "Do you prefer Romanticism or Realism?" }
        a: { es: "O realismo: o romantismo me parece melancólico demais.", en: "Realism: Romanticism seems far too melancholic to me." }
        alt: ["O romantismo, sem dúvida.", "Depende do escritor."]
        grammar: [g.literary-language]
        vocab: [w.romantismo, w.realismo, w.melancólico]
      - q: { es: "Quem eram os agregados nos romances do século XIX?", en: "Who were the dependants in 19th-century novels?" }
        a: { es: "Pessoas que viviam de favor na casa de uma família rica, como o José Dias de Dom Casmurro.", en: "People who lived on the charity of a rich family, like José Dias in Dom Casmurro." }
        alt: ["Pessoas que moravam de favor com uma família rica."]
        grammar: [g.literary-language]
        vocab: [w.agregado, w.favor]
      - q: { es: "Ela ficou vermelha?", en: "Did she go red?" }
        a: { es: "Corou até as orelhas, mas fingiu que era o calor.", en: "She blushed to the tips of her ears, but pretended it was the heat." }
        alt: ["Corou, mas disfarçou.", "Ficou, coitada."]
        grammar: [g.literary-language]
        vocab: [w.corar, w.orelha, w.fingir]
    texts:
      - title: "Convite (1890)"
        es: ["O Barão e a Baronesa têm a honra de convidar Vossa Senhoria para o sarau de sábado.", "Haverá piano, leitura de poesia e baile.", "Carruagens a partir das oito horas."]
        en: ["The Baron and Baroness have the honour of inviting you to Saturday's soirée.", "There will be piano music, poetry reading and a ball.", "Carriages from eight o'clock."]
        grammar: [g.literary-language, g.formal-address-titles]
        vocab: [w.honra, w.sarau, w.carruagem]
      - title: "Resumo para a prova"
        es: ["Romantismo: amor idealizado, natureza e nação.", "Realismo: ironia e crítica da sociedade.", "Naturalismo: o ser humano determinado pelo meio.", "Parnasianismo: a arte pela arte e o verso perfeito."]
        en: ["Romanticism: idealised love, nature and nation.", "Realism: irony and social criticism.", "Naturalism: human beings determined by their environment.", "Parnassianism: art for art's sake and the perfect verse."]
        grammar: [g.literary-language]
        vocab: [w.romantismo, w.realismo, w.naturalismo, w.parnasianismo, w.escapar, w.retirar-se, w.superlativo, w.idealizar, w.examinar, w.piedade, w.cortiço, w.moda, w.ousado, w.plantação, w.despencar, w.humano, w.nação, w.idealizado]
    spicy:
      - { es: "Concede-me esta valsa, ou terei de esperar pelo próximo século?", en: "Will you grant me this waltz, or must I wait for the next century?", altEs: ["Você me concede esta valsa, ou vou ter que esperar o próximo século?"], grammar: [g.literary-language], vocab: [w.conceder, w.valsa] }
      - { es: "Você corou, e esse rubor foi a melhor resposta que eu já recebi.", en: "You blushed, and that flush was the best answer I've ever had.", altEs: ["Você corou, e esse rubor foi a melhor resposta que já recebi."], grammar: [g.literary-language], vocab: [w.corar, w.rubor] }
      - { es: "Sou romântico à moda antiga: carruagem não tenho, mas tenho moto e flores.", en: "I'm romantic in the old-fashioned way: I don't have a carriage, but I do have a motorbike and flowers.", altEs: ["Sou um romântico à moda antiga: carruagem não tenho, mas tenho moto e flores."], grammar: [g.literary-language], vocab: [w.romântico, w.carruagem, w.moto] }
      - { es: "O seu sorriso lânguido devia ser proibido nos saraus de família.", en: "Your languid smile ought to be banned at family soirées.", altEs: ["Esse seu sorriso lânguido devia ser proibido nos saraus de família."], grammar: [g.literary-language], vocab: [w.sorriso, w.lânguido, w.sarau] }
      - { es: "Dizem que o amor de verão é efêmero; o nosso já dura três invernos amazônicos.", en: "They say summer love is fleeting; ours has already lasted three Amazonian winters.", altEs: ["Dizem que amor de verão é efêmero; o nosso já dura três invernos amazônicos."], grammar: [g.literary-language], vocab: [w.efêmero, w.inverno], note: "In the Amazon, inverno is the rainy season." }
dialogues:
  - id: c1.u08.d1
    title: No sebo da Cidade Velha
    context: In a second-hand bookshop in Belém's old town, Luana, a literature student, asks Seu Benedito for advice.
    lines:
      - { speaker: Luana, es: "Boa tarde! O senhor tem algum livro de Machado de Assis para quem está começando?", en: "Good afternoon! Do you have any Machado de Assis for a beginner?" }
      - { speaker: Seu Benedito, es: "Tenho vários. Para começar, eu recomendaria os contos; “A Cartomante” é curto e cheio de ironia.", en: "I have several. To start with, I'd recommend the short stories; “The Fortune-Teller” is short and full of irony." }
      - { speaker: Luana, es: "A professora mandou ler Dom Casmurro, mas tenho medo daquelas frases antigas.", en: "My teacher told us to read Dom Casmurro, but I'm scared of those old-fashioned sentences." }
      - { speaker: Seu Benedito, es: "Não tenha. Machado conversa com o leitor o tempo todo; dir-se-ia um amigo contando um segredo.", en: "Don't be. Machado talks to the reader all the time; you'd think it was a friend telling you a secret." }
      - { speaker: Luana, es: "E o que é “fizera”? Apareceu três vezes só no primeiro capítulo.", en: "And what is “fizera”? It came up three times in the first chapter alone." }
      - { speaker: Seu Benedito, es: "É o mais-que-perfeito simples: quer dizer “tinha feito”. Na literatura, é muito comum.", en: "It's the simple pluperfect: it means “had done”. In literature it's very common." }
      - { speaker: Luana, es: "Ah, então não é subjuntivo! E o senhor tem algum escritor daqui do Pará?", en: "Oh, so it's not the subjunctive! And do you have any authors from here in Pará?" }
      - { speaker: Seu Benedito, es: "Dalcídio Jurandir, de Marajó. Ninguém escreveu sobre a chuva e a melancolia da Amazônia como ele.", en: "Dalcídio Jurandir, from Marajó. Nobody wrote about the rain and the melancholy of the Amazon like him." }
      - { speaker: Luana, es: "Vou levar os dois. Quem dera eu tivesse tempo para ler tudo o que há nesta loja!", en: "I'll take both. If only I had time to read everything in this shop!" }
      - { speaker: Seu Benedito, es: "Leia devagar, minha filha. Os bons livros sabem esperar.", en: "Read slowly, my dear. Good books know how to wait." }
    questions:
      - { q: "Por que a Luana tem medo de ler Dom Casmurro?", options: ["Porque o livro é muito longo", "Por causa das frases antigas", "Porque não gosta de romances"], answer: 1, explain: "She says she is scared of daquelas frases antigas." }
      - { q: "Segundo o livreiro, o que significa “fizera”?", options: ["“tinha feito”", "“fizesse”", "“faria”"], answer: 0, explain: "Fizera is the simple pluperfect, the literary form of tinha feito." }
      - { q: "Quem é Dalcídio Jurandir?", options: ["Um poeta português", "Um escritor de Marajó", "Um personagem de Machado"], answer: 1, explain: "Seu Benedito recommends him as an author from Marajó, in Pará." }
      - { q: "O que a Luana decide fazer no fim?", options: ["Levar os dois livros", "Voltar outro dia", "Pedir os livros emprestados"], answer: 0, explain: "Vou levar os dois: she buys both books." }
