id: r.a2.un-week-end-a-rouen
level: a2
title: Un week-end à Rouen
kind: text
intro: Julie writes in her blog about a weekend in Rouen, the capital of Normandy, with its cathedral, its old clock and the memory of Joan of Arc.
allow: [julie, karim, gros-horloge, monet, centre, blog]
paragraphs:
  - { es: "Samedi dernier, j'ai pris le train à la gare Saint-Lazare avec mon ami Karim. Rouen n'est pas loin de Paris : le voyage a duré une heure et demie. Nous avons laissé nos valises à l'hôtel et nous avons commencé la visite tout de suite.", en: "Last Saturday I took the train at Saint-Lazare station with my friend Karim. Rouen isn't far from Paris: the journey took an hour and a half. We left our cases at the hotel and started our visit straight away." }
  - { es: "D'abord, nous avons vu la cathédrale. Elle est immense et sa façade est magnifique. Au dix-neuvième siècle, le peintre Claude Monet a peint cette façade plus de trente fois, le matin, l'après-midi, au soleil et sous la pluie. Karim a pris beaucoup de photos, et moi, j'ai acheté une carte postale avec un tableau de Monet.", en: "First we saw the cathedral. It's immense and its façade is magnificent. In the nineteenth century the painter Claude Monet painted this façade more than thirty times, in the morning, in the afternoon, in the sun and in the rain. Karim took lots of photos, and I bought a postcard with a painting by Monet." }
  - { es: "Ensuite, nous avons marché dans la vieille ville. Les rues sont étroites et les vieilles maisons ont des couleurs différentes. Dans une rue, nous avons découvert le Gros-Horloge, une très vieille horloge avec un beau soleil d'or. Nous avons déjeuné dans une crêperie près de là. J'ai mangé une galette au fromage et Karim a choisi une crêpe au chocolat.", en: "Then we walked around the old town. The streets are narrow and the old houses are different colours. In one street we discovered the Gros-Horloge, a very old clock with a beautiful golden sun. We had lunch in a crêperie near there. I ate a cheese galette and Karim chose a chocolate crêpe." }
  - { es: "L'après-midi, nous avons visité la place du Vieux-Marché. C'est une place très importante dans l'histoire de France : en 1431, les Anglais ont brûlé Jeanne d'Arc ici. Elle avait dix-neuf ans. Aujourd'hui, il y a une église moderne sur la place, avec un toit très original. Nous avons regardé les vitraux en silence.", en: "In the afternoon we visited the Place du Vieux-Marché. It's a very important square in French history: in 1431 the English burned Joan of Arc here. She was nineteen. Today there's a modern church on the square, with a very original roof. We looked at the stained-glass windows in silence." }
  - { es: "Le soir, nous avons dîné dans un restaurant normand. Nous avons goûté le camembert, et nous avons bu du cidre. Karim n'a pas aimé le camembert : il a trouvé l'odeur trop forte ! Moi, j'ai adoré. Après le dîner, nous avons fait une promenade le long de la Seine.", en: "In the evening we had dinner in a Normandy restaurant. We tasted the camembert and drank some cider. Karim didn't like the camembert: he found the smell too strong! I loved it. After dinner we went for a walk along the Seine." }
  - { es: "Dimanche, il a plu toute la journée. Nous avons visité un musée et nous avons acheté des souvenirs. Nous avons repris le train à cinq heures. C'est un week-end parfait pour découvrir la Normandie, et ce n'est pas cher. Vous connaissez Rouen ? Laissez-moi un message !", en: "On Sunday it rained all day. We visited a museum and bought some souvenirs. We took the train back at five o'clock. It's a perfect weekend for discovering Normandy, and it isn't expensive. Do you know Rouen? Leave me a message!" }
questions:
  - { q: "Combien de temps a duré le voyage en train ?", options: ["Une demi-heure", "Une heure et demie", "Trois heures"], answer: 1, explain: "«Le voyage a duré une heure et demie.»" }
  - { q: "Qu'est-ce que Monet a peint plus de trente fois ?", options: ["La Seine", "La façade de la cathédrale", "Le Gros-Horloge"], answer: 1, explain: "«Claude Monet a peint cette façade plus de trente fois», in different light and weather." }
  - { q: "Qu'est-ce qui s'est passé sur la place du Vieux-Marché en 1431 ?", options: ["On a construit la cathédrale", "Les Anglais ont brûlé Jeanne d'Arc", "Monet a peint un tableau"], answer: 1, explain: "«En 1431, les Anglais ont brûlé Jeanne d'Arc ici.» She was nineteen." }
  - { q: "Pourquoi Karim n'a pas aimé le camembert ?", options: ["Il l'a trouvé trop cher", "Il a trouvé l'odeur trop forte", "Il n'aime pas le fromage"], answer: 1, explain: "«Il a trouvé l'odeur trop forte !» Julie loved it." }
  - { q: "Quel temps a-t-il fait dimanche ?", options: ["Il a fait beau", "Il a neigé", "Il a plu"], answer: 2, explain: "«Dimanche, il a plu toute la journée.» So they went to a museum." }
glossary:
  - { es: "tout de suite", en: straight away }
  - { es: original, en: "unusual, original" }
  - { es: vitraux, en: stained-glass windows }
  - { es: odeur, en: smell }
  - { es: "le long de", en: along }
  - { es: or, en: gold }
