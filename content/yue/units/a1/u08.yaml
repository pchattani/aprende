      - { es: "佢老公係好人。", en: "Her husband is a good man.", altEs: ["佢老公係個好人。"], grammar: [g.hai6-identity], vocab: [w.hou2-jan4], note: "好人 is a noun (a good person), so here 係 is needed." }
