# B2 grammar notes (Lyon, the Alps, Burgundy and Alsace). Explanations use light
# markdown: ### headings, bullets, tables, **bold**, *italic* (French inline).
- id: g.subjonctif-conjonctions
  level: b2
  title: "Subjonctif after conjunctions: bien que, pour que, avant que, à moins que"
  summary: "Conjunctions of purpose, concession, condition, fear and time-before take the subjonctif; their prepositional twins take an infinitive."
  explanation: |
    | meaning | conjunction + **subjonctif** | same subject: preposition + **infinitive** |
    |---|---|---|
    | purpose | *pour que, afin que* | *pour, afin de* |
    | before | *avant que (ne)* | *avant de* |
    | without | *sans que* | *sans* |
    | unless | *à moins que (ne)* | *à moins de* |
    | for fear that | *de peur que (ne), de crainte que (ne)* | *de peur de* |
    | although | *bien que, quoique* | — |
    | provided that | *pourvu que, à condition que* | *à condition de* |
    | until | *jusqu'à ce que* | — |
    | in case | — (*au cas où* + conditional) | — |

    - *Je t'explique le chemin **pour que** tu ne te **perdes** pas.*
    - ***Bien qu'**il **fasse** froid, on visite les traboules.*
    - *Rentrons **avant qu'**il ne **pleuve**.*

    ### Indicative, not subjonctif
    *après que, parce que, pendant que, depuis que, alors que, tandis que, dès que, si bien que, même si*.

    ### Same subject → infinitive
    *Je me dépêche **pour arriver** à l'heure* (not *pour que j'arrive*).
  examples:
    - { es: "Je te donne un plan pour que tu ne te perdes pas dans les traboules.", en: "I'm giving you a map so you don't get lost in the traboules." }
    - { es: "Bien que le Vieux-Lyon soit très touristique, il reste authentique.", en: "Although Vieux-Lyon is very touristy, it remains authentic." }
    - { es: "On peut entrer dans la cour à condition qu'on fasse silence.", en: "We can go into the courtyard provided we keep quiet." }
    - { es: "Attends ici jusqu'à ce que le guide revienne.", en: "Wait here until the guide comes back." }
  pitfalls:
    - "*Après que* takes the indicative: *après qu'il est parti*."
    - "*Même si* + indicative: *même s'il pleut*, never *même s'il pleuve*."
    - "Same subject: *avant de partir*, not *avant que je parte*."
  related: [g.ne-expletif, g.subjonctif-passe, g.concession, g.purpose-clauses, g.pour-sans-infinitive]
  drills:
    - { es: "Je parle lentement pour que tu comprennes.", en: "I'm speaking slowly so that you understand." }
    - { es: "Il est sorti sans que personne le voie.", en: "He went out without anyone seeing him." }
    - { es: "Nous partirons à moins qu'il ne neige.", en: "We'll leave unless it snows." }
- id: g.ne-expletif
  level: b2
  title: "The ne explétif: avant qu'il ne parte, j'ai peur qu'il ne pleuve"
  summary: "A ne with no negative meaning, used in formal French after avant que, à moins que, de peur que, craindre que, and in comparisons."
  explanation: |
    The *ne explétif* is a lone **ne** (without *pas*) that does **not** make the sentence negative. It's optional and belongs to careful or formal French.

    | context | example | meaning |
    |---|---|---|
    | *avant que* | *Partons avant qu'il **ne** pleuve.* | before it rains |
    | *à moins que* | *à moins qu'il **ne** soit trop tard* | unless it's too late |
    | *de peur / crainte que* | *de peur qu'on **ne** le voie* | for fear someone sees him |
    | *avoir peur, craindre que* | *Je crains qu'il **ne** se trompe.* | I fear he's wrong |
    | *éviter, empêcher que* | *pour éviter qu'il **ne** tombe* | to stop him falling |
    | comparison of inequality | *C'est plus cher que je **ne** pensais.* | than I thought |

    ### Don't confuse
    - *J'ai peur qu'il **ne** vienne.* = I'm afraid he'll come.
    - *J'ai peur qu'il **ne** vienne **pas**.* = I'm afraid he won't come.

    In everyday speech it's simply left out: *avant qu'il pleuve*.
  examples:
    - { es: "Visitons la traboule avant que la porte ne ferme.", en: "Let's visit the traboule before the door closes." }
    - { es: "Je crains que le restaurant ne soit complet.", en: "I'm afraid the restaurant is full." }
    - { es: "Le repas était plus copieux que nous ne l'imaginions.", en: "The meal was more filling than we'd imagined." }
  pitfalls:
    - "It's not a negative: don't translate it as 'not'."
    - "Never with *bien que, pour que, sans que* (*sans que* already negative in meaning)."
  related: [g.subjonctif-conjonctions, g.subjonctif-emotion, g.ne-litteraire]
  drills:
    - { es: "Rentrons avant qu'il ne fasse nuit.", en: "Let's go back before it gets dark." }
    - { es: "J'ai peur qu'il ne soit déjà parti.", en: "I'm afraid he's already left." }
    - { es: "C'est plus loin que je ne croyais.", en: "It's further than I thought." }
- id: g.subjonctif-passe
  level: b2
  title: "The past subjonctif: que j'aie fini, qu'elle soit partie"
  summary: "subjonctif of avoir/être + participle, for an action completed before the main verb or a future deadline."
  explanation: |
    | | avoir | être |
    |---|---|---|
    | que j' / je | **aie** mangé | **sois** venu(e) |
    | que tu | aies mangé | sois venu(e) |
    | qu'il / elle | ait mangé | soit venu(e) |
    | que nous | ayons mangé | soyons venu(e)s |
    | que vous | ayez mangé | soyez venu(e)(s) |
    | qu'ils / elles | aient mangé | soient venu(e)s |

    ### When
    It expresses an action **completed** relative to the main verb:

    | main verb | same time / later | earlier / completed |
    |---|---|---|
    | *Je suis content…* | *…que tu **viennes**.* (you're coming) | *…que tu **sois venu**.* (you came) |
    | *Je doute…* | *…qu'il **comprenne**.* | *…qu'il **ait compris**.* |
    | *Il faut…* | *…que tu **finisses**.* | *…que tu **aies fini** avant midi.* (deadline) |

    Common after: emotions (*je regrette que tu sois parti*), doubt, *bien que*, superlatives (*le meilleur repas que j'aie jamais mangé*).
  examples:
    - { es: "Je suis ravi que vous ayez aimé le tablier de sapeur.", en: "I'm delighted you liked the tablier de sapeur." }
    - { es: "Bien qu'il ait beaucoup mangé, il a pris un dessert.", en: "Although he'd eaten a lot, he had a dessert." }
    - { es: "C'est le meilleur repas que j'aie jamais fait.", en: "It's the best meal I've ever had." }
    - { es: "Il faut que tu aies réservé avant vendredi.", en: "You need to have booked before Friday." }
  pitfalls:
    - "*Que j'aie* (avoir), not *que j'ai* (indicative)."
    - "Agreement with *être*: *Je suis content qu'elle soit venue.*"
  related: [g.subjonctif-conjonctions, g.subjonctif-emotion, g.subjonctif-relatives]
  drills:
    - { es: "Je regrette que tu ne sois pas venu.", en: "I'm sorry you didn't come." }
    - { es: "Je doute qu'ils aient compris.", en: "I doubt they understood." }
    - { es: "Bien qu'elle soit partie tôt, elle est arrivée en retard.", en: "Although she left early, she arrived late." }
- id: g.subjonctif-doute
  level: b2
  title: "Doubt and possibility: douter que, il est possible que, il se peut que"
  summary: "Doubt, possibility and denial take the subjonctif; certainty and probability take the indicative."
  explanation: |
    | **subjonctif** (doubt, possibility) | **indicative** (certainty, probability) |
    |---|---|
    | *Je doute que…* | *Je suis sûr / certain que…* |
    | *Il est possible / impossible que…* | *Il est probable que…* |
    | *Il se peut que…* (it may be that) | *Il est évident / clair / vrai que…* |
    | *Il est peu probable que…* | *Je sais que…* |
    | *Je ne suis pas sûr que…* | *Il me semble que…* |
    | *Ce n'est pas que…* | *Sans doute que… / Peut-être que…* |
    | *Nier que, contester que* | *Il paraît que…* |

    - *Je doute que tu **finisses** ton assiette.*
    - *Il est probable qu'il **viendra**.* / *Il est possible qu'il **vienne**.*

    ### Watch the opposites
    *Douter que* + subjonctif, but *se douter que* (suspect) + indicative: *Je me doutais que tu viendrais.*

    Negative certainty → subjonctif: *Je ne suis pas certain qu'il **ait** raison.*
  examples:
    - { es: "Je doute que tu finisses ce plat de quenelles.", en: "I doubt you'll finish this dish of quenelles." }
    - { es: "Il est possible que le bouchon soit complet ce soir.", en: "It's possible the bouchon is full tonight." }
    - { es: "Il est probable que les critiques adoreront ce restaurant.", en: "The critics will probably love this restaurant." }
    - { es: "Je me doutais que tu choisirais la cervelle de canut.", en: "I suspected you'd choose the cervelle de canut." }
  pitfalls:
    - "*Il est probable que* + indicative but *il est possible que* + subjonctif."
    - "*Peut-être que* + indicative: *Peut-être qu'il viendra.*"
  related: [g.opinion-mood, g.indicatif-ou-subjonctif, g.subjonctif-passe]
  drills:
    - { es: "Il se peut qu'il pleuve.", en: "It might rain." }
    - { es: "Je ne suis pas sûr que ce soit une bonne idée.", en: "I'm not sure it's a good idea." }
    - { es: "Il est évident qu'il a raison.", en: "It's obvious he's right." }
- id: g.subjonctif-relatives
  level: b2
  title: "Subjonctif in relative clauses: je cherche quelqu'un qui sache"
  summary: "Use the subjonctif in a relative clause for a hypothetical or uncertain antecedent, after a superlative, and after le seul, le premier, le dernier."
  explanation: |
    | context | example |
    |---|---|
    | something **sought / hypothetical** | *Je cherche un restaurant **qui soit** ouvert le dimanche.* (if one exists) |
    | **negative / nonexistent** | *Il n'y a personne **qui puisse** m'aider.* |
    | **superlative** | *C'est le meilleur bouchon **que je connaisse**.* |
    | ***le seul, l'unique, le premier, le dernier*** | *C'est le seul chef **qui fasse** encore ça.* |
    | question | *Connais-tu quelqu'un **qui sache** cuisiner les quenelles ?* |

    ### Meaning contrast
    - *Je cherche le serveur qui **sait** faire les quenelles.* — a specific waiter I know exists (indicative).
    - *Je cherche un serveur qui **sache** faire les quenelles.* — any waiter, if there is one (subjonctif).

    With -er verbs the two forms often sound the same (*qui parle*); verbs like *savoir, pouvoir, être, avoir, faire* show the difference.

    After a superlative stating a plain fact, the indicative is possible: *C'est le plus grand pont qu'on a construit ici* (fact) vs *que l'on **ait** construit* (judgement, more formal).
  examples:
    - { es: "Je cherche un bouchon qui soit ouvert le lundi.", en: "I'm looking for a bouchon that's open on Mondays." }
    - { es: "C'est le plat le plus étonnant que j'aie jamais goûté.", en: "It's the most surprising dish I've ever tasted." }
    - { es: "Il n'y a aucun chef qui fasse la quenelle comme lui.", en: "There's no chef who makes quenelles like him." }
    - { es: "Bocuse est le premier chef qui ait obtenu trois étoiles pendant cinquante ans.", en: "Bocuse is the first chef to have kept three stars for fifty years." }
  pitfalls:
    - "A known, existing thing takes the indicative: *J'ai trouvé un restaurant qui est ouvert.*"
    - "*Le seul qui puisse*, not *le seul qui peut* in careful French."
  related: [g.subjonctif-passe, g.superlatives, g.subjonctif-nuance]
  drills:
    - { es: "Je cherche quelqu'un qui puisse m'aider.", en: "I'm looking for someone who can help me." }
    - { es: "C'est le seul film qui me fasse rire.", en: "It's the only film that makes me laugh." }
    - { es: "Il n'y a rien qui me plaise ici.", en: "There's nothing here I like." }
- id: g.indicatif-ou-subjonctif
  level: b2
  title: "Indicative or subjonctif? Tricky pairs"
  summary: "espérer (ind.) vs souhaiter (subj.), probable (ind.) vs possible (subj.), après que (ind.) vs avant que (subj.), penser (ind.) vs ne pas penser (subj.)."
  explanation: |
    | **indicative** | **subjonctif** |
    |---|---|
    | *J'espère qu'il **viendra**.* | *Je souhaite qu'il **vienne**.* |
    | *Il est probable qu'il **pleuvra**.* | *Il est possible qu'il **pleuve**.* |
    | *Après qu'il **est** parti…* | *Avant qu'il **parte**…* |
    | *Je pense que c'**est** vrai.* | *Je ne pense pas que ce **soit** vrai.* |
    | *Je suis sûr qu'il **sait**.* | *Je ne suis pas sûr qu'il **sache**.* |
    | *Il me semble que c'**est** juste.* | *Il semble que ce **soit** juste.* (less certain) |
    | *Même si tu **as** raison…* | *Bien que tu **aies** raison…* |
    | *Je me doute qu'il **ment**.* | *Je doute qu'il **mente**.* |
    | *Il paraît qu'il **est** malade.* | *Il est rare qu'il **soit** malade.* |

    ### Meaning changes with mood
    - *Dire que* (state) + ind. / *dire que* (order) + subj.: *Dis-lui qu'il **vient** demain* (inform) vs *Dis-lui qu'il **vienne** demain* (tell him to come).
    - *Admettre que* (acknowledge) + ind. / (accept as hypothesis) + subj.
    - *De sorte que* + ind. (result) / + subj. (purpose).

    Rule of thumb: the indicative presents a **fact**; the subjonctif presents an **idea** (wanted, feared, doubted, possible).
  examples:
    - { es: "J'espère que le restaurant sera ouvert.", en: "I hope the restaurant will be open." }
    - { es: "Je souhaite que tout se passe bien.", en: "I hope everything goes well." }
    - { es: "Il semble que le chef soit absent ce soir.", en: "It seems the chef is away tonight." }
    - { es: "Dis-lui qu'il vienne à huit heures.", en: "Tell him to come at eight." }
  pitfalls:
    - "*Espérer* never takes the subjonctif in the affirmative: *j'espère qu'il viendra*."
    - "*Il me semble que* + ind., *il semble que* + subj. (usually)."
  related: [g.subjonctif-doute, g.opinion-mood, g.subjonctif-nuance]
  drills:
    - { es: "J'espère que tu vas mieux.", en: "I hope you're feeling better." }
    - { es: "Il est rare qu'il fasse si froid.", en: "It's rare for it to be so cold." }
    - { es: "Après qu'il est parti, on a rangé.", en: "After he left, we tidied up." }
- id: g.conditionnel-passe
  level: b2
  title: "The conditionnel passé: j'aurais aimé, nous serions venus"
  summary: "conditional of avoir/être + participle: would have done. Regrets, past hypotheses and unrealised possibilities."
  explanation: |
    | | avoir | être |
    |---|---|---|
    | je / j' | **aurais** vu | **serais** venu(e) |
    | tu | aurais vu | serais venu(e) |
    | il / elle | aurait vu | serait venu(e) |
    | nous | aurions vu | serions venu(e)s |
    | vous | auriez vu | seriez venu(e)(s) |
    | ils / elles | auraient vu | seraient venu(e)s |

    ### Uses
    | use | example |
    |---|---|
    | result of a past unreal condition | *Si j'avais su, je **serais venu**.* |
    | regret | *J'**aurais aimé** voir les illuminations.* |
    | reproach (with devoir, pouvoir) | *Tu **aurais pu** me prévenir !* |
    | unconfirmed past fact (press) | *L'incendie **aurait fait** trois blessés.* |
    | future-in-the-past, completed | *Il a dit qu'il **aurait fini** à six heures.* |

    Translation: "would have", "could have" (*aurais pu*), "should have" (*aurais dû*).
  examples:
    - { es: "J'aurais adoré voir la Fête des Lumières.", en: "I would have loved to see the Festival of Lights." }
    - { es: "Sans la pluie, nous serions restés plus longtemps.", en: "Without the rain, we would have stayed longer." }
    - { es: "Tu aurais pu mettre une bougie à la fenêtre !", en: "You could have put a candle in the window!" }
    - { es: "Il a promis qu'il aurait terminé avant le 8 décembre.", en: "He promised he would have finished before 8 December." }
  pitfalls:
    - "Agreement with *être*: *Elle serait venue*."
    - "Never after *si*: *si j'avais su*, not *si j'aurais su*."
  related: [g.si-plus-que-parfait, g.regret-reproach, g.conditionnel-journalistique, g.mixed-si-clauses]
  drills:
    - { es: "Nous aurions préféré partir plus tôt.", en: "We would have preferred to leave earlier." }
    - { es: "Elle serait venue avec plaisir.", en: "She would have been glad to come." }
    - { es: "Vous auriez dû me le dire.", en: "You should have told me." }
- id: g.si-plus-que-parfait
  level: b2
  title: "Si + plus-que-parfait, conditionnel passé: si j'avais su…"
  summary: "Si j'avais su, je serais venu plus tôt. Unreal conditions in the past: things that didn't happen."
  explanation: |
    | si + **plus-que-parfait** | **conditionnel passé** |
    |---|---|
    | *Si j'avais su,* | *je serais venu plus tôt.* |
    | *Si nous étions partis à l'heure,* | *nous aurions vu les illuminations.* |
    | *S'il n'avait pas plu,* | *la fête aurait été parfaite.* |

    The three types of *si* sentences:

    | type | si + | main clause | meaning |
    |---|---|---|---|
    | 1 | présent | futur / présent | possible: *S'il pleut, je reste.* |
    | 2 | imparfait | conditionnel présent | imaginary now: *S'il pleuvait, je resterais.* |
    | 3 | plus-que-parfait | conditionnel passé | unreal past: *S'il avait plu, je serais resté.* |

    ### Without si
    *Sans ton aide, j'aurais échoué. À ta place, j'aurais refusé. Avec un peu de chance, on aurait gagné.*

    *Si seulement* + plus-que-parfait = if only: *Si seulement j'avais pris mon appareil !*
  examples:
    - { es: "Si j'avais su, j'aurais réservé une fenêtre sur la place Bellecour.", en: "If I'd known, I'd have booked a window on Place Bellecour." }
    - { es: "Si nous étions arrivés plus tôt, nous aurions trouvé une place.", en: "If we'd arrived earlier, we'd have found a spot." }
    - { es: "Qu'est-ce que tu aurais fait si le métro avait été fermé ?", en: "What would you have done if the metro had been closed?" }
    - { es: "Si seulement j'avais écouté ma mère !", en: "If only I'd listened to my mother!" }
  pitfalls:
    - "Not *si j'aurais su*: the most famous mistake in French. *Si j'avais su.*"
    - "English 'if I'd known' is ambiguous ('had' or 'would'): after *si* it's always *avais*."
  related: [g.conditionnel-passe, g.mixed-si-clauses, g.si-imparfait-conditionnel, g.plus-que-parfait]
  drills:
    - { es: "Si tu m'avais appelé, je serais venu.", en: "If you'd called me, I'd have come." }
    - { es: "S'il avait fait beau, on serait sortis.", en: "If the weather had been nice, we'd have gone out." }
    - { es: "Je n'aurais rien dit si j'avais su.", en: "I wouldn't have said anything if I'd known." }
- id: g.mixed-si-clauses
  level: b2
  title: "Mixed conditions: si j'avais pris le métro, je serais déjà là"
  summary: "Combine a past condition with a present result (si + plus-que-parfait, conditionnel présent) or a present condition with a past result."
  explanation: |
    | condition | result | example |
    |---|---|---|
    | past (plus-que-parfait) | present (conditionnel présent) | *Si j'**avais pris** le métro, je **serais** déjà arrivé.* … *je **serais** là maintenant.* |
    | present (imparfait) | past (conditionnel passé) | *Si j'**étais** plus courageux, je lui **aurais parlé** hier.* |

    - *Si tu **avais écouté** le guide, tu **saurais** où on est.* (you didn't listen → you don't know now)
    - *Si elle **parlait** allemand, elle **aurait eu** le poste.* (she doesn't speak it → she didn't get it)

    ### Si in other meanings (any tense)
    - *si* = whether: *Je ne sais pas s'il **viendra**.*
    - *si* = whenever (habit): *S'il **pleuvait**, on **restait** à la maison.*
    - *si* = if it's true that: *S'il **a dit** ça, il **a eu** tort.*
  examples:
    - { es: "Si on était partis plus tôt, on serait au premier rang maintenant.", en: "If we'd left earlier, we'd be in the front row now." }
    - { es: "Si j'aimais la foule, je serais allé à la fête hier.", en: "If I liked crowds, I'd have gone to the festival yesterday." }
    - { es: "Si tu avais dormi, tu ne serais pas si fatigué.", en: "If you'd slept, you wouldn't be so tired." }
  pitfalls:
    - "Check the time of each half separately and choose the tense for it."
    - "Still no conditional after *si*."
  related: [g.si-plus-que-parfait, g.si-imparfait-conditionnel, g.conditionnel-passe]
  drills:
    - { es: "Si j'avais gagné, je serais riche.", en: "If I'd won, I'd be rich." }
    - { es: "S'il était sérieux, il aurait réservé.", en: "If he were serious, he'd have booked." }
    - { es: "Si nous avions une voiture, nous serions venus.", en: "If we had a car, we'd have come." }
- id: g.devoir-nuances
  level: b2
  title: "The many meanings of devoir"
  summary: "must (obligation), must be (probability), was supposed to, should, should have: il doit partir, il a dû se perdre, il devait venir, tu devrais, tu aurais dû."
  explanation: |
    | form | meaning | example |
    |---|---|---|
    | *Je **dois** partir.* | must, have to | obligation |
    | *Il **doit** être fatigué.* | must be | probability now |
    | *Il **a dû** partir.* | had to / must have | obligation or probability in the past |
    | *Elle **a dû** se perdre.* | she must have got lost | supposition |
    | *Nous **devions** partir à huit heures.* | we were supposed to | plan, often unfulfilled |
    | *Le train **doit** arriver à midi.* | is due to | schedule |
    | *Tu **devrais** te reposer.* | should, ought to | advice |
    | *Tu **aurais dû** me le dire.* | should have | reproach, regret |
    | *Je **dois** 50 euros à Paul.* | owe | debt |

    ### Pouvoir works similarly
    *Tu pourrais m'aider ?* (could you) / *Il a pu se tromper.* (he may have been wrong) / *Tu aurais pu le dire !* (you could have)
  examples:
    - { es: "Les randonneurs ont dû faire demi-tour à cause du brouillard.", en: "The hikers had to turn back because of the fog." }
    - { es: "Ils ne sont pas encore là ? Ils ont dû rater le bateau.", en: "They're not here yet? They must have missed the boat." }
    - { es: "Nous devions faire le tour du lac, mais il a plu.", en: "We were supposed to go round the lake, but it rained." }
    - { es: "Tu devrais goûter la tartiflette.", en: "You ought to try the tartiflette." }
  pitfalls:
    - "*Il a dû* is ambiguous (had to / must have): context decides."
    - "'Should have' = *aurais dû* + infinitive, not *devrais avoir*."
  related: [g.modal-verbs, g.regret-reproach, g.conditional-advice]
  drills:
    - { es: "Elle doit être déjà arrivée.", en: "She must have arrived already." }
    - { es: "Il devait m'appeler hier.", en: "He was supposed to call me yesterday." }
    - { es: "Je dois de l'argent à ma sœur.", en: "I owe my sister money." }
- id: g.regret-reproach
  level: b2
  title: "Regrets and reproaches: j'aurais dû, tu aurais pu, si seulement"
  summary: "j'aurais dû / pu / aimé + infinitive, si seulement + plus-que-parfait, je regrette de + past infinitive."
  explanation: |
    ### Regrets (about yourself)
    | structure | example |
    |---|---|
    | *J'aurais dû* + inf. | *J'**aurais dû** louer un pédalo.* (I should have) |
    | *J'aurais aimé / voulu* + inf. | *J'**aurais aimé** nager dans le lac.* |
    | *Je regrette de* + past inf. | *Je **regrette de** ne pas **être venu**.* |
    | *Si seulement* + plus-que-parfait | ***Si seulement** j'avais pris mon maillot !* |
    | *Dommage que* + subj. passé | ***Dommage qu'**on n'ait pas eu le temps.* |

    ### Reproaches (to others)
    | structure | example |
    |---|---|
    | *Tu aurais dû* + inf. | *Tu **aurais dû** me prévenir.* |
    | *Tu aurais pu* + inf. | *Vous **auriez pu** faire attention !* |
    | *Tu n'aurais pas dû* + inf. | *Tu **n'aurais pas dû** dire ça.* |
    | *Il aurait fallu* + inf. / que + subj. | ***Il aurait fallu** réserver.* |
    | *Pourquoi tu n'as pas… ?* | *Pourquoi tu ne m'as rien dit ?* |

    Softer: *Ç'aurait été bien de…* (It would have been nice to…)
  examples:
    - { es: "On aurait dû louer un pédalo, il fait si beau !", en: "We should have hired a pedalo, the weather's so lovely!" }
    - { es: "Tu aurais pu me dire que le lac était si froid.", en: "You could have told me the lake was so cold." }
    - { es: "Je regrette de ne pas avoir vu le festival du film d'animation.", en: "I'm sorry I didn't see the animation festival." }
    - { es: "Il aurait fallu partir avant les bouchons.", en: "We should have left before the traffic jams." }
  pitfalls:
    - "Not *je devrais avoir fait*: *j'aurais dû faire*."
    - "*Regretter de ne pas avoir* + participle (or *de n'avoir pas*)."
  related: [g.conditionnel-passe, g.devoir-nuances, g.si-plus-que-parfait]
  drills:
    - { es: "J'aurais dû écouter.", en: "I should have listened." }
    - { es: "Tu n'aurais pas dû partir si vite.", en: "You shouldn't have left so quickly." }
    - { es: "J'aurais aimé te voir.", en: "I'd have liked to see you." }
- id: g.conditionnel-journalistique
  level: b2
  title: "The journalistic conditional: unconfirmed information"
  summary: "The press uses the conditional for facts not yet confirmed: Le suspect aurait quitté le pays. Selon la police, il y aurait trois blessés."
  explanation: |
    | tense | example | meaning |
    |---|---|---|
    | conditionnel présent | *Le lac **serait** pollué.* | the lake is reportedly polluted |
    | conditionnel passé | *Un randonneur **aurait disparu** hier.* | a hiker has reportedly disappeared |

    It signals: "we report this, but we don't guarantee it". English uses *reportedly, allegedly, is said to, according to*.

    Often combined with sources: *selon, d'après, de source policière*: ***Selon** la mairie, les travaux **coûteraient** deux millions.*

    ### Other ways to show distance
    *Il paraît que…* (spoken), *On dit que…*, *Il semblerait que* + subj., *présumé* (*le présumé coupable*).

    It's also used for **hearsay** in conversation: *Il **paraît** qu'ils **se seraient** séparés.*
  examples:
    - { es: "Selon la presse locale, l'eau du lac serait la plus pure d'Europe.", en: "According to the local press, the lake's water is said to be the purest in Europe." }
    - { es: "Le festival aurait attiré plus de cent mille visiteurs.", en: "The festival reportedly attracted over a hundred thousand visitors." }
    - { es: "D'après les témoins, le bateau aurait heurté un ponton.", en: "According to witnesses, the boat allegedly hit a jetty." }
  pitfalls:
    - "Don't translate as 'would': *Le maire serait malade* = the mayor is said to be ill."
    - "Unlike *selon* + conditional, *il paraît que* takes the indicative."
  related: [g.conditionnel-passe, g.conditionnel-present, g.hedging]
  drills:
    - { es: "Le chanteur serait en vacances à Annecy.", en: "The singer is reportedly on holiday in Annecy." }
    - { es: "Il y aurait eu une erreur.", en: "There has reportedly been a mistake." }
    - { es: "Selon la police, le voleur aurait fui en voiture.", en: "According to the police, the thief fled by car." }
- id: g.concordance-des-temps
  level: b2
  title: "Sequence of tenses (concordance des temps)"
  summary: "When the main verb is in the past, dependent verbs shift: simultaneous → imparfait, earlier → plus-que-parfait, later → conditionnel (présent or passé)."
  explanation: |
    The tense of the dependent clause depends on its time relation to a **past** main verb:

    | relation | tense | example (main verb: *Il savait que…*) |
    |---|---|---|
    | same time | imparfait | *…le glacier **reculait**.* |
    | earlier | plus-que-parfait | *…le glacier **avait reculé**.* |
    | later | conditionnel présent | *…le glacier **reculerait** encore.* |
    | later, completed before another future | conditionnel passé | *…le glacier **aurait disparu** en 2100.* |

    With a **present** main verb, everything is "normal": *Il sait que le glacier recule / a reculé / reculera.*

    ### Subjonctif
    In modern French the present subjonctif is used even after a past main verb: *Il fallait que tu **viennes**.* (literary: *que tu vinsses*, C1). Earlier action: subjonctif passé: *Il était content que tu **sois venu**.*
  examples:
    - { es: "Le guide nous a dit que le glacier reculait chaque année.", en: "The guide told us the glacier was retreating every year." }
    - { es: "Je pensais que tu étais déjà monté au sommet.", en: "I thought you'd already been to the summit." }
    - { es: "Nous savions que la descente serait difficile.", en: "We knew the descent would be difficult." }
    - { es: "Il espérait qu'on aurait atteint le refuge avant la nuit.", en: "He hoped we'd have reached the hut before nightfall." }
  pitfalls:
    - "English 'would' after a past verb → conditional; but 'would' for past habits → imparfait."
    - "In speech, a fact still true often keeps the present: *Il m'a dit qu'il habite à Chamonix.*"
  related: [g.discours-indirect-past, g.discours-indirect-avance, g.subjonctif-imparfait]
  drills:
    - { es: "Je croyais que tu étais malade.", en: "I thought you were ill." }
    - { es: "Elle savait qu'il partirait.", en: "She knew he would leave." }
    - { es: "Ils ont dit qu'ils avaient tout vu.", en: "They said they had seen everything." }
- id: g.discours-indirect-avance
  level: b2
  title: "Reported speech: the full picture"
  summary: "Reporting questions, orders and exclamations in the past with all tense shifts, the conditionnel passé, and summarising verbs."
  explanation: |
    ### All the shifts after a past reporting verb
    | direct | reported |
    |---|---|
    | présent | imparfait |
    | passé composé | plus-que-parfait |
    | futur simple | conditionnel présent |
    | futur antérieur | conditionnel passé |
    | impératif | *de* + infinitive / *que* + subjonctif |
    | imparfait, plus-que-parfait, conditionnel, subjonctif | unchanged |

    *« Quand j'**aurai fini**, je vous **appellerai**. »* → *Il a dit que quand il **aurait fini**, il nous **appellerait**.*

    ### Questions and orders
    - *« Est-ce que vous **avez vu** le mont Blanc ? »* → *Il nous a demandé **si** nous **avions vu** le mont Blanc.*
    - *« Qu'est-ce que vous **ferez** ? »* → *Il a voulu savoir **ce que** nous **ferions**.*
    - *« Partez ! »* → *Il nous a ordonné **de partir**.* / *Il a exigé **que** nous **partions**.*

    ### Summarising instead of reporting word for word
    *Il s'est plaint du temps. Elle m'a félicité. Il a refusé. Ils ont insisté pour payer. Elle s'est excusée.*
  examples:
    - { es: "Le guide a dit qu'on partirait dès que le brouillard se serait levé.", en: "The guide said we would leave as soon as the fog had lifted." }
    - { es: "Elle m'a demandé si j'avais déjà fait de l'escalade.", en: "She asked me whether I'd ever done any climbing." }
    - { es: "Il nous a conseillé de ne pas monter sans crampons.", en: "He advised us not to go up without crampons." }
    - { es: "Ils voulaient savoir ce que nous ferions s'il neigeait.", en: "They wanted to know what we'd do if it snowed." }
  pitfalls:
    - "Futur antérieur → conditionnel passé: *quand il aurait fini*, not *quand il aura fini*."
    - "No inversion in indirect questions: *si nous avions vu*, not *si avions-nous vu*."
  related: [g.concordance-des-temps, g.discours-indirect-past, g.time-shift-expressions, g.reporting-verbs]
  drills:
    - { es: "Il a dit qu'il viendrait quand il aurait fini.", en: "He said he'd come when he had finished." }
    - { es: "Elle m'a demandé ce que j'avais fait.", en: "She asked me what I had done." }
    - { es: "Le guide nous a dit d'attendre.", en: "The guide told us to wait." }
- id: g.time-shift-expressions
  level: b2
  title: "Shifting time words: la veille, le lendemain, ce jour-là"
  summary: "In reported speech and narratives, aujourd'hui → ce jour-là, hier → la veille, demain → le lendemain, ici → là."
  explanation: |
    | relative to now | relative to a past moment |
    |---|---|
    | *aujourd'hui* | *ce jour-là* |
    | *hier* | *la veille* |
    | *avant-hier* | *l'avant-veille* |
    | *demain* | *le lendemain* |
    | *après-demain* | *le surlendemain* |
    | *ce matin, ce soir* | *ce matin-là, ce soir-là* |
    | *la semaine dernière* | *la semaine précédente / d'avant* |
    | *la semaine prochaine* | *la semaine suivante / d'après* |
    | *il y a deux jours* | *deux jours plus tôt / auparavant* |
    | *dans deux jours* | *deux jours plus tard / après* |
    | *maintenant* | *à ce moment-là, alors* |
    | *ici* | *là* |

    *« Je pars demain »*, a-t-il dit lundi. → *Lundi, il a dit qu'il partait **le lendemain**.*

    These are also the normal words for narration in the past: *Le lendemain matin, nous sommes partis à l'aube.*
  examples:
    - { es: "Il m'avait dit qu'il partirait le lendemain pour le mont Blanc.", en: "He'd told me he would leave for Mont Blanc the next day." }
    - { es: "La veille de l'ascension, nous avons dormi au refuge.", en: "The day before the climb, we slept at the hut." }
    - { es: "Ce jour-là, il faisait un temps magnifique.", en: "That day the weather was magnificent." }
  pitfalls:
    - "*Le lendemain* (the next day) vs *demain* (tomorrow): use *demain* only relative to now."
    - "*La veille de Noël* = Christmas Eve."
  related: [g.discours-indirect-avance, g.narrative-connectors]
  drills:
    - { es: "Le lendemain, il a neigé.", en: "The next day it snowed." }
    - { es: "Elle a dit qu'elle était arrivée la veille.", en: "She said she had arrived the day before." }
    - { es: "Deux jours plus tard, ils sont rentrés.", en: "Two days later they came home." }
- id: g.relative-lequel
  level: b2
  title: "Relative pronouns with lequel: sur laquelle, avec lequel"
  summary: "After a preposition, for things (and sometimes people): le projet sur lequel je travaille, la raison pour laquelle."
  explanation: |
    | | singular | plural |
    |---|---|---|
    | masculine | **lequel** | **lesquels** |
    | feminine | **laquelle** | **lesquelles** |

    *Lequel* agrees with the noun it refers to and follows a **preposition**:
    - *le laboratoire **dans lequel** elle travaille*
    - *la colline **sur laquelle** se trouve la Bastille*
    - *les outils **avec lesquels** ils construisent*
    - *la raison **pour laquelle** je suis venu* (the reason why)

    ### People
    For people, *qui* is preferred: *le chercheur **avec qui** je travaille*. *Lequel* for people is possible and avoids ambiguity: *la sœur de Paul, **laquelle** est médecin* (formal).

    ### Questions
    *Lequel* is also "which one?": *J'ai deux livres. **Lequel** veux-tu ?*
  examples:
    - { es: "La Bastille est la colline sur laquelle on monte en téléphérique.", en: "The Bastille is the hill you go up by cable car." }
    - { es: "C'est le projet pour lequel la ville a reçu un prix.", en: "It's the project for which the city received a prize." }
    - { es: "Voici la raison pour laquelle je suis venu à Grenoble.", en: "Here's the reason why I came to Grenoble." }
    - { es: "Les montagnes parmi lesquelles la ville est construite sont superbes.", en: "The mountains among which the city is built are superb." }
  pitfalls:
    - "After *parmi* and *entre*, always *lesquels / lesquelles*, never *qui*: *parmi lesquels*."
    - "The ending agrees with the noun: *la table sur laquelle*, not *sur lequel*."
  related: [g.auquel-duquel, g.relative-preposition, g.dont-vs-duquel, g.quel]
  drills:
    - { es: "C'est le stylo avec lequel j'ai signé.", en: "It's the pen I signed with." }
    - { es: "La salle dans laquelle nous travaillons est petite.", en: "The room we work in is small." }
    - { es: "Je ne connais pas la raison pour laquelle il est parti.", en: "I don't know why he left." }
- id: g.auquel-duquel
  level: b2
  title: "Auquel, à laquelle, duquel: lequel with à and de"
  summary: "à + lequel → auquel, auxquels, auxquelles (but à laquelle); de + lequel → duquel, desquels, desquelles (but de laquelle)."
  explanation: |
    | | à + lequel | de + lequel |
    |---|---|---|
    | m. sing. | **auquel** | **duquel** |
    | f. sing. | **à laquelle** | **de laquelle** |
    | m. pl. | **auxquels** | **desquels** |
    | f. pl. | **auxquelles** | **desquelles** |

    ### With à: verbs and expressions with à
    *penser à, participer à, s'intéresser à, faire face à*:
    - *le colloque **auquel** j'ai participé*
    - *les problèmes **auxquels** nous faisons face*
    - *la conférence **à laquelle** j'assiste*

    ### With de: prepositional phrases ending in de
    *près de, à côté de, au centre de, au bord de, à cause de, au sujet de, lors de*:
    - *le lac **au bord duquel** nous habitons*
    - *la ville **au centre de laquelle** se trouve la gare*

    For people, *à qui* is preferred: *la collègue **à qui** j'ai parlé*.
  examples:
    - { es: "Le laboratoire auquel elle collabore est mondialement connu.", en: "The laboratory she works with is world famous." }
    - { es: "Ce sont des questions auxquelles personne n'a de réponse.", en: "These are questions nobody has an answer to." }
    - { es: "L'Isère, au bord de laquelle la ville est construite, descend des Alpes.", en: "The Isère, on whose banks the city is built, comes down from the Alps." }
    - { es: "Le campus près duquel j'habite est immense.", en: "The campus near which I live is huge." }
  pitfalls:
    - "Never *à lequel* or *de lequel*: contract to *auquel, duquel*."
    - "*À laquelle* and *de laquelle* don't contract."
  related: [g.relative-lequel, g.dont-vs-duquel, g.verbs-prepositions]
  drills:
    - { es: "C'est un sujet auquel je pense souvent.", en: "It's a subject I often think about." }
    - { es: "La montagne au pied de laquelle on campe est magnifique.", en: "The mountain at the foot of which we're camping is magnificent." }
    - { es: "Les projets auxquels il participe sont innovants.", en: "The projects he takes part in are innovative." }
- id: g.dont-vs-duquel
  level: b2
  title: "Dont or duquel?"
  summary: "dont replaces a simple de (parler de, le nom de); duquel is needed after a compound preposition (au milieu duquel, près de laquelle)."
  explanation: |
    | use **dont** | use **duquel / de laquelle / desquels** |
    |---|---|
    | verb + *de*: *le livre **dont** je parle* | prepositional phrase + *de*: *le parc **au milieu duquel**…* |
    | adjective + *de*: *le prix **dont** il est fier* | *la ville **près de laquelle**…* |
    | noun + *de* (whose) as subject or object: *l'homme **dont** le fils est guide* | noun + *de* after a preposition: *l'homme **à la fille duquel** j'ai parlé* (formal) |

    ### The test
    If *de* stands alone in the original sentence, use *dont*. If *de* is the end of a longer preposition (*à côté de, au bord de, à cause de, grâce à… de*), use *duquel*.

    - *Je parle **de** ce projet* → *le projet **dont** je parle*.
    - *Nous habitons **près de** ce lac* → *le lac **près duquel** nous habitons*.

    In speech, people avoid *duquel* by rephrasing: *le lac, on habite juste à côté*.
  examples:
    - { es: "Le projet dont tout le monde parle sera présenté demain.", en: "The project everyone's talking about will be presented tomorrow." }
    - { es: "Le téléphérique, grâce auquel on monte en quatre minutes, date de 1934.", en: "The cable car, thanks to which you go up in four minutes, dates from 1934." }
    - { es: "Le fort au sommet duquel nous sommes montés domine la ville.", en: "The fort we climbed to the top of overlooks the city." }
    - { es: "C'est une chercheuse dont les travaux sont célèbres.", en: "She's a researcher whose work is famous." }
  pitfalls:
    - "Not *le lac près dont*: *près duquel*."
    - "*Dont* cannot follow a preposition: *la femme avec le fils de qui* … becomes *la femme avec le fils de laquelle* (or rephrase)."
  related: [g.relative-dont, g.auquel-duquel, g.relative-lequel]
  drills:
    - { es: "C'est le film dont je t'ai parlé.", en: "It's the film I told you about." }
    - { es: "L'église en face de laquelle j'habite est très ancienne.", en: "The church opposite which I live is very old." }
    - { es: "Voici le collègue dont le bureau est à côté du mien.", en: "Here's the colleague whose office is next to mine." }
- id: g.participe-present
  level: b2
  title: "The present participle: ayant, étant, connaissant"
  summary: "Stem of nous + -ant, invariable: a written alternative to qui + verb or to a cause clause. Les touristes venant de Paris…"
  explanation: |
    ### Form
    *nous* present minus *-ons* + **-ant**: *connaiss**ant**, fais**ant**, buv**ant***. Irregular: ***étant*** (être), ***ayant*** (avoir), ***sachant*** (savoir).
    It is **invariable**.

    ### Uses (mainly written)
    | use | example | equivalent |
    |---|---|---|
    | replaces *qui* + verb | *les vignerons **produisant** du pinot noir* | *qui produisent* |
    | cause | ***Étant** fermé le lundi, le musée…* | *comme il est fermé* |
    | sequence | ***Ouvrant** la porte, il découvrit la cave.* | *il ouvrit la porte et…* |

    ### Compound form: completed action
    ***Ayant** visité Dijon, nous sommes partis pour Beaune.* — Having visited Dijon…
    ***Étant** arrivée tard, elle n'a rien vu.* (agreement of the participle with *être*)

    ### Participe présent vs gérondif
    - Gérondif (*en* + -ant) refers to the **subject**: *J'ai vu Paul **en sortant*** (I was leaving).
    - Participle refers to the **nearest noun**: *J'ai vu Paul **sortant** du musée* (Paul was leaving).
  examples:
    - { es: "Les ducs, voulant rivaliser avec Paris, firent construire un palais magnifique.", en: "The dukes, wanting to rival Paris, had a magnificent palace built." }
    - { es: "Ayant perdu notre plan, nous avons suivi la chouette.", en: "Having lost our map, we followed the owl." }
    - { es: "On recherche un guide parlant anglais et allemand.", en: "Wanted: a guide who speaks English and German." }
    - { es: "Étant donné l'heure, la boutique est fermée.", en: "Given the time, the shop is closed." }
  pitfalls:
    - "The participle doesn't agree: *des élèves parlant français*, not *parlants*."
    - "Very common in writing, rare in conversation: say *qui parle* when speaking."
  related: [g.gerondif, g.adjectif-verbal, g.participial-clauses]
  drills:
    - { es: "Ne sachant pas quoi dire, il s'est tu.", en: "Not knowing what to say, he fell silent." }
    - { es: "Les clients désirant un reçu doivent le demander.", en: "Customers wanting a receipt must ask for it." }
    - { es: "Ayant fini, elle est sortie.", en: "Having finished, she went out." }
- id: g.adjectif-verbal
  level: b2
  title: "Participe présent or adjectif verbal? fatiguant / fatigant"
  summary: "The present participle (action, invariable) vs the verbal adjective (quality, agrees). Some differ in spelling: fatiguant / fatigant, convainquant / convaincant."
  explanation: |
    | participe présent | adjectif verbal |
    |---|---|
    | expresses an **action** | expresses a **quality** |
    | invariable | agrees like an adjective |
    | can take an object or adverb after it | can be modified by *très* |
    | *des enfants **obéissant** à leurs parents* | *des enfants **obéissants*** |
    | *une histoire **intéressant** les jeunes* | *une histoire **intéressante*** |

    ### Spelling differences
    | participle | adjective |
    |---|---|
    | *fatiguant* | ***fatigant*** |
    | *convainquant* | ***convaincant*** |
    | *provoquant* | ***provocant*** |
    | *communiquant* | ***communicant*** |
    | *différant* | ***différent*** |
    | *précédant* | ***précédent*** |
    | *négligeant* | ***négligent*** |
    | *excellant* | ***excellent*** |

    *Le jour **précédant** la fête* (the day before) vs *le jour **précédent*** (the previous day).
  examples:
    - { es: "La montée vers les vignes est fatigante.", en: "The climb up to the vineyards is tiring." }
    - { es: "En fatiguant les touristes, la chaleur vide les rues.", en: "By tiring out the tourists, the heat empties the streets." }
    - { es: "Ses arguments sont très convaincants.", en: "Her arguments are very convincing." }
    - { es: "Le jour précédant la vente, les vins sont dégustés.", en: "The day before the auction, the wines are tasted." }
  pitfalls:
    - "*Un travail fatigant* (adjective), not *fatiguant*."
    - "The adjective agrees: *des femmes charmantes*; the participle never does."
  related: [g.participe-present, g.gerondif]
  drills:
    - { es: "C'est un film émouvant.", en: "It's a moving film." }
    - { es: "Ce sont des résultats surprenants.", en: "These are surprising results." }
    - { es: "Les années précédentes, il pleuvait.", en: "In previous years, it rained." }
- id: g.participial-clauses
  level: b2
  title: "Participial clauses: une fois le travail fini, la vendange terminée"
  summary: "A noun + past participle (absolute construction) gives a concise written way to say 'once / after / when': La vendange terminée, on fait la fête."
  explanation: |
    ### Absolute participle
    | example | meaning |
    |---|---|
    | ***La vendange terminée**, les vignerons font la fête.* | Once the harvest is over… |
    | ***Le repas fini**, nous sommes allés nous promener.* | After the meal… |
    | ***Une fois** les billets **achetés**, entrez.* | Once the tickets are bought… |
    | ***Sitôt** la nuit **tombée**, la ville s'illumine.* | As soon as night has fallen… |

    The participle agrees with its own noun.

    ### Past participle alone (passive meaning)
    ***Construit** au XVe siècle, le palais est aujourd'hui un musée.* — Built in the 15th century…
    ***Fondée** en 1443, la ville…*

    ### Rule
    In "*Construit au XVe siècle, le palais…*" the participle must refer to the **subject** of the main clause. *Construit au XVe siècle, j'ai visité le palais* means **I** was built in the 15th century.
  examples:
    - { es: "Le palais terminé, Dijon devint une capitale prestigieuse.", en: "With the palace finished, Dijon became a prestigious capital." }
    - { es: "Fondée au Moyen Âge, la ville a gardé ses maisons à colombages.", en: "Founded in the Middle Ages, the town has kept its half-timbered houses." }
    - { es: "Une fois la visite finie, nous avons goûté le pain d'épices.", en: "Once the visit was over, we tasted the gingerbread." }
  pitfalls:
    - "Dangling participles are errors: the participle must match the main subject."
    - "Agreement: *la vendange terminée*, *les vins goûtés*."
  related: [g.participe-present, g.nominalisation, g.passive-voice]
  drills:
    - { es: "Le dîner terminé, ils sont partis.", en: "Dinner over, they left." }
    - { es: "Construite en 1900, la gare est classée.", en: "Built in 1900, the station is listed." }
    - { es: "Une fois la porte fermée, plus personne n'entre.", en: "Once the door is shut, no one else gets in." }
- id: g.mise-en-relief
  level: b2
  title: "Emphasis with c'est … qui / c'est … que"
  summary: "Highlight any element: C'est à Beaune que se tient la vente des vins. C'est lui qui a gagné."
  explanation: |
    | highlighted element | structure | example |
    |---|---|---|
    | subject | ***c'est** … **qui*** | ***C'est** le vigneron **qui** a choisi.* |
    | object | ***c'est** … **que*** | ***C'est** ce vin **que** je préfère.* |
    | place | ***c'est** … **que*** | ***C'est** à Beaune **que** se tient la vente.* |
    | time | ***c'est** … **que*** | ***C'est** en novembre **qu'**elle a lieu.* |
    | reason | ***c'est** … **que*** | ***C'est** pour ça **que** je suis venu.* |

    ### Agreement
    - With *qui*, the verb agrees with the highlighted subject: *C'est moi qui **suis** venu. C'est nous qui **avons** payé.*
    - Plural: *Ce sont les Hospices qui organisent la vente* (formal) / *C'est les Hospices qui…* (speech).

    ### Correcting
    *Ce n'est pas Paul qui a gagné, c'est Marie.* — It wasn't Paul who won, it was Marie.

    In questions: *Qui est-ce qui… ? C'est où que… ?* (spoken), *Est-ce à Beaune que… ?* (formal).
  examples:
    - { es: "C'est à Beaune que se tient la célèbre vente des vins.", en: "It's in Beaune that the famous wine auction takes place." }
    - { es: "C'est le chancelier Nicolas Rolin qui a fondé les Hospices en 1443.", en: "It was Chancellor Nicolas Rolin who founded the Hospices in 1443." }
    - { es: "Ce n'est pas le rouge que je veux, c'est le blanc.", en: "It's not the red I want, it's the white." }
    - { es: "C'est vous qui avez acheté ce tonneau ?", en: "Was it you who bought this barrel?" }
  pitfalls:
    - "*C'est moi qui ai*, not *c'est moi qui a*."
    - "Use *que* for everything except the subject: *C'est demain que je pars*, not *C'est demain où je pars*."
  related: [g.dislocation, g.ce-qui-c-est, g.relative-qui-que]
  drills:
    - { es: "C'est ici qu'on dort.", en: "This is where we sleep." }
    - { es: "C'est toi qui as raison.", en: "You're the one who's right." }
    - { es: "C'est pour cette raison qu'il est parti.", en: "That's why he left." }
- id: g.dislocation
  level: b2
  title: "Dislocation: Moi, le vin, je l'adore"
  summary: "Spoken French moves a noun to the front or end and repeats it with a pronoun: Le bourgogne, je l'adore. Je l'adore, le bourgogne."
  explanation: |
    Spoken French loves to announce the **topic** first, then comment on it, with a pronoun in the sentence:

    | type | example |
    |---|---|
    | left (topic first) | ***Le vin**, je **l'**adore.* |
    | right (topic after) | *Je **l'**adore, **le vin**.* |
    | with a stressed pronoun | ***Moi**, je préfère le blanc.* |
    | several | ***Moi**, **le vin rouge**, je **le** trouve trop fort.* |
    | indirect / y / en | ***Les Hospices**, tu **y** es allé ? **Du vin**, j'**en** ai acheté.* |
    | with ça | ***Le fromage**, j'aime **ça**.* (general) |
    | with c'est | ***Beaune**, **c'est** magnifique.* |

    It's natural, not sloppy, in conversation. In formal writing, prefer *c'est … que* or a plain sentence.

    *J'aime ça* vs *je l'aime*: *ça* for a category (*le vin en général*), *le / la* for a specific thing or person.
  examples:
    - { es: "Le bourgogne, je le trouve fabuleux.", en: "Burgundy wine, I think it's fabulous." }
    - { es: "Moi, les dégustations, j'y vais tous les ans.", en: "Me, I go to the tastings every year." }
    - { es: "Ils sont superbes, ces toits !", en: "They're superb, these roofs!" }
    - { es: "Le vin rouge, j'aime bien ça.", en: "Red wine, I quite like it." }
  pitfalls:
    - "Don't forget the pronoun: *Le vin, je l'adore*, not *Le vin, j'adore*. (*J'adore* alone is heard, but less standard.)"
    - "Avoid it in formal essays."
  related: [g.mise-en-relief, g.stressed-pronouns, g.register-levels]
  drills:
    - { es: "Ton frère, je le connais.", en: "Your brother, I know him." }
    - { es: "Elle est belle, cette ville.", en: "This town is beautiful." }
    - { es: "Le chocolat, j'en mange trop.", en: "Chocolate, I eat too much of it." }
- id: g.ce-qui-c-est
  level: b2
  title: "Ce qui me plaît, c'est… — the pseudo-cleft"
  summary: "Announce, then reveal: Ce qui m'étonne, c'est le prix. Ce que j'aime, c'est le calme. Ce dont j'ai besoin, c'est d'un café."
  explanation: |
    | structure | example |
    |---|---|
    | ***ce qui*** + verb, *c'est* | ***Ce qui** me plaît à Beaune, **c'est** l'ambiance.* |
    | ***ce que*** + subject + verb, *c'est* | ***Ce que** je préfère, **c'est** le chardonnay.* |
    | ***ce dont*** + verb with *de*, *c'est* (*de*) | ***Ce dont** j'ai besoin, **c'est d'**un bon repas.* |
    | ***ce à quoi*** + verb with *à*, *c'est* (*à*) | ***Ce à quoi** je pense, **c'est à** la vente.* |
    | + infinitive | ***Ce que** j'aime, **c'est** goûter les vins.* (or *c'est de goûter*) |
    | + clause | ***Ce qui** est sûr, **c'est que** les prix montent.* |

    It builds suspense and is very common in presentations and debates: *Ce qu'il faut retenir, c'est que… Le problème, c'est que…*

    ### Shorter versions with a noun
    *Le problème, c'est que… L'important, c'est de… Le mieux, c'est de… Ce qui compte, c'est…*
  examples:
    - { es: "Ce qui m'a impressionné, ce sont les toits colorés.", en: "What impressed me were the coloured roofs." }
    - { es: "Ce que je voudrais, c'est visiter une cave.", en: "What I'd like is to visit a wine cellar." }
    - { es: "Le problème, c'est que tout est réservé.", en: "The problem is that everything is booked." }
    - { es: "Ce dont il rêve, c'est d'avoir son propre domaine.", en: "What he dreams of is having his own estate." }
  pitfalls:
    - "Keep the preposition after *c'est* with *ce dont / ce à quoi*: *c'est d'un café*."
    - "Plural noun after *c'est*: *ce sont* in careful style."
  related: [g.mise-en-relief, g.ce-qui-ce-que]
  drills:
    - { es: "Ce qui compte, c'est la santé.", en: "What matters is health." }
    - { es: "Ce que je ne comprends pas, c'est pourquoi il est parti.", en: "What I don't understand is why he left." }
    - { es: "L'important, c'est de participer.", en: "The important thing is to take part." }
- id: g.concession
  level: b2
  title: "Concession: bien que, quoique, même si, malgré, avoir beau"
  summary: "although / even though / despite: bien que + subj., même si + ind., malgré + noun, avoir beau + inf., pourtant, tout de même."
  explanation: |
    | structure | mood / form | example |
    |---|---|---|
    | ***bien que, quoique*** | + subjonctif | ***Bien que** l'abbaye **soit** en ruines, elle impressionne.* |
    | ***même si*** | + indicative | ***Même si** l'abbaye **est** en ruines, elle impressionne.* |
    | ***malgré*** | + noun | ***Malgré** les destructions, Cluny reste fascinante.* |
    | ***en dépit de*** (formal) | + noun | ***En dépit des** guerres…* |
    | ***avoir beau*** | + infinitive | ***On a beau** connaître l'histoire, on est surpris.* (however much…) |
    | ***tout*** + adj. + ***que*** | + indicative / subj. | ***Tout** puissant **qu'**il était, l'ordre a disparu.* |
    | ***quand bien même*** | + conditional | ***Quand bien même** il pleuvrait, j'irais.* (even if) |
    | ***pourtant, cependant, néanmoins*** | adverbs | *Elle est détruite ; **pourtant** on y vient.* |
    | ***tout de même, quand même*** | adverbs | *C'est loin, mais on y va **quand même**.* |

    *Avoir beau* is very idiomatic: *J'ai beau chercher, je ne trouve pas.* (No matter how hard I look…)
  examples:
    - { es: "Bien que l'abbaye ait été en grande partie détruite, elle attire des milliers de visiteurs.", en: "Although the abbey was largely destroyed, it attracts thousands of visitors." }
    - { es: "Malgré sa taille modeste, Cluny a dominé l'Europe chrétienne.", en: "Despite its modest size, Cluny dominated Christian Europe." }
    - { es: "J'ai beau lire des livres d'histoire, j'oublie toujours les dates.", en: "However many history books I read, I always forget the dates." }
    - { es: "C'est loin, mais ça vaut quand même le détour.", en: "It's far, but it's still worth the detour." }
  pitfalls:
    - "*Bien que* + subjonctif, *même si* + indicative: never the reverse."
    - "*Malgré que* is common in speech but frowned upon; use *bien que*."
    - "*Quoique* (although) vs *quoi que* (whatever, C1)."
  related: [g.connectors-opposition, g.subjonctif-conjonctions, g.qui-que-quoi-que]
  drills:
    - { es: "Bien qu'il soit tard, je reste.", en: "Although it's late, I'm staying." }
    - { es: "Elle a beau essayer, elle n'y arrive pas.", en: "However hard she tries, she can't do it." }
    - { es: "Malgré la fatigue, il a continué.", en: "Despite his tiredness, he carried on." }
- id: g.purpose-clauses
  level: b2
  title: "Purpose: pour que, afin que, de peur que, de sorte que"
  summary: "pour / afin de + infinitive (same subject); pour que / afin que / de sorte que + subjonctif (different subject); de peur que / de crainte que (negative purpose)."
  explanation: |
    | meaning | same subject (+ infinitive) | different subject (+ subjonctif) |
    |---|---|---|
    | so that, in order to | *pour, afin de* | *pour que, afin que* |
    | so as not to | *pour ne pas, afin de ne pas* | *pour que … ne … pas* |
    | for fear of / lest | *de peur de, de crainte de* | *de peur que (ne), de crainte que (ne)* |
    | so that (purpose) | — | *de sorte que, de façon que, de manière que* |

    - *Les moines copiaient les livres **afin de** les **conserver**.*
    - *Ils ont restauré l'abbaye **pour que** les visiteurs **puissent** imaginer sa grandeur.*
    - *Parlez bas **de peur qu'**on ne vous **entende**.*

    ### De sorte que: purpose or result?
    - + subjonctif = purpose: *Parle fort **de sorte qu'**on t'**entende**.*
    - + indicative = result: *Il a parlé fort, **de sorte qu'**on l'**a entendu**.*

    Imperative + *que* + subjonctif in speech: *Viens ici que je te **voie** !*
  examples:
    - { es: "Les moines se levaient la nuit pour prier.", en: "The monks got up at night to pray." }
    - { es: "On a construit une maquette afin que le public comprenne l'ancienne abbaye.", en: "A model was built so that the public could understand the old abbey." }
    - { es: "Ils ont caché les manuscrits de peur qu'on ne les détruise.", en: "They hid the manuscripts for fear they'd be destroyed." }
    - { es: "Mettez-vous ici, de sorte que tout le monde voie.", en: "Stand here so that everyone can see." }
  pitfalls:
    - "Same subject → infinitive: *je travaille pour réussir*, not *pour que je réussisse*."
    - "*De sorte que* changes meaning with the mood."
  related: [g.subjonctif-conjonctions, g.pour-sans-infinitive, g.cause-advanced]
  drills:
    - { es: "Je t'écris pour que tu saches la vérité.", en: "I'm writing so that you know the truth." }
    - { es: "Il est parti tôt afin d'éviter les bouchons.", en: "He left early to avoid the traffic." }
    - { es: "Elle parle doucement de peur de réveiller le bébé.", en: "She speaks softly for fear of waking the baby." }
- id: g.cause-advanced
  level: b2
  title: "Advanced cause: étant donné que, vu que, du fait de, faute de, sous prétexte que"
  summary: "Nuanced ways to give reasons: étant donné que / vu que (given that), du fait de, en raison de (formal), faute de (for lack of), sous prétexte que (on the pretext that)."
  explanation: |
    | connector | construction | nuance |
    |---|---|---|
    | *étant donné que, vu que* | + clause | given that (known fact) |
    | *étant donné, vu* | + noun | *vu le prix…* |
    | *du fait que / du fait de* | + clause / noun | owing to (formal) |
    | *en raison de* | + noun | due to (official) |
    | *faute de* | + noun / infinitive | for lack of: *faute de temps* |
    | *à force de* | + noun / infinitive | through repeated: *à force de travail* |
    | *sous prétexte que / de* | + clause / inf. | on the pretext (doubtful reason) |
    | *d'autant (plus) que* | + clause | all the more so because |
    | *non que* + subj. | + clause | not that: *non qu'il soit méchant, mais…* |
    | *ce n'est pas que* + subj. | + clause | not that (spoken) |

    ### Consequence (written)
    *par conséquent, en conséquence, ainsi, de ce fait, d'où* + noun (*d'où son succès*), *si bien que, au point que, de sorte que*.
  examples:
    - { es: "Étant donné que l'abbaye a été vendue en 1798, il en reste peu.", en: "Given that the abbey was sold in 1798, little of it remains." }
    - { es: "Le site est fermé en raison des travaux.", en: "The site is closed due to building work." }
    - { es: "Faute de moyens, la restauration a pris des années.", en: "For lack of funds, the restoration took years." }
    - { es: "Il n'est pas venu sous prétexte qu'il était malade.", en: "He didn't come, supposedly because he was ill." }
  pitfalls:
    - "*En raison de* + noun only: *en raison de la pluie*, not *en raison qu'il pleut*."
    - "*Sous prétexte que* implies you don't believe the reason."
  related: [g.connectors-cause-consequence, g.purpose-clauses, g.connectors-advanced]
  drills:
    - { es: "Vu le temps, on reste ici.", en: "Given the weather, we're staying here." }
    - { es: "Faute de temps, je n'ai pas pu finir.", en: "For lack of time, I couldn't finish." }
    - { es: "C'est d'autant plus triste qu'il était jeune.", en: "It's all the sadder because he was young." }
- id: g.register-levels
  level: b2
  title: "Registers: familier, courant, soutenu"
  summary: "French changes vocabulary, grammar and pronunciation by register: bouffer / manger / se restaurer; t'as vu ? / tu as vu ? / avez-vous vu ?"
  explanation: |
    | | familier (friends) | courant (standard) | soutenu (formal, written) |
    |---|---|---|---|
    | eat | *bouffer* | *manger* | *se restaurer* |
    | car | *une bagnole* | *une voiture* | *un véhicule* |
    | work | *le boulot* | *le travail* | *l'emploi, la profession* |
    | money | *le fric, la thune* | *l'argent* | *les fonds* |
    | be afraid | *avoir la trouille* | *avoir peur* | *craindre* |
    | question | *Tu viens quand ?* | *Quand est-ce que tu viens ?* | *Quand viendrez-vous ?* |
    | negative | *J'sais pas.* | *Je ne sais pas.* | *Je ne saurais dire.* |
    | we | *on* | *on / nous* | *nous* |

    ### Grammar markers of register
    - Familiar: no *ne*, *ça* for *cela*, *y'a*, dislocation, *t'es, j'suis*, *quoi* at the end.
    - Formal: inversion, passé simple (writing), *nous*, subjonctif imparfait (literary), *ne* explétif, *cela*.

    Choosing the wrong register is a bigger social mistake than many grammar errors: *bouffer* at a job interview or *se restaurer* with friends both sound odd.
  examples:
    - { es: "T'as vu le marché de Noël ? C'est trop beau !", en: "Have you seen the Christmas market? It's so pretty! (familiar)" }
    - { es: "Avez-vous eu l'occasion de visiter la cathédrale ?", en: "Have you had the opportunity to visit the cathedral? (formal)" }
    - { es: "On va bouffer une choucroute ?", en: "Shall we grab a choucroute? (familiar)" }
    - { es: "Les députés se réunissent au Parlement européen.", en: "The MEPs meet at the European Parliament." }
  pitfalls:
    - "Don't mix registers in one text: *Monsieur le Directeur, je suis vachement content…*"
    - "Familiar words aren't vulgar, but some are (*con*, *merde*): learn which is which before using them."
  related: [g.spoken-negation, g.formal-inversion, g.dislocation, g.stylistic-registers]
  drills:
    - { es: "J'ai plus de boulot.", en: "I've got no work any more. (familiar)" }
    - { es: "Je vous prie de bien vouloir patienter.", en: "Please be so kind as to wait. (formal)" }
    - { es: "Ça coûte combien, la bagnole ?", en: "How much is the car? (familiar)" }
- id: g.spoken-negation
  level: b2
  title: "Spoken French: dropping ne, y'a, chais pas"
  summary: "In conversation ne almost disappears (je sais pas, c'est pas grave), il y a becomes y'a, and sounds merge (chais pas, t'es, j'suis)."
  explanation: |
    ### Dropping ne
    | written | spoken |
    |---|---|
    | *Je ne sais pas.* | *Je sais pas.* / *Chais pas.* |
    | *Ce n'est pas grave.* | *C'est pas grave.* |
    | *Il n'y a personne.* | *Y'a personne.* |
    | *Je n'ai rien vu.* | *J'ai rien vu.* |
    | *Ne t'inquiète pas.* | *T'inquiète (pas).* |

    The **pas** carries the negative. Keep *ne* in writing, in formal speech, and after a subject noun when you want to sound careful.

    ### Other spoken reductions
    - *il y a → y'a*, *il faut → faut*: *Faut y aller.*
    - *tu as → t'as, tu es → t'es*: *T'as faim ?*
    - *je suis → j'suis* [ʃɥi], *je sais → chais*
    - *il / ils → i'* before a consonant: *I' vient.*
    - *celui-là → çui-là*, *parce que → pasque*
    - Questions by intonation: *Tu viens ?*; *quoi* at the end: *Tu fais quoi ?*

    Understanding these is essential for films and real conversation; reproduce them only in relaxed settings.
  examples:
    - { es: "J'sais pas, y'a trop de monde au marché.", en: "Dunno, there are too many people at the market." }
    - { es: "C'est pas grave, t'inquiète.", en: "It's no big deal, don't worry." }
    - { es: "Faut qu'on y aille.", en: "We've got to go." }
  pitfalls:
    - "Never drop *ne* in an exam essay or formal letter."
    - "Don't drop *pas* instead of *ne*: *Je ne sais* alone is literary (C1)."
  related: [g.negation-ne-pas, g.register-levels, g.ne-litteraire]
  drills:
    - { es: "J'ai pas le temps.", en: "I haven't got time." }
    - { es: "Y'a pas de problème.", en: "No problem." }
    - { es: "T'es où ?", en: "Where are you?" }
- id: g.formal-inversion
  level: b2
  title: "Formal inversion: questions, peut-être, à peine, ainsi"
  summary: "Subject-verb inversion in formal questions (Le Parlement a-t-il voté ?), after peut-être, sans doute, à peine, ainsi, aussi at the start, and after direct speech."
  explanation: |
    ### Complex inversion in questions (noun subject)
    The noun stays first; a pronoun is added after the verb:
    - ***Le Parlement** a-**t-il** voté la loi ?*
    - *Pourquoi **les députés** sont-**ils** partis ?*
    - Simple inversion with *que, quand, où, comment* and a short sentence: *Où se trouve **le Parlement** ?*

    ### After certain adverbs at the start of a sentence
    | adverb | example |
    |---|---|
    | *peut-être* | ***Peut-être viendra-t-il.*** (= *Peut-être qu'il viendra.*) |
    | *sans doute* | ***Sans doute a-t-il raison.*** |
    | *à peine* | ***À peine était-il arrivé** qu'il repartait.* |
    | *ainsi* | ***Ainsi naquit** l'Europe.* |
    | *aussi* (= therefore) | ***Aussi faut-il** agir vite.* |
    | *encore* (= even so) | ***Encore faut-il** le prouver.* |

    ### After direct speech
    *« Bienvenue », **dit le président**. « Merci », **répondit-elle**.*

    ### Relative clauses (stylistic)
    *La ville où **siège le Parlement**…* (verb before a long noun subject)
  examples:
    - { es: "Le Parlement européen siège-t-il toujours à Strasbourg ?", en: "Does the European Parliament still sit in Strasbourg?" }
    - { es: "Peut-être la cathédrale sera-t-elle restaurée l'an prochain.", en: "Perhaps the cathedral will be restored next year." }
    - { es: "À peine les portes étaient-elles ouvertes que la foule entrait.", en: "No sooner were the doors open than the crowd poured in." }
    - { es: "« C'est un honneur », déclara la présidente.", en: "'It's an honour,' declared the president." }
  pitfalls:
    - "*Peut-être que* + normal order; *peut-être* at the start + inversion: never mix."
    - "Don't forget *-t-* between vowels: *a-t-il, va-t-elle*."
    - "*Aussi* at the start means 'therefore' and triggers inversion; 'also' is *aussi* after the verb."
  related: [g.inversion-questions, g.register-levels, g.literary-inversion]
  drills:
    - { es: "Votre collègue est-il arrivé ?", en: "Has your colleague arrived?" }
    - { es: "Sans doute avez-vous raison.", en: "No doubt you're right." }
    - { es: "Peut-être pleuvra-t-il demain.", en: "Perhaps it will rain tomorrow." }
- id: g.passe-simple-recognition
  level: b2
  title: "Recognising the passé simple: il fut, elle alla, ils vinrent"
  summary: "The literary past of tales, novels and history books. Recognise the endings: -a / -èrent (-er), -it / -irent, -ut / -urent, -int / -inrent."
  explanation: |
    The **passé simple** has the same meaning as the passé composé (a completed past action) but is used in **written narrative**: fairy tales, novels, history, biographies. You need to **recognise** it now; producing it comes at C1.

    | | -er (parler) | -ir/-re (finir, prendre) | -u type (être, avoir, pouvoir) | venir |
    |---|---|---|---|---|
    | il / elle | parl**a** | fin**it**, pr**it** | **fut**, **eut**, **put** | **vint** |
    | ils / elles | parl**èrent** | fin**irent**, pr**irent** | **furent**, **eurent**, **purent** | **vinrent** |

    The 3rd person forms are by far the most frequent. Common irregulars: *fit* (faire), *dit* (dire), *vit* (voir), *mit* (mettre), *naquit* (naître), *mourut* (mourir), *sut* (savoir), *dut* (devoir), *voulut* (vouloir), *vécut* (vivre).

    ### Passé simple + imparfait
    In literature the passé simple replaces the passé composé alongside the imparfait: *Il **était** une fois un roi qui **avait** une fille. Un jour, une fée **arriva**…*

    Watch out: *il fit* (made), not "fit"; *il vit* (saw) is also the present of *vivre* (lives).
  examples:
    - { es: "Il était une fois une cigogne qui vivait sur un toit de Colmar.", en: "Once upon a time there was a stork who lived on a roof in Colmar." }
    - { es: "Un matin, elle partit vers le sud et ne revint pas.", en: "One morning she left for the south and didn't come back." }
    - { es: "Bartholdi naquit à Colmar en 1834.", en: "Bartholdi was born in Colmar in 1834." }
    - { es: "Les villageois furent très surpris.", en: "The villagers were very surprised." }
  pitfalls:
    - "Don't confuse *il fut* (was) with *il fût* (subjonctif imparfait, C1)."
    - "*Il vit* = he saw (voir) or he lives (vivre): context decides."
    - "Never use it in conversation."
  related: [g.passe-simple-forms, g.passe-simple-usage, g.pc-vs-imparfait]
  drills:
    - { es: "Le roi mourut en 1715.", en: "The king died in 1715." }
    - { es: "Ils arrivèrent à la nuit tombée.", en: "They arrived after nightfall." }
    - { es: "Elle ouvrit la porte et vit le loup.", en: "She opened the door and saw the wolf." }
- id: g.faire-causatif
  level: b2
  title: "Faire + infinitive: getting something done"
  summary: "faire réparer sa voiture (have it repaired), se faire couper les cheveux (get a haircut), faire rire quelqu'un (make someone laugh)."
  explanation: |
    | structure | example | meaning |
    |---|---|---|
    | *faire* + inf. + object | *Je **fais réparer** mon vélo.* | I'm having my bike repaired. |
    | *faire* + inf. + person | *Il **fait rire** les enfants.* | He makes the children laugh. |
    | both: thing + *à / par* + person | *Je **fais visiter** la ville **à** mes amis.* | I show my friends round the town. |
    | *se faire* + inf. (for oneself) | *Elle **s'est fait couper** les cheveux.* | She had her hair cut. |
    | *se faire* + inf. (passive, often bad) | *Il **s'est fait voler** son portefeuille.* | He had his wallet stolen. |

    ### Pronouns
    Before *faire*, never between *faire* and the infinitive: *Je **le** fais réparer. Je **la leur** fais visiter.*
    Imperative: *Fais-**le** entrer.*

    ### No agreement
    The participle *fait* before an infinitive is **invariable**: *La maison qu'il a **fait** construire. Elle s'est **fait** opérer.*
  examples:
    - { es: "Bartholdi a fait construire une fontaine pour sa ville.", en: "Bartholdi had a fountain built for his town." }
    - { es: "Je vais faire réparer la toiture avant l'hiver.", en: "I'm going to have the roof repaired before winter." }
    - { es: "Ce conte fait toujours rire les enfants.", en: "This tale always makes the children laugh." }
    - { es: "Elle s'est fait voler son sac au marché de Noël.", en: "She had her bag stolen at the Christmas market." }
  pitfalls:
    - "*Fait* doesn't agree here: *la statue qu'il a fait faire*, not *faite faire*."
    - "*Se faire* + inf. can mean something happened to you: *se faire arrêter* (get arrested)."
    - "Pronouns before *faire*: *je le fais faire*, not *je fais le faire*."
  related: [g.laisser-infinitive, g.passive-voice, g.double-object-pronouns]
  drills:
    - { es: "Je me suis fait couper les cheveux.", en: "I had my hair cut." }
    - { es: "Fais-le entrer.", en: "Show him in." }
    - { es: "Ils font construire une maison.", en: "They're having a house built." }
- id: g.laisser-infinitive
  level: b2
  title: "Laisser + infinitive: letting something happen"
  summary: "laisser tomber (drop, give up), laisser entrer (let in), se laisser convaincre (let oneself be persuaded)."
  explanation: |
    | structure | example | meaning |
    |---|---|---|
    | *laisser* + inf. | *Il **laisse dormir** le chat.* | He lets the cat sleep. |
    | *laisser* + person + inf. | *Laisse-**moi** parler !* | Let me speak! |
    | *se laisser* + inf. | *Je **me suis laissé convaincre**.* | I let myself be persuaded. |

    ### Common expressions
    - *laisser tomber* — to drop; to give up (*Laisse tomber !* = Forget it!)
    - *laisser faire* — to let things happen, not intervene
    - *laisser passer* — to let through; to miss (an opportunity)
    - *laisser voir* — to reveal
    - *se laisser aller* — to let oneself go
    - *Laissez-vous tenter !* — Go on, treat yourself!

    ### Pronouns and agreement
    Pronouns before *laisser*: *Je **les** laisse jouer.* The participle *laissé* + infinitive is usually invariable (1990 reform): *Elle s'est laissé tenter.*
  examples:
    - { es: "Laissez-vous tenter par un kougelhopf !", en: "Go on, treat yourself to a kougelhopf!" }
    - { es: "Le vigneron nous a laissés goûter tous ses vins.", en: "The winegrower let us taste all his wines." }
    - { es: "J'ai laissé tomber mon appareil photo dans le canal.", en: "I dropped my camera in the canal." }
    - { es: "Elle s'est laissé convaincre de rester un jour de plus.", en: "She let herself be persuaded to stay one more day." }
  pitfalls:
    - "*Laisser* (let) vs *faire* (make/have): *Il me laisse partir* (allows) vs *Il me fait partir* (forces)."
    - "*Laisser tomber* also means 'to give up / dump someone'."
  related: [g.faire-causatif, g.partir-sortir-dormir]
  drills:
    - { es: "Laisse-moi t'aider.", en: "Let me help you." }
    - { es: "Ne laisse pas passer cette occasion.", en: "Don't miss this opportunity." }
    - { es: "Laisse tomber, ce n'est pas grave.", en: "Forget it, it doesn't matter." }
- id: g.pronominal-passive
  level: b2
  title: "The pronominal passive: ça se boit frais, ça ne se fait pas"
  summary: "se + verb with a thing as subject for general truths, norms and habits: Le riesling se boit frais. Ça se dit comment ?"
  explanation: |
    | structure | example | meaning |
    |---|---|---|
    | thing + *se* + verb | *Le riesling **se boit** frais.* | is drunk chilled |
    | rules, customs | *Ça **ne se fait pas**.* | That isn't done. |
    | language | *Comment ça **s'écrit** ? Ça **se dit** en alsacien ?* | is written / said |
    | sales, popularity | *Ce vin **se vend** bien.* | sells well |
    | ease | *Ça **se mange** facilement.* | is easy to eat |
    | visibility | *Ça **se voit** !* | It shows! |

    ### When to use it
    - For **general, habitual** facts, not single events: *La choucroute se mange en hiver* (general) vs *La choucroute a été mangée* (a specific one).
    - No agent with *par*.
    - The subject is a thing, not a person.

    Other impersonal options: *on* (*On boit le riesling frais*) and the impersonal *il se* (*Il se passe quelque chose. Il se vend beaucoup de vin ici.*).
  examples:
    - { es: "Le gewurztraminer se boit souvent à l'apéritif.", en: "Gewurztraminer is often drunk as an aperitif." }
    - { es: "Ça ne se fait pas de refuser un verre ici !", en: "Refusing a glass just isn't done here!" }
    - { es: "Comment ça se prononce, Riquewihr ?", en: "How do you pronounce Riquewihr?" }
    - { es: "Il se vend des milliers de bouteilles chaque année.", en: "Thousands of bottles are sold every year." }
  pitfalls:
    - "Not for one-off events: *Le vin s'est bu hier* sounds odd; say *On a bu le vin hier*."
    - "*Ça se voit* = it shows; *on se voit* = see each other (reciprocal)."
  related: [g.on-instead-of-passive, g.passive-voice, g.pronominal-verbs, g.impersonal-constructions]
  drills:
    - { es: "Ça se mange avec les doigts.", en: "You eat it with your fingers." }
    - { es: "Ce mot ne s'utilise plus.", en: "This word isn't used any more." }
    - { es: "Ça se voit que tu es fatigué.", en: "It shows that you're tired." }
- id: g.impersonal-constructions
  level: b2
  title: "Impersonal il: il s'agit de, il paraît que, il reste, il manque"
  summary: "il s'agit de (it's about), il paraît que (apparently), il reste / il manque (there's … left / missing), il vaut mieux, il suffit de."
  explanation: |
    These verbs use a "dummy" *il* that refers to nothing:

    | expression | meaning | example |
    |---|---|---|
    | *il s'agit de* + noun / inf. | it's about / it's a matter of | ***Il s'agit d'**un vin de garde.* |
    | *il paraît que* + ind. | apparently, they say | ***Il paraît que** c'est le meilleur.* |
    | *il reste* + noun | there's … left | ***Il reste** deux bouteilles.* |
    | *il manque* + noun | … is missing | ***Il manque** un verre.* |
    | *il suffit de* + noun / inf. | all it takes is | ***Il suffit de** demander.* |
    | *il vaut mieux* + inf. / que + subj. | it's better to | ***Il vaut mieux** réserver.* |
    | *il arrive que* + subj. | it happens that | ***Il arrive qu'**il gèle en mai.* |
    | *il est question de* | there's talk of | ***Il est question de** fermer la cave.* |
    | *il se trouve que* + ind. | it so happens that | ***Il se trouve que** je connais le vigneron.* |
    | *il en va de même pour* | the same goes for | |

    ### Il s'agit de: never with a real subject
    *Ce livre parle de l'Alsace* or *Dans ce livre, il s'agit de l'Alsace* — never *Ce livre s'agit de…*

    The verb stays singular even with a plural noun: *Il reste trois places.*
  examples:
    - { es: "Il paraît que ce village est le plus beau d'Alsace.", en: "Apparently this is the most beautiful village in Alsace." }
    - { es: "Dans ce film, il s'agit d'une famille de vignerons.", en: "This film is about a family of winegrowers." }
    - { es: "Il ne reste plus que trois bouteilles de crémant.", en: "There are only three bottles of crémant left." }
    - { es: "Il suffit de suivre la route des vins.", en: "All you have to do is follow the wine route." }
  pitfalls:
    - "Not *Le film s'agit de…*: *Dans le film, il s'agit de…*"
    - "Singular verb: *il manque deux chaises*, not *il manquent*."
    - "*Il manque un verre* (a glass is missing) vs *Tu me manques* (I miss you)."
  related: [g.pronominal-passive, g.il-faut, g.subjonctif-necessite, g.opinion-nuance]
  drills:
    - { es: "Il s'agit d'une erreur.", en: "It's a mistake." }
    - { es: "Il reste du gâteau ?", en: "Is there any cake left?" }
    - { es: "Il vaut mieux partir maintenant.", en: "It's better to leave now." }
- id: g.opinion-nuance
  level: b2
  title: "Nuancing opinions: il me semble que, j'ai l'impression que, je dirais que"
  summary: "Soften, strengthen or qualify what you think: il me semble que, j'ai l'impression que, je dirais plutôt que, j'avoue que, je suis persuadé que."
  explanation: |
    | degree | expressions |
    |---|---|
    | strong conviction | *Je suis persuadé / convaincu que… Il est clair que… Sans aucun doute…* |
    | neutral | *Je pense / crois / trouve que… À mon avis… Selon moi…* |
    | softened | *Il me semble que… J'ai l'impression que… Je dirais que… J'aurais tendance à penser que…* |
    | partial agreement | *Je suis plutôt d'accord, mais… Dans une certaine mesure… Pas tout à fait.* |
    | concession | *J'avoue que… Je reconnais que… Certes…, mais…* |
    | disagreement (polite) | *Je ne partage pas tout à fait cet avis. Je vois les choses autrement.* |
    | uncertainty | *Je n'en suis pas sûr. Je me demande si… Ça dépend.* |

    ### Mood reminder
    *Il me semble que* + ind.; *il semble que* + subj. (usually); *je ne suis pas sûr que* + subj.

    ### Reacting
    *Tout à fait ! C'est vrai. Effectivement. Je n'y avais pas pensé. Là, je ne suis pas d'accord.*
  examples:
    - { es: "Il me semble que le riesling se marie mieux avec le poisson.", en: "It seems to me that riesling goes better with fish." }
    - { es: "J'ai l'impression que les prix ont beaucoup augmenté.", en: "I have the feeling prices have gone up a lot." }
    - { es: "Je dirais plutôt que c'est une question de goût.", en: "I'd rather say it's a matter of taste." }
    - { es: "Certes, ce vin est cher, mais il vaut son prix.", en: "Admittedly this wine is expensive, but it's worth it." }
  pitfalls:
    - "*Il me semble que* + indicative, not subjonctif."
    - "*Je suis d'accord avec toi*, not *je suis d'accord à toi*."
  related: [g.opinion-mood, g.hedging, g.indicatif-ou-subjonctif]
  drills:
    - { es: "J'avoue que je préfère le blanc.", en: "I admit I prefer white." }
    - { es: "Je ne partage pas cet avis.", en: "I don't share that view." }
    - { es: "Ça dépend du prix.", en: "It depends on the price." }
