id: b2.u12
title: "O português no mundo"
lessons:
  - id: b2.u12.l1
    title: "Uma língua, muitos sotaques"
    teach: [g.lusophone-varieties]
    vocab: [w.português-europeu, w.português-brasileiro, w.língua-materna, w.língua-oficial, w.variação-linguística, w.guerra-civil, w.continente, w.arquipélago, w.oceano, w.costa, w.moçambicano, w.bilíngue, w.crioulo, w.falante, w.nativo, w.vogal, w.galego, w.descolonização, w.diáspora, w.cabo-verdiano, w.lusofonia, w.guineense, w.são-tomense, w.timorense, w.macaense, w.variante, w.padrão, w.lusófono]
    tip: "Portuguese is official in nine countries on four continents. Brazil and Portugal each have a norm; Angola, Mozambique and the other African countries mostly follow the European written norm, with words of their own."
    sentences:
      - { es: "O português é falado em quatro continentes.", en: "Portuguese is spoken on four continents.", altEs: ["Fala-se português em quatro continentes."], grammar: [g.lusophone-varieties, g.passive-advanced], vocab: [w.continente], transform: { instruction: "Rewrite it with the impersonal se", answer: "Fala-se português em quatro continentes.", alt: ["Se fala português em quatro continentes."] } }
      - { es: "Angola e Moçambique ficam na África, e Timor-Leste fica na Ásia.", en: "Angola and Mozambique are in Africa, and East Timor is in Asia.", grammar: [g.lusophone-varieties, g.ficar-location], vocab: [] }
      - { es: "Cabo Verde é um arquipélago no meio do oceano Atlântico.", en: "Cape Verde is an archipelago in the middle of the Atlantic Ocean.", grammar: [g.lusophone-varieties], vocab: [w.arquipélago, w.oceano] }
      - { es: "Fernando de Noronha também é um arquipélago, a mais de trezentos quilômetros da costa.", en: "Fernando de Noronha is also an archipelago, more than three hundred kilometres off the coast.", altEs: ["Fernando de Noronha também é um arquipélago, a mais de 300 km da costa."], grammar: [g.lusophone-varieties], vocab: [w.arquipélago, w.costa, w.quilômetro] }
      - { es: "Para muitos moçambicanos, o português não é a língua materna, mas é a língua oficial.", en: "For many Mozambicans, Portuguese isn't their mother tongue, but it is the official language.", grammar: [g.lusophone-varieties], vocab: [w.moçambicano, w.língua-materna, w.língua-oficial] }
      - { es: "Em Cabo Verde, quase todo mundo é bilíngue: fala crioulo em casa e português na escola.", en: "In Cape Verde, almost everyone is bilingual: they speak Creole at home and Portuguese at school.", altEs: ["Em Cabo Verde, quase toda a gente é bilíngue: fala crioulo em casa e português na escola."], grammar: [g.lusophone-varieties], vocab: [w.bilíngue, w.crioulo], variant: "Portugal: bilingue; quase toda a gente." }
      - { es: "O Brasil tem de longe o maior número de falantes nativos de português.", en: "Brazil has by far the largest number of native speakers of Portuguese.", grammar: [g.lusophone-varieties, g.superlatives], vocab: [w.falante, w.nativo] }
      - { es: "Não existe uma língua brasileira: existe o português brasileiro, com a sua própria norma.", en: "There's no Brazilian language: there's Brazilian Portuguese, with its own norm.", grammar: [g.lusophone-varieties], vocab: [w.português-brasileiro, w.norma], error: { wrong: "No Brasil se fala brasileiro, e em Portugal se fala português.", explain: "Brazil and Portugal speak the same language, Portuguese, with two norms.", grammar: g.lusophone-varieties } }
      - { es: "No português europeu, as vogais átonas quase desaparecem.", en: "In European Portuguese, unstressed vowels almost disappear.", grammar: [g.lusophone-varieties], vocab: [w.português-europeu, w.vogal, w.átono] }
      - { es: "Estou fazendo, estou a fazer: as duas formas estão certas.", en: "'Estou fazendo', 'estou a fazer': both forms are correct.", grammar: [g.lusophone-varieties, g.estar-gerund], vocab: [] }
      - { es: "O galego, falado no noroeste da Espanha, é o parente mais próximo do português.", en: "Galician, spoken in north-western Spain, is the closest relative of Portuguese.", grammar: [g.lusophone-varieties, g.passive-advanced], vocab: [w.galego] }
      - { es: "Depois da descolonização, em 1975, muitos angolanos e moçambicanos emigraram para Portugal.", en: "After decolonisation in 1975, many Angolans and Mozambicans emigrated to Portugal.", grammar: [g.preterite-regular], vocab: [w.descolonização, w.moçambicano] }
      - { es: "A guerra civil em Angola durou quase trinta anos.", en: "The civil war in Angola lasted almost thirty years.", grammar: [g.preterite-regular], vocab: [w.guerra-civil] }
      - { es: "A diáspora cabo-verdiana é maior do que a população do próprio arquipélago.", en: "The Cape Verdean diaspora is larger than the population of the archipelago itself.", grammar: [g.comparatives], vocab: [w.diáspora, w.cabo-verdiano, w.arquipélago] }
      - { es: "A lusofonia reúne guineenses, são-tomenses, timorenses e macaenses, entre outros.", en: "The Portuguese-speaking world brings together people from Guinea-Bissau, São Tomé, East Timor and Macau, among others.", grammar: [g.lusophone-varieties], vocab: [w.lusofonia, w.guineense, w.são-tomense, w.timorense, w.macaense] }
      - { es: "Cada variante tem o seu padrão, e nenhuma é melhor do que a outra.", en: "Each variety has its own standard, and none is better than the other.", altEs: ["Cada variante tem seu padrão, e nenhuma é melhor que a outra."], grammar: [g.lusophone-varieties, g.irregular-comparatives], vocab: [w.variante, w.padrão], transform: { instruction: "Change to the plural: As variantes…", answer: "As variantes têm os seus padrões, e nenhuma é melhor do que a outra.", alt: ["As variantes têm seus padrões, e nenhuma é melhor que a outra."] } }
    exchanges:
      - q: { es: "Em quantos países o português é língua oficial?", en: "In how many countries is Portuguese an official language?" }
        a: { es: "Em nove, em quatro continentes, além de Macau.", en: "In nine, on four continents, plus Macau." }
        alt: ["Em nove.", "Nove países."]
        grammar: [g.lusophone-varieties]
        vocab: [w.continente, w.língua-oficial]
      - q: { es: "Você entende bem o português europeu?", en: "Do you understand European Portuguese well?" }
        a: { es: "No começo era difícil, por causa das vogais; agora vou me acostumando.", en: "At first it was hard, because of the vowels; now I'm gradually getting used to it." }
        alt: ["Mais ou menos.", "Agora entendo melhor."]
        grammar: [g.lusophone-varieties, g.periphrases-aspect]
        vocab: [w.português-europeu, w.vogal]
      - q: { es: "De onde você é? Que sotaque bonito!", en: "Where are you from? What a lovely accent!" }
        a: { es: "Sou cabo-verdiana, da ilha de Santiago, mas moro em Lisboa.", en: "I'm Cape Verdean, from the island of Santiago, but I live in Lisbon." }
        alt: ["Sou de Cabo Verde.", "Sou cabo-verdiana."]
        grammar: [g.ser-origin]
        vocab: [w.cabo-verdiano]
      - q: { es: "O português é a sua língua materna?", en: "Is Portuguese your mother tongue?" }
        a: { es: "Não, a minha língua materna é o macua; o português aprendi na escola.", en: "No, my mother tongue is Makhuwa; I learnt Portuguese at school." }
        alt: ["Não, aprendi na escola.", "É, sim."]
        grammar: [g.lusophone-varieties, g.emphatic-structures]
        vocab: [w.língua-materna]
      - q: { es: "O galego é português?", en: "Is Galician Portuguese?" }
        a: { es: "Não exatamente, mas é muito parecido; um falante de português entende quase tudo.", en: "Not exactly, but it's very similar; a Portuguese speaker understands almost everything." }
        alt: ["É muito parecido.", "Não, mas é parente próximo."]
        grammar: [g.lusophone-varieties]
        vocab: [w.galego, w.falante]
      - q: { es: "O que é variação linguística?", en: "What is linguistic variation?" }
        a: { es: "É o fato de uma língua mudar conforme a região, a idade e a situação.", en: "It's the fact that a language changes according to region, age and situation." }
        alt: ["É a mudança da língua conforme a região.", "São as diferenças dentro de uma língua."]
        grammar: [g.lusophone-varieties]
        vocab: [w.variação-linguística]
    texts:
      - title: "Placa no museu de Noronha"
        es: ["O arquipélago foi avistado por navegadores portugueses em 1503.", "O nome vem de Fernão de Loronha, um comerciante de Lisboa.", "Hoje, ouvem-se aqui sotaques de todo o mundo lusófono."]
        en: ["The archipelago was sighted by Portuguese navigators in 1503.", "The name comes from Fernão de Loronha, a Lisbon merchant.", "Today you can hear accents from the whole Portuguese-speaking world here."]
        grammar: [g.lusophone-varieties, g.passive-advanced]
        vocab: [w.arquipélago, w.lusófono]
      - title: "Legenda de mapa"
        es: ["Países de língua oficial portuguesa: nove.", "Falantes: mais de 250 milhões.", "Continentes: América, Europa, África e Ásia."]
        en: ["Countries with Portuguese as an official language: nine.", "Speakers: more than 250 million.", "Continents: America, Europe, Africa and Asia."]
        grammar: [g.lusophone-varieties]
        vocab: [w.língua-oficial, w.falante, w.continente]
    spicy:
      - { es: "Seu sotaque cabo-verdiano devia ser patrimônio da lusofonia.", en: "Your Cape Verdean accent should be heritage of the Portuguese-speaking world.", grammar: [g.lusophone-varieties], vocab: [w.cabo-verdiano, w.lusofonia] }
      - { es: "Falo quatro línguas, mas com você fico sem palavras em todas.", en: "I speak four languages, but with you I'm lost for words in all of them.", grammar: [g.present-irregular-first-person], vocab: [] }
      - { es: "Atravessei um oceano e não esperava encontrar você na primeira praia.", en: "I crossed an ocean and didn't expect to find you on the first beach.", grammar: [g.preterite-vs-imperfect], vocab: [w.oceano] }
      - { es: "Você é bilíngue? Então me ensina a dizer “fica mais um pouco” em todas as línguas.", en: "You're bilingual? Then teach me to say 'stay a bit longer' in every language.", grammar: [g.imperative-informal], vocab: [w.bilíngue] }
      - { es: "Entre o português europeu e o brasileiro, eu escolho o seu.", en: "Between European and Brazilian Portuguese, I choose yours.", grammar: [g.lusophone-varieties], vocab: [w.português-europeu] }
  - id: b2.u12.l2
    title: "Tu, você ou o senhor?"
    teach: [g.address-across-lusophone]
    vocab: [w.connosco, w.reformado, w.lusitano, w.luso-brasileiro]
    tip: "Brazil: você for almost everyone, o senhor / a senhora for respect. Portugal: tu with friends; with strangers, leave the pronoun out (Quer um café?) or use o senhor; você can sound condescending there."
    sentences:
      - { es: "Você aceita um café?", en: "Would you like a coffee?", altEs: ["Aceita um café?", "O senhor aceita um café?"], grammar: [g.address-across-lusophone], vocab: [] }
      - { es: "Queres vir connosco à Baía do Sancho?", en: "Do you want to come with us to Sancho Bay?", altEs: ["Tu queres vir connosco à Baía do Sancho?", "Você quer vir com a gente para a Baía do Sancho?", "Você quer vir conosco à Baía do Sancho?"], grammar: [g.address-across-lusophone, g.ep-tu-forms], vocab: [w.connosco], transform: { instruction: "Say it the Brazilian way, with você and a gente", answer: "Você quer vir com a gente para a Baía do Sancho?", alt: ["Você quer vir conosco à Baía do Sancho?", "Você quer vir com a gente à Baía do Sancho?"] }, variant: "This is European Portuguese (tu queres, connosco). Brazil: Você quer vir com a gente / conosco?" }
      - { es: "Em Portugal, evite dizer “você” a uma pessoa mais velha.", en: "In Portugal, avoid saying 'você' to an older person.", altEs: ["Em Portugal, evite tratar uma pessoa mais velha por “você”."], grammar: [g.address-across-lusophone, g.imperative-formal], vocab: [] }
      - { es: "A senhora quer sentar-se aqui, à sombra?", en: "Would you like to sit here in the shade, madam?", altEs: ["A senhora quer se sentar aqui, na sombra?"], grammar: [g.address-across-lusophone, g.clitics-verb-phrases], vocab: [w.sombra] }
      - { es: "Seu João, bom dia! O senhor vai mergulhar hoje?", en: "Good morning, Mr João! Are you going diving today?", grammar: [g.address-across-lusophone, g.voce-o-senhor], vocab: [w.mergulhar] }
      - { es: "Em Lisboa, ouvi “O senhor doutor pode entrar” no consultório.", en: "In Lisbon I heard 'You may come in, doctor' at the surgery.", grammar: [g.address-across-lusophone], vocab: [] }
      - { es: "Em Angola, os mais novos tratam os mais velhos com muito respeito.", en: "In Angola, younger people treat their elders with great respect.", grammar: [g.address-across-lusophone], vocab: [] }
      - { es: "Vós só se usa nas orações e em algumas aldeias do norte de Portugal.", en: "Vós is only used in prayers and in some villages in the north of Portugal.", grammar: [g.address-across-lusophone, g.se-passive], vocab: [w.oração, w.aldeia] }
      - { es: "O meu avô é reformado e mora no Porto; no Brasil, diríamos que é aposentado.", en: "My grandfather is retired and lives in Porto; in Brazil we'd say aposentado.", altEs: ["O meu avô está reformado e vive no Porto."], grammar: [g.address-across-lusophone, g.conditional-simple], vocab: [w.reformado] }
      - { es: "Ao telefone, diga “Está?” em Portugal e “Alô?” no Brasil.", en: "On the phone, say 'Está?' in Portugal and 'Alô?' in Brazil.", grammar: [g.address-across-lusophone, g.imperative-formal], vocab: [] }
      - { es: "Vocês são de onde? — Somos lusitanos, de Coimbra.", en: "Where are you from? — We're Portuguese, from Coimbra.", altEs: ["De onde vocês são? — Somos portugueses, de Coimbra."], grammar: [g.address-across-lusophone, g.ser-origin], vocab: [w.lusitano] }
      - { es: "A amizade luso-brasileira é antiga, mas as piadas também.", en: "Luso-Brazilian friendship is old, but so are the jokes.", grammar: [g.address-across-lusophone], vocab: [w.luso-brasileiro] }
      - { es: "No Brasil, “doutor” também se usa para advogados e até como sinal de respeito.", en: "In Brazil, 'doutor' is also used for lawyers and even as a sign of respect.", grammar: [g.address-across-lusophone, g.se-passive], vocab: [w.advogado] }
      - { es: "O Pedro quer um café? — perguntou a senhora, sem usar nenhum pronome.", en: "'Would you like a coffee, Pedro?' the lady asked, without using any pronoun.", grammar: [g.address-across-lusophone], vocab: [], note: "In Portugal, using the person's name with the third person avoids choosing between tu and você." }
      - { es: "Você pode me ajudar? — perguntei, e o português do balcão sorriu.", en: "'Can you help me?' I asked, and the Portuguese man at the counter smiled.", grammar: [g.address-across-lusophone], vocab: [], error: { wrong: "O senhor podes me ajudar?", explain: "o senhor takes the third person: o senhor pode.", grammar: g.address-across-lusophone } }
      - { es: "Tu falas muito bem português!", en: "You speak Portuguese really well!", altEs: ["Você fala muito bem português!", "Falas muito bem português!"], grammar: [g.address-across-lusophone, g.ep-tu-forms], vocab: [], transform: { instruction: "Change to o senhor", answer: "O senhor fala muito bem português!" } }
    exchanges:
      - q: { es: "Como devo tratar o dono da pousada?", en: "How should I address the guesthouse owner?" }
        a: { es: "De “o senhor”, pelo menos no começo.", en: "As 'o senhor', at least at first." }
        alt: ["De senhor.", "Pode chamar de Seu Antônio."]
        grammar: [g.address-across-lusophone]
        vocab: []
      - q: { es: "Queres um pastel de nata?", en: "Do you want a custard tart?" }
        a: { es: "Quero, obrigado! Vocês, portugueses, sempre trazem doces.", en: "Yes please, thanks! You Portuguese always bring sweets." }
        alt: ["Quero, sim!", "Obrigado, quero."]
        grammar: [g.address-across-lusophone, g.ep-tu-forms]
        vocab: []
      - q: { es: "Posso tratar a senhora por você?", en: "May I call you 'você'?" }
        a: { es: "Pode, sim, aqui no Brasil é normal.", en: "Yes, of course, here in Brazil it's normal." }
        alt: ["Pode, sim.", "Prefiro “a senhora”, se não se importa."]
        grammar: [g.address-across-lusophone, g.voce-o-senhor]
        vocab: []
      - q: { es: "Por que ele me chamou de “mais-velho”?", en: "Why did he call me 'mais-velho'?" }
        a: { es: "Em Angola, é uma forma de respeito para quem é mais velho.", en: "In Angola, it's a respectful way of addressing someone older." }
        alt: ["É uma forma de respeito.", "Por respeito."]
        grammar: [g.address-across-lusophone]
        vocab: []
      - q: { es: "Vocês já tomaram o pequeno-almoço?", en: "Have you had breakfast yet?" }
        a: { es: "Já! Aqui no Brasil a gente diz café da manhã, sabia?", en: "Yes! Here in Brazil we say café da manhã, did you know?" }
        alt: ["Já tomamos.", "Ainda não."]
        grammar: [g.address-across-lusophone, g.lusophone-varieties]
        vocab: [w.pequeno-almoço]
    texts:
      - title: "Mensagem de uma portuguesa em Noronha"
        es: ["Olá, Rita! Estou a adorar Noronha.", "Aqui toda a gente me trata por você, e já nem estranho.", "Amanhã vamos ver os golfinhos. Queres que te mande fotos?"]
        en: ["Hi, Rita! I'm loving Noronha.", "Here everyone calls me 'você', and I don't even find it strange any more.", "Tomorrow we're going to see the dolphins. Do you want me to send you photos?"]
        grammar: [g.address-across-lusophone, g.ep-estar-a-infinitive]
        vocab: [w.golfinho]
    spicy:
      - { es: "Posso te tratar por tu? Você me parece íntimo demais para “o senhor”.", en: "Can I call you tu? You seem too close to me for 'sir'.", altEs: ["Posso te tratar por tu? Você me parece íntima demais para “a senhora”."], grammar: [g.address-across-lusophone], vocab: [] }
      - { es: "Queres jantar connosco? Quer dizer… só comigo.", en: "Do you want to have dinner with us? I mean… just with me.", altEs: ["Quer jantar com a gente? Quer dizer… só comigo."], grammar: [g.address-across-lusophone, g.ep-tu-forms], vocab: [w.connosco] }
      - { es: "Pode me chamar de você, de tu ou de meu bem: eu atendo.", en: "You can call me você, tu or darling: I'll answer.", grammar: [g.address-across-lusophone], vocab: [] }
      - { es: "Senhor doutor, o seu diagnóstico? — Grave: saudade aguda de você.", en: "Doctor, your diagnosis? — Serious: acute longing for you.", grammar: [g.address-across-lusophone], vocab: [w.saudade] }
      - { es: "Em Portugal você me chamaria de tu; no Brasil, de amor.", en: "In Portugal you'd call me tu; in Brazil, love.", grammar: [g.address-across-lusophone, g.conditional-simple], vocab: [] }
  - id: b2.u12.l3
    title: "Ideia sem acento"
    teach: [g.spelling-agreement]
    vocab: [w.acordo-ortográfico, w.cedilha, w.acento, w.ortografia, w.consoante, w.hífen, w.til, w.sílaba, w.pronúncia, w.entonação, w.grafia, w.anglicismo, w.estrangeirismo, w.vocabulário, w.africanismo]
    tip: "Since the 1990 Agreement (in force from 2009): ideia, heroico, voo, leem, linguiça, fim de semana. Accents that reflect pronunciation still differ: econômico (BR) / económico (PT), Antônio / António."
    sentences:
      - { es: "Tive uma ideia ótima: vamos ver o pôr do sol no Morro Dois Irmãos.", en: "I've had a great idea: let's watch the sunset at Morro Dois Irmãos.", grammar: [g.spelling-agreement], vocab: [w.ideia, w.pôr-do-sol], error: { wrong: "Tive uma idéia ótima: vamos ver o pôr do sol no Morro Dois Irmãos.", explain: "Since the Spelling Agreement, ideia has no accent.", grammar: g.spelling-agreement } }
      - { es: "O voo de Recife para Noronha atrasou uma hora.", en: "The flight from Recife to Noronha was an hour late.", grammar: [g.spelling-agreement, g.preterite-regular], vocab: [w.voo], error: { wrong: "O vôo de Recife para Noronha atrasou uma hora.", explain: "vôo lost its accent in 2009: voo.", grammar: g.spelling-agreement } }
      - { es: "Eles leem as placas em português e em inglês.", en: "They read the signs in Portuguese and English.", grammar: [g.spelling-agreement], vocab: [w.placa] }
      - { es: "A linguiça aparece com frequência no cardápio da ilha.", en: "Sausage often appears on the island's menus.", grammar: [g.spelling-agreement], vocab: [w.linguiça, w.cardápio] }
      - { es: "O Acordo Ortográfico tirou o trema e alguns acentos da ortografia brasileira.", en: "The Spelling Agreement removed the diaeresis and some accents from Brazilian spelling.", grammar: [g.spelling-agreement], vocab: [w.acordo-ortográfico, w.ortografia, w.acento] }
      - { es: "Em Portugal caíram as consoantes mudas: acção virou ação.", en: "In Portugal the silent consonants went: acção became ação.", grammar: [g.spelling-agreement], vocab: [w.consoante] }
      - { es: "“Fim de semana” agora se escreve sem hífen.", en: "'Fim de semana' is now written without hyphens.", grammar: [g.spelling-agreement, g.se-passive], vocab: [w.hífen], transform: { instruction: "Rewrite with the passive (é escrito)", answer: "“Fim de semana” agora é escrito sem hífen." } }
      - { es: "O til marca a vogal nasal, e a cedilha muda o som do c.", en: "The tilde marks the nasal vowel, and the cedilla changes the sound of the c.", grammar: [g.accents], vocab: [w.til, w.vogal, w.cedilha] }
      - { es: "Em “econômico”, a sílaba tônica tem acento circunflexo no Brasil e agudo em Portugal.", en: "In 'econômico', the stressed syllable has a circumflex in Brazil and an acute accent in Portugal.", grammar: [g.spelling-agreement, g.accents], vocab: [w.sílaba, w.tônico, w.acento] }
      - { es: "A pronúncia e a entonação mudam mais do que a grafia.", en: "Pronunciation and intonation change more than spelling.", grammar: [g.comparatives], vocab: [w.pronúncia, w.entonação, w.grafia] }
      - { es: "O trem para em todas as estações.", en: "The train stops at every station.", grammar: [g.spelling-agreement], vocab: [w.estação], note: "para (stops) lost its accent: context tells it apart from the preposition para.", variant: "Portugal: O comboio para em todas as estações." }
      - { es: "Mouse, delivery e shopping são anglicismos comuns no Brasil.", en: "Mouse, delivery and shopping are common anglicisms in Brazil.", grammar: [g.lusophone-varieties], vocab: [w.anglicismo], kinds: [choiceEs, typeEn, listen] }
      - { es: "Todo estrangeirismo enriquece o vocabulário ou ameaça a língua? Há quem discorde.", en: "Does every foreign loanword enrich the vocabulary or threaten the language? Some disagree.", grammar: [g.impersonal-expressions], vocab: [w.estrangeirismo, w.vocabulário] }
      - { es: "Palavras como “caçula” e “samba” são africanismos do português brasileiro.", en: "Words like 'caçula' and 'samba' are Africanisms in Brazilian Portuguese.", grammar: [g.lusophone-varieties], vocab: [w.africanismo, w.caçula, w.português-brasileiro] }
      - { es: "Livros antigos ainda usam a grafia de antes do acordo.", en: "Old books still use the spelling from before the agreement.", grammar: [g.spelling-agreement], vocab: [w.grafia] }
      - { es: "A assembleia foi adiada, e a ação, considerada heroica.", en: "The assembly was postponed, and the action was considered heroic.", grammar: [g.spelling-agreement, g.passive-advanced], vocab: [w.assembleia, w.heroico], transform: { instruction: "Change the subject to o encontro (masculine)", answer: "O encontro foi adiado, e a ação, considerada heroica." } }
    exchanges:
      - q: { es: "“Ideia” ainda tem acento?", en: "Does 'ideia' still have an accent?" }
        a: { es: "Não, desde o Acordo Ortográfico se escreve sem acento.", en: "No, since the Spelling Agreement it's written without one." }
        alt: ["Não tem mais.", "Não, perdeu o acento."]
        grammar: [g.spelling-agreement]
        vocab: [w.acento, w.acordo-ortográfico]
      - q: { es: "Por que em Portugal se escreve “facto” e no Brasil “fato”?", en: "Why is it 'facto' in Portugal and 'fato' in Brazil?" }
        a: { es: "Porque lá o “c” é pronunciado; a grafia segue a pronúncia.", en: "Because the 'c' is pronounced there; spelling follows pronunciation." }
        alt: ["Por causa da pronúncia.", "Porque lá se pronuncia o “c”."]
        grammar: [g.spelling-agreement]
        vocab: [w.grafia, w.pronúncia]
      - q: { es: "Quantas sílabas tem “arquipélago”?", en: "How many syllables does 'arquipélago' have?" }
        a: { es: "Cinco: ar-qui-pé-la-go. A tônica é a terceira.", en: "Five: ar-qui-pé-la-go. The stressed one is the third." }
        alt: ["Cinco.", "Tem cinco sílabas."]
        grammar: [g.accents]
        vocab: [w.sílaba, w.arquipélago]
      - q: { es: "Você usa muito estrangeirismo no trabalho?", en: "Do you use a lot of foreign words at work?" }
        a: { es: "Uso, infelizmente: reunião virou “meeting” e prazo virou “deadline”.", en: "I do, unfortunately: reunião has become 'meeting' and prazo has become 'deadline'." }
        alt: ["Uso, sim.", "Muito, infelizmente."]
        grammar: [g.null-object]
        vocab: [w.estrangeirismo]
    texts:
      - title: "Dica de revisão"
        es: ["Antes de entregar o texto, confira a ortografia.", "Escreva ideia, voo e linguiça sem acento.", "E lembre: “para” (verbo) também perdeu o acento."]
        en: ["Before handing in the text, check the spelling.", "Write ideia, voo and linguiça without an accent.", "And remember: 'para' (the verb) also lost its accent."]
        grammar: [g.spelling-agreement, g.imperative-formal]
        vocab: [w.ortografia, w.acento]
    spicy:
      - { es: "Tive uma ideia sem acento e sem juízo: jantar com você hoje.", en: "I've had an idea with no accent and no sense: dinner with you tonight.", grammar: [g.spelling-agreement], vocab: [w.ideia, w.acento] }
      - { es: "Você é a sílaba tônica da minha vida.", en: "You're the stressed syllable of my life.", grammar: [g.spelling-agreement], vocab: [w.sílaba, w.tônico] }
      - { es: "Mudaram a ortografia, mas o meu jeito de te olhar continua igual.", en: "They changed the spelling, but the way I look at you is still the same.", grammar: [g.spelling-agreement], vocab: [w.ortografia] }
      - { es: "Meu coração perdeu o hífen: agora é inteiro seu.", en: "My heart has lost its hyphen: now it's all yours.", grammar: [g.spelling-agreement], vocab: [w.hífen] }
      - { es: "Com essa pronúncia, você pode me dizer qualquer coisa.", en: "With that pronunciation, you can say anything to me.", grammar: [g.pronoun-placement-brazil], vocab: [w.pronúncia] }
  - id: b2.u12.l4
    title: "Rotas, música e mar"
    teach: [g.lusophone-varieties, g.address-across-lusophone]
    vocab: [w.porto, w.choro, w.autocarro, w.telemóvel, w.comboio, w.pequeno-almoço, w.machimbombo, w.rota, w.especiaria, w.navio, w.travessia, w.kizomba, w.semba, w.morna, w.cachupa, w.bossa-nova, w.pagode, w.funk, w.música-popular-brasileira, w.emigração, w.hospitalidade]
    tip: "The Portuguese language travelled the sea routes of the 15th and 16th centuries; today it travels as music: kizomba from Angola, morna from Cape Verde, bossa nova, choro and funk from Brazil."
    sentences:
      - { es: "As caravelas portuguesas abriram a rota das especiarias até a Índia.", en: "Portuguese caravels opened up the spice route to India.", altEs: ["As caravelas portuguesas abriram a rota das especiarias até à Índia."], grammar: [g.preterite-regular], vocab: [w.rota, w.especiaria, w.caravela] }
      - { es: "Do porto de Lisboa saíam navios para a África, o Brasil e a Ásia.", en: "Ships left the port of Lisbon for Africa, Brazil and Asia.", grammar: [g.imperfect], vocab: [w.porto, w.navio] }
      - { es: "A travessia do Atlântico podia levar dois meses.", en: "Crossing the Atlantic could take two months.", grammar: [g.imperfect], vocab: [w.travessia] }
      - { es: "Em Portugal, o ônibus se chama autocarro, e o trem, comboio.", en: "In Portugal, the bus is called autocarro, and the train, comboio.", altEs: ["Em Portugal, o ônibus chama-se autocarro, e o trem, comboio."], grammar: [g.lusophone-varieties, g.reflexive-verbs-present], vocab: [w.autocarro, w.comboio] }
      - { es: "Em Moçambique, muita gente diz machimbombo em vez de ônibus.", en: "In Mozambique, lots of people say machimbombo instead of bus.", grammar: [g.lusophone-varieties], vocab: [w.machimbombo], transform: { instruction: "Say the same about Portugal, where the word is autocarro", answer: "Em Portugal, muita gente diz autocarro em vez de ônibus.", alt: ["Em Portugal, as pessoas dizem autocarro em vez de ônibus."] } }
      - { es: "Esqueci o telemóvel no comboio! — disse o turista português.", en: "I left my mobile on the train! said the Portuguese tourist.", altEs: ["Esqueci-me do telemóvel no comboio! — disse o turista português."], grammar: [g.lusophone-varieties, g.ep-vocabulary-differences], vocab: [w.telemóvel, w.comboio], transform: { instruction: "Say it the Brazilian way", answer: "Esqueci o celular no trem!", alt: ["Esqueci meu celular no trem!", "Esqueci o meu celular no trem!"] } }
      - { es: "O pequeno-almoço da pousada tinha tapioca, cuscuz e pão de queijo.", en: "The guesthouse breakfast had tapioca, couscous and cheese bread.", altEs: ["O café da manhã da pousada tinha tapioca, cuscuz e pão de queijo."], grammar: [g.lusophone-varieties, g.imperfect], vocab: [w.pequeno-almoço, w.tapioca, w.cuscuz] }
      - { es: "A kizomba nasceu em Angola, misturando semba com ritmos do Caribe.", en: "Kizomba was born in Angola, mixing semba with Caribbean rhythms.", grammar: [g.lusophone-varieties, g.gerund-uses-advanced], vocab: [w.kizomba, w.semba] }
      - { es: "Cesária Évora levou a morna de Cabo Verde para o mundo inteiro.", en: "Cesária Évora took the morna from Cape Verde to the whole world.", grammar: [g.preterite-regular], vocab: [w.morna] }
      - { es: "A cachupa, prato nacional cabo-verdiano, é feita com milho e feijão.", en: "Cachupa, Cape Verde's national dish, is made with corn and beans.", grammar: [g.passive-ser], vocab: [w.cachupa, w.cabo-verdiano], error: { wrong: "A cachupa, prato nacional cabo-verdiano, é feito com milho e feijão.", explain: "The participle agrees with the subject, cachupa (feminine): é feita.", grammar: g.passive-advanced } }
      - { es: "A bossa nova surgiu no Rio no fim dos anos 50.", en: "Bossa nova emerged in Rio at the end of the 1950s.", grammar: [g.preterite-regular], vocab: [w.bossa-nova] }
      - { es: "O choro é mais antigo que o samba e é considerado a primeira música urbana do Brasil.", en: "Choro is older than samba and is considered Brazil's first urban music.", grammar: [g.comparatives, g.passive-advanced], vocab: [w.choro] }
      - { es: "No domingo tem roda de pagode na praça; sábado, baile funk.", en: "On Sunday there's a pagode jam in the square; on Saturday, a funk party.", grammar: [g.tem-there-is], vocab: [w.pagode, w.funk] }
      - { es: "A MPB, sigla de música popular brasileira, mistura bossa nova, samba e rock.", en: "MPB, short for Brazilian popular music, mixes bossa nova, samba and rock.", grammar: [g.lusophone-varieties], vocab: [w.música-popular-brasileira, w.bossa-nova] }
      - { es: "A emigração portuguesa para o Brasil foi enorme no início do século XX.", en: "Portuguese emigration to Brazil was huge at the start of the 20th century.", grammar: [g.preterite-ser-ir], vocab: [w.emigração] }
      - { es: "Por toda a parte em Noronha se vê a hospitalidade dos ilhéus.", en: "All over Noronha you see the islanders' hospitality.", grammar: [g.se-passive], vocab: [w.hospitalidade] }
    exchanges:
      - q: { es: "Que música é essa? É brasileira?", en: "What music is this? Is it Brazilian?" }
        a: { es: "Não, é kizomba, de Angola. Quer dançar?", en: "No, it's kizomba, from Angola. Do you want to dance?" }
        alt: ["É kizomba.", "É música angolana."]
        grammar: [g.lusophone-varieties]
        vocab: [w.kizomba]
      - q: { es: "Já provou cachupa?", en: "Have you ever tried cachupa?" }
        a: { es: "Provei em Lisboa, num restaurante cabo-verdiano. Adorei!", en: "I tried it in Lisbon, at a Cape Verdean restaurant. I loved it!" }
        alt: ["Já, adorei.", "Nunca provei."]
        grammar: [g.null-object]
        vocab: [w.cachupa, w.cabo-verdiano]
      - q: { es: "Como se chega a Noronha?", en: "How do you get to Noronha?" }
        a: { es: "De avião, de Recife ou de Natal. De navio, a travessia é longa.", en: "By plane, from Recife or Natal. By ship, the crossing is long." }
        alt: ["De avião.", "Pegando um voo em Recife."]
        grammar: [g.lusophone-varieties]
        vocab: [w.navio, w.travessia]
      - q: { es: "Os senhores precisam de ajuda com as malas?", en: "Do you need help with your bags, sir and madam?" }
        a: { es: "Muito obrigado, mas nós damos conta.", en: "Thank you very much, but we can manage." }
        alt: ["Obrigado, não precisa.", "Sim, por favor."]
        grammar: [g.address-across-lusophone, g.periphrases-modal]
        vocab: [w.dar-conta]
      - q: { es: "Você prefere bossa nova ou choro?", en: "Do you prefer bossa nova or choro?" }
        a: { es: "Bossa nova para relaxar, choro para dançar na cadeira.", en: "Bossa nova to relax, choro to dance in my chair." }
        alt: ["Bossa nova.", "Choro, sem dúvida."]
        grammar: [g.por-vs-para]
        vocab: [w.bossa-nova, w.choro]
    texts:
      - title: "Programação do fim de semana"
        es: ["Sexta: noite de morna e kizomba no bar do porto.", "Sábado: roda de choro na praça.", "Domingo: pagode ao pôr do sol, com entrada livre."]
        en: ["Friday: morna and kizomba night at the harbour bar.", "Saturday: choro jam in the square.", "Sunday: pagode at sunset, free entry."]
        grammar: [g.lusophone-varieties]
        vocab: [w.morna, w.kizomba, w.choro, w.pagode]
      - title: "Cartão-postal de Noronha"
        es: ["Querida avó, Noronha é um paraíso de golfinhos e tartarugas.", "Conheci um casal de Lisboa e uma moçambicana muito simpática.", "Falamos o mesmo português de quatro jeitos diferentes!"]
        en: ["Dear Grandma, Noronha is a paradise of dolphins and turtles.", "I met a couple from Lisbon and a very friendly Mozambican woman.", "We speak the same Portuguese in four different ways!"]
        grammar: [g.lusophone-varieties]
        vocab: [w.golfinho, w.moçambicano]
    spicy:
      - { es: "Não sei dançar kizomba, mas aprendo rapidinho se for com você.", en: "I can't dance kizomba, but I'll learn in a jiffy if it's with you.", grammar: [g.future-subjunctive-se], vocab: [w.kizomba, w.rapidinho] }
      - { es: "Você é a minha especiaria preferida: deixa tudo mais gostoso.", en: "You're my favourite spice: you make everything tastier.", grammar: [g.comparatives], vocab: [w.especiaria] }
      - { es: "Atravessaria o Atlântico de caravela só para tomar o pequeno-almoço contigo.", en: "I'd cross the Atlantic by caravel just to have breakfast with you.", altEs: ["Atravessaria o Atlântico de caravela só para tomar café da manhã com você."], grammar: [g.conditional-simple], vocab: [w.caravela, w.pequeno-almoço] }
      - { es: "Essa morna é tão triste que eu preciso de um abraço.", en: "This morna is so sad that I need a hug.", grammar: [g.consequence-clauses], vocab: [w.morna] }
      - { es: "No baile, ele tocou bossa nova e eu me apaixonei em português.", en: "At the dance, he played bossa nova and I fell in love in Portuguese.", grammar: [g.preterite-regular], vocab: [w.bossa-nova] }
dialogues:
  - id: b2.u12.d1
    title: "Na Baía dos Golfinhos"
    context: "At dawn on the lookout over Dolphin Bay, Fernando de Noronha, Bia meets Joana from Lisbon and Nelson from Maputo while they wait for the spinner dolphins."
    lines:
      - { speaker: "Joana", es: "Bom dia! Também estás à espera dos golfinhos?", en: "Morning! Are you waiting for the dolphins too?" }
      - { speaker: "Bia", es: "Estou, sim! Você é de Portugal, né? Adoro esse sotaque.", en: "I am! You're from Portugal, right? I love that accent." }
      - { speaker: "Joana", es: "Sou de Lisboa. E tu és de onde? Desculpa, posso tratar-te por tu?", en: "I'm from Lisbon. And where are you from? Sorry, may I call you tu?" }
      - { speaker: "Bia", es: "Claro! Aqui no Brasil quase todo mundo usa você, mas tu também serve.", en: "Of course! Here in Brazil almost everyone uses você, but tu is fine too." }
      - { speaker: "Nelson", es: "E eu sou de Maputo. Em Moçambique misturamos um pouco das duas coisas.", en: "And I'm from Maputo. In Mozambique we mix a bit of both." }
      - { speaker: "Bia", es: "Que legal! Como vocês vieram para a ilha?", en: "How cool! How did you get to the island?" }
      - { speaker: "Joana", es: "Apanhámos o avião em Recife. Em Lisboa diríamos que o voo foi um bocadinho longo.", en: "We caught the plane in Recife. In Lisbon we'd say the flight was a little bit long." }
      - { speaker: "Nelson", es: "Na minha terra, eu teria vindo de machimbombo até o aeroporto!", en: "Back home, I'd have come to the airport by machimbombo!" }
      - { speaker: "Bia", es: "Machimbombo? Aqui é ônibus, e em Portugal é autocarro. Três palavras, uma língua!", en: "Machimbombo? Here it's ônibus, and in Portugal it's autocarro. Three words, one language!" }
      - { speaker: "Joana", es: "Olhem, ali! Os golfinhos chegaram!", en: "Look, over there! The dolphins have arrived!" }
    questions:
      - { q: "De onde é a Joana?", options: ["De Maputo", "De Lisboa", "De Recife"], answer: 1, explain: "Sou de Lisboa." }
      - { q: "Por que a Joana pede desculpa?", options: ["Porque chegou atrasada", "Porque quer tratar a Bia por tu", "Porque não entende o sotaque"], answer: 1, explain: "Posso tratar-te por tu?: she asks before using tu." }
      - { q: "O que é um machimbombo?", options: ["Um tipo de barco", "Um ônibus, em Moçambique", "Um prato típico"], answer: 1, explain: "Bia explains: Machimbombo? Aqui é ônibus, e em Portugal é autocarro." }
      - { q: "Por que eles estão na Baía dos Golfinhos de manhã cedo?", options: ["Para mergulhar", "Para esperar os golfinhos", "Para pegar o avião"], answer: 1, explain: "They are waiting for the dolphins (à espera dos golfinhos), which arrive at the end." }
writing:
  - task: "A friend is going to Lisbon. Compare Brazilian and European Portuguese for them: vocabulary, pronunciation and forms of address."
    min: 80
    max: 140
    use: [w.autocarro, w.comboio, w.telemóvel, w.pequeno-almoço, w.sotaque]
    useAtLeast: 3
    grammar: [g.lusophone-varieties, g.address-across-lusophone]
    expect:
      - { pattern: '(autocarro|comboio|telem[oó]vel|pequeno-almo[cç]o|casa de banho|frigor[ií]fico)', hint: "Give some European words: autocarro, comboio, telemóvel…" }
      - { pattern: '\b(em portugal|os portugueses|no brasil|os brasileiros)\b', hint: "Compare the two: No Brasil… / Em Portugal…" }
    model: { es: "Você vai adorar Lisboa, mas prepare-se para algumas diferenças! Em Portugal, o ônibus é o autocarro, o trem é o comboio e o celular é o telemóvel. O café da manhã se chama pequeno-almoço. O sotaque também é bem diferente: os portugueses quase não falam algumas vogais, então no começo vai ser difícil entender. Além disso, em Portugal se usa muito tu entre amigos. Com pessoas mais velhas, use sempre o senhor ou a senhora. E não se assuste: o português de Portugal é a mesma língua, só com outra música.", en: "You'll love Lisbon, but get ready for some differences! In Portugal the bus is the autocarro, the train is the comboio and the mobile phone is the telemóvel. Breakfast is called pequeno-almoço. The accent is also very different: the Portuguese hardly say some vowels, so at first it'll be hard to understand. Also, in Portugal people use tu a lot between friends. With older people, always use o senhor or a senhora. And don't panic: Portugal's Portuguese is the same language, just with a different tune." }
  - task: "Write a short paragraph about Portuguese in Africa and Asia: where it is spoken, how it varies and which other languages live alongside it."
    min: 80
    max: 140
    use: [w.língua-oficial, w.língua-materna, w.bilíngue, w.crioulo, w.lusofonia]
    useAtLeast: 3
    grammar: [g.lusophone-varieties]
    expect:
      - { pattern: '(angola|mo[cç]ambique|cabo verde|guin[eé]|s[aã]o tom[eé]|timor|macau)', hint: "Name some Lusophone countries: Angola, Moçambique, Cabo Verde…" }
      - { pattern: '\b(l[ií]ngua oficial|l[ií]ngua materna|bil[ií]ngues?|crioulo)\b', hint: "Use the key terms: língua oficial, língua materna, bilíngue, crioulo." }
    model: { es: "O português é a língua oficial de nove países, e a lusofonia está presente em quatro continentes. Em Angola e em Moçambique, muitas pessoas são bilíngues: falam português e uma língua africana, que muitas vezes é a sua língua materna. Em Cabo Verde, além do português, fala-se crioulo, uma língua que nasceu do contato entre o português e as línguas africanas. Em Timor-Leste, o português divide espaço com outras línguas locais. Cada variedade tem o seu sotaque e as suas próprias palavras.", en: "Portuguese is the official language of nine countries, and the Lusophone world spans four continents. In Angola and Mozambique many people are bilingual: they speak Portuguese and an African language, which is often their mother tongue. In Cape Verde, besides Portuguese, people speak Creole, a language born of contact between Portuguese and African languages. In East Timor, Portuguese shares space with other local languages. Each variety has its own accent and its own words." }
  - task: "Write short greetings to three people, adapting the form of address: a Portuguese colleague in Lisbon (tu), an older Brazilian lady (a senhora) and a young friend in Maputo."
    min: 80
    max: 140
    use: [w.tu, w.connosco, w.a-senhora, w.contigo, w.teu]
    useAtLeast: 3
    grammar: [g.address-across-lusophone]
    expect:
      - { pattern: '\b(tu|contigo|connosco|queres|est[aá]s|vens|teu|tua)\b', hint: "Use tu forms where they're natural: Queres…?, contigo, Como estás?" }
      - { pattern: '\b(o senhor|a senhora)\b', hint: "Use o senhor / a senhora for respect." }
    model: { es: "Para o meu colega de Lisboa: Olá, João! Então, está tudo bem contigo? Queres jantar connosco no sábado? Diz-me qualquer coisa. Para a Dona Marta, em Fortaleza: Bom dia, Dona Marta! Como vai a senhora? A senhora recebeu as fotos da festa? Um grande abraço. Para a minha amiga de Maputo: Olá, Lurdes! Como estás? Tu vens à praia amanhã? Fico à espera da tua resposta. Beijinhos! Em Moçambique, como em Portugal, o tu é muito comum entre amigos, mas no Brasil a gente prefere você.", en: "To my colleague in Lisbon: Hi, João! So, is everything OK with you? Do you want to have dinner with us on Saturday? Let me know. To Dona Marta in Fortaleza: Good morning, Dona Marta! How are you? Did you get the photos from the party? A big hug. To my friend in Maputo: Hi, Lurdes! How are you? Are you coming to the beach tomorrow? I'm waiting for your reply. Kisses! In Mozambique, as in Portugal, tu is very common between friends, but in Brazil we prefer você." }
  - task: "Explain to another learner the main spelling changes of the Acordo Ortográfico and the differences that remain between Brazil and Portugal, with examples."
    min: 80
    max: 150
    use: [w.acordo-ortográfico, w.acento, w.consoante, w.hífen, w.grafia]
    useAtLeast: 3
    grammar: [g.spelling-agreement]
    expect:
      - { pattern: '\b(acordo ortogr[aá]fico|acento|consoantes?|h[ií]fen|grafia)\b', hint: "Use the key terms: acento, consoante, hífen, grafia…" }
      - { pattern: '\b(por exemplo|como em|como)\b', hint: "Give examples: por exemplo, …" }
    model: { es: "Desde o Acordo Ortográfico, o Brasil e Portugal escrevem de forma mais parecida, mas ainda há diferenças. Em primeiro lugar, algumas palavras perderam o acento nos dois países: hoje se escreve ideia e voo sem acento. Em segundo lugar, Portugal deixou de escrever muitas consoantes que não se ouvem, como em ação e ótimo, que agora têm a mesma grafia nos dois lados do oceano. Além disso, o uso do hífen mudou. No entanto, a pronúncia continua diferente e, por isso, alguns acentos também.", en: "Since the Spelling Agreement, Brazil and Portugal write in a more similar way, but there are still differences. Firstly, some words lost their accent in both countries: today ideia and voo are written without an accent. Secondly, Portugal stopped writing many consonants that aren't heard, as in ação and ótimo, which now have the same spelling on both sides of the ocean. Also, the use of the hyphen has changed. However, pronunciation is still different and, for that reason, so are some accents." }
