  - id: a2.u12.l4
    title: 你個週末點呀？
    teach: [g.ji-cin-ji-hau, g.zau-then]
    tip: "Say how you felt and why: 考試之前好緊張, 見到佢之後好開心. Feelings are adjectives, used straight after 好: 我好失望."
    vocab: [w.soeng1-sam1, w.gan2-zoeng1, w.hing1-fan5, w.sat1-mong6, w.fong3-sam1, w.mun5-ji3, w.zik6-mok6, w.oi3, w.zang1, w.kei4-gwaai3, w.zung6-jiu3, w.jau5-jung6, w.gaan2-daan1, w.fuk1-zaap6, w.sing2-muk6, w.ceon2, w.so4, w.paa3-cau2, w.sai3-sam1, w.jau5-sin6, w.pei4-hei3]
    sentences:
