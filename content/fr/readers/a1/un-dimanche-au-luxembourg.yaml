id: r.a1.un-dimanche-au-luxembourg
level: a1
title: Un dimanche au Luxembourg
kind: text
intro: Anne describes a Sunday with her children in the Luxembourg Gardens, where Parisians come to relax, play and sail little boats on the pond.
allow: [hugo, lily, centre]
paragraphs:
  - { es: "Aujourd'hui, c'est dimanche. Il fait beau et il fait chaud : il y a du soleil et il fait vingt-cinq degrés. Avec mes enfants, Hugo et Lily, nous allons au jardin du Luxembourg. C'est un grand parc au centre de Paris, et c'est notre jardin préféré.", en: "Today is Sunday. The weather is nice and it's hot: it's sunny and twenty-five degrees. With my children, Hugo and Lily, we're going to the Luxembourg Gardens. It's a big park in the centre of Paris, and it's our favourite garden." }
  - { es: "Dans le jardin, il y a des arbres, des fleurs et beaucoup de chaises vertes. Il y a aussi un palais : c'est le Sénat. Le dimanche, les Parisiens viennent ici pour se promener, lire, parler ou dormir au soleil.", en: "In the garden there are trees, flowers and lots of green chairs. There's also a palace: it's the Senate. On Sundays Parisians come here to go for a walk, read, talk or sleep in the sun." }
  - { es: "Au centre du jardin, il y a un grand bassin. Les enfants louent de petits bateaux et ils jouent avec un long bâton. Hugo a huit ans. Il choisit un bateau rouge. Lily a cinq ans et elle préfère le bateau bleu. Les bateaux traversent le bassin avec le vent. Les enfants courent autour du bassin et ils crient : « Vite, vite, mon bateau ! »", en: "In the centre of the garden there's a big pond. Children rent little boats and play with a long stick. Hugo is eight. He chooses a red boat. Lily is five and she prefers the blue boat. The boats cross the pond with the wind. The children run around the pond and shout: 'Quick, quick, my boat!'" }
  - { es: "Moi, je prends une chaise verte et je lis un livre. Il y a des gens qui jouent au tennis, des gens qui courent et des musiciens qui jouent du violon. Un monsieur chante sous un arbre. C'est très agréable.", en: "I take a green chair and read a book. There are people playing tennis, people running and musicians playing the violin. A man is singing under a tree. It's very pleasant." }
  - { es: "À une heure, nous mangeons sur les chaises vertes, comme beaucoup de Parisiens. Nous avons des sandwichs, des fruits et de l'eau. Ensuite, les enfants veulent une glace. Hugo prend une glace au chocolat et Lily une glace à la fraise.", en: "At one o'clock we eat on the green chairs, like lots of Parisians. We have sandwiches, fruit and water. Then the children want an ice cream. Hugo has a chocolate ice cream and Lily a strawberry one." }
  - { es: "Vers cinq heures, le temps change. Il y a des nuages et du vent. Il ne fait pas froid, mais il commence à pleuvoir. Vite ! Nous n'avons pas de parapluie. Nous courons au métro. Les enfants sont fatigués, mais très contents. Hugo demande : « On revient dimanche prochain ? » Bien sûr !", en: "Around five o'clock the weather changes. There are clouds and wind. It isn't cold, but it starts to rain. Quick! We haven't got an umbrella. We run to the metro. The children are tired but very happy. Hugo asks: 'Shall we come back next Sunday?' Of course!" }
questions:
  - { q: "Quel temps fait-il le matin ?", options: ["Il pleut", "Il fait beau et chaud", "Il fait froid"], answer: 1, explain: "«Il fait beau et il fait chaud : il y a du soleil et il fait vingt-cinq degrés.»" }
  - { q: "Qu'est-ce qu'il y a dans le jardin ?", options: ["Le Sénat", "La tour Eiffel", "Notre-Dame"], answer: 0, explain: "«Il y a aussi un palais : c'est le Sénat.»" }
  - { q: "Que font les enfants au bassin ?", options: ["Ils nagent", "Ils jouent avec de petits bateaux", "Ils jouent au football"], answer: 1, explain: "«Les enfants louent de petits bateaux.» Hugo chooses a red one, Lily a blue one." }
  - { q: "Où mangent-ils ?", options: ["Sur l'herbe", "Au restaurant", "Sur les chaises"], answer: 2, explain: "«Nous mangeons sur les chaises vertes, comme beaucoup de Parisiens.»" }
  - { q: "Pourquoi courent-ils au métro ?", options: ["Il pleut et ils n'ont pas de parapluie", "Ils sont en retard", "Il fait trop chaud"], answer: 0, explain: "«Il commence à pleuvoir. Vite ! Nous n'avons pas de parapluie.»" }
glossary:
  - { es: bassin, en: "pond, ornamental lake" }
  - { es: bâton, en: stick }
  - { es: autour, en: around }
  - { es: crient, en: shout }
  - { es: gens, en: people }
  - { es: musiciens, en: musicians }
  - { es: agréable, en: pleasant }
  - { es: palais, en: palace }
  - { es: fraise, en: strawberry }
  - { es: "bien sûr", en: of course }
