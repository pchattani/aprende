id: r.b1.kayaking-in-sai-kung
level: b1
title: 去西貢玩獨木舟
kind: dialogue
intro: Ah Si and Kelvin plan a kayaking trip in Sai Kung to see the hexagonal rock columns. They weigh up the weather, the risks and what to do if things go wrong - and then the day itself does not go quite to plan.
allow: [阿詩]
paragraphs:
  - { es: "阿詩：「Kelvin，聽日星期六，不如我哋去西貢玩獨木舟？我好想去睇萬宜水庫附近嗰啲六角形石柱。」Kelvin：「好呀！不過我未玩過獨木舟，如果我跌落水點算呀？」阿詩：「唔使驚，我哋會着救生衣。而且有教練帶隊，就算你唔識游水都冇問題。」", en: "Ah Si: \"Kelvin, tomorrow's Saturday. Why don't we go kayaking in Sai Kung? I really want to see those hexagonal rock columns near High Island Reservoir.\" Kelvin: \"Sure! But I've never been kayaking. What if I fall in the water?\" Ah Si: \"Don't worry, we'll wear life jackets. And there's an instructor leading the group, so it's fine even if you can't swim.\"" }
  - { es: "Kelvin：「啲石柱點解係六角形㗎？係咪人整嘅？」阿詩：「唔係呀，係天然嘅。大概一億四千萬年前，嗰度有火山爆發，啲熔岩慢慢凍咗之後就變成一條條六角形嘅石柱。而家嗰度係聯合國教科文組織世界地質公園嘅一部分。」Kelvin：「嘩，你好似導遊噉。」", en: "Kelvin: \"Why are the columns hexagonal? Are they man-made?\" Ah Si: \"No, they're natural. About a hundred and forty million years ago there was a volcanic eruption there, and as the lava slowly cooled it formed hexagonal columns. Now the area is part of a UNESCO Global Geopark.\" Kelvin: \"Wow, you sound like a tour guide.\"" }
  - { es: "Kelvin：「天氣點呀？如果落雨，我哋仲去唔去？」阿詩：「天文台話聽日天晴，不過下晝有機會有驟雨。如果早上天氣好，我哋就照去；如果有雷暴警告，教練會取消，到時我哋就改去西貢市中心食海鮮。」Kelvin：「好，噉就唔會嘥咗一日。」", en: "Kelvin: \"What's the weather going to be like? If it rains, are we still going?\" Ah Si: \"The Observatory says it'll be sunny tomorrow, but there may be showers in the afternoon. If the weather's fine in the morning, we'll go as planned; if there's a thunderstorm warning, the instructor will cancel, and then we'll go and eat seafood in Sai Kung town instead.\" Kelvin: \"OK, so either way the day won't be wasted.\"" }
  - { es: "阿詩：「記住帶防曬、帽同兩支水。海上面冇地方遮，好易曬傷，仲可能會中暑。」Kelvin：「明白。我要唔要帶手機呀？如果跌咗落水就慘喇。」阿詩：「帶啦，萬一有咩事都可以求救。你用個防水袋裝住佢就得。」", en: "Ah Si: \"Remember to bring sunscreen, a hat and two bottles of water. There's no shade out on the sea; it's easy to get sunburnt, and you might even get heatstroke.\" Kelvin: \"Got it. Should I bring my phone? If it falls in the water, that'd be a disaster.\" Ah Si: \"Bring it. In case anything happens, you can call for help. Just put it in a waterproof bag.\"" }
  - { es: "第二日朝早，天氣好好，海水好清。佢哋同教練同另外六個人一齊出發。Kelvin一開始划得好慢，隻獨木舟成日轉圈，大家都笑佢。划咗半個鐘，佢終於學識，越划越快。", en: "The next morning the weather was lovely and the sea was very clear. They set off with the instructor and six other people. At first Kelvin paddled very slowly and his kayak kept going round in circles, and everyone laughed at him. After half an hour of paddling he finally got the hang of it and went faster and faster." }
  - { es: "一個鐘之後，佢哋終於見到啲石柱。一條條灰色嘅石柱由海邊企起身，好似一排排好高嘅鉛筆，好壯觀。Kelvin睇到唔記得划，阿詩就喺隔籬不停影相。教練話：「呢度嘅石柱喺世界上都好少見，大家要保護佢，唔好爬上去，亦唔好留低垃圾。」", en: "An hour later they finally saw the columns. Grey columns rose up from the shore, like row upon row of very tall pencils - a magnificent sight. Kelvin was so absorbed that he forgot to paddle, while Ah Si took photo after photo beside him. The instructor said: \"Columns like these are rare anywhere in the world. Everyone should protect them: don't climb on them, and don't leave any rubbish behind.\"" }
  - { es: "返去嘅時候，天突然變黑，開始落雨。教練叫大家跟緊佢，靠住海邊划。雨越落越大，Kelvin好緊張，但係佢記住教練講嘅嘢，慢慢划返去碼頭。返到岸上，兩個人成身濕晒。", en: "On the way back, the sky suddenly went dark and it started to rain. The instructor told everyone to stay close to him and paddle along the shore. The rain got heavier and heavier and Kelvin was very nervous, but he remembered what the instructor had said and paddled slowly back to the pier. When they got back to land, both of them were soaked through." }
  - { es: "阿詩：「對唔住，我話天氣會好㗎……」Kelvin笑住話：「唔緊要！如果唔係場雨，我都唔知自己咁勁。行，我哋照計劃去食海鮮，今次我請！」", en: "Ah Si: \"Sorry, I said the weather would be good...\" Kelvin laughed: \"Never mind! If it weren't for the rain, I wouldn't have known I was this tough. Come on, let's go for seafood as planned. This time it's my treat!\"" }
questions:
  - { q: "Kelvin一開始擔心乜嘢？", options: ["跌落水", "冇錢", "迷路"], answer: 0, explain: "如果我跌落水點算呀？" }
  - { q: "啲六角形石柱係點樣嚟㗎？", options: ["人整嘅", "火山爆發之後熔岩凍咗形成", "海水沖出嚟"], answer: 1, explain: "火山爆發，啲熔岩慢慢凍咗之後就變成…六角形嘅石柱." }
  - { q: "如果有雷暴警告，佢哋會做乜嘢？", options: ["照去玩獨木舟", "改去西貢市中心食海鮮", "返屋企瞓覺"], answer: 1, explain: "教練會取消，到時我哋就改去西貢市中心食海鮮." }
  - { q: "點解阿詩叫Kelvin帶手機？", options: ["方便影相", "萬一有事可以求救", "聽歌"], answer: 1, explain: "萬一有咩事都可以求救." }
  - { q: "教練叫大家點樣保護石柱？", options: ["唔好爬上去，唔好留低垃圾", "唔好影相", "唔好大聲講嘢"], answer: 0, explain: "唔好爬上去，亦唔好留低垃圾." }
  - { q: "最後邊個請食海鮮？", options: ["阿詩", "Kelvin", "教練"], answer: 1, explain: "Kelvin says 今次我請！" }
