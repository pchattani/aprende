id: r.b2.climbing-to-the-big-buddha
level: b2
title: 上昂坪睇大佛
kind: text
intro: Ana spends a weekend on Lantau with Mandy - a night hike up Lantau Peak, sunrise at the summit, then the Big Buddha and Po Lin Monastery at Ngong Ping. She reflects on how the place changed her mood.
paragraphs:
  - { es: "嚟咗香港差唔多一年，我一直想去大嶼山睇天壇大佛。Mandy話：「淨係睇大佛好普通啫，要去就去盡啲，我哋半夜行上鳳凰山睇日出，然後先落昂坪。」我聽到要半夜行山，有啲腳軟，但係最後都係答應咗。", en: "I'd been in Hong Kong for nearly a year and had always wanted to go to Lantau to see the Big Buddha. Mandy said: \"Just seeing the Buddha is pretty ordinary. If we're going, let's go all out: we'll hike up Lantau Peak in the middle of the night to watch the sunrise, and then come down to Ngong Ping.\" When I heard we'd be hiking in the middle of the night my legs went weak, but in the end I agreed." }
  - { es: "鳳凰山有九百三十四米高，係香港第二高嘅山。我哋凌晨兩點由伯公坳出發，一路上全部都係樓梯，越行越斜。行到一半，我已經喘到講唔到嘢，Mandy就喺前面不斷鼓勵我：「就嚟到喇，再堅持多陣！」佢講咗十次「就嚟到」，我哋先真係到咗山頂。", en: "Lantau Peak is 934 metres high, the second-highest mountain in Hong Kong. We set off from Pak Kung Au at two in the morning, and the whole way was steps, getting steeper and steeper. Halfway up I was so out of breath I couldn't speak, while Mandy kept encouraging me from in front: \"We're nearly there, just keep going a bit longer!\" She said \"nearly there\" ten times before we really reached the top." }
  - { es: "山頂好凍，風又大，不過當太陽由海上面慢慢升起，成個天變成金黃色，我即刻唔記得晒啲辛苦。由山頂望落去，可以睇到昂坪嘅大佛細細粒噉坐喺山中間，旁邊係機場同港珠澳大橋。嗰一刻，我覺得自己好細，但係心入面好平靜。", en: "It was cold and windy at the top, but when the sun slowly rose out of the sea and the whole sky turned golden, I immediately forgot all the hard work. Looking down from the summit, you could see the Big Buddha at Ngong Ping, sitting tiny among the hills, with the airport and the Hong Kong-Zhuhai-Macao Bridge beside it. At that moment I felt very small, but very calm inside." }
  - { es: "落山之後，我哋行咗去昂坪。天壇大佛喺一九九三年開光，連底座有三十四米高，係用青銅整嘅。想近距離睇大佛，要行二百六十八級樓梯。我啱啱先行完成座山，見到呢啲樓梯差啲想喊。Mandy笑我：「你頭先咁辛苦都行得上山頂，呢度小意思啦！」", en: "After coming down the mountain, we walked to Ngong Ping. The Big Buddha was consecrated in 1993; with its base it's 34 metres tall, and it's made of bronze. To see the Buddha up close you have to climb 268 steps. Having just climbed a whole mountain, I nearly cried when I saw those steps. Mandy laughed at me: \"You managed the summit despite all that effort - this is nothing!\"" }
  - { es: "行到上面，大佛比我想像中仲要壯觀。佢一隻手舉起，好似喺度同所有人講：「唔使驚。」周圍有好多遊客影相，亦有人靜靜雞喺度合埋眼祈福。Mandy話，好多香港人遇到困難嘅時候都會嚟呢度，唔一定係信佛，只係想搵個地方靜一靜。", en: "At the top, the Buddha was even more magnificent than I'd imagined. One hand is raised, as if telling everyone: \"Don't be afraid.\" Around us many tourists were taking photos, and some people were quietly praying with their eyes closed. Mandy said lots of Hongkongers come here when they're going through hard times - not necessarily because they're Buddhist, but just to find somewhere to be still for a while." }
  - { es: "大佛對面就係寶蓮寺。寶蓮寺一九零六年由三位和尚創立，以前好細，而家已經變成一間好大嘅寺廟。我哋喺寺入面食咗一餐齋，有素鵝、羅漢齋同齋湯麵。我以前覺得齋菜一定好淡，點知原來咁好味。食完之後，我哋仲去咗附近嘅心經簡林，嗰度有三十八條刻咗心經嘅木柱，排成一個「∞」字形。", en: "Opposite the Buddha is Po Lin Monastery. It was founded in 1906 by three monks; it used to be tiny and is now a huge monastery. We had a vegetarian meal inside: mock goose, Buddha's delight and vegetarian noodle soup. I used to think vegetarian food must be bland, but it turned out to be delicious. Afterwards we visited the nearby Wisdom Path, which has thirty-eight wooden pillars carved with the Heart Sutra, arranged in a figure of eight." }
  - { es: "返程我哋坐昂坪纜車落東涌。纜車行咗大概二十五分鐘，腳下面係山同海。我攰到差啲瞓着，但係心情好好。我發覺，以前我成日覺得自己好忙，要趕呢樣趕嗰樣，原來偶然停一停，行吓山、睇吓日出，就會覺得好多事其實冇咁緊要。", en: "For the way back we took the Ngong Ping cable car down to Tung Chung. The ride took about twenty-five minutes, with mountains and sea beneath our feet. I was so tired I almost fell asleep, but I was in a great mood. I realised that I used to feel I was always so busy, rushing to do this and that, but if you stop once in a while, go for a hike and watch a sunrise, you find a lot of things don't really matter that much." }
  - { es: "落到纜車，Mandy問我：「點呀？值唔值得半夜起身呀？」我話：「值得！不過下次可唔可以坐纜車上，行路落？」Mandy：「你諗吓啦，大佛都話唔使驚㗎！」", en: "When we got off the cable car, Mandy asked me: \"So? Was it worth getting up in the middle of the night?\" I said: \"Definitely! But next time could we take the cable car up and walk down?\" Mandy: \"Dream on - the Buddha told you not to be afraid!\"" }
questions:
  - { q: "鳳凰山有幾高？", options: ["九百三十四米", "九百五十七米", "三十四米"], answer: 0, explain: "鳳凰山有九百三十四米高，係香港第二高嘅山. 34 m is the Buddha with its base." }
  - { q: "Mandy講咗幾多次「就嚟到」？", options: ["一次", "三次", "十次"], answer: 2, explain: "佢講咗十次「就嚟到」，我哋先真係到咗山頂." }
  - { q: "要行幾多級樓梯先可以近距離睇大佛？", options: ["一百級", "二百六十八級", "九百三十四級"], answer: 1, explain: "要行二百六十八級樓梯." }
  - { q: "Mandy話好多香港人點解嚟大佛？", options: ["一定係信佛", "想搵個地方靜一靜", "想食齋"], answer: 1, explain: "唔一定係信佛，只係想搵個地方靜一靜." }
  - { q: "寶蓮寺係幾時創立？", options: ["一九零六年", "一九九三年", "二零零六年"], answer: 0, explain: "寶蓮寺一九零六年由三位和尚創立. 1993 is when the Buddha was consecrated." }
  - { q: "Ana下次想點樣去？", options: ["坐纜車上，行路落", "行路上，坐纜車落", "坐巴士"], answer: 0, explain: "下次可唔可以坐纜車上，行路落？" }
