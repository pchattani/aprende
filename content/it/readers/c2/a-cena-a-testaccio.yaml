id: r.c2.a-cena-a-testaccio
level: c2
title: A cena a Testaccio
kind: dialogue
intro: "Back in Rome at the end of the journey: Emma, an English translator who has spent a year studying Italian, has dinner in a Testaccio trattoria with her friend Giulia and Giulia's grandfather Sandro. Three generations, three Italians: Sandro's romanesco, Giulia's youth slang and Emma's careful standard. Notice how they switch register, and the fillers of c2.u08 (cioè, tipo, voglio dire, hai presente)."
allow: [testaccio, emma, giulia, sandro, roma, romanista, laziale, olimpico, alberto, sordi, belli, trilussa, aò, nun, er, de, te, sto, ce, quer, mo, pe]
paragraphs:
  - { es: "Sandro: Aò, Giulia, ma questa è l'amica tua inglese? Anvedi come parla bene! Ma che, sei nata a Roma e nun ce l'hai detto?", en: "Sandro: Hey, Giulia, so this is your English friend? Look how well she speaks! What, were you born in Rome and didn't tell us?" }
  - { es: "Emma: Magari! Sono di Manchester. Però vivo qui da un anno e cerco di ascoltare il più possibile. Il romanesco, per esempio, lo capisco quasi tutto. Parlarlo è un'altra storia.", en: "Emma: I wish! I'm from Manchester. But I've lived here for a year and I try to listen as much as possible. Romanesco, for example, I understand almost all of it. Speaking it is another story." }
  - { es: "Giulia: Nonno, non farla sclerare subito, eh. Cioè, è appena arrivata. Emma, comunque, tranquilla: il nonno parla così con tutti, pure col medico.", en: "Giulia: Grandad, don't drive her crazy straight away. I mean, she's only just arrived. Emma, anyway, don't worry: Grandad talks like that to everyone, even the doctor." }
  - { es: "Sandro: E come devo parlà? Io so' nato a Testaccio, qua dietro, quando ancora c'era er mattatoio. Mi padre ce lavorava. Allora qui se magnava la coda alla vaccinara perché era la carne che costava meno, mica pe' moda. Mo' vengono i turisti da tutto er mondo a mangiarla e la pagano come se fosse caviale.", en: "Sandro: And how am I supposed to talk? I was born in Testaccio, just round the corner, when the slaughterhouse was still here. My father worked there. Back then people ate oxtail stew here because it was the cheapest meat, not because it was trendy. Now tourists come from all over the world to eat it and pay for it as if it were caviar." }
  - { es: "Emma: È curioso, perché in inglese succede una cosa simile con la lingua. Le parole dei quartieri popolari diventano di moda, finiscono nelle pubblicità, e alla fine le usano tutti senza sapere da dove vengono.", en: "Emma: It's funny, because something similar happens with language in English. Words from working-class neighbourhoods become fashionable, end up in adverts, and in the end everyone uses them without knowing where they come from." }
  - { es: "Giulia: Tipo «daje», no? Ormai lo dicono pure a Milano. L'altro giorno l'ho sentito in una pubblicità di una banca. Una banca, capito? Che cringe.", en: "Giulia: Like 'daje', right? These days they even say it in Milan. The other day I heard it in a bank advert. A bank, get it? So cringe." }
  - { es: "Sandro: E che c'è de male? «Daje» è 'na bella parola. Vuol dire coraggio, forza, andiamo. Quando la Roma segna, all'Olimpico, nessuno grida «suvvia, proseguiamo». Grida «daje!».", en: "Sandro: And what's wrong with that? 'Daje' is a lovely word. It means come on, keep going, let's go. When Roma score at the Olimpico, nobody shouts 'come along, let us proceed'. They shout 'daje!'" }
  - { es: "Emma: Questa me la segno, è perfetta per una lezione sul registro. A proposito, Giulia, l'altro giorno mi hai detto che una festa era «a bomba» e io ho pensato che fosse successo qualcosa di grave.", en: "Emma: I'm writing that one down, it's perfect for a lesson on register. By the way, Giulia, the other day you told me a party was 'a bomba' and I thought something terrible had happened." }
  - { es: "Giulia: Ahahah, no! Vuol dire che era bellissima, una figata. Il problema è che lo slang cambia velocissimo. Quello che dicevo al liceo, adesso, se lo dico, i miei cugini piccoli mi guardano come se fossi una boomer.", en: "Giulia: Hahaha, no! It means it was fantastic, amazing. The problem is that slang changes really fast. If I say the things I used to say at school now, my younger cousins look at me as if I were a boomer." }
  - { es: "Sandro: Ecco, vedi? Il romanesco invece resta. Il Belli scriveva i sonetti duecento anni fa e certe parole le usiamo ancora uguali. «Caciara», «pischello», «sòla»... Emma, lo sai che vor dì «sòla»?", en: "Sandro: There, you see? Romanesco, on the other hand, lasts. Belli wrote his sonnets two hundred years ago and we still use some of the words in exactly the same way. 'Caciara', 'pischello', 'sòla'... Emma, do you know what 'sòla' means?" }
  - { es: "Emma: Una fregatura, un inganno. Tipo quando un ristorante per turisti ti fa pagare trenta euro per una carbonara surgelata. Voglio dire, non questo ristorante, ovviamente!", en: "Emma: A rip-off, a con. Like when a tourist restaurant charges you thirty euros for a frozen carbonara. I mean, not this restaurant, obviously!" }
  - { es: "Sandro: Ammazza, questa è più romana de me! Giulia, tienitela stretta, 'st'amica tua.", en: "Sandro: Blimey, she's more Roman than I am! Giulia, hang on to this friend of yours." }
  - { es: "Giulia: Infatti. E sai qual è la cosa assurda? Emma conosce parole italiane che io non ho mai sentito. L'altro giorno ha usato «ineluttabile» in una conversazione normale. Io l'avevo letta solo nei temi di maturità.", en: "Giulia: Exactly. And do you know what's crazy? Emma knows Italian words I've never heard. The other day she used 'ineluttabile' in a normal conversation. I'd only ever read it in final-exam essays." }
  - { es: "Emma: È il destino dei traduttori: conosciamo le parole difficili e sbagliamo quelle facili. Ieri ho chiesto al fornaio «un pezzo di pizza bianca» e lui mi ha corretto: qui si dice «un pezzo de bianca», e basta.", en: "Emma: It's the fate of translators: we know the difficult words and get the easy ones wrong. Yesterday I asked the baker for 'un pezzo di pizza bianca' and he corrected me: here you say 'un pezzo de bianca', and that's it." }
  - { es: "Sandro: E de traduzioni che me dici? Come se dice «abbiocco» in inglese? Hai presente, quando dopo pranzo te viene un sonno che nun c'è verso de resiste.", en: "Sandro: And what about translations? How do you say 'abbiocco' in English? You know, when after lunch you get so sleepy there's no way to fight it." }
  - { es: "Emma: Ecco, appunto: non c'è una parola sola. Dovrei scrivere qualcosa come «la sonnolenza che ti prende dopo un pranzo abbondante», e la battuta muore. Tradurre è sempre un po' tradire, come dite voi.", en: "Emma: Exactly: there isn't a single word. I'd have to write something like 'the drowsiness that comes over you after a big lunch', and the joke dies. Translating is always a bit like betraying, as you say." }
  - { es: "Giulia: Vabbè, ma questo vale per tutto. Prova a spiegare «scialla» a un inglese. Cioè, è tipo «chill», ma non proprio.", en: "Giulia: OK, but that goes for everything. Try explaining 'scialla' to an English person. I mean, it's like 'chill', but not quite." }
  - { es: "Sandro: Io nun so manco che vor dì «scialla». Però so che d'estate, la sera, quando arriva er ponentino e te magni 'na grattachecca sul lungotevere, quella è la cosa più bella der monno. E questo, cara Emma, nun se traduce in nessuna lingua.", en: "Sandro: I don't even know what 'scialla' means. But I do know that on summer evenings, when the ponentino breeze comes in and you eat a grattachecca on the Tiber embankment, that's the best thing in the world. And that, dear Emma, can't be translated into any language." }
  - { es: "Sandro: Ha ragione er fornaio. Ma nun te preoccupà: la lingua s'impara così, sbagliando e magnando. E mo' famo un brindisi. A Emma, che è venuta a Roma pe' imparà l'italiano e se n'è imparati due!", en: "Sandro: The baker's right. But don't you worry: that's how you learn a language, making mistakes and eating. And now let's drink a toast. To Emma, who came to Rome to learn Italian and has learned two of them!" }
  - { es: "Giulia: Daje!", en: "Giulia: Daje!" }
questions:
  - { q: "Perché Sandro parla della coda alla vaccinara?", options: ["Perché è il suo piatto preferito e lo cucina ogni domenica", "Per spiegare che un piatto povero dei lavoratori del mattatoio è diventato una moda costosa", "Perché il ristorante non ce l'ha"], answer: 1, explain: "«se magnava la coda alla vaccinara perché era la carne che costava meno, mica pe' moda. Mo' vengono i turisti… e la pagano come se fosse caviale»." }
  - { q: "Che paragone fa Emma tra il cibo e la lingua?", options: ["Le parole dei quartieri popolari diventano di moda e le usano tutti, come i piatti poveri", "In Inghilterra non esistono dialetti", "La cucina inglese è migliore di quella romana"], answer: 0, explain: "«Le parole dei quartieri popolari diventano di moda, finiscono nelle pubblicità, e alla fine le usano tutti»." }
  - { q: "Che cosa significa «a bomba» nel linguaggio giovanile?", options: ["Pericoloso", "Bellissimo, fantastico", "Rumoroso"], answer: 1, explain: "«Vuol dire che era bellissima, una figata» – c2.u07 youth slang." }
  - { q: "Secondo Sandro, che differenza c'è tra il romanesco e lo slang giovanile?", options: ["Il romanesco cambia più velocemente", "Lo slang cambia in fretta, mentre molte parole romanesche durano da secoli", "Non c'è nessuna differenza"], answer: 1, explain: "Giulia: «lo slang cambia velocissimo»; Sandro: «Il romanesco invece resta… il Belli scriveva i sonetti duecento anni fa»." }
  - { q: "Che cosa vuol dire Sandro con il brindisi «è venuta a Roma pe' imparà l'italiano e se n'è imparati due»?", options: ["Che Emma ha imparato l'italiano standard e il romanesco", "Che Emma parla due dialetti del Nord", "Che Emma ha sbagliato lingua"], answer: 0, explain: "A joke on register: Emma has learned both standard Italian and Roman speech. Note the romanesco forms: pe' (per), imparà (imparare)." }
