id: a2.u04
title: Contando histórias
lessons:
  - id: a2.u04.l1
    title: Era um domingo de sol
    teach: [g.preterite-vs-imperfect]
    vocab: [w.momento, w.naquele-momento, w.perder, w.achar, w.procurar, w.perceber, w.carteira, w.fila, w.cair, w.descobrir, w.susto, w.assustar-se, w.assustado, w.pedir-desculpas, w.desculpa.n]
    tip: "The imperfect paints the scene (Era domingo, fazia sol); the preterite moves the story on (De repente, eu caí)."
    sentences:
      - { es: "Era domingo e fazia sol no Ibirapuera.", en: "It was Sunday and it was sunny in Ibirapuera.", altEs: ["Era um domingo e fazia sol no Ibirapuera.", "Era domingo e fazia sol no Parque Ibirapuera."], grammar: [g.preterite-vs-imperfect, g.weather], vocab: [w.domingo, w.sol] }
      - { es: "Eu corria perto do lago quando perdi a chave de casa.", en: "I was running near the lake when I lost my house key.", altEs: ["Eu estava correndo perto do lago quando perdi a chave de casa.", "Eu corria perto do lago quando perdi a chave da casa."], grammar: [g.preterite-vs-imperfect], vocab: [w.correr, w.perder, w.chave], transform: { instruction: "Use estar + gerund for the background action", answer: "Eu estava correndo perto do lago quando perdi a chave de casa.", alt: ["Estava correndo perto do lago quando perdi a chave de casa."], en: "I was running near the lake when I lost my house key." } }
      - { es: "Procurei a chave por meia hora, mas não achei.", en: "I looked for the key for half an hour, but I didn't find it.", altEs: ["Procurei a chave durante meia hora, mas não achei.", "Procurei a chave por meia hora, mas não encontrei."], grammar: [g.preterite-regular], vocab: [w.procurar, w.achar] }
      - { es: "Naquele momento, percebi que a minha carteira também não estava no bolso.", en: "At that moment, I realised that my wallet wasn't in my pocket either.", altEs: ["Naquele momento, percebi que minha carteira também não estava no bolso."], grammar: [g.preterite-vs-imperfect], vocab: [w.naquele-momento, w.perceber, w.carteira, w.bolso] }
      - { es: "Que susto! Eu fiquei muito assustado.", en: "What a fright! I got really scared.", altEs: ["Que susto! Fiquei muito assustada.", "Que susto! Eu fiquei muito assustada."], grammar: [g.preterite-regular], vocab: [w.susto, w.assustado] }
      - { es: "Uma senhora viu tudo e me ajudou.", en: "A lady saw everything and helped me.", altEs: ["Uma senhora viu tudo e me deu uma ajuda."], grammar: [g.preterite-dar-ver-vir], vocab: [w.ver, w.ajudar] }
      - { es: "A carteira estava na grama, perto de uma árvore.", en: "The wallet was on the grass, near a tree.", grammar: [g.preterite-vs-imperfect], vocab: [w.carteira, w.grama, w.árvore] }
      - { es: "O menino caiu da bicicleta, mas não se machucou.", en: "The boy fell off his bike, but he didn't hurt himself.", altEs: ["O menino caiu da bicicleta mas não se machucou."], grammar: [g.preterite-regular], vocab: [w.cair, w.machucar-se, w.bicicleta], transform: { instruction: "Change to 'I'", answer: "Eu caí da bicicleta, mas não me machuquei.", alt: ["Caí da bicicleta, mas não me machuquei."], en: "I fell off my bike, but I didn't hurt myself." } }
      - { es: "Eu estava na fila do sorvete quando encontrei uma amiga da escola.", en: "I was in the ice-cream queue when I ran into a school friend.", altEs: ["Estava na fila do sorvete quando encontrei uma amiga da escola."], altEn: ["I was in line for ice cream when I bumped into a friend from school."], grammar: [g.preterite-vs-imperfect], vocab: [w.fila, w.encontrar] }
      - { es: "Ontem descobri que o parque tem vários museus.", en: "Yesterday I found out that the park has several museums.", altEs: ["Descobri ontem que o parque tem vários museus."], grammar: [g.preterite-regular], vocab: [w.descobrir, w.museu, w.vários] }
      - { es: "Ele pediu desculpas porque chegou atrasado.", en: "He apologised because he arrived late.", altEs: ["Ele pediu desculpa porque chegou atrasado."], grammar: [g.preterite-regular], vocab: [w.pedir-desculpas, w.atrasado] }
      - { es: "Eu me assustei com o barulho.", en: "The noise gave me a fright.", altEs: ["Me assustei com o barulho."], altEn: ["I got a fright from the noise."], grammar: [g.preterite-regular], vocab: [w.assustar-se, w.barulho] }
      - { es: "Desculpa, foi sem querer!", en: "Sorry, I didn't mean to!", altEs: ["Desculpe, foi sem querer!"], altEn: ["Sorry, it was an accident!"], grammar: [g.preterite-ser-ir], vocab: [w.desculpa.n], note: "sem querer = by accident, without meaning to." }
      - { es: "Eu conheci a Paula no Ibirapuera; eu já conhecia o irmão dela.", en: "I met Paula in Ibirapuera; I already knew her brother.", altEs: ["Conheci a Paula no Ibirapuera; já conhecia o irmão dela."], grammar: [g.preterite-vs-imperfect], vocab: [w.conhecer], note: "conheci = I met (for the first time); conhecia = I knew.", error: { wrong: "Eu conhecia a Paula no Ibirapuera; eu já conhecia o irmão dela.", explain: "Meeting someone for the first time is a completed event: conheci.", grammar: g.preterite-vs-imperfect } }
      - { es: "Fazia frio, então a gente voltou para casa mais cedo.", en: "It was cold, so we went home earlier.", altEs: ["Fazia frio, então nós voltamos para casa mais cedo.", "Estava frio, então a gente voltou pra casa mais cedo."], grammar: [g.preterite-vs-imperfect], vocab: [w.frio, w.voltar], error: { wrong: "Fez frio, então a gente voltou para casa mais cedo.", explain: "The weather is background here, so it takes the imperfect: fazia frio.", grammar: g.preterite-vs-imperfect } }
      - { es: "Eram três horas quando o show começou.", en: "It was three o'clock when the show started.", altEs: ["Eram três da tarde quando o show começou."], grammar: [g.preterite-vs-imperfect, g.telling-time], vocab: [w.show, w.começar] }
    exchanges:
      - q: { es: "O que aconteceu com você?", en: "What happened to you?" }
        a: { es: "Eu caí quando corria no parque.", en: "I fell while I was running in the park." }
        alt: ["Caí da bicicleta.", "Levei um susto.", "Caí no parque."]
        grammar: [g.preterite-vs-imperfect]
        vocab: [w.cair, w.correr]
      - q: { es: "Você achou a carteira?", en: "Did you find your wallet?" }
        a: { es: "Achei! Estava embaixo do banco.", en: "I did! It was under the bench." }
        alt: ["Ainda não.", "Não, perdi.", "Achei, sim."]
        grammar: [g.preterite-vs-imperfect]
        vocab: [w.achar, w.carteira]
      - q: { es: "Por que você ficou tão assustada?", en: "Why did you get so scared?" }
        a: { es: "Porque estava escuro e ouvi um barulho.", en: "Because it was dark and I heard a noise." }
        alt: ["Levei um susto.", "Por causa do barulho.", "Estava muito escuro."]
        grammar: [g.preterite-vs-imperfect]
        vocab: [w.assustado, w.barulho]
      - q: { es: "Quando você percebeu?", en: "When did you notice?" }
        a: { es: "No metrô, quando fui pagar a passagem.", en: "On the metro, when I went to pay the fare." }
        alt: ["Em casa.", "Logo depois.", "No metrô."]
        grammar: [g.preterite-regular]
        vocab: [w.perceber, w.passagem]
      - q: { es: "Ele pediu desculpas?", en: "Did he apologise?" }
        a: { es: "Pediu, sim. Disse que foi sem querer.", en: "Yes, he did. He said it was an accident." }
        alt: ["Não pediu.", "Pediu.", "Pediu mil desculpas."]
        grammar: [g.preterite-regular]
        vocab: [w.pedir-desculpas]
    texts:
      - title: "Domingo no parque"
        es: ["Era um domingo lindo no Ibirapuera.", "Muita gente corria e andava de bicicleta.", "Eu estava tranquila na grama quando uma bola caiu na minha cabeça!"]
        en: ["It was a lovely Sunday in Ibirapuera.", "Lots of people were running and cycling.", "I was relaxing on the grass when a ball landed on my head!"]
        grammar: [g.preterite-vs-imperfect]
        vocab: [w.cair, w.grama]
      - title: "Achados e perdidos"
        es: ["Perdi uma carteira preta ontem, perto do lago.", "Tinha documentos e uma foto do meu cachorro.", "Se você achou, por favor, me ligue!"]
        en: ["I lost a black wallet yesterday, near the lake.", "It had documents and a photo of my dog in it.", "If you've found it, please call me!"]
        grammar: [g.preterite-vs-imperfect]
        vocab: [w.perder, w.carteira, w.achar]
    spicy:
      - { es: "Eu procurava um banco livre. Achei você.", en: "I was looking for a free bench. I found you.", altEs: ["Eu estava procurando um banco livre. Achei você."], grammar: [g.preterite-vs-imperfect], vocab: [w.procurar, w.achar] }
      - { es: "Pensei que você tinha namorada. Que bom que eu estava errado!", en: "I thought you had a girlfriend. Good thing I was wrong!", altEs: ["Pensei que você tinha namorado. Que bom que eu estava errada!"], grammar: [g.preterite-vs-imperfect], vocab: [w.namorado, w.errado] }
      - { es: "Eu caí da bicicleta só para você me ajudar. Deu certo?", en: "I fell off my bike just so you'd help me. Did it work?", altEs: ["Caí da bicicleta só pra você me ajudar. Deu certo?"], grammar: [g.preterite-regular], vocab: [w.cair, w.ajudar] }
      - { es: "Naquele momento percebi: você dança muito melhor do que eu.", en: "At that moment I realised: you dance much better than me.", altEs: ["Naquele momento eu percebi: você dança muito melhor que eu."], grammar: [g.preterite-regular], vocab: [w.naquele-momento, w.perceber, w.dançar] }
      - { es: "Perdi a hora porque estava pensando em você.", en: "I overslept because I was thinking about you.", altEs: ["Perdi a hora porque eu estava pensando em você."], altEn: ["I lost track of time because I was thinking about you."], grammar: [g.preterite-vs-imperfect], vocab: [w.perder, w.pensar], note: "perder a hora = to oversleep, to lose track of time." }
  - id: a2.u04.l2
    title: Primeiro, depois, no final
    teach: [g.narration-connectors]
    vocab: [w.primeiro.adv, w.de-repente, w.finalmente, w.no-final, w.no-começo, w.era-uma-vez, w.um-dia, w.conto, w.aventura, w.por-isso, w.depois-disso, w.logo-depois, w.de-novo, w.outra-vez]
    tip: "primeiro → depois → logo depois → de repente → no final. In Brazil logo means 'soon, right away' (Volto logo!); for 'then' say depois."
    sentences:
      - { es: "Primeiro a gente foi ao museu, depois almoçou no parque.", en: "First we went to the museum, then we had lunch in the park.", altEs: ["Primeiro nós fomos ao museu, depois almoçamos no parque.", "Primeiro fomos ao museu e depois almoçamos no parque."], grammar: [g.narration-connectors], vocab: [w.primeiro.adv, w.depois, w.museu], error: { wrong: "Primeiro a gente foi ao museu, logo almoçou no parque.", explain: "In Brazil logo means 'soon, right away'; for 'then' use depois.", grammar: g.narration-connectors } }
      - { es: "De repente começou a chover.", en: "Suddenly it started to rain.", altEs: ["De repente, começou a chover."], grammar: [g.narration-connectors, g.preterite-vs-imperfect], vocab: [w.de-repente, w.chover], error: { wrong: "De repente começava a chover.", explain: "A sudden event is a completed action: começou.", grammar: g.preterite-vs-imperfect } }
      - { es: "Por isso, a gente correu para dentro do museu.", en: "That's why we ran into the museum.", altEs: ["Por isso, nós corremos para dentro do museu.", "Por isso a gente correu pra dentro do museu."], grammar: [g.narration-connectors], vocab: [w.por-isso, w.correr, w.dentro] }
      - { es: "Logo depois, o sol voltou.", en: "Right after that, the sun came back out.", altEs: ["Logo depois o sol voltou."], grammar: [g.narration-connectors], vocab: [w.logo-depois, w.sol] }
      - { es: "Depois disso, a gente tomou um sorvete.", en: "After that, we had an ice cream.", altEs: ["Depois disso, nós tomamos um sorvete."], grammar: [g.narration-connectors], vocab: [w.depois-disso, w.sorvete] }
      - { es: "No começo eu não gostava de São Paulo, mas no final mudei de ideia.", en: "At first I didn't like São Paulo, but in the end I changed my mind.", altEs: ["No começo, eu não gostava de São Paulo, mas no final mudei de ideia."], grammar: [g.narration-connectors, g.preterite-vs-imperfect], vocab: [w.no-começo, w.no-final, w.ideia] }
      - { es: "Finalmente chegamos ao parque!", en: "We finally got to the park!", altEs: ["Finalmente a gente chegou ao parque!", "Chegamos finalmente ao parque!"], altEn: ["At last we got to the park!"], grammar: [g.narration-connectors], vocab: [w.finalmente, w.parque] }
      - { es: "Era uma vez um menino que morava perto do lago.", en: "Once upon a time there was a boy who lived near the lake.", grammar: [g.narration-connectors, g.imperfect-uses], vocab: [w.era-uma-vez, w.menino, w.lago] }
      - { es: "Um dia, ele encontrou um mapa antigo.", en: "One day, he found an old map.", altEs: ["Um dia ele achou um mapa antigo."], grammar: [g.narration-connectors], vocab: [w.um-dia, w.mapa] }
      - { es: "Esse conto é do Machado de Assis.", en: "This short story is by Machado de Assis.", altEs: ["Este conto é do Machado de Assis."], grammar: [g.demonstratives], vocab: [w.conto] }
      - { es: "Foi uma grande aventura!", en: "It was a great adventure!", altEs: ["Que aventura!"], grammar: [g.preterite-ser-ir], vocab: [w.aventura] }
      - { es: "O ônibus atrasou de novo.", en: "The bus was late again.", altEs: ["O ônibus atrasou outra vez."], grammar: [g.narration-connectors], vocab: [w.de-novo, w.atrasar] }
      - { es: "Ela ligou outra vez, mas eu não atendi.", en: "She called again, but I didn't answer.", altEs: ["Ela ligou de novo, mas eu não atendi."], grammar: [g.narration-connectors], vocab: [w.outra-vez, w.atender] }
      - { es: "Primeiro tomei café, depois peguei o metrô e, no final, cheguei atrasado mesmo assim.", en: "First I had breakfast, then I took the metro and, in the end, I was late anyway.", altEs: ["Primeiro eu tomei café, depois peguei o metrô e no final cheguei atrasado mesmo assim.", "Primeiro tomei café, depois peguei o metrô e, no final, cheguei atrasada mesmo assim."], grammar: [g.narration-connectors], vocab: [w.primeiro.adv, w.no-final, w.mesmo-assim], transform: { instruction: "Change to 'we'", answer: "Primeiro tomamos café, depois pegamos o metrô e, no final, chegamos atrasados mesmo assim.", alt: ["Primeiro a gente tomou café, depois pegou o metrô e, no final, chegou atrasado mesmo assim.", "Primeiro nós tomamos café, depois pegamos o metrô e, no final, chegamos atrasados mesmo assim."], en: "First we had breakfast, then we took the metro and, in the end, we were late anyway." } }
      - { es: "Volto logo!", en: "I'll be right back!", altEs: ["Já volto!", "Volto já!"], grammar: [g.narration-connectors], vocab: [w.logo, w.voltar] }
      - { es: "Aí eu falei: chega!", en: "So I said: enough!", altEs: ["Então eu falei: chega!"], grammar: [g.narration-connectors], vocab: [w.aí], note: "aí = then, so: very common when telling a story out loud.", transform: { instruction: "Change to 'she'", answer: "Aí ela falou: chega!", alt: ["Então ela falou: chega!"], en: "So she said: enough!" } }
    exchanges:
      - q: { es: "E depois, o que aconteceu?", en: "And then what happened?" }
        a: { es: "Depois disso, a gente foi para casa.", en: "After that, we went home." }
        alt: ["Depois a gente voltou.", "Nada, fomos embora.", "Depois fomos para casa."]
        grammar: [g.narration-connectors]
        vocab: [w.depois-disso]
      - q: { es: "Como a história termina?", en: "How does the story end?" }
        a: { es: "No final, o menino volta para casa.", en: "In the end, the boy goes back home." }
        alt: ["Termina bem.", "No final, dá tudo certo.", "Termina feliz."]
        grammar: [g.narration-connectors]
        vocab: [w.no-final]
      - q: { es: "Você gostou do conto?", en: "Did you like the short story?" }
        a: { es: "Gostei! No começo é lento, mas depois fica ótimo.", en: "I did! It's slow at the beginning, but then it gets great." }
        alt: ["Adorei.", "Não muito.", "Gostei muito."]
        grammar: [g.narration-connectors]
        vocab: [w.conto, w.no-começo, w.lento]
      - q: { es: "Você vai demorar?", en: "Will you be long?" }
        a: { es: "Não, volto logo!", en: "No, I'll be right back!" }
        alt: ["Volto já.", "Cinco minutos.", "Não, já volto."]
        grammar: [g.narration-connectors]
        vocab: [w.logo, w.demorar]
      - q: { es: "Ela ligou de novo?", en: "Did she call again?" }
        a: { es: "Ligou! Pela terceira vez hoje.", en: "She did! For the third time today." }
        alt: ["Não.", "Ligou outra vez.", "Ligou, sim."]
        grammar: [g.narration-connectors]
        vocab: [w.de-novo, w.terceiro]
    texts:
      - title: "Um conto"
        es: ["Era uma vez um cachorro que morava no Parque Ibirapuera.", "Um dia, ele achou uma bola perto do lago.", "De repente, chegaram três crianças...", "No final, todos brincaram juntos."]
        en: ["Once upon a time there was a dog who lived in Ibirapuera Park.", "One day, he found a ball near the lake.", "Suddenly, three children came along...", "In the end, they all played together."]
        grammar: [g.narration-connectors]
        vocab: [w.era-uma-vez, w.um-dia, w.de-repente, w.no-final]
      - title: "Minha aventura"
        es: ["Primeiro, perdi o ônibus.", "Depois, começou a chover e eu não tinha guarda-chuva.", "Finalmente cheguei ao trabalho, molhado e atrasado!"]
        en: ["First, I missed the bus.", "Then it started raining and I didn't have an umbrella.", "I finally got to work, soaked and late!"]
        grammar: [g.narration-connectors]
        vocab: [w.primeiro.adv, w.finalmente, w.molhado]
    spicy:
      - { es: "Primeiro um café, depois um jantar... e no final, quem sabe?", en: "First a coffee, then dinner... and in the end, who knows?", altEs: ["Primeiro um café, depois um jantar... e, no final, quem sabe?"], grammar: [g.narration-connectors], vocab: [w.primeiro.adv, w.no-final] }
      - { es: "De repente, você sorriu e eu esqueci o meu nome.", en: "Suddenly you smiled and I forgot my own name.", altEs: ["De repente você sorriu e eu esqueci meu nome."], grammar: [g.narration-connectors], vocab: [w.de-repente, w.sorrir, w.esquecer] }
      - { es: "Era uma vez uma pessoa que não acreditava em encontros de aplicativo. Aí ela conheceu você.", en: "Once upon a time there was someone who didn't believe in app dates. Then they met you.", grammar: [g.narration-connectors, g.preterite-vs-imperfect], vocab: [w.era-uma-vez, w.encontro, w.aplicativo] }
      - { es: "Você me ligou de novo? Que bom, eu estava esperando.", en: "You called me again? Great, I was waiting.", altEs: ["Você me ligou outra vez? Que bom, eu estava esperando."], grammar: [g.narration-connectors], vocab: [w.de-novo, w.esperar] }
      - { es: "Finalmente! Pensei que você não vinha mais.", en: "Finally! I thought you weren't coming any more.", altEs: ["Finalmente! Achei que você não vinha mais."], grammar: [g.narration-connectors], vocab: [w.finalmente, w.vir] }
  - id: a2.u04.l3
    title: Enquanto eu esperava
    teach: [g.quando-enquanto]
    vocab: [w.enquanto, w.ladrão, w.roubar, w.fugir, w.gritar, w.grito, w.assalto, w.crime, w.delegacia, w.multa, w.preso, w.batida, w.bater, w.socorro, w.ambulância]
    tip: "enquanto + imperfect = while (two things at once). quando + preterite = at one moment; quando + imperfect = whenever."
    sentences:
      - { es: "Enquanto eu esperava o ônibus, um ladrão roubou a minha bolsa.", en: "While I was waiting for the bus, a thief stole my bag.", altEs: ["Enquanto eu esperava o ônibus, um ladrão roubou minha bolsa.", "Enquanto eu estava esperando o ônibus, um ladrão roubou a minha bolsa."], grammar: [g.quando-enquanto, g.preterite-vs-imperfect], vocab: [w.enquanto, w.ladrão, w.roubar, w.bolsa] }
      - { es: "Eu gritei: Socorro! Ladrão!", en: "I shouted: Help! Thief!", altEs: ["Gritei: Socorro! Ladrão!"], grammar: [g.preterite-regular], vocab: [w.gritar, w.socorro, w.ladrão] }
      - { es: "O ladrão fugiu pela avenida.", en: "The thief ran off down the avenue.", altEs: ["O ladrão fugiu pela avenida afora."], grammar: [g.preterite-regular], vocab: [w.fugir, w.avenida] }
      - { es: "Quando a polícia chegou, ele já estava longe.", en: "When the police arrived, he was already far away.", altEs: ["Quando a polícia chegou, ele já estava bem longe."], grammar: [g.quando-enquanto], vocab: [w.polícia, w.longe], transform: { instruction: "Change 'ele' to 'nós'", answer: "Quando a polícia chegou, nós já estávamos longe.", alt: ["Quando a polícia chegou, a gente já estava longe.", "Quando a polícia chegou, já estávamos longe."], en: "When the police arrived, we were already far away." } }
      - { es: "Fui à delegacia e contei tudo.", en: "I went to the police station and told them everything.", altEs: ["Eu fui à delegacia e contei tudo.", "Fui na delegacia e contei tudo."], grammar: [g.preterite-ser-ir], vocab: [w.delegacia, w.contar] }
      - { es: "Foi um assalto rápido, mas eu fiquei nervosa.", en: "It was a quick robbery, but I got nervous.", altEs: ["Foi um assalto rápido, mas eu fiquei nervoso."], grammar: [g.preterite-ser-ir], vocab: [w.assalto, w.nervoso] }
      - { es: "Enquanto ele dirigia, eu olhava o mapa.", en: "While he was driving, I was looking at the map.", altEs: ["Enquanto ele dirigia, eu olhava para o mapa."], grammar: [g.quando-enquanto], vocab: [w.enquanto, w.dirigir, w.mapa], transform: { instruction: "Change 'eu' to 'a gente'", answer: "Enquanto ele dirigia, a gente olhava o mapa.", alt: ["Enquanto ele dirigia, nós olhávamos o mapa."], en: "While he was driving, we were looking at the map." } }
      - { es: "Quando eu morava no centro, ouvia gritos toda noite.", en: "When I lived downtown, I heard shouting every night.", altEs: ["Quando eu morava no centro, eu ouvia gritos toda noite."], grammar: [g.quando-enquanto, g.imperfect-uses], vocab: [w.grito, w.ouvir, w.centro] }
      - { es: "Teve uma batida na esquina e a ambulância chegou logo.", en: "There was a crash on the corner and the ambulance arrived right away.", altEs: ["Houve uma batida na esquina e a ambulância chegou logo."], grammar: [g.preterite-irregular], vocab: [w.batida, w.ambulância, w.esquina] }
      - { es: "Um carro bateu no meu enquanto eu estava parado no sinal.", en: "A car hit mine while I was stopped at the lights.", altEs: ["Um carro bateu no meu enquanto eu estava parada no sinal."], grammar: [g.quando-enquanto], vocab: [w.bater, w.sinal, w.parar] }
      - { es: "O motorista levou uma multa porque dirigia rápido demais.", en: "The driver got a fine because he was driving too fast.", altEs: ["O motorista levou uma multa porque estava dirigindo rápido demais."], grammar: [g.preterite-vs-imperfect], vocab: [w.multa, w.motorista, w.rápido] }
      - { es: "O ladrão ficou preso dois dias.", en: "The thief was locked up for two days.", altEs: ["O ladrão ficou preso por dois dias."], grammar: [g.preterite-regular], vocab: [w.preso, w.ladrão] }
      - { es: "Quando ouvi o grito, eu corri para a janela.", en: "When I heard the scream, I ran to the window.", altEs: ["Quando ouvi o grito, corri para a janela.", "Quando eu ouvi o grito, corri pra janela."], grammar: [g.quando-enquanto], vocab: [w.grito, w.correr, w.janela], error: { wrong: "Quando ouvia o grito, eu corri para a janela.", explain: "One single moment takes quando + preterite: quando ouvi.", grammar: g.quando-enquanto } }
      - { es: "Enquanto a gente conversava, alguém roubou a bicicleta.", en: "While we were chatting, someone stole the bike.", altEs: ["Enquanto nós conversávamos, alguém roubou a bicicleta."], grammar: [g.quando-enquanto], vocab: [w.enquanto, w.roubar, w.bicicleta], error: { wrong: "Enquanto a gente conversou, alguém roubou a bicicleta.", explain: "enquanto introduces the background action, so it takes the imperfect: conversava.", grammar: g.quando-enquanto } }
      - { es: "O crime aconteceu enquanto todos dormiam.", en: "The crime happened while everyone was asleep.", altEs: ["O crime aconteceu enquanto todo mundo dormia."], grammar: [g.quando-enquanto], vocab: [w.crime, w.acontecer] }
      - { es: "Ela gosta de praia, enquanto eu prefiro a montanha.", en: "She likes the beach, whereas I prefer the mountains.", altEs: ["Ela gosta de praia, enquanto eu prefiro montanha."], grammar: [g.quando-enquanto], vocab: [w.enquanto, w.montanha], note: "enquanto can also mean 'whereas'." }
    exchanges:
      - q: { es: "O que você fazia quando o ladrão chegou?", en: "What were you doing when the thief turned up?" }
        a: { es: "Eu esperava o ônibus no ponto.", en: "I was waiting for the bus at the stop." }
        alt: ["Estava no ponto de ônibus.", "Eu falava no celular.", "Esperava o ônibus."]
        grammar: [g.quando-enquanto]
        vocab: [w.ladrão, w.ponto-de-ônibus]
      - q: { es: "O que ele roubou?", en: "What did he steal?" }
        a: { es: "Roubou a minha bolsa e o meu celular.", en: "He stole my bag and my phone." }
        alt: ["A minha bolsa.", "Nada, ele fugiu.", "O meu celular."]
        grammar: [g.preterite-regular]
        vocab: [w.roubar]
      - q: { es: "Você foi à delegacia?", en: "Did you go to the police station?" }
        a: { es: "Fui, logo depois do assalto.", en: "I did, right after the robbery." }
        alt: ["Ainda não.", "Fui, sim.", "Fui ontem."]
        grammar: [g.preterite-ser-ir]
        vocab: [w.delegacia, w.assalto]
      - q: { es: "Alguém se machucou na batida?", en: "Did anyone get hurt in the crash?" }
        a: { es: "Não, graças a Deus. Mas a ambulância veio mesmo assim.", en: "No, thank God. But the ambulance came anyway." }
        alt: ["Não, ninguém.", "Só um pouco.", "Não, felizmente."]
        grammar: [g.preterite-dar-ver-vir]
        vocab: [w.batida, w.ambulância]
      - q: { es: "Por que você levou uma multa?", en: "Why did you get a fine?" }
        a: { es: "Porque estacionei na calçada.", en: "Because I parked on the pavement." }
        alt: ["Porque dirigi rápido demais.", "Nem sei!", "Estacionei mal."]
        grammar: [g.preterite-regular]
        vocab: [w.multa, w.estacionar]
    texts:
      - title: "Notícia"
        es: ["Ontem à noite, um ladrão roubou uma loja perto do Ibirapuera.", "Enquanto ele fugia, um vizinho gritou e chamou a polícia.", "O homem ficou preso na delegacia do bairro."]
        en: ["Last night, a thief robbed a shop near Ibirapuera.", "While he was running away, a neighbour shouted and called the police.", "The man was held at the local police station."]
        grammar: [g.quando-enquanto]
        vocab: [w.ladrão, w.fugir, w.preso, w.delegacia]
      - title: "Mensagem"
        es: ["Gente, tudo bem comigo!", "Teve uma batida enquanto eu voltava para casa, mas ninguém se machucou.", "Só o carro que ficou feio..."]
        en: ["Guys, I'm fine!", "There was a crash while I was on my way home, but nobody got hurt.", "Only the car ended up looking a mess..."]
        grammar: [g.quando-enquanto]
        vocab: [w.batida, w.enquanto]
    spicy:
      - { es: "Enquanto você falava de política, eu só olhava os seus olhos.", en: "While you were talking about politics, I was just looking into your eyes.", altEs: ["Enquanto você falava de política, eu só olhava para os seus olhos."], grammar: [g.quando-enquanto], vocab: [w.enquanto, w.olho] }
      - { es: "Você roubou o meu coração... e a última batata frita.", en: "You stole my heart... and the last chip.", altEs: ["Você roubou meu coração... e a última batata frita."], altEn: ["You stole my heart... and the last French fry."], grammar: [g.preterite-regular], vocab: [w.roubar, w.coração, w.batata-frita] }
      - { es: "Socorro! Tem alguém muito bonito na minha frente.", en: "Help! There's someone very good-looking in front of me.", grammar: [g.tem-there-is], vocab: [w.socorro, w.bonito] }
      - { es: "Quando você sorriu, eu esqueci o que ia dizer.", en: "When you smiled, I forgot what I was going to say.", altEs: ["Quando você sorriu, esqueci o que ia dizer."], grammar: [g.quando-enquanto], vocab: [w.sorrir, w.esquecer] }
      - { es: "Bonito assim devia ser crime.", en: "Being that good-looking should be a crime.", altEs: ["Bonita assim devia ser crime."], grammar: [g.imperfect-uses], vocab: [w.crime, w.dever] }
  - id: a2.u04.l4
    title: Eu estava dormindo quando...
    teach: [g.estar-gerund-past]
    vocab: [w.acender, w.apagar, w.luz, w.barulho, w.escuro, w.claro.adj, w.silêncio, w.fantasma, w.som, w.cheiro, w.cheirar, w.fogo, w.bombeiro]
    tip: "estava + -ndo = was doing: Eu estava dormindo quando a luz acabou. ficar + -ndo = kept doing: Ficamos conversando."
    sentences:
      - { es: "Eu estava dormindo quando ouvi um barulho.", en: "I was sleeping when I heard a noise.", altEs: ["Estava dormindo quando ouvi um barulho.", "Eu dormia quando ouvi um barulho."], grammar: [g.estar-gerund-past, g.preterite-vs-imperfect], vocab: [w.barulho, w.dormir], variant: "Portugal: Estava a dormir quando ouvi um barulho.", transform: { instruction: "Change to 'we'", answer: "Nós estávamos dormindo quando ouvimos um barulho.", alt: ["A gente estava dormindo quando ouviu um barulho.", "Estávamos dormindo quando ouvimos um barulho."], en: "We were sleeping when we heard a noise." } }
      - { es: "A casa estava escura e em silêncio.", en: "The house was dark and silent.", altEs: ["A casa estava escura e silenciosa."], grammar: [g.imperfect-uses], vocab: [w.escuro, w.silêncio] }
      - { es: "Acendi a luz, mas não tinha ninguém.", en: "I switched on the light, but there was nobody there.", altEs: ["Eu acendi a luz, mas não tinha ninguém.", "Acendi a luz, mas não havia ninguém."], grammar: [g.preterite-vs-imperfect], vocab: [w.acender, w.luz] }
      - { es: "Será que era um fantasma?", en: "Could it have been a ghost?", altEn: ["Was it a ghost, I wonder?"], grammar: [g.sera-que], vocab: [w.fantasma] }
      - { es: "O que você estava fazendo ontem às dez da noite?", en: "What were you doing yesterday at ten at night?", altEs: ["O que você estava fazendo ontem às dez horas da noite?"], grammar: [g.estar-gerund-past], vocab: [w.fazer], transform: { instruction: "Answer: you were reading a book", answer: "Eu estava lendo um livro.", alt: ["Estava lendo um livro."], en: "I was reading a book." } }
      - { es: "A gente estava jantando quando a luz acabou.", en: "We were having dinner when the power went out.", altEs: ["Nós estávamos jantando quando a luz acabou.", "A gente estava jantando quando faltou luz."], grammar: [g.estar-gerund-past], vocab: [w.luz, w.jantar], error: { wrong: "A gente estava jantado quando a luz acabou.", explain: "The past progressive uses the gerund (-ndo): estava jantando.", grammar: g.estar-gerund-past } }
      - { es: "Ficamos conversando no escuro até de madrugada.", en: "We kept talking in the dark until the early hours.", altEs: ["A gente ficou conversando no escuro até de madrugada."], grammar: [g.estar-gerund-past], vocab: [w.escuro, w.conversar], variant: "Portugal: Ficámos a conversar no escuro." }
      - { es: "Que cheiro bom! Quem estava cozinhando?", en: "What a lovely smell! Who was cooking?", altEs: ["Que cheirinho bom! Quem estava cozinhando?"], grammar: [g.estar-gerund-past], vocab: [w.cheiro, w.cozinhar] }
      - { es: "O bolo estava cheirando muito bem.", en: "The cake smelled really good.", altEs: ["O bolo cheirava muito bem."], altEn: ["The cake was smelling really good."], grammar: [g.estar-gerund-past], vocab: [w.cheirar, w.bolo] }
      - { es: "Os bombeiros apagaram o fogo em vinte minutos.", en: "The firefighters put out the fire in twenty minutes.", grammar: [g.preterite-regular], vocab: [w.bombeiro, w.apagar, w.fogo] }
      - { es: "Quando os bombeiros chegaram, o prédio estava pegando fogo.", en: "When the firefighters arrived, the building was on fire.", grammar: [g.estar-gerund-past, g.quando-enquanto], vocab: [w.fogo, w.pegar, w.prédio] }
      - { es: "Estava chovendo e o som da chuva era lindo.", en: "It was raining and the sound of the rain was beautiful.", grammar: [g.estar-gerund-past], vocab: [w.som, w.chuva] }
      - { es: "Você pode apagar a luz, por favor?", en: "Can you switch off the light, please?", altEs: ["Pode apagar a luz, por favor?"], altEn: ["Could you turn off the light, please?"], grammar: [g.poder-present], vocab: [w.apagar, w.luz] }
      - { es: "O céu estava claro e cheio de estrelas.", en: "The sky was clear and full of stars.", grammar: [g.imperfect-uses], vocab: [w.claro.adj, w.céu, w.estrela] }
      - { es: "Eu estava saindo de casa quando você ligou.", en: "I was leaving home when you called.", altEs: ["Estava saindo de casa quando você ligou.", "Eu estava saindo de casa quando você me ligou."], grammar: [g.estar-gerund-past], vocab: [w.sair, w.ligar], error: { wrong: "Eu estive saindo de casa quando você ligou.", explain: "For an action in progress at a moment, use the imperfect: estava saindo.", grammar: g.estar-gerund-past } }
      - { es: "Fiquei esperando no silêncio, sem acender a luz.", en: "I stayed waiting in the silence, without turning on the light.", altEs: ["Fiquei esperando em silêncio, sem acender a luz."], grammar: [g.estar-gerund-past], vocab: [w.silêncio, w.acender] }
    exchanges:
      - q: { es: "O que você estava fazendo quando a luz acabou?", en: "What were you doing when the power went out?" }
        a: { es: "Eu estava tomando banho!", en: "I was in the shower!" }
        alt: ["Estava vendo TV.", "Estava dormindo.", "Estava jantando."]
        grammar: [g.estar-gerund-past]
        vocab: [w.luz, w.tomar-banho]
      - q: { es: "Que barulho foi esse?", en: "What was that noise?" }
        a: { es: "Acho que foi o vento na janela.", en: "I think it was the wind at the window." }
        alt: ["Não sei.", "Foi o gato.", "Foi a porta."]
        grammar: [g.preterite-ser-ir]
        vocab: [w.barulho, w.vento]
      - q: { es: "Você acredita em fantasma?", en: "Do you believe in ghosts?" }
        a: { es: "Não, mas de noite eu acendo todas as luzes.", en: "No, but at night I switch on all the lights." }
        alt: ["Acredito!", "Claro que não.", "Um pouco."]
        grammar: [g.present-regular-er-ir]
        vocab: [w.fantasma, w.acender]
      - q: { es: "Que cheiro é esse?", en: "What's that smell?" }
        a: { es: "É o pão de queijo que estava no forno!", en: "It's the cheese bread that was in the oven!" }
        alt: ["É café.", "Não sei, mas é bom!", "É o bolo."]
        grammar: [g.imperfect-uses]
        vocab: [w.cheiro, w.forno]
      - q: { es: "Os bombeiros demoraram?", en: "Did the firefighters take long?" }
        a: { es: "Não, chegaram em dez minutos e apagaram o fogo.", en: "No, they got there in ten minutes and put out the fire." }
        alt: ["Demoraram um pouco.", "Chegaram rápido.", "Não, foram rápidos."]
        grammar: [g.preterite-regular]
        vocab: [w.bombeiro, w.apagar, w.fogo]
    texts:
      - title: "Uma noite estranha"
        es: ["Era meia-noite e eu estava lendo na cama.", "De repente, a luz apagou e ouvi um som na cozinha.", "Fiquei esperando no escuro... Era só o gato!"]
        en: ["It was midnight and I was reading in bed.", "Suddenly the light went out and I heard a sound in the kitchen.", "I stayed waiting in the dark... It was only the cat!"]
        grammar: [g.estar-gerund-past, g.narration-connectors]
        vocab: [w.luz, w.som, w.escuro]
      - title: "No Ibirapuera"
        es: ["O sol estava se pondo atrás do lago do Ibirapuera.", "Uns jovens estavam tocando violão e o som era lindo.", "A gente ficou ouvindo até as luzes do parque acenderem."]
        en: ["The sun was setting behind the lake in Ibirapuera.", "Some young people were playing the guitar and the sound was lovely.", "We stayed listening until the park lights came on."]
        grammar: [g.estar-gerund-past]
        vocab: [w.som, w.luz, w.acender]
    spicy:
      - { es: "Eu estava pensando em você. De novo.", en: "I was thinking about you. Again.", altEs: ["Estava pensando em você. De novo."], grammar: [g.estar-gerund-past], vocab: [w.pensar, w.de-novo] }
      - { es: "A luz acabou, e a gente ficou conversando no escuro. Que pena que voltou.", en: "The power went out, and we stayed talking in the dark. Shame it came back.", altEs: ["A luz acabou e a gente ficou conversando no escuro. Pena que voltou."], grammar: [g.estar-gerund-past], vocab: [w.luz, w.escuro, w.que-pena] }
      - { es: "Que cheiro bom! É você ou é o bolo?", en: "What a lovely smell! Is it you or the cake?", grammar: [g.ser-present], vocab: [w.cheiro, w.bolo] }
      - { es: "Chamaram os bombeiros? Porque você está pegando fogo.", en: "Has someone called the firefighters? Because you're on fire.", altEs: ["Alguém chamou os bombeiros? Porque você está pegando fogo."], grammar: [g.estar-gerund], vocab: [w.bombeiro, w.fogo] }
      - { es: "Eu estava saindo, mas aí você chegou. Fiquei.", en: "I was leaving, but then you arrived. I stayed.", altEs: ["Estava saindo, mas aí você chegou. Fiquei."], grammar: [g.estar-gerund-past], vocab: [w.sair, w.ficar] }
dialogues:
  - id: a2.u04.d1
    title: Um susto no Ibirapuera
    context: Monday at work. Larissa tells her colleague Marcelo what happened to her in Ibirapuera Park.
    lines:
      - { speaker: Marcelo, es: "Larissa, que cara é essa? O que aconteceu?", en: "Larissa, what's with that face? What happened?" }
      - { speaker: Larissa, es: "Nem te conto! Ontem eu estava correndo no Ibirapuera, perto do lago.", en: "You won't believe it! Yesterday I was running in Ibirapuera, near the lake." }
      - { speaker: Marcelo, es: "Com aquele sol?", en: "In that sun?" }
      - { speaker: Larissa, es: "Não, estava nublado. De repente, um cachorro enorme veio correndo atrás de mim.", en: "No, it was cloudy. Suddenly, a huge dog came running after me." }
      - { speaker: Marcelo, es: "Que susto! E você?", en: "What a fright! And what did you do?" }
      - { speaker: Larissa, es: "Eu gritei, corri e caí na grama. Enquanto eu estava no chão, o cachorro pegou o meu boné e fugiu!", en: "I screamed, ran and fell on the grass. While I was on the ground, the dog grabbed my cap and ran off!" }
      - { speaker: Marcelo, es: "Não acredito! E a dona do cachorro?", en: "No way! And the dog's owner?" }
      - { speaker: Larissa, es: "Ela chegou logo depois e pediu mil desculpas. No final, me deu um sorvete.", en: "She came right after and apologised a thousand times. In the end, she bought me an ice cream." }
      - { speaker: Marcelo, es: "Pelo menos a história terminou bem.", en: "At least the story ended well." }
      - { speaker: Larissa, es: "Terminou ótima! Ela é muito simpática, e no sábado a gente vai correr juntas.", en: "It ended great! She's really nice, and on Saturday we're going running together." }
    questions:
      - { q: "Onde a Larissa estava correndo?", options: ["Na Avenida Paulista", "Perto do lago do Ibirapuera", "Na praia"], answer: 1, explain: "Ontem eu estava correndo no Ibirapuera, perto do lago." }
      - { q: "Como estava o tempo?", options: ["Fazia sol", "Estava nublado", "Estava chovendo"], answer: 1, explain: "Marcelo thought it was sunny, but Larissa says: estava nublado." }
      - { q: "O que o cachorro levou?", options: ["A carteira", "O boné", "O celular"], answer: 1, explain: "O cachorro pegou o meu boné e fugiu." }
      - { q: "O que a dona do cachorro fez no final?", options: ["Deu um sorvete para a Larissa", "Chamou a polícia", "Fugiu com o cachorro"], answer: 0, explain: "No final, me deu um sorvete." }
