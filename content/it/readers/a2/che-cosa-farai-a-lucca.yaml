id: r.a2.che-cosa-farai-a-lucca
level: a2
title: Che cosa farai a Lucca?
kind: text
intro: Francesca has just moved to Lucca for a new job. She writes to her friend Irene, who is coming to visit in September, about everything they will do together.
allow: [francesca, irene, puccini, giacomo, guinigi, bohème]
paragraphs:
  - { es: "Cara Irene, finalmente ho trovato casa! È un piccolo appartamento dentro le mura, a due passi dalla piazza dell'Anfiteatro. Il lavoro in biblioteca mi piace molto e i colleghi sono gentili. Tu quando arriverai? Mi hai scritto «a settembre», ma quale giorno? Scrivimi presto!", en: "Dear Irene, I've finally found a place to live! It's a small flat inside the walls, a stone's throw from the Piazza dell'Anfiteatro. I really like my job at the library and my colleagues are kind. When will you arrive? You wrote 'in September', but which day? Write to me soon!" }
  - { es: "Ho già preparato un programma per il tuo weekend. Sabato mattina noleggeremo due biciclette e faremo il giro delle mura. Sono lunghe circa quattro chilometri e sopra c'è un parco con alberi altissimi: tutta la città va lì a passeggiare, correre e andare in bici. Ci metteremo un'ora, forse meno, perché è tutto piano.", en: "I've already made a plan for your weekend. On Saturday morning we'll hire two bikes and ride round the walls. They're about four kilometres long and on top there's a park with very tall trees: the whole town goes there to stroll, run and cycle. It'll take us an hour, maybe less, because it's all flat." }
  - { es: "Dopo saliremo sulla Torre Guinigi: è una torre medievale con degli alberi in cima! Dall'alto vedrai tutti i tetti rossi della città. Il pomeriggio visiteremo la casa di Giacomo Puccini, che è nato proprio qui a Lucca nel 1858. So che tu ami la Bohème!", en: "Afterwards we'll climb the Guinigi Tower: it's a medieval tower with trees on top! From the top you'll see all the red roofs of the town. In the afternoon we'll visit the house of Giacomo Puccini, who was born right here in Lucca in 1858. I know you love La Bohème!" }
  - { es: "La sera, se farà bel tempo, ceneremo all'aperto in una trattoria vicino a casa mia. Assaggerai i tordelli, la pasta ripiena tipica di Lucca. Se pioverà, cucinerò io: non sono una grande cuoca, ma mi impegnerò!", en: "In the evening, if the weather's nice, we'll have dinner outside in a trattoria near my flat. You'll try tordelli, Lucca's typical stuffed pasta. If it rains, I'll cook: I'm not a great cook, but I'll do my best!" }
  - { es: "Domenica, se avrai voglia, potremo prendere il treno per Pisa: ci vogliono solo trenta minuti. Oppure resteremo a Lucca e dormiremo fino a tardi. Deciderai tu. Sarà un weekend bellissimo, ne sono sicura. Un abbraccio forte, Francesca.", en: "On Sunday, if you feel like it, we can take the train to Pisa: it takes only thirty minutes. Or we'll stay in Lucca and sleep in. You can decide. It'll be a wonderful weekend, I'm sure of it. A big hug, Francesca." }
questions:
  - { q: "Dove lavora Francesca?", options: ["In biblioteca", "In una trattoria", "In un museo"], answer: 0, explain: "«Il lavoro in biblioteca mi piace molto.»" }
  - { q: "Che cosa faranno sabato mattina?", options: ["Visiteranno la casa di Puccini", "Faranno il giro delle mura in bicicletta", "Prenderanno il treno per Pisa"], answer: 1, explain: "«Sabato mattina noleggeremo due biciclette e faremo il giro delle mura.»" }
  - { q: "Che cosa c'è di strano sulla Torre Guinigi?", options: ["Degli alberi in cima", "Una piscina", "Una campana d'oro"], answer: 0, explain: "It's a medieval tower «con degli alberi in cima» – it really has oak trees growing on top." }
  - { q: "Che cosa succederà se pioverà sabato sera?", options: ["Andranno al cinema", "Francesca cucinerà", "Ceneranno all'aperto"], answer: 1, explain: "«Se pioverà, cucinerò io» – a real condition: se + future, future." }
  - { q: "Quanto tempo ci vuole in treno da Lucca a Pisa?", options: ["Un'ora", "Trenta minuti", "Quattro ore"], answer: 1, explain: "«Ci vogliono solo trenta minuti» – volerci expresses the time something takes." }
glossary:
  - { es: a due passi, en: a stone's throw, very close }
  - { es: anfiteatro, en: amphitheatre }
  - { es: altissimi, en: very tall }
  - { es: piano, en: flat (here) }
  - { es: all'aperto, en: outdoors }
  - { es: tordelli, en: tordelli (Lucca's stuffed pasta) }
  - { es: impegnerò, en: I'll make an effort }
  - { es: oppure, en: or (else) }
