id: r.c2.madame-bovary
level: c2
title: "Madame Bovary : pourquoi me suis-je mariée ?"
kind: literature
author: Gustave Flaubert (1821–1880)
source: "Madame Bovary, première partie, fin du chapitre V et chapitre VII (1857). Domaine public. Texte d'après l'édition ELTeC du roman (Bibliothèque électronique du Québec), vérifié sur l'édition du Projet Gutenberg (n° 14155) ; les coupures sont marquées par (…)."
intro: "Emma Bovary, a few months after marrying the country doctor Charles, discovers that married life is nothing like the novels she read at the convent. The first paragraph is an editorial introduction written for this course; the rest is Flaubert's text, with cuts marked (…). Watch for free indirect speech, where Emma's thoughts slip into the narration without quotation marks (Un homme, au contraire, ne devait-il pas tout connaître ?), and for Flaubert's precise, cruel similes."
allow: [particulière, aspect, exciter, multiples, flaubert, emma, bovary, charles, rouen, paris, normandie, suisses, écossais, cottage, chalets, villas, postillon, félicité, passion, insaisissable, abondance, intimité, détachement, équitation, activités, initier, énergies, raffinements, mystères, sereine, combinaisons, distinguée, distingué, existences]
paragraphs:
  - { es: "Fille d'un riche fermier normand, Emma a été élevée dans un couvent, où elle a lu en cachette des romans pleins de passions et de pays lointains. Elle épouse Charles Bovary, un médecin de campagne honnête mais sans éclat, et s'installe avec lui dans un petit bourg. Très vite, la réalité ne ressemble plus à ses rêves.", en: "The daughter of a rich Norman farmer, Emma was brought up in a convent, where she secretly read novels full of passion and faraway countries. She marries Charles Bovary, an honest but undistinguished country doctor, and settles with him in a small market town. Very soon, reality no longer resembles her dreams." }
  - { es: "Avant qu'elle se mariât, elle avait cru avoir de l'amour ; mais le bonheur qui aurait dû résulter de cet amour n'étant pas venu, il fallait qu'elle se fût trompée, songeait-elle. Et Emma cherchait à savoir ce que l'on entendait au juste dans la vie par les mots de félicité, de passion et d'ivresse, qui lui avaient paru si beaux dans les livres. (…)", en: "Before she married, she had believed she was in love; but since the happiness that should have come from this love had not come, she must have been mistaken, she thought. And Emma tried to find out what exactly people meant in life by the words bliss, passion and rapture, which had seemed so beautiful to her in books. (…)" }
  - { es: "Elle songeait quelquefois que c'étaient là pourtant les plus beaux jours de sa vie, la lune de miel, comme on disait. Pour en goûter la douceur, il eût fallu, sans doute, s'en aller vers ces pays à noms sonores où les lendemains de mariage ont de plus suaves paresses ! Dans des chaises de poste, sous des stores de soie bleue, on monte au pas des routes escarpées, écoutant la chanson du postillon, qui se répète dans la montagne avec les clochettes des chèvres et le bruit sourd de la cascade. Quand le soleil se couche, on respire au bord des golfes le parfum des citronniers ; puis, le soir, sur la terrasse des villas, seuls et les doigts confondus, on regarde les étoiles en faisant des projets.", en: "She sometimes thought that these were, after all, the finest days of her life, the honeymoon, as people called it. To taste its sweetness, no doubt, one would have had to go off to those lands with resonant names where the days after a wedding have a more delicious idleness! In post-chaises, under blinds of blue silk, you climb steep roads at walking pace, listening to the postilion's song echoing in the mountains with the goats' little bells and the muffled sound of the waterfall. At sunset you breathe the scent of lemon trees on the shores of bays; then, in the evening, on the terrace of villas, alone together and fingers entwined, you look at the stars and make plans." }
  - { es: "Il lui semblait que certains lieux sur la terre devaient produire du bonheur, comme une plante particulière au sol et qui pousse mal tout autre part. Que ne pouvait-elle s'accouder sur le balcon des chalets suisses ou enfermer sa tristesse dans un cottage écossais, avec un mari vêtu d'un habit de velours noir à longues basques, et qui porte des bottes molles, un chapeau pointu et des manchettes !", en: "It seemed to her that certain places on earth must produce happiness, like a plant peculiar to one soil that grows badly anywhere else. Why could she not lean on the balcony of a Swiss chalet or shut her sadness away in a Scottish cottage, with a husband dressed in a black velvet coat with long tails, who wears soft boots, a pointed hat and ruffled cuffs!" }
  - { es: "Peut-être aurait-elle souhaité faire à quelqu'un la confidence de toutes ces choses. Mais comment dire un insaisissable malaise, qui change d'aspect comme les nuées, qui tourbillonne comme le vent ? Les mots lui manquaient donc, l'occasion, la hardiesse. Si Charles l'avait voulu cependant, s'il s'en fût douté, si son regard, une seule fois, fût venu à la rencontre de sa pensée, il lui semblait qu'une abondance subite se serait détachée de son cœur, comme tombe la récolte d'un espalier quand on y porte la main. Mais, à mesure que se serrait davantage l'intimité de leur vie, un détachement intérieur se faisait qui la déliait de lui.", en: "Perhaps she would have liked to confide all these things to someone. But how do you put into words an elusive unease that changes shape like the clouds and swirls like the wind? So she lacked the words, the opportunity, the boldness. Yet if Charles had wanted it, if he had suspected, if his gaze had just once come to meet her thought, it seemed to her that a sudden abundance would have come loose from her heart, as the fruit falls from a trained tree when you put out your hand. But as the intimacy of their life grew closer, an inner detachment took place that loosened her from him." }
  - { es: "La conversation de Charles était plate comme un trottoir de rue, et les idées de tout le monde y défilaient dans leur costume ordinaire, sans exciter d'émotion, de rire ou de rêverie. (…) Un homme, au contraire, ne devait-il pas, tout connaître, exceller en des activités multiples, vous initier aux énergies de la passion, aux raffinements de la vie, à tous les mystères ? Mais il n'enseignait rien, celui-là, ne savait rien, ne souhaitait rien. Il la croyait heureuse ; et elle lui en voulait de ce calme si bien assis, de cette pesanteur sereine, du bonheur même qu'elle lui donnait.", en: "Charles's conversation was as flat as a pavement, and everyone's ideas filed past in it in their everyday clothes, arousing no emotion, no laughter, no daydream. (…) A man, on the contrary, should he not know everything, excel at many things, initiate you into the energies of passion, the refinements of life, all its mysteries? But this one taught nothing, knew nothing, wished for nothing. He believed she was happy; and she resented him for that calm so firmly settled, that serene heaviness, for the very happiness she gave him." }
  - { es: "(…) Puis ses idées peu à peu se fixaient, et, assise sur le gazon, qu'elle fouillait à petits coups avec le bout de son ombrelle, Emma se répétait : — Pourquoi, mon Dieu ! me suis-je mariée ? Elle se demandait s'il n'y aurait pas eu moyen, par d'autres combinaisons du hasard, de rencontrer un autre homme ; et elle cherchait à imaginer quels eussent été ces événements non survenus, cette vie différente, ce mari qu'elle ne connaissait pas.", en: "(…) Then little by little her thoughts settled, and, sitting on the grass, which she dug at with little jabs of the tip of her parasol, Emma kept saying to herself: 'Why, dear God, did I marry?' She wondered whether there might not have been a way, through some other combination of chance, of meeting another man; and she tried to imagine what those events that never happened would have been, that different life, that husband she did not know." }
  - { es: "Tous, en effet, ne ressemblaient pas à celui-là. Il aurait pu être beau, spirituel, distingué, attirant, tels qu'ils étaient sans doute, ceux qu'avaient épousés ses anciennes camarades du couvent. Que faisaient-elles maintenant ? À la ville, avec le bruit des rues, le bourdonnement des théâtres et les clartés du bal, elles avaient des existences où le cœur se dilate, où les sens s'épanouissent. Mais elle, sa vie était froide comme un grenier dont la lucarne est au nord, et l'ennui, araignée silencieuse, filait sa toile dans l'ombre à tous les coins de son cœur.", en: "Not all of them, after all, were like this one. He might have been handsome, witty, distinguished, attractive, as no doubt were the men her old convent friends had married. What were they doing now? In the city, with the noise of the streets, the buzz of the theatres and the lights of the ballroom, they led lives in which the heart expands and the senses blossom. But as for her, her life was as cold as an attic whose skylight faces north, and boredom, a silent spider, was spinning its web in the shadows in every corner of her heart." }
questions:
  - { q: "Pourquoi Emma pense-t-elle s'être trompée sur l'amour ?", options: ["Parce que Charles est méchant", "Parce que le bonheur promis par les livres n'est pas venu", "Parce qu'elle aime un autre homme"], answer: 1, explain: "«Le bonheur qui aurait dû résulter de cet amour n'étant pas venu, il fallait qu'elle se fût trompée.»" }
  - { q: "Où Emma imagine-t-elle que la lune de miel aurait été heureuse ?", options: ["Dans son village normand", "Dans des pays lointains et romantiques : montagnes, golfes, chalets suisses, cottages écossais", "À Paris, au théâtre"], answer: 1, explain: "She dreams of «ces pays à noms sonores»: post-chaises in the mountains, lemon trees by the sea, Swiss chalets, a Scottish cottage." }
  - { q: "Comment Flaubert décrit-il la conversation de Charles ?", options: ["Brillante et pleine d'esprit", "« Plate comme un trottoir de rue »", "Violente"], answer: 1, explain: "«Plate comme un trottoir de rue» — everyone's ideas file through it in everyday clothes, arousing nothing." }
  - { q: "Dans « Un homme, au contraire, ne devait-il pas tout connaître ? », qui pense ?", options: ["Le narrateur, qui donne son opinion", "Emma, dont la pensée est rapportée au style indirect libre", "Charles"], answer: 1, explain: "Free indirect speech: Emma's question about what a man 'should' be enters the narrative without quotation marks or a reporting verb." }
  - { q: "À quoi Emma compare-t-elle sa vie à la fin de l'extrait ?", options: ["À un grenier froid où l'ennui, comme une araignée, tisse sa toile", "À un jardin en fleurs", "À un bal"], answer: 0, explain: "«Sa vie était froide comme un grenier dont la lucarne est au nord, et l'ennui, araignée silencieuse, filait sa toile…»" }
