id: r.c1.one-story-two-registers
level: c1
title: 一單新聞，兩種講法
kind: dialogue
intro: "A (fictional) Macau radio news item, read in written-style Chinese, followed by two friends in a cha chaan teng retelling the same story in colloquial Cantonese. Compare the registers: 據悉, 疑似, 送院, 當局 and the formal passive 被 against everyday speech with 畀, 話 and 咗. This is the contrast of c1.u02 and c1.u07."
allow: [阿芬, 阿傑, 發仔, 黎太, 傑, 芬, 發]
paragraphs:
  - { es: "（電台新聞）本台消息：氹仔一間餐廳昨晚疑似發生食物中毒事故，共有十二名食客出現嘔吐及肚瀉等不適，其中五人須送院治理，目前情況穩定。據悉，涉事食客均曾進食同一款海鮮飯。衞生當局已派員到場調查，並抽取食物樣本化驗，不排除事件與海鮮未經徹底煮熟有關。當局表示，該餐廳已被勒令暫停營業，有待化驗結果公布後再作決定。", en: "(Radio news) This station has learned that a suspected case of food poisoning occurred last night at a restaurant in Taipa. Twelve diners suffered vomiting, diarrhoea and other symptoms, five of whom required hospital treatment; they are currently in a stable condition. It is understood that all the diners concerned had eaten the same seafood rice dish. The health authorities have sent staff to the scene to investigate and have taken food samples for testing, and do not rule out that the incident is related to seafood not being thoroughly cooked. The authorities stated that the restaurant has been ordered to suspend business, and a decision will be made after the test results are announced." }
  - { es: "阿芬：喂，你聽唔聽到朝早個新聞呀？氹仔有間餐廳出事喎，十幾個人食完嘢肚痛，屙嘔肚瀉，有幾個仲要入院添。", en: "Ah Fan: Hey, did you hear the news this morning? Something happened at a restaurant in Taipa – a dozen people got stomach ache after eating, throwing up and diarrhoea, and a few even had to go to hospital." }
  - { es: "阿傑：聽到呀，個主播講到好嚴重噉：「據悉」、「涉事食客」、「送院治理」，我聽到一頭霧水。其實即係點呀？", en: "Ah Kit: Yes, I heard it. The newsreader made it sound so serious: 'it is understood', 'the diners concerned', 'sent to hospital for treatment' – I couldn't make head or tail of it. What actually happened?" }
  - { es: "阿芬：好簡單啫。「據悉」即係「聽講」，佢哋未百分百確定，所以唔敢講死。「疑似食物中毒」就係「可能係食壞肚」，未證實。「涉事食客」就係「嗰啲食咗嘢嘅客人」。「送院治理」，即係「送咗去醫院睇醫生」。新聞成日噉講，因為要正式，又要小心，唔可以亂講。", en: "Ah Fan: It's simple. 據悉 means 'I heard', they're not a hundred per cent sure yet, so they don't dare say it outright. 'Suspected food poisoning' is 'maybe they ate something bad' – not confirmed. 'The diners concerned' is 'the customers who ate there'. 'Sent to hospital for treatment' means 'taken to hospital to see a doctor'. The news always talks like that, because it has to be formal and careful, it can't just say anything." }
  - { es: "阿傑：咁「不排除事件與海鮮未經徹底煮熟有關」呢？咁長一句。", en: "Ah Kit: And 'do not rule out that the incident is related to seafood not being thoroughly cooked'? Such a long sentence." }
  - { es: "阿芬：即係「可能係啲海鮮煮得唔夠熟」囉。你留意吓，新聞好鍾意用「不排除」、「有指」、「相信」呢啲字，因為佢哋未有證據，但係又想話畀你知有呢個可能。我哋平時講嘢就直接啲：「實係啲蝦唔熟啦！」不過噉講，餐廳可以告你㗎。", en: "Ah Fan: It means 'maybe the seafood wasn't cooked enough'. Notice that the news loves words like 'not ruling out', 'it is alleged', 'it is believed', because they don't have evidence yet but still want to tell you it's a possibility. When we talk normally we're more direct: 'The prawns must have been undercooked!' But if you say that, the restaurant could sue you." }
  - { es: "阿傑：哈哈，都係。仲有，個主播話間餐廳「已被勒令暫停營業」，點解唔講「畀政府封咗」呢？", en: "Ah Kit: Ha, true. And the newsreader said the restaurant 'has been ordered to suspend business'. Why not just say 'the government shut it down'?" }
  - { es: "阿芬：因為書面語用「被」，口語先用「畀」。「被勒令」即係「畀人命令」，而且唔一定要講邊個命令。仲有，「暫停營業」唔係「執笠」，只係暫時唔開，等化驗結果出咗先決定。如果你同人講「嗰間餐廳執咗」，就唔係事實喇。", en: "Ah Fan: Because written Chinese uses 被 and speech uses 畀. 'Has been ordered' means 'got ordered by someone', and you don't have to say who gave the order. Also, 'suspend business' isn't 'go bust' – it just means not opening for the time being until the test results come out. If you told people 'that restaurant has closed down', that wouldn't be true." }
  - { es: "阿傑：講真，我覺得新聞啲字好似另一種語言。點解唔可以直接用廣東話報新聞呢？", en: "Ah Kit: Honestly, the words on the news feel like another language. Why can't they just read the news in plain Cantonese?" }
  - { es: "阿芬：其實佢哋係用廣東話讀㗎，每個字都係廣東話嘅讀音，只不過用嘅係書面語嘅詞同句子。香港同澳門一路都係噉：寫嘢用書面語，讀出嚟用廣東話。有啲電台節目，例如烽煙節目，就全部用口語，主持同聽眾傾偈噉。新聞就唔同，要正式啲，聽眾先會信佢。", en: "Ah Fan: Actually they do read it in Cantonese – every character has its Cantonese pronunciation; it's just that they use written-style words and sentences. Hong Kong and Macau have always done it this way: you write in standard written Chinese and read it aloud in Cantonese. Some radio programmes, like phone-in shows, are completely colloquial, with the host chatting to the listeners. The news is different: it has to be more formal, so that listeners will trust it." }
  - { es: "阿傑：咁你覺得邊種講法好啲？", en: "Ah Kit: So which way of saying it do you think is better?" }
  - { es: "阿芬：冇話邊種好啲，睇場合啫。新聞要準確、要中立，所以用書面語，句句都留返啲餘地；朋友傾偈就要講得清楚、講得生動。最緊要係你兩種都聽得明，識得轉換。好似你阿媽打電話嚟問你：「你冇去嗰間食啩？」你就唔會答：「本人並未進食涉事海鮮飯。」", en: "Ah Fan: Neither is better, it depends on the situation. The news has to be accurate and neutral, so it uses written Chinese and leaves a bit of room in every sentence; chatting with friends, you want to be clear and lively. The most important thing is that you understand both and can switch between them. Like when your mum phones to ask, 'You didn't eat at that place, did you?' – you wouldn't answer, 'I have not consumed the seafood rice concerned.'" }
  - { es: "阿傑：（笑）佢實以為我癲咗。講開又講，我上個月先同發仔喺嗰間食過海鮮飯，好好味㗎！", en: "Ah Kit: (laughs) She'd think I'd gone mad. Speaking of which, Fat-jai and I had the seafood rice there only last month. It was delicious!" }
  - { es: "阿芬：咁你仲坐喺度？快啲打畀發仔問吓佢有冇事啦！不過放心，新聞話係「昨晚」嘅事，同你上個月冇關係。你睇，書面語都有用㗎，起碼佢講清楚時間。", en: "Ah Fan: Then why are you still sitting here? Call Fat-jai quickly and ask if he's all right! But don't worry, the news said it happened 'last night', nothing to do with your visit last month. You see, written Chinese has its uses – at least it states the time clearly." }
  - { es: "阿傑拎起電話，打咗兩次都冇人聽。阿芬話：「唔使驚，佢實係瞓緊覺啫。」第三次終於接通，發仔把聲好精神：「乜嘢事呀？我喺黎太嗰度食緊早餐。海鮮飯？我上個月食完冇事，不過聽講今次嗰批蝦有問題喎。」阿傑收線，同阿芬講：「你聽，佢都會講『聽講』，佢係我哋嘅新聞台。」", en: "Ah Kit picks up his phone; he calls twice and nobody answers. Ah Fan says: 'Don't worry, he's bound to be asleep.' On the third try he finally gets through, and Fat-jai sounds wide awake: 'What's up? I'm having breakfast at Mrs Lai's. Seafood rice? I was fine after I ate it last month, but I heard there was something wrong with this batch of prawns.' Ah Kit hangs up and tells Ah Fan: 'Listen to that – he says \"I heard\" too. He's our own news channel.'" }
questions:
  - { q: "新聞入面嘅「據悉」，用口語講即係？", options: ["聽講", "證實", "否認"], answer: 0, explain: "據悉 'it is understood' marks information not yet fully confirmed, colloquially 聽講 / 聽人講." }
  - { q: "點解新聞成日用「不排除」、「有指」、「相信」呢啲字？", options: ["因為主播唔識講口語", "因為未有證據，但係想講出有呢個可能", "因為噉講比較短"], answer: 1, explain: "Hedging words let the news report a possibility without asserting it as fact." }
  - { q: "「已被勒令暫停營業」，即係間餐廳點樣？", options: ["已經執笠，永遠唔再開", "畀人命令暫時唔可以開", "自己決定放假"], answer: 1, explain: "被勒令 = ordered (by the authorities); 暫停營業 = temporarily suspended, not permanently closed (執笠)." }
  - { q: "根據阿芬，書面語嘅「被」對應口語嘅邊個字？", options: ["將", "畀", "嚟"], answer: 1, explain: "The formal passive 被 corresponds to colloquial 畀: 被勒令 ≈ 畀人命令." }
  - { q: "阿芬覺得書面語同口語邊種好啲？", options: ["書面語，因為比較準確", "口語，因為比較生動", "冇話邊種好啲，要睇場合"], answer: 2, explain: "冇話邊種好啲，睇場合啫: the register depends on the situation; what matters is being able to switch." }
