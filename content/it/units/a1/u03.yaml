      - { es: "Ho trent'anni, un cane e tutto il weekend per te.", en: "I'm thirty, I've got a dog and the whole weekend for you.", altEs: ["Ho trenta anni, un cane e tutto il weekend per te."], grammar: [g.numbers-0-100, g.avere-present], vocab: [w.trenta] }
dialogues:
  - id: a1.u03.d1
    title: Una foto al Foro Romano
    context: At the Roman Forum, Giulia shows Tom a photo of her family on her phone.
    lines:
      - { speaker: Tom, es: "Il Foro Romano è bellissimo! Quanti anni ha?", en: "The Roman Forum is gorgeous! How old is it?" }
      - { speaker: Giulia, es: "Più di duemila anni! Guarda, questa è una foto della mia famiglia.", en: "More than two thousand years! Look, this is a photo of my family." }
      - { speaker: Tom, es: "Che bella! Chi è questo signore?", en: "How lovely! Who is this man?" }
      - { speaker: Giulia, es: "È mio padre. Si chiama Roberto e ha sessant'anni.", en: "That's my father. His name is Roberto and he's sixty." }
      - { speaker: Tom, es: "E lei è tua madre?", en: "And is she your mother?" }
      - { speaker: Giulia, es: "No, è mia zia Laura. Mia madre non è nella foto.", en: "No, that's my aunt Laura. My mother isn't in the photo." }
      - { speaker: Tom, es: "Hai fratelli?", en: "Do you have any brothers or sisters?" }
      - { speaker: Giulia, es: "Sì, un fratello maggiore, Luca. Ha trentadue anni ed è sposato.", en: "Yes, an older brother, Luca. He's thirty-two and he's married." }
      - { speaker: Tom, es: "E il cane?", en: "And the dog?" }
      - { speaker: Giulia, es: "È Bruno, il cane dei miei nonni. E tu, Tom? Hai fratelli?", en: "That's Bruno, my grandparents' dog. And you, Tom? Do you have brothers or sisters?" }
      - { speaker: Tom, es: "No, sono figlio unico. Ma ho due gatti!", en: "No, I'm an only child. But I have two cats!" }
    questions:
      - { q: "Quanti anni ha il padre di Giulia?", options: ["Cinquanta.", "Sessanta.", "Settanta."], answer: 1, explain: "«Si chiama Roberto e ha sessant'anni»." }
      - { q: "Chi è Laura?", options: ["La madre di Giulia.", "La zia di Giulia.", "La sorella di Giulia."], answer: 1, explain: "«No, è mia zia Laura»: her mother isn't in the photo." }
      - { q: "Chi è Luca?", options: ["Il fratello minore di Giulia.", "Il fratello maggiore di Giulia.", "Il cugino di Giulia."], answer: 1, explain: "«Un fratello maggiore, Luca», who is thirty-two." }
      - { q: "Tom ha fratelli?", options: ["Sì, un fratello.", "Sì, due sorelle.", "No, è figlio unico."], answer: 2, explain: "«No, sono figlio unico», but he has two cats." }
