id: a1.u04
title: Mi casa y mi ciudad
lessons:
  - id: a1.u04.l1
    title: En casa
    teach: [g.hay, g.articles-indefinite]
    vocab: [w.haber, w.casa, w.piso, w.habitacion, w.dormitorio, w.cocina, w.bano, w.salon, w.puerta, w.ventana, w.mesa, w.silla, w.cama, w.sofa, w.armario, w.lampara, w.television, w.ordenador, w.libro, w.cosa, w.llave, w.jardin]
    sentences:
      - { es: "Hay tres dormitorios en mi casa.", en: "There are three bedrooms in my house.", grammar: [g.hay], vocab: [w.haber, w.dormitorio, w.casa] }
      - { es: "En la cocina hay una mesa y cuatro sillas.", en: "In the kitchen there is a table and four chairs.", grammar: [g.hay, g.articles-indefinite], vocab: [w.cocina, w.mesa, w.silla] }
      - { es: "¿Hay un baño en el piso?", en: "Is there a bathroom in the flat?", grammar: [g.hay], vocab: [w.bano, w.piso] }
      - { es: "No hay televisión en el dormitorio.", en: "There is no television in the bedroom.", grammar: [g.hay, g.negation], vocab: [w.television, w.dormitorio] }
      - { es: "El salón es grande y tiene dos ventanas.", en: "The living room is big and has two windows.", grammar: [g.tener-present], vocab: [w.salon, w.ventana] }
      - { es: "Mi habitación tiene una cama, un armario y una lámpara.", en: "My room has a bed, a wardrobe and a lamp.", grammar: [g.articles-indefinite], vocab: [w.habitacion, w.cama, w.armario, w.lampara] }
      - { es: "El sofá es muy cómodo.", en: "The sofa is very comfortable.", grammar: [g.ser-present], vocab: [w.sofa, w.comodo] }
      - { es: "Hay muchas cosas en la mesa.", en: "There are many things on the table.", grammar: [g.hay, g.quantity-words], vocab: [w.cosa, w.mucho] }
      - { es: "¿Dónde están mis llaves?", en: "Where are my keys?", grammar: [g.estar-location, g.question-words], vocab: [w.llave] }
      - { es: "La puerta del jardín es blanca.", en: "The garden door is white.", grammar: [g.al-del-contractions], vocab: [w.puerta, w.jardin] }
      - { es: "Tengo un ordenador nuevo en mi dormitorio.", en: "I have a new computer in my bedroom.", grammar: [g.adjectives-position], vocab: [w.ordenador, w.nuevo] }
      - { es: "Hay un libro sobre la cama.", en: "There is a book on the bed.", grammar: [g.hay, g.prepositions-place], vocab: [w.libro, w.sobre, w.cama], error: { wrong: "Hay el libro sobre la cama.", explain: "hay introduces indefinite things: hay un libro. For a specific book: el libro está sobre la cama.", grammar: g.hay } }
  - id: a1.u04.l2
    title: ¿Dónde está?
    teach: [g.estar-location, g.prepositions-place]
    vocab: [w.sobre, w.debajo, w.delante, w.detras, w.al-lado, w.entre, w.cerca, w.lejos, w.enfrente, w.encima, w.dentro, w.derecha, w.izquierda, w.alli, w.ahi]
    sentences:
      - { es: "El gato está debajo de la mesa.", en: "The cat is under the table.", grammar: [g.estar-location, g.prepositions-place], vocab: [w.gato, w.debajo] }
      - { es: "Las llaves están encima de la mesa.", en: "The keys are on the table.", altEs: ["Las llaves están sobre la mesa."], grammar: [g.prepositions-place], vocab: [w.llave, w.encima] }
      - { es: "El coche está delante de la casa.", en: "The car is in front of the house.", grammar: [g.prepositions-place], vocab: [w.coche, w.delante] }
      - { es: "El jardín está detrás de la casa.", en: "The garden is behind the house.", grammar: [g.prepositions-place], vocab: [w.jardin, w.detras], transform: { instruction: "Say the garden is in front of the house", answer: "El jardín está delante de la casa." } }
      - { es: "El banco está al lado del hotel.", en: "The bank is next to the hotel.", grammar: [g.prepositions-place, g.al-del-contractions], vocab: [w.banco, w.al-lado, w.hotel] }
      - { es: "La farmacia está entre el banco y el supermercado.", en: "The pharmacy is between the bank and the supermarket.", grammar: [g.prepositions-place], vocab: [w.farmacia, w.entre] }
      - { es: "¿Está lejos la estación? No, está muy cerca.", en: "Is the station far? No, it is very near.", grammar: [g.estar-location], vocab: [w.lejos, w.cerca, w.estacion] }
      - { es: "El museo está enfrente de la iglesia.", en: "The museum is opposite the church.", grammar: [g.prepositions-place], vocab: [w.museo, w.enfrente, w.iglesia] }
      - { es: "El baño está a la derecha y la cocina a la izquierda.", en: "The bathroom is on the right and the kitchen on the left.", grammar: [g.prepositions-place], vocab: [w.derecha, w.izquierda] }
      - { es: "Mi hermano está dentro de la casa.", en: "My brother is inside the house.", grammar: [g.prepositions-place], vocab: [w.dentro] }
      - { es: "¿Dónde está el perro? Está allí, en el jardín.", en: "Where is the dog? It's over there, in the garden.", grammar: [g.estar-location], vocab: [w.alli, w.perro] }
      - { es: "Estamos en casa.", en: "We are at home.", altEs: ["Nosotros estamos en casa."], grammar: [g.estar-location], vocab: [w.casa], error: { wrong: "Somos en casa.", explain: "Location always takes estar: estamos en casa.", grammar: g.estar-location } }
  - id: a1.u04.l3
    title: Mi barrio
    teach: [g.demonstratives]
    vocab: [w.calle, w.plaza, w.barrio, w.centro, w.parque, w.tienda, w.supermercado, w.mercado, w.banco, w.farmacia, w.hospital, w.escuela, w.universidad, w.iglesia, w.museo, w.restaurante, w.bar, w.cafeteria, w.hotel, w.estacion, w.cine]
    sentences:
      - { es: "Mi barrio es tranquilo y bonito.", en: "My neighbourhood is quiet and pretty.", grammar: [g.adjective-agreement], vocab: [w.barrio, w.tranquilo, w.bonito] }
      - { es: "En mi calle hay un supermercado y una farmacia.", en: "On my street there is a supermarket and a pharmacy.", grammar: [g.hay], vocab: [w.calle, w.supermercado, w.farmacia] }
      - { es: "La plaza está en el centro de la ciudad.", en: "The square is in the city centre.", grammar: [g.estar-location], vocab: [w.plaza, w.centro, w.ciudad] }
      - { es: "Hay un parque muy grande cerca de mi casa.", en: "There is a very big park near my house.", grammar: [g.hay, g.prepositions-place], vocab: [w.parque, w.cerca] }
      - { es: "El hospital está lejos del centro.", en: "The hospital is far from the centre.", grammar: [g.al-del-contractions], vocab: [w.hospital, w.lejos] }
      - { es: "¿Hay un banco por aquí?", en: "Is there a bank around here?", grammar: [g.hay], vocab: [w.banco, w.aqui] }
      - { es: "Esta tienda es muy cara.", en: "This shop is very expensive.", grammar: [g.demonstratives], vocab: [w.tienda, w.caro] }
      - { es: "Esa cafetería es barata y buena.", en: "That café is cheap and good.", grammar: [g.demonstratives], vocab: [w.cafeteria, w.barato, w.ese] }
      - { es: "Aquel restaurante es italiano.", en: "That restaurant over there is Italian.", grammar: [g.demonstratives], vocab: [w.restaurante, w.aquel] }
      - { es: "Mis hijos están en la escuela.", en: "My children are at school.", grammar: [g.estar-location], vocab: [w.escuela, w.hijo] }
      - { es: "La universidad está al lado del museo.", en: "The university is next to the museum.", grammar: [g.prepositions-place], vocab: [w.universidad, w.museo] }
      - { es: "El cine y el bar están en esta plaza.", en: "The cinema and the bar are in this square.", grammar: [g.demonstratives], vocab: [w.cine, w.bar, w.plaza] }
      - { es: "El mercado está enfrente de la estación.", en: "The market is opposite the station.", grammar: [g.prepositions-place], vocab: [w.mercado, w.estacion] }
  - id: a1.u04.l4
    title: ¿Cómo es tu casa?
    teach: [g.articles-indefinite]
    vocab: [w.coche, w.autobus, w.metro, w.tren, w.ese, w.aquel, w.bonito, w.limpio, w.sucio, w.antiguo, w.moderno, w.comodo, w.tranquilo, w.ruidoso, w.caro, w.barato, w.mucho]
    sentences:
      - { es: "Vivo en un piso antiguo en el centro.", en: "I live in an old flat in the centre.", grammar: [g.articles-indefinite, g.adjectives-position], vocab: [w.piso, w.antiguo, w.centro] }
      - { es: "La casa es moderna y muy limpia.", en: "The house is modern and very clean.", grammar: [g.adjective-agreement], vocab: [w.moderno, w.limpio] }
      - { es: "La cocina está sucia.", en: "The kitchen is dirty.", grammar: [g.ser-vs-estar-basics], vocab: [w.cocina, w.sucio] }
      - { es: "Mi calle es muy ruidosa por la noche.", en: "My street is very noisy at night.", grammar: [g.adjective-agreement], vocab: [w.ruidoso, w.calle, w.noche] }
      - { es: "El piso es caro pero el barrio es bonito.", en: "The flat is expensive but the neighbourhood is nice.", grammar: [g.connectors-basic], vocab: [w.caro, w.bonito] }
      - { es: "Hay muchos coches en esta calle.", en: "There are many cars on this street.", grammar: [g.hay, g.quantity-words], vocab: [w.coche, w.mucho] }
      - { es: "El autobús está delante del hotel.", en: "The bus is in front of the hotel.", grammar: [g.prepositions-place], vocab: [w.autobus, w.hotel] }
      - { es: "La estación de metro está cerca.", en: "The metro station is nearby.", grammar: [g.estar-location], vocab: [w.metro, w.estacion] }
      - { es: "El tren es barato y cómodo.", en: "The train is cheap and comfortable.", grammar: [g.adjective-agreement], vocab: [w.tren, w.barato, w.comodo] }
      - { es: "Esa casa es muy antigua.", en: "That house is very old.", grammar: [g.demonstratives], vocab: [w.ese, w.antiguo] }
      - { es: "Aquellas casas son modernas.", en: "Those houses over there are modern.", grammar: [g.demonstratives, g.adjective-agreement], vocab: [w.aquel, w.moderno], transform: { instruction: "Change to the singular", answer: "Aquella casa es moderna." } }
      - { es: "¿Tu barrio es tranquilo o ruidoso?", en: "Is your neighbourhood quiet or noisy?", grammar: [g.adjective-agreement], vocab: [w.tranquilo, w.ruidoso, w.barrio] }
dialogues:
  - id: a1.u04.d1
    title: Un piso nuevo
    context: Lucía shows her new flat to her friend Pablo.
    lines:
      - { speaker: Pablo, es: "¡Qué piso tan bonito! ¿Es grande?", en: "What a nice flat! Is it big?" }
      - { speaker: Lucía, es: "No, es pequeño, pero es muy tranquilo. Hay dos dormitorios y un baño.", en: "No, it's small, but it's very quiet. There are two bedrooms and a bathroom." }
      - { speaker: Pablo, es: "¿Y la cocina?", en: "And the kitchen?" }
      - { speaker: Lucía, es: "La cocina está aquí, a la derecha. Es moderna y tiene una ventana grande.", en: "The kitchen is here, on the right. It's modern and has a big window." }
      - { speaker: Pablo, es: "¿Hay un supermercado cerca?", en: "Is there a supermarket nearby?" }
      - { speaker: Lucía, es: "Sí, hay uno al lado de la farmacia, enfrente del parque.", en: "Yes, there's one next to the pharmacy, opposite the park." }
      - { speaker: Pablo, es: "¿Y la estación de metro está lejos?", en: "And is the metro station far?" }
      - { speaker: Lucía, es: "No, está a cinco minutos. El barrio es perfecto.", en: "No, it's five minutes away. The neighbourhood is perfect." }
      - { speaker: Pablo, es: "¿Dónde está el baño?", en: "Where is the bathroom?" }
      - { speaker: Lucía, es: "Allí, al final, a la izquierda.", en: "There, at the end, on the left." }
    questions:
      - { q: "How many bedrooms does the flat have?", options: ["One", "Two", "Three"], answer: 1 }
      - { q: "Where is the supermarket?", options: ["Next to the pharmacy", "Behind the park", "In the metro station"], answer: 0 }
      - { q: "Where is the bathroom?", options: ["On the right", "At the end on the left", "Next to the kitchen"], answer: 1 }
