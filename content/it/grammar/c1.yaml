# C1 grammar notes (Sicily and Sardinia). Explanations use light markdown:
# ### headings, bullets, tables, **bold**, *italic* (italic = Italian inline).
- id: g.congiuntivo-nuance
  level: c1
  title: "Mood as meaning: indicative or congiuntivo?"
  summary: "With some verbs and structures the choice of mood changes the meaning, not just the register."
  explanation: |
    ### Verbs whose meaning depends on mood
    | verb | + indicative | + congiuntivo |
    |---|---|---|
    | *capire* | understand (realise a fact): *Ho capito che era tardi.* | understand (sympathise): *Capisco che tu sia arrabbiato.* |
    | *ammettere* | admit (a fact): *Ammetto che ho sbagliato.* | grant, suppose: *Ammettiamo che sia vero.* |
    | *sentire* | hear: *Sento che arriva qualcuno.* | — |
    | *pensare* | — | *Penso che sia giusto.* |
    | *dire* | say (report): *Dice che viene.* | tell (command): *Dice che venga subito.* |
    | *badare* | — | make sure: *Bada che non cada.* |

    ### Relative clauses
    - Indicative = real, identified: *Cerco la segretaria che parla tedesco.* (I know she exists)
    - Congiuntivo = hypothetical: *Cerco una segretaria che parli tedesco.* (any one)

    ### After superlatives and *unico, solo, primo*
    *È l'unico che mi capisca.* (subjective) vs *È l'unico che mi ha aiutato.* (fact)

    ### Interrogative clauses
    *Non so se è / sia vero.* — the congiuntivo adds doubt and formality.
  examples:
    - { es: "Capisco che tu non voglia partire.", en: "I understand that you don't want to leave." }
    - { es: "Ho capito che non voleva partire.", en: "I realised he didn't want to leave." }
    - { es: "Ammettiamo che abbia ragione lui: che cosa cambia?", en: "Let's suppose he's right: what changes?" }
    - { es: "Cerco un appartamento che abbia vista sul mare.", en: "I'm looking for a flat with a sea view (any one)." }
  pitfalls:
    - "*Capisco che sei stanco* (I see you're tired) and *capisco che tu sia stanco* (I sympathise) are both right but mean different things."
    - "*Dire che* + congiuntivo is a command: *Digli che venga* = tell him to come."
    - "Spanish speakers: Spanish makes the same distinction with *entender que es / sea*."
  related: [g.relative-advanced, g.congiuntivo-opinion, g.il-fatto-che]
  drills:
    - { es: "Di' a Salvo che mi chiami.", en: "Tell Salvo to call me." }
    - { es: "Di' a Salvo che l'ho chiamato.", en: "Tell Salvo I called him." }
    - { es: "È l'unica persona che mi sappia consigliare.", en: "She's the only person who can advise me." }
- id: g.congiuntivo-independent
  level: c1
  title: "The congiuntivo in main clauses: Che entri! Sia chiaro."
  summary: "Exhortations, wishes, doubts and fixed formulas with the congiuntivo standing alone."
  explanation: |
    | use | example |
    |---|---|
    | third-person command / exhortation | *Che entri pure!* (Let him come in.) *Che aspettino!* |
    | wish | *Dio ce la mandi buona!* *Che tu sia benedetto!* |
    | doubtful question (imperfetto) | *Che sia già partito?* (Could he have left already?) *Che fosse vero?* |
    | concession / indifference | *Sia come sia.* (Be that as it may.) *Costi quel che costi.* (Whatever it costs.) |
    | formulas | *Sia chiaro…* (Let it be clear) *Viva l'Italia! Così sia.* (Amen) *Non sia mai!* (Heaven forbid!) |
    | polite Lei imperative | *Venga, si accomodi.* |

    ### Che fosse…? — hypotheses
    *Che sia malato?* = *Forse è malato?* — the congiuntivo turns a statement into a cautious guess.
  examples:
    - { es: "Sia chiaro: domani non si lavora.", en: "Let's be clear: there's no work tomorrow." }
    - { es: "Non risponde. Che sia ancora in spiaggia?", en: "He's not answering. Could he still be on the beach?" }
    - { es: "Costi quel che costi, voglio vedere le Eolie.", en: "Whatever it costs, I want to see the Aeolian Islands." }
    - { es: "Che vengano pure, non ho paura.", en: "Let them come, I'm not afraid." }
  pitfalls:
    - "*Viva* (long live) is a congiuntivo: *Viva gli sposi!* (singular even with a plural, by convention)."
    - "*Che sia…?* is a guess, not a question expecting yes or no."
    - "Spanish speakers: *¡Que entre!* → *Che entri!*; *sea como sea* → *sia come sia*."
  related: [g.congiuntivo-nuance, g.imperativo-lei]
  drills:
    - { es: "Che Dio ce la mandi buona!", en: "God help us!" }
    - { es: "Sia come sia, io parto.", en: "Be that as it may, I'm leaving." }
    - { es: "Che si fosse dimenticato dell'appuntamento?", en: "Could he have forgotten the appointment?" }
- id: g.il-fatto-che
  level: c1
  title: "Il fatto che + congiuntivo; che-clauses as subjects"
  summary: "A clause placed before the verb as its subject takes the congiuntivo: Che tu sia qui mi fa piacere."
  explanation: |
    ### il fatto che
    *Il fatto che* + **congiuntivo** (usually) presents a fact as a topic for comment:
    - *Il fatto che non abbia chiamato mi preoccupa.* — The fact that he hasn't called worries me.
    - When the fact is stressed as certain, the indicative is possible: *Il fatto è che non ha chiamato.* (*il fatto è che* = the thing is)

    ### A che-clause as subject, before the verb
    - *Che tu sia qui mi rende felice.* — That you are here makes me happy.
    - *Che sia un bravo attore, nessuno lo nega.*

    ### Other noun clauses
    *Dato che, visto che* + indicative (cause); *a patto che, ammesso che* + congiuntivo (condition); *il motivo per cui, la ragione per la quale* + indicative.
  examples:
    - { es: "Il fatto che tu sia siciliano non ti dà sempre ragione!", en: "Being Sicilian doesn't make you always right!" }
    - { es: "Che la mafia abbia segnato la storia dell'isola è innegabile.", en: "That the Mafia has marked the island's history is undeniable." }
    - { es: "Il fatto è che non abbiamo abbastanza soldi.", en: "The thing is, we don't have enough money." }
  pitfalls:
    - "*Il fatto che* (topic) + congiuntivo vs *il fatto è che* (the thing is) + indicative."
    - "A subject clause before the verb needs the congiuntivo: *Che sia vero è possibile.*"
    - "Spanish speakers: *el hecho de que* → *il fatto che* (no *di*)."
  related: [g.congiuntivo-nuance, g.nominalization]
  drills:
    - { es: "Il fatto che piova non cambia niente.", en: "The fact that it's raining changes nothing." }
    - { es: "Che sia difficile, lo sappiamo tutti.", en: "We all know it's difficult." }
    - { es: "Il fatto che abbiano rinunciato mi stupisce.", en: "The fact that they've given up surprises me." }
- id: g.passato-remoto-forms
  level: c1
  title: "The passato remoto: regular forms in production"
  summary: "parlai, credetti / credei, partii — writing narratives in the passato remoto."
  explanation: |
    | | parlare | credere | partire |
    |---|---|---|---|
    | io | parl**ai** | cred**ei** / cred**etti** | part**ii** |
    | tu | parl**asti** | cred**esti** | part**isti** |
    | lui / lei | parl**ò** | cred**é** / cred**ette** | part**ì** |
    | noi | parl**ammo** | cred**emmo** | part**immo** |
    | voi | parl**aste** | cred**este** | part**iste** |
    | loro | parl**arono** | cred**erono** / cred**ettero** | part**irono** |

    - For **-ere** verbs both sets exist; *-etti, -ette, -ettero* are more common in speech (*credette, vendette, ricevette*), *-ei, -é, -erono* in literature.
    - Stress falls on the ending in *parlò, partì, credé* (written accent), and on the stem in *parlarono* (*par-LA-ro-no*).
    - *Noi* forms double the m: *parlammo, credemmo, partimmo* — don't confuse with the present *parliamo*.

    ### In writing
    Novels, short stories, biographies and history use it for completed past events, with the imperfetto for background.
  examples:
    - { es: "Arrivammo a Palermo all'alba e cercammo subito un caffè.", en: "We arrived in Palermo at dawn and immediately looked for a coffee." }
    - { es: "La nave partì da Cagliari con due ore di ritardo.", en: "The ship left Cagliari two hours late." }
    - { es: "Non credettero a una sola parola.", en: "They didn't believe a single word." }
    - { es: "Lavorò in miniera per vent'anni.", en: "He worked in the mines for twenty years." }
  pitfalls:
    - "*Parlò* (he spoke) needs the accent; *parlo* is 'I speak'."
    - "*Andammo* (we went) vs *andiamo* (we go / let's go)."
    - "Spanish speakers: *hablé, habló, hablaron* → *parlai, parlò, parlarono*: same use, but in most of Italy far less common in speech than the Spanish preterite."
  related: [g.passato-remoto-recognition, g.passato-remoto-irregular, g.passato-remoto-vs-prossimo]
  drills:
    - { es: "Quel giorno pranzammo in una trattoria di Ortigia.", en: "That day we had lunch in a trattoria in Ortigia." }
    - { es: "Finì gli studi e partì per l'America.", en: "He finished his studies and left for America." }
    - { es: "Vendettero la casa e si trasferirono a Sassari.", en: "They sold the house and moved to Sassari." }
- id: g.passato-remoto-irregular
  level: c1
  title: "Irregular passato remoto: the 1-3-3 pattern"
  summary: "Strong verbs are irregular only in io, lui and loro: ebbi, ebbe, ebbero; feci, fece, fecero."
  explanation: |
    Most irregular verbs follow the **1-3-3 rule**: irregular in the **1st singular, 3rd singular and 3rd plural**; regular elsewhere (built on the infinitive stem).

    | | avere | fare | prendere | venire |
    |---|---|---|---|---|
    | io | **ebbi** | **feci** | **presi** | **venni** |
    | tu | avesti | facesti | prendesti | venisti |
    | lui / lei | **ebbe** | **fece** | **prese** | **venne** |
    | noi | avemmo | facemmo | prendemmo | venimmo |
    | voi | aveste | faceste | prendeste | veniste |
    | loro | **ebbero** | **fecero** | **presero** | **vennero** |

    ### Learn the io form and you have the pattern
    *chiedere → chiesi, chiudere → chiusi, conoscere → conobbi, decidere → decisi, dire → dissi, leggere → lessi, mettere → misi, nascere → nacqui, piacere → piacqui, rimanere → rimasi, rispondere → risposi, sapere → seppi, scrivere → scrissi, vedere → vidi, vincere → vinsi, vivere → vissi, volere → volli, bere → bevvi, tenere → tenni, cadere → caddi.*

    ### Fully irregular
    *essere*: fui, fosti, fu, fummo, foste, furono — *dare*: diedi (detti), desti, diede (dette), demmo, deste, diedero (dettero) — *stare*: stetti, stesti, stette, stemmo, steste, stettero.
  examples:
    - { es: "Verga nacque a Catania nel 1840.", en: "Verga was born in Catania in 1840." }
    - { es: "Quando lo vidi, capii subito che qualcosa non andava.", en: "When I saw him, I immediately understood something was wrong." }
    - { es: "Mi disse che sarebbe tornato, ma non tornò mai.", en: "He told me he'd come back, but he never did." }
    - { es: "Stettero in silenzio per un lungo momento.", en: "They stood in silence for a long moment." }
  pitfalls:
    - "*Fece* (did) vs *fu* (was): very common confusion."
    - "*Tu* and *noi, voi* are regular: *facesti, facemmo*, not *fecesti*."
    - "*Diede* / *dette* are both correct; *diede* is more common."
  related: [g.passato-remoto-forms, g.participles-irregular]
  drills:
    - { es: "Lessi il libro in una notte.", en: "I read the book in one night." }
    - { es: "Ebbero sei figli e vissero a Nuoro.", en: "They had six children and lived in Nuoro." }
    - { es: "Seppi la notizia solo il giorno dopo.", en: "I heard the news only the next day." }
    - { es: "Volle vedere il mare un'ultima volta.", en: "She wanted to see the sea one last time." }
- id: g.passato-remoto-vs-prossimo
  level: c1
  title: "Passato remoto or passato prossimo?"
  summary: "Distance and connection to the present, register, and regional habit all play a part."
  explanation: |
    ### The textbook rule
    | passato prossimo | passato remoto |
    |---|---|
    | past events still connected to the present | past events felt as closed and distant |
    | *Ho studiato a Palermo* (and it still matters) | *Mio nonno emigrò in Argentina nel 1920.* |
    | conversation, news, emails | narrative, history, literature, formal biography |

    ### In real usage
    - **North**: speech uses almost only the passato prossimo, even for remote events.
    - **Tuscany**: the passato remoto survives in speech for the recent past.
    - **South and Sicily**: the passato remoto is the everyday past, even for this morning: *Stamattina mi alzai presto.*

    ### Mixing them
    A story can switch: narrative backbone in the remoto, comments to the reader in the prossimo: *Garibaldi sbarcò a Marsala nel 1860; questo episodio ha cambiato la storia d'Italia.*
  examples:
    - { es: "Mia nonna partì per l'America nel 1950 e non è mai tornata.", en: "My grandmother left for America in 1950 and has never come back." }
    - { es: "Stamattina ho preso il treno delle sette.", en: "This morning I took the seven o'clock train." }
    - { es: "Stamattina pigliai il treno delle sette.", en: "This morning I caught the seven o'clock train. (Sicilian regional)" }
  pitfalls:
    - "Don't use the passato remoto for this morning or yesterday in standard Italian, unless you write narrative."
    - "Mixing is fine when the meaning changes; random switching in one narrative is not."
    - "Spanish speakers: the *pretérito perfecto / indefinido* split of Spain is similar but not identical: Italian uses the passato prossimo far more."
  variant: "In Sicily *pigliare* (for *prendere*) and the passato remoto in conversation are both regional. In Sardinia the passato prossimo dominates, like in the North."
  related: [g.passato-remoto-forms, g.passato-prossimo-avere, g.regional-italian-south]
  drills:
    - { es: "Dante morì a Ravenna nel 1321.", en: "Dante died in Ravenna in 1321." }
    - { es: "Ieri sera abbiamo cenato a Cefalù.", en: "Last night we had dinner in Cefalù." }
    - { es: "I Normanni conquistarono la Sicilia nell'XI secolo.", en: "The Normans conquered Sicily in the 11th century." }
- id: g.trapassato-remoto
  level: c1
  title: "The trapassato remoto: ebbe finito, fu partito"
  summary: "passato remoto of avere / essere + participle, after appena, dopo che, quando, in literary narrative."
  explanation: |
    | | avere | essere |
    |---|---|---|
    | io | ebbi finito | fui partito/a |
    | lui / lei | ebbe finito | fu partito/a |
    | loro | ebbero finito | furono partiti/e |

    ### Use
    Only in **literary narrative**, in a time clause introduced by *appena, dopo che, quando, non appena, (non) prima che*, with the main verb in the **passato remoto**:
    - *Appena ebbe finito di mangiare, uscì.* — As soon as he had finished eating, he went out.
    - *Dopo che furono partiti, la casa restò vuota.*

    You need to recognise it; in your own writing a past infinitive or participle often sounds more modern: *Finito di mangiare, uscì. Dopo aver mangiato, uscì.*
  examples:
    - { es: "Quando ebbe letto la lettera, la bruciò.", en: "When she had read the letter, she burned it." }
    - { es: "Non appena fu arrivato a Siracusa, scrisse alla madre.", en: "As soon as he had arrived in Syracuse, he wrote to his mother." }
    - { es: "Dopo che ebbero cenato, i pescatori tornarono in mare.", en: "After they had dined, the fishermen went back to sea." }
  pitfalls:
    - "Never in main clauses: *ebbe finito* appears only after *appena, dopo che, quando*."
    - "Never with a passato prossimo main verb: use the trapassato prossimo there."
    - "Spanish speakers: it matches the Spanish *pretérito anterior* (*hubo terminado*), equally literary."
  related: [g.trapassato-prossimo, g.passato-remoto-irregular, g.literary-language]
  drills:
    - { es: "Appena ebbe detto queste parole, se ne pentì.", en: "No sooner had he said these words than he regretted them." }
    - { es: "Quando fu uscito, tutti risero.", en: "When he had gone out, everyone laughed." }
    - { es: "Dopo che ebbe chiuso la porta, si sedette.", en: "After she had shut the door, she sat down." }
- id: g.bureaucratic-italian
  level: c1
  title: "Burocratese: the language of forms and officialdom"
  summary: "Il sottoscritto, ai sensi di, previa, si prega di, in data odierna — recognise it, simplify it."
  explanation: |
    Italian bureaucracy has its own style, nicknamed *burocratese*. You need to **understand** it for forms, contracts and notices.

    | bureaucratic | plain | English |
    |---|---|---|
    | *Il sottoscritto / La sottoscritta* | *Io* | I, the undersigned |
    | *ai sensi dell'art. 5* | *secondo l'articolo 5* | pursuant to article 5 |
    | *previa presentazione di* | *dopo aver presentato* | upon presentation of |
    | *in data odierna* | *oggi* | today's date |
    | *si prega di / si invita a* | *per favore* | you are requested to |
    | *codesto ufficio* | *il vostro ufficio* | your office |
    | *provvedere al pagamento* | *pagare* | to make payment |
    | *il / la richiedente* | *chi fa la domanda* | the applicant |
    | *in allegato, allegare* | — | attached, attach |

    ### Typical features
    Nominal style (*effettuare il pagamento*), present participles (*il richiedente, la parte contraente*), impersonal *si*, passive, Latinisms (*ex, ad hoc, una tantum*), long sentences.
  examples:
    - { es: "Il sottoscritto Mario Rossi dichiara di essere residente a Cagliari.", en: "I, the undersigned Mario Rossi, declare that I am resident in Cagliari." }
    - { es: "Si prega di allegare copia del documento d'identità.", en: "Please attach a copy of your identity document." }
    - { es: "Il rimborso sarà effettuato previa verifica dei dati.", en: "The refund will be made after the data has been checked." }
    - { es: "Ai sensi della normativa vigente, l'ufficio resterà chiuso.", en: "Under current regulations, the office will remain closed." }
  pitfalls:
    - "*Codesto* in bureaucratic letters means 'your' (the addressee's office), not 'that'."
    - "Don't imitate *burocratese* in normal writing: Italian style guides recommend plain language."
    - "*Previa* agrees with the noun: *previa autorizzazione, previo pagamento*."
  related: [g.legal-register, g.nominalization, g.formal-letters]
  drills:
    - { es: "La domanda va presentata entro e non oltre il 30 giugno.", en: "Applications must be submitted no later than 30 June." }
    - { es: "Il pagamento può essere effettuato presso qualsiasi ufficio postale.", en: "Payment can be made at any post office." }
    - { es: "La sottoscritta chiede il rilascio del certificato di residenza.", en: "I, the undersigned, request a certificate of residence." }
- id: g.participio-assoluto
  level: c1
  title: "The absolute participle: Finita la cena, uscimmo"
  summary: "A past participle (agreeing with its own noun) opens a clause meaning 'once / after X had been done'."
  explanation: |
    The past participle can stand alone at the start of a sentence, agreeing with **its own subject or object**:
    - *Finita la cena, uscimmo.* — Once dinner was over, we went out.
    - *Arrivati a Olbia, prendemmo il traghetto.* — Having arrived in Olbia, we took the ferry.
    - *Letta la lettera, la strappò.* — Having read the letter, she tore it up.

    ### Agreement
    - Transitive verbs agree with the **object**: *Fatti i compiti, i bambini giocarono.*
    - Intransitive verbs agree with the **subject**: *Partita la nave, il porto si svuotò.*

    ### Pronouns attach
    *Salutatili, se ne andò.* (Having said goodbye to them, he left.)

    ### Meaning
    Mostly time (after), sometimes cause or concession: *Considerata la situazione…* (given the situation), *Dato il ritardo…*, *Una volta capito il meccanismo…*
  examples:
    - { es: "Visitata Cagliari, ci spostammo verso Nuoro.", en: "Having visited Cagliari, we moved on towards Nuoro." }
    - { es: "Considerato il maltempo, la gita è annullata.", en: "Given the bad weather, the trip is cancelled." }
    - { es: "Una volta finiti gli esami, partiremo per la Sardegna.", en: "Once the exams are over, we'll leave for Sardinia." }
    - { es: "Detto questo, passiamo al secondo punto.", en: "That said, let's move on to the second point." }
  pitfalls:
    - "Agreement with the noun that follows: *finite le vacanze*, not *finito le vacanze*."
    - "Don't overuse it in conversation; *dopo aver…* or *quando…* sound more natural."
    - "Spanish speakers: *terminada la cena* → *finita la cena*: the same structure exists in Spanish."
  related: [g.gerundio-composto, g.subordination-implicit, g.bureaucratic-italian]
  drills:
    - { es: "Pagato il conto, uscimmo dal ristorante.", en: "Having paid the bill, we left the restaurant." }
    - { es: "Dette queste parole, se ne andò.", en: "Having said these words, he left." }
    - { es: "Tornati a casa, ci mettemmo a cucinare.", en: "Once home, we started cooking." }
- id: g.infinito-sostantivato
  level: c1
  title: "Il mangiare, l'essere — the infinitive as a noun"
  summary: "With the article, an infinitive becomes a masculine noun: il vivere bene, l'andare e il venire."
  explanation: |
    Any infinitive can act as a **masculine noun**, with or without an article:
    - *Viaggiare apre la mente.* (subject, no article)
    - *Il viaggiare in treno è rilassante.* (with article: more literary)
    - *Il mangiare siciliano* — Sicilian food.
    - *Al calar del sole* — at sunset (*a + il + calare*, apocopated).
    - *Nel leggere la lettera, impallidì.* — On reading the letter, she turned pale.

    ### Some have become ordinary nouns
    *il dovere* (duty), *il potere* (power), *il piacere* (pleasure), *il parere* (opinion), *il sapere* (knowledge), *l'essere* (being), *il dispiacere* (sorrow), *gli averi* (possessions).

    ### English '-ing' as a noun
    Italian uses the infinitive, not the gerund: *Nuotare fa bene. Odio aspettare.*
  examples:
    - { es: "Il saper ascoltare è una dote rara.", en: "Knowing how to listen is a rare gift." }
    - { es: "Nel salutarla, le baciò la mano.", en: "As he greeted her, he kissed her hand." }
    - { es: "Al suo arrivare, tutti tacquero.", en: "On his arrival, everyone fell silent." }
    - { es: "Fare il bagno a Stintino è un piacere.", en: "Swimming at Stintino is a pleasure." }
  pitfalls:
    - "'Swimming is good for you' is *Nuotare fa bene*, never *Nuotando fa bene*."
    - "*Nel* + infinitive = while / on doing: *nel dire questo*."
    - "Spanish speakers: *al llegar* → *all'arrivare* / *arrivando*; same idea, but Italian uses it less."
  related: [g.nominalization, g.gerundio-uses]
  drills:
    - { es: "Il vivere in un'isola ha i suoi ritmi.", en: "Living on an island has its own rhythms." }
    - { es: "Nel tornare a casa, ho incontrato Gavino.", en: "On my way home, I met Gavino." }
    - { es: "È nostro dovere aiutarli.", en: "It's our duty to help them." }
- id: g.discourse-markers-advanced
  level: c1
  title: "Advanced discourse markers: ebbene, peraltro, laddove, nella misura in cui"
  summary: "Formal markers to concede, add, specify, contrast and reformulate in long texts."
  explanation: |
    | function | markers |
    |---|---|
    | adding | *peraltro, per giunta, oltretutto, altresì* (formal) |
    | contrast / concession | *ciononostante, nondimeno, ciò nonostante, pur tuttavia, d'altronde* |
    | specifying | *in particolare, nello specifico, segnatamente* |
    | condition / extent | *nella misura in cui, laddove* (+ congiuntivo: where, whereas), *qualora* |
    | reformulating | *ossia, ovvero, vale a dire, in altri termini, per meglio dire* |
    | resuming | *ebbene, orbene* (well then), *ciò premesso, ciò detto* |
    | concluding | *in definitiva, in ultima analisi, pertanto, dunque* |

    - *D'altronde* = after all, besides (justification): *D'altronde, era prevedibile.*
    - *Laddove* in formal writing = where / whereas: *laddove possibile* (where possible).
    - *Peraltro* = moreover / however (context).
  examples:
    - { es: "Il progetto, peraltro già approvato, è stato rinviato.", en: "The project, which had moreover already been approved, was postponed." }
    - { es: "Ebbene, veniamo al punto.", en: "Well then, let's get to the point." }
    - { es: "Interverremo nella misura in cui sarà necessario.", en: "We will intervene to the extent necessary." }
    - { es: "D'altronde, nessuno se lo aspettava.", en: "After all, nobody expected it." }
  pitfalls:
    - "*Altresì* (also) and *orbene* are very formal: don't use them in speech."
    - "*Laddove* means 'where / whereas', not 'there where' in everyday sense."
    - "Spanish speakers: *no obstante* → *nondimeno / ciononostante*; *en la medida en que* → *nella misura in cui*."
  related: [g.argumentation-connectors, g.anaphora-cohesion]
  drills:
    - { es: "Ciò premesso, passiamo alle conclusioni.", en: "That being said, let's move on to the conclusions." }
    - { es: "I costi sono alti; ciononostante, il progetto va avanti.", en: "The costs are high; nevertheless, the project is going ahead." }
    - { es: "Si tratta, in altri termini, di una sconfitta.", en: "It is, in other words, a defeat." }
- id: g.anaphora-cohesion
  level: c1
  title: "Cohesion: quest'ultimo, il suddetto, tale, rispettivamente"
  summary: "Referring back clearly across long texts without repeating nouns."
  explanation: |
    | device | example |
    |---|---|
    | *quest'ultimo / quest'ultima* (the latter) | *Ho parlato con Marco e Luigi; quest'ultimo era d'accordo.* |
    | *il primo… il secondo* (the former… the latter) | *Tra Cagliari e Sassari, la prima è più grande.* |
    | *il suddetto / il succitato / il predetto* (formal) | *la suddetta legge* |
    | *tale / tali* (such, this) | *Tale decisione è stata criticata.* |
    | *esso / essa / essi / esse* (it, they — written) | *Il fenomeno è noto; esso fu descritto…* |
    | *ciò* (this, that) | *Ciò dimostra che…* |
    | synonyms and hypernyms | *Verga… lo scrittore catanese… l'autore dei Malavoglia* |
    | *rispettivamente* | *Anna e Pia hanno 20 e 25 anni rispettivamente.* |
    | *il quale* to resolve ambiguity | see B2 |

    Italian style dislikes repeating the same noun: vary with synonyms and pronouns.
  examples:
    - { es: "Pirandello e Verga erano siciliani; quest'ultimo era nato a Catania.", en: "Pirandello and Verga were Sicilian; the latter was born in Catania." }
    - { es: "Tale proposta non è stata accolta.", en: "This proposal was not accepted." }
    - { es: "Ciò dimostra che il problema è antico.", en: "This shows that the problem is an old one." }
  pitfalls:
    - "*Quest'ultimo* refers to the last-mentioned noun: check that it is unambiguous."
    - "*Esso / essa* for people sounds old-fashioned: use *egli / ella* (formal) or *lui / lei*."
    - "Spanish speakers: *este último* → *quest'ultimo*; *dicho* → *il suddetto / tale*."
  related: [g.discourse-markers-advanced, g.relative-il-quale]
  drills:
    - { es: "Il sindaco e l'assessore si sono incontrati; quest'ultimo ha poi rilasciato un'intervista.", en: "The mayor and the councillor met; the latter then gave an interview." }
    - { es: "Tali dati vanno verificati.", en: "Such data must be verified." }
    - { es: "Il nuraghe, costruzione tipica della Sardegna, risale all'età del bronzo.", en: "The nuraghe, a building typical of Sardinia, dates back to the Bronze Age." }
- id: g.text-types
  level: c1
  title: "Text types: narrativo, descrittivo, espositivo, argomentativo, regolativo"
  summary: "Recognising text types and their typical tenses, connectors and style."
  explanation: |
    | type | aim | typical features |
    |---|---|---|
    | **narrativo** | tell events | passato remoto / prossimo + imperfetto, time connectors |
    | **descrittivo** | describe | imperfetto or presente, adjectives, place expressions |
    | **espositivo** | inform, explain | presente, impersonal *si*, passive, definitions, examples |
    | **argomentativo** | persuade | thesis, *ritengo che* + congiuntivo, concession, conclusion |
    | **regolativo** | instruct | imperative, infinitive (*Agitare prima dell'uso*), *si* passivante, numbered steps |

    ### Other genres to know
    *la recensione* (review), *il verbale* (minutes), *la relazione* (report), *il riassunto* (summary), *la lettera di motivazione*, *l'articolo di cronaca*.

    In a *riassunto*, Italian uses the present tense and the third person, and avoids direct speech.
  examples:
    - { es: "Agitare prima dell'uso. Conservare in luogo fresco.", en: "Shake before use. Store in a cool place." }
    - { es: "La Sardegna è la seconda isola più grande del Mediterraneo.", en: "Sardinia is the second-largest island in the Mediterranean." }
    - { es: "Nel romanzo, il protagonista torna nel suo paese dopo molti anni.", en: "In the novel, the protagonist returns to his village after many years." }
  pitfalls:
    - "Instructions in Italian often use the infinitive, not the imperative: *Non toccare*."
    - "A *riassunto* is in the present, even when the story is in the past."
    - "Don't mix registers: an *espositivo* text shouldn't contain *secondo me*."
  related: [g.essay-structure, g.academic-register]
  drills:
    - { es: "Tagliare le melanzane a fette e friggerle.", en: "Slice the aubergines and fry them." }
    - { es: "L'autore descrive la vita dei pescatori di Aci Trezza.", en: "The author describes the life of the fishermen of Aci Trezza." }
    - { es: "Il testo si divide in tre parti.", en: "The text is divided into three parts." }
- id: g.idioms
  level: c1
  title: "Idioms: in bocca al lupo, prendere un granchio, costare un occhio della testa"
  summary: "Frequent fixed expressions that can't be translated word for word."
  explanation: |
    | idiom | literal | meaning |
    |---|---|---|
    | *In bocca al lupo! — Crepi!* | in the wolf's mouth — may it die | good luck! — thanks |
    | *prendere un granchio* | catch a crab | make a blunder |
    | *costare un occhio della testa* | cost an eye from the head | cost an arm and a leg |
    | *avere le mani bucate* | have holed hands | be a spendthrift |
    | *non avere peli sulla lingua* | have no hairs on the tongue | speak one's mind |
    | *essere al verde* | be at the green | be broke |
    | *fare il ponte* | make the bridge | take a long weekend |
    | *rompere le scatole* | break the boxes | annoy (polite version) |
    | *acqua in bocca!* | water in the mouth | keep it secret! |
    | *tagliare la corda* | cut the rope | sneak off |
    | *avere la testa fra le nuvole* | head in the clouds | be absent-minded |
    | *farsi in quattro* | make oneself into four | bend over backwards |
    | *non vedere l'ora di* | not see the hour | can't wait to |
    | *essere in gamba* | be in leg | be capable, smart |
  examples:
    - { es: "Domani hai l'esame? In bocca al lupo! — Crepi!", en: "You've got your exam tomorrow? Good luck! — Thanks!" }
    - { es: "Non vedo l'ora di vedere il mare di Villasimius.", en: "I can't wait to see the sea at Villasimius." }
    - { es: "Mi sa che ho preso un granchio.", en: "I think I've made a blunder." }
    - { es: "Tua sorella è proprio in gamba.", en: "Your sister is really capable." }
  pitfalls:
    - "Reply to *In bocca al lupo* with *Crepi!* (or *Crepi il lupo!*), not *Grazie*."
    - "Idioms have fixed wording: *costa un occhio della testa*, not *un occhio dalla testa*."
    - "Spanish speakers: some match (*estar sin blanca* ≈ *essere al verde*), many don't: check before translating."
  related: [g.proverbs, g.fixed-expressions]
  drills:
    - { es: "Questo mese sono al verde.", en: "I'm broke this month." }
    - { es: "Si è fatto in quattro per aiutarci.", en: "He bent over backwards to help us." }
    - { es: "Acqua in bocca, mi raccomando!", en: "Keep it to yourself, OK?" }
    - { es: "Hai sempre la testa fra le nuvole!", en: "You're always daydreaming!" }
- id: g.proverbs
  level: c1
  title: "Proverbs: chi va piano va sano e va lontano"
  summary: "Common Italian proverbs, how they are used and often shortened."
  explanation: |
    | proverb | meaning / English equivalent |
    |---|---|
    | *Chi va piano va sano e va lontano.* | Slow and steady wins the race. |
    | *Chi dorme non piglia pesci.* | The early bird catches the worm. |
    | *Tra il dire e il fare c'è di mezzo il mare.* | Easier said than done. |
    | *Meglio tardi che mai.* | Better late than never. |
    | *Chi trova un amico trova un tesoro.* | A friend is a treasure. |
    | *L'abito non fa il monaco.* | Don't judge a book by its cover. |
    | *Non tutte le ciambelle riescono col buco.* | Not everything turns out perfectly. |
    | *Paese che vai, usanza che trovi.* | When in Rome, do as the Romans do. |
    | *Rosso di sera, bel tempo si spera.* | Red sky at night, shepherd's delight. |
    | *Chi la fa l'aspetti.* | What goes around comes around. |
    | *Moglie e buoi dei paesi tuoi.* | Marry close to home (old-fashioned). |

    Italians often say only the first half: *Chi dorme…*, *Paese che vai…*, *Tra il dire e il fare…* — the listener completes it.
  examples:
    - { es: "Hai trovato lavoro? Meglio tardi che mai!", en: "You've found a job? Better late than never!" }
    - { es: "Paese che vai, usanza che trovi: in Sardegna si cena tardi.", en: "When in Rome…: in Sardinia people have dinner late." }
    - { es: "Non giudicarlo così: l'abito non fa il monaco.", en: "Don't judge him like that: appearances can be deceptive." }
  pitfalls:
    - "Don't overuse proverbs: one well-placed is effective, three sound like a parody."
    - "Many proverbs use the old verb *pigliare* and *chi* + singular verb."
    - "Spanish speakers: many have close cousins (*más vale tarde que nunca*), but wording differs."
  related: [g.idioms, g.relative-chi-quello-che]
  drills:
    - { es: "Chi va piano va sano e va lontano.", en: "Slow and steady wins the race." }
    - { es: "Tra il dire e il fare c'è di mezzo il mare.", en: "Easier said than done." }
    - { es: "Chi la fa l'aspetti!", en: "You'll get what's coming to you!" }
- id: g.fixed-expressions
  level: c1
  title: "Fixed expressions: man mano, di punto in bianco, a malapena"
  summary: "Adverbial phrases and binomials that make speech and writing sound native."
  explanation: |
    | expression | meaning |
    |---|---|
    | *man mano / a mano a mano* | gradually |
    | *di punto in bianco* | all of a sudden |
    | *a malapena* | barely |
    | *a vanvera* | at random, without thinking |
    | *a squarciagola* | at the top of one's voice |
    | *di sfuggita* | in passing |
    | *alla buona* | simply, informally |
    | *a più non posso* | as hard as one can |
    | *a stento* | with difficulty |
    | *per filo e per segno* | in every detail |
    | *bene o male* | more or less, somehow |
    | *pian piano* | little by little |
    | *sano e salvo* | safe and sound |
    | *di tanto in tanto* | from time to time |
    | *in men che non si dica* | in no time at all |
  examples:
    - { es: "Di punto in bianco ha deciso di trasferirsi a Lampedusa.", en: "Out of the blue he decided to move to Lampedusa." }
    - { es: "Mi ha raccontato tutto per filo e per segno.", en: "She told me everything in minute detail." }
    - { es: "Siamo arrivati sani e salvi a Olbia.", en: "We arrived safe and sound in Olbia." }
    - { es: "Pian piano mi sto abituando al caldo.", en: "Little by little I'm getting used to the heat." }
  pitfalls:
    - "*Sano e salvo* agrees: *sane e salve*, *sani e salvi*."
    - "*A malapena* (barely) vs *male* (badly): *ci vedo a malapena*."
    - "Spanish speakers: *poco a poco* → *pian piano / a poco a poco*; *de repente* → *di punto in bianco* (stronger)."
  related: [g.idioms, g.proverbs]
  drills:
    - { es: "Man mano che leggi, capirai.", en: "As you read on, you'll understand." }
    - { es: "Cantavano a squarciagola.", en: "They were singing at the top of their voices." }
    - { es: "Non parlare a vanvera!", en: "Don't talk nonsense!" }
- id: g.academic-register
  level: c1
  title: "Academic Italian: impersonal, hedged, precise"
  summary: "si ritiene, è opportuno, risulta, si evince, in tal senso — the voice of essays, theses and reports."
  explanation: |
    ### Typical features
    - **Impersonal and passive**: *si ritiene che, si è osservato, è stato dimostrato, risulta che*.
    - **Hedging**: *sembrerebbe, è plausibile che, non è escluso che, in una certa misura*.
    - **First person plural** (authorial *we*): *come vedremo, abbiamo analizzato*.
    - **Precise verbs** instead of *fare / dire / mettere*: *effettuare, condurre, sostenere, affermare, evidenziare, collocare*.
    - **Nominal style**: *l'analisi dei dati, la diffusione del fenomeno*.

    ### Useful phrases
    | | |
    |---|---|
    | *Il presente lavoro si propone di…* | This paper aims to… |
    | *Dai dati si evince che…* | The data show that… |
    | *In tal senso… / A tal proposito…* | In this respect… |
    | *Come sostiene X (2019)…* | As X argues… |
    | *Si tratta di…* | It is a matter of… |
    | *Resta da chiarire se…* | It remains to be clarified whether… |
  examples:
    - { es: "Il presente studio si propone di analizzare l'emigrazione sarda.", en: "This study aims to analyse Sardinian emigration." }
    - { es: "Dai risultati si evince un netto calo della popolazione.", en: "The results show a sharp fall in population." }
    - { es: "Non è escluso che il fenomeno abbia origini più antiche.", en: "It cannot be ruled out that the phenomenon has older origins." }
    - { es: "Come vedremo nel prossimo capitolo, i dati sono parziali.", en: "As we shall see in the next chapter, the data are incomplete." }
  pitfalls:
    - "Avoid *io penso* in academic writing: use *si ritiene*, *riteniamo*."
    - "*Si evince* = it can be inferred; don't use it in conversation."
    - "Spanish speakers: *se desprende que* → *si evince che*; *el presente trabajo* → *il presente lavoro*."
  related: [g.nominalization, g.register-formal-informal, g.scientific-register]
  drills:
    - { es: "Si ritiene che l'opera risalga al XIV secolo.", en: "The work is believed to date from the 14th century." }
    - { es: "A tal proposito, è utile ricordare un precedente.", en: "In this respect, it is worth recalling a precedent." }
    - { es: "Resta da chiarire se i dati siano affidabili.", en: "It remains to be clarified whether the data are reliable." }
- id: g.nominalization
  level: c1
  title: "Nominal style: from verbs to nouns"
  summary: "la chiusura dei porti instead of 'chiudono i porti': nouns in -zione, -mento, -tura, -ità."
  explanation: |
    Formal Italian (news, reports, bureaucracy) packs information into **nouns**:

    | verbal | nominal |
    |---|---|
    | *I porti chiudono a causa del vento.* | *Chiusura dei porti per vento.* |
    | *Il governo ha deciso di aumentare le tasse.* | *La decisione del governo di aumentare le tasse.* |
    | *Quando arriva il treno…* | *All'arrivo del treno…* |

    ### Common suffixes
    | suffix | from | examples |
    |---|---|---|
    | *-zione* | verbs in -are | *realizzazione, approvazione, presentazione* |
    | *-mento* | verbs | *aumento, cambiamento, svolgimento* |
    | *-tura* | verbs | *chiusura, apertura, lettura* |
    | *-ità, -ezza* | adjectives | *possibilità, difficoltà, chiarezza, bellezza* |
    | zero / short | verbs | *arrivo, ritorno, rinvio, calo, uso* |

    Nominal style is dense and impersonal; in speech and clear writing, prefer verbs.
  examples:
    - { es: "Lo sciopero ha causato la cancellazione di molti voli.", en: "The strike caused the cancellation of many flights." }
    - { es: "Al momento della consegna, verificare il contenuto.", en: "On delivery, check the contents." }
    - { es: "L'aumento dei prezzi preoccupa le famiglie.", en: "Rising prices worry families." }
  pitfalls:
    - "Don't stack too many nouns: *la verifica della realizzazione dell'aumento* is unreadable."
    - "Some short nouns have a different gender from what you expect: *il calo, la sosta, il rinvio*."
    - "Spanish speakers: *-ción* → *-zione*, *-miento* → *-mento*, *-dad* → *-tà*."
  related: [g.academic-register, g.word-formation, g.journalistic-language]
  drills:
    - { es: "La ristrutturazione del porto durerà due anni.", en: "The refurbishment of the port will take two years." }
    - { es: "Dopo l'approvazione della legge, ci sono state proteste.", en: "After the law was passed, there were protests." }
    - { es: "Il calo delle nascite è evidente.", en: "The fall in births is clear." }
- id: g.presentations
  level: c1
  title: "Giving a presentation in Italian"
  summary: "Signposting: Vorrei iniziare con…, Passo ora a…, Come potete vedere…, Per concludere…"
  explanation: |
    | stage | phrases |
    |---|---|
    | opening | *Buongiorno a tutti e grazie di essere qui. Oggi vorrei parlarvi di…* |
    | outline | *La presentazione si articola in tre parti. In primo luogo… in seguito… infine…* |
    | moving on | *Passo ora a… / Veniamo adesso a… / Questo ci porta al secondo punto.* |
    | visuals | *Come potete vedere dal grafico… / In questa slide…* |
    | emphasis | *Vorrei sottolineare che… / Il dato più significativo è…* |
    | digression | *Apro una breve parentesi… / Chiusa la parentesi…* |
    | concluding | *Per concludere… / Riassumendo… / In sintesi…* |
    | questions | *Sono a vostra disposizione per eventuali domande. — Bella domanda!* |

    With a formal audience use *voi* (to the group) and *Lei* (to individuals); *vi ringrazio per l'attenzione* closes almost every Italian talk.
  examples:
    - { es: "Oggi vorrei parlarvi del turismo sostenibile in Sardegna.", en: "Today I'd like to talk to you about sustainable tourism in Sardinia." }
    - { es: "Come potete vedere dal grafico, le presenze sono raddoppiate.", en: "As you can see from the graph, visitor numbers have doubled." }
    - { es: "Passo ora al secondo punto.", en: "I'll now move on to the second point." }
    - { es: "Vi ringrazio per l'attenzione.", en: "Thank you for your attention." }
  pitfalls:
    - "*Slide* is used in Italian (*la slide, le slide*), invariable."
    - "Don't read your text: Italian audiences value fluent, slightly rhetorical delivery."
    - "*Eventuali domande* = any questions (not 'eventual')."
  related: [g.academic-register, g.discourse-markers-advanced]
  drills:
    - { es: "La presentazione si articola in tre parti.", en: "The presentation is divided into three parts." }
    - { es: "Vorrei sottolineare un aspetto importante.", en: "I'd like to stress an important point." }
    - { es: "Sono a disposizione per eventuali domande.", en: "I'm happy to answer any questions." }
- id: g.subordination-implicit
  level: c1
  title: "Implicit subordination: infinitive, gerund, participle"
  summary: "Replace a finite clause with an infinitive, gerund or participle when the subject is shared."
  explanation: |
    Italian prose often turns explicit clauses (with a conjugated verb) into **implicit** ones:

    | meaning | explicit | implicit |
    |---|---|---|
    | time (after) | *Dopo che ebbe mangiato…* | *Dopo aver mangiato… / Mangiato…* |
    | time (while) | *Mentre tornavo a casa…* | *Tornando a casa…* |
    | cause | *Poiché era stanco…* | *Essendo stanco… / Per la stanchezza…* |
    | purpose | *perché tu capisca* | *per capire* (same subject) |
    | concession | *Benché sapesse…* | *Pur sapendo…* |
    | condition | *Se lo avessi saputo…* | *A saperlo… / Sapendolo…* |
    | relative | *il treno che parte alle 8* | *il treno in partenza alle 8* |

    ### a + infinitive for conditions (colloquial-literary)
    *A pensarci bene, hai ragione.* (When I think about it…) *A saperlo, sarei venuto.* (Had I known…)

    Implicit clauses need the **same subject** as the main clause (except the absolute participle).
  examples:
    - { es: "A pensarci bene, non è una cattiva idea.", en: "Thinking about it, it's not a bad idea." }
    - { es: "Pur conoscendo il rischio, decise di partire.", en: "Despite knowing the risk, he decided to leave." }
    - { es: "Per arrivare in tempo, prendemmo un taxi.", en: "To arrive on time, we took a taxi." }
    - { es: "Il traghetto in partenza per Olbia è in ritardo.", en: "The ferry leaving for Olbia is delayed." }
  pitfalls:
    - "Different subjects need an explicit clause: *Uscendo, ho visto Anna* means I was the one leaving."
    - "*Per* + infinitive (purpose) requires the same subject; otherwise *perché* + congiuntivo."
    - "Spanish speakers: *de haberlo sabido* → *a saperlo / se l'avessi saputo*."
  related: [g.participio-assoluto, g.gerundio-composto, g.past-infinitive]
  drills:
    - { es: "A sentire lui, è tutto facile.", en: "To hear him tell it, it's all easy." }
    - { es: "Arrivati in cima, ci fermammo a guardare il mare.", en: "Having reached the top, we stopped to look at the sea." }
    - { es: "Pur essendo nato a Cagliari, parla poco il sardo.", en: "Although he was born in Cagliari, he speaks little Sardinian." }
- id: g.conditional-conjunctions
  level: c1
  title: "Qualora, nel caso in cui, purché, ammesso che — formal conditions"
  summary: "Conditional conjunctions that replace se in formal style, all with the congiuntivo."
  explanation: |
    | conjunction | meaning | example |
    |---|---|---|
    | *qualora* | if, should | *Qualora non fosse possibile, La avviseremo.* |
    | *nel caso in cui / nel caso che / caso mai* | in case, if | *Nel caso in cui piova, la cena sarà al chiuso.* |
    | *purché, a patto che, a condizione che* | provided that | *Accetto, a patto che paghi tu.* |
    | *ammesso che / ammesso e non concesso che* | assuming that (for argument's sake) | *Ammesso che sia vero…* |
    | *posto che, supposto che* | supposing | *Posto che tutti siano d'accordo…* |
    | *a meno che (non)* | unless | *A meno che non ci siano problemi.* |
    | *se mai, semmai* | if ever, if anything | *Semmai ti chiamo io.* |

    All take the **congiuntivo** (present or imperfetto, depending on likelihood and sequence). *Qualora* + congiuntivo imperfetto is the standard of contracts and official letters.
  examples:
    - { es: "Qualora desiderasse ulteriori informazioni, non esiti a contattarci.", en: "Should you require further information, do not hesitate to contact us." }
    - { es: "Nel caso in cui il volo venga cancellato, avrete diritto al rimborso.", en: "If the flight is cancelled, you'll be entitled to a refund." }
    - { es: "Ammesso e non concesso che tu abbia ragione, cosa proponi?", en: "Even assuming you're right, what do you propose?" }
    - { es: "Semmai, ci sentiamo domani.", en: "If need be, we'll talk tomorrow." }
  pitfalls:
    - "*Qualora* never takes the indicative or the conditional: *qualora fosse*."
    - "*Caso mai* (just in case) + congiuntivo: *caso mai piovesse*."
    - "Spanish speakers: *en caso de que* → *nel caso in cui*; *siempre que* (provided) → *purché*."
  related: [g.periodo-ipotetico-2, g.congiuntivo-conjunctions, g.legal-register]
  drills:
    - { es: "Qualora non riceviate la merce, contattate l'assistenza.", en: "Should you not receive the goods, contact customer service." }
    - { es: "Ti presto la barca, a condizione che tu me la riporti pulita.", en: "I'll lend you the boat, on condition you bring it back clean." }
    - { es: "Prendi l'ombrello, caso mai piovesse.", en: "Take the umbrella, just in case it rains." }
- id: g.word-order-marked
  level: c1
  title: "Marked word order: inversion and fronting for effect"
  summary: "Moving subjects after the verb and fronting elements for focus, rhythm and style."
  explanation: |
    Italian word order is flexible, and changes it carry meaning:

    ### Subject after the verb (new information)
    - *È arrivato Marco.* (Marco is the news) vs *Marco è arrivato.* (Marco is the topic)
    - *Ha telefonato tua madre.* — Your mother called.
    - Verbs of appearing / happening: *È successo un incidente. Sono nati due gemelli.*

    ### Focus fronting (contrast, without a pronoun)
    *MARCO ho visto, non Luca!* — stress on the fronted word, no doubling pronoun.

    ### Literary inversion
    - Adjective before noun for style: *un'antica e nobile famiglia*.
    - Verb before subject in narration: *Disse allora il vecchio…*
    - Hyperbaton in poetry (see C2).

    ### Questions
    Subject after the verb is natural: *Che cosa ha detto il professore?* (not *Che cosa il professore ha detto?*)
  examples:
    - { es: "È arrivato il pacco che aspettavi.", en: "The parcel you were waiting for has arrived." }
    - { es: "Non Cagliari, ma Sassari ho visitato!", en: "It was Sassari I visited, not Cagliari!" }
    - { es: "Che cosa ha risposto il direttore?", en: "What did the manager reply?" }
    - { es: "Mi sono sempre piaciute le isole.", en: "I've always liked islands." }
  pitfalls:
    - "*Che cosa il direttore ha risposto?* sounds wrong: put the subject after the verb in questions."
    - "Fronting for contrast has no pronoun (*IL VINO voglio*); fronting a topic needs one (*Il vino lo voglio rosso*)."
    - "Spanish speakers: Spanish works the same way (*ha llegado Marco*)."
  related: [g.dislocation, g.cleft-sentences, g.poetic-syntax]
  drills:
    - { es: "È scoppiato un temporale.", en: "A storm broke out." }
    - { es: "Dove abita tua sorella?", en: "Where does your sister live?" }
    - { es: "Disse allora il pescatore: 'Domani si parte.'", en: "Then the fisherman said: 'Tomorrow we leave.'" }
- id: g.politeness-strategies
  level: c1
  title: "Politeness: softening with imperfetto, conditional and mitigators"
  summary: "Volevo chiederLe, mi chiedevo se, le dispiacerebbe, un attimino, magari — saying things gently."
  explanation: |
    ### Tense as politeness
    | direct | softened |
    |---|---|
    | *Voglio un'informazione.* | *Volevo un'informazione.* (imperfetto of politeness) |
    | *Può aiutarmi?* | *Potrebbe aiutarmi? / Mi chiedevo se potesse aiutarmi.* |
    | *Devi venire.* | *Dovresti venire. / Sarebbe meglio se venissi.* |

    ### Mitigators
    *un attimo / un attimino, un momentino, un po', magari, per caso, se non è un disturbo, se non Le dispiace, gentilmente, cortesemente*:
    - *Mi passeresti per caso il sale?*
    - *Magari ci sentiamo domani?* (a soft proposal)

    ### Softening criticism
    *Non è proprio il massimo* (it's not ideal), *forse si potrebbe…*, *non sono del tutto convinto*, *mi permetto di suggerire…*

    ### Refusing politely
    *Mi piacerebbe, ma purtroppo…*, *Grazie, sei gentilissimo, però…*
  examples:
    - { es: "Buongiorno, volevo sapere se avete una camera libera.", en: "Good morning, I was wondering if you have a room available." }
    - { es: "Le dispiacerebbe spostarsi un attimino?", en: "Would you mind moving over a tiny bit?" }
    - { es: "Il progetto non è proprio il massimo, forse si potrebbe rivedere.", en: "The project isn't ideal; maybe it could be revised." }
    - { es: "Mi piacerebbe tanto, ma purtroppo ho già un impegno.", en: "I'd love to, but unfortunately I already have plans." }
  pitfalls:
    - "*Volevo* in a request is present in meaning: *Volevo un caffè* = I'd like a coffee."
    - "*Cortesemente* in a written request can sound curt ('kindly'): use with care."
    - "Spanish speakers: *quería preguntar* → *volevo chiedere*: the same polite imperfetto."
  related: [g.condizionale-courtesy, g.irony-humour, g.discourse-particles]
  drills:
    - { es: "Mi chiedevo se fosse possibile cambiare la data.", en: "I was wondering if it would be possible to change the date." }
    - { es: "Volevo chiederti un piccolo favore.", en: "I wanted to ask you a small favour." }
    - { es: "Se non è un disturbo, passerei domani.", en: "If it's no trouble, I'd drop by tomorrow." }
- id: g.irony-humour
  level: c1
  title: "Irony and humour: complimenti!, ci mancava solo questa"
  summary: "Ironic phrases, understatement and exaggeration in everyday Italian."
  explanation: |
    | phrase | literal | ironic meaning |
    |---|---|---|
    | *Complimenti!* | congratulations | well done (after a mistake) |
    | *Bravo, bravo!* | well done | nice going (sarcastic) |
    | *Ci mancava solo questa!* | only this was missing | that's all we needed! |
    | *Che bella sorpresa!* | what a nice surprise | (when it isn't) |
    | *Sì, come no!* | yes, why not | yeah, right! |
    | *Grazie tante!* | thanks a lot | thanks for nothing |
    | *Figuriamoci!* | imagine that | as if! / of course not |
    | *Hai scoperto l'America!* | you discovered America | tell me something new |
    | *Non è mica la fine del mondo.* | it's not the end of the world | (understatement) |

    ### Tools
    - **Antiphrasis** (saying the opposite): *Che giornata splendida!* in pouring rain.
    - **Exaggeration**: *Ti ho aspettato un secolo!*
    - **Understatement** with *mica, non proprio, un tantino*: *È un tantino in ritardo* (he's three hours late).
    - Intonation and *eh* / *vabbè* signal irony.
  examples:
    - { es: "Hai perso di nuovo le chiavi? Complimenti!", en: "You've lost your keys again? Well done!" }
    - { es: "Ora piove pure. Ci mancava solo questa!", en: "Now it's raining too. That's all we needed!" }
    - { es: "Ti aiuta lui? Sì, come no!", en: "He'll help you? Yeah, right!" }
    - { es: "Siamo un tantino in ritardo, eh?", en: "We're a teeny bit late, aren't we?" }
  pitfalls:
    - "*Grazie tante* can be sincere or sarcastic: the tone decides."
    - "*Figurati!* (don't mention it) vs *Figuriamoci!* (as if!): related but different functions."
    - "Irony depends on tone: in writing add context or an emoji to avoid misunderstandings."
  related: [g.politeness-strategies, g.discourse-particles, g.wordplay]
  drills:
    - { es: "Grazie tante per l'aiuto!", en: "Thanks a lot for the help! (ironic)" }
    - { es: "Hai scoperto l'America!", en: "Tell me something I don't know!" }
    - { es: "Che bella giornata per andare al mare!", en: "What a lovely day for the beach! (in the rain)" }
- id: g.discourse-particles
  level: c1
  title: "Discourse particles: mica, pure, dai, figurati, ecco, insomma"
  summary: "Small words that carry attitude: surprise, encouragement, impatience, concession."
  explanation: |
    | particle | function | example |
    |---|---|---|
    | *mica* | strengthens a negation | *Non è mica facile!* |
    | *pure* | go ahead / even / also | *Entra pure! Ci mancava pure questo.* |
    | *dai* | come on (encourage or protest) | *Dai, andiamo! — Ma dai!* (No way!) |
    | *figurati / si figuri* | not at all, don't mention it | *Grazie! — Figurati!* |
    | *ecco* | there, that's it, well | *Ecco, appunto. Ecco fatto!* |
    | *insomma* | in short / so-so / come on! | *Com'è andata? — Insomma… — Insomma, basta!* |
    | *magari* | maybe / I wish | *Magari ci vediamo dopo.* |
    | *vabbè* | oh well, OK | *Vabbè, non importa.* |
    | *boh* | dunno | *Boh, chi lo sa.* |
    | *mah* | doubt, perplexity | *Mah, non sono convinto.* |
    | *macché* | not at all! | *Sei stanco? — Macché!* |
    | *anzi* | actually, on the contrary | *Non mi dispiace, anzi!* |

    These are hard to translate: aim to recognise the attitude.
  examples:
    - { es: "Non sono mica nato ieri!", en: "I wasn't born yesterday!" }
    - { es: "Ma dai, non ci credo!", en: "No way, I don't believe it!" }
    - { es: "Prego, si sieda pure.", en: "Please, do sit down." }
    - { es: "Com'era il film? Insomma…", en: "How was the film? So-so…" }
  pitfalls:
    - "*Mica* is colloquial and needs a negative context: *non è mica vero*."
    - "*Pure* after an imperative is polite ('go ahead'), not 'purely'."
    - "*Insomma* can mean 'in short', 'so-so' or 'come on!' depending on tone."
  related: [g.colloquial-italian, g.politeness-strategies, g.focus-particles]
  drills:
    - { es: "Dai, non fare così!", en: "Come on, don't be like that!" }
    - { es: "Grazie del passaggio! Figurati.", en: "Thanks for the lift! Don't mention it." }
    - { es: "Ecco fatto, possiamo andare.", en: "There, done, we can go." }
    - { es: "Ti è piaciuto? Macché, era noiosissimo.", en: "Did you like it? Not at all, it was so boring." }
- id: g.literary-language
  level: c1
  title: "Literary language: egli, ella, codesto, the passato remoto and old spellings"
  summary: "Forms you meet in 19th- and 20th-century fiction that are rare in modern speech."
  explanation: |
    | literary | modern | notes |
    |---|---|---|
    | *egli, ella, essi, esse* | *lui, lei, loro* | subject pronouns in written prose |
    | *codesto* | *questo / quello* (near you) | still alive in Tuscany |
    | *costui, costei, costoro* | *questo, questa (persona)* | often pejorative now |
    | *ove, onde* | *dove, da dove / perciò* | *onde evitare* still bureaucratic |
    | *giacché* | *dato che* | |
    | *innanzi, dinanzi* | *davanti* | |
    | *testé* | *poco fa* | |
    | *io avea, io dicea* | *io avevo, dicevo* | old imperfetto |
    | *fia, fora* | *sarà, sarebbe* | poetic |

    ### Other features
    - Passato remoto and trapassato remoto as narrative tenses.
    - Enclitic pronouns on finite verbs: *dicesi, vendesi, mettevasi* (next notes).
    - *Il d eufonico*: *ad esempio, ed egli*.
    - Truncated forms: *fan, son, dir* (*son contento*).
  examples:
    - { es: "Egli guardò il mare e tacque.", en: "He looked at the sea and fell silent." }
    - { es: "Che cosa è codesto libro che tieni in mano?", en: "What's that book you're holding?" }
    - { es: "Ove fosse necessario, si provvederà.", en: "Where necessary, action will be taken." }
  pitfalls:
    - "Don't use *egli / ella* in conversation: it sounds like a 19th-century novel."
    - "*Costui* is often contemptuous in modern Italian: 'this fellow'."
    - "Spanish speakers: *ello* has no counterpart; *esso* is used for things only in written Italian."
  related: [g.passato-remoto-irregular, g.enclitics-literary, g.ottocento-prose]
  drills:
    - { es: "Ella sorrise e non rispose.", en: "She smiled and did not answer." }
    - { es: "Giacché sei qui, aiutami.", en: "Since you're here, help me." }
    - { es: "Essi partirono all'alba.", en: "They left at dawn." }
- id: g.discorso-indiretto-libero
  level: c1
  title: "Free indirect speech: Verga's voice of the village"
  summary: "The narrator slips into a character's or a community's thoughts without 'he said that'."
  explanation: |
    *Discorso indiretto libero* mixes narration and a character's voice:
    - **Third person** and **past tenses** (like indirect speech: imperfetto, condizionale).
    - **No introducing verb** (*disse che, pensò che*).
    - The **words, exclamations and judgements** of the character (like direct speech).

    | direct | indirect | free indirect |
    |---|---|---|
    | *Pensò: 'Domani parto!'* | *Pensò che il giorno dopo sarebbe partito.* | *Domani sarebbe partito, finalmente!* |

    ### Verga and the *coralità*
    In *I Malavoglia* (1881) the narrator often speaks with the voice of the whole village of Aci Trezza, using its proverbs and prejudices: *Il mare non ha paese nemmeno lui, ed è di tutti quelli che lo stanno ad ascoltare.*

    Pirandello and later writers use it to blur the line between narrator and character.
  examples:
    - { es: "Ntoni guardava il mare. Sarebbe partito, sì, e avrebbe fatto fortuna!", en: "'Ntoni looked at the sea. He would leave, yes, and make his fortune!" }
    - { es: "Che colpa ne aveva lui, se la barca era affondata?", en: "Was it his fault if the boat had sunk?" }
    - { es: "Tutti in paese lo dicevano: quella era gente che non sapeva stare al suo posto.", en: "Everyone in the village said so: those were people who didn't know their place." }
  pitfalls:
    - "Don't look for *disse che*: the clue is a past tense with exclamations or questions in the character's voice."
    - "The conditional (*sarebbe partito*) usually expresses the character's future plans."
    - "Spanish speakers: the *estilo indirecto libre* works the same way."
  related: [g.reported-speech-advanced, g.literary-language]
  drills:
    - { es: "E se poi non tornava? Chi avrebbe pensato alla madre?", en: "And what if he didn't come back? Who would look after his mother?" }
    - { es: "Era tardi, troppo tardi ormai. Doveva decidersi.", en: "It was late, too late now. He had to make up his mind." }
    - { es: "Bella figura, ci avrebbe fatto!", en: "A fine impression he'd make!" }
- id: g.enclitics-literary
  level: c1
  title: "Vendesi, affittasi, dicesi — enclitic pronouns on finite verbs"
  summary: "Old and formal Italian attaches si and other pronouns to conjugated verbs."
  explanation: |
    In older literature, pronouns could attach to **conjugated** verbs. Today this survives in fixed formulas:

    | form | modern | where |
    |---|---|---|
    | *vendesi* | *si vende* | signs: *Vendesi appartamento* |
    | *affittasi* | *si affitta* | signs: *Affittasi camera* |
    | *cercasi* | *si cerca* | ads: *Cercasi cameriere* |
    | *dicesi* | *si dice* | definitions: *Dicesi triangolo…* |
    | *trattasi* | *si tratta* | bureaucratic: *trattasi di errore* |
    | *leggesi* | *si legge* | old texts |

    In signs the verb usually stays singular even with plural nouns: *Vendesi appartamenti* (strictly *vendonsi*, which is very rare).

    ### In literature
    *Andossene* (*se ne andò*), *dissemi* (*mi disse*), *fermossi* (*si fermò*), *eravi* (*vi era*). Manzoni and Verga still use some: recognise them.
  examples:
    - { es: "Affittasi monolocale arredato a Cagliari.", en: "Furnished studio flat to let in Cagliari." }
    - { es: "Cercasi commessa con esperienza.", en: "Experienced sales assistant wanted." }
    - { es: "Trattasi di un semplice malinteso.", en: "It is a simple misunderstanding." }
  pitfalls:
    - "Don't create new forms like *mangiasi*: only fixed formulas are alive."
    - "*Vendesi* is on signs; in speech say *si vende* or *è in vendita*."
    - "Spanish speakers: *se vende* (sign) → *vendesi*; *se alquila* → *affittasi*."
  related: [g.si-passivante, g.literary-language]
  drills:
    - { es: "Vendesi villa con giardino.", en: "Villa with garden for sale." }
    - { es: "Cercasi pizzaiolo per la stagione estiva.", en: "Pizza chef wanted for the summer season." }
    - { es: "Dicesi isola una terra circondata dal mare.", en: "An island is defined as land surrounded by sea." }
- id: g.journalistic-language
  level: c1
  title: "Journalistic Italian: headlines, nominal style, conditional of hearsay"
  summary: "Elliptical headlines, nouns instead of verbs, quoted voices and the reportative conditional."
  explanation: |
    ### Headlines (*titoli*)
    - **No verb or articles**: *Maltempo in Sardegna, scuole chiuse.*
    - **Present tense for past events**: *Crolla un ponte a…*
    - **Colon** for quotes: *Il sindaco: «Nessun pericolo».*
    - **Nouns**: *Via libera alla riforma* (green light for the reform), *Stop ai voli*, *Boom di turisti*.

    ### Articles
    - *Il condizionale di dissociazione*: *sarebbe stato visto…* (reportedly).
    - Reporting verbs: *dichiarare, affermare, precisare, sottolineare, ribadire, smentire*.
    - Journalistic clichés: *giallo* (mystery), *bufera* (storm of controversy), *braccio di ferro* (tug of war), *fumata bianca* (agreement reached).
    - Guillemets « » for quotations.
  examples:
    - { es: "Incendi in Sicilia, evacuate tre frazioni.", en: "Wildfires in Sicily, three hamlets evacuated." }
    - { es: "Il ministro: «Nessun aumento delle tasse».", en: "The minister: 'No tax increase'." }
    - { es: "Fumata bianca per il contratto dei portuali.", en: "Deal reached on the dock workers' contract." }
    - { es: "Giallo a Palermo: sparito un quadro dal museo.", en: "Mystery in Palermo: a painting vanishes from the museum." }
  pitfalls:
    - "Headline present tense often describes a past event: *Muore lo scrittore* = the writer has died."
    - "*Smentire* = to deny (a report), not 'to lie'."
    - "Spanish speakers: *el giallo* is a crime mystery (yellow-covered thrillers), not 'the yellow'."
  related: [g.condizionale-hearsay, g.nominalization]
  drills:
    - { es: "Boom di presenze nelle spiagge sarde.", en: "Record numbers on Sardinian beaches." }
    - { es: "Braccio di ferro tra governo e regioni.", en: "Tug of war between the government and the regions." }
    - { es: "Il portavoce ha smentito la notizia.", en: "The spokesperson denied the report." }
- id: g.word-formation
  level: c1
  title: "Word formation: prefixes and suffixes"
  summary: "s-, dis-, in-, ri-, pre-, -mente, -bile, -tore, -ista: guessing meaning from parts."
  explanation: |
    ### Prefixes
    | prefix | meaning | examples |
    |---|---|---|
    | *s-* | opposite, removal; sometimes intensive | *scontento, scaricare, sfortuna; sbattere* |
    | *dis-* | opposite | *disonesto, disfare, disaccordo* |
    | *in- (im-, il-, ir-)* | not | *inutile, impossibile, illegale, irregolare* |
    | *ri-* | again, back | *rifare, ritornare* |
    | *pre- / post-* | before / after | *prevedere, dopoguerra, postmoderno* |
    | *stra-* | extremely (colloquial) | *strapieno, stracotto* |
    | *anti-, contro-* | against | *antifurto, controcorrente* |

    ### Suffixes
    | suffix | forms | examples |
    |---|---|---|
    | *-mente* | adverbs from the feminine adj. | *lentamente, facilmente, velocemente* |
    | *-bile* | -able | *leggibile, mangiabile* |
    | *-tore / -trice* | agent | *lettore, lettrice, traduttore* |
    | *-ista* | profession, follower | *dentista, giornalista, ottimista* |
    | *-aio / -aio* | trade, place | *fornaio, benzinaio, pollaio* |
    | *-eria* | shop | *pizzeria, macelleria, libreria* |
    | *-ata* | blow, portion, event | *gomitata, cucchiaiata, serata* |
    | *-ismo* | -ism | *turismo, menefreghismo* |
  examples:
    - { es: "Il traghetto era strapieno.", en: "The ferry was packed." }
    - { es: "È un testo difficilmente comprensibile.", en: "It's a hardly understandable text." }
    - { es: "Mio cugino fa il benzinaio a Oristano.", en: "My cousin works at a petrol station in Oristano." }
  pitfalls:
    - "*-mente* attaches to the feminine form: *lenta → lentamente*; adjectives in *-le, -re* drop the *e*: *facilmente, regolarmente*."
    - "*S-* can intensify, not negate: *sbattere* (slam), *scancellare* (colloquial)."
    - "*Libreria* is a bookshop, not a library (*biblioteca*)."
  related: [g.suffixes-alterati, g.di-nuovo-ri, g.false-friends-advanced]
  drills:
    - { es: "Parla lentamente, per favore.", en: "Speak slowly, please." }
    - { es: "È un errore imperdonabile.", en: "It's an unforgivable mistake." }
    - { es: "Ho fatto una bella mangiata di pesce.", en: "I had a great fish feast." }
- id: g.false-friends-advanced
  level: c1
  title: "False friends: eventualmente, attualmente, educato, morbido"
  summary: "Words that look like English (or Spanish) but mean something else."
  explanation: |
    | Italian | means | not |
    |---|---|---|
    | *eventualmente* | possibly, if necessary | eventually (*alla fine*) |
    | *attualmente* | currently | actually (*in realtà*) |
    | *educato* | polite, well-mannered | educated (*istruito, colto*) |
    | *morbido* | soft | morbid (*morboso*) |
    | *parenti* | relatives | parents (*genitori*) |
    | *fattoria* | farm | factory (*fabbrica*) |
    | *camera* | room | camera (*macchina fotografica*) |
    | *argomento* | topic | argument (*discussione, litigio*) |
    | *pretendere* | demand, expect | pretend (*fingere*) |
    | *addizione* | sum, addition (maths) | addition = extra (*aggiunta*) |
    | *sensibile* | sensitive | sensible (*sensato, ragionevole*) |
    | *magazzino* | warehouse | magazine (*rivista*) |
    | *annoiare* | to bore | to annoy (*dare fastidio*) |
    | *realizzare* | to carry out, make real | realise (*rendersi conto*) — though this anglicism is spreading |

    ### For Spanish speakers
    *burro* (butter, not donkey), *salire* (go up, not go out), *guardare* (look, not keep), *caldo* (hot, not broth), *subito* (immediately, not sudden), *aceto* (vinegar), *rubare* (steal).
  examples:
    - { es: "Attualmente vivo a Cagliari.", en: "I currently live in Cagliari." }
    - { es: "Eventualmente ti chiamo domani.", en: "If need be, I'll call you tomorrow." }
    - { es: "Sono ragazzi molto educati.", en: "They're very polite kids." }
    - { es: "Pretende che lavoriamo anche la domenica.", en: "He expects us to work on Sundays too." }
  pitfalls:
    - "'Actually' is *in realtà* or *veramente*, not *attualmente*."
    - "'Eventually' is *alla fine* or *prima o poi*."
    - "'I realised' is *mi sono reso conto*; *ho realizzato* is a disputed anglicism."
  related: [g.word-formation, g.anglicisms-calques]
  drills:
    - { es: "Alla fine abbiamo deciso di restare.", en: "Eventually we decided to stay." }
    - { es: "In realtà non sono di qui.", en: "Actually, I'm not from here." }
    - { es: "Mi sono reso conto di aver sbagliato strada.", en: "I realised I'd taken the wrong road." }
- id: g.c1-review
  level: c1
  title: "C1 review: nuance, narrative and register"
  summary: "Mood for meaning, passato remoto, implicit clauses, discourse markers, register and pragmatics."
  explanation: |
    ### Checklist
    - **Mood**: indicative or congiuntivo by meaning (*capisco che sei / tu sia*); independent congiuntivo (*Che sia vero?*); *il fatto che* + congiuntivo.
    - **Narrative tenses**: passato remoto (regular and 1-3-3 irregulars), trapassato remoto after *appena / dopo che*.
    - **Implicit clauses**: absolute participle (*Finita la cena…*), compound gerund, *a* + infinitive (*A saperlo…*).
    - **Formal conditions**: *qualora, nel caso in cui, ammesso che* + congiuntivo.
    - **Register**: burocratese, academic, journalistic; *vendesi*, *egli*.
    - **Pragmatics**: polite imperfetto, mitigators, irony, particles (*mica, pure, dai, figurati*).
    - **Vocabulary**: idioms, proverbs, fixed expressions, word formation, false friends.
  examples:
    - { es: "Finito il pranzo, il nonno raccontò di quando emigrò in Belgio.", en: "Once lunch was over, grandpa told us about when he emigrated to Belgium." }
    - { es: "Qualora non fosse possibile, La preghiamo di avvisarci.", en: "Should it not be possible, please let us know." }
    - { es: "Volevo chiederti, se non è un disturbo, di darmi una mano.", en: "I wanted to ask you, if it's no trouble, to give me a hand." }
    - { es: "Che sia proprio lui il colpevole? Mah, non è detto.", en: "Could he really be the culprit? Hmm, not necessarily." }
  pitfalls:
    - "Don't mix registers in one text: *burocratese* and *mica* don't belong together."
    - "The passato remoto is for narrative and distance; don't use it for this morning in standard Italian."
    - "False friends: *attualmente, eventualmente, educato*."
  related: [g.congiuntivo-nuance, g.passato-remoto-vs-prossimo, g.subordination-implicit]
  drills:
    - { es: "Appena ebbe finito, se ne andò senza salutare.", en: "As soon as he had finished, he left without saying goodbye." }
    - { es: "A pensarci bene, non è stata una cattiva idea.", en: "Thinking about it, it wasn't a bad idea." }
    - { es: "Il fatto che tu sia qui mi fa molto piacere.", en: "I'm very glad you're here." }
