id: c2.u07
title: "Montréal, la ville sous la ville"
lessons:
  - id: c2.u07.l1
    title: "Tu viens-tu au show à soir ?"
    teach: [g.quebecois-grammar]
    tip: "Spoken Québec French turns any statement into a question with -tu (Tu viens-tu ? C'est-tu loin ?), shortens je suis to chu, uses pantoute for pas du tout and être après for être en train de. Understand it everywhere; use it with friends, not in a job interview."
    vocab: [w.pantoute, w.moé, w.toé, w.chu, w.être-après, w.à-cause-que, w.pogner, w.tanné, w.allô, w.écœurant, w.capoter, w.chicaner, w.bébelle, w.ville-souterraine, w.cosmopolite, w.show, w.balado, w.gars, w.vivement, w.auprès-de, w.glacial]
    sentences:
      - { es: "Tu viens-tu au show à soir ?", en: "Are you coming to the show tonight?", altEs: ["Est-ce que tu viens au spectacle ce soir ?", "Tu viens au spectacle ce soir ?", "Viens-tu au show à soir ?"], grammar: [g.quebecois-grammar, g.yes-no-questions], vocab: [w.show], note: "Québec: -tu turns a statement into a yes/no question; à soir = ce soir.", transform: { instruction: "Rewrite it in standard French with est-ce que", answer: "Est-ce que tu viens au spectacle ce soir ?", alt: ["Est-ce que tu viens au show ce soir ?"], en: "Are you coming to the show tonight?" } }
      - { es: "C'est-tu loin, la ville souterraine ?", en: "Is the underground city far?", altEs: ["Est-ce que la ville souterraine est loin ?", "La ville souterraine, c'est loin ?"], grammar: [g.quebecois-grammar], vocab: [w.ville-souterraine], transform: { instruction: "Rewrite it in standard French with inversion", answer: "La ville souterraine est-elle loin ?", alt: ["Est-ce que la ville souterraine est loin ?"], en: "Is the underground city far?" } }
      - { es: "L'hiver, on peut traverser le centre-ville sans sortir dehors, grâce à la ville souterraine.", en: "In winter you can cross downtown without going outside, thanks to the underground city.", altEs: ["En hiver, on peut traverser le centre-ville sans mettre le nez dehors, grâce à la ville souterraine."], grammar: [g.quebecois-grammar, g.on-nous], vocab: [w.ville-souterraine], note: "The RÉSO links metro stations, shopping centres and offices through more than 30 km of tunnels." }
      - { es: "Chu pas mal fatigué, là ; j'vas me coucher.", en: "I'm pretty tired; I'm going to bed.", altEs: ["Je suis assez fatigué, je vais me coucher.", "Chu pas mal fatiguée, là ; j'vas me coucher."], grammar: [g.quebecois-grammar], vocab: [w.chu], note: "Pas mal = quite, pretty (not 'not bad'); là is a filler." }
      - { es: "J'ai pas aimé ça pantoute.", en: "I didn't like it at all.", altEs: ["Je n'ai pas aimé ça du tout.", "J'ai pas aimé ça du tout."], grammar: [g.quebecois-grammar, g.spoken-negation], vocab: [w.pantoute], transform: { instruction: "Rewrite it in standard written French", answer: "Je n'ai pas du tout aimé ça.", alt: ["Je n'ai pas aimé ça du tout.", "Je n'ai pas du tout aimé cela.", "Je n'ai pas aimé cela du tout."], en: "I didn't like it at all." } }
      - { es: "Chu après souper, rappelle-moi dans dix minutes.", en: "I'm having supper, call me back in ten minutes.", altEs: ["Je suis en train de souper, rappelle-moi dans dix minutes.", "Je suis en train de dîner, rappelle-moi dans dix minutes."], grammar: [g.quebecois-grammar], vocab: [w.être-après, w.souper.v], note: "être après + infinitive = être en train de." }
      - { es: "C'est pour moé ou pour toé, ce café-là ?", en: "Is that coffee for me or for you?", altEs: ["C'est pour moi ou pour toi, ce café ?"], grammar: [g.quebecois-grammar, g.stressed-pronouns], vocab: [w.moé, w.toé], note: "Moé, toé preserve an old Parisian pronunciation of moi, toi." }
      - { es: "Il est pas venu à cause qu'il pleuvait.", en: "He didn't come because it was raining.", altEs: ["Il n'est pas venu parce qu'il pleuvait."], grammar: [g.quebecois-grammar], vocab: [w.à-cause-que], note: "À cause que is spoken Québec French; in writing use parce que." }
      - { es: "Y est où, ton char ? Y est-tu encore dans le stationnement ?", en: "Where's your car? Is it still in the car park?", altEs: ["Où est ta voiture ? Est-ce qu'elle est encore dans le stationnement ?", "Il est où, ton char ? Il est encore dans le stationnement ?"], grammar: [g.quebecois-grammar], vocab: [w.char, w.stationnement], note: "Spoken Québec: y = il." }
      - { es: "Ce restaurant-là, c'est écœurant ! Leur smoked meat m'a fait capoter.", en: "That restaurant is awesome! Their smoked meat blew my mind.", altEs: ["Ce restaurant est génial ! Leur viande fumée m'a fait capoter.", "Ce restaurant-là est écœurant ! J'ai capoté sur leur smoked meat."], grammar: [g.quebecois-grammar, g.faire-causatif], vocab: [w.écœurant, w.capoter], note: "In Québec, écœurant usually means 'awesome'; in France, 'disgusting'." }
      - { es: "Chu tanné de l'hiver ; vivement le printemps !", en: "I'm fed up with winter; roll on spring!", altEs: ["J'en ai assez de l'hiver ; vivement le printemps !", "Je suis tanné de l'hiver, vivement le printemps !"], grammar: [g.quebecois-grammar], vocab: [w.tanné] }
      - { es: "Son nouveau balado pogne en tabarouette auprès des jeunes.", en: "Her new podcast is a huge hit with young people.", altEs: ["Son nouveau balado a énormément de succès auprès des jeunes.", "Son nouveau balado marche très fort auprès des jeunes."], grammar: [g.quebecois-grammar, g.quebec-sacres], vocab: [w.pogner, w.balado, w.tabarouette] }
      - { es: "Arrêtez de vous chicaner pour des bébelles !", en: "Stop squabbling over trinkets!", altEs: ["Arrêtez de vous disputer pour des babioles !"], grammar: [g.quebecois-grammar, g.imperative], vocab: [w.chicaner, w.bébelle] }
      - { es: "Allô ! Quessé tu fais en fin de semaine ?", en: "Hi! What are you doing this weekend?", altEs: ["Salut ! Qu'est-ce que tu fais ce week-end ?", "Allô ! Qu'est-ce que tu fais en fin de semaine ?"], grammar: [g.quebecois-grammar], vocab: [w.allô, w.fin-de-semaine] }
      - { es: "Montréal est une ville cosmopolite où l'on passe du français à l'anglais dans la même conversation.", en: "Montreal is a cosmopolitan city where people switch from French to English in the same conversation.", altEs: ["Montréal est une ville cosmopolite où on passe du français à l'anglais dans la même conversation."], grammar: [g.quebecois-grammar, g.relative-ou], vocab: [w.cosmopolite], error: { wrong: "Montréal est une ville cosmopolite que l'on passe du français à l'anglais dans la même conversation.", explain: "The relative for a place (in which) is où, not que.", grammar: g.relative-ou } }
      - { es: "Ça me tente pas de sortir à soir, il fait trop frette.", en: "I don't feel like going out tonight, it's too cold.", altEs: ["Je n'ai pas envie de sortir ce soir, il fait trop froid.", "Ça me tente pas de sortir ce soir, il fait trop froid."], grammar: [g.quebecois-grammar, g.spoken-negation], vocab: [w.frette] }
    exchanges:
      - q: { es: "Tu viens-tu avec nous à soir ?", en: "Are you coming with us tonight?" }
        a: { es: "Ça me tente pas pantoute, chu brûlé.", en: "I really don't feel like it, I'm exhausted." }
        alt: ["Oui, j'arrive !", "Peut-être, ça dépend de l'heure."]
        grammar: [g.quebecois-grammar]
        vocab: [w.pantoute, w.chu]
      - q: { es: "C'est-tu vrai qu'on peut aller au métro sans sortir dehors ?", en: "Is it true you can get to the metro without going outside?" }
        a: { es: "Oui, par la ville souterraine ; l'hiver, c'est bien pratique.", en: "Yes, through the underground city; in winter it's really handy." }
        alt: ["Oui, par les tunnels.", "Oui, c'est le RÉSO."]
        grammar: [g.quebecois-grammar]
        vocab: [w.ville-souterraine]
      - q: { es: "Pis, le show d'hier, c'était comment ?", en: "So, how was yesterday's show?" }
        a: { es: "Écœurant ! La salle capotait du début à la fin.", en: "Awesome! The audience went wild from start to finish." }
        alt: ["Pas pire !", "Bof, c'était plate."]
        grammar: [g.quebecois-grammar]
        vocab: [w.écœurant, w.capoter, w.show]
      - q: { es: "Pourquoi t'es de mauvaise humeur ?", en: "Why are you in a bad mood?" }
        a: { es: "Chu tanné : ça fait trois fois que je déneige mon char cette semaine.", en: "I'm fed up: it's the third time I've cleared the snow off my car this week." }
        alt: ["Je suis tanné de l'hiver.", "À cause que mon char est encore enseveli."]
        grammar: [g.quebecois-grammar, g.depuis-present]
        vocab: [w.tanné, w.déneiger]
      - q: { es: "Allô, t'es où ?", en: "Hi, where are you?" }
        a: { es: "Chu après magasiner dans le souterrain, j'arrive dans vingt minutes.", en: "I'm shopping in the underground, I'll be there in twenty minutes." }
        alt: ["Dans le métro, j'arrive.", "Chu presque arrivé."]
        grammar: [g.quebecois-grammar]
        vocab: [w.allô, w.être-après, w.magasiner]
    texts:
      - title: "Texto entre amis"
        es: ["Allô ! Tu viens-tu au show à soir ?", "Ça commence à huit heures, au Quartier des spectacles.", "Mets ta tuque, y fait frette en tabarouette !"]
        en: ["Hi! Are you coming to the show tonight?", "It starts at eight, in the Quartier des spectacles.", "Put your hat on, it's freezing out!"]
        grammar: [g.quebecois-grammar, g.quebec-sacres]
        vocab: [w.allô, w.show, w.tuque, w.frette]
      - title: "Même message, version standard"
        es: ["Bonjour ! Est-ce que tu viens au spectacle ce soir ?", "Il commence à vingt heures, au Quartier des spectacles.", "Mets ton bonnet, il fait un froid glacial !"]
        en: ["Hello! Are you coming to the show tonight?", "It starts at 8 p.m., in the Quartier des spectacles.", "Put your hat on, it's bitterly cold!"]
        grammar: [g.quebecois-grammar, g.register-levels]
        vocab: [w.show]
    spicy:
      - { es: "Tu me trouves-tu de ton goût, ou tu me niaises depuis le début de la soirée ?", en: "Do you actually like me, or have you been teasing me since the start of the evening?", altEs: ["Est-ce que je te plais, ou tu te moques de moi depuis le début de la soirée ?"], grammar: [g.quebecois-grammar, g.depuis-present], vocab: [w.niaiser] }
      - { es: "Chu pas jaloux pantoute… mais c'est qui, le gars qui t'a écrit à minuit ?", en: "I'm not jealous at all… but who's the guy who texted you at midnight?", altEs: ["Je ne suis pas jaloux du tout… mais qui est le gars qui t'a écrit à minuit ?"], grammar: [g.quebecois-grammar, g.ce-qui-c-est], vocab: [w.chu, w.pantoute] }
      - { es: "Quand tu m'as souri dans le métro, j'ai capoté ; j'ai raté trois stations.", en: "When you smiled at me in the metro, I freaked out; I missed three stops.", altEs: ["Quand tu m'as souri dans le métro, j'ai perdu la tête ; j'ai raté trois stations."], grammar: [g.quebecois-grammar, g.pc-vs-imparfait], vocab: [w.capoter] }
      - { es: "Ça te tente-tu de te perdre avec moi dans la ville souterraine ?", en: "Do you fancy getting lost with me in the underground city?", altEs: ["Est-ce que ça te dit de te perdre avec moi dans la ville souterraine ?"], grammar: [g.quebecois-grammar], vocab: [w.ville-souterraine] }
      - { es: "Arrête de chicaner pour la facture : c'est moé qui t'invite, pis c'est toé qui m'embrasses.", en: "Stop arguing about the bill: I'm treating you, and you're kissing me.", altEs: ["Arrête de te disputer pour l'addition : c'est moi qui t'invite, et c'est toi qui m'embrasses."], grammar: [g.quebecois-grammar, g.ce-qui-c-est], vocab: [w.chicaner, w.moé, w.toé] }
  - id: c2.u07.l2
    title: "Ma blonde pis moé, on jase"
    teach: [g.quebec-vocabulary]
    tip: "In Québec: un char (a car), le dépanneur (corner shop), une tuque (woolly hat), ma blonde / mon chum (girlfriend / boyfriend), jaser (to chat), c'est plate (it's boring), une piasse (a dollar). Merci ! — Bienvenue ! means 'you're welcome'."
    vocab: [w.char, w.dépanneur, w.tuque, w.bas.n, w.mitaine, w.gougounes, w.blonde, w.chum, w.jaser, w.achaler, w.niaiser, w.niaiseux, w.plate, w.piasse, w.cenne, w.cellulaire, w.breuvage, w.liqueur, w.magasiner, w.poutine, w.cabane-à-sucre, w.érable, w.sirop-d-érable, w.tire-d-érable, w.érablière, w.collant, w.adorable]
    sentences:
      - { es: "Je vais au dépanneur m'acheter une liqueur.", en: "I'm going to the corner shop to buy myself a soft drink.", altEs: ["Je vais à l'épicerie du coin m'acheter un soda."], grammar: [g.quebec-vocabulary], vocab: [w.dépanneur, w.liqueur], transform: { instruction: "Rewrite it with the words used in France", answer: "Je vais à l'épicerie du coin m'acheter un soda.", alt: ["Je vais à l'épicerie m'acheter un soda.", "Je vais à la supérette m'acheter un soda."], en: "I'm going to the corner shop to buy myself a soft drink." } }
      - { es: "Mets ta tuque pis tes mitaines, il fait frette dehors !", en: "Put on your hat and mittens, it's freezing outside!", altEs: ["Mets ton bonnet et tes moufles, il fait très froid dehors !"], grammar: [g.quebec-vocabulary, g.imperative], vocab: [w.tuque, w.mitaine, w.frette] }
      - { es: "Ma blonde et moi, on a jasé toute la soirée.", en: "My girlfriend and I chatted all evening.", altEs: ["Ma copine et moi, on a bavardé toute la soirée."], grammar: [g.quebec-vocabulary], vocab: [w.blonde, w.jaser], note: "Ma blonde doesn't mean she's blonde.", transform: { instruction: "Change it to 'my boyfriend' (Québec word)", answer: "Mon chum et moi, on a jasé toute la soirée.", alt: [], en: "My boyfriend and I chatted all evening." } }
      - { es: "J'ai pas de char ; je prends le métro ou le Bixi.", en: "I don't have a car; I take the metro or a Bixi bike.", altEs: ["Je n'ai pas de voiture ; je prends le métro ou le Bixi."], grammar: [g.quebec-vocabulary, g.de-after-negation], vocab: [w.char], error: { wrong: "J'ai pas un char ; je prends le métro ou le Bixi.", explain: "After a negation, un becomes de: pas de char (standard: pas de voiture).", grammar: g.de-after-negation } }
      - { es: "Arrête de m'achaler, j'essaie de travailler !", en: "Stop bothering me, I'm trying to work!", altEs: ["Arrête de m'embêter, j'essaie de travailler !"], grammar: [g.quebec-vocabulary, g.imperative], vocab: [w.achaler] }
      - { es: "Voyons donc, tu me niaises ! Ça coûte vraiment juste deux piasses ?", en: "Come on, you're kidding me! It really costs only two bucks?", altEs: ["Allons, tu plaisantes ! Ça coûte vraiment seulement deux dollars ?"], grammar: [g.quebec-vocabulary], vocab: [w.niaiser, w.piasse] }
      - { es: "C'est plate, il pleut encore ; on reste à la maison ?", en: "What a drag, it's raining again; shall we stay home?", altEs: ["C'est ennuyeux, il pleut encore ; on reste à la maison ?", "Dommage, il pleut encore ; on reste à la maison ?"], grammar: [g.quebec-vocabulary], vocab: [w.plate] }
      - { es: "Il m'a rendu la monnaie à la cenne près.", en: "He gave me my change to the exact cent.", altEs: ["Il m'a rendu la monnaie au centime près."], grammar: [g.quebec-vocabulary], vocab: [w.cenne] }
      - { es: "J'ai oublié mon cellulaire dans le char de mon chum.", en: "I left my mobile in my boyfriend's car.", altEs: ["J'ai oublié mon portable dans la voiture de mon copain.", "J'ai oublié mon cell dans le char de mon chum."], grammar: [g.quebec-vocabulary], vocab: [w.cellulaire, w.char, w.chum] }
      - { es: "Le serveur nous a demandé quel breuvage on voulait avec notre poutine.", en: "The waiter asked us what drink we wanted with our poutine.", altEs: ["Le serveur nous a demandé quelle boisson nous voulions avec notre poutine."], grammar: [g.quebec-vocabulary, g.indirect-questions], vocab: [w.breuvage, w.poutine] }
      - { es: "Une vraie poutine, c'est des frites, du fromage en grains qui fait « couic » et de la sauce brune.", en: "A real poutine is fries, squeaky cheese curds and brown gravy.", altEs: ["Une vraie poutine, ce sont des frites, du fromage en grains qui fait « couic » et de la sauce brune."], grammar: [g.quebec-vocabulary, g.partitive-articles], vocab: [w.poutine] }
      - { es: "On va magasiner en fin de semaine ; j'ai besoin de bas chauds.", en: "We're going shopping at the weekend; I need warm socks.", altEs: ["On va faire du shopping ce week-end ; j'ai besoin de chaussettes chaudes."], grammar: [g.quebec-vocabulary], vocab: [w.magasiner, w.bas.n, w.fin-de-semaine] }
      - { es: "Au printemps, on va à la cabane à sucre manger de la tire d'érable sur la neige.", en: "In spring we go to the sugar shack to eat maple taffy on the snow.", altEs: ["Au printemps, on va à la cabane à sucre pour manger de la tire sur la neige."], grammar: [g.quebec-vocabulary, g.pour-sans-infinitive], vocab: [w.cabane-à-sucre, w.tire-d-érable] }
      - { es: "Il faut environ quarante litres d'eau d'érable pour faire un litre de sirop d'érable.", en: "It takes about forty litres of maple sap to make one litre of maple syrup.", altEs: ["Il faut à peu près quarante litres de sève d'érable pour faire un litre de sirop."], grammar: [g.quebec-vocabulary, g.il-faut], vocab: [w.sirop-d-érable, w.érable] }
      - { es: "L'érablière de mon oncle est ouverte au public pendant le temps des sucres.", en: "My uncle's maple grove is open to the public during sugaring season.", altEs: ["L'érablière de mon oncle accueille le public pendant le temps des sucres."], grammar: [g.quebec-vocabulary], vocab: [w.érablière] }
      - { es: "Merci pour la poutine ! — Bienvenue !", en: "Thanks for the poutine! — You're welcome!", altEs: ["Merci pour la poutine ! — De rien !", "Merci pour la poutine ! — Il n'y a pas de quoi !"], grammar: [g.quebec-vocabulary], vocab: [w.poutine], note: "In Québec, bienvenue = you're welcome; in France, only 'welcome (to a place)'." }
    exchanges:
      - q: { es: "Tu vas où avec ta tuque pis tes gougounes ?", en: "Where are you going with your woolly hat and flip-flops?" }
        a: { es: "Au dépanneur, juste en face ; j'en ai pour deux minutes.", en: "To the corner shop, just across the street; I'll only be two minutes." }
        alt: ["Au dépanneur !", "Juste au coin, je reviens."]
        grammar: [g.quebec-vocabulary, g.pronoun-en]
        vocab: [w.tuque, w.gougounes, w.dépanneur]
      - q: { es: "C'est-tu ta blonde, la fille avec la tuque rouge ?", en: "Is the girl with the red hat your girlfriend?" }
        a: { es: "Non, c'est ma cousine ; ma blonde est restée à Québec.", en: "No, she's my cousin; my girlfriend stayed in Québec City." }
        alt: ["Oui, c'est ma blonde !", "Non, c'est juste une amie."]
        grammar: [g.quebec-vocabulary, g.quebecois-grammar]
        vocab: [w.blonde]
      - q: { es: "Ça coûte combien, une poutine ici ?", en: "How much is a poutine here?" }
        a: { es: "Une douzaine de piasses, avec le breuvage.", en: "About a dozen bucks, with a drink." }
        alt: ["Douze piasses.", "Environ douze dollars."]
        grammar: [g.quebec-vocabulary, g.numbers-0-69]
        vocab: [w.piasse, w.breuvage, w.poutine]
      - q: { es: "Qu'est-ce que tu as fait en fin de semaine ?", en: "What did you do at the weekend?" }
        a: { es: "On est allés à la cabane à sucre ; j'ai mangé trop de tire, comme chaque année.", en: "We went to the sugar shack; I ate too much taffy, like every year." }
        alt: ["On a magasiné.", "Rien, c'était plate."]
        grammar: [g.quebec-vocabulary, g.passe-compose-etre]
        vocab: [w.cabane-à-sucre, w.tire-d-érable]
      - q: { es: "Merci de m'avoir prêté ton char !", en: "Thanks for lending me your car!" }
        a: { es: "Bienvenue ! Mais rapporte-le avec le plein, là.", en: "You're welcome! But bring it back with a full tank, eh." }
        alt: ["Bienvenue !", "Pas de problème !"]
        grammar: [g.quebec-vocabulary, g.imperative-with-pronouns]
        vocab: [w.char]
    texts:
      - title: "Liste d'épicerie sur le frigo"
        es: ["Passer au dépanneur : du lait, du pain et deux liqueurs.", "Acheter des bas chauds pour la fin de semaine.", "Ne pas oublier le sirop d'érable pour les crêpes !"]
        en: ["Stop at the corner shop: milk, bread and two soft drinks.", "Buy warm socks for the weekend.", "Don't forget the maple syrup for the pancakes!"]
        grammar: [g.quebec-vocabulary, g.infinitive-clauses]
        vocab: [w.dépanneur, w.liqueur, w.bas.n, w.sirop-d-érable]
      - title: "Panneau d'une cabane à sucre"
        es: ["Bienvenue à l'érablière Gagnon !", "Repas traditionnel et tire sur la neige tous les jours, de mars à avril.", "Réservez au moins une semaine d'avance."]
        en: ["Welcome to the Gagnon maple grove!", "Traditional meal and taffy on the snow every day, from March to April.", "Book at least a week in advance."]
        grammar: [g.quebec-vocabulary, g.imperative]
        vocab: [w.érablière, w.tire-d-érable, w.cabane-à-sucre]
    spicy:
      - { es: "Tu veux-tu être ma blonde, ou je dois d'abord te payer une poutine ?", en: "Do you want to be my girlfriend, or do I have to buy you a poutine first?", altEs: ["Veux-tu être ma blonde, ou dois-je d'abord t'offrir une poutine ?"], grammar: [g.quebec-vocabulary, g.quebecois-grammar], vocab: [w.blonde, w.poutine] }
      - { es: "Arrête de me niaiser : tu es venu au dépanneur trois fois aujourd'hui, et pas pour la liqueur.", en: "Stop kidding me: you've come to the corner shop three times today, and not for the soft drinks.", altEs: ["Arrête de te moquer de moi : tu es venu au dépanneur trois fois aujourd'hui, et pas pour la liqueur."], grammar: [g.quebec-vocabulary], vocab: [w.niaiser, w.dépanneur, w.liqueur] }
      - { es: "Avec toi, même une soirée plate devient écœurante.", en: "With you, even a boring evening becomes awesome.", altEs: ["Avec toi, même une soirée ennuyeuse devient géniale."], grammar: [g.quebec-vocabulary], vocab: [w.plate, w.écœurant] }
      - { es: "Tu es plus sucré que le sirop d'érable, mais heureusement moins collant.", en: "You're sweeter than maple syrup, but luckily less sticky.", altEs: ["Tu es plus sucrée que le sirop d'érable, mais heureusement moins collante."], grammar: [g.quebec-vocabulary, g.comparatives], vocab: [w.sirop-d-érable] }
      - { es: "On a jasé jusqu'à trois heures du matin, pis tu appelles ça « juste un café » ?", en: "We chatted until three in the morning, and you call that 'just a coffee'?", altEs: ["On a bavardé jusqu'à trois heures du matin, et tu appelles ça « juste un café » ?"], grammar: [g.quebec-vocabulary], vocab: [w.jaser] }
  - id: c2.u07.l3
    title: "Tabarouette, qu'il fait frette !"
    teach: [g.quebec-sacres]
    tip: "Québec swear words (sacres) come from church words: tabarnak, câlisse, ciboire. They are strong: recognise them, don't use them. The softened forms (tabarouette, mautadit, mosus, câline) are fine among friends: Tabarouette, il fait frette !"
    vocab: [w.frette, w.poudrerie, w.banc-de-neige, w.motoneige, w.traîneau, w.déneiger, w.déneigement, w.souffleuse, w.grattoir, w.redoux, w.gadoue, w.dégeler, w.hockey, w.rondelle, w.patinoire, w.patiner, w.aréna, w.ligue, w.séries-éliminatoires, w.partisan, w.tabarnak, w.câlisse, w.tabarouette, w.tabarnouche, w.câline, w.mosus, w.mautadit, w.maudit, w.ayoye, w.pelle, w.remorquer, w.remorqueuse, w.démarrer, w.stationner, w.glisser, w.géant, w.remporter, w.opération]
    sentences:
      - { es: "Tabarouette, il fait frette à matin !", en: "Gosh, it's freezing this morning!", altEs: ["Mince, il fait un froid glacial ce matin !", "Tabarouette, qu'il fait frette à matin !"], grammar: [g.quebec-sacres, g.quebecois-grammar], vocab: [w.tabarouette, w.frette], note: "À matin = ce matin.", transform: { instruction: "Rewrite it in the French of France", answer: "Mince, il fait un froid glacial ce matin !", alt: ["Mince, il fait très froid ce matin !", "Zut, il fait un froid glacial ce matin !", "Zut, il fait très froid ce matin !", "Il fait un froid glacial ce matin !", "Il fait très froid ce matin !"], en: "Gosh, it's freezing this morning!" } }
      - { es: "« Tabarnak » vient du mot « tabernacle » : c'est un sacre très fort, à reconnaître mais pas à employer.", en: "'Tabarnak' comes from the word 'tabernacle': it's a very strong swear word, to recognise but not to use.", altEs: ["« Tabarnak » vient de « tabernacle » : c'est un sacre très fort, qu'il faut reconnaître sans l'employer."], grammar: [g.quebec-sacres, g.infinitive-clauses], vocab: [w.tabarnak] }
      - { es: "Au Québec, on sacre avec les mots de l'Église, alors qu'en France on jure plutôt avec des mots grossiers.", en: "In Québec people swear with church words, whereas in France they tend to swear with crude words.", altEs: ["Au Québec, on jure avec le vocabulaire de l'Église, tandis qu'en France on jure plutôt avec des mots grossiers."], grammar: [g.quebec-sacres, g.connectors-opposition], vocab: [w.sacrer, w.jurer] }
      - { es: "Si tu es fâché, dis « mautadit » ou « mosus » : personne ne sera choqué.", en: "If you're angry, say 'mautadit' or 'mosus': nobody will be shocked.", altEs: ["Si tu es fâché, dis plutôt « mautadit » ou « mosus » : personne ne sera choqué."], grammar: [g.quebec-sacres, g.si-present-futur], vocab: [w.mautadit, w.mosus] }
      - { es: "Mon mautadit char ne veut pas démarrer, il fait moins trente !", en: "My darn car won't start, it's minus thirty!", altEs: ["Ma fichue voiture ne veut pas démarrer, il fait moins trente !"], grammar: [g.quebec-sacres], vocab: [w.mautadit, w.char], transform: { instruction: "Replace the Québec words with words used in France", answer: "Ma fichue voiture ne veut pas démarrer, il fait moins trente !", alt: ["Ma satanée voiture ne veut pas démarrer, il fait moins trente !", "Ma voiture ne veut pas démarrer, il fait moins trente !", "Ma maudite voiture ne veut pas démarrer, il fait moins trente !"], en: "My darn car won't start, it's minus thirty!" } }
      - { es: "C'est bon en tabarnouche, cette poutine-là !", en: "This poutine is darn good!", altEs: ["Elle est vraiment très bonne, cette poutine !", "C'est bon en mautadit, cette poutine-là !"], grammar: [g.quebec-sacres, g.dislocation], vocab: [w.tabarnouche], note: "En + a softened sacre works as an intensifier: really, darn." }
      - { es: "Câline, j'ai oublié mon grattoir, pis le pare-brise est couvert de glace.", en: "Darn, I forgot my scraper, and the windscreen is covered in ice.", altEs: ["Zut, j'ai oublié mon grattoir, et le pare-brise est couvert de glace."], grammar: [g.quebec-sacres], vocab: [w.câline, w.grattoir] }
      - { es: "Avec la poudrerie, on voyait à peine les bancs de neige au bord de la route.", en: "With the blowing snow you could barely see the snowbanks at the side of the road.", altEs: ["Avec la neige qui soufflait, on voyait à peine les bancs de neige au bord de la route."], grammar: [g.quebec-sacres, g.imparfait-uses], vocab: [w.poudrerie, w.banc-de-neige] }
      - { es: "Les opérations de déneigement ont commencé : déplacez votre char avant sept heures, sinon il sera remorqué.", en: "Snow clearing has started: move your car before seven, otherwise it will be towed.", altEs: ["Le déneigement a commencé : déplacez votre voiture avant sept heures, sinon elle sera remorquée."], grammar: [g.passive-voice, g.imperative], vocab: [w.déneigement, w.remorquer] }
      - { es: "Mon voisin passe la souffleuse à six heures du matin ; ayoye, quel bruit !", en: "My neighbour runs the snowblower at six in the morning; wow, what a racket!", altEs: ["Mon voisin passe la souffleuse à six heures du matin ; aïe, quel bruit !"], grammar: [g.quebec-sacres, g.native-fluency-markers], vocab: [w.souffleuse, w.ayoye] }
      - { es: "Avec le redoux, tout dégèle et les trottoirs sont pleins de gadoue.", en: "With the mild spell everything is thawing and the pavements are full of slush.", altEs: ["Avec le redoux, tout dégèle et les trottoirs sont couverts de gadoue."], grammar: [g.quebec-sacres], vocab: [w.redoux, w.dégeler, w.gadoue], error: { wrong: "Avec le redoux, tout dégele et les trottoirs sont pleins de gadoue.", explain: "dégeler takes a grave accent when the ending is silent: il dégèle (like il gèle).", grammar: g.stem-changing-er } }
      - { es: "Les Canadiens de Montréal ont remporté vingt-quatre coupes Stanley.", en: "The Montreal Canadiens have won twenty-four Stanley Cups.", altEs: ["Les Canadiens de Montréal ont gagné vingt-quatre coupes Stanley."], grammar: [g.passe-compose-avoir], vocab: [w.hockey, w.ligue] }
      - { es: "En séries éliminatoires, les partisans remplissent l'aréna même pour regarder le match sur écran géant.", en: "In the playoffs, fans fill the arena even to watch the game on a giant screen.", altEs: ["Pendant les séries éliminatoires, les partisans remplissent l'aréna même pour regarder le match sur écran géant."], grammar: [g.quebec-sacres], vocab: [w.séries-éliminatoires, w.partisan, w.aréna] }
      - { es: "Au hockey, on frappe la rondelle ; en France, on dirait le palet.", en: "In hockey you hit the puck; in France they'd say 'le palet'.", altEs: ["Au hockey, on frappe la rondelle, qu'on appelle le palet en France."], grammar: [g.quebec-vocabulary, g.conditionnel-present], vocab: [w.rondelle, w.hockey] }
      - { es: "Mosus, la patinoire est fermée ; on ira patiner sur le canal demain.", en: "Darn, the rink is closed; we'll go skating on the canal tomorrow.", altEs: ["Zut, la patinoire est fermée ; on ira patiner sur le canal demain."], grammar: [g.quebec-sacres, g.futur-simple-forms], vocab: [w.mosus, w.patinoire, w.patiner] }
      - { es: "On a fait de la motoneige le matin et du traîneau à chiens l'après-midi.", en: "We went snowmobiling in the morning and dog-sledding in the afternoon.", altEs: ["Le matin, on a fait de la motoneige, et l'après-midi, du traîneau à chiens."], grammar: [g.jouer-faire-de], vocab: [w.motoneige, w.traîneau] }
    exchanges:
      - q: { es: "Il fait combien dehors ?", en: "What's the temperature outside?" }
        a: { es: "Moins vingt-cinq avec le vent ; tabarouette, mets ta tuque !", en: "Minus twenty-five with the wind chill; gosh, put your hat on!" }
        alt: ["Moins vingt, c'est frette !", "Il fait frette en mautadit."]
        grammar: [g.quebec-sacres, g.weather]
        vocab: [w.tabarouette, w.frette]
      - q: { es: "Je peux dire « tabarnak » devant ma belle-mère ?", en: "Can I say 'tabarnak' in front of my mother-in-law?" }
        a: { es: "Surtout pas ! Dis plutôt « tabarouette », ça fait rire au lieu de choquer.", en: "Definitely not! Say 'tabarouette' instead: it makes people laugh instead of shocking them." }
        alt: ["Non, dis « tabarouette ».", "Pas question, c'est très vulgaire."]
        grammar: [g.quebec-sacres, g.imperative]
        vocab: [w.tabarnak, w.tabarouette]
      - q: { es: "Pourquoi ton char est-il garé dans la rue d'à côté ?", en: "Why is your car parked in the next street?" }
        a: { es: "À cause du déneigement : les remorqueuses passent à sept heures.", en: "Because of the snow clearing: the tow trucks come by at seven." }
        alt: ["À cause du déneigement.", "Ils déneigent ma rue ce matin."]
        grammar: [g.cause-advanced]
        vocab: [w.déneigement]
      - q: { es: "Tu regardes le match à soir ?", en: "Are you watching the game tonight?" }
        a: { es: "Certain ! C'est les séries éliminatoires, toute la ville va être devant la télé.", en: "Of course! It's the playoffs, the whole city will be in front of the TV." }
        alt: ["Oui, avec des chums.", "Non, le hockey, c'est pas mon genre."]
        grammar: [g.quebecois-grammar, g.futur-proche]
        vocab: [w.séries-éliminatoires, w.hockey]
      - q: { es: "Ayoye ! Tu t'es fait mal ?", en: "Ouch! Did you hurt yourself?" }
        a: { es: "Un peu ; j'ai glissé sur la glace devant l'aréna.", en: "A bit; I slipped on the ice in front of the arena." }
        alt: ["Non, ça va.", "Mautadit, oui, j'ai mal au genou."]
        grammar: [g.quebec-sacres, g.pronominal-passe-compose]
        vocab: [w.ayoye, w.aréna]
    texts:
      - title: "Avis de la Ville"
        es: ["Opération de déneigement cette nuit.", "Il est interdit de stationner du côté pair entre 19 h et 7 h.", "Les véhicules en infraction seront remorqués."]
        en: ["Snow clearing operation tonight.", "Parking is prohibited on the even-numbered side between 7 p.m. and 7 a.m.", "Vehicles in breach will be towed."]
        grammar: [g.passive-voice, g.impersonal-constructions]
        vocab: [w.déneigement, w.remorquer]
      - title: "Message d'un partisan"
        es: ["Tabarouette, quel match !", "Trois buts en troisième période, l'aréna capotait.", "On se revoit pour le prochain match des séries !"]
        en: ["Gosh, what a game!", "Three goals in the third period, the arena went wild.", "See you at the next playoff game!"]
        grammar: [g.quebec-sacres, g.quebecois-grammar]
        vocab: [w.tabarouette, w.aréna, w.capoter]
    spicy:
      - { es: "Tabarouette, tu patines aussi bien que tu danses ? Je suis dans le trouble.", en: "Gosh, you skate as well as you dance? I'm in trouble.", altEs: ["Tabarouette, tu patines aussi bien que tu danses ? Je suis mal parti."], grammar: [g.quebec-sacres, g.comparatives], vocab: [w.tabarouette, w.patiner] }
      - { es: "Il fait frette en mautadit dehors, mais toi, tu me fais dégeler en deux secondes.", en: "It's darn freezing outside, but you get me thawing in two seconds.", altEs: ["Il fait frette en mautadit dehors, mais toi, tu me fais fondre en deux secondes."], grammar: [g.quebec-sacres, g.faire-causatif], vocab: [w.mautadit, w.frette, w.dégeler] }
      - { es: "Mosus, j'ai oublié tout ce que je voulais te dire quand tu as enlevé ta tuque.", en: "Darn, I forgot everything I wanted to tell you when you took off your hat.", altEs: ["Mosus, j'ai oublié tout ce que je voulais te dire quand tu as retiré ta tuque."], grammar: [g.quebec-sacres, g.ce-qui-ce-que], vocab: [w.mosus, w.tuque] }
      - { es: "Je suis devenu partisan des Canadiens pour une seule raison : la fille assise à côté de moi à l'aréna.", en: "I became a Canadiens fan for one reason only: the girl sitting next to me at the arena.", altEs: ["Je suis devenu partisan des Canadiens pour une seule raison : la fille assise à côté de moi au match."], grammar: [g.quebec-sacres, g.passe-compose-etre], vocab: [w.partisan, w.aréna] }
      - { es: "Ayoye ! Tu m'as fait un clin d'œil en plein match ; j'ai raté le but.", en: "Wow! You winked at me in the middle of the game; I missed the goal.", altEs: ["Ayoye ! Tu m'as fait un clin d'œil en plein match, et j'ai raté le but."], grammar: [g.quebec-sacres], vocab: [w.ayoye] }
  - id: c2.u07.l4
    title: "La loi 101 et le français au travail"
    teach: [g.quebec-vocabulary, g.quebecois-grammar]
    tip: "Choose your French for your audience: Québec words (courriel, stationnement, magasiner) are fine everywhere and expected in Québec; joual features (chu, pantoute, -tu) belong with friends; the news, offices and letters use standard French."
    vocab: [w.souveraineté, w.souverainiste, w.fédéraliste, w.anglophone, w.allophone, w.révolution-tranquille.nm, w.charte-de-la-langue-française.nm, w.affichage, w.francisation, w.terminologie, w.stand-up, w.monologue, w.improvisation, w.festivalier, w.multiculturalisme, w.interculturel, w.accommodement-raisonnable, w.entrevue, w.niaiserie, w.chandail, w.immigrant, w.moderniser, w.de-justesse]
    sentences:
      - { es: "Adoptée en 1977, la Charte de la langue française a fait du français la langue du travail et de l'affichage.", en: "Adopted in 1977, the Charter of the French Language made French the language of work and of public signs.", altEs: ["La Charte de la langue française, adoptée en 1977, a fait du français la langue du travail et de l'affichage."], grammar: [g.participial-clauses, g.quebec-vocabulary], vocab: [w.charte-de-la-langue-française.nm, w.affichage], note: "Popularly known as la loi 101.", transform: { instruction: "Rewrite it with a relative clause: La Charte…, qui…", answer: "La Charte de la langue française, qui a été adoptée en 1977, a fait du français la langue du travail et de l'affichage.", alt: ["La Charte de la langue française, qu'on a adoptée en 1977, a fait du français la langue du travail et de l'affichage.", "La Charte de la langue française, qui fut adoptée en 1977, a fait du français la langue du travail et de l'affichage."], en: "The Charter of the French Language, which was adopted in 1977, made French the language of work and of public signs." } }
      - { es: "Les enfants d'immigrants doivent en principe fréquenter l'école française.", en: "The children of immigrants must, as a rule, attend French-language school.", altEs: ["En principe, les enfants d'immigrants doivent aller à l'école en français."], grammar: [g.quebec-vocabulary, g.devoir-nuances], vocab: [w.immigrant, w.francisation] }
      - { es: "Pendant la Révolution tranquille, le Québec s'est modernisé à grande vitesse.", en: "During the Quiet Revolution, Québec modernised at great speed.", altEs: ["Pendant la Révolution tranquille, dans les années 1960, le Québec s'est modernisé très vite."], grammar: [g.pronominal-passe-compose], vocab: [w.révolution-tranquille.nm] }
      - { es: "Aux référendums de 1980 et de 1995, les souverainistes ont perdu, la seconde fois de justesse.", en: "In the 1980 and 1995 referendums the sovereigntists lost, narrowly the second time.", altEs: ["Les souverainistes ont perdu les référendums de 1980 et de 1995, le second de justesse."], grammar: [g.passe-compose-avoir], vocab: [w.souverainiste], note: "In 1995, the No side won with about 50.6 % of the vote." }
      - { es: "Mon père est fédéraliste, ma mère souverainiste : les soupers de famille sont animés.", en: "My father is a federalist, my mother a sovereigntist: family suppers are lively.", altEs: ["Mon père est fédéraliste et ma mère souverainiste, alors les soupers de famille sont animés."], grammar: [g.quebec-vocabulary], vocab: [w.fédéraliste, w.souverainiste, w.souper] }
      - { es: "À Montréal, beaucoup d'allophones parlent trois langues : celle de leurs parents, le français et l'anglais.", en: "In Montreal, many allophones speak three languages: their parents' language, French and English.", altEs: ["À Montréal, de nombreux allophones parlent trois langues : celle de leurs parents, le français et l'anglais."], grammar: [g.demonstrative-pronouns], vocab: [w.allophone, w.anglophone] }
      - { es: "Le Québec parle d'interculturalisme plutôt que de multiculturalisme : on accueille les cultures autour du français.", en: "Québec speaks of interculturalism rather than multiculturalism: cultures are welcomed around French.", altEs: ["Le Québec préfère parler d'interculturalisme plutôt que de multiculturalisme : les cultures sont accueillies autour du français."], grammar: [g.quebec-vocabulary, g.on-instead-of-passive], vocab: [w.multiculturalisme, w.interculturel] }
      - { es: "Le débat sur les accommodements raisonnables a occupé les médias pendant des mois.", en: "The debate on reasonable accommodation kept the media busy for months.", altEs: ["Pendant des mois, le débat sur les accommodements raisonnables a occupé les médias."], grammar: [g.passe-compose-avoir], vocab: [w.accommodement-raisonnable] }
      - { es: "Au Québec, on écrit « courriel », « stationnement » et « magasinage » jusque dans les documents officiels.", en: "In Québec, 'courriel', 'stationnement' and 'magasinage' are written even in official documents.", altEs: ["Au Québec, on écrit « courriel », « stationnement » et « magasinage » même dans les documents officiels."], grammar: [g.quebec-vocabulary, g.on-instead-of-passive], vocab: [w.terminologie, w.courriel, w.stationnement] }
      - { es: "L'Office québécois de la langue française propose des mots français pour les nouvelles technologies.", en: "The Office québécois de la langue française proposes French words for new technologies.", altEs: ["L'Office québécois de la langue française propose des équivalents français pour les nouvelles technologies."], grammar: [g.quebec-vocabulary], vocab: [w.terminologie] }
      - { es: "En entrevue d'embauche, évite « chu » et « pantoute » : dis « je suis » et « pas du tout ».", en: "In a job interview, avoid 'chu' and 'pantoute': say 'je suis' and 'pas du tout'.", altEs: ["En entretien d'embauche, évite « chu » et « pantoute » : dis « je suis » et « pas du tout »."], grammar: [g.quebecois-grammar, g.register-levels], vocab: [w.chu, w.pantoute, w.entrevue] }
      - { es: "Chu pas mal content de mon entrevue.", en: "I'm pretty happy with my interview.", grammar: [g.quebecois-grammar, g.register-levels], vocab: [w.chu, w.entrevue], transform: { instruction: "Rewrite it for a formal email to the employer", answer: "Je suis très satisfait de mon entretien.", alt: ["Je suis très satisfaite de mon entretien.", "Je suis assez satisfait de mon entrevue.", "Je suis assez satisfaite de mon entrevue.", "Je suis très satisfait de mon entrevue.", "Je suis très satisfaite de mon entrevue."], en: "I am very satisfied with my interview." } }
      - { es: "Chaque juillet, des milliers de festivaliers viennent rire au festival Juste pour rire.", en: "Every July thousands of festival-goers come to laugh at the Just for Laughs festival.", altEs: ["Tous les ans en juillet, des milliers de festivaliers viennent rire au festival Juste pour rire."], grammar: [g.quebec-vocabulary], vocab: [w.festivalier], note: "The festival was founded in Montréal in 1983." }
      - { es: "Les humoristes québécois passent du joual au français standard au milieu d'un même monologue.", en: "Québec comedians switch from joual to standard French in the middle of a single routine.", altEs: ["Les humoristes québécois passent du joual au français standard en plein monologue."], grammar: [g.quebecois-grammar, g.register-levels], vocab: [w.monologue, w.joual] }
      - { es: "Le stand-up s'est imposé, mais le Québec a aussi inventé les matchs d'improvisation, en 1977.", en: "Stand-up has taken hold, but Québec also invented improv matches, in 1977.", altEs: ["Le stand-up a conquis le public, mais c'est au Québec qu'on a inventé les matchs d'improvisation, en 1977."], grammar: [g.pronominal-passe-compose], vocab: [w.stand-up, w.improvisation], note: "The Ligue nationale d'improvisation, with its hockey-style rules, was founded in Montréal in 1977." }
      - { es: "Qu'on soit fédéraliste ou souverainiste, on tient au français.", en: "Whether you're a federalist or a sovereigntist, you're attached to French.", altEs: ["Que l'on soit fédéraliste ou souverainiste, on tient au français."], grammar: [g.subjonctif-nuance, g.concession], vocab: [w.fédéraliste, w.souverainiste], error: { wrong: "Qu'on est fédéraliste ou souverainiste, on tient au français.", explain: "Que … ou … (whether … or …) takes the subjonctif: qu'on soit.", grammar: g.subjonctif-nuance } }
    exchanges:
      - q: { es: "Pourquoi tous les panneaux sont-ils en français ?", en: "Why are all the signs in French?" }
        a: { es: "À cause de la loi 101 : le français doit y être nettement prédominant.", en: "Because of Bill 101: French must be clearly predominant on them." }
        alt: ["C'est la loi 101.", "À cause de la Charte de la langue française."]
        grammar: [g.cause-advanced]
        vocab: [w.affichage]
      - q: { es: "Tu es souverainiste ?", en: "Are you a sovereigntist?" }
        a: { es: "Je l'étais à vingt ans ; aujourd'hui, j'avoue que je ne sais plus trop.", en: "I was at twenty; today, I admit I'm not so sure any more." }
        alt: ["Non, je suis plutôt fédéraliste.", "Oui, depuis toujours."]
        grammar: [g.imparfait-uses, g.negation-jamais-plus-rien]
        vocab: [w.souverainiste]
      - q: { es: "Comment on dit « podcast » au Québec ?", en: "How do you say 'podcast' in Québec?" }
        a: { es: "On dit « balado » ; c'est l'Office de la langue qui l'a proposé.", en: "They say 'balado'; the language office proposed it." }
        alt: ["Un balado.", "« Balado »."]
        grammar: [g.quebec-vocabulary, g.mise-en-relief]
        vocab: [w.balado, w.terminologie]
      - q: { es: "Tu as compris le spectacle d'humour ?", en: "Did you understand the comedy show?" }
        a: { es: "La moitié : quand il passait au joual, je décrochais complètement.", en: "Half of it: when he switched to joual, I lost the thread completely." }
        alt: ["Presque tout !", "Pas grand-chose, il parlait trop vite."]
        grammar: [g.imparfait-uses]
        vocab: [w.joual, w.monologue]
      - q: { es: "Je parle comment à mon futur patron ?", en: "How do I talk to my future boss?" }
        a: { es: "En français standard, avec le vouvoiement ; garde le joual pour tes chums.", en: "In standard French, using vous; keep the joual for your buddies." }
        alt: ["Vouvoie-le et évite le joual.", "Poliment, en français standard."]
        grammar: [g.register-levels, g.tu-vs-vous]
        vocab: [w.joual, w.chum]
    texts:
      - title: "Affiche dans une boutique"
        es: ["Ici, on vous sert en français.", "Bonjour ! Hi !", "Merci de votre visite, et à la prochaine !"]
        en: ["Here, we serve you in French.", "Bonjour! Hi!", "Thank you for your visit, and see you next time!"]
        grammar: [g.quebec-vocabulary]
        vocab: [w.affichage]
      - title: "Programme du festival"
        es: ["Vingt heures : soirée d'improvisation, arbitre et chandails de hockey compris.", "Vingt-deux heures : stand-up en français et en anglais.", "Minuit : monologues en joual, pour public averti."]
        en: ["8 p.m.: improv evening, referee and hockey jerseys included.", "10 p.m.: stand-up in French and English.", "Midnight: monologues in joual, for a mature audience."]
        grammar: [g.quebec-vocabulary]
        vocab: [w.improvisation, w.stand-up, w.monologue]
    spicy:
      - { es: "Je suis fédéraliste en politique, mais pour toi, je réclame la souveraineté totale de mon cœur.", en: "I'm a federalist in politics, but for you I claim total sovereignty over my heart.", altEs: ["En politique, je suis fédéraliste, mais pour toi, je réclame la souveraineté de mon cœur."], grammar: [g.quebec-vocabulary], vocab: [w.fédéraliste, w.souveraineté] }
      - { es: "Ton monologue au festival était drôle, mais ton clin d'œil au premier rang l'était encore plus.", en: "Your routine at the festival was funny, but your wink at the front row was even funnier.", altEs: ["Ton monologue au festival était drôle, mais ton clin d'œil au premier rang était encore plus drôle."], grammar: [g.comparatives], vocab: [w.monologue] }
      - { es: "En entrevue, je te vouvoie ; au souper, chu ben content de te tutoyer.", en: "In an interview I'd use vous with you; at supper I'm very happy to use tu.", altEs: ["En entrevue, je te dirais vous ; au souper, je suis bien content de te tutoyer."], grammar: [g.quebecois-grammar, g.register-levels], vocab: [w.chu, w.entrevue] }
      - { es: "Pour notre premier rendez-vous, une soirée d'improvisation : comme ça, si je dis une niaiserie, ça fera partie du show.", en: "For our first date, an improv night: that way, if I say something silly, it'll be part of the show.", altEs: ["Pour notre premier rendez-vous, une soirée d'improvisation : si je dis une bêtise, ça fera partie du spectacle."], grammar: [g.si-present-futur], vocab: [w.improvisation, w.show, w.niaiserie] }
dialogues:
  - id: c2.u07.d1
    title: "Au dépanneur, rue Saint-Denis"
    context: "Sophie, who has just arrived from Lyon, goes shopping with her Montréal friend Maxime and runs into a few words she didn't expect."
    lines:
      - { speaker: Maxime, es: "Allô Sophie ! T'as l'air gelée. Tu veux-tu qu'on arrête au dépanneur ?", en: "Hi Sophie! You look frozen. Do you want to stop at the corner shop?" }
      - { speaker: Sophie, es: "Le dépanneur ? Ma voiture n'est pas en panne, pourtant.", en: "The dépanneur? My car hasn't broken down, though." }
      - { speaker: Maxime, es: "Mais non ! Ici, un dépanneur, c'est une petite épicerie de quartier. On va t'acheter une tuque.", en: "No! Here a dépanneur is a little neighbourhood grocery. We'll buy you a woolly hat." }
      - { speaker: Sophie, es: "Une tuque ? Ah, un bonnet ! Et des moufles, peut-être ?", en: "A tuque? Ah, a bonnet! And some mittens, maybe?" }
      - { speaker: Maxime, es: "Des mitaines, oui. Tabarouette, il fait moins vingt, t'as raison de te couvrir.", en: "Mitaines, yes. Gosh, it's minus twenty, you're right to wrap up." }
      - { speaker: Sophie, es: "Au fait, ta blonde vient-elle ce soir ? J'aimerais bien la rencontrer.", en: "By the way, is your girlfriend coming tonight? I'd really like to meet her." }
      - { speaker: Maxime, es: "Ma blonde est brune, mais oui, elle vient. On soupe à sept heures, après on va voir un show d'humour.", en: "My 'blonde' is a brunette, but yes, she's coming. We're having supper at seven, then we're going to a comedy show." }
      - { speaker: Sophie, es: "Je vais comprendre l'humoriste, tu penses ?", en: "Do you think I'll understand the comedian?" }
      - { speaker: Maxime, es: "La moitié, peut-être. S'il parle trop joual, je te traduirai.", en: "Half of it, maybe. If he speaks too much joual, I'll translate for you." }
      - { speaker: Sophie, es: "Merci, t'es adorable.", en: "Thanks, you're a sweetheart." }
      - { speaker: Maxime, es: "Bienvenue ! Bon, on y va-tu ? Le métro passe dans trois minutes.", en: "You're welcome! Right, shall we go? The metro comes in three minutes." }
    questions:
      - { q: "Qu'est-ce qu'un dépanneur au Québec ?", options: ["Un mécanicien", "Une petite épicerie de quartier", "Un magasin de vêtements"], answer: 1, explain: "Maxime explains that in Québec a dépanneur is a corner shop; in France it's a breakdown mechanic." }
      - { q: "Qu'est-ce que Maxime veut acheter à Sophie ?", options: ["Une tuque", "Une liqueur", "Un cellulaire"], answer: 0, explain: "It's minus twenty, so he suggests a tuque (woolly hat)." }
      - { q: "Pourquoi Sophie est-elle surprise par « ma blonde » ?", options: ["Parce que l'amie de Maxime est brune", "Parce que Maxime n'a pas d'amie", "Parce que le mot est vulgaire"], answer: 0, explain: "In Québec ma blonde means 'my girlfriend', whatever her hair colour: Maxime's is a brunette." }
      - { q: "Que veut dire « Bienvenue ! » à la fin du dialogue ?", options: ["Bienvenue à Montréal", "De rien", "Au revoir"], answer: 1, explain: "In Québec, Bienvenue! answers Merci and means 'you're welcome'." }
writing:
  - task: "Your Montréal friend left you this message. Rewrite it in the standard French of France for a European friend, and explain three differences."
    es: "Allô ! Tu viens-tu au show à soir ? Ma blonde pis moé, on va être là. Chu tanné de rester à maison, y fait frette en mosus !"
    min: 130
    max: 220
    use: [w.blonde, w.show, w.tanné, w.frette, w.mosus]
    useAtLeast: 3
    grammar: [g.quebecois-grammar, g.quebec-vocabulary]
    expect:
      - { pattern: "\\b(petite amie|copine|spectacle|concert|ce soir|en avoir assez|j['’]en ai assez|froid)\\b", hint: "Give the standard French: le spectacle, ce soir, ma copine, j'en ai assez, froid…" }
      - { pattern: "\\b(au qu[eé]bec|qu[eé]b[eé]cois|signifie|veut dire|en france|on dirait|correspond)", hint: "Explain the differences: au Québec, « blonde » signifie…" }
    model: { es: "En français de France, le message donnerait à peu près : « Salut ! Tu viens au spectacle ce soir ? Ma copine et moi, nous serons là. J'en ai assez de rester à la maison, il fait vraiment très froid ! » Trois différences méritent une explication. D'abord, le « tu » répété dans « Tu viens-tu ? » n'est pas une erreur : au Québec, quand on parle, ce petit mot sert à poser une question fermée, comme « est-ce que » en France. Ensuite, « ma blonde » ne désigne pas forcément une femme aux cheveux blonds : ce mot signifie tout simplement « ma petite amie », de même que « mon chum » veut dire « mon petit ami ». Enfin, « frette » veut dire « froid », mais avec plus de force, et « en mosus » est une façon polie de dire « énormément », qui remplace un gros mot plus fort. Quant à « chu tanné », c'est la prononciation familière de « je suis tanné », c'est-à-dire « j'en ai assez ».", en: "In the French of France, the message would come out roughly as: 'Hi! Are you coming to the show tonight? My girlfriend and I will be there. I'm fed up with staying at home, it's really very cold!' Three differences deserve an explanation. First, the repeated 'tu' in 'Tu viens-tu?' isn't a mistake: in spoken Québec French this little word is used to ask a yes/no question, like 'est-ce que' in France. Next, 'ma blonde' doesn't necessarily mean a fair-haired woman: the word simply means 'my girlfriend', just as 'mon chum' means 'my boyfriend'. Finally, 'frette' means 'froid', but with more force, and 'en mosus' is a polite way of saying 'enormously', replacing a stronger rude word. As for 'chu tanné', it's the familiar pronunciation of 'je suis tanné', i.e. 'I'm fed up'." }
  - task: "Write a short guide for Europeans arriving in Montréal in winter: the Québec words they will hear and need (tuque, mitaines, dépanneur, magasiner, poudrerie, banc de neige…)."
    min: 130
    max: 220
    use: [w.tuque, w.mitaine, w.dépanneur, w.magasiner, w.poudrerie]
    useAtLeast: 3
    grammar: [g.quebec-vocabulary]
    expect:
      - { pattern: "\\b(tuques?|mitaines?|chars?|d[eé]panneurs?|magasiner|poudrerie|frette|bancs? de neige|gougounes|cellulaires?|breuvages?|blonde|chum|jaser|piasses?|poutine|bas)\\b", hint: "Use Québec words: tuque, mitaines, dépanneur, magasiner, poudrerie…" }
    model: { es: "Bienvenue à Montréal ! Pour survivre à votre premier hiver, quelques mots vous seront indispensables. Avant de sortir, n'oubliez pas votre tuque, c'est-à-dire votre bonnet, ni vos mitaines, ces gants sans doigts séparés qui gardent mieux la chaleur. Quand le vent soulève la neige et qu'on n'y voit plus rien, les Québécois parlent de poudrerie. Après une tempête, les rues sont bordées de bancs de neige, ces énormes montagnes de neige que les souffleuses poussent sur les trottoirs. Attention à votre char, autrement dit votre voiture : s'il est mal stationné un soir de déneigement, il sera remorqué ! Si vous avez besoin de lait ou de pain à minuit, allez au dépanneur, la petite épicerie du coin. Et le samedi, faites comme les Montréalais : allez magasiner dans la ville souterraine, bien au chaud. Enfin, pour vous réchauffer, rien ne vaut une bonne poutine !", en: "Welcome to Montréal! To survive your first winter, a few words will be essential. Before going out, don't forget your tuque, that is, your woolly hat, or your mitaines, those mittens without separate fingers that keep the warmth in better. When the wind lifts the snow and you can't see anything any more, Quebecers talk of poudrerie. After a storm the streets are lined with bancs de neige, those huge mountains of snow the snowblowers push onto the pavements. Watch out for your char, in other words your car: if it's badly parked on a snow-clearing night, it will be towed away! If you need milk or bread at midnight, go to the dépanneur, the little corner shop. And on Saturdays do as Montrealers do: go shopping (magasiner) in the underground city, nice and warm. Finally, to warm yourself up, nothing beats a good poutine!" }
  - task: "Explain to a learner what Québec sacres are, why they come from religious words, and why they should be used with great care; mention some softened versions (tabarouette, mosus, câline…)."
    min: 130
    max: 220
    use: [w.tabarouette, w.mosus, w.câline, w.maudit, w.tabarnak]
    useAtLeast: 3
    grammar: [g.quebec-sacres]
    expect:
      - { pattern: "\\b(sacres?|tabarnak|c[aâ]lisse|tabarouette|tabarnouche|mosus|mautadit|maudit|c[aâ]line)\\b", hint: "Mention the sacres and their softened forms: tabarnak, tabarouette, mosus…" }
      - { pattern: "\\b(religi|[eé]glise|tabous?|choqu|vulgaire|attention|prudence|[eé]viter|grossi)", hint: "Explain the religious origin and why to be careful." }
    model: { es: "Au Québec, les jurons les plus forts ne parlent pas du corps : ils viennent de la religion. On les appelle des sacres. La plupart sont des mots de l'église, à peine transformés, comme « tabarnak » ou « câlisse ». Pourquoi ? Pendant des siècles, l'Église a dirigé toute la vie des Québécois, de l'école à l'hôpital. Utiliser ces mots sacrés de façon vulgaire était donc la pire des fautes. Aujourd'hui, la société est beaucoup moins religieuse, mais ces mots restent très grossiers dans de nombreuses situations. C'est pourquoi un étudiant étranger devrait les éviter : prononcés avec un accent étranger, ils sonnent souvent faux. Heureusement, il existe des formes plus douces, presque tendres : « tabarouette » ou « tabarnouche » au lieu de « tabarnak », « câline » au lieu de « câlisse », « mosus » ou « mautadit » au lieu de « maudit ». Ces versions vous permettront d'exprimer votre surprise sans choquer personne.", en: "In Québec the strongest swear words are not about the body: they come from religion. They are called sacres. Most are church words, barely altered, such as 'tabarnak' or 'câlisse'. Why? For centuries the Church ran the whole of Quebecers' lives, from school to hospital. Using these sacred words vulgarly was therefore the worst of faults. Today society is much less religious, but these words remain very coarse in many situations. That's why a foreign student should avoid them: said with a foreign accent, they often sound wrong. Fortunately there are gentler, almost tender forms: 'tabarouette' or 'tabarnouche' instead of 'tabarnak', 'câline' instead of 'câlisse', 'mosus' or 'mautadit' instead of 'maudit'. These versions will let you express surprise without shocking anyone." }
  - task: "Write a balanced opinion piece on the Charter of the French Language (Bill 101) in Québec: protecting French versus openness to other languages."
    min: 150
    max: 220
    use: [w.francisation, w.affichage, w.anglophone, w.allophone, w.souveraineté]
    useAtLeast: 3
    grammar: [g.quebec-vocabulary, g.quebecois-grammar]
    expect:
      - { pattern: "\\b(loi 101|charte|francisation|affichage|anglophones?|allophones?|souverainet)", hint: "Discuss Bill 101: la charte, la francisation, l'affichage, les anglophones…" }
      - { pattern: "\\b(certes|toutefois|n[eé]anmoins|cependant|or|en revanche|il n['’]en demeure pas moins|d['’]un c[oô]t[eé])", hint: "Weigh both sides: certes…, toutefois…, d'un côté…" }
    model: { es: "Adoptée en 1977, la Charte de la langue française, plus connue sous le nom de loi 101, a fait du français la seule langue officielle du Québec. Elle impose l'affichage commercial en français, oblige les enfants d'immigrants à fréquenter l'école française et encourage la francisation des entreprises. D'un côté, ceux qui la défendent rappellent qu'au milieu de plus de trois cents millions d'anglophones en Amérique du Nord, le français ne peut survivre sans protection. Avant la loi, les francophones de Montréal devaient souvent travailler en anglais. Certes, ce bilan est indéniable : grâce à la loi 101, des milliers d'allophones parlent aujourd'hui français. Toutefois, ses critiques jugent certaines règles exagérées, notamment envers la minorité anglophone, présente au Québec depuis des siècles, qui se sent parfois oubliée. Il n'en demeure pas moins que la question dépasse celle de la souveraineté : il s'agit de savoir comment une petite nation peut rester elle-même tout en restant ouverte au monde.", en: "Adopted in 1977, the Charter of the French Language, better known as Bill 101, made French the sole official language of Québec. It requires commercial signs to be in French, obliges immigrants' children to attend French-language schools and encourages the francisation of businesses. On the one hand, those who defend it point out that amid more than three hundred million English speakers in North America, French cannot survive without protection. Before the law, francophones in Montréal often had to work in English. Admittedly, this record is undeniable: thanks to Bill 101, thousands of allophones speak French today. However, its critics consider some rules exaggerated, particularly towards the English-speaking minority, present in Québec for centuries, which sometimes feels forgotten. The fact remains that the question goes beyond that of sovereignty: it is about how a small nation can remain itself while staying open to the world." }
