id: r.b2.la-becaria-y-el-usted
level: b2
title: La becaria y el usted
kind: text
intro: A humorous story about an intern's first weeks in a Madrid office, where she learns to switch between colloquial and formal register and to use the right collocations.
allow: [lucía, ramírez, marta, iván]
paragraphs:
  - { es: "El primer día de prácticas, Lucía metió la pata antes de las diez de la mañana. Entró en el despacho del director, le dio dos besos y le dijo: «¡Qué pasa! Soy la becaria nueva, ¿me echas una mano para encontrar mi mesa?». El señor Ramírez, que llevaba treinta años en la empresa y corbata todos los días, la miró por encima de las gafas y respondió: «Buenos días. Pregúntele a mi secretaria, por favor».", en: "On the first day of her internship, Lucía put her foot in it before ten in the morning. She walked into the director's office, kissed him on both cheeks and said: 'Hey! I'm the new intern, can you give me a hand finding my desk?' Mr Ramírez, who had been at the company for thirty years and wore a tie every day, looked at her over his glasses and replied: 'Good morning. Ask my secretary, please'." }
  - { es: "Lucía se puso roja hasta las orejas. En la universidad todo el mundo se tuteaba, hasta los profesores. Nadie le había explicado que en una oficina hay dos idiomas: el de la máquina de café y el de las reuniones.", en: "Lucía went red to the tips of her ears. At university everyone used tú, even the lecturers. Nobody had explained to her that in an office there are two languages: the one by the coffee machine and the one in meetings." }
  - { es: "Marta, su compañera de mesa, se echó a reír cuando se lo contó. «Tranquila, tía, a todos nos pasa. Con Ramírez, usted y frases completas. Con nosotros, lo que quieras. Y con los clientes, ni se te ocurra decir “guay” o “un montón”». Lucía tomó nota en una libreta, como si fuera gramática.", en: "Marta, her desk neighbour, burst out laughing when she told her. 'Relax, love, it happens to all of us. With Ramírez, usted and full sentences. With us, whatever you like. And with clients, don't even think of saying guay or un montón.' Lucía took notes in a notebook, as if it were grammar." }
  - { es: "La segunda semana le encargaron escribir un correo a un cliente importante. Su primer borrador empezaba así: «Hola, te escribo porque hay un problemilla con la factura». Marta le echó un vistazo y tachó casi todo. La versión final decía: «Estimado señor: le escribo en relación con la factura del mes de marzo. Lamentamos las molestias ocasionadas». «Es lo mismo», protestó Lucía. «Es lo mismo, pero no suena igual», contestó Marta.", en: "In the second week she was asked to write an email to an important client. Her first draft began like this: 'Hi, I'm writing because there's a little problem with the invoice'. Marta had a look and crossed out almost everything. The final version read: 'Dear Sir, I am writing regarding the invoice for the month of March. We regret the inconvenience caused'. 'It's the same thing', Lucía protested. 'It's the same thing, but it doesn't sound the same', Marta replied." }
  - { es: "Poco a poco, Lucía fue aprendiendo a cambiar de registro como quien cambia de chaqueta. Por la mañana decía «buenos días, señor Ramírez, ¿podría firmarme esto?» y a la hora de comer «Iván, colega, ¿me pillas un café, que no tengo pasta?». Lo que más le costaba eran las colocaciones: durante un mes dijo «hacer una decisión» hasta que Iván, con mucha paciencia, le explicó que las decisiones se toman.", en: "Little by little, Lucía learned to change register the way one changes jackets. In the morning she would say 'good morning, Mr Ramírez, could you sign this for me?' and at lunchtime 'Iván, mate, can you grab me a coffee, I've got no cash?'. What she found hardest were the collocations: for a month she said hacer una decisión until Iván, very patiently, explained to her that decisions are tomadas." }
  - { es: "En junio hubo una reunión con los clientes más importantes del año. Ramírez, enfermo, no pudo asistir, y alguien tenía que presentar las cifras. Lucía se ofreció. Habló de usted, no dijo ni una palabrota ni un «o sea», usó «no obstante» dos veces y «en definitiva» una. Los clientes firmaron.", en: "In June there was a meeting with the most important clients of the year. Ramírez, ill, could not attend, and someone had to present the figures. Lucía volunteered. She used usted, did not say a single swear word or a single o sea, used no obstante twice and en definitiva once. The clients signed." }
  - { es: "Al día siguiente, el director la llamó a su despacho. Lucía entró con el corazón a mil, pensando en el primer día. Ramírez se quitó las gafas, sonrió por primera vez en seis meses y le dijo: «Enhorabuena. Y, por favor, tutéame; después de lo de ayer, creo que te lo has ganado».", en: "The next day, the director called her into his office. Lucía walked in with her heart racing, thinking about the first day. Ramírez took off his glasses, smiled for the first time in six months and said: 'Congratulations. And please, use tú with me; after yesterday, I think you've earned it'." }
questions:
  - { q: "What mistake did Lucía make on her first day?", options: ["She arrived late", "She greeted the director informally and used tú", "She sent a wrong invoice"], answer: 1 }
  - { q: "According to Marta, which words should Lucía never use with clients?", options: ["usted and señor", "guay and un montón", "no obstante and en definitiva"], answer: 1 }
  - { q: "Which collocation did Lucía get wrong for a month?", options: ["echar una mano", "hacer una decisión instead of tomar una decisión", "meter la pata"], answer: 1 }
  - { q: "How does the story end?", options: ["Lucía is fired", "The director asks her to use tú with him", "Lucía leaves the company"], answer: 1 }
glossary:
  - { es: prácticas, en: internship }
  - { es: corbata, en: tie }
  - { es: por encima de, en: over (the top of) }
  - { es: secretaria, en: secretary }
  - { es: oreja, en: ear }
  - { es: libreta, en: notebook }
  - { es: tachar, en: to cross out }
  - { es: versión, en: version }
  - { es: en relación con, en: regarding }
  - { es: chaqueta, en: jacket }
  - { es: ofrecerse, en: to volunteer }
  - { es: a mil, en: racing (heart) }
  - { es: ganarse, en: to earn (something) }
