id: a1.u05
title: "Un caffè, per favore"
lessons:
  - id: a1.u05.l1
    title: Al bar
    teach: [g.volere-vorrei]
    vocab: [w.bar, w.caffè, w.cappuccino, w.espresso, w.macchiato, w.tè, w.latte, w.acqua, w.acqua-frizzante, w.acqua-naturale, w.succo, w.spremuta, w.cornetto, w.maritozzo, w.bicchiere, w.tazza, w.zucchero, w.colazione, w.fare-colazione, w.volere, w.prendere, w.subito]
    tip: "Order with vorrei (I'd like) or simply Un caffè, per favore. Voglio (I want) can sound blunt to a waiter."
    sentences:
      - { es: "Vorrei un caffè, per favore.", en: "I'd like a coffee, please.", altEs: ["Un caffè, per favore.", "Vorrei un espresso, per favore."], altEn: ["Could I have a coffee, please?"], grammar: [g.volere-vorrei], vocab: [w.volere, w.caffè], transform: { instruction: "Order two coffees", answer: "Vorrei due caffè, per favore.", alt: ["Due caffè, per favore."] } }
      - { es: "Che cosa prendi? — Un cappuccino e un cornetto.", en: "What are you having? — A cappuccino and a croissant.", altEs: ["Cosa prendi? — Un cappuccino e un cornetto."], grammar: [g.present-ere-ire, g.question-words], vocab: [w.prendere, w.cappuccino, w.cornetto] }
      - { es: "Voglio un tè, non un caffè!", en: "I want a tea, not a coffee!", altEs: ["Io voglio un tè, non un caffè!"], grammar: [g.volere-vorrei], vocab: [w.volere, w.tè] }
      - { es: "Vuoi un bicchiere d'acqua?", en: "Do you want a glass of water?", altEs: ["Vuoi un bicchiere di acqua?", "Tu vuoi un bicchiere d'acqua?"], altEn: ["Would you like a glass of water?"], grammar: [g.volere-vorrei], vocab: [w.bicchiere, w.acqua], transform: { instruction: "Ask formally (Lei)", answer: "Vuole un bicchiere d'acqua?", alt: ["Lei vuole un bicchiere d'acqua?", "Vuole un bicchiere di acqua?"] } }
      - { es: "Per me una spremuta d'arancia, grazie.", en: "A fresh orange juice for me, thanks.", altEs: ["Per me una spremuta di arancia, grazie."], grammar: [g.volere-vorrei], vocab: [w.spremuta] }
      - { es: "Vorremmo due cappuccini e un succo di frutta.", en: "We'd like two cappuccinos and a fruit juice.", altEs: ["Noi vorremmo due cappuccini e un succo di frutta."], grammar: [g.volere-vorrei, g.plural-nouns], vocab: [w.cappuccino, w.succo] }
      - { es: "Signore, vuole l'acqua frizzante o naturale?", en: "Sir, would you like sparkling or still water?", altEs: ["Vuole l'acqua frizzante o naturale, signore?"], grammar: [g.volere-vorrei, g.tu-vs-lei], vocab: [w.acqua-frizzante, w.acqua-naturale] }
      - { es: "Volete un maritozzo? È buonissimo!", en: "Do you (all) want a maritozzo? It's delicious!", altEs: ["Volete un maritozzo? È molto buono!"], grammar: [g.volere-vorrei], vocab: [w.maritozzo], note: "A maritozzo is a soft Roman bun filled with whipped cream, often eaten for breakfast." }
      - { es: "Prendo il caffè senza zucchero.", en: "I take my coffee without sugar.", altEs: ["Io prendo il caffè senza zucchero."], altEn: ["I have my coffee with no sugar."], grammar: [g.present-ere-ire], vocab: [w.zucchero, w.prendere] }
      - { es: "Faccio colazione al bar: cappuccino e cornetto.", en: "I have breakfast at the café: cappuccino and croissant.", altEs: ["Faccio colazione al bar, con cappuccino e cornetto."], grammar: [g.fare-present], vocab: [w.fare-colazione, w.bar] }
      - { es: "Una tazza di tè caldo, per favore.", en: "A cup of hot tea, please.", altEs: ["Vorrei una tazza di tè caldo, per favore."], grammar: [g.volere-vorrei], vocab: [w.tazza, w.tè] }
      - { es: "Loro vogliono un caffè subito!", en: "They want a coffee right away!", altEs: ["Vogliono un caffè subito!"], grammar: [g.volere-vorrei], vocab: [w.volere, w.subito], error: { wrong: "Loro volono un caffè subito!", explain: "volere is irregular: voglio, vuoi, vuole, vogliamo, volete, vogliono.", grammar: g.volere-vorrei } }
      - { es: "Vorrei un bicchiere di latte freddo.", en: "I'd like a glass of cold milk.", grammar: [g.volere-vorrei], vocab: [w.latte, w.bicchiere] }
      - { es: "Scusi, vorrei un caffè macchiato.", en: "Excuse me, I'd like a macchiato.", altEs: ["Scusi, un macchiato, per favore."], altEn: ["Excuse me, I'd like an espresso with a dash of milk."], grammar: [g.volere-vorrei], vocab: [w.macchiato], error: { wrong: "Scusi, vorrei un caffè macchiata.", explain: "macchiato agrees with caffè, which is masculine.", grammar: g.adjective-agreement } }
      - { es: "Al bar molti romani prendono il caffè in piedi.", en: "At the bar many Romans have their coffee standing up.", altEs: ["Al bar tanti romani bevono il caffè in piedi."], grammar: [g.present-ere-ire], vocab: [w.bar, w.prendere] }
      - { es: "La colazione italiana è dolce: un cornetto e un cappuccino.", en: "An Italian breakfast is sweet: a croissant and a cappuccino.", grammar: [g.adjective-agreement], vocab: [w.colazione, w.cornetto] }
    exchanges:
      - q: { es: "Buongiorno, che cosa prende?", en: "Good morning, what will you have?" }
        a: { es: "Vorrei un cappuccino e un cornetto, per favore.", en: "I'd like a cappuccino and a croissant, please." }
        alt: ["Un caffè, grazie.", "Un cappuccino, per favore.", "Vorrei un tè."]
        grammar: [g.volere-vorrei, g.tu-vs-lei]
        vocab: [w.prendere, w.cappuccino, w.cornetto]
      - q: { es: "Vuoi un caffè?", en: "Do you want a coffee?" }
        a: { es: "No, grazie, preferisco un tè.", en: "No, thanks, I'd rather have a tea." }
        alt: ["Sì, grazie!", "Volentieri!", "Sì, un espresso."]
        grammar: [g.volere-vorrei]
        vocab: [w.caffè, w.tè]
      - q: { es: "Acqua frizzante o naturale?", en: "Sparkling or still water?" }
        a: { es: "Naturale, grazie.", en: "Still, thanks." }
        alt: ["Frizzante, per favore.", "Naturale.", "Frizzante."]
        grammar: [g.volere-vorrei]
        vocab: [w.acqua-frizzante, w.acqua-naturale]
      - q: { es: "Con lo zucchero?", en: "With sugar?" }
        a: { es: "No, senza zucchero, grazie.", en: "No, without sugar, thanks." }
        alt: ["Sì, grazie.", "Sì, un po'.", "Senza, grazie."]
        grammar: [g.volere-vorrei]
        vocab: [w.zucchero]
      - q: { es: "Che cosa volete?", en: "What would you (all) like?" }
        a: { es: "Vorremmo due spremute d'arancia.", en: "We'd like two fresh orange juices." }
        alt: ["Due caffè, grazie.", "Vorremmo due cappuccini.", "Due spremute, per favore."]
        grammar: [g.volere-vorrei]
        vocab: [w.volere, w.spremuta]
    texts:
      - title: "Il bar vicino alla fontana"
        es: ["Il bar è vicino alla Fontana di Trevi.", "La mattina tanti romani fanno colazione qui.", "Prendono un caffè o un cappuccino con un cornetto."]
        en: ["The café is near the Trevi Fountain.", "In the morning lots of Romans have breakfast here.", "They have a coffee or a cappuccino with a croissant."]
        grammar: [g.present-ere-ire]
        vocab: [w.bar, w.fare-colazione, w.cornetto]
      - title: "Ordine"
        es: ["Per il tavolo cinque: due cappuccini e un tè.", "Poi un succo di frutta e un bicchiere d'acqua.", "Subito, grazie!"]
        en: ["For table five: two cappuccinos and a tea.", "Then a fruit juice and a glass of water.", "Right away, thanks!"]
        grammar: [g.volere-vorrei]
        vocab: [w.cappuccino, w.succo, w.bicchiere, w.subito]
    spicy:
      - { es: "Vorrei un caffè... e il tuo numero.", en: "I'd like a coffee... and your number.", altEs: ["Vorrei un caffè e il tuo numero di telefono."], grammar: [g.volere-vorrei], vocab: [w.volere, w.caffè] }
      - { es: "Vuoi un caffè con me? Domani? Oggi? Subito?", en: "Do you want a coffee with me? Tomorrow? Today? Right now?", grammar: [g.volere-vorrei], vocab: [w.volere, w.subito] }
      - { es: "Il cappuccino è dolce, ma tu di più.", en: "The cappuccino is sweet, but you're sweeter.", grammar: [g.volere-vorrei], vocab: [w.cappuccino] }
      - { es: "Vorrei un'acqua fredda: con te qui fa troppo caldo.", en: "I'd like a cold water: with you here it's too hot.", grammar: [g.volere-vorrei], vocab: [w.acqua] }
      - { es: "Due cappuccini: uno per me e uno per la persona più bella del bar.", en: "Two cappuccinos: one for me and one for the most beautiful person in the café.", grammar: [g.volere-vorrei], vocab: [w.cappuccino, w.bar] }
  - id: a1.u05.l2
    title: Parlo, mangio, pago
    teach: [g.present-are]
    vocab: [w.parlare, w.mangiare, w.ordinare, w.pagare, w.cercare, w.aspettare, w.ascoltare, w.lavorare, w.studiare, w.imparare, w.cucinare, w.provare, w.amare, w.pranzare, w.cenare, w.conto, w.lanciare]
    tip: "-are verbs: parlo, parli, parla, parliamo, parlate, parlano. Verbs in -care and -gare add h before i: cerchi, paghiamo."
    sentences:
      - { es: "Parlo italiano con il cameriere.", en: "I speak Italian with the waiter.", altEs: ["Io parlo italiano con il cameriere.", "Parlo italiano col cameriere."], grammar: [g.present-are], vocab: [w.parlare] }
      - { es: "Mangi la pizza con le mani?", en: "Do you eat pizza with your hands?", altEs: ["Tu mangi la pizza con le mani?"], grammar: [g.present-are], vocab: [w.mangiare], error: { wrong: "Mangii la pizza con le mani?", explain: "Verbs in -iare keep only one i: mangi, mangiamo.", grammar: g.present-are } }
      - { es: "Giulia lavora vicino alla Fontana di Trevi.", en: "Giulia works near the Trevi Fountain.", grammar: [g.present-are], vocab: [w.lavorare] }
      - { es: "Pranziamo alle due e ceniamo alle nove.", en: "We have lunch at two and dinner at nine.", altEs: ["Noi pranziamo alle due e ceniamo alle nove."], grammar: [g.present-are, g.time-telling], vocab: [w.pranzare, w.cenare], transform: { instruction: "Change to 'they'", answer: "Pranzano alle due e cenano alle nove.", alt: ["Loro pranzano alle due e cenano alle nove."] } }
      - { es: "Voi che cosa ordinate?", en: "What are you (all) ordering?", altEs: ["Che cosa ordinate?", "Cosa ordinate voi?"], grammar: [g.present-are, g.question-words], vocab: [w.ordinare] }
      - { es: "I turisti pagano il conto e poi lanciano una moneta nella fontana.", en: "The tourists pay the bill and then throw a coin into the fountain.", grammar: [g.present-are], vocab: [w.pagare, w.conto, w.lanciare] }
      - { es: "Pago io!", en: "I'll pay!", altEs: ["Pago io, grazie!"], altEn: ["It's on me!"], grammar: [g.present-are, g.subject-pronouns], vocab: [w.pagare], transform: { instruction: "Change to 'we'", answer: "Paghiamo noi!" } }
      - { es: "Cerchiamo un tavolo libero.", en: "We're looking for a free table.", altEs: ["Noi cerchiamo un tavolo libero."], grammar: [g.present-are], vocab: [w.cercare], error: { wrong: "Cerciamo un tavolo libero.", explain: "Verbs in -care add h to keep the hard c sound: cerchi, cerchiamo.", grammar: g.present-are } }
      - { es: "Aspetto Giulia davanti al bar.", en: "I'm waiting for Giulia in front of the café.", altEs: ["Io aspetto Giulia davanti al bar."], grammar: [g.present-are], vocab: [w.aspettare], note: "aspettare needs no 'for': aspetto Giulia." }
      - { es: "Ascolti la musica mentre cucini?", en: "Do you listen to music while you cook?", altEs: ["Tu ascolti la musica mentre cucini?"], grammar: [g.present-are], vocab: [w.ascoltare, w.cucinare] }
      - { es: "Studio italiano perché amo l'Italia.", en: "I'm studying Italian because I love Italy.", altEs: ["Studio l'italiano perché amo l'Italia."], grammar: [g.present-are], vocab: [w.studiare, w.amare] }
      - { es: "Impariamo dieci parole nuove ogni giorno.", en: "We learn ten new words every day.", altEs: ["Ogni giorno impariamo dieci parole nuove."], grammar: [g.present-are], vocab: [w.imparare] }
      - { es: "Mio padre cucina benissimo.", en: "My father cooks really well.", altEs: ["Mio papà cucina benissimo."], grammar: [g.present-are], vocab: [w.cucinare] }
      - { es: "Provi questo dolce? È buonissimo!", en: "Will you try this dessert? It's delicious!", altEs: ["Vuoi provare questo dolce? È buonissimo!"], grammar: [g.present-are], vocab: [w.provare] }
      - { es: "Loro parlano troppo e non mangiano!", en: "They talk too much and don't eat!", altEs: ["Parlano troppo e non mangiano!"], grammar: [g.present-are], vocab: [w.parlare, w.mangiare], transform: { instruction: "Change to 'you' (tu)", answer: "Tu parli troppo e non mangi!", alt: ["Parli troppo e non mangi!"] } }
    exchanges:
      - q: { es: "Parli italiano?", en: "Do you speak Italian?" }
        a: { es: "Sì, parlo un po' di italiano.", en: "Yes, I speak a bit of Italian." }
        alt: ["Sì, un po'.", "No, parlo inglese.", "Sì, abbastanza bene."]
        grammar: [g.present-are]
        vocab: [w.parlare]
      - q: { es: "Chi paga il conto?", en: "Who's paying the bill?" }
        a: { es: "Pago io!", en: "I'll pay!" }
        alt: ["Paghiamo insieme.", "Paga Marco!", "Pago io, grazie."]
        grammar: [g.present-are]
        vocab: [w.pagare, w.conto]
      - q: { es: "Che cosa cucini stasera?", en: "What are you cooking tonight?" }
        a: { es: "Cucino gli spaghetti al pomodoro.", en: "I'm making spaghetti with tomato sauce." }
        alt: ["La pasta.", "Una pizza!", "Niente: ceniamo fuori!"]
        grammar: [g.present-are]
        vocab: [w.cucinare]
      - q: { es: "Chi aspetti?", en: "Who are you waiting for?" }
        a: { es: "Aspetto Giulia.", en: "I'm waiting for Giulia." }
        alt: ["Una mia amica.", "Aspetto un amico.", "Nessuno."]
        grammar: [g.present-are]
        vocab: [w.aspettare]
      - q: { es: "A che ora pranzate?", en: "What time do you (all) have lunch?" }
        a: { es: "Pranziamo all'una.", en: "We have lunch at one." }
        alt: ["All'una.", "Alle due.", "Verso l'una e mezza."]
        grammar: [g.present-are, g.time-telling]
        vocab: [w.pranzare]
    texts:
      - title: "Messaggio di Marco"
        es: ["Ciao Tom! Stasera ceniamo da me.", "Cucino io: pasta e pollo.", "Porti tu il vino?"]
        en: ["Hi Tom! Tonight we're having dinner at my place.", "I'm cooking: pasta and chicken.", "Will you bring the wine?"]
        grammar: [g.present-are]
        vocab: [w.cenare, w.cucinare]
      - title: "Alla Fontana di Trevi"
        es: ["Davanti alla fontana i turisti parlano tante lingue.", "Tutti lanciano una moneta nell'acqua.", "Perché? Così tornano a Roma!"]
        en: ["In front of the fountain the tourists speak lots of languages.", "Everyone throws a coin into the water.", "Why? So they come back to Rome!"]
        grammar: [g.present-are]
        vocab: [w.parlare, w.lanciare]
    spicy:
      - { es: "Parli italiano? No? Allora parliamo con gli occhi.", en: "Do you speak Italian? No? Then let's talk with our eyes.", grammar: [g.present-are], vocab: [w.parlare] }
      - { es: "Cucino io stasera; tu porti il vino.", en: "I'm cooking tonight; you bring the wine.", altEs: ["Stasera cucino io e tu porti il vino."], grammar: [g.present-are], vocab: [w.cucinare] }
      - { es: "Aspetto qui da un'ora... ma per te aspetto ancora.", en: "I've been waiting here for an hour... but for you I'll keep waiting.", grammar: [g.present-are], vocab: [w.aspettare] }
      - { es: "Studio italiano solo per parlare con te.", en: "I'm only studying Italian so I can talk to you.", grammar: [g.present-are], vocab: [w.studiare, w.parlare] }
      - { es: "Lancio una moneta nella fontana e chiedo una cena con te.", en: "I throw a coin into the fountain and wish for a dinner with you.", grammar: [g.present-are], vocab: [w.lanciare] }
  - id: a1.u05.l3
    title: Mi piace la pizza
    teach: [g.piacere-intro]
    vocab: [w.piacere, w.pizza, w.pasta, w.spaghetti, w.riso, w.carne, w.pesce, w.pollo, w.prosciutto, w.formaggio, w.mozzarella, w.insalata, w.verdura, w.frutta, w.gelato, w.dolce, w.torta, w.cioccolato, w.piccante, w.buono, w.caldo.adj, w.freddo.adj, w.fresco, w.alcol, w.birra, w.vino, w.aperitivo]
    tip: "Mi piace la pizza = pizza pleases me. The thing you like is the subject; who likes it is mi, ti, gli, le, ci, vi (or a me, a Giulia)."
    sentences:
      - { es: "Mi piace la pizza.", en: "I like pizza.", altEs: ["La pizza mi piace.", "A me piace la pizza."], grammar: [g.piacere-intro], vocab: [w.piacere, w.pizza], transform: { instruction: "Say you like it a lot", answer: "Mi piace molto la pizza.", alt: ["La pizza mi piace molto.", "Mi piace tanto la pizza."] } }
      - { es: "Ti piace il pesce?", en: "Do you like fish?", altEs: ["A te piace il pesce?", "Il pesce ti piace?"], grammar: [g.piacere-intro], vocab: [w.pesce], transform: { instruction: "Ask formally (Lei)", answer: "Le piace il pesce?", alt: ["A Lei piace il pesce?"] } }
      - { es: "Non mi piace il formaggio.", en: "I don't like cheese.", altEs: ["Il formaggio non mi piace.", "A me non piace il formaggio."], grammar: [g.piacere-intro, g.negation], vocab: [w.formaggio], error: { wrong: "Non piaccio il formaggio.", explain: "With piacere the thing you like is the subject: mi piace il formaggio (cheese pleases me).", grammar: g.piacere-intro } }
      - { es: "Mi piace mangiare la pasta al pomodoro.", en: "I like eating pasta with tomato sauce.", altEs: ["A me piace mangiare la pasta al pomodoro."], grammar: [g.piacere-intro], vocab: [w.pasta] }
      - { es: "A Giulia piace il gelato al cioccolato.", en: "Giulia likes chocolate ice cream.", altEs: ["Giulia ama il gelato al cioccolato."], grammar: [g.piacere-intro], vocab: [w.gelato, w.cioccolato] }
      - { es: "Le piace la carne, signora?", en: "Do you like meat, madam?", altEs: ["Signora, Le piace la carne?", "A Lei piace la carne, signora?"], grammar: [g.piacere-intro, g.tu-vs-lei], vocab: [w.carne] }
      - { es: "Gli piace il vino rosso.", en: "He likes red wine.", altEs: ["A lui piace il vino rosso."], grammar: [g.piacere-intro], vocab: [w.vino] }
      - { es: "A me piace la birra, a lei no.", en: "I like beer, she doesn't.", altEs: ["A me la birra piace, a lei no."], grammar: [g.piacere-intro], vocab: [w.birra] }
      - { es: "L'insalata è fresca e buona.", en: "The salad is fresh and good.", grammar: [g.adjective-agreement], vocab: [w.insalata, w.fresco, w.buono] }
      - { es: "Questo pollo è troppo piccante!", en: "This chicken is too spicy!", grammar: [g.adjective-agreement], vocab: [w.pollo, w.piccante] }
      - { es: "Ti piace il caffè caldo o freddo?", en: "Do you like your coffee hot or cold?", altEs: ["Il caffè ti piace caldo o freddo?"], grammar: [g.piacere-intro], vocab: [w.caldo.adj, w.freddo.adj] }
      - { es: "Non bevo alcol, ma mi piace l'aperitivo.", en: "I don't drink alcohol, but I like the aperitivo.", grammar: [g.piacere-intro], vocab: [w.alcol, w.aperitivo] }
      - { es: "Ci piace cucinare insieme.", en: "We like cooking together.", altEs: ["A noi piace cucinare insieme."], grammar: [g.piacere-intro], vocab: [w.piacere], transform: { instruction: "Change to 'they'", answer: "Gli piace cucinare insieme.", alt: ["A loro piace cucinare insieme."] } }
      - { es: "Vi piace il prosciutto con la mozzarella?", en: "Do you (all) like ham with mozzarella?", altEs: ["A voi piace il prosciutto con la mozzarella?"], grammar: [g.piacere-intro], vocab: [w.prosciutto, w.mozzarella] }
      - { es: "La torta della nonna è buonissima!", en: "Grandma's cake is delicious!", grammar: [g.articulated-prepositions], vocab: [w.torta, w.dolce] }
      - { es: "Il riso non mi piace molto, preferisco la verdura e la frutta.", en: "I don't like rice very much, I prefer vegetables and fruit.", altEs: ["Non mi piace molto il riso: preferisco la verdura e la frutta."], grammar: [g.piacere-intro], vocab: [w.riso, w.verdura, w.frutta] }
      - { es: "Gli spaghetti sono pronti!", en: "The spaghetti is ready!", altEn: ["The spaghetti's ready!"], grammar: [g.plural-nouns], vocab: [w.spaghetti], note: "spaghetti is plural in Italian: gli spaghetti sono buoni." }
    exchanges:
      - q: { es: "Ti piace la cucina romana?", en: "Do you like Roman cooking?" }
        a: { es: "Sì, mi piace molto!", en: "Yes, I like it a lot!" }
        alt: ["Sì, tantissimo!", "Non molto.", "Sì, moltissimo."]
        grammar: [g.piacere-intro]
        vocab: [w.piacere]
      - q: { es: "Le piace il vino, signore?", en: "Do you like wine, sir?" }
        a: { es: "Sì, mi piace il vino rosso.", en: "Yes, I like red wine." }
        alt: ["Sì, molto.", "No, non bevo alcol."]
        grammar: [g.piacere-intro, g.tu-vs-lei]
        vocab: [w.vino]
      - q: { es: "Che cosa ti piace mangiare?", en: "What do you like to eat?" }
        a: { es: "Mi piace la pizza, ma anche il pesce.", en: "I like pizza, but fish too." }
        alt: ["La pasta!", "Mi piace la carne.", "Tutto!"]
        grammar: [g.piacere-intro]
        vocab: [w.pizza, w.pesce]
      - q: { es: "A Marco piace il formaggio?", en: "Does Marco like cheese?" }
        a: { es: "No, a Marco non piace.", en: "No, Marco doesn't like it." }
        alt: ["Sì, gli piace molto.", "No, non gli piace."]
        grammar: [g.piacere-intro]
        vocab: [w.formaggio]
      - q: { es: "Com'è il gelato?", en: "What's the ice cream like?" }
        a: { es: "È buonissimo e molto fresco!", en: "It's delicious and really refreshing!" }
        alt: ["Buonissimo!", "È molto buono."]
        grammar: [g.adjective-agreement]
        vocab: [w.gelato, w.fresco]
    texts:
      - title: "Messaggio a Giulia"
        es: ["Giulia, stasera cucino io!", "Ti piace il pesce?", "Se non ti piace, faccio pollo e insalata."]
        en: ["Giulia, I'm cooking tonight!", "Do you like fish?", "If you don't like it, I'll make chicken and salad."]
        grammar: [g.piacere-intro]
        vocab: [w.pesce, w.pollo, w.insalata]
      - title: "In gelateria"
        es: ["Il gelato qui è buonissimo.", "A me piace il cioccolato; a Tom piace la fragola.", "E a te?"]
        en: ["The ice cream here is delicious.", "I like chocolate; Tom likes strawberry.", "And you?"]
        grammar: [g.piacere-intro]
        vocab: [w.gelato, w.cioccolato]
    spicy:
      - { es: "Mi piace la pizza, mi piace Roma... e tu? Tu mi piaci.", en: "I like pizza, I like Rome... and you? I like you.", grammar: [g.piacere-intro], vocab: [w.piacere], note: "mi piaci = I like you (you please me)." }
      - { es: "Ti piace il dolce? Allora ti piace anche il cuoco.", en: "Do you like dessert? Then you'll like the cook too.", grammar: [g.piacere-intro], vocab: [w.dolce] }
      - { es: "Non mi piace il vino... ma con te mi piace tutto.", en: "I don't like wine... but with you I like everything.", grammar: [g.piacere-intro, g.negation], vocab: [w.vino] }
      - { es: "Mi piace la pizza calda con la birra fredda. E a te piace l'aperitivo con me?", en: "I like hot pizza with cold beer. And do you like an aperitivo with me?", grammar: [g.piacere-intro], vocab: [w.aperitivo] }
      - { es: "Il cioccolato mi piace, ma tu sei più dolce.", en: "I like chocolate, but you're sweeter.", grammar: [g.piacere-intro], vocab: [w.cioccolato, w.dolce] }
  - id: a1.u05.l4
    title: Del pane e dell'acqua
    teach: [g.partitive-di]
    vocab: [w.pane, w.panino, w.uovo, w.pomodoro, w.patata, w.carciofo, w.mela, w.arancia, w.piatto, w.bottiglia, w.pranzo, w.cena, w.menù, w.ristorante, w.trattoria, w.pizzeria, w.buon-appetito, w.salute, w.senza, w.qualcosa, w.altro, w.ancora, w.gratis, w.bere]
    tip: "di + article means 'some': del pane, della frutta, dell'acqua, dei pomodori, delle mele. Un po' di is the easy everyday alternative."
    sentences:
      - { es: "Vorrei del pane, per favore.", en: "I'd like some bread, please.", altEs: ["Vorrei un po' di pane, per favore."], grammar: [g.partitive-di], vocab: [w.pane] }
      - { es: "Ci porta dell'acqua, per favore?", en: "Could you bring us some water, please?", altEs: ["Ci porta un po' d'acqua, per favore?", "Ci porta un po' di acqua, per favore?"], grammar: [g.partitive-di, g.tu-vs-lei], vocab: [w.acqua] }
      - { es: "Compro delle mele e delle arance al mercato.", en: "I buy some apples and some oranges at the market.", altEs: ["Al mercato compro delle mele e delle arance."], grammar: [g.partitive-di], vocab: [w.mela, w.arancia] }
      - { es: "Nel panino ci sono del prosciutto e del formaggio.", en: "In the sandwich there's some ham and some cheese.", altEs: ["Nel panino c'è del prosciutto con del formaggio."], grammar: [g.partitive-di, g.c-e-ci-sono], vocab: [w.panino] }
      - { es: "Abbiamo delle patate e dei pomodori.", en: "We have some potatoes and some tomatoes.", altEs: ["Abbiamo patate e pomodori."], grammar: [g.partitive-di], vocab: [w.patata, w.pomodoro], error: { wrong: "Abbiamo dei patate e dei pomodori.", explain: "Feminine plural takes delle (delle patate); masculine plural takes dei (dei pomodori).", grammar: g.partitive-di } }
      - { es: "Stasera andiamo in pizzeria o al ristorante?", en: "Tonight are we going to a pizzeria or a restaurant?", altEs: ["Andiamo in pizzeria o al ristorante stasera?"], grammar: [g.articulated-prepositions], vocab: [w.pizzeria, w.ristorante] }
      - { es: "Vuoi ancora qualcosa? — Sì, un altro bicchiere d'acqua.", en: "Do you want anything else? — Yes, another glass of water.", altEs: ["Vuoi qualcos'altro? — Sì, un altro bicchiere d'acqua."], grammar: [g.partitive-di, g.volere-vorrei], vocab: [w.ancora, w.qualcosa, w.altro] }
      - { es: "Il menù del pranzo ha un primo, un secondo e un dolce.", en: "The lunch menu has a first course, a main course and a dessert.", grammar: [g.articulated-prepositions], vocab: [w.menù, w.pranzo] }
      - { es: "Un piatto di carciofi alla romana, per favore.", en: "A plate of Roman-style artichokes, please.", altEs: ["Vorrei un piatto di carciofi alla romana."], grammar: [g.partitive-di], vocab: [w.piatto, w.carciofo] }
      - { es: "In questa trattoria il pane è gratis.", en: "In this trattoria the bread is free.", grammar: [g.questo], vocab: [w.trattoria, w.gratis] }
      - { es: "Buon appetito! — Grazie, anche a te!", en: "Enjoy your meal! — Thanks, you too!", altEs: ["Buon appetito! — Grazie, altrettanto!"], grammar: [g.greetings], vocab: [w.buon-appetito] }
      - { es: "Salute! A Roma e agli amici!", en: "Cheers! To Rome and to friends!", altEs: ["Alla salute! A Roma e agli amici!", "Cin cin! A Roma e agli amici!"], grammar: [g.articulated-prepositions], vocab: [w.salute] }
      - { es: "Una pizza senza mozzarella? Mamma mia!", en: "A pizza without mozzarella? Good heavens!", grammar: [g.partitive-di], vocab: [w.senza] }
      - { es: "Prendiamo una bottiglia di vino e delle olive.", en: "Let's get a bottle of wine and some olives.", altEs: ["Prendiamo una bottiglia di vino e un po' di olive."], grammar: [g.partitive-di], vocab: [w.bottiglia], transform: { instruction: "Use un po' di instead of delle", answer: "Prendiamo una bottiglia di vino e un po' di olive." } }
      - { es: "A cena mangio due uova e dell'insalata.", en: "For dinner I have two eggs and some salad.", altEs: ["Per cena mangio due uova e un po' d'insalata."], grammar: [g.partitive-di, g.plural-nouns], vocab: [w.uovo, w.cena], note: "uovo has an irregular plural: le uova." }
      - { es: "Non bevo vino a pranzo, bevo dell'acqua.", en: "I don't drink wine at lunch, I drink water.", altEs: ["A pranzo non bevo vino: bevo acqua."], grammar: [g.partitive-di, g.negation], vocab: [w.bere] }
    exchanges:
      - q: { es: "Desidera qualcos'altro?", en: "Would you like anything else?" }
        a: { es: "Sì, del pane e dell'acqua, per favore.", en: "Yes, some bread and some water, please." }
        alt: ["No, grazie, basta così.", "Sì, un altro bicchiere di vino."]
        grammar: [g.partitive-di, g.tu-vs-lei]
        vocab: [w.qualcosa, w.pane]
      - q: { es: "Che cosa c'è nel panino?", en: "What's in the sandwich?" }
        a: { es: "Del prosciutto e della mozzarella.", en: "Some ham and some mozzarella." }
        alt: ["Prosciutto e mozzarella.", "Del formaggio."]
        grammar: [g.partitive-di]
        vocab: [w.panino]
      - q: { es: "Che cosa compriamo per la cena?", en: "What shall we buy for dinner?" }
        a: { es: "Delle patate, dei pomodori e del pollo.", en: "Some potatoes, some tomatoes and some chicken." }
        alt: ["Un po' di pasta.", "Del pesce.", "Della frutta."]
        grammar: [g.partitive-di]
        vocab: [w.patata, w.pomodoro, w.cena]
      - q: { es: "Andiamo in pizzeria stasera?", en: "Shall we go to a pizzeria tonight?" }
        a: { es: "Sì, volentieri! Ho fame.", en: "Yes, gladly! I'm hungry." }
        alt: ["No, preferisco la trattoria.", "Sì, perfetto!"]
        grammar: [g.present-for-future]
        vocab: [w.pizzeria]
      - q: { es: "Buon appetito!", en: "Enjoy your meal!" }
        a: { es: "Grazie, anche a te!", en: "Thanks, you too!" }
        alt: ["Grazie, altrettanto!", "Grazie!"]
        grammar: [g.greetings]
        vocab: [w.buon-appetito]
    texts:
      - title: "Lavagna della trattoria"
        es: ["Oggi nel menù: spaghetti al pomodoro e carciofi alla romana.", "Il pane e l'acqua sono gratis.", "Buon appetito!"]
        en: ["On the menu today: spaghetti with tomato sauce and Roman-style artichokes.", "Bread and water are free.", "Enjoy your meal!"]
        grammar: [g.articulated-prepositions]
        vocab: [w.menù, w.carciofo, w.gratis]
      - title: "Lista della spesa"
        es: ["Del pane e del latte.", "Delle uova e dei pomodori.", "Della frutta: mele e arance."]
        en: ["Some bread and some milk.", "Some eggs and some tomatoes.", "Some fruit: apples and oranges."]
        grammar: [g.partitive-di]
        vocab: [w.pane, w.uovo, w.pomodoro, w.mela, w.arancia]
    spicy:
      - { es: "Vorrei del vino, della musica e un po' di te.", en: "I'd like some wine, some music and a little bit of you.", grammar: [g.partitive-di, g.volere-vorrei], vocab: [w.bere] }
      - { es: "Un altro bicchiere? Solo se rimani qui con me.", en: "Another glass? Only if you stay here with me.", grammar: [g.partitive-di], vocab: [w.altro] }
      - { es: "Ci sono delle olive, del pane... e un posto per te al mio tavolo.", en: "There are some olives, some bread... and a place for you at my table.", grammar: [g.partitive-di, g.c-e-ci-sono], vocab: [w.pane] }
      - { es: "Il dolce? No, grazie: ho già qualcosa di dolce davanti a me.", en: "Dessert? No, thanks: I already have something sweet in front of me.", grammar: [g.partitive-di], vocab: [w.qualcosa] }
      - { es: "Salute! A noi due... e a un'altra cena insieme.", en: "Cheers! To the two of us... and to another dinner together.", grammar: [g.partitive-di], vocab: [w.salute, w.cena, w.altro] }
dialogues:
  - id: a1.u05.d1
    title: Colazione vicino alla Fontana di Trevi
    context: Tom and Giulia stop at a café near the Trevi Fountain before throwing a coin into the water.
    lines:
      - { speaker: Barista, es: "Buongiorno! Che cosa prendete?", en: "Good morning! What will you have?" }
      - { speaker: Giulia, es: "Per me un cappuccino e un cornetto, per favore.", en: "A cappuccino and a croissant for me, please." }
      - { speaker: Tom, es: "Io vorrei un caffè... e un maritozzo. Che cos'è?", en: "I'd like a coffee... and a maritozzo. What is it?" }
      - { speaker: Barista, es: "È un dolce romano con la panna. È buonissimo!", en: "It's a Roman sweet bun with cream. It's delicious!" }
      - { speaker: Tom, es: "Perfetto, allora un maritozzo! Ti piace, Giulia?", en: "Perfect, a maritozzo then! Do you like it, Giulia?" }
      - { speaker: Giulia, es: "Sì, mi piace molto, ma la mattina mangio solo un cornetto.", en: "Yes, I like it a lot, but in the morning I only eat a croissant." }
      - { speaker: Barista, es: "Volete anche dell'acqua?", en: "Would you like some water too?" }
      - { speaker: Tom, es: "Sì, due bicchieri d'acqua naturale, grazie.", en: "Yes, two glasses of still water, thanks." }
      - { speaker: Giulia, es: "Il conto, per favore. Pago io!", en: "The bill, please. I'll pay!" }
      - { speaker: Tom, es: "No, no, pago io! Tu paghi la cena stasera.", en: "No, no, I'll pay! You pay for dinner tonight." }
      - { speaker: Giulia, es: "Va bene! E adesso andiamo alla fontana a lanciare una moneta.", en: "OK! And now let's go to the fountain and throw a coin." }
    questions:
      - { q: "Che cosa prende Giulia?", options: ["Un caffè e un maritozzo.", "Un cappuccino e un cornetto.", "Un tè e una torta."], answer: 1, explain: "«Per me un cappuccino e un cornetto»." }
      - { q: "Che cos'è un maritozzo?", options: ["Un caffè.", "Un dolce romano.", "Un panino con il prosciutto."], answer: 1, explain: "The barista says «È un dolce romano con la panna»." }
      - { q: "Che acqua prendono?", options: ["Frizzante.", "Naturale.", "Non prendono acqua."], answer: 1, explain: "«Due bicchieri d'acqua naturale»." }
      - { q: "Chi paga al bar?", options: ["Giulia.", "Tom.", "Il barista."], answer: 1, explain: "Tom insists «pago io!»; Giulia will pay for dinner." }
writing:
  - task: "You are at a bar near the Trevi Fountain. Write what you say to the barista: greet him, order a drink and something to eat, then ask for the bill."
    es: "Buongiorno! Cosa prende?"
    min: 10
    max: 30
    use: [w.volere, w.cappuccino, w.cornetto, w.conto, w.per-favore]
    grammar: [g.volere-vorrei]
    expect:
      - { pattern: "\\bvorrei\\b|\\bprendo\\b", hint: "Order politely: Vorrei … / Prendo …" }
      - { pattern: "per favore|per piacere", hint: "Be polite: per favore." }
    model: { es: "Buongiorno! Vorrei un cappuccino e un cornetto, per favore. E anche un bicchiere d'acqua. Grazie! Il conto, per favore.", en: "Good morning! I'd like a cappuccino and a croissant, please. And a glass of water too. Thank you! The bill, please." }
  - task: "Write to Giulia about food: say what you like and don't like to eat and drink."
    min: 15
    max: 40
    use: [w.piacere, w.pizza, w.pasta, w.pesce, w.vino]
    grammar: [g.piacere-intro]
    expect:
      - { pattern: "\\bmi piace\\b|\\bmi piacciono\\b", hint: "Say what you like: Mi piace la pizza." }
      - { pattern: "\\bnon mi piac", hint: "Say what you don't like: Non mi piace il pesce." }
    model: { es: "Mi piace molto la pizza, ma non mi piace il pesce. Mi piace la pasta con il pomodoro. Non mi piace il vino: preferisco l'acqua frizzante.", en: "I really like pizza, but I don't like fish. I like pasta with tomato. I don't like wine: I prefer sparkling water." }
  - task: "Describe a typical dinner out with a friend: where you eat, who orders what, what you talk about and who pays."
    min: 15
    max: 40
    use: [w.cenare, w.ordinare, w.mangiare, w.parlare, w.pagare]
    grammar: [g.present-are]
    expect:
      - { pattern: "\\b(cen|ordin|mang|parl|pag|cucin|ascolt)\\w*", hint: "Use -are verbs: ceno, ordino, paghiamo…" }
    model: { es: "La sera ceno con Giulia in trattoria. Io ordino la pasta e Giulia mangia il pollo con l'insalata. Parliamo molto. Alla fine pago io!", en: "In the evening I have dinner with Giulia at a trattoria. I order pasta and Giulia eats chicken with salad. We talk a lot. In the end I pay!" }
  - task: "You and a friend are planning a picnic. Write a message saying what you are buying and what your friend should bring: some bread, some cheese, some fruit…"
    min: 15
    max: 40
    use: [w.pane, w.formaggio, w.frutta, w.acqua, w.prosciutto]
    grammar: [g.partitive-di]
    expect:
      - { pattern: "\\b(del|dello|della|dei|degli|delle)\\b|\\bdell['’]", hint: "Say 'some': del pane, della frutta, dell'acqua." }
    model: { es: "Ciao, Marco! Per il pranzo al parco compro del pane e del formaggio. Prendo anche del prosciutto. Tu porti della frutta e dell'acqua? A dopo!", en: "Hi, Marco! For lunch in the park I'll buy some bread and some cheese. I'll get some ham too. Can you bring some fruit and some water? See you later!" }
