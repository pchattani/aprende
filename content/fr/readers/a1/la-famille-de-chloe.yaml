id: r.a1.la-famille-de-chloe
level: a1
title: La famille de Chloé
kind: text
intro: Chloé lives in Montmartre and describes her family, from her grandmother to the cat, as a painter on the Place du Tertre draws their portrait.
allow: [chloé, chloe, maxime, inès, jacqueline, pierre, rémi, caramel]
paragraphs:
  - { es: "Bonjour ! Je m'appelle Chloé et j'ai seize ans. J'habite à Paris, à Montmartre, avec ma famille. Notre appartement est petit, mais il est près du Sacré-Cœur et de la place du Tertre. Sur la place, il y a des peintres. Aujourd'hui, un peintre fait un portrait de ma famille !", en: "Hello! My name is Chloé and I'm sixteen. I live in Paris, in Montmartre, with my family. Our flat is small, but it's near the Sacré-Cœur and the Place du Tertre. On the square there are painters. Today a painter is doing a portrait of my family!" }
  - { es: "Voici mon père. Il s'appelle Pierre et il a quarante-huit ans. Il est professeur d'anglais dans une école. Il est grand et un peu sérieux, mais il est très drôle avec nous.", en: "Here's my father. His name is Pierre and he's forty-eight. He's an English teacher at a school. He's tall and a bit serious, but he's very funny with us." }
  - { es: "Ma mère s'appelle Inès. Elle a quarante-cinq ans et elle est médecin à l'hôpital. Elle travaille beaucoup, mais le dimanche, elle est avec nous. Elle adore la musique et le cinéma.", en: "My mother's name is Inès. She's forty-five and she's a doctor at the hospital. She works a lot, but on Sundays she's with us. She loves music and the cinema." }
  - { es: "J'ai un frère et une sœur. Mon frère, Maxime, a vingt ans. Il est étudiant à l'université et il n'habite pas avec nous. Ma sœur, Camille, a dix ans. Elle est petite et très mignonne, mais elle parle beaucoup !", en: "I have a brother and a sister. My brother, Maxime, is twenty. He's a university student and doesn't live with us. My sister, Camille, is ten. She's small and very cute, but she talks a lot!" }
  - { es: "Ma grand-mère, Jacqueline, habite aussi avec nous. Elle a soixante-neuf ans. Elle est très gentille et elle fait des gâteaux délicieux. Mon grand-père s'appelle Rémi. Il n'est pas sur le portrait : il est à la campagne, avec mon oncle et ma tante.", en: "My grandmother, Jacqueline, also lives with us. She's sixty-nine. She's very kind and she makes delicious cakes. My grandfather's name is Rémi. He isn't in the portrait: he's in the countryside, with my uncle and aunt." }
  - { es: "Et voici les animaux ! Nous avons un chat, Caramel, et un poisson rouge. Le chat a trois ans. Il est roux et un peu gros. Il adore le lit de ma grand-mère.", en: "And here are the animals! We have a cat, Caramel, and a goldfish. The cat is three. He's ginger and a bit fat. He loves my grandmother's bed." }
  - { es: "Le portrait est fini. C'est combien ? Cinquante euros. Mon père paie et nous regardons le tableau. Ma sœur est contente, ma mère aussi. Et moi ? J'adore le portrait, mais pourquoi le chat est-il si gros ?", en: "The portrait is finished. How much is it? Fifty euros. My father pays and we look at the picture. My sister is happy, and so is my mother. And me? I love the portrait, but why is the cat so fat?" }
questions:
  - { q: "Quel âge a Chloé ?", options: ["Dix ans", "Seize ans", "Vingt ans"], answer: 1, explain: "«J'ai seize ans.» Camille is ten and Maxime twenty." }
  - { q: "Quel est le travail de la mère de Chloé ?", options: ["Elle est professeur", "Elle est médecin", "Elle est peintre"], answer: 1, explain: "«Elle est médecin à l'hôpital.» Her father is the teacher." }
  - { q: "Qui n'habite pas avec Chloé ?", options: ["Sa grand-mère", "Sa sœur", "Son frère"], answer: 2, explain: "Maxime is at university and «il n'habite pas avec nous». The grandmother lives with them." }
  - { q: "Où est le grand-père ?", options: ["À la campagne", "À l'hôpital", "Sur la place du Tertre"], answer: 0, explain: "«Il est à la campagne, avec mon oncle et ma tante.»" }
  - { q: "Comment est le chat ?", options: ["Noir et petit", "Roux et un peu gros", "Blanc et mince"], answer: 1, explain: "«Il est roux et un peu gros.» No wonder he looks fat in the portrait!" }
