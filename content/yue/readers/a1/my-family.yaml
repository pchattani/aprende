id: r.a1.my-family
level: a1
title: 我屋企人
kind: text
intro: Kelvin, a bank clerk from North Point, introduces the six people in his family, from his taxi-driver father to his grandfather who loves the Wednesday races at Happy Valley.
allow: [lucky]
paragraphs:
  - { es: "你好！我叫Kelvin，姓黃，今年三十歲。我屋企有六個人：爺爺、嫲嫲、爸爸、媽媽、家姐同我。我哋喺北角住。我屋企仲有一隻狗，叫Lucky。", en: "Hi! My name is Kelvin, my surname is Wong, and I'm thirty this year. There are six people in my family: my grandpa, my grandma, my dad, my mum, my older sister and me. We live in North Point. We also have a dog called Lucky." }
  - { es: "我爸爸今年六十歲，係的士司機。佢好高，好瘦，好叻。佢朝早五點起身，六點返工，夜晚七點放工。佢好忙，但係星期日唔使返工。", en: "My dad is sixty this year and he's a taxi driver. He's tall, thin and very capable. He gets up at five in the morning, starts work at six and finishes at seven in the evening. He's very busy, but he doesn't work on Sundays." }
  - { es: "我媽媽五十八歲，係護士，喺醫院做嘢。佢好鍾意煮飯，佢煮嘅叉燒好好食！我媽媽係好人，好鍾意笑，但係我夜晚好遲先返屋企嗰陣，佢好惡。", en: "My mum is fifty-eight. She's a nurse and works in a hospital. She loves cooking, and the char siu she makes is delicious! My mum is a lovely person and laughs a lot, but when I come home very late at night she gets very fierce." }
  - { es: "我家姐叫Karen，今年三十三歲。佢已經結婚，老公係警察。佢哋有一個仔同一個女：個仔四歲，個女兩歲，兩個都好可愛。佢哋喺跑馬地住，星期六成日嚟我哋屋企食飯。", en: "My older sister is called Karen and she's thirty-three this year. She's married and her husband is a police officer. They have a son and a daughter: the boy is four and the girl is two, and both of them are very cute. They live in Happy Valley and often come to our home for dinner on Saturdays." }
  - { es: "我爺爺八十五歲，嫲嫲八十二歲。爺爺好鍾意跑馬。每個星期三夜晚，佢同我爸爸去跑馬地馬場睇跑馬。嫲嫲唔鍾意跑馬，佢鍾意喺屋企睇電視，或者帶Lucky去公園散步。", en: "My grandpa is eighty-five and my grandma is eighty-two. Grandpa loves horse racing. Every Wednesday evening he goes with my dad to the Happy Valley racecourse to watch the races. Grandma doesn't like horse racing; she likes watching TV at home or taking Lucky for a walk in the park." }
  - { es: "我呢？我喺中環一間銀行做嘢。我未結婚，都冇女朋友。我媽媽成日問：「你幾時有女朋友呀？」我話：「唔知呀！」星期日我哋一家人一齊去飲茶，我好鍾意我屋企人。", en: "And me? I work at a bank in Central. I'm not married and I don't have a girlfriend either. My mum always asks: \"When are you going to get a girlfriend?\" I say: \"No idea!\" On Sundays the whole family goes for yum cha together. I love my family." }
questions:
  - { q: "Kelvin爸爸做咩工作？", options: ["的士司機", "警察", "護士"], answer: 0, explain: "我爸爸…係的士司機. The police officer is Karen's husband and the nurse is Kelvin's mother." }
  - { q: "Kelvin屋企有幾多個人？", options: ["四個", "五個", "六個"], answer: 2, explain: "我屋企有六個人: grandpa, grandma, dad, mum, sister and Kelvin." }
  - { q: "Karen有幾多個仔女？", options: ["一個", "兩個", "冇"], answer: 1, explain: "佢哋有一個仔同一個女: a son and a daughter." }
  - { q: "爺爺星期三夜晚做乜嘢？", options: ["喺屋企睇電視", "去馬場睇跑馬", "去飲茶"], answer: 1, explain: "Every Wednesday evening he goes to the Happy Valley racecourse. Watching TV is what grandma likes." }
  - { q: "Kelvin有冇女朋友？", options: ["有", "冇", "佢已經結婚"], answer: 1, explain: "我未結婚，都冇女朋友." }
