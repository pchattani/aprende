id: b1.u05
title: Cuando tenga tiempo
lessons:
  - id: b1.u05.l1
    title: Cuando tenga tiempo
    teach: [g.subjunctive-time-clauses]
    vocab: [w.en-cuanto, w.tan-pronto-como, w.hasta-que, w.una-vez-que, w.siempre-que, w.cada-vez-que, w.planear, w.aterrizar, w.despegar, w.trasladarse, w.ahorro, w.decision, w.tomar-una-decision, w.de-momento, w.fecha-limite, w.embarazo, w.a-partir-de, w.proximamente, w.avisar]
    tip: "Future or not-yet-happened → cuando + subjunctive (cuando llegue). Habit or past → indicative (cuando llego / cuando llegué)."
    sentences:
      - { es: "Cuando tenga tiempo, te ayudaré con el jardín.", en: "When I have time, I'll help you with the garden.", altEs: ["Cuando tenga tiempo, te ayudo con el jardín.", "En cuanto tenga tiempo, te ayudaré con el jardín."], grammar: [g.subjunctive-time-clauses, g.future-simple], vocab: [w.tener, w.ayudar, w.jardin] }
      - { es: "Te llamo en cuanto aterrice el avión.", en: "I'll call you as soon as the plane lands.", altEs: ["Te llamaré en cuanto aterrice el avión.", "Te llamo tan pronto como aterrice el avión."], grammar: [g.subjunctive-time-clauses], vocab: [w.en-cuanto, w.aterrizar, w.avion] }
      - { es: "Tan pronto como aterricemos, encenderé el móvil y te escribiré.", en: "As soon as we land, I'll switch on my phone and write to you.", grammar: [g.subjunctive-time-clauses, g.future-simple], vocab: [w.tan-pronto-como, w.encender, w.escribir] }
      - { es: "El avión no despegará hasta que todos estén sentados.", en: "The plane won't take off until everyone is seated.", altEs: ["El avión no despega hasta que todos estén sentados.", "El avión no despegará hasta que estén todos sentados."], grammar: [g.subjunctive-time-clauses], vocab: [w.despegar, w.hasta-que, w.sentarse] }
      - { es: "Cuando me traslade a Valencia, buscaré un piso cerca de la playa.", en: "When I move to Valencia, I'll look for a flat near the beach.", altEs: ["Cuando me mude a Valencia, buscaré un piso cerca de la playa."], grammar: [g.subjunctive-time-clauses], vocab: [w.trasladarse, w.piso, w.playa] }
      - { es: "Una vez que tengamos más ahorros, compraremos la casa.", en: "Once we have more savings, we'll buy the house.", grammar: [g.subjunctive-time-clauses], vocab: [w.una-vez-que, w.ahorro, w.comprar] }
      - { es: "Tomaremos una decisión cuando sepamos el precio final.", en: "We'll make a decision when we know the final price.", altEs: ["Decidiremos cuando sepamos el precio final.", "Tomaremos una decisión en cuanto sepamos el precio final."], grammar: [g.subjunctive-time-clauses], vocab: [w.tomar-una-decision, w.decision, w.saber, w.precio] }
      - { es: "De momento no planeamos nada; cuando termine el curso, veremos.", en: "For now we're not planning anything; when the course ends, we'll see.", grammar: [g.subjunctive-time-clauses], vocab: [w.de-momento, w.planear, w.terminar] }
      - { es: "Siempre que vengas a Madrid, tendrás una cama en mi casa.", en: "Whenever you come to Madrid, you'll have a bed in my house.", altEs: ["Cada vez que vengas a Madrid, tendrás una cama en mi casa.", "Siempre que vengas a Madrid, tienes una cama en mi casa."], grammar: [g.subjunctive-time-clauses], vocab: [w.siempre-que, w.venir, w.cama] }
      - { es: "Cada vez que voy al pueblo, visito a mi abuela.", en: "Every time I go to the village, I visit my grandmother.", altEs: ["Siempre que voy al pueblo, visito a mi abuela."], grammar: [g.subjunctive-time-clauses], vocab: [w.cada-vez-que, w.pueblo, w.visitar], note: "Habit → indicative. Compare: Cada vez que vaya, la visitaré." }
      - { es: "Cuando llegué a casa ayer, llamé a mi madre.", en: "When I got home yesterday, I called my mother.", grammar: [g.subjunctive-time-clauses, g.preterite-regular], vocab: [w.llegar, w.llamar], note: "Past fact → indicative." }
      - { es: "A partir de septiembre, cuando nazca el bebé, trabajaré desde casa.", en: "From September, when the baby is born, I'll work from home.", grammar: [g.subjunctive-time-clauses], vocab: [w.a-partir-de, w.nacer, w.bebe] }
      - { es: "El embarazo va bien; cuando sepamos si es niño o niña, os lo diremos.", en: "The pregnancy is going well; when we know whether it's a boy or a girl, we'll tell you.", grammar: [g.subjunctive-time-clauses], vocab: [w.embarazo, w.saber, w.nino] }
      - { es: "La fecha límite es el viernes: en cuanto acabéis, enviadme el trabajo.", en: "The deadline is Friday: as soon as you finish, send me the work.", grammar: [g.subjunctive-time-clauses, g.imperative-tu], vocab: [w.fecha-limite, w.terminar.phr, w.enviar] }
      - { es: "Próximamente abrirán un gimnasio en el barrio; cuando abra, iré todos los días.", en: "They'll soon be opening a gym in the neighbourhood; when it opens, I'll go every day.", grammar: [g.subjunctive-time-clauses], vocab: [w.proximamente, w.abrir, w.gimnasio], error: { wrong: "Cuando abrirá el gimnasio, iré todos los días.", explain: "Never the future after cuando: use the present subjunctive, cuando abra.", grammar: g.subjunctive-time-clauses } }
      - { es: "Termino el trabajo y salgo.", en: "I finish the work and I go out.", grammar: [g.subjunctive-time-clauses], vocab: [w.terminar, w.salir], transform: { instruction: "Join with 'en cuanto' (future)", answer: "En cuanto termine el trabajo, saldré.", alt: ["Saldré en cuanto termine el trabajo.", "En cuanto termine el trabajo, salgo."] } }
    exchanges:
      - q: { es: "¿Cuándo me llamas?", en: "When will you call me?" }
        a: { es: "Te llamo en cuanto aterrice el avión.", en: "I'll call you as soon as the plane lands." }
        alt: ["Cuando llegue al hotel.", "Tan pronto como pueda."]
        grammar: [g.subjunctive-time-clauses]
        vocab: [w.en-cuanto, w.aterrizar]
      - q: { es: "¿Cuándo vais a comprar la casa?", en: "When are you going to buy the house?" }
        a: { es: "Cuando tengamos más ahorros; de momento seguimos de alquiler.", en: "When we have more savings; for now we're still renting." }
        alt: ["Una vez que sepamos el precio final.", "No lo sé; tomaremos una decisión después del verano."]
        grammar: [g.subjunctive-time-clauses]
        vocab: [w.ahorro, w.de-momento, w.una-vez-que]
      - q: { es: "¿Qué harás cuando termine el curso?", en: "What will you do when the course ends?" }
        a: { es: "Cuando termine el curso, me trasladaré a Valencia.", en: "When the course ends, I'll move to Valencia." }
        alt: ["Buscaré trabajo en cuanto acabe.", "De momento no planeo nada."]
        grammar: [g.subjunctive-time-clauses]
        vocab: [w.trasladarse, w.planear]
      - q: { es: "¿Me avisas cuando llegue el paquete?", en: "Will you let me know when the parcel arrives?" }
        a: { es: "Claro, te aviso tan pronto como llegue.", en: "Of course, I'll let you know as soon as it arrives." }
        alt: ["Sí, en cuanto lo reciba te escribo.", "Vale, te llamo cuando esté aquí."]
        grammar: [g.subjunctive-time-clauses]
        vocab: [w.avisar, w.tan-pronto-como]
      - q: { es: "¿Hasta cuándo te quedas en Madrid?", en: "How long are you staying in Madrid?" }
        a: { es: "Hasta que encuentre un piso en Valencia.", en: "Until I find a flat in Valencia." }
        alt: ["Hasta que empiece el nuevo trabajo.", "Me quedo hasta septiembre, cuando nazca el bebé."]
        grammar: [g.subjunctive-time-clauses]
        vocab: [w.hasta-que]
    texts:
      - title: "Mensaje antes del vuelo"
        es: ["Ya estamos en el avión.", "Te escribo en cuanto aterricemos.", "Cuando llegues al aeropuerto, espéranos en la salida."]
        en: ["We're on the plane now.", "I'll write to you as soon as we land.", "When you get to the airport, wait for us at the exit."]
        grammar: [g.subjunctive-time-clauses]
        vocab: [w.aterrizar, w.en-cuanto]
      - title: "Correo de trabajo"
        es: ["La fecha límite del proyecto es el viernes.", "En cuanto terminéis vuestra parte, enviadme el documento.", "Tomaremos una decisión sobre el presupuesto una vez que tengamos todos los datos."]
        en: ["The project deadline is Friday.", "As soon as you finish your part, send me the document.", "We'll make a decision about the budget once we have all the data."]
        grammar: [g.subjunctive-time-clauses]
        vocab: [w.fecha-limite, w.tomar-una-decision, w.una-vez-que]
  - id: b1.u05.l2
    title: Antes de que sea tarde
    teach: [g.subjunctive-time-clauses]
    vocab: [w.antes-de-que, w.despues-de-que, w.grifo, w.plantar, w.cosecha, w.huerto, w.reciclaje, w.bolsa, w.ecologico, w.sostenible, w.consumo, w.residuos, w.renovable, w.contaminar, w.cambio, w.climatico, w.proteger, w.especie, w.campaña, w.asociacion, w.electricidad, w.gas, w.desperdiciar, w.plastico, w.consumir]
    tip: "antes de que always takes the subjunctive; hasta que, después de que and mientras take it only when the action is still to come."
    sentences:
      - { es: "Tenemos que hacer algo antes de que sea demasiado tarde para el planeta.", en: "We have to do something before it's too late for the planet.", altEs: ["Hay que hacer algo antes de que sea demasiado tarde para el planeta.", "Debemos hacer algo antes de que sea demasiado tarde para el planeta."], grammar: [g.subjunctive-time-clauses], vocab: [w.antes-de-que, w.planeta, w.demasiado], error: { wrong: "Tenemos que hacer algo antes de que es demasiado tarde.", explain: "antes de que always takes the subjunctive: antes de que sea.", grammar: g.subjunctive-time-clauses } }
      - { es: "Cierra el grifo mientras te lavas los dientes.", en: "Turn off the tap while you brush your teeth.", altEs: ["Cierra el grifo cuando te laves los dientes."], grammar: [g.subjunctive-time-clauses, g.imperative-tu], vocab: [w.grifo, w.cerrar, w.lavarse, w.dientes], note: "Habit → indicative after mientras." }
      - { es: "No habrá cosecha hasta que llueva.", en: "There won't be a harvest until it rains.", altEs: ["No va a haber cosecha hasta que llueva.", "No habrá cosecha hasta que no llueva."], grammar: [g.subjunctive-time-clauses], vocab: [w.cosecha, w.llover, w.hasta-que] }
      - { es: "Plantaremos los tomates en el huerto después de que pase el frío.", en: "We'll plant the tomatoes in the vegetable garden after the cold is over.", grammar: [g.subjunctive-time-clauses], vocab: [w.plantar, w.huerto, w.tomate, w.despues-de-que] }
      - { es: "Después de que el ayuntamiento puso contenedores nuevos, el reciclaje aumentó un veinte por ciento.", en: "After the council put in new bins, recycling went up twenty per cent.", grammar: [g.subjunctive-time-clauses, g.preterite-irregular], vocab: [w.reciclaje, w.ayuntamiento, w.aumentar, w.por-ciento], note: "Past fact after después de que → indicative." }
      - { es: "Lleva tu propia bolsa cuando vayas al supermercado; así gastas menos plástico.", en: "Take your own bag when you go to the supermarket; that way you use less plastic.", altEs: ["Lleva tu propia bolsa cuando vayas al supermercado; así usas menos plástico."], grammar: [g.subjunctive-time-clauses, g.imperative-tu], vocab: [w.bolsa, w.supermercado, w.gastar] }
      - { es: "Los productos ecológicos son más caros, pero no contaminan tanto.", en: "Organic products are more expensive, but they don't pollute as much.", grammar: [g.comparatives], vocab: [w.ecologico, w.contaminar, w.caro] }
      - { es: "Mientras sigamos consumiendo tanta electricidad, el problema no se resolverá.", en: "As long as we keep consuming so much electricity, the problem won't be solved.", grammar: [g.subjunctive-time-clauses], vocab: [w.electricidad, w.consumo, w.resolver] }
      - { es: "El ayuntamiento quiere reducir el consumo de gas antes de que llegue el invierno.", en: "The council wants to reduce gas consumption before winter arrives.", altEs: ["El ayuntamiento quiere reducir el consumo de gas antes del invierno.", "El ayuntamiento quiere bajar el consumo de gas antes de que llegue el invierno."], grammar: [g.subjunctive-time-clauses], vocab: [w.gas, w.consumo, w.invierno] }
      - { es: "La asociación de vecinos ha empezado una campaña para proteger el río.", en: "The residents' association has started a campaign to protect the river.", grammar: [g.present-perfect], vocab: [w.asociacion, w.campaña, w.proteger, w.rio] }
      - { es: "Muchas especies desaparecerán antes de que frenemos el cambio climático.", en: "Many species will disappear before we slow down climate change.", grammar: [g.subjunctive-time-clauses], vocab: [w.especie, w.cambio, w.climatico, w.frenar] }
      - { es: "No tires los residuos al mar; cada vez que lo haces, contaminas el agua de todos.", en: "Don't throw waste into the sea; every time you do it, you pollute everyone's water.", grammar: [g.subjunctive-time-clauses, g.imperative-negative], vocab: [w.residuos, w.tirar, w.mar, w.contaminar] }
      - { es: "La electricidad renovable será más barata cuando la pidan más clientes.", en: "Renewable electricity will be cheaper when more customers ask for it.", grammar: [g.subjunctive-time-clauses], vocab: [w.renovable, w.electricidad, w.cliente] }
      - { es: "No desperdiciéis comida: comprad solo lo que vayáis a comer.", en: "Don't waste food: buy only what you're going to eat.", altEs: ["No desperdiciéis comida: comprad solo lo que vais a comer."], grammar: [g.imperative-negative], vocab: [w.desperdiciar, w.comida, w.comprar] }
      - { es: "Una ciudad sostenible necesita más árboles y menos coches.", en: "A sustainable city needs more trees and fewer cars.", altEs: ["Una ciudad sostenible necesita más árboles y menos tráfico."], grammar: [g.comparatives], vocab: [w.sostenible, w.arbol, w.coche] }
      - { es: "Primero llega el verano; luego vamos a la playa.", en: "First summer arrives; then we go to the beach.", grammar: [g.subjunctive-time-clauses], vocab: [w.verano, w.playa], transform: { instruction: "Join with 'después de que' (future)", answer: "Después de que llegue el verano, iremos a la playa.", alt: ["Iremos a la playa después de que llegue el verano."] } }
    exchanges:
      - q: { es: "¿Cuándo plantamos los tomates?", en: "When do we plant the tomatoes?" }
        a: { es: "Después de que pase el frío; en abril, más o menos.", en: "After the cold is over; around April." }
        alt: ["Cuando haga más calor.", "Antes de que llegue el verano."]
        grammar: [g.subjunctive-time-clauses]
        vocab: [w.plantar, w.despues-de-que]
      - q: { es: "¿Llevas bolsa al supermercado?", en: "Do you take a bag to the supermarket?" }
        a: { es: "Sí, siempre llevo mi propia bolsa para gastar menos plástico.", en: "Yes, I always take my own bag to use less plastic." }
        alt: ["Casi siempre; a veces se me olvida.", "No, compro una bolsa de papel cada vez."]
        grammar: [g.subjunctive-time-clauses]
        vocab: [w.bolsa, w.plastico]
      - q: { es: "¿Qué hace la asociación de vecinos?", en: "What does the residents' association do?" }
        a: { es: "Ha empezado una campaña para proteger el río antes de que sea demasiado tarde.", en: "It has started a campaign to protect the river before it's too late." }
        alt: ["Organiza el reciclaje del barrio.", "Quiere reducir el consumo de gas de la comunidad."]
        grammar: [g.subjunctive-time-clauses]
        vocab: [w.asociacion, w.campaña, w.proteger, w.antes-de-que]
      - q: { es: "¿Hasta cuándo va a durar la sequía?", en: "How long is the drought going to last?" }
        a: { es: "No habrá agua en el huerto hasta que llueva de verdad.", en: "There won't be water in the vegetable garden until it really rains." }
        alt: ["Hasta que llueva; nadie lo sabe.", "Mientras no llueva, no habrá cosecha."]
        grammar: [g.subjunctive-time-clauses]
        vocab: [w.huerto, w.cosecha]
      - q: { es: "¿Por qué cierras el grifo mientras te lavas los dientes?", en: "Why do you turn off the tap while you brush your teeth?" }
        a: { es: "Para no desperdiciar agua; cada vez que lo dejas abierto, pierdes mucha agua.", en: "So as not to waste water; every time you leave it on, you lose a lot of water." }
        alt: ["Porque es una costumbre sostenible.", "Porque el agua es de todos."]
        grammar: [g.subjunctive-time-clauses]
        vocab: [w.grifo, w.desperdiciar, w.sostenible]
    texts:
      - title: "Cartel de la campaña"
        es: ["Protege el río antes de que sea demasiado tarde.", "No tires residuos al agua y recicla el plástico.", "Después de que pase la fiesta, deja la playa limpia."]
        en: ["Protect the river before it's too late.", "Don't throw waste into the water and recycle plastic.", "After the party is over, leave the beach clean."]
        grammar: [g.subjunctive-time-clauses, g.imperative-tu]
        vocab: [w.proteger, w.residuos, w.antes-de-que]
      - title: "Nota de la comunidad"
        es: ["Vecinos: a partir de mayo habrá contenedores nuevos.", "Tirad el vidrio al contenedor verde y el papel, al azul.", "Hasta que lleguen los contenedores, usad los de la calle de al lado."]
        en: ["Residents: from May there will be new recycling bins.", "Put glass in the green bin and paper in the blue one.", "Until the bins arrive, use the ones in the next street."]
        grammar: [g.subjunctive-time-clauses, g.imperative-vosotros]
        vocab: [w.reciclaje]
  - id: b1.u05.l3
    title: Para que lo entiendas
    teach: [g.subjunctive-purpose]
    vocab: [w.para-que, w.a-fin-de-que, w.sin-que, w.con-el-fin-de, w.socio, w.pagina, w.web, w.fracasar, w.fracaso, w.perdida, w.tramite, w.servicio, w.rentable, w.emprendedor, w.inversion, w.financiar, w.beneficio, w.deuda, w.documento, w.social, w.documentacion, w.presupuesto, w.requisito, w.gasto, w.red]
    tip: "para + infinitive when the subject is the same (trabajo para vivir); para que + subjunctive when it changes (trabajo para que mis hijos vivan bien)."
    sentences:
      - { es: "Trabajo mucho para que mis hijos puedan estudiar en la universidad.", en: "I work a lot so that my children can study at university.", altEs: ["Trabajo mucho a fin de que mis hijos puedan estudiar en la universidad.", "Trabajo mucho para que mis hijos estudien en la universidad."], grammar: [g.subjunctive-purpose], vocab: [w.trabajar, w.hijo, w.universidad] }
      - { es: "Ahorro para montar mi propio negocio.", en: "I'm saving to set up my own business.", altEs: ["Ahorro para abrir mi propio negocio.", "Estoy ahorrando para montar mi propio negocio."], grammar: [g.subjunctive-purpose], vocab: [w.ahorrar, w.montar, w.propio], note: "Same subject → para + infinitive." }
      - { es: "Te explico el plan para que lo entiendas bien.", en: "I'll explain the plan to you so that you understand it well.", altEs: ["Te explico el plan para que lo entiendas."], grammar: [g.subjunctive-purpose], vocab: [w.para-que, w.explicar, w.plan, w.entender], error: { wrong: "Te explico el plan para que lo entiendes bien.", explain: "para que + subjunctive: para que lo entiendas.", grammar: g.subjunctive-purpose } }
      - { es: "Buscamos un socio con dinero para que el proyecto no fracase.", en: "We're looking for a partner with money so that the project doesn't fail.", altEs: ["Buscamos un socio con dinero a fin de que el proyecto no fracase."], grammar: [g.subjunctive-purpose], vocab: [w.socio, w.fracasar, w.proyecto] }
      - { es: "Hemos hecho una página web para que los clientes compren desde casa.", en: "We've made a website so that customers can buy from home.", grammar: [g.subjunctive-purpose], vocab: [w.pagina, w.web, w.cliente] }
      - { es: "La emprendedora pidió un préstamo con el fin de abrir una segunda tienda.", en: "The entrepreneur asked for a loan with the aim of opening a second shop.", grammar: [g.subjunctive-purpose], vocab: [w.emprendedor, w.prestamo, w.con-el-fin-de, w.tienda] }
      - { es: "No firméis ningún documento sin que un abogado lo lea antes.", en: "Don't sign any document without a lawyer reading it first.", altEs: ["No firméis ningún documento sin que antes lo lea un abogado."], grammar: [g.subjunctive-purpose, g.imperative-negative], vocab: [w.documento, w.abogado, w.sin-que, w.leer] }
      - { es: "El banco financia el proyecto a fin de que la empresa dé trabajo a cien personas.", en: "The bank is financing the project so that the company gives work to a hundred people.", grammar: [g.subjunctive-purpose], vocab: [w.financiar, w.a-fin-de-que, w.empresa, w.dar] }
      - { es: "Vendieron el coche para pagar las deudas.", en: "They sold the car to pay off their debts.", altEs: ["Vendieron el coche para pagar sus deudas."], grammar: [g.subjunctive-purpose, g.preterite-regular], vocab: [w.deuda, w.vender, w.pagar], note: "Same subject → para + infinitive." }
      - { es: "El primer año tuvimos pérdidas; el segundo, por fin, beneficios.", en: "The first year we had losses; the second, at last, profits.", grammar: [g.preterite-irregular], vocab: [w.perdida, w.beneficio, w.por-fin] }
      - { es: "Lleva toda la documentación para que el trámite sea rápido.", en: "Take all the paperwork so that the procedure is quick.", altEs: ["Lleva todos los documentos para que el trámite sea rápido."], grammar: [g.subjunctive-purpose, g.imperative-tu], vocab: [w.documentacion, w.tramite, w.rapido] }
      - { es: "Ofrecemos un servicio de entrega en casa para que nadie tenga que salir.", en: "We offer a home delivery service so that nobody has to go out.", grammar: [g.subjunctive-purpose], vocab: [w.servicio, w.ofrecer, w.tener-que] }
      - { es: "Estamos en las redes sociales para que la gente conozca nuestra marca.", en: "We're on social media so that people get to know our brand.", grammar: [g.subjunctive-purpose], vocab: [w.red-social, w.social, w.gente, w.marca] }
      - { es: "La inversión fue grande, pero el negocio ya es rentable.", en: "The investment was big, but the business is already profitable.", grammar: [g.preterite-ser-ir], vocab: [w.inversion, w.rentable] }
      - { es: "El fracaso de la primera empresa le sirvió para aprender.", en: "The failure of his first company helped him learn.", grammar: [g.subjunctive-purpose, g.preterite-regular], vocab: [w.fracaso, w.servir, w.aprender], note: "servir para = to be useful for." }
      - { es: "Hablo despacio. Así todos me entienden.", en: "I speak slowly. That way everyone understands me.", grammar: [g.subjunctive-purpose], vocab: [w.hablar, w.despacio, w.entender], transform: { instruction: "Join with 'para que'", answer: "Hablo despacio para que todos me entiendan." } }
    exchanges:
      - q: { es: "¿Para qué ahorras tanto?", en: "What are you saving so much for?" }
        a: { es: "Ahorro para montar mi propio negocio.", en: "I'm saving to set up my own business." }
        alt: ["Para que mis hijos puedan estudiar.", "Para pagar las deudas cuanto antes."]
        grammar: [g.subjunctive-purpose]
        vocab: [w.deuda]
      - q: { es: "¿Por qué habéis hecho una página web?", en: "Why have you made a website?" }
        a: { es: "Para que los clientes compren desde casa.", en: "So that customers can buy from home." }
        alt: ["Para que la gente conozca nuestra marca.", "Con el fin de vender fuera de la ciudad."]
        grammar: [g.subjunctive-purpose]
        vocab: [w.pagina, w.web, w.para-que, w.con-el-fin-de]
      - q: { es: "¿Firmo el contrato ya?", en: "Shall I sign the contract now?" }
        a: { es: "No firmes nada sin que un abogado lo lea antes.", en: "Don't sign anything without a lawyer reading it first." }
        alt: ["Espera a que lo lea el abogado.", "Sí, pero lee bien el documento."]
        grammar: [g.subjunctive-purpose, g.imperative-negative]
        vocab: [w.sin-que, w.documento]
      - q: { es: "¿Qué documentos necesito para el trámite?", en: "What documents do I need for the procedure?" }
        a: { es: "Lleva toda la documentación para que sea rápido.", en: "Take all the paperwork so that it's quick." }
        alt: ["El pasaporte y el presupuesto del proyecto.", "Pregunta en la ventanilla para que no te olvides de nada."]
        grammar: [g.subjunctive-purpose]
        vocab: [w.tramite, w.documentacion, w.presupuesto]
      - q: { es: "¿El negocio ya es rentable?", en: "Is the business profitable yet?" }
        a: { es: "Todavía no; necesitamos un socio para que el proyecto no fracase.", en: "Not yet; we need a partner so that the project doesn't fail." }
        alt: ["Sí, este año por fin tenemos beneficios.", "No; el primer año tuvimos pérdidas."]
        grammar: [g.subjunctive-purpose]
        vocab: [w.rentable, w.socio, w.fracasar, w.beneficio, w.perdida]
    texts:
      - title: "Anuncio de un servicio"
        es: ["Ofrecemos entrega en casa para que no tengas que salir.", "Pide por la página web antes de las doce a fin de que el pedido llegue el mismo día.", "Y guarda la factura para que la devolución sea fácil."]
        en: ["We offer home delivery so that you don't have to go out.", "Order on the website before twelve so that the order arrives the same day.", "And keep the invoice so that returns are easy."]
        grammar: [g.subjunctive-purpose]
        vocab: [w.servicio, w.pagina, w.a-fin-de-que]
      - title: "Correo a un socio"
        es: ["Te envío el presupuesto para que lo leas con tranquilidad.", "He reducido los gastos con el fin de que el primer año no tengamos pérdidas.", "Llámame antes del viernes para que hablemos de la inversión."]
        en: ["I'm sending you the budget so that you can read it calmly.", "I've reduced expenses so that we don't have losses in the first year.", "Call me before Friday so that we can talk about the investment."]
        grammar: [g.subjunctive-purpose]
        vocab: [w.presupuesto, w.gasto, w.perdida, w.inversion]
  - id: b1.u05.l4
    title: Si llueve, no salimos
    teach: [g.si-clauses-real]
    vocab: [w.a-menos-que, w.a-no-ser-que, w.en-caso-de-que, w.con-tal-de-que, w.por-si-acaso, w.condicion, w.ingresos, w.paraguas, w.retrasarse, w.prevision, w.descuento, w.inscribirse, w.region, w.seguro.ins, w.reembolso, w.temporada, w.visado, w.aduana, w.embarque]
    tip: "si + present (never subjunctive or future) → present, future or imperative. a menos que, en caso de que, con tal de que → subjunctive."
    sentences:
      - { es: "Si llueve mañana, nos quedaremos en casa viendo una película.", en: "If it rains tomorrow, we'll stay at home watching a film.", altEs: ["Si llueve mañana, nos quedamos en casa viendo una película.", "Si mañana llueve, nos quedaremos en casa viendo una película."], grammar: [g.si-clauses-real], vocab: [w.llover, w.quedarse, w.pelicula], error: { wrong: "Si llueva mañana, nos quedaremos en casa.", explain: "si never takes the present subjunctive: si llueve.", grammar: g.si-clauses-real } }
      - { es: "Coge el paraguas por si acaso; la previsión no es buena.", en: "Take the umbrella just in case; the forecast isn't good.", altEs: ["Llévate el paraguas por si acaso; la previsión no es buena.", "Coge el paraguas por si acaso: la previsión no es buena."], grammar: [g.si-clauses-real, g.imperative-tu], vocab: [w.paraguas, w.por-si-acaso, w.prevision], variant: "Latin America: lleva el paraguas (coger is avoided)." }
      - { es: "Saldremos de excursión a menos que haga mal tiempo.", en: "We'll go on the trip unless the weather is bad.", altEs: ["Saldremos de excursión a no ser que haga mal tiempo.", "Iremos de excursión a menos que haga mal tiempo."], grammar: [g.si-clauses-real], vocab: [w.a-menos-que, w.excursion, w.tiempo] }
      - { es: "Si el vuelo se retrasa más de tres horas, tienes derecho a un reembolso.", en: "If the flight is delayed more than three hours, you're entitled to a refund.", grammar: [g.si-clauses-real], vocab: [w.retrasarse, w.vuelo, w.reembolso] }
      - { es: "Llámame en caso de que pierdas el tren.", en: "Call me in case you miss the train.", altEs: ["Llámame si pierdes el tren."], grammar: [g.si-clauses-real], vocab: [w.en-caso-de-que, w.perder, w.tren] }
      - { es: "Te presto el coche con tal de que me lo devuelvas limpio.", en: "I'll lend you the car as long as you give it back clean.", grammar: [g.si-clauses-real], vocab: [w.con-tal-de-que, w.prestar, w.devolver, w.limpio] }
      - { es: "Si has reservado en temporada baja, el hotel es mucho más barato.", en: "If you've booked in low season, the hotel is much cheaper.", grammar: [g.si-clauses-real, g.present-perfect], vocab: [w.temporada, w.reservar, w.barato] }
      - { es: "No podrás entrar en el país a no ser que tengas visado.", en: "You won't be able to enter the country unless you have a visa.", altEs: ["No podrás entrar en el país a menos que tengas visado.", "No puedes entrar en el país a no ser que tengas visado."], grammar: [g.si-clauses-real], vocab: [w.a-no-ser-que, w.visado, w.pais] }
      - { es: "Si llevas más de diez mil euros, tienes que decirlo en la aduana.", en: "If you're carrying more than ten thousand euros, you have to say so at customs.", grammar: [g.si-clauses-real], vocab: [w.aduana, w.llevar, w.euro] }
      - { es: "Si no estás en la puerta de embarque a las ocho, el avión se va sin ti.", en: "If you're not at the boarding gate at eight, the plane leaves without you.", grammar: [g.si-clauses-real], vocab: [w.embarque, w.puerta, w.avion] }
      - { es: "Es mejor tener un seguro de viaje en caso de que te pongas enfermo.", en: "It's better to have travel insurance in case you get ill.", altEs: ["Es mejor tener un seguro de viaje por si te pones enfermo."], grammar: [g.si-clauses-real], vocab: [w.seguro.ins, w.enfermo, w.en-caso-de-que] }
      - { es: "Si te inscribes antes del lunes, tienes un descuento del diez por ciento.", en: "If you register before Monday, you get a ten per cent discount.", altEs: ["Si te inscribes antes del lunes, tendrás un descuento del diez por ciento."], grammar: [g.si-clauses-real], vocab: [w.inscribirse, w.descuento, w.por-ciento] }
      - { es: "Solo te darán la beca si tus ingresos son bajos; esa es la condición.", en: "They'll only give you the grant if your income is low; that's the condition.", grammar: [g.si-clauses-real], vocab: [w.ingresos, w.condicion, w.bajo] }
      - { es: "En esta región, si no nieva en enero, no se puede esquiar.", en: "In this region, if it doesn't snow in January, you can't ski.", grammar: [g.si-clauses-real], vocab: [w.region, w.nevar, w.esquiar] }
      - { es: "Si tenías fiebre, ¿por qué fuiste a trabajar?", en: "If you had a fever, why did you go to work?", grammar: [g.si-clauses-real, g.imperfect], vocab: [w.fiebre, w.trabajar], note: "Past condition → imperfect / preterite." }
      - { es: "Tengo tiempo. Voy a verte.", en: "I have time. I'm going to see you.", grammar: [g.si-clauses-real], vocab: [w.tiempo, w.ver], transform: { instruction: "Make a real condition with 'si'", answer: "Si tengo tiempo, iré a verte.", alt: ["Si tengo tiempo, voy a verte.", "Si tengo tiempo, te veo."] } }
    exchanges:
      - q: { es: "¿Salimos de excursión el domingo?", en: "Shall we go on a trip on Sunday?" }
        a: { es: "Sí, a menos que haga mal tiempo.", en: "Yes, unless the weather is bad." }
        alt: ["Si no llueve, sí.", "Vale, pero llevad paraguas por si acaso."]
        grammar: [g.si-clauses-real]
        vocab: [w.a-menos-que, w.por-si-acaso]
      - q: { es: "¿Me prestas el coche este fin de semana?", en: "Will you lend me the car this weekend?" }
        a: { es: "Te lo presto con tal de que me lo devuelvas limpio.", en: "I'll lend it to you as long as you give it back clean." }
        alt: ["Sí, si me lo devuelves el domingo por la noche.", "Solo si conduces con cuidado."]
        grammar: [g.si-clauses-real]
        vocab: [w.con-tal-de-que]
      - q: { es: "¿Qué pasa si el vuelo se retrasa?", en: "What happens if the flight is delayed?" }
        a: { es: "Si se retrasa más de tres horas, tienes derecho a un reembolso.", en: "If it's delayed more than three hours, you're entitled to a refund." }
        alt: ["En caso de que se retrase, te avisan por mensaje.", "Nada, a no ser que pierdas el tren después."]
        grammar: [g.si-clauses-real]
        vocab: [w.retrasarse, w.reembolso, w.en-caso-de-que]
      - q: { es: "¿Necesito visado para viajar allí?", en: "Do I need a visa to travel there?" }
        a: { es: "Sí; no podrás entrar a no ser que tengas visado.", en: "Yes; you won't be able to enter unless you have a visa." }
        alt: ["Si te quedas menos de tres meses, no.", "Depende de tu pasaporte."]
        grammar: [g.si-clauses-real]
        vocab: [w.visado, w.a-no-ser-que]
      - q: { es: "¿Me inscribo en el curso ahora?", en: "Shall I register for the course now?" }
        a: { es: "Sí, si te inscribes antes del lunes, tienes un descuento.", en: "Yes, if you register before Monday, you get a discount." }
        alt: ["Inscríbete ya, por si acaso se llena.", "Espera, a menos que quieras el descuento."]
        grammar: [g.si-clauses-real]
        vocab: [w.inscribirse, w.descuento]
    texts:
      - title: "Aviso del aeropuerto"
        es: ["Si no está en la puerta de embarque a las ocho, el avión saldrá sin usted.", "En caso de que su vuelo se retrase, mire las pantallas.", "Lleve el pasaporte a mano por si acaso lo piden en la aduana."]
        en: ["If you are not at the boarding gate at eight, the plane will leave without you.", "In case your flight is delayed, look at the screens.", "Keep your passport to hand in case they ask for it at customs."]
        grammar: [g.si-clauses-real, g.imperative-usted]
        vocab: [w.embarque, w.retrasarse, w.aduana, w.por-si-acaso]
      - title: "Mensaje de una amiga"
        es: ["Si llueve mañana, nos quedamos en casa y vemos una película.", "Coge el paraguas por si acaso; la previsión no es buena.", "A menos que prefieras ir al cine, claro."]
        en: ["If it rains tomorrow, we'll stay at home and watch a film.", "Take the umbrella just in case; the forecast isn't good.", "Unless you'd rather go to the cinema, of course."]
        grammar: [g.si-clauses-real]
        vocab: [w.paraguas, w.prevision, w.a-menos-que]
dialogues:
  - id: b1.u05.d1
    title: Planes para el verano
    context: Nuria and Javi, two university friends, plan a trip to Lisbon after the exams.
    lines:
      - { speaker: Nuria, es: "¿Qué vas a hacer cuando termines los exámenes?", en: "What are you going to do when you finish your exams?" }
      - { speaker: Javi, es: "En cuanto acabe el último, me voy a Lisboa una semana. ¿Te vienes?", en: "As soon as I finish the last one, I'm off to Lisbon for a week. Are you coming?" }
      - { speaker: Nuria, es: "Me encantaría, pero solo si no es muy caro. Estoy ahorrando para independizarme.", en: "I'd love to, but only if it isn't very expensive. I'm saving to move out." }
      - { speaker: Javi, es: "Tranquila. Si reservamos ahora, los billetes salen a cuarenta euros.", en: "Don't worry. If we book now, the tickets come out at forty euros." }
      - { speaker: Nuria, es: "Vale. Y ¿dónde vamos a dormir?", en: "OK. And where are we going to sleep?" }
      - { speaker: Javi, es: "Mi primo tiene un piso allí; dice que podemos quedarnos con tal de que no hagamos ruido por la noche.", en: "My cousin has a flat there; he says we can stay as long as we don't make noise at night." }
      - { speaker: Nuria, es: "Perfecto. Iré a menos que me llamen para la entrevista de trabajo.", en: "Perfect. I'll go unless they call me for the job interview." }
      - { speaker: Javi, es: "Pues reservo hoy mismo, por si acaso suben los precios.", en: "Then I'll book today, just in case prices go up." }
      - { speaker: Nuria, es: "Avísame cuando lo tengas todo y te paso el dinero.", en: "Let me know when you've got everything and I'll give you the money." }
      - { speaker: Javi, es: "Hecho. Y cuando volvamos, te ayudo a buscar piso.", en: "Done. And when we get back, I'll help you look for a flat." }
