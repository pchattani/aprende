id: r.b2.un-asado-en-montevideo
level: b2
title: Un asado en Montevideo
kind: dialogue
intro: Carla, a student from Valencia, spends a Sunday at the house of her Uruguayan friend Daniel. The dialogue shows voseo, ustedes and everyday Río de la Plata vocabulary in action.
allow: [carla, daniel, valencia, montevideo, uruguay, susana, rodrigo]
paragraphs:
  - { es: "Era el primer domingo de Carla en Montevideo. Daniel, su compañero del curso de intercambio, la había invitado a comer con su familia. «Vení a las doce, que mi papá hace el asado y se enoja si llegás tarde», le había escrito la noche anterior.", en: "It was Carla's first Sunday in Montevideo. Daniel, her classmate from the exchange course, had invited her to lunch with his family. 'Come at twelve, my dad does the barbecue and he gets angry if you arrive late', he had written to her the night before." }
  - { es: "—¡Carla! Pasá, pasá. Che, mamá, ¡llegó la española! —gritó Daniel desde la puerta.", en: "'Carla! Come in, come in. Hey, mum, the Spanish girl's here!' Daniel shouted from the door." }
  - { es: "—Bienvenida, querida. Yo soy Susana. ¿Vos sos de Madrid? —preguntó la madre mientras le daba un beso.", en: "'Welcome, dear. I'm Susana. Are you from Madrid?' the mother asked as she kissed her." }
  - { es: "—No, de Valencia. Muchas gracias por invitarme; les he traído unos dulces de allí —dijo Carla, orgullosa de haber dicho «les» y no «os», como le había enseñado Daniel.", en: "'No, from Valencia. Thank you very much for inviting me; I've brought you some sweets from there', said Carla, proud of having said les and not os, as Daniel had taught her." }
  - { es: "En el patio, el padre, Rodrigo, daba vueltas a la carne con la tranquilidad de quien lleva cuarenta años haciendo lo mismo. —¿Vos comés carne, Carla? Porque acá el asado es sagrado —dijo sin mirarla.", en: "In the yard, the father, Rodrigo, was turning the meat with the calm of someone who has been doing the same thing for forty years. 'Do you eat meat, Carla? Because here the barbecue is sacred', he said without looking at her." }
  - { es: "—Como de todo, no se preocupe. Aunque en casa el domingo lo que hacemos es paella.", en: "'I eat everything, don't worry. Although at home on Sundays what we make is paella.'" }
  - { es: "—¡Paella! Decime una cosa: ¿es verdad que ustedes le ponen chorizo? —preguntó Rodrigo, y toda la familia se echó a reír, porque sabían que a los valencianos esa pregunta les sienta fatal.", en: "'Paella! Tell me something: is it true that you lot put chorizo in it?' Rodrigo asked, and the whole family burst out laughing, because they knew that question goes down terribly with Valencians." }
  - { es: "Durante la comida, Carla fue descubriendo que entendía casi todo, pero no todo. Cuando Daniel dijo que el lunes tenía «un quilombo en el laburo», pensó que hablaba de un lugar; resultó que quería decir que tenía un lío enorme en el trabajo. Y cuando Susana le ofreció «una pequeña porción de torta», se encontró con un trozo de tarta del tamaño de un libro.", en: "Over lunch, Carla gradually discovered that she understood almost everything, but not everything. When Daniel said that on Monday he had 'un quilombo en el laburo', she thought he was talking about a place; it turned out he meant he had an enormous mess at work. And when Susana offered her 'a small portion of torta', she found herself with a piece of cake the size of a book." }
  - { es: "—¿Y a vos qué te parece lo más raro de cómo hablamos? —le preguntó Daniel al final, mientras preparaba el mate.", en: "'And what do you find strangest about how we speak?' Daniel asked her at the end, while he prepared the mate." }
  - { es: "—Lo del «vos» ya lo tengo controlado. Lo que me cuesta es la «sh»: cuando decís «calle» o «lluvia», yo oigo otra palabra. Y que nadie diga «vale»; aquí todo es «dale».", en: "'The vos thing I've got under control now. What I find hard is the sh: when you say calle or lluvia, I hear another word. And that nobody says vale; here everything is dale.'" }
  - { es: "—Dale, entonces: la semana que viene te toca a vos. Hacés una paella para todos… sin chorizo, prometido —dijo Rodrigo, y le pasó el mate.", en: "'Dale, then: next week it's your turn. You make a paella for everyone… without chorizo, promise', said Rodrigo, and passed her the mate." }
  - { es: "Carla lo tomó despacio, como le habían enseñado, y pensó que en una sola comida había aprendido más español que en un mes de clases.", en: "Carla drank it slowly, as they had taught her, and thought that in a single meal she had learned more Spanish than in a month of classes." }
questions:
  - { q: "Why does Daniel tell Carla to arrive at twelve?", options: ["Because the buses stop running", "Because his father gets angry if people are late for the barbecue", "Because lunch is at twelve in Spain"], answer: 1 }
  - { q: "What is Carla proud of?", options: ["Bringing sweets", "Saying les instead of os", "Eating meat"], answer: 1 }
  - { q: "What did Carla misunderstand about quilombo?", options: ["She thought it was a place", "She thought it was a food", "She thought it was a person"], answer: 0 }
  - { q: "What does Carla find hardest about Río de la Plata Spanish?", options: ["The use of vos", "The sh pronunciation of ll and y", "The word dale"], answer: 1 }
glossary:
  - { es: pasá, en: come in (vos imperative of pasar) }
  - { es: comés, en: you eat (vos form of comer) }
  - { es: sagrado, en: sacred }
  - { es: chorizo, en: chorizo (spicy sausage) }
  - { es: valenciano, en: Valencian }
  - { es: porción, en: portion }
  - { es: torta, en: cake (Río de la Plata) }
  - { es: controlado, en: under control }
  - { es: decís, en: you say (vos form of decir) }
  - { es: hacés, en: you make (vos form of hacer) }
  - { es: prometido, en: promised }
