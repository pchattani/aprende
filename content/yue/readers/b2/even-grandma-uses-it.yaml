  - { es: 拍門, en: to knock on a door }
  - { es: 阿欣, en: Yan (a name) }
  - { es: 搖頭, en: "to shake one's head" }
  - { es: 唔服氣, en: unwilling to accept being outdone }
  - { es: 刪, en: to delete }
  - { es: 聯絡人, en: contact (in a phone) }
  - { es: 自拍, en: selfie }
  - { es: 輸入, en: input }
  - { es: 老闆娘, en: female shop owner }
  - { es: 放大, en: to enlarge }
  - { es: 大不了, en: at worst }
  - { es: 群組, en: group (chat) }
  - { es: 傳, en: to send }
  - { es: 表姨, en: "cousin (of one's mother)" }
  - { es: 鬆餅, en: scone }
  - { es: 碌地, en: to roll on the floor (laughing) }
  - { es: 衰佬, en: rascal (teasing) }
  - { es: 距離, en: distance }
