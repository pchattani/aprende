id: r.b2.faut-il-reconstruire-cluny
level: b2
title: Faut-il reconstruire Cluny ?
kind: text
intro: An opinion piece about the great abbey of Cluny, which once ruled over a network of monasteries across Europe and is now largely in ruins. Follow the structure of the argument and its connectors (certes, néanmoins, d'une part… d'autre part, en outre, par conséquent).
allow: [guillaume, aquitaine, ok, centre]
paragraphs:
  - { es: "Le visiteur qui arrive aujourd'hui à Cluny, petite ville tranquille du sud de la Bourgogne, a du mal à imaginer ce qu'elle a été. Pendant près de deux siècles, l'abbaye de Cluny fut l'un des centres du monde chrétien. Fondée en 910 par Guillaume, duc d'Aquitaine, elle a été à la tête d'un immense réseau de plus d'un millier de monastères, de l'Espagne à l'Angleterre. Son église abbatiale était la plus grande de la chrétienté, jusqu'à la construction de la basilique Saint-Pierre de Rome, au seizième siècle.", en: "The visitor who arrives in Cluny today, a quiet little town in southern Burgundy, finds it hard to imagine what it once was. For nearly two centuries the abbey of Cluny was one of the centres of the Christian world. Founded in 910 by William, Duke of Aquitaine, it headed a vast network of more than a thousand monasteries, from Spain to England. Its abbey church was the largest in Christendom until the building of St Peter's Basilica in Rome in the sixteenth century." }
  - { es: "Or, de ce géant de pierre, il ne reste presque rien. Après la Révolution, l'abbaye a été vendue, puis utilisée comme carrière : pendant des années, les habitants sont venus y chercher des pierres pour construire leurs maisons. Aujourd'hui, seule une petite partie de l'église est encore debout. D'où une question qui revient régulièrement : ne faudrait-il pas reconstruire Cluny ?", en: "Yet of this stone giant almost nothing remains. After the Revolution the abbey was sold, then used as a quarry: for years the inhabitants came to take stones from it to build their houses. Today only a small part of the church is still standing. Hence a question that comes up regularly: shouldn't Cluny be rebuilt?" }
  - { es: "Les partisans de la reconstruction ne manquent pas d'arguments. D'une part, Cluny est un symbole européen : à une époque où l'Europe cherche ses racines communes, quel meilleur exemple qu'une institution qui unissait déjà, il y a mille ans, des moines de tous les pays ? D'autre part, une reconstruction attirerait des centaines de milliers de touristes, ce qui ferait vivre toute la région. En outre, les techniques modernes et les archives permettraient de rebâtir l'édifice avec une grande précision.", en: "Supporters of rebuilding have no shortage of arguments. On the one hand, Cluny is a European symbol: at a time when Europe is looking for its common roots, what better example than an institution that already united monks from every country a thousand years ago? On the other hand, rebuilding would attract hundreds of thousands of tourists, which would support the whole region. Moreover, modern techniques and the archives would make it possible to rebuild the edifice with great precision." }
  - { es: "Certes, ces arguments sont séduisants. Néanmoins, ils oublient l'essentiel. Premièrement, le coût d'un tel projet serait gigantesque, alors que de nombreux monuments existants manquent déjà de moyens pour être simplement entretenus. Deuxièmement, une copie, même parfaite, resterait une copie : ce serait un décor, et non un monument historique. Enfin, la destruction de Cluny fait elle-même partie de son histoire. Effacer les ruines, ce serait effacer deux siècles de mémoire, y compris celle de la Révolution.", en: "Admittedly, these arguments are attractive. Nevertheless, they forget the essential point. First, the cost of such a project would be enormous, while many existing monuments already lack the means simply to be maintained. Second, a copy, even a perfect one, would remain a copy: it would be a stage set, not a historic monument. Finally, the destruction of Cluny is itself part of its history. Erasing the ruins would mean erasing two centuries of memory, including that of the Revolution." }
  - { es: "Faut-il, par conséquent, laisser Cluny tel quel ? Pas nécessairement. Il existe en effet une troisième voie, que la ville a d'ailleurs déjà choisie. Grâce aux nouvelles technologies, les visiteurs peuvent aujourd'hui voir l'abbaye telle qu'elle était au Moyen Âge : des tablettes numériques et des films en réalité virtuelle reconstituent les bâtiments disparus, à l'endroit exact où ils se trouvaient. Ainsi, on peut admirer la grandeur passée de l'abbaye sans détruire ce qui reste de son histoire réelle.", en: "Should Cluny therefore be left as it is? Not necessarily. There is in fact a third way, which the town has, incidentally, already chosen. Thanks to new technologies, visitors can now see the abbey as it was in the Middle Ages: digital tablets and virtual-reality films recreate the vanished buildings in the exact spot where they stood. In this way you can admire the abbey's past grandeur without destroying what remains of its real history." }
  - { es: "En définitive, la vraie question n'est peut-être pas de savoir s'il faut reconstruire Cluny, mais de comprendre ce que nous attendons de notre patrimoine. Voulons-nous des monuments parfaits, comme dans un parc d'attractions, ou des lieux qui portent les traces du temps ? Pour ma part, je préfère les ruines de Cluny à une copie neuve. Car c'est précisément ce vide, au milieu de la petite ville, qui nous fait sentir la grandeur de ce qui a disparu.", en: "Ultimately, the real question is perhaps not whether Cluny should be rebuilt, but what we expect from our heritage. Do we want perfect monuments, as in a theme park, or places that bear the marks of time? For my part, I prefer the ruins of Cluny to a brand-new copy. For it is precisely this emptiness, in the middle of the little town, that makes us feel the greatness of what has disappeared." }
questions:
  - { q: "Pourquoi l'abbaye de Cluny était-elle si importante ?", options: ["Elle était à la tête d'un réseau de plus d'un millier de monastères", "C'était le palais des ducs de Bourgogne", "C'était la plus petite église d'Europe"], answer: 0, explain: "It headed «un immense réseau de plus d'un millier de monastères» and its church was the largest in Christendom." }
  - { q: "Qu'est-il arrivé à l'abbaye après la Révolution ?", options: ["Elle a été transformée en musée", "Elle a été vendue et utilisée comme carrière", "Elle a été reconstruite"], answer: 1, explain: "«L'abbaye a été vendue, puis utilisée comme carrière.»" }
  - { q: "Quel argument est avancé EN FAVEUR de la reconstruction ?", options: ["Le coût serait faible", "Elle attirerait des centaines de milliers de touristes", "Les ruines sont dangereuses"], answer: 1, explain: "«Une reconstruction attirerait des centaines de milliers de touristes, ce qui ferait vivre toute la région.»" }
  - { q: "Pourquoi l'auteur est-il contre la reconstruction ?", options: ["Parce qu'il n'aime pas le Moyen Âge", "À cause du coût, de la valeur d'une copie et de la mémoire des ruines", "Parce que les touristes sont trop nombreux"], answer: 1, explain: "His three points: the cost, «une copie… resterait une copie», and erasing the ruins would erase memory." }
  - { q: "Quelle « troisième voie » la ville a-t-elle choisie ?", options: ["Reconstruire seulement l'église", "Utiliser les nouvelles technologies pour montrer l'abbaye disparue", "Vendre les ruines"], answer: 1, explain: "«Des tablettes numériques et des films en réalité virtuelle reconstituent les bâtiments disparus.»" }
  - { q: "Quel connecteur introduit une concession avant l'objection ?", options: ["Certes", "Par conséquent", "En outre"], answer: 0, explain: "Certes (admittedly) concedes a point; néanmoins then introduces the objection. Par conséquent = consequence, en outre = addition." }
