id: r.b2.i-sassi-di-matera
level: b2
title: I Sassi di Matera
kind: text
intro: An encyclopaedia-style history of Matera, once called a "national disgrace" and now a UNESCO site. The text uses the passive with essere, venire and andare.
allow: [quindicimila, matera, sassi, sasso, caveoso, barisano, murgia, basilicata, levi, carlo, eboli, pasolini, gibson, unesco, de, gasperi, bond, mel]
paragraphs:
  - { es: "Matera, in Basilicata, è considerata una delle città abitate più antiche del mondo. Il suo centro storico, formato da due grandi quartieri chiamati Sasso Caveoso e Sasso Barisano, è stato scavato direttamente nella roccia calcarea di un profondo vallone, la Gravina. Le prime grotte furono abitate già nel Paleolitico, e da allora la vita non si è mai interrotta.", en: "Matera, in Basilicata, is considered one of the oldest inhabited cities in the world. Its historic centre, made up of two large districts called Sasso Caveoso and Sasso Barisano, was dug directly into the limestone of a deep ravine, the Gravina. The first caves were already inhabited in the Palaeolithic, and since then life there has never stopped." }
  - { es: "Nel corso dei secoli le grotte furono trasformate in case, chiese, cantine e stalle. Sopra le grotte vennero costruite facciate in pietra, scale, piccole piazze e strade, tanto che spesso il tetto di una casa fa da strada per quella che sta sopra. Un sistema ingegnoso di canali e di cisterne permetteva di raccogliere l'acqua piovana, che veniva conservata per i lunghi mesi di siccità.", en: "Over the centuries the caves were turned into houses, churches, cellars and stables. Above the caves stone façades, stairways, small squares and streets were built, so much so that the roof of one house often serves as the street for the one above. An ingenious system of channels and cisterns made it possible to collect rainwater, which was kept for the long months of drought." }
  - { es: "Nella prima metà del Novecento, però, la situazione era diventata drammatica. Nei Sassi vivevano circa quindicimila persone, spesso in una sola stanza senza finestre, insieme agli animali, senza acqua corrente né fognature. La mortalità infantile era altissima. Nel libro «Cristo si è fermato a Eboli», pubblicato nel 1945, lo scrittore Carlo Levi descrisse quelle condizioni con parole che sconvolsero l'Italia intera.", en: "In the first half of the twentieth century, however, the situation had become dramatic. Around fifteen thousand people lived in the Sassi, often in a single windowless room, together with the animals, without running water or sewers. Infant mortality was extremely high. In the book 'Christ Stopped at Eboli', published in 1945, the writer Carlo Levi described those conditions in words that shocked the whole of Italy." }
  - { es: "In quegli anni molti politici definirono i Sassi una «vergogna nazionale». Nel 1950 il presidente del Consiglio Alcide De Gasperi visitò la città, e due anni dopo fu approvata una legge speciale, grazie alla quale gli abitanti vennero trasferiti in nuovi quartieri costruiti sull'altopiano. Il trasferimento andò avanti per tutti gli anni Cinquanta e Sessanta, e alla fine i Sassi rimasero quasi completamente vuoti.", en: "In those years many politicians called the Sassi a 'national disgrace'. In 1950 Prime Minister Alcide De Gasperi visited the city, and two years later a special law was passed, under which the inhabitants were moved to new districts built on the plateau. The relocation went on throughout the 1950s and 1960s, and in the end the Sassi were left almost completely empty." }
  - { es: "Per molti anni l'antica città fu dimenticata. Le case abbandonate vennero chiuse e molte andarono in rovina. Solo a partire dagli anni Ottanta i Sassi cominciarono a essere visti non più come un simbolo di povertà, ma come un patrimonio da salvare. Nel 1993 vennero inseriti nella lista del Patrimonio dell'Umanità dell'UNESCO, primo sito dell'Italia meridionale.", en: "For many years the ancient city was forgotten. The abandoned houses were closed up and many fell into ruin. Only from the 1980s did people begin to see the Sassi no longer as a symbol of poverty but as a heritage to be saved. In 1993 they were added to UNESCO's World Heritage list, the first site in southern Italy." }
  - { es: "Da allora, Matera è stata completamente trasformata. Le vecchie grotte sono state restaurate e trasformate in alberghi, ristoranti, musei e abitazioni. La città è stata scelta come set per molti film, da «Il Vangelo secondo Matteo» di Pasolini alla «Passione di Cristo» di Mel Gibson, fino a un film di James Bond. Nel 2019 Matera è stata nominata Capitale europea della Cultura.", en: "Since then Matera has been completely transformed. The old caves have been restored and turned into hotels, restaurants, museums and homes. The city has been chosen as a set for many films, from Pasolini's 'The Gospel According to St Matthew' to Mel Gibson's 'The Passion of the Christ', and even a James Bond film. In 2019 Matera was named European Capital of Culture." }
  - { es: "Oggi il turismo porta lavoro e ricchezza, ma pone anche nuove domande. Secondo alcuni abitanti, i Sassi vanno protetti non solo dal degrado, ma anche dal rischio di diventare un museo all'aperto, senza vita vera. La storia di Matera, d'altra parte, insegna che una città può cadere molto in basso e rinascere. Va ricordato, però, che dietro le cartoline ci sono le vite di migliaia di persone che in quelle grotte hanno sofferto.", en: "Today tourism brings jobs and wealth, but it also raises new questions. According to some residents, the Sassi must be protected not only from decay but also from the risk of becoming an open-air museum, without real life. Matera's history, on the other hand, shows that a city can fall very low and be reborn. It must be remembered, though, that behind the postcards are the lives of thousands of people who suffered in those caves." }
questions:
  - { q: "Come è stato costruito il centro storico di Matera?", options: ["Con mattoni portati da Napoli", "Scavando nella roccia di un vallone", "Su un'isola"], answer: 1, explain: "«È stato scavato direttamente nella roccia calcarea di un profondo vallone.»" }
  - { q: "Come si raccoglieva l'acqua nei Sassi?", options: ["Con un acquedotto romano", "Con un sistema di canali e cisterne", "Dal fiume"], answer: 1, explain: "Rainwater was collected in channels and cisterns and stored for the dry months." }
  - { q: "Come vennero definiti i Sassi da molti politici?", options: ["Un patrimonio da salvare", "Una vergogna nazionale", "Un museo all'aperto"], answer: 1, explain: "In the post-war years politicians called them «una vergogna nazionale»; the idea of a heritage to be saved only came in the 1980s." }
  - { q: "Che cosa successe dopo la legge speciale del 1952?", options: ["Gli abitanti furono trasferiti in nuovi quartieri", "I Sassi divennero un museo", "Arrivarono i primi turisti"], answer: 0, explain: "«Gli abitanti vennero trasferiti in nuovi quartieri costruiti sull'altopiano» – passive with venire." }
  - { q: "Che cosa significa «i Sassi vanno protetti»?", options: ["I Sassi stanno andando via", "I Sassi devono essere protetti", "I Sassi sono già stati protetti"], answer: 1, explain: "Andare + past participle expresses obligation in the passive: 'must be protected'." }
