    texts:
      - title: "山頂嘅遊客"
        es: ["山頂有好多外國人。", "有英國人、美國人，仲有日本人。", "佢哋都係嚟睇香港嘅。"]
        en: ["There are lots of foreigners at the Peak.", "There are British, Americans and also Japanese.", "They've all come to see Hong Kong."]
        grammar: [g.nationality-language, g.dou-also]
        vocab: [w.ngoi6-gwok3-jan4, w.jing1-gwok3-jan4, w.jat6-bun2-jan4]
      - title: "問題"
        es: ["你係咪學生呀？", "你喺邊間大學讀書呀？", "你讀咩呀？"]
        en: ["Are you a student?", "Which university do you study at?", "What do you study?"]
        grammar: [g.a-not-a-questions, g.question-words]
        vocab: [w.hai6-mai6, w.daai6-hok6, w.duk6]
    spicy:
      - { es: "你係咪成日都咁好笑㗎？", en: "Are you always this funny?", altEs: ["你係唔係成日都咁好笑㗎？"], grammar: [g.a-not-a-questions], vocab: [w.hai6-mai6] }
      - { es: "你想坐纜車定係同我行上山頂呀？", en: "Do you want to take the tram, or walk up the Peak with me?", altEs: ["你想坐纜車，定係同我行上山頂呀？"], grammar: [g.a-not-a-questions], vocab: [w.ding6-hai6], jp: "nei5 soeng2 co5 laam6 ce1 ding6 hai6 tung4 ngo5 haang4 soeng5 saan1 deng2 aa3" }
      - { es: "你識唔識講廣東話呀？唔識？我同你一齊學。", en: "Can you speak Cantonese? No? Let's learn together.", altEs: ["你識講廣東話嗎？唔識？我同你一齊學。"], grammar: [g.a-not-a-questions], vocab: [w.sik1, w.hok6] }
      - { es: "你係咪外國人呀？你嘅廣東話好正。", en: "Are you a foreigner? Your Cantonese is great.", altEs: ["你係唔係外國人呀？你嘅廣東話好正。"], grammar: [g.a-not-a-questions], vocab: [w.ngoi6-gwok3-jan4], jp: "nei5 hai6 mai6 ngoi6 gwok3 jan4 aa3 nei5 ge3 gwong2 dung1 waa2 hou2 zeng3" }
      - { es: "我讀書好叻，不過一見到你就唔記得。", en: "I'm great at studying, but the moment I see you I forget everything.", altEs: ["我讀書好叻，但係一見到你就唔記得。"], grammar: [g.a-not-a-questions], vocab: [w.duk6-syu1] }
  - id: a1.u03.l4
    title: 我講少少廣東話
    teach: [g.nationality-language]
    tip: "Country + 人 = a person from there (英國人). Spoken languages are …話 (廣東話, 普通話); languages you read and write are often …文 (英文, 中文). 'Speak' is 講."
    vocab: [w.hon4-gwok3, w.toi4-waan1, w.faat3-gwok3, w.ou3-zau1, w.gaa1-naa4-daai6, w.san1-gaa3-bo1, w.sai1-baan1-ngaa4, w.dak1-gwok3, w.leon4-deon1, w.waa2, w.gwong2-dung1-waa2, w.pou2-tung1-waa2, w.jat6-man2, w.faat3-man2, w.jyut6-jyu5, w.gong2, w.siu2-siu2, w.jau6.b, w.maan6-di1, w.zung6]
    sentences:
      - { es: "你係邊度人呀？", en: "Where are you from?", altEs: ["你係邊度人？", "你係邊個國家嘅人呀？"], grammar: [g.nationality-language, g.question-words], vocab: [w.gwok3-gaa1],
          transform: { instruction: "Ask about them", answer: "佢哋係邊度人呀？", alt: ["佢哋係邊度人？"] } }
      - { es: "我係澳洲人。", en: "I'm Australian.", altEs: ["我係澳洲人嚟㗎。"], grammar: [g.nationality-language], vocab: [w.ou3-zau1],
          transform: { instruction: "Say you're Canadian", answer: "我係加拿大人。" } }
      - { es: "佢識講普通話同英文。", en: "She can speak Mandarin and English.", altEs: ["佢識講普通話同埋英文。"], altEn: ["He can speak Mandarin and English.", "She speaks Mandarin and English."], grammar: [g.nationality-language], vocab: [w.pou2-tung1-waa2, w.jing1-man2, w.sik1-gong2],
          transform: { instruction: "Make it negative", answer: "佢唔識講普通話同英文。" } }
      - { es: "我講少少廣東話。", en: "I speak a little Cantonese.", altEs: ["我識講少少廣東話。"], grammar: [g.nationality-language], vocab: [w.gong2, w.gwong2-dung1-waa2],
          error: { wrong: "我說少少廣東話。", explain: "'Speak' in spoken Cantonese is 講; 說 is written Chinese.", grammar: g.nationality-language } }
      - { es: "你識唔識講日文呀？", en: "Can you speak Japanese?", altEs: ["你識講日文嗎？"], grammar: [g.nationality-language, g.a-not-a-questions], vocab: [w.jat6-man2] }
      - { es: "佢係加拿大人，住喺倫敦。", en: "He's Canadian and lives in London.", altEs: ["佢係加拿大人，喺倫敦住。"], altEn: ["She's Canadian and lives in London."], grammar: [g.nationality-language, g.hai2-location], vocab: [w.gaa1-naa4-daai6, w.leon4-deon1] }
      - { es: "新加坡人識講英文同中文。", en: "Singaporeans speak English and Chinese.", altEs: ["新加坡人識講英文同埋中文。"], grammar: [g.nationality-language], vocab: [w.san1-gaa3-bo1, w.zung1-man2] }
      - { es: "我識講英文，但係唔識法文。", en: "I can speak English, but I don't know French.", altEs: ["我識講英文，不過唔識法文。"], grammar: [g.nationality-language, g.m-negation], vocab: [w.faat3-man2] }
      - { es: "廣東話又叫粵語。", en: "Cantonese is also called 粵語.", altEs: ["廣東話又叫做粵語。"], grammar: [g.nationality-language], vocab: [w.jyut6-jyu5, w.waa2] }
      - { es: "佢係德國人定係法國人呀？", en: "Is she German or French?", altEs: ["佢係德國人定法國人呀？"], altEn: ["Is he German or French?"], grammar: [g.nationality-language, g.a-not-a-questions], vocab: [w.dak1-gwok3, w.faat3-gwok3] }
      - { es: "我哋都係台灣人。", en: "We're both from Taiwan.", altEs: ["我哋全部都係台灣人。"], altEn: ["We're all from Taiwan."], grammar: [g.nationality-language, g.dou-also], vocab: [w.toi4-waan1] }
      - { es: "佢係韓國人，佢嘅英文好好。", en: "He's Korean, and his English is very good.", altEs: ["佢係韓國人，英文好好。"], altEn: ["She's Korean, and her English is very good."], grammar: [g.nationality-language], vocab: [w.hon4-gwok3] }
      - { es: "西班牙係一個好靚嘅國家。", en: "Spain is a beautiful country.", grammar: [g.nationality-language], vocab: [w.sai1-baan1-ngaa4] }
      - { es: "唔該講慢啲。", en: "Please speak more slowly.", altEs: ["講慢啲，唔該。", "唔該你講慢啲。"], altEn: ["Slower, please."], grammar: [g.di-some], vocab: [w.gong2] }
      - { es: "我係英國人。", en: "I'm British.", altEs: ["我係英國人嚟㗎。"], grammar: [g.nationality-language], vocab: [w.jing1-gwok3-jan4],
          error: { wrong: "我係英國。", explain: "Add 人 for a person: 我係英國人. 我係英國 would mean 'I am Britain'.", grammar: g.nationality-language } }
    exchanges:
      - q: { es: "你係邊度人呀？", en: "Where are you from?" }
