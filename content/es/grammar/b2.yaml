- id: g.subjunctive-imperfect
  level: b2
  title: "The imperfect subjunctive — hablara / hablase"
  summary: "From the ellos preterite: hablaron → hablara, hablase; tuvieron → tuviera; fueron → fuera."
  explanation: |
    Take the **ellos** form of the preterite, drop *-ron*, add *-ra, -ras, -ra, -ramos, -rais, -ran* (or the equivalent *-se* set). Every irregularity of the preterite carries over automatically.

    | | hablar | tener | ser / ir | decir |
    |---|---|---|---|---|
    | yo | hablara / hablase | tuviera | fuera | dijera |
    | tú | hablaras | tuvieras | fueras | dijeras |
    | él | hablara | tuviera | fuera | dijera |
    | nosotros | habl**á**ramos | tuvi**é**ramos | fu**é**ramos | dij**é**ramos |
    | vosotros | hablarais | tuvierais | fuerais | dijerais |
    | ellos | hablaran | tuvieran | fueran | dijeran |

    *-ra* and *-se* are interchangeable in almost all uses; *-ra* is more frequent in speech, *-se* more literary.

    Uses: the subjunctive triggers you know (wish, emotion, doubt, purpose…) when the main verb is in the **past or conditional** (*Quería que vinieras. Me gustaría que vinieras.*), unreal conditions (*si tuviera*), *como si*, and polite *quisiera*.
  examples:
    - { es: "Me pidió que la ayudara.", en: "She asked me to help her." }
    - { es: "No creía que fuera tan difícil.", en: "I didn't think it was so difficult." }
    - { es: "Quisiera hablar con el director.", en: "I would like to speak to the manager." }
  pitfalls:
    - "The accent on nosotros (*habláramos*) is the only one in the paradigm."
  drills:
    - { es: "Era necesario que todos estuvieran de acuerdo.", en: "It was necessary for everyone to agree." }
    - { es: "Ojalá pudiera ir contigo.", en: "If only I could go with you." }
- id: g.si-clauses-unreal
  level: b2
  title: "Si tuviera dinero, viajaría — unreal conditions"
  summary: "si + imperfect subjunctive, + conditional: unlikely or impossible in the present."
  explanation: |
    - *Si tuviera dinero, viajaría por el mundo.* — If I had money, I would travel the world.
    - *Si fuera tú, no lo haría.* — If I were you, I wouldn't do it.
    - *Si no lloviera, saldríamos.*
    - The order can be reversed: *Viajaría si tuviera dinero.*
    - Never the conditional after *si*: *si tendría* is wrong.
    - Colloquial Spain sometimes uses the imperfect indicative in the result: *Si tuviera dinero, me compraba un coche.*
  examples:
    - { es: "Si pudiera, trabajaría menos horas.", en: "If I could, I'd work fewer hours." }
    - { es: "¿Qué harías si te tocara la lotería?", en: "What would you do if you won the lottery?" }
    - { es: "Si supieras la verdad, no dirías eso.", en: "If you knew the truth, you wouldn't say that." }
  drills:
    - { es: "Si viviera en la playa, nadaría todos los días.", en: "If I lived at the beach, I'd swim every day." }
    - { es: "Si no estuviera tan cansado, iría contigo.", en: "If I weren't so tired, I'd go with you." }
- id: g.como-si
  level: b2
  title: "Como si + imperfect subjunctive"
  summary: "Habla como si fuera el jefe. Me miró como si no me conociera."
  explanation: |
    *como si* (as if) is always followed by the imperfect subjunctive (or the pluperfect subjunctive for an earlier action):
    - *Habla como si lo supiera todo.* — He talks as if he knew everything.
    - *Actúa como si no hubiera pasado nada.* — She acts as if nothing had happened.
    Related: *ni que* + imperfect subjunctive (as if!, ironic): *¡Ni que fueras millonario!*
  examples:
    - { es: "Me trató como si fuera un niño.", en: "He treated me as if I were a child." }
    - { es: "Gastas dinero como si fueras rico.", en: "You spend money as if you were rich." }
  drills:
    - { es: "Se comporta como si no le importara.", en: "He behaves as if he didn't care." }
    - { es: "Lo dijo como si fuera obvio.", en: "She said it as if it were obvious." }
- id: g.subjunctive-perfect
  level: b2
  title: "The perfect subjunctive — haya hecho"
  summary: "haya, hayas, haya, hayamos, hayáis, hayan + participle: a completed action after a present trigger."
  explanation: |
    Use it when the subjunctive is required and the action is already completed relative to now:
    - *Espero que hayas comido.* — I hope you have eaten.
    - *Me alegro de que hayáis venido.* — I'm glad you came.
    - *No creo que haya llegado todavía.* — I don't think he has arrived yet.
    - *Es posible que se hayan equivocado.*
    - Future-perfect sense in time clauses: *Cuando hayas terminado, avísame.* (When you have finished…)
  examples:
    - { es: "Es una pena que no hayan podido venir.", en: "It's a shame they couldn't come." }
    - { es: "Dudo que haya dicho eso.", en: "I doubt he said that." }
  drills:
    - { es: "Ojalá haya aprobado.", en: "I hope she has passed." }
    - { es: "Llámame cuando hayas llegado.", en: "Call me when you have arrived." }
- id: g.subjunctive-pluperfect
  level: b2
  title: "The pluperfect subjunctive — hubiera hecho"
  summary: "hubiera / hubiese + participle: a completed action after a past trigger, and in past unreal conditions."
  explanation: |
    - After past triggers for an earlier action: *No sabía que hubieras estado en Perú. Me sorprendió que ya hubiera terminado.*
    - Unreal past conditions: *Si hubiera sabido, habría venido.*
    - Regrets with *ojalá*: *Ojalá hubiera estudiado más.*
    - *como si* for an earlier action: *como si no hubiera pasado nada.*
  examples:
    - { es: "Me molestó que no me hubieran avisado.", en: "It annoyed me that they hadn't told me." }
    - { es: "Si hubieras llegado antes, habrías visto a Ana.", en: "If you had arrived earlier, you would have seen Ana." }
  drills:
    - { es: "Ojalá no hubiera dicho eso.", en: "I wish I hadn't said that." }
    - { es: "Era imposible que lo hubiera hecho solo.", en: "It was impossible for him to have done it alone." }
- id: g.si-clauses-past
  level: b2
  title: "Si hubiera sabido, habría venido — past unreal conditions"
  summary: "si + pluperfect subjunctive, + conditional perfect (or pluperfect subjunctive)."
  explanation: |
    - *Si hubiera sabido que venías, habría preparado la cena.* — If I had known you were coming, I would have made dinner.
    - The result can also use *hubiera + participle*: *Si lo hubiera sabido, hubiera venido.*
    - Mixed: past condition, present result → *Si hubiera estudiado medicina, ahora sería médico.*
    - *De haber sabido…* (infinitive, formal) = *Si hubiera sabido…*
  examples:
    - { es: "Si no hubiéramos perdido el tren, ya estaríamos en casa.", en: "If we hadn't missed the train, we'd be home by now." }
    - { es: "Si me lo hubieras pedido, te habría ayudado.", en: "If you had asked me, I would have helped you." }
  drills:
    - { es: "Si hubiera hecho sol, habríamos ido a la playa.", en: "If it had been sunny, we would have gone to the beach." }
    - { es: "De haberlo sabido, no habría venido.", en: "Had I known, I wouldn't have come." }
- id: g.conditional-perfect
  level: b2
  title: "The conditional perfect — habría hecho"
  summary: "habría, habrías, habría, habríamos, habríais, habrían + participle: would have."
  explanation: |
    - Result of an unreal past condition: *Habría venido si me hubieras llamado.*
    - Probability in the remote past: *Habrían salido ya cuando llegaste.*
    - Reported future perfect: *Dijo que habría terminado para el lunes.*
    - Reproach / regret: *Yo no habría hecho eso. Deberías haber llamado. Podrías habérmelo dicho.*
  examples:
    - { es: "Me habría gustado conocer a tu abuelo.", en: "I would have liked to meet your grandfather." }
    - { es: "Sin tu ayuda no lo habríamos conseguido.", en: "Without your help we wouldn't have managed it." }
  drills:
    - { es: "Habría sido mejor esperar.", en: "It would have been better to wait." }
    - { es: "¿Qué habrías hecho tú?", en: "What would you have done?" }
- id: g.ojala-pluperfect
  level: b2
  title: "Regrets — ojalá hubiera, me arrepiento de, tendría que haber"
  summary: "Ojalá + imperfect / pluperfect subjunctive; arrepentirse de + haber; tendría / debería que haber + participle."
  explanation: |
    - *Ojalá + imperfect subjunctive* — an unlikely present wish: *Ojalá tuviera más tiempo.*
    - *Ojalá + pluperfect subjunctive* — regret about the past: *Ojalá hubiera dicho la verdad.*
    - *Me arrepiento de + haber + participle*: *Me arrepiento de haber vendido el piso.*
    - *Tendría que / debería haber + participle*: *Tendría que haber estudiado más.*
    - *Si hubiera… / de haber…* alone, as a sigh: *Si lo hubiera sabido…*
  examples:
    - { es: "Ojalá hubiéramos reservado antes.", en: "I wish we had booked earlier." }
    - { es: "Me arrepiento de no haberla llamado.", en: "I regret not calling her." }
  drills:
    - { es: "Debería haber escuchado a mi madre.", en: "I should have listened to my mother." }
    - { es: "Ojalá pudiera volver atrás.", en: "I wish I could go back." }
- id: g.deber-haber
  level: b2
  title: "Deber haber, poder haber, tener que haber — modals in the past"
  summary: "Deberías haber venido. Podrías habérmelo dicho. Tenía que haber llamado."
  explanation: |
    Modal verb + *haber* + participle looks back at what should, could or must have happened:
    - *deber(ía) haber + participle* — should have: *Deberías haber llamado.*
    - *podría haber + participle* — could have: *Podrías haber avisado.*
    - *tenía que haber + participle* — ought to have: *Tenías que haberlo dicho.*
    - *debe de haber + participle* — must have (probability): *Debe de haber salido.*
    Pronouns attach to *haber*: *habérmelo dicho.*
  examples:
    - { es: "No deberías haber comido tanto.", en: "You shouldn't have eaten so much." }
    - { es: "Podríamos haber ganado.", en: "We could have won." }
  drills:
    - { es: "Tendrías que haber visto su cara.", en: "You should have seen his face." }
    - { es: "Deben de haber llegado ya.", en: "They must have arrived by now." }
- id: g.aunque-indicative-subjunctive
  level: b2
  title: "Aunque + indicative or subjunctive"
  summary: "aunque + indicative = a known fact (although); aunque + subjunctive = hypothetical or not conceded (even if)."
  explanation: |
    - *Aunque llueve, voy a salir.* — Although it is raining (fact), I'm going out.
    - *Aunque llueva, voy a salir.* — Even if it rains (possible), I'm going out.
    - *Aunque lloviera, saldría.* — Even if it rained (unlikely).
    - *Aunque sea caro, lo compro.* — Even if it's expensive (I don't care whether it is).
    The subjunctive also signals that the speaker does not accept the information as relevant: *Aunque sea tu hermano, no tiene razón.*
  examples:
    - { es: "Aunque no tengo mucho tiempo, te ayudo.", en: "Although I don't have much time, I'll help you." }
    - { es: "Aunque no tengas tiempo, tienes que ir.", en: "Even if you don't have time, you have to go." }
  drills:
    - { es: "Aunque sea tarde, llámame.", en: "Even if it's late, call me." }
    - { es: "Aunque estudió mucho, no aprobó.", en: "Although he studied a lot, he didn't pass." }
- id: g.por-mucho-que
  level: b2
  title: "Por mucho que, por más que, digan lo que digan"
  summary: "Concessive intensifiers with the subjunctive: por mucho que trabajes, hagas lo que hagas."
  explanation: |
    - *por mucho / más / muy + adjective + que + subjunctive*: *Por mucho que trabajes, no acabarás hoy. Por muy caro que sea, lo quiero.*
    - *verb + lo que + same verb (subjunctive)*: *Digan lo que digan, yo voy. Pase lo que pase. Sea como sea. Cueste lo que cueste.*
    - *y eso que* + indicative (informal, and that despite): *Llegó tarde, y eso que vive al lado.*
    - *si bien* + indicative (formal, while/although).
  examples:
    - { es: "Por mucho que insistas, no voy a cambiar de opinión.", en: "However much you insist, I'm not going to change my mind." }
    - { es: "Pase lo que pase, estaré a tu lado.", en: "Whatever happens, I'll be by your side." }
  drills:
    - { es: "Por muy cansado que estés, tienes que terminar.", en: "However tired you are, you have to finish." }
    - { es: "Haga lo que haga, nunca está contento.", en: "Whatever he does, he's never happy." }
- id: g.a-pesar-de
  level: b2
  title: "A pesar de, pese a, sin embargo, no obstante, aun así"
  summary: "Concession with nouns, infinitives and clauses; formal adversatives."
  explanation: |
    - *a pesar de / pese a + noun or infinitive*: *A pesar del frío, salimos. Pese a estar enfermo, trabajó.*
    - *a pesar de que / pese a que + indicative (fact) or subjunctive (hypothesis)*
    - *sin embargo, no obstante, ahora bien* — however (formal, between commas)
    - *aun así, así y todo, con todo* — even so
    - *de todas formas / de todos modos / en cualquier caso* — anyway
    - *aun* (even, no accent) vs *aún* (still, accent): *aun los expertos se equivocan*.
  examples:
    - { es: "A pesar de que llovía, el estadio estaba lleno.", en: "Although it was raining, the stadium was full." }
    - { es: "Estaba agotado; aun así, terminó la carrera.", en: "He was exhausted; even so, he finished the race." }
  drills:
    - { es: "Pese a los problemas, el proyecto salió bien.", en: "Despite the problems, the project went well." }
    - { es: "No obstante, hay que tener cuidado.", en: "Nevertheless, one must be careful." }
- id: g.temporal-clauses-advanced
  level: b2
  title: "Advanced time clauses — mientras, siempre que, a medida que, nada más"
  summary: "Mood choice in time clauses depends on whether the time is past/habitual (indicative) or future (subjunctive)."
  explanation: |
    | link | meaning | future → subjunctive |
    |---|---|---|
    | *mientras* | while / as long as | *Mientras vivas aquí, obedeces.* |
    | *siempre que / cada vez que* | whenever | *Siempre que vengas, avísame.* |
    | *a medida que / conforme* | as (progressively) | *A medida que crezcan…* |
    | *tan pronto como / en cuanto / apenas* | as soon as | *En cuanto llegue…* |
    | *desde que* | since | indicative: *Desde que vive aquí…* |
    | *hasta que* | until | *Hasta que no termines…* |
    | *una vez que* | once | *Una vez que firmen…* |
    | *al + infinitive / nada más + infinitive* | on / as soon as | *Nada más llegar, llamó.* |
  examples:
    - { es: "A medida que pasaba el tiempo, nos entendíamos mejor.", en: "As time passed, we understood each other better." }
    - { es: "Mientras tengas salud, lo demás no importa.", en: "As long as you have your health, the rest doesn't matter." }
  drills:
    - { es: "Conforme vayan llegando, que se sienten.", en: "As they arrive, have them sit down." }
    - { es: "Desde que dejó de fumar, respira mejor.", en: "Since he stopped smoking, he breathes better." }
- id: g.purpose-clauses-advanced
  level: b2
  title: "Purpose and consequence — a fin de que, de modo que, tan … que, por lo que"
  summary: "Purpose with subjunctive; consequence with indicative; de modo que takes either depending on meaning."
  explanation: |
    - **Purpose (subjunctive)**: *para que, a fin de que, con el fin de que, con objeto de que, de modo que* (so that, intended): *Lo explicó despacio de modo que todos lo entendieran.*
    - **Consequence (indicative)**: *de modo que, de manera que, así que, por lo que, por lo tanto, con lo que*: *Explicó despacio, de modo que todos lo entendieron.*
    - **Intensity + consequence**: *tan … que, tanto … que, tal … que*: *Hacía tal frío que se congeló el lago.*
    - **a + infinitive** after movement verbs: *Vino a verme.*
  examples:
    - { es: "Habló alto a fin de que lo oyeran desde el fondo.", en: "He spoke loudly so that they could hear him from the back." }
    - { es: "Llegó tarde, por lo que perdió la reunión.", en: "He arrived late, so he missed the meeting." }
  drills:
    - { es: "Comió tanto que se puso enfermo.", en: "He ate so much that he got sick." }
    - { es: "Te lo repito para que no se te olvide.", en: "I'm repeating it so you don't forget." }
- id: g.hasta-que
  level: b2
  title: "Hasta que, hasta que no, mientras no"
  summary: "Hasta que + indicative (past) / subjunctive (future). The redundant 'no' in 'hasta que no' is common in Spain."
  explanation: |
    - Past / fact: *Esperé hasta que llegó.*
    - Future: *Esperaré hasta que llegue.*
    - Redundant negation after a negative main clause: *No me voy hasta que (no) me pagues.* — the *no* adds nothing.
    - *mientras no + subjunctive* = as long as … not: *Mientras no firmes, no hay contrato.*
    - *hasta + infinitive / noun*: *Trabajó hasta caer rendido. Hasta las diez.*
  examples:
    - { es: "No saldrás hasta que no termines los deberes.", en: "You won't go out until you finish your homework." }
    - { es: "Se quedó hasta que cerraron el bar.", en: "He stayed until they closed the bar." }
  drills:
    - { es: "Esperaremos hasta que deje de llover.", en: "We'll wait until it stops raining." }
    - { es: "Mientras no cambies, nada mejorará.", en: "As long as you don't change, nothing will improve." }
- id: g.reported-speech-subjunctive
  level: b2
  title: "Reporting wishes, doubts and commands in the past"
  summary: "Present subjunctive → imperfect subjunctive; perfect subjunctive → pluperfect subjunctive."
  explanation: |
    | direct | reported (past) |
    |---|---|
    | *"Quiero que vengas."* | *Dijo que quería que viniera.* |
    | *"Espero que hayas comido."* | *Dijo que esperaba que hubiera comido.* |
    | *"No creo que sea verdad."* | *Dijo que no creía que fuera verdad.* |
    | *"Ojalá llueva."* | *Dijo que ojalá lloviera.* |
    | *"Ven."* | *Me dijo que viniera. / Me pidió que fuera.* |

    Remember *venir → ir* and *traer → llevar* often swap when the point of view moves.
  examples:
    - { es: "Me aconsejó que no comprara ese coche.", en: "He advised me not to buy that car." }
    - { es: "Nos dijeron que esperáramos fuera.", en: "They told us to wait outside." }
  drills:
    - { es: "Pidió que le trajeran la cuenta.", en: "He asked them to bring him the bill." }
    - { es: "Dudaba que hubiéramos entendido.", en: "She doubted we had understood." }
- id: g.reported-commands
  level: b2
  title: "Reporting commands and requests — pedir, ordenar, rogar, prohibir, aconsejar"
  summary: "verb + que + subjunctive (present or imperfect); or verb + infinitive with pedir/ordenar/prohibir + pronoun."
  explanation: |
    - *Me pidió que le ayudara. Nos ordenaron que saliéramos. Le rogó que se quedara. Les prohibieron que fumaran.*
    - With a pronoun, the infinitive is also possible: *Me pidió ayudarle* (less common), *Nos prohibieron fumar*, *Le aconsejo esperar.*
    - *mandar / hacer + infinitive*: *Nos hizo esperar. Mandó callar.*
    - *que + subjunctive* alone transmits a command: *Dice que vengas. Que no se olviden.*
  examples:
    - { es: "El médico le prohibió que bebiera alcohol.", en: "The doctor forbade him to drink alcohol." }
    - { es: "La profesora nos mandó que leyéramos el capítulo tres.", en: "The teacher told us to read chapter three." }
  drills:
    - { es: "Me rogó que no se lo dijera a nadie.", en: "He begged me not to tell anyone." }
    - { es: "Les aconsejé que fueran en tren.", en: "I advised them to go by train." }
- id: g.passive-advanced
  level: b2
  title: "Passive and impersonal structures in formal Spanish"
  summary: "ser + participle, estar + participle, se pasiva refleja, impersonal third plural, agent with por / de."
  explanation: |
    - *ser + participle + por*: *El informe fue elaborado por el comité.* (process)
    - *estar + participle*: *El informe está terminado.* (state)
    - *se + verb* (pasiva refleja): *Se elaboraron tres informes.* — agent omitted, verb agrees.
    - Impersonal *se* with people: *Se contrató a dos ingenieros.* (singular verb + personal *a*)
    - Third person plural: *Han subido los impuestos.*
    - *de* instead of *por* with emotions and knowledge: *conocido de todos, acompañado de su mujer.*
    - Avoid piling passives; Spanish prefers active or *se* in most registers.
  examples:
    - { es: "La ley ha sido aprobada por el parlamento.", en: "The law has been passed by parliament." }
    - { es: "Se ha detenido a los sospechosos.", en: "The suspects have been arrested." }
  drills:
    - { es: "El edificio será restaurado el próximo año.", en: "The building will be restored next year." }
    - { es: "Se necesita personal cualificado.", en: "Qualified staff needed." }
- id: g.impersonal-expressions
  level: b2
  title: "Impersonal expressions and generic subjects"
  summary: "hay que, se puede, uno, la gente, cualquiera, tú genérico, resulta que, hace falta, basta con."
  explanation: |
    - *hay que, es necesario, hace falta (que), basta con + infinitive / noun* — *Basta con llamar.*
    - *se + 3rd person*: *se dice, se sabe, se supone que*
    - *uno / una*: *Uno nunca sabe lo que puede pasar.*
    - *tú* generic in speech: *Llegas a casa y no tienes ganas de nada.*
    - *cualquiera*: *Cualquiera lo entendería.*
    - *resulta que, sucede que, ocurre que* — it turns out that
    - Weather and time: *hace, llueve, amanece, anochece, es tarde.*
  examples:
    - { es: "Se supone que la reunión empieza a las diez.", en: "The meeting is supposed to start at ten." }
    - { es: "Resulta que era su primo.", en: "It turns out he was her cousin." }
  drills:
    - { es: "Hace falta más paciencia.", en: "More patience is needed." }
    - { es: "Uno se cansa de esperar.", en: "One gets tired of waiting." }
- id: g.nominalization
  level: b2
  title: "Nominalisation — el hecho de que, lo + adjective, el que + verb"
  summary: "Turning actions and qualities into nouns for formal, compact text."
  explanation: |
    - *lo + adjective*: *lo importante, lo difícil, lo bueno de vivir aquí* — the important thing…
    - *lo + adverb / clause*: *lo bien que canta, lo que dijo*
    - *el hecho de que + subjunctive* (usually): *El hecho de que no viniera me preocupa.*
    - *el que + subjunctive* as subject: *El que llegues tarde no ayuda.*
    - *-ción, -miento, -ida, -aje, -ura* nouns from verbs: *la llegada, el crecimiento, la lectura, el aprendizaje*
    - *al + infinitive* for time: *al salir del trabajo*
  examples:
    - { es: "Lo malo es que no tenemos tiempo.", en: "The bad thing is that we don't have time." }
    - { es: "Me sorprende lo rápido que aprendes.", en: "I'm surprised how fast you learn." }
  drills:
    - { es: "El hecho de que lo sepa no cambia nada.", en: "The fact that he knows doesn't change anything." }
    - { es: "La subida de precios preocupa a todos.", en: "The rise in prices worries everyone." }
- id: g.periphrases-aspect
  level: b2
  title: "Aspectual periphrases — ir, venir, andar, llevar, quedar + gerund / participle"
  summary: "Nuances of gradual change, accumulation, continuation and result."
  explanation: |
    | phrase | nuance | example |
    |---|---|---|
    | *ir + gerund* | gradually, step by step | *Vamos avanzando.* |
    | *venir + gerund* | has been going on up to now | *Viene diciéndolo desde hace años.* |
    | *andar + gerund* | repeatedly, often negative | *Anda buscando trabajo.* |
    | *llevar + gerund* | duration | *Lleva horas estudiando.* |
    | *seguir / continuar + gerund* | continuation | *Sigue trabajando allí.* |
    | *acabar / terminar + gerund* | end up doing | *Acabó aceptando.* |
    | *llevar + participle* | accumulated result | *Llevo escritas diez páginas.* |
    | *quedar(se) + participle* | resulting state | *Se quedó dormido. Quedó claro.* |
    | *tener + participle* | task done | *Tengo preparada la cena.* |
    | *dejar + participle* | leave in a state | *Dejó la puerta abierta.* |
  examples:
    - { es: "Poco a poco fue aprendiendo el oficio.", en: "Little by little he learned the trade." }
    - { es: "Al final acabamos cenando en casa.", en: "In the end we ended up eating at home." }
  drills:
    - { es: "Llevamos recorridos doscientos kilómetros.", en: "We have covered two hundred kilometres so far." }
    - { es: "Me quedé sorprendido con la noticia.", en: "I was left surprised by the news." }
- id: g.periphrases-modal
  level: b2
  title: "Modal periphrases — deber, haber de, tener que, poder, soler, estar por, venir a"
  summary: "Obligation, probability, possibility and approximation through verb phrases."
  explanation: |
    - *haber de + infinitive* — obligation / destiny (formal, Catalonia): *Has de saber que…*
    - *haber que* (impersonal) — *Hay que…*
    - *deber (de)* — duty / probability
    - *tener que* — necessity / strong deduction
    - *poder* — possibility, permission; *puede que* + subjunctive
    - *soler* — habit
    - *estar por + infinitive* — be about to / in favour of: *Estoy por irme.*
    - *venir a + infinitive* — approximately: *Viene a costar mil euros.*
    - *llegar a + infinitive* — go as far as, manage to: *Llegó a ser presidente.*
    - *dar por + participle* — consider: *Doy por terminada la reunión.*
  examples:
    - { es: "Has de tener paciencia con los niños.", en: "You must be patient with children." }
    - { es: "La obra viene a durar dos horas.", en: "The play lasts about two hours." }
  drills:
    - { es: "Llegó a trabajar dieciséis horas al día.", en: "He got to the point of working sixteen hours a day." }
    - { es: "Damos por hecho que vendrá.", en: "We take it for granted that he'll come." }
- id: g.ir-venir-andar-gerund
  level: b2
  title: "Ir, venir and andar + gerund — direction of a process"
  summary: "ir + gerund looks forward (gradual), venir + gerund looks back (accumulated), andar + gerund wanders (repeated)."
  explanation: |
    - *ir + gerund*: a process unfolding step by step toward the future — *Ve preparando la cena. Los precios van subiendo.*
    - *venir + gerund*: a process that started in the past and continues to the present — *Vengo observando cambios desde enero.*
    - *andar + gerund*: a repeated, somewhat aimless activity, often with mild criticism — *Anda contando mentiras. Ando buscando piso.*
    - Compare: *Voy entendiendo* (I'm starting to understand) / *Vengo entendiendo* (I have been understanding for a while).
  examples:
    - { es: "Id sentándoos, que empezamos ya.", en: "Start sitting down, we're beginning now." }
    - { es: "Venimos advirtiendo del problema desde hace meses.", en: "We have been warning about the problem for months." }
  drills:
    - { es: "Anda diciendo que se va a casar.", en: "He's going around saying he's going to get married." }
    - { es: "Poco a poco vamos mejorando.", en: "Little by little we're improving." }
- id: g.collocations
  level: b2
  title: "Collocations — words that go together"
  summary: "tomar una decisión, hacer una pregunta, dar un paseo, echar de menos, prestar atención, tener lugar."
  explanation: |
    Natural Spanish depends on fixed verb + noun pairs that often differ from English:
    - **hacer**: hacer una pregunta, hacer un favor, hacer caso, hacer cola, hacer daño, hacer falta, hacer la compra, hacerse tarde
    - **dar**: dar un paseo, dar una vuelta, dar la vuelta, dar las gracias, dar miedo / asco / pena / vergüenza, darse cuenta, dar igual, dar a luz
    - **tomar**: tomar una decisión, tomar nota, tomar el sol, tomar el pelo (tease), tomar en serio
    - **echar**: echar de menos, echar una mano, echar un vistazo, echar a perder, echarse a reír
    - **tener**: tener lugar, tener en cuenta, tener ganas de, tener que ver con, tener éxito
    - **poner**: poner la mesa, poner en marcha, ponerse de acuerdo, ponerse a, poner una multa
    - **llevar / traer**: llevar a cabo, llevarse bien, traer consecuencias
    - **sacar**: sacar buenas notas, sacar fotos, sacar entradas, sacar conclusiones
  examples:
    - { es: "Tenemos que tomar una decisión antes del viernes.", en: "We have to make a decision before Friday." }
    - { es: "Echo mucho de menos a mi familia.", en: "I miss my family a lot." }
  drills:
    - { es: "La reunión tendrá lugar en la sala grande.", en: "The meeting will take place in the big room." }
    - { es: "No le hagas caso, te está tomando el pelo.", en: "Don't pay attention to him, he's pulling your leg." }
- id: g.register-formal-informal
  level: b2
  title: "Register — colloquial, neutral and formal Spanish"
  summary: "Choosing vocabulary, forms of address and structures for the situation."
  explanation: |
    | colloquial | neutral | formal |
    |---|---|---|
    | *¡Qué pasa, tío!* | *Hola, ¿qué tal?* | *Buenos días, ¿cómo está usted?* |
    | *currar, curro* | *trabajar, trabajo* | *desempeñar un cargo, ocupación* |
    | *guay, chulo, mola* | *bueno, bonito, me gusta* | *excelente, adecuado, resulta de mi agrado* |
    | *pasta, pavos* | *dinero, euros* | *importe, cantidad* |
    | *un montón de* | *muchos* | *numerosos, una gran cantidad de* |
    | *o sea, bueno, pues* | *es decir, entonces* | *esto es, por consiguiente* |
    | *te lo digo yo* | *creo que* | *considero que, a mi juicio* |

    Markers of formality: *usted*, full sentences, Latin-based vocabulary (*efectuar, adquirir, solicitar*), passive and *se* constructions, no diminutives or fillers. Markers of colloquial speech: *tú*, fillers (*bueno, pues, o sea, en plan*), diminutives, exaggeration, slang.
  examples:
    - { es: "Le ruego que disculpe las molestias ocasionadas.", en: "I ask you to excuse the inconvenience caused." }
    - { es: "Perdona el rollo, tío.", en: "Sorry for the hassle, mate." }
  drills:
    - { es: "Solicito que se me informe por escrito.", en: "I request to be informed in writing." }
    - { es: "Oye, ¿me echas una mano con esto?", en: "Hey, can you give me a hand with this?" }
- id: g.diminutives-augmentatives
  level: b2
  title: "Diminutives and augmentatives — -ito, -illo, -azo, -ón, -ucho"
  summary: "Suffixes add size, affection, irony or contempt: cafecito, pueblecito, golpazo, casona, feúcho."
  explanation: |
    - **-ito/-ita** (the most common, affection/smallness): *un momentito, la casita, ahorita (LatAm), despacito.* Spelling: *-cito* after -n/-r/-e (*cafecito, florecita*), *-ecito* with one-syllable words (*pancito, solecito*).
    - **-illo/-illa**: smaller or slightly dismissive, lexicalised in Spain: *un problemilla, chiquillo, ventanilla, bolsillo* (pocket).
    - **-ico** (Aragón, Murcia, Colombia), **-ín/-ino** (Asturias), **-uco** (Cantabria), **-ete** (*amiguete*).
    - **-azo/-aza**: big or a blow: *un cochazo, un golpazo, un portazo, un exitazo.*
    - **-ón/-ona**: big: *una casona, un hombretón, un cabezón* (stubborn).
    - **-ote/-ota**: big and clumsy: *grandote, palabrota* (swear word).
    - **-ucho/-ucha, -ejo, -astro**: contempt: *casucha, feúcho, hotelucho, politicastro.*
  examples:
    - { es: "Espera un momentito, ahora mismo voy.", en: "Wait just a moment, I'm coming right now." }
    - { es: "Se compró un cochazo que cuesta una fortuna.", en: "He bought himself a huge car that costs a fortune." }
  drills:
    - { es: "Dame un besito.", en: "Give me a little kiss." }
    - { es: "Es un pueblecito precioso en la montaña.", en: "It's a lovely little village in the mountains." }
- id: g.argumentation-connectors
  level: b2
  title: "Arguing a point — connectors for essays and debates"
  summary: "Introducing, supporting, contrasting, conceding, concluding."
  explanation: |
    - **Introducing the topic**: *En la actualidad, hoy en día, se suele decir que, es bien sabido que, el debate sobre…*
    - **Giving arguments**: *en primer lugar, por una parte … por otra, cabe destacar que, hay que tener en cuenta que, no cabe duda de que*
    - **Supporting**: *de hecho, en efecto, es más, prueba de ello es que, según los expertos*
    - **Exemplifying**: *por ejemplo, como es el caso de, tal es el caso de, basta con observar*
    - **Conceding**: *es cierto que …, sin embargo; aunque es verdad que …; si bien …*
    - **Contrasting**: *en cambio, por el contrario, no obstante, ahora bien*
    - **Concluding**: *en conclusión, en definitiva, en suma, a fin de cuentas, por todo ello, dicho esto*
  examples:
    - { es: "Es cierto que el transporte público es más barato; no obstante, no llega a todos los barrios.", en: "It's true that public transport is cheaper; nevertheless, it doesn't reach every neighbourhood." }
    - { es: "Por todo ello, considero que la medida es acertada.", en: "For all these reasons, I consider the measure to be right." }
  drills:
    - { es: "Cabe destacar que los datos son de 2020.", en: "It should be noted that the data are from 2020." }
    - { es: "En definitiva, se trata de una cuestión de prioridades.", en: "Ultimately, it's a question of priorities." }
- id: g.opinion-structures
  level: b2
  title: "Nuanced opinion — a mi juicio, me da la impresión de que, no es que… sino que"
  summary: "Hedging, emphasising and rebutting with mood control."
  explanation: |
    - **Hedging**: *me da la impresión de que, tengo la sensación de que, diría que, me inclino a pensar que, si no me equivoco* (+ indicative)
    - **Strong**: *estoy convencido de que, no cabe duda de que, es evidente que* (+ indicative)
    - **Rebutting**: *no es que + subjunctive, sino que + indicative*: *No es que no quiera, sino que no puedo.*
    - **Disagreeing politely**: *entiendo tu punto de vista, pero…; no lo veo así; discrepo; no estoy del todo de acuerdo*
    - **Agreeing**: *coincido contigo, comparto tu opinión, desde luego, sin duda, eso es*
    - **Qualifying**: *hasta cierto punto, en cierto modo, en parte, depende de*
  examples:
    - { es: "Me da la impresión de que no han entendido el problema.", en: "I get the impression they haven't understood the problem." }
    - { es: "No es que sea caro, sino que no lo necesitamos.", en: "It's not that it's expensive, it's that we don't need it." }
  drills:
    - { es: "Hasta cierto punto tienes razón.", en: "Up to a point you're right." }
    - { es: "Estoy convencida de que saldrá bien.", en: "I'm convinced it will turn out well." }
- id: g.essay-structure
  level: b2
  title: "Structuring an argumentative essay or opinion article"
  summary: "Introduction with thesis; two or three developed paragraphs; concession; conclusion. 200-250 words at B2."
  explanation: |
    1. **Título** — short and informative.
    2. **Introducción**: present the topic and your thesis. *En los últimos años, el teletrabajo se ha convertido en… En este artículo defenderé que…*
    3. **Desarrollo**: one idea per paragraph, each with a connector, an argument and an example. *En primer lugar… Además… Por otra parte…*
    4. **Concesión**: acknowledge the other side then rebut. *Es cierto que…, sin embargo…*
    5. **Conclusión**: restate the thesis with a consequence or recommendation. *En conclusión… Por ello sería conveniente que…*

    Style: *usted/impersonal*, present tense for general truths, varied connectors, no contractions, careful punctuation (¿ ¡, no comma between subject and verb), cohesive referents (*este, dicho, el mismo, ello*).
  examples:
    - { es: "En conclusión, aunque el teletrabajo presenta desventajas, sus beneficios para la conciliación familiar son innegables.", en: "In conclusion, although remote work has disadvantages, its benefits for work-life balance are undeniable." }
    - { es: "Dicho esto, conviene matizar la propuesta.", en: "That said, the proposal needs qualifying." }
  drills:
    - { es: "En este artículo analizaré las causas del problema.", en: "In this article I will analyse the causes of the problem." }
    - { es: "Por ello, sería conveniente invertir más en educación.", en: "Therefore, it would be advisable to invest more in education." }
- id: g.pronoun-redundancy
  level: b2
  title: "Redundant pronouns — a mí me gusta, el libro lo tengo yo"
  summary: "Spanish repeats indirect objects and fronted direct objects with a pronoun; a mí / a ti add emphasis or contrast."
  explanation: |
    - **Indirect object doubling** is normal, often obligatory: *Le di el libro a Juan. A mi madre le encanta bailar.*
    - **Fronted direct object** requires the pronoun: *El coche lo compré en 2019. A tus padres los vi ayer.*
    - **Emphatic / contrastive forms**: *a mí, a ti, a él/ella/usted, a nosotros, a vosotros, a ellos* — *A mí me gusta, pero a él no.*
    - **Prepositional forms**: *conmigo, contigo, consigo; para mí, sin ti, de él.*
    - *mí* and *ti* only after prepositions (*ti* never has an accent).
  examples:
    - { es: "A nosotros nos parece una buena idea.", en: "To us it seems a good idea." }
    - { es: "Las llaves las tiene Marta.", en: "Marta has the keys." }
  drills:
    - { es: "A ti te lo dije ayer.", en: "I told you yesterday." }
    - { es: "Esa película ya la he visto.", en: "I've already seen that film." }
- id: g.emphatic-structures
  level: b2
  title: "Emphasis — es que, lo que pasa es que, fue él quien, sí que"
  summary: "Cleft sentences and intensifiers used constantly in spoken Spanish."
  explanation: |
    - *es que* — justification / softening: *Es que no tengo tiempo.*
    - *lo que pasa es que* — the thing is: *Lo que pasa es que llegó tarde.*
    - Cleft: *Fue Juan quien lo dijo. Es aquí donde vivo. Fue entonces cuando lo supe. Lo que quiero es dormir.*
    - *sí que* — emphatic yes: *Eso sí que es un problema.*
    - *¡qué + noun + tan / más + adjective!*: *¡Qué casa tan bonita!*
    - *mismo* for emphasis: *yo mismo, hoy mismo, aquí mismo*
    - Repetition: *Está feliz, feliz.* Intensifying prefixes: *súper, re-* (*rebueno*), *-ísimo*.
  examples:
    - { es: "No es que no quiera ir, es que no puedo.", en: "It's not that I don't want to go, it's that I can't." }
    - { es: "Fue mi hermana quien me lo contó.", en: "It was my sister who told me." }
  drills:
    - { es: "Eso sí que no me lo esperaba.", en: "That I really wasn't expecting." }
    - { es: "Lo que necesito es un descanso.", en: "What I need is a break." }
- id: g.neutral-lo
  level: b2
  title: "The neuter lo — lo bueno, lo de, lo que, lo + adverb"
  summary: "lo turns adjectives, adverbs and clauses into abstract nouns; lo de refers to 'the matter of'."
  explanation: |
    - *lo + adjective* — the … thing / what is …: *lo mejor, lo peor, lo importante, lo español*
    - *lo + adjective/adverb + que* — how …: *No sabes lo difícil que es. Mira lo bien que escribe.*
    - *lo de* — the matter of / that business about: *¿Qué pasó con lo de tu trabajo? Lo de ayer fue increíble.*
    - *lo que* — what / the thing that: *Haz lo que quieras.*
    - *lo* as a predicate pronoun: *¿Estás cansado? — Sí, lo estoy. Parece fácil, pero no lo es.*
    - *a lo + noun*: *a lo grande, a lo loco* (in a … way)
  examples:
    - { es: "Lo bueno de vivir aquí es el clima.", en: "The good thing about living here is the climate." }
    - { es: "No te imaginas lo caro que está todo.", en: "You can't imagine how expensive everything is." }
  drills:
    - { es: "¿Ya has resuelto lo del banco?", en: "Have you sorted out that thing with the bank yet?" }
    - { es: "Dicen que es listo, y lo es.", en: "They say he's clever, and he is." }
- id: g.varieties-overview
  level: b2
  title: "The Spanish-speaking world — main varieties"
  summary: "Pronunciation, pronouns and vocabulary differences between Spain, Mexico, the Caribbean, the Andes and the Río de la Plata."
  explanation: |
    Spanish has about 500 million native speakers in 21 countries. Everyone understands everyone, but notice:
    - **Pronunciation**: *distinción* (c/z = /θ/) only in central and northern Spain; *seseo* elsewhere. *Yeísmo* nearly universal; *ll/y* as /ʃ/ in Buenos Aires (*sheísmo*). Aspiration or loss of final -s in Andalusia, the Caribbean and the Río de la Plata (*lo' libro'*). Weak intervocalic -d- in Spain (*cansao*).
    - **Pronouns**: *vosotros* only in Spain; *ustedes* everywhere else; *vos* in Argentina, Uruguay, Paraguay, Central America (see *voseo*); *usted* among friends in Bogotá and Costa Rica; *leísmo* in Spain.
    - **Tenses**: present perfect for recent past in Spain, preterite in most of America.
    - **Vocabulary**: *coche / carro / auto; ordenador / computadora; móvil / celular; zumo / jugo; patata / papa; autobús / camión (Mex) / guagua (Cuba, Canarias) / colectivo (Arg); piso / departamento; vale / dale / okey.*
    - **Diminutives and politeness**: *ahorita, un momentito, ¿mande?* (Mexico).
  examples:
    - { es: "En México se dice carro y celular; en España, coche y móvil.", en: "In Mexico they say carro and celular; in Spain, coche and móvil." }
    - { es: "¿Vos querés un café? — Che, dale.", en: "Do you want a coffee? — Sure, go on. (Argentina)" }
  drills:
    - { es: "Ustedes tienen que firmar aquí.", en: "You (all) have to sign here." }
    - { es: "Tomamos la guagua hasta el centro.", en: "We took the bus to the centre. (Canaries / Cuba)" }
- id: g.voseo
  level: b2
  title: "Voseo — vos sos, vos tenés, vení"
  summary: "In Argentina, Uruguay, Paraguay and much of Central America vos replaces tú, with its own verb forms."
  explanation: |
    | | tú (Spain) | vos (Río de la Plata) |
    |---|---|---|
    | ser | eres | **sos** |
    | hablar | hablas | **hablás** |
    | tener | tienes | **tenés** |
    | vivir | vives | **vivís** |
    | querer | quieres | **querés** |
    | imperative | habla, ven, ten | **hablá, vení, tené** |

    - No stem change (*tenés, querés, podés*).
    - Object pronoun stays *te*; possessive *tu*: *Vos te acostás tarde con tu hermano.*
    - Subjunctive and other tenses are the same as *tú* (*que tengas*) in standard usage.
    - Chile has a mixed system (*tú tenís*, colloquial). Central America alternates *vos / usted*.
  examples:
    - { es: "¿Vos de dónde sos? — Soy de Montevideo.", en: "Where are you from? — I'm from Montevideo." }
    - { es: "Vení, sentate acá y contame.", en: "Come, sit here and tell me." }
  drills:
    - { es: "¿Tenés tiempo mañana?", en: "Do you have time tomorrow?" }
    - { es: "Decime la verdad.", en: "Tell me the truth." }
- id: g.ustedes-vs-vosotros
  level: b2
  title: "Ustedes or vosotros — adapting your plural 'you'"
  summary: "Spain: vosotros informal / ustedes formal. Americas and Canaries: ustedes for everyone, with 3rd-person verbs and pronouns."
  explanation: |
    - Spain: *¿Vosotros venís? Os espero. Vuestra casa.* / formal: *¿Ustedes vienen? Los espero. Su casa.*
    - Latin America, Canaries, parts of Andalusia: *¿Ustedes vienen? Los/les espero. Su casa.* — for friends and strangers alike.
    - Switching: change the verb (-áis → -an, -éis → -en, -ís → -en), the object pronoun (*os → los/las/les*), the reflexive (*os → se*) and the possessive (*vuestro → su*).
    - Imperative: *venid → vengan; sentaos → siéntense.*
  examples:
    - { es: "Niños, lavaos las manos. (España) — Niños, lávense las manos. (América)", en: "Children, wash your hands." }
    - { es: "¿Habéis terminado? — ¿Han terminado?", en: "Have you (all) finished?" }
  drills:
    - { es: "¿Ustedes quieren algo de beber?", en: "Do you (all) want something to drink?" }
    - { es: "Vosotros ya lo sabíais.", en: "You (all) already knew." }
- id: g.b2-review
  level: b2
  title: "B2 review — the full tense and mood system"
  summary: "Indicative: 10 tenses. Subjunctive: present, perfect, imperfect, pluperfect. Conditions, concessions, reported speech."
  explanation: |
    ### Mood in subordinate clauses
    - **Indicative**: facts, certainty, affirmed opinion, past/habitual time, known antecedent.
    - **Subjunctive**: wish, emotion, judgement, doubt, purpose, future time, unknown antecedent, *aunque* as 'even if', *como si*, negative commands.

    ### Conditions
    | type | si-clause | result |
    |---|---|---|
    | real | present | present / future / imperative |
    | unreal present | imperfect subjunctive | conditional |
    | unreal past | pluperfect subjunctive | conditional perfect / pluperfect subjunctive |

    ### Reported speech in the past
    present → imperfect · preterite/perfect → pluperfect · future → conditional · present subjunctive → imperfect subjunctive · imperative → imperfect subjunctive.

    ### Register
    Colloquial markers vs formal structures; *usted* / *ustedes*; passive *se*; connectors.
  examples:
    - { es: "Si me hubieras avisado de que venías, habría preparado algo, aunque fuera sencillo.", en: "If you had let me know you were coming, I would have prepared something, even if it was simple." }
    - { es: "Me dijo que no creía que lo hubieran hecho a propósito.", en: "He told me he didn't think they had done it on purpose." }
  drills:
    - { es: "Por mucho que lo intentes, no lo conseguirás sin ayuda.", en: "However hard you try, you won't manage it without help." }
    - { es: "Habría que haber pensado en eso antes.", en: "That should have been thought of before." }
