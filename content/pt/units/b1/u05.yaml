id: b1.u05
title: Quando você vier
lessons:
  - id: b1.u05.l1
    title: Quando eu tiver tempo
    teach: [g.future-subjunctive-forms]
    vocab: [w.planejar, w.planejamento, w.organizar, w.prazo, w.confirmar, w.cancelar, w.adiar, w.remarcar, w.agenda, w.compromisso, w.arrumar-as-malas, w.definir, w.básico, w.profeta]
    tip: "Take the eles preterite and drop -ram: fizeram → fizer, tiveram → tiver, vieram → vier. Quando você vier = when you come; se você vir = if you see."
    sentences:
      - { es: "Quando você vier a Congonhas, me avisa.", en: "When you come to Congonhas, let me know.", altEs: ["Quando você vier para Congonhas, me avisa.", "Quando você vier a Congonhas, me avise."], grammar: [g.future-subjunctive-forms, g.future-subjunctive-time], vocab: [], error: { wrong: "Quando você venha a Congonhas, me avisa.", explain: "Spanish 'cuando vengas' is quando você vier: the future subjunctive, not the present subjunctive.", grammar: g.future-subjunctive-forms } }
      - { es: "Se eu puder, vou ao Jubileu em setembro.", en: "If I can, I'll go to the Jubilee in September.", altEs: ["Se eu puder, eu vou ao Jubileu em setembro."], grammar: [g.future-subjunctive-forms, g.future-subjunctive-se], vocab: [], note: "The Jubileu do Senhor Bom Jesus brings pilgrims to Congonhas every September." }
      - { es: "Quando a gente fizer o planejamento, te mando o roteiro.", en: "When we've done the planning, I'll send you the itinerary.", altEs: ["Quando nós fizermos o planejamento, te mando o roteiro."], grammar: [g.future-subjunctive-forms], vocab: [w.planejamento], note: "fizer comes from the preterite fizeram." }
      - { es: "Se vocês quiserem, eu organizo tudo.", en: "If you want, I'll organise everything.", grammar: [g.future-subjunctive-forms, g.future-subjunctive-se], vocab: [w.organizar], transform: { instruction: "Change vocês to você", answer: "Se você quiser, eu organizo tudo.", alt: ["Se você quiser, organizo tudo."], en: "If you want, I'll organise everything." } }
      - { es: "Quando eles souberem a data, vão confirmar a reserva.", en: "When they know the date, they'll confirm the booking.", grammar: [g.future-subjunctive-forms], vocab: [w.confirmar] }
      - { es: "Se o tempo estiver ruim, a gente adia a viagem.", en: "If the weather's bad, we'll postpone the trip.", altEs: ["Se o tempo estiver ruim, nós adiamos a viagem."], grammar: [g.future-subjunctive-forms, g.future-subjunctive-se], vocab: [w.adiar] }
      - { es: "Se houver algum problema, a gente cancela.", en: "If there's any problem, we'll cancel.", grammar: [g.future-subjunctive-forms], vocab: [w.cancelar] }
      - { es: "Quando eu tiver a agenda do mês, a gente remarca o jantar.", en: "When I have this month's schedule, we'll reschedule the dinner.", grammar: [g.future-subjunctive-forms], vocab: [w.agenda, w.remarcar] }
      - { es: "Se eu não estiver aqui, deixa o pacote com o porteiro.", en: "If I'm not here, leave the parcel with the doorman.", altEs: ["Se eu não estiver aqui, deixe o pacote com o porteiro."], grammar: [g.future-subjunctive-forms], vocab: [] }
      - { es: "Quando você puder, me manda o prazo do projeto.", en: "When you can, send me the project deadline.", altEs: ["Quando você puder, me mande o prazo do projeto."], grammar: [g.future-subjunctive-forms], vocab: [w.prazo] }
      - { es: "Se a gente definir a data hoje, eu compro as passagens amanhã.", en: "If we decide on the date today, I'll buy the tickets tomorrow.", grammar: [g.future-subjunctive-forms], vocab: [w.definir] }
      - { es: "Quando você vir os profetas, vai entender por que Aleijadinho é tão famoso.", en: "When you see the prophets, you'll understand why Aleijadinho is so famous.", grammar: [g.future-subjunctive-forms], vocab: [w.profeta], note: "vir here is the future subjunctive of ver (viram → vir); of vir (to come) it is vier.", transform: { instruction: "Change você to vocês", answer: "Quando vocês virem os profetas, vão entender por que Aleijadinho é tão famoso.", en: "When you (all) see the prophets, you'll understand why Aleijadinho is so famous." } }
      - { es: "Se der, eu passo aí depois do compromisso.", en: "If I can, I'll drop by after my appointment.", grammar: [g.future-subjunctive-forms, g.future-subjunctive-se], vocab: [w.compromisso] }
      - { es: "Quando a gente for a Congonhas, vamos ver os doze profetas.", en: "When we go to Congonhas, we'll see the twelve prophets.", altEs: ["Quando nós formos a Congonhas, vamos ver os doze profetas."], grammar: [g.future-subjunctive-forms], vocab: [w.profeta] }
      - { es: "Arrumo as malas quando eu voltar do trabalho.", en: "I'll pack when I get back from work.", altEs: ["Vou arrumar as malas quando eu voltar do trabalho."], grammar: [g.future-subjunctive-forms, g.future-subjunctive-time], vocab: [w.arrumar-as-malas] }
      - { es: "Se você trouxer o básico, a gente compra o resto lá.", en: "If you bring the basics, we'll buy the rest there.", grammar: [g.future-subjunctive-forms], vocab: [w.básico, w.resto] }
    exchanges:
      - q: { es: "Quando você vem me visitar?", en: "When are you coming to visit me?" }
        a: { es: "Quando eu tiver férias, prometo!", en: "When I have some holiday, I promise!" }
        alt: ["Quando eu puder!", "No mês que vem, se der."]
        grammar: [g.future-subjunctive-forms]
        vocab: []
      - q: { es: "E se chover no dia do passeio?", en: "And what if it rains on the day of the trip?" }
        a: { es: "Se chover, a gente remarca.", en: "If it rains, we'll reschedule." }
        alt: ["Aí a gente adia.", "Se chover, a gente vai ao museu."]
        grammar: [g.future-subjunctive-se]
        vocab: [w.remarcar]
      - q: { es: "Você já confirmou o hotel?", en: "Have you confirmed the hotel yet?" }
        a: { es: "Ainda não. Confirmo quando eles responderem o e-mail.", en: "Not yet. I'll confirm when they answer the email." }
        alt: ["Já confirmei, sim.", "Ainda não."]
        grammar: [g.future-subjunctive-forms]
        vocab: [w.confirmar]
      - q: { es: "Posso levar alguma coisa?", en: "Can I bring anything?" }
        a: { es: "Se você quiser, traz um vinho.", en: "If you like, bring some wine." }
        alt: ["Não precisa nada!", "Se quiser, traz uma sobremesa."]
        grammar: [g.future-subjunctive-se]
        vocab: []
      - q: { es: "Você já arrumou as malas?", en: "Have you packed yet?" }
        a: { es: "Ainda não. Vou arrumar quando acabar a novela.", en: "Not yet. I'll pack when the soap opera's over." }
        alt: ["Já arrumei!", "Arrumo amanhã cedo."]
        grammar: [g.future-subjunctive-time]
        vocab: [w.arrumar-as-malas]
    texts:
      - title: "Mensagem para a Heloísa"
        es: ["Heloísa, quando você vier a Minas, fica aqui em casa!", "Se você quiser, a gente vai a Congonhas no domingo.", "Quando eu souber o horário do ônibus, te mando."]
        en: ["Heloísa, when you come to Minas, stay with me!", "If you like, we'll go to Congonhas on Sunday.", "When I know the bus times, I'll send them to you."]
        grammar: [g.future-subjunctive-forms]
        vocab: []
      - title: "Agenda da semana"
        es: ["Segunda: dentista, se não cancelarem de novo.", "Quarta: reunião, se o chefe não adiar.", "Sexta: cinema, se eu tiver energia!"]
        en: ["Monday: dentist, if they don't cancel again.", "Wednesday: meeting, if the boss doesn't postpone it.", "Friday: cinema, if I have the energy!"]
        grammar: [g.future-subjunctive-forms, g.future-subjunctive-se]
        vocab: [w.agenda, w.cancelar, w.adiar]
    spicy:
      - { es: "Quando você quiser, eu cancelo todos os meus compromissos.", en: "Whenever you want, I'll cancel all my plans.", grammar: [g.future-subjunctive-forms], vocab: [w.cancelar, w.compromisso] }
      - { es: "Se você vier de vestido vermelho, eu não respondo por mim.", en: "If you come in a red dress, I can't be held responsible.", grammar: [g.future-subjunctive-forms], vocab: [] }
      - { es: "Se eu tiver coragem, te convido para jantar. Pronto: tive.", en: "If I'm brave enough, I'll ask you to dinner. There: I was.", grammar: [g.future-subjunctive-forms], vocab: [] }
      - { es: "Quando você me vir dançar, vai mudar de ideia sobre mim.", en: "When you see me dance, you'll change your mind about me.", grammar: [g.future-subjunctive-forms], vocab: [] }
      - { es: "Se chover, a gente fica em casa vendo filme; o passeio pode esperar.", en: "If it rains, we'll stay in watching a film; the trip can wait.", grammar: [g.future-subjunctive-se], vocab: [] }
  - id: b1.u05.l2
    title: Assim que eu tiver o visto
    teach: [g.future-subjunctive-time]
    vocab: [w.assim-que, w.logo-que, w.sempre-que, w.visto, w.identidade, w.embaixada, w.consulado, w.alfândega, w.imigração, w.residência, w.cidadania, w.cidadão, w.documentação, w.burocracia, w.cartório, w.certidão, w.carteira-de-motorista, w.procedimento, w.requisito, w.validade, w.vencer, w.vencido, w.renovar, w.taxa, w.obter]
    tip: "For one future event, quando, assim que, logo que, sempre que and enquanto take the future subjunctive: Assim que eu tiver o visto, compro a passagem."
    sentences:
      - { es: "Assim que eu tiver o visto, compro a passagem.", en: "As soon as I have the visa, I'll buy the ticket.", altEs: ["Assim que eu tiver o visto, vou comprar a passagem.", "Logo que eu tiver o visto, compro a passagem."], grammar: [g.future-subjunctive-time], vocab: [w.assim-que, w.visto] }
      - { es: "Logo que a embaixada responder, te aviso.", en: "As soon as the embassy replies, I'll let you know.", altEs: ["Assim que a embaixada responder, te aviso."], grammar: [g.future-subjunctive-time], vocab: [w.logo-que, w.embaixada] }
      - { es: "Sempre que você precisar, pode contar comigo.", en: "Whenever you need me, you can count on me.", grammar: [g.future-subjunctive-time], vocab: [w.sempre-que] }
      - { es: "Quando você chegar à alfândega, mostre o passaporte.", en: "When you get to customs, show your passport.", altEs: ["Quando você chegar na alfândega, mostre o passaporte."], grammar: [g.future-subjunctive-time], vocab: [w.alfândega], error: { wrong: "Quando você chega à alfândega, mostre o passaporte.", explain: "One future arrival → future subjunctive: quando você chegar. Quando você chega means 'whenever you arrive' (habit).", grammar: g.future-subjunctive-time } }
      - { es: "Enquanto eu não tiver a carteira de identidade, não posso abrir conta.", en: "As long as I don't have an ID card, I can't open an account.", grammar: [g.future-subjunctive-time], vocab: [w.identidade] }
      - { es: "Depois que você obtiver a residência, pode trabalhar.", en: "Once you've got residency, you can work.", grammar: [g.future-subjunctive-time], vocab: [w.obter, w.residência], note: "obtiver: obter follows ter (obtiveram → obtiver)." }
      - { es: "Quando eu tiver a cidadania, vou poder votar.", en: "When I have citizenship, I'll be able to vote.", grammar: [g.future-subjunctive-time], vocab: [w.cidadania] }
      - { es: "Assim que você renovar o passaporte, me manda uma foto.", en: "As soon as you renew your passport, send me a photo.", grammar: [g.future-subjunctive-time], vocab: [w.renovar], transform: { instruction: "Change você to vocês", answer: "Assim que vocês renovarem o passaporte, me mandem uma foto.", en: "As soon as you (all) renew your passports, send me a photo." } }
      - { es: "O seu passaporte vence em março; quando vencer, você não pode viajar.", en: "Your passport expires in March; once it expires, you can't travel.", grammar: [g.future-subjunctive-time], vocab: [w.vencer] }
      - { es: "Com a carteira de motorista vencida, você não pode dirigir.", en: "With an expired driving licence, you can't drive.", grammar: [g.future-subjunctive-time], vocab: [w.vencido, w.carteira-de-motorista], variant: "In Portugal: a carta de condução." }
      - { es: "Quando for ao cartório, leve a certidão de nascimento.", en: "When you go to the registry office, take your birth certificate.", altEs: ["Quando você for ao cartório, leve a certidão de nascimento."], grammar: [g.future-subjunctive-time], vocab: [w.cartório, w.certidão] }
      - { es: "A burocracia é enorme: quando você achar que acabou, pedem mais um papel.", en: "The red tape is endless: just when you think it's over, they ask for another document.", grammar: [g.future-subjunctive-time], vocab: [w.burocracia] }
      - { es: "Quando a documentação estiver pronta, o consulado marca a entrevista.", en: "When the paperwork is ready, the consulate will set the interview.", grammar: [g.future-subjunctive-time], vocab: [w.documentação, w.consulado] }
      - { es: "Qual é a validade do visto?", en: "How long is the visa valid for?", altEn: ["What's the visa's period of validity?"], grammar: [g.question-words], vocab: [w.validade, w.visto] }
      - { es: "Logo que a gente pagar a taxa, o procedimento começa.", en: "As soon as we pay the fee, the procedure starts.", altEs: ["Logo que pagarmos a taxa, o procedimento começa."], grammar: [g.future-subjunctive-time], vocab: [w.taxa, w.procedimento], transform: { instruction: "Use assim que and change a gente to eu", answer: "Assim que eu pagar a taxa, o procedimento começa.", en: "As soon as I pay the fee, the procedure starts." } }
      - { es: "Quando você souber os requisitos, me conta.", en: "When you find out the requirements, tell me.", altEs: ["Quando você souber os requisitos, me conte."], grammar: [g.future-subjunctive-time], vocab: [w.requisito] }
    exchanges:
      - q: { es: "Quando você vai para Portugal?", en: "When are you going to Portugal?" }
        a: { es: "Assim que o visto sair.", en: "As soon as the visa comes through." }
        alt: ["Logo que eu tiver o visto.", "Em março, se der."]
        grammar: [g.future-subjunctive-time]
        vocab: [w.assim-que, w.visto]
      - q: { es: "Onde fica a imigração?", en: "Where's immigration?" }
        a: { es: "Depois da alfândega, à direita.", en: "After customs, on the right." }
        alt: ["Ali, à esquerda.", "No segundo andar."]
        grammar: []
        vocab: [w.imigração, w.alfândega]
      - q: { es: "Você já é cidadão brasileiro?", en: "Are you a Brazilian citizen yet?" }
        a: { es: "Ainda não. Quando eu tiver a cidadania, faço uma festa!", en: "Not yet. When I get citizenship, I'll throw a party!" }
        alt: ["Ainda não.", "Já sou, desde o ano passado."]
        grammar: [g.future-subjunctive-time]
        vocab: [w.cidadão, w.cidadania]
      - q: { es: "Até quando vale a sua carteira de motorista?", en: "How long is your driving licence valid for?" }
        a: { es: "Vence no ano que vem; quando vencer, eu renovo.", en: "It expires next year; when it does, I'll renew it." }
        alt: ["Até dezembro.", "Já venceu!"]
        grammar: [g.future-subjunctive-time]
        vocab: [w.carteira-de-motorista, w.vencer, w.renovar]
      - q: { es: "Você me liga quando chegar?", en: "Will you call me when you arrive?" }
        a: { es: "Ligo assim que o avião chegar.", en: "I'll call as soon as the plane lands." }
        alt: ["Ligo, sim!", "Te mando uma mensagem assim que eu chegar."]
        grammar: [g.future-subjunctive-time]
        vocab: [w.assim-que]
    texts:
      - title: "Instruções do consulado"
        es: ["Quando você vier ao consulado, traga todos os documentos.", "Assim que a taxa for paga, o pedido entra no sistema.", "Sempre que houver dúvidas, veja o nosso site."]
        en: ["When you come to the consulate, bring all your documents.", "As soon as the fee is paid, the application goes into the system.", "Whenever you have questions, check our website."]
        grammar: [g.future-subjunctive-time]
        vocab: [w.consulado, w.taxa, w.sempre-que]
      - title: "Mensagem do Duarte"
        es: ["Cheguei! A imigração demorou duas horas.", "Assim que eu deixar as malas no hotel, te ligo.", "Quando você tiver tempo, me manda o endereço do cartório."]
        en: ["I've arrived! Immigration took two hours.", "As soon as I drop my bags at the hotel, I'll call you.", "When you have time, send me the address of the registry office."]
        grammar: [g.future-subjunctive-time]
        vocab: [w.imigração, w.cartório]
    spicy:
      - { es: "Assim que eu te vi, esqueci o meu nome, o passaporte e a burocracia.", en: "The moment I saw you, I forgot my name, my passport and the red tape.", grammar: [g.future-subjunctive-time], vocab: [w.assim-que, w.burocracia] }
      - { es: "Sempre que você sorrir assim, eu vou ficar sem palavras.", en: "Whenever you smile like that, I'll be lost for words.", grammar: [g.future-subjunctive-time], vocab: [w.sempre-que] }
      - { es: "Quando eu tiver o visto, você vai ser o primeiro a saber… e o primeiro a me levar para jantar.", en: "When I get my visa, you'll be the first to know… and the first to take me to dinner.", grammar: [g.future-subjunctive-time], vocab: [w.visto] }
      - { es: "Meu coração não tem prazo de validade; quando você quiser, ele está aqui.", en: "My heart has no expiry date; whenever you want it, it's here.", grammar: [g.future-subjunctive-time], vocab: [w.validade, w.prazo] }
      - { es: "Logo que eu passar pela alfândega, vou te procurar.", en: "As soon as I get through customs, I'll come looking for you.", grammar: [g.future-subjunctive-time], vocab: [w.logo-que, w.alfândega] }
  - id: b1.u05.l3
    title: Se der tempo
    teach: [g.future-subjunctive-se]
    vocab: [w.cerrado, w.pantanal, w.onça, w.jacaré, w.arara, w.tucano, w.tuiuiú, w.ecoturismo, w.trilha, w.caminho, w.instalar]
    tip: "Se + future subjunctive for conditions that may well happen: Se chover, a gente fica em casa. Se der tempo, passo aí."
    sentences:
      - { es: "Se chover amanhã, a gente fica em Congonhas.", en: "If it rains tomorrow, we'll stay in Congonhas.", altEs: ["Se chover amanhã, nós ficamos em Congonhas."], grammar: [g.future-subjunctive-se], vocab: [], error: { wrong: "Se chove amanhã, a gente fica em Congonhas.", explain: "Spanish 'si llueve mañana' is se chover amanhã: a future condition takes the future subjunctive.", grammar: g.future-subjunctive-se } }
      - { es: "Se fizer sol, vamos fazer a trilha da serra.", en: "If it's sunny, we'll do the mountain trail.", grammar: [g.future-subjunctive-se], vocab: [w.trilha] }
      - { es: "Se der tempo, passo no santuário antes do almoço.", en: "If there's time, I'll stop by the sanctuary before lunch.", grammar: [g.future-subjunctive-se], vocab: [] }
      - { es: "Se você for ao Pantanal na seca, vai ver muitos jacarés.", en: "If you go to the Pantanal in the dry season, you'll see lots of caimans.", grammar: [g.future-subjunctive-se], vocab: [w.pantanal, w.jacaré] }
      - { es: "Se a gente tiver sorte, vai ver uma onça.", en: "If we're lucky, we'll see a jaguar.", altEs: ["Se nós tivermos sorte, vamos ver uma onça."], grammar: [g.future-subjunctive-se], vocab: [w.onça] }
      - { es: "Se vocês ficarem em silêncio, as araras chegam perto.", en: "If you stay quiet, the macaws come close.", grammar: [g.future-subjunctive-se], vocab: [w.arara] }
      - { es: "Se você gostar de pássaros, vai adorar os tucanos.", en: "If you like birds, you'll love the toucans.", grammar: [g.future-subjunctive-se], vocab: [w.tucano] }
      - { es: "Se você vir um tuiuiú, tira uma foto: é o símbolo do Pantanal.", en: "If you see a jabiru, take a photo: it's the symbol of the Pantanal.", altEs: ["Se você vir um tuiuiú, tire uma foto: é o símbolo do Pantanal."], grammar: [g.future-subjunctive-se, g.future-subjunctive-forms], vocab: [w.tuiuiú] }
      - { es: "Se o guia não vier, a gente faz o caminho sozinho.", en: "If the guide doesn't come, we'll do the route on our own.", grammar: [g.future-subjunctive-se], vocab: [w.caminho], transform: { instruction: "Change o guia to os guias", answer: "Se os guias não vierem, a gente faz o caminho sozinho.", en: "If the guides don't come, we'll do the route on our own." } }
      - { es: "Se eu puder, vou ao cerrado com vocês.", en: "If I can, I'll go to the cerrado with you.", grammar: [g.future-subjunctive-se], vocab: [w.cerrado], error: { wrong: "Se eu poderei, vou ao cerrado com vocês.", explain: "Never the future tense after se: se eu puder.", grammar: g.future-subjunctive-se } }
      - { es: "Se Deus quiser, vai dar tudo certo.", en: "God willing, it'll all work out.", grammar: [g.future-subjunctive-se], vocab: [] }
      - { es: "Se precisar, é só chamar.", en: "If you need anything, just call.", altEs: ["Se você precisar, é só chamar."], grammar: [g.future-subjunctive-se], vocab: [] }
      - { es: "Se vocês gostarem de ecoturismo, Bonito é perfeito.", en: "If you like ecotourism, Bonito is perfect.", grammar: [g.future-subjunctive-se], vocab: [w.ecoturismo] }
      - { es: "Se você não conseguir instalar o aplicativo, eu te ajudo.", en: "If you can't install the app, I'll help you.", grammar: [g.future-subjunctive-se], vocab: [w.instalar] }
      - { es: "Se você quiser, eu te levo ao santuário.", en: "If you like, I'll take you to the sanctuary.", grammar: [g.future-subjunctive-se], vocab: [], transform: { instruction: "Change você to vocês", answer: "Se vocês quiserem, eu levo vocês ao santuário.", alt: ["Se vocês quiserem, eu os levo ao santuário."], en: "If you (all) like, I'll take you to the sanctuary." } }
      - { es: "Se não for incômodo, posso deixar a mala aqui?", en: "If it's no trouble, can I leave my suitcase here?", grammar: [g.future-subjunctive-se], vocab: [] }
    exchanges:
      - q: { es: "Vamos à cachoeira amanhã?", en: "Shall we go to the waterfall tomorrow?" }
        a: { es: "Se fizer sol, vamos!", en: "If it's sunny, let's!" }
        alt: ["Se não chover, vamos.", "Vamos, se der tempo."]
        grammar: [g.future-subjunctive-se]
        vocab: []
      - q: { es: "Posso ir com vocês?", en: "Can I come with you?" }
        a: { es: "Claro! Se você quiser, te pego no hotel.", en: "Of course! If you like, I'll pick you up at the hotel." }
        alt: ["Claro que pode!", "Se você acordar cedo, pode."]
        grammar: [g.future-subjunctive-se]
        vocab: []
      - q: { es: "O que eu faço se vir uma onça?", en: "What do I do if I see a jaguar?" }
        a: { es: "Se você vir uma onça, fique parado e não corra!", en: "If you see a jaguar, stand still and don't run!" }
        alt: ["Fique parado!", "Tira uma foto, de longe!"]
        grammar: [g.future-subjunctive-se, g.imperative-negative]
        vocab: [w.onça]
      - q: { es: "E se o ônibus atrasar?", en: "And what if the bus is late?" }
        a: { es: "Se atrasar, a gente pega um táxi.", en: "If it's late, we'll get a taxi." }
        alt: ["Aí a gente espera.", "Se atrasar, a gente vai a pé."]
        grammar: [g.future-subjunctive-se]
        vocab: []
      - q: { es: "Você vai ao Jubileu este ano?", en: "Are you going to the Jubilee this year?" }
        a: { es: "Se Deus quiser!", en: "God willing!" }
        alt: ["Se eu puder, vou.", "Vou, se der."]
        grammar: [g.future-subjunctive-se]
        vocab: []
    texts:
      - title: "Folheto de ecoturismo"
        es: ["Se você gostar de natureza, o Pantanal é o seu lugar.", "Se tiver sorte, vai ver onças, jacarés e araras.", "Se vier na época da seca, os animais ficam mais fáceis de ver."]
        en: ["If you like nature, the Pantanal is the place for you.", "If you're lucky, you'll see jaguars, caimans and macaws.", "If you come in the dry season, the animals are easier to see."]
        grammar: [g.future-subjunctive-se]
        vocab: [w.ecoturismo, w.pantanal, w.onça, w.jacaré, w.arara]
      - title: "Plano para o fim de semana"
        es: ["Sábado: se fizer sol, trilha no cerrado.", "Se chover, museu e pão de queijo.", "Domingo: se der tempo, os profetas de Congonhas."]
        en: ["Saturday: if it's sunny, a trail in the cerrado.", "If it rains, a museum and cheese bread.", "Sunday: if there's time, the prophets of Congonhas."]
        grammar: [g.future-subjunctive-se]
        vocab: [w.trilha, w.cerrado]
    spicy:
      - { es: "Se você me levar ao Pantanal, prometo te proteger dos jacarés.", en: "If you take me to the Pantanal, I promise to protect you from the caimans.", grammar: [g.future-subjunctive-se], vocab: [w.pantanal, w.jacaré] }
      - { es: "Se você ficar mais um dia, eu te mostro o pôr do sol mais bonito de Minas.", en: "If you stay one more day, I'll show you the most beautiful sunset in Minas.", grammar: [g.future-subjunctive-se], vocab: [] }
      - { es: "Se der tempo, um café; se der certo, um jantar; se der sorte, um beijo.", en: "If there's time, a coffee; if it goes well, a dinner; if I'm lucky, a kiss.", grammar: [g.future-subjunctive-se], vocab: [w.dar-certo] }
      - { es: "Se você continuar me olhando assim, vou perder o caminho de casa.", en: "If you keep looking at me like that, I'll forget the way home.", grammar: [g.future-subjunctive-se], vocab: [w.caminho] }
      - { es: "Se alguém perguntar, a gente estava vendo as araras.", en: "If anyone asks, we were watching the macaws.", grammar: [g.future-subjunctive-se], vocab: [w.arara] }
  - id: b1.u05.l4
    title: Quem quiser, venha
    teach: [g.future-subjunctive-relative]
    vocab: [w.como-quiser, w.adaptar-se, w.adaptação, w.choque-cultural, w.despedir-se, w.despedida, w.mudança-de-cidade, w.emigrar, w.imigrar, w.emigrante, w.estabelecer-se, w.instalar-se]
    tip: "Whoever, whatever, wherever about the future: quem quiser, o que você quiser, onde você estiver. Como quiser is the polite 'as you like'."
    sentences:
      - { es: "Quem quiser pode vir com a gente.", en: "Anyone who wants can come with us.", altEs: ["Quem quiser, pode vir com a gente."], grammar: [g.future-subjunctive-relative], vocab: [], transform: { instruction: "Change to 'those who': Os que…", answer: "Os que quiserem podem vir com a gente.", en: "Those who want can come with us." } }
      - { es: "Faça como você quiser.", en: "Do as you like.", altEs: ["Faz como você quiser.", "Faça como quiser."], grammar: [g.future-subjunctive-relative], vocab: [w.como-quiser] }
      - { es: "Pode pedir o que você quiser; hoje eu pago.", en: "You can order whatever you like; I'm paying today.", altEs: ["Pode pedir o que quiser; hoje eu pago."], grammar: [g.future-subjunctive-relative], vocab: [], error: { wrong: "Pode pedir o que você queira; hoje eu pago.", explain: "For 'whatever' about the future Portuguese uses the future subjunctive: o que você quiser (Spanish: lo que quieras).", grammar: g.future-subjunctive-relative } }
      - { es: "Quem chegar primeiro escolhe o lugar.", en: "Whoever gets there first chooses the spot.", grammar: [g.future-subjunctive-relative], vocab: [], transform: { instruction: "Change to 'those who': Os que…", answer: "Os que chegarem primeiro escolhem o lugar.", en: "Those who get there first choose the spot." } }
      - { es: "Onde você estiver, eu vou te visitar.", en: "Wherever you are, I'll visit you.", grammar: [g.future-subjunctive-relative], vocab: [] }
      - { es: "Leve quantos documentos você precisar.", en: "Take as many documents as you need.", grammar: [g.future-subjunctive-relative], vocab: [] }
      - { es: "Quem não puder ir à despedida, que mande uma mensagem.", en: "Anyone who can't come to the farewell party should send a message.", grammar: [g.future-subjunctive-relative, g.indirect-commands], vocab: [w.despedida] }
      - { es: "Quem emigrar vai precisar de paciência para se adaptar.", en: "Whoever emigrates will need patience to adapt.", grammar: [g.future-subjunctive-relative], vocab: [w.emigrar, w.adaptar-se] }
      - { es: "A adaptação é mais fácil para quem souber a língua.", en: "Adapting is easier for anyone who knows the language.", grammar: [g.future-subjunctive-relative], vocab: [w.adaptação] }
      - { es: "Todo emigrante sente choque cultural no começo.", en: "Every emigrant feels culture shock at first.", grammar: [g.future-subjunctive-relative], vocab: [w.emigrante, w.choque-cultural] }
      - { es: "Quem imigrar para o Brasil vai comer arroz com feijão todo dia.", en: "Whoever immigrates to Brazil will eat rice and beans every day.", grammar: [g.future-subjunctive-relative], vocab: [w.imigrar] }
      - { es: "Vou me despedir de quem estiver na festa.", en: "I'll say goodbye to whoever is at the party.", altEs: ["Vou me despedir de todos que estiverem na festa."], grammar: [g.future-subjunctive-relative], vocab: [w.despedir-se] }
      - { es: "Os amigos que vierem me visitar em Lisboa vão ter cama e café.", en: "Any friends who come to visit me in Lisbon will get a bed and breakfast.", grammar: [g.future-subjunctive-relative], vocab: [] }
      - { es: "Depois da mudança de cidade, quero me estabelecer de vez.", en: "After moving to another city, I want to settle down for good.", grammar: [g.subjunctive-vs-infinitive], vocab: [w.mudança-de-cidade, w.estabelecer-se] }
      - { es: "Quando eu me instalar no apartamento novo, faço um jantar para quem quiser vir.", en: "When I've settled into the new flat, I'll make dinner for anyone who wants to come.", grammar: [g.future-subjunctive-relative, g.future-subjunctive-time], vocab: [w.instalar-se] }
      - { es: "Aconteça o que acontecer, estou com você.", en: "Whatever happens, I'm with you.", grammar: [g.future-subjunctive-relative], vocab: [], note: "A fixed expression with the present subjunctive used twice, like custe o que custar." }
    exchanges:
      - q: { es: "Onde a gente se senta?", en: "Where shall we sit?" }
        a: { es: "Onde vocês quiserem.", en: "Wherever you like." }
        alt: ["Onde você quiser.", "Aqui, perto da janela."]
        grammar: [g.future-subjunctive-relative]
        vocab: []
      - q: { es: "Posso pegar mais um pão de queijo?", en: "Can I have another cheese bread?" }
        a: { es: "Pode pegar quantos quiser!", en: "Take as many as you like!" }
        alt: ["Claro, pode pegar!", "Pega quantos você quiser!"]
        grammar: [g.future-subjunctive-relative]
        vocab: []
      - q: { es: "Vamos jantar fora ou em casa?", en: "Shall we eat out or at home?" }
        a: { es: "Como você quiser.", en: "As you like." }
        alt: ["Como quiser.", "Como você preferir."]
        grammar: [g.future-subjunctive-relative]
        vocab: [w.como-quiser]
      - q: { es: "Foi difícil se adaptar ao Brasil?", en: "Was it hard to adapt to Brazil?" }
        a: { es: "No começo, sim. Tive um choque cultural com os horários.", en: "At first, yes. I had a culture shock with the timekeeping." }
        alt: ["Um pouco.", "Não, foi fácil."]
        grammar: []
        vocab: [w.adaptar-se, w.choque-cultural]
      - q: { es: "Quem vai à despedida do Rui?", en: "Who's going to Rui's farewell party?" }
        a: { es: "Quem puder! Ele viaja na sexta.", en: "Whoever can! He leaves on Friday." }
        alt: ["Todo mundo!", "Eu vou, com certeza."]
        grammar: [g.future-subjunctive-relative]
        vocab: [w.despedida]
    texts:
      - title: "Convite de despedida"
        es: ["Pessoal, vou me mudar para Portugal no mês que vem!", "Quem quiser se despedir, venha ao bar no sábado.", "Quem não puder vir, que mande uma mensagem!"]
        en: ["Everyone, I'm moving to Portugal next month!", "Anyone who wants to say goodbye, come to the bar on Saturday.", "Anyone who can't come, send a message!"]
        grammar: [g.future-subjunctive-relative, g.indirect-commands]
        vocab: [w.despedir-se, w.despedida]
      - title: "Dicas para emigrantes"
        es: ["Quem chegar a um país novo vai sentir saudade.", "Aprenda a língua o máximo que puder.", "E quem tiver paciência vai se adaptar mais rápido."]
        en: ["Anyone who arrives in a new country will feel homesick.", "Learn the language as much as you can.", "And whoever is patient will adapt faster."]
        grammar: [g.future-subjunctive-relative]
        vocab: [w.emigrante, w.adaptar-se]
    spicy:
      - { es: "Vou para onde você for, mas a próxima viagem quem paga é você.", en: "I'll go wherever you go, but you're paying for the next trip.", grammar: [g.future-subjunctive-relative], vocab: [] }
      - { es: "Quem me trouxer um café amanhã cedo ganha um beijo.", en: "Whoever brings me a coffee early tomorrow gets a kiss.", grammar: [g.future-subjunctive-relative], vocab: [] }
      - { es: "Pode escolher o que quiser no cardápio; eu já escolhi você.", en: "You can choose whatever you like from the menu; I've already chosen you.", grammar: [g.future-subjunctive-relative], vocab: [] }
      - { es: "Quem dançar comigo hoje leva o meu telefone de brinde.", en: "Whoever dances with me tonight gets my number as a free gift.", grammar: [g.future-subjunctive-relative], vocab: [w.brinde] }
      - { es: "Onde você estiver, eu apareço… com pão de queijo.", en: "Wherever you are, I'll turn up… with cheese bread.", grammar: [g.future-subjunctive-relative], vocab: [] }
dialogues:
  - id: b1.u05.d1
    title: Diante dos profetas
    context: Before moving to Lisbon, Henrique visits the twelve prophets of Congonhas with his friend Lorena.
    lines:
      - { speaker: Lorena, es: "Olha os doze profetas! Quando você estiver em Lisboa, vai sentir saudade disso.", en: "Look at the twelve prophets! When you're in Lisbon, you'll miss this." }
      - { speaker: Henrique, es: "Vou mesmo. Se eu puder, volto para o Jubileu do ano que vem.", en: "I really will. If I can, I'll come back for next year's Jubilee." }
      - { speaker: Lorena, es: "Assim que você chegar lá, me manda uma mensagem, tá?", en: "As soon as you get there, send me a message, OK?" }
      - { speaker: Henrique, es: "Mando. Mas primeiro tenho que resolver a burocracia: residência, conta no banco…", en: "I will. But first I have to sort out the red tape: residency, a bank account…" }
      - { speaker: Lorena, es: "E quem vai te ajudar com os documentos?", en: "And who's going to help you with the documents?" }
      - { speaker: Henrique, es: "A empresa. Quando eu tiver a residência, posso alugar um apartamento.", en: "The company. When I have residency, I can rent a flat." }
      - { speaker: Lorena, es: "E se você não se adaptar?", en: "And what if you don't adapt?" }
      - { speaker: Henrique, es: "Se não der certo, eu volto. Mas acho que vou gostar.", en: "If it doesn't work out, I'll come back. But I think I'll like it." }
      - { speaker: Lorena, es: "Quem quiser te visitar pode ficar na sua casa?", en: "Can anyone who wants to visit you stay at your place?" }
      - { speaker: Henrique, es: "Quem trouxer pão de queijo pode ficar o tempo que quiser!", en: "Whoever brings cheese bread can stay as long as they like!" }
    questions:
      - { q: "Para onde o Henrique vai se mudar?", options: ["Para Congonhas", "Para Lisboa", "Para o Porto"], answer: 1, explain: "Quando você estiver em Lisboa…" }
      - { q: "Quando o Henrique quer voltar a Congonhas?", options: ["No Natal", "No Jubileu do ano que vem", "Nunca"], answer: 1, explain: "Se eu puder, volto para o Jubileu do ano que vem." }
      - { q: "O que o Henrique vai fazer quando tiver a residência?", options: ["Alugar um apartamento", "Comprar um carro", "Abrir uma empresa"], answer: 0, explain: "Quando eu tiver a residência, posso alugar um apartamento." }
      - { q: "Quem pode ficar na casa do Henrique o tempo que quiser?", options: ["Só a Lorena", "Quem trouxer pão de queijo", "Ninguém"], answer: 1, explain: "Quem trouxer pão de queijo pode ficar o tempo que quiser!" }
writing:
  - task: "Write to a friend about your plans for your visit to Congonhas, using the future subjunctive (Quando eu chegar…, Se der tempo…, Assim que você confirmar…)."
    min: 50
    max: 100
    use: [w.planejar, w.confirmar, w.agenda, w.compromisso, w.profeta]
    useAtLeast: 3
    grammar: [g.future-subjunctive-forms, g.future-subjunctive-time]
    expect:
      - { pattern: '\b(quando|assim que|logo que|se|sempre que)( [a-zà-ú]+)?( n[aã]o)? [a-zà-ú]+(r|rmos|rem)\b', hint: "Use the future subjunctive: Quando eu chegar…, Se der tempo…" }
    model: { es: "Oi, Bia! Já planejei tudo para a viagem. Quando eu chegar a Congonhas, te ligo. Se der tempo, a gente visita os doze profetas no mesmo dia. Assim que você confirmar a data, eu compro a passagem. Se você tiver algum compromisso, não tem problema: a gente muda a agenda. Quando quiser, me avisa!", en: "Hi, Bia! I've planned everything for the trip. When I get to Congonhas, I'll call you. If there's time, we'll visit the twelve prophets on the same day. As soon as you confirm the date, I'll buy the ticket. If you have something on, no problem: we'll change the schedule. Whenever you like, let me know!" }
  - task: "Explain the steps you will take to get a visa and settle in Brazil, using assim que, logo que, quando + future subjunctive."
    min: 50
    max: 100
    use: [w.visto, w.embaixada, w.identidade, w.burocracia, w.renovar]
    useAtLeast: 3
    grammar: [g.future-subjunctive-time]
    expect:
      - { pattern: '\b(assim que|logo que|quando|depois que)( [a-zà-ú]+)?( n[aã]o)? [a-zà-ú]+(r|rmos|rem)\b', hint: "Use assim que / quando + future subjunctive: Assim que eu tiver os documentos…" }
    model: { es: "Para morar no Brasil, preciso de um visto. Assim que eu tiver todos os documentos, vou marcar um horário na embaixada. Quando a embaixada aprovar o pedido, vou comprar a passagem. Logo que eu chegar, tenho que tirar a carteira de identidade e abrir uma conta no banco. Se a burocracia demorar, vou ter paciência!", en: "To live in Brazil, I need a visa. As soon as I have all the documents, I'll book an appointment at the embassy. When the embassy approves the application, I'll buy the ticket. As soon as I arrive, I have to get an ID card and open a bank account. If the red tape takes a while, I'll be patient!" }
  - task: "Plan a nature trip to the Pantanal: say what you will do depending on the conditions (Se chover…, Se a gente tiver sorte…, Se virmos uma onça…)."
    min: 50
    max: 100
    use: [w.trilha, w.onça, w.arara, w.jacaré, w.ecoturismo]
    useAtLeast: 3
    grammar: [g.future-subjunctive-se]
    expect:
      - { pattern: '\bse( [a-zà-ú]+)?( n[aã]o)? [a-zà-ú]+(r|rmos|rem)\b', hint: "Use se + future subjunctive: Se chover…, Se a gente tiver sorte…" }
    model: { es: "Na semana que vem vamos fazer ecoturismo no Pantanal. Se não chover, faremos uma trilha de manhã cedo. Se a gente tiver sorte, vamos ver araras e tucanos. Se virmos uma onça, vou tirar mil fotos! À tarde, se o guia puder, vamos passear de barco para ver os jacarés. Se fizer muito calor, ficaremos na pousada.", en: "Next week we're going on an eco-trip to the Pantanal. If it doesn't rain, we'll do a trail early in the morning. If we're lucky, we'll see macaws and toucans. If we see a jaguar, I'll take a thousand photos! In the afternoon, if the guide can, we'll take a boat trip to see the caimans. If it's very hot, we'll stay at the lodge." }
  - task: "You are moving to another city. Write the invitation to your farewell party, using whoever, whatever and however + future subjunctive (Quem quiser…, O que vocês puderem…, como vocês preferirem)."
    min: 50
    max: 100
    use: [w.despedida, w.despedir-se, w.adaptar-se, w.mudança-de-cidade, w.como-quiser]
    useAtLeast: 2
    grammar: [g.future-subjunctive-relative]
    expect:
      - { pattern: '\b(quem|o que|onde|como|quanto)( voc[eê]s?| a gente)? (quiser|quiserem|puder|puderem|preferir|preferirem|tiver|tiverem|vier|vierem|der)\b', hint: "Use quem / o que / como + future subjunctive: Quem quiser…, O que vocês puderem…" }
    model: { es: "Amigos, no mês que vem vou me mudar para Brasília e quero fazer uma festa de despedida no sábado! Quem quiser pode trazer um amigo. Tragam o que vocês puderem: uma bebida, um doce, qualquer coisa. Vamos ficar no quintal ou na sala, como vocês preferirem. Vai ser difícil me adaptar a outra cidade, mas quero me despedir de todos com alegria!", en: "Friends, next month I'm moving to Brasília and I want to have a farewell party on Saturday! Whoever wants to can bring a friend. Bring whatever you can: a drink, a sweet, anything. We'll be in the garden or the living room, whichever you prefer. It'll be hard to adapt to another city, but I want to say goodbye to everyone happily!" }
