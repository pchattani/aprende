id: b2.u12
title: El español en el mundo
lessons:
  - id: b2.u12.l1
    title: Coche, carro o auto
    teach: [g.varieties-overview]
    vocab: [w.variedad, w.dialecto, w.pronunciacion, w.seseo, w.distincion, w.yeismo, w.hablante, w.nativo, w.carro, w.auto, w.computadora, w.celular, w.jugo, w.papa, w.camion, w.guagua, w.colectivo, w.departamento, w.dale, w.mande, w.chevere, w.boleto, w.manejar, w.platicar, w.enojarse, w.lindo, w.estacionar, w.aguacate, w.maiz, w.frijol, w.andino, w.rioplatense, w.caribeno, w.canario, w.andaluz, w.latinoamericano, w.hispanohablante, w.castellano, w.gramatica, w.vocabulario, w.comprender, w.entenderse]
    tip: "About 500 million people speak Spanish in 21 countries. Pronunciation (seseo, yeísmo, dropped final -s), pronouns (vosotros only in Spain, vos in the Río de la Plata) and everyday vocabulary (coche / carro / auto) vary, but everyone understands everyone."
    sentences:
      - { es: "En México se dice carro y celular; en España, coche y móvil; en Argentina, auto y celular.", en: "In Mexico they say carro and celular; in Spain, coche and móvil; in Argentina, auto and celular.", grammar: [g.varieties-overview], vocab: [w.carro, w.celular, w.auto, w.movil] }
      - { es: "¿Cuántos hablantes nativos tiene el español? — Casi quinientos millones, en veintiún países.", en: "How many native speakers does Spanish have? — Almost five hundred million, in twenty-one countries.", grammar: [g.varieties-overview], vocab: [w.hablante, w.nativo, w.millon] }
      - { es: "La distinción entre s y z solo se mantiene en el centro y el norte de España; el resto del mundo hispanohablante sesea.", en: "The distinction between s and z is kept only in central and northern Spain; the rest of the Spanish-speaking world uses seseo.", grammar: [g.varieties-overview], vocab: [w.distincion, w.seseo, w.hispanohablante], note: "sesear = to pronounce c/z as s." }
      - { es: "El yeísmo es casi universal, pero en Buenos Aires la ll suena como sh: «cashe» por calle.", en: "Yeísmo is almost universal, but in Buenos Aires ll sounds like sh: 'cashe' for calle.", grammar: [g.varieties-overview], vocab: [w.yeismo, w.calle, w.sonar], note: "universal = universal." }
      - { es: "Pedí un jugo de naranja y la camarera, que era andaluza, me preguntó si quería un zumo.", en: "I ordered a jugo de naranja and the waitress, who was Andalusian, asked me if I wanted a zumo.", grammar: [g.varieties-overview, g.reported-speech-past], vocab: [w.jugo, w.zumo, w.andaluz, w.camarero] }
      - { es: "No es un dialecto peor ni mejor: cada variedad tiene su propia gramática y su propio vocabulario.", en: "It isn't a worse or a better dialect: every variety has its own grammar and its own vocabulary.", grammar: [g.varieties-overview], vocab: [w.dialecto, w.variedad, w.gramatica, w.vocabulario] }
      - { es: "En Canarias y en Cuba el autobús es la guagua; en Argentina, el colectivo; en México, el camión.", en: "In the Canaries and in Cuba the bus is the guagua; in Argentina, the colectivo; in Mexico, the camión.", grammar: [g.varieties-overview], vocab: [w.guagua, w.colectivo, w.camion, w.autobus] }
      - { es: "¿Mande? — Así responden en México cuando no te han entendido; en España diríamos «¿cómo?».", en: "Mande? — That's how they answer in Mexico when they haven't understood you; in Spain we'd say '¿cómo?'.", grammar: [g.varieties-overview], vocab: [w.mande, w.entender, w.responder] }
      - { es: "¡Qué chévere tu departamento! — Gracias; en España dirían «¡qué chulo tu piso!».", en: "How cool your flat is! — Thanks; in Spain they'd say '¡qué chulo tu piso!'.", grammar: [g.varieties-overview], vocab: [w.chevere, w.departamento, w.chulo, w.piso] }
      - { es: "Mi amiga colombiana no se enoja, se «enfada» cuando habla con españoles: ha aprendido a adaptarse.", en: "My Colombian friend doesn't 'enojarse', she 'se enfada' when she talks to Spaniards: she has learned to adapt.", grammar: [g.varieties-overview], vocab: [w.enojarse, w.enfadarse, w.adaptarse, w.colombiano] }
      - { es: "En el Caribe y en el Río de la Plata se aspira o se pierde la s final: «lo' libro'».", en: "In the Caribbean and the Río de la Plata the final s is aspirated or dropped: 'lo' libro''.", grammar: [g.varieties-overview], vocab: [w.caribeno, w.rioplatense, w.perder], note: "aspirar = to aspirate (pronounce as h)." }
      - { es: "Platicamos un rato con el taxista, que manejaba despacio y nos cobró en plata, no con tarjeta.", en: "We chatted for a while with the taxi driver, who drove slowly and charged us in cash, not by card.", grammar: [g.varieties-overview], vocab: [w.platicar, w.manejar, w.plata, w.taxi], note: "Mexican Spanish: platicar, manejar." }
      - { es: "La papa, el maíz, el aguacate y el frijol son palabras de lenguas americanas que hoy usa todo el mundo hispanohablante.", en: "Papa, maíz, aguacate and frijol are words from American languages that the whole Spanish-speaking world uses today.", grammar: [g.varieties-overview], vocab: [w.papa, w.maiz, w.aguacate, w.frijol] }
      - { es: "Estacioné el carro, compré el boleto y me senté en un banco lindo frente al mar: ¡qué viaje tan andino y caribeño a la vez!", en: "I parked the car, bought the ticket and sat on a lovely bench facing the sea: what a trip, Andean and Caribbean at the same time!", grammar: [g.varieties-overview], vocab: [w.estacionar, w.boleto, w.lindo, w.andino] }
      - { es: "Dale, nos vemos en la computadora a las ocho.", en: "OK, see you on the computer at eight.", grammar: [g.varieties-overview], vocab: [w.dale, w.computadora], error: { wrong: "Dale, nos vemos en el computadora a las ocho.", explain: "computadora is feminine (la computadora); in Spain it is el ordenador and in some countries el computador.", grammar: g.varieties-overview } }
      - { es: "Aparqué el coche y cogí el autobús hasta el centro.", en: "I parked the car and took the bus to the centre.", grammar: [g.varieties-overview], vocab: [w.aparcar, w.coche, w.autobus], transform: { instruction: "Say it as a Mexican speaker would (estacionar, carro, camión; avoid coger)", answer: "Estacioné el carro y tomé el camión hasta el centro.", alt: ["Estacioné el carro y agarré el camión hasta el centro."] } }
    exchanges:
      - q: { es: "¿Se entienden bien un español y un argentino?", en: "Do a Spaniard and an Argentinian understand each other well?" }
        a: { es: "Perfectamente; cambian algunas palabras y la pronunciación, pero es la misma lengua.", en: "Perfectly; some words and the pronunciation change, but it's the same language." }
        alt: ["Sí, se entienden sin problema.", "Claro, aunque a veces se ríen de las palabras del otro."]
        grammar: [g.varieties-overview]
        vocab: [w.entenderse, w.pronunciacion]
      - q: { es: "¿Cómo se dice «móvil» en América?", en: "How do you say 'móvil' in the Americas?" }
        a: { es: "Celular, en casi todos los países; y «ordenador» es computadora.", en: "Celular, in almost every country; and 'ordenador' is computadora." }
        alt: ["Celular."]
        grammar: [g.varieties-overview]
        vocab: [w.celular, w.computadora]
      - q: { es: "¿Mande?", en: "Pardon?" }
        a: { es: "Perdona, te preguntaba si tomas el camión o manejas.", en: "Sorry, I was asking whether you take the bus or drive." }
        alt: ["Nada, que si vienes en carro o en camión."]
        grammar: [g.varieties-overview]
        vocab: [w.mande, w.camion, w.manejar]
      - q: { es: "¿Qué variedad de español estudias tú?", en: "Which variety of Spanish do you study?" }
        a: { es: "La de España, pero intento comprender todas: veo series mexicanas y argentinas.", en: "The Spanish one, but I try to understand them all: I watch Mexican and Argentinian series." }
        alt: ["El castellano de España, aunque mi profesora es caribeña."]
        grammar: [g.varieties-overview]
        vocab: [w.variedad, w.comprender, w.serie]
    texts:
      - title: "Cartel en un aeropuerto de México"
        es: ["Bienvenidos a la Ciudad de México.", "Compre su boleto de camión en la ventanilla tres y estacione su carro en el nivel dos.", "Si necesita ayuda, platique con nuestro personal."]
        en: ["Welcome to Mexico City.", "Buy your bus ticket at window three and park your car on level two.", "If you need help, talk to our staff."]
        grammar: [g.varieties-overview]
        vocab: [w.boleto, w.camion, w.estacionar, w.platicar]
      - title: "Nota en un libro de texto"
        es: ["El seseo no es un error: lo practican la mayoría de los hablantes nativos.", "La distinción s/z es una variedad más, la del centro y norte de España.", "Elige la pronunciación que prefieras y mantenla con coherencia."]
        en: ["Seseo is not a mistake: most native speakers use it.", "The s/z distinction is just one more variety, that of central and northern Spain.", "Choose the pronunciation you prefer and keep to it consistently."]
        grammar: [g.varieties-overview]
        vocab: [w.seseo, w.hablante, w.distincion, w.coherencia]
  - id: b2.u12.l2
    title: "¿Vos de dónde sos?"
    teach: [g.voseo]
    vocab: [w.vos, w.che, w.sos, w.tenes, w.queres, w.podes, w.sabes, w.veni, w.decime, w.contame, w.sentate, w.anda, w.mira, w.aca, w.laburo, w.laburar, w.pibe, w.mate, w.asado, w.barbaro]
    tip: "In Argentina, Uruguay, Paraguay and much of Central America vos replaces tú: vos sos, tenés, querés, podés, hablás, vivís; imperatives hablá, vení, decime. No stem changes (tenés, not tienes). Object pronoun te and possessive tu stay the same."
    sentences:
      - { es: "¿Vos de dónde sos? — Soy de Montevideo, pero laburo en Buenos Aires.", en: "Where are you from? — I'm from Montevideo, but I work in Buenos Aires.", grammar: [g.voseo], vocab: [w.vos, w.sos, w.laburar] }
      - { es: "Che, vení, sentate acá y contame qué pasó en el laburo.", en: "Hey, come, sit here and tell me what happened at work.", grammar: [g.voseo], vocab: [w.che, w.veni, w.sentate, w.aca, w.contame, w.laburo] }
      - { es: "¿Tenés tiempo mañana? Querés venir al asado, ¿no?", en: "Do you have time tomorrow? You want to come to the barbecue, don't you?", grammar: [g.voseo], vocab: [w.tenes, w.queres, w.asado] }
      - { es: "Vos podés hacerlo, pibe; sabés más de lo que creés.", en: "You can do it, kid; you know more than you think.", grammar: [g.voseo], vocab: [w.podes, w.pibe, w.sabes], note: "creés is the vos form of creer." }
      - { es: "Decime la verdad: ¿tomaste mate con mi hermana o no?", en: "Tell me the truth: did you have mate with my sister or not?", grammar: [g.voseo], vocab: [w.decime, w.mate, w.verdad], note: "The preterite is the same as with tú: tomaste." }
      - { es: "El voseo no cambia la raíz del verbo: se dice tenés, no tienes; podés, no puedes.", en: "Voseo does not change the verb stem: you say tenés, not tienes; podés, not puedes.", grammar: [g.voseo], vocab: [w.tenes, w.podes, w.verbo], note: "raíz = stem, root." }
      - { es: "¡Qué bárbaro! ¿Vos sabés cuánto cuesta ese auto? — Ni idea, che.", en: "Wow! Do you know how much that car costs? — No idea, mate.", grammar: [g.voseo], vocab: [w.barbaro, w.sabes, w.auto, w.che] }
      - { es: "Mirá, si vos querés laburar acá, tenés que llegar temprano.", en: "Look, if you want to work here, you have to arrive early.", grammar: [g.voseo], vocab: [w.mira, w.queres, w.laburar, w.tenes] }
      - { es: "Andá a comprar el pan y decile a tu hermano que venga.", en: "Go and buy the bread and tell your brother to come.", grammar: [g.voseo], vocab: [w.anda, w.pan, w.hermano], note: "decile = dile (vos imperative + le)." }
      - { es: "Con vos el pronombre te no cambia: vos te acostás tarde con tu hermano.", en: "With vos the pronoun te does not change: you go to bed late with your brother.", grammar: [g.voseo], vocab: [w.vos, w.pronombre, w.acostarse] }
      - { es: "¿Sos argentina? — Sí, soy porteña, pero mi mamá es de Paraguay, donde también se vosea.", en: "Are you Argentinian? — Yes, I'm from Buenos Aires, but my mum is from Paraguay, where vos is also used.", grammar: [g.voseo], vocab: [w.sos, w.argentino], note: "vosear = to use vos." }
      - { es: "En Centroamérica alternan vos y usted; en Chile el voseo es informal y suena distinto: «¿tú tenís?».", en: "In Central America vos and usted alternate; in Chile voseo is informal and sounds different: '¿tú tenís?'.", grammar: [g.voseo], vocab: [w.usted, w.informal, w.distinto] }
      - { es: "El subjuntivo con vos es igual que con tú: que vos tengas suerte, pibe.", en: "The subjunctive with vos is the same as with tú: may you have luck, kid.", grammar: [g.voseo], vocab: [w.subjuntivo, w.suerte, w.pibe] }
      - { es: "Che, ¿vos tenés frío? Vení, tomá un mate calentito.", en: "Hey, are you cold? Come, have a nice warm mate.", grammar: [g.voseo], vocab: [w.che, w.tenes, w.veni, w.mate], note: "tomá: vos imperative of tomar." }
      - { es: "¿Vos tenés hermanos?", en: "Do you have brothers and sisters?", grammar: [g.voseo], vocab: [w.tenes, w.hermano], error: { wrong: "¿Vos tienes hermanos?", explain: "With vos the verb takes its own form without stem change: vos tenés (tienes goes with tú).", grammar: g.voseo } }
      - { es: "Tú eres muy simpático, ¿quieres un café?", en: "You are very nice, do you want a coffee?", grammar: [g.voseo], vocab: [w.simpatico, w.cafe], transform: { instruction: "Say it with voseo (Río de la Plata)", answer: "Vos sos muy simpático, ¿querés un café?", alt: ["Sos muy simpático, ¿querés un café?"] } }
    exchanges:
      - q: { es: "¿Vos de dónde sos?", en: "Where are you from?" }
        a: { es: "Soy de Rosario, ¿y vos?", en: "I'm from Rosario, and you?" }
        alt: ["De acá, de Buenos Aires.", "Soy uruguaya, de Montevideo."]
        grammar: [g.voseo]
        vocab: [w.vos, w.sos]
      - q: { es: "¿Tenés tiempo mañana para un café?", en: "Do you have time tomorrow for a coffee?" }
        a: { es: "Dale, a las cinco en el bar de siempre.", en: "Sure, at five in the usual bar." }
        alt: ["Mañana no puedo, che; ¿el jueves?"]
        grammar: [g.voseo]
        vocab: [w.tenes, w.dale]
      - q: { es: "Contame, ¿qué tal el laburo nuevo?", en: "Tell me, how's the new job?" }
        a: { es: "Bárbaro; el jefe es un pibe muy copado y laburo cerca de casa.", en: "Great; the boss is a really cool young guy and I work close to home." }
        alt: ["Bien, pero laburo muchísimo."]
        grammar: [g.voseo]
        vocab: [w.contame, w.laburo, w.barbaro, w.pibe]
      - q: { es: "Che, ¿vos sabés dónde queda la cancha?", en: "Hey, do you know where the stadium is?" }
        a: { es: "Sí, andá derecho dos cuadras y después doblá a la izquierda.", en: "Yes, go straight for two blocks and then turn left." }
        alt: ["Ni idea, preguntale a aquel señor."]
        grammar: [g.voseo]
        vocab: [w.sabes, w.anda, w.izquierda]
    texts:
      - title: "Mensaje de WhatsApp desde Buenos Aires"
        es: ["Che, ¿qué hacés el sábado? Hacemos un asado en casa de Lucas.", "Vení a las dos y traé algo para tomar.", "Si no podés, avisame, ¿dale?"]
        en: ["Hey, what are you doing on Saturday? We're having a barbecue at Lucas's house.", "Come at two and bring something to drink.", "If you can't, let me know, OK?"]
        grammar: [g.voseo]
        vocab: [w.che, w.asado, w.veni, w.podes, w.dale]
  - id: b2.u12.l3
    title: "¿Ustedes vienen?"
    teach: [g.ustedes-vs-vosotros]
    vocab: [w.cortesia, w.tuteo, w.anfitrion, w.bienvenida, w.discurso, w.conferencia, w.congreso, w.asistente, w.participante, w.inscripcion, w.organizador, w.agradecimiento, w.respeto, w.respetuoso, w.amabilidad, w.sobrino, w.suegro, w.cunado, w.servirse]
    tip: "Spain: vosotros for friends (¿venís? os espero, vuestra casa) and ustedes for formality. Latin America and the Canaries: ustedes for everyone, with third-person verbs and pronouns (¿vienen? los espero, su casa). Imperative: venid → vengan, sentaos → siéntense."
    sentences:
      - { es: "¿Vosotros venís a la conferencia? — En América dirían: ¿ustedes vienen a la conferencia?", en: "Are you (all) coming to the lecture? — In the Americas they'd say: ¿ustedes vienen a la conferencia?", grammar: [g.ustedes-vs-vosotros], vocab: [w.vosotros, w.ustedes, w.conferencia] }
      - { es: "Señores, siéntense, por favor; el discurso de bienvenida empieza en cinco minutos.", en: "Ladies and gentlemen, please sit down; the welcome speech starts in five minutes.", grammar: [g.ustedes-vs-vosotros], vocab: [w.discurso, w.bienvenida, w.sentarse] }
      - { es: "Niños, lavaos las manos; en México, la abuela diría «lávense las manos».", en: "Children, wash your hands; in Mexico, grandma would say 'lávense las manos'.", grammar: [g.ustedes-vs-vosotros], vocab: [w.lavarse, w.mano, w.abuela] }
      - { es: "Los anfitriones nos recibieron con muchísima amabilidad: «Pasen, sírvanse, están en su casa».", en: "The hosts received us with great kindness: 'Come in, help yourselves, make yourselves at home'.", grammar: [g.ustedes-vs-vosotros], vocab: [w.anfitrion, w.amabilidad, w.servirse] }
      - { es: "¿Habéis terminado la inscripción? — Perdona, soy canaria: ¿han terminado la inscripción?", en: "Have you (all) finished the registration? — Sorry, I'm Canarian: ¿han terminado la inscripción?", grammar: [g.ustedes-vs-vosotros], vocab: [w.inscripcion, w.canario, w.terminar] }
      - { es: "En Bogotá, incluso entre amigos, el usted es señal de respeto y cortesía, no de distancia.", en: "In Bogotá, even among friends, usted is a sign of respect and courtesy, not distance.", grammar: [g.ustedes-vs-vosotros], vocab: [w.respeto, w.cortesia, w.usted], note: "distancia = distance." }
      - { es: "Mis sobrinos y mis cuñados viven en Chile; cuando los visito, les hablo de ustedes sin darme cuenta.", en: "My nephews and my brothers-in-law live in Chile; when I visit them, I address them as ustedes without realising.", grammar: [g.ustedes-vs-vosotros], vocab: [w.sobrino, w.cunado, w.darse-cuenta] }
      - { es: "Para cambiar de vosotros a ustedes, cambia el verbo (-áis → -an), el pronombre (os → los, les, se) y el posesivo (vuestro → su).", en: "To switch from vosotros to ustedes, change the verb (-áis → -an), the pronoun (os → los, les, se) and the possessive (vuestro → su).", grammar: [g.ustedes-vs-vosotros], vocab: [w.verbo, w.pronombre, w.vuestro] }
      - { es: "Queridos participantes: les damos la bienvenida al congreso y les agradecemos su asistencia.", en: "Dear participants: we welcome you to the conference and thank you for your attendance.", grammar: [g.ustedes-vs-vosotros], vocab: [w.participante, w.bienvenida, w.congreso, w.asistencia] }
      - { es: "Los organizadores pidieron a los asistentes que apagaran sus móviles; en España habrían dicho «vuestros móviles» a un público joven.", en: "The organisers asked the attendees to switch off their phones; in Spain they would have said 'vuestros móviles' to a young audience.", grammar: [g.ustedes-vs-vosotros, g.reported-commands], vocab: [w.organizador, w.asistente, w.apagar] }
      - { es: "El tuteo es normal en España hasta con desconocidos; en muchos países americanos resulta poco respetuoso.", en: "Using tú is normal in Spain even with strangers; in many American countries it comes across as not very respectful.", grammar: [g.ustedes-vs-vosotros], vocab: [w.tuteo, w.respetuoso, w.desconocido] }
      - { es: "Mi suegra, que es venezolana, nunca dice «vosotros»; a mis padres les dice «ustedes» con todo el cariño.", en: "My mother-in-law, who is Venezuelan, never says 'vosotros'; she says 'ustedes' to my parents with all affection.", grammar: [g.ustedes-vs-vosotros, g.pronoun-redundancy], vocab: [w.suegro, w.carino, w.padres], note: "venezolano = Venezuelan." }
      - { es: "¡Qué agradecimiento tan bonito! «Gracias a todos ustedes por venir» funciona en cualquier país.", en: "What a lovely thank-you! 'Gracias a todos ustedes por venir' works in any country.", grammar: [g.ustedes-vs-vosotros], vocab: [w.agradecimiento, w.pais] }
      - { es: "¿Ustedes quieren algo de beber? — Vosotros preguntáis igual, pero con otro verbo: ¿queréis algo de beber?", en: "Do you (all) want something to drink? — You ask the same, but with another verb form: ¿queréis algo de beber?", grammar: [g.ustedes-vs-vosotros], vocab: [w.beber, w.querer] }
      - { es: "Niños, siéntense y escuchen a la abuela.", en: "Children, sit down and listen to grandma.", grammar: [g.ustedes-vs-vosotros], vocab: [w.sentarse, w.escuchar], error: { wrong: "Niños, siéntense y escuchad a la abuela.", explain: "Keep one system: ustedes forms together (siéntense y escuchen) or vosotros forms together (sentaos y escuchad).", grammar: g.ustedes-vs-vosotros } }
      - { es: "¿Vosotros ya lo sabíais? Os lo dije en vuestra casa.", en: "Did you (all) already know? I told you at your house.", grammar: [g.ustedes-vs-vosotros], vocab: [w.saber, w.casa], transform: { instruction: "Change to the ustedes system (Latin America)", answer: "¿Ustedes ya lo sabían? Se lo dije en su casa.", alt: ["¿Ustedes ya lo sabían? Les lo dije en su casa."] } }
    exchanges:
      - q: { es: "¿Ustedes quieren algo de beber?", en: "Do you (all) want something to drink?" }
        a: { es: "Sí, gracias, dos aguas; y muchísimas gracias por la bienvenida.", en: "Yes, thanks, two waters; and thank you so much for the welcome." }
        alt: ["No, gracias, estamos bien.", "Un café para los dos, por favor."]
        grammar: [g.ustedes-vs-vosotros]
        vocab: [w.beber, w.bienvenida]
      - q: { es: "¿Vosotros habéis estado alguna vez en Canarias?", en: "Have you (all) ever been to the Canaries?" }
        a: { es: "Sí, y nos sorprendió que allí también digan ustedes, como en América.", en: "Yes, and we were surprised that there they also say ustedes, like in the Americas." }
        alt: ["Todavía no, pero queremos ir este verano."]
        grammar: [g.ustedes-vs-vosotros]
        vocab: [w.canario, w.sorprender]
      - q: { es: "¿Puedo tratar de tú a mi suegra colombiana?", en: "Can I address my Colombian mother-in-law as tú?" }
        a: { es: "Yo esperaría a que ella te lo pidiera; allí el usted es cortesía, no frialdad.", en: "I'd wait for her to ask you to; there usted is courtesy, not coldness." }
        alt: ["Mejor usted al principio, por respeto."]
        grammar: [g.ustedes-vs-vosotros]
        vocab: [w.suegro, w.cortesia, w.respeto]
      - q: { es: "Señores, ¿han terminado ya la inscripción?", en: "Have you (all) finished the registration yet?" }
        a: { es: "Sí, ya está; les agradecemos su amabilidad.", en: "Yes, it's done; we thank you for your kindness." }
        alt: ["Todavía no; nos falta la firma."]
        grammar: [g.ustedes-vs-vosotros]
        vocab: [w.inscripcion, w.amabilidad]
    texts:
      - title: "Discurso de bienvenida (versión para España)"
        es: ["Buenas tardes a todos y bienvenidos al congreso.", "Os agradecemos vuestra asistencia y os pedimos que apaguéis los móviles.", "Sentaos, por favor; empezamos en cinco minutos."]
        en: ["Good afternoon everyone and welcome to the conference.", "We thank you for your attendance and ask you to switch off your phones.", "Please sit down; we start in five minutes."]
        grammar: [g.ustedes-vs-vosotros]
        vocab: [w.congreso, w.asistencia, w.sentarse]
      - title: "El mismo discurso (versión para América)"
        es: ["Buenas tardes a todos y bienvenidos al congreso.", "Les agradecemos su asistencia y les pedimos que apaguen los celulares.", "Siéntense, por favor; empezamos en cinco minutos."]
        en: ["Good afternoon everyone and welcome to the conference.", "We thank you for your attendance and ask you to switch off your phones.", "Please sit down; we start in five minutes."]
        grammar: [g.ustedes-vs-vosotros]
        vocab: [w.congreso, w.celular, w.sentarse]
  - id: b2.u12.l4
    title: Repaso B2
    teach: [g.b2-review]
    vocab: [w.certificado, w.dominio, w.fluidez, w.soltura, w.destreza, w.recompensa, w.estancia, w.inmersion, w.matiz, w.subjuntivo, w.indicativo, w.perfeccionar, w.merecer-la-pena]
    tip: "B2 in one lesson: indicative for facts and known things, subjunctive for wishes, doubts, judgements, future time and unreal conditions; si + imperfect subjunctive → conditional; si + pluperfect subjunctive → conditional perfect; reported speech shifts tenses; passives and periphrases for formal, precise Spanish."
    sentences:
      - { es: "Si hubiera hecho un intercambio a los veinte años, ahora hablaría con más soltura.", en: "If I had done an exchange at twenty, I would speak with more ease now.", grammar: [g.b2-review, g.si-clauses-past], vocab: [w.intercambio, w.soltura] }
      - { es: "Ojalá hubiese empezado antes; a estas alturas tendría ya el certificado de B2.", en: "I wish I had started earlier; by now I would already have the B2 certificate.", grammar: [g.b2-review, g.ojala-pluperfect], vocab: [w.a-estas-alturas, w.certificado] }
      - { es: "Me dijo que no creía que la inmersión total fuera necesaria, pero que ayudaba muchísimo.", en: "She told me she didn't think total immersion was necessary, but that it helped enormously.", grammar: [g.b2-review, g.reported-speech-subjunctive], vocab: [w.inmersion, w.ayudar] }
      - { es: "Por mucho que estudies gramática, no conseguirás fluidez hasta que hables con nativos.", en: "However much grammar you study, you won't achieve fluency until you talk with native speakers.", grammar: [g.b2-review, g.por-mucho-que, g.hasta-que], vocab: [w.fluidez, w.gramatica, w.nativo] }
      - { es: "Aunque el subjuntivo parezca difícil, se trata de una cuestión de práctica; ¡no es que sea imposible!", en: "Even if the subjunctive seems difficult, it is a question of practice; it's not that it's impossible!", grammar: [g.b2-review, g.aunque-indicative-subjunctive, g.opinion-structures], vocab: [w.subjuntivo, w.tratarse-de, w.cuestion] }
      - { es: "El examen fue aprobado por el noventa por ciento de los alumnos; se corrigió en una semana.", en: "The exam was passed by ninety per cent of the students; it was marked in a week.", grammar: [g.b2-review, g.passive-advanced], vocab: [w.examen, w.aprobar, w.corregir] }
      - { es: "Llevo dos años perfeccionando mi español y sigo descubriendo matices nuevos cada semana.", en: "I've been perfecting my Spanish for two years and I keep discovering new nuances every week.", grammar: [g.b2-review, g.periphrases-aspect], vocab: [w.perfeccionar, w.matiz, w.descubrir] }
      - { es: "Deberías haber aprovechado tu estancia en Sevilla para hablar más; te habría dado más destreza oral.", en: "You should have taken advantage of your stay in Seville to speak more; it would have given you more oral skill.", grammar: [g.b2-review, g.deber-haber, g.conditional-perfect], vocab: [w.estancia, w.aprovechar, w.destreza] }
      - { es: "Habla como si fuera nativa, y eso que empezó hace tres años.", en: "She speaks as if she were a native, and that despite starting three years ago.", grammar: [g.b2-review, g.como-si], vocab: [w.nativo, w.empezar], note: "y eso que = even though." }
      - { es: "Lo que más recompensa da no es el certificado, sino el dominio real de la lengua.", en: "What gives the most reward is not the certificate but real command of the language.", grammar: [g.b2-review, g.emphatic-structures, g.neutral-lo], vocab: [w.recompensa, w.certificado, w.dominio] }
      - { es: "A mí me cuesta el indicativo después de «aunque»; a ti, en cambio, te cuesta el subjuntivo.", en: "I find the indicative after 'aunque' hard; you, on the other hand, find the subjunctive hard.", grammar: [g.b2-review, g.pronoun-redundancy], vocab: [w.indicativo, w.subjuntivo, w.en-cambio] }
      - { es: "Cuando termines el curso, pide que te hagan una prueba oral para que midan tu fluidez.", en: "When you finish the course, ask them to give you an oral test so that they measure your fluency.", grammar: [g.b2-review, g.temporal-clauses-advanced, g.purpose-clauses-advanced], vocab: [w.prueba, w.medir, w.fluidez] }
      - { es: "Si no hubiera sido por mi profesora, habría abandonado; a ella le debo mi soltura.", en: "If it hadn't been for my teacher, I would have given up; I owe my fluency to her.", grammar: [g.b2-review, g.si-clauses-past, g.pronoun-redundancy], vocab: [w.abandonar, w.soltura, w.deber] }
      - { es: "¿Merece la pena una estancia de inmersión? — Sin duda: en un mes aprendes lo que en un año de clases.", en: "Is an immersion stay worth it? — Without doubt: in a month you learn what you would in a year of classes.", grammar: [g.b2-review, g.impersonal-expressions], vocab: [w.merecer-la-pena, w.inmersion, w.aprender] }
      - { es: "Si tuviera más tiempo, haría un intercambio en Argentina.", en: "If I had more time, I would do an exchange in Argentina.", grammar: [g.b2-review, g.si-clauses-unreal], vocab: [w.intercambio, w.tiempo], error: { wrong: "Si tendría más tiempo, haría un intercambio en Argentina.", explain: "After si, an unreal condition takes the imperfect subjunctive, never the conditional: si tuviera.", grammar: g.b2-review } }
      - { es: "«No estudies solo gramática; habla con la gente», me aconsejó mi profesora.", en: "'Don't just study grammar; talk to people', my teacher advised me.", grammar: [g.b2-review, g.reported-commands], vocab: [w.aconsejar, w.gramatica], transform: { instruction: "Report the advice in the past (Mi profesora me aconsejó que…)", answer: "Mi profesora me aconsejó que no estudiara solo gramática y que hablara con la gente.", alt: ["Mi profesora me aconsejó que no estudiase solo gramática y que hablase con la gente."] } }
    exchanges:
      - q: { es: "¿Qué habrías hecho distinto para aprender español?", en: "What would you have done differently to learn Spanish?" }
        a: { es: "Habría hecho una estancia de inmersión mucho antes; si la hubiera hecho, hoy hablaría con más soltura.", en: "I would have done an immersion stay much earlier; if I had, today I'd speak with more ease." }
        alt: ["Habría hablado más y estudiado menos gramática.", "Nada; estoy contento con mi progreso."]
        grammar: [g.b2-review]
        vocab: [w.estancia, w.inmersion, w.soltura]
      - q: { es: "¿Crees que merece la pena sacarse el certificado?", en: "Do you think it's worth getting the certificate?" }
        a: { es: "Hasta cierto punto; lo importante es el dominio real, aunque el papel ayude a encontrar trabajo.", en: "Up to a point; the important thing is real command, even if the piece of paper helps you find work." }
        alt: ["Sin duda, sobre todo para trabajar.", "No es que no sirva, es que no es lo esencial."]
        grammar: [g.b2-review]
        vocab: [w.merecer-la-pena, w.certificado, w.dominio]
      - q: { es: "¿Qué te dijo la profesora sobre tu fluidez?", en: "What did the teacher tell you about your fluency?" }
        a: { es: "Me dijo que había mejorado muchísimo y que siguiera practicando los matices del subjuntivo.", en: "She told me I had improved enormously and to keep practising the nuances of the subjunctive." }
        alt: ["Que hablara más despacio y con menos miedo."]
        grammar: [g.b2-review]
        vocab: [w.fluidez, w.matiz, w.subjuntivo]
      - q: { es: "Por mucho que estudio, no avanzo. ¿Qué hago?", en: "However much I study, I don't make progress. What do I do?" }
        a: { es: "Yo que tú hablaría cada día con nativos, aunque fuera diez minutos.", en: "If I were you I'd talk to native speakers every day, even if only for ten minutes." }
        alt: ["Deberías haber empezado por hablar, no por la gramática; aún estás a tiempo."]
        grammar: [g.b2-review]
        vocab: [w.yo-que-tu, w.nativo]
    texts:
      - title: "Correo de fin de curso"
        es: ["Queridos alumnos: a estas alturas ya dominan el subjuntivo, las condiciones y el estilo indirecto.", "Si hubieran empezado con miedo, no habrían llegado hasta aquí; sigan practicando con la misma soltura.", "Ojalá que la estancia de inmersión del verano les dé la recompensa que merecen.", "Ha sido un placer acompañarlos."]
        en: ["Dear students: by now you already command the subjunctive, conditions and reported speech.", "If you had started out afraid, you wouldn't have got this far; keep practising with the same ease.", "I hope the summer immersion stay gives you the reward you deserve.", "It has been a pleasure to accompany you."]
        grammar: [g.b2-review, g.ustedes-vs-vosotros]
        vocab: [w.a-estas-alturas, w.subjuntivo, w.soltura, w.recompensa]
dialogues:
  - id: b2.u12.d1
    title: Un café entre Madrid y Buenos Aires
    context: Paula, from Madrid, and Martín, from Buenos Aires, meet for the first time at a language exchange and compare their ways of speaking.
    lines:
      - { speaker: Martín, es: "¿Vos sos la que organiza el intercambio? Che, qué bueno conocerte.", en: "Are you the one who organises the exchange? Hey, great to meet you." }
      - { speaker: Paula, es: "Sí, soy yo. ¿Y vosotros habéis venido todos de Argentina?", en: "Yes, that's me. And have you all come from Argentina?" }
      - { speaker: Martín, es: "Casi todos. Mirá, en casa decimos «ustedes», así que lo de «vosotros» me suena a película antigua.", en: "Almost all of us. Look, at home we say 'ustedes', so 'vosotros' sounds like an old film to me." }
      - { speaker: Paula, es: "¡Y a mí el «vos» me suena a tango! Pero se entiende todo, ¿no?", en: "And to me 'vos' sounds like a tango! But everything's understood, isn't it?" }
      - { speaker: Martín, es: "Todo. Lo único: ayer pedí un jugo y la camarera me miró raro. Acá es «zumo», ¿viste?", en: "Everything. The only thing: yesterday I asked for a 'jugo' and the waitress looked at me oddly. Here it's 'zumo', you see?" }
      - { speaker: Paula, es: "Y nosotros aparcamos el coche, mientras que vos estacionás el auto.", en: "And we 'aparcamos el coche', while you 'estacionás el auto'." }
      - { speaker: Martín, es: "¡Bárbaro, ya voseás! Si seguís así, en un mes hablás como una porteña.", en: "Brilliant, you're already using vos! If you keep going like that, in a month you'll talk like a Buenos Aires local." }
      - { speaker: Paula, es: "Lo que no consigo es la pronunciación: eso de la «sh» en «calle»… Me da vergüenza intentarlo.", en: "What I can't manage is the pronunciation: that 'sh' thing in 'calle'… I'm embarrassed to try." }
      - { speaker: Martín, es: "No te dé vergüenza; lo importante es entenderse. Yo todavía no sé si en España «coger» se puede decir.", en: "Don't be embarrassed; the important thing is understanding each other. I still don't know if in Spain you can say 'coger'." }
      - { speaker: Paula, es: "Aquí sí, tranquilo: cogemos el autobús todos los días. ¿Tomamos otro café?", en: "Here yes, don't worry: we 'cogemos el autobús' every day. Shall we have another coffee?" }
      - { speaker: Martín, es: "Dale. Pero la próxima vez tomamos mate, que lo traje de allá.", en: "Sure. But next time we'll have mate, I brought it from over there." }
    questions:
      - { q: "Why did the waitress look at Martín oddly?", options: ["He asked for a 'jugo' instead of a 'zumo'", "He didn't pay", "He spoke too loudly"], answer: 0 }
      - { q: "What does Paula find hard?", options: ["The vocabulary", "The 'sh' pronunciation of ll", "Using usted"], answer: 1 }
      - { q: "What does Martín propose for next time?", options: ["Going to Argentina", "Drinking mate he brought from home", "Watching a film"], answer: 1 }
