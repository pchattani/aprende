# A1 grammar notes. Explanations use light markdown: ### headings, bullets,
# tables, **bold**, *italic* (italic = Spanish example inline).
- id: g.greetings
  level: a1
  title: "Greetings and goodbyes"
  summary: "Hola, buenos días, buenas tardes, buenas noches, adiós, hasta luego."
  explanation: |
    ### Saying hello
    - *Hola* works at any time, with anyone.
    - *Buenos días* until lunch (about 2 pm in Spain), *buenas tardes* until dark, *buenas noches* in the evening and also as "good night".
    - Casual: *¿Qué tal?* (how's it going?), *¿Cómo estás?* (informal), *¿Cómo está?* (formal).

    ### Saying goodbye
    - *Adiós* (goodbye), *hasta luego* (see you later — the most common), *hasta mañana* (see you tomorrow), *hasta pronto* (see you soon), *chao* (informal, from Italian).
    - Replies to *¿Cómo estás?*: *Bien, gracias. ¿Y tú?* / *Muy bien.* / *Regular.* / *Mal.*
  examples:
    - { es: "¡Hola! ¿Qué tal?", en: "Hi! How's it going?" }
    - { es: "Buenos días, señora García.", en: "Good morning, Mrs García." }
    - { es: "Bien, gracias. ¿Y usted?", en: "Fine, thanks. And you? (formal)" }
    - { es: "Hasta luego.", en: "See you later." }
  pitfalls:
    - "*Buenas noches* is both 'good evening' (arriving) and 'good night' (leaving)."
    - "Spaniards often shorten to *¡Buenas!* for any time of day."
  variant: "In Latin America *buenos días* often lasts until noon and *buen día* is common in Argentina."
  drills:
    - { es: "Buenas tardes, ¿cómo está usted?", en: "Good afternoon, how are you? (formal)" }
    - { es: "Hasta mañana, Pedro.", en: "See you tomorrow, Pedro." }
- id: g.subject-pronouns
  level: a1
  title: "Subject pronouns (yo, tú, él…)"
  summary: "Spanish verbs show the subject in their ending, so pronouns are often dropped."
  explanation: |
    | Person | Singular | Plural |
    |---|---|---|
    | 1st | *yo* (I) | *nosotros / nosotras* (we) |
    | 2nd informal | *tú* (you) | *vosotros / vosotras* (you all, Spain) |
    | 3rd / formal | *él* (he), *ella* (she), *usted* (you, formal) | *ellos / ellas* (they), *ustedes* (you all, formal) |

    ### Dropping the pronoun
    Because *hablo* can only mean "I speak", Spanish usually leaves out *yo*: *Hablo español.* Use the pronoun for contrast or emphasis: *Yo soy de Madrid, y tú?*

    ### Gender in plurals
    *Nosotras / vosotras / ellas* for all-female groups; mixed groups use the masculine.

    *Usted* and *ustedes* are grammatically third person: *Usted habla* (like *él habla*).
  examples:
    - { es: "Yo soy Ana y ella es Marta.", en: "I am Ana and she is Marta." }
    - { es: "¿Vosotros sois de aquí?", en: "Are you (all) from here?" }
    - { es: "Usted es muy amable.", en: "You are very kind. (formal)" }
  pitfalls:
    - "There is no pronoun for 'it' as a subject: *Es grande* = it is big."
    - "Don't say *yo* in every sentence — it sounds emphatic."
  variant: "Latin America does not use *vosotros*; *ustedes* is the only plural \"you\" and is not especially formal."
  drills:
    - { es: "Nosotras somos amigas.", en: "We (women) are friends." }
    - { es: "Ellos son profesores.", en: "They are teachers." }
- id: g.ser-present
  level: a1
  title: "The verb ser (to be) — identity"
  summary: "soy, eres, es, somos, sois, son — for who or what something is."
  explanation: |
    | | ser |
    |---|---|
    | yo | **soy** |
    | tú | **eres** |
    | él / ella / usted | **es** |
    | nosotros/as | **somos** |
    | vosotros/as | **sois** |
    | ellos / ellas / ustedes | **son** |

    Use *ser* for permanent or defining characteristics:
    - **Identity and names**: *Soy Carlos.*
    - **Origin and nationality**: *Somos de Sevilla.* *Es italiana.*
    - **Profession**: *Eres médico.*
    - **Description** (character, appearance): *Es alta y simpática.*
    - **Time and dates**: *Son las tres.* *Hoy es lunes.*

    Spanish has a second verb "to be", *estar*, for location and temporary states (see *estar*).
  examples:
    - { es: "Soy estudiante.", en: "I am a student." }
    - { es: "¿Eres de Barcelona?", en: "Are you from Barcelona?" }
    - { es: "Ellas son hermanas.", en: "They are sisters." }
  pitfalls:
    - "No article with professions: *soy profesor*, not *soy un profesor*."
    - "*es* also means 'it is': *Es fácil.*"
  drills:
    - { es: "Somos amigos de Juan.", en: "We are Juan's friends." }
    - { es: "Vosotros sois muy simpáticos.", en: "You (all) are very nice." }
- id: g.llamarse
  level: a1
  title: "Me llamo… — saying your name"
  summary: "llamarse literally means \"to call oneself\": me llamo, te llamas, se llama."
  explanation: |
    - *Me llamo Ana.* = I am called Ana (my name is Ana).
    - *¿Cómo te llamas?* = What is your name? (informal)
    - *¿Cómo se llama (usted)?* = What is your name? (formal) — also "What is his/her name?"
    - *Se llama Pedro.* = His name is Pedro.

    The little word changes with the person: *me, te, se, nos, os, se*. These are reflexive pronouns; you will meet them again with daily-routine verbs.

    You can also say *Mi nombre es Ana* (literally "my name is"), which is correct but more formal or written.
  examples:
    - { es: "Hola, me llamo Lucía. ¿Y tú?", en: "Hi, my name is Lucía. And you?" }
    - { es: "¿Cómo se llama su hijo?", en: "What is your son's name? (formal)" }
    - { es: "Nos llamamos Pablo y Marta.", en: "Our names are Pablo and Marta." }
  pitfalls:
    - "Never *me llamo es Ana*. Either *me llamo Ana* or *mi nombre es Ana*."
  drills:
    - { es: "¿Cómo te llamas?", en: "What is your name?" }
    - { es: "Ella se llama Carmen.", en: "Her name is Carmen." }
- id: g.tu-vs-usted
  level: a1
  title: "Tú or usted? Informal and formal \"you\""
  summary: "tú for friends, family, young people and colleagues; usted for strangers, older people and service situations."
  explanation: |
    - **tú** (informal) takes the second-person verb: *¿Cómo estás? ¿De dónde eres?*
    - **usted** (formal) takes the third-person verb, like *él/ella*: *¿Cómo está? ¿De dónde es?*

    In Spain, *tú* is used far more than in many other cultures: with shop assistants your age, colleagues, and anyone you would be on first-name terms with. Use *usted* with elderly people, in official settings (police, bank), and when someone addresses you as *usted*.

    Plural: *vosotros/as* (informal, Spain) and *ustedes* (formal).
  examples:
    - { es: "¿Tú eres Marta?", en: "Are you Marta? (informal)" }
    - { es: "¿Usted es el director?", en: "Are you the director? (formal)" }
    - { es: "¿Ustedes son de Madrid?", en: "Are you (all) from Madrid? (formal)" }
  pitfalls:
    - "*Usted* is often abbreviated *Ud.* or *Vd.* in writing."
  variant: "In Latin America *usted* is more frequent; in much of Colombia and Costa Rica even friends use it, while Argentina and Uruguay use *vos* instead of *tú*."
  drills:
    - { es: "¿Cómo está usted, señor López?", en: "How are you, Mr López?" }
    - { es: "¿De dónde eres tú?", en: "Where are you from?" }
- id: g.gender-nouns
  level: a1
  title: "Gender — every noun is masculine or feminine"
  summary: "Most nouns in -o are masculine and most in -a are feminine; learn each noun with its article."
  explanation: |
    Every Spanish noun has a gender, even objects: *el libro* (m), *la mesa* (f).

    ### Usually masculine
    - ending in **-o**: *el chico, el libro, el vino*
    - ending in **-or, -aje, -án**: *el color, el viaje, el pan*
    - days, months, numbers, languages: *el lunes, el español*

    ### Usually feminine
    - ending in **-a**: *la casa, la chica*
    - ending in **-ción, -sión, -dad, -tad, -tud, -umbre**: *la canción, la ciudad, la universidad*

    ### Watch out
    - Masculine in -a: *el día, el problema, el mapa, el idioma, el sistema, el programa, el clima, el tema.*
    - Feminine in -o: *la mano, la foto, la moto, la radio.*
    - Nouns in -e or a consonant can be either: *el coche, la noche, el papel, la sal* — learn them with the article.
    - Feminine nouns beginning with a stressed **a-/ha-** take *el/un* in the singular but stay feminine: *el agua fría, las aguas.*
  examples:
    - { es: "El problema es el dinero.", en: "The problem is money." }
    - { es: "La mano y el pie.", en: "The hand and the foot." }
    - { es: "El agua está fría.", en: "The water is cold." }
  pitfalls:
    - "Gender is not about meaning: *la persona* is feminine even for a man."
  drills:
    - { es: "La ciudad es grande.", en: "The city is big." }
    - { es: "El día es largo.", en: "The day is long." }
- id: g.articles-definite
  level: a1
  title: "The definite article — el, la, los, las"
  summary: "\"the\" agrees with the noun in gender and number."
  explanation: |
    | | singular | plural |
    |---|---|---|
    | masculine | **el** libro | **los** libros |
    | feminine | **la** casa | **las** casas |

    ### When Spanish uses "the" and English does not
    - Generalities: *Me gusta el café.* (I like coffee.) *Los perros son leales.*
    - Titles with a name: *la señora García, el doctor Ruiz* (but not when addressing them).
    - Days of the week: *el lunes* (on Monday), *los lunes* (on Mondays).
    - Times: *Son las dos.* *A las ocho.*
    - Body parts and clothes instead of "my": *Me lavo las manos.*
    - Languages after some verbs: *El español es fácil* (but *hablo español*).

    After *a* and *de*, *el* contracts: *al, del.*
  examples:
    - { es: "Los niños están en la escuela.", en: "The children are at school." }
    - { es: "El lunes tengo clase.", en: "On Monday I have class." }
    - { es: "Me gusta el chocolate.", en: "I like chocolate." }
  pitfalls:
    - "No article with *hablar* + language: *hablo inglés*."
  drills:
    - { es: "Las casas son blancas.", en: "The houses are white." }
    - { es: "El profesor habla con los estudiantes.", en: "The teacher talks with the students." }
- id: g.adjective-agreement
  level: a1
  title: "Adjectives agree with the noun"
  summary: "alto / alta / altos / altas — adjectives change for gender and number."
  explanation: |
    ### Four-form adjectives (ending in -o)
    *alto, alta, altos, altas* — *un chico alto, una chica alta, unos chicos altos.*

    ### Two-form adjectives (ending in -e or a consonant)
    Same for both genders, add *-s* / *-es* for the plural: *grande / grandes, azul / azules, feliz / felices.*

    ### Exceptions that do add -a
    Nationalities and adjectives in *-or, -án, -ón, -ín*: *español / española, francés / francesa, trabajador / trabajadora.* Note the accent disappears: *inglés → inglesa.*

    Mixed groups take the masculine plural: *Ana y Luis son altos.*
  examples:
    - { es: "Las casas son blancas y grandes.", en: "The houses are white and big." }
    - { es: "Mi hermana es inglesa.", en: "My sister is English." }
    - { es: "Los coches son azules.", en: "The cars are blue." }
  pitfalls:
    - "Adjectives in -ista are invariable for gender: *un chico optimista, una chica optimista.*"
  drills:
    - { es: "Una mujer trabajadora.", en: "A hard-working woman." }
    - { es: "Unos libros interesantes.", en: "Some interesting books." }
- id: g.ser-origin
  level: a1
  title: "Where are you from? — ser de + place"
  summary: "¿De dónde eres? Soy de Madrid. Soy español."
  explanation: |
    - *¿De dónde eres?* (informal) / *¿De dónde es usted?* (formal) — Where are you from?
    - Answer with **ser de + place**: *Soy de Londres.*
    - Or with a nationality adjective: *Soy inglés / inglesa.*

    Nationalities are written in lower case: *español, francesa, alemán, mexicano, argentina.* Countries take a capital: *España, Francia.*

    *Vivo en…* (I live in…) uses *en*, not *de*: *Soy de Perú pero vivo en Madrid.*
  examples:
    - { es: "¿De dónde sois? Somos de Valencia.", en: "Where are you (all) from? We are from Valencia." }
    - { es: "Ella es alemana y vive en Bilbao.", en: "She is German and lives in Bilbao." }
    - { es: "Mis padres son de Colombia.", en: "My parents are from Colombia." }
  pitfalls:
    - "No capital letters for nationalities or languages."
  drills:
    - { es: "Soy de Irlanda pero vivo en Sevilla.", en: "I am from Ireland but I live in Seville." }
    - { es: "¿De dónde es tu profesora?", en: "Where is your teacher from?" }
- id: g.negation
  level: a1
  title: "Saying no — no before the verb"
  summary: "Put no directly in front of the verb; answer questions with No, no…"
  explanation: |
    - *No* goes immediately before the verb (and before any object pronoun): *No soy de aquí.* *No me llamo Juan.*
    - To answer a question: *¿Eres médico? — No, no soy médico.* (Yes = *Sí*.)
    - *No* also means "not": *No es difícil.*
    - *Nunca* (never), *nada* (nothing), *nadie* (nobody) can replace *no* before the verb or follow *no* after it: *Nunca como carne.* / *No como nunca carne.*
  examples:
    - { es: "No hablo francés.", en: "I don't speak French." }
    - { es: "¿Es tu coche? No, no es mi coche.", en: "Is it your car? No, it isn't my car." }
    - { es: "No, gracias.", en: "No, thank you." }
  pitfalls:
    - "There is no 'do/does' helper: *no hablo* = I don't speak."
  drills:
    - { es: "Ella no es profesora.", en: "She is not a teacher." }
    - { es: "No somos de Madrid.", en: "We are not from Madrid." }
- id: g.possessives
  level: a1
  title: "Possessives — mi, tu, su, nuestro, vuestro"
  summary: "Short possessives agree in number (and nuestro/vuestro also in gender) with the thing owned."
  explanation: |
    | owner | singular thing | plural things |
    |---|---|---|
    | yo | *mi* | *mis* |
    | tú | *tu* | *tus* |
    | él / ella / usted | *su* | *sus* |
    | nosotros/as | *nuestro / nuestra* | *nuestros / nuestras* |
    | vosotros/as | *vuestro / vuestra* | *vuestros / vuestras* |
    | ellos / ellas / ustedes | *su* | *sus* |

    They agree with the **thing owned**, not the owner: *su casa* = his / her / your / their house; *sus casas* = their houses.

    Because *su* is ambiguous, Spanish often says *la casa de él / de ella / de usted.*
  examples:
    - { es: "Mis padres y mi hermana.", en: "My parents and my sister." }
    - { es: "Nuestra casa es pequeña.", en: "Our house is small." }
    - { es: "¿Es tu libro o su libro?", en: "Is it your book or his book?" }
  pitfalls:
    - "*tu* (your) has no accent; *tú* (you) does."
    - "*mi* and *tu* do not change for gender: *mi madre, mi padre.*"
  drills:
    - { es: "Vuestros amigos son simpáticos.", en: "Your (pl.) friends are nice." }
    - { es: "Sus hijos viven en Londres.", en: "Their children live in London." }
- id: g.plural-nouns
  level: a1
  title: "Plural nouns"
  summary: "Add -s after a vowel, -es after a consonant; -z becomes -ces."
  explanation: |
    - Vowel ending → **-s**: *casa → casas, coche → coches, café → cafés.*
    - Consonant ending → **-es**: *ciudad → ciudades, papel → papeles, rey → reyes.*
    - **-z → -ces**: *lápiz → lápices, luz → luces.*
    - Words ending in unstressed **-s** or **-x** do not change: *el lunes → los lunes, la crisis → las crisis.*
    - The written accent can move: *canción → canciones* (lost), *examen → exámenes* (gained) — the stress stays on the same vowel.
    - Family words in the masculine plural include both sexes: *los padres* (parents), *los hermanos* (brothers and sisters), *los reyes* (king and queen).
  examples:
    - { es: "Tengo dos hermanos y tres hermanas.", en: "I have two brothers and three sisters." }
    - { es: "Las ciudades españolas son bonitas.", en: "Spanish cities are pretty." }
    - { es: "Los lunes son difíciles.", en: "Mondays are hard." }
  pitfalls:
    - "*La gente* (people) is singular: *la gente es simpática.*"
  drills:
    - { es: "Los lápices están en la mesa.", en: "The pencils are on the table." }
    - { es: "Mis padres son médicos.", en: "My parents are doctors." }
- id: g.tener-present
  level: a1
  title: "The verb tener (to have)"
  summary: "tengo, tienes, tiene, tenemos, tenéis, tienen."
  explanation: |
    | | tener |
    |---|---|
    | yo | **tengo** |
    | tú | **tienes** |
    | él / ella / usted | **tiene** |
    | nosotros/as | **tenemos** |
    | vosotros/as | **tenéis** |
    | ellos / ellas / ustedes | **tienen** |

    *Tener* means to have / to own: *Tengo dos hermanos.* It is also used for age and for many feelings (see *tener expressions*): *Tengo veinte años. Tengo hambre.*

    Notice the pattern: *yo* is irregular (*tengo*), and the *e* becomes *ie* in the forms that are stressed on the stem (*tienes, tiene, tienen*), but not in *tenemos, tenéis*.
  examples:
    - { es: "¿Tienes hermanos?", en: "Do you have brothers or sisters?" }
    - { es: "Mi abuela tiene ochenta años.", en: "My grandmother is eighty years old." }
    - { es: "No tenemos coche.", en: "We don't have a car." }
  pitfalls:
    - "Age: *tengo 30 años*, never *soy 30 años*."
  drills:
    - { es: "Tenéis una casa muy grande.", en: "You (all) have a very big house." }
    - { es: "Ellos tienen dos perros.", en: "They have two dogs." }
- id: g.numbers-1-100
  level: a1
  title: "Numbers 0–100"
  summary: "uno, dos, tres… veinte, veintiuno… treinta y uno… cien."
  explanation: |
    0 cero · 1 uno · 2 dos · 3 tres · 4 cuatro · 5 cinco · 6 seis · 7 siete · 8 ocho · 9 nueve · 10 diez
    11 once · 12 doce · 13 trece · 14 catorce · 15 quince · 16 dieciséis · 17 diecisiete · 18 dieciocho · 19 diecinueve
    20 veinte · 21 veintiuno · 22 veintidós · 23 veintitrés · 24 veinticuatro · 25 veinticinco · 26 veintiséis · 27 veintisiete · 28 veintiocho · 29 veintinueve
    30 treinta · 31 treinta **y** uno · 40 cuarenta · 50 cincuenta · 60 sesenta · 70 setenta · 80 ochenta · 90 noventa · 100 cien

    - 16–29 are one word; from 31 the tens and units are joined with *y*: *cuarenta y cinco.*
    - *uno* becomes **un** before a masculine noun and **una** before a feminine: *veintiún años, treinta y una personas.*
    - *cien* alone, *ciento* when followed by more: *ciento dos.*
  examples:
    - { es: "Tengo veintiún años.", en: "I am twenty-one." }
    - { es: "Son cuarenta y cinco euros.", en: "It is forty-five euros." }
    - { es: "Hay treinta y una personas.", en: "There are thirty-one people." }
  pitfalls:
    - "Accents on *dieciséis, veintidós, veintitrés, veintiséis.*"
  drills:
    - { es: "Mi padre tiene cincuenta y ocho años.", en: "My father is fifty-eight." }
    - { es: "Cien euros, por favor.", en: "One hundred euros, please." }
- id: g.question-words
  level: a1
  title: "Question words — qué, quién, dónde, cuándo, cómo, cuál, cuánto, por qué"
  summary: "Question words carry an accent and the question opens with ¿."
  explanation: |
    | | |
    |---|---|
    | *¿Qué?* | What? / Which? (before a noun) |
    | *¿Quién? / ¿Quiénes?* | Who? |
    | *¿Dónde?* | Where? (*¿De dónde?* Where from? *¿Adónde?* Where to?) |
    | *¿Cuándo?* | When? |
    | *¿Cómo?* | How? / What…like? |
    | *¿Cuál? / ¿Cuáles?* | Which (one/s)? |
    | *¿Cuánto/a/os/as?* | How much / many? (agrees with the noun) |
    | *¿Por qué?* | Why? (answer: *porque* = because) |

    Yes/no questions keep normal word order and change only intonation: *¿Eres de aquí?*

    Prepositions go in front of the question word, never at the end: *¿Con quién vives?* (Who do you live with?)
  examples:
    - { es: "¿Dónde vives?", en: "Where do you live?" }
    - { es: "¿Cuántos años tienes?", en: "How old are you?" }
    - { es: "¿Por qué estudias español? Porque me gusta.", en: "Why do you study Spanish? Because I like it." }
  pitfalls:
    - "*¿Cuál es tu nombre?* not *¿Qué es tu nombre?* — *cuál* before *ser* when choosing among possibilities."
    - "*porque* (because) has no accent and is one word."
  drills:
    - { es: "¿Quién es ella?", en: "Who is she?" }
    - { es: "¿Cómo se llama tu hermano?", en: "What is your brother's name?" }
- id: g.hay
  level: a1
  title: "Hay — there is / there are"
  summary: "hay never changes: hay un banco, hay dos bancos."
  explanation: |
    *Hay* (from *haber*) expresses existence: there is / there are. It has one form for singular and plural.

    - *Hay un supermercado en mi calle.* (There is a supermarket on my street.)
    - *Hay muchas tiendas.* (There are many shops.)
    - *No hay leche.* (There is no milk.)
    - *¿Hay un banco por aquí?* (Is there a bank around here?)

    *Hay* introduces **new or indefinite** things, so it goes with *un/una, unos/unas*, numbers, *mucho, poco, algún* or no article at all — never with *el/la* or possessives. For something specific use *estar*: *El banco está en la plaza.*
  examples:
    - { es: "En la clase hay veinte estudiantes.", en: "In the class there are twenty students." }
    - { es: "¿Hay una farmacia cerca?", en: "Is there a pharmacy nearby?" }
    - { es: "No hay problema.", en: "No problem." }
  pitfalls:
    - "Never *hay el banco*: *hay un banco* or *el banco está*."
  drills:
    - { es: "Hay tres dormitorios en la casa.", en: "There are three bedrooms in the house." }
    - { es: "No hay nadie en casa.", en: "There is nobody at home." }
- id: g.estar-location
  level: a1
  title: "Estar — saying where things are"
  summary: "estoy, estás, está, estamos, estáis, están + en / cerca de / al lado de."
  explanation: |
    | | estar |
    |---|---|
    | yo | **estoy** |
    | tú | **estás** |
    | él / ella / usted | **está** |
    | nosotros/as | **estamos** |
    | vosotros/as | **estáis** |
    | ellos / ellas / ustedes | **están** |

    Use *estar* for **location**: *Madrid está en España. ¿Dónde está el baño? Estoy en casa.*

    Contrast with *hay*: *hay* says that something exists; *estar* says where a specific thing is.
    - *Hay un museo en el centro.* → *El museo está en el centro.*

    *Estar* is also used for temporary states: *Estoy cansado.* (see *ser vs estar*).
  examples:
    - { es: "¿Dónde están mis llaves?", en: "Where are my keys?" }
    - { es: "El banco está al lado del hotel.", en: "The bank is next to the hotel." }
    - { es: "Estamos en el aeropuerto.", en: "We are at the airport." }
  pitfalls:
    - "Events use *ser*: *La fiesta es en mi casa.* (takes place)."
  drills:
    - { es: "La farmacia está cerca de la estación.", en: "The pharmacy is near the station." }
    - { es: "¿Estáis en casa?", en: "Are you (all) at home?" }
- id: g.articles-indefinite
  level: a1
  title: "The indefinite article — un, una, unos, unas"
  summary: "\"a / an / some\" — agrees with the noun; omitted after ser with professions."
  explanation: |
    | | singular | plural |
    |---|---|---|
    | masculine | **un** libro | **unos** libros (some books) |
    | feminine | **una** mesa | **unas** mesas |

    ### When it is left out
    - Professions, nationality, religion after *ser*: *Es profesora. Soy español.* (but with an adjective: *Es una profesora excelente.*)
    - After *tener* and *llevar* for things you normally have one of: *No tengo coche. Lleva gafas.*
    - With *otro*: *otro café*, never *un otro*.
    - *Unos/unas* before a number means "about": *unas veinte personas.*
  examples:
    - { es: "Hay una farmacia en la esquina.", en: "There is a pharmacy on the corner." }
    - { es: "Mi hermano es médico.", en: "My brother is a doctor." }
    - { es: "Quiero otro café, por favor.", en: "I want another coffee, please." }
  pitfalls:
    - "*un* before feminine nouns starting with stressed a-: *un aula*."
  drills:
    - { es: "Unos amigos de Ana viven aquí.", en: "Some friends of Ana live here." }
    - { es: "¿Tienes un bolígrafo?", en: "Do you have a pen?" }
- id: g.prepositions-place
  level: a1
  title: "Prepositions of place"
  summary: "en, sobre, debajo de, delante de, detrás de, al lado de, entre, cerca de, lejos de."
  explanation: |
    - *en* — in / on / at: *en la mesa, en casa, en Madrid*
    - *sobre / encima de* — on top of
    - *debajo de* — under
    - *delante de* — in front of · *detrás de* — behind
    - *al lado de* — next to · *junto a* — beside
    - *entre* — between
    - *cerca de* — near · *lejos de* — far from
    - *a la derecha / izquierda de* — to the right / left of
    - *enfrente de* — opposite
    - *dentro de* — inside · *fuera de* — outside

    Remember *de + el = del*: *al lado del banco.*
  examples:
    - { es: "El gato está debajo de la mesa.", en: "The cat is under the table." }
    - { es: "La estación está enfrente del hotel.", en: "The station is opposite the hotel." }
    - { es: "Vivo entre el parque y la escuela.", en: "I live between the park and the school." }
  pitfalls:
    - "*en* covers English in, on and at; only use *sobre* when 'on top of' matters."
  drills:
    - { es: "Las llaves están encima de la mesa.", en: "The keys are on the table." }
    - { es: "El supermercado está lejos de aquí.", en: "The supermarket is far from here." }
- id: g.demonstratives
  level: a1
  title: "Demonstratives — este, ese, aquel"
  summary: "este (this, near me), ese (that, near you), aquel (that over there)."
  explanation: |
    | | m. sg | f. sg | m. pl | f. pl |
    |---|---|---|---|---|
    | this (near the speaker) | *este* | *esta* | *estos* | *estas* |
    | that (near the listener) | *ese* | *esa* | *esos* | *esas* |
    | that over there (far from both) | *aquel* | *aquella* | *aquellos* | *aquellas* |

    They work as adjectives (*este libro*) and as pronouns (*este es mi libro* — this one is my book). The neuter forms *esto, eso, aquello* refer to ideas or unknown things: *¿Qué es esto?*
  examples:
    - { es: "Esta casa es mía.", en: "This house is mine." }
    - { es: "¿Cuánto cuesta ese jersey?", en: "How much is that jumper?" }
    - { es: "Aquellas montañas son los Pirineos.", en: "Those mountains over there are the Pyrenees." }
  pitfalls:
    - "*este/ese* end in -e, not -o, in the masculine singular; *esto/eso* are neuter."
  drills:
    - { es: "Estos zapatos son caros.", en: "These shoes are expensive." }
    - { es: "¿Qué es eso?", en: "What is that?" }
- id: g.regular-ar-present
  level: a1
  title: "Regular -ar verbs in the present"
  summary: "hablar — hablo, hablas, habla, hablamos, habláis, hablan."
  explanation: |
    Remove *-ar* and add the endings:

    | | hablar | |
    |---|---|---|
    | yo | habl**o** | I speak |
    | tú | habl**as** | |
    | él / ella / usted | habl**a** | |
    | nosotros/as | habl**amos** | |
    | vosotros/as | habl**áis** | |
    | ellos / ellas / ustedes | habl**an** | |

    Common -ar verbs: *trabajar* (work), *estudiar* (study), *vivir* is -ir!, *comprar* (buy), *tomar* (take/drink), *bailar*, *cantar*, *escuchar*, *mirar*, *llegar*, *desayunar*, *cenar*, *necesitar*, *llamar*, *viajar*, *cocinar*, *lavar*, *limpiar*, *preguntar*, *contestar*.

    The Spanish present covers English "I speak", "I am speaking" and "I do speak".
  examples:
    - { es: "Trabajo en un hospital.", en: "I work in a hospital." }
    - { es: "¿Estudiáis español?", en: "Do you (all) study Spanish?" }
    - { es: "Mis amigos bailan muy bien.", en: "My friends dance very well." }
  pitfalls:
    - "Only *vosotros* has an accent: *habláis*."
  drills:
    - { es: "Ella compra pan todos los días.", en: "She buys bread every day." }
    - { es: "Nosotros desayunamos a las ocho.", en: "We have breakfast at eight." }
- id: g.querer-present
  level: a1
  title: "Querer — wanting and ordering"
  summary: "quiero, quieres, quiere, queremos, queréis, quieren + noun or infinitive."
  explanation: |
    *Querer* (to want, to love) changes *e → ie* except in *nosotros / vosotros*:
    *quiero, quieres, quiere, queremos, queréis, quieren.*

    - *Quiero un café.* — I want a coffee. (In a bar this is perfectly polite; add *por favor*.)
    - *Quiero comer.* — I want to eat. (*querer* + infinitive)
    - *¿Qué quieres?* / *¿Qué quiere tomar?* — What do you want (to have)?
    - *Te quiero.* — I love you.

    A softer request: *Quería un café* or *¿Me pone un café?*
  examples:
    - { es: "Queremos dos cervezas, por favor.", en: "We want two beers, please." }
    - { es: "¿Quieres ir al cine?", en: "Do you want to go to the cinema?" }
    - { es: "Mi hijo no quiere comer verduras.", en: "My son doesn't want to eat vegetables." }
  pitfalls:
    - "*quiero* + infinitive, no preposition: *quiero ir*, not *quiero a ir*."
  drills:
    - { es: "¿Qué queréis beber?", en: "What do you (all) want to drink?" }
    - { es: "Ellos quieren una mesa para cuatro.", en: "They want a table for four." }
- id: g.gustar
  level: a1
  title: "Me gusta — liking things"
  summary: "The thing liked is the subject; the person is me / te / le / nos / os / les."
  explanation: |
    *Gustar* literally means "to be pleasing". *Me gusta el café* = coffee is pleasing to me.

    | | one thing / an activity | several things |
    |---|---|---|
    | I like | **me gusta** | **me gustan** |
    | you like | **te gusta** | **te gustan** |
    | he/she/you(f.) like(s) | **le gusta** | **le gustan** |
    | we like | **nos gusta** | **nos gustan** |
    | you all like | **os gusta** | **os gustan** |
    | they like | **les gusta** | **les gustan** |

    - Activities (infinitives) take *gusta*: *Me gusta bailar.*
    - Use the definite article: *Me gusta el chocolate* (not *me gusta chocolate*).
    - To say who, add *a + person*: *A Juan le gusta el fútbol. A mí me gusta.*
    - Strengthen with *mucho*; negate with *no*: *No me gusta nada.*
    - Same pattern: *encantar* (love), *interesar*, *doler*, *parecer*.
  examples:
    - { es: "¿Te gusta la paella?", en: "Do you like paella?" }
    - { es: "Nos gustan los perros.", en: "We like dogs." }
    - { es: "A mi madre le gusta leer.", en: "My mother likes reading." }
  pitfalls:
    - "Never *yo gusto*: the subject is the thing, not the person."
    - "Plural things → *gustan*; a verb → *gusta*."
  drills:
    - { es: "Me gusta mucho la música.", en: "I like music a lot." }
    - { es: "¿Os gustan las películas españolas?", en: "Do you (all) like Spanish films?" }
- id: g.quantity-words
  level: a1
  title: "Quantity — mucho, poco, bastante, demasiado, un poco de"
  summary: "mucho/poco agree with the noun; muy and bastante before adjectives do not change."
  explanation: |
    - Before a noun they agree: *mucho pan, mucha agua, muchos libros, muchas personas; poco tiempo, pocas sillas.*
    - *un poco de* + noun: *un poco de leche* (a little milk).
    - *bastante(s)*: enough / quite a lot — *bastante dinero, bastantes amigos.*
    - *demasiado/a/os/as*: too much / too many.
    - With a verb they are adverbs and do not change: *Como mucho. Trabaja poco.*
    - *muy* only before adjectives and adverbs: *muy bueno, muy bien.* Never *muy mucho*: say *muchísimo*.
    - Asking: *¿Cuánto/a/os/as?* — *¿Cuánta leche quieres?*
  examples:
    - { es: "Hay muchas tiendas pero pocos bancos.", en: "There are many shops but few banks." }
    - { es: "Quiero un poco de azúcar.", en: "I want a little sugar." }
    - { es: "Trabajas demasiado.", en: "You work too much." }
  pitfalls:
    - "*mucho* with a verb never changes: *me gusta mucho*, not *mucha*."
  drills:
    - { es: "Tengo poco dinero.", en: "I have little money." }
    - { es: "Bebemos mucha agua.", en: "We drink a lot of water." }
- id: g.regular-er-ir-present
  level: a1
  title: "Regular -er and -ir verbs in the present"
  summary: "comer — como, comes, come, comemos, coméis, comen; vivir — vivo, vives, vive, vivimos, vivís, viven."
  explanation: |
    | | comer (-er) | vivir (-ir) |
    |---|---|---|
    | yo | com**o** | viv**o** |
    | tú | com**es** | viv**es** |
    | él / ella / usted | com**e** | viv**e** |
    | nosotros/as | com**emos** | viv**imos** |
    | vosotros/as | com**éis** | viv**ís** |
    | ellos / ellas / ustedes | com**en** | viv**en** |

    -er and -ir verbs differ only in *nosotros* and *vosotros*.

    Common -er: *beber, comer, leer, aprender, comprender, vender, correr, creer.*
    Common -ir: *vivir, escribir, abrir, recibir, subir, decidir, compartir.*
    A few have an irregular *yo*: *hacer → hago, conocer → conozco, ver → veo, saber → sé, salir → salgo, poner → pongo.*
  examples:
    - { es: "¿Dónde vives? Vivo en Granada.", en: "Where do you live? I live in Granada." }
    - { es: "Leemos el periódico por la mañana.", en: "We read the newspaper in the morning." }
    - { es: "Los niños aprenden rápido.", en: "Children learn fast." }
  pitfalls:
    - "*vivís* (vosotros) has the accent; *vivimos* does not."
  drills:
    - { es: "Escribo un mensaje a mi madre.", en: "I write a message to my mother." }
    - { es: "¿Bebéis café o té?", en: "Do you (all) drink coffee or tea?" }
- id: g.reflexive-verbs-present
  level: a1
  title: "Reflexive verbs — me levanto, me ducho"
  summary: "Daily-routine verbs take me, te, se, nos, os, se before the verb."
  explanation: |
    Many routine actions are "done to oneself": *levantarse* (to get up), *ducharse* (to shower), *lavarse*, *vestirse*, *acostarse*, *despertarse*, *peinarse*, *afeitarse*, *llamarse*.

    | | levantarse |
    |---|---|
    | yo | **me** levanto |
    | tú | **te** levantas |
    | él / ella / usted | **se** levanta |
    | nosotros/as | **nos** levantamos |
    | vosotros/as | **os** levantáis |
    | ellos / ellas / ustedes | **se** levantan |

    - The pronoun goes before the conjugated verb, or attached to an infinitive: *Quiero ducharme.* / *Me quiero duchar.*
    - Body parts take the article, not a possessive: *Me lavo las manos.*
    - Without the pronoun the verb acts on someone else: *Lavo el coche. Despierto a mi hijo.*
    - Some verbs change meaning: *ir* (go) / *irse* (leave), *dormir* (sleep) / *dormirse* (fall asleep).
  examples:
    - { es: "Me levanto a las siete.", en: "I get up at seven." }
    - { es: "¿A qué hora te acuestas?", en: "What time do you go to bed?" }
    - { es: "Los niños se duchan por la noche.", en: "The children shower at night." }
  pitfalls:
    - "*acostarse* and *despertarse* are stem-changing: *me acuesto, me despierto*, but *nos acostamos*."
  drills:
    - { es: "Nos levantamos tarde los domingos.", en: "We get up late on Sundays." }
    - { es: "Ella se lava el pelo.", en: "She washes her hair." }
- id: g.time-telling
  level: a1
  title: "Telling the time"
  summary: "¿Qué hora es? Es la una. Son las dos y media. A las tres menos cuarto."
  explanation: |
    - *¿Qué hora es?* — What time is it?
    - *Es la una.* (1:00, singular) · *Son las dos / tres / diez.* (plural)
    - Minutes past: *y* — *Son las cuatro y diez* (4:10), *y cuarto* (quarter past), *y media* (half past).
    - Minutes to: *menos* — *Son las cinco menos veinte* (4:40), *menos cuarto* (quarter to).
    - *en punto* (exactly), *de la mañana / de la tarde / de la noche* (am / pm), *mediodía / medianoche*.
    - "At" a time: *a la una, a las ocho y media.*
    - Parts of the day without a time: *por la mañana, por la tarde, por la noche.*
    - Opening hours and timetables often use the 24-hour clock: *a las 20:30 (veinte treinta).*
  examples:
    - { es: "Son las ocho y cuarto de la mañana.", en: "It is a quarter past eight in the morning." }
    - { es: "La clase es a las diez menos cuarto.", en: "The class is at a quarter to ten." }
    - { es: "Como a las dos y media.", en: "I have lunch at half past two." }
  pitfalls:
    - "*Es la una* (singular) but *son las dos* (plural)."
  variant: "Latin America prefers *en la mañana / en la tarde* and *un cuarto para las tres* (quarter to three)."
  drills:
    - { es: "¿A qué hora empieza la película?", en: "What time does the film start?" }
    - { es: "Es mediodía.", en: "It is noon." }
- id: g.days-months
  level: a1
  title: "Days, months and dates"
  summary: "lunes, martes… enero, febrero… el 5 de mayo de 2026."
  explanation: |
    **Days:** *lunes, martes, miércoles, jueves, viernes, sábado, domingo* — all masculine, lower case. *El lunes* = on Monday; *los lunes* = on Mondays. Only *sábado/domingo* add -s in the plural.

    **Months:** *enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre* — lower case.

    **Dates:** *el 5 de mayo* (day + de + month); the first is *el uno de* or *el primero de*. Year: *de 2026*. *¿Qué día es hoy? Hoy es martes, 3 de junio.*

    **Seasons:** *la primavera, el verano, el otoño, el invierno* — *en verano.*

    Useful: *hoy, mañana, ayer, pasado mañana, anteayer, el fin de semana, la semana que viene.*
  examples:
    - { es: "Mi cumpleaños es el doce de octubre.", en: "My birthday is on the twelfth of October." }
    - { es: "Los sábados no trabajo.", en: "I don't work on Saturdays." }
    - { es: "Hoy es viernes, trece de marzo.", en: "Today is Friday the thirteenth of March." }
  pitfalls:
    - "No capital letters for days or months; no preposition 'on' — the article does the job."
  drills:
    - { es: "El examen es el lunes.", en: "The exam is on Monday." }
    - { es: "En agosto hace mucho calor.", en: "In August it is very hot." }
- id: g.frequency-adverbs
  level: a1
  title: "How often — siempre, a veces, nunca"
  summary: "siempre, casi siempre, normalmente, a menudo, a veces, casi nunca, nunca; todos los días, una vez a la semana."
  explanation: |
    From most to least often:
    *siempre* (always) · *casi siempre* · *normalmente / generalmente* · *a menudo / con frecuencia* · *a veces* (sometimes) · *casi nunca* · *nunca / jamás* (never).

    - Position is flexible, usually before the verb or at the start: *Siempre desayuno en casa. A veces voy en bici.*
    - *Nunca* before the verb needs no *no*; after the verb it does: *Nunca fumo.* / *No fumo nunca.*
    - Periods: *todos los días* (every day), *todas las semanas*, *cada día*, *una vez / dos veces a la semana / al mes / al año*, *los fines de semana*, *por la mañana*.
    - Ask with *¿Con qué frecuencia…?* or *¿Cuántas veces…?*
  examples:
    - { es: "Nunca como carne.", en: "I never eat meat." }
    - { es: "Voy al gimnasio dos veces a la semana.", en: "I go to the gym twice a week." }
    - { es: "A veces cenamos fuera.", en: "Sometimes we eat out." }
  pitfalls:
    - "*siempre no* is not 'never' — use *nunca*."
  drills:
    - { es: "Normalmente me levanto a las siete.", en: "I normally get up at seven." }
    - { es: "Casi nunca veo la televisión.", en: "I hardly ever watch television." }
- id: g.ser-vs-estar-basics
  level: a1
  title: "Ser or estar?"
  summary: "ser = what something is; estar = where it is or how it is right now."
  explanation: |
    | **ser** | **estar** |
    |---|---|
    | identity, origin, profession: *Soy médico. Es de Perú.* | location: *Está en Perú.* |
    | permanent description: *Es alto. Es simpática.* | temporary state, mood, health: *Está enfermo. Estoy contenta.* |
    | time, dates, events: *Son las dos. La boda es en junio.* | ongoing action: *Está comiendo.* |
    | material, possession: *Es de madera. Es mío.* | result of a change: *La puerta está abierta.* |

    Some adjectives change meaning:
    - *ser aburrido* (boring) / *estar aburrido* (bored)
    - *ser listo* (clever) / *estar listo* (ready)
    - *ser bueno* (good person) / *estar bueno* (tasty; attractive)
    - *ser rico* (rich) / *estar rico* (delicious)
    - *ser malo* (bad) / *estar malo* (ill)

    Rule of thumb: *estar* when you could add "right now" or "today".
  examples:
    - { es: "Mi hermano es tranquilo, pero hoy está nervioso.", en: "My brother is calm, but today he is nervous." }
    - { es: "La sopa está muy rica.", en: "The soup is delicious." }
    - { es: "¿Estás cansado? Sí, estoy muy cansado.", en: "Are you tired? Yes, I'm very tired." }
  pitfalls:
    - "*estar de acuerdo* (agree), *estar bien/mal*, *estar casado* — all with *estar*."
    - "Death and location of events: *está muerto* but *la fiesta es en el bar*."
  drills:
    - { es: "Estoy enfermo y no voy a trabajar.", en: "I am ill and I am not going to work." }
    - { es: "La casa es grande y está limpia.", en: "The house is big and it is clean." }
- id: g.adjectives-position
  level: a1
  title: "Where the adjective goes"
  summary: "Descriptive adjectives follow the noun (un coche rojo); quantity and some common ones go before."
  explanation: |
    - Most adjectives come **after** the noun: *una casa blanca, un hombre alto, la comida española.*
    - **Before** the noun: numbers and quantities (*dos coches, muchas personas*), possessives and demonstratives (*mi casa, este libro*), *bueno/malo, grande/pequeño* when subjective, *otro, mismo, próximo, último.*
    - Some shorten before a masculine singular noun: *un buen amigo* (bueno), *mal tiempo* (malo), *el primer día* (primero), *el tercer piso* (tercero), *gran* (grande — meaning "great": *una gran mujer*), *algún / ningún*.
    - Position can change meaning: *un hombre grande* (big) / *un gran hombre* (great); *una amiga vieja* (old in age) / *una vieja amiga* (long-standing).
  examples:
    - { es: "Tengo un buen amigo en Málaga.", en: "I have a good friend in Málaga." }
    - { es: "Es una ciudad pequeña y bonita.", en: "It is a small, pretty town." }
    - { es: "El primer día de clase.", en: "The first day of class." }
  pitfalls:
    - "*grande* shortens to *gran* only before the noun: *un gran día* but *un día grande*."
  drills:
    - { es: "Hace mal tiempo hoy.", en: "The weather is bad today." }
    - { es: "Vivo en el tercer piso.", en: "I live on the third floor." }
- id: g.tener-expressions
  level: a1
  title: "Tener expressions — hunger, cold, age…"
  summary: "tener hambre, sed, frío, calor, sueño, miedo, prisa, razón, suerte, … años."
  explanation: |
    Where English uses "to be + adjective", Spanish often uses **tener + noun**:

    - *tener hambre* — to be hungry · *tener sed* — to be thirsty
    - *tener frío / calor* — to be cold / hot (a person)
    - *tener sueño* — to be sleepy · *tener miedo (de)* — to be afraid (of)
    - *tener prisa* — to be in a hurry · *tener razón* — to be right
    - *tener suerte* — to be lucky · *tener cuidado* — to be careful
    - *tener … años* — to be … years old
    - *tener ganas de + infinitive* — to feel like doing

    Intensify with *mucho/a*, agreeing with the noun: *tengo mucha hambre, tengo mucho frío.*
  examples:
    - { es: "Tengo mucha sed. ¿Hay agua?", en: "I'm very thirsty. Is there any water?" }
    - { es: "Los niños tienen sueño.", en: "The children are sleepy." }
    - { es: "Tienes razón, es tarde.", en: "You're right, it is late." }
  pitfalls:
    - "*estoy caliente* does not mean 'I'm hot' (temperature) — say *tengo calor*."
    - "*mucha hambre* — hambre is feminine, so *mucha* even though it takes *el*."
  drills:
    - { es: "Tenemos prisa, el tren sale a las nueve.", en: "We're in a hurry, the train leaves at nine." }
    - { es: "¿Tienes frío? Toma mi chaqueta.", en: "Are you cold? Take my jacket." }
- id: g.colors
  level: a1
  title: "Colours"
  summary: "rojo, azul, verde, amarillo, blanco, negro, gris, marrón, naranja, rosa, morado."
  explanation: |
    Colours are adjectives and follow the noun: *un coche rojo, una casa blanca.*

    - Four forms: *rojo, blanco, negro, amarillo, morado* → *roja, rojos, rojas…*
    - Two forms (gender-invariant): *azul/azules, verde/verdes, gris/grises, marrón/marrones.*
    - Invariable (they are really nouns): *naranja, rosa, violeta, beige* — *dos camisetas rosa* (though *rosas* is also heard).
    - Shades: *claro* (light), *oscuro* (dark): *azul claro, verde oscuro* — these stay masculine singular as a unit: *una falda azul claro.*
    - Ask: *¿De qué color es?* — *Es rojo.*
  examples:
    - { es: "Las paredes son blancas y la puerta es azul.", en: "The walls are white and the door is blue." }
    - { es: "¿De qué color es tu coche? Es gris.", en: "What colour is your car? It's grey." }
    - { es: "Me gustan los zapatos marrones.", en: "I like the brown shoes." }
  pitfalls:
    - "*marrón* takes an accent in the singular, not in the plural *marrones*."
  variant: "Latin America often says *café* for brown and *celeste* for light blue."
  drills:
    - { es: "Tiene el pelo negro y los ojos verdes.", en: "He has black hair and green eyes." }
    - { es: "Quiero la camisa roja, no la amarilla.", en: "I want the red shirt, not the yellow one." }
- id: g.muy-bastante-poco
  level: a1
  title: "Degree — muy, bastante, un poco, demasiado"
  summary: "muy alto, bastante alto, un poco alto, demasiado alto; también -ísimo."
  explanation: |
    Before adjectives and adverbs:
    - *muy* — very: *muy alto, muy bien*
    - *bastante* — quite / fairly: *bastante caro*
    - *un poco* — a bit (usually negative qualities): *un poco cansado*
    - *demasiado* — too: *demasiado caro*
    - *nada* — not at all (with *no*): *no es nada fácil*
    - *-ísimo/a*: *altísimo, carísima, muchísimo* — "extremely"

    None of these change form before an adjective (*muy, bastante, demasiado* are adverbs here). *Mucho* is **not** used before adjectives: *muy bueno*, never *mucho bueno*.
  examples:
    - { es: "Este hotel es bastante bueno pero demasiado caro.", en: "This hotel is quite good but too expensive." }
    - { es: "Estoy un poco cansada.", en: "I'm a bit tired." }
    - { es: "La película es buenísima.", en: "The film is really good." }
  pitfalls:
    - "*muy* cannot stand alone: *¿Es caro? — Sí, mucho.* (not *sí, muy*)."
  drills:
    - { es: "Habla muy rápido.", en: "He speaks very fast." }
    - { es: "El examen es dificilísimo.", en: "The exam is extremely hard." }
- id: g.numbers-100-1000
  level: a1
  title: "Numbers 100–1000 and prices"
  summary: "cien, doscientos, quinientos, setecientos, novecientos, mil; euros con céntimos."
  explanation: |
    100 cien (ciento + more) · 200 doscientos · 300 trescientos · 400 cuatrocientos · 500 **quinientos** · 600 seiscientos · 700 **setecientos** · 800 ochocientos · 900 **novecientos** · 1000 mil · 2000 dos mil · 1 000 000 un millón

    - Hundreds agree in gender: *doscientas personas, quinientos euros.*
    - No *y* between hundreds and tens: *ciento cinco, trescientos cuarenta y dos.*
    - *mil* never pluralises in numbers: *tres mil* (but *miles de personas* = thousands of).
    - Years are read as numbers: *1998 = mil novecientos noventa y ocho; 2026 = dos mil veintiséis.*
    - Prices: *Son 12,50 € — doce euros con cincuenta (céntimos). Cuesta 3 euros.* Decimal comma, dot for thousands: *1.250,75 €.*
  examples:
    - { es: "El piso cuesta doscientos mil euros.", en: "The flat costs two hundred thousand euros." }
    - { es: "Son quince euros con veinte.", en: "That's fifteen euros twenty." }
    - { es: "Nací en mil novecientos noventa.", en: "I was born in 1990." }
  pitfalls:
    - "*quinientos, setecientos, novecientos* are irregular — not cincocientos, sietecientos, nuevecientos."
  drills:
    - { es: "Hay trescientas personas en la sala.", en: "There are three hundred people in the hall." }
    - { es: "Cuesta mil quinientos euros.", en: "It costs one thousand five hundred euros." }
- id: g.costar-cuanto
  level: a1
  title: "Asking the price — ¿Cuánto cuesta?"
  summary: "¿Cuánto cuesta? ¿Cuánto cuestan? ¿Cuánto es? Cuesta diez euros."
  explanation: |
    - *¿Cuánto cuesta (esto)?* — How much does it cost? · *¿Cuánto cuestan los zapatos?* (plural)
    - *¿Cuánto es?* — How much is it (all together)? · *¿Cuánto vale?* — same as cuesta.
    - *Cuesta / vale veinte euros.* · *Son veinte euros.*
    - *costar* changes *o → ue*: *cuesta, cuestan* (*costamos* is rarely needed).
    - Useful shop language: *¿Tiene(n) … en otra talla / otro color?*, *Me lo llevo.* (I'll take it), *¿Puedo pagar con tarjeta?*, *en efectivo*, *la cuenta, por favor* (the bill), *¿Me da un recibo?*
    - *barato / caro* (cheap / expensive), *una oferta, un descuento, rebajas* (sales).
  examples:
    - { es: "¿Cuánto cuesta esta camisa? Cuesta treinta euros.", en: "How much is this shirt? It costs thirty euros." }
    - { es: "¿Cuánto es todo? Son cuarenta y dos con cincuenta.", en: "How much is everything? Forty-two fifty." }
    - { es: "Es demasiado caro. ¿Tiene algo más barato?", en: "It's too expensive. Do you have anything cheaper?" }
  pitfalls:
    - "*¿Cuánto es?* for the total; *¿cuánto cuesta?* for an item."
  drills:
    - { es: "¿Cuánto cuestan las manzanas?", en: "How much are the apples?" }
    - { es: "Me lo llevo. ¿Puedo pagar con tarjeta?", en: "I'll take it. Can I pay by card?" }
- id: g.demonstratives-usage
  level: a1
  title: "This one, that one — demonstratives as pronouns"
  summary: "¿Cuál quieres? Este. Esa es más barata. Aquellos de allí."
  explanation: |
    Demonstratives can stand alone, replacing a noun already understood:
    - *¿Qué camisa prefieres? — Esta.* (this one)
    - *Esos son más caros.* (those ones)
    - *Aquella es mi casa.* (that one over there)

    Agree with the noun they replace. The neuter *esto / eso / aquello* refer to something unnamed or an idea: *¿Qué es esto? Eso no es verdad.*

    *de aquí / de ahí / de allí* can add location: *el libro de allí.*
  examples:
    - { es: "Me gustan estos, no esos.", en: "I like these, not those." }
    - { es: "¿Cuál es tu bolso? Aquel.", en: "Which is your bag? That one over there." }
    - { es: "Eso es muy interesante.", en: "That is very interesting." }
  pitfalls:
    - "Since 2010 the pronouns carry no accent (*este*, not *éste*)."
  drills:
    - { es: "Esta es mi hermana y aquel es mi padre.", en: "This is my sister and that (man over there) is my father." }
    - { es: "No quiero esa, quiero esta.", en: "I don't want that one, I want this one." }
- id: g.direct-object-intro
  level: a1
  title: "Lo, la, los, las — \"it\" and \"them\""
  summary: "Replace the thing with lo / la / los / las before the verb: ¿El libro? Lo quiero."
  explanation: |
    To avoid repeating a noun, use a direct-object pronoun **before** the verb:

    | | |
    |---|---|
    | *lo* | it / him (masculine) |
    | *la* | it / her (feminine) |
    | *los* | them (masculine / mixed) |
    | *las* | them (feminine) |

    - *¿Compras el pan? — Sí, lo compro.* · *¿Ves a María? — Sí, la veo.*
    - With an infinitive it may attach to the end: *Quiero comprarlo* / *Lo quiero comprar.*
    - *Me, te, nos, os* are the same for direct objects: *Te quiero. ¿Me ves?*

    This is only an introduction; indirect objects (*le, les*) come at A2.
  examples:
    - { es: "¿Tienes las llaves? Sí, las tengo.", en: "Do you have the keys? Yes, I have them." }
    - { es: "No lo entiendo.", en: "I don't understand it." }
    - { es: "Voy a comprarla mañana.", en: "I'm going to buy it tomorrow." }
  pitfalls:
    - "Word order: pronoun + verb (*lo quiero*), never *quiero lo*."
  drills:
    - { es: "¿El vino? Lo compro yo.", en: "The wine? I'll buy it." }
    - { es: "¿Conoces a mis padres? Sí, los conozco.", en: "Do you know my parents? Yes, I know them." }
- id: g.este-ese-aquel
  level: a1
  title: "Este, ese, aquel with clothes and sizes"
  summary: "Shopping language — ¿tiene esta en la talla M? Esos zapatos, número 42."
  explanation: |
    In a shop you point and choose, so demonstratives are everywhere:
    - *¿Tiene esta camiseta en otra talla?* — Do you have this T-shirt in another size?
    - *Me gustan esos zapatos. ¿Tiene el número 42?* — Shoe sizes use *número*; clothes use *talla* (S, M, L: *la ese, la eme, la ele*).
    - *¿Puedo probarme aquel abrigo?* — Can I try on that coat?
    - *¿Dónde están los probadores?* — Where are the fitting rooms?
    - *Me queda grande / pequeño / bien.* — It is too big / too small / fits me.
    - *Me lo llevo.* / *Me la llevo.* — I'll take it (agreeing with the item).
  examples:
    - { es: "¿Tiene estos pantalones en la talla 40?", en: "Do you have these trousers in size 40?" }
    - { es: "Esa falda me queda pequeña.", en: "That skirt is too small for me." }
    - { es: "Me llevo aquellas botas.", en: "I'll take those boots over there." }
  pitfalls:
    - "*quedar* works like *gustar*: *me queda bien, me quedan grandes.*"
  drills:
    - { es: "¿Puedo probarme esta chaqueta?", en: "Can I try on this jacket?" }
    - { es: "Esos zapatos son muy bonitos.", en: "Those shoes are very nice." }
- id: g.ir-present
  level: a1
  title: "The verb ir (to go)"
  summary: "voy, vas, va, vamos, vais, van + a + place."
  explanation: |
    | | ir |
    |---|---|
    | yo | **voy** |
    | tú | **vas** |
    | él / ella / usted | **va** |
    | nosotros/as | **vamos** |
    | vosotros/as | **vais** |
    | ellos / ellas / ustedes | **van** |

    - Destination with **a**: *Voy a Madrid. Vamos al cine.* (*a + el = al*)
    - Means of transport with **en**: *en coche, en tren, en autobús, en metro, en bici, en avión* — but *a pie* (on foot).
    - *¿Adónde vas?* — Where are you going?
    - *¡Vamos!* — Let's go! · *Vamos a ver.* — Let's see.
  examples:
    - { es: "¿Adónde vais? Vamos a la playa.", en: "Where are you going? We're going to the beach." }
    - { es: "Voy al trabajo en metro.", en: "I go to work by metro." }
    - { es: "Mis padres van a Italia en verano.", en: "My parents go to Italy in summer." }
  pitfalls:
    - "*vais* has no accent (monosyllable)."
  drills:
    - { es: "¿Vas a la universidad a pie?", en: "Do you walk to university?" }
    - { es: "Ella va al supermercado los sábados.", en: "She goes to the supermarket on Saturdays." }
- id: g.ir-a-infinitive
  level: a1
  title: "Ir a + infinitive — going to"
  summary: "Voy a comer. ¿Vas a venir? Vamos a estudiar."
  explanation: |
    The easiest way to talk about the future: **ir (present) + a + infinitive**.

    - *Voy a estudiar esta noche.* — I'm going to study tonight.
    - *¿Vas a venir a la fiesta?* — Are you going to come to the party?
    - *Vamos a cenar fuera.* — We're going to eat out. (also "Let's eat out")
    - *No van a llegar a tiempo.* — They are not going to arrive on time.

    The *a* is obligatory: *voy a comer*, never *voy comer*. Useful time words: *esta tarde, esta noche, mañana, el fin de semana, el año que viene, la semana próxima.*
  examples:
    - { es: "Mañana voy a visitar a mi abuela.", en: "Tomorrow I'm going to visit my grandmother." }
    - { es: "¿Qué vais a hacer este fin de semana?", en: "What are you (all) going to do this weekend?" }
    - { es: "Va a llover.", en: "It's going to rain." }
  pitfalls:
    - "Reflexive pronoun attaches to the infinitive or precedes *ir*: *voy a levantarme / me voy a levantar*."
  drills:
    - { es: "Vamos a comprar pan.", en: "We're going to buy bread." }
    - { es: "No voy a trabajar el lunes.", en: "I'm not going to work on Monday." }
- id: g.hacer-present
  level: a1
  title: "The verb hacer (to do / make)"
  summary: "hago, haces, hace, hacemos, hacéis, hacen; ¿Qué haces? Hace frío."
  explanation: |
    *hago, haces, hace, hacemos, hacéis, hacen* — only *yo* is irregular.

    - *¿Qué haces?* — What are you doing? / What do you do?
    - *hacer deporte, hacer los deberes, hacer la comida, hacer la cama, hacer una foto, hacer un viaje, hacer cola* (queue).
    - Weather: *Hace frío / calor / sol / viento / buen tiempo.*
    - Time elapsed: *Hace dos años que vivo aquí.*
    - Other verbs with the same *-go* pattern in *yo*: *poner → pongo, salir → salgo, traer → traigo, decir → digo, venir → vengo, tener → tengo.*
  examples:
    - { es: "Hago deporte tres veces a la semana.", en: "I do sport three times a week." }
    - { es: "¿Qué hacéis los domingos?", en: "What do you (all) do on Sundays?" }
    - { es: "Mi madre hace una paella fantástica.", en: "My mother makes a fantastic paella." }
  pitfalls:
    - "*hacer una pregunta* = to ask a question (not *preguntar una pregunta*)."
  drills:
    - { es: "Los niños hacen los deberes por la tarde.", en: "The children do their homework in the afternoon." }
    - { es: "Hoy hace mucho calor.", en: "It is very hot today." }
- id: g.al-del-contractions
  level: a1
  title: "al and del"
  summary: "a + el = al; de + el = del. Only with el, never with la, los, las or él."
  explanation: |
    - *Voy a el cine* → **Voy al cine.**
    - *La casa de el profesor* → **La casa del profesor.**

    No contraction with *la, los, las*: *a la playa, de los niños.* No contraction with the pronoun *él*: *el libro de él.* Nor when *El* is part of a name: *de El Salvador.*
  examples:
    - { es: "Vamos al parque.", en: "We're going to the park." }
    - { es: "Es el coche del vecino.", en: "It's the neighbour's car." }
    - { es: "Vengo del trabajo.", en: "I'm coming from work." }
  pitfalls:
    - "*a él* (to him) never becomes *al*: *Se lo doy a él.*"
  drills:
    - { es: "El banco está al lado del hotel.", en: "The bank is next to the hotel." }
    - { es: "Salgo del trabajo a las seis.", en: "I leave work at six." }
- id: g.poder-present
  level: a1
  title: "Poder — can, may"
  summary: "puedo, puedes, puede, podemos, podéis, pueden + infinitive."
  explanation: |
    *Poder* (o → ue): *puedo, puedes, puede, podemos, podéis, pueden.*

    - Ability: *Puedo nadar.* — I can swim.
    - Permission: *¿Puedo entrar?* — May I come in? *¿Se puede aparcar aquí?* — Can one park here?
    - Requests: *¿Puedes ayudarme?* — Can you help me? *¿Puede repetir, por favor?* (formal)
    - Possibility: *Puede llover.* — It may rain.
    - *No puedo más.* — I can't take any more.

    Always followed directly by an infinitive, no *a*.
  examples:
    - { es: "¿Puedes hablar más despacio, por favor?", en: "Can you speak more slowly, please?" }
    - { es: "No podemos ir mañana.", en: "We can't go tomorrow." }
    - { es: "¿Puedo pagar con tarjeta?", en: "Can I pay by card?" }
  pitfalls:
    - "Knowing how to do something is *saber*: *sé nadar* (I know how to swim) vs *puedo nadar* (I am able to, now)."
  drills:
    - { es: "¿Pueden ustedes esperar un momento?", en: "Can you (formal pl.) wait a moment?" }
    - { es: "Ella puede venir a las cinco.", en: "She can come at five." }
- id: g.weather
  level: a1
  title: "The weather — ¿Qué tiempo hace?"
  summary: "hace frío / calor / sol / viento; está nublado; llueve, nieva."
  explanation: |
    - *¿Qué tiempo hace?* — What's the weather like?
    - **hace** + noun: *hace frío, hace calor, hace sol, hace viento, hace buen / mal tiempo, hace fresco.*
    - **está** + adjective: *está nublado, está despejado.*
    - **hay** + noun: *hay niebla, hay tormenta, hay nubes.*
    - Verbs: *llueve* (it rains, from *llover*), *nieva* (from *nevar*), *está lloviendo.*
    - Temperature: *Estamos a 30 grados. Hace 5 grados bajo cero.*
    - Seasons: *en primavera / verano / otoño / invierno.*

    *Tiempo* means both weather and time; *el clima* is the climate.
  examples:
    - { es: "Hoy hace mucho calor y hace sol.", en: "Today it is very hot and sunny." }
    - { es: "En invierno nieva en la montaña.", en: "In winter it snows in the mountains." }
    - { es: "Está nublado y va a llover.", en: "It's cloudy and it's going to rain." }
  pitfalls:
    - "Not *es frío / es calor* for weather — use *hace*."
    - "People *tienen* frío; the weather *hace* frío; objects *están* fríos."
  drills:
    - { es: "¿Qué tiempo hace en Sevilla? Hace buen tiempo.", en: "What's the weather like in Seville? It's nice." }
    - { es: "Hace viento en la playa.", en: "It is windy at the beach." }
- id: g.stem-changing-present
  level: a1
  title: "Stem-changing verbs — e→ie, o→ue, e→i"
  summary: "quiero, puedo, pido — the stem vowel changes except in nosotros and vosotros."
  explanation: |
    In many verbs the stressed stem vowel changes. Because *nosotros* and *vosotros* stress the ending, they keep the original vowel — the "boot" pattern.

    | e → ie | o → ue | e → i | u → ue |
    |---|---|---|---|
    | *querer*: quiero, quieres, quiere, queremos, queréis, quieren | *poder*: puedo, puedes, puede, podemos, podéis, pueden | *pedir*: pido, pides, pide, pedimos, pedís, piden | *jugar*: juego, juegas, juega, jugamos, jugáis, juegan |
    | *preferir, empezar, entender, pensar, cerrar, tener*, venir* | *dormir, volver, costar, encontrar, almorzar, recordar, llover* | *servir, repetir, seguir, vestirse* | |

    *tener* and *venir* also have irregular *yo*: *tengo, vengo.*
  examples:
    - { es: "Prefiero el té, pero mis padres prefieren el café.", en: "I prefer tea, but my parents prefer coffee." }
    - { es: "¿A qué hora empieza la clase? Empieza a las nueve.", en: "What time does the class start? It starts at nine." }
    - { es: "Duermo ocho horas; dormimos poco en verano.", en: "I sleep eight hours; we sleep little in summer." }
  pitfalls:
    - "*nosotros / vosotros* never change: *queremos, podéis, pedimos.*"
  drills:
    - { es: "Los niños juegan en el parque.", en: "The children play in the park." }
    - { es: "¿Entiendes la pregunta? No la entiendo.", en: "Do you understand the question? I don't understand it." }
- id: g.gustar-plural
  level: a1
  title: "Gustar with activities and plural things; encantar"
  summary: "Me gusta nadar. Me gustan los deportes. Me encanta el cine. A ellos les gusta…"
  explanation: |
    - **Activities** take singular *gusta* even if there are several: *Me gusta leer y nadar.*
    - **Plural nouns** take *gustan*: *Me gustan las películas de terror.*
    - *encantar* (to love) follows the same pattern and is never used with *mucho*: *Me encanta la paella.*
    - Who likes: *a + name / pronoun + le(s)*: *A Marta le gusta bailar. A nosotros nos encanta el fútbol. A ellos les gustan los videojuegos.*
    - Asking back: *¿Y a ti?* — And you? *A mí también / A mí tampoco* — Me too / Me neither; *A mí sí / A mí no.*
  examples:
    - { es: "A mí me gusta el fútbol. ¿Y a ti? A mí no.", en: "I like football. And you? I don't." }
    - { es: "Nos encantan las fiestas de verano.", en: "We love summer festivals." }
    - { es: "¿Les gusta viajar a tus padres?", en: "Do your parents like travelling?" }
  pitfalls:
    - "*A mí también* needs the accent on *mí*; the answer to a negative is *tampoco*."
  drills:
    - { es: "Me gusta nadar y correr.", en: "I like swimming and running." }
    - { es: "A mi hermana le encantan los perros.", en: "My sister loves dogs." }
- id: g.saber-vs-conocer
  level: a1
  title: "Saber or conocer? — two ways to know"
  summary: "saber = facts and skills; conocer = people, places and things you are acquainted with."
  explanation: |
    **saber** — *sé, sabes, sabe, sabemos, sabéis, saben*
    - facts and information: *Sé que vives en Madrid. ¿Sabes dónde está el banco?*
    - skills (saber + infinitive): *Sé nadar. No sabe cocinar.*

    **conocer** — *conozco, conoces, conoce, conocemos, conocéis, conocen*
    - people (with personal *a*): *Conozco a tu hermano.*
    - places: *¿Conoces Barcelona?* — Have you been to Barcelona?
    - things / works: *No conozco esa canción.*

    *Saber* with *que / dónde / cómo / si* — facts. *Conocer* with a direct object — acquaintance.
  examples:
    - { es: "No sé si viene mañana.", en: "I don't know if she's coming tomorrow." }
    - { es: "¿Conocéis a Pedro? Sí, lo conocemos.", en: "Do you know Pedro? Yes, we know him." }
    - { es: "Sabe tocar el piano.", en: "She can play the piano." }
  pitfalls:
    - "*sé* (I know) has an accent; *se* (reflexive) does not."
  drills:
    - { es: "¿Sabes a qué hora abre la tienda?", en: "Do you know what time the shop opens?" }
    - { es: "Conozco un restaurante muy bueno.", en: "I know a very good restaurant." }
- id: g.jugar-tocar
  level: a1
  title: "Jugar a and tocar — sports and instruments"
  summary: "jugar al fútbol, jugar a las cartas; tocar la guitarra; practicar deporte."
  explanation: |
    - **jugar a + article + game/sport**: *jugar al fútbol, al tenis, al baloncesto, a las cartas, al ajedrez, a los videojuegos.* *jugar* is u → ue: *juego, juegas, juega, jugamos, jugáis, juegan.*
    - **tocar + instrument**: *tocar la guitarra, el piano, la batería.* Never *jugar* for instruments.
    - **hacer / practicar + sport (no article)**: *hacer yoga, hacer natación, practicar atletismo.*
    - Other hobbies: *ir al cine, salir con amigos, ver series, escuchar música, leer, cocinar, pintar, bailar, correr, montar en bici, dar un paseo.*
  examples:
    - { es: "Juego al tenis los martes y toco la guitarra.", en: "I play tennis on Tuesdays and I play the guitar." }
    - { es: "¿Jugáis a las cartas?", en: "Do you (all) play cards?" }
    - { es: "Mi hermano hace natación.", en: "My brother does swimming." }
  pitfalls:
    - "Spain keeps the *a*: *jugar al fútbol*; Latin America often says *jugar fútbol*."
  variant: "In Latin America *jugar fútbol / jugar tenis* without *a* is standard."
  drills:
    - { es: "Ella toca el piano muy bien.", en: "She plays the piano very well." }
    - { es: "Los domingos jugamos al baloncesto.", en: "On Sundays we play basketball." }
- id: g.estar-gerund
  level: a1
  title: "Estar + gerund — what is happening right now"
  summary: "estoy comiendo, estás hablando, está lloviendo."
  explanation: |
    Form the gerund: *-ar → -ando* (*hablando*), *-er / -ir → -iendo* (*comiendo, viviendo*). Then **estar + gerund** describes an action in progress at this moment:
    - *Estoy estudiando.* — I am studying (right now).
    - *¿Qué estás haciendo?* — What are you doing?
    - *Está lloviendo.* — It's raining.

    Irregular gerunds: *leer → leyendo, oír → oyendo, ir → yendo, dormir → durmiendo, pedir → pidiendo, decir → diciendo, venir → viniendo, poder → pudiendo.*

    Unlike English, the simple present is still used for routines and the near future: *Trabajo en un banco. Mañana voy a Madrid.* Pronouns go before *estar* or attach to the gerund: *Me estoy duchando / Estoy duchándome.*
  examples:
    - { es: "Los niños están jugando en el jardín.", en: "The children are playing in the garden." }
    - { es: "No puedo hablar, estoy conduciendo.", en: "I can't talk, I'm driving." }
    - { es: "¿Estáis viendo la televisión?", en: "Are you (all) watching TV?" }
  pitfalls:
    - "Not used for the future: *mañana trabajo*, not *mañana estoy trabajando*."
  drills:
    - { es: "Estoy leyendo un libro muy bueno.", en: "I'm reading a very good book." }
    - { es: "Mi madre está cocinando.", en: "My mother is cooking." }
- id: g.directions-imperative
  level: a1
  title: "Giving directions — gira, sigue, cruza"
  summary: "Sigue todo recto, gira a la derecha, cruza la plaza, está a dos calles."
  explanation: |
    To give directions to one person informally you use the *tú* imperative, which for regular verbs looks like the *él* form of the present:
    - *sigue todo recto* — go straight on · *gira a la derecha / izquierda* — turn right / left
    - *cruza la calle / la plaza* — cross the street / square · *toma la primera / segunda calle* — take the first / second street
    - *coge el autobús 5* (Spain) — take the number 5 bus · *baja / sube la calle* — go down / up the street
    - *está a cinco minutos / a dos calles* — it's five minutes / two streets away
    - *al final de la calle, en la esquina, al lado de, enfrente de*

    Formal (*usted*): *siga, gire, cruce, tome, coja.*
    Asking: *Perdone, ¿dónde está…? ¿Cómo llego a…? ¿Está lejos?*
  examples:
    - { es: "Sigue todo recto y gira a la izquierda en el semáforo.", en: "Go straight on and turn left at the traffic lights." }
    - { es: "Perdone, ¿cómo llego a la estación?", en: "Excuse me, how do I get to the station?" }
    - { es: "Cruza la plaza; el museo está enfrente.", en: "Cross the square; the museum is opposite." }
  pitfalls:
    - "*coger* is normal in Spain but vulgar in much of Latin America, where *tomar* / *agarrar* is used."
  variant: "Latin America uses *tomar* instead of *coger* and *derecho* for \"straight on\"."
  drills:
    - { es: "Toma la segunda calle a la derecha.", en: "Take the second street on the right." }
    - { es: "Está al final de la calle, a la izquierda.", en: "It's at the end of the street, on the left." }
- id: g.tener-que
  level: a1
  title: "Tener que + infinitive — having to"
  summary: "Tengo que estudiar. ¿Tienes que trabajar? No tenemos que ir."
  explanation: |
    **tener que + infinitive** expresses obligation or necessity:
    - *Tengo que ir al médico.* — I have to go to the doctor.
    - *¿Tienes que trabajar mañana?* — Do you have to work tomorrow?
    - *No tenemos que pagar.* — We don't have to pay.

    Similar: *deber + infinitive* (should / must, more moral): *Debes estudiar más.* And *necesitar + infinitive*: *Necesito dormir.*

    The *que* is essential: *tengo que ir*, never *tengo ir*.
  examples:
    - { es: "Tengo que levantarme temprano.", en: "I have to get up early." }
    - { es: "Tenéis que ver esta película.", en: "You (all) have to see this film." }
    - { es: "Ella tiene que estudiar para el examen.", en: "She has to study for the exam." }
  pitfalls:
    - "*hay que* is impersonal (one has to); *tener que* names the person."
  drills:
    - { es: "Tenemos que comprar leche.", en: "We have to buy milk." }
    - { es: "¿Tienes que irte ya?", en: "Do you have to leave already?" }
- id: g.hay-que
  level: a1
  title: "Hay que — one has to"
  summary: "Hay que estudiar para aprender. No hay que correr."
  explanation: |
    **hay que + infinitive** gives a general, impersonal obligation (nobody in particular):
    - *Hay que reservar mesa.* — You have to (one has to) book a table.
    - *Para ir al centro hay que coger el metro.* — To get downtown you need to take the metro.
    - *No hay que gritar.* — There's no need to shout / one mustn't shout.

    Compare: *Tengo que reservar* (I personally must).

    Related impersonal forms: *se puede* (one can), *se necesita* (is needed), *es necesario / es importante + infinitive.*
  examples:
    - { es: "Hay que llegar diez minutos antes.", en: "You have to arrive ten minutes early." }
    - { es: "En España hay que cenar tarde.", en: "In Spain you have to eat dinner late." }
    - { es: "¿Hay que pagar para entrar?", en: "Do you have to pay to get in?" }
  pitfalls:
    - "*hay que* never changes form — there is no *hay que* for 'we'."
  drills:
    - { es: "Hay que practicar todos los días.", en: "One has to practise every day." }
    - { es: "No hay que tener miedo.", en: "There's no need to be afraid." }
- id: g.prepositions-movement
  level: a1
  title: "Movement — a, de, en, por, hasta, desde"
  summary: "ir a, venir de, pasar por, hasta la plaza, desde mi casa."
  explanation: |
    - **a** — to (destination): *Voy a la playa.* Also for distance: *está a 10 km.*
    - **de** — from (origin): *Vengo de Madrid. Salgo de casa a las ocho.*
    - **en** — by (transport) and in/at (place): *Voy en tren. Estoy en la oficina.*
    - **por** — through / along / around: *Paseo por el parque. Pasa por la plaza.*
    - **hasta** — as far as / until: *Sigue hasta el semáforo.*
    - **desde** — from (starting point): *Desde aquí se ve el mar.*
    - **hacia** — towards: *Camina hacia el río.*
    - *a pie* (on foot), *a caballo* (on horseback), but *en bici*.
  examples:
    - { es: "Voy de casa al trabajo en autobús.", en: "I go from home to work by bus." }
    - { es: "Paseamos por el centro hasta la catedral.", en: "We stroll through the centre as far as the cathedral." }
    - { es: "El tren sale de Madrid y llega a Sevilla.", en: "The train leaves Madrid and arrives in Seville." }
  pitfalls:
    - "*llegar a* (arrive in/at), *entrar en* (enter), *salir de* (leave)."
  drills:
    - { es: "Caminamos hacia la playa.", en: "We walk towards the beach." }
    - { es: "Vengo del supermercado.", en: "I'm coming from the supermarket." }
- id: g.ir-a-future
  level: a1
  title: "Talking about plans — ir a, pensar, querer + infinitive"
  summary: "Voy a viajar. Pienso estudiar. Quiero visitar. El año que viene…"
  explanation: |
    Three A1 ways to talk about the future:
    1. **ir a + infinitive** — intention / prediction: *Voy a aprender español.*
    2. **pensar + infinitive** — plan: *Pienso ir a México.* (I'm planning to)
    3. **querer + infinitive** — wish: *Quiero visitar Perú.*

    Time expressions: *esta tarde / noche, mañana, pasado mañana, el fin de semana, la semana / el mes / el año que viene, la próxima semana, en verano, dentro de dos días* (in two days).

    The present can also mark a scheduled future: *El tren sale a las ocho. Mañana tengo un examen.*
  examples:
    - { es: "El año que viene vamos a vivir en Valencia.", en: "Next year we're going to live in Valencia." }
    - { es: "Pienso estudiar medicina.", en: "I plan to study medicine." }
    - { es: "Dentro de dos semanas tengo vacaciones.", en: "In two weeks I'm on holiday." }
  pitfalls:
    - "*pensar en* = to think about; *pensar + infinitive* = to plan to."
  drills:
    - { es: "¿Qué vas a hacer mañana?", en: "What are you going to do tomorrow?" }
    - { es: "Quiero aprender a cocinar.", en: "I want to learn to cook." }
- id: g.connectors-basic
  level: a1
  title: "Connecting ideas — y, pero, porque, o, también, por eso"
  summary: "Link sentences with y, o, pero, porque, por eso, también, entonces."
  explanation: |
    - **y** — and (*e* before i-/hi-: *padres e hijos*)
    - **o** — or (*u* before o-/ho-: *siete u ocho*)
    - **pero** — but
    - **porque** — because · **por eso** — that's why / so
    - **también** — also · **tampoco** — neither
    - **entonces** — then / so · **luego / después** — then / afterwards
    - **primero … luego … finalmente** — first … then … finally
    - **además** — besides · **sin embargo** — however (A2)
    - **que** — that: *Creo que es verdad.*
  examples:
    - { es: "Me gusta el café, pero no me gusta el té.", en: "I like coffee, but I don't like tea." }
    - { es: "No voy porque estoy cansado.", en: "I'm not going because I'm tired." }
    - { es: "Estudio mucho; por eso tengo buenas notas.", en: "I study a lot; that's why I get good marks." }
  pitfalls:
    - "*porque* (because, one word) vs *¿por qué?* (why, two words with accent)."
  drills:
    - { es: "Primero desayuno y luego voy al trabajo.", en: "First I have breakfast and then I go to work." }
    - { es: "¿Quieres té o café?", en: "Do you want tea or coffee?" }
- id: g.present-review
  level: a1
  title: "The present tense — review"
  summary: "Regular -ar/-er/-ir endings, stem changes, irregular yo forms and the key irregulars ser, estar, ir, tener, hacer."
  explanation: |
    ### Regular endings
    | | -ar | -er | -ir |
    |---|---|---|---|
    | yo | -o | -o | -o |
    | tú | -as | -es | -es |
    | él/ella/usted | -a | -e | -e |
    | nosotros | -amos | -emos | -imos |
    | vosotros | -áis | -éis | -ís |
    | ellos/ustedes | -an | -en | -en |

    ### Patterns to remember
    - **Stem changes** (not nosotros/vosotros): *e→ie* (querer), *o→ue* (poder), *e→i* (pedir), *u→ue* (jugar).
    - **Irregular yo**: *hago, pongo, salgo, tengo, vengo, digo, traigo, conozco, sé, veo, doy, estoy, soy, voy.*
    - **Fully irregular**: *ser* (soy, eres, es, somos, sois, son), *ir* (voy, vas, va, vamos, vais, van), *estar* (estoy, estás, está…).

    ### Uses
    Habits (*Trabajo en Madrid*), present facts, actions in progress (*¿Qué haces?*) and scheduled future (*Mañana salgo a las ocho*).
  examples:
    - { es: "Los lunes trabajo, pero los sábados duermo hasta tarde.", en: "On Mondays I work, but on Saturdays I sleep till late." }
    - { es: "¿Qué hacéis? Estamos viendo una película.", en: "What are you doing? We're watching a film." }
    - { es: "Mi hermana no sabe conducir pero quiere aprender.", en: "My sister can't drive but wants to learn." }
  pitfalls:
    - "Keep the stress right: *hablo* (present) vs *habló* (past)."
  drills:
    - { es: "Salgo de casa a las ocho y llego al trabajo a las nueve.", en: "I leave home at eight and get to work at nine." }
    - { es: "Ellos viven en Londres pero vienen a España cada verano.", en: "They live in London but come to Spain every summer." }
- id: g.tambien-tampoco
  level: a1
  title: "También and tampoco — me too, me neither"
  summary: "Yo también. Yo tampoco. A mí también. A mí tampoco."
  explanation: |
    - After an affirmative statement: **también** (also / too). *Vivo en Madrid. — Yo también.*
    - After a negative statement: **tampoco** (neither / not either). *No como carne. — Yo tampoco.*
    - To disagree: *Yo sí* (I do) / *Yo no* (I don't).
    - With *gustar*-type verbs use *a mí*: *Me gusta el cine. — A mí también. / A mí no.* *No me gusta. — A mí tampoco. / A mí sí.*
    - *Tampoco* before the verb replaces *no*: *Tampoco tengo coche.* After the verb it needs *no*: *No tengo coche tampoco.*
  examples:
    - { es: "Soy de Londres. — ¡Yo también!", en: "I'm from London. — Me too!" }
    - { es: "No tengo hermanos. — Yo tampoco.", en: "I don't have siblings. — Me neither." }
    - { es: "Me encanta bailar. — A mí no.", en: "I love dancing. — I don't." }
  pitfalls:
    - "*también no* is wrong; use *tampoco*."
  drills:
    - { es: "Ella también habla francés.", en: "She also speaks French." }
    - { es: "Tampoco me gusta el pescado.", en: "I don't like fish either." }
- id: g.stress-and-tilde
  level: a1
  title: "Stress and the written accent (tilde)"
  summary: "Three rules decide where the stress falls and when the tilde is written."
  explanation: |
    Every Spanish word has one stressed syllable, and the spelling tells you where:
    1. A vowel with a **tilde** (´) is stressed: *canción, música, está.*
    2. Otherwise, a word ending in a **vowel, -n or -s** is stressed on the **second-to-last** syllable: *CA-sa, HA-blan, LU-nes.*
    3. Otherwise the **last** syllable: *ha-BLAR, ciu-DAD, re-LOJ.*

    The tilde is written only when the stress breaks rules 2–3:
    - stressed on the last syllable and ending in vowel/-n/-s → *canción, café, jamás*
    - stressed on the second-to-last and ending in another consonant → *árbol, lápiz*
    - stressed on the third-from-last or earlier → always: *música, teléfono, dígamelo*
    - a stressed **i** or **u** next to a/e/o (hiatus) → always: *país, día, baúl, oír*
    - one-syllable words never, except to tell apart pairs: *sí/si, él/el, tú/tu, más/mas, té/te, sé/se, qué/que, mí/mi*

    It changes meaning: *hablo* (I speak) / *habló* (he spoke); *esta* (this) / *está* (is); *papa* (potato) / *papá* (dad).
  examples:
    - { es: "El sábado compró un sofá y una lámpara.", en: "On Saturday she bought a sofa and a lamp." }
    - { es: "¿Qué estudias? — Estudio música.", en: "What do you study? — I study music." }
  pitfalls:
    - "Plurals can gain or lose the tilde: *canción → canciones, examen → exámenes.*"
  drills:
    - { es: "Mi papá habló con el médico.", en: "My dad spoke with the doctor." }
    - { es: "Está en el país más bonito.", en: "She is in the most beautiful country." }
- id: g.alphabet-and-sounds
  level: a1
  title: "The alphabet and the sounds of Spanish"
  summary: "Spanish is written as it sounds: five pure vowels, ñ, ll, rr, silent h, j = /x/, c/z = /θ/ in Spain."
  explanation: |
    - **Vowels** a, e, i, o, u: always the same short, pure sound.
    - **ñ** /ɲ/ as in *año, España* — a different letter from n (*ano* means anus!).
    - **h** is silent: *hola, hora.* **ch** = "ch".
    - **j** and **g** before e/i = /x/ (a rough h): *jamón, gente.* **gu** before e/i keeps a hard g: *guerra, guitarra.*
    - **c** before e/i and **z** = /θ/ in Spain ("th" of *think*): *cena, zapato.* **c** before a/o/u and **qu** = /k/: *casa, queso.*
    - **r** between vowels is a tap; **rr** and initial **r** are trilled: *pero / perro.*
    - **ll** and **y** = /ʝ/: *calle, yo.* **v** = **b**: *vaca* sounds like *baca.*
    - **x** = /ks/ (*examen*), /s/ before a consonant in casual speech (*extra*), /x/ in *México.*
    - Letter names: a, be, ce, de, e, efe, ge, hache, i, jota, ka, ele, eme, ene, eñe, o, pe, cu, erre, ese, te, u, uve, uve doble, equis, i griega, zeta.
  examples:
    - { es: "¿Cómo se escribe tu apellido? — Ge, a, erre, ce, i, a: García.", en: "How do you spell your surname? — G, a, r, c, i, a: García." }
    - { es: "El niño come jamón y queso.", en: "The boy eats ham and cheese." }
  variant: "Latin America pronounces c/z as /s/ (seseo) and often ll as /ʒ/ or /ʃ/ in Argentina."
  drills:
    - { es: "Mi hija tiene ocho años.", en: "My daughter is eight years old." }
    - { es: "El perro de Rosa es rojo.", en: "Rosa's dog is red." }
