        alt: ["得。", "唔得呀。"]
        grammar: [g.prices-gei-do-cin]
        vocab: [w.dak1-laa3, w.m4-dak1]
    texts:
      - title: "灣仔街市"
        es: ["灣仔街市好多人。", "啲菜好新鮮，十二蚊一斤。", "啲橙十蚊三個，唔貴。"]
        en: ["Wan Chai market is very busy.", "The vegetables are very fresh, twelve dollars a catty.", "The oranges are three for ten dollars. Not expensive."]
        grammar: [g.prices-gei-do-cin]
        vocab: [w.gaai1-si5, w.coi3, w.gan1, w.caang2]
      - title: "價錢牌"
        es: ["蘋果：十蚊兩個。", "香蕉：十五蚊一斤。", "白菜：十二蚊一斤。"]
        en: ["Apples: two for ten dollars.", "Bananas: fifteen dollars a catty.", "Bok choy: twelve dollars a catty."]
        grammar: [g.prices-gei-do-cin]
        vocab: [w.ping4-gwo2, w.hoeng1-ziu1, w.baak6-coi3]
    spicy:
      - { es: "老闆，你啲橙好甜，你個人都好甜。", en: "Boss, your oranges are so sweet, and so are you.", altEs: ["老闆，你啲橙好甜，你都好甜。"], grammar: [g.di-some], vocab: [w.lou5-baan2, w.caang2] }
      - { es: "呢個幾多錢呀？你個電話號碼又幾多錢呀？", en: "How much is this? And how much for your phone number?", altEs: ["呢個幾錢呀？你個電話號碼又幾錢呀？"], grammar: [g.prices-gei-do-cin], vocab: [w.gei2-cin2] }
      - { es: "平啲得唔得呀？唔得？噉我聽日再嚟搵你。", en: "Can you make it cheaper? No? Then I'll come back and see you tomorrow.", altEs: ["平啲得唔得？唔得？我聽日再嚟搵你。"], grammar: [g.prices-gei-do-cin], vocab: [w.peng4-di1] }
      - { es: "街市最新鮮嘅，係你。", en: "The freshest thing in the market is you.", altEs: ["街市最新鮮嘅係你。"], grammar: [g.di-some], vocab: [w.gaai1-si5, w.san1-sin1] }
      - { es: "你笑一笑，我就唔講價喇。", en: "Give me a smile and I'll stop haggling.", altEs: ["你笑吓，我就唔講價。"], grammar: [g.prices-gei-do-cin], vocab: [w.gaa3-cin4] }
  - id: a1.u06.l4
    title: 我要兩斤
    teach: [g.jiu-want]
    tip: "要 + noun orders or buys something (我要兩斤); 想 + verb says what you would like to do (我想買啲生果). 要 + verb usually means 'have to'."
    vocab: [w.jiu3, w.soeng2.b, w.maai5, w.maai5-je5, w.maai5-sung3, w.sung3, w.juk6, w.zyu1-juk6, w.ngau4-juk6, w.gai1, w.gai1-daan2, w.daan2, w.haa1, w.mai5, w.tai2, w.haa5, w.gaan2, w.do1-di1]
    sentences:
      - { es: "我要兩斤豬肉。", en: "I'd like two catties of pork.", altEs: ["兩斤豬肉，唔該。"], grammar: [g.jiu-want, g.loeng-vs-ji], vocab: [w.jiu3, w.zyu1-juk6],
          transform: { instruction: "Ask for one catty of beef instead", answer: "我要一斤牛肉。", alt: ["一斤牛肉，唔該。"] } }
      - { es: "我想買啲生果。", en: "I'd like to buy some fruit.", altEs: ["我想去買啲生果。"], grammar: [g.jiu-want, g.di-some], vocab: [w.soeng2.b, w.maai5] }
      - { es: "你要唔要膠袋呀？", en: "Do you want a plastic bag?", altEs: ["要唔要膠袋呀？"], grammar: [g.jiu-want, g.a-not-a-questions], vocab: [w.jiu3] }
      - { es: "唔要喇，唔該。", en: "No, thanks.", altEs: ["唔使喇，唔該。", "唔要，唔該。"], grammar: [g.jiu-want], vocab: [w.jiu3] }
      - { es: "我阿媽日日都去街市買餸。", en: "My mum goes to the market every day to buy food.", altEs: ["我媽媽日日都去街市買餸。"], grammar: [g.jiu-want], vocab: [w.maai5-sung3] }
      - { es: "我想食牛肉，唔想食雞。", en: "I want to eat beef, not chicken.", altEs: ["我想食牛肉，唔食雞。"], grammar: [g.jiu-want], vocab: [w.ngau4-juk6, w.gai1] }
      - { es: "一隻雞幾多錢呀？", en: "How much is a chicken?", altEs: ["隻雞幾錢呀？"], grammar: [g.prices-gei-do-cin], vocab: [w.gai1] }
      - { es: "我要十隻雞蛋。", en: "I'd like ten eggs.", altEs: ["十隻雞蛋，唔該。", "我要十隻蛋。"], grammar: [g.jiu-want, g.classifiers-intro], vocab: [w.gai1-daan2, w.daan2] }
      - { es: "啲蝦好新鮮，我要一斤。", en: "The prawns are very fresh. I'll take a catty.", altEs: ["啲蝦好新鮮，要一斤。"], grammar: [g.jiu-want, g.di-some], vocab: [w.haa1] }
      - { es: "屋企冇米喇，要買米。", en: "We're out of rice at home. We need to buy rice.", altEs: ["屋企冇晒米，要買米。"], grammar: [g.jiu-want, g.mou-negation], vocab: [w.mai5], note: "要 + verb means 'have to'." }
      - { es: "我睇吓先。", en: "I'm just looking.", altEs: ["睇吓先，唔該。", "我睇吓先，唔該。"], altEn: ["Let me have a look first."], grammar: [g.jiu-want], vocab: [w.tai2, w.haa5] }
      - { es: "你自己揀啦。", en: "Pick them yourself.", altEs: ["你揀啦。", "隨便揀啦。"], grammar: [g.jiu-want], vocab: [w.gaan2] }
      - { es: "我想要多啲。", en: "I'd like a bit more.", altEs: ["多啲，唔該。", "我要多啲。"], grammar: [g.jiu-want, g.di-some], vocab: [w.do1-di1] }
      - { es: "我想去灣仔買嘢。", en: "I'd like to go shopping in Wan Chai.", altEs: ["我想去灣仔買嘢呀。"], grammar: [g.jiu-want], vocab: [w.maai5-je5],
          error: { wrong: "我要去灣仔買嘢。", explain: "要 + verb sounds like 'I have to'. For 'I'd like to' use 想: 我想去灣仔買嘢.", grammar: g.jiu-want } }
      - { es: "你想食乜嘢呀？", en: "What would you like to eat?", altEs: ["你想食咩呀？"], grammar: [g.jiu-want, g.question-words], vocab: [w.soeng2.b] }
      - { es: "今晚嘅餸係豬肉同菜。", en: "Tonight's dishes are pork and vegetables.", altEs: ["今晚食豬肉同菜。"], grammar: [g.jiu-want], vocab: [w.sung3, w.juk6] }
    exchanges:
      - q: { es: "你要乜嘢呀？", en: "What would you like?" }
        a: { es: "我要一斤豬肉，唔該。", en: "A catty of pork, please." }
        alt: ["一斤豬肉。", "我要半斤牛肉。"]
        grammar: [g.jiu-want]
        vocab: [w.jiu3, w.zyu1-juk6]
      - q: { es: "要唔要膠袋呀？", en: "Do you want a bag?" }
        a: { es: "唔要，我自己帶咗。", en: "No, I brought my own." }
        alt: ["要，唔該。", "唔使喇。"]
        grammar: [g.jiu-want, g.a-not-a-questions]
        vocab: [w.jiu3]
      - q: { es: "你想買乜嘢呀？", en: "What would you like to buy?" }
        a: { es: "我睇吓先，唔該。", en: "I'm just looking, thanks." }
        alt: ["我想買啲生果。", "睇吓先。"]
        grammar: [g.jiu-want]
        vocab: [w.soeng2.b, w.tai2]
      - q: { es: "仲要唔要啲乜嘢呀？", en: "Anything else?" }
        a: { es: "仲要十隻雞蛋。", en: "Ten eggs as well." }
        alt: ["唔要喇，唔該。", "夠喇。"]
        grammar: [g.jiu-want]
        vocab: [w.gai1-daan2]
      - q: { es: "你今晚想食乜嘢呀？", en: "What do you feel like eating tonight?" }
        a: { es: "我想食蝦。", en: "I feel like prawns." }
        alt: ["牛肉。", "冇所謂，你揀啦。"]
        grammar: [g.jiu-want]
        vocab: [w.haa1, w.gaan2]
    texts:
      - title: "買餸"
        es: ["我阿媽要我去街市買餸。", "我要買一斤豬肉、十隻雞蛋同一棵白菜。", "老闆仲送咗兩條蔥畀我！"]
        en: ["My mum wants me to go to the market to buy food.", "I need to buy a catty of pork, ten eggs and a bok choy.", "The stallholder even gave me two spring onions for free!"]
        grammar: [g.jiu-want]
        vocab: [w.maai5-sung3, w.zyu1-juk6, w.gai1-daan2]
      - title: "WhatsApp"
        es: ["你喺街市嗎？", "唔該買多啲蝦。", "我今晚想食蝦！"]
        en: ["Are you at the market?", "Please buy some more prawns.", "I want to eat prawns tonight!"]
        grammar: [g.jiu-want]
        vocab: [w.do1-di1, w.haa1]
    spicy:
      - { es: "我唔要膠袋，我要你個電話號碼。", en: "I don't want a plastic bag. I want your phone number.", altEs: ["唔要膠袋，要你電話號碼。"], grammar: [g.jiu-want], vocab: [w.jiu3] }
      - { es: "我想同你一齊去買餸，然後一齊煮飯。", en: "I'd like to go food shopping with you, and then cook together.", altEs: ["我想同你去買餸，跟住一齊煮飯。"], grammar: [g.jiu-want], vocab: [w.soeng2.b, w.maai5-sung3] }
      - { es: "你揀啦，我食咩都得，同你食就得。", en: "You choose. I'll eat anything, as long as it's with you.", altEs: ["你揀啦，食咩都得，同你食就得。"], grammar: [g.jiu-want], vocab: [w.gaan2] }
      - { es: "我睇吓先……睇你。", en: "I'm just looking... at you.", altEs: ["我睇吓先，睇吓你。"], grammar: [g.jiu-want], vocab: [w.tai2] }
      - { es: "老闆，我想要多啲……你嘅笑容。", en: "Boss, I'd like a bit more... of your smile.", altEs: ["老闆，我想要多啲你嘅笑容。"], grammar: [g.jiu-want, g.di-some], vocab: [w.do1-di1] }
dialogues:
  - id: a1.u06.d1
    title: 灣仔街市
    context: Mandy takes Sam to Wan Chai market to buy food for dinner.
    lines:
      - { speaker: 老闆, es: "靚仔，要啲乜嘢呀？", en: "Hey there, what can I get you?" }
      - { speaker: Sam, es: "啲橙點賣呀？", en: "How much are the oranges?" }
      - { speaker: 老闆, es: "十蚊三個，好甜㗎！", en: "Three for ten dollars. Very sweet!" }
      - { speaker: Sam, es: "我要六個。仲有，白菜幾錢一斤呀？", en: "I'll have six. And how much is bok choy a catty?" }
      - { speaker: 老闆, es: "十二蚊一斤。", en: "Twelve dollars a catty." }
      - { speaker: Mandy, es: "我要一斤。老闆，平啲得唔得呀？", en: "I'll take a catty. Boss, can you do it a bit cheaper?" }
      - { speaker: 老闆, es: "好啦，一共三十蚊啦。", en: "OK, thirty dollars altogether then." }
      - { speaker: Sam, es: "收唔收八達通呀？", en: "Do you take Octopus?" }
      - { speaker: 老闆, es: "唔收呀，淨係收現金。", en: "No, cash only." }
      - { speaker: Mandy, es: "唔緊要，我有散紙。三十蚊，畀你。", en: "Never mind, I have change. Thirty dollars, here you are." }
      - { speaker: 老闆, es: "唔該晒！要唔要膠袋呀？", en: "Thanks a lot! Do you want a bag?" }
      - { speaker: Sam, es: "唔要喇，我哋自己帶咗。", en: "No thanks, we brought our own." }
    questions:
      - { q: "啲橙點賣呀？", options: ["十蚊三個", "十蚊一個", "三十蚊一斤"], answer: 0, explain: "老闆 says 十蚊三個: three for ten dollars." }
      - { q: "Sam要幾多個橙？", options: ["三個", "六個", "十個"], answer: 1, explain: "我要六個: he wants six." }
      - { q: "一共幾多錢呀？", options: ["二十二蚊", "三十蚊", "三十二蚊"], answer: 1, explain: "After Mandy haggles, the owner says 一共三十蚊啦." }
      - { q: "佢哋點樣畀錢？", options: ["用八達通", "用散紙", "唔使畀錢"], answer: 1, explain: "The stall only takes cash (淨係收現金), so Mandy pays with her change (散紙)." }
