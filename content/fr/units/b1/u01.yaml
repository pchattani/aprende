id: b1.u01
title: "Au Vieux-Port, je vous le mets ?"
lessons:
  - id: b1.u01.l1
    title: Au marché aux poissons
    teach: [g.double-object-pronouns]
    tip: "Before the verb: me/te/nous/vous, then le/la/les, then lui/leur. Je vous le mets ? / Je la lui donne."
    vocab: [w.marché-aux-poissons, w.pêcheur, w.poissonnier, w.rouget, w.dorade, w.sardine, w.thon, w.saumon, w.filet, w.frais, w.emballer, w.peser, w.client, w.commerçant, w.étal, w.marchander, w.sachet, w.monnaie, w.rendre-la-monnaie, w.reçu, w.ticket-de-caisse, w.mettre-de-côté, w.marchandise]
    sentences:
      - { es: "Ces rougets, je vous les mets de côté ?", en: "These red mullet, shall I put them aside for you?", altEs: ["Je vous mets ces rougets de côté ?"], altEn: ["Shall I put these red mullet aside for you?"], grammar: [g.double-object-pronouns], vocab: [w.rouget, w.mettre-de-côté] }
      - { es: "Le poissonnier me pèse les sardines, puis il me les emballe.", en: "The fishmonger weighs the sardines for me, then he wraps them for me.", altEs: ["Le poissonnier me pèse les sardines et il me les emballe.", "Le poissonnier me pèse les sardines et me les emballe."], altEn: ["The fishmonger weighs the sardines for me and then wraps them up for me."], grammar: [g.double-object-pronouns], vocab: [w.poissonnier, w.peser, w.sardine, w.emballer] }
      - { es: "Ce thon, vous me le pesez, s'il vous plaît ?", en: "This tuna, could you weigh it for me, please?", altEs: ["Vous me pesez ce thon, s'il vous plaît ?", "Vous pouvez me peser ce thon, s'il vous plaît ?"], altEn: ["Could you weigh this tuna for me, please?", "Will you weigh this tuna for me, please?"], grammar: [g.double-object-pronouns], vocab: [w.thon, w.peser] }
      - { es: "La dorade est très fraîche : le pêcheur nous l'a vendue ce matin.", en: "The sea bream is very fresh: the fisherman sold it to us this morning.", altEs: ["La dorade est très fraîche, le pêcheur nous l'a vendue ce matin."], grammar: [g.double-object-pronouns, g.pc-object-agreement], vocab: [w.dorade, w.frais, w.pêcheur] }
      - { es: "Ta recette de soupe de poisson, tu me la donnes ?", en: "Your fish soup recipe, will you give it to me?", altEs: ["Tu me donnes ta recette de soupe de poisson ?"], altEn: ["Will you give me your fish soup recipe?"], grammar: [g.double-object-pronouns], vocab: [w.recette] }
      - { es: "Le commerçant ne nous a pas rendu la monnaie.", en: "The shopkeeper didn't give us our change.", altEs: ["Le commerçant ne nous a pas rendu notre monnaie."], altEn: ["The shopkeeper didn't give us the change."], grammar: [g.double-object-pronouns], vocab: [w.commerçant, w.rendre-la-monnaie, w.monnaie], transform: { instruction: "Replace 'la monnaie' with a pronoun", answer: "Le commerçant ne nous l'a pas rendue.", alt: ["Il ne nous l'a pas rendue."], en: "The shopkeeper didn't give it back to us." } }
      - { es: "Le reçu ? Je vous le donne tout de suite.", en: "The receipt? I'll give it to you right away.", altEs: ["Le ticket de caisse ? Je vous le donne tout de suite.", "Le reçu ? Je vous le donne tout de suite, monsieur."], grammar: [g.double-object-pronouns], vocab: [w.reçu, w.ticket-de-caisse], error: { wrong: "Le reçu ? Je le vous donne tout de suite.", explain: "me, te, nous, vous come before le, la, les: je vous le donne.", grammar: g.double-object-pronouns } }
      - { es: "Tu envoies les photos du marché à tes parents ? — Je les leur ai déjà envoyées.", en: "Are you sending the photos of the market to your parents? — I've already sent them to them.", altEn: ["Are you sending your parents the photos of the market? — I've already sent them."], grammar: [g.double-object-pronouns, g.pc-object-agreement], vocab: [w.marché-aux-poissons] }
      - { es: "Vous pouvez me mettre les filets dans un sachet ? — Bien sûr, je vous les mets dans un sachet.", en: "Can you put the fillets in a bag for me? — Of course, I'll put them in a bag for you.", altEs: ["Vous pouvez me mettre les filets dans un sachet ? — Bien sûr, je vous les y mets."], grammar: [g.double-object-pronouns], vocab: [w.filet, w.sachet] }
      - { es: "Sur cet étal, on marchande : la commerçante me les a laissés à dix euros.", en: "At this stall, people haggle: the stallholder let me have them for ten euros.", altEs: ["Sur cet étal on marchande, la commerçante me les a laissés à dix euros."], grammar: [g.double-object-pronouns], vocab: [w.étal, w.marchander, w.commerçant] }
      - { es: "Qui t'a vendu ce saumon ? — C'est le pêcheur du quai qui me l'a vendu.", en: "Who sold you this salmon? — It was the fisherman on the quay who sold it to me.", altEs: ["Qui t'a vendu ce saumon ? — Le pêcheur du quai me l'a vendu."], grammar: [g.double-object-pronouns], vocab: [w.saumon, w.pêcheur] }
      - { es: "Le prix ? Le poissonnier ne me l'a pas dit.", en: "The price? The fishmonger didn't tell me.", altEn: ["The price? The fishmonger hasn't told me."], grammar: [g.double-object-pronouns], vocab: [w.poissonnier], transform: { instruction: "Change to the present", answer: "Le prix ? Le poissonnier ne me le dit pas.", alt: ["Le poissonnier ne me le dit pas."], en: "The price? The fishmonger doesn't tell me." } }
      - { es: "Ces sardines sont pour ta grand-mère ? Tu les lui apportes ce soir ?", en: "Are these sardines for your grandmother? Are you taking them to her tonight?", altEs: ["Ces sardines sont pour ta grand-mère ? Tu vas les lui apporter ce soir ?"], grammar: [g.double-object-pronouns], vocab: [w.sardine], error: { wrong: "Ces sardines sont pour ta grand-mère ? Tu lui les apportes ce soir ?", explain: "le, la, les come before lui, leur: tu les lui apportes.", grammar: g.double-object-pronouns } }
      - { es: "Les clients choisissent la marchandise et le poissonnier la leur prépare.", en: "The customers choose the goods and the fishmonger prepares them for them.", altEs: ["Les clients choisissent la marchandise, puis le poissonnier la leur prépare."], altEn: ["The customers choose the goods and the fishmonger gets them ready for them."], grammar: [g.double-object-pronouns], vocab: [w.client, w.marchandise, w.poissonnier] }
    exchanges:
      - q: { es: "Ces rougets, je vous les mets de côté ?", en: "These red mullet, shall I put them aside for you?" }
        a: { es: "Oui, merci, je passe les chercher à midi.", en: "Yes, thanks, I'll come by and pick them up at noon." }
        alt: ["Oui, merci, je reviens à midi.", "Non merci, je les prends maintenant."]
        grammar: [g.double-object-pronouns]
        vocab: [w.rouget, w.mettre-de-côté]
      - q: { es: "Vous me rendez la monnaie ?", en: "Will you give me my change?" }
        a: { es: "Oh pardon, je vous la rends tout de suite.", en: "Oh sorry, I'll give it to you right away." }
        alt: ["Pardon, je vous la rends.", "Voilà, je vous la rends."]
        grammar: [g.double-object-pronouns]
        vocab: [w.rendre-la-monnaie, w.monnaie]
      - q: { es: "Tu as donné la recette à ta voisine ?", en: "Did you give the recipe to your neighbour?" }
        a: { es: "Oui, je la lui ai donnée hier.", en: "Yes, I gave it to her yesterday." }
        alt: ["Non, je ne la lui ai pas encore donnée.", "Oui, je la lui ai envoyée hier."]
        grammar: [g.double-object-pronouns, g.pc-object-agreement]
        vocab: [w.recette]
      - q: { es: "Le ticket de caisse, vous le voulez ?", en: "Do you want the receipt?" }
        a: { es: "Oui, vous pouvez me le donner, merci.", en: "Yes, you can give it to me, thanks." }
        alt: ["Non merci, gardez-le.", "Oui, merci."]
        grammar: [g.double-object-pronouns]
        vocab: [w.ticket-de-caisse]
      - q: { es: "Qui t'a vendu ces sardines ?", en: "Who sold you these sardines?" }
        a: { es: "C'est le poissonnier du Vieux-Port qui me les a vendues.", en: "It was the fishmonger at the Old Port who sold them to me." }
        alt: ["Le poissonnier du Vieux-Port.", "Un pêcheur du quai me les a vendues."]
        grammar: [g.double-object-pronouns]
        vocab: [w.sardine, w.poissonnier]
    texts:
      - title: "Message de Chloé"
        es: ["Je suis au marché aux poissons.", "Le poissonnier a des rougets magnifiques : je t'en prends ?", "Il me les emballe et je rentre."]
        en: ["I'm at the fish market.", "The fishmonger has wonderful red mullet: shall I get you some?", "He'll wrap them for me and I'll head home."]
        grammar: [g.double-object-pronouns]
        vocab: [w.marché-aux-poissons, w.rouget, w.emballer]
      - title: "Sur le quai"
        es: ["Chaque matin, les pêcheurs vendent leur poisson sur le quai.", "Les clients marchandent un peu, puis les pêcheurs leur pèsent la marchandise.", "Ils la leur emballent dans du papier."]
        en: ["Every morning, the fishermen sell their fish on the quay.", "The customers haggle a little, then the fishermen weigh the goods for them.", "They wrap them in paper for them."]
        grammar: [g.double-object-pronouns]
        vocab: [w.pêcheur, w.marchander, w.peser, w.marchandise]
    spicy:
      - { es: "Ton numéro ? Tu me le donnes ou je le demande au poissonnier ?", en: "Your number? Will you give it to me or shall I ask the fishmonger for it?", altEs: ["Ton numéro, tu me le donnes ou je le demande au poissonnier ?"], grammar: [g.double-object-pronouns], vocab: [w.poissonnier] }
      - { es: "Ce sourire, tu le fais à tous les clients ou tu me le réserves ?", en: "That smile, do you give it to all the customers or do you save it for me?", altEs: ["Ce sourire, tu le fais à tous tes clients ou tu me le réserves ?"], grammar: [g.double-object-pronouns], vocab: [w.client] }
      - { es: "Mon cœur ? Je te le mets de côté, comme les rougets.", en: "My heart? I'll put it aside for you, like the red mullet.", grammar: [g.double-object-pronouns], vocab: [w.mettre-de-côté, w.rouget] }
      - { es: "Tu veux mon dernier rouget ? Je te le donne si tu me donnes ton prénom.", en: "Do you want my last red mullet? I'll give it to you if you give me your first name.", grammar: [g.double-object-pronouns], vocab: [w.rouget] }
      - { es: "Le poissonnier m'a souri ; je ne te le dis pas pour te rendre jaloux, mais il était plus frais que ses sardines.", en: "The fishmonger smiled at me; I'm not telling you to make you jealous, but he was fresher than his sardines.", altEs: ["Le poissonnier m'a souri ; je ne te le dis pas pour te rendre jalouse, mais il était plus frais que ses sardines."], grammar: [g.double-object-pronouns], vocab: [w.poissonnier, w.frais, w.sardine] }
  - id: b1.u01.l2
    title: La recette de la bouillabaisse
    teach: [g.pronoun-order-imperative]
    tip: "Affirmative imperative: verb + le/la/les + moi/lui/nous/leur, with hyphens (donne-le-moi). Negative: back to normal order (ne me le donne pas)."
    vocab: [w.bouillabaisse, w.aïoli, w.safran, w.marin.adj, w.grec, w.marseillais, w.provençal, w.apéro, w.pastis, w.glaçon, w.surprise, w.la-plupart, w.moitié, w.noter, w.compter, w.calculer]
    sentences:
      - { es: "Le safran ? Passe-le-moi, s'il te plaît.", en: "The saffron? Pass it to me, please.", altEs: ["Passe-moi le safran, s'il te plaît."], altEn: ["Pass me the saffron, please."], grammar: [g.pronoun-order-imperative], vocab: [w.safran], error: { wrong: "Le safran ? Passe-moi-le, s'il te plaît.", explain: "Affirmative imperative: the direct pronoun comes first, then the indirect one: passe-le-moi.", grammar: g.pronoun-order-imperative } }
      - { es: "La recette de la bouillabaisse ? Donnez-la-nous !", en: "The bouillabaisse recipe? Give it to us!", altEs: ["Donnez-nous la recette de la bouillabaisse !"], altEn: ["Give us the bouillabaisse recipe!"], grammar: [g.pronoun-order-imperative], vocab: [w.bouillabaisse, w.recette] }
      - { es: "Le secret de mon aïoli ? Ne le leur dis pas !", en: "The secret of my aioli? Don't tell them!", altEs: ["Le secret de mon aïoli ? Ne le dis pas aux autres !"], altEn: ["My aioli's secret? Don't tell it to them!"], grammar: [g.pronoun-order-imperative], vocab: [w.aïoli], transform: { instruction: "Make it affirmative", answer: "Le secret de mon aïoli ? Dis-le-leur !", alt: ["Dis-le-leur !"], en: "The secret of my aioli? Tell them!" } }
      - { es: "Des glaçons ? Donne-m'en trois, merci.", en: "Ice cubes? Give me three, thanks.", altEs: ["Des glaçons ? Donne-moi trois glaçons, merci.", "Des glaçons ? Donne-m'en trois, merci bien."], grammar: [g.pronoun-order-imperative, g.y-en-combinations], vocab: [w.glaçon] }
      - { es: "Le pastis, sers-le bien frais, avec beaucoup d'eau.", en: "Serve the pastis nice and cold, with lots of water.", altEs: ["Sers le pastis bien frais, avec beaucoup d'eau."], altEn: ["The pastis, serve it nice and cold, with plenty of water."], grammar: [g.pronoun-order-imperative], vocab: [w.pastis, w.frais] }
      - { es: "Tes photos de l'apéro, envoie-les-nous ce soir !", en: "Your photos from the drinks, send them to us tonight!", altEs: ["Envoie-nous tes photos de l'apéro ce soir !"], altEn: ["Send us your photos from the drinks tonight!"], grammar: [g.pronoun-order-imperative], vocab: [w.apéro], transform: { instruction: "Make it negative", answer: "Tes photos de l'apéro, ne nous les envoie pas ce soir !", alt: ["Ne nous les envoie pas ce soir !"], en: "Your photos from the drinks, don't send them to us tonight!" } }
      - { es: "Ta bouillabaisse ? Ne me la montre pas, je veux la surprise !", en: "Your bouillabaisse? Don't show it to me, I want it to be a surprise!", altEs: ["Ta bouillabaisse ? Ne me la montre pas, je veux avoir la surprise !"], altEn: ["Your bouillabaisse? Don't show it to me, I want the surprise!"], grammar: [g.pronoun-order-imperative], vocab: [w.bouillabaisse, w.surprise] }
      - { es: "La moitié du poisson, mets-la dans la soupe ; l'autre moitié, garde-la pour demain.", en: "Half the fish, put it in the soup; the other half, keep it for tomorrow.", altEs: ["Mets la moitié du poisson dans la soupe et garde l'autre moitié pour demain."], grammar: [g.pronoun-order-imperative], vocab: [w.moitié] }
      - { es: "La plupart des Marseillais ont leur propre recette : demandez-la-leur !", en: "Most people from Marseille have their own recipe: ask them for it!", altEs: ["La plupart des Marseillais ont leur recette : demandez-la-leur !"], grammar: [g.pronoun-order-imperative], vocab: [w.la-plupart, w.marseillais] }
      - { es: "Note la recette et envoie-la-moi.", en: "Write down the recipe and send it to me.", altEs: ["Note la recette, puis envoie-la-moi.", "Note la recette et envoie-la-moi, s'il te plaît."], grammar: [g.pronoun-order-imperative], vocab: [w.noter, w.recette] }
      - { es: "Compte les invités, puis calcule combien de rougets il nous faut.", en: "Count the guests, then work out how many red mullet we need.", altEs: ["Compte les invités et calcule combien de rougets il nous faut."], grammar: [g.pronoun-order-imperative], vocab: [w.compter, w.calculer, w.rouget] }
      - { es: "Marseille a été fondée par des marins grecs : dites-le à vos amis !", en: "Marseille was founded by Greek sailors: tell your friends!", altEs: ["Marseille a été fondée par des marins grecs, dites-le à vos amis !"], grammar: [g.pronoun-order-imperative], vocab: [w.grec] }
      - { es: "Le pastis ? Ne m'en sers pas, je préfère un jus de fruits.", en: "Pastis? Don't pour me any, I'd rather have a fruit juice.", altEs: ["Le pastis ? Ne m'en sers pas, je préfère un jus de fruit."], grammar: [g.pronoun-order-imperative, g.y-en-combinations], vocab: [w.pastis] }
      - { es: "Cette recette provençale, apprends-la-moi !", en: "Teach me this Provençal recipe!", altEs: ["Apprends-moi cette recette provençale !"], altEn: ["This Provençal recipe, teach it to me!"], grammar: [g.pronoun-order-imperative], vocab: [w.provençal, w.recette] }
      - { es: "Ce poisson vient d'une réserve marine : ne le jetez pas, mangez-le !", en: "This fish comes from a marine reserve: don't throw it away, eat it!", altEs: ["Ce poisson vient d'une réserve marine, ne le jetez pas, mangez-le !"], grammar: [g.pronoun-order-imperative], vocab: [w.marin.adj] }
    exchanges:
      - q: { es: "Je mets combien de safran ?", en: "How much saffron do I put in?" }
        a: { es: "Pas beaucoup : mets-en juste un peu.", en: "Not much: just put in a little." }
        alt: ["Mets-en un peu.", "Juste un peu."]
        grammar: [g.pronoun-order-imperative]
        vocab: [w.safran]
      - q: { es: "Tu me passes l'aïoli ?", en: "Can you pass me the aioli?" }
        a: { es: "Tiens, le voilà. Mais laisse-m'en un peu !", en: "Here it is. But leave me a bit!" }
        alt: ["Tiens, le voilà.", "Bien sûr, tiens."]
        grammar: [g.pronoun-order-imperative]
        vocab: [w.aïoli]
      - q: { es: "Je peux montrer ta recette à mes amis ?", en: "Can I show your recipe to my friends?" }
        a: { es: "Non, ne la leur montre pas, c'est un secret de famille !", en: "No, don't show it to them, it's a family secret!" }
        alt: ["Oui, montre-la-leur !", "Bien sûr, envoie-la-leur."]
        grammar: [g.pronoun-order-imperative]
        vocab: [w.recette]
      - q: { es: "On sert le pastis avec des glaçons ?", en: "Do we serve the pastis with ice cubes?" }
        a: { es: "Oui, mais mets-les après l'eau.", en: "Yes, but put them in after the water." }
        alt: ["Oui, avec beaucoup de glaçons.", "Non, sans glaçons, avec de l'eau fraîche."]
        grammar: [g.pronoun-order-imperative]
        vocab: [w.pastis, w.glaçon]
      - q: { es: "Tu veux la recette de ma grand-mère ?", en: "Do you want my grandmother's recipe?" }
        a: { es: "Oh oui, donne-la-moi, s'il te plaît !", en: "Oh yes, give it to me, please!" }
        alt: ["Oui, envoie-la-moi !", "Oui, note-la-moi sur un papier."]
        grammar: [g.pronoun-order-imperative]
        vocab: [w.recette, w.noter]
    texts:
      - title: "Recette de soupe de poisson"
        es: ["Prends les rougets et lave-les bien.", "Le safran, ajoute-le avec les tomates.", "L'aïoli ? Sers-le à part, sur du pain."]
        en: ["Take the red mullet and wash them well.", "The saffron, add it with the tomatoes.", "The aioli? Serve it separately, on bread."]
        grammar: [g.pronoun-order-imperative]
        vocab: [w.rouget, w.safran, w.aïoli]
      - title: "Message de Marius"
        es: ["L'apéro, c'est chez moi à huit heures.", "Les glaçons, achète-les en route.", "Et le pastis ? Ne l'oublie pas !"]
        en: ["The drinks are at my place at eight.", "The ice cubes, buy them on the way.", "And the pastis? Don't forget it!"]
        grammar: [g.pronoun-order-imperative]
        vocab: [w.apéro, w.glaçon, w.pastis]
    spicy:
      - { es: "Ton numéro ? Écris-le-moi sur la main.", en: "Your number? Write it on my hand for me.", altEs: ["Écris-moi ton numéro sur la main."], grammar: [g.pronoun-order-imperative] }
      - { es: "Ne me le dis pas avec des mots : dis-le-moi avec une bouillabaisse.", en: "Don't tell me with words: tell me with a bouillabaisse.", altEs: ["Ne me le dis pas avec des mots, dis-le-moi avec une bouillabaisse."], grammar: [g.pronoun-order-imperative], vocab: [w.bouillabaisse] }
      - { es: "Tes yeux ? Ne les cache pas derrière ces lunettes de soleil, montre-les-moi.", en: "Your eyes? Don't hide them behind those sunglasses, show them to me.", grammar: [g.pronoun-order-imperative] }
      - { es: "Des compliments ? Fais-m'en encore, j'adore ça.", en: "Compliments? Pay me some more, I love it.", altEs: ["Des compliments ? Fais-m'en encore, j'aime ça."], grammar: [g.pronoun-order-imperative, g.y-en-combinations] }
      - { es: "Mon pastis, ne me le vole pas ; mon cœur, tu peux le prendre.", en: "My pastis, don't steal it from me; my heart, you can take it.", altEs: ["Mon pastis, ne me le vole pas, mais mon cœur, tu peux le prendre."], grammar: [g.pronoun-order-imperative], vocab: [w.pastis] }
  - id: b1.u01.l3
    title: Il y en a encore ?
    teach: [g.y-en-combinations]
    tip: "y and en always come last, y before en: il y en a, il n'y en a plus, je m'en occupe, je vous y attends."
    vocab: [w.réduction, w.promotion, w.vitrine, w.rayon, w.panier, w.chariot, w.livraison, w.livrer, w.commande, w.van, w.camion, w.camionnette, w.occuper, w.s-occuper, w.ciao, w.gratuit, w.coût, w.dépense, w.dépenser, w.patron, w.quotidien, w.quotidien.n]
    sentences:
      - { es: "Des sardines ? Il y en a encore sur l'étal du fond.", en: "Sardines? There are still some on the stall at the back.", altEs: ["Des sardines ? Il en reste sur l'étal du fond."], grammar: [g.y-en-combinations], vocab: [w.sardine, w.étal] }
      - { es: "Désolé, il n'y en a plus : revenez demain matin.", en: "Sorry, there are none left: come back tomorrow morning.", altEs: ["Désolé, il n'y en a plus, revenez demain matin.", "Désolée, il n'y en a plus : revenez demain matin."], altEn: ["Sorry, there aren't any left: come back tomorrow morning."], grammar: [g.y-en-combinations], vocab: [], error: { wrong: "Désolé, il n'en y a plus : revenez demain matin.", explain: "y comes before en: il n'y en a plus.", grammar: g.y-en-combinations } }
      - { es: "La livraison ? Ne t'inquiète pas, je m'en occupe.", en: "The delivery? Don't worry, I'll take care of it.", altEs: ["La livraison ? T'inquiète pas, je m'en occupe."], altEn: ["The delivery? Don't worry, I'll deal with it."], grammar: [g.y-en-combinations], vocab: [w.livraison, w.s-occuper] }
      - { es: "Il est tard, je m'en vais. Ciao !", en: "It's late, I'm off. Bye!", altEs: ["Il est tard, je m'en vais. Salut !", "Il est tard, je m'en vais, ciao !"], altEn: ["It's late, I'm leaving. Bye!"], grammar: [g.y-en-combinations], vocab: [w.ciao], transform: { instruction: "Change to 'we'", answer: "Il est tard, nous nous en allons. Ciao !", alt: ["Il est tard, on s'en va. Ciao !"], en: "It's late, we're off. Bye!" } }
      - { es: "Tu as parlé de la promotion au patron ? — Oui, je lui en ai parlé ce matin.", en: "Did you tell the boss about the special offer? — Yes, I told him about it this morning.", altEs: ["Tu as parlé de la promo au patron ? — Oui, je lui en ai parlé ce matin."], grammar: [g.y-en-combinations, g.double-object-pronouns], vocab: [w.promotion, w.patron] }
      - { es: "Il y a des réductions dans ce rayon ? — Oui, il y en a beaucoup cette semaine.", en: "Are there discounts in this department? — Yes, there are lots this week.", altEs: ["Il y a des réductions dans ce rayon ? — Oui, il y en a plein cette semaine."], grammar: [g.y-en-combinations], vocab: [w.réduction, w.rayon] }
      - { es: "Des paniers provençaux ? Il y en avait trois dans la vitrine hier.", en: "Provençal baskets? There were three in the window yesterday.", altEs: ["Des paniers provençaux ? Hier, il y en avait trois dans la vitrine."], grammar: [g.y-en-combinations], vocab: [w.panier, w.vitrine, w.provençal] }
      - { es: "Votre commande ? Nous vous la livrons demain avec la camionnette.", en: "Your order? We'll deliver it to you tomorrow in the van.", altEs: ["Votre commande ? On vous la livre demain avec la camionnette."], grammar: [g.double-object-pronouns], vocab: [w.commande, w.livrer, w.camionnette] }
      - { es: "Tu te souviens de cette boutique ? — Oui, je m'en souviens très bien.", en: "Do you remember that shop? — Yes, I remember it very well.", altEs: ["Tu te rappelles cette boutique ? — Oui, je m'en souviens très bien."], grammar: [g.y-en-combinations], vocab: [] }
      - { es: "Des frais de livraison ? Il n'y en a pas : c'est gratuit.", en: "Delivery charges? There aren't any: it's free.", altEs: ["Des frais de livraison ? Il n'y en a pas, c'est gratuit."], grammar: [g.y-en-combinations], vocab: [w.gratuit, w.livraison] }
      - { es: "Le marché ? Je vous y attends à midi, devant le camion du poissonnier.", en: "The market? I'll wait for you there at noon, in front of the fishmonger's lorry.", altEs: ["Le marché ? Je vous attends là-bas à midi, devant le camion du poissonnier."], altEn: ["The market? I'll meet you there at noon, in front of the fishmonger's truck."], grammar: [g.y-en-combinations], vocab: [w.camion] }
      - { es: "Ce mois-ci, j'ai trop dépensé : des dépenses, il y en a eu partout !", en: "This month I've spent too much: there have been expenses everywhere!", altEs: ["Ce mois-ci j'ai trop dépensé : des dépenses, il y en a eu partout !"], grammar: [g.y-en-combinations], vocab: [w.dépenser, w.dépense] }
      - { es: "Le coût de la livraison ? Le patron ne nous en a pas parlé.", en: "The cost of delivery? The boss didn't tell us about it.", altEs: ["Le coût de la livraison ? Le patron ne nous en a rien dit."], grammar: [g.y-en-combinations], vocab: [w.coût, w.patron] }
      - { es: "Mets les courses dans le chariot ; je m'occupe du reste.", en: "Put the shopping in the trolley; I'll deal with the rest.", altEs: ["Mets les courses dans le chariot, je m'occupe du reste."], altEn: ["Put the shopping in the cart; I'll take care of the rest."], grammar: [g.y-en-combinations], vocab: [w.chariot, w.s-occuper], transform: { instruction: "Replace 'du reste' with en", answer: "Mets les courses dans le chariot ; je m'en occupe.", alt: ["Mets les courses dans le chariot, je m'en occupe."], en: "Put the shopping in the trolley; I'll deal with it." } }
      - { es: "Le dimanche, les étals occupent tout le quai ; des touristes, il y en a partout.", en: "On Sundays the stalls take up the whole quay; there are tourists everywhere.", altEs: ["Le dimanche, les étals occupent tout le quai, et il y a des touristes partout."], grammar: [g.y-en-combinations], vocab: [w.occuper, w.étal] }
      - { es: "Ce vieux van, mon oncle s'en occupe depuis vingt ans.", en: "My uncle has been looking after this old van for twenty years.", altEs: ["Mon oncle s'occupe de ce vieux van depuis vingt ans."], altEn: ["This old van, my uncle has been looking after it for twenty years."], grammar: [g.y-en-combinations], vocab: [w.van, w.s-occuper] }
    exchanges:
      - q: { es: "Il reste des dorades ?", en: "Is there any sea bream left?" }
        a: { es: "Oui, il y en a encore deux.", en: "Yes, there are still two." }
        alt: ["Non, désolé, il n'y en a plus.", "Oui, il en reste deux."]
        grammar: [g.y-en-combinations]
        vocab: [w.dorade]
      - q: { es: "Qui s'occupe de la commande ?", en: "Who's dealing with the order?" }
        a: { es: "Moi, je m'en occupe.", en: "Me, I'll deal with it." }
        alt: ["Je m'en occupe.", "C'est le patron qui s'en occupe."]
        grammar: [g.y-en-combinations]
        vocab: [w.s-occuper, w.commande]
      - q: { es: "Tu t'en vas déjà ?", en: "Are you leaving already?" }
        a: { es: "Oui, je suis fatigué. Ciao !", en: "Yes, I'm tired. Bye!" }
        alt: ["Oui, désolée, je m'en vais.", "Non, je reste encore un peu."]
        grammar: [g.y-en-combinations]
        vocab: [w.ciao]
      - q: { es: "Vous livrez à Cassis ?", en: "Do you deliver to Cassis?" }
        a: { es: "Oui, et la livraison est gratuite le samedi.", en: "Yes, and delivery is free on Saturdays." }
        alt: ["Oui, on vous livre demain.", "Non, désolé, nous n'y livrons pas."]
        grammar: [g.y-en-combinations]
        vocab: [w.livrer, w.livraison, w.gratuit]
      - q: { es: "Tu te souviens du prix des rougets ?", en: "Do you remember the price of the red mullet?" }
        a: { es: "Non, je ne m'en souviens plus.", en: "No, I don't remember any more." }
        alt: ["Oui, je m'en souviens : quinze euros le kilo.", "Non, je ne m'en souviens pas."]
        grammar: [g.y-en-combinations]
        vocab: [w.rouget]
    texts:
      - title: "Dans une vitrine"
        es: ["Grande promotion cette semaine !", "Des paniers provençaux ? Il y en a pour tous les prix.", "Livraison gratuite dans tout Marseille."]
        en: ["Big special offer this week!", "Provençal baskets? There are some at every price.", "Free delivery all over Marseille."]
        grammar: [g.y-en-combinations]
        vocab: [w.promotion, w.panier, w.livraison, w.gratuit]
      - title: "La vie quotidienne de Marius"
        es: ["Le marché fait partie de ma vie quotidienne.", "J'y vais tous les jours à cinq heures avec mon camion.", "Après, je lis le quotidien au café du port.", "Le soir, je m'en vais quand il n'y a plus de clients."]
        en: ["The market is part of my daily life.", "I go there every day at five o'clock with my lorry.", "Afterwards, I read the daily paper at the café on the port.", "In the evening, I leave when there are no customers left."]
        grammar: [g.y-en-combinations]
        vocab: [w.quotidien, w.quotidien.n, w.camion, w.client]
    spicy:
      - { es: "Des gens comme toi, il n'y en a pas beaucoup à Marseille.", en: "There aren't many people like you in Marseille.", altEs: ["Il n'y en a pas beaucoup, des gens comme toi, à Marseille."], grammar: [g.y-en-combinations] }
      - { es: "Je m'en vais... sauf si tu m'invites à danser.", en: "I'm leaving... unless you ask me to dance.", altEs: ["Je m'en vais, sauf si tu m'invites à danser."], grammar: [g.y-en-combinations] }
      - { es: "Ton cœur ? Ne t'inquiète pas, je m'en occupe.", en: "Your heart? Don't worry, I'll take care of it.", grammar: [g.y-en-combinations], vocab: [w.s-occuper] }
      - { es: "Notre premier rendez-vous ? Je m'en souviens : tu as mis du pastis sur mes chaussures.", en: "Our first date? I remember it: you got pastis on my shoes.", grammar: [g.y-en-combinations], vocab: [w.pastis] }
      - { es: "Des sourires, tu m'en fais tous les jours ; des rendez-vous, il n'y en a jamais assez.", en: "You give me smiles every day; there are never enough dates.", grammar: [g.y-en-combinations] }
  - id: b1.u01.l4
    title: Tu me le prêtes ?
    teach: [g.double-object-pronouns, g.pronoun-order-imperative]
    tip: "Lending and returning: je te le prête, rends-le-moi, je te les rembourse."
    vocab: [w.occasion, w.d-occasion, w.rembourser, w.échanger, w.dette, w.emprunt, w.prêt.n, w.rendre-visite-à, w.remplacer, w.réparer, w.casser, w.abîmé, w.neuf.adj, w.usé, w.léger, w.lourd, w.plein, w.vide, w.solide, w.fragile, w.savon, w.tiers, w.pourcentage, w.nombre, w.concevoir, w.refléter, w.ombrière, w.passant, w.considérer]
    sentences:
      - { es: "Ton vélo, tu me le prêtes ce week-end ?", en: "Your bike, will you lend it to me this weekend?", altEs: ["Tu me prêtes ton vélo ce week-end ?"], altEn: ["Will you lend me your bike this weekend?"], grammar: [g.double-object-pronouns], vocab: [w.prêter] }
      - { es: "Je te le prête, mais rends-le-moi dimanche soir.", en: "I'll lend it to you, but give it back to me on Sunday evening.", altEs: ["Je te le prête, mais rends-le-moi dimanche soir, s'il te plaît."], grammar: [g.double-object-pronouns, g.pronoun-order-imperative], vocab: [w.prêter], error: { wrong: "Je te le prête, mais rends-moi-le dimanche soir.", explain: "Affirmative imperative: direct before indirect: rends-le-moi.", grammar: g.pronoun-order-imperative } }
      - { es: "Les cinquante euros ? Je te les rembourse demain, promis.", en: "The fifty euros? I'll pay you back tomorrow, I promise.", altEs: ["Les cinquante euros ? Je te les rends demain, promis."], altEn: ["The fifty euros? I'll pay them back to you tomorrow, promise."], grammar: [g.double-object-pronouns], vocab: [w.rembourser] }
      - { es: "Ma valise est trop lourde ; prête-moi la tienne, elle est plus légère.", en: "My suitcase is too heavy; lend me yours, it's lighter.", altEs: ["Ma valise est trop lourde, prête-moi la tienne, elle est plus légère."], grammar: [g.pronoun-order-imperative], vocab: [w.lourd, w.léger] }
      - { es: "J'ai cassé ton parapluie... Je te le remplace, bien sûr.", en: "I broke your umbrella... I'll replace it for you, of course.", altEs: ["J'ai cassé ton parapluie. Je te le remplace, bien sûr."], grammar: [g.double-object-pronouns], vocab: [w.casser, w.remplacer] }
      - { es: "Le chargeur est abîmé : le vendeur nous l'échange sans problème.", en: "The charger is damaged: the shop assistant exchanges it for us without any problem.", altEs: ["Le chargeur est abîmé, le vendeur nous l'échange sans problème."], grammar: [g.double-object-pronouns], vocab: [w.abîmé, w.échanger] }
      - { es: "Ce vélo d'occasion est solide, mais les roues sont usées.", en: "This second-hand bike is sturdy, but the wheels are worn.", altEs: ["Ce vélo d'occasion est solide mais les roues sont usées."], grammar: [g.adjective-agreement], vocab: [w.d-occasion, w.solide, w.usé] }
      - { es: "Ne le lui prête pas, il ne rend jamais rien !", en: "Don't lend it to him, he never gives anything back!", altEs: ["Ne le lui prête pas : il ne rend jamais rien !"], altEn: ["Don't lend it to her, she never gives anything back!"], grammar: [g.pronoun-order-imperative], vocab: [w.prêter] }
      - { es: "Le vase est fragile : emballe-le-moi bien, s'il te plaît.", en: "The vase is fragile: wrap it up well for me, please.", altEs: ["Le vase est fragile, emballe-le-moi bien, s'il te plaît."], grammar: [g.pronoun-order-imperative], vocab: [w.fragile, w.emballer] }
      - { es: "Mon frère m'a fait un prêt, et je lui rembourse un tiers de ma dette chaque mois.", en: "My brother gave me a loan, and I pay him back a third of my debt every month.", altEs: ["Mon frère m'a fait un prêt et je lui rembourse un tiers de ma dette chaque mois."], grammar: [g.double-object-pronouns], vocab: [w.prêt.n, w.tiers, w.dette, w.rembourser] }
      - { es: "J'ai demandé un emprunt à la banque, mais elle ne me l'a pas donné.", en: "I asked the bank for a loan, but it didn't give it to me.", altEs: ["J'ai demandé un emprunt à la banque mais elle ne me l'a pas donné."], altEn: ["I asked the bank for a loan, but they didn't give it to me."], grammar: [g.double-object-pronouns], vocab: [w.emprunt] }
      - { es: "Ta bouteille est vide ? Donne-la-moi, la mienne est pleine.", en: "Is your bottle empty? Give it to me, mine is full.", altEs: ["Ta bouteille est vide ? Donne-la-moi : la mienne est pleine."], grammar: [g.pronoun-order-imperative], vocab: [w.vide, w.plein] }
      - { es: "Quand tu rends visite à ta grand-mère, apporte-lui ce savon de Marseille.", en: "When you visit your grandmother, take her this Marseille soap.", altEs: ["Quand tu vas voir ta grand-mère, apporte-lui ce savon de Marseille."], grammar: [g.pronoun-order-imperative], vocab: [w.rendre-visite-à, w.savon], transform: { instruction: "Replace 'ce savon de Marseille' with a pronoun", answer: "Quand tu rends visite à ta grand-mère, apporte-le-lui.", alt: ["Apporte-le-lui."], en: "When you visit your grandmother, take it to her." } }
      - { es: "Mon ordinateur est neuf : je ne te le prête pas.", en: "My computer is brand new: I'm not lending it to you.", altEs: ["Mon ordinateur est tout neuf : je ne te le prête pas."], grammar: [g.double-object-pronouns], vocab: [w.neuf.adj, w.prêter], transform: { instruction: "Make it affirmative", answer: "Mon ordinateur est neuf : je te le prête.", alt: ["Mon ordinateur est tout neuf : je te le prête."], en: "My computer is brand new: I'll lend it to you." } }
      - { es: "Ce vendeur répare les vélos d'occasion et il nous les vend pour la moitié du prix.", en: "This seller repairs second-hand bikes and sells them to us for half the price.", altEs: ["Ce vendeur répare les vélos d'occasion et nous les vend pour la moitié du prix."], grammar: [g.double-object-pronouns], vocab: [w.réparer, w.d-occasion, w.moitié] }
    exchanges:
      - q: { es: "Tu peux me prêter ton appareil photo ?", en: "Can you lend me your camera?" }
        a: { es: "Oui, je te le prête, mais fais-y attention !", en: "Yes, I'll lend it to you, but be careful with it!" }
        alt: ["Oui, je te le prête.", "Désolé, je ne peux pas te le prêter."]
        grammar: [g.double-object-pronouns, g.pronoun-order-imperative]
        vocab: [w.prêter]
      - q: { es: "Quand est-ce que tu me rends mes livres ?", en: "When are you giving me my books back?" }
        a: { es: "Je te les rends samedi, promis.", en: "I'll give them back to you on Saturday, I promise." }
        alt: ["Samedi, promis.", "Je te les rends demain."]
        grammar: [g.double-object-pronouns]
        vocab: []
      - q: { es: "Tu as rendu les clés à ta voisine ?", en: "Did you give the keys back to your neighbour?" }
        a: { es: "Oui, je les lui ai rendues ce matin.", en: "Yes, I gave them back to her this morning." }
        alt: ["Non, pas encore, je les lui rends ce soir.", "Oui, ce matin."]
        grammar: [g.double-object-pronouns, g.pc-object-agreement]
        vocab: []
      - q: { es: "Ce vélo d'occasion, c'est une bonne occasion ?", en: "This second-hand bike, is it a good bargain?" }
        a: { es: "Oui, il est solide et il n'est pas cher.", en: "Yes, it's sturdy and it isn't expensive." }
        alt: ["Oui, c'est une très bonne occasion.", "Non, les roues sont usées."]
        grammar: [g.adjective-agreement]
        vocab: [w.occasion, w.d-occasion, w.solide]
      - q: { es: "Tu m'as remboursé les vingt euros ?", en: "Have you paid me back the twenty euros?" }
        a: { es: "Mais oui, je te les ai rendus hier !", en: "Of course, I gave them back to you yesterday!" }
        alt: ["Pas encore, je te les rembourse demain.", "Oui, je te les ai remboursés hier."]
        grammar: [g.double-object-pronouns]
        vocab: [w.rembourser]
      - q: { es: "Tu as déjà remboursé une grande partie de ton prêt ?", en: "Have you already paid back a large part of your loan?" }
        a: { es: "Oui, un bon pourcentage : il ne m'en reste qu'un tiers.", en: "Yes, a good percentage: I've only got a third left." }
        alt: ["Oui, il ne m'en reste qu'un tiers.", "Non, pas encore la moitié."]
        grammar: [g.y-en-combinations]
        vocab: [w.prêt.n, w.pourcentage, w.tiers]
    texts:
      - title: "Mot sur la porte"
        es: ["Salut Karim, je t'ai emprunté ton vélo.", "Je te le rends ce soir, je n'en ai besoin que pour une heure.", "Merci et à tout à l'heure !"]
        en: ["Hi Karim, I've borrowed your bike.", "I'll give it back to you this evening, I only need it for an hour.", "Thanks and see you later!"]
        grammar: [g.double-object-pronouns, g.y-en-combinations]
        vocab: [w.emprunter]
      - title: "L'Ombrière du Vieux-Port"
        es: ["Conçue par l'architecte Norman Foster, l'Ombrière est un immense miroir au-dessus du Vieux-Port.", "Elle reflète les passants, les bateaux et le ciel.", "Un grand nombre de touristes la considèrent comme l'endroit idéal pour une photo."]
        en: ["Designed by the architect Norman Foster, the Ombrière is a huge mirror above the Old Port.", "It reflects the passers-by, the boats and the sky.", "A great number of tourists consider it the ideal spot for a photo."]
        grammar: [g.passive-voice]
        vocab: [w.concevoir, w.ombrière, w.refléter, w.passant, w.nombre, w.considérer]
    spicy:
      - { es: "Ta veste ? Prête-la-moi, j'ai froid... et c'est une excuse.", en: "Your jacket? Lend it to me, I'm cold... and it's an excuse.", altEs: ["Ta veste ? Prête-la-moi, j'ai froid, et c'est une excuse."], grammar: [g.pronoun-order-imperative] }
      - { es: "Tu m'as emprunté mon cœur ; ne me le rends pas abîmé.", en: "You borrowed my heart; don't give it back to me damaged.", grammar: [g.pronoun-order-imperative], vocab: [w.abîmé] }
      - { es: "Je te dois un dîner ? Je te le rembourse avec un dessert en plus.", en: "I owe you a dinner? I'll pay you back with a dessert on top.", grammar: [g.double-object-pronouns], vocab: [w.rembourser] }
      - { es: "Mon numéro est tout neuf : je ne le donne qu'à toi.", en: "My number is brand new: I'm only giving it to you.", grammar: [g.double-object-pronouns], vocab: [w.neuf.adj] }
      - { es: "Tes lunettes de soleil, prête-les-moi : comme ça, tu ne verras pas que je te regarde.", en: "Your sunglasses, lend them to me: that way you won't see that I'm looking at you.", grammar: [g.pronoun-order-imperative], vocab: [w.prêter] }
dialogues:
  - id: b1.u01.d1
    title: Une bouillabaisse un peu spéciale
    context: Chloé buys fish from Marius at the Old Port fish market.
    lines:
      - { speaker: Marius, es: "Bonjour madame ! Regardez ces rougets, ils sont arrivés ce matin.", en: "Good morning, madam! Look at these red mullet, they came in this morning." }
      - { speaker: Chloé, es: "Bonjour ! Ils ont l'air très frais. Vous me les pesez ?", en: "Hello! They look very fresh. Could you weigh them for me?" }
      - { speaker: Marius, es: "Un kilo deux. Je vous les emballe ?", en: "One point two kilos. Shall I wrap them for you?" }
      - { speaker: Chloé, es: "Oui, s'il vous plaît. Et des dorades, il y en a encore ?", en: "Yes, please. And is there any sea bream left?" }
      - { speaker: Marius, es: "Il n'y en a plus, désolé. Mais j'ai de belles sardines.", en: "There's none left, sorry. But I've got some lovely sardines." }
      - { speaker: Chloé, es: "Alors mettez-m'en une douzaine. C'est pour une bouillabaisse.", en: "Then give me a dozen. It's for a bouillabaisse." }
      - { speaker: Marius, es: "Une bouillabaisse avec des sardines ? Ne le dites pas à ma mère !", en: "A bouillabaisse with sardines? Don't tell my mother!" }
      - { speaker: Chloé, es: "Je ne le lui dirai pas, promis. Vous avez la monnaie sur cinquante euros ?", en: "I won't tell her, I promise. Do you have change for fifty euros?" }
      - { speaker: Marius, es: "Bien sûr. Voilà, je vous la rends. Et le ticket de caisse, vous le voulez ?", en: "Of course. Here you are, here's your change. And do you want the receipt?" }
      - { speaker: Chloé, es: "Non merci, gardez-le. Bonne journée !", en: "No thanks, keep it. Have a good day!" }
    questions:
      - { q: "Qu'est-ce que Chloé achète d'abord ?", options: ["Des dorades", "Des rougets", "Du thon"], answer: 1, explain: "She first buys the red mullet that came in this morning." }
      - { q: "Pourquoi Chloé n'achète-t-elle pas de dorades ?", options: ["Elles sont trop chères", "Il n'y en a plus", "Elle ne les aime pas"], answer: 1, explain: "Marius says « Il n'y en a plus »: there's none left." }
      - { q: "Combien de sardines est-ce qu'elle prend ?", options: ["Six", "Douze", "Vingt"], answer: 1, explain: "« Une douzaine » is twelve." }
      - { q: "Que fait Chloé avec le ticket de caisse ?", options: ["Elle le garde", "Elle le laisse au poissonnier", "Elle le jette"], answer: 1, explain: "« Gardez-le »: she tells Marius to keep it." }
