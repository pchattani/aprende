id: r.c2.bruxelles-septante-et-une-fois
level: c2
title: Bruxelles, septante… et une fois
kind: text
intro: "A light-hearted column by a (fictional) French journalist who has just moved to Brussels and is learning Belgian French. Belgian words are explained in the text itself; standard French of France equivalents: septante = soixante-dix, nonante = quatre-vingt-dix, dîner = déjeuner, souper = dîner, à tantôt = à tout à l'heure, GSM = portable, kot = chambre d'étudiant, il drache = il pleut à verse, chicon = endive, pistolet = petit pain, savoir (+ infinitive) = pouvoir."
allow: [logique, croque-monsieur, bruxelles, bruxellois, bruxelloise, bruxelloises, belgique, belge, belges, flandre, wallonie, néerlandais, grand-place, manneken-pis, ixelles, paris, parisien, parisienne, ok]
paragraphs:
  - { es: "Quand j'ai annoncé à mes amis parisiens que je partais m'installer à Bruxelles, ils m'ont tous fait la même plaisanterie : « Tu vas devoir apprendre une langue étrangère, une fois ! » J'ai souri poliment. Je parlais français, les Bruxellois parlent français : où était le problème ? Trois mois plus tard, je peux l'affirmer : le français de Belgique n'est pas une autre langue, mais c'est un autre pays, avec ses mots, ses habitudes et son humour.", en: "When I told my Parisian friends I was moving to Brussels, they all made the same joke: 'You'll have to learn a foreign language, once!' I smiled politely. I spoke French, the people of Brussels speak French: where was the problem? Three months later I can say it with confidence: Belgian French is not another language, but it is another country, with its own words, habits and humour." }
  - { es: "Le premier choc a eu lieu à la boulangerie. J'ai demandé le prix d'un gâteau et la vendeuse m'a répondu : « Septante-cinq cents. » Pendant une seconde, j'ai cru qu'elle se moquait de moi. Puis j'ai compris : en Belgique, on dit septante pour soixante-dix et nonante pour quatre-vingt-dix. C'est d'ailleurs beaucoup plus logique que notre « soixante-dix-neuf » ou notre « quatre-vingt-dix-sept », qui obligent les enfants français à faire des additions pour compter. Pour quatre-vingts, en revanche, les Belges disent comme nous ; c'est en Suisse, dans certains cantons, qu'on entend huitante.", en: "The first shock came at the baker's. I asked the price of a cake and the shop assistant replied: 'Septante-cinq cents.' For a second I thought she was making fun of me. Then I understood: in Belgium they say septante for seventy and nonante for ninety. It is in fact much more logical than our 'sixty-nineteen' or 'four-twenties-seventeen', which force French children to do sums to count. For eighty, on the other hand, Belgians say the same as us; it's in Switzerland, in some cantons, that you hear huitante." }
  - { es: "Le deuxième choc a été celui des repas. Une collègue m'a proposé de « dîner » avec elle. J'ai réservé ma soirée, mis une jolie chemise… et je l'ai vue arriver à mon bureau à midi et demi. En Belgique, comme en Suisse et au Québec, on prend le déjeuner le matin, le dîner à midi et le souper le soir. Depuis, je fais très attention : quand on m'invite, je demande l'heure.", en: "The second shock was the meals. A colleague suggested we have dîner together. I kept my evening free, put on a nice shirt… and saw her turn up at my office at half past twelve. In Belgium, as in Switzerland and Quebec, déjeuner is breakfast, dîner is lunch and souper is the evening meal. Since then I'm very careful: when someone invites me, I ask what time." }
  - { es: "Il y a aussi les petits mots de tous les jours. Ici, le téléphone portable s'appelle un GSM, une chambre d'étudiant est un kot, et quand il pleut très fort, ce qui arrive assez souvent, on dit qu'il drache. Au marché, j'ai découvert que l'endive s'appelle un chicon, et à la boulangerie, qu'un pistolet n'est pas une arme mais un petit pain rond. Quand on vous quitte en disant « à tantôt », cela veut dire qu'on vous reverra plus tard dans la journée. Et si un ami vous dit qu'il « ne sait pas venir », ne le croyez pas ignorant : il veut simplement dire qu'il ne peut pas.", en: "There are also the little everyday words. Here a mobile phone is called a GSM, a student room is a kot, and when it rains very hard, which happens quite often, they say il drache. At the market I discovered that an endive is called a chicon, and at the baker's that a pistolet is not a weapon but a small round bread roll. When someone leaves you saying 'à tantôt', it means they'll see you later in the day. And if a friend tells you he 'doesn't know how to come', don't think him ignorant: he simply means he can't." }
  - { es: "Et la fameuse « une fois » ? J'ai fini par oser poser la question à mes voisins. Ils ont levé les yeux au ciel. « C'est un cliché que les Français adorent, m'a expliqué l'un d'eux. Certains Bruxellois disent bien “viens une fois”, pour dire “viens donc”, mais beaucoup moins que vous ne l'imaginez. » Puis il a ajouté avec un sourire : « Vous, vous dites bien “du coup” toutes les trois phrases, et on ne se moque pas de vous… enfin, pas trop. » J'ai compris que la leçon valait dans les deux sens.", en: "And the famous 'une fois'? I finally dared to ask my neighbours. They rolled their eyes. 'It's a cliché the French love,' one of them explained. 'Some people in Brussels do say \"viens une fois\" to mean \"come on, come here\", but much less than you imagine.' Then he added with a smile: 'You lot say \"du coup\" every three sentences, and we don't make fun of you… well, not too much.' I understood that the lesson worked both ways." }
  - { es: "Car il ne faut pas oublier que Bruxelles est une ville officiellement bilingue : les panneaux, les noms de rues et les annonces du métro sont en français et en néerlandais. Le français de la ville a emprunté des mots et des tournures à ses voisins flamands, et l'on entend dans les rues des dizaines d'autres langues, puisque la capitale accueille aussi de nombreuses institutions européennes. C'est peut-être cela, le vrai secret du français de Bruxelles : il a l'habitude de vivre avec les autres.", en: "For we must not forget that Brussels is an officially bilingual city: signs, street names and metro announcements are in French and Dutch. The city's French has borrowed words and turns of phrase from its Flemish neighbours, and you hear dozens of other languages in the streets, since the capital is also home to many European institutions. Perhaps that is the real secret of Brussels French: it is used to living with others." }
  - { es: "Hier, en sortant du bureau, il drachait sur la Grand-Place. Je me suis réfugiée dans un café, j'ai commandé une bière et un croque-monsieur, et j'ai entendu mon voisin de table dire au serveur, en lui tendant sa carte bancaire : « S'il vous plaît. » En Belgique, on dit aussi « s'il vous plaît » en donnant quelque chose, là où un Français dirait « tenez ». Le serveur lui a répondu : « Merci, à tantôt ! » Et je me suis surprise à penser qu'à Paris, cette petite phrase me manquerait.", en: "Yesterday, as I left the office, it was pouring on the Grand-Place. I took refuge in a café, ordered a beer and a croque-monsieur, and heard the man at the next table say to the waiter, as he handed him his bank card: 'S'il vous plaît.' In Belgium people also say 's'il vous plaît' when handing something over, where a French person would say 'tenez' (here you are). The waiter answered: 'Thanks, see you later!' And I caught myself thinking that in Paris I would miss that little phrase." }
questions:
  - { q: "Que veut dire la vendeuse par « septante-cinq cents » ?", options: ["Soixante-quinze centimes", "Sept cent cinq euros", "Quatre-vingt-cinq centimes"], answer: 0, explain: "septante = soixante-dix, so septante-cinq = 75 (cents = centimes d'euro)." }
  - { q: "Pourquoi la journaliste arrive-t-elle mal préparée à son « dîner » avec sa collègue ?", options: ["Elle a oublié l'adresse", "En Belgique, le dîner est le repas de midi, pas celui du soir", "Sa collègue a annulé"], answer: 1, explain: "Belgium (like Switzerland and Quebec): déjeuner = breakfast, dîner = lunch, souper = dinner." }
  - { q: "Que signifie « il ne sait pas venir » en Belgique ?", options: ["Il ne connaît pas le chemin", "Il ne peut pas venir", "Il ne veut pas venir"], answer: 1, explain: "Belgian savoir + infinitive often means pouvoir: «il veut simplement dire qu'il ne peut pas»." }
  - { q: "Que pensent les voisins de l'expression « une fois » ?", options: ["Que tous les Belges la disent sans arrêt", "Que c'est surtout un cliché exagéré par les Français", "Qu'elle vient du néerlandais"], answer: 1, explain: "«C'est un cliché que les Français adorent… beaucoup moins que vous ne l'imaginez.»" }
  - { q: "Quand un Belge dit « s'il vous plaît » en tendant sa carte, que dirait un Français ?", options: ["« Merci »", "« Tenez »", "« Pardon »"], answer: 1, explain: "In Belgium s'il vous plaît is also used when handing something over, «là où un Français dirait tenez»." }
