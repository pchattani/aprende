id: b1.u08
title: Se y la voz pasiva
lessons:
  - id: b1.u08.l1
    title: Aquí no se puede fumar — se impersonal
    teach: [g.se-impersonal]
    vocab: [w.cartel, w.aviso, w.aparcamiento, w.acceso, w.conductor, w.pronunciar, w.traducir, w.madrugar, w.atender, w.rellenar, w.formulario, w.cita-previa, w.previo, w.en-general, w.hoy-en-dia, w.regla, w.multar]
    tip: "se + 3rd person singular = people in general / one / you: se habla, se puede, se dice. Alternatives: la gente, uno, or the generic tú."
    sentences:
      - { es: "En este edificio no se puede fumar: es una regla de la comunidad y hay carteles en todas las plantas.", en: "You can't smoke in this building: it's a rule of the residents' association and there are signs on every floor.", grammar: [g.se-impersonal], vocab: [w.regla, w.cartel, w.fumar, w.planta, w.edificio] }
      - { es: "¿Cómo se dice «lift» en español? — Se dice ascensor.", en: "How do you say 'lift' in Spanish? — You say ascensor.", grammar: [g.se-impersonal], vocab: [w.decir, w.ascensor] }
      - { es: "¿Cómo se pronuncia este apellido? Nunca lo digo bien.", en: "How do you pronounce this surname? I never say it right.", grammar: [g.se-impersonal], vocab: [w.pronunciar, w.apellido, w.decir] }
      - { es: "En España se cena tarde y, en general, se madruga poco los fines de semana.", en: "In Spain people have dinner late and, in general, don't get up early at weekends.", grammar: [g.se-impersonal], vocab: [w.cenar, w.en-general, w.madrugar, w.fin-de-semana] }
      - { es: "Al aparcamiento se entra por la otra calle: el acceso de la plaza está cerrado por obras.", en: "You enter the car park from the other street: the entrance on the square is closed for works.", grammar: [g.se-impersonal], vocab: [w.aparcamiento, w.acceso, w.entrar, w.obra] }
      - { es: "Aquí se atiende solo con cita previa; se pide por internet.", en: "Here you are only seen by appointment; you book it online.", grammar: [g.se-impersonal], vocab: [w.atender, w.cita-previa, w.pedir, w.internet] }
      - { es: "Para la solicitud se rellena este formulario y se entrega en la ventanilla.", en: "For the application you fill in this form and hand it in at the counter.", grammar: [g.se-impersonal], vocab: [w.rellenar, w.formulario, w.entregar, w.ventanilla] }
      - { es: "Se dice que los conductores de esta ciudad son muy nerviosos, pero en general se respeta a los peatones.", en: "They say the drivers in this city are very impatient, but in general pedestrians are respected.", grammar: [g.se-impersonal, g.a-personal], vocab: [w.conductor, w.nervioso, w.en-general], note: "se respeta a los peatones: with a personal a, impersonal se stays singular." }
      - { es: "Hoy en día se trabaja mucho desde casa y se viaja menos a la oficina.", en: "Nowadays people work from home a lot and travel less to the office.", grammar: [g.se-impersonal], vocab: [w.hoy-en-dia, w.trabajar, w.viajar, w.oficina] }
      - { es: "¿Se puede aparcar aquí? — No, mira el aviso: solo para vecinos. Si aparcas, te multan.", en: "Can you park here? — No, look at the notice: residents only. If you park, they fine you.", grammar: [g.se-impersonal, g.si-clauses-real], vocab: [w.aparcar, w.aviso, w.vecino, w.multar], note: "The 3rd person plural (te multan) is another impersonal form." }
      - { es: "Sin aviso previo, no se puede entrar en el edificio después de las diez.", en: "Without prior notice, you can't enter the building after ten.", grammar: [g.se-impersonal], vocab: [w.aviso, w.previo, w.entrar] }
      - { es: "¿Cómo se traduce «landlord» al español? — Se traduce como propietario o casero.", en: "How do you translate 'landlord' into Spanish? — It's translated as propietario or casero.", grammar: [g.se-impersonal], vocab: [w.traducir, w.casero] }
      - { es: "Uno nunca sabe lo que puede pasar; por eso se firma siempre un contrato.", en: "You never know what can happen; that's why you always sign a contract.", grammar: [g.se-impersonal], vocab: [w.uno, w.lo-que, w.pasar], note: "uno + 3rd person singular is another way to be impersonal." }
      - { es: "¿Por dónde se va a la estación? — Se sigue todo recto y se gira a la derecha en el semáforo.", en: "How do you get to the station? — You go straight on and turn right at the traffic lights.", grammar: [g.se-impersonal], vocab: [w.estacion, w.seguir.dir, w.girar, w.semaforo] }
      - { es: "Aquí se habla español.", en: "Spanish is spoken here.", grammar: [g.se-impersonal], vocab: [w.hablar, w.espanol], error: { wrong: "Aquí se hablan español.", explain: "Impersonal se is always 3rd person singular: se habla español. (Se hablan varios idiomas would be passive se, agreeing with a plural noun.)", grammar: g.se-impersonal } }
      - { es: "La gente come mucho pescado en Galicia.", en: "People eat a lot of fish in Galicia.", grammar: [g.se-impersonal], vocab: [w.gente, w.comer, w.pescado], transform: { instruction: "Say it with impersonal se", answer: "Se come mucho pescado en Galicia.", alt: ["En Galicia se come mucho pescado."] } }
  - id: b1.u08.l2
    title: Se venden pisos — se pasivo
    teach: [g.se-passive]
    vocab: [w.fabricar, w.producir, w.producto, w.elaborar, w.material, w.vidrio, w.papel, w.carton, w.contenedor, w.construir, w.inaugurar, w.repartir, w.envio, w.pedido, w.garantia, w.arreglar, w.funcionar, w.secar]
    tip: "Passive se: the thing is the subject and the verb agrees with it. Se vende piso / se venden pisos. Perfect for adverts, instructions, recipes and processes."
    sentences:
      - { es: "Se vende piso céntrico, reformado, con dos dormitorios.", en: "Central, renovated two-bedroom flat for sale.", grammar: [g.se-passive], vocab: [w.vender, w.centrico, w.reformado, w.dormitorio] }
      - { es: "Se alquilan habitaciones a estudiantes; se admiten mascotas pequeñas.", en: "Rooms for rent to students; small pets allowed.", grammar: [g.se-passive], vocab: [w.habitacion, w.estudiante, w.admitir, w.mascota], note: "The verb is plural because habitaciones and mascotas are plural." }
      - { es: "Estos zapatos se fabrican en Elche con materiales naturales.", en: "These shoes are made in Elche with natural materials.", grammar: [g.se-passive], vocab: [w.fabricar, w.material, w.natural, w.zapato] }
      - { es: "En La Rioja se producen algunos de los mejores vinos de España.", en: "Some of the best wines in Spain are produced in La Rioja.", grammar: [g.se-passive, g.superlatives], vocab: [w.producir, w.vino, w.mejor] }
      - { es: "El queso se elabora con leche de vaca y se deja secar durante tres meses.", en: "The cheese is made with cow's milk and is left to dry for three months.", grammar: [g.se-passive], vocab: [w.elaborar, w.secar, w.leche, w.vaca, w.queso] }
      - { es: "El vidrio se tira al contenedor verde; el papel y el cartón, al azul.", en: "Glass goes in the green container; paper and cardboard in the blue one.", grammar: [g.se-passive], vocab: [w.vidrio, w.contenedor, w.papel, w.carton, w.tirar] }
      - { es: "El puente se construyó en 1920 y el museo se inauguró el año pasado.", en: "The bridge was built in 1920 and the museum was opened last year.", grammar: [g.se-passive, g.preterite-regular], vocab: [w.construir, w.inaugurar, w.puente, w.museo] }
      - { es: "Los pedidos se reparten por la mañana y los envíos se pagan al recibirlos.", en: "Orders are delivered in the morning and deliveries are paid for on receipt.", grammar: [g.se-passive, g.antes-despues-de], vocab: [w.pedido, w.repartir, w.envio, w.pagar, w.recibir] }
      - { es: "Si el producto no funciona, se arregla gratis durante los dos años de garantía.", en: "If the product doesn't work, it is repaired free of charge during the two-year guarantee.", grammar: [g.se-passive, g.si-clauses-real], vocab: [w.producto, w.funcionar, w.arreglar, w.garantia, w.gratis] }
      - { es: "Primero se pelan las patatas, después se cortan y se fríen en aceite caliente.", en: "First the potatoes are peeled, then they are cut and fried in hot oil.", grammar: [g.se-passive], vocab: [w.pelar, w.cortar, w.freir, w.aceite, w.patata] }
      - { es: "Se han perdido unas gafas negras en la biblioteca; se ruega devolverlas en la entrada.", en: "A pair of black glasses has been lost in the library; please return them at the entrance.", grammar: [g.se-passive, g.present-perfect], vocab: [w.gafas, w.biblioteca, w.devolver, w.entrada] }
      - { es: "Se necesitan camareros con experiencia para el verano.", en: "Experienced waiters needed for the summer.", grammar: [g.se-passive], vocab: [w.necesitar, w.camarero, w.experiencia, w.verano] }
      - { es: "El Quijote se publicó en 1605 y se ha traducido a más de cien idiomas.", en: "Don Quixote was published in 1605 and has been translated into more than a hundred languages.", grammar: [g.se-passive, g.present-perfect], vocab: [w.publicar, w.traducir, w.idioma] }
      - { es: "¿Dónde se guardan las pilas viejas? — En el supermercado hay un contenedor pequeño.", en: "Where do old batteries go? — There's a small container in the supermarket.", grammar: [g.se-passive], vocab: [w.guardar, w.pila, w.contenedor, w.supermercado] }
      - { es: "Se venden pisos en esta zona.", en: "Flats are sold in this area.", grammar: [g.se-passive], vocab: [w.vender, w.piso, w.zona], error: { wrong: "Se vende pisos en esta zona.", explain: "Passive se agrees with the thing: se vende un piso, se venden pisos.", grammar: g.se-passive } }
      - { es: "Fabrican estos coches en Valencia.", en: "These cars are made in Valencia.", grammar: [g.se-passive], vocab: [w.fabricar, w.coche], transform: { instruction: "Rewrite with passive se", answer: "Estos coches se fabrican en Valencia.", alt: ["Se fabrican estos coches en Valencia."] } }
  - id: b1.u08.l3
    title: Fue construido por… — la pasiva con ser
    teach: [g.passive-ser]
    vocab: [w.prensa, w.telediario, w.informativo, w.medios-de-comunicacion, w.emitir, w.anunciar, w.eleccion, w.ganador, w.nombrar, w.premiar, w.detener, w.acusar, w.juez, w.carcel, w.rescatar, w.destruir, w.terremoto, w.cancelar]
    tip: "ser + participle (agreeing with the subject) + por + agent: la catedral fue construida, los ladrones fueron detenidos. Written and news style; in speech prefer se or the active voice."
    sentences:
      - { es: "La catedral fue construida en el siglo XIII y fue destruida por un incendio en 1850.", en: "The cathedral was built in the thirteenth century and was destroyed by a fire in 1850.", grammar: [g.passive-ser, g.preterite-regular], vocab: [w.construir, w.destruir, w.catedral, w.siglo] }
      - { es: "Dos hombres fueron detenidos por la policía después del robo en la farmacia.", en: "Two men were arrested by the police after the robbery at the chemist's.", grammar: [g.passive-ser], vocab: [w.detener, w.policia, w.farmacia] }
      - { es: "Los detenidos fueron acusados por el juez y enviados a la cárcel.", en: "The detainees were charged by the judge and sent to prison.", grammar: [g.passive-ser], vocab: [w.acusar, w.juez, w.carcel, w.enviar] }
      - { es: "La noticia fue emitida en directo por todas las cadenas.", en: "The news was broadcast live by all the channels.", grammar: [g.passive-ser], vocab: [w.emitir, w.noticia, w.directo] }
      - { es: "Los resultados de las elecciones serán anunciados esta noche en el telediario.", en: "The election results will be announced tonight on the TV news.", grammar: [g.passive-ser, g.future-simple], vocab: [w.eleccion, w.anunciar, w.telediario] }
      - { es: "La ganadora del premio fue nombrada directora del museo.", en: "The prize winner was appointed director of the museum.", grammar: [g.passive-ser], vocab: [w.ganador, w.nombrar, w.premio, w.director] }
      - { es: "Tres personas fueron rescatadas por los bomberos después del terremoto.", en: "Three people were rescued by the firefighters after the earthquake.", grammar: [g.passive-ser], vocab: [w.rescatar, w.bombero, w.terremoto] }
      - { es: "El concierto ha sido cancelado por la tormenta; las entradas serán devueltas.", en: "The concert has been cancelled because of the storm; the tickets will be refunded.", grammar: [g.passive-ser, g.present-perfect, g.future-simple], vocab: [w.cancelar, w.tormenta, w.entrada, w.devolver] }
      - { es: "La novela fue premiada en 2020 y ha sido traducida a veinte idiomas.", en: "The novel won a prize in 2020 and has been translated into twenty languages.", grammar: [g.passive-ser, g.present-perfect], vocab: [w.premiar, w.traducir, w.novela, w.idioma] }
      - { es: "Según la prensa, la medida fue aprobada por el gobierno sin discusión.", en: "According to the press, the measure was passed by the government without discussion.", grammar: [g.passive-ser], vocab: [w.prensa] }
      - { es: "Los medios de comunicación fueron acusados de exagerar la noticia.", en: "The media were accused of exaggerating the news.", grammar: [g.passive-ser], vocab: [w.medios-de-comunicacion, w.acusar, w.noticia] }
      - { es: "La puerta está cerrada. — Sí, fue cerrada por el portero a las diez.", en: "The door is closed. — Yes, it was closed by the caretaker at ten.", grammar: [g.passive-ser, g.ser-vs-estar-basics], vocab: [w.puerta, w.cerrar, w.portero], note: "estar + participle = the resulting state; ser + participle = the action." }
      - { es: "El informativo de las nueve es visto por millones de personas cada noche.", en: "The nine o'clock news is watched by millions of people every night.", grammar: [g.passive-ser], vocab: [w.informativo, w.ver, w.millon, w.persona] }
      - { es: "En la conversación normal casi nunca decimos «fueron detenidos»; decimos «detuvieron a dos hombres» o «se detuvo a dos hombres».", en: "In everyday conversation we hardly ever say 'they were arrested'; we say 'they arrested two men' or 'two men were arrested' with se.", grammar: [g.passive-ser, g.se-impersonal], vocab: [w.conversacion, w.detener, w.decir] }
      - { es: "Las víctimas fueron ayudadas por los vecinos.", en: "The victims were helped by the neighbours.", grammar: [g.passive-ser], vocab: [w.ayudar, w.vecino], error: { wrong: "Las víctimas fueron ayudado por los vecinos.", explain: "In the ser passive the participle agrees with the subject: las víctimas fueron ayudadas.", grammar: g.passive-ser } }
      - { es: "El rey inauguró el hospital en 1995.", en: "The hospital was opened by the king in 1995.", grammar: [g.passive-ser], vocab: [w.inaugurar, w.rey, w.hospital], transform: { instruction: "Rewrite in the passive with ser", answer: "El hospital fue inaugurado por el rey en 1995." } }
  - id: b1.u08.l4
    title: Se me ha caído — el se accidental
    teach: [g.se-accidental]
    vocab: [w.quemar, w.estropearse, w.manchar, w.mancha, w.mojarse, w.quedarse-sin, w.sin-querer, w.torpe, w.despistado, w.descuido, w.pedir-perdon, w.pinchar, w.rueda, w.averia, w.desastre, w.lio, w.pila, w.gasolina]
    tip: "se + me/te/le/nos/os/les + verb: the thing is the subject and the mishap just 'happens to' you. Se me ha caído el vaso; se nos han acabado las pilas."
    sentences:
      - { es: "Se me ha caído el móvil y se ha roto la pantalla.", en: "I dropped my phone and the screen has broken.", grammar: [g.se-accidental, g.present-perfect], vocab: [w.caerse, w.movil, w.romperse, w.pantalla] }
      - { es: "Perdona, se me ha olvidado tu nombre; soy muy despistado.", en: "Sorry, I've forgotten your name; I'm very absent-minded.", grammar: [g.se-accidental], vocab: [w.olvidar, w.nombre, w.despistado] }
      - { es: "Se nos ha estropeado la lavadora y no tenemos ropa limpia.", en: "Our washing machine has broken down and we have no clean clothes.", grammar: [g.se-accidental], vocab: [w.estropearse, w.lavadora, w.ropa] }
      - { es: "Se le quemó la cena mientras hablaba por teléfono.", en: "She burnt the dinner while she was talking on the phone.", grammar: [g.se-accidental, g.preterite-vs-imperfect], vocab: [w.quemar, w.cena, w.hablar, w.telefono] }
      - { es: "Se me ha manchado la camisa de café cinco minutos antes de la entrevista.", en: "I got coffee on my shirt five minutes before the interview.", grammar: [g.se-accidental], vocab: [w.manchar, w.camisa, w.cafe] }
      - { es: "Se me han mojado los zapatos con la lluvia y tengo una mancha en los pantalones.", en: "My shoes got wet in the rain and I have a stain on my trousers.", grammar: [g.se-accidental], vocab: [w.mojarse, w.mancha, w.zapato, w.lluvia] }
      - { es: "Se nos pinchó una rueda en la autopista; con esa avería tardamos dos horas más en llegar.", en: "We got a flat tyre on the motorway; with that breakdown it took us two hours longer to arrive.", grammar: [g.se-accidental, g.preterite-regular], vocab: [w.pinchar, w.rueda, w.averia, w.autopista, w.tardar] }
      - { es: "Nos quedamos sin gasolina a diez minutos del pueblo. ¡Qué desastre!", en: "We ran out of petrol ten minutes from the village. What a disaster!", grammar: [g.se-accidental], vocab: [w.quedarse-sin, w.gasolina, w.desastre], note: "quedarse sin = to run out of; also se nos acabó la gasolina." }
      - { es: "Se le han acabado las pilas a la radio y no encuentro otras.", en: "The radio's batteries have run out and I can't find any others.", grammar: [g.se-accidental], vocab: [w.pila, w.radio, w.encontrar] }
      - { es: "Lo siento, ha sido sin querer: soy un poco torpe.", en: "I'm sorry, it was an accident: I'm a bit clumsy.", grammar: [g.present-perfect], vocab: [w.sin-querer, w.torpe, w.lo-siento] }
      - { es: "Se me perdieron las llaves en un descuido y tuve que llamar al propietario.", en: "I lost my keys in a careless moment and had to call the landlord.", grammar: [g.se-accidental, g.preterite-irregular], vocab: [w.perder, w.llave, w.descuido] }
      - { es: "¡Qué lío! Se me ha olvidado la cartera en casa y no puedo pagar.", en: "What a mess! I've left my wallet at home and I can't pay.", grammar: [g.se-accidental], vocab: [w.lio, w.cartera, w.pagar] }
      - { es: "Le pidió perdón a su vecina porque se le había roto la lámpara sin querer.", en: "He apologised to his neighbour because he had accidentally broken her lamp.", grammar: [g.se-accidental, g.pluperfect], vocab: [w.pedir-perdon, w.vecino, w.lampara, w.sin-querer] }
      - { es: "¿Se te ha ocurrido alguna idea para arreglar el ascensor? — No, nada.", en: "Have you thought of any idea for fixing the lift? — No, nothing.", grammar: [g.se-accidental, g.indefinite-pronouns], vocab: [w.ocurrir, w.arreglar, w.ascensor], note: "ocurrírsele algo a alguien = to occur to someone." }
      - { es: "Se me ha olvidado el pasaporte.", en: "I've forgotten my passport.", grammar: [g.se-accidental], vocab: [w.olvidar, w.pasaporte], error: { wrong: "Se me han olvidado el pasaporte.", explain: "The verb agrees with the thing: el pasaporte (singular) → se me ha olvidado; las llaves → se me han olvidado.", grammar: g.se-accidental } }
      - { es: "He roto el vaso (sin querer).", en: "I've broken the glass (by accident).", grammar: [g.se-accidental], vocab: [w.romper, w.vaso], transform: { instruction: "Say it with accidental se", answer: "Se me ha roto el vaso." } }
dialogues:
  - id: b1.u08.d1
    title: Un día de mala suerte
    context: Lucía arrives late at the office and tells her colleague Jorge about her morning.
    lines:
      - { speaker: Jorge, es: "¡Lucía, por fin! La reunión empezó hace media hora. ¿Qué te ha pasado?", en: "Lucía, at last! The meeting started half an hour ago. What happened to you?" }
      - { speaker: Lucía, es: "No me preguntes. Primero se me olvidó el móvil en casa y tuve que volver a buscarlo.", en: "Don't ask. First I left my phone at home and had to go back for it." }
      - { speaker: Jorge, es: "Bueno, eso le pasa a cualquiera.", en: "Well, that happens to anyone." }
      - { speaker: Lucía, es: "Espera. Luego se me cayó el café encima en el metro y se me manchó la camisa nueva.", en: "Wait. Then I spilt coffee on myself on the metro and stained my new shirt." }
      - { speaker: Jorge, es: "¿Y por eso llevas la chaqueta cerrada con este calor?", en: "And that's why you're wearing your jacket done up in this heat?" }
      - { speaker: Lucía, es: "Exacto. Y al llegar aquí, el ascensor no funcionaba: en el cartel pone que se ha estropeado otra vez.", en: "Exactly. And when I got here, the lift wasn't working: the sign says it has broken down again." }
      - { speaker: Jorge, es: "Se avisó a la empresa el lunes, pero todavía no han venido.", en: "The company was notified on Monday, but they still haven't come." }
      - { speaker: Lucía, es: "Pues he subido seis pisos andando. ¿Se puede entrar todavía en la reunión?", en: "So I've walked up six floors. Can you still go into the meeting?" }
      - { speaker: Jorge, es: "Claro, pero no se puede entrar con café, así que menos mal que se te ha caído.", en: "Of course, but you can't go in with coffee, so it's just as well you dropped it." }
      - { speaker: Lucía, es: "Muy simpático. Si se me rompe algo más hoy, me vuelvo a la cama.", en: "Very funny. If anything else of mine breaks today, I'm going back to bed." }
