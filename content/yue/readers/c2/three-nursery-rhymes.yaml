id: r.c2.three-nursery-rhymes
level: c2
title: 童謠三首：月光光、落雨大、氹氹轉
kind: literature
author: Traditional Cantonese nursery rhymes (anonymous)
source: "〈月光光〉, 〈落雨大〉 and the opening of 〈氹氹轉〉, traditional rhymes of the Pearl River Delta passed down orally, quoted in widely recorded versions (wording varies from village to village; 蒲達 is also written 蒲突). Public domain. The story and explanations are written for this course."
intro: "In an old house in Guangzhou's Liwan district, a grandmother teaches her Hong Kong grandson three traditional nursery rhymes, and his mother explains to him what makes them work: chain linking, end rhymes that change every two lines, rhymes on entering tones that only work in Cantonese, and old village words that hardly anyone uses any more."
allow: [荔灣, 細佬, 阿麟, 婆婆, 年卅晚, 蒲達, 蒲突, 菱角, 籮蓋, 屋梁, 子薑]
paragraphs:
  - { es: "每年暑假，阿麟都會同阿媽由香港坐高鐵上廣州，探住喺荔灣嘅婆婆。婆婆間屋喺一條窄窄嘅巷入面，有趟櫳、有滿洲窗，夏天熱到阿麟成日嗌：「好熱呀，好悶呀！」今晚停咗電，三婆孫坐喺天井乘涼，個月亮又圓又大。婆婆搖住把葵扇，忽然唱起嚟：「月光光，照地堂……」", en: "Every summer holiday Ah Lun and his mother take the high-speed train from Hong Kong up to Guangzhou to visit his grandmother, who lives in Liwan. Grandma's house is down a narrow lane, with a sliding lattice gate and Manchurian stained-glass windows, and in summer it's so hot that Ah Lun keeps shouting: 'It's so hot! It's so boring!' Tonight there's a power cut, and the three of them sit in the courtyard to cool off; the moon is big and round. Grandma waves her palm-leaf fan and suddenly starts to sing: 'Moonlight bright, shining on the threshing floor…'" }
  - { es: "〈月光光〉 ／ 月光光，照地堂。年卅晚，摘檳榔。檳榔香，摘子薑。子薑辣，買蒲達。蒲達苦，買豬肚。豬肚肥，買牛皮。牛皮薄，買菱角。菱角尖，買馬鞭。馬鞭長，起屋梁。屋梁高，買張刀。刀切菜，買籮蓋。籮蓋圓，買隻船。", en: "'Moonlight Bright' / Moonlight bright, shining on the threshing floor. / On New Year's Eve, we pick betel nuts. / Betel nuts are fragrant, so we pick young ginger. / Young ginger is hot, so we buy pou-daat. / Pou-daat is bitter, so we buy pig's tripe. / Pig's tripe is fatty, so we buy cowhide. / Cowhide is thin, so we buy water chestnuts. / Water chestnuts are pointed, so we buy a horsewhip. / The horsewhip is long, so we raise a roof beam. / The roof beam is high, so we buy a knife. / The knife cuts vegetables, so we buy a basket lid. / The basket lid is round, so we buy a boat." }
  - { es: "阿麟聽到笑：「點解買完豬肚又去買牛皮？完全冇道理㗎！」阿媽話：「童謠唔係講道理，係講聲音。你聽吓，每句嘅最後一樣嘢，就變成下一句嘅開頭：檳榔、檳榔香；子薑、子薑辣。呢個叫頂真，好似接龍噉，一個接一個，細路仔好容易記。」", en: "Ah Lun laughs: 'Why do they buy cowhide after pig's tripe? It makes no sense at all!' His mother says: 'Nursery rhymes aren't about sense, they're about sound. Listen: the last thing in each line becomes the beginning of the next – betel nuts, betel nuts are fragrant; young ginger, young ginger is hot. That's called chain linking, like a word-chain game, one after another, so it's easy for children to remember.'" }
  - { es: "「仲有押韻。佢每兩句就轉一個韻：香同薑，係 oeng；肥同皮，係 ei；高同刀，係 ou；菜同蓋，係 oi；圓同船，係 yun。最特別嘅係『辣』同『達』、『薄』同『角』，佢哋都係入聲，用廣東話讀，薄 bok6、角 gok3，押得好啱；用普通話讀，『薄』同『角』就完全唔押韻。所以呢首童謠，一定要用廣東話唱先夠味。」", en: "'And there's the rhyme. It changes rhyme every two lines: 香 and 薑 rhyme on oeng; 肥 and 皮 on ei; 高 and 刀 on ou; 菜 and 蓋 on oi; 圓 and 船 on yun. Most special are 辣 and 達, and 薄 and 角: they're entering tones. Read in Cantonese – 薄 bok6, 角 gok3 – they rhyme perfectly; read in Mandarin, 薄 and 角 don't rhyme at all. So this rhyme has to be sung in Cantonese to get the full flavour.'" }
  - { es: "婆婆插嘴：「我細個喺鄉下，地堂就係門口曬穀嘅空地，晚黑啲細路就喺度玩。籮蓋係竹籮個蓋，而家你哋邊有見過？」阿媽話，好多童謠都好似時光機噉，保留咗好多舊時鄉村嘅生活同用字。佢又講，喺香港仲有一個搖籃曲版本，開頭係「月光光，照地堂，蝦仔你乖乖瞓落床」，唱嘅係阿媽哄個仔瞓覺。同一個月亮，唔同嘅人就唱出唔同嘅故事。", en: "Grandma chips in: 'When I was little, back in the village, the threshing floor was the open ground in front of the house where we dried the grain, and the children played there in the evenings. A basket lid is the lid of a bamboo basket – when have you lot ever seen one?' His mother says many nursery rhymes are like time machines, preserving old village life and old words. She adds that in Hong Kong there's also a lullaby version that begins 'Moonlight bright, shining on the threshing floor, little shrimp, be good and go to sleep', a mother singing her son to sleep. The same moon, and different people sing different stories." }
  - { es: "講講吓，天開始落雨，婆婆即刻又唱另一首：", en: "As they talk, it starts to rain, and Grandma immediately sings another one:" }
  - { es: "〈落雨大〉 ／ 落雨大，水浸街。阿哥擔柴上街賣，阿嫂出街着花鞋。花鞋花襪花腰帶，珍珠蝴蝶兩邊排。", en: "'Heavy Rain' / The rain is heavy, the streets are flooded. / Elder brother carries firewood to sell in the street, / sister-in-law goes out wearing embroidered shoes. / Embroidered shoes, embroidered socks, embroidered sash, / pearls and butterflies lined up on both sides." }
  - { es: "阿媽話：「呢首就一韻到底：街、賣、鞋、帶、排，全部都係 aai，唱落好似落雨嗒嗒聲。你諗吓個畫面：外面水浸，阿哥要擔柴出去賣，好辛苦；阿嫂就着到花枝招展出街，兩個人一個做嘢、一個扮靚，好鬼死搞笑。」阿麟話：「阿嫂咁靚，水浸街，對花鞋咪濕晒？」婆婆笑到碌地：「所以話童謠冇道理講啦！」", en: "His mother says: 'This one keeps one rhyme all the way through: 街, 賣, 鞋, 帶, 排 all end in aai, and sung it sounds like the patter of rain. Imagine the picture: the streets are flooded outside, elder brother has to carry firewood out to sell – such hard work; while sister-in-law goes out all dressed up. One working, one prettying herself – it's damn funny.' Ah Lun says: 'If she's so dressed up and the streets are flooded, won't her embroidered shoes get soaked?' Grandma laughs till she nearly falls over: 'That's why I say nursery rhymes don't make sense!'" }
  - { es: "最後，婆婆拖住阿麟兩隻手，喺天井度轉圈，一路轉一路唱：", en: "Finally Grandma takes both of Ah Lun's hands and spins round and round with him in the courtyard, singing as they turn:" }
  - { es: "〈氹氹轉〉（開首） ／ 氹氹轉，菊花園，炒米餅，糯米團。", en: "'Round and Round' (opening) / Round and round, the chrysanthemum garden, / toasted rice cakes, glutinous rice balls." }
  - { es: "阿媽解釋：「呢首係遊戲歌，細路仔手拖手轉圈嗰陣唱。『氹氹轉』就係轉嚟轉去，轉、園、團都係 yun 韻，好順口。後面仲有好長，講阿媽叫個仔去睇龍船，但係每條村唱嘅版本都唔同，因為童謠係口耳相傳，冇人寫低，邊個唱就由邊個改。」", en: "His mother explains: 'This is a game song, sung when children hold hands and spin round. 氹氹轉 means turning round and round; 轉, 園 and 團 all rhyme on yun, so it flows nicely. It goes on for a long time after that, about a mother telling her son to go and watch the dragon boats, but every village sings a different version, because nursery rhymes are passed on by word of mouth – nobody wrote them down, so whoever sings them changes them.'" }
  - { es: "轉到頭暈，阿麟攤喺張竹椅度，望住個月亮。過咗一陣，佢細細聲自己唱：「月光光，照地堂，年卅晚，摘……摘乜嘢話？」婆婆話：「摘檳榔！」阿麟話：「我返香港要唱畀同學聽，佢哋實未聽過。」阿媽心諗：佢細個嗰陣，婆婆都係噉教佢；一首冇人寫低嘅歌，就係噉一代傳一代，傳咗幾百年。", en: "Dizzy from spinning, Ah Lun flops onto a bamboo chair and gazes at the moon. After a while he quietly sings to himself: 'Moonlight bright, shining on the threshing floor, on New Year's Eve, we pick… pick what?' Grandma says: 'Betel nuts!' Ah Lun says: 'When I go back to Hong Kong I'll sing it to my classmates. I bet they've never heard it.' His mother thinks: when she was little, Grandma taught her the same way; a song nobody ever wrote down has been passed from one generation to the next like this for hundreds of years." }
questions:
  - { q: "〈月光光〉入面，「檳榔、檳榔香；子薑、子薑辣」用咗乜嘢手法？", options: ["頂真：上一句最後嘅字變成下一句嘅開頭", "對仗：兩句嘅平仄相反", "反問：用問題表達肯定"], answer: 0, explain: "Each line picks up the last word of the previous one (頂真, chain linking), which makes the rhyme easy to remember." }
  - { q: "點解話〈月光光〉要用廣東話唱先夠味？", options: ["因為「薄」同「角」用廣東話讀先押韻", "因為佢係廣州人寫嘅", "因為普通話冇「月光」兩個字"], answer: 0, explain: "薄 bok6 and 角 gok3 rhyme on the entering-tone final -ok in Cantonese; in Mandarin (báo, jiǎo) they don't." }
  - { q: "〈落雨大〉嘅押韻有咩特點？", options: ["每兩句轉一個韻", "一韻到底，全部都係 aai", "完全冇押韻"], answer: 1, explain: "街、賣、鞋、帶、排 all share the final -aai: one rhyme throughout (一韻到底)." }
  - { q: "婆婆講嘅「地堂」係乜嘢？", options: ["屋企嘅客廳", "門口曬穀嘅空地", "廟入面嘅大堂"], answer: 1, explain: "地堂 is the open ground in front of a village house where grain was dried – an old rural word preserved in the rhyme." }
  - { q: "點解〈氹氹轉〉每條村嘅版本都唔同？", options: ["因為童謠係口耳相傳，冇人寫低", "因為政府規定每條村要唱唔同版本", "因為細路仔唔記得歌詞"], answer: 0, explain: "口耳相傳: passed on orally, so each singer changes it." }
