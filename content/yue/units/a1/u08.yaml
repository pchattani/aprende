dialogues:
  - id: a1.u08.d1
    title: 星期三晚喺跑馬地
    context: On a Wednesday race night in Happy Valley, Karen meets Kelvin's family.
    lines:
      - { speaker: Karen, es: "Kelvin，嗰個好高嘅男人係邊個呀？", en: "Kelvin, who's that very tall man?" }
      - { speaker: Kelvin, es: "佢係我舅父。佢好鍾意睇跑馬，每個星期三晚都嚟跑馬地。", en: "He's my uncle. He loves watching the races; he comes to Happy Valley every Wednesday night." }
      - { speaker: Karen, es: "佢旁邊嗰個女人呢？", en: "And the woman next to him?" }
      - { speaker: Kelvin, es: "佢係我舅父嘅老婆。", en: "She's my uncle's wife." }
      - { speaker: Karen, es: "嗰個細路係你細佬嗎？", en: "Is that kid your younger brother?" }
      - { speaker: Kelvin, es: "唔係，佢係我舅父個仔，叫Jason。", en: "No, he's my uncle's son. He's called Jason." }
      - { speaker: Karen, es: "佢好得意呀！佢幾多歲呀？", en: "He's so cute! How old is he?" }
      - { speaker: Kelvin, es: "八歲。佢好叻，但係有時好惡。", en: "Eight. He's very clever, but sometimes he's naughty." }
      - { speaker: Karen, es: "你有冇兄弟姊妹㗎？", en: "Do you have any brothers or sisters?" }
      - { speaker: Kelvin, es: "有，我有一個家姐。佢今晚唔得閒，佢好忙。", en: "Yes, I have an older sister. She isn't free tonight, she's very busy." }
    questions:
      - { q: "嗰個好高嘅男人係邊個？", options: ["Kelvin嘅爸爸", "Kelvin嘅舅父", "Kelvin嘅哥哥"], answer: 1, explain: "Kelvin says 佢係我舅父: he's his uncle (Mum's brother)." }
      - { q: "Jason幾多歲？", options: ["六歲", "八歲", "十歲"], answer: 1, explain: "Kelvin answers 八歲." }
      - { q: "Kelvin有冇兄弟姊妹？", options: ["冇", "有一個家姐", "有一個細佬"], answer: 1, explain: "He says 我有一個家姐: one older sister." }
      - { q: "Kelvin嘅舅父幾時嚟跑馬地？", options: ["每個星期三晚", "每個星期日", "每日朝早"], answer: 0, explain: "He comes 每個星期三晚, every Wednesday night, for the races." }
