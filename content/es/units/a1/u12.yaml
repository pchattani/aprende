id: a1.u12
title: Planes y repaso
lessons:
  - id: a1.u12.l1
    title: Planes para el futuro
    teach: [g.ir-a-future]
    vocab: [w.plan, w.futuro, w.sueno.plan, w.examen, w.curso, w.nota, w.boda, w.navidad, w.pasado-manana, w.dentro-de, w.pronto.phr, w.quizas, w.seguro, w.creer]
    sentences:
      - { es: "¿Qué planes tienes para el fin de semana?", en: "What plans do you have for the weekend?", altEs: ["¿Qué planes tienes el fin de semana?"], grammar: [g.question-words], vocab: [w.plan, w.fin-de-semana] }
      - { es: "El año que viene voy a vivir en Valencia.", en: "Next year I'm going to live in Valencia.", altEs: ["El próximo año voy a vivir en Valencia."], grammar: [g.ir-a-future], vocab: [w.vivir, w.que-viene] }
      - { es: "Pienso estudiar medicina en el futuro.", en: "I plan to study medicine in the future.", grammar: [g.ir-a-future], vocab: [w.pensar, w.futuro] }
      - { es: "Pasado mañana tengo un examen muy importante.", en: "The day after tomorrow I have a very important exam.", altEs: ["Tengo un examen muy importante pasado mañana."], grammar: [g.ir-a-future], vocab: [w.pasado-manana, w.examen] }
      - { es: "Dentro de dos semanas empieza el curso.", en: "In two weeks the course starts.", altEs: ["El curso empieza dentro de dos semanas."], grammar: [g.ir-a-future], vocab: [w.dentro-de, w.curso] }
      - { es: "Quiero sacar buenas notas este año.", en: "I want to get good marks this year.", grammar: [g.querer-present], vocab: [w.nota, w.ano] }
      - { es: "La boda de mi hermana es en junio.", en: "My sister's wedding is in June.", grammar: [g.ser-vs-estar-basics], vocab: [w.boda, w.junio] }
      - { es: "En Navidad vamos a visitar a los abuelos.", en: "At Christmas we're going to visit our grandparents.", grammar: [g.ir-a-future, g.a-personal], vocab: [w.navidad, w.visitar] }
      - { es: "Quizás vamos a la playa, no estoy seguro.", en: "Maybe we'll go to the beach, I'm not sure.", altEs: ["Quizás vamos a la playa, no estoy segura."], grammar: [g.ir-a-future], vocab: [w.quizas, w.seguro] }
      - { es: "Creo que va a llover esta tarde.", en: "I think it's going to rain this afternoon.", altEs: ["Pienso que va a llover esta tarde."], grammar: [g.ir-a-future], vocab: [w.creer, w.llover] }
      - { es: "Tengo una idea: vamos a cenar fuera.", en: "I have an idea: let's eat out.", altEs: ["Tengo una idea: cenamos fuera."], grammar: [g.ir-a-infinitive], vocab: [w.sueno.plan, w.cenar] }
      - { es: "Te contesto lo antes posible.", en: "I'll answer you as soon as possible.", grammar: [g.ir-a-future], vocab: [w.pronto.phr, w.contestar] }
      - { es: "Voy a aprender a cocinar.", en: "I'm going to learn to cook.", altEs: ["Yo voy a aprender a cocinar."], grammar: [g.ir-a-future], vocab: [w.aprender, w.cocinar], transform: { instruction: "Change to 'she'", answer: "Va a aprender a cocinar.", alt: ["Ella va a aprender a cocinar."] } }
    exchanges:
      - q: { es: "¿Qué planes tienes para el verano?", en: "What plans do you have for the summer?" }
        a: { es: "Voy a viajar a Italia con mi familia.", en: "I'm going to travel to Italy with my family." }
        alt: ["Voy a descansar.", "No tengo planes todavía."]
        grammar: [g.ir-a-future]
        vocab: [w.plan, w.viajar, w.verano]
      - q: { es: "¿Cuándo es el examen?", en: "When is the exam?" }
        a: { es: "Pasado mañana.", en: "The day after tomorrow." }
        alt: ["Es pasado mañana.", "Dentro de dos semanas."]
        grammar: [g.ir-a-future]
        vocab: [w.examen, w.pasado-manana, w.dentro-de]
      - q: { es: "¿Vas a estudiar en Salamanca?", en: "Are you going to study in Salamanca?" }
        a: { es: "Quizás, no estoy seguro.", en: "Maybe, I'm not sure." }
        alt: ["Sí, el año que viene.", "No, voy a trabajar."]
        grammar: [g.ir-a-future]
        vocab: [w.quizas, w.seguro, w.estudiar]
      - q: { es: "¿Cuándo empieza el curso?", en: "When does the course start?" }
        a: { es: "Dentro de dos semanas.", en: "In two weeks." }
        alt: ["En septiembre.", "Empieza el lunes."]
        grammar: [g.ir-a-future]
        vocab: [w.dentro-de, w.curso, w.empezar]
      - q: { es: "¿Va a llover esta tarde?", en: "Is it going to rain this afternoon?" }
        a: { es: "Creo que sí.", en: "I think so." }
        alt: ["Creo que no.", "Sí, va a llover."]
        grammar: [g.ir-a-future]
        vocab: [w.creer, w.llover]
      - q: { es: "¿Vais a ir a la boda de Ana?", en: "Are you (all) going to go to Ana's wedding?" }
        a: { es: "Sí, vamos a ir en junio.", en: "Yes, we're going to go in June." }
        alt: ["Sí, claro.", "No, no podemos."]
        grammar: [g.ir-a-future]
        vocab: [w.boda, w.junio]
    texts:
      - title: "Mensaje de Yuki"
        es: ["Tengo una idea para las vacaciones.", "Vamos a ir a la playa en julio.", "Pasado mañana voy a comprar los billetes.", "¿Qué piensas?"]
        en: ["I have an idea for the holidays.", "We're going to go to the beach in July.", "The day after tomorrow I'm going to buy the tickets.", "What do you think?"]
        grammar: [g.ir-a-future]
        vocab: [w.sueno.plan, w.vacaciones, w.pasado-manana, w.billete]
      - title: "Mis planes"
        es: ["El año que viene voy a vivir en Valencia.", "Voy a estudiar en la universidad y voy a trabajar en un bar.", "Quizás voy a aprender a cocinar."]
        en: ["Next year I'm going to live in Valencia.", "I'm going to study at university and work in a bar.", "Maybe I'll learn to cook."]
        grammar: [g.ir-a-future]
        vocab: [w.plan, w.que-viene, w.quizas, w.aprender]
    spicy:
      - { es: "Mi plan para el futuro es fácil: voy a cenar contigo.", en: "My plan for the future is easy: I'm going to have dinner with you.", grammar: [g.ir-a-future], vocab: [w.plan, w.futuro] }
      - { es: "Quizás vas a decir que no, pero voy a preguntar: ¿bailas?", en: "Maybe you're going to say no, but I'm going to ask: shall we dance?", grammar: [g.ir-a-future], vocab: [w.quizas] }
      - { es: "Dentro de diez años vamos a recordar este café.", en: "Ten years from now we're going to remember this coffee.", grammar: [g.ir-a-future], vocab: [w.dentro-de] }
      - { es: "Creo que vas a ser mi persona favorita de este año.", en: "I think you're going to be my favourite person this year.", grammar: [g.ir-a-future], vocab: [w.creer] }
      - { es: "¿Vas a ir a la boda de Ana? Yo voy a bailar contigo toda la noche.", en: "Are you going to Ana's wedding? I'm going to dance with you all night.", grammar: [g.ir-a-future], vocab: [w.boda] }
  - id: a1.u12.l2
    title: Conectar ideas
    teach: [g.connectors-basic, g.tambien-tampoco]
    vocab: [w.deber.plan, w.entonces, w.ademas, w.finalmente, w.si.conj, w.que.conj, w.dejar, w.cambiar, w.invitar, w.celebrar, w.enviar, w.recibir, w.contestar, w.olvidar]
    sentences:
      - { es: "Me gusta el café, pero no me gusta el té.", en: "I like coffee, but I don't like tea.", altEs: ["Me gusta el café, pero el té no."], grammar: [g.connectors-basic], vocab: [w.pero, w.cafe] }
      - { es: "No voy a la fiesta porque estoy cansado.", en: "I'm not going to the party because I'm tired.", altEs: ["No voy a la fiesta porque estoy cansada."], grammar: [g.connectors-basic], vocab: [w.porque, w.fiesta] }
      - { es: "Estudio mucho; por eso tengo buenas notas.", en: "I study a lot; that's why I get good marks.", altEs: ["Estudio mucho y por eso tengo buenas notas."], grammar: [g.connectors-basic], vocab: [w.deber.plan, w.nota] }
      - { es: "Primero desayuno, luego trabajo y finalmente descanso.", en: "First I have breakfast, then I work and finally I rest.", altEs: ["Primero desayuno, después trabajo y finalmente descanso."], grammar: [g.connectors-basic], vocab: [w.primero, w.luego, w.finalmente] }
      - { es: "Si hace sol, vamos a la playa.", en: "If it's sunny, we'll go to the beach.", altEs: ["Vamos a la playa si hace sol."], grammar: [g.connectors-basic], vocab: [w.si.conj, w.sol] }
      - { es: "Creo que es verdad.", en: "I think it's true.", altEs: ["Pienso que es verdad."], grammar: [g.connectors-basic], vocab: [w.que.conj, w.verdad, w.creer] }
      - { es: "Además, el hotel es barato y está cerca.", en: "Besides, the hotel is cheap and it's close.", altEs: ["Además, el hotel es barato y queda cerca."], grammar: [g.connectors-basic], vocab: [w.ademas, w.barato] }
      - { es: "¿Entonces vienes o no?", en: "So, are you coming or not?", altEs: ["Entonces, ¿vienes o no?"], grammar: [g.connectors-basic], vocab: [w.entonces, w.venir] }
      - { es: "Te invito a mi cumpleaños. Vamos a celebrarlo el sábado.", en: "I'm inviting you to my birthday. We're going to celebrate it on Saturday.", grammar: [g.direct-object-intro], vocab: [w.invitar, w.celebrar] }
      - { es: "Envío un mensaje y recibo la respuesta rápidamente.", en: "I send a message and receive the reply quickly.", grammar: [g.regular-er-ir-present], vocab: [w.enviar, w.recibir, w.mensaje] }
      - { es: "Siempre olvido las llaves en casa.", en: "I always forget my keys at home.", altEs: ["Siempre me dejo las llaves en casa."], grammar: [g.frequency-adverbs], vocab: [w.olvidar, w.llave] }
      - { es: "Dejo el coche en el garaje y cambio de ropa.", en: "I leave the car in the garage and change clothes.", grammar: [g.regular-ar-present], vocab: [w.dejar, w.cambiar, w.ropa] }
      - { es: "Ella también habla francés, y yo tampoco hablo alemán.", en: "She also speaks French, and I don't speak German either.", grammar: [g.tambien-tampoco], vocab: [w.tambien, w.tampoco], error: { wrong: "Ella también habla francés, y yo también no hablo alemán.", explain: "también no is wrong; use tampoco.", grammar: g.tambien-tampoco } }
      - { es: "No tengo coche. — Yo tampoco.", en: "I don't have a car. — Me neither.", altEs: ["No tengo coche. — Tampoco yo."], grammar: [g.tambien-tampoco], vocab: [w.tampoco, w.coche] }
    exchanges:
      - q: { es: "¿Vienes a la fiesta?", en: "Are you coming to the party?" }
        a: { es: "No, porque estoy cansado.", en: "No, because I'm tired." }
        alt: ["Sí, claro.", "No, no puedo."]
        grammar: [g.connectors-basic]
        vocab: [w.porque, w.fiesta, w.cansado]
      - q: { es: "¿Te gusta el té?", en: "Do you like tea?" }
        a: { es: "No, pero me gusta el café.", en: "No, but I like coffee." }
        alt: ["Sí, me gusta.", "No."]
        grammar: [g.connectors-basic, g.gustar]
        vocab: [w.pero, w.te.noun, w.cafe]
      - q: { es: "No tengo coche.", en: "I don't have a car." }
        a: { es: "Yo tampoco.", en: "Me neither." }
        alt: ["Yo tampoco tengo.", "Yo sí."]
        grammar: [g.tambien-tampoco]
        vocab: [w.tampoco, w.coche]
      - q: { es: "Hablo francés.", en: "I speak French." }
        a: { es: "Yo también hablo francés.", en: "I speak French too." }
        alt: ["Yo también.", "Yo no."]
        grammar: [g.tambien-tampoco]
        vocab: [w.tambien, w.hablar, w.frances]
      - q: { es: "¿Qué haces si hace sol?", en: "What do you do if it's sunny?" }
        a: { es: "Si hace sol, voy a la playa.", en: "If it's sunny, I go to the beach." }
        alt: ["Voy a la playa.", "Si hace sol, salgo a pasear."]
        grammar: [g.connectors-basic, g.weather]
        vocab: [w.si.conj, w.sol, w.playa]
      - q: { es: "¿Entonces vienes o no?", en: "So, are you coming or not?" }
        a: { es: "Sí, voy. Además, invito a Ana.", en: "Yes, I'm coming. Besides, I'm inviting Ana." }
        alt: ["Sí, voy.", "No, no voy."]
        grammar: [g.connectors-basic, g.a-personal]
        vocab: [w.entonces, w.ademas, w.invitar]
    texts:
      - title: "Mensaje de Pablo"
        es: ["Te invito a mi cumpleaños el sábado.", "Vamos a celebrarlo en casa; además, viene toda la familia.", "Si no puedes venir, contesta, por favor."]
        en: ["I'm inviting you to my birthday on Saturday.", "We're going to celebrate it at home; besides, the whole family is coming.", "If you can't come, please reply."]
        grammar: [g.connectors-basic]
        vocab: [w.invitar, w.celebrar, w.ademas, w.si.conj, w.contestar]
      - title: "Nota"
        es: ["Primero estudio y luego descanso.", "Estudio mucho; por eso tengo buenas notas.", "Mi hermano no estudia mucho, pero también tiene buenas notas."]
        en: ["First I study and then I rest.", "I study a lot; that's why I get good marks.", "My brother doesn't study much, but he also gets good marks."]
        grammar: [g.connectors-basic, g.tambien-tampoco]
        vocab: [w.primero, w.luego, w.deber.plan, w.nota, w.tambien]
    spicy:
      - { es: "Eres guapo y, además, cocinas. Entonces, ¿cenamos?", en: "You're handsome and, besides, you cook. So, dinner?", altEs: ["Eres guapa y, además, cocinas. Entonces, ¿cenamos?"], grammar: [g.connectors-basic], vocab: [w.ademas, w.entonces] }
      - { es: "Si me invitas a un café, yo te invito a la cena.", en: "If you invite me for a coffee, I'll invite you to dinner.", grammar: [g.connectors-basic], vocab: [w.si.conj, w.invitar] }
      - { es: "Te envío un mensaje y tú contestas con una foto de tu perro. Me gusta.", en: "I send you a message and you reply with a photo of your dog. I like it.", grammar: [g.connectors-basic], vocab: [w.enviar, w.contestar] }
      - { es: "No bailo bien y tú tampoco, pero juntos somos divertidos.", en: "I don't dance well and neither do you, but together we're fun.", grammar: [g.tambien-tampoco, g.connectors-basic], vocab: [w.tampoco] }
      - { es: "Finalmente dices que sí. Entonces, celebramos con un helado.", en: "Finally you say yes. So, we celebrate with an ice cream.", grammar: [g.connectors-basic], vocab: [w.finalmente, w.celebrar] }
  - id: a1.u12.l3
    title: Repaso del presente
    teach: [g.present-review]
    vocab: [w.feliz, w.ultimo, w.mismo, w.especial, w.verdad, w.vida]
    sentences:
      - { es: "Los lunes trabajo, pero los sábados duermo hasta tarde.", en: "On Mondays I work, but on Saturdays I sleep till late.", altEs: ["Los lunes trabajo, pero los sábados me levanto tarde."], grammar: [g.present-review], vocab: [w.trabajar, w.dormir] }
      - { es: "¿Qué hacéis? Estamos viendo una película.", en: "What are you doing? We're watching a film.", altEs: ["¿Qué hacéis? Vemos una película."], grammar: [g.present-review, g.estar-gerund], vocab: [w.hacer, w.ver] }
      - { es: "Mi hermana no sabe conducir pero quiere aprender.", en: "My sister can't drive but wants to learn.", altEs: ["Mi hermana no sabe conducir, pero quiere aprender."], grammar: [g.present-review], vocab: [w.saber, w.conducir, w.querer] }
      - { es: "Salgo de casa a las ocho y llego al trabajo a las nueve.", en: "I leave home at eight and get to work at nine.", altEs: ["Salgo de casa a las ocho y llego a las nueve al trabajo."], grammar: [g.present-review], vocab: [w.salir, w.llegar] }
      - { es: "Ellos viven en Londres pero vienen a España cada verano.", en: "They live in London but come to Spain every summer.", altEs: ["Viven en Londres pero vienen a España cada verano.", "Ellos viven en Londres, pero vienen a España todos los veranos."], grammar: [g.present-review], vocab: [w.vivir, w.venir] }
      - { es: "Es el último día del curso y estamos muy felices.", en: "It's the last day of the course and we're very happy.", grammar: [g.ser-vs-estar-basics], vocab: [w.ultimo, w.feliz, w.curso] }
      - { es: "Vivimos en la misma calle.", en: "We live on the same street.", altEs: ["Nosotros vivimos en la misma calle."], grammar: [g.adjectives-position], vocab: [w.mismo, w.calle] }
      - { es: "Hoy es un día especial: es mi cumpleaños.", en: "Today is a special day: it's my birthday.", altEs: ["Hoy es un día especial porque es mi cumpleaños."], grammar: [g.ser-present], vocab: [w.especial, w.cumpleanos] }
      - { es: "La vida en el pueblo es tranquila.", en: "Life in the village is quiet.", grammar: [g.adjective-agreement], vocab: [w.vida, w.pueblo, w.tranquilo] }
      - { es: "¿Es verdad que hablas cinco idiomas?", en: "Is it true that you speak five languages?", altEs: ["¿De verdad hablas cinco idiomas?"], grammar: [g.present-review], vocab: [w.verdad, w.idioma] }
      - { es: "Tengo veinte años, soy de Irlanda y estudio español en Granada.", en: "I'm twenty, I'm from Ireland and I study Spanish in Granada.", grammar: [g.present-review], vocab: [w.tener, w.ser, w.estudiar] }
      - { es: "Me levanto a las siete, desayuno y voy al trabajo en metro.", en: "I get up at seven, have breakfast and go to work by metro.", altEs: ["Me levanto a las siete, desayuno y voy en metro al trabajo."], grammar: [g.present-review], vocab: [w.levantarse, w.desayunar, w.ir] }
      - { es: "Ella hace deporte y toca la guitarra.", en: "She does sport and plays the guitar.", grammar: [g.present-review], vocab: [w.hacer, w.tocar], transform: { instruction: "Change to 'I'", answer: "Hago deporte y toco la guitarra.", alt: ["Yo hago deporte y toco la guitarra."] } }
      - { es: "Hablo español, pero no hablo portugués.", en: "I speak Spanish, but I don't speak Portuguese.", grammar: [g.present-review], vocab: [w.hablar], error: { wrong: "Hablo español, pero no habló portugués.", explain: "habló (with accent) is the past tense; the present is hablo.", grammar: g.stress-and-tilde } }
    exchanges:
      - q: { es: "¿Qué hacéis?", en: "What are you (all) doing?" }
        a: { es: "Estamos viendo una película.", en: "We're watching a film." }
        alt: ["Vemos una película.", "Nada."]
        grammar: [g.present-review, g.estar-gerund]
        vocab: [w.hacer, w.ver, w.pelicula]
      - q: { es: "¿Sabe conducir tu hermana?", en: "Can your sister drive?" }
        a: { es: "No, pero quiere aprender.", en: "No, but she wants to learn." }
        alt: ["No, no sabe.", "Sí, conduce muy bien."]
        grammar: [g.present-review]
        vocab: [w.saber, w.conducir, w.querer, w.aprender]
      - q: { es: "¿A qué hora llegas al trabajo?", en: "What time do you get to work?" }
        a: { es: "Salgo de casa a las ocho y llego a las nueve.", en: "I leave home at eight and arrive at nine." }
        alt: ["A las nueve.", "Llego a las nueve."]
        grammar: [g.present-review, g.time-telling]
        vocab: [w.salir, w.llegar, w.trabajo]
      - q: { es: "¿Es verdad que hablas cinco idiomas?", en: "Is it true that you speak five languages?" }
        a: { es: "No, hablo tres: español, inglés y francés.", en: "No, I speak three: Spanish, English and French." }
        alt: ["Sí, es verdad.", "No, solo dos."]
        grammar: [g.present-review]
        vocab: [w.verdad, w.idioma, w.hablar]
      - q: { es: "¿Dónde vivís?", en: "Where do you (all) live?" }
        a: { es: "Vivimos en la misma calle.", en: "We live on the same street." }
        alt: ["En Madrid.", "Vivimos en el centro."]
        grammar: [g.present-review]
        vocab: [w.vivir, w.mismo, w.calle]
      - q: { es: "¿Por qué estáis tan felices?", en: "Why are you (all) so happy?" }
        a: { es: "Porque es el último día del curso.", en: "Because it's the last day of the course." }
        alt: ["Porque hoy es un día especial.", "Porque es mi cumpleaños."]
        grammar: [g.ser-vs-estar-basics, g.present-review]
        vocab: [w.feliz, w.ultimo, w.curso]
    texts:
      - title: "Perfil de Tom"
        es: ["Tengo veinte años, soy de Irlanda y vivo en Granada.", "Estudio español y trabajo en un bar por la noche.", "El fin de semana hago deporte y toco la guitarra."]
        en: ["I'm twenty, I'm from Ireland and I live in Granada.", "I study Spanish and work in a bar at night.", "At the weekend I do sport and play the guitar."]
        grammar: [g.present-review]
        vocab: [w.tener, w.ser, w.vivir, w.estudiar, w.trabajar]
      - title: "Mensaje"
        es: ["Hoy es un día especial: es el último día del curso.", "Estamos muy felices.", "Esta noche cenamos todos juntos en el mismo restaurante de siempre."]
        en: ["Today is a special day: it's the last day of the course.", "We're very happy.", "Tonight we're all having dinner together at the same restaurant as always."]
        grammar: [g.present-review, g.ser-vs-estar-basics]
        vocab: [w.especial, w.ultimo, w.feliz, w.mismo]
    spicy:
      - { es: "Estoy feliz porque estás aquí. Es la verdad.", en: "I'm happy because you're here. It's the truth.", grammar: [g.present-review, g.ser-vs-estar-basics], vocab: [w.feliz, w.verdad] }
      - { es: "Vivimos en la misma calle y tomamos el mismo autobús. ¿Tomamos el mismo café?", en: "We live on the same street and take the same bus. Shall we have the same coffee?", grammar: [g.present-review], vocab: [w.mismo] }
      - { es: "Eres especial, ¿sabes? Y no lo digo a todo el mundo.", en: "You're special, you know? And I don't say that to everyone.", grammar: [g.present-review], vocab: [w.especial] }
      - { es: "La vida es corta: ¿bailamos ahora?", en: "Life is short: shall we dance now?", grammar: [g.present-review], vocab: [w.vida] }
      - { es: "¿Es verdad que estás soltero? Pregunto por una amiga. La amiga soy yo.", en: "Is it true you're single? Asking for a friend. The friend is me.", altEs: ["¿Es verdad que estás soltera? Pregunto por un amigo. El amigo soy yo."], grammar: [g.present-review], vocab: [w.verdad] }
  - id: a1.u12.l4
    title: ¡Felicidades!
    teach: [g.ir-a-future]
    vocab: [w.suerte.phr, w.felicidades]
    sentences:
      - { es: "¡Felicidades! ¡Feliz cumpleaños!", en: "Congratulations! Happy birthday!", altEs: ["¡Feliz cumpleaños! ¡Felicidades!"], grammar: [g.greetings], vocab: [w.felicidades, w.feliz] }
