        vocab: [w.seng4-go3, w.zing6-hai6]
    spicy:
      - { es: "我淨係想同你一齊，冇人比你重要。", en: "I only want to be with you, no one matters more than you.", altEs: ["我淨係想同你一齊，冇人比你更加重要。"], grammar: [g.zing-hai-only], vocab: [w.zing6-hai6, w.zung6-jiu3] }
      - { es: "我只係借你件褸，你唔使還。", en: "I'm only lending you my jacket, you don't need to give it back.", altEs: ["我只係借件褸畀你，唔使還。"], grammar: [g.zing-hai-only, g.jiu-must-m-sai], vocab: [w.zi2-hai6, w.ze3, w.waan4] }
      - { es: "冇你，成個週末都好悶。", en: "Without you, the whole weekend is so boring.", altEs: ["冇咗你，成個週末都好悶。"], grammar: [g.dou-also], vocab: [w.seng4-go3, w.mun6] }
      - { es: "我好窮，不過我好真心。", en: "I'm poor, but I'm sincere.", altEs: ["我好窮，但係我好真心。"], grammar: [g.zing-hai-only], vocab: [w.kung4, w.zan1] }
