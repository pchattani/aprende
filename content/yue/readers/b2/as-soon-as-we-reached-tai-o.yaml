id: r.b2.as-soon-as-we-reached-tai-o
level: b2
title: 一到大澳就聞到蝦醬味
kind: text
intro: Food blogger Kelly spends a day in Tai O, the fishing village on the west of Lantau - stilt houses, shrimp paste, salted fish and, if you are lucky, pink dolphins.
allow: [Kelly]
paragraphs:
  - { es: "各位讀者，今期我帶大家去大澳。大澳喺大嶼山西面，係香港最出名嘅漁村之一。由東涌坐巴士去，大概要五十分鐘。我一落車就聞到一陣好濃嘅鹹魚同蝦醬味，未見到條村，個鼻已經話我知：「到喇！」", en: "Dear readers, this issue I'm taking you to Tai O. Tai O is on the west side of Lantau Island and is one of Hong Kong's most famous fishing villages. By bus from Tung Chung it takes about fifty minutes. As soon as I got off the bus I caught a strong smell of salted fish and shrimp paste; before I'd even seen the village, my nose was telling me: \"You're here!\"" }
  - { es: "大澳最特別嘅係棚屋。好多居民嘅屋企用木柱起喺水上面，一間接一間，沿住條涌排成一列。我同一位喺棚屋住咗七十年嘅婆婆傾偈，佢話以前一打風，成條村都好擔心，不過大家會互相幫手，將船綁好，執好啲嘢。佢話：「只要人齊，乜嘢都唔怕。」", en: "The most special thing about Tai O is the stilt houses. Many residents' homes are built on wooden posts over the water, one after another in a row along the creek. I chatted with a granny who has lived in a stilt house for seventy years. She said that in the past, whenever a typhoon came, the whole village was very worried, but everyone helped each other, tying up the boats and securing their belongings. She said: \"As long as we're all together, we're not afraid of anything.\"" }
  - { es: "講到食，大澳嘅蝦醬同鹹魚係一流嘅。啲蝦醬係用細蝦加鹽，放喺太陽底下曬幾個禮拜整成嘅。天氣越熱，曬得越快，味道就越香。一間老字號嘅老闆話，佢哋屋企做咗三代蝦醬，一年做到頭，冇一日休息。我買咗一樽返屋企，用嚟炒通菜，真係好正。", en: "When it comes to food, Tai O's shrimp paste and salted fish are first-rate. The shrimp paste is made from tiny shrimps mixed with salt and dried in the sun for several weeks. The hotter the weather, the faster it dries and the more fragrant it becomes. The owner of a long-established shop said his family has made shrimp paste for three generations, working all year round without a day off. I bought a jar to take home and used it to stir-fry water spinach - absolutely delicious." }
  - { es: "喺街市行一圈，你會見到好多大澳特產：鹹魚、魚肚、蝦乾，仲有街邊用炭爐燒嘅大雞蛋仔同茶粿。我一嚟到就食咗兩件茶粿，一路行一路食，食到停唔到口。老闆娘笑住話：「靚女，你食咁多，等陣冇肚食海鮮喎！」", en: "Walk round the market and you'll see lots of Tai O specialities: salted fish, fish maw, dried shrimps, and also giant egg waffles grilled on charcoal stoves at the roadside, and cha kwo rice cakes. I'd only just arrived and I'd already eaten two cha kwo, eating as I walked and unable to stop. The lady running the stall laughed: \"Young lady, if you eat that much you won't have room for seafood later!\"" }
  - { es: "食完嘢，我坐咗一程小船出海，希望見到中華白海豚。佢哋又叫「粉紅海豚」，因為成年之後皮膚會變成粉紅色。船家話，近年因為填海同多咗船，海豚越嚟越少，有時出十次海先見到一次。不過我好彩，船一出到海口就見到兩條，一大一細，喺海面跳起嚟。成船人即刻嗌出聲，個個都忍唔住影相。", en: "After eating, I took a small boat out to sea, hoping to see Chinese white dolphins. They're also called \"pink dolphins\" because their skin turns pink when they become adults. The boatman said that in recent years, because of land reclamation and more boat traffic, there are fewer and fewer dolphins, and sometimes you have to go out ten times before you see one. But I was lucky: as soon as the boat reached the mouth of the bay we saw two, one big and one small, leaping out of the water. Everyone on board shouted out at once, and nobody could resist taking photos." }
  - { es: "近年大澳越嚟越多遊客，週末條街逼到行唔郁。有居民覺得遊客帶嚟生意，係好事；亦有人擔心大澳會失去原本嘅樣，變成一個淨係賣嘢嘅地方。我覺得，只要遊客尊重當地人嘅生活，唔好亂咁影人哋屋企，唔好留低垃圾，兩樣嘢係可以並存嘅。", en: "In recent years Tai O has had more and more tourists, and at weekends the streets are so crowded you can barely move. Some residents feel tourists bring business, which is a good thing; others worry Tai O will lose its original character and become just a place that sells things. I think that as long as visitors respect local people's way of life - not taking photos of people's homes without thinking, not leaving rubbish - the two can coexist." }
  - { es: "最後貼士：如果你想影日落，記得留到五六點，大澳嘅日落係全港數一數二咁靚。仲有，返屋企之前一定要買蝦醬，不過記住包好佢，唔係成架巴士都會知道你去過大澳！", en: "A final tip: if you want to photograph the sunset, remember to stay until five or six, because Tai O's sunsets are among the most beautiful in Hong Kong. And be sure to buy shrimp paste before you go home - but wrap it up well, or the whole bus will know you've been to Tai O!" }
questions:
  - { q: "Kelly一落車就發覺乜嘢？", options: ["聞到鹹魚同蝦醬味", "見到海豚", "落雨"], answer: 0, explain: "我一落車就聞到一陣好濃嘅鹹魚同蝦醬味." }
  - { q: "棚屋係點樣起嘅？", options: ["用木柱起喺水上面", "起喺山上面", "用石頭起喺沙灘"], answer: 0, explain: "好多居民嘅屋企用木柱起喺水上面." }
  - { q: "點解天氣越熱，蝦醬越香？", options: ["因為曬得越快", "因為加多咗鹽", "因為蝦大啲"], answer: 0, explain: "天氣越熱，曬得越快，味道就越香." }
  - { q: "點解中華白海豚又叫粉紅海豚？", options: ["因為成年之後皮膚會變粉紅色", "因為佢哋食粉紅色嘅魚", "因為大澳人鍾意粉紅色"], answer: 0, explain: "成年之後皮膚會變成粉紅色." }
  - { q: "船家話海豚點解越嚟越少？", options: ["因為填海同多咗船", "因為天氣太熱", "因為遊客餵佢哋"], answer: 0, explain: "近年因為填海同多咗船，海豚越嚟越少." }
  - { q: "Kelly覺得遊客應該點做？", options: ["尊重當地人嘅生活", "唔好去大澳", "只係週末去"], answer: 0, explain: "只要遊客尊重當地人嘅生活… 兩樣嘢係可以並存嘅." }
