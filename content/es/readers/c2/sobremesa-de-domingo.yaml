id: r.c2.sobremesa-de-domingo
level: c2
title: Sobremesa de domingo
kind: dialogue
intro: Four friends linger at the table after Sunday lunch in Madrid. The talk is pure native Spanish - fillers, backchannels, idioms, exaggeration and cultural references - and one of them is a foreigner who has learnt to keep up.
allow: [marcos, nuria, javi, aiko, chiquito, calzada, lavapiés]
paragraphs:
  - { es: "Marcos: Bueno, pues nada, ¿quién quiere café? Que yo lo hago, que luego decís que lo hago aguado. — Nuria: Hombre, Marcos, es que lo haces aguado. Pero venga, hazlo tú, que yo no me levanto ni aunque me paguen.", en: "Marcos: Right, so, who wants coffee? I'll make it, otherwise you'll say I make it watery. — Nuria: Come on, Marcos, the thing is you do make it watery. But go on, you make it, I'm not getting up even if they pay me." }
  - { es: "Javi: Oye, ¿y qué pasó al final con el piso de Lavapiés? — Nuria: Ni me hables. Nos lo dieron, ¿sabes?, y a los dos días el casero se hizo el sueco con lo de la calefacción. Total, que allí seguimos, con dos mantas y la estufa a tope.", en: "Javi: Hey, and what happened in the end with the flat in Lavapiés? — Nuria: Don't even mention it. They gave it to us, you know?, and two days later the landlord played dumb about the heating. So anyway, there we still are, with two blankets and the heater on full." }
  - { es: "Aiko: ¿Y no le habéis dicho nada? — Nuria: Le canté las cuarenta la semana pasada, en plan educada pero firme. Me dijo que «ahorita lo miraba», y yo pensé: este hombre ha vivido en México. — Marcos: ¡Qué fuerte! Eso es un nunca con sombrero.", en: "Aiko: And you haven't said anything to him? — Nuria: I gave him a piece of my mind last week, like, polite but firm. He said he'd look at it 'ahorita', and I thought: this man has lived in Mexico. — Marcos: Unbelievable! That's a 'never' wearing a hat." }
  - { es: "Javi: Aiko, tú que eres la lingüista: ¿cuánto llevas ya en España? — Aiko: Seis años. Y lo que más me costó no fue el subjuntivo, fue esto: la sobremesa. Al principio, cuando acababa el postre, me levantaba a lavar los platos y todos me miraban como si estuviera loca.", en: "Javi: Aiko, you're the linguist: how long have you been in Spain now? — Aiko: Six years. And what I found hardest wasn't the subjunctive, it was this: the sobremesa. At the beginning, when dessert was over, I'd get up to wash the dishes and everyone looked at me as if I were mad." }
  - { es: "Nuria: Es que aquí levantarse de la mesa es casi un insulto. — Aiko: Ya, ya. Ahora soy yo la que no se levanta. Y he aprendido a interrumpir, que eso también me costaba: en mi país esperas tu turno; aquí, si esperas, no hablas nunca.", en: "Nuria: The thing is, here getting up from the table is almost an insult. — Aiko: Yeah, yeah. Now I'm the one who doesn't get up. And I've learnt to interrupt, which was also hard for me: in my country you wait your turn; here, if you wait, you never speak." }
  - { es: "Marcos: Y los chistes, ¿los pillas ya? — Aiko: Casi todos. Lo que todavía se me escapa son las referencias. El otro día alguien imitó a Chiquito de la Calzada y la peña se moría de risa, y yo ahí, sonriendo como una tonta. — Javi: Eso no se aprende en ningún libro, eso es ver mucha tele mala de los noventa.", en: "Marcos: And the jokes, do you get them now? — Aiko: Almost all of them. What still escapes me are the references. The other day someone imitated Chiquito de la Calzada and the whole gang was dying with laughter, and there I was, smiling like an idiot. — Javi: That isn't learnt in any book, that's watching a lot of bad nineties TV." }
  - { es: "Nuria: Pues yo te veo supernativa. Exageras como nosotros: ayer dijiste que llevabas «mil años» sin ver a tu hermana. — Aiko: ¡Es que es verdad! Bueno, ocho meses. — Marcos: Ocho meses, mil años… ni fu ni fa, es lo mismo. Toma, el café. Aguado, para que no digáis que cambio.", en: "Nuria: Well, I think you sound totally native. You exaggerate like us: yesterday you said you hadn't seen your sister in 'a thousand years'. — Aiko: But it's true! Well, eight months. — Marcos: Eight months, a thousand years… neither here nor there, it's the same thing. Here, the coffee. Watery, so you can't say I've changed." }
  - { es: "Javi: Oye, ¿y si pedimos algo dulce para matar el gusanillo? Hay una pastelería ahí abajo que es la leche. — Nuria: Javi, acabamos de comer hace una hora. — Javi: Precisamente. De perdidos al río. — Aiko: Eso tampoco estaba en mis libros, pero lo he entendido perfectamente. Voy yo, que soy la única que se levanta.", en: "Javi: Hey, what if we order something sweet to take the edge off? There's a bakery down the street that's amazing. — Nuria: Javi, we finished eating an hour ago. — Javi: Exactly. In for a penny, in for a pound. — Aiko: That wasn't in my books either, but I understood it perfectly. I'll go, since I'm the only one who gets up." }
questions:
  - { q: "What does the landlord do about the heating?", options: ["He fixes it immediately", "He pretends not to hear (se hace el sueco)", "He raises the rent"], answer: 1 }
  - { q: "Why does Marcos joke that the landlord has lived in Mexico?", options: ["Because he said 'ahorita', which can mean 'never'", "Because he speaks with a Mexican accent", "Because he eats tacos"], answer: 0 }
  - { q: "What was hardest for Aiko when she arrived in Spain?", options: ["The subjunctive", "The sobremesa and not getting up from the table", "Spanish food"], answer: 1 }
  - { q: "What does Aiko still find difficult?", options: ["Interrupting", "Cultural references like Chiquito de la Calzada", "Making coffee"], answer: 1 }
  - { q: "Why does Javi say 'de perdidos al río'?", options: ["Because they have already eaten a lot, so they might as well have cake too", "Because the bakery is by the river", "Because he lost his wallet"], answer: 0 }
glossary:
  - { es: aguado, en: watery, weak (coffee) }
  - { es: estufa, en: heater }
  - { es: firme, en: firm }
  - { es: sombrero, en: hat }
  - { es: turno, en: turn }
  - { es: escaparse, en: to escape, to slip by }
  - { es: imitar, en: to imitate }
  - { es: morirse de risa, en: to die laughing }
  - { es: pastelería, en: cake shop, bakery }
  - { es: precisamente, en: exactly, precisely }
