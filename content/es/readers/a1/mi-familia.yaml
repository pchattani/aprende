id: r.a1.mi-familia
level: a1
title: Mi familia y yo
kind: text
intro: Lucía, a university student from Valencia, introduces her family.
paragraphs:
  - { es: "¡Hola! Me llamo Lucía y tengo veintidós años. Soy de Valencia, una ciudad grande y bonita en el este de España. Vivo con mi familia en un piso en el centro.", en: "Hi! My name is Lucía and I'm twenty-two. I'm from Valencia, a big, beautiful city in the east of Spain. I live with my family in a flat in the centre." }
  - { es: "Mi familia es bastante grande. Mi padre se llama Antonio y tiene cincuenta y cinco años. Es médico y trabaja en un hospital. Es alto, moreno y muy serio, pero también es muy amable.", en: "My family is quite big. My father's name is Antonio and he's fifty-five. He's a doctor and works in a hospital. He's tall, dark-haired and very serious, but he's also very kind." }
  - { es: "Mi madre, Carmen, es profesora de inglés en una escuela. Tiene cincuenta años, es baja y rubia y lleva gafas. Es muy alegre y divertida. Le gusta mucho cocinar y los domingos hace una paella fantástica.", en: "My mother, Carmen, is an English teacher at a school. She's fifty, short and blond, and wears glasses. She's very cheerful and fun. She loves cooking and on Sundays she makes a fantastic paella." }
  - { es: "Tengo dos hermanos. Mi hermano mayor, Pablo, tiene veintiocho años y es ingeniero. Está casado y vive en Madrid con su mujer. Mi hermana menor, Ana, tiene quince años y es estudiante. Es un poco tímida, pero muy inteligente.", en: "I have two siblings. My older brother, Pablo, is twenty-eight and an engineer. He's married and lives in Madrid with his wife. My younger sister, Ana, is fifteen and a student. She's a bit shy, but very intelligent." }
  - { es: "Mis abuelos viven en un pueblo pequeño cerca del mar. Mi abuelo tiene ochenta años y mi abuela setenta y ocho. Tienen un perro muy viejo que se llama Toby. En verano vamos todos al pueblo y comemos juntos en el jardín.", en: "My grandparents live in a small village near the sea. My grandfather is eighty and my grandmother seventy-eight. They have a very old dog called Toby. In summer we all go to the village and eat together in the garden." }
  - { es: "Yo estudio medicina en la universidad, como mi padre. Por la mañana tengo clase y por la tarde estudio en la biblioteca. Los fines de semana salgo con mis amigos o toco la guitarra. Me encanta la música.", en: "I study medicine at university, like my father. In the morning I have class and in the afternoon I study in the library. At weekends I go out with my friends or play the guitar. I love music." }
questions:
  - { q: "What is Lucía's father's job?", options: ["Teacher", "Doctor", "Engineer"], answer: 1 }
  - { q: "Who is married and lives in Madrid?", options: ["Ana", "Pablo", "Carmen"], answer: 1 }
  - { q: "What does Lucía do at weekends?", options: ["She goes to the library", "She cooks paella", "She goes out with friends or plays guitar"], answer: 2 }
glossary:
  - { es: este, en: east }
  - { es: medicina, en: medicine }
