id: r.c1.portada-del-lunes
level: c1
title: Portada del lunes
kind: text
intro: Four short news items from a Spanish daily, each with its headline and lead, followed by a letter to the editor. Notice headline syntax, attribution to sources, the conditional of rumour and the paper's quotation conventions.
allow: [congreso, bruselas, andalucía, barcelona, gobierno, pib, ine, iva, lucía, ferrer, valencia]
paragraphs:
  - { es: "Sube el paro por tercer mes consecutivo pese al repunte del turismo. El número de desempleados creció en 23.400 personas en septiembre, según los datos que el INE dio a conocer ayer. El Gobierno atribuyó el descenso del empleo al fin de la temporada de verano y aseguró que «la tendencia de fondo sigue siendo positiva»; la oposición, por su parte, habló de «un fracaso sin precedentes».", en: "Unemployment rises for the third month in a row despite the upturn in tourism. The number of unemployed grew by 23,400 people in September, according to the data released yesterday by the INE. The government attributed the fall in employment to the end of the summer season and asserted that 'the underlying trend remains positive'; the opposition, for its part, spoke of 'an unprecedented failure'." }
  - { es: "Detenido el presunto autor del robo del museo de Valencia. La policía detuvo en la madrugada del domingo a un hombre de 42 años que, según fuentes policiales, habría actuado solo y habría vendido ya dos de los tres cuadros. El presunto ladrón, que negó los hechos ante el juez, comparecerá de nuevo el jueves. Fuentes judiciales matizaron que «todavía no hay pruebas concluyentes».", en: "Alleged perpetrator of the Valencia museum robbery arrested. Police arrested in the early hours of Sunday a 42-year-old man who, according to police sources, is thought to have acted alone and to have already sold two of the three paintings. The alleged thief, who denied the facts before the judge, will appear again on Thursday. Judicial sources added that 'there is still no conclusive evidence'." }
  - { es: "La ministra de Economía: «No habrá subida del IVA». En una rueda de prensa celebrada en Bruselas, la ministra desmintió los rumores publicados por varios medios y calificó de «bulo» la supuesta filtración de un documento interno. «Quien afirme lo contrario tendrá que demostrarlo», declaró, antes de reconocer que el Gobierno estudia «otras medidas» para incrementar los ingresos.", en: "Minister for the Economy: 'There will be no VAT rise'. At a press conference held in Brussels, the minister denied the rumours published by several outlets and described the supposed leak of an internal document as a 'hoax'. 'Whoever claims otherwise will have to prove it', she declared, before acknowledging that the government is studying 'other measures' to increase revenue." }
  - { es: "Hallados sanos y salvos los dos montañeros perdidos en los Pirineos. Los dos jóvenes, de 24 y 26 años, pasaron la noche a 2.300 metros de altura sin comida ni agua. Una vez localizados por el helicóptero de rescate, fueron trasladados al hospital de Huesca, donde, al parecer, permanecerán hasta mañana. «Ha sido un error nuestro: salimos sin mirar la previsión», reconoció uno de ellos.", en: "Two climbers lost in the Pyrenees found safe and sound. The two young men, aged 24 and 26, spent the night at an altitude of 2,300 metres without food or water. Once located by the rescue helicopter, they were taken to the hospital in Huesca, where, apparently, they will remain until tomorrow. 'It was our mistake: we set out without looking at the forecast', one of them admitted." }
  - { es: "Cartas al director. Señor director: Leo con disgusto que su periódico, que presume de objetividad, titula «Detenido el presunto autor» y, dos líneas más abajo, escribe que el hombre «habría vendido ya dos cuadros». Si es presunto, es presunto; y el condicional de rumor no convierte una sospecha en una noticia. Con todo el respeto, les pido que rectifiquen o, al menos, que citen a sus fuentes con nombre y apellido. Lucía Ferrer, Barcelona.", en: "Letters to the editor. Dear Editor, I read with displeasure that your newspaper, which boasts of objectivity, runs the headline 'Alleged perpetrator arrested' and, two lines below, writes that the man 'is thought to have already sold two paintings'. If he is alleged, he is alleged; and the conditional of rumour does not turn a suspicion into news. With all due respect, I ask you to issue a correction or, at least, to name your sources. Lucía Ferrer, Barcelona." }
  - { es: "Nota de la redacción. Esta redacción agradece la carta de la señora Ferrer y reconoce que la frase citada debió llevar una atribución más clara. La información procedía de dos fuentes policiales distintas, que pidieron no ser identificadas. Mantenemos la noticia, pero hemos corregido la entradilla en la edición digital.", en: "Editor's note. This newsroom thanks Ms Ferrer for her letter and acknowledges that the sentence quoted should have carried a clearer attribution. The information came from two different police sources, who asked not to be identified. We stand by the story, but we have corrected the lead in the online edition." }
questions:
  - { q: "To what does the government attribute the rise in unemployment?", options: ["The end of the summer season", "The rise in VAT", "The museum robbery"], answer: 0 }
  - { q: "Why does the second item say 'habría actuado solo' rather than 'actuó solo'?", options: ["Because it happened in the past", "Because the information is unconfirmed and comes from sources", "Because the man confessed"], answer: 1 }
  - { q: "What does the minister call the leaked document?", options: ["A hoax", "A draft", "An official plan"], answer: 0 }
  - { q: "What did the two climbers do wrong, in their own words?", options: ["They took the wrong path", "They set out without checking the forecast", "They forgot their phones"], answer: 1 }
  - { q: "What does Lucía Ferrer ask the newspaper to do?", options: ["To publish her photo", "To issue a correction or name its sources", "To stop covering crime"], answer: 1 }
  - { q: "How does the newspaper respond to the letter?", options: ["It withdraws the story", "It admits the attribution should have been clearer and corrects the lead online", "It ignores the complaint"], answer: 1 }
