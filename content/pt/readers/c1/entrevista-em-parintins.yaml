id: r.c1.entrevista-em-parintins
level: c1
title: "Entrevista: o artista dos bois de Parintins"
kind: dialogue
intro: "A radio journalist interviews Raimundo, a sculptor who has spent thirty years building the giant floats of the Parintins festival. Listen for the idioms (cair a ficha, pisar na bola, dar o sangue, de mão em mão), the softening and hedging of polite Brazilian conversation and the humour of the rivalry between the red Garantido and the blue Caprichoso."
allow: [coca-cola, belém, parintins, raimundo, carla, garantido, caprichoso, bumbódromo, manaus, amazonas, cunhã-poranga, sinhazinha, pajé, boi-bumbá, bois-bumbás, tupinambarana]
paragraphs:
  - { es: "CARLA: Boa tarde, seu Raimundo. Obrigada por nos receber aqui no galpão, logo agora, a três semanas do festival. Imagino que o senhor esteja sem tempo nem para respirar. RAIMUNDO: Boa tarde, minha filha. Olha, tempo a gente não tem mesmo, mas para falar do boi a gente sempre arranja um jeitinho. Senta aí, só cuidado com a tinta, que ainda está fresca.", en: "CARLA: Good afternoon, Mr Raimundo. Thank you for having us here in the workshop, right now, three weeks before the festival. I imagine you don't even have time to breathe. RAIMUNDO: Good afternoon, my dear. Look, we really don't have time, but to talk about the boi we always find a way. Sit down there, just be careful with the paint, it's still wet." }
  - { es: "CARLA: Para quem nunca veio a Parintins, como o senhor explicaria o que acontece aqui no fim de junho? RAIMUNDO: É difícil explicar sem ver, mas vou tentar. Durante três noites, dois bois-bumbás, o Garantido, que é vermelho, e o Caprichoso, que é azul, se apresentam no Bumbódromo. Cada um tem duas horas e meia para contar uma história com música, dança e alegorias enormes. Os jurados dão as notas e, no fim, um dos dois é campeão. Parece simples, né? Mas por trás de cada noite tem um ano inteiro de trabalho de milhares de pessoas.", en: "CARLA: For someone who has never come to Parintins, how would you explain what happens here at the end of June? RAIMUNDO: It's hard to explain without seeing it, but I'll try. For three nights, two bois-bumbás, Garantido, which is red, and Caprichoso, which is blue, perform in the Bumbódromo. Each one has two and a half hours to tell a story with music, dance and enormous floats. The judges give their marks and at the end one of the two is champion. Sounds simple, right? But behind each night there's a whole year of work by thousands of people." }
  - { es: "CARLA: E o senhor trabalha para qual dos dois, se não for indiscrição? RAIMUNDO: (risos) Aqui essa pergunta nunca é indiscrição, é a primeira coisa que se pergunta! Eu sou Garantido desde que nasci. Minha mãe dizia que eu chorei de vermelho. Mas vou confessar uma coisa: o meu melhor amigo é Caprichoso, e a gente almoça junto todo domingo. Só durante o festival é que a gente não se fala. É rivalidade, não é inimizade.", en: "CARLA: And which of the two do you work for, if it's not an indiscreet question? RAIMUNDO: (laughs) Here that question is never indiscreet, it's the first thing people ask! I've been Garantido since I was born. My mother used to say I cried in red. But I'll confess something: my best friend is Caprichoso, and we have lunch together every Sunday. It's only during the festival that we don't speak to each other. It's rivalry, not enmity." }
  - { es: "CARLA: Como o senhor começou a fazer alegorias? RAIMUNDO: Comecei menino, carregando balde de cola para os artistas mais velhos. Ninguém me ensinou formalmente; foi tudo de mão em mão, olhando e errando. Lembro que, no meu primeiro ano como responsável por uma peça, pisei feio na bola: fiz uma cobra-grande linda, mas tão pesada que não passava pela porta do galpão. Tivemos que cortar a coitada ao meio na véspera da apresentação. Quem pagou o pato fui eu, claro: passei a noite inteira colando tudo de novo.", en: "CARLA: How did you start making floats? RAIMUNDO: I started as a boy, carrying buckets of glue for the older artists. Nobody taught me formally; it was all handed down, by watching and making mistakes. I remember that, in my first year in charge of a piece, I really messed up: I made a beautiful giant serpent, but so heavy it wouldn't go through the workshop door. We had to cut the poor thing in half the day before the performance. I was the one who paid for it, of course: I spent the whole night gluing it all back together." }
  - { es: "CARLA: Hoje as alegorias se mexem, abrem, giram, soltam fumaça. Como se chegou a esse nível de tecnologia? RAIMUNDO: Com muita teimosia e pouco dinheiro, pelo menos no começo. Os artistas de Parintins aprenderam a fazer milagre com ferro velho, motor de carro e isopor. Tanto é que hoje muitos de nós trabalhamos também no carnaval do Rio e de São Paulo. Quando eu vi uma alegoria minha na avenida, no Rio, aí é que me caiu a ficha de que o que a gente faz aqui é arte de verdade, e não só brincadeira de interior.", en: "CARLA: Today the floats move, open, spin, give off smoke. How did you reach this level of technology? RAIMUNDO: With a lot of stubbornness and little money, at least at the beginning. The artists of Parintins learned to work miracles with scrap metal, car engines and polystyrene. So much so that today many of us also work in the carnivals of Rio and São Paulo. When I saw one of my floats on the parade avenue in Rio, that's when it sank in that what we do here is real art, not just small-town fun." }
  - { es: "CARLA: E como a cidade vive esses dias? Dizem que Parintins praticamente dobra de tamanho. RAIMUNDO: Dobra, e às vezes mais. Chegam barcos de Manaus, de Belém, do interior todo, cheios de redes penduradas. Tem gente que dorme no barco mesmo, porque não sobra quarto na cidade. Até a Coca-Cola aqui tem lata azul e lata vermelha, para não desagradar ninguém. É uma loucura, mas é uma loucura organizada, e o dinheiro que entra nesses dias ajuda muita família a passar o resto do ano.", en: "CARLA: And how does the town experience those days? They say Parintins practically doubles in size. RAIMUNDO: It doubles, and sometimes more. Boats arrive from Manaus, from Belém, from all over the interior, full of hammocks hung up. Some people sleep on the boat itself, because there are no rooms left in town. Even Coca-Cola here has a blue can and a red can, so as not to upset anyone. It's madness, but organised madness, and the money that comes in during those days helps a lot of families get through the rest of the year." }
  - { es: "CARLA: E qual é a história que o Garantido vai contar este ano? Pode adiantar alguma coisa? RAIMUNDO: Ah, aí a senhora me desculpe, mas isso eu não posso dizer nem sob tortura. (risos) Só posso adiantar que tem a ver com os rios e com os povos que vivem neles. O boi sempre falou da floresta, dos indígenas, dos ribeirinhos. Para nós não é tema da moda; é a nossa vida. Se a floresta acabar, acaba o boi também.", en: "CARLA: And what story is Garantido going to tell this year? Can you give us a preview? RAIMUNDO: Ah, there you'll have to forgive me, but that I can't tell even under torture. (laughs) I can only reveal that it has to do with the rivers and the peoples who live on them. The boi has always talked about the forest, the Indigenous people, the river dwellers. For us it's not a fashionable topic; it's our life. If the forest ends, the boi ends too." }
  - { es: "CARLA: Para terminar, que conselho o senhor daria a um jovem que quisesse seguir os seus passos? RAIMUNDO: Que tenha paciência e humildade. Que aprenda com os mais velhos, mesmo que ache que já sabe tudo, e que não tenha medo de errar, porque errar faz parte. E, principalmente, que dê o sangue pelo que faz, porque o público sente quando uma alegoria foi feita com amor. Agora, se ele for Caprichoso, aí eu já não dou conselho nenhum. (risos) CARLA: Muito obrigada, seu Raimundo, e boa sorte no festival. RAIMUNDO: Obrigado a você. E venha ver, viu? Quem vem a Parintins uma vez sempre volta.", en: "CARLA: To finish, what advice would you give a young person who wanted to follow in your footsteps? RAIMUNDO: To be patient and humble. To learn from the older ones, even if they think they already know everything, and not to be afraid of making mistakes, because mistakes are part of it. And above all, to give their all for what they do, because the audience can tell when a float was made with love. Now, if they're Caprichoso, then I'm not giving them any advice at all. (laughs) CARLA: Thank you very much, Mr Raimundo, and good luck at the festival. RAIMUNDO: Thank you. And come and see it, OK? Anyone who comes to Parintins once always comes back." }
questions:
  - { q: "Quantas noites dura a apresentação dos bois no Bumbódromo?", options: ["Uma", "Duas", "Três", "Sete"], answer: 2, explain: "'Durante três noites, dois bois-bumbás (…) se apresentam no Bumbódromo.'" }
  - { q: "Como Raimundo descreve a relação entre os torcedores dos dois bois?", options: ["É rivalidade, não inimizade: o melhor amigo dele é Caprichoso", "São inimigos para sempre", "Ninguém se importa com a competição", "As famílias são proibidas de se misturar"], answer: 0, explain: "He lunches every Sunday with his Caprichoso best friend; they only stop talking during the festival." }
  - { q: "O que significa “pisei feio na bola” na história da cobra-grande?", options: ["Que ele jogou futebol", "Que ele cometeu um erro sério", "Que ele ganhou um prêmio", "Que ele machucou o pé"], answer: 1, explain: "Pisar na bola = to mess up. His serpent was too heavy to get through the door and had to be cut in half." }
  - { q: "Quando “caiu a ficha” para Raimundo?", options: ["Quando ganhou o primeiro festival", "Quando se mudou para Manaus", "Quando viu uma alegoria sua no carnaval do Rio e percebeu que o seu trabalho era arte de verdade", "Quando a mãe dele morreu"], answer: 2, explain: "Cair a ficha = for something to sink in. Seeing his float on the Rio parade avenue made him realise it was real art." }
  - { q: "Como Raimundo recusa, com educação, revelar o tema do ano?", options: ["Fica em silêncio", "Pede desculpas e faz uma piada (“nem sob tortura”), dando só uma pista", "Diz que não sabe", "Muda de assunto bruscamente"], answer: 1, explain: "A typical polite refusal: an apology (a senhora me desculpe), humour, and a small concession (tem a ver com os rios)." }
