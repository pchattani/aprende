id: a2.u09
title: Instrucciones
lessons:
  - id: a2.u09.l1
    title: Habla, come, escribe
    teach: [g.imperative-tu]
    vocab: [w.instruccion, w.paso, w.callarse, w.sentarse, w.tener-cuidado, w.cuidado, w.apagar, w.encender, w.recoger, w.prestar-atencion, w.ten-paciencia, w.hacer-la-cama]
    tip: "The tú command of a regular verb looks exactly like the él form: habla, come, escribe."
    sentences:
      - { es: "Habla más despacio, por favor.", en: "Speak more slowly, please.", grammar: [g.imperative-tu], vocab: [w.hablar, w.despacio] }
      - { es: "Escucha con atención las instrucciones.", en: "Listen carefully to the instructions.", grammar: [g.imperative-tu], vocab: [w.instruccion, w.escuchar] }
      - { es: "Sigue los pasos uno a uno.", en: "Follow the steps one by one.", grammar: [g.imperative-tu], vocab: [w.paso, w.seguir] }
      - { es: "Apaga la luz cuando salgas.", en: "Switch off the light when you leave.", grammar: [g.imperative-tu], vocab: [w.apagar, w.luz] }
      - { es: "Enciende la televisión, empieza el partido.", en: "Switch on the TV, the match is starting.", grammar: [g.imperative-tu], vocab: [w.encender, w.television, w.partido] }
      - { es: "Ten cuidado, el suelo está mojado.", en: "Be careful, the floor is wet.", grammar: [g.imperative-tu], vocab: [w.tener-cuidado, w.suelo, w.mojado], error: { wrong: "Tiene cuidado, el suelo está mojado.", explain: "The tú imperative of tener is irregular: ten.", grammar: g.imperative-tu } }
      - { es: "Haz la cama antes de salir.", en: "Make the bed before going out.", grammar: [g.imperative-tu], vocab: [w.hacer-la-cama, w.antes] }
      - { es: "Pon la mesa, que la cena está lista.", en: "Set the table, dinner is ready.", grammar: [g.imperative-tu], vocab: [w.poner-la-mesa, w.cena, w.listo] }
      - { es: "Ven aquí un momento.", en: "Come here a moment.", grammar: [g.imperative-tu], vocab: [w.venir, w.momento] }
      - { es: "Di la verdad, por favor.", en: "Tell the truth, please.", grammar: [g.imperative-tu], vocab: [w.decir, w.verdad.phr] }
      - { es: "Sal de la cocina, que está muy caliente.", en: "Get out of the kitchen, it's very hot.", grammar: [g.imperative-tu], vocab: [w.salir, w.cocina, w.caliente] }
      - { es: "Recoge tu habitación y luego juega.", en: "Tidy your room and then play.", grammar: [g.imperative-tu], vocab: [w.recoger, w.habitacion, w.jugar] }
      - { es: "Presta atención, esto es importante.", en: "Pay attention, this is important.", grammar: [g.imperative-tu], vocab: [w.prestar-atencion, w.importante] }
      - { es: "Siéntate y ten paciencia; el médico viene ahora.", en: "Sit down and be patient; the doctor is coming now.", grammar: [g.imperative-tu, g.imperative-pronouns], vocab: [w.sentarse, w.ten-paciencia, w.medico] }
      - { es: "Cállate, por favor, estoy hablando por teléfono.", en: "Be quiet, please, I'm on the phone.", grammar: [g.imperative-tu, g.imperative-pronouns], vocab: [w.callarse, w.telefono], note: "Cállate can sound rude; soften with por favor." }
      - { es: "Tú lees el manual.", en: "You read the manual.", grammar: [g.imperative-tu], vocab: [w.leer, w.manual], transform: { instruction: "Turn it into a tú command", answer: "Lee el manual.", alt: ["¡Lee el manual!"] } }
  - id: a2.u09.l2
    title: Hable, coma, venga
    teach: [g.imperative-usted]
    vocab: [w.boton, w.pulsar, w.tirar, w.empujar, w.manual, w.cuidado]
    tip: "Usted commands swap the vowel: hablar → hable, comer → coma, venir → venga."
    sentences:
      - { es: "Hable más alto, por favor, no le oigo.", en: "Speak louder, please, I can't hear you.", grammar: [g.imperative-usted], vocab: [w.hablar, w.alto, w.oir] }
      - { es: "Pulse el botón verde para empezar.", en: "Press the green button to start.", grammar: [g.imperative-usted], vocab: [w.pulsar, w.boton, w.verde] }
      - { es: "Tire de la puerta; no la empuje.", en: "Pull the door; don't push it.", grammar: [g.imperative-usted], vocab: [w.tirar, w.empujar, w.puerta] }
      - { es: "Siga todo recto y gire a la derecha en el semáforo.", en: "Go straight on and turn right at the traffic lights.", grammar: [g.imperative-usted], vocab: [w.seguir.dir, w.girar, w.semaforo] }
      - { es: "Espere un momento, por favor.", en: "Wait a moment, please.", grammar: [g.imperative-usted], vocab: [w.esperar, w.momento] }
      - { es: "Lea el manual antes de usar la máquina.", en: "Read the manual before using the machine.", grammar: [g.imperative-usted], vocab: [w.leer, w.manual, w.maquina] }
      - { es: "Tenga cuidado con la escalera.", en: "Be careful with the stairs.", grammar: [g.imperative-usted], vocab: [w.cuidado, w.escalera], error: { wrong: "Tiene cuidado con la escalera.", explain: "Usted commands come from the yo form: tengo → tenga.", grammar: g.imperative-usted } }
      - { es: "Venga a mi oficina a las diez.", en: "Come to my office at ten.", grammar: [g.imperative-usted], vocab: [w.venir, w.oficina] }
      - { es: "Pase, pase, y siéntese.", en: "Come in, come in, and sit down.", grammar: [g.imperative-usted, g.imperative-pronouns], vocab: [w.pasar, w.sentarse] }
      - { es: "Rellene este formulario y firme aquí.", en: "Fill in this form and sign here.", grammar: [g.imperative-usted], vocab: [w.aqui], note: "rellenar = to fill in; firmar = to sign." }
      - { es: "Pongan las maletas aquí, por favor.", en: "Put the suitcases here, please.", grammar: [g.imperative-usted], vocab: [w.poner, w.maleta] }
      - { es: "No se preocupe, no es grave.", en: "Don't worry, it isn't serious.", grammar: [g.imperative-usted], vocab: [w.preocuparse, w.grave] }
      - { es: "Abra la boca y diga «aaa».", en: "Open your mouth and say 'aaa'.", grammar: [g.imperative-usted], vocab: [w.abrir, w.boca, w.decir] }
      - { es: "Usted apaga el ordenador.", en: "You switch off the computer.", grammar: [g.imperative-usted], vocab: [w.apagar, w.ordenador], transform: { instruction: "Turn it into an usted command", answer: "Apague el ordenador.", alt: ["Apague el ordenador, por favor."] } }
  - id: a2.u09.l3
    title: Hablad, comed, venid
    teach: [g.imperative-vosotros]
    vocab: [w.fregar, w.barrer, w.sacar-la-basura, w.poner-la-mesa, w.lavadora, w.nevera, w.microondas]
    tip: "Vosotros: replace the -r of the infinitive with -d. hablar → hablad. Before os the d drops: sentaos."
    sentences:
      - { es: "Niños, recoged los juguetes.", en: "Children, pick up the toys.", grammar: [g.imperative-vosotros], vocab: [w.recoger, w.juguete] }
      - { es: "Fregad los platos después de cenar.", en: "Wash the dishes after dinner.", grammar: [g.imperative-vosotros], vocab: [w.fregar, w.plato, w.cenar] }
      - { es: "Barred el salón y sacad la basura.", en: "Sweep the living room and take out the rubbish.", grammar: [g.imperative-vosotros], vocab: [w.barrer, w.sacar-la-basura, w.salon] }
      - { es: "Poned la mesa, que ya llegan los abuelos.", en: "Set the table, the grandparents are arriving.", grammar: [g.imperative-vosotros], vocab: [w.poner-la-mesa, w.abuelo] }
      - { es: "Poned la ropa en la lavadora.", en: "Put the clothes in the washing machine.", grammar: [g.imperative-vosotros], vocab: [w.lavadora, w.ropa] }
      - { es: "Guardad la leche en la nevera.", en: "Put the milk in the fridge.", grammar: [g.imperative-vosotros], vocab: [w.guardar, w.nevera, w.leche] }
      - { es: "Calentad la sopa en el microondas dos minutos.", en: "Heat the soup in the microwave for two minutes.", grammar: [g.imperative-vosotros], vocab: [w.calentar, w.microondas, w.sopa] }
      - { es: "Venid a cenar, está todo en la mesa.", en: "Come and have dinner, everything's on the table.", grammar: [g.imperative-vosotros], vocab: [w.venir, w.cenar] }
      - { es: "Sentaos, por favor, vamos a empezar.", en: "Sit down, please, we're going to start.", grammar: [g.imperative-vosotros, g.imperative-pronouns], vocab: [w.sentarse, w.empezar], error: { wrong: "Sentados, por favor, vamos a empezar.", explain: "With os the -d disappears: sentad + os → sentaos.", grammar: g.imperative-vosotros } }
      - { es: "Levantaos, que son las ocho.", en: "Get up, it's eight o'clock.", grammar: [g.imperative-vosotros, g.imperative-pronouns], vocab: [w.levantarse] }
      - { es: "Callaos un momento y escuchad.", en: "Be quiet for a moment and listen.", grammar: [g.imperative-vosotros, g.imperative-pronouns], vocab: [w.callarse, w.escuchar] }
      - { es: "Tened cuidado con el cuchillo.", en: "Be careful with the knife.", grammar: [g.imperative-vosotros], vocab: [w.tener-cuidado, w.cuchillo] }
      - { es: "Id a la tienda y comprad pan.", en: "Go to the shop and buy bread.", grammar: [g.imperative-vosotros], vocab: [w.ir, w.comprar, w.pan] }
      - { es: "Vosotros apagáis las luces.", en: "You switch off the lights.", grammar: [g.imperative-vosotros], vocab: [w.apagar, w.luz], transform: { instruction: "Turn it into a vosotros command", answer: "Apagad las luces.", alt: ["¡Apagad las luces!"] } }
  - id: a2.u09.l4
    title: Una receta
    teach: [g.imperative-pronouns]
    vocab: [w.receta, w.ingrediente, w.cortar, w.mezclar, w.anadir, w.echar, w.calentar, w.freir, w.hervir, w.pelar, w.batir, w.servir, w.remover, w.sarten, w.olla, w.cuchillo, w.cuchara, w.tenedor, w.horno, w.ajo, w.pimienta, w.harina, w.mantequilla, w.limon, w.cucharada, w.pizca, w.trozo, w.a-fuego-lento]
    tip: "When a pronoun is attached to a command, keep the stress where it was and add a tilde: corta → córtalas, pon → ponlo (no tilde needed on a monosyllable)."
    sentences:
      - { es: "Primero, pela las patatas y córtalas en trozos pequeños.", en: "First, peel the potatoes and cut them into small pieces.", grammar: [g.imperative-pronouns], vocab: [w.pelar, w.cortar, w.trozo, w.patata] }
      - { es: "Calienta el aceite en una sartén y fríe las patatas a fuego lento.", en: "Heat the oil in a frying pan and fry the potatoes on a low heat.", grammar: [g.imperative-tu], vocab: [w.calentar, w.sarten, w.freir, w.a-fuego-lento, w.aceite] }
      - { es: "Bate seis huevos con una pizca de sal.", en: "Beat six eggs with a pinch of salt.", grammar: [g.imperative-tu], vocab: [w.batir, w.pizca, w.huevo, w.sal] }
      - { es: "Añade la cebolla y mézclalo todo bien.", en: "Add the onion and mix it all well.", grammar: [g.imperative-pronouns], vocab: [w.anadir, w.mezclar, w.cebolla] }
      - { es: "Echa dos cucharadas de harina y remueve.", en: "Pour in two tablespoons of flour and stir.", grammar: [g.imperative-tu], vocab: [w.echar, w.cucharada, w.harina, w.remover] }
      - { es: "Hierve el agua en una olla grande.", en: "Boil the water in a big pot.", grammar: [g.imperative-tu], vocab: [w.hervir, w.olla, w.agua] }
      - { es: "Pon un poco de mantequilla y un diente de ajo.", en: "Put in a bit of butter and a clove of garlic.", grammar: [g.imperative-tu], vocab: [w.mantequilla, w.ajo, w.poner] }
      - { es: "Sírvelo caliente con un poco de limón y pimienta.", en: "Serve it hot with a little lemon and pepper.", grammar: [g.imperative-pronouns], vocab: [w.servir, w.limon, w.pimienta] }
      - { es: "Mete la tarta en el horno cuarenta minutos.", en: "Put the cake in the oven for forty minutes.", grammar: [g.imperative-tu], vocab: [w.horno, w.tarta], note: "meter = to put in." }
      - { es: "Dame el cuchillo, por favor. — Tómalo.", en: "Give me the knife, please. — Take it.", grammar: [g.imperative-pronouns], vocab: [w.dar, w.cuchillo, w.tomar] }
      - { es: "¿Los ingredientes? Cómpralos en el mercado, son más frescos.", en: "The ingredients? Buy them at the market, they're fresher.", grammar: [g.imperative-pronouns], vocab: [w.ingrediente, w.comprar, w.mercado] }
      - { es: "Pásame una cuchara y un tenedor.", en: "Pass me a spoon and a fork.", grammar: [g.imperative-pronouns], vocab: [w.cuchara, w.tenedor, w.pasar] }
      - { es: "Esta receta es muy fácil: solo tiene cinco pasos.", en: "This recipe is very easy: it only has five steps.", grammar: [g.ser-vs-estar-basics], vocab: [w.receta, w.facil, w.paso] }
      - { es: "Dímelo otra vez, no te he oído.", en: "Tell me again, I didn't hear you.", grammar: [g.imperative-pronouns, g.double-object-pronouns], vocab: [w.decir, w.oir], error: { wrong: "Dimelo otra vez, no te he oído.", explain: "Two pronouns attached move the stress three syllables from the end: dímelo needs a tilde.", grammar: g.imperative-pronouns } }
      - { es: "Corta el tomate.", en: "Cut the tomato.", grammar: [g.imperative-pronouns], vocab: [w.cortar, w.tomate], transform: { instruction: "Replace 'el tomate' with a pronoun", answer: "Córtalo.", alt: ["¡Córtalo!"] } }
dialogues:
  - id: a2.u09.d1
    title: Tortilla de patatas por teléfono
    context: Jorge calls his grandmother because he wants to make a Spanish omelette for the first time.
    lines:
      - { speaker: Jorge, es: "Abuela, quiero hacer una tortilla de patatas. ¿Me dices cómo?", en: "Grandma, I want to make a Spanish omelette. Will you tell me how?" }
      - { speaker: Abuela, es: "Claro, hijo. Primero pela cuatro patatas y córtalas en trozos finos.", en: "Of course, dear. First peel four potatoes and cut them into thin pieces." }
      - { speaker: Jorge, es: "Vale. ¿Y la cebolla?", en: "OK. And the onion?" }
      - { speaker: Abuela, es: "Córtala también. Calienta bastante aceite en la sartén y fríe las patatas con la cebolla a fuego lento, unos veinte minutos.", en: "Cut it too. Heat plenty of oil in the pan and fry the potatoes with the onion on a low heat, about twenty minutes." }
      - { speaker: Jorge, es: "Mientras tanto, ¿bato los huevos?", en: "Meanwhile, do I beat the eggs?" }
      - { speaker: Abuela, es: "Sí, bate cinco huevos con una pizca de sal. Luego saca las patatas, mézclalas con el huevo y échalo todo en la sartén.", en: "Yes, beat five eggs with a pinch of salt. Then take out the potatoes, mix them with the egg and pour it all into the pan." }
      - { speaker: Jorge, es: "¿Y cómo le doy la vuelta?", en: "And how do I flip it?" }
      - { speaker: Abuela, es: "Con un plato. Pon el plato encima, dale la vuelta con cuidado y vuelve a ponerla en la sartén dos minutos.", en: "With a plate. Put the plate on top, flip it carefully and put it back in the pan for two minutes." }
      - { speaker: Jorge, es: "¡Ten paciencia conmigo, abuela! Te mando una foto cuando termine.", en: "Be patient with me, grandma! I'll send you a photo when I finish." }
