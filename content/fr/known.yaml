# Words treated as known at every level (function words), and proper nouns / place names
# that may appear in any text. Used by the content checker and the journey test.
# Elided forms are listed both with and without the apostrophe, so either tokenisation works.
# Entries in `always` and `facts` are lowercase.
always: [
  # articles, partitives and contractions
  le, la, les, l, "l'", un, une, des, du, de, d, "d'", au, aux,
  # prepositions
  à, en, dans, sur, sous, avec, sans, pour, par, chez, entre, vers, contre,
  # subject, object and stressed pronouns
  je, j, "j'", tu, il, elle, on, nous, vous, ils, elles,
  me, m, "m'", te, t, "t'", se, s, "s'", lui, leur, y,
  moi, toi, soi, eux, ce, c, "c'", ça, cela, ceci,
  # relatives and question words
  qui, que, qu, "qu'", quoi, où, quand, comment, pourquoi, combien, quel, quelle, quels, quelles,
  # être / avoir / c'est / il y a
  suis, es, est, sommes, êtes, sont, ai, as, a, avons, avez, ont, "c'est", "n'est", "qu'il", "qu'elle", "s'il",
  # negation, yes/no
  ne, n, "n'", pas, non, oui, si,
  # conjunctions and common adverbs
  et, ou, mais, donc, car, ni, comme, puis, aussi, très, bien, plus, moins, ici, là, déjà, encore,
  jusqu, "jusqu'", lorsqu, "lorsqu'", puisqu, "puisqu'", quelqu, "quelqu'",
  # determiners and possessives
  mon, ma, mes, ton, ta, tes, son, sa, ses, notre, nos, votre, vos, leurs,
  cet, cette, ces, tout, toute, tous, toutes,
  ]
