id: a2.u01
title: 你食咗飯未呀？
lessons:
  - id: a2.u01.l1
    title: 我食咗飯喇
    teach: [g.zo-perfective]
    tip: "咗 goes straight after the verb: 食咗飯, 洗咗衫, 搬咗屋."
    vocab: [w.zo2.b, w.jyun4.b, w.zou6-jyun4, w.sik6-jyun4, w.sik6-baau2, w.bun1-uk1, w.bun1, w.sai2-saam1, w.zap1-uk1, w.bou1, w.jim4, w.jau4.b, w.si6-jau4, w.cou3, w.hoi2-pong4]
    sentences:
      - { es: "我食咗飯喇。", en: "I've eaten.", altEs: ["我食咗喇。", "食咗喇。", "我食咗飯。"], altEn: ["I have eaten.", "I ate."], grammar: [g.zo-perfective], vocab: [w.zo2.b] }
      - { es: "我今朝飲咗兩杯咖啡。", en: "I had two cups of coffee this morning.", altEs: ["今朝我飲咗兩杯咖啡。"], altEn: ["I've had two cups of coffee this morning."], grammar: [g.zo-perfective], vocab: [w.zo2.b], transform: { instruction: "Change to 'she'", answer: "佢今朝飲咗兩杯咖啡。", alt: ["今朝佢飲咗兩杯咖啡。"], en: "She had two cups of coffee this morning." } }
      - { es: "佢哋上個月搬咗屋。", en: "They moved house last month.", altEs: ["上個月佢哋搬咗屋。"], grammar: [g.zo-perfective], vocab: [w.bun1-uk1], transform: { instruction: "Say it happened last week instead", answer: "佢哋上個禮拜搬咗屋。", alt: ["上個禮拜佢哋搬咗屋。", "佢哋上個星期搬咗屋。"], en: "They moved house last week." } }
      - { es: "我哋搬咗去尖沙咀，好近海旁。", en: "We've moved to Tsim Sha Tsui, very close to the waterfront.", altEs: ["我哋搬咗嚟尖沙咀，好近海旁。"], altEn: ["We moved to Tsim Sha Tsui, very near the waterfront."], grammar: [g.zo-perfective], vocab: [w.bun1, w.hoi2-pong4] }
      - { es: "我做完功課喇。", en: "I've finished my homework.", altEs: ["我做完咗功課喇。", "功課我做完喇。", "我做完功課。"], altEn: ["I've done my homework."], grammar: [g.zo-perfective], vocab: [w.zou6-jyun4, w.jyun4.b] }
      - { es: "你食咗飯先走啦。", en: "Have something to eat before you go.", altEs: ["你食完飯先走啦。", "食咗飯先走啦。"], altEn: ["Eat before you leave."], grammar: [g.zo-perfective, g.sin-zoi-sequence], vocab: [w.zo2.b], note: "咗 can look ahead: once you've eaten, then go." }
      - { es: "我洗咗衫，仲執咗屋。", en: "I've done the laundry and tidied the flat too.", altEs: ["我洗咗衫，又執咗屋。", "我洗咗衫同埋執咗屋。"], altEn: ["I did the laundry and also tidied the flat."], grammar: [g.zo-perfective], vocab: [w.sai2-saam1, w.zap1-uk1] }
      - { es: "阿媽煲咗湯，你飲啲啦。", en: "Mum has made soup, have some.", altEs: ["媽媽煲咗湯，你飲啲啦。", "阿媽煲咗湯，飲啲啦。"], altEn: ["Mum made soup, have some."], grammar: [g.zo-perfective, g.particles-aa-laa], vocab: [w.bou1] }
      - { es: "我落咗少少鹽同豉油。", en: "I've put in a little salt and soy sauce.", altEs: ["我落咗少少豉油同鹽。", "我落咗一啲鹽同豉油。"], altEn: ["I added a little salt and soy sauce."], grammar: [g.zo-perfective], vocab: [w.jim4, w.si6-jau4] }
      - { es: "你落咗醋呀？好酸呀！", en: "You've put vinegar in? It's so sour!", altEs: ["你落咗醋？好酸呀！", "你落咗醋呀？好酸！"], altEn: ["Did you put vinegar in? It's really sour!"], grammar: [g.zo-perfective], vocab: [w.cou3] }
      - { es: "佢落咗好多油，啲菜好油膩。", en: "He put in lots of oil; the vegetables are really greasy.", altEs: ["佢落咗好多油，啲青菜好油膩。"], altEn: ["She put in a lot of oil, so the greens are very oily."], grammar: [g.zo-perfective], vocab: [w.jau4.b] }
      - { es: "唔使喇，我食飽咗喇。", en: "No more for me, I'm full.", altEs: ["唔使喇，我食飽喇。", "唔使喇，食飽咗喇。"], altEn: ["No need, I'm full."], grammar: [g.zo-perfective], vocab: [w.sik6-baau2] }
      - { es: "天星小輪走咗喇，我哋等下一班啦。", en: "The Star Ferry has left; let's wait for the next one.", altEs: ["天星小輪走咗喇，等下一班啦。"], altEn: ["The Star Ferry's gone, let's wait for the next one."], grammar: [g.zo-perfective, g.particles-aa-laa], vocab: [w.zo2.b] }
      - { es: "佢食完飯就走咗。", en: "She left right after eating.", altEs: ["佢食完飯就走咗喇。"], altEn: ["He left as soon as he'd eaten."], grammar: [g.zo-perfective], vocab: [w.sik6-jyun4] }
      - { es: "我買咗兩本書。", en: "I bought two books.", altEs: ["我買咗兩本書喇。"], altEn: ["I've bought two books."], grammar: [g.zo-perfective, g.common-classifiers], vocab: [w.zo2.b], error: { wrong: "我買兩本書咗。", explain: "咗 goes straight after the verb, not at the end: 買咗兩本書.", grammar: g.zo-perfective } }
      - { es: "我以前住喺尖沙咀。", en: "I used to live in Tsim Sha Tsui.", altEs: ["以前我住喺尖沙咀。"], altEn: ["I lived in Tsim Sha Tsui before."], grammar: [g.zo-perfective], vocab: [], error: { wrong: "我以前住咗喺尖沙咀。", explain: "A past state or habit takes no 咗; 咗 marks one completed event.", grammar: g.zo-perfective } }
    exchanges:
      - q: { es: "你食咗乜嘢呀？", en: "What did you eat?" }
        a: { es: "我食咗碗雲吞麵。", en: "I had a bowl of wonton noodles." }
        alt: ["食咗碗雲吞麵。", "我食咗碟炒飯。", "我食咗個菠蘿包。"]
        grammar: [g.zo-perfective]
        vocab: [w.zo2.b]
      - q: { es: "你哋搬咗屋呀？", en: "You've moved house?" }
        a: { es: "係呀，上個月搬咗去尖沙咀。", en: "Yes, we moved to Tsim Sha Tsui last month." }
        alt: ["係呀，搬咗去尖沙咀。", "係呀，上個月搬咗。"]
        grammar: [g.zo-perfective]
        vocab: [w.bun1-uk1, w.bun1]
      - q: { es: "你做完功課喇？", en: "You've finished your homework?" }
        a: { es: "做完喇，好易咋。", en: "Yes, it was really easy." }
        alt: ["做完喇。", "做完咗喇。"]
        grammar: [g.zo-perfective]
        vocab: [w.zou6-jyun4]
      - q: { es: "個湯點呀？", en: "How's the soup?" }
        a: { es: "好好飲，不過你落咗好多鹽。", en: "Really good, but you've put a lot of salt in." }
        alt: ["好好飲。", "有啲鹹，你落咗好多鹽。"]
        grammar: [g.zo-perfective]
        vocab: [w.jim4, w.bou1]
      - q: { es: "佢喺邊呀？", en: "Where is she?" }
        a: { es: "佢去咗碼頭搭船。", en: "She's gone to the pier to catch the ferry." }
        alt: ["佢去咗碼頭。", "佢去咗海旁。"]
        grammar: [g.zo-perfective]
        vocab: [w.zo2.b, w.hoi2-pong4]
    texts:
      - title: "短訊：新屋"
        es: ["我哋搬咗屋喇！", "新屋喺尖沙咀，好近海旁。", "我今日執咗屋，仲煲咗湯。"]
        en: ["We've moved house!", "The new flat is in Tsim Sha Tsui, very close to the waterfront.", "Today I tidied the flat and made soup too."]
        grammar: [g.zo-perfective]
        vocab: [w.bun1-uk1, w.zap1-uk1, w.bou1, w.hoi2-pong4]
      - title: "晚飯"
        es: ["阿爸煮咗飯，阿媽煲咗湯。", "我落咗少少豉油同醋。", "大家都食飽咗。"]
        en: ["Dad cooked dinner and Mum made soup.", "I put in a little soy sauce and vinegar.", "Everyone ate their fill."]
        grammar: [g.zo-perfective]
        vocab: [w.bou1, w.si6-jau4, w.cou3, w.sik6-baau2]
    spicy:
      - { es: "我今日換咗三次衫，因為要見你。", en: "I changed my clothes three times today because I'm seeing you.", altEs: ["因為要見你，我今日換咗三次衫。"], grammar: [g.zo-perfective], vocab: [w.zo2.b] }
      - { es: "你食咗我個蛋撻？咁你要請我食飯。", en: "You ate my egg tart? Then you have to take me to dinner.", altEs: ["你食咗我嘅蛋撻？咁你要請我食飯。"], grammar: [g.zo-perfective], vocab: [w.zo2.b] }
      - { es: "你執咗屋？係咪有人嚟探你呀？", en: "You've tidied the flat? Is someone coming to visit you?", altEs: ["你執咗屋呀？係唔係有人嚟探你呀？"], grammar: [g.zo-perfective], vocab: [w.zap1-uk1] }
      - { es: "我食飽咗，不過仲有位畀甜品同你。", en: "I'm full, but I've still got room for dessert and for you.", altEs: ["我食飽咗喇，不過仲有位畀甜品同你。"], grammar: [g.zo-perfective], vocab: [w.sik6-baau2] }
      - { es: "我煲咗湯，你今晚嚟唔嚟飲呀？", en: "I've made soup; are you coming over to have some tonight?", altEs: ["我煲咗湯，你今晚嚟飲啦。"], grammar: [g.zo-perfective, g.a-not-a-questions], vocab: [w.bou1] }

  - id: a2.u01.l2
    title: 你到咗未呀？
    teach: [g.mei-questions]
    tip: "Ask 'V咗…未呀？'; say yes with V咗喇 and no with 未呀 or 仲未."
    vocab: [w.mei6, w.zung6-mei6, w.gei3, w.seon3, w.fung1.b, w.jau4-guk2, w.gaau1, w.jyun4-sing4, w.zung1-jyu1, w.jat1-zan6-gaan1, w.gam1-ci3]
    sentences:
      - { es: "你食咗飯未呀？", en: "Have you eaten yet?", altEs: ["你食咗飯未？", "食咗飯未呀？"], altEn: ["Have you had your meal yet?"], grammar: [g.mei-questions], vocab: [w.mei6], note: "Also an everyday greeting, like 'how are you?'" }
      - { es: "仲未，你呢？", en: "Not yet, and you?", altEs: ["未呀，你呢？", "仲未食，你呢？"], altEn: ["Not yet. What about you?"], grammar: [g.mei-questions, g.ne-follow-up], vocab: [w.zung6-mei6] }
      - { es: "你到咗未呀？", en: "Have you arrived yet?", altEs: ["你到咗未？", "到咗未呀？"], altEn: ["Are you there yet?"], grammar: [g.mei-questions], vocab: [w.mei6] }
      - { es: "我仲未到，就快喇。", jp: "ngo5 zung6 mei6 dou3 zau6 faai3 laa3", en: "I'm not there yet, almost.", altEs: ["仲未到，就快喇。", "我未到，就快喇。"], altEn: ["I haven't arrived yet, nearly there."], grammar: [g.mei-questions], vocab: [w.zung6-mei6] }
      - { es: "佢哋到咗喇。", jp: "keoi5 dei6 dou3 zo2 laa3", en: "They've arrived.", altEs: ["佢哋到咗。"], altEn: ["They're here."], grammar: [g.zo-perfective], vocab: [], transform: { instruction: "Ask whether they have arrived yet", answer: "佢哋到咗未呀？", alt: ["佢哋到咗未？"], en: "Have they arrived yet?" } }
      - { es: "你寄咗封信未呀？", en: "Have you sent the letter yet?", altEs: ["封信你寄咗未呀？", "你寄咗封信未？"], grammar: [g.mei-questions, g.classifier-as-the], vocab: [w.gei3, w.seon3, w.fung1.b] }
      - { es: "我仲未寄，郵局閂咗門。", en: "I haven't sent it yet; the post office has closed.", altEs: ["我未寄，郵局閂咗門。", "仲未寄，郵局閂咗門。"], grammar: [g.mei-questions, g.zo-perfective], vocab: [w.jau4-guk2, w.zung6-mei6] }
      - { es: "你交咗功課未呀？", en: "Have you handed in your homework yet?", altEs: ["你交咗功課未？", "功課你交咗未呀？"], grammar: [g.mei-questions], vocab: [w.gaau1], transform: { instruction: "Answer 'yes, I have'", answer: "交咗喇。", alt: ["我交咗喇。", "已經交咗喇。"], en: "Yes, I've handed it in." } }
      - { es: "佢仲未起身。", en: "He still hasn't got up.", altEs: ["佢未起身。"], altEn: ["She still hasn't got up.", "He isn't up yet."], grammar: [g.mei-questions], vocab: [w.zung6-mei6], error: { wrong: "佢仲未起咗身。", explain: "No 咗 after 未: 仲未起身.", grammar: g.mei-questions } }
      - { es: "我未食早餐。", en: "I haven't had breakfast yet.", altEs: ["我仲未食早餐。"], grammar: [g.mei-questions], vocab: [w.mei6], error: { wrong: "我未食咗早餐。", explain: "未 + verb takes no 咗: 我未食.", grammar: g.mei-questions } }
      - { es: "個計劃完成咗未呀？", en: "Has the project been finished yet?", altEs: ["個計劃完成咗未？"], altEn: ["Is the plan finished yet?"], grammar: [g.mei-questions], vocab: [w.jyun4-sing4] }
      - { es: "終於到咗喇！", jp: "zung1 jyu1 dou3 zo2 laa3", en: "We're finally here!", altEs: ["終於到喇！"], altEn: ["Finally arrived!"], grammar: [g.zo-perfective], vocab: [w.zung1-jyu1] }
      - { es: "我仲未食完，一陣間打畀你。", jp: "ngo5 zung6 mei6 sik6 jyun4 jat1 zan6 gaan1 daa2 bei2 nei5", en: "I haven't finished eating yet; I'll call you in a bit.", altEs: ["我未食完，一陣間打畀你。", "我仲未食完，一陣間再打畀你。"], grammar: [g.mei-questions], vocab: [w.jat1-zan6-gaan1, w.sik6-jyun4] }
      - { es: "今次你買咗飛未呀？", en: "Have you bought the tickets this time?", altEs: ["你今次買咗飛未呀？", "今次買咗飛未呀？"], grammar: [g.mei-questions], vocab: [w.gam1-ci3] }
      - { es: "天星小輪嚟咗未呀？", en: "Has the Star Ferry come yet?", altEs: ["天星小輪嚟咗未？", "小輪嚟咗未呀？"], grammar: [g.mei-questions], vocab: [w.mei6], transform: { instruction: "Answer 'not yet'", answer: "仲未嚟。", alt: ["未呀。", "仲未。", "未嚟。"], en: "Not yet." } }
      - { es: "你去咗星光大道未呀？", en: "Have you been to the Avenue of Stars yet?", altEs: ["你去咗星光大道未？"], grammar: [g.mei-questions], vocab: [w.mei6] }
    exchanges:
      - q: { es: "你食咗飯未呀？", en: "Have you eaten yet?" }
        a: { es: "食咗喇，你呢？", en: "Yes, I have. And you?" }
        alt: ["未呀，一齊去食啦。", "仲未。", "食咗喇。"]
        grammar: [g.mei-questions]
        vocab: [w.mei6]
      - q: { es: "你寄咗封信未呀？", en: "Have you sent the letter yet?" }
        a: { es: "仲未，郵局閂咗門。", en: "Not yet, the post office has closed." }
        alt: ["寄咗喇。", "未呀，聽日寄。"]
        grammar: [g.mei-questions]
        vocab: [w.gei3, w.seon3, w.jau4-guk2]
      - q: { es: "佢到咗未呀？", en: "Has she arrived yet?" }
        a: { es: "未呀，佢話就快到。", en: "Not yet, she says she's nearly here." }
        alt: ["到咗喇。", "仲未。"]
        grammar: [g.mei-questions]
        vocab: [w.mei6]
      - q: { es: "你交咗錢未呀？", en: "Have you paid yet?" }
        a: { es: "交咗喇，上個禮拜交咗。", en: "Yes, I paid last week." }
        alt: ["未呀，我聽日交。", "交咗喇。"]
        grammar: [g.mei-questions, g.zo-perfective]
        vocab: [w.gaau1]
      - q: { es: "你睇完嗰本書未呀？", en: "Have you finished that book yet?" }
        a: { es: "終於睇完喇！", en: "I've finally finished it!" }
        alt: ["仲未睇完。", "睇完喇。"]
        grammar: [g.mei-questions]
        vocab: [w.zung1-jyu1, w.jyun4.b]
    texts:
      - title: "短訊：喺鐘樓"
        es: ["你到咗未呀？", "我喺鐘樓等你。", "天星小輪仲未嚟，唔使急。"]
        en: ["Are you here yet?", "I'm waiting for you at the Clock Tower.", "The Star Ferry hasn't come yet, no need to rush."]
        grammar: [g.mei-questions]
        vocab: [w.mei6, w.zung6-mei6]
      - title: "畀阿媽嘅留言"
        es: ["阿媽，我寄咗封信喇。", "不過我仲未買餸。", "我一陣間返嚟。"]
        en: ["Mum, I've sent the letter.", "But I haven't bought the groceries yet.", "I'll be back in a bit."]
        grammar: [g.mei-questions, g.zo-perfective]
        vocab: [w.gei3, w.seon3, w.jat1-zan6-gaan1]
    spicy:
      - { es: "你食咗飯未呀？未呀？咁我請你。", en: "Have you eaten yet? No? Then I'm treating you.", altEs: ["你食咗飯未？未呀？咁我請你啦。"], grammar: [g.mei-questions], vocab: [w.mei6] }
      - { es: "你仲未覆我，我等咗好耐喇。", en: "You still haven't replied to me; I've been waiting ages.", altEs: ["你仲未覆我呀，我等咗好耐喇。"], grammar: [g.mei-questions], vocab: [w.zung6-mei6] }
      - { es: "我寫咗封信畀你，仲未寄，因為好怕醜。", en: "I've written you a letter but haven't sent it yet, because I'm too shy.", altEs: ["我寫咗封信畀你，不過仲未寄，因為好怕醜。"], grammar: [g.mei-questions, g.zo-perfective], vocab: [w.seon3, w.gei3] }
      - { es: "你結咗婚未呀？未？好，我問完喇。", en: "Are you married yet? No? Good, that's all my questions.", altEs: ["你結咗婚未？未呀？好，我問完喇。"], grammar: [g.mei-questions], vocab: [w.mei6] }
      - { es: "終於見到你喇！我等咗成個禮拜。", en: "Finally I get to see you! I've waited the whole week.", altEs: ["終於見到你！我等咗成個禮拜。"], grammar: [g.zo-perfective], vocab: [w.zung1-jyu1] }

  - id: a2.u01.l3
    title: 我尋晚冇出街
    teach: [g.mou-past-negation]
    tip: "Didn't = 冇 + verb, with no 咗. Ask 有冇 + verb? and answer 有 or 冇."
    vocab: [w.mou5.b, w.jau5.b, w.cam4-maan5, w.cin4-maan5, w.soeng6-go3-lai5-baai3, w.soeng6-ci3, w.haa6-ci3, w.lok6-tong4, w.sau1-gung1, w.naau6-zung1, w.hou2-noi6, w.si3-gwo3]
    sentences:
      - { es: "我尋日冇返工。", en: "I didn't go to work yesterday.", altEs: ["尋日我冇返工。"], grammar: [g.mou-past-negation], vocab: [w.mou5.b] }
      - { es: "你有冇食早餐呀？", en: "Did you have breakfast?", altEs: ["你有冇食早餐？", "有冇食早餐呀？"], altEn: ["Have you had breakfast?"], grammar: [g.mou-past-negation], vocab: [w.mou5.b], transform: { instruction: "Answer 'no, I didn't'", answer: "冇呀，我冇食。", alt: ["冇。", "冇食。", "冇呀。"], en: "No, I didn't." } }
      - { es: "有呀，我食咗個菠蘿包。", en: "Yes, I had a pineapple bun.", altEs: ["有，我食咗個菠蘿包。"], grammar: [g.mou-past-negation, g.zo-perfective], vocab: [w.jau5.b] }
      - { es: "我尋晚冇出街，喺屋企睇電視。", en: "I didn't go out last night; I watched TV at home.", altEs: ["尋晚我冇出街，喺屋企睇電視。"], altEn: ["I stayed in last night and watched TV at home."], grammar: [g.mou-past-negation], vocab: [w.cam4-maan5] }
      - { es: "個鬧鐘冇響，所以我遲到。", en: "The alarm clock didn't go off, so I was late.", altEs: ["個鬧鐘冇響，所以我遲到咗。"], altEn: ["My alarm didn't ring, so I was late."], grammar: [g.mou-past-negation, g.classifier-as-the], vocab: [w.naau6-zung1] }
      - { es: "我上個禮拜冇去健身。", en: "I didn't go to the gym last week.", altEs: ["上個禮拜我冇去健身。", "我上個星期冇去健身。"], grammar: [g.mou-past-negation], vocab: [w.soeng6-go3-lai5-baai3], error: { wrong: "我上個禮拜冇去咗健身。", explain: "Drop 咗 in the negative: 冇 + verb.", grammar: g.mou-past-negation } }
      - { es: "佢前晚冇覆我。", en: "She didn't reply to me the night before last.", altEs: ["前晚佢冇覆我。"], altEn: ["He didn't get back to me the night before last."], grammar: [g.mou-past-negation], vocab: [w.cin4-maan5], transform: { instruction: "Ask 'did she reply to you?'", answer: "佢有冇覆你呀？", alt: ["佢有冇覆你？", "佢前晚有冇覆你呀？"], en: "Did she reply to you?" } }
      - { es: "佢今朝食咗藥。", en: "She took her medicine this morning.", altEs: ["今朝佢食咗藥。"], grammar: [g.zo-perfective], vocab: [], transform: { instruction: "Make it negative", answer: "佢今朝冇食藥。", alt: ["今朝佢冇食藥。"], en: "She didn't take her medicine this morning." } }
      - { es: "上次我冇帶遮，成身都濕咗。", en: "Last time I didn't bring an umbrella and got completely wet.", altEs: ["上次我冇帶遮，全身濕咗。"], altEn: ["Last time I forgot my umbrella and got soaked."], grammar: [g.mou-past-negation], vocab: [w.soeng6-ci3] }
      - { es: "下次早啲嚟啦。", en: "Come a bit earlier next time.", altEs: ["下次早啲嚟。", "你下次早啲嚟啦。"], grammar: [g.particles-aa-laa], vocab: [w.haa6-ci3] }
      - { es: "我哋五點落堂，你幾點收工呀？", en: "We finish class at five; what time do you finish work?", altEs: ["我哋五點落堂，你幾點收工？"], grammar: [g.clock-time, g.question-words], vocab: [w.lok6-tong4, w.sau1-gung1] }
      - { es: "我今日收咗工，但係冇去飲嘢。", en: "I finished work today, but I didn't go for a drink.", altEs: ["我今日收咗工，不過冇去飲嘢。"], grammar: [g.mou-past-negation, g.zo-perfective], vocab: [w.sau1-gung1] }
      - { es: "我好耐冇去尖沙咀喇。", en: "I haven't been to Tsim Sha Tsui for ages.", altEs: ["我好耐冇去過尖沙咀喇。"], altEn: ["It's been a long time since I went to Tsim Sha Tsui."], grammar: [g.mou-past-negation], vocab: [w.hou2-noi6], note: "好耐冇 + verb: haven't done it for a long time." }
      - { es: "呢間餐廳我試過，麻麻哋。", jp: "ni1 gaan1 caan1 teng1 ngo5 si3 gwo3 maa4 maa4 dei2", en: "I've tried this restaurant; it's so-so.", altEs: ["我試過呢間餐廳，麻麻哋。"], grammar: [g.gwo-experiential], vocab: [w.si3-gwo3] }
      - { es: "我冇講，係佢講㗎。", en: "I didn't say it, she did.", altEs: ["我冇講呀，係佢講㗎。"], altEn: ["It wasn't me who said it, it was him."], grammar: [g.mou-past-negation], vocab: [w.mou5.b] }
    exchanges:
      - q: { es: "你尋日有冇返工呀？", en: "Did you go to work yesterday?" }
        a: { es: "冇呀，我請咗假。", en: "No, I took the day off." }
        alt: ["有呀。", "冇，我病咗。"]
        grammar: [g.mou-past-negation]
        vocab: [w.mou5.b]
      - q: { es: "你有冇食早餐呀？", en: "Did you have breakfast?" }
        a: { es: "冇呀，冇時間。", en: "No, there wasn't time." }
        alt: ["有，食咗個菠蘿包。", "冇。"]
        grammar: [g.mou-past-negation]
        vocab: [w.mou5.b, w.jau5.b]
      - q: { es: "點解你遲到呀？", en: "Why were you late?" }
        a: { es: "個鬧鐘冇響。", en: "The alarm clock didn't go off." }
        alt: ["塞車呀。", "我個鬧鐘冇響呀。"]
        grammar: [g.mou-past-negation]
        vocab: [w.naau6-zung1]
      - q: { es: "你上個禮拜有冇去行山呀？", en: "Did you go hiking last week?" }
        a: { es: "冇呀，成個禮拜都落雨。", en: "No, it rained the whole week." }
        alt: ["有，去咗太平山。", "冇呀。"]
        grammar: [g.mou-past-negation]
        vocab: [w.soeng6-go3-lai5-baai3]
      - q: { es: "你今日幾點收工呀？", en: "What time do you finish work today?" }
        a: { es: "六點收工，你呢？", en: "Six. And you?" }
        alt: ["七點。", "我六點收工。"]
        grammar: [g.clock-time]
        vocab: [w.sau1-gung1]
    texts:
      - title: "日記"
        es: ["尋晚我冇出街。", "我冇食晚飯，淨係食咗個麵包。", "今朝個鬧鐘又冇響！"]
        en: ["I didn't go out last night.", "I didn't have dinner; I only ate a bread roll.", "This morning the alarm clock didn't go off again!"]
        grammar: [g.mou-past-negation]
        vocab: [w.cam4-maan5, w.naau6-zung1]
      - title: "畀老細嘅短訊"
        es: ["老細，唔好意思。", "我尋晚發燒，冇瞓覺。", "今日想請一日病假。"]
        en: ["Boss, I'm sorry.", "I had a fever last night and didn't sleep.", "I'd like to take a sick day today."]
        grammar: [g.mou-past-negation]
        vocab: [w.cam4-maan5, w.mou5.b]
    spicy:
      - { es: "你尋晚冇打畀我，我成晚都冇瞓。", en: "You didn't call me last night, so I didn't sleep all night.", altEs: ["你尋晚冇打畀我，搞到我成晚冇瞓。"], grammar: [g.mou-past-negation], vocab: [w.cam4-maan5] }
      - { es: "我冇遲到，係你早到咗。", jp: "ngo5 mou5 ci4 dou3 hai6 nei5 zou2 dou3 zo2", en: "I'm not late; you're early.", altEs: ["我冇遲到呀，係你早到咗。"], grammar: [g.mou-past-negation], vocab: [w.mou5.b] }
      - { es: "上次我冇問你個電話號碼，今次唔會唔記得喇。", en: "Last time I didn't ask for your number; this time I won't forget.", altEs: ["上次我冇問你電話號碼，今次唔會唔記得喇。"], grammar: [g.mou-past-negation], vocab: [w.soeng6-ci3, w.gam1-ci3] }
      - { es: "我哋好耐冇見，你靚咗好多。", en: "We haven't seen each other for ages; you've got so much better-looking.", altEs: ["好耐冇見，你靚咗好多。"], grammar: [g.mou-past-negation, g.zo-perfective], vocab: [w.hou2-noi6] }
      - { es: "你有冇掛住我呀？有？我都有。", en: "Did you miss me? You did? Me too.", altEs: ["你有冇掛住我？有呀？我都有。"], grammar: [g.mou-past-negation], vocab: [w.jau5.b] }

  - id: a2.u01.l4
    title: 已經夜喇
    teach: [g.ji-ging-already]
    tip: "已經 goes before the verb and usually comes with 咗 and 喇: 我已經食咗喇."
    vocab: [w.ngaam1-ngaam1, w.tau4-sin1, w.ngaam1.b, w.hoi1-ci2, w.ting4, w.kyut3-ding6, w.sik1.b, w.dang1, w.zaan2]
    sentences:
      - { es: "我已經食咗飯喇。", en: "I've already eaten.", altEs: ["我已經食咗喇。", "已經食咗喇。"], altEn: ["I've eaten already."], grammar: [g.ji-ging-already], vocab: [], error: { wrong: "我食咗飯已經喇。", explain: "已經 goes before the verb: 已經食咗飯.", grammar: g.ji-ging-already } }
      - { es: "已經十點喇，我哋走啦。", en: "It's already ten o'clock, let's go.", altEs: ["已經十點喇，走啦。"], grammar: [g.ji-ging-already, g.clock-time], vocab: [] }
      - { es: "我啱啱到尖沙咀，你喺邊呀？", jp: "ngo5 ngaam1 ngaam1 dou3 zim1 saa1 zeoi2 nei5 hai2 bin1 aa3", en: "I've just got to Tsim Sha Tsui; where are you?", altEs: ["我啱到尖沙咀，你喺邊呀？", "我啱啱到尖沙咀，你喺邊度呀？"], grammar: [g.ji-ging-already], vocab: [w.ngaam1-ngaam1, w.ngaam1.b] }
      - { es: "佢頭先打咗畀你。", en: "She called you just now.", altEs: ["頭先佢打咗畀你。", "佢頭先打咗電話畀你。"], altEn: ["He rang you a moment ago."], grammar: [g.zo-perfective], vocab: [w.tau4-sin1] }
      - { es: "套戲已經開始咗。", en: "The film has already started.", altEs: ["套戲開始咗喇。", "套戲已經開始咗喇。"], grammar: [g.ji-ging-already, g.classifier-as-the], vocab: [w.hoi1-ci2] }
      - { es: "雨停咗喇。", en: "The rain has stopped.", altEs: ["停咗雨喇。"], altEn: ["It's stopped raining."], grammar: [g.zo-perfective], vocab: [w.ting4] }
      - { es: "我已經決定咗：我搬去九龍。", en: "I've decided: I'm moving to Kowloon.", altEs: ["我決定咗喇：我搬去九龍。"], grammar: [g.ji-ging-already], vocab: [w.kyut3-ding6] }
      - { es: "你熄咗盞燈未呀？", en: "Have you switched off the light yet?", altEs: ["你熄咗燈未呀？", "盞燈你熄咗未呀？"], grammar: [g.mei-questions, g.classifier-as-the], vocab: [w.sik1.b, w.dang1, w.zaan2] }
      - { es: "呢間房有兩盞燈，一盞壞咗。", jp: "ni1 gaan1 fong2 jau5 loeng5 zaan2 dang1 jat1 zaan2 waai6 zo2", en: "This room has two lamps; one is broken.", altEs: ["呢間房有兩盞燈，有一盞壞咗。"], grammar: [g.common-classifiers, g.zo-perfective], vocab: [w.dang1, w.zaan2] }
      - { es: "佢哋已經結咗婚，仲搬咗屋。", en: "They're already married, and they've moved house too.", altEs: ["佢哋已經結咗婚，又搬咗屋。"], grammar: [g.ji-ging-already], vocab: [] }
      - { es: "快啲嚟海旁，煙花已經開始咗！", en: "Come to the waterfront quickly, the fireworks have already started!", altEs: ["快啲嚟海旁啦，煙花已經開始咗！"], grammar: [g.ji-ging-already], vocab: [w.hoi1-ci2] }
      - { es: "佢走咗喇。", en: "He's left.", altEs: ["佢走咗。"], altEn: ["She's gone."], grammar: [g.zo-perfective], vocab: [], transform: { instruction: "Add 'already'", answer: "佢已經走咗喇。", alt: ["佢已經走咗。"], en: "He's already left." } }
      - { es: "我啱啱到。", jp: "ngo5 ngaam1 ngaam1 dou3", en: "I've just arrived.", altEs: ["我啱到。"], altEn: ["I just got here."], grammar: [g.ji-ging-already], vocab: [w.ngaam1-ngaam1], transform: { instruction: "Change 'just' to 'already'", answer: "我已經到咗喇。", alt: ["我已經到咗。"], en: "I've already arrived." } }
      - { es: "我已經買咗飛喇。", en: "I've already bought the tickets.", altEs: ["我已經買咗飛。", "飛我已經買咗喇。"], grammar: [g.ji-ging-already], vocab: [], error: { wrong: "我已經買飛喇。", explain: "Keep 咗 with an action verb after 已經: 已經買咗.", grammar: g.ji-ging-already } }
      - { es: "頭先你講咩呀？", en: "What did you say just now?", altEs: ["你頭先講咩呀？", "你頭先講乜嘢呀？"], grammar: [g.question-words], vocab: [w.tau4-sin1] }
      - { es: "你決定咗未呀？", en: "Have you decided yet?", altEs: ["你決定咗未？"], grammar: [g.mei-questions], vocab: [w.kyut3-ding6], transform: { instruction: "Answer 'not yet'", answer: "仲未決定。", alt: ["未呀。", "仲未。", "我仲未決定。"], en: "Not yet." } }
    exchanges:
      - q: { es: "你哋點咗嘢食未呀？", en: "Have you ordered yet?" }
        a: { es: "已經點咗喇，唔該。", en: "We've already ordered, thanks." }
        alt: ["點咗喇。", "仲未，等多陣。"]
        grammar: [g.ji-ging-already, g.mei-questions]
        vocab: []
      - q: { es: "套戲開始咗未呀？", en: "Has the film started yet?" }
        a: { es: "已經開始咗十分鐘喇。", en: "It started ten minutes ago." }
        alt: ["啱啱開始。", "仲未開始。"]
        grammar: [g.ji-ging-already]
        vocab: [w.hoi1-ci2]
      - q: { es: "你幾時到㗎？", en: "When did you get here?" }
        a: { es: "我啱啱到。", en: "I've only just arrived." }
        alt: ["頭先到咗。", "我到咗好耐喇。"]
        grammar: [g.ji-ging-already]
        vocab: [w.ngaam1-ngaam1, w.tau4-sin1]
      - q: { es: "你決定咗去邊度未呀？", en: "Have you decided where to go yet?" }
        a: { es: "決定咗喇，去尖沙咀海旁。", en: "Yes, the Tsim Sha Tsui waterfront." }
        alt: ["仲未決定。", "決定咗喇。"]
        grammar: [g.mei-questions]
        vocab: [w.kyut3-ding6, w.hoi2-pong4]
      - q: { es: "你熄咗燈未呀？", en: "Have you switched off the light yet?" }
        a: { es: "熄咗喇，瞓啦。", en: "Yes, go to sleep." }
        alt: ["仲未，等陣。", "熄咗喇。"]
        grammar: [g.mei-questions]
        vocab: [w.sik1.b, w.dang1]
    texts:
      - title: "短訊：煙花"
        es: ["我啱啱到海旁。", "煙花已經開始咗！", "你仲未到？快啲嚟啦！"]
        en: ["I've just got to the waterfront.", "The fireworks have already started!", "You're still not here? Hurry up!"]
        grammar: [g.ji-ging-already, g.mei-questions]
        vocab: [w.ngaam1-ngaam1, w.hoi1-ci2]
      - title: "雪櫃上面嘅字條"
        es: ["我頭先煲咗湯。", "你返嚟記得熄燈。", "我已經瞓咗喇。"]
        en: ["I made soup a little while ago.", "Remember to switch off the light when you get back.", "I've already gone to bed."]
        grammar: [g.ji-ging-already]
        vocab: [w.tau4-sin1, w.sik1.b, w.dang1]
    spicy:
      - { es: "我已經決定咗：今晚你陪我去海旁散步。", en: "I've already decided: tonight you're coming for a walk on the waterfront with me.", altEs: ["我決定咗喇：今晚你陪我去海旁散步。"], grammar: [g.ji-ging-already], vocab: [w.kyut3-ding6, w.hoi2-pong4] }
      - { es: "你頭先係咪望住我笑呀？", en: "Were you just looking at me and smiling?", altEs: ["你頭先係唔係望住我笑呀？"], grammar: [g.ji-ging-already], vocab: [w.tau4-sin1] }
      - { es: "已經十二點喇，你仲唔走？好，我煲多碗湯。", jp: "ji5 ging1 sap6 ji6 dim2 laa3 nei5 zung6 m4 zau2 hou2 ngo5 bou1 do1 wun2 tong1", en: "It's already midnight and you still haven't left? Fine, I'll make another bowl of soup.", altEs: ["已經十二點喇，你仲未走？好，我煲多碗湯。"], grammar: [g.ji-ging-already], vocab: [w.bou1] }
      - { es: "我啱啱熄咗燈，你就打嚟，好彩我未瞓。", en: "I'd just switched off the light when you called; lucky I wasn't asleep yet.", altEs: ["我啱啱熄咗燈你就打嚟，好彩我仲未瞓。"], grammar: [g.ji-ging-already, g.mei-questions], vocab: [w.ngaam1-ngaam1, w.sik1.b] }
      - { es: "套戲已經開始咗，但係我淨係睇住你。", en: "The film has already started, but I'm only watching you.", altEs: ["套戲已經開始咗，不過我淨係睇住你。"], grammar: [g.ji-ging-already], vocab: [w.hoi1-ci2] }
dialogues:
  - id: a2.u01.d1
    title: 喺鐘樓等
    context: "Ka-yan and Chi-ming meet at the Clock Tower in Tsim Sha Tsui on a festival evening, before the fireworks over the harbour."
    lines:
      - { speaker: 志明, es: "嘉欣！對唔住，我遲到。你等咗好耐呀？", en: "Ka-yan! Sorry I'm late. Have you been waiting long?" }
      - { speaker: 嘉欣, es: "唔係，我啱啱到。你食咗飯未呀？", en: "No, I've just got here. Have you eaten yet?" }
      - { speaker: 志明, es: "仲未呀。我五點先收工，冇時間食。", en: "Not yet. I only finished work at five and didn't have time to eat." }
      - { speaker: 嘉欣, es: "我都未食。我哋去食碗雲吞麵先啦。", en: "I haven't eaten either. Let's go and have a bowl of wonton noodles first." }
      - { speaker: 志明, es: "好呀。你買咗天星小輪嘅飛未呀？", en: "Sure. Have you bought the Star Ferry tickets yet?" }
      - { speaker: 嘉欣, es: "唔使買飛，用八達通就得。", en: "We don't need tickets; the Octopus card is fine." }
      - { speaker: 志明, es: "我上次冇帶八達通，要排隊買飛。", en: "Last time I didn't bring my Octopus card and had to queue for a ticket." }
      - { speaker: 嘉欣, es: "咁你今次帶咗未呀？", en: "So have you brought it this time?" }
      - { speaker: 志明, es: "帶咗喇！煙花八點開始。", en: "Yes, I have! The fireworks start at eight." }
      - { speaker: 嘉欣, es: "已經七點半喇，快啲去食啦！", en: "It's already half past seven, let's go and eat, quick!" }
    questions:
      - { q: "嘉欣等咗志明好耐未呀？", options: ["等咗一個鐘", "佢啱啱到", "佢仲未到"], answer: 1, explain: "Ka-yan says 我啱啱到: she has only just arrived." }
      - { q: "志明點解未食飯呀？", options: ["因為佢唔肚餓", "因為佢五點先收工", "因為佢冇錢"], answer: 1, explain: "He only finished work at five (五點先收工) and had no time to eat." }
      - { q: "上次志明冇帶乜嘢呀？", options: ["遮", "八達通", "手機"], answer: 1, explain: "上次我冇帶八達通: last time he didn't bring his Octopus card." }
      - { q: "煙花幾點開始呀？", options: ["七點半", "八點", "五點"], answer: 1, explain: "煙花八點開始: the fireworks start at eight; it is already half past seven." }
