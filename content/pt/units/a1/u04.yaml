id: a1.u04
title: Minha casa no Rio
lessons:
  - id: a1.u04.l1
    title: Minha casa
    teach: [g.articles-indefinite, g.tem-there-is]
    vocab: [w.um, w.haver, w.apartamento, w.prédio, w.quarto, w.sala, w.cozinha, w.banheiro, w.jardim, w.varanda, w.janela, w.porta, w.parede, w.chão, w.escada, w.andar.n, w.garagem, w.piscina, w.confortável, w.moderno, w.antigo]
    tip: "In spoken Brazilian Portuguese tem means 'there is / there are' and never changes: tem um quarto, tem dois quartos. Há is the written equivalent."
    sentences:
      - { es: "Moro num apartamento pequeno.", en: "I live in a small flat.", altEs: ["Eu moro num apartamento pequeno.", "Moro em um apartamento pequeno."], altEn: ["I live in a small apartment."], grammar: [g.articles-indefinite, g.contractions-em], vocab: [w.um, w.apartamento] }
      - { es: "O apartamento tem dois quartos e uma sala.", en: "The flat has two bedrooms and a living room.", altEs: ["O apartamento tem dois quartos e sala."], altEn: ["The apartment has two bedrooms and a living room."], grammar: [g.articles-indefinite, g.ter-present], vocab: [w.quarto, w.sala], transform: { instruction: "Ask if the flat has a balcony", answer: "O apartamento tem varanda?", alt: ["O apartamento tem uma varanda?", "Tem varanda no apartamento?"], en: "Does the flat have a balcony?" } }
      - { es: "Tem uma varanda com vista para o Cristo.", en: "There's a balcony with a view of Christ the Redeemer.", altEs: ["Há uma varanda com vista para o Cristo.", "Tem uma varanda com vista pro Cristo."], grammar: [g.tem-there-is, g.articles-indefinite], vocab: [w.varanda] }
      - { es: "Tem banheiro aqui?", en: "Is there a bathroom here?", altEs: ["Aqui tem banheiro?", "Há banheiro aqui?", "Tem um banheiro aqui?"], altEn: ["Is there a toilet here?"], grammar: [g.tem-there-is], vocab: [w.banheiro], variant: "In Portugal: Há casa de banho aqui?" }
      - { es: "No prédio tem uma piscina e uma garagem.", en: "In the building there's a pool and a garage.", altEs: ["No prédio há uma piscina e uma garagem.", "Tem uma piscina e uma garagem no prédio."], grammar: [g.tem-there-is, g.articles-indefinite], vocab: [w.prédio, w.piscina, w.garagem], error: { wrong: "No prédio têm uma piscina e uma garagem.", explain: "For 'there is / are', tem never takes the circumflex: têm means 'they have'.", grammar: g.tem-there-is } }
      - { es: "A cozinha é pequena, mas é moderna.", en: "The kitchen is small, but it's modern.", altEs: ["A cozinha é pequena mas é moderna."], grammar: [g.adjective-agreement], vocab: [w.cozinha, w.moderno] }
      - { es: "Moro no terceiro andar.", en: "I live on the third floor.", altEs: ["Eu moro no terceiro andar."], grammar: [g.contractions-em], vocab: [w.andar.n] }
      - { es: "O prédio é antigo e não tem garagem.", en: "The building is old and doesn't have a garage.", altEs: ["O prédio é velho e não tem garagem."], grammar: [g.tem-there-is, g.negation], vocab: [w.prédio, w.antigo, w.garagem] }
      - { es: "Tem um jardim atrás da casa.", en: "There's a garden behind the house.", altEs: ["Há um jardim atrás da casa.", "Atrás da casa tem um jardim."], grammar: [g.tem-there-is, g.articles-indefinite], vocab: [w.jardim] }
      - { es: "A casa tem uma porta azul e janelas grandes.", en: "The house has a blue door and big windows.", altEs: ["A casa tem a porta azul e janelas grandes."], grammar: [g.articles-indefinite], vocab: [w.porta, w.janela] }
      - { es: "Há um quarto confortável para você.", en: "There's a comfortable room for you.", altEs: ["Tem um quarto confortável para você.", "Tem um quarto confortável pra você."], grammar: [g.tem-there-is], vocab: [w.haver, w.confortável], note: "há is the formal and written 'there is'." }
      - { es: "Tem um livro no chão.", en: "There's a book on the floor.", altEs: ["Há um livro no chão."], grammar: [g.articles-indefinite, g.tem-there-is], vocab: [w.chão], transform: { instruction: "Change to 'some books'", answer: "Tem uns livros no chão.", alt: ["Há uns livros no chão."], en: "There are some books on the floor." } }
      - { es: "As paredes da sala são brancas.", en: "The living room walls are white.", altEs: ["As paredes da sala são todas brancas."], grammar: [g.plural-nouns], vocab: [w.parede, w.sala] }
      - { es: "Não tem elevador, só escada.", en: "There's no lift, only stairs.", altEs: ["Não há elevador, só escada."], altEn: ["There's no elevator, just stairs."], grammar: [g.tem-there-is, g.negation], vocab: [w.escada] }
      - { es: "Que apartamento lindo!", en: "What a lovely flat!", altEs: ["Que apartamento bonito!"], altEn: ["What a beautiful apartment!"], grammar: [g.articles-indefinite], vocab: [w.apartamento], error: { wrong: "Que um apartamento lindo!", explain: "Exclamations with que take no article: Que apartamento lindo!", grammar: g.articles-indefinite } }
    exchanges:
      - q: { es: "Você mora numa casa ou num apartamento?", en: "Do you live in a house or a flat?" }
        a: { es: "Moro num apartamento perto da praia.", en: "I live in a flat near the beach." }
        alt: ["Num apartamento.", "Moro numa casa.", "Em um apartamento."]
        grammar: [g.articles-indefinite, g.contractions-em]
        vocab: [w.apartamento, w.um]
      - q: { es: "Quantos quartos tem o apartamento?", en: "How many bedrooms does the flat have?" }
        a: { es: "Tem dois quartos.", en: "It has two bedrooms." }
        alt: ["Dois.", "Tem três quartos.", "Só um."]
        grammar: [g.ter-present]
        vocab: [w.quarto]
      - q: { es: "Tem garagem no prédio?", en: "Is there a garage in the building?" }
        a: { es: "Não, não tem.", en: "No, there isn't." }
        alt: ["Tem, sim.", "Não tem não.", "Tem, sim, embaixo."]
        grammar: [g.tem-there-is]
        vocab: [w.garagem, w.prédio]
      - q: { es: "Em que andar você mora?", en: "What floor do you live on?" }
        a: { es: "No terceiro andar.", en: "On the third floor." }
        alt: ["No terceiro.", "No primeiro andar.", "Moro no segundo andar."]
        grammar: [g.contractions-em]
        vocab: [w.andar.n]
      - q: { es: "Como é a sua casa?", en: "What's your house like?" }
        a: { es: "É antiga, mas é muito confortável.", en: "It's old, but it's very comfortable." }
        alt: ["É pequena e moderna.", "É grande e tem jardim."]
        grammar: [g.adjective-agreement]
        vocab: [w.antigo, w.confortável]
    texts:
      - title: "Anúncio"
        es: ["Apartamento no Cosme Velho, perto do Cristo.", "Dois quartos, sala, cozinha e um banheiro.", "Tem varanda e garagem."]
        en: ["Flat in Cosme Velho, near Christ the Redeemer.", "Two bedrooms, living room, kitchen and a bathroom.", "It has a balcony and a garage."]
        grammar: [g.tem-there-is, g.articles-indefinite]
        vocab: [w.apartamento, w.quarto, w.varanda, w.garagem]
      - title: "Mensagem do Daniel"
        es: ["Mãe, o meu apartamento é ótimo!", "É pequeno, mas tem uma varanda.", "Da varanda, eu vejo o Cristo Redentor!"]
        en: ["Mum, my flat is great!", "It's small, but it has a balcony.", "From the balcony I can see Christ the Redeemer!"]
        grammar: [g.tem-there-is]
        vocab: [w.apartamento, w.varanda]
    spicy:
      - { es: "Tem um lugar no sofá... ao seu lado.", en: "There's a place on the sofa... next to you.", altEs: ["Tem um lugar no sofá, ao seu lado."], grammar: [g.tem-there-is], vocab: [w.um] }
      - { es: "Na minha varanda tem duas cadeiras... e uma está vazia.", en: "On my balcony there are two chairs... and one is empty.", altEs: ["Na minha varanda há duas cadeiras... e uma está vazia."], grammar: [g.tem-there-is], vocab: [w.varanda] }
      - { es: "Tem piscina no prédio. Quer nadar comigo?", en: "There's a pool in the building. Want to swim with me?", altEs: ["Tem uma piscina no prédio. Quer nadar comigo?"], grammar: [g.tem-there-is], vocab: [w.piscina] }
      - { es: "Que apartamento lindo! E que vizinho lindo também.", en: "What a lovely flat! And what a lovely neighbour too.", altEs: ["Que apartamento lindo! E que vizinha linda também."], grammar: [g.articles-indefinite], vocab: [w.apartamento] }
      - { es: "Minha casa é antiga, mas tem uma vista linda... e agora tem você.", en: "My house is old, but it has a lovely view... and now it has you.", altEs: ["A minha casa é antiga, mas tem uma vista linda... e agora tem você."], grammar: [g.tem-there-is, g.adjective-agreement], vocab: [w.antigo] }
  - id: a1.u04.l2
    title: Na sala e no quarto
    teach: [g.contractions-em, g.estar-present]
    vocab: [w.em, w.no, w.num, w.mesa, w.cadeira, w.cama, w.sofá, w.armário, w.estante, w.geladeira, w.fogão, w.televisão, w.chuveiro, w.chave, w.limpo, w.sujo, w.cheio, w.vazio, w.flor, w.animal]
    tip: "em + o = no, em + a = na, em + os = nos, em + as = nas. They always contract. Use estar for where people and things are right now."
    sentences:
      - { es: "A chave está na mesa.", en: "The key is on the table.", altEs: ["A chave tá na mesa."], grammar: [g.contractions-em, g.estar-present], vocab: [w.chave, w.mesa], error: { wrong: "A chave está em a mesa.", explain: "em + a always contracts: na mesa.", grammar: g.contractions-em } }
      - { es: "Onde está o meu celular? — Está no sofá.", en: "Where's my phone? — It's on the sofa.", altEs: ["Cadê o meu celular? — Está no sofá.", "Onde está meu celular? — No sofá."], grammar: [g.estar-present, g.contractions-em], vocab: [w.sofá, w.no] }
      - { es: "Estou em casa hoje.", en: "I'm at home today.", altEs: ["Hoje estou em casa.", "Eu estou em casa hoje.", "Tô em casa hoje."], grammar: [g.estar-present, g.contractions-em], vocab: [w.em], note: "em casa (at home) has no article.", transform: { instruction: "Change to 'we'", answer: "Estamos em casa hoje.", alt: ["Nós estamos em casa hoje.", "Hoje estamos em casa."], en: "We're at home today." } }
      - { es: "Os livros estão na estante.", en: "The books are on the bookcase.", altEs: ["Os livros estão na estante da sala."], altEn: ["The books are on the shelf."], grammar: [g.estar-present, g.contractions-em], vocab: [w.estante] }
      - { es: "As roupas estão no armário.", en: "The clothes are in the wardrobe.", altEs: ["A roupa está no armário."], altEn: ["The clothes are in the cupboard."], grammar: [g.estar-present, g.contractions-em], vocab: [w.armário] }
      - { es: "A cerveja está na geladeira.", en: "The beer is in the fridge.", altEs: ["A cerveja tá na geladeira."], grammar: [g.estar-present, g.contractions-em], vocab: [w.geladeira], variant: "In Portugal a fridge is o frigorífico." }
      - { es: "As crianças estão na sala, na frente da televisão.", en: "The children are in the living room, in front of the TV.", altEs: ["As crianças estão na sala, em frente à televisão."], grammar: [g.estar-present, g.contractions-em], vocab: [w.televisão], error: { wrong: "As crianças está na sala, na frente da televisão.", explain: "The subject is plural, so the verb is plural: estão.", grammar: g.estar-present } }
      - { es: "Nós estamos no apartamento da Camila.", en: "We're at Camila's flat.", altEs: ["Estamos no apartamento da Camila."], grammar: [g.estar-present, g.contractions-em], vocab: [w.no], transform: { instruction: "Change to 'they'", answer: "Eles estão no apartamento da Camila.", alt: ["Elas estão no apartamento da Camila."], en: "They're at Camila's flat." } }
      - { es: "O quarto está limpo, mas a cozinha está suja.", en: "The bedroom is clean, but the kitchen is dirty.", altEs: ["O quarto está limpo mas a cozinha está suja."], grammar: [g.estar-present], vocab: [w.limpo, w.sujo], note: "estar for how things are right now." }
      - { es: "A geladeira está vazia!", en: "The fridge is empty!", altEs: ["A geladeira tá vazia!"], grammar: [g.estar-present], vocab: [w.vazio, w.geladeira] }
      - { es: "O ônibus está cheio.", en: "The bus is full.", altEs: ["O ônibus tá cheio."], grammar: [g.estar-present], vocab: [w.cheio], variant: "In Portugal: o autocarro está cheio." }
      - { es: "Tem flores nas janelas.", en: "There are flowers in the windows.", altEs: ["Há flores nas janelas."], grammar: [g.contractions-em, g.tem-there-is], vocab: [w.flor] }
      - { es: "A água do chuveiro está fria.", en: "The shower water is cold.", altEs: ["A água do chuveiro tá fria."], grammar: [g.estar-present], vocab: [w.chuveiro] }
      - { es: "O fogão é novo, mas a geladeira é velha.", en: "The cooker is new, but the fridge is old.", altEs: ["O fogão é novo mas a geladeira é velha."], altEn: ["The stove is new, but the fridge is old."], grammar: [g.adjective-agreement], vocab: [w.fogão, w.geladeira] }
      - { es: "Tem um animal na cozinha!", en: "There's an animal in the kitchen!", altEs: ["Há um animal na cozinha!"], grammar: [g.contractions-em, g.tem-there-is], vocab: [w.animal] }
      - { es: "O Leo está numa cadeira e a Luna está na cama.", en: "Leo is on a chair and Luna is on the bed.", altEs: ["O Leo está em uma cadeira e a Luna está na cama."], grammar: [g.contractions-em, g.articles-indefinite], vocab: [w.num, w.cadeira, w.cama] }
    exchanges:
      - q: { es: "Cadê a chave?", en: "Where's the key?" }
        a: { es: "Está na mesa da cozinha.", en: "It's on the kitchen table." }
        alt: ["Na mesa.", "Está no armário.", "Não sei."]
        grammar: [g.estar-present, g.contractions-em]
        vocab: [w.chave, w.mesa]
      - q: { es: "Onde você está?", en: "Where are you?" }
        a: { es: "Estou em casa.", en: "I'm at home." }
        alt: ["Em casa.", "Estou no apartamento da Camila.", "Tô em casa."]
        grammar: [g.estar-present]
        vocab: [w.em]
      - q: { es: "Tem cerveja na geladeira?", en: "Is there any beer in the fridge?" }
        a: { es: "Não, a geladeira está vazia.", en: "No, the fridge is empty." }
        alt: ["Tem, sim.", "Não tem não.", "Tem duas."]
        grammar: [g.estar-present, g.tem-there-is]
        vocab: [w.geladeira, w.vazio]
      - q: { es: "O banheiro está limpo?", en: "Is the bathroom clean?" }
        a: { es: "Está, sim. Está muito limpo.", en: "Yes, it is. It's very clean." }
        alt: ["Está, sim.", "Não, está sujo."]
        grammar: [g.estar-present]
        vocab: [w.limpo, w.sujo]
      - q: { es: "Onde estão os seus pais?", en: "Where are your parents?" }
        a: { es: "Eles estão nos Estados Unidos.", en: "They're in the United States." }
        alt: ["Nos Estados Unidos.", "Estão em Chicago."]
        grammar: [g.estar-present, g.contractions-em]
        vocab: [w.no]
    texts:
      - title: "Bilhete na geladeira"
        es: ["Daniel, a chave está na mesa da sala.", "O café está no armário da cozinha.", "Até logo! Camila"]
        en: ["Daniel, the key is on the living-room table.", "The coffee is in the kitchen cupboard.", "See you later! Camila"]
        grammar: [g.contractions-em, g.estar-present]
        vocab: [w.chave, w.mesa, w.armário]
      - title: "Mensagem da Camila"
        es: ["Estou no supermercado.", "A geladeira está vazia!", "Você quer alguma coisa?"]
        en: ["I'm at the supermarket.", "The fridge is empty!", "Do you want anything?"]
        grammar: [g.estar-present]
        vocab: [w.geladeira, w.vazio]
    spicy:
      - { es: "A geladeira está vazia... vamos jantar fora?", en: "The fridge is empty... shall we go out for dinner?", altEs: ["A geladeira tá vazia... vamos jantar fora?"], grammar: [g.estar-present], vocab: [w.geladeira, w.vazio] }
      - { es: "Onde você está? Eu estou no sofá... sozinho.", en: "Where are you? I'm on the sofa... alone.", altEs: ["Onde você está? Eu estou no sofá... sozinha.", "Cadê você? Tô no sofá... sozinho."], grammar: [g.estar-present, g.contractions-em], vocab: [w.sofá] }
      - { es: "O sofá é confortável e o filme é bom. Você vem?", en: "The sofa is comfortable and the film is good. Are you coming?", altEs: ["O sofá é confortável e o filme é ótimo. Você vem?"], grammar: [g.estar-present], vocab: [w.sofá] }
      - { es: "Estou em casa, estou bem... mas estou com saudade.", en: "I'm at home, I'm fine... but I miss you.", altEs: ["Tô em casa, tô bem... mas tô com saudade."], grammar: [g.estar-present, g.estar-com], vocab: [w.em] }
      - { es: "A chave está na mesa e o vinho está na geladeira.", en: "The key is on the table and the wine is in the fridge.", altEs: ["A chave tá na mesa e o vinho tá na geladeira."], grammar: [g.contractions-em, g.estar-present], vocab: [w.chave, w.geladeira] }
  - id: a1.u04.l3
    title: Onde fica?
    teach: [g.ficar-location]
    vocab: [w.ficar, w.rua, w.bairro, w.praça, w.parque, w.centro, w.escola, w.igreja, w.hospital, w.farmácia, w.banco, w.mercado, w.supermercado, w.loja, w.shopping, w.hotel, w.museu, w.restaurante, w.bar, w.praia, w.morro, w.endereço, w.ponto, w.habitante, w.turista]
    tip: "Ask where a place is with Onde fica…? Use estar for people and things that move: O Daniel está no bar, but O bar fica na praia."
    sentences:
      - { es: "Onde fica o banco?", en: "Where's the bank?", altEs: ["Onde é o banco?", "O banco fica onde?"], altEn: ["Where is the bank?"], grammar: [g.ficar-location], vocab: [w.ficar, w.banco], transform: { instruction: "Ask where the pharmacy is", answer: "Onde fica a farmácia?", alt: ["Onde é a farmácia?", "A farmácia fica onde?"], en: "Where's the pharmacy?" } }
      - { es: "O Cristo Redentor fica no Corcovado.", en: "Christ the Redeemer is on Corcovado.", altEs: ["O Cristo fica no Corcovado.", "O Cristo Redentor fica lá no Corcovado."], grammar: [g.ficar-location, g.contractions-em], vocab: [w.ficar] }
      - { es: "A farmácia fica na Rua das Laranjeiras.", en: "The pharmacy is on Rua das Laranjeiras.", altEs: ["A farmácia é na Rua das Laranjeiras."], grammar: [g.ficar-location], vocab: [w.farmácia, w.rua] }
      - { es: "O hospital fica no centro.", en: "The hospital is in the centre.", altEs: ["O hospital fica no Centro."], altEn: ["The hospital is downtown."], grammar: [g.ficar-location, g.contractions-em], vocab: [w.hospital, w.centro], error: { wrong: "O hospital fica em o centro.", explain: "em + o always contracts: no centro.", grammar: g.contractions-em } }
      - { es: "O supermercado fica perto da praça.", en: "The supermarket is near the square.", altEs: ["O supermercado é perto da praça."], grammar: [g.ficar-location, g.prepositions-place], vocab: [w.supermercado, w.praça] }
      - { es: "O museu fica num parque.", en: "The museum is in a park.", altEs: ["O museu fica em um parque."], grammar: [g.ficar-location, g.contractions-em], vocab: [w.museu, w.parque] }
      - { es: "Fico num hotel em Copacabana.", en: "I'm staying at a hotel in Copacabana.", altEs: ["Eu fico num hotel em Copacabana.", "Estou num hotel em Copacabana."], grammar: [g.ficar-location], vocab: [w.ficar, w.hotel], note: "ficar also means 'to stay'." }
      - { es: "O Daniel está no mercado.", en: "Daniel is at the market.", altEs: ["Daniel está no mercado.", "O Daniel tá no mercado."], grammar: [g.estar-present, g.ficar-location], vocab: [w.mercado], error: { wrong: "O Daniel fica no mercado.", explain: "For where a person is right now, use estar; fica means he stays there.", grammar: g.ficar-location } }
      - { es: "Qual é o seu endereço?", en: "What's your address?", altEs: ["Qual o seu endereço?", "Qual é seu endereço?"], grammar: [g.question-words], vocab: [w.endereço] }
      - { es: "Meu bairro tem uma igreja, uma escola e muitos bares.", en: "My neighbourhood has a church, a school and lots of bars.", altEs: ["No meu bairro tem uma igreja, uma escola e muitos bares."], grammar: [g.tem-there-is, g.articles-indefinite], vocab: [w.bairro, w.igreja, w.escola, w.bar] }
      - { es: "O restaurante fica no shopping.", en: "The restaurant is in the shopping centre.", altEs: ["O restaurante é no shopping."], altEn: ["The restaurant is in the mall."], grammar: [g.ficar-location], vocab: [w.restaurante, w.shopping] }
      - { es: "O ponto de ônibus fica na esquina.", en: "The bus stop is on the corner.", altEs: ["O ponto do ônibus fica na esquina."], grammar: [g.ficar-location], vocab: [w.ponto], variant: "In Portugal: a paragem do autocarro." }
      - { es: "Muitos turistas visitam o Cristo.", en: "Lots of tourists visit Christ the Redeemer.", altEs: ["Muitos turistas visitam o Cristo Redentor."], grammar: [g.present-regular-ar], vocab: [w.turista] }
      - { es: "O Rio tem uns seis milhões de habitantes.", en: "Rio has about six million inhabitants.", altEs: ["O Rio tem uns seis milhões de habitantes, mais ou menos."], grammar: [g.articles-indefinite], vocab: [w.habitante], note: "uns / umas before a number = about." }
      - { es: "Tem uma loja de roupas na minha rua.", en: "There's a clothes shop on my street.", altEs: ["Há uma loja de roupas na minha rua.", "Na minha rua tem uma loja de roupas."], grammar: [g.tem-there-is], vocab: [w.loja, w.rua] }
      - { es: "Hoje eu fico em casa.", en: "Today I'm staying at home.", altEs: ["Hoje fico em casa.", "Eu fico em casa hoje."], altEn: ["I'm staying home today."], grammar: [g.ficar-location], vocab: [w.ficar], transform: { instruction: "Change to 'we'", answer: "Hoje nós ficamos em casa.", alt: ["Hoje ficamos em casa.", "Nós ficamos em casa hoje."], en: "Today we're staying at home." } }
    exchanges:
      - q: { es: "Com licença, onde fica a farmácia?", en: "Excuse me, where's the pharmacy?" }
        a: { es: "Fica na próxima rua, à direita.", en: "It's on the next street, on the right." }
        alt: ["Fica ali.", "Fica perto da praça.", "Na próxima rua."]
        grammar: [g.ficar-location]
        vocab: [w.farmácia, w.rua]
      - q: { es: "Onde você fica no Rio?", en: "Where are you staying in Rio?" }
        a: { es: "Fico num hotel em Copacabana.", en: "I'm staying at a hotel in Copacabana." }
        alt: ["Num hotel.", "Fico na casa de uma amiga.", "Em Copacabana."]
        grammar: [g.ficar-location]
        vocab: [w.ficar, w.hotel]
      - q: { es: "Qual é o seu endereço?", en: "What's your address?" }
        a: { es: "Rua das Laranjeiras, número cento e vinte.", en: "Rua das Laranjeiras, number one hundred and twenty." }
        alt: ["Rua das Laranjeiras, cento e vinte.", "É Rua das Laranjeiras, cento e vinte."]
        grammar: [g.question-words]
        vocab: [w.endereço, w.rua]
      - q: { es: "O Cristo fica longe?", en: "Is Christ the Redeemer far?" }
        a: { es: "Não muito. Fica no Corcovado, aqui perto.", en: "Not very. It's on Corcovado, near here." }
        alt: ["Fica um pouco longe.", "Não, fica perto.", "Fica lá em cima."]
        grammar: [g.ficar-location]
        vocab: [w.ficar]
      - q: { es: "Tem um supermercado no seu bairro?", en: "Is there a supermarket in your neighbourhood?" }
