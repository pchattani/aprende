id: b2.u11
title: "Il était une fois à Colmar"
lessons:
  - id: b2.u11.l1
    title: Il était une fois une cigogne
    teach: [g.passe-simple-recognition]
    vocab: [w.il-était-une-fois, w.conte, w.conte-de-fées, w.fée, w.sorcière, w.ogre, w.loup, w.renard, w.ours, w.cigogne, w.nid, w.villageois, w.personnage, w.narrateur, w.récit, w.aventure, w.magique, w.mystérieux, w.trembler, w.s-envoler, w.plume, w.aile, w.bec, w.patte, w.punir, w.trésor, w.château-fort, w.chevalier, w.épée, w.dragon]
    tip: "The passé simple is the past of tales and novels. You only need to recognise it: il arriva, elle partit, ils furent, il vint, elle fit, il vit. In conversation, use the passé composé."
    sentences:
      - { es: "Il était une fois une cigogne qui vivait sur un toit de Colmar.", en: "Once upon a time there was a stork who lived on a roof in Colmar.", altEs: ["Il était une fois une cigogne qui habitait sur un toit de Colmar."], grammar: [g.passe-simple-recognition, g.imparfait-uses], vocab: [w.il-était-une-fois, w.cigogne, w.toit] }
      - { es: "Un matin d'automne, elle ouvrit ses grandes ailes et s'envola vers l'Afrique.", en: "One autumn morning, she opened her great wings and flew away towards Africa.", altEs: ["Un matin d'automne, elle a ouvert ses grandes ailes et s'est envolée vers l'Afrique."], grammar: [g.passe-simple-recognition], vocab: [w.aile, w.s-envoler] }
      - { es: "Au printemps, elle revint et trouva son nid occupé par un renard.", en: "In spring, she came back and found her nest occupied by a fox.", altEs: ["Au printemps, elle est revenue et a trouvé son nid occupé par un renard."], grammar: [g.passe-simple-recognition], vocab: [w.nid, w.renard, w.revenir] }
      - { es: "Les villageois furent très surpris : un renard sur un toit, on n'avait jamais vu ça !", en: "The villagers were very surprised: a fox on a roof, no one had ever seen such a thing!", altEs: ["Les villageois ont été très surpris : un renard sur un toit, on n'avait jamais vu ça !"], grammar: [g.passe-simple-recognition, g.plus-que-parfait], vocab: [w.villageois, w.surpris] }
      - { es: "La cigogne prit une plume dans son bec et alla chercher la fée de la forêt.", en: "The stork took a feather in her beak and went to fetch the fairy of the forest.", altEs: ["La cigogne a pris une plume dans son bec et est allée chercher la fée de la forêt."], grammar: [g.passe-simple-recognition], vocab: [w.plume, w.bec, w.fée] }
      - { es: "La fée agita sa baguette magique, et le renard se mit à trembler de toutes ses pattes.", en: "The fairy waved her magic wand, and the fox began to tremble in every paw.", altEs: ["La fée a agité sa baguette magique, et le renard s'est mis à trembler de toutes ses pattes."], grammar: [g.passe-simple-recognition], vocab: [w.magique, w.patte, w.trembler] }
      - { es: "Pour le punir, elle le transforma en ours, et il dut partir vivre dans la montagne.", en: "To punish him, she turned him into a bear, and he had to go and live in the mountains.", altEs: ["Pour le punir, elle l'a transformé en ours, et il a dû partir vivre dans la montagne."], grammar: [g.passe-simple-recognition, g.purpose-clauses], vocab: [w.punir, w.ours] }
      - { es: "Depuis ce jour, les cigognes reviennent chaque printemps sur les toits d'Alsace.", en: "Since that day, the storks come back every spring to the roofs of Alsace.", altEs: ["Depuis ce jour-là, les cigognes reviennent chaque printemps sur les toits d'Alsace."], grammar: [g.depuis-present], vocab: [w.cigogne, w.printemps] }
      - { es: "Le chevalier tira son épée et marcha vers le château fort, où dormait le dragon.", en: "The knight drew his sword and walked towards the castle, where the dragon was sleeping.", altEs: ["Le chevalier a tiré son épée et a marché vers le château fort, où dormait le dragon."], grammar: [g.passe-simple-recognition, g.imparfait-uses], vocab: [w.chevalier, w.épée, w.château-fort, w.dragon] }
      - { es: "L'ogre mangea tout le trésor du roi, mais il ne fut pas rassasié.", en: "The ogre ate the king's entire treasure, but he wasn't full.", altEs: ["L'ogre a mangé tout le trésor du roi, mais il n'a pas été rassasié."], grammar: [g.passe-simple-recognition], vocab: [w.ogre, w.trésor] }
      - { es: "Dans ce conte, le narrateur ne dit jamais qui est la sorcière ; c'est un personnage mystérieux.", en: "In this tale, the narrator never says who the witch is; she's a mysterious character.", altEs: ["Dans ce conte, le narrateur ne dit jamais qui est la sorcière : c'est un personnage mystérieux."], grammar: [g.negation-jamais-plus-rien], vocab: [w.conte, w.narrateur, w.sorcière, w.personnage, w.mystérieux] }
      - { es: "Ce récit d'aventures se lit en une soirée ; mes neveux l'adorent.", en: "This adventure story can be read in an evening; my nephews love it.", altEs: ["On lit ce récit d'aventures en une soirée ; mes neveux l'adorent."], grammar: [g.pronominal-passive], vocab: [w.récit, w.aventure] }
      - { es: "Le loup vit le petit chaperon rouge et lui demanda où elle allait.", en: "The wolf saw Little Red Riding Hood and asked her where she was going.", grammar: [g.passe-simple-recognition, g.indirect-questions], vocab: [w.loup], transform: { instruction: "Retell it in conversation (passé composé)", answer: "Le loup a vu le petit chaperon rouge et lui a demandé où elle allait.", en: "The wolf saw Little Red Riding Hood and asked her where she was going." } }
      - { es: "Ils vécurent heureux et eurent beaucoup d'enfants.", en: "They lived happily ever after and had lots of children.", grammar: [g.passe-simple-recognition], vocab: [w.heureux], transform: { instruction: "Rewrite in the passé composé", answer: "Ils ont vécu heureux et ont eu beaucoup d'enfants.", en: "They lived happily and had lots of children." }, note: "The traditional ending of French fairy tales." }
      - { es: "La princesse naquit dans un château fort et y vécut toute sa vie.", en: "The princess was born in a castle and lived there all her life.", grammar: [g.passe-simple-recognition], vocab: [w.princesse, w.château-fort], transform: { instruction: "Rewrite in the passé composé", answer: "La princesse est née dans un château fort et y a vécu toute sa vie.", en: "The princess was born in a castle and lived there all her life." } }
      - { es: "Hier soir, j'ai lu un conte de fées à ma nièce.", en: "Last night I read a fairy tale to my niece.", altEs: ["Hier soir, j'ai raconté un conte de fées à ma nièce."], grammar: [g.passe-simple-recognition, g.passe-compose-avoir], vocab: [w.conte-de-fées, w.nièce], error: { wrong: "Hier soir, je lus un conte de fées à ma nièce.", explain: "The passé simple belongs to written narrative; when you talk about your own evening, use the passé composé: j'ai lu.", grammar: g.passe-simple-recognition } }
    exchanges:
      - q: { es: "Comment commence un conte de fées en français ?", en: "How does a fairy tale begin in French?" }
        a: { es: "Par « Il était une fois », et il finit souvent par « Ils vécurent heureux ».", en: "With 'Il était une fois', and it often ends with 'Ils vécurent heureux'." }
        alt: ["Par « Il était une fois ».", "« Il était une fois… », comme en anglais « Once upon a time »."]
        grammar: [g.passe-simple-recognition]
        vocab: [w.il-était-une-fois, w.conte-de-fées]
      - q: { es: "« Il fit », ça vient de quel verbe ?", en: "'Il fit' — which verb does that come from?" }
        a: { es: "Du verbe « faire » : il fit, c'est il a fait.", en: "From the verb 'faire': il fit means il a fait." }
        alt: ["De « faire ».", "C'est le passé simple de « faire »."]
        grammar: [g.passe-simple-recognition]
        vocab: [w.faire]
      - q: { es: "Pourquoi voit-on des cigognes partout à Colmar ?", en: "Why do you see storks everywhere in Colmar?" }
        a: { es: "C'est le symbole de l'Alsace ; elles font leur nid sur les toits et les clochers.", en: "It's the symbol of Alsace; they build their nests on roofs and bell towers." }
        alt: ["Parce que c'est le symbole de l'Alsace.", "Elles nichent sur les toits."]
        grammar: [g.present-er]
        vocab: [w.cigogne, w.nid]
      - q: { es: "Qu'est-ce qui arriva au renard, à la fin ?", en: "What happened to the fox in the end?" }
        a: { es: "La fée le transforma en ours ; aujourd'hui, on dirait qu'elle l'a transformé en ours.", en: "The fairy turned him into a bear; nowadays we'd say 'elle l'a transformé en ours'." }
        alt: ["Il a été transformé en ours.", "La fée l'a puni."]
        grammar: [g.passe-simple-recognition]
        vocab: [w.renard, w.fée]
      - q: { es: "Tu préfères quel personnage de contes ?", en: "Which fairy-tale character do you prefer?" }
        a: { es: "La sorcière, sans hésiter : elle est beaucoup plus intéressante que la princesse.", en: "The witch, without hesitation: she's much more interesting than the princess." }
        alt: ["Le loup.", "Le chevalier, évidemment."]
        grammar: [g.comparatives]
        vocab: [w.sorcière, w.personnage]
    texts:
      - title: "Légende alsacienne"
        es: ["Selon la légende, Odile naquit aveugle au VIIe siècle.", "Son père, un duc, voulut la faire disparaître, mais sa mère la cacha.", "Le jour de son baptême, elle ouvrit les yeux et vit la lumière."]
        en: ["According to legend, Odile was born blind in the 7th century.", "Her father, a duke, wanted to get rid of her, but her mother hid her.", "On the day of her baptism, she opened her eyes and saw the light."]
        grammar: [g.passe-simple-recognition]
        vocab: [w.duc, w.cacher]
      - title: "Fin du conte"
        es: ["Le chevalier tua le dragon et rapporta le trésor au village.", "Les villageois firent une grande fête.", "Et la cigogne, sur son toit, regarda tout cela sans rien dire."]
        en: ["The knight killed the dragon and brought the treasure back to the village.", "The villagers threw a big party.", "And the stork, on her roof, watched it all without a word."]
        grammar: [g.passe-simple-recognition]
        vocab: [w.chevalier, w.dragon, w.trésor, w.villageois]
    spicy:
      - { es: "Il était une fois un garçon qui m'offrit un kougelhopf ; je l'épousai presque sur-le-champ.", en: "Once upon a time there was a boy who gave me a kugelhopf; I very nearly married him on the spot.", altEs: ["Il était une fois un garçon qui m'a offert un kougelhopf ; je l'ai presque épousé sur-le-champ."], grammar: [g.passe-simple-recognition], vocab: [w.il-était-une-fois, w.kougelhopf] }
      - { es: "Le chevalier posa son épée, enleva son casque… et la princesse oublia complètement le dragon.", en: "The knight put down his sword, took off his helmet… and the princess completely forgot about the dragon.", altEs: ["Le chevalier a posé son épée, a enlevé son casque… et la princesse a complètement oublié le dragon."], grammar: [g.passe-simple-recognition], vocab: [w.chevalier, w.épée, w.dragon] }
      - { es: "Selon la légende, les cigognes apportent les bébés ; moi, j'attends juste qu'une cigogne m'apporte ton numéro.", en: "According to legend, storks bring babies; me, I'm just waiting for a stork to bring me your number.", altEs: ["Selon la légende, ce sont les cigognes qui apportent les bébés ; moi, j'attends juste qu'une cigogne m'apporte ton numéro."], grammar: [g.subjonctif-volonte], vocab: [w.cigogne] }
      - { es: "La sorcière lui fit boire une potion, et il tomba amoureux de la première personne qu'il vit : moi.", en: "The witch made him drink a potion, and he fell in love with the first person he saw: me.", altEs: ["La sorcière lui a fait boire une potion, et il est tombé amoureux de la première personne qu'il a vue : moi."], grammar: [g.passe-simple-recognition, g.faire-causatif], vocab: [w.sorcière] }
      - { es: "Le loup ne mangea pas le petit chaperon rouge : il l'invita à dîner, ce qui était beaucoup plus malin.", en: "The wolf didn't eat Little Red Riding Hood: he asked her out to dinner, which was much smarter.", altEs: ["Le loup n'a pas mangé le petit chaperon rouge : il l'a invitée à dîner, ce qui était beaucoup plus malin."], grammar: [g.passe-simple-recognition, g.ce-qui-ce-que], vocab: [w.loup] }
  - id: b2.u11.l2
    title: Je fais réparer la toiture
    teach: [g.faire-causatif]
    vocab: [w.faire-réparer, w.réparation, w.toiture, w.plombier, w.électricien, w.mécanicien, w.garagiste, w.coiffeur, w.se-faire-couper-les-cheveux, w.faire-venir, w.devis, w.chantier, w.pressing, w.cordonnier, w.tailleur, w.couturier, w.retoucher, w.déléguer, w.nettoyage, w.entretenir, w.robinet, w.ampoule, w.repasser]
    tip: "Faire + infinitive means you get someone else to do it: je fais réparer ma voiture. Se faire + infinitive is for yourself: je me suis fait couper les cheveux. Pronouns go before faire, and fait doesn't agree here."
    sentences:
      - { es: "Je vais faire réparer la toiture avant l'hiver.", en: "I'm going to have the roof repaired before winter.", altEs: ["Je vais faire refaire la toiture avant l'hiver."], grammar: [g.faire-causatif, g.futur-proche], vocab: [w.faire-réparer, w.toiture] }
      - { es: "On a fait venir un plombier : le robinet de la cuisine fuyait depuis une semaine.", en: "We called out a plumber: the kitchen tap had been leaking for a week.", altEs: ["Nous avons fait venir un plombier : le robinet de la cuisine fuyait depuis une semaine."], grammar: [g.faire-causatif], vocab: [w.faire-venir, w.plombier, w.robinet] }
      - { es: "Elle s'est fait couper les cheveux très court pour l'été.", en: "She had her hair cut very short for the summer.", altEs: ["Elle s'est fait couper les cheveux très courts pour l'été."], grammar: [g.faire-causatif, g.pronominal-passe-compose], vocab: [w.se-faire-couper-les-cheveux] }
      - { es: "Mon coiffeur me fait toujours rire avec ses histoires de clients.", en: "My hairdresser always makes me laugh with his stories about customers.", altEs: ["Ma coiffeuse me fait toujours rire avec ses histoires de clients."], grammar: [g.faire-causatif], vocab: [w.coiffeur, w.rire] }
      - { es: "Avant de commencer le chantier, faites-vous faire plusieurs devis.", en: "Before starting the building work, get several quotes done.", altEs: ["Avant de commencer les travaux, demandez plusieurs devis."], grammar: [g.faire-causatif, g.imperative], vocab: [w.chantier, w.devis] }
      - { es: "J'ai fait installer une nouvelle ampoule par l'électricien ; je n'osais pas toucher aux fils.", en: "I had the electrician put in a new bulb; I didn't dare touch the wires.", altEs: ["J'ai fait installer une nouvelle ampoule par l'électricien, je n'osais pas toucher aux fils."], grammar: [g.faire-causatif], vocab: [w.ampoule, w.électricien] }
      - { es: "Le mécanicien a fait attendre ma mère deux heures au garage.", en: "The mechanic kept my mother waiting for two hours at the garage.", altEs: ["Le mécanicien a fait patienter ma mère deux heures au garage."], grammar: [g.faire-causatif], vocab: [w.mécanicien, w.garage] }
      - { es: "Ma robe est trop longue ; je vais la faire retoucher par une couturière.", en: "My dress is too long; I'm going to have it altered by a dressmaker.", altEs: ["Ma robe est trop longue, je vais la faire retoucher chez la couturière."], grammar: [g.faire-causatif, g.direct-object-pronouns], vocab: [w.retoucher, w.couturier] }
      - { es: "Tu as fait nettoyer ton costume au pressing ?", en: "Did you have your suit cleaned at the dry cleaner's?", altEs: ["Tu as fait nettoyer ton costume chez le teinturier ?"], grammar: [g.faire-causatif], vocab: [w.pressing, w.costume] }
      - { es: "Mon grand-père se faisait faire tous ses costumes chez un tailleur de Colmar.", en: "My grandfather used to have all his suits made by a tailor in Colmar.", altEs: ["Mon grand-père faisait faire tous ses costumes chez un tailleur de Colmar."], grammar: [g.faire-causatif, g.imparfait-uses], vocab: [w.tailleur, w.costume] }
      - { es: "Le patron délègue tout : il fait faire les réparations par son apprenti.", en: "The boss delegates everything: he has his apprentice do the repairs.", altEs: ["Le patron délègue tout, il fait faire les réparations à son apprenti."], grammar: [g.faire-causatif], vocab: [w.déléguer, w.réparation] }
      - { es: "Pour bien entretenir une maison à colombages, il faut faire vérifier le bois tous les ans.", en: "To look after a half-timbered house properly, you have to have the wood checked every year.", altEs: ["Pour bien entretenir une maison à colombages, il faut faire contrôler le bois chaque année."], grammar: [g.faire-causatif, g.il-faut], vocab: [w.entretenir, w.colombage] }
      - { es: "Le garagiste répare ma voiture.", en: "The garage owner is repairing my car.", grammar: [g.faire-causatif], vocab: [w.garagiste], transform: { instruction: "Say that you're having it done: Je fais…", answer: "Je fais réparer ma voiture par le garagiste.", alt: ["Je fais réparer ma voiture chez le garagiste.", "Je fais réparer ma voiture."], en: "I'm having my car repaired by the garage owner." } }
      - { es: "Je fais nettoyer les vitres une fois par mois.", en: "I have the windows cleaned once a month.", grammar: [g.faire-causatif], vocab: [w.nettoyage], transform: { instruction: "Replace les vitres with a pronoun", answer: "Je les fais nettoyer une fois par mois.", en: "I have them cleaned once a month." } }
      - { es: "La maison qu'il a fait construire est magnifique.", en: "The house he had built is magnificent.", grammar: [g.faire-causatif], vocab: [w.construire], error: { wrong: "La maison qu'il a faite construire est magnifique.", explain: "Fait followed by an infinitive never agrees: la maison qu'il a fait construire.", grammar: g.faire-causatif } }
      - { es: "Je le fais réparer demain.", en: "I'm having it repaired tomorrow.", altEs: ["Je la fais réparer demain."], grammar: [g.faire-causatif, g.direct-object-pronouns], vocab: [w.faire-réparer], error: { wrong: "Je fais le réparer demain.", explain: "Object pronouns go before faire, not between faire and the infinitive: je le fais réparer.", grammar: g.faire-causatif } }
    exchanges:
      - q: { es: "Tu as changé de coiffure ?", en: "Have you changed your hairstyle?" }
        a: { es: "Oui, je me suis fait couper les cheveux hier ; ça te plaît ?", en: "Yes, I had my hair cut yesterday; do you like it?" }
        alt: ["Oui, je suis allée chez le coiffeur.", "Oui, je me les suis fait couper."]
        grammar: [g.faire-causatif]
        vocab: [w.se-faire-couper-les-cheveux]
      - q: { es: "Qui va réparer la fuite ?", en: "Who's going to fix the leak?" }
        a: { es: "Je vais faire venir le plombier demain matin.", en: "I'm going to get the plumber out tomorrow morning." }
        alt: ["Le plombier, demain.", "Je vais la réparer moi-même."]
        grammar: [g.faire-causatif]
        vocab: [w.faire-venir, w.plombier]
      - q: { es: "Combien coûte la réparation ?", en: "How much does the repair cost?" }
        a: { es: "Je ne sais pas encore ; j'ai fait faire un devis.", en: "I don't know yet; I've had a quote done." }
        alt: ["Le devis dit huit cents euros.", "Trop cher, à mon avis."]
        grammar: [g.faire-causatif]
        vocab: [w.réparation, w.devis]
      - q: { es: "Tu repasses tes chemises toi-même ?", en: "Do you iron your shirts yourself?" }
        a: { es: "Non, je les fais repasser au pressing en bas de chez moi.", en: "No, I have them ironed at the dry cleaner's downstairs." }
        alt: ["Non, je les fais repasser.", "Oui, malheureusement."]
        grammar: [g.faire-causatif, g.direct-object-pronouns]
        vocab: [w.pressing, w.repasser]
      - q: { es: "Qui a refait la toiture de cette maison ?", en: "Who redid the roof of this house?" }
        a: { es: "Les propriétaires l'ont fait refaire par une entreprise de Colmar.", en: "The owners had it redone by a firm from Colmar." }
        alt: ["Une entreprise de Colmar.", "Ils l'ont fait refaire l'an dernier."]
        grammar: [g.faire-causatif]
        vocab: [w.toiture, w.entreprise]
    texts:
      - title: "Liste de choses à faire"
        es: ["Faire réparer le robinet de la salle de bains.", "Faire retoucher le pantalon gris.", "Faire venir l'électricien pour la lampe du salon."]
        en: ["Get the bathroom tap fixed.", "Get the grey trousers altered.", "Call out the electrician for the living-room lamp."]
        grammar: [g.faire-causatif]
        vocab: [w.faire-réparer, w.retoucher, w.électricien]
      - title: "Message d'un voisin"
        es: ["Bonjour, nous faisons refaire notre toiture à partir de lundi.", "Le chantier fera un peu de bruit pendant deux semaines.", "Nous vous prions de nous excuser pour la gêne."]
        en: ["Hello, we're having our roof redone from Monday.", "The building work will make some noise for two weeks.", "We apologise for the inconvenience."]
        grammar: [g.faire-causatif]
        vocab: [w.toiture, w.chantier]
    spicy:
      - { es: "Tu me fais rire, tu me fais rougir, et maintenant tu me fais attendre ?", en: "You make me laugh, you make me blush, and now you're keeping me waiting?", altEs: ["Tu me fais rire, tu me fais rougir et maintenant tu me fais attendre ?"], grammar: [g.faire-causatif], vocab: [w.rougir, w.attendre] }
      - { es: "Je me suis fait couper les cheveux juste pour toi ; tu n'as rien remarqué.", en: "I got my hair cut just for you; you didn't notice a thing.", altEs: ["Je me suis fait couper les cheveux rien que pour toi, et tu n'as rien remarqué."], grammar: [g.faire-causatif], vocab: [w.se-faire-couper-les-cheveux, w.remarquer] }
      - { es: "Mon robinet fuit encore… tu ne connaîtrais pas un plombier charmant et célibataire ?", en: "My tap is leaking again… you wouldn't know a charming, single plumber, would you?", altEs: ["Mon robinet fuit encore… Tu ne connaîtrais pas un plombier charmant et célibataire ?"], grammar: [g.conditional-politeness], vocab: [w.robinet, w.plombier] }
      - { es: "Il m'a fait visiter tout Colmar en barque, et j'ai fait semblant d'avoir peur de l'eau.", en: "He showed me all of Colmar by boat, and I pretended to be afraid of the water.", altEs: ["Il m'a fait visiter Colmar en barque, et j'ai fait semblant d'avoir peur de l'eau."], grammar: [g.faire-causatif], vocab: [w.barque] }
      - { es: "Je ne délègue pas tout : les bisous, je les fais moi-même.", en: "I don't delegate everything: the kisses, I do myself.", altEs: ["Je ne délègue pas tout ; les bisous, je m'en occupe moi-même."], grammar: [g.dislocation], vocab: [w.déléguer, w.bisou] }
  - id: b2.u11.l3
    title: Laisse tomber, j'appelle la dépanneuse
    teach: [g.laisser-infinitive]
    vocab: [w.laisser-tomber, w.tenter, w.tentative, w.marteau, w.clou, w.vis, w.tournevis, w.perceuse, w.bricolage, w.bricoler, w.panne, w.tomber-en-panne, w.dépanner, w.dépanneuse, w.pneu, w.crevaison, w.garage, w.révision, w.percer, w.trou]
    tip: "Laisser + infinitive means to let something happen: laisse-moi faire, il laisse dormir le chat. Compare: il me fait partir (he makes me leave) / il me laisse partir (he lets me leave). Laisser tomber = to drop, or to give up."
    sentences:
      - { es: "Laisse-moi faire, je sais me servir d'une perceuse.", en: "Let me do it, I know how to use a drill.", altEs: ["Laisse-moi faire : je sais utiliser une perceuse."], grammar: [g.laisser-infinitive, g.imperative-with-pronouns], vocab: [w.perceuse] }
      - { es: "J'ai laissé tomber le marteau sur mon pied !", en: "I dropped the hammer on my foot!", altEs: ["J'ai fait tomber le marteau sur mon pied !"], grammar: [g.laisser-infinitive], vocab: [w.laisser-tomber, w.marteau] }
      - { es: "Laisse tomber, ce n'est pas grave ; on achètera une autre étagère.", en: "Forget it, it doesn't matter; we'll buy another shelf.", altEs: ["Laisse tomber, c'est pas grave ; on achètera une autre étagère."], grammar: [g.laisser-infinitive], vocab: [w.laisser-tomber, w.étagère] }
      - { es: "Après trois tentatives, il a laissé tomber le bricolage pour de bon.", en: "After three attempts, he gave up DIY for good.", altEs: ["Après trois essais, il a laissé tomber le bricolage pour de bon."], grammar: [g.laisser-infinitive], vocab: [w.tentative, w.bricolage] }
      - { es: "Notre voiture est tombée en panne au milieu de la route des vins.", en: "Our car broke down in the middle of the wine route.", altEs: ["La voiture est tombée en panne au beau milieu de la route des vins."], grammar: [g.passe-compose-etre], vocab: [w.tomber-en-panne, w.route-des-vins] }
      - { es: "Le garagiste nous a laissés attendre dans son bureau pendant qu'il changeait le pneu.", en: "The garage owner let us wait in his office while he changed the tyre.", altEs: ["Le garagiste nous a laissé attendre dans son bureau pendant qu'il changeait le pneu."], grammar: [g.laisser-infinitive], vocab: [w.garagiste, w.pneu] }
      - { es: "Ne laisse pas les enfants jouer avec le tournevis.", en: "Don't let the children play with the screwdriver.", altEs: ["Ne laisse pas les enfants jouer avec le tournevis !"], grammar: [g.laisser-infinitive, g.imperative], vocab: [w.tournevis] }
      - { es: "Il faut percer un trou dans le mur pour mettre la vis.", en: "You need to drill a hole in the wall to put the screw in.", altEs: ["Il faut faire un trou dans le mur pour mettre la vis."], grammar: [g.il-faut, g.purpose-clauses], vocab: [w.percer, w.trou, w.vis] }
      - { es: "Mon frère adore bricoler : il ne laisse jamais personne toucher à ses outils.", en: "My brother loves doing DIY: he never lets anyone touch his tools.", altEs: ["Mon frère adore bricoler, il ne laisse jamais personne toucher à ses outils."], grammar: [g.laisser-infinitive, g.negation-jamais-plus-rien], vocab: [w.bricoler, w.outil] }
      - { es: "Un passant très gentil nous a dépannés en dix minutes.", en: "A very kind passer-by got us going again in ten minutes.", altEs: ["Un passant très sympa nous a dépannés en dix minutes."], grammar: [g.pc-object-agreement], vocab: [w.dépanner, w.passant] }
      - { es: "Si tu ne fais pas la révision, ne t'étonne pas de tomber en panne.", en: "If you don't get the car serviced, don't be surprised when it breaks down.", altEs: ["Si tu ne fais pas faire la révision, ne t'étonne pas de tomber en panne."], grammar: [g.si-present-futur], vocab: [w.révision, w.s-étonner] }
      - { es: "Laissez-vous tenter par une petite pause dans la Petite Venise !", en: "Go on, treat yourself to a little break in Little Venice!", altEs: ["Laissez-vous tenter par une pause dans la Petite Venise !"], grammar: [g.laisser-infinitive], vocab: [w.tenter, w.petite-venise.nm] }
      - { es: "Le mécanicien me fait payer cent euros pour la révision.", en: "The mechanic is making me pay a hundred euros for the service.", grammar: [g.laisser-infinitive, g.faire-causatif], vocab: [w.mécanicien, w.révision], transform: { instruction: "Say he lets you pay later: Le mécanicien me laisse…", answer: "Le mécanicien me laisse payer plus tard.", en: "The mechanic lets me pay later." } }
      - { es: "Le chat dort sur le canapé ; je ne le réveille pas.", en: "The cat is sleeping on the sofa; I don't wake it.", grammar: [g.laisser-infinitive], vocab: [w.chat, w.canapé], transform: { instruction: "Say you let the cat sleep (laisser + infinitive)", answer: "Je laisse dormir le chat sur le canapé.", alt: ["Je laisse le chat dormir sur le canapé.", "Je le laisse dormir sur le canapé."], en: "I let the cat sleep on the sofa." } }
      - { es: "On a appelé la dépanneuse, et elle nous a laissés monter dans la cabine.", en: "We called the breakdown truck, and they let us ride in the cab.", altEs: ["On a appelé la dépanneuse, et le chauffeur nous a laissés monter dans la cabine."], grammar: [g.laisser-infinitive], vocab: [w.dépanneuse, w.monter] }
      - { es: "Laisse-moi t'aider.", en: "Let me help you.", altEs: ["Laisse-moi te donner un coup de main."], grammar: [g.laisser-infinitive, g.imperative-with-pronouns], vocab: [w.aider], error: { wrong: "Laisse-je t'aider.", explain: "After the imperative laisse, use the stressed pronoun moi: laisse-moi t'aider.", grammar: g.laisser-infinitive } }
    exchanges:
      - q: { es: "Tu veux que je t'aide à monter l'étagère ?", en: "Do you want me to help you put up the shelf?" }
        a: { es: "Non, laisse-moi faire ; j'ai la perceuse et les vis.", en: "No, let me do it; I've got the drill and the screws." }
        alt: ["Oui, volontiers !", "Non merci, laisse-moi faire."]
        grammar: [g.laisser-infinitive]
        vocab: [w.perceuse, w.vis]
      - q: { es: "Qu'est-ce qui s'est passé avec la voiture ?", en: "What happened with the car?" }
        a: { es: "Crevaison sur l'autoroute ; on a dû faire venir une dépanneuse.", en: "A puncture on the motorway; we had to call out a breakdown truck." }
        alt: ["Elle est tombée en panne.", "Un pneu crevé, rien de grave."]
        grammar: [g.faire-causatif]
        vocab: [w.crevaison, w.dépanneuse]
      - q: { es: "Tu fais encore du bricolage ?", en: "Are you still doing DIY?" }
        a: { es: "Non, j'ai laissé tomber après avoir percé un tuyau.", en: "No, I gave up after drilling through a pipe." }
        alt: ["Non, j'ai laissé tomber.", "Oui, le dimanche."]
        grammar: [g.laisser-infinitive]
        vocab: [w.bricolage, w.laisser-tomber]
      - q: { es: "Le garagiste t'a laissé partir sans payer ?", en: "Did the garage owner let you leave without paying?" }
        a: { es: "Oui, il me connaît ; il m'a laissé payer la semaine suivante.", en: "Yes, he knows me; he let me pay the following week." }
        alt: ["Oui, il me fait confiance.", "Non, j'ai payé tout de suite."]
        grammar: [g.laisser-infinitive]
        vocab: [w.garagiste]
      - q: { es: "Tu as un tournevis ?", en: "Have you got a screwdriver?" }
        a: { es: "Dans la boîte à outils, avec le marteau et les clous.", en: "In the toolbox, with the hammer and the nails." }
        alt: ["Oui, dans le garage.", "Non, demande au voisin."]
        grammar: [g.prepositions-place]
        vocab: [w.tournevis, w.marteau, w.clou]
    texts:
      - title: "Message au garage"
        es: ["Bonjour, ma voiture est tombée en panne près de Riquewihr.", "Pouvez-vous envoyer une dépanneuse ?", "Je laisse les clés au café du village, laissez-moi un message quand c'est réparé."]
        en: ["Hello, my car has broken down near Riquewihr.", "Can you send a breakdown truck?", "I'm leaving the keys at the village café; leave me a message when it's fixed."]
        grammar: [g.laisser-infinitive]
        vocab: [w.tomber-en-panne, w.dépanneuse]
      - title: "Conseil de bricoleur"
        es: ["Avant de percer, vérifiez qu'aucun câble ne passe dans le mur.", "Laissez la perceuse refroidir entre deux trous.", "Et si ça ne marche pas, laissez tomber : appelez un professionnel !"]
        en: ["Before drilling, check that no cable runs through the wall.", "Let the drill cool down between two holes.", "And if it doesn't work, give up: call a professional!"]
        grammar: [g.laisser-infinitive, g.imperative]
        vocab: [w.percer, w.perceuse, w.laisser-tomber]
    spicy:
      - { es: "Laisse-moi deviner : tu es tombé en panne exprès devant ma maison ?", en: "Let me guess: you broke down on purpose in front of my house?", altEs: ["Laisse-moi deviner : tu es tombé en panne exprès devant chez moi ?"], grammar: [g.laisser-infinitive], vocab: [w.tomber-en-panne, w.deviner] }
      - { es: "Je me suis laissé convaincre de prendre un dernier verre… puis un autre.", en: "I let myself be talked into one last drink… then another.", altEs: ["Je me suis laissée convaincre de prendre un dernier verre… puis un autre."], grammar: [g.laisser-infinitive], vocab: [w.convaincre] }
      - { es: "Il ne sait pas planter un clou, mais il sait me faire rire : je le garde.", en: "He can't knock in a nail, but he knows how to make me laugh: I'm keeping him.", altEs: ["Il ne sait pas planter un clou, mais il me fait rire : je le garde."], grammar: [g.faire-causatif], vocab: [w.clou] }
      - { es: "Laissez-vous tenter : un kougelhopf, deux cuillères, une seule table.", en: "Go on, treat yourself: one kugelhopf, two spoons, a single table.", altEs: ["Laissez-vous tenter : un kougelhopf, deux cuillères et une seule table."], grammar: [g.laisser-infinitive], vocab: [w.tenter, w.kougelhopf] }
      - { es: "Ma tentative de séduction avec une perceuse a échoué ; la prochaine fois, j'essaierai les fleurs.", en: "My attempt at seduction with a power drill failed; next time, I'll try flowers.", altEs: ["Ma tentative de séduction avec une perceuse a raté ; la prochaine fois, j'essaierai les fleurs."], grammar: [g.futur-simple-forms], vocab: [w.tentative, w.perceuse] }
  - id: b2.u11.l4
    title: Bartholdi fit construire une statue
    teach: [g.passe-simple-recognition, g.faire-causatif]
    vocab: [w.barque, w.batelier, w.petite-venise.nm, w.statue-de-la-liberté.nm, w.natal, w.kougelhopf, w.lion, w.ramer]
    tip: "Biographies and history books mix the passé simple with faire + infinitive: Bartholdi naquit à Colmar… il fit construire… Read il fit faire as 'he had (something) made'."
    sentences:
      - { es: "Auguste Bartholdi naquit à Colmar en 1834.", en: "Auguste Bartholdi was born in Colmar in 1834.", altEs: ["Auguste Bartholdi est né à Colmar en 1834."], grammar: [g.passe-simple-recognition], vocab: [w.naître] }
      - { es: "Il devint sculpteur et réalisa la statue de la Liberté, inaugurée à New York en 1886.", en: "He became a sculptor and created the Statue of Liberty, unveiled in New York in 1886.", altEs: ["Il est devenu sculpteur et a réalisé la statue de la Liberté, inaugurée à New York en 1886."], grammar: [g.passe-simple-recognition], vocab: [w.sculpteur, w.statue-de-la-liberté.nm, w.inaugurer] }
      - { es: "Sa maison natale est aujourd'hui un musée consacré à son œuvre.", en: "His birthplace is now a museum devoted to his work.", altEs: ["La maison où il est né est aujourd'hui un musée consacré à son œuvre."], grammar: [g.adjective-agreement], vocab: [w.natal, w.œuvre] }
      - { es: "Il fit aussi le célèbre Lion de Belfort, taillé dans la roche.", en: "He also made the famous Lion of Belfort, carved into the rock.", altEs: ["Il a aussi fait le célèbre Lion de Belfort, taillé dans la roche."], grammar: [g.passe-simple-recognition, g.participial-clauses], vocab: [w.lion, w.roche] }
      - { es: "Pour sa ville natale, il réalisa plusieurs fontaines, dont la fontaine Schwendi.", en: "For his home town, he created several fountains, including the Schwendi fountain.", altEs: ["Pour sa ville natale, il a réalisé plusieurs fontaines, dont la fontaine Schwendi."], grammar: [g.passe-simple-recognition, g.relative-dont], vocab: [w.natal, w.fontaine] }
      - { es: "En 2004, cent ans après sa mort, Colmar fit installer une réplique de la statue à l'entrée de la ville.", en: "In 2004, a hundred years after his death, Colmar had a replica of the statue put up at the entrance to the town.", altEs: ["En 2004, cent ans après sa mort, Colmar a fait installer une réplique de la statue à l'entrée de la ville."], grammar: [g.passe-simple-recognition, g.faire-causatif], vocab: [w.statue, w.entrée] }
      - { es: "Dans la Petite Venise, un batelier nous fit découvrir les maisons à colombages depuis la Lauch.", en: "In Little Venice, a boatman showed us the half-timbered houses from the Lauch.", altEs: ["Dans la Petite Venise, un batelier nous a fait découvrir les maisons à colombages depuis la Lauch."], grammar: [g.passe-simple-recognition, g.faire-causatif], vocab: [w.batelier, w.petite-venise.nm, w.colombage] }
      - { es: "On loue une barque pour une demi-heure ? Je te laisse ramer.", en: "Shall we hire a boat for half an hour? I'll let you row.", altEs: ["On loue une barque pour une demi-heure ? Je te laisse ramer, hein."], grammar: [g.laisser-infinitive], vocab: [w.barque, w.louer] }
      - { es: "Autrefois, les maraîchers transportaient leurs légumes en barque jusqu'au marché.", en: "In the past, market gardeners carried their vegetables by boat to the market.", altEs: ["Autrefois, les maraîchers apportaient leurs légumes en barque jusqu'au marché."], grammar: [g.imparfait-uses], vocab: [w.transporter, w.légume] }
      - { es: "La boulangère me fit goûter un kougelhopf encore tiède.", en: "The baker had me taste a still-warm kugelhopf.", altEs: ["La boulangère m'a fait goûter un kougelhopf encore tiède."], grammar: [g.passe-simple-recognition, g.faire-causatif], vocab: [w.kougelhopf, w.goûter] }
      - { es: "Le roi fit venir les meilleurs artistes du pays.", en: "The king summoned the best artists in the country.", altEs: ["Le roi a fait venir les meilleurs artistes du pays."], grammar: [g.passe-simple-recognition, g.faire-causatif], vocab: [w.faire-venir, w.artiste] }
      - { es: "Les ducs firent construire des châteaux forts sur les collines des Vosges.", en: "The dukes had fortified castles built on the hills of the Vosges.", altEs: ["Les ducs ont fait construire des châteaux forts sur les collines des Vosges."], grammar: [g.passe-simple-recognition, g.faire-causatif], vocab: [w.château-fort, w.construire] }
      - { es: "Bartholdi mourut à Paris en 1904.", en: "Bartholdi died in Paris in 1904.", grammar: [g.passe-simple-recognition], vocab: [w.mourir], transform: { instruction: "Rewrite in the passé composé", answer: "Bartholdi est mort à Paris en 1904.", en: "Bartholdi died in Paris in 1904." } }
      - { es: "Ils vinrent à Colmar et virent la statue.", en: "They came to Colmar and saw the statue.", grammar: [g.passe-simple-recognition], vocab: [w.venir, w.voir], transform: { instruction: "Rewrite in the passé composé", answer: "Ils sont venus à Colmar et ont vu la statue.", en: "They came to Colmar and saw the statue." } }
      - { es: "Il fit faire une copie de la statue.", en: "He had a copy of the statue made.", grammar: [g.passe-simple-recognition, g.faire-causatif], vocab: [w.statue], note: "fit = passé simple of faire: he had something made." , error: { wrong: "Il fit une copie de la statue faire.", explain: "The infinitive follows faire directly: il fit faire une copie.", grammar: g.faire-causatif } }
      - { es: "Elle se laissa convaincre et monta dans la barque.", en: "She let herself be persuaded and got into the boat.", altEs: ["Elle s'est laissé convaincre et est montée dans la barque."], grammar: [g.passe-simple-recognition, g.laisser-infinitive], vocab: [w.convaincre, w.barque] }
    exchanges:
      - q: { es: "Qui a sculpté la statue de la Liberté ?", en: "Who sculpted the Statue of Liberty?" }
        a: { es: "Auguste Bartholdi, un enfant de Colmar.", en: "Auguste Bartholdi, a son of Colmar." }
        alt: ["Bartholdi.", "Un sculpteur né à Colmar, Auguste Bartholdi."]
        grammar: [g.passe-simple-recognition]
        vocab: [w.statue-de-la-liberté.nm, w.sculpteur]
      - q: { es: "On peut visiter sa maison natale ?", en: "Can you visit his birthplace?" }
        a: { es: "Oui, c'est le musée Bartholdi, au centre-ville.", en: "Yes, it's the Bartholdi museum, in the town centre." }
        alt: ["Oui, c'est devenu un musée.", "Oui, en plein centre."]
        grammar: [g.c-est-il-est]
        vocab: [w.natal]
      - q: { es: "C'est quoi, la Petite Venise ?", en: "What's Little Venice?" }
        a: { es: "Un quartier de Colmar où l'on se promène en barque entre les maisons colorées.", en: "A district of Colmar where you go on boat rides between colourful houses." }
        alt: ["Un quartier au bord de l'eau.", "Le plus joli quartier de Colmar."]
        grammar: [g.relative-ou]
        vocab: [w.petite-venise.nm, w.barque]
      - q: { es: "Tu as goûté le kougelhopf ?", en: "Did you try the kugelhopf?" }
        a: { es: "Oui, la boulangère m'en a fait goûter un morceau ; je me suis laissé tenter.", en: "Yes, the baker let me try a piece; I gave in to temptation." }
        alt: ["Oui, délicieux !", "Pas encore, je me laisserai tenter demain."]
        grammar: [g.faire-causatif, g.laisser-infinitive]
        vocab: [w.kougelhopf, w.tenter]
      - q: { es: "« Il naquit », ça veut dire quoi ?", en: "What does 'il naquit' mean?" }
        a: { es: "C'est le passé simple de « naître » : il est né.", en: "It's the passé simple of 'naître': he was born." }
        alt: ["Il est né.", "Ça vient de « naître »."]
        grammar: [g.passe-simple-recognition]
        vocab: [w.naître]
    texts:
      - title: "Biographie"
        es: ["Auguste Bartholdi naquit à Colmar le 2 août 1834.", "Il fit ses études à Paris et devint sculpteur.", "Il conçut la statue de la Liberté, que la France offrit aux États-Unis.", "Il mourut en 1904."]
        en: ["Auguste Bartholdi was born in Colmar on 2 August 1834.", "He studied in Paris and became a sculptor.", "He designed the Statue of Liberty, which France gave to the United States.", "He died in 1904."]
        grammar: [g.passe-simple-recognition]
        vocab: [w.sculpteur, w.statue-de-la-liberté.nm]
      - title: "Promenade en barque"
        es: ["Départ toutes les vingt minutes depuis le pont de la Petite Venise.", "Laissez-vous guider par nos bateliers.", "Durée : une demi-heure, au fil de la Lauch."]
        en: ["Departures every twenty minutes from the Little Venice bridge.", "Let our boatmen guide you.", "Duration: half an hour, along the Lauch."]
        grammar: [g.laisser-infinitive]
        vocab: [w.batelier, w.barque]
    spicy:
      - { es: "Le batelier nous fit passer sous un pont très bas ; nous fûmes obligés de nous serrer l'un contre l'autre.", en: "The boatman took us under a very low bridge; we were forced to squeeze up against each other.", altEs: ["Le batelier nous a fait passer sous un pont très bas ; on a été obligés de se serrer l'un contre l'autre."], grammar: [g.passe-simple-recognition, g.faire-causatif], vocab: [w.batelier] }
      - { es: "Je te laisse ramer, et moi, je te regarde ; c'est un partage équitable.", en: "I'll let you row, and I'll watch you; that's a fair division of labour.", altEs: ["Je te laisse ramer et moi, je te regarde : c'est un partage équitable."], grammar: [g.laisser-infinitive], vocab: [w.barque] }
      - { es: "Bartholdi fit une statue de la Liberté ; toi, tu m'as fait perdre la mienne.", en: "Bartholdi made a statue of Liberty; you made me lose mine.", altEs: ["Bartholdi a fait une statue de la Liberté ; toi, tu m'as fait perdre la mienne."], grammar: [g.passe-simple-recognition, g.faire-causatif, g.possessive-pronouns], vocab: [w.statue] }
      - { es: "Elle me fit goûter son kougelhopf, puis elle me fit promettre de revenir dimanche.", en: "She had me taste her kugelhopf, then made me promise to come back on Sunday.", altEs: ["Elle m'a fait goûter son kougelhopf, puis elle m'a fait promettre de revenir dimanche."], grammar: [g.passe-simple-recognition, g.faire-causatif], vocab: [w.kougelhopf, w.promettre] }
      - { es: "Ne me laisse pas rentrer seule par les petites rues de Colmar… elles sont si romantiques.", en: "Don't let me go home alone through the little streets of Colmar… they're so romantic.", altEs: ["Ne me laisse pas rentrer toute seule par les petites rues de Colmar… elles sont tellement romantiques."], grammar: [g.laisser-infinitive], vocab: [w.romantique] }
dialogues:
  - id: b2.u11.d1
    title: Panne dans la Petite Venise
    context: Léa and Nicolas are visiting Colmar when their car breaks down. A garage owner helps them out.
    lines:
      - { speaker: Léa, es: "Ça y est, la voiture ne démarre plus. On est tombés en panne en plein centre !", en: "That's it, the car won't start. We've broken down right in the centre!" }
      - { speaker: Nicolas, es: "Laisse-moi regarder… Bon, je n'y connais rien. On fait venir une dépanneuse ?", en: "Let me have a look… Well, I know nothing about it. Shall we call a breakdown truck?" }
      - { speaker: Garagiste, es: "Bonjour ! Je vous ai vus depuis mon garage. C'est la batterie, sûrement.", en: "Hello! I saw you from my garage. It's the battery, probably." }
      - { speaker: Léa, es: "Vous pourriez la faire réparer aujourd'hui ? On repart demain matin.", en: "Could you get it fixed today? We're leaving tomorrow morning." }
      - { speaker: Garagiste, es: "Je vais la changer moi-même. Laissez-moi les clés et revenez dans deux heures.", en: "I'll change it myself. Leave me the keys and come back in two hours." }
      - { speaker: Nicolas, es: "Parfait. Qu'est-ce qu'on peut faire en attendant ?", en: "Perfect. What can we do in the meantime?" }
      - { speaker: Garagiste, es: "Faites-vous promener en barque dans la Petite Venise. Et goûtez le kougelhopf de la boulangerie d'en face !", en: "Take a boat ride in Little Venice. And try the kugelhopf from the bakery opposite!" }
      - { speaker: Léa, es: "On se laisse tenter. Vous nous faites un devis pour la batterie ?", en: "We'll give in to temptation. Will you do us a quote for the battery?" }
      - { speaker: Garagiste, es: "Pas besoin : cent vingt euros, main-d'œuvre comprise.", en: "No need: a hundred and twenty euros, labour included." }
      - { speaker: Nicolas, es: "Finalement, cette panne, c'est un vrai conte de fées !", en: "In the end, this breakdown is a real fairy tale!" }
    questions:
      - { q: "Quel est le problème de la voiture, selon le garagiste ?", options: ["Un pneu crevé", "La batterie", "Les freins"], answer: 1, explain: "C'est la batterie, sûrement." }
      - { q: "Que doivent faire Léa et Nicolas pendant la réparation ?", options: ["Attendre au garage", "Laisser les clés et revenir dans deux heures", "Appeler une dépanneuse"], answer: 1, explain: "Laissez-moi les clés et revenez dans deux heures." }
      - { q: "Que leur conseille le garagiste ?", options: ["Une promenade en barque et un kougelhopf", "Une visite du musée Bartholdi", "Un hôtel près du garage"], answer: 0, explain: "Faites-vous promener en barque… goûtez le kougelhopf." }
      - { q: "Combien coûte la réparation ?", options: ["Vingt euros", "Cent vingt euros", "Deux cents euros"], answer: 1, explain: "Cent vingt euros, main-d'œuvre comprise." }
