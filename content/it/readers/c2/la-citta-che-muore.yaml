id: r.c2.la-citta-che-muore
level: c2
title: La città che muore e i suoi visitatori
kind: text
intro: "An opinion piece on Civita di Bagnoregio, the hilltop village in northern Lazio that is slowly crumbling away – and that has become, almost by paradox, a tourist success. Follow how the writer builds an argument (c2.u04): a striking opening, concessions, rhetorical questions, a reversal and a closing image."
allow: [civita, bagnoregio, bonaventura, lazio, viterbo, tevere, orvieto, instagram, selfie, borgo, borghi]
paragraphs:
  - { es: "La chiamano «la città che muore», e il soprannome, bisogna ammetterlo, è un capolavoro di comunicazione. Nessuno andrebbe a vedere un paese che sta semplicemente invecchiando; tutti vogliono vedere un paese che sta scomparendo. Civita di Bagnoregio, nel nord del Lazio, a pochi chilometri dal confine con l'Umbria, è appunto questo: un borgo medievale costruito in cima a una collina di tufo che, anno dopo anno, si sgretola sotto i suoi piedi. Chi lo vede per la prima volta dal belvedere, sospeso nel vuoto in mezzo a una valle di calanchi grigi, capisce subito perché tanti fotografi lo amino.", en: "They call it 'the dying town', and the nickname, it must be admitted, is a masterpiece of communication. Nobody would go and see a village that is simply growing old; everyone wants to see a village that is disappearing. Civita di Bagnoregio, in northern Lazio, a few kilometres from the border with Umbria, is exactly that: a medieval village built on top of a hill of tuff which, year after year, is crumbling beneath its feet. Anyone who sees it for the first time from the viewpoint, suspended in mid-air in the middle of a valley of grey badlands, immediately understands why so many photographers love it." }
  - { es: "Il motivo è geologico. Il tufo, una roccia vulcanica relativamente morbida, poggia su uno strato di argilla che la pioggia e i torrenti erodono continuamente. Ogni tanto un pezzo di collina si stacca e precipita nella valle, portando con sé quello che c'era sopra: un orto, un muro, a volte una casa. Nei secoli Civita ha perso intere strade, e la sua parte più antica si è ridotta a un nucleo di poche vie, collegato al resto del mondo da un lungo ponte che si percorre soltanto a piedi.", en: "The reason is geological. Tuff, a relatively soft volcanic rock, sits on a layer of clay that the rain and streams constantly erode. Every so often a piece of the hill breaks off and crashes into the valley, taking with it whatever was on top: a vegetable garden, a wall, sometimes a house. Over the centuries Civita has lost entire streets, and its oldest part has shrunk to a cluster of a few lanes, linked to the rest of the world by a long bridge that can only be crossed on foot." }
  - { es: "Fino a qualche decennio fa, la storia di Civita era quella di tanti borghi dell'Italia interna: i giovani partivano, le case si svuotavano, i pochi anziani rimasti resistevano più per affetto che per convenienza. Oggi gli abitanti che ci vivono tutto l'anno si contano sulle dita di due mani. Eppure il paese non è mai stato così pieno. Ogni anno centinaia di migliaia di visitatori attraversano il ponte, scattano foto dalla piazza, comprano un biglietto d'ingresso, perché sì, da qualche anno per entrare a Civita si paga.", en: "Until a few decades ago, Civita's story was that of many villages in inland Italy: the young left, houses emptied, and the few old people who stayed held on more out of affection than convenience. Today the residents who live there all year round can be counted on the fingers of two hands. And yet the village has never been so full. Every year hundreds of thousands of visitors cross the bridge, take photos from the square and buy an entrance ticket – because yes, for some years now you've had to pay to enter Civita." }
  - { es: "Il biglietto ha suscitato, com'era prevedibile, molte polemiche. Si può far pagare l'ingresso a un paese, come se fosse un museo? Non si rischia di trasformare un luogo vivo in un parco a tema? Le obiezioni sono serie, e sarebbe disonesto liquidarle con una battuta. Tuttavia, chi difende la scelta ha un argomento difficile da ignorare: con quei soldi si finanziano i lavori di consolidamento della collina, senza i quali il paese, semplicemente, non ci sarebbe più.", en: "The ticket has, predictably, stirred up a lot of controversy. Can you charge admission to a village as if it were a museum? Isn't there a risk of turning a living place into a theme park? The objections are serious, and it would be dishonest to dismiss them with a joke. However, those who defend the decision have an argument that's hard to ignore: that money pays for the work to consolidate the hill, without which the village would simply no longer exist." }
  - { es: "Ecco allora il paradosso. Civita sopravvive grazie ai turisti che la trasformano in qualcosa di diverso da ciò che era. Le vecchie cantine sono diventate ristoranti, le case dei contadini sono diventate alloggi per le vacanze, la piazza dove un tempo si festeggiava il santo patrono è diventata lo sfondo perfetto per i selfie. È una perdita? Certamente. Ma l'alternativa non era la conservazione del passato: era il crollo, nel senso più letterale della parola.", en: "So here is the paradox. Civita survives thanks to the tourists who turn it into something different from what it was. The old cellars have become restaurants, the farmers' houses holiday lets, the square where the patron saint was once celebrated the perfect backdrop for selfies. Is it a loss? Certainly. But the alternative wasn't preserving the past: it was collapse, in the most literal sense of the word." }
  - { es: "C'è chi, davanti a questa situazione, parla di «disneyficazione» e rimpiange un'autenticità perduta. Ma che cosa intendiamo esattamente con autentico? Il borgo che vedevano i viaggiatori dell'Ottocento era già il risultato di secoli di crolli, ricostruzioni, partenze e arrivi. Nato come insediamento etrusco, diventato città medievale, quasi abbandonato dopo un terremoto nel Seicento, Civita non è mai stata ferma. Forse la sua identità consiste proprio in questo: nel continuare a cambiare per non sparire.", en: "Faced with this situation, some speak of 'Disneyfication' and lament a lost authenticity. But what exactly do we mean by authentic? The village that nineteenth-century travellers saw was already the result of centuries of collapses, rebuilding, departures and arrivals. Born as an Etruscan settlement, turned into a medieval town, almost abandoned after an earthquake in the seventeenth century, Civita has never stood still. Perhaps its identity lies precisely in this: in continuing to change so as not to disappear." }
  - { es: "Resta, naturalmente, la questione del rispetto. Il turista che attraversa il ponte con le cuffie nelle orecchie, che non sa che qui nacque san Bonaventura, uno dei grandi pensatori del Medioevo, e che riparte dopo un'ora senza aver guardato la valle, non fa del male a nessuno. Ma perde l'occasione di capire che cosa sta guardando: un luogo che esiste ancora soltanto perché qualcuno, ogni giorno, decide di non lasciarlo cadere.", en: "There remains, of course, the question of respect. The tourist who crosses the bridge with earphones in, who doesn't know that Saint Bonaventure, one of the great thinkers of the Middle Ages, was born here, and who leaves after an hour without having looked at the valley, does no harm to anyone. But he misses the chance to understand what he's looking at: a place that still exists only because someone, every day, decides not to let it fall." }
  - { es: "Al tramonto, quando gli ultimi gruppi tornano verso il parcheggio, il ponte si svuota e il paese ritrova per qualche ora il silenzio. Da lontano, sospeso sopra la valle, sembra davvero un'isola. Non muore, dopotutto. Resiste, che è una cosa diversa.", en: "At sunset, when the last groups head back towards the car park, the bridge empties and the village finds its silence again for a few hours. From a distance, suspended above the valley, it really does look like an island. It isn't dying, after all. It's holding out, which is a different thing." }
questions:
  - { q: "Perché, secondo l'autore, il soprannome «la città che muore» è un «capolavoro di comunicazione»?", options: ["Perché è scritto in molte lingue", "Perché attira i visitatori: tutti vogliono vedere un paese che sta scomparendo", "Perché l'ha inventato un poeta famoso"], answer: 1, explain: "«Nessuno andrebbe a vedere un paese che sta semplicemente invecchiando; tutti vogliono vedere un paese che sta scomparendo.»" }
  - { q: "Qual è la causa geologica del problema di Civita?", options: ["I terremoti continui dell'Etna", "Il tufo poggia su uno strato di argilla che pioggia e torrenti erodono", "Il peso dei turisti sul ponte"], answer: 1, explain: "«Il tufo… poggia su uno strato di argilla che la pioggia e i torrenti erodono continuamente.»" }
  - { q: "Quale argomento usa chi difende il biglietto d'ingresso?", options: ["Che i turisti sono troppi", "Che con quei soldi si finanziano i lavori per consolidare la collina", "Che i musei costano di più"], answer: 1, explain: "«con quei soldi si finanziano i lavori di consolidamento della collina, senza i quali il paese… non ci sarebbe più»." }
  - { q: "In che cosa consiste il «paradosso» descritto dall'autore?", options: ["Civita sopravvive grazie ai turisti che però la trasformano", "Civita è piena di abitanti ma vuota di turisti", "Il ponte è più antico del paese"], answer: 0, explain: "«Civita sopravvive grazie ai turisti che la trasformano in qualcosa di diverso da ciò che era.»" }
  - { q: "Come risponde l'autore a chi rimpiange un'«autenticità perduta»?", options: ["Gli dà ragione senza riserve", "Si chiede che cosa sia autentico, ricordando che Civita è sempre cambiata", "Propone di chiudere il paese ai turisti"], answer: 1, explain: "A rhetorical question («Ma che cosa intendiamo esattamente con autentico?») followed by a reversal: Civita «non è mai stata ferma»." }
  - { q: "Che cosa significa la frase finale «Non muore, dopotutto. Resiste, che è una cosa diversa»?", options: ["Che il soprannome è esatto", "Che l'autore rovescia il soprannome: il paese non sta morendo, ma lotta per restare", "Che il paese è già morto"], answer: 1, explain: "The closing image overturns the opening nickname – a classic persuasive frame." }
