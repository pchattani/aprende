writing:
  - task: "Write a blog paragraph about the Cheung Chau Bun Festival, using 無論…都…"
    min: 60
    max: 120
    use: [w.mou4-leon6, w.nung4-lik6, w.geoi2-hang4, w.piu1-sik1, w.jan4-saan1-jan4-hoi2]
    useAtLeast: 3
    grammar: [g.mou-leon-dou-no-matter]
    expect:
      - { pattern: "無論.{1,12}都|不論.{1,12}都", hint: "Say 'no matter …' with 無論…都…" }
    model: { es: "長洲太平清醮每年喺農曆四月舉行。無論天氣幾熱，無論有幾多人，好多市民都會坐船入長洲睇飄色巡遊同搶包山。島上人山人海，氣氛好熱鬧。我第一次去，真係好難忘。", en: "The Cheung Chau Bun Festival is held every year in the fourth lunar month. No matter how hot it is or how many people there are, lots of people take the ferry to Cheung Chau to watch the float parade and the bun scramble. The island is packed and the atmosphere is very lively. It was my first time, and it was truly unforgettable." }
  - task: "A friend asks what else there is at the festival besides the bun towers. Answer with 除咗…之外 and 除此之外."
    es: "除咗包山，長洲仲有乜嘢好玩呀？"
    min: 60
    max: 110
    use: [w.ceoi4-zo2, w.zi1-ngoi6, w.ji4-sik1, w.ceoi4-ci2-zi1-ngoi6, w.taan1-dong3]
