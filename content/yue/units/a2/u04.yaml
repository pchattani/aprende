id: a2.u04
title: 旺角定銅鑼灣好？
lessons:
  - id: a2.u04.l1
    title: 深水埗比中環平
    teach: [g.bei2-comparison]
    tip: "A 比 B + adjective, and the difference goes after the adjective: 佢比我高十公分. No 好 before the adjective."
    vocab: [w.bei2.b, w.gang3-gaa1, w.siu2-di1, w.jit6-naau6, w.fong1-bin6, w.zai1-bik1, w.jan4-do1, w.jan4-hau2, w.dei6-tit3-zaam6, w.mai5.b, w.gung1-fan1, w.gung1-gan1, w.m4-siu2, w.zou1-gam1]
    sentences:
      - { es: "旺角比銅鑼灣多人。", en: "Mong Kok is more crowded than Causeway Bay.", altEs: ["旺角多人過銅鑼灣。", "旺角比銅鑼灣人多。"], altEn: ["There are more people in Mong Kok than in Causeway Bay."], grammar: [g.bei2-comparison], vocab: [w.bei2.b, w.jan4-do1] }
      - { es: "深水埗比中環平好多。", jp: "sam1 seoi2 bou2 bei2 zung1 waan4 peng4 hou2 do1", en: "Sham Shui Po is much cheaper than Central.", altEs: ["深水埗平過中環好多。"], grammar: [g.bei2-comparison], vocab: [w.bei2.b] }
      - { es: "坐港鐵比坐巴士快。", en: "Taking the MTR is faster than taking the bus.", altEs: ["坐地鐵比坐巴士快。"], grammar: [g.bei2-comparison], vocab: [w.bei2.b], transform: { instruction: "Use the 過 pattern", answer: "坐港鐵快過坐巴士。", alt: ["坐地鐵快過坐巴士。"], en: "The MTR is faster than the bus." } }
      - { es: "今日比尋日熱啲。", en: "Today is a bit hotter than yesterday.", altEs: ["今日比尋日熱少少。", "今日熱過尋日少少。"], grammar: [g.bei2-comparison], vocab: [w.bei2.b], transform: { instruction: "Say today is much hotter", answer: "今日比尋日熱好多。", alt: ["今日熱過尋日好多。"], en: "Today is much hotter than yesterday." } }
      - { es: "我細佬比我高十公分。", en: "My younger brother is ten centimetres taller than me.", altEs: ["我細佬高過我十公分。"], grammar: [g.bei2-comparison], vocab: [w.gung1-fan1], error: { wrong: "我細佬比我十公分高。", explain: "The difference goes after the adjective: 高十公分.", grammar: g.bei2-comparison } }
      - { es: "佢比我高。", en: "He's taller than me.", altEs: ["佢高過我。"], altEn: ["She is taller than me."], grammar: [g.bei2-comparison], vocab: [w.bei2.b], transform: { instruction: "Say he's much taller", answer: "佢比我高好多。", alt: ["佢高過我好多。"], en: "He's much taller than me." }, error: { wrong: "佢比我好高。", explain: "No 好 before the adjective in a 比 sentence: 佢比我高.", grammar: g.bei2-comparison } }
      - { es: "呢個袋比嗰個重兩公斤。", jp: "ni1 go3 doi6 bei2 go2 go3 cung5 loeng5 gung1 gan1", en: "This bag is two kilos heavier than that one.", altEs: ["呢個袋重過嗰個兩公斤。"], grammar: [g.bei2-comparison], vocab: [w.gung1-gan1] }
      - { es: "九龍嘅人口比港島多。", en: "Kowloon has a bigger population than Hong Kong Island.", altEs: ["九龍嘅人口多過港島。"], grammar: [g.bei2-comparison, g.ge-possessive], vocab: [w.jan4-hau2] }
      - { es: "住呢度比住新界方便。", en: "Living here is more convenient than living in the New Territories.", altEs: ["住呢度方便過住新界。"], grammar: [g.bei2-comparison], vocab: [w.fong1-bin6] }
      - { es: "鴨寮街比我諗嘅熱鬧。", en: "Apliu Street is livelier than I thought.", altEs: ["鴨寮街比我諗嘅仲熱鬧。"], grammar: [g.bei2-comparison], vocab: [w.jit6-naau6] }
      - { es: "呢度比以前擠迫好多。", en: "It's much more crowded here than it used to be.", altEs: ["呢度擠迫過以前好多。"], grammar: [g.bei2-comparison], vocab: [w.zai1-bik1] }
      - { es: "今年嘅遊客比舊年少啲。", en: "There are slightly fewer tourists this year than last year.", altEs: ["今年嘅遊客少過舊年。"], grammar: [g.bei2-comparison], vocab: [w.siu2-di1] }
      - { es: "深水埗有唔少茶餐廳。", en: "Sham Shui Po has quite a few cha chaan tengs.", altEs: ["深水埗有好多茶餐廳。"], grammar: [g.jau-have], vocab: [w.m4-siu2] }
      - { es: "佢比我更加忙。", en: "She's even busier than me.", altEs: ["佢仲忙過我。", "佢比我仲忙。"], altEn: ["He is even busier than I am."], grammar: [g.bei2-comparison], vocab: [w.gang3-gaa1] }
      - { es: "由呢度去地鐵站大概三百米。", en: "From here to the MTR station is about three hundred metres.", altEs: ["由呢度去地鐵站大約三百米。"], grammar: [g.big-numbers], vocab: [w.dei6-tit3-zaam6, w.mai5.b] }
    exchanges:
      - q: { es: "旺角定銅鑼灣多人呀？", en: "Which is more crowded, Mong Kok or Causeway Bay?" }
        a: { es: "旺角比銅鑼灣多人。", en: "Mong Kok is more crowded than Causeway Bay." }
        alt: ["旺角多人啲。", "差唔多。"]
        grammar: [g.bei2-comparison]
        vocab: [w.bei2.b, w.jan4-do1]
      - q: { es: "你同你細佬邊個高啲呀？", en: "Who's taller, you or your younger brother?" }
        a: { es: "佢比我高少少。", en: "He's a little taller than me." }
        alt: ["我高啲。", "佢高過我。"]
        grammar: [g.bei2-comparison]
        vocab: [w.bei2.b]
      - q: { es: "坐巴士定坐港鐵快呀？", en: "Which is faster, the bus or the MTR?" }
        a: { es: "坐港鐵快好多。", en: "The MTR is much faster." }
        alt: ["港鐵比巴士快。", "港鐵快啲。"]
        grammar: [g.bei2-comparison]
        vocab: [w.bei2.b]
      - q: { es: "深水埗啲嘢貴唔貴呀？", en: "Are things expensive in Sham Shui Po?" }
        a: { es: "唔貴，平過中環好多。", en: "No, much cheaper than Central." }
        alt: ["幾平。", "比中環平。"]
        grammar: [g.bei2-comparison]
        vocab: [w.bei2.b]
      - q: { es: "今日熱唔熱呀？", en: "Is it hot today?" }
        a: { es: "比尋日熱啲。", en: "A bit hotter than yesterday." }
        alt: ["冇尋日咁熱。", "好熱。"]
        grammar: [g.bei2-comparison]
        vocab: [w.bei2.b]
    texts:
      - title: "深水埗"
        es: ["深水埗啲嘢平過中環好多。", "鴨寮街有好多舊電話同舊相機。", "不過呢度比以前擠迫。"]
        en: ["Things in Sham Shui Po are much cheaper than in Central.", "Apliu Street has lots of old phones and old cameras.", "But it's more crowded here than before."]
        grammar: [g.bei2-comparison]
        vocab: [w.bei2.b, w.zai1-bik1]
      - title: "新屋"
        es: ["我哋新屋比舊屋大少少。", "佢近地鐵站，方便好多。", "不過租金比以前貴啲。"]
        en: ["Our new flat is a little bigger than the old one.", "It's close to the MTR station, which is much more convenient.", "But the rent is a bit higher than before."]
        grammar: [g.bei2-comparison]
        vocab: [w.dei6-tit3-zaam6, w.fong1-bin6]
    spicy:
      - { es: "你真人比相靚。", jp: "nei5 zan1 jan4 bei2 soeng2 leng3", en: "You look better in person than in your photos.", altEs: ["你真人靚過相。"], grammar: [g.bei2-comparison], vocab: [w.bei2.b] }
      - { es: "同你食飯比食乜嘢都開心。", en: "Having dinner with you is more fun than anything I eat.", altEs: ["同你食飯比食咩都開心。"], grammar: [g.bei2-comparison], vocab: [w.bei2.b] }
      - { es: "見到你，我個心跳得比過山車仲快。", en: "When I see you, my heart beats faster than a roller coaster.", altEs: ["見到你，我個心跳得快過過山車。"], grammar: [g.bei2-comparison, g.dak-descriptive], vocab: [w.bei2.b] }
      - { es: "佢比我高，但係我比佢好笑。", en: "He's taller than me, but I'm funnier than him.", altEs: ["佢高過我，但係我好笑過佢。"], grammar: [g.bei2-comparison], vocab: [w.bei2.b] }
      - { es: "你比我諗嘅更加可愛。", en: "You're even cuter than I imagined.", altEs: ["你比我諗嘅仲可愛。"], grammar: [g.bei2-comparison], vocab: [w.gang3-gaa1] }

  - id: a2.u04.l2
    title: 平過網上
    teach: [g.adj-gwo-comparison]
    tip: "The Cantonese comparative: A + adjective + 過 + B. 好過 'better than' is everywhere."
    vocab: [w.gou1-gwo3, w.hou2-gwo3, w.caa1-gwo3, w.peng4-gwo3, w.zat1-sou3, w.dai2, w.dai2-sik6, w.gaam2-gaa3, w.dak6-gaa3, w.zit3, w.pou3, w.sau6-fo3-jyun4, w.ni1-gaan1, w.ni1-gin6, w.ni1-deoi3, w.ho2-ji5, w.zi1-cin4, w.geng2-gan1]
    sentences:
      - { es: "佢高過我。", en: "He's taller than me.", altEs: ["佢比我高。"], altEn: ["She's taller than I am."], grammar: [g.adj-gwo-comparison], vocab: [w.gou1-gwo3], transform: { instruction: "Use the 比 pattern", answer: "佢比我高。", en: "He's taller than me." }, error: { wrong: "佢過我高。", explain: "過 goes after the adjective: 高過我.", grammar: g.adj-gwo-comparison } }
      - { es: "坐的士快過坐巴士。", en: "A taxi is faster than the bus.", altEs: ["坐的士比坐巴士快。"], grammar: [g.adj-gwo-comparison], vocab: [w.gou1-gwo3] }
      - { es: "深水埗啲衫平過旺角。", en: "Clothes in Sham Shui Po are cheaper than in Mong Kok.", altEs: ["深水埗啲衫比旺角平。"], grammar: [g.adj-gwo-comparison], vocab: [w.peng4-gwo3], transform: { instruction: "Say they're much cheaper", answer: "深水埗啲衫平過旺角好多。", alt: ["深水埗啲衫比旺角平好多。"], en: "Clothes in Sham Shui Po are much cheaper than in Mong Kok." } }
      - { es: "阿媽煮嘅飯好食過餐廳。", en: "Mum's cooking tastes better than a restaurant's.", altEs: ["媽媽煮嘅飯好食過餐廳。", "阿媽煮嘅飯比餐廳好食。"], grammar: [g.adj-gwo-comparison], vocab: [w.hou2-gwo3] }
      - { es: "我哋早啲去好過，夜晚好多人。", en: "We'd better go early; it gets crowded at night.", altEs: ["早啲去好過，夜晚好多人。"], grammar: [g.adj-gwo-comparison], vocab: [w.hou2-gwo3], note: "…好過 at the end: 'it's better to …'." }
      - { es: "呢間舖嘅質素好過嗰間。", en: "This shop's quality is better than that one's.", altEs: ["呢間舖嘅質素比嗰間好。"], grammar: [g.adj-gwo-comparison], vocab: [w.pou3, w.zat1-sou3] }
      - { es: "呢件減價，平過網上。", en: "This one's on sale; it's cheaper than online.", altEs: ["呢件減緊價，平過網上。"], grammar: [g.adj-gwo-comparison], vocab: [w.gaam2-gaa3, w.peng4-gwo3] }
      - { es: "今日特價，打八折。", en: "Today's special offer: twenty per cent off.", altEs: ["今日特價，八折。"], grammar: [g.numbers-1-99], vocab: [w.dak6-gaa3, w.zit3], note: "八折 means you pay 80% of the price." }
      - { es: "呢間茶餐廳好抵食，平過出面好多。", en: "This cha chaan teng is great value, much cheaper than elsewhere.", altEs: ["呢間茶餐廳好抵食，比出面平好多。"], grammar: [g.adj-gwo-comparison], vocab: [w.dai2-sik6] }
      - { es: "佢嘅廣東話好過我。", en: "Her Cantonese is better than mine.", altEs: ["佢嘅廣東話比我好。"], altEn: ["His Cantonese is better than mine."], grammar: [g.adj-gwo-comparison], vocab: [w.hou2-gwo3], error: { wrong: "佢嘅廣東話比我好過。", explain: "Don't combine 比 and 過: say 好過我 or 比我好.", grammar: g.adj-gwo-comparison } }
      - { es: "今年嘅生意差過舊年。", en: "Business this year is worse than last year.", altEs: ["今年嘅生意比舊年差。"], grammar: [g.adj-gwo-comparison], vocab: [w.caa1-gwo3] }
      - { es: "售貨員話呢件質素好啲。", en: "The shop assistant says this one is better quality.", altEs: ["售貨員話呢件嘅質素好啲。"], grammar: [g.bei2-comparison], vocab: [w.sau6-fo3-jyun4, w.zat1-sou3] }
      - { es: "行路快過搭車。", en: "Walking is faster than taking the bus.", altEs: ["行路比搭車快。"], grammar: [g.adj-gwo-comparison], vocab: [w.gou1-gwo3], transform: { instruction: "Say walking is slower", answer: "行路慢過搭車。", alt: ["行路比搭車慢。"], en: "Walking is slower than taking the bus." } }
      - { es: "呢對鞋好抵，唔買就走寶喇。", en: "These shoes are a bargain; it'd be a shame not to buy them.", altEs: ["呢對鞋好抵，唔買好可惜。"], grammar: [g.adjective-predicates], vocab: [w.dai2] }
    exchanges:
      - q: { es: "邊間舖平啲呀？", en: "Which shop is cheaper?" }
        a: { es: "街口嗰間平過呢間。", en: "The one on the corner is cheaper than this one." }
        alt: ["嗰間平啲。", "差唔多。"]
        grammar: [g.adj-gwo-comparison]
        vocab: [w.peng4-gwo3, w.pou3]
      - q: { es: "件外套抵唔抵買呀？", en: "Is the jacket good value?" }
        a: { es: "好抵，打緊七折。", en: "Very, it's thirty per cent off." }
        alt: ["唔抵，網上平啲。", "幾抵。"]
        grammar: [g.adj-gwo-comparison]
        vocab: [w.dai2, w.zit3]
      - q: { es: "你哋邊個高啲呀？", en: "Which of you is taller?" }
        a: { es: "佢高過我少少。", en: "He's a little taller than me." }
        alt: ["我高過佢。", "差唔多高。"]
        grammar: [g.adj-gwo-comparison]
        vocab: [w.gou1-gwo3]
      - q: { es: "網上買定去舖頭買好呀？", en: "Is it better to buy online or in a shop?" }
        a: { es: "網上平啲，不過去舖頭可以試。", en: "Online is cheaper, but in a shop you can try things on." }
        alt: ["去舖頭好過。", "網上買好過。"]
        grammar: [g.adj-gwo-comparison]
        vocab: [w.hou2-gwo3]
      - q: { es: "呢間茶餐廳好唔好食呀？", en: "Is this cha chaan teng any good?" }
        a: { es: "好食過隔籬嗰間，又抵食。", en: "Better than the one next door, and good value too." }
        alt: ["麻麻哋。", "好抵食。"]
        grammar: [g.adj-gwo-comparison]
        vocab: [w.dai2-sik6]
    texts:
      - title: "鴨寮街"
        es: ["鴨寮街啲嘢平過出面好多。", "不過質素有好有差。", "買之前最好試吓。"]
        en: ["Things on Apliu Street are much cheaper than elsewhere.", "But the quality can be good or bad.", "You'd better try things before you buy."]
        grammar: [g.adj-gwo-comparison]
        vocab: [w.peng4-gwo3, w.zat1-sou3]
      - title: "舖頭門口"
        es: ["今日特價！", "外套同頸巾打八折。", "平過網上！"]
        en: ["Special offer today!", "Twenty per cent off jackets and scarves.", "Cheaper than online!"]
        grammar: [g.adj-gwo-comparison]
        vocab: [w.dak6-gaa3, w.zit3, w.peng4-gwo3]
    spicy:
      - { es: "你靚過電影入面啲演員。", en: "You're better-looking than the actors in films.", altEs: ["你比電影入面啲演員靚。"], grammar: [g.adj-gwo-comparison], vocab: [w.gou1-gwo3] }
      - { es: "同你飲咖啡好過一個人飲。", en: "Having coffee with you beats drinking it alone.", altEs: ["同你飲咖啡好過自己一個人飲。"], grammar: [g.adj-gwo-comparison], vocab: [w.hou2-gwo3] }
      - { es: "你煮嘅飯好食過餐廳，可唔可以日日煮畀我食？", en: "Your cooking is better than a restaurant's; could you cook for me every day?", altEs: ["你煮嘅飯比餐廳好食，可唔可以日日煮畀我食？"], grammar: [g.adj-gwo-comparison, g.ho-ji-can-may], vocab: [w.hou2-gwo3] }
      - { es: "見你好過睇電視。", en: "Seeing you beats watching TV.", altEs: ["見你好過喺屋企睇電視。"], grammar: [g.adj-gwo-comparison], vocab: [w.hou2-gwo3] }
      - { es: "抵唔抵？同你一齊，乜都抵。", en: "Is it worth it? With you, everything is.", altEs: ["抵唔抵？同你一齊，咩都抵。"], grammar: [g.a-not-a-questions], vocab: [w.dai2] }

  - id: a2.u04.l3
    title: 冇你咁高
    teach: [g.mou-gam-not-as, g.jat-joeng-same]
    tip: "A 冇 B 咁 + adjective = not as … as; A 同 B 一樣 = the same; 唔同 = different."
    vocab: [w.mou5-gam3, w.jat1-joeng6, w.m4-tung4, w.ci5, w.mou5-mat1, w.fut3, w.zaak3, w.sung1, w.gan2.b, w.maa5.b, w.seot1-saam1, w.ngau4-zai2-fu3, w.ngoi6-tou3, w.ni1-tiu4, w.zung1.f]
    sentences:
      - { es: "我冇佢咁高。", en: "I'm not as tall as him.", altEs: ["我冇佢咁高呀。"], altEn: ["I'm not as tall as her."], grammar: [g.mou-gam-not-as], vocab: [w.mou5-gam3], transform: { instruction: "Say 'as tall as' (有…咁)", answer: "我有佢咁高。", en: "I'm as tall as him." }, error: { wrong: "我冇佢高。", explain: "咁 is needed: 我冇佢咁高.", grammar: g.mou-gam-not-as } }
      - { es: "今日冇尋日咁熱。", en: "Today isn't as hot as yesterday.", altEs: ["今日冇琴日咁熱。"], grammar: [g.mou-gam-not-as], vocab: [w.mou5-gam3], transform: { instruction: "Use 比: yesterday was hotter", answer: "尋日比今日熱。", alt: ["尋日熱過今日。"], en: "Yesterday was hotter than today." } }
      - { es: "深水埗冇旺角咁多人。", en: "Sham Shui Po isn't as crowded as Mong Kok.", altEs: ["深水埗冇旺角咁擠迫。"], grammar: [g.mou-gam-not-as], vocab: [w.mou5-gam3] }
      - { es: "呢條牛仔褲冇嗰條咁緊。", en: "These jeans aren't as tight as those.", altEs: ["呢條牛仔褲冇嗰條咁窄。"], grammar: [g.mou-gam-not-as, g.common-classifiers], vocab: [w.ngau4-zai2-fu3, w.gan2.b] }
      - { es: "呢件恤衫太闊，有冇窄啲嘅？", en: "This shirt is too loose; do you have a slimmer one?", altEs: ["呢件恤衫太闊喇，有冇窄啲嘅？"], grammar: [g.degree-adverbs], vocab: [w.seot1-saam1, w.fut3, w.zaak3] }
      - { es: "呢件外套同嗰件一樣。", en: "This jacket is the same as that one.", altEs: ["呢件外套同嗰件一模一樣。"], grammar: [g.jat-joeng-same], vocab: [w.ngoi6-tou3, w.jat1-joeng6], transform: { instruction: "Say it's different", answer: "呢件外套同嗰件唔同。", alt: ["呢件外套同嗰件唔一樣。"], en: "This jacket is different from that one." } }
      - { es: "我同你一樣，都鍾意平嘢。", en: "I'm like you, I love a bargain too.", altEs: ["我同你一樣，都係鍾意平嘢。"], grammar: [g.jat-joeng-same], vocab: [w.jat1-joeng6], error: { wrong: "我一樣你，都鍾意平嘢。", explain: "Link the two with 同: 我同你一樣.", grammar: g.jat-joeng-same } }
      - { es: "你好似你媽媽。", en: "You look a lot like your mum.", altEs: ["你同你媽媽好似。"], grammar: [g.jat-joeng-same], vocab: [w.ci5] }
      - { es: "呢兩件衫差唔多，不過碼唔同。", jp: "ni1 loeng5 gin6 saam1 caa1 m4 do1 bat1 gwo3 maa5 m4 tung4", en: "These two tops are about the same, but the sizes are different.", altEs: ["呢兩件衫差唔多，但係碼唔同。"], grammar: [g.jat-joeng-same], vocab: [w.m4-tung4, w.maa5.b] }
      - { es: "你着幾多碼呀？", jp: "nei5 zoek3 gei2 do1 maa5 aa4", en: "What size do you wear?", altEs: ["你着咩碼呀？"], grammar: [g.question-words], vocab: [w.maa5.b] }
      - { es: "條褲有啲鬆。", en: "The trousers are a bit loose.", altEs: ["條褲有少少鬆。"], grammar: [g.jau-di-a-bit], vocab: [w.sung1] }
      - { es: "鴨寮街冇乜遊客。", en: "There are hardly any tourists on Apliu Street.", altEs: ["鴨寮街冇咩遊客。"], grammar: [g.mou-negation], vocab: [w.mou5-mat1] }
      - { es: "廣東話同普通話好唔同。", en: "Cantonese and Mandarin are very different.", altEs: ["廣東話同普通話好唔一樣。"], grammar: [g.jat-joeng-same], vocab: [w.m4-tung4] }
      - { es: "呢度同以前唔同喇。", en: "This place isn't what it used to be.", altEs: ["呢度同以前唔一樣喇。"], grammar: [g.jat-joeng-same], vocab: [w.m4-tung4] }
    exchanges:
      - q: { es: "你要幾多碼呀？", en: "What size do you need?" }
        a: { es: "我要中碼。", en: "A medium, please." }
        alt: ["細碼。", "大碼。"]
        grammar: [g.question-words]
        vocab: [w.maa5.b]
      - q: { es: "呢件同嗰件一唔一樣呀？", en: "Is this one the same as that one?" }
        a: { es: "唔一樣，呢件闊啲。", en: "No, this one is looser." }
        alt: ["差唔多。", "一樣。"]
        grammar: [g.jat-joeng-same]
        vocab: [w.jat1-joeng6, w.fut3]
      - q: { es: "今日凍唔凍呀？", en: "Is it cold today?" }
        a: { es: "冇尋日咁凍。", en: "Not as cold as yesterday." }
        alt: ["好凍。", "冇咁凍。"]
        grammar: [g.mou-gam-not-as]
        vocab: [w.mou5-gam3]
      - q: { es: "你似爸爸定媽媽呀？", en: "Do you look like your dad or your mum?" }
        a: { es: "我似媽媽多啲。", en: "More like my mum." }
        alt: ["似爸爸。", "兩個都似。"]
        grammar: [g.jat-joeng-same]
        vocab: [w.ci5]
      - q: { es: "條牛仔褲啱唔啱呀？", en: "Do the jeans fit?" }
        a: { es: "有啲緊，有冇大碼？", en: "They're a bit tight; do you have a bigger size?" }
        alt: ["好啱。", "有啲鬆。"]
        grammar: [g.jau-di-a-bit]
        vocab: [w.ngau4-zai2-fu3, w.gan2.b, w.maa5.b]
    texts:
      - title: "試衫"
        es: ["第一條牛仔褲太緊。", "第二條冇咁緊，不過太長。", "我想試第三條。"]
        en: ["The first pair of jeans is too tight.", "The second pair isn't as tight, but it's too long.", "I'd like to try a third pair."]
        grammar: [g.mou-gam-not-as]
        vocab: [w.ngau4-zai2-fu3, w.gan2.b, w.mou5-gam3]
      - title: "兩姊妹"
        es: ["我同我家姐好似。", "不過佢冇我咁高。", "我哋鍾意嘅衫都唔同。"]
        en: ["My older sister and I look very alike.", "But she isn't as tall as me.", "We like different clothes too."]
        grammar: [g.mou-gam-not-as, g.jat-joeng-same]
        vocab: [w.ci5, w.m4-tung4]
    spicy:
      - { es: "冇人有你咁靚。", en: "Nobody is as gorgeous as you.", altEs: ["冇人好似你咁靚。"], grammar: [g.mou-gam-not-as], vocab: [w.mou5-gam3] }
      - { es: "你同我一樣，都鍾意食甜品⋯⋯同埋鍾意我？", en: "You're like me, you love dessert... and do you like me too?", altEs: ["你同我一樣，都鍾意食甜品。同埋鍾意我？"], grammar: [g.jat-joeng-same], vocab: [w.jat1-joeng6] }
      - { es: "呢件衫有啲緊，不過你着就啱啱好。", jp: "ni1 gin6 saam1 jau5 di1 gan2 bat1 gwo3 nei5 zoek3 zau6 ngaam1 ngaam1 hou2", en: "This top is a bit tight, but on you it's just right.", altEs: ["件衫有啲緊，不過你着就啱啱好。"], grammar: [g.jau-di-a-bit], vocab: [w.gan2.b] }
      - { es: "你同我一樣單身？咁啱嘅！", en: "You're single like me? What a coincidence!", altEs: ["你同我一樣都係單身？咁啱嘅！"], grammar: [g.jat-joeng-same], vocab: [w.jat1-joeng6] }
      - { es: "佢冇你咁得意，所以我揀你。", en: "He's not as fun as you, so I'm choosing you.", altEs: ["佢冇你咁得意，所以我揀咗你。"], grammar: [g.mou-gam-not-as], vocab: [w.mou5-gam3] }

  - id: a2.u04.l4
    title: 邊款最平？
    teach: [g.zeoi-superlative]
    tip: "最 goes before the adjective or the verb of liking: 最平, 最鍾意. Never 最好平."
    vocab: [w.zeoi3, w.zeoi3-hou2, w.zeoi3-caa1, w.zeoi3-peng4, w.peng4-je5, w.fun2, w.fun2-sik1, w.zung2, w.neoi5-jan2-gaai1, w.bo1-haai4, w.geng2-gan1, w.sau2-doi2, w.mat6, w.ni1-fun2, w.ni1-zung2, w.ni1-zek3, w.ni1-tou3, w.ni1-bun2]
    sentences:
      - { es: "呢間最平。", en: "This one is the cheapest.", altEs: ["呢間舖最平。"], grammar: [g.zeoi-superlative], vocab: [w.zeoi3], error: { wrong: "呢間最好平。", explain: "Don't add 好 after 最: 最平.", grammar: g.zeoi-superlative } }
      - { es: "我最鍾意深水埗嘅平嘢。", en: "What I like most is the cheap stuff in Sham Shui Po.", altEs: ["我最鍾意深水埗啲平嘢。"], grammar: [g.zeoi-superlative], vocab: [w.zeoi3], error: { wrong: "我鍾意最深水埗嘅平嘢。", explain: "最 goes before the verb of liking: 最鍾意.", grammar: g.zeoi-superlative } }
      - { es: "邊款最平呀？", en: "Which model is the cheapest?", altEs: ["邊一款最平呀？"], grammar: [g.zeoi-superlative], vocab: [w.fun2], transform: { instruction: "Ask which is the most expensive", answer: "邊款最貴呀？", alt: ["邊一款最貴呀？"], en: "Which model is the most expensive?" } }
      - { es: "女人街嘅頸巾最抵買。", en: "The scarves at the Ladies' Market are the best value.", altEs: ["女人街啲頸巾最抵買。"], grammar: [g.zeoi-superlative], vocab: [w.neoi5-jan2-gaai1, w.geng2-gan1] }
      - { es: "呢款波鞋最多人買。", en: "These are the best-selling sneakers.", altEs: ["呢隻波鞋最多人買。"], altEn: ["Most people buy this style of trainers."], grammar: [g.zeoi-superlative], vocab: [w.bo1-haai4, w.fun2] }
      - { es: "最近嘅地鐵站喺邊呀？", en: "Where's the nearest MTR station?", altEs: ["最近嘅港鐵站喺邊呀？"], grammar: [g.zeoi-superlative], vocab: [w.zeoi3] }
      - { es: "你最好早啲去，夜晚好多人。", en: "You'd better go early; it's crowded at night.", altEs: ["你最好早啲去，夜晚好擠迫。"], grammar: [g.zeoi-superlative], vocab: [w.zeoi3-hou2] }
      - { es: "呢間係深水埗最好食嘅茶餐廳。", en: "This is the best cha chaan teng in Sham Shui Po.", altEs: ["呢間係深水埗最正嘅茶餐廳。"], grammar: [g.zeoi-superlative, g.adj-ge-noun], vocab: [w.zeoi3] }
      - { es: "我最唔鍾意排隊。", en: "What I hate most is queuing.", altEs: ["我最憎排隊。"], grammar: [g.zeoi-superlative], vocab: [w.zeoi3] }
      - { es: "呢個手袋係我買過最貴嘅。", en: "This handbag is the most expensive one I've ever bought.", altEs: ["呢個係我買過最貴嘅手袋。"], grammar: [g.zeoi-superlative, g.gwo-experiential], vocab: [w.sau2-doi2] }
      - { es: "邊個最高呀？", en: "Who's the tallest?", altEs: ["你哋邊個最高呀？"], grammar: [g.zeoi-superlative], vocab: [w.zeoi3], transform: { instruction: "Ask who is the shortest", answer: "邊個最矮呀？", alt: ["你哋邊個最矮呀？"], en: "Who's the shortest?" } }
      - { es: "呢三對襪，邊對最好？", jp: "ni1 saam1 deoi3 mat6 bin1 deoi3 zeoi3 hou2", en: "Of these three pairs of socks, which is the best?", altEs: ["呢三對襪，邊對最好呀？"], grammar: [g.zeoi-superlative, g.common-classifiers], vocab: [w.mat6, w.zeoi3-hou2] }
      - { es: "今日係我最差嘅一日。", en: "Today is my worst day ever.", altEs: ["今日係我最衰嘅一日。"], grammar: [g.zeoi-superlative], vocab: [w.zeoi3-caa1] }
      - { es: "呢種款式最少要等半個鐘。", en: "For this style you have to wait at least half an hour.", altEs: ["呢個款式最少要等半個鐘。"], grammar: [g.zeoi-superlative], vocab: [w.zung2, w.fun2-sik1] }
    exchanges:
      - q: { es: "邊款最平呀？", en: "Which model is the cheapest?" }
        a: { es: "黑色嗰款最平，一百蚊。", en: "The black one is the cheapest, a hundred dollars." }
        alt: ["呢款最平。", "白色嗰款。"]
        grammar: [g.zeoi-superlative]
        vocab: [w.fun2]
      - q: { es: "你最鍾意邊度呀？", en: "Where do you like best?" }
        a: { es: "我最鍾意深水埗。", en: "I like Sham Shui Po best." }
        alt: ["旺角。", "我最鍾意女人街。"]
        grammar: [g.zeoi-superlative]
        vocab: [w.zeoi3]
      - q: { es: "最近嘅地鐵站喺邊呀？", en: "Where's the nearest MTR station?" }
        a: { es: "喺前面，行五分鐘就到。", en: "Straight ahead, five minutes' walk." }
        alt: ["喺對面。", "轉左就係。"]
        grammar: [g.zeoi-superlative]
        vocab: [w.dei6-tit3-zaam6]
      - q: { es: "邊間茶餐廳最好食呀？", en: "Which cha chaan teng is the best?" }
        a: { es: "街口嗰間最好食。", en: "The one on the corner is the best." }
        alt: ["嗰間最好食。", "我都唔知。"]
        grammar: [g.zeoi-superlative]
        vocab: [w.zeoi3]
      - q: { es: "女人街幾時最多人呀？", en: "When is the Ladies' Market busiest?" }
        a: { es: "星期六夜晚最多人。", en: "Saturday nights are the busiest." }
        alt: ["週末最多人。", "夜晚。"]
        grammar: [g.zeoi-superlative]
        vocab: [w.neoi5-jan2-gaai1]
    texts:
      - title: "女人街"
        es: ["女人街有好多頸巾同手袋。", "嗰度嘅頸巾最抵買。", "記得問老闆可唔可以平啲！"]
        en: ["The Ladies' Market has lots of scarves and handbags.", "The scarves there are the best value.", "Remember to ask the stallholder for a better price!"]
        grammar: [g.zeoi-superlative]
        vocab: [w.neoi5-jan2-gaai1, w.geng2-gan1, w.sau2-doi2]
      - title: "網上評語"
        es: ["深水埗最好食嘅茶餐廳！", "最正係菠蘿包。", "不過最少要等半個鐘。"]
        en: ["The best cha chaan teng in Sham Shui Po!", "The best thing is the pineapple bun.", "But you have to wait at least half an hour."]
        grammar: [g.zeoi-superlative]
        vocab: [w.zeoi3]
    spicy:
      - { es: "你係我見過最靚嘅人。", en: "You're the most gorgeous person I've ever seen.", altEs: ["你係我見過最靚仔嘅人。", "你係我見過最靚女嘅人。"], grammar: [g.zeoi-superlative, g.gwo-experiential], vocab: [w.zeoi3] }
      - { es: "我最鍾意嘅地方？有你嘅地方。", en: "My favourite place? Wherever you are.", altEs: ["我最鍾意邊度？有你嘅地方。"], grammar: [g.zeoi-superlative], vocab: [w.zeoi3] }
      - { es: "最好嘅禮物，就係你今晚得閒。", en: "The best present would be you being free tonight.", altEs: ["最好嘅禮物係你今晚得閒。"], grammar: [g.zeoi-superlative], vocab: [w.zeoi3-hou2] }
      - { es: "我講笑最差，不過你都笑咗。", en: "I'm terrible at jokes, but you laughed anyway.", altEs: ["我講笑講得最差，不過你都笑咗。"], grammar: [g.zeoi-superlative], vocab: [w.zeoi3-caa1] }
      - { es: "最抵食嘅一餐，係同你一齊食嗰餐。", en: "The best-value meal is the one I have with you.", altEs: ["最抵食嘅一餐，就係同你一齊食嗰餐。"], grammar: [g.zeoi-superlative], vocab: [w.zeoi3] }
dialogues:
  - id: a2.u04.d1
    title: 旺角定深水埗好？
    context: "Ka-yan wants new sneakers. Chi-ming suggests going to Sham Shui Po instead of Mong Kok."
    lines:
      - { speaker: 嘉欣, es: "我想買對新波鞋，去旺角定深水埗好呀？", en: "I want to buy new sneakers; should I go to Mong Kok or Sham Shui Po?" }
      - { speaker: 志明, es: "旺角款式多啲，不過深水埗平過旺角。", en: "Mong Kok has more styles, but Sham Shui Po is cheaper." }
      - { speaker: 嘉欣, es: "平過旺角好多呀？", en: "Much cheaper than Mong Kok?" }
      - { speaker: 志明, es: "有時平過一百蚊。", en: "Sometimes over a hundred dollars cheaper." }
      - { speaker: 嘉欣, es: "咁深水埗啲質素有冇旺角咁好呀？", en: "So is the quality in Sham Shui Po as good as in Mong Kok?" }
      - { speaker: 志明, es: "差唔多，有啲仲好過旺角。", en: "About the same; some are even better than in Mong Kok." }
      - { speaker: 嘉欣, es: "深水埗多唔多人呀？", en: "Is Sham Shui Po crowded?" }
      - { speaker: 志明, es: "冇旺角咁擠迫。鴨寮街最多人，不過嗰度係賣電話嘢嘅。", en: "Not as crowded as Mong Kok. Apliu Street is the busiest, but that's where they sell phone stuff." }
      - { speaker: 嘉欣, es: "好，我哋去深水埗。聽講嗰度啲茶餐廳最抵食！", en: "OK, let's go to Sham Shui Po. I hear the cha chaan tengs there are the best value!" }
      - { speaker: 志明, es: "冇錯！買完我帶你去我最鍾意嗰間。", en: "That's right! After shopping I'll take you to my favourite one." }
    questions:
      - { q: "邊度平啲呀？", options: ["旺角", "深水埗", "一樣"], answer: 1, explain: "深水埗平過旺角: Sham Shui Po is cheaper." }
      - { q: "旺角有乜嘢好過深水埗？", options: ["款式多啲", "平啲", "人少啲"], answer: 0, explain: "旺角款式多啲: Mong Kok has more styles." }
      - { q: "深水埗多唔多人呀？", options: ["好擠迫", "冇旺角咁擠迫", "冇人"], answer: 1, explain: "冇旺角咁擠迫: not as crowded as Mong Kok." }
      - { q: "買完嘢，志明帶嘉欣去邊度？", options: ["佢最鍾意嘅茶餐廳", "鴨寮街", "旺角"], answer: 0, explain: "我帶你去我最鍾意嗰間: his favourite cha chaan teng." }
