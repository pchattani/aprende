id: a2.u05
title: ¿Qué has hecho hoy?
lessons:
  - id: a2.u05.l1
    title: Hoy he…
    teach: [g.present-perfect]
    tip: "he, has, ha, hemos, habéis, han + -ado / -ido: for today, this week, and life experience."
    vocab: [w.esta-manana, w.esta-semana, w.este-ano, w.ultimamente, w.noticia, w.correo, w.reunion, w.informe, w.tarea, w.lista, w.compra, w.hacer-la-compra, w.ordenar, w.planchar, w.regar, w.planta, w.frio.phr]
    sentences:
      - { es: "Hoy he desayunado muy tarde.", en: "Today I had breakfast very late.", altEn: ["Today I've had breakfast very late."], grammar: [g.present-perfect], vocab: [w.desayunar] }
      - { es: "Esta mañana he leído las noticias en el móvil.", en: "This morning I read the news on my phone.", grammar: [g.present-perfect, g.participles-irregular], vocab: [w.esta-manana, w.noticia, w.leer] }
      - { es: "¿Has contestado el correo de tu jefe?", en: "Have you answered your boss's email?", grammar: [g.present-perfect], vocab: [w.correo, w.contestar] }
      - { es: "Hemos tenido una reunión muy larga.", en: "We've had a very long meeting.", grammar: [g.present-perfect], vocab: [w.reunion, w.tener] }
      - { es: "Esta semana he trabajado mucho y no he terminado el informe.", en: "This week I've worked a lot and I haven't finished the report.", grammar: [g.present-perfect], vocab: [w.esta-semana, w.informe], error: { wrong: "Esta semana he trabajado mucho y he no terminado el informe.", explain: "no goes before haber: no he terminado.", grammar: g.present-perfect } }
      - { es: "Los niños ya han hecho las tareas.", en: "The children have already done their homework.", grammar: [g.participles-irregular, g.ya-todavia], vocab: [w.tarea, w.hacer] }
      - { es: "He escrito una lista y he hecho la compra.", en: "I've written a list and done the shopping.", grammar: [g.participles-irregular], vocab: [w.lista, w.hacer-la-compra] }
      - { es: "¿Habéis ordenado vuestra habitación?", en: "Have you (all) tidied your room?", grammar: [g.present-perfect], vocab: [w.ordenar, w.habitacion] }
      - { es: "Mi madre ha planchado la ropa y ha regado las plantas.", en: "My mother has ironed the clothes and watered the plants.", grammar: [g.present-perfect], vocab: [w.planchar, w.regar, w.planta] }
      - { es: "Este año hemos viajado poco.", en: "This year we've travelled little.", grammar: [g.perfect-vs-preterite], vocab: [w.este-ano, w.viajar] }
      - { es: "Últimamente no he dormido bien.", en: "Lately I haven't slept well.", grammar: [g.present-perfect], vocab: [w.ultimamente, w.dormir] }
      - { es: "¿Qué has hecho hoy? — Nada especial.", en: "What have you done today? — Nothing special.", grammar: [g.participles-irregular], vocab: [w.hacer, w.nada] }
      - { es: "Ella ha comido con sus padres.", en: "She has eaten with her parents.", grammar: [g.present-perfect], vocab: [w.comer], transform: { instruction: "Change to 'we'", answer: "Hemos comido con nuestros padres.", alt: ["Nosotros hemos comido con nuestros padres."] } }
      - { es: "Hoy he tenido frío todo el día; la calefacción no ha funcionado.", en: "Today I've been cold all day; the heating hasn't worked.", grammar: [g.present-perfect], vocab: [w.frio.phr, w.hoy], note: "calefacción = heating." }
  - id: a2.u05.l2
    title: Experiencias
    teach: [g.ya-todavia, g.participles-irregular]
    vocab: [w.alguna-vez, w.varias-veces, w.todavia-no, w.jamas, w.nunca-he, w.experiencia, w.aventura, w.extranjero, w.continente, w.probar, w.montar-a-caballo, w.bucear, w.esquiar, w.escalar, w.volar, w.insecto, w.camello, w.globo, w.barco]
    sentences:
      - { es: "¿Has estado alguna vez en México?", en: "Have you ever been to Mexico?", grammar: [g.ya-todavia], vocab: [w.alguna-vez, w.estar] }
      - { es: "He estado varias veces en Italia, pero nunca en Grecia.", en: "I've been to Italy several times, but never to Greece.", grammar: [g.ya-todavia], vocab: [w.varias-veces, w.nunca] }
      - { es: "Nunca he comido insectos.", en: "I've never eaten insects.", grammar: [g.ya-todavia], vocab: [w.nunca-he, w.insecto] }
      - { es: "Todavía no he probado la paella valenciana.", en: "I haven't tried Valencian paella yet.", grammar: [g.ya-todavia], vocab: [w.todavia-no, w.probar] }
      - { es: "¿Has montado alguna vez a caballo? — Sí, una vez.", en: "Have you ever ridden a horse? — Yes, once.", grammar: [g.ya-todavia], vocab: [w.montar-a-caballo] }
      - { es: "Mi hermano ha buceado en el Caribe.", en: "My brother has gone diving in the Caribbean.", grammar: [g.present-perfect], vocab: [w.bucear] }
      - { es: "Jamás he esquiado.", en: "I have never skied.", grammar: [g.ya-todavia], vocab: [w.jamas, w.esquiar] }
      - { es: "Hemos escalado una montaña de tres mil metros.", en: "We've climbed a three-thousand-metre mountain.", grammar: [g.present-perfect], vocab: [w.escalar, w.montana] }
      - { es: "¿Has volado alguna vez en globo?", en: "Have you ever flown in a balloon?", grammar: [g.ya-todavia], vocab: [w.volar, w.globo] }
      - { es: "He viajado en barco y en camello, pero nunca en avión.", en: "I've travelled by boat and by camel, but never by plane.", grammar: [g.present-perfect], vocab: [w.barco, w.camello, w.avion] }
      - { es: "Ha sido una experiencia increíble.", en: "It has been an incredible experience.", grammar: [g.present-perfect], vocab: [w.experiencia, w.increible] }
      - { es: "Mis abuelos nunca han vivido en el extranjero.", en: "My grandparents have never lived abroad.", grammar: [g.ya-todavia], vocab: [w.extranjero, w.vivir] }
      - { es: "He visitado tres continentes y he tenido muchas aventuras.", en: "I've visited three continents and had many adventures.", grammar: [g.present-perfect], vocab: [w.continente, w.aventura], transform: { instruction: "Change to 'you' (tú) as a question", answer: "¿Has visitado tres continentes y has tenido muchas aventuras?" } }
      - { es: "¿Ya has visto la nueva película? — Todavía no.", en: "Have you seen the new film yet? — Not yet.", grammar: [g.ya-todavia, g.participles-irregular], vocab: [w.ver, w.todavia-no], error: { wrong: "¿Ya has veído la nueva película?", explain: "ver has the irregular participle visto.", grammar: g.participles-irregular } }
  - id: a2.u05.l3
    title: Participios irregulares
    teach: [g.participles-irregular]
    vocab: [w.romper, w.cubrir, w.terminar.phr, w.participar, w.conocer.phr, w.maraton, w.carrera.phr, w.frito, w.famoso.phr, w.perder.phr, w.ganar.phr, w.nieve.phr]
    sentences:
      - { es: "¿Quién ha roto la ventana?", en: "Who has broken the window?", grammar: [g.participles-irregular], vocab: [w.romper, w.ventana] }
      - { es: "He puesto la mesa y he hecho la cena.", en: "I've set the table and made dinner.", grammar: [g.participles-irregular], vocab: [w.poner, w.hacer] }
      - { es: "¿Has visto mis gafas? No las he visto.", en: "Have you seen my glasses? I haven't seen them.", grammar: [g.participles-irregular, g.direct-object-pronouns], vocab: [w.ver, w.gafas] }
      - { es: "Todavía no he dicho nada a mis padres.", en: "I haven't said anything to my parents yet.", grammar: [g.participles-irregular], vocab: [w.decir, w.todavia-no] }
      - { es: "La nieve ha cubierto las montañas.", en: "Snow has covered the mountains.", grammar: [g.participles-irregular], vocab: [w.cubrir, w.nieve] }
      - { es: "He participado en una maratón y he terminado la carrera.", en: "I've taken part in a marathon and finished the race.", grammar: [g.present-perfect], vocab: [w.participar, w.maraton, w.carrera.phr] }
      - { es: "Ha vuelto muy tarde del trabajo.", en: "He has come back from work very late.", grammar: [g.participles-irregular], vocab: [w.volver, w.trabajo] }
      - { es: "Hemos abierto una botella de vino.", en: "We've opened a bottle of wine.", grammar: [g.participles-irregular], vocab: [w.abrir, w.botella] }
      - { es: "¿Has escrito ya el correo?", en: "Have you written the email yet?", grammar: [g.participles-irregular], vocab: [w.escribir, w.correo] }
      - { es: "He conocido a mucha gente interesante este año.", en: "I've met many interesting people this year.", grammar: [g.present-perfect, g.a-personal], vocab: [w.conocer.phr, w.gente] }
      - { es: "Nunca he conocido a una persona famosa.", en: "I've never met a famous person.", grammar: [g.ya-todavia], vocab: [w.famoso.phr, w.conocer] }
      - { es: "¿Alguna vez has perdido un vuelo? — Sí, dos veces.", en: "Have you ever missed a flight? — Yes, twice.", grammar: [g.ya-todavia], vocab: [w.perder.phr, w.vez] }
      - { es: "Mi equipo ha ganado un premio importante.", en: "My team has won an important prize.", grammar: [g.present-perfect], vocab: [w.ganar.phr, w.equipo] }
      - { es: "Han frito el pescado en aceite de oliva.", en: "They've fried the fish in olive oil.", grammar: [g.participles-irregular], vocab: [w.frito, w.pescado], error: { wrong: "Han freído el pescado en aceite de oliva.", explain: "freír has the irregular participle frito (freído also exists, but frito is standard).", grammar: g.participles-irregular } }
  - id: a2.u05.l4
    title: ¿Hoy o ayer?
    teach: [g.perfect-vs-preterite]
    vocab: [w.desierto, w.isla, w.selva, w.lago, w.bosque]
    sentences:
      - { es: "Hoy he comido con mis padres; ayer comí solo.", en: "Today I had lunch with my parents; yesterday I ate alone.", grammar: [g.perfect-vs-preterite], vocab: [w.comer, w.ayer] }
      - { es: "¿Has estado en Barcelona? — Sí, estuve allí hace dos años.", en: "Have you been to Barcelona? — Yes, I was there two years ago.", grammar: [g.perfect-vs-preterite], vocab: [w.estar, w.hace] }
      - { es: "Esta semana no he tenido tiempo; la semana pasada tuve más.", en: "This week I haven't had time; last week I had more.", grammar: [g.perfect-vs-preterite], vocab: [w.esta-semana, w.pasado] }
      - { es: "Este mes hemos ido tres veces al cine.", en: "This month we've been to the cinema three times.", grammar: [g.perfect-vs-preterite], vocab: [w.cine, w.vez] }
      - { es: "El lunes pasado fuimos al teatro.", en: "Last Monday we went to the theatre.", grammar: [g.perfect-vs-preterite], vocab: [w.teatro, w.pasado], error: { wrong: "El lunes pasado hemos ido al teatro.", explain: "A closed period (el lunes pasado) takes the preterite: fuimos.", grammar: g.perfect-vs-preterite } }
      - { es: "Nunca he visto un desierto, pero el año pasado vi la selva.", en: "I've never seen a desert, but last year I saw the jungle.", grammar: [g.perfect-vs-preterite], vocab: [w.desierto, w.selva] }
      - { es: "Hemos visitado una isla pequeña este verano.", en: "We've visited a small island this summer.", grammar: [g.perfect-vs-preterite], vocab: [w.isla, w.visitar] }
      - { es: "En 2019 nadamos en un lago en Suiza.", en: "In 2019 we swam in a lake in Switzerland.", grammar: [g.perfect-vs-preterite], vocab: [w.lago, w.nadar] }
      - { es: "Hoy hemos paseado por el bosque.", en: "Today we walked in the forest.", grammar: [g.perfect-vs-preterite], vocab: [w.bosque, w.pasear] }
      - { es: "Anoche llegué tarde y hoy me he levantado a las once.", en: "Last night I arrived late and today I got up at eleven.", grammar: [g.perfect-vs-preterite], vocab: [w.anoche, w.levantarse] }
      - { es: "¿Has hablado con Luis hoy? — No, hablé con él ayer.", en: "Have you talked to Luis today? — No, I talked to him yesterday.", grammar: [g.perfect-vs-preterite], vocab: [w.hablar] }
      - { es: "Este año ha llovido poco, pero el invierno pasado nevó mucho.", en: "This year it has rained little, but last winter it snowed a lot.", grammar: [g.perfect-vs-preterite], vocab: [w.llover, w.nevar] }
      - { es: "Esta mañana he perdido el autobús.", en: "This morning I missed the bus.", grammar: [g.perfect-vs-preterite], vocab: [w.perder, w.autobus], transform: { instruction: "Change 'esta mañana' to 'ayer' and adjust the verb", answer: "Ayer perdí el autobús." } }
dialogues:
  - id: a2.u05.d1
    title: Un día ocupado
    context: Pablo calls his flatmate Lucía in the afternoon.
    lines:
      - { speaker: Pablo, es: "Hola, Lucía. ¿Qué has hecho hoy?", en: "Hi, Lucía. What have you done today?" }
      - { speaker: Lucía, es: "Uf, muchas cosas. Me he levantado a las siete, he ido al gimnasio y después he tenido dos reuniones.", en: "Ugh, lots of things. I got up at seven, went to the gym and then had two meetings." }
      - { speaker: Pablo, es: "¿Has comido ya?", en: "Have you eaten yet?" }
      - { speaker: Lucía, es: "Sí, he comido en la oficina. ¿Y tú? ¿Has hecho la compra?", en: "Yes, I ate at the office. And you? Have you done the shopping?" }
      - { speaker: Pablo, es: "Todavía no. He estado toda la mañana escribiendo el informe y no he terminado.", en: "Not yet. I've spent all morning writing the report and I haven't finished." }
      - { speaker: Lucía, es: "¿Has regado las plantas por lo menos?", en: "Have you at least watered the plants?" }
      - { speaker: Pablo, es: "Sí, eso sí. Y he puesto la lavadora. Ah, y ha llamado tu madre.", en: "Yes, that I have. And I've put the washing on. Oh, and your mother called." }
      - { speaker: Lucía, es: "¿Qué ha dicho?", en: "What did she say?" }
      - { speaker: Pablo, es: "Nada importante, que la llames esta noche. ¿Has visto mis llaves? No las encuentro.", en: "Nothing important, that you should call her tonight. Have you seen my keys? I can't find them." }
      - { speaker: Lucía, es: "Las he visto en la cocina esta mañana, al lado del café.", en: "I saw them in the kitchen this morning, next to the coffee." }
    questions:
      - { q: "What did Lucía do before her meetings?", options: ["The shopping", "She went to the gym", "She watered the plants"], answer: 1 }
      - { q: "Why hasn't Pablo done the shopping?", options: ["He was writing a report", "He was at the gym", "He lost his keys"], answer: 0 }
      - { q: "Where did Lucía see the keys?", options: ["In the office", "In the kitchen", "In the washing machine"], answer: 1 }
