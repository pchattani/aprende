id: c2.u08
title: "Dominar o português"
lessons:
  - id: c2.u08.l1
    title: Duas normas, uma língua
    teach: [g.br-ep-grammar-overview]
    vocab: [w.fluência, w.fluente, w.proficiência, w.proficiente, w.aprimorar, w.aperfeiçoar, w.aperfeiçoamento, w.idiossincrasia, w.idiomatismo, w.coloquialismo, w.pragmática, w.entoação, w.ditongo, w.nasal, w.fonética, w.fonologia, w.prosódia, w.morfologia, w.sintaxe, w.semântica, w.léxico, w.lexical, w.etimologia, w.étimo, w.latim, w.galego-português, w.arcaico, w.vernáculo, w.castiço, w.purismo, w.purista, w.brasileirismo, w.lusitanismo, w.galicismo, w.padronização, w.norma-padrão, w.alterações-climáticas, w.mudanças-climáticas, w.obsoleto, w.anacrônico, w.paradigma, w.linguista]
    tip: "Pick one norm per text and keep it: tu + estar a + enclisis in Portugal, você + gerund + proclisis in Brazil. A hybrid like «você estás a falar» sounds wrong on both sides."
    sentences:
      - { es: "Estou a ler um livro que a Ana me emprestou.", en: "I'm reading a book that Ana lent me.", altEs: ["Estou lendo um livro que a Ana me emprestou.", "Tô lendo um livro que a Ana me emprestou."], grammar: [g.br-ep-grammar-overview, g.ep-estar-a-infinitive, g.ep-proclisis-attractors], vocab: [w.emprestar], transform: { instruction: "Rewrite it with the Brazilian progressive", answer: "Estou lendo um livro que a Ana me emprestou.", alt: ["Eu estou lendo um livro que a Ana me emprestou.", "Tô lendo um livro que a Ana me emprestou."] } }
      - { es: "Diz-me o que estás a pensar.", en: "Tell me what you're thinking.", altEs: ["Me diz o que você está pensando.", "Me diga o que você está pensando."], grammar: [g.br-ep-grammar-overview, g.ep-enclisis, g.ep-imperative-tu], vocab: [w.pensar], error: { wrong: "Me diz o que estás a pensar.", explain: "A hybrid: Brazilian proclisis at the start (Me diz) with European tu + estar a. In Portugal: Diz-me o que estás a pensar; in Brazil: Me diz o que você está pensando.", grammar: g.br-ep-grammar-overview } }
      - { es: "Tens de ver isto antes de voltares para o Brasil.", en: "You've got to see this before you go back to Brazil.", altEs: ["Você tem que ver isso antes de voltar para o Brasil."], grammar: [g.br-ep-grammar-overview, g.personal-infinitive-uses], vocab: [w.voltar] }
      - { es: "Ontem chegámos a casa tarde e a Leonor já estava a dormir.", en: "Yesterday we got home late and Leonor was already asleep.", altEs: ["Ontem a gente chegou em casa tarde e a Leonor já estava dormindo.", "Ontem chegamos em casa tarde e a Leonor já estava dormindo."], grammar: [g.br-ep-grammar-overview, g.ep-spelling-accents, g.ep-articles-names-possessives], vocab: [w.chegar], transform: { instruction: "Rewrite it the Brazilian way, with a gente", answer: "Ontem a gente chegou em casa tarde e a Leonor já estava dormindo.", alt: ["Ontem a gente chegou em casa tarde e Leonor já estava dormindo."] } }
      - { es: "Vi-o ontem no metro, mas ele não me viu.", en: "I saw him yesterday on the metro, but he didn't see me.", altEs: ["Vi ele ontem no metrô, mas ele não me viu.", "Eu o vi ontem no metrô, mas ele não me viu."], grammar: [g.br-ep-grammar-overview, g.ep-enclisis, g.ele-as-object], vocab: [w.metro] }
      - { es: "Gostava que me ligasses quando chegasses a Sagres.", en: "I'd like you to call me when you get to Sagres.", altEs: ["Eu gostaria que você me ligasse quando chegasse em Sagres."], grammar: [g.br-ep-grammar-overview, g.ep-imperfect-for-conditional, g.subjunctive-imperfect], vocab: [w.ligar] }
      - { es: "Preciso de ir ao banco; vou dizer-te o resto depois.", en: "I need to go to the bank; I'll tell you the rest later.", altEs: ["Preciso ir ao banco; vou te dizer o resto depois."], grammar: [g.br-ep-grammar-overview, g.precisar-de, g.clitics-verb-phrases], vocab: [w.precisar, w.banco] }
      - { es: "A fluência não vem da gramática, vem da prática.", en: "Fluency doesn't come from grammar, it comes from practice.", altEs: ["Fluência não vem da gramática, vem da prática."], grammar: [g.br-ep-grammar-overview], vocab: [w.fluência, w.gramática, w.prática] }
      - { es: "Ela é fluente nas duas normas e muda de uma para a outra sem dar por isso.", en: "She's fluent in both norms and switches from one to the other without noticing.", altEs: ["Ela é fluente nas duas normas e troca de uma para a outra sem perceber."], grammar: [g.br-ep-grammar-overview], vocab: [w.fluente, w.norma] }
      - { es: "O português vem do galego-português, que por sua vez vem do latim.", en: "Portuguese comes from Galician-Portuguese, which in turn comes from Latin.", altEs: ["O português vem do galego-português, que, por sua vez, vem do latim."], grammar: [g.br-ep-grammar-overview, g.relative-que-quem], vocab: [w.galego-português, w.latim] }
      - { es: "A etimologia de «saudade» é o latim solitate: a palavra nasceu da solidão.", en: "The etymology of 'saudade' is the Latin solitate: the word was born of solitude.", grammar: [g.br-ep-grammar-overview], vocab: [w.etimologia, w.étimo, w.solidão], note: "Latin solitas, solitatis (solitude) is the usual étimo given for saudade." }
      - { es: "A diferença mais audível está na prosódia: os portugueses comem as vogais átonas.", en: "The most audible difference is in the prosody: the Portuguese swallow their unstressed vowels.", altEs: ["A diferença mais audível está na prosódia: os portugueses engolem as vogais átonas."], grammar: [g.br-ep-grammar-overview, g.superlatives], vocab: [w.prosódia, w.vogal] }
      - { es: "Na fonética, o ditongo nasal de «mãe» é igual nos dois lados do Atlântico.", en: "Phonetically, the nasal diphthong in 'mãe' is the same on both sides of the Atlantic.", altEs: ["Foneticamente, o ditongo nasal de «mãe» é igual nos dois lados do Atlântico."], grammar: [g.br-ep-grammar-overview], vocab: [w.fonética, w.ditongo, w.nasal] }
      - { es: "Um purista diria que isso é um brasileirismo; um linguista, que é só português.", en: "A purist would say that's a Brazilianism; a linguist, that it's just Portuguese.", altEs: ["Um purista diria que isso é um brasileirismo; um linguista diria que é só português."], grammar: [g.br-ep-grammar-overview, g.conditional-simple], vocab: [w.purista, w.brasileirismo, w.linguista] }
      - { es: "Dizer «alterações climáticas» em Lisboa e «mudanças climáticas» em São Paulo é sinal de proficiência.", en: "Saying 'alterações climáticas' in Lisbon and 'mudanças climáticas' in São Paulo is a sign of proficiency.", grammar: [g.br-ep-grammar-overview, g.translation-nuance], vocab: [w.alterações-climáticas, w.mudanças-climáticas, w.proficiência] }
      - { es: "Para aperfeiçoar a entoação, imita os noticiários dos dois países.", en: "To perfect your intonation, imitate the news broadcasts of both countries.", altEs: ["Para aprimorar a entoação, imite os telejornais dos dois países."], grammar: [g.br-ep-grammar-overview, g.ep-imperative-tu], vocab: [w.aperfeiçoar, w.aprimorar, w.entoação] }
    exchanges:
      - q: { es: "Então, falas à portuguesa ou à brasileira?", en: "So, do you speak the Portuguese way or the Brazilian way?" }
        a: { es: "Depende de com quem estou a falar; já mudo sem pensar.", en: "It depends who I'm talking to; I switch without thinking now." }
        alt: ["As duas, conforme o sítio.", "Depende de com quem eu estou falando."]
        grammar: [g.br-ep-grammar-overview, g.ep-estar-a-infinitive]
        vocab: [w.mudar]
      - q: { es: "Qual das normas é a correta?", en: "Which of the norms is the correct one?" }
        a: { es: "As duas: cada uma tem a sua norma-padrão, e nenhuma é mais português do que a outra.", en: "Both: each has its own standard, and neither is more Portuguese than the other." }
        alt: ["As duas são corretas.", "Ambas; o importante é não as misturar no mesmo texto."]
        grammar: [g.br-ep-grammar-overview]
        vocab: [w.norma-padrão]
      - q: { es: "«Vou-te dizer» ou «vou te dizer»?", en: "'Vou-te dizer' or 'vou te dizer'?" }
        a: { es: "Em Portugal, «vou dizer-te»; no Brasil, «vou te dizer».", en: "In Portugal, 'vou dizer-te'; in Brazil, 'vou te dizer'." }
        alt: ["Depende do país.", "«Vou dizer-te» cá, «vou te dizer» lá."]
        grammar: [g.br-ep-grammar-overview, g.clitics-verb-phrases]
        vocab: [w.dizer]
      - q: { es: "«Chique» é um galicismo?", en: "Is 'chique' a Gallicism?" }
        a: { es: "É, vem do francês chic; o português está cheio deles.", en: "Yes, it comes from French chic; Portuguese is full of them." }
        alt: ["É, do francês.", "Sim, como «abajur» e «garçom»."]
        grammar: [g.br-ep-grammar-overview]
        vocab: [w.galicismo]
      - q: { es: "Ainda se usa «vós»?", en: "Is 'vós' still used?" }
        a: { es: "Só em orações, textos arcaicos e em algumas aldeias do Norte; no resto é obsoleto.", en: "Only in prayers, archaic texts and some villages in the North; elsewhere it's obsolete." }
        alt: ["Quase nunca.", "Na fala, praticamente não; é coisa de textos antigos."]
        grammar: [g.br-ep-grammar-overview, g.vos-archaic]
        vocab: [w.arcaico, w.obsoleto]
    texts:
      - title: "Ficha de autoavaliação"
        es: ["Uso a mesma norma do princípio ao fim do texto.", "Coloco os pronomes de acordo com a norma escolhida.", "Evito misturar «tu» com «você» na mesma frase."]
        en: ["I use the same norm from the beginning to the end of the text.", "I place the pronouns according to the chosen norm.", "I avoid mixing 'tu' with 'você' in the same sentence."]
        grammar: [g.br-ep-grammar-overview, g.c2-review]
        vocab: [w.norma, w.pronome]
      - title: "Dicionário de bolso"
        es: ["Lusitanismo: palavra ou expressão típica de Portugal, como «bué» ou «fixe».", "Brasileirismo: palavra ou expressão típica do Brasil, como «cafuné» ou «xodó».", "Ambas são português castiço."]
        en: ["Lusitanism: a word or phrase typical of Portugal, such as 'bué' or 'fixe'.", "Brazilianism: a word or phrase typical of Brazil, such as 'cafuné' or 'xodó'.", "Both are authentic Portuguese."]
        grammar: [g.br-ep-grammar-overview]
        vocab: [w.lusitanismo, w.brasileirismo, w.castiço]
    spicy:
      - { es: "Contigo falo as duas normas: «amo-te» em Lisboa e «te amo» no Rio.", en: "With you I speak both norms: 'amo-te' in Lisbon and 'te amo' in Rio.", altEs: ["Com você eu falo as duas normas: «amo-te» em Lisboa e «te amo» no Rio."], grammar: [g.br-ep-grammar-overview, g.ep-enclisis], vocab: [w.norma, w.amar] }
      - { es: "Estou a pensar em ti, estou pensando em você: em qualquer norma, a frase é a mesma.", en: "I'm thinking of you, in Portugal or in Brazil: in any norm, the sentence is the same.", grammar: [g.br-ep-grammar-overview, g.ep-estar-a-infinitive], vocab: [w.pensar] }
      - { es: "A tua entoação ao dizer o meu nome devia ser património nacional.", en: "Your intonation when you say my name ought to be national heritage.", altEs: ["A sua entoação ao dizer o meu nome devia ser patrimônio nacional."], grammar: [g.br-ep-grammar-overview, g.ep-imperfect-for-conditional], vocab: [w.entoação] }
      - { es: "Não sou purista, mas um beijo à portuguesa e outro à brasileira não fazem mal a ninguém.", en: "I'm no purist, but a Portuguese-style kiss and a Brazilian-style one never hurt anybody.", altEs: ["Não sou purista, mas um beijo à portuguesa e outro à brasileira não fazem mal a ninguém."], grammar: [g.br-ep-grammar-overview], vocab: [w.purista, w.beijo] }
      - { es: "Aperfeiçoei o sotaque de Lisboa só para te perguntar se queres jantar comigo.", en: "I perfected my Lisbon accent just to ask you if you'd like to have dinner with me.", altEs: ["Aperfeiçoei o sotaque de Lisboa só para te perguntar se você quer jantar comigo."], grammar: [g.br-ep-grammar-overview, g.ep-tu-forms], vocab: [w.aperfeiçoar, w.sotaque] }
  - id: c2.u08.l2
    title: Pois é, pronto, olha
    teach: [g.native-fluency-markers]
    vocab: [w.pedante, w.presunçoso, w.pernóstico, w.bonacheirão, w.sisudo, w.circunspecto, w.taciturno, w.mordaz, w.jocoso, w.zombeteiro, w.petulante, w.assertivo, w.lúcido, w.lucidez, w.verve, w.fleuma, w.empáfia, w.altivez, w.arroubo, w.devaneio, w.nefelibata, w.azáfama, w.imbróglio, w.tergiversar, w.procrastinar, w.exasperar, w.sôfrego, w.zeloso, w.volúvel, w.contumaz, w.obstinação, w.sucinto, w.cáustico, w.veemente, w.vitupério, w.escrúpulo, w.acrimônia, w.cizânia, w.embuste, w.ardil, w.subterfúgio, w.escamotear, w.rocambolesco, w.estapafúrdio, w.esdrúxulo, w.fastidioso]
    tip: "Natives sprinkle their speech lightly: pois, pronto, olha, a sério? in Portugal; né, tipo, então, nossa! in Brazil. Pronto in Lisbon is a filler ('right, OK'), not 'ready'."
    sentences:
      - { es: "Pronto, então fica combinado: jantamos às oito.", en: "Right, so that's settled: we'll have dinner at eight.", altEs: ["Então tá, fica combinado: a gente janta às oito."], grammar: [g.native-fluency-markers], vocab: [w.pronto, w.combinar] }
      - { es: "A sério? Não sabia que ele era tão sisudo.", en: "Really? I didn't know he was so stern.", altEs: ["Sério? Não sabia que ele era tão sisudo.", "Jura? Eu não sabia que ele era tão sério."], grammar: [g.native-fluency-markers], vocab: [w.sisudo] }
      - { es: "Olha, sabes que mais? Vamos a pé até ao farol.", en: "Look, you know what? Let's walk to the lighthouse.", altEs: ["Olha, quer saber? Vamos a pé até o farol."], grammar: [g.native-fluency-markers, g.ep-tu-forms], vocab: [w.farol] }
      - { es: "Pois é, a vida é assim: uns procrastinam e outros fazem tudo à última hora.", en: "Yeah, that's life: some people procrastinate and others do everything at the last minute.", altEs: ["Pois é, a vida é assim: uns procrastinam e outros fazem tudo na última hora."], grammar: [g.native-fluency-markers], vocab: [w.procrastinar] }
      - { es: "O meu chefe é um bonacheirão; já o meu professor de Latim era bem mais circunspecto.", en: "My boss is an easy-going fellow; my Latin teacher, on the other hand, was far more circumspect.", altEs: ["Meu chefe é um bonachão; já meu professor de latim era bem mais circunspecto."], grammar: [g.native-fluency-markers, g.discourse-markers-advanced], vocab: [w.bonacheirão, w.circunspecto] }
      - { es: "Ele é tão pedante que corrige a pronúncia do empregado de mesa.", en: "He's so pedantic that he corrects the waiter's pronunciation.", altEs: ["Ele é tão pedante que corrige a pronúncia do garçom."], grammar: [g.native-fluency-markers, g.consequence-clauses], vocab: [w.pedante, w.pronúncia], error: { wrong: "Ele é tão pedante como corrige a pronúncia do empregado de mesa.", explain: "Tão + adjective + que expresses the consequence; tão… como is for comparisons.", grammar: g.consequence-clauses } }
      - { es: "Ouve lá, não tergiverses: vens ou não vens?", en: "Listen, don't beat about the bush: are you coming or not?", altEs: ["Escuta, não enrola: você vem ou não vem?"], grammar: [g.native-fluency-markers, g.imperative-negative], vocab: [w.tergiversar], transform: { instruction: "Say it the Brazilian way, to someone you call você", answer: "Escuta, não enrola: você vem ou não vem?", alt: ["Escuta, não tergiverse: você vem ou não vem?", "Olha, não enrola: você vem ou não vem?"] } }
      - { es: "Que coisa! A reunião foi um imbróglio do princípio ao fim.", en: "Well, I never! The meeting was a mess from start to finish.", altEs: ["Nossa! A reunião foi uma confusão do começo ao fim."], grammar: [g.native-fluency-markers], vocab: [w.imbróglio] }
      - { es: "Ela respondeu com uma verve mordaz que deixou toda a gente calada.", en: "She answered with a biting wit that left everyone speechless.", altEs: ["Ela respondeu com uma verve mordaz que deixou todo mundo calado."], grammar: [g.native-fluency-markers], vocab: [w.verve, w.mordaz] }
      - { es: "Não sejas petulante; sê assertivo, que é outra coisa.", en: "Don't be impertinent; be assertive, which is something else.", altEs: ["Não seja petulante; seja assertivo, que é outra coisa."], grammar: [g.native-fluency-markers, g.ep-imperative-tu, g.imperative-negative], vocab: [w.petulante, w.assertivo], transform: { instruction: "Say it to someone you call você", answer: "Não seja petulante; seja assertivo, que é outra coisa.", alt: ["Não seja petulante, seja assertivo, que é outra coisa."] } }
      - { es: "Com uma fleuma britânica, o guia continuou a falar enquanto chovia a potes.", en: "With British composure, the guide kept talking while it poured with rain.", altEs: ["Com uma fleuma britânica, o guia continuou falando enquanto chovia canivete."], grammar: [g.native-fluency-markers, g.ep-aspect-periphrases], vocab: [w.fleuma] }
      - { es: "A história dele é tão rocambolesca que já ninguém acredita: parece um embuste.", en: "His story is so far-fetched that nobody believes it any more: it sounds like a hoax.", altEs: ["A história dele é tão rocambolesca que ninguém mais acredita: parece um embuste."], grammar: [g.native-fluency-markers, g.consequence-clauses], vocab: [w.rocambolesco, w.embuste] }
      - { es: "Pronto, admito: aquela desculpa foi um subterfúgio para não ir à reunião.", en: "All right, I admit it: that excuse was a ploy to get out of the meeting.", altEs: ["Tá bom, admito: aquela desculpa foi um subterfúgio para não ir à reunião."], grammar: [g.native-fluency-markers], vocab: [w.subterfúgio, w.desculpa] }
      - { es: "Sê sucinto, que a azáfama da manhã não dá tempo para discursos.", en: "Be brief: the morning rush leaves no time for speeches.", altEs: ["Seja sucinto, que a correria da manhã não dá tempo para discurso."], grammar: [g.native-fluency-markers, g.ep-imperative-tu], vocab: [w.sucinto, w.azáfama] }
      - { es: "Era um nefelibata: passava as aulas perdido em devaneios.", en: "He had his head in the clouds: he spent lessons lost in daydreams.", altEs: ["Era um sonhador: passava as aulas perdido em devaneios."], grammar: [g.native-fluency-markers, g.imperfect], vocab: [w.nefelibata, w.devaneio] }
      - { es: "Não escamoteies o problema; ninguém aqui tem escrúpulos em dizer a verdade.", en: "Don't fudge the problem; nobody here has any qualms about telling the truth.", altEs: ["Não escamoteie o problema; ninguém aqui tem escrúpulo em dizer a verdade."], grammar: [g.native-fluency-markers, g.imperative-negative], vocab: [w.escamotear, w.escrúpulo] }
    exchanges:
      - q: { es: "Já sabes a novidade? O Rui vai casar!", en: "Have you heard the news? Rui is getting married!" }
        a: { es: "A sério?! Com aquela empáfia toda, nunca pensei.", en: "Really?! With all that arrogance of his, I never thought he would." }
        alt: ["A sério? Não acredito!", "Jura?! Nunca imaginei."]
        grammar: [g.native-fluency-markers, g.ep-tu-forms]
        vocab: [w.empáfia]
      - q: { es: "O jantar correu bem?", en: "Did the dinner go well?" }
        a: { es: "Correu, pronto. Tirando a acrimónia entre os dois irmãos.", en: "It went fine, anyway. Apart from the acrimony between the two brothers." }
        alt: ["Correu bem, pronto.", "Deu tudo certo, enfim. Tirando a acrimônia entre os dois irmãos."]
        grammar: [g.native-fluency-markers]
        vocab: [w.acrimônia]
      - q: { es: "Porque é que ela está tão calada?", en: "Why is she so quiet?" }
        a: { es: "Ela é assim, taciturna; mas quando fala, é de uma lucidez impressionante.", en: "She's like that, taciturn; but when she speaks, she's impressively lucid." }
        alt: ["É taciturna por natureza.", "Ela é assim mesmo, mas é muito lúcida."]
        grammar: [g.native-fluency-markers]
        vocab: [w.taciturno, w.lucidez]
      - q: { es: "Achas que ele vai mudar de ideias?", en: "Do you think he'll change his mind?" }
        a: { es: "Duvido; é de uma obstinação contumaz.", en: "I doubt it; he's stubborn to the core." }
        alt: ["Ele? Nunca.", "Duvido, ele é teimoso demais."]
        grammar: [g.native-fluency-markers, g.ep-tu-forms]
        vocab: [w.obstinação, w.contumaz]
      - q: { es: "Leste a crítica ao novo filme?", en: "Did you read the review of the new film?" }
        a: { es: "Li. Cáustica, como sempre, mas desta vez tem razão.", en: "I did. Caustic, as always, but this time it's right." }
        alt: ["Li, foi bem mordaz.", "Li, muito cáustica, né?"]
        grammar: [g.native-fluency-markers]
        vocab: [w.cáustico]
    texts:
      - title: "Conversa ouvida no café"
        es: ["— Olha, pá, ouve lá: isto é tudo um imbróglio.", "— Pois, pois. E tu, como sempre, a tergiversar.", "— Pronto, pronto, não te exasperes."]
        en: ["'Look, mate, listen: this whole thing is a mess.'", "'Yeah, yeah. And you, as usual, beating about the bush.'", "'All right, all right, don't get worked up.'"]
        grammar: [g.native-fluency-markers, g.ep-estar-a-infinitive]
        vocab: [w.imbróglio, w.tergiversar, w.exasperar]
      - title: "Retrato de um colega"
        es: ["Zeloso no trabalho, volúvel no amor e sôfrego à mesa.", "Tem um humor jocoso, às vezes zombeteiro, nunca cruel.", "Pernóstico? Um pouco. Presunçoso? Só às sextas."]
        en: ["Diligent at work, fickle in love and greedy at the table.", "He has a jocular sense of humour, sometimes mocking, never cruel.", "Pretentious? A bit. Presumptuous? Only on Fridays."]
        grammar: [g.native-fluency-markers]
        vocab: [w.zeloso, w.volúvel, w.sôfrego, w.jocoso, w.zombeteiro, w.pernóstico, w.presunçoso]
    spicy:
      - { es: "Pronto, confesso: o meu ardil era ficar até tarde para me ofereceres boleia.", en: "All right, I confess: my ruse was to stay late so you'd offer me a lift.", altEs: ["Tá bom, confesso: o meu plano era ficar até tarde para você me oferecer carona."], grammar: [g.native-fluency-markers, g.personal-infinitive-uses], vocab: [w.ardil, w.boleia] }
      - { es: "A sério que não percebeste? Estou há uma hora a fazer-te olhinhos.", en: "Seriously, you didn't get it? I've been making eyes at you for an hour.", altEs: ["Sério que você não percebeu? Faz uma hora que estou te dando mole."], grammar: [g.native-fluency-markers, g.ep-estar-a-infinitive], vocab: [w.perceber] }
      - { es: "Olha, não sou volúvel: só mudei de ideias quando te vi.", en: "Look, I'm not fickle: I only changed my mind when I saw you.", altEs: ["Olha, não sou volúvel: só mudei de ideia quando te vi."], grammar: [g.native-fluency-markers, g.ep-proclisis-attractors], vocab: [w.volúvel] }
      - { es: "Pois é, sou um nefelibata, mas os meus devaneios ultimamente têm todos a tua cara.", en: "Yes, I've got my head in the clouds, but lately my daydreams all have your face.", altEs: ["Pois é, sou um sonhador, mas ultimamente todos os meus devaneios têm a sua cara."], grammar: [g.native-fluency-markers], vocab: [w.nefelibata, w.devaneio] }
      - { es: "Nada de arroubos: um jantar sucinto, uma conversa longa e logo se vê.", en: "No grand outbursts: a short dinner, a long conversation, and we'll see.", altEs: ["Nada de arroubos: um jantar rápido, uma conversa longa e depois a gente vê."], grammar: [g.native-fluency-markers], vocab: [w.arroubo, w.sucinto] }
  - id: c2.u08.l3
    title: No fim do mundo, em Sagres
    teach: [g.c2-review]
    vocab: [w.vetusto, w.soturno, w.plácido, w.tênue, w.fulgor, w.zênite, w.inefável, w.inaudito, w.incólume, w.indelével, w.perene, w.fugaz, w.impávido, w.incauto, w.pusilânime, w.abnegação, w.estoicismo, w.desígnio, w.quimera, w.malogro, w.vicissitude, w.ufano, w.ufanismo, w.sobrepujar, w.perscrutar, w.sorumbático, w.recôndito, w.fortaleza, w.promontório, w.soprar, w.marinheiro, w.bucólico, w.idílio, w.lúgubre, w.diáfano, w.plangente, w.torpor, w.beatitude, w.hermético, w.sibilino, w.inexpugnável, w.inextricável, w.atávico, w.iconoclasta, w.acuidade]
    tip: "A C2 checklist: fact → indicative; doubt, wish, purpose → subjunctive; open future after quando / se → future subjunctive; one norm per text; clitics by that norm."
    sentences:
      - { es: "Durante séculos, este promontório recôndito foi visto como o fim do mundo conhecido.", en: "For centuries, this remote headland was seen as the end of the known world.", altEs: ["Por séculos, este promontório recôndito foi considerado o fim do mundo conhecido."], grammar: [g.c2-review, g.passive-ser], vocab: [w.recôndito, w.século, w.mundo] }
      - { es: "Quando chegares ao farol, liga-me; quero ouvir o mar contigo.", en: "When you get to the lighthouse, call me; I want to hear the sea with you.", altEs: ["Quando você chegar ao farol, me liga; quero ouvir o mar com você."], grammar: [g.c2-review, g.future-subjunctive-time, g.ep-enclisis], vocab: [w.farol, w.ligar], transform: { instruction: "Rewrite it for a Brazilian friend", answer: "Quando você chegar ao farol, me liga; quero ouvir o mar com você.", alt: ["Quando você chegar no farol, me liga; quero ouvir o mar com você.", "Quando você chegar ao farol, me ligue; quero ouvir o mar com você."] } }
      - { es: "Diz-se que o Infante D. Henrique fundou aqui uma escola de navegação, mas os historiadores duvidam.", en: "It's said that Prince Henry founded a school of navigation here, but historians doubt it.", altEs: ["Dizem que o Infante Dom Henrique fundou aqui uma escola de navegação, mas os historiadores duvidam."], grammar: [g.c2-review, g.ep-enclisis, g.indeterminate-subject], vocab: [w.infante, w.navegação, w.historiador] }
      - { es: "Talvez a «Escola de Sagres» não passe de uma quimera, mas o desígnio do Infante era bem real.", en: "Perhaps the 'School of Sagres' is no more than a pipe dream, but Prince Henry's purpose was very real.", altEs: ["Talvez a «Escola de Sagres» não passe de uma quimera, mas o objetivo do Infante era bem real."], grammar: [g.c2-review, g.talvez], vocab: [w.quimera, w.desígnio] }
      - { es: "As muralhas vetustas da fortaleza resistiram incólumes ao terramoto de 1755? Nem por isso.", en: "Did the ancient walls of the fortress come through the 1755 earthquake unscathed? Not really.", altEs: ["As muralhas vetustas da fortaleza saíram incólumes do terremoto de 1755? Não exatamente."], grammar: [g.c2-review], vocab: [w.vetusto, w.fortaleza, w.incólume, w.terramoto], note: "The 1755 earthquake and tsunami badly damaged Sagres; the fortress was largely rebuilt in the 18th century." }
      - { es: "Ao lusco-fusco, a luz tênue do farol perscruta o mar, plácido e soturno ao mesmo tempo.", en: "At dusk, the faint light of the lighthouse searches the sea, placid and sombre at once.", altEs: ["No lusco-fusco, a luz tênue do farol perscruta o mar, plácido e soturno ao mesmo tempo."], grammar: [g.c2-review, g.literary-devices], vocab: [w.tênue, w.perscrutar, w.plácido, w.soturno], note: "ténue (Portugal) / tênue (Brazil)." }
      - { es: "Embora o vento soprasse com força, ficámos impávidos à beira da falésia.", en: "Although the wind was blowing hard, we stood fearless at the edge of the cliff.", altEs: ["Embora o vento soprasse forte, ficamos impávidos na beira da falésia."], grammar: [g.c2-review, g.embora-concession, g.subjunctive-imperfect], vocab: [w.impávido, w.falésia, w.soprar], transform: { instruction: "Replace embora with apesar de + infinitive", answer: "Apesar de o vento soprar com força, ficámos impávidos à beira da falésia.", alt: ["Apesar do vento soprar com força, ficámos impávidos à beira da falésia.", "Apesar de o vento soprar com força, ficamos impávidos na beira da falésia."] } }
      - { es: "Os incautos que se aproximam demasiado da beira arriscam a vida pela fotografia.", en: "The unwary who get too close to the edge risk their lives for a photo.", altEs: ["Os incautos que chegam perto demais da beira arriscam a vida pela foto."], grammar: [g.c2-review, g.relative-que-quem], vocab: [w.incauto, w.arriscar] }
      - { es: "Se me tivesses dito que o pôr do sol era tão inefável, tinha vindo mais cedo.", en: "If you'd told me the sunset was so indescribable, I'd have come earlier.", altEs: ["Se você tivesse me dito que o pôr do sol era tão inefável, eu teria vindo mais cedo."], grammar: [g.c2-review, g.se-clauses-past, g.ep-imperfect-for-conditional], vocab: [w.inefável, w.pôr-do-sol], error: { wrong: "Se me terias dito que o pôr do sol era tão inefável, tinha vindo mais cedo.", explain: "The if-clause of a past unreal condition takes the pluperfect subjunctive (tivesses dito), never the conditional.", grammar: g.se-clauses-past } }
      - { es: "É importante sabermos as duas normas, mas é indispensável não as misturarmos.", en: "It's important for us to know both norms, but it's essential that we don't mix them.", altEs: ["É importante a gente saber as duas normas, mas é indispensável não misturar."], grammar: [g.c2-review, g.personal-infinitive-uses, g.ep-proclisis-attractors], vocab: [w.norma, w.misturar] }
      - { es: "O ufanismo das Descobertas deu lugar a uma leitura mais crítica, sem apagar o que tiveram de inaudito.", en: "The jingoistic pride of the Discoveries has given way to a more critical reading, without erasing what was unprecedented about them.", altEs: ["O ufanismo dos Descobrimentos deu lugar a uma leitura mais crítica, sem apagar o que eles tiveram de inaudito."], grammar: [g.c2-review, g.nominalization], vocab: [w.ufanismo, w.inaudito, w.leitura] }
      - { es: "Ufano do seu passado, o país esqueceu muitas vezes as vicissitudes de quem partia.", en: "Proud of its past, the country often forgot the hardships of those who set sail.", altEs: ["Orgulhoso do seu passado, o país muitas vezes esqueceu as vicissitudes de quem partia."], grammar: [g.c2-review, g.absolute-participle], vocab: [w.ufano, w.vicissitude] }
      - { es: "A abnegação dos marinheiros e o estoicismo das famílias deixaram uma marca indelével na língua.", en: "The sailors' self-sacrifice and the families' stoicism left an indelible mark on the language.", altEs: ["A abnegação dos marinheiros e o estoicismo das famílias deixaram uma marca indelével no idioma."], grammar: [g.c2-review], vocab: [w.abnegação, w.estoicismo, w.indelével, w.marinheiro] }
      - { es: "Ao sol do zénite, a planície do mar brilhava com um fulgor quase insuportável.", en: "Under the noon sun, the sea's flat expanse shone with an almost unbearable glare.", altEs: ["No sol do zênite, a planície do mar brilhava com um fulgor quase insuportável."], grammar: [g.c2-review, g.imperfect, g.literary-devices], vocab: [w.zênite, w.fulgor], note: "zénite (Portugal) / zênite (Brazil)." }
      - { es: "Para uns, o malogro de tantas viagens foi o preço do sonho; para outros, foi a prova da sua quimera.", en: "For some, the failure of so many voyages was the price of the dream; for others, it was proof of how foolish it was.", altEs: ["Para uns, o malogro de tantas viagens foi o preço do sonho; para outros, a prova de que era uma quimera."], grammar: [g.c2-review], vocab: [w.malogro, w.quimera] }
      - { es: "Não há nada mais fugaz do que um pôr do sol, nem mais perene do que a sua lembrança.", en: "Nothing is more fleeting than a sunset, nor more lasting than its memory.", altEs: ["Não há nada mais efémero do que um pôr do sol, nem mais perene do que a sua lembrança.", "Não tem nada mais fugaz do que um pôr do sol, nem mais perene do que a lembrança dele."], grammar: [g.c2-review, g.comparatives], vocab: [w.fugaz, w.perene, w.lembrança] }
    exchanges:
      - q: { es: "Vale a pena ir ao Cabo de São Vicente ao fim da tarde?", en: "Is it worth going to Cape St Vincent late in the afternoon?" }
        a: { es: "Vale, mas leva um casaco: o vento ali é de uma fúria inaudita.", en: "It is, but take a coat: the wind there is unbelievably fierce." }
        alt: ["Vale muito a pena, mas vai cedo para arranjar lugar.", "Vale, mas leva um casaco, que venta muito."]
        grammar: [g.c2-review, g.ep-imperative-tu]
        vocab: [w.inaudito]
      - q: { es: "Achas que a Escola de Sagres existiu mesmo?", en: "Do you think the School of Sagres really existed?" }
        a: { es: "Duvido que tenha sido uma escola a sério; era mais um centro de saber à volta do Infante.", en: "I doubt it was a real school; it was more a centre of learning around Prince Henry." }
        alt: ["Duvido muito.", "Duvido que tenha existido como escola."]
        grammar: [g.c2-review, g.subjunctive-doubt, g.subjunctive-perfect]
        vocab: [w.infante]
      - q: { es: "Como descreverias esta paisagem numa palavra?", en: "How would you describe this landscape in one word?" }
        a: { es: "Inefável. E se me pedires duas: inefável e ventosa.", en: "Indescribable. And if you ask me for two: indescribable and windy." }
        alt: ["Inefável.", "Lúgubre e linda ao mesmo tempo."]
        grammar: [g.c2-review, g.future-subjunctive-se]
        vocab: [w.inefável, w.paisagem]
      - q: { es: "O que te ficou desta viagem?", en: "What has stayed with you from this trip?" }
        a: { es: "Uma saudade antecipada e umas quantas palavras indeléveis.", en: "An advance case of saudade and a handful of indelible words." }
        alt: ["Saudades, muitas.", "Uma saudade enorme e muitas palavras novas."]
        grammar: [g.c2-review]
        vocab: [w.indelével, w.saudade]
      - q: { es: "Porque é que os navegadores partiam daqui?", en: "Why did the navigators set out from here?" }
        a: { es: "Era o ponto mais próximo do Atlântico desconhecido, e o Infante queria sobrepujar os limites do mapa.", en: "It was the nearest point to the unknown Atlantic, and Prince Henry wanted to surpass the limits of the map." }
        alt: ["Por estar virado para o Atlântico.", "Porque era o fim da Europa e o começo do desconhecido."]
        grammar: [g.c2-review, g.imperfect]
        vocab: [w.sobrepujar, w.mapa]
    texts:
      - title: "Placa na Fortaleza de Sagres"
        es: ["Neste promontório, segundo a tradição, viveu o Infante D. Henrique.", "A rosa-dos-ventos de pedra, com 43 metros de diâmetro, continua a ser um enigma.", "Os historiadores não estão de acordo quanto à sua origem."]
        en: ["On this headland, according to tradition, Prince Henry the Navigator lived.", "The stone compass rose, 43 metres across, remains a mystery.", "Historians do not agree about its origin."]
        grammar: [g.c2-review, g.ep-aspect-periphrases]
        vocab: [w.fortaleza, w.infante, w.historiador]
      - title: "Diário de viagem, último dia"
        es: ["O farol acendeu-se às oito e vinte, como um olho que perscruta o escuro.", "Fiquei sorumbático, mas não triste: é a saudade a chegar antes do tempo.", "Amanhã volto a São Paulo; hoje ainda sou um bocadinho de Portugal."]
        en: ["The lighthouse came on at twenty past eight, like an eye searching the dark.", "I grew pensive, but not sad: it's saudade arriving ahead of time.", "Tomorrow I go back to São Paulo; today I'm still a little bit of Portugal."]
        grammar: [g.c2-review, g.ep-enclisis, g.literary-devices]
        vocab: [w.farol, w.perscrutar, w.sorumbático, w.saudade]
    spicy:
      - { es: "Se fores ao fim do mundo, eu vou contigo; se ficares, fico também.", en: "If you go to the end of the world, I'll go with you; if you stay, I'll stay too.", altEs: ["Se você for ao fim do mundo, eu vou com você; se você ficar, eu fico também."], grammar: [g.c2-review, g.future-subjunctive-se], vocab: [w.mundo] }
      - { es: "Este pôr do sol é fugaz; o que sinto por ti, receio bem que seja perene.", en: "This sunset is fleeting; what I feel for you, I rather fear, is lasting.", altEs: ["Esse pôr do sol é fugaz; o que eu sinto por você, receio que seja perene."], grammar: [g.c2-review, g.subjunctive-emotion], vocab: [w.fugaz, w.perene] }
      - { es: "Fiquei impávido diante da falésia, mas diante do teu sorriso tremi.", en: "I stood fearless before the cliff, but before your smile I trembled.", altEs: ["Fiquei impávido diante da falésia, mas diante do seu sorriso eu tremi."], grammar: [g.c2-review, g.literary-devices], vocab: [w.impávido, w.falésia] }
      - { es: "Não sou pusilânime: só preciso de mais um copo antes de te convidar para dançar.", en: "I'm no coward: I just need one more drink before I ask you to dance.", altEs: ["Não sou covarde: só preciso de mais um copo antes de te chamar para dançar."], grammar: [g.c2-review, g.antes-depois-de], vocab: [w.pusilânime] }
  - id: c2.u08.l4
    title: Até à próxima, Brasil!
    teach: [g.c2-review, g.native-fluency-markers]
    vocab: [w.concerto, w.proveito, w.erudito, w.erudição, w.requinte, w.requintado, w.primor, w.esmero, w.esmerar-se, w.virtuosismo, w.lapidar, w.burilar, w.apoteose, w.prolífico, w.pródigo, w.parcimonioso, w.parcimônia, w.ostensivo, w.opróbrio, w.ignóbil, w.hediondo, w.pernicioso, w.deletério, w.inócuo, w.panaceia, w.precípuo, w.xenofobia, w.pegada-ecológica, w.neutralidade-carbónica, w.eólico, w.incêndio-florestal, w.alvissareiro, w.dirimir, w.recrudescer, w.tácito, w.vilipendiar, w.obtuso, w.elucubração, w.perfídia, w.longevo, w.insigne, w.conspícuo, w.pujante, w.magnânimo, w.apanágio, w.insurgir-se, w.nefasto, w.surfista]
    tip: "At C2 the errors that matter are register clashes and hybrid norms. Read the last texts aloud twice: once with Lisbon rhythm, once with São Paulo rhythm."
    sentences:
      - { es: "Bom proveito! E não te esqueças de nós quando voltares para o Brasil.", en: "Enjoy your meal! And don't forget us when you go back to Brazil.", altEs: ["Bom proveito! E não se esqueça da gente quando voltar para o Brasil."], grammar: [g.c2-review, g.ep-proclisis-attractors, g.future-subjunctive-time], vocab: [w.proveito, w.esquecer-se] }
      - { es: "Espero que tenhas gostado de Portugal tanto como Portugal gostou de ti.", en: "I hope you enjoyed Portugal as much as Portugal enjoyed you.", altEs: ["Espero que você tenha gostado de Portugal tanto quanto Portugal gostou de você."], grammar: [g.c2-review, g.subjunctive-perfect, g.comparatives], vocab: [w.esperar], transform: { instruction: "Rewrite it for a Brazilian reader", answer: "Espero que você tenha gostado de Portugal tanto quanto Portugal gostou de você.", alt: ["Espero que você tenha gostado de Portugal tanto como Portugal gostou de você."] } }
      - { es: "Ter-te-ia avisado do vento, se soubesse que vinhas de sandálias.", en: "I'd have warned you about the wind if I'd known you were coming in sandals.", altEs: ["Eu teria te avisado do vento, se soubesse que você vinha de sandália."], grammar: [g.c2-review, g.mesoclisis, g.conditional-perfect], vocab: [w.avisar, w.vento] }
      - { es: "As eólicas da serra e o mar de Sagres mostram que a neutralidade carbónica não é uma quimera.", en: "The wind turbines in the hills and the sea at Sagres show that carbon neutrality isn't a pipe dream.", altEs: ["As turbinas eólicas da serra e o mar de Sagres mostram que a neutralidade de carbono não é uma utopia."], grammar: [g.c2-review], vocab: [w.eólico, w.neutralidade-carbónica, w.quimera] }
      - { es: "O incêndio florestal de Monchique, em 2018, foi um aviso nefasto do que aí vem.", en: "The Monchique forest fire in 2018 was an ominous warning of what is coming.", altEs: ["O incêndio florestal de Monchique, em 2018, foi um aviso sombrio do que está por vir."], grammar: [g.c2-review], vocab: [w.incêndio-florestal, w.nefasto, w.aviso] }
      - { es: "Reduzir a pegada ecológica não é uma panaceia, mas também não é inócuo.", en: "Reducing your ecological footprint isn't a cure-all, but it isn't pointless either.", altEs: ["Reduzir a pegada ecológica não é uma panaceia, mas também não é inútil."], grammar: [g.c2-review, g.connectors-contrast], vocab: [w.pegada-ecológica, w.panaceia, w.inócuo] }
      - { es: "A xenofobia é perniciosa em qualquer língua; nenhuma norma a justifica.", en: "Xenophobia is pernicious in any language; no norm justifies it.", altEs: ["A xenofobia é perniciosa em qualquer língua; nenhuma norma justifica isso."], grammar: [g.c2-review, g.ep-proclisis-attractors], vocab: [w.xenofobia, w.pernicioso] }
      - { es: "O guitarrista tocou com um virtuosismo tal que o concerto acabou em apoteose.", en: "The guitarist played with such virtuosity that the concert ended in a triumphant finale.", altEs: ["O guitarrista tocou com tanto virtuosismo que o show terminou em apoteose."], grammar: [g.c2-review, g.consequence-clauses], vocab: [w.virtuosismo, w.concerto, w.apoteose, w.guitarrista] }
      - { es: "Um texto bem escrito burila-se com paciência e lapida-se com esmero.", en: "A well-written text is polished patiently and cut with great care.", altEs: ["Um texto bem escrito se burila com paciência e se lapida com esmero."], grammar: [g.c2-review, g.se-passive, g.ep-enclisis], vocab: [w.burilar, w.lapidar, w.esmero] }
      - { es: "A professora esmerou-se: até o vocabulário mais erudito ficou claro.", en: "The teacher took great pains: even the most learned vocabulary became clear.", altEs: ["A professora se esmerou: até o vocabulário mais erudito ficou claro."], grammar: [g.c2-review, g.ep-enclisis], vocab: [w.esmerar-se, w.erudito, w.vocabulário], error: { wrong: "A professora se esmerou-se: até o vocabulário mais erudito ficou claro.", explain: "The pronoun goes in one place only: esmerou-se (Portugal) or se esmerou (Brazil), never both.", grammar: g.br-ep-grammar-overview } }
      - { es: "Erudição sem humor é pedantismo; humor sem erudição é só piada.", en: "Learning without humour is pedantry; humour without learning is just a joke.", altEs: ["Erudição sem humor é pedantismo; humor sem erudição é só uma piada."], grammar: [g.c2-review, g.emphatic-structures], vocab: [w.erudição, w.piada] }
      - { es: "Pessoa foi prolífico; Saramago, pródigo em vírgulas; Camões, parcimonioso em nada.", en: "Pessoa was prolific; Saramago, lavish with commas; Camões, sparing with nothing.", altEs: ["Pessoa foi prolífico; Saramago, pródigo em vírgulas; Camões, parcimonioso em coisa nenhuma."], grammar: [g.c2-review, g.literary-devices], vocab: [w.prolífico, w.pródigo, w.parcimonioso, w.vírgula] }
      - { es: "Usa o calão com parcimónia e a erudição sem ostentação.", en: "Use slang sparingly and learning without showing off.", altEs: ["Use a gíria com parcimônia e a erudição sem ostentação."], grammar: [g.c2-review, g.ep-imperative-tu], vocab: [w.parcimônia, w.calão], note: "parcimónia (Portugal) / parcimônia (Brazil)." }
      - { es: "Houve um acordo tácito entre nós: tu ensinavas-me o calão de Lisboa e eu ensinava-te o de São Paulo.", en: "There was a tacit agreement between us: you taught me Lisbon slang and I taught you São Paulo's.", altEs: ["Teve um acordo tácito entre a gente: você me ensinava a gíria de Lisboa e eu te ensinava a de São Paulo."], grammar: [g.c2-review, g.imperfect, g.ep-enclisis], vocab: [w.tácito, w.acordo] }
      - { es: "As notícias são alvissareiras: o português é uma língua pujante e o número de alunos não para de crescer.", en: "The news is promising: Portuguese is a thriving language and the number of learners keeps growing.", altEs: ["As notícias são animadoras: o português é uma língua pujante e o número de alunos não para de crescer."], grammar: [g.c2-review], vocab: [w.alvissareiro, w.pujante, w.crescer] }
      - { es: "Se um dia voltares, traz o teu sotaque e deixa a pressa no avião.", en: "If you come back one day, bring your accent and leave your hurry on the plane.", altEs: ["Se um dia você voltar, traz o seu sotaque e deixa a pressa no avião."], grammar: [g.c2-review, g.future-subjunctive-se, g.ep-imperative-tu], vocab: [w.sotaque, w.pressa], transform: { instruction: "Rewrite it for a Brazilian friend", answer: "Se um dia você voltar, traz o seu sotaque e deixa a pressa no avião.", alt: ["Se um dia você voltar, traga o seu sotaque e deixe a pressa no avião.", "Se você voltar um dia, traz seu sotaque e deixa a pressa no avião."] } }
    exchanges:
      - q: { es: "Então, a que horas é o teu voo?", en: "So, what time is your flight?" }
        a: { es: "Às seis da manhã, de Faro. Pronto, vou ter de me despedir hoje.", en: "At six in the morning, from Faro. Right, I'll have to say goodbye today." }
        alt: ["Bem cedo, de Faro.", "Às seis, de Faro. Então, vou ter que me despedir hoje."]
        grammar: [g.native-fluency-markers, g.c2-review]
        vocab: [w.voo, w.despedir-se]
      - q: { es: "O que é que vais dizer aos teus amigos em São Paulo?", en: "What are you going to tell your friends in São Paulo?" }
        a: { es: "Que em Portugal se fala devagar no papel e depressa na rua!", en: "That in Portugal people speak slowly on paper and fast in the street!" }
        alt: ["Que tenho saudades antes de partir.", "Que o português de lá é lindo e rápido."]
        grammar: [g.c2-review, g.ep-tu-forms]
        vocab: [w.amigo]
      - q: { es: "Qual foi a palavra mais bonita que aprendeste?", en: "What was the most beautiful word you learned?" }
        a: { es: "Desassossego. Ou talvez lusco-fusco. Não me obrigues a escolher.", en: "Desassossego. Or maybe lusco-fusco. Don't make me choose." }
        alt: ["Saudade, claro.", "Desenrascanço, pela utilidade."]
        grammar: [g.c2-review, g.imperative-negative]
        vocab: [w.desassossego, w.lusco-fusco]
      - q: { es: "Achas que já dominas o português?", en: "Do you think you've mastered Portuguese now?" }
        a: { es: "Dominar, dominar, não; mas já não tropeço em mesóclises.", en: "Mastered, not quite; but I no longer trip over mesoclisis." }
        alt: ["Ainda falta muito, mas estou no caminho.", "Domino as duas normas, pelo menos no papel."]
        grammar: [g.c2-review, g.native-fluency-markers]
        vocab: [w.dominar, w.mesóclise]
      - q: { es: "Combinamos para o ano, no Rio?", en: "Shall we arrange to meet next year, in Rio?" }
        a: { es: "Combinado! Desta vez sou eu que te mostro o Brasil.", en: "Deal! This time I'll be the one showing you Brazil." }
        alt: ["Fechado!", "Combinado, eu te mostro o Rio inteiro."]
        grammar: [g.native-fluency-markers, g.c2-review]
        vocab: [w.combinar]
    texts:
      - title: "Último postal"
        es: ["Querida Leonor, escrevo-te do aeroporto de Faro.", "Levo um galo de Barcelos, um azulejo e uma saudade que não cabe na mala.", "Para o ano, no Rio, o pequeno-almoço é por minha conta. Beijinhos!"]
        en: ["Dear Leonor, I'm writing to you from Faro airport.", "I'm taking a Barcelos rooster, a tile and a saudade that won't fit in my suitcase.", "Next year, in Rio, breakfast is on me. Love!"]
        grammar: [g.c2-review, g.ep-enclisis, g.untranslatables]
        vocab: [w.saudade, w.mala, w.pequeno-almoço]
      - title: "Programa de festas em Sagres"
        es: ["Sexta-feira: concerto de guitarra portuguesa na fortaleza, às 21h.", "Sábado: aula de surf para principiantes com surfistas locais.", "Domingo: pôr do sol no Cabo de São Vicente, com percebes e música ao vivo."]
        en: ["Friday: Portuguese guitar concert at the fortress, 9 pm.", "Saturday: surf lesson for beginners with local surfers.", "Sunday: sunset at Cape St Vincent, with goose barnacles and live music."]
        grammar: [g.c2-review]
        vocab: [w.concerto, w.fortaleza, w.surfista, w.pôr-do-sol]
    spicy:
      - { es: "Não me despeço: digo só «até já», que é mais requintado e menos definitivo.", en: "I'm not saying goodbye: I'm just saying 'see you soon', which is classier and less final.", altEs: ["Não vou me despedir: digo só «até já», que é mais elegante e menos definitivo."], grammar: [g.c2-review, g.native-fluency-markers], vocab: [w.requintado] }
      - { es: "Vou ter saudades tuas com um primor que nem Camões conseguiria rimar.", en: "I'm going to miss you so exquisitely that not even Camões could make it rhyme.", altEs: ["Vou sentir saudade de você com um primor que nem Camões conseguiria rimar."], grammar: [g.c2-review, g.untranslatables, g.conditional-simple], vocab: [w.primor, w.rimar] }
      - { es: "Se me convidares para o Rio, aceito sem tergiversar.", en: "If you invite me to Rio, I'll accept without beating about the bush.", altEs: ["Se você me convidar para o Rio, aceito sem enrolar."], grammar: [g.c2-review, g.future-subjunctive-se], vocab: [w.tergiversar, w.convidar] }
      - { es: "Leva o meu cachecol do Porto. Assim tens uma desculpa ostensiva para voltar.", en: "Take my Porto scarf. That way you have an obvious excuse to come back.", altEs: ["Leva o meu cachecol do Porto. Assim você tem uma desculpa óbvia para voltar."], grammar: [g.c2-review, g.ep-imperative-tu], vocab: [w.ostensivo, w.cachecol] }
      - { es: "Domino as duas normas, mas a única língua em que te quero dizer adeus é nenhuma.", en: "I've mastered both norms, but the only language I want to say goodbye to you in is none.", altEs: ["Domino as duas normas, mas a única língua em que quero te dizer adeus é nenhuma."], grammar: [g.c2-review, g.relative-o-qual], vocab: [w.dominar, w.adeus] }
dialogues:
  - id: c2.u08.d1
    title: Pôr do sol no Cabo de São Vicente
    context: "On her last evening in Portugal, Juliana watches the sunset at Cape St Vincent with Leonor. They play at switching norms and say goodbye."
    lines:
      - { speaker: Leonor, es: "Pronto, cá estamos: o fim do mundo. Que tal?", en: "Right, here we are: the end of the world. What do you think?" }
      - { speaker: Juliana, es: "Nossa… quer dizer: a sério, isto é inefável.", en: "Wow… I mean: seriously, this is beyond words." }
      - { speaker: Leonor, es: "Olha para ti! Já falas melhor do que muitos lisboetas.", en: "Look at you! You already speak better than lots of Lisbon people." }
      - { speaker: Juliana, es: "Tu é que me ensinaste tudo: o «estar a», o «diz-me», até o «pá».", en: "You're the one who taught me everything: 'estar a', 'diz-me', even 'pá'." }
      - { speaker: Leonor, es: "E tu ensinaste-me o «né» e o «bora». Acho que ficámos quites.", en: "And you taught me 'né' and 'bora'. I think we're even." }
      - { speaker: Juliana, es: "Amanhã, no avião, vou ter de voltar ao «você» e ao «estou indo».", en: "Tomorrow, on the plane, I'll have to go back to 'você' and 'estou indo'." }
      - { speaker: Leonor, es: "Muda de norma, mas não mudes de amiga. Prometes?", en: "Change norms, but don't change friends. Promise?" }
      - { speaker: Juliana, es: "Prometo. E quando fores ao Rio, eu levo-te a ver o pôr do sol no Arpoador.", en: "I promise. And when you come to Rio, I'll take you to see the sunset at Arpoador." }
      - { speaker: Leonor, es: "Combinado. Olha, o sol está a desaparecer… pede um desejo.", en: "Deal. Look, the sun is disappearing… make a wish." }
      - { speaker: Juliana, es: "Já pedi: voltar. Não te digo mais nada, senão não se cumpre.", en: "I already have: to come back. I won't tell you any more, or it won't come true." }
    questions:
      - { q: "Onde estão a Juliana e a Leonor?", options: ["No aeroporto de Faro", "No Cabo de São Vicente, ao pôr do sol", "Numa praia do Rio"], answer: 1, explain: "Leonor calls it «o fim do mundo»: Cape St Vincent, at sunset." }
      - { q: "Que palavras brasileiras ensinou a Juliana à Leonor?", options: ["«Pá» e «fixe»", "«Né» e «bora»", "«Estar a» e «diz-me»"], answer: 1, explain: "Leonor: «tu ensinaste-me o né e o bora»." }
      - { q: "O que pede a Leonor à Juliana?", options: ["Que não mude de amiga", "Que fale sempre à portuguesa", "Que fique em Portugal"], answer: 0, explain: "«Muda de norma, mas não mudes de amiga.»" }
      - { q: "Qual foi o desejo da Juliana?", options: ["Ficar em Sagres", "Voltar", "Aprender mais calão"], answer: 1, explain: "«Já pedi: voltar.»" }
writing:
  - task: "Write the same short message twice, once following the European norm and once the Brazilian one, then explain the main grammatical differences (estar a + infinitive vs gerund, pronoun placement, tu vs você)."
    min: 130
    max: 220
    use: [w.norma-padrão, w.sintaxe, w.fluência, w.brasileirismo, w.lusitanismo]
    useAtLeast: 3
    grammar: [g.br-ep-grammar-overview]
    expect:
      - { pattern: '\b(estou|est[aá]|estamos|est[aã]o) a [a-zà-ú]+r', hint: "Include the European construction: estou a escrever…" }
      - { pattern: '\b(estou|est[aá]|estamos|est[aã]o) [a-zà-ú]+(ando|endo|indo)\b', hint: "Include the Brazilian construction: estou escrevendo…" }
    model: { es: "Em Lisboa, escreveria: estou a escrever-te do café, enquanto a chuva cai lá fora; diz-me se recebeste as fotografias. No Rio, a mesma ideia soaria assim: estou escrevendo pra você do café, enquanto a chuva cai lá fora; me diz se recebeu as fotos. As diferenças são sobretudo de sintaxe. Em primeiro lugar, Portugal prefere estar a mais infinitivo, e o Brasil prefere o gerúndio. Em segundo lugar, a posição do pronome muda: em Portugal, o pronome vem normalmente depois do verbo, e no Brasil vem antes, mesmo no início da frase. Por fim, o português usa tu com a segunda pessoa do verbo, ao passo que o brasileiro usa você com a terceira. Nenhuma é a única norma-padrão: um brasileirismo como me diz não é um erro, tal como um lusitanismo como diz-me também não o é. Dominar as duas é que é sinal de verdadeira fluência.", en: "In Lisbon I'd write: estou a escrever-te do café, enquanto a chuva cai lá fora; diz-me se recebeste as fotografias. In Rio the same idea would sound like this: estou escrevendo pra você do café, enquanto a chuva cai lá fora; me diz se recebeu as fotos. The differences are mainly syntactic. First, Portugal prefers estar a plus infinitive, and Brazil prefers the gerund. Second, pronoun position changes: in Portugal the pronoun normally comes after the verb, and in Brazil before it, even at the start of a sentence. Finally, the Portuguese use tu with the second-person verb, whereas Brazilians use você with the third. Neither is the only standard: a Brazilianism like me diz isn't a mistake, just as a Europeanism like diz-me isn't either. Mastering both is the true sign of fluency." }
  - task: "Write a witty character sketch of a pedantic or difficult person you have known, using precise, sophisticated vocabulary (pedante, presunçoso, mordaz, taciturno, empáfia…)."
    min: 130
    max: 220
    use: [w.pedante, w.presunçoso, w.mordaz, w.taciturno, w.empáfia]
    useAtLeast: 3
    grammar: [g.native-fluency-markers]
    expect:
      - { pattern: '(pedante|presun[cç]os|mordaz|taciturn|petulante|emp[aá]fia|prolix|sisud|circunspect|sucint|veemente|jocos|altivez|c[aá]ustic)', hint: "Use precise character vocabulary: pedante, presunçoso, mordaz…" }
    model: { es: "O meu antigo professor de Latim era o homem mais pedante que conheci. Presunçoso como poucos, entrava na sala com uma empáfia de imperador e corrigia a pronúncia de toda a gente, incluindo a do diretor da escola. Em público, era mordaz: tinha sempre um comentário cáustico pronto para quem se enganasse numa palavra. Em privado, porém, tornava-se taciturno e quase tímido, como se a erudição fosse apenas uma forma de se proteger do mundo. Lembro-me de que, num dia de chuva, o encontrei sozinho no café, a ler poesia com os olhos cheios de lágrimas. Percebi então que a altivez dele não passava de um ardil para esconder uma solidão enorme. Desde esse dia, deixei de detestá-lo e passei a respeitá-lo. Hoje, quando leio Latim, lembro-me sempre dele com carinho.", en: "My old Latin teacher was the most pedantic man I've ever known. Conceited like few others, he entered the classroom with the arrogance of an emperor and corrected everyone's pronunciation, including the headmaster's. In public he was scathing: he always had a caustic remark ready for anyone who got a word wrong. In private, however, he became taciturn and almost shy, as if his learning were just a way of protecting himself from the world. I remember that one rainy day I found him alone in the café, reading poetry with tears in his eyes. I realised then that his haughtiness was nothing but a ruse to hide an enormous loneliness. From that day on, I stopped hating him and began to respect him. Today, whenever I read Latin, I always think of him fondly." }
  - task: "Write a literary description of the promontory of Sagres at sunset, using elevated, precise vocabulary (vetusto, plácido, inefável, fugaz, indelével…)."
    min: 130
    max: 220
    use: [w.promontório, w.inefável, w.fugaz, w.plácido, w.vetusto]
    useAtLeast: 3
    grammar: [g.c2-review, g.native-fluency-markers]
    expect:
      - { pattern: '(vetust|sotur|pl[aá]cid|t[eê]nue|fulgor|z[eê]nite|inef[aá]vel|fugaz|perene|indel[eé]vel|di[aá]fan|l[uú]gubre|rec[oô]ndit)', hint: "Use elevated vocabulary: vetusto, plácido, inefável, fugaz…" }
    model: { es: "No promontório de Sagres, onde outrora o Infante sonhou com mares desconhecidos, o fim da tarde tem algo de inefável. O vento sopra sem descanso sobre a vetusta fortaleza, e o oceano, plácido apenas à primeira vista, bate contra as falésias com uma força antiga. À medida que o sol desce, a luz torna-se fraca e dourada, e o horizonte parece abrir-se como uma promessa. É um momento fugaz: em poucos minutos, o fulgor do sol desaparece e tudo fica escuro e soturno. Ao longe, as luzes de um navio acendem-se, pequenas e tímidas, como estrelas perdidas no mar. Os turistas aplaudem, os pescadores guardam as suas linhas, e um velho marinheiro olha o mar em silêncio, como quem perscruta um destino. Quem assiste a este espetáculo guarda dele uma memória indelével.", en: "On the headland of Sagres, where Prince Henry once dreamed of unknown seas, the end of the afternoon has something ineffable about it. The wind blows ceaselessly over the ancient fortress, and the ocean, placid only at first sight, beats against the cliffs with an age-old force. As the sun sinks, the light grows faint and golden, and the horizon seems to open like a promise. It is a fleeting moment: within minutes the sun's brilliance vanishes and everything turns dark and gloomy. In the distance, a ship's lights come on, small and timid, like stars lost at sea. The tourists applaud, the fishermen put away their lines, and an old sailor gazes at the sea in silence, like someone scrutinising a destiny. Whoever witnesses this spectacle keeps an indelible memory of it." }
  - task: "Write a farewell letter to Brazil and Portugal at the end of your journey: what you have learned about the language, its two norms and yourself. Aim for a rich, native-like register."
    min: 130
    max: 220
    use: [w.proveito, w.esmero, w.aprimorar, w.requinte, w.alvissareiro]
    useAtLeast: 3
    grammar: [g.c2-review, g.native-fluency-markers]
    expect:
      - { pattern: '\b(brasil|portugal)\b', hint: "Address both countries: Brasil and Portugal." }
      - { pattern: '\b(aprendi|percebi|descobri|compreendi)\b', hint: "Reflect on what you learned: Aprendi que…, Percebi que…" }
    model: { es: "Querido Brasil, querido Portugal: chegou a hora da despedida. Comecei esta viagem no Galeão, a gaguejar um simples olá, e termino-a em Sagres, no fim do mundo, capaz de discutir Camões e de pedir uma bica sem hesitar. Aprendi que o português não é uma língua só, mas uma família inteira: o carioca que diz você, o lisboeta que trata por tu, o angolano e o moçambicano com a sua música própria. Percebi que a saudade não se traduz, vive-se. Tentei aprimorar a gramática com esmero, mas foram as conversas, os erros e as piadas que me ensinaram de verdade. Tirei proveito de cada viagem e de cada amigo, e descobri na língua um requinte que não imaginava. Parto com um sinal alvissareiro: já sonho em português. Até à próxima!", en: "Dear Brazil, dear Portugal: the time has come to say goodbye. I began this journey at Galeão, stammering a simple hello, and I end it in Sagres, at the end of the world, able to discuss Camões and order an espresso without hesitating. I learned that Portuguese is not one language but a whole family: the carioca who says você, the Lisbon local who uses tu, the Angolan and the Mozambican with their own music. I realised that saudade isn't translated, it's lived. I tried to polish my grammar with care, but it was the conversations, the mistakes and the jokes that really taught me. I made the most of every trip and every friend, and discovered a refinement in the language I hadn't imagined. I leave with a promising sign: I already dream in Portuguese. Until next time!" }
