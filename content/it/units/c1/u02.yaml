    model: { es: "Giovanni Falcone nacque a Palermo nel 1939, nello stesso quartiere di Paolo Borsellino. I due diventarono amici da ragazzi e, anni dopo, come magistrati guidarono insieme la lotta contro la mafia. Nel 1986 organizzarono il maxiprocesso, che portò in tribunale centinaia di mafiosi. Falcone fu ucciso nella strage di Capaci il 23 maggio 1992; Borsellino morì meno di due mesi dopo, in via D'Amelio. La loro morte ha cambiato per sempre la Sicilia: da allora molti giovani hanno scelto la legalità e sono nate associazioni antimafia in tutta Italia. Ogni anno, a maggio, tanti studenti arrivano a Palermo per mantenere viva la memoria storica di quei giorni. Ancora oggi le loro parole sono un esempio per tutti.", en: "Giovanni Falcone was born in Palermo in 1939, in the same neighbourhood as Paolo Borsellino. The two became friends as boys and, years later, as magistrates they led the fight against the mafia together. In 1986 they organised the maxi-trial, which brought hundreds of mafiosi to court. Falcone was killed in the Capaci massacre on 23 May 1992; Borsellino died less than two months later, in Via D'Amelio. Their deaths changed Sicily forever: since then many young people have chosen legality and anti-mafia associations have sprung up all over Italy. Every year, in May, many students come to Palermo to keep the memory of those days alive. Their words are still an example for everyone today." }
  - task: "Write the opening of a short story set in Monreale in literary style, with the passato remoto and the trapassato remoto (appena fu entrata…, dopo che ebbe…)."
    min: 110
    max: 180
    use: [w.ad-un-tratto, w.voltarsi, w.soglia, w.sussultare, w.recarsi]
    grammar: [g.trapassato-remoto, g.passato-remoto-forms]
    expect:
      - { pattern: "\\b(ebbe|ebbero|fu|furono)\\s+(\\S+\\s+)?\\S+(at|ut|it|ss|tt|st|s|cs)[oaie]\\b", hint: "Use the trapassato remoto after appena / dopo che: appena fu entrata, dopo che ebbe…" }
      - { pattern: "\\b(si recò|entrò|rimase|chiuse|sentì|sussultò|si voltò|vide|riconobbe|impallidì|uscì|fu)(?![a-zà-ù])", hint: "Narrate the main events in the passato remoto: si voltò, sussultò…" }
    model: { es: "Quella sera Rosalia si recò al Duomo di Monreale per rivedere i mosaici. Appena fu entrata nella chiesa, rimase senza parole davanti alle pareti d'oro, che brillavano alla luce delle lampade. Si sedette in fondo e chiuse gli occhi. Dopo che l'ultimo gruppo di turisti fu uscito, nella chiesa calò un silenzio profondo. Rosalia, però, non si mosse. Ad un tratto sentì dei passi alle sue spalle. Sussultò e si voltò: sulla soglia c'era un uomo con un cappello scuro, che la guardava senza parlare. Appena lo ebbe riconosciuto, impallidì. Era suo fratello, partito per l'America vent'anni prima, di cui nessuno aveva più avuto notizie. Fuori, intanto, aveva cominciato a piovere.", en: "That evening Rosalia went to Monreale Cathedral to see the mosaics again. As soon as she had entered the church, she was left speechless before the golden walls, which shone in the light of the lamps. She sat down at the back and closed her eyes. After the last group of tourists had gone out, a deep silence fell over the church. Rosalia, however, did not move. Suddenly she heard footsteps behind her. She started and turned round: on the threshold stood a man in a dark hat, looking at her without speaking. As soon as she had recognised him, she turned pale. It was her brother, who had left for America twenty years earlier and of whom nobody had had any news since. Outside, meanwhile, it had begun to rain." }
