id: r.c2.tre-canti-di-leopardi
level: c2
title: Tre canti di Leopardi
kind: literature
author: Giacomo Leopardi (1798–1837)
source: "Canti (edizione Ranieri, 1845): «L'infinito» (1819), «A Silvia» (1828), «Il sabato del villaggio» (1829). Dominio pubblico. Testi integrali; le barre (/) separano i versi."
intro: "Three of Leopardi's most loved poems, written in or about his home town of Recanati, in the Marche. L'infinito turns a hedge into the infinite; A Silvia mourns a girl who died young and, with her, the hopes of youth; Il sabato del villaggio watches a village on the eve of a holiday. Listen to the free hendecasyllables and settenari, and to the poetic forms: rimembri, beltà, splendea, cor, speme, verno."
allow: [leopardi, silvia, recanati]
paragraphs:
  - { es: "L'INFINITO. Sempre caro mi fu quest'ermo colle, / e questa siepe, che da tanta parte / dell'ultimo orizzonte il guardo esclude. / Ma sedendo e mirando, interminati / spazi di là da quella, e sovrumani / silenzi, e profondissima quiete / io nel pensier mi fingo; ove per poco / il cor non si spaura.", en: "THE INFINITE. This lonely hill was always dear to me, / and this hedge, which shuts out the gaze / from so much of the farthest horizon. / But sitting and gazing, I imagine / endless spaces beyond it, and superhuman / silences, and the deepest stillness / in my thought; where my heart / is almost frightened." }
  - { es: "E come il vento / odo stormir tra queste piante, io quello / infinito silenzio a questa voce / vo comparando: e mi sovvien l'eterno, / e le morte stagioni, e la presente / e viva, e il suon di lei. Così tra questa / immensità s'annega il pensier mio: / e il naufragar m'è dolce in questo mare.", en: "And as I hear the wind / rustle through these plants, I go on comparing / that infinite silence to this voice: / and I recall eternity, / and the dead seasons, and the present / living one, and its sound. So in this / immensity my thought drowns: / and shipwreck is sweet to me in this sea." }
  - { es: "A SILVIA. Silvia, rimembri ancora / quel tempo della tua vita mortale, / quando beltà splendea / negli occhi tuoi ridenti e fuggitivi, / e tu, lieta e pensosa, il limitare / di gioventù salivi? / Sonavan le quiete / stanze, e le vie dintorno, / al tuo perpetuo canto, / allor che all'opre femminili intenta / sedevi, assai contenta / di quel vago avvenir che in mente avevi. / Era il maggio odoroso: e tu solevi / così menare il giorno.", en: "TO SILVIA. Silvia, do you still remember / that time of your mortal life, / when beauty shone / in your laughing, fleeting eyes, / and you, happy and thoughtful, were climbing / the threshold of youth? / The quiet rooms / and the streets around echoed / to your endless singing, / while you sat intent on women's work, / quite content / with that vague future you had in mind. / It was fragrant May: and that was how / you used to spend the day." }
  - { es: "Io gli studi leggiadri / talor lasciando e le sudate carte, / ove il tempo mio primo / e di me si spendea la miglior parte, / d'in su i veroni del paterno ostello / porgea gli orecchi al suon della tua voce, / ed alla man veloce / che percorrea la faticosa tela. / Mirava il ciel sereno, / le vie dorate e gli orti, / e quinci il mar da lungi, e quindi il monte. / Lingua mortal non dice / quel ch'io sentiva in seno.", en: "I, sometimes leaving / my pleasant studies and the pages I sweated over, / on which my early years / and the best part of me were spent, / from the balconies of my father's house / would lend an ear to the sound of your voice, / and to your quick hand / running over the toilsome loom. / I gazed at the clear sky, / the golden streets and the gardens, / and here the sea far off, and there the mountain. / No mortal tongue can tell / what I felt in my heart." }
  - { es: "Che pensieri soavi, / che speranze, che cori, o Silvia mia! / Quale allor ci apparia / la vita umana e il fato! / Quando sovviemmi di cotanta speme, / un affetto mi preme / acerbo e sconsolato, / e tornami a doler di mia sventura. / O natura, o natura, / perché non rendi poi / quel che prometti allor? perché di tanto / inganni i figli tuoi?", en: "What sweet thoughts, / what hopes, what hearts, o my Silvia! / How human life and fate / appeared to us then! / When I remember such great hope, / a feeling weighs on me, / bitter and disconsolate, / and I grieve again over my misfortune. / O nature, o nature, / why do you not give back later / what you promise then? Why do you / deceive your children so?" }
  - { es: "Tu pria che l'erbe inaridisse il verno, / da chiuso morbo combattuta e vinta, / perivi, o tenerella. E non vedevi / il fior degli anni tuoi; / non ti molceva il core / la dolce lode or delle negre chiome, / or degli sguardi innamorati e schivi; / né teco le compagne ai dì festivi / ragionavan d'amore.", en: "You, before winter withered the grass, / attacked and defeated by a hidden disease, / were dying, my tender one. And you did not see / the flower of your years; / your heart was not soothed / by sweet praise, now of your black hair, / now of your loving, shy glances; / nor did your friends talk with you / of love on holidays." }
  - { es: "Anche perìa fra poco / la speranza mia dolce: agli anni miei / anche negaro i fati / la giovanezza. Ahi come, / come passata sei, / cara compagna dell'età mia nova, / mia lacrimata speme! / Questo è quel mondo? questi / i diletti, l'amor, l'opre, gli eventi / onde cotanto ragionammo insieme? / questa la sorte dell'umane genti? / All'apparir del vero / tu, misera, cadesti: e con la mano / la fredda morte ed una tomba ignuda / mostravi di lontano.", en: "Soon my sweet hope too / was dying: to my years too / the fates denied / youth. Ah, how, / how you have passed away, / dear companion of my young age, / my lamented hope! / Is this that world? Are these / the delights, the love, the deeds, the events / we talked about so much together? / Is this the lot of humankind? / At the appearance of truth / you fell, poor thing: and with your hand / you pointed from afar / to cold death and a bare tomb." }
  - { es: "IL SABATO DEL VILLAGGIO. La donzelletta vien dalla campagna, / in sul calar del sole, / col suo fascio dell'erba; e reca in mano / un mazzolin di rose e di viole, / onde, siccome suole, / ornare ella si appresta / dimani, al dì di festa, il petto e il crine. / Siede con le vicine / su la scala a filar la vecchierella, / incontro là dove si perde il giorno; / e novellando vien del suo buon tempo, / quando ai dì della festa ella si ornava, / ed ancor sana e snella / solea danzar la sera intra di quei / ch'ebbe compagni dell'età più bella.", en: "SATURDAY IN THE VILLAGE. The young girl comes in from the fields / as the sun goes down, / with her bundle of grass; and in her hand she carries / a little bunch of roses and violets, / with which, as is her custom, / she is getting ready to adorn / her breast and hair tomorrow, on the holiday. / The old woman sits spinning / on the steps with her neighbours, / facing the place where the day dies away; / and she goes on telling tales of her good old days, / when on holidays she would dress up, / and, still healthy and slim, / used to dance in the evening among those / who were her companions in the finest age." }
  - { es: "Già tutta l'aria imbruna, / torna azzurro il sereno, e tornan l'ombre / giù da' colli e da' tetti, / al biancheggiar della recente luna. / Or la squilla dà segno / della festa che viene; / ed a quel suon diresti / che il cor si riconforta. / I fanciulli gridando / su la piazzuola in frotta, / e qua e là saltando, / fanno un lieto romore: / e intanto riede alla sua parca mensa, / fischiando, il zappatore, / e seco pensa al dì del suo riposo.", en: "Already the whole air is darkening, / the clear sky turns deep blue again, and shadows return / down from the hills and the roofs / as the new moon begins to whiten. / Now the bell gives the signal / of the coming holiday; / and at that sound you would say / that the heart takes comfort. / The children, shouting / in a crowd on the little square, / and jumping here and there, / make a happy din: / and meanwhile the farm labourer goes back, whistling, / to his frugal table, / and thinks to himself of his day of rest." }
  - { es: "Poi quando intorno è spenta ogni altra face, / e tutto l'altro tace, / odi il martel picchiare, odi la sega / del legnaiuol, che veglia / nella chiusa bottega alla lucerna, / e s'affretta, e s'adopra / di fornir l'opra anzi il chiarir dell'alba. / Questo di sette è il più gradito giorno, / pien di speme e di gioia: / diman tristezza e noia / recheran l'ore, ed al travaglio usato / ciascuno in suo pensier farà ritorno.", en: "Then, when every other light around has gone out, / and everything else is silent, / you hear the hammer knocking, you hear the saw / of the carpenter, who stays awake / by lamplight in his closed workshop, / and hurries, and strives / to finish the work before dawn breaks. / Of the seven, this is the most welcome day, / full of hope and joy: / tomorrow the hours will bring / sadness and boredom, and each in his thoughts / will return to his usual toil." }
  - { es: "Garzoncello scherzoso, / cotesta età fiorita / è come un giorno d'allegrezza pieno, / giorno chiaro, sereno, / che precorre alla festa di tua vita. / Godi, fanciullo mio; stato soave, / stagion lieta è cotesta. / Altro dirti non vo'; ma la tua festa / ch'anco tardi a venir non ti sia grave.", en: "Playful little boy, / this flowering age of yours / is like a day full of happiness, / a bright, clear day / that comes before the holiday of your life. / Enjoy it, my child; a sweet state, / a happy season is this. / I will tell you nothing more; but if your holiday / is slow in coming, let it not grieve you." }
questions:
  - { q: "In «L'infinito», che cosa permette al poeta di immaginare spazi infiniti?", options: ["La vista libera fino all'orizzonte", "Proprio la siepe che gli impedisce di vedere l'orizzonte", "Un viaggio per mare"], answer: 1, explain: "The hedge «il guardo esclude»: because he cannot see, his thought builds «interminati spazi» – the limit triggers the imagination." }
  - { q: "Che cosa significa il verso finale «e il naufragar m'è dolce in questo mare»?", options: ["Il poeta ha paura di affogare", "Perdersi nell'immensità del pensiero è per lui un'esperienza piacevole", "Il poeta ricorda un vero naufragio"], answer: 1, explain: "A metaphor: the 'sea' is the immensity of thought; 'shipwreck' – losing oneself in it – is sweet." }
  - { q: "Che cosa rimprovera il poeta alla natura in «A Silvia»?", options: ["Di essere troppo bella", "Di non mantenere ciò che promette in gioventù e di ingannare i suoi figli", "Di aver creato l'inverno"], answer: 1, explain: "«perché non rendi poi / quel che prometti allor? perché di tanto / inganni i figli tuoi?» – Leopardi's 'pessimismo cosmico'." }
  - { q: "Nell'ultima strofa di «A Silvia», chi è la «cara compagna dell'età mia nova»?", options: ["Silvia stessa", "La speranza del poeta, morta come Silvia", "La madre del poeta"], answer: 1, explain: "The final stanza addresses «la speranza mia dolce»: hope dies like Silvia, and the two figures merge." }
  - { q: "Perché il sabato è «il più gradito giorno» della settimana?", options: ["Perché è il giorno di festa", "Perché è pieno dell'attesa della festa, mentre la domenica porterà tristezza e noia", "Perché non si lavora"], answer: 1, explain: "«pien di speme e di gioia: / diman tristezza e noia / recheran l'ore» – the joy lies in waiting, not in the holiday itself." }
  - { q: "Forme come «cor», «speme», «verno», «splendea» sono…", options: ["dialetto marchigiano", "forme della lingua poetica tradizionale (mod. cuore, speranza, inverno, splendeva)", "errori dell'edizione"], answer: 1, explain: "Archaic and poetic forms of the Italian lyric tradition (c2.u02 archaic forms, c2.u03 verse)." }
