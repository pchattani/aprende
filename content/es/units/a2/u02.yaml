id: a2.u02
title: Biografías
lessons:
  - id: a2.u02.l1
    title: Nació en 1950
    teach: [g.preterite-irregular]
    vocab: [w.nacer, w.crecer, w.morir, w.casarse, w.divorciarse, w.graduarse, w.mudarse, w.jubilarse, w.biografia, w.muerte, w.nacimiento, w.infancia, w.juventud, w.a-los]
    sentences:
      - { es: "Mi abuelo nació en 1940 en un pueblo de Galicia.", en: "My grandfather was born in 1940 in a village in Galicia.", grammar: [g.preterite-regular], vocab: [w.nacer] }
      - { es: "Creció en el campo y a los dieciocho años se mudó a Madrid.", en: "He grew up in the country and at eighteen moved to Madrid.", grammar: [g.preterite-regular], vocab: [w.crecer, w.mudarse, w.a-los] }
      - { es: "Se casó con mi abuela en 1965.", en: "He married my grandmother in 1965.", grammar: [g.prepositions-verbs], vocab: [w.casarse], error: { wrong: "Se casó a mi abuela en 1965.", explain: "casarse con.", grammar: g.prepositions-verbs } }
      - { es: "Tuvieron tres hijos.", en: "They had three children.", grammar: [g.preterite-irregular], vocab: [w.tener, w.hijo.phr] }
      - { es: "Mis padres se divorciaron cuando yo tenía diez años.", en: "My parents got divorced when I was ten.", grammar: [g.preterite-vs-imperfect], vocab: [w.divorciarse] }
      - { es: "Mi hermana se graduó en Medicina el año pasado.", en: "My sister graduated in Medicine last year.", grammar: [g.preterite-regular], vocab: [w.graduarse] }
      - { es: "Mi padre se jubiló a los sesenta y cinco años.", en: "My father retired at sixty-five.", grammar: [g.preterite-regular], vocab: [w.jubilarse, w.a-los] }
      - { es: "Mi abuelo murió en 2015.", en: "My grandfather died in 2015.", grammar: [g.preterite-stem-changing], vocab: [w.morir, w.muerte] }
      - { es: "Tuvo una infancia feliz pero una juventud difícil.", en: "He had a happy childhood but a difficult youth.", grammar: [g.preterite-irregular], vocab: [w.infancia, w.juventud] }
      - { es: "Leí una biografía muy interesante de Frida Kahlo.", en: "I read a very interesting biography of Frida Kahlo.", grammar: [g.preterite-spelling-changes], vocab: [w.biografia, w.leer] }
      - { es: "¿Dónde naciste? — Nací en Bilbao.", en: "Where were you born? — I was born in Bilbao.", grammar: [g.preterite-regular], vocab: [w.nacer] }
      - { es: "El nacimiento de su hija cambió su vida.", en: "The birth of his daughter changed his life.", grammar: [g.preterite-regular], vocab: [w.nacimiento, w.cambiar] }
      - { es: "Ella se mudó a Londres.", en: "She moved to London.", grammar: [g.preterite-regular], vocab: [w.mudarse], transform: { instruction: "Change to 'they'", answer: "Se mudaron a Londres.", alt: ["Ellos se mudaron a Londres."] } }
  - id: a2.u02.l2
    title: Fue, hizo, tuvo
    teach: [g.preterite-ser-ir]
    tip: "ser and ir share one preterite: fui, fuiste, fue, fuimos, fuisteis, fueron."
    vocab: [w.publicar, w.inventar, w.fundar, w.dirigir, w.luchar, w.conseguir, w.convertirse, w.siglo, w.epoca, w.guerra, w.paz, w.premio, w.novela, w.cuadro, w.exito]
    sentences:
      - { es: "Cervantes fue un escritor español del siglo XVI.", en: "Cervantes was a Spanish writer of the 16th century.", grammar: [g.preterite-ser-ir], vocab: [w.siglo, w.escritor] }
      - { es: "Publicó el Quijote en 1605.", en: "He published Don Quixote in 1605.", grammar: [g.preterite-spelling-changes], vocab: [w.publicar] }
      - { es: "Picasso pintó cuadros famosos en todo el mundo.", en: "Picasso painted paintings famous all over the world.", grammar: [g.preterite-regular], vocab: [w.cuadro, w.pintar] }
      - { es: "¿Quién inventó el teléfono?", en: "Who invented the telephone?", grammar: [g.preterite-regular], vocab: [w.inventar, w.telefono] }
      - { es: "Fundaron la empresa en una época muy difícil.", en: "They founded the company in a very difficult time.", grammar: [g.preterite-regular], vocab: [w.fundar, w.epoca, w.empresa] }
      - { es: "Dirigió el hospital durante veinte años.", en: "She ran the hospital for twenty years.", grammar: [g.preterite-regular], vocab: [w.dirigir, w.durante] }
      - { es: "Lucharon por la paz después de la guerra.", en: "They fought for peace after the war.", grammar: [g.preterite-regular], vocab: [w.luchar, w.paz, w.guerra] }
      - { es: "Consiguió el premio Nobel en 1982.", en: "He won the Nobel Prize in 1982.", grammar: [g.preterite-stem-changing], vocab: [w.conseguir, w.premio] }
      - { es: "Su primera novela fue un gran éxito.", en: "Her first novel was a great success.", grammar: [g.preterite-ser-ir], vocab: [w.novela, w.exito] }
      - { es: "Se convirtió en la primera mujer presidenta.", en: "She became the first woman president.", grammar: [g.preterite-stem-changing], vocab: [w.convertirse, w.presidente] }
      - { es: "Fuimos a Italia y fue un viaje maravilloso.", en: "We went to Italy and it was a wonderful trip.", grammar: [g.preterite-ser-ir], vocab: [w.ir, w.ser] }
      - { es: "Hizo muchas cosas importantes en su vida.", en: "He did many important things in his life.", grammar: [g.preterite-irregular], vocab: [w.hacer, w.vida], error: { wrong: "Hació muchas cosas importantes en su vida.", explain: "hacer is irregular: hizo.", grammar: g.preterite-irregular } }
      - { es: "Tuvo que trabajar desde muy joven.", en: "He had to work from a very young age.", grammar: [g.preterite-irregular], vocab: [w.tener-que, w.joven] }
  - id: a2.u02.l3
    title: Profesiones y fama
    teach: [g.preterite-stem-changing]
    vocab: [w.pintor, w.escritor, w.cientifico, w.politico, w.rey, w.reina, w.presidente, w.cantante, w.actor, w.actriz, w.director, w.periodista, w.empresa, w.carrera, w.famoso]
    sentences:
      - { es: "Mi tía fue periodista en un periódico importante.", en: "My aunt was a journalist at an important newspaper.", grammar: [g.preterite-ser-ir], vocab: [w.periodista, w.periodico] }
      - { es: "El pintor murió pobre y se hizo famoso después de su muerte.", en: "The painter died poor and became famous after his death.", grammar: [g.preterite-stem-changing], vocab: [w.pintor, w.famoso, w.pobre] }
      - { es: "La cantante pidió silencio y empezó a cantar.", en: "The singer asked for silence and began to sing.", grammar: [g.preterite-stem-changing], vocab: [w.cantante, w.pedir] }
      - { es: "Los reyes visitaron la ciudad en 1992.", en: "The king and queen visited the city in 1992.", grammar: [g.plural-nouns], vocab: [w.rey, w.reina] }
      - { es: "La científica descubrió una medicina nueva.", en: "The scientist discovered a new medicine.", grammar: [g.preterite-regular], vocab: [w.cientifico, w.descubrir] }
      - { es: "El actor prefirió el teatro al cine.", en: "The actor preferred the theatre to the cinema.", grammar: [g.preterite-stem-changing], vocab: [w.actor, w.preferir] }
      - { es: "La actriz durmió solo tres horas antes del estreno.", en: "The actress slept only three hours before the premiere.", grammar: [g.preterite-stem-changing], vocab: [w.actriz, w.dormir] }
      - { es: "El director rodó la película en Sevilla.", en: "The director shot the film in Seville.", grammar: [g.preterite-regular], vocab: [w.director, w.pelicula.phr] }
      - { es: "Estudió una carrera y después fundó su propia empresa.", en: "He did a degree and then founded his own company.", grammar: [g.preterite-regular], vocab: [w.carrera, w.empresa] }
      - { es: "El político sirvió a su país durante treinta años.", en: "The politician served his country for thirty years.", grammar: [g.preterite-stem-changing], vocab: [w.politico] }
      - { es: "Mis padres se conocieron en la universidad.", en: "My parents met at university.", grammar: [g.preterite-regular], vocab: [w.conocer, w.universidad] }
      - { es: "Ella siguió estudiando hasta los cuarenta años.", en: "She kept studying until she was forty.", grammar: [g.preterite-stem-changing], vocab: [w.seguir], error: { wrong: "Ella seguió estudiando hasta los cuarenta años.", explain: "seguir changes e → i in the third person: siguió.", grammar: g.preterite-stem-changing } }
      - { es: "El escritor pidió un café y escribió toda la tarde.", en: "The writer ordered a coffee and wrote all afternoon.", grammar: [g.preterite-stem-changing], vocab: [w.escritor, w.pedir], transform: { instruction: "Change to 'the writers' (plural)", answer: "Los escritores pidieron un café y escribieron toda la tarde." } }
  - id: a2.u02.l4
    title: Una vida
    teach: [g.preterite-irregular]
    vocab: [w.historia, w.pais.phr, w.hijo.phr, w.durante, w.entonces, w.pintura, w.musico, w.poema, w.descubrimiento, w.enfermedad, w.pobre, w.millonario]
    sentences:
      - { es: "Vivió en el extranjero durante diez años.", en: "She lived abroad for ten years.", grammar: [g.time-markers-past], vocab: [w.pais.phr, w.durante] }
      - { es: "Entonces conoció a su marido y tuvieron dos hijos.", en: "Then she met her husband and they had two children.", grammar: [g.preterite-irregular], vocab: [w.entonces, w.hijo.phr] }
      - { es: "El músico escribió poemas y canciones.", en: "The musician wrote poems and songs.", grammar: [g.preterite-regular], vocab: [w.musico, w.poema] }
      - { es: "Su descubrimiento cambió la historia de la medicina.", en: "His discovery changed the history of medicine.", grammar: [g.preterite-regular], vocab: [w.descubrimiento, w.historia] }
      - { es: "Estuvo enfermo mucho tiempo, pero no dejó de trabajar.", en: "He was ill for a long time, but he didn't stop working.", grammar: [g.preterite-irregular], vocab: [w.enfermedad, w.dejar] }
      - { es: "Nació pobre y murió millonario.", en: "He was born poor and died a millionaire.", grammar: [g.preterite-stem-changing], vocab: [w.pobre, w.millonario] }
      - { es: "¿Qué dijo el presidente? No dijo nada.", en: "What did the president say? He didn't say anything.", grammar: [g.preterite-irregular], vocab: [w.decir, w.presidente] }
      - { es: "Supe la noticia por la radio.", en: "I learnt the news on the radio.", grammar: [g.preterite-irregular], vocab: [w.saber, w.radio] }
      - { es: "Puso toda su energía en la pintura.", en: "He put all his energy into painting.", grammar: [g.preterite-irregular], vocab: [w.poner, w.pintura] }
      - { es: "No pudieron volver a su país hasta 1975.", en: "They couldn't return to their country until 1975.", grammar: [g.preterite-irregular], vocab: [w.poder, w.volver] }
      - { es: "Quiso ser médico pero fue profesor.", en: "He wanted to be a doctor but was a teacher.", grammar: [g.preterite-irregular], vocab: [w.querer, w.ser] }
      - { es: "Vinieron a España después de la guerra.", en: "They came to Spain after the war.", grammar: [g.preterite-irregular], vocab: [w.venir, w.guerra], error: { wrong: "Venieron a España después de la guerra.", explain: "venir → vinieron (stem vin-).", grammar: g.preterite-irregular } }
      - { es: "Mi madre me dio este libro cuando cumplí dieciocho años.", en: "My mother gave me this book when I turned eighteen.", grammar: [g.preterite-irregular], vocab: [w.dar, w.cumpleanos] }
dialogues:
  - id: a2.u02.d1
    title: La abuela cuenta su vida
    context: Lucía interviews her grandmother Carmen for a school project.
    lines:
      - { speaker: Lucía, es: "Abuela, ¿dónde naciste?", en: "Grandma, where were you born?" }
      - { speaker: Carmen, es: "Nací en un pueblo muy pequeño de Asturias, en 1948. Mis padres tenían una tienda.", en: "I was born in a very small village in Asturias, in 1948. My parents had a shop." }
      - { speaker: Lucía, es: "¿Y cuándo viniste a Madrid?", en: "And when did you come to Madrid?" }
      - { speaker: Carmen, es: "A los diecinueve años. Vine para trabajar en una fábrica y estudié por la noche.", en: "At nineteen. I came to work in a factory and studied at night." }
      - { speaker: Lucía, es: "¿Cómo conociste al abuelo?", en: "How did you meet Grandpa?" }
      - { speaker: Carmen, es: "Lo conocí en un baile en 1970. Él tocaba la guitarra. Nos casamos dos años después.", en: "I met him at a dance in 1970. He played the guitar. We got married two years later." }
      - { speaker: Lucía, es: "¿Y qué hiciste después?", en: "And what did you do afterwards?" }
      - { speaker: Carmen, es: "Tuvimos tres hijos y abrí mi propia tienda en 1980. Trabajé allí treinta años y me jubilé en 2010.", en: "We had three children and I opened my own shop in 1980. I worked there thirty years and retired in 2010." }
      - { speaker: Lucía, es: "¿Cuál fue el mejor momento de tu vida?", en: "What was the best moment of your life?" }
      - { speaker: Carmen, es: "El día que naciste tú, claro.", en: "The day you were born, of course." }
    questions:
      - { q: "When did Carmen come to Madrid?", options: ["At nineteen", "In 1948", "In 1980"], answer: 0 }
      - { q: "Where did she meet her husband?", options: ["In the factory", "At a dance", "In her shop"], answer: 1 }
      - { q: "How long did she work in her own shop?", options: ["Twenty years", "Thirty years", "Forty years"], answer: 1 }
