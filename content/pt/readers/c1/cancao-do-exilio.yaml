id: r.c1.cancao-do-exilio
level: c1
title: "Gonçalves Dias: Canção do exílio e I-Juca-Pirama"
kind: literature
author: Gonçalves Dias (1823–1864)
source: "«Canção do exílio» (Primeiros Cantos, 1847; escrita em Coimbra em 1843), na íntegra; «I-Juca-Pirama» (Últimos Cantos, 1851), canto IV, excertos. Domínio público. O primeiro, o terceiro e o último parágrafos são uma introdução escrita para este curso."
intro: "Two poems by the great Romantic poet from Maranhão, born on the edge of the Amazon region you are travelling through. The lines of each stanza are separated by a slash. The first is the most quoted poem in Brazil, a song of homesickness written by a student in Portugal; the second is the death song of a captured Tupi warrior. Notice the poetic inversion (Mais prazer encontro eu lá), the vós imperative (ouvi, dizei, deixai) and the short, drum-like lines of the Indianist poem."
allow: [gonçalves, dias, maranhão, caxias, coimbra, sabiá, i-juca-pirama, juca, pirama, tupi, timbiras, aimorés, oswald, andrade]
paragraphs:
  - { es: "Antônio Gonçalves Dias nasceu em 1823 perto de Caxias, no Maranhão, filho de um comerciante português e de uma mulher brasileira, provavelmente de origem indígena e africana. Aos dezessete anos foi estudar direito em Coimbra, e lá, longe da sua terra, escreveu em 1843 os versos que todo brasileiro sabe de cor. Morreu em 1864, num naufrágio, já perto da costa do Maranhão, quando voltava da Europa: foi o único passageiro que não se salvou.", en: "Antônio Gonçalves Dias was born in 1823 near Caxias, in Maranhão, the son of a Portuguese merchant and a Brazilian woman probably of Indigenous and African descent. At seventeen he went to study law in Coimbra, and there, far from his homeland, he wrote in 1843 the lines every Brazilian knows by heart. He died in 1864 in a shipwreck, already close to the coast of Maranhão, on his way back from Europe: he was the only passenger who was not saved." }
  - { es: "CANÇÃO DO EXÍLIO. Minha terra tem palmeiras, / Onde canta o Sabiá; / As aves, que aqui gorjeiam, / Não gorjeiam como lá. // Nosso céu tem mais estrelas, / Nossas várzeas têm mais flores, / Nossos bosques têm mais vida, / Nossa vida mais amores.", en: "SONG OF EXILE. My land has palm trees, / where the thrush sings; / the birds that warble here / do not warble as they do there. // Our sky has more stars, / our meadows have more flowers, / our woods have more life, / our life more loves." }
  - { es: "Em cismar, sozinho, à noite, / Mais prazer encontro eu lá; / Minha terra tem palmeiras, / Onde canta o Sabiá. // Minha terra tem primores, / Que tais não encontro eu cá; / Em cismar — sozinho, à noite — / Mais prazer encontro eu lá; / Minha terra tem palmeiras, / Onde canta o Sabiá.", en: "Brooding alone at night, / I find more pleasure there; / my land has palm trees, / where the thrush sings. // My land has delights / such as I do not find here; / brooding — alone, at night — / I find more pleasure there; / my land has palm trees, / where the thrush sings." }
  - { es: "Não permita Deus que eu morra, / Sem que eu volte para lá; / Sem que desfrute os primores / Que não encontro por cá; / Sem qu’inda aviste as palmeiras, / Onde canta o Sabiá.", en: "May God not let me die / without returning there; / without enjoying the delights / I do not find here; / without seeing once more the palm trees / where the thrush sings." }
  - { es: "O poema é construído sobre duas palavras, cá e lá: aqui é Portugal, onde o poeta estuda; lá é o Brasil, que ele imagina mais bonito do que nunca. Não há um único adjetivo para descrever a terra, só comparações e repetições, e talvez por isso o poema tenha virado parte da identidade nacional. Dois dos seus versos estão no Hino Nacional, e muitos poetas do século XX, como Oswald de Andrade, fizeram paródias dele para falar de um Brasil menos idealizado.", en: "The poem is built on two words, cá and lá: here is Portugal, where the poet is studying; there is Brazil, which he imagines more beautiful than ever. There is not a single adjective describing the land, only comparisons and repetitions, and perhaps that is why the poem has become part of the national identity. Two of its lines are in the National Anthem, and many twentieth-century poets, such as Oswald de Andrade, wrote parodies of it to talk about a less idealised Brazil." }
  - { es: "Em I-Juca-Pirama, nome tupi que quer dizer “o que há de ser morto”, um jovem guerreiro tupi é preso pelos timbiras, que vão sacrificá-lo numa cerimônia. Antes de morrer, ele deve cantar o seu canto de morte. Mas o guerreiro chora e pede para viver, não por medo, e sim para cuidar do pai, velho e cego, que depende dele na floresta.", en: "In I-Juca-Pirama, a Tupi name meaning 'he who is to be killed', a young Tupi warrior is captured by the Timbiras, who are going to sacrifice him in a ceremony. Before dying, he must sing his death song. But the warrior weeps and asks to live — not out of fear, but to look after his father, old and blind, who depends on him in the forest." }
  - { es: "I-JUCA-PIRAMA, CANTO IV. Meu canto de morte, / Guerreiros, ouvi: / Sou filho das selvas, / Nas selvas cresci; / Guerreiros, descendo / Da tribo tupi. // Da tribo pujante, / Que agora anda errante / Por fado inconstante, / Guerreiros, nasci; / Sou bravo, sou forte, / Sou filho do Norte; / Meu canto de morte, / Guerreiros, ouvi. // Já vi cruas brigas, / De tribos imigas, / E as duras fadigas / Da guerra provei; / Nas ondas mendaces / Senti pelas faces / Os silvos fugaces / Dos ventos que amei. (…)", en: "I-JUCA-PIRAMA, CANTO IV. My death song, / warriors, hear: / I am a son of the jungles, / in the jungles I grew up; / warriors, I descend / from the Tupi tribe. // Of the mighty tribe, / that now wanders / by inconstant fate, / warriors, I was born; / I am brave, I am strong, / I am a son of the North; / my death song, / warriors, hear. // I have seen cruel fights / between enemy tribes, / and the hard toils / of war I have tasted; / on the treacherous waves / I felt on my cheeks / the fleeting whistling / of the winds I loved. (…)" }
  - { es: "Então, forasteiro, / Caí prisioneiro / De um troço guerreiro / Com que me encontrei: / O cru dessossego / Do pai fraco e cego, / Enquanto não chego / Qual seja, — dizei! // Eu era o seu guia / Na noite sombria, / A só alegria / Que Deus lhe deixou: / Em mim se apoiava, / Em mim se firmava, / Em mim descansava, / Que filho lhe sou. // Ao velho coitado / De penas ralado, / Já cego e quebrado, / Que resta? — Morrer. / Enquanto descreve / O giro tão breve / Da vida que teve, / Deixai-me viver!", en: "Then, stranger, / I fell prisoner / to a band of warriors / I came upon: / the cruel anxiety / of my weak, blind father, / while I do not return, / what it must be — tell me! // I was his guide / in the dark night, / the only joy / God left him: / on me he leaned, / on me he steadied himself, / on me he rested, / for I am his son. // To the poor old man, / worn down by sorrows, / already blind and broken, / what remains? — To die. / While he traces / the so brief circle / of the life he had, / let me live!" }
  - { es: "Os timbiras deixam o jovem partir, mas o pai, ao saber que o filho chorou diante do inimigo, sente vergonha e o leva de volta para morrer com honra. O guerreiro então luta sozinho contra a tribo inteira, e os timbiras, impressionados com a sua coragem, terminam o combate e o respeitam. É o índio idealizado do Romantismo: nobre, valente e fiel, um herói nacional imaginado na mesma época em que os povos indígenas reais perdiam as suas terras. Os dois poemas foram recitados nas escolas e imitados durante gerações, e ainda hoje quem viaja pelo Maranhão ouve falar do poeta que morreu à vista da sua terra, como se o último verso da canção tivesse sido uma profecia.", en: "The Timbiras let the young man go, but his father, on learning that his son wept in front of the enemy, is ashamed and takes him back to die with honour. The warrior then fights alone against the whole tribe, and the Timbiras, impressed by his courage, end the fight and honour him. This is the idealised Indian of Romanticism: noble, brave and loyal, a national hero imagined at the very time when the real Indigenous peoples were losing their lands. Both poems have been recited in schools and imitated for generations, and even today anyone travelling through Maranhão hears about the poet who died within sight of his homeland, as if the last line of the song had been a prophecy." }
questions:
  - { q: "Onde Gonçalves Dias escreveu a “Canção do exílio”?", options: ["No Maranhão", "No Rio de Janeiro", "Em Coimbra, em Portugal", "Em Manaus"], answer: 2, explain: "He wrote it in 1843 while studying law in Coimbra; 'aqui/cá' in the poem is Portugal and 'lá' is Brazil." }
  - { q: "Que recurso domina a “Canção do exílio”?", options: ["A comparação entre cá e lá e a repetição do refrão", "Muitos adjetivos raros", "Diálogos entre personagens", "Rimas em todas as palavras"], answer: 0, explain: "The poem contrasts here and there (mais estrelas, mais flores…) and repeats 'Minha terra tem palmeiras, / Onde canta o Sabiá' like a refrain." }
  - { q: "O que o poeta pede a Deus na última estrofe?", options: ["Ficar rico em Portugal", "Não morrer sem voltar para a sua terra", "Esquecer o Brasil", "Ver o mar"], answer: 1, explain: "'Não permita Deus que eu morra, / Sem que eu volte para lá.' Ironically, he died in a shipwreck within sight of the Maranhão coast." }
  - { q: "Por que o guerreiro tupi pede para viver?", options: ["Porque tem medo da morte", "Porque quer voltar a lutar", "Porque quer cuidar do pai velho e cego", "Porque se apaixonou"], answer: 2, explain: "He is his blind father's only guide and joy: 'Ao velho coitado (…) que resta? — Morrer. (…) Deixai-me viver!'" }
  - { q: "Que forma verbal arcaica aparece em “Guerreiros, ouvi” e “Deixai-me viver”?", options: ["O futuro do subjuntivo", "O imperativo de vós", "O infinitivo pessoal", "O mais-que-perfeito simples"], answer: 1, explain: "ouvi and deixai are vós imperatives, addressed to the warriors as a group — normal in Romantic poetry, archaic today." }
