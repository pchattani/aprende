id: r.b2.se-eu-tivesse-sabido
level: b2
title: Se eu tivesse sabido
kind: text
intro: Guilherme tells the story of a hike to the Cachoeira da Fumaça, in the Chapada Diamantina, that went wrong — and of everything he would have done differently. Notice the pluperfect subjunctive (se eu tivesse...) and the conditional perfect.
allow: [guilherme, chapada, diamantina, lençóis, capão, fumaça, pai, inácio, ok, gps, sílvia]
paragraphs:
  - { es: "Todo mundo que vai à Chapada Diamantina quer ver a Cachoeira da Fumaça, uma das mais altas do Brasil. A água cai de mais de trezentos metros e, por causa do vento, muitas vezes não chega ao chão: vira uma nuvem branca, como fumaça, e daí vem o nome. Eu também quis ver. E é por isso que estou escrevendo este texto, para que você não cometa os mesmos erros que eu.", en: "Everyone who goes to the Chapada Diamantina wants to see the Cachoeira da Fumaça, one of the highest waterfalls in Brazil. The water falls more than three hundred metres and, because of the wind, it often doesn't reach the ground: it turns into a white cloud, like smoke, and that's where the name comes from. I wanted to see it too. And that's why I'm writing this, so that you don't make the same mistakes I did." }
  - { es: "Primeiro erro: dispensei o guia. Na pousada, em Lençóis, me disseram que a trilha por cima, saindo do Vale do Capão, era fácil, uns seis quilômetros. Eu tinha um aplicativo de mapas no celular e me achei muito esperto. Se eu tivesse sabido que a subida inicial era tão íngreme e que o sinal desaparece logo no começo, teria contratado alguém da região. Os guias locais conhecem cada pedra e, além disso, a renda deles depende disso.", en: "First mistake: I did without a guide. At the guesthouse in Lençóis they told me that the trail over the top, starting from the Vale do Capão, was easy, about six kilometres. I had a map app on my phone and thought I was very clever. If I had known that the initial climb was so steep and that the signal disappears right at the start, I would have hired someone from the area. The local guides know every stone and, besides, their income depends on it." }
  - { es: "Segundo erro: saí tarde. Eu tinha ficado até tarde no bar na noite anterior e só comecei a caminhar às onze da manhã, no sol mais forte. Levei só uma garrafa de água de meio litro. Se eu tivesse saído às sete, como todo mundo, e tivesse levado dois litros, a subida teria sido muito menos sofrida. Na metade do caminho, eu já estava pedindo água a desconhecidos.", en: "Second mistake: I left late. I had stayed late at the bar the night before and only started walking at eleven in the morning, in the strongest sun. I took just one half-litre bottle of water. If I had left at seven, like everyone else, and had taken two litres, the climb would have been much less painful. Halfway there I was already asking strangers for water." }
  - { es: "Mesmo assim, cheguei. E vou ser sincero: valeu cada gota de suor. A trilha termina numa pedra plana, à beira do precipício. Para ver a queda, você tem que deitar de barriga no chão e colocar a cabeça para fora. Lá embaixo, o vale verde parecia não ter fim. A água caía, se desfazia no ar e, de repente, voltava para cima com o vento. Fiquei uns vinte minutos ali, deitado, sem conseguir dizer nada.", en: "Even so, I made it. And I'll be honest: it was worth every drop of sweat. The trail ends at a flat rock at the edge of the cliff. To see the fall, you have to lie on your stomach on the ground and stick your head out. Far below, the green valley seemed endless. The water fell, dissolved in the air and, suddenly, went back up with the wind. I stayed there about twenty minutes, lying down, unable to say anything." }
  - { es: "Terceiro erro, e o pior: fiquei tempo demais. Quando comecei a voltar, eram quase cinco horas, e na Chapada o sol se põe cedo. A última hora de descida foi no escuro, com a lanterna do celular, que estava com dez por cento de bateria. Se não tivesse encontrado um casal de Salvador que vinha com um guia, a Sílvia e o marido, não sei como teria terminado a noite. Eles me deixaram ir atrás deles até a vila, e o guia, em vez de me dar bronca, só disse: «Todo mundo aprende uma vez.»", en: "Third mistake, and the worst: I stayed too long. When I started back, it was almost five o'clock, and in the Chapada the sun sets early. The last hour of the descent was in the dark, with my phone's torch, which had ten per cent battery. If I hadn't met a couple from Salvador who were coming down with a guide, Sílvia and her husband, I don't know how the night would have ended. They let me follow them to the village, and the guide, instead of telling me off, just said: 'Everybody learns once.'" }
  - { es: "Hoje, olhando para trás, sei que tive sorte. Se tivesse caído, se tivesse torcido o pé, se tivesse chovido, a história teria sido outra. Na Chapada, já houve muitos resgates de turistas que fizeram exatamente o que eu fiz. Então, aqui vão os meus conselhos, que eu mesmo teria adorado receber: contrate um guia, saia cedo, leve muita água, uma lanterna de verdade e respeite o horário do sol.", en: "Today, looking back, I know I was lucky. If I had fallen, if I had twisted my foot, if it had rained, the story would have been different. In the Chapada there have been many rescues of tourists who did exactly what I did. So here's my advice, which I myself would have loved to receive: hire a guide, leave early, take plenty of water and a real torch, and respect the sun's timetable." }
  - { es: "E vá. Apesar de tudo, a Fumaça é um dos lugares mais impressionantes que eu já vi na vida. Eu voltaria amanhã. Desta vez, com guia.", en: "And go. Despite everything, the Fumaça is one of the most impressive places I've ever seen in my life. I'd go back tomorrow. This time, with a guide." }
questions:
  - { q: "Por que a cachoeira se chama Fumaça?", options: ["Porque há muitas fogueiras perto dela", "Porque a água vira uma nuvem branca com o vento", "Porque fica perto de uma fábrica"], answer: 1, explain: "The water often doesn't reach the ground: «vira uma nuvem branca, como fumaça, e daí vem o nome»." }
  - { q: "O que o Guilherme teria feito se tivesse sabido como era a subida?", options: ["Teria contratado um guia", "Teria desistido", "Teria ido de carro"], answer: 0, explain: "«Se eu tivesse sabido que a subida inicial era tão íngreme... teria contratado alguém da região.»" }
  - { q: "Por que a subida foi tão sofrida?", options: ["Porque ele saiu tarde e levou pouca água", "Porque choveu", "Porque ele se perdeu"], answer: 0, explain: "He started at eleven in the strongest sun with only half a litre of water." }
  - { q: "Como se vê a queda d'água do alto?", options: ["De um mirante com cerca", "Deitado de barriga no chão, com a cabeça para fora", "De um barco"], answer: 1, explain: "«Você tem que deitar de barriga no chão e colocar a cabeça para fora.»" }
  - { q: "Quem ajudou o Guilherme na descida?", options: ["Um casal de Salvador com um guia", "A dona da pousada", "Os bombeiros"], answer: 0, explain: "He met «um casal de Salvador que vinha com um guia» and followed them to the village." }
glossary:
  - { es: cometa, en: make (cometer, subjunctive: cometer um erro = to make a mistake) }
  - { es: dispensei, en: I did without (dispensar) }
  - { es: pedra, en: stone, rock }
  - { es: plana, en: flat }
  - { es: beira, en: edge (à beira de = at the edge of) }
  - { es: íngreme, en: steep }
  - { es: renda, en: income }
  - { es: gota, en: drop }
  - { es: precipício, en: cliff, precipice }
  - { es: desfazia, en: dissolved (desfazer-se) }
  - { es: bronca, en: (dar bronca = to tell off) }
