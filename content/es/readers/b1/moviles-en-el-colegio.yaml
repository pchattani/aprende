id: r.b1.moviles-en-el-colegio
level: b1
title: ¿Móviles en el colegio? Quizás no sea tan sencillo
kind: text
intro: An opinion column in a Spanish newspaper weighs up the government's plan to ban mobile phones in schools.
allow: [real, anunciado, enorme, concentran, aulas, contrario, prohibición, estudios, emergencia, educar, conversación, honesto, riamos]
paragraphs:
  - { es: "Esta semana el gobierno ha anunciado que quiere prohibir los móviles en todos los colegios e institutos del país. La medida ha abierto un debate enorme. Según una encuesta publicada el lunes, el setenta por ciento de los padres está a favor y solo un veinte por ciento en contra. Pero, como casi siempre, la cuestión es más complicada de lo que parece.", en: "This week the government has announced that it wants to ban mobile phones in every primary and secondary school in the country. The measure has opened up an enormous debate. According to a survey published on Monday, seventy percent of parents are in favour and only twenty percent against. But, as almost always, the question is more complicated than it seems." }
  - { es: "Por un lado, es evidente que los móviles son un problema en clase. Los profesores con los que he hablado están convencidos de que los alumnos se concentran peor y de que la adicción a las pantallas es real. Es lógico que quieran aulas sin móviles, y dudo que alguien defienda lo contrario.", en: "On the one hand, it's obvious that phones are a problem in class. The teachers I've spoken to are convinced that pupils concentrate less well and that screen addiction is real. It's understandable that they want classrooms without phones, and I doubt anyone would argue the opposite." }
  - { es: "Por otro lado, no creo que prohibir sea la única solución. Los jóvenes de esta generación van a vivir siempre con tecnología, y tal vez sea mejor que aprendan a usarla con responsabilidad en el colegio, con la ayuda de sus profesores, que solos en su habitación.", en: "On the other hand, I don't think banning is the only solution. The young people of this generation are going to live with technology all their lives, and perhaps it's better for them to learn to use it responsibly at school, with the help of their teachers, than alone in their bedrooms." }
  - { es: "Además, los datos no son tan claros como dicen algunos políticos. Es cierto que en los países donde ya existe la prohibición los resultados de los estudiantes han mejorado un poco. Sin embargo, no está demostrado que la causa sea el móvil: en esos mismos años también cambiaron otras cosas, como el número de alumnos por clase.", en: "Moreover, the data isn't as clear as some politicians say. It's true that in the countries where the ban already exists students' results have improved a little. However, it isn't proven that the cause is the phone: in those same years other things changed too, such as the number of pupils per class." }
  - { es: "También hay que escuchar a las familias. Muchos padres quieren que sus hijos lleven el móvil para poder llamarlos en caso de emergencia. Puede que una solución sea permitirlo en la mochila, apagado, y prohibirlo solo durante las clases. Algunos institutos ya lo hacen y, al parecer, funciona bastante bien.", en: "We also have to listen to families. Many parents want their children to carry a phone so they can call them in an emergency. One solution might be to allow it in the schoolbag, switched off, and to ban it only during lessons. Some secondary schools already do this and, apparently, it works quite well." }
  - { es: "En resumen: estoy de acuerdo con el objetivo de la ley, pero no estoy seguro de que una prohibición total sea la mejor manera de alcanzarlo. Quizás la respuesta esté en educar y no solo en prohibir. Es decir, menos pantallas en clase, sí; pero también más conversación sobre cómo usarlas.", en: "In short: I agree with the aim of the law, but I'm not sure that a total ban is the best way to achieve it. Perhaps the answer lies in educating and not only in banning. In other words, fewer screens in class, yes; but also more conversation about how to use them." }
  - { es: "Igual me equivoco. De hecho, es posible que dentro de diez años leamos esta columna y nos riamos de nuestras dudas. Pero hoy, con los datos que tenemos, creo que es más honesto decir que no lo sabemos que vender soluciones fáciles. En cuanto a mí, seguiré escuchando a los profesores, a los padres y, sobre todo, a los alumnos.", en: "Maybe I'm wrong. In fact, it's possible that in ten years we'll read this column and laugh at our doubts. But today, with the data we have, I think it's more honest to say that we don't know than to sell easy solutions. As for me, I'll keep listening to the teachers, the parents and, above all, the pupils." }
questions:
  - { q: "According to the survey, what percentage of parents are in favour of the ban?", options: ["Seventy percent", "Twenty percent", "Fifty percent"], answer: 0 }
  - { q: "What does the columnist think about the data from other countries?", options: ["It proves phones are the cause", "It is not conclusive", "It shows no improvement at all"], answer: 1 }
  - { q: "What compromise does the author describe?", options: ["Phones switched off in the bag and banned during lessons", "Phones only for teachers", "A total ban in every school"], answer: 0 }
  - { q: "What is the author's final position?", options: ["Completely against the law", "In favour of the aim, but unsure about a total ban", "Certain that the ban will work"], answer: 1 }
