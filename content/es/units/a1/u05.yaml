id: a1.u05
title: Comida y bebida
lessons:
  - id: a1.u05.l1
    title: En el bar
    teach: [g.querer-present]
    tip: "Quiero un café, por favor is perfectly polite in a Spanish bar."
    vocab: [w.comida, w.desayuno, w.cena, w.pan, w.agua, w.leche, w.cafe, w.te.noun, w.zumo, w.cerveza, w.vino, w.querer, w.tomar, w.beber, w.vaso, w.taza, w.botella, w.cuenta]
    sentences:
      - { es: "Quiero un café con leche, por favor.", en: "I want a coffee with milk, please.", altEs: ["Yo quiero un café con leche, por favor."], altEn: ["I'd like a coffee with milk, please."], grammar: [g.querer-present], vocab: [w.querer, w.cafe, w.leche] }
      - { es: "¿Qué quieres tomar?", en: "What do you want to have?", altEs: ["¿Qué quieres beber?", "¿Qué vas a tomar?"], altEn: ["What do you want to drink?"], grammar: [g.querer-present], vocab: [w.querer, w.tomar] }
      - { es: "Un vaso de agua y un zumo de naranja.", en: "A glass of water and an orange juice.", grammar: [g.articles-indefinite], vocab: [w.vaso, w.agua, w.zumo, w.naranja] }
      - { es: "Queremos dos cervezas y una botella de vino.", en: "We want two beers and a bottle of wine.", altEs: ["Nosotros queremos dos cervezas y una botella de vino."], grammar: [g.querer-present, g.plural-nouns], vocab: [w.cerveza, w.botella, w.vino] }
      - { es: "Una taza de té, por favor.", en: "A cup of tea, please.", altEs: ["Un té, por favor."], grammar: [g.articles-indefinite], vocab: [w.taza, w.te.noun] }
      - { es: "¿Bebes café por la mañana?", en: "Do you drink coffee in the morning?", altEs: ["¿Tomas café por la mañana?"], grammar: [g.regular-er-ir-present], vocab: [w.beber, w.cafe, w.manana.noun] }
      - { es: "No bebo vino, bebo agua.", en: "I don't drink wine, I drink water.", altEs: ["Yo no bebo vino, bebo agua.", "No tomo vino, tomo agua."], grammar: [g.negation, g.regular-er-ir-present], vocab: [w.beber, w.vino, w.agua] }
      - { es: "El desayuno es a las ocho.", en: "Breakfast is at eight.", altEs: ["Desayunamos a las ocho."], grammar: [g.time-telling], vocab: [w.desayuno] }
      - { es: "La comida y la cena son en casa.", en: "Lunch and dinner are at home.", grammar: [g.ser-present], vocab: [w.comida, w.cena] }
      - { es: "La cuenta, por favor.", en: "The bill, please.", grammar: [g.articles-definite], vocab: [w.cuenta] }
      - { es: "¿Quieres pan con la comida?", en: "Do you want bread with the meal?", grammar: [g.querer-present], vocab: [w.pan, w.comida] }
      - { es: "Mis padres toman un café después de comer.", en: "My parents have a coffee after lunch.", altEs: ["Mis padres beben un café después de comer.", "Mis padres toman un café después de la comida."], grammar: [g.regular-ar-present], vocab: [w.tomar, w.despues] }
      - { es: "Ella quiere una botella de agua fría.", en: "She wants a bottle of cold water.", altEs: ["Quiere una botella de agua fría."], grammar: [g.querer-present, g.adjective-agreement], vocab: [w.querer, w.botella, w.frio], transform: { instruction: "Change to 'we'", answer: "Queremos una botella de agua fría.", alt: ["Nosotros queremos una botella de agua fría."] } }
    exchanges:
      - q: { es: "¿Qué quieres tomar?", en: "What do you want to have?" }
        a: { es: "Quiero un café con leche, por favor.", en: "I want a coffee with milk, please." }
        alt: ["Un café con leche, por favor.", "Un té, por favor."]
        grammar: [g.querer-present]
        vocab: [w.querer, w.tomar, w.cafe, w.leche]
      - q: { es: "¿Quieres agua o vino?", en: "Do you want water or wine?" }
        a: { es: "Agua, por favor. No bebo vino.", en: "Water, please. I don't drink wine." }
        alt: ["Agua, por favor.", "Vino, gracias."]
        grammar: [g.querer-present, g.negation]
        vocab: [w.agua, w.vino, w.beber]
      - q: { es: "¿Queréis algo más?", en: "Do you (all) want anything else?" }
        a: { es: "Sí, la cuenta, por favor.", en: "Yes, the bill, please." }
        alt: ["No, gracias.", "Sí, otra cerveza."]
        grammar: [g.querer-present]
        vocab: [w.cuenta, w.algo]
      - q: { es: "¿Bebes café por la mañana?", en: "Do you drink coffee in the morning?" }
        a: { es: "Sí, tomo un café con el desayuno.", en: "Yes, I have a coffee with breakfast." }
        alt: ["Sí, bebo café.", "No, bebo té."]
        grammar: [g.regular-er-ir-present]
        vocab: [w.beber, w.desayuno, w.manana.noun]
      - q: { es: "¿A qué hora es la cena?", en: "What time is dinner?" }
        a: { es: "La cena es a las nueve.", en: "Dinner is at nine." }
        alt: ["A las nueve.", "Es a las nueve."]
        grammar: [g.time-telling]
        vocab: [w.cena, w.nueve]
    texts:
      - title: "Mensaje de Marta"
        es: ["Hola, Tom. Estoy en el bar de la plaza.", "¿Quieres un café o una cerveza?", "Yo quiero un zumo de naranja."]
        en: ["Hi, Tom. I'm at the bar in the square.", "Do you want a coffee or a beer?", "I want an orange juice."]
        grammar: [g.querer-present]
        vocab: [w.querer, w.cerveza, w.zumo, w.bar]
      - title: "Nota en la cocina"
        es: ["El desayuno es a las ocho.", "Hay pan, leche y zumo.", "No hay café, lo siento."]
        en: ["Breakfast is at eight.", "There is bread, milk and juice.", "There's no coffee, sorry."]
        grammar: [g.hay, g.time-telling]
        vocab: [w.desayuno, w.pan, w.leche, w.zumo]
  - id: a1.u05.l2
    title: Comer bien
    teach: [g.regular-ar-present]
    vocab: [w.azucar, w.sal, w.aceite, w.huevo, w.queso, w.jamon, w.pollo, w.carne, w.pescado, w.arroz, w.sopa, w.ensalada, w.verdura, w.fruta, w.comer, w.desayunar, w.cenar, w.cocinar, w.comprar, w.necesitar]
    sentences:
      - { es: "Desayuno pan con aceite y un café.", en: "I have bread with oil and a coffee for breakfast.", altEs: ["Yo desayuno pan con aceite y un café."], grammar: [g.regular-ar-present], vocab: [w.desayunar, w.pan, w.aceite] }
      - { es: "¿Qué comes normalmente?", en: "What do you normally eat?", altEs: ["Normalmente, ¿qué comes?"], grammar: [g.regular-er-ir-present], vocab: [w.comer, w.normalmente] }
      - { es: "Como pollo con arroz y ensalada.", en: "I eat chicken with rice and salad.", altEs: ["Yo como pollo con arroz y ensalada."], grammar: [g.regular-er-ir-present], vocab: [w.pollo, w.arroz, w.ensalada] }
      - { es: "No comemos carne, comemos pescado.", en: "We don't eat meat, we eat fish.", altEs: ["Nosotros no comemos carne, comemos pescado."], grammar: [g.negation], vocab: [w.carne, w.pescado, w.comer] }
      - { es: "Mi madre cocina una sopa de verduras.", en: "My mother cooks a vegetable soup.", grammar: [g.regular-ar-present], vocab: [w.cocinar, w.sopa, w.verdura] }
      - { es: "Compro huevos, queso y jamón en el mercado.", en: "I buy eggs, cheese and ham at the market.", altEs: ["En el mercado compro huevos, queso y jamón."], grammar: [g.regular-ar-present, g.plural-nouns], vocab: [w.comprar, w.huevo, w.queso, w.jamon] }
      - { es: "Necesitamos sal y azúcar.", en: "We need salt and sugar.", altEs: ["Necesitamos azúcar y sal."], grammar: [g.regular-ar-present], vocab: [w.necesitar, w.sal, w.azucar] }
      - { es: "Cenamos a las nueve de la noche.", en: "We have dinner at nine in the evening.", altEs: ["Nosotros cenamos a las nueve de la noche."], grammar: [g.regular-ar-present, g.time-telling], vocab: [w.cenar, w.noche] }
      - { es: "¿Cocinas tú o cocina tu pareja?", en: "Do you cook or does your partner cook?", grammar: [g.regular-ar-present], vocab: [w.cocinar, w.pareja] }
      - { es: "La fruta es buena para la salud.", en: "Fruit is good for your health.", grammar: [g.articles-definite], vocab: [w.fruta, w.bueno, w.para] }
      - { es: "Los españoles comen a las dos.", en: "Spaniards have lunch at two.", altEs: ["En España la gente come a las dos."], grammar: [g.articles-definite], vocab: [w.comer, w.espanol] }
      - { es: "Ella desayuna fruta y yogur.", en: "She has fruit and yoghurt for breakfast.", grammar: [g.regular-ar-present], vocab: [w.desayunar, w.fruta], transform: { instruction: "Change to 'they'", answer: "Ellos desayunan fruta y yogur.", alt: ["Desayunan fruta y yogur.", "Ellas desayunan fruta y yogur."] } }
    exchanges:
      - q: { es: "¿Qué desayunas?", en: "What do you have for breakfast?" }
        a: { es: "Desayuno pan con aceite y un café.", en: "I have bread with oil and a coffee for breakfast." }
        alt: ["Pan y café.", "Desayuno fruta."]
        grammar: [g.regular-ar-present]
        vocab: [w.desayunar, w.pan, w.aceite]
      - q: { es: "¿Quién cocina en tu casa?", en: "Who cooks in your house?" }
        a: { es: "Cocina mi madre, pero yo compro la comida.", en: "My mother cooks, but I buy the food." }
        alt: ["Mi madre.", "Cocino yo."]
        grammar: [g.regular-ar-present]
        vocab: [w.cocinar, w.comprar, w.comida]
      - q: { es: "¿A qué hora cenáis?", en: "What time do you (all) have dinner?" }
        a: { es: "Cenamos a las nueve.", en: "We have dinner at nine." }
        alt: ["A las nueve.", "Cenamos tarde, a las diez."]
        grammar: [g.regular-ar-present, g.time-telling]
        vocab: [w.cenar, w.nueve]
      - q: { es: "¿Comes carne?", en: "Do you eat meat?" }
        a: { es: "No, no como carne. Como pescado y verduras.", en: "No, I don't eat meat. I eat fish and vegetables." }
        alt: ["No, no como carne.", "Sí, como carne."]
        grammar: [g.regular-er-ir-present, g.negation]
        vocab: [w.comer, w.carne, w.pescado, w.verdura]
      - q: { es: "¿Necesitas algo del mercado?", en: "Do you need anything from the market?" }
        a: { es: "Sí, necesito huevos, queso y sal.", en: "Yes, I need eggs, cheese and salt." }
        alt: ["Sí, huevos y queso.", "No, gracias."]
        grammar: [g.regular-ar-present]
        vocab: [w.necesitar, w.huevo, w.queso, w.sal]
    texts:
      - title: "Nota"
        es: ["Necesitamos pan, huevos y leche.", "También compro fruta y verduras en el mercado.", "No hay arroz."]
        en: ["We need bread, eggs and milk.", "I'm also buying fruit and vegetables at the market.", "There's no rice."]
        grammar: [g.regular-ar-present, g.hay]
        vocab: [w.necesitar, w.comprar, w.arroz, w.fruta]
      - title: "Mensaje de Ana"
        es: ["Desayuno a las ocho con mi familia.", "Como en el trabajo a las dos.", "Por la noche mi pareja cocina y cenamos a las nueve."]
        en: ["I have breakfast at eight with my family.", "I have lunch at work at two.", "In the evening my partner cooks and we have dinner at nine."]
        grammar: [g.regular-ar-present]
        vocab: [w.desayunar, w.comer, w.cocinar, w.cenar]
  - id: a1.u05.l3
    title: Me gusta
    teach: [g.gustar]
    tip: "With gustar, the thing you like is the subject: me gusta el café, me gustan las tapas."
    vocab: [w.gustar, w.encantar, w.me, w.te, w.le, w.nos, w.os, w.manzana, w.naranja, w.platano, w.tomate, w.patata, w.cebolla, w.tortilla, w.bocadillo, w.tapa, w.postre, w.helado, w.chocolate, w.tarta]
    sentences:
      - { es: "Me gusta el café.", en: "I like coffee.", altEs: ["A mí me gusta el café."], grammar: [g.gustar], vocab: [w.gustar, w.cafe], error: { wrong: "Yo gusto el café.", explain: "The thing liked is the subject: me gusta el café.", grammar: g.gustar } }
      - { es: "Me gustan las manzanas y los plátanos.", en: "I like apples and bananas.", altEs: ["Me gustan los plátanos y las manzanas."], grammar: [g.gustar, g.gustar-plural], vocab: [w.manzana, w.platano] }
      - { es: "¿Te gusta la tortilla de patatas?", en: "Do you like Spanish omelette?", altEs: ["¿A ti te gusta la tortilla de patatas?"], grammar: [g.gustar], vocab: [w.tortilla, w.patata] }
      - { es: "No me gusta la cebolla.", en: "I don't like onion.", altEs: ["A mí no me gusta la cebolla."], grammar: [g.gustar, g.negation], vocab: [w.cebolla] }
      - { es: "A mi hermano le encanta el chocolate.", en: "My brother loves chocolate.", grammar: [g.gustar-plural], vocab: [w.encantar, w.chocolate, w.le] }
      - { es: "Nos gustan mucho las tapas.", en: "We like tapas a lot.", altEs: ["Nos encantan las tapas.", "A nosotros nos gustan mucho las tapas."], grammar: [g.gustar-plural], vocab: [w.tapa, w.nos] }
      - { es: "¿Os gusta el helado de fresa?", en: "Do you (all) like strawberry ice cream?", grammar: [g.gustar], vocab: [w.helado, w.os] }
      - { es: "Me encanta la tarta de mi abuela.", en: "I love my grandmother's cake.", altEs: ["Me gusta mucho la tarta de mi abuela."], grammar: [g.gustar-plural], vocab: [w.encantar, w.tarta] }
      - { es: "De postre quiero un helado.", en: "For dessert I want an ice cream.", altEs: ["De postre, un helado."], grammar: [g.querer-present], vocab: [w.postre, w.helado] }
      - { es: "Un bocadillo de jamón y queso, por favor.", en: "A ham and cheese sandwich, please.", altEs: ["Un bocadillo de queso y jamón, por favor."], grammar: [g.articles-indefinite], vocab: [w.bocadillo, w.jamon, w.queso] }
      - { es: "Les gustan los tomates y las naranjas.", en: "They like tomatoes and oranges.", altEs: ["A ellos les gustan los tomates y las naranjas."], grammar: [g.gustar-plural], vocab: [w.tomate, w.naranja, w.le] }
      - { es: "¿Te gusta cocinar? Sí, me encanta.", en: "Do you like cooking? Yes, I love it.", grammar: [g.gustar-plural], vocab: [w.cocinar, w.encantar], transform: { instruction: "Say you (singular) love cooking as a statement", answer: "Te encanta cocinar." } }
      - { es: "A Marta le gusta el pescado pero no le gusta la carne.", en: "Marta likes fish but she doesn't like meat.", grammar: [g.gustar-plural, g.connectors-basic], vocab: [w.pescado, w.carne] }
    exchanges:
      - q: { es: "¿Te gusta el café?", en: "Do you like coffee?" }
        a: { es: "Sí, me gusta mucho.", en: "Yes, I like it a lot." }
        alt: ["Sí, me encanta.", "No, no me gusta."]
        grammar: [g.gustar]
        vocab: [w.gustar, w.cafe, w.te]
      - q: { es: "¿Te gustan las manzanas?", en: "Do you like apples?" }
        a: { es: "Sí, me gustan mucho las manzanas.", en: "Yes, I like apples a lot." }
        alt: ["Sí, me gustan.", "No, no me gustan."]
        grammar: [g.gustar-plural, g.gustar]
        vocab: [w.manzana, w.me]
      - q: { es: "¿Qué postre quieres?", en: "What dessert do you want?" }
        a: { es: "Un helado de chocolate, me encanta.", en: "A chocolate ice cream, I love it." }
        alt: ["Helado, por favor.", "La tarta, por favor."]
        grammar: [g.querer-present, g.gustar]
        vocab: [w.postre, w.helado, w.chocolate, w.encantar]
      - q: { es: "¿Os gusta la tortilla de patatas?", en: "Do you (all) like Spanish omelette?" }
        a: { es: "Sí, nos encanta.", en: "Yes, we love it." }
        alt: ["Sí, nos gusta mucho.", "No, no nos gusta."]
        grammar: [g.gustar-plural]
        vocab: [w.tortilla, w.patata, w.os, w.nos]
      - q: { es: "¿Le gusta el pescado a tu hermano?", en: "Does your brother like fish?" }
        a: { es: "No, no le gusta. Le gusta la carne.", en: "No, he doesn't like it. He likes meat." }
        alt: ["No, no le gusta.", "Sí, le encanta."]
        grammar: [g.gustar]
        vocab: [w.le, w.pescado, w.carne]
    texts:
      - title: "Mensaje de Tom"
        es: ["Me encanta la comida española.", "Me gustan las tapas y la tortilla.", "Pero no me gusta la cebolla."]
        en: ["I love Spanish food.", "I like tapas and omelette.", "But I don't like onion."]
        grammar: [g.gustar, g.gustar-plural]
        vocab: [w.encantar, w.tapa, w.tortilla, w.cebolla]
      - title: "Nota"
        es: ["A mi madre le gusta el té y a mi padre le gusta el café.", "A mis hermanos les encanta el chocolate.", "Y a mí me gusta todo."]
        en: ["My mother likes tea and my father likes coffee.", "My brothers love chocolate.", "And I like everything."]
        grammar: [g.gustar-plural]
        vocab: [w.le, w.encantar, w.chocolate, w.todo]
  - id: a1.u05.l4
    title: Mucho, poco, algo
    teach: [g.quantity-words]
    vocab: [w.poco, w.un-poco, w.bastante, w.demasiado, w.algo, w.nada, w.otro, w.rico, w.caliente, w.frio, w.dulce, w.plato, w.menu, w.pagar, w.para, w.sin]
    sentences:
      - { es: "Como mucha fruta y pocas verduras.", en: "I eat a lot of fruit and few vegetables.", altEs: ["Yo como mucha fruta y pocas verduras."], grammar: [g.quantity-words], vocab: [w.mucho, w.poco, w.fruta, w.verdura] }
      - { es: "Quiero un poco de pan, por favor.", en: "I want a little bread, please.", altEs: ["Un poco de pan, por favor."], grammar: [g.quantity-words], vocab: [w.un-poco, w.pan] }
      - { es: "Hay bastante comida para todos.", en: "There is enough food for everyone.", altEs: ["Hay bastante comida para todo el mundo."], grammar: [g.quantity-words], vocab: [w.bastante, w.comida, w.todo] }
      - { es: "Bebes demasiado café.", en: "You drink too much coffee.", altEs: ["Tú bebes demasiado café.", "Tomas demasiado café."], grammar: [g.quantity-words], vocab: [w.demasiado, w.beber] }
      - { es: "¿Quieres algo más? No, nada más, gracias.", en: "Do you want anything else? No, nothing else, thanks.", altEs: ["¿Quieres algo más? No, gracias, nada más."], grammar: [g.quantity-words], vocab: [w.algo, w.nada] }
      - { es: "Otro café, por favor.", en: "Another coffee, please.", grammar: [g.articles-indefinite], vocab: [w.otro, w.cafe], error: { wrong: "Un otro café, por favor.", explain: "otro never takes un/una.", grammar: g.articles-indefinite } }
      - { es: "La sopa está muy rica y caliente.", en: "The soup is very tasty and hot.", altEs: ["La sopa está caliente y muy rica."], grammar: [g.ser-vs-estar-basics], vocab: [w.rico, w.caliente, w.sopa] }
      - { es: "El helado está frío y dulce.", en: "The ice cream is cold and sweet.", altEs: ["El helado está dulce y frío."], grammar: [g.ser-vs-estar-basics], vocab: [w.frio, w.dulce, w.helado] }
      - { es: "El menú del día cuesta doce euros.", en: "The set menu costs twelve euros.", grammar: [g.al-del-contractions], vocab: [w.menu, w.doce] }
      - { es: "¿Pagamos la cuenta?", en: "Shall we pay the bill?", altEs: ["¿Pagamos?"], altEn: ["Do we pay the bill?"], grammar: [g.regular-ar-present], vocab: [w.pagar, w.cuenta] }
      - { es: "Un plato de arroz con pollo para mí.", en: "A plate of rice with chicken for me.", grammar: [g.prepositions-movement], vocab: [w.plato, w.arroz, w.para] }
      - { es: "Quiero un café sin azúcar.", en: "I want a coffee without sugar.", altEs: ["Yo quiero un café sin azúcar."], grammar: [g.querer-present], vocab: [w.sin, w.azucar] }
      - { es: "No hay nada en la nevera.", en: "There is nothing in the fridge.", grammar: [g.hay, g.negation], vocab: [w.nada, w.haber] }
    exchanges:
      - q: { es: "¿Quieres algo más?", en: "Do you want anything else?" }
        a: { es: "No, nada más, gracias.", en: "No, nothing else, thanks." }
        alt: ["No, gracias.", "Sí, otro café, por favor."]
        grammar: [g.quantity-words]
        vocab: [w.algo, w.nada, w.otro]
      - q: { es: "¿Hay bastante comida?", en: "Is there enough food?" }
        a: { es: "Sí, hay bastante para todos.", en: "Yes, there's enough for everyone." }
        alt: ["Sí, hay mucha.", "No, hay poca."]
        grammar: [g.quantity-words, g.hay]
        vocab: [w.bastante, w.comida, w.poco]
      - q: { es: "¿Cómo está la sopa?", en: "How is the soup?" }
        a: { es: "Está muy rica, pero un poco caliente.", en: "It's very tasty, but a bit hot." }
        alt: ["Está rica.", "Está fría."]
        grammar: [g.ser-vs-estar-basics, g.quantity-words]
        vocab: [w.rico, w.caliente, w.frio, w.sopa]
      - q: { es: "¿Cuánto cuesta el menú del día?", en: "How much is the set menu?" }
        a: { es: "Cuesta doce euros.", en: "It costs twelve euros." }
        alt: ["Doce euros.", "Son doce euros."]
        grammar: [g.costar-cuanto, g.al-del-contractions]
        vocab: [w.menu, w.doce]
      - q: { es: "¿Quieres el café con azúcar?", en: "Do you want the coffee with sugar?" }
        a: { es: "No, sin azúcar, por favor.", en: "No, without sugar, please." }
        alt: ["Sin azúcar.", "Sí, con un poco de azúcar."]
        grammar: [g.quantity-words]
        vocab: [w.sin, w.azucar, w.un-poco]
    texts:
      - title: "Mensaje"
        es: ["Hola, Ana. No hay nada en casa.", "Necesitamos un poco de pan y bastante fruta.", "Compro otra botella de aceite también."]
        en: ["Hi, Ana. There's nothing at home.", "We need a little bread and plenty of fruit.", "I'm buying another bottle of oil too."]
        grammar: [g.quantity-words]
        vocab: [w.nada, w.un-poco, w.bastante, w.otro]
      - title: "Menú del día"
        es: ["Menú del día: doce euros.", "Sopa o ensalada; pollo o pescado.", "De postre, helado o fruta.", "Pan y agua."]
        en: ["Set menu: twelve euros.", "Soup or salad; chicken or fish.", "For dessert, ice cream or fruit.", "Bread and water."]
        grammar: [g.articles-definite]
