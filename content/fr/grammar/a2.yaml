# A2 grammar notes (Normandy, Brittany and the Loire). Explanations use light
# markdown: ### headings, bullets, tables, **bold**, *italic* (French inline).
- id: g.passe-compose-avoir
  level: a2
  title: "The passé composé with avoir"
  summary: "avoir in the present + past participle: j'ai mangé, tu as fini, il a vendu. The everyday past tense for completed actions."
  explanation: |
    The **passé composé** is the main spoken past tense. It describes **completed** actions: what happened, what you did.

    | | avoir | + participle |
    |---|---|---|
    | j' | ai | visité |
    | tu | as | visité |
    | il / elle / on | a | visité |
    | nous | avons | visité |
    | vous | avez | visité |
    | ils / elles | ont | visité |

    ### Regular past participles
    | infinitive | participle | example |
    |---|---|---|
    | -er | **-é** | *parler → parlé* |
    | -ir (finir type) | **-i** | *finir → fini, choisir → choisi* |
    | -re | **-u** | *vendre → vendu, attendre → attendu* |

    ### One tense, several English meanings
    *J'ai mangé* = I ate / I have eaten / I did eat.

    Most verbs use *avoir*; about twenty verbs of movement and all pronominal verbs use *être* (next unit).
  examples:
    - { es: "Hier, j'ai visité la cathédrale de Rouen.", en: "Yesterday I visited Rouen cathedral." }
    - { es: "Nous avons mangé au restaurant.", en: "We ate at the restaurant." }
    - { es: "Tu as fini ton travail ?", en: "Have you finished your work?" }
    - { es: "Ils ont attendu le train pendant une heure.", en: "They waited for the train for an hour." }
  pitfalls:
    - "Don't forget the auxiliary: *j'ai mangé*, not *je mangé*."
    - "*Parlé* (participle) and *parler* (infinitive) sound the same: write the right one. Test with *vendu / vendre*."
    - "Not for ongoing past situations or descriptions: those use the imparfait."
  related: [g.past-participles-irregular, g.passe-compose-etre, g.pc-vs-imparfait]
  drills:
    - { es: "J'ai acheté des souvenirs.", en: "I bought some souvenirs." }
    - { es: "Elle a choisi une robe rouge.", en: "She chose a red dress." }
    - { es: "Vous avez entendu la nouvelle ?", en: "Have you heard the news?" }
- id: g.past-participles-irregular
  level: a2
  title: "Irregular past participles: fait, pris, eu, été, vu…"
  summary: "Many common verbs have irregular participles: avoir → eu, être → été, faire → fait, prendre → pris, voir → vu."
  explanation: |
    | ending | verbs |
    |---|---|
    | **-u** | *avoir → **eu**, voir → **vu**, boire → **bu**, lire → **lu**, pouvoir → **pu**, vouloir → **voulu**, devoir → **dû**, savoir → **su**, connaître → **connu**, croire → **cru**, recevoir → **reçu**, venir → **venu**, tenir → **tenu**, pleuvoir → **plu*** |
    | **-is** | *prendre → **pris**, mettre → **mis**, apprendre → **appris**, comprendre → **compris*** |
    | **-it** | *faire → **fait**, dire → **dit**, écrire → **écrit**, conduire → **conduit*** |
    | **-ert** | *ouvrir → **ouvert**, offrir → **offert**, découvrir → **découvert*** |
    | others | *être → **été**, naître → **né**, mourir → **mort**, vivre → **vécu**, rire → **ri*** |

    *Être* and *avoir* both use *avoir* in the passé composé: *j'ai été* (I was / I have been), *j'ai eu* (I had).

    *Il a plu* = it rained (pleuvoir); *ça m'a plu* = I liked it (plaire). Same form!
  examples:
    - { es: "J'ai pris le train pour Rouen.", en: "I took the train to Rouen." }
    - { es: "Qu'est-ce que tu as fait ce week-end ?", en: "What did you do this weekend?" }
    - { es: "Nous avons vu la Seine depuis la colline.", en: "We saw the Seine from the hill." }
    - { es: "Elle a eu un accident, mais elle va bien.", en: "She had an accident, but she's fine." }
  pitfalls:
    - "*J'ai été* means 'I was / I've been', not 'I have gone' (*je suis allé*)."
    - "*Dû* has a circumflex in the masculine singular only (to avoid confusion with *du*): *due, dus, dues*."
    - "Not *j'ai prendu* or *j'ai faisé*: *j'ai pris, j'ai fait*."
  related: [g.passe-compose-avoir, g.passe-compose-etre]
  drills:
    - { es: "Il a écrit une carte postale.", en: "He wrote a postcard." }
    - { es: "J'ai bu un verre de cidre.", en: "I drank a glass of cider." }
    - { es: "Ils ont ouvert la fenêtre.", en: "They opened the window." }
- id: g.past-time-expressions
  level: a2
  title: "Past time expressions: hier, la semaine dernière, il y a deux jours"
  summary: "hier, avant-hier, ce matin, lundi dernier, le mois dernier, l'année dernière, il y a trois ans, en 2019."
  explanation: |
    | French | English |
    |---|---|
    | *hier* / *hier soir* | yesterday / last night |
    | *avant-hier* | the day before yesterday |
    | *ce matin, cet après-midi* | this morning, this afternoon |
    | *lundi dernier* / *le week-end dernier* | last Monday / last weekend |
    | *la semaine dernière* / *l'année dernière* | last week / last year |
    | *le mois dernier* | last month |
    | ***il y a*** *deux jours* | two days **ago** |
    | *en 2019, en mai* | in 2019, in May |
    | *une fois, deux fois* | once, twice |
    | *déjà* | already / ever |
    | *pas encore* | not yet |

    ### Il y a = ago
    *Il y a* + duration, **before** it in French: *Je suis arrivé il y a une semaine.* (I arrived a week ago.)

    ### Déjà, pas encore
    These go between the auxiliary and the participle: *J'ai **déjà** vu ce film. Je n'ai **pas encore** mangé.* *Tu es déjà allé en Normandie ?* = Have you ever been to Normandy?
  examples:
    - { es: "Hier soir, nous avons dîné à Rouen.", en: "Last night we had dinner in Rouen." }
    - { es: "J'ai visité le Mont-Saint-Michel il y a deux ans.", en: "I visited Mont-Saint-Michel two years ago." }
    - { es: "Tu as déjà mangé du camembert ?", en: "Have you ever eaten camembert?" }
    - { es: "Je n'ai pas encore réservé l'hôtel.", en: "I haven't booked the hotel yet." }
  pitfalls:
    - "*Dernier* goes after the noun for 'last' (previous): *la semaine dernière*; before it, it means 'final': *la dernière semaine des vacances*."
    - "Not *deux jours il y a*: *il y a deux jours*."
  related: [g.passe-compose-avoir, g.pendant-depuis-il-y-a]
  drills:
    - { es: "L'année dernière, j'ai appris à nager.", en: "Last year I learnt to swim." }
    - { es: "Elle a téléphoné il y a une heure.", en: "She phoned an hour ago." }
    - { es: "Ils ont déjà fini.", en: "They've already finished." }
- id: g.passe-compose-etre
  level: a2
  title: "The passé composé with être"
  summary: "About 15 verbs of movement and change of state, and all pronominal verbs, take être: je suis allé, elle est née, nous sommes partis."
  explanation: |
    | | être | + participle |
    |---|---|---|
    | je | suis | allé(e) |
    | tu | es | allé(e) |
    | il / elle / on | est | allé / allée |
    | nous | sommes | allé(e)s |
    | vous | êtes | allé(e)(s) |
    | ils / elles | sont | allés / allées |

    ### The "house of être" verbs
    | pair | participles |
    |---|---|
    | aller / venir | allé, venu (*revenir, devenir*) |
    | arriver / partir | arrivé, parti |
    | entrer / sortir | entré, sorti (*rentrer*) |
    | monter / descendre | monté, descendu |
    | naître / mourir | né, mort |
    | rester, tomber, retourner, passer | resté, tombé, retourné, passé |

    A mnemonic: **DR & MRS VANDERTRAMP** (devenir, revenir, monter, rester, sortir, venir, aller, naître, descendre, entrer, rentrer, tomber, retourner, arriver, mourir, partir).

    Plus **all pronominal verbs**: *je me suis levé* (unit 9).

    With *être*, the participle **agrees** with the subject (next note).
  examples:
    - { es: "Je suis allée à Giverny avec ma mère.", en: "I went to Giverny with my mother." }
    - { es: "Le train est arrivé à dix heures.", en: "The train arrived at ten." }
    - { es: "Nous sommes restés deux heures dans le jardin.", en: "We stayed two hours in the garden." }
    - { es: "Monet est mort en 1926.", en: "Monet died in 1926." }
  pitfalls:
    - "Not *j'ai allé*: *je suis allé*."
    - "*Monter, descendre, sortir, rentrer, passer* take *avoir* when they have a direct object: *J'ai monté les valises. Elle a sorti le chien.*"
  related: [g.pc-agreement-etre, g.passe-compose-avoir, g.pronominal-passe-compose, g.partir-sortir-dormir]
  drills:
    - { es: "Elle est partie ce matin.", en: "She left this morning." }
    - { es: "Ils sont venus en train.", en: "They came by train." }
    - { es: "Je suis tombé dans l'escalier.", en: "I fell on the stairs." }
- id: g.pc-agreement-etre
  level: a2
  title: "Agreement with être: elle est partie, ils sont allés"
  summary: "With être, the past participle agrees with the subject like an adjective: -e for feminine, -s for plural."
  explanation: |
    | subject | participle |
    |---|---|
    | *il* | *est arrivé* |
    | *elle* | *est arrivé**e*** |
    | *ils* (m or mixed) | *sont arrivé**s*** |
    | *elles* | *sont arrivé**es*** |
    | *je* (woman) | *suis arrivé**e*** |
    | *vous* (one man, formal) | *êtes arrivé* |
    | *vous* (several women) | *êtes arrivé**es*** |
    | *on* (= nous) | *est arrivé**s*** (agreement usual) |

    ### Sound
    Most of the time the agreement is silent (*arrivé / arrivée* sound the same). You hear it only with participles ending in a consonant: *il est mort* [mɔʁ] / *elle est morte* [mɔʁt].

    With *avoir*, the participle does **not** agree with the subject: *Elle a mangé.* (Agreement with a preceding direct object comes in unit 11.)
  examples:
    - { es: "Ma sœur est née à Caen.", en: "My sister was born in Caen." }
    - { es: "Les enfants sont sortis jouer.", en: "The children went out to play." }
    - { es: "Julie et Anne sont arrivées hier.", en: "Julie and Anne arrived yesterday." }
    - { es: "Nous sommes allées à Giverny, ma mère et moi.", en: "We went to Giverny, my mother and I." }
  pitfalls:
    - "Don't add -e with *avoir*: *elle a visité*, not *elle a visitée*."
    - "A mixed group takes masculine plural: *Paul et Marie sont partis.*"
    - "Women writing about themselves: *je suis allée*."
  related: [g.passe-compose-etre, g.adjective-agreement, g.pc-object-agreement]
  drills:
    - { es: "Elle est restée à la maison.", en: "She stayed at home." }
    - { es: "Ils sont montés à pied.", en: "They walked up." }
    - { es: "Vous êtes rentrées tard, mesdames ?", en: "Did you get back late, ladies?" }
- id: g.partir-sortir-dormir
  level: a2
  title: "Partir, sortir, quitter, laisser: leaving"
  summary: "partir (leave, go away), sortir (go out), quitter (leave a place or person, needs an object), laisser (leave something behind)."
  explanation: |
    | verb | meaning | aux. | example |
    |---|---|---|---|
    | **partir** | leave, go away (no object) | être | *Le train **est parti**. Je pars **de** Rouen **pour** Caen.* |
    | **sortir** | go out, exit | être | *Elle **est sortie** du musée. On sort ce soir ?* |
    | **quitter** | leave (a place, a person) — needs an object | avoir | *J'**ai quitté** Paris à huit heures. Il **a quitté** sa copine.* |
    | **laisser** | leave something behind, let | avoir | *J'**ai laissé** mon sac dans le train.* |

    ### Present (partir, sortir, like dormir)
    *je pars, tu pars, il part, nous partons, vous partez, ils partent*; *je sors… nous sortons*; *je dors… nous dormons*. Participles: *parti, sorti, dormi* (*dormir* takes *avoir*: *j'ai bien dormi*).

    ### Prepositions
    *partir **de*** (from) / ***pour*** or ***à*** (to): *Nous partons pour la Bretagne.* *Sortir de* + place.
  examples:
    - { es: "Nous sommes partis de Paris à huit heures.", en: "We left Paris at eight." }
    - { es: "J'ai quitté l'hôtel après le petit-déjeuner.", en: "I left the hotel after breakfast." }
    - { es: "Zut, j'ai laissé mon parapluie au café !", en: "Damn, I left my umbrella at the café!" }
    - { es: "Tu as bien dormi ?", en: "Did you sleep well?" }
  pitfalls:
    - "Not *je suis parti Paris*: *je suis parti **de** Paris* or *j'ai quitté Paris*."
    - "*Quitter* always needs an object: on the phone, *Ne quittez pas* = hold the line."
    - "*Sortir* with an object takes *avoir*: *J'ai sorti la poubelle.*"
  related: [g.present-ir-verbs, g.passe-compose-etre]
  drills:
    - { es: "Elle est sortie avec des amis.", en: "She went out with friends." }
    - { es: "Ils ont quitté la ville.", en: "They left the town." }
    - { es: "Le bus part dans cinq minutes.", en: "The bus leaves in five minutes." }
- id: g.negation-passe-compose
  level: a2
  title: "Negatives and questions in the passé composé"
  summary: "ne … pas goes around the auxiliary: je n'ai pas vu, elle n'est pas venue. Inversion also uses the auxiliary: As-tu vu… ?"
  explanation: |
    ### Negation: around the auxiliary
    | affirmative | negative |
    |---|---|
    | *J'ai vu le film.* | *Je **n'**ai **pas** vu le film.* |
    | *Elle est venue.* | *Elle **n'**est **pas** venue.* |
    | *Nous nous sommes levés.* | *Nous **ne** nous sommes **pas** levés.* |

    The participle comes **after** *pas*.

    ### Exceptions
    *Personne* and *nulle part* go after the participle: *Je n'ai vu **personne**. Je ne suis allé **nulle part**.* (*Rien, jamais, plus* stay before it: *Je n'ai rien vu.*)

    ### Questions
    - Intonation: *Tu as vu le film ?*
    - Est-ce que: *Est-ce que tu as vu le film ?*
    - Inversion with the auxiliary: ***As-tu** vu le film ? **Est-elle** partie ? **A-t-il** fini ?*
  examples:
    - { es: "Je n'ai pas visité le musée.", en: "I didn't visit the museum." }
    - { es: "Ils ne sont pas allés à la plage.", en: "They didn't go to the beach." }
    - { es: "Avez-vous aimé le jardin de Monet ?", en: "Did you like Monet's garden?" }
    - { es: "Je n'ai vu personne.", en: "I didn't see anyone." }
  pitfalls:
    - "Not *je n'ai vu pas*: *je n'ai pas vu*."
    - "Spoken French drops *ne*: *J'ai pas vu.* Write the full form."
  related: [g.negation-ne-pas, g.negation-jamais-plus-rien, g.passe-compose-avoir]
  drills:
    - { es: "Elle n'a pas compris.", en: "She didn't understand." }
    - { es: "Nous ne sommes pas sortis hier.", en: "We didn't go out yesterday." }
    - { es: "As-tu pris ton billet ?", en: "Did you get your ticket?" }
- id: g.negation-jamais-plus-rien
  level: a2
  title: "Other negatives: ne … jamais, plus, rien, personne, que"
  summary: "never, no longer, nothing, nobody, only: they replace pas around the verb."
  explanation: |
    | negative | meaning | example |
    |---|---|---|
    | **ne … jamais** | never | *Je ne bois jamais de café.* |
    | **ne … plus** | no longer, not any more | *Il n'habite plus ici.* |
    | **ne … rien** | nothing | *Je ne vois rien.* |
    | **ne … personne** | nobody | *Je ne connais personne.* |
    | **ne … que** | only (not really negative) | *Je n'ai que dix euros.* |
    | **ne … pas encore** | not yet | *Il n'est pas encore là.* |

    ### As subjects
    *Rien* and *personne* can start the sentence, still with *ne*: ***Personne** n'est venu. **Rien** n'est simple.*

    ### One-word answers
    *Qui est là ? — Personne. Tu veux quoi ? — Rien. Tu fumes ? — Jamais !*

    ### Ne … que
    It restricts, so articles **don't** change to *de*: *Je ne mange que **des** légumes.*

    *Plus* in *ne … plus* is pronounced [ply] (no s).
  examples:
    - { es: "Je ne suis jamais allé en Bretagne.", en: "I've never been to Brittany." }
    - { es: "Elle ne travaille plus à Rouen.", en: "She doesn't work in Rouen any more." }
    - { es: "Il n'y a personne dans le jardin.", en: "There's nobody in the garden." }
    - { es: "Nous n'avons que deux jours en Normandie.", en: "We only have two days in Normandy." }
  pitfalls:
    - "Don't add *pas*: *je ne vois rien*, not *je ne vois pas rien*."
    - "*Ne … que* keeps the article: *Il ne boit que de l'eau*."
    - "*Personne* as a noun (*une personne*) is feminine; as a negative it means nobody."
  related: [g.negation-ne-pas, g.negation-passe-compose, g.ni-ni-aucun, g.frequency-adverbs]
  drills:
    - { es: "Je n'ai rien acheté.", en: "I didn't buy anything." }
    - { es: "Personne ne répond.", en: "Nobody's answering." }
    - { es: "Il ne mange plus de viande.", en: "He doesn't eat meat any more." }
- id: g.imparfait-forms
  level: a2
  title: "The imparfait: forms"
  summary: "Take the nous form of the present, drop -ons, add -ais, -ais, -ait, -ions, -iez, -aient. Only être is irregular (j'étais)."
  explanation: |
    **Stem** = *nous* present minus *-ons*: *nous parl**ons** → parl-*, *nous finiss**ons** → finiss-*, *nous pren**ons** → pren-*, *nous fais**ons** → fais-*.

    | | parler | finir | faire | être |
    |---|---|---|---|---|
    | je | parl**ais** | finiss**ais** | fais**ais** | **ét**ais |
    | tu | parl**ais** | finiss**ais** | fais**ais** | ét**ais** |
    | il / elle / on | parl**ait** | finiss**ait** | fais**ait** | ét**ait** |
    | nous | parl**ions** | finiss**ions** | fais**ions** | ét**ions** |
    | vous | parl**iez** | finiss**iez** | fais**iez** | ét**iez** |
    | ils / elles | parl**aient** | finiss**aient** | fais**aient** | ét**aient** |

    ### Sound
    *-ais, -ait, -aient* all sound [ɛ]: *je parlais, il parlait, ils parlaient* are pronounced the same.

    ### Spelling
    *manger → je mangeais* (but *nous mangions*), *commencer → je commençais* (but *nous commencions*). *Étudier → nous étudiions* (double i).

    Impersonal: *il y avait* (there was/were), *il faisait beau*, *il pleuvait*, *il fallait*.
  examples:
    - { es: "Quand j'étais petit, j'habitais à Étretat.", en: "When I was little, I lived in Étretat." }
    - { es: "Nous allions à la plage tous les jours.", en: "We went to the beach every day." }
    - { es: "Il faisait beau et il y avait du vent.", en: "The weather was nice and it was windy." }
    - { es: "Mes grands-parents avaient une petite maison.", en: "My grandparents had a little house." }
  pitfalls:
    - "*Être* has a special stem: *j'étais*, not *j'sommais*."
    - "*Nous étudiions, vous étudiiez*: two i's."
  related: [g.imparfait-uses, g.pc-vs-imparfait, g.c-etait]
  drills:
    - { es: "Elle lisait beaucoup.", en: "She used to read a lot." }
    - { es: "Vous étiez où ?", en: "Where were you?" }
    - { es: "Ils mangeaient des crêpes le dimanche.", en: "They used to eat crêpes on Sundays." }
- id: g.imparfait-uses
  level: a2
  title: "When to use the imparfait"
  summary: "Habits (used to), descriptions and background (was, had), ongoing actions (was …-ing), and feelings in the past."
  explanation: |
    | use | example | English |
    |---|---|---|
    | **habits, repeated actions** | *Le dimanche, on allait chez ma grand-mère.* | used to / would go |
    | **description** of people, places, weather | *La maison était blanche. Il faisait froid.* | was |
    | **states and feelings** | *J'étais content. Je voulais partir.* | was, wanted |
    | **ongoing action** (background) | *Je lisais quand tu as appelé.* | was reading |
    | **age and time** | *J'avais dix ans. Il était minuit.* | was |

    ### Signal words
    *avant* (before, in the past), *autrefois* (in the old days), *d'habitude*, *toujours*, *souvent*, *tous les étés*, *quand j'étais petit*, *à cette époque*.

    ### Polite suggestion
    *Si on allait à la plage ?* — How about going to the beach?
  examples:
    - { es: "Avant, il n'y avait pas de touristes ici.", en: "In the past there were no tourists here." }
    - { es: "Tous les étés, nous allions en Normandie.", en: "Every summer we went to Normandy." }
    - { es: "Elle avait les cheveux longs et elle était très drôle.", en: "She had long hair and she was very funny." }
    - { es: "Si on allait voir les falaises ?", en: "How about going to see the cliffs?" }
  pitfalls:
    - "English 'would' for past habits = imparfait: *Il venait tous les jours* (he would come every day), not the conditional."
    - "'Was born' is a one-off event: *je suis né*, not *j'étais né*."
  related: [g.imparfait-forms, g.pc-vs-imparfait, g.c-etait]
  drills:
    - { es: "Quand j'étais jeune, je jouais au foot.", en: "When I was young, I played football." }
    - { es: "Il pleuvait et j'avais froid.", en: "It was raining and I was cold." }
    - { es: "D'habitude, elle prenait le bus.", en: "She usually took the bus." }
- id: g.c-etait
  level: a2
  title: "C'était, il y avait, il faisait: describing the past"
  summary: "The three key frames for past descriptions: C'était super ! Il y avait du monde. Il faisait chaud."
  explanation: |
    | present | past (imparfait) | use |
    |---|---|---|
    | *c'est* | ***c'était*** | judgement, identification: *C'était magnifique !* |
    | *il y a* | ***il y avait*** | what existed: *Il y avait beaucoup de monde.* |
    | *il fait* | ***il faisait*** | weather: *Il faisait beau.* |
    | *il est* (time) | ***il était*** | *Il était huit heures.* |

    ### Reacting to a past experience
    *C'était comment ? — C'était génial / super / pas mal / nul / ennuyeux.*

    ### C'était vs ça a été
    *C'était* describes the overall impression (most common). *Ça a été* is used for a finished, defined event, often a reaction right after: *Ça a été dur, mais j'ai réussi.*
  examples:
    - { es: "Les vacances à Étretat ? C'était génial !", en: "The holidays in Étretat? They were great!" }
    - { es: "Il y avait des bateaux sur la plage.", en: "There were boats on the beach." }
    - { es: "Il faisait froid, mais il y avait du soleil.", en: "It was cold, but it was sunny." }
  pitfalls:
    - "Not *c'étaient génial*: *c'était* + masculine adjective for impressions."
    - "Not *il y étaient*: *il y avait* never changes for plurals."
  related: [g.imparfait-uses, g.il-y-a, g.weather]
  drills:
    - { es: "C'était très joli.", en: "It was very pretty." }
    - { es: "Il y avait un petit café.", en: "There was a little café." }
    - { es: "C'était comment, le concert ?", en: "How was the concert?" }
- id: g.pc-vs-imparfait
  level: a2
  title: "Passé composé or imparfait?"
  summary: "Passé composé for events (what happened); imparfait for the setting (what was going on, what things were like)."
  explanation: |
    Think of a film: the **imparfait** is the scenery and background, the **passé composé** is the action that moves the story forward.

    | imparfait | passé composé |
    |---|---|
    | background, description | main events |
    | ongoing action: *was doing* | completed action: *did* |
    | habits: *used to* | single occurrences |
    | no clear beginning or end | defined start, end or duration |
    | *Il faisait beau.* | *Soudain, il a commencé à pleuvoir.* |

    ### Interruption
    *Je **dormais** quand le téléphone **a sonné**.* — I was sleeping when the phone rang.

    ### Same verb, different meaning
    - *Je savais* (I knew) / *J'ai su* (I found out)
    - *Je connaissais Paul* (I knew Paul) / *J'ai connu Paul en 2010* (I met Paul)
    - *Il voulait partir* (he wanted to) / *Il a voulu partir* (he tried to)

    ### Defined duration
    *J'ai habité à Caen pendant deux ans* (finished period) → passé composé, even though it lasted.
  examples:
    - { es: "Il pleuvait quand nous sommes arrivés à Omaha Beach.", en: "It was raining when we arrived at Omaha Beach." }
    - { es: "Mon grand-père avait vingt ans quand la guerre a fini.", en: "My grandfather was twenty when the war ended." }
    - { es: "Je lisais quand tu m'as appelé.", en: "I was reading when you called me." }
    - { es: "Ils ont habité à Bayeux pendant dix ans.", en: "They lived in Bayeux for ten years." }
  pitfalls:
    - "A long but finished period takes the passé composé: *J'ai attendu deux heures.*"
    - "'Was/were + -ing' is almost always imparfait."
    - "*Soudain, tout à coup, un jour* usually introduce a passé composé."
  related: [g.passe-compose-avoir, g.imparfait-uses, g.narrative-connectors, g.plus-que-parfait]
  drills:
    - { es: "Il faisait nuit quand elle est partie.", en: "It was dark when she left." }
    - { es: "Nous regardions la télé quand il est entré.", en: "We were watching TV when he came in." }
    - { es: "Un jour, j'ai rencontré un vieux soldat.", en: "One day I met an old soldier." }
- id: g.narrative-connectors
  level: a2
  title: "Telling a story: d'abord, ensuite, puis, enfin, soudain"
  summary: "Sequence events with d'abord, ensuite, puis, après, enfin; add drama with soudain, tout à coup, à ce moment-là."
  explanation: |
    | step | connectors |
    |---|---|
    | beginning | *d'abord* (first), *au début* (at the start), *un jour* (one day), *il était une fois* (once upon a time) |
    | middle | *ensuite, puis* (then), *après* (afterwards), *plus tard* (later), *le lendemain* (the next day) |
    | surprise | *soudain, tout à coup* (suddenly), *à ce moment-là* (at that moment) |
    | end | *enfin, finalement* (finally), *à la fin* (in the end) |
    | simultaneity | *pendant que* (while), *quand / lorsque* (when) |

    ### Avant / après
    - *avant* + noun: *avant le dîner*; *après* + noun: *après la visite*.
    - *Avant de* + infinitive (B1): *avant de partir*.

    *Enfin* also means "well…" or "I mean" in conversation; *finalement* also means "in the end, after all".
  examples:
    - { es: "D'abord, nous avons visité le musée, puis nous avons vu la plage.", en: "First we visited the museum, then we saw the beach." }
    - { es: "Soudain, le ciel est devenu noir.", en: "Suddenly the sky went black." }
    - { es: "Le lendemain, nous sommes allés à Bayeux.", en: "The next day we went to Bayeux." }
    - { es: "Finalement, on est restés à l'hôtel.", en: "In the end we stayed at the hotel." }
  pitfalls:
    - "*À la fin* = at the end; *enfin* = finally, at last."
    - "*Après* + verb needs a past infinitive (*après avoir mangé*) — not *après manger* in careful French."
  related: [g.pc-vs-imparfait, g.apres-avoir-avant-de, g.time-clauses]
  drills:
    - { es: "Ensuite, on a pris le bus.", en: "Then we took the bus." }
    - { es: "Tout à coup, il a commencé à pleuvoir.", en: "All of a sudden it started to rain." }
    - { es: "Enfin, nous sommes arrivés.", en: "At last we arrived." }
- id: g.pendant-depuis-il-y-a
  level: a2
  title: "Pendant, depuis, il y a, en, pour: talking about time"
  summary: "pendant = for (a finished period), depuis = since/for (still going), il y a = ago, en = within (how long it took)."
  explanation: |
    | word | meaning | tense | example |
    |---|---|---|---|
    | **pendant** | for, during (period) | any | *J'ai dormi **pendant** huit heures.* |
    | **depuis** | since, for (still true) | present | *J'habite ici **depuis** 2020.* |
    | **il y a** | ago | past | *Je suis arrivé **il y a** trois jours.* |
    | **en** | in, within (time taken) | any | *J'ai lu le livre **en** deux jours.* |
    | **pour** | for (planned future period) | future / plans | *Je pars **pour** une semaine.* |
    | **dans** | in (from now) | future | *Le train part **dans** dix minutes.* |

    ### Depuis vs pendant
    - *J'apprends le français **depuis** un an.* (I still am.)
    - *J'ai appris l'italien **pendant** un an.* (Finished.)

    *Pendant* is often dropped with a duration: *J'ai attendu (pendant) une heure.*
  examples:
    - { es: "Nous avons marché pendant trois heures.", en: "We walked for three hours." }
    - { es: "Mon grand-père est mort il y a dix ans.", en: "My grandfather died ten years ago." }
    - { es: "Ils ont construit le pont en deux ans.", en: "They built the bridge in two years." }
    - { es: "Je suis en Normandie depuis lundi.", en: "I've been in Normandy since Monday." }
  pitfalls:
    - "*Depuis* + present for ongoing situations: not *j'ai habité ici depuis deux ans*."
    - "*Dans dix minutes* (ten minutes from now) vs *en dix minutes* (it takes ten minutes)."
  related: [g.depuis-present, g.past-time-expressions, g.prepositions-time]
  drills:
    - { es: "J'ai vécu à Caen pendant cinq ans.", en: "I lived in Caen for five years." }
    - { es: "Elle est partie il y a une heure.", en: "She left an hour ago." }
    - { es: "On arrive dans vingt minutes.", en: "We'll be there in twenty minutes." }
- id: g.direct-object-pronouns
  level: a2
  title: "Direct object pronouns: le, la, l', les"
  summary: "Replace a direct object (no preposition) and go before the verb: Je le vois. Je ne la connais pas. Je vais les acheter."
  explanation: |
    | person | pronoun |
    |---|---|
    | me | **me / m'** |
    | you | **te / t'** |
    | him, it (m) | **le / l'** |
    | her, it (f) | **la / l'** |
    | us | **nous** |
    | you | **vous** |
    | them | **les** |

    ### Position: before the conjugated verb
    - *Tu vois le château ? — Oui, je **le** vois.*
    - Negative: *Je ne **le** vois pas.*
    - Passé composé: before the auxiliary: *Je **l'**ai vu.*
    - Verb + infinitive: before the infinitive: *Je vais **le** voir. Je peux **les** goûter ?*

    ### Which verbs?
    Verbs that take an object with **no preposition**: *voir, regarder, aimer, connaître, prendre, acheter, attendre, chercher, écouter, inviter, aider*.

    Note *attendre, chercher, écouter, regarder* are direct in French: *Je l'attends* (I'm waiting for him).
  examples:
    - { es: "Le camembert ? Je le mange avec du pain.", en: "Camembert? I eat it with bread." }
    - { es: "Cette ferme, tu la connais ?", en: "This farm, do you know it?" }
    - { es: "Je t'attends devant la gare.", en: "I'll wait for you outside the station." }
    - { es: "Les pommes ? Je vais les acheter au marché.", en: "The apples? I'm going to buy them at the market." }
  pitfalls:
    - "The pronoun goes before the verb, not after: *je le vois*, not *je vois le*."
    - "With an infinitive, the pronoun goes before the infinitive: *je veux le voir*."
    - "*Le / la* elide before a vowel: *je l'aime*."
  related: [g.indirect-object-pronouns, g.pc-object-agreement, g.double-object-pronouns]
  drills:
    - { es: "Je la vois tous les jours.", en: "I see her every day." }
    - { es: "Tu les as achetés ?", en: "Did you buy them?" }
    - { es: "Nous allons l'inviter.", en: "We're going to invite him." }
- id: g.indirect-object-pronouns
  level: a2
  title: "Indirect object pronouns: lui, leur"
  summary: "Replace à + person: Je parle à Marie → Je lui parle. Je téléphone à mes parents → Je leur téléphone."
  explanation: |
    | person | pronoun |
    |---|---|
    | (to) me | **me / m'** |
    | (to) you | **te / t'** |
    | (to) him / her | **lui** |
    | (to) us | **nous** |
    | (to) you | **vous** |
    | (to) them | **leur** |

    *Lui* means "to him" **and** "to her"; *leur* "to them" (m and f).

    ### Same position as le / la / les
    *Je **lui** donne un cadeau. Je ne **leur** parle pas. Je **lui** ai écrit. Je vais **leur** téléphoner.*

    ### Le or lui?
    It depends on the French verb, not the English one:
    - Direct (*le, la, les*): *voir, aider, inviter, appeler, remercier* quelqu'un.
    - Indirect (*lui, leur*): *parler, téléphoner, répondre, donner, écrire, dire, demander, offrir, plaire* à quelqu'un.

    Only for **people**. For things after *à*, use *y* (unit 6).
  examples:
    - { es: "Tu as écrit à ta grand-mère ? — Oui, je lui ai écrit hier.", en: "Did you write to your grandmother? — Yes, I wrote to her yesterday." }
    - { es: "Le fermier nous offre du cidre.", en: "The farmer offers us some cider." }
    - { es: "Je leur téléphone tous les dimanches.", en: "I phone them every Sunday." }
    - { es: "Ce fromage lui plaît beaucoup.", en: "She really likes this cheese." }
  pitfalls:
    - "*Leur* (to them) never takes -s; *leurs* is the possessive (*leurs enfants*)."
    - "*Téléphoner à*: *je lui téléphone*, not *je le téléphone*."
    - "*Lui* is both masculine and feminine: *je lui parle* = I talk to him / to her."
  related: [g.direct-object-pronouns, g.verbs-indirect-object, g.double-object-pronouns]
  drills:
    - { es: "Je lui donne mon numéro.", en: "I give him my number." }
    - { es: "Nous leur avons répondu.", en: "We answered them." }
    - { es: "Tu peux me passer le sel ?", en: "Can you pass me the salt?" }
- id: g.verbs-indirect-object
  level: a2
  title: "Verbs with à + person: parler à, demander à, téléphoner à"
  summary: "Some verbs take a direct object in English but à in French (téléphoner à, répondre à, obéir à) and vice versa (attendre, chercher, regarder)."
  explanation: |
    ### Verbs with à + person (→ lui, leur)
    | verb | example |
    |---|---|
    | *parler à* | *Je parle **au** directeur.* |
    | *téléphoner à* | *Elle téléphone **à** sa mère.* |
    | *répondre à* | *Réponds **à** Paul !* |
    | *demander à* | *Demande **au** serveur.* |
    | *dire à, écrire à, envoyer à* | *J'écris **à** mes amis.* |
    | *donner à, offrir à, prêter à* | *Il prête son vélo **à** Léa.* |
    | *ressembler à* | *Tu ressembles **à** ton père.* |
    | *plaire à* | *Ça plaît **aux** enfants.* |

    Many of these take two objects: something (direct) **to** someone (indirect): *donner **un livre à Marie***.

    ### Direct in French, preposition in English
    *attendre* (wait for), *chercher* (look for), *écouter* (listen to), *regarder* (look at), *demander* (ask for), *payer* (pay for): *J'attends le bus. Je cherche mes clés.*
  examples:
    - { es: "J'ai demandé le chemin à une dame.", en: "I asked a lady the way." }
    - { es: "Il ressemble beaucoup à sa mère.", en: "He looks a lot like his mother." }
    - { es: "Nous cherchons la ferme Dupont.", en: "We're looking for the Dupont farm." }
    - { es: "Elle a offert une bouteille de calvados à son père.", en: "She gave her father a bottle of calvados." }
  pitfalls:
    - "Not *j'attends pour le bus*: *j'attends le bus*."
    - "Not *je téléphone mon ami*: *je téléphone à mon ami*."
  related: [g.indirect-object-pronouns, g.verbs-prepositions]
  drills:
    - { es: "Il parle à ses voisins.", en: "He talks to his neighbours." }
    - { es: "J'écoute la radio.", en: "I'm listening to the radio." }
    - { es: "Elle répond à la question.", en: "She answers the question." }
- id: g.savoir-connaitre
  level: a2
  title: "Savoir or connaître? Two ways to know"
  summary: "savoir = know a fact, know how to (+ infinitive, que, si, où…); connaître = be familiar with a person, place or thing."
  explanation: |
    | | savoir | connaître |
    |---|---|---|
    | je | sais | connais |
    | tu | sais | connais |
    | il / elle | sait | connaît |
    | nous | savons | connaissons |
    | vous | savez | connaissez |
    | ils / elles | savent | connaissent |
    | participle | su | connu |

    ### Savoir: information and skills
    - + fact: *Je sais la réponse.*
    - + *que, si, où, quand, comment…*: *Tu sais où est la gare ? Je ne sais pas s'il vient.*
    - + infinitive = know how to: *Elle sait nager. Tu sais faire des crêpes ?*

    ### Connaître: acquaintance
    - people: *Je connais Marie.*
    - places: *Tu connais la Normandie ?*
    - works, things: *Je connais ce livre / ce fromage.*

    *Connaître* is never followed by *que* or an infinitive.
  examples:
    - { es: "Tu connais le pays d'Auge ?", en: "Do you know the pays d'Auge?" }
    - { es: "Je ne sais pas où il habite.", en: "I don't know where he lives." }
    - { es: "Elle sait faire le cidre.", en: "She knows how to make cider." }
    - { es: "Nous connaissons bien ce fermier.", en: "We know this farmer well." }
  pitfalls:
    - "Not *je connais nager*: *je sais nager*."
    - "Not *je sais Paris*: *je connais Paris*."
    - "*Je ne sais pas* is often *chais pas* in fast speech."
  related: [g.modal-verbs, g.pc-vs-imparfait]
  drills:
    - { es: "Vous savez quelle heure il est ?", en: "Do you know what time it is?" }
    - { es: "Je connais un bon restaurant.", en: "I know a good restaurant." }
    - { es: "Ils ne savent pas conduire.", en: "They can't drive." }
- id: g.pronoun-y
  level: a2
  title: "The pronoun y: there, about it"
  summary: "y replaces a place (à, en, chez, dans + place) and à + thing: Tu vas à Saint-Malo ? — Oui, j'y vais. J'y pense."
  explanation: |
    ### Places: there
    *Y* replaces a place introduced by *à, en, dans, chez, sur, sous…*:
    - *Tu vas **au Mont-Saint-Michel** ? — Oui, j'**y** vais demain.*
    - *Elle habite **en Bretagne** ? — Oui, elle **y** habite depuis dix ans.*
    - *On **y** va !* — Let's go!

    ### À + thing
    With verbs taking *à* + **thing**: *penser à, réfléchir à, répondre à, s'intéresser à, jouer à*:
    - *Tu penses **à ton voyage** ? — Oui, j'**y** pense.*
    - *Il **y** a répondu.* (to the email)

    For **people** after *à* use *lui / leur* or *à lui / à elle*: *Je pense à Marie → Je pense **à elle**.*

    ### Position
    Same as other object pronouns: *J'y vais. Je n'y vais pas. J'y suis allé. Je vais y aller.*

    *Il y a* is a fixed expression containing *y*.
  examples:
    - { es: "Le Mont-Saint-Michel ? On y va à pied à marée basse.", en: "Mont-Saint-Michel? You walk there at low tide." }
    - { es: "Tu es déjà allé à Saint-Malo ? — Non, je n'y suis jamais allé.", en: "Have you been to Saint-Malo? — No, I've never been there." }
    - { es: "Je pense à mes vacances. J'y pense tout le temps.", en: "I'm thinking about my holidays. I think about them all the time." }
  pitfalls:
    - "*Aller* needs a destination: *J'y vais*, not *Je vais* alone."
    - "With the future of *aller*, *y* is usually dropped: *J'irai* (not *J'y irai* — though it occurs)."
    - "Not for people: *je pense à lui*, not *j'y pense* for a person."
  related: [g.pronoun-en, g.y-en-combinations, g.aller-present]
  drills:
    - { es: "Nous y allons ce week-end.", en: "We're going there this weekend." }
    - { es: "Elle y habite depuis longtemps.", en: "She's lived there a long time." }
    - { es: "Tu y as pensé ?", en: "Did you think about it?" }
- id: g.pronoun-en
  level: a2
  title: "The pronoun en: some, of it, from there"
  summary: "en replaces de + noun: partitives (du pain → j'en veux), de + thing (parler de), and de + place (je viens de Brest → j'en viens)."
  explanation: |
    | replaces | example | with en |
    |---|---|---|
    | partitive *du, de la, des* | *Tu veux **du** cidre ?* | *Oui, j'**en** veux.* |
    | *de* after a negative | *Tu as **des** frères ?* | *Non, je n'**en** ai pas.* |
    | verb + *de* + thing | *Tu parles **de ton voyage** ?* | *Oui, j'**en** parle.* |
    | *de* + place (from) | *Tu reviens **de la plage** ?* | *Oui, j'**en** reviens.* |

    Common verbs with *de*: *parler de, avoir besoin de, avoir envie de, avoir peur de, s'occuper de, se souvenir de*.

    ### Position
    Before the verb like other pronouns: *J'en prends. Je n'en prends pas. J'en ai pris. Je vais en prendre.*

    ### Fixed expressions
    *Je m'en vais* (I'm leaving), *J'en ai marre* (I'm fed up), *Ne t'en fais pas* (don't worry), *Je n'en peux plus* (I can't take any more).
  examples:
    - { es: "Des huîtres ? J'en mange souvent en Bretagne.", en: "Oysters? I often eat them in Brittany." }
    - { es: "Tu as besoin de ton parapluie ? — Oui, j'en ai besoin.", en: "Do you need your umbrella? — Yes, I need it." }
    - { es: "Il n'y en a plus.", en: "There's none left." }
    - { es: "Saint-Malo ? Nous en revenons.", en: "Saint-Malo? We've just come back from there." }
  pitfalls:
    - "Don't drop *en* when you answer: *Tu as des enfants ? — Oui, j'en ai deux*, not *Oui, j'ai deux*."
    - "For people after *de*, use a stressed pronoun: *Je parle de Paul → Je parle de lui*."
  related: [g.en-quantities, g.pronoun-y, g.partitive-articles, g.y-en-combinations]
  drills:
    - { es: "Tu en veux ?", en: "Do you want some?" }
    - { es: "Je n'en ai pas besoin.", en: "I don't need it." }
    - { es: "On en parle demain.", en: "We'll talk about it tomorrow." }
- id: g.en-quantities
  level: a2
  title: "En with numbers and quantities: j'en ai deux"
  summary: "With a number or quantity, keep the number and put en before the verb: J'en veux trois. Il en a beaucoup."
  explanation: |
    When the noun follows a **number** or **quantity word**, *en* replaces the noun and the quantity stays at the end:

    | question | answer |
    |---|---|
    | *Tu as combien de frères ?* | *J'**en** ai **deux**.* |
    | *Vous voulez des crêpes ?* | *Oui, j'**en** voudrais **trois**.* |
    | *Il y a beaucoup de touristes ?* | *Oui, il y **en** a **beaucoup**.* |
    | *Tu prends un kilo de pommes ?* | *J'**en** prends **un kilo**.* |
    | *Tu as une voiture ?* | *Oui, j'**en** ai **une**.* / *Non, je n'**en** ai pas.* |

    ### Il y en a
    *Il y en a* = there is/are some: *Des cafés ? Il y en a partout.* Negative: *Il n'y en a pas.*

    With *un / une* in the negative, the number disappears: *Je n'en ai pas* (I don't have one).
  examples:
    - { es: "Des remparts ? Il y en a autour de toute la ville.", en: "Ramparts? There are some all round the town." }
    - { es: "Tu as des cousins ? — Oui, j'en ai cinq.", en: "Do you have cousins? — Yes, I have five." }
    - { es: "J'en ai acheté une douzaine.", en: "I bought a dozen." }
    - { es: "Il n'y en a pas assez.", en: "There aren't enough." }
  pitfalls:
    - "Always say *en* with a bare number: *J'en ai deux*, never *J'ai deux*."
    - "*J'en ai un* (I have one), negative *Je n'en ai pas* (not *je n'en ai pas un*)."
  related: [g.pronoun-en, g.quantities]
  drills:
    - { es: "J'en voudrais deux, s'il vous plaît.", en: "I'd like two, please." }
    - { es: "Il y en a beaucoup.", en: "There are lots." }
    - { es: "Elle en a mangé trois.", en: "She ate three." }
- id: g.comparatives
  level: a2
  title: "Comparatives: plus, moins, aussi … que"
  summary: "plus grand que, moins cher que, aussi beau que; with nouns plus de, moins de, autant de; with verbs plus, moins, autant."
  explanation: |
    ### Adjectives and adverbs
    | | structure | example |
    |---|---|---|
    | + | **plus** … **que** | *Saint-Malo est plus grande que Dinard.* |
    | − | **moins** … **que** | *Brest est moins touristique que Quimper.* |
    | = | **aussi** … **que** | *La plage est aussi belle qu'en Normandie.* |

    The adjective agrees as usual: *La mer est plus froide que l'année dernière.*

    ### Nouns
    *plus **de**, moins **de**, autant **de*** + noun (+ *que*): *Il y a plus de touristes en été. J'ai autant de livres que toi.*

    ### Verbs
    verb + *plus / moins / autant* (+ *que*): *Il pleut plus qu'à Paris. Je travaille autant que toi.*

    After *que*, use stressed pronouns: *plus grand que **moi***.

    ### With numbers
    *plus de* + number: *plus de 2 000 habitants* (not *plus que*).
  examples:
    - { es: "Saint-Malo est plus ancienne que Dinard.", en: "Saint-Malo is older than Dinard." }
    - { es: "La mer est moins chaude qu'en Provence.", en: "The sea is less warm than in Provence." }
    - { es: "Il y a autant de crêperies que de boulangeries !", en: "There are as many crêperies as bakeries!" }
    - { es: "Mon frère est aussi grand que moi.", en: "My brother is as tall as me." }
  pitfalls:
    - "*Autant* (not *aussi*) with nouns and verbs: *autant de pluie*, *il mange autant que moi*."
    - "Not *plus bon*: *meilleur* (next note)."
    - "*Plus de 100 personnes* with numbers, not *plus que 100*."
  related: [g.superlatives, g.meilleur-mieux, g.stressed-pronouns]
  drills:
    - { es: "Le train est plus rapide que le bus.", en: "The train is faster than the bus." }
    - { es: "Elle est moins timide que sa sœur.", en: "She's less shy than her sister." }
    - { es: "Il pleut autant qu'en Normandie.", en: "It rains as much as in Normandy." }
- id: g.superlatives
  level: a2
  title: "Superlatives: le plus, la moins"
  summary: "le / la / les + plus / moins + adjective (+ de): la plus belle ville de Bretagne, le restaurant le moins cher."
  explanation: |
    | | example |
    |---|---|
    | adjective before the noun | *C'est **la plus belle** plage **de** la région.* |
    | adjective after the noun | *C'est la plage **la plus belle** de la région.* (article repeated) |
    | least | *le quartier **le moins cher** de la ville* |
    | with a verb | *C'est lui qui travaille **le plus**.* |
    | with a noun | *C'est ici qu'il y a **le plus de** touristes.* |

    - The article agrees: ***le** plus grand, **la** plus grande, **les** plus grands*.
    - "in" after a superlative = **de**: *le plus vieux phare **de** France* (not *en France*).
    - Possessives replace the article: ***mon** plus beau souvenir*.

    Common: *le plus grand / petit / vieux / beau / célèbre*. Irregular: *le meilleur, le pire*.
  examples:
    - { es: "Saint-Malo est la ville la plus visitée de Bretagne.", en: "Saint-Malo is the most visited town in Brittany." }
    - { es: "C'est le plus beau jour de ma vie !", en: "It's the best day of my life!" }
    - { es: "Prends le chemin le moins long.", en: "Take the shortest path." }
    - { es: "C'est en août qu'il y a le plus de monde.", en: "August is when there are the most people." }
  pitfalls:
    - "Repeat the article when the adjective follows: *la plage la plus belle*, not *la plage plus belle*."
    - "'In' is *de*: *le plus haut de la ville*."
  related: [g.comparatives, g.meilleur-mieux]
  drills:
    - { es: "C'est la plus vieille maison de la ville.", en: "It's the oldest house in town." }
    - { es: "C'est le musée le plus intéressant.", en: "It's the most interesting museum." }
    - { es: "C'est elle qui court le plus vite.", en: "She's the one who runs fastest." }
- id: g.meilleur-mieux
  level: a2
  title: "Meilleur or mieux? Better and best"
  summary: "meilleur is an adjective (better food), mieux an adverb (sings better). Superlatives: le meilleur, le mieux. Pire = worse."
  explanation: |
    | | adjective (qualifies a noun) | adverb (qualifies a verb) |
    |---|---|---|
    | good / well | *bon* | *bien* |
    | better | ***meilleur(e)(s)*** | ***mieux*** |
    | the best | ***le / la / les meilleur(e)(s)*** | ***le mieux*** |
    | bad / badly | *mauvais* | *mal* |
    | worse | *plus mauvais* / ***pire*** | *plus mal* |
    | the worst | *le plus mauvais* / ***le pire*** | *le plus mal* |

    - *Ces crêpes sont **meilleures** que celles d'hier.* (adjective: agrees with *crêpes*)
    - *Elle cuisine **mieux** que moi.* (adverb: how she cooks)
    - *C'est **mieux**.* — *C'est* + **mieux** for "it's better" (situation): *C'est mieux de réserver.*

    Never *plus bon* or *plus bien*.

    *Pire* is common for abstract things: *C'est pire qu'avant ! Le pire, c'est la pluie.*
  examples:
    - { es: "Les galettes de Quimper sont les meilleures !", en: "Quimper's galettes are the best!" }
    - { es: "Tu parles mieux français que l'année dernière.", en: "You speak French better than last year." }
    - { es: "C'est mieux de partir tôt.", en: "It's better to leave early." }
    - { es: "Le temps est pire qu'hier.", en: "The weather is worse than yesterday." }
  pitfalls:
    - "Not *plus bon*: *meilleur*. Not *plus bien*: *mieux*."
    - "*Meilleur* agrees: *la meilleure*, *les meilleurs*; *mieux* never changes."
    - "*Je vais mieux* = I feel better (health)."
  related: [g.comparatives, g.superlatives, g.adverbs-ment]
  drills:
    - { es: "C'est le meilleur restaurant de la ville.", en: "It's the best restaurant in town." }
    - { es: "Elle chante mieux que lui.", en: "She sings better than him." }
    - { es: "Je me sens mieux.", en: "I feel better." }
- id: g.futur-simple-forms
  level: a2
  title: "The futur simple: forms"
  summary: "Infinitive + -ai, -as, -a, -ons, -ez, -ont: je parlerai, tu finiras; -re verbs drop the e: il prendra."
  explanation: |
    The **stem** is the infinitive (drop the final -e of -re verbs); the **endings** look like the present of *avoir*.

    | | parler | finir | prendre |
    |---|---|---|---|
    | je | parler**ai** | finir**ai** | prendr**ai** |
    | tu | parler**as** | finir**as** | prendr**as** |
    | il / elle / on | parler**a** | finir**a** | prendr**a** |
    | nous | parler**ons** | finir**ons** | prendr**ons** |
    | vous | parler**ez** | finir**ez** | prendr**ez** |
    | ils / elles | parler**ont** | finir**ont** | prendr**ont** |

    Every future stem ends in **r**: that's the sound to listen for.

    ### Spelling-change verbs keep their change
    *acheter → j'achèterai, appeler → j'appellerai, payer → je paierai* (or *payerai*). But *préférer → je préférerai* (é stays).

    ### Use
    - Predictions: *Il fera beau demain.*
    - Promises and decisions: *Je t'appellerai.*
    - Plans further away or more formal than *aller* + infinitive: *L'année prochaine, j'habiterai à Quimper.*
  examples:
    - { es: "Demain, nous visiterons la cathédrale de Quimper.", en: "Tomorrow we will visit Quimper cathedral." }
    - { es: "Je t'écrirai une carte postale.", en: "I'll write you a postcard." }
    - { es: "Le festival commencera le 20 juillet.", en: "The festival will start on 20 July." }
    - { es: "Ils prendront le train de huit heures.", en: "They'll take the eight o'clock train." }
  pitfalls:
    - "-re verbs drop the -e: *je prendrai*, not *je prendrerai*."
    - "*Je parlerai* (future) [ʁe] vs *je parlerais* (conditional) [ʁɛ]: write the right ending."
  related: [g.futur-irregular-stems, g.futur-proche, g.si-present-futur, g.conditionnel-present]
  drills:
    - { es: "Elle finira à six heures.", en: "She'll finish at six." }
    - { es: "Nous mangerons des crêpes.", en: "We'll eat crêpes." }
    - { es: "Vous partirez quand ?", en: "When will you leave?" }
- id: g.futur-irregular-stems
  level: a2
  title: "Irregular future stems: ir-, ser-, aur-, fer-…"
  summary: "aller → j'irai, être → je serai, avoir → j'aurai, faire → je ferai, venir → je viendrai, pouvoir → je pourrai…"
  explanation: |
    The endings are always regular; these verbs have a special **stem**:

    | verb | stem | example |
    |---|---|---|
    | être | **ser-** | *je serai* |
    | avoir | **aur-** | *tu auras* |
    | aller | **ir-** | *il ira* |
    | faire | **fer-** | *nous ferons* |
    | venir / tenir | **viendr- / tiendr-** | *vous viendrez* |
    | pouvoir | **pourr-** | *ils pourront* |
    | vouloir | **voudr-** | *je voudrai* |
    | devoir | **devr-** | *tu devras* |
    | savoir | **saur-** | *il saura* |
    | voir | **verr-** | *nous verrons* |
    | envoyer | **enverr-** | *j'enverrai* |
    | courir / mourir | **courr- / mourr-** | *il courra* |
    | recevoir | **recevr-** | *je recevrai* |
    | falloir | **faudr-** | *il faudra* |
    | pleuvoir | **pleuvr-** | *il pleuvra* |

    Fixed expressions: *On verra !* (We'll see!), *Ça ira.* (It'll be fine.), *Il faudra…* (We'll have to…)
  examples:
    - { es: "Demain, il fera beau à Quimper.", en: "Tomorrow the weather will be nice in Quimper." }
    - { es: "Nous irons au festival de Cornouaille.", en: "We'll go to the Cornouaille festival." }
    - { es: "Tu verras, tu adoreras les galettes !", en: "You'll see, you'll love galettes!" }
    - { es: "Il faudra réserver une table.", en: "We'll have to book a table." }
  pitfalls:
    - "*J'irai*, not *j'allerai*."
    - "*Je serai* (be) vs *je saurai* (know): different stems."
    - "*Pourrai, verrai, enverrai, courrai* have a double r: you hear a longer r."
  related: [g.futur-simple-forms, g.quand-futur]
  drills:
    - { es: "Je serai à la maison ce soir.", en: "I'll be at home tonight." }
    - { es: "Ils viendront avec nous.", en: "They'll come with us." }
    - { es: "Est-ce qu'il pleuvra demain ?", en: "Will it rain tomorrow?" }
- id: g.si-present-futur
  level: a2
  title: "Si + present, future: real conditions"
  summary: "S'il pleut, nous resterons à l'hôtel. After si use the present, never the future."
  explanation: |
    | condition (si + **present**) | result (**future**, present or imperative) |
    |---|---|
    | *S'il fait beau,* | *nous irons à la plage.* |
    | *Si tu veux,* | *on peut manger ici.* |
    | *Si tu as froid,* | *prends mon pull.* |

    The order can be reversed: *Nous irons à la plage s'il fait beau.*

    ### Spelling
    *Si* + *il / ils* → **s'il, s'ils**. But *si elle, si on* (no elision).

    ### Si = whether
    In indirect questions *si* means "whether" and **can** take the future: *Je ne sais pas **s'il viendra**.*

    This is the first of three types of *si*-sentences; the others (*si j'avais…*, *si j'avais eu…*) come at B1 and B2.
  examples:
    - { es: "S'il pleut demain, nous visiterons le musée.", en: "If it rains tomorrow, we'll visit the museum." }
    - { es: "Si tu viens en juillet, tu verras le festival.", en: "If you come in July, you'll see the festival." }
    - { es: "Si vous avez faim, goûtez cette galette.", en: "If you're hungry, try this galette." }
    - { es: "On ira à la mer si tu veux.", en: "We'll go to the seaside if you want." }
  pitfalls:
    - "Never the future after *si* (condition): *s'il pleut*, not *s'il pleuvra*."
    - "*S'il*, but *si elle*."
  related: [g.futur-simple-forms, g.quand-futur, g.si-imparfait-conditionnel]
  drills:
    - { es: "Si j'ai le temps, je t'appellerai.", en: "If I have time, I'll call you." }
    - { es: "S'il fait froid, on restera dedans.", en: "If it's cold, we'll stay inside." }
    - { es: "Si tu es fatigué, repose-toi.", en: "If you're tired, have a rest." }
- id: g.quand-futur
  level: a2
  title: "Quand + future: Quand je serai grand…"
  summary: "Unlike English, French uses the future after quand, lorsque, dès que, aussitôt que when the action is in the future."
  explanation: |
    | English | French |
    |---|---|
    | When I **am** in Quimper, I'll call you. | *Quand je **serai** à Quimper, je t'appellerai.* |
    | As soon as he **arrives**, we'll eat. | ***Dès qu'il arrivera**, on mangera.* |
    | When you **see** her, tell her hello. | *Quand tu la **verras**, dis-lui bonjour.* |

    The logic: both actions are in the future, so both verbs are in the future.

    Time conjunctions: *quand, lorsque* (when, formal), *dès que, aussitôt que* (as soon as), *pendant que* (while), *tant que* (as long as).

    ### Compare si
    - *Si* + **present**: *Si je vais à Quimper…* (maybe)
    - *Quand* + **future**: *Quand j'irai à Quimper…* (it will happen)

    For habits, *quand* takes the present: *Quand il pleut, je reste chez moi.*
  examples:
    - { es: "Quand je serai grande, je serai pilote.", en: "When I grow up, I'll be a pilot." }
    - { es: "Dès que nous arriverons, nous irons à la crêperie.", en: "As soon as we arrive, we'll go to the crêperie." }
    - { es: "Appelle-moi quand tu seras à la gare.", en: "Call me when you're at the station." }
  pitfalls:
    - "Not *quand je suis à Quimper, je t'appellerai*: *quand je serai*."
    - "Habits keep the present: *Quand il fait beau, je vais à la plage.*"
  related: [g.futur-simple-forms, g.si-present-futur, g.futur-anterieur]
  drills:
    - { es: "Quand tu auras le temps, viens nous voir.", en: "When you have time, come and see us." }
    - { es: "Je te répondrai dès que je pourrai.", en: "I'll answer you as soon as I can." }
    - { es: "Quand il fera beau, on ira à la plage.", en: "When the weather's nice, we'll go to the beach." }
- id: g.pronominal-verbs
  level: a2
  title: "Pronominal verbs: reflexive, reciprocal and idiomatic"
  summary: "se laver (oneself), se parler (each other), s'en aller / se souvenir (fixed meaning). The pronoun always matches the subject."
  explanation: |
    | type | meaning | examples |
    |---|---|---|
    | **reflexive** | to oneself | *se laver, se coiffer, se brosser les dents, s'habiller* |
    | **reciprocal** | each other (plural) | *Ils s'aiment. On se téléphone. Nous nous écrivons.* |
    | **idiomatic** | different meaning from the plain verb | *s'amuser* (have fun), *s'ennuyer* (be bored), *se dépêcher* (hurry), *se souvenir de* (remember), *se tromper* (be wrong), *s'en aller* (leave), *s'entendre* (get on), *se rendre compte* (realise) |
    | **passive sense** | (B2) | *Ça se mange froid.* |

    ### Forms
    *me, te, se, nous, vous, se* (*m', t', s'* before a vowel): *je m'amuse, tu t'ennuies, il se dépêche, nous nous promenons, vous vous trompez, ils s'en vont*.

    ### With an infinitive
    The pronoun matches the subject: *Je vais **me** coucher. Tu dois **te** reposer. Nous allons **nous** promener.*

    ### Meaning changes
    *appeler* (call) / *s'appeler* (be called); *trouver* (find) / *se trouver* (be located); *passer* (pass) / *se passer* (happen).
  examples:
    - { es: "On se promène sur la plage de Carnac ?", en: "Shall we go for a walk on Carnac beach?" }
    - { es: "Je me souviens de cette légende.", en: "I remember this legend." }
    - { es: "Paul et Léa se téléphonent tous les soirs.", en: "Paul and Léa phone each other every evening." }
    - { es: "Dépêche-toi, on va être en retard !", en: "Hurry up, we're going to be late!" }
  pitfalls:
    - "The pronoun changes with the infinitive: *je vais me coucher*, not *je vais se coucher*."
    - "*Se souvenir de quelque chose*: *Je me souviens de lui*, not *Je me souviens lui*."
  related: [g.reflexive-intro, g.pronominal-passe-compose, g.body-parts-article, g.pronominal-passive]
  drills:
    - { es: "Nous nous amusons beaucoup.", en: "We're having a lot of fun." }
    - { es: "Tu te trompes.", en: "You're wrong." }
    - { es: "Ils s'entendent bien.", en: "They get on well." }
- id: g.pronominal-passe-compose
  level: a2
  title: "Pronominal verbs in the passé composé: je me suis levé"
  summary: "All pronominal verbs take être: elle s'est levée, nous nous sommes promenés. The participle usually agrees with the subject."
  explanation: |
    | | se lever |
    |---|---|
    | je | **me suis** levé(e) |
    | tu | **t'es** levé(e) |
    | il / elle / on | **s'est** levé / levée |
    | nous | **nous sommes** levé(e)s |
    | vous | **vous êtes** levé(e)(s) |
    | ils / elles | **se sont** levés / levées |

    ### Negative and questions
    *Je **ne** me suis **pas** levé. **T'es**-tu bien reposé ?* (formal) / *Tu t'es bien reposé ?*

    ### Agreement (the basics)
    The participle usually agrees with the subject: *Elle s'est promenée. Ils se sont amusés.*

    **No agreement** when a direct object comes after the verb, typically a body part: *Elle s'est lavé **les mains**.* (compare *Elle s'est lavée.*) Also no agreement with verbs that take *à* (*se parler, se téléphoner, se dire*): *Ils se sont parlé.*
  examples:
    - { es: "Ce matin, je me suis levée à six heures.", en: "This morning I got up at six." }
    - { es: "Nous nous sommes promenés entre les menhirs.", en: "We walked among the standing stones." }
    - { es: "Elle s'est cassé la jambe.", en: "She broke her leg." }
    - { es: "Vous vous êtes bien amusés ?", en: "Did you have a good time?" }
  pitfalls:
    - "Never *avoir*: *je me suis levé*, not *je m'ai levé*."
    - "*Elle s'est lavée* but *elle s'est lavé les cheveux* (object after the verb)."
  related: [g.pronominal-verbs, g.passe-compose-etre, g.pc-agreement-etre]
  drills:
    - { es: "Ils se sont couchés tard.", en: "They went to bed late." }
    - { es: "Je ne me suis pas réveillé.", en: "I didn't wake up." }
    - { es: "On s'est bien amusés.", en: "We had a great time." }
- id: g.body-parts-article
  level: a2
  title: "Body parts take le, la, les: Je me lave les mains"
  summary: "French uses the definite article (not my, your) with body parts, the 'owner' shown by a pronoun: Je me brosse les dents. Il a les yeux bleus."
  explanation: |
    | English | French |
    |---|---|
    | I brush **my** teeth. | *Je me brosse **les** dents.* |
    | She's washing **her** hair. | *Elle se lave **les** cheveux.* |
    | He broke **his** arm. | *Il s'est cassé **le** bras.* |
    | **My** head hurts. | *J'ai mal **à la** tête.* |
    | She has blue eyes. | *Elle a **les** yeux bleus.* |
    | Raise **your** hand. | *Levez **la** main.* |

    The pronoun (*me, se, lui…*) already says whose body it is, so a possessive would be redundant.

    ### Main body parts
    *la tête, les cheveux, les yeux (un œil), le nez, la bouche, les dents, l'oreille, le cou, le dos, le ventre, le bras, la main, le doigt, la jambe, le genou, le pied, la gorge* (throat).

    Use a possessive only to describe or for clarity: *Ses yeux sont magnifiques.*
  examples:
    - { es: "Je me suis coupé le doigt.", en: "I cut my finger." }
    - { es: "Lave-toi les mains avant de manger.", en: "Wash your hands before eating." }
    - { es: "Il a les cheveux courts et les yeux verts.", en: "He has short hair and green eyes." }
  pitfalls:
    - "Not *je brosse mes dents*: *je me brosse les dents*."
    - "*Un œil, des yeux*: irregular plural."
  related: [g.pronominal-verbs, g.avoir-mal, g.pronominal-passe-compose]
  drills:
    - { es: "Elle se maquille les yeux.", en: "She puts on eye make-up." }
    - { es: "Il s'est tordu la cheville.", en: "He twisted his ankle." }
    - { es: "Ferme les yeux.", en: "Close your eyes." }
- id: g.avoir-mal
  level: a2
  title: "Avoir mal à: where it hurts"
  summary: "J'ai mal à la tête, au dos, aux pieds. Ça fait mal. Je me sens mal."
  explanation: |
    **avoir mal à** + article + body part (with contractions):

    | | example |
    |---|---|
    | à la | *J'ai mal **à la** tête / gorge / jambe.* |
    | au (à + le) | *J'ai mal **au** dos / ventre / cœur* (= nausea) |
    | à l' | *J'ai mal **à l'**oreille / estomac.* |
    | aux (à + les) | *J'ai mal **aux** dents / pieds / yeux.* |

    ### Other health expressions
    - *Ça fait mal !* — It hurts!
    - *Où est-ce que vous avez mal ?* — Where does it hurt?
    - *Je me sens mal / bien / fatigué.* — I feel ill / well / tired.
    - *J'ai de la fièvre. Je tousse. J'ai le nez qui coule. Je suis enrhumé(e).* (I have a cold.)
    - *Je me suis fait mal (au genou).* — I hurt myself (my knee).
    - *Avoir mal au cœur* = to feel sick (not heart pain).

    At the pharmacy: *Vous avez quelque chose contre le mal de tête ?*
  examples:
    - { es: "J'ai mal aux pieds, on a trop marché !", en: "My feet hurt, we walked too much!" }
    - { es: "Elle a mal à la gorge.", en: "She has a sore throat." }
    - { es: "Je me suis fait mal au dos.", en: "I hurt my back." }
    - { es: "Vous avez quelque chose contre le mal de mer ?", en: "Do you have something for seasickness?" }
  pitfalls:
    - "Not *ma tête fait mal*: *j'ai mal à la tête*."
    - "Contract: *au dos*, *aux dents*, never *à le dos*."
    - "*J'ai mal au cœur* means I feel sick."
  related: [g.avoir-expressions, g.body-parts-article, g.contractions-au-du]
  drills:
    - { es: "J'ai mal au ventre.", en: "I have a stomach ache." }
    - { es: "Tu as mal où ?", en: "Where does it hurt?" }
    - { es: "Il a mal aux dents.", en: "He has toothache." }
- id: g.etre-en-train-de
  level: a2
  title: "Être en train de: to be in the middle of doing"
  summary: "Je suis en train de manger = I'm (busy) eating right now. Imparfait: J'étais en train de dormir."
  explanation: |
    French has no special "-ing" tense: *je mange* = I eat / I'm eating. To stress that an action is **in progress right now**, use:

    | être (any tense) | en train de | infinitive |
    |---|---|---|
    | *Je suis* | *en train de* | *lire.* |
    | *Ils étaient* | *en train de* | *dîner quand j'ai appelé.* |

    It's natural for interruptions and for saying you're busy: *Je ne peux pas, je suis en train de travailler.*

    ### Related structures
    - *être sur le point de* + infinitive = to be about to: *Le train est sur le point de partir.*
    - *venir de* = to have just; *aller* + infinitive = to be going to.

    Don't overuse it: for normal descriptions the simple present or imparfait is enough.
  examples:
    - { es: "Je suis en train de faire les valises.", en: "I'm (in the middle of) packing." }
    - { es: "Nous étions en train de marcher quand il a commencé à pleuvoir.", en: "We were walking when it started to rain." }
    - { es: "Ne le dérange pas, il est en train de dormir.", en: "Don't disturb him, he's sleeping." }
  pitfalls:
    - "Not for states: *je suis en train de savoir* is impossible."
    - "Not for habits: *je travaille le lundi*, not *je suis en train de travailler le lundi*."
  related: [g.venir-de, g.futur-proche, g.imparfait-uses]
  drills:
    - { es: "Elle est en train de se doucher.", en: "She's in the shower." }
    - { es: "Qu'est-ce que tu es en train de faire ?", en: "What are you doing right now?" }
    - { es: "J'étais en train de lire.", en: "I was reading." }
- id: g.imperative
  level: a2
  title: "The imperative: Mélangez ! Prends ! Allons-y !"
  summary: "Use the tu, nous and vous present forms without the pronoun; -er verbs drop the -s in the tu form (mange !)."
  explanation: |
    | | parler | finir | prendre | aller |
    |---|---|---|---|---|
    | (tu) | **parle** | **finis** | **prends** | **va** |
    | (nous) — let's | **parlons** | **finissons** | **prenons** | **allons** |
    | (vous) | **parlez** | **finissez** | **prenez** | **allez** |

    - -er verbs (and *aller*) **drop the -s** in the *tu* form: *Mange ! Écoute ! Va !* (but *Vas-y !* keeps it before *y*).
    - Negative: *Ne mange pas ! Ne prenez pas ce chemin.*

    ### Irregular
    | | être | avoir | savoir | vouloir |
    |---|---|---|---|---|
    | tu | **sois** | **aie** | **sache** | — |
    | nous | **soyons** | **ayons** | **sachons** | — |
    | vous | **soyez** | **ayez** | **sachez** | **veuillez** (formal: please) |

    *Sois sage !* (Be good!) *N'aie pas peur !* (Don't be afraid!) *Veuillez patienter.* (Please wait.)

    ### Recipes
    Recipes use the *vous* imperative or the infinitive: *Faites fondre le beurre* / *Faire fondre le beurre*.
  examples:
    - { es: "Faites chauffer le beurre dans une casserole.", en: "Heat the butter in a saucepan." }
    - { es: "Ajoute un peu de sel.", en: "Add a little salt." }
    - { es: "Allons voir l'éléphant !", en: "Let's go and see the elephant!" }
    - { es: "Ne soyez pas en retard !", en: "Don't be late!" }
  pitfalls:
    - "No -s for -er verbs with tu: *Regarde !*, not *Regardes !*"
    - "No subject pronoun: *Viens !*, not *Tu viens !* (which is a question or statement)."
  related: [g.imperative-with-pronouns, g.directions, g.pronoun-order-imperative]
  drills:
    - { es: "Mélangez bien.", en: "Mix well." }
    - { es: "Attends-moi !", en: "Wait for me!" }
    - { es: "Ne touche pas, c'est chaud !", en: "Don't touch, it's hot!" }
- id: g.imperative-with-pronouns
  level: a2
  title: "Imperative with pronouns: Lève-toi ! Prends-le ! Ne le prends pas !"
  summary: "Affirmative: pronoun after the verb with a hyphen (me → moi, te → toi). Negative: pronoun before the verb as usual."
  explanation: |
    ### Affirmative: after the verb, with a hyphen
    | statement | imperative |
    |---|---|
    | *Tu le prends.* | ***Prends-le !*** |
    | *Vous lui téléphonez.* | ***Téléphonez-lui !*** |
    | *Tu me regardes.* | ***Regarde-moi !*** (me → **moi**) |
    | *Tu te lèves.* | ***Lève-toi !*** (te → **toi**) |
    | *Nous nous dépêchons.* | ***Dépêchons-nous !*** |
    | *Tu y vas.* | ***Vas-y !*** |
    | *Tu en prends.* | ***Prends-en !*** |

    *Vas-y, manges-en* keep an -s before *y* and *en* for the sound.

    ### Negative: before the verb, normal forms
    *Ne **le** prends pas ! Ne **me** regarde pas ! Ne **te** lève pas ! Ne **vous** inquiétez pas !*

    Useful: *Excusez-moi. Dis-moi. Laisse-moi tranquille. Asseyez-vous. Vas-y ! Allez-y !*
  examples:
    - { es: "Le beurre ? Coupe-le en petits morceaux.", en: "The butter? Cut it into small pieces." }
    - { es: "Asseyez-vous, je vous en prie.", en: "Sit down, please." }
    - { es: "Ne t'inquiète pas, ça va aller.", en: "Don't worry, it'll be fine." }
    - { es: "Dis-moi la vérité !", en: "Tell me the truth!" }
  pitfalls:
    - "*Donne-moi*, not *donne-me*; but negative *ne me donne pas*."
    - "Don't forget the hyphen: *lève-toi*."
  related: [g.imperative, g.direct-object-pronouns, g.pronoun-order-imperative]
  drills:
    - { es: "Réveille-toi !", en: "Wake up!" }
    - { es: "Ne lui dis rien.", en: "Don't tell him anything." }
    - { es: "Goûtez-le !", en: "Taste it!" }
- id: g.adverbs-ment
  level: a2
  title: "Adverbs in -ment: lentement, doucement, vraiment"
  summary: "Add -ment to the feminine adjective (lente → lentement); -ant/-ent → -amment/-emment (courant → couramment)."
  explanation: |
    | rule | adjective | adverb |
    |---|---|---|
    | feminine + **-ment** | *lent → lente* | *lentement* (slowly) |
    | | *doux → douce* | *doucement* (gently) |
    | | *heureux → heureuse* | *heureusement* (fortunately) |
    | masc. ending in a vowel + **-ment** | *vrai, poli, absolu* | *vraiment, poliment, absolument* |
    | **-ant → -amment** | *courant, élégant* | *couramment, élégamment* |
    | **-ent → -emment** [amɑ̃] | *évident, récent* | *évidemment, récemment* |

    ### Irregular
    *bon → **bien**, mauvais → **mal**, gentil → **gentiment**, précis → **précisément**, énorme → **énormément**, rapide → rapidement / **vite***.

    ### Position
    Usually after the verb: *Elle parle **couramment** français.* In the passé composé, short adverbs go between auxiliary and participle: *J'ai **bien** dormi. Il a **vite** compris.*; longer ones often after: *Il a répondu **poliment**.*
  examples:
    - { es: "Remuez doucement avec une cuillère en bois.", en: "Stir gently with a wooden spoon." }
    - { es: "Heureusement, il ne pleut pas.", en: "Fortunately it isn't raining." }
    - { es: "Elle parle couramment trois langues.", en: "She speaks three languages fluently." }
    - { es: "J'ai récemment visité Nantes.", en: "I recently visited Nantes." }
  pitfalls:
    - "*Évidemment* and *récemment* are pronounced [-amɑ̃] despite the e."
    - "Not *bonnement* for 'well': *bien*."
  related: [g.meilleur-mieux, g.frequency-adverbs]
  drills:
    - { es: "Parlez lentement, s'il vous plaît.", en: "Speak slowly, please." }
    - { es: "C'est vraiment délicieux.", en: "It's really delicious." }
    - { es: "Il conduit prudemment.", en: "He drives carefully." }
- id: g.pc-object-agreement
  level: a2
  title: "Agreement with avoir: les photos que j'ai prises"
  summary: "With avoir, the participle agrees with a direct object placed before the verb: Ces cartes, je les ai achetées."
  explanation: |
    The participle after *avoir* normally doesn't change. But it **agrees** with the **direct object** when that object comes **before** the verb:

    | object position | example |
    |---|---|
    | after the verb: no agreement | *J'ai acheté **des cartes postales**.* |
    | before, as a pronoun | *Les cartes ? Je **les** ai acheté**es** à Amboise.* |
    | before, in a relative clause (B1) | ***Les photos que** j'ai pris**es** sont belles.* |
    | before, in a question | ***Quelle** maison as-tu visité**e** ?* |

    ### Sound
    Usually silent; heard with participles ending in a consonant: *pris → prise* [pʁiz], *fait → faite* [fɛt], *mis → mise*, *écrit → écrite*, *ouvert → ouverte*.
    *La lettre ? Je l'ai écrite.* [ekʁit]

    ### No agreement with en
    *Des photos ? J'**en** ai pris beaucoup.* (no agreement)
  examples:
    - { es: "La maison de Léonard ? Nous l'avons visitée hier.", en: "Leonardo's house? We visited it yesterday." }
    - { es: "Ces chaussures, je les ai achetées à Tours.", en: "These shoes, I bought them in Tours." }
    - { es: "Ta valise, tu l'as faite ?", en: "Your suitcase, have you packed it?" }
  pitfalls:
    - "No agreement when the object comes after: *J'ai vu la maison.*"
    - "No agreement with an indirect object: *Je leur ai parlé* (*leur* is indirect)."
    - "Even native speakers often forget in speech; in writing it's expected."
  related: [g.pc-agreement-etre, g.direct-object-pronouns, g.relative-qui-que]
  drills:
    - { es: "Les clés ? Je les ai mises sur la table.", en: "The keys? I put them on the table." }
    - { es: "Cette photo, qui l'a prise ?", en: "This photo, who took it?" }
    - { es: "Les châteaux ? Nous les avons tous vus.", en: "The châteaux? We've seen them all." }
- id: g.tout-chaque-plusieurs
  level: a2
  title: "Tout, chaque, plusieurs, quelques, certains"
  summary: "tout le / toute la / tous les / toutes les (all, every), chaque (each, singular), plusieurs (several), quelques (a few)."
  explanation: |
    ### Tout as an adjective (+ article)
    | | singular | plural |
    |---|---|---|
    | masculine | ***tout** le château* (the whole) | ***tous** les châteaux* (all, every) |
    | feminine | ***toute** la journée* | ***toutes** les salles* |

    *tous les jours* (every day), *toute la journée* (all day), *tout le monde* (everybody, singular verb: *tout le monde est là*).

    ### Tout as a pronoun
    - *tout* = everything: *Tout est prêt. J'ai tout vu.*
    - *tous* [tus] / *toutes* = all of them: *Ils sont **tous** venus.*

    ### Other indefinites
    | word | meaning | example |
    |---|---|---|
    | *chaque* (+ singular noun) | each, every | *chaque salle* |
    | *chacun(e)* (pronoun) | each one | *chacun son tour* |
    | *plusieurs* (invariable) | several | *plusieurs châteaux* |
    | *quelques* | a few, some | *quelques jours* |
    | *certain(e)s* | some, certain | *certains rois* |
    | *aucun(e)* (+ ne) | not any (B1) | |
  examples:
    - { es: "Nous avons visité tous les châteaux de la région.", en: "We visited all the châteaux in the region." }
    - { es: "Chaque pièce a une cheminée.", en: "Each room has a fireplace." }
    - { es: "Léonard a passé plusieurs années à Amboise.", en: "Leonardo spent several years in Amboise." }
    - { es: "Tout le monde aime ce jardin.", en: "Everybody loves this garden." }
  pitfalls:
    - "*Tout le monde* = everybody, with a singular verb: *tout le monde parle*."
    - "Pronoun *tous* is pronounced [tus]: *Ils sont tous là.* Adjective *tous* is [tu]: *tous les jours*."
    - "*Chaque* is always singular: *chaque jour*, never *chaques jours*."
  related: [g.indefinite-pronouns, g.quantities]
  drills:
    - { es: "Il pleut toute la journée.", en: "It's raining all day." }
    - { es: "J'ai acheté quelques souvenirs.", en: "I bought a few souvenirs." }
    - { es: "Elles sont toutes parties.", en: "They've all left." }
- id: g.possessive-pronouns
  level: a2
  title: "Possessive pronouns: le mien, la tienne, les nôtres"
  summary: "Replace possessive + noun and agree with the thing owned: C'est ton sac ? — Non, le mien est rouge."
  explanation: |
    | owner | m. sing. | f. sing. | m. pl. | f. pl. |
    |---|---|---|---|---|
    | je | **le mien** | **la mienne** | **les miens** | **les miennes** |
    | tu | le tien | la tienne | les tiens | les tiennes |
    | il / elle | le sien | la sienne | les siens | les siennes |
    | nous | **le nôtre** | **la nôtre** | **les nôtres** | les nôtres |
    | vous | le vôtre | la vôtre | les vôtres | les vôtres |
    | ils / elles | le leur | la leur | les leurs | les leurs |

    - They agree with the **thing owned**: *ma voiture → **la mienne**; mes billets → **les miens***.
    - With *à* and *de*, contract: *Je pense **au** mien. Je parle **des** nôtres.*
    - *Nôtre, vôtre* (pronouns) have a circumflex and an open sound [o]; *notre, votre* (adjectives) don't.

    ### Être à
    Simple possession is often *être à* + stressed pronoun: *Ce sac est **à moi**.* *C'est à qui ? — C'est à elle.*
  examples:
    - { es: "Ce n'est pas mon billet, c'est le tien.", en: "It's not my ticket, it's yours." }
    - { es: "Notre château est petit, le leur est immense.", en: "Our château is small, theirs is huge." }
    - { es: "Ce parapluie est à vous ?", en: "Is this umbrella yours?" }
    - { es: "Ses enfants et les miens jouent ensemble.", en: "His children and mine play together." }
  pitfalls:
    - "Agreement is with the thing owned: Paul talking about his car says *la mienne*."
    - "*Le nôtre* (pronoun, ô) vs *notre maison* (adjective, no accent)."
  related: [g.possessives, g.stressed-pronouns]
  drills:
    - { es: "Ta valise est plus grande que la mienne.", en: "Your suitcase is bigger than mine." }
    - { es: "C'est à qui, ce sac ?", en: "Whose bag is this?" }
    - { es: "Leur maison est jolie, mais la nôtre a un jardin.", en: "Their house is pretty, but ours has a garden." }
- id: g.conditional-politeness
  level: a2
  title: "Polite requests: pourriez-vous, j'aimerais, je voudrais"
  summary: "The conditional softens requests and wishes: Pourriez-vous m'aider ? J'aimerais réserver. Ce serait possible ?"
  explanation: |
    The **conditional** (studied in full at B1) is formed with the future stem + imperfect endings: *je voudr**ais**, tu pourr**ais**, il aimer**ait**, nous ser**ions**, vous pourr**iez**, ils devr**aient***.

    At A2, learn these polite uses:

    | direct | polite |
    |---|---|
    | *Je veux une chambre.* | ***Je voudrais** une chambre.* |
    | *Vous pouvez m'aider ?* | ***Pourriez-vous** m'aider ?* / ***Vous pourriez** m'aider ?* |
    | *J'aime visiter…* | ***J'aimerais** visiter le château.* |
    | *C'est possible ?* | ***Ce serait** possible ?* |
    | *Tu dois partir.* | ***Tu devrais** partir.* (advice) |
    | *Ça vous dérange… ?* | ***Est-ce que ça vous dérangerait** de… ?* |

    ### At the hotel
    *Je voudrais réserver une chambre double pour deux nuits. Est-ce qu'il serait possible d'avoir une chambre avec vue ? Pourriez-vous me réveiller à sept heures ?*
  examples:
    - { es: "Bonjour, je voudrais réserver une chambre pour ce soir.", en: "Hello, I'd like to book a room for tonight." }
    - { es: "Pourriez-vous m'appeler un taxi ?", en: "Could you call me a taxi?" }
    - { es: "J'aimerais visiter Chambord demain.", en: "I'd like to visit Chambord tomorrow." }
    - { es: "Ce serait possible de changer de chambre ?", en: "Would it be possible to change rooms?" }
  pitfalls:
    - "Conditional *-ais* [ɛ] vs future *-ai* [e]: *je voudrais* (I'd like), *je voudrai* (I will want)."
    - "*Pourriez-vous* has double r: the stem is *pourr-*."
  related: [g.je-voudrais, g.conditionnel-present, g.conditional-advice]
  drills:
    - { es: "Vous pourriez parler moins fort ?", en: "Could you speak more quietly?" }
    - { es: "Nous aimerions dîner à l'hôtel.", en: "We would like to have dinner at the hotel." }
    - { es: "Tu devrais te reposer.", en: "You should rest." }
- id: g.indefinite-pronouns
  level: a2
  title: "Quelqu'un, quelque chose, personne, rien, quelque part"
  summary: "someone, something, nobody, nothing, somewhere, nowhere; with an adjective: quelque chose de bon, rien de grave."
  explanation: |
    | affirmative | negative (with ne) |
    |---|---|
    | *quelqu'un* (someone) | *ne … personne* (nobody) |
    | *quelque chose* (something) | *ne … rien* (nothing) |
    | *quelque part* (somewhere) | *ne … nulle part* (nowhere) |
    | *quelquefois* (sometimes) | *ne … jamais* (never) |

    ### In questions
    *Il y a quelqu'un ?* (Is anybody there?) *Tu veux quelque chose ?* (Do you want anything?) *Tu as vu mes clés quelque part ?*

    ### With an adjective: + de
    *quelque chose **de** bon, quelqu'un **d'**intéressant, rien **de** grave, personne **d'**autre* (masculine singular adjective).

    ### Other useful ones
    *n'importe qui / quoi / où* (anyone / anything / anywhere at all): *Il dit n'importe quoi !* (He talks nonsense!)
    *Quelques-uns / quelques-unes* (a few of them), *chacun* (each one).
  examples:
    - { es: "Il y a quelqu'un à la réception ?", en: "Is there anyone at reception?" }
    - { es: "Je voudrais quelque chose de typique de la région.", en: "I'd like something typical of the region." }
    - { es: "Ce n'est rien de grave.", en: "It's nothing serious." }
    - { es: "Je ne trouve mes lunettes nulle part.", en: "I can't find my glasses anywhere." }
  pitfalls:
    - "*Quelque chose de* + adjective: *quelque chose de nouveau*, not *quelque chose nouveau*."
    - "Negatives need *ne*: *Je ne vois personne.*"
  related: [g.negation-jamais-plus-rien, g.tout-chaque-plusieurs, g.quelque-chose-de]
  drills:
    - { es: "Quelqu'un a appelé pour vous.", en: "Someone called for you." }
    - { es: "Je n'ai rien compris.", en: "I didn't understand anything." }
    - { es: "On va quelque part ce soir ?", en: "Shall we go somewhere tonight?" }
- id: g.verbs-plus-infinitive
  level: a2
  title: "Verb + infinitive: aimer faire, commencer à faire, décider de faire"
  summary: "Some verbs take a bare infinitive (vouloir partir), some à (commencer à, apprendre à), some de (décider de, essayer de, oublier de)."
  explanation: |
    | no preposition | **à** + infinitive | **de** + infinitive |
    |---|---|---|
    | *aimer, adorer, détester, préférer* | *commencer à* | *décider de* |
    | *vouloir, pouvoir, devoir, savoir* | *apprendre à* | *essayer de* |
    | *aller, venir* | *réussir à* | *oublier de* |
    | *espérer, penser* (intend) | *continuer à* | *arrêter de* |
    | *falloir* (il faut) | *aider quelqu'un à* | *finir de* |
    | *laisser, faire* | *hésiter à* | *refuser de, accepter de* |
    | | *s'habituer à* | *avoir besoin / envie / peur de* |
    | | *inviter quelqu'un à* | *demander / dire à quelqu'un de* |

    There's no reliable rule: learn each verb with its preposition.

    ### Pronouns
    The object pronoun goes before the infinitive: *J'ai décidé **de le** faire. Il commence **à les** aimer.* Note: *de* and *à* never contract with *le, les* here.
  examples:
    - { es: "Nous avons décidé de dormir au château.", en: "We decided to sleep at the château." }
    - { es: "J'essaie de comprendre l'escalier de Léonard.", en: "I'm trying to understand Leonardo's staircase." }
    - { es: "Elle commence à parler français.", en: "She's starting to speak French." }
    - { es: "N'oublie pas de fermer la porte.", en: "Don't forget to close the door." }
  pitfalls:
    - "*Essayer de*, not *essayer à*; *réussir à*, not *réussir de*."
    - "*J'espère venir* (no preposition)."
    - "*Décider de le faire*, never *décider du faire*."
  related: [g.modal-verbs, g.verbs-prepositions, g.pour-sans-infinitive]
  drills:
    - { es: "Il a arrêté de fumer.", en: "He stopped smoking." }
    - { es: "J'apprends à cuisiner.", en: "I'm learning to cook." }
    - { es: "Elle a refusé de payer.", en: "She refused to pay." }
