id: a2.u04
title: "C'era una volta"
lessons:
  - id: a2.u04.l1
    title: Era una notte di stelle
    teach: [g.passato-prossimo-vs-imperfetto]
    vocab: [w.tempesta, w.silenzio, w.rumore, w.luce, w.ombra, w.stella, w.luna, w.spaventato, w.sorpreso, w.accadere, w.sparire, w.piangere, w.terribile, w.squillare]
    tip: "Imperfetto = the scene (weather, time, feelings, what was going on). Passato prossimo = the events that move the story on."
    sentences:
      - { es: "Era una bella giornata e la piazza era piena di gente.", en: "It was a beautiful day and the square was full of people.", altEs: ["Era una giornata bellissima e la piazza era piena di gente."], grammar: [g.passato-prossimo-vs-imperfetto, g.imperfetto-uses], vocab: [w.giornata, w.pieno] }
      - { es: "Quando sono arrivata a Siena, pioveva.", en: "When I arrived in Siena, it was raining.", altEs: ["Quando sono arrivato a Siena, pioveva.", "Pioveva quando sono arrivata a Siena."], grammar: [g.passato-prossimo-vs-imperfetto], vocab: [w.arrivare, w.piovere] }
      - { es: "Era tardi, quindi abbiamo preso un taxi.", en: "It was late, so we took a taxi.", altEs: ["Era tardi e allora abbiamo preso un taxi."], grammar: [g.passato-prossimo-vs-imperfetto], vocab: [w.tardi, w.taxi] }
      - { es: "Sono stanco, quindi vado a letto.", en: "I'm tired, so I'm going to bed.", altEs: ["Sono stanca, quindi vado a letto."], grammar: [g.passato-prossimo-vs-imperfetto], vocab: [w.stanco, w.andare-a-letto], transform: { instruction: "Put it in the past (yesterday)", answer: "Ero stanco, quindi sono andato a letto.", alt: ["Ero stanca, quindi sono andata a letto.", "Ieri ero stanco, quindi sono andato a letto."], en: "I was tired, so I went to bed." } }
      - { es: "Ieri notte ho dormito otto ore.", en: "Last night I slept for eight hours.", altEs: ["Stanotte ho dormito otto ore."], grammar: [g.passato-prossimo-vs-imperfetto], vocab: [w.dormire, w.notte], error: { wrong: "Ieri notte dormivo otto ore.", explain: "A limited, counted period (otto ore) takes the passato prossimo.", grammar: g.passato-prossimo-vs-imperfetto } }
      - { es: "In Piazza del Campo c'era un silenzio perfetto, poi è partita la corsa.", en: "In Piazza del Campo there was perfect silence, then the race started.", altEs: ["C'era un silenzio perfetto in Piazza del Campo, poi è partita la corsa."], grammar: [g.passato-prossimo-vs-imperfetto], vocab: [w.silenzio, w.corsa] }
      - { es: "Verso mezzanotte abbiamo sentito un rumore in cucina.", en: "Around midnight we heard a noise in the kitchen.", altEs: ["Abbiamo sentito un rumore in cucina verso mezzanotte."], grammar: [g.passato-prossimo-vs-imperfetto], vocab: [w.rumore, w.sentire] }
      - { es: "La luce si è spenta e i bambini erano spaventati.", en: "The light went out and the children were frightened.", altEs: ["Si è spenta la luce e i bambini erano spaventati."], grammar: [g.passato-prossimo-vs-imperfetto], vocab: [w.luce, w.spaventato] }
      - { es: "Faceva caldo, così ci siamo seduti all'ombra.", en: "It was hot, so we sat down in the shade.", altEs: ["Faceva caldo e quindi ci siamo seduti all'ombra.", "Faceva caldo, così ci siamo sedute all'ombra."], grammar: [g.passato-prossimo-vs-imperfetto], vocab: [w.ombra, w.sedersi] }
      - { es: "C'erano mille stelle e la luna era sopra la Torre del Mangia.", en: "There were a thousand stars and the moon was above the Torre del Mangia.", altEs: ["La luna era sopra la Torre del Mangia e c'erano mille stelle."], grammar: [g.imperfetto-uses], vocab: [w.stella, w.luna] }
      - { es: "Che cosa è accaduto ieri in piazza? — È arrivata una tempesta terribile.", en: "What happened in the square yesterday? — A terrible storm came.", altEs: ["Cosa è accaduto ieri in piazza? — È arrivata una tempesta terribile."], grammar: [g.passato-prossimo-vs-imperfetto], vocab: [w.accadere, w.tempesta, w.terribile] }
      - { es: "Il gatto è sparito per due giorni: eravamo molto preoccupati.", en: "The cat disappeared for two days: we were very worried.", altEs: ["Il gatto è sparito per due giorni ed eravamo molto preoccupati."], grammar: [g.passato-prossimo-vs-imperfetto], vocab: [w.sparire, w.preoccupato] }
      - { es: "Ho pianto perché ero troppo felice.", en: "I cried because I was too happy.", altEs: ["Ho pianto perché ero felicissima."], grammar: [g.passato-prossimo-vs-imperfetto], vocab: [w.piangere, w.felice] }
      - { es: "Ero sorpresa: non conoscevo nessuno, ma tutti mi salutavano.", en: "I was surprised: I didn't know anyone, but everyone was greeting me.", altEs: ["Ero sorpreso: non conoscevo nessuno, ma tutti mi salutavano."], grammar: [g.passato-prossimo-vs-imperfetto, g.imperfetto-uses], vocab: [w.sorpreso, w.salutare] }
      - { es: "Conoscevo Marco da anni, ma ieri ho conosciuto sua moglie.", en: "I'd known Marco for years, but yesterday I met his wife.", grammar: [g.passato-prossimo-vs-imperfetto], vocab: [w.conoscere, w.moglie], note: "conoscevo = I knew; ho conosciuto = I met (for the first time)." }
      - { es: "Quando arrivo a casa, piove.", en: "When I get home, it's raining.", grammar: [g.passato-prossimo-vs-imperfetto], vocab: [w.arrivare], transform: { instruction: "Put it in the past", answer: "Quando sono arrivato a casa, pioveva.", alt: ["Quando sono arrivata a casa, pioveva."], en: "When I got home, it was raining." } }
    exchanges:
      - q: { es: "Perché non sei venuto alla festa?", en: "Why didn't you come to the party?" }
        a: { es: "Ero stanco e pioveva, così sono restato a casa.", en: "I was tired and it was raining, so I stayed at home." }
        alt: ["Ero stanco.", "Avevo mal di testa."]
        grammar: [g.passato-prossimo-vs-imperfetto]
        vocab: [w.restare]
      - q: { es: "Che tempo faceva a Siena?", en: "What was the weather like in Siena?" }
        a: { es: "Faceva bello, ma la sera è arrivata una tempesta.", en: "It was nice, but in the evening a storm came." }
        alt: ["Pioveva.", "Faceva caldissimo."]
        grammar: [g.passato-prossimo-vs-imperfetto]
        vocab: [w.tempesta]
      - q: { es: "Che cosa è stato quel rumore?", en: "What was that noise?" }
        a: { es: "Niente, è caduto un bicchiere.", en: "Nothing, a glass fell." }
        alt: ["Il gatto.", "Non lo so!"]
        grammar: [g.passato-prossimo-vs-imperfetto]
        vocab: [w.rumore]
      - q: { es: "Hai pianto alla fine del film?", en: "Did you cry at the end of the film?" }
        a: { es: "Sì, ma nessuno mi vedeva: era buio.", en: "Yes, but nobody could see me: it was dark." }
        alt: ["No, mai.", "Un po'."]
        grammar: [g.passato-prossimo-vs-imperfetto]
        vocab: [w.piangere]
      - q: { es: "Eri sorpresa?", en: "Were you surprised?" }
        a: { es: "Sì, non sapevo niente della festa!", en: "Yes, I didn't know anything about the party!" }
        alt: ["Molto.", "No, lo sapevo già."]
        grammar: [g.passato-prossimo-vs-imperfetto]
        vocab: [w.sorpreso]
    texts:
      - title: "Una notte a Siena"
        es: ["Era agosto e faceva caldo.", "La piazza era piena di luci e c'era la luna sopra la torre.", "All'improvviso il telefono è squillato: era mia madre!"]
        en: ["It was August and it was hot.", "The square was full of lights and the moon was above the tower.", "Suddenly the phone rang: it was my mother!"]
        grammar: [g.passato-prossimo-vs-imperfetto]
        vocab: [w.luce, w.luna, w.squillare]
      - title: "Il temporale"
        es: ["Stavamo bene in giardino, sotto le stelle.", "Poi è arrivata una tempesta terribile e la luce è sparita.", "Abbiamo cenato al buio: è stata la cena più bella dell'estate."]
        en: ["We were fine in the garden, under the stars.", "Then a terrible storm came and the power went.", "We had dinner in the dark: it was the best dinner of the summer."]
        grammar: [g.passato-prossimo-vs-imperfetto]
        vocab: [w.stella, w.tempesta, w.terribile, w.sparire]
    spicy:
      - { es: "C'erano mille stelle, ma io guardavo solo te.", en: "There were a thousand stars, but I was only looking at you.", altEs: ["C'erano mille stelle, ma guardavo solo te."], grammar: [g.imperfetto-uses, g.stressed-pronouns], vocab: [w.stella] }
      - { es: "Quando ti ho visto, pioveva. Ma io non ho sentito niente.", en: "When I saw you, it was raining. But I didn't feel a thing.", altEs: ["Quando ti ho vista, pioveva. Ma io non ho sentito niente."], grammar: [g.passato-prossimo-vs-imperfetto], vocab: [w.piovere] }
      - { es: "La luce è sparita e tu hai preso la mia mano. Per paura, naturalmente.", en: "The power went out and you took my hand. Out of fear, naturally.", grammar: [g.passato-prossimo-vs-imperfetto], vocab: [w.luce, w.sparire] }
      - { es: "Ero sorpreso: non sapevo che sapevi ballare così.", en: "I was surprised: I didn't know you could dance like that.", altEs: ["Ero sorpresa: non sapevo che sapevi ballare così."], grammar: [g.imperfetto-uses], vocab: [w.sorpreso, w.ballare] }
      - { es: "Il telefono è squillato alle due di notte. Eri tu. Non ho dormito più.", en: "The phone rang at two in the morning. It was you. I didn't sleep after that.", grammar: [g.passato-prossimo-vs-imperfetto], vocab: [w.squillare] }
  - id: a2.u04.l2
    title: Mentre il re dormiva
    teach: [g.mentre-quando]
    vocab: [w.principe, w.principessa, w.re, w.regina, w.castello, w.foresta, w.strega, w.mago, w.drago, w.cavaliere, w.coniglio, w.magico, w.trasformarsi, w.nascondersi, w.panforte]
    tip: "mentre + imperfetto for the background; the interruption is in the passato prossimo: Mentre dormivo, è squillato il telefono."
    sentences:
      - { es: "Mentre il re dormiva, la strega è entrata nel castello.", en: "While the king was sleeping, the witch came into the castle.", altEs: ["La strega è entrata nel castello mentre il re dormiva."], grammar: [g.mentre-quando], vocab: [w.re, w.strega, w.castello] }
      - { es: "Mentre la principessa cantava, il principe ascoltava dalla finestra.", en: "While the princess was singing, the prince was listening from the window.", altEs: ["Il principe ascoltava dalla finestra mentre la principessa cantava."], grammar: [g.mentre-quando], vocab: [w.principessa, w.principe] }
      - { es: "Quando il cavaliere è arrivato, il drago dormiva.", en: "When the knight arrived, the dragon was asleep.", altEs: ["Il drago dormiva quando il cavaliere è arrivato."], grammar: [g.mentre-quando], vocab: [w.cavaliere, w.drago] }
      - { es: "Mentre attraversavano la foresta, hanno visto un coniglio bianco.", en: "While they were crossing the forest, they saw a white rabbit.", altEs: ["Hanno visto un coniglio bianco mentre attraversavano la foresta."], grammar: [g.mentre-quando], vocab: [w.foresta, w.coniglio] }
      - { es: "Quando la regina ha visto il mago, si è nascosta dietro la porta.", en: "When the queen saw the wizard, she hid behind the door.", grammar: [g.mentre-quando, g.reflexive-passato-prossimo], vocab: [w.regina, w.mago, w.nascondersi] }
      - { es: "Il mago si è trasformato in un gatto nero.", en: "The wizard turned himself into a black cat.", altEs: ["Il mago è diventato un gatto nero."], grammar: [g.reflexive-passato-prossimo], vocab: [w.mago, w.trasformarsi] }
      - { es: "Era una notte magica: la piazza era piena di luci.", en: "It was a magical night: the square was full of lights.", grammar: [g.imperfetto-uses], vocab: [w.magico] }
      - { es: "Mentre facevo la doccia, è arrivato Luca.", en: "While I was having a shower, Luca arrived.", altEs: ["Luca è arrivato mentre facevo la doccia."], grammar: [g.mentre-quando], vocab: [w.doccia] }
      - { es: "Quando ho chiamato, non rispondeva nessuno.", en: "When I called, nobody answered.", altEs: ["Non rispondeva nessuno quando ho chiamato."], grammar: [g.mentre-quando], vocab: [w.chiamare, w.rispondere] }
      - { es: "Mentre io cucinavo, lui apparecchiava la tavola.", en: "While I was cooking, he was laying the table.", altEs: ["Io cucinavo mentre lui apparecchiava la tavola."], grammar: [g.mentre-quando], vocab: [w.cucinare, w.apparecchiare] }
      - { es: "Appena siamo arrivati a Siena, abbiamo comprato il panforte.", en: "As soon as we arrived in Siena, we bought some panforte.", altEs: ["Siamo arrivati a Siena e abbiamo comprato subito il panforte."], grammar: [g.mentre-quando], vocab: [w.appena, w.panforte] }
      - { es: "Mentre camminavo verso il Campo, ho incontrato un vecchio amico.", en: "While I was walking towards the Campo, I met an old friend.", altEs: ["Ho incontrato un vecchio amico mentre camminavo verso il Campo."], grammar: [g.mentre-quando], vocab: [w.camminare, w.incontrare], error: { wrong: "Mentre ho camminato verso il Campo, ho incontrato un vecchio amico.", explain: "mentre introduces the background action, so it takes the imperfetto: mentre camminavo.", grammar: g.mentre-quando } }
      - { es: "Mentre loro giocavano, noi leggevamo.", en: "While they were playing, we were reading.", altEs: ["Noi leggevamo mentre loro giocavano."], grammar: [g.mentre-quando], vocab: [w.giocare, w.leggere] }
      - { es: "Il re dorme. La strega entra.", en: "The king is sleeping. The witch comes in.", grammar: [g.mentre-quando], vocab: [w.re, w.strega], transform: { instruction: "Join with mentre, in the past", answer: "Mentre il re dormiva, la strega è entrata.", alt: ["La strega è entrata mentre il re dormiva."], en: "While the king was sleeping, the witch came in." } }
      - { es: "Leggo e lui cucina.", en: "I'm reading and he's cooking.", grammar: [g.mentre-quando], vocab: [w.leggere, w.cucinare], transform: { instruction: "Join with mentre, in the past", answer: "Mentre leggevo, lui cucinava.", alt: ["Io leggevo mentre lui cucinava.", "Mentre io leggevo, lui cucinava."], en: "While I was reading, he was cooking." } }
    exchanges:
      - q: { es: "Che cosa facevi quando ti ho chiamato?", en: "What were you doing when I called you?" }
        a: { es: "Guardavo un film sui draghi.", en: "I was watching a film about dragons." }
        alt: ["Dormivo.", "Facevo la doccia."]
        grammar: [g.mentre-quando]
        vocab: [w.drago]
      - q: { es: "Che cosa è successo mentre eri a Siena?", en: "What happened while you were in Siena?" }
        a: { es: "Mentre visitavo il Duomo, ho perso il portafoglio!", en: "While I was visiting the cathedral, I lost my wallet!" }
        alt: ["Niente di speciale.", "Ho conosciuto una persona interessante."]
        grammar: [g.mentre-quando]
        vocab: [w.perdere]
      - q: { es: "Dov'era il gatto quando è arrivato il cane?", en: "Where was the cat when the dog arrived?" }
        a: { es: "Si è nascosto sotto il letto.", en: "It hid under the bed." }
        alt: ["Sotto il letto.", "Dormiva sul divano."]
        grammar: [g.mentre-quando]
        vocab: [w.nascondersi]
      - q: { es: "Com'era il castello?", en: "What was the castle like?" }
        a: { es: "Era enorme e aveva quattro torri.", en: "It was huge and it had four towers." }
        alt: ["Era vecchio e buio.", "Era magico!"]
        grammar: [g.imperfetto-uses]
        vocab: [w.castello, w.torre]
      - q: { es: "Che cosa avete comprato a Siena?", en: "What did you buy in Siena?" }
        a: { es: "Appena siamo arrivati, abbiamo comprato il panforte.", en: "As soon as we arrived, we bought panforte." }
        alt: ["Il panforte.", "Niente."]
        grammar: [g.mentre-quando]
        vocab: [w.panforte]
    texts:
      - title: "Una fiaba"
        es: ["C'era una volta un re che viveva in un castello nella foresta.", "Mentre il re dormiva, una strega ha trasformato sua figlia in un coniglio.", "Quando il re si è svegliato, la principessa non c'era più."]
        en: ["Once upon a time there was a king who lived in a castle in the forest.", "While the king was sleeping, a witch turned his daughter into a rabbit.", "When the king woke up, the princess was gone."]
        grammar: [g.mentre-quando, g.passato-prossimo-vs-imperfetto]
        vocab: [w.re, w.castello, w.foresta, w.strega, w.coniglio, w.principessa]
      - title: "Messaggio"
        es: ["Scusa, non ho risposto: mentre guidavo, il cellulare è caduto sotto il sedile.", "Quando sono arrivato a casa, l'ho trovato.", "Ti chiamo dopo cena!"]
        en: ["Sorry I didn't answer: while I was driving, my phone fell under the seat.", "When I got home, I found it.", "I'll call you after dinner!"]
        grammar: [g.mentre-quando]
        vocab: [w.guidare, w.cadere]
    spicy:
      - { es: "Mentre tutti ballavano, noi parlavamo sul balcone. Che fortuna!", en: "While everyone was dancing, we were talking on the balcony. How lucky!", grammar: [g.mentre-quando], vocab: [w.balcone, w.fortuna] }
      - { es: "Non sei un principe azzurro, ma hai una macchina e sai cucinare. Mi basta.", en: "You're not Prince Charming, but you've got a car and you can cook. That's enough for me.", altEs: ["Non sei una principessa, ma hai una macchina e sai cucinare. Mi basta."], grammar: [g.avere-present], vocab: [w.principe, w.bastare] }
      - { es: "Quando sei entrato, io mi sono nascosta dietro il menù. Troppo bello.", en: "When you came in, I hid behind the menu. Too handsome.", altEs: ["Quando sei entrata, io mi sono nascosto dietro il menù. Troppo bella."], grammar: [g.mentre-quando, g.reflexive-passato-prossimo], vocab: [w.nascondersi] }
      - { es: "Ho baciato un ranocchio, ma non si è trasformato. Proviamo con te?", en: "I kissed a frog, but he didn't turn into anything. Shall we try with you?", grammar: [g.reflexive-passato-prossimo], vocab: [w.trasformarsi, w.baciare] }
      - { es: "Era una sera magica: mentre parlavi, ho dimenticato il mio nome.", en: "It was a magical evening: while you were talking, I forgot my own name.", grammar: [g.mentre-quando], vocab: [w.magico] }
  - id: a2.u04.l3
    title: C'era una volta un pezzo di legno
    teach: [g.narrative-connectors]
    vocab: [w.un-giorno, w.allimprovviso, w.improvvisamente, w.a-un-certo-punto, w.alla-fine, w.infine, w.dunque, w.così, w.insomma, w.nel-frattempo, w.burattino, w.falegname, w.bugia, w.fata, w.racconto, w.personaggio, w.grillo]
    tip: "Start (un giorno, all'inizio), go on (poi, dopo), surprise (all'improvviso, a un certo punto), finish (alla fine, infine). Finalmente = at long last."
    sentences:
      - { es: "C'era una volta un pezzo di legno.", en: "Once upon a time there was a piece of wood.", grammar: [g.narrative-connectors, g.imperfetto-uses], vocab: [w.cera-una-volta, w.legno, w.pezzo], note: "The famous first line of Collodi's Pinocchio (1883)." }
      - { es: "Un giorno un falegname ha trovato un pezzo di legno che parlava.", en: "One day a carpenter found a piece of wood that could talk.", altEs: ["Un giorno un falegname ha trovato un pezzo di legno parlante."], grammar: [g.narrative-connectors, g.passato-prossimo-vs-imperfetto], vocab: [w.un-giorno, w.falegname] }
      - { es: "Geppetto ha fatto un burattino e l'ha chiamato Pinocchio.", en: "Geppetto made a puppet and called it Pinocchio.", grammar: [g.narrative-connectors, g.pronoun-participle-agreement], vocab: [w.burattino] }
      - { es: "Ogni volta che diceva una bugia, il naso di Pinocchio diventava più lungo.", en: "Every time he told a lie, Pinocchio's nose got longer.", altEs: ["Quando diceva una bugia, il naso di Pinocchio diventava più lungo."], grammar: [g.imperfetto-uses], vocab: [w.bugia, w.naso] }
      - { es: "All'improvviso è apparsa una fata con i capelli blu.", en: "Suddenly a fairy with blue hair appeared.", altEs: ["Improvvisamente è apparsa una fata con i capelli blu."], grammar: [g.narrative-connectors], vocab: [w.allimprovviso, w.fata] }
      - { es: "Improvvisamente la luce si è spenta.", en: "Suddenly the light went out.", altEs: ["All'improvviso la luce si è spenta.", "All'improvviso si è spenta la luce."], grammar: [g.narrative-connectors], vocab: [w.improvvisamente, w.luce] }
      - { es: "A un certo punto abbiamo perso la strada.", en: "At one point we lost our way.", altEs: ["A un certo punto ci siamo persi."], grammar: [g.narrative-connectors], vocab: [w.a-un-certo-punto, w.strada] }
      - { es: "Alla fine Pinocchio è diventato un bambino vero.", en: "In the end Pinocchio became a real boy.", altEs: ["Pinocchio alla fine è diventato un bambino vero."], grammar: [g.narrative-connectors], vocab: [w.alla-fine, w.diventare] }
      - { es: "Prima abbiamo visitato il Campo, poi abbiamo pranzato e infine siamo saliti sulla torre.", en: "First we visited the Campo, then we had lunch and finally we went up the tower.", grammar: [g.narrative-connectors], vocab: [w.infine, w.pranzare] }
      - { es: "Prima visitiamo il Campo, poi pranziamo.", en: "First we visit the Campo, then we have lunch.", grammar: [g.narrative-connectors], vocab: [w.pranzare], transform: { instruction: "Put it in the past", answer: "Prima abbiamo visitato il Campo, poi abbiamo pranzato.", en: "First we visited the Campo, then we had lunch." } }
      - { es: "Pioveva forte, dunque siamo restati in albergo.", en: "It was raining hard, so we stayed in the hotel.", altEs: ["Pioveva forte, quindi siamo restati in albergo."], grammar: [g.narrative-connectors], vocab: [w.dunque, w.albergo], transform: { instruction: "Change to 'I' (you are a woman)", answer: "Pioveva forte, dunque sono restata in albergo.", alt: ["Pioveva forte, quindi sono restata in albergo.", "Pioveva forte, dunque sono rimasta in albergo."], en: "It was raining hard, so I stayed in the hotel." } }
      - { es: "Era tardi e così abbiamo preso un taxi.", en: "It was late and so we took a taxi.", altEs: ["Era tardi, così abbiamo preso un taxi."], grammar: [g.narrative-connectors], vocab: [w.così, w.taxi] }
      - { es: "Insomma, è stata una giornata perfetta.", en: "All in all, it was a perfect day.", altEs: ["Insomma, una giornata perfetta."], grammar: [g.narrative-connectors], vocab: [w.insomma, w.perfetto] }
      - { es: "Nel frattempo Marco preparava la cena.", en: "In the meantime Marco was making dinner.", altEs: ["Marco nel frattempo preparava la cena."], grammar: [g.narrative-connectors, g.imperfetto-uses], vocab: [w.nel-frattempo] }
      - { es: "Il mio personaggio preferito è il Grillo Parlante.", en: "My favourite character is the Talking Cricket.", grammar: [g.essere-present], vocab: [w.personaggio, w.grillo] }
      - { es: "C'era una volta un re.", en: "Once upon a time there was a king.", grammar: [g.narrative-connectors], vocab: [w.re], error: { wrong: "C'è stato una volta un re.", explain: "Fairy tales open with the imperfetto: C'era una volta…", grammar: g.narrative-connectors } }
    exchanges:
      - q: { es: "Com'è finita la storia?", en: "How did the story end?" }
        a: { es: "Alla fine il burattino è diventato un bambino vero.", en: "In the end the puppet became a real boy." }
        alt: ["È finita bene.", "Alla fine si sono sposati."]
        grammar: [g.narrative-connectors]
        vocab: [w.alla-fine, w.burattino]
      - q: { es: "E poi che cosa è successo?", en: "And then what happened?" }
        a: { es: "All'improvviso è arrivata la fata e ha salvato tutti.", en: "Suddenly the fairy arrived and saved everyone." }
        alt: ["Niente.", "A un certo punto è andata via la luce."]
        grammar: [g.narrative-connectors]
        vocab: [w.allimprovviso, w.fata]
      - q: { es: "Chi ha scritto Pinocchio?", en: "Who wrote Pinocchio?" }
        a: { es: "Carlo Collodi, uno scrittore fiorentino.", en: "Carlo Collodi, a Florentine writer." }
        alt: ["Collodi.", "Un fiorentino, Collodi."]
        grammar: [g.passato-prossimo-avere]
        vocab: [w.fiorentino]
      - q: { es: "Com'è andata la gita a Siena?", en: "How did the trip to Siena go?" }
        a: { es: "Insomma... è piovuto tutto il giorno, ma abbiamo mangiato benissimo.", en: "So-so... it rained all day, but we ate really well." }
        alt: ["Benissimo!", "Insomma."]
        grammar: [g.narrative-connectors]
        vocab: [w.insomma]
      - q: { es: "Che cosa faceva Luca nel frattempo?", en: "What was Luca doing in the meantime?" }
        a: { es: "Nel frattempo dormiva sul divano!", en: "In the meantime he was asleep on the sofa!" }
        alt: ["Cucinava.", "Guardava la partita."]
        grammar: [g.narrative-connectors]
        vocab: [w.nel-frattempo]
    texts:
      - title: "Pinocchio in breve"
        es: ["Un giorno Geppetto, un povero falegname, ha fatto un burattino di legno.", "Pinocchio diceva tante bugie e il suo naso cresceva.", "Alla fine, grazie alla Fata Turchina, è diventato un bambino vero."]
        en: ["One day Geppetto, a poor carpenter, made a wooden puppet.", "Pinocchio told lots of lies and his nose grew.", "In the end, thanks to the Blue Fairy, he became a real boy."]
        grammar: [g.narrative-connectors, g.passato-prossimo-vs-imperfetto]
        vocab: [w.un-giorno, w.falegname, w.burattino, w.bugia, w.alla-fine]
      - title: "La nostra giornata"
        es: ["Prima siamo andati al parco di Pinocchio a Collodi.", "A un certo punto si è messo a piovere, dunque siamo entrati in un bar.", "Infine siamo tornati a Firenze in treno: insomma, una bella giornata!"]
        en: ["First we went to the Pinocchio park in Collodi.", "At one point it started to rain, so we went into a café.", "Finally we went back to Florence by train: all in all, a lovely day!"]
        grammar: [g.narrative-connectors]
        vocab: [w.a-un-certo-punto, w.dunque, w.infine, w.insomma]
    spicy:
      - { es: "Un giorno ti ho visto al mercato. All'improvviso avevo bisogno di tanta frutta.", en: "One day I saw you at the market. Suddenly I needed a lot of fruit.", altEs: ["Un giorno ti ho vista al mercato. All'improvviso avevo bisogno di tanta frutta."], grammar: [g.narrative-connectors, g.passato-prossimo-vs-imperfetto], vocab: [w.un-giorno, w.allimprovviso] }
      - { es: "Non dico bugie: il mio naso è sempre lo stesso, e tu sei bellissima.", en: "I don't tell lies: my nose is still the same, and you're gorgeous.", altEs: ["Non dico bugie: il mio naso è sempre lo stesso, e tu sei bellissimo."], grammar: [g.narrative-connectors], vocab: [w.bugia, w.naso] }
      - { es: "Alla fine della serata mi hai dato il tuo numero. Finalmente!", en: "At the end of the evening you gave me your number. At last!", grammar: [g.narrative-connectors], vocab: [w.alla-fine, w.finalmente] }
      - { es: "Insomma, ti piaccio o no? Dimmelo prima del dolce.", en: "So, do you like me or not? Tell me before dessert.", grammar: [g.narrative-connectors, g.piacere-intro], vocab: [w.insomma] }
      - { es: "A un certo punto hai smesso di parlare e mi hai guardato. Che silenzio!", en: "At one point you stopped talking and looked at me. What a silence!", altEs: ["A un certo punto hai smesso di parlare e mi hai guardata. Che silenzio!"], grammar: [g.narrative-connectors], vocab: [w.a-un-certo-punto, w.silenzio] }
  - id: a2.u04.l4
    title: Stavo uscendo quando...
    teach: [g.stare-gerundio-past]
    vocab: [w.gridare, w.urlare, w.salvare, w.uccidere, w.combattere, w.eroe, w.mostro, w.nemico, w.povero, w.ricco, w.coraggioso, w.furbo, w.campanello]
    tip: "stavo, stavi, stava… + gerund (-ando, -endo): what was in progress at that moment. Stavo uscendo quando hai chiamato."
    sentences:
      - { es: "Che cosa stavi facendo alle otto?", en: "What were you doing at eight?", altEs: ["Cosa stavi facendo alle otto?", "Che stavi facendo alle otto?"], grammar: [g.stare-gerundio-past], vocab: [w.fare] }
      - { es: "Stavamo cenando quando ha suonato il campanello.", en: "We were having dinner when the doorbell rang.", altEs: ["Quando ha suonato il campanello, stavamo cenando."], grammar: [g.stare-gerundio-past, g.mentre-quando], vocab: [w.cenare, w.campanello] }
      - { es: "Scusa, stavo dormendo!", en: "Sorry, I was asleep!", altEs: ["Scusami, stavo dormendo!"], grammar: [g.stare-gerundio-past], vocab: [w.dormire] }
      - { es: "Stavano parlando di te quando sei entrato.", en: "They were talking about you when you came in.", altEs: ["Quando sei entrato stavano parlando di te.", "Stavano parlando di te quando sei entrata."], grammar: [g.stare-gerundio-past, g.stressed-pronouns], vocab: [w.parlare] }
      - { es: "La gente stava gridando e i fantini urlavano.", en: "People were shouting and the jockeys were yelling.", altEs: ["La gente gridava e i fantini urlavano."], grammar: [g.stare-gerundio-past], vocab: [w.gridare, w.urlare, w.fantino] }
      - { es: "Il cavaliere stava combattendo contro il mostro quando è arrivata la fata.", en: "The knight was fighting the monster when the fairy arrived.", grammar: [g.stare-gerundio-past, g.mentre-quando], vocab: [w.combattere, w.mostro] }
      - { es: "L'eroe ha salvato la principessa all'ultimo momento.", en: "The hero saved the princess at the last moment.", grammar: [g.passato-prossimo-avere], vocab: [w.eroe, w.salvare] }
      - { es: "Nella fiaba il principe ha ucciso il drago, ma il drago era buono!", en: "In the fairy tale the prince killed the dragon, but the dragon was good!", grammar: [g.passato-prossimo-vs-imperfetto], vocab: [w.uccidere, w.drago] }
      - { es: "Il re era ricco, ma la gente del paese era povera.", en: "The king was rich, but the people of the town were poor.", grammar: [g.imperfetto-uses], vocab: [w.ricco, w.povero] }
      - { es: "Il nemico stava arrivando e tutti si nascondevano.", en: "The enemy was coming and everyone was hiding.", grammar: [g.stare-gerundio-past], vocab: [w.nemico, w.nascondersi] }
      - { es: "Il gatto era furbo: stava aspettando il momento perfetto.", en: "The cat was cunning: it was waiting for the perfect moment.", grammar: [g.stare-gerundio-past], vocab: [w.furbo, w.aspettare] }
      - { es: "Era una ragazza coraggiosa: non aveva paura di niente.", en: "She was a brave girl: she wasn't afraid of anything.", altEs: ["Era un ragazzo coraggioso: non aveva paura di niente."], grammar: [g.imperfetto-uses], vocab: [w.coraggioso] }
      - { es: "Stava piovendo, così siamo restati dentro.", en: "It was raining, so we stayed in.", altEs: ["Pioveva, così siamo restati dentro.", "Stava piovendo, così siamo rimasti dentro."], grammar: [g.stare-gerundio-past], vocab: [w.piovere, w.dentro] }
      - { es: "Stavo mangiando quando hai chiamato.", en: "I was eating when you called.", altEs: ["Mangiavo quando hai chiamato."], grammar: [g.stare-gerundio-past], vocab: [w.mangiare], error: { wrong: "Sono stato mangiando quando hai chiamato.", explain: "The past progressive uses the imperfetto of stare: stavo mangiando.", grammar: g.stare-gerundio-past } }
      - { es: "Stiamo cenando.", en: "We're having dinner.", grammar: [g.stare-gerundio-past], vocab: [w.cenare], transform: { instruction: "Put it in the past: 'when you called'", answer: "Stavamo cenando quando hai chiamato.", alt: ["Quando hai chiamato stavamo cenando."], en: "We were having dinner when you called." } }
      - { es: "Cucinavo quando sei arrivato.", en: "I was cooking when you arrived.", altEs: ["Cucinavo quando sei arrivata."], grammar: [g.stare-gerundio-past], vocab: [w.cucinare], transform: { instruction: "Use stare + gerund", answer: "Stavo cucinando quando sei arrivato.", alt: ["Stavo cucinando quando sei arrivata."], en: "I was cooking when you arrived." } }
    exchanges:
      - q: { es: "Perché non hai risposto?", en: "Why didn't you answer?" }
        a: { es: "Stavo guidando.", en: "I was driving." }
        alt: ["Stavo dormendo.", "Stavo facendo la doccia."]
        grammar: [g.stare-gerundio-past]
        vocab: [w.guidare]
      - q: { es: "Che cosa stavate facendo quando è andata via la luce?", en: "What were you doing when the power went off?" }
        a: { es: "Stavamo guardando un film dell'orrore!", en: "We were watching a horror film!" }
        alt: ["Stavamo cenando.", "Stavamo dormendo."]
        grammar: [g.stare-gerundio-past]
        vocab: [w.luce]
      - q: { es: "Chi stava urlando?", en: "Who was screaming?" }
        a: { es: "Mio fratello: ha visto un ragno.", en: "My brother: he saw a spider." }
        alt: ["Nessuno.", "I vicini."]
        grammar: [g.stare-gerundio-past]
        vocab: [w.urlare]
      - q: { es: "Com'era l'eroe della storia?", en: "What was the hero of the story like?" }
        a: { es: "Era povero ma coraggioso e molto furbo.", en: "He was poor but brave and very clever." }
        alt: ["Era coraggioso.", "Era ricco e un po' stupido."]
        grammar: [g.imperfetto-uses]
        vocab: [w.eroe, w.povero, w.coraggioso, w.furbo]
      - q: { es: "Dove stavi andando così di corsa?", en: "Where were you going in such a hurry?" }
        a: { es: "Stavo andando alla stazione: il treno partiva alle sei.", en: "I was going to the station: the train was leaving at six." }
        alt: ["Al lavoro.", "A casa."]
        grammar: [g.stare-gerundio-past]
        vocab: [w.stazione]
    texts:
      - title: "Una sera strana"
        es: ["Stavo leggendo sul divano quando ha suonato il campanello.", "Ho aperto la porta, ma non c'era nessuno.", "Nel frattempo il mio gatto stava mangiando la mia cena!"]
        en: ["I was reading on the sofa when the doorbell rang.", "I opened the door, but there was nobody there.", "Meanwhile my cat was eating my dinner!"]
        grammar: [g.stare-gerundio-past, g.narrative-connectors]
        vocab: [w.campanello, w.nel-frattempo]
      - title: "La leggenda del drago"
        es: ["Un drago stava distruggendo il paese.", "Un cavaliere povero ma coraggioso lo ha combattuto per tre giorni.", "Alla fine ha salvato il paese e ha sposato la figlia del re."]
        en: ["A dragon was destroying the village.", "A poor but brave knight fought it for three days.", "In the end he saved the village and married the king's daughter."]
        grammar: [g.stare-gerundio-past, g.narrative-connectors]
        vocab: [w.drago, w.combattere, w.salvare, w.povero, w.coraggioso]
    spicy:
      - { es: "Stavo pensando a te... e il caffè è diventato freddo.", en: "I was thinking about you... and the coffee went cold.", grammar: [g.stare-gerundio-past], vocab: [w.pensare] }
      - { es: "Mi stavi guardando? No? Allora stavo guardando io te.", en: "Were you looking at me? No? Then I was the one looking at you.", grammar: [g.stare-gerundio-past, g.stressed-pronouns], vocab: [w.guardare] }
      - { es: "Sei il mio eroe: hai salvato la serata con una pizza.", en: "You're my hero: you saved the evening with a pizza.", grammar: [g.passato-prossimo-avere], vocab: [w.eroe, w.salvare] }
      - { es: "Non sono ricco, ma sono furbo: ho prenotato il tavolo con la vista migliore.", en: "I'm not rich, but I'm clever: I booked the table with the best view.", altEs: ["Non sono ricca, ma sono furba: ho prenotato il tavolo con la vista migliore."], grammar: [g.passato-prossimo-avere], vocab: [w.ricco, w.furbo] }
      - { es: "Stavo uscendo con le amiche, ma poi hai chiamato tu. Le amiche possono aspettare.", en: "I was going out with my friends, but then you called. My friends can wait.", altEs: ["Stavo uscendo con gli amici, ma poi hai chiamato tu. Gli amici possono aspettare."], grammar: [g.stare-gerundio-past], vocab: [w.uscire] }
dialogues:
  - id: a2.u04.d1
    title: Il Palio del nonno
    context: In Piazza del Campo, Nonno Beppe tells his grandson Tommaso about his first Palio.
    lines:
      - { speaker: Tommaso, es: "Nonno, raccontami del tuo primo Palio!", en: "Grandpa, tell me about your first Palio!" }
      - { speaker: Nonno Beppe, es: "Era il 16 agosto, faceva un caldo terribile e la piazza era piena di gente.", en: "It was 16 August, it was terribly hot and the square was full of people." }
      - { speaker: Tommaso, es: "E tu dov'eri?", en: "And where were you?" }
      - { speaker: Nonno Beppe, es: "Ero in mezzo alla piazza con mio padre. Avevo dodici anni.", en: "I was in the middle of the square with my father. I was twelve." }
      - { speaker: Tommaso, es: "Che cosa è successo?", en: "What happened?" }
      - { speaker: Nonno Beppe, es: "Mentre i cavalli stavano correndo, il fantino della nostra contrada è caduto.", en: "While the horses were running, our district's jockey fell." }
      - { speaker: Tommaso, es: "Oh no! E poi?", en: "Oh no! And then?" }
      - { speaker: Nonno Beppe, es: "Il cavallo ha continuato a correre da solo e... alla fine ha vinto!", en: "The horse kept running on its own and... in the end it won!" }
      - { speaker: Tommaso, es: "Davvero? Un cavallo senza fantino può vincere?", en: "Really? A horse without a jockey can win?" }
      - { speaker: Nonno Beppe, es: "Sì, al Palio vince il cavallo, non il fantino. Quella sera abbiamo fatto festa fino all'alba.", en: "Yes, at the Palio the horse wins, not the jockey. That night we partied until dawn." }
    questions:
      - { q: "Quanti anni aveva il nonno al suo primo Palio?", options: ["Dieci", "Dodici", "Sedici"], answer: 1, explain: "Avevo dodici anni." }
      - { q: "Che tempo faceva?", options: ["Pioveva", "Faceva molto caldo", "C'era una tempesta"], answer: 1, explain: "Faceva un caldo terribile." }
      - { q: "Che cosa è successo durante la corsa?", options: ["Un cavallo è scappato", "Il fantino è caduto", "Il nonno è caduto"], answer: 1, explain: "Il fantino della nostra contrada è caduto." }
      - { q: "Chi ha vinto il Palio?", options: ["Il cavallo senza fantino", "Un'altra contrada", "Nessuno"], answer: 0, explain: "At the Palio the horse wins, even without its jockey (cavallo scosso)." }
writing:
  - task: "Tell an anecdote about something unexpected that happened at the Palio in Siena (or another event): set the scene with the imperfetto, then tell what happened with the passato prossimo."
    min: 35
    max: 70
    use: [w.allimprovviso, w.rumore, w.sorpreso, w.alla-fine, w.vincere]
    grammar: [g.passato-prossimo-vs-imperfetto, g.narrative-connectors]
    expect:
      - { pattern: "\\b\\S+(avo|evo|ivo|ava|eva|iva|avano|evano|ivano)\\b|\\b(ero|era|erano)\\b|c['’]era", hint: "Set the scene with the imperfetto: faceva caldo, c'era tanta gente…" }
      - { pattern: "\\b(ho|ha|abbiamo|hanno|sono|siamo)\\s+(\\S+\\s+)?\\S+(at|ut|it|s|tt)[oaie]\\b|(è)\\s+\\S+(at|ut|it)[oa]\\b", hint: "Tell the events with the passato prossimo: ho sentito, sono partiti…" }
      - { pattern: "all['’]improvviso|improvvisamente|a un certo punto|un giorno|alla fine", hint: "Use a narrative connector: all'improvviso, alla fine…" }
    model: { es: "L'estate scorsa ero a Siena per il Palio. Faceva molto caldo e la piazza era piena di gente. All'improvviso ho sentito un rumore forte: i cavalli sono partiti! Ero così sorpreso che ho perso il cappello. Alla fine ha vinto la contrada dell'Oca.", en: "Last summer I was in Siena for the Palio. It was very hot and the square was full of people. Suddenly I heard a loud noise: the horses had set off! I was so surprised that I lost my hat. In the end the Goose district won." }
  - task: "Write 3–4 sentences about an evening when several things happened at once: say what you were doing (stavo + gerund, mentre…) when something happened."
    min: 30
    max: 65
    use: [w.mentre, w.squillare, w.campanello, w.cucinare]
    grammar: [g.mentre-quando, g.stare-gerundio-past]
    expect:
      - { pattern: "\\b(stavo|stavi|stava|stavamo|stavate|stavano)\\s+\\S+(ando|endo)\\b", hint: "Use stavo + gerund: stavo cucinando quando…" }
      - { pattern: "\\bmentre\\b", hint: "Use mentre for the background action: mentre parlavo…" }
    model: { es: "Ieri sera stavo cucinando quando è squillato il telefono. Era mia madre. Mentre parlavamo, ha suonato il campanello: era il mio vicino. E mentre io aprivo la porta, il cane ha mangiato la mia cena!", en: "Last night I was cooking when the phone rang. It was my mother. While we were talking, the doorbell rang: it was my neighbour. And while I was opening the door, the dog ate my dinner!" }
  - task: "Write the beginning of a fairy tale set near Siena: start with C'era una volta…, introduce the characters and the place, then tell what happened one day."
    min: 35
    max: 70
    use: [w.re, w.principessa, w.castello, w.strega, w.un-giorno]
    grammar: [g.narrative-connectors, g.passato-prossimo-vs-imperfetto]
    expect:
      - { pattern: "c['’]era una volta", hint: "Start the classic way: C'era una volta…" }
      - { pattern: "\\bun giorno\\b|all['’]improvviso|improvvisamente|a un certo punto", hint: "Move to the events: Un giorno…, All'improvviso…" }
    model: { es: "C'era una volta un re molto ricco che abitava in un grande castello vicino a Siena. Aveva una figlia, una principessa bella e coraggiosa. Un giorno una strega cattiva è arrivata al castello e ha trasformato il re in un coniglio! Allora la principessa è partita per cercare un mago.", en: "Once upon a time there was a very rich king who lived in a big castle near Siena. He had a daughter, a beautiful and brave princess. One day a wicked witch arrived at the castle and turned the king into a rabbit! So the princess set off to look for a wizard." }
  - task: "Write a short news report for a local paper about yesterday's Palio: the atmosphere and the weather (imperfetto) and what happened in the race (passato prossimo)."
    min: 35
    max: 70
    use: [w.contrada, w.fantino, w.corsa, w.gridare, w.vincere]
    grammar: [g.passato-prossimo-vs-imperfetto]
    expect:
      - { pattern: "\\b\\S+(ava|eva|iva|avano|evano|ivano)\\b|\\b(era|erano)\\b|c['’]era|c['’]erano", hint: "Describe the atmosphere with the imperfetto: c'erano…, faceva caldo…" }
      - { pattern: "\\b(ha|hanno|è|sono)\\s+(\\S+\\s+)?\\S+(at|ut|it|t)[oaie]\\b", hint: "Report the events with the passato prossimo: ha vinto, è finita…" }
    model: { es: "Ieri pomeriggio in Piazza del Campo c'era tanta gente. Il cielo era sereno e faceva caldo. La corsa è finita dopo solo novanta secondi: ha vinto la contrada della Torre, con il fantino Marco Rossi. Alla fine tutti gridavano e cantavano per le strade.", en: "Yesterday afternoon in Piazza del Campo there were lots of people. The sky was clear and it was hot. The race was over after only ninety seconds: the Tower district won, with the jockey Marco Rossi. At the end everyone was shouting and singing in the streets." }
