writing:
  prompt: "A French-language cultural magazine has asked you for an essay of at least 250 words with the title « Existe-t-il un bon français ? ». Argue your position with precision and nuance: contrast at least two varieties of French (France, Belgium, Switzerland, Québec, Africa…) and two registers; include a reference to a classical or literary author; use at least two figures of style (question rhétorique, antithèse, chiasme, anaphore, rythme ternaire…) and at least one literary or formal structure (inversion, subjonctif imparfait, ne littéraire); finish with a conclusion that addresses the reader."
  minWords: 250
  modelAnswer: |
    Existe-t-il un bon français ? La question semble simple ; elle cache pourtant un piège. Elle suppose qu'il y aurait une seule manière correcte de parler, et que toutes les autres ne seraient que des erreurs avec un accent.

    Qu'un Bruxellois dise « septante », qu'une Lausannoise passe la « panosse », qu'un Montréalais vous invite à « souper », lequel d'entre eux se trompe ? Aucun. Ce qui change, ce n'est pas la correction, c'est la géographie. Le français est une langue aux mille capitales et sans propriétaire, et c'est là, loin d'être une faiblesse, sa plus grande richesse. Molière lui-même n'écrivait pas comme nous : chez lui, on ne « veut pas lui écrire », on « lui veut écrire », et personne n'oserait aujourd'hui l'accuser de mal parler.

    Faut-il pour autant renoncer à toute norme ? Certainement pas. Un rapport scientifique n'obéit pas aux mêmes règles qu'une conversation entre amis, et celui qui écrit « c'est trop ouf » dans une lettre de motivation commet une faute, non de grammaire, mais de registre. Le bon français n'est donc pas une variété contre les autres : c'est la capacité de choisir la bonne variété au bon moment. Parler bien, c'est parler juste ; parler juste, c'est savoir à qui l'on parle.

    Rares sont, il est vrai, ceux qui maîtrisent tous les registres. Mais encore faudrait-il que l'école cesse d'opposer le « vrai » français aux autres, et qu'elle apprenne aux élèves à les reconnaître plutôt qu'à les mépriser.

    Alors, cher lecteur, la prochaine fois que vous entendrez un mot qui vous surprend, ne demandez pas s'il est correct. Demandez plutôt d'où il vient : vous découvrirez qu'il vous parle, lui aussi, de la même langue.
  checklist:
    - "I contrasted at least two varieties of French with accurate examples (septante, souper, panosse, essencerie…)."
    - "I distinguished at least two registers and explained why register matters."
    - "I referred to a classical or literary author accurately."
    - "I used at least two figures of style (question rhétorique, chiasme, anaphore, antithèse, rythme ternaire)."
    - "I used at least one literary or formal structure (Rares sont…, encore faudrait-il que…, inversion, subjonctif imparfait, ne littéraire)."
    - "My essay has a clear thesis, nuanced argumentation and a conclusion that addresses the reader."
