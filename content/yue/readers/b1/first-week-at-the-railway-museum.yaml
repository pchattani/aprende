id: r.b1.first-week-at-the-railway-museum
level: b1
title: 返工第一個禮拜
kind: text
intro: Ka-chun has just started a new job as an assistant at the Hong Kong Railway Museum in Tai Po. He writes an email to his old colleague Karen about his first week - the new boss, the old station and the visitors.
allow: [家俊, 黃經理]
paragraphs:
  - { es: "Karen：你好！好耐冇聯絡，你最近點呀？我喺新公司返咗一個禮拜工喇，想同你講吓我嘅新工作。你都知，我以前喺寫字樓做文員，日日對住電腦處理文件，做到好悶。所以上個月我辭咗職，搵到一份喺大埔香港鐵路博物館嘅工作，做助理。", en: "Karen, hello! We haven't been in touch for ages, how are you? I've been at my new job for a week now and wanted to tell you about it. As you know, I used to be an office clerk, sitting at a computer handling documents all day, and I was bored to death. So last month I resigned and found a job as an assistant at the Hong Kong Railway Museum in Tai Po." }
  - { es: "鐵路博物館本身就係大埔墟嘅舊火車站，喺一九一三年建成，係一座好靚嘅中式建築。入面有幾卡舊火車同一架舊蒸汽火車頭，好多細路一嚟到就即刻爬上去影相。我第一日返工，企喺月台上面，覺得自己好似返咗一百年前噉。", en: "The railway museum is itself the old Tai Po Market railway station. It was built in 1913 and is a beautiful Chinese-style building. Inside there are several old carriages and an old steam locomotive, and lots of children climb up to take photos as soon as they arrive. On my first day at work, standing on the platform, I felt as if I had gone back a hundred years." }
  - { es: "我嘅上司叫黃經理，佢喺博物館做咗二十年，對香港鐵路嘅歷史熟到不得了。佢第一日就帶我行晒成個博物館，解釋每一卡車廂嘅故事。例如有一卡係以前嘅頭等車廂，入面有梳化同枱，同而家嘅地鐵完全唔同。佢講嘢好有耐性，我問咗好多蠢問題，佢都冇嬲。", en: "My boss is Mr Wong. He has worked at the museum for twenty years and knows the history of Hong Kong's railways inside out. On the first day he took me all around the museum, explaining the story of every carriage. For example, one was an old first-class carriage, with sofas and tables inside, completely different from today's MTR. He's very patient when he talks; I asked lots of silly questions and he never got annoyed." }
  - { es: "我嘅工作包括招呼遊客、回答佢哋嘅問題、安排學校參觀，同埋每日檢查啲展品有冇損壞。星期三有一間小學帶咗六十個學生嚟參觀，我負責同佢哋講解。我好緊張，講到一半唔記得咗一個年份，好彩有個細路舉手話：「哥哥，係一九一三年呀！」全班同學都笑晒。", en: "My job includes looking after visitors, answering their questions, arranging school visits and checking every day whether any of the exhibits are damaged. On Wednesday a primary school brought sixty pupils to visit, and I was in charge of giving them the talk. I was very nervous, and halfway through I forgot a date. Luckily a child put up his hand and said: \"It's 1913, mister!\" The whole class burst out laughing." }
  - { es: "同以前份工比較，呢度人工低咗少少，而且星期六日都要返工，平日先可以放假。不過我覺得好值得。以前我返工係為咗出糧，而家我真係覺得自己做緊一啲有意思嘅嘢。每次見到啲遊客好開心噉離開，我都好有滿足感。", en: "Compared with my old job, the pay here is a bit lower, and I have to work on Saturdays and Sundays and can only take days off during the week. But I think it's well worth it. Before, I went to work just for the pay cheque; now I really feel I'm doing something meaningful. Every time I see visitors leaving happily, I feel very satisfied." }
  - { es: "唯一唔習慣嘅係交通。我住喺觀塘，每日要坐差唔多一個鐘車先到大埔。黃經理話大埔有好多平嘅屋出租，叫我考慮搬過嚟。我諗緊，因為大埔環境好好，附近仲有大埔海濱公園同好多好食嘅嘢。", en: "The only thing I'm not used to is the commute. I live in Kwun Tong, and every day I have to travel almost an hour to get to Tai Po. Mr Wong says there are lots of cheap flats for rent in Tai Po and suggested I think about moving. I'm considering it, because Tai Po is a lovely area, with Tai Po Waterfront Park nearby and lots of good food." }
  - { es: "你呢？公司有冇變化？仲係成日加班？如果你得閒，不如嚟大埔搵我，我帶你免費參觀博物館，之後去大埔墟街市食嘢。我知道有間牛腩麵好正，你一定鍾意。祝工作順利！家俊", en: "And you? Any changes at the company? Still working overtime all the time? If you're free, why not come and see me in Tai Po? I'll give you a free tour of the museum, and then we can eat at Tai Po Market. I know a place that does great beef brisket noodles; you'll love it. Hope work's going well! Ka-chun" }
questions:
  - { q: "家俊以前做咩工作？", options: ["寫字樓文員", "火車司機", "老師"], answer: 0, explain: "我以前喺寫字樓做文員." }
  - { q: "香港鐵路博物館以前係乜嘢？", options: ["一間學校", "大埔墟嘅舊火車站", "一間工廠"], answer: 1, explain: "鐵路博物館本身就係大埔墟嘅舊火車站，喺一九一三年建成." }
  - { q: "星期三發生咗乜嘢好笑嘅事？", options: ["家俊迷路", "一個細路話畀家俊聽個年份", "黃經理遲到"], answer: 1, explain: "家俊 forgot a date and a child called out 係一九一三年呀！" }
  - { q: "新工作有乜嘢唔好？", options: ["人工低咗少少，週末要返工", "上司好惡", "太悶"], answer: 0, explain: "人工低咗少少，而且星期六日都要返工." }
  - { q: "點解家俊諗住搬去大埔？", options: ["因為觀塘去大埔要差唔多一個鐘", "因為佢想買樓", "因為黃經理住喺大埔"], answer: 0, explain: "每日要坐差唔多一個鐘車先到大埔, and Tai Po has cheap flats to rent." }
