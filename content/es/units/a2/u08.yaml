id: a2.u08
title: Comparar y opinar
lessons:
  - id: a2.u08.l1
    title: Más que, menos que
    teach: [g.comparatives]
    vocab: [w.lento, w.peor, w.practico, w.util, w.inutil, w.igual, w.diferente, w.parecido, w.mas-que, w.menos-que, w.tan-como, w.tanto, w.comparar, w.transporte, w.publico, w.privado]
    sentences:
      - { es: "El tren es más rápido que el autobús.", en: "The train is faster than the bus.", grammar: [g.comparatives], vocab: [w.mas-que, w.rapido, w.tren] }
      - { es: "Mi coche es más lento que el tuyo.", en: "My car is slower than yours.", grammar: [g.comparatives], vocab: [w.lento, w.coche] }
      - { es: "Esta película es peor que la otra.", en: "This film is worse than the other one.", grammar: [g.comparatives], vocab: [w.peor, w.pelicula], error: { wrong: "Esta película es más peor que la otra.", explain: "peor is already a comparative; never más peor.", grammar: g.comparatives } }
      - { es: "Mi hermano es mayor que yo, pero yo soy más alto.", en: "My brother is older than me, but I am taller.", grammar: [g.comparatives], vocab: [w.mayor, w.alto] }
      - { es: "El metro es tan rápido como el taxi y mucho más barato.", en: "The metro is as fast as a taxi and much cheaper.", grammar: [g.comparatives], vocab: [w.tan-como, w.barato] }
      - { es: "No tengo tanto tiempo como tú.", en: "I don't have as much time as you.", grammar: [g.comparatives], vocab: [w.tanto] }
      - { es: "Esta mochila es más práctica y menos cara que el bolso.", en: "This backpack is more practical and less expensive than the handbag.", grammar: [g.comparatives], vocab: [w.practico, w.menos-que] }
      - { es: "Un diccionario es más útil que un juego.", en: "A dictionary is more useful than a game.", grammar: [g.comparatives], vocab: [w.util, w.diccionario] }
      - { es: "Este aparato es completamente inútil.", en: "This device is completely useless.", grammar: [g.adjective-agreement], vocab: [w.inutil] }
      - { es: "Los dos hermanos son muy parecidos, pero no son iguales.", en: "The two brothers are very similar, but they aren't identical.", grammar: [g.comparatives], vocab: [w.parecido, w.igual] }
      - { es: "El transporte público es más barato que el privado.", en: "Public transport is cheaper than private transport.", grammar: [g.comparatives], vocab: [w.transporte, w.publico, w.privado] }
      - { es: "Comparamos los precios de tres tiendas diferentes.", en: "We compared the prices of three different shops.", grammar: [g.preterite-regular], vocab: [w.comparar, w.diferente] }
      - { es: "Hay más de cien personas en la sala.", en: "There are more than a hundred people in the room.", grammar: [g.comparatives], vocab: [w.cien, w.gente] }
      - { es: "Madrid es más grande que Sevilla.", en: "Madrid is bigger than Seville.", grammar: [g.comparatives], vocab: [w.grande], transform: { instruction: "Say the opposite with 'menos'", answer: "Sevilla es menos grande que Madrid.", alt: ["Sevilla es más pequeña que Madrid."] } }
  - id: a2.u08.l2
    title: El mejor de todos
    teach: [g.superlatives]
    vocab: [w.el-mas, w.popular, w.normal, w.calidad, w.tamano, w.cantidad, w.marca, w.modelo, w.barato.phr, w.sencillo, w.complicado, w.pesado, w.ligero, w.ancho, w.estrecho, w.duro, w.blando]
    sentences:
      - { es: "Es la ciudad más bonita de España.", en: "It's the most beautiful city in Spain.", grammar: [g.superlatives], vocab: [w.el-mas, w.bonito], error: { wrong: "Es la ciudad más bonita en España.", explain: "After a superlative use de: la más bonita de España.", grammar: g.superlatives } }
      - { es: "Es el mejor restaurante del barrio.", en: "It's the best restaurant in the neighbourhood.", grammar: [g.superlatives], vocab: [w.mejor, w.barrio] }
      - { es: "Este es el peor día de mi vida.", en: "This is the worst day of my life.", grammar: [g.superlatives], vocab: [w.peor, w.vida] }
      - { es: "La paella estaba riquísima.", en: "The paella was absolutely delicious.", grammar: [g.superlatives], vocab: [w.rico] }
      - { es: "Es el cantante más popular del momento.", en: "He's the most popular singer of the moment.", grammar: [g.superlatives], vocab: [w.popular, w.cantante] }
      - { es: "Esta marca tiene la mejor relación calidad-precio.", en: "This brand has the best value for money.", grammar: [g.superlatives], vocab: [w.marca, w.barato.phr, w.calidad] }
      - { es: "¿Cuál es el modelo más sencillo? Este, y el más complicado es aquel.", en: "Which is the simplest model? This one, and the most complicated is that one.", grammar: [g.superlatives], vocab: [w.modelo, w.sencillo, w.complicado] }
      - { es: "La maleta grande es pesadísima; la pequeña es más ligera.", en: "The big suitcase is really heavy; the small one is lighter.", grammar: [g.superlatives], vocab: [w.pesado, w.ligero] }
      - { es: "Es la calle más estrecha de la ciudad y la avenida más ancha.", en: "It's the narrowest street in the city and the widest avenue.", grammar: [g.superlatives], vocab: [w.estrecho, w.ancho] }
      - { es: "El pan está durísimo; prefiero el blando.", en: "The bread is rock hard; I prefer the soft kind.", grammar: [g.superlatives], vocab: [w.duro, w.blando] }
      - { es: "¿Qué tamaño quiere? El más grande, por favor.", en: "What size do you want? The biggest, please.", grammar: [g.superlatives], vocab: [w.tamano, w.grande] }
      - { es: "Necesito una cantidad enorme de azúcar para esta tarta.", en: "I need a huge amount of sugar for this cake.", grammar: [g.quantity-words], vocab: [w.cantidad, w.azucar] }
      - { es: "Es una persona muy normal, nada especial.", en: "She's a very normal person, nothing special.", grammar: [g.muy-bastante-poco], vocab: [w.normal, w.especial] }
      - { es: "Es la mejor película del año.", en: "It's the best film of the year.", grammar: [g.superlatives], vocab: [w.mejor, w.pelicula], transform: { instruction: "Change to the plural: 'the best films'", answer: "Son las mejores películas del año." } }
  - id: a2.u08.l3
    title: Muy o mucho
    teach: [g.muy-vs-mucho]
    vocab: [w.sano, w.saludable, w.verdura.phr, w.casero, w.ventaja, w.desventaja, w.diferencia, w.ejemplo, w.ventajas.phr, w.trafico, w.naturaleza, w.aire, w.vida-en-el-pueblo]
    sentences:
      - { es: "Hay mucha gente y hace mucho calor, pero estoy muy contento.", en: "There are many people and it is very hot, but I am very happy.", grammar: [g.muy-vs-mucho], vocab: [w.gente, w.calor] }
      - { es: "Me gusta mucho; es muy interesante.", en: "I like it a lot; it is very interesting.", grammar: [g.muy-vs-mucho], vocab: [w.gustar, w.interesante], error: { wrong: "Me gusta muy; es mucho interesante.", explain: "mucho after a verb, muy before an adjective.", grammar: g.muy-vs-mucho } }
      - { es: "La comida casera es más sana que la comida rápida.", en: "Home-made food is healthier than fast food.", grammar: [g.comparatives], vocab: [w.casero, w.sano, w.verdura.phr] }
      - { es: "Las verduras son muy saludables.", en: "Vegetables are very healthy.", grammar: [g.muy-vs-mucho], vocab: [w.saludable, w.verdura] }
      - { es: "La vida en el pueblo tiene muchas ventajas.", en: "Village life has many advantages.", grammar: [g.muy-vs-mucho], vocab: [w.vida-en-el-pueblo, w.ventajas.phr, w.ventaja] }
      - { es: "La desventaja es que hay muy pocas tiendas.", en: "The disadvantage is that there are very few shops.", grammar: [g.muy-vs-mucho], vocab: [w.desventaja, w.tienda] }
      - { es: "En la ciudad hay demasiado tráfico y mucho ruido.", en: "In the city there is too much traffic and a lot of noise.", grammar: [g.quantity-words], vocab: [w.trafico, w.ruido] }
      - { es: "En el campo el aire es muy limpio y la naturaleza es preciosa.", en: "In the country the air is very clean and nature is beautiful.", grammar: [g.muy-vs-mucho], vocab: [w.aire, w.naturaleza] }
      - { es: "La diferencia de precio es muy grande.", en: "The difference in price is very big.", grammar: [g.muy-vs-mucho], vocab: [w.diferencia, w.precio] }
      - { es: "Por ejemplo, el metro es muchísimo más barato.", en: "For example, the metro is much, much cheaper.", grammar: [g.superlatives], vocab: [w.ejemplo, w.metro] }
      - { es: "Trabaja mucho y habla muy rápido.", en: "He works a lot and speaks very fast.", grammar: [g.muy-vs-mucho], vocab: [w.trabajar, w.rapido] }
      - { es: "¿Es caro? — Sí, mucho.", en: "Is it expensive? — Yes, very.", grammar: [g.muy-vs-mucho], vocab: [w.caro] }
      - { es: "Tengo mucha sed y muy poco tiempo.", en: "I'm very thirsty and I have very little time.", grammar: [g.muy-vs-mucho], vocab: [w.sed, w.poco] }
  - id: a2.u08.l4
    title: En mi opinión
    teach: [g.opinions]
    vocab: [w.en-mi-opinion, w.para-mi, w.me-parece, w.tener-razon, w.depende, w.opinar, w.estar-de-acuerdo, w.elegir, w.decidir, w.votar]
    sentences:
      - { es: "En mi opinión, el mejor plato español es la tortilla.", en: "In my opinion, the best Spanish dish is the omelette.", grammar: [g.opinions], vocab: [w.en-mi-opinion, w.tortilla] }
      - { es: "Para mí, el invierno es la peor estación.", en: "For me, winter is the worst season.", grammar: [g.opinions], vocab: [w.para-mi, w.invierno] }
      - { es: "Me parece que el examen ha sido fácil. ¿Tú qué opinas?", en: "I think the exam was easy. What do you think?", grammar: [g.opinions], vocab: [w.me-parece, w.opinar] }
      - { es: "Creo que tienes razón.", en: "I think you're right.", grammar: [g.opinions], vocab: [w.tener-razon, w.creer] }
      - { es: "Estoy totalmente de acuerdo contigo.", en: "I totally agree with you.", grammar: [g.opinions], vocab: [w.estar-de-acuerdo], error: { wrong: "Soy totalmente de acuerdo contigo.", explain: "Agreeing is estar de acuerdo.", grammar: g.opinions } }
      - { es: "No estoy de acuerdo; para mí la ciudad es mejor.", en: "I don't agree; for me the city is better.", grammar: [g.opinions], vocab: [w.estar-de-acuerdo, w.mejor] }
      - { es: "¿Playa o montaña? — Depende del tiempo.", en: "Beach or mountains? — It depends on the weather.", grammar: [g.opinions], vocab: [w.depende, w.tiempo] }
      - { es: "No sé qué elegir: los dos son muy bonitos.", en: "I don't know which to choose: both are very nice.", grammar: [g.opinions], vocab: [w.elegir, w.bonito] }
      - { es: "Al final decidimos comprar el más barato.", en: "In the end we decided to buy the cheapest one.", grammar: [g.superlatives], vocab: [w.decidir, w.barato] }
      - { es: "¿Por quién vas a votar? — Todavía no lo he decidido.", en: "Who are you going to vote for? — I haven't decided yet.", grammar: [g.opinions], vocab: [w.votar, w.decidir] }
      - { es: "Pienso que es una buena idea, pero es demasiado cara.", en: "I think it's a good idea, but it's too expensive.", grammar: [g.opinions], vocab: [w.pensar, w.caro] }
      - { es: "¿Qué te parece el nuevo profesor? — Me parece muy simpático.", en: "What do you think of the new teacher? — I think he's very nice.", grammar: [g.opinions], vocab: [w.me-parece, w.simpatico] }
      - { es: "Yo creo que el tren es mejor que el avión.", en: "I think the train is better than the plane.", grammar: [g.opinions], vocab: [w.creer, w.mejor], transform: { instruction: "Change 'yo creo' to 'nosotros pensamos'", answer: "Nosotros pensamos que el tren es mejor que el avión.", alt: ["Pensamos que el tren es mejor que el avión."] } }
dialogues:
  - id: a2.u08.d1
    title: ¿Ciudad o pueblo?
    context: Marta and Tom disagree about where it is better to live.
    lines:
      - { speaker: Marta, es: "Para mí, vivir en la ciudad es mucho mejor que vivir en un pueblo.", en: "For me, living in the city is much better than living in a village." }
      - { speaker: Tom, es: "No estoy de acuerdo. La ciudad es más ruidosa, más cara y más estresante.", en: "I don't agree. The city is noisier, more expensive and more stressful." }
      - { speaker: Marta, es: "Sí, pero tiene muchas más ventajas: hay más trabajo, más cultura y el transporte público es muy bueno.", en: "Yes, but it has many more advantages: there's more work, more culture and public transport is very good." }
      - { speaker: Tom, es: "En el pueblo la vida es más tranquila y la gente es más amable. Y el aire es muchísimo más limpio.", en: "In the village life is quieter and people are friendlier. And the air is much, much cleaner." }
      - { speaker: Marta, es: "Eso es verdad. Pero en el pueblo hay muy pocas tiendas y ningún cine.", en: "That's true. But in the village there are very few shops and no cinema." }
      - { speaker: Tom, es: "Depende de lo que busques. Yo prefiero la naturaleza al cine.", en: "It depends what you're looking for. I prefer nature to the cinema." }
      - { speaker: Marta, es: "Me parece que lo ideal es vivir en una ciudad pequeña, ni tan grande como Madrid ni tan pequeña como tu pueblo.", en: "I think the ideal is living in a small city, neither as big as Madrid nor as small as your village." }
      - { speaker: Tom, es: "Tienes razón. Granada, por ejemplo, es la ciudad más bonita que conozco y no es demasiado grande.", en: "You're right. Granada, for example, is the most beautiful city I know and it isn't too big." }
      - { speaker: Marta, es: "Pues decidido: nos mudamos a Granada.", en: "Then it's decided: we're moving to Granada." }
    questions:
      - { q: "Why does Tom prefer the village?", options: ["More work", "Quieter life and cleaner air", "Better transport"], answer: 1 }
      - { q: "What does Marta say the village lacks?", options: ["Shops and a cinema", "Nature", "Friendly people"], answer: 0 }
      - { q: "What do they agree on in the end?", options: ["A big city is best", "A small city is ideal", "A village is ideal"], answer: 1 }
