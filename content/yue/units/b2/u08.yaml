id: b2.u08
title: 辯論
lessons:
  - id: b2.u08.l1
    title: 首先，其次
    teach: [g.adding-points]
    vocab: [w.bin6-leon6, w.zing3-fong1, w.faan2-fong1, w.leon6-dim2, w.laap6-coeng4, w.gun1-dim2, w.zing3-geoi3, w.zyu2-zik6, w.faat3-jin4, w.fong1-on3, w.jau5-haau6, w.haau2-leoi6, w.zi1-zo6, w.faat3-zin2, w.kei4-ci3, w.gaa1-soeng5, w.ho4-fong3, w.lai6-zi2, w.geoi2-lai6, w.sou3-geoi3, w.jin4-gau3, w.zyun1-gaa1, w.hong6, w.cou3-si1, w.sing4-bun2, w.haau6-gwo2, w.bou6-zaau6, w.fong1-faat3, w.baan6-faat3, w.deoi3-fong1, w.lin4-zip3, w.leoi6-ci5, w.dou2-soeng6, w.lai4-dou3, w.jau5-haan6, w.jat1-bun1, w.zuk1-gau3, w.doi6-gaa3, w.jing1, w.po3-waai6]
    tip: "Order your points with 首先, 其次, 另外, 最後, and pile on weight with 而且, 再加上 and 更何況 (let alone)."
    sentences:
      - { es: "首先，我想多謝主席畀我發言。", en: "First of all, I'd like to thank the chair for letting me speak.", altEs: ["首先，多謝主席畀我發言。"], grammar: [g.adding-points], vocab: [w.zyu2-zik6, w.faat3-jin4, w.sau2-sin1] }
      - { es: "今日辯論嘅題目係「坪洲應唔應該起橋連接大嶼山」。", en: "Today's debate motion is 'Should a bridge be built linking Peng Chau with Lantau?'", altEs: ["今日辯論嘅題目係「坪洲應唔應該起條橋連接大嶼山」。"], grammar: [g.adding-points], vocab: [w.bin6-leon6, w.tai4-muk6, w.lin4-zip3, w.kiu4] }
      - { es: "正方支持起橋，反方就反對。", en: "The affirmative side supports building the bridge, and the opposing side is against it.", altEs: ["正方支持起橋，反方反對。"], grammar: [g.adding-points], vocab: [w.zing3-fong1, w.faan2-fong1, w.zi1-ci4, w.faan2-deoi3], transform: { instruction: "Swap the two sides", answer: "反方支持起橋，正方就反對。", alt: ["反方支持起橋，正方反對。"] } }
      - { es: "我哋嘅立場好清楚：呢個方案唔值得做。", en: "Our position is very clear: this proposal isn't worth doing.", altEs: ["我哋嘅立場好清楚，呢個方案唔值得做。"], grammar: [g.adding-points], vocab: [w.laap6-coeng4, w.fong1-on3, w.zik6-dak1, w.cing1-co2] }
      - { es: "首先，起橋嘅成本太高；其次，效果未必好。", en: "First, the cost of building a bridge is too high; second, the results may not be good.", altEs: ["首先，起橋成本太高；其次，效果未必好。"], grammar: [g.adding-points], vocab: [w.sing4-bun2, w.haau6-gwo2, w.kei4-ci3, w.mei6-bit1], transform: { instruction: "Add a third point with 最後: residents don't support it", answer: "首先，起橋嘅成本太高；其次，效果未必好；最後，居民唔支持。", alt: ["首先，起橋成本太高；其次，效果未必好；最後，居民唔支持。"] } }
      - { es: "另外，我想補充一點：政府嘅資助好有限。", en: "In addition, I'd like to add one point: government funding is very limited.", altEs: ["另外，我想補充一點，政府嘅資助好有限。"], grammar: [g.adding-points], vocab: [w.ling6-ngoi6, w.bou2-cung1, w.zi1-zo6, w.jau5-haan6] }
      - { es: "呢個方案貴，而且未必有效。", en: "This proposal is expensive, and it may not even work.", altEs: ["呢個方案好貴，而且未必有效。"], grammar: [g.adding-points], vocab: [w.jau5-haau6, w.ji4-ce2], transform: { instruction: "Add a further point with 再加上: residents don't support it", answer: "呢個方案貴，而且未必有效；再加上，居民唔支持。", alt: ["呢個方案貴，而且未必有效，再加上居民唔支持。"] } }
      - { es: "再加上交通唔方便，遊客根本唔會多。", en: "On top of that, transport is inconvenient, so there simply won't be many tourists.", altEs: ["加上交通唔方便，遊客根本唔會多。"], grammar: [g.adding-points], vocab: [w.gaa1-soeng5, w.gaau1-tung1, w.jau4-haak3], error: { wrong: "交通再加上唔方便，遊客根本唔會多。", explain: "再加上 opens the clause that adds the point: 再加上交通唔方便…", grammar: g.adding-points } }
      - { es: "我舉個例子：長洲都冇橋，但係週末一樣好多遊客。", en: "Let me give an example: Cheung Chau has no bridge either, but it's still full of tourists at weekends.", altEs: ["我舉個例子，長洲都冇橋，但係週末一樣好多遊客。", "舉個例子：長洲都冇橋，但係週末一樣好多遊客。"], grammar: [g.adding-points], vocab: [w.geoi2-lai6, w.lai6-zi2] }
      - { es: "根據專家嘅研究，類似嘅措施效果好一般。", en: "According to experts' research, similar measures have only mediocre results.", altEs: ["根據專家研究，類似嘅措施效果好一般。"], grammar: [g.adding-points], vocab: [w.gan1-geoi3, w.zyun1-gaa1, w.jin4-gau3, w.cou3-si1, w.jat1-bun1, w.leoi6-ci5] }
      - { es: "你有冇數據或者證據支持你嘅論點？", en: "Do you have any data or evidence to support your argument?", altEs: ["你有冇數據定係證據支持你嘅論點？", "你有冇數據或者證據去支持你嘅論點？"], grammar: [g.adding-points], vocab: [w.sou3-geoi3, w.zing3-geoi3, w.leon6-dim2] }
      - { es: "解決呢個問題有兩個辦法：加多啲船，或者起橋。", en: "There are two ways to solve this problem: add more ferries, or build a bridge.", altEs: ["解決呢個問題有兩個方法：加多啲船，或者起橋。"], grammar: [g.adding-points], vocab: [w.gaai2-kyut3, w.baan6-faat3, w.fong1-faat3] }
      - { es: "我哋要考慮清楚每一個步驟，唔可以心急。", en: "We need to think every step through carefully; we can't rush.", altEs: ["我哋要考慮清楚每個步驟，唔可以心急。"], grammar: [g.adding-points], vocab: [w.haau2-leoi6, w.bou6-zaau6] }
      - { es: "對方話起橋可以帶動發展，但係有冇考慮過居民嘅觀點？", en: "The other side says a bridge would drive development, but have they considered the residents' point of view?", altEs: ["對方話起橋可以幫助發展，但係有冇考慮過居民嘅觀點？"], grammar: [g.adding-points, g.rhetorical-questions], vocab: [w.deoi3-fong1, w.faat3-zin2, w.gun1-dim2, w.geoi1-man4] }
      - { es: "更何況，起橋會破壞坪洲嘅寧靜。", en: "And all the more so because a bridge would destroy Peng Chau's tranquillity.", altEs: ["何況，起橋會破壞坪洲嘅寧靜。"], grammar: [g.adding-points], vocab: [w.ho4-fong3, w.po3-waai6, w.ning4-zing6] }
      - { es: "呢項措施成本低，而且好快見到效果。", jp: "ni1 hong6 cou3 si1 sing4 bun2 dai1 ji4 ce2 hou2 faai3 gin3 dou2 haau6 gwo2", en: "This measure is low-cost, and you see results quickly too.", altEs: ["呢個措施成本低，而且好快見到效果。"], grammar: [g.adding-points], vocab: [w.hong6, w.cou3-si1, w.sing4-bun2] }
    exchanges:
      - q: { es: "你可唔可以講吓你哋嘅論點？", en: "Could you set out your arguments?" }
        a: { es: "可以。首先，成本太高；其次，冇足夠證據證明有效。", en: "Certainly. First, the cost is too high; second, there isn't enough evidence that it works." }
        alt: ["首先，成本太高；其次，未必有效。", "可以，首先係成本，其次係效果。"]
        grammar: [g.adding-points]
        vocab: [w.leon6-dim2, w.zing3-geoi3, w.kei4-ci3]
      - q: { es: "你哋有冇數據支持？", en: "Do you have data to back that up?" }
        a: { es: "有，我哋睇咗兩份大學嘅研究報告。", en: "Yes, we've looked at two university research reports." }
        alt: ["有，大學有研究。", "有，我哋有兩份研究報告。"]
        grammar: [g.adding-points]
        vocab: [w.sou3-geoi3, w.jin4-gau3]
      - q: { es: "主席，我可唔可以補充一點？", en: "Chair, may I add one point?" }
        a: { es: "可以，請你一分鐘講完。", en: "Yes, please finish within one minute." }
        alt: ["可以，請講。", "請講，不過要快啲。"]
        grammar: [g.adding-points]
        vocab: [w.zyu2-zik6, w.bou2-cung1]
      - q: { es: "政府會唔會資助呢個方案？", en: "Will the government fund this proposal?" }
        a: { es: "會資助一部分，不過唔夠。", en: "It'll fund part of it, but not enough." }
        alt: ["會，但係唔夠錢。", "資助少少，唔夠。"]
        grammar: [g.adding-points]
        vocab: [w.zi1-zo6, w.fong1-on3, w.bou6-fan6]
      - q: { es: "你點解反對起橋？", en: "Why are you against building the bridge?" }
        a: { es: "因為代價太大，何況居民都唔支持。", en: "Because the cost is too great, and besides, the residents don't support it." }
        alt: ["成本太高，而且居民唔支持。", "代價太大，更何況居民反對。"]
        grammar: [g.adding-points]
        vocab: [w.ho4-fong3, w.doi6-gaa3]
    texts:
      - title: "主席開場"
        es: ["歡迎大家嚟到今日嘅辯論比賽。", "今日嘅題目係「坪洲應該起橋連接大嶼山」。", "首先請正方發言，每人有三分鐘。"]
        en: ["Welcome, everyone, to today's debate competition.", "Today's motion is 'Peng Chau should build a bridge to Lantau'.", "First the affirmative side will speak; each speaker has three minutes."]
        grammar: [g.adding-points]
        vocab: [w.bin6-leon6, w.zing3-fong1, w.faat3-jin4, w.lai4-dou3]
      - title: "反方筆記"
        es: ["論點一：起橋成本太高。", "論點二：渡輪已經夠方便。", "例子：長洲冇橋，遊客一樣多。"]
        en: ["Point one: a bridge costs too much.", "Point two: the ferries are already convenient enough.", "Example: Cheung Chau has no bridge, and there are just as many tourists."]
        grammar: [g.adding-points]
        vocab: [w.leon6-dim2, w.lai6-zi2, w.dou6-leon4]
    spicy:
      - { es: "首先，你好靚；其次，你好叻；最後，你今晚得唔得閒？", en: "First, you're gorgeous; second, you're smart; finally, are you free tonight?", altEs: ["首先，你好靚；其次，你好叻；最後，今晚得唔得閒？"], grammar: [g.adding-points], vocab: [w.kei4-ci3, w.dak1-haan4] }
      - { es: "我有足夠證據證明你鍾意我：你成晚都望住我。", en: "I have enough evidence to prove you like me: you've been looking at me all night.", altEs: ["我有足夠證據證明你鍾意我，你成晚都望住我。"], grammar: [g.adding-points], vocab: [w.zing3-geoi3, w.zing3-ming4, w.zuk1-gau3] }
      - { es: "我嘅立場好清楚：你負責晚餐，我負責甜品。", en: "My position is very clear: you take care of dinner, I'll take care of dessert.", altEs: ["我嘅立場好清楚，你負責晚餐，我負責甜品。"], grammar: [g.adding-points], vocab: [w.laap6-coeng4, w.fu6-zaak3, w.tim4-ban2] }
      - { es: "你話我哋唔襯，有冇數據支持呀？", en: "You say we're not a good match; got any data to back that up?", altEs: ["你話我哋兩個唔襯，有冇數據支持呀？"], grammar: [g.adding-points], vocab: [w.sou3-geoi3, w.can3] }
      - { es: "呢個約會方案成本低、效果好，而且你唔使換衫。", en: "This date plan is low-cost and effective, and you don't even have to change your clothes.", altEs: ["呢個約會方案成本低，效果好，而且你唔使換衫。"], grammar: [g.adding-points], vocab: [w.fong1-on3, w.sing4-bun2, w.haau6-gwo2] }
  - id: b2.u08.l2
    title: 你講得啱，不過……
    teach: [g.concessive-ji-sai]
    vocab: [w.faan2-bok3, w.zang1-leon6, w.seoi3-fuk6, w.fat1-si6, w.fau2-jing6, w.sing4-jing6, w.jan1-sou3, w.gu3-jin4, w.waa6-seoi1-jyu4-ci2, w.jin4-ji4, w.cing4-fong3, w.jing2-hoeng2, w.goi2-sin6, w.zaak3-jam6, w.kyun4-lei6, w.ping4-dang2, w.dou6-dak1, w.lei6-jik1, w.doi6-gaa3, w.bit1-jiu3, w.seoi1-jiu3, w.jau1-sai3, w.joek6-dim2, w.maau4-teon5, w.cung1-dat6, w.gung6-sik1, w.to5-hip3, w.fung1-him2, w.tiu1-zin3, w.kwan3-naan4, w.fo2-caai4, w.fo2-caai4-cong2, w.bou2-juk6, w.sat1-heoi3, w.zik6-zip3]
    tip: "Concede first, then counter: 即使…都 (even if), 固然…但係 (admittedly … but), 話雖如此 (that said)."
    sentences:
      - { es: "即使成本高，我哋都應該保育舊火柴廠。", en: "Even if the cost is high, we should still preserve the old match factory.", altEs: ["即使成本好高，我哋都應該保育舊火柴廠。"], grammar: [g.concessive-ji-sai], vocab: [w.zik1-si2, w.bou2-juk6, w.fo2-caai4-cong2], error: { wrong: "即使成本高，我哋應該保育舊火柴廠。", explain: "即使 still needs 都 in the second clause: 我哋都應該…", grammar: g.concessive-ji-sai }, transform: { instruction: "Say it more colloquially with 就算", answer: "就算成本高，我哋都應該保育舊火柴廠。", alt: ["就算成本好高，我哋都應該保育舊火柴廠。"] } }
      - { es: "經濟發展固然重要，但係環境都唔可以忽視。", en: "Economic development is admittedly important, but the environment can't be ignored either.", altEs: ["經濟發展固然重要，不過環境都唔可以忽視。"], grammar: [g.concessive-ji-sai], vocab: [w.gu3-jin4, w.fat1-si6, w.ging1-zai3, w.waan4-ging2], error: { wrong: "經濟發展固然重要，所以環境都唔可以忽視。", explain: "固然 concedes a point, so the next clause turns with 但係 or 不過, not 所以.", grammar: g.concessive-ji-sai } }
      - { es: "你講得啱，不過仲有其他因素要考慮。", en: "You're right, but there are other factors to consider too.", altEs: ["你講得啱，但係仲有其他因素要考慮。"], grammar: [g.concessive-ji-sai], vocab: [w.jan1-sou3, w.haau2-leoi6] }
      - { es: "我明白你嘅意思，但係我唔同意。", en: "I see what you mean, but I don't agree.", altEs: ["我明白你嘅意思，不過我唔同意。"], grammar: [g.concessive-ji-sai], vocab: [w.ming4-baak6, w.tung4-ji3] }
      - { es: "我唔否認起橋有佢嘅優勢，但係風險都好大。", en: "I don't deny that a bridge has its advantages, but the risks are big too.", altEs: ["我唔否認起橋有優勢，但係風險都好大。"], grammar: [g.concessive-ji-sai], vocab: [w.fau2-jing6, w.jau1-sai3, w.fung1-him2] }
      - { es: "反方都承認呢個方案有弱點。", en: "Even the opposing side admits this proposal has weaknesses.", altEs: ["連反方都承認呢個方案有弱點。"], grammar: [g.concessive-ji-sai], vocab: [w.sing4-jing6, w.joek6-dim2] }
      - { es: "就算係噉，問題都未解決。", en: "Even so, the problem still isn't solved.", altEs: ["就算係噉，個問題都仲未解決。", "話雖如此，問題都未解決。"], grammar: [g.concessive-ji-sai], vocab: [w.gaai2-kyut3] }
      - { es: "話雖如此，我哋都要尊重居民嘅權利。", en: "That said, we still have to respect the residents' rights.", altEs: ["話雖如此，我哋都要尊重居民權利。"], grammar: [g.concessive-ji-sai], vocab: [w.waa6-seoi1-jyu4-ci2, w.kyun4-lei6, w.zyun1-zung6] }
      - { es: "佢哋爭論咗成個鐘，最後都冇共識。", en: "They argued for a whole hour and in the end still had no consensus.", altEs: ["佢哋爭論咗成個鐘，最後都達唔到共識。"], grammar: [g.concessive-ji-sai], vocab: [w.zang1-leon6, w.gung6-sik1] }
      - { es: "大家都要妥協少少，先會有共識。", en: "Everyone has to compromise a little before there can be a consensus.", altEs: ["大家都要妥協一啲，先會有共識。"], grammar: [g.concessive-ji-sai], vocab: [w.to5-hip3, w.gung6-sik1] }
      - { es: "我想反駁對方頭先講嘅論點。", en: "I'd like to rebut the point the other side made just now.", altEs: ["我想反駁對方頭先提出嘅論點。"], grammar: [g.concessive-ji-sai], vocab: [w.faan2-bok3, w.deoi3-fong1, w.tau4-sin1] }
      - { es: "呢件事唔單止係錢嘅問題，仲係道德問題。", en: "This isn't just a question of money; it's a moral question too.", altEs: ["呢件事唔單止關錢事，仲係道德問題。"], grammar: [g.concessive-ji-sai], vocab: [w.m4-daan1-zi2, w.dou6-dak1] }
      - { es: "每個居民都有平等嘅權利表達意見。", en: "Every resident has an equal right to express their views.", altEs: ["每個居民都有平等權利表達意見。"], grammar: [g.concessive-ji-sai], vocab: [w.ping4-dang2, w.biu2-daat6, w.ji3-gin3] }
      - { es: "保育固然有代價，然而失去歷史嘅代價更大。", en: "Conservation admittedly has a cost; however, the cost of losing our history is greater.", altEs: ["保育固然有代價，但係失去歷史嘅代價更大。"], grammar: [g.concessive-ji-sai], vocab: [w.doi6-gaa3, w.jin4-ji4, w.sat1-heoi3, w.lik6-si2] }
      - { es: "兩邊嘅利益有矛盾，所以好容易起衝突。", en: "The two sides' interests conflict, so clashes break out easily.", altEs: ["兩邊嘅利益有矛盾，所以好易有衝突。"], grammar: [g.concessive-ji-sai], vocab: [w.lei6-jik1, w.maau4-teon5, w.cung1-dat6] }
      - { es: "即使有困難，我都會盡力說服佢。", en: "Even if it's difficult, I'll do my best to persuade him.", altEs: ["就算有困難，我都會盡力說服佢。"], altEn: ["Even if it's difficult, I'll do my best to persuade her."], grammar: [g.concessive-ji-sai], vocab: [w.kwan3-naan4, w.seoi3-fuk6, w.zeon6-lik6, w.tiu1-zin3], transform: { instruction: "Make it about the challenge (挑戰) being big, and use 固然…但係", answer: "挑戰固然好大，但係我都會盡力說服佢。", alt: ["挑戰固然大，但係我都會盡力說服佢。", "挑戰固然好大，不過我都會盡力說服佢。"] } }
    exchanges:
      - q: { es: "起酒店可以帶嚟好多工作機會。", en: "Building a hotel would bring lots of jobs." }
        a: { es: "你講得啱，不過對環境嘅影響都要考慮。", en: "You're right, but the impact on the environment has to be considered too." }
        alt: ["係嘅，但係環境點算？", "我明白，不過環境都好重要。"]
        grammar: [g.concessive-ji-sai]
        vocab: [w.jing2-hoeng2, w.gei1-wui6]
      - q: { es: "你覺得兩邊有冇可能妥協？", en: "Do you think the two sides could compromise?" }
        a: { es: "有，即使立場唔同，都可以搵到共識。", en: "Yes, even with different positions they can find common ground." }
        alt: ["有可能，大家讓一步就得。", "好難，不過都要試吓。"]
        grammar: [g.concessive-ji-sai]
        vocab: [w.to5-hip3, w.laap6-coeng4, w.gung6-sik1]
      - q: { es: "點解唔直接拆咗間舊火柴廠？", en: "Why not just knock the old match factory down?" }
        a: { es: "拆固然方便，但係嗰度有歷史價值，以前成個坪洲都靠做火柴。", en: "Knocking it down would admittedly be easy, but the place has historical value; the whole of Peng Chau once lived on making matches." }
        alt: ["拆就容易，不過嗰度有歷史價值。", "因為佢有歷史價值。"]
        grammar: [g.concessive-ji-sai]
        vocab: [w.gu3-jin4, w.gaa3-zik6, w.fo2-caai4-cong2, w.fo2-caai4]
      - q: { es: "渡輪加價有冇必要？", en: "Is a ferry fare rise really necessary?" }
        a: { es: "有需要，話雖如此，政府都應該資助老人家。", en: "It's needed; that said, the government should still subsidise the elderly." }
        alt: ["有需要，不過老人家應該有資助。", "冇必要，政府應該資助。"]
        grammar: [g.concessive-ji-sai]
        vocab: [w.bit1-jiu3, w.seoi1-jiu3, w.waa6-seoi1-jyu4-ci2]
      - q: { es: "呢件事係邊個嘅責任？", en: "Whose responsibility is this?" }
        a: { es: "政府固然有責任，但係居民都要幫手。", en: "The government admittedly bears responsibility, but residents must do their bit too." }
        alt: ["政府有責任，居民都有。", "大家都有責任。"]
        grammar: [g.concessive-ji-sai]
        vocab: [w.zaak3-jam6]
    texts:
      - title: "報紙評論"
        es: ["坪洲人口少，交通固然冇市區咁方便。", "然而，正正因為冇車冇橋，島上先可以保持寧靜。", "即使起橋可以帶嚟遊客，我哋都要諗清楚代價。"]
        en: ["Peng Chau has a small population, so transport is admittedly less convenient than in the city.", "However, it's precisely because there are no cars and no bridge that the island stays peaceful.", "Even if a bridge could bring in tourists, we need to think the cost through."]
        grammar: [g.concessive-ji-sai]
        vocab: [w.gu3-jin4, w.jin4-ji4, w.doi6-gaa3]
      - title: "坪洲街坊會通告"
        es: ["我哋明白大家想改善島上嘅情況。", "不過每個家庭嘅需要唔同，請大家互相尊重。"]
        en: ["We understand that everyone wants to improve the situation on the island.", "But every household's needs are different, so please respect one another."]
        grammar: [g.concessive-ji-sai]
        vocab: [w.goi2-sin6, w.cing4-fong3, w.seoi1-jiu3]
    spicy:
      - { es: "你遲到固然唔啱，但係你帶咗花嚟，我就原諒你。", en: "Being late was admittedly wrong, but you brought flowers, so I forgive you.", altEs: ["你遲到固然唔啱，不過你帶咗花嚟，我就原諒你。"], grammar: [g.concessive-ji-sai], vocab: [w.gu3-jin4, w.faa1, w.jyun4-loeng6] }
      - { es: "就算你辯論贏咗我，你都說服唔到我唔鍾意你。", en: "Even if you beat me in the debate, you can't persuade me not to like you.", altEs: ["即使你辯論贏咗我，你都說服唔到我唔鍾意你。"], grammar: [g.concessive-ji-sai], vocab: [w.seoi3-fuk6, w.bin6-leon6] }
      - { es: "我唔否認你好靚，但係你成日遲到都係一個弱點。", en: "I don't deny you're gorgeous, but always being late is still a weakness.", altEs: ["我唔否認你好靚，不過你成日遲到都係個弱點。"], grammar: [g.concessive-ji-sai], vocab: [w.fau2-jing6, w.joek6-dim2] }
      - { es: "我哋為咗去邊度食飯爭論咗成個鐘，最後妥協：去你屋企，你煮。", en: "We argued for an hour about where to eat, and finally compromised: your place, you cook.", altEs: ["我哋為咗去邊度食飯爭論咗成個鐘，最後妥協，去你屋企，你煮。"], grammar: [g.concessive-ji-sai], vocab: [w.zang1-leon6, w.to5-hip3] }
      - { es: "即使有風險，我都想同你喺坪洲睇一次日落。", en: "Even if it's risky, I want to watch a sunset with you on Peng Chau.", altEs: ["就算有風險，我都想同你喺坪洲睇一次日落。"], grammar: [g.concessive-ji-sai], vocab: [w.fung1-him2, w.jat6-lok6] }
  - id: b2.u08.l3
    title: 總括嚟講
    teach: [g.summing-up]
    vocab: [w.zung2-kut3, w.zung2-kut3-lai4-gong2, w.wun6-geoi3-waa6-gong2, w.jan1-ci2, w.git3-leon6, w.zung2-git3, w.bou6-fan6, w.daai6-bou6-fan6, w.siu2-sou3, w.do1-sou3, w.jat1-bun1, w.pou2-pin3, w.zik1-hai6-waa6, w.faan2-gwo3-lai4-gong2, w.jat1-bun1-lai4-gong2, w.lei5-leon6-soeng6, w.sat6-zai3, w.geoi6-tai2, w.ming4-kok3, w.mou4-wu4, w.zeon2-kok3, w.zuk1-gau3, w.fung1-fu3, w.jyun4-mei5, w.jin6-zoeng6, w.ceoi1-sai3, w.cing4-dou6, w.faan6-wai4, w.fong1-min6, w.gok3-dou6, w.siu1-je2, w.wai4-ci4, w.wu1-jim5]
    tip: "Close with 總括嚟講 in a formal speech, 講到尾 or 所以話 in conversation; 總之 can sound like 'whatever', so use it with care."
    sentences:
      - { es: "總括嚟講，我哋反對起橋。", en: "To sum up, we are against building the bridge.", altEs: ["總括嚟講，我哋係反對起橋嘅。", "總結嚟講，我哋反對起橋。"], grammar: [g.summing-up], vocab: [w.zung2-kut3-lai4-gong2, w.zung2-kut3], error: { wrong: "我哋總括嚟講反對起橋。", explain: "Summing-up phrases open the sentence, followed by a pause: 總括嚟講，我哋…", grammar: g.summing-up }, transform: { instruction: "Say it in everyday speech with 總之", answer: "總之，我哋反對起橋。", alt: ["總之我哋反對起橋。"] } }
      - { es: "講到尾，都係錢嘅問題。", en: "At the end of the day, it's all about money.", altEs: ["講到尾，都係錢嘅問題嚟。", "講到尾都係錢嘅問題。"], grammar: [g.summing-up], vocab: [w.gong2-dou3-mei5] }
      - { es: "換句話講，居民要畀多啲船費。", en: "In other words, residents will have to pay higher ferry fares.", altEs: ["即係話，居民要畀多啲船費。"], grammar: [g.summing-up], vocab: [w.wun6-geoi3-waa6-gong2] }
      - { es: "總之，你聽日一定要嚟睇比賽。", en: "Anyway, the point is you must come and watch the competition tomorrow.", altEs: ["總之你聽日一定要嚟睇比賽。"], grammar: [g.summing-up], vocab: [w.zung2-zi1, w.bei2-coi3] }
      - { es: "大部分居民支持保育，只有少數人反對。", en: "Most residents support conservation; only a minority are against it.", altEs: ["大部分居民都支持保育，只有少數人反對。"], grammar: [g.summing-up], vocab: [w.daai6-bou6-fan6, w.siu2-sou3], transform: { instruction: "Swap the majority and the minority", answer: "大部分居民反對保育，只有少數人支持。", alt: ["大部分居民都反對保育，只有少數人支持。"] } }
      - { es: "一般嚟講，島上嘅老人家唔太鍾意改變。", en: "Generally speaking, the elderly on the island don't much like change.", altEs: ["一般嚟講，島上啲老人家唔太鍾意改變。"], grammar: [g.summing-up], vocab: [w.jat1-bun1-lai4-gong2, w.lou5-jan4-gaa1, w.goi2-bin3, w.dou2-soeng6] }
      - { es: "理論上起橋可以方便居民，實際上未必。", en: "In theory a bridge would make life easier for residents; in practice, not necessarily.", altEs: ["理論上，起橋可以方便居民，實際上就未必。"], grammar: [g.summing-up], vocab: [w.lei5-leon6-soeng6, w.sat6-zai3] }
      - { es: "佢嘅結論好模糊，聽完都唔知佢想講乜。", en: "His conclusion was so vague that after listening you still didn't know what he meant.", altEs: ["佢嘅結論好模糊，聽完都唔知佢想講咩。"], altEn: ["Her conclusion was so vague that after listening you still didn't know what she meant."], grammar: [g.summing-up], vocab: [w.git3-leon6, w.mou4-wu4] }
      - { es: "我哋嘅數據要明確同準確。", en: "Our data has to be clear and accurate.", altEs: ["我哋嘅數據一定要明確同準確。"], grammar: [g.summing-up], vocab: [w.ming4-kok3, w.zeon2-kok3] }
      - { es: "由經濟角度睇，呢個計劃值得做。", en: "From an economic perspective, this plan is worth doing.", altEs: ["由經濟嘅角度睇，呢個計劃值得做。", "從經濟角度睇，呢個計劃值得做。"], grammar: [g.summing-up], vocab: [w.gok3-dou6, w.ging1-zai3] }
      - { es: "喺環境方面，影響嘅範圍有幾大？", en: "As far as the environment is concerned, how wide is the impact?", altEs: ["環境方面，影響嘅範圍有幾大？"], grammar: [g.summing-up, g.jau-gei-how], vocab: [w.fong1-min6, w.faan6-wai4] }
      - { es: "年輕人搬出市區係普遍現象，而且趨勢越嚟越明顯。", en: "Young people moving to the city is a common phenomenon, and the trend is getting more and more obvious.", altEs: ["年輕人搬出市區係一個普遍現象，而且趨勢越嚟越明顯。"], grammar: [g.summing-up], vocab: [w.pou2-pin3, w.jin6-zoeng6, w.ceoi1-sai3, w.ming4-hin2] }
      - { es: "因此，我哋建議先喺坪洲試一年。", en: "Therefore, we suggest first trying it on Peng Chau for a year.", altEs: ["因此，我哋建議喺坪洲先試一年。"], grammar: [g.summing-up, g.jau-jyu-because], vocab: [w.jan1-ci2, w.gin3-ji5] }
      - { es: "即係話，你唔同意我哋嘅方案？", en: "So what you're saying is, you don't agree with our proposal?", altEs: ["即係話你唔同意我哋嘅方案？", "換句話講，你唔同意我哋嘅方案？"], grammar: [g.summing-up], vocab: [w.zik1-hai6-waa6] }
      - { es: "反過嚟講，如果冇遊客，島上啲細舖頭點維持？", en: "Conversely, if there were no tourists, how would the island's little shops survive?", altEs: ["反過嚟講，如果冇咗遊客，島上啲細舖頭點維持？"], grammar: [g.summing-up, g.rhetorical-questions], vocab: [w.faan2-gwo3-lai4-gong2, w.pou3-tau2, w.wai4-ci4] }
      - { es: "冇一個方案係完美嘅，所以話我哋要揀代價最細嗰個。", en: "No proposal is perfect, which is why I say we should choose the one with the lowest cost.", altEs: ["冇方案係完美嘅，所以話我哋要揀代價最細嗰個。"], grammar: [g.summing-up], vocab: [w.jyun4-mei5, w.so2-ji5-waa6] }
    exchanges:
      - q: { es: "可唔可以總結一下你哋嘅觀點？", en: "Could you sum up your views?" }
        a: { es: "總括嚟講，起橋嘅代價大過好處。", en: "To sum up, the costs of a bridge outweigh the benefits." }
        alt: ["總之，起橋唔抵。", "講到尾，代價太大。"]
        grammar: [g.summing-up]
        vocab: [w.zung2-git3, w.zung2-kut3-lai4-gong2, w.hou2-cyu3]
      - q: { es: "你嘅意思係唔使改？", en: "Are you saying there's no need to change anything?" }
        a: { es: "唔係，即係話要改，但係唔使全部改。", en: "No, what I mean is it needs changing, but not all of it." }
        alt: ["唔係，改一部分就得。", "要改，不過改一部分。"]
        grammar: [g.summing-up]
        vocab: [w.zik1-hai6-waa6, w.bou6-fan6]
      - q: { es: "坪洲居民多數點樣返工？", en: "How do Peng Chau residents mostly get to work?" }
        a: { es: "多數坐渡輪去中環，大約半個鐘。", en: "Mostly by ferry to Central, about half an hour." }
        alt: ["多數坐船出中環。", "坐渡輪，半個鐘左右。"]
        grammar: [g.summing-up]
        vocab: [w.do1-sou3, w.dou6-leon4]
      - q: { es: "你哋嘅資料夠唔夠？", en: "Is your information sufficient?" }
        a: { es: "夠，我哋嘅數據好豐富，例子都好具體。", en: "Yes, our data is very rich and our examples are very concrete." }
        alt: ["足夠。", "夠，數據好豐富。"]
        grammar: [g.summing-up]
        vocab: [w.zuk1-gau3, w.fung1-fu3, w.geoi6-tai2]
      - q: { es: "污染問題有幾嚴重？", en: "How serious is the pollution problem?" }
        a: { es: "一般，不過嚴重程度要睇邊個地區。", en: "Moderate, but how serious it is depends on the area." }
        alt: ["唔算好嚴重。", "要睇地區，程度唔同。"]
        grammar: [g.summing-up, g.jau-gei-how]
        vocab: [w.jat1-bun1, w.cing4-dou6]
    texts:
      - title: "總結發言"
        es: ["總括嚟講，我哋有三個論點。", "第一，成本太高；第二，效果唔夠明確；第三，大部分居民反對。", "因此，我哋認為坪洲唔應該起橋。"]
        en: ["To sum up, we have three arguments.", "First, the cost is too high; second, the effect is unclear; third, most residents are against it.", "Therefore, we believe Peng Chau should not build a bridge."]
        grammar: [g.summing-up]
        vocab: [w.zung2-kut3-lai4-gong2, w.jan1-ci2, w.daai6-bou6-fan6]
      - title: "評判意見"
        es: ["正方論點清楚，例子具體。", "反方數據準確，不過結論有啲模糊。", "總括嚟講，兩隊都表現得好好。"]
        en: ["The affirmative side's arguments were clear and the examples concrete.", "The opposing side's data was accurate, but its conclusion was a bit vague.", "Overall, both teams performed very well."]
        grammar: [g.summing-up]
        vocab: [w.git3-leon6, w.mou4-wu4, w.zeon2-kok3]
    spicy:
      - { es: "總之，你今晚唔准再望其他人。", en: "Anyway, the point is you're not allowed to look at anyone else tonight.", altEs: ["總之你今晚唔准再望第二個。"], grammar: [g.summing-up], vocab: [w.zung2-zi1] }
      - { es: "換句話講，你唔係唔鍾意我，你係怕自己太鍾意我。", en: "In other words, it's not that you don't like me; you're afraid of liking me too much.", altEs: ["即係話，你唔係唔鍾意我，你係怕自己太鍾意我。"], grammar: [g.summing-up], vocab: [w.wun6-geoi3-waa6-gong2] }
      - { es: "講到尾，你都係想我陪你食宵夜啫。", en: "At the end of the day, you just want me to keep you company for a late-night snack.", altEs: ["講到尾，你都只係想我陪你食宵夜啫。"], grammar: [g.summing-up], vocab: [w.gong2-dou3-mei5, w.siu1-je2] }
      - { es: "理論上我應該嬲你，實際上我一見到你就笑。", en: "In theory I should be angry with you; in practice I smile the moment I see you.", altEs: ["理論上我應該嬲你，但實際上我一見到你就笑。"], grammar: [g.summing-up], vocab: [w.lei5-leon6-soeng6, w.sat6-zai3] }
      - { es: "由邊個角度睇，你都係咁有魅力。", en: "From any angle, you're just as charming.", altEs: ["無論由邊個角度睇，你都咁有魅力。"], grammar: [g.summing-up], vocab: [w.gok3-dou6, w.mei6-lik6] }
  - id: b2.u08.l4
    title: 點會冇人知㗎？
    teach: [g.rhetorical-questions]
    vocab: [w.cing4-cing1, w.koeng4-diu6, w.wui4-jing3, w.tai4-ceot1, w.tai4, w.gei6-haau2, w.piu3, w.tau4-sou3, w.kong3-ji5, w.zang1-ceoi2, w.zaan3-sing4, w.so2-wai6, w.gwo3-cing4, w.gaai1-dyun6, w.tiu4-gin2, w.zai3-dou6, w.hai6-tung2, w.kwai1-mou4, w.zi1-jyun4, w.seoi2-ping4, w.dei6-wai2, w.bui3-ging2, w.hung1-gaan1, w.ngai4-gei1, w.biu2-jin6, w.zik6, w.gaa1-cin2, w.deoi3-sau2, w.ging1-hei2, w.ping4-pun3]
    tip: "A rhetorical question is a strong statement: 邊有咁平？ means 'it can't be that cheap'. Don't answer it literally."
    sentences:
      - { es: "邊有咁平㗎？", en: "There's no way it's that cheap.", altEs: ["邊有咁平呀？", "邊會咁平㗎？"], grammar: [g.rhetorical-questions], vocab: [w.bin1-jau5], transform: { instruction: "Say it as a plain statement", answer: "冇可能咁平。", alt: ["唔會咁平。", "冇咁平嘅。"] } }
      - { es: "點會冇人知㗎？", en: "How could nobody know?", altEs: ["點會冇人知呀？"], grammar: [g.rhetorical-questions], vocab: [w.dim2-wui5], error: { wrong: "點會冇人知嗎？", explain: "A rhetorical 點會 question ends in 㗎 or 呀, not the yes/no particle 嗎.", grammar: g.rhetorical-questions } }
      - { es: "唔通你想一個人上台辯論？", en: "Surely you don't want to go up and debate on your own?", altEs: ["唔通你想自己一個上台辯論？", "難道你想一個人上台辯論？"], grammar: [g.rhetorical-questions], vocab: [w.m4-tung1] }
      - { es: "使乜買咁多，食唔晒㗎。", en: "Why buy so much? We can't eat it all.", altEs: ["使乜買咁多呀，食唔晒㗎。"], grammar: [g.rhetorical-questions], vocab: [w.sai2-mat1], transform: { instruction: "Use the more formal 何必", answer: "何必買咁多，食唔晒㗎。", alt: ["何必買咁多呢，食唔晒㗎。"] } }
      - { es: "如果連居民都反對，點解仲要起橋？", en: "If even the residents are against it, why build the bridge at all?", altEs: ["如果連居民都反對，點解仲要起條橋？"], grammar: [g.rhetorical-questions], vocab: [w.faan2-deoi3, w.geoi1-man4] }
      - { es: "我想澄清一點：我哋唔係反對發展。", en: "I'd like to clarify one point: we're not against development.", altEs: ["我想澄清一點，我哋唔係反對發展。"], grammar: [g.rhetorical-questions, g.adding-points], vocab: [w.cing4-cing1, w.faat3-zin2] }
      - { es: "我要強調，坪洲嘅資源好有限。", en: "I want to stress that Peng Chau's resources are very limited.", altEs: ["我想強調，坪洲嘅資源好有限。"], grammar: [g.rhetorical-questions], vocab: [w.koeng4-diu6, w.zi1-jyun4] }
      - { es: "對方仲未回應我頭先提出嘅問題。", en: "The other side still hasn't responded to the question I raised just now.", altEs: ["對方都未回應我頭先提出嘅問題。"], grammar: [g.rhetorical-questions], vocab: [w.wui4-jing3, w.tai4-ceot1] }
      - { es: "你唔好再提舊火柴廠嘅事喇。", en: "Stop bringing up the old match factory business.", altEs: ["唔好再提舊火柴廠嗰件事喇。"], grammar: [g.rhetorical-questions], vocab: [w.tai4] }
      - { es: "辯論唔單止要有道理，仲要有技巧。", en: "Debating isn't just about making sense; you need technique too.", altEs: ["辯論唔單止要講道理，仲要有技巧。"], grammar: [g.rhetorical-questions], vocab: [w.gei6-haau2, w.dou6-lei5] }
      - { es: "居民投訴渡輪加價，仲去碼頭抗議。", en: "Residents complained about the ferry fare rise and even went to protest at the pier.", altEs: ["居民投訴渡輪加價，仲喺碼頭抗議。"], grammar: [g.rhetorical-questions], vocab: [w.tau4-sou3, w.kong3-ji5, w.gaa1-gaa3] }
      - { es: "你贊成定反對？舉手投票啦。", en: "Are you for or against? Vote with a show of hands.", altEs: ["你贊成定係反對？舉手投票啦。"], grammar: [g.rhetorical-questions], vocab: [w.zaan3-sing4, w.tau4-piu3] }
      - { es: "所謂「發展」，其實即係起多幾間酒店啫。", en: "So-called 'development' really just means building a few more hotels.", altEs: ["所謂發展，其實即係起多幾間酒店啫。"], grammar: [g.rhetorical-questions], vocab: [w.so2-wai6, w.zau2-dim3] }
      - { es: "個計劃仲喺研究階段，未有具體條件。", en: "The plan is still at the research stage, with no concrete terms yet.", altEs: ["個計劃仲喺研究階段，仲未有具體條件。"], grammar: [g.rhetorical-questions], vocab: [w.gaai1-dyun6, w.tiu4-gin2] }
      - { es: "難道而家嘅制度一啲問題都冇？", en: "Surely you're not saying the current system has no problems at all?", altEs: ["難道而家個制度一啲問題都冇？", "唔通而家嘅制度一啲問題都冇？"], grammar: [g.rhetorical-questions], vocab: [w.naan4-dou6, w.zai3-dou6] }
      - { es: "何必為咗一條橋搞到大家咁唔開心？", en: "Why let one bridge make everyone so unhappy?", altEs: ["使乜為咗一條橋搞到大家咁唔開心？"], grammar: [g.rhetorical-questions, g.causatives-ling-gaau-dou], vocab: [w.ho4-bit1, w.gaau2-dou3] }
    exchanges:
      - q: { es: "嗰間餐廳一碟炒飯賣二百蚊。", en: "That restaurant sells a plate of fried rice for two hundred dollars." }
        a: { es: "邊有咁貴㗎？搶錢咩？", en: "No way it's that expensive! Are they robbing people?" }
        alt: ["邊有咁貴呀？", "點會咁貴㗎？"]
        grammar: [g.rhetorical-questions]
        vocab: [w.bin1-jau5, w.coeng2]
      - q: { es: "佢話佢唔知今日有比賽。", en: "He says he didn't know there was a competition today." }
        a: { es: "點會唔知呀？老師講咗三次。", en: "How could he not know? The teacher said it three times." }
        alt: ["點會唔知㗎？", "唔通佢冇聽老師講？"]
        grammar: [g.rhetorical-questions]
        vocab: [w.dim2-wui5]
      - q: { es: "我想加錢買多一張飛。", en: "I want to pay extra to buy another ticket." }
        a: { es: "使乜呀，一張已經夠喇。", en: "No need for that, one is enough." }
        alt: ["使乜加錢呀？", "何必呢，一張夠喇。"]
        grammar: [g.rhetorical-questions]
        vocab: [w.sai2-mat1, w.gaa1-cin2]
      - q: { es: "你哋點樣爭取居民支持？", en: "How are you winning the residents' support?" }
        a: { es: "我哋同每個街坊傾，聽佢哋嘅意見。", en: "We talk to every neighbour and listen to their views." }
        alt: ["同居民傾偈，聽佢哋意見。", "同街坊傾，聽吓佢哋點講。"]
        grammar: [g.rhetorical-questions]
        vocab: [w.zang1-ceoi2]
      - q: { es: "份工人工唔高，值唔值得做？", en: "The pay isn't high; is the job worth doing?" }
        a: { es: "值呀，發展空間好大，何必淨係睇人工？", en: "Yes, there's lots of room to grow; why look only at the pay?" }
        alt: ["值得，發展空間好大。", "值，人工唔係最重要。"]
        grammar: [g.rhetorical-questions]
        vocab: [w.zik6, w.hung1-gaan1]
    texts:
      - title: "居民大會通告"
        es: ["呢個星期六下晝兩點，喺天后廟前面開居民大會。", "討論渡輪加價同起橋計劃。", "歡迎大家提出意見，爭取自己嘅權利。"]
        en: ["This Saturday at two in the afternoon there will be a residents' meeting in front of the Tin Hau temple.", "We'll discuss the ferry fare rise and the bridge plan.", "Everyone is welcome to give their views and stand up for their rights."]
        grammar: [g.rhetorical-questions]
        vocab: [w.tai4-ceot1, w.zang1-ceoi2, w.kyun4-lei6]
      - title: "比賽後感"
        es: ["我哋輸咗，但係我覺得自己表現唔差。", "評判話我哋嘅背景資料好豐富，不過回應唔夠快。", "下年再嚟，邊有人會永遠都輸？"]
        en: ["We lost, but I think I didn't perform badly.", "The judges said our background research was rich, but our responses weren't quick enough.", "We'll be back next year; nobody loses forever, do they?"]
        grammar: [g.rhetorical-questions]
        vocab: [w.biu2-jin6, w.bui3-ging2, w.wui4-jing3, w.ping4-pun3]
      - title: "辯論貼士"
        es: ["準備嘅過程要有系統，唔好心急。", "對方話有危機，你就問：「規模有幾大？」", "記住，評判睇你嘅水平，唔會理你嘅地位。"]
        en: ["Prepare systematically; don't rush.", "If the other side says there's a crisis, ask: 'How big is it?'", "Remember, the judges look at your standard, not your status."]
        grammar: [g.rhetorical-questions, g.jau-gei-how]
        vocab: [w.gwo3-cing4, w.hai6-tung2, w.ngai4-gei1, w.kwai1-mou4, w.seoi2-ping4, w.dei6-wai2]
    spicy:
      - { es: "邊有人約會帶埋筆記㗎？你當我係辯論對手呀？", en: "Who brings notes on a date? Do you think I'm your debating opponent?", altEs: ["邊有人約會帶埋筆記㗎？你當我係你辯論對手呀？"], grammar: [g.rhetorical-questions], vocab: [w.bin1-jau5, w.bat1-gei3, w.deoi3-sau2] }
      - { es: "唔通你專登搭錯船，想同我多啲時間？", en: "Don't tell me you caught the wrong ferry on purpose to spend more time with me?", altEs: ["難道你專登搭錯船，想同我多啲時間？"], grammar: [g.rhetorical-questions], vocab: [w.m4-tung1] }
      - { es: "我投你一票：最佳約會對象。", en: "I'm casting my vote for you: best date ever.", altEs: ["我投你一票，最佳約會對象。"], grammar: [g.rhetorical-questions], vocab: [w.piu3, w.zeoi3-gaai1] }
      - { es: "使乜咁緊張？我又唔會食咗你。", en: "Why so nervous? I'm not going to eat you.", altEs: ["使乜咁緊張呀？我又唔會食咗你。"], grammar: [g.rhetorical-questions], vocab: [w.sai2-mat1, w.gan2-zoeng1] }
      - { es: "點會唔記得你生日？我只係想畀你一個驚喜。", en: "How could I forget your birthday? I just wanted to surprise you.", altEs: ["點會唔記得你生日呀？我只係想畀個驚喜你。"], grammar: [g.rhetorical-questions], vocab: [w.dim2-wui5, w.ging1-hei2] }
dialogues:
  - id: b2.u08.d1
    title: 天后廟前面嘅居民大會
    context: At a residents' meeting outside Peng Chau's Tin Hau temple, Mr Ho argues for a bridge to Lantau and Miss Leung argues against it.
    lines:
      - { speaker: 主席, es: "多謝大家今日嚟。首先請何生講吓佢支持起橋嘅理由。", en: "Thank you all for coming today. First, Mr Ho will explain why he supports the bridge." }
      - { speaker: 何生, es: "首先，起橋之後去醫院快好多；其次，年輕人唔使搬走。", en: "First, once there's a bridge it'll be much quicker to get to hospital; second, young people won't have to move away." }
      - { speaker: 何生, es: "再加上，遊客多咗，島上啲舖頭生意都會好啲。", en: "On top of that, with more tourists, the island's shops will do better business." }
      - { speaker: 梁小姐, es: "何生講得啱，交通固然重要，但係成本點計？", en: "Mr Ho is right that transport is important, but what about the cost?" }
      - { speaker: 梁小姐, es: "即使政府資助，條橋都要用十幾年先起好。", en: "Even with government funding, the bridge would take over ten years to build." }
      - { speaker: 何生, es: "唔通我哋就乜都唔做？坪洲嘅人口越嚟越少喇。", en: "So are we supposed to do nothing at all? Peng Chau's population keeps shrinking." }
      - { speaker: 梁小姐, es: "我唔係話乜都唔做。加多啲夜晚嘅渡輪，咪一樣解決到問題？", en: "I'm not saying do nothing. Wouldn't adding more night ferries solve the problem just as well?" }
      - { speaker: 主席, es: "兩位都有道理。大家有冇其他意見想補充？", en: "You both make sense. Does anyone have any other views to add?" }
      - { speaker: 居民, es: "我住咗坪洲五十年，最鍾意呢度靜。邊有人想坪洲變成旺角㗎？", en: "I've lived on Peng Chau for fifty years and what I love most is the quiet. Who wants Peng Chau turned into Mong Kok?" }
      - { speaker: 主席, es: "總括嚟講，大家都想改善交通，但係對起橋未有共識。我哋下個月再投票。", en: "To sum up, everyone wants better transport, but there's no consensus on the bridge yet. We'll vote next month." }
    questions:
      - { q: "何生支持起橋，有咩理由？", options: ["去醫院快啲，年輕人唔使搬走", "可以起多幾間酒店", "渡輪會平啲"], answer: 0, explain: "Mr Ho's first two points: quicker access to hospital, and young people won't have to move away." }
      - { q: "梁小姐建議點樣做？", options: ["即刻起橋", "加多啲夜晚嘅渡輪", "乜都唔做"], answer: 1, explain: "Miss Leung suggests adding more night ferries instead." }
      - { q: "嗰位住咗五十年嘅居民點諗？", options: ["佢想坪洲變得熱鬧啲", "佢鍾意坪洲靜，唔想坪洲變成旺角", "佢想搬去市區"], answer: 1, explain: "He loves the quiet and asks rhetorically who would want Peng Chau turned into Mong Kok." }
      - { q: "大會最後有咩結果？", options: ["決定起橋", "未有共識，下個月再投票", "決定加船費"], answer: 1, explain: "The chair sums up: there's no consensus yet, and they'll vote next month." }
