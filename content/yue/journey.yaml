# The journey: regions (one per level), stops (one per unit, in unit order), souvenirs.
# Text in `es` is the target language (Hong Kong Cantonese, traditional characters); `en` is English.
# A1 facts: simple present-tense Cantonese, ≤ 45 characters; A2 ≤ 52; B1+ ≤ 67.
regions:
  - level: a1
    name: Hong Kong Island 港島
    es: 高樓、海港同叮叮
    stops:
      - name: Hong Kong International Airport 赤鱲角機場
        emoji: 🛬
        es: 香港，你好！
        en: Hello, Hong Kong!
        fact:
          es: 香港國際機場喺赤鱲角，係一個好大嘅機場。每日有好多飛機。Leo、Bonchita同Luna喺度落機。
          en: Hong Kong International Airport is at Chek Lap Kok. It is a very big airport. There are lots of planes every day. Leo, Bonchita and Luna get off the plane here.
      - name: Central 中環
        emoji: 🏙️
        es: 高樓大廈
        en: Skyscrapers
        fact:
          es: 中環喺香港島，有好多高樓、銀行同公司。好多人喺中環返工，中午出街食飯。
          en: Central is on Hong Kong Island. It has lots of tall buildings, banks and companies. Many people work in Central and go out to eat at noon.
      - name: Victoria Peak 山頂
        emoji: 🚞
        es: 坐纜車上山頂
        en: Up the Peak by tram
        fact:
          es: 太平山係香港島最高嘅山，有五百五十二米高。好多人坐山頂纜車上去睇香港。
          en: Victoria Peak is the highest hill on Hong Kong Island. It is 552 metres high. Many people take the Peak Tram up to look at Hong Kong.
      - name: Star Ferry 天星小輪
        emoji: ⛴️
        es: 坐船過海
        en: Across the harbour by boat
        fact:
          es: 天星小輪喺維多利亞港行，由中環去尖沙咀。坐船好平，又好快。
          en: The Star Ferry sails on Victoria Harbour, from Central to Tsim Sha Tsui. The boat is very cheap and very quick.
      - name: Sheung Wan 上環
        emoji: 🐟
        es: 海味同老廟
        en: Dried seafood and an old temple
        fact:
          es: 上環有好多舊舖頭，賣海味同中藥。上環仲有一間好舊嘅廟，叫文武廟。
          en: Sheung Wan has lots of old shops selling dried seafood and Chinese medicine. Sheung Wan also has a very old temple, called Man Mo Temple.
      - name: Wan Chai 灣仔
        emoji: 🍜
        es: 街市同茶餐廳
        en: Markets and cafés
        fact:
          es: 灣仔海邊有一個好大嘅展覽中心。灣仔仲有好多街市同茶餐廳。
          en: Wan Chai has a very big convention centre by the sea. Wan Chai also has lots of markets and cha chaan teng cafés.
      - name: Causeway Bay 銅鑼灣
        emoji: 🛍️
        es: 去買嘢
        en: Going shopping
        fact:
          es: 銅鑼灣有好多商場同舖頭，日日都有好多人。好多人喺度買衫、買鞋同食嘢。
          en: Causeway Bay has lots of shopping malls and shops, and it is busy every day. Many people buy clothes and shoes and eat here.
      - name: Happy Valley 跑馬地
        emoji: 🏇
        es: 星期三晚睇跑馬
        en: Wednesday night at the races
        fact:
          es: 跑馬地有一個好大嘅馬場。好多人星期三晚去睇跑馬，飲嘢同食嘢。
          en: Happy Valley has a very big racecourse. Many people go to watch the horse racing on Wednesday night, and have drinks and food.
      - name: Stanley 赤柱
        emoji: 🏖️
        es: 海灘同市集
        en: Beach and market
        fact:
          es: 赤柱喺南區，有海灘、市集，仲有好多餐廳。星期日好多人去赤柱。
          en: Stanley is in the Southern District of Hong Kong Island. It has a beach, a market and lots of restaurants. On Sundays lots of people go to Stanley.
      - name: Aberdeen 香港仔
        emoji: 🚣
        es: 坐舢舨遊海
        en: A sampan ride
        fact:
          es: 香港仔有好多漁船。你可以坐舢舨去睇漁船。海洋公園都喺附近。
          en: Aberdeen has lots of fishing boats. You can take a sampan to look at the fishing boats. Ocean Park is nearby too.
      - name: Kennedy Town 堅尼地城
        emoji: 🚋
        es: 叮叮總站
        en: The tram terminus
        fact:
          es: 堅尼地城喺香港島西面，有電車總站。香港人叫電車做「叮叮」，坐叮叮好平。
          en: Kennedy Town is in the west of Hong Kong Island and has a tram terminus. Hongkongers call the tram "ding ding". Riding the tram is very cheap.
      - name: Quarry Bay 鰂魚涌
        emoji: 🏢
        es: 怪獸大廈
        en: The Monster Building
        fact:
          es: 鰂魚涌有幾座好舊、好高嘅大廈，好多人叫呢度做「怪獸大廈」。好多人嚟呢度影相。
          en: Quarry Bay has a few very old, very tall residential blocks that many people call the "Monster Building". Lots of people come here to take photos.
  - level: a2
    name: Kowloon 九龍
    es: 霓虹燈、街市同廟宇
    stops:
      - name: Tsim Sha Tsui 尖沙咀
        emoji: 🌃
        es: 海旁同鐘樓
        en: The waterfront and the clock tower
        fact:
          es: 尖沙咀海旁有星光大道同鐘樓。鐘樓喺一九一五年起好，以前係九廣鐵路火車站嘅一部分。
          en: The Tsim Sha Tsui waterfront has the Avenue of Stars and the Clock Tower. The clock tower was finished in 1915; it used to be part of the Kowloon–Canton Railway station.
      - name: Mong Kok 旺角
        emoji: 🐠
        es: 金魚街同波鞋街
        en: Goldfish Street and Sneakers Street
        fact:
          es: 旺角有金魚街、女人街同波鞋街。呢度人好多，健力士世界紀錄以前話佢係世界上人口最密嘅地方。
          en: Mong Kok has Goldfish Street, the Ladies' Market and Sneakers Street. It is very crowded; Guinness World Records once called it the most densely populated place in the world.
      - name: Yau Ma Tei 油麻地
        emoji: 🍉
        es: 果欄同天后廟
        en: The fruit market and the Tin Hau Temple
        fact:
          es: 油麻地有天后廟同果欄。果欄喺一九一三年開始做生意，到而家仲係夜晚最忙。
          en: Yau Ma Tei has a Tin Hau temple and the wholesale fruit market. The fruit market opened in 1913 and it is still busiest at night.
      - name: Sham Shui Po 深水埗
        emoji: 🔌
        es: 電器同布料
        en: Gadgets and fabric
        fact:
          es: 深水埗有鴨寮街，賣舊電器同電子零件。附近仲有布街，同埋好多平嘢食。
          en: Sham Shui Po has Apliu Street, which sells second-hand electrical goods and electronic parts. Nearby there is also a fabric street and lots of cheap food.
      - name: Wong Tai Sin 黃大仙
        emoji: 🏮
        es: 求籤
        en: Shaking fortune sticks
        fact:
          es: 黃大仙祠係香港好出名嘅廟。好多人嚟拜神同求籤，新年嘅時候特別多人。
          en: Wong Tai Sin Temple is a very famous temple in Hong Kong. Many people come to pray and shake fortune sticks, and it is especially crowded at Chinese New Year.
      - name: Kowloon City 九龍城
        emoji: 🍛
        es: 泰國菜同舊機場
        en: Thai food and the old airport
        fact:
          es: 九龍城有好多泰國餐廳。以前飛機去啟德機場，要喺九龍城啲樓頂上面好低咁飛過。
          en: Kowloon City has lots of Thai restaurants. In the past, planes flying to Kai Tak Airport passed very low over the rooftops of Kowloon City.
      - name: Diamond Hill 鑽石山 · Nan Lian Garden 南蓮園池
        emoji: 🌸
        es: 唐朝花園
        en: A Tang-style garden
        fact:
          es: 南蓮園池喺鑽石山，係一個唐朝風格嘅中式園林，二零零六年開放。隔籬就係志蓮淨苑。
          en: Nan Lian Garden is in Diamond Hill. It is a Chinese garden in Tang dynasty style that opened in 2006. Chi Lin Nunnery is right next to it.
      - name: Hung Hom 紅磡
        emoji: 🎤
        es: 紅館開騷
        en: A concert at the Coliseum
        fact:
          es: 紅磡有香港體育館，香港人叫佢做「紅館」。佢喺一九八三年開幕，好多歌手都喺度開過演唱會。
          en: Hung Hom has the Hong Kong Coliseum, which Hongkongers call "Hung Kun". It opened in 1983 and lots of singers have given concerts there.
      - name: Lei Yue Mun 鯉魚門
        emoji: 🦞
        es: 揀海鮮
        en: Choosing your seafood
        fact:
          es: 鯉魚門係一條細細嘅漁村，有好多海鮮酒家。你先喺魚檔揀海鮮，再拎去餐廳幫你煮。
          en: Lei Yue Mun is a small fishing village with lots of seafood restaurants. You first choose seafood at a fish stall, then take it to a restaurant to cook for you.
      - name: Jordan 佐敦
        emoji: 🥚
        es: 炒蛋同夜市
        en: Scrambled eggs and a night market
        fact:
          es: 佐敦有澳洲牛奶公司，佢嘅炒蛋同燉奶好出名。夜晚可以去廟街夜市行吓。
          en: Jordan has the Australia Dairy Company, famous for its scrambled eggs and steamed milk pudding. In the evening you can stroll around the Temple Street Night Market.
      - name: Kai Tak 啟德
        emoji: ✈️
        es: 舊機場變新地方
        en: The old airport, reborn
        fact:
          es: 啟德機場喺一九九八年關閉，飛機改咗去赤鱲角。而家呢度有郵輪碼頭同啟德體育園。
          en: Kai Tak Airport closed in 1998 and the planes moved to Chek Lap Kok. Today the site has a cruise terminal and Kai Tak Sports Park.
      - name: Kowloon Walled City Park 九龍寨城公園
        emoji: 🏯
        es: 寨城變公園
        en: From walled city to park
        fact:
          es: 九龍寨城以前住咗三萬幾人，一九九三年開始拆。一九九五年，呢度變成一個中式公園。
          en: More than thirty thousand people once lived in Kowloon Walled City; demolition began in 1993. In 1995 the site became a Chinese-style park.
  - level: b1
    name: New Territories 新界
    es: 圍村、山路同濕地
    stops:
      - name: Sha Tin 沙田
        emoji: 🐎
        es: 車公廟轉風車
        en: Turning the windmill at Che Kung Temple
        fact:
          es: 沙田由農村變成新市鎮，城門河兩邊有單車徑。年初二好多人去車公廟轉風車，希望新一年好運。
          en: Sha Tin grew from farmland into a new town, with cycle paths along both banks of the Shing Mun River. On the second day of Chinese New Year crowds turn the windmill at Che Kung Temple for luck.
      - name: Tai Po 大埔
        emoji: 🚂
        es: 舊火車站
        en: The old railway station
        fact:
          es: 大埔有香港鐵路博物館，原本係舊大埔墟火車站，喺一九一三年起好。入面可以睇到舊火車卡同中式嘅車站建築。
          en: Tai Po has the Hong Kong Railway Museum, which was the old Tai Po Market station, built in 1913. Inside you can see old carriages and a Chinese-style station building.
      - name: Sai Kung 西貢
        emoji: 🌋
        es: 火山石柱
        en: Volcanic rock columns
        fact:
          es: 西貢萬宜水庫附近有好多六角形石柱，係大約一億四千萬年前火山爆發之後留低嘅，而家係世界地質公園嘅一部分。
          en: Near High Island Reservoir in Sai Kung there are many hexagonal rock columns, left by a volcanic eruption about 140 million years ago. They are now part of a UNESCO Global Geopark.
      - name: Tsuen Wan 荃灣
        emoji: 🏘️
        es: 客家圍村
        en: A Hakka walled village
        fact:
          es: 荃灣以前係客家人嘅村落，而家係新市鎮。三棟屋係客家陳氏喺一七八六年起嘅圍村，而家變咗博物館。
          en: Tsuen Wan was once a cluster of Hakka villages and is now a new town. Sam Tung Uk is a walled village built by the Hakka Chan clan in 1786, and it is now a museum.
      - name: Yuen Long 元朗
        emoji: 🥮
        es: 老婆餅
        en: Wife cakes
        fact:
          es: 元朗嘅老婆餅同雞仔餅好出名，好多人專登入元朗買手信。元朗仲有好多圍村同魚塘。
          en: Yuen Long is famous for its wife cakes and "chicken" biscuits, and many people make the trip just to buy them as gifts. Yuen Long also has many walled villages and fish ponds.
      - name: Lam Tsuen 林村
        emoji: 🌳
        es: 許願樹
        en: The wishing trees
        fact:
          es: 以前新年嘅時候，好多人將寶牒掟上林村許願樹。二零零五年有樹枝斷咗，而家大家改咗將寶牒掛喺木架上面。
          en: In the past, at Chinese New Year, people threw wish placards up into the Lam Tsuen wishing trees. In 2005 a branch broke, and now people hang their placards on wooden racks instead.
      - name: Mai Po 米埔
        emoji: 🦢
        es: 候鳥過冬
        en: Winter birds
        fact:
          es: 米埔自然保護區係一大片濕地。每年冬天有幾萬隻候鳥飛嚟過冬，包括瀕危嘅黑臉琵鷺。
          en: Mai Po Nature Reserve is a large wetland. Every winter tens of thousands of migratory birds come to spend the winter there, including the endangered black-faced spoonbill.
      - name: Tai Mei Tuk 大美督
        emoji: 🚲
        es: 水壩上踩單車
        en: Cycling on the dam
        fact:
          es: 大美督喺船灣淡水湖旁邊。呢個水塘係用水壩將一個海灣圍起嚟，再抽走海水而成，好多人喺壩上面踩單車。
          en: Tai Mei Tuk is next to Plover Cove Reservoir. The reservoir was made by damming off a sea inlet and pumping out the seawater, and lots of people cycle along the dam.
      - name: Tuen Mun 屯門
        emoji: 🛕
        es: 古寺同輕鐵
        en: An old monastery and the light rail
        fact:
          es: 屯門嘅青山禪院係香港歷史好悠久嘅佛寺。一九八八年開始，輕鐵將屯門、元朗同後來嘅天水圍連埋一齊。
          en: Tsing Shan Monastery in Tuen Mun is one of Hong Kong's oldest Buddhist temples. Since 1988 the Light Rail has linked Tuen Mun, Yuen Long and, later, Tin Shui Wai.
      - name: Fanling 粉嶺
        emoji: ⛳
        es: 龍躍頭文物徑
        en: The Lung Yeuk Tau Heritage Trail
        fact:
          es: 粉嶺有龍躍頭文物徑，沿路有圍村、祠堂同老屋。鄧氏族人喺呢度住咗幾百年，到而家仲有後人住喺圍村入面。
          en: Fanling has the Lung Yeuk Tau Heritage Trail, lined with walled villages, ancestral halls and old houses. The Tang clan has lived here for centuries, and descendants still live in the villages.
      - name: Lion Rock 獅子山
        emoji: 🦁
        es: 獅子山下
        en: Below the Lion Rock
        fact:
          es: 獅子山好似一隻伏喺度嘅獅子。一九七九年有首歌叫《獅子山下》，講香港人同舟共濟，到今日好多人都識唱。
          en: Lion Rock looks like a crouching lion. In 1979 a song called "Below the Lion Rock" sang of Hongkongers pulling together, and many people can still sing it today.
      - name: Ping Shan Heritage Trail 屏山文物徑
        emoji: 🗼
        es: 香港唯一嘅古塔
        en: Hong Kong's only ancient pagoda
        fact:
          es: 屏山文物徑喺一九九三年開放，係香港第一條文物徑。沿路有鄧氏宗祠同聚星樓，聚星樓係香港唯一嘅古塔。
          en: The Ping Shan Heritage Trail opened in 1993 and was Hong Kong's first heritage trail. Along it are the Tang Ancestral Hall and Tsui Sing Lau, Hong Kong's only ancient pagoda.
  - level: b2
    name: Outlying Islands 離島
    es: 渡輪、漁村同山頂
    stops:
      - name: Tung Chung 東涌
        emoji: 🚠
        es: 纜車起點
        en: Where the cable car starts
        fact:
          es: 東涌喺大嶼山北邊，有港鐵站同昂坪三六零纜車站。附近嘅東涌炮台喺一八三二年建成，用嚟防海盜。
          en: Tung Chung is on the north of Lantau Island, with an MTR station and the Ngong Ping 360 cable car terminal. The nearby Tung Chung Fort was built in 1832 to guard against pirates.
      - name: Ngong Ping 昂坪 · Big Buddha 天壇大佛
        emoji: 🧘
        es: 二百六十八級樓梯
        en: Two hundred and sixty-eight steps
        fact:
          es: 天壇大佛喺昂坪寶蓮寺對面，一九九三年開光，連底座有三十四米高。想近距離睇佢，要行二百六十八級樓梯。
          en: The Big Buddha stands opposite Po Lin Monastery at Ngong Ping. It was consecrated in 1993 and is 34 metres tall with its base. To see it up close you climb 268 steps.
      - name: Tai O 大澳
        emoji: 🐬
        es: 棚屋同白海豚
        en: Stilt houses and pink dolphins
        fact:
          es: 大澳係一條漁村，好多人住喺水上嘅棚屋。蝦醬同鹹魚係呢度嘅特產，運氣好仲可以喺海上見到中華白海豚。
          en: Tai O is a fishing village where many people live in stilt houses over the water. Shrimp paste and salted fish are local specialities, and with luck you can spot Chinese white dolphins at sea.
      - name: Mui Wo 梅窩
        emoji: 🐃
        es: 路邊嘅水牛
        en: Buffalo by the road
        fact:
          es: 梅窩喺大嶼山東邊，由中環坐渡輪就可以到。喺路邊同田入面經常見到水牛，佢哋以前係幫農民耕田嘅。
          en: Mui Wo is on the east side of Lantau, reachable by ferry from Central. Water buffalo are often seen by the road and in the fields; they used to plough the farmers' land.
      - name: Lantau Peak 鳳凰山
        emoji: 🌄
        es: 喺山頂睇日出
        en: Sunrise from the summit
        fact:
          es: 鳳凰山有九百三十四米高，係香港第二高嘅山，淨係矮過大帽山。好多行山友半夜出發，喺山頂等睇日出。
          en: Lantau Peak is 934 metres high, Hong Kong's second-highest mountain after Tai Mo Shan. Many hikers set off in the middle of the night to watch the sunrise from the top.
      - name: Cheung Chau 長洲
        emoji: 🥯
        es: 搶包山
        en: Scrambling up the bun tower
        fact:
          es: 長洲太平清醮有飄色巡遊同搶包山比賽。包山上面掛滿平安包，參加者要喺三分鐘之內爬上去搶包。
          en: The Cheung Chau Bun Festival has a floating children parade and the bun-scrambling contest. The tower is covered in lucky buns, and climbers have three minutes to grab as many as they can.
      - name: Lamma Island 南丫島
        emoji: 🌬️
        es: 冇車嘅島
        en: An island without cars
        fact:
          es: 南丫島冇私家車，大家行路或者踩單車。島上有發電廠同一部風力發電機，索罟灣嘅海鮮餐廳好出名。
          en: Lamma Island has no private cars; people walk or cycle. The island has a power station and a wind turbine, and the seafood restaurants of Sok Kwu Wan are famous.
      - name: Peng Chau 坪洲
        emoji: 🔥
        es: 火柴廠嘅回憶
        en: Memories of the match factory
        fact:
          es: 坪洲係一個細細嘅島，以前有火柴廠同石灰窰，好多居民喺工廠做嘢。而家島上好寧靜，仲有一間二百幾年歷史嘅天后廟。
          en: Peng Chau is a small island that once had a match factory and lime kilns where many residents worked. Today it is quiet, and it has a Tin Hau temple more than two hundred years old.
      - name: Po Toi 蒲台島
        emoji: 🪨
        es: 奇石同石刻
        en: Strange rocks and rock carvings
        fact:
          es: 蒲台島喺香港最南面，島上有好多形狀古怪嘅石頭，例如佛手岩同靈龜上山，仲有幾千年前留低嘅古代石刻。
          en: Po Toi lies at the southern edge of Hong Kong. It has many oddly shaped rocks, such as Buddha's Palm Rock and Tortoise Climbing the Hill, and ancient rock carvings thousands of years old.
      - name: Discovery Bay 愉景灣
        emoji: ⛵
        es: 冇私家車嘅小區
        en: A neighbourhood without cars
        fact:
          es: 愉景灣喺大嶼山東北面，八十年代初開始有居民入住。區內唔准私家車，居民主要坐巴士、渡輪或者揸高爾夫球車。
          en: Discovery Bay is on the north-east of Lantau; its first residents moved in during the early 1980s. Private cars are not allowed, so residents mainly use buses, ferries or golf carts.
      - name: Tap Mun 塔門
        emoji: 🐄
        es: 草地同牛
        en: Grassland and cows
        fact:
          es: 塔門喺西貢東北面嘅海上。島上有一大片草地，經常見到牛，仲有一間幾百年歷史嘅天后廟。
          en: Tap Mun lies in the sea north-east of Sai Kung. It has a big stretch of grassland where cows graze, and a Tin Hau temple several centuries old.
      - name: Sharp Island 橋咀洲
        emoji: 🍍
        es: 菠蘿包石
        en: Pineapple-bun rocks
        fact:
          es: 橋咀洲喺西貢對開。退潮嘅時候會出現一條沙堤，可以行過去橋頭。島上仲有一啲好似菠蘿包嘅火山石。
          en: Sharp Island lies off Sai Kung. At low tide a sandbar appears and you can walk across to Kiu Tau. The island also has volcanic rocks that look like pineapple buns.
  - level: c1
    name: Macau 澳門
    es: 葡國風情同中式廟宇
    stops:
      - name: Senado Square 議事亭前地
        emoji: ⛲
        es: 黑白波浪路
        en: Black-and-white wave paving
        fact:
          es: 議事亭前地鋪滿黑白兩色嘅波浪形碎石路，係由葡萄牙傳入嘅工藝。二零零五年，澳門歷史城區列入《世界遺產名錄》。
          en: Senado Square is paved with black-and-white wave-patterned stones, a craft brought from Portugal. In 2005 the Historic Centre of Macau was inscribed on the World Heritage List.
      - name: Ruins of St Paul's 大三巴牌坊
        emoji: ⛪
        es: 淨低一幅牆
        en: Only the façade remains
        fact:
          es: 大三巴牌坊原本係聖保祿教堂嘅前壁。一八三五年一場大火燒毀咗教堂，淨低呢幅石牆，而家成為澳門最具代表性嘅標誌。
          en: The Ruins of St Paul's are the façade of the former Church of St Paul. A fire in 1835 destroyed the church and left only this stone wall, now Macau's best-known symbol.
      - name: Monte Fort 大炮台
        emoji: 💣
        es: 擊退荷蘭人
        en: Driving back the Dutch
        fact:
          es: 大炮台由耶穌會喺十七世紀初興建。一六二二年荷蘭艦隊進攻澳門，守軍喺呢度開炮擊退佢哋。而家炮台入面有澳門博物館。
          en: Monte Fort was built by the Jesuits in the early seventeenth century. When a Dutch fleet attacked Macau in 1622, defenders fired from here and drove them back. Today the fort houses the Macau Museum.
      - name: A-Ma Temple 媽閣廟
        emoji: 🏮
        es: 澳門個名嘅由來
        en: Where Macau got its name
        fact:
          es: 媽閣廟供奉海神媽祖，係澳門最古老嘅廟宇之一。相傳葡萄牙人喺附近上岸，問當地人呢度叫咩名，聽到「媽閣」，於是叫呢度做 Macau。
          en: A-Ma Temple honours the sea goddess Mazu and is one of Macau's oldest temples. Legend says the Portuguese landed nearby, asked the name of the place, heard "Ma Kok" and called it Macau.
      - name: Macau Tower 澳門旅遊塔
        emoji: 🪂
        es: 二百三十三米笨豬跳
        en: A 233-metre bungee jump
        fact:
          es: 澳門旅遊塔高三百三十八米，二零零一年開幕。塔上有一個二百三十三米高嘅笨豬跳，曾經被健力士列為世界最高嘅商業笨豬跳。
          en: Macau Tower is 338 metres tall and opened in 2001. It has a 233-metre bungee jump that Guinness World Records listed as the world's highest commercial bungee jump.
      - name: Taipa Village 氹仔舊城區
        emoji: 🍪
        es: 官也街買手信
        en: Souvenirs on Rua do Cunha
        fact:
          es: 氹仔舊城區嘅官也街有好多手信舖，杏仁餅同豬扒包都好受歡迎。附近嘅龍環葡韻有五間一九二一年落成嘅綠色葡式住宅。
          en: Rua do Cunha in Taipa Village is full of souvenir shops, and almond cookies and pork chop buns are favourites. The nearby Taipa Houses are five green Portuguese-style homes completed in 1921.
      - name: Coloane 路環
        emoji: 🥧
        es: 葡撻嘅故鄉
        en: Home of the Macau egg tart
        fact:
          es: 路環喺澳門南面，比較寧靜，有聖方濟各聖堂同黑沙海灘。英國人安德魯一九八九年喺度開咗間餅店，令葡撻喺澳門流行起嚟。
          en: Coloane, in the south of Macau, is quieter, with the Chapel of St Francis Xavier and Hac Sa beach. Englishman Andrew Stow opened a bakery here in 1989 and made the Portuguese egg tart popular in Macau.
      - name: Guia Lighthouse 東望洋燈塔
        emoji: 💡
        es: 中國沿海第一座現代燈塔
        en: The first modern lighthouse on the China coast
        fact:
          es: 東望洋燈塔喺一八六五年啟用，係中國沿海第一座現代燈塔。佢旁邊有東望洋炮台同聖母雪地殿聖堂，入面仲有古老嘅壁畫。
          en: Guia Lighthouse began operating in 1865, the first modern lighthouse on the China coast. Beside it are Guia Fortress and the Chapel of Our Lady of Guia, which has old murals inside.
      - name: Lou Lim Ieoc Garden 盧廉若公園
        emoji: 🪷
        es: 蘇州風格嘅花園
        en: A Suzhou-style garden
        fact:
          es: 盧廉若公園原本係富商盧九家族嘅私人花園，仿照蘇州園林設計，有荷花池同九曲橋。花園喺一九七四年起對外開放。
          en: Lou Lim Ieoc Garden was the private garden of the wealthy merchant Lou Kau's family, designed after the gardens of Suzhou with a lotus pond and a zigzag bridge. It has been open to the public since 1974.
      - name: Cotai 路氹
        emoji: 🎰
        es: 填海得嚟嘅城
        en: A city built on reclaimed land
        fact:
          es: 路氹原本係氹仔同路環之間嘅海，填海之後兩個島連埋一齊。而家呢度有好多大型酒店同賭場，夜晚燈光非常耀眼。
          en: Cotai was once the sea between Taipa and Coloane; land reclamation joined the two islands. Today it is full of huge hotels and casinos, and its lights are dazzling at night.
  - level: c2
    name: Guangzhou & Foshan 廣州同佛山
    es: 珠江三角洲，粵語嘅老家
    stops:
      - name: Shamian Island 沙面
        emoji: 🌿
        es: 珠江邊嘅歐式小島
        en: A European-style island on the Pearl River
        fact:
          es: 沙面係珠江邊嘅一個小島，十九世紀中葉成為英法租界。島上保留咗過百座歐式建築，綠樹成蔭，係新人影婚紗相嘅熱門地方。
          en: Shamian is a small island on the Pearl River that became a British and French concession in the mid-nineteenth century. Over a hundred European-style buildings survive under shady trees, and couples flock there for wedding photos.
      - name: Chen Clan Academy 陳家祠
        emoji: 🪵
        es: 木雕、磚雕同陶塑
        en: Wood, brick and ceramic carvings
        fact:
          es: 陳家祠喺一八九四年落成，係廣東七十二個縣嘅陳姓族人合資興建嘅書院。而家係廣東民間工藝博物館，木雕、磚雕同陶塑都非常精細。
          en: The Chen Clan Academy was completed in 1894, paid for jointly by Chen clans from seventy-two counties of Guangdong. Now the Guangdong Folk Art Museum, its wood, brick and ceramic carvings are exquisite.
      - name: Canton Tower 廣州塔
        emoji: 🗼
        es: 小蠻腰
        en: The "slim waist"
        fact:
          es: 廣州塔高六百米，喺二零一零年落成，因為中間幼、上下闊，廣州人叫佢做「小蠻腰」。塔頂嘅摩天輪喺四百幾米高空慢慢轉。
          en: Canton Tower is 600 metres tall and was completed in 2010; because it is narrow in the middle, locals call it the "slim waist". Its rooftop Ferris wheel turns slowly more than 400 metres up.
      - name: Beijing Road 北京路
        emoji: 🛤️
        es: 千年古道
        en: A thousand-year-old road
        fact:
          es: 北京路係廣州歷史最悠久嘅商業街之一。行人路上面有玻璃罩住嘅古道遺址，可以睇到由唐朝到民國一層疊一層嘅路面。
          en: Beijing Road is one of Guangzhou's oldest shopping streets. Under glass panels in the pavement you can see the remains of ancient roads, layer upon layer from the Tang dynasty to the Republic.
      - name: Yuexiu Park 越秀公園
        emoji: 🐐
        es: 五羊嘅傳說
        en: The legend of the five rams
        fact:
          es: 越秀公園有五羊石像。相傳五位仙人騎住五隻羊嚟到廣州，留低稻穗祝福呢度永無饑荒，所以廣州又叫「羊城」。
          en: Yuexiu Park has the Five Rams statue. Legend says five immortals rode five rams to Guangzhou and left ears of rice so the city would never go hungry, which is why Guangzhou is called the "City of Rams".
      - name: Foshan Ancestral Temple 佛山祖廟
        emoji: 🥋
        es: 醒獅同功夫
        en: Lion dance and kung fu
        fact:
          es: 佛山祖廟始建於北宋，供奉北帝。廟入面有黃飛鴻紀念館同葉問堂，每日都有醒獅同功夫表演，吸引好多遊客。
          en: Foshan Ancestral Temple was founded in the Northern Song dynasty and honours the god Beidi. Inside are the Wong Fei-hung Memorial Hall and Ip Man Hall, with lion dance and kung fu shows every day.
      - name: Shunde 順德
        emoji: 🍮
        es: 世界美食之都
        en: A world capital of gastronomy
        fact:
          es: 順德喺二零一四年獲聯合國教科文組織評為「世界美食之都」。雙皮奶、魚生同大良炒牛奶都係當地嘅名菜，好多人專程嚟食。
          en: In 2014 UNESCO named Shunde a Creative City of Gastronomy. Double-skin milk pudding, raw fish and Daliang fried milk are local specialities that people travel just to taste.
      - name: Victoria Harbour 維多利亞港 · Home again
        emoji: 🎆
        es: 返到香港喇！
        en: Back in Hong Kong!
        fact:
          es: 三隻狗仔由廣州南站坐高鐵返西九龍，最快大約四十七分鐘。晚上八點，維港兩岸嘅大廈一齊上演「幻彩詠香江」燈光匯演。
          en: The three dogs take the high-speed train from Guangzhou South to West Kowloon, about 47 minutes at the fastest. At eight in the evening the towers on both sides of the harbour put on the Symphony of Lights show.
