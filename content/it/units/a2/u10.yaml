id: a2.u10
title: "Da quanto tempo?"
lessons:
  - id: a2.u10.l1
    title: Abito qui da tre anni
    teach: [g.da-since]
    tip: "Something that started in the past and is still going on: present + da. Abito qui da tre anni = I've lived here for three years."
    vocab: [w.da-quanto-tempo, w.da-quando, w.durare, w.secolo, w.decennio, w.epoca, w.periodo, w.mattinata, w.serata, w.nottata, w.lentamente, w.abbonamento, w.pendolare, w.scadere, w.patente]
    sentences:
      - { es: "Abito in Val d'Orcia da tre anni.", en: "I've lived in the Val d'Orcia for three years.", altEs: ["Vivo in Val d'Orcia da tre anni.", "Sono tre anni che abito in Val d'Orcia."], altEn: ["I've been living in the Val d'Orcia for three years."], grammar: [g.da-since], vocab: [w.abitare], transform: { instruction: "Ask a friend how long (tu)", answer: "Da quanto tempo abiti in Val d'Orcia?", alt: ["Da quanto abiti in Val d'Orcia?", "Da quanto tempo vivi in Val d'Orcia?"], en: "How long have you lived in the Val d'Orcia?" } }
      - { es: "Da quanto tempo studi l'italiano? Lo studio da settembre.", en: "How long have you been studying Italian? I've been studying it since September.", altEs: ["Da quanto tempo studi italiano? Lo studio da settembre."], grammar: [g.da-since, g.direct-object-pronouns], vocab: [w.da-quanto-tempo, w.studiare] }
      - { es: "Aspetto l'autobus da mezz'ora!", en: "I've been waiting for the bus for half an hour!", altEs: ["Sono mezz'ora che aspetto l'autobus!"], grammar: [g.da-since], vocab: [w.aspettare, w.autobus], transform: { instruction: "Change to 'we'", answer: "Aspettiamo l'autobus da mezz'ora!", alt: ["Noi aspettiamo l'autobus da mezz'ora!"], en: "We've been waiting for the bus for half an hour!" } }
      - { es: "Non vedo mia madre da Natale.", en: "I haven't seen my mother since Christmas.", altEs: ["Non vedo la mamma da Natale."], grammar: [g.da-since, g.negation], vocab: [w.vedere, w.madre] }
      - { es: "Da quando ho la patente, vado al lavoro in macchina.", en: "Since I got my driving licence, I've driven to work.", altEs: ["Da quando ho la patente vado al lavoro in macchina."], altEn: ["Since I've had my licence, I go to work by car."], grammar: [g.da-since, g.prepositions-transport], vocab: [w.da-quando, w.patente] }
      - { es: "Faccio il pendolare da dieci anni: ogni giorno da Pienza a Siena.", en: "I've been commuting for ten years: from Pienza to Siena every day.", altEs: ["Faccio la pendolare da dieci anni: ogni giorno da Pienza a Siena."], grammar: [g.da-since], vocab: [w.pendolare] }
      - { es: "Ho l'abbonamento del treno da gennaio.", en: "I've had a train season ticket since January.", altEs: ["Da gennaio ho l'abbonamento del treno."], grammar: [g.da-since], vocab: [w.abbonamento, w.gennaio] }
      - { es: "Lavoro in questo agriturismo da due anni.", en: "I've worked at this farm stay for two years.", altEs: ["Lavoro in quest'agriturismo da due anni."], grammar: [g.da-since], vocab: [w.agriturismo, w.lavorare], error: { wrong: "Ho lavorato in questo agriturismo da due anni.", explain: "For something still going on, use the present with da: lavoro qui da due anni.", grammar: g.da-since } }
      - { es: "Ho vissuto a Pienza per un anno, poi sono tornato a Roma.", en: "I lived in Pienza for a year, then I went back to Rome.", altEs: ["Ho abitato a Pienza per un anno, poi sono tornato a Roma.", "Ho vissuto a Pienza per un anno, poi sono tornata a Roma."], grammar: [g.da-since, g.fra-tra-per], vocab: [w.vivere, w.tornare], note: "Finished period: passato prossimo + per." }
      - { es: "Il pecorino di Pienza si fa qui da secoli.", en: "Pienza pecorino has been made here for centuries.", grammar: [g.da-since], vocab: [w.pecorino, w.secolo] }
      - { es: "Da quanto tempo vi conoscete? Ci conosciamo da un decennio.", en: "How long have you known each other? We've known each other for a decade.", altEs: ["Da quanto vi conoscete? Ci conosciamo da dieci anni."], grammar: [g.da-since, g.reflexive-present], vocab: [w.conoscersi, w.decennio] }
      - { es: "Siamo in macchina da stamattina, dopo una nottata senza dormire.", en: "We've been in the car since this morning, after a night without sleep.", altEs: ["Siamo in macchina da stamattina, dopo una notte senza dormire."], grammar: [g.da-since], vocab: [w.stamattina, w.nottata] }
      - { es: "La festa del paese dura tre giorni e finisce domenica.", en: "The village festival lasts three days and ends on Sunday.", grammar: [g.fra-tra-per], vocab: [w.durare, w.festa] }
      - { es: "In quel periodo abitavo a Siena e studiavo all'università.", en: "At that time I lived in Siena and studied at the university.", altEs: ["In quel periodo vivevo a Siena e studiavo all'università."], grammar: [g.imperfetto-uses], vocab: [w.periodo, w.università] }
      - { es: "Le acque calde di Bagno Vignoni sono famose dall'epoca romana.", en: "The hot springs of Bagno Vignoni have been famous since Roman times.", grammar: [g.da-since], vocab: [w.epoca, w.famoso] }
      - { es: "Cammina lentamente: siamo in vacanza da due giorni, non abbiamo fretta.", en: "Walk slowly: we've been on holiday for two days, we're in no hurry.", altEs: ["Cammina piano: siamo in vacanza da due giorni, non abbiamo fretta."], grammar: [g.da-since, g.imperativo-tu], vocab: [w.lentamente, w.fretta] }
    exchanges:
      - q: { es: "Da quanto tempo abiti qui?", en: "How long have you lived here?" }
        a: { es: "Da cinque anni. Prima abitavo a Firenze.", en: "For five years. Before that I lived in Florence." }
        alt: ["Da cinque anni.", "Da poco, da gennaio.", "Da quando sono nato."]
        grammar: [g.da-since]
        vocab: [w.da-quanto-tempo]
      - q: { es: "Da quanto tempo aspetti?", en: "How long have you been waiting?" }
        a: { es: "Da venti minuti: l'autobus è in ritardo.", en: "For twenty minutes: the bus is late." }
        alt: ["Da venti minuti.", "Da un'ora!"]
        grammar: [g.da-since]
        vocab: [w.aspettare, w.in-ritardo]
      - q: { es: "Da quando hai la patente?", en: "How long have you had your driving licence?" }
        a: { es: "Da due anni, ma guido ancora lentamente.", en: "For two years, but I still drive slowly." }
        alt: ["Da due anni.", "Da quando avevo diciotto anni."]
        grammar: [g.da-since]
        vocab: [w.patente, w.lentamente]
      - q: { es: "Com'è andata la serata?", en: "How did the evening go?" }
        a: { es: "Benissimo, ma è durata fino alle due!", en: "Really well, but it went on until two!" }
        alt: ["Benissimo!", "Così così, un po' noiosa."]
        grammar: [g.fra-tra-per]
        vocab: [w.serata, w.durare]
      - q: { es: "Quando scade il tuo abbonamento?", en: "When does your season ticket expire?" }
        a: { es: "Scade alla fine del mese.", en: "It expires at the end of the month." }
        alt: ["A fine mese.", "È già scaduto!"]
        grammar: [g.fra-tra-per]
        vocab: [w.scadere, w.abbonamento]
    texts:
      - title: "Mi presento"
        es: ["Mi chiamo Ilaria e abito a Pienza da sei anni.", "Faccio la pendolare: lavoro a Siena da due anni.", "Ci metto un'ora, ma amo questa valle."]
        en: ["My name is Ilaria and I've lived in Pienza for six years.", "I'm a commuter: I've worked in Siena for two years.", "It takes me an hour, but I love this valley."]
        grammar: [g.da-since, g.metterci-volerci]
        vocab: [w.pendolare]
      - title: "Una mattinata alle terme"
        es: ["Siamo a Bagno Vignoni da stamattina.", "Abbiamo passato tutta la mattinata in acqua.", "Che pace: non guardo il telefono da tre ore!"]
        en: ["We've been in Bagno Vignoni since this morning.", "We spent the whole morning in the water.", "How peaceful: I haven't looked at my phone for three hours!"]
        grammar: [g.da-since]
        vocab: [w.mattinata, w.telefono]
    spicy:
      - { es: "Ti aspetto da un'ora, ma per te aspetto anche un secolo.", en: "I've been waiting for you for an hour, but for you I'd wait a century.", grammar: [g.da-since], vocab: [w.aspettare, w.secolo] }
      - { es: "Da quanto tempo sei single? Chiedo per un amico. Anzi, per me.", en: "How long have you been single? I'm asking for a friend. Actually, for me.", grammar: [g.da-since], vocab: [w.da-quanto-tempo, w.single] }
      - { es: "Da quando ti conosco, bevo meno caffè e più vino.", en: "Since I met you, I drink less coffee and more wine.", grammar: [g.da-since, g.comparatives], vocab: [w.da-quando, w.conoscere] }
      - { es: "Non dormo da due notti, e la colpa è dei tuoi messaggi.", en: "I haven't slept for two nights, and it's your messages' fault.", grammar: [g.da-since], vocab: [w.dormire, w.messaggio] }
      - { es: "Ti guardo da tutta la serata e non so cosa dirti.", en: "I've been looking at you all evening and I don't know what to say to you.", grammar: [g.da-since], vocab: [w.serata, w.guardare] }

  - id: a2.u10.l2
    title: Il treno parte fra dieci minuti
    teach: [g.fra-tra-per]
    tip: "fra / tra + time = in (from now); per = for (a period); entro = by; fino a = until; da… a = from… to."
    vocab: [w.entro, w.partenza, w.arrivo, w.ritardo, w.binario, w.coincidenza, w.sciopero, w.biglietteria, w.prenotazione, w.andata, w.ritorno, w.andata-e-ritorno, w.timbrare, w.convalidare, w.controllore, w.finestrino]
    sentences:
      - { es: "Il treno parte fra dieci minuti dal binario tre.", en: "The train leaves in ten minutes from platform three.", altEs: ["Il treno parte tra dieci minuti dal binario tre.", "Fra dieci minuti il treno parte dal binario tre."], grammar: [g.fra-tra-per], vocab: [w.binario, w.partire] }
      - { es: "Siamo rimasti in Val d'Orcia per una settimana.", en: "We stayed in the Val d'Orcia for a week.", altEs: ["Siamo rimasti una settimana in Val d'Orcia.", "Siamo rimaste in Val d'Orcia per una settimana."], grammar: [g.fra-tra-per, g.passato-prossimo-essere], vocab: [w.rimanere], transform: { instruction: "Say it in the future", answer: "Rimarremo in Val d'Orcia per una settimana.", alt: ["Resteremo in Val d'Orcia per una settimana."], en: "We'll stay in the Val d'Orcia for a week." } }
      - { es: "Deve pagare la multa entro trenta giorni.", en: "You must pay the fine within thirty days.", altEs: ["La multa va pagata entro trenta giorni."], grammar: [g.fra-tra-per], vocab: [w.entro, w.multa] }
      - { es: "Il museo è aperto dalle dieci alle diciotto.", en: "The museum is open from ten to six p.m.", altEs: ["Il museo apre alle dieci e chiude alle diciotto."], grammar: [g.fra-tra-per, g.time-telling], vocab: [w.museo] }
      - { es: "Domani c'è sciopero dei treni dalle nove alle cinque.", en: "Tomorrow there's a train strike from nine to five.", altEs: ["Domani c'è uno sciopero dei treni dalle nove alle cinque."], grammar: [g.fra-tra-per], vocab: [w.sciopero] }
      - { es: "Il treno ha venti minuti di ritardo: perdiamo la coincidenza!", en: "The train is twenty minutes late: we'll miss our connection!", altEs: ["Il treno è in ritardo di venti minuti: perdiamo la coincidenza!"], grammar: [g.fra-tra-per], vocab: [w.ritardo, w.coincidenza, w.perdere] }
      - { es: "Un biglietto di andata e ritorno per Siena, per favore.", en: "A return ticket to Siena, please.", altEs: ["Un andata e ritorno per Siena, per favore."], grammar: [g.volere-vorrei], vocab: [w.andata-e-ritorno, w.biglietto] }
      - { es: "Prima di salire, timbra il biglietto!", en: "Before you get on, validate your ticket!", altEs: ["Prima di salire, convalida il biglietto!"], grammar: [g.imperativo-tu], vocab: [w.timbrare, w.convalidare] }
      - { es: "Il controllore passa fra poco: hai il biglietto?", en: "The ticket inspector will be along shortly: have you got your ticket?", altEs: ["Fra poco passa il controllore: hai il biglietto?"], grammar: [g.fra-tra-per], vocab: [w.controllore, w.fra-poco] }
      - { es: "La partenza è alle otto e l'arrivo a Siena alle nove e mezza.", en: "Departure is at eight and arrival in Siena at half past nine.", grammar: [g.time-telling], vocab: [w.partenza, w.arrivo] }
      - { es: "Ci vediamo fra un'ora davanti alla biglietteria.", en: "See you in an hour in front of the ticket office.", altEs: ["Ci vediamo tra un'ora davanti alla biglietteria."], grammar: [g.fra-tra-per], vocab: [w.biglietteria, w.ci-vediamo] }
      - { es: "Ho fatto la prenotazione per due notti.", en: "I've made the booking for two nights.", altEs: ["Ho prenotato per due notti."], grammar: [g.fra-tra-per], vocab: [w.prenotazione, w.notte] }
      - { es: "Parto fra due giorni.", en: "I'm leaving in two days.", altEs: ["Parto tra due giorni."], altEn: ["I leave in two days' time."], grammar: [g.fra-tra-per], vocab: [w.partire], error: { wrong: "Parto in due giorni.", explain: "'In two days' time' is fra / tra due giorni; in due giorni means 'within two days'.", grammar: g.fra-tra-per } }
      - { es: "Ho dormito per tutto il viaggio, con la testa sul finestrino.", en: "I slept for the whole journey, with my head against the window.", altEs: ["Ho dormito tutto il viaggio, con la testa sul finestrino."], grammar: [g.fra-tra-per], vocab: [w.finestrino, w.viaggio] }
      - { es: "Il ritorno è tra una settimana: restiamo fino a domenica.", en: "The return trip is in a week: we're staying until Sunday.", altEs: ["Il ritorno è fra una settimana: restiamo fino a domenica."], grammar: [g.fra-tra-per], vocab: [w.ritorno, w.fino-a] }
      - { es: "Abbiamo visitato Pienza in un'ora: è piccolissima!", en: "We saw Pienza in an hour: it's tiny!", altEs: ["Abbiamo visto Pienza in un'ora: è piccolissima!"], grammar: [g.fra-tra-per, g.superlatives], vocab: [w.visitare], note: "in + time = how long something takes." , transform: { instruction: "Say it will take you two hours (future)", answer: "Visiteremo Pienza in due ore.", alt: ["Vedremo Pienza in due ore."], en: "We'll see Pienza in two hours." } }
    exchanges:
      - q: { es: "Quando parte il prossimo treno per Siena?", en: "When does the next train to Siena leave?" }
        a: { es: "Fra venti minuti, dal binario due.", en: "In twenty minutes, from platform two." }
        alt: ["Tra venti minuti.", "Alle dieci e un quarto."]
        grammar: [g.fra-tra-per]
        vocab: [w.binario]
      - q: { es: "Per quanto tempo restate?", en: "How long are you staying?" }
        a: { es: "Restiamo per tre notti, fino a giovedì.", en: "We're staying for three nights, until Thursday." }
        alt: ["Tre notti.", "Per una settimana."]
        grammar: [g.fra-tra-per]
        vocab: [w.restare, w.fino-a]
      - q: { es: "Entro quando devo pagare?", en: "By when do I have to pay?" }
        a: { es: "Entro la fine del mese.", en: "By the end of the month." }
        alt: ["Entro venerdì.", "Entro trenta giorni."]
        grammar: [g.fra-tra-per]
        vocab: [w.entro]
      - q: { es: "Perché non ci sono treni?", en: "Why are there no trains?" }
        a: { es: "C'è uno sciopero fino alle sei.", en: "There's a strike until six." }
        alt: ["C'è sciopero.", "Per uno sciopero, fino a stasera."]
        grammar: [g.fra-tra-per]
        vocab: [w.sciopero]
      - q: { es: "Andata e ritorno?", en: "Return?" }
        a: { es: "No, solo andata, grazie.", en: "No, just one way, thanks." }
        alt: ["Sì, andata e ritorno.", "Solo andata."]
        grammar: [g.volere-vorrei]
        vocab: [w.andata, w.andata-e-ritorno]
    texts:
      - title: "Annuncio in stazione"
        es: ["Attenzione: il treno per Siena delle 10.15 parte dal binario quattro.", "Il treno ha un ritardo di quindici minuti.", "I passeggeri per Chiusi devono cambiare treno a Siena."]
        en: ["Attention please: the 10:15 train to Siena leaves from platform four.", "The train is running fifteen minutes late.", "Passengers for Chiusi must change trains in Siena."]
        grammar: [g.fra-tra-per]
        vocab: [w.binario, w.ritardo, w.passeggero]
    spicy:
      - { es: "Fra cinque minuti parte il mio treno: mi dai un bacio?", en: "My train leaves in five minutes: will you give me a kiss?", altEs: ["Tra cinque minuti parte il mio treno: mi dai un bacio?"], grammar: [g.fra-tra-per], vocab: [w.treno, w.bacio] }
      - { es: "Resto per una settimana. Basta per innamorarmi?", en: "I'm staying for a week. Is that enough to fall in love?", grammar: [g.fra-tra-per], vocab: [w.innamorarsi, w.bastare] }
      - { es: "Ti chiamo fra un'ora, o fra un minuto, se mi manchi.", en: "I'll call you in an hour, or in a minute, if I miss you.", grammar: [g.fra-tra-per, g.periodo-ipotetico-1], vocab: [w.chiamare, w.mancare] }
      - { es: "Il controllore mi ha fatto la multa, ma il passeggero accanto mi ha dato il suo numero.", en: "The inspector gave me a fine, but the passenger next to me gave me his number.", altEs: ["Il controllore mi ha fatto la multa, ma la passeggera accanto mi ha dato il suo numero."], grammar: [g.indirect-object-pronouns], vocab: [w.controllore, w.passeggero] }
      - { es: "Ho prenotato un tavolo per due alle otto: arriva entro le otto, eh!", en: "I've booked a table for two at eight: be there by eight, OK?", grammar: [g.fra-tra-per], vocab: [w.prenotare, w.entro] }

  - id: a2.u10.l3
    title: Ho deciso di partire
    teach: [g.verbs-with-prepositions]
    tip: "a + infinitive after verbs of beginning, learning, helping and managing (cominciare a, imparare a, riuscire a); di after verbs of stopping, deciding and trying (smettere di, decidere di, cercare di)."
    vocab: [w.smettere, w.riuscire, w.aiutare, w.abituarsi, w.ricordarsi, w.dimenticarsi, w.viaggiatore, w.passeggero, w.volo, w.imbarco, w.carta-dimbarco, w.bagaglio]
    sentences:
      - { es: "Ho cominciato a studiare l'italiano a gennaio.", en: "I started studying Italian in January.", altEs: ["Ho iniziato a studiare l'italiano a gennaio."], grammar: [g.verbs-with-prepositions], vocab: [w.cominciare, w.studiare] }
      - { es: "Abbiamo deciso di restare un'altra notte a Pienza.", en: "We've decided to stay another night in Pienza.", altEs: ["Abbiamo deciso di rimanere un'altra notte a Pienza."], grammar: [g.verbs-with-prepositions], vocab: [w.decidere, w.restare] }
      - { es: "Cerca di arrivare in orario: il volo non aspetta.", en: "Try to arrive on time: the flight won't wait.", altEs: ["Cerca di arrivare puntuale: il volo non aspetta.", "Prova ad arrivare in orario: il volo non aspetta."], grammar: [g.verbs-with-prepositions, g.imperativo-tu], vocab: [w.cercare, w.volo] }
      - { es: "Non riesco a dormire in aereo.", en: "I can't sleep on planes.", altEs: ["In aereo non riesco a dormire."], altEn: ["I can't manage to sleep on a plane."], grammar: [g.verbs-with-prepositions], vocab: [w.riuscire, w.aereo] }
      - { es: "Ho smesso di fumare tre anni fa.", en: "I stopped smoking three years ago.", grammar: [g.verbs-with-prepositions, g.time-markers-past], vocab: [w.smettere, w.fumare], error: { wrong: "Ho smesso fumare tre anni fa.", explain: "smettere takes di before an infinitive: smettere di fumare.", grammar: g.verbs-with-prepositions } }
      - { es: "Mi aiuti a portare i bagagli?", en: "Will you help me carry the bags?", altEs: ["Mi aiuti a portare le valigie?", "Mi puoi aiutare a portare i bagagli?"], grammar: [g.verbs-with-prepositions], vocab: [w.aiutare, w.bagaglio] }
      - { es: "Ricordati di prendere la carta d'imbarco!", en: "Remember to take your boarding pass!", altEs: ["Ricordati di portare la carta d'imbarco!"], grammar: [g.verbs-with-prepositions, g.imperativo-tu], vocab: [w.ricordarsi, w.carta-dimbarco] }
      - { es: "Mi sono dimenticato di chiudere la valigia.", en: "I forgot to close my suitcase.", altEs: ["Mi sono dimenticata di chiudere la valigia.", "Ho dimenticato di chiudere la valigia."], grammar: [g.verbs-with-prepositions, g.reflexive-passato-prossimo], vocab: [w.dimenticarsi, w.valigia], transform: { instruction: "Change to 'we'", answer: "Ci siamo dimenticati di chiudere la valigia.", alt: ["Ci siamo dimenticate di chiudere la valigia.", "Abbiamo dimenticato di chiudere la valigia."], en: "We forgot to close the suitcase." } }
      - { es: "Non riesco ad abituarmi a cenare così tardi.", en: "I can't get used to having dinner so late.", altEs: ["Non mi abituo a cenare così tardi."], grammar: [g.verbs-with-prepositions], vocab: [w.abituarsi, w.cenare], note: "a becomes ad before a vowel: riesco ad abituarmi." }
      - { es: "Un passeggero ha cominciato a gridare perché ha perso il volo.", en: "A passenger started shouting because he'd missed his flight.", altEs: ["Una passeggera ha cominciato a gridare perché ha perso il volo."], grammar: [g.verbs-with-prepositions], vocab: [w.passeggero, w.gridare] }
      - { es: "L'imbarco è già cominciato, ma continua a piovere.", en: "Boarding has already started, but it keeps raining.", grammar: [g.verbs-with-prepositions], vocab: [w.imbarco, w.continuare] }
      - { es: "Abbiamo provato a prenotare, ma era tutto pieno.", en: "We tried to book, but everything was full.", altEs: ["Abbiamo cercato di prenotare, ma era tutto pieno."], grammar: [g.verbs-with-prepositions, g.passato-prossimo-vs-imperfetto], vocab: [w.provare, w.prenotare] }
      - { es: "Spero di tornare in Val d'Orcia l'anno prossimo.", en: "I hope to come back to the Val d'Orcia next year.", grammar: [g.verbs-with-prepositions], vocab: [w.sperare, w.prossimo] }
      - { es: "Un buon viaggiatore impara a viaggiare con poco.", en: "A good traveller learns to travel light.", altEs: ["Un buon viaggiatore impara a viaggiare con poche cose."], grammar: [g.verbs-with-prepositions], vocab: [w.viaggiatore, w.imparare] }
      - { es: "Ho finito di fare la valigia!", en: "I've finished packing!", altEs: ["Ho finito di preparare la valigia!"], grammar: [g.verbs-with-prepositions], vocab: [w.finire, w.valigia] }
      - { es: "Imparo a guidare.", en: "I'm learning to drive.", altEs: ["Sto imparando a guidare."], grammar: [g.verbs-with-prepositions], vocab: [w.guidare], transform: { instruction: "Put it in the passato prossimo", answer: "Ho imparato a guidare.", alt: ["Io ho imparato a guidare."], en: "I've learnt to drive." } }
    exchanges:
      - q: { es: "Riesci a dormire in treno?", en: "Can you sleep on trains?" }
        a: { es: "No, non ci riesco mai.", en: "No, I never manage it." }
        alt: ["Sì, dormo benissimo.", "No, mai."]
        grammar: [g.verbs-with-prepositions, g.ci-place]
        vocab: [w.riuscire]
      - q: { es: "Che cosa avete deciso di fare?", en: "What have you decided to do?" }
        a: { es: "Abbiamo deciso di restare fino a domenica.", en: "We've decided to stay until Sunday." }
        alt: ["Di restare fino a domenica.", "Abbiamo deciso di partire domani."]
        grammar: [g.verbs-with-prepositions]
        vocab: [w.decidere]
      - q: { es: "Hai preso la carta d'imbarco?", en: "Have you got your boarding pass?" }
        a: { es: "No! Mi sono dimenticata di prenderla!", en: "No! I forgot to pick it up!" }
        alt: ["Sì, è nel telefono.", "Sì, eccola."]
        grammar: [g.verbs-with-prepositions, g.reflexive-passato-prossimo]
        vocab: [w.carta-dimbarco, w.dimenticarsi]
      - q: { es: "Mi aiuti a portare il bagaglio?", en: "Will you help me carry the luggage?" }
        a: { es: "Certo, dammi la valigia.", en: "Of course, give me the suitcase." }
        alt: ["Certo!", "Sì, ti aiuto io."]
        grammar: [g.verbs-with-prepositions, g.imperativo-tu]
        vocab: [w.aiutare, w.bagaglio]
      - q: { es: "Fumi ancora?", en: "Do you still smoke?" }
        a: { es: "No, ho smesso di fumare un anno fa e sto molto meglio.", en: "No, I stopped smoking a year ago and I feel much better." }
        alt: ["No, ho smesso.", "Sì, ma cerco di smettere."]
        grammar: [g.verbs-with-prepositions, g.double-negation]
        vocab: [w.smettere]
    texts:
      - title: "Messaggio dall'aeroporto"
        es: ["Il volo ha due ore di ritardo.", "Ho cercato di dormire, ma non ci sono riuscito.", "Ricordati di venire a prendermi!"]
        en: ["The flight is two hours late.", "I tried to sleep, but I didn't manage.", "Remember to come and pick me up!"]
        grammar: [g.verbs-with-prepositions]
        vocab: [w.volo, w.riuscire, w.ricordarsi]
    spicy:
      - { es: "Ho deciso di invitarti a cena. Non dire di no.", en: "I've decided to invite you to dinner. Don't say no.", grammar: [g.verbs-with-prepositions, g.imperativo-negative], vocab: [w.decidere, w.invitare] }
      - { es: "Cerca di non innamorarti: sono qui solo in vacanza.", en: "Try not to fall in love: I'm only here on holiday.", grammar: [g.verbs-with-prepositions], vocab: [w.cercare, w.innamorarsi] }
      - { es: "Non riesco a smettere di guardarti.", en: "I can't stop looking at you.", grammar: [g.verbs-with-prepositions], vocab: [w.riuscire, w.smettere] }
      - { es: "Mi sono dimenticata di dirti una cosa: sei bellissimo.", en: "I forgot to tell you something: you're gorgeous.", altEs: ["Mi sono dimenticato di dirti una cosa: sei bellissima."], grammar: [g.verbs-with-prepositions], vocab: [w.dimenticarsi, w.bellissimo] }
      - { es: "Ho imparato a ballare il tango solo per te.", en: "I learnt to dance the tango just for you.", grammar: [g.verbs-with-prepositions], vocab: [w.imparare, w.ballare] }

  - id: a2.u10.l4
    title: In treno o in macchina?
    teach: [g.prepositions-transport]
    tip: "in + vehicle with no article (in treno, in macchina, in bici); a piedi; con + article for a specific one (con il treno delle otto)."
    vocab: [w.tram, w.motorino, w.nave, w.lato, w.benzinaio, w.autostrada, w.casello, w.benzina, w.parcheggio, w.parcheggiare, w.multa, w.traghetto, w.porto, w.mezzo.n, w.fare-il-pieno, w.guasto, w.incidente]
    sentences:
      - { es: "Andiamo a Pienza in macchina: in autobus ci vuole troppo.", en: "Let's go to Pienza by car: by bus it takes too long.", altEs: ["Andiamo a Pienza in macchina, in autobus ci vuole troppo tempo."], grammar: [g.prepositions-transport, g.metterci-volerci], vocab: [w.macchina, w.autobus] }
      - { es: "A Firenze mi muovo in tram, in campagna in macchina.", en: "In Florence I get around by tram, in the countryside by car.", altEs: ["A Firenze prendo il tram, in campagna la macchina."], grammar: [g.prepositions-transport], vocab: [w.tram, w.campagna] }
      - { es: "Mio fratello va dappertutto in motorino.", en: "My brother goes everywhere on his scooter.", altEs: ["Mio fratello va ovunque in motorino."], grammar: [g.prepositions-transport], vocab: [w.motorino] }
      - { es: "Il traghetto per l'Elba parte dal porto di Piombino.", en: "The ferry to Elba leaves from the port of Piombino.", grammar: [g.prepositions-transport], vocab: [w.traghetto, w.porto] }
      - { es: "Devo fare il pieno: c'è un benzinaio qui vicino?", en: "I need to fill up: is there a petrol station near here?", altEs: ["Devo fare benzina: c'è un benzinaio qui vicino?"], grammar: [g.c-e-ci-sono], vocab: [w.fare-il-pieno, w.benzinaio] }
      - { es: "La benzina in autostrada costa di più.", en: "Petrol costs more on the motorway.", altEs: ["In autostrada la benzina costa di più."], grammar: [g.comparatives], vocab: [w.benzina, w.autostrada] }
      - { es: "Non trovo parcheggio: dove posso parcheggiare?", en: "I can't find a parking space: where can I park?", grammar: [g.potere-dovere], vocab: [w.parcheggio, w.parcheggiare] }
      - { es: "Ho preso una multa perché ho parcheggiato male.", en: "I got a fine because I parked badly.", altEs: ["Mi hanno fatto la multa perché ho parcheggiato male."], grammar: [g.passato-prossimo-avere], vocab: [w.multa, w.parcheggiare] }
      - { es: "Siamo saliti sul treno sbagliato!", en: "We got on the wrong train!", altEs: ["Siamo salite sul treno sbagliato!"], grammar: [g.prepositions-transport, g.passato-prossimo-essere], vocab: [w.salire, w.sbagliato] }
      - { es: "Vengo in macchina, così ti porto a casa.", en: "I'll come by car, so I can take you home.", altEs: ["Vengo in macchina e ti porto a casa."], grammar: [g.prepositions-transport], vocab: [w.venire, w.macchina], error: { wrong: "Vengo nella macchina, così ti porto a casa.", explain: "For means of transport use in + vehicle with no article: in macchina. Nella macchina means 'inside the car'.", grammar: g.prepositions-transport } }
      - { es: "Vado al lavoro a piedi: sono dieci minuti.", en: "I walk to work: it's ten minutes.", altEs: ["Vado a lavorare a piedi: sono dieci minuti."], grammar: [g.prepositions-transport], vocab: [w.a-piedi, w.lavoro], error: { wrong: "Vado al lavoro in piedi: sono dieci minuti.", explain: "On foot is a piedi; in piedi means 'standing'.", grammar: g.prepositions-transport } }
      - { es: "La macchina ha un guasto: chiamiamo il meccanico.", en: "The car has broken down: let's call the mechanic.", altEs: ["C'è un guasto alla macchina: chiamiamo il meccanico."], grammar: [g.imperativo-noi-voi], vocab: [w.guasto, w.meccanico] }
      - { es: "C'è stato un incidente in autostrada: prendiamo le strade di campagna.", en: "There's been an accident on the motorway: let's take the country roads.", grammar: [g.passato-prossimo-essere], vocab: [w.incidente, w.autostrada] }
      - { es: "Arrivo con il treno delle 10.15.", en: "I'm arriving on the 10:15 train.", altEs: ["Arrivo col treno delle 10.15."], grammar: [g.prepositions-transport], vocab: [w.arrivare, w.treno], transform: { instruction: "Just say you're coming by train (no specific train)", answer: "Arrivo in treno.", alt: ["Vengo in treno."], en: "I'm coming by train." } }
      - { es: "Il mezzo migliore per vedere la Val d'Orcia? La bici, se hai buone gambe.", en: "The best way to see the Val d'Orcia? The bike, if you've got good legs.", grammar: [g.comparatives-irregular], vocab: [w.mezzo.n, w.gamba] }
      - { es: "Napoleone è arrivato all'Elba in nave.", en: "Napoleon arrived on Elba by ship.", grammar: [g.prepositions-transport], vocab: [w.nave], transform: { instruction: "Say that we arrived on Elba by ferry", answer: "Siamo arrivati all'Elba in traghetto.", alt: ["Noi siamo arrivati all'Elba in traghetto.", "Siamo arrivate all'Elba in traghetto.", "Siamo arrivati all'Elba col traghetto."], en: "We arrived on Elba by ferry." } }
    exchanges:
      - q: { es: "Come vieni, in macchina o in treno?", en: "How are you coming, by car or by train?" }
        a: { es: "In treno: con la macchina non trovo mai parcheggio.", en: "By train: with the car I can never find a parking space." }
        alt: ["In treno.", "In macchina, è più comodo."]
        grammar: [g.prepositions-transport]
        vocab: [w.treno, w.parcheggio]
      - q: { es: "Come vai al lavoro?", en: "How do you get to work?" }
        a: { es: "In motorino, ci metto dieci minuti.", en: "By scooter, it takes me ten minutes." }
        alt: ["A piedi.", "In autobus.", "In bici, quando non piove."]
        grammar: [g.prepositions-transport, g.metterci-volerci]
        vocab: [w.motorino]
      - q: { es: "Scusi, dov'è il benzinaio più vicino?", en: "Excuse me, where's the nearest petrol station?" }
        a: { es: "Dopo il casello, sul lato destro.", en: "After the tollbooth, on the right-hand side." }
        alt: ["A due chilometri, sulla destra.", "In paese, vicino alla piazza."]
        grammar: [g.prepositions-transport]
        vocab: [w.benzinaio, w.casello, w.lato]
      - q: { es: "Perché sei arrivato così tardi?", en: "Why did you arrive so late?" }
        a: { es: "C'era un incidente in autostrada.", en: "There was an accident on the motorway." }
        alt: ["Ho perso il treno.", "C'era tanto traffico."]
        grammar: [g.passato-prossimo-vs-imperfetto]
        vocab: [w.incidente]
      - q: { es: "Hai preso la multa?", en: "Did you get a fine?" }
        a: { es: "Sì, ho parcheggiato male per cinque minuti!", en: "Yes, I parked badly for five minutes!" }
        alt: ["Sì, purtroppo.", "No, per fortuna!"]
        grammar: [g.fra-tra-per]
        vocab: [w.multa, w.parcheggiare]
    texts:
      - title: "Come arrivare"
        es: ["Da Siena, prenda l'autobus per San Quirico d'Orcia.", "Il viaggio dura circa un'ora.", "In macchina, invece, ci vogliono quaranta minuti."]
        en: ["From Siena, take the bus to San Quirico d'Orcia.", "The journey takes about an hour.", "By car, on the other hand, it takes forty minutes."]
        grammar: [g.prepositions-transport, g.imperativo-lei]
        vocab: [w.autobus, w.durare]
    spicy:
      - { es: "Ti porto in Val d'Orcia in motorino: tieniti forte.", en: "I'll take you to the Val d'Orcia on my scooter: hold on tight.", grammar: [g.prepositions-transport, g.imperativo-tu], vocab: [w.motorino, w.forte] }
      - { es: "Abbiamo finito la benzina proprio qui, al tramonto. Che caso!", en: "We've run out of petrol right here, at sunset. What a coincidence!", grammar: [g.passato-prossimo-avere], vocab: [w.benzina, w.tramonto] }
      - { es: "Vengo a piedi fino a casa tua, anche sotto la pioggia.", en: "I'll walk all the way to your house, even in the rain.", grammar: [g.prepositions-transport], vocab: [w.a-piedi, w.pioggia] }
      - { es: "Ho preso una multa perché guardavo te e non la strada.", en: "I got a fine because I was looking at you and not at the road.", grammar: [g.passato-prossimo-vs-imperfetto], vocab: [w.multa, w.strada] }
      - { es: "Il mio mezzo preferito? La tua macchina, con te alla guida.", en: "My favourite means of transport? Your car, with you driving.", grammar: [g.prepositions-transport], vocab: [w.mezzo.n, w.preferito] }

dialogues:
  - id: a2.u10.d1
    title: Alla biglietteria
    context: Beatrice is at the station in Siena. She wants to go to San Quirico d'Orcia and asks the clerk for help.
    lines:
      - { speaker: Beatrice, es: "Buongiorno, un biglietto per San Quirico d'Orcia, per favore.", en: "Good morning, a ticket to San Quirico d'Orcia, please." }
      - { speaker: Impiegato, es: "In treno non ci arriva, signora: deve prendere l'autobus.", en: "You can't get there by train, madam: you have to take the bus." }
      - { speaker: Beatrice, es: "Ah! E quando parte il prossimo?", en: "Oh! And when does the next one leave?" }
      - { speaker: Impiegato, es: "Fra quaranta minuti, dalla fermata qui davanti.", en: "In forty minutes, from the stop just outside." }
      - { speaker: Beatrice, es: "Quanto ci vuole per arrivare?", en: "How long does it take to get there?" }
      - { speaker: Impiegato, es: "Circa un'ora e un quarto. Vuole andata e ritorno?", en: "About an hour and a quarter. Would you like a return?" }
      - { speaker: Beatrice, es: "Sì, torno fra tre giorni.", en: "Yes, I'm coming back in three days." }
      - { speaker: Impiegato, es: "Ecco. Si ricordi di convalidare il biglietto quando sale.", en: "Here you are. Remember to validate the ticket when you get on." }
      - { speaker: Beatrice, es: "Meno male! Sono qui da un'ora e non riuscivo a capire gli orari.", en: "Thank goodness! I've been here for an hour and I couldn't understand the timetables." }
      - { speaker: Impiegato, es: "Non si preoccupi. Ma la prossima volta, in Val d'Orcia ci vada in macchina!", en: "Don't worry. But next time, go to the Val d'Orcia by car!" }
    questions:
      - { q: "Come va Beatrice a San Quirico?", options: ["In treno", "In autobus", "In macchina"], answer: 1, explain: "In treno non ci arriva: deve prendere l'autobus." }
      - { q: "Fra quanto tempo parte l'autobus?", options: ["Fra dieci minuti", "Fra quaranta minuti", "Fra un'ora e un quarto"], answer: 1, explain: "Fra quaranta minuti. The journey itself takes an hour and a quarter." }
      - { q: "Quando torna Beatrice?", options: ["Domani", "Fra tre giorni", "Fra una settimana"], answer: 1, explain: "Torno fra tre giorni." }
      - { q: "Da quanto tempo è in stazione Beatrice?", options: ["Da dieci minuti", "Da un'ora", "Da stamattina"], answer: 1, explain: "Sono qui da un'ora: present + da for something still going on." }
