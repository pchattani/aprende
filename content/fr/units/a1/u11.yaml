  - id: a1.u11.l4
    title: Où se trouve… ?
    teach: [g.inversion-questions]
    vocab: [w.avenue, w.boulevard, w.pont, w.quai, w.banque, w.arrondissement]
    tip: "Formal questions swap the pronoun and the verb, with a hyphen: Parlez-vous anglais ? Add -t- between two vowels: Parle-t-il français ? Y a-t-il… ?"
    sentences:
      - { es: "Parlez-vous anglais ?", en: "Do you speak English?", altEs: ["Vous parlez anglais ?", "Est-ce que vous parlez anglais ?"], grammar: [g.inversion-questions], vocab: [] }
      - { es: "Où se trouve la station de métro, s'il vous plaît ?", en: "Where is the metro station, please?", altEs: ["Où est la station de métro, s'il vous plaît ?", "La station de métro, s'il vous plaît ?"], altEn: ["Where's the underground station, please?"], grammar: [g.inversion-questions, g.question-words], vocab: [w.se-trouver, w.station] }
      - { es: "Pouvez-vous m'aider ?", en: "Can you help me?", altEs: ["Vous pouvez m'aider ?", "Est-ce que vous pouvez m'aider ?"], altEn: ["Could you help me?"], grammar: [g.inversion-questions, g.modal-verbs], vocab: [] }
      - { es: "Y a-t-il une banque près d'ici ?", en: "Is there a bank near here?", altEs: ["Il y a une banque près d'ici ?", "Est-ce qu'il y a une banque près d'ici ?"], altEn: ["Is there a bank nearby?"], grammar: [g.inversion-questions, g.il-y-a], vocab: [w.banque] }
      - { es: "Prend-il le bus ou le métro ?", en: "Does he take the bus or the metro?", altEs: ["Il prend le bus ou le métro ?", "Est-ce qu'il prend le bus ou le métro ?"], altEn: ["Is he taking the bus or the metro?"], grammar: [g.inversion-questions, g.prendre-present], vocab: [w.bus] }
      - { es: "Parle-t-elle français ?", en: "Does she speak French?", altEs: ["Elle parle français ?", "Est-ce qu'elle parle français ?"], grammar: [g.inversion-questions], vocab: [], error: { wrong: "Parle-elle français ?", explain: "When the verb ends in a vowel and the pronoun is il, elle or on, add -t-: parle-t-elle.", grammar: g.inversion-questions } }
      - { es: "Les bouquinistes vendent de vieux livres sur les quais.", en: "The bouquinistes sell old books on the quays.", altEs: ["Les bouquinistes vendent des vieux livres sur les quais."], altEn: ["The second-hand booksellers sell old books along the quays."], grammar: [g.adjective-position, g.present-re-verbs], vocab: [w.bouquiniste, w.quai] }
      - { es: "Dans quel arrondissement habitez-vous ?", en: "Which arrondissement do you live in?", altEs: ["Vous habitez dans quel arrondissement ?", "Dans quel arrondissement est-ce que vous habitez ?"], altEn: ["Which district do you live in?"], grammar: [g.inversion-questions, g.quel], vocab: [w.arrondissement], transform: { instruction: "Use tu, still with inversion", answer: "Dans quel arrondissement habites-tu ?", en: "Which arrondissement do you live in? (informal)" } }
      - { es: "Paris a vingt arrondissements.", en: "Paris has twenty arrondissements.", altEs: ["Il y a vingt arrondissements à Paris."], altEn: ["Paris has twenty districts."], grammar: [g.avoir-present], vocab: [w.arrondissement], transform: { instruction: "Turn it into an inversion question", answer: "Paris a-t-il vingt arrondissements ?", en: "Does Paris have twenty arrondissements?" } }
      - { es: "Le boulevard Saint-Michel va jusqu'à la Seine.", en: "The Boulevard Saint-Michel goes all the way to the Seine.", altEn: ["Boulevard Saint-Michel runs down to the Seine."], grammar: [g.directions], vocab: [w.boulevard, w.jusqu-à] }
      - { es: "Les Champs-Élysées sont une grande avenue.", en: "The Champs-Élysées is a wide avenue.", altEn: ["The Champs-Élysées is a big avenue."], grammar: [g.adjective-position], vocab: [w.avenue] }
      - { es: "Combien de ponts y a-t-il à Paris ?", en: "How many bridges are there in Paris?", altEs: ["Il y a combien de ponts à Paris ?", "Combien de ponts est-ce qu'il y a à Paris ?"], grammar: [g.inversion-questions, g.quantities], vocab: [w.pont], error: { wrong: "Combien de ponts y a-il à Paris ?", explain: "A ends in a vowel, so add -t- before il: y a-t-il.", grammar: g.inversion-questions } }
      - { es: "Où va-t-on ce soir ?", en: "Where are we going tonight?", altEs: ["On va où ce soir ?", "Où est-ce qu'on va ce soir ?"], grammar: [g.inversion-questions, g.on-nous], vocab: [], transform: { instruction: "Ask the same question with vous", answer: "Où allez-vous ce soir ?", alt: ["Vous allez où ce soir ?"], en: "Where are you going tonight?" } }
      - { es: "Comprenez-vous le plan ?", en: "Do you understand the map?", altEs: ["Vous comprenez le plan ?", "Est-ce que vous comprenez le plan ?"], grammar: [g.inversion-questions, g.prendre-present], vocab: [w.comprendre, w.plan] }
      - { es: "À quelle heure part le bateau ?", en: "What time does the boat leave?", altEs: ["Le bateau part à quelle heure ?", "À quelle heure est-ce que le bateau part ?"], grammar: [g.inversion-questions, g.time-telling], vocab: [w.bateau] }
