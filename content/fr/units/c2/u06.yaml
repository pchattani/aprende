id: c2.u06
title: "Lafayette, chez les Cadiens"
lessons:
  - id: c2.u06.l1
    title: "Asteur, on parle cadien"
    teach: [g.acadian-french]
    tip: "Acadian and Cajun French keep old forms from western France: asteur (now), icitte (here), itou (too), je vas (I go), ils parlont (they speak). They are regular in these varieties, not mistakes; in standard writing use maintenant, ici, aussi, je vais, ils parlent."
    vocab: [w.cadien, w.cajun, w.acadien, w.chiac, w.grand-dérangement.nm, w.déportation, w.déporté, w.exilé, w.diaspora, w.asteur, w.icitte, w.itou, w.je-vas, w.ils-parlont, w.nous-avont, w.résister, w.résistance, w.survivance, w.transmission, w.revitaliser, w.britannique, w.immersion, w.standard, w.battre, w.se-débarrasser, w.se-multiplier]
    sentences:
      - { es: "En 1755, les Britanniques ont déporté des milliers d'Acadiens : c'est le Grand Dérangement.", en: "In 1755 the British deported thousands of Acadians: this is the Great Upheaval.", altEs: ["En 1755, des milliers d'Acadiens ont été déportés par les Britanniques : c'est le Grand Dérangement."], grammar: [g.acadian-french, g.passe-compose-avoir], vocab: [w.grand-dérangement.nm, w.britannique] }
      - { es: "Après des années d'exil, beaucoup de déportés ont fini par s'installer en Louisiane.", en: "After years of exile, many deportees ended up settling in Louisiana.", altEs: ["Après des années d'exil, de nombreux déportés ont fini par s'installer en Louisiane."], grammar: [g.acadian-french, g.verbs-plus-infinitive], vocab: [w.déporté] }
      - { es: "En Louisiane, les Acadiens sont devenus les Cadiens, que les anglophones appellent Cajuns.", en: "In Louisiana the Acadians became the Cadiens, whom English speakers call Cajuns.", altEs: ["En Louisiane, les Acadiens sont devenus les Cadiens ; en anglais, on dit Cajuns."], grammar: [g.acadian-french, g.relative-qui-que], vocab: [w.cadien, w.cajun, w.acadien] }
      - { es: "Asteur, on va au bal cadien.", en: "Now we're going to the Cajun dance.", altEs: ["Maintenant, on va au bal cadien."], grammar: [g.acadian-french], vocab: [w.asteur, w.bal], note: "Asteur comes from à cette heure (now).", transform: { instruction: "Rewrite it in standard French", answer: "Maintenant, nous allons au bal cadien.", alt: ["Maintenant, on va au bal cadien."], en: "Now we're going to the Cajun dance." } }
      - { es: "Ils parlont français à la maison, mais anglais à l'école.", en: "They speak French at home but English at school.", altEs: ["Ils parlent français à la maison, mais anglais à l'école."], grammar: [g.acadian-french], vocab: [w.ils-parlont], note: "The -ont ending of the third person plural is a feature of Acadian and Cajun French.", transform: { instruction: "Rewrite it in standard French", answer: "Ils parlent français à la maison, mais anglais à l'école.", alt: ["Ils parlent français chez eux, mais anglais à l'école."], en: "They speak French at home but English at school." } }
      - { es: "Je vas t'espérer icitte, devant la salle de danse.", en: "I'll wait for you here, in front of the dance hall.", altEs: ["Je vais t'attendre ici, devant la salle de danse."], grammar: [g.acadian-french], vocab: [w.je-vas, w.icitte], note: "In Cajun French, espérer means 'to wait for'." }
      - { es: "Moi itou, j'ai appris le français avec ma grand-mère.", en: "Me too, I learnt French with my grandmother.", altEs: ["Moi aussi, j'ai appris le français avec ma grand-mère."], grammar: [g.acadian-french, g.moi-aussi-non-plus], vocab: [w.itou] }
      - { es: "Nous avont fini de travailler, asteur on peut aller pêcher.", en: "We've finished working, now we can go fishing.", altEs: ["Nous avons fini de travailler, maintenant on peut aller pêcher."], grammar: [g.acadian-french], vocab: [w.nous-avont, w.asteur], error: { wrong: "Nous avont fini de travailler, maintenant nous pouvont aller pêcher.", explain: "In standard French the nous form ends in -ons: nous avons, nous pouvons. Mixing standard and Cajun forms in one sentence sounds odd.", grammar: g.acadian-french } }
      - { es: "Pendant des décennies, on punissait les élèves qui parlaient français à l'école.", en: "For decades, pupils who spoke French at school were punished.", altEs: ["Pendant des décennies, les élèves qui parlaient français à l'école étaient punis."], grammar: [g.acadian-french, g.imparfait-uses, g.on-instead-of-passive], vocab: [w.punir], note: "Louisiana's 1921 constitution made English the only language of instruction." }
      - { es: "Depuis 1968, le CODOFIL s'efforce de revitaliser le français en Louisiane.", en: "Since 1968 CODOFIL has been working to revitalise French in Louisiana.", altEs: ["Depuis 1968, le CODOFIL travaille à revitaliser le français en Louisiane."], grammar: [g.acadian-french, g.depuis-present], vocab: [w.revitaliser] }
      - { es: "Les écoles d'immersion assurent la transmission de la langue aux nouvelles générations.", en: "Immersion schools pass the language on to new generations.", altEs: ["Grâce aux écoles d'immersion, la langue se transmet aux nouvelles générations."], grammar: [g.acadian-french], vocab: [w.transmission, w.immersion] }
      - { es: "À Moncton, on entend le chiac, un mélange de français et d'anglais : « J'ai checké mes messages. »", en: "In Moncton you hear Chiac, a mix of French and English: 'I checked my messages.'", altEs: ["À Moncton, on entend le chiac, qui mélange le français et l'anglais : « J'ai checké mes messages. »"], grammar: [g.acadian-french, g.anglicisms-calques], vocab: [w.chiac, w.checker] }
      - { es: "Que le français ait survécu ici après deux siècles de pressions, c'est un exemple rare de résistance.", en: "That French has survived here after two centuries of pressure is a rare example of resistance.", altEs: ["Le fait que le français ait survécu ici après deux siècles de pressions est un exemple rare de résistance."], grammar: [g.acadian-french, g.subjonctif-passe], vocab: [w.résistance, w.survivre] }
      - { es: "La diaspora acadienne s'étend du Nouveau-Brunswick à la Louisiane, en passant par la France.", en: "The Acadian diaspora stretches from New Brunswick to Louisiana, by way of France.", altEs: ["La diaspora acadienne va du Nouveau-Brunswick à la Louisiane, en passant par la France."], grammar: [g.acadian-french, g.prepositions-cities-countries], vocab: [w.diaspora] }
      - { es: "Pour les Acadiens, la survivance de la langue a longtemps été une question de dignité.", en: "For the Acadians, the survival of the language long remained a question of dignity.", altEs: ["Chez les Acadiens, la survivance de la langue a longtemps été une affaire de dignité."], grammar: [g.acadian-french], vocab: [w.survivance, w.dignité] }
      - { es: "Ma famille a résisté à l'anglais pendant trois générations ; moi, je vas résister itou.", en: "My family resisted English for three generations; I'm going to resist too.", altEs: ["Ma famille a résisté à l'anglais pendant trois générations ; moi, je vais résister aussi."], grammar: [g.acadian-french], vocab: [w.résister, w.je-vas, w.itou] }
    exchanges:
      - q: { es: "Pourquoi les Acadiens sont-ils arrivés en Louisiane ?", en: "Why did the Acadians come to Louisiana?" }
        a: { es: "Parce que les Britanniques les avaient déportés en 1755 ; beaucoup ont erré pendant des années avant de s'y installer.", en: "Because the British had deported them in 1755; many wandered for years before settling there." }
        alt: ["À cause du Grand Dérangement.", "Ils avaient été déportés par les Britanniques."]
        grammar: [g.plus-que-parfait, g.acadian-french]
        vocab: [w.grand-dérangement.nm, w.déportation]
      - q: { es: "« Asteur », ça veut dire quoi ?", en: "What does 'asteur' mean?" }
        a: { es: "Maintenant ; ça vient de « à cette heure ».", en: "Now; it comes from 'à cette heure'." }
        alt: ["« Maintenant ».", "Ça veut dire « maintenant »."]
        grammar: [g.acadian-french]
        vocab: [w.asteur]
      - q: { es: "Tu parles français avec tes parents ?", en: "Do you speak French with your parents?" }
        a: { es: "Avec mes grands-parents, oui ; mes parents, eux, ont été punis à l'école pour l'avoir parlé.", en: "With my grandparents, yes; my parents were punished at school for speaking it." }
        alt: ["Un peu, surtout avec ma grand-mère.", "Non, mais j'étudie à l'école d'immersion."]
        grammar: [g.acadian-french, g.dislocation]
        vocab: [w.transmission]
      - q: { es: "C'est quoi, le chiac ?", en: "What's Chiac?" }
        a: { es: "Le parler de la région de Moncton, où le français et l'anglais se mélangent dans la même phrase.", en: "The speech of the Moncton area, where French and English mix in the same sentence." }
        alt: ["Un mélange de français et d'anglais.", "Le français de Moncton."]
        grammar: [g.acadian-french, g.relative-ou]
        vocab: [w.chiac]
      - q: { es: "Le français a-t-il encore un avenir en Louisiane ?", en: "Does French still have a future in Louisiana?" }
        a: { es: "Je le crois : les écoles d'immersion se multiplient, et les jeunes en sont fiers.", en: "I think so: immersion schools are multiplying, and young people are proud of it." }
        alt: ["Oui, grâce aux écoles d'immersion.", "J'espère que oui."]
        grammar: [g.acadian-french, g.pronoun-en]
        vocab: [w.immersion]
    texts:
      - title: "Plaque commémorative"
        es: ["En 1765, des familles acadiennes déportées arrivent dans cette région.", "Elles y fondent des villages sur les bords des bayous.", "Leurs descendants parlent encore français."]
        en: ["In 1765, deported Acadian families arrive in this region.", "There they found villages on the banks of the bayous.", "Their descendants still speak French."]
        grammar: [g.acadian-french, g.pronoun-y]
        vocab: [w.déporté, w.acadien, w.bayou]
      - title: "Message d'un cousin"
        es: ["Je vas arriver icitte samedi.", "Espère-moi au restaurant, je serai là vers midi.", "On ira au bal itou !"]
        en: ["I'll get here on Saturday.", "Wait for me at the restaurant, I'll be there around noon.", "We'll go to the dance too!"]
        grammar: [g.acadian-french]
        vocab: [w.je-vas, w.icitte, w.itou]
    spicy:
      - { es: "Asteur que tu m'as appris à danser le two-step, tu ne te débarrasseras plus de moi.", en: "Now that you've taught me to dance the two-step, you'll never get rid of me.", altEs: ["Maintenant que tu m'as appris à danser le two-step, tu ne te débarrasseras plus de moi."], grammar: [g.acadian-french, g.negation-jamais-plus-rien], vocab: [w.asteur] }
      - { es: "Je vas t'espérer icitte toute la soirée, mais pas une minute de plus.", en: "I'll wait for you here all evening, but not a minute longer.", altEs: ["Je vais t'attendre ici toute la soirée, mais pas une minute de plus."], grammar: [g.acadian-french], vocab: [w.je-vas, w.icitte] }
      - { es: "Tu dis que tu as le cœur cadien ; moi itou, et il bat plus vite quand tu joues du violon.", en: "You say you have a Cajun heart; me too, and it beats faster when you play the fiddle.", altEs: ["Tu dis que tu as le cœur cadien ; moi aussi, et il bat plus vite quand tu joues du violon."], grammar: [g.acadian-french], vocab: [w.cadien, w.itou] }
      - { es: "Ma grand-mère a résisté à l'anglais pendant soixante ans ; toi, tu n'as pas résisté à mon gombo plus de cinq minutes.", en: "My grandmother resisted English for sixty years; you didn't resist my gumbo for more than five minutes.", altEs: ["Ma grand-mère a résisté à l'anglais pendant soixante ans, mais toi, tu n'as pas résisté à mon gombo plus de cinq minutes."], grammar: [g.acadian-french], vocab: [w.résister, w.gombo] }
  - id: c2.u06.l2
    title: "Laissez les bons temps rouler !"
    teach: [g.acadian-french, g.anglicisms-calques]
    tip: "Cajun French borrows English freely (watcher la télé, checker, le truck) and keeps its own nature words (bayou, chaoui, ouaouaron). Laissez les bons temps rouler is itself a calque of English 'let the good times roll'."
    vocab: [w.bayou, w.écrevisse, w.gombo, w.jambalaya, w.alligator, w.ouaouaron, w.chaoui, w.fais-dodo, w.zydeco, w.accordéon, w.violoneux, w.laissez-les-bons-temps-rouler, w.catin, w.boucane, w.bal, w.checker, w.canceller, w.watcher, w.truck, w.jurer, w.valse, w.barbecue]
    sentences:
      - { es: "Sur le bayou, on entend les ouaouarons chanter toute la nuit.", en: "On the bayou you hear the bullfrogs singing all night.", altEs: ["Sur le bayou, on entend chanter les ouaouarons toute la nuit."], grammar: [g.acadian-french], vocab: [w.bayou, w.ouaouaron] }
      - { es: "Ne laisse pas les écrevisses sur la table : le chaoui va les voler.", en: "Don't leave the crayfish on the table: the raccoon will steal them.", altEs: ["Ne laisse pas les écrevisses sur la table, sinon le chaoui va les voler."], grammar: [g.acadian-french, g.imperative-with-pronouns], vocab: [w.écrevisse, w.chaoui] }
      - { es: "Pour un bon gombo, il faut d'abord faire un roux bien foncé.", en: "For a good gumbo, you first have to make a really dark roux.", altEs: ["Pour réussir un gombo, il faut d'abord faire un roux bien foncé."], grammar: [g.acadian-french, g.il-faut], vocab: [w.gombo] }
      - { es: "Le jambalaya de mon oncle est si épicé que personne n'en reprend.", en: "My uncle's jambalaya is so spicy that nobody has seconds.", altEs: ["Le jambalaya de mon oncle est tellement épicé que personne n'en reprend."], grammar: [g.acadian-french, g.pronoun-en], vocab: [w.jambalaya], transform: { instruction: "Make it positive: everyone has seconds (tout le monde)", answer: "Le jambalaya de mon oncle est si bon que tout le monde en reprend.", alt: ["Le jambalaya de mon oncle est tellement bon que tout le monde en reprend."], en: "My uncle's jambalaya is so good that everyone has seconds." } }
      - { es: "Un alligator dormait au bord de l'eau, à deux pas de notre pirogue.", en: "An alligator was sleeping at the water's edge, a stone's throw from our canoe.", altEs: ["Un alligator dormait au bord de l'eau, tout près de notre pirogue."], grammar: [g.acadian-french, g.imparfait-uses], vocab: [w.alligator] }
      - { es: "Le samedi soir, tout le village allait au fais-dodo, même les grands-parents.", en: "On Saturday nights the whole village went to the fais-dodo, even the grandparents.", altEs: ["Le samedi soir, tout le village se retrouvait au fais-dodo, même les grands-parents."], grammar: [g.acadian-french, g.imparfait-uses], vocab: [w.fais-dodo], note: "According to the usual explanation, the name comes from parents telling their little ones 'fais dodo' (go to sleep) so that they could dance." }
      - { es: "Un violoneux et un accordéon, il n'en faut pas plus pour faire danser une salle entière.", en: "A fiddler and an accordion: that's all it takes to get a whole hall dancing.", altEs: ["Un violoneux et un accordéon : il n'en faut pas plus pour faire danser toute une salle."], grammar: [g.acadian-french, g.faire-causatif], vocab: [w.violoneux, w.accordéon] }
      - { es: "Le zydeco, musique des Créoles noirs de Louisiane, mélange le blues et les airs cadiens.", en: "Zydeco, the music of Louisiana's Black Creoles, mixes blues with Cajun tunes.", altEs: ["Le zydeco, la musique des Créoles noirs de Louisiane, mélange le blues et les airs cadiens."], grammar: [g.acadian-french], vocab: [w.zydeco] }
      - { es: "« Laissez les bons temps rouler » est un calque de l'anglais devenu la devise de la Louisiane festive.", en: "'Laissez les bons temps rouler' is a calque from English that has become the motto of festive Louisiana.", altEs: ["« Laissez les bons temps rouler », c'est un calque de l'anglais devenu la devise de la Louisiane qui fait la fête."], grammar: [g.anglicisms-calques], vocab: [w.laissez-les-bons-temps-rouler, w.calque] }
      - { es: "Mon grand-père watche la télé en anglais, mais il jure en français.", en: "My grandfather watches TV in English, but he swears in French.", altEs: ["Mon grand-père regarde la télé en anglais, mais il jure en français."], grammar: [g.anglicisms-calques, g.acadian-french], vocab: [w.watcher, w.jurer], transform: { instruction: "Replace the English loan with a standard French verb", answer: "Mon grand-père regarde la télé en anglais, mais il jure en français.", alt: ["Mon grand-père regarde la télévision en anglais, mais il jure en français."], en: "My grandfather watches TV in English, but he swears in French." } }
      - { es: "Va checker si le truck est encore dans la cour.", en: "Go and check whether the truck is still in the yard.", altEs: ["Va vérifier si le camion est encore dans la cour."], grammar: [g.anglicisms-calques, g.acadian-french], vocab: [w.checker, w.truck] }
      - { es: "Ils ont cancellé le bal à cause de l'orage.", en: "They cancelled the dance because of the storm.", altEs: ["Ils ont annulé le bal à cause de l'orage."], grammar: [g.anglicisms-calques], vocab: [w.canceller, w.bal], note: "Standard French: annuler.", error: { wrong: "Ils ont cancellés le bal à cause de l'orage.", explain: "With avoir, the participle doesn't agree with the subject: ils ont cancellé (standard: ils ont annulé).", grammar: g.passe-compose-avoir } }
      - { es: "Dans la cuisine, la boucane du barbecue piquait les yeux de tout le monde.", en: "In the kitchen, the smoke from the barbecue stung everyone's eyes.", altEs: ["Dans la cuisine, la fumée du barbecue piquait les yeux de tout le monde."], grammar: [g.acadian-french, g.imparfait-uses], vocab: [w.boucane] }
      - { es: "Ma grand-mère appelle encore sa poupée « ma catin », comme sa mère avant elle.", en: "My grandmother still calls her doll 'ma catin', like her mother before her.", altEs: ["Ma grand-mère dit encore « ma catin » pour sa poupée, comme sa mère avant elle."], grammar: [g.acadian-french], vocab: [w.catin], note: "Catin = doll in Acadian and Cajun French; in France the word is old and insulting." }
      - { es: "Si tu viens en avril, on ira au festival écouter du zydeco jusqu'à minuit.", en: "If you come in April, we'll go to the festival and listen to zydeco until midnight.", altEs: ["Si tu viens en avril, on ira écouter du zydeco au festival jusqu'à minuit."], grammar: [g.si-present-futur], vocab: [w.zydeco] }
    exchanges:
      - q: { es: "C'est quoi, un fais-dodo ?", en: "What's a fais-dodo?" }
        a: { es: "Un bal cadien où toute la famille vient danser, des grands-parents aux bébés.", en: "A Cajun dance where the whole family comes to dance, from the grandparents to the babies." }
        alt: ["Un bal cadien.", "Une soirée de danse en famille."]
        grammar: [g.acadian-french, g.relative-ou]
        vocab: [w.fais-dodo]
      - q: { es: "On mange quoi, ce soir ?", en: "What are we eating tonight?" }
        a: { es: "Des écrevisses bouillies, et ma mère a fait un gombo au poulet.", en: "Boiled crayfish, and my mother has made a chicken gumbo." }
        alt: ["Un jambalaya !", "Du gombo, comme d'habitude."]
        grammar: [g.partitive-articles]
        vocab: [w.écrevisse, w.gombo]
      - q: { es: "Tu as vu des alligators sur le bayou ?", en: "Did you see any alligators on the bayou?" }
        a: { es: "Trois, et un chaoui qui essayait de nous voler le pique-nique.", en: "Three, and a raccoon that tried to steal our picnic." }
        alt: ["Oui, deux !", "Non, seulement des ouaouarons."]
        grammar: [g.imparfait-uses]
        vocab: [w.alligator, w.chaoui]
      - q: { es: "Qu'est-ce qu'on joue dans un groupe cadien ?", en: "What do people play in a Cajun band?" }
        a: { es: "Surtout de l'accordéon et du violon, parfois avec un triangle.", en: "Mainly accordion and fiddle, sometimes with a triangle." }
        alt: ["L'accordéon et le violon.", "Du violon, surtout."]
        grammar: [g.jouer-faire-de]
        vocab: [w.accordéon, w.violoneux]
      - q: { es: "Pourquoi tu dis « canceller » ?", en: "Why do you say 'canceller'?" }
        a: { es: "C'est l'habitude ; en français standard, il faudrait dire « annuler ».", en: "It's habit; in standard French you should say 'annuler'." }
        alt: ["Par habitude ; on devrait dire « annuler ».", "C'est un anglicisme, je sais."]
        grammar: [g.anglicisms-calques, g.conditionnel-present]
        vocab: [w.canceller]
    texts:
      - title: "Affiche de bal"
        es: ["Grand fais-dodo samedi soir à la salle paroissiale !", "Musique cadienne et zydeco jusqu'à minuit.", "Gombo et jambalaya pour tout le monde.", "Laissez les bons temps rouler !"]
        en: ["Big fais-dodo on Saturday night at the parish hall!", "Cajun music and zydeco until midnight.", "Gumbo and jambalaya for everyone.", "Let the good times roll!"]
        grammar: [g.acadian-french]
        vocab: [w.fais-dodo, w.zydeco, w.gombo, w.jambalaya, w.laissez-les-bons-temps-rouler]
      - title: "Recette de la grand-mère"
        es: ["Faites d'abord un roux, couleur chocolat.", "Ajoutez l'oignon, le céleri et le poivron.", "Mettez les écrevisses à la fin, sinon elles durcissent."]
        en: ["First make a roux, the colour of chocolate.", "Add the onion, celery and pepper.", "Put the crayfish in at the end, otherwise they go tough."]
        grammar: [g.imperative]
        vocab: [w.écrevisse]
    spicy:
      - { es: "Laissez les bons temps rouler, mais pas trop vite : j'aimerais encore danser une valse avec toi.", en: "Let the good times roll, but not too fast: I'd still like to dance a waltz with you.", altEs: ["Laissez les bons temps rouler, mais pas trop vite : je voudrais encore danser une valse avec toi."], grammar: [g.anglicisms-calques, g.conditional-politeness], vocab: [w.laissez-les-bons-temps-rouler, w.valse] }
      - { es: "Le violoneux jouait pour toute la salle, mais il ne regardait que toi.", en: "The fiddler was playing for the whole hall, but he only had eyes for you.", altEs: ["Le violoneux jouait pour toute la salle, mais il ne regardait que toi !"], grammar: [g.acadian-french, g.negation-jamais-plus-rien], vocab: [w.violoneux] }
      - { es: "Tu as checké mon profil trois fois hier soir ; la prochaine fois, invite-moi au fais-dodo.", en: "You checked my profile three times last night; next time, invite me to the fais-dodo.", altEs: ["Tu as vérifié mon profil trois fois hier soir ; la prochaine fois, invite-moi au fais-dodo."], grammar: [g.anglicisms-calques, g.imperative-with-pronouns], vocab: [w.checker, w.fais-dodo] }
      - { es: "Si tu cancelles encore notre rendez-vous, je donne ta part d'écrevisses au chaoui.", en: "If you cancel our date again, I'll give your share of crayfish to the raccoon.", altEs: ["Si tu annules encore notre rendez-vous, je donne ta part d'écrevisses au chaoui."], grammar: [g.anglicisms-calques, g.si-present-futur], vocab: [w.canceller, w.écrevisse, w.chaoui] }
      - { es: "Plus chaud que mon gombo, plus fier qu'un alligator : voilà le cavalier que je cherchais.", en: "Hotter than my gumbo, prouder than an alligator: that's the dance partner I was looking for.", altEs: ["Plus chaud que mon gombo et plus fier qu'un alligator : voilà le cavalier que je cherchais."], grammar: [g.comparatives], vocab: [w.gombo, w.alligator] }
  - id: c2.u06.l3
    title: "Maître Corbeau, sur un arbre perché"
    teach: [g.classical-french]
    tip: "In 17th-century French the object pronoun goes before the modal (Nous l'allons montrer = nous allons le montrer), point replaces pas, en son bec means dans son bec, and words like amant, ennui, honnête homme meant something different."
    vocab: [w.fable, w.fabuliste, w.morale, w.flatteur, w.flatter, w.ramage, w.plumage, w.fourmi, w.lièvre, w.tortue, w.grenouille, w.corbeau, w.choir, w.courroux, w.ire, w.céans, w.moult, w.amant, w.honnête-homme, w.honnête, w.préciosité, w.précieux, w.galanterie, w.galant, w.courtisan, w.bienséance, w.vraisemblance, w.cassette, w.pronom, w.conjuguer, w.éclater, w.pédant, w.sincérité, w.tourment, w.aux-dépens-de]
    sentences:
      - { es: "« Maître corbeau, sur un arbre perché / Tenait en son bec un fromage » : c'est l'un des débuts les plus connus de la langue française.", en: "'Master Crow, perched on a tree, held a cheese in his beak': it's one of the best-known openings in the French language.", altEs: ["« Maître corbeau, sur un arbre perché / Tenait en son bec un fromage » : c'est un des débuts les plus connus de la langue française."], grammar: [g.classical-french, g.superlatives], vocab: [w.corbeau, w.fable], note: "La Fontaine, Fables, book I (1668). En son bec = dans son bec." }
      - { es: "« Si votre ramage se rapporte à votre plumage » : le renard compare le chant du corbeau à ses plumes.", en: "'If your song matches your plumage': the fox compares the crow's song to its feathers.", altEs: ["« Si votre ramage se rapporte à votre plumage » : le renard compare la voix du corbeau à ses plumes."], grammar: [g.classical-french], vocab: [w.ramage, w.plumage] }
      - { es: "La morale de la fable, c'est que tout flatteur vit aux dépens de celui qui l'écoute.", en: "The moral of the fable is that every flatterer lives at the expense of whoever listens to him.", altEs: ["La morale de cette fable : tout flatteur vit aux dépens de celui qui l'écoute."], grammar: [g.classical-french, g.demonstrative-pronouns], vocab: [w.morale, w.flatteur] }
      - { es: "« Nous l'allons montrer tout à l'heure » : en français classique, le pronom se place devant le verbe conjugué.", en: "'We shall show it presently': in classical French the pronoun goes before the conjugated verb.", altEs: ["« Nous l'allons montrer tout à l'heure » : au XVIIe siècle, le pronom se place devant le verbe conjugué."], grammar: [g.classical-french], vocab: [w.placer], note: "La Fontaine, « Le Loup et l'Agneau ». Modern French: nous allons le montrer." }
      - { es: "Je le veux voir.", en: "I want to see him.", grammar: [g.classical-french], vocab: [], transform: { instruction: "Modernise the pronoun position", answer: "Je veux le voir.", alt: [], en: "I want to see him." } }
      - { es: "Je ne le sais point.", en: "I do not know it.", grammar: [g.classical-french, g.ne-litteraire], vocab: [], transform: { instruction: "Modernise the negation", answer: "Je ne le sais pas.", alt: [], en: "I don't know it." } }
      - { es: "« Vous chantiez ? j'en suis fort aise. Eh bien : dansez maintenant. » La fourmi n'est pas prêteuse.", en: "'You were singing? I'm delighted. Well then: dance now.' The ant is no lender.", altEs: ["« Vous chantiez ? j'en suis fort aise. Eh bien : dansez maintenant. » La fourmi ne prête rien."], grammar: [g.classical-french, g.imparfait-uses], vocab: [w.fourmi], note: "La Fontaine, « La Cigale et la Fourmi ». Fort aise = very glad." }
      - { es: "Dans la fable, le lièvre se moque de la tortue, et c'est pourtant elle qui gagne la course.", en: "In the fable the hare makes fun of the tortoise, and yet she is the one who wins the race.", altEs: ["Dans la fable, le lièvre se moque de la tortue, mais c'est elle qui gagne la course."], grammar: [g.classical-french, g.mise-en-relief], vocab: [w.lièvre, w.tortue] }
      - { es: "La grenouille veut se faire aussi grosse que le bœuf, et elle finit par éclater.", en: "The frog wants to make herself as big as the ox, and ends up bursting.", altEs: ["La grenouille veut devenir aussi grosse que le bœuf, et elle finit par éclater."], grammar: [g.classical-french, g.comparatives], vocab: [w.grenouille] }
      - { es: "Au XVIIe siècle, un « amant » est celui qui aime et qui est aimé, pas forcément un amoureux secret.", en: "In the 17th century an 'amant' is one who loves and is loved, not necessarily a secret lover.", altEs: ["Au XVIIe siècle, « amant » désigne celui qui aime et qui est aimé, pas forcément un amoureux caché."], grammar: [g.classical-french], vocab: [w.amant] }
      - { es: "L'honnête homme de l'époque classique n'est pas seulement honnête : il est cultivé, poli et jamais pédant.", en: "The honnête homme of the classical age isn't just honest: he is cultured, polite and never pedantic.", altEs: ["L'honnête homme du XVIIe siècle n'est pas seulement honnête : il est cultivé, poli et jamais pédant."], grammar: [g.classical-french], vocab: [w.honnête-homme, w.honnête], error: { wrong: "L'honnête homme de l'époque classique n'est pas seulement honnête : il est cultivé, poli et pas jamais pédant.", explain: "jamais already carries the negation here; don't add pas.", grammar: g.negation-jamais-plus-rien } }
      - { es: "Dans Les Précieuses ridicules, Molière se moque de la préciosité et de son langage trop recherché.", en: "In The Affected Young Ladies, Molière mocks preciosity and its over-refined language.", altEs: ["Dans Les Précieuses ridicules, Molière se moque de la préciosité et de son langage compliqué."], grammar: [g.classical-french], vocab: [w.préciosité, w.précieux] }
      - { es: "Harpagon dit des beaux yeux de sa cassette ce qu'un amant dirait de sa maîtresse.", en: "Harpagon says of the beautiful eyes of his cash box what a lover would say of his mistress.", altEs: ["Harpagon parle des beaux yeux de sa cassette comme un amant parlerait de sa maîtresse."], grammar: [g.classical-french, g.conditionnel-present], vocab: [w.amant, w.cassette], note: "Molière, L'Avare: « Les beaux yeux de ma cassette ! »" }
      - { es: "À la cour, la galanterie et la bienséance comptaient plus que la sincérité.", en: "At court, gallantry and decorum counted for more than sincerity.", altEs: ["À la cour, on accordait plus d'importance à la galanterie et à la bienséance qu'à la sincérité."], grammar: [g.classical-french, g.imparfait-uses], vocab: [w.galanterie, w.bienséance, w.courtisan] }
      - { es: "Le théâtre classique exige la vraisemblance : ce qui est vrai ne paraît pas toujours vraisemblable.", en: "Classical theatre demands plausibility: what is true doesn't always seem plausible.", altEs: ["Le théâtre classique demande de la vraisemblance, car le vrai ne paraît pas toujours vraisemblable."], grammar: [g.classical-french, g.ce-qui-ce-que], vocab: [w.vraisemblance, w.vraisemblable] }
      - { es: "« Moult » et « céans » font sourire aujourd'hui : on ne les emploie plus que par plaisanterie.", en: "'Moult' and 'céans' raise a smile today: people only use them as a joke now.", altEs: ["Aujourd'hui, « moult » et « céans » font sourire : on ne les utilise plus que pour plaisanter."], grammar: [g.classical-french, g.negation-jamais-plus-rien], vocab: [w.moult, w.céans, w.ire, w.courroux, w.choir] }
    exchanges:
      - q: { es: "Quelle est la morale du Corbeau et du Renard ?", en: "What's the moral of The Crow and the Fox?" }
        a: { es: "Que tout flatteur vit aux dépens de celui qui l'écoute.", en: "That every flatterer lives at the expense of whoever listens to him." }
        alt: ["Il ne faut pas écouter les flatteurs.", "Méfie-toi des flatteurs."]
        grammar: [g.classical-french]
        vocab: [w.morale, w.flatteur]
      - q: { es: "Pourquoi La Fontaine écrit-il « en son bec » ?", en: "Why does La Fontaine write 'en son bec'?" }
        a: { es: "C'est l'usage du XVIIe siècle ; aujourd'hui, on dirait « dans son bec ».", en: "It's 17th-century usage; today we'd say 'dans son bec'." }
        alt: ["C'est du français classique.", "Aujourd'hui, on dirait « dans son bec »."]
        grammar: [g.classical-french, g.conditionnel-present]
        vocab: [w.fabuliste]
      - q: { es: "Le mot « ennui » avait le même sens chez Racine ?", en: "Did the word 'ennui' have the same meaning in Racine?" }
        a: { es: "Non, il désignait un désespoir profond, presque un tourment.", en: "No, it meant deep despair, almost a torment." }
        alt: ["Non, c'était bien plus fort.", "Non, c'était le désespoir."]
        grammar: [g.classical-french, g.imparfait-uses]
        vocab: []
      - q: { es: "Tu as déjà lu L'Avare ?", en: "Have you ever read The Miser?" }
        a: { es: "Oui, au collège ; j'ai encore en tête Harpagon qui crie « Sans dot ! » à chaque réplique.", en: "Yes, at secondary school; I can still picture Harpagon shouting 'No dowry!' at every line." }
        alt: ["Oui, et je l'ai vu au théâtre.", "Non, seulement des extraits."]
        grammar: [g.passe-compose-avoir]
        vocab: [w.cassette]
      - q: { es: "Pourquoi les fables parlent-elles d'animaux ?", en: "Why do fables talk about animals?" }
        a: { es: "Pour critiquer les hommes, et surtout les puissants, sans les nommer.", en: "To criticise people, and especially the powerful, without naming them." }
        alt: ["Pour critiquer la cour sans danger.", "Pour donner une leçon sans nommer personne."]
        grammar: [g.pour-sans-infinitive]
        vocab: [w.fable, w.courtisan]
    texts:
      - title: "La Fontaine, « Le Corbeau et le Renard » (début)"
        es: ["Maître corbeau, sur un arbre perché", "Tenait en son bec un fromage.", "Maître renard par l'odeur alléché", "Lui tint à peu près ce langage."]
        en: ["Master Crow, perched on a tree,", "Held a cheese in his beak.", "Master Fox, lured by the smell,", "Spoke to him more or less like this."]
        grammar: [g.classical-french, g.poetic-syntax]
        vocab: [w.corbeau, w.fable]
      - title: "La Fontaine, « Le Loup et l'Agneau » (début)"
        es: ["La raison du plus fort est toujours la meilleure :", "Nous l'allons montrer tout à l'heure."]
        en: ["The reason of the strongest is always the best:", "We shall show it presently."]
        grammar: [g.classical-french]
        vocab: [w.fable, w.morale]
    spicy:
      - { es: "Si ton ramage se rapporte à ton plumage, tu es le phénix de cette soirée.", en: "If your song matches your plumage, you're the phoenix of this party.", altEs: ["Si ta voix se rapporte à ton plumage, tu es le phénix de cette soirée."], grammar: [g.classical-french], vocab: [w.ramage, w.plumage] }
      - { es: "Je ne suis point un flatteur : quand je dis que tu es belle, je ne veux pas ton fromage.", en: "I am no flatterer: when I say you're beautiful, I'm not after your cheese.", altEs: ["Je ne suis pas un flatteur : quand je dis que tu es belle, je ne veux pas ton fromage."], grammar: [g.classical-french], vocab: [w.flatteur] }
      - { es: "Au XVIIe siècle, j'aurais été ton amant ; aujourd'hui, je me contenterais d'un deuxième rendez-vous.", en: "In the 17th century I'd have been your suitor; today I'd settle for a second date.", altEs: ["Au XVIIe siècle, j'aurais été ton amant ; aujourd'hui, un deuxième rendez-vous me suffirait."], grammar: [g.classical-french, g.conditionnel-passe], vocab: [w.amant] }
      - { es: "Tu es plus lent que la tortue pour répondre à mes messages, mais je sais que tu finis toujours par gagner.", en: "You're slower than the tortoise at answering my messages, but I know you always win in the end.", altEs: ["Tu réponds à mes messages plus lentement que la tortue, mais je sais que tu finis toujours par gagner."], grammar: [g.classical-french, g.comparatives], vocab: [w.tortue] }
      - { es: "Galant comme un courtisan, honnête comme un honnête homme : il ne te manque plus que d'arriver à l'heure.", en: "Gallant as a courtier, refined as an honnête homme: now all you need is to arrive on time.", altEs: ["Galant comme un courtisan et honnête comme un honnête homme : il ne te manque plus que d'arriver à l'heure."], grammar: [g.classical-french], vocab: [w.galant, w.courtisan, w.honnête-homme] }
  - id: c2.u06.l4
    title: "Faire un footing ou prendre une marche ?"
    teach: [g.anglicisms-calques]
    tip: "France borrows English words (le parking, le week-end) and invents fake ones (le footing, le brushing); Québec prefers French words (stationnement, fin de semaine, courriel) but absorbs calques (prendre une marche, à date). Standard: postuler à un emploi, se rendre compte que, avoir du sens."
    vocab: [w.anglicisme, w.calque, w.faux-ami, w.footing, w.brushing, w.baskets, w.babysitter, w.prendre-une-marche, w.à-date, w.faire-du-sens, w.appliquer, w.postuler, w.naturel, w.stratégie]
    sentences:
      - { es: "À Paris, on cherche un parking ; à Montréal, un stationnement.", en: "In Paris you look for a 'parking'; in Montreal, a 'stationnement'.", altEs: ["À Paris, on cherche un parking, à Montréal, un stationnement."], grammar: [g.anglicisms-calques], vocab: [w.anglicisme] }
      - { es: "« Footing » a l'air anglais, mais aucun anglophone ne l'emploie dans ce sens.", en: "'Footing' looks English, but no English speaker uses it in that sense.", altEs: ["Le mot « footing » a l'air anglais, mais aucun anglophone ne l'utilise dans ce sens."], grammar: [g.anglicisms-calques, g.ni-ni-aucun], vocab: [w.footing, w.anglophone] }
      - { es: "Je vais faire un footing le long du bayou avant qu'il fasse trop chaud.", en: "I'm going for a jog along the bayou before it gets too hot.", altEs: ["Je vais faire un footing au bord du bayou avant qu'il ne fasse trop chaud."], grammar: [g.anglicisms-calques, g.subjonctif-conjonctions], vocab: [w.footing, w.bayou] }
      - { es: "On va prendre une marche après le souper ?", en: "Shall we go for a walk after supper?", altEs: ["On va faire une promenade après le souper ?", "On va se promener après le dîner ?"], grammar: [g.anglicisms-calques], vocab: [w.prendre-une-marche, w.souper], transform: { instruction: "Replace the Québec calque with standard French", answer: "On va faire une promenade après le dîner ?", alt: ["On va se promener après le dîner ?", "On va faire une promenade après le souper ?", "On va faire un tour après le dîner ?"], en: "Shall we go for a walk after dinner?" } }
      - { es: "À date, nous avons reçu trente candidatures.", en: "To date, we have received thirty applications.", altEs: ["Jusqu'à présent, nous avons reçu trente candidatures."], grammar: [g.anglicisms-calques], vocab: [w.à-date, w.candidature], transform: { instruction: "Replace the calque à date with standard French", answer: "Jusqu'à présent, nous avons reçu trente candidatures.", alt: ["Jusqu'ici, nous avons reçu trente candidatures.", "Jusqu'à maintenant, nous avons reçu trente candidatures."], en: "So far, we have received thirty applications." } }
      - { es: "Elle a postulé à un emploi d'enseignante à Lafayette.", en: "She applied for a teaching job in Lafayette.", altEs: ["Elle a postulé pour un emploi d'enseignante à Lafayette."], grammar: [g.anglicisms-calques, g.verbs-prepositions], vocab: [w.postuler], error: { wrong: "Elle a appliqué pour un emploi d'enseignante à Lafayette.", explain: "Appliquer pour is a calque of 'apply for'; standard French says postuler à (or pour) un emploi.", grammar: g.anglicisms-calques } }
      - { es: "Ça a du sens, même si on entend de plus en plus « ça fait du sens ».", en: "It makes sense, even if you hear 'ça fait du sens' more and more.", altEs: ["Ça a du sens, même si l'on entend de plus en plus « ça fait du sens »."], grammar: [g.anglicisms-calques], vocab: [w.faire-du-sens] }
      - { es: "Je me suis rendu compte de mon erreur trop tard.", en: "I realised my mistake too late.", altEs: ["Je me suis aperçu de mon erreur trop tard."], grammar: [g.anglicisms-calques, g.pronominal-passe-compose], vocab: [w.calque], error: { wrong: "J'ai réalisé de mon erreur trop tard.", explain: "Réaliser in the sense of 'realise' is a calque, and it never takes de. Standard: se rendre compte de, s'apercevoir de.", grammar: g.anglicisms-calques } }
      - { es: "« Actuellement » est un faux ami : il veut dire « en ce moment », pas « en fait ».", en: "'Actuellement' is a false friend: it means 'at the moment', not 'actually'.", altEs: ["« Actuellement » est un faux ami : il signifie « en ce moment », pas « en fait »."], grammar: [g.anglicisms-calques], vocab: [w.faux-ami] }
      - { es: "Ma coiffeuse m'a fait un brushing pour le mariage de ma cousine.", en: "My hairdresser gave me a blow-dry for my cousin's wedding.", altEs: ["Pour le mariage de ma cousine, ma coiffeuse m'a fait un brushing."], grammar: [g.anglicisms-calques, g.faire-causatif], vocab: [w.brushing], note: "Le brushing: a French invention that looks English." }
      - { es: "Mets tes baskets : on part marcher sur la digue.", en: "Put your trainers on: we're going for a walk on the levee.", altEs: ["Mets tes baskets, on part marcher sur la digue."], grammar: [g.anglicisms-calques, g.imperative], vocab: [w.baskets] }
      - { es: "Nous cherchons une babysitter qui parle français à nos deux petits.", en: "We're looking for a babysitter who speaks French to our two little ones.", altEs: ["On cherche une babysitter qui parle français à nos deux petits."], grammar: [g.anglicisms-calques, g.subjonctif-relatives], vocab: [w.babysitter], note: "In Québec: une gardienne." }
      - { es: "Le mot « courriel » est né au Québec, et la France a fini par le recommander à son tour.", en: "The word 'courriel' was born in Québec, and France eventually recommended it too.", altEs: ["Le mot « courriel » vient du Québec, et la France a fini par le recommander à son tour."], grammar: [g.anglicisms-calques], vocab: [w.anglicisme, w.courriel] }
      - { es: "Depuis la loi Toubon de 1994, la publicité en France doit être rédigée en français.", en: "Since the Toubon law of 1994, advertising in France must be written in French.", altEs: ["Depuis 1994 et la loi Toubon, la publicité doit être rédigée en français en France."], grammar: [g.anglicisms-calques, g.passive-voice], vocab: [w.anglicisme], note: "English slogans are allowed if a French translation accompanies them." }
      - { es: "Si tu appliques ce conseil, ton français sonnera plus naturel des deux côtés de l'Atlantique.", en: "If you apply this advice, your French will sound more natural on both sides of the Atlantic.", altEs: ["Si tu suis ce conseil, ton français sonnera plus naturel des deux côtés de l'Atlantique."], grammar: [g.anglicisms-calques, g.si-present-futur], vocab: [w.appliquer], note: "Appliquer un conseil is standard; appliquer pour un emploi is a calque." }
    exchanges:
      - q: { es: "Tu fais quoi, ce soir ?", en: "What are you doing tonight?" }
        a: { es: "Un footing le long du bayou, puis je vais au bal.", en: "A jog along the bayou, then I'm going to the dance." }
        alt: ["Je vais faire un footing.", "Rien de spécial, je prends une marche."]
        grammar: [g.anglicisms-calques]
        vocab: [w.footing]
      - q: { es: "« Ça fait du sens », c'est correct ?", en: "Is 'ça fait du sens' correct?" }
        a: { es: "C'est un calque de l'anglais ; en français soigné, on dit « ça a du sens ».", en: "It's a calque from English; in careful French we say 'ça a du sens'." }
        alt: ["Pas vraiment, on dit « ça a du sens ».", "C'est un calque, mais on l'entend partout."]
        grammar: [g.anglicisms-calques]
        vocab: [w.calque, w.faire-du-sens]
      - q: { es: "Comment dit-on « week-end » au Québec ?", en: "How do you say 'week-end' in Québec?" }
        a: { es: "On dit « la fin de semaine », comme on dit « courriel » au lieu de « mail ».", en: "They say 'la fin de semaine', just as they say 'courriel' instead of 'mail'." }
        alt: ["La fin de semaine.", "« Fin de semaine »."]
        grammar: [g.anglicisms-calques]
        vocab: [w.anglicisme]
      - q: { es: "Tu as postulé où ?", en: "Where did you apply?" }
        a: { es: "À l'université et dans deux écoles d'immersion ; à date, personne ne m'a répondu.", en: "At the university and at two immersion schools; so far nobody has answered." }
        alt: ["À l'université.", "Dans une école d'immersion."]
        grammar: [g.anglicisms-calques]
        vocab: [w.postuler, w.à-date]
      - q: { es: "Pourquoi « librairie » est-il un faux ami ?", en: "Why is 'librairie' a false friend?" }
        a: { es: "Parce qu'une librairie vend des livres ; pour en emprunter, il faut aller à la bibliothèque.", en: "Because a librairie sells books; to borrow them you have to go to the library." }
        alt: ["C'est un magasin de livres, pas une bibliothèque.", "Ça veut dire « bookshop »."]
        grammar: [g.anglicisms-calques, g.pronoun-en]
        vocab: [w.faux-ami]
    texts:
      - title: "Panneau à Montréal et à Paris"
        es: ["Montréal : ARRÊT.", "Paris : STOP.", "Même panneau rouge, deux politiques linguistiques."]
        en: ["Montreal: ARRÊT.", "Paris: STOP.", "Same red sign, two language policies."]
        grammar: [g.anglicisms-calques]
        vocab: [w.anglicisme]
      - title: "Petite annonce"
        es: ["Famille de Lafayette cherche babysitter francophone.", "Trois soirs par semaine, après l'école.", "Pour postuler, envoyez un courriel avant vendredi."]
        en: ["Lafayette family seeks French-speaking babysitter.", "Three evenings a week, after school.", "To apply, send an email before Friday."]
        grammar: [g.anglicisms-calques, g.imperative]
        vocab: [w.babysitter, w.postuler]
    spicy:
      - { es: "Tu m'as proposé de prendre une marche ; à Paris, on appellerait ça un rendez-vous.", en: "You suggested we go for a walk; in Paris they'd call that a date.", altEs: ["Tu m'as proposé de faire une promenade ; à Paris, on appellerait ça un rendez-vous."], grammar: [g.anglicisms-calques, g.conditionnel-present], vocab: [w.prendre-une-marche] }
      - { es: "À date, tu m'as fait trois compliments et zéro invitation : il faut revoir ta stratégie.", en: "So far you've paid me three compliments and zero invitations: you need to rethink your strategy.", altEs: ["Jusqu'à présent, tu m'as fait trois compliments et zéro invitation : il faut revoir ta stratégie."], grammar: [g.anglicisms-calques], vocab: [w.à-date] }
      - { es: "Ton brushing est parfait, mais tu sais que le vent du bayou n'a aucun respect.", en: "Your blow-dry is perfect, but you know the bayou wind has no respect.", altEs: ["Ton brushing est parfait, mais le vent du bayou n'a aucun respect, tu sais."], grammar: [g.anglicisms-calques], vocab: [w.brushing] }
      - { es: "Je n'ai pas appliqué pour ce poste : j'ai postulé à ton cœur, et j'attends toujours l'entretien.", en: "I didn't 'apply for' this position: I applied for your heart, and I'm still waiting for the interview.", altEs: ["Je n'ai pas postulé pour ce poste : j'ai postulé à ton cœur, et j'attends toujours l'entretien."], grammar: [g.anglicisms-calques], vocab: [w.appliquer, w.postuler] }
      - { es: "Que tu m'invites à faire un footing à six heures du matin, ça n'a aucun sens, mais j'y serai.", en: "Your inviting me for a jog at six in the morning makes no sense, but I'll be there.", altEs: ["Que tu m'invites à faire un footing à six heures du matin, ça n'a pas de sens, mais j'y serai."], grammar: [g.anglicisms-calques, g.subjonctif-doute], vocab: [w.footing] }
dialogues:
  - id: c2.u06.d1
    title: "Au fais-dodo"
    context: "Claire, a student from Paris, meets Amédée, an old Cajun fiddler, during the break at a dance in Lafayette."
    lines:
      - { speaker: Amédée, es: "Bonsoir, mademoiselle ! Vous êtes pas d'icitte, vous ?", en: "Good evening, miss! You're not from here, are you?" }
      - { speaker: Claire, es: "Non, je viens de Paris. Je fais une thèse sur le français de Louisiane.", en: "No, I'm from Paris. I'm doing a thesis on Louisiana French." }
      - { speaker: Amédée, es: "Ah ben, vous êtes à la bonne place ! Ici, ils parlont encore français, surtout les vieux, mais les jeunes s'y remettont.", en: "Well, you're in the right place! Here people still speak French, mostly the old folks, but the young ones are getting back into it." }
      - { speaker: Claire, es: "Pourtant, on m'a dit qu'on punissait les élèves qui le parlaient à l'école.", en: "And yet I was told pupils who spoke it at school used to be punished." }
      - { speaker: Amédée, es: "C'est vrai. Moi, j'ai été puni plus d'une fois. Mais asteur, mes petits-enfants vont à l'école d'immersion.", en: "That's true. I was punished more than once. But now my grandchildren go to the immersion school." }
      - { speaker: Claire, es: "Et vous, comment avez-vous appris le violon ?", en: "And you, how did you learn the fiddle?" }
      - { speaker: Amédée, es: "Avec mon père. Il disait : « La musique, ça se transmet comme la langue, à l'oreille. »", en: "With my father. He used to say: 'Music is passed on like language, by ear.'" }
      - { speaker: Claire, es: "Ça me fait penser à La Fontaine : « Nous l'allons montrer tout à l'heure. » Vous avez gardé des formes très anciennes.", en: "That reminds me of La Fontaine: 'We shall show it presently.' You've kept some very old forms." }
      - { speaker: Amédée, es: "La Fontaine, je le connais pas, mais si y joue de l'accordéon, il peut venir !", en: "I don't know this La Fontaine, but if he plays the accordion, he can come!" }
      - { speaker: Claire, es: "Il est mort depuis trois siècles, malheureusement.", en: "He's been dead for three centuries, unfortunately." }
      - { speaker: Amédée, es: "Tant pis pour lui. Espérez-moi icitte, je vas jouer une valse, et après, on danse !", en: "Too bad for him. Wait for me here, I'm going to play a waltz, and afterwards we dance!" }
    questions:
      - { q: "Pourquoi Claire est-elle en Louisiane ?", options: ["Pour ses vacances", "Pour une thèse sur le français de Louisiane", "Pour apprendre le violon"], answer: 1, explain: "She says she is writing a thesis on Louisiana French." }
      - { q: "Que s'est-il passé pour Amédée à l'école ?", options: ["Il a été puni parce qu'il parlait français", "Il a appris l'anglais avec plaisir", "Il a joué du violon pour ses professeurs"], answer: 0, explain: "Amédée says he was punished more than once for speaking French." }
      - { q: "Comment Amédée a-t-il appris la musique ?", options: ["À l'école d'immersion", "Avec son père, à l'oreille", "Dans un livre"], answer: 1, explain: "His father taught him and said music is passed on by ear, like language." }
      - { q: "Que veut dire « Espérez-moi icitte » ?", options: ["Espérez que je viendrai", "Attendez-moi ici", "Suivez-moi"], answer: 1, explain: "In Cajun French espérer means 'to wait for' and icitte means 'here'." }
