id: r.c2.quatro-sonetos-de-camoes
level: c2
title: "Quatro sonetos de Camões"
kind: literature
author: Luís Vaz de Camões (c. 1524–1580)
source: "Rimas (edições póstumas, 1595 e 1598): «Amor é um fogo que arde sem se ver», «Alma minha gentil, que te partiste», «Mudam-se os tempos, mudam-se as vontades» e «Sete anos de pastor Jacob servia», na íntegra. Ortografia parcialmente atualizada. Domínio público. O primeiro parágrafo e os comentários entre os sonetos foram escritos para este curso."
intro: "Camões is also the greatest lyric poet in the language. These four sonnets, still learned by heart in Portugal and Brazil, are built on paradox, apostrophe and antithesis. Lines are separated by a slash and stanzas by a double slash; the commentary, in European Portuguese, helps you follow the argument of each poem."
allow: [jacob, labão, raquel, lia, camões, luís, vaz, rimas, petrarca, dinamene, macau, goa, coimbra, lisboa]
paragraphs:
  - { es: "O soneto, forma de catorze versos vinda de Itália, chegou a Portugal no século XVI, e foi Camões quem lhe deu a perfeição. Os seus sonetos só foram reunidos em livro quinze anos depois da sua morte, e alguns dos que lhe são atribuídos talvez não sejam seus. Os quatro que se seguem, porém, são unanimemente considerados obras-primas. Repare-se como cada um avança como um raciocínio: as quadras apresentam uma ideia, e os tercetos invertem-na ou resolvem-na no último verso.", en: "The sonnet, a fourteen-line form that came from Italy, reached Portugal in the sixteenth century, and it was Camões who perfected it. His sonnets were only collected in a book fifteen years after his death, and some of those attributed to him may not be his. The four that follow, however, are unanimously considered masterpieces. Notice how each one moves forward like a piece of reasoning: the quatrains present an idea, and the tercets invert or resolve it in the last line." }
  - { es: "I. Amor é um fogo que arde sem se ver, / É ferida que dói, e não se sente; / É um contentamento descontente, / É dor que desatina sem doer. // É um não querer mais que bem querer; / É um andar solitário entre a gente; / É nunca contentar-se de contente; / É um cuidar que ganha em se perder.", en: "I. Love is a fire that burns unseen; / it is a wound that hurts and is not felt; / it is a discontented contentment; / it is a pain that maddens without hurting; // it is wanting nothing more than to love well; / it is walking alone among people; / it is never being content with being content; / it is believing one gains by losing oneself." }
  - { es: "É querer estar preso por vontade; / É servir a quem vence, o vencedor; / É ter com quem nos mata, lealdade. // Mas como causar pode seu favor / Nos corações humanos amizade, / Se tão contrário a si é o mesmo Amor?", en: "it is wanting to be a prisoner by choice; / it is the victor serving the one he defeats; / it is being loyal to the one who kills us. // But how can its favour / cause affection in human hearts, / if Love itself is so contrary to itself?" }
  - { es: "O primeiro soneto é uma longa definição feita de contradições: dez versos seguidos começam por “É”, e cada um junta duas ideias que se excluem. Só no último terceto o poeta faz a pergunta que tudo isso prepara. O segundo soneto, pelo contrário, é uma oração dirigida a uma mulher morta; a tradição diz que se trata de Dinamene, uma jovem chinesa que teria morrido no naufrágio de que Camões se salvou.", en: "The first sonnet is a long definition made of contradictions: ten lines in a row begin with 'É', and each one joins two mutually exclusive ideas. Only in the last tercet does the poet ask the question all this prepares. The second sonnet, by contrast, is a prayer addressed to a dead woman; tradition says it is Dinamene, a young Chinese woman who supposedly died in the shipwreck Camões survived." }
  - { es: "II. Alma minha gentil, que te partiste / Tão cedo desta vida descontente, / Repousa lá no Céu eternamente, / E viva eu cá na terra sempre triste. // Se lá no assento etéreo, onde subiste, / Memória desta vida se consente, / Não te esqueças daquele amor ardente / Que já nos olhos meus tão puro viste.", en: "II. Gentle soul of mine, who departed / this life so soon, discontented, / rest there in Heaven eternally / and let me live here on earth, forever sad. // If there in the ethereal seat to which you rose / memory of this life is allowed, / do not forget that ardent love / which you once saw, so pure, in my eyes." }
  - { es: "E se vires que pode merecer-te / Algũa cousa a dor que me ficou / Da mágoa, sem remédio, de perder-te, // Roga a Deus, que teus anos encurtou, / Que tão cedo de cá me leve a ver-te, / Quão cedo de meus olhos te levou.", en: "And if you see that the grief left to me / from the hopeless sorrow of losing you / can earn me anything from you, // pray to God, who cut short your years, / that He take me from here to see you as soon / as He took you from my eyes." }
  - { es: "O terceiro soneto fala do tempo. Tudo muda, diz o poeta, mas a mudança traz mais mágoas do que alegrias, e até a natureza, que se renova todas as primaveras, lhe recorda que o tempo converte o doce canto em choro. O último terceto guarda uma surpresa: a maior mudança de todas é que a própria mudança já não é como era.", en: "The third sonnet is about time. Everything changes, says the poet, but change brings more sorrow than joy, and even nature, renewed every spring, reminds him that time turns sweet song into weeping. The last tercet holds a surprise: the greatest change of all is that change itself is no longer what it used to be." }
  - { es: "III. Mudam-se os tempos, mudam-se as vontades, / Muda-se o ser, muda-se a confiança; / Todo o mundo é composto de mudança, / Tomando sempre novas qualidades. // Continuamente vemos novidades, / Diferentes em tudo da esperança; / Do mal ficam as mágoas na lembrança, / E do bem (se algum houve), as saudades.", en: "III. Times change, wills change, / being changes, trust changes; / the whole world is made of change, / always taking on new qualities. // Continually we see new things, / different in every way from what we hoped; / of evil, the sorrows remain in memory, / and of good, if there was any, the longing." }
  - { es: "O tempo cobre o chão de verde manto, / Que já coberto foi de neve fria, / E, enfim, converte em choro o doce canto. // E, afora este mudar-se cada dia, / Outra mudança faz de mor espanto, / Que não se muda já como soía.", en: "Time covers the ground with a green mantle / that was once covered with cold snow, / and at last turns sweet song into weeping. // And, besides this changing every day, / it makes another change of greater wonder: / that it no longer changes as it used to." }
  - { es: "Por fim, um soneto narrativo, que reconta uma história bíblica: Jacob trabalhou sete anos para o pai de Raquel para poder casar com ela, mas, enganado, recebeu a irmã, Lia, e teve de servir outros sete anos. Camões transforma o episódio numa reflexão sobre a desproporção entre o amor e a vida.", en: "Finally, a narrative sonnet that retells a biblical story: Jacob worked seven years for Rachel's father in order to marry her, but, deceived, he was given her sister Leah, and had to serve another seven years. Camões turns the episode into a reflection on the disproportion between love and life." }
  - { es: "IV. Sete anos de pastor Jacob servia / Labão, pai de Raquel, serrana bela; / Mas não servia ao pai, servia a ela, / E a ela só por prémio pretendia. // Os dias, na esperança de um só dia, / Passava, contentando-se com vê-la; / Porém o pai, usando de cautela, / Em lugar de Raquel lhe dava Lia.", en: "IV. Seven years as a shepherd Jacob served / Laban, father of Rachel, a fair mountain girl; / but he was not serving the father, he was serving her, / and she alone was the prize he sought. // The days, in hope of a single day, / he spent, content just to see her; / but the father, using cunning, / gave him Leah instead of Rachel." }
  - { es: "Vendo o triste pastor que com enganos / Lhe fora assi negada a sua pastora, / Como se a não tivera merecida; // Começa de servir outros sete anos, / Dizendo: — Mais servira, se não fora / Para tão longo amor tão curta a vida.", en: "The sad shepherd, seeing that by deceit / his shepherdess had thus been denied him, / as if he had not earned her, // begins to serve another seven years, / saying: 'I would serve more, were life not / so short for so long a love.'" }
questions:
  - { q: "Que figura de estilo domina o soneto “Amor é um fogo que arde sem se ver”?", options: ["A onomatopeia", "A rima interna", "A antítese e o paradoxo", "O diálogo"], answer: 2, explain: "Every line joins opposites (contentamento descontente, ferida que dói, e não se sente): love is defined through paradox." }
  - { q: "Qual é a pergunta final do primeiro soneto?", options: ["Como pode o amor criar afeto nos corações, se é tão contrário a si mesmo", "Porque é que o amor acaba", "Quem inventou o amor", "Onde está a pessoa amada"], answer: 0, explain: "The tercets ask how Love can produce friendship and affection if it is so self-contradictory." }
  - { q: "No segundo soneto, o que o poeta pede à alma da amada?", options: ["Que volte à terra", "Que peça a Deus que o leve para junto dela tão cedo como a levou a ela", "Que o esqueça", "Que lhe perdoe"], answer: 1, explain: "'Roga a Deus (…) Que tão cedo de cá me leve a ver-te, / Quão cedo de meus olhos te levou.'" }
  - { q: "No terceiro soneto, o que fica na memória do bem?", options: ["As mágoas", "A esperança", "As saudades", "A confiança"], answer: 2, explain: "'Do mal ficam as mágoas na lembrança, / E do bem (se algum houve), as saudades.' Note the doubting aside: se algum houve." }
  - { q: "Qual é a “mudança de mor espanto” no fim do terceiro soneto?", options: ["Que a neve volta todos os anos", "Que a própria mudança já não acontece como antigamente", "Que o poeta deixou de escrever", "Que o amor se tornou ódio"], answer: 1, explain: "'Que não se muda já como soía' — even change no longer follows its old pattern; for the poet, nothing improves any more." }
  - { q: "No quarto soneto, o que quer dizer o último verso?", options: ["Que serviria ainda mais anos, se a vida não fosse tão curta para um amor tão longo", "Que Jacob se arrependeu", "Que Raquel morreu cedo", "Que Labão era justo"], answer: 0, explain: "'Mais servira, se não fora / Para tão longo amor tão curta a vida' — servira and fora are literary pluperfects with conditional meaning (serviria, se não fosse)." }
