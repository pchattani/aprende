id: a1.u06
title: 去街市買嘢
lessons:
  - id: a1.u06.l1
    title: 一百、一千、一萬
    teach: [g.big-numbers]
    tip: "Chinese counts big numbers in 萬 (10,000): 50,000 is 五萬. A gap in the middle is 零 (一百零五 = 105), and a final round unit is dropped in speech (一百五 = 150)."
    vocab: [w.baak3, w.cin1, w.maan6, w.jik1, w.saam1.b, w.fu3, w.haai4, w.kwan4, w.mou2, w.deng2, w.soeng1-coeng4, w.do1, w.siu2, w.hou2-do1, w.siu2-siu2, w.cyun4-bou6, w.gau3, w.zung6-jau5, w.zau6, w.si3, w.ngaam1]
    sentences:
      - { es: "一百、兩百、三百。", en: "One hundred, two hundred, three hundred.", grammar: [g.big-numbers], vocab: [w.baak3], kinds: [dictation, listen, typeEs, order] }
      - { es: "一千、一萬、十萬。", en: "One thousand, ten thousand, a hundred thousand.", grammar: [g.big-numbers], vocab: [w.cin1, w.maan6], kinds: [dictation, listen, typeEs, order] }
      - { es: "呢件衫三百五十蚊。", en: "This top is $350.", altEs: ["呢件衫三百五蚊。", "呢件衫三百五。"], grammar: [g.big-numbers, g.money], vocab: [w.saam1.b, w.baak3],
          transform: { instruction: "Use the spoken shortcut for 350", answer: "呢件衫三百五蚊。", alt: ["呢件衫三百五。"] } }
      - { es: "嗰對鞋一千二百蚊。", en: "That pair of shoes is $1,200.", altEs: ["嗰對鞋一千二蚊。", "嗰對鞋千二蚊。"], grammar: [g.big-numbers, g.money], vocab: [w.haai4, w.cin1] }
      - { es: "一百零五同一百五唔同。", en: "105 and 150 are different.", altEs: ["一百零五同一百五十唔同。"], grammar: [g.big-numbers], vocab: [w.baak3],
          error: { wrong: "一百五就係一百零五。", explain: "一百五 is 150 (the final 十 is dropped); 105 is 一百零五, with 零 for the gap.", grammar: g.big-numbers } }
      - { es: "呢部手機要五千八百蚊。", en: "This phone costs $5,800.", altEs: ["呢部手機五千八蚊。", "呢部手機五千八。"], grammar: [g.big-numbers, g.money], vocab: [w.cin1] }
      - { es: "香港有七百幾萬人。", en: "Hong Kong has over seven million people.", altEs: ["香港大概有七百幾萬人。"], grammar: [g.big-numbers], vocab: [w.maan6], note: "七百萬 is 7,000,000: 700 ten-thousands." }
      - { es: "中國有十四億人。", en: "China has 1.4 billion people.", altEs: ["中國大概有十四億人。"], grammar: [g.big-numbers], vocab: [w.jik1] }
      - { es: "兩萬蚊太貴喇！", en: "Twenty thousand dollars is too expensive!", altEs: ["兩萬蚊好貴呀！"], grammar: [g.big-numbers, g.money], vocab: [w.maan6],
          error: { wrong: "二十千蚊太貴喇！", explain: "Above 9,999 count in 萬: 20,000 is 兩萬, never 二十千.", grammar: g.big-numbers } }
      - { es: "我想試吓呢條裙。", en: "I'd like to try on this dress.", altEs: ["我想試呢條裙。", "呢條裙可唔可以試吓呀？"], grammar: [g.jiu-want, g.demonstratives], vocab: [w.si3, w.kwan4] }
      - { es: "呢條褲啱唔啱你呀？", en: "Do these trousers fit you?", altEs: ["呢條褲啱唔啱著呀？"], grammar: [g.a-not-a-questions], vocab: [w.fu3, w.ngaam1] }
      - { es: "呢頂帽好靚，幾多錢呀？", en: "This hat is lovely. How much is it?", altEs: ["呢頂帽好靚，幾錢呀？"], grammar: [g.common-classifiers, g.prices-gei-do-cin], vocab: [w.mou2, w.deng2], jp: "ni1 deng2 mou2 hou2 leng3 gei2 do1 cin2 aa3" }
      - { es: "銅鑼灣有好多商場。", en: "There are lots of shopping malls in Causeway Bay.", altEs: ["銅鑼灣好多商場。"], grammar: [g.jau-have], vocab: [w.soeng1-coeng4, w.hou2-do1] }
      - { es: "我啲錢唔夠。", en: "I don't have enough money.", altEs: ["我唔夠錢。"], grammar: [g.money], vocab: [w.gau3] }
      - { es: "我淨係得少少錢，全部都畀咗你喇。", jp: "ngo5 zing6 hai6 dak1 siu2 siu2 cin2 cyun4 bou6 dou1 bei2 zo2 nei5 laa3", en: "I've only got a little money, and I've given you all of it.", altEs: ["我得少少錢，全部都畀咗你。"], grammar: [g.di-some], vocab: [w.siu2-siu2, w.cyun4-bou6] }
      - { es: "人好多，衫好少。", en: "Lots of people, not many clothes.", altEs: ["好多人，好少衫。"], grammar: [g.adjective-predicates], vocab: [w.do1, w.siu2] }
    exchanges:
      - q: { es: "呢件衫幾多錢呀？", en: "How much is this top?" }
        a: { es: "三百五十蚊。", en: "$350." }
        alt: ["三百五。", "三百五蚊。"]
        grammar: [g.big-numbers, g.prices-gei-do-cin]
        vocab: [w.saam1.b, w.baak3]
      - q: { es: "你有冇一萬蚊呀？", en: "Do you have ten thousand dollars?" }
        a: { es: "冇呀，我得一千蚊。", en: "No, I've only got a thousand." }
        alt: ["冇呀。", "有，不過唔畀你。"]
        grammar: [g.big-numbers, g.jau-have]
        vocab: [w.maan6, w.cin1]
      - q: { es: "我可唔可以試吓呢條裙呀？", en: "Can I try on this dress?" }
        a: { es: "得，入面試啦。", en: "Sure, try it on inside." }
        alt: ["可以。", "得，冇問題。"]
        grammar: [g.jiu-want]
        vocab: [w.si3, w.kwan4]
      - q: { es: "你夠唔夠錢呀？", en: "Do you have enough money?" }
        a: { es: "唔夠，仲差一百蚊。", en: "Not enough. I'm still a hundred dollars short." }
        alt: ["夠呀。", "唔夠呀。"]
        grammar: [g.big-numbers]
        vocab: [w.gau3]
      - q: { es: "仲有冇大啲嘅呀？", en: "Do you have a bigger one?" }
        a: { es: "仲有，喺入面。", en: "Yes, there are more inside." }
        alt: ["冇喇，全部喺度。", "冇呀。"]
        grammar: [g.jau-have]
        vocab: [w.zung6-jau5, w.cyun4-bou6]
    texts:
      - title: "銅鑼灣買衫"
        es: ["我喺銅鑼灣個商場買衫。", "一件衫三百蚊，一條裙八百蚊。", "我錢唔夠，淨係買咗一件衫。"]
        en: ["I'm buying clothes in a Causeway Bay mall.", "A top is $300 and a dress is $800.", "I didn't have enough money, so I only bought one top."]
        grammar: [g.big-numbers, g.money]
        vocab: [w.soeng1-coeng4, w.saam1.b, w.kwan4, w.gau3]
      - title: "價錢"
        es: ["鞋：一千二百蚊。", "褲：四百五十蚊。", "衫：兩百蚊。"]
        en: ["Shoes: $1,200.", "Trousers: $450.", "Top: $200."]
        grammar: [g.big-numbers]
        vocab: [w.haai4, w.fu3, w.saam1.b]
    spicy:
      - { es: "呢條裙好襯你，一萬蚊都抵。", en: "This dress really suits you. It'd be worth ten thousand dollars.", altEs: ["呢件衫好襯你，一萬蚊都抵。"], altEn: ["This top really suits you. It'd be worth ten thousand dollars."], grammar: [g.big-numbers], vocab: [w.maan6] }
      - { es: "我有一百樣嘢想同你講，第一樣係：你好靚。", en: "I have a hundred things to tell you. The first is: you're gorgeous.", altEs: ["我有一百樣嘢想同你講，第一：你好靚。"], grammar: [g.big-numbers], vocab: [w.baak3] }
      - { es: "香港有七百萬人，我淨係見到你一個。", en: "Seven million people in Hong Kong, and you're the only one I see.", altEs: ["香港有七百幾萬人，我淨係見到你。"], grammar: [g.big-numbers], vocab: [w.maan6] }
      - { es: "你試吓呢頂帽，一定好靚仔。", en: "Try on this hat. You'll look so handsome.", altEs: ["你試吓呢頂帽，一定好靚女。"], altEn: ["Try on this hat. You'll look so pretty."], grammar: [g.demonstratives], vocab: [w.si3, w.mou2], jp: "nei5 si3 haa2 ni1 deng2 mou2 jat1 ding6 hou2 leng3 zai2" }
      - { es: "我啲錢唔夠買間屋，不過夠請你食飯。", en: "I don't have enough money to buy a flat, but enough to take you to dinner.", altEs: ["我唔夠錢買屋，不過夠請你食飯。"], grammar: [g.big-numbers], vocab: [w.gau3], jp: "ngo5 di1 cin2 m4 gau3 maai5 gaan1 uk1 bat1 gwo3 gau3 ceng2 nei5 sik6 faan6" }
  - id: a1.u06.l2
    title: 十蚊、五毫、八達通
    teach: [g.money]
    tip: "Say 蚊 for dollars (十蚊) and 毫 for ten cents (五毫). The digit after 蚊 is tens of cents: 十二蚊八 is $12.80. 個 also means 'dollar': 三個半 = $3.50."
    vocab: [w.cin2, w.man1, w.hou4, w.sin1, w.jyun4, w.gong2-bai6, w.baat3-daat6-tung1, w.zaau2-cin2, w.saan2-zi2, w.bei2-cin2, w.sau1, w.jat1-gung6, w.hou4-zi2, w.jau5-cin4, w.bin6-lei6-dim3, w.ciu1-si5]
    sentences:
      - { es: "一杯咖啡廿八蚊。", en: "A coffee is $28.", altEs: ["一杯咖啡二十八蚊。"], grammar: [g.money], vocab: [w.man1],
          error: { wrong: "一杯咖啡廿八元。", explain: "In speech, dollars are 蚊; 元 is what you see written on price tags.", grammar: g.money } }
      - { es: "車費五個半。", en: "The fare is $5.50.", altEs: ["車費五蚊五。", "車費五蚊五毫。"], grammar: [g.money], vocab: [w.hou4] }
      - { es: "一共八十五蚊。", en: "That's $85 altogether.", altEs: ["一共八十五蚊呀。", "總共八十五蚊。"], grammar: [g.money], vocab: [w.jat1-gung6],
          transform: { instruction: "Say it's $95 altogether", answer: "一共九十五蚊。" } }
      - { es: "我冇散紙，可唔可以用八達通呀？", en: "I don't have any change. Can I use Octopus?", altEs: ["我冇散紙，用八達通得唔得呀？"], grammar: [g.money, g.mou-negation], vocab: [w.saan2-zi2, w.baat3-daat6-tung1] }
      - { es: "我用八達通畀錢。", en: "I'll pay by Octopus.", altEs: ["我用八達通。", "我畀八達通。"], grammar: [g.money], vocab: [w.bei2-cin2] }
      - { es: "唔該找錢。", en: "My change, please.", altEs: ["唔該，找錢。"], grammar: [g.money], vocab: [w.zaau2-cin2] }
      - { es: "呢度收唔收八達通呀？", en: "Do you take Octopus here?", altEs: ["呢度收八達通嗎？"], grammar: [g.money, g.a-not-a-questions], vocab: [w.sau1] }
      - { es: "十二元八毫就係十二蚊八。", en: "十二元八毫 (written) is 十二蚊八 (spoken): $12.80.", altEs: ["十二元八毫即係十二蚊八。"], grammar: [g.money], vocab: [w.jyun4, w.gaa3-cin4] }
      - { es: "十二蚊八，唔係十二蚊零八仙。", en: "Twelve eighty, not twelve dollars and eight cents.", grammar: [g.money], vocab: [w.sin1],
          error: { wrong: "十二蚊八就係十二蚊零八仙。", explain: "The digit after 蚊 is tens of cents: 十二蚊八 is $12.80.", grammar: g.money } }
      - { es: "我有好多毫子。", en: "I have lots of small coins.", altEs: ["我有好多散紙。"], grammar: [g.money], vocab: [w.hou4-zi2] }
      - { es: "兩蚊半。", en: "Two dollars fifty.", altEs: ["兩個半。", "兩蚊五毫。"], grammar: [g.money, g.loeng-vs-ji], vocab: [w.man1],
          error: { wrong: "二蚊半。", explain: "$2 is 兩蚊: 蚊 works like a measure word, so 'two' is 兩.", grammar: g.loeng-vs-ji } }
      - { es: "便利店二十四小時都開。", en: "Convenience stores are open twenty-four hours.", altEs: ["便利店廿四小時開。"], grammar: [g.numbers-1-99], vocab: [w.bin6-lei6-dim3] }
      - { es: "超市啲嘢貴過街市。", en: "Things in the supermarket are more expensive than at the market.", altEs: ["超市嘅嘢貴過街市。"], grammar: [g.di-some], vocab: [w.ciu1-si5] }
      - { es: "佢好有錢。", en: "He's very rich.", altEs: ["佢好有錢呀。"], altEn: ["She's very rich."], grammar: [g.adjective-predicates], vocab: [w.jau5-cin4],
          transform: { instruction: "Say 'I don't have any money'", answer: "我冇錢。", alt: ["我冇錢呀。"] } }
      - { es: "呢度用港幣。", en: "Hong Kong dollars are used here.", altEs: ["呢度係用港幣㗎。"], grammar: [g.money], vocab: [w.gong2-bai6, w.cin2] }
    exchanges:
      - q: { es: "一共幾多錢呀？", en: "How much is it altogether?" }
        a: { es: "一共八十五蚊。", en: "$85 altogether." }
        alt: ["八十五蚊。", "八十五。"]
        grammar: [g.money, g.prices-gei-do-cin]
        vocab: [w.jat1-gung6, w.man1]
      - q: { es: "你有冇散紙呀？", en: "Do you have any change?" }
        a: { es: "冇呀，我用八達通得唔得？", en: "No. Can I use Octopus?" }
        alt: ["有，十蚊得唔得？", "冇呀。"]
        grammar: [g.money, g.mou-negation]
        vocab: [w.saan2-zi2, w.baat3-daat6-tung1]
      - q: { es: "收唔收八達通呀？", en: "Do you take Octopus?" }
        a: { es: "收呀，冇問題。", en: "Yes, no problem." }
        alt: ["收呀。", "唔收，對唔住。"]
        grammar: [g.money, g.a-not-a-questions]
        vocab: [w.sau1]
      - q: { es: "車費幾多錢呀？", en: "How much is the fare?" }
        a: { es: "五個半。", en: "$5.50." }
        alt: ["五蚊五。", "五蚊五毫。"]
        grammar: [g.money]
        vocab: [w.hou4]
      - q: { es: "附近有冇便利店呀？", en: "Is there a convenience store nearby?" }
        a: { es: "有，對面有一間。", en: "Yes, there's one opposite." }
        alt: ["有，轉左就係。", "冇呀，不過有間超市。"]
        grammar: [g.jau-have]
        vocab: [w.bin6-lei6-dim3, w.ciu1-si5]
    texts:
      - title: "便利店"
        es: ["一樽水，一包紙巾。", "一共十五蚊五毫。", "我用八達通畀錢。"]
        en: ["A bottle of water and a packet of tissues.", "$15.50 altogether.", "I pay with my Octopus card."]
        grammar: [g.money]
        vocab: [w.jat1-gung6, w.hou4, w.baat3-daat6-tung1]
      - title: "WhatsApp"
        es: ["我冇散紙呀！", "你有冇十蚊？", "聽日畀返你。"]
        en: ["I don't have any change!", "Do you have ten dollars?", "I'll pay you back tomorrow."]
        grammar: [g.money, g.mou-negation]
        vocab: [w.saan2-zi2, w.man1]
    spicy:
      - { es: "我冇散紙，不過我有好多時間。", en: "I've got no change, but I've got lots of time.", altEs: ["我冇散紙，但係我有好多時間。"], grammar: [g.money, g.mou-negation], vocab: [w.saan2-zi2], jp: "ngo5 mou5 saan2 zi2 bat1 gwo3 ngo5 jau5 hou2 do1 si4 gaan3" }
      - { es: "你唔使畀錢，你笑一笑就得。", en: "You don't need to pay. Just smile.", altEs: ["唔使畀錢，你笑吓就得。"], grammar: [g.money], vocab: [w.bei2-cin2] }
      - { es: "我唔係好有錢，不過我好鍾意你。", en: "I'm not very rich, but I really like you.", altEs: ["我唔係有錢人，不過我好鍾意你。"], grammar: [g.money], vocab: [w.jau5-cin4] }
      - { es: "找錢？唔使喇，你畀個電話號碼我就得。", en: "Change? No need. Just give me your phone number.", altEs: ["唔使找錢，你畀個電話號碼我就得。"], grammar: [g.money], vocab: [w.zaau2-cin2] }
      - { es: "我冇一百萬，不過有一百蚊請你飲咖啡。", en: "I don't have a million, but I've got a hundred dollars to buy you a coffee.", altEs: ["我冇一百萬，但係有一百蚊請你飲咖啡。"], grammar: [g.money, g.big-numbers], vocab: [w.man1], jp: "ngo5 mou5 jat1 baak3 maan6 bat1 gwo3 jau5 jat1 baak3 man1 ceng2 nei5 jam2 gaa3 fe1" }
  - id: a1.u06.l3
    title: 幾多錢呀？
    teach: [g.prices-gei-do-cin]
    tip: "Ask 幾多錢呀？ or, at the market, 點賣呀？ Prices per unit put the price first: 十蚊一個, 三十蚊一斤. A 斤 (catty) is about 600 g."
    vocab: [w.gei2-cin2, w.peng4, w.gwai3, w.peng4-di1, w.gaa3-cin4, w.gan1, w.gaai1-si5, w.si5-zaap6, w.pou3-tau2, w.lou5-baan2, w.maai6, w.saang1-gwo2, w.ping4-gwo2, w.caang2, w.hoeng1-ziu1, w.coi3, w.baak6-coi3, w.po1, w.san1-sin1, w.dak1, w.m4-dak1, w.dak1-laa3, w.dak1-m4-dak1]
    sentences:
      - { es: "呢個幾多錢呀？", en: "How much is this?", altEs: ["呢個幾錢呀？", "呢個幾多錢？"], grammar: [g.prices-gei-do-cin], vocab: [w.gei2-cin2],
          transform: { instruction: "Ask about 'that one'", answer: "嗰個幾多錢呀？", alt: ["嗰個幾錢呀？"] } }
      - { es: "啲橙點賣呀？", en: "How much are the oranges?", altEs: ["啲橙幾多錢呀？", "啲橙幾錢呀？"], grammar: [g.prices-gei-do-cin], vocab: [w.caang2] }
      - { es: "十蚊三個。", en: "Three for ten dollars.", altEs: ["十蚊有三個。"], grammar: [g.prices-gei-do-cin], vocab: [w.man1],
          error: { wrong: "三個十蚊。", explain: "At the market the price comes first, then the quantity: 十蚊三個.", grammar: g.prices-gei-do-cin } }
      - { es: "白菜十二蚊一斤。", en: "Bok choy is twelve dollars a catty.", altEs: ["啲白菜十二蚊一斤。"], grammar: [g.prices-gei-do-cin], vocab: [w.baak6-coi3, w.gan1] }
      - { es: "嘩，太貴喇！", en: "Wow, that's too expensive!", altEs: ["太貴喇！", "嘩，好貴呀！"], grammar: [g.prices-gei-do-cin], vocab: [w.gwai3] }
      - { es: "平啲得唔得呀？", en: "Can you make it a bit cheaper?", altEs: ["可唔可以平啲呀？", "平啲啦，老闆！"], grammar: [g.prices-gei-do-cin, g.di-some], vocab: [w.peng4-di1, w.dak1-m4-dak1] }
      - { es: "老闆，呢啲蘋果新唔新鮮呀？", en: "Boss, are these apples fresh?", altEs: ["老闆，呢啲蘋果新鮮嗎？"], grammar: [g.a-not-a-questions], vocab: [w.lou5-baan2, w.ping4-gwo2, w.san1-sin1] }
      - { es: "街市啲菜好新鮮，又好平。", en: "The vegetables at the market are very fresh and very cheap.", altEs: ["街市啲菜又新鮮又平。"], grammar: [g.di-some], vocab: [w.gaai1-si5, w.coi3, w.peng4], jp: "gaai1 si5 di1 coi3 hou2 san1 sin1 jau6 hou2 peng4",
          transform: { instruction: "Say the supermarket's are very expensive", answer: "超市啲菜好貴。" } }
      - { es: "灣仔有好多舖頭賣生果。", en: "Lots of shops in Wan Chai sell fruit.", altEs: ["灣仔好多舖頭賣生果。"], grammar: [g.jau-have], vocab: [w.pou3-tau2, w.maai6, w.saang1-gwo2] }
      - { es: "香蕉幾多錢一斤呀？", en: "How much are bananas per catty?", altEs: ["香蕉點賣呀？", "香蕉幾錢一斤呀？"], grammar: [g.prices-gei-do-cin], vocab: [w.hoeng1-ziu1, w.gan1] }
      - { es: "我要一棵白菜。", en: "I'd like one bok choy.", altEs: ["一棵白菜，唔該。"], grammar: [g.common-classifiers, g.jiu-want], vocab: [w.po1, w.baak6-coi3] }
      - { es: "呢個價錢好合理。", en: "This price is very reasonable.", altEs: ["呢個價錢唔貴。"], grammar: [g.demonstratives], vocab: [w.gaa3-cin4] }
      - { es: "二十蚊三個，得唔得呀？", en: "Three for twenty dollars, is that OK?", altEs: ["廿蚊三個得唔得？"], grammar: [g.prices-gei-do-cin], vocab: [w.dak1-m4-dak1] }
      - { es: "得，冇問題。", en: "OK, no problem.", altEs: ["得呀，冇問題。"], grammar: [g.prices-gei-do-cin], vocab: [w.dak1] }
      - { es: "唔得呀，已經好平喇。", en: "No way, it's already very cheap.", altEs: ["唔得，已經好平㗎喇。"], grammar: [g.prices-gei-do-cin], vocab: [w.m4-dak1, w.peng4], jp: "m4 dak1 aa3 ji5 ging1 hou2 peng4 laa3" }
      - { es: "得喇，我要呢啲。", en: "That'll do. I'll take these.", altEs: ["得喇，要呢啲。"], grammar: [g.jiu-want], vocab: [w.dak1-laa3] }
      - { es: "赤柱個市集好多遊客。", en: "Stanley Market is full of tourists.", altEs: ["赤柱市集有好多遊客。"], grammar: [g.classifier-as-the], vocab: [w.si5-zaap6] }
    exchanges:
