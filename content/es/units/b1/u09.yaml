id: b1.u09
title: Estilo indirecto
lessons:
  - id: b1.u09.l1
    title: Dice que no puede venir — contar lo que dicen otros
    teach: [g.reported-speech-present]
    vocab: [w.recado, w.dejar-un-recado, w.buzon, w.devolver-la-llamada, w.informar, w.comentar, w.afirmar, w.asegurar, w.responder, w.confirmar, w.aplazar, w.quedar-en, w.despedirse, w.charlar, w.conversacion, w.cotilleo, w.parte, w.de-parte-de]
    tip: "With a present reporting verb (dice, pregunta, comenta) the tense stays the same; only the person changes: «Estoy cansado» → Dice que está cansado. Questions: pregunta si… / pregunta dónde… Orders: dice que + subjunctive."
    sentences:
      - { es: "Tu madre dice que la llames cuando llegues a casa.", en: "Your mother says to call her when you get home.", altEs: ["Tu madre dice que la llames al llegar a casa.", "Dice tu madre que la llames cuando llegues a casa."], grammar: [g.reported-speech-present, g.indirect-commands, g.subjunctive-time-clauses], vocab: [w.madre, w.llamar, w.llegar] }
      - { es: "Ha llamado Carlos y ha dejado un recado: dice que no puede venir a cenar.", en: "Carlos called and left a message: he says he can't come to dinner.", altEs: ["Ha llamado Carlos y ha dejado un mensaje: dice que no puede venir a cenar."], grammar: [g.reported-speech-present, g.present-perfect], vocab: [w.dejar-un-recado, w.recado, w.cenar] }
      - { es: "Marta pregunta si vamos a la fiesta del sábado y si llevamos algo.", en: "Marta asks whether we're going to the party on Saturday and whether we're bringing anything.", grammar: [g.reported-speech-present], vocab: [w.preguntar, w.fiesta, w.llevar] }
      - { es: "El jefe comenta que la reunión se aplaza hasta el jueves.", en: "The boss mentions that the meeting is being postponed until Thursday.", altEs: ["El jefe dice que la reunión se aplaza hasta el jueves.", "El jefe comenta que la reunión se aplaza al jueves."], grammar: [g.reported-speech-present, g.se-passive], vocab: [w.comentar, w.reunion, w.aplazar] }
      - { es: "La inmobiliaria confirma que el piso sigue disponible y pregunta cuándo queremos verlo.", en: "The estate agency confirms that the flat is still available and asks when we want to see it.", grammar: [g.reported-speech-present, g.reported-questions], vocab: [w.confirmar, w.inmobiliaria, w.preguntar], note: "Question words keep their accent in reported questions: pregunta cuándo…" }
      - { es: "El médico asegura que no es nada grave, pero dice que descanse unos días.", en: "The doctor assures me it's nothing serious, but says I should rest for a few days.", grammar: [g.reported-speech-present, g.indirect-commands], vocab: [w.asegurar, w.grave, w.descansar] }
      - { es: "Mi hermana afirma que ella nunca ha dicho eso.", en: "My sister claims she has never said that.", altEs: ["Mi hermana asegura que ella nunca ha dicho eso.", "Mi hermana afirma que nunca ha dicho eso."], grammar: [g.reported-speech-present, g.present-perfect], vocab: [w.afirmar, w.hermano, w.decir] }
      - { es: "Te llama alguien del banco; dice que le devuelvas la llamada esta tarde.", en: "Someone from the bank is calling you; he says to call him back this afternoon.", grammar: [g.reported-speech-present, g.indirect-commands], vocab: [w.devolver-la-llamada, w.banco, w.llamar] }
      - { es: "Hay un mensaje en el buzón de voz: informan de que el envío llega mañana.", en: "There's a message on the voicemail: they inform us that the delivery arrives tomorrow.", grammar: [g.reported-speech-present], vocab: [w.buzon, w.informar, w.envio, w.mensaje], note: "informar de que (with de)." }
      - { es: "Mis padres dicen que vienen a vernos el domingo y que traen la comida.", en: "My parents say they're coming to see us on Sunday and bringing the food.", altEs: ["Mis padres dicen que el domingo vienen a vernos y que traen la comida."], grammar: [g.reported-speech-present], vocab: [w.padres, w.venir, w.traer, w.comida] }
      - { es: "Siempre que charlamos, mi vecina me cuenta algún cotilleo del barrio.", en: "Whenever we chat, my neighbour tells me some gossip from the neighbourhood.", grammar: [g.present-review], vocab: [w.charlar, w.cotilleo, w.vecino, w.barrio] }
      - { es: "Dale recuerdos a tu madre de mi parte y dile que la echo de menos.", en: "Give my regards to your mother and tell her I miss her.", grammar: [g.reported-speech-present, g.imperative-pronouns], vocab: [w.parte, w.de-parte-de, w.recuerdo, w.madre] }
      - { es: "Hemos quedado en vernos a las ocho; Ana dice que ella llega un poco más tarde.", en: "We've agreed to meet at eight; Ana says she's arriving a bit later.", grammar: [g.reported-speech-present, g.present-perfect], vocab: [w.quedar-en, w.ver, w.llegar] }
      - { es: "Al final de la conversación, se despide y responde que lo pensará.", en: "At the end of the conversation, he says goodbye and replies that he'll think about it.", grammar: [g.reported-speech-present, g.future-simple], vocab: [w.conversacion, w.despedirse, w.responder, w.pensar] }
      - { es: "Pedro dice que su coche está en el garaje.", en: "Pedro says his car is in the garage.", altEs: ["Dice Pedro que su coche está en el garaje."], grammar: [g.reported-speech-present], vocab: [w.coche, w.garaje], error: { wrong: "Pedro dice que mi coche está en el garaje.", explain: "Change the possessive when you report: Pedro's «mi coche» becomes su coche.", grammar: g.reported-speech-present } }
      - { es: "«No tengo tiempo hoy», dice Laura.", en: "Laura says she has no time today.", altEs: ["Laura dice que hoy no tiene tiempo.", "Laura dice que no tiene tiempo hoy."], grammar: [g.reported-speech-present], vocab: [w.tener, w.tiempo, w.hoy], transform: { instruction: "Report what Laura says", answer: "Laura dice que no tiene tiempo hoy.", alt: ["Laura dice que hoy no tiene tiempo."] } }
    exchanges:
      - q: { es: "¿Ha llamado alguien?", en: "Has anyone called?" }
        a: { es: "Sí, Carlos; dice que no puede venir a cenar.", en: "Yes, Carlos; he says he can't come to dinner." }
        alt: ["Tu madre; dice que la llames cuando llegues.", "Alguien del banco; dice que le devuelvas la llamada."]
        grammar: [g.reported-speech-present]
        vocab: [w.devolver-la-llamada]
      - q: { es: "¿Qué dice la inmobiliaria?", en: "What does the estate agency say?" }
        a: { es: "Confirma que el piso sigue disponible y pregunta cuándo queremos verlo.", en: "It confirms the flat is still available and asks when we want to see it." }
        alt: ["Dice que el piso ya está alquilado.", "Pregunta si podemos ir mañana."]
        grammar: [g.reported-speech-present]
        vocab: [w.confirmar]
      - q: { es: "¿Qué te ha dicho el médico?", en: "What did the doctor tell you?" }
        a: { es: "Asegura que no es nada grave, pero dice que descanse unos días.", en: "He assures me it's nothing serious, but says I should rest for a few days." }
        alt: ["Dice que vuelva en una semana.", "Comenta que tengo que beber más agua."]
        grammar: [g.reported-speech-present]
        vocab: [w.asegurar, w.comentar]
      - q: { es: "¿A qué hora hemos quedado?", en: "What time have we arranged to meet?" }
        a: { es: "A las ocho; Ana dice que ella llega un poco más tarde.", en: "At eight; Ana says she's arriving a bit later." }
        alt: ["Hemos quedado en vernos a las ocho.", "Marta pregunta si podemos quedar a las nueve."]
        grammar: [g.reported-speech-present]
        vocab: [w.quedar-en]
      - q: { es: "¿Quiere dejar un recado?", en: "Do you want to leave a message?" }
        a: { es: "Sí; dígale que llame a su hermana, de parte de Lucía.", en: "Yes; tell him to call his sister, from Lucía." }
        alt: ["No, gracias; vuelvo a llamar más tarde.", "Sí, por favor: que me devuelva la llamada esta tarde."]
        grammar: [g.reported-speech-present, g.imperative-usted]
        vocab: [w.recado, w.dejar-un-recado, w.de-parte-de]
    texts:
      - title: "Recado en la nevera"
        es: ["Ha llamado tu madre.", "Dice que la llames cuando llegues y que el domingo vienen a comer.", "También pregunta si quieres que traigan el postre."]
        en: ["Your mother called.", "She says to call her when you get home and that they're coming for lunch on Sunday.", "She also asks if you want them to bring the dessert."]
        grammar: [g.reported-speech-present]
        vocab: [w.recado]
      - title: "Mensaje de voz"
        es: ["Hola, soy Marta, del trabajo.", "El jefe comenta que la reunión se aplaza hasta el jueves.", "Dice que confirmes si puedes venir y que le devuelvas la llamada."]
        en: ["Hi, it's Marta, from work.", "The boss mentions that the meeting is being postponed until Thursday.", "He says to confirm whether you can come and to call him back."]
        grammar: [g.reported-speech-present]
        vocab: [w.comentar, w.aplazar, w.confirmar, w.devolver-la-llamada]
  - id: b1.u09.l2
    title: Dijo que vendría — los cambios de tiempo
    teach: [g.reported-speech-past]
    vocab: [w.declarar, w.declaracion, w.portavoz, w.entrevistar, w.jurar, w.amenazar, w.ocultar, w.sincero, w.supuestamente, w.broma, w.malentendido, w.tono, w.dejar-claro, w.reconocer]
    tip: "After dijo / contó / explicó the tenses move back: present → imperfect, preterite or perfect → pluperfect, future → conditional. The imperfect itself does not change."
    sentences:
      - { es: "Me dijo que estaba cansado y que quería irse a casa.", en: "He told me he was tired and wanted to go home.", altEs: ["Me dijo que estaba cansado y quería irse a casa.", "Me dijo que estaba cansada y que quería irse a casa."], grammar: [g.reported-speech-past], vocab: [w.decir, w.cansado, w.querer], note: "Direct: «Estoy cansado y quiero irme a casa»." }
      - { es: "El portavoz declaró que el gobierno ya había aprobado la medida.", en: "The spokesperson declared that the government had already passed the measure.", grammar: [g.reported-speech-past, g.pluperfect], vocab: [w.portavoz, w.declarar] }
      - { es: "La ministra aseguró que los precios bajarían en primavera.", en: "The minister assured us that prices would fall in spring.", altEs: ["La ministra afirmó que los precios bajarían en primavera.", "La ministra aseguró que los precios iban a bajar en primavera."], grammar: [g.reported-speech-past, g.conditional-simple], vocab: [w.asegurar, w.precio, w.bajar, w.primavera] }
      - { es: "Juró que no había mentido y que me lo había contado todo.", en: "She swore she hadn't lied and had told me everything.", grammar: [g.reported-speech-past, g.pluperfect], vocab: [w.jurar, w.contar] }
      - { es: "Mi jefe me comentó que iba a contratar a dos personas más.", en: "My boss mentioned to me that he was going to hire two more people.", altEs: ["Mi jefe me dijo que iba a contratar a dos personas más.", "Mi jefe me comentó que contrataría a dos personas más."], grammar: [g.reported-speech-past], vocab: [w.comentar, w.jefe, w.persona], note: "«Voy a contratar» → iba a contratar." }
      - { es: "El periodista entrevistó al alcalde, que afirmó que la obra terminaría en marzo.", en: "The journalist interviewed the mayor, who stated that the works would finish in March.", grammar: [g.reported-speech-past, g.conditional-simple], vocab: [w.entrevistar, w.afirmar, w.periodista, w.obra] }
      - { es: "Nos dijo en broma que se iba a vivir a una isla; nadie le creyó.", en: "He told us jokingly that he was going to live on an island; nobody believed him.", grammar: [g.reported-speech-past], vocab: [w.broma, w.isla, w.creer] }
      - { es: "Dijo que estaba lloviendo y que no podía salir.", en: "She said it was raining and she couldn't go out.", altEs: ["Dijo que llovía y que no podía salir."], grammar: [g.reported-speech-past, g.estar-gerund-past], vocab: [w.llover, w.salir, w.poder], note: "«Está lloviendo» → estaba lloviendo; the imperfect stays the same." }
      - { es: "Fue un malentendido: yo dije que llegaría a las seis, no que había llegado a las seis.", en: "It was a misunderstanding: I said I would arrive at six, not that I had arrived at six.", grammar: [g.reported-speech-past, g.conditional-simple, g.pluperfect], vocab: [w.malentendido, w.llegar] }
      - { es: "Confesó que había ocultado la verdad porque tenía miedo.", en: "He confessed that he had hidden the truth because he was afraid.", altEs: ["Confesó que había escondido la verdad porque tenía miedo.", "Reconoció que había ocultado la verdad porque tenía miedo."], grammar: [g.reported-speech-past, g.pluperfect], vocab: [w.ocultar, w.verdad, w.miedo] }
      - { es: "Fue muy sincero: reconoció que se había equivocado y pidió disculpas.", en: "He was very honest: he admitted he had made a mistake and apologised.", grammar: [g.reported-speech-past, g.pluperfect], vocab: [w.sincero, w.reconocer, w.equivocarse] }
      - { es: "En su declaración, el testigo dijo que había visto a dos hombres y que uno llevaba una mochila.", en: "In his statement, the witness said he had seen two men and that one was carrying a backpack.", grammar: [g.reported-speech-past, g.pluperfect], vocab: [w.declaracion, w.ver, w.mochila] }
      - { es: "Supuestamente, el actor dijo que dejaba el cine, pero su portavoz lo negó.", en: "Supposedly the actor said he was leaving the cinema, but his spokesperson denied it.", grammar: [g.reported-speech-past], vocab: [w.supuestamente, w.actor, w.portavoz, w.dejar] }
      - { es: "Nos dejó claro, con un tono muy serio, que no volvería a repetirlo.", en: "He made it very clear to us, in a very serious tone, that he would not repeat it again.", grammar: [g.reported-speech-past, g.volver-a, g.conditional-simple], vocab: [w.dejar-claro, w.tono, w.serio, w.repetir] }
      - { es: "Me dijo que tenía mucho trabajo.", en: "She told me she had a lot of work.", altEs: ["Me contó que tenía mucho trabajo."], grammar: [g.reported-speech-past], vocab: [w.trabajo, w.tener], error: { wrong: "Me dijo que tiene mucho trabajo.", explain: "After a past reporting verb, present → imperfect: tiene → tenía.", grammar: g.reported-speech-past } }
      - { es: "«He perdido el tren», me contó Ana.", en: "Ana told me she had missed the train.", altEs: ["Ana me contó que había perdido el tren.", "Ana me dijo que había perdido el tren."], grammar: [g.reported-speech-past, g.pluperfect], vocab: [w.perder, w.tren, w.contar], transform: { instruction: "Report what Ana said", answer: "Ana me contó que había perdido el tren." } }
    exchanges:
      - q: { es: "¿Qué te dijo Luis ayer?", en: "What did Luis tell you yesterday?" }
        a: { es: "Me dijo que estaba cansado y que quería irse a casa.", en: "He told me he was tired and wanted to go home." }
        alt: ["Dijo que llegaría a las seis.", "Me contó que iba a cambiar de trabajo."]
        grammar: [g.reported-speech-past]
      - q: { es: "¿Qué declaró el portavoz?", en: "What did the spokesperson declare?" }
        a: { es: "Declaró que el gobierno ya había aprobado la medida.", en: "He declared that the government had already passed the measure." }
        alt: ["Aseguró que los precios bajarían en primavera.", "Dijo que no había ninguna crisis."]
        grammar: [g.reported-speech-past]
        vocab: [w.declarar, w.portavoz]
      - q: { es: "¿Reconoció su error?", en: "Did he admit his mistake?" }
        a: { es: "Sí, fue muy sincero: reconoció que se había equivocado.", en: "Yes, he was very honest: he admitted he had made a mistake." }
        alt: ["No; dijo que había sido un malentendido.", "Sí, y pidió disculpas con un tono muy serio."]
        grammar: [g.reported-speech-past]
        vocab: [w.reconocer, w.sincero, w.malentendido, w.tono]
      - q: { es: "¿Era verdad lo de la isla?", en: "Was the thing about the island true?" }
        a: { es: "No, nos lo dijo en broma; nadie le creyó.", en: "No, he told us jokingly; nobody believed him." }
        alt: ["Supuestamente sí, pero su portavoz lo negó.", "Juró que era verdad, pero yo no me lo creí."]
        grammar: [g.reported-speech-past]
        vocab: [w.broma, w.supuestamente, w.jurar]
      - q: { es: "¿Qué confesó al final?", en: "What did he confess in the end?" }
        a: { es: "Confesó que había ocultado la verdad porque tenía miedo.", en: "He confessed that he had hidden the truth because he was afraid." }
        alt: ["Reconoció que había mentido.", "Que se había equivocado y que lo sentía."]
        grammar: [g.reported-speech-past]
        vocab: [w.ocultar, w.reconocer]
    texts:
      - title: "Noticia breve"
        es: ["La ministra aseguró ayer que los precios bajarían en primavera.", "El portavoz declaró que el gobierno ya había tomado medidas.", "Supuestamente, la ley se aprobará en marzo."]
        en: ["The minister assured yesterday that prices would fall in spring.", "The spokesperson declared that the government had already taken measures.", "Supposedly, the law will be passed in March."]
        grammar: [g.reported-speech-past]
        vocab: [w.portavoz, w.declarar, w.supuestamente]
      - title: "Mensaje a una amiga"
        es: ["Hablé con Pablo anoche.", "Me dijo que estaba muy ocupado y que no podía venir el sábado.", "Pero me dejó claro que quería verte pronto."]
        en: ["I talked to Pablo last night.", "He told me he was very busy and couldn't come on Saturday.", "But he made it clear that he wanted to see you soon."]
        grammar: [g.reported-speech-past]
        vocab: [w.dejar-claro]
  - id: b1.u09.l3
    title: Dijo que vendría al día siguiente — cambios de tiempo, lugar y persona
    teach: [g.reported-speech-past]
    vocab: [w.anterior, w.siguiente, w.al-dia-siguiente, w.el-dia-anterior, w.en-aquel-momento, w.posterior, w.actual, w.actualmente, w.ocasion, w.invitacion, w.invitado, w.reunirse, w.tardar, w.relacion, w.contacto, w.ponerse-en-contacto]
    tip: "When you report later and elsewhere, shift the markers too: hoy → ese día, ayer → el día anterior, mañana → al día siguiente, ahora → entonces, aquí → allí, mi → su."
    sentences:
      - { es: "Me dijo que me llamaría al día siguiente.", en: "He told me he would call me the next day.", altEs: ["Me dijo que me llamaría el día siguiente.", "Me dijo que me iba a llamar al día siguiente."], grammar: [g.reported-speech-past, g.conditional-simple], vocab: [w.al-dia-siguiente, w.llamar], note: "Direct: «Mañana te llamo»." }
      - { es: "Ana contó que había estado enferma el día anterior.", en: "Ana said she had been ill the day before.", altEs: ["Ana dijo que había estado enferma el día anterior.", "Ana contó que el día anterior había estado enferma."], grammar: [g.reported-speech-past, g.pluperfect], vocab: [w.el-dia-anterior, w.enfermo], note: "Direct: «Ayer estuve enferma»." }
      - { es: "Dijo que en aquel momento no sabía nada de la invitación.", en: "She said that at the time she knew nothing about the invitation.", grammar: [g.reported-speech-past], vocab: [w.en-aquel-momento, w.invitacion, w.saber], note: "«Ahora no sé nada» → en aquel momento / entonces no sabía nada." }
      - { es: "Me explicó que su familia vivía allí, en la casa de enfrente.", en: "He explained to me that his family lived there, in the house opposite.", altEs: ["Me explicó que su familia vivía ahí, en la casa de enfrente."], grammar: [g.reported-speech-past], vocab: [w.explicar, w.familia, w.alli, w.enfrente], note: "«Mi familia vive aquí» → su familia vivía allí." }
      - { es: "Los invitados dijeron que llegarían esa misma noche, pero tardaron dos días.", en: "The guests said they would arrive that same night, but they took two days.", grammar: [g.reported-speech-past, g.conditional-simple], vocab: [w.invitado, w.tardar, w.noche] }
      - { es: "Nos aseguró que se pondría en contacto con nosotros la semana siguiente.", en: "He assured us he would get in touch with us the following week.", altEs: ["Nos aseguró que se pondría en contacto con nosotros a la semana siguiente.", "Nos aseguró que contactaría con nosotros la semana siguiente."], grammar: [g.reported-speech-past, g.conditional-simple], vocab: [w.ponerse-en-contacto, w.siguiente, w.semana] }
      - { es: "Pedro me dijo que su jefe actual era mejor que el anterior.", en: "Pedro told me his current boss was better than the previous one.", altEs: ["Pedro me contó que su jefe actual era mejor que el anterior."], grammar: [g.reported-speech-past, g.comparatives], vocab: [w.actual, w.anterior, w.jefe] }
      - { es: "Dijo que actualmente trabajaba en Sevilla, pero que en aquella época vivía en Madrid.", en: "He said he was currently working in Seville, but that at that time he lived in Madrid.", grammar: [g.reported-speech-past], vocab: [w.actualmente, w.trabajar, w.en-aquella-epoca] }
      - { es: "Comentó que su relación con los vecinos había mejorado desde la mudanza.", en: "She mentioned that her relationship with the neighbours had improved since the move.", grammar: [g.reported-speech-past, g.pluperfect], vocab: [w.relacion, w.vecino, w.mejorar] }
      - { es: "Quedamos en reunirnos el lunes posterior a la fiesta, pero nadie se acordó.", en: "We agreed to meet on the Monday after the party, but nobody remembered.", grammar: [g.preterite-regular], vocab: [w.reunirse, w.posterior, w.quedar-en, w.acordarse] }
      - { es: "Me contó que en esa ocasión había conocido a su pareja actual.", en: "She told me that on that occasion she had met her current partner.", grammar: [g.reported-speech-past, g.pluperfect], vocab: [w.ocasion, w.conocer, w.pareja, w.actual] }
      - { es: "Ella dijo: «Te espero aquí». Yo entendí que me esperaría allí, en su casa.", en: "She said: 'I'll wait for you here.' I understood that she would wait for me there, at her house.", grammar: [g.reported-speech-past, g.conditional-simple], vocab: [w.esperar, w.entender, w.alli] }
      - { es: "Dijeron que lo habían visto el día anterior en el aeropuerto con dos maletas.", en: "They said they had seen him the day before at the airport with two suitcases.", grammar: [g.reported-speech-past, g.pluperfect], vocab: [w.el-dia-anterior, w.aeropuerto, w.maleta] }
      - { es: "Me preguntó si yo tenía su contacto y le dije que lo había perdido con el móvil viejo.", en: "He asked me if I had his contact details and I told him I had lost them with my old phone.", grammar: [g.reported-speech-past, g.reported-questions, g.pluperfect], vocab: [w.contacto, w.perder, w.movil] }
      - { es: "El lunes me dijo que me llamaría al día siguiente.", en: "On Monday he told me he would call me the next day.", altEs: ["El lunes me dijo que me llamaría el martes."], grammar: [g.reported-speech-past], vocab: [w.al-dia-siguiente, w.llamar, w.lunes], error: { wrong: "El lunes me dijo que me llamaría mañana.", explain: "When you report later, mañana becomes al día siguiente (and hoy → ese día, ayer → el día anterior).", grammar: g.reported-speech-past } }
      - { es: "«Ahora vivo aquí con mis padres», dijo Marcos.", en: "Marcos said that he was living there with his parents then.", altEs: ["Marcos dijo que entonces vivía allí con sus padres.", "Marcos dijo que en aquel momento vivía allí con sus padres."], grammar: [g.reported-speech-past], vocab: [w.entonces, w.vivir, w.padres], transform: { instruction: "Report what Marcos said, changing time, place and person", answer: "Marcos dijo que entonces vivía allí con sus padres.", alt: ["Marcos dijo que en aquel momento vivía allí con sus padres."] } }
    exchanges:
      - q: { es: "¿Te llamó al final?", en: "Did he call you in the end?" }
        a: { es: "No; me dijo que me llamaría al día siguiente, pero no lo hizo.", en: "No; he told me he'd call me the next day, but he didn't." }
        alt: ["Sí, al día siguiente, como había prometido.", "Me dijo que se pondría en contacto conmigo esa semana."]
        grammar: [g.reported-speech-past]
        vocab: [w.al-dia-siguiente, w.ponerse-en-contacto]
      - q: { es: "¿Por qué no vino Ana a la reunión?", en: "Why didn't Ana come to the meeting?" }
        a: { es: "Contó que había estado enferma el día anterior.", en: "She said she had been ill the day before." }
        alt: ["Dijo que en aquel momento no sabía nada de la invitación.", "Dijo que llegaría tarde, pero no apareció."]
        grammar: [g.reported-speech-past]
        vocab: [w.el-dia-anterior, w.en-aquel-momento, w.invitacion]
      - q: { es: "¿Qué te dijo Pedro de su trabajo?", en: "What did Pedro tell you about his job?" }
        a: { es: "Me dijo que su jefe actual era mejor que el anterior.", en: "He told me his current boss was better than the previous one." }
        alt: ["Que actualmente trabajaba en Sevilla.", "Que su relación con los compañeros había mejorado."]
        grammar: [g.reported-speech-past]
        vocab: [w.actual, w.anterior, w.actualmente, w.relacion]
      - q: { es: "¿Cuándo llegaron los invitados?", en: "When did the guests arrive?" }
        a: { es: "Dijeron que llegarían esa misma noche, pero tardaron dos días.", en: "They said they'd arrive that same night, but they took two days." }
        alt: ["Al día siguiente, por la mañana.", "Nos aseguraron que llegarían el lunes posterior a la fiesta."]
        grammar: [g.reported-speech-past]
        vocab: [w.invitado, w.tardar, w.posterior]
      - q: { es: "¿Dónde dijo Marcos que vivía?", en: "Where did Marcos say he lived?" }
        a: { es: "Dijo que en aquel momento vivía allí con sus padres.", en: "He said that at the time he was living there with his parents." }
        alt: ["Que vivía en la casa de enfrente.", "Dijo que actualmente vivía en Madrid."]
        grammar: [g.reported-speech-past]
        vocab: [w.en-aquel-momento]
    texts:
      - title: "Resumen de una conversación"
        es: ["Ayer hablé con Laura por teléfono.", "Me explicó que su familia vivía allí, en la casa de enfrente, y que actualmente trabajaba en Sevilla.", "Me aseguró que se pondría en contacto conmigo la semana siguiente."]
        en: ["Yesterday I talked to Laura on the phone.", "She explained to me that her family lived there, in the house opposite, and that she was currently working in Seville.", "She assured me she'd get in touch with me the following week."]
        grammar: [g.reported-speech-past]
        vocab: [w.actualmente, w.ponerse-en-contacto, w.siguiente]
      - title: "Mensaje a un amigo"
        es: ["Oye, el lunes Carlos me dijo que me llamaría al día siguiente.", "Hoy es jueves y todavía no ha llamado.", "¿Tienes su contacto actual?"]
        en: ["Hey, on Monday Carlos told me he'd call me the next day.", "Today is Thursday and he still hasn't called.", "Do you have his current contact details?"]
        grammar: [g.reported-speech-past]
        vocab: [w.al-dia-siguiente, w.contacto, w.actual]
  - id: b1.u09.l4
    title: Me preguntó dónde vivía — preguntas y verbos para contar
    teach: [g.reported-questions]
    vocab: [w.mencionar, w.interesarse, w.curiosidad, w.detalle, w.estado-civil, w.educado, w.maleducado, w.directo, w.programa, w.presentador, w.oyente, w.espectador, w.audiencia, w.usuario, w.seguidor, w.comentario, w.revista, w.publicidad, w.cifra]
    tip: "preguntar si for yes/no questions, preguntar + qué / dónde / cuándo for the rest, in statement word order: me preguntó dónde vivía. Vary the verb: contar, explicar, comentar, asegurar, prometer, responder."
    sentences:
      - { es: "La presentadora le preguntó al actor si tenía novia y él respondió que no quería hablar de eso.", en: "The presenter asked the actor whether he had a girlfriend and he replied that he didn't want to talk about that.", grammar: [g.reported-questions, g.reported-speech-past], vocab: [w.presentador, w.preguntar, w.actor, w.novio, w.responder] }
      - { es: "Me preguntaron cuántos años tenía, cuál era mi estado civil y dónde vivía.", en: "They asked me how old I was, what my marital status was and where I lived.", altEs: ["Me preguntaron qué edad tenía, cuál era mi estado civil y dónde vivía."], grammar: [g.reported-questions], vocab: [w.estado-civil, w.ano, w.vivir] }
      - { es: "Un oyente llamó al programa y preguntó por qué no hablaban de la huelga de autobuses.", en: "A listener called the programme and asked why they weren't talking about the bus strike.", grammar: [g.reported-questions], vocab: [w.oyente, w.programa, w.hablar, w.autobus] }
      - { es: "Los espectadores quisieron saber si el programa se emitía en directo.", en: "The viewers wanted to know whether the programme was broadcast live.", altEs: ["Los espectadores querían saber si el programa se emitía en directo.", "Los espectadores preguntaron si el programa se emitía en directo."], grammar: [g.reported-questions, g.se-passive], vocab: [w.espectador, w.programa, w.directo, w.emitir] }
      - { es: "Le pregunté a mi vecino qué hora era y me contestó, muy educado, que las nueve y media.", en: "I asked my neighbour what time it was and he answered, very politely, that it was half past nine.", grammar: [g.reported-questions], vocab: [w.educado, w.vecino, w.hora, w.contestar] }
      - { es: "La revista nos pide que no mencionemos su nombre en el artículo.", en: "The magazine asks us not to mention her name in the article.", grammar: [g.reported-questions, g.indirect-commands], vocab: [w.revista, w.mencionar, w.nombre] }
      - { es: "Mi abuela se interesó por mi trabajo y me preguntó cuánto cobraba.", en: "My grandmother took an interest in my job and asked me how much I earned.", altEs: ["Mi abuela se interesó por mi trabajo y me preguntó cuánto ganaba."], grammar: [g.reported-questions], vocab: [w.interesarse, w.abuela, w.cobrar, w.trabajo] }
      - { es: "Un seguidor le preguntó al cantante cuándo sacaría la nueva canción y él prometió que sería en otoño.", en: "A follower asked the singer when he would release the new song and he promised it would be in autumn.", grammar: [g.reported-questions, g.conditional-simple], vocab: [w.seguidor, w.cantante, w.cancion, w.prometer, w.otono] }
      - { es: "El presentador comentó que las cifras de audiencia habían subido gracias a la publicidad en redes sociales.", en: "The presenter remarked that the audience figures had gone up thanks to advertising on social media.", grammar: [g.reported-questions, g.pluperfect], vocab: [w.presentador, w.cifra, w.audiencia, w.publicidad, w.red-social] }
      - { es: "Fue muy maleducado: me preguntó cuánto ganaba y luego no me dejó responder.", en: "He was very rude: he asked me how much I earned and then didn't let me answer.", altEs: ["Fue muy maleducado: me preguntó cuánto cobraba y luego no me dejó contestar."], grammar: [g.reported-questions], vocab: [w.maleducado, w.ganar, w.responder] }
      - { es: "La periodista nos aconseja que no creamos todo lo que leemos en internet.", en: "The journalist advises us not to believe everything we read on the internet.", grammar: [g.reported-questions, g.subjunctive-advice], vocab: [w.periodista, w.creer, w.lo-que, w.internet] }
      - { es: "Le pregunté si había visto la noticia y me contestó que sí, que la había visto en el telediario.", en: "I asked him if he had seen the news and he said yes, he had seen it on the TV news.", altEs: ["Le pregunté si había visto la noticia y me respondió que sí, que la había visto en el telediario."], grammar: [g.reported-questions, g.pluperfect], vocab: [w.noticia, w.telediario, w.contestar] }
      - { es: "Tengo curiosidad por un detalle: ¿quién te contó lo de la boda?", en: "I'm curious about one detail: who told you about the wedding?", grammar: [g.question-words], vocab: [w.curiosidad, w.detalle, w.contar, w.boda] }
      - { es: "Un usuario escribió un comentario preguntando si el programa volvería el año que viene.", en: "A user wrote a comment asking whether the programme would be back next year.", grammar: [g.reported-questions, g.conditional-simple], vocab: [w.usuario, w.comentario, w.programa, w.volver] }
      - { es: "Me preguntó qué hora era.", en: "She asked me what time it was.", altEs: ["Me preguntó la hora."], grammar: [g.reported-questions], vocab: [w.hora, w.preguntar], error: { wrong: "Me preguntó qué hora es.", explain: "Past reporting verb → the present shifts to the imperfect: es → era. Keep the accent on qué.", grammar: g.reported-questions } }
      - { es: "«¿Dónde trabajas?», me preguntó Elena.", en: "Elena asked me where I worked.", altEs: ["Elena me preguntó dónde trabajaba."], grammar: [g.reported-questions], vocab: [w.trabajar, w.preguntar], transform: { instruction: "Report the question", answer: "Elena me preguntó dónde trabajaba." } }
    exchanges:
      - q: { es: "¿Qué te preguntaron en la entrevista?", en: "What did they ask you in the interview?" }
        a: { es: "Me preguntaron cuántos años tenía y dónde vivía.", en: "They asked me how old I was and where I lived." }
        alt: ["Me preguntaron si tenía experiencia.", "Quisieron saber cuál era mi estado civil, y me pareció maleducado."]
        grammar: [g.reported-questions]
        vocab: [w.estado-civil, w.maleducado]
      - q: { es: "¿Qué quería saber el oyente?", en: "What did the listener want to know?" }
        a: { es: "Preguntó por qué no hablaban de la huelga de autobuses.", en: "He asked why they weren't talking about the bus strike." }
        alt: ["Quería saber si el programa se emitía en directo.", "Preguntó cuándo volvería el programa."]
        grammar: [g.reported-questions]
        vocab: [w.oyente, w.programa]
      - q: { es: "¿Qué le preguntó la presentadora al actor?", en: "What did the presenter ask the actor?" }
        a: { es: "Le preguntó si tenía novia, y él respondió que no quería hablar de eso.", en: "She asked him whether he had a girlfriend, and he replied that he didn't want to talk about that." }
        alt: ["Le preguntó cuándo sacaría la nueva película.", "Quiso saber dónde vivía actualmente."]
        grammar: [g.reported-questions]
        vocab: [w.presentador]
      - q: { es: "¿Qué te dijo tu abuela?", en: "What did your grandmother say to you?" }
