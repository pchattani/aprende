id: b1.u12
title: Ficar, continuar, acabar
lessons:
  - id: b1.u12.l1
    title: Ele é calado, mas hoje está falante
    teach: [g.ser-estar-ficar-advanced]
    vocab: [w.calado, w.situação, w.condição, w.delicado, w.capaz, w.atual, w.mudar-de-ideia, w.máscara, w.fantasia, w.peso, w.altura, w.largura, w.comprimento, w.profundidade, w.distância, w.medir, w.medida, w.nível, w.limite, w.transparente, w.flutuação, w.flutuar, w.gruta]
    tip: "ser = what something is like (ele é calado: a quiet person); estar = how it is now (ele está calado: silent right now). ficar com = keep, ficar sem = run out of, ficar sabendo = find out."
    sentences:
      - { es: "A água de Bonito é tão transparente que dá para ver o fundo a seis metros de profundidade.", en: "The water in Bonito is so clear you can see the bottom six metres down.", altEs: ["A água de Bonito é tão transparente que a gente vê o fundo a seis metros de profundidade."], grammar: [g.ser-estar-ficar-advanced], vocab: [w.transparente, w.profundidade] }
      - { es: "O guia é calado, mas hoje está falando sem parar.", en: "The guide is a quiet person, but today he can't stop talking.", altEs: ["A guia é calada, mas hoje está falando sem parar."], grammar: [g.ser-estar-ficar-advanced, g.estar-gerund], vocab: [w.calado] }
      - { es: "Fique calado durante a flutuação para não assustar os peixes.", en: "Keep quiet during the float so as not to scare the fish.", altEs: ["Fica calado durante a flutuação para não assustar os peixes.", "Fique calada durante a flutuação para não assustar os peixes."], grammar: [g.ser-estar-ficar-advanced, g.imperative-formal], vocab: [w.calado, w.flutuação] }
      - { es: "Essa banana ainda está verde; espere mais uns dias.", en: "This banana is still unripe; wait a few more days.", altEs: ["Essa banana ainda está verde, espera mais uns dias."], grammar: [g.ser-estar-ficar-advanced], note: "ser verde = to be green; estar verde = to be unripe." }
      - { es: "Ele é muito vivo: aprendeu a flutuar em cinco minutos.", en: "He's very sharp: he learned to float in five minutes.", altEs: ["Ela é muito viva: aprendeu a flutuar em cinco minutos."], grammar: [g.ser-estar-ficar-advanced], vocab: [w.flutuar], note: "ser vivo = lively, quick; estar vivo = to be alive." }
      - { es: "Fiquei sem bateria bem na hora da foto.", en: "My battery died right when I wanted to take the photo.", altEs: ["Meu celular ficou sem bateria bem na hora da foto."], grammar: [g.ser-estar-ficar-advanced], transform: { instruction: "Say it with acabar instead of ficar sem", answer: "Acabou a bateria bem na hora da foto.", alt: ["A bateria acabou bem na hora da foto."], en: "The battery ran out right when I wanted to take the photo." } }
      - { es: "Soube ontem que a gruta vai fechar para reforma.", en: "I found out yesterday that the cave is going to close for renovation.", grammar: [g.ser-estar-ficar-advanced], vocab: [w.gruta], transform: { instruction: "Say it with ficar sabendo", answer: "Fiquei sabendo ontem que a gruta vai fechar para reforma.", alt: ["Ontem fiquei sabendo que a gruta vai fechar para reforma."] } }
      - { es: "A máscara ficou ótima em você; a fantasia de peixe, nem tanto.", en: "The mask suits you perfectly; the fish costume, not so much.", altEs: ["A máscara ficou ótima em você, mas a fantasia de peixe nem tanto."], grammar: [g.ser-estar-ficar-advanced], vocab: [w.máscara, w.fantasia], note: "ficar bem / ótimo em alguém = to suit someone." }
      - { es: "O passeio é às oito, na frente da agência.", en: "The trip is at eight, in front of the agency.", altEs: ["O passeio é às oito, em frente à agência."], grammar: [g.ser-estar-ficar-advanced], error: { wrong: "O passeio está às oito, na frente da agência.", explain: "Events take ser for time and place: o passeio é às oito.", grammar: g.ser-estar-ficar-advanced } }
      - { es: "Tenho certeza de que a gruta está aberta hoje.", en: "I'm sure the cave is open today.", grammar: [g.ser-estar-ficar-advanced], vocab: [w.gruta], error: { wrong: "Estou seguro de que a gruta está aberta hoje.", explain: "In Brazil 'to be sure' is ter certeza; estar seguro usually means 'to feel safe'.", grammar: g.ser-estar-ficar-advanced } }
      - { es: "O guia mediu o nível do rio e, por medida de segurança, cancelou a flutuação.", en: "The guide measured the river level and, as a safety measure, cancelled the float.", grammar: [g.preterite-regular], vocab: [w.medir, w.nível, w.medida, w.flutuação] }
      - { es: "Qual é o peso máximo da mala? E a altura, a largura e o comprimento?", en: "What's the maximum weight of the suitcase? And the height, width and length?", grammar: [g.question-words], vocab: [w.peso, w.altura, w.largura, w.comprimento] }
      - { es: "A distância entre Campo Grande e Bonito é de quase trezentos quilômetros.", en: "The distance between Campo Grande and Bonito is almost three hundred kilometres.", grammar: [g.ser-present, g.numbers-100-plus], vocab: [w.distância, w.quilômetro] }
      - { es: "Cada passeio tem um limite de pessoas por dia: é uma situação delicada para quem chega sem reserva.", en: "Each trip has a daily limit of people: it's a tricky situation for anyone who arrives without a booking.", grammar: [g.tem-there-is], vocab: [w.limite, w.situação, w.delicado] }
      - { es: "Mudei de ideia: na condição atual do rio, prefiro ficar na pousada.", en: "I've changed my mind: in the river's current condition, I'd rather stay at the inn.", grammar: [g.ser-estar-ficar-advanced], vocab: [w.mudar-de-ideia, w.condição, w.atual] }
      - { es: "Você é capaz de ficar uma hora na água sem falar nada?", en: "Are you able to stay in the water for an hour without saying anything?", grammar: [g.ser-estar-ficar-advanced], vocab: [w.capaz] }
    exchanges:
      - q: { es: "A água está fria?", en: "Is the water cold?" }
        a: { es: "Está ótima, mas a gente fica gelado depois de uma hora.", en: "It's lovely, but you get cold after an hour." }
        alt: ["Está boa.", "Um pouco, mas depois a gente acostuma."]
        grammar: [g.ser-estar-ficar-advanced]
      - q: { es: "Esses peixes são perigosos?", en: "Are these fish dangerous?" }
        a: { es: "Não, são calmos; só não toque neles.", en: "No, they're calm; just don't touch them." }
        alt: ["Não são, não.", "Não, mas fique calado para não assustar."]
        grammar: [g.ser-estar-ficar-advanced]
      - q: { es: "Moço, pode ficar com o troco.", en: "Keep the change, sir." }
        a: { es: "Obrigado! Boa flutuação para vocês.", en: "Thank you! Enjoy the float." }
        alt: ["Muito obrigado!", "Valeu, obrigado!"]
        grammar: [g.ser-estar-ficar-advanced]
        vocab: [w.flutuação]
      - q: { es: "Você tem certeza de que é seguro?", en: "Are you sure it's safe?" }
        a: { es: "Tenho: o guia mediu a profundidade antes.", en: "Yes: the guide measured the depth first." }
        alt: ["Tenho certeza, sim.", "Tenho, o rio está calmo hoje."]
        grammar: [g.ser-estar-ficar-advanced]
        vocab: [w.medir, w.profundidade]
      - q: { es: "Como ficou a foto?", en: "How did the photo turn out?" }
        a: { es: "Ficou linda: a água está tão transparente que dá para ver o fundo.", en: "It came out beautifully: the water is so clear you can see the bottom." }
        alt: ["Ficou ótima!", "Ficou escura, vou tirar outra."]
        grammar: [g.ser-estar-ficar-advanced]
        vocab: [w.transparente]
    texts:
      - title: "Regras da flutuação"
        es: ["Não é permitido usar protetor solar.", "Mantenha a máscara no rosto e fique calado para não assustar os peixes.", "Não toque no fundo do rio."]
        en: ["Sunscreen is not allowed.", "Keep your mask on your face and stay quiet so you don't scare the fish.", "Don't touch the bottom of the river."]
        grammar: [g.ser-estar-ficar-advanced]
        vocab: [w.máscara, w.calado]
    spicy:
      - { es: "Você fica tão bem de máscara que eu quase não olhei os peixes.", en: "You look so good in a mask that I barely looked at the fish.", grammar: [g.ser-estar-ficar-advanced], vocab: [w.máscara] }
      - { es: "Pode ficar com o troco e, se quiser, com o meu telefone também.", en: "Keep the change and, if you like, my phone number too.", grammar: [g.ser-estar-ficar-advanced] }
      - { es: "Fiquei sabendo que você está solteiro. Que coincidência: eu também.", en: "I heard you're single. What a coincidence: so am I.", altEs: ["Fiquei sabendo que você está solteira. Que coincidência: eu também."], grammar: [g.ser-estar-ficar-advanced] }
      - { es: "Eu sou calado, mas perto de você não consigo ficar calado.", en: "I'm a quiet person, but around you I can't keep quiet.", altEs: ["Eu sou calada, mas perto de você não consigo ficar calada."], grammar: [g.ser-estar-ficar-advanced], vocab: [w.calado] }
      - { es: "Mudei de ideia: em vez de ver os peixes, prefiro ver você.", en: "I've changed my mind: instead of watching the fish, I'd rather watch you.", grammar: [g.ser-estar-ficar-advanced], vocab: [w.mudar-de-ideia] }

  - id: b1.u12.l2
    title: Voltei a nadar
    teach: [g.verbal-periphrases]
    vocab: [w.voltar-a, w.deixar-de, w.passar-a, w.chegar-a, w.costume, w.hábito, w.rotina, w.desistir, w.aguentar, w.suportar, w.superar, w.enfrentar, w.lidar, w.manter, w.natação]
    tip: "voltar a = again, parar de / deixar de = stop, passar a = start (from now on), chegar a = go as far as, continuar + gerund = still, viver + gerund = always (a complaint), acabar + gerund = end up."
    sentences:
      - { es: "Depois de dez anos, voltei a nadar.", en: "After ten years, I took up swimming again.", altEs: ["Voltei a nadar depois de dez anos."], grammar: [g.verbal-periphrases], vocab: [w.voltar-a], error: { wrong: "Depois de dez anos, voltei nadar.", explain: "voltar needs a before the infinitive: voltei a nadar.", grammar: g.verbal-periphrases } }
      - { es: "Parei de fumar no ano passado e passei a correr todas as manhãs.", en: "I stopped smoking last year and started running every morning.", altEs: ["Parei de fumar ano passado e passei a correr todas as manhãs."], grammar: [g.verbal-periphrases], vocab: [w.passar-a], error: { wrong: "Parei fumar no ano passado e passei a correr todas as manhãs.", explain: "parar takes de before the infinitive: parei de fumar.", grammar: g.verbal-periphrases } }
      - { es: "Não deixe de visitar o Buraco das Araras.", en: "Make sure you visit the Macaw Sinkhole.", altEs: ["Não deixa de visitar o Buraco das Araras."], grammar: [g.verbal-periphrases, g.imperative-negative], vocab: [w.deixar-de], note: "Não deixe de… = a friendly 'don't miss…'." }
      - { es: "Ela deixou de comer carne quando se mudou para Bonito.", en: "She stopped eating meat when she moved to Bonito.", altEs: ["Ela parou de comer carne quando se mudou para Bonito."], grammar: [g.verbal-periphrases], vocab: [w.deixar-de] }
      - { es: "Cheguei a pensar em desistir, mas continuei nadando até o fim do rio.", en: "I even thought about giving up, but I kept on swimming to the end of the river.", grammar: [g.verbal-periphrases], vocab: [w.chegar-a, w.desistir] }
      - { es: "Ando dormindo mal com esse calor.", en: "I've been sleeping badly with this heat.", altEs: ["Eu ando dormindo mal com esse calor."], grammar: [g.verbal-periphrases] }
      - { es: "Meu chefe vive reclamando de tudo.", en: "My boss is always complaining about everything.", altEs: ["O meu chefe vive reclamando de tudo."], grammar: [g.verbal-periphrases] }
      - { es: "Fiquei esperando o guia por meia hora na porta da agência.", en: "I stood waiting for the guide for half an hour at the agency door.", grammar: [g.verbal-periphrases] }
      - { es: "O ônibus está para sair: corre!", en: "The bus is about to leave: run!", altEs: ["O ônibus está quase saindo: corre!"], grammar: [g.verbal-periphrases] }
      - { es: "Vim passar um fim de semana e acabei ficando um mês.", en: "I came for a weekend and ended up staying a month.", grammar: [g.verbal-periphrases] }
      - { es: "Nas férias é difícil manter a rotina, mas eu tenho o costume de acordar cedo.", en: "On holiday it's hard to keep to a routine, but I'm in the habit of getting up early.", grammar: [g.costumar], vocab: [w.manter, w.rotina, w.costume] }
      - { es: "Ele não aguenta mais esse calor, e eu não suporto os mosquitos.", en: "He can't stand this heat any more, and I can't bear the mosquitoes.", grammar: [g.negation], vocab: [w.aguentar, w.suportar] }
      - { es: "Ela superou o medo de altura e enfrentou a descida até o lago.", en: "She overcame her fear of heights and faced the descent to the lake.", grammar: [g.preterite-regular], vocab: [w.superar, w.enfrentar] }
      - { es: "Como você lida com o hábito de olhar o celular o tempo todo?", en: "How do you deal with the habit of checking your phone all the time?", grammar: [g.question-words], vocab: [w.lidar, w.hábito] }
      - { es: "Ainda está chovendo.", en: "It's still raining.", grammar: [g.verbal-periphrases], transform: { instruction: "Say it with continuar + gerund", answer: "Continua chovendo.", alt: ["Continua a chover."], en: "It keeps on raining." } }
      - { es: "Nadei de novo depois de dez anos.", en: "I swam again after ten years.", grammar: [g.verbal-periphrases], vocab: [w.natação], transform: { instruction: "Say it with voltar a", answer: "Voltei a nadar depois de dez anos.", alt: ["Depois de dez anos, voltei a nadar."] } }
    exchanges:
      - q: { es: "Você ainda fuma?", en: "Do you still smoke?" }
        a: { es: "Não, parei de fumar há dois anos.", en: "No, I stopped smoking two years ago." }
        alt: ["Não, deixei de fumar.", "Parei, graças a Deus."]
        grammar: [g.verbal-periphrases, g.ha-faz-time]
      - q: { es: "Você vai voltar a Bonito?", en: "Are you going to come back to Bonito?" }
        a: { es: "Com certeza! E você, não deixe de vir também.", en: "Definitely! And you, make sure you come too." }
        alt: ["Vou, sim.", "Quero voltar no ano que vem."]
        grammar: [g.verbal-periphrases]
        vocab: [w.deixar-de]
      - q: { es: "Como vai a natação?", en: "How's the swimming going?" }
        a: { es: "Ando treinando três vezes por semana, mas ainda me canso rápido.", en: "I've been training three times a week, but I still get tired quickly." }
        alt: ["Vai bem, voltei a treinar.", "Parei, não aguentei a rotina."]
        grammar: [g.verbal-periphrases]
        vocab: [w.natação]
      - q: { es: "Por que você está com essa cara?", en: "Why the long face?" }
        a: { es: "Fiquei esperando o ônibus por uma hora e ele não veio.", en: "I was waiting for the bus for an hour and it didn't come." }
        alt: ["Estou cansado, só isso.", "Perdi o passeio da gruta."]
        grammar: [g.verbal-periphrases]
      - q: { es: "Você chegou a ver o lago azul?", en: "Did you actually get to see the blue lake?" }
        a: { es: "Cheguei, mas não consegui descer: tinha um limite de pessoas.", en: "I did, but I couldn't go down: there was a limit on numbers." }
        alt: ["Cheguei, é lindo!", "Não cheguei a ver, estava fechado."]
        grammar: [g.verbal-periphrases]
        vocab: [w.chegar-a]
    texts:
      - title: "Mensagem para a amiga"
        es: ["Lembra que eu tinha medo de água?", "Pois é: superei o medo e voltei a nadar.", "Agora não paro de pensar na próxima flutuação."]
        en: ["Remember how I was afraid of water?", "Well: I got over my fear and started swimming again.", "Now I can't stop thinking about the next float."]
        grammar: [g.verbal-periphrases]
        vocab: [w.superar, w.voltar-a]
      - title: "Resolução de ano novo"
        es: ["A partir de janeiro, passo a dormir mais cedo.", "Vou deixar de olhar o celular na cama.", "E, se eu desistir, pelo menos tentei."]
        en: ["From January, I'm going to start going to bed earlier.", "I'm going to stop checking my phone in bed.", "And if I give up, at least I tried."]
        grammar: [g.verbal-periphrases]
        vocab: [w.passar-a, w.deixar-de, w.desistir]
    spicy:
      - { es: "Desde que te conheci, passei a gostar de segunda-feira.", en: "Since I met you, I've started liking Mondays.", altEs: ["Desde que conheci você, passei a gostar de segunda-feira."], grammar: [g.verbal-periphrases], vocab: [w.passar-a] }
      - { es: "Não consigo parar de olhar para você; é falta de educação, eu sei.", en: "I can't stop looking at you; it's rude, I know.", grammar: [g.verbal-periphrases] }
      - { es: "Você vive dizendo que não gosta de mim, mas continua aparecendo.", en: "You keep saying you don't like me, but you keep turning up.", grammar: [g.verbal-periphrases], vocab: [w.aparecer] }
      - { es: "Cheguei a ensaiar o que ia dizer, mas esqueci tudo quando você sorriu.", en: "I even rehearsed what I was going to say, but I forgot it all when you smiled.", grammar: [g.verbal-periphrases], vocab: [w.chegar-a] }
      - { es: "Acabei me apaixonando pelo guia. A culpa é do rio.", en: "I ended up falling for the guide. The river's to blame.", altEs: ["Acabei me apaixonando pela guia. A culpa é do rio."], grammar: [g.verbal-periphrases], vocab: [w.culpa] }

  - id: b1.u12.l3
    title: A cidade foi crescendo
    teach: [g.verbal-periphrases]
    vocab: [w.transformar, w.transformar-se, w.envelhecer, w.amadurecer, w.evoluir, w.processo, w.fase, w.etapa, w.período, w.progresso, w.progredir, w.desenvolver-se, w.diminuir, w.reduzir, w.ampliar, w.melhoria, w.tratar, w.controlar, w.dominar, w.envolver, w.permanecer]
    tip: "ir + gerund describes gradual change: A cidade foi crescendo (bit by bit). Verbs of change: transformar-se em, envelhecer, amadurecer, evoluir, desenvolver-se."
    sentences:
      - { es: "Bonito se transformou num dos lugares de turismo de natureza mais famosos do Brasil.", en: "Bonito has turned into one of the most famous nature-tourism destinations in Brazil.", altEs: ["Bonito se transformou em um dos lugares de turismo de natureza mais famosos do Brasil."], grammar: [g.verbal-periphrases, g.superlatives], vocab: [w.transformar-se], error: { wrong: "Bonito transformou num dos lugares de turismo de natureza mais famosos do Brasil.", explain: "When the subject itself changes, use transformar-se: Bonito se transformou.", grammar: g.verbal-periphrases } }
      - { es: "A cidade foi crescendo, mas o número de visitantes continua controlado.", en: "The town has gradually grown, but the number of visitors is still controlled.", grammar: [g.verbal-periphrases, g.passive-estar-ficar], vocab: [w.controlar] }
      - { es: "Cada passeio tem um limite de pessoas, para reduzir o lixo e manter a água limpa.", en: "Each trip has a limit on people, to reduce litter and keep the water clean.", grammar: [g.tem-there-is], vocab: [w.reduzir] }
      - { es: "O processo é simples: você reserva tudo numa agência antes de sair.", en: "The process is simple: you book everything at an agency before you go.", grammar: [g.antes-depois-de], vocab: [w.processo] }
      - { es: "O queijo vai ficando melhor à medida que envelhece.", en: "The cheese gets better and better as it ages.", altEs: ["O queijo vai ficando melhor quando envelhece."], grammar: [g.verbal-periphrases], vocab: [w.envelhecer] }
      - { es: "No calor, a banana amadurece muito mais rápido.", en: "In the heat, bananas ripen much faster.", grammar: [g.present-regular-er-ir], vocab: [w.amadurecer] }
      - { es: "O projeto passou por três etapas: estudo, construção e inauguração.", en: "The project went through three stages: study, construction and opening.", grammar: [g.preterite-regular], vocab: [w.etapa] }
      - { es: "Nesta fase do ano, a água fica ainda mais transparente.", en: "At this time of year, the water gets even clearer.", altEs: ["Nessa fase do ano, a água fica ainda mais transparente."], grammar: [g.ficar-change-of-state], vocab: [w.fase] }
      - { es: "O período de chuvas vai de outubro a março.", en: "The rainy season runs from October to March.", grammar: [g.days-months], vocab: [w.período] }
      - { es: "A tecnologia evoluiu muito; hoje dá para controlar tudo pelo celular.", en: "Technology has come a long way; today you can control everything from your phone.", grammar: [g.preterite-regular], vocab: [w.evoluir, w.controlar] }
      - { es: "Ele está progredindo: já domina o espanhol e está aprendendo português.", en: "He's making progress: he's already mastered Spanish and he's learning Portuguese.", grammar: [g.estar-gerund], vocab: [w.progredir, w.dominar] }
      - { es: "O desmatamento diminuiu na região, mas o problema continua existindo.", en: "Deforestation has decreased in the region, but the problem still exists.", grammar: [g.verbal-periphrases], vocab: [w.diminuir, w.desmatamento] }
      - { es: "A prefeitura vai ampliar o centro de visitantes, e a melhoria da estrada envolve o estado também.", en: "The town hall is going to expand the visitor centre, and the road improvement involves the state too.", grammar: [g.ir-infinitive], vocab: [w.ampliar, w.melhoria, w.envolver] }
      - { es: "A cidade se desenvolveu por causa do turismo, e os guias tratam o rio com muito respeito.", en: "The town developed because of tourism, and the guides treat the river with great respect.", grammar: [g.connectors-cause-consequence], vocab: [w.desenvolver-se, w.tratar] }
      - { es: "A cidade cresceu aos poucos.", en: "The town grew little by little.", grammar: [g.verbal-periphrases], transform: { instruction: "Use ir + gerund to show the gradual change", answer: "A cidade foi crescendo aos poucos.", alt: ["A cidade foi crescendo."], en: "The town gradually grew." } }
      - { es: "O turismo transformou a cidade.", en: "Tourism transformed the town.", grammar: [g.verbal-periphrases], vocab: [w.transformar, w.progresso], transform: { instruction: "Start with A cidade and use transformar-se", answer: "A cidade se transformou com o turismo.", alt: ["A cidade transformou-se com o turismo."] } }
    exchanges:
      - q: { es: "Bonito mudou muito?", en: "Has Bonito changed a lot?" }
        a: { es: "Mudou: a cidade foi crescendo, mas a natureza continua protegida.", en: "It has: the town has gradually grown, but nature is still protected." }
        alt: ["Mudou bastante.", "Cresceu, mas continua tranquila."]
        grammar: [g.verbal-periphrases]
      - q: { es: "Como está o seu português?", en: "How's your Portuguese?" }
        a: { es: "Está melhorando aos poucos; já fiz muito progresso.", en: "It's getting better little by little; I've already made a lot of progress." }
        alt: ["Vai melhorando.", "Estou progredindo, mas devagar."]
        grammar: [g.verbal-periphrases]
        vocab: [w.progresso]
      - q: { es: "Por que tem limite de visitantes?", en: "Why is there a limit on visitors?" }
        a: { es: "Para controlar o turismo e manter a água limpa.", en: "To control tourism and keep the water clean." }
        alt: ["Para proteger os rios.", "Para reduzir o lixo nos rios."]
        grammar: [g.por-vs-para]
        vocab: [w.controlar]
      - q: { es: "Você acha que o turismo transformou a cidade?", en: "Do you think tourism has transformed the town?" }
        a: { es: "Transformou, e para melhor: a cidade se desenvolveu sem destruir os rios.", en: "It has, and for the better: the town developed without destroying the rivers." }
        alt: ["Transformou muito.", "Um pouco, mas a cidade ainda é pequena."]
        grammar: [g.verbal-periphrases]
        vocab: [w.transformar, w.desenvolver-se]
      - q: { es: "Como você lida com o fato de envelhecer?", en: "How do you deal with getting older?" }
        a: { es: "Bem: a gente envelhece, mas também amadurece.", en: "Fine: you get older, but you also grow wiser." }
        alt: ["Muito bem, obrigado.", "Envelhecer faz parte."]
        grammar: [g.a-gente]
        vocab: [w.envelhecer, w.amadurecer]
    texts:
      - title: "Placa no centro de visitantes"
        es: ["Bonito: turismo com limites.", "Cada passeio recebe um número controlado de visitantes por dia.", "Assim, a natureza permanece como sempre foi."]
        en: ["Bonito: tourism with limits.", "Each trip takes a controlled number of visitors per day.", "That way, nature stays as it has always been."]
        grammar: [g.passive-estar-ficar]
        vocab: [w.controlar, w.permanecer]
    spicy:
      - { es: "Você é como queijo canastra: vai ficando melhor com o tempo.", en: "You're like canastra cheese: you keep getting better with time.", grammar: [g.verbal-periphrases] }
      - { es: "A gente está numa fase delicada: você ainda não sabe que gosta de mim.", en: "We're at a delicate stage: you don't know yet that you like me.", grammar: [g.estar-present], vocab: [w.fase, w.delicado] }
      - { es: "Eu tento controlar o meu coração, mas ele não me obedece.", en: "I try to control my heart, but it won't obey me.", grammar: [g.present-regular-ar], vocab: [w.controlar] }
      - { es: "Cada etapa do encontro foi uma melhoria: o café, o jantar e o beijo.", en: "Each stage of the date was an improvement: the coffee, the dinner and the kiss.", grammar: [g.preterite-ser-ir], vocab: [w.etapa, w.melhoria] }
      - { es: "Envelhecer ao seu lado não parece um problema; parece um plano.", en: "Growing old by your side doesn't sound like a problem; it sounds like a plan.", grammar: [g.present-regular-er-ir], vocab: [w.envelhecer] }

  - id: b1.u12.l4
    title: A peça estreia no sábado
    teach: [g.b1-review]
    vocab: [w.peça, w.palco, w.plateia, w.ensaio, w.ensaiar, w.cena, w.aplauso, w.aplaudir, w.estreia, w.espetáculo, w.elenco, w.compor]
    tip: "Review: quando / se + future subjunctive for the future (quando chegar), espero que + present subjunctive, para + personal infinitive (para chegarmos), and the pluperfect for the earlier of two past events."
    sentences:
      - { es: "A peça estreia no sábado, no palco do centro cultural.", en: "The play opens on Saturday, on the stage of the cultural centre.", grammar: [g.b1-review], vocab: [w.peça, w.palco] }
      - { es: "Quando a luz apagar, fiquem calados.", en: "When the lights go down, keep quiet.", altEs: ["Quando a luz se apagar, fiquem calados."], grammar: [g.b1-review, g.future-subjunctive-time], vocab: [w.calado] }
      - { es: "O elenco tem ensaiado todas as noites.", en: "The cast has been rehearsing every night.", grammar: [g.b1-review, g.perfeito-composto], vocab: [w.elenco, w.ensaiar], note: "tenho feito = have been doing (repeated), not a single completed action." }
      - { es: "Se a plateia gostar, a gente faz mais uma sessão no domingo.", en: "If the audience likes it, we'll do another performance on Sunday.", grammar: [g.b1-review, g.future-subjunctive-se], vocab: [w.plateia] }
      - { es: "A música da última cena foi composta por um músico de Bonito.", en: "The music for the last scene was composed by a musician from Bonito.", grammar: [g.passive-ser], vocab: [w.cena, w.compor] }
      - { es: "Espero que o público aplauda no final.", en: "I hope the audience applauds at the end.", grammar: [g.b1-review, g.subjunctive-wishes], vocab: [w.aplaudir] }
      - { es: "Quando cheguei ao ensaio, o elenco já tinha começado.", en: "When I got to rehearsal, the cast had already started.", altEs: ["Quando cheguei no ensaio, o elenco já tinha começado."], grammar: [g.b1-review, g.pluperfect], vocab: [w.ensaio, w.elenco] }
      - { es: "Os aplausos duraram cinco minutos.", en: "The applause lasted five minutes.", grammar: [g.preterite-regular], vocab: [w.aplauso] }
      - { es: "O diretor disse que a estreia seria um sucesso.", en: "The director said the premiere would be a success.", altEs: ["O diretor disse que a estreia ia ser um sucesso."], grammar: [g.b1-review, g.reported-speech-past], vocab: [w.estreia] }
      - { es: "Procuro um ator que saiba cantar e dançar.", en: "I'm looking for an actor who can sing and dance.", altEs: ["Procuro uma atriz que saiba cantar e dançar."], grammar: [g.b1-review, g.relative-subjunctive] }
      - { es: "O espetáculo foi visto por mais de mil pessoas.", en: "The show was seen by more than a thousand people.", grammar: [g.b1-review, g.passive-ser], vocab: [w.espetáculo] }
      - { es: "Talvez o espetáculo volte em dezembro, se tudo der certo.", en: "Maybe the show will come back in December, if all goes well.", grammar: [g.b1-review, g.talvez, g.future-subjunctive-se], vocab: [w.espetáculo] }
      - { es: "Ao terminar a cena, a plateia toda aplaudiu de pé.", en: "When the scene ended, the whole audience gave a standing ovation.", grammar: [g.b1-review, g.antes-depois-de], vocab: [w.cena, w.plateia, w.aplaudir] }
      - { es: "Ontem eu vi a peça com a minha irmã.", en: "Yesterday I saw the play with my sister.", grammar: [g.b1-review], vocab: [w.peça], error: { wrong: "Ontem eu tenho visto a peça com a minha irmã.", explain: "tenho visto means 'I've been seeing (repeatedly)'; a single past event takes the preterite: vi.", grammar: g.b1-review } }
      - { es: "Temos que sair às sete para que a gente chegue a tempo.", en: "We have to leave at seven so that we get there on time.", grammar: [g.b1-review, g.subjunctive-purpose], transform: { instruction: "Rewrite with para + personal infinitive", answer: "Temos que sair às sete para chegarmos a tempo.", alt: ["Temos que sair às sete para a gente chegar a tempo."] } }
      - { es: "Quando o diretor chegar, a gente começa o ensaio.", en: "When the director arrives, we'll start the rehearsal.", grammar: [g.b1-review, g.future-subjunctive-time], vocab: [w.ensaio], error: { wrong: "Quando o diretor chegue, a gente começa o ensaio.", explain: "For the future, quando takes the future subjunctive: quando chegar.", grammar: g.b1-review }, transform: { instruction: "Change to 'when the actors arrive' (os atores)", answer: "Quando os atores chegarem, a gente começa o ensaio.", alt: ["Quando os atores chegarem, começamos o ensaio."] } }
    exchanges:
      - q: { es: "Quando é a estreia?", en: "When is the premiere?" }
        a: { es: "É no sábado, às oito, no centro cultural.", en: "It's on Saturday at eight, at the cultural centre." }
        alt: ["No sábado.", "Sábado à noite, no centro cultural."]
        grammar: [g.ser-estar-ficar-advanced]
        vocab: [w.estreia]
      - q: { es: "Como foi o ensaio?", en: "How did the rehearsal go?" }
        a: { es: "Foi ótimo, embora o elenco esteja muito cansado.", en: "It was great, although the cast is very tired." }
        alt: ["Foi bom.", "Foi longo, mas deu certo."]
        grammar: [g.connectors-contrast]
        vocab: [w.ensaio, w.elenco]
      - q: { es: "Você acha que a plateia vai gostar?", en: "Do you think the audience will like it?" }
        a: { es: "Acho que sim; a última cena é linda.", en: "I think so; the last scene is beautiful." }
        alt: ["Tenho certeza de que vai.", "Espero que sim."]
        grammar: [g.achar-que]
        vocab: [w.plateia, w.cena]
      - q: { es: "Quem compôs a música?", en: "Who composed the music?" }
        a: { es: "Um músico daqui, que toca no festival de inverno.", en: "A local musician who plays at the winter festival." }
        alt: ["Um músico de Bonito.", "Foi composta pelo diretor."]
        grammar: [g.relative-que-quem]
        vocab: [w.compor]
      - q: { es: "Se sobrar ingresso, você me avisa?", en: "If there are tickets left, will you let me know?" }
        a: { es: "Aviso, claro. Mas corre, que está quase tudo vendido.", en: "Of course I will. But hurry, it's almost sold out." }
        alt: ["Aviso, sim.", "Claro, te mando uma mensagem."]
        grammar: [g.future-subjunctive-se]
        vocab: [w.sobrar]
    texts:
      - title: "Cartaz"
        es: ["Estreia: «O Rio que Fala».", "Uma peça sobre as águas de Bonito, com elenco da cidade.", "Sábado, às oito da noite, no palco do centro cultural. Entrada gratuita."]
        en: ["Premiere: 'The River that Speaks'.", "A play about the waters of Bonito, with a local cast.", "Saturday, at eight in the evening, on the stage of the cultural centre. Free entry."]
        grammar: [g.b1-review]
        vocab: [w.estreia, w.peça, w.elenco, w.palco]
      - title: "Crítica no jornal"
        es: ["O espetáculo é simples, mas bonito.", "Na cena final, a plateia ficou calada e, em seguida, aplaudiu de pé.", "Quem puder, não deixe de ver."]
        en: ["The show is simple, but beautiful.", "In the final scene, the audience fell silent and then gave a standing ovation.", "Anyone who can should make sure they see it."]
        grammar: [g.b1-review]
        vocab: [w.espetáculo, w.cena, w.aplaudir]
    spicy:
      - { es: "Ensaiei esta frase a semana toda: quer jantar comigo?", en: "I've rehearsed this line all week: will you have dinner with me?", grammar: [g.b1-review], vocab: [w.ensaiar] }
      - { es: "Quando a gente se beijar, quero aplausos.", en: "When we kiss, I want applause.", grammar: [g.future-subjunctive-time], vocab: [w.aplauso] }
      - { es: "Na estreia, você roubou a cena e o meu coração.", en: "At the premiere, you stole the show and my heart.", grammar: [g.b1-review], vocab: [w.estreia, w.cena] }
      - { es: "Tenho feito de tudo para você me notar; hoje até penteei o cabelo.", en: "I've been doing everything to get you to notice me; today I even combed my hair.", grammar: [g.perfeito-composto], vocab: [w.notar] }
      - { es: "Se você aplaudir mais alto, eu faço mais uma cena só para você.", en: "If you clap louder, I'll do another scene just for you.", grammar: [g.future-subjunctive-se], vocab: [w.aplaudir, w.cena] }
dialogues:
  - id: b1.u12.d1
    title: Depois da flutuação
    context: Nando has just floated down a crystal-clear river near Bonito. On the way back, he chats with Iara, his guide.
    lines:
      - { speaker: Nando, es: "Iara, que experiência! Fiquei uma hora na água e nem senti frio.", en: "Iara, what an experience! I was in the water for an hour and didn't even feel cold." }
      - { speaker: Iara, es: "É assim mesmo. A água fica sempre com uns vinte e dois graus.", en: "That's how it is. The water always stays at about twenty-two degrees." }
      - { speaker: Nando, es: "Você sempre foi guia?", en: "Have you always been a guide?" }
      - { speaker: Iara, es: "Não. Eu era professora em Campo Grande, mas vivia reclamando da rotina.", en: "No. I was a teacher in Campo Grande, but I was always complaining about the routine." }
      - { speaker: Nando, es: "E aí?", en: "And then?" }
      - { speaker: Iara, es: "Um dia vim passar um fim de semana aqui e acabei ficando. Faz dez anos.", en: "One day I came here for a weekend and ended up staying. That was ten years ago." }
      - { speaker: Nando, es: "Que coragem! Eu cheguei a pensar em mudar de vida, mas desisti.", en: "How brave! I even thought about changing my life, but I gave up." }
      - { speaker: Iara, es: "Por quê?", en: "Why?" }
      - { speaker: Nando, es: "Fiquei com medo. Mas, depois de hoje, estou começando a mudar de ideia.", en: "I got scared. But after today, I'm starting to change my mind." }
      - { speaker: Iara, es: "Então não deixe de voltar. E, quando voltar, me procure: preciso de alguém que cuide das reservas.", en: "Then make sure you come back. And when you do, look me up: I need someone to look after the bookings." }
      - { speaker: Nando, es: "Você está falando sério?", en: "Are you serious?" }
      - { speaker: Iara, es: "Estou. Mas, primeiro, vamos ver se você aguenta acordar às cinco.", en: "I am. But first, let's see if you can handle getting up at five." }
    questions:
      - { q: "O que a Iara fazia antes de ser guia?", options: ["Era professora em Campo Grande", "Trabalhava numa agência de turismo", "Era dona de uma pousada"], answer: 0, explain: "Eu era professora em Campo Grande." }
      - { q: "Como a Iara foi parar em Bonito?", options: ["Foi mandada pelo trabalho", "Veio passar um fim de semana e acabou ficando", "Nasceu na cidade"], answer: 1, explain: "Vim passar um fim de semana aqui e acabei ficando." }
      - { q: "Por que o Nando desistiu de mudar de vida?", options: ["Porque ficou com medo", "Porque não tinha dinheiro", "Porque a família não deixou"], answer: 0, explain: "Fiquei com medo." }
      - { q: "O que a Iara oferece ao Nando?", options: ["Uma aula de natação", "Um trabalho cuidando das reservas", "Um quarto na pousada"], answer: 1, explain: "Preciso de alguém que cuide das reservas." }
