id: b1.u01
title: El subjuntivo - deseos
lessons:
  - id: b1.u01.l1
    title: Formas regulares — hable, coma, viva
    teach: [g.subjunctive-present-forms]
    vocab: [w.deseo, w.desear, w.lograr, w.cumplir, w.proposito, w.ilusion, w.esfuerzo, w.esforzarse, w.alcanzar, w.aprobar, w.suspender, w.beca, w.master, w.independizarse, w.tranquilidad, w.felicidad, w.salud, w.ano-nuevo]
    tip: "Take the yo form, drop the -o and swap the vowel: -ar → -e (hable), -er/-ir → -a (coma, viva). Vosotros: habléis, comáis, viváis."
    sentences:
      - { es: "Mis padres desean que estudie un máster en el extranjero.", en: "My parents want me to study for a master's degree abroad.", grammar: [g.subjunctive-present-forms], vocab: [w.desear, w.master, w.extranjero] }
      - { es: "Espero que este año cumplas todos tus propósitos.", en: "I hope you fulfil all your resolutions this year.", grammar: [g.subjunctive-present-forms], vocab: [w.cumplir, w.proposito, w.esperar] }
      - { es: "Mi deseo para el año nuevo es que vivamos con más tranquilidad.", en: "My wish for the new year is that we live more calmly.", grammar: [g.subjunctive-present-forms], vocab: [w.deseo, w.ano-nuevo, w.tranquilidad] }
      - { es: "Quiero que mi hermana logre independizarse este verano.", en: "I want my sister to manage to move out this summer.", grammar: [g.subjunctive-present-forms], vocab: [w.lograr, w.independizarse, w.hermano] }
      - { es: "Ojalá no suspendas otra vez; te has esforzado mucho.", en: "I hope you don't fail again; you've tried really hard.", grammar: [g.subjunctive-present-forms, g.present-perfect], vocab: [w.suspender, w.esforzarse, w.ojala] }
      - { es: "Es importante que habléis con el profesor antes del examen.", en: "It's important that you talk to the teacher before the exam.", grammar: [g.subjunctive-present-forms], vocab: [w.hablar, w.profesor, w.examen], note: "vosotros: habléis, comáis, viváis." }
      - { es: "Deseamos que alcancéis todas vuestras metas.", en: "We hope you reach all your goals.", grammar: [g.subjunctive-present-forms], vocab: [w.desear, w.alcanzar, w.meta], note: "alcanzar → alcance: z becomes c before e." }
      - { es: "Espero que la beca llegue a tiempo para pagar el curso.", en: "I hope the grant arrives in time to pay for the course.", grammar: [g.subjunctive-present-forms], vocab: [w.beca, w.llegar, w.a-tiempo], note: "llegar → llegue: g becomes gu before e." }
      - { es: "Mi madre quiere que coma más verdura y que descanse más.", en: "My mother wants me to eat more vegetables and rest more.", grammar: [g.subjunctive-present-forms], vocab: [w.comer, w.verdura, w.descansar] }
      - { es: "Os deseo mucha salud y felicidad en el año nuevo.", en: "I wish you lots of health and happiness in the new year.", grammar: [g.indirect-object-pronouns], vocab: [w.desear, w.salud, w.felicidad] }
      - { es: "Me hace ilusión que mis amigos celebren la fiesta en mi casa.", en: "I'm excited that my friends are celebrating the party at my house.", grammar: [g.subjunctive-present-forms], vocab: [w.ilusion, w.celebrar, w.fiesta], note: "me hace ilusión = I'm excited about it, I'm looking forward to it." }
      - { es: "Con esfuerzo, todo se logra.", en: "With effort, everything can be achieved.", grammar: [g.present-review], vocab: [w.esfuerzo, w.lograr] }
      - { es: "Espero que trabajes menos este año.", en: "I hope you work less this year.", grammar: [g.subjunctive-present-forms], vocab: [w.esperar, w.trabajar], error: { wrong: "Espero que trabajas menos este año.", explain: "After esperar que the verb goes in the subjunctive: trabajes, not trabajas.", grammar: g.subjunctive-present-forms } }
      - { es: "Ojalá que mi abuelo viva muchos años más.", en: "I hope my grandfather lives many more years.", grammar: [g.subjunctive-present-forms], vocab: [w.ojala, w.vivir, w.abuelo] }
      - { es: "Esperamos que la empresa pague mejor a los jóvenes.", en: "We hope the company pays young people better.", grammar: [g.subjunctive-present-forms], vocab: [w.empresa, w.pagar, w.joven], note: "pagar → pague." }
      - { es: "Quiero que (vosotros) / escuchar / al médico", en: "I want you to listen to the doctor.", grammar: [g.subjunctive-present-forms], vocab: [w.escuchar, w.medico], transform: { instruction: "Put the verb in the present subjunctive", answer: "Quiero que escuchéis al médico.", alt: ["Quiero que vosotros escuchéis al médico."] } }
  - id: b1.u01.l2
    title: Tenga, haga, pida — cambios en la raíz
    teach: [g.subjunctive-present-forms]
    vocab: [w.puesto, w.sueldo, w.ascenso, w.contrato, w.fijo, w.hipoteca, w.alquiler, w.alquilar, w.compromiso, w.comprometerse, w.bienestar, w.equilibrio, w.libertad, w.seguridad, w.estabilidad, w.a-largo-plazo, w.a-corto-plazo, w.jornada, w.teletrabajo, w.profesional]
    tip: "Build the subjunctive from the yo form: tengo → tenga, hago → haga, conozco → conozca. Stem changers keep the boot (piense, vuelva); -ir verbs also change in nosotros/vosotros (pidamos, durmáis)."
    sentences:
      - { es: "Espero que me ofrezcan un puesto fijo antes del verano.", en: "I hope they offer me a permanent position before the summer.", grammar: [g.subjunctive-present-forms], vocab: [w.puesto, w.fijo, w.ofrecer], note: "ofrezco → ofrezca." }
      - { es: "Quiero que mi jefe me suba el sueldo este año.", en: "I want my boss to raise my salary this year.", grammar: [g.subjunctive-present-forms], vocab: [w.sueldo, w.jefe, w.subir] }
      - { es: "Ojalá consiga el ascenso; llevo cinco años en la empresa.", en: "I hope I get the promotion; I've been at the company for five years.", grammar: [g.subjunctive-present-forms, g.desde-hace], vocab: [w.ascenso, w.conseguir, w.empresa], note: "consigo → consiga." }
      - { es: "Mis padres prefieren que no pidamos una hipoteca tan grande.", en: "My parents would rather we didn't take out such a big mortgage.", grammar: [g.subjunctive-present-forms], vocab: [w.hipoteca, w.pedir, w.preferir], note: "pedir: pida, pidas, pida, pidamos, pidáis, pidan — nosotros and vosotros change too." }
      - { es: "Espero que no nos vuelvan a subir el alquiler.", en: "I hope they don't raise our rent again.", grammar: [g.subjunctive-present-forms, g.volver-a], vocab: [w.alquiler, w.volver-a, w.subir] }
      - { es: "Mi pareja quiere que alquilemos un piso con más luz antes de comprar.", en: "My partner wants us to rent a flat with more light before buying.", grammar: [g.subjunctive-present-forms], vocab: [w.alquilar, w.piso, w.pareja, w.luz] }
      - { es: "Es normal que tengáis miedo del compromiso a vuestra edad.", en: "It's normal for you to be afraid of commitment at your age.", grammar: [g.subjunctive-present-forms], vocab: [w.compromiso, w.tener-miedo.phr, w.edad], note: "tengo → tenga, tengáis." }
      - { es: "Espero que la empresa se comprometa a cumplir la jornada de ocho horas.", en: "I hope the company commits to keeping the eight-hour working day.", grammar: [g.subjunctive-present-forms], vocab: [w.comprometerse, w.cumplir, w.jornada] }
      - { es: "Quiero que hagamos teletrabajo dos días a la semana.", en: "I want us to work from home two days a week.", grammar: [g.subjunctive-present-forms], vocab: [w.teletrabajo, w.hacer, w.semana], note: "hago → haga." }
      - { es: "Ojalá encuentres un equilibrio entre el trabajo y la familia.", en: "I hope you find a balance between work and family.", grammar: [g.subjunctive-present-forms], vocab: [w.equilibrio, w.encontrar, w.trabajo], note: "encuentro → encuentre." }
      - { es: "Deseo que mis hijos crezcan con libertad y seguridad.", en: "I want my children to grow up with freedom and security.", grammar: [g.subjunctive-present-forms], vocab: [w.libertad, w.seguridad, w.crecer], note: "crezco → crezca." }
      - { es: "A largo plazo, prefiero la estabilidad a un sueldo alto.", en: "In the long term, I prefer stability to a high salary.", grammar: [g.stem-changing-present], vocab: [w.a-largo-plazo, w.estabilidad, w.sueldo] }
      - { es: "A corto plazo, necesito que me digan cuándo empieza el contrato.", en: "In the short term, I need them to tell me when the contract starts.", grammar: [g.subjunctive-present-forms], vocab: [w.a-corto-plazo, w.contrato, w.decir], note: "digo → diga." }
      - { es: "Para nuestro bienestar, quiero que durmamos más y que salgamos del trabajo a nuestra hora.", en: "For our well-being, I want us to sleep more and to leave work on time.", grammar: [g.subjunctive-present-forms], vocab: [w.bienestar, w.dormir, w.salir], note: "dormir: duerma … durmamos, durmáis; salgo → salga." }
      - { es: "Espero que mi hermano encuentre pronto un puesto fijo.", en: "I hope my brother soon finds a permanent job.", grammar: [g.subjunctive-present-forms], vocab: [w.encontrar, w.puesto, w.fijo], error: { wrong: "Espero que mi hermano encuentra pronto un puesto fijo.", explain: "Stem-changing verbs keep the change in the subjunctive and take the -e ending: encuentre.", grammar: g.subjunctive-present-forms } }
      - { es: "Vosotros / tener / más vacaciones (ojalá)", en: "I hope you have more holidays.", grammar: [g.subjunctive-present-forms], vocab: [w.tener, w.vacaciones], transform: { instruction: "Make a wish with ojalá", answer: "Ojalá tengáis más vacaciones.", alt: ["Ojalá que tengáis más vacaciones."] } }
  - id: b1.u01.l3
    title: Querer que, pedir que, ojalá
    teach: [g.subjunctive-wishes]
    vocab: [w.rogar, w.exigir, w.insistir, w.permitir, w.prohibir, w.brindar, w.brindis, w.enhorabuena, w.felicitar, w.que-aproveche, w.que-te-vaya-bien, w.invertir, w.emprender, w.negocio, w.autonomo, w.oportunidad, w.apoyar, w.apoyo]
    tip: "Same subject → infinitive (Quiero viajar). New subject → que + subjunctive (Quiero que viajes). Ojalá and a bare que + subjunctive express wishes."
    sentences:
      - { es: "Quiero montar un negocio, pero mi familia quiere que busque un trabajo fijo.", en: "I want to set up a business, but my family wants me to look for a permanent job.", grammar: [g.subjunctive-wishes], vocab: [w.negocio, w.buscar, w.fijo], note: "montar un negocio = to set up a business." }
      - { es: "Mis padres no quieren que invierta todo mi dinero en el proyecto.", en: "My parents don't want me to invest all my money in the project.", grammar: [g.subjunctive-wishes], vocab: [w.invertir, w.dinero, w.proyecto] }
      - { es: "Te pido que me apoyes si decido emprender.", en: "I'm asking you to support me if I decide to start a business.", grammar: [g.subjunctive-wishes, g.si-present-future], vocab: [w.apoyar, w.emprender, w.pedir] }
      - { es: "El banco exige que tengamos un plan de negocio claro.", en: "The bank demands that we have a clear business plan.", grammar: [g.subjunctive-wishes], vocab: [w.exigir, w.plan, w.negocio] }
      - { es: "Mi hermana insiste en que trabajemos como autónomos el primer año.", en: "My sister insists that we work as self-employed people the first year.", grammar: [g.subjunctive-wishes], vocab: [w.insistir, w.autonomo, w.trabajar] }
      - { es: "Le rogamos que llame antes de venir.", en: "We kindly ask you to call before coming.", grammar: [g.subjunctive-wishes], vocab: [w.rogar, w.llamar, w.venir], note: "Formal register (usted)." }
      - { es: "El ayuntamiento no permite que los bares pongan música después de las doce.", en: "The council doesn't allow bars to play music after midnight.", grammar: [g.subjunctive-wishes], vocab: [w.permitir, w.ayuntamiento, w.musica] }
      - { es: "El médico me prohíbe que fume, y espero dejarlo este año.", en: "The doctor forbids me to smoke, and I hope to quit this year.", grammar: [g.subjunctive-wishes], vocab: [w.prohibir, w.fumar, w.dejar-de], note: "espero + infinitive: same subject." }
      - { es: "¡Enhorabuena por el nuevo trabajo! Que te vaya muy bien.", en: "Congratulations on the new job! All the best.", grammar: [g.subjunctive-wishes, g.subjunctive-irregular], vocab: [w.enhorabuena, w.que-te-vaya-bien, w.trabajo], variant: "Latin America: ¡Felicitaciones!" }
      - { es: "Brindemos por Marta: ¡que tenga mucha suerte en Alemania!", en: "Let's drink to Marta: may she have lots of luck in Germany!", grammar: [g.subjunctive-wishes], vocab: [w.brindar, w.suerte], note: "brindemos = let's toast; the nosotros command is the subjunctive form." }
      - { es: "Después del brindis, todos felicitaron a los novios.", en: "After the toast, everyone congratulated the bride and groom.", grammar: [g.preterite-regular, g.a-personal], vocab: [w.brindis, w.felicitar, w.novio] }
      - { es: "¡Que aproveche! — Gracias, ¿quieres probar?", en: "Enjoy your meal! — Thanks, do you want to try some?", grammar: [g.subjunctive-wishes], vocab: [w.que-aproveche, w.probar], variant: "Latin America: ¡Buen provecho!" }
      - { es: "Ojalá tengamos la oportunidad de volver a trabajar juntos.", en: "I hope we have the chance to work together again.", grammar: [g.subjunctive-wishes, g.volver-a], vocab: [w.oportunidad, w.ojala, w.volver-a] }
      - { es: "Necesito el apoyo de mi familia para dar este paso.", en: "I need my family's support to take this step.", grammar: [g.por-vs-para], vocab: [w.apoyo, w.familia, w.paso] }
      - { es: "Espero que vengas a mi fiesta el sábado.", en: "I hope you come to my party on Saturday.", grammar: [g.subjunctive-wishes], vocab: [w.esperar, w.venir, w.fiesta], error: { wrong: "Espero que venir a mi fiesta el sábado.", explain: "With a new subject you need que + subjunctive, not the infinitive: espero que vengas.", grammar: g.subjunctive-wishes } }
      - { es: "Prefiero quedarme en casa.", en: "I prefer to stay at home.", grammar: [g.subjunctive-wishes], vocab: [w.preferir, w.quedarse], transform: { instruction: "Make the second verb refer to tú", answer: "Prefiero que te quedes en casa.", alt: ["Prefiero que tú te quedes en casa."] } }
  - id: b1.u01.l4
    title: Sea, esté, vaya, haya — los irregulares
    teach: [g.subjunctive-irregular]
    vocab: [w.empleo, w.paro, w.entrevista, w.curriculum, w.candidato, w.solicitar, w.solicitud, w.rechazar, w.aceptar, w.posibilidad, w.merecer, w.dedicarse, w.rendirse, w.renunciar, w.intentar, w.realidad, w.oposicion, w.funcionario, w.experiencia-laboral, w.preparar]
    tip: "Six verbs break the yo-form rule: ser → sea, estar → esté, ir → vaya, haber → haya, saber → sepa, dar → dé."
    sentences:
      - { es: "Espero que la entrevista sea por la mañana y no por la tarde.", en: "I hope the interview is in the morning and not in the afternoon.", grammar: [g.subjunctive-irregular], vocab: [w.entrevista, w.ser, w.esperar] }
      - { es: "Quiero que mi currículum esté listo antes del lunes.", en: "I want my CV to be ready before Monday.", grammar: [g.subjunctive-irregular], vocab: [w.curriculum, w.estar, w.listo] }
      - { es: "Ojalá haya muchas ofertas de empleo este otoño.", en: "I hope there are lots of job offers this autumn.", grammar: [g.subjunctive-irregular], vocab: [w.haber, w.empleo, w.oferta], note: "hay → haya." }
      - { es: "Es importante que los candidatos sepan hablar inglés.", en: "It's important that the candidates can speak English.", grammar: [g.subjunctive-irregular], vocab: [w.candidato, w.saber, w.ingles] }
      - { es: "Espero que me den una respuesta esta semana; he solicitado tres puestos.", en: "I hope they give me an answer this week; I've applied for three positions.", grammar: [g.subjunctive-irregular, g.present-perfect], vocab: [w.dar, w.respuesta, w.solicitar] }
      - { es: "Han rechazado mi solicitud, pero no quiero que esto sea el final.", en: "They've rejected my application, but I don't want this to be the end.", grammar: [g.subjunctive-irregular, g.present-perfect], vocab: [w.rechazar, w.solicitud, w.final] }
      - { es: "Después de dos años en el paro, por fin ha aceptado un empleo a media jornada.", en: "After two years unemployed, she has finally accepted a part-time job.", grammar: [g.present-perfect], vocab: [w.paro, w.aceptar, w.empleo, w.jornada], variant: "Latin America: desempleo rather than paro." }
      - { es: "Mi hermano quiere ser funcionario y está preparando oposiciones.", en: "My brother wants to be a civil servant and is preparing for the civil-service exams.", grammar: [g.estar-gerund], vocab: [w.funcionario, w.oposicion, w.preparar], note: "oposiciones: the competitive public exams for a permanent state job in Spain." }
      - { es: "¿A qué te dedicas? — Ahora estoy en el paro, pero espero que eso cambie pronto.", en: "What do you do for a living? — I'm unemployed at the moment, but I hope that changes soon.", grammar: [g.subjunctive-present-forms], vocab: [w.dedicarse, w.paro, w.cambiar] }
      - { es: "No te rindas: mereces ese puesto.", en: "Don't give up: you deserve that job.", grammar: [g.imperative-tu], vocab: [w.rendirse, w.merecer, w.puesto], note: "Negative commands use the subjunctive form (unit 4)." }
      - { es: "Existe la posibilidad de que no haya plazas este año.", en: "There's a chance there won't be any places this year.", grammar: [g.subjunctive-irregular], vocab: [w.posibilidad, w.haber, w.plaza] }
      - { es: "Quiero que sepáis que he renunciado a la oferta de Madrid.", en: "I want you to know that I've turned down the offer from Madrid.", grammar: [g.subjunctive-irregular, g.present-perfect], vocab: [w.saber, w.renunciar, w.oferta] }
      - { es: "Intentaré hacer realidad mi sueño, aunque sea difícil.", en: "I'll try to make my dream come true, even if it's hard.", grammar: [g.subjunctive-irregular, g.future-simple], vocab: [w.intentar, w.realidad, w.sueno, w.aunque] }
      - { es: "Piden dos años de experiencia laboral y que el candidato sepa alemán.", en: "They ask for two years of work experience and that the candidate knows German.", grammar: [g.subjunctive-irregular], vocab: [w.experiencia-laboral, w.candidato, w.aleman] }
      - { es: "Espero que la entrevista vaya bien y que no haya problemas.", en: "I hope the interview goes well and that there are no problems.", grammar: [g.subjunctive-irregular], vocab: [w.entrevista, w.ir, w.haber], error: { wrong: "Espero que la entrevista vaya bien y que no haiga problemas.", explain: "The subjunctive of haber is haya; haiga is a common non-standard form.", grammar: g.subjunctive-irregular } }
      - { es: "La reunión / ser / corta (ojalá)", en: "I hope the meeting is short.", grammar: [g.subjunctive-irregular], vocab: [w.reunion, w.ser, w.corto], transform: { instruction: "Make a wish with ojalá", answer: "Ojalá la reunión sea corta.", alt: ["Ojalá que la reunión sea corta."] } }
dialogues:
  - id: b1.u01.d1
    title: Propósitos de año nuevo
    context: Carla and Hugo, two old friends, share their hopes for the coming year at a New Year's Eve dinner.
    lines:
      - { speaker: Carla, es: "Bueno, Hugo, ya casi es año nuevo. ¿Cuáles son tus propósitos?", en: "Well, Hugo, it's almost New Year. What are your resolutions?" }
      - { speaker: Hugo, es: "Pues quiero cambiar de trabajo. Espero que este año me ofrezcan algo con contrato fijo.", en: "Well, I want to change jobs. I hope this year they offer me something with a permanent contract." }
      - { speaker: Carla, es: "Ojalá lo consigas. Te lo mereces, llevas años con contratos de tres meses.", en: "I hope you get it. You deserve it, you've been on three-month contracts for years." }
      - { speaker: Hugo, es: "Y tú, ¿qué deseas?", en: "And you, what do you wish for?" }
      - { speaker: Carla, es: "Quiero que mis padres estén bien de salud y que mi hermana apruebe las oposiciones. Lleva dos años estudiando.", en: "I want my parents to be in good health and my sister to pass her civil-service exams. She's been studying for two years." }
      - { speaker: Hugo, es: "Seguro que las aprueba. ¿Y para ti? ¿Nada?", en: "I'm sure she'll pass. And for yourself? Nothing?" }
      - { speaker: Carla, es: "Para mí, tranquilidad. Me hace ilusión independizarme, pero con el alquiler tan caro es difícil.", en: "For me, peace of mind. I'm excited about moving out, but with rent so expensive it's hard." }
      - { speaker: Hugo, es: "Es normal que tengas miedo. Pero no te rindas: a largo plazo vale la pena.", en: "It's normal to be afraid. But don't give up: in the long run it's worth it." }
      - { speaker: Carla, es: "Tienes razón. Venga, brindemos. ¡Que el año nuevo nos traiga salud, trabajo y un poco de suerte!", en: "You're right. Come on, let's toast. May the new year bring us health, work and a bit of luck!" }
      - { speaker: Hugo, es: "¡Y que tengamos tiempo para vernos más! ¡Salud!", en: "And may we have time to see each other more! Cheers!" }
    questions:
      - { q: "What does Hugo hope for this year?", options: ["A permanent contract", "A master's degree", "A new flat"], answer: 0 }
      - { q: "Why is it hard for Carla to move out?", options: ["Her parents are ill", "Rent is very expensive", "She is studying for exams"], answer: 1 }
