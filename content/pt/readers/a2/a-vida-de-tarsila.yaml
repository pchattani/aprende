id: r.a2.a-vida-de-tarsila
level: a2
title: A vida de Tarsila do Amaral
kind: text
intro: A short biography of Tarsila do Amaral, the painter from the state of São Paulo who became one of the symbols of Brazilian modern art.
allow: [buenos, aires, tarsila, amaral, capivari, abaporu, oswald, andrade, paris, europa, tupi, modernista, modernistas, antropofagia]
paragraphs:
  - { es: "Tarsila do Amaral nasceu em 1886, em Capivari, uma cidade pequena do interior de São Paulo. A família dela era rica e tinha fazendas de café. Quando era criança, Tarsila morava numa fazenda, brincava com os animais e olhava as cores do campo. Essas cores foram muito importantes na arte dela depois.", en: "Tarsila do Amaral was born in 1886 in Capivari, a small town in the interior of the state of São Paulo. Her family was rich and had coffee farms. As a child, Tarsila lived on a farm, played with the animals and looked at the colours of the countryside. Those colours were very important in her art later." }
  - { es: "Ela estudou em São Paulo e depois na Espanha. Começou a pintar ainda jovem. Em 1920, foi para Paris estudar arte. Lá, conheceu artistas de muitos países e aprendeu as ideias novas da arte moderna europeia.", en: "She studied in São Paulo and then in Spain. She started painting while still young. In 1920 she went to Paris to study art. There she met artists from many countries and learned the new ideas of European modern art." }
  - { es: "Em 1922, Tarsila voltou para o Brasil e conheceu um grupo de escritores e artistas modernistas de São Paulo. Eles queriam uma arte nova, com a cara do Brasil, e não uma cópia da arte europeia. Tarsila entrou no grupo e se casou com um deles, o escritor Oswald de Andrade.", en: "In 1922 Tarsila returned to Brazil and met a group of modernist writers and artists from São Paulo. They wanted a new art, with Brazil's own face, not a copy of European art. Tarsila joined the group and married one of them, the writer Oswald de Andrade." }
  - { es: "Em 1928, ela pintou o quadro mais famoso dela, o Abaporu, como presente de aniversário para o marido. O quadro mostra uma pessoa sentada, com um pé e uma mão enormes e uma cabeça muito pequena, ao lado de um cacto e de um sol amarelo. O nome vem da língua tupi e quer dizer «homem que come gente». O quadro foi o início de um movimento importante, a Antropofagia: a ideia era «comer» a cultura de fora e criar uma coisa brasileira.", en: "In 1928 she painted her most famous picture, Abaporu, as a birthday present for her husband. The painting shows a seated person, with an enormous foot and hand and a very small head, next to a cactus and a yellow sun. The name comes from the Tupi language and means 'man who eats people'. The painting was the beginning of an important movement, Anthropophagy: the idea was to 'eat' culture from outside and create something Brazilian." }
  - { es: "Depois, a vida de Tarsila ficou mais difícil. A família perdeu muito dinheiro em 1929, e ela teve que trabalhar para viver. Mesmo assim, nunca parou de pintar. Tarsila morreu em São Paulo em 1973. Hoje, os quadros dela estão em museus importantes do Brasil e do mundo. O Abaporu, por exemplo, está num museu em Buenos Aires, na Argentina.", en: "After that, Tarsila's life became harder. Her family lost a lot of money in 1929, and she had to work to make a living. Even so, she never stopped painting. Tarsila died in São Paulo in 1973. Today her paintings are in important museums in Brazil and around the world. Abaporu, for example, is in a museum in Buenos Aires, in Argentina." }
questions:
  - { q: "Onde Tarsila passou a infância?", options: ["Em Paris", "Numa fazenda no interior de São Paulo", "No centro de São Paulo"], answer: 1, explain: "She was born in Capivari and «quando era criança, Tarsila morava numa fazenda»." }
  - { q: "O que Tarsila fez em 1920?", options: ["Foi para Paris estudar arte", "Pintou o Abaporu", "Casou com Oswald de Andrade"], answer: 0, explain: "«Em 1920, foi para Paris estudar arte.»" }
  - { q: "O que os artistas modernistas queriam?", options: ["Copiar a arte europeia", "Uma arte nova, com a cara do Brasil", "Morar em Paris"], answer: 1, explain: "«Eles queriam uma arte nova, com a cara do Brasil, e não uma cópia da arte europeia.»" }
  - { q: "Para quem Tarsila pintou o Abaporu?", options: ["Para um museu", "Para a mãe dela", "Para o marido"], answer: 2, explain: "She painted it «como presente de aniversário para o marido», Oswald de Andrade." }
  - { q: "O que quer dizer «Abaporu»?", options: ["Sol amarelo", "Homem que come gente", "Arte do Brasil"], answer: 1, explain: "The Tupi name «quer dizer \"homem que come gente\"»." }
