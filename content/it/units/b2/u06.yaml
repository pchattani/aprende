id: b2.u06
title: "Me ne vado!"
lessons:
  - id: b2.u06.l1
    title: Non prendertela!
    teach: [g.pronominal-verbs]
    vocab: [w.prendersela, w.avercela, w.entrarci, w.sentirsela, w.smetterla, w.piantarla, w.fregarsene, w.rompere-le-scatole, w.rompiscatole, w.scocciare, w.scocciatura, w.seccare, w.seccante, w.aliscafo]
    tip: "Some verbs carry fixed pronouns that change their meaning: andarsene (me ne vado), prendersela (me la prendo), avercela con (ce l'ho con te), entrarci (non c'entro). The participle agrees with la: se l'è presa, ce l'ho fatta."
    sentences:
      - { es: "È tardi, me ne vado: l'ultimo traghetto per Napoli parte alle otto.", en: "It's late, I'm off: the last ferry to Naples leaves at eight.", altEs: ["È tardi, me ne vado, perché l'ultimo traghetto per Napoli parte alle otto."], grammar: [g.pronominal-verbs], vocab: [w.andarsene, w.traghetto] }
      - { es: "Non prendertela, stavo scherzando!", en: "Don't get upset, I was joking!", altEs: ["Non te la prendere, stavo scherzando!", "Dai, non prendertela: scherzavo!"], grammar: [g.pronominal-verbs, g.imperativo-negative], vocab: [w.prendersela, w.scherzare] }
      - { es: "Se l'è presa perché non l'abbiamo invitata alla festa.", en: "She got upset because we didn't invite her to the party.", altEs: ["Se l'è presa perché non l'abbiamo invitato alla festa."], altEn: ["He got upset because we didn't invite him to the party."], grammar: [g.pronominal-verbs, g.pronoun-participle-agreement], vocab: [w.prendersela, w.invitare] }
      - { es: "Ce l'hai ancora con me per ieri sera?", en: "Are you still angry with me about last night?", altEs: ["Ce l'hai ancora con me per ieri?"], grammar: [g.pronominal-verbs], vocab: [w.avercela] }
      - { es: "Io non c'entro niente: è stato il gatto!", en: "It's nothing to do with me: it was the cat!", altEs: ["Io non c'entro: è stato il gatto!"], grammar: [g.pronominal-verbs], vocab: [w.entrarci, w.gatto] }
      - { es: "Non me la sento di guidare il motorino con questa pioggia.", en: "I don't feel up to riding the moped in this rain.", altEs: ["Con questa pioggia non me la sento di guidare il motorino."], grammar: [g.pronominal-verbs], vocab: [w.sentirsela, w.motorino] }
      - { es: "Smettila di lamentarti: siamo in vacanza a Procida!", en: "Stop complaining: we're on holiday in Procida!", altEs: ["Smettila di lamentarti, siamo in vacanza a Procida!"], grammar: [g.pronominal-verbs, g.imperativo-pronouns], vocab: [w.smetterla, w.lamentarsi] }
      - { es: "Piantala con queste domande!", en: "Cut it out with these questions!", altEs: ["Smettila con queste domande!"], grammar: [g.pronominal-verbs, g.colloquial-italian], vocab: [w.piantarla, w.domanda], note: "Piantarla is informal: use it only with friends." }
      - { es: "Mio fratello se ne frega di tutto, tranne che del calcio.", en: "My brother doesn't care about anything, except football.", altEs: ["Mio fratello se ne frega di tutto, a parte il calcio."], grammar: [g.pronominal-verbs, g.colloquial-italian], vocab: [w.fregarsene, w.calcio], note: "Fregarsene is informal; a neutral equivalent is non importare: non gli importa niente." }
      - { es: "Il vicino mi rompe le scatole ogni mattina con i suoi lavori.", en: "My neighbour drives me up the wall every morning with his building work.", altEs: ["Il vicino ogni mattina mi rompe le scatole con i suoi lavori."], grammar: [g.colloquial-italian], vocab: [w.rompere-le-scatole, w.vicino.n] }
      - { es: "Che rompiscatole! Mi chiama dieci volte al giorno.", en: "What a pain in the neck! He calls me ten times a day.", altEs: ["Che rompiscatole: mi chiama dieci volte al giorno!"], grammar: [g.colloquial-italian], vocab: [w.rompiscatole, w.chiamare] }
      - { es: "Mi scoccia ammetterlo, ma avevi ragione tu.", en: "I hate to admit it, but you were right.", altEs: ["Mi secca ammetterlo, ma avevi ragione tu."], grammar: [g.piacere-intro, g.direct-object-pronouns], vocab: [w.scocciare, w.ammettere, w.seccare] }
      - { es: "Che scocciatura: hanno cancellato l'aliscafo e dobbiamo aspettare due ore!", en: "What a nuisance: they've cancelled the hydrofoil and we have to wait two hours!", altEs: ["Che scocciatura! Hanno cancellato l'aliscafo e dobbiamo aspettare due ore."], grammar: [g.passato-prossimo-avere], vocab: [w.scocciatura, w.cancellare, w.aliscafo] }
      - { es: "Ce l'abbiamo fatta: abbiamo preso il traghetto al volo!", en: "We made it: we caught the ferry just in time!", altEs: ["Ce l'abbiamo fatta, abbiamo preso il traghetto al volo!"], grammar: [g.pronominal-verbs], vocab: [w.farcela, w.traghetto], error: { wrong: "Ce l'abbiamo fatto: abbiamo preso il traghetto al volo!", explain: "In farcela the participle agrees with la: ce l'abbiamo fatta.", grammar: g.pronominal-verbs } }
      - { es: "Siamo andati via senza salutare.", en: "We left without saying goodbye.", altEs: ["Siamo andate via senza salutare."], grammar: [g.passato-prossimo-essere], vocab: [w.salutare], transform: { instruction: "Use andarsene in the passato prossimo", answer: "Ce ne siamo andati senza salutare.", alt: ["Ce ne siamo andate senza salutare."], en: "We left without saying goodbye." } }
      - { es: "Si è offesa per quello che ho detto.", en: "She was offended by what I said.", altEs: ["Si è offeso per quello che ho detto."], grammar: [g.reflexive-passato-prossimo], vocab: [w.offendere], transform: { instruction: "Use prendersela in the passato prossimo", answer: "Se l'è presa per quello che ho detto.", alt: ["Se l'è presa per quello che le ho detto."], en: "She got upset about what I said." } }
    exchanges:
      - q: { es: "Perché Marco non ti parla?", en: "Why isn't Marco speaking to you?" }
        a: { es: "Ce l'ha con me perché ho dimenticato il suo compleanno.", en: "He's angry with me because I forgot his birthday." }
        alt: ["Ce l'ha con me.", "Se l'è presa per il suo compleanno."]
        grammar: [g.pronominal-verbs]
        vocab: [w.avercela, w.compleanno]
      - q: { es: "Vieni a fare il bagno?", en: "Are you coming for a swim?" }
        a: { es: "No, non me la sento: l'acqua è troppo fredda.", en: "No, I don't feel up to it: the water's too cold." }
        alt: ["Non me la sento.", "Sì, arrivo!"]
        grammar: [g.pronominal-verbs]
        vocab: [w.sentirsela, w.freddo]
      - q: { es: "Che c'entra Luca con questa storia?", en: "What's Luca got to do with this?" }
        a: { es: "Non c'entra niente, ma tutti se la prendono con lui.", en: "Nothing at all, but everyone takes it out on him." }
        alt: ["Niente.", "Non c'entra, poveretto."]
        grammar: [g.pronominal-verbs]
        vocab: [w.entrarci, w.prendersela]
      - q: { es: "Hai sentito il vicino stamattina?", en: "Did you hear the neighbour this morning?" }
        a: { es: "Sì, che rompiscatole! È davvero seccante.", en: "Yes, what a pain! It's really annoying." }
        alt: ["Sì, mi ha rotto le scatole per un'ora.", "Sì, che scocciatura!"]
        grammar: [g.colloquial-italian]
        vocab: [w.rompiscatole, w.seccante]
      - q: { es: "Ti va un altro giro in barca?", en: "Do you fancy another boat trip?" }
        a: { es: "No, grazie, me ne vado a casa: sono stanco morto.", en: "No thanks, I'm off home: I'm dead tired." }
        alt: ["No, me ne vado.", "Volentieri!"]
        grammar: [g.pronominal-verbs]
        vocab: [w.andarsene, w.stanco]
    texts:
      - title: "Biglietto sul frigorifero"
        es: ["Smettila di lasciare i piatti sporchi nel lavandino!", "Non me la prendo, ma è la terza volta questa settimana.", "Se continui così, me ne vado e ti lascio il gatto."]
        en: ["Stop leaving dirty dishes in the sink!", "I'm not getting upset, but it's the third time this week.", "If you carry on like this, I'm leaving and I'll leave you the cat."]
        grammar: [g.pronominal-verbs]
        vocab: [w.smetterla, w.prendersela, w.andarsene]
      - title: "Chat tra amiche"
        es: ["Ce l'hai ancora con Paolo?", "No, ormai me ne frego: chi se la prende vive peggio.", "Brava, piantala di pensarci e vieni al mare!"]
        en: ["Are you still angry with Paolo?", "No, I don't care any more: people who get upset live worse lives.", "Good for you, stop thinking about it and come to the beach!"]
        grammar: [g.pronominal-verbs, g.colloquial-italian]
        vocab: [w.avercela, w.fregarsene, w.piantarla]
    spicy:
      - { es: "Non prendertela, ma ballo meglio io.", en: "Don't take it badly, but I dance better.", altEs: ["Non te la prendere, ma ballo meglio io."], grammar: [g.pronominal-verbs], vocab: [w.prendersela, w.ballare] }
      - { es: "Me ne vado... a meno che tu non mi offra un altro limoncello.", en: "I'm off... unless you offer me another limoncello.", altEs: ["Me ne vado, a meno che tu non mi offra un altro limoncello."], grammar: [g.pronominal-verbs, g.congiuntivo-conjunctions], vocab: [w.andarsene, w.offrire] }
      - { es: "Ce l'hai con me o è solo il tuo modo di flirtare?", en: "Are you angry with me or is it just your way of flirting?", altEs: ["Ce l'hai con me, o è solo il tuo modo di flirtare?"], grammar: [g.pronominal-verbs], vocab: [w.avercela, w.flirtare] }
      - { es: "Smettila di guardarmi così, o non me la sento più di andarmene.", en: "Stop looking at me like that, or I won't feel up to leaving any more.", altEs: ["Smettila di guardarmi così, altrimenti non me la sento più di andarmene."], grammar: [g.pronominal-verbs], vocab: [w.smetterla, w.sentirsela] }
      - { es: "Che scocciatura: ogni volta che ti bacio, il tuo cane si mette in mezzo.", en: "What a nuisance: every time I kiss you, your dog gets in the way.", altEs: ["Che scocciatura: ogni volta che ti bacio, il tuo cane si mette in mezzo!"], grammar: [g.reflexive-present], vocab: [w.scocciatura, w.baciare, w.cane] }
  - id: b2.u06.l2
    title: Godiamocela!
    teach: [g.pronominal-verbs]
    vocab: [w.godersela, w.passarsela, w.aspettarsela, w.filarsela, w.darsela-a-gambe, w.arrangiarsi, w.sbrogliarsela, w.godere]
    tip: "More everyday pronominal verbs: godersela (enjoy it), passarsela (get on), aspettarsela (expect it), filarsela (slip away), darsela a gambe (run for it), sbrogliarsela (sort it out). Ci vuole / ci vogliono = it takes (time); ci metto = I take."
    sentences:
      - { es: "Siamo in vacanza: godiamocela!", en: "We're on holiday: let's enjoy it!", altEs: ["Siamo in vacanza, godiamocela!"], grammar: [g.pronominal-verbs, g.imperativo-pronouns], vocab: [w.godersela, w.vacanza] }
      - { es: "Come te la passi? — Benone, me la godo a Procida.", en: "How are you getting on? — Really well, I'm enjoying myself in Procida.", altEs: ["Come te la passi? — Benissimo, me la godo a Procida."], grammar: [g.pronominal-verbs], vocab: [w.passarsela, w.godersela] }
      - { es: "Non me l'aspettavo: Procida è ancora più colorata che nelle foto.", en: "I wasn't expecting it: Procida is even more colourful than in the photos.", altEs: ["Non me lo aspettavo: Procida è ancora più colorata che nelle foto."], grammar: [g.pronominal-verbs, g.comparatives], vocab: [w.aspettarsela, w.colorato] }
      - { es: "Alla fine della cena se l'è filata senza pagare.", en: "At the end of dinner he slipped away without paying.", altEs: ["A fine cena se l'è filata senza pagare."], grammar: [g.pronominal-verbs, g.pronoun-participle-agreement], vocab: [w.filarsela, w.pagare] }
      - { es: "Quando ha visto il cane del pescatore, se l'è data a gambe.", en: "When he saw the fisherman's dog, he took to his heels.", altEs: ["Appena ha visto il cane del pescatore, se l'è data a gambe."], grammar: [g.pronominal-verbs, g.pronoun-participle-agreement], vocab: [w.darsela-a-gambe, w.pescatore] }
      - { es: "Non c'è l'autobus? Ci arrangiamo con le bici.", en: "No bus? We'll make do with the bikes.", altEs: ["Non c'è l'autobus? Ci arrangiamo con la bici."], grammar: [g.reflexive-present], vocab: [w.arrangiarsi, w.bici] }
      - { es: "Il motorino si è rotto, ma ce la siamo sbrogliata da soli.", en: "The moped broke down, but we sorted it out ourselves.", altEs: ["Il motorino si è rotto, ma ce la siamo cavata da soli."], grammar: [g.pronominal-verbs], vocab: [w.sbrogliarsela, w.rompere] }
      - { es: "Con l'italiano me la cavo, ma il dialetto di Procida non lo capisco proprio.", en: "I get by in Italian, but I really can't understand the Procida dialect.", altEs: ["Con l'italiano me la cavo, però il dialetto di Procida non lo capisco proprio."], grammar: [g.pronominal-verbs, g.dislocation], vocab: [w.cavarsela, w.dialetto] }
      - { es: "Ci vuole circa mezz'ora di traghetto da Pozzuoli.", en: "It takes about half an hour by ferry from Pozzuoli.", altEs: ["Da Pozzuoli ci vuole circa mezz'ora di traghetto."], grammar: [g.metterci-volerci], vocab: [w.volerci, w.traghetto] }
      - { es: "Quanto ci metti a piedi fino alla Corricella?", en: "How long does it take you to walk to the Corricella?", altEs: ["Quanto ci metti ad arrivare a piedi alla Corricella?"], grammar: [g.metterci-volerci], vocab: [w.metterci] }
      - { es: "Ce ne siamo andati dalla spiaggia solo al tramonto.", en: "We only left the beach at sunset.", altEs: ["Ce ne siamo andate dalla spiaggia solo al tramonto."], grammar: [g.pronominal-verbs], vocab: [w.andarsene, w.spiaggia] }
      - { es: "Me la sono goduta davvero, questa vacanza.", en: "I really enjoyed this holiday.", altEs: ["Questa vacanza me la sono goduta davvero."], grammar: [g.pronominal-verbs, g.dislocation], vocab: [w.godersela] }
      - { es: "Se ne intende di barche: suo padre era pescatore.", en: "He knows a lot about boats: his father was a fisherman.", altEs: ["Se ne intende di barche, perché suo padre era pescatore."], grammar: [g.pronominal-verbs], vocab: [w.barca, w.pescatore] }
      - { es: "Me la sono cavata bene all'esame.", en: "I got through the exam well.", altEs: ["All'esame me la sono cavata bene."], grammar: [g.pronominal-verbs], vocab: [w.cavarsela, w.esame], error: { wrong: "Me la sono cavato bene all'esame.", explain: "With cavarsela the participle agrees with la, not with the subject: me la sono cavata.", grammar: g.pronominal-verbs } }
      - { es: "Quando hanno visto la polizia, sono scappati.", en: "When they saw the police, they ran off.", grammar: [g.passato-prossimo-essere], vocab: [w.scappare], transform: { instruction: "Replace sono scappati with darsela a gambe", answer: "Quando hanno visto la polizia, se la sono data a gambe.", alt: ["Appena hanno visto la polizia, se la sono data a gambe."], en: "When they saw the police, they took to their heels." } }
      - { es: "Ce la godiamo.", en: "We're enjoying it.", grammar: [g.pronominal-verbs], vocab: [w.godersela], transform: { instruction: "Put it in the passato prossimo", answer: "Ce la siamo goduta.", alt: ["Ce la siamo goduta davvero."], en: "We enjoyed it." } }
    exchanges:
      - q: { es: "Come te la passi?", en: "How are you getting on?" }
        a: { es: "Non c'è male, me la cavo.", en: "Not bad, I'm getting by." }
        alt: ["Benone!", "Me la passo bene, grazie."]
        grammar: [g.pronominal-verbs]
        vocab: [w.passarsela, w.cavarsela]
      - q: { es: "Te l'aspettavi così bella, Procida?", en: "Did you expect Procida to be so beautiful?" }
        a: { es: "No, non me l'aspettavo: pensavo che fosse un'isola come tante.", en: "No, I wasn't expecting it: I thought it was just another island." }
        alt: ["Per niente!", "Sì, me l'aspettavo: me ne avevano parlato tutti."]
        grammar: [g.pronominal-verbs, g.concordanza-congiuntivo]
        vocab: [w.aspettarsela, w.isola]
      - q: { es: "Dov'è finito Gigi?", en: "Where's Gigi got to?" }
        a: { es: "Se l'è filata appena è arrivato il conto!", en: "He slipped away as soon as the bill came!" }
        alt: ["Se l'è filata.", "Se n'è andato dieci minuti fa."]
        grammar: [g.pronominal-verbs]
        vocab: [w.filarsela, w.conto]
      - q: { es: "Come facciamo senza macchina?", en: "How will we manage without a car?" }
        a: { es: "Ci arrangiamo: l'isola è piccola e si gira bene a piedi.", en: "We'll make do: the island is small and easy to get round on foot." }
        alt: ["Ci arrangiamo.", "Prendiamo l'autobus o la bici."]
        grammar: [g.reflexive-present, g.si-impersonale]
        vocab: [w.arrangiarsi, w.macchina]
      - q: { es: "Quanto ci vuole da Napoli?", en: "How long does it take from Naples?" }
        a: { es: "Con l'aliscafo ci vogliono circa quaranta minuti.", en: "By hydrofoil it takes about forty minutes." }
        alt: ["Circa quaranta minuti.", "Un'ora con il traghetto."]
        grammar: [g.metterci-volerci]
        vocab: [w.volerci]
    texts:
      - title: "Un weekend a Procida"
        es: ["Ce la siamo goduta dall'inizio alla fine.", "Il motorino si è rotto il secondo giorno, ma ce la siamo sbrogliata.", "Non ce l'aspettavamo, ma è stato il weekend più bello dell'anno."]
        en: ["We enjoyed it from start to finish.", "The moped broke down on the second day, but we sorted it out.", "We weren't expecting it, but it was the best weekend of the year."]
        grammar: [g.pronominal-verbs]
        vocab: [w.godersela, w.sbrogliarsela, w.aspettarsela]
      - title: "Il gatto della Corricella"
        es: ["Ogni mattina un gatto rosso aspetta le barche dei pescatori.", "Appena arriva il pesce, si avvicina con aria innocente.", "Se qualcuno lo guarda male, se la dà a gambe con una sardina in bocca."]
        en: ["Every morning a ginger cat waits for the fishermen's boats.", "As soon as the fish arrives, it comes closer looking innocent.", "If anyone gives it a dirty look, it runs off with a sardine in its mouth."]
        grammar: [g.pronominal-verbs]
        vocab: [w.darsela-a-gambe, w.pescatore, w.gatto]
    spicy:
      - { es: "Stasera godiamocela: niente telefoni, solo noi e la Corricella.", en: "Tonight let's enjoy it: no phones, just us and the Corricella.", altEs: ["Stasera godiamocela: niente telefoni, solo noi due e la Corricella."], grammar: [g.pronominal-verbs], vocab: [w.godersela] }
      - { es: "Quando mia madre ti ha chiesto le tue intenzioni, te la sei data a gambe.", en: "When my mother asked you about your intentions, you ran for it.", altEs: ["Appena mia madre ti ha chiesto le tue intenzioni, te la sei data a gambe."], grammar: [g.pronominal-verbs], vocab: [w.darsela-a-gambe, w.intenzione] }
      - { es: "Non me l'aspettavo: un bacio prima ancora dell'antipasto!", en: "I wasn't expecting that: a kiss before the starter, even!", altEs: ["Non me l'aspettavo: un bacio ancora prima dell'antipasto!"], grammar: [g.pronominal-verbs], vocab: [w.aspettarsela, w.bacio, w.antipasto] }
      - { es: "Te la sei filata dalla festa per venire da me? Che onore!", en: "You slipped away from the party to come and see me? What an honour!", altEs: ["Te la sei filata dalla festa per stare con me? Che onore!"], grammar: [g.pronominal-verbs], vocab: [w.filarsela, w.onore] }
      - { es: "Con il napoletano me la cavo; con te, invece, perdo tutte le parole.", en: "I get by in Neapolitan; with you, on the other hand, I lose all my words.", altEs: ["Con il napoletano me la cavo, ma con te perdo tutte le parole."], grammar: [g.pronominal-verbs], vocab: [w.cavarsela, w.parola] }
  - id: b2.u06.l3
    title: Devo far riparare il motorino
    teach: [g.fare-causative]
    vocab: [w.riparare, w.aggiustare, w.tecnico, w.gommista, w.far-vedere, w.bucare, w.gomma, w.far-sapere, w.riparazione, w.installare, w.montare, w.smontare, w.sostituire, w.preventivo, w.officina, w.revisione, w.tagliando, w.carrozzeria, w.manutenzione]
    tip: "fare + infinitive = have something done or make someone do something: faccio riparare la macchina. Pronouns go before fare (lo faccio riparare) or attach to it in the imperative and infinitive (fammi sapere, devo farlo vedere)."
    sentences:
      - { es: "Devo far riparare il motorino prima di domenica.", en: "I need to get the moped repaired before Sunday.", altEs: ["Prima di domenica devo far riparare il motorino."], grammar: [g.fare-causative], vocab: [w.riparare, w.motorino] }
      - { es: "Ho fatto aggiustare la lavatrice da un tecnico.", en: "I had the washing machine fixed by a technician.", altEs: ["Ho fatto riparare la lavatrice da un tecnico."], grammar: [g.fare-causative], vocab: [w.aggiustare, w.tecnico, w.lavatrice] }
      - { es: "Il gommista mi ha fatto vedere dov'era bucata la gomma.", en: "The tyre man showed me where the tyre was punctured.", altEs: ["Il gommista mi ha mostrato dov'era bucata la gomma."], grammar: [g.fare-causative], vocab: [w.gommista, w.far-vedere, w.bucare, w.gomma] }
      - { es: "Fammi sapere quanto costa la riparazione.", en: "Let me know how much the repair costs.", altEs: ["Fammi sapere quanto viene la riparazione.", "Mi faccia sapere quanto costa la riparazione."], grammar: [g.fare-causative, g.imperativo-short-forms], vocab: [w.far-sapere, w.riparazione] }
      - { es: "Ci siamo fatti installare una doccia nuova.", en: "We had a new shower installed.", altEs: ["Abbiamo fatto installare una doccia nuova."], grammar: [g.fare-causative], vocab: [w.installare, w.doccia] }
      - { es: "Sabato faccio montare la cucina nuova.", en: "On Saturday I'm having the new kitchen put in.", altEs: ["Faccio montare la cucina nuova sabato."], grammar: [g.fare-causative, g.present-for-future], vocab: [w.montare, w.cucina] }
      - { es: "Per portarlo sul traghetto, abbiamo fatto smontare il letto.", en: "To take it on the ferry, we had the bed taken apart.", altEs: ["Abbiamo fatto smontare il letto per portarlo sul traghetto."], grammar: [g.fare-causative], vocab: [w.smontare, w.letto] }
      - { es: "Ho fatto sostituire tutte le finestre della casa.", en: "I had all the windows in the house replaced.", altEs: ["Ho fatto cambiare tutte le finestre della casa."], grammar: [g.fare-causative], vocab: [w.sostituire, w.finestra] }
      - { es: "Prima di firmare, fatti fare un preventivo.", en: "Before you sign, get yourself a quote.", altEs: ["Prima di firmare, fatti fare un preventivo scritto."], grammar: [g.fare-causative, g.imperativo-pronouns], vocab: [w.preventivo, w.firmare] }
      - { es: "L'officina mi ha fatto pagare trecento euro per la revisione.", en: "The garage charged me three hundred euros for the MOT.", altEs: ["In officina mi hanno fatto pagare trecento euro per la revisione."], grammar: [g.fare-causative], vocab: [w.officina, w.revisione] }
      - { es: "Ho fatto fare il tagliando alla macchina.", en: "I had the car serviced.", altEs: ["Ho portato la macchina a fare il tagliando."], grammar: [g.fare-causative], vocab: [w.tagliando, w.macchina] }
      - { es: "Dopo l'incidente ho fatto sistemare la portiera in carrozzeria.", en: "After the accident I had the door fixed at the body shop.", altEs: ["Dopo l'incidente ho fatto aggiustare la portiera in carrozzeria."], grammar: [g.fare-causative], vocab: [w.carrozzeria, w.incidente] }
      - { es: "Quel film mi ha fatto ridere fino alle lacrime.", en: "That film made me laugh till I cried.", altEs: ["Quel film mi ha fatto ridere fino a piangere."], grammar: [g.fare-causative], vocab: [w.ridere, w.film] }
      - { es: "Lo faccio riparare domani.", en: "I'll have it repaired tomorrow.", altEs: ["Domani lo faccio riparare."], grammar: [g.fare-causative, g.direct-object-pronouns], vocab: [w.riparare], error: { wrong: "Faccio ripararlo domani.", explain: "With fare + infinitive, the pronoun goes before fare (or attaches to fare), never to the infinitive: lo faccio riparare.", grammar: g.fare-causative } }
      - { es: "Il meccanico ripara la macchina.", en: "The mechanic repairs the car.", grammar: [g.present-are], vocab: [w.meccanico, w.riparare], transform: { instruction: "Say you're having it done: Faccio…", answer: "Faccio riparare la macchina dal meccanico.", alt: ["Faccio riparare la macchina al meccanico.", "Faccio riparare la macchina."], en: "I'm having the car repaired by the mechanic." } }
      - { es: "Il tecnico controllerà la caldaia ogni anno.", en: "The technician will check the boiler every year.", grammar: [g.futuro-semplice], vocab: [w.tecnico, w.manutenzione], transform: { instruction: "Say you will have it done: Farò…", answer: "Farò controllare la caldaia ogni anno.", alt: ["Ogni anno farò controllare la caldaia.", "Farò controllare la caldaia dal tecnico ogni anno."], en: "I'll have the boiler checked every year." } }
    exchanges:
      - q: { es: "Che cos'ha la tua bici?", en: "What's wrong with your bike?" }
        a: { es: "Ho bucato una gomma: domani la faccio riparare.", en: "I've got a puncture: I'll get it repaired tomorrow." }
        alt: ["Ho bucato.", "Ha una gomma bucata."]
        grammar: [g.fare-causative]
        vocab: [w.bucare, w.gomma]
      - q: { es: "Quanto ti hanno chiesto per la riparazione?", en: "How much did they ask for the repair?" }
        a: { es: "Non lo so ancora: mi faranno sapere domani.", en: "I don't know yet: they'll let me know tomorrow." }
        alt: ["Mi faranno sapere.", "Duecento euro, purtroppo."]
        grammar: [g.fare-causative]
        vocab: [w.riparazione, w.far-sapere]
      - q: { es: "Mi fai vedere le foto della casa di Procida?", en: "Will you show me the photos of the house in Procida?" }
        a: { es: "Certo, te le faccio vedere subito.", en: "Of course, I'll show you them right away." }
        alt: ["Certo, eccole.", "Te le faccio vedere stasera."]
        grammar: [g.fare-causative, g.combined-pronouns]
        vocab: [w.far-vedere, w.foto]
      - q: { es: "Hai fatto la revisione della macchina?", en: "Have you had the car's MOT done?" }
        a: { es: "Sì, l'ho fatta fare la settimana scorsa all'officina del porto.", en: "Yes, I had it done last week at the garage by the port." }
        alt: ["Sì, l'ho fatta fare.", "No, devo ancora farla fare."]
        grammar: [g.fare-causative, g.pronoun-participle-agreement]
        vocab: [w.revisione, w.officina]
      - q: { es: "Ogni quanto va fatta la manutenzione della barca?", en: "How often does the boat need servicing?" }
        a: { es: "Una volta all'anno: io la faccio fare d'inverno, quando non esco a pescare.", en: "Once a year: I have it done in winter, when I don't go out fishing." }
        alt: ["Una volta all'anno.", "Ogni inverno."]
        grammar: [g.fare-causative, g.passive-andare]
        vocab: [w.manutenzione, w.barca]
    texts:
      - title: "Messaggio al padrone di casa"
        es: ["Gentile signor Esposito, lo scaldabagno non funziona di nuovo.", "Potrebbe farlo controllare da un tecnico?", "Mi faccia sapere quando può venire."]
        en: ["Dear Mr Esposito, the water heater isn't working again.", "Could you have it checked by a technician?", "Let me know when you can come."]
        grammar: [g.fare-causative, g.lei-forms]
        vocab: [w.tecnico, w.far-sapere]
      - title: "Cartello dell'officina"
        es: ["Riparazioni auto e moto.", "Tagliando, revisione e cambio gomme su appuntamento.", "Preventivi gratuiti: fatevi fare un prezzo prima di decidere!"]
        en: ["Car and motorbike repairs.", "Servicing, MOT and tyre changes by appointment.", "Free quotes: get a price before you decide!"]
        grammar: [g.fare-causative]
        vocab: [w.tagliando, w.preventivo, w.gratuito]
    spicy:
      - { es: "Mi hai fatto ridere per tutta la cena: il cameriere pensava che fossimo pazzi.", en: "You made me laugh all through dinner: the waiter thought we were mad.", altEs: ["Mi hai fatto ridere tutta la cena: il cameriere pensava che fossimo pazzi."], grammar: [g.fare-causative, g.congiuntivo-imperfetto], vocab: [w.ridere, w.cameriere] }
      - { es: "Fammi vedere quel sorriso un'altra volta.", en: "Show me that smile one more time.", altEs: ["Fammi vedere ancora quel sorriso."], grammar: [g.fare-causative, g.imperativo-short-forms], vocab: [w.far-vedere] }
      - { es: "Mi hai fatto aspettare un'ora, ma ne è valsa la pena.", en: "You kept me waiting an hour, but it was worth it.", altEs: ["Mi hai fatto aspettare un'ora, però ne è valsa la pena."], grammar: [g.fare-causative], vocab: [w.aspettare, w.valere] }
      - { es: "Fammi sapere quando smetti di essere così affascinante, così finalmente mi concentro.", en: "Let me know when you stop being so charming, so I can finally concentrate.", altEs: ["Fammi sapere quando smetti di essere così affascinante: così finalmente mi concentro."], grammar: [g.fare-causative], vocab: [w.far-sapere] }
      - { es: "Ho fatto riparare il motorino solo per poterti accompagnare a casa.", en: "I had the moped fixed just so I could take you home.", altEs: ["Ho fatto aggiustare il motorino solo per poterti accompagnare a casa."], grammar: [g.fare-causative], vocab: [w.riparare, w.accompagnare] }
  - id: b2.u06.l4
    title: Lasciami parlare!
    teach: [g.lasciare-infinitive, g.fare-causative]
    vocab: [w.lasciar-perdere, w.lasciare-stare, w.lasciare-fare, w.farsi-fare, w.tagliarsi-i-capelli, w.sarto, w.accorciare, w.allargare, w.costringere, w.obbligare, w.convincere-a, w.tingere, w.estetista, w.piega, w.stringere, w.allungare, w.taglio, w.tinta, w.manica, w.ballo]
    tip: "lasciare + infinitive = let someone do something: lasciami parlare, non mi lasciavano uscire. Lascia perdere / lascia stare = forget it. Farsi + infinitive = have something done for yourself: mi sono fatta tagliare i capelli."
    sentences:
      - { es: "Mi sono fatta tagliare i capelli da una parrucchiera di Procida.", en: "I had my hair cut by a hairdresser in Procida.", altEs: ["Mi sono fatto tagliare i capelli da un parrucchiere di Procida."], grammar: [g.fare-causative], vocab: [w.farsi-fare, w.tagliarsi-i-capelli, w.parrucchiere] }
      - { es: "Devo farmi accorciare i pantaloni dal sarto.", en: "I need to have my trousers shortened by the tailor.", altEs: ["Devo far accorciare i pantaloni dal sarto."], grammar: [g.fare-causative], vocab: [w.sarto, w.accorciare, w.pantaloni] }
      - { es: "Il sarto mi ha detto di lasciargli la gonna fino a giovedì per allargarla.", en: "The tailor told me to leave the skirt with him until Thursday so he can let it out.", altEs: ["La sarta mi ha detto di lasciarle la gonna fino a giovedì per allargarla."], grammar: [g.reported-commands-di, g.indirect-object-pronouns], vocab: [w.allargare, w.gonna] }
      - { es: "Lasciami parlare!", en: "Let me speak!", altEs: ["Fammi parlare!", "Lasciatemi parlare!"], grammar: [g.lasciare-infinitive, g.imperativo-pronouns], vocab: [w.lasciare, w.parlare] }
      - { es: "I miei genitori non mi lasciavano uscire la sera.", en: "My parents didn't let me go out in the evening.", altEs: ["I miei non mi lasciavano uscire la sera."], grammar: [g.lasciare-infinitive, g.imperfetto-uses], vocab: [w.lasciare, w.uscire] }
      - { es: "Lascia perdere, non ne vale la pena.", en: "Forget it, it's not worth it.", altEs: ["Lascia stare, non ne vale la pena.", "Lascia perdere: non vale la pena."], grammar: [g.lasciare-infinitive], vocab: [w.lasciar-perdere, w.valere] }
      - { es: "Lasciami stare, sono stanco morto.", en: "Leave me alone, I'm dead tired.", altEs: ["Lasciami stare, sono stanca morta."], grammar: [g.lasciare-infinitive], vocab: [w.lasciare-stare, w.stanco] }
      - { es: "Lascia fare a me: so io come convincerlo.", en: "Leave it to me: I know how to convince him.", altEs: ["Lascia fare a me, so io come convincerlo."], grammar: [g.lasciare-infinitive], vocab: [w.lasciare-fare, w.convincere] }
      - { es: "Mi hanno costretto a pagare il doppio per il biglietto.", en: "They forced me to pay double for the ticket.", altEs: ["Mi hanno costretta a pagare il doppio per il biglietto."], grammar: [g.verbs-with-prepositions], vocab: [w.costringere, w.biglietto] }
      - { es: "Nessuno ti obbliga a venire alla festa.", en: "Nobody's forcing you to come to the party.", altEs: ["Nessuno ti obbliga a venire alla festa, eh."], grammar: [g.verbs-with-prepositions], vocab: [w.obbligare, w.festa] }
      - { es: "L'ho convinta a farsi tingere i capelli di rosso.", en: "I persuaded her to have her hair dyed red.", altEs: ["L'ho convinto a farsi tingere i capelli di rosso."], grammar: [g.fare-causative, g.verbs-with-prepositions], vocab: [w.convincere-a, w.tingere] }
      - { es: "Dal parrucchiere mi sono fatta fare la piega, dall'estetista la manicure.", en: "At the hairdresser's I had a blow-dry, at the beautician's a manicure.", altEs: ["Mi sono fatta fare la piega dal parrucchiere e la manicure dall'estetista."], grammar: [g.fare-causative], vocab: [w.piega, w.estetista] }
      - { es: "Il sarto ha stretto la giacca e allungato le maniche.", en: "The tailor took in the jacket and lengthened the sleeves.", altEs: ["La sarta ha stretto la giacca e allungato le maniche."], grammar: [g.passato-prossimo-avere], vocab: [w.stringere, w.allungare, w.giacca, w.manica] }
      - { es: "Mi lasci passare, per favore?", en: "Will you let me through, please?", altEs: ["Mi fa passare, per favore?", "Mi lasci passare?"], grammar: [g.lasciare-infinitive, g.lei-forms], vocab: [w.lasciare, w.passare], error: { wrong: "Mi lasci di passare, per favore?", explain: "lasciare is followed directly by the infinitive, with no di: mi lasci passare.", grammar: g.lasciare-infinitive } }
      - { es: "Permettimi di spiegare.", en: "Allow me to explain.", grammar: [g.imperativo-pronouns], vocab: [w.permettere, w.spiegare], transform: { instruction: "Rewrite with lasciare + infinitive", answer: "Lasciami spiegare.", alt: ["Lascia che ti spieghi."], en: "Let me explain." } }
      - { es: "Il parrucchiere mi ha tagliato i capelli.", en: "The hairdresser cut my hair.", grammar: [g.indirect-object-pronouns], vocab: [w.parrucchiere, w.tagliare], transform: { instruction: "Rewrite with farsi + infinitive: Mi sono fatto…", answer: "Mi sono fatto tagliare i capelli.", alt: ["Mi sono fatta tagliare i capelli.", "Mi sono fatto tagliare i capelli dal parrucchiere."], en: "I had my hair cut." } }
    exchanges:
      - q: { es: "Che bel taglio! Dove sei andata?", en: "What a nice haircut! Where did you go?" }
        a: { es: "Me lo sono fatto fare da Nunzia, la parrucchiera vicino al porto.", en: "I had it done by Nunzia, the hairdresser near the port." }
        alt: ["Da Nunzia, vicino al porto.", "Me lo sono fatto fare a Napoli."]
        grammar: [g.fare-causative, g.combined-pronouns]
        vocab: [w.taglio, w.farsi-fare]
      - q: { es: "Ti piace la tinta nuova?", en: "Do you like your new colour?" }
        a: { es: "Sì, ma la prossima volta non me la farò fare così scura.", en: "Yes, but next time I won't have it done so dark." }
        alt: ["Moltissimo!", "Insomma, è un po' troppo scura."]
        grammar: [g.fare-causative, g.combined-pronouns]
        vocab: [w.tinta]
      - q: { es: "Vuoi che ti aiuti con il trasloco?", en: "Do you want me to help you with the move?" }
        a: { es: "No, lascia stare, faccio da solo.", en: "No, don't worry, I'll do it myself." }
        alt: ["Lascia stare, grazie.", "Sì, grazie, sei un tesoro."]
        grammar: [g.lasciare-infinitive]
        vocab: [w.lasciare-stare, w.trasloco]
      - q: { es: "I tuoi ti lasciavano andare alle feste?", en: "Did your parents let you go to parties?" }
        a: { es: "Solo se mio fratello mi accompagnava e mi riportava a casa entro mezzanotte.", en: "Only if my brother took me and brought me home by midnight." }
        alt: ["Quasi mai.", "Sì, ma solo il sabato."]
        grammar: [g.lasciare-infinitive]
        vocab: [w.lasciare, w.accompagnare]
      - q: { es: "Chi ti ha convinto a venire a Procida?", en: "Who persuaded you to come to Procida?" }
        a: { es: "Mia sorella: mi ha convinta a prendermi una settimana di ferie.", en: "My sister: she persuaded me to take a week off." }
        alt: ["Mia sorella.", "Nessuno, ho deciso da sola."]
        grammar: [g.verbs-with-prepositions]
        vocab: [w.convincere-a, w.ferie]
    texts:
      - title: "Biglietto della sartoria"
        es: ["Pantaloni: accorciati di due centimetri.", "Giacca: stretta in vita, maniche allungate.", "Lasciate pure i vestiti qui: potete ritirarli sabato."]
        en: ["Trousers: shortened by two centimetres.", "Jacket: taken in at the waist, sleeves lengthened.", "Feel free to leave the clothes here: you can collect them on Saturday."]
        grammar: [g.lasciare-infinitive, g.imperativo-noi-voi]
        vocab: [w.accorciare, w.stringere, w.allungare]
      - title: "Il postino"
        es: ["Nel film «Il postino» il giovane Mario porta la posta al poeta Pablo Neruda.", "Neruda lo lascia entrare nel suo mondo e gli fa scoprire la poesia.", "Molte scene furono girate alla Marina Corricella, a Procida."]
        en: ["In the film Il Postino, young Mario delivers the mail to the poet Pablo Neruda.", "Neruda lets him into his world and makes him discover poetry.", "Many scenes were shot at Marina Corricella, in Procida."]
        grammar: [g.lasciare-infinitive, g.fare-causative]
        vocab: [w.lasciare, w.film]
    spicy:
      - { es: "Lasciati andare: è solo un ballo... per ora.", en: "Let yourself go: it's only a dance... for now.", altEs: ["Lasciati andare, è solo un ballo... per ora."], grammar: [g.lasciare-infinitive, g.imperativo-pronouns], vocab: [w.lasciare, w.ballo] }
      - { es: "Lascia fare a me: so esattamente dove portarti a cena.", en: "Leave it to me: I know exactly where to take you for dinner.", altEs: ["Lascia fare a me, so esattamente dove portarti a cena."], grammar: [g.lasciare-infinitive], vocab: [w.lasciare-fare, w.cena] }
      - { es: "Mi sono fatto tagliare i capelli per te; tu almeno fammi un complimento.", en: "I had my hair cut for you; at least pay me a compliment.", altEs: ["Mi sono fatta tagliare i capelli per te; tu almeno fammi un complimento."], grammar: [g.fare-causative], vocab: [w.tagliarsi-i-capelli, w.complimento] }
      - { es: "Lascia perdere il menù: stasera ordino io per tutti e due.", en: "Forget the menu: tonight I'm ordering for both of us.", altEs: ["Lascia stare il menù: stasera ordino io per tutti e due."], grammar: [g.lasciare-infinitive], vocab: [w.lasciar-perdere, w.ordinare] }
      - { es: "Il sarto mi ha stretto la camicia; adesso respiro solo quando mi guardi.", en: "The tailor took my shirt in; now I can only breathe when you look at me.", altEs: ["La sarta mi ha stretto la camicia: adesso respiro solo quando mi guardi."], grammar: [g.passato-prossimo-avere], vocab: [w.sarto, w.stringere, w.camicia] }
dialogues:
  - id: b2.u06.d1
    title: Il motorino non parte
    context: Giada has rented a moped on Procida. This morning it won't start, so she takes it back to Pasquale, who runs the rental shop by the port.
    lines:
      - { speaker: Giada, es: "Buongiorno, ho noleggiato questo motorino ieri, ma stamattina non parte.", en: "Good morning, I rented this moped yesterday, but this morning it won't start." }
      - { speaker: Pasquale, es: "Mi faccia vedere... Eh, signorina, ha bucato una gomma.", en: "Let me see... Ah, miss, you've got a puncture." }
      - { speaker: Giada, es: "Che scocciatura! Volevo andare alla Corricella prima di pranzo.", en: "What a nuisance! I wanted to go to the Corricella before lunch." }
      - { speaker: Pasquale, es: "Non se la prenda. La faccio riparare dal gommista qui accanto: ci vuole mezz'ora.", en: "Don't get upset. I'll have it fixed by the tyre man next door: it takes half an hour." }
      - { speaker: Giada, es: "Mezz'ora? Non me la sento di aspettare sotto questo sole.", en: "Half an hour? I don't feel up to waiting in this sun." }
      - { speaker: Pasquale, es: "Allora lasci qui il motorino e se ne vada a fare un giro a piedi. L'isola è piccola.", en: "Then leave the moped here and go off for a walk. The island is small." }
      - { speaker: Giada, es: "E se il gommista non ce la fa entro oggi?", en: "And if the tyre man doesn't manage it today?" }
      - { speaker: Pasquale, es: "Ce la fa, ce la fa. In ogni caso le faccio sapere con un messaggio.", en: "He'll manage, he'll manage. Either way I'll let you know with a message." }
      - { speaker: Giada, es: "Grazie mille. Devo pagare la riparazione?", en: "Thanks a lot. Do I have to pay for the repair?" }
      - { speaker: Pasquale, es: "No, lasci perdere: la gomma era vecchia, non è colpa sua.", en: "No, forget it: the tyre was old, it's not your fault." }
    questions:
      - { q: "Che problema ha il motorino di Giada?", options: ["Non ha benzina.", "Ha una gomma bucata.", "Ha i freni rotti."], answer: 1, explain: "Pasquale: ha bucato una gomma." }
      - { q: "Chi riparerà il motorino?", options: ["Giada.", "Il gommista qui accanto.", "Un tecnico di Napoli."], answer: 1, explain: "La faccio riparare dal gommista qui accanto." }
      - { q: "Che cosa consiglia Pasquale a Giada?", options: ["Di prendere il traghetto.", "Di fare un giro a piedi.", "Di noleggiare un altro motorino."], answer: 1, explain: "Lasci qui il motorino e se ne vada a fare un giro a piedi." }
      - { q: "Quanto deve pagare Giada per la riparazione?", options: ["Niente.", "Mezza giornata di noleggio.", "Il prezzo della gomma."], answer: 0, explain: "Lasci perdere: la gomma era vecchia, non è colpa sua." }
