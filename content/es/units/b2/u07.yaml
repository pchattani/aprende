id: b2.u07
title: Se construyó en 1900
lessons:
  - id: b2.u07.l1
    title: Fue construida por los romanos
    teach: [g.passive-advanced]
    vocab: [w.construccion, w.restaurar, w.restauracion, w.dinastia, w.republica, w.constitucion, w.monarquia, w.derribar, w.fortaleza, w.muralla, w.palacio, w.mezquita, w.romano, w.arabe, w.reconstruir, w.batalla, w.ejercito, w.gobernar, w.proclamar, w.derrotar, w.derrota, w.tratado, w.historico]
    tip: "ser + participle + por names a process and its agent (La ley fue aprobada por el parlamento); estar + participle describes the resulting state (La ley está aprobada). The participle agrees with the subject."
    sentences:
      - { es: "La muralla fue construida por los romanos en el siglo I.", en: "The city wall was built by the Romans in the first century.", altEs: ["La muralla la construyeron los romanos en el siglo I."], grammar: [g.passive-advanced], vocab: [w.muralla, w.romano, w.siglo] }
      - { es: "¿Por quién fue fundada la ciudad? — Por los árabes, en el año 711.", en: "Who was the city founded by? — By the Arabs, in the year 711.", grammar: [g.passive-advanced], vocab: [w.fundar, w.arabe] }
      - { es: "La mezquita fue convertida en catedral después de la conquista.", en: "The mosque was turned into a cathedral after the conquest.", grammar: [g.passive-advanced], vocab: [w.mezquita, w.catedral, w.conquista] }
      - { es: "El palacio no fue derribado, sino restaurado piedra a piedra.", en: "The palace was not demolished but restored stone by stone.", altEs: ["El palacio no fue derribado; fue restaurado piedra a piedra."], grammar: [g.passive-advanced], vocab: [w.palacio, w.derribar, w.restaurar], note: "piedra = stone; piedra a piedra = stone by stone." }
      - { es: "La Constitución española fue aprobada en 1978 y todavía está en vigor.", en: "The Spanish Constitution was passed in 1978 and is still in force.", grammar: [g.passive-advanced], vocab: [w.constitucion, w.aprobar], note: "estar en vigor = to be in force." }
      - { es: "¡Qué batalla tan terrible! El ejército fue derrotado en menos de dos horas.", en: "What a terrible battle! The army was defeated in less than two hours.", grammar: [g.passive-advanced, g.emphatic-structures], vocab: [w.batalla, w.ejercito, w.derrotar] }
      - { es: "La independencia de México fue proclamada en 1810, pero no fue reconocida por España hasta 1836.", en: "Mexico's independence was proclaimed in 1810, but it was not recognised by Spain until 1836.", grammar: [g.passive-advanced], vocab: [w.independencia, w.proclamar, w.reconocer] }
      - { es: "El tratado fue firmado por los dos reyes y la guerra terminó.", en: "The treaty was signed by the two kings and the war ended.", altEs: ["Los dos reyes firmaron el tratado y la guerra terminó."], grammar: [g.passive-advanced], vocab: [w.tratado, w.firmar, w.guerra, w.rey] }
      - { es: "Durante la dictadura, muchos libros fueron prohibidos; hoy están publicados en todas las lenguas.", en: "During the dictatorship, many books were banned; today they are published in every language.", grammar: [g.passive-advanced], vocab: [w.dictadura, w.prohibir, w.publicar], note: "fueron prohibidos = process (past); están publicados = present state." }
      - { es: "La república fue proclamada en 1931 y la monarquía no volvió hasta 1975.", en: "The republic was proclaimed in 1931 and the monarchy did not return until 1975.", grammar: [g.passive-advanced], vocab: [w.republica, w.monarquia, w.proclamar] }
      - { es: "Las colonias del imperio fueron perdiéndose una tras otra a lo largo del siglo XIX.", en: "The empire's colonies were gradually lost one after another over the nineteenth century.", grammar: [g.passive-advanced, g.ir-venir-andar-gerund], vocab: [w.colonia, w.imperio, w.perder] }
      - { es: "La fortaleza está rodeada de un bosque y es visitada por miles de turistas cada año.", en: "The fortress is surrounded by a forest and is visited by thousands of tourists every year.", grammar: [g.passive-advanced], vocab: [w.fortaleza, w.turista], note: "rodeado de: de instead of por with states." }
      - { es: "El centro histórico será reconstruido con dinero del gobierno y de la Unión Europea.", en: "The historic centre will be rebuilt with money from the government and the European Union.", altEs: ["El centro histórico se reconstruirá con dinero del gobierno y de la Unión Europea."], grammar: [g.passive-advanced], vocab: [w.historico, w.reconstruir, w.gobierno] }
      - { es: "El país fue gobernado por la misma dinastía durante casi trescientos años.", en: "The country was ruled by the same dynasty for almost three hundred years.", grammar: [g.passive-advanced], vocab: [w.gobernar, w.dinastia, w.pais] }
      - { es: "La democracia fue recuperada por los ciudadanos, no por los políticos.", en: "Democracy was recovered by the citizens, not by the politicians.", grammar: [g.passive-advanced], vocab: [w.democracia, w.ciudadano, w.politico], error: { wrong: "La democracia fue recuperado por los ciudadanos, no por los políticos.", explain: "With ser + participle the participle agrees with the subject: la democracia fue recuperada.", grammar: g.passive-advanced } }
      - { es: "El ayuntamiento restauró la muralla el año pasado.", en: "The town council restored the city wall last year.", grammar: [g.passive-advanced], vocab: [w.ayuntamiento, w.restauracion], transform: { instruction: "Rewrite in the passive with ser", answer: "La muralla fue restaurada por el ayuntamiento el año pasado.", alt: ["La muralla fue restaurada el año pasado por el ayuntamiento."] } }
    exchanges:
      - q: { es: "¿Cuándo fue construido el acueducto?", en: "When was the aqueduct built?" }
        a: { es: "Fue construido por los romanos hace casi dos mil años.", en: "It was built by the Romans almost two thousand years ago." }
        alt: ["Lo construyeron los romanos hace casi dos mil años.", "Hace casi dos mil años, en la época romana."]
        grammar: [g.passive-advanced]
        vocab: [w.romano]
      - q: { es: "¿El palacio está abierto al público?", en: "Is the palace open to the public?" }
        a: { es: "Todavía no; está siendo restaurado y abrirá en primavera.", en: "Not yet; it is being restored and will open in spring." }
        alt: ["No, está cerrado por restauración hasta la primavera."]
        grammar: [g.passive-advanced]
        vocab: [w.palacio, w.restaurar]
      - q: { es: "¿Por qué fue derribada la antigua estación?", en: "Why was the old station demolished?" }
        a: { es: "Porque estaba en ruinas y nadie quería pagar la restauración.", en: "Because it was in ruins and nobody wanted to pay for the restoration." }
        alt: ["Estaba en ruinas y la restauración era carísima."]
        grammar: [g.passive-advanced]
        vocab: [w.derribar, w.ruinas]
      - q: { es: "¿Quién ganó la batalla?", en: "Who won the battle?" }
        a: { es: "Nadie lo sabe con seguridad; los dos ejércitos fueron casi destruidos.", en: "Nobody knows for sure; both armies were almost destroyed." }
        alt: ["Los dos ejércitos fueron casi destruidos, así que nadie ganó."]
        grammar: [g.passive-advanced]
        vocab: [w.batalla, w.ejercito]
      - q: { es: "¿Es verdad que la catedral fue una mezquita?", en: "Is it true that the cathedral was a mosque?" }
        a: { es: "Sí, fue construida como mezquita y convertida en catedral en el siglo XIII.", en: "Yes, it was built as a mosque and converted into a cathedral in the thirteenth century." }
        alt: ["Sí, la convirtieron en catedral en el siglo XIII."]
        grammar: [g.passive-advanced]
        vocab: [w.mezquita, w.catedral]
    texts:
      - title: "Cartel en un monumento"
        es: ["Esta torre fue construida en el siglo XII como parte de la muralla árabe.", "Fue destruida por un terremoto en 1755 y reconstruida cincuenta años después.", "Hoy está declarada Monumento Nacional y es visitada por más de cien mil personas al año."]
        en: ["This tower was built in the twelfth century as part of the Arab city wall.", "It was destroyed by an earthquake in 1755 and rebuilt fifty years later.", "Today it is declared a National Monument and is visited by more than a hundred thousand people a year."]
        grammar: [g.passive-advanced]
        vocab: [w.muralla, w.reconstruir, w.terremoto]
      - title: "Titular de un periódico"
        es: ["El parlamento aprueba la nueva ley de patrimonio.", "La ley fue votada por casi todos los partidos tras dos años de debate.", "Los edificios históricos abandonados serán restaurados con fondos públicos."]
        en: ["Parliament passes the new heritage law.", "The law was voted through by almost every party after two years of debate.", "Abandoned historic buildings will be restored with public funds."]
        grammar: [g.passive-advanced]
        vocab: [w.parlamento, w.historico]
  - id: b2.u07.l2
    title: Se detuvo a tres personas
    teach: [g.passive-advanced]
    vocab: [w.laboratorio, w.experimento, w.muestra, w.analizar, w.hallazgo, w.estudio, w.personal, w.cualificado, w.contratacion, w.detencion, w.exportar, w.exportacion, w.venta, w.produccion, w.consumidor, w.ingresar, w.evacuar, w.detectar, w.publicacion, w.comite, w.ministerio, w.celebrarse]
    tip: "Spanish prefers se to ser-passives: Se analizaron las muestras (verb agrees with the thing). With people, impersonal se + singular verb + a: Se detuvo a los sospechosos. The third person plural (Han subido los impuestos) also hides the agent."
    sentences:
      - { es: "Se analizaron doscientas muestras en el laboratorio y no se detectó ningún virus.", en: "Two hundred samples were analysed in the laboratory and no virus was detected.", grammar: [g.passive-advanced], vocab: [w.analizar, w.muestra, w.laboratorio, w.detectar] }
      - { es: "Se detuvo a tres personas tras el robo; la detención se produjo de madrugada.", en: "Three people were arrested after the robbery; the arrest took place in the early hours.", grammar: [g.passive-advanced], vocab: [w.detener, w.detencion, w.madrugada], note: "Impersonal se with people: singular verb + personal a." }
      - { es: "¿Se ha publicado ya el estudio? — Sí, se publicó la semana pasada en una revista científica.", en: "Has the study been published yet? — Yes, it was published last week in a scientific journal.", grammar: [g.passive-advanced], vocab: [w.publicar, w.estudio, w.revista, w.cientifico] }
      - { es: "Se necesita personal cualificado para el nuevo laboratorio; la contratación empieza en marzo.", en: "Qualified staff are needed for the new laboratory; hiring starts in March.", grammar: [g.passive-advanced], vocab: [w.personal, w.cualificado, w.contratacion] }
      - { es: "Han subido los impuestos otra vez y no han explicado por qué.", en: "They have raised taxes again and have not explained why.", altEs: ["Se han subido los impuestos otra vez y no se ha explicado por qué."], grammar: [g.passive-advanced], vocab: [w.impuesto, w.subir, w.explicar], note: "Third person plural without subject: the agent is unknown or does not matter." }
      - { es: "El experimento se repitió cinco veces y los hallazgos se confirmaron en todos los casos.", en: "The experiment was repeated five times and the findings were confirmed in every case.", grammar: [g.passive-advanced], vocab: [w.experimento, w.hallazgo, w.repetir, w.confirmar] }
      - { es: "No se exporta vino a ese país desde 2019; las exportaciones se redujeron a la mitad.", en: "No wine has been exported to that country since 2019; exports were cut by half.", grammar: [g.passive-advanced, g.desde-hace], vocab: [w.exportar, w.exportacion, w.vino, w.reducir] }
      - { es: "¡Ya se ha vendido todo! La venta de entradas duró solo diez minutos.", en: "Everything has sold out already! The ticket sale lasted only ten minutes.", grammar: [g.passive-advanced], vocab: [w.vender, w.venta, w.entrada] }
      - { es: "Ingresaron a la víctima en el hospital, donde fue operada esa misma noche.", en: "The victim was admitted to hospital, where she was operated on that very night.", grammar: [g.passive-advanced], vocab: [w.ingresar, w.victima, w.hospital] }
      - { es: "Se evacuó a doscientos vecinos por el incendio, pero nadie resultó herido.", en: "Two hundred residents were evacuated because of the fire, but nobody was hurt.", grammar: [g.passive-advanced], vocab: [w.evacuar, w.vecino, w.incendio, w.herido] }
      - { es: "La ley se aprobó sin la aprobación del comité, lo cual sorprendió a los periodistas.", en: "The law was passed without the committee's approval, which surprised the journalists.", grammar: [g.passive-advanced], vocab: [w.aprobacion, w.comite, w.periodista] }
      - { es: "Según el Ministerio de Sanidad, se vacunará primero a los mayores de ochenta años.", en: "According to the Ministry of Health, people over eighty will be vaccinated first.", grammar: [g.passive-advanced], vocab: [w.ministerio, w.sanidad, w.vacuna] }
      - { es: "El tribunal condenó al director a cuatro años de cárcel; el juicio se celebró en Sevilla.", en: "The court sentenced the director to four years in prison; the trial was held in Seville.", grammar: [g.passive-advanced], vocab: [w.tribunal, w.condenar, w.juicio, w.celebrarse, w.carcel] }
      - { es: "La producción de coches eléctricos se ha duplicado y los consumidores los compran cada vez más.", en: "Production of electric cars has doubled and consumers are buying more and more of them.", grammar: [g.passive-advanced], vocab: [w.produccion, w.consumidor, w.electrico], note: "duplicarse = to double." }
      - { es: "Se contrató a dos ingenieros para el proyecto.", en: "Two engineers were hired for the project.", grammar: [g.passive-advanced], vocab: [w.contratar, w.ingeniero], error: { wrong: "Se contrataron a dos ingenieros para el proyecto.", explain: "Impersonal se with a personal a takes a singular verb: se contrató a dos ingenieros. (Se contrataron dos ingenieros, without a, is also correct.)", grammar: g.passive-advanced } }
      - { es: "La publicación de los resultados fue aplazada por la empresa.", en: "The publication of the results was postponed by the company.", grammar: [g.passive-advanced], vocab: [w.publicacion, w.resultado, w.aplazar], transform: { instruction: "Rewrite with the se passive (drop the agent)", answer: "Se aplazó la publicación de los resultados.", alt: ["La publicación de los resultados se aplazó."] } }
    exchanges:
      - q: { es: "¿Ya se sabe quién ganó las elecciones?", en: "Is it known yet who won the election?" }
        a: { es: "Todavía no; los resultados se publicarán esta noche.", en: "Not yet; the results will be published tonight." }
        alt: ["No, los resultados se anuncian esta noche.", "Aún no se ha dicho nada."]
        grammar: [g.passive-advanced]
        vocab: [w.elecciones, w.resultado]
      - q: { es: "¿Qué pasó con el laboratorio del segundo piso?", en: "What happened to the second-floor laboratory?" }
        a: { es: "Se cerró el año pasado y ahora se usa como almacén.", en: "It was closed last year and now it is used as a storeroom." }
        alt: ["Lo cerraron el año pasado y ahora es un almacén."]
        grammar: [g.passive-advanced]
        vocab: [w.laboratorio, w.almacen]
      - q: { es: "¿Han detenido ya al sospechoso?", en: "Have they arrested the suspect yet?" }
        a: { es: "Sí, se le detuvo ayer en el aeropuerto cuando intentaba salir del país.", en: "Yes, he was arrested yesterday at the airport while trying to leave the country." }
        alt: ["Sí, lo detuvieron ayer en el aeropuerto."]
        grammar: [g.passive-advanced]
        vocab: [w.detener, w.sospechoso, w.aeropuerto]
      - q: { es: "¿Cómo se hace el queso en este pueblo?", en: "How is cheese made in this village?" }
        a: { es: "Se calienta la leche, se añade sal y se deja en cuevas durante tres meses.", en: "The milk is heated, salt is added and it is left in caves for three months." }
        alt: ["Primero se calienta la leche y después se deja tres meses en una cueva."]
        grammar: [g.passive-advanced]
        vocab: [w.queso, w.leche, w.sal]
    texts:
      - title: "Noticia breve"
        es: ["Se ha detectado un nuevo virus en una granja del norte.", "Las muestras fueron analizadas en el laboratorio del ministerio y se confirmó el hallazgo esta mañana.", "Se evacuó a los trabajadores y se cerró la carretera como medida de seguridad."]
        en: ["A new virus has been detected on a farm in the north.", "The samples were analysed in the ministry's laboratory and the finding was confirmed this morning.", "The workers were evacuated and the road was closed as a safety measure."]
        grammar: [g.passive-advanced]
        vocab: [w.detectar, w.muestra, w.evacuar, w.medida]
      - title: "Anuncio de empleo"
        es: ["Se busca personal cualificado para laboratorio de análisis.", "Se valorará la experiencia en investigación y se ofrece contrato indefinido.", "Las entrevistas se celebrarán en mayo."]
        en: ["Qualified staff sought for an analysis laboratory.", "Research experience will be valued and a permanent contract is offered.", "Interviews will be held in May."]
        grammar: [g.passive-advanced]
        vocab: [w.personal, w.cualificado, w.celebrarse, w.entrevista]
  - id: b2.u07.l3
    title: Hace falta, basta con, se supone
    teach: [g.impersonal-expressions]
    vocab: [w.bastar, w.sobrar, w.faltar, w.amanecer, w.anochecer, w.sentido, w.sentido-comun, w.suficiente, w.ajeno, w.generalmente, w.sabido, w.suponerse, w.cualquier-persona, w.resultar, w.ocurrirsele, w.tratarse-de, w.conviene, w.a-cualquier-hora]
    tip: "Impersonal expressions hide the subject: hay que, hace falta, basta con, se supone que, resulta que, uno…, la gente…, cualquiera… Weather and time verbs are impersonal too: amanece, anochece, hace frío."
    sentences:
      - { es: "Para entrar en el museo basta con enseñar el carné de estudiante.", en: "To get into the museum it is enough to show your student card.", altEs: ["Para entrar en el museo es suficiente con enseñar el carné de estudiante."], grammar: [g.impersonal-expressions], vocab: [w.bastar, w.museo, w.carne] }
      - { es: "Hace falta más paciencia y menos prisa para aprender un idioma.", en: "More patience and less hurry are needed to learn a language.", grammar: [g.impersonal-expressions], vocab: [w.hacer-falta, w.ten-paciencia, w.prisa, w.idioma] }
      - { es: "Se supone que la reunión empieza a las diez, pero generalmente empieza más tarde.", en: "The meeting is supposed to start at ten, but it generally starts later.", grammar: [g.impersonal-expressions], vocab: [w.suponerse, w.generalmente, w.reunion] }
      - { es: "Resulta que el sospechoso era el hermano de la testigo. ¡Quién lo habría imaginado!", en: "It turns out the suspect was the witness's brother. Who would have imagined it!", grammar: [g.impersonal-expressions, g.conditional-perfect], vocab: [w.resultar, w.sospechoso, w.testigo, w.imaginar] }
      - { es: "Uno nunca sabe lo que puede pasar; por eso conviene tener un plan.", en: "One never knows what may happen; that is why it is advisable to have a plan.", grammar: [g.impersonal-expressions], vocab: [w.conviene, w.plan], note: "uno / una = generic 'one'." }
      - { es: "Sobran las palabras: cualquier persona entiende que se trata de una injusticia.", en: "Words are unnecessary: anyone understands that this is an injustice.", grammar: [g.impersonal-expressions], vocab: [w.sobrar, w.cualquier-persona, w.tratarse-de, w.injusticia] }
      - { es: "Faltan sillas en la sala y falta tiempo para traer más.", en: "There are not enough chairs in the room and there is no time to bring more.", grammar: [g.impersonal-expressions], vocab: [w.faltar, w.silla, w.tiempo] }
      - { es: "En invierno anochece a las seis y amanece casi a las ocho.", en: "In winter it gets dark at six and it gets light at almost eight.", grammar: [g.impersonal-expressions], vocab: [w.anochecer, w.amanecer, w.invierno] }
      - { es: "Es bien sabido que en España se cena tarde; a cualquier hora encuentras un bar abierto.", en: "It is well known that in Spain people eat dinner late; at any time you find a bar open.", grammar: [g.impersonal-expressions], vocab: [w.sabido, w.cenar, w.a-cualquier-hora, w.bar], note: "tú genérico: encuentras = one finds." }
      - { es: "¿No se te ocurre nada mejor? — No, es que me falta sentido común a estas horas.", en: "Can't you think of anything better? — No, it's just that I lack common sense at this time of night.", grammar: [g.impersonal-expressions, g.emphatic-structures], vocab: [w.ocurrirsele, w.sentido-comun, w.a-estas-horas] }
      - { es: "No tiene sentido discutir con alguien que no quiere escuchar.", en: "There is no point arguing with someone who does not want to listen.", altEs: ["No tiene ningún sentido discutir con alguien que no quiere escuchar."], grammar: [g.impersonal-expressions], vocab: [w.sentido, w.discutir, w.escuchar] }
      - { es: "La gente dice que es suficiente con estudiar una hora al día, pero no es verdad.", en: "People say that studying an hour a day is enough, but it is not true.", grammar: [g.impersonal-expressions], vocab: [w.gente, w.suficiente, w.estudiar] }
      - { es: "No hay que meterse en asuntos ajenos; cualquiera lo entendería.", en: "You should not get involved in other people's business; anyone would understand that.", grammar: [g.impersonal-expressions], vocab: [w.ajeno, w.asunto, w.cualquiera, w.meterse] }
      - { es: "Sucede que, cuando llueve, no se puede aparcar en ninguna parte.", en: "What happens is that, when it rains, you cannot park anywhere.", grammar: [g.impersonal-expressions], vocab: [w.suceder, w.llover, w.aparcar, w.en-ninguna-parte] }
      - { es: "Hace falta que alguien avise al médico.", en: "Someone needs to let the doctor know.", grammar: [g.impersonal-expressions], vocab: [w.hacer-falta, w.avisar, w.medico], error: { wrong: "Hace falta que alguien avisa al médico.", explain: "hace falta que + subjunctive: avise. (Hace falta avisar, with the infinitive, is also correct.)", grammar: g.impersonal-expressions } }
      - { es: "Tienes que llamar antes de las nueve, nada más.", en: "You just have to call before nine, nothing more.", grammar: [g.impersonal-expressions], vocab: [w.llamar, w.nada-mas], transform: { instruction: "Rephrase with basta con", answer: "Basta con llamar antes de las nueve.", alt: ["Basta con que llames antes de las nueve."] } }
    exchanges:
      - q: { es: "¿Qué hace falta para abrir una cuenta en el banco?", en: "What is needed to open a bank account?" }
        a: { es: "Basta con el pasaporte y una dirección en España.", en: "Your passport and an address in Spain are enough." }
        alt: ["Solo hace falta el pasaporte y una dirección en España.", "Con el pasaporte es suficiente."]
        grammar: [g.impersonal-expressions]
        vocab: [w.bastar, w.pasaporte, w.cuenta]
      - q: { es: "¿A qué hora se supone que llega el tren?", en: "What time is the train supposed to arrive?" }
        a: { es: "A las cinco y media, pero generalmente llega con retraso.", en: "At half past five, but it is generally late." }
        alt: ["Se supone que a las cinco y media, aunque suele llegar tarde."]
        grammar: [g.impersonal-expressions]
        vocab: [w.suponerse, w.retraso]
      - q: { es: "¿Por qué no ha venido Lucía?", en: "Why hasn't Lucía come?" }
        a: { es: "Resulta que se equivocó de día y pensaba que la cena era mañana.", en: "It turns out she got the day wrong and thought the dinner was tomorrow." }
        alt: ["Pues resulta que se había equivocado de día."]
        grammar: [g.impersonal-expressions]
        vocab: [w.resultar, w.equivocarse]
      - q: { es: "¿Hace frío en Madrid en enero?", en: "Is it cold in Madrid in January?" }
        a: { es: "Bastante: amanece tarde, anochece pronto y por la noche hiela.", en: "Quite cold: it gets light late, dark early and at night it freezes." }
        alt: ["Sí, bastante, y anochece muy pronto."]
        grammar: [g.impersonal-expressions]
        vocab: [w.amanecer, w.anochecer]
      - q: { es: "¿Se puede fumar en la terraza?", en: "Can you smoke on the terrace?" }
        a: { es: "No, no se puede; aquí no se fuma en ninguna parte del edificio.", en: "No, you can't; here nobody smokes anywhere in the building." }
        alt: ["No, está prohibido en todo el edificio."]
        grammar: [g.impersonal-expressions]
        vocab: [w.fumar, w.terraza]
    texts:
      - title: "Consejos para visitantes"
        es: ["En esta ciudad no hace falta coche: se puede ir a pie a casi todas partes.", "Conviene llevar agua, porque en verano hace muchísimo calor.", "Basta con pedir ayuda: la gente de aquí es muy amable."]
        en: ["In this city you don't need a car: you can walk almost everywhere.", "It is advisable to carry water, because in summer it is extremely hot.", "You only have to ask for help: people here are very kind."]
        grammar: [g.impersonal-expressions]
        vocab: [w.hacer-falta, w.conviene, w.bastar]
      - title: "Mensaje en el grupo de la oficina"
        es: ["Se supone que mañana viene el técnico a arreglar la calefacción.", "Falta saber a qué hora, así que conviene que alguien esté en la oficina desde las ocho.", "Resulta que la avería es más grave de lo que pensábamos."]
        en: ["The technician is supposed to come tomorrow to fix the heating.", "We still need to know what time, so it is best that someone is in the office from eight.", "It turns out the breakdown is more serious than we thought."]
        grammar: [g.impersonal-expressions]
        vocab: [w.suponerse, w.faltar, w.conviene, w.resultar, w.averia]
  - id: b2.u07.l4
    title: El hecho de que, lo importante
    teach: [g.nominalization]
    vocab: [w.el-hecho-de-que, w.crecimiento, w.aprendizaje, w.lectura, w.escritura, w.desarrollo, w.descenso, w.reduccion, w.aparicion, w.creacion, w.envejecimiento, w.caida, w.apertura, w.cierre, w.recuperacion, w.importancia, w.dificultad, w.facilidad, w.rapidez, w.gravedad, w.mejoria, w.preocupar]
    tip: "Formal Spanish turns verbs into nouns: subir → la subida, crecer → el crecimiento, abrir → la apertura. lo + adjective names a quality (lo importante, lo difícil) and el hecho de que usually takes the subjunctive."
    sentences:
      - { es: "Lo importante no es la rapidez, sino la calidad del aprendizaje.", en: "The important thing is not speed but the quality of the learning.", grammar: [g.nominalization], vocab: [w.rapidez, w.calidad, w.aprendizaje] }
      - { es: "El hecho de que no haya llamado me preocupa.", en: "The fact that he hasn't called worries me.", grammar: [g.nominalization, g.subjunctive-perfect], vocab: [w.el-hecho-de-que, w.preocupar, w.llamar] }
      - { es: "La caída de los precios y la apertura de nuevas fábricas explican el crecimiento de la ciudad.", en: "The fall in prices and the opening of new factories explain the city's growth.", grammar: [g.nominalization], vocab: [w.caida, w.apertura, w.crecimiento, w.fabrica] }
      - { es: "¿Has notado lo rápido que aprenden los niños a leer? La lectura les resulta facilísima.", en: "Have you noticed how fast children learn to read? Reading comes incredibly easily to them.", grammar: [g.nominalization], vocab: [w.lectura, w.resultar, w.leer] }
      - { es: "Me sorprende lo bien que escribe; la escritura es su gran talento.", en: "I'm surprised at how well she writes; writing is her great talent.", grammar: [g.nominalization], vocab: [w.escritura, w.sorprender, w.escribir], note: "talento = talent." }
      - { es: "El envejecimiento de la población es uno de los grandes retos de Europa.", en: "The ageing of the population is one of Europe's great challenges.", grammar: [g.nominalization], vocab: [w.envejecimiento, w.poblacion, w.reto] }
      - { es: "Al salir del hospital, el médico habló de una clara mejoría.", en: "On leaving the hospital, the doctor spoke of a clear improvement.", grammar: [g.nominalization], vocab: [w.mejoria, w.hospital, w.medico], note: "al + infinitive = on / when doing something." }
      - { es: "Lo malo del cierre de la fábrica es la pérdida de trescientos empleos.", en: "The bad thing about the factory's closure is the loss of three hundred jobs.", grammar: [g.nominalization, g.neutral-lo], vocab: [w.cierre, w.perdida, w.empleo] }
      - { es: "El que llegues tarde todos los días no ayuda a la recuperación del equipo.", en: "Your arriving late every day doesn't help the team's recovery.", grammar: [g.nominalization], vocab: [w.recuperacion, w.equipo, w.llegar], note: "el que + subjunctive as subject." }
      - { es: "La aparición de internet cambió la importancia de la lectura en papel.", en: "The appearance of the internet changed the importance of reading on paper.", grammar: [g.nominalization], vocab: [w.aparicion, w.importancia, w.internet] }
      - { es: "No te imaginas la dificultad de este examen ni la gravedad de la situación.", en: "You can't imagine the difficulty of this exam or the seriousness of the situation.", grammar: [g.nominalization], vocab: [w.dificultad, w.gravedad, w.examen] }
      - { es: "El desarrollo económico trajo consigo una reducción de la pobreza y un descenso del paro.", en: "Economic development brought with it a reduction in poverty and a fall in unemployment.", grammar: [g.nominalization], vocab: [w.desarrollo, w.reduccion, w.descenso, w.pobreza, w.paro] }
      - { es: "La creación de empleo es lo único que le interesa al gobierno, ¡y lo demás le da igual!", en: "Job creation is the only thing the government cares about, and it couldn't care less about the rest!", grammar: [g.nominalization], vocab: [w.creacion, w.empleo, w.dar-igual] }
      - { es: "Con la facilidad con la que habla, ¿por qué le cuesta tanto escribir?", en: "With the ease with which he speaks, why does he find writing so hard?", grammar: [g.nominalization], vocab: [w.facilidad, w.hablar, w.costar] }
      - { es: "El hecho de que lo sepa no cambia nada.", en: "The fact that he knows doesn't change anything.", grammar: [g.nominalization], vocab: [w.el-hecho-de-que, w.saber], error: { wrong: "El hecho de que lo sabe no cambia nada.", explain: "el hecho de que normally takes the subjunctive: el hecho de que lo sepa.", grammar: g.nominalization } }
      - { es: "Los precios han subido mucho y eso preocupa a las familias.", en: "Prices have risen a lot and that worries families.", grammar: [g.nominalization], vocab: [w.precio, w.subida, w.preocupar], transform: { instruction: "Rewrite with a noun instead of the verb subir", answer: "La subida de los precios preocupa a las familias.", alt: ["La gran subida de los precios preocupa a las familias."] } }
    exchanges:
      - q: { es: "¿Qué es lo mejor de vivir en el campo?", en: "What is the best thing about living in the country?" }
        a: { es: "Lo mejor es el silencio; lo peor, la falta de transporte.", en: "The best thing is the silence; the worst, the lack of transport." }
        alt: ["Lo mejor es la tranquilidad, sin duda."]
        grammar: [g.nominalization, g.neutral-lo]
        vocab: [w.silencio, w.transporte]
      - q: { es: "¿Te preocupa el hecho de que no haya contestado?", en: "Does the fact that she hasn't answered worry you?" }
        a: { es: "Un poco, sí; lo raro es que siempre contesta enseguida.", en: "A little, yes; the strange thing is that she always answers straight away." }
        alt: ["Sí, me preocupa bastante.", "No mucho; estará ocupada."]
        grammar: [g.nominalization]
        vocab: [w.el-hecho-de-que, w.preocupar, w.contestar]
      - q: { es: "¿Cómo explica el gobierno el descenso del paro?", en: "How does the government explain the fall in unemployment?" }
        a: { es: "Por el crecimiento del turismo y la apertura de nuevas empresas.", en: "By the growth of tourism and the opening of new companies." }
        alt: ["Dice que es gracias al crecimiento del turismo."]
        grammar: [g.nominalization]
        vocab: [w.descenso, w.crecimiento, w.apertura]
      - q: { es: "¿Qué tal el nuevo profesor?", en: "How is the new teacher?" }
        a: { es: "Me sorprende lo claro que explica y la facilidad con la que responde a todo.", en: "I'm surprised at how clearly he explains and the ease with which he answers everything." }
        alt: ["Explica con una claridad sorprendente."]
        grammar: [g.nominalization]
        vocab: [w.facilidad, w.explicar]
    texts:
      - title: "Resumen de un informe"
        es: ["El informe destaca la importancia de la lectura en la infancia.", "El descenso del número de lectores jóvenes preocupa a los expertos.", "Lo más grave es la caída de la lectura entre los chicos de doce a dieciséis años.", "El hecho de que lean menos no significa que escriban peor."]
        en: ["The report highlights the importance of reading in childhood.", "The fall in the number of young readers worries the experts.", "The most serious thing is the drop in reading among boys aged twelve to sixteen.", "The fact that they read less does not mean that they write worse."]
        grammar: [g.nominalization]
        vocab: [w.importancia, w.lectura, w.descenso, w.caida, w.el-hecho-de-que]
dialogues:
  - id: b2.u07.d1
    title: Visita guiada al castillo
    context: A guide shows a group of visitors around a castle and answers their questions about its history.
    lines:
      - { speaker: Guía, es: "Bienvenidos. El castillo fue construido en el siglo X por los árabes y conquistado en 1085 por el rey Alfonso VI.", en: "Welcome. The castle was built in the tenth century by the Arabs and conquered in 1085 by King Alfonso VI." }
      - { speaker: Visitante, es: "¿Y la torre grande también es árabe?", en: "And is the big tower Arab too?" }
      - { speaker: Guía, es: "No, la torre se levantó más tarde, en el siglo XIV. Fue destruida por un incendio y reconstruida piedra a piedra.", en: "No, the tower was put up later, in the fourteenth century. It was destroyed by a fire and rebuilt stone by stone." }
      - { speaker: Visitante, es: "Se supone que aquí vivieron reyes, ¿verdad?", en: "Kings are supposed to have lived here, right?" }
      - { speaker: Guía, es: "Así es. Durante dos siglos el castillo fue habitado por la familia real; después se usó como cárcel.", en: "That's right. For two centuries the castle was inhabited by the royal family; afterwards it was used as a prison." }
      - { speaker: Visitante, es: "¡Qué cambio! ¿Y cuándo se abrió al público?", en: "What a change! And when was it opened to the public?" }
      - { speaker: Guía, es: "La apertura fue en 1931. Lo curioso es que la restauración no terminó hasta 1990.", en: "The opening was in 1931. The curious thing is that the restoration did not finish until 1990." }
      - { speaker: Visitante, es: "Resulta que hemos venido en el momento perfecto, entonces.", en: "It turns out we've come at the perfect moment, then." }
      - { speaker: Guía, es: "Desde luego. Basta con subir a la muralla para entender la importancia del lugar: desde allí se controlaba todo el valle.", en: "Absolutely. You only have to climb the wall to understand the importance of the place: from there the whole valley was controlled." }
      - { speaker: Visitante, es: "Pues no hace falta que nos lo repita: ¡vamos ahora mismo!", en: "Well, you don't need to tell us twice: let's go right now!" }
    questions:
      - { q: "Who built the castle originally?", options: ["The Romans", "The Arabs", "King Alfonso VI"], answer: 1 }
      - { q: "What happened to the big tower?", options: ["It was destroyed by fire and rebuilt", "It was never finished", "It was demolished in 1931"], answer: 0 }
      - { q: "What was the castle used for after the royal family left?", options: ["A school", "A museum", "A prison"], answer: 2 }
