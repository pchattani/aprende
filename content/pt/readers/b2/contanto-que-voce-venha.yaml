id: r.b2.contanto-que-voce-venha
level: b2
title: Contanto que você venha
kind: dialogue
intro: Lívia lives in João Pessoa, "the city where the sun rises first". Her friend Bruno, from Porto Alegre, keeps finding excuses not to visit. Their messages are full of conditions — contanto que, desde que, a menos que, caso.
allow: [lívia, bruno, joão, pessoa, porto, alegre, seixas, tambaú, cabo, branco, picãozinho, paraíba, ok, gaúcho, kkkk, kkk]
paragraphs:
  - { es: "Lívia: Bruno, você me prometeu no ano passado que viria a João Pessoa nas férias. As férias começam semana que vem. Cadê a passagem?", en: "Lívia: Bruno, last year you promised me you'd come to João Pessoa on holiday. The holidays start next week. Where's the ticket?" }
  - { es: "Bruno: Eu sei, eu sei. Eu iria, contanto que a passagem não estivesse tão cara. Você viu os preços? Porto Alegre–João Pessoa custa quase o mesmo que ir para Lisboa.", en: "Bruno: I know, I know. I'd go, as long as the ticket weren't so expensive. Have you seen the prices? Porto Alegre to João Pessoa costs almost the same as going to Lisbon." }
  - { es: "Lívia: Desde que você compre com antecedência, fica bem mais barato. E você pode ficar aqui em casa, a menos que prefira um hotel de luxo em Tambaú, o que eu duvido.", en: "Lívia: As long as you buy in advance, it's much cheaper. And you can stay here at my place, unless you prefer a luxury hotel in Tambaú, which I doubt." }
  - { es: "Bruno: Kkkk. Tá, digamos que eu vá. O que a gente faria? Não me diga que é só praia, porque gaúcho na praia do Nordeste vira camarão em duas horas.", en: "Bruno: Haha. OK, let's say I go. What would we do? Don't tell me it's just beach, because a gaúcho on a Northeast beach turns into a shrimp in two hours." }
  - { es: "Lívia: Tem praia, claro, mas tem muito mais. Primeiro: caso você chegue numa sexta, no sábado a gente acorda às quatro e meia e vai até a Ponta do Seixas, que é o ponto mais oriental das Américas. É o primeiro lugar do continente onde o sol nasce. Ver o nascer do sol lá é uma coisa que eu não sei explicar.", en: "Lívia: There's beach, of course, but there's much more. First: in case you arrive on a Friday, on Saturday we get up at half past four and go to Ponta do Seixas, which is the easternmost point of the Americas. It's the first place on the continent where the sun rises. Seeing the sunrise there is something I can't explain." }
  - { es: "Bruno: Quatro e meia da manhã? Nas férias? Só se você me prometer um café da manhã decente depois.", en: "Bruno: Half past four in the morning? On holiday? Only if you promise me a decent breakfast afterwards." }
  - { es: "Lívia: Prometido. Tapioca com queijo coalho, cuscuz, bolo de macaxeira e café. Depois, se a maré estiver baixa, a gente pega um barco até Picãozinho. São piscinas naturais no meio do mar, que só aparecem na maré baixa. A água fica parada, transparente, cheia de peixinhos coloridos.", en: "Lívia: Promised. Tapioca with queijo coalho, couscous, cassava cake and coffee. Then, if the tide is low, we'll take a boat to Picãozinho. They're natural pools in the middle of the sea that only appear at low tide. The water is still, clear and full of colourful little fish." }
  - { es: "Bruno: E se chover?", en: "Bruno: And what if it rains?" }
  - { es: "Lívia: Em julho às vezes chove, sim. Nesse caso, a gente vai ao centro histórico. João Pessoa é uma das cidades mais antigas do Brasil, tem igrejas lindas, e o Centro Cultural São Francisco é impressionante. E à noite tem forró, faça chuva ou faça sol.", en: "Lívia: In July it sometimes rains, yes. In that case, we'll go to the historic centre. João Pessoa is one of the oldest cities in Brazil, it has beautiful churches, and the São Francisco Cultural Centre is impressive. And in the evening there's forró, rain or shine." }
  - { es: "Bruno: Forró? Eu não sei dançar forró.", en: "Bruno: Forró? I don't know how to dance forró." }
  - { es: "Lívia: Ninguém nasce sabendo. Eu te ensino, contanto que você não pise no meu pé mais de três vezes por música.", en: "Lívia: Nobody is born knowing. I'll teach you, as long as you don't step on my foot more than three times per song." }
  - { es: "Bruno: Não posso prometer nada. Olha, eu ainda estou preocupado com o trabalho. Eu só conseguiria tirar uma semana, e mesmo assim só se o meu chefe aprovar.", en: "Bruno: I can't promise anything. Look, I'm still worried about work. I could only take one week, and even then only if my boss approves." }
  - { es: "Lívia: Uma semana é perfeito. Bruno, sério: a gente fala disso há três anos. Sempre tem um motivo: o preço, o trabalho, o calor. Eu não ligo se você vier por uma semana ou por três dias, contanto que você venha. Sinto a sua falta.", en: "Lívia: A week is perfect. Bruno, seriously: we've been talking about this for three years. There's always a reason: the price, work, the heat. I don't care if you come for a week or for three days, as long as you come. I miss you." }
  - { es: "Bruno: ...Tá bom. Vou falar com o meu chefe amanhã. Caso ele diga sim, compro a passagem na hora. Caso diga não, peço demissão. Brincadeira. Mais ou menos.", en: "Bruno: ...OK. I'll talk to my boss tomorrow. If he says yes, I'll buy the ticket straight away. If he says no, I'll resign. Just kidding. Sort of." }
  - { es: "Lívia: Kkk. Vou já separar o protetor solar fator cinquenta para você. E não esquece: quatro e meia da manhã na Ponta do Seixas. O sol não espera ninguém.", en: "Lívia: Haha. I'll set aside the factor fifty sunscreen for you right now. And don't forget: half past four in the morning at Ponta do Seixas. The sun doesn't wait for anyone." }
questions:
  - { q: "Qual é a primeira desculpa do Bruno para não viajar?", options: ["O calor", "O preço da passagem", "O trabalho"], answer: 1, explain: "«Eu iria, contanto que a passagem não estivesse tão cara.»" }
  - { q: "O que é a Ponta do Seixas?", options: ["Uma praia com piscinas naturais", "O ponto mais oriental das Américas", "Um bairro histórico"], answer: 1, explain: "«É o ponto mais oriental das Américas. É o primeiro lugar do continente onde o sol nasce.»" }
  - { q: "Quando é possível visitar as piscinas de Picãozinho?", options: ["Só na maré baixa", "Só à noite", "Só no verão"], answer: 0, explain: "«São piscinas naturais no meio do mar, que só aparecem na maré baixa.»" }
  - { q: "Qual é a condição da Lívia para ensinar forró ao Bruno?", options: ["Que ele pague as aulas", "Que ele não pise no pé dela mais de três vezes por música", "Que ele fique três semanas"], answer: 1, explain: "«Eu te ensino, contanto que você não pise no meu pé mais de três vezes por música.»" }
  - { q: "O que o Bruno decide no final?", options: ["Desiste da viagem", "Vai falar com o chefe e, se ele aprovar, compra a passagem", "Vai para Lisboa"], answer: 1, explain: "«Vou falar com o meu chefe amanhã. Caso ele diga sim, compro a passagem na hora.»" }
glossary:
  - { es: oriental, en: eastern (mais oriental = easternmost) }
  - { es: decente, en: decent }
  - { es: coalho, en: (queijo coalho = firm grilling cheese) }
  - { es: parada, en: still }
  - { es: peixinhos, en: little fish }
