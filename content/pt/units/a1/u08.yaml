      - { es: "Isso é um convite para jantar? — Isso!", en: "Is that an invitation to dinner? — Exactly!", grammar: [g.demonstratives], vocab: [w.isso, w.convite, w.jantar] }
  - id: a1.u08.l4
    title: De que cor é?
    teach: [g.colours]
    tip: "Colours go after the noun. -o colours have four forms (preto, preta, pretos, pretas); azul and verde change only for plural; laranja, rosa and cinza never change."
    vocab: [w.cor, w.branco, w.preto, w.vermelho, w.azul, w.verde, w.amarelo, w.laranja.adj, w.rosa, w.roxo, w.marrom, w.cinza, w.colorido, w.bege, w.prata, w.biquíni, w.bermuda, w.casaco, w.bolsa, w.chapéu, w.boné, w.favorito]
    sentences:
      - { es: "De que cor é o seu carro? — É prata.", en: "What colour is your car? — It's silver.", altEs: ["Qual é a cor do seu carro? — É prata.", "De que cor é o seu carro? — Prata."], grammar: [g.colours, g.question-words], vocab: [w.cor, w.carro, w.prata] }
      - { es: "Quero a camiseta amarela, por favor.", en: "I'd like the yellow T-shirt, please.", altEs: ["Eu quero a camiseta amarela, por favor."], grammar: [g.colours, g.querer-present], vocab: [w.amarelo, w.camiseta], transform: { instruction: "Make it plural", answer: "Quero as camisetas amarelas, por favor.", alt: ["Eu quero as camisetas amarelas, por favor."], en: "I'd like the yellow T-shirts, please." } }
      - { es: "A bandeira do Brasil é verde, amarela, azul e branca.", en: "The flag of Brazil is green, yellow, blue and white.", altEn: ["The Brazilian flag is green, yellow, blue and white."], grammar: [g.colours, g.adjective-agreement], vocab: [w.bandeira, w.verde, w.amarelo, w.azul, w.branco] }
      - { es: "Ela tem olhos verdes e cabelo preto.", en: "She has green eyes and black hair.", altEs: ["Ela tem os olhos verdes e o cabelo preto."], grammar: [g.colours, g.adjective-position], vocab: [w.verde, w.preto, w.olho, w.cabelo], transform: { instruction: "Change to 'they' (women)", answer: "Elas têm olhos verdes e cabelo preto.", alt: ["Elas têm os olhos verdes e o cabelo preto."], en: "They have green eyes and black hair." } }
      - { es: "Tenho dois bonés azuis.", en: "I have two blue caps.", altEs: ["Eu tenho dois bonés azuis."], grammar: [g.colours, g.plural-nouns], vocab: [w.boné, w.azul], error: { wrong: "Tenho dois bonés azules.", explain: "azul makes its plural like other words in -l: azuis.", grammar: g.colours } }
      - { es: "O Flamengo joga de vermelho e preto.", en: "Flamengo plays in red and black.", altEn: ["Flamengo wear red and black."], grammar: [g.colours], vocab: [w.vermelho, w.preto, w.jogar] }
      - { es: "Uso uma bermuda bege e um chapéu branco.", en: "I'm wearing beige shorts and a white hat.", altEs: ["Eu uso uma bermuda bege e um chapéu branco."], altEn: ["I wear beige shorts and a white hat."], grammar: [g.colours, g.adjective-position], vocab: [w.bermuda, w.bege, w.chapéu, w.branco] }
      - { es: "Essa bolsa marrom combina com o sapato.", en: "This brown bag goes with the shoes.", altEs: ["Esta bolsa marrom combina com o sapato."], altEn: ["That brown bag matches the shoes."], grammar: [g.colours, g.demonstratives], vocab: [w.bolsa, w.marrom, w.combinar], variant: "Portugal: castanho (brown) instead of marrom." }
      - { es: "Não gosto de roupa roxa.", en: "I don't like purple clothes.", altEs: ["Eu não gosto de roupa roxa."], grammar: [g.colours, g.gostar-de], vocab: [w.roxo, w.roupa], note: "roxo is purple, not red: red is vermelho." }
      - { es: "O céu está cinza hoje.", en: "The sky is grey today.", altEs: ["Hoje o céu está cinza."], grammar: [g.colours, g.ser-vs-estar-basics], vocab: [w.cinza, w.céu], variant: "Portugal: cinzento (grey)." }
      - { es: "As camisetas laranja estão em promoção.", en: "The orange T-shirts are on sale.", grammar: [g.colours], vocab: [w.laranja.adj, w.camiseta, w.promoção], note: "laranja, rosa and cinza don't change: camisetas laranja." }
      - { es: "As havaianas rosa são bonitas.", en: "The pink Havaianas are pretty.", altEn: ["The pink flip-flops are pretty."], grammar: [g.colours], vocab: [w.rosa, w.havaianas] }
      - { es: "A Escadaria Selarón é muito colorida.", en: "The Selarón Steps are very colourful.", grammar: [g.colours, g.muito-pouco], vocab: [w.colorido] }
      - { es: "Ela usa um biquíni verde e amarelo na praia.", en: "She wears a green and yellow bikini on the beach.", altEs: ["Na praia ela usa um biquíni verde e amarelo."], grammar: [g.colours], vocab: [w.biquíni, w.verde, w.amarelo, w.praia] }
      - { es: "Você tem esse casaco em preto?", en: "Do you have this jacket in black?", altEs: ["Tem esse casaco em preto?", "Vocês têm esse casaco em preto?"], altEn: ["Do you have that coat in black?"], grammar: [g.colours, g.demonstratives], vocab: [w.casaco, w.preto] }
      - { es: "Minha cor favorita é azul.", en: "My favourite colour is blue.", altEs: ["A minha cor favorita é o azul.", "Minha cor favorita é o azul."], grammar: [g.colours, g.possessives], vocab: [w.cor, w.favorito, w.azul] }
    exchanges:
      - q: { es: "De que cor é a sua bolsa?", en: "What colour is your bag?" }
