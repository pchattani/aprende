grammar:
  - { prompt: "Ayer ___ (yo, comer) con mis padres.", options: ["comí", "comía", "he comido"], answer: 0, explain: "A completed event with ayer: preterite." }
  - { prompt: "Cuando era niño, ___ (jugar) en la calle todos los días.", options: ["jugué", "jugaba", "juego"], answer: 1, explain: "Habitual past action: imperfect." }
  - { prompt: "Esta mañana ___ (yo, ver) a Marta en el metro.", options: ["vi", "veía", "he visto"], answer: 2, explain: "esta mañana belongs to the present day: present perfect (in Spain)." }
  - { prompt: "El año pasado ___ (nosotros, ir) a Portugal.", options: ["fuimos", "íbamos", "hemos ido"], answer: 0, explain: "A finished past time (el año pasado): preterite; ir → fuimos." }
  - { prompt: "¿Dónde está el libro? — ___ he dejado en la mesa.", options: ["Le", "Lo", "La"], answer: 1, explain: "el libro is masculine singular: lo." }
  - { prompt: "A María ___ he regalado unas flores.", options: ["la", "le", "lo"], answer: 1, explain: "Recipient = indirect object: le." }
  - { prompt: "¿Me prestas el boli? — Sí, ahora ___ doy.", options: ["te lo", "te le", "lo te"], answer: 0, explain: "Indirect before direct: te lo." }
  - { prompt: "Mañana ___ (hacer) buen tiempo.", options: ["hacerá", "hará", "hace"], answer: 1, explain: "hacer has an irregular future stem: har-." }
  - { prompt: "Madrid es ___ grande ___ Sevilla.", options: ["más / que", "más / de", "tan / que"], answer: 0 }
  - { prompt: "Es el restaurante más caro ___ la ciudad.", options: ["en", "de", "que"], answer: 1, explain: "After a superlative: de." }
  - { prompt: "___ (tú, hacer) los deberes ahora mismo.", options: ["Hace", "Haz", "Haga"], answer: 1, explain: "Irregular tú imperative: haz." }
  - { prompt: "Señor López, ___ (sentarse), por favor.", options: ["siéntate", "siéntese", "sentaos"], answer: 1, explain: "usted imperative of a reflexive verb: siéntese." }
  - { prompt: "Este regalo es ___ mi madre.", options: ["por", "para", "a"], answer: 1, explain: "Recipient: para." }
  - { prompt: "No fuimos a la playa ___ la lluvia.", options: ["por", "para", "de"], answer: 0, explain: "Cause: por." }
  - { prompt: "Vivo en Valencia ___ tres años.", options: ["desde", "desde hace", "hace"], answer: 1, explain: "A duration needs desde hace." }
  - { prompt: "Me ___ los pies.", options: ["duele", "duelen", "dolor"], answer: 1, explain: "Plural subject: duelen." }
  - { prompt: "Yo en tu lugar ___ (ir) al médico.", options: ["iré", "iría", "iba"], answer: 1, explain: "Hypothetical advice: conditional." }
  - { prompt: "No hay ___ en casa.", options: ["alguien", "nadie", "alguno"], answer: 1, explain: "Negative sentence: nadie." }
  - { prompt: "Estaba ___ cuando llamaste.", options: ["duchándome", "ducharme", "me ducho"], answer: 0, explain: "estar + gerund for an action in progress." }
  - { prompt: "___ de llegar a casa.", options: ["Acabo", "Acabé", "Acabaré"], answer: 0, explain: "acabo de + infinitive = I have just." }
writing:
  prompt: "Write an email to a friend about a trip you took last year: where you went, how you travelled, what you did each day, something unexpected that happened, and whether you would go back. Use the preterite and the imperfect, and at least one sentence with the conditional."
  minWords: 100
  modelAnswer: |
    ¡Hola, Marta! ¿Qué tal? Te escribo para contarte mi viaje a Lisboa del año pasado. Fui con mi hermano en autobús porque los vuelos eran muy caros. Llegamos un viernes por la noche y nos alojamos en un albergue pequeño del centro.

    El sábado hacía muy buen tiempo, así que paseamos por el barrio antiguo, comimos pescado y subimos al castillo. Mientras hacíamos fotos, un chico nos robó la cartera. ¡Qué susto! Fuimos a la policía y, al final, no fue tan grave porque llevaba poco dinero.

    El domingo visitamos un museo y por la tarde cogimos el autobús de vuelta. Estábamos cansados, pero contentos. Lisboa me encantó: la gente era amable y la comida, deliciosa. Volvería sin ninguna duda, pero la próxima vez tendría más cuidado con la cartera. ¿Vendrías conmigo? Un abrazo, Carlos.
  checklist:
    - "I used the preterite for completed events (fui, llegamos, comimos) and the imperfect for background and descriptions (hacía, era, llevaba)."
    - "I used at least one past time marker (el año pasado, el sábado, al final) and one connector (así que, mientras, porque)."
    - "I described something unexpected with the preterite and explained the context with the imperfect."
    - "I used the conditional at least once (volvería, tendría, vendrías)."
    - "I used object pronouns correctly (me encantó, nos robó, te escribo)."
    - "I checked verb endings, accents (fuí is wrong; fui is right; hacía needs a tilde) and ¿? ¡! marks."
