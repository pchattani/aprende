      - { es: "老細對我嘅工作好滿意。", en: "The boss is very happy with my work.", altEs: ["老細好滿意我嘅工作。"], grammar: [g.ge-possessive], vocab: [w.mun5-ji3, w.gung1-zok3] }
      - { es: "一個人喺香港，有時好寂寞。", en: "On my own in Hong Kong, I sometimes feel lonely.", altEs: ["一個人喺香港，有時會好寂寞。"], grammar: [g.frequency-adverbs], vocab: [w.zik6-mok6, w.jau5-si4] }
      - { es: "我愛香港，但係我憎塞車。", en: "I love Hong Kong, but I hate traffic jams.", altEs: ["我好愛香港，但係好憎塞車。"], grammar: [g.adjective-predicates], vocab: [w.oi3, w.zang1, w.sak1-ce1] }
      - { es: "佢今日好奇怪，成日都唔講嘢。", en: "He's acting strange today, he's hardly said a word all day.", altEs: ["佢今日好奇怪，成日唔講嘢。"], grammar: [g.adjective-predicates], vocab: [w.kei4-gwaai3, w.gong2-je5] }
      - { es: "呢個問題好複雜，唔係咁簡單。", en: "This problem is complicated, it's not that simple.", altEs: ["呢個問題好複雜，冇咁簡單。"], grammar: [g.mou-gam-not-as], vocab: [w.fuk1-zaap6, w.gaan2-daan1] }
      - { es: "學廣東話好有用。", en: "Learning Cantonese is really useful.", altEs: ["學廣東話真係好有用。"], grammar: [g.adjective-predicates], vocab: [w.jau5-jung6] }
      - { es: "佢好醒目，乜都學得好快。", en: "She's really sharp, she picks everything up quickly.", altEs: ["佢好醒目，學乜都好快。"], grammar: [g.dak-descriptive], vocab: [w.sing2-muk6, w.mat1-dou1] }
      - { es: "唔好話自己蠢，你好叻㗎。", en: "Don't call yourself stupid, you're really clever.", altEs: ["唔好話自己蠢，你好叻。"], grammar: [g.m-hou-dont], vocab: [w.ceon2, w.lek1] }
      - { es: "我真係好傻，又唔記得帶鎖匙。", en: "I'm so silly, I forgot my keys again.", altEs: ["我好傻呀，又唔記得帶鎖匙。"], grammar: [g.zoi-vs-jau], vocab: [w.so4, w.so2-si4] }
      - { es: "佢好怕醜，好少同人講嘢。", en: "He's very shy, he rarely talks to people.", altEs: ["佢好怕醜，好少同人傾偈。"], grammar: [g.frequency-adverbs], vocab: [w.paa3-cau2] }
      - { es: "我媽媽好細心，乜都記得。", en: "My mum is very thoughtful, she remembers everything.", altEs: ["我阿媽好細心，乜都記得。"], grammar: [g.adjective-predicates], vocab: [w.sai3-sam1, w.gei3-dak1] }
      - { es: "佢脾氣好好，又好友善。", en: "She's good-tempered and very friendly.", altEs: ["佢脾氣好好，仲好友善。"], grammar: [g.zoi-vs-jau], vocab: [w.pei4-hei3, w.jau5-sin6] }
      - { es: "週末同屋企人一齊最重要。", en: "Being with family at the weekend matters most.", altEs: ["週末同屋企人一齊係最重要嘅。"], grammar: [g.zeoi-superlative], vocab: [w.zung6-jiu3, w.uk1-kei2-jan4] }
      - { es: "三年前我嚟咗香港。", en: "I came to Hong Kong three years ago.", altEs: ["我三年前嚟咗香港。"], grammar: [g.ji-cin-ji-hau], vocab: [w.cin4], error: { wrong: "前三年我嚟咗香港。", explain: "'Ago' is 前 after the time period: 三年前. 前三年 means 'the first three years'.", grammar: g.ji-cin-ji-hau } }
      - { es: "我好開心。", en: "I'm very happy.", altEs: ["我好高興。"], grammar: [g.adjective-predicates], vocab: [w.hoi1-sam1], transform: { instruction: "Say you were happy after seeing her: 見到佢之後…", answer: "見到佢之後，我好開心。", alt: ["見到佢之後我好開心。", "我見到佢之後好開心。"], en: "After seeing her, I was very happy." } }
      - { es: "我好緊張。", en: "I'm very nervous.", altEs: ["我好緊張呀。"], grammar: [g.adjective-predicates], vocab: [w.gan2-zoeng1], transform: { instruction: "Say it was before the exam: 考試之前…", answer: "考試之前，我好緊張。", alt: ["考試之前我好緊張。", "我考試之前好緊張。"], en: "I was very nervous before the exam." } }
    exchanges:
      - q: { es: "你個週末點呀？", en: "How was your weekend?" }
        a: { es: "好開心，去咗九龍寨城公園行吓。", en: "Great, I went for a walk in Kowloon Walled City Park." }
        alt: ["好悶，成日落雨。", "幾好。"]
        grammar: [g.zo-perfective]
        vocab: [w.zau1-mut6]
      - q: { es: "考試之前你緊唔緊張呀？", en: "Were you nervous before the exam?" }
        a: { es: "好緊張，考完先至放心。", en: "Very, I only relaxed once it was over." }
