id: a2.u03
title: "Quand j'étais petit, à Étretat"
lessons:
  - id: a2.u03.l1
    title: "Quand j'étais petit"
    teach: [g.imparfait-forms]
    tip: "Imparfait stem = nous form minus -ons (nous habitons → habit-), + -ais, -ais, -ait, -ions, -iez, -aient. Only être is irregular: j'étais."
    vocab: [w.enfance, w.enfant-unique, w.petit-fils, w.petite-fille, w.petits-enfants, w.aîné, w.cadet, w.grandir, w.village, w.sage, w.bavard, w.paresseux, w.curieux, w.courageux, w.bête, w.laid, w.jouet, w.poupée, w.ballon, w.mamie, w.papi]
    sentences:
      - { es: "Quand j'étais petit, j'habitais à Étretat.", en: "When I was little, I lived in Étretat.", altEs: ["Quand j'étais petite, j'habitais à Étretat.", "J'habitais à Étretat quand j'étais petit."], altEn: ["When I was a child, I lived in Étretat."], grammar: [g.imparfait-forms, g.imparfait-uses], vocab: [] }
      - { es: "Mon grand-père travaillait au port.", en: "My grandfather worked at the harbour.", altEs: ["Mon grand-père travaillait sur le port."], altEn: ["My grandfather used to work at the port."], grammar: [g.imparfait-forms], vocab: [w.port] }
      - { es: "Nous habitions dans un petit village près de la mer.", en: "We lived in a little village near the sea.", altEs: ["On habitait dans un petit village près de la mer."], altEn: ["We used to live in a small village by the sea."], grammar: [g.imparfait-forms], vocab: [w.village, w.mer],
          transform: { instruction: "Change to 'je'", answer: "J'habitais dans un petit village près de la mer." } }
      - { es: "J'étais enfant unique, mais j'avais beaucoup de cousins.", en: "I was an only child, but I had lots of cousins.", altEs: ["J'étais fille unique, mais j'avais beaucoup de cousins.", "J'étais fils unique, mais j'avais beaucoup de cousins."], grammar: [g.imparfait-forms], vocab: [w.enfant-unique] }
      - { es: "Ma sœur aînée était très sage, et moi, j'étais très bavard.", en: "My older sister was very well behaved, and I was very talkative.", altEs: ["Ma sœur aînée était très sage, et moi, j'étais très bavarde.", "Ma sœur aînée était très sage et moi, j'étais très bavard."], grammar: [g.imparfait-forms, g.adjective-agreement], vocab: [w.aîné, w.sage, w.bavard] }
      - { es: "Mon frère cadet était curieux de tout.", en: "My younger brother was curious about everything.", altEs: ["Mon petit frère était curieux de tout."], grammar: [g.imparfait-forms], vocab: [w.cadet, w.curieux] }
      - { es: "Tu avais des jouets préférés ?", en: "Did you have any favourite toys?", altEs: ["Est-ce que tu avais des jouets préférés ?", "Avais-tu des jouets préférés ?"], grammar: [g.imparfait-forms, g.yes-no-questions], vocab: [w.jouet] }
      - { es: "Ma sœur avait une vieille poupée, et moi, un ballon rouge.", en: "My sister had an old doll, and I had a red ball.", altEs: ["Ma sœur avait une vieille poupée et moi, un ballon rouge."], grammar: [g.imparfait-forms], vocab: [w.poupée, w.ballon] }
      - { es: "Nous finissions l'école à quatre heures et demie.", en: "We used to finish school at half past four.", altEs: ["On finissait l'école à quatre heures et demie."], grammar: [g.imparfait-forms, g.time-telling], vocab: [w.finir], note: "finir → nous finissons → je finissais." }
      - { es: "Mes grands-parents avaient six petits-enfants.", en: "My grandparents had six grandchildren.", grammar: [g.imparfait-forms], vocab: [w.petits-enfants] }
      - { es: "Mon père n'était pas paresseux : il commençait le travail à cinq heures.", en: "My father wasn't lazy: he started work at five.", altEs: ["Mon père n'était pas paresseux, il commençait le travail à cinq heures."], grammar: [g.imparfait-forms], vocab: [w.paresseux],
          error: { wrong: "Mon père n'était pas paresseux : il commencait le travail à cinq heures.", explain: "Before -ait, c becomes ç to keep the soft sound: il commençait.", grammar: g.imparfait-forms } }
      - { es: "J'étais petit, mais j'étais courageux !", en: "I was small, but I was brave!", altEs: ["J'étais petite, mais j'étais courageuse !"], grammar: [g.imparfait-forms, g.adjective-agreement], vocab: [w.courageux] }
      - { es: "On mangeait des crêpes tous les dimanches.", en: "We used to eat crêpes every Sunday.", altEs: ["Tous les dimanches, on mangeait des crêpes."], grammar: [g.imparfait-forms, g.on-nous], vocab: [], note: "manger keeps its e before a: je mangeais, but nous mangions.",
          transform: { instruction: "Change to 'nous'", answer: "Nous mangions des crêpes tous les dimanches.", alt: ["Tous les dimanches, nous mangions des crêpes."] } }
      - { es: "Ne sois pas bête : tout le monde était petit un jour !", en: "Don't be silly: everyone was little once!", altEs: ["Ne sois pas bête, tout le monde était petit un jour !"], grammar: [g.imparfait-forms, g.imperative], vocab: [w.bête] }
      - { es: "Ma mamie disait toujours : « Ce chien est laid, mais il est gentil. »", en: "My granny always used to say: 'This dog is ugly, but he's kind.'", altEs: ["Mamie disait toujours : « Ce chien est laid, mais il est gentil. »"], grammar: [g.imparfait-forms], vocab: [w.mamie, w.laid] }
      - { es: "Mon petit-fils et ma petite-fille veulent toujours voir mes photos d'enfance.", en: "My grandson and granddaughter always want to see my childhood photos.", grammar: [g.modal-verbs], vocab: [w.petit-fils, w.petite-fille, w.enfance] }
    exchanges:
      - q: { es: "Où est-ce que tu habitais quand tu étais petit ?", en: "Where did you live when you were little?" }
        a: { es: "J'habitais dans un village en Normandie.", en: "I lived in a village in Normandy." }
        alt: ["À Étretat.", "J'habitais à Paris."]
        grammar: [g.imparfait-forms]
        vocab: [w.village]
      - q: { es: "Tu avais des frères et sœurs ?", en: "Did you have any brothers and sisters?" }
        a: { es: "Non, j'étais enfant unique.", en: "No, I was an only child." }
        alt: ["Oui, une sœur aînée.", "Oui, deux frères cadets."]
        grammar: [g.imparfait-forms]
        vocab: [w.enfant-unique, w.aîné, w.cadet]
      - q: { es: "Comment étais-tu à l'école ?", en: "What were you like at school?" }
        a: { es: "J'étais très bavard, mais pas paresseux !", en: "I was very talkative, but not lazy!" }
        alt: ["J'étais sage.", "J'étais très curieuse."]
        grammar: [g.imparfait-forms]
        vocab: [w.bavard, w.paresseux]
      - q: { es: "Quel était ton jouet préféré ?", en: "What was your favourite toy?" }
        a: { es: "Un vieux ballon rouge.", en: "An old red ball." }
        alt: ["Ma poupée.", "Un petit bateau."]
        grammar: [g.imparfait-forms, g.quel]
        vocab: [w.jouet, w.ballon]
      - q: { es: "Tes grands-parents avaient combien de petits-enfants ?", en: "How many grandchildren did your grandparents have?" }
        a: { es: "Ils avaient huit petits-enfants.", en: "They had eight grandchildren." }
        alt: ["Huit.", "Beaucoup !"]
        grammar: [g.imparfait-forms]
        vocab: [w.petits-enfants]
    texts:
      - title: "Souvenirs de Mamie"
        es: ["Quand j'étais petite, j'habitais à Étretat.", "Mon père travaillait au port et ma mère vendait du poisson.", "J'étais enfant unique, mais je n'étais jamais seule."]
        en: ["When I was little, I lived in Étretat.", "My father worked at the harbour and my mother sold fish.", "I was an only child, but I was never alone."]
        grammar: [g.imparfait-forms]
        vocab: [w.port, w.enfant-unique]
      - title: "Une photo d'enfance"
        es: ["Sur cette photo, j'avais six ans.", "J'avais un ballon rouge et je n'aimais pas les photos !", "Mon frère cadet était encore bébé."]
        en: ["In this photo I was six.", "I had a red ball and I didn't like photos!", "My younger brother was still a baby."]
        grammar: [g.imparfait-forms]
        vocab: [w.enfance, w.ballon, w.cadet]
    spicy:
      - { es: "Avant toi, j'étais sage. Maintenant, je suis seulement très curieux.", en: "Before you, I was well behaved. Now I'm just very curious.", altEs: ["Avant toi, j'étais sage. Maintenant, je suis seulement très curieuse."], grammar: [g.imparfait-forms], vocab: [w.sage, w.curieux] }
      - { es: "Tu étais déjà aussi mignon à vingt ans ?", en: "Were you already this cute at twenty?", altEs: ["Tu étais déjà aussi mignonne à vingt ans ?"], grammar: [g.imparfait-forms], vocab: [] }
      - { es: "Je n'étais pas paresseux le dimanche matin : je préparais le petit-déjeuner pour deux.", en: "I wasn't lazy on Sunday mornings: I made breakfast for two.", altEs: ["Je n'étais pas paresseuse le dimanche matin : je préparais le petit-déjeuner pour deux."], grammar: [g.imparfait-forms], vocab: [w.paresseux] }
      - { es: "Ma mamie disait toujours : « Choisis quelqu'un de bavard, tu ne vas jamais t'ennuyer. »", en: "My granny always used to say: 'Choose someone chatty, you'll never be bored.'", grammar: [g.imparfait-forms], vocab: [w.mamie, w.bavard] }
      - { es: "À vingt ans, j'étais timide ; à trente ans, j'étais courageux ; ce soir, je t'invite à danser.", en: "At twenty I was shy; at thirty I was brave; tonight I'm asking you to dance.", altEs: ["À vingt ans, j'étais timide ; à trente ans, j'étais courageuse ; ce soir, je t'invite à danser."], grammar: [g.imparfait-forms], vocab: [w.courageux] }
  - id: a2.u03.l2
    title: "Tous les étés, on allait à la plage"
    teach: [g.imparfait-uses]
    tip: "Imparfait for habits (used to / would), descriptions and things in progress: tous les étés, on allait à la plage."
    vocab: [w.habitude, w.à-l-époque, w.époque, w.colonie-de-vacances, w.se-baigner, w.pêcher, w.pêche, w.grimper, w.sauter, w.cerf-volant, w.château-de-sable, w.coquillage, w.maillot-de-bain, w.crème-solaire, w.lunettes-de-soleil, w.parasol, w.tongs, w.glacier]
    sentences:
      - { es: "Tous les étés, nous allions à la plage d'Étretat.", en: "Every summer we used to go to the beach at Étretat.", altEs: ["Tous les étés, on allait à la plage d'Étretat.", "Chaque été, nous allions à la plage d'Étretat."], altEn: ["Every summer we would go to the beach at Étretat."], grammar: [g.imparfait-uses], vocab: [w.plage],
          error: { wrong: "Tous les étés, nous sommes allés à la plage d'Étretat.", explain: "A repeated habit in the past (tous les étés) takes the imparfait: nous allions.", grammar: g.imparfait-uses } }
      - { es: "D'habitude, on se baignait le matin, quand la mer était calme.", en: "We usually went swimming in the morning, when the sea was calm.", altEs: ["D'habitude, nous nous baignions le matin, quand la mer était calme."], grammar: [g.imparfait-uses], vocab: [w.se-baigner, w.mer] }
      - { es: "Mon père pêchait pendant des heures sur le port.", en: "My father would fish for hours at the harbour.", altEs: ["Mon père pêchait des heures sur le port."], grammar: [g.imparfait-uses], vocab: [w.pêcher, w.port] }
      - { es: "À l'époque, il n'y avait pas de téléphones portables.", en: "Back then, there were no mobile phones.", altEs: ["À l'époque, il n'y avait pas de portables."], altEn: ["At the time, there were no mobile phones."], grammar: [g.imparfait-uses, g.c-etait], vocab: [w.à-l-époque] }
      - { es: "À Étretat, on ne faisait pas de châteaux de sable : il n'y a pas de sable, seulement des pierres !", en: "In Étretat we didn't make sandcastles: there's no sand, only stones!", altEs: ["À Étretat, on ne faisait pas de châteaux de sable, il n'y a pas de sable, seulement des pierres !"], grammar: [g.imparfait-uses, g.de-after-negation], vocab: [w.château-de-sable, w.sable, w.pierre], note: "Étretat's beach is made of pebbles (des galets)." }
      - { es: "On cherchait des coquillages et on sautait dans les vagues.", en: "We looked for shells and jumped in the waves.", altEs: ["Nous cherchions des coquillages et nous sautions dans les vagues."], grammar: [g.imparfait-uses], vocab: [w.coquillage, w.sauter, w.vague] }
      - { es: "Mon frère grimpait partout, et ma mère avait toujours peur.", en: "My brother used to climb everywhere, and my mother was always scared.", altEs: ["Mon frère grimpait partout et ma mère avait toujours peur."], grammar: [g.imparfait-uses, g.avoir-expressions], vocab: [w.grimper] }
      - { es: "Quand il y avait du vent, nous faisions du cerf-volant sur la falaise.", en: "When it was windy, we flew kites on the cliff.", altEs: ["Quand il y avait du vent, on faisait du cerf-volant sur la falaise."], grammar: [g.imparfait-uses], vocab: [w.cerf-volant, w.falaise] }
      - { es: "Tu mettais de la crème solaire ? — Non, jamais ! J'étais tout rouge le soir.", en: "Did you use to put on sun cream? — No, never! I was bright red in the evening.", altEs: ["Tu mettais de la crème solaire ? — Non, jamais ! J'étais toute rouge le soir."], grammar: [g.imparfait-uses], vocab: [w.crème-solaire] }
      - { es: "J'avais toujours mes lunettes de soleil et mes tongs.", en: "I always had my sunglasses and my flip-flops.", altEs: ["J'avais toujours mes tongs et mes lunettes de soleil."], grammar: [g.imparfait-uses], vocab: [w.lunettes-de-soleil, w.tongs] }
      - { es: "À cette époque, la pêche était très importante à Étretat.", en: "At that time, fishing was very important in Étretat.", altEs: ["À l'époque, la pêche était très importante à Étretat."], grammar: [g.imparfait-uses], vocab: [w.époque, w.pêche], note: "Étretat was a fishing village before it became a seaside resort in the 19th century." }
      - { es: "Le glacier passait sur la plage à quatre heures.", en: "The ice-cream seller came along the beach at four o'clock.", altEs: ["Le glacier passait sur la plage vers quatre heures."], grammar: [g.imparfait-uses], vocab: [w.glacier] }
      - { es: "En juillet, j'allais en colonie de vacances en Bretagne.", en: "In July I used to go to summer camp in Brittany.", altEs: ["En juillet, j'allais en colo en Bretagne."], grammar: [g.imparfait-uses], vocab: [w.colonie-de-vacances],
          transform: { instruction: "Change to 'nous'", answer: "En juillet, nous allions en colonie de vacances en Bretagne.", alt: ["En juillet, on allait en colonie de vacances en Bretagne."] } }
      - { es: "C'était une habitude : le dimanche, on mangeait toujours chez Mamie.", en: "It was a habit: on Sundays we always ate at Granny's.", altEs: ["C'était une habitude, le dimanche, on mangeait toujours chez Mamie."], grammar: [g.imparfait-uses, g.c-etait], vocab: [w.habitude, w.mamie] }
      - { es: "Pendant que mon père pêchait, je dormais au soleil.", en: "While my father was fishing, I was sleeping in the sun.", altEs: ["Je dormais au soleil pendant que mon père pêchait."], grammar: [g.imparfait-uses], vocab: [w.pêcher, w.pendant-que],
          transform: { instruction: "Change 'je' to 'nous'", answer: "Pendant que mon père pêchait, nous dormions au soleil.", alt: ["Nous dormions au soleil pendant que mon père pêchait."] } }
      - { es: "Mets ton maillot de bain : on va se baigner !", en: "Put your swimsuit on: we're going for a swim!", altEs: ["Mets ton maillot de bain, on va se baigner !"], grammar: [g.imperative, g.futur-proche], vocab: [w.maillot-de-bain, w.se-baigner], variant: "Québec: un costume de bain." }
    exchanges:
      - q: { es: "Qu'est-ce que tu faisais pendant les vacances ?", en: "What did you use to do in the holidays?" }
        a: { es: "J'allais à la plage tous les jours.", en: "I went to the beach every day." }
        alt: ["Je me baignais.", "J'allais en colonie de vacances."]
        grammar: [g.imparfait-uses]
        vocab: [w.plage]
      - q: { es: "Vous alliez souvent à la pêche ?", en: "Did you often go fishing?" }
        a: { es: "Oui, avec mon grand-père, tous les samedis.", en: "Yes, with my grandfather, every Saturday." }
        alt: ["Oui, souvent.", "Non, jamais."]
        grammar: [g.imparfait-uses, g.frequency-adverbs]
        vocab: [w.pêche]
      - q: { es: "Tu te baignais même quand l'eau était froide ?", en: "Did you go swimming even when the water was cold?" }
        a: { es: "Oui, j'adorais ça !", en: "Yes, I loved it!" }
        alt: ["Non, jamais !", "Oui, toujours."]
        grammar: [g.imparfait-uses]
        vocab: [w.se-baigner]
      - q: { es: "À l'époque, il y avait beaucoup de touristes ?", en: "Were there a lot of tourists back then?" }
        a: { es: "Non, pas beaucoup. C'était calme.", en: "No, not many. It was quiet." }
        alt: ["Oui, déjà beaucoup.", "Non, très peu."]
        grammar: [g.imparfait-uses, g.c-etait]
        vocab: [w.à-l-époque]
      - q: { es: "Qu'est-ce que vous faisiez quand il pleuvait ?", en: "What did you do when it rained?" }
        a: { es: "On jouait aux cartes à la maison.", en: "We played cards at home." }
        alt: ["On lisait.", "On regardait la télé."]
        grammar: [g.imparfait-uses]
        vocab: []
    texts:
      - title: "Un été à Étretat"
        es: ["Tous les étés, nous louions une petite maison à Étretat.", "Le matin, on se baignait ; l'après-midi, on faisait du cerf-volant sur la falaise.", "Ma grand-mère restait sous le parasol et elle lisait."]
        en: ["Every summer we rented a little house in Étretat.", "In the morning we went swimming; in the afternoon we flew kites on the cliff.", "My grandmother stayed under the beach umbrella and read."]
        grammar: [g.imparfait-uses]
        vocab: [w.se-baigner, w.cerf-volant, w.parasol]
      - title: "Carte de colo"
        es: ["Chers parents, la colonie de vacances est super.", "Le matin, on se baigne et l'après-midi, on fait du vélo.", "N'oubliez pas : j'ai besoin de crème solaire !"]
        en: ["Dear Mum and Dad, summer camp is great.", "In the morning we swim and in the afternoon we go cycling.", "Don't forget: I need sun cream!"]
        grammar: [g.imperative]
        vocab: [w.colonie-de-vacances, w.crème-solaire]
    spicy:
      - { es: "À l'époque, tu m'appelais tous les soirs. Maintenant, tu m'envoies seulement des messages.", en: "Back then you called me every evening. Now you only send me messages.", grammar: [g.imparfait-uses], vocab: [w.à-l-époque] }
      - { es: "Avant, je passais mes samedis sur la plage ; maintenant, je les passe avec toi.", en: "I used to spend my Saturdays on the beach; now I spend them with you.", grammar: [g.imparfait-uses], vocab: [w.plage] }
      - { es: "Tu te souviens ? Tu mettais de la crème solaire sur mon dos et je devenais tout rouge.", en: "Do you remember? You'd put sun cream on my back and I'd go bright red.", altEs: ["Tu te souviens ? Tu mettais de la crème solaire sur mon dos et je devenais toute rouge."], grammar: [g.imparfait-uses], vocab: [w.crème-solaire] }
      - { es: "Tu portais des lunettes de soleil et des tongs, et tu étais déjà la plus belle de la plage.", en: "You were wearing sunglasses and flip-flops, and you were already the most beautiful person on the beach.", altEs: ["Tu portais des lunettes de soleil et des tongs, et tu étais déjà le plus beau de la plage."], grammar: [g.imparfait-uses], vocab: [w.lunettes-de-soleil, w.tongs] }
      - { es: "Tous les soirs, on prenait une glace au port. C'était notre petite habitude.", en: "Every evening we had an ice cream at the harbour. It was our little habit.", grammar: [g.imparfait-uses, g.c-etait], vocab: [w.habitude, w.port] }
  - id: a2.u03.l3
    title: "C'était magnifique !"
    teach: [g.c-etait]
    tip: "Three frames for describing the past: c'était (it was), il y avait (there was/were), il faisait (the weather was)."
    vocab: [w.mer, w.falaise, w.craie, w.pierre, w.sable, w.vague, w.aiguille, w.arche, w.endroit, w.sculpter, w.côte, w.port, w.phare, w.mouette, w.oiseau]
    sentences:
      - { es: "C'était magnifique : la mer était bleue et les falaises étaient toutes blanches.", en: "It was magnificent: the sea was blue and the cliffs were completely white.", altEs: ["C'était magnifique, la mer était bleue et les falaises étaient toutes blanches."], grammar: [g.c-etait, g.imparfait-uses], vocab: [w.mer, w.falaise] }
      - { es: "Il faisait beau, mais il y avait beaucoup de vent sur la côte.", en: "The weather was fine, but there was a lot of wind on the coast.", altEs: ["Il faisait beau mais il y avait beaucoup de vent sur la côte."], altEn: ["It was sunny, but it was very windy on the coast."], grammar: [g.c-etait], vocab: [w.côte] }
      - { es: "Il y avait du monde sur la plage ? — Oui, il y avait beaucoup de touristes.", en: "Were there many people on the beach? — Yes, there were lots of tourists.", altEs: ["Il y avait du monde à la plage ? — Oui, il y avait beaucoup de touristes."], grammar: [g.c-etait], vocab: [w.plage],
          error: { wrong: "Il y avait du monde sur la plage ? — Oui, il y avaient beaucoup de touristes.", explain: "il y avait never changes, even before a plural.", grammar: g.c-etait } }
      - { es: "La mer et le vent ont sculpté les falaises de craie.", en: "The sea and the wind have carved the chalk cliffs.", altEs: ["Le vent et la mer ont sculpté les falaises de craie."], grammar: [g.passe-compose-avoir], vocab: [w.sculpter, w.craie, w.falaise] }
      - { es: "De la plage, on voyait l'Aiguille et une grande arche dans la falaise.", en: "From the beach you could see the Needle and a big arch in the cliff.", altEs: ["Depuis la plage, on voyait l'Aiguille et une grande arche dans la falaise."], grammar: [g.imparfait-uses], vocab: [w.aiguille, w.arche], note: "The Aiguille (Needle) is a tall rock standing in the sea beside the Porte d'Aval, a natural arch." }
      - { es: "C'était comment, Étretat ? — C'était génial !", en: "What was Étretat like? — It was great!", altEs: ["Comment c'était, Étretat ? — C'était génial !", "C'était comment, Étretat ? — C'était super !"], altEn: ["How was Étretat? — It was brilliant!"], grammar: [g.c-etait], vocab: [],
          transform: { instruction: "Answer that it was boring", answer: "C'était ennuyeux.", alt: ["C'était nul.", "C'était très ennuyeux."] } }
      - { es: "Il était sept heures du soir et le soleil était encore haut.", en: "It was seven in the evening and the sun was still high.", altEs: ["Il était dix-neuf heures et le soleil était encore haut."], grammar: [g.c-etait], vocab: [w.haut] }
      - { es: "Il faisait froid et l'eau était à quinze degrés !", en: "It was cold and the water was fifteen degrees!", altEs: ["Il faisait froid et l'eau était à 15 degrés !"], grammar: [g.c-etait, g.weather], vocab: [] }
      - { es: "Il y avait des mouettes partout, même sur les tables du café !", en: "There were seagulls everywhere, even on the café tables!", altEs: ["Il y avait des mouettes partout, même sur les tables du café."], grammar: [g.c-etait], vocab: [w.mouette] }
      - { es: "Le phare était vieux, mais il fonctionnait encore.", en: "The lighthouse was old, but it still worked.", altEs: ["Le phare était vieux mais il fonctionnait toujours."], grammar: [g.imparfait-uses], vocab: [w.phare] }
      - { es: "C'était un endroit très calme, avec des oiseaux et des petits bateaux.", en: "It was a very peaceful place, with birds and little boats.", altEs: ["C'était un endroit très calme avec des oiseaux et des petits bateaux."], grammar: [g.c-etait], vocab: [w.endroit, w.oiseau] }
      - { es: "Monet et Maupassant aimaient beaucoup cet endroit.", en: "Monet and Maupassant loved this place.", altEs: ["Maupassant et Monet aimaient beaucoup cet endroit."], grammar: [g.imparfait-uses], vocab: [w.endroit] }
      - { es: "Regarde cette photo : c'était l'été 1998, sur la plage d'Étretat.", en: "Look at this photo: it was the summer of 1998, on the beach at Étretat.", altEs: ["Regarde cette photo, c'était l'été 1998, sur la plage d'Étretat."], grammar: [g.c-etait, g.imperative], vocab: [w.plage] }
      - { es: "Les vagues étaient très hautes ce jour-là : c'était dangereux.", en: "The waves were very high that day: it was dangerous.", altEs: ["Les vagues étaient très hautes ce jour-là, c'était dangereux."], grammar: [g.c-etait], vocab: [w.vague, w.dangereux] }
