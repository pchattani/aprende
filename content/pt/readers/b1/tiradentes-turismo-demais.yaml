id: r.b1.tiradentes-turismo-demais
level: b1
title: "Tiradentes: turismo demais?"
kind: text
intro: A local news site asked readers whether tourism is good or bad for Tiradentes, a tiny colonial town in Minas Gerais. Here are five of the answers, full of opinions, doubts and reasons.
allow: [tiradentes, são, joão, del-rei, maria, fumaça, ok, cida, heloísa, otávio, guilherme, sílvia, bh]
paragraphs:
  - { es: "Tiradentes tem pouco mais de sete mil habitantes, mas recebe centenas de milhares de turistas por ano. Nos fins de semana e nos festivais de cinema, de gastronomia e de música, as ruas de pedra ficam lotadas. Perguntamos aos nossos leitores: o turismo é bom ou ruim para a cidade? Aqui estão algumas respostas.", en: "Tiradentes has just over seven thousand inhabitants, but receives hundreds of thousands of tourists a year. At weekends and during the film, food and music festivals, the stone streets are packed. We asked our readers: is tourism good or bad for the town? Here are some of the answers." }
  - { es: "Heloísa, 54 anos, dona de pousada: «Acho que o turismo salvou Tiradentes. Quando eu era criança, a cidade era pobre e os jovens iam embora para BH ou São Paulo porque não havia trabalho. Hoje, quase todas as famílias vivem do turismo: pousadas, restaurantes, lojas de artesanato. Não acredito que alguém queira voltar àquela época. É claro que há problemas, mas, sem os turistas, as casas coloniais estariam caindo.»", en: "Heloísa, 54, guesthouse owner: 'I think tourism saved Tiradentes. When I was a child, the town was poor and young people left for BH or São Paulo because there was no work. Today almost every family lives from tourism: guesthouses, restaurants, craft shops. I don't believe anyone wants to go back to that time. Of course there are problems, but without the tourists the colonial houses would be falling down.'" }
  - { es: "Otávio, 67 anos, aposentado: «Eu nasci aqui e não reconheço mais a minha cidade. No centro histórico, quase não moram mais famílias da cidade: as casas viraram lojas e restaurantes caros. Um café na praça custa o mesmo que em São Paulo! Duvido que os moradores ganhem tanto quanto os donos de fora. Não acho que o turismo seja ruim, mas acho que deveria ter mais controle.»", en: "Otávio, 67, retired: 'I was born here and I don't recognise my town any more. In the historic centre, hardly any local families live there now: the houses have turned into shops and expensive restaurants. A coffee in the square costs the same as in São Paulo! I doubt the residents earn as much as the owners from outside. I don't think tourism is bad, but I think there should be more control.'" }
  - { es: "Sílvia, 29 anos, guia turística: «Na minha opinião, o problema não é o número de turistas, é o tipo de turismo. Muita gente vem só no sábado, tira foto, almoça e vai embora, sem conhecer nada da história. Eu sempre explico que a cidade tem o nome de um herói da Inconfidência, que nasceu na região. Também recomendo o passeio de Maria Fumaça até São João del-Rei: é um trem a vapor do século dezenove. É provável que, se as pessoas conhecessem mais a cultura local, respeitassem mais a cidade.»", en: "Sílvia, 29, tour guide: 'In my opinion, the problem isn't the number of tourists, it's the type of tourism. Lots of people come just on Saturday, take photos, have lunch and leave, without learning anything about the history. I always explain that the town is named after a hero of the Inconfidência, who was born in the region. I also recommend the Maria Fumaça trip to São João del-Rei: it's a steam train from the nineteenth century. It's likely that if people knew more about the local culture, they'd respect the town more.'" }
  - { es: "Guilherme, 35 anos, turista de Belo Horizonte: «Eu venho aqui pelo menos duas vezes por ano e entendo as críticas, mas não concordo que os turistas sejam os culpados. Nós gastamos dinheiro aqui, e esse dinheiro fica na cidade. Talvez a prefeitura devesse investir mais em transporte e estacionamento, porque o trânsito no centro é um caos. Seja como for, Tiradentes continua sendo um dos lugares mais charmosos de Minas, e eu vou continuar voltando.»", en: "Guilherme, 35, tourist from Belo Horizonte: 'I come here at least twice a year and I understand the criticism, but I don't agree that tourists are to blame. We spend money here, and that money stays in the town. Maybe the town hall should invest more in transport and parking, because the traffic in the centre is chaos. Be that as it may, Tiradentes is still one of the most charming places in Minas, and I'm going to keep coming back.'" }
  - { es: "Cida, 19 anos, estudante: «Eu trabalho num restaurante nos fins de semana para pagar a faculdade. Sem o turismo, eu não teria esse emprego. Mas é verdade que é difícil para a gente jovem continuar morando aqui, porque os aluguéis subiram muito. Espero que a cidade encontre um equilíbrio. Seria triste se Tiradentes virasse um lugar só para visitantes, sem vida própria.»", en: "Cida, 19, student: 'I work in a restaurant at weekends to pay for university. Without tourism, I wouldn't have this job. But it's true that it's hard for young people to keep living here, because rents have gone up a lot. I hope the town finds a balance. It would be sad if Tiradentes became a place just for visitors, with no life of its own.'" }
  - { es: "E você, o que acha? Deixe a sua opinião nos comentários. Lembramos que comentários ofensivos serão apagados.", en: "And you, what do you think? Leave your opinion in the comments. Please note that offensive comments will be deleted." }
questions:
  - { q: "Segundo a Heloísa, como era Tiradentes antes do turismo?", options: ["Uma cidade rica e cheia de jovens", "Uma cidade pobre, de onde os jovens iam embora", "Uma cidade muito grande"], answer: 1, explain: "«A cidade era pobre e os jovens iam embora para BH ou São Paulo porque não havia trabalho.»" }
  - { q: "Qual é a principal reclamação do Otávio?", options: ["As famílias locais saíram do centro histórico e tudo ficou caro", "Não há turistas suficientes", "O trem é muito lento"], answer: 0, explain: "He says hardly any local families live in the centre now and «um café na praça custa o mesmo que em São Paulo!»" }
  - { q: "Para a Sílvia, qual é o verdadeiro problema?", options: ["O número de turistas", "O tipo de turismo", "O preço dos hotéis"], answer: 1, explain: "«O problema não é o número de turistas, é o tipo de turismo.»" }
  - { q: "O que é a Maria Fumaça?", options: ["Uma guia turística", "Um trem a vapor do século dezenove", "Um festival de cinema"], answer: 1, explain: "«É um trem a vapor do século dezenove» that runs to São João del-Rei." }
  - { q: "O que o Guilherme acha que a prefeitura deveria fazer?", options: ["Proibir os turistas no sábado", "Investir mais em transporte e estacionamento", "Fechar o centro histórico"], answer: 1, explain: "«Talvez a prefeitura devesse investir mais em transporte e estacionamento.»" }
