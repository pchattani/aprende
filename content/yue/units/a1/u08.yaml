        vocab: [w.joeng5]
    texts:
      - title: "問題"
        es: ["你叫咩名呀？", "你住喺邊度呀？", "你有冇兄弟姊妹呀？", "你幾時生日呀？"]
        en: ["What's your name?", "Where do you live?", "Do you have any brothers or sisters?", "When's your birthday?"]
