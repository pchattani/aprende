      - { es: "考試之前我好緊張。", en: "I was really nervous before the exam.", altEs: ["考試之前，我好緊張。", "考試前我好緊張。"], grammar: [g.ji-cin-ji-hau], vocab: [w.gan2-zoeng1, w.haau2-si5] }
      - { es: "去旅行之前，我哋都好興奮。", en: "Before the trip, we were all really excited.", altEs: ["去旅行之前我哋都好興奮。"], grammar: [g.ji-cin-ji-hau, g.dou-also], vocab: [w.hing1-fan5, w.leoi5-hang4] }
      - { es: "我好失望，因為個演唱會取消咗。", en: "I'm really disappointed because the concert was cancelled.", altEs: ["個演唱會取消咗，我好失望。"], grammar: [g.jan-wai-so-ji], vocab: [w.sat1-mong6, w.jin2-coeng3-wui2] }
