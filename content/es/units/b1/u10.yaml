id: b1.u10
title: Probabilidad e hipótesis
lessons:
  - id: b1.u10.l1
    title: ¿Dónde estará?
    teach: [g.future-conditional-probability]
    vocab: [w.misterio, w.misterioso, w.pista, w.sospechoso, w.testigo, w.desconocido, w.averiguar, w.adivinar, w.apagado, w.encendido, w.sombra, w.huella, w.a-estas-horas, w.silencio, w.vigilar, w.perseguir, w.desaparecido, w.seguro-que, w.quien-sabe, w.sorprendido]
    tip: "A guess about now takes the future: Estará en casa = he's probably at home. A guess about the recent past takes the future perfect: Habrá salido."
    sentences:
      - { es: "Marta tiene el móvil apagado. Estará en una reunión.", en: "Marta's phone is off. She's probably in a meeting.", altEs: ["Marta tiene el móvil apagado. Seguro que está en una reunión.", "Marta tiene el móvil apagado; estará en una reunión."], grammar: [g.future-conditional-probability], vocab: [w.apagado, w.movil, w.reunion] }
      - { es: "¿Qué hora será? Supongo que serán las once.", en: "What time can it be? I suppose it's about eleven.", altEs: ["¿Qué hora será? Serán las once, supongo."], grammar: [g.future-conditional-probability], vocab: [w.suponer, w.hora] }
      - { es: "La luz del vecino está encendida a estas horas; estará trabajando todavía.", en: "The neighbour's light is on at this time of night; he's probably still working.", grammar: [g.future-conditional-probability], vocab: [w.encendido, w.a-estas-horas, w.vecino, w.luz] }
      - { es: "Hay huellas en el jardín. ¿De quién serán?", en: "There are footprints in the garden. Whose can they be?", grammar: [g.future-conditional-probability], vocab: [w.huella, w.jardin] }
      - { es: "El coche de la jefa no está; habrá salido a comer.", en: "The boss's car isn't there; she must have gone out for lunch.", altEs: ["El coche de la jefa no está; seguro que ha salido a comer."], grammar: [g.future-conditional-probability], vocab: [w.coche, w.jefe, w.salir], note: "Future perfect (habrá salido) = she has probably gone out." }
      - { es: "¿Dónde estarán mis llaves? Las tendré en el abrigo.", en: "Where can my keys be? I probably have them in my coat.", altEs: ["¿Dónde estarán mis llaves? Estarán en el abrigo."], grammar: [g.future-conditional-probability], vocab: [w.llave, w.abrigo] }
      - { es: "Ese desconocido lleva una hora vigilando el banco; estará esperando a alguien.", en: "That stranger has been watching the bank for an hour; he's probably waiting for someone.", grammar: [g.future-conditional-probability, g.verbal-periphrases], vocab: [w.desconocido, w.vigilar, w.banco, w.esperar] }
      - { es: "Al parecer, nadie sabe de quién es el perro que duerme en la puerta.", en: "Apparently, nobody knows whose dog it is that sleeps in the doorway.", grammar: [g.future-conditional-probability, g.indefinite-pronouns], vocab: [w.al-parecer, w.perro, w.puerta] }
      - { es: "Por lo visto, el tren tardará más de una hora; habrá habido un accidente.", en: "Apparently the train will take more than an hour; there must have been an accident.", grammar: [g.future-conditional-probability], vocab: [w.por-lo-visto, w.tardar, w.tren, w.accidente] }
      - { es: "Es probable que esté enfermo, porque hoy no ha venido a clase; todos estamos sorprendidos.", en: "He's probably ill, because he hasn't come to class today; we're all surprised.", grammar: [g.subjunctive-impersonal, g.future-conditional-probability], vocab: [w.probable, w.enfermo, w.clase, w.sorprendido] }
      - { es: "El gato desaparecido habrá vuelto ya; seguro que está dormido en algún sitio, en silencio.", en: "The missing cat has probably come back already; I bet he's asleep somewhere, in silence.", grammar: [g.future-conditional-probability], vocab: [w.desaparecido, w.seguro-que, w.silencio, w.gato, w.sitio] }
      - { es: "Alguien ha dejado la ventana abierta. ¿Quién habrá sido? Habrá que averiguarlo.", en: "Someone has left the window open. Who can it have been? We'll have to find out.", grammar: [g.future-conditional-probability], vocab: [w.ventana, w.averiguar, w.alguien] }
      - { es: "La policía comprueba las pistas una por una y persigue al sospechoso; quién sabe dónde estará ahora.", en: "The police are checking the clues one by one and chasing the suspect; who knows where he is now.", grammar: [g.future-conditional-probability], vocab: [w.comprobar, w.pista, w.perseguir, w.sospechoso, w.quien-sabe, w.policia] }
      - { es: "El testigo dice que vio una sombra sospechosa, pero será la oscuridad.", en: "The witness says he saw a suspicious shadow, but it's probably the darkness.", altEs: ["El testigo dice que vio una sombra sospechosa, pero seguro que era la oscuridad."], grammar: [g.future-conditional-probability, g.reported-speech-present], vocab: [w.testigo, w.sombra, w.sospechoso, w.oscuridad] }
      - { es: "Mi hermano no ha llegado; estará en un atasco.", en: "My brother hasn't arrived; he's probably stuck in a traffic jam.", altEs: ["Mi hermano no ha llegado; seguro que está en un atasco.", "Mi hermano no ha llegado; habrá un atasco."], grammar: [g.future-conditional-probability], vocab: [w.atasco, w.llegar], error: { wrong: "Mi hermano no ha llegado; estaría en un atasco.", explain: "A guess about now takes the future (estará); the conditional guesses about the past.", grammar: g.future-conditional-probability } }
      - { es: "Probablemente la profesora tiene unos cuarenta años.", en: "The teacher is probably about forty.", altEs: ["La profesora tendrá unos cuarenta años.", "Probablemente la profesora tenga unos cuarenta años."], grammar: [g.future-conditional-probability], vocab: [w.adivinar, w.profesor, w.ano], transform: { instruction: "Express the guess with the future tense", answer: "La profesora tendrá unos cuarenta años.", alt: ["Tendrá unos cuarenta años."] } }
    exchanges:
      - q: { es: "¿Dónde estará Marta? No contesta.", en: "Where can Marta be? She isn't answering." }
        a: { es: "Tendrá el móvil apagado; estará en una reunión.", en: "Her phone is probably off; she's probably in a meeting." }
        alt: ["Estará trabajando todavía.", "Quién sabe; habrá salido a comer."]
        grammar: [g.future-conditional-probability]
        vocab: [w.apagado, w.quien-sabe]
      - q: { es: "¿Qué hora será?", en: "What time can it be?" }
        a: { es: "Serán las once, más o menos.", en: "It's probably about eleven." }
        alt: ["No sé; serán las diez y media.", "Será tarde: ya no hay nadie en la calle."]
        grammar: [g.future-conditional-probability]
      - q: { es: "Hay huellas en el jardín. ¿De quién serán?", en: "There are footprints in the garden. Whose can they be?" }
        a: { es: "Serán del perro del vecino.", en: "They're probably the neighbour's dog's." }
        alt: ["Quién sabe; habrá entrado alguien.", "Serán de los niños, que jugaron ayer."]
        grammar: [g.future-conditional-probability]
        vocab: [w.huella, w.quien-sabe]
      - q: { es: "¿Por qué no ha venido Luis a clase?", en: "Why hasn't Luis come to class?" }
        a: { es: "Estará enfermo; ayer ya tenía mal aspecto.", en: "He's probably ill; yesterday he already looked unwell." }
        alt: ["Habrá perdido el autobús.", "Seguro que se ha quedado dormido."]
        grammar: [g.future-conditional-probability]
        vocab: [w.seguro-que]
      - q: { es: "Ese desconocido lleva una hora delante del banco.", en: "That stranger has been in front of the bank for an hour." }
        a: { es: "Estará esperando a alguien.", en: "He's probably waiting for someone." }
        alt: ["Será un testigo del robo de ayer.", "Quién sabe; habrá que averiguarlo."]
        grammar: [g.future-conditional-probability]
        vocab: [w.desconocido, w.testigo, w.averiguar]
    texts:
      - title: "Mensaje a un amigo"
        es: ["Oye, la luz de tu casa está encendida a estas horas.", "¿Estarás trabajando todavía?", "Seguro que te has dejado la luz del salón encendida otra vez."]
        en: ["Hey, the light in your house is on at this time of night.", "Are you still working, I wonder?", "I bet you've left the living-room light on again."]
        grammar: [g.future-conditional-probability]
        vocab: [w.encendido, w.a-estas-horas, w.seguro-que]
      - title: "Comienzo de un misterio"
        es: ["A estas horas la calle está en silencio.", "Una sombra pasa delante de la ventana. ¿Quién será?", "Será el vecino, que vuelve tarde del trabajo; o quién sabe."]
        en: ["At this time of night the street is silent.", "A shadow passes in front of the window. Who can it be?", "It's probably the neighbour, coming home late from work; or who knows."]
        grammar: [g.future-conditional-probability]
        vocab: [w.silencio, w.sombra, w.misterio, w.quien-sabe]
  - id: b1.u10.l2
    title: ¿Qué pasaría?
    teach: [g.future-conditional-probability]
    vocab: [w.suceso, w.desaparicion, w.investigar, w.investigacion, w.detective, w.culpable, w.inocente, w.crimen, w.robo, w.cometer, w.esconder, w.caso, w.madrugada, w.alarma, w.mentir, w.confesar, w.explicacion, w.aproximadamente, w.cristal, w.cerradura, w.forzar]
    tip: "A guess about the past takes the conditional: Serían las diez. A guess about what had happened takes the conditional perfect: Habría salido antes."
    sentences:
      - { es: "Cuando llegó la policía, serían las tres de la madrugada.", en: "When the police arrived, it must have been about three in the morning.", altEs: ["Cuando llegó la policía, serían aproximadamente las tres de la madrugada."], grammar: [g.future-conditional-probability], vocab: [w.madrugada, w.policia, w.llegar], error: { wrong: "Cuando llegó la policía, serán las tres de la madrugada.", explain: "The guess is about a past moment (llegó), so it takes the conditional serían, not the future serán.", grammar: g.future-conditional-probability } }
      - { es: "El ladrón forzó la cerradura; tendría mucha experiencia.", en: "The thief forced the lock; he must have had a lot of experience.", altEs: ["El ladrón forzó la cerradura; seguro que tenía mucha experiencia."], grammar: [g.future-conditional-probability], vocab: [w.forzar, w.cerradura, w.ladron, w.experiencia] }
      - { es: "La alarma estaba apagada. Alguien la habría apagado antes del robo.", en: "The alarm was off. Someone must have switched it off before the robbery.", altEs: ["La alarma estaba apagada; alguien la habría apagado antes del robo."], grammar: [g.future-conditional-probability], vocab: [w.alarma, w.apagar, w.robo] }
      - { es: "El cristal estaba roto por dentro; el culpable habría entrado por la puerta.", en: "The glass was broken from the inside; the culprit must have come in through the door.", grammar: [g.future-conditional-probability], vocab: [w.cristal, w.culpable, w.puerta, w.romper] }
      - { es: "El detective investigó el caso durante meses y no encontró ninguna explicación.", en: "The detective investigated the case for months and found no explanation.", grammar: [g.preterite-regular, g.indefinite-pronouns], vocab: [w.detective, w.investigar, w.caso, w.explicacion] }
      - { es: "¿Por qué mentiría el testigo? Tendría miedo de alguien.", en: "Why would the witness lie? He was probably afraid of someone.", altEs: ["¿Por qué mentiría el testigo? Seguro que tenía miedo de alguien."], grammar: [g.future-conditional-probability], vocab: [w.mentir, w.testigo, w.miedo] }
      - { es: "La desaparición del cuadro ocurrió de noche; el museo estaría cerrado y vacío.", en: "The painting's disappearance happened at night; the museum was probably closed and empty.", grammar: [g.future-conditional-probability], vocab: [w.desaparicion, w.cuadro, w.museo, w.vacio, w.ocurrir] }
      - { es: "El suceso se investigó durante años, pero nadie confesó.", en: "The incident was investigated for years, but nobody confessed.", grammar: [g.se-passive], vocab: [w.suceso, w.investigar, w.confesar] }
      - { es: "Los dos hermanos declararon que eran inocentes y que esa noche estaban en casa.", en: "The two brothers stated that they were innocent and that they were at home that night.", grammar: [g.reported-speech-past], vocab: [w.declarar, w.inocente, w.hermano] }
      - { es: "¿Quién cometería un crimen así en un pueblo tan tranquilo?", en: "Who would commit a crime like that in such a quiet village?", grammar: [g.future-conditional-probability], vocab: [w.cometer, w.crimen, w.pueblo, w.tranquilo] }
      - { es: "Habrían escondido el dinero en el bosque, porque allí la policía encontró huellas.", en: "They must have hidden the money in the forest, because the police found footprints there.", grammar: [g.future-conditional-probability], vocab: [w.esconder, w.dinero, w.bosque, w.huella] }
      - { es: "Tendría aproximadamente treinta años cuando desapareció; nadie volvió a verla.", en: "She must have been about thirty when she disappeared; nobody ever saw her again.", altEs: ["Tendría unos treinta años cuando desapareció; nadie volvió a verla."], grammar: [g.future-conditional-probability, g.volver-a], vocab: [w.aproximadamente, w.desaparecer, w.volver-a] }
      - { es: "Probablemente la ladrona entró por la ventana.", en: "The thief probably came in through the window.", altEs: ["La ladrona entraría por la ventana.", "Seguramente la ladrona entró por la ventana."], grammar: [g.future-conditional-probability], vocab: [w.ladron, w.ventana, w.entrar], transform: { instruction: "Express the guess with the conditional perfect", answer: "La ladrona habría entrado por la ventana.", alt: ["Habría entrado por la ventana."] } }
      - { es: "¿Dónde estaría el dinero? Nunca se encontró.", en: "Where could the money have been? It was never found.", altEs: ["¿Dónde estaría el dinero? No se encontró nunca."], grammar: [g.future-conditional-probability, g.se-passive], vocab: [w.dinero, w.encontrar] }
      - { es: "Sería culpable, pero nadie tenía pistas; la investigación se cerró.", en: "He was probably guilty, but nobody had any clues; the investigation was closed.", grammar: [g.future-conditional-probability, g.se-passive], vocab: [w.culpable, w.pista, w.investigacion, w.cerrar] }
    exchanges:
      - q: { es: "¿Qué hora era cuando llegó la policía?", en: "What time was it when the police arrived?" }
        a: { es: "No lo sé; serían las tres de la madrugada.", en: "I don't know; it must have been about three in the morning." }
        alt: ["Serían las dos o las tres.", "Aproximadamente las tres."]
        grammar: [g.future-conditional-probability]
        vocab: [w.madrugada, w.aproximadamente]
      - q: { es: "¿Cómo entró el ladrón?", en: "How did the thief get in?" }
        a: { es: "Forzó la cerradura; tendría mucha experiencia.", en: "He forced the lock; he must have had a lot of experience." }
        alt: ["Habría entrado por la ventana; el cristal estaba roto.", "Nadie lo sabe; la alarma estaba apagada."]
        grammar: [g.future-conditional-probability]
        vocab: [w.forzar, w.cerradura, w.cristal, w.alarma]
      - q: { es: "¿Por qué mintió el testigo?", en: "Why did the witness lie?" }
        a: { es: "Tendría miedo de alguien.", en: "He was probably afraid of someone." }
        alt: ["Quién sabe; sería culpable.", "Habría visto algo que no quería contar."]
        grammar: [g.future-conditional-probability]
        vocab: [w.mentir, w.culpable]
      - q: { es: "¿Dónde escondieron el dinero?", en: "Where did they hide the money?" }
        a: { es: "Lo habrían escondido en el bosque; allí encontraron huellas.", en: "They must have hidden it in the forest; they found footprints there." }
        alt: ["Nunca se encontró; estaría en otra ciudad.", "Lo habrían gastado todo."]
        grammar: [g.future-conditional-probability]
        vocab: [w.esconder]
      - q: { es: "¿Cuántos años tenía la mujer desaparecida?", en: "How old was the missing woman?" }
        a: { es: "Tendría aproximadamente treinta años.", en: "She must have been about thirty." }
        alt: ["Unos treinta, más o menos.", "No lo sé; sería joven."]
        grammar: [g.future-conditional-probability]
        vocab: [w.aproximadamente, w.desaparicion]
    texts:
      - title: "Informe del detective"
        es: ["El robo ocurrió de noche; el museo estaría cerrado y vacío.", "La alarma estaba apagada: alguien la habría apagado antes.", "El culpable conocería bien el edificio."]
        en: ["The robbery happened at night; the museum was probably closed and empty.", "The alarm was off: someone must have switched it off beforehand.", "The culprit probably knew the building well."]
        grammar: [g.future-conditional-probability]
        vocab: [w.robo, w.alarma, w.culpable, w.detective]
      - title: "Mensaje a una amiga"
        es: ["¿Sabes algo del cuadro desaparecido del museo?", "Anoche vi un reportaje: la policía investigó el caso durante años y nadie confesó.", "Yo creo que el ladrón sería alguien de dentro."]
        en: ["Do you remember the painting that went missing from the museum?", "Last night I saw a report: the police investigated the case for years and nobody confessed.", "I think the thief was probably someone from inside."]
        grammar: [g.future-conditional-probability]
        vocab: [w.investigar, w.caso, w.confesar]
  - id: b1.u10.l3
    title: Debe de ser él
    teach: [g.deber-de]
    vocab: [w.deber-de, w.evidentemente, w.cansancio, w.lujo, w.lujoso, w.pertenecer, w.olor, w.oler, w.matricula, w.acento, w.aspecto, w.parecerse, w.gemelo, w.recien, w.mudanza, w.caja]
    tip: "debe de + infinitive = must (probably); tiene que = strong deduction; puede = may. For the past use the perfect infinitive: debe de haber salido."
    sentences:
      - { es: "Huele a quemado; algo debe de estar quemándose en el horno.", en: "It smells of burning; something must be burning in the oven.", grammar: [g.deber-de], vocab: [w.oler, w.quemar, w.horno], note: "oler a = to smell of." }
      - { es: "Ese coche tan lujoso debe de costar más de cien mil euros.", en: "That luxury car must cost more than a hundred thousand euros.", altEs: ["Ese coche tan lujoso debe costar más de cien mil euros.", "Ese coche tan lujoso costará más de cien mil euros."], grammar: [g.deber-de], vocab: [w.lujoso, w.costar, w.coche, w.euro] }
      - { es: "Tiene acento argentino; debe de ser de Buenos Aires.", en: "He has an Argentinian accent; he must be from Buenos Aires.", altEs: ["Tiene acento argentino; será de Buenos Aires.", "Tiene acento argentino; debe ser de Buenos Aires."], grammar: [g.deber-de], vocab: [w.acento, w.argentino] }
      - { es: "Hay cajas en la escalera; los nuevos vecinos deben de estar de mudanza.", en: "There are boxes on the stairs; the new neighbours must be moving in.", grammar: [g.deber-de], vocab: [w.caja, w.escalera, w.mudanza, w.vecino] }
      - { es: "La matrícula es de otro país; el dueño tiene que ser turista.", en: "The number plate is from another country; the owner has to be a tourist.", grammar: [g.deber-de], vocab: [w.matricula, w.dueno, w.pais, w.turista] }
      - { es: "Se parecen tanto que deben de ser gemelos.", en: "They look so alike that they must be twins.", altEs: ["Se parecen tanto que tienen que ser gemelos.", "Se parecen tanto que serán gemelos."], grammar: [g.deber-de], vocab: [w.parecerse, w.gemelo] }
      - { es: "Tiene muy mal aspecto; debe de haber dormido poco.", en: "He looks terrible; he must have slept very little.", altEs: ["Tiene muy mal aspecto; habrá dormido poco."], grammar: [g.deber-de], vocab: [w.aspecto, w.dormir] }
      - { es: "Puede estar de viaje: hace días que no veo su coche.", en: "She may be away: I haven't seen her car for days.", grammar: [g.deber-de, g.desde-hace], vocab: [w.viaje, w.coche, w.ver] }
      - { es: "Con ese sueldo no puede pagar un piso tan grande; alguien debe de ayudarla.", en: "On that salary she can't pay for such a big flat; someone must be helping her.", grammar: [g.deber-de], vocab: [w.sueldo, w.piso, w.pagar, w.ayudar] }
      - { es: "Es evidente que están cansados: el cansancio se les ve en la cara.", en: "It's obvious they're tired: the tiredness shows on their faces.", grammar: [g.subjunctive-impersonal], vocab: [w.evidente, w.cansancio, w.cara], note: "es evidente que + indicative: certainty, no subjunctive." }
      - { es: "Este reloj no me pertenece; debe de ser de alguien de la oficina.", en: "This watch doesn't belong to me; it must be someone's from the office.", altEs: ["Este reloj no me pertenece; será de alguien de la oficina."], grammar: [g.deber-de], vocab: [w.pertenecer, w.reloj, w.oficina] }
      - { es: "Sin duda el pan es recién hecho: todavía está caliente.", en: "Without doubt the bread is freshly made: it's still warm.", grammar: [g.deber-de], vocab: [w.sin-duda, w.recien, w.pan, w.caliente] }
      - { es: "Deben de ser las ocho ya, porque está oscuro.", en: "It must be eight already, because it's dark.", altEs: ["Ya deben de ser las ocho, porque está oscuro.", "Serán las ocho ya, porque está oscuro."], grammar: [g.deber-de], vocab: [w.oscuro], error: { wrong: "Deben ser de las ocho ya, porque está oscuro.", explain: "deber de + infinitive: de goes between deber and the infinitive, not after it.", grammar: g.deber-de } }
      - { es: "Seguramente el dueño del bar es italiano.", en: "The owner of the bar is probably Italian.", altEs: ["El dueño del bar debe de ser italiano.", "El dueño del bar será italiano."], grammar: [g.deber-de], vocab: [w.dueno, w.bar, w.italiano], transform: { instruction: "Rephrase with deber de", answer: "El dueño del bar debe de ser italiano.", alt: ["El dueño del bar debe ser italiano."] } }
      - { es: "Evidentemente no ha leído el mensaje; si no, ya habría contestado.", en: "Evidently he hasn't read the message; otherwise he would already have replied.", grammar: [g.future-conditional-probability], vocab: [w.evidentemente, w.mensaje, w.contestar, w.leer], note: "si no = otherwise." }
      - { es: "Es obvio que viven con lujo: tienen tres coches y una casa con vistas al mar.", en: "It's obvious they live in luxury: they have three cars and a house with sea views.", grammar: [g.deber-de], vocab: [w.obvio, w.lujo, w.vistas, w.mar] }
    exchanges:
      - q: { es: "Huele a quemado, ¿no?", en: "It smells of burning, doesn't it?" }
        a: { es: "Sí, algo debe de estar quemándose en el horno.", en: "Yes, something must be burning in the oven." }
        alt: ["Debe de ser la cena del vecino.", "Sí; se habrá quemado el pan."]
        grammar: [g.deber-de]
        vocab: [w.oler, w.deber-de]
      - q: { es: "¿De dónde es el nuevo compañero?", en: "Where's the new colleague from?" }
        a: { es: "Tiene acento argentino; debe de ser de Buenos Aires.", en: "He has an Argentinian accent; he must be from Buenos Aires." }
        alt: ["Debe de ser de Argentina.", "No lo sé, pero tiene que ser de América."]
        grammar: [g.deber-de]
        vocab: [w.acento, w.deber-de]
      - q: { es: "¿De quién es este reloj?", en: "Whose watch is this?" }
        a: { es: "No me pertenece; debe de ser de alguien de la oficina.", en: "It doesn't belong to me; it must be someone's from the office." }
        alt: ["Debe de ser de Marta.", "Será de algún cliente."]
        grammar: [g.deber-de]
        vocab: [w.pertenecer]
      - q: { es: "Hay cajas en la escalera.", en: "There are boxes on the stairs." }
        a: { es: "Los nuevos vecinos deben de estar de mudanza.", en: "The new neighbours must be moving in." }
        alt: ["Deben de ser de la vecina del tercero.", "Alguien debe de haber recibido un pedido."]
        grammar: [g.deber-de]
        vocab: [w.caja, w.mudanza]
      - q: { es: "¿Qué hora debe de ser?", en: "What time must it be?" }
        a: { es: "Deben de ser las ocho ya, porque está oscuro.", en: "It must be eight already, because it's dark." }
        alt: ["Deben de ser las ocho.", "Tarde; la gente ya debe de estar cenando."]
        grammar: [g.deber-de]
        vocab: [w.deber-de]
    texts:
      - title: "Mensaje a un compañero"
        es: ["Oye, el coche de la jefa no está en el aparcamiento.", "Debe de estar de viaje; su despacho está cerrado.", "Evidentemente, la reunión de hoy no va a ser con ella."]
        en: ["Hey, the boss's car isn't in the car park.", "She must be away; her office is closed.", "Evidently, today's meeting isn't going to be with her."]
        grammar: [g.deber-de]
        vocab: [w.deber-de, w.evidentemente]
      - title: "Nota de un detective"
        es: ["La matrícula es de otro país; el dueño debe de ser turista.", "Los dos hombres se parecen tanto que deben de ser gemelos.", "Tienen muy mal aspecto: deben de haber dormido poco."]
        en: ["The number plate is from another country; the owner must be a tourist.", "The two men look so alike that they must be twins.", "They look terrible: they must have slept very little."]
        grammar: [g.deber-de]
        vocab: [w.matricula, w.parecerse, w.gemelo, w.aspecto]
  - id: b1.u10.l4
    title: Si tuviera tiempo…
    teach: [g.conditional-hypothetical]
    vocab: [w.hipotesis, w.en-tu-lugar, w.yo-que-tu, w.en-caso-de, w.loteria, w.tocar-la-loteria, w.dimitir, w.dar-la-vuelta-al-mundo, w.donar, w.atreverse, w.arrepentirse, w.riesgo, w.arriesgarse, w.apuntarse, w.en-serio, w.desde-luego, w.cambiar-de]
    tip: "The conditional for imagined situations and advice: Yo en tu lugar aceptaría. For an unreal condition: si + imperfect subjunctive, conditional — Si tuviera dinero, viajaría."
    sentences:
      - { es: "¿Qué harías si te tocara la lotería? — Dejaría de trabajar y daría la vuelta al mundo.", en: "What would you do if you won the lottery? — I'd stop working and travel around the world.", grammar: [g.conditional-hypothetical], vocab: [w.tocar-la-loteria, w.dar-la-vuelta-al-mundo, w.dejar-de], note: "tocara is the imperfect subjunctive: si + imperfect subjunctive, conditional." }
      - { es: "Si tuviera más tiempo, me apuntaría a un curso de cocina.", en: "If I had more time, I'd sign up for a cookery course.", altEs: ["Si tuviera más tiempo, haría un curso de cocina.", "Me apuntaría a un curso de cocina si tuviera más tiempo."], grammar: [g.conditional-hypothetical], vocab: [w.apuntarse, w.curso, w.cocina, w.tiempo] }
      - { es: "Yo en tu lugar aceptaría la oferta; es una gran oportunidad.", en: "If I were you I'd accept the offer; it's a great opportunity.", altEs: ["Yo que tú aceptaría la oferta; es una gran oportunidad."], grammar: [g.conditional-hypothetical], vocab: [w.en-tu-lugar, w.aceptar, w.oferta, w.oportunidad] }
      - { es: "Yo que tú no rechazaría ese trabajo sin pensarlo bien.", en: "If I were you I wouldn't turn that job down without thinking it over.", altEs: ["Yo en tu lugar no rechazaría ese trabajo sin pensarlo bien."], grammar: [g.conditional-hypothetical], vocab: [w.yo-que-tu, w.rechazar, w.trabajo, w.pensar] }
      - { es: "Si fuera rica, invertiría en pequeños negocios y donaría una parte a los hospitales.", en: "If I were rich, I'd invest in small businesses and donate a part to hospitals.", grammar: [g.conditional-hypothetical], vocab: [w.invertir, w.negocio, w.donar, w.rico, w.hospital] }
      - { es: "Me gustaría cambiar de trabajo, pero no me atrevo a dimitir.", en: "I'd like to change jobs, but I don't dare to resign.", altEs: ["Querría cambiar de trabajo, pero no me atrevo a dimitir.", "Me gustaría cambiar de trabajo, pero no me atrevo a dejarlo."], grammar: [g.conditional-hypothetical], vocab: [w.cambiar-de, w.atreverse, w.dimitir, w.gustaria] }
      - { es: "Sería ideal vivir cerca del mar, pero los pisos son carísimos.", en: "It would be ideal to live near the sea, but flats are terribly expensive.", grammar: [g.conditional-hypothetical], vocab: [w.ideal, w.mar, w.piso, w.caro] }
      - { es: "En caso de lluvia, la fiesta sería en el salón.", en: "In the event of rain, the party would be in the living room.", grammar: [g.conditional-hypothetical], vocab: [w.en-caso-de, w.lluvia, w.fiesta, w.salon] }
      - { es: "¿Te arriesgarías a montar tu propio negocio? — Desde luego, pero el riesgo es grande.", en: "Would you take the risk of setting up your own business? — Of course, but the risk is big.", grammar: [g.conditional-hypothetical], vocab: [w.arriesgarse, w.negocio, w.desde-luego, w.riesgo, w.propio, w.montar], note: "montar un negocio = to set up a business." }
      - { es: "Si pudiera volver a empezar, no me arrepentiría de nada.", en: "If I could start again, I wouldn't regret anything.", altEs: ["Si pudiera empezar de nuevo, no me arrepentiría de nada."], grammar: [g.conditional-hypothetical], vocab: [w.arrepentirse, w.volver-a, w.empezar, w.nada] }
      - { es: "¿Lo dices en serio? ¿De verdad dejarías tu casa y te mudarías a otro país?", en: "Are you serious? Would you really leave your home and move to another country?", grammar: [g.conditional-hypothetical], vocab: [w.en-serio, w.mudarse, w.pais, w.dejar] }
      - { es: "No sería capaz de mentir a mis amigos, ni siquiera por dinero.", en: "I wouldn't be capable of lying to my friends, not even for money.", grammar: [g.conditional-hypothetical], vocab: [w.capaz, w.mentir, w.ni-siquiera, w.amigo] }
      - { es: "Es solo una hipótesis: si el jefe dimitiera, ¿quién se quedaría con su trabajo?", en: "It's only a hypothesis: if the boss resigned, who would get his job?", altEs: ["Es solo una hipótesis: si el jefe dimitiera, ¿quién se quedaría con su puesto?"], grammar: [g.conditional-hypothetical], vocab: [w.hipotesis, w.dimitir, w.jefe, w.quedarse] }
      - { es: "Si tuviera dinero, compraría una casa en el campo.", en: "If I had money, I'd buy a house in the country.", altEs: ["Si tuviera dinero, me compraría una casa en el campo.", "Compraría una casa en el campo si tuviera dinero."], grammar: [g.conditional-hypothetical], vocab: [w.dinero, w.casa, w.campo, w.comprar], error: { wrong: "Si tendría dinero, compraría una casa en el campo.", explain: "After si, the unreal condition takes the imperfect subjunctive (tuviera), never the conditional.", grammar: g.conditional-hypothetical } }
      - { es: "No tengo coche, así que no puedo ir a la playa.", en: "I don't have a car, so I can't go to the beach.", grammar: [g.conditional-hypothetical, g.narration-connectors], vocab: [w.coche, w.playa, w.asi-que], transform: { instruction: "Turn it into an unreal condition with si + imperfect subjunctive", answer: "Si tuviera coche, iría a la playa.", alt: ["Si tuviera un coche, iría a la playa."] } }
      - { es: "Sin tu ayuda no habría terminado el proyecto a tiempo.", en: "Without your help I wouldn't have finished the project on time.", grammar: [g.conditional-hypothetical], vocab: [w.ayuda, w.proyecto, w.a-tiempo, w.terminar], note: "habría terminado is the conditional perfect: what would have happened." }
    exchanges:
      - q: { es: "¿Qué harías si te tocara la lotería?", en: "What would you do if you won the lottery?" }
        a: { es: "Dejaría de trabajar y daría la vuelta al mundo.", en: "I'd stop working and travel around the world." }
        alt: ["Donaría una parte y compraría una casa en el campo.", "Seguiría trabajando, en serio."]
        grammar: [g.conditional-hypothetical]
        vocab: [w.tocar-la-loteria, w.dar-la-vuelta-al-mundo, w.donar]
      - q: { es: "¿Aceptarías la oferta de Madrid?", en: "Would you accept the offer from Madrid?" }
        a: { es: "Yo en tu lugar la aceptaría; es una oportunidad estupenda.", en: "If I were you I'd accept it; it's a wonderful opportunity." }
        alt: ["Yo que tú no la rechazaría sin pensarlo.", "Desde luego, si fuera tú, me iría."]
        grammar: [g.conditional-hypothetical]
        vocab: [w.en-tu-lugar, w.yo-que-tu]
      - q: { es: "¿Te atreverías a dimitir?", en: "Would you dare to resign?" }
        a: { es: "No; me gustaría cambiar de trabajo, pero no me atrevo.", en: "No; I'd like to change jobs, but I don't dare." }
        alt: ["Desde luego, si tuviera otro trabajo.", "Solo si me arriesgara a montar mi propio negocio."]
        grammar: [g.conditional-hypothetical]
        vocab: [w.atreverse, w.dimitir, w.cambiar-de]
      - q: { es: "¿Qué pasaría si lloviera el día de la fiesta?", en: "What would happen if it rained on the day of the party?" }
        a: { es: "En caso de lluvia, la fiesta sería en el salón.", en: "In the event of rain, the party would be in the living room." }
        alt: ["La haríamos dentro.", "Nada; nos mojaríamos un poco."]
        grammar: [g.conditional-hypothetical]
        vocab: [w.en-caso-de]
      - q: { es: "¿Lo dices en serio? ¿Te mudarías a otro país?", en: "Are you serious? Would you move to another country?" }
        a: { es: "Sí; si pudiera, me iría mañana mismo.", en: "Yes; if I could, I'd leave tomorrow." }
        alt: ["Desde luego; no me arrepentiría de nada.", "No sé; es solo una hipótesis."]
        grammar: [g.conditional-hypothetical]
        vocab: [w.en-serio, w.desde-luego, w.hipotesis]
    texts:
      - title: "Mensaje a una amiga"
        es: ["Yo que tú no rechazaría ese trabajo.", "Si tuviera tu experiencia, me iría a Madrid sin pensarlo.", "Piénsalo bien: si no te arriesgas, te arrepentirás."]
        en: ["If I were you I wouldn't turn that job down.", "If I had your experience, I'd go to Madrid without a second thought.", "Think it over: if you don't take the risk, you'll regret it."]
        grammar: [g.conditional-hypothetical]
        vocab: [w.yo-que-tu, w.arriesgarse, w.arrepentirse]
      - title: "Encuesta de una revista"
        es: ["¿Qué harías si te tocara la lotería?", "La mayoría dejaría de trabajar y daría la vuelta al mundo.", "Solo un diez por ciento donaría una parte del dinero."]
        en: ["What would you do if you won the lottery?", "The majority would stop working and travel around the world.", "Only ten percent would donate part of the money."]
        grammar: [g.conditional-hypothetical]
        vocab: [w.loteria, w.dar-la-vuelta-al-mundo, w.donar]
dialogues:
  - id: b1.u10.d1
    title: ¿Dónde estará Jorge?
    context: Nuria and Pablo, two colleagues, wonder why Jorge has not come to the office this morning.
    lines:
      - { speaker: Nuria, es: "Son las diez y Jorge no ha llegado. ¿Dónde estará?", en: "It's ten o'clock and Jorge hasn't arrived. Where can he be?" }
      - { speaker: Pablo, es: "Estará en un atasco. Por lo visto, hay obras en la autopista.", en: "He's probably in a traffic jam. Apparently there are roadworks on the motorway." }
      - { speaker: Nuria, es: "No creo. Lo he llamado tres veces y tiene el móvil apagado.", en: "I don't think so. I've called him three times and his phone is off." }
      - { speaker: Pablo, es: "Entonces se habrá quedado sin batería. O se habrá dormido; ayer salió tardísimo de aquí.", en: "Then his battery must have run out. Or he's overslept; he left here really late yesterday." }
      - { speaker: Nuria, es: "Serían las nueve cuando se fue, no más tarde. Y Jorge nunca se duerme.", en: "It must have been nine when he left, no later. And Jorge never oversleeps." }
      - { speaker: Pablo, es: "Pues debe de estar enfermo. Anteayer tenía muy mal aspecto.", en: "Then he must be ill. The day before yesterday he looked terrible." }
      - { speaker: Nuria, es: "Puede ser. Pero es raro que no haya avisado a nadie. ¡Qué misterio!", en: "Could be. But it's odd that he hasn't let anyone know. What a mystery!" }
      - { speaker: Pablo, es: "Yo en tu lugar llamaría a su hermana; trabaja en la oficina de al lado.", en: "If I were you I'd call his sister; she works in the office next door." }
      - { speaker: Nuria, es: "Si tuviera su número, la llamaría ahora mismo.", en: "If I had her number, I'd call her right now." }
      - { speaker: Pablo, es: "Mira, ahí viene. Y con una caja de pasteles: ¡hoy es su cumpleaños! Se habrá parado a comprarlos.", en: "Look, here he comes. And with a box of pastries: it's his birthday today! He must have stopped to buy them." }
