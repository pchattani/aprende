        grammar: [g.c-etait]
        vocab: []
      - q: { es: "Quel temps faisait-il ?", en: "What was the weather like?" }
        a: { es: "Il faisait chaud, mais il y avait du vent.", en: "It was hot, but it was windy." }
        alt: ["Il faisait beau.", "Il pleuvait."]
        grammar: [g.c-etait, g.weather]
        vocab: []
