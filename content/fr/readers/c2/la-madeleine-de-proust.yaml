id: r.c2.la-madeleine-de-proust
level: c2
title: La madeleine de Proust
kind: literature
author: Marcel Proust (1871–1922)
source: "Du côté de chez Swann, « Combray », fin de la première partie (Grasset, 1913). Domaine public. Texte abrégé d'après l'édition ELTeC du roman (Bibliothèque électronique du Québec) ; les coupures sont marquées par (…)."
intro: "The most famous passage in French literature: a spoonful of tea and a crumb of madeleine bring back a whole lost childhood. The first paragraph is an editorial introduction written for this course; the rest is Proust's text, abridged, with cuts marked (…). Follow the long periodic sentences to their end, notice the sudden shift from the passé simple to the present (Je bois une seconde gorgée) and the imperfect subjunctives (je ne susse pas, dusse)."
allow: [volume, adulte, drame, isolé, notion, indifférentes, médiocre, infiniment, infusion, consistants, reconnaissables, proust, combray, léonie, swann, vivonne, japonais, saint-jacques, madeleines, madeleine, temps, illusoire, contingent, essence, vicissitudes, immatérielles, persistantes, indistincts, porcelaine, interpréter, intact, décisif]
paragraphs:
  - { es: "Du côté de chez Swann, publié en 1913, est le premier volume d'À la recherche du temps perdu, l'immense roman de Marcel Proust. Le narrateur, devenu adulte, a oublié presque toute son enfance à Combray, un village où il passait ses vacances chez sa tante. Un jour d'hiver, une simple tasse de thé va tout lui rendre.", en: "Du côté de chez Swann (Swann's Way), published in 1913, is the first volume of In Search of Lost Time, Marcel Proust's vast novel. The narrator, now an adult, has forgotten almost all of his childhood in Combray, a village where he spent his holidays at his aunt's. One winter's day, a simple cup of tea is going to give it all back to him." }
  - { es: "Il y avait déjà bien des années que, de Combray, tout ce qui n'était pas le théâtre et le drame de mon coucher n'existait plus pour moi, quand un jour d'hiver, comme je rentrais à la maison, ma mère, voyant que j'avais froid, me proposa de me faire prendre, contre mon habitude, un peu de thé. Je refusai d'abord et, je ne sais pourquoi, me ravisai. Elle envoya chercher un de ces gâteaux courts et dodus appelés Petites Madeleines qui semblent avoir été moulés dans la valve rainurée d'une coquille de Saint-Jacques.", en: "For many years already, everything about Combray that was not the theatre and drama of my going to bed had ceased to exist for me, when one winter's day, as I came home, my mother, seeing that I was cold, offered to have me take, contrary to my habit, a little tea. I refused at first and then, I don't know why, changed my mind. She sent for one of those short, plump little cakes called 'petites madeleines', which look as though they had been moulded in the grooved valve of a scallop shell." }
  - { es: "Et bientôt, machinalement, accablé par la morne journée et la perspective d'un triste lendemain, je portai à mes lèvres une cuillerée du thé où j'avais laissé s'amollir un morceau de madeleine. Mais à l'instant même où la gorgée mêlée des miettes du gâteau toucha mon palais, je tressaillis, attentif à ce qui se passait d'extraordinaire en moi. Un plaisir délicieux m'avait envahi, isolé, sans la notion de sa cause. Il m'avait aussitôt rendu les vicissitudes de la vie indifférentes, ses désastres inoffensifs, sa brièveté illusoire, de la même façon qu'opère l'amour, en me remplissant d'une essence précieuse : ou plutôt cette essence n'était pas en moi, elle était moi.", en: "And soon, mechanically, weighed down by the dreary day and the prospect of a sad tomorrow, I raised to my lips a spoonful of the tea in which I had let a piece of madeleine soften. But at the very instant when the mouthful mixed with cake crumbs touched my palate, I shuddered, attentive to the extraordinary thing that was happening inside me. A delicious pleasure had invaded me, isolated, with no notion of its cause. It had at once made the vicissitudes of life indifferent to me, its disasters harmless, its brevity illusory, in the same way that love operates, by filling me with a precious essence: or rather this essence was not in me, it was me." }
  - { es: "J'avais cessé de me sentir médiocre, contingent, mortel. D'où avait pu me venir cette puissante joie ? Je sentais qu'elle était liée au goût du thé et du gâteau, mais qu'elle le dépassait infiniment, ne devait pas être de même nature. D'où venait-elle ? Que signifiait-elle ? Où l'appréhender ? Je bois une seconde gorgée où je ne trouve rien de plus que dans la première, une troisième qui m'apporte un peu moins que la seconde. Il est temps que je m'arrête, la vertu du breuvage semble diminuer. Il est clair que la vérité que je cherche n'est pas en lui, mais en moi. (…) Je pose la tasse et me tourne vers mon esprit. C'est à lui de trouver la vérité.", en: "I had ceased to feel mediocre, contingent, mortal. Where could this powerful joy have come to me from? I felt that it was connected with the taste of the tea and the cake, but that it went infinitely beyond it, could not be of the same nature. Where did it come from? What did it mean? Where could I grasp it? I drink a second mouthful in which I find nothing more than in the first, a third that brings me a little less than the second. It is time for me to stop; the potion's virtue seems to be waning. It is clear that the truth I am seeking is not in it, but in me. (…) I put down the cup and turn to my mind. It is up to my mind to find the truth." }
  - { es: "(…) Et tout d'un coup le souvenir m'est apparu. Ce goût, c'était celui du petit morceau de madeleine que le dimanche matin à Combray (parce que ce jour-là je ne sortais pas avant l'heure de la messe), quand j'allais lui dire bonjour dans sa chambre, ma tante Léonie m'offrait après l'avoir trempé dans son infusion de thé ou de tilleul. (…)", en: "(…) And all at once the memory appeared to me. That taste was the taste of the little piece of madeleine which on Sunday mornings at Combray (because on that day I did not go out before Mass), when I went to say good morning to her in her bedroom, my aunt Léonie used to give me after dipping it in her infusion of tea or lime blossom. (…)" }
  - { es: "Mais, quand d'un passé ancien rien ne subsiste, après la mort des êtres, après la destruction des choses, seules, plus frêles mais plus vivaces, plus immatérielles, plus persistantes, plus fidèles, l'odeur et la saveur restent encore longtemps, comme des âmes, à se rappeler, à attendre, à espérer, sur la ruine de tout le reste, à porter sans fléchir, sur leur gouttelette presque impalpable, l'édifice immense du souvenir.", en: "But when nothing remains of a distant past, after people have died, after things have been destroyed, alone, more fragile but more enduring, more immaterial, more persistent, more faithful, smell and taste remain for a long time, like souls, remembering, waiting, hoping, amid the ruins of all the rest, bearing unflinchingly, on their almost impalpable droplet, the immense edifice of memory." }
  - { es: "Et dès que j'eus reconnu le goût du morceau de madeleine trempé dans le tilleul que me donnait ma tante (quoique je ne susse pas encore et dusse remettre à bien plus tard de découvrir pourquoi ce souvenir me rendait si heureux), aussitôt la vieille maison grise sur la rue, où était sa chambre, vint comme un décor de théâtre s'appliquer au petit pavillon donnant sur le jardin, qu'on avait construit pour mes parents sur ses derrières (ce pan tronqué que seul j'avais revu jusque-là) ; et avec la maison, la ville, la Place où on m'envoyait avant déjeuner, les rues où j'allais faire des courses depuis le matin jusqu'au soir et par tous les temps, les chemins qu'on prenait si le temps était beau.", en: "And as soon as I had recognised the taste of the piece of madeleine dipped in lime-blossom tea that my aunt used to give me (although I did not yet know, and would have to put off until much later discovering, why this memory made me so happy), at once the old grey house on the street, where her bedroom was, rose up like a stage set and attached itself to the little pavilion overlooking the garden that had been built for my parents at the back of it (the truncated section which until then was all I had seen again); and with the house, the town, the Square where I was sent before lunch, the streets where I ran errands from morning to evening in all weathers, the paths we took if the weather was fine." }
  - { es: "Et comme dans ce jeu où les Japonais s'amusent à tremper dans un bol de porcelaine rempli d'eau de petits morceaux de papier jusque-là indistincts qui, à peine y sont-ils plongés s'étirent, se contournent, se colorent, se différencient, deviennent des fleurs, des maisons, des personnages consistants et reconnaissables, de même maintenant toutes les fleurs de notre jardin et celles du parc de M. Swann, et les nymphéas de la Vivonne, et les bonnes gens du village et leurs petits logis et l'église et tout Combray et ses environs, tout cela qui prend forme et solidité, est sorti, ville et jardins, de ma tasse de thé.", en: "And as in that game in which the Japanese amuse themselves by dipping into a porcelain bowl full of water little pieces of paper, until then indistinct, which, the moment they are immersed, stretch, twist, take on colour, become distinct, turn into flowers, houses, solid and recognisable people, so now all the flowers in our garden and in M. Swann's park, and the water lilies of the Vivonne, and the good folk of the village and their little homes and the church and all of Combray and its surroundings, all of that, taking shape and solidity, came out, town and gardens, from my cup of tea." }
questions:
  - { q: "Que ressent le narrateur quand la gorgée de thé touche son palais ?", options: ["Un dégoût", "Un plaisir délicieux, sans en connaître la cause", "Une douleur"], answer: 1, explain: "«Un plaisir délicieux m'avait envahi, isolé, sans la notion de sa cause.»" }
  - { q: "Pourquoi s'arrête-t-il de boire après la troisième gorgée ?", options: ["Le thé est froid", "Il comprend que la vérité qu'il cherche est en lui, pas dans le breuvage", "Sa mère l'appelle"], answer: 1, explain: "«Il est clair que la vérité que je cherche n'est pas en lui, mais en moi.» He turns to his mind." }
  - { q: "Quel souvenir revient finalement ?", options: ["Celui des madeleines que lui offrait sa tante Léonie le dimanche matin à Combray", "Celui d'un voyage au Japon", "Celui de son premier amour"], answer: 0, explain: "His aunt Léonie used to give him a piece of madeleine dipped in her tea or lime-blossom infusion on Sunday mornings." }
  - { q: "Selon le narrateur, qu'est-ce qui survit au passé quand tout le reste a disparu ?", options: ["Les images et les photos", "L'odeur et la saveur", "Les paroles des gens"], answer: 1, explain: "«L'odeur et la saveur restent encore longtemps, comme des âmes… à porter… l'édifice immense du souvenir.»" }
  - { q: "À quoi Proust compare-t-il le retour de Combray dans sa mémoire ?", options: ["À un jeu japonais où des papiers plongés dans l'eau deviennent des fleurs et des maisons", "À un film de cinéma", "À un livre qu'on ouvre"], answer: 0, explain: "The long final simile: little pieces of paper dipped in water unfold into flowers, houses and people — just as Combray 'comes out' of his cup of tea." }
  - { q: "Quelles formes sont « je ne susse pas » et « dusse » ?", options: ["Du subjonctif imparfait de savoir et de devoir", "Du passé simple", "Des fautes d'orthographe"], answer: 0, explain: "After quoique, literary French uses the imperfect subjunctive when the main verb is in the past: que je susse (savoir), que je dusse (devoir)." }
