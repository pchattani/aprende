id: r.b2.riquewihr-il-parait-que-c-est-le-meilleur
level: b2
title: "Riquewihr : il paraît que c'est le meilleur"
kind: text
intro: A journalist tastes wine with a winegrower in Riquewihr, on the Alsace wine route, and tries to form a nuanced opinion. Notice the impersonal constructions (il paraît que, il s'agit de, il suffit de, il arrive que, il convient de).
allow: [marlenheim, thann, dolder, sylvaner, muscat, pinot, gris, noir, hélène, ok, centre]
paragraphs:
  - { es: "Il paraît que Riquewihr est l'un des plus beaux villages de France. Après une matinée passée dans ses ruelles pavées, entre les maisons à colombages roses, jaunes et bleues, je dois reconnaître qu'il est difficile de dire le contraire. Entouré de remparts et dominé par une vieille tour, le Dolder, le village a traversé les siècles et les guerres presque sans dommages. Il en résulte un décor si parfait qu'on a parfois l'impression d'être dans un livre de contes. Mais je ne suis pas venue pour l'architecture. Je suis venue pour le vin.", en: "They say Riquewihr is one of the most beautiful villages in France. After a morning spent in its cobbled lanes, among the pink, yellow and blue half-timbered houses, I have to admit that it's hard to say otherwise. Surrounded by ramparts and overlooked by an old tower, the Dolder, the village has come through the centuries and the wars almost undamaged. The result is a setting so perfect that you sometimes feel you're in a storybook. But I didn't come for the architecture. I came for the wine." }
  - { es: "Riquewihr se trouve au cœur de la route des vins d'Alsace, un itinéraire d'environ cent soixante-dix kilomètres, de Marlenheim jusqu'à Thann, inauguré en 1953. Il s'agit d'une succession de villages fleuris, de collines couvertes de vignes et de caves où il suffit de pousser la porte pour goûter. Hélène, vigneronne depuis trente ans, m'accueille dans la sienne, une cave voûtée du seizième siècle.", en: "Riquewihr lies at the heart of the Alsace wine route, a route of about a hundred and seventy kilometres from Marlenheim to Thann, opened in 1953. It's a succession of flower-decked villages, hills covered in vines and cellars where you only have to push the door open to taste. Hélène, a winegrower for thirty years, welcomes me into hers, a vaulted sixteenth-century cellar." }
  - { es: "« En Alsace, m'explique-t-elle, on ne parle pas de château ou de région comme à Bordeaux. Ce qui compte, c'est le cépage. Il y en a principalement sept : le riesling, le gewurztraminer, le pinot gris, le muscat, le sylvaner, le pinot blanc et le pinot noir, le seul rouge. » Elle me sert d'abord un riesling. Il est sec, vif, avec un léger goût de citron. Ensuite vient le gewurztraminer, beaucoup plus aromatique : on y sent la rose et les fruits exotiques. « Il paraît que c'est le meilleur, me dit-elle avec un sourire. Du moins, c'est ce que disent les touristes. Les Alsaciens, eux, préfèrent souvent le riesling. »", en: "'In Alsace,' she explains, 'we don't talk about châteaux or areas as they do in Bordeaux. What matters is the grape variety. There are mainly seven: riesling, gewurztraminer, pinot gris, muscat, sylvaner, pinot blanc and pinot noir, the only red.' She first pours me a riesling. It's dry and lively, with a slight taste of lemon. Next comes the gewurztraminer, much more aromatic: you can smell rose and exotic fruit in it. 'They say it's the best,' she tells me with a smile. 'At least, that's what the tourists say. People from Alsace often prefer riesling.'" }
  - { es: "Alors, lequel est le meilleur ? Il me semble que la question est mal posée. Il arrive qu'un vin très apprécié par les uns déplaise profondément aux autres, et c'est normal. Il convient plutôt de se demander avec quel plat on va le boire. Le riesling accompagne parfaitement la choucroute et les poissons ; le gewurztraminer, plus sucré, se marie bien avec les fromages forts, comme le munster, ou avec certains plats asiatiques. Il reste que, pour un palais non habitué, le gewurztraminer peut sembler un peu trop puissant.", en: "So which one is the best? It seems to me the question is badly put. It happens that a wine much appreciated by some is deeply disliked by others, and that's normal. It's better to ask what dish you're going to drink it with. Riesling goes perfectly with sauerkraut and fish; gewurztraminer, which is sweeter, goes well with strong cheeses, like munster, or with certain Asian dishes. The fact remains that, to an unaccustomed palate, gewurztraminer can seem a little too powerful." }
  - { es: "Entre deux verres, Hélène passe sans cesse du français à l'alsacien pour parler avec son mari. « Mes grands-parents ne parlaient qu'alsacien à la maison, raconte-t-elle. Aujourd'hui, les jeunes le comprennent de moins en moins. » Il faut dire que l'histoire de la région est compliquée : entre 1871 et 1945, l'Alsace a changé quatre fois de pays, passant de la France à l'Allemagne et inversement. Il en reste une culture double, visible jusque sur les panneaux bilingues à l'entrée des villages.", en: "Between two glasses, Hélène keeps switching from French to Alsatian to talk to her husband. 'My grandparents spoke only Alsatian at home,' she says. 'Today young people understand it less and less.' It must be said that the region's history is complicated: between 1871 and 1945, Alsace changed country four times, passing from France to Germany and back again. What remains is a double culture, visible even on the bilingual signs at the entrance to the villages." }
  - { es: "Au moment de partir, je repose la question : quel est son vin préféré ? Hélène hésite, puis répond en riant : « Celui qu'on boit avec des amis. » Il est difficile de trouver une réponse plus nuancée. Ou plus alsacienne.", en: "As I'm leaving, I ask the question again: what's her favourite wine? Hélène hesitates, then answers, laughing: 'The one you drink with friends.' It's hard to find a more nuanced answer. Or a more Alsatian one." }
questions:
  - { q: "Pourquoi le village de Riquewihr est-il si bien conservé ?", options: ["Il a été entièrement reconstruit", "Il a traversé les siècles et les guerres presque sans dommages", "Il est fermé aux touristes"], answer: 1, explain: "«Le village a traversé les siècles et les guerres presque sans dommages.»" }
  - { q: "Qu'est-ce qui compte le plus pour les vins d'Alsace, selon Hélène ?", options: ["Le château", "Le cépage", "L'âge du vin"], answer: 1, explain: "«On ne parle pas de château ou de région comme à Bordeaux. Ce qui compte, c'est le cépage.»" }
  - { q: "Comment la journaliste décrit-elle le gewurztraminer ?", options: ["Sec, avec un goût de citron", "Très aromatique, avec des notes de rose et de fruits exotiques", "Rouge et léger"], answer: 1, explain: "«Beaucoup plus aromatique : on y sent la rose et les fruits exotiques.» The lemony one is the riesling." }
  - { q: "Selon la journaliste, quelle est la bonne question à se poser ?", options: ["Quel vin est le plus cher", "Avec quel plat on va boire le vin", "Quel vin préfèrent les touristes"], answer: 1, explain: "«Il convient plutôt de se demander avec quel plat on va le boire.»" }
  - { q: "Pourquoi l'Alsace a-t-elle une culture double ?", options: ["Parce qu'elle a changé plusieurs fois de pays entre 1871 et 1945", "Parce qu'elle est près de l'Italie", "Parce que beaucoup de touristes y viennent"], answer: 0, explain: "«Entre 1871 et 1945, l'Alsace a changé quatre fois de pays.»" }
  - { q: "« Il arrive qu'un vin déplaise. » Quel est le sens de « il arrive que » ?", options: ["Il est certain que", "Il se produit parfois que", "Il est interdit que"], answer: 1, explain: "Il arrive que (+ subjunctive) = it sometimes happens that." }
