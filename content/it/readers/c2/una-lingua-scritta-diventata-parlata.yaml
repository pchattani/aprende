id: r.c2.una-lingua-scritta-diventata-parlata
level: c2
title: Una lingua scritta diventata parlata
kind: text
intro: "A lecture given to foreign students on their first day at the University for Foreigners in Perugia: how a literary language based on fourteenth-century Florentine became the everyday Italian of sixty million people. It sums up the questione della lingua of c2.u01 and uses the academic and persuasive structures of c1.u06 and c2.u04."
allow: [perugia, dante, petrarca, boccaccio, bembo, manzoni, arno, firenze, toscana, tullio, mauro, rai, italia, italiani, carosello, prose, volgar, risciacquare]
paragraphs:
  - { es: "Care studentesse, cari studenti, benvenuti a Perugia. Molti di voi sono arrivati qui convinti di dover imparare una lingua antica e stabile, la lingua di Dante, che gli italiani parlerebbero più o meno allo stesso modo da settecento anni. Vorrei cominciare questo corso smentendo, almeno in parte, questa convinzione. La storia dell'italiano è infatti una storia insolita: quella di una lingua che per secoli è stata soprattutto scritta, e che solo di recente è diventata la lingua parlata di tutti.", en: "Dear students, welcome to Perugia. Many of you have arrived here convinced that you have to learn an ancient, stable language, the language of Dante, which Italians have supposedly spoken in more or less the same way for seven hundred years. I'd like to begin this course by disproving that belief, at least in part. The history of Italian is in fact an unusual one: the story of a language that for centuries was above all written, and only recently became the spoken language of everyone." }
  - { es: "Partiamo dal Trecento. Dante, Petrarca e Boccaccio scrivono in fiorentino, cioè nel volgare della loro città, e le loro opere hanno un successo tale da diventare un modello per chiunque voglia scrivere in volgare in tutta la penisola. Si badi bene: un modello letterario. Nel resto d'Italia, la gente continua a parlare il proprio dialetto, che non è un italiano «sbagliato», ma il risultato di un'evoluzione autonoma del latino, esattamente come il fiorentino.", en: "Let's start with the fourteenth century. Dante, Petrarch and Boccaccio write in Florentine, that is, in the vernacular of their city, and their works are so successful that they become a model for anyone in the whole peninsula who wants to write in the vernacular. Mind you: a literary model. In the rest of Italy people go on speaking their own dialect, which is not 'incorrect' Italian, but the result of an independent evolution of Latin, exactly like Florentine." }
  - { es: "Nel Cinquecento il veneziano Pietro Bembo, nelle «Prose della volgar lingua», propone di imitare la lingua di Petrarca per la poesia e quella di Boccaccio per la prosa. La sua proposta vince: per tre secoli, chi scrive in italiano scrive una lingua appresa sui libri, che non è la lingua materna di nessuno, nemmeno dei fiorentini, la cui parlata nel frattempo si è evoluta. È una situazione che non ha molti paragoni in Europa, dove le lingue nazionali sono cresciute di solito attorno a una capitale e a una corte.", en: "In the sixteenth century the Venetian Pietro Bembo, in his 'Prose della volgar lingua', proposes imitating Petrarch's language for poetry and Boccaccio's for prose. His proposal wins: for three centuries, whoever writes in Italian writes a language learned from books, which is nobody's mother tongue – not even the Florentines', whose speech has meanwhile evolved. It's a situation with few parallels in Europe, where national languages usually grew up around a capital and a court." }
  - { es: "Nell'Ottocento Alessandro Manzoni si accorge del problema mentre scrive il suo romanzo. Per dare ai suoi personaggi una lingua viva, decide di trasferirsi a Firenze, per «risciacquare i panni in Arno», come scrive in una lettera famosa: vuole cioè correggere la prima versione dei «Promessi sposi» sul modello del fiorentino parlato dalle persone colte. Ma quando, nel 1861, nasce il Regno d'Italia, gli studiosi calcolano che solo una piccola minoranza degli italiani usi abitualmente l'italiano: secondo le stime più note, tra il due virgola cinque e il dieci per cento della popolazione.", en: "In the nineteenth century Alessandro Manzoni becomes aware of the problem while writing his novel. To give his characters a living language, he decides to move to Florence to 'rinse his clothes in the Arno', as he writes in a famous letter: that is, he wants to correct the first version of 'The Betrothed' on the model of the Florentine spoken by educated people. But when the Kingdom of Italy is born in 1861, scholars calculate that only a small minority of Italians habitually use Italian: according to the best-known estimates, between two and a half and ten per cent of the population." }
  - { es: "Come si passa da quella minoranza alla situazione di oggi? Il linguista Tullio De Mauro ha indicato alcuni fattori decisivi: la scuola obbligatoria, il servizio militare, che mescolava giovani di regioni diverse, le grandi migrazioni interne dal Sud verso le città industriali del Nord, la burocrazia dello Stato unitario. Ma il fattore più potente arriva nel Novecento, ed è la televisione. Dal 1954, per la prima volta, milioni di persone sentono ogni sera un italiano parlato, con una pronuncia, un ritmo, delle espressioni comuni.", en: "How do we get from that minority to the situation today? The linguist Tullio De Mauro identified some decisive factors: compulsory schooling, military service, which mixed young men from different regions, the great internal migrations from the South to the industrial cities of the North, the bureaucracy of the unified state. But the most powerful factor arrives in the twentieth century, and it is television. From 1954, for the first time, millions of people hear spoken Italian every evening, with a shared pronunciation, rhythm and set of expressions." }
  - { es: "C'è chi sostiene che questo processo abbia ucciso i dialetti. Non è del tutto vero. È vero che oggi quasi tutti gli italiani parlano italiano, e che i giovani usano il dialetto molto meno dei nonni. Tuttavia, molti italiani continuano ad alternare l'italiano e il dialetto a seconda della situazione, e il dialetto sopravvive nelle canzoni, nel teatro, nelle battute, perfino nei messaggi sul telefono. Accanto all'italiano standard, poi, esistono gli italiani regionali: un milanese e un palermitano parlano la stessa lingua, ma basta sentirli dire una frase per sapere da dove vengono.", en: "Some argue that this process killed the dialects. That's not entirely true. It's true that today almost all Italians speak Italian, and that young people use dialect far less than their grandparents. However, many Italians go on switching between Italian and dialect depending on the situation, and dialect survives in songs, in the theatre, in jokes, even in text messages. Alongside standard Italian, moreover, there are the regional Italians: someone from Milan and someone from Palermo speak the same language, but you only have to hear them say one sentence to know where they come from." }
  - { es: "Che cosa significa tutto questo per voi? Significa, innanzitutto, che non dovete stupirvi se fuori da quest'aula sentirete un italiano diverso da quello dei vostri libri. Significa anche che leggere Dante, con un po' di aiuto, vi sarà meno difficile di quanto pensiate, perché la base della lingua è rimasta sorprendentemente stabile. E significa, infine, che imparare l'italiano vuol dire imparare a muoversi tra molte varietà: quella scritta e quella parlata, quella formale e quella familiare, quella di Roma e quella di Bergamo.", en: "What does all this mean for you? It means, first of all, that you mustn't be surprised if outside this classroom you hear an Italian different from the one in your books. It also means that reading Dante, with a bit of help, will be less difficult than you think, because the foundation of the language has remained surprisingly stable. And it means, finally, that learning Italian means learning to move among many varieties: written and spoken, formal and familiar, the Italian of Rome and that of Bergamo." }
  - { es: "Gli italiani, in un certo senso, hanno imparato la loro lingua comune in poco più di un secolo. Voi avete qualche mese. Non preoccupatevi: avete il vantaggio di sapere fin dall'inizio che una lingua non è un monumento da guardare, ma una città in cui vivere. Buon lavoro.", en: "Italians, in a sense, learned their common language in little more than a century. You have a few months. Don't worry: you have the advantage of knowing from the start that a language is not a monument to look at, but a city to live in. Enjoy your work." }
questions:
  - { q: "Quale convinzione degli studenti vuole smentire la docente?", options: ["Che l'italiano sia difficile", "Che gli italiani parlino la lingua di Dante allo stesso modo da settecento anni", "Che Perugia sia una città piccola"], answer: 1, explain: "«convinti di dover imparare una lingua antica e stabile… che gli italiani parlerebbero… allo stesso modo da settecento anni» – the conditional marks the belief as hearsay." }
  - { q: "Secondo la docente, che cosa sono i dialetti?", options: ["Forme sbagliate dell'italiano", "Evoluzioni autonome del latino, come il fiorentino", "Lingue arrivate dall'estero"], answer: 1, explain: "«non è un italiano sbagliato, ma il risultato di un'evoluzione autonoma del latino, esattamente come il fiorentino»." }
  - { q: "Che cosa proponeva Pietro Bembo?", options: ["Di scrivere in dialetto veneziano", "Di imitare Petrarca per la poesia e Boccaccio per la prosa", "Di usare il latino per tutto"], answer: 1, explain: "«propone di imitare la lingua di Petrarca per la poesia e quella di Boccaccio per la prosa» – the basis of literary Italian for three centuries." }
  - { q: "Che cosa intendeva Manzoni con «risciacquare i panni in Arno»?", options: ["Lavare i vestiti nel fiume di Firenze", "Rivedere la lingua del suo romanzo sul modello del fiorentino parlato dalle persone colte", "Trasferirsi definitivamente in Toscana per lavoro"], answer: 1, explain: "A famous metaphor: to 'rinse' his language in Florentine usage while revising I promessi sposi." }
  - { q: "Quale fattore considera «il più potente» nella diffusione dell'italiano parlato?", options: ["La scuola obbligatoria", "Il servizio militare", "La televisione"], answer: 2, explain: "«il fattore più potente arriva nel Novecento, ed è la televisione»." }
