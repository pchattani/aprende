id: r.a1.una-domenica-a-roma
level: a1
title: Una domenica a Roma
kind: text
intro: Davide writes an email to his friend Lisa, who is coming to Rome for the weekend, with a plan for Sunday.
allow: [davide, lisa, borghese, spagna, trevi, colosseo, bioparco]
paragraphs:
  - { es: "Ciao Lisa! Allora, arrivi sabato sera con il treno delle otto? Perfetto! Vengo io alla stazione Termini: aspetto davanti al binario. Ho un programma fantastico per domenica.", en: "Hi Lisa! So, you're arriving on Saturday evening on the eight o'clock train? Perfect! I'll come to Termini station: I'll wait in front of the platform. I've got a fantastic plan for Sunday." }
  - { es: "La mattina facciamo colazione al bar sotto casa mia: lì fanno i maritozzi con la panna, buonissimi! Poi prendiamo la metropolitana e andiamo al Colosseo. Dobbiamo arrivare presto, alle nove, perché la domenica c'è sempre una fila lunghissima. Ho già i biglietti!", en: "In the morning we'll have breakfast at the bar near my place: they make maritozzi with cream there, delicious! Then we'll take the metro and go to the Colosseum. We have to arrive early, at nine, because on Sundays there's always a very long queue. I've already got the tickets!" }
  - { es: "Dopo il Colosseo andiamo a piedi verso il centro. Non è lontano: giri a destra in via dei Fori Imperiali e continui sempre dritto fino a Piazza Venezia. Poi prendiamo una strada piccola a sinistra e arriviamo alla Fontana di Trevi. Porta una moneta: se lanci una moneta nella fontana, torni a Roma!", en: "After the Colosseum we'll walk towards the centre. It isn't far: you turn right into Via dei Fori Imperiali and keep straight on as far as Piazza Venezia. Then we take a small street on the left and we arrive at the Trevi Fountain. Bring a coin: if you throw a coin into the fountain, you'll come back to Rome!" }
  - { es: "Per pranzo conosco una trattoria piccola e tranquilla vicino a Piazza di Spagna. Il pomeriggio, se fa bel tempo, facciamo una passeggiata a Villa Borghese, il grande parco di Roma. Lì possiamo prendere una bici o visitare un museo. Se piove, andiamo al cinema!", en: "For lunch I know a small, quiet trattoria near Piazza di Spagna. In the afternoon, if the weather is nice, we'll go for a walk in Villa Borghese, the big park in Rome. There we can rent a bike or visit a museum. If it rains, we'll go to the cinema!" }
  - { es: "In questi giorni a Roma fa caldo: ci sono ventotto gradi e c'è sempre il sole. Porta vestiti leggeri, un cappello e scarpe comode, perché camminiamo molto! La sera c'è un concerto gratis in piazza: ti piace la musica italiana?", en: "These days it's hot in Rome: it's twenty-eight degrees and always sunny. Bring light clothes, a hat and comfortable shoes, because we'll walk a lot! In the evening there's a free concert in the square: do you like Italian music?" }
  - { es: "Lunedì io devo lavorare, ma tu puoi dormire fino a tardi e visitare il Vaticano. Scrivi quando sei sul treno! A sabato, un abbraccio, Davide.", en: "On Monday I have to work, but you can sleep in and visit the Vatican. Write when you're on the train! See you Saturday, a hug, Davide." }
questions:
  - { q: "Dove aspetta Davide Lisa sabato sera?", options: ["Al bar sotto casa", "Alla stazione Termini", "Al Colosseo"], answer: 1, explain: "«Vengo io alla stazione Termini: aspetto davanti al binario.»" }
  - { q: "Perché devono arrivare presto al Colosseo?", options: ["Perché la domenica c'è una fila lunghissima", "Perché il museo chiude alle nove", "Perché fa caldo"], answer: 0, explain: "On Sundays there's always a very long queue, so they need to be there at nine." }
  - { q: "Che cosa succede, secondo Davide, se lanci una moneta nella Fontana di Trevi?", options: ["Trovi l'amore", "Torni a Roma", "Paghi di meno"], answer: 1, explain: "«Se lanci una moneta nella fontana, torni a Roma!» – the famous tradition." }
  - { q: "Che cosa fanno il pomeriggio se piove?", options: ["Vanno a Villa Borghese", "Vanno al cinema", "Tornano a casa"], answer: 1, explain: "If the weather is nice they go to Villa Borghese; «se piove, andiamo al cinema!»" }
  - { q: "Che tempo fa a Roma in questi giorni?", options: ["Fa freddo e piove", "Fa caldo e c'è il sole", "C'è vento e nevica"], answer: 1, explain: "«A Roma fa caldo: ci sono ventotto gradi e c'è sempre il sole.»" }
glossary:
  - { es: binario, en: platform }
  - { es: panna, en: whipped cream }
  - { es: lunghissima, en: very long }
  - { es: imperiali, en: imperial }
  - { es: lanci, en: you throw }
  - { es: leggeri, en: light }
  - { es: abbraccio, en: hug }
