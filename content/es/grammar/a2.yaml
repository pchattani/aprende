- id: g.preterite-regular
  level: a2
  title: "The preterite — completed past actions"
  summary: "hablé, comí, viví: what happened, at a definite point in the past."
  explanation: |
    The *pretérito indefinido* reports finished actions and events: *Ayer comí paella. Nací en 1995.*

    | | -ar (hablar) | -er (comer) | -ir (vivir) |
    |---|---|---|---|
    | yo | habl**é** | com**í** | viv**í** |
    | tú | habl**aste** | com**iste** | viv**iste** |
    | él/ella/usted | habl**ó** | com**ió** | viv**ió** |
    | nosotros | habl**amos** | com**imos** | viv**imos** |
    | vosotros | habl**asteis** | com**isteis** | viv**isteis** |
    | ellos/ustedes | habl**aron** | com**ieron** | viv**ieron** |

    - -er and -ir share the same endings.
    - *nosotros* of -ar and -ir verbs looks like the present (*hablamos, vivimos*); context tells you which.
    - The accents on *yo* and *él* matter: *hablo* (I speak) vs *habló* (he spoke).
  examples:
    - { es: "Ayer trabajé hasta las ocho.", en: "Yesterday I worked until eight." }
    - { es: "¿Qué comisteis anoche?", en: "What did you (all) eat last night?" }
    - { es: "Mis padres vivieron en Alemania tres años.", en: "My parents lived in Germany for three years." }
  pitfalls:
    - "Don't forget the written accents: *hablé, habló, comí, comió, viví, vivió.*"
  drills:
    - { es: "El sábado cenamos en casa de Ana.", en: "On Saturday we had dinner at Ana's." }
    - { es: "Llegaste muy tarde.", en: "You arrived very late." }
- id: g.time-markers-past
  level: a2
  title: "Time markers for the past"
  summary: "ayer, anoche, la semana pasada, hace dos años, en 2010, el otro día."
  explanation: |
    These expressions signal a closed time frame and go with the preterite:
    - *ayer* (yesterday), *anteayer* (the day before), *anoche* (last night), *esta mañana*
    - *el lunes pasado, la semana pasada, el mes pasado, el año pasado, el verano pasado*
    - *hace + time*: *hace dos días, hace un año* (two days ago, a year ago)
    - *en 2010, en enero, el 3 de mayo, a los diez años* (at the age of ten)
    - *el otro día* (the other day), *una vez* (once), *de repente* (suddenly), *entonces* (then)
    - Ordering a story: *primero … después / luego … al final / finalmente*
  examples:
    - { es: "Hace tres años viajé a Perú.", en: "Three years ago I travelled to Peru." }
    - { es: "El verano pasado trabajamos en un hotel.", en: "Last summer we worked in a hotel." }
    - { es: "Anoche no dormí bien.", en: "Last night I didn't sleep well." }
  pitfalls:
    - "*hace* + period means 'ago' with the preterite; with the present it means 'for' (*hace dos años que vivo aquí*)."
  drills:
    - { es: "El otro día encontré a Luis en el metro.", en: "The other day I ran into Luis in the metro." }
    - { es: "Nació en mil novecientos ochenta.", en: "She was born in 1980." }
- id: g.preterite-spelling-changes
  level: a2
  title: "Spelling changes in the preterite"
  summary: "busqué, pagué, empecé; leyó, leyeron; creí, oí."
  explanation: |
    The sound stays regular; the spelling adapts.
    - **-car → -qué** (yo): *buscar → busqué, tocar → toqué, sacar → saqué*
    - **-gar → -gué** (yo): *pagar → pagué, llegar → llegué, jugar → jugué*
    - **-zar → -cé** (yo): *empezar → empecé, almorzar → almorcé, cruzar → crucé*
    - **vowel + -er/-ir**: *i → y* in the third persons: *leer → leyó, leyeron; creer → creyó; oír → oyó; construir → construyó.* The other forms take an accent on the í: *leí, leíste, leímos, leísteis.*
    - **-ñir / -llir** drop the i: *gruñó*.
  examples:
    - { es: "Llegué a casa a las diez y busqué las llaves.", en: "I got home at ten and looked for my keys." }
    - { es: "Empecé a estudiar español en enero.", en: "I started studying Spanish in January." }
    - { es: "Mi abuela leyó el periódico y oyó la radio.", en: "My grandmother read the paper and listened to the radio." }
  pitfalls:
    - "Only *yo* changes in -car/-gar/-zar verbs: *buscaste, buscó* stay regular."
  drills:
    - { es: "Jugué al tenis y luego pagué la cena.", en: "I played tennis and then paid for dinner." }
    - { es: "Ellos no creyeron la historia.", en: "They didn't believe the story." }
- id: g.preterite-irregular
  level: a2
  title: "Irregular preterites — tener, hacer, poder, poner, decir…"
  summary: "A new stem plus unstressed endings: tuve, hice, pude, puse, dije, vine, quise, supe, estuve."
  explanation: |
    A group of very common verbs takes a special stem and **endings without accents**: *-e, -iste, -o, -imos, -isteis, -ieron.*

    | verb | stem | yo | él |
    |---|---|---|---|
    | tener | tuv- | tuve | tuvo |
    | estar | estuv- | estuve | estuvo |
    | andar | anduv- | anduve | anduvo |
    | poder | pud- | pude | pudo |
    | poner | pus- | puse | puso |
    | saber | sup- | supe | supo |
    | haber | hub- | hube | hubo |
    | hacer | hic- | hice | **hizo** |
    | querer | quis- | quise | quiso |
    | venir | vin- | vine | vino |
    | decir | dij- | dije | dijo (ellos **dijeron**) |
    | traer | traj- | traje | trajo (ellos **trajeron**) |
    | conducir | conduj- | conduje | condujo (ellos **condujeron**) |

    *dar* and *ver* are short: *di, diste, dio, dimos, disteis, dieron* · *vi, viste, vio, vimos, visteis, vieron.* *Hay* becomes **hubo**.
  examples:
    - { es: "Tuve que trabajar el domingo.", en: "I had to work on Sunday." }
    - { es: "¿Qué hiciste ayer? No hice nada.", en: "What did you do yesterday? I didn't do anything." }
    - { es: "Me dijeron que no pudieron venir.", en: "They told me they couldn't come." }
  pitfalls:
    - "Stems ending in -j drop the i: *dijeron, trajeron*, not dijieron."
    - "*hizo* with z, not *hico*."
  drills:
    - { es: "Puse las llaves en la mesa y no las encontré.", en: "I put the keys on the table and couldn't find them." }
    - { es: "Vinieron todos a la fiesta.", en: "Everyone came to the party." }
- id: g.preterite-ser-ir
  level: a2
  title: "Ser and ir in the preterite — the same forms"
  summary: "fui, fuiste, fue, fuimos, fuisteis, fueron — 'I was' and 'I went'."
  explanation: |
    *Ser* and *ir* share one preterite: *fui, fuiste, fue, fuimos, fuisteis, fueron.* Context decides:
    - *Fui médico durante veinte años.* (ser — I was a doctor)
    - *Fui al médico ayer.* (ir — I went to the doctor; *a* usually follows *ir*)

    *Fue* is also the usual way to say an event "was": *La fiesta fue en mi casa. Fue un día fantástico.*
  examples:
    - { es: "El año pasado fuimos a Italia.", en: "Last year we went to Italy." }
    - { es: "Mi abuelo fue profesor.", en: "My grandfather was a teacher." }
    - { es: "¿Adónde fuisteis el domingo?", en: "Where did you (all) go on Sunday?" }
  pitfalls:
    - "No accents anywhere in *fui, fue* (monosyllables)."
  drills:
    - { es: "La boda fue muy bonita.", en: "The wedding was very beautiful." }
    - { es: "Fueron al cine sin mí.", en: "They went to the cinema without me." }
- id: g.preterite-stem-changing
  level: a2
  title: "Preterite of -ir stem-changers — pidió, durmió"
  summary: "Only the third persons change: e → i, o → u (pidió, pidieron; durmió, durmieron)."
  explanation: |
    -ar and -er stem-changing verbs are regular in the preterite (*pensé, volví*). **-ir** verbs change only in *él/ella/usted* and *ellos/ustedes*:
    - **e → i**: *pedir → pidió, pidieron; sentir → sintió; preferir → prefirió; seguir → siguió; repetir → repitió; servir → sirvió; vestirse → se vistió; divertirse → se divirtió*
    - **o → u**: *dormir → durmió, durmieron; morir → murió, murieron*

    The same vowel change appears in the gerund: *pidiendo, durmiendo, sintiendo.*
  examples:
    - { es: "Pedí un café y ella pidió un té.", en: "I ordered a coffee and she ordered a tea." }
    - { es: "Los niños durmieron diez horas.", en: "The children slept ten hours." }
    - { es: "Mi abuelo murió en 2015.", en: "My grandfather died in 2015." }
  pitfalls:
    - "*yo* and *tú* are regular: *pedí, pediste; dormí, dormiste.*"
  drills:
    - { es: "Se divirtieron mucho en la fiesta.", en: "They had a lot of fun at the party." }
    - { es: "Prefirió quedarse en casa.", en: "She preferred to stay at home." }
- id: g.imperfect
  level: a2
  title: "The imperfect — forms"
  summary: "hablaba, comía, vivía; only ser (era), ir (iba) and ver (veía) are irregular."
  explanation: |
    | | -ar (hablar) | -er/-ir (comer, vivir) |
    |---|---|---|
    | yo | habl**aba** | com**ía** |
    | tú | habl**abas** | com**ías** |
    | él/ella/usted | habl**aba** | com**ía** |
    | nosotros | habl**ábamos** | com**íamos** |
    | vosotros | habl**abais** | com**íais** |
    | ellos/ustedes | habl**aban** | com**ían** |

    Only three irregulars:
    - **ser**: era, eras, era, éramos, erais, eran
    - **ir**: iba, ibas, iba, íbamos, ibais, iban
    - **ver**: veía, veías, veía, veíamos, veíais, veían

    *Hay* becomes **había**. No stem changes in the imperfect: *quería, podía, dormía.*
  examples:
    - { es: "Cuando era niño vivía en un pueblo.", en: "When I was a child I lived in a village." }
    - { es: "Mis abuelos tenían una casa en la playa.", en: "My grandparents had a house on the beach." }
    - { es: "Había mucha gente en la calle.", en: "There were a lot of people in the street." }
  pitfalls:
    - "*yo* and *él* are identical (*hablaba*): use the pronoun if needed."
  drills:
    - { es: "Íbamos al colegio a pie.", en: "We used to walk to school." }
    - { es: "Antes no me gustaba el pescado.", en: "I didn't use to like fish." }
- id: g.imperfect-uses
  level: a2
  title: "The imperfect — uses"
  summary: "Habits in the past, descriptions, background, age, time and what was going on."
  explanation: |
    The *imperfecto* paints the scene rather than reporting events:
    1. **Habits and repeated actions**: *Todos los veranos íbamos a la playa.* (we used to go)
    2. **Descriptions** of people, places, weather: *Era alto y tenía el pelo largo. Hacía frío.*
    3. **Age and time**: *Tenía ocho años. Eran las diez.*
    4. **Ongoing action / background**: *Llovía y la gente corría.*
    5. **Mental states**: *Quería ser médico. No sabía la respuesta.*
    6. **Politeness**: *Quería un café, por favor.*

    Typical markers: *antes, siempre, todos los días, de niño/a, cuando era pequeño, normalmente, a menudo, mientras.*
  examples:
    - { es: "De niña jugaba en la calle con mis amigos.", en: "As a girl I used to play in the street with my friends." }
    - { es: "La casa era grande y tenía un jardín enorme.", en: "The house was big and had a huge garden." }
    - { es: "¿Qué hacías a las diez? Estaba durmiendo.", en: "What were you doing at ten? I was sleeping." }
  pitfalls:
    - "'Used to' = imperfect, never *usaba*: *antes fumaba* (I used to smoke)."
  drills:
    - { es: "Mi padre trabajaba en una fábrica.", en: "My father worked in a factory." }
    - { es: "Entonces no había móviles.", en: "Back then there were no mobile phones." }
- id: g.soler
  level: a2
  title: "Soler + infinitive — usually"
  summary: "Suelo levantarme a las siete. Solía jugar al fútbol."
  explanation: |
    *soler* (o → ue) + infinitive expresses habit:
    - Present: *suelo, sueles, suele, solemos, soléis, suelen* — *Suelo desayunar en casa.* (I usually…)
    - Imperfect: *solía, solías…* — *Solíamos ir al cine los viernes.* (we used to…)

    It is not used in the preterite or future. Alternatives: *normalmente, generalmente, acostumbrar a.*
  examples:
    - { es: "¿Qué sueles hacer los domingos?", en: "What do you usually do on Sundays?" }
    - { es: "Antes solía leer mucho más.", en: "I used to read much more before." }
    - { es: "Mi abuela solía cantar en la cocina.", en: "My grandmother used to sing in the kitchen." }
  pitfalls:
    - "*soler* needs an infinitive after it; it never stands alone."
  drills:
    - { es: "Suelen cenar tarde.", en: "They usually have dinner late." }
    - { es: "Solíamos vivir cerca del mar.", en: "We used to live near the sea." }
- id: g.preterite-vs-imperfect
  level: a2
  title: "Preterite or imperfect?"
  summary: "Preterite = what happened (events, the plot). Imperfect = what was going on (scene, habits, states)."
  explanation: |
    | **Preterite** (indefinido) | **Imperfect** |
    |---|---|
    | completed event, with beginning and end | background, ongoing, no end in view |
    | *Ayer llovió.* (it rained — done) | *Llovía cuando salí.* (it was raining) |
    | sequence of actions: *Entró, se sentó y pidió un café.* | simultaneous / habitual: *Siempre entraba, se sentaba y pedía un café.* |
    | a specific number of times: *Fui tres veces.* | an indefinite habit: *Iba a menudo.* |
    | change of state: *Me puse nervioso.* | state: *Estaba nervioso.* |

    A story usually mixes them: imperfect for the setting, preterite for what happened next.
    *Era tarde y no había nadie en la calle. De repente, oí un ruido.*

    Verbs that change meaning: *sabía* (I knew) / *supe* (I found out); *conocía* (I knew him) / *conocí* (I met him); *quería* (I wanted) / *quise* (I tried) / *no quise* (I refused); *podía* (I was able) / *pude* (I managed).
  examples:
    - { es: "Mientras cenábamos, llamó mi madre.", en: "While we were having dinner, my mother called." }
    - { es: "Conocí a mi mujer en 2010; entonces vivía en Sevilla.", en: "I met my wife in 2010; back then she lived in Seville." }
    - { es: "No pude ir porque estaba enfermo.", en: "I couldn't go because I was ill." }
  pitfalls:
    - "Age and time in the past are almost always imperfect: *tenía veinte años, eran las tres.*"
  drills:
    - { es: "Estaba en la ducha cuando sonó el teléfono.", en: "I was in the shower when the phone rang." }
    - { es: "Ayer hizo sol, pero hoy llueve.", en: "Yesterday it was sunny, but today it is raining." }
- id: g.narration-connectors
  level: a2
  title: "Telling a story — connectors"
  summary: "primero, después, luego, entonces, de repente, al final, mientras, cuando, así que."
  explanation: |
    - **Order**: *primero / al principio* → *después / luego / más tarde* → *al final / finalmente / por último*
    - **Sudden events**: *de repente, de pronto, en ese momento*
    - **Consequence**: *así que, por eso, entonces* (so)
    - **Cause**: *porque, como* (as, at the start: *Como llovía, nos quedamos en casa.*)
    - **Contrast**: *pero, sin embargo, aunque*
    - **Background**: *mientras* (while), *cuando* (when)
    - **Ending**: *total, que…* (informal: so, in the end…)
  examples:
    - { es: "Primero fuimos al museo y después comimos en la plaza.", en: "First we went to the museum and then we ate in the square." }
    - { es: "De repente empezó a llover, así que volvimos al hotel.", en: "Suddenly it started to rain, so we went back to the hotel." }
    - { es: "Como no tenía dinero, no compré nada.", en: "As I had no money, I didn't buy anything." }
  pitfalls:
    - "*como* at the start of a sentence means 'since / as', not 'how'."
  drills:
    - { es: "Al final todo salió bien.", en: "In the end everything turned out fine." }
    - { es: "Sin embargo, no me gustó la película.", en: "However, I didn't like the film." }
- id: g.mientras-cuando
  level: a2
  title: "Mientras and cuando with past tenses"
  summary: "mientras + imperfect (two things going on); cuando + preterite (interruption) or + imperfect (habit)."
  explanation: |
    - **mientras + imperfect, imperfect**: two actions in progress — *Mientras yo cocinaba, ella leía.*
    - **mientras + imperfect, preterite**: an event during a background — *Mientras dormía, sonó la alarma.*
    - **cuando + preterite, imperfect**: interruption — *Cuando llegué, todos comían.*
    - **cuando + preterite, preterite**: sequence — *Cuando terminé, me fui.*
    - **cuando + imperfect, imperfect**: habit — *Cuando era niño, iba a la playa.*

    *Mientras que* (whereas) contrasts: *A mí me gusta el té, mientras que a él le gusta el café.*
  examples:
    - { es: "Mientras esperaba el autobús, vi a Marta.", en: "While I was waiting for the bus, I saw Marta." }
    - { es: "Cuando vivía en Madrid, salía todos los fines de semana.", en: "When I lived in Madrid, I went out every weekend." }
    - { es: "Cuando llegamos, la película ya había empezado.", en: "When we arrived, the film had already started." }
  drills:
    - { es: "Mientras tú dormías, yo trabajaba.", en: "While you were sleeping, I was working." }
    - { es: "Cuando sonó el teléfono, estábamos cenando.", en: "When the phone rang, we were having dinner." }
- id: g.present-perfect
  level: a2
  title: "The present perfect — he comido"
  summary: "haber (he, has, ha, hemos, habéis, han) + participle (-ado / -ido)."
  explanation: |
    **he · has · ha · hemos · habéis · han** + participle: *-ar → -ado* (*hablado*), *-er/-ir → -ido* (*comido, vivido*).

    In Spain the *pretérito perfecto* is used for:
    1. Recent past within a period that includes now: *hoy, esta mañana, esta semana, este año* — *Hoy he desayunado tarde.*
    2. Life experience, no specific time: *¿Has estado en México? Nunca he comido insectos.*
    3. Results relevant now: *He perdido las llaves.* (and I don't have them)

    The two parts never separate: *No he comido* (not *he no comido*); pronouns go before *haber*: *Lo he visto.*
  examples:
    - { es: "Esta semana he trabajado mucho.", en: "This week I've worked a lot." }
    - { es: "¿Habéis visto esta película? Sí, la hemos visto dos veces.", en: "Have you seen this film? Yes, we've seen it twice." }
    - { es: "Todavía no han llegado.", en: "They haven't arrived yet." }
  pitfalls:
    - "The participle never agrees here: *ella ha comido*, not *comida*."
  variant: "Latin America prefers the simple preterite for recent events (*hoy desayuné tarde*); the perfect is rarer and more 'ongoing'."
  drills:
    - { es: "Nunca he estado en Argentina.", en: "I've never been to Argentina." }
    - { es: "¿Ya has terminado los deberes?", en: "Have you finished your homework already?" }
- id: g.participles-irregular
  level: a2
  title: "Irregular participles"
  summary: "hecho, dicho, visto, puesto, abierto, escrito, roto, muerto, vuelto."
  explanation: |
    | verb | participle | | verb | participle |
    |---|---|---|---|---|
    | hacer | **hecho** | | abrir | **abierto** |
    | decir | **dicho** | | escribir | **escrito** |
    | ver | **visto** | | romper | **roto** |
    | poner | **puesto** | | morir | **muerto** |
    | volver | **vuelto** | | cubrir | **cubierto** |
    | freír | **frito** | | imprimir | **impreso** |

    Compounds follow: *deshecho, descubierto, devuelto, compuesto, descrito.* With a vowel before -ido an accent is written: *leído, oído, caído, traído, reído* (but *construido* — ui is a diphthong).

    Participles also work as adjectives, and then they **do** agree: *la puerta está abierta, los libros están escritos en español.*
  examples:
    - { es: "¿Qué has hecho hoy? He escrito un correo.", en: "What have you done today? I've written an email." }
    - { es: "He visto a Juan, pero no le he dicho nada.", en: "I've seen Juan, but I haven't told him anything." }
    - { es: "La ventana está rota.", en: "The window is broken." }
  drills:
    - { es: "Hemos puesto la mesa.", en: "We have set the table." }
    - { es: "Ha vuelto muy tarde.", en: "He has come back very late." }
- id: g.ya-todavia
  level: a2
  title: "Ya, todavía no, alguna vez, nunca"
  summary: "¿Ya has comido? Todavía no. ¿Has estado alguna vez en Roma? Nunca."
  explanation: |
    These adverbs pair naturally with the present perfect:
    - **ya** — already: *Ya he terminado.* In questions: *¿Ya has comido?*
    - **todavía no / aún no** — not yet: *Todavía no he comido.*
    - **alguna vez** — ever: *¿Has estado alguna vez en Roma?*
    - **nunca / jamás** — never: *Nunca he estado en Roma. / No he estado nunca.*
    - **ya no** — no longer: *Ya no vivo allí.*
    - **todavía / aún** — still: *Todavía vivo con mis padres.*
    - **últimamente, recientemente, hasta ahora** — lately, recently, so far
  examples:
    - { es: "¿Ya has visto la nueva película? Todavía no.", en: "Have you seen the new film yet? Not yet." }
    - { es: "¿Has probado alguna vez el gazpacho?", en: "Have you ever tried gazpacho?" }
    - { es: "Ya no fumo.", en: "I don't smoke any more." }
  pitfalls:
    - "*ya no* (no longer) vs *todavía no* (not yet) — opposites of each other."
  drills:
    - { es: "Aún no hemos decidido nada.", en: "We haven't decided anything yet." }
    - { es: "Nunca han viajado en avión.", en: "They have never travelled by plane." }
- id: g.perfect-vs-preterite
  level: a2
  title: "Present perfect or preterite?"
  summary: "Spain: this morning / this week / this year → perfect; yesterday / last year → preterite."
  explanation: |
    In Spain the choice follows the time frame:
    - **Period still open** (*hoy, esta mañana, esta semana, este mes, este año, últimamente, nunca, ya, todavía no*) → **perfect**: *Este año he viajado mucho.*
    - **Period closed** (*ayer, anoche, la semana pasada, el año pasado, en 2010, hace dos días*) → **preterite**: *El año pasado viajé mucho.*

    Compare: *Esta mañana he desayunado en el bar.* / *Ayer desayuné en el bar.*

    Life experience with no time → perfect: *He estado en París.* A specific trip → preterite: *Estuve en París en 2019.*
  examples:
    - { es: "Hoy he comido con mis padres; ayer comí solo.", en: "Today I had lunch with my parents; yesterday I ate alone." }
    - { es: "¿Has estado en Barcelona? Sí, estuve allí hace dos años.", en: "Have you been to Barcelona? Yes, I was there two years ago." }
    - { es: "Esta semana no he tenido tiempo.", en: "This week I haven't had time." }
  variant: "Most of Latin America uses the preterite in both cases (*hoy comí con mis padres*)."
  drills:
    - { es: "Este mes hemos ido tres veces al cine.", en: "This month we've been to the cinema three times." }
    - { es: "El lunes pasado fuimos al teatro.", en: "Last Monday we went to the theatre." }
- id: g.direct-object-pronouns
  level: a2
  title: "Direct object pronouns — me, te, lo, la, nos, os, los, las"
  summary: "Replace the thing or person affected: ¿El libro? Lo leo. ¿A María? La veo."
  explanation: |
    | | singular | plural |
    |---|---|---|
    | 1st | *me* | *nos* |
    | 2nd | *te* | *os* |
    | 3rd m. | *lo* (it, him, you-usted) | *los* |
    | 3rd f. | *la* (it, her, you-usted) | *las* |

    - Before the conjugated verb: *Lo compro. No la conozco. ¿Me oyes?*
    - Attached to infinitive / gerund, or before the first verb: *Voy a comprarlo / Lo voy a comprar. Estoy leyéndolo / Lo estoy leyendo.*
    - Attached to affirmative imperatives: *¡Cómpralo!*
    - *lo* also stands for a whole idea: *¿Sabes que viene Ana? — Sí, lo sé.*

    In Spain, *le* is often used for a male person as direct object (*leísmo*): *A Juan le vi ayer.* Both *lo vi* and *le vi* are accepted for people.
  examples:
    - { es: "¿Has visto mis gafas? No, no las he visto.", en: "Have you seen my glasses? No, I haven't seen them." }
    - { es: "Te quiero mucho.", en: "I love you a lot." }
    - { es: "¿Nos esperas aquí?", en: "Will you wait for us here?" }
  pitfalls:
    - "Spanish repeats the pronoun even when the noun comes first: *El coche lo compró mi padre.*"
  drills:
    - { es: "La película la vimos ayer.", en: "We saw the film yesterday." }
    - { es: "¿Me puedes ayudar? Sí, te ayudo.", en: "Can you help me? Yes, I'll help you." }
- id: g.indirect-object-pronouns
  level: a2
  title: "Indirect object pronouns — me, te, le, nos, os, les"
  summary: "The person who receives or is affected: Le doy el libro a Ana. ¿Me compras pan?"
  explanation: |
    | | singular | plural |
    |---|---|---|
    | 1st | *me* | *nos* |
    | 2nd | *te* | *os* |
    | 3rd | *le* (to him / her / you) | *les* (to them / you all) |

    - Typical verbs: *dar, decir, regalar, enviar, escribir, preguntar, contar, pedir, comprar, explicar, enseñar, prestar, gustar, parecer, doler.*
    - Spanish very often **doubles** the indirect object: *Le he dado el libro a Ana. Les escribo a mis padres.* The *a + person* clarifies who *le/les* is.
    - Position rules are the same as for direct objects: before the conjugated verb, or attached to infinitive / gerund / affirmative imperative.
  examples:
    - { es: "Le he comprado un regalo a mi madre.", en: "I've bought my mother a present." }
    - { es: "¿Me prestas tu bolígrafo?", en: "Can you lend me your pen?" }
    - { es: "Les voy a explicar la gramática.", en: "I'm going to explain the grammar to them." }
  pitfalls:
    - "*le* is for both masculine and feminine: *a ella le digo, a él le digo.*"
  drills:
    - { es: "Nos han enviado una carta.", en: "They have sent us a letter." }
    - { es: "¿Qué le dijiste a tu jefe?", en: "What did you tell your boss?" }
- id: g.double-object-pronouns
  level: a2
  title: "Two pronouns together — se lo, me la, te los"
  summary: "Indirect before direct; le/les becomes se before lo/la/los/las."
  explanation: |
    Order: **indirect + direct** — *Me lo das* (you give it to me). *Te la presto* (I lend it to you).

    When *le / les* meets *lo / la / los / las*, it turns into **se**: *Le doy el libro a Ana → Se lo doy.* *Les envío las fotos → Se las envío.*

    Attached to an infinitive or imperative, they come together with an accent to keep the stress: *Voy a dárselo. ¡Dámelo! Está explicándonoslo.*
  examples:
    - { es: "¿Me das tu número? Sí, te lo doy ahora.", en: "Will you give me your number? Yes, I'll give it to you now." }
    - { es: "Le compré un regalo a Marta y se lo di en su cumpleaños.", en: "I bought Marta a present and gave it to her on her birthday." }
    - { es: "¿Las llaves? Se las he dejado al portero.", en: "The keys? I've left them with the porter." }
  pitfalls:
    - "Never *le lo*: always *se lo*."
  drills:
    - { es: "Nos lo explicó muy bien.", en: "He explained it to us very well." }
    - { es: "¿Puedes enviármelo mañana?", en: "Can you send it to me tomorrow?" }
- id: g.pronoun-placement
  level: a2
  title: "Where do pronouns go?"
  summary: "Before a conjugated verb; attached to infinitives, gerunds and affirmative imperatives."
  explanation: |
    1. **Before** a conjugated verb (any tense), after *no*: *No lo sé. Te lo he dicho. Se levanta.*
    2. **Attached** to the end of an infinitive, a gerund, or an affirmative imperative: *Quiero verlo. Estoy haciéndolo. Dímelo.*
    3. With verb + infinitive / gerund, both positions are fine: *Lo quiero ver = Quiero verlo. Me estoy duchando = Estoy duchándome.*
    4. **Negative imperative**: before the verb — *No lo hagas. No te levantes.*
    5. Add a written accent when attaching keeps the stress on the same syllable: *dámelo, cómpralo, explicándonoslo.*
    6. Reflexive + object: *Me lo lavo* (I wash it — my hair). *Se la puso* (he put it on).
  examples:
    - { es: "¿Puedes traérmelo? — Te lo traigo ahora.", en: "Can you bring it to me? — I'll bring it to you now." }
    - { es: "No se lo digas a nadie.", en: "Don't tell anyone." }
    - { es: "Está lavándose las manos.", en: "She is washing her hands." }
  pitfalls:
    - "Never between *haber* and the participle: *lo he visto*, not *he lo visto*."
  drills:
    - { es: "Voy a comprármelo.", en: "I'm going to buy it for myself." }
    - { es: "Levántate y vístete.", en: "Get up and get dressed." }
- id: g.future-simple
  level: a2
  title: "The future — hablaré"
  summary: "Infinitive + é, ás, á, emos, éis, án for all three conjugations."
  explanation: |
    Add the endings to the whole infinitive:

    | | hablar | comer | vivir |
    |---|---|---|---|
    | yo | hablar**é** | comer**é** | vivir**é** |
    | tú | hablar**ás** | comer**ás** | vivir**ás** |
    | él/ella/usted | hablar**á** | comer**á** | vivir**á** |
    | nosotros | hablar**emos** | comer**emos** | vivir**emos** |
    | vosotros | hablar**éis** | comer**éis** | vivir**éis** |
    | ellos/ustedes | hablar**án** | comer**án** | vivir**án** |

    Uses: predictions and promises (*Mañana lloverá. Te llamaré.*), plans felt as distant or formal, and probability (*Serán las diez* — it must be about ten). In conversation *ir a + infinitive* is more common for intentions.
  examples:
    - { es: "El año que viene viajaremos a Chile.", en: "Next year we will travel to Chile." }
    - { es: "¿Vendrás a mi boda? Claro que iré.", en: "Will you come to my wedding? Of course I'll go." }
    - { es: "Según el periódico, mañana hará sol.", en: "According to the paper, tomorrow will be sunny." }
  pitfalls:
    - "All forms except *nosotros* carry an accent."
  drills:
    - { es: "Te escribiré cuando llegue.", en: "I'll write to you when I arrive." }
    - { es: "Los niños estarán cansados.", en: "The children will be tired." }
- id: g.future-irregular
  level: a2
  title: "Irregular futures — tendré, haré, podré, diré"
  summary: "Twelve verbs change the stem; the endings stay regular."
  explanation: |
    | drop the e | insert d | shorten |
    |---|---|---|
    | poder → **podr**é | tener → **tendr**é | hacer → **har**é |
    | saber → **sabr**é | poner → **pondr**é | decir → **dir**é |
    | querer → **querr**é | venir → **vendr**é | |
    | haber → **habr**é (hay → habrá) | salir → **saldr**é | |
    | caber → **cabr**é | valer → **valdr**é | |

    Compounds follow: *mantendré, propondré, deshará.* The same stems form the conditional (*tendría, haría*).
  examples:
    - { es: "Tendré que trabajar el sábado.", en: "I'll have to work on Saturday." }
    - { es: "¿Qué harás este verano? No sé, saldré con amigos.", en: "What will you do this summer? I don't know, I'll go out with friends." }
    - { es: "Habrá mucha gente en el concierto.", en: "There will be a lot of people at the concert." }
  drills:
    - { es: "Te diré la verdad.", en: "I'll tell you the truth." }
    - { es: "No podremos venir mañana.", en: "We won't be able to come tomorrow." }
- id: g.future-probability
  level: a2
  title: "The future for guessing — ¿Dónde estará?"
  summary: "Serán las ocho. Estará en casa. Tendrá unos treinta años."
  explanation: |
    Spanish uses the future tense to speculate about the **present**:
    - *¿Qué hora es? — Serán las ocho.* (It must be about eight.)
    - *¿Dónde está Ana? — Estará en el trabajo.* (She's probably at work.)
    - *¿Cuántos años tiene? — Tendrá unos cuarenta.* (He must be about forty.)
    - *¿Quién llama a estas horas? — Será Luis.*

    Other probability words: *probablemente, seguramente, a lo mejor, quizás, tal vez, igual* (informal).
  examples:
    - { es: "No contesta al teléfono; estará durmiendo.", en: "She isn't answering the phone; she's probably sleeping." }
    - { es: "¿Cuánto cuesta ese coche? Costará unos veinte mil euros.", en: "How much is that car? It must cost about twenty thousand euros." }
    - { es: "Tendrán hambre, no han comido nada.", en: "They must be hungry, they haven't eaten anything." }
  drills:
    - { es: "Serán las once ya.", en: "It must be eleven already." }
    - { es: "Estarán en el jardín.", en: "They're probably in the garden." }
- id: g.si-present-future
  level: a2
  title: "Si + present — real conditions"
  summary: "Si tengo tiempo, iré. Si llueve, no salimos."
  explanation: |
    For conditions that may well come true:
    **si + present indicative, + present / future / imperative**
    - *Si hace sol, vamos a la playa.*
    - *Si estudias, aprobarás.*
    - *Si tienes frío, cierra la ventana.*

    *Si* (if, no accent) never takes the future or the present subjunctive directly after it: *si tengo*, never *si tendré / si tenga*.

    Related: *cuando + subjunctive* for future time (B1), *si no* (if not) and *a menos que* (unless, B1).
  examples:
    - { es: "Si terminamos pronto, podemos ir al cine.", en: "If we finish early, we can go to the cinema." }
    - { es: "Si no te das prisa, perderás el tren.", en: "If you don't hurry, you'll miss the train." }
    - { es: "Si quieres, te ayudo.", en: "If you like, I'll help you." }
  pitfalls:
    - "*si* (if) has no accent; *sí* (yes) does."
  drills:
    - { es: "Si llueve mañana, nos quedaremos en casa.", en: "If it rains tomorrow, we'll stay at home." }
    - { es: "Si tienes hambre, come algo.", en: "If you're hungry, eat something." }
- id: g.comparatives
  level: a2
  title: "Comparatives — más que, menos que, tan como"
  summary: "más alto que, menos caro que, tan grande como, tanto dinero como; mejor, peor, mayor, menor."
  explanation: |
    - **más + adjective/adverb/noun + que**: *Madrid es más grande que Sevilla. Corre más rápido que yo. Tiene más libros que yo.*
    - **menos … que**: *Es menos caro que el otro.*
    - **tan + adjective/adverb + como**: *Es tan alta como su madre.*
    - **tanto/a/os/as + noun + como**: *Tengo tantos amigos como tú.* **tanto como** with verbs: *Trabaja tanto como yo.*
    - Irregulars: *bueno → mejor, malo → peor, grande (age) → mayor, pequeño (age) → menor.* *Más bueno/más grande* exist for taste/size.
    - Numbers: *más de / menos de*: *más de cien personas.*
  examples:
    - { es: "Mi hermano es mayor que yo, pero yo soy más alto.", en: "My brother is older than me, but I am taller." }
    - { es: "Este restaurante es tan bueno como el otro, y menos caro.", en: "This restaurant is as good as the other one, and less expensive." }
    - { es: "Hoy hace más frío que ayer.", en: "Today it is colder than yesterday." }
  pitfalls:
    - "Never *más mejor*: *mejor* already means better."
    - "Before a number use *de*: *más de diez*, not *más que diez*."
  drills:
    - { es: "El tren es más rápido que el autobús.", en: "The train is faster than the bus." }
    - { es: "No tengo tanto tiempo como tú.", en: "I don't have as much time as you." }
- id: g.superlatives
  level: a2
  title: "Superlatives — el más alto de, buenísimo"
  summary: "el/la/los/las + más/menos + adjective + de; -ísimo; el mejor, el peor."
  explanation: |
    - **el / la / los / las (+ noun) + más / menos + adjective + de**: *Es la ciudad más bonita de España. Es el chico menos tímido de la clase.*
    - Irregular: *el mejor, el peor, el mayor, el menor*: *Es mi mejor amigo.*
    - **-ísimo/a/os/as** (absolute superlative, very very): *buenísimo, carísimo, muchísimo, facilísimo, riquísimo* (c → qu), *larguísimo* (g → gu), *felicísimo* (z → c).
    - *muy, super-, extremadamente* also intensify.
  examples:
    - { es: "El Everest es la montaña más alta del mundo.", en: "Everest is the highest mountain in the world." }
    - { es: "Es el peor día de mi vida.", en: "It's the worst day of my life." }
    - { es: "La paella estaba riquísima.", en: "The paella was absolutely delicious." }
  pitfalls:
    - "'In' after a superlative is *de*: *el más alto de la clase.*"
  drills:
    - { es: "Es la mejor película del año.", en: "It is the best film of the year." }
    - { es: "Este ejercicio es dificilísimo.", en: "This exercise is extremely difficult." }
- id: g.muy-vs-mucho
  level: a2
  title: "Muy or mucho?"
  summary: "muy + adjective/adverb (never changes); mucho + noun (agrees) or after a verb."
  explanation: |
    - **muy** before adjectives and adverbs: *muy alto, muy bien, muy despacio.* It never changes and never stands alone.
    - **mucho / mucha / muchos / muchas** before nouns, agreeing: *mucho tiempo, mucha gente, muchos coches.*
    - **mucho** after a verb (adverb, no agreement): *Trabaja mucho. Me gusta mucho.*
    - Answers: *¿Es caro? — Sí, mucho.* (not *muy*). *¿Estás cansado? — Muy cansado / Mucho.*
    - Never *muy mucho*: use *muchísimo*.
    - Same pattern: *poco* (poco tiempo / muy poco), *demasiado, bastante, tanto.*
  examples:
    - { es: "Hay mucha gente y hace mucho calor, pero estoy muy contento.", en: "There are many people and it is very hot, but I am very happy." }
    - { es: "Me gusta mucho; es muy interesante.", en: "I like it a lot; it is very interesting." }
    - { es: "Tienes muchos libros muy antiguos.", en: "You have many very old books." }
  drills:
    - { es: "Habla muy rápido y come mucho.", en: "He speaks very fast and eats a lot." }
    - { es: "Tengo mucha sed.", en: "I am very thirsty." }
- id: g.opinions
  level: a2
  title: "Giving opinions — creo que, me parece que, para mí"
  summary: "Creo que…, pienso que…, me parece que…, en mi opinión, para mí, estoy de acuerdo."
  explanation: |
    - *Creo que / Pienso que / Me parece que* + indicative: *Creo que tienes razón.*
    - *En mi opinión, para mí, desde mi punto de vista* (from my point of view)
    - *Me parece + adjective*: *Me parece interesante / injusto.*
    - Agreeing / disagreeing: *Estoy (totalmente) de acuerdo. No estoy de acuerdo. Tienes razón. Yo también lo creo. Yo no lo veo así. Depende.*
    - Asking: *¿Qué opinas / piensas / te parece?*
    - After negative opinion verbs Spanish uses the subjunctive (*No creo que sea verdad*) — B1.
  examples:
    - { es: "Me parece que el examen ha sido fácil. ¿Tú qué opinas?", en: "I think the exam was easy. What do you think?" }
    - { es: "Para mí, el mejor plato es la tortilla.", en: "For me, the best dish is the omelette." }
    - { es: "No estoy de acuerdo contigo.", en: "I don't agree with you." }
  pitfalls:
    - "*estar de acuerdo* with *estar* and *de*."
  drills:
    - { es: "Pienso que es una buena idea.", en: "I think it's a good idea." }
    - { es: "¿Qué te parece el nuevo profesor?", en: "What do you think of the new teacher?" }
- id: g.imperative-tu
  level: a2
  title: "The tú imperative — habla, come, escribe; ten, haz, ve"
  summary: "Regular: same as the él form of the present. Eight irregulars: di, haz, ve, pon, sal, sé, ten, ven."
  explanation: |
    Affirmative commands to one person (*tú*):
    - Regular: use the **third-person present**: *hablar → habla, comer → come, escribir → escribe, cerrar → cierra, pedir → pide.*
    - Irregulars: **decir → di, hacer → haz, ir → ve, poner → pon, salir → sal, ser → sé, tener → ten, venir → ven.**
    - Pronouns attach to the end: *levántate, dime, cómpralo, dámelo* (with an accent where needed).
    - Softening: *por favor*, *¿puedes…?*, or the present tense as a request (*¿Me pasas la sal?*).

    Negative commands use the subjunctive: *no hables, no comas* (see negative imperative).
  examples:
    - { es: "Abre la ventana, por favor.", en: "Open the window, please." }
    - { es: "Ven aquí y dime la verdad.", en: "Come here and tell me the truth." }
    - { es: "Haz los deberes antes de cenar.", en: "Do your homework before dinner." }
  pitfalls:
    - "*ve* is both 'go!' (ir) and 'see!' (ver). *Sé* (be!) carries an accent."
  drills:
    - { es: "Pon la mesa y ten cuidado con los vasos.", en: "Set the table and be careful with the glasses." }
    - { es: "Sal de aquí ahora mismo.", en: "Get out of here right now." }
- id: g.imperative-usted
  level: a2
  title: "The usted / ustedes imperative — hable, coma, venga"
  summary: "Swap the vowel: -ar → -e / -en; -er, -ir → -a / -an. Based on the yo form: tenga, haga, diga."
  explanation: |
    Formal commands use the present subjunctive forms:
    - **-ar → -e (usted), -en (ustedes)**: *hablar → hable, hablen; cerrar → cierre, cierren*
    - **-er / -ir → -a, -an**: *comer → coma, coman; venir → venga, vengan; pedir → pida, pidan*
    - Build from the irregular *yo* form: *tengo → tenga, hago → haga, digo → diga, pongo → ponga, conozco → conozca, salgo → salga.*
    - Spelling: *buscar → busque, llegar → llegue, empezar → empiece, coger → coja.*
    - Fully irregular: *ser → sea, estar → esté, ir → vaya, dar → dé, saber → sepa.*
    - Pronouns attach: *siéntese, dígame, tráiganos.*
  examples:
    - { es: "Siga todo recto y gire a la derecha.", en: "Go straight on and turn right. (formal)" }
    - { es: "Pase, siéntese, por favor.", en: "Come in, sit down, please." }
    - { es: "Esperen un momento, por favor.", en: "Wait a moment, please. (plural)" }
  pitfalls:
    - "*Dígame* is how Spaniards answer the phone."
  variant: "In Latin America *ustedes* commands (*hablen, vengan*) are used for any group, formal or not."
  drills:
    - { es: "Tenga cuidado con el escalón.", en: "Mind the step." }
    - { es: "No se preocupe.", en: "Don't worry. (formal)" }
- id: g.imperative-vosotros
  level: a2
  title: "The vosotros imperative — hablad, comed, venid; sentaos"
  summary: "Replace the -r of the infinitive with -d. With os the -d disappears: levantaos."
  explanation: |
    Commands to several people you address as *vosotros* (Spain):
    - **infinitive -r → -d**: *hablar → hablad, comer → comed, venir → venid, ser → sed, ir → id.*
    - No irregulars at all.
    - With the reflexive *os* the -d drops: *levantar → levantaos, sentar → sentaos, callar → callaos.* Exception: *irse → idos.*
    - Other pronouns attach normally: *decidme, traedlo.*
    - In speech the infinitive is often used instead: *¡Callar!, ¡Venir aquí!* (colloquial, not standard).
  examples:
    - { es: "Niños, venid a cenar y lavaos las manos.", en: "Children, come to dinner and wash your hands." }
    - { es: "Abrid el libro en la página diez.", en: "Open the book at page ten." }
    - { es: "Sentaos, por favor.", en: "Sit down, please. (vosotros)" }
  variant: "Latin America has no vosotros; use the *ustedes* forms (*vengan, siéntense*)."
  drills:
    - { es: "Escuchad con atención.", en: "Listen carefully." }
    - { es: "Decidme qué queréis.", en: "Tell me what you (all) want." }
- id: g.imperative-pronouns
  level: a2
  title: "Imperatives with pronouns and recipes"
  summary: "Dámelo. Ponlo aquí. Córtalas. Mézclalo todo. Add an accent to keep the stress."
  explanation: |
    - Affirmative imperative + pronoun(s) **attached**, indirect before direct: *dame, dámelo, cómpraselo, lávate las manos → lávatelas.*
    - Keep the original stress with a written accent: *compra → cómpralo; pon → ponlo (no accent, one syllable added); da → dámelo.*
    - Recipes and instructions use *tú* or the infinitive: *Corta la cebolla y fríela con aceite. Añade sal. Mezclar todo y servir frío.*
    - Useful recipe verbs: *cortar, pelar, freír, cocer, hervir, añadir, mezclar, batir, calentar, servir, dejar reposar.*
  examples:
    - { es: "Pela las patatas y córtalas en trozos pequeños.", en: "Peel the potatoes and cut them into small pieces." }
    - { es: "Bate los huevos y añádelos a la sartén.", en: "Beat the eggs and add them to the pan." }
    - { es: "Pásame la sal, por favor. — Tómala.", en: "Pass me the salt, please. — Here you are." }
  drills:
    - { es: "Mézclalo todo y déjalo reposar diez minutos.", en: "Mix everything and let it rest for ten minutes." }
    - { es: "Explícamelo otra vez.", en: "Explain it to me again." }
- id: g.por-vs-para
  level: a2
  title: "Por or para?"
  summary: "para = purpose, destination, deadline, recipient; por = cause, means, exchange, movement through, duration."
  explanation: |
    | **para** | **por** |
    |---|---|
    | purpose: *Estudio para aprender.* (in order to) | cause / reason: *Lo hago por ti. Cerrado por vacaciones.* |
    | recipient: *Es para ti.* | exchange / price: *Lo compré por diez euros.* |
    | destination: *Salgo para Madrid.* | means: *por teléfono, por correo, por internet* |
    | deadline: *para el lunes* | movement through / along: *pasear por el parque* |
    | opinion: *Para mí, es fácil.* | approximate time / place: *por la mañana, por aquí* |
    | contrast: *Para ser niño, habla bien.* | duration: *por dos horas* (or *durante*) |
    | | agent (passive): *escrito por Cervantes* |
    | | on behalf of: *Trabajo por mi compañero hoy.* |

    Fixed expressions with *por*: *por favor, por supuesto, por fin, por ejemplo, por eso, por ciento, por lo menos.*
  examples:
    - { es: "Este regalo es para mi madre; lo compré por veinte euros.", en: "This present is for my mother; I bought it for twenty euros." }
    - { es: "Fuimos a Granada por la autopista para ver la Alhambra.", en: "We went to Granada by the motorway to see the Alhambra." }
    - { es: "Gracias por todo.", en: "Thanks for everything." }
  pitfalls:
    - "'Thanks for' = *gracias por*; 'for' a person as recipient = *para*."
  drills:
    - { es: "Necesito el informe para el viernes.", en: "I need the report by Friday." }
    - { es: "Hablamos por teléfono todos los días.", en: "We talk on the phone every day." }
- id: g.prepositions-verbs
  level: a2
  title: "Verbs with prepositions"
  summary: "pensar en, soñar con, depender de, empezar a, acabar de, casarse con, hablar de, preocuparse por."
  explanation: |
    The preposition is part of the verb and often differs from English:
    - **a**: *empezar a, ir a, venir a, aprender a, ayudar a, invitar a, llegar a, acostumbrarse a, dedicarse a*
    - **de**: *acabar de, dejar de, depender de, hablar de, acordarse de, olvidarse de, tratar de, alegrarse de, darse cuenta de, tener ganas de*
    - **en**: *pensar en, entrar en, confiar en, insistir en, tardar en, consistir en, fijarse en*
    - **con**: *soñar con, casarse con, contar con, quedar con, encontrarse con*
    - **por**: *preocuparse por, preguntar por, interesarse por*
    - **no preposition** (unlike English): *buscar, esperar, escuchar, mirar, pedir, pagar (something)*: *Busco trabajo. Espero el autobús.*
  examples:
    - { es: "Sueño con viajar a Japón.", en: "I dream of travelling to Japan." }
    - { es: "Depende del tiempo que haga.", en: "It depends on the weather." }
    - { es: "Estoy buscando mis gafas.", en: "I'm looking for my glasses." }
  pitfalls:
    - "*pensar en* (think about) / *pensar que* (think that) / *pensar + infinitive* (plan to)."
  drills:
    - { es: "Me acuerdo de mi primer profesor.", en: "I remember my first teacher." }
    - { es: "Se casó con un italiano.", en: "She married an Italian." }
- id: g.desde-hace
  level: a2
  title: "Since when and for how long — desde, hace, desde hace, llevar"
  summary: "Vivo aquí desde 2020 / desde hace tres años / hace tres años que vivo aquí / llevo tres años viviendo aquí."
  explanation: |
    All with the **present** tense for something that continues:
    - **desde + point in time**: *Trabajo aquí desde enero / desde que llegué.*
    - **desde hace + period**: *Trabajo aquí desde hace dos años.*
    - **hace + period + que + present**: *Hace dos años que trabajo aquí.*
    - **llevar + period + gerund**: *Llevo dos años trabajando aquí.* (very common in Spain)
    - **llevar + period + sin + infinitive**: *Llevo tres días sin fumar.*
    - Question: *¿Desde cuándo…? ¿Cuánto tiempo hace que…? ¿Cuánto tiempo llevas…?*
    - In the past: *hace + period* alone = ago, with the preterite: *Llegué hace dos años.*
  examples:
    - { es: "¿Desde cuándo estudias español? Desde hace seis meses.", en: "How long have you been studying Spanish? For six months." }
    - { es: "Hace diez años que no veo a mi primo.", en: "I haven't seen my cousin for ten years." }
    - { es: "Llevamos una hora esperando.", en: "We've been waiting for an hour." }
  pitfalls:
    - "English 'have been living' = Spanish present: *vivo aquí desde…*"
  drills:
    - { es: "Mis padres están casados desde 1990.", en: "My parents have been married since 1990." }
    - { es: "Llevo dos semanas sin ver la televisión.", en: "I haven't watched TV for two weeks." }
- id: g.a-personal
  level: a2
  title: "The personal a"
  summary: "Before a person (or pet) that is the direct object: Veo a María. Busco a mi perro. Not after tener."
  explanation: |
    When the direct object is a **specific person** (or a loved pet), Spanish inserts **a**:
    - *Veo a mi hermano. Conozco a tu profesora. Llamo a Juan. Quiero a mis padres.*
    - Also with *alguien, nadie, ¿quién?*: *¿A quién buscas? No veo a nadie.*
    - **No a** after *tener* (*Tengo dos hermanos*) or with non-specific people (*Busco un médico* — any doctor; *Busco a un médico que habla inglés* — a particular one).
    - Not with things: *Veo la televisión.*
    - *a + el = al*: *Veo al profesor.*
  examples:
    - { es: "¿Has visto a Carmen? Sí, la he visto en el mercado.", en: "Have you seen Carmen? Yes, I saw her at the market." }
    - { es: "Quiero mucho a mi abuela.", en: "I love my grandmother very much." }
    - { es: "No conozco a nadie aquí.", en: "I don't know anyone here." }
  pitfalls:
    - "*escuchar a alguien* (a person) but *escuchar la música* (a thing)."
  drills:
    - { es: "Visitamos a nuestros abuelos los domingos.", en: "We visit our grandparents on Sundays." }
    - { es: "¿A quién esperas?", en: "Who are you waiting for?" }
- id: g.doler
  level: a2
  title: "Doler — saying what hurts"
  summary: "Me duele la cabeza. Me duelen los pies. ¿Qué te duele?"
  explanation: |
    *doler* (o → ue) works like *gustar*: the body part is the subject.
    - *Me duele la cabeza / el estómago / la garganta.* (singular part)
    - *Me duelen los pies / las piernas / los ojos.* (plural parts)
    - *A mi hijo le duele una muela.*
    - Articles, not possessives, with body parts.
    - Other health language: *tener fiebre / tos / gripe / un resfriado, estar mareado, estar resfriado, tomar una pastilla, ir al médico, la farmacia, la receta.*
    - *Tener dolor de cabeza* is another way to say it.
  examples:
    - { es: "Me duele mucho la espalda.", en: "My back hurts a lot." }
    - { es: "¿Te duelen los oídos? Deberías ir al médico.", en: "Do your ears hurt? You should go to the doctor." }
    - { es: "Le duele una muela y tiene fiebre.", en: "He has toothache and a fever." }
  pitfalls:
    - "*me duele mi cabeza* is wrong — use the article: *la cabeza*."
  drills:
    - { es: "Nos duelen las piernas de tanto caminar.", en: "Our legs hurt from so much walking." }
    - { es: "¿Qué le duele, señora?", en: "What hurts, madam?" }
- id: g.conditional-simple
  level: a2
  title: "The conditional — hablaría, tendría"
  summary: "Infinitive + ía, ías, ía, íamos, íais, ían; same irregular stems as the future."
  explanation: |
    | | hablar | tener (irregular stem) |
    |---|---|---|
    | yo | hablar**ía** | tendr**ía** |
    | tú | hablar**ías** | tendr**ías** |
    | él/ella/usted | hablar**ía** | tendr**ía** |
    | nosotros | hablar**íamos** | tendr**íamos** |
    | vosotros | hablar**íais** | tendr**íais** |
    | ellos/ustedes | hablar**ían** | tendr**ían** |

    Irregular stems = future stems: *podr-, sabr-, querr-, habr-, tendr-, pondr-, vendr-, saldr-, valdr-, har-, dir-.*

    Uses: hypothetical situations (*Yo compraría el rojo*), advice (*Deberías descansar*), wishes (*Me gustaría viajar*), polite requests (*¿Podría ayudarme?*), the future seen from the past (*Dijo que vendría*).
  examples:
    - { es: "Me gustaría vivir en el campo.", en: "I'd like to live in the countryside." }
    - { es: "¿Qué harías con un millón de euros?", en: "What would you do with a million euros?" }
    - { es: "Yo no diría eso.", en: "I wouldn't say that." }
  drills:
    - { es: "Deberíamos salir ahora.", en: "We should leave now." }
    - { es: "Me encantaría conocer a tu familia.", en: "I'd love to meet your family." }
- id: g.conditional-courtesy
  level: a2
  title: "Polite requests — ¿podría…?, me gustaría, querría"
  summary: "The conditional and the imperfect soften requests: ¿Podría ayudarme? Quería un café."
  explanation: |
    - **¿Podría(s) + infinitive?** — Could you…? *¿Podría abrir la ventana?*
    - **Me gustaría + infinitive / noun** — I'd like… *Me gustaría reservar una mesa.*
    - **Querría / Quisiera** — I would like (formal, shops and restaurants).
    - **Imperfect of courtesy**: *Quería preguntarle una cosa. Venía a recoger un paquete.*
    - **¿Le importaría + infinitive?** — Would you mind…? *¿Le importaría esperar un momento?*
    - **¿Sería posible…?** — Would it be possible…?
    - Add *por favor* and *perdone / disculpe* for extra politeness.
  examples:
    - { es: "¿Podría decirme dónde está la salida?", en: "Could you tell me where the exit is?" }
    - { es: "Me gustaría hablar con el director, por favor.", en: "I'd like to speak to the manager, please." }
    - { es: "Quería un kilo de tomates.", en: "I'd like a kilo of tomatoes." }
  drills:
    - { es: "¿Le importaría repetirlo?", en: "Would you mind repeating that?" }
    - { es: "¿Sería posible cambiar la fecha?", en: "Would it be possible to change the date?" }
- id: g.deber-tener-que
  level: a2
  title: "Advice and obligation — deber, tener que, hay que, deberías"
  summary: "tener que = must (necessity); deber = should (duty); deberías = you should (advice); hay que = one must."
  explanation: |
    | | strength | example |
    |---|---|---|
    | **tener que + inf.** | necessity, external | *Tengo que trabajar mañana.* |
    | **deber + inf.** | moral duty, strong advice | *Debes descansar.* |
    | **deberías / debería + inf.** | gentle advice | *Deberías ir al médico.* |
    | **hay que + inf.** | impersonal rule | *Hay que beber agua.* |
    | **necesitar + inf.** | need | *Necesitas dormir más.* |
    | **no hace falta + inf.** | it's not necessary | *No hace falta reservar.* |
    | **es mejor / conviene + inf.** | it's better / advisable | *Es mejor llegar pronto.* |

    *deber de + infinitive* = probability (*Debe de tener treinta años*).
  examples:
    - { es: "Si te duele la cabeza, deberías tomar algo.", en: "If your head hurts, you should take something." }
    - { es: "Tienes que ir al hospital ahora mismo.", en: "You have to go to the hospital right now." }
    - { es: "No hace falta que vengas.", en: "You don't need to come." }
  drills:
    - { es: "Debes comer más fruta y menos dulces.", en: "You should eat more fruit and fewer sweets." }
    - { es: "Hay que descansar después de la operación.", en: "One has to rest after the operation." }
- id: g.estar-gerund-past
  level: a2
  title: "Estaba haciendo — actions in progress in the past"
  summary: "imperfect of estar + gerund for background; estuve + gerund for a bounded period."
  explanation: |
    - **estaba + gerund**: what was happening at a moment: *Estaba durmiendo cuando llamaste.*
    - **estuve + gerund**: an activity that lasted a known time and ended: *Estuve estudiando toda la tarde.*
    - **he estado + gerund**: recent, still relevant: *He estado trabajando todo el día.*
    - Irregular gerunds: *leyendo, oyendo, yendo, durmiendo, pidiendo, diciendo, viniendo, pudiendo, sintiendo.*
    - Pronouns: *Estaba duchándome / Me estaba duchando.*
  examples:
    - { es: "¿Qué estabas haciendo a las diez? Estaba viendo la tele.", en: "What were you doing at ten? I was watching TV." }
    - { es: "Estuvimos hablando dos horas.", en: "We were talking for two hours." }
    - { es: "Mientras estaba cocinando, se cortó.", en: "While she was cooking, she cut herself." }
  drills:
    - { es: "Los niños estaban jugando cuando empezó a llover.", en: "The children were playing when it started to rain." }
    - { es: "He estado leyendo toda la mañana.", en: "I've been reading all morning." }
- id: g.acabar-de
  level: a2
  title: "Acabar de + infinitive — to have just"
  summary: "Acabo de llegar. Acababa de salir cuando llamaste."
  explanation: |
    - **acabar de + infinitive** (present): something that happened a moment ago — *Acabo de comer.* (I've just eaten.) *Acaban de llegar.*
    - **acababa de + infinitive** (imperfect): had just — *Acababa de salir cuando empezó a llover.*
    - Not used in the preterite with this meaning.
    - Related: *acabar* alone = to finish (*Acabé el libro*), *acabar con* = to put an end to, *al final* = in the end.
  examples:
    - { es: "Acabo de ver a tu hermano en la calle.", en: "I've just seen your brother in the street." }
    - { es: "¿Tienes hambre? No, acabo de cenar.", en: "Are you hungry? No, I've just had dinner." }
    - { es: "Acabábamos de sentarnos cuando sonó el teléfono.", en: "We had just sat down when the phone rang." }
  drills:
    - { es: "Acaban de abrir una tienda nueva.", en: "They've just opened a new shop." }
    - { es: "Acabo de enterarme.", en: "I've just found out." }
- id: g.volver-a
  level: a2
  title: "Volver a, empezar a, dejar de, seguir — verb phrases"
  summary: "volver a + inf. (again), empezar a (start), dejar de (stop), seguir + gerund (keep on), terminar de (finish)."
  explanation: |
    - **volver a + infinitive** — to do again: *He vuelto a perder las llaves.* (I've lost my keys again.)
    - **empezar a / comenzar a / ponerse a + infinitive** — to start: *Empezó a llover. Se puso a llorar.*
    - **dejar de + infinitive** — to stop / give up: *Dejé de fumar hace un año.*
    - **seguir / continuar + gerund** — to keep on: *Sigue estudiando.*
    - **terminar de / acabar de + infinitive** — to finish: *Terminé de trabajar a las seis.*
    - **llevar + gerund** — to have been doing (duration).
  examples:
    - { es: "No vuelvas a hacer eso.", en: "Don't do that again." }
    - { es: "Dejó de llover y volvimos a salir.", en: "It stopped raining and we went out again." }
    - { es: "Sigo trabajando en la misma empresa.", en: "I'm still working at the same company." }
  pitfalls:
    - "*dejar de* + infinitive = stop doing; *dejar* alone = leave / let."
  drills:
    - { es: "Empezó a estudiar chino el año pasado.", en: "He started studying Chinese last year." }
    - { es: "Volveré a llamarte mañana.", en: "I'll call you again tomorrow." }
- id: g.indefinite-pronouns
  level: a2
  title: "Alguien, nadie, algo, nada, alguno, ninguno, siempre, nunca"
  summary: "Positive: alguien, algo, algún/alguno, siempre, también. Negative: nadie, nada, ningún/ninguno, nunca, tampoco."
  explanation: |
    | positive | negative |
    |---|---|
    | *alguien* (someone) | *nadie* (nobody) |
    | *algo* (something) | *nada* (nothing) |
    | *algún / alguno/a/os/as* (some, any) | *ningún / ninguno/a* (no, none — singular) |
    | *siempre* (always) | *nunca / jamás* (never) |
    | *también* (also) | *tampoco* (neither) |
    | *o … o* (either … or) | *ni … ni* (neither … nor) |

    **Double negative**: when the negative word follows the verb, *no* is required: *No veo a nadie. No tengo nada. No voy nunca.* Before the verb, no *no*: *Nadie viene. Nunca voy.*
    *alguno / ninguno* shorten to *algún / ningún* before a masculine singular noun: *algún día, ningún problema.* *ninguno* is normally singular.
    Personal *a* with people: *¿Conoces a alguien? No conozco a nadie.*
  examples:
    - { es: "¿Hay alguien en casa? No, no hay nadie.", en: "Is there anyone at home? No, there's nobody." }
    - { es: "No quiero nada, gracias.", en: "I don't want anything, thanks." }
    - { es: "¿Tienes algún libro de Borges? No, ninguno.", en: "Do you have any book by Borges? No, none." }
  pitfalls:
    - "English 'anything/anyone' in a negative sentence = *nada / nadie*, with *no* before the verb."
  drills:
    - { es: "Nunca he estado en ningún país asiático.", en: "I've never been to any Asian country." }
    - { es: "Ni Juan ni Ana vinieron.", en: "Neither Juan nor Ana came." }
- id: g.a2-review
  level: a2
  title: "A2 review — the past tenses and pronouns"
  summary: "Preterite for events, imperfect for background, perfect for the recent past; object pronouns before the verb; future and conditional from the infinitive."
  explanation: |
    ### Past tenses at a glance
    | tense | use | example |
    |---|---|---|
    | perfect (*he hablado*) | today, this week, ever, result now | *Hoy he hablado con Ana.* |
    | preterite (*hablé*) | completed event, closed period | *Ayer hablé con Ana.* |
    | imperfect (*hablaba*) | habit, description, background | *Antes hablaba con Ana cada día.* |

    ### Pronouns
    Order: (reflexive) indirect – direct: *se lo, me la.* Before conjugated verbs; attached to infinitive, gerund, affirmative imperative.

    ### Future and conditional
    *hablaré / hablaría*; irregular stems *tendr-, har-, dir-, podr-, pondr-, vendr-, sabr-, querr-, saldr-, habr-.*

    ### Imperatives
    *tú*: *habla, come, ven, haz, di, pon, sal, ten, ve, sé* · *usted*: *hable, coma, venga* · *vosotros*: *hablad, comed, venid* · negative: *no hables, no comas.*
  examples:
    - { es: "Cuando llegué a casa, mi madre ya había preparado la cena y me la sirvió enseguida.", en: "When I got home, my mother had already made dinner and served it to me straight away." }
    - { es: "Este año he viajado poco, pero el año que viene iré a Argentina.", en: "This year I've travelled little, but next year I'll go to Argentina." }
    - { es: "Dame el libro y dime qué te pareció.", en: "Give me the book and tell me what you thought of it." }
  drills:
    - { es: "Ayer no pude venir porque estaba enfermo.", en: "Yesterday I couldn't come because I was ill." }
    - { es: "¿Se lo has dicho ya? Todavía no.", en: "Have you told him yet? Not yet." }
