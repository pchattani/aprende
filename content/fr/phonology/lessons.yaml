lessons:
  - id: ph.vowels
    title: Pure vowels, and é, è, ê
    explanation: |
      French vowels are short, tense and **pure**: no gliding as in English "day" (deɪ) or "no" (nəʊ). Keep your lips and tongue still for the whole vowel. *Café* ends in a clean /e/, never "ca-fay-ee"; *beau* is a pure /o/, never "boh-oo".

      French has more vowel sounds than letters, so it uses letter combinations and accents:

      | Sound | Spellings | Examples |
      |---|---|---|
      | /e/ closed, as in "say" without the glide | é, -er, -ez, -et, *et* | *été*, *parler*, *nez*, *et* |
      | /ɛ/ open, as in "bed" | è, ê, ai, ei, e + 2 consonants | *mère*, *fête*, *lait*, *neige*, *belle* |
      | /o/ closed | o at word end, ô, au, eau | *mot*, *hôtel*, *chaud*, *beau* |
      | /ɔ/ open | o before a pronounced consonant | *porte*, *école*, *homme* |
      | /i/ | i, î, y | *ami*, *île*, *stylo* |
      | /wa/ | oi | *moi*, *voiture*, *trois* |
      | /ø/ /œ/ | eu, œu | *deux*, *peu* / *heure*, *sœur* |

      ### Accents
      - **é** (accent aigu) is always closed /e/: *été*, *thé*.
      - **è** and **ê** are open /ɛ/: *père*, *tête*. The circumflex often marks a lost *s*: *forêt* (forest), *hôpital* (hospital), *fête* (feast).
      - **à, ù** and most circumflexes do not change the sound; they tell words apart: *a* (has) / *à* (to), *ou* (or) / *où* (where), *sur* (on) / *sûr* (sure).
      - **ë, ï** (tréma) mean "say this vowel separately": *Noël* /nɔɛl/, *naïf* /naif/.
      - **ç** is a soft /s/ before a, o, u: *ça*, *garçon*, *français*.
    items:
      - { es: "été", ipa: "e.te", tip: "two closed é, no glide" }
      - { es: "mère", ipa: "mɛʁ", tip: "open è, like 'bed'" }
      - { es: "fête", ipa: "fɛt", tip: "ê = open; the hat replaces an old s (feast)" }
      - { es: "beau", ipa: "bo", tip: "eau = pure o, three letters, one sound" }
      - { es: "moi", ipa: "mwa", tip: "oi = wa" }
      - { es: "deux", ipa: "dø", tip: "say é with rounded lips" }
      - { es: "sœur", ipa: "sœʁ", tip: "say è with rounded lips" }
      - { es: "Noël", ipa: "nɔ.ɛl", tip: "the tréma splits o and ë" }
    minimalPairs: [[été, était], [mes, mais], [des, dès], [peau, pot], [deux, d'eux], [a, à]]
    practice: ["Mon père est né en été.", "Il fait beau au bord de l'eau.", "Ma sœur a deux heures de retard.", "Moi, je bois trois cafés au lait.", "Joyeux Noël à la forêt !"]
  - id: ph.u-ou
    title: U and OU
    explanation: |
      This is the contrast English speakers find hardest, and it changes meaning all the time.

      - **ou** /u/ is the English "oo" in "food": lips rounded and pushed forward, tongue back. *vous*, *tout*, *rouge*, *jour*.
      - **u** /y/ does not exist in English. Say **i** as in "see", keep your tongue exactly there, then round your lips as if to whistle. The tongue stays forward; only the lips move. *tu*, *rue*, *salut*, *musique*.

      ### Tips
      - Practise sliding: *iiii* → round the lips → *uuuu*. If it starts sounding like "oo", your tongue has moved back.
      - *u* followed by another vowel becomes a quick glide /ɥ/: *nuit* /nɥi/, *huit* /ɥit/, *lui* /lɥi/. Compare *oui* /wi/ and *Louis* /lwi/.
      - *dessus* (on top) and *dessous* (underneath) mean opposite things: worth getting right.
    items:
      - { es: "tu", ipa: "ty", tip: "tongue for i, lips for oo" }
      - { es: "tout", ipa: "tu", tip: "plain English oo" }
      - { es: "rue", ipa: "ʁy", tip: "a street (u)" }
      - { es: "roue", ipa: "ʁu", tip: "a wheel (ou)" }
      - { es: "salut", ipa: "sa.ly", tip: "the t is silent, finish on u" }
      - { es: "nuit", ipa: "nɥi", tip: "u glides into i" }
      - { es: "oui", ipa: "wi", tip: "ou glides into i" }
    minimalPairs: [[tu, tout], [rue, roue], [dessus, dessous], [vu, vous], [pur, pour], [lu, loup], [nu, nous]]
    practice: ["Tu as vu tout le monde ?", "Je joue de la musique dans la rue.", "Où sont les chaussures ? Dessus ou dessous ?", "Bonjour, vous voulez du jus ?", "Huit nuits avec lui, oui !"]
  - id: ph.nasals
    title: Nasal vowels — an, on, in, un
    explanation: |
      When a vowel is followed by **n** or **m** in the same syllable, French usually does not pronounce the consonant: the vowel itself becomes **nasal**, with air going through the nose. Stop before your tongue touches the roof of your mouth.

      | Sound | Spellings | Examples |
      |---|---|---|
      | /ɑ̃/ | an, am, en, em | *France*, *chambre*, *enfant*, *temps* |
      | /ɔ̃/ | on, om | *bon*, *nom*, *maison*, *ombre* |
      | /ɛ̃/ | in, im, ain, aim, ein, un, um | *vin*, *simple*, *pain*, *faim*, *plein*, *un*, *parfum* |

      Many speakers in France now say **un** the same as **in**; in Québec and Belgium the older /œ̃/ is still common. Either is fine.

      ### When the vowel is NOT nasal
      - Before a vowel or a second n/m: *bon* /bɔ̃/ but *bonne* /bɔn/; *an* /ɑ̃/ but *année* /a.ne/; *un* /œ̃/ but *une* /yn/.
      - This is why the feminine often "loses" its nasal: *américain* → *américaine*, *italien* → *italienne*.
      - The verb ending **-ent** is silent: *ils parlent* /il paʁl/, but *le vent*, *souvent* are nasal.
    items:
      - { es: "blanc", ipa: "blɑ̃", tip: "an, mouth open, c silent" }
      - { es: "bon", ipa: "bɔ̃", tip: "on, lips rounded" }
      - { es: "vin", ipa: "vɛ̃", tip: "in, lips spread" }
      - { es: "un", ipa: "œ̃", tip: "or the same as in" }
      - { es: "bonne", ipa: "bɔn", tip: "double n: not nasal" }
      - { es: "enfant", ipa: "ɑ̃.fɑ̃", tip: "two /ɑ̃/, t silent" }
      - { es: "pain", ipa: "pɛ̃", tip: "ain = in" }
      - { es: "ils parlent", ipa: "il paʁl", tip: "-ent on a verb is silent" }
    minimalPairs: [[vent, vin], [vin, vont], [lent, long], [blanc, blond], [bon, bonne], [an, âne], [cent, son]]
    practice: ["Un bon vin blanc.", "Mon enfant mange du pain.", "Il fait du vent en France au printemps.", "Cent cinquante ans, c'est long !", "Elle est américaine et lui, américain."]
  - id: ph.silent-letters
    title: Silent final letters
    explanation: |
      Most **final consonants are silent** in French: *petit*, *grand*, *trop*, *deux*, *nez*, *vous*. So is final **e** (apart from one-syllable words like *le*, *je*): *table*, *belle*, *Marie*. Plural **-s** and **-x** are silent too, so *ami* and *amis* sound the same, and **-ent** on verbs is silent: *ils mangent* = *il mange*.

      ### Remember CaReFuL
      The consonants **c, r, f, l** are usually pronounced at the end: *sac*, *bonjour*, *neuf*, *avril*. Exceptions: **-er** verbs and many nouns in *-er* are /e/ (*parler*, *boulanger*), and *blanc*, *porc*, *tabac*, *clef* keep the letter silent.

      ### Why it matters
      A pronounced final consonant often marks the **feminine**: *petit* /pəti/ → *petite* /pətit/, *grand* → *grande*, *vert* → *verte*. The silent *e* makes the consonant before it heard.

      **h** is always silent: *hôtel* /otɛl/, *homme* /ɔm/. **ch** = "sh" (*chat*), **ph** = f (*photo*), **th** = t (*thé*), **gn** = "ny" (*montagne*).
    items:
      - { es: "petit / petite", ipa: "pə.ti / pə.tit", tip: "the e makes the t heard" }
      - { es: "les amis", ipa: "le.za.mi", tip: "plural s silent at the end" }
      - { es: "ils mangent", ipa: "il mɑ̃ʒ", tip: "-ent silent" }
      - { es: "neuf", ipa: "nœf", tip: "CaReFuL: f is heard" }
      - { es: "parler", ipa: "paʁ.le", tip: "-er verb: r silent" }
      - { es: "hôtel", ipa: "o.tɛl", tip: "silent h" }
      - { es: "montagne", ipa: "mɔ̃.taɲ", tip: "gn = ny" }
    minimalPairs: [[petit, petite], [grand, grande], [vert, verte], [il mange, ils mangent], [ami, amie], [chaud, chaude]]
    practice: ["Le petit chat et la petite chatte.", "Ils parlent et ils mangent beaucoup.", "Mon ami habite un grand hôtel à Paris.", "Il fait chaud, la soupe est chaude.", "Bonjour, j'ai neuf sacs !"]
  - id: ph.liaison
    title: Liaison and enchaînement
    explanation: |
      French links words into one stream of syllables. Two mechanisms do it.

      **Enchaînement**: a final consonant that is always pronounced moves to the start of the next word if it begins with a vowel. *Il est* → /i.lɛ/; *une amie* → /y.na.mi/; *avec elle* → /a.vɛ.kɛl/.

      **Liaison**: a final consonant that is normally **silent** is pronounced before a vowel or silent h, and moves to the next syllable. *les* /le/ but *les amis* /le.za.mi/; *vous* /vu/ but *vous avez* /vu.za.ve/.

      | Letter | Sounds like | Example |
      |---|---|---|
      | s, x, z | /z/ | *les enfants*, *deux heures*, *chez elle* |
      | t, d | /t/ | *petit ami*, *quand il* /kɑ̃.til/ |
      | n | /n/ | *un ami*, *mon école*, *on a* |

      ### Required, optional and forbidden
      - **Required**: after determiners and pronouns (*les, des, mes, un, nous, vous, ils, on*), before the verb (*ils ont*), after short adverbs and prepositions (*très, chez, dans, en*), in set phrases (*tout à fait*, *États-Unis*).
      - **Forbidden**: after **et** (*et / il*), after a singular noun (*un étudiant / anglais*), before an **aspirate h** (*les / héros*, *les / haricots*).
      - Optional elsewhere: more liaisons sound more formal.
    items:
      - { es: "les amis", ipa: "le.za.mi", tip: "s → z" }
      - { es: "vous avez", ipa: "vu.za.ve", tip: "s → z" }
      - { es: "un ami", ipa: "œ̃.na.mi", tip: "n links" }
      - { es: "petit ami", ipa: "pə.ti.ta.mi", tip: "t links" }
      - { es: "deux heures", ipa: "dø.zœʁ", tip: "x → z, h silent" }
      - { es: "il est", ipa: "i.lɛ", tip: "enchaînement: l moves over" }
      - { es: "les héros", ipa: "le.e.ʁo", tip: "aspirate h: no liaison" }
    minimalPairs: [[ils sont, ils ont], [les haricots, les abricots], [nous savons, nous avons], [deux sœurs, deux heures]]
    practice: ["Les enfants ont deux amis anglais.", "Vous avez un grand appartement.", "Ils ont un petit ami très aimable.", "Elle est avec une amie à Paris.", "Ils sont six, ils ont six ans."]
  - id: ph.e-caduc
    title: The e caduc (the vanishing e)
    explanation: |
      Unaccented **e** at the end of a syllable is the "schwa" /ə/, like the "a" in "about" but with rounded lips: *le*, *je*, *de*, *petit*, *demain*. In everyday speech it often **disappears**, which is why French can sound so fast.

      - It drops when only one consonant is pronounced on each side: *samedi* → /sam.di/, *maintenant* → /mɛ̃t.nɑ̃/, *je ne sais pas* → /ʒən.se.pa/ or even /ʃe.pa/.
      - In a chain of short words, drop every second one: *je ne le sais pas* → /ʒən.lə.se.pa/.
      - It stays when dropping it would pile up three consonants: *vendredi* /vɑ̃.dʁə.di/.
      - At the end of a word it is silent: *table*, *belle*, *rose*.
      - In songs and poetry it is often pronounced to fill the rhythm, and in the south of France it is pronounced far more.

      Learners do not have to drop it, but recognising the short forms is essential for listening.
    items:
      - { es: "samedi", ipa: "sam.di", tip: "e drops" }
      - { es: "vendredi", ipa: "vɑ̃.dʁə.di", tip: "e stays: d-r-d would be too many consonants" }
      - { es: "maintenant", ipa: "mɛ̃t.nɑ̃", tip: "e drops" }
      - { es: "petit", ipa: "p(ə).ti", tip: "often /pti/ in speech" }
      - { es: "je ne sais pas", ipa: "ʒən.se.pa", tip: "casual: chais pas" }
      - { es: "tout le monde", ipa: "tul.mɔ̃d", tip: "e drops" }
    minimalPairs: [[le, les], [de, des], [je, j'ai], [ce, ces], [premier, première]]
    practice: ["Je ne sais pas.", "On se voit samedi ou vendredi ?", "Tout le monde est là maintenant.", "Je te le donne demain.", "Le petit garçon ne veut pas."]
  - id: ph.r
    title: The French R
    explanation: |
      The standard French **r** /ʁ/ is made at the back of the mouth: the back of the tongue comes close to the soft palate (the uvula), as in a light gargle, or the "ch" of Scottish "loch" but voiced. The tip of the tongue stays down behind the lower teeth. The lips do nothing, unlike the English r.

      ### Tips
      - Start from a word with /g/: say *gare* and relax the closure until air rubs through: /ɡaʁ/ → /ʁaʁ/.
      - At the end of a word it is light, often almost a breath: *bonjour*, *mer*, *sœur*.
      - Between vowels it is soft: *Paris*, *arrêt*. **rr** sounds the same as **r** in modern French.
      - Next to a voiceless consonant it loses its voice: *très*, *quatre* (final -re often almost silent in speech: /kat/).
      - Rolled r (as in Spanish) is heard in parts of the south, in Africa and in older Québec speech: it is understood everywhere, but the uvular r is the standard.
    items:
      - { es: "rouge", ipa: "ʁuʒ", tip: "start at the back of the throat" }
      - { es: "Paris", ipa: "pa.ʁi", tip: "soft between vowels; s silent" }
      - { es: "très", ipa: "tʁɛ", tip: "voiceless after t" }
      - { es: "bonjour", ipa: "bɔ̃.ʒuʁ", tip: "light final r" }
      - { es: "quatre", ipa: "katʁ", tip: "often /kat/ in speech" }
      - { es: "mer", ipa: "mɛʁ", tip: "light, breathy final r" }
      - { es: "rare", ipa: "ʁaʁ", tip: "two r's, same sound" }
    minimalPairs: [[roue, loup], [gare, garde], [rond, long], [cours, coup], [père, paix]]
    practice: ["Le rat rouge rit.", "Bonjour, je voudrais trois croissants.", "Mon frère arrive à Paris vendredi.", "Il pleut à Rennes, quelle horreur !", "Trente-trois gros rats gris."]
  - id: ph.rhythm
    title: Rhythm, stress and intonation
    explanation: |
      French has **no word stress** in the English sense. Syllables are roughly even, and the **last syllable of each phrase** (rhythm group) is slightly longer: *Je voudrais un café* → je-vou-drais-un-ca-**FÉ**. Stressing the "wrong" syllable of a word (*RES-taurant*) makes French sound English; keep it even and lengthen the end.

      Because the stress falls on the group, not the word, *Paris*, *Parisien* and *les Parisiens* all put the weight at the end: pa-**RIS**, pa-ri-**SIEN**, les-pa-ri-**SIENS**.

      ### Intonation
      - Statements fall at the end, with small rises at the end of each group: *Le matin* ↗ *je prends un café* ↘.
      - Yes/no questions often keep statement word order and simply **rise**: *Tu viens ?* ↗. *Est-ce que tu viens ?* also rises.
      - Questions with a question word usually **fall**: *Où est-ce que tu habites ?* ↘.
      - For emphasis French moves words rather than stressing them: *Moi, je l'adore.* / *C'est Paul qui paie.*

      ### Elision
      Short words lose their vowel before a vowel or silent h, and the apostrophe shows it: *le ami* → *l'ami*, *je ai* → *j'ai*, *que il* → *qu'il*, *si il* → *s'il*, *ce est* → *c'est*. It is never optional.
    items:
      - { es: "restaurant", ipa: "ʁɛs.to.ˈʁɑ̃", tip: "even syllables, longer at the end" }
      - { es: "les Parisiens", ipa: "le.pa.ʁi.ˈzjɛ̃", tip: "stress at the end of the group" }
      - { es: "Tu viens ?", tip: "rising question" }
      - { es: "Où est-ce que tu habites ?", tip: "falling question" }
      - { es: "l'ami", ipa: "la.mi", tip: "elision: le + ami" }
      - { es: "Moi, je l'adore.", tip: "emphasis by word order" }
    minimalPairs: []
    practice: ["Je voudrais un café, s'il vous plaît.", "Tu viens au cinéma ce soir ?", "Où est-ce que tu habites à Paris ?", "Moi, j'adore les croissants, mais lui, il préfère le pain.", "C'est l'ami de Marie qui arrive."]
  - id: ph.shadowing
    title: Shadowing in Paris and Québec
    explanation: |
      **Shadowing** means listening to a sentence and repeating it at the same time, or a split second behind, copying rhythm and melody rather than individual sounds. Play each line, then say it with the voice. Aim for linked syllables, an even rhythm and a longer final syllable.

      ### Québec French
      The voices are from France, but you will hear Québec French at the end of the journey. The main differences:
      - **t** and **d** before *i* and *u* become "ts" and "dz": *tu* /tsy/, *dire* /dziʁ/.
      - **i, u, ou** in closed syllables are relaxed: *petite* /pə.tsɪt/, *musique* /my.zɪk/.
      - Long vowels are often diphthongised: *père* /paɛ̯ʁ/, *fête* /faɛ̯t/.
      - Some words differ: *bienvenue* for "you're welcome", *char* (car), *magasiner* (to shop), *souper* (dinner).
      Belgian and Swiss French sound much closer to Paris; listen for *septante*, *nonante* and a slightly slower rhythm.
    items:
      - { es: "Bonjour, ça va ?", tip: "rise on va" }
      - { es: "Je m'appelle Léa.", tip: "four even syllables, longer final a" }
      - { es: "Il y a un petit café au coin de la rue.", tip: "il-y-a-un in one breath" }
      - { es: "Qu'est-ce que tu fais ce soir ?", tip: "kès-k(e)-tu-fais" }
      - { es: "Tu dis ça pour rire.", tip: "Québec: tsu dzis ça" }
    minimalPairs: []
    practice: ["Bonjour, je m'appelle Léa et j'habite à Paris.", "Il y a un petit café au coin de la rue.", "Qu'est-ce que tu fais ce soir ? On va au cinéma ?", "Les enfants sont allés au parc avec leurs amis.", "Je ne sais pas, on verra demain.", "Bienvenue à Québec, il fait moins vingt aujourd'hui !"]
