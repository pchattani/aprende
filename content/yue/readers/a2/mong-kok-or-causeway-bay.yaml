id: r.a2.mong-kok-or-causeway-bay
level: a2
title: 旺角定銅鑼灣好？
kind: dialogue
intro: Ana needs new trainers and a present for her mother. Mandy takes her to Mong Kok, and the two friends compare prices, shops and crowds on Sneakers Street and at the Ladies' Market.
paragraphs:
  - { es: "Ana：「Mandy，我想買對新波鞋。去銅鑼灣定旺角好呀？」Mandy：「旺角啦！旺角有條波鞋街，款式多過銅鑼灣，價錢又平過銅鑼灣。」", en: "Ana: \"Mandy, I want to buy a new pair of trainers. Is it better to go to Causeway Bay or Mong Kok?\" Mandy: \"Mong Kok! Mong Kok has a whole Sneakers Street, with more styles than Causeway Bay and lower prices too.\"" }
  - { es: "星期六下晝，佢哋去到旺角。街上面人多到行唔郁。Ana：「嘩，旺角比銅鑼灣仲擠迫！」Mandy：「係呀，以前有人話呢度係世界上人口最密嘅地方。」", en: "On Saturday afternoon they arrive in Mong Kok. The streets are so crowded you can barely move. Ana: \"Wow, Mong Kok is even more crowded than Causeway Bay!\" Mandy: \"Yes, people once said this was the most densely populated place in the world.\"" }
  - { es: "喺波鞋街，Ana睇中咗兩對鞋：一對白色，一對藍色。Ana：「你話邊對靚啲？」Mandy：「白色嗰對靚啲，不過藍色嗰對平啲，減價七折。」", en: "On Sneakers Street, Ana likes two pairs: a white pair and a blue pair. Ana: \"Which pair do you think is nicer?\" Mandy: \"The white ones are nicer, but the blue ones are cheaper: they're thirty percent off.\"" }
  - { es: "Ana問售貨員：「唔該，呢對有冇三十八碼呀？」售貨員：「有，你試吓啦。」Ana試咗，話：「呢對太緊，有冇大啲嘅？」售貨員：「三十九碼呢？三十九碼闊啲。」Ana：「三十九碼啱啱好！我要呢對。」", en: "Ana asks the shop assistant: \"Excuse me, do you have these in a size 38?\" Assistant: \"Yes, try them on.\" Ana tries them and says: \"These are too tight. Do you have a bigger size?\" Assistant: \"How about a 39? The 39s are wider.\" Ana: \"The 39s fit perfectly! I'll take these.\"" }
  - { es: "跟住佢哋去女人街，幫Ana媽媽買手信。女人街有好多頸巾、手袋同紀念品。Ana：「呢條頸巾幾錢呀？」老闆：「八十蚊。」Mandy細聲講：「講吓價啦，呢度可以講價㗎。」Ana：「六十蚊得唔得呀？」老闆：「七十啦，最平喇！」", en: "Then they go to the Ladies' Market to buy a souvenir for Ana's mother. The Ladies' Market has lots of scarves, handbags and souvenirs. Ana: \"How much is this scarf?\" Stallholder: \"Eighty dollars.\" Mandy whispers: \"Bargain a bit, you can haggle here.\" Ana: \"Would sixty be OK?\" Stallholder: \"Seventy, that's my lowest!\"" }
  - { es: "最後，Ana買咗波鞋同頸巾，一共用咗五百蚊。Ana：「旺角好過銅鑼灣！嘢平啲，又好玩啲。」Mandy：「但係人多過銅鑼灣好多。我哋快啲去食碗車仔麵，然後返屋企啦，我好攰呀！」", en: "In the end Ana buys the trainers and the scarf, spending five hundred dollars altogether. Ana: \"Mong Kok is better than Causeway Bay! Things are cheaper and it's more fun.\" Mandy: \"But it's much more crowded than Causeway Bay. Let's hurry up and have a bowl of cart noodles and then go home, I'm exhausted!\"" }
questions:
  - { q: "點解Mandy話去旺角好？", options: ["因為旺角人少啲", "因為旺角款式多啲，又平啲", "因為Mandy喺旺角住"], answer: 1, explain: "款式多過銅鑼灣，價錢又平過銅鑼灣: more styles and lower prices than Causeway Bay." }
  - { q: "Mandy話邊對鞋靚啲？", options: ["白色嗰對", "藍色嗰對", "兩對一樣靚"], answer: 0, explain: "白色嗰對靚啲, but the blue pair is cheaper." }
  - { q: "Ana最後要幾多碼？", options: ["三十七碼", "三十八碼", "三十九碼"], answer: 2, explain: "The 38s are too tight; 三十九碼啱啱好." }
  - { q: "條頸巾最後幾錢？", options: ["六十蚊", "七十蚊", "八十蚊"], answer: 1, explain: "The stallholder asks eighty, Ana offers sixty, and they settle on 七十啦，最平喇." }
  - { q: "Mandy話旺角有乜嘢唔好？", options: ["太貴", "人太多", "冇嘢食"], answer: 1, explain: "人多過銅鑼灣好多: it's much more crowded." }
glossary:
  - { es: 睇中, en: to take a liking to (something in a shop) }
  - { es: 密, en: dense }
  - { es: 講價, en: to haggle }
  - { es: 車仔麵, en: cart noodles }
