id: r.b2.cheung-po-tsai-cave
level: b2
title: 張保仔嘅寶藏
kind: text
intro: On a day trip to Cheung Chau, Sam and his niece explore the cave where, legend says, the pirate Cheung Po Tsai hid his treasure. Nobody knows for sure - so everyone guesses.
allow: [張保仔, 張保仔洞]
paragraphs:
  - { es: "上個禮拜日，我帶九歲嘅外甥女去長洲玩。佢喺學校聽老師講過海盜張保仔嘅故事，一落船就話要去搵寶藏。我同佢講：「寶藏應該早就畀人搵晒啩。」佢好認真噉話：「唔一定㗎，可能仲有啲未搵到呢！」", en: "Last Sunday I took my nine-year-old niece to Cheung Chau. She had heard her teacher tell the story of the pirate Cheung Po Tsai at school, and as soon as she got off the ferry she said she wanted to look for treasure. I said to her: \"I'd guess people found all the treasure long ago.\" She said very seriously: \"Not necessarily. Maybe there's still some nobody's found!\"" }
  - { es: "張保仔係清朝嘅海盜，大概活喺十九世紀初。傳說佢有幾百隻船、幾萬個手下，喺珠江口一帶搶劫商船，連官府都怕佢。不過佢唔搶窮人，所以有啲漁民仲當佢係英雄。後來佢接受咗朝廷招安，仲做咗官。至於佢搶返嚟嘅錢去咗邊，就冇人講得清楚喇。", en: "Cheung Po Tsai was a pirate in the Qing dynasty who lived around the early nineteenth century. Legend says he had hundreds of ships and tens of thousands of men, and plundered merchant ships around the Pearl River estuary; even the government was afraid of him. But he didn't rob the poor, so some fishermen even regarded him as a hero. Later he accepted an amnesty from the imperial court and even became an official. As for where all the money he had plundered went, nobody can say for sure." }
  - { es: "長洲西南面有個細細嘅山洞，叫張保仔洞。聽講張保仔以前將寶藏收埋喺入面。我哋由碼頭沿住海邊行咗差唔多四十分鐘先到。個洞口好窄，要彎低身先入得去，入面好黑，要用手機電筒照住。", en: "In the south-west of Cheung Chau there's a small cave called Cheung Po Tsai Cave. They say Cheung Po Tsai once hid his treasure inside. We walked along the coast from the pier for nearly forty minutes to get there. The mouth of the cave is very narrow; you have to bend down to get in, and it's so dark inside you have to light the way with your phone torch." }
  - { es: "我外甥女一入去就四圍睇，好似偵探噉。佢指住一條石縫問我：「舅父，寶藏係咪喺呢度呀？」我話：「咁窄，應該放唔落啩。」佢又問：「咁會唔會張保仔將寶藏帶咗去第二度？」我話：「都有可能。我估佢可能用晒啲錢囉，一個人養幾萬個手下，好使錢㗎。」", en: "As soon as she was inside, my niece looked all around like a detective. She pointed at a crack in the rock and asked me: \"Uncle, is the treasure in here?\" I said: \"It's so narrow - I doubt it'd fit.\" She asked again: \"So could Cheung Po Tsai have taken the treasure somewhere else?\" I said: \"Possibly. My guess is he probably spent all the money. Feeding tens of thousands of men costs a lot.\"" }
  - { es: "洞入面有另一個家庭，個爸爸聽到我哋傾偈，就加入討論：「我聽人講，張保仔喺香港好多地方都有洞，赤柱、南丫島都有，可能佢故意整咗好多個假嘅，等人搵唔到真嗰個。」佢個仔就話：「我覺得寶藏喺海底！」大家你一句我一句，好似個個都係專家。", en: "There was another family in the cave. The father overheard our conversation and joined in: \"I've heard Cheung Po Tsai had caves in lots of places in Hong Kong, Stanley and Lamma Island too. Maybe he made lots of fake ones on purpose so nobody could find the real one.\" His son said: \"I think the treasure's at the bottom of the sea!\" Everyone chipped in with their own theory, as if they were all experts." }
  - { es: "行出山洞，天已經開始黑。我外甥女有少少失望：「搵唔到寶藏喎。」我問佢：「咁你今日開唔開心呀？」佢諗咗一陣，笑住話：「開心！我見到海、行咗山洞，仲識咗新朋友。」我話：「噉咪即係搵到寶囉。」", en: "When we came out of the cave, it was already getting dark. My niece was a bit disappointed: \"We didn't find the treasure.\" I asked her: \"So did you have fun today?\" She thought for a moment and smiled: \"Yes! I saw the sea, explored a cave and made new friends.\" I said: \"Well then, that means you did find treasure, doesn't it?\"" }
  - { es: "返程坐船嘅時候，佢喺我膊頭度瞓着咗。佢手入面仲揸住一塊喺沙灘執到嘅貝殼，應該係佢今日嘅「寶藏」啩。至於張保仔嘅寶藏係真定假，我估呢個謎語一百年後都仲未有答案。", en: "On the ferry home, she fell asleep on my shoulder. In her hand she was still clutching a shell she had picked up on the beach - I suppose that was her \"treasure\" for the day. As for whether Cheung Po Tsai's treasure is real or not, I'd guess that riddle still won't have an answer in a hundred years' time." }
questions:
  - { q: "點解外甥女想去搵寶藏？", options: ["佢喺學校聽過張保仔嘅故事", "佢喺網上睇到地圖", "舅父話有寶藏"], answer: 0, explain: "佢喺學校聽老師講過海盜張保仔嘅故事." }
  - { q: "點解有啲漁民當張保仔係英雄？", options: ["因為佢唔搶窮人", "因為佢好有錢", "因為佢係漁民"], answer: 0, explain: "佢唔搶窮人，所以有啲漁民仲當佢係英雄." }
  - { q: "要點樣先入到張保仔洞？", options: ["坐船入去", "彎低身入去", "爬樓梯落去"], answer: 1, explain: "個洞口好窄，要彎低身先入得去." }
  - { q: "舅父估寶藏去咗邊？", options: ["喺海底", "張保仔可能用晒啲錢", "喺石縫入面"], answer: 1, explain: "我估佢可能用晒啲錢囉. The sea bed is the other boy's guess." }
  - { q: "外甥女最後揸住乜嘢？", options: ["一塊貝殼", "一啲錢", "一張地圖"], answer: 0, explain: "一塊喺沙灘執到嘅貝殼, her 'treasure' of the day." }
  - { q: "「應該放唔落啩」入面「啩」表達乜嘢？", options: ["好肯定", "估計，唔太肯定", "命令"], answer: 1, explain: "啩 softens a statement into a guess: \"I doubt it would fit.\"" }
