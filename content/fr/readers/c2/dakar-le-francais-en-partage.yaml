id: r.c2.dakar-le-francais-en-partage
level: c2
title: "Dakar : le français en partage"
kind: dialogue
intro: "A radio interview with a (fictional) Senegalese secondary-school teacher about the place of French in Dakar, next to Wolof. Senegalese French words are explained in the conversation: essencerie (petrol station, standard station-service), dibiterie (grilled-meat stall), gâté (broken, standard en panne / cassé), fréquenter (to go to school), la téranga (Wolof: hospitality). Notice how she nuances and qualifies her answers (il faut nuancer, disons que, ce n'est pas si simple)."
allow: [sociale, linguistes, vision, intellectuels, primaire, dakar, sénégal, sénégalais, sénégalaise, sénégalaises, wolof, senghor, léopold, sédar, gorée, afrique, africain, africaine, africains, africaines, francophonie, francophone, francophones, essencerie, dibiterie, téranga, aminata, ndiaye, mbalax, ok]
paragraphs:
  - { es: "Journaliste : Aminata Ndiaye, vous enseignez le français dans un lycée de Dakar depuis vingt ans. Le français est la langue officielle du Sénégal, mais dans la rue, on entend surtout le wolof. Quelle est réellement la place du français ici ?", en: "Journalist: Aminata Ndiaye, you have been teaching French in a Dakar secondary school for twenty years. French is Senegal's official language, but in the street you mainly hear Wolof. What is the real place of French here?" }
  - { es: "Aminata Ndiaye : Il faut nuancer. Le français est la langue de l'école, de l'administration, de la justice, d'une grande partie de la presse écrite. Quand vous remplissez un formulaire ou que vous passez un examen, c'est en français. Mais dans la vie quotidienne, au marché, dans les bus, en famille, la langue que tout le monde partage, c'est le wolof, même pour ceux dont ce n'est pas la langue maternelle. Disons que le français est la langue de la réussite sociale, et le wolof celle du cœur… même si ce n'est pas si simple.", en: "Aminata Ndiaye: It needs to be qualified. French is the language of school, of administration, of the courts, of much of the written press. When you fill in a form or sit an exam, it's in French. But in daily life, at the market, on the buses, in the family, the language everyone shares is Wolof, even for those whose mother tongue it isn't. Let's say French is the language of social success and Wolof the language of the heart… although it's not that simple." }
  - { es: "Journaliste : Pourquoi n'est-ce pas si simple ?", en: "Journalist: Why isn't it that simple?" }
  - { es: "Aminata Ndiaye : Parce que les deux langues se mélangent sans arrêt ! Écoutez des jeunes Dakarois discuter : ils commencent une phrase en wolof, la terminent en français, glissent un mot d'anglais au milieu. Les linguistes appellent cela l'alternance des langues ; pour nous, c'est simplement notre façon de parler. Et puis le français d'ici a ses propres mots. Quand ma voiture est en panne, je dis qu'elle est gâtée. Pour faire le plein, je vais à l'essencerie. Et le soir, on achète de la viande grillée à la dibiterie du quartier.", en: "Aminata Ndiaye: Because the two languages mix all the time! Listen to young people in Dakar talking: they start a sentence in Wolof, finish it in French, slip in an English word in the middle. Linguists call it code-switching; for us it's simply our way of speaking. And French here has its own words. When my car breaks down, I say it's gâtée. To fill up, I go to the essencerie. And in the evening we buy grilled meat at the neighbourhood dibiterie." }
  - { es: "Journaliste : L'essencerie, c'est un mot qu'on attribue à Léopold Sédar Senghor, n'est-ce pas ?", en: "Journalist: Essencerie is a word attributed to Léopold Sédar Senghor, isn't it?" }
  - { es: "Aminata Ndiaye : C'est ce qu'on raconte, oui. Il trouvait que « station-service » sonnait trop anglais et il a proposé un mot construit comme « boulangerie » ou « épicerie ». Senghor est un personnage essentiel pour comprendre notre rapport au français. Poète, premier président du Sénégal indépendant, il a été le premier Africain élu à l'Académie française, en 1983. Il a aussi été l'un des pères de la Francophonie, cette communauté de pays qui ont le français en partage. Pour lui, le français n'était pas seulement la langue du colonisateur : c'était un outil qu'on pouvait s'approprier pour dire l'Afrique.", en: "Aminata Ndiaye: That's what people say, yes. He felt that 'station-service' sounded too English and proposed a word built like 'boulangerie' or 'épicerie'. Senghor is an essential figure for understanding our relationship with French. A poet, the first president of independent Senegal, he was the first African elected to the Académie française, in 1983. He was also one of the fathers of the Francophonie, that community of countries which share the French language. For him, French was not only the coloniser's language: it was a tool you could make your own to express Africa." }
  - { es: "Journaliste : Tout le monde n'est pas d'accord avec cette vision, j'imagine.", en: "Journalist: Not everyone agrees with that view, I imagine." }
  - { es: "Aminata Ndiaye : Bien sûr que non. Certains écrivains et intellectuels pensent qu'un pays ne peut pas se développer pleinement si les enfants apprennent à lire dans une langue qu'ils ne parlent pas à la maison. Beaucoup d'élèves arrivent à l'école primaire sans connaître un mot de français, et c'est une vraie difficulté. Des programmes ont été lancés pour commencer l'école en wolof ou dans d'autres langues nationales, puis passer progressivement au français. Je trouve que c'est une bonne idée : on apprend mieux une deuxième langue quand on maîtrise déjà la sienne.", en: "Aminata Ndiaye: Of course not. Some writers and intellectuals think that a country cannot fully develop if children learn to read in a language they don't speak at home. Many pupils arrive at primary school without knowing a word of French, and that's a real difficulty. Programmes have been launched to begin school in Wolof or other national languages and then move gradually to French. I think it's a good idea: you learn a second language better when you've already mastered your own." }
  - { es: "Journaliste : Et vos élèves, comment voient-ils le français ?", en: "Journalist: And your pupils, how do they see French?" }
  - { es: "Aminata Ndiaye : Ils sont très pragmatiques. Ils savent que le français leur ouvre des portes : les études, certains métiers, les voyages, les échanges avec d'autres pays africains, puisque le français est parlé de Dakar à Kinshasa. Mais ils refusent qu'on leur dise que leur français n'est pas le « bon ». Quand un élève me dit qu'il « fréquente encore », c'est-à-dire qu'il va toujours à l'école, je ne le corrige pas : je lui explique que c'est du français du Sénégal, et qu'à l'examen il vaudra mieux écrire autrement. Il y a plusieurs français, et il faut savoir passer de l'un à l'autre.", en: "Aminata Ndiaye: They're very pragmatic. They know French opens doors for them: higher education, certain jobs, travel, exchanges with other African countries, since French is spoken from Dakar to Kinshasa. But they refuse to be told their French isn't the 'right' one. When a pupil tells me he 'fréquente encore', meaning he's still at school, I don't correct him: I explain that it's Senegalese French and that in the exam it would be better to write it differently. There are several Frenches, and you have to know how to move from one to another." }
  - { es: "Journaliste : Pour finir, si vous deviez choisir un mot qui résume Dakar ?", en: "Journalist: To finish, if you had to choose one word that sums up Dakar?" }
  - { es: "Aminata Ndiaye : Téranga, sans hésiter. C'est un mot wolof qui veut dire l'hospitalité, l'art d'accueillir l'autre. Vous voyez, même pour parler de nous en français, nous avons besoin d'un mot wolof. C'est peut-être ça, la meilleure réponse à votre première question.", en: "Aminata Ndiaye: Téranga, without hesitation. It's a Wolof word meaning hospitality, the art of welcoming others. You see, even to talk about ourselves in French, we need a Wolof word. Perhaps that's the best answer to your first question." }
questions:
  - { q: "Selon Aminata Ndiaye, quelle langue tout le monde partage dans la vie quotidienne à Dakar ?", options: ["Le français", "Le wolof", "L'anglais"], answer: 1, explain: "«La langue que tout le monde partage, c'est le wolof, même pour ceux dont ce n'est pas la langue maternelle.»" }
  - { q: "Que veut dire « ma voiture est gâtée » au Sénégal ?", options: ["Ma voiture est neuve", "Ma voiture est en panne", "Ma voiture est trop chère"], answer: 1, explain: "In West African French gâter = to break: «Quand ma voiture est en panne, je dis qu'elle est gâtée»." }
  - { q: "Quel rôle Senghor a-t-il joué selon l'interview ?", options: ["Il a interdit le wolof", "Poète et premier président, il a été le premier Africain élu à l'Académie française et l'un des pères de la Francophonie", "Il a fondé une école d'anglais"], answer: 1, explain: "First president of independent Senegal, elected to the Académie française in 1983, one of the fathers of the Francophonie." }
  - { q: "Que pense Aminata des programmes qui commencent l'école en wolof ?", options: ["C'est une bonne idée, car on apprend mieux une deuxième langue quand on maîtrise la sienne", "C'est dangereux pour le français", "C'est inutile"], answer: 0, explain: "«Je trouve que c'est une bonne idée : on apprend mieux une deuxième langue quand on maîtrise déjà la sienne.»" }
  - { q: "Comment réagit-elle quand un élève dit qu'il « fréquente encore » ?", options: ["Elle le corrige sévèrement", "Elle explique que c'est du français du Sénégal et qu'il faut savoir changer de registre à l'examen", "Elle se moque de lui"], answer: 1, explain: "«Il y a plusieurs français, et il faut savoir passer de l'un à l'autre.»" }
