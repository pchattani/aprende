id: r.a1.la-rutina-de-carlos
level: a1
title: La rutina de Carlos
kind: text
intro: Carlos, a waiter in Seville, describes a typical day.
paragraphs:
  - { es: "Me llamo Carlos, tengo treinta años y soy camarero en un restaurante en Sevilla. Mi rutina es un poco diferente porque trabajo por la tarde y por la noche.", en: "My name is Carlos, I'm thirty and I'm a waiter in a restaurant in Seville. My routine is a bit different because I work in the afternoon and at night." }
  - { es: "Normalmente me levanto a las diez. Me ducho, me visto y desayuno tranquilamente: un café, pan con tomate y zumo de naranja. Después leo las noticias en el móvil.", en: "I normally get up at ten. I shower, get dressed and have breakfast calmly: a coffee, bread with tomato and orange juice. Then I read the news on my phone." }
  - { es: "A las once voy al gimnasio o corro por el río. Hago deporte casi todos los días porque es importante para mi trabajo. A la una vuelvo a casa, cocino y como con mi novia, que trabaja en una oficina cerca de casa.", en: "At eleven I go to the gym or run by the river. I do sport almost every day because it's important for my job. At one I come back home, cook and have lunch with my girlfriend, who works in an office near home." }
  - { es: "Empiezo a trabajar a las cinco. El restaurante abre a las ocho para la cena, pero antes tenemos que limpiar y poner las mesas. Trabajo con otros tres camareros y dos cocineros. Son muy simpáticos.", en: "I start work at five. The restaurant opens at eight for dinner, but first we have to clean and set the tables. I work with three other waiters and two cooks. They're very nice." }
  - { es: "Termino a las doce de la noche. A veces tomo una cerveza con mis compañeros y luego vuelvo a casa en bici. Me acuesto a la una y media.", en: "I finish at twelve at night. Sometimes I have a beer with my colleagues and then I come home by bike. I go to bed at half past one." }
  - { es: "Los lunes no trabajo. Es mi día favorito: duermo hasta tarde, veo una película con mi novia y los domingos visitamos a mis padres, que viven en un pueblo cerca de Sevilla.", en: "On Mondays I don't work. It's my favourite day: I sleep late, watch a film with my girlfriend, and on Sundays we visit my parents, who live in a village near Seville." }
questions:
  - { q: "What time does Carlos get up?", options: ["At eight", "At ten", "At eleven"], answer: 1 }
  - { q: "What time does the restaurant open?", options: ["At five", "At eight", "At twelve"], answer: 1 }
  - { q: "Which is Carlos's day off?", options: ["Sunday", "Monday", "Saturday"], answer: 1 }
glossary:
  - { es: diferente, en: different }
  - { es: tranquilamente, en: calmly }
  - { es: noticias, en: news }
  - { es: compañero, en: colleague }
