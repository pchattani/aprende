id: b2.u11
title: "É isso que eu quero dizer"
lessons:
  - id: b2.u11.l1
    title: "Foi a Bia que reservou"
    teach: [g.emphatic-structures]
    vocab: [w.piscina-natural, w.é-que, w.pois-é, w.sem-dúvida, w.de-fato, w.na-verdade, w.na-real, w.olha, w.veja-bem, w.ênfase, w.enfático, w.nossa, w.sururu, w.mergulhar, w.hein]
    tip: "Put the focus up front: Foi a Bia que reservou. O que eu quero é descansar. Eu quero é sombra! Eu é que sei. Ser agrees with the focus: Fui eu que paguei, Foram eles que chegaram."
    sentences:
      - { es: "Foi a Bia que reservou o passeio para as piscinas naturais.", en: "It was Bia who booked the trip to the natural pools.", altEs: ["Foi a Bia quem reservou o passeio para as piscinas naturais.", "Quem reservou o passeio para as piscinas naturais foi a Bia."], grammar: [g.emphatic-structures], vocab: [w.passeio, w.piscina-natural] }
      - { es: "Foi em Maceió que eu vi um mar dessa cor pela primeira vez.", en: "It was in Maceió that I saw a sea of this colour for the first time.", altEs: ["Foi em Maceió que vi um mar dessa cor pela primeira vez.", "Foi em Maceió que eu vi um mar desta cor pela primeira vez."], grammar: [g.emphatic-structures], vocab: [] }
      - { es: "O que mais me impressionou foi a cor da água.", en: "What impressed me most was the colour of the water.", altEs: ["O que me impressionou mais foi a cor da água."], grammar: [g.emphatic-structures], vocab: [] }
      - { es: "Eu quero é sombra e água de coco!", en: "What I want is shade and coconut water!", altEs: ["O que eu quero é sombra e água de coco!"], grammar: [g.emphatic-structures], vocab: [w.sombra, w.água-de-coco] }
      - { es: "Fui eu que paguei a jangada, não o seu irmão.", en: "I was the one who paid for the jangada, not your brother.", altEs: ["Fui eu quem pagou a jangada, não o seu irmão.", "Quem pagou a jangada fui eu, não o seu irmão."], grammar: [g.emphatic-structures], vocab: [w.jangada], transform: { instruction: "Change the focus to nós", answer: "Fomos nós que pagamos a jangada, não o seu irmão.", alt: ["Fomos nós quem pagou a jangada, não o seu irmão."] }, error: { wrong: "Foi eu que paguei a jangada, não o seu irmão.", explain: "ser agrees with the focus: fui eu, foram eles, fomos nós.", grammar: g.emphatic-structures } }
      - { es: "Foram eles que chegaram atrasados, e não a gente.", en: "They were the ones who arrived late, not us.", altEs: ["Foram eles que chegaram atrasados, não nós."], grammar: [g.emphatic-structures, g.a-gente], vocab: [] }
      - { es: "Onde é que você deixou a chave do carro?", en: "Where did you leave the car key?", altEs: ["Onde você deixou a chave do carro?", "Cadê a chave do carro?"], grammar: [g.emphatic-structures, g.question-words], vocab: [w.é-que, w.chave] }
      - { es: "Eu é que sei o que passei para chegar até aqui.", en: "I'm the one who knows what I went through to get here.", grammar: [g.emphatic-structures], vocab: [w.é-que] }
      - { es: "Desculpa o atraso. É que a maré subiu e a gente teve que esperar.", en: "Sorry I'm late. It's just that the tide came in and we had to wait.", altEs: ["Desculpe o atraso. É que a maré subiu e nós tivemos que esperar."], grammar: [g.emphatic-structures], vocab: [w.é-que, w.maré] }
      - { es: "Bem que eu avisei que a maré ia subir!", en: "I did warn you the tide was going to come in!", altEs: ["Eu bem que avisei que a maré ia subir!"], grammar: [g.emphatic-structures], vocab: [w.maré] }
      - { es: "Eu vou, sim! Não perco esse passeio por nada.", en: "I am going! I wouldn't miss this trip for anything.", altEs: ["Vou, sim! Não perco esse passeio por nada."], grammar: [g.emphatic-structures, g.yes-no-answers], vocab: [w.passeio] }
      - { es: "Na verdade, eu nem sabia que Maceió tinha praias tão bonitas.", en: "Actually, I didn't even know Maceió had such beautiful beaches.", altEs: ["Na real, eu nem sabia que Maceió tinha praias tão bonitas."], grammar: [g.imperfect], vocab: [w.na-verdade] }
      - { es: "De fato, a Pajuçara é a praia mais animada da cidade.", en: "Indeed, Pajuçara is the liveliest beach in the city.", altEs: ["Na verdade, a Pajuçara é a praia mais animada da cidade."], grammar: [g.superlatives], vocab: [w.de-fato], variant: "Portugal: de facto." }
      - { es: "Olha, veja bem: eu não disse que não gostei, disse que estava caro.", en: "Look, mind you: I didn't say I didn't like it, I said it was expensive.", grammar: [g.emphatic-structures, g.reported-speech-past], vocab: [w.olha, w.veja-bem] }
      - { es: "Ele falou com tanta ênfase que todo mundo ficou calado.", en: "He spoke with such emphasis that everyone went quiet.", grammar: [g.consequence-clauses], vocab: [w.ênfase] }
      - { es: "Esse filme, eu já vi duas vezes.", en: "I've already seen that film twice.", altEs: ["Eu já vi esse filme duas vezes."], grammar: [g.emphatic-structures], vocab: [], transform: { instruction: "Put the focus on the film with a cleft (Foi esse filme que…)", answer: "Foi esse filme que eu já vi duas vezes.", alt: ["Foi esse filme que já vi duas vezes."] } }
    exchanges:
      - q: { es: "Quem escolheu esse restaurante?", en: "Who chose this restaurant?" }
        a: { es: "Fui eu! Não é o melhor sururu de Maceió?", en: "I did! Isn't it the best sururu in Maceió?" }
        alt: ["Fui eu.", "Foi a Bia que escolheu."]
        grammar: [g.emphatic-structures]
        vocab: [w.sururu]
      - q: { es: "Você não vai entrar na água?", en: "Aren't you going in the water?" }
        a: { es: "Vou, sim! Eu quero é mergulhar nas piscinas naturais.", en: "I certainly am! What I want is to dive into the natural pools." }
        alt: ["Vou, sim!", "Eu quero é mergulhar!"]
        grammar: [g.emphatic-structures, g.yes-no-answers]
        vocab: [w.piscina-natural, w.mergulhar]
      - q: { es: "O “sim” em “Eu vou, sim” é obrigatório?", en: "Is the 'sim' in 'Eu vou, sim' compulsory?" }
        a: { es: "Não, ele é enfático: serve para dar mais força à resposta.", en: "No, it's emphatic: it gives the answer more force." }
        alt: ["Não, é só para dar ênfase.", "Não, é enfático."]
        grammar: [g.emphatic-structures, g.yes-no-answers]
        vocab: [w.enfático]
      - q: { es: "Você gostou mesmo da comida?", en: "Did you really like the food?" }
        a: { es: "Na real? Achei meio sem sal, mas não conta para ninguém.", en: "Honestly? I found it a bit bland, but don't tell anyone." }
        alt: ["Na real, não muito.", "Gostei, sim!"]
        grammar: [g.imperative-informal]
        vocab: [w.na-real]
      - q: { es: "Que calor, hein?", en: "Hot, isn't it?" }
        a: { es: "Pois é! Ainda bem que o mar está pertinho.", en: "Tell me about it! Luckily the sea is really close." }
        alt: ["Pois é!", "Nossa, demais!"]
        grammar: [g.emphatic-structures]
        vocab: [w.pois-é, w.hein, w.pertinho]
      - q: { es: "Valeu a pena vir para Maceió?", en: "Was it worth coming to Maceió?" }
        a: { es: "Sem dúvida! O que eu mais gostei foi a hospitalidade.", en: "Without a doubt! What I liked most was the hospitality." }
        alt: ["Sem dúvida!", "Com certeza!"]
        grammar: [g.emphatic-structures]
        vocab: [w.sem-dúvida, w.hospitalidade]
    texts:
      - title: "Postagem de viagem"
        es: ["Foi em Maceió que eu entendi o que é mar verde.", "O que mais me marcou foram as piscinas naturais na maré baixa.", "Eu quero é voltar no ano que vem!"]
        en: ["It was in Maceió that I understood what a green sea is.", "What struck me most were the natural pools at low tide.", "What I want is to come back next year!"]
        grammar: [g.emphatic-structures]
        vocab: [w.piscina-natural, w.maré]
    spicy:
      - { es: "Foi você que me chamou para dançar, não adianta negar.", en: "It was you who asked me to dance, no use denying it.", altEs: ["Foi você quem me chamou para dançar, não adianta negar."], grammar: [g.emphatic-structures], vocab: [w.adiantar] }
      - { es: "O que eu quero é um pôr do sol com você na Pajuçara.", en: "What I want is a sunset with you at Pajuçara.", altEs: ["Eu quero é um pôr do sol com você na Pajuçara."], grammar: [g.emphatic-structures], vocab: [w.pôr-do-sol] }
      - { es: "Bem que você podia me dar o seu número, né?", en: "You really could give me your number, you know.", altEs: ["Bem que você podia me passar o seu número, né?"], grammar: [g.emphatic-structures, g.pronoun-placement-brazil], vocab: [] }
      - { es: "Eu é que devia te agradecer por essa noite.", en: "I'm the one who should be thanking you for tonight.", grammar: [g.emphatic-structures, g.dever-ter-que], vocab: [w.é-que] }
      - { es: "Nossa, você fica ainda mais bonito molhado de mar.", en: "Wow, you look even more handsome wet from the sea.", altEs: ["Nossa, você fica ainda mais bonita molhada de mar."], grammar: [g.emphatic-structures], vocab: [w.nossa] }
  - id: b2.u11.l2
    title: "Não me diga!"
    teach: [g.clitic-placement-norm]
    vocab: [w.próclise, w.ênclise, w.pronome, w.verbo, w.sujeito, w.objeto, w.oração, w.gramática, w.norma, w.átono, w.tônico]
    tip: "Attractors (não, nunca, que, quem, já, sempre, tudo…) pull the pronoun before the verb: Não me diga! In formal writing, never start a sentence with a pronoun: Disseram-me que… In Brazilian speech, Me disseram que… is normal."
    sentences:
      - { es: "Não me diga que você esqueceu o protetor solar!", en: "Don't tell me you forgot the sunscreen!", altEs: ["Não me diga que esqueceu o protetor solar!"], grammar: [g.clitic-placement-norm], vocab: [w.protetor-solar], error: { wrong: "Não diga-me que você esqueceu o protetor solar!", explain: "não is an attractor: the pronoun goes before the verb (não me diga).", grammar: g.clitic-placement-norm } }
      - { es: "Disseram-me que as piscinas naturais só aparecem na maré baixa.", en: "I was told the natural pools only appear at low tide.", altEs: ["Me disseram que as piscinas naturais só aparecem na maré baixa."], altEn: ["They told me the natural pools only appear at low tide."], grammar: [g.clitic-placement-norm], vocab: [w.piscina-natural, w.maré] }
      - { es: "Quem te ensinou a dançar coco de roda?", en: "Who taught you to dance coco de roda?", altEs: ["Quem lhe ensinou a dançar coco de roda?"], grammar: [g.clitic-placement-norm, g.question-words], vocab: [], note: "Coco de roda: a circle dance from Alagoas and Pernambuco." }
      - { es: "Ela me convidou para a festa na Ponta Verde.", en: "She invited me to the party at Ponta Verde.", altEs: ["Ela convidou-me para a festa na Ponta Verde."], grammar: [g.clitic-placement-norm, g.pronoun-placement-brazil], vocab: [], variant: "Portugal: Ela convidou-me para a festa." }
      - { es: "Sente-se, por favor; o guia já vem atendê-lo.", en: "Please sit down; the guide will be with you shortly.", altEs: ["Sente-se, por favor; o guia já vem atender o senhor."], grammar: [g.clitic-placement-norm, g.imperative-formal], vocab: [w.guia] }
      - { es: "Ninguém me avisou que o passeio tinha sido cancelado.", en: "Nobody told me the trip had been cancelled.", grammar: [g.clitic-placement-norm, g.passive-advanced], vocab: [w.passeio], transform: { instruction: "Start with Avisaram (formal written style)", answer: "Avisaram-me que o passeio tinha sido cancelado.", alt: ["Me avisaram que o passeio tinha sido cancelado."] } }
      - { es: "Espero que se divirtam na Praia do Francês.", en: "I hope you enjoy yourselves at Praia do Francês.", altEs: ["Espero que vocês se divirtam na Praia do Francês."], grammar: [g.clitic-placement-norm, g.subjunctive-wishes], vocab: [] }
      - { es: "Já lhe disse a verdade, senhor.", en: "I've already told you the truth, sir.", altEs: ["Eu já lhe disse a verdade, senhor."], grammar: [g.clitic-placement-norm, g.indirect-object-pronouns], vocab: [] }
      - { es: "Entregaram-nos as chaves da pousada ontem à noite.", en: "They gave us the guesthouse keys last night.", altEs: ["Nos entregaram as chaves da pousada ontem à noite."], grammar: [g.clitic-placement-norm], vocab: [w.chave, w.pousada] }
      - { es: "Todos se divertiram, inclusive o motorista.", en: "Everyone enjoyed themselves, even the driver.", grammar: [g.clitic-placement-norm, g.argumentation-connectors], vocab: [w.motorista] }
      - { es: "Deus te abençoe, meu filho!", en: "God bless you, my son!", altEs: ["Deus o abençoe, meu filho!"], grammar: [g.clitic-placement-norm], vocab: [], note: "Wishes attract the pronoun: Deus te abençoe, Deus me livre." }
      - { es: "Me parece que vai chover.", en: "It looks to me as if it's going to rain.", altEs: ["Parece-me que vai chover."], grammar: [g.clitic-placement-norm], vocab: [], transform: { instruction: "Rewrite for formal writing (no pronoun at the start)", answer: "Parece-me que vai chover." } }
      - { es: "Na próclise o pronome vem antes do verbo; na ênclise, depois.", en: "In proclisis the pronoun comes before the verb; in enclisis, after it.", grammar: [g.clitic-placement-norm], vocab: [w.próclise, w.pronome, w.verbo, w.ênclise] }
      - { es: "Segundo a norma, o pronome átono não deve começar a oração.", en: "According to the norm, an unstressed pronoun should not start a clause.", grammar: [g.clitic-placement-norm], vocab: [w.norma, w.átono, w.oração, w.pronome] }
      - { es: "Na frase “Ela me viu”, “ela” é o sujeito e “me” é o objeto.", en: "In the sentence 'Ela me viu', 'ela' is the subject and 'me' is the object.", grammar: [g.clitic-placement-norm], vocab: [w.sujeito, w.objeto] }
      - { es: "A gramática tradicional chama “mim” e “ti” de pronomes tônicos.", en: "Traditional grammar calls 'mim' and 'ti' stressed pronouns.", grammar: [g.prepositional-pronouns], vocab: [w.gramática, w.tônico, w.pronome], variant: "Portugal: pronomes tónicos." }
    exchanges:
      - q: { es: "Quem te contou da festa?", en: "Who told you about the party?" }
        a: { es: "Foi a recepcionista que me contou.", en: "It was the receptionist who told me." }
        alt: ["A recepcionista me contou.", "A recepcionista."]
        grammar: [g.clitic-placement-norm, g.emphatic-structures]
        vocab: []
      - q: { es: "Você já se acostumou com o calor?", en: "Have you got used to the heat yet?" }
        a: { es: "Ainda não me acostumei, mas já me sinto melhor.", en: "I haven't got used to it yet, but I already feel better." }
        alt: ["Ainda não.", "Já me acostumei, sim."]
        grammar: [g.clitic-placement-norm]
        vocab: []
      - q: { es: "Posso começar o e-mail com “Me envie o relatório”?", en: "Can I start the email with 'Me envie o relatório'?" }
        a: { es: "Num e-mail formal, melhor escrever “Envie-me o relatório”.", en: "In a formal email, it's better to write 'Envie-me o relatório'." }
        alt: ["Melhor escrever “Envie-me”.", "No e-mail formal, não."]
        grammar: [g.clitic-placement-norm, g.register-formal-informal]
        vocab: []
      - q: { es: "Por que se diz “não se preocupe” e não “não preocupe-se”?", en: "Why do you say 'não se preocupe' and not 'não preocupe-se'?" }
        a: { es: "Porque o “não” atrai o pronome para antes do verbo.", en: "Because 'não' pulls the pronoun in front of the verb." }
        alt: ["Por causa do “não”.", "O “não” atrai o pronome."]
        grammar: [g.clitic-placement-norm]
        vocab: [w.pronome, w.verbo]
    texts:
      - title: "E-mail para a agência"
        es: ["Prezados, informaram-me que o passeio de amanhã foi cancelado.", "Peço que me enviem a nova data o quanto antes.", "Agradeço-lhes a atenção."]
        en: ["Dear Sirs, I have been informed that tomorrow's trip has been cancelled.", "I ask that you send me the new date as soon as possible.", "Thank you for your attention."]
        grammar: [g.clitic-placement-norm, g.formal-email]
        vocab: []
    spicy:
      - { es: "Não me olhe assim, que eu esqueço o que ia dizer.", en: "Don't look at me like that, or I'll forget what I was going to say.", grammar: [g.clitic-placement-norm, g.imperative-negative], vocab: [] }
      - { es: "Quem te deu permissão para ser tão charmoso?", en: "Who gave you permission to be so charming?", altEs: ["Quem te deu permissão para ser tão charmosa?"], grammar: [g.clitic-placement-norm], vocab: [] }
      - { es: "Diga-me a verdade: a jangada foi desculpa para sentar do meu lado?", en: "Tell me the truth: was the jangada an excuse to sit next to me?", altEs: ["Me diga a verdade: a jangada foi desculpa para sentar do meu lado?"], grammar: [g.clitic-placement-norm, g.imperative-formal], vocab: [w.jangada] }
      - { es: "Nunca me diverti tanto num passeio de barco.", en: "I've never had so much fun on a boat trip.", grammar: [g.clitic-placement-norm], vocab: [w.passeio] }
      - { es: "Segundo a gramática, o pronome vem antes do verbo; segundo o meu coração, você vem antes de tudo.", en: "According to grammar, the pronoun comes before the verb; according to my heart, you come before everything.", grammar: [g.clitic-placement-norm], vocab: [w.gramática, w.pronome, w.verbo] }
  - id: b2.u11.l3
    title: "Vou te mostrar a orla"
    teach: [g.clitics-verb-phrases]
    vocab: [w.conjugação, w.tempo-verbal, w.advérbio, w.adjetivo, w.substantivo, w.preposição, w.conjunção, w.artigo, w.concordância, w.regência, w.acentuação]
    tip: "Brazil puts the pronoun before the main verb, without a hyphen: vou te mostrar, tinha me dito, estou te esperando. Portugal and formal writing: vou mostrar-te, tinha-me dito. Never after a participle."
    sentences:
      - { es: "Vou te mostrar a orla de Maceió de bicicleta.", en: "I'll show you the Maceió seafront by bike.", altEs: ["Vou mostrar-te a orla de Maceió de bicicleta.", "Vou mostrar a orla de Maceió para você de bicicleta."], grammar: [g.clitics-verb-phrases], vocab: [w.orla, w.bicicleta], variant: "Portugal: Vou mostrar-te a marginal." }
      - { es: "Ela tinha me avisado que o restaurante fechava cedo.", en: "She had warned me that the restaurant closed early.", altEs: ["Ela tinha-me avisado que o restaurante fechava cedo."], grammar: [g.clitics-verb-phrases, g.pluperfect], vocab: [], error: { wrong: "Ela tinha avisado-me que o restaurante fechava cedo.", explain: "A pronoun never goes after a participle: tinha me avisado (Brazil) or tinha-me avisado (Portugal).", grammar: g.clitics-verb-phrases } }
      - { es: "Estou te esperando na barraca em frente às piscinas naturais.", en: "I'm waiting for you at the beach stall opposite the natural pools.", altEs: ["Estou esperando você na barraca em frente às piscinas naturais."], grammar: [g.clitics-verb-phrases, g.estar-gerund], vocab: [w.barraca, w.piscina-natural], variant: "Portugal: Estou à tua espera na barraca." }
      - { es: "Não vou me atrasar desta vez, prometo.", en: "I won't be late this time, I promise.", altEs: ["Não me vou atrasar desta vez, prometo.", "Desta vez não vou me atrasar, prometo."], grammar: [g.clitics-verb-phrases], vocab: [w.atrasar-se] }
      - { es: "Quero te apresentar a minha família alagoana.", en: "I want to introduce you to my family from Alagoas.", altEs: ["Quero apresentar-te a minha família alagoana.", "Quero te apresentar minha família alagoana."], grammar: [g.clitics-verb-phrases], vocab: [w.apresentar, w.alagoano] }
      - { es: "Precisamos resolvê-lo ainda hoje.", en: "We need to sort it out today.", altEs: ["Precisamos resolver isso ainda hoje.", "A gente precisa resolver isso hoje."], grammar: [g.clitics-verb-phrases, g.direct-object-pronouns], vocab: [w.resolver] }
      - { es: "Vou convidá-los para provar o sururu da minha avó.", en: "I'll invite them to try my grandmother's sururu.", altEs: ["Vou convidar eles para provar o sururu da minha avó."], grammar: [g.clitics-verb-phrases, g.direct-object-pronouns], vocab: [w.sururu, w.provar], transform: { instruction: "Change them to her (a)", answer: "Vou convidá-la para provar o sururu da minha avó.", alt: ["Vou convidar ela para provar o sururu da minha avó."] } }
      - { es: "Ele não tinha nos contado que ia se casar.", en: "He hadn't told us he was going to get married.", altEs: ["Ele não nos tinha contado que ia se casar."], grammar: [g.clitics-verb-phrases, g.pluperfect], vocab: [] }
      - { es: "Estamos nos preparando para a travessia de jangada.", en: "We're getting ready for the jangada crossing.", altEs: ["Estamos preparando-nos para a travessia de jangada."], grammar: [g.clitics-verb-phrases, g.reflexive-verbs-present], vocab: [w.travessia, w.jangada] }
      - { es: "Pode me passar o protetor? Quero passá-lo antes de entrar na água.", en: "Can you pass me the sunscreen? I want to put it on before I go into the water.", altEs: ["Pode me passar o protetor? Quero passar antes de entrar na água."], grammar: [g.clitics-verb-phrases, g.null-object], vocab: [w.protetor-solar] }
      - { es: "Comprar o ingresso? Vou comprá-lo amanhã de manhã.", en: "Buy the ticket? I'll buy it tomorrow morning.", altEs: ["Comprar o ingresso? Vou comprar amanhã de manhã."], grammar: [g.clitics-verb-phrases], vocab: [], transform: { instruction: "Use the Brazilian spoken style (no pronoun)", answer: "Comprar o ingresso? Vou comprar amanhã de manhã." } }
      - { es: "Em “vou te ligar”, o pronome fica entre os dois verbos, sem hífen.", en: "In 'vou te ligar', the pronoun sits between the two verbs, with no hyphen.", grammar: [g.clitics-verb-phrases], vocab: [w.pronome, w.hífen, w.verbo] }
      - { es: "Na aula de hoje, revisamos conjugação, tempo verbal e concordância.", en: "In today's class, we went over conjugation, tense and agreement.", grammar: [g.preterite-regular], vocab: [w.conjugação, w.tempo-verbal, w.concordância] }
      - { es: "“Rapidamente” é um advérbio; “rápido” pode ser adjetivo ou advérbio.", en: "'Rapidamente' is an adverb; 'rápido' can be an adjective or an adverb.", grammar: [g.frequency-adverbs], vocab: [w.advérbio, w.adjetivo] }
      - { es: "“Mas” é uma conjunção, “de” é uma preposição, “o” é um artigo e “mar” é um substantivo.", en: "'Mas' is a conjunction, 'de' is a preposition, 'o' is an article and 'mar' is a noun.", grammar: [g.connectors-basic], vocab: [w.conjunção, w.preposição, w.artigo, w.substantivo] }
      - { es: "Erros de regência e de acentuação são comuns até entre falantes nativos.", en: "Mistakes with verb–preposition patterns and accents are common even among native speakers.", grammar: [g.accents], vocab: [w.regência, w.acentuação, w.falante, w.nativo] }
    exchanges:
      - q: { es: "Você me liga quando chegar?", en: "Will you call me when you get there?" }
        a: { es: "Ligo, sim. Vou te mandar mensagem também.", en: "I will. I'll send you a message too." }
        alt: ["Ligo, sim.", "Vou te ligar, pode deixar."]
        grammar: [g.clitics-verb-phrases, g.null-object]
        vocab: []
      - q: { es: "Quem vai buscar os sobrinhos na escola?", en: "Who's going to pick the nephews up from school?" }
        a: { es: "Eu vou buscá-los às cinco.", en: "I'll pick them up at five." }
        alt: ["Eu vou buscar eles às cinco.", "Eu busco às cinco."]
        grammar: [g.clitics-verb-phrases, g.direct-object-pronouns]
        vocab: []
      - q: { es: "Ele já tinha te contado a novidade?", en: "Had he already told you the news?" }
        a: { es: "Não, ele não tinha me falado nada.", en: "No, he hadn't said anything to me." }
        alt: ["Não, não tinha.", "Já tinha me contado, sim."]
        grammar: [g.clitics-verb-phrases, g.pluperfect]
        vocab: []
      - q: { es: "Como se diz “vou deitar-me” no Brasil?", en: "How do you say 'vou deitar-me' in Brazil?" }
        a: { es: "“Vou me deitar.” A forma com hífen é de Portugal.", en: "'Vou me deitar.' The hyphenated form is from Portugal." }
        alt: ["Vou me deitar.", "Vou dormir."]
        grammar: [g.clitics-verb-phrases, g.lusophone-varieties]
        vocab: []
    texts:
      - title: "Mensagem de boas-vindas"
        es: ["Oi, Ana! Amanhã vou te buscar no aeroporto às dez.", "Depois quero te levar para conhecer as piscinas naturais.", "Já estou te esperando com água de coco!"]
        en: ["Hi, Ana! Tomorrow I'll pick you up at the airport at ten.", "Afterwards I want to take you to see the natural pools.", "I'm already waiting for you with coconut water!"]
        grammar: [g.clitics-verb-phrases]
        vocab: [w.piscina-natural, w.água-de-coco]
    spicy:
      - { es: "Vou te levar para ver a lua cheia na Pajuçara.", en: "I'll take you to see the full moon at Pajuçara.", altEs: ["Vou levar-te para ver a lua cheia na Pajuçara.", "Vou levar você para ver a lua cheia na Pajuçara."], grammar: [g.clitics-verb-phrases], vocab: [] }
      - { es: "Estou te esperando há meia hora, mas por você eu espero mais.", en: "I've been waiting for you for half an hour, but for you I'll wait longer.", altEs: ["Estou esperando você há meia hora, mas por você eu espero mais."], grammar: [g.clitics-verb-phrases, g.ha-faz-time], vocab: [] }
      - { es: "Quero te ver de novo antes de voltar para casa.", en: "I want to see you again before I go home.", altEs: ["Quero ver-te de novo antes de voltar para casa.", "Quero ver você de novo antes de voltar pra casa."], grammar: [g.clitics-verb-phrases], vocab: [] }
      - { es: "Você tinha me prometido uma dança, e eu não esqueço promessas.", en: "You had promised me a dance, and I don't forget promises.", grammar: [g.clitics-verb-phrases, g.pluperfect], vocab: [] }
      - { es: "Não vou te beijar agora… só depois da sobremesa.", en: "I'm not going to kiss you now… only after dessert.", altEs: ["Não te vou beijar agora… só depois da sobremesa."], grammar: [g.clitics-verb-phrases], vocab: [] }
  - id: b2.u11.l4
    title: "Comprei e levei"
    teach: [g.null-object, g.emphatic-structures]
    vocab: [w.puxa, w.droga, w.pois-não, w.sequer, w.nem-mesmo, w.pelo-contrário, w.de-jeito-nenhum, w.de-forma-alguma, w.nem-pensar, w.pô, w.poxa, w.caramba, w.uau, w.ufa, w.ué]
    tip: "In Brazilian speech, a clear third-person object is simply left out: Você viu o filme? — Vi. Comprei um bolo e levei para a festa. In formal writing, use the clitic (vi-o, levei-o)."
    sentences:
      - { es: "Você trouxe o carregador? — Trouxe, está na mochila.", en: "Did you bring the charger? — Yes, it's in the rucksack.", altEs: ["Você trouxe o carregador? — Trouxe, sim, está na mochila."], grammar: [g.null-object], vocab: [w.carregador, w.mochila] }
      - { es: "Gostou da tapioca? — Adorei!", en: "Did you like the tapioca? — I loved it!", altEs: ["Você gostou da tapioca? — Adorei!"], grammar: [g.null-object], vocab: [w.tapioca] }
      - { es: "Achei os seus óculos e coloquei na gaveta.", en: "I found your glasses and put them in the drawer.", altEs: ["Achei seus óculos e coloquei na gaveta.", "Encontrei os seus óculos e coloquei na gaveta."], grammar: [g.null-object], vocab: [w.óculos, w.gaveta], transform: { instruction: "Rewrite for formal writing with the clitic", answer: "Achei os seus óculos e coloquei-os na gaveta.", alt: ["Encontrei os seus óculos e coloquei-os na gaveta.", "Achei os seus óculos e os coloquei na gaveta."] } }
      - { es: "Esse vestido é lindo; vou comprar.", en: "This dress is beautiful; I'm going to buy it.", altEs: ["Esse vestido é lindo, vou comprar."], grammar: [g.null-object], vocab: [w.vestido], error: { wrong: "Esse vestido é lindo; vou comprar ele.", explain: "Adding ele for 'it' is very colloquial; leaving the object out (vou comprar) sounds more natural, and vou comprá-lo is the formal choice.", grammar: g.null-object } }
      - { es: "Perdi o chapéu; acho que deixei na jangada.", en: "I've lost my hat; I think I left it on the jangada.", altEs: ["Perdi o meu chapéu; acho que deixei na jangada."], grammar: [g.null-object], vocab: [w.chapéu, w.jangada], transform: { instruction: "Rewrite for formal writing with the pronoun o (mind the attractor que)", answer: "Perdi o chapéu; acho que o deixei na jangada." } }
      - { es: "Fiz um suco de caju, quer?", en: "I've made some cashew juice, do you want some?", altEs: ["Fiz suco de caju, quer?"], grammar: [g.null-object], vocab: [w.caju] }
      - { es: "Você pagou a conta? — Paguei, pode ficar tranquilo.", en: "Did you pay the bill? — Yes, don't worry.", altEs: ["Você pagou a conta? — Paguei, pode ficar tranquila."], grammar: [g.null-object], vocab: [] }
      - { es: "Leu o livro que te emprestei? — Li e gostei muito.", en: "Did you read the book I lent you? — Yes, and I really liked it.", altEs: ["Você leu o livro que eu te emprestei? — Li e gostei muito."], grammar: [g.null-object, g.clitic-placement-norm], vocab: [] }
      - { es: "Ele nem sequer olhou o cardápio e já pediu o sururu.", en: "He didn't even look at the menu and ordered the sururu straight away.", altEs: ["Ele nem mesmo olhou o cardápio e já pediu o sururu."], grammar: [g.negation], vocab: [w.sequer, w.nem-mesmo, w.cardápio, w.sururu] }
      - { es: "Não estou cansado; pelo contrário, quero ir à Praia do Gunga hoje mesmo.", en: "I'm not tired; on the contrary, I want to go to Gunga beach today.", altEs: ["Não estou cansada; pelo contrário, quero ir à Praia do Gunga hoje mesmo."], grammar: [g.argumentation-connectors], vocab: [w.pelo-contrário] }
      - { es: "Mergulhar sem guia? De jeito nenhum!", en: "Dive without a guide? No way!", altEs: ["Mergulhar sem guia? Nem pensar!"], grammar: [g.negation], vocab: [w.de-jeito-nenhum, w.mergulhar] }
      - { es: "O hotel não se responsabiliza, de forma alguma, por objetos esquecidos na praia.", en: "The hotel is in no way responsible for items left on the beach.", grammar: [g.register-formal-informal], vocab: [w.de-forma-alguma, w.objeto] }
      - { es: "Pois não, senhora, em que posso ajudar?", en: "Yes, madam, how can I help?", altEs: ["Pois não, senhora? Em que posso ajudá-la?"], grammar: [g.voce-o-senhor], vocab: [w.pois-não], note: "In shops, Pois não? means 'Can I help you?' — despite the não, it is a yes." }
      - { es: "Ufa, achei a carteira! Estava no carro.", en: "Phew, I found my wallet! It was in the car.", grammar: [g.preterite-vs-imperfect], vocab: [w.ufa, w.carteira] }
      - { es: "Ué, cadê o bolo? Eu deixei aqui agorinha.", en: "Huh, where's the cake? I left it here just now.", grammar: [g.null-object], vocab: [w.ué, w.agorinha] }
      - { es: "Puxa, você vai embora amanhã? Caramba, passou rápido!", en: "Gosh, you're leaving tomorrow? Wow, that went fast!", altEs: ["Poxa, você vai embora amanhã? Caramba, passou rápido!"], grammar: [g.ir-infinitive], vocab: [w.puxa, w.caramba] }
    exchanges:
      - q: { es: "Você viu o meu celular?", en: "Have you seen my phone?" }
        a: { es: "Vi, está em cima da mesa.", en: "Yes, it's on the table." }
        alt: ["Vi, sim.", "Não vi, não."]
        grammar: [g.null-object]
        vocab: []
      - q: { es: "Você comprou o protetor solar?", en: "Did you buy the sunscreen?" }
        a: { es: "Comprei e já coloquei na bolsa.", en: "I did, and I've already put it in the bag." }
        alt: ["Comprei.", "Esqueci, desculpa."]
        grammar: [g.null-object]
        vocab: [w.protetor-solar]
      - q: { es: "Uau, que bolo lindo! Foi você que fez?", en: "Wow, what a beautiful cake! Did you make it?" }
        a: { es: "Fui eu, sim. Fiz ontem à noite.", en: "I did, yes. I made it last night." }
        alt: ["Fui eu.", "Fiz, sim."]
        grammar: [g.null-object, g.emphatic-structures]
        vocab: [w.uau]
      - q: { es: "Você empresta o carro para ele?", en: "Will you lend him the car?" }
        a: { es: "Nem pensar! Pô, da última vez ele bateu.", en: "No way! Come on, last time he crashed it." }
        alt: ["De jeito nenhum!", "Nem pensar."]
        grammar: [g.null-object]
        vocab: [w.nem-pensar, w.pô]
      - q: { es: "Droga, esqueci a carteira no hotel!", en: "Damn, I left my wallet at the hotel!" }
        a: { es: "Poxa, de novo? Deixa que eu pago.", en: "Oh no, again? Let me pay." }
        alt: ["Deixa que eu pago.", "Poxa! Eu pago, relaxa."]
        grammar: [g.imperative-informal]
        vocab: [w.droga, w.poxa]
      - q: { es: "Você gostou da moqueca?", en: "Did you like the moqueca?" }
        a: { es: "Adorei! Quero pedir de novo amanhã.", en: "I loved it! I want to order it again tomorrow." }
        alt: ["Adorei!", "Gostei muito."]
        grammar: [g.null-object]
        vocab: [w.moqueca]
    texts:
      - title: "Bilhete na geladeira"
        es: ["Fiz um bolo de macaxeira e deixei no forno.", "Se quiser, pode comer, mas guarda um pedaço para a vovó!", "Ah, o seu carregador, achei e coloquei na sua mochila."]
        en: ["I made a cassava cake and left it in the oven.", "If you want, you can eat it, but save a piece for Grandma!", "Oh, and your charger: I found it and put it in your rucksack."]
        grammar: [g.null-object, g.future-subjunctive-se]
        vocab: [w.macaxeira, w.carregador]
    spicy:
      - { es: "Você roubou o meu coração? — Roubei, e não devolvo.", en: "Did you steal my heart? — I did, and I'm not giving it back.", grammar: [g.null-object], vocab: [] }
      - { es: "Gostou do beijo? — Gostei. Repete?", en: "Did you like the kiss? — I did. Again?", grammar: [g.null-object], vocab: [] }
      - { es: "Comprei uma flor para você, mas deixei no carro de nervoso.", en: "I bought you a flower, but I left it in the car out of nerves.", grammar: [g.null-object], vocab: [] }
      - { es: "Ir embora agora? De jeito nenhum, a música mal começou.", en: "Leave now? No way, the music has barely started.", grammar: [g.null-object], vocab: [w.de-jeito-nenhum] }
      - { es: "Não estou com ciúme; pelo contrário, acho ótimo que todo mundo olhe para você… de longe.", en: "I'm not jealous; on the contrary, I think it's great that everyone looks at you… from a distance.", grammar: [g.subjunctive-emotion], vocab: [w.pelo-contrário] }
dialogues:
  - id: b2.u11.d1
    title: "Na jangada para as piscinas naturais"
    context: "At Pajuçara beach in Maceió, Bia and Davi board a jangada to the natural pools. The jangada man, Seu Cícero, keeps an eye on the tide."
    lines:
      - { speaker: "Seu Cícero", es: "Bom dia! Foi a senhora que reservou para dois?", en: "Good morning! Was it you who booked for two?" }
      - { speaker: "Bia", es: "Fui eu, sim! Ufa, achei que a gente tinha perdido a maré.", en: "Yes, it was me! Phew, I thought we'd missed the tide." }
      - { speaker: "Seu Cícero", es: "Perdeu não. A maré baixa é às dez; é que eu gosto de sair cedo.", en: "No, you didn't. Low tide is at ten; it's just that I like to leave early." }
      - { speaker: "Davi", es: "Bia, você trouxe o protetor solar?", en: "Bia, did you bring the sunscreen?" }
      - { speaker: "Bia", es: "Trouxe. Coloquei na sua mochila ontem à noite.", en: "I did. I put it in your rucksack last night." }
      - { speaker: "Davi", es: "Ué, não vi. Deixa eu procurar… Achei!", en: "Huh, I didn't see it. Let me look… Found it!" }
      - { speaker: "Seu Cícero", es: "Disseram-me que vocês são de São Paulo. Gostaram de Maceió?", en: "I was told you're from São Paulo. Have you enjoyed Maceió?" }
      - { speaker: "Davi", es: "Adoramos! O que mais me impressionou foi a cor do mar.", en: "We loved it! What impressed me most was the colour of the sea." }
      - { speaker: "Seu Cícero", es: "Pois é. Vou mostrar-lhes um lugar onde os peixes comem na mão da gente.", en: "That's right. I'll show you a place where the fish eat out of your hand." }
      - { speaker: "Bia", es: "Sério? Eu quero é ver isso de perto!", en: "Really? What I want is to see that up close!" }
    questions:
      - { q: "Quem fez a reserva da jangada?", options: ["O Davi", "A Bia", "O Seu Cícero"], answer: 1, explain: "Fui eu, sim!: Bia made the booking." }
      - { q: "Por que o Seu Cícero sai cedo?", options: ["Porque a maré baixa é às sete", "Porque ele gosta de sair cedo", "Porque vai chover"], answer: 1, explain: "É que eu gosto de sair cedo; low tide is at ten." }
      - { q: "Onde estava o protetor solar?", options: ["Na mochila do Davi", "No hotel", "Na jangada"], answer: 0, explain: "Coloquei na sua mochila: Bia had put it in Davi's rucksack." }
      - { q: "O que mais impressionou o Davi?", options: ["A comida", "A cor do mar", "As jangadas"], answer: 1, explain: "O que mais me impressionou foi a cor do mar." }
writing:
  - task: "Your friend has the story of your trip to Maceió wrong. Correct him using emphatic structures (Foi a Bia que…, Quem esqueceu fui eu, O que eu fiz foi…)."
    es: "Então foi você que reservou o passeio às piscinas naturais e o Pedro que esqueceu as passagens, né?"
    min: 80
    max: 140
    use: [w.piscina-natural, w.na-verdade, w.de-fato, w.pois-é, w.sem-dúvida]
    useAtLeast: 3
    grammar: [g.emphatic-structures]
    expect:
      - { pattern: '((?<!\p{L})(foi|fui|foram|é|era) [a-zà-ú ]{1,25} que(?!\p{L})|\bquem [a-zà-ú]+ [a-zà-ú ]{0,20}(fui|foi|foram)(?!\p{L})|\bo que (eu |a gente )?[a-zà-ú]+ (foi|é)(?!\p{L}))', hint: "Use emphatic structures: Foi a Bia que reservou… / Quem esqueceu fui eu." }
      - { pattern: '\b(na verdade|de fato|na real|pois [eé]|sem d[uú]vida)', hint: "Add an emphatic marker: na verdade, de fato, pois é…" }
    model: { es: "Nada disso! Na verdade, foi a Bia que reservou o passeio às piscinas naturais, não eu. E quem esqueceu as passagens não foi o Pedro: fui eu, infelizmente. O que eu fiz foi encontrar um barco mais barato na praia. Pois é, o passeio foi maravilhoso mesmo assim. O que eu mais adorei foram os peixes coloridos. E quem pagou o almoço? Foi a Bia, de novo! Ela é que é generosa. Sem dúvida, é Maceió que eu quero visitar de novo!", en: "Not at all! Actually, it was Bia who booked the trip to the natural pools, not me. And the one who forgot the tickets wasn't Pedro: it was me, unfortunately. What I did was find a cheaper boat on the beach. Yes, well, the trip was wonderful anyway. What I loved most were the colourful fish. And who paid for lunch? Bia did, again! She's the generous one. Without a doubt, Maceió is the place I want to visit again!" }
  - task: "Write a formal email to a hotel in Maceió confirming a booking, placing the pronouns according to the written norm (escrevo-lhe…, agradeço-lhe…, não me foi enviado…)."
    min: 80
    max: 140
    use: [w.prezado, w.atenciosamente, w.confirmar, w.solicitar, w.comprovante]
    useAtLeast: 3
    grammar: [g.clitic-placement-norm]
    expect:
      - { pattern: '\b[a-zà-ú]+-(me|te|se|lhe|lhes|nos|o|a|os|as|lo|la|los|las)\b', hint: "Attach the pronoun to the verb in formal writing: escrevo-lhe…, agradeço-lhe…" }
      - { pattern: '\b(n[aã]o|j[aá]|que|quando|se) (me|lhe|lhes|nos|o|a)\b', hint: "After não, que or já, put the pronoun before the verb: …que me envie…" }
    model: { es: "Prezada Senhora, escrevo-lhe para confirmar a reserva de um quarto de casal entre os dias 12 e 16 de março. Agradeço-lhe a resposta rápida. Gostaria, porém, de informá-la de que ainda não me foi enviado o comprovante de pagamento. Peço-lhe, por gentileza, que me envie o documento por e-mail. Informo-lhe também que chegaremos por volta das dez da noite, pois o nosso voo sai de São Paulo às sete. Caso precisem de algum dado, peço que me escrevam. Coloco-me à disposição para qualquer dúvida. Atenciosamente, Daniel Clark. ", en: "Dear Madam, I am writing to confirm the booking of a double room from 12 to 16 March. Thank you for your quick reply. I would, however, like to inform you that the payment receipt has not yet been sent to me. I kindly ask you to send me the document by email. I would also like to let you know that we will arrive at around ten in the evening, as our flight leaves São Paulo at seven. Should you need any details, please write to me. I remain at your disposal for any questions. Yours sincerely, Daniel Clark. " }
  - task: "A friend is visiting you in Maceió. Write a message about what you're going to show them, with pronouns in verb phrases (Vou te mostrar…, Posso te buscar…, Quero te levar…)."
    min: 80
    max: 140
    use: [w.mergulhar, w.sururu, w.orla, w.jangada, w.buscar]
    useAtLeast: 3
    grammar: [g.clitics-verb-phrases]
    expect:
      - { pattern: '\b(vou|vamos|quero|posso|podemos|preciso|vai|pode)( te| lhe| me| nos) [a-zà-ú]+(ar|er|ir|r)\b', hint: "Place the pronoun in the verb phrase: Vou te mostrar…, Posso te buscar…" }
    model: { es: "Oi, Rafa! Que bom que você vem a Maceió! Posso te buscar no aeroporto na sexta à noite. No sábado, quero te levar para conhecer as piscinas naturais da Pajuçara: a gente vai de jangada e pode mergulhar com os peixes. Depois, vou te mostrar a orla de bicicleta. No domingo, preciso te apresentar o sururu, um prato típico daqui, que você vai adorar. Me avisa o horário do voo para eu me organizar, tá? Se der tempo, também posso te levar a uma praia mais tranquila, longe da cidade.", en: "Hi, Rafa! Great that you're coming to Maceió! I can pick you up at the airport on Friday night. On Saturday I want to take you to see the natural pools at Pajuçara: we'll go by jangada and we can dive with the fish. Then I'll show you the seafront by bike. On Sunday I have to introduce you to sururu, a typical dish from here, which you'll love. Let me know your flight time so I can get organised, OK? If there's time, I can also take you to a quieter beach, away from the city." }
  - task: "Write a casual message about shopping for a party, leaving out objects the way Brazilians do in speech (— O bolo? — Comprei e já busquei. / Vi, mas não comprei.)."
    min: 80
    max: 140
    use: [w.poxa, w.caramba, w.ufa, w.nem-pensar, w.pois-é]
    useAtLeast: 3
    grammar: [g.null-object, g.emphatic-structures]
    expect:
      - { pattern: '\b(comprei|levei|trouxe|vi|achei|peguei|guardei|coloquei|deixei|esqueci|busquei)[.!,:]', hint: "Leave out the object naturally: — O gelo? — Esqueci! / Vi, mas não comprei." }
      - { pattern: '(ufa|poxa|caramba|nem pensar|pois [eé]|nossa)', hint: "Add a spoken interjection: ufa, poxa, caramba, nem pensar…" }
    model: { es: "Ufa, terminei as compras para a festa! O bolo? Pedi ontem na padaria e já busquei. As bebidas eu comprei no mercado e coloquei na geladeira. E os copos? Poxa, esqueci! Vou voltar lá agora. Ah, você pediu as velas: vi, mas não comprei, porque eram caras demais. Pagar vinte reais por umas velas? Nem pensar! Pois é, caramba, já são seis horas. A gente se vê às oito! E a música? Essa a Júlia trouxe ontem. Ela é que sabe escolher!", en: "Phew, I've finished the shopping for the party! The cake? I ordered it yesterday at the bakery and I've already picked it up. The drinks I bought at the supermarket and put in the fridge. And the cups? Oh no, I forgot them! I'll go back now. Oh, you asked for candles: I saw them, but I didn't buy them, because they were far too expensive. Twenty reais for a few candles? No way! Yeah, wow, it's already six o'clock. See you at eight! And the music? Júlia brought that yesterday. She's the one who knows how to choose!" }
