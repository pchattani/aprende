id: r.b2.l-italiano-del-sud
level: b2
title: L'italiano del Sud
kind: dialogue
intro: "Chiara, a student from Milan doing a master's in Bari, walks through Bari Vecchia with her friend Nicola and asks him about the Italian she hears around her. A conversation about regional Italian versus dialect: tenere for avere, stare for essere, transitive scendere and uscire, and the passato remoto in everyday speech."
allow: [chiara, nicola, bari, barese, baresi, milano, milanese, milanesi, myra, puglia, pugliese, sgagliozze, panzerotti, panzerotto, sciamanin, nicolò, ok]
paragraphs:
  - { es: "Chiara: Nicola, ti posso fare una domanda da milanese? Stamattina al bar il barista mi ha chiesto: «Che tieni, signorina?» Io ho pensato che volesse sapere cosa avevo in borsa!", en: "Chiara: Nicola, can I ask you a Milanese question? This morning at the bar the barman asked me: 'Che tieni, signorina?' I thought he wanted to know what I had in my bag!" }
  - { es: "Nicola: (ridendo) No, no! Ti stava chiedendo che cosa volevi, o che cosa avevi. Qui al Sud usiamo «tenere» al posto di «avere» in tantissime frasi: «tengo fame», «tengo due fratelli», «tengo trent'anni». Non è dialetto, eh: è italiano, ma italiano regionale.", en: "Nicola: (laughing) No, no! He was asking what you wanted, or what was the matter. Here in the South we use tenere instead of avere in loads of phrases: 'tengo fame', 'tengo due fratelli', 'tengo trent'anni'. It's not dialect, mind: it's Italian, but regional Italian." }
  - { es: "Chiara: Qual è la differenza? Per me è tutto un po' dialetto.", en: "Chiara: What's the difference? To me it's all a bit like dialect." }
  - { es: "Nicola: È una differenza importante. Il dialetto barese è quasi un'altra lingua: se mia nonna ti dicesse «Sciamanin'», non capiresti niente. Vuol dire «andiamo». L'italiano regionale, invece, è l'italiano che parliamo tutti, ma con la pronuncia, le parole e alcune costruzioni tipiche della zona. Anche voi a Milano ce l'avete, solo che non ve ne accorgete.", en: "Nicola: It's an important difference. Bari dialect is almost another language: if my grandmother said 'Sciamanin'' to you, you wouldn't understand a thing. It means 'let's go'. Regional Italian, on the other hand, is the Italian we all speak, but with the pronunciation, words and some constructions typical of the area. You have it in Milan too, you just don't notice." }
  - { es: "Chiara: Noi? Ma figurati, noi parliamo un italiano normalissimo.", en: "Chiara: Us? Come off it, we speak perfectly normal Italian." }
  - { es: "Nicola: Ah sì? E chi è che dice «la Chiara», «il Marco», con l'articolo davanti ai nomi? Ognuno ha il suo italiano, cara mia. Comunque, da noi c'è anche «stare» al posto di «essere»: «sto a casa», «mio padre sta in ufficio», e soprattutto «ci sta» per dire «c'è». «Ci sta un bar qua vicino?»", en: "Nicola: Oh really? And who is it that says 'la Chiara', 'il Marco', with the article in front of names? Everyone has their own Italian, my dear. Anyway, we also use stare instead of essere: 'sto a casa', 'mio padre sta in ufficio', and above all 'ci sta' to mean 'c'è'. 'Ci sta un bar qua vicino?'" }
  - { es: "Chiara: Questa l'avevo sentita! E ieri la mia coinquilina mi ha detto: «Scendi tu il cane, che io devo uscire la macchina.» Ho pensato che il cane fosse sul tetto.", en: "Chiara: I'd heard that one! And yesterday my flatmate said to me: 'Scendi tu il cane, che io devo uscire la macchina.' I thought the dog was on the roof." }
  - { es: "Nicola: Classico! Al Sud «scendere», «salire», «uscire» si usano anche con un oggetto: scendere il cane vuol dire portarlo giù, uscire la macchina vuol dire tirarla fuori dal garage. In un tema a scuola la professoressa te lo segnerebbe in rosso, ma a casa lo diciamo tutti.", en: "Nicola: Classic! In the South scendere, salire and uscire are also used with an object: scendere il cane means taking it down, uscire la macchina means getting it out of the garage. In an essay at school the teacher would mark it in red, but at home we all say it." }
  - { es: "Chiara: E il passato remoto? Il tuo amico ieri ha detto: «Stamattina andai al mare.» Io il passato remoto l'ho sempre e solo letto nei libri di storia.", en: "Chiara: And the passato remoto? Your friend said yesterday: 'Stamattina andai al mare.' I've only ever read the passato remoto in history books." }
  - { es: "Nicola: Eh, quello è un altro segno del Sud. Da noi il passato remoto è vivo, lo usiamo anche per cose successe poche ore fa. Al Nord, invece, l'avete quasi eliminato dal parlato: dite «sono andato» anche per una cosa di cent'anni fa.", en: "Nicola: Well, that's another sign of the South. With us the passato remoto is alive, we use it even for things that happened a few hours ago. In the North, on the other hand, you've almost wiped it out of speech: you say 'sono andato' even for something a hundred years ago." }
  - { es: "Chiara: Va bene, mi arrendo. Ma dimmi una cosa: dove stiamo andando? Mi hai fatto camminare mezz'ora per questi vicoli.", en: "Chiara: OK, I give up. But tell me something: where are we going? You've had me walking through these alleys for half an hour." }
  - { es: "Nicola: Ci siamo quasi. Questa è la strada delle orecchiette: guarda le signore sedute davanti alle porte, le fanno a mano, una per una, con il coltello. E lì in fondo c'è la Basilica di San Nicola. Le sue ossa furono portate qui da Myra, in Turchia, da alcuni marinai baresi nel 1087. Vedi? Passato remoto anche questo, ma qui ci sta bene.", en: "Nicola: We're nearly there. This is the street of the orecchiette: look at the ladies sitting in front of their doors, they make them by hand, one by one, with a knife. And down there is the Basilica of San Nicola. His bones were brought here from Myra, in Turkey, by some Bari sailors in 1087. See? Passato remoto again, but here it fits." }
  - { es: "Chiara: E dopo?", en: "Chiara: And afterwards?" }
  - { es: "Nicola: Dopo ti porto a mangiare un panzerotto sul lungomare. Così, quando torni a Milano, potrai dire: «A Bari mangiai benissimo.»", en: "Nicola: Afterwards I'm taking you to eat a panzerotto on the seafront. That way, when you go back to Milan, you'll be able to say: 'A Bari mangiai benissimo.'" }
questions:
  - { q: "Che cosa significava «Che tieni?» detto dal barista?", options: ["Che cosa hai in borsa?", "Che cosa vuoi / che cos'hai?", "Dove abiti?"], answer: 1, explain: "In southern regional Italian tenere often replaces avere." }
  - { q: "Qual è la differenza tra dialetto e italiano regionale, secondo Nicola?", options: ["Non c'è nessuna differenza", "Il dialetto è quasi un'altra lingua; l'italiano regionale è italiano con caratteristiche locali", "L'italiano regionale si parla solo al Nord"], answer: 1, explain: "Bari dialect («Sciamanin'») is unintelligible to Chiara; regional Italian is Italian with local pronunciation, words and constructions." }
  - { q: "Quale caratteristica dell'italiano del Nord cita Nicola?", options: ["L'articolo davanti ai nomi di persona", "L'uso di «tenere»", "Il passato remoto"], answer: 0, explain: "«La Chiara», «il Marco»: the article before first names is typical of northern Italy." }
  - { q: "Che cosa vuol dire «uscire la macchina»?", options: ["Uscire in macchina", "Tirare fuori la macchina dal garage", "Vendere la macchina"], answer: 1, explain: "In the South, uscire, scendere and salire can take a direct object." }
  - { q: "Perché le ossa di San Nicola sono a Bari?", options: ["Perché San Nicola era nato a Bari", "Perché alcuni marinai baresi le portarono da Myra nel 1087", "Perché il papa le mandò da Roma"], answer: 1, explain: "Sailors from Bari brought the saint's relics from Myra (in today's Turkey) in 1087." }
glossary:
  - { es: differenza, en: difference }
  - { es: vuol, en: (vuol dire) means }
  - { es: tantissime, en: very many }
  - { es: giù, en: down }
  - { es: tirarla, en: (tirarla fuori) get it out }
  - { es: normalissimo, en: perfectly normal }
  - { es: tema, en: essay (at school) }
  - { es: eliminato, en: eliminated }
