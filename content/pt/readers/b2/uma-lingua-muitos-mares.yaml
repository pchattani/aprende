id: r.b2.uma-lingua-muitos-mares
level: b2
title: Uma língua, muitos mares
kind: text
intro: On a diving boat in Fernando de Noronha, a Brazilian instructor finds herself with divers from Portugal, Angola, Mozambique and Cape Verde. One language, many ways of speaking it.
allow: [noronha, fernando, pernambuco, sancho, portugal, angola, angolano, angolana, moçambique, moçambicano, moçambicana, cabo, verde, cabo-verdiano, cabo-verdiana, timor, luanda, maputo, mindelo, porto, lisboa, ok, bué, fixe, machimbombo, autocarro, morabeza, kriolu, cplp, tamar, marta]
paragraphs:
  - { es: "Trabalho como instrutora de mergulho em Fernando de Noronha há oito anos e achava que já tinha visto de tudo: tartarugas, tubarões, golfinhos saltando ao lado do barco. Mas, numa manhã de outubro, aconteceu uma coisa que eu nunca tinha visto. Os seis mergulhadores do meu grupo falavam português, e nenhum deles era brasileiro.", en: "I've been working as a diving instructor in Fernando de Noronha for eight years and I thought I'd seen it all: turtles, sharks, dolphins leaping beside the boat. But one October morning something happened that I'd never seen. The six divers in my group spoke Portuguese, and none of them was Brazilian." }
  - { es: "Havia um casal do Porto, uma médica de Luanda, um engenheiro de Maputo e duas irmãs do Mindelo, em Cabo Verde. Tinham se conhecido num congresso no Recife e decidido passar uns dias juntos na ilha. Assim que o barco saiu do porto, começou uma conversa que eu não esqueci até hoje.", en: "There was a couple from Porto, a doctor from Luanda, an engineer from Maputo and two sisters from Mindelo, in Cape Verde. They had met at a conference in Recife and decided to spend a few days together on the island. As soon as the boat left the harbour, a conversation began that I haven't forgotten to this day." }
  - { es: "— Isto é bué de fixe! — disse a médica angolana, olhando para o mar, que estava de um azul quase impossível. Eu entendi o «fixe», que os portugueses também usam e que quer dizer «legal», mas confesso que precisei de ajuda com o «bué». Ela riu e explicou que, em Angola, «bué» significa «muito», e que os jovens de Lisboa também passaram a usá-lo.", en: "'This is really cool!' said the Angolan doctor, looking at the sea, which was an almost impossible blue. I understood fixe, which the Portuguese also use and which means 'cool', but I confess I needed help with bué. She laughed and explained that in Angola bué means 'a lot', and that young people in Lisbon have started using it too." }
  - { es: "O engenheiro moçambicano contou que, em Maputo, o ônibus se chama «machimbombo», enquanto em Portugal é «autocarro». O português do Porto disse que, para ele, o mais difícil no Brasil era a falta do «tu»: — Vocês tratam toda a gente por «você», e eu fico sempre na dúvida se estou a ser mal-educado. — Eu expliquei que, no Brasil, é o contrário: «você» é a forma normal, e o «tu», onde existe, é regional. E ele respondeu que, em Portugal, dizer «você» a um desconhecido podia até soar frio.", en: "The Mozambican engineer said that in Maputo the bus is called machimbombo, while in Portugal it's autocarro. The man from Porto said that, for him, the hardest thing in Brazil was the absence of tu: 'You call everyone você, and I'm always unsure whether I'm being rude.' I explained that in Brazil it's the opposite: você is the normal form, and tu, where it exists, is regional. And he replied that in Portugal saying você to a stranger could even sound cold." }
  - { es: "As irmãs cabo-verdianas ouviam tudo, divertidas. Uma delas disse que, em casa, falava crioulo cabo-verdiano, uma língua de base portuguesa mas com gramática própria, e que o português era a língua da escola, dos documentos e da televisão. — Para nós, o português é uma janela para o mundo — disse ela —, mas o crioulo é a nossa casa.", en: "The Cape Verdean sisters listened to everything, amused. One of them said that at home she spoke Cape Verdean Creole, a Portuguese-based language with its own grammar, and that Portuguese was the language of school, documents and television. 'For us, Portuguese is a window onto the world,' she said, 'but Creole is our home.'" }
  - { es: "Quando chegamos ao ponto de mergulho, interrompi o debate para dar as instruções de segurança. Foi aí que percebi como cada um entendia as mesmas palavras de um jeito ligeiramente diferente. Eu disse «vamos ficar juntinhos», e o português perguntou se era para dar as mãos. Eu disse «a gente desce devagar», e a angolana perguntou quem era «a gente». No fim, todos se entenderam, com gestos, risos e muita paciência, que é o que uma língua compartilhada exige.", en: "When we reached the dive site, I interrupted the debate to give the safety instructions. That's when I realised how each of them understood the same words in a slightly different way. I said vamos ficar juntinhos, and the Portuguese man asked if we were meant to hold hands. I said a gente desce devagar, and the Angolan woman asked who a gente was. In the end everyone understood each other, with gestures, laughter and lots of patience, which is what a shared language demands." }
  - { es: "Debaixo d'água, claro, ninguém falou nada. Vimos tartarugas, um tubarão-lixa dormindo numa pedra e um cardume enorme de peixes prateados. Ao voltarmos ao barco, cada um descreveu o que tinha visto à sua maneira, e todos, curiosamente, usaram a mesma palavra: «lindo».", en: "Under water, of course, nobody said anything. We saw turtles, a nurse shark sleeping on a rock and an enormous school of silver fish. When we got back on the boat, each described what they'd seen in their own way, and all of them, curiously, used the same word: lindo." }
  - { es: "Hoje, quando alguém me pergunta quantas pessoas falam português, eu respondo com os números: mais de duzentos e cinquenta milhões, em nove países oficiais, em quatro continentes. Mas, no fundo, penso naquela manhã em Noronha. Uma língua não é uma só; é um mar com muitas correntes. E, como no mar, o mais bonito acontece onde as correntes se encontram.", en: "Today, when someone asks me how many people speak Portuguese, I answer with the figures: over two hundred and fifty million, in nine countries where it's official, on four continents. But deep down I think of that morning in Noronha. A language isn't just one thing; it's a sea with many currents. And, as in the sea, the most beautiful things happen where the currents meet." }
questions:
  - { q: "O que havia de especial no grupo de mergulhadores?", options: ["Todos falavam português, mas nenhum era brasileiro", "Todos eram médicos", "Era a primeira vez que mergulhavam"], answer: 0, explain: "«Os seis mergulhadores do meu grupo falavam português, e nenhum deles era brasileiro.»" }
  - { q: "O que significa «bué» em Angola?", options: ["Legal", "Muito", "Ônibus"], answer: 1, explain: "«Em Angola, \"bué\" significa \"muito\".» Fixe is the word for 'cool'." }
  - { q: "Como se diz «ônibus» em Moçambique, segundo o engenheiro?", options: ["Autocarro", "Machimbombo", "Bonde"], answer: 1, explain: "«Em Maputo, o ônibus se chama \"machimbombo\", enquanto em Portugal é \"autocarro\".»" }
  - { q: "Para as irmãs cabo-verdianas, qual é o papel do português?", options: ["É a língua de casa", "É a língua da escola e dos documentos, uma janela para o mundo", "É uma língua estrangeira que não usam"], answer: 1, explain: "Portuguese is the language of school and documents — «uma janela para o mundo» — while Creole is home." }
  - { q: "Que conclusão a instrutora tira daquela manhã?", options: ["Que o português de Portugal é o mais correto", "Que uma língua é como um mar com muitas correntes", "Que é impossível se entender"], answer: 1, explain: "«Uma língua não é uma só; é um mar com muitas correntes.»" }
glossary:
  - { es: mergulhadores, en: divers }
  - { es: saltando, en: jumping, leaping }
  - { es: estou a ser, en: I am being (European Portuguese estar a + infinitive) }
  - { es: toda a gente, en: everyone (European Portuguese for todo mundo) }
  - { es: ligeiramente, en: slightly }
  - { es: juntinhos, en: close together }
  - { es: gestos, en: gestures }
  - { es: tubarão-lixa, en: nurse shark }
  - { es: cardume, en: school (of fish) }
  - { es: prateados, en: silver }
  - { es: curiosamente, en: curiously }
  - { es: correntes, en: currents }
