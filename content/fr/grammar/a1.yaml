# A1 grammar notes (Paris). Explanations use light markdown: ### headings,
# bullets, tables, **bold**, *italic* (italic = French example inline).
- id: g.greetings
  level: a1
  title: "Greetings and goodbyes"
  summary: "Bonjour, bonsoir, salut, au revoir, à bientôt, bonne journée."
  explanation: |
    ### Saying hello
    - *Bonjour* is the all-purpose hello until early evening, with anyone. In France you say it to **everyone** when you walk into a shop, a café, a lift or a doctor's waiting room.
    - *Bonsoir* replaces *bonjour* from about 6 pm.
    - *Salut* is informal (friends, family, people your age): it means both "hi" and "bye".
    - *Coucou* is very familiar, for close friends and children.

    ### How are you?
    | informal | formal |
    |---|---|
    | *Ça va ?* — *Ça va bien, et toi ?* | *Comment allez-vous ?* — *Très bien, merci, et vous ?* |
    | *Comment tu vas ?* | *Vous allez bien ?* |

    ### Saying goodbye
    - *Au revoir* (goodbye), *à bientôt* (see you soon), *à plus tard* / *à plus* (later), *à demain* (see you tomorrow), *bonne journée* (have a nice day), *bonne soirée* (have a nice evening), *bonne nuit* (good night, going to bed).
    - Polite add-ons: *Bonjour, madame. Au revoir, monsieur.* Adding *madame / monsieur* is normal politeness, not stiff.
  examples:
    - { es: "Bonjour, madame !", en: "Hello! (to a woman)" }
    - { es: "Salut, ça va ?", en: "Hi, how's it going?" }
    - { es: "Très bien, merci. Et vous ?", en: "Very well, thank you. And you? (formal)" }
    - { es: "Au revoir, bonne journée !", en: "Goodbye, have a nice day!" }
  pitfalls:
    - "*Bonne nuit* is only for going to bed. To greet someone in the evening, say *bonsoir*."
    - "Walking into a small shop without saying *bonjour* is considered rude in France."
    - "*Salut* is too casual for a shopkeeper or an older stranger."
  variant: "In Québec *bonjour* is also used as a goodbye during the day, and *bonne journée* is very frequent. In Belgium and Switzerland *à tantôt* means 'see you later today'."
  related: [g.tu-vs-vous, g.s-appeler]
  drills:
    - { es: "Bonsoir, monsieur Martin.", en: "Good evening, Mr Martin." }
    - { es: "À demain, Julie !", en: "See you tomorrow, Julie!" }
    - { es: "Ça va bien, et toi ?", en: "I'm fine, and you?" }
- id: g.subject-pronouns
  level: a1
  title: "Subject pronouns: je, tu, il, elle, on, nous, vous, ils, elles"
  summary: "French verbs need a subject pronoun; je becomes j' before a vowel."
  explanation: |
    | Person | Singular | Plural |
    |---|---|---|
    | 1st | *je* (I) | *nous* (we) |
    | 2nd | *tu* (you, informal) | *vous* (you, plural or formal) |
    | 3rd | *il* (he, it), *elle* (she, it), *on* (one, we, people) | *ils* (they, m or mixed), *elles* (they, f) |

    ### Always say the pronoun
    Unlike Spanish or Italian, French does **not** drop the subject: many verb forms sound the same (*je parle, tu parles, il parle* are all pronounced [paʁl]), so the pronoun carries the meaning.

    ### Things to know
    - *Je* → *j'* before a vowel or silent h: *j'aime, j'habite*.
    - *Il / elle* also mean "it": *la table* → *elle*, *le livre* → *il*.
    - *Ils* for a group of men or a mixed group, *elles* only for all-female groups.
    - *Vous* is both plural "you" and polite singular "you".
    - *On* is very common in speech for "we" (see *on = nous*).
  examples:
    - { es: "Je suis Paul et elle, c'est Marie.", en: "I'm Paul and she's Marie." }
    - { es: "Vous êtes de Paris ?", en: "Are you from Paris?" }
    - { es: "Elles sont étudiantes.", en: "They (women) are students." }
    - { es: "J'habite à Lyon.", en: "I live in Lyon." }
  pitfalls:
    - "Never leave out the pronoun: *suis français* is wrong; say *je suis français*."
    - "*Je* is not capitalised in the middle of a sentence, unlike English 'I'."
    - "A group of nine women and one man is *ils*."
  related: [g.stressed-pronouns, g.tu-vs-vous, g.on-nous]
  drills:
    - { es: "Nous sommes amis.", en: "We are friends." }
    - { es: "Ils sont à Paris.", en: "They are in Paris." }
    - { es: "J'aime Paris.", en: "I love Paris." }
- id: g.etre-present
  level: a1
  title: "The verb être (to be)"
  summary: "je suis, tu es, il est, nous sommes, vous êtes, ils sont: irregular and essential."
  explanation: |
    | | être |
    |---|---|
    | je | **suis** |
    | tu | **es** |
    | il / elle / on | **est** |
    | nous | **sommes** |
    | vous | **êtes** |
    | ils / elles | **sont** |

    French has **one** verb "to be" (unlike Spanish *ser / estar*). Use it for:
    - **Identity and nationality**: *Je suis Anna. Il est canadien.*
    - **Profession** (no article!): *Elle est médecin.*
    - **Description and states**: *Nous sommes fatigués. C'est grand.*
    - **Location**: *Je suis à Paris. Le métro est là.*

    ### Pronunciation
    *Tu es* and *il est* sound the same [ɛ]. Liaison: *vous êtes* [vu.zɛt], *ils sont* has no liaison but *ils ont* (they have) does — don't confuse *ils sont* [ilsɔ̃] and *ils ont* [ilzɔ̃].
  examples:
    - { es: "Je suis étudiant.", en: "I'm a student." }
    - { es: "Tu es français ?", en: "Are you French?" }
    - { es: "Nous sommes à Paris.", en: "We are in Paris." }
    - { es: "Vous êtes très gentil.", en: "You are very kind." }
  pitfalls:
    - "No article with professions after *être*: *il est professeur*, not *il est un professeur*. (But *c'est un professeur*.)"
    - "Age uses *avoir*, not *être*: *j'ai vingt ans*."
    - "*Ils sont* (they are) vs *ils ont* (they have): listen for the z sound of the liaison."
  related: [g.c-est-il-est, g.avoir-present, g.subject-pronouns]
  drills:
    - { es: "Elle est à la maison.", en: "She is at home." }
    - { es: "Ils sont très sympas.", en: "They are very nice." }
    - { es: "Je suis anglaise.", en: "I'm English. (woman)" }
- id: g.s-appeler
  level: a1
  title: "Je m'appelle… — saying your name"
  summary: "s'appeler means 'to call oneself': je m'appelle, tu t'appelles, il s'appelle."
  explanation: |
    | | s'appeler |
    |---|---|
    | je | **m'appelle** |
    | tu | **t'appelles** |
    | il / elle | **s'appelle** |
    | nous | **nous appelons** |
    | vous | **vous appelez** |
    | ils / elles | **s'appellent** |

    - *Comment tu t'appelles ?* / *Tu t'appelles comment ?* — What's your name? (informal)
    - *Comment vous appelez-vous ?* / *Vous vous appelez comment ?* — What's your name? (formal)
    - *Il s'appelle Marc.* — His name is Marc.

    The small word (*me, te, se, nous, vous*) is a reflexive pronoun; you'll meet it again with routine verbs.

    ### Spelling
    Double **ll** when the ending is silent (*j'appelle, ils appellent*), single **l** with *nous* and *vous* (*appelons, appelez*).

    You can also say *Je suis Marc* or *Moi, c'est Marc* in casual speech.
  examples:
    - { es: "Bonjour, je m'appelle Léa.", en: "Hello, my name is Léa." }
    - { es: "Comment vous appelez-vous ?", en: "What's your name? (formal)" }
    - { es: "Mon chat s'appelle Minou.", en: "My cat is called Minou." }
  pitfalls:
    - "Not *je suis appelle*: say *je m'appelle*."
    - "*Mon nom est…* exists but sounds stiff; *mon nom* is often understood as 'my surname'."
    - "Spelling: *ils s'appellent* with ll, *nous nous appelons* with one l."
  related: [g.greetings, g.reflexive-intro, g.stem-changing-er]
  drills:
    - { es: "Tu t'appelles comment ?", en: "What's your name?" }
    - { es: "Elle s'appelle Camille.", en: "Her name is Camille." }
    - { es: "Nous nous appelons Paul et Anne.", en: "Our names are Paul and Anne." }
- id: g.tu-vs-vous
  level: a1
  title: "Tu or vous? Informal and formal 'you'"
  summary: "tu for one friend, family member, child or peer; vous for strangers, officials, older people, and for any group."
  explanation: |
    | | one person | several people |
    |---|---|---|
    | informal | **tu** | **vous** |
    | formal | **vous** | **vous** |

    ### When to use vous
    - With anyone you don't know: shop staff, waiters, people in the street, officials.
    - With older people and at work with superiors (unless invited to use *tu*).
    - Always when speaking to more than one person.

    ### When to use tu
    - Friends, family, children, animals; students and young people among themselves.
    - When someone proposes it: *On peut se tutoyer ?* (Shall we use tu?)

    The verbs: *tutoyer* (to say tu), *vouvoyer* (to say vous). When in doubt, **start with vous** and let the other person switch.

    *Vous* always takes the *vous* verb form, even for one person: *Vous êtes prêt, monsieur ?*
  examples:
    - { es: "Tu es prête, Julie ?", en: "Are you ready, Julie?" }
    - { es: "Vous êtes madame Dupont ?", en: "Are you Mrs Dupont?" }
    - { es: "On peut se tutoyer ?", en: "Can we say tu to each other?" }
  pitfalls:
    - "Saying *tu* to a stranger, a waiter or a police officer can sound rude or overfamiliar."
    - "With *vous* for one person, adjectives stay singular: *Vous êtes gentille, madame.*"
  variant: "Québec uses *tu* much more readily than France, even with strangers and in shops; in Belgium and Switzerland usage is close to France."
  related: [g.subject-pronouns, g.greetings]
  drills:
    - { es: "Vous êtes de Paris, monsieur ?", en: "Are you from Paris, sir?" }
    - { es: "Tu es étudiant ?", en: "Are you a student?" }
    - { es: "Comment allez-vous ?", en: "How are you? (formal)" }
- id: g.stressed-pronouns
  level: a1
  title: "Stressed pronouns: moi, toi, lui, elle, nous, vous, eux, elles"
  summary: "Used alone, for emphasis, after prepositions and after c'est: Et toi ? Moi, je suis parisien. Chez moi."
  explanation: |
    | subject | stressed |
    |---|---|
    | je | **moi** |
    | tu | **toi** |
    | il / elle | **lui** / **elle** |
    | nous | **nous** |
    | vous | **vous** |
    | ils / elles | **eux** / **elles** |

    ### Uses
    - **Alone**, in short answers: *Qui veut un café ? — Moi !* *Et toi ?*
    - **For emphasis or contrast**, before the subject: *Moi, je suis de Lyon, et lui, il est de Nice.*
    - **After prepositions**: *avec moi, pour toi, chez lui, sans eux.*
    - **After *c'est***: *C'est moi. C'est lui, le prof.*
    - **In comparisons**: *Il est plus grand que moi.*
    - **With *aussi / non plus***: *Moi aussi. Toi non plus.*
  examples:
    - { es: "Je m'appelle Hugo. Et toi ?", en: "My name is Hugo. And you?" }
    - { es: "Moi, je suis canadienne.", en: "Me, I'm Canadian." }
    - { es: "Tu viens chez moi ?", en: "Are you coming to my place?" }
    - { es: "C'est lui, mon frère.", en: "That's him, my brother." }
  pitfalls:
    - "Not *Je, je suis…* for emphasis: say *Moi, je suis…*."
    - "After a preposition never use *je / tu / il*: *avec moi*, not *avec je*."
    - "*Eux* is masculine plural only; for women use *elles*."
  related: [g.subject-pronouns, g.moi-aussi-non-plus, g.comparatives]
  drills:
    - { es: "Et vous, vous êtes d'où ?", en: "And you, where are you from?" }
    - { es: "C'est pour toi.", en: "It's for you." }
    - { es: "Lui, il est sympa.", en: "Him, he's nice." }
- id: g.gender-nouns
  level: a1
  title: "Gender: every noun is masculine or feminine"
  summary: "Learn every noun with its article: le livre (m), la table (f). Endings give clues, not rules."
  explanation: |
    Every French noun is masculine or feminine, even objects: *le livre* (m), *la table* (f).

    ### Usually masculine
    - **-age**: *le fromage, le voyage* (but *la page, la plage, l'image* f)
    - **-ment**: *le moment, l'appartement*
    - **-eau**: *le bureau, le gâteau* (but *l'eau* f, *la peau* f)
    - **-isme, -ou, -o**: *le tourisme, le genou, le vélo*
    - days, months, seasons, languages, most trees: *le lundi, le français*

    ### Usually feminine
    - **-tion, -sion**: *la station, la télévision*
    - **-té**: *la ville… la liberté, la société* (but *l'été, le côté* m)
    - **-ure, -ence, -ance**: *la voiture, la France, la chance*
    - **-ette, -elle, -ie**: *la baguette, la poubelle, la boulangerie*
    - most nouns ending in a silent **-e** after two consonants: *la porte, la fenêtre*… but many exceptions (*le livre, le centre*)

    ### People
    Often a feminine form in **-e**: *un ami / une amie, un étudiant / une étudiante*. Some change more: *un acteur / une actrice, un chanteur / une chanteuse*.
  examples:
    - { es: "le fromage et la baguette", en: "the cheese and the baguette" }
    - { es: "la station de métro", en: "the metro station" }
    - { es: "un étudiant et une étudiante", en: "a (male) student and a (female) student" }
  pitfalls:
    - "Gender is grammatical, not logical: *la personne* is feminine even for a man; *le bébé* is masculine even for a girl."
    - "Learn the article with the noun, especially before a vowel where *l'* hides the gender: *l'hôtel* (m), *l'école* (f)."
    - "A final -e does not guarantee feminine: *le musée, le lycée, le problème*."
  related: [g.articles-definite, g.articles-indefinite, g.adjective-agreement]
  drills:
    - { es: "La voiture est rouge.", en: "The car is red." }
    - { es: "Le musée est grand.", en: "The museum is big." }
    - { es: "C'est une amie.", en: "She's a friend." }
- id: g.articles-definite
  level: a1
  title: "The definite article: le, la, l', les"
  summary: "'the' agrees with the noun; l' before a vowel or silent h; les for all plurals."
  explanation: |
    | | singular | before vowel / silent h | plural |
    |---|---|---|---|
    | masculine | **le** livre | **l'**ami | **les** livres |
    | feminine | **la** table | **l'**école | **les** tables |

    In the plural, *les* is pronounced [le], and [lez] before a vowel: *les amis* [le.za.mi].

    ### French uses "the" more than English
    - **General statements and likes**: *J'aime le café.* (I like coffee.) *Les chats sont mignons.*
    - **Languages, countries, subjects**: *le français, la France, les maths.*
    - **Days for habits**: *le lundi* (on Mondays).
    - **Titles**: *le docteur Martin* (but *Bonjour, docteur*).

    After *à* and *de*: *le* and *les* contract (*au, aux, du, des*): see contractions.
  examples:
    - { es: "J'aime le chocolat.", en: "I like chocolate." }
    - { es: "L'hôtel est près de la gare.", en: "The hotel is near the station." }
    - { es: "Les enfants sont à l'école.", en: "The children are at school." }
  pitfalls:
    - "Keep the article with likes: *j'aime le fromage*, not *j'aime fromage*."
    - "Some words starting with h do not elide (aspirated h): *le héros, la Hollande, le haricot*."
  related: [g.gender-nouns, g.contractions-au-du, g.elision-liaison, g.aimer-preferer]
  drills:
    - { es: "La gare est loin.", en: "The station is far." }
    - { es: "Les livres sont sur la table.", en: "The books are on the table." }
    - { es: "J'adore la musique.", en: "I love music." }
- id: g.adjective-agreement
  level: a1
  title: "Adjectives agree with the noun"
  summary: "petit, petite, petits, petites: add -e for feminine, -s for plural. Nationalities take a small letter."
  explanation: |
    | | masculine | feminine |
    |---|---|---|
    | singular | petit | petit**e** |
    | plural | petit**s** | petit**es** |

    ### Spelling patterns
    | masculine | feminine | example |
    |---|---|---|
    | ends in -e | no change | *jeune → jeune, rouge → rouge* |
    | -er | -ère | *cher → chère* |
    | -eux | -euse | *heureux → heureuse* |
    | -if | -ive | *sportif → sportive* |
    | -en / -on | -enne / -onne | *canadien → canadienne, bon → bonne* |
    | -el | -elle | *naturel → naturelle* |

    Plural: add **-s** (silent), except -s/-x (no change: *français, heureux*) and -al → -aux (*national → nationaux*).

    ### Sound
    The feminine -e often makes the final consonant heard: *petit* [pəti] → *petite* [pətit], *français* → *française* [fʁɑ̃sɛz].

    ### Nationalities
    Adjectives of nationality take a **small letter**: *Il est français.* The noun for a person takes a capital: *un Français, une Anglaise.*

    A mixed group takes the masculine plural: *Paul et Marie sont canadiens.*
  examples:
    - { es: "Elle est française et il est anglais.", en: "She's French and he's English." }
    - { es: "Les maisons sont petites.", en: "The houses are small." }
    - { es: "Ma sœur est très sportive.", en: "My sister is very sporty." }
    - { es: "Ils sont canadiens.", en: "They are Canadian." }
  pitfalls:
    - "No capital letter on nationality adjectives or languages: *une voiture italienne, je parle anglais*."
    - "Pronounce the consonant in the feminine: *grand* [gʁɑ̃] / *grande* [gʁɑ̃d]."
    - "With *vous* for one person, the adjective is singular: *Vous êtes américaine, madame ?*"
  related: [g.gender-nouns, g.adjective-position, g.beau-nouveau-vieux, g.colours]
  drills:
    - { es: "Mon ami est espagnol.", en: "My friend is Spanish." }
    - { es: "Nous sommes contents.", en: "We are happy." }
    - { es: "La ville est très belle.", en: "The city is very beautiful." }
- id: g.negation-ne-pas
  level: a1
  title: "Negation: ne … pas"
  summary: "Put ne before the verb and pas after it: je ne suis pas, il n'aime pas."
  explanation: |
    French negation has **two parts** that wrap around the conjugated verb:

    | affirmative | negative |
    |---|---|
    | *Je suis français.* | *Je **ne** suis **pas** français.* |
    | *Elle aime le thé.* | *Elle **n'**aime **pas** le thé.* |
    | *Nous parlons italien.* | *Nous **ne** parlons **pas** italien.* |

    - *Ne* → *n'* before a vowel or silent h: *Il n'habite pas ici.*
    - With a reflexive pronoun, *ne* goes before it: *Je ne m'appelle pas Paul.*
    - Short answers: *Non.* / *Pas moi.* / *Pas du tout.* (not at all)

    ### In speech
    In everyday spoken French the *ne* is very often dropped: *Je sais pas. C'est pas grave.* Learn the full form for writing and polite speech; understand the short one when you hear it.
  examples:
    - { es: "Je ne suis pas parisien.", en: "I'm not from Paris." }
    - { es: "Il n'est pas là.", en: "He isn't here." }
    - { es: "Ce n'est pas loin.", en: "It's not far." }
    - { es: "Nous ne parlons pas allemand.", en: "We don't speak German." }
  pitfalls:
    - "Don't forget *pas*: *je ne suis français* is incomplete."
    - "English 'don't' has no equivalent word: *je ne parle pas*, never *je ne fais pas parler*."
    - "*Un, une, des, du, de la* become *de* after a negative: *Je n'ai pas de voiture.*"
  related: [g.de-after-negation, g.negation-jamais-plus-rien, g.spoken-negation]
  drills:
    - { es: "Elle n'est pas française.", en: "She isn't French." }
    - { es: "Je ne travaille pas le lundi.", en: "I don't work on Mondays." }
    - { es: "Ce n'est pas mon livre.", en: "It's not my book." }
- id: g.yes-no-questions
  level: a1
  title: "Yes/no questions: intonation and est-ce que"
  summary: "Raise your voice (Tu es français ?) or start with est-ce que (Est-ce que tu es français ?). Answer oui, non or si."
  explanation: |
    ### Three ways to ask
    | style | example |
    |---|---|
    | rising intonation (everyday speech) | *Tu es étudiant ?* |
    | *est-ce que* + statement (neutral, very common) | *Est-ce que tu es étudiant ?* |
    | inversion (formal, written) | *Es-tu étudiant ?* |

    *Est-ce que* has no meaning of its own: it just announces a question. Before a vowel it becomes *est-ce qu'*: *Est-ce qu'il est là ?*

    ### Answering
    - *Oui* (yes), *non* (no).
    - **Si** = "yes" to contradict a **negative** question: *Tu n'es pas français ? — Si, je suis français !*

    In French writing, put a space before **?** and **!**: *Ça va ?*
  examples:
    - { es: "Vous êtes anglais ?", en: "Are you English?" }
    - { es: "Est-ce que tu aimes Paris ?", en: "Do you like Paris?" }
    - { es: "Est-ce qu'elle est mariée ?", en: "Is she married?" }
    - { es: "Tu n'es pas italien ? — Si !", en: "You're not Italian? — Yes, I am!" }
  pitfalls:
    - "Don't translate 'do' in questions: *Est-ce que tu parles anglais ?* or *Tu parles anglais ?*, never *Fais-tu parler…*."
    - "Answer *si*, not *oui*, to contradict a negative question."
  related: [g.question-words, g.inversion-questions, g.negation-ne-pas]
  drills:
    - { es: "Est-ce que vous êtes de Paris ?", en: "Are you from Paris?" }
    - { es: "Tu es prêt ?", en: "Are you ready?" }
    - { es: "Est-ce qu'il parle français ?", en: "Does he speak French?" }
- id: g.avoir-present
  level: a1
  title: "The verb avoir (to have)"
  summary: "j'ai, tu as, il a, nous avons, vous avez, ils ont: possession, age and many expressions."
  explanation: |
    | | avoir |
    |---|---|
    | j' | **ai** |
    | tu | **as** |
    | il / elle / on | **a** |
    | nous | **avons** |
    | vous | **avez** |
    | ils / elles | **ont** |

    ### Uses
    - **Possession**: *J'ai un frère. Elle a une voiture.*
    - **Age**: *J'ai trente ans.* (literally "I have thirty years")
    - **Expressions**: *avoir faim, avoir soif, avoir froid* (see *avoir* expressions).
    - **Helper verb** of the passé composé (A2): *J'ai mangé.*

    ### Liaison
    *nous avons* [nu.za.vɔ̃], *vous avez* [vu.za.ve], *ils ont* [il.zɔ̃], *elles ont* [ɛl.zɔ̃].
  examples:
    - { es: "J'ai deux sœurs.", en: "I have two sisters." }
    - { es: "Tu as un chien ?", en: "Do you have a dog?" }
    - { es: "Nous avons un appartement à Paris.", en: "We have a flat in Paris." }
    - { es: "Ils ont trois enfants.", en: "They have three children." }
  pitfalls:
    - "*Je* elides: *j'ai*, never *je ai*."
    - "After a negative, *un / une / des* → *de*: *Je n'ai pas de frère.*"
    - "*Ils ont* [ilzɔ̃] (have) vs *ils sont* [ilsɔ̃] (are)."
  related: [g.avoir-expressions, g.etre-present, g.de-after-negation]
  drills:
    - { es: "Elle a un chat.", en: "She has a cat." }
    - { es: "Vous avez des enfants ?", en: "Do you have children?" }
    - { es: "J'ai vingt ans.", en: "I'm twenty." }
- id: g.possessives
  level: a1
  title: "Possessive adjectives: mon, ma, mes…"
  summary: "The possessive agrees with the thing owned, not the owner: sa mère = his or her mother."
  explanation: |
    | owner | masculine | feminine | plural |
    |---|---|---|---|
    | je | **mon** père | **ma** mère | **mes** parents |
    | tu | **ton** frère | **ta** sœur | **tes** amis |
    | il / elle | **son** fils | **sa** fille | **ses** enfants |
    | nous | **notre** oncle | **notre** tante | **nos** cousins |
    | vous | **votre** ami | **votre** amie | **vos** amis |
    | ils / elles | **leur** chien | **leur** maison | **leurs** livres |

    ### Agreement with the thing owned
    *Son, sa, ses* mean his, her **or** its: the choice depends on the noun that follows, not on the owner.
    - *Paul aime sa mère.* — Paul loves his mother.
    - *Marie aime son père.* — Marie loves her father.

    ### Before a vowel
    Feminine nouns starting with a vowel or silent h take **mon, ton, son** for the sound: *mon amie, ton école, son histoire.*
  examples:
    - { es: "Voici ma mère et mon père.", en: "Here are my mother and my father." }
    - { es: "Ses enfants sont à Paris.", en: "His (or her) children are in Paris." }
    - { es: "C'est mon amie Claire.", en: "This is my friend Claire." }
    - { es: "Leurs parents habitent à Lille.", en: "Their parents live in Lille." }
  pitfalls:
    - "*Sa* does not mean 'her' only: *son frère* can be her brother; *sa sœur* can be his sister."
    - "*Mon amie*, not *ma amie*, before a vowel."
    - "*Leur* (one thing) vs *leurs* (several things), both for several owners."
  related: [g.possessive-pronouns, g.gender-nouns]
  drills:
    - { es: "Mon frère s'appelle Louis.", en: "My brother's name is Louis." }
    - { es: "Votre fille est très grande.", en: "Your daughter is very tall." }
    - { es: "Nos amis sont ici.", en: "Our friends are here." }
- id: g.plural-nouns
  level: a1
  title: "Plural of nouns"
  summary: "Add a silent -s; -eau, -eu add -x; -al becomes -aux. The article les / des tells you it's plural."
  explanation: |
    | rule | singular | plural |
    |---|---|---|
    | most nouns: add **-s** | *un livre* | *des livres* |
    | ending in -s, -x, -z: no change | *un bus, un prix, un nez* | *des bus, des prix, des nez* |
    | -eau, -eu: add **-x** | *un gâteau, un cheveu* | *des gâteaux, des cheveux* |
    | -al → **-aux** | *un journal, un animal* | *des journaux, des animaux* |
    | seven -ou nouns add -x | *un bijou, un genou* | *des bijoux, des genoux* |

    ### Irregular
    *un œil → des yeux* (eye), *monsieur → messieurs, madame → mesdames.*

    ### Hearing the plural
    The -s is silent: *livre* and *livres* sound the same. You hear the plural in the article (*le* [lə] / *les* [le]) and in liaison: *les enfants* [le.zɑ̃.fɑ̃].
  examples:
    - { es: "J'ai deux chats.", en: "I have two cats." }
    - { es: "Les gâteaux sont délicieux.", en: "The cakes are delicious." }
    - { es: "Il y a des journaux sur la table.", en: "There are newspapers on the table." }
  pitfalls:
    - "Don't pronounce the plural -s: *les livres* [le livʁ]."
    - "*Un œil, des yeux*: completely different words."
    - "Exceptions to -al: *un festival → des festivals, un carnaval → des carnavals*."
  related: [g.articles-definite, g.articles-indefinite, g.adjective-agreement]
  drills:
    - { es: "Les animaux sont dans le parc.", en: "The animals are in the park." }
    - { es: "Elle a les yeux bleus.", en: "She has blue eyes." }
    - { es: "Je veux deux croissants.", en: "I want two croissants." }
- id: g.numbers-0-69
  level: a1
  title: "Numbers 0–69"
  summary: "un, deux, trois… dix-sept, vingt, vingt et un, trente… soixante-neuf."
  explanation: |
    | | | | |
    |---|---|---|---|
    | 0 zéro | 1 un / une | 2 deux | 3 trois |
    | 4 quatre | 5 cinq | 6 six | 7 sept |
    | 8 huit | 9 neuf | 10 dix | 11 onze |
    | 12 douze | 13 treize | 14 quatorze | 15 quinze |
    | 16 seize | 17 dix-sept | 18 dix-huit | 19 dix-neuf |

    ### Tens
    *vingt* (20), *trente* (30), *quarante* (40), *cinquante* (50), *soixante* (60).

    ### Building numbers
    - With 1: **et un** — *vingt et un, trente et un, soixante et un*.
    - With 2–9: hyphen — *vingt-deux, quarante-cinq, soixante-neuf*.
    - *Un* agrees: *vingt et une personnes*.

    ### Pronunciation
    *Six, huit, dix* drop their final consonant before a consonant (*six livres* [si livʁ]), link before a vowel (*six ans* [si.zɑ̃]) and pronounce it alone (*j'en ai six* [sis]). *Vingt* [vɛ̃], but *vingt-deux* [vɛ̃t.dø].
  examples:
    - { es: "J'ai trente-deux ans.", en: "I'm thirty-two." }
    - { es: "Il y a vingt et un élèves.", en: "There are twenty-one pupils." }
    - { es: "Mon numéro, c'est le zéro six, quarante-cinq, douze, dix-huit, soixante.", en: "My number is 06 45 12 18 60." }
  pitfalls:
    - "*Vingt et un*, not *vingt-un*."
    - "French phone numbers are read in pairs: *06 45 12 18 60* = *zéro six, quarante-cinq…*"
    - "The 1990 spelling reform allows hyphens everywhere (*vingt-et-un*); both are accepted."
  related: [g.numbers-70-100, g.avoir-expressions, g.avoir-present]
  drills:
    - { es: "Elle a quarante-quatre ans.", en: "She's forty-four." }
    - { es: "Il y a soixante minutes dans une heure.", en: "There are sixty minutes in an hour." }
    - { es: "J'habite au numéro dix-sept.", en: "I live at number seventeen." }
- id: g.question-words
  level: a1
  title: "Question words: qui, où, quand, comment, pourquoi, combien, que"
  summary: "Où tu habites ? / Tu habites où ? / Où est-ce que tu habites ? / Où habites-tu ?"
  explanation: |
    | word | meaning | example |
    |---|---|---|
    | **qui** | who | *Qui est-ce ?* |
    | **où** | where | *Où est la gare ?* |
    | **quand** | when | *Tu pars quand ?* |
    | **comment** | how | *Comment ça va ?* |
    | **pourquoi** | why | *Pourquoi tu ris ?* — *Parce que…* |
    | **combien (de)** | how much / many | *Combien de frères tu as ?* |
    | **que / qu'est-ce que** | what | *Qu'est-ce que tu fais ?* |
    | **quoi** | what (end of sentence, informal) | *Tu fais quoi ?* |

    ### Word order
    | style | example |
    |---|---|
    | spoken: word at the end | *Tu habites où ?* |
    | spoken: word first | *Où tu habites ?* |
    | neutral: + est-ce que | *Où est-ce que tu habites ?* |
    | formal: inversion | *Où habites-tu ?* |

    *Que* becomes *qu'* before a vowel. Use *quoi* after a verb or preposition: *C'est quoi ? De quoi tu parles ?*
  examples:
    - { es: "Où est-ce que tu habites ?", en: "Where do you live?" }
    - { es: "Comment s'appelle ta sœur ?", en: "What's your sister called?" }
    - { es: "Qu'est-ce que tu aimes ?", en: "What do you like?" }
    - { es: "Combien de cousins tu as ?", en: "How many cousins do you have?" }
  pitfalls:
    - "*Que* cannot go at the end: *Tu fais quoi ?*, not *Tu fais que ?*"
    - "*Combien de* + noun, with no article: *combien de frères*."
    - "*Où* (where) has an accent; *ou* (or) does not."
  related: [g.yes-no-questions, g.inversion-questions, g.quel]
  drills:
    - { es: "Qui est ton professeur ?", en: "Who is your teacher?" }
    - { es: "Tu arrives quand ?", en: "When are you arriving?" }
    - { es: "Pourquoi est-ce que tu es triste ?", en: "Why are you sad?" }
- id: g.il-y-a
  level: a1
  title: "Il y a: there is, there are"
  summary: "One form for singular and plural: il y a un café, il y a des magasins. Negative: il n'y a pas de."
  explanation: |
    *Il y a* means "there is" **and** "there are"; it never changes for the plural.

    | | example |
    |---|---|
    | affirmative | *Il y a une boulangerie dans ma rue.* |
    | plural | *Il y a des restaurants.* |
    | negative | *Il n'y a pas **de** cinéma.* |
    | question | *Est-ce qu'il y a un métro ? / Il y a un métro ?* |
    | formal question | *Y a-t-il un métro ?* |

    ### Il y a vs c'est / voici
    - *Il y a* says something **exists** somewhere: *Il y a un parc près d'ici.*
    - *C'est* identifies or describes: *C'est un joli parc.*
    - *Voici / voilà* points: *Voilà le parc !*

    In speech you'll hear *y a* [ja]: *Y a pas de problème.*

    Later, *il y a* + time means "ago": *il y a deux ans* (A2).
  examples:
    - { es: "Il y a un marché le dimanche.", en: "There's a market on Sundays." }
    - { es: "Il y a trois chambres dans l'appartement.", en: "There are three bedrooms in the flat." }
    - { es: "Il n'y a pas de métro ici.", en: "There's no metro here." }
    - { es: "Qu'est-ce qu'il y a dans ton quartier ?", en: "What is there in your neighbourhood?" }
  pitfalls:
    - "Never *il y sont*: *il y a* is invariable."
    - "After the negative, *un / une / des* → *de*: *il n'y a pas de pharmacie*."
  related: [g.de-after-negation, g.c-est-il-est, g.articles-indefinite, g.pendant-depuis-il-y-a]
  drills:
    - { es: "Il y a un café au coin de la rue.", en: "There's a café on the corner." }
    - { es: "Il n'y a pas de parking.", en: "There's no car park." }
    - { es: "Est-ce qu'il y a une pharmacie près d'ici ?", en: "Is there a pharmacy near here?" }
- id: g.articles-indefinite
  level: a1
  title: "The indefinite article: un, une, des"
  summary: "un (m), une (f), des (plural 'some', often not translated)."
  explanation: |
    | | singular | plural |
    |---|---|---|
    | masculine | **un** livre | **des** livres |
    | feminine | **une** maison | **des** maisons |

    - *Des* is the plural of *un / une*: English often uses no word at all. *J'ai des amis à Paris.* — I have friends in Paris.
    - French needs an article almost always: *C'est un appartement.* *Il y a des chaises.*
    - Liaison: *un ami* [œ̃.na.mi], *des amis* [de.za.mi].

    ### After a negative
    *un, une, des* → **de / d'**: *J'ai un vélo → Je n'ai pas de vélo.* (But after *être* they stay: *Ce n'est pas un vélo.*)

    ### Before an adjective in the plural
    In careful French, *des* → *de* before a plural adjective: *de jolies maisons* (spoken French often keeps *des*).
  examples:
    - { es: "Il y a un canapé et une table.", en: "There's a sofa and a table." }
    - { es: "J'ai des voisins sympas.", en: "I have nice neighbours." }
    - { es: "C'est une belle rue.", en: "It's a lovely street." }
  pitfalls:
    - "Don't drop *des*: *Il y a des arbres*, not *Il y a arbres*."
    - "No article with professions after *être*: *Elle est architecte*, but *C'est une architecte*."
    - "*Ce n'est pas un problème* keeps *un* because the verb is *être*."
  related: [g.articles-definite, g.partitive-articles, g.de-after-negation]
  drills:
    - { es: "J'habite dans un petit appartement.", en: "I live in a small flat." }
    - { es: "Il y a des fleurs sur le balcon.", en: "There are flowers on the balcony." }
    - { es: "C'est un quartier calme.", en: "It's a quiet neighbourhood." }
- id: g.prepositions-place
  level: a1
  title: "Prepositions of place: sur, sous, dans, devant, derrière, à côté de…"
  summary: "sur la table, dans le salon, à côté de la fenêtre, en face du métro."
  explanation: |
    | preposition | meaning | example |
    |---|---|---|
    | **dans** | in, inside | *dans la cuisine* |
    | **sur** | on | *sur le lit* |
    | **sous** | under | *sous la table* |
    | **devant** | in front of | *devant la porte* |
    | **derrière** | behind | *derrière l'église* |
    | **entre** | between | *entre la gare et le parc* |
    | **à côté de** | next to | *à côté de la boulangerie* |
    | **en face de** | opposite | *en face du café* |
    | **près de** | near | *près de la Seine* |
    | **loin de** | far from | *loin du centre* |
    | **à gauche de / à droite de** | to the left / right of | *à droite de la fenêtre* |
    | **chez** | at someone's place | *chez moi, chez le médecin* |

    Prepositions ending in **de** contract with *le* and *les*: *à côté du lit, près des magasins* (see contractions).
  examples:
    - { es: "Le chat est sous le lit.", en: "The cat is under the bed." }
    - { es: "La boulangerie est en face de la pharmacie.", en: "The bakery is opposite the pharmacy." }
    - { es: "J'habite près du Sacré-Cœur.", en: "I live near the Sacré-Cœur." }
    - { es: "Ce soir, on mange chez moi.", en: "Tonight we're eating at my place." }
  pitfalls:
    - "*à côté de le* → *à côté du*; *près de les* → *près des*."
    - "*Chez* is for people, not places: *chez Paul*, but *à la boulangerie*."
    - "*Sur* (on) vs *sous* (under): the vowel makes all the difference."
  related: [g.contractions-au-du, g.il-y-a, g.directions]
  drills:
    - { es: "Les clés sont sur la table.", en: "The keys are on the table." }
    - { es: "Le métro est à côté du parc.", en: "The metro is next to the park." }
    - { es: "Il y a un jardin derrière la maison.", en: "There's a garden behind the house." }
- id: g.elision-liaison
  level: a1
  title: "Elision and liaison: l'ami, j'habite, les amis"
  summary: "Small words drop their vowel before a vowel (elision); silent final consonants are pronounced before a vowel (liaison)."
  explanation: |
    ### Elision (written with an apostrophe)
    Before a vowel or silent **h**, these words drop their vowel:

    | word | elided | example |
    |---|---|---|
    | le, la | l' | *l'hôtel, l'église* |
    | je | j' | *j'habite* |
    | me, te, se | m', t', s' | *je m'appelle* |
    | ne | n' | *il n'est pas* |
    | de | d' | *beaucoup d'amis* |
    | que | qu' | *qu'est-ce que* |
    | si + il | s'il | *s'il vous plaît* |

    ### Liaison (heard, not written)
    A silent final consonant is pronounced when the next word starts with a vowel, inside a word group:
    - **compulsory**: article + noun (*les‿amis, un‿enfant*), pronoun + verb (*nous‿avons, ils‿ont*), adjective + noun (*petit‿ami*), after *très, chez, en, dans*.
    - **forbidden**: after *et* (*et / il*), before aspirated h (*les / héros*), after a singular noun.

    Final **s** and **x** sound [z], **d** sounds [t]: *grand‿homme* [gʁɑ̃.tɔm].
  examples:
    - { es: "J'habite à l'hôtel.", en: "I live at the hotel." }
    - { es: "Les enfants ont un ordinateur.", en: "The children have a computer." }
    - { es: "Il n'aime pas l'école.", en: "He doesn't like school." }
  pitfalls:
    - "*Si* elides only before *il / ils*: *s'il*, but *si elle*."
    - "No elision before aspirated h: *le haricot, la Hollande, le hockey*."
    - "Never make liaison after *et*: *Paul et Anne* [pɔl e an]."
  related: [g.articles-definite, g.subject-pronouns, g.numbers-0-69]
  drills:
    - { es: "L'école est à côté.", en: "The school is next door." }
    - { es: "Nous avons deux enfants.", en: "We have two children." }
    - { es: "Qu'est-ce qu'il aime ?", en: "What does he like?" }
- id: g.c-est-il-est
  level: a1
  title: "C'est or il est?"
  summary: "c'est + article/name/stressed pronoun; il/elle est + adjective, profession or nationality alone."
  explanation: |
    | use **c'est / ce sont** | use **il / elle est, ils / elles sont** |
    |---|---|
    | + determiner + noun: *C'est un architecte.* | + profession alone: *Il est architecte.* |
    | + name: *C'est Paul.* | + nationality alone: *Elle est belge.* |
    | + stressed pronoun: *C'est moi.* | + adjective about a specific person/thing: *Il est grand.* |
    | + adjective about a general idea: *C'est beau, Paris !* | |

    ### Generic vs specific
    - *Paris, c'est magnifique.* (Paris as an idea, the experience: masculine singular adjective)
    - *La tour Eiffel ? Elle est magnifique.* (that specific tower)

    *Ce sont* is the plural (*Ce sont mes parents*); in speech *c'est* is common for plurals too.

    *Qu'est-ce que c'est ?* = What is it? *Qui est-ce ? / C'est qui ?* = Who is it?
  examples:
    - { es: "C'est mon voisin. Il est très sympa.", en: "That's my neighbour. He's very nice." }
    - { es: "Elle est médecin. C'est une bonne médecin.", en: "She's a doctor. She's a good doctor." }
    - { es: "Montmartre, c'est joli !", en: "Montmartre is lovely!" }
    - { es: "Qu'est-ce que c'est ? — C'est un croissant.", en: "What is it? — It's a croissant." }
  pitfalls:
    - "Not *il est un professeur*: say *il est professeur* or *c'est un professeur*."
    - "With an adjective + noun, use *c'est*: *C'est un bon prof.*"
    - "*C'est* + adjective stays masculine: *La vie à Paris, c'est cher.*"
  related: [g.etre-present, g.articles-indefinite, g.stressed-pronouns]
  drills:
    - { es: "C'est ma sœur. Elle est étudiante.", en: "That's my sister. She's a student." }
    - { es: "Ce sont mes amis.", en: "These are my friends." }
    - { es: "Il est français, c'est un Parisien.", en: "He's French, he's a Parisian." }
- id: g.present-er
  level: a1
  title: "Present tense of -er verbs: parler, aimer, habiter"
  summary: "Drop -er and add -e, -es, -e, -ons, -ez, -ent. Four forms sound the same."
  explanation: |
    | | parler | aimer |
    |---|---|---|
    | je / j' | parl**e** | aim**e** |
    | tu | parl**es** | aim**es** |
    | il / elle / on | parl**e** | aim**e** |
    | nous | parl**ons** | aim**ons** |
    | vous | parl**ez** | aim**ez** |
    | ils / elles | parl**ent** | aim**ent** |

    ### Pronunciation
    *-e, -es, -ent* are all **silent**: *je parle, tu parles, il parle, ils parlent* sound identical [paʁl]. Only *nous* [-ɔ̃] and *vous* [-e] sound different.

    About 90 % of French verbs are -er verbs, and almost all are regular: *habiter, travailler, manger, regarder, écouter, chercher, danser, étudier, commander, adorer.*

    ### One present, three meanings
    *Je mange* = I eat / I am eating / I do eat.

    ### Spelling
    *manger → nous mangeons*, *commencer → nous commençons* (to keep the soft g and c sound).
  examples:
    - { es: "Je parle un peu français.", en: "I speak a little French." }
    - { es: "Vous habitez à Paris ?", en: "Do you live in Paris?" }
    - { es: "Ils mangent au restaurant.", en: "They're eating at the restaurant." }
    - { es: "Nous commandons deux cafés.", en: "We're ordering two coffees." }
  pitfalls:
    - "Don't pronounce *-ent*: *ils parlent* [il paʁl], not [paʁlɑ̃]."
    - "No 'do' or 'am …-ing': *je travaille* = I work / I'm working."
    - "*Aller* ends in -er but is irregular."
  related: [g.stem-changing-er, g.present-ir-verbs, g.present-re-verbs]
  drills:
    - { es: "Tu travailles où ?", en: "Where do you work?" }
    - { es: "Elle écoute de la musique.", en: "She's listening to music." }
    - { es: "Nous mangeons à midi.", en: "We eat at noon." }
- id: g.partitive-articles
  level: a1
  title: "The partitive: du, de la, de l', des — 'some'"
  summary: "For things you can't count or an unspecified amount: du pain, de la confiture, de l'eau."
  explanation: |
    | | partitive | example |
    |---|---|---|
    | masculine | **du** | *du pain, du fromage* |
    | feminine | **de la** | *de la confiture, de la salade* |
    | before vowel | **de l'** | *de l'eau, de l'huile* |
    | plural | **des** | *des frites, des légumes* |

    English often says "some" or nothing: *Je bois de l'eau.* — I drink water / some water.

    ### Which article?
    | situation | article | example |
    |---|---|---|
    | a quantity, some of it | partitive | *Je mange **du** fromage.* |
    | one countable item | un / une | *Je mange **un** croissant.* |
    | likes, in general | le / la / les | *J'aime **le** fromage.* |
    | a specific one | le / la | *Le fromage est sur la table.* |

    After a negative and after quantities, the partitive becomes **de**: *pas de pain, beaucoup de pain.*
  examples:
    - { es: "Je voudrais du pain, s'il vous plaît.", en: "I'd like some bread, please." }
    - { es: "Tu veux de l'eau ?", en: "Do you want some water?" }
    - { es: "Le matin, je mange de la confiture.", en: "In the morning I eat jam." }
    - { es: "J'aime le fromage, alors je prends du fromage.", en: "I like cheese, so I'm having some cheese." }
  pitfalls:
    - "Never leave the article out: *je mange du pain*, not *je mange pain*."
    - "Likes take *le / la / les*: *J'aime le café*, not *J'aime du café*."
    - "*Du* is also *de + le* (of the): *le prix du pain*."
  related: [g.de-after-negation, g.quantities, g.articles-definite, g.pronoun-en]
  drills:
    - { es: "On achète du lait ?", en: "Shall we buy some milk?" }
    - { es: "Il boit de la limonade.", en: "He drinks lemonade." }
    - { es: "Il y a des croissants.", en: "There are croissants." }
- id: g.je-voudrais
  level: a1
  title: "Je voudrais… — ordering politely"
  summary: "Je voudrais, j'aimerais, je vais prendre, vous avez… ? — the polite ways to order and ask."
  explanation: |
    ### Ordering
    | phrase | tone |
    |---|---|
    | *Je voudrais un café, s'il vous plaît.* | polite, standard |
    | *Je vais prendre une crêpe.* | very common in restaurants |
    | *Pour moi, une salade.* | quick, natural |
    | *Un thé, s'il vous plaît.* | fine with *s'il vous plaît* |
    | *Je veux un café.* | too direct with staff |

    *Voudrais* is the conditional of *vouloir* (want); here learn it as a fixed polite form: *je voudrais, tu voudrais, vous voudriez.*

    ### Asking
    - *Vous avez des croissants ?* — Do you have croissants?
    - *L'addition, s'il vous plaît.* — The bill, please.
    - *C'est combien ?* — How much is it?

    ### Café words
    *un café* (an espresso), *un crème / un café crème* (coffee with milk), *une carafe d'eau* (free tap water), *un demi* (a small beer).
  examples:
    - { es: "Bonjour, je voudrais un croissant, s'il vous plaît.", en: "Hello, I'd like a croissant, please." }
    - { es: "Je vais prendre le menu du jour.", en: "I'll have the set menu of the day." }
    - { es: "Vous avez du thé vert ?", en: "Do you have green tea?" }
    - { es: "L'addition, s'il vous plaît !", en: "The bill, please!" }
  pitfalls:
    - "*Je veux* sounds demanding to a waiter; use *je voudrais* or *je vais prendre*."
    - "Don't call the waiter *garçon*; say *Monsieur !* / *Madame !* or *S'il vous plaît !*"
  variant: "In Belgium and Québec *s'il vous plaît* is also heard; in Belgium, when handing something over, people say *s'il vous plaît* where the French say *voilà*."
  related: [g.partitive-articles, g.modal-verbs, g.conditional-politeness]
  drills:
    - { es: "Je voudrais une carafe d'eau.", en: "I'd like a jug of tap water." }
    - { es: "Pour moi, un café crème.", en: "For me, a white coffee." }
    - { es: "Vous avez une table pour deux ?", en: "Do you have a table for two?" }
- id: g.aimer-preferer
  level: a1
  title: "Likes and dislikes: aimer, adorer, détester, préférer"
  summary: "These verbs take le/la/les (J'aime le café) or an infinitive (J'aime danser)."
  explanation: |
    | stronger ← | | → weaker |
    |---|---|---|
    | *J'adore* | *J'aime (beaucoup / bien)* | *Je n'aime pas (du tout)* · *Je déteste* |

    ### With nouns: the definite article
    *J'aime **le** chocolat. Je déteste **les** légumes. Il préfère **la** mer.*

    ### With verbs: the infinitive
    *J'aime voyager. Elle adore danser. Nous préférons rester ici.*

    ### Préférer
    Stem change in four forms: *je préf**è**re, tu préf**è**res, il préf**è**re, ils préf**è**rent* but *nous préf**é**rons, vous préf**é**rez*.

    ### Aimer bien
    With people, *aimer bien* = to like; *aimer* alone = to love. *J'aime bien Paul* (I like Paul) vs *J'aime Paul* (I love Paul).
  examples:
    - { es: "J'adore les croissants.", en: "I love croissants." }
    - { es: "Je n'aime pas le café.", en: "I don't like coffee." }
    - { es: "Tu préfères le thé ou le café ?", en: "Do you prefer tea or coffee?" }
    - { es: "Nous aimons manger en terrasse.", en: "We like eating on the terrace." }
  pitfalls:
    - "Keep the article: *J'aime le vin*, not *J'aime vin*."
    - "*J'aime Marie* is a declaration of love; for a friend say *J'aime bien Marie*."
    - "The negative keeps *le / la / les*: *Je n'aime pas le fromage* (not *de*)."
  related: [g.articles-definite, g.stem-changing-er, g.moi-aussi-non-plus]
  drills:
    - { es: "Elle déteste le froid.", en: "She hates the cold." }
    - { es: "J'aime bien ton quartier.", en: "I quite like your neighbourhood." }
    - { es: "Ils préfèrent la campagne.", en: "They prefer the countryside." }
- id: g.de-after-negation
  level: a1
  title: "Pas de: un, une, du, des become de after a negative"
  summary: "J'ai un chien → Je n'ai pas de chien. Je bois du lait → Je ne bois pas de lait."
  explanation: |
    After **ne … pas** (and other negatives), the indefinite and partitive articles become **de** (d' before a vowel):

    | affirmative | negative |
    |---|---|
    | *J'ai **un** frère.* | *Je n'ai pas **de** frère.* |
    | *Il y a **une** banque.* | *Il n'y a pas **de** banque.* |
    | *Je mange **du** pain.* | *Je ne mange pas **de** pain.* |
    | *Elle boit **de l'**eau.* | *Elle ne boit pas **d'**eau.* |
    | *Nous avons **des** enfants.* | *Nous n'avons pas **d'**enfants.* |

    ### What doesn't change
    - **le, la, les** stay: *Je n'aime pas **le** lait.*
    - After **être**, articles stay: *Ce n'est pas **un** problème. Ce ne sont pas **des** frites.*
    - Contrast with *mais*: *Je ne veux pas du thé, mais du café* (sometimes kept for contrast).
  examples:
    - { es: "Je n'ai pas de voiture.", en: "I don't have a car." }
    - { es: "Il n'y a pas de sucre.", en: "There's no sugar." }
    - { es: "Elle ne mange pas de viande.", en: "She doesn't eat meat." }
    - { es: "Ce n'est pas un restaurant, c'est un café.", en: "It's not a restaurant, it's a café." }
  pitfalls:
    - "Not *je n'ai pas un chien* in neutral French: *je n'ai pas de chien*."
    - "*Je n'aime pas le fromage* keeps *le*: liking takes the definite article."
  related: [g.negation-ne-pas, g.partitive-articles, g.articles-indefinite, g.il-y-a]
  drills:
    - { es: "Nous n'avons pas de pain.", en: "We have no bread." }
    - { es: "Tu ne bois pas d'alcool ?", en: "You don't drink alcohol?" }
    - { es: "Il n'y a pas de place.", en: "There's no room." }
- id: g.moi-aussi-non-plus
  level: a1
  title: "Moi aussi, moi non plus, moi si, pas moi"
  summary: "Agree with aussi (positive) or non plus (negative); disagree with si or pas moi."
  explanation: |
    | statement | agree | disagree |
    |---|---|---|
    | *J'aime le café.* (positive) | ***Moi aussi.*** (me too) | ***Pas moi.*** / *Moi non.* |
    | *Je n'aime pas le thé.* (negative) | ***Moi non plus.*** (me neither) | ***Moi si.*** (I do) |

    Any stressed pronoun works: *Toi aussi ? Lui non plus. Nous aussi. Eux si.*

    Inside a sentence: *Je parle anglais et elle aussi. Il ne fume pas et moi non plus.*

    *Aussi* also means "also, too" in full sentences: *Je prends aussi un dessert.*
  examples:
    - { es: "J'adore Paris. — Moi aussi !", en: "I love Paris. — Me too!" }
    - { es: "Je ne mange pas de viande. — Moi non plus.", en: "I don't eat meat. — Me neither." }
    - { es: "Je n'aime pas le jazz. — Moi si !", en: "I don't like jazz. — I do!" }
  pitfalls:
    - "Not *moi aussi* after a negative: *Je n'ai pas faim. — Moi non plus.*"
    - "Not *je aussi*: use the stressed pronoun *moi*."
  related: [g.stressed-pronouns, g.aimer-preferer, g.negation-ne-pas]
  drills:
    - { es: "Elle est fatiguée et moi aussi.", en: "She's tired and so am I." }
    - { es: "Il ne boit pas de café. — Nous non plus.", en: "He doesn't drink coffee. — Neither do we." }
    - { es: "Tu aimes le fromage ? Pas moi.", en: "You like cheese? Not me." }
- id: g.time-telling
  level: a1
  title: "Telling the time: Il est huit heures"
  summary: "Quelle heure est-il ? — Il est trois heures et quart. À quelle heure… ? — À midi."
  explanation: |
    *Quelle heure est-il ?* / *Il est quelle heure ?* — What time is it?
    Answer with **il est** + number + **heure(s)**:

    | time | everyday | 24-hour (timetables, official) |
    |---|---|---|
    | 1:00 | *Il est une heure.* | *une heure* |
    | 8:05 | *huit heures cinq* | *huit heures cinq* |
    | 8:15 | *huit heures et quart* | *huit heures quinze* |
    | 8:30 | *huit heures et demie* | *huit heures trente* |
    | 8:45 | *neuf heures moins le quart* | *huit heures quarante-cinq* |
    | 8:50 | *neuf heures moins dix* | *huit heures cinquante* |
    | 12:00 | *midi* / *minuit* | *douze heures* / *zéro heure* |
    | 20:00 | *huit heures du soir* | *vingt heures* |

    ### At what time?
    *À quelle heure… ?* — *À sept heures. Vers midi* (around noon). *De neuf heures à cinq heures.*

    ### Parts of the day
    *du matin* (in the morning), *de l'après-midi*, *du soir*. The 24-hour clock is very common in France, also in speech: *Le film commence à vingt heures.*

    Written: *8 h 30* or *8h30*.
  examples:
    - { es: "Il est neuf heures et demie.", en: "It's half past nine." }
    - { es: "Le musée ouvre à dix heures.", en: "The museum opens at ten." }
    - { es: "Le train part à dix-huit heures quinze.", en: "The train leaves at 18:15." }
    - { es: "On mange vers midi.", en: "We eat around noon." }
  pitfalls:
    - "Always say *heure(s)*: *il est trois heures*, not *il est trois*."
    - "*Midi et demi* (no -e after midi or minuit, which are masculine), but *une heure et demie*."
    - "*Moins le quart* uses *le*; *et quart* does not."
  related: [g.numbers-0-69, g.days-months-dates]
  drills:
    - { es: "Il est midi.", en: "It's noon." }
    - { es: "Je commence à huit heures.", en: "I start at eight." }
    - { es: "Il est sept heures moins le quart.", en: "It's a quarter to seven." }
- id: g.reflexive-intro
  level: a1
  title: "Routine verbs with me, te, se: je me lève, je me couche"
  summary: "Some daily-routine verbs need a pronoun matching the subject: je me lève, tu te douches, il se couche."
  explanation: |
    These are called **pronominal verbs**: the action is done to yourself.

    | | se lever (to get up) |
    |---|---|
    | je | **me** lève |
    | tu | **te** lèves |
    | il / elle / on | **se** lève |
    | nous | **nous** levons |
    | vous | **vous** levez |
    | ils / elles | **se** lèvent |

    *Me, te, se* → *m', t', s'* before a vowel: *je m'habille, il s'habille.*

    ### A typical day
    *se réveiller* (wake up), *se lever* (get up), *se doucher* (shower), *s'habiller* (get dressed), *se préparer* (get ready), *se reposer* (rest), *se coucher* (go to bed).

    ### Negative
    *ne* goes before the pronoun: *Je **ne** me lève **pas** tôt.*

    Compare: *Je lave la voiture* (I wash the car) / *Je me lave* (I wash myself). You'll study pronominal verbs fully at A2.
  examples:
    - { es: "Je me lève à sept heures.", en: "I get up at seven." }
    - { es: "Tu te couches tard ?", en: "Do you go to bed late?" }
    - { es: "Elle s'habille vite.", en: "She gets dressed quickly." }
    - { es: "Le dimanche, nous nous reposons.", en: "On Sundays we rest." }
  pitfalls:
    - "Don't forget the pronoun: *je me lève*, not *je lève* (which needs an object: *je lève la main*)."
    - "The pronoun matches the subject: *nous nous levons*, *vous vous levez*."
    - "*Se lever* changes its stem: *je me lève* but *nous nous levons*."
  related: [g.s-appeler, g.pronominal-verbs, g.stem-changing-er]
  drills:
    - { es: "Je me douche le matin.", en: "I shower in the morning." }
    - { es: "Ils se réveillent tôt.", en: "They wake up early." }
    - { es: "Vous vous couchez à quelle heure ?", en: "What time do you go to bed?" }
- id: g.days-months-dates
  level: a1
  title: "Days, months and dates"
  summary: "No capital letters: lundi, mars. Dates: le 14 juillet, le premier mai. Lundi = on Monday; le lundi = on Mondays."
  explanation: |
    ### Days (masculine, no capital)
    *lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche*

    ### Months (masculine, no capital)
    *janvier, février, mars, avril, mai, juin, juillet, août, septembre, octobre, novembre, décembre*

    ### Dates
    | English | French |
    |---|---|
    | on Monday (this one) | *lundi* |
    | on Mondays (every week) | *le lundi* |
    | on 14 July | *le 14 juillet* |
    | 1 May | *le **premier** mai* (only the 1st is ordinal) |
    | in March | *en mars* / *au mois de mars* |
    | in 2026 | *en 2026* (*deux mille vingt-six*) |
    | What's the date? | *On est le combien ?* / *Quelle est la date ?* |

    Seasons: *le printemps* (au printemps), *l'été, l'automne, l'hiver* (en été, en automne, en hiver).
  examples:
    - { es: "Aujourd'hui, c'est mardi.", en: "Today is Tuesday." }
    - { es: "Le musée est fermé le lundi.", en: "The museum is closed on Mondays." }
    - { es: "Mon anniversaire, c'est le trois avril.", en: "My birthday is on the third of April." }
    - { es: "Le 14 juillet, c'est la fête nationale.", en: "The 14th of July is the national holiday." }
  pitfalls:
    - "No capitals for days and months: *lundi 3 mars*."
    - "*Le premier juin*, but *le deux juin*, *le trois juin* (not *le deuxième*)."
    - "*Au printemps* but *en été, en automne, en hiver*."
  variant: "In Québec and Belgium the same names are used; Québécois often say *la fin de semaine* for the weekend (France: *le week-end*)."
  related: [g.time-telling, g.frequency-adverbs, g.numbers-100-plus]
  drills:
    - { es: "Le samedi, je vais au marché.", en: "On Saturdays I go to the market." }
    - { es: "On est le premier janvier.", en: "It's the first of January." }
    - { es: "En été, il fait chaud à Paris.", en: "In summer it's hot in Paris." }
- id: g.frequency-adverbs
  level: a1
  title: "How often: toujours, souvent, parfois, rarement, jamais"
  summary: "Adverbs of frequency usually go right after the verb: Je vais souvent au cinéma."
  explanation: |
    | adverb | meaning |
    |---|---|
    | *toujours* | always |
    | *tous les jours* / *chaque jour* | every day |
    | *souvent* | often |
    | *d'habitude* / *en général* | usually |
    | *parfois* / *quelquefois* | sometimes |
    | *de temps en temps* | from time to time |
    | *rarement* | rarely |
    | *ne … jamais* | never |

    ### Position
    Short adverbs go **after the conjugated verb**: *Je mange **souvent** au restaurant.* Longer expressions can go at the start or end: ***D'habitude**, je prends le métro.* *Je fais du sport **deux fois par semaine**.*

    *Jamais* needs *ne*: *Je **ne** bois **jamais** de café.*

    ### How many times
    *une fois par jour* (once a day), *deux fois par semaine*, *trois fois par mois*.
  examples:
    - { es: "Je prends toujours le métro.", en: "I always take the metro." }
    - { es: "Elle va souvent au cinéma.", en: "She often goes to the cinema." }
    - { es: "D'habitude, je me lève à sept heures.", en: "Usually I get up at seven." }
    - { es: "Il ne mange jamais de viande.", en: "He never eats meat." }
  pitfalls:
    - "Not before the verb as in English: *je souvent mange* is wrong; *je mange souvent*."
    - "*Jamais* needs *ne*: *je ne fume jamais*."
    - "*Toujours* also means 'still': *Il habite toujours à Paris.*"
  related: [g.negation-jamais-plus-rien, g.days-months-dates]
  drills:
    - { es: "Nous dînons souvent tard.", en: "We often have dinner late." }
    - { es: "Je fais du sport trois fois par semaine.", en: "I do sport three times a week." }
    - { es: "Parfois, je travaille le samedi.", en: "Sometimes I work on Saturdays." }
- id: g.present-ir-verbs
  level: a1
  title: "Present of -ir verbs: finir, choisir and dormir, partir"
  summary: "Type 1 (finir): -is, -is, -it, -issons, -issez, -issent. Type 2 (dormir, partir, sortir): drop the consonant in the singular."
  explanation: |
    ### Type 1: like finir (with -iss- in the plural)
    | | finir | choisir |
    |---|---|---|
    | je | fin**is** | chois**is** |
    | tu | fin**is** | chois**is** |
    | il / elle | fin**it** | chois**it** |
    | nous | fin**issons** | chois**issons** |
    | vous | fin**issez** | chois**issez** |
    | ils / elles | fin**issent** | chois**issent** |

    Also: *réussir* (succeed), *grandir* (grow up), *réfléchir* (think), *remplir* (fill in).

    ### Type 2: like dormir, partir, sortir
    The singular loses the consonant before -ir:

    | | dormir | partir | sortir |
    |---|---|---|---|
    | je / tu | dor**s** | par**s** | sor**s** |
    | il / elle | dor**t** | par**t** | sor**t** |
    | nous | dorm**ons** | part**ons** | sort**ons** |
    | vous | dorm**ez** | part**ez** | sort**ez** |
    | ils / elles | dorm**ent** | part**ent** | sort**ent** |

    The dictionary doesn't tell you the type: learn each verb.
  examples:
    - { es: "Je finis à dix-huit heures.", en: "I finish at six pm." }
    - { es: "Tu choisis quel dessert ?", en: "Which dessert are you choosing?" }
    - { es: "Le bébé dort.", en: "The baby is sleeping." }
    - { es: "Nous partons demain matin.", en: "We're leaving tomorrow morning." }
  pitfalls:
    - "*Nous finissons*, not *nous finons*."
    - "*Je dors*, not *je dorms*: the m only appears in the plural."
  related: [g.present-er, g.present-re-verbs, g.partir-sortir-dormir]
  drills:
    - { es: "Les cours finissent à midi.", en: "Classes finish at noon." }
    - { es: "Je sors ce soir.", en: "I'm going out tonight." }
    - { es: "Vous dormez bien ?", en: "Do you sleep well?" }
- id: g.adjective-position
  level: a1
  title: "Where adjectives go: usually after the noun"
  summary: "Most adjectives follow the noun (un pull rouge); a small group of short, common ones come before (une petite rue)."
  explanation: |
    ### After the noun (most adjectives)
    Colours, nationalities, shapes, long adjectives and participles: *une voiture **rouge**, un film **français**, une table **ronde**, un homme **intéressant**.*

    ### Before the noun: BAGS
    A short list of very common adjectives goes before. Remember **BAGS**:

    | B — Beauty | A — Age | G — Goodness | S — Size |
    |---|---|---|---|
    | *beau, joli* | *jeune, vieux, nouveau* | *bon, mauvais* | *petit, grand, gros* |

    + *autre, premier, dernier* (*le premier jour*).

    *Une **jolie** robe, un **jeune** homme, un **bon** restaurant, une **grande** maison.*

    ### Plural before an adjective
    *des* → *de* in careful French: *de jolies fleurs* (spoken: often *des jolies fleurs*).
  examples:
    - { es: "Elle a les cheveux longs et les yeux verts.", en: "She has long hair and green eyes." }
    - { es: "C'est un petit appartement.", en: "It's a small flat." }
    - { es: "Paul est un jeune homme sympathique.", en: "Paul is a nice young man." }
    - { es: "Il porte une veste noire.", en: "He's wearing a black jacket." }
  pitfalls:
    - "Colours always follow: *une robe bleue*, never *une bleue robe*."
    - "Some adjectives change meaning with position (*un grand homme* = a great man): you'll see this at C1."
  related: [g.adjective-agreement, g.beau-nouveau-vieux, g.colours, g.adjective-position-meaning]
  drills:
    - { es: "J'ai une nouvelle voiture.", en: "I have a new car." }
    - { es: "C'est un homme intelligent.", en: "He's an intelligent man." }
    - { es: "Ma sœur a un petit chien noir.", en: "My sister has a small black dog." }
- id: g.beau-nouveau-vieux
  level: a1
  title: "Beau, nouveau, vieux: three special adjectives"
  summary: "beau/bel/belle, nouveau/nouvel/nouvelle, vieux/vieil/vieille — a special form before a masculine vowel."
  explanation: |
    | | m. | m. before vowel / h | f. | m. pl. | f. pl. |
    |---|---|---|---|---|---|
    | beautiful | **beau** | **bel** | **belle** | **beaux** | **belles** |
    | new | **nouveau** | **nouvel** | **nouvelle** | **nouveaux** | **nouvelles** |
    | old | **vieux** | **vieil** | **vieille** | **vieux** | **vieilles** |

    *Un **bel** homme, un **nouvel** appartement, un **vieil** ami* — the special form only exists for **masculine singular nouns starting with a vowel or silent h**, for easier pronunciation. It sounds like the feminine.

    ### Other irregular feminines
    *bon → bonne, gentil → gentille, long → longue, blanc → blanche, frais → fraîche, gros → grosse, doux → douce, fou → folle.*
  examples:
    - { es: "C'est un bel homme.", en: "He's a handsome man." }
    - { es: "J'ai un nouvel ordinateur.", en: "I have a new computer." }
    - { es: "Ma grand-mère est une vieille dame très drôle.", en: "My grandmother is a very funny old lady." }
    - { es: "Les nouvelles voisines sont gentilles.", en: "The new neighbours are kind." }
  pitfalls:
    - "Not *un beau homme*: *un bel homme*. But after the verb: *il est beau*."
    - "Plural stays *beaux*: *de beaux hommes* (no *bels*)."
    - "*Neuf* = brand new (just made); *nouveau* = new to you, different."
  related: [g.adjective-position, g.adjective-agreement]
  drills:
    - { es: "Paris est une belle ville.", en: "Paris is a beautiful city." }
    - { es: "C'est un vieil hôtel.", en: "It's an old hotel." }
    - { es: "Il a une nouvelle copine.", en: "He has a new girlfriend." }
- id: g.avoir-expressions
  level: a1
  title: "Expressions with avoir: avoir faim, avoir froid, avoir raison"
  summary: "French says 'have hunger', 'have cold': j'ai faim, j'ai froid, j'ai peur, j'ai vingt ans."
  explanation: |
    Where English uses **be** + adjective, French often uses **avoir** + noun:

    | French | English |
    |---|---|
    | *avoir faim / soif* | to be hungry / thirsty |
    | *avoir chaud / froid* | to be hot / cold (a person) |
    | *avoir sommeil* | to be sleepy |
    | *avoir peur (de)* | to be afraid (of) |
    | *avoir raison / tort* | to be right / wrong |
    | *avoir besoin de* | to need |
    | *avoir envie de* | to feel like |
    | *avoir … ans* | to be … years old |
    | *avoir de la chance* | to be lucky |
    | *avoir l'air* + adj. | to look, seem |

    Intensify with **très** (spoken) or **vraiment**: *J'ai très faim.*

    Weather uses *faire*, people use *avoir*: *Il fait froid* (it's cold out) / *J'ai froid* (I'm cold).
  examples:
    - { es: "J'ai faim ! On mange ?", en: "I'm hungry! Shall we eat?" }
    - { es: "Tu as raison.", en: "You're right." }
    - { es: "Elle a peur des chiens.", en: "She's afraid of dogs." }
    - { es: "Mon fils a dix ans.", en: "My son is ten." }
  pitfalls:
    - "Never *je suis faim* or *je suis vingt ans*: use *avoir*."
    - "*Je suis chaud* means something else (eager, or tipsy); say *j'ai chaud*."
  related: [g.avoir-present, g.weather, g.avoir-mal]
  drills:
    - { es: "Nous avons soif.", en: "We're thirsty." }
    - { es: "J'ai besoin d'un café.", en: "I need a coffee." }
    - { es: "Ils ont froid.", en: "They're cold." }
- id: g.colours
  level: a1
  title: "Colours"
  summary: "Colours follow the noun and agree (une robe verte), except nouns used as colours: orange, marron (invariable)."
  explanation: |
    | colour | m. | f. |
    |---|---|---|
    | white | blanc | blanche |
    | black | noir | noire |
    | red | rouge | rouge |
    | blue | bleu | bleue |
    | green | vert | verte |
    | yellow | jaune | jaune |
    | grey | gris | grise |
    | violet / purple | violet | violette |
    | pink | rose | rose |
    | brown | marron (invariable) | marron |
    | orange | orange (invariable) | orange |

    ### Rules
    - Colours go **after** the noun and agree: *des chaussures noires*.
    - Colours that are nouns (fruit, things) don't agree: *des yeux marron, des pulls orange*. (*Rose* is an exception: *des roses roses*.)
    - Compound colours don't agree: *une robe bleu clair, des yeux vert foncé.*
    - Hair: *brun* (dark), *châtain* (chestnut), *blond, roux* (red), *gris*.
  examples:
    - { es: "J'ai une voiture blanche.", en: "I have a white car." }
    - { es: "Elle a les yeux marron.", en: "She has brown eyes." }
    - { es: "Il porte un pantalon gris et une chemise bleu clair.", en: "He's wearing grey trousers and a light blue shirt." }
  pitfalls:
    - "*Marron* and *orange* never take -e or -s."
    - "Red hair is *roux*, not *rouge*; brown hair is usually *brun* or *châtain*, not *marron*."
  related: [g.adjective-agreement, g.adjective-position]
  drills:
    - { es: "Je cherche une robe rouge.", en: "I'm looking for a red dress." }
    - { es: "Mes chaussures sont noires.", en: "My shoes are black." }
    - { es: "Il a les cheveux roux.", en: "He has red hair." }
- id: g.tres-trop-assez
  level: a1
  title: "Très, trop, assez, un peu: degree"
  summary: "Put these before an adjective or adverb: très grand, trop cher, assez loin, un peu fatigué."
  explanation: |
    | word | meaning | example |
    |---|---|---|
    | **très** | very | *très beau* |
    | **vraiment** | really | *vraiment sympa* |
    | **trop** | too (excessive) | *trop cher* |
    | **assez** | quite / enough | *assez grand* |
    | **un peu** | a little | *un peu timide* |
    | **pas très** | not very | *pas très grand* |
    | **plutôt** | rather | *plutôt calme* |

    ### Trop vs très
    *Très* = very (neutral); *trop* = too, more than you want: *C'est très cher* (a lot) vs *C'est trop cher* (I can't buy it). In young people's speech, *trop* also means "so": *Il est trop mignon !*

    ### With nouns
    *beaucoup de, trop de, assez de, un peu de* + noun (no article): *trop de monde* (see quantities).

    *Très* never goes with *beaucoup*: *beaucoup* alone = very much.
  examples:
    - { es: "Il est très grand et un peu timide.", en: "He's very tall and a little shy." }
    - { es: "Ce pull est trop petit.", en: "This jumper is too small." }
    - { es: "Elle est assez sportive.", en: "She's quite sporty." }
    - { es: "Ton chien est trop mignon !", en: "Your dog is so cute!" }
  pitfalls:
    - "Never *très beaucoup*: say *beaucoup* (*J'aime beaucoup*)."
    - "Don't confuse *trop* (too) and *très* (very) when shopping."
  related: [g.quantities, g.adjective-agreement]
  drills:
    - { es: "C'est vraiment beau.", en: "It's really beautiful." }
    - { es: "Je suis un peu fatigué.", en: "I'm a little tired." }
    - { es: "Ce n'est pas très loin.", en: "It's not very far." }
- id: g.numbers-70-100
  level: a1
  title: "Numbers 70–100: soixante-dix, quatre-vingts"
  summary: "70 = 60 + 10 (soixante-dix), 80 = 4 × 20 (quatre-vingts), 90 = 4 × 20 + 10 (quatre-vingt-dix)."
  explanation: |
    French counts by twenties from 70 to 99:

    | number | French | literally |
    |---|---|---|
    | 70 | *soixante-dix* | sixty-ten |
    | 71 | *soixante et onze* | sixty and eleven |
    | 72 | *soixante-douze* | sixty-twelve |
    | 79 | *soixante-dix-neuf* | sixty-nineteen |
    | 80 | *quatre-vingts* | four twenties |
    | 81 | *quatre-vingt-un* | four-twenty-one |
    | 85 | *quatre-vingt-cinq* | |
    | 90 | *quatre-vingt-dix* | four-twenty-ten |
    | 91 | *quatre-vingt-onze* | |
    | 99 | *quatre-vingt-dix-neuf* | |
    | 100 | *cent* | |

    ### Spelling
    - *Quatre-vingts* takes **-s** only when nothing follows: *quatre-vingts euros*, but *quatre-vingt-deux*.
    - *Soixante **et** onze* has *et*; *quatre-vingt-un* and *quatre-vingt-onze* do not.
  examples:
    - { es: "Ça fait soixante-quinze euros.", en: "That comes to seventy-five euros." }
    - { es: "Ma grand-mère a quatre-vingts ans.", en: "My grandmother is eighty." }
    - { es: "J'habite au quatre-vingt-dix-sept, rue Mouffetard.", en: "I live at 97 rue Mouffetard." }
  pitfalls:
    - "*Quatre-vingts* has an -s alone, but *quatre-vingt-trois* has none."
    - "Listen to the end: *soixante-seize* is 76, not 66."
  variant: "In Belgium and Switzerland 70 is *septante* and 90 *nonante*; in parts of Switzerland (Vaud, Valais, Fribourg) 80 is *huitante*. Belgians say *quatre-vingts*. Québec uses the France forms."
  related: [g.numbers-0-69, g.numbers-100-plus, g.regional-numbers]
  drills:
    - { es: "Il y a soixante-dix personnes.", en: "There are seventy people." }
    - { es: "Ça coûte quatre-vingt-dix euros.", en: "It costs ninety euros." }
    - { es: "Mon père a quatre-vingt-un ans.", en: "My father is eighty-one." }
- id: g.numbers-100-plus
  level: a1
  title: "Numbers from 100: cent, mille, un million"
  summary: "cent, deux cents, deux cent cinq, mille (never un mille, never -s), un million de…"
  explanation: |
    | number | French |
    |---|---|
    | 100 | *cent* (not *un cent*) |
    | 101 | *cent un* |
    | 200 | *deux cents* |
    | 250 | *deux cent cinquante* |
    | 1 000 | *mille* (not *un mille*) |
    | 2 000 | *deux mille* (never *milles*) |
    | 1 500 | *mille cinq cents* (or *quinze cents*) |
    | 1 000 000 | *un million* |
    | 2 000 000 000 | *deux milliards* |

    ### Spelling rules
    - *Cent* takes **-s** when multiplied and nothing follows: *trois cents*, but *trois cent dix*.
    - *Mille* never takes -s.
    - *Million, milliard* are nouns: *un million **d'**habitants*.

    ### Writing numbers
    French uses a space (or a dot) for thousands and a **comma** for decimals: *2 500,50 €* = two thousand five hundred euros fifty. Prices: *3,50 €* = *trois euros cinquante*.

    Years: *en 1789* (*mille sept cent quatre-vingt-neuf* or *dix-sept cent quatre-vingt-neuf*), *en 2026* (*deux mille vingt-six*).
  examples:
    - { es: "Le loyer est de mille deux cents euros.", en: "The rent is one thousand two hundred euros." }
    - { es: "Paris a plus de deux millions d'habitants.", en: "Paris has over two million inhabitants." }
    - { es: "La tour Eiffel date de mille huit cent quatre-vingt-neuf.", en: "The Eiffel Tower dates from 1889." }
    - { es: "Ça fait trois euros cinquante.", en: "That's three euros fifty." }
  pitfalls:
    - "Not *un cent* or *un mille*: just *cent*, *mille*."
    - "Decimal comma: *1,5* = one point five; *1.500* (or *1 500*) = fifteen hundred."
    - "*Un million de*: *un million d'euros*."
  related: [g.numbers-70-100, g.days-months-dates]
  drills:
    - { es: "Ce manteau coûte deux cents euros.", en: "This coat costs two hundred euros." }
    - { es: "Il y a mille personnes.", en: "There are a thousand people." }
    - { es: "Ça fait douze euros quatre-vingts.", en: "That comes to twelve euros eighty." }
- id: g.demonstratives
  level: a1
  title: "Demonstratives: ce, cet, cette, ces"
  summary: "this/that: ce livre, cet homme, cette robe, ces chaussures. Add -ci / -là to contrast."
  explanation: |
    | | singular | plural |
    |---|---|---|
    | masculine | **ce** pull | **ces** pulls |
    | masculine before vowel / silent h | **cet** ami, **cet** hôtel | **ces** amis |
    | feminine | **cette** robe | **ces** robes |

    French doesn't distinguish "this" and "that": *ce pull* = this jumper or that jumper.

    ### -ci and -là
    To contrast, add **-ci** (here, this) or **-là** (there, that) to the noun:
    *Je préfère cette robe-**ci**, pas cette robe-**là**.*

    In speech, *-là* is often used alone, without contrast: *Ce jour-là, il pleuvait.* (that day)

    ### Time expressions
    *ce matin* (this morning), *cet après-midi, ce soir* (tonight), *cette semaine, cette année*.
  examples:
    - { es: "Combien coûte ce pull ?", en: "How much is this jumper?" }
    - { es: "Cet hôtel est très cher.", en: "This hotel is very expensive." }
    - { es: "J'aime bien cette couleur.", en: "I really like this colour." }
    - { es: "Ces chaussures-ci ou ces chaussures-là ?", en: "These shoes or those shoes?" }
  pitfalls:
    - "*Cet* only before masculine nouns with a vowel sound: *cet arbre, cet homme* (but *ce héros* with aspirated h)."
    - "*Cette* and *cet* sound the same [sɛt]."
    - "*Ces* (these) vs *ses* (his/her): same sound, different meaning."
  related: [g.demonstrative-pronouns]
  drills:
    - { es: "Je prends ce fromage.", en: "I'll take this cheese." }
    - { es: "Ce soir, on va au cinéma.", en: "Tonight we're going to the cinema." }
    - { es: "Ces pommes sont délicieuses.", en: "These apples are delicious." }
- id: g.stem-changing-er
  level: a1
  title: "Spelling-change -er verbs: acheter, préférer, appeler, payer"
  summary: "Some -er verbs change the stem in je, tu, il, ils: j'achète, je préfère, j'appelle, je paie."
  explanation: |
    The endings are regular; the **stem** changes when the ending is silent (je, tu, il, ils), but not with *nous* and *vous*.

    | type | verb | je / tu / il / ils | nous / vous |
    |---|---|---|---|
    | e → è | *acheter* (buy) | j'ach**è**te, ils ach**è**tent | nous ach**e**tons |
    | é → è | *préférer* (prefer) | je préf**è**re | nous préf**é**rons |
    | l → ll | *appeler* (call) | j'appe**ll**e | nous appe**l**ons |
    | t → tt | *jeter* (throw) | je je**tt**e | nous je**t**ons |
    | y → i | *payer, essayer, envoyer* | je pa**i**e, j'essa**i**e | nous pa**y**ons |

    Like *acheter*: *se lever, emmener, promener*. Like *préférer*: *espérer, répéter, compléter*.

    ### Why?
    French doesn't like two weak [ə] syllables in a row; the accent or double consonant makes the vowel open [ɛ]: *achète* [a.ʃɛt].
  examples:
    - { es: "J'achète des fruits au marché.", en: "I buy fruit at the market." }
    - { es: "Nous achetons du pain.", en: "We're buying bread." }
    - { es: "Tu paies par carte ?", en: "Are you paying by card?" }
    - { es: "Ils préfèrent payer en espèces.", en: "They prefer to pay cash." }
  pitfalls:
    - "*J'achète* with è, but *nous achetons* without."
    - "*Payer* allows both *je paie* and *je paye*; *envoyer* only *j'envoie*."
  related: [g.present-er, g.aimer-preferer, g.s-appeler]
  drills:
    - { es: "Elle achète une robe.", en: "She's buying a dress." }
    - { es: "J'essaie ce pantalon.", en: "I'm trying on these trousers." }
    - { es: "Vous préférez le rouge ou le bleu ?", en: "Do you prefer the red or the blue?" }
- id: g.quantities
  level: a1
  title: "Quantities: un kilo de, beaucoup de, un peu de"
  summary: "After a quantity, use de/d' with no article: un kilo de tomates, beaucoup d'amis, une bouteille de vin."
  explanation: |
    ### Expressions of quantity + de
    | quantity | example |
    |---|---|
    | *beaucoup de* (a lot of) | *beaucoup de monde* |
    | *un peu de* (a little) | *un peu de sucre* |
    | *peu de* (not much) | *peu de temps* |
    | *trop de* (too much) | *trop de travail* |
    | *assez de* (enough) | *assez d'argent* |
    | *combien de* (how much/many) | *combien de pommes ?* |

    ### Containers and measures
    *un kilo de, une livre de* (half a kilo), *cent grammes de, un litre de, une bouteille de, un paquet de, une boîte de, une tranche de* (slice), *un morceau de* (piece), *une douzaine d'œufs*.

    **No article** after *de* here: *un kilo **de** pommes* (not *des pommes*).

    ### Exception
    *La plupart des* (most), *bien des*: *la plupart des gens*.
  examples:
    - { es: "Un kilo de tomates, s'il vous plaît.", en: "A kilo of tomatoes, please." }
    - { es: "Il y a beaucoup de monde au marché.", en: "There are a lot of people at the market." }
    - { es: "Je voudrais quatre tranches de jambon.", en: "I'd like four slices of ham." }
    - { es: "Tu as assez d'argent ?", en: "Do you have enough money?" }
  pitfalls:
    - "Not *beaucoup des gens*: *beaucoup de gens*."
    - "*Une livre* (f) is a pound (500 g); *un livre* (m) is a book."
  related: [g.partitive-articles, g.pronoun-en, g.tres-trop-assez]
  drills:
    - { es: "Je prends une bouteille d'eau.", en: "I'll take a bottle of water." }
    - { es: "Elle a beaucoup d'amis.", en: "She has a lot of friends." }
    - { es: "Un peu de sucre ?", en: "A little sugar?" }
- id: g.aller-present
  level: a1
  title: "The verb aller (to go)"
  summary: "je vais, tu vas, il va, nous allons, vous allez, ils vont: completely irregular."
  explanation: |
    | | aller |
    |---|---|
    | je | **vais** |
    | tu | **vas** |
    | il / elle / on | **va** |
    | nous | **allons** |
    | vous | **allez** |
    | ils / elles | **vont** |

    ### Uses
    - **Going somewhere**: *Je vais à Paris. On va au musée.* (+ *à*, which contracts: *au, aux*)
    - **Health**: *Comment allez-vous ? Ça va ? Je vais bien.*
    - **Near future**: *Je vais manger.* (see futur proche)
    - **Suiting**: *Cette robe te va bien.* (This dress suits you.)

    ### Going by
    *aller à pied* (on foot), *aller en métro / en bus / en voiture / en train*, *aller à vélo*.

    ### Where to
    *Où vas-tu ? / Tu vas où ?* — *Je vais **à la** boulangerie, **au** cinéma, **chez** Paul.*
    *On y va !* — Let's go!
  examples:
    - { es: "Je vais au Louvre cet après-midi.", en: "I'm going to the Louvre this afternoon." }
    - { es: "Comment vas-tu ?", en: "How are you?" }
    - { es: "Nous allons à la gare à pied.", en: "We're walking to the station." }
    - { es: "Ils vont chez leurs grands-parents.", en: "They're going to their grandparents'." }
  pitfalls:
    - "*Je vais* never *je allons* or *j'aille*."
    - "*Aller* always needs a destination: *je vais au parc* (or *j'y vais*); *je vais* alone is incomplete."
    - "Use *chez* for people: *je vais chez le médecin*, not *au médecin*."
  related: [g.contractions-au-du, g.futur-proche, g.prepositions-transport, g.pronoun-y]
  drills:
    - { es: "Tu vas où ?", en: "Where are you going?" }
    - { es: "Elle va au travail en métro.", en: "She goes to work by metro." }
    - { es: "On y va ?", en: "Shall we go?" }
- id: g.contractions-au-du
  level: a1
  title: "Contractions: au, aux, du, des"
  summary: "à + le = au, à + les = aux, de + le = du, de + les = des. La and l' never contract."
  explanation: |
    | | + le | + la | + l' | + les |
    |---|---|---|---|---|
    | **à** | **au** | à la | à l' | **aux** |
    | **de** | **du** | de la | de l' | **des** |

    ### Examples
    - *Je vais **au** cinéma* (à + le cinéma), *à la piscine, à l'hôpital, **aux** Tuileries.*
    - *Je viens **du** marché* (de + le marché), *de la gare, de l'école, **des** États-Unis.*
    - *Le café est à côté **du** musée. Le prix **des** billets.*

    ### Watch out
    - *Du* and *des* can be articles (some) or contractions (of the, from the): *Je mange du pain* (some bread) vs *Je reviens du marché* (from the market).
    - Proper names with *Le*: *Le Havre → au Havre, du Havre*; *Le Mans → au Mans*.
  examples:
    - { es: "On va au musée d'Orsay ?", en: "Shall we go to the Musée d'Orsay?" }
    - { es: "Elle parle aux enfants.", en: "She's talking to the children." }
    - { es: "Il revient du travail à sept heures.", en: "He comes back from work at seven." }
    - { es: "J'habite près des Champs-Élysées.", en: "I live near the Champs-Élysées." }
  pitfalls:
    - "Never *à le* or *de le*: always *au* and *du*."
    - "*À la* and *de la* don't contract: *à la gare, de la gare*."
    - "Before a vowel: *à l'hôtel*, not *au hôtel*."
  related: [g.aller-present, g.prepositions-place, g.articles-definite, g.jouer-faire-de]
  drills:
    - { es: "Je vais au marché.", en: "I'm going to the market." }
    - { es: "C'est le livre du professeur.", en: "It's the teacher's book." }
    - { es: "Nous allons aux Galeries Lafayette.", en: "We're going to the Galeries Lafayette." }
- id: g.faire-present
  level: a1
  title: "The verb faire (to do, to make)"
  summary: "je fais, tu fais, il fait, nous faisons, vous faites, ils font: activities, chores, weather."
  explanation: |
    | | faire |
    |---|---|
    | je | **fais** |
    | tu | **fais** |
    | il / elle / on | **fait** |
    | nous | **faisons** [fə.zɔ̃] |
    | vous | **faites** |
    | ils / elles | **font** |

    ### Common expressions
    | French | English |
    |---|---|
    | *faire du sport, du vélo, de la natation* | to do sport, cycle, swim |
    | *faire les courses* | to do the shopping |
    | *faire la cuisine* | to cook |
    | *faire le ménage* | to do the housework |
    | *faire une promenade / un tour* | to go for a walk / a wander |
    | *faire la queue* | to queue |
    | *faire la fête* | to party |
    | *Il fait beau / froid.* | The weather is nice / cold. |

    *Qu'est-ce que tu fais ?* = What are you doing? / What do you do (for a living)?
  examples:
    - { es: "Qu'est-ce que tu fais ce week-end ?", en: "What are you doing this weekend?" }
    - { es: "Je fais les courses le samedi.", en: "I do the shopping on Saturdays." }
    - { es: "Vous faites quoi dans la vie ?", en: "What do you do for a living?" }
    - { es: "Ils font la queue devant le Louvre.", en: "They're queuing in front of the Louvre." }
  pitfalls:
    - "*Vous faites*, never *vous faisez*."
    - "*Nous faisons* is pronounced [fəzɔ̃], like 'fuh-zon'."
  related: [g.jouer-faire-de, g.weather, g.aller-present]
  drills:
    - { es: "Je fais une promenade.", en: "I'm going for a walk." }
    - { es: "Nous faisons la cuisine ensemble.", en: "We cook together." }
    - { es: "Qu'est-ce qu'ils font ?", en: "What are they doing?" }
- id: g.futur-proche
  level: a1
  title: "The near future: aller + infinitive"
  summary: "je vais manger, on va visiter — 'going to' for plans and the near future."
  explanation: |
    | aller | + infinitive |
    |---|---|
    | je vais | visiter le Louvre |
    | tu vas | manger ici ? |
    | il / elle / on va | pleuvoir |
    | nous allons | partir |
    | vous allez | aimer Paris |
    | ils / elles vont | arriver |

    Use it for plans and things about to happen: *Ce soir, je vais voir un film. Attention, tu vas tomber !*

    In conversation it is far more common than the futur simple (A2).

    ### Negative
    *ne … pas* goes around *aller*: *Je **ne** vais **pas** sortir.*

    ### With pronouns
    The pronoun goes before the infinitive: *Je vais **le** faire. On va **se** promener.*

    Time words: *ce soir, demain, ce week-end, la semaine prochaine, bientôt, dans deux jours*.
  examples:
    - { es: "Demain, on va visiter Notre-Dame.", en: "Tomorrow we're going to visit Notre-Dame." }
    - { es: "Je vais prendre un taxi.", en: "I'm going to take a taxi." }
    - { es: "Il va pleuvoir.", en: "It's going to rain." }
    - { es: "Nous n'allons pas rester longtemps.", en: "We're not going to stay long." }
  pitfalls:
    - "No preposition between *aller* and the infinitive: *je vais manger*, not *je vais à manger*."
    - "The negative wraps *aller*, not the infinitive: *je ne vais pas venir*."
  related: [g.aller-present, g.futur-simple-forms, g.venir-de]
  drills:
    - { es: "Je vais acheter du pain.", en: "I'm going to buy some bread." }
    - { es: "Vous allez aimer ce quartier.", en: "You're going to love this neighbourhood." }
    - { es: "Ils vont partir à huit heures.", en: "They're going to leave at eight." }
- id: g.on-nous
  level: a1
  title: "On: we, people, one"
  summary: "In speech on usually means 'we' (on va au cinéma); it also means 'people in general' (en France, on mange tard). Always a third-person verb."
  explanation: |
    *On* takes the **il / elle** form of the verb, whatever it means.

    | meaning | example |
    |---|---|
    | **we** (spoken, very common) | *On va au cinéma ce soir ?* = *Nous allons…* |
    | **people, they, you** in general | *En France, on dîne vers vingt heures.* |
    | **someone** | *On sonne à la porte.* (Someone's ringing.) |

    ### On = nous
    In everyday French, *on* has largely replaced *nous* as a subject. You will often hear *Nous, on…* for emphasis: *Nous, on habite à Montmartre.*

    Adjectives after *on* meaning "we" usually agree in the plural: *On est contents.*

    ### Spelling
    *L'on* sometimes appears in writing after *et, où, si, que* for sound (formal).
  examples:
    - { es: "On va au Louvre ?", en: "Shall we go to the Louvre?" }
    - { es: "Nous, on mange à huit heures.", en: "We eat at eight." }
    - { es: "Ici, on parle français.", en: "French is spoken here." }
    - { es: "On est fatigués.", en: "We're tired." }
  pitfalls:
    - "*On va*, never *on allons*: the verb is always third person singular."
    - "*On* is never an object: for 'us' use *nous* (*Il nous invite*)."
    - "In formal writing prefer *nous*."
  related: [g.subject-pronouns, g.on-instead-of-passive, g.register-levels]
  drills:
    - { es: "On prend un café ?", en: "Shall we have a coffee?" }
    - { es: "En France, on fait la bise.", en: "In France, people kiss on the cheek." }
    - { es: "On a faim !", en: "We're hungry!" }
- id: g.weather
  level: a1
  title: "The weather: il fait beau, il pleut"
  summary: "Il fait + adjective (il fait chaud), il y a + noun (il y a du vent), and weather verbs (il pleut, il neige)."
  explanation: |
    | structure | examples |
    |---|---|
    | **il fait** + adjective | *il fait beau* (nice), *il fait mauvais* (bad), *il fait chaud / froid / doux / frais*, *il fait 20 degrés* |
    | **il y a** + noun | *il y a du soleil, du vent, des nuages, du brouillard, de l'orage* |
    | weather verbs | *il pleut* (it's raining), *il neige* (snowing), *il gèle* (freezing) |
    | **le temps est** + adj. | *le temps est nuageux, ensoleillé, pluvieux* |

    *Quel temps fait-il ?* / *Il fait quel temps ?* — What's the weather like?

    Future: *Il va pleuvoir. Il va faire beau.*

    ### Il fait froid vs j'ai froid
    *Il fait froid* = the weather is cold. *J'ai froid* = I feel cold.
  examples:
    - { es: "Aujourd'hui, il fait beau à Paris.", en: "Today the weather is nice in Paris." }
    - { es: "Il pleut, prends ton parapluie !", en: "It's raining, take your umbrella!" }
    - { es: "Il y a du vent sur la Seine.", en: "It's windy on the Seine." }
    - { es: "En hiver, il fait froid et il neige parfois.", en: "In winter it's cold and it sometimes snows." }
  pitfalls:
    - "Not *il est chaud* for the weather: *il fait chaud*."
    - "Not *c'est pleut*: *il pleut*."
  variant: "In Québec *il fait frette* means 'it's freezing cold' in casual speech."
  related: [g.faire-present, g.il-y-a, g.avoir-expressions]
  drills:
    - { es: "Il fait vingt-cinq degrés.", en: "It's twenty-five degrees." }
    - { es: "Il y a des nuages.", en: "It's cloudy." }
    - { es: "Il va neiger demain.", en: "It's going to snow tomorrow." }
- id: g.modal-verbs
  level: a1
  title: "Pouvoir, vouloir, devoir + infinitive"
  summary: "can, want, must: je peux venir, je veux partir, je dois travailler."
  explanation: |
    | | pouvoir (can) | vouloir (want) | devoir (must) |
    |---|---|---|---|
    | je | **peux** | **veux** | **dois** |
    | tu | **peux** | **veux** | **dois** |
    | il / elle / on | **peut** | **veut** | **doit** |
    | nous | **pouvons** | **voulons** | **devons** |
    | vous | **pouvez** | **voulez** | **devez** |
    | ils / elles | **peuvent** | **veulent** | **doivent** |

    All three are followed directly by an **infinitive**, with no preposition:
    - *Je peux t'aider.* — I can help you.
    - *Tu veux venir ?* — Do you want to come?
    - *Nous devons partir.* — We must leave.

    ### Polite requests
    *Tu peux… ? / Vous pouvez… ?* (Can you…?) — *Vous pouvez répéter, s'il vous plaît ?*
    *Je peux… ?* (May I…?) — *Je peux entrer ?*

    ### Wanting things
    *Vouloir* + noun: *Tu veux un café ?* For polite orders use *je voudrais*.
  examples:
    - { es: "Tu veux venir au cinéma ?", en: "Do you want to come to the cinema?" }
    - { es: "Désolé, je ne peux pas, je dois travailler.", en: "Sorry, I can't, I have to work." }
    - { es: "Vous pouvez parler plus lentement ?", en: "Can you speak more slowly?" }
    - { es: "Ils veulent jouer au foot.", en: "They want to play football." }
  pitfalls:
    - "No *à* or *de* after these verbs: *je veux partir*, not *je veux de partir*."
    - "'Can' meaning 'know how to' is *savoir*: *Je sais nager* (I can swim)."
  related: [g.je-voudrais, g.il-faut, g.savoir-connaitre, g.devoir-nuances]
  drills:
    - { es: "Je peux payer par carte ?", en: "Can I pay by card?" }
    - { es: "Elle veut visiter Montmartre.", en: "She wants to visit Montmartre." }
    - { es: "Vous devez réserver.", en: "You must book." }
- id: g.jouer-faire-de
  level: a1
  title: "Jouer à, jouer de, faire de: sports, games and music"
  summary: "jouer au tennis (games and sports), jouer du piano (instruments), faire du vélo (activities)."
  explanation: |
    | structure | use | examples |
    |---|---|---|
    | **jouer à** + le/la/les | games and team / ball sports | *jouer **au** foot, **au** tennis, **aux** cartes, **à la** pétanque* |
    | **jouer de** + le/la/les | musical instruments | *jouer **du** piano, **de la** guitare, **du** violon* |
    | **faire de** + le/la/les | activities, sports in general | *faire **du** vélo, **de la** danse, **du** yoga, **de la** natation, **du** ski* |

    Remember the contractions: *à + le = au, de + le = du.*

    ### Negative
    *Je ne fais pas **de** sport. Je ne joue pas **de** piano* (or *du piano*, both heard).

    ### Questions
    *Tu fais du sport ? Tu joues d'un instrument ?*
  examples:
    - { es: "Le dimanche, je joue au foot.", en: "On Sundays I play football." }
    - { es: "Elle joue du violon.", en: "She plays the violin." }
    - { es: "Nous faisons du vélo le long de la Seine.", en: "We cycle along the Seine." }
    - { es: "Tu joues d'un instrument ?", en: "Do you play an instrument?" }
  pitfalls:
    - "*Jouer au piano* is wrong: instruments take *de* — *jouer du piano*."
    - "Many sports use *faire*, not *jouer*: *faire du ski, faire de la natation*."
  variant: "In Québec *jouer au hockey* is the national pastime and *faire du vélo* is often *faire de la bicyclette* or *faire du bécyk* (casual)."
  related: [g.contractions-au-du, g.faire-present]
  drills:
    - { es: "Ils jouent aux cartes.", en: "They're playing cards." }
    - { es: "Je fais de la natation.", en: "I swim." }
    - { es: "Mon frère joue de la guitare.", en: "My brother plays the guitar." }
- id: g.venir-present
  level: a1
  title: "The verb venir (to come)"
  summary: "je viens, tu viens, il vient, nous venons, vous venez, ils viennent. Venir de = to come from."
  explanation: |
    | | venir |
    |---|---|
    | je | **viens** |
    | tu | **viens** |
    | il / elle / on | **vient** |
    | nous | **venons** |
    | vous | **venez** |
    | ils / elles | **viennent** |

    Like *venir*: *revenir* (come back), *devenir* (become), *tenir* (hold), *obtenir*.

    ### Uses
    - **Coming**: *Tu viens avec nous ?* (Are you coming with us?)
    - **Origin**: *Je viens **de** Lyon. Elle vient **du** Canada. Ils viennent **des** États-Unis.*
    - **Recent past**: *Je viens de manger.* (I've just eaten) — see *venir de*.

    *Tu viens ?* — the classic invitation: "Are you coming?"
  examples:
    - { es: "Tu viens au concert ce soir ?", en: "Are you coming to the concert tonight?" }
    - { es: "Je viens de Montréal.", en: "I come from Montreal." }
    - { es: "Ils viennent du Japon.", en: "They come from Japan." }
    - { es: "Vous venez souvent ici ?", en: "Do you come here often?" }
  pitfalls:
    - "*Ils viennent* has a double n; *nous venons* has a single n."
    - "Countries: *de France* (feminine, no article), *du Canada, des États-Unis*."
  related: [g.venir-de, g.prepositions-cities-countries, g.aller-present]
  drills:
    - { es: "D'où viens-tu ?", en: "Where are you from?" }
    - { es: "Elle vient avec nous.", en: "She's coming with us." }
    - { es: "Nous venons d'Italie.", en: "We come from Italy." }
- id: g.prendre-present
  level: a1
  title: "The verb prendre (to take): prendre, apprendre, comprendre"
  summary: "je prends, tu prends, il prend, nous prenons, vous prenez, ils prennent."
  explanation: |
    | | prendre |
    |---|---|
    | je | **prends** |
    | tu | **prends** |
    | il / elle / on | **prend** |
    | nous | **prenons** |
    | vous | **prenez** |
    | ils / elles | **prennent** |

    Same pattern: *apprendre* (learn), *comprendre* (understand), *surprendre*.

    ### Uses of prendre
    - transport: *prendre le métro, le bus, un taxi*
    - food and drink: *Je prends un café. Qu'est-ce que vous prenez ?*
    - time: *Ça prend une heure.*
    - *prendre une photo, prendre une douche, prendre rendez-vous*

    *Apprendre à* + infinitive: *J'apprends à nager.* *Je ne comprends pas.* (I don't understand.)
  examples:
    - { es: "Je prends la ligne 4 jusqu'à Châtelet.", en: "I take line 4 to Châtelet." }
    - { es: "Qu'est-ce que vous prenez ?", en: "What are you having?" }
    - { es: "Ils apprennent le français.", en: "They're learning French." }
    - { es: "Pardon, je ne comprends pas.", en: "Sorry, I don't understand." }
  pitfalls:
    - "*Ils prennent* with nn; *nous prenons* with one n."
    - "*Prendre une décision* = to make a decision (not *faire*)."
  related: [g.prepositions-transport, g.present-re-verbs]
  drills:
    - { es: "Tu prends le bus ?", en: "Are you taking the bus?" }
    - { es: "Nous prenons un taxi.", en: "We're taking a taxi." }
    - { es: "Vous comprenez ?", en: "Do you understand?" }
- id: g.prepositions-transport
  level: a1
  title: "Getting around: en métro, à pied, à vélo"
  summary: "en + vehicles you get inside (en métro, en voiture); à + things you sit on or your feet (à pied, à vélo)."
  explanation: |
    | **en** (inside) | **à** (on top / on foot) |
    |---|---|
    | *en métro, en bus, en train, en voiture, en taxi, en avion, en bateau, en tram* | *à pied, à vélo, à moto, à cheval, à trottinette* |

    In speech you'll also hear *en vélo*; *à vélo* is the standard form.

    ### With prendre
    With a specific vehicle, use *prendre* + article: *Je prends **le** métro. On prend **un** taxi.*

    ### Movement words
    *monter dans* (get on), *descendre de* (get off), *changer à* (change at), *la station* (metro stop), *l'arrêt* (bus stop), *la gare* (train station), *le quai* (platform), *la ligne* (line), *la correspondance* (connection), *un ticket / un passe Navigo*.
  examples:
    - { es: "Je vais au travail à vélo.", en: "I cycle to work." }
    - { es: "On va à Versailles en train.", en: "We're going to Versailles by train." }
    - { es: "Descendez à la station Concorde.", en: "Get off at Concorde station." }
    - { es: "Il faut changer à Châtelet.", en: "You have to change at Châtelet." }
  pitfalls:
    - "*À pied*, never *en pied*."
    - "Don't say *par métro* for everyday trips: *en métro*."
  variant: "In Québec *en char* (car) is casual, *en autobus* and *le métro* are standard; *à bicyclette* / *en vélo* both common."
  related: [g.prendre-present, g.aller-present, g.directions]
  drills:
    - { es: "Elle va à l'école à pied.", en: "She walks to school." }
    - { es: "Nous prenons le bus.", en: "We take the bus." }
    - { es: "Tu viens en voiture ?", en: "Are you coming by car?" }
- id: g.prepositions-cities-countries
  level: a1
  title: "À Paris, en France, au Canada: cities and countries"
  summary: "à + city; en + feminine country (most end in -e); au + masculine country; aux + plural."
  explanation: |
    | place | to / in | from | examples |
    |---|---|---|---|
    | city | **à** | **de** | *à Paris, de Lyon* |
    | feminine country (most ending in -e) | **en** | **de / d'** | *en France, en Espagne, d'Italie* |
    | masculine country | **au** | **du** | *au Canada, au Japon, au Maroc, du Portugal* |
    | country starting with a vowel | **en** | **d'** | *en Iran, en Israël* |
    | plural country | **aux** | **des** | *aux États-Unis, aux Pays-Bas* |

    ### Gender of countries
    Countries ending in **-e** are feminine (*la France, la Belgique, la Suisse*), except *le Mexique, le Cambodge, le Mozambique*. The others are masculine (*le Canada, le Brésil, le Sénégal*).

    Continents are feminine: *en Europe, en Afrique, en Amérique du Nord.*
    Regions mostly follow the same rule: *en Normandie, en Bretagne, en Provence.*
  examples:
    - { es: "J'habite à Paris, en France.", en: "I live in Paris, in France." }
    - { es: "Ma sœur travaille au Canada.", en: "My sister works in Canada." }
    - { es: "Ils partent aux États-Unis.", en: "They're leaving for the United States." }
    - { es: "Elle vient du Sénégal.", en: "She comes from Senegal." }
  pitfalls:
    - "*Au Mexique* (masculine despite the -e)."
    - "*En* replaces *au* before vowels: *en Irak*, not *au Irak*."
    - "Cities have no article except a few: *au Caire, au Havre, à La Rochelle*."
  related: [g.venir-present, g.contractions-au-du, g.pronoun-y]
  drills:
    - { es: "Nous allons en Italie cet été.", en: "We're going to Italy this summer." }
    - { es: "Il habite au Japon.", en: "He lives in Japan." }
    - { es: "Je viens de Belgique.", en: "I come from Belgium." }
- id: g.directions
  level: a1
  title: "Asking and giving directions: tournez à gauche"
  summary: "Pour aller à… ? — Prenez la deuxième rue à droite, continuez tout droit, c'est en face. Ordinals: premier, deuxième."
  explanation: |
    ### Asking
    - *Excusez-moi, pour aller à la gare, s'il vous plaît ?*
    - *Où est le métro le plus proche ?*
    - *C'est loin d'ici ? C'est à combien de minutes à pied ?*

    ### Giving directions (vous forms)
    | phrase | meaning |
    |---|---|
    | *Allez / continuez tout droit.* | Go / carry on straight ahead. |
    | *Tournez à gauche / à droite.* | Turn left / right. |
    | *Prenez la première rue à gauche.* | Take the first street on the left. |
    | *Traversez le pont / la place.* | Cross the bridge / the square. |
    | *C'est au bout de la rue.* | It's at the end of the street. |
    | *C'est au coin.* | It's on the corner. |

    These *vous* forms are imperatives; you'll study the imperative fully at A2. With *tu*: *Tourne à gauche, prends la deuxième rue.*

    ### Ordinal numbers
    Add **-ième**: *deux → deuxième, trois → troisième, cinq → cinquième, neuf → neuvième*. But *un → **premier / première***. Paris districts: *le 5e (cinquième) arrondissement*; written *1er, 2e, 3e*.
  examples:
    - { es: "Pour aller à la tour Eiffel, s'il vous plaît ?", en: "How do I get to the Eiffel Tower, please?" }
    - { es: "Prenez la deuxième rue à droite.", en: "Take the second street on the right." }
    - { es: "Continuez tout droit, c'est en face de la banque.", en: "Carry on straight ahead, it's opposite the bank." }
    - { es: "J'habite dans le dix-huitième arrondissement.", en: "I live in the 18th arrondissement." }
  pitfalls:
    - "*Tout droit* (straight on) vs *à droite* (on the right): they sound similar, listen carefully."
    - "*Premier*, not *unième*; but *vingt et unième* (21st)."
  related: [g.prepositions-place, g.prepositions-transport, g.imperative]
  drills:
    - { es: "Tournez à gauche après le pont.", en: "Turn left after the bridge." }
    - { es: "C'est la troisième rue à droite.", en: "It's the third street on the right." }
    - { es: "Excusez-moi, où est la station de métro ?", en: "Excuse me, where is the metro station?" }
- id: g.inversion-questions
  level: a1
  title: "Inversion questions: Parlez-vous anglais ?"
  summary: "Swap the pronoun and verb with a hyphen for formal questions: Avez-vous… ? Où habitez-vous ? Add -t- between vowels: Parle-t-il… ?"
  explanation: |
    Inversion is the **formal** way to ask, common in writing, in polite set phrases and with *vous*:

    | statement | inversion |
    |---|---|
    | *Vous parlez anglais.* | *Parlez-vous anglais ?* |
    | *Tu es prêt.* | *Es-tu prêt ?* |
    | *Vous habitez où ?* | *Où habitez-vous ?* |

    ### The -t-
    If the verb ends in a vowel and the pronoun is *il, elle, on*, add **-t-** for the sound:
    *Parle-t-il français ? A-t-elle un billet ? Où va-t-on ?*

    ### Set phrases you'll hear everywhere
    *Comment allez-vous ? Quelle heure est-il ? Comment vous appelez-vous ? Pouvez-vous m'aider ? Y a-t-il un ascenseur ?*

    ### With a noun subject
    The noun stays first and a pronoun is added: *Paul est-il là ?* (formal). In speech: *Paul est là ?*

    Avoid inversion with *je* except in fixed forms (*puis-je… ?*).
  examples:
    - { es: "Parlez-vous anglais ?", en: "Do you speak English?" }
    - { es: "Où se trouve la station Opéra ?", en: "Where is Opéra station?" }
    - { es: "Pouvez-vous m'aider, s'il vous plaît ?", en: "Can you help me, please?" }
    - { es: "Quelle heure est-il ?", en: "What time is it?" }
  pitfalls:
    - "Don't forget the hyphen: *parlez-vous*."
    - "*Parle-t-il*, not *parle-il*."
    - "In everyday speech inversion can sound stiff; *Vous parlez anglais ?* is fine."
  related: [g.yes-no-questions, g.question-words, g.formal-inversion]
  drills:
    - { es: "Avez-vous une chambre ?", en: "Do you have a room?" }
    - { es: "Où habite-t-elle ?", en: "Where does she live?" }
    - { es: "Comment allez-vous ?", en: "How are you?" }
- id: g.present-re-verbs
  level: a1
  title: "Present of -re verbs: attendre, vendre, répondre"
  summary: "Drop -re and add -s, -s, -, -ons, -ez, -ent: j'attends, il attend, nous attendons."
  explanation: |
    | | attendre (wait) | vendre (sell) |
    |---|---|---|
    | je / j' | attend**s** | vend**s** |
    | tu | attend**s** | vend**s** |
    | il / elle / on | attend | vend |
    | nous | attend**ons** | vend**ons** |
    | vous | attend**ez** | vend**ez** |
    | ils / elles | attend**ent** | vend**ent** |

    The *il* form has **no ending**: *il attend, elle vend, on répond*.

    Like this: *entendre* (hear), *descendre* (go down, get off), *perdre* (lose), *rendre* (give back), *répondre (à)* (answer).

    ### Irregular -re verbs you already know or will meet
    *prendre, faire, être, dire* (je dis, vous dites), *lire* (je lis), *écrire* (j'écris), *boire* (je bois), *mettre* (je mets): learn them separately.

    ### Sound
    The d is silent in the singular (*il attend* [a.tɑ̃]) and heard in the plural (*ils attendent* [a.tɑ̃d]).
  examples:
    - { es: "J'attends le bus.", en: "I'm waiting for the bus." }
    - { es: "Il vend des fleurs au marché.", en: "He sells flowers at the market." }
    - { es: "Nous descendons à la prochaine station.", en: "We're getting off at the next stop." }
    - { es: "Vous entendez la musique ?", en: "Can you hear the music?" }
  pitfalls:
    - "*Attendre* = to wait **for**: no preposition — *J'attends Marie*, not *J'attends pour Marie*."
    - "*Il attend*, not *il attendt*."
  related: [g.present-er, g.present-ir-verbs, g.prendre-present]
  drills:
    - { es: "Elle répond au téléphone.", en: "She answers the phone." }
    - { es: "Je perds toujours mes clés.", en: "I always lose my keys." }
    - { es: "Ils attendent devant le café.", en: "They're waiting outside the café." }
- id: g.il-faut
  level: a1
  title: "Il faut: it is necessary"
  summary: "il faut + infinitive (you have to, we must) or + noun (you need): Il faut réserver. Il faut deux heures."
  explanation: |
    *Il faut* is impersonal: the subject is always *il*, and it never changes for the person.

    | structure | meaning | example |
    |---|---|---|
    | **il faut** + infinitive | one must, you have to | *Il faut composter le billet.* |
    | **il faut** + noun | you need, it takes | *Il faut un passeport. Il faut une heure.* |
    | **il ne faut pas** + infinitive | you mustn't | *Il ne faut pas fumer ici.* |

    ### Il faut vs devoir
    - *Il faut partir* = we/you/one must leave (general).
    - *Je dois partir* = I must leave (a specific person).

    *Il ne faut pas* = must not (prohibition), not "don't have to" (= *ce n'est pas nécessaire de*).

    Later (B1) you'll learn *il faut que* + subjonctif: *Il faut que tu partes.*
  examples:
    - { es: "Il faut réserver une table.", en: "You need to book a table." }
    - { es: "Pour aller à Versailles, il faut une heure.", en: "It takes an hour to get to Versailles." }
    - { es: "Il ne faut pas toucher les tableaux.", en: "You mustn't touch the paintings." }
    - { es: "Qu'est-ce qu'il faut acheter ?", en: "What do we need to buy?" }
  pitfalls:
    - "Never *je faut* or *ils faut*: only *il faut*."
    - "*Il ne faut pas* = mustn't, not 'needn't'."
  related: [g.modal-verbs, g.subjonctif-necessite]
  drills:
    - { es: "Il faut prendre le métro.", en: "You have to take the metro." }
    - { es: "Il faut du lait pour la recette.", en: "You need milk for the recipe." }
    - { es: "Il ne faut pas être en retard.", en: "We mustn't be late." }
- id: g.quel
  level: a1
  title: "Quel, quelle, quels, quelles: which, what"
  summary: "Quel agrees with its noun: Quelle heure est-il ? Quel est ton nom ? Exclamations: Quelle belle vue !"
  explanation: |
    | | singular | plural |
    |---|---|---|
    | masculine | **quel** | **quels** |
    | feminine | **quelle** | **quelles** |

    All four sound the same [kɛl].

    ### Questions
    - Before a noun: *Quel métro tu prends ? Quelle heure est-il ? Quels films tu aimes ?*
    - With *être*: *Quel est ton numéro ? Quelle est ta couleur préférée ?*
    - After a preposition: *À quelle heure ? Dans quel quartier ?*

    ### Exclamations
    *Quel* + noun = "What a…!": *Quelle belle vue ! Quel dommage ! Quelle chance ! Quel temps !*

    ### Quel or qu'est-ce que?
    *Quel* goes with a noun; *qu'est-ce que* is "what" on its own: *Quel livre tu lis ?* vs *Qu'est-ce que tu lis ?*
  examples:
    - { es: "Quelle est votre adresse ?", en: "What is your address?" }
    - { es: "Tu habites dans quel arrondissement ?", en: "Which arrondissement do you live in?" }
    - { es: "Quelle belle vue sur Paris !", en: "What a beautiful view of Paris!" }
    - { es: "Quel dommage !", en: "What a shame!" }
  pitfalls:
    - "Not *Qu'est-ce que est ton nom ?*: *Quel est ton nom ?*"
    - "No article after exclamatory *quel*: *Quelle surprise !*, not *Quelle une surprise !*"
  related: [g.question-words, g.relative-lequel]
  drills:
    - { es: "Quel jour sommes-nous ?", en: "What day is it?" }
    - { es: "Quelles chaussures tu préfères ?", en: "Which shoes do you prefer?" }
    - { es: "Quelle chance !", en: "How lucky!" }
- id: g.venir-de
  level: a1
  title: "Venir de + infinitive: to have just done"
  summary: "Je viens de manger = I've just eaten. The recent past with the present of venir."
  explanation: |
    | venir (present) | de / d' | infinitive |
    |---|---|---|
    | je viens | de | manger |
    | tu viens | d' | arriver |
    | il / elle vient | de | partir |
    | nous venons | de | finir |
    | vous venez | de | voir… |
    | ils / elles viennent | de | sortir |

    It describes something that happened **a moment ago**: *Le train vient de partir.* — The train has just left.

    With the near future you now have a neat timeline:

    | just happened | now | about to happen |
    |---|---|---|
    | *Je viens de manger.* | *Je mange.* | *Je vais manger.* |

    *Venir de* + place still means "come from": *Je viens de Lyon*. Context makes it clear.
  examples:
    - { es: "Je viens d'arriver à Paris.", en: "I've just arrived in Paris." }
    - { es: "Le film vient de commencer.", en: "The film has just started." }
    - { es: "Nous venons de visiter le Louvre.", en: "We've just visited the Louvre." }
  pitfalls:
    - "Not *je viens manger* (= I'm coming to eat): *je viens **de** manger*."
    - "English uses a past tense; French uses the **present** of *venir*."
  related: [g.venir-present, g.futur-proche, g.passe-compose-avoir]
  drills:
    - { es: "Elle vient de partir.", en: "She's just left." }
    - { es: "Ils viennent de finir le travail.", en: "They've just finished work." }
    - { es: "Je viens de voir Paul.", en: "I've just seen Paul." }
- id: g.depuis-present
  level: a1
  title: "Depuis + present: for and since"
  summary: "J'habite à Paris depuis deux ans = I've been living in Paris for two years. French uses the present."
  explanation: |
    For something that **started in the past and is still true**, French uses the **present** + *depuis*:

    | French | English |
    |---|---|
    | *J'habite ici **depuis** 2020.* | I've lived here **since** 2020. |
    | *J'apprends le français **depuis** six mois.* | I've been learning French **for** six months. |
    | *Je t'attends **depuis** une heure !* | I've been waiting for you for an hour! |

    *Depuis* covers both "for" (a length of time) and "since" (a starting point).

    ### Asking
    - *Depuis quand… ?* (since when) — *Depuis quand tu habites à Paris ? — Depuis janvier.*
    - *Depuis combien de temps… ?* (for how long) — *Depuis combien de temps vous êtes en France ? — Depuis trois semaines.*

    Alternative: *Ça fait deux ans que j'habite ici.* / *Il y a deux ans que…*
  examples:
    - { es: "Je travaille ici depuis cinq ans.", en: "I've been working here for five years." }
    - { es: "Depuis quand tu es à Paris ?", en: "Since when have you been in Paris?" }
    - { es: "Elle est mariée depuis 2019.", en: "She has been married since 2019." }
    - { es: "Ça fait une heure que j'attends.", en: "I've been waiting for an hour." }
  pitfalls:
    - "Not the passé composé: *j'habite ici depuis deux ans*, not *j'ai habité ici depuis…*"
    - "*Pendant* is for a finished period: *J'ai habité à Rome pendant deux ans* (I don't any more)."
  related: [g.pendant-depuis-il-y-a, g.present-er]
  drills:
    - { es: "J'habite à Montmartre depuis un an.", en: "I've been living in Montmartre for a year." }
    - { es: "Depuis combien de temps tu apprends le français ?", en: "How long have you been learning French?" }
    - { es: "Nous sommes ici depuis lundi.", en: "We've been here since Monday." }
