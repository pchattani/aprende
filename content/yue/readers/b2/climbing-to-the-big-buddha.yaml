  - { es: 青銅, en: bronze }
  - { es: 近距離, en: up close }
  - { es: 小意思, en: "a trifle, nothing" }
  - { es: 舉起, en: to raise }
  - { es: 合埋眼, en: "to close one's eyes" }
  - { es: 創立, en: to found }
  - { es: 素鵝, en: mock goose (tofu skin) }
