id: r.c1.retrato-y-caminos
level: c1
title: Retrato, y «He andado muchos caminos»
kind: literature
author: Antonio Machado (1875–1939)
source: "«Retrato», de Campos de Castilla (1912); «He andado muchos caminos», de Soledades (1903)"
intro: Two poems by Antonio Machado quoted in full. In «Retrato» the poet draws his own portrait in nine stanzas; the second poem, from his first book, contrasts the proud and the pedantic with the «buenas gentes» who work their land and ask for nothing. Watch the literary word order, the attached pronouns (debéisme) and the archaic verb forms (blandiera, yago).
allow: [sevilla, castilla, mañara, bradomín, cupido, ronsard, dios]
paragraphs:
  - { es: "Mi infancia son recuerdos de un patio de Sevilla, / y un huerto claro donde madura el limonero; / mi juventud, veinte años en tierras de Castilla; / mi historia, algunos casos que recordar no quiero.", en: "My childhood is memories of a courtyard in Seville, / and a bright orchard where the lemon tree ripens; / my youth, twenty years in the lands of Castile; / my story, a few events I do not wish to recall." }
  - { es: "Ni un seductor Mañara, ni un Bradomín he sido / —ya conocéis mi torpe aliño indumentario—, / mas recibí la flecha que me asignó Cupido, / y amé cuanto ellas puedan tener de hospitalario.", en: "Neither a seducer like Mañara nor a Bradomín have I been / — you already know my clumsy way of dressing —, / but I received the arrow that Cupid assigned me, / and I loved whatever women may have of hospitable." }
  - { es: "Hay en mis venas gotas de sangre jacobina, / pero mi verso brota de manantial sereno; / y, más que un hombre al uso que sabe su doctrina, / soy, en el buen sentido de la palabra, bueno.", en: "There are in my veins drops of Jacobin blood, / but my verse springs from a serene source; / and, more than a conventional man who knows his doctrine, / I am, in the good sense of the word, good." }
  - { es: "Adoro la hermosura, y en la moderna estética / corté las viejas rosas del huerto de Ronsard; / mas no amo los afeites de la actual cosmética, / ni soy un ave de esas del nuevo gay-trinar.", en: "I adore beauty, and in modern aesthetics / I cut the old roses from Ronsard's garden; / but I do not love the make-up of today's cosmetics, / nor am I one of those birds of the new gay-trilling." }
  - { es: "Desdeño las romanzas de los tenores huecos / y el coro de los grillos que cantan a la luna. / A distinguir me paro las voces de los ecos, / y escucho solamente, entre las voces, una.", en: "I disdain the romances of hollow tenors / and the chorus of crickets singing to the moon. / I stop to tell apart the voices from the echoes, / and I listen only, among the voices, to one." }
  - { es: "¿Soy clásico o romántico? No sé. Dejar quisiera / mi verso, como deja el capitán su espada: / famosa por la mano viril que la blandiera, / no por el docto oficio del forjador preciada.", en: "Am I classical or romantic? I don't know. I would like to leave / my verse as the captain leaves his sword: / famed for the virile hand that wielded it, / not prized for the learned craft of the smith." }
  - { es: "Converso con el hombre que siempre va conmigo / —quien habla solo espera hablar a Dios un día—; / mi soliloquio es plática con ese buen amigo / que me enseñó el secreto de la filantropía.", en: "I converse with the man who always goes with me / — he who talks alone hopes to talk to God one day —; / my soliloquy is a chat with that good friend / who taught me the secret of philanthropy." }
  - { es: "Y al cabo, nada os debo; debéisme cuanto he escrito. / A mi trabajo acudo, con mi dinero pago / el traje que me cubre y la mansión que habito, / el pan que me alimenta y el lecho en donde yago.", en: "And in the end, I owe you nothing; you owe me all I have written. / I go to my work, with my money I pay for / the suit that covers me and the house I live in, / the bread that feeds me and the bed where I lie." }
  - { es: "Y cuando llegue el día del último viaje, / y esté al partir la nave que nunca ha de tornar, / me encontraréis a bordo ligero de equipaje, / casi desnudo, como los hijos de la mar.", en: "And when the day of the last journey comes, / and the ship that will never return is about to leave, / you will find me on board travelling light, / almost naked, like the children of the sea." }
  - { es: "He andado muchos caminos, / he abierto muchas veredas; / he navegado en cien mares, / y atracado en cien riberas. // En todas partes he visto / caravanas de tristeza, / soberbios y melancólicos / borrachos de sombra negra,", en: "I have walked many roads, / I have opened many paths; / I have sailed a hundred seas, / and moored on a hundred shores. // Everywhere I have seen / caravans of sadness, / proud and melancholy men / drunk on black shadow," }
  - { es: "y pedantones al paño / que miran, callan, y piensan / que saben, porque no beben / el vino de las tabernas. // Mala gente que camina / y va apestando la tierra…", en: "and pedants in the wings / who watch, keep silent, and think / they know, because they do not drink / the wine of the taverns. // Bad people who walk / and go about fouling the earth…" }
  - { es: "Y en todas partes he visto / gentes que danzan o juegan, / cuando pueden, y laboran / sus cuatro palmos de tierra. // Nunca, si llegan a un sitio, / preguntan a dónde llegan. / Cuando caminan, cabalgan / a lomos de mula vieja,", en: "And everywhere I have seen / people who dance or play, / when they can, and work / their four spans of land. // Never, if they reach a place, / do they ask where they have arrived. / When they travel, they ride / on the back of an old mule," }
  - { es: "y no conocen la prisa / ni aun en los días de fiesta. / Donde hay vino, beben vino; / donde no hay vino, agua fresca. // Son buenas gentes que viven, / laboran, pasan y sueñan, / y en un día como tantos, / descansan bajo la tierra.", en: "and they know no hurry / not even on feast days. / Where there is wine, they drink wine; / where there is no wine, cool water. // They are good people who live, / work, pass by and dream, / and on a day like so many others, / rest beneath the earth." }
questions:
  - { q: "Where did Machado spend his childhood and his youth, according to the first stanza?", options: ["Childhood in Castile, youth in Seville", "Childhood in Seville, youth in Castile", "Both in Madrid"], answer: 1 }
  - { q: "What does the poet say about his appearance?", options: ["He dresses elegantly", "He admits he dresses clumsily", "He never mentions it"], answer: 1 }
  - { q: "How does Machado want his verse to be remembered?", options: ["For the learned craft of its making", "Like a captain's sword: for the hand that wielded it, not for the smith", "For its rhymes"], answer: 1 }
  - { q: "What does 'debéisme cuanto he escrito' mean?", options: ["You owe me everything I have written", "I owe you everything", "I have written nothing"], answer: 0 }
  - { q: "In 'He andado muchos caminos', who are the 'buenas gentes'?", options: ["The pedants who watch and keep silent", "Simple people who work their land, dance when they can and never hurry", "The sailors of the hundred seas"], answer: 1 }
