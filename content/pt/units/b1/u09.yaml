id: b1.u09
title: Foi inaugurada em 1960
lessons:
  - id: b1.u09.l1
    title: Brasília foi construída em menos de quatro anos
    teach: [g.passive-ser]
    vocab: [w.inaugurar, w.inauguração, w.projetar, w.projeto, w.arquiteto, w.fundar, w.fundação, w.construção, w.catedral, w.palácio, w.congresso, w.modernista, w.modernismo, w.concreto, w.curva, w.candango, w.capital-federal, w.planalto, w.eixo, w.superquadra, w.esplanada, w.plano-piloto, w.urbanismo, w.urbanista, w.mundial]
    tip: "ser + participle + por: Brasília foi inaugurada em 1960. The participle agrees with the subject: as igrejas foram construídas."
    sentences:
      - { es: "Brasília foi inaugurada no dia 21 de abril de 1960.", en: "Brasília was inaugurated on 21 April 1960.", altEs: ["Brasília foi inaugurada em 21 de abril de 1960."], grammar: [g.passive-ser, g.dates-years], vocab: [w.inaugurar], error: { wrong: "Brasília está inaugurada no dia 21 de abril de 1960.", explain: "This is an event (an action at a date), so it takes ser: foi inaugurada.", grammar: g.passive-ser } }
      - { es: "O plano da cidade foi feito por Lúcio Costa, e os prédios principais foram projetados por Oscar Niemeyer.", en: "The city plan was drawn up by Lúcio Costa, and the main buildings were designed by Oscar Niemeyer.", grammar: [g.passive-ser, g.contractions-por], vocab: [w.projetar] }
      - { es: "O projeto do Plano Piloto foi escolhido em 1957, entre dezenas de propostas.", en: "The design for the Plano Piloto was chosen in 1957, out of dozens of proposals.", altEs: ["O projeto do plano piloto foi escolhido em 1957, entre dezenas de propostas."], grammar: [g.passive-ser], vocab: [w.projeto, w.plano-piloto] }
      - { es: "A capital federal foi construída em menos de quatro anos.", en: "The federal capital was built in less than four years.", grammar: [g.passive-ser], vocab: [w.capital-federal, w.construção] }
      - { es: "A Catedral, com suas curvas de concreto, só foi inaugurada em 1970.", en: "The Cathedral, with its concrete curves, was only inaugurated in 1970.", altEs: ["A Catedral, com as suas curvas de concreto, só foi inaugurada em 1970."], grammar: [g.passive-ser], vocab: [w.catedral, w.curva, w.concreto], variant: "Portugal: betão for concreto." }
      - { es: "O Congresso Nacional é visto de longe por quem chega pelo Eixo Monumental.", en: "The National Congress can be seen from far away by anyone arriving along the Monumental Axis.", grammar: [g.passive-ser, g.contractions-por], vocab: [w.congresso, w.eixo] }
      - { es: "A cidade foi construída num planalto, a mais de mil metros de altura.", en: "The city was built on a plateau, more than a thousand metres up.", altEs: ["A cidade foi construída em um planalto, a mais de mil metros de altura."], grammar: [g.passive-ser], vocab: [w.planalto] }
      - { es: "As superquadras foram pensadas para ter escola, comércio e muito verde.", en: "The superblocks were designed to have a school, shops and lots of greenery.", grammar: [g.passive-ser], vocab: [w.superquadra] }
      - { es: "Na esplanada, os ministérios foram construídos todos iguais, um ao lado do outro.", en: "On the esplanade, the ministries were all built the same, side by side.", grammar: [g.passive-ser], vocab: [w.esplanada] }
      - { es: "O urbanismo de Brasília é estudado por urbanistas do mundo inteiro.", en: "Brasília's urban planning is studied by urban planners from all over the world.", altEs: ["O urbanismo de Brasília é estudado por urbanistas do mundo todo."], grammar: [g.passive-ser], vocab: [w.urbanismo, w.urbanista] }
      - { es: "Pirenópolis foi fundada em 1727, na época do ouro.", en: "Pirenópolis was founded in 1727, in the age of gold.", grammar: [g.passive-ser], vocab: [w.fundar], note: "Its first name was Meia Ponte." }
      - { es: "A fundação de Brasília é comemorada todo dia 21 de abril, com a inauguração de alguma obra nova.", en: "The founding of Brasília is celebrated every 21 April, with the opening of some new public work.", grammar: [g.passive-ser], vocab: [w.fundação, w.inauguração] }
      - { es: "O modernismo de Niemeyer foi criticado por uns e amado por outros.", en: "Niemeyer's modernism was criticised by some and loved by others.", grammar: [g.passive-ser], vocab: [w.modernismo] }
      - { es: "As igrejas de Pirenópolis foram construídas no século XVIII.", en: "The churches of Pirenópolis were built in the 18th century.", grammar: [g.passive-ser], vocab: [w.construção], error: { wrong: "As igrejas de Pirenópolis foram construído no século XVIII.", explain: "In the passive, the participle agrees with the subject: as igrejas foram construídas.", grammar: g.passive-ser } }
      - { es: "Niemeyer projetou o Congresso.", en: "Niemeyer designed the Congress.", grammar: [g.passive-ser], vocab: [w.arquiteto], transform: { instruction: "Make it passive (start with O Congresso)", answer: "O Congresso foi projetado por Niemeyer.", alt: ["O Congresso foi projetado pelo Niemeyer."], en: "The Congress was designed by Niemeyer." } }
      - { es: "Um arquiteto modernista desenhou a nova igreja.", en: "A modernist architect drew up the new church.", grammar: [g.passive-ser], vocab: [w.arquiteto, w.modernista], transform: { instruction: "Make it passive (start with A nova igreja)", answer: "A nova igreja foi desenhada por um arquiteto modernista.", alt: ["A igreja nova foi desenhada por um arquiteto modernista."] } }
    exchanges:
      - q: { es: "Quando Brasília foi inaugurada?", en: "When was Brasília inaugurated?" }
        a: { es: "Em 1960, no governo de Juscelino Kubitschek.", en: "In 1960, under Juscelino Kubitschek's government." }
        alt: ["Em 1960.", "Em 21 de abril de 1960."]
        grammar: [g.passive-ser]
        vocab: [w.inaugurar]
      - q: { es: "Quem projetou a cidade?", en: "Who designed the city?" }
        a: { es: "O plano foi feito por Lúcio Costa, e os prédios foram projetados por Niemeyer.", en: "The plan was made by Lúcio Costa, and the buildings were designed by Niemeyer." }
        alt: ["Lúcio Costa e Oscar Niemeyer.", "O urbanista foi Lúcio Costa; o arquiteto, Niemeyer."]
        grammar: [g.passive-ser]
        vocab: [w.projetar, w.urbanista, w.arquiteto]
      - q: { es: "Quem eram os candangos?", en: "Who were the candangos?" }
        a: { es: "Eram os trabalhadores da construção da cidade, muitos deles vindos do Nordeste.", en: "They were the workers who built the city, many of them from the Northeast." }
        alt: ["Os trabalhadores da construção.", "Eram os primeiros moradores de Brasília."]
        grammar: [g.imperfect]
        vocab: [w.candango, w.construção]
      - q: { es: "A igreja matriz de Pirenópolis é original?", en: "Is the main church in Pirenópolis the original one?" }
        a: { es: "Não totalmente: foi destruída pelo fogo em 2002 e refeita depois.", en: "Not entirely: it was destroyed by fire in 2002 and rebuilt afterwards." }
        alt: ["Não, foi refeita depois do fogo de 2002.", "Em parte; foi destruída pelo fogo em 2002."]
        grammar: [g.passive-ser]
        vocab: [w.destruir, w.refazer]
      - q: { es: "O que é uma superquadra?", en: "What is a superblock?" }
        a: { es: "É um grupo de prédios que foi pensado como um pequeno bairro, com escola e comércio.", en: "It's a group of buildings designed as a small neighbourhood, with a school and shops." }
        alt: ["Um pequeno bairro do Plano Piloto.", "Um grupo de prédios com escola e comércio."]
        grammar: [g.passive-ser]
        vocab: [w.superquadra]
    texts:
      - title: "Placa na Praça dos Três Poderes"
        es: ["Esta praça foi projetada por Lúcio Costa.", "Aqui ficam o Palácio do Planalto, o Congresso Nacional e o Supremo Tribunal Federal.", "Os três prédios foram construídos para representar os três poderes da República."]
        en: ["This square was designed by Lúcio Costa.", "Here stand the Planalto Palace, the National Congress and the Supreme Federal Court.", "The three buildings were built to represent the three powers of the Republic."]
        grammar: [g.passive-ser]
        vocab: [w.projetar, w.palácio, w.congresso]
      - title: "Linha do tempo"
        es: ["1957: o projeto de Lúcio Costa é escolhido.", "1960: Brasília é inaugurada como capital federal.", "1987: o Plano Piloto é declarado Patrimônio Mundial."]
        en: ["1957: Lúcio Costa's design is chosen.", "1960: Brasília is inaugurated as the federal capital.", "1987: the Plano Piloto is declared a World Heritage Site."]
        grammar: [g.passive-ser]
        vocab: [w.projeto, w.capital-federal, w.plano-piloto]
    spicy:
      - { es: "Meu coração foi projetado por um arquiteto modernista: cheio de curvas e difícil de entender.", en: "My heart was designed by a modernist architect: full of curves and hard to understand.", altEs: ["O meu coração foi projetado por um arquiteto modernista: cheio de curvas e difícil de entender."], grammar: [g.passive-ser], vocab: [w.arquiteto, w.modernista, w.curva] }
      - { es: "Fui conquistado por você antes da sobremesa.", en: "I was won over by you before dessert.", altEs: ["Fui conquistada por você antes da sobremesa."], grammar: [g.passive-ser] }
      - { es: "Este jantar foi preparado por mim, então elogie mesmo se estiver ruim.", en: "This dinner was made by me, so praise it even if it's bad.", altEs: ["Esse jantar foi preparado por mim, então elogia mesmo se estiver ruim."], grammar: [g.passive-ser, g.future-subjunctive-se] }
      - { es: "Nosso primeiro beijo foi dado na frente da Catedral, com o Congresso de testemunha.", en: "Our first kiss happened in front of the Cathedral, with Congress as a witness.", altEs: ["O nosso primeiro beijo foi dado em frente à Catedral, com o Congresso de testemunha."], grammar: [g.passive-ser], vocab: [w.catedral, w.congresso] }
      - { es: "A nossa história ainda não foi inaugurada, mas o projeto já está pronto.", en: "Our story hasn't been inaugurated yet, but the plans are ready.", altEs: ["Nossa história ainda não foi inaugurada, mas o projeto já está pronto."], grammar: [g.passive-ser, g.passive-estar-ficar], vocab: [w.inaugurar, w.projeto] }

  - id: b1.u09.l2
    title: Vende-se, aluga-se, precisa-se
    teach: [g.se-passive]
    vocab: [w.proibido, w.permitido, w.aviso, w.placa, w.anúncio, w.cartaz, w.regra, w.lei, w.criar, w.desenvolver, w.produzir, w.fabricar, w.exportar, w.importar, w.fábrica, w.produto, w.produção, w.agricultura, w.soja, w.gado, w.fazendeiro, w.plantar, w.colheita]
    tip: "On signs the verb agrees with the thing: vende-se casa, vendem-se casas. With de it stays singular: precisa-se de vendedores."
    sentences:
      - { es: "Vendem-se casas no centro histórico de Pirenópolis.", en: "Houses for sale in the historic centre of Pirenópolis.", altEs: ["Vende-se casa no centro histórico de Pirenópolis."], grammar: [g.se-passive], error: { wrong: "Vende-se casas no centro histórico de Pirenópolis.", explain: "The norm makes the verb agree with casas: vendem-se. (Vende-se casas is common on Brazilian signs, but avoid it in writing.)", grammar: g.se-passive } }
      - { es: "Aluga-se quarto mobiliado perto da rodoviária.", en: "Furnished room to let near the bus station.", altEs: ["Aluga-se um quarto mobiliado perto da rodoviária."], grammar: [g.se-passive], vocab: [w.mobiliado] }
      - { es: "Precisa-se de vendedores para a loja de artesanato.", en: "Salespeople wanted for the craft shop.", grammar: [g.se-passive], vocab: [w.artesanato], error: { wrong: "Precisam-se de vendedores para a loja de artesanato.", explain: "With a preposition (de), the verb never agrees: precisa-se de vendedores.", grammar: g.se-passive } }
      - { es: "Não é permitido nadar na cachoeira depois das cinco.", en: "Swimming in the waterfall is not allowed after five.", altEs: ["É proibido nadar na cachoeira depois das cinco."], grammar: [g.se-passive], vocab: [w.permitido] }
      - { es: "Nesta fábrica, fabricam-se doces com frutas do cerrado.", en: "In this factory, sweets are made with cerrado fruit.", altEs: ["Nesta fábrica, se fabricam doces com frutas do cerrado.", "Nesta fábrica fazem doces com frutas do cerrado."], grammar: [g.se-passive], vocab: [w.fábrica, w.fabricar] }
      - { es: "Em Goiás, planta-se muita soja e cria-se muito gado.", en: "In Goiás, a lot of soya is grown and a lot of cattle are raised.", altEs: ["Em Goiás se planta muita soja e se cria muito gado.", "Em Goiás, plantam muita soja e criam muito gado."], grammar: [g.se-passive, g.indeterminate-subject], vocab: [w.plantar, w.soja, w.criar, w.gado] }
      - { es: "Boa parte da produção de soja é exportada para a China.", en: "A large part of the soya production is exported to China.", grammar: [g.passive-ser], vocab: [w.produção, w.exportar] }
      - { es: "A colheita começa em janeiro e acaba em abril.", en: "The harvest starts in January and ends in April.", grammar: [g.present-regular-ar, g.days-months], vocab: [w.colheita] }
      - { es: "Na agricultura, desenvolvem-se novas máquinas todo ano.", en: "In agriculture, new machines are developed every year.", altEs: ["Na agricultura, se desenvolvem novas máquinas todos os anos."], grammar: [g.se-passive], vocab: [w.agricultura, w.desenvolver] }
      - { es: "O fazendeiro diz que importa as máquinas, mas produz tudo o resto na fazenda.", en: "The farmer says he imports the machines, but produces everything else on the farm.", grammar: [g.reported-speech-present], vocab: [w.fazendeiro, w.importar, w.produzir] }
      - { es: "Leia o aviso antes de entrar na trilha: não se pode levar cachorro.", en: "Read the notice before going onto the trail: you can't take dogs.", altEs: ["Leia o aviso antes de entrar na trilha, não se pode levar cachorro."], grammar: [g.se-passive], vocab: [w.aviso] }
      - { es: "A placa diz que é proibido estacionar na frente da igreja.", en: "The sign says parking in front of the church is forbidden.", grammar: [g.se-passive], vocab: [w.placa, w.proibido] }
      - { es: "As regras do parque são simples: não se faz fogo e não se deixa lixo.", en: "The park rules are simple: no fires and no litter.", grammar: [g.se-passive], vocab: [w.regra], note: "With não before it, se goes before the verb: não se faz." }
      - { es: "Pela lei, o anúncio tem que mostrar o preço do produto.", en: "By law, the advert has to show the price of the product.", grammar: [g.ter-que], vocab: [w.lei, w.anúncio, w.produto] }
      - { es: "Alugamos bicicletas.", en: "We rent out bicycles.", grammar: [g.se-passive], transform: { instruction: "Rewrite it as a sign with se", answer: "Alugam-se bicicletas.", alt: ["Aluga-se bicicletas.", "Alugam-se bicicletas aqui."] } }
      - { es: "Vende-se apartamento.", en: "Flat for sale.", grammar: [g.se-passive], transform: { instruction: "Make it plural (apartamentos)", answer: "Vendem-se apartamentos.", alt: ["Vende-se apartamentos."] } }
    exchanges:
      - q: { es: "O que está escrito naquela placa?", en: "What does that sign say?" }
        a: { es: "Proibido nadar depois das cinco da tarde.", en: "No swimming after five in the afternoon." }
        alt: ["Que é proibido nadar depois das cinco.", "Não se pode nadar depois das cinco."]
        grammar: [g.se-passive]
        vocab: [w.placa, w.proibido]
      - q: { es: "Aqui se aceita cartão?", en: "Do you take cards here?" }
        a: { es: "Aceita-se, sim, e também Pix.", en: "Yes, we do, and Pix too." }
        alt: ["Aceita, sim.", "Aceitamos cartão e Pix."]
        grammar: [g.se-passive]
      - q: { es: "O que se produz nessa região?", en: "What is produced in this region?" }
        a: { es: "Planta-se soja e cria-se muito gado.", en: "Soya is grown and lots of cattle are raised." }
        alt: ["Soja e gado.", "Aqui se planta soja e se cria gado."]
        grammar: [g.se-passive]
        vocab: [w.produzir, w.soja, w.gado]
      - q: { es: "Vocês ainda precisam de gente para a festa?", en: "Do you still need people for the festival?" }
        a: { es: "Precisamos. Olha o cartaz: precisa-se de garçom.", en: "We do. Look at the poster: waiter wanted." }
        alt: ["Precisamos, sim.", "Sim, precisa-se de garçom e de cozinheiro."]
        grammar: [g.se-passive]
        vocab: [w.cartaz]
      - q: { es: "É permitido levar cachorro na trilha?", en: "Are dogs allowed on the trail?" }
        a: { es: "Não, é proibido. Está no aviso da entrada.", en: "No, it's forbidden. It's on the notice at the entrance." }
        alt: ["Não é permitido, não.", "Não, as regras não deixam."]
        grammar: [g.se-passive]
        vocab: [w.permitido, w.aviso]
    texts:
      - title: "Anúncios na praça"
        es: ["Vende-se casa colonial no centro histórico.", "Alugam-se quartos para a Festa do Divino.", "Precisa-se de cozinheiro para o fim de semana."]
        en: ["Colonial house for sale in the historic centre.", "Rooms to let for the Festa do Divino.", "Cook wanted for the weekend."]
        grammar: [g.se-passive]
        vocab: [w.anúncio]
      - title: "Regras da cachoeira"
        es: ["É proibido fazer fogo e deixar lixo.", "Não é permitido levar bebida em garrafa de vidro.", "Respeite as regras: a natureza agradece."]
        en: ["Lighting fires and leaving litter are forbidden.", "Drinks in glass bottles are not allowed.", "Respect the rules: nature will thank you."]
        grammar: [g.se-passive]
        vocab: [w.proibido, w.permitido, w.regra]
    spicy:
      - { es: "Procura-se alguém que saiba dançar forró sem pisar no pé.", en: "Wanted: someone who can dance forró without stepping on toes.", grammar: [g.se-passive, g.relative-subjunctive] }
      - { es: "Aluga-se coração, pouco usado, com vista para a serra.", en: "Heart to let, barely used, with a view of the hills.", grammar: [g.se-passive] }
      - { es: "Aqui não se aceitam desculpas, só convites para jantar.", en: "No excuses accepted here, only dinner invitations.", altEs: ["Aqui não se aceita desculpa, só convite para jantar."], grammar: [g.se-passive] }
      - { es: "Precisa-se de companhia para a Festa do Divino. Paga-se em pamonha.", en: "Company wanted for the Festa do Divino. Payment in pamonha.", grammar: [g.se-passive] }
      - { es: "Deveria ser proibido ficar tão bonito num domingo de manhã.", en: "Looking that good on a Sunday morning should be forbidden.", altEs: ["Devia ser proibido ficar tão bonito num domingo de manhã.", "Deveria ser proibido ficar tão bonita num domingo de manhã."], grammar: [g.se-passive, g.conditional-simple], vocab: [w.proibido] }

  - id: b1.u09.l3
    title: Dizem que vai ser uma eleição difícil
    teach: [g.indeterminate-subject]
    vocab: [w.eleição, w.eleitor, w.votar, w.voto, w.eleger, w.ministério, w.ministro, w.senado, w.senador, w.deputado, w.partido, w.candidato, w.campanha, w.democracia, w.ditadura, w.constituição, w.poder.n, w.federal, w.público, w.privado, w.particular, w.gratuito, w.nacional, w.internacional, w.local, w.oficial, w.militar, w.matriz]
    tip: "When the doer doesn't matter, use the verb in the plural with no subject (Dizem que…, Roubaram…), or generic você / a gente. Adding eles points to specific people."
    sentences:
      - { es: "Dizem que a eleição deste ano vai ser difícil.", en: "They say this year's election is going to be tough.", altEs: ["Falam que a eleição deste ano vai ser difícil.", "Dizem que a eleição desse ano vai ser difícil."], altEn: ["People say this year's election will be difficult."], grammar: [g.indeterminate-subject], vocab: [w.eleição] }
      - { es: "No Brasil, o voto é obrigatório para quem tem entre 18 e 70 anos.", en: "In Brazil, voting is compulsory for people between 18 and 70.", grammar: [g.indeterminate-subject], vocab: [w.voto] }
      - { es: "Aqui você vota numa máquina e sabe o resultado no mesmo dia.", en: "Here you vote on a machine and know the result the same day.", altEs: ["Aqui a gente vota numa máquina e sabe o resultado no mesmo dia."], grammar: [g.indeterminate-subject], vocab: [w.votar], note: "Generic você = 'you, people in general'." }
      - { es: "Tem gente que não confia em nenhum partido.", en: "There are people who don't trust any party.", altEs: ["Há gente que não confia em nenhum partido."], grammar: [g.indeterminate-subject], vocab: [w.partido], error: { wrong: "Tem gente que não confiam em nenhum partido.", explain: "Tem gente que takes a singular verb: confia.", grammar: g.indeterminate-subject } }
      - { es: "A gente nunca sabe o que um candidato vai fazer depois da campanha.", en: "You never know what a candidate is going to do after the campaign.", altEs: ["Nunca se sabe o que um candidato vai fazer depois da campanha."], grammar: [g.indeterminate-subject, g.a-gente], vocab: [w.candidato, w.campanha] }
      - { es: "Disseram no rádio que o ministro vai visitar Pirenópolis.", en: "They said on the radio that the minister is going to visit Pirenópolis.", grammar: [g.indeterminate-subject], vocab: [w.ministro] }
      - { es: "Os deputados e os senadores trabalham no Congresso, perto dos ministérios.", en: "Deputies and senators work in Congress, near the ministries.", grammar: [g.present-regular-ar], vocab: [w.deputado, w.senador, w.ministério] }
      - { es: "Em 1985, acabou a ditadura militar e o país voltou à democracia.", en: "In 1985, the military dictatorship ended and the country returned to democracy.", grammar: [g.preterite-regular], vocab: [w.ditadura, w.militar, w.democracia] }
      - { es: "A Constituição de 1988 garante saúde pública e gratuita para todos.", en: "The 1988 Constitution guarantees free public healthcare for everyone.", grammar: [g.present-regular-er-ir], vocab: [w.constituição, w.público, w.gratuito] }
      - { es: "Escola pública ou particular? Dizem que depende muito do bairro.", en: "State school or private? They say it depends a lot on the neighbourhood.", altEs: ["Escola pública ou privada? Dizem que depende muito do bairro."], grammar: [g.indeterminate-subject], vocab: [w.particular, w.privado, w.público] }
      - { es: "O poder federal fica em Brasília, mas cada estado elege o seu governador.", en: "Federal power is in Brasília, but each state elects its own governor.", altEs: ["O poder federal fica em Brasília, mas cada estado elege seu governador."], grammar: [g.ficar-location], vocab: [w.poder.n, w.federal, w.eleger] }
      - { es: "Elegeram um eleitor comum para falar em nome do bairro.", en: "They elected an ordinary voter to speak on behalf of the neighbourhood.", grammar: [g.indeterminate-subject], vocab: [w.eleger, w.eleitor] }
      - { es: "A festa é local, mas a notícia ficou nacional e até internacional.", en: "The festival is local, but the news went national and even international.", grammar: [g.ficar-change-of-state], vocab: [w.local, w.nacional, w.internacional] }
      - { es: "Dizem que vai chover no dia da eleição.", en: "They say it's going to rain on election day.", grammar: [g.indeterminate-subject], vocab: [w.eleição], error: { wrong: "Eles dizem que vai chover no dia da eleição.", explain: "For an unknown 'they', use the verb alone (dizem); eles points to specific people.", grammar: g.indeterminate-subject } }
      - { es: "Um ladrão roubou a bicicleta do meu vizinho.", en: "A thief stole my neighbour's bike.", grammar: [g.indeterminate-subject], transform: { instruction: "Make it impersonal: drop the subject and use the plural", answer: "Roubaram a bicicleta do meu vizinho.", alt: ["Roubaram a bicicleta do vizinho."], en: "Someone stole my neighbour's bike." } }
      - { es: "As pessoas nunca sabem o resultado oficial antes da noite.", en: "People never know the official result before the evening.", grammar: [g.indeterminate-subject], vocab: [w.oficial], transform: { instruction: "Use a gente instead of as pessoas", answer: "A gente nunca sabe o resultado oficial antes da noite.", alt: ["A gente nunca sabe o resultado oficial antes de noite."] } }
    exchanges:
      - q: { es: "Em quem você vai votar?", en: "Who are you going to vote for?" }
        a: { es: "Ainda não sei; dizem que os dois candidatos são muito parecidos.", en: "I don't know yet; they say the two candidates are very similar." }
        alt: ["Não sei ainda.", "No candidato do meu partido, claro."]
        grammar: [g.indeterminate-subject]
        vocab: [w.votar, w.candidato]
      - q: { es: "O voto é obrigatório no Brasil?", en: "Is voting compulsory in Brazil?" }
        a: { es: "É, para quem tem entre dezoito e setenta anos.", en: "Yes, for people between eighteen and seventy." }
        alt: ["É, sim.", "É obrigatório, mas tem exceções."]
        grammar: [g.indeterminate-subject]
        vocab: [w.voto]
      - q: { es: "Onde fica o Senado?", en: "Where is the Senate?" }
        a: { es: "No Congresso Nacional, ao lado da Câmara dos Deputados.", en: "In the National Congress, next to the Chamber of Deputies." }
        alt: ["No Congresso.", "Na Praça dos Três Poderes, no Congresso."]
        grammar: [g.ficar-location]
        vocab: [w.senado, w.deputado]
      - q: { es: "O que aconteceu em 1985?", en: "What happened in 1985?" }
        a: { es: "Acabou a ditadura militar e voltou a democracia.", en: "The military dictatorship ended and democracy came back." }
        alt: ["Acabou a ditadura.", "O Brasil voltou à democracia."]
        grammar: [g.preterite-regular]
        vocab: [w.ditadura, w.democracia]
      - q: { es: "A escola dos seus filhos é pública?", en: "Is your children's school a state school?" }
        a: { es: "É particular, mas dizem que a pública do bairro é ótima.", en: "It's private, but they say the state school in the area is excellent." }
        alt: ["Não, é particular.", "É pública e gratuita."]
        grammar: [g.indeterminate-subject]
        vocab: [w.particular, w.público]
    texts:
      - title: "Notícia de rádio"
        es: ["Falam que o ministro chega amanhã a Pirenópolis.", "Ele vai visitar a igreja matriz e assistir às Cavalhadas.", "Dizem que vai ser uma visita oficial, com muita segurança."]
        en: ["People are saying the minister arrives in Pirenópolis tomorrow.", "He'll visit the main church and watch the Cavalhadas.", "They say it will be an official visit, with lots of security."]
        grammar: [g.indeterminate-subject]
        vocab: [w.ministro, w.oficial]
      - title: "Cartaz de campanha"
        es: ["Vote consciente!", "Um país mais justo começa no seu voto.", "Eleições: primeiro domingo de outubro."]
        en: ["Vote responsibly!", "A fairer country starts with your vote.", "Elections: the first Sunday in October."]
        grammar: [g.imperative-formal]
        vocab: [w.voto, w.eleição]
    spicy:
      - { es: "Dizem que quem dança forró com você nunca mais esquece.", en: "They say whoever dances forró with you never forgets it.", altEs: ["Falam que quem dança forró com você nunca mais esquece."], grammar: [g.indeterminate-subject] }
      - { es: "Para presidente do meu coração, você já tem o meu voto.", en: "For president of my heart, you already have my vote.", altEs: ["Para presidente do meu coração, você já tem meu voto."], grammar: [g.ter-present], vocab: [w.voto] }
      - { es: "Falam que a gente forma um casal bonito. Eu concordo.", en: "People say we make a lovely couple. I agree.", altEs: ["Dizem que a gente forma um casal bonito. Eu concordo."], grammar: [g.indeterminate-subject, g.a-gente] }
      - { es: "Roubaram meu coração na Festa do Divino, e eu desconfio de você.", en: "Someone stole my heart at the Festa do Divino, and I suspect you.", altEs: ["Roubaram o meu coração na Festa do Divino, e eu desconfio de você."], grammar: [g.indeterminate-subject] }
      - { es: "Tem gente que vai à festa pelas Cavalhadas; eu vou pelos mascarados bonitos.", en: "Some people go to the festival for the Cavalhadas; I go for the handsome masked riders.", grammar: [g.indeterminate-subject], vocab: [w.mascarado] }

  - id: b1.u09.l4
    title: A estrada está fechada
    teach: [g.passive-estar-ficar]
    vocab: [w.responsável, w.representar, w.utilizar, w.determinar, w.estabelecer, w.expor, w.atacar, w.piloto, w.taxista, w.passageiro, w.trajeto, w.linha, w.baldeação, w.exército, w.soldado, w.cristão, w.cavaleiro, w.interditado, w.mascarado]
    tip: "ser + participle = the action (a porta foi aberta às oito); estar = the resulting state (a porta está aberta); ficar = how it ended up or stayed (ficou aberta a noite toda)."
    sentences:
      - { es: "A estrada para Pirenópolis está interditada por causa da chuva.", en: "The road to Pirenópolis is closed off because of the rain.", altEs: ["A estrada para Pirenópolis está fechada por causa da chuva."], grammar: [g.passive-estar-ficar], vocab: [w.interditado] }
      - { es: "Aos domingos, o Eixão fica fechado para os carros e vira um parque.", en: "On Sundays, the Eixão is closed to cars and becomes a park.", altEs: ["Aos domingos o Eixão fica fechado para carros e vira um parque."], grammar: [g.passive-estar-ficar], vocab: [w.eixo], note: "O Eixão is the nickname of Brasília's great north–south axis road." }
      - { es: "A igreja foi aberta às oito, mas às dez já estava cheia.", en: "The church was opened at eight, but by ten it was already full.", grammar: [g.passive-estar-ficar, g.passive-ser] }
      - { es: "Nas Cavalhadas, os cristãos estão vestidos de azul e os mouros, de vermelho.", en: "In the Cavalhadas, the Christians are dressed in blue and the Moors in red.", grammar: [g.passive-estar-ficar], vocab: [w.cristão] }
      - { es: "Os cavaleiros representam os soldados de dois exércitos.", en: "The riders represent the soldiers of two armies.", grammar: [g.present-regular-ar], vocab: [w.cavaleiro, w.representar, w.soldado, w.exército] }
      - { es: "Na batalha, os mouros atacam primeiro, mas no final são vencidos.", en: "In the battle, the Moors attack first, but in the end they're defeated.", grammar: [g.passive-ser], vocab: [w.atacar] }
      - { es: "Os mascarados ficam escondidos atrás das máscaras durante a festa inteira.", en: "The masked riders stay hidden behind their masks for the whole festival.", altEs: ["Os mascarados ficam escondidos atrás das máscaras a festa toda."], grammar: [g.passive-estar-ficar], vocab: [w.mascarado] }
      - { es: "O responsável pela festa determinou que o trajeto ia mudar.", en: "The person in charge of the festival decided that the route would change.", altEs: ["O responsável pela festa determinou que o trajeto mudaria."], grammar: [g.reported-speech-past], vocab: [w.responsável, w.determinar, w.trajeto] }
      - { es: "As regras da festa foram estabelecidas há mais de cem anos e estão escritas num livro.", en: "The festival's rules were set more than a hundred years ago and are written in a book.", grammar: [g.passive-ser, g.passive-estar-ficar], vocab: [w.estabelecer] }
      - { es: "O museu expõe as roupas que são utilizadas nas Cavalhadas.", en: "The museum displays the costumes that are used in the Cavalhadas.", grammar: [g.passive-ser], vocab: [w.expor, w.utilizar] }
      - { es: "O taxista disse que a linha de ônibus para o centro estava suspensa.", en: "The taxi driver said the bus route to the centre was suspended.", altEs: ["O taxista falou que a linha de ônibus para o centro estava parada."], grammar: [g.passive-estar-ficar, g.reported-speech-past], vocab: [w.taxista, w.linha] }
      - { es: "O piloto avisou que os passageiros podiam desligar o cinto.", en: "The pilot announced that passengers could unfasten their seat belts.", altEs: ["O piloto avisou que os passageiros já podiam desligar o cinto."], grammar: [g.reported-speech-past], vocab: [w.piloto, w.passageiro] }
      - { es: "Fiquei preso no trânsito por uma hora.", en: "I got stuck in traffic for an hour.", altEs: ["Fiquei preso no trânsito durante uma hora.", "Fiquei presa no trânsito por uma hora."], grammar: [g.passive-estar-ficar] }
      - { es: "As lojas estão fechadas no domingo.", en: "The shops are closed on Sunday.", grammar: [g.passive-estar-ficar], error: { wrong: "As lojas estão fechado no domingo.", explain: "The participle agrees with the subject: as lojas estão fechadas.", grammar: g.passive-estar-ficar } }
      - { es: "Fecharam a estrada.", en: "They closed the road.", grammar: [g.passive-estar-ficar, g.indeterminate-subject], transform: { instruction: "Describe the resulting state with estar", answer: "A estrada está fechada.", alt: ["A estrada está interditada."], en: "The road is closed." } }
      - { es: "A porta estava aberta quando eu cheguei.", en: "The door was open when I arrived.", grammar: [g.passive-estar-ficar], transform: { instruction: "Say it stayed open all night, with ficar", answer: "A porta ficou aberta a noite toda.", alt: ["A porta ficou aberta a noite inteira.", "A porta ficou aberta toda a noite."] } }
    exchanges:
      - q: { es: "A igreja está aberta?", en: "Is the church open?" }
        a: { es: "Está, mas fica fechada na hora do almoço.", en: "It is, but it's closed at lunchtime." }
        alt: ["Está aberta até as cinco.", "Agora está fechada."]
        grammar: [g.passive-estar-ficar]
      - q: { es: "Como foi a viagem?", en: "How was the journey?" }
        a: { es: "Fiquei preso no trânsito, e o ônibus chegou duas horas atrasado.", en: "I got stuck in traffic, and the bus arrived two hours late." }
        alt: ["Longa: fiquei preso no trânsito.", "Tranquila, a estrada estava vazia."]
        grammar: [g.passive-estar-ficar]
      - q: { es: "Qual é o trajeto mais rápido para o aeroporto?", en: "What's the fastest route to the airport?" }
        a: { es: "Pega a linha do aeroporto e faz baldeação na rodoviária.", en: "Take the airport line and change at the bus station." }
        alt: ["De táxi, sem dúvida.", "Pegue o ônibus e faça baldeação na rodoviária."]
        grammar: [g.imperative-informal]
        vocab: [w.trajeto, w.linha, w.baldeação]
      - q: { es: "Quem é o responsável pela Festa do Divino?", en: "Who's in charge of the Festa do Divino?" }
        a: { es: "O imperador do Divino, que é escolhido todo ano.", en: "The Emperor of the Divine, who is chosen every year." }
        alt: ["O imperador da festa.", "Uma família da cidade, escolhida todo ano."]
        grammar: [g.passive-ser]
        vocab: [w.responsável, w.imperador]
      - q: { es: "Já ficou decidido o horário?", en: "Has the time been decided yet?" }
        a: { es: "Ficou: as Cavalhadas começam às duas.", en: "Yes: the Cavalhadas start at two." }
        alt: ["Ainda não ficou decidido.", "Ficou, às duas da tarde."]
        grammar: [g.passive-estar-ficar]
    texts:
      - title: "Aviso da prefeitura"
        es: ["Durante as Cavalhadas, o centro histórico está fechado para carros.", "O estacionamento oficial fica na entrada da cidade.", "Os responsáveis pelo trânsito estão à disposição dos visitantes."]
        en: ["During the Cavalhadas, the historic centre is closed to cars.", "The official car park is at the entrance to the town.", "The traffic officers are at visitors' disposal."]
        grammar: [g.passive-estar-ficar]
        vocab: [w.responsável]
      - title: "Mensagem do taxista"
        es: ["Bom dia! A estrada para Brasília está interditada.", "Fiquei sabendo que só vai ser liberada à tarde.", "O senhor quer ir pelo outro trajeto?"]
        en: ["Good morning! The road to Brasília is closed off.", "I've heard it will only be reopened in the afternoon.", "Would you like to take the other route?"]
        grammar: [g.passive-estar-ficar]
        vocab: [w.interditado, w.trajeto]
    spicy:
      - { es: "Você ficou tão bonito de mascarado que eu quase não te reconheci.", en: "You looked so handsome in a mask that I almost didn't recognise you.", altEs: ["Você ficou tão bonita de mascarada que eu quase não te reconheci."], grammar: [g.passive-estar-ficar], vocab: [w.mascarado] }
      - { es: "Meu coração está ocupado, mas aceita baldeação.", en: "My heart is taken, but it accepts transfers.", altEs: ["O meu coração está ocupado, mas aceita baldeação."], grammar: [g.passive-estar-ficar], vocab: [w.baldeação] }
      - { es: "A mesa está reservada para dois; o resto fica por sua conta.", en: "The table is booked for two; the rest is up to you.", grammar: [g.passive-estar-ficar] }
      - { es: "Fiquei preso no trânsito, mas valeu: cheguei e você ainda estava solteiro.", en: "I got stuck in traffic, but it was worth it: I arrived and you were still single.", altEs: ["Fiquei presa no trânsito, mas valeu: cheguei e você ainda estava solteiro."], grammar: [g.passive-estar-ficar] }
      - { es: "Os mouros atacam, os cristãos respondem, e eu fico parado olhando você.", en: "The Moors attack, the Christians fight back, and I just stand there looking at you.", altEs: ["Os mouros atacam, os cristãos respondem, e eu fico parada olhando você."], grammar: [g.passive-estar-ficar], vocab: [w.atacar, w.cristão] }
dialogues:
  - id: b1.u09.d1
    title: No centro de informações turísticas
    context: Sílvia has driven from Brasília to Pirenópolis for the Festa do Divino. Guilherme works at the tourist information desk.
    lines:
      - { speaker: Sílvia, es: "Bom dia! Vim de Brasília para as Cavalhadas. A igreja matriz está aberta?", en: "Good morning! I've come from Brasília for the Cavalhadas. Is the main church open?" }
      - { speaker: Guilherme, es: "Está, sim, até as cinco. Sabia que ela foi construída em 1728?", en: "Yes, it is, until five. Did you know it was built in 1728?" }
      - { speaker: Sílvia, es: "Disseram que ela tinha pegado fogo.", en: "Someone told me it had caught fire." }
      - { speaker: Guilherme, es: "É verdade. Foi destruída pelo fogo em 2002, mas foi refeita e aberta de novo em 2006.", en: "That's true. It was destroyed by fire in 2002, but it was rebuilt and reopened in 2006." }
      - { speaker: Sílvia, es: "E onde se compram os ingressos para as Cavalhadas?", en: "And where do you buy tickets for the Cavalhadas?" }
      - { speaker: Guilherme, es: "Não se paga nada: a entrada é gratuita. Mas o campo fica cheio cedo.", en: "You don't pay anything: entry is free. But the field fills up early." }
      - { speaker: Sílvia, es: "Posso ir de carro até lá?", en: "Can I drive there?" }
      - { speaker: Guilherme, es: "Não, durante a festa o centro fica fechado para carros. É proibido estacionar nas ruas antigas.", en: "No, during the festival the centre is closed to cars. Parking on the old streets is forbidden." }
      - { speaker: Sílvia, es: "Entendi. E os mascarados? Dizem que dão medo.", en: "I see. And the masked riders? People say they're scary." }
      - { speaker: Guilherme, es: "Que nada! Ficam escondidos atrás das máscaras, mas são gente da cidade que brinca com todo mundo.", en: "Not at all! They stay hidden behind their masks, but they're local people who joke with everyone." }
      - { speaker: Sílvia, es: "Ótimo. Então vou primeiro à igreja e, em seguida, à festa.", en: "Great. Then I'll go to the church first and, after that, to the festival." }
    questions:
      - { q: "Quando a igreja matriz foi construída?", options: ["Em 1728", "Em 2002", "Em 2006"], answer: 0, explain: "Ela foi construída em 1728." }
      - { q: "O que aconteceu com a igreja em 2002?", options: ["Foi inaugurada", "Foi destruída pelo fogo", "Foi fechada para sempre"], answer: 1, explain: "Foi destruída pelo fogo em 2002 and reopened in 2006." }
      - { q: "Quanto custa assistir às Cavalhadas?", options: ["Nada, a entrada é gratuita", "Cinquenta reais", "Só se paga o estacionamento"], answer: 0, explain: "Não se paga nada: a entrada é gratuita." }
      - { q: "Por que a Sílvia não pode ir de carro até o campo?", options: ["Porque a estrada está interditada", "Porque o centro fica fechado para carros durante a festa", "Porque o carro está estragado"], answer: 1, explain: "Durante a festa o centro fica fechado para carros." }
writing:
  - task: "Write a short text about the history of Brasília in the passive (foi construída, foi inaugurada, foi projetada por…)."
    min: 50
    max: 100
    use: [w.inaugurar, w.projetar, w.construção, w.arquiteto, w.urbanista]
    useAtLeast: 3
    grammar: [g.passive-ser]
    expect:
      - { pattern: '\b(foi|foram|s[aã]o|era|eram) [a-zà-ú]+(ado|ada|ados|adas|ido|ida|idos|idas|ita|ito|itas|itos|eita|eito|eitos|eitas)\b', hint: "Use the passive with ser + participle: foi construída, foi projetada por…" }
    model: { es: "Brasília foi construída em menos de quatro anos e foi inaugurada no dia 21 de abril de 1960. A cidade foi planejada pelo urbanista Lúcio Costa, e os palácios e a catedral foram projetados pelo arquiteto Oscar Niemeyer. Os prédios foram feitos de concreto, com muitas curvas. A construção foi realizada por muitos trabalhadores, os candangos, que vieram de todo o Brasil.", en: "Brasília was built in under four years and was inaugurated on 21 April 1960. The city was planned by the urban planner Lúcio Costa, and the palaces and the cathedral were designed by the architect Oscar Niemeyer. The buildings were made of concrete, with lots of curves. The construction was carried out by many workers, the candangos, who came from all over Brazil." }
  - task: "Write a few signs for shops and farms around Pirenópolis using se (Vende-se…, Aluga-se…, Precisa-se de…), then describe what is produced in the region."
    min: 50
    max: 100
    use: [w.produzir, w.fabricar, w.agricultura, w.gado, w.soja]
    useAtLeast: 3
    grammar: [g.se-passive]
    expect:
      - { pattern: '\b[a-zà-ú]+-se\b', hint: "Use the se-passive: Vende-se…, Aluga-se…, Precisa-se de…" }
    model: { es: "Aluga-se casa no centro histórico, perto da igreja. Vendem-se queijos e doces da fazenda. Precisa-se de garçom para o fim de semana. Na região de Pirenópolis, produz-se muita soja e cria-se gado. A agricultura é muito importante para a economia: planta-se milho e fabricam-se doces e cachaça para os turistas.", en: "House to let in the historic centre, near the church. Farm cheeses and sweets for sale. Waiter wanted for the weekend. In the Pirenópolis area a lot of soya is produced and cattle are raised. Agriculture is very important for the economy: maize is grown and sweets and cachaça are made for the tourists." }
  - task: "An election is coming up in your town. Write what people are saying about it (Dizem que…, Falam que…, Contam que…) and give your own opinion."
    min: 50
    max: 100
    use: [w.eleição, w.candidato, w.votar, w.campanha, w.partido]
    useAtLeast: 3
    grammar: [g.indeterminate-subject]
    expect:
      - { pattern: '\b(dizem|falam|comentam|contam|acham) que\b', hint: "Use the third-person plural for 'people say': Dizem que…, Falam que…" }
      - { pattern: '\b(acho|na minha opini[aã]o|acredito|para mim)\b', hint: "Add your own opinion: Na minha opinião…" }
    model: { es: "Dizem que a eleição deste ano vai ser difícil. Falam que os dois candidatos principais estão empatados e que a campanha vai custar muito caro. Contam também que um partido novo vai ter muitos votos. Na minha opinião, o mais importante é que todo mundo vote e que os eleitores conheçam as propostas de cada candidato.", en: "People say this year's election is going to be tough. They say the two main candidates are neck and neck and that the campaign is going to be very expensive. They also say a new party will get a lot of votes. In my opinion, the most important thing is that everybody votes and that voters know each candidate's proposals." }
  - task: "Describe the state of the town after the Cavalhadas festival and a heavy storm: what is closed, kept or changed (está fechada, ficou cheia, foi mudado…)."
    min: 50
    max: 100
    use: [w.interditado, w.responsável, w.cavaleiro, w.mascarado, w.trajeto]
    useAtLeast: 3
    grammar: [g.passive-estar-ficar]
    expect:
      - { pattern: '(?<!\p{L})(est[aá]|est[aã]o|ficou|ficaram|estava|estavam) [a-zà-ú]+(ado|ada|ados|adas|ido|ida|idos|idas|ito|ita|eito|eita)\b', hint: "Describe results with estar / ficar + participle: A estrada está fechada. / A praça ficou cheia." }
    model: { es: "Depois das Cavalhadas, a cidade ficou cansada, mas feliz. A praça principal ainda está fechada e a estrada para Brasília está interditada por causa da chuva. Os cavalos dos cavaleiros estão guardados e as roupas dos mascarados estão guardadas no museu. O responsável pela festa disse que o trajeto dos cavaleiros vai ser mudado no ano que vem.", en: "After the Cavalhadas, the town was tired but happy. The main square is still closed and the road to Brasília is blocked because of the rain. The riders' horses are stabled and the masked riders' costumes are stored in the museum. The festival organiser said the riders' route will be changed next year." }
