id: r.c2.montreal-on-jase-sous-la-ville
level: c2
title: "Montréal : on jase sous la ville"
kind: dialogue
intro: "Mélanie, from Montréal, shows her French friend Julien around the city in mid-winter. She speaks informal Québec French; he speaks the French of France — and they both comment on the differences. Standard equivalents of her Québec forms: c'est-tu… ? = est-ce que c'est… ?, chu = je suis, pantoute = pas du tout, char = voiture, tuque = bonnet, bas = chaussettes, dépanneur = épicerie de quartier, magasiner = faire les courses / du shopping, fin de semaine = week-end, souper = dîner, jaser = bavarder, c'est plate = c'est ennuyeux, tiguidou = parfait, bienvenue = de rien, ma blonde / mon chum = ma copine / mon copain."
allow: [contexte, montréal, montréalais, montréalaise, québec, québécois, québécoise, mélanie, julien, mont-royal, réso, paris, français, française, ville-marie, ok, yé, ben, tsé]
paragraphs:
  - { es: "Mélanie : Pis, Julien, comment tu trouves ça, l'hiver à Montréal ? Il fait moins vingt à matin, c'est pas pire pour un premier jour !", en: "Mélanie: So, Julien, how do you like winter in Montréal? It was minus twenty this morning — not bad for a first day!" }
  - { es: "Julien : « Pas pire » ? J'ai les pieds gelés et je ne sens plus mes oreilles. Chez moi, à moins vingt, on reste à la maison.", en: "Julien: 'Not bad'? My feet are frozen and I can't feel my ears. Back home, at minus twenty, you stay indoors." }
  - { es: "Mélanie : C'est parce que t'as pas de tuque, voyons ! Pis tes bas sont trop minces. On va aller t'acheter ça. Mais avant, je vais te montrer notre secret : on va magasiner sans mettre le nez dehors.", en: "Mélanie: That's because you haven't got a woolly hat, come on! And your socks are too thin. We'll go and buy you some. But first I'll show you our secret: we're going shopping without setting foot outside." }
  - { es: "Julien : Sans sortir ? Comment ça ?", en: "Julien: Without going out? How?" }
  - { es: "Mélanie : Par la ville souterraine, le RÉSO. Ça fait plus de trente kilomètres de tunnels qui relient les stations de métro, les centres commerciaux, les universités, des bureaux, des hôtels… L'hiver, y a des gens qui passent la journée en dessous sans jamais voir le ciel. Moi, je trouve ça un peu plate, mais quand il fait frette de même, c'est ben pratique.", en: "Mélanie: Through the underground city, the RÉSO. It's more than thirty kilometres of tunnels linking metro stations, shopping centres, universities, offices, hotels… In winter some people spend the whole day down there without ever seeing the sky. I find it a bit boring, but when it's this cold it's really handy." }
  - { es: "Julien : Attends, « frette », ça veut dire froid ? Et « de même » ?", en: "Julien: Wait, 'frette' means cold? And 'de même'?" }
  - { es: "Mélanie : Ben oui. « Frette de même », c'est « froid comme ça ». Tu vas voir, après une semaine, tu vas parler comme nous autres. C'est-tu loin, ton hôtel ? On pourrait laisser ton sac en passant.", en: "Mélanie: Well, yes. 'Frette de même' is 'cold like this'. You'll see, after a week you'll be talking like us. Is your hotel far? We could drop off your bag on the way." }
  - { es: "Julien : Non, il est juste à côté. Mais dis-moi, c'est quoi ce « -tu » à la fin de ta question ? Tu ne parlais pas de moi, si ?", en: "Julien: No, it's right next door. But tell me, what's this '-tu' at the end of your question? You weren't talking about me, were you?" }
  - { es: "Mélanie : Pantoute ! Ça a rien à voir avec « toi ». C'est juste une petite marque qu'on met pour poser une question : « tu viens-tu ? », « c'est-tu loin ? », « ça se peut-tu ? ». Vous autres, en France, vous dites « est-ce que », c'est ben plus long.", en: "Mélanie: Not at all! It has nothing to do with 'you'. It's just a little marker we add to ask a question: 'tu viens-tu?' (are you coming?), 'c'est-tu loin?' (is it far?), 'ça se peut-tu?' (is that possible?). You guys in France say 'est-ce que', it's much longer." }
  - { es: "Julien : C'est vrai. Et ce soir, on fait quoi ? Tu m'avais parlé d'un dîner chez tes parents.", en: "Julien: True. And tonight, what are we doing? You'd mentioned dinner at your parents'." }
  - { es: "Mélanie : Un souper, mon ami ! Le dîner, ici, c'est à midi. Ma mère fait une tourtière, pis mon père va vouloir jaser de politique avec un Français, je te préviens. Mon chum vient aussi, il va passer nous prendre en char vers six heures.", en: "Mélanie: A souper, my friend! Dîner here is at noon. My mother's making a tourtière, and my father will want to chat about politics with a Frenchman, I'm warning you. My boyfriend's coming too, he'll pick us up in the car around six." }
  - { es: "Julien : Ton « chum », c'est ton copain ou ton ami ?", en: "Julien: Your 'chum' — is he your boyfriend or your friend?" }
  - { es: "Mélanie : Ça dépend du contexte ! Là, c'est mon copain. Pis ma blonde, ce serait ma copine, même si elle est brune. Bon, on va passer au dépanneur acheter du vin pour mes parents ?", en: "Mélanie: Depends on the context! Here, it's my boyfriend. And 'ma blonde' would be my girlfriend, even if she's dark-haired. Right, shall we stop at the corner shop to buy some wine for my parents?" }
  - { es: "Julien : Le dépanneur ? Il y a un problème avec ta voiture ?", en: "Julien: The 'dépanneur'? Is there something wrong with your car?" }
  - { es: "Mélanie (en riant) : Non ! Le dépanneur, c'est la petite épicerie du coin, ouverte tard le soir. En France, un dépanneur, c'est celui qui répare les chars en panne, c'est ça ? Ici, il te « dépanne » quand t'as oublié d'acheter du lait. C'est le même mot, mais on l'a fait voyager.", en: "Mélanie (laughing): No! The dépanneur is the little corner shop, open late at night. In France a dépanneur is the person who fixes broken-down cars, right? Here, he 'helps you out' when you've forgotten to buy milk. It's the same word, but we've made it travel." }
  - { es: "Julien : Et les fameux jurons québécois ? Tu ne veux pas m'en apprendre un ou deux, pour le souper ?", en: "Julien: And the famous Québec swear words? Won't you teach me one or two, for the dinner?" }
  - { es: "Mélanie : Pas question ! Nos sacres viennent des mots de l'Église, pis c'est vraiment pas poli. Si t'en dis un devant ma mère, tu vas manger ta tourtière dehors, à moins vingt. Contente-toi de « maudit », c'est ben assez pour un premier soir.", en: "Mélanie: No way! Our swear words come from Church vocabulary, and they're really not polite. If you say one in front of my mother, you'll be eating your tourtière outside, at minus twenty. Stick to 'maudit' (damn), that's plenty for a first evening." }
  - { es: "Julien : Je commence à comprendre. Vous gardez les vieux mots français et vous leur donnez une nouvelle vie. Comme « souper » : chez nous, mes grands-parents à la campagne le disaient encore.", en: "Julien: I'm starting to understand. You keep old French words and give them a new life. Like 'souper': back home, my grandparents in the countryside still used to say it." }
  - { es: "Mélanie : Exactement. Pis on se bat pour garder notre français, entouré de millions d'anglophones. C'est pour ça qu'on dit « courriel » au lieu de « mail », pis « fin de semaine » au lieu de « week-end ». Vous autres, les Français, vous empruntez plus de mots anglais que nous ! Bon, assez jasé. Merci d'être venu me voir, en passant.", en: "Mélanie: Exactly. And we fight to keep our French, surrounded by millions of English speakers. That's why we say 'courriel' instead of 'mail' and 'fin de semaine' instead of 'week-end'. You French borrow more English words than we do! Right, enough chatting. Thanks for coming to see me, by the way." }
  - { es: "Julien : De rien, c'est normal.", en: "Julien: You're welcome, of course." }
  - { es: "Mélanie : Ici, on dit « bienvenue » ! Allez, viens-t'en. Tiguidou, on y va !", en: "Mélanie: Here we say 'bienvenue'! Come on, let's go. All good, off we go!" }
questions:
  - { q: "Pourquoi Julien a-t-il froid selon Mélanie ?", options: ["Parce qu'il n'a pas de tuque et que ses bas sont trop minces", "Parce qu'il est malade", "Parce que son hôtel n'est pas chauffé"], answer: 0, explain: "«C'est parce que t'as pas de tuque… Pis tes bas sont trop minces» — tuque = bonnet, bas = chaussettes." }
  - { q: "Qu'est-ce que le RÉSO ?", options: ["Une station de ski", "La ville souterraine : plus de trente kilomètres de tunnels qui relient métro, magasins et bureaux", "Un réseau de bus"], answer: 1, explain: "«La ville souterraine, le RÉSO… plus de trente kilomètres de tunnels.»" }
  - { q: "À quoi sert le « -tu » dans « C'est-tu loin ? » ?", options: ["À parler à quelqu'un qu'on tutoie", "À marquer une question, comme « est-ce que »", "À exprimer la colère"], answer: 1, explain: "«C'est juste une petite marque qu'on met pour poser une question» — it has nothing to do with the pronoun tu." }
  - { q: "Que signifie « dépanneur » au Québec ?", options: ["Un garagiste", "Une petite épicerie de quartier ouverte tard", "Un restaurant"], answer: 1, explain: "In Québec the dépanneur is the corner shop that 'helps you out'; in France the word means a breakdown mechanic." }
  - { q: "Pourquoi Mélanie dit-elle « courriel » et « fin de semaine » ?", options: ["Parce que les Québécois veulent protéger leur français face à l'anglais", "Parce que ce sont des mots anglais", "Parce que c'est plus court"], answer: 0, explain: "«On se bat pour garder notre français, entouré de millions d'anglophones.»" }
