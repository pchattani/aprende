id: c2.u07
title: "Saudade e fado"
lessons:
  - id: c2.u07.l1
    title: Tenho saudades tuas
    teach: [g.untranslatables]
    vocab: [w.fado, w.fadista, w.guitarra-portuguesa, w.casa-de-fados, w.xaile, w.saudoso, w.desalento, w.sina, w.mimo, w.mimar, w.petisco, w.petiscar, w.tasca, w.boteco, w.guitarrista, w.firmeza, w.cante, w.alentejano, w.tonto]
    tip: "Saudade is longing for someone or something absent, sweet and sad at once. In Portugal you tens saudades (plural); in Brazil you está com saudade or sente saudade."
    sentences:
      - { es: "Tenho saudades tuas, mesmo quando estás no quarto ao lado.", en: "I miss you, even when you're in the next room.", altEs: ["Estou com saudade de você, mesmo quando você está no quarto ao lado.", "Sinto a tua falta, mesmo quando estás no quarto ao lado."], grammar: [g.untranslatables, g.ep-tu-forms], vocab: [w.saudade], variant: "Brazil: estou com saudade de você / sinto saudade de você.", transform: { instruction: "Rewrite it for a Brazilian partner", answer: "Estou com saudade de você, mesmo quando você está no quarto ao lado.", alt: ["Sinto saudade de você, mesmo quando você está no quarto ao lado.", "Estou com saudades de você, mesmo quando você está no quarto ao lado.", "Sinto saudades de você, mesmo quando você está no quarto ao lado."] } }
      - { es: "Saudade não é só nostalgia: pode ter-se saudade de alguém que volta amanhã.", en: "Saudade isn't just nostalgia: you can long for someone who's coming back tomorrow.", altEs: ["Saudade não é só nostalgia: dá para sentir saudade de alguém que volta amanhã."], grammar: [g.untranslatables, g.ep-enclisis], vocab: [w.saudade, w.nostalgia] }
      - { es: "O fado fala de saudade, de ciúme e da sina de quem fica em terra.", en: "Fado sings of longing, of jealousy and of the fate of those left ashore.", altEs: ["O fado fala de saudade, de ciúme e do destino de quem fica em terra."], grammar: [g.untranslatables, g.relative-que-quem], vocab: [w.fado, w.sina, w.ciúme] }
      - { es: "A fadista cantou de olhos fechados, enrolada num xaile preto.", en: "The fado singer sang with her eyes closed, wrapped in a black shawl.", altEs: ["A fadista cantou de olhos fechados, enrolada num xale preto."], grammar: [g.untranslatables, g.past-participles], vocab: [w.fadista, w.xaile, w.preto], note: "xaile (Portugal) / xale (Brazil and also Portugal)." }
      - { es: "Na casa de fados, quando se canta, ninguém fala nem pede a conta.", en: "In the fado house, when someone is singing, nobody talks or asks for the bill.", altEs: ["Na casa de fado, quando alguém canta, ninguém fala nem pede a conta."], grammar: [g.untranslatables, g.indeterminate-subject], vocab: [w.casa-de-fados, w.conta] }
      - { es: "Silêncio, que se vai cantar o fado!", en: "Silence, the fado is about to be sung!", altEs: ["Silêncio, que vai começar o fado!"], grammar: [g.untranslatables, g.se-passive], vocab: [w.silêncio, w.fado], note: "The traditional call before a fado begins." }
      - { es: "O guitarrista afinou a guitarra portuguesa com uma firmeza de relojoeiro.", en: "The guitarist tuned the Portuguese guitar with a watchmaker's precision.", altEs: ["O guitarrista afinou a guitarra portuguesa com a firmeza de um relojoeiro."], grammar: [g.untranslatables, g.literary-devices], vocab: [w.guitarrista, w.guitarra-portuguesa, w.firmeza] }
      - { es: "Ouvi uma canção tão saudosa que me apeteceu ligar à minha avó.", en: "I heard such a wistful song that I felt like calling my grandmother.", altEs: ["Ouvi uma canção tão saudosa que me deu vontade de ligar para a minha avó."], grammar: [g.untranslatables, g.consequence-clauses], vocab: [w.saudoso, w.apetecer, w.canção] }
      - { es: "A saudosa Amália continua a ser a voz do fado em todo o mundo.", en: "The late Amália is still the voice of fado all over the world.", altEs: ["A saudosa Amália continua sendo a voz do fado no mundo inteiro."], grammar: [g.untranslatables, g.ep-aspect-periphrases], vocab: [w.saudoso, w.voz], note: "saudoso before a name = the late, much missed." }
      - { es: "Não confundas saudade com desalento: a saudade ainda tem esperança.", en: "Don't confuse saudade with dejection: saudade still has hope in it.", altEs: ["Não confunda saudade com desalento: a saudade ainda tem esperança."], grammar: [g.untranslatables, g.imperative-negative], vocab: [w.desalento, w.confundir, w.esperança], error: { wrong: "Não confunde saudade com desalento: a saudade ainda tem esperança.", explain: "European Portuguese negative tu command: não confundas (subjunctive). Não confunde is heard in Brazilian speech but not in Portugal.", grammar: g.imperative-negative } }
      - { es: "Em Évora, o cante alentejano é cantado por coros de homens e mulheres, sem instrumentos.", en: "In Évora, cante alentejano is sung by choirs of men and women, without instruments.", altEs: ["Em Évora, o cante alentejano é cantado por grupos de homens e mulheres, sem instrumentos."], grammar: [g.untranslatables, g.passive-ser], vocab: [w.cante, w.alentejano, w.instrumento] }
      - { es: "Depois do fado fomos petiscar a uma tasca perto da Praça do Giraldo.", en: "After the fado we went to have some snacks at a little tavern near Praça do Giraldo.", altEs: ["Depois do fado fomos beliscar alguma coisa num boteco perto da Praça do Giraldo."], grammar: [g.untranslatables, g.preterite-ser-ir], vocab: [w.petiscar, w.tasca, w.boteco], transform: { instruction: "Rewrite it for a friend in Rio", answer: "Depois do fado fomos beliscar alguma coisa num boteco perto da Praça do Giraldo.", alt: ["Depois do fado a gente foi num boteco perto da Praça do Giraldo.", "Depois do fado fomos num boteco perto da Praça do Giraldo comer uns petiscos."] } }
      - { es: "Os petiscos alentejanos são simples: pão, queijo, azeitonas e um copo de tinto.", en: "Alentejo snacks are simple: bread, cheese, olives and a glass of red.", altEs: ["Os petiscos do Alentejo são simples: pão, queijo, azeitonas e um copo de vinho tinto."], grammar: [g.untranslatables], vocab: [w.petisco, w.queijo, w.azeitona] }
      - { es: "A dona da tasca trouxe-nos um doce, por mimo. Não quis que pagássemos.", en: "The tavern owner brought us a dessert as a treat. She wouldn't let us pay.", altEs: ["A dona do boteco nos trouxe um doce de cortesia. Não quis que a gente pagasse."], grammar: [g.untranslatables, g.ep-enclisis, g.subjunctive-imperfect], vocab: [w.mimo, w.doce] }
      - { es: "A minha avó mima toda a gente com comida; é a maneira dela de dizer que gosta de nós.", en: "My grandmother spoils everyone with food; it's her way of saying she loves us.", altEs: ["Minha avó mima todo mundo com comida; é o jeito dela de dizer que gosta da gente."], grammar: [g.untranslatables], vocab: [w.mimar, w.avó] }
      - { es: "Fiquei tonto com o vinho e com a voz dela, não sei bem por que ordem.", en: "I got giddy from the wine and from her voice, I'm not quite sure in which order.", altEs: ["Fiquei tonto com o vinho e com a voz dela, não sei bem em que ordem."], grammar: [g.untranslatables, g.ficar-change-of-state], vocab: [w.tonto, w.voz] }
    exchanges:
      - q: { es: "Tens saudades do Brasil?", en: "Do you miss Brazil?" }
        a: { es: "Tenho, sobretudo da comida e do calor das pessoas.", en: "I do, especially the food and how warm people are." }
        alt: ["Às vezes, sobretudo ao domingo.", "Muita saudade, principalmente da comida."]
        grammar: [g.untranslatables, g.ep-tu-forms]
        vocab: [w.saudade]
      - q: { es: "Como se traduz «saudade» em inglês?", en: "How do you translate 'saudade' into English?" }
        a: { es: "Não se traduz: explica-se, ou deixa-se ficar como está.", en: "You don't translate it: you explain it, or you leave it as it is." }
        alt: ["Com uma frase: 'missing someone deeply'.", "Não tem tradução exata; a gente explica."]
        grammar: [g.untranslatables, g.ep-enclisis]
        vocab: [w.saudade, w.traduzir]
      - q: { es: "Vamos a uma casa de fados hoje?", en: "Shall we go to a fado house tonight?" }
        a: { es: "Vamos, mas reservamos mesa: às sextas enche.", en: "Let's, but we'll book a table: it fills up on Fridays." }
        alt: ["Vamos! Conheço uma em Alfama.", "Bora, mas é melhor reservar."]
        grammar: [g.untranslatables]
        vocab: [w.casa-de-fados]
      - q: { es: "O que é o cante alentejano?", en: "What is cante alentejano?" }
        a: { es: "É um canto coral, lento, sem instrumentos, que fala da planície e do trabalho.", en: "It's slow choral singing, without instruments, about the plains and work." }
        alt: ["Um canto do Alentejo, sem instrumentos.", "É Património da Humanidade desde 2014, como o fado."]
        grammar: [g.untranslatables, g.relative-que-quem]
        vocab: [w.cante, w.planície]
      - q: { es: "Queres petiscar alguma coisa?", en: "Do you fancy a bite to eat?" }
        a: { es: "Queria uns pastéis de bacalhau e um copo de branco, se faz favor.", en: "I'd like some cod fritters and a glass of white, please." }
        alt: ["Pode ser um queijinho e azeitonas.", "Quero, uns bolinhos de bacalhau e uma taça de vinho branco, por favor."]
        grammar: [g.untranslatables, g.ep-imperfect-for-conditional]
        vocab: [w.petiscar, w.bacalhau]
    texts:
      - title: "Programa da noite"
        es: ["Casa de Fados da Mouraria — sexta-feira, 21h30.", "Fadista convidada, com guitarra portuguesa e viola.", "Durante as atuações pede-se silêncio absoluto."]
        en: ["Mouraria Fado House — Friday, 9.30 pm.", "Guest fado singer, with Portuguese guitar and classical guitar.", "Absolute silence is requested during the performances."]
        grammar: [g.untranslatables, g.se-passive]
        vocab: [w.casa-de-fados, w.fadista, w.guitarra-portuguesa]
      - title: "Postal de Évora"
        es: ["Querida mãe, ontem ouvi cante numa tasca e chorei sem saber porquê.", "Aqui a planície é enorme e o tempo anda devagar.", "Tenho saudades tuas e do teu arroz doce."]
        en: ["Dear Mum, yesterday I heard cante in a tavern and cried without knowing why.", "Here the plain is huge and time moves slowly.", "I miss you and your rice pudding."]
        grammar: [g.untranslatables, g.ep-tu-forms]
        vocab: [w.cante, w.tasca, w.planície, w.saudade]
    spicy:
      - { es: "Ainda nem bazaste e já tenho saudades tuas. Isto é grave?", en: "You haven't even left yet and I already miss you. Is this serious?", altEs: ["Você nem foi embora e já estou com saudade. Isso é grave?"], grammar: [g.untranslatables, g.ep-tu-forms], vocab: [w.saudade, w.bazar] }
      - { es: "A fadista cantou sobre um amor impossível e tu olhaste para mim. Explica-te.", en: "The fado singer sang about an impossible love and you looked at me. Explain yourself.", altEs: ["A fadista cantou sobre um amor impossível e você olhou para mim. Se explica."], grammar: [g.untranslatables, g.ep-enclisis, g.ep-imperative-tu], vocab: [w.fadista] }
      - { es: "Mima-me hoje, que amanhã sou eu que te levo a petiscar.", en: "Spoil me today, and tomorrow I'll be the one taking you out for snacks.", altEs: ["Me mima hoje, que amanhã sou eu que te levo para petiscar."], grammar: [g.untranslatables, g.ep-enclisis, g.ep-imperative-tu], vocab: [w.mimar, w.petiscar] }
      - { es: "Trouxe-te um xaile, não por causa do frio: é só uma desculpa para te abraçar.", en: "I brought you a shawl, not because of the cold: it's just an excuse to put my arms around you.", altEs: ["Te trouxe um xale, não por causa do frio: é só uma desculpa para te abraçar."], grammar: [g.untranslatables, g.ep-enclisis], vocab: [w.xaile, w.abraçar] }
      - { es: "Se a minha sina é ficar tonto cada vez que sorris, aceito-a de bom grado.", en: "If my fate is to go weak at the knees every time you smile, I accept it gladly.", altEs: ["Se o meu destino é ficar tonto toda vez que você sorri, eu aceito de bom grado."], grammar: [g.untranslatables, g.ep-enclisis], vocab: [w.sina, w.tonto] }
  - id: c2.u07.l2
    title: Traduzir sem trair
    teach: [g.translation-nuance]
    vocab: [w.tradução, w.tradutor, w.intérprete, w.interpretação, w.equivalente, w.equivalência, w.literal, w.literalmente, w.intraduzível, w.conotação, w.denotação, w.fidelidade, w.glossário, w.verbete, w.acepção, w.sinônimo, w.antônimo, w.polissemia, w.contentamento, w.descontente, w.trair, w.candidatar-se, w.lar]
    tip: "Watch the calques: realizar is 'carry out', not 'realise' (perceber / dar-se conta); assumir is 'take on', not 'assume' (supor); aplicar para is English, candidatar-se a is Portuguese."
    sentences:
      - { es: "Traduzir é sempre um pouco trair, dizem os italianos.", en: "To translate is always to betray a little, as the Italians say.", altEs: ["Traduzir é sempre trair um pouco, como dizem os italianos."], grammar: [g.translation-nuance], vocab: [w.traduzir, w.trair], note: "Traduttore, traditore." }
      - { es: "Uma tradução literal de «it's raining cats and dogs» não faz sentido nenhum.", en: "A literal translation of 'it's raining cats and dogs' makes no sense at all.", altEs: ["Uma tradução literal de «it's raining cats and dogs» não faz o menor sentido."], grammar: [g.translation-nuance, g.idioms], vocab: [w.tradução, w.literal, w.sentido] }
      - { es: "O equivalente português é «está a chover a potes».", en: "The Portuguese equivalent is 'está a chover a potes'.", altEs: ["O equivalente brasileiro é «está chovendo canivete»."], grammar: [g.translation-nuance, g.ep-estar-a-infinitive], vocab: [w.equivalente, w.chover], note: "Brazil: está chovendo canivete / caindo um toró." }
      - { es: "Candidatei-me a uma vaga de tradutor em Évora.", en: "I applied for a translator's job in Évora.", altEs: ["Me candidatei a uma vaga de tradutor em Évora."], grammar: [g.translation-nuance, g.ep-enclisis], vocab: [w.candidatar-se, w.vaga, w.tradutor], error: { wrong: "Apliquei para uma vaga de tradutor em Évora.", explain: "Aplicar para is a calque of 'apply for'. In Portuguese you candidatas-te a uma vaga.", grammar: g.translation-nuance } }
      - { es: "Só no fim da reunião é que percebi que estava na sala errada.", en: "Only at the end of the meeting did I realise I was in the wrong room.", altEs: ["Só no fim da reunião me dei conta de que estava na sala errada."], grammar: [g.translation-nuance, g.emphatic-structures], vocab: [w.perceber, w.reunião], error: { wrong: "Só no fim da reunião é que realizei que estava na sala errada.", explain: "Realizar means 'to carry out'. For 'realise' use perceber or dar-se conta de.", grammar: g.translation-nuance } }
      - { es: "Partimos do princípio de que todos leram o glossário.", en: "We're assuming everyone has read the glossary.", altEs: ["Supomos que todos leram o glossário."], grammar: [g.translation-nuance], vocab: [w.glossário, w.princípio], transform: { instruction: "Say it with supor instead", answer: "Supomos que todos leram o glossário.", alt: ["Suponho que todos leram o glossário.", "Supomos que todos tenham lido o glossário."] } }
      - { es: "Em Portugal, «perceber» quer dizer entender; no Brasil, é mais notar.", en: "In Portugal, 'perceber' means to understand; in Brazil, it's more to notice.", altEs: ["Em Portugal, «perceber» significa entender; no Brasil, é mais notar."], grammar: [g.translation-nuance, g.ep-false-friends], vocab: [w.perceber, w.notar] }
      - { es: "Não percebi a pergunta. Podes repeti-la?", en: "I didn't understand the question. Can you repeat it?", altEs: ["Não entendi a pergunta. Pode repetir?", "Não percebi a pergunta. Podes repetir?"], grammar: [g.translation-nuance, g.ep-enclisis, g.ep-tu-forms], vocab: [w.perceber, w.repetir], transform: { instruction: "Rewrite it the Brazilian way", answer: "Não entendi a pergunta. Você pode repetir?", alt: ["Não entendi a pergunta. Pode repetir?", "Não entendi a pergunta. Você pode repetir ela?"] } }
      - { es: "A palavra «manga» tem várias aceções: é polissemia, não erro do dicionário.", en: "The word 'manga' has several senses: that's polysemy, not a dictionary mistake.", altEs: ["A palavra «manga» tem várias acepções: é polissemia, não erro do dicionário."], grammar: [g.translation-nuance], vocab: [w.acepção, w.polissemia, w.dicionário], note: "aceção (Portugal) / acepção (Brazil)." }
      - { es: "Antes de traduzir, lê o verbete inteiro e não só a primeira aceção.", en: "Before translating, read the whole dictionary entry and not just the first sense.", altEs: ["Antes de traduzir, leia o verbete inteiro e não só a primeira acepção."], grammar: [g.translation-nuance, g.ep-imperative-tu], vocab: [w.verbete, w.acepção] }
      - { es: "«Casa» e «lar» são sinónimos na denotação, mas a conotação de «lar» é mais afetiva.", en: "'Casa' and 'lar' are synonyms in denotation, but the connotation of 'lar' is more affectionate.", altEs: ["«Casa» e «lar» são sinônimos na denotação, mas a conotação de «lar» é mais afetiva."], grammar: [g.translation-nuance], vocab: [w.sinônimo, w.denotação, w.conotação, w.lar], note: "sinónimo (Portugal) / sinônimo (Brazil)." }
      - { es: "O antónimo de «contentamento» é descontentamento, mas Camões juntou os dois.", en: "The antonym of 'contentment' is discontent, but Camões put the two together.", altEs: ["O antônimo de «contentamento» é descontentamento, mas Camões juntou os dois."], grammar: [g.translation-nuance, g.literary-devices], vocab: [w.antônimo, w.contentamento, w.descontente] }
      - { es: "Entre fidelidade ao texto e naturalidade, a boa tradução encontra uma equivalência.", en: "Between faithfulness to the text and naturalness, a good translation finds an equivalence.", altEs: ["Entre a fidelidade ao texto e a naturalidade, uma boa tradução encontra uma equivalência."], grammar: [g.translation-nuance], vocab: [w.fidelidade, w.equivalência] }
      - { es: "Há quem diga que «saudade» é intraduzível; eu diria que é só difícil.", en: "Some people say 'saudade' is untranslatable; I'd say it's just difficult.", altEs: ["Tem gente que diz que «saudade» é intraduzível; eu diria que é só difícil."], grammar: [g.translation-nuance, g.relative-subjunctive, g.conditional-simple], vocab: [w.intraduzível, w.saudade] }
      - { es: "Literalmente, «bom proveito» seria «good profit», mas quer dizer «enjoy your meal».", en: "Literally, 'bom proveito' would be 'good profit', but it means 'enjoy your meal'.", altEs: ["Ao pé da letra, «bom proveito» seria «good profit», mas significa «enjoy your meal»."], grammar: [g.translation-nuance, g.untranslatables], vocab: [w.literalmente, w.proveito] }
      - { es: "A interpretação da fadista deu um sentido novo a um fado antigo.", en: "The fado singer's interpretation gave new meaning to an old fado.", altEs: ["A interpretação da fadista deu um novo sentido a um fado antigo."], grammar: [g.translation-nuance], vocab: [w.interpretação, w.fadista, w.sentido] }
    exchanges:
      - q: { es: "Como traduzirias «I'm supposed to be at work»?", en: "How would you translate 'I'm supposed to be at work'?" }
        a: { es: "«Era suposto estar no trabalho», em Portugal; no Brasil, «Eu devia estar no trabalho».", en: "'Era suposto estar no trabalho' in Portugal; in Brazil, 'Eu devia estar no trabalho'." }
        alt: ["«Devia estar no trabalho.»", "Eu diria «Era para eu estar no trabalho»."]
        grammar: [g.translation-nuance, g.conditional-simple]
        vocab: [w.traduzir]
      - q: { es: "Percebeste a piada?", en: "Did you get the joke?" }
        a: { es: "Percebi, mas não tem graça nenhuma em inglês.", en: "I got it, but it isn't funny at all in English." }
        alt: ["Não, explica-ma.", "Entendi, mas em inglês perde a graça."]
        grammar: [g.translation-nuance, g.ep-tu-forms]
        vocab: [w.perceber, w.piada]
      - q: { es: "Que dicionário usas para traduzir?", en: "Which dictionary do you use for translating?" }
        a: { es: "Um bilingue e um de sinónimos; e confirmo sempre as aceções no contexto.", en: "A bilingual one and a thesaurus; and I always check the senses in context." }
        alt: ["O da Academia, e um de sinónimos.", "Um bilíngue e um de sinônimos."]
        grammar: [g.translation-nuance, g.ep-tu-forms]
        vocab: [w.dicionário, w.sinônimo, w.acepção]
      - q: { es: "A tradução está fiel ao original?", en: "Is the translation faithful to the original?" }
        a: { es: "Fiel no sentido, não na letra: os jogos de palavras tiveram de mudar.", en: "Faithful in meaning, not to the letter: the wordplay had to change." }
        alt: ["No sentido, sim; palavra a palavra, não.", "É fiel, mas não é literal."]
        grammar: [g.translation-nuance]
        vocab: [w.tradução, w.fiel]
      - q: { es: "Precisas de intérprete para a reunião?", en: "Do you need an interpreter for the meeting?" }
        a: { es: "Não, eles falam português; só preciso de rever o glossário técnico.", en: "No, they speak Portuguese; I just need to go over the technical glossary." }
        alt: ["Preciso, a reunião é em mandarim.", "Não precisa, eles falam português."]
        grammar: [g.translation-nuance, g.ep-tu-forms]
        vocab: [w.intérprete, w.glossário]
    texts:
      - title: "Nota do tradutor"
        es: ["Mantive «saudade» em português e expliquei-a uma vez, no prefácio.", "Os termos de fado estão no glossário final.", "Onde a tradução literal soava falsa, preferi uma equivalência natural."]
        en: ["I kept 'saudade' in Portuguese and explained it once, in the preface.", "Fado terms are in the glossary at the end.", "Where a literal translation sounded false, I preferred a natural equivalent."]
        grammar: [g.translation-nuance, g.untranslatables]
        vocab: [w.tradutor, w.glossário, w.literal, w.equivalência]
      - title: "Anúncio de emprego"
        es: ["Procura-se tradutor de inglês para português europeu.", "Os candidatos devem dominar as duas normas e evitar decalques do inglês.", "Enviar candidatura e duas traduções de exemplo até dia 15."]
        en: ["Wanted: translator from English into European Portuguese.", "Candidates must master both norms and avoid calques from English.", "Send your application and two sample translations by the 15th."]
        grammar: [g.translation-nuance, g.se-passive]
        vocab: [w.tradutor, w.tradução, w.candidatura]
    spicy:
      - { es: "Não há tradução literal para o que sinto quando entras na sala.", en: "There's no literal translation for what I feel when you walk into the room.", altEs: ["Não tem tradução literal para o que eu sinto quando você entra na sala."], grammar: [g.translation-nuance, g.ep-tu-forms], vocab: [w.tradução, w.literal] }
      - { es: "Percebi tudo o que disseste, mas fiquei a olhar para os teus lábios.", en: "I understood everything you said, but I ended up staring at your lips.", altEs: ["Entendi tudo o que você disse, mas fiquei olhando para a sua boca."], grammar: [g.translation-nuance, g.ep-aspect-periphrases], vocab: [w.perceber] }
      - { es: "És intraduzível: em nenhuma língua há palavra para esse sorriso.", en: "You're untranslatable: there's no word for that smile in any language.", altEs: ["Você é intraduzível: em nenhuma língua tem palavra para esse sorriso."], grammar: [g.translation-nuance, g.ep-tu-forms], vocab: [w.intraduzível, w.sorriso] }
      - { es: "Eu sei que «crush» não tem equivalente em português, mas tu tens nome.", en: "I know 'crush' has no equivalent in Portuguese, but you've got a name.", altEs: ["Eu sei que «crush» não tem equivalente em português, mas você tem nome."], grammar: [g.translation-nuance, g.ep-tu-forms], vocab: [w.crush, w.equivalente] }
  - id: c2.u07.l3
    title: Fixe, bué, cena — legal, massa, cara
    teach: [g.slang-br-pt]
    vocab: [w.calão, w.jargão, w.mó, w.treta, w.baril, w.véi, w.parça, w.crush, w.cringe, w.desconfiómetro, w.de-boa, w.trampo, w.rango, w.breja, w.busão, w.bazar, w.chunga, w.foleiro, w.piroso, w.brega, w.cafona, w.beto, w.mauricinho, w.patricinha, w.farra, w.fossa, w.ressaca, w.ginga, w.molejo, w.farofeiro, w.briga, w.namoro, w.pejorativo]
    tip: "Slang marks age and region: recognise it before you use it. Treta is nonsense in Lisbon but a row in São Paulo; cena is 'thing' to young Portuguese and only 'scene' in Brazil."
    sentences:
      - { es: "Ya, o concerto foi bué fixe!", en: "Yeah, the concert was really cool!", altEs: ["É, o show foi muito legal!", "Ya, o concerto foi baril!"], grammar: [g.slang-br-pt], vocab: [w.bué, w.fixe, w.concerto], variant: "Brazil: É, o show foi muito legal / foi massa." }
      - { es: "Pá, isso é tudo treta; não acredites nele.", en: "Mate, that's all rubbish; don't believe him.", altEs: ["Cara, isso é tudo conversa fiada; não acredita nele."], grammar: [g.slang-br-pt, g.imperative-negative], vocab: [w.pá, w.treta], note: "In Brazil treta means a fight or drama, not nonsense." }
      - { es: "No Brasil, «deu treta» quer dizer que houve briga.", en: "In Brazil, 'deu treta' means there was a fight.", altEs: ["No Brasil, «deu treta» significa que rolou briga."], grammar: [g.slang-br-pt, g.ep-false-friends], vocab: [w.treta, w.briga] }
      - { es: "Véi, esse rolê foi mó legal!", en: "Dude, that outing was so cool!", altEs: ["Pá, essa saída foi bué fixe!"], grammar: [g.slang-br-pt], vocab: [w.véi, w.mó], note: "Véi: Brasília and Goiás; mó: São Paulo." }
      - { es: "Amanhã tenho trampo cedo, por isso hoje fico de boa em casa.", en: "I've got work early tomorrow, so tonight I'm chilling at home.", altEs: ["Amanhã trabalho cedo, por isso hoje fico na boa em casa."], grammar: [g.slang-br-pt], vocab: [w.trampo, w.de-boa] }
      - { es: "Bora pegar o busão e comer um rango antes da breja?", en: "Shall we catch the bus and grab some grub before a beer?", altEs: ["Bora apanhar o autocarro e comer qualquer coisa antes de uma imperial?"], grammar: [g.slang-br-pt, g.ep-vocabulary-differences], vocab: [w.busão, w.rango, w.breja], transform: { instruction: "Say it the Lisbon way", answer: "Bora apanhar o autocarro e comer qualquer coisa antes de uma imperial?", alt: ["Vamos apanhar o autocarro e petiscar qualquer coisa antes de uma imperial?"] } }
      - { es: "Já é tarde, vou bazar.", en: "It's late, I'm off.", altEs: ["Já é tarde, vou vazar.", "Já é tarde, vou embora."], grammar: [g.slang-br-pt], vocab: [w.bazar], transform: { instruction: "Say it with Brazilian slang", answer: "Já é tarde, vou vazar.", alt: ["Já é tarde, vou nessa.", "Já é tarde, vou meter o pé."] } }
      - { es: "Aquele bar é um bocado chunga, e a música é foleira.", en: "That bar is a bit dodgy, and the music is naff.", altEs: ["Aquele bar é meio estranho, e a música é brega."], grammar: [g.slang-br-pt, g.adjective-agreement], vocab: [w.chunga, w.foleiro], error: { wrong: "Aquele bar é um bocado chunga, e a música é foleiro.", explain: "Slang adjectives still agree: a música é foleira. (Chunga is invariable.)", grammar: g.slang-br-pt } }
      - { es: "Um anão de jardim com óculos de sol é piroso em Lisboa e cafona em São Paulo.", en: "A garden gnome with sunglasses is kitsch in Lisbon and tacky in São Paulo.", altEs: ["Um anão de jardim com óculos escuros é brega em Lisboa e cafona em São Paulo."], grammar: [g.slang-br-pt], vocab: [w.piroso, w.cafona, w.brega] }
      - { es: "Ele arma-se em beto, mas veio de autocarro.", en: "He acts all posh, but he came by bus.", altEs: ["Ele banca o mauricinho, mas veio de ônibus."], grammar: [g.slang-br-pt, g.ep-enclisis], vocab: [w.beto, w.mauricinho] }
      - { es: "As patricinhas do condomínio só falam de compras.", en: "The posh girls in the gated community only talk about shopping.", altEs: ["As betinhas do condomínio só falam de compras."], grammar: [g.slang-br-pt], vocab: [w.patricinha, w.compras] }
      - { es: "Depois da farra de sábado, passei o domingo de ressaca.", en: "After Saturday's partying, I spent Sunday hungover.", altEs: ["Depois da farra de sábado, passei o domingo de ressaca no sofá."], grammar: [g.slang-br-pt], vocab: [w.farra, w.ressaca] }
      - { es: "Desde que ela acabou o namoro, ele está na fossa.", en: "Since she ended the relationship, he's been down in the dumps.", altEs: ["Desde que ela terminou o namoro, ele está na fossa.", "Desde que ela acabou o namoro, ele anda em baixo."], grammar: [g.slang-br-pt], vocab: [w.fossa, w.namoro] }
      - { es: "Tem desconfiómetro, pá: estão todos à espera que te vás embora.", en: "Read the room, mate: everyone's waiting for you to leave.", altEs: ["Se toca, cara: todo mundo está esperando você ir embora.", "Liga o desconfiômetro, cara: todo mundo está esperando você ir embora."], grammar: [g.slang-br-pt, g.ep-estar-a-infinitive], vocab: [w.desconfiómetro], note: "desconfiómetro (Portugal spelling) / desconfiômetro (Brazil)." }
      - { es: "Chamar «farofeiro» a alguém é pejorativo: não o digas na praia.", en: "Calling someone a 'farofeiro' is pejorative: don't say it on the beach.", altEs: ["Chamar alguém de «farofeiro» é pejorativo: não fale isso na praia."], grammar: [g.slang-br-pt, g.ep-proclisis-attractors], vocab: [w.farofeiro, w.pejorativo] }
      - { es: "O calão muda depressa; o jargão dos médicos, nem tanto.", en: "Slang changes fast; doctors' jargon, not so much.", altEs: ["A gíria muda rápido; o jargão dos médicos, nem tanto."], grammar: [g.slang-br-pt], vocab: [w.calão, w.jargão] }
    exchanges:
      - q: { es: "Então, como foi a festa?", en: "So, how was the party?" }
        a: { es: "Baril! Estava bué de gente e a malta só saiu às cinco.", en: "Brilliant! There were loads of people and the gang only left at five." }
        alt: ["Fixe, mas acabou cedo.", "Massa! Tinha muita gente e a galera só foi embora às cinco."]
        grammar: [g.slang-br-pt]
        vocab: [w.baril, w.bué, w.malta]
      - q: { es: "Quem é aquele teu parça?", en: "Who's that buddy of yours?" }
        a: { es: "É o Duda, meu parça desde o colégio. Gente boa!", en: "That's Duda, my buddy since school. Good guy!" }
        alt: ["Um amigo de São Paulo.", "É o Duda, um amigo do trabalho."]
        grammar: [g.slang-br-pt]
        vocab: [w.parça]
      - q: { es: "Achaste o discurso dele cringe?", en: "Did you find his speech cringeworthy?" }
        a: { es: "Um bocado: ninguém se riu das piadas dele.", en: "A bit: nobody laughed at his jokes." }
        alt: ["Bué cringe.", "Muito cringe, ninguém riu."]
        grammar: [g.slang-br-pt, g.ep-tu-forms]
        vocab: [w.cringe, w.piada]
      - q: { es: "Que tal o rango?", en: "How's the grub?" }
        a: { es: "Uma delícia! Mas a breja está quente.", en: "Delicious! But the beer's warm." }
        alt: ["Top!", "Está ótimo, mas a imperial está quente."]
        grammar: [g.slang-br-pt]
        vocab: [w.rango, w.breja]
      - q: { es: "Estás bem? Pareces em baixo.", en: "Are you OK? You seem down." }
        a: { es: "Estou na fossa: a minha crush começou a namorar com outro.", en: "I'm in the dumps: my crush has started going out with someone else." }
        alt: ["Na boa, é só cansaço.", "Tô na fossa, minha crush começou a namorar outro."]
        grammar: [g.slang-br-pt, g.ep-tu-forms]
        vocab: [w.fossa, w.crush]
    texts:
      - title: "Mensagem de voz transcrita"
        es: ["Pá, estou atrasado, o autocarro avariou.", "Guarda-me um lugar no concerto, que eu chego já.", "E não te armes em beto: compra-me uma imperial!"]
        en: ["Mate, I'm late, the bus broke down.", "Save me a spot at the concert, I'll be right there.", "And don't play the posh boy: buy me a beer!"]
        grammar: [g.slang-br-pt, g.ep-enclisis, g.ep-imperative-tu]
        vocab: [w.pá, w.avariar, w.concerto, w.beto]
      - title: "Comentário num vídeo"
        es: ["Véi, que vídeo mó brega!", "A música é cafona, mas o moleque tem ginga.", "Já vi umas cinquenta vezes e não me arrependo."]
        en: ["Dude, what a cheesy video!", "The music is tacky, but the kid has got moves.", "I've watched it about fifty times and I have no regrets."]
        grammar: [g.slang-br-pt]
        vocab: [w.véi, w.mó, w.brega, w.cafona, w.ginga]
    spicy:
      - { es: "És a minha crush oficial, mesmo que isso soe bué cringe.", en: "You're my official crush, even if that sounds really cringey.", altEs: ["Você é minha crush oficial, mesmo que isso soe mó cringe."], grammar: [g.slang-br-pt, g.subjunctive-nuance], vocab: [w.crush, w.cringe, w.bué] }
      - { es: "Não é treta: dançaste com tanta ginga que o DJ se esqueceu de mudar de música.", en: "No kidding: you danced with so much swing that the DJ forgot to change the song.", altEs: ["Sem brincadeira: você dançou com tanto molejo que o DJ se esqueceu de trocar a música."], grammar: [g.slang-br-pt, g.consequence-clauses], vocab: [w.treta, w.ginga, w.molejo] }
      - { es: "A frase de engate foi um bocado pirosa, admito, mas resultou.", en: "The chat-up line was a bit cheesy, I admit, but it worked.", altEs: ["A cantada foi meio brega, admito, mas funcionou.", "A frase de engate foi um bocado foleira, admito, mas resultou."], grammar: [g.slang-br-pt], vocab: [w.piroso, w.brega] }
      - { es: "Depois da farra, prometeste-me um pequeno-almoço. A ressaca não é desculpa.", en: "After the night out you promised me breakfast. A hangover is no excuse.", altEs: ["Depois da farra, você me prometeu um café da manhã. Ressaca não é desculpa."], grammar: [g.slang-br-pt, g.ep-enclisis], vocab: [w.farra, w.ressaca] }
      - { es: "Liga o desconfiómetro: se ainda estou aqui às três da manhã, não é pela breja.", en: "Read the signs: if I'm still here at three in the morning, it's not for the beer.", altEs: ["Liga o desconfiômetro: se eu ainda estou aqui às três da manhã, não é pela cerveja."], grammar: [g.slang-br-pt, g.ep-imperative-tu], vocab: [w.desconfiómetro, w.breja] }
  - id: c2.u07.l4
    title: Arraiais, romarias e planícies
    teach: [g.untranslatables, g.translation-nuance]
    vocab: [w.miradouro, w.mirante, w.calçada-portuguesa, w.colina, w.funicular, w.ascensor, w.santos-populares, w.manjerico, w.sardinhada, w.arraial, w.romaria, w.procissão, w.peregrinação, w.peregrino, w.santuário, w.lagar, w.olival, w.sobreiro, w.cortiça, w.planície, w.socalco, w.rabelo, w.ribeira, w.cais, w.estuário, w.lota, w.varina, w.filigrana, w.olaria, w.suave, w.bairrismo, w.templo, w.osso]
    tip: "Words like arraial, romaria and manjerico carry a whole festival with them: when translating, keep the word and add a short gloss rather than flattening it into 'party' or 'basil'."
    sentences:
      - { es: "Em junho, Lisboa enche-se de arraiais para os Santos Populares.", en: "In June, Lisbon fills up with street parties for the Popular Saints.", altEs: ["Em junho, Lisboa se enche de arraiais para os Santos Populares."], grammar: [g.untranslatables, g.ep-enclisis], vocab: [w.arraial, w.santos-populares], transform: { instruction: "Rewrite it with Brazilian clitic placement", answer: "Em junho, Lisboa se enche de arraiais para os Santos Populares.", alt: [] } }
      - { es: "No Santo António dá-se um manjerico com uma quadra e um cravo de papel.", en: "On St Anthony's Day you give a pot of basil with a little poem and a paper carnation.", altEs: ["No Santo Antônio se dá um manjericão num vaso com uma quadrinha e um cravo de papel."], grammar: [g.untranslatables, g.ep-enclisis, g.indeterminate-subject], vocab: [w.manjerico, w.cravo] }
      - { es: "Cheira a sardinha assada em todo o bairro: é noite de sardinhada.", en: "The whole neighbourhood smells of grilled sardines: it's sardine-barbecue night.", altEs: ["O bairro inteiro está com cheiro de sardinha assada: é noite de sardinhada."], grammar: [g.untranslatables], vocab: [w.sardinhada, w.sardinha, w.cheirar] }
      - { es: "Traduzir «arraial» por «party» é perder metade do sentido.", en: "Translating 'arraial' as 'party' loses half the meaning.", altEs: ["Traduzir «arraial» como «party» é perder metade do sentido."], grammar: [g.translation-nuance, g.untranslatables], vocab: [w.arraial, w.traduzir], transform: { instruction: "Turn it into advice with não + tu command", answer: "Não traduzas «arraial» por «party»: perdes metade do sentido.", alt: ["Não traduza «arraial» como «party»: você perde metade do sentido."] } }
      - { es: "Subimos a colina de funicular e descemos a pé pela calçada portuguesa.", en: "We went up the hill by funicular and walked down over the Portuguese pavement.", altEs: ["Subimos a colina de bondinho e descemos a pé pela calçada portuguesa."], grammar: [g.untranslatables], vocab: [w.colina, w.funicular, w.calçada-portuguesa], note: "In Lisbon these funiculars are called ascensores or elevadores." }
      - { es: "Do miradouro vê-se o Tejo inteiro; no Rio diríamos mirante.", en: "From the viewpoint you can see the whole Tagus; in Rio we'd say mirante.", altEs: ["Do mirante dá para ver o Tejo inteiro."], grammar: [g.translation-nuance, g.ep-enclisis, g.conditional-simple], vocab: [w.miradouro, w.mirante], error: { wrong: "Do miradouro se vê o Tejo inteiro; no Rio diríamos mirante.", explain: "In European Portuguese, with no word attracting the pronoun, it follows the verb: vê-se. Se vê is the Brazilian order.", grammar: g.ep-enclisis } }
      - { es: "Milhares de peregrinos fazem a pé o caminho até ao santuário de Fátima.", en: "Thousands of pilgrims walk all the way to the shrine at Fátima.", altEs: ["Milhares de peregrinos fazem a pé o caminho até o santuário de Fátima."], grammar: [g.untranslatables], vocab: [w.peregrino, w.santuário, w.caminho] }
      - { es: "A peregrinação de maio inclui uma procissão de velas à noite.", en: "The May pilgrimage includes a candlelight procession at night.", altEs: ["A peregrinação de maio tem uma procissão de velas à noite."], grammar: [g.untranslatables], vocab: [w.peregrinação, w.procissão, w.vela] }
      - { es: "Uma romaria minhota é ao mesmo tempo missa, feira e baile.", en: "A pilgrimage festival in the Minho is mass, fair and dance all at once.", altEs: ["Uma romaria do Minho é ao mesmo tempo missa, feira e baile."], grammar: [g.untranslatables, g.translation-nuance], vocab: [w.romaria, w.feira, w.baile] }
      - { es: "Na planície alentejana, os sobreiros dão sombra aos porcos pretos.", en: "On the Alentejo plain, the cork oaks give shade to the black pigs.", altEs: ["Na planície do Alentejo, os sobreiros fazem sombra para os porcos pretos."], grammar: [g.untranslatables], vocab: [w.planície, w.sobreiro, w.sombra, w.porco] }
      - { es: "Portugal produz cerca de metade da cortiça do mundo.", en: "Portugal produces about half of the world's cork.", altEs: ["Portugal produz mais ou menos metade da cortiça do mundo."], grammar: [g.untranslatables], vocab: [w.cortiça, w.produzir] }
      - { es: "Em novembro, as azeitonas do olival vão para o lagar e transformam-se em azeite.", en: "In November, the olives from the grove go to the press and are turned into oil.", altEs: ["Em novembro, as azeitonas do olival vão para o lagar e viram azeite.", "Em novembro, as azeitonas do olival vão para o lagar e se transformam em azeite."], grammar: [g.untranslatables], vocab: [w.olival, w.lagar, w.azeite] }
      - { es: "Em Évora há um templo romano e uma capela forrada de ossos.", en: "In Évora there's a Roman temple and a chapel lined with bones.", altEs: ["Em Évora tem um templo romano e uma capela forrada de ossos."], grammar: [g.untranslatables, g.tem-there-is], vocab: [w.templo, w.osso, w.capela] }
      - { es: "As olarias de São Pedro do Corval vendem pratos pintados à mão.", en: "The potteries of São Pedro do Corval sell hand-painted plates.", altEs: ["As olarias de São Pedro do Corval vendem pratos pintados a mão."], grammar: [g.untranslatables], vocab: [w.olaria, w.prato] }
      - { es: "Os brincos de filigrana são feitos de fio de ouro finíssimo.", en: "Filigree earrings are made of very fine gold thread.", altEs: ["Os brincos de filigrana são feitos com fio de ouro finíssimo."], grammar: [g.untranslatables, g.passive-ser], vocab: [w.filigrana, w.brinco, w.ouro] }
      - { es: "As varinas vendiam o peixe da lota de canasta à cabeça.", en: "The fishwives sold fish from the auction with baskets on their heads.", altEs: ["As varinas vendiam o peixe da lota com a cesta na cabeça."], grammar: [g.untranslatables, g.imperfect], vocab: [w.varina, w.lota, w.peixe] }
    exchanges:
      - q: { es: "O que é um manjerico?", en: "What's a manjerico?" }
        a: { es: "Um vasinho de manjericão que se oferece no Santo António, com uma quadra.", en: "A little pot of basil you give on St Anthony's Day, with a short poem." }
        alt: ["É manjericão num vaso, para os Santos Populares.", "Uma planta que se dá em junho."]
        grammar: [g.untranslatables, g.ep-enclisis]
        vocab: [w.manjerico]
      - q: { es: "Vais ao arraial de Alfama?", en: "Are you going to the Alfama street party?" }
        a: { es: "Vou, mas só depois do jantar; antes da meia-noite aquilo ainda está vazio.", en: "I am, but only after dinner; before midnight it's still empty." }
        alt: ["Claro, não perco uma sardinhada!", "Vou, a gente se encontra lá."]
        grammar: [g.untranslatables, g.ep-tu-forms]
        vocab: [w.arraial]
      - q: { es: "Como se diz «miradouro» no Brasil?", en: "How do you say 'miradouro' in Brazil?" }
        a: { es: "Mirante. Mas qualquer brasileiro percebe miradouro.", en: "Mirante. But any Brazilian understands miradouro." }
        alt: ["Mirante.", "Lá se diz mirante."]
        grammar: [g.translation-nuance]
        vocab: [w.miradouro, w.mirante]
      - q: { es: "Os lisboetas são muito bairristas?", en: "Are people from Lisbon very attached to their neighbourhoods?" }
        a: { es: "Muito: o bairrismo nos Santos Populares é quase uma competição.", en: "Very: the local pride during the Popular Saints is almost a competition." }
        alt: ["Bastante, sobretudo em junho.", "São, mas os do Porto ainda mais!"]
        grammar: [g.untranslatables]
        vocab: [w.bairrismo]
      - q: { es: "Que vinho me recomenda?", en: "Which wine would you recommend?" }
        a: { es: "Um tinto do Alentejo: é suave e vai bem com os petiscos.", en: "A red from the Alentejo: it's smooth and goes well with the snacks." }
        alt: ["Este branco, que é suave.", "Um tinto alentejano, bem suave."]
        grammar: [g.untranslatables, g.imperative-formal]
        vocab: [w.suave]
    texts:
      - title: "Guia de Évora"
        es: ["Comece pelo Templo Romano, no ponto mais alto da cidade.", "Desça depois até à Capela dos Ossos, junto à Igreja de São Francisco.", "Ao fim da tarde, suba ao miradouro e veja a planície ficar dourada."]
        en: ["Start at the Roman Temple, at the highest point of the city.", "Then go down to the Chapel of Bones, beside the Church of São Francisco.", "Late in the afternoon, go up to the viewpoint and watch the plain turn golden."]
        grammar: [g.imperative-formal, g.untranslatables]
        vocab: [w.templo, w.osso, w.miradouro, w.planície]
      - title: "Quadra de Santo António"
        es: ["Manjerico, manjerico,", "Que te dou de coração:", "Se não me deres um beijo,", "Dá-me ao menos a tua mão."]
        en: ["Little basil, little basil,", "That I give you from my heart:", "If you won't give me a kiss,", "At least give me your hand."]
        grammar: [g.untranslatables, g.future-subjunctive-se, g.ep-enclisis]
        vocab: [w.manjerico, w.beijo]
    spicy:
      - { es: "Ofereci-te um manjerico com uma quadra. Lê-a com atenção: a rima é uma proposta.", en: "I gave you a pot of basil with a little poem. Read it carefully: the rhyme is a proposal.", altEs: ["Te dei um manjericão com uma quadrinha. Leia com atenção: a rima é uma proposta."], grammar: [g.untranslatables, g.ep-enclisis], vocab: [w.manjerico] }
      - { es: "Não vim ao arraial pelas sardinhas; vim para dançar contigo até de manhã.", en: "I didn't come to the street party for the sardines; I came to dance with you till morning.", altEs: ["Não vim ao arraial pelas sardinhas; vim para dançar com você até de manhã."], grammar: [g.untranslatables, g.por-vs-para], vocab: [w.arraial, w.sardinha] }
      - { es: "Do miradouro, a cidade é linda; daqui, ao pé de ti, ainda mais.", en: "From the viewpoint, the city is beautiful; from here, next to you, even more so.", altEs: ["Do mirante, a cidade é linda; daqui, do seu lado, mais ainda."], grammar: [g.untranslatables, g.comparatives], vocab: [w.miradouro, w.mirante] }
      - { es: "Fiz a peregrinação até à tua porta. Espero que haja jantar no fim.", en: "I made the pilgrimage to your door. I hope there's dinner at the end.", altEs: ["Fiz a peregrinação até a sua porta. Espero que tenha jantar no final."], grammar: [g.untranslatables, g.subjunctive-wishes], vocab: [w.peregrinação] }
dialogues:
  - id: c2.u07.d1
    title: Numa tasca de Évora
    context: "Juliana and Leonor have dinner in a small tavern in Évora. Dona Gracinda, the owner, serves them and joins the conversation about saudade, translation and slang."
    lines:
      - { speaker: Gracinda, es: "Boa noite, meninas. Hoje há migas, porco preto e queijinho de Évora.", en: "Good evening, girls. Tonight there's migas, black pork and a little Évora cheese." }
      - { speaker: Juliana, es: "Que massa! Quero tudo. Ai, desculpe: queria dizer «que fixe».", en: "How cool! I want it all. Oh, sorry: I meant to say «que fixe»." }
      - { speaker: Gracinda, es: "Diga como quiser, filha. Aqui percebemos tudo, até o brasileiro das novelas.", en: "Say it however you like, dear. We understand everything here, even the Brazilian from the soaps." }
      - { speaker: Leonor, es: "A Juliana anda a traduzir um livro sobre o fado e não sabe o que fazer com a palavra saudade.", en: "Juliana is translating a book about fado and doesn't know what to do with the word saudade." }
      - { speaker: Gracinda, es: "Saudade não se traduz, sente-se. O meu filho está na Suíça e eu tenho saudades dele todos os dias.", en: "Saudade isn't translated, it's felt. My son is in Switzerland and I miss him every day." }
      - { speaker: Juliana, es: "É isso que eu quero explicar: que não é só tristeza, também tem carinho.", en: "That's what I want to explain: it's not just sadness, there's affection in it too." }
      - { speaker: Gracinda, es: "Então deixe a palavra em português e conte uma história, como esta.", en: "Then leave the word in Portuguese and tell a story, like this one." }
      - { speaker: Leonor, es: "Boa ideia. E no glossário pões o resto: fadista, xaile, casa de fados…", en: "Good idea. And in the glossary you put the rest: fadista, xaile, casa de fados…" }
      - { speaker: Juliana, es: "E «desenrascanço»! Já percebi que em Portugal toda a gente se desenrasca.", en: "And 'desenrascanço'! I've already realised that in Portugal everyone muddles through somehow." }
      - { speaker: Gracinda, es: "Pois é, filha. Agora coma, que a comida arrefece. Bom proveito!", en: "That's right, dear. Now eat, the food is getting cold. Enjoy your meal!" }
    questions:
      - { q: "Que trabalho está a Juliana a fazer?", options: ["Uma reportagem sobre Évora", "A tradução de um livro sobre o fado", "Um curso de culinária alentejana"], answer: 1, explain: "Leonor says Juliana «anda a traduzir um livro sobre o fado»." }
      - { q: "O que aconselha a Dona Gracinda para a palavra saudade?", options: ["Traduzi-la por «nostalgia»", "Deixá-la em português e contar uma história", "Não a usar no livro"], answer: 1, explain: "«Deixe a palavra em português e conte uma história»: keep the word and give context." }
      - { q: "Porque é que a Dona Gracinda tem saudades todos os dias?", options: ["O marido morreu", "O filho está na Suíça", "Mudou-se para Évora há pouco tempo"], answer: 1, explain: "Her son lives in Switzerland." }
      - { q: "O que quer dizer «Bom proveito!»?", options: ["Bom trabalho!", "Boa viagem!", "Bom apetite! / Aproveitem a refeição!"], answer: 2, explain: "Bom proveito is said to someone eating: 'Enjoy your meal!'" }
writing:
  - task: "Explain the word saudade to someone who doesn't speak Portuguese: why it's hard to translate, how it's used and how it's linked to fado."
    min: 130
    max: 220
    use: [w.saudade, w.intraduzível, w.fado, w.saudoso, w.conotação]
    useAtLeast: 3
    grammar: [g.untranslatables]
    expect:
      - { pattern: '\bsaudades?\b', hint: "Talk about saudade: ter saudades de…" }
      - { pattern: '(intraduz[ií]vel|traduzir|tradu[cç][aã]o|traduz-se)', hint: "Discuss translation: intraduzível, traduzir…" }
    model: { es: "Saudade é talvez a palavra portuguesa mais famosa e a mais difícil de traduzir. Muitos dizem que é intraduzível, porque nenhuma palavra de outra língua tem exatamente a mesma conotação. Saudade é o sentimento da falta de alguém ou de alguma coisa que amamos e que está longe, ou que já não existe, misturado com o prazer da memória. Pode ter-se saudade de uma pessoa, de um lugar, de um cheiro, até de uma época que nunca vivemos. Diz-se tenho saudade de ti a quem está longe, e a frase parece mais funda do que um simples sinto a tua falta. Não admira que o fado, essa canção triste de Lisboa e de Coimbra, seja chamado a música da saudade: quem ouve uma fadista cantar percebe a palavra sem precisar de dicionário.", en: "Saudade is perhaps the most famous Portuguese word and the hardest to translate. Many say it's untranslatable, because no word in another language has exactly the same connotation. Saudade is the feeling of missing someone or something we love that is far away, or no longer exists, mixed with the sweetness of memory. You can feel saudade for a person, a place, a smell, even an era you never lived through. You say tenho saudade de ti to someone far away, and it seems deeper than a simple I miss you. No wonder fado, that sad song of Lisbon and Coimbra, is called the music of saudade: anyone who hears a fado singer understands the word without needing a dictionary." }
  - task: "A friend translated 'It's raining cats and dogs' word for word into Portuguese. Explain why a literal translation fails and propose idiomatic versions for Brazil and Portugal."
    min: 130
    max: 220
    use: [w.literal, w.literalmente, w.equivalente, w.tradução, w.fidelidade]
    useAtLeast: 3
    grammar: [g.translation-nuance]
    expect:
      - { pattern: '\b(literal|literalmente|equivalentes?|tradu[cç][aã]o|traduzir)\b', hint: "Discuss literal versus idiomatic translation: literalmente, equivalente…" }
      - { pattern: '(temporal|toda a for[cç]a|chuva forte|a chover muito|chovendo muito|chuvada)', hint: "Propose idiomatic versions: está caindo um temporal, está a chover com toda a força…" }
    model: { es: "A frase está chovendo gatos e cachorros é um bom exemplo do perigo de traduzir literalmente. Em português, a frase não faz sentido: o leitor imagina animais a cair do céu e não percebe que se trata de uma chuva forte. Uma boa tradução não procura a fidelidade às palavras, mas ao efeito que elas produzem. Por isso, é preciso encontrar um equivalente natural na outra língua. No Brasil, diríamos está caindo um temporal, ou simplesmente está chovendo muito. Em Portugal, uma solução natural é está a chover com toda a força. Repare que até a estrutura do verbo muda: estar chovendo no Brasil, estar a chover em Portugal. Em suma, traduzir é escolher, e cada escolha depende do público que vai ler o texto. Traduzir bem exige conhecer as duas culturas, e não apenas as duas línguas.", en: "The sentence 'it's raining cats and dogs' rendered word for word is a good example of the danger of literal translation. In Portuguese it makes no sense: the reader imagines animals falling from the sky and doesn't realise it's about heavy rain. A good translation seeks fidelity not to the words but to the effect they produce. So you need to find a natural equivalent in the other language. In Brazil we'd say está caindo um temporal, or simply está chovendo muito. In Portugal a natural solution is está a chover com toda a força. Notice that even the verb structure changes: estar chovendo in Brazil, estar a chover in Portugal. In short, translating is choosing, and every choice depends on the audience who will read the text. Translating well means knowing both cultures, not just both languages." }
  - task: "Write the same short story about a party twice: once in Lisbon slang (fixe, bué, bazar, baril…) and once in Brazilian slang (massa, cara, rango, breja…). Then comment on the differences."
    min: 130
    max: 220
    use: [w.calão, w.bazar, w.rango, w.breja, w.baril]
    useAtLeast: 3
    grammar: [g.slang-br-pt]
    expect:
      - { pattern: '(fixe|bu[eé]|bazar|baz[aá]mos|baril|chunga|piroso|foleiro)', hint: "Write the Lisbon version with Portuguese slang: fixe, bué, bazar…" }
      - { pattern: '(massa|\bcara\b|rango|brejas?|bus[aã]o|trampo|de boa|brega|cafona)', hint: "Write the Brazilian version: massa, cara, rango, breja…" }
    model: { es: "Versão de Lisboa: Ontem a festa foi bué fixe! A malta comeu imenso, a música era baril e não houve nenhuma cena chunga. Às três da manhã, bazámos para casa de táxi. Versão brasileira: Ontem a festa foi massa, cara! A galera comeu um rango maravilhoso, tomou umas brejas e a música era top, nada brega. Às três da manhã, a gente foi embora de táxi, de boa. Como se vê, o calão muda completamente de um lado para o outro do Atlântico. Fixe e massa querem dizer o mesmo, tal como bazar e ir embora. Um português que ouça breja ou rango pode não perceber nada, e um brasileiro pode achar baril uma palavra muito estranha. É a mesma língua, mas com duas músicas diferentes. Por isso, vale a pena aprender as duas.", en: "Lisbon version: Yesterday the party was dead cool! The gang ate loads, the music was awesome and there was no dodgy stuff. At three in the morning we split for home by taxi. Brazilian version: Yesterday the party was awesome, man! The crew ate amazing grub, had a few beers and the music was top, nothing tacky. At three in the morning we headed off by taxi, chilled. As you can see, slang changes completely from one side of the Atlantic to the other. Fixe and massa mean the same, as do bazar and ir embora. A Portuguese person who hears breja or rango may not understand a thing, and a Brazilian may find baril a very strange word. It's the same language, but with two different tunes. So it's worth learning both." }
  - task: "Write a short, evocative travel piece about Évora and the Alentejo for a Portuguese magazine, in European Portuguese (planície, sobreiros, olivais, cante alentejano, petiscar…)."
    min: 130
    max: 220
    use: [w.planície, w.sobreiro, w.cante, w.petiscar, w.templo]
    useAtLeast: 3
    grammar: [g.untranslatables, g.translation-nuance]
    expect:
      - { pattern: '(plan[ií]cie|sobreiro|cante|petisc|templo|olival|olivais|corti[cç]a|alentej)', hint: "Describe the Alentejo: planície, sobreiros, olivais, cante…" }
      - { pattern: '(\b(est[aá]|estão|ficam|ficou) a [a-zà-ú]+r\b|\b[a-zà-ú]+-se\b)', hint: "Write in European Portuguese: estar a + infinitive, pronouns after the verb…" }
    model: { es: "Em Évora, o tempo parece andar mais devagar. A cidade, com a sua muralha antiga, guarda um templo com quase dois mil anos, que se levanta no ponto mais alto da colina como se ainda vigiasse a planície. À volta, ficam os campos dourados do Alentejo, cheios de sobreiros e olivais, que mudam de cor a cada estação. No verão, o calor é tão forte que as ruas ficam vazias à hora do almoço; ao fim da tarde, porém, as pessoas sentam-se nas mesas da praça a petiscar queijo, azeitonas e pão alentejano. Se tiver sorte, o visitante ouvirá um grupo de homens a cantar o cante alentejano, lento e grave, que a UNESCO protege desde 2014. Quem lá vai uma vez fica sempre com vontade de voltar, nem que seja só para ouvir de novo aquele canto.", en: "In Évora, time seems to move more slowly. The city, with its ancient wall, keeps a temple almost two thousand years old, which rises at the highest point of the hill as if still watching over the plain. All around lie the golden fields of the Alentejo, full of cork oaks and olive groves, which change colour with every season. In summer the heat is so strong that the streets empty at lunchtime; towards evening, though, people sit at the tables in the square nibbling cheese, olives and Alentejo bread. With luck, visitors will hear a group of men singing the slow, deep cante alentejano, protected by UNESCO since 2014. Anyone who goes there once always wants to go back, even if only to hear that singing again." }
