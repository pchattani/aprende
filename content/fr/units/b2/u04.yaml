id: b2.u04
title: "Annecy : on aurait dû louer un pédalo"
lessons:
  - id: b2.u04.l1
    title: Ils ont dû rater le bateau
    teach: [g.devoir-nuances]
    tip: "devoir changes meaning with the tense: il doit partir (must), il doit être fatigué (must be), il a dû se perdre (must have), il devait venir (was supposed to), tu devrais (should), tu aurais dû (should have)."
    vocab: [w.pédalo, w.cygne, w.baignade, w.plongeoir, w.ponton, w.canal, w.servir-de, w.censé, w.faire-demi-tour, w.demi-tour, w.tartiflette, w.reblochon, w.raclette, w.fondue, w.fleuri, w.régional, w.prudent, w.imprudent]
    sentences:
      - { es: "Ils ne sont pas encore là ? Ils ont dû rater le bateau.", en: "They're not here yet? They must have missed the boat.", altEs: ["Ils ne sont toujours pas là ? Ils ont dû rater le bateau."], grammar: [g.devoir-nuances], vocab: [], transform: { instruction: "Make it a guess about now: 'They must be lost'", answer: "Ils ne sont pas encore là ? Ils doivent être perdus.", alt: ["Ils ne sont pas encore là ? Ils doivent s'être perdus."], en: "They're not here yet? They must be lost." } }
      - { es: "Les randonneurs ont dû faire demi-tour à cause du brouillard.", en: "The hikers had to turn back because of the fog.", grammar: [g.devoir-nuances], vocab: [w.faire-demi-tour] }
      - { es: "Nous devions faire le tour du lac en pédalo, mais il a plu.", en: "We were supposed to go round the lake by pedalo, but it rained.", altEs: ["On devait faire le tour du lac en pédalo, mais il a plu."], grammar: [g.devoir-nuances], vocab: [w.pédalo] }
      - { es: "Tu devrais goûter la tartiflette : c'est la spécialité régionale.", en: "You ought to try the tartiflette: it's the regional speciality.", altEs: ["Tu devrais goûter la tartiflette, c'est la spécialité régionale."], grammar: [g.devoir-nuances, g.conditional-advice], vocab: [w.tartiflette, w.régional], transform: { instruction: "Make it a reproach about the past: 'You should have tried…'", answer: "Tu aurais dû goûter la tartiflette : c'est la spécialité régionale.", en: "You should have tried the tartiflette: it's the regional speciality." } }
      - { es: "Le bateau doit arriver au ponton à midi.", en: "The boat is due to arrive at the jetty at noon.", altEs: ["Le bateau doit arriver au ponton à midi pile."], grammar: [g.devoir-nuances], vocab: [w.ponton] }
      - { es: "Elle doit être fatiguée : elle a nagé jusqu'au plongeoir.", en: "She must be tired: she swam all the way to the diving board.", grammar: [g.devoir-nuances], vocab: [w.plongeoir] }
      - { es: "On est censés réserver les pédalos à l'avance ? — Non, on paie sur place.", en: "Are we supposed to book the pedalos in advance? — No, you pay on the spot.", altEs: ["Est-ce qu'on est censés réserver les pédalos à l'avance ? — Non, on paie sur place."], grammar: [g.devoir-nuances], vocab: [w.censé, w.pédalo], note: "être censé + infinitive = to be supposed to." }
      - { es: "Je te dois combien pour la raclette ?", en: "How much do I owe you for the raclette?", altEs: ["Combien je te dois pour la raclette ?"], grammar: [g.devoir-nuances], vocab: [w.raclette] }
      - { es: "La baignade est interdite ici ; tu as dû mal lire le panneau.", en: "Swimming is forbidden here; you must have misread the sign.", altEs: ["La baignade est interdite ici : tu as dû mal lire le panneau."], grammar: [g.devoir-nuances], vocab: [w.baignade], error: { wrong: "La baignade est interdite ici ; tu as dû mal lu le panneau.", explain: "devoir is followed by an infinitive: tu as dû mal lire.", grammar: g.devoir-nuances } }
      - { es: "Au milieu du canal du Thiou, le Palais de l'Isle a longtemps servi de prison : ça a dû être bien froid !", en: "In the middle of the Thiou canal, the Palais de l'Isle long served as a prison: it must have been really cold!", grammar: [g.devoir-nuances], vocab: [w.canal, w.servir-de] }
      - { es: "Ne nourris pas les cygnes : tu ne devrais pas leur donner de pain.", en: "Don't feed the swans: you shouldn't give them bread.", grammar: [g.devoir-nuances, g.imperative], vocab: [w.cygne] }
      - { es: "Il a été imprudent de plonger du ponton ; il aurait dû regarder la profondeur.", en: "He was reckless to dive off the jetty; he should have checked the depth.", grammar: [g.devoir-nuances, g.regret-reproach], vocab: [w.imprudent, w.ponton], error: { wrong: "Il a été imprudent de plonger du ponton ; il devrait avoir regardé la profondeur.", explain: "'Should have' is aurait dû + infinitive: il aurait dû regarder.", grammar: g.devoir-nuances } }
      - { es: "Soyez prudents : en montagne, on doit toujours prendre de l'eau.", en: "Be careful: in the mountains you must always take water.", altEs: ["Soyez prudents, en montagne on doit toujours prendre de l'eau."], grammar: [g.devoir-nuances, g.imperative], vocab: [w.prudent] }
      - { es: "Les balcons fleuris de la vieille ville ont dû demander beaucoup de travail.", en: "The flower-filled balconies of the old town must have taken a lot of work.", grammar: [g.devoir-nuances], vocab: [w.fleuri] }
      - { es: "On devait manger une fondue, mais il faisait trente degrés.", en: "We were supposed to have a fondue, but it was thirty degrees.", altEs: ["Nous devions manger une fondue, mais il faisait trente degrés."], grammar: [g.devoir-nuances], vocab: [w.fondue] }
      - { es: "Le car a dû faire un demi-tour sur cette petite route de montagne.", en: "The coach had to do a U-turn on that little mountain road.", grammar: [g.devoir-nuances], vocab: [w.demi-tour] }
    exchanges:
      - q: { es: "Où sont Paul et Léa ?", en: "Where are Paul and Léa?" }
        a: { es: "Ils ont dû rater le bateau de midi.", en: "They must have missed the noon boat." }
        alt: ["Ils doivent être encore au ponton.", "Aucune idée, ils devaient arriver à midi."]
        grammar: [g.devoir-nuances]
        vocab: []
      - q: { es: "Qu'est-ce que je devrais goûter ici ?", en: "What should I try here?" }
        a: { es: "Tu devrais goûter la tartiflette, avec du vrai reblochon.", en: "You should try the tartiflette, with real reblochon." }
        alt: ["La fondue, sans hésiter.", "Une raclette, si tu as très faim."]
        grammar: [g.devoir-nuances]
        vocab: [w.tartiflette, w.reblochon]
      - q: { es: "On peut se baigner ici ?", en: "Can we swim here?" }
        a: { es: "Non, la baignade est interdite ; on est censés aller à la plage.", en: "No, swimming is forbidden; we're supposed to go to the beach." }
        alt: ["Non, c'est interdit.", "Oui, mais soyez prudents."]
        grammar: [g.devoir-nuances]
        vocab: [w.baignade, w.censé]
      - q: { es: "Pourquoi vous êtes déjà rentrés ?", en: "Why are you back already?" }
        a: { es: "On a dû faire demi-tour : il y avait trop de vent sur le lac.", en: "We had to turn back: there was too much wind on the lake." }
        alt: ["Il a commencé à pleuvoir.", "Le pédalo avait un problème."]
        grammar: [g.devoir-nuances]
        vocab: [w.faire-demi-tour]
      - q: { es: "Combien je te dois ?", en: "How much do I owe you?" }
        a: { es: "Rien du tout, c'est moi qui t'invite.", en: "Nothing at all, it's my treat." }
        alt: ["Vingt euros pour la raclette.", "On verra plus tard."]
        grammar: [g.devoir-nuances]
        vocab: []
    texts:
      - title: "Message de Nadia"
        es: ["On devait faire du pédalo cet après-midi, mais il y a de l'orage.", "On a dû rentrer à l'hôtel.", "Tu devrais venir manger une fondue avec nous ce soir !"]
        en: ["We were supposed to go pedalo-ing this afternoon, but there's a storm.", "We had to go back to the hotel.", "You should come and have a fondue with us tonight!"]
        grammar: [g.devoir-nuances]
        vocab: [w.pédalo, w.fondue]
      - title: "Panneau au bord du lac"
        es: ["Baignade surveillée tous les jours en juillet et en août.", "Les plongeons depuis le ponton sont interdits.", "Merci de ne pas nourrir les cygnes."]
        en: ["Lifeguards on duty every day in July and August.", "Diving from the jetty is forbidden.", "Please do not feed the swans."]
        grammar: [g.negation-ne-pas]
        vocab: [w.baignade, w.ponton, w.cygne]
    spicy:
      - { es: "Tu dois avoir chaud… à moins que ce soit moi qui te fasse cet effet ?", en: "You must be hot… unless it's me having that effect on you?", grammar: [g.devoir-nuances, g.subjonctif-conjonctions], vocab: [] }
      - { es: "On devait faire un tour en pédalo, mais on est restés sur le ponton à se regarder pendant une heure.", en: "We were supposed to go out on a pedalo, but we stayed on the jetty looking at each other for an hour.", grammar: [g.devoir-nuances], vocab: [w.pédalo, w.ponton] }
      - { es: "Tu devrais sourire plus souvent : même les cygnes te regardent.", en: "You should smile more often: even the swans are looking at you.", grammar: [g.devoir-nuances, g.conditional-advice], vocab: [w.cygne] }
      - { es: "Tu as dû entendre que j'étais célibataire, non ?", en: "You must have heard I was single, right?", altEs: ["Tu as dû entendre dire que j'étais célibataire, non ?"], grammar: [g.devoir-nuances], vocab: [] }
      - { es: "Une fondue pour deux ? Tu es censé partager, pas tout manger.", en: "A fondue for two? You're supposed to share, not eat it all.", altEs: ["Une fondue pour deux ? Tu es censée partager, pas tout manger."], grammar: [g.devoir-nuances], vocab: [w.fondue, w.censé] }
  - id: b2.u04.l2
    title: On aurait dû louer un pédalo
    teach: [g.regret-reproach]
    tip: "Regret: j'aurais dû, j'aurais aimé, je regrette de ne pas avoir…, si seulement j'avais… Reproach: tu aurais dû, tu aurais pu, tu n'aurais pas dû, il aurait fallu…"
    vocab: [w.reproche, w.reprocher, w.culpabiliser, w.négligence, w.cinéma-d-animation, w.animation, w.dessin-animé, w.court-métrage, w.long-métrage, w.chanteur, w.interdiction, w.autorisation, w.contravention, w.infraction, w.réglementer, w.réglementation, w.baignable]
    sentences:
      - { es: "On aurait dû louer un pédalo, il fait si beau !", en: "We should have hired a pedalo, the weather's so lovely!", altEs: ["Nous aurions dû louer un pédalo, il fait si beau !", "On aurait dû louer un pédalo : il fait tellement beau !"], grammar: [g.regret-reproach], vocab: [w.pédalo] }
      - { es: "Tu aurais pu me dire que le lac était si froid !", en: "You could have told me the lake was so cold!", altEs: ["Tu aurais pu me prévenir que le lac était si froid !"], grammar: [g.regret-reproach, g.concordance-des-temps], vocab: [] }
      - { es: "Je regrette de ne pas être allé au festival de cinéma d'animation.", en: "I'm sorry I didn't go to the animated film festival.", altEs: ["Je regrette de ne pas être allée au festival de cinéma d'animation.", "Je regrette de ne pas être allé au festival du film d'animation."], grammar: [g.regret-reproach], vocab: [w.cinéma-d-animation, w.animation], error: { wrong: "Je regrette de ne pas avoir allé au festival de cinéma d'animation.", explain: "aller takes être: de ne pas être allé.", grammar: g.regret-reproach } }
      - { es: "Il aurait fallu réserver les places des mois à l'avance.", en: "We should have booked the seats months in advance.", altEs: ["Il aurait fallu réserver les places plusieurs mois à l'avance."], grammar: [g.regret-reproach], vocab: [], error: { wrong: "Il aurait fallu de réserver les places des mois à l'avance.", explain: "il aurait fallu is followed directly by the infinitive: il aurait fallu réserver.", grammar: g.regret-reproach } }
      - { es: "Tu n'aurais pas dû garer la voiture ici : tu as eu une contravention.", en: "You shouldn't have parked the car here: you've got a ticket.", grammar: [g.regret-reproach], vocab: [w.contravention], transform: { instruction: "Turn it into advice for next time: 'You shouldn't park…'", answer: "Tu ne devrais pas garer la voiture ici.", en: "You shouldn't park the car here." } }
      - { es: "Il me reproche de ne pas l'avoir prévenu.", en: "He blames me for not warning him.", altEs: ["Il me reproche de ne pas l'avoir averti."], grammar: [g.regret-reproach], vocab: [w.reprocher], transform: { instruction: "Change 'il' to 'ils'", answer: "Ils me reprochent de ne pas les avoir prévenus.", alt: ["Ils me reprochent de ne pas les avoir prévenues."], en: "They blame me for not warning them." } }
      - { es: "Ne culpabilise pas : tout le monde aurait oublié.", en: "Don't feel guilty: anyone would have forgotten.", altEs: ["Ne culpabilise pas, n'importe qui aurait oublié."], grammar: [g.regret-reproach, g.conditionnel-passe], vocab: [w.culpabiliser] }
      - { es: "Si seulement j'avais pris mon maillot ! — Je te l'avais dit.", en: "If only I'd brought my swimsuit! — I told you so.", grammar: [g.regret-reproach, g.si-plus-que-parfait], vocab: [] }
      - { es: "C'est de la négligence : la mairie aurait dû réparer le ponton depuis longtemps.", en: "It's negligence: the town hall should have repaired the jetty long ago.", grammar: [g.regret-reproach], vocab: [w.négligence, w.ponton] }
      - { es: "Dommage qu'on n'ait pas vu le court métrage d'ouverture.", en: "Shame we didn't see the opening short film.", altEs: ["C'est dommage qu'on n'ait pas vu le court métrage d'ouverture."], grammar: [g.regret-reproach, g.subjonctif-passe], vocab: [w.court-métrage] }
      - { es: "J'aurais aimé voir ce long métrage avant sa sortie.", en: "I'd have liked to see this feature film before its release.", altEs: ["J'aurais voulu voir ce long métrage avant sa sortie."], grammar: [g.regret-reproach], vocab: [w.long-métrage] }
      - { es: "Petit, je regardais des dessins animés tous les mercredis ; j'aurais voulu en dessiner.", en: "As a kid I watched cartoons every Wednesday; I'd have liked to draw them.", altEs: ["Petite, je regardais des dessins animés tous les mercredis ; j'aurais voulu en dessiner."], grammar: [g.regret-reproach, g.imparfait-uses], vocab: [w.dessin-animé] }
      - { es: "Le chanteur aurait pu chanter une chanson de plus !", en: "The singer could have sung one more song!", altEs: ["La chanteuse aurait pu chanter une chanson de plus !"], grammar: [g.regret-reproach], vocab: [w.chanteur] }
      - { es: "La baignade est réglementée : vous auriez dû demander une autorisation.", en: "Swimming is regulated: you should have asked for permission.", grammar: [g.regret-reproach], vocab: [w.réglementer, w.autorisation] }
      - { es: "Vous avez commis une infraction : vous n'auriez pas dû entrer dans cette zone.", en: "You've committed an offence: you shouldn't have entered this area.", grammar: [g.regret-reproach], vocab: [w.infraction] }
      - { es: "Cette plage est baignable depuis juin ; tu aurais dû venir plus tôt !", en: "This beach has been safe for swimming since June; you should have come earlier!", grammar: [g.regret-reproach], vocab: [w.baignable] }
    exchanges:
      - q: { es: "Pourquoi tu fais cette tête ?", en: "Why the long face?" }
        a: { es: "Mon frère m'a fait des reproches : j'aurais dû l'appeler pour son anniversaire.", en: "My brother has been telling me off: I should have called him on his birthday." }
        alt: ["J'ai oublié l'anniversaire de mon frère.", "Rien, je suis juste fatigué."]
        grammar: [g.regret-reproach]
        vocab: [w.reproche]
      - q: { es: "Tu as vu le court métrage d'ouverture ?", en: "Did you see the opening short film?" }
        a: { es: "Non, et je m'en veux : j'aurais dû arriver plus tôt.", en: "No, and I'm cross with myself: I should have got there earlier." }
        alt: ["Non, dommage.", "Oui, il était génial."]
        grammar: [g.regret-reproach]
        vocab: [w.court-métrage]
      - q: { es: "C'est grave, monsieur ?", en: "Is it serious, officer?" }
        a: { es: "C'est une infraction : vous auriez dû lire le panneau.", en: "It's an offence: you should have read the sign." }
        alt: ["Juste une contravention.", "Non, mais soyez plus prudent."]
        grammar: [g.regret-reproach]
        vocab: [w.infraction]
      - q: { es: "Tu m'en veux ?", en: "Are you cross with me?" }
        a: { es: "Un peu : tu aurais pu me prévenir que tu ne venais pas.", en: "A bit: you could have told me you weren't coming." }
        alt: ["Non, ne culpabilise pas.", "Pas du tout."]
        grammar: [g.regret-reproach]
        vocab: []
      - q: { es: "On aurait dû prendre des places pour le festival ?", en: "Should we have got seats for the festival?" }
        a: { es: "Oui, il aurait fallu les réserver en mars.", en: "Yes, we should have booked them in March." }
        alt: ["Oui, c'est complet maintenant.", "Non, on ira l'année prochaine."]
        grammar: [g.regret-reproach]
        vocab: []
    texts:
      - title: "Message de Manon"
        es: ["Tu aurais dû venir au festival hier soir !", "Le long métrage était magnifique.", "Mais j'aurais préféré une salle moins chaude."]
        en: ["You should have come to the festival last night!", "The feature film was magnificent.", "But I'd have preferred a cooler room."]
        grammar: [g.regret-reproach]
        vocab: [w.long-métrage]
      - title: "Lettre au journal"
        es: ["L'interdiction de se baigner près du ponton n'a aucun sens.", "La mairie aurait dû consulter les habitants avant de changer la réglementation.", "Il aurait fallu au moins une réunion publique."]
        en: ["The ban on swimming near the jetty makes no sense.", "The town hall should have consulted the residents before changing the regulations.", "There should at least have been a public meeting."]
        grammar: [g.regret-reproach]
        vocab: [w.interdiction, w.réglementation]
    spicy:
      - { es: "On aurait dû louer un pédalo pour deux : comme ça, tu n'aurais pas pu te sauver.", en: "We should have hired a pedalo for two: that way you couldn't have run off.", grammar: [g.regret-reproach], vocab: [w.pédalo] }
      - { es: "Je regrette de ne pas t'avoir embrassé sur le pont des Amours.", en: "I'm sorry I didn't kiss you on the Pont des Amours.", altEs: ["Je regrette de ne pas t'avoir embrassée sur le pont des Amours."], grammar: [g.regret-reproach], vocab: [] }
      - { es: "Tu n'aurais pas dû me regarder comme ça pendant le film : je n'ai rien compris à l'histoire.", en: "You shouldn't have looked at me like that during the film: I didn't understand a thing about the story.", grammar: [g.regret-reproach], vocab: [] }
      - { es: "Ne culpabilise pas d'avoir mangé ma part de tartiflette… mais tu me dois un dîner.", en: "Don't feel guilty about eating my share of the tartiflette… but you owe me a dinner.", grammar: [g.regret-reproach, g.devoir-nuances], vocab: [w.culpabiliser, w.tartiflette] }
      - { es: "Il aurait fallu me prévenir que tu chantais aussi bien ; je serais tombée amoureuse plus tôt.", en: "Someone should have warned me you sang so well; I'd have fallen in love sooner.", altEs: ["Il aurait fallu me prévenir que tu chantais aussi bien ; je serais tombé amoureux plus tôt."], grammar: [g.regret-reproach, g.conditionnel-passe], vocab: [] }
  - id: b2.u04.l3
    title: Le lac serait le plus pur d'Europe
    teach: [g.conditionnel-journalistique]
    tip: "The press uses the conditional for unconfirmed facts: Le suspect aurait fui = the suspect reportedly fled. Translate it with 'reportedly', 'allegedly', 'is said to', never with 'would'."
    vocab: [w.transparence, w.assainissement, w.égout, w.collecteur, w.eaux-usées, w.station-d-épuration, w.fait-divers, w.présumé, w.démentir, w.rapporter, w.porte-parole, w.communiqué, w.conférence-de-presse, w.hebdomadaire, w.mensuel, w.quotidiennement, w.heurter, w.fuir, w.fuite, w.suspect, w.témoigner, w.blessé.n, w.accident-de-la-route]
    sentences:
      - { es: "Selon la presse locale, l'eau du lac serait l'une des plus pures d'Europe.", en: "According to the local press, the lake's water is said to be among the purest in Europe.", altEs: ["D'après la presse locale, l'eau du lac serait l'une des plus pures d'Europe."], grammar: [g.conditionnel-journalistique], vocab: [] }
      - { es: "Un pédalo aurait heurté un ponton hier soir ; il n'y aurait pas de blessés.", en: "A pedalo reportedly hit a jetty last night; there are said to be no injuries.", altEs: ["Un pédalo aurait heurté un ponton hier soir, il n'y aurait pas de blessés."], grammar: [g.conditionnel-journalistique], vocab: [w.heurter, w.blessé.n], transform: { instruction: "Report it as a confirmed fact", answer: "Un pédalo a heurté un ponton hier soir ; il n'y a pas de blessés.", alt: ["Un pédalo a heurté un ponton hier soir, il n'y a pas de blessés."], en: "A pedalo hit a jetty last night; there are no injuries." } }
      - { es: "D'après les témoins, le conducteur aurait fui avant l'arrivée de la police.", en: "According to witnesses, the driver fled before the police arrived.", altEs: ["Selon les témoins, le conducteur aurait fui avant l'arrivée de la police."], altEn: ["According to witnesses, the driver allegedly fled before the police arrived."], grammar: [g.conditionnel-journalistique], vocab: [w.fuir], error: { wrong: "D'après les témoins, le conducteur aurait fuit avant l'arrivée de la police.", explain: "The past participle of fuir is fui: il aurait fui.", grammar: g.conditionnel-journalistique } }
      - { es: "Le suspect se serait caché dans un vieux garage au bord du lac.", en: "The suspect is said to have hidden in an old garage by the lake.", grammar: [g.conditionnel-journalistique], vocab: [w.suspect], transform: { instruction: "Report it as hearsay with 'Il paraît que' (indicative)", answer: "Il paraît que le suspect s'est caché dans un vieux garage au bord du lac.", en: "Apparently the suspect hid in an old garage by the lake." } }
      - { es: "Le porte-parole de la mairie a démenti l'information dans un communiqué.", en: "The town hall's spokesperson denied the report in a press release.", grammar: [g.passe-compose-avoir], vocab: [w.porte-parole, w.démentir, w.communiqué], error: { wrong: "Le porte-parole de la mairie a démentit l'information dans un communiqué.", explain: "The past participle of démentir is démenti (no t).", grammar: g.past-participles-irregular } }
      - { es: "Selon un hebdomadaire régional, une fuite d'eaux usées aurait pollué une plage.", en: "According to a regional weekly, a leak of waste water has reportedly polluted a beach.", grammar: [g.conditionnel-journalistique], vocab: [w.hebdomadaire, w.fuite, w.eaux-usées] }
      - { es: "Grâce au collecteur construit autour du lac, les eaux des égouts ne finissent plus dans le lac.", en: "Thanks to the main sewer built round the lake, sewage no longer ends up in the lake.", grammar: [g.negation-jamais-plus-rien], vocab: [w.collecteur, w.égout] }
      - { es: "D'après un rapport, la transparence de l'eau se serait encore améliorée.", en: "According to a report, the water's clarity has improved further.", altEn: ["According to a report, the clarity of the water has reportedly improved even more."], grammar: [g.conditionnel-journalistique], vocab: [w.transparence] }
      - { es: "Le présumé voleur aurait quitté la ville en voiture.", en: "The alleged thief is said to have left town by car.", grammar: [g.conditionnel-journalistique], vocab: [w.présumé] }
      - { es: "Un accident de la route aurait fait deux blessés près de Talloires.", en: "A road accident has reportedly left two people injured near Talloires.", grammar: [g.conditionnel-journalistique], vocab: [w.accident-de-la-route, w.blessé.n] }
      - { es: "La station d'épuration nettoierait quotidiennement des millions de litres d'eau.", en: "The water treatment plant reportedly cleans millions of litres of water every day.", grammar: [g.conditionnel-journalistique], vocab: [w.station-d-épuration, w.quotidiennement] }
      - { es: "Pendant la conférence de presse, le maire aurait promis de nouveaux travaux d'assainissement.", en: "At the press conference, the mayor reportedly promised new sanitation works.", grammar: [g.conditionnel-journalistique], vocab: [w.conférence-de-presse, w.assainissement] }
      - { es: "Un mensuel affirme que le chanteur serait en vacances à Annecy.", en: "A monthly magazine claims the singer is on holiday in Annecy.", grammar: [g.conditionnel-journalistique], vocab: [w.mensuel, w.chanteur] }
      - { es: "Deux passants ont accepté de témoigner : le bateau serait allé beaucoup trop vite.", en: "Two passers-by agreed to give evidence: the boat was apparently going far too fast.", grammar: [g.conditionnel-journalistique], vocab: [w.témoigner] }
      - { es: "Les journaux rapportent qu'il y aurait eu une fuite dans les égouts, mais la mairie dément.", en: "The papers report that there has been a leak in the sewers, but the town hall denies it.", grammar: [g.conditionnel-journalistique], vocab: [w.rapporter, w.fuite, w.égout, w.démentir] }
      - { es: "Il paraît que ce fait divers a fait la une de tous les journaux.", en: "Apparently this news story made the front page of every paper.", grammar: [g.indicatif-ou-subjonctif], vocab: [w.fait-divers], note: "il paraît que takes the indicative, unlike selon + conditional." }
    exchanges:
      - q: { es: "Tu as lu le journal ?", en: "Have you read the paper?" }
        a: { es: "Oui, un pédalo aurait heurté un ponton hier soir.", en: "Yes, a pedalo reportedly hit a jetty last night." }
        alt: ["Oui, il y aurait eu un accident.", "Non, pas encore."]
        grammar: [g.conditionnel-journalistique]
        vocab: [w.heurter]
      - q: { es: "Il y a eu des blessés ?", en: "Was anyone injured?" }
        a: { es: "Il n'y en aurait pas, selon la gendarmerie.", en: "Apparently not, according to the gendarmerie." }
        alt: ["Apparemment non.", "Deux, d'après la radio."]
        grammar: [g.conditionnel-journalistique, g.pronoun-en]
        vocab: [w.blessé.n]
      - q: { es: "C'est vrai que le lac est si propre ?", en: "Is it true the lake is so clean?" }
        a: { es: "Il serait l'un des plus purs d'Europe, grâce à l'assainissement.", en: "It's said to be one of the cleanest in Europe, thanks to the sewage treatment." }
        alt: ["Oui, grâce au collecteur.", "Il paraît, oui."]
        grammar: [g.conditionnel-journalistique]
        vocab: [w.assainissement]
      - q: { es: "La mairie a confirmé la fuite ?", en: "Has the town hall confirmed the leak?" }
        a: { es: "Non, son porte-parole l'a démentie ce matin.", en: "No, its spokesperson denied it this morning." }
        alt: ["Pas encore.", "Oui, dans un communiqué."]
        grammar: [g.pc-object-agreement]
        vocab: [w.porte-parole, w.démentir]
      - q: { es: "Qu'est-ce que tu lis ?", en: "What are you reading?" }
        a: { es: "Un hebdomadaire régional ; il y a toujours des faits divers incroyables.", en: "A regional weekly; there are always incredible news stories." }
        alt: ["Le journal.", "Un mensuel de cinéma."]
        grammar: [g.plural-nouns]
        vocab: [w.hebdomadaire, w.fait-divers]
    texts:
      - title: "Brève du journal"
        es: ["Annecy, lundi. Un pédalo aurait heurté le ponton de la plage hier vers dix-huit heures.", "Selon les premiers témoins, ses deux passagers seraient tombés à l'eau.", "Il n'y aurait aucun blessé."]
        en: ["Annecy, Monday. A pedalo reportedly hit the beach jetty yesterday at around 6 pm.", "According to the first witnesses, its two passengers fell into the water.", "No one is said to have been injured."]
        grammar: [g.conditionnel-journalistique]
        vocab: [w.heurter, w.ponton, w.blessé.n]
      - title: "Communiqué de la mairie"
        es: ["Contrairement à ce qu'affirme un hebdomadaire, il n'y a eu aucune fuite d'eaux usées.", "La station d'épuration fonctionne normalement.", "La baignade reste autorisée sur toutes les plages."]
        en: ["Contrary to what a weekly paper claims, there has been no leak of waste water.", "The water treatment plant is working normally.", "Swimming is still permitted on all beaches."]
        grammar: [g.passe-compose-avoir]
        vocab: [w.communiqué, w.fuite, w.eaux-usées, w.station-d-épuration]
    spicy:
      - { es: "Selon des sources bien informées, tu serais célibataire. Je peux vérifier ?", en: "According to well-informed sources, you're single. May I check?", grammar: [g.conditionnel-journalistique], vocab: [] }
      - { es: "D'après ma sœur, tu aurais parlé de moi toute la soirée.", en: "According to my sister, you talked about me all evening.", grammar: [g.conditionnel-journalistique], vocab: [] }
      - { es: "Il paraît que tu danses très bien ; selon les témoins, tu aurais même fait sourire le DJ.", en: "Apparently you dance really well; according to witnesses, you even made the DJ smile.", grammar: [g.conditionnel-journalistique], vocab: [] }
      - { es: "Le suspect aurait volé mon cœur et un morceau de reblochon. Il serait encore dans la cuisine.", en: "The suspect allegedly stole my heart and a piece of reblochon. He is said to be still in the kitchen.", grammar: [g.conditionnel-journalistique], vocab: [w.suspect, w.reblochon] }
      - { es: "Communiqué officiel : tu serais invité à dîner chez moi samedi.", en: "Official press release: you're reportedly invited to dinner at my place on Saturday.", altEs: ["Communiqué officiel : tu serais invitée à dîner chez moi samedi."], grammar: [g.conditionnel-journalistique], vocab: [w.communiqué] }
  - id: b2.u04.l4
    title: L'évadé du Palais de l'Isle
    teach: [g.conditionnel-journalistique, g.devoir-nuances]
    tip: "News French mixes both points: il aurait été interpellé (reportedly), il doit être jugé (is due to be), il a dû reconnaître (had to)."
    vocab: [w.délit, w.coupable.n, w.accuser, w.accusé, w.condamner, w.condamnation, w.acquitter, w.juger, w.justice, w.peine-de-prison, w.emprisonner, w.s-évader, w.gendarme, w.gendarmerie, w.bâtir, w.fugitif, w.interpeller, w.garde-à-vue]
    sentences:
      - { es: "Bâti au XIIe siècle, le Palais de l'Isle a longtemps servi de prison.", en: "Built in the 12th century, the Palais de l'Isle long served as a prison.", altEs: ["Le Palais de l'Isle, bâti au XIIe siècle, a longtemps servi de prison."], grammar: [g.passive-voice], vocab: [w.bâtir, w.servir-de] }
      - { es: "Un détenu se serait évadé cette nuit ; il aurait traversé le canal à la nage.", en: "A prisoner reportedly escaped last night; he is said to have swum across the canal.", altEs: ["Un prisonnier se serait évadé cette nuit ; il aurait traversé le canal à la nage."], grammar: [g.conditionnel-journalistique], vocab: [w.s-évader, w.canal] }
      - { es: "Le fugitif aurait été interpellé par les gendarmes près de la gare.", en: "The fugitive was reportedly arrested by gendarmes near the station.", grammar: [g.conditionnel-journalistique, g.passive-voice], vocab: [w.fugitif, w.interpeller, w.gendarme], transform: { instruction: "Report it as a confirmed fact", answer: "Le fugitif a été interpellé par les gendarmes près de la gare.", en: "The fugitive was arrested by gendarmes near the station." } }
      - { es: "Il est en garde à vue à la gendarmerie depuis ce matin.", en: "He has been in police custody at the gendarmerie since this morning.", grammar: [g.depuis-present], vocab: [w.garde-à-vue, w.gendarmerie] }
      - { es: "On l'accuse d'avoir volé trois vélos ; il doit être jugé le mois prochain.", en: "He's accused of stealing three bikes; he's due to be tried next month.", grammar: [g.devoir-nuances], vocab: [w.accuser, w.juger] }
      - { es: "L'accusé a dû reconnaître les faits devant le juge.", en: "The defendant had to admit the facts before the judge.", grammar: [g.devoir-nuances], vocab: [w.accusé], error: { wrong: "L'accusé a dû reconnu les faits devant le juge.", explain: "devoir is followed by the infinitive: il a dû reconnaître.", grammar: g.devoir-nuances } }
      - { es: "S'il est reconnu coupable, il risque une peine de prison.", en: "If he's found guilty, he faces a prison sentence.", grammar: [g.si-present-futur], vocab: [w.coupable.n, w.peine-de-prison] }
      - { es: "Finalement, le tribunal l'a acquitté faute de preuves.", en: "In the end, the court acquitted him for lack of evidence.", grammar: [g.direct-object-pronouns], vocab: [w.acquitter] }
      - { es: "Selon son avocat, la condamnation aurait été trop sévère.", en: "According to his lawyer, the sentence was too harsh.", grammar: [g.conditionnel-journalistique], vocab: [w.condamnation] }
      - { es: "Un vol de vélo, ce n'est pas un crime, c'est un délit.", en: "Stealing a bike isn't a major crime, it's an offence.", grammar: [g.c-est-il-est], vocab: [w.délit] }
      - { es: "Il aurait déjà été condamné deux fois pour des délits semblables.", en: "He has reportedly already been convicted twice for similar offences.", grammar: [g.conditionnel-journalistique], vocab: [w.condamner, w.délit], error: { wrong: "Il aurait déjà été condamner deux fois pour des délits semblables.", explain: "After été, use the past participle: condamné.", grammar: g.conditionnel-journalistique } }
      - { es: "Pendant des siècles, on a emprisonné des voleurs dans ce palais au milieu de l'eau.", en: "For centuries, thieves were locked up in this palace in the middle of the water.", grammar: [g.on-instead-of-passive], vocab: [w.emprisonner] }
      - { es: "La justice doit être la même pour tous.", en: "Justice must be the same for everyone.", grammar: [g.devoir-nuances], vocab: [w.justice], transform: { instruction: "Make it softer, as advice: 'should be'", answer: "La justice devrait être la même pour tous.", en: "Justice should be the same for everyone." } }
      - { es: "Le coupable a dû passer la nuit en cellule.", en: "The culprit had to spend the night in a cell.", grammar: [g.devoir-nuances], vocab: [w.coupable.n] }
      - { es: "Les gendarmes ont dû fouiller toute la vieille ville.", en: "The gendarmes had to search the whole old town.", grammar: [g.devoir-nuances], vocab: [w.gendarme] }
      - { es: "Selon nos informations, le fugitif se serait caché dans une barque.", en: "According to our information, the fugitive hid in a rowing boat.", grammar: [g.conditionnel-journalistique], vocab: [w.fugitif] }
    exchanges:
      - q: { es: "Qu'est-ce qui s'est passé cette nuit ?", en: "What happened last night?" }
        a: { es: "Un détenu se serait évadé, d'après la radio.", en: "A prisoner reportedly escaped, according to the radio." }
        alt: ["Il y aurait eu une évasion.", "Je ne sais pas encore."]
        grammar: [g.conditionnel-journalistique]
        vocab: [w.s-évader]
      - q: { es: "On l'a retrouvé ?", en: "Have they found him?" }
        a: { es: "Oui, il aurait été interpellé près de la gare.", en: "Yes, he was reportedly arrested near the station." }
        alt: ["Oui, les gendarmes l'ont arrêté.", "Pas encore, il serait toujours en fuite."]
        grammar: [g.conditionnel-journalistique]
        vocab: [w.interpeller]
      - q: { es: "Il risque quoi ?", en: "What does he face?" }
        a: { es: "Une peine de prison, s'il est reconnu coupable.", en: "A prison sentence, if he's found guilty." }
        alt: ["Six mois de prison, peut-être.", "Une simple amende."]
        grammar: [g.si-present-futur]
        vocab: [w.peine-de-prison, w.coupable.n]
      - q: { es: "Le procès, c'est quand ?", en: "When's the trial?" }
        a: { es: "Il doit avoir lieu le mois prochain.", en: "It's due to take place next month." }
        alt: ["Le mois prochain, normalement.", "Il devait avoir lieu hier, mais il a été reporté."]
        grammar: [g.devoir-nuances]
        vocab: []
      - q: { es: "Il a été condamné ?", en: "Was he convicted?" }
        a: { es: "Non, le tribunal l'a acquitté faute de preuves.", en: "No, the court acquitted him for lack of evidence." }
        alt: ["Oui, à six mois de prison.", "On ne sait pas encore."]
        grammar: [g.passe-compose-avoir]
        vocab: [w.condamner, w.acquitter]
    texts:
      - title: "Dernière minute"
        es: ["Un homme se serait évadé cette nuit de la prison de la ville.", "Selon la gendarmerie, il aurait volé une barque pour traverser le lac.", "Le fugitif aurait été aperçu près de Talloires."]
        en: ["A man reportedly escaped from the town prison last night.", "According to the gendarmerie, he stole a rowing boat to cross the lake.", "The fugitive has reportedly been seen near Talloires."]
        grammar: [g.conditionnel-journalistique]
        vocab: [w.s-évader, w.gendarmerie, w.fugitif]
      - title: "Le Palais de l'Isle"
        es: ["Bâti au XIIe siècle sur un petit îlot du Thiou, le palais a longtemps servi de prison.", "Aujourd'hui, on peut le visiter.", "On dit que c'est le monument d'Annecy que les touristes préfèrent prendre en photo."]
        en: ["Built in the 12th century on a little islet in the Thiou, the palace long served as a prison.", "Today you can visit it.", "They say it's the monument in Annecy that tourists most like to photograph."]
        grammar: [g.passive-voice]
        vocab: [w.bâtir, w.servir-de]
    spicy:
      - { es: "Tu devrais être jugé pour avoir volé mon cœur… et ma dernière part de tarte.", en: "You ought to be put on trial for stealing my heart… and my last slice of tart.", altEs: ["Tu devrais être jugée pour avoir volé mon cœur… et ma dernière part de tarte."], grammar: [g.devoir-nuances], vocab: [w.juger] }
      - { es: "Tu es coupable d'être trop charmant ; ta peine : un dîner avec moi.", en: "You're guilty of being too charming; your sentence: dinner with me.", altEs: ["Tu es coupable d'être trop charmante ; ta peine : un dîner avec moi."], grammar: [g.c-est-il-est], vocab: [w.coupable.n] }
      - { es: "Selon des témoins, tu te serais évadé de la fête pour me rejoindre.", en: "According to witnesses, you slipped away from the party to join me.", altEs: ["Selon des témoins, tu te serais évadée de la fête pour me rejoindre."], grammar: [g.conditionnel-journalistique], vocab: [w.s-évader] }
      - { es: "Je suis coupable : j'ai regardé ton profil dix fois. Tu vas me condamner ?", en: "I'm guilty: I looked at your profile ten times. Are you going to convict me?", grammar: [g.futur-proche], vocab: [w.coupable.n, w.condamner] }
      - { es: "Tu as dû entendre parler de moi : je serais la meilleure danseuse d'Annecy.", en: "You must have heard of me: I'm said to be the best dancer in Annecy.", altEs: ["Tu as dû entendre parler de moi : je serais le meilleur danseur d'Annecy."], grammar: [g.devoir-nuances, g.conditionnel-journalistique], vocab: [] }
dialogues:
  - id: b2.u04.d1
    title: Au bord du lac
    context: "Emma and Karim are spending the day in Annecy. They sit on a bench by the lake and read the local paper."
    lines:
      - { speaker: Emma, es: "Regarde tous ces pédalos ! On aurait dû en louer un ce matin.", en: "Look at all those pedalos! We should have hired one this morning." }
      - { speaker: Karim, es: "Tu aurais pu le dire plus tôt ! Maintenant, il y a une heure d'attente.", en: "You could have said so earlier! Now there's an hour's wait." }
      - { speaker: Emma, es: "Je sais, je sais. Tiens, tu as vu le journal ? Un pédalo aurait heurté le ponton hier.", en: "I know, I know. Here, have you seen the paper? A pedalo reportedly hit the jetty yesterday." }
      - { speaker: Karim, es: "Il y a eu des blessés ?", en: "Was anyone hurt?" }
      - { speaker: Emma, es: "Non, d'après les gendarmes, les deux passagers seraient juste tombés à l'eau.", en: "No, according to the gendarmes, the two passengers just fell in the water." }
      - { speaker: Karim, es: "Ils ont dû avoir froid !", en: "They must have been cold!" }
      - { speaker: Emma, es: "Pas tant que ça : il paraît que l'eau était à vingt-quatre degrés.", en: "Not that much: apparently the water was twenty-four degrees." }
      - { speaker: Karim, es: "Bon, on devait aussi visiter le Palais de l'Isle cet après-midi. On y va ?", en: "Right, we were also supposed to visit the Palais de l'Isle this afternoon. Shall we go?" }
      - { speaker: Emma, es: "D'accord, mais d'abord une glace. Tu me dois bien ça !", en: "All right, but an ice cream first. You owe me that much!" }
      - { speaker: Karim, es: "Pourquoi je te devrais une glace ?", en: "Why would I owe you an ice cream?" }
      - { speaker: Emma, es: "Parce que c'est toi qui as refusé de louer le pédalo hier !", en: "Because you're the one who refused to hire the pedalo yesterday!" }
    questions:
      - { q: "Que regrette Emma au début ?", options: ["De ne pas avoir loué de pédalo", "D'être venue à Annecy", "D'avoir acheté le journal"], answer: 0, explain: "« On aurait dû en louer un ce matin »: a regret with aurait dû." }
      - { q: "Selon le journal, que s'est-il passé hier ?", options: ["Un bateau a coulé", "Un pédalo aurait heurté le ponton", "Deux touristes se sont perdus"], answer: 1, explain: "The journalistic conditional: « Un pédalo aurait heurté le ponton »." }
      - { q: "Que veut dire Karim par « Ils ont dû avoir froid » ?", options: ["Ils étaient obligés d'avoir froid", "Ils ont probablement eu froid", "Ils n'ont pas eu froid"], answer: 1, explain: "Here a dû expresses probability: they must have been cold." }
      - { q: "Pourquoi Karim devrait-il une glace à Emma ?", options: ["Il a perdu un pari", "Il a refusé de louer le pédalo la veille", "Il a oublié son portefeuille"], answer: 1, explain: "« c'est toi qui as refusé de louer le pédalo hier »." }
