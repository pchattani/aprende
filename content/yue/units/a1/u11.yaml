dialogues:
  - id: a1.u11.d1
    title: Kelvin 嘅一日
    context: Mandy asks Kelvin about his daily routine in Kennedy Town.
    lines:
      - { speaker: Mandy, es: "Kelvin，你住喺邊度呀？", en: "Kelvin, where do you live?" }
      - { speaker: Kelvin, es: "我住喺堅尼地城。", en: "I live in Kennedy Town." }
      - { speaker: Mandy, es: "你每日點樣返工呀？", en: "How do you get to work every day?" }
      - { speaker: Kelvin, es: "我通常坐叮叮去中環，大概四十分鐘。", en: "I usually take the tram to Central; it's about forty minutes." }
      - { speaker: Mandy, es: "咁慢？點解唔坐港鐵呀？", en: "That slow? Why don't you take the MTR?" }
      - { speaker: Kelvin, es: "因為坐叮叮嘅時候，我睇書，聽歌，好舒服。", en: "Because on the tram I read and listen to music. It's really comfortable." }
      - { speaker: Mandy, es: "你幾點起身呀？", en: "What time do you get up?" }
      - { speaker: Kelvin, es: "七點。我先沖涼，再食早餐，跟住去坐叮叮。", en: "Seven. First I shower, then I have breakfast, and then I go and catch the tram." }
      - { speaker: Mandy, es: "放工呢？", en: "And after work?" }
      - { speaker: Kelvin, es: "我間中去健身室，不過通常返屋企煮飯。", en: "Now and then I go to the gym, but usually I go home and cook." }
      - { speaker: Mandy, es: "你好叻呀！", en: "You're amazing!" }
    questions:
      - { q: "Kelvin住喺邊度？", options: ["中環", "堅尼地城", "北角"], answer: 1, explain: "我住喺堅尼地城: he lives in Kennedy Town." }
      - { q: "Kelvin通常點樣返工？", options: ["坐港鐵", "坐叮叮", "行路"], answer: 1, explain: "我通常坐叮叮去中環: he usually takes the tram." }
      - { q: "Kelvin朝早先做咩？", options: ["食早餐", "沖涼", "睇書"], answer: 1, explain: "我先沖涼，再食早餐: he showers first." }
      - { q: "Kelvin放工通常做咩？", options: ["去健身室", "返屋企煮飯", "去行街"], answer: 1, explain: "He goes to the gym only 間中 (now and then); 通常 he goes home and cooks." }
