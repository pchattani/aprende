id: c1.u03
title: "La dune du Pilat, où qu'on regarde"
lessons:
  - id: c1.u03.l1
    title: Une dune qui ait vue sur l'océan
    teach: [g.subjonctif-nuance]
    tip: "The mood changes the message: Je cherche un hôtel qui a vue sur la dune (I know one exists) / qui ait vue sur la dune (if there is one). Je comprends qu'il est parti (I realise) / qu'il soit parti (I understand why)."
    vocab: [w.dune, w.avancer, w.avance, w.recul, w.se-déplacer, w.déplacement, w.avaler, w.engloutir, w.ensevelir, w.fasciner, w.fasciné, w.fascination, w.mouvant, w.sable-mouvant, w.érosion, w.pinède, w.résine, w.landes, w.vertigineux, w.grandiose, w.majestueux, w.immensité, w.horizon, w.ralentir, w.choquer]
    sentences:
      - { es: "Nous cherchons un hôtel qui ait vue sur la dune.", en: "We're looking for a hotel with a view of the dune (if there is one).", altEs: ["On cherche un hôtel qui ait vue sur la dune."], grammar: [g.subjonctif-nuance, g.subjonctif-relatives], vocab: [w.dune], note: "Subjonctif: we don't know whether such a hotel exists." }
      - { es: "Nous avons trouvé un hôtel qui a vue sur la dune.", en: "We've found a hotel that has a view of the dune.", altEs: ["On a trouvé un hôtel qui a vue sur la dune."], grammar: [g.subjonctif-nuance], vocab: [w.dune], note: "Indicative: the hotel exists." }
      - { es: "Je comprends que la dune avance de quelques mètres par an.", en: "I gather that the dune moves forward a few metres a year.", grammar: [g.subjonctif-nuance], vocab: [w.avancer], note: "comprendre que + indicative = realise, gather." }
      - { es: "Je comprends qu'on soit fasciné par cette montagne de sable.", en: "I understand why people are fascinated by this mountain of sand.", altEs: ["Je comprends que les gens soient fascinés par cette montagne de sable."], grammar: [g.subjonctif-nuance], vocab: [w.fasciné], note: "comprendre que + subjonctif = find it understandable." }
      - { es: "Le fait que la dune se déplace inquiète les habitants.", en: "The fact that the dune is moving worries the residents.", grammar: [g.subjonctif-nuance], vocab: [w.se-déplacer] }
      - { es: "C'est la plus haute dune que j'aie jamais vue.", en: "It's the highest dune I have ever seen.", altEs: ["C'est la dune la plus haute que j'aie jamais vue."], grammar: [g.subjonctif-nuance, g.superlatives], vocab: [w.dune] }
      - { es: "Poussée par le vent, la dune avale peu à peu la pinède.", en: "Pushed by the wind, the dune is gradually swallowing the pine wood.", altEs: ["Poussée par le vent, la dune engloutit peu à peu la pinède."], grammar: [g.subjonctif-nuance], vocab: [w.avaler, w.pinède] }
      - { es: "Admettons que l'érosion ralentisse : la dune continuera quand même d'avancer.", en: "Let's suppose erosion slows down: the dune will still keep moving forward.", grammar: [g.subjonctif-nuance], vocab: [w.érosion, w.avancer] }
      - { es: "Depuis le sommet, la vue est vertigineuse : l'immensité de l'océan d'un côté, la forêt des Landes de l'autre.", en: "From the top the view is dizzying: the vastness of the ocean on one side, the Landes forest on the other.", grammar: [g.subjonctif-nuance], vocab: [w.vertigineux, w.immensité, w.landes] }
      - { es: "Le paysage est grandiose ; au loin, l'horizon se perd dans la brume.", en: "The landscape is magnificent; in the distance the horizon fades into the mist.", grammar: [g.pronominal-verbs], vocab: [w.grandiose, w.horizon, w.brume] }
      - { es: "Ce sable est mouvant, mais il n'y a pas de sables mouvants dangereux sur la dune.", en: "This sand shifts, but there is no dangerous quicksand on the dune.", grammar: [g.negation-ne-pas], vocab: [w.mouvant, w.sable-mouvant] }
      - { es: "Les pins sentaient la résine ; la dune, majestueuse, se dressait devant nous.", en: "The pine trees smelt of resin; the dune rose majestically before us.", grammar: [g.imparfait-uses], vocab: [w.résine, w.majestueux] }
      - { es: "Avec le recul, je comprends sa fascination pour cet endroit.", en: "Looking back, I understand his fascination with this place.", grammar: [g.subjonctif-nuance], vocab: [w.recul, w.fascination] }
      - { es: "Je cherche un guide qui connaît les marées.", en: "I'm looking for a guide who knows the tides.", grammar: [g.subjonctif-nuance], vocab: [w.marée], transform: { instruction: "Use the subjonctif to show you don't know if such a guide exists", answer: "Je cherche un guide qui connaisse les marées.", en: "I'm looking for a guide who knows the tides (if there is one)." } }
      - { es: "Il est sûr que la dune avancera.", en: "It is certain that the dune will move forward.", grammar: [g.subjonctif-nuance], vocab: [w.avancer], transform: { instruction: "Make it negative: il n'est pas sûr que…", answer: "Il n'est pas sûr que la dune avance.", en: "It isn't certain that the dune will move forward." } }
      - { es: "Le fait qu'elle mente me choque.", en: "The fact that she's lying shocks me.", grammar: [g.subjonctif-nuance], vocab: [w.mentir], error: { wrong: "Le fait qu'elle ment me choque.", explain: "At the start of a sentence, le fait que is followed by the subjonctif: qu'elle mente.", grammar: g.subjonctif-nuance } }
    exchanges:
      - q: { es: "Tu connais un camping qui soit près de la dune ?", en: "Do you know a campsite that's near the dune?" }
        a: { es: "Oui, il y en a plusieurs au pied de la dune, dans la pinède.", en: "Yes, there are several at the foot of the dune, in the pine wood." }
        alt: ["Non, je n'en connais aucun qui soit si près.", "Oui, j'en connais un très bien."]
        grammar: [g.subjonctif-nuance, g.subjonctif-relatives]
        vocab: [w.dune, w.pinède]
      - q: { es: "C'est vrai que la dune bouge ?", en: "Is it true that the dune moves?" }
        a: { es: "Oui, elle se déplace d'un à cinq mètres par an vers l'intérieur des terres.", en: "Yes, it moves one to five metres a year inland." }
        alt: ["Oui, poussée par le vent d'ouest.", "Oui, de quelques mètres chaque année."]
        grammar: [g.subjonctif-nuance]
        vocab: [w.se-déplacer]
      - q: { es: "Pourquoi tout le monde est fasciné par cet endroit ?", en: "Why is everyone fascinated by this place?" }
        a: { es: "Je comprends qu'on le soit : où trouver ailleurs une montagne de sable face à l'océan ?", en: "I understand why: where else can you find a mountain of sand facing the ocean?" }
        alt: ["Parce que la vue est grandiose.", "C'est unique en Europe."]
        grammar: [g.subjonctif-nuance]
        vocab: [w.fasciné, w.océan]
      - q: { es: "Tu penses que la forêt va disparaître ?", en: "Do you think the forest is going to disappear?" }
        a: { es: "Pas entièrement, mais il est probable que la dune engloutira encore des centaines de pins.", en: "Not entirely, but the dune will probably swallow up hundreds more pine trees." }
        alt: ["Je doute qu'elle disparaisse.", "Une partie, sans doute."]
        grammar: [g.subjonctif-nuance, g.subjonctif-doute]
        vocab: [w.engloutir]
      - q: { es: "Ça vaut la peine de monter jusqu'en haut ?", en: "Is it worth climbing to the top?" }
        a: { es: "Absolument, la vue est vertigineuse, surtout le soir.", en: "Absolutely, the view is dizzying, especially in the evening." }
        alt: ["Oui, c'est grandiose.", "Oui, mais prends de l'eau."]
        grammar: [g.subjonctif-nuance]
        vocab: [w.vertigineux]
    texts:
      - title: "Panneau au pied de la dune"
        es: ["Cette dune mesure environ cent mètres de haut et près de trois kilomètres de long.", "Poussée par les vents d'ouest, elle avance chaque année vers l'intérieur des terres.", "En été, un escalier facilite la montée côté forêt."]
        en: ["This dune is about a hundred metres high and nearly three kilometres long.", "Pushed by the westerly winds, it moves inland every year.", "In summer, a staircase makes the climb easier on the forest side."]
        grammar: [g.subjonctif-nuance]
        vocab: [w.dune, w.avancer]
      - title: "Carte postale"
        es: ["Chère Maman, je comprends enfin que tu aies tant aimé cet endroit.", "La vue sur l'horizon est majestueuse.", "Je cherche un restaurant qui serve des huîtres face au coucher du soleil : je t'en reparle !"]
        en: ["Dear Mum, I finally understand why you loved this place so much.", "The view of the horizon is majestic.", "I'm looking for a restaurant that serves oysters facing the sunset: I'll tell you about it!"]
        grammar: [g.subjonctif-nuance]
        vocab: [w.horizon, w.majestueux]
    spicy:
      - { es: "Je cherche quelqu'un qui sache danser et qui ne parle pas de son ex.", en: "I'm looking for someone who can dance and doesn't talk about their ex.", grammar: [g.subjonctif-nuance, g.subjonctif-relatives], vocab: [] }
      - { es: "Je comprends que tu sois fasciné : moi aussi, je me trouve fascinante.", en: "I understand why you're fascinated: I find myself fascinating too.", grammar: [g.subjonctif-nuance], vocab: [w.fasciné] }
      - { es: "C'est le plus beau coucher de soleil que j'aie jamais vu, mais j'ai surtout regardé tes yeux.", en: "It's the most beautiful sunset I've ever seen, but mostly I was looking at your eyes.", grammar: [g.subjonctif-nuance, g.superlatives], vocab: [w.coucher-de-soleil] }
      - { es: "Le fait que tu m'aies attendu en haut de la dune, sous ce soleil, mérite un dîner.", en: "The fact that you waited for me at the top of the dune, in that sun, deserves a dinner.", grammar: [g.subjonctif-nuance, g.subjonctif-passe], vocab: [w.dune] }
      - { es: "Tu avances vers moi comme la dune vers la forêt : lentement, mais sans reculer.", en: "You're moving towards me like the dune towards the forest: slowly, but without backing off.", grammar: [g.subjonctif-nuance], vocab: [w.avancer, w.dune] }
  - id: c1.u03.l2
    title: Quoi qu'il arrive
    teach: [g.qui-que-quoi-que]
    tip: "qui que (whoever), quoi que (whatever), où que (wherever), quel que soit + noun (whatever the…) and si + adjective + que (however): all take the subjonctif. Quoi que in two words; quoique in one word means 'although'."
    vocab: [w.où-que, w.qui-que, w.quoi-que, w.quel-que, w.si-que, w.quoi-qu-il-en-soit, w.quoi-qu-il-arrive, w.qui-que-ce-soit, w.quoi-que-ce-soit, w.pour-autant-que, w.océan, w.atlantique.nm, w.littoral, w.houle, w.courant.n, w.baïne, w.noyade, w.se-noyer, w.maître-nageur, w.drapeau, w.nageur, w.baigneur, w.difficulté]
    sentences:
      - { es: "Où que l'on regarde depuis le sommet, on voit l'océan ou la forêt.", en: "Wherever you look from the top, you see the ocean or the forest.", altEs: ["Où qu'on regarde depuis le sommet, on voit l'océan ou la forêt."], grammar: [g.qui-que-quoi-que], vocab: [w.où-que, w.océan] }
      - { es: "Quelle que soit la météo, des centaines de personnes montent chaque jour.", en: "Whatever the weather, hundreds of people climb up every day.", altEs: ["Quel que soit le temps, des centaines de personnes montent chaque jour."], grammar: [g.qui-que-quoi-que], vocab: [w.quel-que] }
      - { es: "Quoi qu'en disent les guides, la descente est plus dure que la montée.", en: "Whatever the guides say, going down is harder than going up.", grammar: [g.qui-que-quoi-que], vocab: [w.quoi-que] }
      - { es: "Si impressionnante qu'elle soit, la dune n'a que quelques milliers d'années.", en: "Impressive as it is, the dune is only a few thousand years old.", altEs: ["Aussi impressionnante qu'elle soit, la dune n'a que quelques milliers d'années."], grammar: [g.qui-que-quoi-que], vocab: [w.si-que] }
      - { es: "Qui que vous soyez, ne vous baignez jamais quand le drapeau est rouge.", en: "Whoever you are, never swim when the flag is red.", grammar: [g.qui-que-quoi-que, g.imperative], vocab: [w.qui-que, w.drapeau] }
      - { es: "Quels que soient les risques, il veut surfer près des baïnes.", en: "Whatever the risks, he wants to surf near the tidal pools.", grammar: [g.qui-que-quoi-que], vocab: [w.quel-que, w.baïne] }
      - { es: "Quoi qu'il arrive, restez entre les drapeaux, près du maître-nageur.", en: "Whatever happens, stay between the flags, near the lifeguard.", grammar: [g.qui-que-quoi-que, g.imperative], vocab: [w.quoi-qu-il-arrive, w.drapeau, w.maître-nageur] }
      - { es: "Sur le littoral atlantique, les courants sont forts et la houle peut être puissante.", en: "On the Atlantic coastline the currents are strong and the swell can be powerful.", grammar: [g.qui-que-quoi-que], vocab: [w.littoral, w.courant.n, w.houle] }
      - { es: "Chaque été, des baigneurs imprudents risquent la noyade dans les baïnes.", en: "Every summer, careless swimmers risk drowning in the tidal pools.", grammar: [g.qui-que-quoi-que], vocab: [w.noyade, w.baïne] }
      - { es: "Si tu as un problème, ne parle pas à qui que ce soit d'autre qu'au maître-nageur.", en: "If you have a problem, don't talk to anyone other than the lifeguard.", grammar: [g.qui-que-quoi-que], vocab: [w.qui-que-ce-soit, w.maître-nageur] }
      - { es: "Il est parti sans dire quoi que ce soit.", en: "He left without saying anything at all.", altEs: ["Il est parti sans rien dire."], grammar: [g.qui-que-quoi-que], vocab: [w.quoi-que-ce-soit] }
      - { es: "Pour autant que je sache, la plage n'est pas surveillée en hiver.", en: "As far as I know, the beach isn't supervised in winter.", grammar: [g.qui-que-quoi-que, g.subjonctif-irregular], vocab: [w.pour-autant-que] }
      - { es: "Quoi qu'il en soit, l'Atlantique n'est pas la Méditerranée : méfiez-vous.", en: "Be that as it may, the Atlantic is not the Mediterranean: be careful.", grammar: [g.qui-que-quoi-que], vocab: [w.quoi-qu-il-en-soit, w.atlantique.nm] }
      - { es: "Peu importe ce que tu fais, fais-le bien.", en: "No matter what you do, do it well.", grammar: [g.qui-que-quoi-que], vocab: [w.peu-importe], transform: { instruction: "Rewrite it with quoi que", answer: "Quoi que tu fasses, fais-le bien.", en: "Whatever you do, do it well." } }
      - { es: "La dune est haute, mais on la gravit facilement.", en: "The dune is high, but it's easy to climb.", grammar: [g.qui-que-quoi-que], vocab: [w.dune], transform: { instruction: "Rewrite it with si … que + subjonctif", answer: "Si haute qu'elle soit, on gravit facilement la dune.", alt: ["Si haute qu'elle soit, on la gravit facilement.", "Aussi haute qu'elle soit, on la gravit facilement."], en: "High as it is, the dune is easy to climb." } }
      - { es: "Quelles que soient vos raisons, la baignade est interdite.", en: "Whatever your reasons, swimming is forbidden.", grammar: [g.qui-que-quoi-que], vocab: [w.quel-que], error: { wrong: "Quel que soit vos raisons, la baignade est interdite.", explain: "Quel que agrees with the noun after être, and être agrees too: quelles que soient vos raisons.", grammar: g.qui-que-quoi-que } }
    exchanges:
      - q: { es: "On peut se baigner ici ?", en: "Can we swim here?" }
        a: { es: "Seulement entre les drapeaux ; ailleurs, il y a des baïnes et des courants dangereux.", en: "Only between the flags; elsewhere there are tidal pools and dangerous currents." }
        alt: ["Oui, mais près du maître-nageur.", "Non, le drapeau est rouge aujourd'hui."]
        grammar: [g.qui-que-quoi-que]
        vocab: [w.drapeau, w.baïne, w.courant.n]
      - q: { es: "Et si la houle est trop forte ?", en: "And if the swell is too strong?" }
        a: { es: "Alors on reste sur le sable, quoi qu'en disent les enfants.", en: "Then we stay on the sand, whatever the children say." }
        alt: ["On ne se baigne pas, quoi qu'il arrive.", "On attend demain."]
        grammar: [g.qui-que-quoi-que]
        vocab: [w.houle, w.quoi-que]
      - q: { es: "Tu as vu quelqu'un en difficulté ?", en: "Did you see anyone in trouble?" }
        a: { es: "Non, je n'ai vu qui que ce soit dans l'eau depuis une heure.", en: "No, I haven't seen anyone at all in the water for an hour." }
        alt: ["Non, personne.", "Oui, j'ai prévenu le maître-nageur."]
        grammar: [g.qui-que-quoi-que]
        vocab: [w.qui-que-ce-soit]
      - q: { es: "La plage est surveillée jusqu'à quand ?", en: "Until when is the beach supervised?" }
        a: { es: "Pour autant que je sache, jusqu'à fin septembre.", en: "As far as I know, until the end of September." }
        alt: ["Jusqu'à fin septembre.", "Je ne sais pas, demande au poste de secours."]
        grammar: [g.qui-que-quoi-que]
        vocab: [w.pour-autant-que]
      - q: { es: "On monte sur la dune même s'il pleut ?", en: "Are we climbing the dune even if it rains?" }
        a: { es: "Oui, quel que soit le temps : on n'est là qu'aujourd'hui.", en: "Yes, whatever the weather: we're only here today." }
        alt: ["Oui, quoi qu'il arrive.", "Non, attendons qu'il fasse beau."]
        grammar: [g.qui-que-quoi-que]
        vocab: [w.quel-que]
    texts:
      - title: "Consignes de sécurité"
        es: ["Quel que soit votre niveau, baignez-vous uniquement dans la zone surveillée.", "Où que vous soyez, ne nagez jamais contre le courant.", "Quoi qu'il arrive, levez le bras pour alerter le maître-nageur."]
        en: ["Whatever your level, swim only in the supervised area.", "Wherever you are, never swim against the current.", "Whatever happens, raise your arm to alert the lifeguard."]
        grammar: [g.qui-que-quoi-que]
        vocab: [w.quel-que, w.où-que, w.quoi-qu-il-arrive, w.maître-nageur]
      - title: "Message de Léa"
        es: ["Le drapeau est rouge, la houle est énorme.", "Quoi qu'en dise Hugo, je ne me baigne pas aujourd'hui.", "Je vous attends au café, au pied de la dune."]
        en: ["The flag is red, the swell is huge.", "Whatever Hugo says, I'm not swimming today.", "I'll wait for you at the café at the foot of the dune."]
        grammar: [g.qui-que-quoi-que]
        vocab: [w.drapeau, w.houle]
    spicy:
      - { es: "Où que tu ailles cet été, je trouverai une excuse pour y être aussi.", en: "Wherever you go this summer, I'll find an excuse to be there too.", grammar: [g.qui-que-quoi-que], vocab: [w.où-que] }
      - { es: "Quoi que tu dises, ce maillot te va très bien.", en: "Whatever you say, that swimsuit really suits you.", grammar: [g.qui-que-quoi-que], vocab: [w.quoi-que] }
      - { es: "Si charmant que soit le maître-nageur, je ne vais pas faire semblant de me noyer.", en: "Charming as the lifeguard may be, I'm not going to pretend to drown.", grammar: [g.qui-que-quoi-que], vocab: [w.si-que, w.maître-nageur, w.se-noyer] }
      - { es: "Quel que soit ton signe astrologique, tu es mon type.", en: "Whatever your star sign, you're my type.", grammar: [g.qui-que-quoi-que], vocab: [w.quel-que] }
      - { es: "Je n'ai jamais dit à qui que ce soit que tu ronflais. Enfin, presque jamais.", en: "I've never told anyone at all that you snore. Well, almost never.", grammar: [g.qui-que-quoi-que], vocab: [w.qui-que-ce-soit] }
  - id: c1.u03.l3
    title: Vive le surf !
    teach: [g.subjonctif-independent]
    tip: "The subjonctif can stand alone for orders and wishes about a third person: Qu'il entre ! Que la fête commence ! Pourvu qu'il fasse beau ! Fixed formulas drop que: Vive les vacances ! Advienne que pourra. Ainsi soit-il."
    vocab: [w.vive, w.soit, w.surfeur, w.advienne-que-pourra, w.crépuscule, w.aube, w.aurore, w.coucher-de-soleil, w.lever-de-soleil, w.surfer, w.recommencer]
    sentences:
      - { es: "Qu'il pleuve ou qu'il vente, les surfeurs sont à l'eau.", en: "Come rain or shine, the surfers are in the water.", grammar: [g.subjonctif-independent], vocab: [w.surfeur] }
      - { es: "Pourvu que les vagues soient bonnes demain !", en: "Let's hope the waves are good tomorrow!", grammar: [g.subjonctif-independent], vocab: [w.vague] }
      - { es: "Que ceux qui ont peur restent sur la plage !", en: "Let those who are afraid stay on the beach!", grammar: [g.subjonctif-independent], vocab: [] }
      - { es: "Soit, je vous accompagne jusqu'au phare.", en: "Very well, I'll come with you as far as the lighthouse.", altEs: ["Soit, je t'accompagne jusqu'au phare."], grammar: [g.subjonctif-independent], vocab: [w.soit, w.phare] }
      - { es: "Vive les vacances et vive l'océan !", en: "Hooray for the holidays and long live the ocean!", altEs: ["Vivent les vacances et vive l'océan !"], grammar: [g.subjonctif-independent], vocab: [w.vive, w.océan] }
      - { es: "On part ce soir, advienne que pourra.", en: "We're leaving tonight, come what may.", grammar: [g.subjonctif-independent], vocab: [w.advienne-que-pourra] }
      - { es: "Que la fête commence !", en: "Let the party begin!", grammar: [g.subjonctif-independent], vocab: [w.fête] }
      - { es: "Ils viendront soit à pied, soit à vélo.", en: "They'll come either on foot or by bike.", grammar: [g.subjonctif-independent], vocab: [w.soit] }
      - { es: "Montons sur la dune à l'aube : au lever du soleil, il n'y a personne.", en: "Let's climb the dune at dawn: at sunrise there's nobody there.", altEs: ["Montons sur la dune à l'aurore : au lever du soleil, il n'y a personne."], grammar: [g.imperative], vocab: [w.aube, w.lever-de-soleil] }
      - { es: "Au crépuscule, la dune devient rose, puis grise.", en: "At dusk the dune turns pink, then grey.", grammar: [g.subjonctif-independent], vocab: [w.crépuscule] }
      - { es: "Les photographes attendent le coucher de soleil ; les plus courageux reviennent à l'aurore.", en: "The photographers wait for the sunset; the bravest come back at daybreak.", grammar: [g.superlatives], vocab: [w.coucher-de-soleil, w.aurore] }
      - { es: "Moi, que je me lève à cinq heures ? Jamais de la vie !", en: "Me, get up at five? Not on your life!", grammar: [g.subjonctif-independent], vocab: [], note: "Indignant que + subjonctif: rejecting an idea." }
      - { es: "Qu'ils attendent, le maître-nageur n'est pas encore arrivé.", en: "Let them wait, the lifeguard hasn't arrived yet.", grammar: [g.subjonctif-independent], vocab: [w.maître-nageur] }
      - { es: "Je veux qu'il fasse beau demain !", en: "I want the weather to be nice tomorrow!", grammar: [g.subjonctif-independent], vocab: [], transform: { instruction: "Turn it into an independent wish with pourvu que", answer: "Pourvu qu'il fasse beau demain !", en: "Let's hope the weather is nice tomorrow!" } }
      - { es: "Je veux que les surfeurs sortent de l'eau.", en: "I want the surfers to get out of the water.", grammar: [g.subjonctif-independent], vocab: [w.surfeur], transform: { instruction: "Make it a direct third-person order (que + subjonctif)", answer: "Que les surfeurs sortent de l'eau !", en: "Get the surfers out of the water!" } }
      - { es: "Vive la mariée !", en: "Long live the bride!", grammar: [g.subjonctif-independent], vocab: [w.vive], error: { wrong: "Vit la mariée !", explain: "The wish uses the subjonctif vive, not the indicative vit.", grammar: g.subjonctif-independent } }
    exchanges:
      - q: { es: "Le moniteur dit que la houle est trop forte.", en: "The instructor says the swell is too strong." }
        a: { es: "Soit, on attendra cet après-midi. Pourvu que ça se calme !", en: "Very well, we'll wait until this afternoon. Let's hope it calms down!" }
        alt: ["Tant pis, on attendra.", "Soit, pas de surf ce matin."]
        grammar: [g.subjonctif-independent]
        vocab: [w.soit, w.houle]
      - q: { es: "Les enfants veulent aller voir les surfeurs.", en: "The children want to go and watch the surfers." }
        a: { es: "Qu'ils y aillent, mais qu'ils restent loin de l'eau !", en: "Let them go, but they must stay away from the water!" }
        alt: ["Qu'ils y aillent avec leur père.", "D'accord, mais pas tout seuls."]
        grammar: [g.subjonctif-independent]
        vocab: [w.surfeur]
      - q: { es: "On se lève à cinq heures pour voir le lever du soleil ?", en: "Shall we get up at five to see the sunrise?" }
        a: { es: "Moi, que je me lève à cinq heures ? Je préfère le coucher de soleil !", en: "Me, get up at five? I prefer the sunset!" }
        alt: ["Oui, bonne idée !", "Plutôt le crépuscule, non ?"]
        grammar: [g.subjonctif-independent]
        vocab: [w.lever-de-soleil, w.coucher-de-soleil]
      - q: { es: "Tu n'as pas peur de partir sans réserver ?", en: "Aren't you afraid of leaving without booking?" }
        a: { es: "Non : on verra bien sur place, advienne que pourra.", en: "No: we'll see when we get there, come what may." }
        alt: ["Un peu, mais tant pis.", "Advienne que pourra !"]
        grammar: [g.subjonctif-independent]
        vocab: [w.advienne-que-pourra]
      - q: { es: "Il fait toujours beau ici ?", en: "Is the weather always nice here?" }
        a: { es: "Non, mais qu'il pleuve ou qu'il fasse beau, la plage est magnifique.", en: "No, but rain or shine, the beach is magnificent." }
        alt: ["Pas toujours, loin de là.", "Souvent, en été."]
        grammar: [g.subjonctif-independent]
        vocab: []
    texts:
      - title: "Affiche du club de surf"
        es: ["Que vous soyez débutant ou confirmé, venez surfer avec nous !", "Cours tous les jours, de l'aube au crépuscule.", "Vive l'océan, vive le surf !"]
        en: ["Whether you're a beginner or experienced, come and surf with us!", "Lessons every day, from dawn to dusk.", "Long live the ocean, long live surfing!"]
        grammar: [g.subjonctif-independent]
        vocab: [w.aube, w.crépuscule, w.vive]
      - title: "Texto du soir"
        es: ["Le coucher de soleil sur la dune était incroyable.", "Demain, on recommence à l'aurore.", "Pourvu que personne ne se réveille en retard !"]
        en: ["The sunset over the dune was incredible.", "Tomorrow we do it again at daybreak.", "Let's hope nobody wakes up late!"]
        grammar: [g.subjonctif-independent]
        vocab: [w.coucher-de-soleil, w.aurore]
    spicy:
      - { es: "Pourvu qu'il m'invite à voir le coucher de soleil ; sinon, c'est moi qui l'invite.", en: "Let's hope he invites me to watch the sunset; otherwise I'll invite him.", grammar: [g.subjonctif-independent], vocab: [w.coucher-de-soleil] }
      - { es: "Que ceux qui ne veulent pas danser restent à table ; nous, on va sur la plage.", en: "Let those who don't want to dance stay at the table; we're going to the beach.", grammar: [g.subjonctif-independent], vocab: [] }
      - { es: "Soit, je t'apprends à surfer ; mais si tu tombes, je ris.", en: "Very well, I'll teach you to surf; but if you fall, I'll laugh.", grammar: [g.subjonctif-independent], vocab: [w.soit] }
      - { es: "Vive les surfeurs qui savent aussi cuisiner !", en: "Here's to surfers who can cook too!", grammar: [g.subjonctif-independent], vocab: [w.vive, w.surfeur] }
      - { es: "Je t'embrasse au crépuscule, advienne que pourra.", en: "I'm kissing you at dusk, come what may.", grammar: [g.subjonctif-independent], vocab: [w.crépuscule, w.advienne-que-pourra] }
  - id: c1.u03.l4
    title: Le bassin, sauf à marée basse
    teach: [g.qui-que-quoi-que, g.subjonctif-nuance]
    tip: "Exceptions and additions: sauf, excepté, hormis (except), à l'exception de, outre (besides). With a clause: sauf si + indicative, à moins que + subjonctif."
    vocab: [w.bassin, w.ostréiculteur, w.ostréiculture, w.huîtrier, w.goéland, w.cormoran, w.coquille, w.crabe, w.homard, w.langoustine, w.bigorneau, w.algue, w.estuaire, w.embouchure, w.lagune, w.marécage, w.sauf, w.excepté, w.hormis, w.outre, w.à-l-exception-de, w.cabane, w.plateau, w.rythme, w.banc]
    sentences:
      - { es: "Le bassin d'Arcachon est l'un des grands centres de l'ostréiculture en France.", en: "The Arcachon basin is one of the great centres of oyster farming in France.", grammar: [g.superlatives], vocab: [w.bassin, w.ostréiculture] }
      - { es: "Quelle que soit la saison, l'ostréiculteur travaille au rythme des marées.", en: "Whatever the season, the oyster farmer works to the rhythm of the tides.", grammar: [g.qui-que-quoi-que], vocab: [w.ostréiculteur, w.quel-que, w.marée] }
      - { es: "On peut acheter des huîtres tous les jours, sauf le lundi.", en: "You can buy oysters every day except Monday.", altEs: ["On peut acheter des huîtres tous les jours, excepté le lundi."], grammar: [g.qui-que-quoi-que], vocab: [w.sauf, w.huître] }
      - { es: "Tout le monde a aimé les huîtres, à l'exception de mon frère.", en: "Everyone liked the oysters, with the exception of my brother.", altEs: ["Tout le monde a aimé les huîtres, sauf mon frère.", "Tout le monde a aimé les huîtres, excepté mon frère."], grammar: [g.qui-que-quoi-que], vocab: [w.à-l-exception-de] }
      - { es: "Hormis quelques goélands, la plage était déserte.", en: "Apart from a few seagulls, the beach was deserted.", altEs: ["À part quelques goélands, la plage était déserte."], grammar: [g.imparfait-uses], vocab: [w.hormis, w.goéland] }
      - { es: "Outre les huîtres, le plateau comprenait des langoustines, des crabes et des bigorneaux.", en: "Besides oysters, the platter included langoustines, crabs and winkles.", grammar: [g.qui-que-quoi-que], vocab: [w.outre, w.langoustine, w.crabe, w.bigorneau] }
      - { es: "Sur le banc de sable, on voit des huîtriers chercher des coquillages.", en: "On the sandbank you can see oystercatchers looking for shellfish.", grammar: [g.verbs-plus-infinitive], vocab: [w.huîtrier] }
      - { es: "À marée basse, les algues et les coquilles vides couvrent le sable.", en: "At low tide, seaweed and empty shells cover the sand.", grammar: [g.qui-que-quoi-que], vocab: [w.algue, w.coquille, w.marée] }
      - { es: "Le homard est hors de prix, à moins que tu ne le pêches toi-même.", en: "Lobster costs a fortune, unless you catch it yourself.", grammar: [g.subjonctif-conjonctions, g.ne-expletif], vocab: [w.homard] }
      - { es: "La Leyre se jette dans le bassin par un petit delta, entre forêts et marécages.", en: "The Leyre flows into the basin through a small delta, between forests and marshes.", grammar: [g.pronominal-verbs], vocab: [w.marécage] }
      - { es: "La Gironde est l'estuaire de la Garonne et de la Dordogne ; son embouchure est très large.", en: "The Gironde is the estuary of the Garonne and the Dordogne; its mouth is very wide.", grammar: [g.possessives], vocab: [w.estuaire, w.embouchure] }
      - { es: "Le bassin n'est pas une lagune fermée : il communique avec l'océan.", en: "The basin isn't a closed lagoon: it connects with the ocean.", grammar: [g.negation-ne-pas], vocab: [w.lagune, w.bassin] }
      - { es: "Je cherche un ostréiculteur qui accepte de nous faire visiter sa cabane.", en: "I'm looking for an oyster farmer who would agree to show us round his hut.", grammar: [g.subjonctif-nuance, g.subjonctif-relatives], vocab: [w.ostréiculteur, w.cabane] }
      - { es: "On ira sur l'île aux Oiseaux, sauf s'il pleut.", en: "We'll go to the Île aux Oiseaux, unless it rains.", grammar: [g.subjonctif-conjonctions], vocab: [w.sauf], transform: { instruction: "Use à moins que + subjonctif", answer: "On ira sur l'île aux Oiseaux, à moins qu'il ne pleuve.", alt: ["On ira sur l'île aux Oiseaux, à moins qu'il pleuve."], en: "We'll go to the Île aux Oiseaux, unless it rains." } }
      - { es: "Tous les restaurants sont fermés, sauf un.", en: "All the restaurants are closed, except one.", grammar: [g.qui-que-quoi-que], vocab: [w.sauf], transform: { instruction: "Replace sauf with a more formal word", answer: "Tous les restaurants sont fermés, hormis un.", alt: ["Tous les restaurants sont fermés, excepté un.", "Tous les restaurants sont fermés, à l'exception d'un seul."], en: "All the restaurants are closed, apart from one." } }
      - { es: "Je mange de tout, sauf si c'est trop épicé.", en: "I eat everything, except if it's too spicy.", grammar: [g.subjonctif-conjonctions], vocab: [w.sauf], error: { wrong: "Je mange de tout, sauf si ce soit trop épicé.", explain: "Sauf si is followed by the indicative, like si: sauf si c'est…", grammar: g.subjonctif-nuance } }
    exchanges:
      - q: { es: "On peut manger des huîtres toute l'année ?", en: "Can you eat oysters all year round?" }
        a: { es: "Oui, quelle que soit la saison, mais beaucoup les préfèrent en hiver.", en: "Yes, whatever the season, but many people prefer them in winter." }
        alt: ["Oui, toute l'année.", "Oui, mais elles sont meilleures en hiver."]
        grammar: [g.qui-que-quoi-que]
        vocab: [w.quel-que, w.huître]
      - q: { es: "Qu'est-ce qu'il y a sur le plateau ?", en: "What's on the platter?" }
        a: { es: "Outre les huîtres, des crevettes, des bigorneaux et deux langoustines.", en: "Besides the oysters, prawns, winkles and two langoustines." }
        alt: ["Des huîtres et des crabes.", "Un peu de tout, sauf du homard."]
        grammar: [g.qui-que-quoi-que]
        vocab: [w.outre, w.bigorneau, w.langoustine]
      - q: { es: "Tout le monde vient à la dégustation ?", en: "Is everyone coming to the tasting?" }
        a: { es: "Oui, à l'exception de Hugo, qui est allergique aux fruits de mer.", en: "Yes, except Hugo, who's allergic to seafood." }
        alt: ["Tout le monde sauf Hugo.", "Oui, hormis Hugo."]
        grammar: [g.qui-que-quoi-que]
        vocab: [w.à-l-exception-de]
      - q: { es: "C'est quoi, ces oiseaux noirs sur les piquets ?", en: "What are those black birds on the posts?" }
        a: { es: "Des cormorans : ils font sécher leurs ailes après la pêche.", en: "Cormorants: they're drying their wings after fishing." }
        alt: ["Des cormorans.", "Je crois que ce sont des cormorans."]
        grammar: [g.faire-causatif]
        vocab: [w.cormoran]
      - q: { es: "Ça marche bien, l'ostréiculture ?", en: "Is oyster farming doing well?" }
        a: { es: "Ça dépend des années : il suffit que l'eau soit trop chaude pour perdre une partie de la récolte.", en: "It depends on the year: if the water's too warm, part of the harvest can be lost." }
        alt: ["Pas toujours, c'est un métier difficile.", "Oui, mais c'est un métier dur."]
        grammar: [g.subjonctif-nuance]
        vocab: [w.ostréiculture]
    texts:
      - title: "Panneau d'une cabane"
        es: ["Dégustation d'huîtres tous les jours, sauf le lundi.", "Outre nos huîtres, nous proposons des bigorneaux et des crevettes.", "Quel que soit le temps, la terrasse est ouverte."]
        en: ["Oyster tasting every day except Monday.", "Besides our oysters, we offer winkles and prawns.", "Whatever the weather, the terrace is open."]
        grammar: [g.qui-que-quoi-que]
        vocab: [w.sauf, w.outre, w.bigorneau]
      - title: "Sortie nature"
        es: ["Depuis le bateau, nous avons vu des goélands, des cormorans et des huîtriers.", "À marée basse, des bancs de sable apparaissent au milieu du bassin.", "Hormis le bruit du moteur, tout était calme."]
        en: ["From the boat we saw seagulls, cormorants and oystercatchers.", "At low tide, sandbanks appear in the middle of the basin.", "Apart from the noise of the engine, everything was calm."]
        grammar: [g.qui-que-quoi-que]
        vocab: [w.goéland, w.cormoran, w.huîtrier, w.hormis]
    spicy:
      - { es: "J'aime tous les fruits de mer, sauf les huîtres ; mais pour toi, je fais une exception.", en: "I like all seafood except oysters; but for you I'll make an exception.", grammar: [g.qui-que-quoi-que], vocab: [w.sauf] }
      - { es: "Outre ton sourire, j'aime beaucoup ta façon d'ouvrir les huîtres.", en: "Besides your smile, I really like the way you open oysters.", grammar: [g.qui-que-quoi-que], vocab: [w.outre] }
      - { es: "Hormis le goéland qui nous a volé un croissant, c'était un pique-nique parfait.", en: "Apart from the seagull that stole a croissant from us, it was a perfect picnic.", grammar: [g.qui-que-quoi-que], vocab: [w.hormis, w.goéland] }
      - { es: "Tu es comme un homard : rouge dès que je te fais un compliment.", en: "You're like a lobster: red as soon as I pay you a compliment.", grammar: [g.comparatives], vocab: [w.homard] }
      - { es: "Je cherche un ostréiculteur qui sache ouvrir les huîtres… et mon cœur.", en: "I'm looking for an oyster farmer who knows how to open oysters… and my heart.", grammar: [g.subjonctif-nuance, g.subjonctif-relatives], vocab: [w.ostréiculteur] }
dialogues:
  - id: c1.u03.d1
    title: Au sommet de la dune
    context: Léa and Hugo have just climbed the Dune du Pilat. A lifeguard on his break stops to chat with them.
    lines:
      - { speaker: Léa, es: "Enfin en haut ! Où qu'on regarde, c'est grandiose : l'océan d'un côté, la forêt de l'autre.", en: "At the top at last! Wherever you look, it's magnificent: the ocean on one side, the forest on the other." }
      - { speaker: Hugo, es: "On dirait que la dune avale les pins. Elle avance vraiment ?", en: "It looks as if the dune is swallowing the pine trees. Does it really move?" }
      - { speaker: Maître-nageur, es: "Oui, d'un à cinq mètres par an, selon les vents. Le fait qu'elle bouge surprend toujours les visiteurs.", en: "Yes, one to five metres a year, depending on the winds. The fact that it moves always surprises visitors." }
      - { speaker: Léa, es: "Je comprends qu'on soit surpris ! Et en bas, on peut se baigner ?", en: "I can understand people being surprised! And down there, can you swim?" }
      - { speaker: Maître-nageur, es: "Seulement entre les drapeaux. Quoi qu'il arrive, ne vous approchez pas des baïnes : les courants sont très forts.", en: "Only between the flags. Whatever happens, don't go near the tidal pools: the currents are very strong." }
      - { speaker: Hugo, es: "Même pour un bon nageur ?", en: "Even for a good swimmer?" }
      - { speaker: Maître-nageur, es: "Si bon nageur que vous soyez, l'Atlantique est plus fort que vous. Chaque été, on sauve des gens qui le croyaient.", en: "However good a swimmer you are, the Atlantic is stronger than you. Every summer we rescue people who thought otherwise." }
      - { speaker: Léa, es: "Message reçu. Et pour le coucher de soleil, on reste ici ?", en: "Message received. And for the sunset, shall we stay here?" }
      - { speaker: Maître-nageur, es: "C'est le meilleur endroit, à condition de redescendre avant la nuit. Pourvu que le ciel reste clair !", en: "It's the best spot, as long as you come down before nightfall. Let's hope the sky stays clear!" }
      - { speaker: Hugo, es: "Et après, des huîtres au bord du bassin. Vive les vacances !", en: "And afterwards, oysters by the basin. Hooray for the holidays!" }
    questions:
      - { q: "Que voit-on du sommet de la dune ?", options: ["Seulement la mer", "L'océan et la forêt", "La ville de Bordeaux", "Les Pyrénées"], answer: 1, explain: "« l'océan d'un côté, la forêt de l'autre »." }
      - { q: "De combien la dune avance-t-elle chaque année ?", options: ["D'un à cinq mètres", "De cent mètres", "Elle ne bouge pas"], answer: 0, explain: "« d'un à cinq mètres par an, selon les vents »." }
      - { q: "Que conseille le maître-nageur ?", options: ["De se baigner où on veut", "De ne pas s'approcher des baïnes", "De nager loin de la plage"], answer: 1, explain: "« ne vous approchez pas des baïnes : les courants sont très forts »." }
      - { q: "Que veut faire Hugo après le coucher de soleil ?", options: ["Surfer", "Manger des huîtres au bord du bassin", "Remonter sur la dune", "Rentrer à Bordeaux"], answer: 1, explain: "« des huîtres au bord du bassin »." }
writing:
  - task: "You are looking for a holiday rental near the Dune du Pilat. Write to an agency describing the place you want (une maison qui ait vue sur l'océan…), and contrast it with what you know already exists (indicatif)."
    min: 110
    max: 190
    use: [w.dune, w.pinède, w.océan, w.horizon, w.majestueux]
    useAtLeast: 3
    grammar: [g.subjonctif-nuance]
    expect:
      - { pattern: "\\b(qui|o[uù]|que|qu['’])\\s?(l['’]on |on |je |nous )?(ait|aient|soit|soient|puisse|puissent|offre|donne|permette|se trouve|soit situ)\\b", hint: "Use the subjonctif for a place you are looking for: une maison qui ait vue sur l'océan, où l'on puisse…" }
      - { pattern: "\\b(cherch|souhait|voudr|aimer|besoin|r[eê]v)", hint: "Say what you are looking for: nous cherchons, nous souhaiterions…" }
    model: { es: "Madame, Monsieur, nous préparons nos vacances d'août et nous cherchons une maison qui ait vue sur l'océan, près de la dune du Pilat. Nous souhaiterions un lieu où l'on puisse se reposer loin de la foule, idéalement au milieu de la pinède. L'an dernier, nous avions loué une villa qui se trouvait au Pyla et qui offrait une vue majestueuse sur l'horizon, mais elle a été vendue depuis. Connaîtriez-vous une maison qui soit à la fois calme et proche de la plage, et qui puisse accueillir six personnes ? Le prix n'est pas ce qui compte le plus pour nous, mais nous aimerions qu'il reste raisonnable. Je vous remercie par avance de votre réponse.", en: "Dear Sir or Madam, we are planning our August holiday and are looking for a house with a view of the ocean, near the Dune du Pilat. We would like a place where one can rest far from the crowds, ideally in the middle of the pine forest. Last year we rented a villa that was in Le Pyla and that offered a majestic view of the horizon, but it has since been sold. Would you know of a house that is both quiet and close to the beach, and that can accommodate six people? Price is not what matters most to us, but we would like it to remain reasonable. Thank you in advance for your reply." }
  - task: "Write the safety instructions for swimmers on the Atlantic coast near the dune (Quoi qu'il arrive…, où que vous soyez…, qui que vous soyez…, quelle que soit la météo…)."
    min: 110
    max: 190
    use: [w.baïne, w.houle, w.maître-nageur, w.drapeau, w.noyade]
    useAtLeast: 3
    grammar: [g.qui-que-quoi-que]
    expect:
      - { pattern: "\\b(quoi qu|o[uù] qu|qui qu|quel(le)?s? qu)", hint: "Use quoi que, où que, qui que, quel que: quoi qu'il arrive, où que vous soyez…" }
    model: { es: "Plages de l'Atlantique : règles de sécurité à respecter. Quel que soit votre niveau de natation, l'océan reste dangereux. La houle peut être très forte et les baïnes, ces trous d'eau qui se forment à marée basse, créent des courants puissants. Qui que vous soyez, baignez-vous uniquement dans les zones surveillées par les maîtres-nageurs. Respectez toujours la couleur du drapeau : où que vous soyez, un drapeau rouge signifie que la baignade est interdite. Quoi qu'il arrive, ne nagez jamais contre le courant : laissez-vous porter et faites signe aux secours. Quelles que soient les conditions météo, ne laissez jamais les enfants seuls au bord de l'eau. Chaque été, des noyades pourraient être évitées si chacun respectait ces règles simples.", en: "Atlantic beaches: safety rules to follow. Whatever your swimming level, the ocean remains dangerous. The swell can be very strong and the baïnes, those pools that form at low tide, create powerful currents. Whoever you are, swim only in areas watched by lifeguards. Always respect the colour of the flag: wherever you are, a red flag means swimming is forbidden. Whatever happens, never swim against the current: let yourself be carried and signal to the rescue services. Whatever the weather conditions, never leave children alone at the water's edge. Every summer, drownings could be avoided if everyone followed these simple rules." }
  - task: "Write a toast or short speech for a surfing competition or a friend's farewell party on the beach, using independent subjonctifs (Vive…, Que la fête commence !, Advienne que pourra, Soit !)."
    min: 110
    max: 190
    use: [w.vive, w.surfeur, w.advienne-que-pourra, w.crépuscule, w.recommencer]
    useAtLeast: 3
    grammar: [g.subjonctif-independent]
    expect:
      - { pattern: "\\bvive\\b|\\bqu(e\\s|['’])[^.!?,]{2,40}!|advienne que pourra|ainsi soit-il", hint: "Use independent subjonctifs: Vive…, Que la fête commence !, Advienne que pourra." }
    model: { es: "Chers amis, chers surfeurs, merci d'être venus si nombreux ce soir, au crépuscule, sur cette plage qui nous a tant donné. Voilà dix ans que notre club existe, dix ans de vagues, de chutes et de fous rires. Demain, Lucas part s'installer à Hossegor. Qu'il y trouve des vagues aussi belles que les nôtres ! Que la houle soit toujours avec lui, et qu'il n'oublie jamais ses amis du Pilat ! Certains disent qu'il est fou de tout quitter. Soit ! Advienne que pourra : la vie est trop courte pour ne pas suivre ses rêves. Et si un jour il veut tout recommencer ici, la porte restera ouverte. Alors levons nos verres : vive Lucas, vive le surf, et que la fête commence !", en: "Dear friends, dear surfers, thank you for coming in such numbers this evening, at dusk, on this beach that has given us so much. Our club has existed for ten years now, ten years of waves, falls and fits of laughter. Tomorrow Lucas is moving to Hossegor. May he find waves there as beautiful as ours! May the swell always be with him, and may he never forget his friends from the Pilat! Some say he's mad to leave everything. So be it! Come what may: life is too short not to follow your dreams. And if one day he wants to start all over again here, the door will remain open. So let's raise our glasses: long live Lucas, long live surfing, and let the party begin!" }
  - task: "Describe the Arcachon basin and its oyster farmers for a travel magazine, adding exceptions and reservations (sauf à marée basse, excepté…, hormis…, à l'exception de…)."
    min: 110
    max: 190
    use: [w.bassin, w.ostréiculteur, w.cabane, w.sauf, w.hormis]
    useAtLeast: 3
    grammar: [g.qui-que-quoi-que, g.subjonctif-nuance]
    expect:
      - { pattern: "\\b(sauf|except[eé]|hormis|outre|exception d)", hint: "Add exceptions: sauf, excepté, hormis, à l'exception de…" }
    model: { es: "Au pied de la dune du Pilat s'étend le bassin d'Arcachon, une lagune presque fermée où l'océan entre deux fois par jour. Le paysage change sans cesse : à marée haute, l'eau couvre tout, sauf les petites cabanes en bois perchées au-dessus de l'eau. À marée basse, en revanche, apparaissent les bancs de sable et les parcs à huîtres. Ici, les ostréiculteurs travaillent toute l'année, excepté quelques jours en hiver, lorsque la tempête les en empêche. Hormis les touristes de l'été, le bassin reste un lieu calme, habité par les goélands et les cormorans. Toutes les huîtres de la région sont délicieuses, à l'exception peut-être de celles qu'on mange trop vite, sans un verre de vin blanc !", en: "At the foot of the Dune du Pilat lies the Arcachon basin, an almost enclosed lagoon that the ocean enters twice a day. The landscape changes constantly: at high tide the water covers everything except the little wooden huts perched above the water. At low tide, on the other hand, the sandbanks and oyster beds appear. Here the oyster farmers work all year round, except for a few days in winter when storms prevent them. Apart from the summer tourists, the basin remains a quiet place, inhabited by gulls and cormorants. All the oysters of the region are delicious, except perhaps the ones you eat too quickly, without a glass of white wine!" }
