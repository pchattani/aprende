id: c2.u07
title: 廣州西關
lessons:
  - id: c2.u07.l1
    title: 西關大屋同騎樓
    teach: [g.guangzhou-vs-hk]
    vocab: [w.sai1-gwaan1, w.sai1-gwaan1-daai6-uk1, w.ke4-lau2, w.tong3-lung4, w.mun5-zau1-coeng1, w.ceng1-zyun1, w.soeng6-haa6-gau2, w.lai6-waan1, w.saa1-min6, w.can4-gaa1-ci4, w.gwong2-zau1-taap3, w.siu2-maan4-jiu1, w.bak1-ging1-lou6, w.jyut6-sau3, w.ng5-joeng4, w.joeng4-sing4, w.faa1-sing4, w.zyu1-gong1, w.saang2-seng4, w.sing4-zung1-cyun1, w.caak3-cin1, w.lou5-zi6-hou6, w.gwong2-fu2, w.gwong2-fu2-waa2]
    tip: "Guangzhou and Hong Kong speak the same Cantonese: same tones, same grammar. The differences are mostly words, loans and script (simplified in Guangzhou, traditional in Hong Kong)."
    sentences:
      - { es: "西關係老廣州嘅中心，即係而家荔灣區一帶。", en: "Xiguan was the heart of old Guangzhou, roughly today's Liwan District.", altEs: ["西關係舊時廣州嘅中心，即係而家荔灣區一帶。", "西關即係而家荔灣區一帶，係老廣州嘅中心。"], grammar: [g.guangzhou-vs-hk], vocab: [w.sai1-gwaan1, w.lai6-waan1] }
      - { es: "以前住西關大屋嘅，多數都係有錢人家。", en: "The people who lived in the Xiguan mansions were mostly wealthy families.", altEs: ["以前住喺西關大屋嘅，大多數都係有錢人家。"], grammar: [g.guangzhou-vs-hk], vocab: [w.sai1-gwaan1-daai6-uk1] }
      - { es: "西關大屋門口有三道門，中間嗰道就係趟櫳。", en: "A Xiguan mansion has three gates at the entrance; the middle one is the sliding wooden gate.", altEs: ["西關大屋門口有三重門，中間嗰重就係趟櫳。"], grammar: [g.guangzhou-vs-hk], vocab: [w.sai1-gwaan1-daai6-uk1, w.tong3-lung4], note: "From outside in: a half-height door (腳門), the 趟櫳 of horizontal wooden bars, and the heavy main door." }
      - { es: "陽光一照入滿洲窗，成間屋都變晒色。", en: "When sunlight shines through the stained-glass windows, the whole room changes colour.", altEs: ["陽光照入滿洲窗，成間屋都變晒顏色。"], grammar: [g.guangzhou-vs-hk], vocab: [w.mun5-zau1-coeng1] }
      - { es: "騎樓下面可以遮太陽，落雨都唔使擔遮。", en: "You can keep out of the sun under the arcades, and you don't need an umbrella when it rains.", altEs: ["騎樓底可以遮太陽，落雨都唔使開遮。"], grammar: [g.guangzhou-vs-hk], vocab: [w.ke4-lau2] }
      - { es: "上下九條街兩邊都係騎樓，好多老字號都喺度。", en: "Shangxiajiu is lined with arcade buildings on both sides, and lots of old established shops are there.", altEs: ["上下九兩邊都係騎樓，好多老字號都喺嗰度。"], grammar: [g.guangzhou-vs-hk], vocab: [w.soeng6-haa6-gau2, w.ke4-lau2, w.lou5-zi6-hou6] }
      - { es: "廣州人叫自己個城市做羊城，又叫花城。", en: "Guangzhou people call their city the City of Rams, and also the City of Flowers.", altEs: ["廣州又叫羊城，又叫花城。"], grammar: [g.guangzhou-vs-hk], vocab: [w.joeng4-sing4, w.faa1-sing4, w.ng5-joeng4], transform: { instruction: "Ask why Guangzhou is called the City of Rams", answer: "點解廣州叫羊城㗎？", alt: ["點解廣州又叫羊城？", "廣州點解叫做羊城㗎？"] } }
      - { es: "廣州塔中間幼，上下闊，所以大家叫佢小蠻腰。", en: "Canton Tower is narrow in the middle and wide at top and bottom, so people call it the 'slim waist'.", altEs: ["廣州塔中間幼、上下闊，所以有個名叫小蠻腰。"], grammar: [g.guangzhou-vs-hk], vocab: [w.gwong2-zau1-taap3, w.siu2-maan4-jiu1] }
      - { es: "廣州同香港講嘅都係廣東話，傾偈完全冇問題。", en: "Guangzhou and Hong Kong both speak Cantonese; chatting is no problem at all.", altEs: ["廣州人同香港人都係講廣東話，傾偈完全冇問題。"], grammar: [g.guangzhou-vs-hk], vocab: [w.gwong2-dung1-waa2], error: { wrong: "廣州同香港講嘅唔係同一種話，傾偈好難。", explain: "Guangzhou and Hong Kong Cantonese are fully mutually intelligible; they differ only in some words.", grammar: g.guangzhou-vs-hk } }
      - { es: "老一輩嘅人叫廣州做「省城」，因為佢係廣東省嘅中心。", en: "The older generation call Guangzhou 'the provincial city', because it's the centre of Guangdong province.", altEs: ["老人家叫廣州做「省城」，因為佢係廣東省嘅中心。"], grammar: [g.guangzhou-vs-hk], vocab: [w.saang2-seng4] }
      - { es: "條城中村拆遷之後，好多老街坊都搬走咗。", en: "After the urban village was demolished, many of the old neighbours moved away.", altEs: ["城中村拆遷之後，好多街坊都搬咗走。"], grammar: [g.guangzhou-vs-hk], vocab: [w.sing4-zung1-cyun1, w.caak3-cin1, w.gaai1-fong1] }
      - { es: "呢間老字號喺北京路開咗成百年。", en: "This old established shop has been open on Beijing Road for a whole century.", altEs: ["呢間老字號喺北京路開咗成一百年。"], grammar: [g.guangzhou-vs-hk], vocab: [w.lou5-zi6-hou6, w.bak1-ging1-lou6], transform: { instruction: "Ask how long this shop has been open on Beijing Road", answer: "呢間老字號喺北京路開咗幾耐？", alt: ["呢間老字號喺北京路開咗幾多年？"] } }
      - { es: "我哋行完沙面，再去陳家祠睇木雕。", en: "After walking round Shamian, we'll go to the Chen Clan Academy to see the wood carvings.", altEs: ["行完沙面，我哋再去陳家祠睇木雕。"], grammar: [g.guangzhou-vs-hk], vocab: [w.saa1-min6, w.can4-gaa1-ci4], jp: "ngo5 dei6 haang4 jyun4 saa1 min6 zoi3 heoi3 can4 gaa1 ci4 tai2 muk6 diu1" }
      - { es: "廣府話同香港話嘅分別主要喺詞彙，唔係語法。", en: "The differences between Guangzhou and Hong Kong Cantonese are mainly in vocabulary, not grammar.", altEs: ["廣府話同香港話主要係詞彙唔同，語法就差唔多。"], grammar: [g.guangzhou-vs-hk], vocab: [w.gwong2-fu2-waa2, w.gwong2-fu2] }
      - { es: "廣州寫簡體字，香港寫繁體字，不過講出嚟都係同一種話。", en: "Guangzhou writes simplified characters and Hong Kong traditional ones, but spoken aloud it's the same language.", altEs: ["廣州用簡體字，香港用繁體字，不過講出嚟都係一樣。"], grammar: [g.guangzhou-vs-hk], vocab: [w.gaan2-tai2-zi6, w.faan4-tai2-zi6], jp: "gwong2 zau1 se2 gaan2 tai2 zi6 hoeng1 gong2 se2 faan4 tai2 zi6 bat1 gwo3 gong2 ceot1 lei4 dou1 hai6 tung4 jat1 zung2 waa2" }
      - { es: "夜晚坐船遊珠江，可以見到廣州塔着晒燈。", en: "Take a night boat trip on the Pearl River and you can see Canton Tower all lit up.", altEs: ["夜晚坐船遊珠江，可以睇到廣州塔着晒燈。"], grammar: [g.guangzhou-vs-hk], vocab: [w.zyu1-gong1, w.gwong2-zau1-taap3], jp: "je6 maan5 co5 syun4 jau4 zyu1 gong1 ho2 ji5 gin3 dou2 gwong2 zau1 taap3 zoek6 saai3 dang1" }
    exchanges:
      - q: { es: "西關喺廣州邊度㗎？", en: "Where in Guangzhou is Xiguan?" }
        a: { es: "喺荔灣區，上下九一帶都係。", en: "In Liwan District; the whole area around Shangxiajiu." }
        alt: ["喺荔灣區。", "上下九嗰頭。"]
        grammar: [g.guangzhou-vs-hk]
        vocab: [w.sai1-gwaan1, w.lai6-waan1, w.soeng6-haa6-gau2]
      - q: { es: "趟櫳係咩嚟㗎？", en: "What's a 趟櫳?" }
        a: { es: "係西關大屋門口一道可以拉開嘅木閘。", en: "It's a wooden gate at the entrance of a Xiguan mansion that slides open." }
        alt: ["一道木閘嚟㗎。", "西關大屋門口嗰道木閘。"]
        grammar: [g.guangzhou-vs-hk]
        vocab: [w.tong3-lung4, w.sai1-gwaan1-daai6-uk1]
      - q: { es: "點解廣州叫羊城？", en: "Why is Guangzhou called the City of Rams?" }
        a: { es: "因為五羊嘅傳說，相傳有五個仙人騎羊嚟到廣州。", en: "Because of the Five Rams legend: five immortals are said to have ridden rams to Guangzhou." }
        alt: ["因為五羊嘅傳說。", "相傳有五個仙人騎羊嚟過。"]
        grammar: [g.guangzhou-vs-hk]
        vocab: [w.joeng4-sing4, w.ng5-joeng4]
      - q: { es: "廣州人聽唔聽得明香港人講嘢？", en: "Can Guangzhou people understand Hongkongers?" }
        a: { es: "梗係聽得明，大家都係講廣東話，只係有啲詞唔同。", en: "Of course; everyone speaks Cantonese, only some words differ." }
        alt: ["聽得明，都係廣東話嚟㗎。", "完全冇問題。"]
        grammar: [g.guangzhou-vs-hk]
        vocab: [w.gwong2-dung1-waa2]
      - q: { es: "你今晚想去邊度？", en: "Where do you want to go tonight?" }
        a: { es: "去珠江睇小蠻腰，夜晚着晒燈好靚。", en: "To the Pearl River to see the 'slim waist'; it's beautiful lit up at night." }
        alt: ["去睇廣州塔。", "坐船遊珠江。"]
        grammar: [g.guangzhou-vs-hk]
        vocab: [w.zyu1-gong1, w.siu2-maan4-jiu1]
    texts:
      - title: "西關一日遊"
        es: ["朝早我哋喺上下九飲早茶。", "下晝去睇西關大屋，Luna 好鍾意啲滿洲窗。", "夜晚坐船遊珠江，望住小蠻腰慢慢轉色。"]
        en: ["In the morning we had dim sum in Shangxiajiu.", "In the afternoon we went to see a Xiguan mansion; Luna loved the stained-glass windows.", "At night we took a boat on the Pearl River and watched the 'slim waist' slowly change colour."]
        grammar: [g.guangzhou-vs-hk]
        vocab: [w.soeng6-haa6-gau2, w.mun5-zau1-coeng1, w.siu2-maan4-jiu1]
    spicy:
      - { es: "你好似滿洲窗咁，陽光一照，成個人都發光。", en: "You're like a stained-glass window: when the sun hits you, you glow all over.", altEs: ["你好似一隻滿洲窗咁，陽光一照就成個人發光。"], grammar: [g.guangzhou-vs-hk], vocab: [w.mun5-zau1-coeng1] }
      - { es: "喺騎樓底避雨，同你企近啲都唔係壞事。", en: "Sheltering from the rain under the arcade, standing closer to you isn't a bad thing.", altEs: ["喺騎樓下面避雨，同你企埋啲都唔係壞事。"], grammar: [g.guangzhou-vs-hk], vocab: [w.ke4-lau2] }
      - { es: "廣州塔叫小蠻腰，不過我覺得你條腰先至係正宗。", en: "Canton Tower is called the 'slim waist', but I think yours is the real thing.", altEs: ["廣州塔叫做小蠻腰，但係我覺得你條腰先係正宗。"], grammar: [g.guangzhou-vs-hk], vocab: [w.siu2-maan4-jiu1, w.zing3-zung1] }
      - { es: "陪我遊完珠江，再陪我行多個西關好唔好？", en: "After the Pearl River cruise, will you walk round Xiguan with me too?", altEs: ["遊完珠江，你再陪我行吓西關好唔好？"], grammar: [g.guangzhou-vs-hk], vocab: [w.zyu1-gong1, w.sai1-gwaan1], jp: "pui4 ngo5 jau4 jyun4 zyu1 gong1 zoi3 pui4 ngo5 haang4 do1 go3 sai1 gwaan1 hou2 m4 hou2" }
  - id: c2.u07.l2
    title: 一盅兩件
    teach: [g.guangzhou-vs-hk, g.address-terms]
    vocab: [w.zou2-caa4, w.jat1-zung1-loeng5-gin6, w.zung1.e, w.je6-caa4, w.haa6-ng5-caa4, w.teng5-zai2-zuk1, w.soeng1-pei4-naai5, w.goeng1-zong6-naai5, w.ho2-fan2, w.gon1-caau2-ngau4-ho2, w.baak6-cit3-gai1, w.lou5-fo2-tong1, w.bou1.c, w.bou1-zai2-faan6, w.loeng4-caa4, w.can4-cyun1-fan2, w.seon6-dak1, w.lou5-seoi2, w.dei6-dou6, w.zing3-zung1, w.maai5-daan1, w.mei5-neoi2, w.seoi3-go1]
    tip: "In Guangzhou restaurants staff are routinely called 靚仔 / 靚女, or 帥哥 / 美女; Hong Kong diners are more likely to say 唔該 and wave."
    sentences:
      - { es: "廣州人鍾意講「一盅兩件」，即係一盅茶，兩件點心。", en: "Guangzhou people love to say 'one cup, two pieces': a cup of tea and two dim sum.", altEs: ["廣州人成日講「一盅兩件」，即係一盅茶同兩件點心。"], grammar: [g.guangzhou-vs-hk], vocab: [w.jat1-zung1-loeng5-gin6, w.zung1.e] }
      - { es: "靚女，唔該埋單！", en: "Excuse me, miss, the bill please!", altEs: ["美女，唔該埋單！", "靚女，唔該買單！"], grammar: [g.address-terms], vocab: [w.leng3-neoi2, w.maai4-daan1], transform: { instruction: "Call a young male waiter instead", answer: "靚仔，唔該埋單！", alt: ["帥哥，唔該埋單！", "靚仔，唔該買單！"] } }
      - { es: "喺廣州，叫侍應做「帥哥」、「美女」都好普遍。", en: "In Guangzhou it's very common to call waiters 'handsome' and 'beautiful'.", altEs: ["喺廣州，好多人叫侍應做「帥哥」、「美女」。"], grammar: [g.address-terms, g.guangzhou-vs-hk], vocab: [w.seoi3-go1, w.mei5-neoi2] }
      - { es: "艇仔粥原本係珠江上面啲艇家賣嘅粥。", en: "Sampan congee was originally sold by the boat people on the Pearl River.", altEs: ["艇仔粥本來係珠江上面啲艇家賣嘅粥。"], grammar: [g.guangzhou-vs-hk], vocab: [w.teng5-zai2-zuk1, w.zyu1-gong1] }
      - { es: "雙皮奶係順德大良嘅名物，面頭有兩層奶皮。", en: "Double-skin milk pudding is a speciality of Daliang in Shunde; it has two layers of skin on top.", altEs: ["雙皮奶係順德大良出名嘅甜品，面頭有兩層奶皮。"], grammar: [g.guangzhou-vs-hk], vocab: [w.soeng1-pei4-naai5, w.seon6-dak1] }
      - { es: "薑撞奶要用好熱嘅牛奶撞落薑汁度，一陣就會凝固。", en: "For ginger milk curd you pour very hot milk onto ginger juice, and it sets in a moment.", altEs: ["整薑撞奶要將好熱嘅牛奶撞落薑汁，一陣就凝固。"], grammar: [g.guangzhou-vs-hk], vocab: [w.goeng1-zong6-naai5] }
      - { es: "乾炒牛河要炒到夠乾身又唔油膩，好考師傅功夫。", en: "Dry-fried beef ho fun has to be dry yet not greasy; it really tests the chef's skill.", altEs: ["乾炒牛河要炒得乾身又唔油，好考師傅功夫。"], grammar: [g.address-terms], vocab: [w.gon1-caau2-ngau4-ho2, w.si1-fu2] }
      - { es: "廣東人飲老火湯，一煲湯要煲三四個鐘。", en: "Cantonese people drink slow-cooked soup; a pot takes three or four hours to make.", altEs: ["廣東人鍾意飲老火湯，一煲要煲三四個鐘。"], grammar: [g.guangzhou-vs-hk], vocab: [w.lou5-fo2-tong1, w.bou1.c], transform: { instruction: "Ask how long a pot of slow-cooked soup takes", answer: "一煲老火湯要煲幾耐？", alt: ["一煲老火湯要煲幾多個鐘？", "老火湯要煲幾耐㗎？"] } }
      - { es: "冬天食煲仔飯，最正就係食埋啲飯焦。", en: "Eating claypot rice in winter, the best bit is the crispy rice at the bottom.", altEs: ["冬天食煲仔飯，最好食就係啲飯焦。"], grammar: [g.guangzhou-vs-hk], vocab: [w.bou1-zai2-faan6] }
      - { es: "喉嚨痛就去飲碗涼茶啦。", en: "If your throat's sore, go and drink a bowl of herbal tea.", altEs: ["喉嚨痛就飲碗涼茶啦。", "喉嚨痛嘅話，去飲碗涼茶啦。"], grammar: [g.guangzhou-vs-hk], vocab: [w.loeng4-caa4] }
      - { es: "陳村粉係順德陳村嘅特色，又薄又滑。", en: "Chencun rice noodles are a speciality of Chencun in Shunde, thin and silky.", altEs: ["陳村粉係順德陳村出名嘅嘢，又薄又滑。"], grammar: [g.guangzhou-vs-hk], vocab: [w.can4-cyun1-fan2, w.seon6-dak1] }
      - { es: "呢間嘅滷水鵝好正宗，好多老廣專登嚟食。", en: "The soy-braised goose here is the real thing; lots of old locals come specially to eat it.", altEs: ["呢度嘅滷水鵝好正宗，好多老廣特登嚟食。"], grammar: [g.guangzhou-vs-hk], vocab: [w.lou5-seoi2, w.zing3-zung1, w.lou5-gwong2] }
      - { es: "喺香港講「埋單」，廣州就好多人講「買單」。", en: "In Hong Kong you say 'maai4 daan1' for the bill; in Guangzhou many people say 'maai5 daan1'.", altEs: ["香港人講「埋單」，廣州好多人講「買單」。"], grammar: [g.guangzhou-vs-hk], vocab: [w.maai4-daan1, w.maai5-daan1] }
      - { es: "食完晚飯仲有夜茶，廣州人真係好鍾意飲茶。", en: "After dinner there's still late-night dim sum; Guangzhou people really love yum cha.", altEs: ["食完飯仲有夜茶飲，廣州人真係好鍾意飲茶。"], grammar: [g.guangzhou-vs-hk], vocab: [w.je6-caa4] }
      - { es: "師傅，碟河粉唔該唔好落蔥。", en: "Chef, no spring onion in the rice noodles, please.", altEs: ["師傅，唔該碟河粉唔好落蔥。", "師傅，河粉唔該走蔥。"], grammar: [g.address-terms], vocab: [w.si1-fu2, w.ho2-fan2], error: { wrong: "老細，碟河粉唔該唔好落蔥。", explain: "The cook is addressed as 師傅 (a skilled worker); 老細 is the boss or shop owner.", grammar: g.address-terms } }
      - { es: "呢間茶樓好地道，連下午茶都要排隊食白切雞。", en: "This teahouse is the genuine article; people queue for white-cut chicken even at afternoon tea.", altEs: ["呢間茶樓好地道，下午茶都要排隊食白切雞。"], grammar: [g.guangzhou-vs-hk], vocab: [w.dei6-dou6, w.haa6-ng5-caa4, w.baak6-cit3-gai1] }
    exchanges:
      - q: { es: "靚仔，飲咩茶呀？", en: "What tea will you have, young man?" }
        a: { es: "一壺普洱，唔該。", en: "A pot of pu'er, please." }
        alt: ["普洱，唔該。", "鐵觀音，唔該。"]
        grammar: [g.address-terms]
        vocab: [w.leng3-zai2]
      - q: { es: "順德有咩好食？", en: "What's good to eat in Shunde?" }
        a: { es: "雙皮奶同陳村粉都好出名。", en: "Double-skin milk pudding and Chencun rice noodles are both famous." }
        alt: ["雙皮奶。", "陳村粉同雙皮奶。"]
        grammar: [g.guangzhou-vs-hk]
        vocab: [w.seon6-dak1, w.soeng1-pei4-naai5, w.can4-cyun1-fan2]
      - q: { es: "美女，仲要唔要加啲咩？", en: "Anything else, miss?" }
        a: { es: "唔使喇，唔該買單。", en: "No thanks, the bill please." }
        alt: ["唔使喇，唔該埋單。", "夠喇，買單唔該。"]
        grammar: [g.address-terms, g.guangzhou-vs-hk]
        vocab: [w.mei5-neoi2, w.maai5-daan1]
      - q: { es: "呢度啲艇仔粥地唔地道？", en: "Is the sampan congee here authentic?" }
        a: { es: "好地道，老闆係西關人，做咗幾十年。", en: "Very authentic; the owner is from Xiguan and has been making it for decades." }
        alt: ["好正宗。", "好地道，老字號嚟㗎。"]
        grammar: [g.guangzhou-vs-hk]
        vocab: [w.teng5-zai2-zuk1, w.dei6-dou6]
      - q: { es: "你點解成日飲涼茶嘅？", en: "Why are you always drinking herbal tea?" }
        a: { es: "廣州天氣咁熱，飲涼茶可以降火。", en: "Guangzhou is so hot, and herbal tea cools you down." }
        alt: ["降火囉。", "天氣熱嘛。"]
        grammar: [g.guangzhou-vs-hk]
        vocab: [w.loeng4-caa4]
    texts:
      - title: "順德美食日記"
        es: ["今日我哋去咗順德大良。", "Bonchita 一口氣食咗三碗雙皮奶。", "Leo 話陳村粉滑到好似絲咁。"]
        en: ["Today we went to Daliang in Shunde.", "Bonchita ate three bowls of double-skin milk pudding in one go.", "Leo says the Chencun rice noodles are as smooth as silk."]
        grammar: [g.guangzhou-vs-hk]
        vocab: [w.seon6-dak1, w.soeng1-pei4-naai5, w.can4-cyun1-fan2]
      - title: "茶樓營業時間"
        es: ["早茶：朝早六點到十一點。", "下午茶：下晝兩點到五點。", "夜茶：夜晚九點到半夜一點。"]
        en: ["Morning tea: six to eleven in the morning.", "Afternoon tea: two to five in the afternoon.", "Night tea: nine in the evening to one in the morning."]
        grammar: [g.guangzhou-vs-hk]
        vocab: [w.zou2-caa4, w.haa6-ng5-caa4, w.je6-caa4]
    spicy:
      - { es: "靚女，你同雙皮奶一樣，又滑又甜。", en: "Gorgeous, you're like double-skin milk pudding: smooth and sweet.", altEs: ["美女，你好似雙皮奶咁，又滑又甜。"], grammar: [g.address-terms], vocab: [w.leng3-neoi2, w.soeng1-pei4-naai5] }
      - { es: "一盅兩件唔夠喇，我想同你飲成日茶。", en: "One cup and two dim sum isn't enough; I want to have tea with you all day.", altEs: ["一盅兩件點夠呀，我想同你飲成日茶。"], grammar: [g.guangzhou-vs-hk], vocab: [w.jat1-zung1-loeng5-gin6] }
      - { es: "今晚我請你食煲仔飯，啲飯焦全部留畀你。", en: "Tonight I'm treating you to claypot rice, and you get all the crispy bits.", altEs: ["今晚請你食煲仔飯，飯焦全部畀你。"], grammar: [g.guangzhou-vs-hk], vocab: [w.bou1-zai2-faan6] }
      - { es: "帥哥，你買咗單未呀？未嘅話，我想請你飲多杯。", en: "Hey handsome, have you paid yet? If not, I'd like to buy you another drink.", altEs: ["帥哥，你埋咗單未呀？未嘅話，我請你飲多杯。"], grammar: [g.address-terms], vocab: [w.seoi3-go1, w.maai5-daan1] }
      - { es: "你個樣好似一碗薑撞奶，我望你一眼就凝固咗。", en: "You're like a bowl of ginger milk curd: one look at you and I set solid.", altEs: ["你好似一碗薑撞奶，我望一眼就凝固咗。"], grammar: [g.guangzhou-vs-hk], vocab: [w.goeng1-zong6-naai5] }
  - id: c2.u07.l3
    title: 視頻定影片？
    teach: [g.mandarin-influence]
    vocab: [w.gwok3-jyu5, w.teoi1-pou2, w.soeng1-jyu5, w.mou5-jyu5, w.si6-pan4, w.jing2-pin2, w.zat1-loeng6, w.mei4-seon3, w.zi1-fu6-bou2, w.ji6-wai4-maa5, w.sau1-ngan4, w.daa2-dik1, w.gung1-gaau1, w.din6-daan1-ce1, w.mo1-tok3, w.bing1-soeng1, w.cou2-mui2, w.bat1-hou2-ji3-si1, w.giu3-faat3, w.caa1-ji6, w.gaau2-ding6]
    tip: "Mandarin loans are everyday words in Guangzhou (視頻, 質量, 搞定); in Hong Kong the local forms (影片, 質素, 搞掂) are the norm. Recognise both and match the people you talk to."
    sentences:
      - { es: "而家廣州好多後生講「視頻」，香港人就多數講「影片」。", en: "Many young people in Guangzhou now say 'si6 pan4' for video; Hongkongers mostly say 'jing2 pin2'.", altEs: ["廣州好多後生而家講「視頻」，香港人多數講「影片」。"], grammar: [g.mandarin-influence], vocab: [w.si6-pan4, w.jing2-pin2] }
      - { es: "「質量」係普通話嘅講法，香港人通常講「質素」。", en: "'Zat1 loeng6' for quality is the Mandarin way of saying it; Hongkongers usually say 'zat1 sou3'.", altEs: ["「質量」係普通話講法，香港人一般講「質素」。"], grammar: [g.mandarin-influence], vocab: [w.zat1-loeng6, w.zat1-sou3] }
      - { es: "「搞掂」係香港講法，「搞定」就係受普通話影響嘅講法。", en: "'Gaau2 dim6' is the Hong Kong way; 'gaau2 ding6' shows Mandarin influence.", altEs: ["香港人講「搞掂」，「搞定」係受普通話影響。"], grammar: [g.mandarin-influence], vocab: [w.gaau2-dim6, w.gaau2-ding6] }
      - { es: "喺廣州買嘢，好多人用微信或者支付寶掃二維碼畀錢。", en: "When shopping in Guangzhou, lots of people pay by scanning a QR code with WeChat or Alipay.", altEs: ["喺廣州買嘢，大部分人都係用微信或者支付寶掃二維碼畀錢。"], grammar: [g.mandarin-influence], vocab: [w.mei4-seon3, w.zi1-fu6-bou2, w.ji6-wai4-maa5] }
      - { es: "收銀嘅阿姐問我有冇微信，我話我淨係有八達通。", en: "The woman at the till asked if I had WeChat; I said I only had an Octopus card.", altEs: ["收銀嘅阿姐問我有冇微信，我話我得八達通。"], grammar: [g.mandarin-influence, g.address-terms], vocab: [w.sau1-ngan4, w.aa3-ze1, w.mei4-seon3] }
      - { es: "喺廣州坐公交，喺香港就坐巴士。", en: "In Guangzhou you take the 'gung1 gaau1'; in Hong Kong you take the 'baa1 si2'.", altEs: ["廣州人坐公交，香港人坐巴士。"], grammar: [g.mandarin-influence, g.guangzhou-vs-hk], vocab: [w.gung1-gaau1, w.baa1-si2] }
      - { es: "香港人叫電單車，廣州好多人叫摩托。", en: "Hongkongers say 'din6 daan1 ce1' for motorbike; many people in Guangzhou say 'mo1 tok3'.", altEs: ["香港講電單車，廣州好多人講摩托。"], grammar: [g.mandarin-influence], vocab: [w.din6-daan1-ce1, w.mo1-tok3] }
      - { es: "由北京路打的去陳家祠，大概要二十蚊人民幣。", en: "A taxi from Beijing Road to the Chen Clan Academy costs about twenty yuan.", altEs: ["由北京路打的去陳家祠大約二十蚊人民幣。"], grammar: [g.mandarin-influence], vocab: [w.daa2-dik1, w.jan4-man4-bai6], transform: { instruction: "Ask how much the taxi costs", answer: "由北京路打的去陳家祠要幾多錢？", alt: ["由北京路打的去陳家祠幾多錢？", "打的去陳家祠要幾錢？"] } }
      - { es: "推普咗咁多年，好多廣州細路識講國語多過廣東話。", en: "After so many years of promoting Mandarin, many Guangzhou kids speak Mandarin better than Cantonese.", altEs: ["推普咗咁多年，好多廣州細路國語講得好過廣東話。"], grammar: [g.mandarin-influence], vocab: [w.teoi1-pou2, w.gwok3-jyu5] }
      - { es: "好多廣州後生係雙語，喺屋企講廣東話，喺學校講普通話。", en: "Many young Guangzhou people are bilingual: Cantonese at home, Mandarin at school.", altEs: ["好多廣州後生都係雙語，屋企講廣東話，學校講普通話。"], grammar: [g.mandarin-influence], vocab: [w.soeng1-jyu5] }
      - { es: "廣東話係我嘅母語，我唔想佢慢慢消失。", en: "Cantonese is my mother tongue; I don't want it to slowly disappear.", altEs: ["粵語係我嘅母語，我唔想佢消失。"], grammar: [g.mandarin-influence], vocab: [w.mou5-jyu5] }
      - { es: "「不好意思」本來係普通話，而家廣東話都好常用。", en: "'Bat1 hou2 ji3 si1' (sorry, excuse me) was originally Mandarin, but it's very common in Cantonese now.", altEs: ["「不好意思」原本係普通話，而家講廣東話都成日用。"], grammar: [g.mandarin-influence], vocab: [w.bat1-hou2-ji3-si1] }
      - { es: "「我有去過」呢種講法，係受普通話影響。", en: "Saying 'I did go' with 有 is a Mandarin influence.", altEs: ["「我有去過」呢個講法係受普通話影響嘅。"], grammar: [g.mandarin-influence], vocab: [w.jing2-hoeng2], error: { wrong: "我有去，好好玩。", explain: "Bare 有 + verb sounds odd to most Hong Kong speakers; say 我去過 or 我有去過.", grammar: g.mandarin-influence } }
      - { es: "香港人叫士多啤梨，廣州人就叫草莓，只係叫法唔同。", en: "Hongkongers say 'si6 do1 be1 lei2' and Guangzhou people say 'cou2 mui2'; it's just a different name.", altEs: ["香港講士多啤梨，廣州講草莓，叫法唔同啫。"], grammar: [g.mandarin-influence, g.guangzhou-vs-hk], vocab: [w.si6-do1-be1-lei2, w.cou2-mui2, w.giu3-faat3] }
      - { es: "唔好笑人哋講「冰箱」，佢哋嘅叫法都啱。", en: "Don't laugh at people for saying 'bing1 soeng1' for fridge; their word is right too.", altEs: ["唔好笑人講「冰箱」，佢哋嘅叫法都係啱嘅。"], grammar: [g.mandarin-influence], vocab: [w.bing1-soeng1, w.giu3-faat3], transform: { instruction: "Give the Hong Kong word instead: Hongkongers say 雪櫃", answer: "香港人唔講「冰箱」，講「雪櫃」。", alt: ["香港人講「雪櫃」，唔講「冰箱」。"] } }
      - { es: "兩地講法嘅差異，其實反映咗唔同嘅歷史。", en: "The differences in how the two places speak actually reflect different histories.", altEs: ["兩個地方講法嘅差異，其實反映咗唔同嘅歷史。"], grammar: [g.mandarin-influence], vocab: [w.caa1-ji6] }
    exchanges:
      - q: { es: "你聽晚得唔得閒同我視頻？", en: "Are you free for a video call tomorrow night?" }
        a: { es: "得呀，不過我哋香港人會講「打視像電話」。", en: "Sure, though we Hongkongers say 'make a video call'." }
        alt: ["得，九點啦。", "得閒，夜晚九點打畀你。"]
        grammar: [g.mandarin-influence]
        vocab: [w.si6-pan4]
      - q: { es: "呢度可唔可以用八達通？", en: "Can I use an Octopus card here?" }
        a: { es: "唔得呀，要掃二維碼，微信定支付寶都得。", en: "No, you have to scan the QR code; WeChat or Alipay are both fine." }
        alt: ["唔得，淨係收微信同支付寶。", "唔可以，掃二維碼啦。"]
        grammar: [g.mandarin-influence]
        vocab: [w.ji6-wai4-maa5, w.mei4-seon3, w.zi1-fu6-bou2]
      - q: { es: "你喺廣州點樣出入？", en: "How do you get around in Guangzhou?" }
        a: { es: "搭地鐵為主，遠啲就打的。", en: "Mostly by metro; for further places I take a taxi." }
        alt: ["坐公交同搭地鐵。", "多數打的。"]
        grammar: [g.mandarin-influence]
        vocab: [w.daa2-dik1, w.gung1-gaau1]
      - q: { es: "點解你話「搞定」，唔話「搞掂」？", en: "Why do you say 'gaau2 ding6' and not 'gaau2 dim6'?" }
        a: { es: "我喺廣州住咗幾年，受咗普通話影響。", en: "I've lived in Guangzhou for a few years; Mandarin has rubbed off on me." }
        alt: ["喺廣州住耐咗。", "受普通話影響囉。"]
        grammar: [g.mandarin-influence]
        vocab: [w.gaau2-ding6, w.gaau2-dim6]
      - q: { es: "你屋企講咩話㗎？", en: "What language do you speak at home?" }
        a: { es: "我同阿媽講廣東話，同同學講普通話，算係雙語。", en: "Cantonese with my mum and Mandarin with classmates, so I'm bilingual, sort of." }
        alt: ["講廣東話。", "廣東話同普通話都講。"]
        grammar: [g.mandarin-influence]
        vocab: [w.soeng1-jyu5]
    texts:
      - title: "微信訊息"
        es: ["老表，我已經打的到咗北京路。", "你喺邊度？我想掃你個二維碼加你微信。", "唔好遲到呀，間老字號六點就爆滿。"]
        en: ["Cuz, I've taken a taxi and I'm at Beijing Road.", "Where are you? I want to scan your QR code and add you on WeChat.", "Don't be late; the old restaurant is packed by six."]
        grammar: [g.mandarin-influence]
        vocab: [w.daa2-dik1, w.ji6-wai4-maa5, w.mei4-seon3]
      - title: "香港同廣州"
        es: ["香港：巴士、雪櫃、影片。", "廣州：公交、冰箱、視頻。", "兩邊都聽得明，只係叫法唔同。"]
        en: ["Hong Kong: bus, fridge, video.", "Guangzhou: bus, fridge, video, in the mainland words.", "Both sides understand each other; the names are just different."]
        grammar: [g.mandarin-influence, g.guangzhou-vs-hk]
        vocab: [w.gung1-gaau1, w.bing1-soeng1, w.si6-pan4, w.jing2-pin2]
    spicy:
      - { es: "唔使視頻喇，我想見真人。", en: "Forget the video call; I want to see you in person.", altEs: ["唔好打視像喇，我想見你真人。"], grammar: [g.mandarin-influence], vocab: [w.si6-pan4] }
      - { es: "你個二維碼我掃咗，你個心我幾時先掃得到？", en: "I've scanned your QR code; when do I get to scan your heart?", altEs: ["你個二維碼我掃咗，你個心幾時先畀我掃？"], grammar: [g.mandarin-influence], vocab: [w.ji6-wai4-maa5] }
      - { es: "不好意思，我望咗你太耐，因為你嘅質素實在太高。", en: "Sorry, I've been staring too long; you're just such high quality.", altEs: ["不好意思，我盯咗你好耐，因為你質素實在太高。"], grammar: [g.mandarin-influence], vocab: [w.bat1-hou2-ji3-si1, w.zat1-sou3] }
      - { es: "同你傾偈好似講母語咁，自然到唔使諗。", en: "Talking with you is like speaking my mother tongue: so natural I don't have to think.", altEs: ["同你傾偈好似講母語，自然到唔使諗。"], grammar: [g.mandarin-influence], vocab: [w.mou5-jyu5] }
      - { es: "你拍嘅影片咁靚，不如下次拍埋我。", en: "Your videos are so beautiful; next time why not film me too?", altEs: ["你啲影片咁靚，下次不如拍埋我啦。"], grammar: [g.mandarin-influence], vocab: [w.jing2-pin2] }
  - id: c2.u07.l4
    title: 師傅、老細同老表
    teach: [g.address-terms, g.guangzhou-vs-hk]
    vocab: [w.lou5-biu2, w.lou5-gwong2, w.gwong2-fu2-jan4, w.bun2-dei6-jan4, w.ngoi6-dei6-jan4, w.hong1, w.gong2-hong1, w.saang2-gong2, w.soeng1-tung1, w.hau2-tau4-sim4, w.baa1-bai3, w.jyut6-gong2-ou3, w.daai6-waan1-keoi1, w.zyu1-saam1-gok3]
    tip: "Address people by role: 師傅 for drivers and cooks, 老細 for the shop owner, 阿叔 / 阿姐 for the middle-aged, 阿伯 / 阿婆 for the elderly, 靚仔 / 靚女 for young people."
    sentences:
      - { es: "師傅，唔該去西關，喺上下九停就得。", en: "Driver, to Xiguan please; stopping at Shangxiajiu is fine.", altEs: ["師傅，唔該去上下九。", "師傅，唔該喺上下九停。"], grammar: [g.address-terms], vocab: [w.si1-fu2, w.sai1-gwaan1], transform: { instruction: "Ask the driver to stop at the Chen Clan Academy instead", answer: "師傅，唔該喺陳家祠停。", alt: ["師傅，唔該去陳家祠。", "師傅，喺陳家祠停就得。"] } }
      - { es: "老細，呢個點賣呀？", en: "Boss, how much is this?", altEs: ["老細，呢個幾錢呀？", "老闆，呢個點賣呀？"], grammar: [g.address-terms], vocab: [w.lou5-sai3] }
      - { es: "阿婆，使唔使我幫你攞啲嘢呀？", en: "Granny, would you like me to carry your things for you?", altEs: ["阿婆，使唔使幫你攞嘢呀？"], grammar: [g.address-terms], vocab: [w.aa3-po4] }
      - { es: "喺廣州，啲人會叫朋友做「老表」，就算唔係親戚。", en: "In Guangzhou people call friends 'cousin' even when they aren't related.", altEs: ["喺廣州，就算唔係親戚，啲人都會叫朋友做「老表」。"], grammar: [g.address-terms, g.guangzhou-vs-hk], vocab: [w.lou5-biu2, w.can1-cik1] }
      - { es: "唔好叫三十歲嘅女仔做「阿姨」，佢會唔開心。", en: "Don't call a thirty-year-old woman 'auntie'; she'll be upset.", altEs: ["唔好叫一個三十歲嘅女仔做「阿姨」，佢會唔高興。"], grammar: [g.address-terms], vocab: [w.aa3-ji1], error: { wrong: "叫三十歲嘅女仔做「阿姨」最有禮貌。", explain: "阿姨 implies middle age; for a young woman 靚女 or 小姐 is safer.", grammar: g.address-terms } }
      - { es: "啲老友記朝朝都喺越秀公園打太極。", en: "The old folks do tai chi in Yuexiu Park every morning.", altEs: ["班老友記每朝都喺越秀公園打太極。"], grammar: [g.address-terms], vocab: [w.lou5-jau5-gei3], jp: "di1 lou5 jau5 gei3 ziu1 ziu1 dou1 hai2 jyut6 sau3 gung1 jyun2 daa2 taai3 gik6" }
      - { es: "佢係正宗老廣，三代都住喺西關。", en: "He's a true old Cantonese local; three generations of his family have lived in Xiguan.", altEs: ["佢係個正宗老廣，三代人都住喺西關。"], altEn: ["She's a true old Cantonese local; three generations of her family have lived in Xiguan."], grammar: [g.guangzhou-vs-hk], vocab: [w.lou5-gwong2, w.zing3-zung1] }
      - { es: "我係本地人，佢係外地人，不過佢廣東話講得好過我。", en: "I'm a local and he's from elsewhere, but his Cantonese is better than mine.", altEs: ["我係本地人，佢係外地人，但係佢講廣東話講得好過我。"], altEn: ["I'm a local and she's from elsewhere, but her Cantonese is better than mine."], grammar: [g.guangzhou-vs-hk], vocab: [w.bun2-dei6-jan4, w.ngoi6-dei6-jan4] }
      - { es: "佢一開口，人哋就聽得出係港腔。", en: "As soon as she opens her mouth, people can tell it's a Hong Kong accent.", altEs: ["佢一開聲，人哋就聽得出佢有港腔。"], altEn: ["As soon as he opens his mouth, people can tell it's a Hong Kong accent."], grammar: [g.guangzhou-vs-hk], vocab: [w.gong2-hong1] }
      - { es: "以前省港兩地坐船就到，關係好密切。", en: "In the past Guangzhou and Hong Kong were just a boat ride apart, and their ties were very close.", altEs: ["以前省港兩地坐船就去到，關係好親密。"], grammar: [g.guangzhou-vs-hk], vocab: [w.saang2-gong2] }
      - { es: "粵港澳大灣區一共有十一個城市。", en: "The Guangdong–Hong Kong–Macau Greater Bay Area has eleven cities in all.", altEs: ["大灣區一共有十一個城市。"], grammar: [g.guangzhou-vs-hk], vocab: [w.jyut6-gong2-ou3, w.daai6-waan1-keoi1], note: "Nine cities in Guangdong plus Hong Kong and Macau." }
      - { es: "珠三角係粵語嘅老家。", en: "The Pearl River Delta is the old home of Cantonese.", altEs: ["珠江三角洲係廣東話嘅老家。"], grammar: [g.guangzhou-vs-hk], vocab: [w.zyu1-saam1-gok3] }
      - { es: "佢講嘢好巴閉，其實冇乜料。", en: "He talks big, but there isn't much to him really.", altEs: ["佢講嘢好巴閉，其實唔係好有料。"], altEn: ["She talks big, but there isn't much to her really."], grammar: [g.address-terms], vocab: [w.baa1-bai3] }
      - { es: "「冇問題」係佢嘅口頭禪，但係佢成日都有問題。", en: "'No problem' is his catchphrase, but he's always got problems.", altEs: ["佢嘅口頭禪係「冇問題」，但係佢成日都有問題。"], altEn: ["'No problem' is her catchphrase, but she's always got problems."], grammar: [g.address-terms], vocab: [w.hau2-tau4-sim4], transform: { instruction: "Ask him what his catchphrase is", answer: "你嘅口頭禪係咩呀？", alt: ["你嘅口頭禪係乜嘢？", "你口頭禪係咩？"] } }
      - { es: "廣州話同香港話相通，唔使翻譯。", en: "Guangzhou and Hong Kong Cantonese are mutually intelligible; no translation needed.", altEs: ["廣州話同香港話係相通嘅，唔使翻譯。"], grammar: [g.guangzhou-vs-hk], vocab: [w.soeng1-tung1] }
      - { es: "大佬，唔好咁大聲啦，成架車都聽到。", en: "Bro, keep it down, the whole bus can hear you.", altEs: ["大佬，細聲啲啦，成架車都聽到。"], grammar: [g.address-terms], vocab: [w.daai6-lou2] }
    exchanges:
      - q: { es: "師傅，去陳家祠幾多錢呀？", en: "Driver, how much to the Chen Clan Academy?" }
        a: { es: "睇錶，大概十五蚊。", en: "By the meter; about fifteen." }
        alt: ["十五蚊左右。", "睇錶啦。"]
        grammar: [g.address-terms]
        vocab: [w.si1-fu2]
      - q: { es: "我應該點樣叫嗰位阿姐？", en: "How should I address that lady?" }
        a: { es: "叫佢「靚女」就最安全。", en: "'Leng3 neoi2' is the safest." }
        alt: ["叫靚女啦。", "叫佢小姐都得。"]
        grammar: [g.address-terms]
        vocab: [w.aa3-ze1, w.leng3-neoi2]
      - q: { es: "你係唔係本地人嚟㗎？", en: "Are you a local?" }
        a: { es: "唔係呀，我係香港嚟嘅，所以有啲港腔。", en: "No, I'm from Hong Kong, so I've got a bit of a Hong Kong accent." }
        alt: ["唔係，我係外地人。", "唔係，我香港人。"]
        grammar: [g.guangzhou-vs-hk]
        vocab: [w.bun2-dei6-jan4, w.gong2-hong1]
      - q: { es: "你嘅口頭禪係咩？", en: "What's your catchphrase?" }
        a: { es: "「冇所謂」囉，我咩都話冇所謂。", en: "'Whatever', I guess; I say 'whatever' about everything." }
        alt: ["「冇問題」。", "我冇口頭禪。"]
        grammar: [g.address-terms]
        vocab: [w.hau2-tau4-sim4]
      - q: { es: "大灣區包括邊啲地方？", en: "Which places does the Greater Bay Area include?" }
        a: { es: "廣東九個城市，加埋香港同澳門。", en: "Nine cities in Guangdong, plus Hong Kong and Macau." }
        alt: ["廣州、深圳、香港、澳門嗰啲。", "珠三角啲城市同港澳。"]
        grammar: [g.guangzhou-vs-hk]
        vocab: [w.daai6-waan1-keoi1]
    texts:
      - title: "老表嘅留言"
        es: ["老表，今晚喺西關食飯，唔該準時。", "記得叫師傅喺騎樓門口停車。", "阿婆話要煲老火湯，你唔使帶嘢嚟。"]
        en: ["Cuz, dinner's in Xiguan tonight, be on time please.", "Remember to ask the driver to stop at the arcade entrance.", "Granny says she's making slow-cooked soup, so you don't need to bring anything."]
        grammar: [g.address-terms]
        vocab: [w.lou5-biu2, w.si1-fu2, w.aa3-po4]
    spicy:
      - { es: "唔好再叫我老表喇，我唔想做你親戚。", en: "Stop calling me 'cousin'; I don't want to be your relative.", altEs: ["唔好叫我老表啦，我唔想同你做親戚。"], grammar: [g.address-terms], vocab: [w.lou5-biu2] }
      - { es: "你叫我「帥哥」我就收貨，叫我「阿叔」我就嬲喇。", en: "Call me 'handsome' and I'll take it; call me 'uncle' and I'll be cross.", altEs: ["你叫我「帥哥」就得，叫我「阿叔」我就嬲。"], grammar: [g.address-terms], vocab: [w.seoi3-go1, w.aa3-suk1] }
      - { es: "老細，你笑得咁甜，平啲賣畀我啦。", en: "Boss, with a smile that sweet, sell it to me a bit cheaper.", altEs: ["老細，你笑得咁甜，算平啲畀我啦。"], grammar: [g.address-terms], vocab: [w.lou5-sai3] }
      - { es: "你一開口講港腔，我個心就即刻郁咗。", en: "The moment you speak with that Hong Kong accent, my heart skips.", altEs: ["你一講港腔，我個心就郁咗。"], grammar: [g.guangzhou-vs-hk], vocab: [w.gong2-hong1] }
      - { es: "唔好講到咁巴閉，請我食碗雙皮奶先講。", en: "Don't talk so big; buy me a bowl of double-skin milk pudding first, then we'll talk.", altEs: ["唔使講得咁巴閉，請我食碗雙皮奶先啦。"], grammar: [g.address-terms], vocab: [w.baa1-bai3, w.soeng1-pei4-naai5] }
dialogues:
  - id: c2.u07.d1
    title: 老表帶路
    context: Wing-sze, a Hongkonger, arrives in Xiguan to visit her Guangzhou cousin Ka-chun before a trip to Shunde.
    lines:
      - { speaker: 家俊, es: "詠詩！喺度呀！你打的嚟定坐地鐵嚟？", en: "Wing-sze! Over here! Did you take a taxi or the metro?" }
      - { speaker: 詠詩, es: "坐高鐵到廣州南站，再打的。個師傅好好人，仲叫我「美女」。", en: "High-speed train to Guangzhou South, then a taxi. The driver was really nice; he even called me 'beautiful'." }
      - { speaker: 家俊, es: "廣州係噉㗎喇，見到人就叫靚女、帥哥。你今晚想食咩？", en: "That's Guangzhou for you: everyone's 'gorgeous' or 'handsome'. What do you want to eat tonight?" }
      - { speaker: 詠詩, es: "我想試吓地道嘅艇仔粥，聽日再去順德食雙皮奶。", en: "I'd like to try authentic sampan congee, and tomorrow go to Shunde for double-skin milk pudding." }
      - { speaker: 家俊, es: "冇問題，上下九有間老字號，我已經搞定晒。", en: "No problem. There's an old place in Shangxiajiu, and I've got it all sorted." }
      - { speaker: 詠詩, es: "「搞定」？你而家講嘢好似普通話咁，我哋香港會講「搞掂」。", en: "'Gaau2 ding6'? You sound like Mandarin now; in Hong Kong we'd say 'gaau2 dim6'." }
      - { speaker: 家俊, es: "哈哈，喺廣州日日聽，唔知唔覺就跟住講咗。", en: "Ha ha, I hear it every day in Guangzhou, so I picked it up without noticing." }
      - { speaker: 詠詩, es: "食完記得畀我埋單，今晚我請。", en: "When we've eaten, remember to let me get the bill. Tonight's on me." }
      - { speaker: 家俊, es: "唔使啦，呢度要掃二維碼畀錢，你又冇微信。", en: "No need. You pay by scanning a QR code here, and you don't have WeChat." }
      - { speaker: 詠詩, es: "好啦好啦，下次你嚟香港，我請你飲早茶。", en: "OK, OK. Next time you come to Hong Kong, I'll take you for morning dim sum." }
    questions:
      - { q: "詠詩點樣去到西關？", options: ["坐公交", "坐高鐵，再打的", "坐船"], answer: 1, explain: "坐高鐵到廣州南站，再打的: high-speed train, then a taxi." }
      - { q: "的士師傅叫詠詩做咩？", options: ["阿姨", "美女", "老表"], answer: 1, explain: "個師傅仲叫我「美女」: Guangzhou-style friendly address." }
      - { q: "詠詩點解笑家俊？", options: ["佢講「搞定」，好似普通話", "佢有港腔", "佢叫錯人"], answer: 0, explain: "搞定 is the Mandarin-influenced form; Hong Kong says 搞掂." }
      - { q: "點解詠詩請唔到客？", options: ["佢唔記得帶銀包", "要掃二維碼畀錢，佢冇微信", "間舖已經收咗"], answer: 1, explain: "呢度要掃二維碼畀錢，你又冇微信." }
