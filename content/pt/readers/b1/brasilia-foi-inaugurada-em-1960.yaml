id: r.b1.brasilia-foi-inaugurada-em-1960
level: b1
title: Brasília foi inaugurada em 1960
kind: text
intro: A short history of Brasília, the capital built from nothing in the middle of the cerrado in less than four years. Notice the passive voice (foi construída, foram feitos) and impersonal se.
allow: [brasília, juscelino, kubitschek, jk, lúcio, costa, oscar, niemeyer, goiás, alvorada, planalto, candangos, candango, unesco, ok, w3, l2, df]
paragraphs:
  - { es: "Poucas capitais do mundo foram planejadas do zero. Brasília é uma delas. A ideia de levar a capital do Brasil do litoral para o interior era antiga: ela já aparecia na primeira Constituição da República, de 1891. Mas o projeto só foi realizado na década de 1950, pelo presidente Juscelino Kubitschek, mais conhecido como JK.", en: "Few capitals in the world were planned from scratch. Brasília is one of them. The idea of moving Brazil's capital from the coast to the interior was old: it already appeared in the Republic's first Constitution, in 1891. But the project was only carried out in the 1950s, by President Juscelino Kubitschek, better known as JK." }
  - { es: "JK foi eleito em 1955 com uma promessa ambiciosa: fazer o país avançar «cinquenta anos em cinco». A construção de uma nova capital no Planalto Central era a meta principal do governo dele. Para muitos, a ideia era absurda. A região era isolada, não tinha estradas e ficava a mais de mil quilômetros do Rio de Janeiro, que era a capital na época.", en: "JK was elected in 1955 with an ambitious promise: to make the country advance 'fifty years in five'. Building a new capital on the Central Plateau was his government's main goal. To many, the idea was absurd. The region was isolated, had no roads and was more than a thousand kilometres from Rio de Janeiro, which was the capital at the time." }
  - { es: "Em 1957, foi organizado um concurso para escolher o plano da cidade. O projeto vencedor foi apresentado pelo urbanista Lúcio Costa: um desenho simples, feito à mão, com dois eixos que se cruzam. Visto de cima, o plano parece um avião ou um pássaro. Os prédios principais foram projetados pelo arquiteto Oscar Niemeyer, que já era famoso no Brasil e no exterior.", en: "In 1957 a competition was organised to choose the city plan. The winning project was presented by the urban planner Lúcio Costa: a simple drawing, made by hand, with two axes that cross. Seen from above, the plan looks like an aeroplane or a bird. The main buildings were designed by the architect Oscar Niemeyer, who was already famous in Brazil and abroad." }
  - { es: "A construção foi feita num ritmo impressionante. Dezenas de milhares de trabalhadores, vindos principalmente do Nordeste, de Minas Gerais e de Goiás, foram contratados. Eles ficaram conhecidos como candangos. Trabalhava-se dia e noite, em turnos, e muitos moravam em acampamentos de madeira, em condições muito difíceis. Materiais eram trazidos de avião, porque as estradas ainda estavam sendo abertas.", en: "The construction was carried out at an impressive pace. Tens of thousands of workers, coming mainly from the Northeast, Minas Gerais and Goiás, were hired. They became known as candangos. People worked day and night, in shifts, and many lived in wooden camps, in very difficult conditions. Materials were brought by plane, because the roads were still being opened." }
  - { es: "Em 21 de abril de 1960, a cidade foi inaugurada, com uma grande festa. Naquele dia, muitos prédios ainda não estavam prontos, e faltavam escolas, hospitais e moradias. Mesmo assim, a capital foi transferida, e os ministérios começaram a funcionar aos poucos. Diz-se que muitos funcionários públicos choraram ao deixar o Rio e as praias.", en: "On 21 April 1960, the city was inaugurated with a big celebration. On that day many buildings still weren't finished, and schools, hospitals and housing were lacking. Even so, the capital was transferred, and the ministries started working little by little. It's said that many civil servants cried when they left Rio and its beaches." }
  - { es: "Hoje, Brasília tem cerca de três milhões de habitantes no Distrito Federal e é considerada patrimônio da humanidade pela Unesco desde 1987. A Catedral, o Congresso Nacional e o Palácio da Alvorada são visitados por turistas do mundo todo. Os moradores dizem que na cidade não existem esquinas e que, para dar um endereço, usam-se letras e números, como «SQS 308, bloco C».", en: "Today Brasília has about three million inhabitants in the Federal District and has been considered a World Heritage Site by UNESCO since 1987. The Cathedral, the National Congress and the Alvorada Palace are visited by tourists from all over the world. Residents say there are no street corners in the city and that, to give an address, letters and numbers are used, like 'SQS 308, block C'." }
  - { es: "A cidade também é criticada. Alguns dizem que ela foi feita para carros e não para pessoas, e que as distâncias são grandes demais para quem anda a pé. Muitos trabalhadores que a construíram nunca puderam morar no plano piloto e foram viver nas cidades em volta. Seja como for, Brasília continua sendo um símbolo do sonho de JK: um país que olha para o interior e para o futuro.", en: "The city is also criticised. Some say it was made for cars and not for people, and that distances are too great for those who walk. Many of the workers who built it were never able to live in the plano piloto and went to live in the surrounding towns. Be that as it may, Brasília remains a symbol of JK's dream: a country that looks towards the interior and the future." }
questions:
  - { q: "Quando a ideia de uma capital no interior apareceu pela primeira vez na Constituição?", options: ["Em 1891", "Em 1955", "Em 1960"], answer: 0, explain: "«Ela já aparecia na primeira Constituição da República, de 1891.»" }
  - { q: "Qual era a promessa de JK?", options: ["Construir dez cidades", "Fazer o país avançar cinquenta anos em cinco", "Levar a capital para São Paulo"], answer: 1, explain: "His slogan was «cinquenta anos em cinco»." }
  - { q: "Quem fez o plano da cidade?", options: ["Oscar Niemeyer", "Lúcio Costa", "JK"], answer: 1, explain: "«O projeto vencedor foi apresentado pelo urbanista Lúcio Costa.» Niemeyer designed the main buildings." }
  - { q: "Quem eram os candangos?", options: ["Os trabalhadores que construíram a cidade", "Os políticos do Rio", "Os primeiros turistas"], answer: 0, explain: "The workers who were hired «ficaram conhecidos como candangos»." }
  - { q: "Qual é uma das críticas feitas a Brasília?", options: ["Que é uma cidade muito antiga", "Que foi feita para carros e não para pessoas", "Que tem praias demais"], answer: 1, explain: "«Alguns dizem que ela foi feita para carros e não para pessoas.»" }
