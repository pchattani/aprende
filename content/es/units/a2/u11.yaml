id: a2.u11
title: Salud y cuerpo
lessons:
  - id: a2.u11.l1
    title: Me duele la cabeza
    teach: [g.doler]
    vocab: [w.dolor, w.doler, w.estomago, w.garganta, w.espalda, w.muela, w.rodilla, w.tobillo, w.hombro, w.cuello, w.pecho, w.corazon, w.oido, w.sentirse, w.encontrarse-mal]
    tip: "doler works like gustar: me duele la cabeza (singular), me duelen los pies (plural)."
    sentences:
      - { es: "Me duele la cabeza.", en: "My head hurts.", grammar: [g.doler], vocab: [w.doler, w.cabeza] }
      - { es: "Me duelen los pies de tanto caminar.", en: "My feet hurt from walking so much.", altEs: ["Me duelen los pies de tanto andar."], grammar: [g.doler], vocab: [w.doler, w.pie, w.caminar], error: { wrong: "Me duele los pies de tanto caminar.", explain: "Plural subject (los pies) takes duelen.", grammar: g.doler } }
      - { es: "¿Qué te duele? — Me duele el estómago.", en: "What hurts? — My stomach hurts.", grammar: [g.doler], vocab: [w.estomago] }
      - { es: "Le duele la garganta y no puede hablar.", en: "Her throat hurts and she can't talk.", altEs: ["A ella le duele la garganta y no puede hablar."], grammar: [g.doler], vocab: [w.garganta, w.hablar] }
      - { es: "A mi padre le duele la espalda por el trabajo.", en: "My father's back hurts because of work.", altEs: ["A mi padre le duele la espalda del trabajo."], grammar: [g.doler, g.por-vs-para], vocab: [w.espalda] }
      - { es: "Tengo dolor de muelas desde ayer.", en: "I've had toothache since yesterday.", grammar: [g.desde-hace], vocab: [w.dolor, w.muela, w.ayer] }
      - { es: "Me caí y ahora me duele la rodilla.", en: "I fell and now my knee hurts.", altEs: ["Me he caído y ahora me duele la rodilla."], grammar: [g.doler, g.preterite-irregular], vocab: [w.caerse, w.rodilla] }
      - { es: "Se torció el tobillo jugando al fútbol.", en: "He twisted his ankle playing football.", grammar: [g.preterite-stem-changing], vocab: [w.tobillo, w.futbol], note: "torcerse = to twist." }
      - { es: "Me duelen el cuello y los hombros de estar sentado.", en: "My neck and shoulders hurt from sitting.", grammar: [g.doler], vocab: [w.cuello, w.hombro] }
      - { es: "Si te duele el pecho, llama a urgencias.", en: "If your chest hurts, call the emergency services.", altEs: ["Si te duele el pecho, llama a una ambulancia."], grammar: [g.doler, g.si-present-future], vocab: [w.pecho, w.urgencias] }
      - { es: "El corazón es el órgano más importante del cuerpo.", en: "The heart is the most important organ in the body.", grammar: [g.superlatives], vocab: [w.corazon, w.cuerpo] }
      - { es: "Me duele el oído derecho.", en: "My right ear hurts.", altEs: ["Tengo dolor en el oído derecho."], grammar: [g.doler], vocab: [w.oido, w.derecha] }
      - { es: "No me siento bien; me encuentro mal desde esta mañana.", en: "I don't feel well; I've felt unwell since this morning.", altEs: ["No me siento bien; estoy mal desde esta mañana."], grammar: [g.desde-hace], vocab: [w.sentirse, w.encontrarse-mal, w.esta-manana] }
      - { es: "¿Cómo te sientes hoy? — Mucho mejor, gracias.", en: "How do you feel today? — Much better, thanks.", altEs: ["¿Cómo te encuentras hoy? — Mucho mejor, gracias."], grammar: [g.comparatives], vocab: [w.sentirse, w.mejor] }
      - { es: "A ella / doler / los ojos", en: "Her eyes hurt.", grammar: [g.doler], vocab: [w.doler, w.ojo], transform: { instruction: "Build the sentence", answer: "A ella le duelen los ojos.", alt: ["Le duelen los ojos."] } }
    exchanges:
      - q: { es: "¿Qué te duele?", en: "What hurts?" }
        a: { es: "Me duele la cabeza.", en: "My head hurts." }
        alt: ["La cabeza.", "Me duele el estómago."]
        grammar: [g.doler]
        vocab: [w.doler, w.cabeza]
      - q: { es: "¿Te duelen los pies?", en: "Do your feet hurt?" }
        a: { es: "Sí, me duelen de tanto caminar.", en: "Yes, they hurt from walking so much." }
        alt: ["Sí, mucho.", "No, me duele la espalda."]
        grammar: [g.doler]
        vocab: [w.pie, w.caminar]
      - q: { es: "¿Cómo te sientes hoy?", en: "How do you feel today?" }
        a: { es: "Mucho mejor, gracias.", en: "Much better, thanks." }
        alt: ["Mejor, gracias.", "No muy bien; me duele la garganta."]
        grammar: [g.comparatives, g.doler]
        vocab: [w.sentirse, w.mejor]
      - q: { es: "¿Por qué no puede hablar tu hermana?", en: "Why can't your sister talk?" }
        a: { es: "Le duele mucho la garganta.", en: "Her throat hurts a lot." }
        alt: ["Le duele la garganta.", "Porque le duele la garganta."]
        grammar: [g.doler]
        vocab: [w.garganta, w.hablar]
      - q: { es: "¿Desde cuándo te duele la muela?", en: "Since when has your tooth been hurting?" }
        a: { es: "Desde ayer.", en: "Since yesterday." }
        alt: ["Desde ayer por la noche.", "Desde hace dos días."]
        grammar: [g.doler, g.desde-hace]
        vocab: [w.muela]
    texts:
      - title: "Mensaje a la profesora"
        es: ["Hoy no puedo ir a clase.", "Me duele mucho la cabeza y me encuentro mal desde esta mañana.", "Mañana le mando los deberes."]
        en: ["I can't come to class today.", "My head hurts a lot and I've felt unwell since this morning.", "I'll send you the homework tomorrow."]
        grammar: [g.doler, g.desde-hace]
        vocab: [w.doler, w.encontrarse-mal, w.deberes]
  - id: a2.u11.l2
    title: En el médico
    teach: [g.deber-tener-que]
    vocab: [w.fiebre, w.tos, w.toser, w.gripe, w.resfriado, w.alergia, w.herida, w.medicina, w.medicamento, w.pastilla, w.jarabe, w.farmaceutico, w.cita, w.consulta, w.urgencias, w.analisis, w.radiografia, w.sintoma, w.grave, w.deberia]
    tip: "tener que = must (necessity); deber = should (duty); hay que = one must (general); deberías = you should (advice)."
    sentences:
      - { es: "Tengo fiebre y tos; creo que es gripe.", en: "I have a fever and a cough; I think it's flu.", grammar: [g.stem-changing-present], vocab: [w.fiebre, w.tos, w.gripe] }
      - { es: "Tienes que ir al médico hoy mismo.", en: "You have to go to the doctor today.", altEs: ["Debes ir al médico hoy mismo."], grammar: [g.deber-tener-que], vocab: [w.tener-que, w.medico] }
      - { es: "Debes tomar una pastilla cada ocho horas.", en: "You must take a tablet every eight hours.", altEs: ["Tienes que tomar una pastilla cada ocho horas."], grammar: [g.deber-tener-que], vocab: [w.deber, w.pastilla] }
      - { es: "Deberías descansar más y trabajar menos.", en: "You should rest more and work less.", altEs: ["Tendrías que descansar más y trabajar menos."], grammar: [g.deber-tener-que, g.conditional-simple], vocab: [w.deberia, w.descansar] }
      - { es: "Hay que lavarse las manos antes de comer.", en: "You have to wash your hands before eating.", altEs: ["Tienes que lavarte las manos antes de comer."], grammar: [g.deber-tener-que], vocab: [w.hay-que, w.lavarse] }
      - { es: "¿Cuáles son sus síntomas? — Toso mucho y me duele la garganta.", en: "What are your symptoms? — I cough a lot and my throat hurts.", grammar: [g.doler], vocab: [w.sintoma, w.toser, w.garganta] }
      - { es: "Es solo un resfriado, no es grave.", en: "It's just a cold, it isn't serious.", altEs: ["Solo es un resfriado, no es grave."], grammar: [g.ser-vs-estar-basics], vocab: [w.resfriado, w.grave] }
      - { es: "Tengo alergia al polen; en primavera no puedo respirar bien.", en: "I'm allergic to pollen; in spring I can't breathe well.", grammar: [g.deber-tener-que], vocab: [w.alergia, w.respirar, w.primavera], note: "polen = pollen." }
      - { es: "Tengo cita en la consulta del doctor Ruiz a las once.", en: "I have an appointment at Dr Ruiz's office at eleven.", altEs: ["Tengo una cita en la consulta del doctor Ruiz a las once."], grammar: [g.time-telling], vocab: [w.cita, w.consulta] }
      - { es: "Le hicieron un análisis de sangre y una radiografía.", en: "They did a blood test and an X-ray on him.", grammar: [g.preterite-irregular], vocab: [w.analisis, w.radiografia], note: "sangre = blood." }
      - { es: "El farmacéutico me recomendó este jarabe para la tos.", en: "The pharmacist recommended this cough syrup to me.", grammar: [g.indirect-object-pronouns], vocab: [w.farmaceutico, w.recomendar, w.jarabe, w.tos] }
      - { es: "No debes tomar este medicamento con alcohol.", en: "You mustn't take this medication with alcohol.", grammar: [g.deber-tener-que], vocab: [w.medicamento], error: { wrong: "No tienes que tomar este medicamento con alcohol.", explain: "no tener que = don't need to; a prohibition uses no debes.", grammar: g.deber-tener-que } }
      - { es: "La herida no es profunda, pero hay que limpiarla.", en: "The wound isn't deep, but it has to be cleaned.", altEs: ["La herida no es profunda, pero tenemos que limpiarla."], grammar: [g.deber-tener-que, g.pronoun-placement], vocab: [w.herida, w.limpiar] }
      - { es: "Si tiene fiebre alta, vaya a urgencias.", en: "If you have a high fever, go to A&E.", grammar: [g.imperative-usted, g.si-present-future], vocab: [w.fiebre, w.urgencias] }
      - { es: "Estudiar medicina es muy difícil.", en: "Studying medicine is very difficult.", altEs: ["La carrera de medicina es muy difícil."], grammar: [g.ser-vs-estar-basics], vocab: [w.medicina, w.dificil] }
      - { es: "Tú / tomar el jarabe (obligación)", en: "You have to take the syrup.", grammar: [g.deber-tener-que], vocab: [w.jarabe], transform: { instruction: "Say it with 'tener que'", answer: "Tienes que tomar el jarabe.", alt: ["Tú tienes que tomar el jarabe."] } }
    exchanges:
      - q: { es: "Tengo fiebre y tos. ¿Qué hago?", en: "I have a fever and a cough. What should I do?" }
        a: { es: "Tienes que ir al médico hoy mismo.", en: "You have to go to the doctor today." }
        alt: ["Deberías ir al médico.", "Debes descansar."]
        grammar: [g.deber-tener-que]
        vocab: [w.tener-que, w.medico]
      - q: { es: "¿Cuántas pastillas tengo que tomar?", en: "How many tablets do I have to take?" }
        a: { es: "Debes tomar una cada ocho horas.", en: "You must take one every eight hours." }
        alt: ["Una cada ocho horas.", "Tienes que tomar una cada ocho horas."]
        grammar: [g.deber-tener-que]
        vocab: [w.deber, w.pastilla]
      - q: { es: "¿Es grave lo que tengo?", en: "Is what I have serious?" }
        a: { es: "No, es solo un resfriado, pero debería descansar.", en: "No, it's just a cold, but you should rest." }
        alt: ["No, no es grave.", "Es solo un resfriado."]
        grammar: [g.deber-tener-que]
        vocab: [w.resfriado, w.grave]
      - q: { es: "¿Puedo tomar este medicamento con vino?", en: "Can I take this medication with wine?" }
        a: { es: "No, no debes tomarlo con vino.", en: "No, you mustn't take it with wine." }
        alt: ["No, no debes.", "No, nunca."]
        grammar: [g.deber-tener-que]
        vocab: [w.medicamento]
      - q: { es: "¿Cuáles son sus síntomas?", en: "What are your symptoms?" }
        a: { es: "Toso mucho y me duele la garganta.", en: "I cough a lot and my throat hurts." }
        alt: ["Tengo fiebre y tos.", "Me duele la cabeza."]
        grammar: [g.doler]
        vocab: [w.sintoma, w.toser]
    texts:
      - title: "Nota del médico"
        es: ["Debe tomar el jarabe tres veces al día, después de las comidas.", "Tiene que descansar y beber mucha agua.", "Si en tres días no mejora, hay que ir a urgencias."]
        en: ["You must take the syrup three times a day, after meals.", "You have to rest and drink lots of water.", "If you don't get better in three days, you have to go to A&E."]
        grammar: [g.deber-tener-que]
        vocab: [w.jarabe, w.descansar, w.urgencias]
  - id: a2.u11.l3
    title: ¿Qué harías tú?
    teach: [g.conditional-simple]
    vocab: [w.engordar, w.adelgazar, w.dieta, w.ejercicio, w.fumar, w.estresado, w.estres, w.mejorarse, w.tumbarse, w.quedarse-en-cama, w.marearse, w.vomitar, w.embarazada, w.seguro-medico]
    tip: "Conditional = infinitive + ía, ías, ía, íamos, íais, ían. Irregular stems are the same as the future: tendr-, har-, podr-."
    sentences:
      - { es: "Yo en tu lugar iría al médico.", en: "If I were you, I'd go to the doctor.", altEs: ["En tu lugar, yo iría al médico."], grammar: [g.conditional-simple], vocab: [w.lugar, w.medico] }
      - { es: "Con menos estrés dormirías mejor.", en: "With less stress you'd sleep better.", altEs: ["Dormirías mejor con menos estrés."], grammar: [g.conditional-simple], vocab: [w.estres, w.dormir] }
      - { es: "Haría más ejercicio, pero no tengo tiempo.", en: "I'd do more exercise, but I don't have time.", altEs: ["Yo haría más ejercicio, pero no tengo tiempo."], grammar: [g.conditional-simple], vocab: [w.ejercicio, w.tiempo], error: { wrong: "Hacería más ejercicio, pero no tengo tiempo.", explain: "hacer has an irregular stem: har- → haría.", grammar: g.conditional-simple } }
      - { es: "Si quieres adelgazar, deberías seguir una dieta sana.", en: "If you want to lose weight, you should follow a healthy diet.", grammar: [g.conditional-simple, g.si-present-future], vocab: [w.adelgazar, w.dieta, w.sano] }
      - { es: "Mi médico dice que debería dejar de fumar.", en: "My doctor says I should stop smoking.", altEs: ["Mi médico dice que tendría que dejar de fumar."], grammar: [g.conditional-simple], vocab: [w.fumar, w.dejar-de] }
      - { es: "Yo me quedaría en la cama todo el día.", en: "I would stay in bed all day.", altEs: ["Me quedaría en la cama todo el día."], grammar: [g.conditional-simple], vocab: [w.quedarse-en-cama] }
      - { es: "¿Qué harías con un millón de euros? — Viajaría por todo el mundo.", en: "What would you do with a million euros? — I'd travel all over the world.", grammar: [g.conditional-simple], vocab: [w.millon, w.viajar, w.mundo] }
      - { es: "Estoy muy estresado; necesitaría unas vacaciones.", en: "I'm very stressed; I could do with a holiday.", altEs: ["Estoy muy estresada; necesitaría unas vacaciones."], grammar: [g.conditional-simple], vocab: [w.estresado, w.vacaciones] }
      - { es: "Si comes tanto chocolate, engordarás.", en: "If you eat so much chocolate, you'll put on weight.", grammar: [g.si-present-future], vocab: [w.engordar, w.chocolate] }
      - { es: "Túmbate un rato; te mejorarás pronto.", en: "Lie down for a while; you'll get better soon.", grammar: [g.imperative-pronouns, g.future-simple], vocab: [w.tumbarse, w.mejorarse, w.rato] }
      - { es: "En el barco me mareé y vomité dos veces.", en: "On the boat I got seasick and vomited twice.", grammar: [g.preterite-regular], vocab: [w.marearse, w.vomitar, w.barco] }
      - { es: "Mi hermana está embarazada de cinco meses.", en: "My sister is five months pregnant.", grammar: [g.ser-vs-estar-basics], vocab: [w.embarazada, w.mes], note: "False friend: embarazada means pregnant, not embarrassed." }
      - { es: "Sin seguro médico, la operación costaría una fortuna.", en: "Without health insurance, the operation would cost a fortune.", altEs: ["Sin seguro médico, la operación costaría mucho dinero."], grammar: [g.conditional-simple], vocab: [w.seguro-medico, w.costar] }
      - { es: "Sería mejor hablar con el farmacéutico.", en: "It would be better to talk to the pharmacist.", altEs: ["Lo mejor sería hablar con el farmacéutico."], grammar: [g.conditional-simple], vocab: [w.farmaceutico, w.mejor] }
      - { es: "Yo / poder / ayudarte mañana", en: "I could help you tomorrow.", grammar: [g.conditional-simple], vocab: [w.poder, w.ayudar], transform: { instruction: "Use the conditional", answer: "Yo podría ayudarte mañana.", alt: ["Podría ayudarte mañana."] } }
    exchanges:
      - q: { es: "¿Qué harías tú en mi lugar?", en: "What would you do in my place?" }
        a: { es: "Yo iría al médico.", en: "I'd go to the doctor." }
        alt: ["Iría al médico.", "Yo en tu lugar descansaría."]
        grammar: [g.conditional-simple]
        vocab: [w.lugar, w.medico]
      - q: { es: "¿Qué harías con un millón de euros?", en: "What would you do with a million euros?" }
        a: { es: "Viajaría por todo el mundo.", en: "I'd travel all over the world." }
        alt: ["Compraría una casa.", "Dejaría de trabajar."]
        grammar: [g.conditional-simple]
        vocab: [w.millon, w.viajar]
      - q: { es: "¿Por qué no haces más ejercicio?", en: "Why don't you do more exercise?" }
        a: { es: "Haría más ejercicio, pero no tengo tiempo.", en: "I'd do more exercise, but I don't have time." }
        alt: ["No tengo tiempo.", "Debería, pero estoy muy cansado."]
        grammar: [g.conditional-simple]
        vocab: [w.ejercicio, w.tiempo]
      - q: { es: "¿Qué dice tu médico?", en: "What does your doctor say?" }
        a: { es: "Dice que debería dejar de fumar.", en: "He says I should stop smoking." }
        alt: ["Que debería dejar de fumar.", "Que tengo que descansar."]
        grammar: [g.conditional-simple]
        vocab: [w.fumar, w.dejar-de]
    texts:
      - title: "Consejo de un amigo"
        es: ["Estás muy estresado; necesitarías unas vacaciones.", "Yo en tu lugar me quedaría en la cama todo el fin de semana.", "Con menos estrés dormirías mejor y te sentirías mucho mejor."]
        en: ["You're very stressed; you could do with a holiday.", "If I were you, I'd stay in bed all weekend.", "With less stress you'd sleep better and feel much better."]
        grammar: [g.conditional-simple]
        vocab: [w.estresado, w.quedarse-en-cama, w.estres]
  - id: a2.u11.l4
    title: ¿Podría…? Me gustaría…
    teach: [g.conditional-courtesy]
    vocab: [w.gustaria, w.podria, w.sano.phr, w.tener-buen-aspecto, w.que-te-mejores, w.ser-alergico, w.respirar]
    tip: "The conditional softens requests: ¿Podría…? Me gustaría… Querría… The imperfect works too: Quería un café."
    sentences:
      - { es: "¿Podría darme algo para el dolor de cabeza?", en: "Could you give me something for a headache?", altEs: ["¿Me podría dar algo para el dolor de cabeza?"], grammar: [g.conditional-courtesy], vocab: [w.podria, w.dolor] }
      - { es: "Me gustaría pedir cita con el dentista.", en: "I'd like to make an appointment with the dentist.", altEs: ["Querría pedir cita con el dentista."], grammar: [g.conditional-courtesy], vocab: [w.gustaria, w.cita], note: "dentista = dentist." }
      - { es: "¿Le importaría abrir la ventana? No puedo respirar.", en: "Would you mind opening the window? I can't breathe.", grammar: [g.conditional-courtesy], vocab: [w.ventana, w.respirar] }
      - { es: "Querría unas pastillas para la garganta, por favor.", en: "I'd like some throat tablets, please.", altEs: ["Quería unas pastillas para la garganta, por favor."], grammar: [g.conditional-courtesy], vocab: [w.pastilla, w.garganta] }
      - { es: "Quería un jarabe para la tos.", en: "I wanted (I'd like) a cough syrup.", altEs: ["Querría un jarabe para la tos.", "Me gustaría un jarabe para la tos."], grammar: [g.conditional-courtesy, g.imperfect], vocab: [w.jarabe, w.tos] }
      - { es: "¿Podrías llamar al médico por mí?", en: "Could you call the doctor for me?", altEs: ["¿Puedes llamar al médico por mí?"], grammar: [g.conditional-courtesy], vocab: [w.podria, w.llamar] }
      - { es: "Soy alérgico a la penicilina. ¿Tendría otra cosa?", en: "I'm allergic to penicillin. Would you have something else?", grammar: [g.conditional-courtesy], vocab: [w.ser-alergico], note: "penicilina = penicillin." }
      - { es: "Tienes muy buen aspecto; ya te has puesto bien.", en: "You look very well; you've got better already.", grammar: [g.present-perfect], vocab: [w.tener-buen-aspecto, w.sano.phr] }
      - { es: "¡Que te mejores pronto!", en: "Get well soon!", grammar: [g.conditional-courtesy], vocab: [w.que-te-mejores, w.pronto] }
      - { es: "¿Sería posible cambiar la cita para el martes?", en: "Would it be possible to move the appointment to Tuesday?", altEs: ["¿Se podría cambiar la cita para el martes?"], grammar: [g.conditional-courtesy], vocab: [w.cambiar, w.cita, w.martes] }
      - { es: "Me gustaría hablar con el doctor, si es posible.", en: "I'd like to speak to the doctor, if possible.", grammar: [g.conditional-courtesy], vocab: [w.gustaria, w.hablar], error: { wrong: "Me gustaría de hablar con el doctor.", explain: "gustaría + infinitive, no preposition.", grammar: g.conditional-courtesy } }
      - { es: "¿Podría repetirlo más despacio, por favor?", en: "Could you repeat that more slowly, please?", altEs: ["¿Lo podría repetir más despacio, por favor?"], grammar: [g.conditional-courtesy, g.pronoun-placement], vocab: [w.repetir, w.despacio] }
      - { es: "¿Me podría decir dónde está la farmacia de guardia?", en: "Could you tell me where the duty pharmacy is?", grammar: [g.conditional-courtesy], vocab: [w.farmacia], note: "farmacia de guardia = pharmacy open out of hours." }
      - { es: "Perdone, ¿tendría un vaso de agua?", en: "Excuse me, would you have a glass of water?", altEs: ["Perdone, ¿me daría un vaso de agua?"], grammar: [g.conditional-courtesy], vocab: [w.vaso, w.agua] }
      - { es: "Dame una aspirina.", en: "Give me an aspirin.", grammar: [g.conditional-courtesy], vocab: [w.dar], transform: { instruction: "Make it a polite request with 'podría'", answer: "¿Podría darme una aspirina?", alt: ["¿Me podría dar una aspirina?", "¿Podría darme una aspirina, por favor?"] } }
    exchanges:
      - q: { es: "Buenos días, ¿en qué puedo ayudarle?", en: "Good morning, how can I help you?" }
        a: { es: "Querría unas pastillas para la garganta, por favor.", en: "I'd like some throat tablets, please." }
        alt: ["Me gustaría un jarabe para la tos.", "¿Podría darme algo para el dolor de cabeza?"]
        grammar: [g.conditional-courtesy]
        vocab: [w.pastilla, w.garganta]
      - q: { es: "¿Podría abrir la ventana? No puedo respirar.", en: "Could you open the window? I can't breathe." }
        a: { es: "Claro, ahora mismo.", en: "Of course, right away." }
        alt: ["Sí, claro.", "Sí, un momento."]
        grammar: [g.conditional-courtesy]
        vocab: [w.ventana, w.respirar]
      - q: { es: "¿Sería posible cambiar la cita para el martes?", en: "Would it be possible to move the appointment to Tuesday?" }
        a: { es: "Sí, ¿a qué hora le gustaría?", en: "Yes, what time would you like?" }
        alt: ["Sí, no hay problema.", "Lo siento, el martes no es posible."]
        grammar: [g.conditional-courtesy]
        vocab: [w.cambiar, w.cita]
      - q: { es: "¿Me podría decir dónde está la farmacia?", en: "Could you tell me where the pharmacy is?" }
        a: { es: "Sí, está en la esquina, al lado del banco.", en: "Yes, it's on the corner, next to the bank." }
        alt: ["En la esquina.", "Siga todo recto; está a la derecha."]
        grammar: [g.conditional-courtesy]
        vocab: [w.farmacia, w.esquina]
      - q: { es: "Me gustaría hablar con el médico.", en: "I'd like to speak to the doctor." }
        a: { es: "Un momento, por favor; ahora le llamo.", en: "One moment, please; I'll call him now." }
        alt: ["Espere un momento.", "Ahora mismo viene."]
        grammar: [g.conditional-courtesy]
        vocab: [w.gustaria, w.hablar]
    texts:
      - title: "Mensaje para el médico"
        es: ["Buenos días.", "Me gustaría cambiar mi cita del lunes.", "¿Sería posible venir el martes por la tarde?", "Muchas gracias."]
        en: ["Good morning.", "I'd like to change my Monday appointment.", "Would it be possible to come on Tuesday afternoon?", "Thank you very much."]
