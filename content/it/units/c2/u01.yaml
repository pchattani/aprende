id: c2.u01
title: "Dialetti e varietà"
lessons:
  - id: c2.u01.l1
    title: Lingue sorelle, non italiano sbagliato
    teach: [g.dialects-overview]
    vocab: [w.dialettale, w.dialettologia, w.idioma, w.parlata, w.vernacolo, w.isoglossa, w.latino-volgare, w.volgare.n, w.sostrato, w.superstrato, w.influsso, w.etimologia, w.etimo, w.lemma, w.autoctono, w.estinguersi, w.diglossia, w.bilinguismo, w.germanico]
    tip: "In Italian linguistics a dialetto is a separate language that grew out of Latin alongside Florentine, not a 'bad' or 'broken' Italian."
    sentences:
      - { es: "Il dialetto non è un italiano sbagliato: è una lingua sorella, nata dal latino volgare.", en: "Dialect isn't wrong Italian: it's a sister language, born from Vulgar Latin.", altEs: ["Il dialetto non è italiano sbagliato: è una lingua sorella, nata dal latino volgare.", "Il dialetto non è un italiano scorretto: è una lingua sorella nata dal latino volgare."], altEn: ["A dialect is not incorrect Italian: it is a sister language, born of Vulgar Latin."], grammar: [g.dialects-overview], vocab: [w.latino-volgare] }
      - { es: "Qui ad Assisi la parlata locale è umbra, ma i ragazzi la capiscono più di quanto la parlino.", en: "Here in Assisi the local speech is Umbrian, but young people understand it more than they speak it.", altEs: ["Qui ad Assisi la parlata del posto è umbra, ma i ragazzi la capiscono più di quanto la parlano.", "Ad Assisi la parlata locale è umbra, ma i giovani la capiscono più di quanto la parlino."], grammar: [g.dialects-overview], vocab: [w.parlata] }
      - { es: "Mia nonna passava dall'italiano al dialetto appena entrava in cucina.", en: "My grandmother switched from Italian to dialect as soon as she walked into the kitchen.", altEs: ["Mia nonna passava dall'italiano al dialetto non appena entrava in cucina."], grammar: [g.dialects-overview], vocab: [w.dialetto], transform: { instruction: "Rewrite in the present tense", answer: "Mia nonna passa dall'italiano al dialetto appena entra in cucina.", alt: ["Mia nonna passa dall'italiano al dialetto non appena entra in cucina."], en: "My grandmother switches from Italian to dialect as soon as she walks into the kitchen." } }
      - { es: "Un piemontese e un siciliano che parlano in dialetto non si capiscono.", en: "A Piedmontese and a Sicilian speaking in dialect can't understand each other.", altEs: ["Un piemontese e un siciliano che parlano dialetto non si capiscono.", "Se parlano in dialetto, un piemontese e un siciliano non si capiscono."], altEn: ["A Piedmontese and a Sicilian who speak in dialect don't understand each other."], grammar: [g.dialects-overview], vocab: [w.dialetto] }
      - { es: "La dialettologia studia come cambiano le parlate da un paese all'altro.", en: "Dialectology studies how local speech changes from one town to the next.", altEs: ["La dialettologia studia come cambiano le parlate da paese a paese."], grammar: [g.dialects-overview], vocab: [w.dialettologia, w.parlata] }
      - { es: "Un'isoglossa è una linea immaginaria che separa due tratti dialettali.", en: "An isogloss is an imaginary line separating two dialect features.", altEs: ["L'isoglossa è una linea immaginaria che separa due tratti dialettali."], grammar: [g.dialects-overview], vocab: [w.isoglossa, w.dialettale] }
      - { es: "La linea La Spezia-Rimini divide i dialetti settentrionali da quelli centro-meridionali.", en: "The La Spezia–Rimini line divides the northern dialects from the central and southern ones.", altEs: ["La linea La Spezia-Rimini separa i dialetti settentrionali da quelli centro-meridionali.", "La linea La Spezia-Rimini divide i dialetti del Nord da quelli del Centro e del Sud."], grammar: [g.dialects-overview], vocab: [w.isoglossa] }
      - { es: "Ogni idioma porta le tracce di un sostrato più antico.", en: "Every language carries traces of an older substratum.", altEs: ["Ogni idioma conserva le tracce di un sostrato più antico."], grammar: [g.dialects-overview], vocab: [w.idioma, w.sostrato] }
      - { es: "Il superstrato germanico ha lasciato in italiano parole come «guerra» e «guardia».", en: "The Germanic superstratum left words such as 'guerra' (war) and 'guardia' (guard) in Italian.", altEs: ["Il superstrato germanico ci ha lasciato parole come «guerra» e «guardia»."], grammar: [g.dialects-overview], vocab: [w.superstrato, w.influsso, w.germanico] }
      - { es: "Qual è l'etimo di questa parola? Viene dal latino, attraverso il volgare.", en: "What is the origin of this word? It comes from Latin, by way of the vernacular.", altEs: ["Qual è l'etimo di questa parola? Deriva dal latino, attraverso il volgare."], grammar: [g.dialects-overview], vocab: [w.etimo, w.volgare.n] }
      - { es: "Nel vocabolario dialettale ogni lemma ha la sua etimologia.", en: "In the dialect dictionary every headword has its etymology.", altEs: ["Nel dizionario dialettale ogni lemma ha la sua etimologia."], grammar: [g.dialects-overview], vocab: [w.lemma, w.etimologia, w.dialettale] }
      - { es: "In famiglia parlavamo dialetto, a scuola italiano: era una forma di diglossia.", en: "At home we spoke dialect, at school Italian: it was a form of diglossia.", altEs: ["A casa parlavamo dialetto, a scuola italiano: era una forma di diglossia.", "In famiglia si parlava dialetto, a scuola italiano: era una forma di diglossia."], grammar: [g.dialects-overview], vocab: [w.diglossia] }
      - { es: "Il bilinguismo tra italiano e dialetto non è un difetto, è una ricchezza.", en: "Bilingualism in Italian and dialect isn't a defect, it's an asset.", altEs: ["Il bilinguismo italiano-dialetto non è un difetto, ma una ricchezza."], altEn: ["Being bilingual in Italian and dialect is not a flaw but a treasure."], grammar: [g.dialects-overview], vocab: [w.bilinguismo] }
      - { es: "Se nessuno lo trasmette ai nipoti, un dialetto rischia di estinguersi in due generazioni.", en: "If nobody passes it on to their grandchildren, a dialect risks dying out within two generations.", altEs: ["Se nessuno lo insegna ai nipoti, un dialetto rischia di estinguersi in due generazioni."], grammar: [g.dialects-overview, g.direct-object-pronouns], vocab: [w.estinguersi], error: { wrong: "Se nessuno gli trasmette ai nipoti, un dialetto rischia di estinguersi in due generazioni.", explain: "The dialect is the direct object of trasmettere, so the pronoun is lo (lo trasmette ai nipoti); gli would mean 'to him'.", grammar: g.direct-object-pronouns } }
      - { es: "Le parole autoctone di un dialetto spesso non hanno un equivalente in italiano.", en: "A dialect's native words often have no equivalent in Italian.", altEs: ["Spesso le parole autoctone di un dialetto non hanno un equivalente in italiano."], grammar: [g.dialects-overview], vocab: [w.autoctono] }
      - { es: "Il napoletano deriva dal latino, non dall'italiano.", en: "Neapolitan comes from Latin, not from Italian.", altEs: ["Il napoletano viene dal latino, non dall'italiano."], grammar: [g.dialects-overview], vocab: [w.dialetto], error: { wrong: "Il napoletano deriva dall'italiano, non dal latino.", explain: "Italian dialects are not offshoots of Italian: like Florentine, they all descend directly from spoken Latin.", grammar: g.dialects-overview }, transform: { instruction: "Rewrite with essere + derivato in the present perfect", answer: "Il napoletano è derivato dal latino, non dall'italiano.", alt: [] } }
    exchanges:
      - q: { es: "Ma il dialetto non è un italiano sbagliato?", en: "But isn't dialect just wrong Italian?" }
        a: { es: "Per niente: è una lingua sorella, nata anche lei dal latino.", en: "Not at all: it's a sister language, also born from Latin." }
        alt: ["No, deriva dal latino come l'italiano.", "No, è un idioma con la sua storia."]
        grammar: [g.dialects-overview]
        vocab: [w.dialetto, w.idioma]
      - q: { es: "Lei parla il dialetto?", en: "Do you speak the dialect?" }
        a: { es: "Lo capisco benissimo, ma lo parlo solo con mia madre.", en: "I understand it perfectly, but I only speak it with my mother." }
        alt: ["Sì, in famiglia.", "Lo capisco, ma non lo parlo."]
        grammar: [g.dialects-overview]
        vocab: [w.dialetto]
      - q: { es: "Da dove viene questa parola?", en: "Where does this word come from?" }
        a: { es: "Il suo etimo è latino, ma è arrivata a noi attraverso il volgare.", en: "Its origin is Latin, but it reached us by way of the vernacular." }
        alt: ["Dal latino, attraverso il volgare.", "È di origine germanica."]
        grammar: [g.dialects-overview]
        vocab: [w.etimo, w.volgare.n]
      - q: { es: "Un siciliano capisce un piemontese che parla in dialetto?", en: "Does a Sicilian understand a Piedmontese speaking in dialect?" }
        a: { es: "Difficilmente: sono parlate molto lontane tra loro.", en: "Hardly: they are very different ways of speaking." }
        alt: ["No, quasi per niente.", "Di solito no."]
        grammar: [g.dialects-overview]
        vocab: [w.parlata]
      - q: { es: "Perché tanti dialetti si stanno estinguendo?", en: "Why are so many dialects dying out?" }
        a: { es: "Perché molti genitori hanno smesso di parlarli ai figli.", en: "Because many parents have stopped speaking them to their children." }
        alt: ["Perché i giovani non li parlano più.", "Perché nessuno li trasmette ai figli."]
        grammar: [g.dialects-overview]
        vocab: [w.estinguersi]
    texts:
      - title: "Dal latino alle parlate"
        es: ["Il latino parlato non era uguale in tutto l'impero.", "In ogni territorio agiva un sostrato diverso.", "Da queste differenze sono nati i dialetti, e tra loro anche il fiorentino."]
        en: ["Spoken Latin was not the same throughout the empire.", "In every territory a different substratum was at work.", "From these differences the dialects were born, Florentine among them."]
        grammar: [g.dialects-overview]
        vocab: [w.sostrato, w.dialetto]
      - title: "Messaggio di una studentessa"
        es: ["Oggi in piazza ad Assisi ho sentito due signori parlare in dialetto.", "Non ho capito quasi niente, ma era bellissimo.", "Domani lo racconto alla professoressa di dialettologia."]
        en: ["Today in the square in Assisi I heard two men speaking in dialect.", "I understood almost nothing, but it was beautiful.", "Tomorrow I'll tell my dialectology teacher about it."]
        grammar: [g.dialects-overview]
        vocab: [w.dialettologia]
    spicy:
      - { es: "Quando mi parli in dialetto non capisco niente, ma continua pure.", en: "When you speak to me in dialect I don't understand a thing, but do carry on.", altEs: ["Quando mi parli in dialetto non capisco nulla, ma continua pure."], grammar: [g.dialects-overview], vocab: [w.dialetto] }
      - { es: "Insegnami una parola in dialetto, ma una che si possa dire davanti a tua nonna.", en: "Teach me a word in dialect, but one you could say in front of your grandmother.", altEs: ["Insegnami una parola in dialetto, ma che si possa dire davanti a tua nonna."], grammar: [g.dialects-overview], vocab: [w.dialetto] }
      - { es: "Tra noi due c'è un'isoglossa: tu dici anguria, io dico cocomero, ma ci capiamo benissimo.", en: "There's an isogloss between the two of us: you say anguria, I say cocomero, but we understand each other perfectly.", grammar: [g.dialects-overview], vocab: [w.isoglossa] }
      - { es: "Il mio cuore pratica il bilinguismo: batte in italiano e sospira in dialetto.", en: "My heart is bilingual: it beats in Italian and sighs in dialect.", grammar: [g.dialects-overview], vocab: [w.bilinguismo] }
      - { es: "La tua parlata umbra mi piace più della Basilica, e ho detto tutto.", en: "I like your Umbrian way of talking more than the Basilica, and that says it all.", grammar: [g.dialects-overview], vocab: [w.parlata] }
  - id: c2.u01.l2
    title: Michetta o rosetta?
    teach: [g.regional-italian-features]
    vocab: [w.inflessione, w.regionalismo, w.geosinonimo, w.babbo, w.ganzo, w.bischero, w.michetta, w.rosetta, w.schiscetta, w.sciura, w.bauscia, w.picciotto, w.picciriddu, w.cicchetto, w.bacaro, w.spritz, w.chinotto, w.cacio, w.stracchino, w.caciotta, w.ciabatta, w.pantofola, w.pigliare]
    tip: "Regional Italian is standard Italian with a local accent, local words and a few local structures: recognise them, enjoy them, but write the standard."
    sentences:
      - { es: "A Milano la chiamano michetta, a Roma rosetta: è lo stesso panino.", en: "In Milan they call it michetta, in Rome rosetta: it's the same bread roll.", altEs: ["A Milano si chiama michetta, a Roma rosetta: è lo stesso panino.", "A Milano la chiamano michetta e a Roma rosetta, ma è lo stesso panino."], grammar: [g.regional-italian-features], vocab: [w.michetta, w.rosetta] }
      - { es: "Michetta e rosetta sono geosinonimi: parole diverse per la stessa cosa in regioni diverse.", en: "Michetta and rosetta are regional synonyms: different words for the same thing in different regions.", altEs: ["Michetta e rosetta sono due geosinonimi: parole diverse per la stessa cosa in regioni diverse."], grammar: [g.regional-italian-features], vocab: [w.geosinonimo] }
      - { es: "Ha un'inflessione toscana: dice «la hasa» invece di «la casa».", en: "He has a Tuscan accent: he says 'la hasa' instead of 'la casa'.", altEs: ["Ha un'inflessione toscana: invece di «la casa» dice «la hasa»."], altEn: ["She has a Tuscan accent: she says 'la hasa' instead of 'la casa'."], grammar: [g.regional-italian-features], vocab: [w.inflessione] }
      - { es: "In Toscana il papà è il babbo, e una cosa bella è una cosa ganza.", en: "In Tuscany dad is 'babbo', and a great thing is a 'ganzo' thing.", altEs: ["In Toscana il papà si chiama babbo, e una cosa bella è una cosa ganza."], grammar: [g.regional-italian-features], vocab: [w.babbo, w.ganzo] }
      - { es: "Non fare il bischero!", en: "Don't be a fool!", altEs: ["Non fare il bischero."], altEn: ["Don't be an idiot!", "Stop fooling around!"], grammar: [g.regional-italian-features], vocab: [w.bischero], note: "Tuscan, usually affectionate rather than offensive." }
      - { es: "Noi si va al cinema, te che fai?", en: "We're going to the cinema, what are you doing?", altEn: ["We're off to the cinema, what about you?"], grammar: [g.regional-italian-features], vocab: [w.cinema], note: "Tuscan: noi si va = noi andiamo; te as a subject = tu.", transform: { instruction: "Rewrite in standard Italian", answer: "Noi andiamo al cinema, tu che fai?", alt: ["Andiamo al cinema, tu che fai?", "Noi andiamo al cinema, e tu che fai?"] } }
      - { es: "La sciura del terzo piano sa tutto di tutti.", en: "The lady on the third floor knows everything about everyone.", altEs: ["La sciura del terzo piano sa tutto di tutti quanti."], grammar: [g.regional-italian-features], vocab: [w.sciura] }
      - { es: "Quel bauscia parla sempre della sua macchina nuova.", en: "That show-off is always talking about his new car.", altEs: ["Quel bauscia non fa che parlare della sua macchina nuova."], grammar: [g.regional-italian-features], vocab: [w.bauscia] }
      - { es: "A Venezia si va di bacaro in bacaro a mangiare cicchetti e bere uno spritz.", en: "In Venice you go from wine bar to wine bar eating cicchetti and drinking a spritz.", altEs: ["A Venezia si va per bacari a mangiare cicchetti e bere uno spritz."], grammar: [g.regional-italian-features], vocab: [w.bacaro, w.cicchetto, w.spritz] }
      - { es: "In Sicilia un picciriddu è un bambino, e un picciotto è un ragazzo.", en: "In Sicily a 'picciriddu' is a child, and a 'picciotto' is a young man.", altEs: ["In Sicilia il picciriddu è il bambino e il picciotto è il ragazzo."], grammar: [g.regional-italian-features], vocab: [w.picciriddu, w.picciotto] }
      - { es: "Al Centro e al Sud il formaggio diventa cacio: pensa alla cacio e pepe.", en: "In central and southern Italy cheese becomes 'cacio': think of cacio e pepe.", altEs: ["Al Centro e al Sud il formaggio si chiama cacio: pensa alla cacio e pepe."], grammar: [g.regional-italian-features], vocab: [w.cacio] }
      - { es: "A Milano compri lo stracchino, in Umbria la caciotta: sono due formaggi morbidi.", en: "In Milan you buy stracchino, in Umbria caciotta: they're both soft cheeses.", altEs: ["A Milano si compra lo stracchino, in Umbria la caciotta: sono due formaggi morbidi."], grammar: [g.regional-italian-features], vocab: [w.stracchino, w.caciotta] }
      - { es: "Piglio il treno delle otto e arrivo a Napoli per pranzo.", en: "I'm catching the eight o'clock train and getting to Naples for lunch.", altEs: ["Piglio il treno delle otto e sono a Napoli per pranzo."], grammar: [g.regional-italian-features], vocab: [w.pigliare], note: "Pigliare for prendere is typical of central and southern speech.", transform: { instruction: "Rewrite in standard Italian, replacing the regional verb", answer: "Prendo il treno delle otto e arrivo a Napoli per pranzo.", alt: ["Prendo il treno delle otto e sono a Napoli per pranzo."] } }
      - { es: "Ciabatte o pantofole? Dipende da dove sei cresciuto.", en: "Ciabatte or pantofole (slippers)? It depends on where you grew up.", altEs: ["Ciabatte o pantofole? Dipende da dove sei cresciuta."], grammar: [g.regional-italian-features], vocab: [w.ciabatta, w.pantofola] }
      - { es: "Il chinotto è una bibita amara che all'estero quasi nessuno conosce.", en: "Chinotto is a bitter soft drink that hardly anyone knows abroad.", altEs: ["Il chinotto è una bibita amara che quasi nessuno conosce all'estero."], grammar: [g.regional-italian-features], vocab: [w.chinotto] }
      - { es: "In un tema scritto è meglio evitare i regionalismi.", en: "In a written essay it's better to avoid regionalisms.", altEs: ["In un tema scritto conviene evitare i regionalismi.", "Nei temi scritti è meglio evitare i regionalismi."], grammar: [g.regional-italian-features], vocab: [w.regionalismo], error: { wrong: "In un tema scritto è meglio evitare i regionalisti.", explain: "A regionalismo is a regional word or expression; a regionalista is a person who supports regional autonomy.", grammar: g.regional-italian-features } }
    exchanges:
      - q: { es: "Come si chiama questo panino a Milano?", en: "What's this bread roll called in Milan?" }
        a: { es: "Michetta. A Roma invece lo chiamano rosetta.", en: "Michetta. In Rome, on the other hand, they call it rosetta." }
        alt: ["Michetta.", "Si chiama michetta."]
        grammar: [g.regional-italian-features]
        vocab: [w.michetta, w.rosetta]
      - q: { es: "Lei di dov'è? Ha un'inflessione particolare.", en: "Where are you from? You have a distinctive accent." }
        a: { es: "Sono di Firenze: si sente da come pronuncio la «c», vero?", en: "I'm from Florence: you can tell from how I pronounce my 'c', right?" }
        alt: ["Sono toscano.", "Sono di Firenze, si sente?"]
        grammar: [g.regional-italian-features]
        vocab: [w.inflessione]
      - q: { es: "Andiamo a fare un giro di bacari stasera?", en: "Shall we do a tour of the wine bars tonight?" }
        a: { es: "Volentieri, ma dopo il terzo spritz torno a casa.", en: "Gladly, but after the third spritz I'm going home." }
        alt: ["Volentieri!", "Sì, e mangiamo qualche cicchetto."]
        grammar: [g.regional-italian-features]
        vocab: [w.bacaro, w.spritz]
      - q: { es: "Che cosa vuol dire ganzo?", en: "What does 'ganzo' mean?" }
        a: { es: "In Toscana vuol dire bello, simpatico, che piace.", en: "In Tuscany it means nice, cool, likeable." }
        alt: ["Vuol dire bello.", "In toscano significa simpatico."]
        grammar: [g.regional-italian-features]
        vocab: [w.ganzo]
      - q: { es: "Cosa ti sei portato per pranzo?", en: "What did you bring for lunch?" }
        a: { es: "La solita schiscetta: riso freddo e verdure.", en: "The usual lunchbox: cold rice and vegetables." }
        alt: ["La schiscetta, come sempre.", "Niente, compro una michetta al bar."]
        grammar: [g.regional-italian-features]
        vocab: [w.schiscetta]
    texts:
      - title: "Cartolina da Venezia"
        es: ["Ciao babbo!", "Ieri sera siamo andati di bacaro in bacaro.", "Ho mangiato cicchetti buonissimi e ho bevuto un solo spritz, giuro."]
        en: ["Hi Dad!", "Last night we went from wine bar to wine bar.", "I ate delicious cicchetti and only drank one spritz, I swear."]
        grammar: [g.regional-italian-features]
        vocab: [w.babbo, w.bacaro, w.cicchetto, w.spritz]
      - title: "Piccolo dizionario dei geosinonimi"
        es: ["Panino: michetta a Milano, rosetta a Roma.", "Formaggio: cacio al Centro e al Sud.", "Ragazzo: picciotto in Sicilia."]
        en: ["Bread roll: michetta in Milan, rosetta in Rome.", "Cheese: cacio in central and southern Italy.", "Young man: picciotto in Sicily."]
        grammar: [g.regional-italian-features]
        vocab: [w.geosinonimo, w.michetta, w.rosetta, w.cacio, w.picciotto]
    spicy:
      - { es: "Sei proprio ganzo, lo sai? Te lo dico in toscano così sembra meno serio.", en: "You're really cool, you know? I'm saying it in Tuscan so it sounds less serious.", altEs: ["Sei proprio ganza, lo sai? Te lo dico in toscano così sembra meno serio."], grammar: [g.regional-italian-features], vocab: [w.ganzo] }
      - { es: "Non fare il bauscia: anch'io ho una macchina, ma non te ne parlo per mezz'ora.", en: "Don't be a show-off: I have a car too, but I don't go on about it for half an hour.", grammar: [g.regional-italian-features], vocab: [w.bauscia] }
      - { es: "A Venezia mi bastano un cicchetto, uno spritz e la tua compagnia.", en: "In Venice all I need is a cicchetto, a spritz and your company.", altEs: ["A Venezia mi bastano uno spritz, un cicchetto e la tua compagnia."], grammar: [g.regional-italian-features], vocab: [w.cicchetto, w.spritz] }
      - { es: "Vieni pure in pantofole: tanto la cena la cucino io.", en: "Come in your slippers if you like: I'm cooking dinner anyway.", altEs: ["Vieni pure in ciabatte: tanto la cena la cucino io."], grammar: [g.regional-italian-features], vocab: [w.pantofola] }
      - { es: "Mi hai pigliato il cuore, come si dice al Sud.", en: "You've caught my heart, as they say in the South.", altEs: ["Mi hai pigliato il cuore, come dicono al Sud."], grammar: [g.regional-italian-features], vocab: [w.pigliare] }
  - id: c2.u01.l3
    title: Minoranze e campanili
    teach: [g.dialects-overview, g.regional-italian-features]
    vocab: [w.lingua-minoritaria, w.minoritario, w.friulano, w.ladino, w.occitano, w.grico, w.arbereshe, w.alloglotto, w.tutela-linguistica, w.campanilismo, w.campanilistico, w.nostrano, w.forestiero, w.compaesano, w.paesano, w.emigrato, w.linguista]
    tip: "Law 482 of 1999 protects twelve historic minority languages; Sardinian and Friulian are languages in their own right, not dialects of Italian."
    sentences:
      - { es: "La legge 482 del 1999 tutela dodici lingue minoritarie storiche.", en: "Law 482 of 1999 protects twelve historic minority languages.", altEs: ["La legge 482 del 1999 protegge dodici lingue minoritarie storiche."], grammar: [g.dialects-overview], vocab: [w.lingua-minoritaria, w.tutelare] }
      - { es: "Il sardo e il friulano sono considerati lingue a sé, non dialetti.", en: "Sardinian and Friulian are considered languages in their own right, not dialects.", altEs: ["Il friulano e il sardo sono considerati lingue a sé, non dialetti."], grammar: [g.dialects-overview], vocab: [w.friulano] }
      - { es: "In alcune valli delle Dolomiti si parla ancora il ladino.", en: "In some Dolomite valleys Ladin is still spoken.", altEs: ["In alcune valli dolomitiche si parla ancora il ladino."], grammar: [g.dialects-overview, g.passive-essere], vocab: [w.ladino], transform: { instruction: "Make it passive with essere", answer: "In alcune valli delle Dolomiti il ladino è ancora parlato.", alt: ["Il ladino è ancora parlato in alcune valli delle Dolomiti."] } }
      - { es: "Nel Salento alcuni paesi parlano il grico, una varietà di greco.", en: "In Salento some villages speak Griko, a variety of Greek.", altEs: ["In alcuni paesi del Salento si parla il grico, una varietà di greco."], grammar: [g.dialects-overview], vocab: [w.grico] }
      - { es: "In Calabria vivono comunità arbëreshe che parlano un albanese antico.", en: "In Calabria there are Arbëreshë communities who speak an old form of Albanian.", altEs: ["In Calabria ci sono comunità arbëreshe che parlano un albanese antico."], grammar: [g.dialects-overview], vocab: [w.arbereshe] }
      - { es: "In alcune valli del Piemonte si parla anche l'occitano.", en: "In some valleys of Piedmont Occitan is spoken too.", altEs: ["Nelle valli occitane del Piemonte si parla ancora l'occitano."], grammar: [g.dialects-overview], vocab: [w.occitano] }
      - { es: "Molte comunità alloglotte si trovano lungo i confini.", en: "Many alloglot communities are found along the borders.", altEs: ["Molte comunità alloglotte vivono lungo i confini."], altEn: ["Many communities speaking other languages live along the borders."], grammar: [g.dialects-overview, g.adjective-agreement], vocab: [w.alloglotto], error: { wrong: "Molte comunità alloglotti si trovano lungo i confini.", explain: "alloglotto agrees with comunità, which is feminine plural: alloglotte.", grammar: g.adjective-agreement } }
      - { es: "Senza una vera tutela linguistica, le lingue minoritarie rischiano di sparire.", en: "Without real language protection, minority languages risk disappearing.", altEs: ["Senza un'autentica tutela linguistica, le lingue minoritarie rischiano di sparire."], grammar: [g.dialects-overview], vocab: [w.tutela-linguistica, w.minoritario] }
      - { es: "Il campanilismo è l'amore, a volte esagerato, per il proprio paese.", en: "Campanilismo is love, sometimes excessive, for one's own town.", altEs: ["Il campanilismo è l'amore, talvolta esagerato, per il proprio paese."], altEn: ["Parochialism is a sometimes exaggerated love for your home town."], grammar: [g.regional-italian-features], vocab: [w.campanilismo] }
      - { es: "Assisi e Perugia sono vicinissime, ma nel Medioevo si facevano la guerra: il campanilismo ha radici antiche.", en: "Assisi and Perugia are very close, but in the Middle Ages they waged war on each other: local rivalry has deep roots.", grammar: [g.regional-italian-features], vocab: [w.campanilismo] }
      - { es: "Non essere così campanilistico: anche l'olio di Spoleto è buono!", en: "Don't be so parochial: the oil from Spoleto is good too!", altEs: ["Non essere così campanilistica: anche l'olio di Spoleto è buono!"], grammar: [g.regional-italian-features], vocab: [w.campanilistico] }
      - { es: "Compriamo solo prodotti nostrani: olio, vino e lenticchie.", en: "We only buy local produce: oil, wine and lentils.", altEs: ["Compriamo soltanto prodotti nostrani: olio, vino e lenticchie."], grammar: [g.regional-italian-features], vocab: [w.nostrano] }
      - { es: "Per i compaesani di mia nonna, anche chi viene dal paese vicino è un forestiero.", en: "For my grandmother's fellow villagers, even someone from the next village is an outsider.", altEs: ["Per i compaesani di mia nonna è forestiero anche chi viene dal paese vicino."], grammar: [g.regional-italian-features], vocab: [w.compaesano, w.forestiero], transform: { instruction: "Make the outsiders plural: anche quelli che vengono…", answer: "Per i compaesani di mia nonna, anche quelli che vengono dal paese vicino sono forestieri.", alt: ["Per i compaesani di mia nonna sono forestieri anche quelli che vengono dal paese vicino."] } }
      - { es: "La festa paesana finisce sempre con la banda e i fuochi d'artificio.", en: "The village festival always ends with the band and fireworks.", altEs: ["La festa del paese finisce sempre con la banda e i fuochi d'artificio."], grammar: [g.regional-italian-features], vocab: [w.paesano] }
      - { es: "Gli emigrati in Brasile hanno conservato il dialetto veneto più dei parenti rimasti in Italia.", en: "The emigrants to Brazil kept the Venetan dialect better than the relatives who stayed in Italy.", altEs: ["Gli emigrati in Brasile hanno conservato il veneto più dei parenti rimasti in Italia."], grammar: [g.dialects-overview], vocab: [w.emigrato] }
    exchanges:
      - q: { es: "Quante lingue minoritarie riconosce lo Stato italiano?", en: "How many minority languages does the Italian state recognise?" }
        a: { es: "Dodici, tutelate da una legge del 1999.", en: "Twelve, protected by a law from 1999." }
        alt: ["Dodici.", "Dodici lingue storiche."]
        grammar: [g.dialects-overview]
        vocab: [w.lingua-minoritaria]
      - q: { es: "Il sardo è un dialetto?", en: "Is Sardinian a dialect?" }
        a: { es: "No, per i linguisti è una lingua a sé, e la legge la tutela.", en: "No, for linguists it's a language in its own right, and the law protects it." }
        alt: ["No, è una lingua.", "No, è una lingua minoritaria."]
        grammar: [g.dialects-overview]
        vocab: [w.tutelare, w.linguista]
      - q: { es: "Lei è di qui?", en: "Are you from here?" }
        a: { es: "Macché, sono un forestiero: vivo ad Assisi solo da trent'anni.", en: "Not at all, I'm an outsider: I've only lived in Assisi for thirty years." }
        alt: ["No, sono forestiero.", "Sì, sono nato qui."]
        grammar: [g.regional-italian-features]
        vocab: [w.forestiero]
      - q: { es: "Dove si parla il grico?", en: "Where is Griko spoken?" }
        a: { es: "In alcuni paesi del Salento, ma ormai lo parlano soprattutto gli anziani.", en: "In a few villages in Salento, but these days it's mostly the elderly who speak it." }
        alt: ["Nel Salento.", "In alcuni paesi del Salento."]
        grammar: [g.dialects-overview]
        vocab: [w.grico]
      - q: { es: "Perché tuo nonno parla ancora veneto?", en: "Why does your grandfather still speak Venetan?" }
        a: { es: "Perché è emigrato in Brasile da giovane, e lì il dialetto si è conservato.", en: "Because he emigrated to Brazil as a young man, and the dialect was preserved there." }
        alt: ["Perché è cresciuto tra emigrati veneti.", "Perché in famiglia lo parlavano tutti."]
        grammar: [g.dialects-overview]
        vocab: [w.emigrato]
    texts:
      - title: "Cartello in Val Badia"
        es: ["Benvenuti in Val Badia.", "Qui si parlano ladino, tedesco e italiano.", "Per questo tutti i cartelli sono in tre lingue."]
        en: ["Welcome to Val Badia.", "Ladin, German and Italian are spoken here.", "That's why all the signs are in three languages."]
        grammar: [g.dialects-overview]
        vocab: [w.ladino]
      - title: "Dal diario di un emigrato"
        es: ["Siamo partiti da Gubbio nel 1952.", "In Argentina parlavamo dialetto in casa e spagnolo al lavoro.", "I miei figli capiscono il dialetto, ma non lo parlano."]
        en: ["We left Gubbio in 1952.", "In Argentina we spoke dialect at home and Spanish at work.", "My children understand the dialect, but they don't speak it."]
        grammar: [g.dialects-overview]
        vocab: [w.emigrato]
    spicy:
      - { es: "Mi hai chiamato forestiero, ma stasera ti offro la cena e divento tuo compaesano.", en: "You called me an outsider, but tonight I'm buying you dinner and becoming your fellow villager.", altEs: ["Mi hai chiamata forestiera, ma stasera ti offro la cena e divento tua compaesana."], grammar: [g.regional-italian-features], vocab: [w.forestiero, w.compaesano] }
      - { es: "Il mio campanilismo finisce dove cominciano i tuoi occhi.", en: "My parochialism ends where your eyes begin.", grammar: [g.regional-italian-features], vocab: [w.campanilismo] }
      - { es: "Insegnami il friulano: voglio dirti cose dolci che nessuno qui può capire.", en: "Teach me Friulian: I want to tell you sweet things nobody here can understand.", grammar: [g.dialects-overview], vocab: [w.friulano] }
      - { es: "Sono una minoranza di una sola persona: tutelami con un bacio.", en: "I'm a minority of one: protect me with a kiss.", grammar: [g.dialects-overview], vocab: [w.tutelare] }
      - { es: "Alla festa paesana ho ballato con mezzo paese, ma pensavo solo a te.", en: "At the village festival I danced with half the village, but I was only thinking of you.", grammar: [g.regional-italian-features], vocab: [w.paesano] }
  - id: c2.u01.l4
    title: La questione della lingua
    teach: [g.questione-della-lingua]
    vocab: [w.questione-della-lingua, w.purismo, w.crusca, w.accademia, w.vocabolario, w.lingua-nazionale, w.koinè, w.egemonia, w.prestigio, w.prestigioso, w.standardizzazione, w.unificazione-linguistica, w.alfabetizzazione, w.analfabetismo, w.analfabeta, w.borghese, w.popolano, w.bisnonno, w.migrazione]
    tip: "Italian was for centuries a written, literary language based on 14th-century Florentine; most Italians made it their everyday spoken language only in the 20th century."
    sentences:
      - { es: "Il Cantico delle creature di San Francesco è uno dei primi testi poetici in volgare.", en: "St Francis's Canticle of the Creatures is one of the first poetic texts in the vernacular.", altEs: ["Il Cantico di frate Sole di San Francesco è uno dei primi testi poetici in volgare."], grammar: [g.questione-della-lingua], vocab: [w.volgare.n] }
      - { es: "Per secoli l'italiano è stato soprattutto una lingua scritta.", en: "For centuries Italian was above all a written language.", altEs: ["Per secoli l'italiano fu soprattutto una lingua scritta.", "L'italiano è stato per secoli soprattutto una lingua scritta."], grammar: [g.questione-della-lingua, g.auxiliary-choice], vocab: [w.lingua-nazionale], error: { wrong: "Per secoli l'italiano ha stato soprattutto una lingua scritta.", explain: "essere forms its compound tenses with essere: è stato, never ha stato (Spanish ha sido misleads here).", grammar: g.auxiliary-choice } }
      - { es: "Nel 1525 Bembo propone come modelli Petrarca per la poesia e Boccaccio per la prosa.", en: "In 1525 Bembo proposes Petrarca as the model for poetry and Boccaccio for prose.", grammar: [g.questione-della-lingua, g.passato-remoto-forms], vocab: [w.prosa], transform: { instruction: "Rewrite with the passato remoto", answer: "Nel 1525 Bembo propose come modelli Petrarca per la poesia e Boccaccio per la prosa.", alt: [], en: "In 1525 Bembo proposed Petrarca as the model for poetry and Boccaccio for prose." } }
      - { es: "L'Accademia della Crusca fu fondata a Firenze nel 1583.", en: "The Accademia della Crusca was founded in Florence in 1583.", altEs: ["L'Accademia della Crusca è stata fondata a Firenze nel 1583.", "Nel 1583 a Firenze fu fondata l'Accademia della Crusca."], grammar: [g.questione-della-lingua], vocab: [w.accademia, w.crusca] }
      - { es: "Il primo Vocabolario della Crusca uscì nel 1612.", en: "The first Dictionary of the Crusca came out in 1612.", altEs: ["Il primo Vocabolario della Crusca fu pubblicato nel 1612."], grammar: [g.questione-della-lingua], vocab: [w.vocabolario] }
      - { es: "Il nome viene dalla crusca: gli accademici volevano separare la farina buona da quella cattiva.", en: "The name comes from bran: the academicians wanted to separate the good flour from the bad.", altEs: ["Il nome deriva dalla crusca: gli accademici volevano separare la farina buona dalla cattiva."], grammar: [g.questione-della-lingua], vocab: [w.crusca] }
      - { es: "L'egemonia del fiorentino nacque dal prestigio delle Tre Corone, non dalla forza politica di Firenze.", en: "The dominance of Florentine grew out of the prestige of the Three Crowns, not out of Florence's political power.", altEs: ["Il fiorentino si impose per il prestigio delle Tre Corone, non per la forza politica di Firenze."], grammar: [g.questione-della-lingua], vocab: [w.egemonia, w.prestigio], note: "The Tre Corone are Dante, Petrarca and Boccaccio." }
      - { es: "Era la varietà più prestigiosa perché aveva Dante, Petrarca e Boccaccio.", en: "It was the most prestigious variety because it had Dante, Petrarca and Boccaccio.", altEs: ["Era la varietà più prestigiosa, perché aveva Dante, Petrarca e Boccaccio."], grammar: [g.questione-della-lingua], vocab: [w.prestigioso] }
      - { es: "Prima dell'Unità esisteva già una koinè scritta, usata da nobili e borghesi di tutte le regioni.", en: "Before Unification there was already a written koine, used by nobles and the middle classes in every region.", altEs: ["Prima dell'Unità c'era già una koinè scritta, usata da nobili e borghesi di tutte le regioni."], grammar: [g.questione-della-lingua], vocab: [w.koinè, w.borghese] }
      - { es: "Il popolano parlava dialetto; l'italiano era la lingua dei libri.", en: "The common man spoke dialect; Italian was the language of books.", altEs: ["Il popolano parlava il dialetto: l'italiano era la lingua dei libri."], grammar: [g.questione-della-lingua], vocab: [w.popolano] }
      - { es: "Secondo Tullio De Mauro, all'Unità parlava italiano circa il 2,5 per cento della popolazione.", en: "According to Tullio De Mauro, at Unification about 2.5 per cent of the population spoke Italian.", altEs: ["Secondo Tullio De Mauro, nel 1861 parlava italiano circa il 2,5 per cento della popolazione."], grammar: [g.questione-della-lingua], vocab: [w.popolazione] }
      - { es: "L'analfabetismo era altissimo, soprattutto nelle campagne del Sud.", en: "Illiteracy was extremely high, especially in the southern countryside.", altEs: ["L'analfabetismo era molto alto, soprattutto nelle campagne del Sud."], grammar: [g.questione-della-lingua], vocab: [w.analfabetismo] }
      - { es: "Mio bisnonno era analfabeta, ma sapeva a memoria interi canti di Dante.", en: "My great-grandfather was illiterate, but he knew whole cantos of Dante by heart.", altEs: ["Il mio bisnonno era analfabeta, ma sapeva a memoria interi canti di Dante."], grammar: [g.questione-della-lingua], vocab: [w.analfabeta, w.bisnonno] }
      - { es: "La scuola obbligatoria ha avviato l'alfabetizzazione di massa.", en: "Compulsory schooling launched mass literacy.", altEs: ["La scuola dell'obbligo ha avviato l'alfabetizzazione di massa."], grammar: [g.questione-della-lingua], vocab: [w.alfabetizzazione] }
      - { es: "La televisione ha insegnato l'italiano a milioni di persone.", en: "Television taught Italian to millions of people.", altEs: ["La tv ha insegnato l'italiano a milioni di persone."], grammar: [g.questione-della-lingua, g.passive-essere], vocab: [w.unificazione-linguistica], transform: { instruction: "Make it passive", answer: "L'italiano è stato insegnato a milioni di persone dalla televisione.", alt: ["L'italiano fu insegnato a milioni di persone dalla televisione."], en: "Italian was taught to millions of people by television." } }
      - { es: "Il purismo dell'Ottocento voleva riportare la lingua al Trecento, ma la standardizzazione seguì un'altra strada.", en: "Nineteenth-century purism wanted to take the language back to the fourteenth century, but standardisation went another way.", grammar: [g.questione-della-lingua], vocab: [w.purismo, w.standardizzazione] }
    exchanges:
      - q: { es: "Perché proprio il fiorentino è diventato l'italiano?", en: "Why was it Florentine in particular that became Italian?" }
        a: { es: "Per il prestigio di Dante, Petrarca e Boccaccio, più che per ragioni politiche.", en: "Because of the prestige of Dante, Petrarca and Boccaccio, more than for political reasons." }
        alt: ["Per il prestigio delle Tre Corone.", "Per il prestigio della sua letteratura."]
        grammar: [g.questione-della-lingua]
        vocab: [w.prestigio]
      - q: { es: "Che cos'è la questione della lingua?", en: "What is the 'language question'?" }
        a: { es: "È il lungo dibattito su quale italiano usare: quello antico, quello vivo o quello di tutti.", en: "It's the long debate over which Italian to use: the old one, the living one or everyone's." }
        alt: ["È il dibattito su quale lingua usare in Italia.", "Un dibattito durato secoli."]
        grammar: [g.questione-della-lingua]
        vocab: [w.questione-della-lingua]
      - q: { es: "Quanti parlavano italiano nel 1861?", en: "How many people spoke Italian in 1861?" }
        a: { es: "Pochissimi: secondo De Mauro, circa il 2,5 per cento.", en: "Very few: according to De Mauro, about 2.5 per cent." }
        alt: ["Pochissimi.", "Una piccola minoranza."]
        grammar: [g.questione-della-lingua]
        vocab: [w.popolazione]
      - q: { es: "È l'Accademia della Crusca a decidere che cosa è corretto?", en: "Is it the Accademia della Crusca that decides what's correct?" }
        a: { es: "No, dà consigli e risponde ai dubbi, ma non fa leggi.", en: "No, it gives advice and answers queries, but it doesn't make laws." }
        alt: ["No, consiglia ma non decide.", "No, è un'accademia, non un tribunale."]
        grammar: [g.questione-della-lingua]
        vocab: [w.accademia, w.crusca]
      - q: { es: "Chi ha davvero insegnato l'italiano agli italiani?", en: "Who really taught Italians Italian?" }
        a: { es: "La scuola, il servizio militare, le migrazioni interne e soprattutto la televisione.", en: "School, military service, internal migration and above all television." }
        alt: ["Soprattutto la televisione.", "La scuola e la televisione."]
        grammar: [g.questione-della-lingua]
        vocab: [w.unificazione-linguistica, w.migrazione]
    texts:
      - title: "Cronologia"
        es: ["1525: Bembo pubblica le Prose della volgar lingua.", "1612: esce il primo Vocabolario della Crusca.", "1840: Manzoni pubblica l'edizione definitiva dei Promessi sposi.", "1954: cominciano le trasmissioni della televisione italiana."]
        en: ["1525: Bembo publishes the Prose della volgar lingua.", "1612: the first Dictionary of the Crusca comes out.", "1840: Manzoni publishes the final edition of The Betrothed.", "1954: Italian television begins broadcasting."]
        grammar: [g.questione-della-lingua]
        vocab: [w.vocabolario, w.crusca]
      - title: "Nella basilica di Assisi"
        es: ["La guida ci ha letto il Cantico delle creature.", "È scritto in volgare umbro, circa ottocento anni fa.", "Eppure abbiamo capito quasi tutto."]
        en: ["The guide read us the Canticle of the Creatures.", "It was written in Umbrian vernacular, about eight hundred years ago.", "And yet we understood almost everything."]
        grammar: [g.questione-della-lingua]
        vocab: [w.volgare.n]
    spicy:
      - { es: "La Crusca separa la farina dalla crusca; io separo te da tutti gli altri.", en: "The Crusca separates the flour from the bran; I separate you from everyone else.", grammar: [g.questione-della-lingua], vocab: [w.crusca] }
      - { es: "Per secoli l'italiano è stato una lingua scritta, e tu invece mi scrivi solo «ok».", en: "For centuries Italian was a written language, and you only ever text me 'ok'.", grammar: [g.questione-della-lingua], vocab: [w.lingua-nazionale] }
      - { es: "Non sono analfabeta: so leggere benissimo i tuoi silenzi.", en: "I'm not illiterate: I can read your silences perfectly well.", altEs: ["Non sono analfabeta: i tuoi silenzi li so leggere benissimo."], grammar: [g.questione-della-lingua], vocab: [w.analfabeta] }
      - { es: "Il tuo sorriso ha più prestigio di tutta l'Accademia della Crusca.", en: "Your smile has more prestige than the whole Accademia della Crusca.", grammar: [g.questione-della-lingua], vocab: [w.prestigio, w.accademia] }
      - { es: "Manzoni è andato a Firenze per la lingua; io ci andrei per te.", en: "Manzoni went to Florence for the language; I'd go there for you.", grammar: [g.questione-della-lingua], vocab: [w.lingua-nazionale] }
dialogues:
  - id: c2.u01.d1
    title: Pane, caciotta e dialetto
    context: Malik, a student at the University for Foreigners in Perugia, is shopping in a small grocery in Assisi and chats with the owner, Graziella.
    lines:
      - { speaker: Graziella, es: "Buongiorno! Cerca qualcosa di particolare?", en: "Good morning! Are you looking for anything in particular?" }
      - { speaker: Malik, es: "Sì, un po' di caciotta e del pane. Ma prima mi tolga una curiosità: che lingua parlavano quei due signori qui fuori?", en: "Yes, some caciotta and some bread. But first, satisfy my curiosity: what language were those two men outside speaking?" }
      - { speaker: Graziella, es: "Parlavano il dialetto di qui. È una parlata umbra, abbastanza vicina all'italiano.", en: "They were speaking the local dialect. It's an Umbrian variety, fairly close to Italian." }
      - { speaker: Malik, es: "Ho capito solo qualche parola. Ma i dialetti non sono un italiano sbagliato?", en: "I only understood a few words. But aren't dialects just wrong Italian?" }
      - { speaker: Graziella, es: "Per carità! Sono lingue sorelle: vengono tutte dal latino, come il fiorentino, che poi è diventato l'italiano.", en: "Heavens, no! They're sister languages: they all come from Latin, like Florentine, which later became Italian." }
      - { speaker: Malik, es: "E Lei lo parla, il dialetto?", en: "And do you speak it, the dialect?" }
      - { speaker: Graziella, es: "Con mia madre sì, con i clienti no. E con i miei figli, purtroppo, poco.", en: "With my mother yes, with customers no. And with my children, unfortunately, not much." }
      - { speaker: Malik, es: "Allora il dialetto si sta estinguendo?", en: "So the dialect is dying out?" }
      - { speaker: Graziella, es: "Si sta trasformando. I ragazzi lo usano per scherzare, nelle canzoni, sui social.", en: "It's changing. Young people use it for joking, in songs, on social media." }
      - { speaker: Malik, es: "Interessante. E come chiamate qui il panino rotondo? Michetta o rosetta?", en: "Interesting. And what do you call the round bread roll here? Michetta or rosetta?" }
      - { speaker: Graziella, es: "Michetta a Milano, rosetta a Roma. Qui, se vuole, lo può chiamare semplicemente pane!", en: "Michetta in Milan, rosetta in Rome. Here, if you like, you can just call it bread!" }
    questions:
      - { q: "Che cosa compra Malik?", options: ["Della caciotta e del pane", "Uno spritz e dei cicchetti", "Dello stracchino e una michetta"], answer: 0, explain: "He asks for some caciotta and some bread." }
      - { q: "Secondo Graziella, da dove vengono i dialetti?", options: ["Dall'italiano", "Dal latino", "Dal toscano moderno"], answer: 1, explain: "She says dialects are sister languages that all come from Latin, like Florentine." }
      - { q: "Con chi parla dialetto Graziella?", options: ["Con i clienti", "Con sua madre", "Con tutti, sempre"], answer: 1, explain: "She speaks dialect with her mother, not with customers, and only a little with her children." }
      - { q: "Come usano il dialetto i ragazzi, secondo Graziella?", options: ["Per scherzare e nelle canzoni", "Solo a scuola", "Non lo usano mai"], answer: 0, explain: "She says young people use it for joking, in songs and on social media." }
