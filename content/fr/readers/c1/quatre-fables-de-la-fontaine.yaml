id: r.c1.quatre-fables-de-la-fontaine
level: c1
title: Quatre fables de La Fontaine
kind: literature
author: Jean de La Fontaine (1621–1695)
source: "Fables, livre I (1668) : « La Cigale et la Fourmi » (I, 1), « Le Corbeau et le Renard » (I, 2), « Le Loup et l'Agneau » (I, 10), « Le Chêne et le Roseau » (I, 22). Domaine public. Texte intégral des quatre fables d'après l'édition du Projet Gutenberg (n° 17941) ; ponctuation légèrement normalisée, accents sur les majuscules rétablis."
intro: "Four of the best-known fables in French, quoted in full; the lines of verse are separated by a slash. The first paragraph is an editorial introduction written for this course. Watch the passé simple of the narrative (se trouva, tint, jura, répondit), the archaic forms (oût, encor, je me vas) and how the moral is stated at the beginning or the end, or simply left for you to draw."
allow: [fable, fables, humain, rage, compassion, fontaine, ésope, phèdre, dauphin, louis, xiv, caucase, sire, cigale, fourmi, corbeau, renard, agneau, roseau]
paragraphs:
  - { es: "Jean de La Fontaine publia en 1668 le premier recueil de ses Fables, qu'il dédia au Dauphin, le fils de Louis XIV. Il y reprend des histoires très anciennes, venues d'Ésope ou de Phèdre, mais il les met en vers et leur donne une vie nouvelle : chaque animal devient un caractère humain, chaque fable une petite comédie. Les quatre fables qui suivent appartiennent au livre I ; des générations d'écoliers français les ont apprises par cœur.", en: "Jean de La Fontaine published the first collection of his Fables in 1668 and dedicated it to the Dauphin, the son of Louis XIV. In it he takes up very old stories, handed down from Aesop or Phaedrus, but he puts them into verse and gives them new life: each animal becomes a human character, each fable a little comedy. The four fables that follow belong to Book I; generations of French schoolchildren have learnt them by heart." }
  - { es: "LA CIGALE ET LA FOURMI. La cigale, ayant chanté / Tout l'été, / Se trouva fort dépourvue / Quand la bise fut venue. / Pas un seul petit morceau / De mouche ou de vermisseau. / Elle alla crier famine / Chez la fourmi sa voisine, / La priant de lui prêter / Quelque grain pour subsister / Jusqu'à la saison nouvelle.", en: "THE CICADA AND THE ANT. The cicada, having sung / All summer long, / Found herself sorely in want / When the north wind had come. / Not a single little scrap / Of fly or of little worm. / She went to cry famine / At the home of the ant, her neighbour, / Begging her to lend her / A little grain to live on / Until the new season." }
  - { es: "« Je vous paierai, lui dit-elle, / Avant l'oût, foi d'animal, / Intérêt et principal. » / La fourmi n'est pas prêteuse ; / C'est là son moindre défaut. / « Que faisiez-vous au temps chaud ? / Dit-elle à cette emprunteuse. / — Nuit et jour à tout venant / Je chantais, ne vous déplaise. / — Vous chantiez ? j'en suis fort aise. / Eh bien : dansez maintenant. »", en: "'I will pay you,' she said, / 'Before harvest time, on my word as an animal, / Interest and capital.' / The ant is no lender; / That is the least of her faults. / 'What were you doing in the warm weather?' / She said to this borrower. / 'Night and day, to all comers, / I sang, if you don't mind.' / 'You sang? I'm very glad to hear it. / Well then: dance now.'" }
  - { es: "LE CORBEAU ET LE RENARD. Maître corbeau, sur un arbre perché, / Tenait en son bec un fromage. / Maître renard, par l'odeur alléché, / Lui tint à peu près ce langage : / « Hé ! bonjour, Monsieur du Corbeau. / Que vous êtes joli ! que vous me semblez beau ! / Sans mentir, si votre ramage / Se rapporte à votre plumage, / Vous êtes le phénix des hôtes de ces bois. »", en: "THE CROW AND THE FOX. Master Crow, perched in a tree, / Was holding a cheese in his beak. / Master Fox, lured by the smell, / Spoke to him more or less like this: / 'Hey! Good day, Sir Crow. / How handsome you are! How fine you look to me! / Truly, if your song / Matches your feathers, / You are the phoenix of the dwellers in these woods.'" }
  - { es: "À ces mots le corbeau ne se sent pas de joie, / Et pour montrer sa belle voix, / Il ouvre un large bec, laisse tomber sa proie. / Le renard s'en saisit et dit : « Mon bon Monsieur, / Apprenez que tout flatteur / Vit aux dépens de celui qui l'écoute : / Cette leçon vaut bien un fromage sans doute. » / Le corbeau, honteux et confus, / Jura, mais un peu tard, qu'on ne l'y prendrait plus.", en: "At these words the crow is beside himself with joy, / And to show off his fine voice, / He opens his beak wide and drops his prey. / The fox seizes it and says: 'My good Sir, / Learn that every flatterer / Lives at the expense of the one who listens to him: / This lesson is well worth a cheese, no doubt.' / The crow, ashamed and embarrassed, / Swore, but a little late, that he would not be caught that way again." }
  - { es: "LE LOUP ET L'AGNEAU. La raison du plus fort est toujours la meilleure : / Nous l'allons montrer tout à l'heure. / Un agneau se désaltérait / Dans le courant d'une onde pure. / Un loup survient à jeun, qui cherchait aventure, / Et que la faim en ces lieux attirait. / « Qui te rend si hardi de troubler mon breuvage ? / Dit cet animal plein de rage : / Tu seras châtié de ta témérité.", en: "THE WOLF AND THE LAMB. The reason of the strongest is always the best: / We shall show it in a moment. / A lamb was quenching its thirst / In the current of a clear stream. / A wolf turns up on an empty stomach, looking for adventure, / Drawn to the spot by hunger. / 'Who makes you so bold as to muddy my drink?' / Said this animal full of rage: / 'You shall be punished for your recklessness.'" }
  - { es: "— Sire, répond l'agneau, que Votre Majesté / Ne se mette pas en colère ; / Mais plutôt qu'elle considère / Que je me vas désaltérant / Dans le courant, / Plus de vingt pas au-dessous d'Elle ; / Et que par conséquent, en aucune façon, / Je ne puis troubler sa boisson. / — Tu la troubles, reprit cette bête cruelle ; / Et je sais que de moi tu médis l'an passé.", en: "'Sire,' answers the lamb, 'may Your Majesty / Not lose your temper; / But rather consider / That I am drinking / In the current / More than twenty paces below You; / And that consequently, in no way / Can I muddy your drink.' / 'You are muddying it,' replied the cruel beast; / 'And I know that you spoke ill of me last year.'" }
  - { es: "— Comment l'aurais-je fait si je n'étais pas né ? / Reprit l'agneau ; je tette encor ma mère. / — Si ce n'est toi, c'est donc ton frère. / — Je n'en ai point. — C'est donc l'un des tiens ; / Car vous ne m'épargnez guère, / Vous, vos bergers et vos chiens. / On me l'a dit : il faut que je me venge. » / Là-dessus, au fond des forêts / Le loup l'emporte et puis le mange, / Sans autre forme de procès.", en: "'How could I have done it if I wasn't born?' / Replied the lamb; 'I am still at my mother's breast.' / 'If it wasn't you, then it was your brother.' / 'I haven't got one.' 'Then it was one of your kind; / For you hardly ever spare me, / You, your shepherds and your dogs. / I've been told: I must take my revenge.' / Thereupon, deep into the forest / The wolf carries him off, and then eats him, / Without any further trial." }
  - { es: "LE CHÊNE ET LE ROSEAU. Le chêne un jour dit au roseau : / « Vous avez bien sujet d'accuser la nature ; / Un roitelet pour vous est un pesant fardeau ; / Le moindre vent qui d'aventure / Fait rider la face de l'eau / Vous oblige à baisser la tête, / Cependant que mon front, au Caucase pareil, / Non content d'arrêter les rayons du soleil, / Brave l'effort de la tempête. / Tout vous est aquilon, tout me semble zéphyr.", en: "THE OAK AND THE REED. The oak one day said to the reed: / 'You have good reason to blame nature; / A wren is a heavy burden for you; / The slightest wind that by chance / Ripples the face of the water / Forces you to bow your head, / While my brow, like the Caucasus, / Not content with stopping the rays of the sun, / Defies the force of the storm. / Everything is a north wind to you, everything seems a gentle breeze to me." }
  - { es: "Encor si vous naissiez à l'abri du feuillage / Dont je couvre le voisinage, / Vous n'auriez pas tant à souffrir : / Je vous défendrai de l'orage ; / Mais vous naissez le plus souvent / Sur les humides bords des royaumes du vent. / La nature envers vous me semble bien injuste. / — Votre compassion, lui répondit l'arbuste, / Part d'un bon naturel ; mais quittez ce souci : / Les vents me sont moins qu'à vous redoutables ; / Je plie, et ne romps pas.", en: "If only you grew in the shelter of the leaves / With which I cover the neighbourhood, / You would not have so much to suffer: / I would protect you from the storm; / But you grow, most often, / On the damp banks of the kingdoms of the wind. / Nature seems very unjust to you.' / 'Your pity,' the shrub replied, / 'Comes from a kind heart; but put aside this worry: / The winds are less fearsome to me than to you; / I bend, and do not break." }
  - { es: "Vous avez jusqu'ici / Contre leurs coups épouvantables / Résisté sans courber le dos ; / Mais attendons la fin. » Comme il disait ces mots, / Du bout de l'horizon accourt avec furie / Le plus terrible des enfants / Que le nord eût porté jusque-là dans ses flancs. / L'arbre tient bon ; le roseau plie. / Le vent redouble ses efforts, / Et fait si bien qu'il déracine / Celui de qui la tête au ciel était voisine, / Et dont les pieds touchaient à l'empire des morts.", en: "Until now you have / Withstood their terrible blows / Without bending your back; / But let us wait for the end.' As he was saying these words, / From the far edge of the horizon there rushes furiously / The most terrible of the children / The north had ever carried in its womb. / The tree holds firm; the reed bends. / The wind redoubles its efforts, / And does so well that it uproots / The one whose head was neighbour to the sky, / And whose feet reached down to the kingdom of the dead." }
questions:
  - { q: "Que demande la cigale à la fourmi ?", options: ["De lui apprendre à chanter", "De lui prêter un peu de grain jusqu'au printemps", "De l'inviter à danser"], answer: 1, explain: "She begs her «de lui prêter / Quelque grain pour subsister / Jusqu'à la saison nouvelle» and promises to pay it back with interest." }
  - { q: "Comment le renard obtient-il le fromage ?", options: ["Il le vole pendant que le corbeau dort", "Il flatte le corbeau, qui ouvre le bec pour chanter", "Il l'achète au corbeau"], answer: 1, explain: "The fox praises his feathers and voice; to show off «sa belle voix», the crow opens his beak and drops the cheese." }
  - { q: "Où se trouve la morale dans « Le Loup et l'Agneau » ?", options: ["Au début de la fable", "À la fin de la fable", "Il n'y a pas de morale"], answer: 0, explain: "The fable opens with its moral: «La raison du plus fort est toujours la meilleure», and the story then 'shows' it." }
  - { q: "Pourquoi l'agneau ne peut-il pas avoir troublé l'eau du loup ?", options: ["Parce qu'il boit plus de vingt pas plus bas que lui", "Parce qu'il ne boit jamais", "Parce que l'eau était déjà sale"], answer: 0, explain: "The water flows from the wolf to the lamb: he drinks «Plus de vingt pas au-dessous d'Elle», so he cannot muddy the wolf's drink." }
  - { q: "Que veut dire le roseau par « Je plie, et ne romps pas » ?", options: ["Qu'il est plus fort que le vent", "Qu'il se courbe devant le vent mais ne se casse pas", "Qu'il a peur du chêne"], answer: 1, explain: "plier = to bend, rompre = to break: his weakness (flexibility) saves him, while the proud oak is uprooted." }
  - { q: "Dans « Le Corbeau et le Renard », quel temps verbal raconte la chute de l'histoire (« qu'on ne l'y prendrait plus ») ?", options: ["Le futur simple", "Le conditionnel, futur dans le passé après « jura »", "Le subjonctif imparfait"], answer: 1, explain: "After a past main verb (jura, passé simple of jurer), the future becomes a conditional: «on ne l'y prendra plus» → «qu'on ne l'y prendrait plus»." }
