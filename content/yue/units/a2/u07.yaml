      - { es: "又係，噉我哋聽日先去啦。", en: "That's true, so let's go tomorrow instead.", altEs: ["又係喎，噉我哋聽日先去啦。", "又係，噉聽日先去啦。"], altEn: ["Good point, let's go tomorrow then."], grammar: [g.laa1-suggestion], vocab: [w.jau6-hai6, w.gam2, w.ting1-jat6] }
      - { es: "係就係好靚，不過太多人喇。", en: "It's pretty, sure, but there are too many people now.", altEs: ["係就係好靚，但係太多人喇。"], altEn: ["It's beautiful all right, but it's too crowded now."], grammar: [g.laa3-change], vocab: [w.hai6-zau6-hai6, w.leng3, w.bat1-gwo3] }
      - { es: "係啦，所以話早啲嚟好啲。", en: "Exactly, that's why I said it's better to come early.", altEs: ["係啦，所以話早啲嚟好啲㗎。", "所以話早啲嚟好啲。"], altEn: ["Right, that's why coming early is better."], grammar: [g.jan-wai-so-ji], vocab: [w.hai6-laa1, w.so2-ji5-waa6, w.zou2-di1] }
      - { es: "我幫你影相。", en: "I'll take a photo for you.", altEs: ["我同你影相。"], grammar: [g.bong-help], vocab: [w.bong1, w.jing2-soeng2], transform: { instruction: "Make it a warm offer with 吖", answer: "我幫你影相吖。", alt: ["等我幫你影相吖。", "我幫你影張相吖。"], en: "Let me take a photo for you." } }
      - { es: "你試吓。", en: "You try it.", altEs: ["你試吓啦。"], grammar: [g.haa-briefly], vocab: [w.si3], transform: { instruction: "Make it a gentle suggestion with 吖", answer: "你試吓吖。", alt: ["你試吓呢個吖。"], en: "Why don't you give it a try?" } }
      - { es: "你去唔去呀？", en: "Are you going?", altEs: ["你去唔去？"], altEn: ["Are you coming?"], grammar: [g.a-not-a-questions, g.aa1-offer], vocab: [w.heoi3], error: { wrong: "你去唔去吖？", explain: "吖 (aa1) is for offers and agreeing, never for questions; a question ends with 呀 (aa3).", grammar: g.aa1-offer } }
    exchanges:
      - q: { es: "聽日一齊去南蓮園池好唔好？", en: "Shall we go to Nan Lian Garden together tomorrow?" }
        a: { es: "好吖！幾點等呀？", en: "Sure! What time shall we meet?" }
        alt: ["好呀！", "好吖，幾點呀？", "好吖！"]
