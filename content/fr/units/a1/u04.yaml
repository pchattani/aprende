      - { es: "C'est un vieux café, mais avec toi, c'est le plus joli café de Paris.", en: "It's an old café, but with you it's the prettiest café in Paris.", grammar: [g.c-est-il-est], vocab: [w.café, w.vieux, w.joli] }
