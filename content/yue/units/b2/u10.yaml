id: b2.u10
title: 大嶼山大佛
lessons:
  - id: b2.u10.l1
    title: 好似一座山咁大
    teach: [g.hou-ci-seem]
    vocab: [w.daai6-jyu4-saan1, w.tin1-taan4-daai6-fat6, w.daai6-fat6, w.fat6.b, w.zyun1, w.fat6-zoeng6, w.ngong4-ping4, w.bou2-lin4-zi6, w.tai2-hei2-lai4, w.fong2-fat1, w.ngoi6-biu2, w.joeng2, w.joeng6-maau6, w.jan3-zoeng6, w.zong1-jim4, w.zong3-gun1, w.san4-bei3, w.ging2, w.cyun4-ging2, w.ging2-gun1]
    tip: "好似 is the everyday 'seem / be like / as if' (add 噉 at the end for 'as if'); 似乎 is more formal; sense verb + 落 (睇落, 聽落) means 'looks / sounds'."
    sentences:
      - { es: "天壇大佛好似一座山咁大。", en: "The Big Buddha is as big as a mountain.", altEs: ["天壇大佛大到好似一座山噉。", "大佛好似一座山咁大。"], grammar: [g.hou-ci-seem], vocab: [w.tin1-taan4-daai6-fat6, w.hou2-ci5] }
      - { es: "嗰尊佛像好莊嚴，令人唔敢大聲講嘢。", en: "That Buddha statue is so solemn that people don't dare speak loudly.", altEs: ["嗰尊佛像好莊嚴，令人唔敢大聲講話。"], grammar: [g.hou-ci-seem, g.causatives-ling-gaau-dou], vocab: [w.zyun1, w.fat6-zoeng6, w.zong1-jim4] }
      - { es: "天好似就嚟落雨，我哋快啲上昂坪啦。", en: "It looks like it's about to rain; let's hurry up to Ngong Ping.", altEs: ["個天好似就嚟落雨，我哋快啲上昂坪啦。"], grammar: [g.hou-ci-seem], vocab: [w.ngong4-ping4, w.lok6-jyu5] }
      - { es: "嗰度好似有間寺廟，我哋行過去睇吓。", en: "There seems to be a temple over there; let's walk over and have a look.", altEs: ["嗰邊好似有間寺廟，我哋行過去睇吓。"], grammar: [g.hou-ci-seem], vocab: [w.zi6-miu2] }
      - { es: "佢好似唔開心，成日都唔講嘢。", en: "She seems unhappy; she hardly says a word.", altEs: ["佢好似唔係好開心，成日都唔講嘢。"], altEn: ["He seems unhappy; he hardly says a word."], grammar: [g.hou-ci-seem], vocab: [w.hou2-ci5], error: { wrong: "佢好似好唔開心，好似成日都唔講嘢。", explain: "One 好似 is enough to mean 'seems'; repeating it makes the sentence clumsy and changes nothing.", grammar: g.hou-ci-seem } }
      - { es: "呢個計劃聽落幾好，不過要睇吓成本。", en: "This plan sounds quite good, but we need to look at the cost.", altEs: ["呢個計劃聽落都幾好，不過要睇吓成本。"], grammar: [g.hou-ci-seem], vocab: [w.teng1-lok6, w.sing4-bun2] }
      - { es: "呢間齋舖啲菜睇落好好食。", jp: "ni1 gaan1 zaai1 pou3 di1 coi3 tai2 lok6 hou2 hou2 sik6", en: "The dishes at this vegetarian restaurant look delicious.", altEs: ["呢間齋舖啲餸睇落好好食。"], grammar: [g.hou-ci-seem], vocab: [w.tai2-lok6, w.zaai1] }
      - { es: "佢講得好似好容易噉，其實好難。", en: "He makes it sound so easy, but actually it's very hard.", altEs: ["佢講到好似好容易噉，其實好難。"], altEn: ["She makes it sound so easy, but actually it's very hard."], grammar: [g.hou-ci-seem, g.gam3-vs-gam2], vocab: [w.hou2-ci5] }
      - { es: "企喺大佛腳下，我覺得自己好似一粒沙噉。", en: "Standing at the Big Buddha's feet, I feel like a grain of sand.", altEs: ["企喺大佛下面，我覺得自己好似一粒沙噉。"], grammar: [g.hou-ci-seem], vocab: [w.daai6-fat6] }
      - { es: "情況似乎有改善，遊客多咗好多。", en: "The situation seems to have improved; there are many more tourists.", altEs: ["情況似乎改善咗，遊客多咗好多。"], grammar: [g.hou-ci-seem], vocab: [w.ci5-fu4, w.goi2-sin6], transform: { instruction: "Say it the everyday way with 好似", answer: "情況好似好咗，遊客多咗好多。", alt: ["情況好似有改善，遊客多咗好多。", "情況好似好咗啲，遊客多咗好多。"] } }
      - { es: "霧大嘅時候，昂坪睇起嚟好神秘。", en: "When the fog is thick, Ngong Ping looks very mysterious.", altEs: ["大霧嘅時候，昂坪睇起嚟好神秘。"], grammar: [g.hou-ci-seem], vocab: [w.tai2-hei2-lai4, w.san4-bei3, w.mou6] }
      - { es: "坐纜車上山，成個大嶼山嘅景觀好壯觀。", en: "Riding the cable car up the mountain, the views across Lantau are spectacular.", altEs: ["坐纜車上去，成個大嶼山嘅景觀好壯觀。"], grammar: [g.hou-ci-seem], vocab: [w.laam6-ce1, w.daai6-jyu4-saan1, w.ging2-gun1, w.zong3-gun1] }
      - { es: "行上二百六十八級樓梯，先見到大佛嘅全景。", en: "Only after climbing two hundred and sixty-eight steps do you see the whole Buddha.", altEs: ["行完二百六十八級樓梯，先見到大佛嘅全景。"], jp: "haang4 soeng5 ji6 baak3 luk6 sap6 baat3 kap1 lau4 tai1 sin1 gin3 dou2 daai6 fat6 ge3 cyun4 ging2", grammar: [g.hou-ci-seem, g.zi-jau-sin-only-if], vocab: [w.cyun4-ging2, w.lau4-tai1] }
      - { es: "寶蓮寺嘅外表好鮮艷，入面就好安靜。", en: "Po Lin Monastery looks very colourful from the outside, but inside it's very quiet.", altEs: ["寶蓮寺外表好鮮艷，入面就好安靜。"], grammar: [g.hou-ci-seem], vocab: [w.bou2-lin4-zi6, w.ngoi6-biu2, w.on1-zing6] }
      - { es: "佢個樣好似佢媽媽，連笑都一樣。", en: "She looks like her mum; even her smile is the same.", altEs: ["佢個樣似佢媽媽，連笑都一樣。"], altEn: ["He looks like his mum; even his smile is the same."], grammar: [g.hou-ci-seem], vocab: [w.joeng2, w.ci5], transform: { instruction: "Say she looks like her dad (爸爸) instead", answer: "佢個樣好似佢爸爸，連笑都一樣。", alt: ["佢個樣似佢爸爸，連笑都一樣。"] } }
      - { es: "我第一次見大佛嘅印象好深，彷彿佢望住我噉。", en: "My first impression of the Big Buddha was very strong; it was as if it was looking at me.", altEs: ["我第一次見大佛印象好深，好似佢望住我噉。"], grammar: [g.hou-ci-seem], vocab: [w.jan3-zoeng6, w.fong2-fat1] }
    exchanges:
      - q: { es: "天壇大佛有幾大？", en: "How big is the Big Buddha?" }
        a: { es: "好大，連底座有三十四米高，好似一座細山噉。", en: "Huge: thirty-four metres high including the base, like a small hill." }
        alt: ["三十四米高。", "好大，好似座山噉。"]
        grammar: [g.hou-ci-seem, g.jau-gei-how]
        vocab: [w.tin1-taan4-daai6-fat6]
      - q: { es: "你睇佢係咪唔舒服？", en: "Do you think he's unwell?" }
        a: { es: "好似係，佢面色好差。", en: "It looks like it; he's very pale." }
        alt: ["好似係呀。", "睇落好似唔舒服。"]
        grammar: [g.hou-ci-seem]
        vocab: [w.hou2-ci5]
      - q: { es: "我哋今晚去食齋好唔好？", en: "Shall we go for vegetarian food tonight?" }
        a: { es: "聽落幾好，去寶蓮寺嗰間啦。", en: "Sounds good; let's go to the one at Po Lin Monastery." }
        alt: ["聽落唔錯。", "好呀，聽落幾好。"]
        grammar: [g.hou-ci-seem]
        vocab: [w.teng1-lok6, w.bou2-lin4-zi6]
      - q: { es: "你對昂坪有咩印象？", en: "What's your impression of Ngong Ping?" }
        a: { es: "好壯觀，不過遊客多過旺角。", en: "Spectacular, but there are more tourists than in Mong Kok." }
        alt: ["好壯觀。", "景觀好靚，人就太多。"]
        grammar: [g.hou-ci-seem]
        vocab: [w.jan3-zoeng6, w.zong3-gun1]
      - q: { es: "嗰個男仔係咪你細佬？", en: "Is that boy your younger brother?" }
        a: { es: "唔係呀，不過個樣真係有啲似。", en: "No, but he does look a bit like him." }
        alt: ["唔係，只係似啫。", "唔係，樣貌有啲似。"]
        grammar: [g.hou-ci-seem]
        vocab: [w.joeng6-maau6, w.ci5]
    texts:
      - title: "昂坪遊記"
        es: ["我哋由東涌坐纜車上昂坪，一路嘅景觀都好壯觀。", "落車嗰陣起霧，成個大佛睇起嚟好神秘。", "去到大佛腳下，我彷彿聽到有人念經。"]
        en: ["We took the cable car from Tung Chung up to Ngong Ping, and the views all the way were spectacular.", "When we got off the fog rolled in, and the whole Buddha looked very mysterious.", "When I reached the Buddha's feet, I seemed to hear someone chanting."]
        grammar: [g.hou-ci-seem]
        vocab: [w.ging2-gun1, w.tai2-hei2-lai4, w.fong2-fat1]
      - title: "相片說明"
        es: ["天壇大佛，一九九三年開光。", "呢個角度影到佛像嘅全景，好似佢喺雲入面噉。"]
        en: ["The Big Buddha, consecrated in 1993.", "This angle captures the whole statue, as if it's sitting in the clouds."]
        grammar: [g.hou-ci-seem]
        vocab: [w.cyun4-ging2, w.fat6-zoeng6]
    spicy:
      - { es: "你今晚靚到好似明星噉，我都唔敢望你。", en: "You look like a film star tonight; I hardly dare look at you.", altEs: ["你今晚靚到好似明星噉，我唔敢望你。"], jp: "nei5 gam1 maan5 leng3 dou3 hou2 ci5 ming4 sing1 gam2 ngo5 dou1 m4 gam2 mong6 nei5", grammar: [g.hou-ci-seem, g.dou-extent], vocab: [w.hou2-ci5, w.ming4-sing1] }
      - { es: "你個樣好似我下一個男朋友。", en: "You look like my next boyfriend.", altEs: ["你個樣好似我下個男朋友。"], grammar: [g.hou-ci-seem], vocab: [w.joeng2] }
      - { es: "我哋拖住手行，彷彿成個昂坪得返我哋兩個。", en: "Walking hand in hand, it was as if the whole of Ngong Ping belonged to just the two of us.", altEs: ["我哋拖住手行，好似成個昂坪得返我哋兩個噉。"], grammar: [g.hou-ci-seem], vocab: [w.fong2-fat1, w.ngong4-ping4] }
      - { es: "你外表好嚴肅，其實心好軟，係咪？", en: "You look cold on the outside, but you're actually a softie, aren't you?", altEs: ["你外表好冷淡，其實心好軟，係咪呀？"], grammar: [g.hou-ci-seem], vocab: [w.ngoi6-biu2] }
      - { es: "你對我嘅第一印象係乜？我希望係「好似有啲危險」。", en: "What was your first impression of me? I hope it was 'seems a bit dangerous'.", altEs: ["你對我第一印象係咩？我希望係「好似有啲危險」。"], grammar: [g.hou-ci-seem], vocab: [w.jan3-zoeng6] }
  - id: b2.u10.l2
    title: 只有親身去先感受到
    teach: [g.zi-jau-sin-only-if]
    vocab: [w.pou4-saat3, w.gun1-jam1, w.zi6.b, w.zi6-miu2, w.baai3-fat6, w.nim6-ging1, w.ging1.b, w.sim4, w.zing6-co5, w.ming4-soeng2, w.sam1-ling4, w.seon3-joeng5, w.sau1-hang4, w.kau4, w.ling4.b, w.waan4-san4, w.wai4-jau5, w.can1-san1, w.tai2-jim6, w.gam2-sau6, w.sau1-wok6]
    tip: "只有 + the ONLY condition, then 先 (or 先至) before the verb of the result: 只有佢先知. Compare 只要…就… 'as long as': any of the conditions is enough."
    sentences:
      - { es: "只有坐纜車先睇到呢個景。", jp: "zi2 jau5 co5 laam6 ce1 sin1 tai2 dou2 ni1 go3 ging2", en: "Only by cable car can you see this view.", altEs: ["要坐纜車先睇到呢個景。", "只有坐纜車先至睇到呢個景。"], grammar: [g.zi-jau-sin-only-if], vocab: [w.zi2-jau5, w.ging2], error: { wrong: "只有坐纜車就睇到呢個景。", explain: "The result after 只有 takes 先, not 就: 只有…先….", grammar: g.zi-jau-sin-only-if } }
      - { es: "只有親身去先感受到嗰種寧靜。", en: "Only by going in person can you feel that kind of peace.", altEs: ["只有親身去過先感受到嗰種寧靜。"], grammar: [g.zi-jau-sin-only-if], vocab: [w.can1-san1, w.gam2-sau6, w.ning4-zing6] }
      - { es: "要預約先可以喺寺入面住一晚。", en: "You can only stay overnight in the monastery if you book.", altEs: ["要預約先至可以喺寺入面住一晚。"], grammar: [g.zi-jau-sin-only-if], vocab: [w.jyu6-joek3, w.zi6.b] }
      - { es: "只有佢先知個密碼。", en: "Only he knows the password.", altEs: ["淨係佢先知個密碼。"], altEn: ["Only she knows the password."], grammar: [g.zi-jau-sin-only-if], vocab: [w.zi2-jau5], error: { wrong: "只有佢知先個密碼。", explain: "先 goes before the verb: 只有佢先知, not 只有佢知先.", grammar: g.zi-jau-sin-only-if } }
      - { es: "好多人嚟寶蓮寺拜佛，求身體健康。", en: "Many people come to Po Lin Monastery to worship the Buddha and pray for good health.", altEs: ["好多人嚟寶蓮寺拜佛，求個身體健康。"], grammar: [g.zi-jau-sin-only-if], vocab: [w.baai3-fat6, w.kau4], transform: { instruction: "Say that only the elderly (老人家) come to pray, using 只有…先…", answer: "只有老人家先會嚟寶蓮寺拜佛。", alt: ["只有老人家先嚟寶蓮寺拜佛。"] } }
      - { es: "啲和尚每朝四點幾就起身念經。", en: "The monks get up every morning just after four to chant sutras.", altEs: ["啲和尚每日朝早四點幾就起身念經。"], grammar: [g.zi-jau-sin-only-if], vocab: [w.wo4-soeng2, w.nim6-ging1] }
      - { es: "觀音係一位菩薩，好多香港人都拜佢。", en: "Guanyin is a bodhisattva, and many Hongkongers worship her.", altEs: ["觀音係菩薩，好多香港人都拜佢。"], grammar: [g.zi-jau-sin-only-if], vocab: [w.gun1-jam1, w.pou4-saat3, w.baai3] }
      - { es: "我阿媽話呢間廟好靈，求咩得咩。", jp: "ngo5 aa3 maa1 waa6 ni1 gaan1 miu2 hou2 ling4 kau4 me1 dak1 me1", en: "My mum says this temple really works: whatever you pray for, you get.", altEs: ["我媽媽話呢間廟好靈，求咩得咩。"], grammar: [g.zi-jau-sin-only-if], vocab: [w.ling4.b, w.kau4, w.miu2] }
      - { es: "佢個願望實現咗，所以返嚟還神。", en: "Her wish came true, so she came back to give thanks to the gods.", altEs: ["佢嘅願望實現咗，所以返嚟還神。"], altEn: ["His wish came true, so he came back to give thanks to the gods."], grammar: [g.zi-jau-sin-only-if], vocab: [w.waan4-san4] }
      - { es: "只有每日靜坐，心靈先會平靜落嚟。", en: "Only by meditating every day will your mind calm down.", altEs: ["只有日日靜坐，心靈先會平靜落嚟。"], grammar: [g.zi-jau-sin-only-if], vocab: [w.zing6-co5, w.sam1-ling4, w.ping4-zing6], transform: { instruction: "Say it with colloquial 要…先… instead of 只有", answer: "要每日靜坐，心靈先會平靜落嚟。", alt: ["要日日靜坐，心靈先會平靜落嚟。"] } }
      - { es: "冥想唔一定要喺寺廟，喺屋企都得。", en: "You don't have to meditate in a temple; you can do it at home too.", altEs: ["冥想唔一定要喺寺廟做，喺屋企都得。"], grammar: [g.zi-jau-sin-only-if], vocab: [w.ming4-soeng2, w.zi6-miu2] }
      - { es: "禪嘅意思唔係乜都唔諗，而係專心做好眼前嘅事。", en: "Zen doesn't mean thinking about nothing; it means focusing on doing what's in front of you well.", altEs: ["禪唔係乜都唔諗，而係專心做好眼前嘅事。"], grammar: [g.zi-jau-sin-only-if], vocab: [w.sim4] }
      - { es: "佢冇宗教信仰，不過好尊重人哋嘅信仰。", en: "She has no religious faith, but she really respects other people's beliefs.", altEs: ["佢冇宗教信仰，但係好尊重其他人嘅信仰。"], altEn: ["He has no religious faith, but he really respects other people's beliefs."], grammar: [g.zi-jau-sin-only-if], vocab: [w.seon3-joeng5, w.zyun1-zung6] }
      - { es: "佢喺寺入面修行咗十年，先返嚟城市。", en: "He practised in the monastery for ten years before he came back to the city.", altEs: ["佢喺寺廟修行咗十年先返嚟城市。"], grammar: [g.zi-jau-sin-only-if], vocab: [w.sau1-hang4] }
      - { es: "尾班纜車走咗，我哋唯有行落山。", en: "The last cable car has gone, so we'll have to walk down the mountain.", altEs: ["尾班纜車走咗，我哋唯有行路落山。"], grammar: [g.zi-jau-sin-only-if], vocab: [w.wai4-jau5, w.laam6-ce1] }
      - { es: "喺寺廟住咗一個禮拜，我嘅收穫好大。", en: "I gained a lot from staying in the monastery for a week.", altEs: ["喺寺廟住咗一個星期，我嘅收穫好大。"], grammar: [g.zi-jau-sin-only-if], vocab: [w.sau1-wok6, w.tai2-jim6] }
    exchanges:
      - q: { es: "幾時先有纜車落山？", en: "When is there a cable car down the mountain?" }
        a: { es: "只有六點之前先有，之後要坐巴士。", en: "Only until six; after that you have to take the bus." }
        alt: ["六點之前先有。", "要六點前，之後坐巴士。"]
        grammar: [g.zi-jau-sin-only-if]
        vocab: [w.zi2-jau5, w.laam6-ce1]
      - q: { es: "你點解要專登去寺廟住？", en: "Why go out of your way to stay in a monastery?" }
        a: { es: "想親身體驗吓和尚嘅生活。", en: "I want to experience a monk's life first-hand." }
        alt: ["想體驗吓。", "想靜吓，冥想吓。"]
        grammar: [g.zi-jau-sin-only-if]
        vocab: [w.can1-san1, w.tai2-jim6]
      - q: { es: "呢間廟靈唔靈㗎？", en: "Does this temple really answer prayers?" }
        a: { es: "好靈呀，我去年求姻緣，今年就拍拖喇。", en: "It really does. Last year I prayed for love, and this year I'm dating." }
        alt: ["好靈。", "我阿媽話好靈。"]
        grammar: [g.zi-jau-sin-only-if]
        vocab: [w.ling4.b, w.kau4]
      - q: { es: "你有冇宗教信仰？", en: "Do you have a religious faith?" }
        a: { es: "我信佛，不過只有心情唔好嗰陣先去寺廟靜坐。", en: "I'm a Buddhist, but I only go and meditate in a temple when I'm feeling down." }
        alt: ["冇呀。", "我信佛。", "冇，不過我鍾意喺寺廟靜坐。"]
        grammar: [g.zi-jau-sin-only-if]
        vocab: [w.seon3-joeng5, w.fat6.b, w.zing6-co5]
      - q: { es: "冥想有咩好處？", en: "What are the benefits of meditation?" }
        a: { es: "要堅持先感受到，心情會平靜好多。", en: "You only feel them if you keep at it; your mood gets much calmer." }
        alt: ["令人平靜啲。", "可以放鬆心靈。"]
        grammar: [g.zi-jau-sin-only-if]
        vocab: [w.ming4-soeng2, w.gam2-sau6]
    texts:
      - title: "寶蓮寺告示"
        es: ["寺內請保持安靜。", "只有登記咗嘅訪客先可以入去禪堂。", "多謝大家，阿彌陀佛。"]
        en: ["Please keep quiet inside the monastery.", "Only registered visitors may enter the meditation hall.", "Thank you all, Amitabha."]
        grammar: [g.zi-jau-sin-only-if]
        vocab: [w.zi6.b, w.sim4]
      - title: "禪修營感受"
        es: ["三日入面，我哋每朝靜坐，又跟住師父讀經。", "第一日好辛苦，第三日先開始覺得心靈平靜。", "只有親身體驗過，先明白呢種收穫。"]
        en: ["For three days we meditated every morning and chanted with the master.", "The first day was tough; only by the third day did I begin to feel inner peace.", "Only by experiencing it yourself can you understand what you gain."]
        grammar: [g.zi-jau-sin-only-if]
        vocab: [w.zing6-co5, w.ging1.b, w.tai2-jim6, w.sau1-wok6]
    spicy:
      - { es: "只有你先明我。", en: "Only you understand me.", altEs: ["淨係你先明我。", "只有你先至明白我。"], grammar: [g.zi-jau-sin-only-if], vocab: [w.zi2-jau5] }
      - { es: "我嚟寺廟求姻緣，點知一出門口就見到你。", en: "I came to the temple to pray for love, and the moment I stepped out I saw you.", altEs: ["我嚟寺廟求姻緣，點知一出門就見到你。"], grammar: [g.zi-jau-sin-only-if], vocab: [w.kau4, w.zi6-miu2] }
      - { es: "呢間廟咁靈，我要返嚟還神，多謝佢畀咗你我。", jp: "ni1 gaan1 miu2 gam3 ling4 ngo5 jiu3 faan1 lai4 waan4 san4 do1 ze6 keoi5 bei2 zo2 nei5 ngo5", en: "This temple is so effective I have to come back and give thanks for being given you.", altEs: ["呢間廟咁靈，我要返嚟還神，多謝佢將你畀咗我。"], grammar: [g.zi-jau-sin-only-if], vocab: [w.ling4.b, w.waan4-san4] }
      - { es: "要請我食齋先，我先考慮同你拍拖。", jp: "jiu3 ceng2 ngo5 sik6 zaai1 sin1 ngo5 sin1 haau2 leoi6 tung4 nei5 paak3 to1", en: "Treat me to a vegetarian meal first, then I'll consider going out with you.", altEs: ["你要請我食齋先，我先考慮同你拍拖。"], grammar: [g.zi-jau-sin-only-if], vocab: [w.sik6-zaai1, w.haau2-leoi6] }
      - { es: "我同你一齊冥想，但係我閂埋眼都係見到你。", en: "I meditate with you, but even with my eyes closed I see you.", altEs: ["我同你一齊冥想，不過閂埋眼都係見到你。"], grammar: [g.zi-jau-sin-only-if], vocab: [w.ming4-soeng2] }
  - id: b2.u10.l3
    title: 漁村變成旅遊區
    teach: [g.bin-sing-become]
    vocab: [w.bin3-dak1, w.zim6-zim6, w.zuk6-zim6, w.bin3-faa3, w.gin3-sing4, w.seoi2-hoeng1, w.paang4-uk1, w.daai6-ou3, w.dung1-cung1, w.baak6-hoi2-tyun4, w.seoi2-ngau4, w.wong4-ngau4, w.dou6-gaa3-cyun1, w.dou6-gaa3, w.leoi5-jau4, w.on1-zing6, w.ping4-zing6, w.sam1-cing4, w.si1-gaa1-ce1, w.gou1-ji5-fu1-kau4-ce1]
    tip: "變成 + noun 'turn into', 變得 + adjective 'become (more) …', 變咗 'has changed'. For simple changes, adjective + 咗 is the most natural: 貴咗, 瘦咗."
    sentences:
      - { es: "大澳由漁村變成咗旅遊區。", en: "Tai O has turned from a fishing village into a tourist area.", altEs: ["大澳由一條漁村變成咗旅遊區。"], grammar: [g.bin-sing-become], vocab: [w.daai6-ou3, w.bin3-sing4], error: { wrong: "大澳由漁村變得咗旅遊區。", explain: "Before a noun (旅遊區) use 變成; 變得 is for adjectives.", grammar: g.bin-sing-become } }
      - { es: "佢退休之後變得好開朗。", en: "She's become very cheerful since retiring.", altEs: ["佢退休之後變得開朗咗好多。"], altEn: ["He's become very cheerful since retiring."], grammar: [g.bin-sing-become], vocab: [w.bin3-dak1, w.hoi1-long5], transform: { instruction: "Say it with the colloquial 'adjective + 咗'", answer: "佢退休之後開朗咗好多。", alt: ["佢退休之後開朗咗。"] } }
      - { es: "東涌同二十年前比，變咗好多。", en: "Tung Chung has changed a lot compared with twenty years ago.", altEs: ["東涌同廿年前比，變咗好多。", "同二十年前比，東涌變咗好多。"], grammar: [g.bin-sing-become], vocab: [w.dung1-cung1] }
      - { es: "東涌以前得幾條村，而家變成咗新市鎮。", en: "Tung Chung used to be just a few villages; now it's a new town.", altEs: ["東涌以前得幾條村，而家變咗新市鎮。"], grammar: [g.bin-sing-become], vocab: [w.dung1-cung1, w.ji5-cin4] }
      - { es: "愉景灣冇私家車，居民去邊度都坐巴士或者揸高爾夫球車。", en: "Discovery Bay has no private cars; residents get around by bus or golf cart.", altEs: ["愉景灣唔准私家車，居民出入坐巴士或者揸高爾夫球車。"], grammar: [g.bin-sing-become], vocab: [w.si1-gaa1-ce1, w.gou1-ji5-fu1-kau4-ce1, w.baa1-si2] }
      - { es: "愉景灣八十年代初先開始有人住，而家變得好熱鬧。", en: "People only started living in Discovery Bay in the early eighties, and now it's become very lively.", altEs: ["愉景灣八十年代初先有人住，而家變得好熱鬧。"], grammar: [g.bin-sing-become, g.zi-jau-sin-only-if], vocab: [w.bin3-dak1, w.nin4-doi6, w.jit6-naau6] }
      - { es: "大澳啲棚屋起喺水上面，好有水鄉特色。", en: "Tai O's stilt houses are built over the water, very much a waterside village.", altEs: ["大澳啲棚屋喺水上面，好有水鄉特色。"], grammar: [g.bin-sing-become], vocab: [w.paang4-uk1, w.seoi2-hoeng1] }
      - { es: "啲白海豚越嚟越少，好難先見到一條。", en: "There are fewer and fewer white dolphins; it's hard to see even one.", altEs: ["白海豚越嚟越少，好難先見到一條。"], grammar: [g.bin-sing-become], vocab: [w.baak6-hoi2-tyun4, w.jyut6-lai4-jyut6] }
      - { es: "梅窩路邊經常見到水牛，佢哋以前係幫人耕田嘅。", en: "You often see water buffalo by the road in Mui Wo; they used to plough the farmers' fields.", altEs: ["喺梅窩路邊成日見到水牛，佢哋以前幫農民耕田。"], grammar: [g.bin-sing-become], vocab: [w.seoi2-ngau4] }
      - { es: "南大嶼山有好多黃牛，佢哋已經變成咗街坊。", en: "South Lantau has lots of cattle; they've become part of the neighbourhood.", altEs: ["南大嶼山有好多黃牛，已經變咗街坊。"], grammar: [g.bin-sing-become], vocab: [w.wong4-ngau4, w.gaai1-fong1] }
      - { es: "個天漸漸變黑，我哋要落山喇。", en: "The sky is gradually getting dark; we need to head down the mountain.", altEs: ["個天慢慢變黑，我哋要落山喇。"], grammar: [g.bin-sing-become], vocab: [w.zim6-zim6, w.bin3, w.hak1] }
      - { es: "啲居民逐漸習慣咗旅遊業帶嚟嘅變化。", en: "The residents have gradually got used to the changes tourism has brought.", altEs: ["居民逐漸習慣咗旅遊業帶嚟嘅變化。"], grammar: [g.bin-sing-become], vocab: [w.zuk6-zim6, w.zaap6-gwaan3.b, w.bin3-faa3] }
      - { es: "新嘅度假村前年先建成。", en: "The new resort was only completed the year before last.", altEs: ["新嘅度假村前年先起好。"], grammar: [g.bin-sing-become, g.zi-jau-sin-only-if], vocab: [w.dou6-gaa3-cyun1, w.gin3-sing4] }
      - { es: "我哋去大嶼山度假，心情變得好平靜。", en: "We went to Lantau on holiday and our mood became very calm.", altEs: ["我哋去大嶼山度假，心情平靜咗好多。"], grammar: [g.bin-sing-become], vocab: [w.dou6-gaa3, w.sam1-cing4, w.ping4-zing6] }
      - { es: "嚟咗大嶼山之後，佢變得好放鬆。", en: "Since coming to Lantau, she's become very relaxed.", altEs: ["嚟咗大嶼山之後，佢放鬆咗好多。"], altEn: ["Since coming to Lantau, he's become very relaxed."], grammar: [g.bin-sing-become], vocab: [w.bin3-dak1, w.fong3-sung1], transform: { instruction: "Say instead that she's become very quiet (安靜)", answer: "嚟咗大嶼山之後，佢變得好安靜。", alt: ["嚟咗大嶼山之後，佢安靜咗好多。"] } }
      - { es: "啲嘢貴咗好多，旅遊嘅人都少咗。", en: "Things have got a lot more expensive, and fewer people travel.", altEs: ["啲嘢貴咗好多，去旅遊嘅人都少咗。"], grammar: [g.bin-sing-become], vocab: [w.leoi5-jau4] }
    exchanges:
      - q: { es: "你覺得大澳變咗好多嗎？", en: "Do you think Tai O has changed a lot?" }
        a: { es: "變咗好多，以前好安靜，而家週末成日都好多人。", en: "Hugely. It used to be very quiet; now at weekends it's always crowded." }
        alt: ["變咗好多。", "熱鬧咗好多。"]
        grammar: [g.bin-sing-become]
        vocab: [w.daai6-ou3, w.on1-zing6]
      - q: { es: "嗰啲棚屋而家仲有冇人住？", en: "Do people still live in those stilt houses?" }
        a: { es: "有，不過有啲已經變成咗民宿同咖啡店。", en: "Yes, but some have already turned into guesthouses and cafés." }
        alt: ["有，有啲變咗民宿。", "仲有人住。"]
        grammar: [g.bin-sing-become]
        vocab: [w.paang4-uk1, w.bin3-sing4]
      - q: { es: "愉景灣有冇私家車？", en: "Are there private cars in Discovery Bay?" }
        a: { es: "冇，居民多數坐巴士，或者揸高爾夫球車。", en: "No, residents mostly take the bus or drive golf carts." }
        alt: ["冇呀，唔准私家車。", "冇，坐巴士或者渡輪。"]
        grammar: [g.bin-sing-become]
        vocab: [w.si1-gaa1-ce1, w.gou1-ji5-fu1-kau4-ce1]
      - q: { es: "你最近心情點呀？", en: "How's your mood lately?" }
        a: { es: "好咗好多，搬咗嚟大嶼山之後變得好平靜。", en: "Much better; since moving to Lantau I've become very calm." }
        alt: ["好咗好多。", "平靜咗好多。"]
        grammar: [g.bin-sing-become]
        vocab: [w.sam1-cing4, w.bin3-dak1]
    texts:
      - title: "大澳今昔"
        es: ["五十年前，大澳係一條好安靜嘅漁村。", "後來漁業衰落，好多年輕人搬咗去市區。", "而家大澳變成咗旅遊熱點，週末成日逼滿遊客。"]
        en: ["Fifty years ago, Tai O was a very quiet fishing village.", "Later the fishing industry declined and many young people moved to the city.", "Now Tai O has become a tourist hotspot, packed with visitors at weekends."]
        grammar: [g.bin-sing-become]
        vocab: [w.daai6-ou3, w.on1-zing6, w.bin3-sing4]
      - title: "愉景灣居民嘅話"
        es: ["我九十年代搬嚟愉景灣，嗰陣仲好靜。", "而家多咗好多餐廳同商店，變得方便好多。", "不過冇私家車，呢樣一直冇變過。"]
        en: ["I moved to Discovery Bay in the nineties, when it was still very quiet.", "Now there are many more restaurants and shops, and it's become much more convenient.", "But the no-private-cars rule has never changed."]
        grammar: [g.bin-sing-become]
        vocab: [w.bin3-dak1, w.si1-gaa1-ce1]
    spicy:
      - { es: "識咗你之後，我變得好鍾意照鏡。", en: "Since meeting you, I've become very fond of looking in the mirror.", altEs: ["識咗你之後，我變到好鍾意照鏡。"], grammar: [g.bin-sing-become], vocab: [w.bin3-dak1] }
      - { es: "你一笑，我個心就變成咗棉花糖。", en: "When you smile, my heart turns into candyfloss.", altEs: ["你一笑，我個心就變咗棉花糖。"], grammar: [g.bin-sing-become], vocab: [w.bin3-sing4] }
      - { es: "我哋由朋友漸漸變成情侶，連我阿媽都知。", en: "We gradually went from friends to a couple; even my mum could tell.", altEs: ["我哋由朋友慢慢變成情侶，連我媽媽都睇得出。"], grammar: [g.bin-sing-become], vocab: [w.zim6-zim6, w.cing4-leoi5] }
      - { es: "揸高爾夫球車送你返屋企，係咪好浪漫？", en: "Driving you home in a golf cart: pretty romantic, isn't it?", altEs: ["揸高爾夫球車送你返去，係咪好浪漫呀？"], grammar: [g.bin-sing-become], vocab: [w.gou1-ji5-fu1-kau4-ce1] }
      - { es: "嚟大嶼山度假之後，你變得更加靚，定係我變得更加鍾意你？", en: "Since our holiday on Lantau, have you got even prettier, or have I just got even more into you?", altEs: ["嚟大嶼山度假之後，你靚咗，定係我更加鍾意你？"], grammar: [g.bin-sing-become], vocab: [w.dou6-gaa3, w.bin3-dak1] }
  - id: b2.u10.l4
    title: 有緣自然會再見
    teach: [g.hou-ci-seem, g.bin-sing-become]
    vocab: [w.jan1-gwo2, w.ming6-wan6, w.jyun4-fan6, w.jau5-jyun4, w.naan4-mong4, w.dak1-dou2, w.jau4-laam5, w.hang4-cing4, w.jat1-jat6-jau4, w.cing4-zeoi6]
    tip: "Talk about fate, change and first impressions together: 好似…噉 for comparisons, 變成 / 變得 for how things (and people) turn out."
    sentences:
      - { es: "我哋喺纜車上面識，好似命運安排噉。", en: "We met on the cable car; it was as if fate arranged it.", altEs: ["我哋喺纜車度識，好似命運安排噉。"], jp: "ngo5 dei6 hai2 laam6 ce1 soeng6 min6 sik1 hou2 ci5 ming6 wan6 on1 paai4 gam2", grammar: [g.hou-ci-seem], vocab: [w.ming6-wan6, w.hou2-ci5] }
      - { es: "佢相信因果，成日話做好事會有好報。", en: "She believes in karma and always says good deeds are rewarded.", altEs: ["佢信因果，成日話做好事會有好報。"], altEn: ["He believes in karma and always says good deeds are rewarded."], grammar: [g.hou-ci-seem], vocab: [w.jan1-gwo2, w.soeng1-seon3] }
      - { es: "兩個人可以喺咁多人入面遇到，真係講緣分。", en: "For two people to meet among so many, it really is down to fate.", altEs: ["兩個人喺咁多人入面遇到，真係講緣分。"], grammar: [g.hou-ci-seem], vocab: [w.jyun4-fan6, w.jyu6-dou2] }
      - { es: "有緣嘅話，我哋自然會再見。", en: "If we're meant to be, we'll naturally meet again.", altEs: ["有緣就自然會再見。"], grammar: [g.hou-ci-seem], vocab: [w.jau5-jyun4] }
      - { es: "嗰次大嶼山一日遊真係好難忘。", en: "That day trip to Lantau was truly unforgettable.", altEs: ["嗰次嘅大嶼山一日遊好難忘。"], grammar: [g.hou-ci-seem], vocab: [w.jat1-jat6-jau4, w.naan4-mong4] }
      - { es: "我哋嘅行程好緊，朝早去大澳，下晝上昂坪。", en: "Our itinerary is tight: Tai O in the morning, Ngong Ping in the afternoon.", altEs: ["我哋行程好緊，朝早去大澳，下晝上昂坪。"], jp: "ngo5 dei6 ge3 hang4 cing4 hou2 gan2 ziu1 zou2 heoi3 daai6 ou3 haa6 zau3 soeng5 ngong4 ping4", grammar: [g.hou-ci-seem], vocab: [w.hang4-cing4, w.daai6-ou3, w.ngong4-ping4] }
      - { es: "遊覽完寶蓮寺，我哋去食齋。", en: "After touring Po Lin Monastery, we went for a vegetarian meal.", altEs: ["遊覽完寶蓮寺之後，我哋去食齋。"], grammar: [g.hou-ci-seem], vocab: [w.jau4-laam5, w.sik6-zaai1] }
      - { es: "呢次旅行令我得到好多，唔單止係相片。", en: "This trip gave me a lot, not just photos.", altEs: ["呢次旅行令我得到好多嘢，唔單止係相片。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.dak1-dou2, w.m4-daan1-zi2] }
      - { es: "申請入住寺廟嘅程序好簡單，網上登記就得。", en: "The procedure for applying to stay at the monastery is very simple; just register online.", altEs: ["申請喺寺廟住嘅程序好簡單，網上登記就得。"], grammar: [g.hou-ci-seem], vocab: [w.cing4-zeoi6, w.gaan2-daan1] }
      - { es: "佢好似變咗另一個人噉，成個人開朗晒。", en: "It's as if he's become a different person; he's completely cheerful now.", altEs: ["佢好似變咗第二個人噉，成個人開朗晒。"], altEn: ["It's as if she's become a different person; she's completely cheerful now."], grammar: [g.hou-ci-seem, g.bin-sing-become], vocab: [w.hou2-ci5, w.bin3] }
      - { es: "十年冇見，你個樣冇點變，似乎仲後生咗。", en: "Ten years without seeing you, and you've hardly changed; you even seem younger.", altEs: ["十年冇見，你個樣冇變過，好似仲後生咗。"], grammar: [g.hou-ci-seem, g.bin-sing-become], vocab: [w.ci5-fu4, w.hau6-saang1], transform: { instruction: "Say it about him (佢) instead of you", answer: "十年冇見，佢個樣冇點變，似乎仲後生咗。", alt: ["十年冇見，佢個樣冇變過，好似仲後生咗。"] } }
      - { es: "我覺得命運係自己創造嘅，唔係天註定。", en: "I think fate is something you create yourself, not something heaven decides.", altEs: ["我覺得命運係靠自己創造，唔係天註定。"], grammar: [g.hou-ci-seem], vocab: [w.ming6-wan6, w.cong3-zou6] }
      - { es: "我哋本來唔識，後來變成咗好朋友。", en: "We didn't know each other at first, and later became good friends.", altEs: ["我哋本來唔識，之後變咗好朋友。"], grammar: [g.bin-sing-become], vocab: [w.bin3-sing4], error: { wrong: "我哋本來唔識，後來變得咗好朋友。", explain: "好朋友 is a noun, so use 變成, not 變得.", grammar: g.bin-sing-become } }
      - { es: "喺山頂睇日出，成個天由黑變紅，好似一幅畫噉。", en: "Watching the sunrise from the summit, the sky turned from black to red, like a painting.", altEs: ["喺山頂睇日出，個天由黑變紅，好似一幅畫噉。"], grammar: [g.hou-ci-seem, g.bin-sing-become], vocab: [w.jat6-ceot1, w.saan1-deng2, w.bin3] }
      - { es: "鳳凰山日出嘅景色，令人一世難忘。", en: "The sunrise view from Lantau Peak is something you'll never forget.", altEs: ["鳳凰山日出嘅景色令人終生難忘。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.naan4-mong4] }
      - { es: "佢話我哋有緣，我話不如叫做有因果。", en: "He says we're destined to meet; I say let's call it cause and effect.", altEs: ["佢話我哋有緣，我話不如話有因果。"], grammar: [g.hou-ci-seem], vocab: [w.jau5-jyun4, w.jan1-gwo2], transform: { instruction: "Report it as a question: does he say we're destined to meet?", answer: "佢係咪話我哋有緣？", alt: ["佢話唔話我哋有緣？"] } }
    exchanges:
      - q: { es: "你哋點識㗎？", en: "How did you two meet?" }
        a: { es: "喺大佛腳下影相，佢叫我幫手，好似緣分噉。", en: "Taking photos at the foot of the Big Buddha; she asked me to help. It was like fate." }
        alt: ["喺昂坪識㗎。", "講緣分囉。"]
        grammar: [g.hou-ci-seem]
        vocab: [w.jyun4-fan6]
      - q: { es: "你信唔信命運？", en: "Do you believe in fate?" }
        a: { es: "一半一半，我覺得努力可以改變命運。", en: "Half and half; I think hard work can change your fate." }
        alt: ["唔信。", "信少少。"]
        grammar: [g.bin-sing-become]
        vocab: [w.ming6-wan6, w.goi2-bin3]
      - q: { es: "大嶼山一日遊點樣安排行程好？", en: "How should I plan a day trip on Lantau?" }
        a: { es: "朝早坐纜車上昂坪，下晝去大澳睇棚屋，夜晚喺梅窩食飯。", en: "Cable car up to Ngong Ping in the morning, Tai O in the afternoon for the stilt houses, dinner in Mui Wo." }
        alt: ["先去昂坪，再去大澳。", "朝早昂坪，下晝大澳。"]
        grammar: [g.hou-ci-seem]
        vocab: [w.hang4-cing4, w.jat1-jat6-jau4]
      - q: { es: "呢次旅行你最難忘係乜嘢？", en: "What was most unforgettable on this trip?" }
        a: { es: "喺鳳凰山睇日出，好似發夢噉。", en: "Watching the sunrise on Lantau Peak, it was like a dream." }
        alt: ["睇日出。", "大佛，好壯觀。"]
        grammar: [g.hou-ci-seem]
        vocab: [w.naan4-mong4, w.faat3-mung6]
    texts:
      - title: "旅遊網站評語"
        es: ["呢個大嶼山一日遊嘅行程安排得好好。", "導遊好有耐性，講解大佛同寶蓮寺嘅歷史，好似講故事噉。", "最難忘係喺大澳見到白海豚，真係有緣。"]
        en: ["This Lantau day trip itinerary was very well organised.", "The guide was very patient and explained the history of the Big Buddha and Po Lin Monastery like telling a story.", "The most unforgettable moment was seeing white dolphins at Tai O; we were truly lucky."]
        grammar: [g.hou-ci-seem]
        vocab: [w.jat1-jat6-jau4, w.hang4-cing4, w.naan4-mong4, w.jau5-jyun4]
      - title: "明信片"
        es: ["我喺愉景灣住咗一個月，成個人變得好放鬆。", "呢度冇車，好似另一個世界噉。"]
        en: ["I've been living in Discovery Bay for a month, and I've become totally relaxed.", "There are no cars here; it's like another world."]
        grammar: [g.hou-ci-seem, g.bin-sing-become]
        vocab: [w.bin3-dak1]
    spicy:
      - { es: "我哋咁有緣，不如交換電話先？", en: "We're so clearly meant to be; why don't we swap numbers first?", altEs: ["我哋咁有緣，不如交換個電話先？"], grammar: [g.hou-ci-seem], vocab: [w.jau5-jyun4] }
      - { es: "遇到你係我嘅命運，定係我嘅好運？", en: "Is meeting you my fate, or my good luck?", altEs: ["識到你係我嘅命運，定係我好運？"], grammar: [g.hou-ci-seem], vocab: [w.ming6-wan6, w.hou2-wan6] }
      - { es: "同你嘅第一次約會好難忘，因為你跌咗落海。", en: "Our first date was unforgettable, because you fell into the sea.", altEs: ["同你第一次約會好難忘，因為你跌咗落水。"], grammar: [g.hou-ci-seem], vocab: [w.naan4-mong4, w.joek3-wui6] }
      - { es: "你成日遲到，我哋嘅緣分係咪就係等？", en: "You're always late; is our destiny simply waiting?", altEs: ["你成日遲到，我哋嘅緣分係咪就係等你？"], grammar: [g.hou-ci-seem], vocab: [w.jyun4-fan6] }
      - { es: "我今晚嘅行程得一項：同你食飯。", jp: "ngo5 gam1 maan5 ge3 hang4 cing4 dak1 jat1 hong6 tung4 nei5 sik6 faan6", en: "My itinerary tonight has only one item: dinner with you.", altEs: ["我今晚嘅行程得一樣嘢：同你食飯。"], grammar: [g.hou-ci-seem], vocab: [w.hang4-cing4, w.hong6] }
dialogues:
  - id: b2.u10.d1
    title: 纜車上面
    context: Miss Leung and Mr Chow end up sharing a cable car cabin from Tung Chung to Ngong Ping.
    lines:
      - { speaker: 梁小姐, es: "嘩，你睇，下面啲山好似綠色地氈噉。", en: "Wow, look, the hills down there are like a green carpet." }
      - { speaker: 周生, es: "係呀。我細個嚟過一次，嗰陣東涌仲係幾條村，而家變成咗新市鎮。", en: "Yes. I came once as a kid; Tung Chung was just a few villages then, and now it's become a new town." }
      - { speaker: 梁小姐, es: "我第一次嚟。聽講大佛好大，係咪真係好似一座山噉？", en: "It's my first time. I hear the Buddha is huge; is it really like a mountain?" }
      - { speaker: 周生, es: "差唔多。不過只有行上二百六十八級樓梯，先睇到佢個樣。", en: "Pretty much. But only by climbing the two hundred and sixty-eight steps do you get to see its face." }
      - { speaker: 梁小姐, es: "二百幾級？聽落好攰。", en: "Over two hundred steps? That sounds exhausting." }
      - { speaker: 周生, es: "慢慢行就得。行上去之後，個心會變得好平靜。", en: "Just take it slowly. Once you get up there, your heart becomes very calm." }
      - { speaker: 梁小姐, es: "睇嚟你好熟呢度。你係咪住大嶼山㗎？", en: "Looks like you know this place well. Do you live on Lantau?" }
      - { speaker: 周生, es: "我住愉景灣，嗰度冇私家車，好似另一個世界噉。", en: "I live in Discovery Bay. There are no private cars there; it's like another world." }
      - { speaker: 梁小姐, es: "咁啱嘅？我下個月就搬去愉景灣。", en: "What a coincidence! I'm moving to Discovery Bay next month." }
      - { speaker: 周生, es: "咁真係有緣喇。到時我帶你周圍行吓。", en: "Then we really are fated to meet. I'll show you around then." }
    questions:
      - { q: "東涌以前係點樣？", options: ["一個新市鎮", "幾條村", "一個度假村"], answer: 1, explain: "周生 says Tung Chung used to be just a few villages (仲係幾條村) and has become a new town." }
      - { q: "點樣先睇到大佛個樣？", options: ["坐纜車", "行上二百六十八級樓梯", "喺寶蓮寺食齋"], answer: 1, explain: "只有行上二百六十八級樓梯，先睇到佢個樣: only by climbing the steps." }
      - { q: "周生住喺邊度？", options: ["東涌", "大澳", "愉景灣"], answer: 2, explain: "He lives in Discovery Bay (我住愉景灣), where there are no private cars." }
      - { q: "點解周生話佢哋「有緣」？", options: ["佢哋細個識", "梁小姐下個月搬去愉景灣", "佢哋一齊食齋"], answer: 1, explain: "Miss Leung is moving to Discovery Bay next month, where he lives." }
