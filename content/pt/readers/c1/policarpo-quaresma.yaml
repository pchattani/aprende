id: r.c1.policarpo-quaresma
level: c1
title: "O major Quaresma e o tupi"
kind: literature
author: Lima Barreto (1881–1922)
source: "Triste Fim de Policarpo Quaresma (1911 em folhetim; 1915 em livro), primeira parte, capítulos I e VI (excertos), incluindo o requerimento ao Congresso. Ortografia atualizada; cortes marcados com (…). Domínio público."
intro: "Policarpo Quaresma, a clockwork-punctual civil servant in a Rio suburb, is a patriot so sincere that he petitions Congress to make Tupi the official language of Brazil. Lima Barreto's satire is gentle with the man and merciless with the society that mocks him. The petition is a perfect parody of legal register: suplicante, pede vênia, P. e E. deferimento (see the C1 unit on legal language)."
allow: [lima, barreto, policarpo, quaresma, major, arsenal, guerra, januário, cláudio, alice, segadas, tupi-guarani, tupi, congresso, congressistas, câmara, senado]
paragraphs:
  - { es: "Como de hábito, Policarpo Quaresma, mais conhecido por Major Quaresma, bateu em casa às quatro e quinze da tarde. Havia mais de vinte anos que isso acontecia. Saindo do Arsenal de Guerra, onde era subsecretário, bongava pelas confeitarias algumas frutas, comprava um queijo, às vezes, e sempre o pão da padaria francesa.", en: "As usual, Policarpo Quaresma, better known as Major Quaresma, arrived home at a quarter past four in the afternoon. This had been happening for more than twenty years. Leaving the War Arsenal, where he was deputy secretary, he would pick up some fruit at the confectioners', buy a cheese now and then, and always the bread from the French bakery." }
  - { es: "Não gastava nesses passos nem mesmo uma hora, de forma que, às três e quarenta, por aí assim, tomava o bonde, sem erro de um minuto, ia pisar a soleira da porta de sua casa, numa rua afastada de São Januário, bem exatamente às quatro e quinze, como se fosse a aparição de um astro, um eclipse, enfim um fenômeno matematicamente determinado, previsto e predito.", en: "He did not spend even an hour on these errands, so that at about twenty to four he would take the tram, without a minute's error, and set foot on the threshold of his house, in an out-of-the-way street in São Januário, at exactly a quarter past four, as if it were the appearance of a star, an eclipse — in short, a mathematically determined phenomenon, foreseen and foretold." }
  - { es: "A vizinhança já lhe conhecia os hábitos e tanto que, na casa do Capitão Cláudio, onde era costume jantar-se aí pelas quatro e meia, logo que o viam passar, a dona gritava à criada: “Alice, olha que são horas; o Major Quaresma já passou.” E era assim todos os dias, há quase trinta anos.", en: "The neighbours knew his habits so well that, in Captain Cláudio's house, where dinner was usually served at around half past four, as soon as they saw him go by, the lady of the house would shout to the maid: 'Alice, it's time; Major Quaresma has already gone past.' And it was like that every day, for almost thirty years." }
  - { es: "Vivendo em casa própria e tendo outros rendimentos além do seu ordenado, o Major Quaresma podia levar um trem de vida superior aos seus recursos burocráticos, gozando, por parte da vizinhança, da consideração e respeito de homem abastado. Não recebia ninguém, vivia num isolamento monacal, embora fosse cortês com os vizinhos que o julgavam esquisito e misantropo. Se não tinha amigos na redondeza, não tinha inimigos, e a única desafeição que merecera, fora a do doutor Segadas, um clínico afamado no lugar, que não podia admitir que Quaresma tivesse livros: “Se não era formado, para quê? Pedantismo!” O subsecretário não mostrava os livros a ninguém, mas acontecia que, quando se abriam as janelas da sala de sua livraria, da rua poder-se-iam ver as estantes pejadas de cima a baixo. (…)", en: "Living in his own house and having other income besides his salary, Major Quaresma could afford a style of living above his bureaucrat's means, enjoying among the neighbours the regard and respect due to a well-off man. He received no one and lived in monastic isolation, though he was courteous to the neighbours, who thought him odd and misanthropic. If he had no friends in the neighbourhood, he had no enemies either, and the only ill will he had earned was that of Doctor Segadas, a physician of local renown, who could not accept that Quaresma should own books: 'If he had no degree, what for? Pedantry!' The deputy secretary showed his books to no one, but it happened that, when the windows of his library were opened, the shelves could be seen from the street, crammed from top to bottom. (…)" }
  - { es: "Policarpo era patriota. Desde moço, aí pelos vinte anos, o amor da pátria tomou-o todo inteiro. Não fora o amor comum, palrador e vazio; fora um sentimento sério, grave e absorvente. Nada de ambições políticas ou administrativas; o que Quaresma pensou, ou melhor: o que o patriotismo o fez pensar, foi num conhecimento inteiro do Brasil, levando-o a meditações sobre os seus recursos, para depois então apontar os remédios, as medidas progressivas, com pleno conhecimento de causa. (…)", en: "Policarpo was a patriot. From his youth, at about twenty, love of his country had taken hold of him entirely. It had not been the common love, chattering and empty; it had been a serious, grave, absorbing feeling. No political or administrative ambitions; what Quaresma thought of — or rather, what patriotism made him think of — was a complete knowledge of Brazil, leading him to reflect on its resources, so as then to point out the remedies, the progressive measures, with full knowledge of the facts. (…)" }
  - { es: "“Policarpo Quaresma, cidadão brasileiro, funcionário público, certo de que a língua portuguesa é emprestada ao Brasil; certo também de que, por esse fato, o falar e o escrever em geral, sobretudo no campo das letras, se veem na humilhante contingência de sofrer continuamente censuras ásperas dos proprietários da língua; sabendo, além, que, dentro do nosso país, os autores e os escritores, com especialidade os gramáticos, não se entendem no tocante à correção gramatical, vendo-se, diariamente, surgir azedas polêmicas entre os mais profundos estudiosos do nosso idioma — usando do direito que lhe confere a Constituição, vem pedir que o Congresso Nacional decrete o tupi-guarani como língua oficial e nacional do povo brasileiro.", en: "'Policarpo Quaresma, Brazilian citizen, civil servant, certain that the Portuguese language is on loan to Brazil; certain also that, for this reason, speech and writing in general, above all in the field of letters, find themselves in the humiliating position of continually suffering harsh rebukes from the owners of the language; knowing, furthermore, that within our own country authors and writers, especially the grammarians, cannot agree in matters of grammatical correctness, so that bitter controversies arise daily among the most learned scholars of our language — exercising the right conferred on him by the Constitution, hereby requests that the National Congress decree Tupi-Guarani the official and national language of the Brazilian people." }
  - { es: "O suplicante, deixando de parte os argumentos históricos que militam em favor de sua ideia, pede vênia para lembrar que a língua é a mais alta manifestação da inteligência de um povo, é a sua criação mais viva e original; e, portanto, a emancipação política do país requer como complemento e consequência a sua emancipação idiomática.", en: "The petitioner, leaving aside the historical arguments in favour of his idea, begs leave to point out that language is the highest expression of a people's intelligence, its most living and original creation; and that, therefore, the political emancipation of the country requires, as its complement and consequence, its linguistic emancipation." }
  - { es: "Demais, Senhores Congressistas, o tupi-guarani, língua originalíssima, aglutinante, é verdade, mas a que o polissintetismo dá múltiplas feições de riqueza, é a única capaz de traduzir as nossas belezas, de pôr-nos em relação com a nossa natureza e adaptar-se perfeitamente aos nossos órgãos vocais e cerebrais, por ser criação de povos que aqui viveram e ainda vivem. (…) Seguro de que a sabedoria dos legisladores saberá encontrar meios para realizar semelhante medida e cônscio de que a Câmara e o Senado pesarão o seu alcance e utilidade, P. e E. deferimento.”", en: "Furthermore, Honourable Members of Congress, Tupi-Guarani, a most original language — agglutinative, it is true, but one to which polysynthesis gives many forms of richness — is the only one capable of expressing our beauties, of putting us in touch with our nature and of adapting perfectly to our vocal and mental organs, being the creation of peoples who lived and still live here. (…) Confident that the wisdom of the legislators will find the means to carry out such a measure, and aware that the Chamber and the Senate will weigh its scope and usefulness, he awaits a favourable decision.'" }
questions:
  - { q: "Por que os vizinhos usavam o major Quaresma como relógio?", options: ["Porque ele vendia relógios", "Porque ele tocava um sino", "Porque ele chegava em casa todos os dias exatamente às quatro e quinze", "Porque ele trabalhava na estação"], answer: 2, explain: "His arrival was as predictable as an eclipse: in Captain Cláudio's house, seeing him pass meant it was time for dinner." }
  - { q: "Como era o patriotismo de Quaresma?", options: ["Sério, grave e absorvente, voltado para conhecer o Brasil por inteiro", "Comum, palrador e vazio", "Ligado a ambições políticas", "Fingido, para ganhar dinheiro"], answer: 0, explain: "The narrator stresses that it was not the usual empty patriotism but a serious feeling that drove him to study the whole country." }
  - { q: "O que Quaresma pede ao Congresso?", options: ["Um aumento de salário", "Que o tupi-guarani seja decretado língua oficial do Brasil", "Que o português seja ensinado nas escolas", "Que se construa uma biblioteca"], answer: 1, explain: "His famous requerimento asks Congress to decree Tupi-Guarani the official and national language." }
  - { q: "Qual argumento ele usa para justificar o pedido?", options: ["Que o tupi é mais fácil que o português", "Que os portugueses querem o tupi", "Que a independência política exige também uma emancipação da língua", "Que o tupi é falado na Europa"], answer: 2, explain: "Language is 'a mais alta manifestação da inteligência de um povo', so political emancipation requires linguistic emancipation." }
  - { q: "Que traço do registro jurídico aparece no requerimento?", options: ["Gírias e expressões informais", "Fórmulas como “o suplicante”, “pede vênia” e “P. e E. deferimento”", "Frases curtas e diretas", "Perguntas ao leitor"], answer: 1, explain: "The petition uses the fixed formulas of official requests: third-person self-reference (o suplicante), 'pede vênia' (begs leave) and 'P. e E. deferimento' (Pede e Espera deferimento = requests and awaits approval)." }
