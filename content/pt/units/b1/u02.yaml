id: b1.u02
title: Que bom que você veio!
lessons:
  - id: b1.u02.l1
    title: Que bom que você veio!
    teach: [g.subjunctive-emotion]
    vocab: [w.alegrar-se, w.lamentar, w.surpreender, w.surpresa, w.surpreso, w.chocado, w.emocionado, w.emoção, w.alegria, w.tristeza, w.alívio, w.aliviado, w.decepção, w.gratidão, w.grato, w.meus-pêsames, w.boas-festas, w.bom-apetite, w.visitante, w.abraçar-forte]
    tip: "Reacting to someone else's action takes the subjunctive: Fico feliz que você esteja aqui. With a past fact, speech often keeps the indicative: Que bom que você veio!"
    sentences:
      - { es: "Que bom que você veio!", en: "I'm so glad you came!", altEs: ["Que bom que você tenha vindo!", "Ainda bem que você veio!"], altEn: ["How nice that you came!"], grammar: [g.subjunctive-emotion], vocab: [], note: "With a past fact, everyday speech uses the indicative (veio); the careful form is que você tenha vindo." }
      - { es: "Fico feliz que você esteja aqui em Ouro Preto.", en: "I'm glad you're here in Ouro Preto.", altEs: ["Fico contente que você esteja aqui em Ouro Preto.", "Fico feliz que você esteja aqui."], grammar: [g.subjunctive-emotion, g.subjunctive-irregular], vocab: [], transform: { instruction: "Change você to vocês", answer: "Fico feliz que vocês estejam aqui em Ouro Preto.", alt: ["Fico contente que vocês estejam aqui em Ouro Preto."], en: "I'm glad you're (all) here in Ouro Preto." }, error: { wrong: "Fico feliz que você está aqui em Ouro Preto.", explain: "Fico feliz que reacts to someone else's situation, so it takes the subjunctive: esteja.", grammar: g.subjunctive-emotion } }
      - { es: "Que pena que a mina esteja fechada hoje.", en: "What a shame the mine is closed today.", altEs: ["É uma pena que a mina esteja fechada hoje."], grammar: [g.subjunctive-emotion], vocab: [], note: "Gold-mine tours, such as the Mina da Passagem near Ouro Preto, are a classic outing." }
      - { es: "Estou surpresa que a cidade tenha tantas igrejas.", en: "I'm surprised the town has so many churches.", altEs: ["Estou surpreso que a cidade tenha tantas igrejas."], grammar: [g.subjunctive-emotion], vocab: [w.surpreso] }
      - { es: "Lamento que você não possa ficar para o Festival de Inverno.", en: "I'm sorry you can't stay for the Winter Festival.", altEs: ["Que pena que você não possa ficar para o Festival de Inverno."], grammar: [g.subjunctive-emotion], vocab: [w.lamentar] }
      - { es: "Eu me alegro que vocês gostem da cidade.", en: "I'm glad you like the town.", altEs: ["Me alegro que vocês gostem da cidade.", "Fico feliz que vocês gostem da cidade."], grammar: [g.subjunctive-emotion], vocab: [w.alegrar-se], variant: "In Portugal: Alegro-me que gostem da cidade." }
      - { es: "Me surpreende que a cidade seja tão fria em julho.", en: "It surprises me that the town is so cold in July.", altEs: ["Me surpreende que Ouro Preto seja tão fria em julho."], grammar: [g.subjunctive-emotion, g.subjunctive-irregular], vocab: [w.surpreender] }
      - { es: "Que surpresa boa! Fico muito feliz que você me visite.", en: "What a lovely surprise! I'm really glad you're visiting me.", altEs: ["Que boa surpresa! Fico muito feliz que você me visite."], grammar: [g.subjunctive-emotion], vocab: [w.surpresa] }
      - { es: "Ela ficou emocionada com a música dentro da igreja.", en: "She was moved by the music inside the church.", grammar: [g.ficar-change-of-state], vocab: [w.emocionado] }
      - { es: "Que alívio! Ainda bem que você achou o passaporte.", en: "What a relief! Thank goodness you found your passport.", altEs: ["Que alívio! Ainda bem que você encontrou o passaporte."], grammar: [g.subjunctive-emotion], vocab: [w.alívio], note: "Ainda bem que is always followed by the indicative." }
      - { es: "Fico aliviado que vocês estejam bem depois do acidente.", en: "I'm relieved you're all right after the accident.", altEs: ["Fico aliviada que vocês estejam bem depois do acidente."], grammar: [g.subjunctive-emotion], vocab: [w.aliviado] }
      - { es: "Tenho medo que os visitantes caiam nas ladeiras molhadas.", en: "I'm afraid the visitors will fall on the wet slopes.", altEs: ["Tenho medo de que os visitantes caiam nas ladeiras molhadas."], grammar: [g.subjunctive-emotion], vocab: [w.visitante], transform: { instruction: "Make it 'I'm afraid of falling' (one subject)", answer: "Tenho medo de cair nas ladeiras molhadas.", en: "I'm afraid of falling on the wet slopes." } }
      - { es: "Para mim, é uma decepção que você não venha à festa.", en: "For me, it's a disappointment that you're not coming to the party.", grammar: [g.subjunctive-emotion], vocab: [w.decepção] }
      - { es: "Meus pêsames. Lamento muito que você tenha perdido o seu avô.", en: "My condolences. I'm so sorry you lost your grandfather.", altEs: ["Meus pêsames. Sinto muito pelo seu avô."], grammar: [g.subjunctive-emotion], vocab: [w.meus-pêsames, w.lamentar] }
      - { es: "Boas festas! Que alegria que a gente passe o Natal junto.", en: "Season's greetings! What a joy that we're spending Christmas together.", altEs: ["Boas festas! Fico feliz que a gente passe o Natal junto."], grammar: [g.subjunctive-emotion, g.a-gente], vocab: [w.boas-festas, w.alegria] }
      - { es: "Estou muito grata a vocês: que bom que me receberam tão bem.", en: "I'm very grateful to you: I'm so glad you welcomed me so warmly.", altEs: ["Estou muito grato a vocês: que bom que me receberam tão bem."], grammar: [g.subjunctive-emotion], vocab: [w.grato] }
    exchanges:
      - q: { es: "Cheguei! Desculpa o atraso.", en: "I'm here! Sorry I'm late." }
        a: { es: "Que bom que você veio! Entra, está frio.", en: "So glad you came! Come in, it's cold." }
        alt: ["Que bom que você chegou!", "Ainda bem que você chegou!"]
        grammar: [g.subjunctive-emotion]
        vocab: []
      - q: { es: "Não vou poder ir ao festival.", en: "I won't be able to go to the festival." }
        a: { es: "Que pena que você não possa ir!", en: "What a shame you can't go!" }
        alt: ["Que pena!", "É uma pena que você não possa ir."]
        grammar: [g.subjunctive-emotion]
        vocab: []
      - q: { es: "Passei no vestibular!", en: "I passed the entrance exam!" }
        a: { es: "Que alegria! Fico muito feliz que você tenha passado.", en: "How wonderful! I'm so happy you passed." }
        alt: ["Parabéns! Que bom!", "Que notícia boa!"]
        grammar: [g.subjunctive-emotion]
        vocab: [w.alegria]
      - q: { es: "Meu avô morreu ontem.", en: "My grandfather died yesterday." }
        a: { es: "Meus pêsames. Lamento muito.", en: "My condolences. I'm so sorry." }
        alt: ["Sinto muito.", "Meus pêsames."]
        grammar: []
        vocab: [w.meus-pêsames, w.lamentar]
      - q: { es: "O jantar está na mesa. Bom apetite!", en: "Dinner's on the table. Enjoy your meal!" }
        a: { es: "Que delícia! Fico feliz que você tenha cozinhado para mim.", en: "How delicious! I'm glad you cooked for me." }
        alt: ["Obrigado, igualmente!", "Bom apetite!"]
        grammar: [g.subjunctive-emotion]
        vocab: [w.bom-apetite]
      - q: { es: "Como você se sentiu na Igreja de São Francisco?", en: "How did you feel in the Church of Saint Francis?" }
        a: { es: "Fiquei chocada com tanta beleza. Foi uma emoção enorme.", en: "I was stunned by so much beauty. It was hugely moving." }
        alt: ["Fiquei muito emocionada.", "Foi uma emoção."]
        grammar: [g.ficar-change-of-state]
        vocab: [w.chocado, w.emoção]
    texts:
      - title: "Mensagem para a Cida"
        es: ["Cida, que bom que você me recebeu em Ouro Preto!", "Fiquei emocionado com as igrejas e com a sua cidade.", "Que pena que eu tenha que voltar tão cedo."]
        en: ["Cida, I'm so glad you had me to stay in Ouro Preto!", "I was moved by the churches and by your town.", "What a shame I have to go back so soon."]
        grammar: [g.subjunctive-emotion]
        vocab: [w.emocionado]
      - title: "Cartão de boas festas"
        es: ["Boas festas, querida família!", "Lamento que a gente não possa passar o Natal junto este ano.", "Mas fico feliz que todos estejam bem. Um abraço forte!"]
        en: ["Season's greetings, dear family!", "I'm sorry we can't spend Christmas together this year.", "But I'm glad everyone's well. A big hug!"]
        grammar: [g.subjunctive-emotion]
        vocab: [w.boas-festas, w.lamentar, w.abraçar-forte]
    spicy:
      - { es: "Que bom que você veio… e que veio sozinho.", en: "I'm so glad you came… and that you came alone.", altEs: ["Que bom que você veio… e que veio sozinha."], grammar: [g.subjunctive-emotion], vocab: [] }
      - { es: "Fico feliz que você goste de arte barroca; eu também sou uma obra de arte.", en: "I'm glad you like Baroque art; I'm a work of art too.", grammar: [g.subjunctive-emotion], vocab: [] }
      - { es: "Que pena que o hotel esteja cheio… mas o meu sofá é muito confortável.", en: "What a shame the hotel is full… but my sofa is very comfortable.", grammar: [g.subjunctive-emotion], vocab: [] }
      - { es: "Me surpreende que ninguém tenha te convidado para dançar ainda. Posso?", en: "I'm surprised nobody has asked you to dance yet. May I?", grammar: [g.subjunctive-emotion], vocab: [w.surpreender] }
      - { es: "Estava com frio, mas que bom que você me abraçou forte.", en: "I was cold, but I'm so glad you hugged me tight.", grammar: [g.subjunctive-emotion], vocab: [w.abraçar-forte] }
  - id: b1.u02.l2
    title: É importante que você saiba
    teach: [g.subjunctive-impersonal]
    vocab: [w.necessário, w.essencial, w.fundamental, w.necessidade, w.impressionante, w.inacreditável, w.absurdo, w.ridículo, w.justo, w.injusto, w.lamentável, w.chocante, w.assustador, w.emocionante, w.divertido, w.impressionar, w.elogiar, w.elogio, w.criticar, w.crítica, w.reclamar, w.reclamação, w.queixar-se, w.prestar, w.imagem]
    tip: "Judgements take the subjunctive (é melhor que você vá); facts take the indicative (é verdade que ele foi). With no particular person, use the infinitive: é importante descansar."
    sentences:
      - { es: "É importante que você leve um casaco: as noites são frias.", en: "It's important that you take a coat: the nights are cold.", altEs: ["É importante você levar um casaco: as noites são frias."], grammar: [g.subjunctive-impersonal], vocab: [], transform: { instruction: "Make it a general statement (no person)", answer: "É importante levar um casaco: as noites são frias.", en: "It's important to take a coat: the nights are cold." } }
      - { es: "É necessário que os visitantes reservem a visita à mina.", en: "Visitors need to book the mine tour.", altEs: ["É preciso que os visitantes reservem a visita à mina."], altEn: ["It's necessary for visitors to book the visit to the mine."], grammar: [g.subjunctive-impersonal], vocab: [w.necessário, w.visitante] }
      - { es: "É essencial que a gente proteja as igrejas antigas.", en: "It's essential that we protect the old churches.", altEs: ["É essencial que nós protejamos as igrejas antigas."], grammar: [g.subjunctive-impersonal, g.a-gente], vocab: [w.essencial] }
      - { es: "É fundamental que todos respeitem o silêncio dentro da igreja.", en: "It's essential that everyone respects the silence inside the church.", grammar: [g.subjunctive-impersonal], vocab: [w.fundamental] }
      - { es: "É impressionante que Aleijadinho tenha feito tantas obras.", en: "It's impressive that Aleijadinho made so many works.", grammar: [g.subjunctive-impersonal], vocab: [w.impressionante], note: "Aleijadinho (c. 1738–1814), the great sculptor and architect of Minas Baroque, worked on several churches in Ouro Preto." }
      - { es: "É inacreditável que uma cidade tão pequena tenha tanto ouro nas igrejas.", en: "It's unbelievable that such a small town has so much gold in its churches.", grammar: [g.subjunctive-impersonal], vocab: [w.inacreditável] }
      - { es: "É absurdo que o ingresso custe tão caro.", en: "It's absurd that the ticket costs so much.", altEs: ["É um absurdo que o ingresso custe tão caro."], grammar: [g.subjunctive-impersonal], vocab: [w.absurdo] }
      - { es: "É ridículo que a gente pague para estacionar na rua.", en: "It's ridiculous that we pay to park in the street.", grammar: [g.subjunctive-impersonal], vocab: [w.ridículo] }
      - { es: "Não é justo que os moradores paguem mais que os turistas.", en: "It isn't fair that locals pay more than tourists.", altEs: ["Não é justo os moradores pagarem mais que os turistas."], grammar: [g.subjunctive-impersonal], vocab: [w.justo] }
      - { es: "É verdade que Ouro Preto foi capital de Minas.", en: "It's true that Ouro Preto was the capital of Minas.", grammar: [g.subjunctive-impersonal], vocab: [], note: "É verdade que states a fact, so it takes the indicative." }
      - { es: "É lamentável que tanta gente não conheça a história da cidade.", en: "It's regrettable that so many people don't know the town's history.", grammar: [g.subjunctive-impersonal], vocab: [w.lamentável] }
      - { es: "É melhor que vocês subam a ladeira devagar.", en: "You'd better go up the slope slowly.", altEs: ["É melhor vocês subirem a ladeira devagar."], grammar: [g.subjunctive-impersonal], vocab: [], error: { wrong: "É melhor que vocês sobem a ladeira devagar.", explain: "É melhor que is a judgement, so it takes the subjunctive: subam (from subo), not sobem.", grammar: g.subjunctive-impersonal } }
      - { es: "É normal que os turistas reclamem das ladeiras.", en: "It's normal for tourists to complain about the steep streets.", grammar: [g.subjunctive-impersonal], vocab: [w.reclamar] }
      - { es: "Basta que você escreva a reclamação neste formulário.", en: "All you need to do is write the complaint on this form.", grammar: [g.subjunctive-impersonal], vocab: [w.reclamação] }
      - { es: "É chato que ele critique tudo o que eu faço.", en: "It's annoying that he criticises everything I do.", grammar: [g.subjunctive-impersonal], vocab: [w.criticar], transform: { instruction: "Use me irrita que… instead of é chato que…", answer: "Me irrita que ele critique tudo o que eu faço.", en: "It irritates me that he criticises everything I do." } }
      - { es: "Não é necessário que você se queixe tanto: amanhã vai fazer sol.", en: "There's no need for you to complain so much: it'll be sunny tomorrow.", grammar: [g.subjunctive-impersonal], vocab: [w.necessário, w.queixar-se] }
    exchanges:
      - q: { es: "Preciso reservar a visita à mina?", en: "Do I need to book the mine tour?" }
        a: { es: "É melhor que você reserve, sim. Fica cheio no fim de semana.", en: "You'd better book, yes. It gets full at the weekend." }
        alt: ["Sim, é necessário reservar.", "Não precisa, é só chegar."]
        grammar: [g.subjunctive-impersonal]
        vocab: []
      - q: { es: "O que você achou do museu?", en: "What did you think of the museum?" }
        a: { es: "Emocionante! É impressionante que tudo esteja tão bonito depois de tantos anos.", en: "Moving! It's impressive that everything looks so beautiful after so many years." }
        alt: ["Achei emocionante.", "Muito impressionante!"]
        grammar: [g.subjunctive-impersonal]
        vocab: [w.emocionante, w.impressionante]
      - q: { es: "É verdade que tem igreja em todo canto?", en: "Is it true there's a church on every corner?" }
        a: { es: "É verdade! É difícil que você veja todas em um dia.", en: "It's true! It's unlikely you'll see them all in one day." }
        alt: ["É verdade!", "Quase! Tem muitas."]
        grammar: [g.subjunctive-impersonal]
        vocab: []
      - q: { es: "Por que ela está reclamando?", en: "Why is she complaining?" }
        a: { es: "Ela acha injusto que a gente pague o ingresso duas vezes.", en: "She thinks it's unfair that we pay for the ticket twice." }
        alt: ["Porque acha o ingresso caro.", "Ela sempre reclama!"]
        grammar: [g.subjunctive-impersonal]
        vocab: [w.injusto, w.reclamar]
      - q: { es: "Vale a pena fazer o passeio dos fantasmas à noite?", en: "Is the night-time ghost tour worth doing?" }
        a: { es: "Vale! É assustador e divertido ao mesmo tempo.", en: "It is! It's scary and fun at the same time." }
        alt: ["Vale muito a pena.", "Achei meio assustador."]
        grammar: []
        vocab: [w.assustador, w.divertido]
      - q: { es: "O guia elogiou o seu português?", en: "Did the guide compliment your Portuguese?" }
        a: { es: "Elogiou! Foi o melhor elogio da viagem.", en: "He did! It was the best compliment of the trip." }
        alt: ["Elogiou, sim.", "Não, mas fez uma crítica construtiva."]
        grammar: []
        vocab: [w.elogiar, w.elogio, w.crítica]
    texts:
      - title: "Aviso na entrada da igreja"
        es: ["É proibido tirar fotos.", "É necessário que os visitantes falem baixo.", "É fundamental que ninguém toque nas imagens."]
        en: ["Taking photos is forbidden.", "Visitors must speak quietly.", "It is essential that nobody touches the statues."]
        grammar: [g.subjunctive-impersonal]
        vocab: [w.necessário, w.visitante, w.fundamental, w.imagem]
      - title: "Crítica de um viajante"
        es: ["A cidade é impressionante e as igrejas são emocionantes.", "Mas é lamentável que os restaurantes fechem tão cedo.", "É essencial que você leve um bom tênis para as ladeiras."]
        en: ["The town is impressive and the churches are moving.", "But it's a pity the restaurants close so early.", "It's essential that you bring good trainers for the steep streets."]
        grammar: [g.subjunctive-impersonal]
        vocab: [w.crítica, w.impressionante, w.lamentável, w.essencial]
    spicy:
      - { es: "É fundamental que você saiba: eu danço mal, mas beijo bem.", en: "It's essential that you know: I dance badly, but I kiss well.", grammar: [g.subjunctive-impersonal, g.subjunctive-irregular], vocab: [w.fundamental] }
      - { es: "É inacreditável que alguém tão bonito ainda esteja solteiro.", en: "It's unbelievable that someone so good-looking is still single.", altEs: ["É inacreditável que alguém tão bonita ainda esteja solteira."], grammar: [g.subjunctive-impersonal], vocab: [w.inacreditável] }
      - { es: "É melhor que você pare de me elogiar; eu fico vermelho.", en: "You'd better stop complimenting me; I go red.", altEs: ["É melhor que você pare de me elogiar; eu fico vermelha."], grammar: [g.subjunctive-impersonal], vocab: [w.elogiar] }
      - { es: "Não é justo que você seja tão bonito e ainda cozinhe bem.", en: "It isn't fair that you're so handsome and cook well too.", altEs: ["Não é justo que você seja tão bonita e ainda cozinhe bem."], grammar: [g.subjunctive-impersonal, g.subjunctive-irregular], vocab: [w.justo] }
      - { es: "É impossível que eu preste atenção nas igrejas com você do meu lado.", en: "It's impossible for me to pay attention to the churches with you beside me.", grammar: [g.subjunctive-impersonal], vocab: [w.prestar] }
  - id: b1.u02.l3
    title: Prefiro que você fique
    teach: [g.subjunctive-vs-infinitive]
    vocab: [w.ciúme, w.ciumento, w.inveja, w.raiva, w.carinho, w.carinhoso, w.amor, w.paixão, w.apaixonado, w.apaixonar-se, w.incomodar, w.irritar, w.irritante, w.chatear, w.magoar, w.ofender, w.sensível, w.coragem]
    tip: "One subject → infinitive (Tenho medo de errar). Two subjects → que + subjunctive (Tenho medo que você erre). Deixar, mandar and fazer always take an infinitive: Deixa eu ver!"
    sentences:
      - { es: "Tenho medo de me perder nas ladeiras.", en: "I'm afraid of getting lost in the steep streets.", grammar: [g.subjunctive-vs-infinitive], vocab: [], transform: { instruction: "Make it 'I'm afraid YOU'll get lost'", answer: "Tenho medo que você se perca nas ladeiras.", alt: ["Tenho medo de que você se perca nas ladeiras."], en: "I'm afraid you'll get lost in the steep streets." } }
      - { es: "Não seja ciumento: ela só quer conversar com os amigos.", en: "Don't be jealous: she just wants to chat with her friends.", altEs: ["Não seja ciumenta: ele só quer conversar com os amigos."], grammar: [g.subjunctive-vs-infinitive, g.subjunctive-irregular], vocab: [w.ciumento] }
      - { es: "Me incomoda que ele fale tão alto na república.", en: "It bothers me that he talks so loudly in the student house.", grammar: [g.subjunctive-vs-infinitive, g.subjunctive-emotion], vocab: [w.incomodar], note: "A república is a shared student house; Ouro Preto is famous for them." }
      - { es: "Deixa eu te dar um abraço.", en: "Let me give you a hug.", altEs: ["Deixe-me te dar um abraço.", "Deixa eu te abraçar."], grammar: [g.subjunctive-vs-infinitive], vocab: [], variant: "In Portugal: Deixa-me dar-te um abraço." }
      - { es: "O filme me fez chorar de raiva.", en: "The film made me cry with anger.", grammar: [g.subjunctive-vs-infinitive], vocab: [w.raiva] }
      - { es: "Me irrita que você chegue sempre atrasado.", en: "It irritates me that you always arrive late.", altEs: ["Me irrita que você chegue sempre atrasada."], grammar: [g.subjunctive-vs-infinitive, g.subjunctive-emotion], vocab: [w.irritar] }
      - { es: "Quero ir à festa da república.", en: "I want to go to the student-house party.", grammar: [g.subjunctive-vs-infinitive], vocab: [], error: { wrong: "Quero que eu vá à festa da república.", explain: "Same subject (I want, I go) → infinitive: quero ir.", grammar: g.subjunctive-vs-infinitive }, transform: { instruction: "Make it 'I want YOU to go'", answer: "Quero que você vá à festa da república.", en: "I want you to go to the student-house party." } }
      - { es: "Prefiro não falar disso; não quero que ninguém se magoe.", en: "I'd rather not talk about it; I don't want anyone to get hurt.", grammar: [g.subjunctive-vs-infinitive], vocab: [w.magoar] }
      - { es: "Não quero te ofender, mas o seu feijão está sem sal.", en: "I don't want to offend you, but your beans need salt.", grammar: [g.subjunctive-vs-infinitive], vocab: [w.ofender] }
      - { es: "Ele é muito carinhoso e adora que a gente faça carinho no gato.", en: "He's very affectionate and loves it when we stroke the cat.", grammar: [g.subjunctive-vs-infinitive, g.subjunctive-emotion], vocab: [w.carinhoso, w.carinho] }
      - { es: "Estou apaixonado e quero que o mundo inteiro saiba.", en: "I'm in love and I want the whole world to know.", altEs: ["Estou apaixonada e quero que o mundo inteiro saiba."], grammar: [g.subjunctive-vs-infinitive, g.subjunctive-irregular], vocab: [w.apaixonado] }
      - { es: "A paixão pela música fez ele ficar em Ouro Preto.", en: "His passion for music made him stay in Ouro Preto.", altEs: ["A paixão pela música o fez ficar em Ouro Preto."], grammar: [g.subjunctive-vs-infinitive], vocab: [w.paixão], note: "Fez ele ficar is everyday Brazilian; in writing, o fez ficar." }
      - { es: "Não tenho inveja de ninguém; só quero que você seja feliz.", en: "I'm not envious of anyone; I just want you to be happy.", grammar: [g.subjunctive-vs-infinitive], vocab: [w.inveja] }
      - { es: "Você é muito sensível; não deixa isso te chatear.", en: "You're very sensitive; don't let that upset you.", altEs: ["Você é muito sensível; não deixe isso te chatear.", "Você é muito sensível; não deixe que isso te chateie."], grammar: [g.subjunctive-vs-infinitive], vocab: [w.sensível, w.chatear] }
      - { es: "Tenho coragem de falar com ele, mas prefiro que você fale primeiro.", en: "I've got the courage to talk to him, but I'd rather you spoke first.", grammar: [g.subjunctive-vs-infinitive], vocab: [w.coragem] }
      - { es: "Amor, deixa eu ver o mapa!", en: "Darling, let me see the map!", altEs: ["Amor, deixe-me ver o mapa!"], grammar: [g.subjunctive-vs-infinitive], vocab: [w.amor] }
    exchanges:
      - q: { es: "Quer que eu vá com você?", en: "Do you want me to go with you?" }
        a: { es: "Não precisa, prefiro ir sozinha.", en: "There's no need, I'd rather go alone." }
        alt: ["Quero, sim!", "Prefiro que você fique aqui."]
        grammar: [g.subjunctive-vs-infinitive]
        vocab: []
      - q: { es: "Por que você está com tanta raiva?", en: "Why are you so angry?" }
        a: { es: "Porque o chefe não me deixou falar na reunião.", en: "Because the boss didn't let me speak in the meeting." }
        alt: ["Não quero falar disso.", "Porque perdi o ônibus."]
        grammar: [g.subjunctive-vs-infinitive]
        vocab: [w.raiva]
      - q: { es: "Você sente ciúme do seu namorado?", en: "Do you get jealous about your boyfriend?" }
        a: { es: "Um pouco. Me incomoda que ele não responda as minhas mensagens.", en: "A little. It bothers me that he doesn't answer my messages." }
        alt: ["Não, nunca.", "Às vezes sinto."]
        grammar: [g.subjunctive-vs-infinitive, g.subjunctive-emotion]
        vocab: [w.ciúme, w.incomodar]
      - q: { es: "Esse barulho não te irrita?", en: "Doesn't that noise irritate you?" }
        a: { es: "Muito! É irritante, mas não quero reclamar com os vizinhos.", en: "A lot! It's irritating, but I don't want to complain to the neighbours." }
        alt: ["Irrita muito!", "Não, já me acostumei."]
        grammar: [g.subjunctive-vs-infinitive]
        vocab: [w.irritante, w.irritar]
      - q: { es: "Deixa eu pagar o café?", en: "Will you let me pay for the coffee?" }
        a: { es: "De jeito nenhum! Hoje quem paga sou eu.", en: "No way! Today I'm paying." }
        alt: ["Deixo, obrigado!", "Não, hoje eu pago."]
        grammar: [g.subjunctive-vs-infinitive]
        vocab: []
    texts:
      - title: "Bilhete na geladeira da república"
        es: ["Pessoal, me incomoda que ninguém lave a louça.", "Não quero brigar, só quero que cada um lave o seu prato.", "Com carinho, Caio."]
        en: ["Guys, it bothers me that nobody does the washing-up.", "I don't want to fight, I just want everyone to wash their own plate.", "Love, Caio."]
        grammar: [g.subjunctive-vs-infinitive, g.subjunctive-emotion]
        vocab: [w.incomodar, w.carinho]
      - title: "Mensagem para uma amiga"
        es: ["Estou apaixonada por um colega de turma.", "Quero falar com ele, mas tenho medo de passar vergonha.", "Prefiro que ele fale primeiro!"]
        en: ["I'm in love with a classmate.", "I want to talk to him, but I'm afraid of embarrassing myself.", "I'd rather he spoke first!"]
        grammar: [g.subjunctive-vs-infinitive]
        vocab: [w.apaixonado]
    spicy:
      - { es: "Não quero que você fique com ciúme… mas o guia da mina me deu o número dele.", en: "I don't want you to get jealous… but the mine guide gave me his number.", grammar: [g.subjunctive-vs-infinitive], vocab: [w.ciúme] }
      - { es: "Deixa eu adivinhar: você quer me levar para comer pão de queijo.", en: "Let me guess: you want to take me out for cheese bread.", grammar: [g.subjunctive-vs-infinitive], vocab: [] }
      - { es: "Prefiro que você me chame de amor, não de colega.", en: "I'd rather you called me darling, not mate.", grammar: [g.subjunctive-vs-infinitive], vocab: [w.amor] }
      - { es: "Tenho medo de me apaixonar, e você não está ajudando.", en: "I'm afraid of falling in love, and you're not helping.", grammar: [g.subjunctive-vs-infinitive], vocab: [w.apaixonar-se] }
      - { es: "O seu sorriso me fez esquecer o caminho do hotel.", en: "Your smile made me forget the way back to the hotel.", grammar: [g.subjunctive-vs-infinitive], vocab: [] }
  - id: b1.u02.l4
    title: Altos e baixos
    teach: [g.subjunctive-emotion, g.subjunctive-impersonal]
    vocab: [w.sentimento, w.orgulho, w.vergonha, w.ansiedade, w.solidão, w.solitário, w.tédio, w.entediado, w.preguiça, w.preguiçoso, w.humor, w.deprimido, w.depressão, w.estressado, w.calma, w.reagir, w.reação, w.sofrer]
    tip: "Feelings about someone else's situation → subjunctive: Me preocupa que ele fique sozinho. Ainda bem que is the exception: Ainda bem que amanhã é feriado."
    sentences:
      - { es: "Tenho orgulho que a minha filha estude aqui em Ouro Preto.", en: "I'm proud that my daughter studies here in Ouro Preto.", altEs: ["Tenho orgulho de que a minha filha estude aqui em Ouro Preto.", "Tenho orgulho que minha filha estude em Ouro Preto."], grammar: [g.subjunctive-emotion], vocab: [w.orgulho] }
      - { es: "Me dá vergonha que você grite no restaurante.", en: "It embarrasses me when you shout in the restaurant.", altEs: ["Tenho vergonha que você grite no restaurante."], grammar: [g.subjunctive-emotion], vocab: [w.vergonha] }
      - { es: "É normal que você sinta ansiedade antes da prova.", en: "It's normal for you to feel anxious before the exam.", altEs: ["É normal você sentir ansiedade antes da prova."], grammar: [g.subjunctive-impersonal], vocab: [w.ansiedade], transform: { instruction: "Make it a general statement (no person)", answer: "É normal sentir ansiedade antes da prova.", en: "It's normal to feel anxious before an exam." } }
      - { es: "A solidão me preocupa: não quero que meu avô fique sozinho.", en: "Loneliness worries me: I don't want my grandfather to be on his own.", grammar: [g.subjunctive-wishes, g.subjunctive-emotion], vocab: [w.solidão] }
      - { es: "É triste que ele se sinta tão solitário.", en: "It's sad that he feels so lonely.", grammar: [g.subjunctive-impersonal], vocab: [w.solitário] }
      - { es: "Que tédio! É uma pena que chova o fim de semana todo.", en: "How boring! It's a shame it's raining all weekend.", grammar: [g.subjunctive-emotion], vocab: [w.tédio] }
      - { es: "Estou entediado; é melhor que a gente saia um pouco.", en: "I'm bored; we'd better go out for a bit.", altEs: ["Estou entediada; é melhor a gente sair um pouco."], grammar: [g.subjunctive-impersonal, g.a-gente], vocab: [w.entediado] }
      - { es: "Que preguiça! Ainda bem que amanhã é feriado.", en: "I feel so lazy! Thank goodness tomorrow's a holiday.", grammar: [g.subjunctive-emotion], vocab: [w.preguiça], error: { wrong: "Que preguiça! Ainda bem que amanhã seja feriado.", explain: "Ainda bem que is the exception: it always takes the indicative (é).", grammar: g.subjunctive-emotion } }
      - { es: "Me irrita que ele seja tão preguiçoso.", en: "It irritates me that he's so lazy.", altEs: ["Me irrita que ela seja tão preguiçosa."], grammar: [g.subjunctive-emotion, g.subjunctive-irregular], vocab: [w.preguiçoso] }
      - { es: "Fico feliz que você esteja de bom humor hoje.", en: "I'm glad you're in a good mood today.", grammar: [g.subjunctive-emotion], vocab: [w.humor] }
      - { es: "É importante que quem está deprimido procure ajuda.", en: "It's important that anyone who's depressed seeks help.", grammar: [g.subjunctive-impersonal], vocab: [w.deprimido] }
      - { es: "A depressão é uma doença; é fundamental que a gente fale sobre ela.", en: "Depression is an illness; it's essential that we talk about it.", grammar: [g.subjunctive-impersonal], vocab: [w.depressão] }
      - { es: "Ando muito estressado; é bom que eu tire uns dias de folga.", en: "I've been very stressed; it'd be good for me to take a few days off.", altEs: ["Ando muito estressada; é bom que eu tire uns dias de folga."], grammar: [g.subjunctive-impersonal], vocab: [w.estressado] }
      - { es: "Me surpreende que ele reaja assim.", en: "It surprises me that he reacts like that.", grammar: [g.subjunctive-emotion], vocab: [w.reagir], error: { wrong: "Me surpreende que ele reage assim.", explain: "Me surpreende que takes the subjunctive: reaja (from reajo).", grammar: g.subjunctive-emotion }, transform: { instruction: "Change ele to eles", answer: "Me surpreende que eles reajam assim.", en: "It surprises me that they react like that." } }
      - { es: "É triste que tanta gente sofra sozinha.", en: "It's sad that so many people suffer alone.", grammar: [g.subjunctive-impersonal], vocab: [w.sofrer] }
      - { es: "Não tenha vergonha dos seus sentimentos.", en: "Don't be ashamed of your feelings.", altEs: ["Não sinta vergonha dos seus sentimentos."], grammar: [g.imperative-negative], vocab: [w.sentimento, w.vergonha] }
    exchanges:
      - q: { es: "Como você está hoje?", en: "How are you today?" }
        a: { es: "Mais calma, obrigada. Que bom que você perguntou.", en: "Calmer, thanks. I'm glad you asked." }
        alt: ["Mais calmo, obrigado.", "Melhor, obrigada."]
        grammar: [g.subjunctive-emotion]
        vocab: [w.calma]
      - q: { es: "Qual foi a reação da sua mãe?", en: "How did your mother react?" }
        a: { es: "Ela chorou de alegria.", en: "She cried with joy." }
        alt: ["Ficou surpresa.", "Não acreditou!"]
        grammar: []
        vocab: [w.reação, w.alegria]
      - q: { es: "Você anda estressado?", en: "Have you been stressed lately?" }
        a: { es: "Muito. Tomara que as férias cheguem logo.", en: "Very. I hope the holidays come soon." }
        alt: ["Um pouco.", "Não, ando tranquilo."]
        grammar: [g.subjunctive-wishes]
        vocab: [w.estressado]
      - q: { es: "Você tem vergonha de cantar em público?", en: "Are you embarrassed to sing in public?" }
        a: { es: "Tenho! Prefiro que os outros cantem.", en: "I am! I'd rather the others sang." }
        alt: ["Não, adoro cantar!", "Um pouco."]
        grammar: [g.subjunctive-vs-infinitive]
        vocab: [w.vergonha]
      - q: { es: "Seu irmão ainda está deprimido?", en: "Is your brother still depressed?" }
        a: { es: "Está melhor. Fico aliviado que ele tenha procurado um médico.", en: "He's better. I'm relieved he went to see a doctor." }
        alt: ["Está melhorando, obrigado.", "Infelizmente, sim."]
        grammar: [g.subjunctive-emotion]
        vocab: [w.deprimido, w.aliviado]
    texts:
      - title: "Diário"
        es: ["Hoje acordei de mau humor.", "Chove em Ouro Preto há três dias e me irrita não poder sair.", "Ainda bem que amanhã o sol volta."]
        en: ["Today I woke up in a bad mood.", "It's been raining in Ouro Preto for three days and it irritates me that I can't go out.", "Thank goodness the sun's coming back tomorrow."]
        grammar: [g.subjunctive-emotion, g.subjunctive-vs-infinitive]
        vocab: [w.humor]
      - title: "Post de uma psicóloga"
        es: ["Ansiedade e depressão não são preguiça.", "É fundamental que a gente fale desses sentimentos sem vergonha.", "E é importante que quem sofre procure ajuda."]
        en: ["Anxiety and depression are not laziness.", "It's essential that we talk about these feelings without shame.", "And it's important that anyone who is suffering seeks help."]
        grammar: [g.subjunctive-impersonal]
        vocab: [w.ansiedade, w.depressão, w.preguiça, w.sentimento, w.sofrer]
    spicy:
      - { es: "Não tenho vergonha de dizer: fico de bom humor só de te ver.", en: "I'm not ashamed to say it: just seeing you puts me in a good mood.", grammar: [g.subjunctive-vs-infinitive], vocab: [w.vergonha, w.humor] }
      - { es: "Que tédio esta festa! É melhor que a gente vá dançar em outro lugar.", en: "This party is so boring! We'd better go dancing somewhere else.", grammar: [g.subjunctive-impersonal, g.subjunctive-irregular], vocab: [w.tédio] }
      - { es: "Ando estressado; o médico disse que é importante que eu receba mais abraços.", en: "I've been stressed; the doctor said it's important that I get more hugs.", altEs: ["Ando estressada; o médico disse que é importante que eu receba mais abraços."], grammar: [g.subjunctive-impersonal], vocab: [w.estressado] }
      - { es: "Ainda bem que você chegou; a solidão já estava me deixando romântico demais.", en: "Thank goodness you're here; loneliness was making me far too romantic.", altEs: ["Ainda bem que você chegou; a solidão já estava me deixando romântica demais."], grammar: [g.subjunctive-emotion], vocab: [w.solidão] }
      - { es: "Que preguiça de ir embora! É possível que eu fique mais um pouco?", en: "I can't be bothered to leave! Is it possible for me to stay a bit longer?", grammar: [g.subjunctive-impersonal], vocab: [w.preguiça] }
dialogues:
  - id: b1.u02.d1
    title: Na república
    context: Bia visits her friend Caio, who studies in Ouro Preto and lives in a república, a shared student house.
    lines:
      - { speaker: Caio, es: "Bia! Que bom que você veio! Achei que você não vinha mais.", en: "Bia! I'm so glad you came! I thought you weren't coming any more." }
      - { speaker: Bia, es: "Desculpa o atraso. O ônibus de BH demorou muito, e essas ladeiras… que absurdo!", en: "Sorry I'm late. The bus from BH took ages, and these steep streets… it's absurd!" }
      - { speaker: Caio, es: "É normal que os visitantes reclamem das ladeiras. Mas a vista vale a pena.", en: "It's normal for visitors to complain about the slopes. But the view is worth it." }
      - { speaker: Bia, es: "É verdade, é impressionante. Que pena que tenha tanta neblina hoje.", en: "True, it's impressive. What a shame there's so much fog today." }
      - { speaker: Caio, es: "Amanhã é provável que faça sol. Quero que você conheça a Igreja de São Francisco.", en: "Tomorrow it'll probably be sunny. I want you to see the Church of Saint Francis." }
      - { speaker: Bia, es: "E a sua república? É verdade que vocês são doze morando juntos?", en: "And your student house? Is it true there are twelve of you living together?" }
      - { speaker: Caio, es: "É verdade. Me incomoda um pouco que ninguém lave a louça, mas é divertido.", en: "It's true. It bothers me a bit that nobody does the washing-up, but it's fun." }
      - { speaker: Bia, es: "Deixa eu adivinhar: o único que lava é você.", en: "Let me guess: the only one who washes up is you." }
      - { speaker: Caio, es: "Claro! Mas fico feliz que você fique aqui com a gente. É importante que você prove o feijão da dona Cida.", en: "Of course! But I'm glad you're staying here with us. It's important that you try Dona Cida's beans." }
      - { speaker: Bia, es: "Com prazer! Estou com uma fome inacreditável.", en: "With pleasure! I'm unbelievably hungry." }
    questions:
      - { q: "Por que a Bia chegou atrasada?", options: ["Porque se perdeu nas ladeiras", "Porque o ônibus demorou", "Porque acordou tarde"], answer: 1, explain: "O ônibus de BH demorou muito." }
      - { q: "Como está o tempo hoje em Ouro Preto?", options: ["Está fazendo sol", "Tem muita neblina", "Está nevando"], answer: 1, explain: "Que pena que tenha tanta neblina hoje." }
      - { q: "O que incomoda o Caio na república?", options: ["O barulho dos vizinhos", "Que ninguém lave a louça", "A comida da dona Cida"], answer: 1, explain: "Me incomoda um pouco que ninguém lave a louça." }
      - { q: "Quantas pessoas moram na república?", options: ["Doze", "Duas", "Vinte"], answer: 0, explain: "Bia asks if there are twelve of them and Caio says it's true." }
