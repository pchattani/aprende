      - { es: "Aqui não pode fumar.", en: "You can't smoke here.", altEs: ["Não pode fumar aqui.", "Aqui não se pode fumar."], altEn: ["No smoking here."], grammar: [g.poder-present, g.negation], vocab: [w.fumar] }
      - { es: "Não pode estacionar na frente da garagem.", en: "You can't park in front of the garage.", altEs: ["Não pode estacionar em frente à garagem."], altEn: ["No parking in front of the garage."], grammar: [g.poder-present, g.prepositions-place], vocab: [w.estacionar, w.garagem] }
      - { es: "Cachorro não pode entrar no Jardim Botânico.", en: "Dogs can't go into the Botanical Garden.", altEs: ["Cachorros não podem entrar no Jardim Botânico."], altEn: ["Dogs aren't allowed in the Botanical Garden."], grammar: [g.poder-present], vocab: [w.cachorro, w.entrar] }
      - { es: "Pode deixar, eu levo as toalhas.", en: "Leave it to me, I'll bring the towels.", altEs: ["Pode deixar que eu levo as toalhas."], altEn: ["Don't worry, I'll take the towels."], grammar: [g.poder-present], vocab: [w.deixar, w.toalha], note: "Pode deixar! = Leave it to me! / Don't worry!" }
      - { es: "Hoje eu não posso: tenho que trabalhar.", en: "I can't today: I have to work.", altEs: ["Hoje não posso, tenho que trabalhar.", "Hoje eu não posso, tenho de trabalhar."], grammar: [g.poder-present, g.ter-que], vocab: [w.poder, w.trabalhar] }
      - { es: "Vocês podem vir comigo?", en: "Can you come with me?", altEs: ["Vocês podem ir comigo?"], altEn: ["Can you all come with me?"], grammar: [g.poder-present], vocab: [w.comigo, w.vir], transform: { instruction: "Change to 'he'", answer: "Ele pode vir comigo?", alt: ["Ele pode ir comigo?"], en: "Can he come with me?" } }
      - { es: "Estou pronta! Podemos ir?", en: "I'm ready! Can we go?", altEs: ["Estou pronto! Podemos ir?", "Tô pronta! Podemos ir?"], altEn: ["I'm ready! Shall we go?"], grammar: [g.poder-present, g.ser-vs-estar-basics], vocab: [w.pronto] }
      - { es: "Pode chover hoje à tarde.", en: "It might rain this afternoon.", altEs: ["Hoje à tarde pode chover."], altEn: ["It could rain this afternoon."], grammar: [g.poder-present], vocab: [w.chover], note: "pode = it may / might." }
      - { es: "Um café? — Pode ser.", en: "A coffee? — Sure.", altEs: ["Um cafezinho? — Pode ser."], altEn: ["A coffee? — OK, why not."], grammar: [g.poder-present], vocab: [w.café], note: "Pode ser = sure, that'd be fine." }
      - { es: "Eu posso ir amanhã.", en: "I can go tomorrow.", altEs: ["Posso ir amanhã.", "Amanhã eu posso ir."], grammar: [g.poder-present], vocab: [w.poder], error: { wrong: "Eu pode ir amanhã.", explain: "With eu, poder is posso.", grammar: g.poder-present }, transform: { instruction: "Make it negative", answer: "Eu não posso ir amanhã.", alt: ["Não posso ir amanhã.", "Amanhã eu não posso ir."], en: "I can't go tomorrow." } }
      - { es: "O senhor pode repetir, por favor?", en: "Could you repeat that, please, sir?", altEs: ["A senhora pode repetir, por favor?", "Pode repetir, por favor?"], altEn: ["Can you repeat that, please?"], grammar: [g.poder-present, g.voce-o-senhor], vocab: [w.repetir, w.o-senhor] }
      - { es: "Você pode falar mais devagar?", en: "Can you speak more slowly?", altEs: ["Pode falar mais devagar?", "Você pode falar mais devagar, por favor?"], grammar: [g.poder-present], vocab: [w.falar, w.devagar] }
