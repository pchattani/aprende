id: r.c2.the-old-man-of-xiguan
level: c2
title: 西關大屋嘅陳伯
kind: dialogue
intro: "A Hong Kong video blogger interviews a (fictional) retired craftsman who grew up in a Xiguan mansion in Guangzhou. Their conversation drifts from sliding lattice gates and coloured-glass windows to the words that separate Guangzhou and Hong Kong Cantonese (公交 / 巴士, 冰箱 / 雪櫃), Mandarin loans and terms of address."
allow: [陳伯, 阿Ken, ken, 西關, 西關大屋, 上下九, 荔灣, 恩寧路, 永慶坊, youtube, ok]
paragraphs:
  - { es: "阿Ken：各位觀眾，大家好！今日我哋嚟到廣州荔灣嘅西關，身後呢間就係正宗嘅西關大屋。帶我哋參觀嘅係陳伯，佢喺呢度出世，住咗七十幾年。陳伯，你好！", en: "Ken: Hello, everyone! Today we're in Xiguan in Liwan, Guangzhou, and the building behind me is a genuine Xiguan mansion. Showing us round is Uncle Chan, who was born here and has lived here for over seventy years. Hello, Uncle Chan!" }
  - { es: "陳伯：你好，靚仔！由香港上嚟好遠咩？而家坐高鐵，四十幾分鐘就到，以前我哋落香港要坐成日火車。嚟，先睇吓個門口。呢度有三重門：最外面係腳門，矮矮哋，好似酒吧嗰啲門；中間呢個係趟櫳，一條條圓木橫住，可以拉嚟拉去；最入面先係大木門。", en: "Uncle Chan: Hello, young man! Is it far coming up from Hong Kong? Nowadays the high-speed train gets you here in forty-odd minutes; in the old days going down to Hong Kong took us a whole day by train. Come, look at the doorway first. There are three layers of doors: the outermost is the half-door, low, like those doors in a bar; the middle one is the sliding lattice gate, round wooden bars set crossways that you can slide back and forth; and only the innermost is the big wooden door." }
  - { es: "阿Ken：點解要咁多重門呀？", en: "Ken: Why do you need so many doors?" }
  - { es: "陳伯：夏天熱嘛！大門打開，趟櫳拉埋，風吹得入，賊仔又入唔到；細路仔亦都唔會走出街。以前起呢啲屋嘅都係有錢商人，清朝末年，西關係廣州最旺嘅地方，絲綢、茶葉、銀號，乜都有。你望上去，嗰啲彩色玻璃窗叫滿洲窗，陽光照入嚟，成間屋紅紅綠綠，好靚㗎。", en: "Uncle Chan: Because it's hot in summer! With the big door open and the lattice gate closed, the breeze comes in but burglars can't, and the kids can't run out into the street either. The people who built these houses were wealthy merchants; at the end of the Qing dynasty Xiguan was the busiest part of Guangzhou – silk, tea, money shops, you name it. Look up: those coloured glass windows are called Manchurian windows. When the sun shines in, the whole house is red and green – beautiful." }
  - { es: "阿Ken：外面條街啲樓下面有行人路，上面有屋頂遮住，係咪就係騎樓？", en: "Ken: The buildings on the street outside have a pavement underneath with a roof over it – is that what they call qilou, arcade buildings?" }
  - { es: "陳伯：係呀。騎樓地下開舖，樓上住人，行人喺下面行，落雨唔使遮，熱天又曬唔到。以前上下九成條街都係騎樓，一間接一間，賣布、賣藥材、賣餅，熱鬧到不得了。我細個放學就喺騎樓底踢波，踢爛人哋玻璃，畀阿爸打到喊。（笑）而家好多舊屋拆咗，好彩恩寧路、永慶坊嗰邊保育得幾好，後生仔又開咗好多咖啡店。", en: "Uncle Chan: Yes. The ground floor of an arcade building is a shop, people live upstairs, and pedestrians walk underneath – no need for an umbrella when it rains, and you're out of the sun on hot days. Shangxiajiu used to be arcades the whole length of the street, one after another, selling cloth, medicinal herbs, cakes – unbelievably lively. As a kid I played football under the arcades after school, broke people's windows and got beaten till I cried by my dad. (laughs) Lots of old houses have been demolished now, but luckily the Enning Road and Yongqingfang area has been conserved quite well, and young people have opened lots of coffee shops there." }
  - { es: "阿Ken：真係好靚！陳伯，我想問吓，你覺得廣州話同香港話有咩唔同？我哋拍片嗰陣，啲觀眾成日喺下面留言鬥嘴。", en: "Ken: It really is beautiful! Uncle Chan, I wanted to ask: what do you think the differences are between Guangzhou Cantonese and Hong Kong Cantonese? When we post videos, the viewers are always arguing about it in the comments." }
  - { es: "陳伯：（笑）其實冇乜唔同，講嘢一聽就明，文法同發音差唔多一樣。最大分別係啲詞。你哋香港講「巴士」、「的士」，係英文嚟嘅；我哋而家多數講「公交」、「打的」。你哋講「雪櫃」，我哋後生仔講「冰箱」；你哋食完飯講「埋單」，我哋講「買單」。仲有「士多啤梨」，我孫女就叫「草莓」。", en: "Uncle Chan: (laughs) There isn't much difference really – you understand each other instantly, and the grammar and pronunciation are almost the same. The biggest difference is in the words. You in Hong Kong say 巴士 'bus' and 的士 'taxi', which come from English; we mostly say 公交 and 打的 now. You say 雪櫃 for 'fridge'; our young people say 冰箱. When you finish a meal you say 埋單; we say 買單. And then there's 士多啤梨 'strawberry' – my granddaughter calls it 草莓." }
  - { es: "阿Ken：咁點解會噉嘅？", en: "Ken: So why is that?" }
  - { es: "陳伯：香港以前係英國管，好多英文字變咗廣東話；我哋呢邊就受普通話影響多啲。我細個學校都用廣東話上堂，後來推普，學校、電視都講普通話，啲後生仔慢慢將普通話嘅詞搬入廣東話。例如佢哋講「視頻」，你哋講「片」；佢哋話「質量好」，你哋話「質素好」。仲有啲後生講「我有去過」，喺我聽落就好怪，廣東話應該係「我去過」。", en: "Uncle Chan: Hong Kong used to be run by the British, so lots of English words became Cantonese; over here we've been influenced more by Mandarin. When I was little my school taught in Cantonese, but later came the promotion of Putonghua: schools and TV all used Mandarin, and young people gradually moved Mandarin words into Cantonese. For example, they say 視頻 for 'video' where you say 片; they say 質量好 'good quality' where you say 質素好. Some young people even say 我有去過 'I did go', which sounds very strange to me – in Cantonese it should be 我去過." }
  - { es: "阿Ken：咁你擔唔擔心廣州話會消失？", en: "Ken: So are you worried that Guangzhou Cantonese will disappear?" }
  - { es: "陳伯：擔心就有啲，不過冇你哋想像中咁嚴重。我孫女喺學校講普通話，返到屋企同我講廣東話，仲會用網上啲潮語，我都聽唔明。語言好似條河，一路流一路變，最緊要係仲有人講。你睇，你哋香港嘅後生上嚟廣州，同我哋講兩句就熟晒，邊有咁大分別？", en: "Uncle Chan: I'm a bit worried, but it's not as serious as you imagine. My granddaughter speaks Mandarin at school and Cantonese with me at home, and she even uses internet slang I can't understand. A language is like a river: it changes as it flows, and the most important thing is that people still speak it. Look, when young people from Hong Kong come up to Guangzhou, a couple of sentences and they're like old friends with us – how big a difference can there be?" }
  - { es: "阿Ken：講得好！仲有一樣嘢，頭先你叫我「靚仔」，我好開心。喺廣州係咪人人都噉叫？", en: "Ken: Well said! One more thing: just now you called me 靚仔 'handsome boy', which made me very happy. Does everyone in Guangzhou say that?" }
  - { es: "陳伯：（大笑）你唔好自我感覺太良好喇！「靚仔」、「靚女」只係叫後生嘅人，好似叫「喂」咁平常。叫做嘢嘅師傅就叫「師傅」，叫阿伯就叫「阿叔」，叫同年紀嘅男人可以叫「老表」，親切啲。你去茶樓叫伙計，叫「靚仔」佢就實應你，唔理佢幾多歲。", en: "Uncle Chan: (roars with laughter) Don't flatter yourself! 靚仔 and 靚女 are just what you call young people, as ordinary as saying 'hey'. You call a tradesman 師傅, an older man 阿叔, and a man your own age you can call 老表 'cousin', which is friendlier. If you go to a teahouse and call the waiter 靚仔, he'll definitely answer, no matter how old he is." }
  - { es: "阿Ken：原來係噉！最後，你有冇乜嘢想同香港嘅觀眾講？", en: "Ken: So that's how it is! Finally, is there anything you'd like to say to the viewers in Hong Kong?" }
  - { es: "陳伯：有。得閒就上嚟行吓上下九、永慶坊，飲餐早茶，一盅兩件，慢慢嘆。唔好淨係嚟買嘢，要嚟傾吓偈。大家講同一種話，就係一家人。仲有，記住叫我做「陳伯」，唔好叫「靚仔」，我都七十幾歲喇！", en: "Uncle Chan: Yes. When you're free, come up and stroll round Shangxiajiu and Yongqingfang, have morning tea – a cup of tea and two dim sum – and take your time. Don't just come to shop; come and have a chat. When we speak the same language, we're one family. And remember to call me Uncle Chan, not 'handsome boy' – I'm over seventy!" }
questions:
  - { q: "西關大屋門口嘅趟櫳有咩用？", options: ["淨係用嚟裝飾", "夏天可以通風，又可以防賊", "用嚟擺鞋"], answer: 1, explain: "With the big door open and the 趟櫳 closed, air flows in but burglars and children are kept in check." }
  - { q: "廣州後生仔講「冰箱」，香港人一般講乜嘢？", options: ["雪櫃", "冷氣", "冰室"], answer: 0, explain: "Hong Kong 雪櫃 vs Guangzhou 冰箱 (a Mandarin-style word)." }
  - { q: "根據陳伯，點解香港話有好多英文詞？", options: ["因為香港人鍾意英文歌", "因為香港以前係英國管", "因為廣州話冇呢啲詞"], answer: 1, explain: "British rule brought English loans such as 巴士, 的士, 士多啤梨." }
  - { q: "陳伯覺得「我有去過」點樣？", options: ["好正宗嘅廣東話", "受普通話影響，佢聽落好怪", "係香港人嘅講法"], answer: 1, explain: "有 + verb for a past action is a Mandarin-influenced pattern; standard Cantonese says 我去過." }
  - { q: "喺茶樓叫伙計「靚仔」係乜嘢意思？", options: ["讚佢好靚仔", "一種平常嘅稱呼，好似叫「喂」", "笑佢"], answer: 1, explain: "靚仔 / 靚女 are everyday terms of address for younger people, not real compliments." }
