id: r.b2.asunto-fecha-de-incorporacion
level: b2
title: "Asunto: fecha de incorporación"
kind: text
intro: An email thread between a new employee waiting for her residence permit and the human resources department, full of time and purpose clauses.
allow: [amina, haddad, laura, gil, re, par, antemano, incorpore]
paragraphs:
  - { es: "De: Amina Haddad. Para: Recursos Humanos. Asunto: fecha de incorporación. Buenos días. Les escribo en relación con mi contrato, que empieza el 3 de octubre. Esta mañana he estado en la oficina de extranjería y me han dicho que no pueden registrar mi expediente hasta que no entregue un certificado del ayuntamiento. Mientras no esté registrado, no tengo justificante para trabajar. ¿Sería posible retrasar la incorporación un par de semanas? Gracias de antemano.", en: "From: Amina Haddad. To: Human Resources. Subject: start date. Good morning. I am writing in connection with my contract, which starts on 3 October. This morning I was at the immigration office and they told me they cannot register my file until I hand in a certificate from the town hall. As long as it is not registered, I have no document that allows me to work. Would it be possible to delay my start by a couple of weeks? Thank you in advance." }
  - { es: "De: Recursos Humanos. Para: Amina Haddad. Asunto: RE: fecha de incorporación. Estimada Amina: gracias por avisarnos con tiempo. Hemos consultado con el departamento legal y, en principio, no podemos darle de alta hasta que tenga el justificante. No obstante, a fin de que no pierda el puesto, mantendremos la oferta hasta el 20 de octubre. En cuanto tenga el documento, envíenoslo y gestionaremos el contrato ese mismo día. Un saludo, Laura Gil.", en: "From: Human Resources. To: Amina Haddad. Subject: RE: start date. Dear Amina: thank you for letting us know in good time. We have consulted the legal department and, in principle, we cannot register you as an employee until you have the document. However, so that you do not lose the post, we will hold the offer until 20 October. As soon as you have the document, send it to us and we will process the contract that same day. Best regards, Laura Gil." }
  - { es: "De: Amina Haddad. Asunto: RE: RE: fecha de incorporación. Muchas gracias, Laura. Ya tengo cita en el ayuntamiento para el jueves. Una vez que me den el certificado, volveré a extranjería; me han dicho que, conforme vayan registrando los expedientes, llaman a cada persona. Les escribiré tan pronto como tenga noticias. Entretanto, ¿podría empezar a leer la documentación del puesto, de modo que no pierda tiempo cuando me incorpore?", en: "From: Amina Haddad. Subject: RE: RE: start date. Thank you very much, Laura. I already have an appointment at the town hall for Thursday. Once they give me the certificate, I will go back to the immigration office; they have told me that, as they register the files, they call each person. I will write to you as soon as I have news. In the meantime, could I start reading the documentation for the post, so that I don't lose time when I join?" }
  - { es: "De: Recursos Humanos. Asunto: RE: RE: RE: fecha de incorporación. Por supuesto. Le adjunto el manual de bienvenida y el calendario de formación. Le pido, sin embargo, que no comparta estos documentos fuera de la empresa hasta que haya firmado el contrato. Si tiene cualquier duda, pregunte sin problema.", en: "From: Human Resources. Subject: RE: RE: RE: start date. Of course. I attach the welcome manual and the training calendar. I ask you, however, not to share these documents outside the company until you have signed the contract. If you have any questions, do ask." }
  - { es: "De: Amina Haddad. Asunto: ¡Buenas noticias! Laura, me acaban de llamar de extranjería: el expediente ya está registrado y el justificante estará listo mañana. En cuanto lo recoja, se lo envío. Por lo que me han explicado, el permiso definitivo tardará dos meses, pero con el justificante puedo trabajar desde ya.", en: "From: Amina Haddad. Subject: Good news! Laura, the immigration office has just called me: the file is now registered and the document will be ready tomorrow. As soon as I collect it, I'll send it to you. From what they have explained to me, the final permit will take two months, but with the document I can work from now on." }
  - { es: "De: Recursos Humanos. Asunto: RE: ¡Buenas noticias! ¡Enhorabuena, Amina! Nos alegramos mucho de que todo se haya resuelto antes de lo previsto. Hemos preparado el contrato de manera que pueda firmarlo el lunes a las nueve. Después de la firma, su tutora le presentará al equipo. Hasta entonces, descanse: el papeleo también cansa. Bienvenida.", en: "From: Human Resources. Subject: RE: Good news! Congratulations, Amina! We are very glad that everything has been resolved sooner than expected. We have prepared the contract so that you can sign it on Monday at nine. After the signing, your mentor will introduce you to the team. Until then, rest: paperwork is tiring too. Welcome." }
questions:
  - { q: "Why can't Amina start work on 3 October?", options: ["She has not finished her degree", "Her file cannot be registered until she brings a certificate", "The company has no office space"], answer: 1 }
  - { q: "What does Human Resources decide?", options: ["To cancel the offer", "To hold the offer until 20 October", "To hire someone else"], answer: 1 }
  - { q: "What condition does Laura attach to the documents she sends?", options: ["Amina must print them", "Amina must not share them until she has signed", "Amina must translate them"], answer: 1 }
  - { q: "When will Amina sign the contract?", options: ["Monday at nine", "In two months", "On 20 October"], answer: 0 }
glossary:
  - { es: de antemano, en: in advance }
  - { es: departamento, en: department }
  - { es: legal, en: legal }
  - { es: dar de alta, en: to register (an employee) }
  - { es: incorporarse, en: to join (a company), to start work }
  - { es: calendario, en: calendar, schedule }
  - { es: previsto, en: expected, planned }
