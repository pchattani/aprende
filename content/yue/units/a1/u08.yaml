      - { es: "我哥哥喺中環做嘢。", en: "My older brother works in Central.", altEs: ["我阿哥喺中環做嘢。"], grammar: [g.hai2-location], vocab: [w.go1-go1], transform: { instruction: "Ask your friend where his older brother works", answer: "你哥哥喺邊度做嘢呀？", alt: ["你阿哥喺邊度做嘢呀？", "你哥哥喺邊度做嘢？"], en: "Where does your older brother work?" } }
      - { es: "你屋企人鍾意食咩嘢呀？", en: "What does your family like to eat?", altEs: ["你屋企人鍾意食乜嘢呀？", "你屋企人鍾意食咩呀？"], grammar: [g.question-words, g.zung-ji-like], vocab: [w.me1-je5] }
      - { es: "你婆婆最近點呀？", en: "How's your grandma doing these days?", altEs: ["你婆婆點呀？", "你婆婆最近點樣呀？"], grammar: [g.question-words], vocab: [w.po4-po2] }
      - { es: "你同邊個住呀？", en: "Who do you live with?", altEs: ["你同邊個一齊住呀？", "你同邊個住？"], grammar: [g.question-words], vocab: [] }
      - { es: "你媽媽煮乜嘢呀？", en: "What is your mum cooking?", altEs: ["你媽媽煮咩呀？", "你阿媽煮乜嘢呀？"], grammar: [g.question-words], vocab: [w.me1-je5], error: { wrong: "乜嘢你媽媽煮呀？", explain: "The question word stays where the answer goes, after the verb: 你媽媽煮乜嘢？", grammar: g.question-words } }
      - { es: "點解你今日咁開心呀？", en: "Why are you so happy today?", altEs: ["你今日點解咁開心呀？"], grammar: [g.question-words, g.adjective-predicates], vocab: [w.dim2-gaai2, w.hoi1-sam1] }
