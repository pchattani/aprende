      - { es: "Vocês vieram juntos? Que pena... para mim.", en: "Did you two come together? What a pity... for me.", altEs: ["Vocês vieram juntos? Que pena... pra mim."], grammar: [g.preterite-dar-ver-vir], vocab: [w.vir, w.junto, w.que-pena] }
  - id: a2.u02.l4
    title: Datas e anos
    teach: [g.dates-years]
    vocab: [w.século, w.década, w.data, w.época, w.quarto.adj, w.quinto, w.sexto, w.sétimo, w.oitavo, w.nono, w.décimo, w.ganhar-um-prêmio, w.prêmio, w.sertanejo]
    tip: "Read years as ordinary numbers: 1933 = mil novecentos e trinta e três. The first of the month is primeiro: primeiro de janeiro."
    sentences:
      - { es: "O Mercado Municipal abriu em 1933.", en: "The Municipal Market opened in 1933.", altEs: ["O Mercadão abriu em 1933."], grammar: [g.dates-years, g.preterite-regular], vocab: [w.mercado, w.abrir] }
      - { es: "O aniversário de São Paulo é no dia 25 de janeiro.", en: "São Paulo's anniversary is on 25 January.", altEs: ["O aniversário de São Paulo é em 25 de janeiro."], grammar: [g.dates-years], vocab: [w.aniversário], note: "The city was founded on 25 January 1554, and the Mercadão opened on the city's anniversary in 1933." }
      - { es: "O Brasil ficou independente no dia 7 de setembro de 1822.", en: "Brazil became independent on 7 September 1822.", altEs: ["O Brasil ficou independente em 7 de setembro de 1822."], grammar: [g.dates-years, g.preterite-spelling], vocab: [w.independente, w.ficar] }
      - { es: "Nasci no dia primeiro de maio de 1995.", en: "I was born on the first of May 1995.", altEs: ["Nasci em primeiro de maio de 1995.", "Eu nasci no dia primeiro de maio de 1995."], altEn: ["I was born on 1 May 1995."], grammar: [g.dates-years], vocab: [w.nascer, w.primeiro], error: { wrong: "Nasci no dia um de maio de 1995.", explain: "The first day of the month is primeiro: primeiro de maio.", grammar: g.dates-years } }
      - { es: "Qual é a data de hoje? — Hoje é dia vinte de outubro.", en: "What's the date today? — Today is the twentieth of October.", altEs: ["Que dia é hoje? — Hoje é dia vinte de outubro."], grammar: [g.dates-years], vocab: [w.data, w.outubro] }
      - { es: "Moro no quinto andar.", en: "I live on the fifth floor.", altEs: ["Eu moro no quinto andar."], grammar: [g.dates-years], vocab: [w.quinto, w.andar], transform: { instruction: "Change to the eighth floor", answer: "Moro no oitavo andar.", alt: ["Eu moro no oitavo andar."], en: "I live on the eighth floor." } }
      - { es: "Ela chegou em quarto lugar na corrida.", en: "She came fourth in the race.", altEs: ["Ela terminou a corrida em quarto lugar."], altEn: ["She finished fourth in the race."], grammar: [g.dates-years], vocab: [w.quarto.adj, w.corrida, w.lugar] }
      - { es: "É a sexta vez que eu venho ao Mercadão.", en: "It's the sixth time I've come to the Mercadão.", altEs: ["É a sexta vez que venho ao Mercadão."], grammar: [g.dates-years], vocab: [w.sexto, w.vez] }
      - { es: "A sala de reunião fica no sétimo andar.", en: "The meeting room is on the seventh floor.", altEs: ["A sala de reuniões fica no sétimo andar."], grammar: [g.dates-years], vocab: [w.sétimo, w.sala] }
      - { es: "Setembro é o nono mês do ano.", en: "September is the ninth month of the year.", grammar: [g.dates-years], vocab: [w.nono, w.mês] }
      - { es: "Hoje a loja comemora o décimo aniversário.", en: "Today the shop is celebrating its tenth anniversary.", altEs: ["A loja comemora hoje o décimo aniversário."], grammar: [g.dates-years], vocab: [w.décimo, w.comemorar] }
      - { es: "Nos anos 90, a música sertaneja ficou famosa no Brasil inteiro.", en: "In the nineties, sertanejo music became famous all over Brazil.", altEs: ["Na década de 90, a música sertaneja ficou famosa no Brasil inteiro."], grammar: [g.dates-years], vocab: [w.sertanejo, w.famoso] }
      - { es: "Na década de 1950, a cidade cresceu muito.", en: "In the 1950s, the city grew a lot.", altEs: ["Nos anos 50, a cidade cresceu muito."], grammar: [g.dates-years, g.preterite-regular], vocab: [w.década, w.crescer] }
      - { es: "O prédio do Mercadão é do século XX.", en: "The Mercadão building is from the 20th century.", grammar: [g.dates-years], vocab: [w.século, w.prédio], note: "século XX is read século vinte." }
      - { es: "Em que época do ano você prefere viajar?", en: "What time of year do you prefer to travel?", altEs: ["Em qual época do ano você prefere viajar?"], grammar: [g.question-words], vocab: [w.época, w.preferir] }
      - { es: "O cantor ganhou um prêmio em 2019.", en: "The singer won an award in 2019.", altEs: ["Em 2019 o cantor ganhou um prêmio."], grammar: [g.dates-years, g.preterite-regular], vocab: [w.ganhar-um-prêmio, w.prêmio], transform: { instruction: "Write the year in words", answer: "O cantor ganhou um prêmio em dois mil e dezenove.", alt: ["Em dois mil e dezenove o cantor ganhou um prêmio."], en: "The singer won an award in 2019." } }
