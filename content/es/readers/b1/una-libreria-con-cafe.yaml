id: r.b1.una-libreria-con-cafe
level: b1
title: Una librería con café
kind: text
intro: Lucía writes on her blog about her plan to open a bookshop-café in her neighbourhood, and the conditions she still has to meet.
allow: [lucía, elena]
paragraphs:
  - { es: "Hola a todos. Hace un año os conté que quería abrir una librería con café en mi barrio. Hoy, por fin, puedo daros noticias: si todo va bien, abriremos en septiembre. Pero el camino no ha sido fácil.", en: "Hello everyone. A year ago I told you I wanted to open a bookshop with a café in my neighbourhood. Today, at last, I can give you news: if all goes well, we'll open in September. But the road hasn't been easy." }
  - { es: "Lo primero fue el dinero. El banco solo me daba el préstamo con una condición: tener un socio. Así que hablé con mi amiga Elena, que trabaja en una editorial, y le propuse el proyecto. Dijo que sí en cuanto le enseñé el presupuesto.", en: "The first thing was the money. The bank would only give me the loan on one condition: having a partner. So I talked to my friend Elena, who works at a publishing house, and proposed the project to her. She said yes as soon as I showed her the budget." }
  - { es: "Después buscamos un local. Queríamos un sitio en el centro, con mucha luz, para que la gente pueda leer tranquila. Al final encontramos uno antiguo, cerca del mercado. El alquiler es alto, pero el propietario nos ha hecho un descuento con tal de que firmemos por cinco años.", en: "Then we looked for premises. We wanted a place in the centre, with lots of light, so that people can read in peace. In the end we found an old one, near the market. The rent is high, but the owner has given us a discount as long as we sign for five years." }
  - { es: "Ahora estamos con los trámites. Hasta que el ayuntamiento no nos dé el permiso, no podemos empezar las obras. Y en cuanto lo tengamos, los trabajadores necesitarán al menos dos meses.", en: "Now we're dealing with the paperwork. Until the council gives us the permit, we can't start the building work. And as soon as we have it, the workers will need at least two months." }
  - { es: "Mientras tanto, estoy preparando la página web para que los clientes puedan pedir libros desde casa, y una campaña en las redes sociales. También vamos a organizar una fiesta de inauguración, a menos que las obras se retrasen, claro.", en: "In the meantime, I'm preparing the website so that customers can order books from home, and a campaign on social media. We're also going to organise an opening party, unless the building work is delayed, of course." }
  - { es: "Muchos me preguntan si tengo miedo. Pues sí, un poco. Si el negocio fracasa, perderé mis ahorros. Pero si no lo intento, me arrepentiré toda la vida.", en: "Many people ask me if I'm scared. Well yes, a little. If the business fails, I'll lose my savings. But if I don't try, I'll regret it all my life." }
  - { es: "Así que ya sabéis: cuando paséis por el barrio en otoño, entrad a tomar un café y a mirar libros. Y si queréis ayudar antes de que abramos, escribidme: necesitamos gente para pintar las paredes.", en: "So now you know: when you pass through the neighbourhood in autumn, come in for a coffee and to look at books. And if you want to help before we open, write to me: we need people to paint the walls." }
questions:
  - { q: "What condition did the bank set for the loan?", options: ["Having a partner", "Renting a bigger shop", "Saving for five years"], answer: 0 }
  - { q: "Why did the owner of the premises give a discount?", options: ["They paid in cash", "They agreed to sign for five years", "The building is very old"], answer: 1 }
  - { q: "What can't they do until the council gives the permit?", options: ["Buy the books", "Start the building work", "Open the website"], answer: 1 }
  - { q: "What is Lucía most afraid of?", options: ["Losing her savings", "Working too many hours", "Having a partner"], answer: 0 }
glossary:
  - { es: librería, en: bookshop }
  - { es: editorial, en: publishing house }
  - { es: obras, en: building work }
  - { es: organizar, en: to organise }
  - { es: inauguración, en: opening (ceremony) }
  - { es: intentar, en: to try }
  - { es: arrepentirse, en: to regret }
