id: b2.u12
title: "Riquewihr : il paraît que c'est le meilleur"
lessons:
  - id: b2.u12.l1
    title: Le riesling se boit frais
    teach: [g.pronominal-passive]
    vocab: [w.apéritif, w.crémant, w.riesling, w.gewurztraminer, w.se-vendre, w.se-dire, w.se-prononcer, w.arôme, w.fruité, w.moelleux, w.pétillant, w.cuvée, w.cracher, w.tanin, w.bouquet, w.prononciation, w.accent]
    tip: "Thing + se + verb states a general rule or habit: Le riesling se boit frais. Ça ne se fait pas. Ça se prononce comment ? Don't use it for a one-off event, and never add par + agent."
    sentences:
      - { es: "Le riesling se boit frais, entre huit et dix degrés.", en: "Riesling is drunk chilled, between eight and ten degrees.", altEs: ["Le riesling se boit frais, entre 8 et 10 degrés.", "On boit le riesling frais, entre huit et dix degrés."], grammar: [g.pronominal-passive], vocab: [w.riesling, w.frais] }
      - { es: "Le gewurztraminer se boit souvent à l'apéritif ou avec un munster.", en: "Gewurztraminer is often drunk as an aperitif or with a Munster cheese.", altEs: ["On boit souvent le gewurztraminer à l'apéritif ou avec un munster."], grammar: [g.pronominal-passive], vocab: [w.gewurztraminer, w.apéritif] }
      - { es: "Ça ne se fait pas de refuser un verre chez un vigneron !", en: "Turning down a glass at a winegrower's just isn't done!", altEs: ["Ça ne se fait pas, de refuser un verre chez un vigneron !", "On ne refuse pas un verre chez un vigneron !"], grammar: [g.pronominal-passive], vocab: [w.refuser, w.vigneron] }
      - { es: "Comment ça se prononce, Riquewihr ?", en: "How do you pronounce Riquewihr?", altEs: ["Riquewihr, ça se prononce comment ?", "Comment est-ce qu'on prononce Riquewihr ?"], grammar: [g.pronominal-passive, g.dislocation], vocab: [w.se-prononcer] }
      - { es: "Ce crémant se vend surtout à Noël et pour les mariages.", en: "This crémant sells mainly at Christmas and for weddings.", altEs: ["Ce crémant se vend surtout pour Noël et pour les mariages."], grammar: [g.pronominal-passive], vocab: [w.crémant, w.se-vendre, w.mariage] }
      - { es: "Le vin d'Alsace se reconnaît à sa bouteille longue et fine, la flûte.", en: "Alsace wine can be recognised by its long, slender bottle, the flûte.", altEs: ["On reconnaît le vin d'Alsace à sa bouteille longue et fine, la flûte."], grammar: [g.pronominal-passive], vocab: [w.reconnaître, w.bouteille] }
      - { es: "Ça se voit que tu as goûté trop de vins : tu as les joues toutes rouges !", en: "It shows that you've tasted too many wines: your cheeks are all red!", altEs: ["Ça se voit que tu as goûté trop de vins, tu as les joues toutes rouges !"], grammar: [g.pronominal-passive], vocab: [w.goûter] }
      - { es: "Pendant une dégustation, le vin se goûte, puis se crache.", en: "At a tasting, wine is tasted, then spat out.", altEs: ["Pendant une dégustation, on goûte le vin, puis on le crache."], grammar: [g.pronominal-passive], vocab: [w.cracher, w.dégustation] }
      - { es: "Il se vend des millions de bouteilles de vin d'Alsace chaque année.", en: "Millions of bottles of Alsace wine are sold every year.", altEs: ["On vend des millions de bouteilles de vin d'Alsace chaque année."], grammar: [g.pronominal-passive, g.impersonal-constructions], vocab: [w.se-vendre] }
      - { es: "Cette cuvée se garde dix ans en cave sans problème.", en: "This cuvée keeps for ten years in the cellar with no problem.", altEs: ["Cette cuvée peut se garder dix ans en cave sans problème."], grammar: [g.pronominal-passive], vocab: [w.cuvée, w.cave] }
      - { es: "Un vin moelleux, ça se boit avec le dessert ; un vin pétillant, plutôt à l'apéritif.", en: "A sweet wine goes with dessert; a sparkling wine, more as an aperitif.", altEs: ["Un vin moelleux se boit avec le dessert ; un vin pétillant, plutôt à l'apéritif."], grammar: [g.pronominal-passive, g.dislocation], vocab: [w.moelleux, w.pétillant] }
      - { es: "Ce vin a un arôme fruité et un joli bouquet, mais très peu de tanin.", en: "This wine has a fruity aroma and a nice bouquet, but very little tannin.", altEs: ["Ce vin a un arôme fruité et un beau bouquet, mais très peu de tanin."], grammar: [g.quantities], vocab: [w.arôme, w.fruité, w.bouquet, w.tanin] }
      - { es: "L'accent alsacien s'entend tout de suite, même en français.", en: "The Alsatian accent can be heard straight away, even in French.", altEs: ["On entend tout de suite l'accent alsacien, même en français."], grammar: [g.pronominal-passive], vocab: [w.accent, w.alsacien] }
      - { es: "On boit le crémant très frais.", en: "Crémant is drunk well chilled.", grammar: [g.pronominal-passive, g.on-instead-of-passive], vocab: [w.crémant], transform: { instruction: "Rewrite with the pronominal passive", answer: "Le crémant se boit très frais.", en: "Crémant is drunk well chilled." } }
      - { es: "On ne dit plus ce mot aujourd'hui.", en: "People don't say that word any more.", grammar: [g.pronominal-passive], vocab: [w.mot], transform: { instruction: "Rewrite with the pronominal passive (ce mot…)", answer: "Ce mot ne se dit plus aujourd'hui.", en: "That word isn't used any more today." } }
      - { es: "On a bu toute la bouteille hier soir.", en: "We drank the whole bottle last night.", altEs: ["Nous avons bu toute la bouteille hier soir."], grammar: [g.pronominal-passive, g.on-nous], vocab: [w.bouteille], error: { wrong: "Toute la bouteille s'est bue hier soir.", explain: "The pronominal passive is for general truths and habits, not one-off events: say on a bu toute la bouteille.", grammar: g.pronominal-passive } }
    exchanges:
      - q: { es: "Le riesling, ça se boit avec quoi ?", en: "What does riesling go with?" }
        a: { es: "Ça se boit très bien avec le poisson ou la choucroute.", en: "It goes very well with fish or choucroute." }
        alt: ["Avec du poisson.", "Avec une choucroute, évidemment !"]
        grammar: [g.pronominal-passive]
        vocab: [w.riesling, w.choucroute]
      - q: { es: "Comment ça s'écrit, gewurztraminer ?", en: "How do you spell gewurztraminer?" }
        a: { es: "Sans accent sur le « u » en France, mais avec un tréma en allemand.", en: "Without an accent on the 'u' in France, but with an umlaut in German." }
        alt: ["G-E-W-U-R-Z-T-R-A-M-I-N-E-R.", "Comme ça se prononce, ou presque."]
        grammar: [g.pronominal-passive]
        vocab: [w.gewurztraminer, w.accent]
      - q: { es: "On peut cracher le vin ?", en: "Can you spit the wine out?" }
        a: { es: "Oui, ça se fait pendant les dégustations ; il y a un seau pour ça.", en: "Yes, it's what people do at tastings; there's a bucket for it." }
        alt: ["Oui, bien sûr.", "Oui, surtout si vous conduisez."]
        grammar: [g.pronominal-passive]
        vocab: [w.cracher]
      - q: { es: "Il se vend bien, ce crémant ?", en: "Does this crémant sell well?" }
        a: { es: "Très bien : il se vend surtout en décembre, pour les fêtes.", en: "Very well: it sells mostly in December, for the holidays." }
        alt: ["Oui, très bien.", "Ça dépend de la saison."]
        grammar: [g.pronominal-passive]
        vocab: [w.se-vendre, w.crémant]
      - q: { es: "Tu sens l'arôme ?", en: "Can you smell the aroma?" }
        a: { es: "Oui, ça sent la rose et le litchi ; ça se reconnaît facilement.", en: "Yes, it smells of rose and lychee; it's easy to recognise." }
        alt: ["Oui, c'est très fruité.", "Pas vraiment, j'ai le nez bouché."]
        grammar: [g.pronominal-passive]
        vocab: [w.arôme]
    texts:
      - title: "Fiche du caviste"
        es: ["Riesling : vin sec, au bouquet minéral.", "Il se boit frais, avec les poissons et les fruits de mer.", "Il se garde de cinq à dix ans."]
        en: ["Riesling: dry wine with a mineral bouquet.", "It is drunk chilled, with fish and seafood.", "It keeps for five to ten years."]
        grammar: [g.pronominal-passive]
        vocab: [w.riesling, w.bouquet]
      - title: "Petit guide de la dégustation"
        es: ["Le vin se regarde, se sent, puis se goûte.", "Entre deux vins, il se crache dans le seau.", "Et un bon crémant, ça ne se refuse jamais !"]
        en: ["Wine is looked at, smelled, then tasted.", "Between two wines, it's spat into the bucket.", "And a good crémant is never turned down!"]
        grammar: [g.pronominal-passive]
        vocab: [w.cracher, w.crémant]
    spicy:
      - { es: "Le crémant se boit frais ; les compliments, eux, se disent tout de suite.", en: "Crémant is drunk chilled; compliments, on the other hand, are said straight away.", altEs: ["Le crémant se boit frais, mais les compliments se disent tout de suite."], grammar: [g.pronominal-passive, g.dislocation], vocab: [w.crémant, w.compliment] }
      - { es: "Ça se voit que tu me plais ? Je pensais être plus discret.", en: "Does it show that I fancy you? I thought I was being more discreet.", altEs: ["Ça se voit que tu me plais ? Je pensais être plus discrète."], grammar: [g.pronominal-passive], vocab: [w.plaire, w.discret] }
      - { es: "Un baiser, ça ne se demande pas : ça se mérite.", en: "A kiss isn't something you ask for: it's something you earn.", altEs: ["Un baiser, ça ne se demande pas, ça se mérite."], grammar: [g.pronominal-passive, g.dislocation], vocab: [w.mériter] }
      - { es: "Ton prénom se prononce comme une chanson ; répète-le, s'il te plaît.", en: "Your name sounds like a song; say it again, please.", altEs: ["Ton prénom se prononce comme une chanson, répète-le, s'il te plaît."], grammar: [g.pronominal-passive, g.imperative-with-pronouns], vocab: [w.se-prononcer] }
      - { es: "Il paraît que le gewurztraminer se marie bien avec le fromage ; nous, on se marie quand ?", en: "Apparently gewurztraminer goes well with cheese; and us, when are we getting married?", altEs: ["Il paraît que le gewurztraminer se marie bien avec le fromage ; et nous, on se marie quand ?"], grammar: [g.pronominal-passive, g.impersonal-constructions], vocab: [w.gewurztraminer], note: "Se marier avec = to go well with (food and wine) and to marry." }
  - id: b2.u12.l2
    title: Il suffit de suivre la route des vins
    teach: [g.impersonal-constructions]
    vocab: [w.il-s-agit-de, w.s-agir, w.il-suffit-de, w.suffire, w.il-reste, w.il-manque, w.il-arrive-que, w.il-convient-de, w.convenir, w.il-est-recommandé-de, w.recommandation, w.serpenter, w.route-des-vins, w.coopérative, w.vendangeur, w.grappe]
    tip: "Impersonal il refers to nothing: il s'agit de (it's about), il paraît que (apparently), il reste / il manque (there's … left / missing), il suffit de (all you need is), il arrive que + subjonctif (it sometimes happens that). The verb stays singular: il reste trois places."
    sentences:
      - { es: "Il paraît que Riquewihr est l'un des plus beaux villages de France.", en: "Apparently Riquewihr is one of the most beautiful villages in France.", altEs: ["On dit que Riquewihr est l'un des plus beaux villages de France."], grammar: [g.impersonal-constructions, g.superlatives], vocab: [w.village], note: "Riquewihr belongs to the association Les Plus Beaux Villages de France." }
      - { es: "Dans ce film, il s'agit d'une famille de vignerons alsaciens.", en: "This film is about a family of Alsatian winegrowers.", altEs: ["Ce film parle d'une famille de vignerons alsaciens."], grammar: [g.impersonal-constructions], vocab: [w.il-s-agit-de, w.vigneron] }
      - { es: "Il ne reste plus que trois bouteilles de crémant.", en: "There are only three bottles of crémant left.", altEs: ["Il reste seulement trois bouteilles de crémant."], grammar: [g.impersonal-constructions, g.negation-jamais-plus-rien], vocab: [w.il-reste, w.crémant] }
      - { es: "Il suffit de suivre la route des vins : elle serpente entre les vignes et les villages.", en: "All you have to do is follow the wine route: it winds between the vineyards and the villages.", altEs: ["Il suffit de suivre la route des vins, elle serpente entre les vignes et les villages."], grammar: [g.impersonal-constructions], vocab: [w.il-suffit-de, w.route-des-vins, w.serpenter] }
      - { es: "Il manque deux verres sur la table ; tu peux en apporter ?", en: "There are two glasses missing on the table; can you bring some?", altEs: ["Il manque deux verres sur la table, tu peux en apporter ?"], grammar: [g.impersonal-constructions, g.pronoun-en], vocab: [w.il-manque, w.verre] }
      - { es: "Il arrive qu'il gèle en avril, et les vignerons passent la nuit dans les vignes.", en: "It sometimes freezes in April, and the winegrowers spend the night in the vineyards.", altEs: ["Il arrive qu'il gèle en avril ; alors les vignerons passent la nuit dans les vignes."], grammar: [g.impersonal-constructions], vocab: [w.il-arrive-que, w.geler] }
      - { es: "Il vaut mieux réserver la dégustation : le samedi, c'est toujours complet.", en: "It's better to book the tasting: on Saturdays it's always full.", altEs: ["Il vaut mieux réserver pour la dégustation : le samedi, c'est toujours plein."], grammar: [g.impersonal-constructions], vocab: [w.réserver, w.dégustation] }
      - { es: "Il convient de goûter les vins secs avant les vins moelleux.", en: "It's advisable to taste dry wines before sweet ones.", altEs: ["Il est conseillé de goûter les vins secs avant les vins moelleux."], grammar: [g.impersonal-constructions], vocab: [w.il-convient-de, w.moelleux] }
      - { es: "Il est recommandé de ne pas conduire après une dégustation.", en: "It is recommended not to drive after a tasting.", altEs: ["Il est conseillé de ne pas conduire après une dégustation."], grammar: [g.impersonal-constructions], vocab: [w.il-est-recommandé-de, w.conduire] }
      - { es: "Par hasard, je connais le vigneron : c'est mon cousin.", en: "As it happens, I know the winegrower: he's my cousin.", grammar: [g.impersonal-constructions], vocab: [w.vigneron, w.cousin], transform: { instruction: "Rewrite with il se trouve que", answer: "Il se trouve que je connais le vigneron : c'est mon cousin.", alt: ["Il se trouve que je connais le vigneron, c'est mon cousin."], en: "It so happens that I know the winegrower: he's my cousin." } }
      - { es: "Pour le crémant, il faut que les grappes soient vendangées à la main.", en: "For crémant, the bunches have to be picked by hand.", altEs: ["Pour le crémant, les grappes doivent être vendangées à la main."], grammar: [g.impersonal-constructions, g.subjonctif-necessite], vocab: [w.grappe, w.vendanger] }
      - { es: "La coopérative cherche des vendangeurs : il est question de commencer lundi.", en: "The cooperative is looking for grape pickers: there's talk of starting on Monday.", altEs: ["La coopérative recherche des vendangeurs ; il est question de commencer lundi."], grammar: [g.impersonal-constructions], vocab: [w.coopérative, w.vendangeur] }
      - { es: "Cette date ne me convient pas ; il vaudrait mieux venir dimanche.", en: "That date doesn't suit me; it would be better to come on Sunday.", altEs: ["Cette date ne me va pas ; il vaudrait mieux venir dimanche."], grammar: [g.impersonal-constructions, g.conditionnel-present], vocab: [w.convenir] }
      - { es: "Deux places sont encore libres pour la visite.", en: "Two places are still free for the tour.", grammar: [g.impersonal-constructions], vocab: [w.place], transform: { instruction: "Rewrite with il reste", answer: "Il reste deux places pour la visite.", alt: ["Il reste encore deux places pour la visite."], en: "There are two places left for the tour." } }
      - { es: "Ce livre parle de la route des vins.", en: "This book is about the wine route.", altEs: ["Dans ce livre, il s'agit de la route des vins."], grammar: [g.impersonal-constructions], vocab: [w.route-des-vins, w.s-agir], error: { wrong: "Ce livre s'agit de la route des vins.", explain: "S'agir is only impersonal: dans ce livre, il s'agit de… or ce livre parle de…", grammar: g.impersonal-constructions } }
      - { es: "Il manque deux chaises dans la salle de dégustation.", en: "There are two chairs missing in the tasting room.", grammar: [g.impersonal-constructions], vocab: [w.il-manque, w.chaise], error: { wrong: "Il manquent deux chaises dans la salle de dégustation.", explain: "With impersonal il, the verb stays singular: il manque deux chaises.", grammar: g.impersonal-constructions } }
    exchanges:
      - q: { es: "Il reste du riesling ?", en: "Is there any riesling left?" }
        a: { es: "Il en reste une bouteille, mais elle n'est pas fraîche.", en: "There's one bottle left, but it isn't chilled." }
        alt: ["Non, il n'en reste plus.", "Oui, il en reste deux."]
        grammar: [g.impersonal-constructions, g.pronoun-en]
        vocab: [w.il-reste, w.riesling]
      - q: { es: "Comment on va à Riquewihr ?", en: "How do you get to Riquewihr?" }
        a: { es: "Il suffit de prendre la route des vins depuis Colmar ; c'est à une quinzaine de kilomètres.", en: "You just take the wine route from Colmar; it's about fifteen kilometres away." }
        alt: ["Par la route des vins.", "Il suffit de suivre les panneaux."]
        grammar: [g.impersonal-constructions]
        vocab: [w.il-suffit-de, w.route-des-vins]
      - q: { es: "De quoi s'agit-il ?", en: "What's it about?" }
        a: { es: "Il s'agit d'une erreur : on nous a facturé six bouteilles au lieu de cinq.", en: "It's a mistake: we were charged for six bottles instead of five." }
        alt: ["D'une erreur sur l'addition.", "Il s'agit de la réservation de samedi."]
        grammar: [g.impersonal-constructions]
        vocab: [w.il-s-agit-de]
      - q: { es: "Il gèle souvent au printemps ?", en: "Does it often freeze in spring?" }
        a: { es: "Non, mais il arrive qu'il gèle en avril, et c'est une catastrophe pour les vignes.", en: "No, but it sometimes freezes in April, and that's a disaster for the vines." }
        alt: ["Ça arrive, malheureusement.", "Rarement, heureusement."]
        grammar: [g.impersonal-constructions]
        vocab: [w.il-arrive-que, w.geler]
      - q: { es: "Qu'est-ce qui manque pour l'apéritif ?", en: "What's missing for the aperitif?" }
        a: { es: "Il manque juste les bretzels et un tire-bouchon.", en: "We're just missing the pretzels and a corkscrew." }
        alt: ["Rien, tout est prêt.", "Il manque des verres."]
        grammar: [g.impersonal-constructions]
        vocab: [w.il-manque, w.apéritif]
    texts:
      - title: "Recommandations de l'office de tourisme"
        es: ["Il est recommandé de visiter Riquewihr tôt le matin.", "Il suffit de passer sous la tour du Dolder pour entrer dans la vieille ville.", "Il convient de respecter le calme des habitants."]
        en: ["It is recommended to visit Riquewihr early in the morning.", "You simply walk under the Dolder tower to enter the old town.", "Please respect the residents' peace and quiet."]
        grammar: [g.impersonal-constructions]
        vocab: [w.il-est-recommandé-de, w.il-suffit-de, w.il-convient-de]
      - title: "Annonce de la coopérative"
        es: ["Vendanges : il nous manque encore dix vendangeurs.", "Il s'agit d'un travail physique, mais l'ambiance est excellente.", "Il reste quelques places au dortoir."]
        en: ["Grape harvest: we're still ten pickers short.", "It's physical work, but the atmosphere is excellent.", "There are a few places left in the dormitory."]
        grammar: [g.impersonal-constructions]
        vocab: [w.il-manque, w.il-s-agit-de, w.vendangeur]
    spicy:
      - { es: "Il paraît que tu danses très bien ; il ne reste plus qu'à me le prouver.", en: "Apparently you dance very well; all that's left is to prove it to me.", altEs: ["Il paraît que tu danses très bien ; il ne te reste plus qu'à me le prouver."], grammar: [g.impersonal-constructions], vocab: [w.il-reste] }
      - { es: "Il suffit d'un sourire de toi pour que j'oublie mon régime.", en: "All it takes is one smile from you for me to forget my diet.", altEs: ["Il suffit d'un de tes sourires pour que j'oublie mon régime."], grammar: [g.impersonal-constructions, g.subjonctif-conjonctions], vocab: [w.il-suffit-de] }
      - { es: "Il manque quelque chose à cette soirée parfaite… ah oui, ton numéro.", en: "Something's missing from this perfect evening… oh yes, your number.", altEs: ["Il manque une chose à cette soirée parfaite… ah oui, ton numéro."], grammar: [g.impersonal-constructions], vocab: [w.il-manque] }
      - { es: "Il arrive que je pense à toi pendant les réunions ; mon patron trouve que je souris beaucoup.", en: "Sometimes I think about you during meetings; my boss thinks I smile a lot.", altEs: ["Il m'arrive de penser à toi pendant les réunions ; mon patron trouve que je souris beaucoup."], grammar: [g.impersonal-constructions], vocab: [w.il-arrive-que] }
      - { es: "Il ne s'agit pas d'un rendez-vous, juste d'une dégustation à deux… aux chandelles.", en: "It's not a date, just a tasting for two… by candlelight.", altEs: ["Ce n'est pas un rendez-vous, juste une dégustation à deux… aux chandelles."], grammar: [g.impersonal-constructions], vocab: [w.il-s-agit-de, w.dégustation] }
  - id: b2.u12.l3
    title: Il me semble que c'est un peu sucré
    teach: [g.opinion-nuance]
    vocab: [w.impression, w.avoir-l-impression, w.persuader, w.nuancer, w.nuance, w.relativement, w.légèrement, w.particulièrement, w.extrêmement, w.plus-ou-moins, w.dans-l-ensemble, w.en-général, w.en-principe, w.à-vrai-dire, w.franchement, w.honnêtement, w.personnellement, w.prétendu, w.supposé, w.discutable, w.indéniable, w.incontestable, w.contestable, w.pertinent, w.sceptique, w.dubitatif]
    tip: "Soften with il me semble que, j'ai l'impression que, je dirais que (+ indicative); strengthen with je suis persuadé que, il est indéniable que; concede with certes… mais, j'avoue que. Je ne suis pas sûr que takes the subjonctif."
    sentences:
      - { es: "Il me semble que le riesling se marie mieux avec le poisson.", en: "It seems to me that riesling goes better with fish.", altEs: ["J'ai l'impression que le riesling se marie mieux avec le poisson."], grammar: [g.opinion-nuance], vocab: [w.riesling, w.poisson] }
      - { es: "J'ai l'impression que les prix ont beaucoup augmenté cette année.", en: "I have the feeling prices have gone up a lot this year.", altEs: ["Il me semble que les prix ont beaucoup augmenté cette année."], grammar: [g.opinion-nuance], vocab: [w.avoir-l-impression, w.prix] }
      - { es: "Je dirais plutôt que c'est une question de goût.", en: "I'd rather say it's a matter of taste.", altEs: ["Je dirais que c'est plutôt une question de goût."], grammar: [g.opinion-nuance, g.conditional-politeness], vocab: [w.goût] }
      - { es: "Certes, ce vin est cher, mais il vaut son prix.", en: "Admittedly this wine is expensive, but it's worth the price.", altEs: ["Ce vin est cher, certes, mais il vaut son prix."], grammar: [g.opinion-nuance, g.concession], vocab: [w.certes, w.valoir] }
      - { es: "Je suis persuadé que cette cuvée vieillira très bien.", en: "I'm convinced this cuvée will age very well.", altEs: ["Je suis persuadée que cette cuvée vieillira très bien.", "Je suis convaincu que cette cuvée vieillira très bien."], grammar: [g.opinion-nuance], vocab: [w.persuader, w.cuvée, w.vieillir] }
      - { es: "Franchement, je le trouve légèrement trop sucré.", en: "Frankly, I find it slightly too sweet.", altEs: ["Honnêtement, je le trouve légèrement trop sucré."], grammar: [g.opinion-nuance], vocab: [w.franchement, w.légèrement, w.sucré] }
      - { es: "À vrai dire, je ne suis pas sûre que ce soit un riesling.", en: "To tell the truth, I'm not sure it's a riesling.", altEs: ["À vrai dire, je ne suis pas sûr que ce soit un riesling."], grammar: [g.opinion-nuance, g.subjonctif-doute], vocab: [w.à-vrai-dire] }
      - { es: "Personnellement, je préfère les vins secs ; mais dans l'ensemble, la dégustation était excellente.", en: "Personally, I prefer dry wines; but on the whole, the tasting was excellent.", altEs: ["Moi, personnellement, je préfère les vins secs ; mais dans l'ensemble, la dégustation était excellente."], grammar: [g.opinion-nuance], vocab: [w.personnellement, w.dans-l-ensemble, w.sec] }
      - { es: "C'est un argument pertinent, mais relativement discutable.", en: "It's a relevant argument, but a fairly debatable one.", altEs: ["L'argument est pertinent, mais relativement discutable."], grammar: [g.opinion-nuance], vocab: [w.pertinent, w.relativement, w.discutable] }
      - { es: "Il est indéniable que le village est magnifique ; qu'il soit le plus beau de France, c'est discutable.", en: "It's undeniable that the village is magnificent; whether it's the most beautiful in France is debatable.", altEs: ["Le village est indéniablement magnifique ; qu'il soit le plus beau de France, c'est discutable."], grammar: [g.opinion-nuance, g.subjonctif-doute], vocab: [w.indéniable, w.discutable] }
      - { es: "Son prétendu grand vin m'a laissé plutôt sceptique.", en: "His so-called great wine left me rather sceptical.", altEs: ["Son soi-disant grand vin m'a laissé plutôt sceptique."], grammar: [g.opinion-nuance], vocab: [w.prétendu, w.sceptique] }
      - { es: "En principe, le gewurztraminer est extrêmement parfumé.", en: "In principle, gewurztraminer is extremely aromatic.", altEs: ["En général, le gewurztraminer est extrêmement parfumé."], grammar: [g.opinion-nuance], vocab: [w.en-principe, w.extrêmement, w.parfumé] }
      - { es: "Il faut nuancer : tous les vins d'Alsace ne sont pas sucrés, loin de là.", en: "We need to qualify that: not all Alsace wines are sweet, far from it.", altEs: ["Il faut nuancer : les vins d'Alsace ne sont pas tous sucrés, loin de là."], grammar: [g.opinion-nuance], vocab: [w.nuancer, w.sucré] }
      - { es: "Je pense que ce vin est trop cher.", en: "I think this wine is too expensive.", grammar: [g.opinion-nuance], vocab: [w.cher], transform: { instruction: "Soften it with il me semble que and un peu", answer: "Il me semble que ce vin est un peu cher.", alt: ["Il me semble que ce vin est un peu trop cher.", "J'ai l'impression que ce vin est un peu cher."], en: "It seems to me this wine is a bit expensive." } }
      - { es: "Ce vin est le meilleur de la région.", en: "This wine is the best in the region.", grammar: [g.opinion-nuance], vocab: [w.meilleur], transform: { instruction: "Turn it into a strong conviction: Je suis persuadé que…", answer: "Je suis persuadé que ce vin est le meilleur de la région.", alt: ["Je suis persuadée que ce vin est le meilleur de la région.", "Je suis convaincu que ce vin est le meilleur de la région."], en: "I'm convinced this wine is the best in the region." } }
      - { es: "Il me semble que ce vin est encore trop jeune.", en: "It seems to me this wine is still too young.", altEs: ["J'ai l'impression que ce vin est encore trop jeune."], grammar: [g.opinion-nuance], vocab: [w.jeune], error: { wrong: "Il me semble que ce vin soit encore trop jeune.", explain: "Il me semble que takes the indicative: est, not soit.", grammar: g.opinion-nuance } }
    exchanges:
      - q: { es: "Tu as aimé le gewurztraminer ?", en: "Did you like the gewurztraminer?" }
        a: { es: "Dans l'ensemble, oui, même si je l'ai trouvé un peu trop sucré.", en: "On the whole, yes, even if I found it a bit too sweet." }
        alt: ["Plus ou moins.", "Franchement, pas trop."]
        grammar: [g.opinion-nuance]
        vocab: [w.dans-l-ensemble, w.sucré]
      - q: { es: "Tu es d'accord avec moi ?", en: "Do you agree with me?" }
        a: { es: "Dans une certaine mesure, mais il faut nuancer un peu.", en: "To a certain extent, but you need to qualify it a little." }
        alt: ["Pas tout à fait.", "Tout à fait !"]
        grammar: [g.opinion-nuance]
        vocab: [w.nuancer]
      - q: { es: "C'est vraiment le plus beau village d'Alsace ?", en: "Is it really the most beautiful village in Alsace?" }
        a: { es: "Ça, c'est discutable ; il est particulièrement beau, mais il y en a d'autres.", en: "That's debatable; it's particularly beautiful, but there are others." }
        alt: ["C'est une question de goût.", "Il paraît, mais je suis sceptique."]
        grammar: [g.opinion-nuance]
        vocab: [w.discutable, w.particulièrement]
      - q: { es: "Il est bon, ce crémant ?", en: "Is this crémant good?" }
        a: { es: "Honnêtement ? Il est plus ou moins buvable.", en: "Honestly? It's more or less drinkable." }
        alt: ["Excellent !", "Pas mal, sans plus."]
        grammar: [g.opinion-nuance]
        vocab: [w.honnêtement, w.plus-ou-moins]
      - q: { es: "Quelle est ton impression générale ?", en: "What's your overall impression?" }
        a: { es: "En général, j'ai l'impression que les petits vignerons font les meilleurs vins.", en: "In general, I have the feeling that the small winegrowers make the best wines." }
        alt: ["Très bonne, dans l'ensemble.", "Je suis plutôt dubitatif."]
        grammar: [g.opinion-nuance]
        vocab: [w.impression, w.en-général]
    texts:
      - title: "Commentaire sur un forum"
        es: ["À vrai dire, j'avais des doutes avant la dégustation.", "Il me semble pourtant que ces vins sont incontestablement réussis.", "Seule nuance : les prix me paraissent légèrement excessifs."]
        en: ["To tell the truth, I had doubts before the tasting.", "Yet it seems to me that these wines are indisputably successful.", "The only reservation: the prices seem slightly excessive to me."]
        grammar: [g.opinion-nuance]
        vocab: [w.à-vrai-dire, w.incontestable, w.nuance]
      - title: "Réponse d'un vigneron"
        es: ["Merci pour votre avis, que je trouve pertinent.", "Je suis persuadé, cependant, que nos prix sont justes.", "Ce prétendu excès s'explique par les vendanges à la main."]
        en: ["Thank you for your opinion, which I find relevant.", "I'm convinced, however, that our prices are fair.", "This so-called excess is explained by hand harvesting."]
        grammar: [g.opinion-nuance, g.pronominal-passive]
        vocab: [w.pertinent, w.persuader, w.prétendu]
    spicy:
      - { es: "Il me semble que tu me regardes depuis une heure ; je me trompe ?", en: "It seems to me you've been looking at me for an hour; am I wrong?", altEs: ["J'ai l'impression que tu me regardes depuis une heure ; je me trompe ?"], grammar: [g.opinion-nuance, g.depuis-present], vocab: [w.se-tromper] }
      - { es: "J'ai l'impression que le vin te rend particulièrement charmant ce soir.", en: "I have the feeling the wine is making you particularly charming tonight.", altEs: ["Il me semble que le vin te rend particulièrement charmant ce soir."], grammar: [g.opinion-nuance], vocab: [w.avoir-l-impression, w.particulièrement] }
      - { es: "Personnellement, je suis persuadé qu'un deuxième rendez-vous serait une excellente idée.", en: "Personally, I'm convinced a second date would be an excellent idea.", altEs: ["Personnellement, je suis persuadée qu'un deuxième rendez-vous serait une excellente idée."], grammar: [g.opinion-nuance, g.conditionnel-present], vocab: [w.personnellement, w.persuader] }
      - { es: "Ton charme est indéniable ; ton sens de l'orientation, beaucoup plus discutable.", en: "Your charm is undeniable; your sense of direction, much more debatable.", altEs: ["Ton charme est indéniable, ton sens de l'orientation beaucoup plus discutable."], grammar: [g.opinion-nuance], vocab: [w.indéniable, w.discutable] }
      - { es: "Franchement, tu es légèrement trop beau pour une dégustation ; les gens ne regardent pas les vins.", en: "Frankly, you're slightly too good-looking for a tasting; people aren't looking at the wines.", altEs: ["Honnêtement, tu es légèrement trop beau pour une dégustation : les gens ne regardent pas les vins."], grammar: [g.opinion-nuance], vocab: [w.franchement, w.légèrement] }
  - id: b2.u12.l4
    title: Ça se dit comment en alsacien ?
    teach: [g.pronominal-passive, g.opinion-nuance]
    vocab: [w.dialecte, w.patois, w.bilinguisme, w.germanique, w.frontalier, w.frontalier.n, w.généraliser, w.habituellement, w.traditionnellement, w.seau]
    tip: "Talk about languages with the pronominal passive (ça se dit, ça s'écrit, ça ne se traduit pas) and keep your opinions nuanced: il ne faut pas généraliser, j'ai l'impression que…"
    sentences:
      - { es: "Comment ça se dit en alsacien, « bonjour » ? — On dit « Salü ».", en: "How do you say 'hello' in Alsatian? — You say 'Salü'.", altEs: ["« Bonjour », ça se dit comment en alsacien ? — On dit « Salü »."], grammar: [g.pronominal-passive], vocab: [w.se-dire, w.alsacien] }
      - { es: "L'alsacien est un dialecte germanique, proche de l'allemand parlé en Suisse.", en: "Alsatian is a Germanic dialect, close to the German spoken in Switzerland.", altEs: ["L'alsacien est un dialecte germanique, proche du suisse allemand."], grammar: [g.participial-clauses], vocab: [w.dialecte, w.germanique] }
      - { es: "J'ai l'impression qu'on entend de moins en moins le dialecte dans les rues.", en: "I have the feeling you hear the dialect less and less in the streets.", altEs: ["Il me semble qu'on entend de moins en moins le dialecte dans les rues."], grammar: [g.opinion-nuance], vocab: [w.avoir-l-impression, w.dialecte] }
      - { es: "Traditionnellement, l'alsacien se parlait en famille et le français à l'école.", en: "Traditionally, Alsatian was spoken in the family and French at school.", altEs: ["Traditionnellement, on parlait alsacien en famille et français à l'école."], grammar: [g.pronominal-passive, g.imparfait-uses], vocab: [w.traditionnellement, w.famille] }
      - { es: "Il ne faut pas généraliser : certains jeunes apprennent l'alsacien et l'allemand à l'école.", en: "You mustn't generalise: some young people learn Alsatian and German at school.", altEs: ["Il ne faut pas généraliser, certains jeunes apprennent l'alsacien et l'allemand à l'école."], grammar: [g.opinion-nuance, g.il-faut], vocab: [w.généraliser, w.jeune] }
      - { es: "Habituellement, les frontaliers traversent le Rhin chaque matin pour aller travailler en Allemagne.", en: "Cross-border commuters usually cross the Rhine every morning to go to work in Germany.", altEs: ["D'habitude, les frontaliers traversent le Rhin chaque matin pour aller travailler en Allemagne."], grammar: [g.purpose-clauses], vocab: [w.habituellement, w.frontalier.n] }
      - { es: "Il me semble que le bilinguisme est un atout dans une région frontalière.", en: "It seems to me that bilingualism is an asset in a border region.", altEs: ["J'ai l'impression que le bilinguisme est un atout dans une région frontalière."], grammar: [g.opinion-nuance], vocab: [w.bilinguisme, w.frontalier] }
      - { es: "Le patois de mon grand-père, je le comprends à peine.", en: "My grandfather's dialect, I can barely understand it.", altEs: ["Je comprends à peine le patois de mon grand-père."], grammar: [g.dislocation], vocab: [w.patois, w.à-peine] }
      - { es: "Il arrive que mes grands-parents passent du français à l'alsacien au milieu d'une phrase.", en: "Sometimes my grandparents switch from French to Alsatian in the middle of a sentence.", altEs: ["Il arrive que mes grands-parents passent du français à l'alsacien en pleine phrase."], grammar: [g.impersonal-constructions], vocab: [w.il-arrive-que, w.phrase] }
      - { es: "Ce mot ne se traduit pas : il n'a pas d'équivalent en français.", en: "This word can't be translated: it has no equivalent in French.", altEs: ["Ce mot ne se traduit pas, il n'a pas d'équivalent en français."], grammar: [g.pronominal-passive], vocab: [w.mot] }
      - { es: "Riquewihr, ça s'écrit avec un « h » ; mais le « h » ne se prononce pas.", en: "Riquewihr is spelled with an 'h'; but the 'h' isn't pronounced.", altEs: ["Riquewihr s'écrit avec un « h », mais le « h » ne se prononce pas."], grammar: [g.pronominal-passive], vocab: [w.se-prononcer, w.écrire] }
      - { es: "Les panneaux bilingues se voient partout dans les villages de la route des vins.", en: "Bilingual signs can be seen everywhere in the villages on the wine route.", altEs: ["On voit des panneaux bilingues partout dans les villages de la route des vins."], grammar: [g.pronominal-passive], vocab: [w.bilingue, w.panneau] }
      - { es: "On écrit ce nom avec deux « s ».", en: "This name is written with two s's.", grammar: [g.pronominal-passive], vocab: [w.nom], transform: { instruction: "Rewrite with the pronominal passive", answer: "Ce nom s'écrit avec deux « s ».", en: "This name is spelled with two s's." } }
      - { es: "Selon les gens, la fête du vin est géniale.", en: "According to people, the wine festival is great.", grammar: [g.impersonal-constructions], vocab: [w.fête], transform: { instruction: "Rewrite with il paraît que", answer: "Il paraît que la fête du vin est géniale.", en: "Apparently the wine festival is great." } }
      - { es: "Le dialecte se parle encore dans les villages.", en: "The dialect is still spoken in the villages.", altEs: ["On parle encore le dialecte dans les villages."], grammar: [g.pronominal-passive], vocab: [w.dialecte, w.village], error: { wrong: "Le dialecte se parle encore par les villageois.", explain: "The pronominal passive never takes an agent with par. Say on parle encore le dialecte dans les villages, or les villageois parlent encore le dialecte.", grammar: g.pronominal-passive } }
      - { es: "Je ne suis pas sûr que l'alsacien disparaisse un jour.", en: "I'm not sure Alsatian will ever disappear.", altEs: ["Je ne suis pas sûre que l'alsacien disparaisse un jour."], grammar: [g.opinion-nuance, g.subjonctif-doute], vocab: [w.disparaître], error: { wrong: "Je ne suis pas sûr que l'alsacien disparaît un jour.", explain: "Je ne suis pas sûr que expresses doubt and takes the subjonctif: disparaisse.", grammar: g.opinion-nuance } }
    exchanges:
      - q: { es: "Tu parles alsacien ?", en: "Do you speak Alsatian?" }
        a: { es: "Je le comprends plus ou moins, mais je le parle très mal.", en: "I understand it more or less, but I speak it very badly." }
        alt: ["Un peu, avec mes grands-parents.", "Pas du tout, malheureusement."]
        grammar: [g.opinion-nuance]
        vocab: [w.alsacien, w.plus-ou-moins]
      - q: { es: "Ça se traduit comment, « winstub » ?", en: "How do you translate 'winstub'?" }
        a: { es: "Ça ne se traduit pas vraiment ; disons un bar à vin avec une cuisine alsacienne.", en: "It doesn't really translate; let's say a wine bar with Alsatian food." }
        alt: ["Un bar à vin, plus ou moins.", "C'est une sorte de restaurant typique."]
        grammar: [g.pronominal-passive]
        vocab: [w.winstub]
      - q: { es: "Tous les Alsaciens parlent allemand ?", en: "Do all Alsatians speak German?" }
        a: { es: "Il ne faut pas généraliser : beaucoup le comprennent, mais pas tous.", en: "You mustn't generalise: many understand it, but not all." }
        alt: ["Non, pas tous.", "Beaucoup, surtout les frontaliers."]
        grammar: [g.opinion-nuance]
        vocab: [w.généraliser]
      - q: { es: "Tu travailles où ?", en: "Where do you work?" }
        a: { es: "En Suisse, à Bâle ; je suis frontalier, comme beaucoup de gens ici.", en: "In Switzerland, in Basel; I'm a cross-border commuter, like lots of people here." }
        alt: ["À Bâle, en Suisse.", "En Allemagne, de l'autre côté du Rhin."]
        grammar: [g.c-est-il-est]
        vocab: [w.frontalier.n]
      - q: { es: "Qu'est-ce que tu penses du bilinguisme à l'école ?", en: "What do you think of bilingual schooling?" }
        a: { es: "Personnellement, j'y suis favorable ; il me semble que c'est une chance pour les enfants.", en: "Personally, I'm in favour; it seems to me it's an opportunity for children." }
        alt: ["C'est une très bonne idée.", "J'ai des doutes, à vrai dire."]
        grammar: [g.opinion-nuance, g.pronoun-y]
        vocab: [w.bilinguisme, w.personnellement]
    texts:
      - title: "Panneau à l'entrée du village"
        es: ["Bienvenue à Riquewihr – Willkomme z'Rikschwihr.", "Ici, les noms de rue s'écrivent en français et en alsacien.", "Habituellement, les deux langues se mélangent dans les conversations."]
        en: ["Welcome to Riquewihr – in Alsatian too.", "Here, street names are written in French and Alsatian.", "Usually, the two languages mix in conversations."]
        grammar: [g.pronominal-passive]
        vocab: [w.habituellement]
      - title: "Opinion d'un lecteur"
        es: ["Il paraît que le dialecte va disparaître.", "Je dirais plutôt qu'il change : les jeunes le mélangent au français.", "Il ne faut pas être trop pessimiste."]
        en: ["Apparently the dialect is going to disappear.", "I'd rather say it's changing: young people mix it with French.", "We mustn't be too pessimistic."]
        grammar: [g.opinion-nuance, g.impersonal-constructions]
        vocab: [w.dialecte]
    spicy:
      - { es: "« Je t'aime », ça se dit comment en alsacien ? Je voudrais être sûr de bien le prononcer.", en: "How do you say 'I love you' in Alsatian? I'd like to be sure I pronounce it right.", altEs: ["Comment ça se dit en alsacien, « je t'aime » ? Je voudrais être sûre de bien le prononcer."], grammar: [g.pronominal-passive], vocab: [w.se-dire, w.prononcer] }
      - { es: "Il ne faut pas généraliser, mais les garçons de la route des vins ont tous un charme fou.", en: "You mustn't generalise, but the boys on the wine route all have crazy charm.", altEs: ["Il ne faut pas généraliser, mais les garçons de la route des vins ont tous beaucoup de charme."], grammar: [g.opinion-nuance], vocab: [w.généraliser] }
      - { es: "Ton accent alsacien, je le trouve irrésistible ; ne le perds jamais.", en: "Your Alsatian accent, I find it irresistible; never lose it.", altEs: ["Je trouve ton accent alsacien irrésistible ; ne le perds jamais."], grammar: [g.dislocation, g.imperative-with-pronouns], vocab: [w.accent] }
      - { es: "Certains regards ne se traduisent pas ; le tien, par exemple.", en: "Some looks can't be translated; yours, for example.", altEs: ["Certains regards ne se traduisent pas, le tien par exemple."], grammar: [g.pronominal-passive, g.possessive-pronouns], vocab: [] }
      - { es: "Traditionnellement, on s'embrasse trois fois en Alsace ? J'ai l'impression que tu inventes.", en: "Traditionally, people kiss three times in Alsace? I have a feeling you're making that up.", altEs: ["Traditionnellement, on se fait trois bises en Alsace ? J'ai l'impression que tu inventes."], grammar: [g.opinion-nuance], vocab: [w.traditionnellement, w.avoir-l-impression] }
dialogues:
  - id: b2.u12.d1
    title: Dégustation à Riquewihr
    context: Sophie and Thomas are at a winegrower's cellar in Riquewihr. The winegrower guides them through a tasting.
    lines:
      - { speaker: Vigneronne, es: "Bienvenue ! On commence par le riesling : il se boit frais, alors il faut le goûter tout de suite.", en: "Welcome! We'll start with the riesling: it's drunk chilled, so you need to taste it straight away." }
      - { speaker: Thomas, es: "Il paraît que votre riesling est le meilleur de la route des vins.", en: "Apparently your riesling is the best on the wine route." }
      - { speaker: Vigneronne, es: "Je ne vais pas dire le contraire ! Mais il s'agit surtout d'une question de terroir.", en: "I'm not going to say otherwise! But it's mostly a question of terroir." }
      - { speaker: Sophie, es: "Il me semble qu'il est très sec. J'ai l'impression de sentir du citron.", en: "It seems very dry to me. I have the feeling I can smell lemon." }
      - { speaker: Vigneronne, es: "Bravo, c'est tout à fait ça. Maintenant, le gewurztraminer : il se marie très bien avec le munster.", en: "Well done, that's exactly it. Now the gewurztraminer: it goes very well with Munster cheese." }
      - { speaker: Thomas, es: "Franchement, il est légèrement trop sucré pour moi.", en: "Frankly, it's slightly too sweet for me." }
      - { speaker: Sophie, es: "Moi, je le trouve extraordinaire. Il ne faut pas généraliser : tous les gewurztraminers ne sont pas sucrés.", en: "I think it's extraordinary. You mustn't generalise: not all gewurztraminers are sweet." }
      - { speaker: Vigneronne, es: "Il reste une dernière bouteille : notre crémant. Il suffit de la déboucher… voilà !", en: "There's one last bottle left: our crémant. All you have to do is uncork it… there!" }
      - { speaker: Thomas, es: "Ça, c'est indéniablement délicieux. On en prend six bouteilles ?", en: "Now that is undeniably delicious. Shall we take six bottles?" }
      - { speaker: Sophie, es: "D'accord, mais c'est moi qui conduis : je crache le reste !", en: "OK, but I'm the one driving: I'm spitting out the rest!" }
    questions:
      - { q: "Comment se boit le riesling, selon la vigneronne ?", options: ["Chaud", "Frais", "Avec de l'eau"], answer: 1, explain: "Il se boit frais." }
      - { q: "Selon la vigneronne, la qualité du riesling est surtout une question de…", options: ["prix", "terroir", "bouteille"], answer: 1, explain: "Il s'agit surtout d'une question de terroir." }
      - { q: "Que pense Thomas du gewurztraminer ?", options: ["Il le trouve trop sec.", "Il le trouve légèrement trop sucré.", "Il l'adore."], answer: 1, explain: "Franchement, il est légèrement trop sucré pour moi." }
      - { q: "Pourquoi Sophie va-t-elle cracher le reste du vin ?", options: ["Elle n'aime pas le crémant.", "C'est elle qui conduit.", "Elle est malade."], answer: 1, explain: "C'est moi qui conduis: she's driving." }
