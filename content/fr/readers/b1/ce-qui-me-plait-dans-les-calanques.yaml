id: r.b1.ce-qui-me-plait-dans-les-calanques
level: b1
title: Ce qui me plaît dans les Calanques
kind: text
intro: "A post on a hiking forum: Margaux answers a question from a visitor who wants to discover the Calanques, between Marseille and Cassis. Notice ce qui, ce que and celui/celle."
allow: [margaux, sugiton, en-vau, sormiou, cosquer, henri, forum, ok, centre]
paragraphs:
  - { es: "Question de Julien : Bonjour à tous ! Je vais passer une semaine à Marseille en juillet et je voudrais découvrir les Calanques. Qu'est-ce que vous me conseillez ? Quelle calanque est la plus belle ? Merci !", en: "Question from Julien: Hello everyone! I'm going to spend a week in Marseille in July and I'd like to discover the Calanques. What do you recommend? Which calanque is the most beautiful? Thanks!" }
  - { es: "Réponse de Margaux : Salut Julien ! Je suis marseillaise et je fais de la randonnée dans les Calanques depuis vingt ans, alors je vais te dire ce que j'en pense.", en: "Reply from Margaux: Hi Julien! I'm from Marseille and I've been hiking in the Calanques for twenty years, so I'll tell you what I think." }
  - { es: "D'abord, ce qu'il faut savoir : les calanques sont des criques étroites entre de hautes falaises de pierre blanche, avec une eau turquoise incroyable. Elles s'étendent sur une vingtaine de kilomètres, de Marseille jusqu'à Cassis. Depuis 2012, c'est un parc national, le premier en Europe qui est à la fois terrestre, marin et tout près d'une grande ville. Ce qui me plaît le plus, c'est justement ça : tu prends le bus dans le centre de Marseille et, une heure après, tu es dans la nature sauvage.", en: "First, what you need to know: the calanques are narrow coves between high cliffs of white rock, with incredible turquoise water. They stretch over about twenty kilometres, from Marseille to Cassis. Since 2012 it has been a national park, the first in Europe that is at the same time on land, at sea and right next to a big city. What I like most is exactly that: you take the bus in the centre of Marseille and, an hour later, you're in wild nature." }
  - { es: "Tu demandes quelle est la plus belle. Difficile à dire ! Celle que tout le monde connaît, c'est En-Vau, avec ses falaises énormes et sa petite plage. Mais le sentier est long et difficile, et en été il y a du monde. Celle que je préfère, c'est Sugiton : on y arrive en une heure de marche depuis l'université de Luminy, et on peut se baigner entre les rochers. Attention : en été, il faut maintenant réserver sur Internet pour y aller, parce qu'il y avait trop de visiteurs. C'est gratuit, mais le nombre de places est limité.", en: "You ask which is the most beautiful. Hard to say! The one everybody knows is En-Vau, with its enormous cliffs and its little beach. But the path is long and difficult, and in summer it's crowded. The one I prefer is Sugiton: you get there in an hour's walk from the university at Luminy, and you can swim between the rocks. Careful: in summer you now have to book online to go there, because there were too many visitors. It's free, but the number of places is limited." }
  - { es: "Ce que je te déconseille, c'est de partir à midi en plein soleil. En juillet, il fait souvent plus de trente degrés et il n'y a presque pas d'ombre. Pars tôt le matin, emporte au moins deux litres d'eau par personne, une casquette, de la crème solaire et de bonnes chaussures. Les touristes qui marchent en tongs sur les rochers, ce n'est pas ce que je préfère voir…", en: "What I'd advise against is setting off at noon in full sun. In July it's often over thirty degrees and there's hardly any shade. Leave early in the morning, take at least two litres of water per person, a cap, sun cream and good shoes. Tourists walking on the rocks in flip-flops are not my favourite sight…" }
  - { es: "Autre chose très importante : en été, quand il y a du vent et que le risque d'incendie est élevé, l'accès aux massifs est interdit. Regarde le site de la préfecture la veille au soir avant de partir. Et bien sûr, on ne fait jamais de feu, on ne fume pas et on rapporte tous ses déchets. Le parc est fragile.", en: "Another very important thing: in summer, when it's windy and the risk of fire is high, access to the hills is forbidden. Check the prefecture's website the evening before you go. And of course you never light a fire, you don't smoke and you take all your rubbish back with you. The park is fragile." }
  - { es: "Si tu n'aimes pas marcher, il y a d'autres solutions : tu peux prendre un bateau depuis le Vieux-Port ou depuis Cassis, ou louer un kayak. Vue depuis la mer, la côte est encore plus spectaculaire. Et si tu as un jour de pluie, va voir la réplique de la grotte Cosquer, en ville : c'est une grotte avec des peintures préhistoriques dont l'entrée se trouve sous la mer, dans une calanque. Elle a été découverte par un plongeur, Henri Cosquer.", en: "If you don't like walking, there are other options: you can take a boat from the Vieux-Port or from Cassis, or rent a kayak. Seen from the sea, the coast is even more spectacular. And if you have a rainy day, go and see the replica of the Cosquer cave in town: it's a cave with prehistoric paintings whose entrance is under the sea, in a calanque. It was discovered by a diver, Henri Cosquer." }
  - { es: "Bonne découverte, et respecte la nature : c'est ce qui rend cet endroit si précieux !", en: "Enjoy your discovery, and respect nature: that's what makes this place so precious!" }
questions:
  - { q: "Qu'est-ce qui plaît le plus à Margaux dans les Calanques ?", options: ["Les plages de sable", "On est dans la nature sauvage tout près de la ville", "Les restaurants de Cassis"], answer: 1, explain: "«Ce qui me plaît le plus… tu prends le bus dans le centre de Marseille et, une heure après, tu es dans la nature sauvage.»" }
  - { q: "Pourquoi faut-il réserver pour aller à Sugiton en été ?", options: ["Parce que c'est payant", "Parce qu'il y avait trop de visiteurs", "Parce que le sentier est dangereux"], answer: 1, explain: "«Il faut maintenant réserver… parce qu'il y avait trop de visiteurs.» It's free but places are limited." }
  - { q: "Qu'est-ce que Margaux déconseille ?", options: ["De partir tôt le matin", "De partir à midi en plein soleil", "De prendre un bateau"], answer: 1, explain: "«Ce que je te déconseille, c'est de partir à midi en plein soleil.»" }
  - { q: "Quand l'accès aux massifs est-il interdit ?", options: ["Quand il pleut", "Le dimanche", "Quand il y a du vent et un risque d'incendie élevé"], answer: 2, explain: "«Quand il y a du vent et que le risque d'incendie est élevé, l'accès aux massifs est interdit.»" }
  - { q: "Qu'a de particulier la grotte Cosquer ?", options: ["Son entrée est sous la mer", "Elle est au sommet d'une montagne", "On peut y dormir"], answer: 0, explain: "«Une grotte avec des peintures préhistoriques dont l'entrée se trouve sous la mer.» In town you visit a replica." }
