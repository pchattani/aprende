id: b1.u01
title: Tomara que dê certo
lessons:
  - id: b1.u01.l1
    title: Espero que você goste de BH
    teach: [g.subjunctive-present-forms]
    vocab: [w.desejar, w.desejo, w.esperança, w.otimista, w.pessimista, w.queijo-minas, w.doce-de-leite, w.cachaça, w.pequi, w.goiano, w.mineiro.n, w.especial, w.valer, w.merecer, w.paz, w.brinde, w.charme, w.uai]
    tip: "Take the eu form, drop the -o and swap the vowel: falo → fale, como → coma, trago → traga. -ar verbs take -e, -er/-ir verbs take -a."
    sentences:
      - { es: "Espero que você goste de Belo Horizonte.", en: "I hope you like Belo Horizonte.", altEs: ["Espero que você goste de BH.", "Eu espero que você goste de Belo Horizonte."], grammar: [g.subjunctive-present-forms, g.subjunctive-wishes], vocab: [] }
      - { es: "Quero que você prove o queijo minas com doce de leite.", en: "I want you to try Minas cheese with dulce de leche.", altEs: ["Quero que você experimente o queijo minas com doce de leite.", "Eu quero que você prove queijo minas com doce de leite."], altEn: ["I want you to taste Minas cheese with dulce de leche."], grammar: [g.subjunctive-present-forms], vocab: [w.queijo-minas, w.doce-de-leite], transform: { instruction: "Change você to vocês", answer: "Quero que vocês provem o queijo minas com doce de leite.", alt: ["Quero que vocês experimentem o queijo minas com doce de leite."], en: "I want you (all) to try Minas cheese with dulce de leche." } }
      - { es: "Desejo que vocês tenham uma viagem tranquila.", en: "I wish you a smooth trip.", altEs: ["Desejo a vocês uma viagem tranquila."], altEn: ["I hope you have a smooth trip."], grammar: [g.subjunctive-present-forms, g.subjunctive-wishes], vocab: [w.desejar] }
      - { es: "Espero que vocês não bebam cachaça demais hoje.", en: "I hope you don't drink too much cachaça today.", altEs: ["Espero que vocês não tomem cachaça demais hoje."], grammar: [g.subjunctive-present-forms], vocab: [w.cachaça], error: { wrong: "Espero que vocês não bebem cachaça demais hoje.", explain: "After espero que use the subjunctive: bebam, not the indicative bebem.", grammar: g.subjunctive-present-forms } }
      - { es: "O pequi tem um sabor muito especial; espero que você goste.", en: "Pequi has a very special flavour; I hope you like it.", altEs: ["O pequi tem um gosto muito especial; espero que você goste."], altEn: ["Pequi has a very distinctive taste; I hope you like it."], grammar: [g.subjunctive-present-forms], vocab: [w.pequi, w.especial], note: "Pequi is a cerrado fruit loved in Goiás and the north of Minas: never bite into the stone, it has spines." }
      - { es: "Os goianos querem que todo mundo prove arroz com pequi.", en: "People from Goiás want everyone to try rice with pequi.", grammar: [g.subjunctive-present-forms], vocab: [w.goiano, w.pequi] }
      - { es: "Ele é mineiro e quer que a gente coma na casa da mãe dele.", en: "He's from Minas and wants us to eat at his mother's house.", altEs: ["Ele é mineiro e quer que nós comamos na casa da mãe dele."], grammar: [g.subjunctive-present-forms, g.a-gente], vocab: [w.mineiro.n] }
      - { es: "Você quer que eu peça mais um chope?", en: "Do you want me to order another draught beer?", altEs: ["Quer que eu peça mais um chope?"], grammar: [g.subjunctive-present-forms], vocab: [], transform: { instruction: "Change eu to a gente", answer: "Você quer que a gente peça mais um chope?", alt: ["Quer que a gente peça mais um chope?"], en: "Do you want us to order another draught beer?" } }
      - { es: "Não seja pessimista! Espero que você mude de ideia.", en: "Don't be a pessimist! I hope you change your mind.", altEs: ["Não seja tão pessimista! Espero que você mude de ideia."], grammar: [g.subjunctive-present-forms, g.subjunctive-irregular], vocab: [w.pessimista] }
      - { es: "Sou otimista: espero que a cidade cresça sem perder o charme.", en: "I'm an optimist: I hope the city grows without losing its charm.", grammar: [g.subjunctive-present-forms], vocab: [w.otimista, w.charme], note: "cresça: cresço → cresça (c becomes ç before a)." }
      - { es: "Meu maior desejo é que a gente abra um bar em BH.", en: "My greatest wish is for us to open a bar in BH.", altEs: ["Meu maior desejo é que nós abramos um bar em BH."], grammar: [g.subjunctive-present-forms, g.a-gente], vocab: [w.desejo] }
      - { es: "Trabalhou o ano todo? Espero que você descanse; você merece.", en: "You worked all year? I hope you rest; you deserve it.", grammar: [g.subjunctive-present-forms], vocab: [w.merecer] }
      - { es: "Minha esperança é que meus pais conheçam Minas um dia.", en: "My hope is that my parents will get to know Minas one day.", altEs: ["Minha esperança é que meus pais visitem Minas um dia."], grammar: [g.subjunctive-present-forms], vocab: [w.esperança], transform: { instruction: "Start with Espero que…", answer: "Espero que meus pais conheçam Minas um dia.", alt: ["Eu espero que meus pais conheçam Minas um dia."] } }
      - { es: "Uai, você nunca provou pão de queijo? Quero que você prove agora!", en: "What, you've never tried cheese bread? I want you to try it right now!", altEs: ["Uai, você nunca comeu pão de queijo? Quero que você prove agora!"], grammar: [g.subjunctive-present-forms], vocab: [w.uai], note: "Uai is the signature interjection of Minas Gerais: surprise, emphasis or 'well…'." }
      - { es: "Que vocês tenham muita paz e saúde!", en: "May you have lots of peace and health!", altEn: ["I wish you lots of peace and health!"], grammar: [g.subjunctive-present-forms, g.subjunctive-wishes], vocab: [w.paz] }
      - { es: "Vale a pena subir a Serra do Curral; quero que você veja a vista.", en: "It's worth going up the Serra do Curral; I want you to see the view.", grammar: [g.subjunctive-present-forms], vocab: [w.valer], note: "veja comes from vejo; the Serra do Curral is the ridge that frames Belo Horizonte." }
    exchanges:
      - q: { es: "O que você quer que eu traga de Minas?", en: "What do you want me to bring from Minas?" }
        a: { es: "Quero que você traga queijo minas e doce de leite.", en: "I want you to bring Minas cheese and dulce de leche." }
        alt: ["Traz um queijo minas, por favor!", "Doce de leite, claro!"]
        grammar: [g.subjunctive-present-forms]
        vocab: [w.queijo-minas, w.doce-de-leite]
      - q: { es: "Vou para BH amanhã!", en: "I'm going to BH tomorrow!" }
        a: { es: "Que legal! Espero que você coma muito pão de queijo.", en: "How cool! I hope you eat lots of cheese bread." }
        alt: ["Que bom! Espero que você goste.", "Boa! Espero que você se divirta."]
        grammar: [g.subjunctive-present-forms]
        vocab: []
      - q: { es: "Você é otimista ou pessimista?", en: "Are you an optimist or a pessimist?" }
        a: { es: "Otimista: sempre espero que as coisas melhorem.", en: "An optimist: I always hope things get better." }
        alt: ["Otimista, claro!", "Um pouco pessimista, infelizmente."]
        grammar: [g.subjunctive-present-forms]
        vocab: [w.otimista, w.pessimista]
      - q: { es: "O que você deseja para o ano que vem?", en: "What do you wish for next year?" }
        a: { es: "Desejo que a minha família tenha paz e saúde.", en: "I wish my family peace and health." }
        alt: ["Paz e saúde para todos.", "Que a gente viaje mais!"]
        grammar: [g.subjunctive-present-forms, g.subjunctive-wishes]
        vocab: [w.desejar, w.paz]
      - q: { es: "Posso pagar a conta?", en: "Can I pay the bill?" }
        a: { es: "Não, quero que você guarde o seu dinheiro. Hoje eu pago.", en: "No, I want you to keep your money. I'm paying today." }
        alt: ["Não, deixa que eu pago.", "Pode, obrigado!"]
        grammar: [g.subjunctive-present-forms]
        vocab: []
    texts:
      - title: "Mensagem da Júlia"
        es: ["Oi, Pedro! Espero que você esteja bem.", "Quero que você conheça meus amigos mineiros no sábado.", "A gente vai a um bar na Savassi; espero que você goste de cachaça!"]
        en: ["Hi, Pedro! I hope you're well.", "I want you to meet my friends from Minas on Saturday.", "We're going to a bar in Savassi; I hope you like cachaça!"]
        grammar: [g.subjunctive-present-forms]
        vocab: [w.cachaça]
      - title: "Cartão de boas-vindas do hotel"
        es: ["Bem-vindos a Belo Horizonte!", "Esperamos que vocês provem o melhor da comida mineira.", "Que vocês se sintam em casa!"]
        en: ["Welcome to Belo Horizonte!", "We hope you try the best of Minas cooking.", "Make yourselves at home!"]
        grammar: [g.subjunctive-present-forms, g.subjunctive-wishes]
        vocab: []
    spicy:
      - { es: "Espero que você goste de doce de leite, porque eu sou um doce de pessoa.", en: "I hope you like dulce de leche, because I'm a sweetheart.", grammar: [g.subjunctive-present-forms], vocab: [w.doce-de-leite] }
      - { es: "Minha mãe quer que eu case com um mineiro. Você é mineiro?", en: "My mother wants me to marry someone from Minas. Are you from Minas?", altEs: ["Minha mãe quer que eu case com uma mineira. Você é mineira?"], grammar: [g.subjunctive-present-forms], vocab: [w.mineiro.n] }
      - { es: "Espero que você não beba toda a cachaça antes de dançar comigo.", en: "I hope you don't drink all the cachaça before you dance with me.", grammar: [g.subjunctive-present-forms], vocab: [w.cachaça] }
      - { es: "Quero que você fique para mais um chope… e mais uma conversa.", en: "I want you to stay for one more beer… and one more chat.", grammar: [g.subjunctive-present-forms], vocab: [] }
      - { es: "Um brinde ao meu desejo: que você me ligue amanhã.", en: "A toast to my wish: that you call me tomorrow.", grammar: [g.subjunctive-present-forms, g.subjunctive-wishes], vocab: [w.brinde, w.desejo] }
  - id: b1.u01.l2
    title: Tomara que dê certo!
    teach: [g.subjunctive-irregular]
    vocab: [w.tomara, w.oxalá, w.dar-certo, w.dar-errado, w.torcer-para, w.boa-sorte, w.boa-viagem, w.felicidades, w.felicidade, w.fracasso, w.fracassar, w.simpatia, w.superstição, w.vela, w.réveillon, w.virada, w.promessa, w.prometer, w.pedido]
    tip: "Seven verbs break the eu rule: seja, esteja, vá, dê, saiba, queira, haja. Tomara que dê certo! is the Brazilian way to cross your fingers."
    sentences:
      - { es: "Tomara que dê certo!", en: "Fingers crossed it works out!", altEs: ["Tomara que dê tudo certo!", "Tomara que dê certo."], altEn: ["I hope it works out!", "Let's hope it works out!"], grammar: [g.subjunctive-irregular, g.subjunctive-wishes], vocab: [w.tomara, w.dar-certo] }
      - { es: "Tomara que não chova no réveillon.", en: "Let's hope it doesn't rain on New Year's Eve.", altEs: ["Tomara que não chova na virada."], altEn: ["I hope it doesn't rain on New Year's Eve."], grammar: [g.subjunctive-wishes, g.subjunctive-present-forms], vocab: [w.tomara, w.réveillon] }
      - { es: "Espero que você esteja bem.", en: "I hope you're well.", altEs: ["Eu espero que você esteja bem."], altEn: ["I hope you are well."], grammar: [g.subjunctive-irregular], vocab: [] }
      - { es: "Felicidades! Que vocês sejam muito felizes juntos.", en: "Best wishes! May you be very happy together.", altEs: ["Felicidades! Que vocês sejam muito felizes."], grammar: [g.subjunctive-irregular, g.subjunctive-wishes], vocab: [w.felicidades], transform: { instruction: "Change vocês to você", answer: "Felicidades! Que você seja muito feliz.", en: "Best wishes! May you be very happy." } }
      - { es: "Na virada, minha tia acende uma vela branca e pede que haja paz em casa.", en: "At midnight on New Year's Eve, my aunt lights a white candle and asks for peace at home.", grammar: [g.subjunctive-irregular], vocab: [w.virada, w.vela, w.paz] }
      - { es: "Minha avó não quer que eu vá ao réveillon sem roupa branca: é superstição.", en: "My grandmother doesn't want me to go to the New Year's party without white clothes: it's a superstition.", grammar: [g.subjunctive-irregular], vocab: [w.réveillon, w.superstição], note: "In Brazil many people wear white on New Year's Eve for peace." }
      - { es: "Minha prima quer que eu faça uma simpatia com sete uvas.", en: "My cousin wants me to do a good-luck ritual with seven grapes.", grammar: [g.subjunctive-present-forms], vocab: [w.simpatia], note: "A simpatia is a small superstitious ritual for luck, money or love." }
      - { es: "Fiz um pedido e não quero que ninguém saiba qual é.", en: "I made a wish and I don't want anyone to know what it is.", altEs: ["Fiz um pedido e não quero que ninguém saiba."], grammar: [g.subjunctive-irregular], vocab: [w.pedido] }
      - { es: "Ele prometeu, mas duvido que a promessa dure até fevereiro.", en: "He promised, but I doubt the promise will last until February.", grammar: [g.subjunctive-present-forms], vocab: [w.prometer, w.promessa] }
      - { es: "Boa viagem! Tomara que o voo não atrase.", en: "Have a good trip! Let's hope the flight isn't delayed.", altEs: ["Boa viagem! Tomara que o voo não se atrase."], grammar: [g.subjunctive-wishes], vocab: [w.boa-viagem, w.tomara] }
      - { es: "Boa sorte na entrevista! Estou torcendo para você.", en: "Good luck at the interview! I'm keeping my fingers crossed for you.", altEs: ["Boa sorte na entrevista! Tô torcendo por você.", "Boa sorte na entrevista! Estou torcendo por você."], grammar: [g.subjunctive-wishes], vocab: [w.boa-sorte, w.torcer-para] }
      - { es: "Tomara que nada dê errado no show de hoje.", en: "Let's hope nothing goes wrong at today's show.", altEs: ["Tomara que não dê nada errado no show de hoje."], grammar: [g.subjunctive-irregular], vocab: [w.dar-errado], error: { wrong: "Tomara que nada dá errado no show de hoje.", explain: "Tomara que always takes the subjunctive: dê (with a circumflex), not dá.", grammar: g.subjunctive-irregular } }
      - { es: "Oxalá a gente tenha um ano de paz.", en: "God willing, we'll have a year of peace.", altEs: ["Tomara que a gente tenha um ano de paz."], altEn: ["Let's hope we have a year of peace."], grammar: [g.subjunctive-wishes], vocab: [w.oxalá, w.paz], variant: "Oxalá sounds literary in Brazil but is everyday speech in Portugal: Oxalá tenhamos um ano de paz!" }
      - { es: "O projeto não pode fracassar.", en: "The project can't fail.", grammar: [g.subjunctive-wishes], vocab: [w.fracassar], transform: { instruction: "Turn it into a wish with Tomara que…", answer: "Tomara que o projeto não fracasse.", en: "Let's hope the project doesn't fail." } }
      - { es: "Queira ou não, o medo do fracasso faz parte da vida.", en: "Like it or not, the fear of failure is part of life.", grammar: [g.subjunctive-irregular], vocab: [w.fracasso] }
      - { es: "Desejo muita felicidade para vocês neste ano novo.", en: "I wish you lots of happiness in this new year.", altEs: ["Desejo muita felicidade a vocês neste ano novo."], grammar: [g.subjunctive-wishes], vocab: [w.felicidade, w.desejar] }
    exchanges:
      - q: { es: "Amanhã tenho a entrevista de emprego.", en: "Tomorrow I've got the job interview." }
        a: { es: "Boa sorte! Tomara que dê tudo certo.", en: "Good luck! Fingers crossed it all works out." }
        alt: ["Tomara que dê certo!", "Vou torcer por você!"]
        grammar: [g.subjunctive-irregular]
        vocab: [w.boa-sorte, w.tomara, w.dar-certo]
      - q: { es: "Será que vai chover no réveillon?", en: "Do you think it'll rain on New Year's Eve?" }
        a: { es: "Tomara que não! A festa é na rua.", en: "I hope not! The party's outdoors." }
        alt: ["Tomara que não.", "Espero que não!"]
        grammar: [g.subjunctive-wishes]
        vocab: [w.tomara, w.réveillon]
      - q: { es: "Você acredita em superstição?", en: "Do you believe in superstitions?" }
        a: { es: "Não muito, mas quero que minha mãe esteja feliz, então visto branco.", en: "Not really, but I want my mother to be happy, so I wear white." }
        alt: ["Acredito, sim!", "Não, mas é melhor não arriscar."]
        grammar: [g.subjunctive-irregular]
        vocab: [w.superstição]
      - q: { es: "Vou para Lisboa no sábado!", en: "I'm going to Lisbon on Saturday!" }
        a: { es: "Boa viagem! Que você se divirta muito!", en: "Have a good trip! Have lots of fun!" }
        alt: ["Boa viagem!", "Tomara que faça sol lá!"]
        grammar: [g.subjunctive-wishes]
        vocab: [w.boa-viagem]
      - q: { es: "Qual foi o seu pedido na virada?", en: "What was your wish at midnight on New Year's Eve?" }
        a: { es: "Não posso contar! Só espero que seja um ano melhor.", en: "I can't tell you! I just hope it's a better year." }
        alt: ["É segredo!", "Que haja mais paz."]
        grammar: [g.subjunctive-irregular]
        vocab: [w.pedido, w.virada]
    texts:
      - title: "Mensagem de ano novo"
        es: ["Feliz ano novo, gente!", "Que este ano seja de muita paz e felicidade.", "Tomara que a gente se veja mais vezes!"]
        en: ["Happy New Year, everyone!", "May this be a year of lots of peace and happiness.", "Let's hope we see each other more often!"]
        grammar: [g.subjunctive-irregular, g.subjunctive-wishes]
        vocab: [w.felicidade, w.tomara]
      - title: "Simpatias da virada"
        es: ["No Brasil, muita gente veste branco no réveillon.", "Uns pulam sete ondas, outros acendem velas.", "Todos esperam que o ano novo seja melhor."]
        en: ["In Brazil, lots of people wear white on New Year's Eve.", "Some jump seven waves, others light candles.", "Everyone hopes the new year will be better."]
        grammar: [g.subjunctive-irregular]
        vocab: [w.simpatia, w.réveillon, w.vela]
    spicy:
      - { es: "Tomara que você esteja solteiro, porque eu estou.", en: "I hope you're single, because I am.", altEs: ["Tomara que você esteja solteira, porque eu estou."], grammar: [g.subjunctive-irregular], vocab: [w.tomara] }
      - { es: "Meu pedido na virada? Que você me dê o seu telefone.", en: "My New Year's wish? That you give me your number.", altEs: ["Meu pedido da virada? Que você me dê seu telefone."], grammar: [g.subjunctive-irregular], vocab: [w.pedido, w.virada] }
      - { es: "Fiz uma simpatia para arrumar namorado; tomara que funcione com você.", en: "I did a love ritual to find a boyfriend; let's hope it works on you.", altEs: ["Fiz uma simpatia para arrumar namorada; tomara que funcione com você."], altEn: ["I did a ritual to find a girlfriend; let's hope it works on you."], grammar: [g.subjunctive-wishes], vocab: [w.simpatia, w.tomara] }
      - { es: "Prometo não te beijar à meia-noite… a não ser que você queira.", en: "I promise not to kiss you at midnight… unless you want me to.", grammar: [g.subjunctive-irregular], vocab: [w.prometer] }
      - { es: "Que você seja o meu primeiro beijo do ano!", en: "May you be my first kiss of the year!", grammar: [g.subjunctive-irregular, g.subjunctive-wishes], vocab: [] }
  - id: b1.u01.l3
    title: Quero que você passe no vestibular
    teach: [g.subjunctive-wishes]
    vocab: [w.formatura, w.vestibular, w.passar-de-ano, w.reprovar, w.aprovar, w.bolsa-de-estudos, w.intercâmbio, w.curso, w.diploma, w.graduação, w.mestrado, w.doutorado, w.pós-graduação, w.semestre, w.média, w.redação, w.disciplina, w.conteúdo, w.física, w.médio]
    tip: "Two subjects → que + subjunctive (Quero que você passe). One subject → infinitive (Quero passar)."
    sentences:
      - { es: "Meus pais querem que eu passe no vestibular.", en: "My parents want me to pass the university entrance exam.", altEs: ["Os meus pais querem que eu passe no vestibular."], grammar: [g.subjunctive-wishes], vocab: [w.vestibular], variant: "In Portugal university entry depends on the exames nacionais.", transform: { instruction: "Make it 'I want to pass' (one subject)", answer: "Quero passar no vestibular.", alt: ["Eu quero passar no vestibular."], en: "I want to pass the entrance exam." } }
      - { es: "Espero passar de ano com boas notas.", en: "I hope to pass the year with good marks.", altEs: ["Eu espero passar de ano com notas boas."], altEn: ["I hope to pass the year with good grades."], grammar: [g.subjunctive-wishes, g.subjunctive-vs-infinitive], vocab: [w.passar-de-ano] }
      - { es: "Tomara que o professor não me reprove em física.", en: "Let's hope the teacher doesn't fail me in physics.", grammar: [g.subjunctive-wishes], vocab: [w.reprovar, w.física], variant: "In Portugal: Tomara que o professor não me chumbe." }
      - { es: "Espero que a faculdade aprove o meu pedido de bolsa de estudos.", en: "I hope the university approves my scholarship application.", altEs: ["Espero que a universidade aprove o meu pedido de bolsa."], grammar: [g.subjunctive-wishes], vocab: [w.aprovar, w.bolsa-de-estudos, w.pedido] }
      - { es: "Minha mãe prefere que eu faça o mestrado aqui no Brasil.", en: "My mother would rather I did my master's here in Brazil.", altEs: ["A minha mãe prefere que eu faça o mestrado aqui no Brasil."], grammar: [g.subjunctive-wishes], vocab: [w.mestrado] }
      - { es: "Quero que vocês venham à minha formatura em dezembro.", en: "I want you to come to my graduation in December.", altEs: ["Quero que vocês venham para a minha formatura em dezembro."], grammar: [g.subjunctive-wishes], vocab: [w.formatura], error: { wrong: "Quero vocês virem à minha formatura em dezembro.", explain: "'I want you to come' is quero que vocês venham: que + subjunctive, not an infinitive.", grammar: g.subjunctive-wishes } }
      - { es: "Ela quer fazer intercâmbio em Portugal no próximo semestre.", en: "She wants to do an exchange in Portugal next semester.", grammar: [g.subjunctive-wishes, g.subjunctive-vs-infinitive], vocab: [w.intercâmbio, w.semestre], transform: { instruction: "Make it 'her parents want her to…'", answer: "Os pais dela querem que ela faça intercâmbio em Portugal no próximo semestre.", alt: ["Seus pais querem que ela faça intercâmbio em Portugal no próximo semestre."], en: "Her parents want her to do an exchange in Portugal next semester." } }
      - { es: "Meu professor quer que eu termine o doutorado em quatro anos.", en: "My professor wants me to finish my PhD in four years.", altEs: ["O meu professor quer que eu termine o doutorado em quatro anos."], grammar: [g.subjunctive-wishes], vocab: [w.doutorado], variant: "In Portugal a PhD is a doutoramento." }
      - { es: "Prefiro que a gente estude junto para a prova de redação.", en: "I'd rather we studied together for the essay exam.", altEs: ["Prefiro que nós estudemos juntos para a prova de redação."], grammar: [g.subjunctive-wishes, g.a-gente], vocab: [w.redação] }
      - { es: "Qual é a disciplina que você quer que eu explique de novo?", en: "Which subject do you want me to explain again?", altEs: ["Que disciplina você quer que eu explique de novo?"], grammar: [g.subjunctive-wishes], vocab: [w.disciplina] }
      - { es: "Espero que o curso tenha mais conteúdo prático.", en: "I hope the course has more practical content.", grammar: [g.subjunctive-wishes], vocab: [w.curso, w.conteúdo] }
      - { es: "Para receber o diploma, preciso que a minha média seja sete.", en: "To get my degree certificate, I need my average to be seven.", grammar: [g.subjunctive-wishes, g.subjunctive-irregular], vocab: [w.diploma, w.média] }
      - { es: "Depois da graduação, quero fazer uma pós-graduação em BH.", en: "After my degree, I want to do a postgraduate course in BH.", grammar: [g.subjunctive-vs-infinitive], vocab: [w.graduação, w.pós-graduação], transform: { instruction: "Make it 'my parents want me to…'", answer: "Depois da graduação, meus pais querem que eu faça uma pós-graduação em BH.", alt: ["Depois da graduação, os meus pais querem que eu faça uma pós-graduação em BH."] } }
      - { es: "Não quero que você desista do curso agora.", en: "I don't want you to give up the course now.", altEs: ["Não quero que você largue o curso agora."], grammar: [g.subjunctive-wishes], vocab: [w.curso] }
    exchanges:
      - q: { es: "Seus pais querem que você estude direito?", en: "Do your parents want you to study law?" }
        a: { es: "Querem, mas eu prefiro estudar arquitetura.", en: "They do, but I'd rather study architecture." }
        alt: ["Querem, mas eu não quero.", "Não, eles querem que eu faça medicina."]
        grammar: [g.subjunctive-wishes, g.subjunctive-vs-infinitive]
        vocab: []
      - q: { es: "Quando é a sua formatura?", en: "When's your graduation?" }
        a: { es: "Em dezembro. Quero muito que você venha!", en: "In December. I really want you to come!" }
        alt: ["Em dezembro.", "No fim do semestre."]
        grammar: [g.subjunctive-wishes]
        vocab: [w.formatura]
      - q: { es: "Como foi o vestibular?", en: "How did the entrance exam go?" }
        a: { es: "Difícil! Tomara que eu passe.", en: "Hard! Fingers crossed I pass." }
        alt: ["Acho que fui bem.", "Foi difícil, mas fui bem."]
        grammar: [g.subjunctive-wishes]
        vocab: [w.vestibular]
      - q: { es: "Você vai fazer intercâmbio?", en: "Are you going to do an exchange?" }
        a: { es: "Quero, mas meus pais preferem que eu termine a graduação primeiro.", en: "I want to, but my parents would rather I finished my degree first." }
        alt: ["Vou, no próximo semestre!", "Quero muito fazer."]
        grammar: [g.subjunctive-wishes, g.subjunctive-vs-infinitive]
        vocab: [w.intercâmbio, w.graduação]
      - q: { es: "Qual é a sua média?", en: "What's your average?" }
        a: { es: "Oito. Espero que seja suficiente para a bolsa.", en: "Eight. I hope it's enough for the scholarship." }
        alt: ["Oito e meio.", "Sete, por enquanto."]
        grammar: [g.subjunctive-irregular]
        vocab: [w.média]
    texts:
      - title: "Mensagem da mãe"
        es: ["Filho, boa sorte no vestibular amanhã!", "Quero que você durma cedo hoje e tome um bom café da manhã.", "E tomara que caia uma redação sobre Minas!"]
        en: ["Son, good luck in the entrance exam tomorrow!", "I want you to go to bed early tonight and have a good breakfast.", "And let's hope there's an essay on Minas!"]
        grammar: [g.subjunctive-wishes]
        vocab: [w.vestibular, w.redação]
      - title: "Aviso da faculdade"
        es: ["Atenção, alunos do primeiro semestre!", "A faculdade pede que todos tragam o diploma do ensino médio.", "Esperamos que vocês tenham um ótimo curso."]
        en: ["Attention, first-semester students!", "The university asks everyone to bring their secondary-school certificate.", "We hope you have a great course."]
        grammar: [g.subjunctive-wishes, g.subjunctive-present-forms]
        vocab: [w.semestre, w.diploma, w.curso, w.médio]
    spicy:
      - { es: "Quero que você me dê aulas particulares… de forró.", en: "I want you to give me private lessons… in forró.", grammar: [g.subjunctive-wishes, g.subjunctive-irregular], vocab: [] }
      - { es: "Minha mãe quer que eu namore alguém com doutorado. Você serve?", en: "My mother wants me to date someone with a PhD. Will you do?", grammar: [g.subjunctive-wishes], vocab: [w.doutorado] }
      - { es: "Com um professor desses, prefiro que me reprovem: assim repito o semestre.", en: "With a teacher like that, I'd rather they failed me: that way I repeat the semester.", grammar: [g.subjunctive-wishes], vocab: [w.reprovar, w.semestre] }
      - { es: "Prefiro que a gente estude na minha casa; a biblioteca fecha cedo.", en: "I'd rather we studied at my place; the library closes early.", altEs: ["Prefiro que a gente estude lá em casa; a biblioteca fecha cedo."], grammar: [g.subjunctive-wishes], vocab: [] }
      - { es: "Tomara que o seu intercâmbio dure muito; a cidade ficou mais bonita com você.", en: "I hope your exchange lasts a long time; the city got prettier with you here.", grammar: [g.subjunctive-wishes], vocab: [w.intercâmbio] }
  - id: b1.u01.l4
    title: Metas para o ano novo
    teach: [g.subjunctive-wishes, g.subjunctive-irregular]
    vocab: [w.objetivo, w.meta, w.realizar, w.alcançar, w.conquistar, w.atingir, w.ensinar, w.conhecimento, w.educação, w.ensino, w.aprendizagem, w.formação]
    tip: "Good wishes start with que: Que você realize os seus sonhos! Que este ano seja incrível!"
    sentences:
      - { es: "Espero realizar o sonho de morar em BH.", en: "I hope to make my dream of living in BH come true.", altEs: ["Eu espero realizar o sonho de morar em BH."], grammar: [g.subjunctive-vs-infinitive], vocab: [w.realizar] }
      - { es: "Desejo que você realize todos os seus sonhos.", en: "I hope all your dreams come true.", altEn: ["I wish that you make all your dreams come true."], grammar: [g.subjunctive-wishes], vocab: [w.desejar, w.realizar], transform: { instruction: "Change você to vocês", answer: "Desejo que vocês realizem todos os seus sonhos.", en: "I hope all your dreams come true (to several people)." } }
      - { es: "Tomara que a empresa atinja a meta deste ano.", en: "Let's hope the company reaches this year's target.", grammar: [g.subjunctive-wishes, g.subjunctive-present-forms], vocab: [w.atingir, w.meta], note: "atinja: from atinjo." }
      - { es: "Qual é o seu objetivo para o ano que vem?", en: "What's your goal for next year?", altEs: ["Qual é o seu objetivo para o próximo ano?"], grammar: [g.question-words], vocab: [w.objetivo] }
      - { es: "Quero que meus filhos tenham uma boa educação.", en: "I want my children to have a good education.", altEs: ["Quero que os meus filhos tenham uma boa educação."], grammar: [g.subjunctive-wishes], vocab: [w.educação] }
      - { es: "Espero que o ensino público melhore em Minas.", en: "I hope state education gets better in Minas.", altEn: ["I hope public education improves in Minas."], grammar: [g.subjunctive-wishes], vocab: [w.ensino] }
      - { es: "Espero que o Galo conquiste o campeonato este ano.", en: "I hope Atlético wins the championship this year.", grammar: [g.subjunctive-wishes], vocab: [w.conquistar], note: "O Galo (the Rooster) is the nickname of Atlético Mineiro, one of Belo Horizonte's two big clubs." }
      - { es: "Ela quer que eu alcance o nível B2 até dezembro.", en: "She wants me to reach level B2 by December.", grammar: [g.subjunctive-wishes, g.subjunctive-present-forms], vocab: [w.alcançar], error: { wrong: "Ela quer que eu alcanço o nível B2 até dezembro.", explain: "Querer que + subjunctive: alcance (ç becomes c before e).", grammar: g.subjunctive-present-forms } }
      - { es: "Quero que você me ensine a fazer pão de queijo.", en: "I want you to teach me to make cheese bread.", altEs: ["Quero que você me ensine a fazer pão de queijo mineiro."], grammar: [g.subjunctive-wishes], vocab: [w.ensinar] }
      - { es: "Espero que esse curso me dê mais conhecimento sobre arte.", en: "I hope this course gives me more knowledge about art.", grammar: [g.subjunctive-irregular], vocab: [w.conhecimento, w.curso] }
      - { es: "A aprendizagem leva tempo: não quero que você desista.", en: "Learning takes time: I don't want you to give up.", grammar: [g.subjunctive-wishes], vocab: [w.aprendizagem] }
      - { es: "A empresa quer que todos os funcionários façam um curso de formação.", en: "The company wants all the staff to do a training course.", grammar: [g.subjunctive-wishes], vocab: [w.formação, w.curso] }
      - { es: "Que este ano seja cheio de metas alcançadas!", en: "May this year be full of goals achieved!", grammar: [g.subjunctive-irregular, g.subjunctive-wishes], vocab: [w.meta, w.alcançar] }
      - { es: "Prefiro que a gente tenha metas pequenas e fáceis.", en: "I'd rather we had small, easy goals.", altEs: ["Prefiro que nós tenhamos metas pequenas e fáceis."], grammar: [g.subjunctive-wishes], vocab: [w.meta], transform: { instruction: "Make it one subject: 'I prefer to have…'", answer: "Prefiro ter metas pequenas e fáceis.", alt: ["Eu prefiro ter metas pequenas e fáceis."], en: "I prefer to have small, easy goals." } }
      - { es: "Que vocês saibam aproveitar cada momento!", en: "May you know how to make the most of every moment!", grammar: [g.subjunctive-irregular, g.subjunctive-wishes], vocab: [] }
    exchanges:
      - q: { es: "Qual é a sua meta para o ano que vem?", en: "What's your goal for next year?" }
        a: { es: "Quero aprender a tocar violão.", en: "I want to learn to play the guitar." }
        alt: ["Viajar mais.", "Economizar dinheiro."]
        grammar: [g.subjunctive-vs-infinitive]
        vocab: [w.meta]
      - q: { es: "O que você deseja para os seus filhos?", en: "What do you wish for your children?" }
        a: { es: "Desejo que eles sejam felizes e tenham uma boa educação.", en: "I wish for them to be happy and to have a good education." }
        alt: ["Que sejam felizes.", "Saúde e educação."]
        grammar: [g.subjunctive-wishes, g.subjunctive-irregular]
        vocab: [w.desejar, w.educação]
      - q: { es: "Você conseguiu atingir os seus objetivos este ano?", en: "Did you manage to reach your goals this year?" }
        a: { es: "Quase todos! Espero que o próximo ano seja ainda melhor.", en: "Almost all of them! I hope next year is even better." }
        alt: ["Consegui, sim!", "Nem todos, infelizmente."]
        grammar: [g.subjunctive-irregular]
        vocab: [w.atingir, w.objetivo]
      - q: { es: "Quer que eu te ensine a fazer pão de queijo?", en: "Do you want me to teach you to make cheese bread?" }
        a: { es: "Quero! Tomara que fique igual ao da sua avó.", en: "Yes, please! Let's hope it turns out like your grandmother's." }
        alt: ["Quero muito!", "Claro, quero!"]
        grammar: [g.subjunctive-wishes]
        vocab: [w.ensinar]
      - q: { es: "Por que você quer fazer esse curso de formação?", en: "Why do you want to do this training course?" }
        a: { es: "Porque meu chefe quer que eu aprenda a usar o sistema novo.", en: "Because my boss wants me to learn to use the new system." }
        alt: ["Para conseguir um emprego melhor.", "Porque quero aprender mais."]
        grammar: [g.subjunctive-wishes]
        vocab: [w.formação, w.curso]
    texts:
      - title: "Lista de metas"
        es: ["Este ano, quero ler doze livros.", "Quero que minha família me visite em BH.", "E espero que o meu time ganhe o campeonato!"]
        en: ["This year, I want to read twelve books.", "I want my family to visit me in BH.", "And I hope my team wins the championship!"]
        grammar: [g.subjunctive-wishes, g.subjunctive-vs-infinitive]
        vocab: [w.meta]
      - title: "Discurso de formatura"
        es: ["Queridos colegas, chegamos ao fim de uma etapa.", "Desejo que vocês alcancem todos os seus objetivos.", "Que o conhecimento seja sempre o nosso caminho."]
        en: ["Dear classmates, we've reached the end of a stage.", "I hope you achieve all your goals.", "May knowledge always be our path."]
        grammar: [g.subjunctive-wishes, g.subjunctive-irregular]
        vocab: [w.alcançar, w.objetivo, w.conhecimento, w.formatura]
    spicy:
      - { es: "Minha meta para este ano? Que você aceite jantar comigo.", en: "My goal for this year? That you agree to have dinner with me.", grammar: [g.subjunctive-wishes], vocab: [w.meta] }
      - { es: "Espero que você realize todos os seus sonhos… e que eu esteja em alguns deles.", en: "I hope all your dreams come true… and that I'm in some of them.", grammar: [g.subjunctive-wishes, g.subjunctive-irregular], vocab: [w.realizar] }
      - { es: "Tomara que conquistar você seja mais fácil do que passar no vestibular.", en: "Let's hope winning you over is easier than passing the entrance exam.", grammar: [g.subjunctive-irregular], vocab: [w.conquistar, w.vestibular] }
      - { es: "Quero que você me ensine a falar como mineiro: devagar e com muito charme.", en: "I want you to teach me to talk like someone from Minas: slowly and with lots of charm.", grammar: [g.subjunctive-wishes], vocab: [w.ensinar, w.mineiro.n] }
      - { es: "Desejo que você tenha um ótimo ano e que passe boa parte dele comigo.", en: "I wish you a great year, and that you spend a good part of it with me.", grammar: [g.subjunctive-wishes], vocab: [w.desejar] }
dialogues:
  - id: b1.u01.d1
    title: Um brinde na Savassi
    context: Lucas is leaving for an exchange year in Lisbon. His friends Júlia and Rafael toast him in a bar in Belo Horizonte.
    lines:
      - { speaker: Júlia, es: "Gente, um brinde ao Lucas! Que o seu intercâmbio em Lisboa seja incrível!", en: "Guys, a toast to Lucas! May your exchange in Lisbon be amazing!" }
      - { speaker: Lucas, es: "Valeu, Júlia! Tomara que eu me acostume com o frio de lá.", en: "Thanks, Júlia! Let's hope I get used to the cold there." }
      - { speaker: Rafael, es: "Frio em Lisboa? Espero que você não reclame tanto quanto reclama aqui!", en: "Cold in Lisbon? I hope you don't complain as much as you complain here!" }
      - { speaker: Júlia, es: "E quero que você mande fotos toda semana, viu?", en: "And I want you to send photos every week, OK?" }
      - { speaker: Lucas, es: "Prometo. Mas quero que vocês me visitem e conheçam o Porto também.", en: "I promise. But I want you to visit me and see Porto too." }
      - { speaker: Rafael, es: "Eu quero ir, mas depende da minha bolsa de estudos.", en: "I want to go, but it depends on my scholarship." }
      - { speaker: Júlia, es: "Tomara que dê certo, Rafa. Você merece.", en: "Fingers crossed it works out, Rafa. You deserve it." }
      - { speaker: Lucas, es: "E vocês, o que desejam para mim?", en: "And you two, what do you wish for me?" }
      - { speaker: Rafael, es: "Que você aprenda a falar como os portugueses, mas não esqueça o nosso uai!", en: "That you learn to talk like the Portuguese, but don't forget our 'uai'!" }
      - { speaker: Júlia, es: "E que você traga pastel de nata quando voltar!", en: "And that you bring custard tarts when you come back!" }
    questions:
      - { q: "Para onde o Lucas vai fazer intercâmbio?", options: ["Para o Porto", "Para Lisboa", "Para Belo Horizonte"], answer: 1, explain: "Júlia toasts his exchange in Lisbon; Porto is only where he wants his friends to visit." }
      - { q: "O que a Júlia quer que o Lucas faça toda semana?", options: ["Que ligue para ela", "Que mande fotos", "Que estude muito"], answer: 1, explain: "Quero que você mande fotos toda semana." }
      - { q: "Por que o Rafael talvez não possa visitar o Lucas?", options: ["Porque não gosta de frio", "Porque depende da bolsa de estudos", "Porque tem prova"], answer: 1, explain: "He says it depends on his scholarship." }
      - { q: "O que a Júlia pede que o Lucas traga?", options: ["Queijo minas", "Vinho do Porto", "Pastel de nata"], answer: 2, explain: "E que você traga pastel de nata quando voltar!" }
writing:
  - task: "Your friend Ana is moving to Belo Horizonte for a new job. Write her a message with your wishes (Espero que…, Tomara que…, Desejo que…)."
    min: 50
    max: 100
    use: [w.desejar, w.tomara, w.dar-certo, w.boa-sorte]
    useAtLeast: 3
    grammar: [g.subjunctive-wishes, g.subjunctive-irregular]
    expect:
      - { pattern: '\b(espero|tomara|desejo|quero) que\b', hint: "Express wishes with que + subjunctive: Espero que você goste…" }
      - { pattern: '(?<!\p{L})(goste|seja|tenha|d[eê]|fa[cç]a|encontre|conhe[cç]a|aproveite|esteja|consiga|possa|v[aá])(?!\p{L})', hint: "Use subjunctive verbs: seja, tenha, goste, dê certo…" }
    model: { es: "Querida Ana, que notícia boa! Espero que você goste muito de Belo Horizonte e que encontre um apartamento bonito perto do trabalho. Tomara que o novo emprego dê certo! Desejo que você seja muito feliz aí e que conheça muitos bares, porque BH é a capital dos bares. Um dia vou te visitar: quero provar o pão de queijo e o doce de leite de Minas. Boa sorte e um beijo grande!", en: "Dear Ana, what great news! I hope you love Belo Horizonte and find a nice flat near work. Fingers crossed the new job works out! I wish you every happiness there and hope you get to know lots of bars, because BH is the bar capital. One day I'll come and visit you: I want to try Minas cheese bread and dulce de leche. Good luck and a big kiss!" }
  - task: "It's New Year's Eve (réveillon). Write your wishes for the new year: for your family, for yourself and for the world."
    min: 50
    max: 100
    use: [w.réveillon, w.paz, w.felicidade, w.pedido, w.tomara]
    useAtLeast: 3
    grammar: [g.subjunctive-wishes, g.subjunctive-present-forms]
    expect:
      - { pattern: '\b(tomara|espero|desejo|quero) que\b', hint: "Wish things for others with que + subjunctive: Tomara que…, Espero que…" }
      - { pattern: '(paz|sa[uú]de|felicidade|amor|sucesso|alegria)', hint: "Say what you wish for: paz, saúde, felicidade…" }
    model: { es: "No réveillon, eu sempre faço três pedidos para o ano novo. Para a minha família, desejo muita saúde e paz. Tomara que os meus pais venham me visitar e que a minha irmã passe no vestibular. Para mim, espero conseguir um emprego melhor e viajar mais. E para o mundo, tomara que haja menos guerras e mais felicidade. Feliz ano novo!", en: "On New Year's Eve I always make three wishes for the new year. For my family I wish good health and peace. I hope my parents come to visit me and my sister passes her university entrance exam. For myself, I hope to get a better job and travel more. And for the world, I hope there are fewer wars and more happiness. Happy New Year!" }
  - task: "Your younger cousin Pedro is taking the vestibular on Sunday. Write him a message saying what the family wants for him and what you want (A sua mãe quer que…, Eu quero que…)."
    min: 50
    max: 100
    use: [w.vestibular, w.curso, w.bolsa-de-estudos, w.intercâmbio, w.boa-sorte]
    useAtLeast: 3
    grammar: [g.subjunctive-wishes]
    expect:
      - { pattern: '\b(quer|querem|quero|prefere|preferem|prefiro) que\b', hint: "Say what people want someone else to do: A sua mãe quer que você durma cedo." }
    model: { es: "Oi, Pedro! A sua mãe me contou que o vestibular é no domingo. Ela quer que você durma cedo e que descanse no sábado. O seu pai quer que você faça Medicina, mas eu quero que você escolha o curso que você ama. Tomara que você ganhe uma bolsa de estudos e que faça um intercâmbio depois. Boa sorte!", en: "Hi, Pedro! Your mum told me the entrance exam is on Sunday. She wants you to go to bed early and rest on Saturday. Your dad wants you to study Medicine, but I want you to choose the course you love. I hope you win a scholarship and go on an exchange afterwards. Good luck!" }
  - task: "Write about your goals for next year: what you hope to achieve yourself (Espero + infinitive) and what you hope other people will do (Espero que + subjunctive)."
    min: 50
    max: 100
    use: [w.meta, w.objetivo, w.realizar, w.alcançar, w.conquistar]
    useAtLeast: 3
    grammar: [g.subjunctive-wishes, g.subjunctive-present-forms]
    expect:
      - { pattern: '\bespero [a-zà-ú]+(ar|er|ir)\b', hint: "Use espero + infinitive for your own goals: Espero realizar…" }
      - { pattern: '\b(espero|tomara|quero) que\b', hint: "Use que + subjunctive for other people: Espero que o meu chefe…" }
    model: { es: "As minhas metas para o próximo ano são simples. Espero alcançar um bom nível de português e quero realizar o sonho de morar em BH. Outro objetivo é conquistar uma vaga numa empresa mineira. Também espero que o meu chefe me deixe trabalhar de casa e que a minha namorada possa vir comigo. Tomara que tudo dê certo!", en: "My goals for next year are simple. I hope to reach a good level of Portuguese and I want to make my dream of living in BH come true. Another goal is to land a job at a company in Minas. I also hope my boss lets me work from home and that my girlfriend can come with me. Fingers crossed it all works out!" }
