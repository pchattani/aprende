id: c2.u01
title: Registro y dialecto
lessons:
  - id: c2.u01.l1
    title: Del registro culto al argot
    teach: [g.sociolects]
    vocab: [w.argot, w.culto, w.chungo, w.rayarse, w.petar, w.peña, w.chaval, w.dar-palo, w.informatico, w.academico, w.juvenil, w.cajero, w.antelacion, w.disco, w.preocupado]
    tip: "Register is a choice, not a level: a cultured speaker moves between «Estimada señora» and «Tío, qué fuerte» depending on who is listening."
    sentences:
      - { es: "Tío, el concierto de ayer lo petó; la peña estaba en plan loca.", en: "Dude, yesterday's concert was a smash; the crowd was, like, going crazy.", altEs: ["Tío, el concierto de ayer lo petó; la gente estaba como loca."], altEn: ["Mate, yesterday's gig was a smash; the crowd was going, like, crazy."], grammar: [g.sociolects], vocab: [w.petar, w.peña, w.en-plan, w.tio] }
      - { es: "¿En qué registro le escribirías a tu jefa: «Estimada señora» o «Hola, qué tal»?", en: "In which register would you write to your boss: 'Dear Madam' or 'Hi, how's it going'?", grammar: [g.sociolects, g.conditional-hypothetical], vocab: [w.registro, w.jefe] }
      - { es: "No digas «me he rayado» en una entrevista de trabajo; di «me he preocupado».", en: "Don't say 'me he rayado' (I got stressed) in a job interview; say 'me he preocupado'.", grammar: [g.sociolects, g.imperative-negative], vocab: [w.rayarse, w.entrevista, w.preocuparse] }
      - { es: "Estimada señora: me interesa mucho su oferta de trabajo.", en: "Dear Madam: I am very interested in your job offer.", grammar: [g.sociolects, g.register-formal-informal], vocab: [w.oferta], error: { wrong: "Estimada señora: me mola mucho su oferta de trabajo.", explain: "«Me mola» is youth slang and clashes with the formal opening «Estimada señora». In a formal letter use «me interesa».", grammar: g.sociolects } }
      - { es: "Los médicos tienen su propia jerga, y los informáticos, la suya: «se ha caído el servidor».", en: "Doctors have their own jargon, and IT people theirs: 'the server has gone down'.", grammar: [g.sociolects], vocab: [w.jerga, w.medico, w.caerse] }
      - { es: "Ese bar es un poco cutre, pero las tapas están guays y no cuestan mucha pasta.", en: "That bar is a bit shabby, but the tapas are great and don't cost much dough.", altEs: ["Ese bar es un poco cutre, pero las tapas están muy buenas y no cuestan mucho dinero."], grammar: [g.sociolects], vocab: [w.cutre, w.guay, w.pasta, w.tapa] }
      - { es: "¡Qué chungo! Me han pillado sin billete en el metro y la multa es de cien euros.", en: "What a nightmare! They caught me without a ticket on the metro and the fine is a hundred euros.", altEn: ["How rough! I got caught without a ticket on the metro and the fine is a hundred euros."], grammar: [g.sociolects, g.present-perfect], vocab: [w.chungo, w.pillar, w.multa, w.metro] }
      - { es: "Me da palo llamar a mi profesor al móvil; prefiero escribirle un correo formal.", en: "I feel awkward calling my teacher on his mobile; I'd rather write him a formal email.", altEs: ["Me da palo llamar a mi profesor al móvil; prefiero mandarle un correo formal."], grammar: [g.sociolects], vocab: [w.dar-palo, w.formal, w.movil, w.correo] }
      - { es: "Los chavales de hoy mezclan el inglés con el castellano: «eso es muy random», dicen.", en: "Today's kids mix English with Spanish: 'that's so random', they say.", grammar: [g.sociolects], vocab: [w.chaval, w.mezclar, w.ingles, w.castellano] }
      - { es: "En el ámbito académico se evita el lenguaje coloquial y se prefieren los términos precisos.", en: "In the academic sphere colloquial language is avoided and precise terms are preferred.", grammar: [g.sociolects, g.se-passive], vocab: [w.ambito, w.coloquial, w.termino, w.lenguaje, w.evitar] }
      - { es: "Una persona culta sabe cambiar de registro según con quién habla.", en: "A cultured person knows how to switch register depending on who they are talking to.", altEs: ["Una persona culta sabe cambiar de registro según con quién hable."], grammar: [g.sociolects], vocab: [w.culto, w.registro, w.cambiar-de, w.segun] }
      - { es: "Flipo con lo rápido que cambia el argot: lo que ayer molaba hoy suena viejo.", en: "I'm amazed at how fast slang changes: what was cool yesterday sounds old today.", grammar: [g.sociolects, g.neutral-lo], vocab: [w.flipar, w.argot, w.molar, w.sonar] }
      - { es: "Lucía ha pillado un curro en una tienda de discos, en plan guay.", en: "Lucía has landed a job in a record shop, like, cool.", altEs: ["Lucía ha encontrado un trabajo en una tienda de discos, en plan guay."], grammar: [g.sociolects, g.present-perfect], vocab: [w.curro, w.pillar, w.en-plan] }
      - { es: "Tengo mucho trabajo y estoy muy preocupado.", en: "I have a lot of work and I'm very worried.", grammar: [g.sociolects], vocab: [w.trabajo], transform: { instruction: "Rewrite in Spanish youth slang (currar, rayarse)", answer: "Tengo mucho curro y estoy muy rayado.", alt: ["Tengo un montón de curro y estoy rayadísimo.", "Tengo mucho curro y estoy rayado."] } }
      - { es: "El médico escribe «el paciente presenta cefalea», pero a la abuela le dice «le duele la cabeza».", en: "The doctor writes 'the patient presents with cephalalgia', but tells the grandmother 'your head hurts'.", grammar: [g.sociolects, g.doler], vocab: [w.jerga, w.paciente, w.medico, w.cabeza] }
      - { es: "Esa expresión es demasiado informal para un informe; búscala en un diccionario de sinónimos.", en: "That expression is too informal for a report; look it up in a thesaurus.", altEn: ["That expression is too informal for a report; look it up in a dictionary of synonyms."], grammar: [g.sociolects, g.imperative-pronouns], vocab: [w.expresion, w.informal, w.informe, w.diccionario] }
    exchanges:
      - q: { es: "¿Qué tal el curro nuevo?", en: "How's the new job?" }
        a: { es: "Mola bastante, aunque la peña del turno de noche es un poco rara.", en: "It's pretty cool, although the night-shift crowd is a bit odd." }
        alt: ["Bastante guay, aunque la gente del turno de noche es un poco rara.", "Mola bastante."]
        grammar: [g.sociolects]
        vocab: [w.curro, w.molar, w.peña, w.turno]
      - q: { es: "¿Por qué no has dicho nada en la reunión?", en: "Why didn't you say anything in the meeting?" }
        a: { es: "Me daba palo hablar delante del director.", en: "I felt awkward speaking in front of the director." }
        alt: ["Me daba palo, en plan, hablar delante del director.", "Me daba vergüenza hablar delante del director."]
        grammar: [g.sociolects]
        vocab: [w.dar-palo, w.director]
      - q: { es: "¿Cómo se dice «currar» en un registro formal?", en: "How do you say 'currar' in a formal register?" }
        a: { es: "«Trabajar»; y en una carta, «desempeñar un puesto».", en: "'Trabajar'; and in a letter, 'to hold a position'." }
        alt: ["Trabajar.", "Se dice «trabajar»."]
        grammar: [g.sociolects]
        vocab: [w.currar, w.registro]
      - q: { es: "¿Qué significa «lo petó»?", en: "What does 'lo petó' mean?" }
        a: { es: "Que fue un éxito enorme; es argot juvenil.", en: "That it was a huge success; it's youth slang." }
        alt: ["Que tuvo muchísimo éxito.", "Que fue un éxito total."]
        grammar: [g.sociolects]
        vocab: [w.petar, w.argot, w.exito]
      - q: { es: "Oye, ¿te has rayado por lo del examen?", en: "Hey, did you get stressed about the exam thing?" }
        a: { es: "Un poco, pero ya se me ha pasado.", en: "A bit, but I'm over it now." }
        alt: ["Un poco, pero ya está.", "Un poco, pero ya no."]
        grammar: [g.sociolects]
        vocab: [w.rayarse, w.examen]
    texts:
      - title: "Mensaje a un amigo"
        es: ["Tío, ¿vienes esta noche o qué?", "La peña se junta a las diez en el bar de siempre.", "Trae pasta, que el cajero de aquí está roto.", "Y no te rayes por el curro, que mañana es sábado."]
        en: ["Dude, are you coming tonight or what?", "The crowd is meeting at ten at the usual bar.", "Bring cash, because the cash machine here is broken.", "And don't stress about work, tomorrow is Saturday."]
        grammar: [g.sociolects]
        vocab: [w.peña, w.pasta, w.rayarse, w.curro]
      - title: "Correo formal"
        es: ["Estimado señor Ruiz:", "Le escribo para confirmar nuestra reunión del jueves a las diez.", "Le agradecería que me enviara el informe con antelación.", "Reciba un cordial saludo."]
        en: ["Dear Mr Ruiz,", "I am writing to confirm our meeting on Thursday at ten.", "I would be grateful if you could send me the report in advance.", "Kind regards."]
        grammar: [g.sociolects, g.formal-letters]
        vocab: [w.informe, w.reunion]
  - id: c2.u01.l2
    title: Eufemismos, tabúes y lenguaje inclusivo
    teach: [g.sociolects]
    vocab: [w.eufemismo, w.tabu, w.inclusivo, w.alumnado, w.profesorado, w.estigma, w.estigmatizar, w.prestigio, w.leismo, w.laismo, w.dequeismo, w.queismo, w.vulgarismo, w.vater, w.sin-techo, w.persona-mayor, w.anciano, w.vagabundo, w.palmar, w.ofensivo, w.politicamente-correcto, w.academia, w.permanecer, w.aula, w.oficial, w.imitar, w.religion, w.masculino, w.generico, w.domicilio]
    tip: "Three scales at once: taboo → euphemism (palmar / morir / fallecer), masculine generic → collective noun (los alumnos / el alumnado), and prestige → stigma (leísmo accepted, laísmo and dequeísmo stigmatised)."
    sentences:
      - { es: "Mi abuela no dice que alguien «ha muerto»: dice que «ha fallecido» o que «nos ha dejado».", en: "My grandmother doesn't say that someone 'has died': she says they 'have passed away' or 'have left us'.", grammar: [g.sociolects, g.present-perfect], vocab: [w.eufemismo, w.fallecer, w.morir] }
      - { es: "«Palmarla» es vulgar, «morir» es neutro y «fallecer» es el eufemismo de los periódicos.", en: "'Palmarla' is vulgar, 'morir' is neutral and 'fallecer' is the euphemism of the newspapers.", grammar: [g.sociolects], vocab: [w.palmar, w.vulgar, w.eufemismo, w.periodico] }
      - { es: "Se ruega al alumnado que permanezca en las aulas hasta nuevo aviso.", en: "Students are asked to remain in the classrooms until further notice.", grammar: [g.sociolects, g.indirect-commands], vocab: [w.alumnado, w.aula] }
      - { es: "En lugar de «los profesores y las profesoras», muchos textos oficiales escriben «el profesorado».", en: "Instead of 'los profesores y las profesoras', many official texts write 'el profesorado'.", grammar: [g.sociolects], vocab: [w.profesorado, w.inclusivo, w.oficial] }
      - { es: "La Academia no acepta «todes», pero el debate sobre el lenguaje inclusivo sigue abierto.", en: "The Academy does not accept 'todes', but the debate on inclusive language remains open.", altEs: ["La RAE no acepta «todes», pero el debate sobre el lenguaje inclusivo sigue abierto."], grammar: [g.sociolects], vocab: [w.academia, w.inclusivo, w.genero, w.debate] }
      - { es: "¿Es ofensivo decir «viejo»? Por eso muchos prefieren «persona mayor».", en: "Is it offensive to say 'old person'? That's why many prefer 'elderly person'.", altEs: ["¿Resulta ofensivo decir «viejo»? Por eso muchos prefieren «persona mayor»."], grammar: [g.sociolects], vocab: [w.ofensivo, w.persona-mayor, w.viejo] }
      - { es: "Antes se hablaba de «vagabundos»; hoy la prensa escribe «personas sin techo».", en: "People used to talk about 'vagrants'; today the press writes 'homeless people'.", grammar: [g.sociolects, g.se-impersonal], vocab: [w.sin-techo, w.prensa] }
      - { es: "¿Dónde está el váter? Perdón, quería decir el servicio.", en: "Where's the loo? Sorry, I meant the toilet.", altEs: ["¿Dónde está el baño? Perdón, quería decir el servicio."], grammar: [g.sociolects], vocab: [w.vater, w.servicio] }
      - { es: "El leísmo de persona («le vi») está aceptado, pero el laísmo («la dije») sigue estigmatizado.", en: "Leísmo with people ('le vi') is accepted, but laísmo ('la dije') is still stigmatised.", grammar: [g.sociolects, g.direct-object-pronouns], vocab: [w.leismo, w.laismo, w.estigmatizar, w.aceptar] }
      - { es: "Pienso que tienes razón.", en: "I think you're right.", altEs: ["Creo que tienes razón."], grammar: [g.sociolects], vocab: [w.dequeismo, w.tener-razon], error: { wrong: "Pienso de que tienes razón.", explain: "Dequeísmo: pensar que takes no «de». The extra «de» is a stigmatised vulgarism.", grammar: g.sociolects } }
      - { es: "Decir «haiga» en vez de «haya» es un vulgarismo rural que muchos cómicos imitan.", en: "Saying 'haiga' instead of 'haya' is a rural vulgarism that many comedians imitate.", grammar: [g.sociolects], vocab: [w.vulgarismo, w.rural] }
      - { es: "El dinero y la religión siguen siendo temas tabú en muchas comidas familiares.", en: "Money and religion are still taboo subjects at many family meals.", altEs: ["El dinero y la religión continúan siendo temas tabú en muchas comidas familiares."], grammar: [g.sociolects, g.periphrases-aspect], vocab: [w.tabu, w.religion, w.dinero] }
      - { es: "Hablar con acento andaluz no tiene menos prestigio que hablar como en Valladolid, aunque algunos lo crean.", en: "Speaking with an Andalusian accent has no less prestige than speaking like in Valladolid, even if some people think so.", grammar: [g.sociolects, g.aunque-indicative-subjunctive], vocab: [w.prestigio, w.estigma, w.acento, w.andaluz] }
      - { es: "Los ciudadanos deben votar.", en: "Citizens must vote.", grammar: [g.sociolects], vocab: [w.ciudadano, w.votar], transform: { instruction: "Rewrite with an inclusive collective noun", answer: "La ciudadanía debe votar.", alt: ["La ciudadanía tiene que votar."] } }
      - { es: "¿No te parece políticamente correcto hasta el ridículo llamar «técnico de limpieza» al que limpia?", en: "Don't you think it's politically correct to the point of absurdity to call the person who cleans a 'cleaning technician'?", grammar: [g.sociolects], vocab: [w.politicamente-correcto, w.ridiculo, w.limpieza] }
      - { es: "Me alegro de que hayas venido: sin el «de» sería queísmo.", en: "I'm glad you came: without the 'de' it would be queísmo.", grammar: [g.sociolects, g.subjunctive-emotion], vocab: [w.alegrarse, w.venir] }
    exchanges:
      - q: { es: "¿Cómo está tu abuelo?", en: "How is your grandfather?" }
        a: { es: "Falleció en marzo; perdona, todavía me cuesta decirlo.", en: "He passed away in March; sorry, I still find it hard to say." }
        alt: ["Nos dejó en marzo.", "Falleció en marzo."]
        grammar: [g.sociolects]
        vocab: [w.fallecer, w.eufemismo]
      - q: { es: "¿Es correcto decir «la dije que viniera»?", en: "Is it correct to say 'la dije que viniera'?" }
        a: { es: "No, eso es laísmo; lo correcto es «le dije que viniera».", en: "No, that's laísmo; the correct form is 'le dije que viniera'." }
        alt: ["No, es laísmo: le dije.", "No, lo correcto es «le dije»."]
        grammar: [g.sociolects, g.indirect-object-pronouns]
        vocab: [w.laismo]
      - q: { es: "¿Por qué el ayuntamiento escribe «la ciudadanía» y no «los ciudadanos»?", en: "Why does the town hall write 'la ciudadanía' and not 'los ciudadanos'?" }
        a: { es: "Porque es una forma inclusiva que evita el masculino genérico.", en: "Because it's an inclusive form that avoids the generic masculine." }
        alt: ["Es lenguaje inclusivo.", "Porque es lenguaje inclusivo."]
        grammar: [g.sociolects]
        vocab: [w.inclusivo, w.ciudadania, w.ayuntamiento]
      - q: { es: "¿«Persona mayor» o «anciano»?", en: "'Persona mayor' or 'anciano'?" }
        a: { es: "Depende del contexto, pero «persona mayor» suena más respetuoso.", en: "It depends on the context, but 'persona mayor' sounds more respectful." }
        alt: ["Persona mayor, que es más suave.", "Depende, pero persona mayor suena mejor."]
        grammar: [g.sociolects]
        vocab: [w.persona-mayor, w.contexto]
    texts:
      - title: "Aviso en un instituto"
        es: ["Se informa al alumnado de que mañana no habrá clase.", "El profesorado asistirá a una jornada de formación.", "Las familias recibirán un correo con más detalles."]
        en: ["Students are informed that there will be no class tomorrow.", "The teaching staff will attend a training day.", "Families will receive an email with more details."]
        grammar: [g.sociolects, g.se-impersonal]
        vocab: [w.alumnado, w.profesorado, w.formacion]
      - title: "Nota de prensa"
        es: ["El actor falleció ayer en su domicilio a los noventa años.", "Sus compañeros lo recuerdan como una persona generosa.", "La familia pide respeto en estos momentos difíciles."]
        en: ["The actor passed away yesterday at his home at the age of ninety.", "His colleagues remember him as a generous person.", "The family asks for respect at this difficult time."]
        grammar: [g.sociolects]
        vocab: [w.fallecer, w.actor, w.generoso]
  - id: c2.u01.l3
    title: Vos, che, ahorita
    teach: [g.dialectal-grammar]
    vocab: [w.dialectal, w.voseo, w.po, w.dizque, w.mero, w.mas-nada, w.chileno, w.madrileño, w.rasgo, w.verbo, w.posesivo, w.cuadra, w.exclamar, w.gerente, w.doble]
    tip: "Dialect is grammar too: vos tenés (Río de la Plata), abre hasta las diez = not before ten (Mexico), ¿qué tú quieres? (Caribbean), su casa de él (Andes), ustedes vais (western Andalusia)."
    sentences:
      - { es: "¿Vos tenés tiempo mañana, che? Recién llegué de Córdoba y no conozco a nadie.", en: "Have you got time tomorrow, mate? I've just arrived from Córdoba and I don't know anyone.", grammar: [g.dialectal-grammar, g.voseo], vocab: [w.vos, w.che, w.recien], note: "Rioplatense: vos tenés; recién + preterite = have just." }
      - { es: "En México, «la tienda abre hasta las diez» significa que no abre antes de las diez.", en: "In Mexico, 'la tienda abre hasta las diez' means it doesn't open before ten.", grammar: [g.dialectal-grammar], vocab: [w.hasta, w.tienda, w.abrir] }
      - { es: "¿Mande? No le oí bien, ¿me lo repite, por favor?", en: "Pardon? I didn't hear you well, could you repeat that, please?", altEs: ["¿Cómo? No le oí bien, ¿me lo repite, por favor?"], grammar: [g.dialectal-grammar], vocab: [w.mande, w.oir, w.repetir] }
      - { es: "«Ahorita vengo», dijo, y tardó dos horas: en México, «ahorita» puede ser ahora o nunca.", en: "'I'll be right back,' he said, and took two hours: in Mexico 'ahorita' can mean now or never.", grammar: [g.dialectal-grammar], vocab: [w.ahorita, w.tardar] }
      - { es: "En el Caribe se oye «¿qué tú quieres?», con el sujeto delante del verbo.", en: "In the Caribbean you hear '¿qué tú quieres?', with the subject before the verb.", grammar: [g.dialectal-grammar, g.se-impersonal], vocab: [w.caribeno, w.verbo] }
      - { es: "No quiero más nada, gracias: así se dice en Puerto Rico y en Canarias.", en: "I don't want anything else, thanks: that's how they say it in Puerto Rico and the Canary Islands.", altEs: ["No quiero nada más, gracias: así se dice en Puerto Rico y en Canarias."], grammar: [g.dialectal-grammar], vocab: [w.mas-nada, w.canario] }
      - { es: "Vivimos en el mero centro, a dos cuadras de la plaza.", en: "We live in the very centre, two blocks from the square.", altEs: ["Vivimos en el mero centro, a dos calles de la plaza."], grammar: [g.dialectal-grammar], vocab: [w.mero, w.centro, w.plaza] }
      - { es: "«Su casa de él» es un posesivo doble típico de los Andes.", en: "'Su casa de él' is a double possessive typical of the Andes.", grammar: [g.dialectal-grammar, g.possessives], vocab: [w.posesivo, w.andino, w.tipico] }
      - { es: "¡Había sido caro el hotel!, exclamó la boliviana, sorprendida.", en: "'Oh, the hotel turned out to be expensive!' exclaimed the Bolivian woman, surprised.", grammar: [g.dialectal-grammar, g.pluperfect], vocab: [w.caro, w.hotel, w.sorprendido], note: "Andean pluperfect of surprise: ¡había sido! = it turns out that." }
      - { es: "Dizque el alcalde va a renunciar, pero yo no me lo creo.", en: "Supposedly the mayor is going to resign, but I don't believe it.", altEs: ["Dizque el alcalde va a dimitir, pero yo no me lo creo."], grammar: [g.dialectal-grammar, g.ir-a-future], vocab: [w.dizque, w.alcalde, w.renunciar] }
      - { es: "Vamos al tiro, po, que el bus pasa en cinco minutos, ¿cachái?", en: "Let's go right away, man, the bus comes in five minutes, you know?", grammar: [g.dialectal-grammar], vocab: [w.al-tiro, w.po, w.cachai] }
      - { es: "En Sevilla se oye «ustedes vais», con pronombre de ustedes y verbo de vosotros.", en: "In Seville you hear 'ustedes vais', with the ustedes pronoun and the vosotros verb.", grammar: [g.dialectal-grammar, g.ustedes-vs-vosotros], vocab: [w.ustedes, w.vosotros, w.rasgo, w.pronombre] }
      - { es: "Vos sos muy amable.", en: "You are very kind.", grammar: [g.dialectal-grammar, g.voseo], vocab: [w.vos, w.voseo, w.amable], error: { wrong: "Vos eres muy amable.", explain: "Voseo has its own forms: vos sos, vos tenés, vos hablás; «eres» belongs to tú.", grammar: g.dialectal-grammar } }
      - { es: "Tú tienes razón, ven aquí.", en: "You're right, come here.", grammar: [g.dialectal-grammar], vocab: [w.tener-razon, w.venir], transform: { instruction: "Rewrite with Rioplatense voseo (and acá)", answer: "Vos tenés razón, vení acá.", alt: ["Tenés razón, vení acá."] } }
      - { es: "Platicamos un rato en la cocina y luego nos fuimos para allá.", en: "We chatted for a while in the kitchen and then we went over there.", altEs: ["Charlamos un rato en la cocina y luego nos fuimos para allá."], grammar: [g.dialectal-grammar, g.preterite-regular], vocab: [w.platicar, w.alla, w.cocina] }
      - { es: "Los rasgos dialectales no son errores: son la riqueza de una lengua hablada en veinte países.", en: "Dialectal features are not mistakes: they are the richness of a language spoken in twenty countries.", grammar: [g.dialectal-grammar], vocab: [w.dialectal, w.rasgo, w.lengua, w.error] }
    exchanges:
      - q: { es: "¿De dónde sos, che?", en: "Where are you from, mate?" }
        a: { es: "De Montevideo, pero vivo acá en Madrid desde el año pasado.", en: "From Montevideo, but I've lived here in Madrid since last year." }
        alt: ["Soy de Montevideo.", "De Montevideo, pero vivo acá desde el año pasado."]
        grammar: [g.dialectal-grammar, g.voseo]
        vocab: [w.vos, w.che, w.aca]
      - q: { es: "¿A qué hora abre la farmacia?", en: "What time does the pharmacy open?" }
        a: { es: "Abre hasta las nueve, así que todavía falta.", en: "It doesn't open until nine, so there's still a while to go." }
        alt: ["Hasta las nueve.", "No abre hasta las nueve."]
        grammar: [g.dialectal-grammar]
        vocab: [w.hasta, w.farmacia]
      - q: { es: "¿Me ayudas con las bolsas?", en: "Will you help me with the bags?" }
        a: { es: "Ahorita, mamá, estoy terminando la tarea.", en: "In a minute, Mum, I'm finishing my homework." }
        alt: ["Ahorita voy.", "Ahorita, mamá."]
        grammar: [g.dialectal-grammar, g.estar-gerund]
        vocab: [w.ahorita, w.tarea]
      - q: { es: "¿Qué significa «lo de Juan» en Argentina?", en: "What does 'lo de Juan' mean in Argentina?" }
        a: { es: "La casa de Juan: «vamos a lo de Juan» es «vamos a casa de Juan».", en: "Juan's house: 'vamos a lo de Juan' is 'let's go to Juan's'." }
        alt: ["La casa de Juan.", "Significa la casa de Juan."]
        grammar: [g.dialectal-grammar]
        vocab: [w.casa]
      - q: { es: "¿Y eso de «cachái» qué es?", en: "And what's this 'cachái' thing?" }
        a: { es: "Es chileno: significa «¿entiendes?».", en: "It's Chilean: it means 'do you get it?'." }
        alt: ["Significa «¿entiendes?»; se dice en Chile.", "Es de Chile y significa «¿entiendes?»."]
        grammar: [g.dialectal-grammar]
        vocab: [w.cachai, w.chileno]
    texts:
      - title: "Mensaje desde Buenos Aires"
        es: ["Che, ¿vos venís el sábado o no?", "Recién hablé con Flor y dice que trae el vino.", "Nos juntamos en lo de Martín a las nueve, allá por Palermo."]
        en: ["Hey, are you coming on Saturday or not?", "I've just spoken to Flor and she says she's bringing the wine.", "We're meeting at Martín's at nine, over in Palermo."]
        grammar: [g.dialectal-grammar, g.voseo]
        vocab: [w.che, w.vos, w.recien, w.alla]
      - title: "Cartel en una tienda de México"
        es: ["Abrimos hasta las diez de la mañana.", "Ahorita no hay cambio; disculpe las molestias.", "Si gusta, pase a platicar con el gerente."]
        en: ["We don't open until ten in the morning.", "Right now there is no change; sorry for the inconvenience.", "If you wish, come in and talk to the manager."]
        grammar: [g.dialectal-grammar]
        vocab: [w.hasta, w.ahorita, w.platicar, w.gerente]
  - id: c2.u01.l4
    title: Del latín al español de hoy
    teach: [g.historical-variation]
    vocab: [w.latin, w.evolucionar, w.medieval, w.origen, w.etimologia, w.sonido, w.inicial, w.vuestra-merced, w.acortar, w.americano, w.germanico, w.almohada, w.canoa, w.conservar, w.manuscrito, w.demostrativo]
    tip: "facere → hacer, noctem → noche, plenum → lleno; vuestra merced → usted. Word layers: pre-Roman (perro), Arabic (al-), Amerindian (tomate), Germanic (guerra), English (fútbol)."
    sentences:
      - { es: "El latín «facere» se convirtió en «hacer»: la f inicial pasó a h.", en: "Latin 'facere' became 'hacer': the initial f changed to h.", grammar: [g.historical-variation, g.preterite-irregular], vocab: [w.latin, w.convertirse, w.inicial] }
      - { es: "«Noche» viene de «noctem», y «lleno», de «plenum»; así evolucionan los sonidos.", en: "'Noche' comes from 'noctem', and 'lleno' from 'plenum'; that is how sounds evolve.", grammar: [g.historical-variation], vocab: [w.sonido, w.evolucionar, w.noche, w.lleno] }
      - { es: "¿Sabías que «ojalá» procede del árabe y significa «si Dios quiere»?", en: "Did you know that 'ojalá' comes from Arabic and means 'God willing'?", grammar: [g.historical-variation, g.imperfect], vocab: [w.ojala, w.arabe, w.proceder, w.significar] }
      - { es: "Almohada, aceite, alcalde y azúcar: casi todas las palabras que empiezan por «al-» son árabes.", en: "Almohada, aceite, alcalde and azúcar: almost all the words beginning with 'al-' are Arabic.", grammar: [g.historical-variation, g.relative-que-quien], vocab: [w.almohada, w.aceite, w.alcalde, w.azucar, w.arabe] }
      - { es: "«Vuestra merced» se fue acortando hasta convertirse en «usted».", en: "'Vuestra merced' was gradually shortened until it became 'usted'.", grammar: [g.historical-variation, g.periphrases-aspect], vocab: [w.vuestra-merced, w.usted, w.acortar] }
      - { es: "En la Edad Media, «vos» era un tratamiento de respeto; hoy en España suena antiguo y en Argentina, familiar.", en: "In the Middle Ages, 'vos' was a respectful form of address; today in Spain it sounds old-fashioned and in Argentina, familiar.", grammar: [g.historical-variation, g.imperfect], vocab: [w.medieval, w.vos, w.respeto, w.antiguo] }
      - { es: "Tomate, chocolate y canoa son de origen indígena americano.", en: "Tomate, chocolate and canoa are of indigenous American origin.", altEs: ["Tomate, chocolate y canoa tienen origen indígena americano."], grammar: [g.historical-variation], vocab: [w.origen, w.indigena, w.tomate, w.chocolate] }
      - { es: "Guerra y guardar son palabras germánicas que trajeron los visigodos.", en: "Guerra and guardar are Germanic words brought by the Visigoths.", grammar: [g.historical-variation, g.preterite-irregular], vocab: [w.germanico, w.guerra, w.guardar, w.traer] }
      - { es: "La etimología explica por qué «izquierda» no se parece a nada en latín: es una palabra prerromana.", en: "Etymology explains why 'izquierda' resembles nothing in Latin: it is a pre-Roman word.", grammar: [g.historical-variation], vocab: [w.etimologia, w.izquierda, w.latin, w.parecerse] }
      - { es: "El castellano de 1605 todavía se lee con facilidad; el inglés de la misma época cuesta mucho más.", en: "The Castilian of 1605 can still be read easily; English of the same period is much harder.", grammar: [g.historical-variation, g.se-passive], vocab: [w.castellano, w.epoca, w.costar] }
      - { es: "¿Quién habría dicho que «fútbol» y «líder» son préstamos del inglés con ortografía española?", en: "Who would have thought that 'fútbol' and 'líder' are loanwords from English with Spanish spelling?", grammar: [g.historical-variation, g.conditional-perfect], vocab: [w.prestamo, w.futbol, w.lider, w.ortografia] }
      - { es: "La Academia ha hecho varias reformas: «solo» y «guion» ya no llevan tilde.", en: "The Academy has made several reforms: 'solo' and 'guion' no longer take an accent.", grammar: [g.historical-variation, g.ya-todavia], vocab: [w.academia, w.reforma, w.tilde] }
      - { es: "Hace tiempo que no nos vemos.", en: "We haven't seen each other for a long time.", grammar: [g.historical-variation, g.desde-hace], vocab: [w.tiempo], error: { wrong: "Ha tiempo que no nos vemos.", explain: "«Tiempo ha» survives only as an archaic set phrase; in modern Spanish say «hace tiempo».", grammar: g.historical-variation } }
      - { es: "Perro, izquierda y guerra no vienen del latín.", en: "Perro, izquierda and guerra don't come from Latin.", altEs: ["Perro, izquierda y guerra no proceden del latín."], grammar: [g.historical-variation], vocab: [w.latin, w.venir], transform: { instruction: "Say that they come from other languages, using proceder de", answer: "Perro, izquierda y guerra proceden de otras lenguas.", alt: ["Proceden de otras lenguas."] } }
      - { es: "Si el latín no hubiera cambiado, hoy no existirían ni el español ni el italiano ni el francés.", en: "If Latin hadn't changed, today neither Spanish nor Italian nor French would exist.", grammar: [g.historical-variation, g.si-clauses-past], vocab: [w.latin, w.existir, w.cambiar] }
      - { es: "Las lenguas evolucionan porque las hablamos; una lengua que no cambia es una lengua muerta.", en: "Languages evolve because we speak them; a language that doesn't change is a dead language.", altEs: ["Las lenguas cambian porque las hablamos; una lengua que no cambia es una lengua muerta."], grammar: [g.historical-variation], vocab: [w.evolucionar, w.lengua, w.muerto] }
    exchanges:
      - q: { es: "¿De dónde viene la palabra «almohada»?", en: "Where does the word 'almohada' come from?" }
        a: { es: "Del árabe, como casi todas las que empiezan por «al-».", en: "From Arabic, like almost all the ones that begin with 'al-'." }
        alt: ["Del árabe.", "Viene del árabe."]
        grammar: [g.historical-variation]
        vocab: [w.almohada, w.arabe]
      - q: { es: "¿Por qué decimos «usted» y no «vos» en España?", en: "Why do we say 'usted' and not 'vos' in Spain?" }
        a: { es: "Porque «vuestra merced» se convirtió en «usted» y «vos» dejó de usarse.", en: "Because 'vuestra merced' became 'usted' and 'vos' stopped being used." }
        alt: ["Porque usted viene de vuestra merced.", "Porque «vuestra merced» acabó en «usted»."]
        grammar: [g.historical-variation]
        vocab: [w.vuestra-merced, w.usted]
      - q: { es: "¿«Chocolate» es una palabra española?", en: "Is 'chocolate' a Spanish word?" }
        a: { es: "Es de origen indígena: viene del náhuatl de México.", en: "It is of indigenous origin: it comes from the Nahuatl of Mexico." }
        alt: ["No, es de origen indígena.", "Viene del náhuatl, una lengua indígena de México."]
        grammar: [g.historical-variation]
        vocab: [w.origen, w.indigena, w.chocolate]
      - q: { es: "¿Se entiende el Quijote hoy sin traducción?", en: "Can Don Quixote be understood today without translation?" }
        a: { es: "Sí, con notas; el castellano de 1605 ha cambiado poco.", en: "Yes, with notes; the Castilian of 1605 has changed little." }
        alt: ["Sí, con algunas notas.", "Sí, aunque hacen falta notas."]
        grammar: [g.historical-variation, g.se-passive]
        vocab: [w.traduccion, w.castellano]
    texts:
      - title: "Pie de foto en un museo"
        es: ["Esta página es de un manuscrito medieval del siglo XIII.", "Se lee «fablar» donde hoy escribimos «hablar».", "La f inicial del latín todavía no se había perdido."]
        en: ["This page is from a medieval manuscript of the thirteenth century.", "It reads 'fablar' where today we write 'hablar'.", "The initial f of Latin had not yet been lost."]
        grammar: [g.historical-variation, g.pluperfect]
        vocab: [w.medieval, w.siglo, w.latin]
      - title: "Titular y entradilla"
        es: ["La Academia cambia las normas de la tilde.", "«Solo» y los demostrativos ya no llevan acento.", "Muchos escritores han anunciado que no piensan obedecer."]
        en: ["The Academy changes the rules on the written accent.", "'Solo' and the demonstratives no longer take an accent.", "Many writers have announced that they do not intend to obey."]
        grammar: [g.historical-variation, g.headlines]
        vocab: [w.academia, w.norma, w.escritor]
dialogues:
  - id: c2.u01.d1
    title: ¿Tú, vos o usted?
    context: Ana, from Madrid, and Mateo, from Buenos Aires, are new colleagues at a translation agency and compare how they speak.
    lines:
      - { speaker: Ana, es: "Mateo, ¿te molesta que te hable de tú? En la oficina todos nos tuteamos.", en: "Mateo, do you mind if I address you as tú? In the office we all use tú with each other." }
      - { speaker: Mateo, es: "Para nada, che. Yo te voy a decir «vos», que es lo que me sale; no te lo tomes como una falta de respeto.", en: "Not at all, mate. I'm going to say 'vos' to you, which is what comes naturally; don't take it as a lack of respect." }
      - { speaker: Ana, es: "Al contrario, me encanta. Lo que me cuesta es el «recién llegué»: aquí decimos «acabo de llegar».", en: "On the contrary, I love it. What I find hard is 'recién llegué': here we say 'acabo de llegar'." }
      - { speaker: Mateo, es: "Y a mí me cuesta el «vosotros». La primera semana escribí «ustedes tienen» en un correo y el jefe pensó que estaba enfadado.", en: "And I find 'vosotros' hard. The first week I wrote 'ustedes tienen' in an email and the boss thought I was angry." }
      - { speaker: Ana, es: "Es que aquí «ustedes» suena a registro formal. En Sevilla, en cambio, dicen «ustedes vais» sin ningún problema.", en: "The thing is that here 'ustedes' sounds like formal register. In Seville, on the other hand, they say 'ustedes vais' without any problem." }
      - { speaker: Mateo, es: "Qué lío, en plan, cada ciudad con su gramática. ¿Y el argot? Mis sobrinos de aquí dicen que todo «mola» o es «chungo».", en: "What a mess, like, every city with its own grammar. And the slang? My nephews here say everything 'mola' or is 'chungo'." }
      - { speaker: Ana, es: "Y los tuyos de Buenos Aires dirán que todo es «copado» o «un bajón». No te rayes: en seis meses hablarás las dos variedades.", en: "And yours in Buenos Aires probably say everything is 'copado' or 'un bajón'. Don't stress: in six months you'll speak both varieties." }
      - { speaker: Mateo, es: "Mientras no mezcle registros en una traducción jurídica, todo bien. Ayer casi escribo «el acusado la palmó».", en: "As long as I don't mix registers in a legal translation, all good. Yesterday I nearly wrote 'the accused kicked the bucket'." }
      - { speaker: Ana, es: "¡Falleció, Mateo, falleció! Eso sí que habría sido chungo.", en: "'Passed away', Mateo, 'passed away'! Now that would really have been bad." }
      - { speaker: Mateo, es: "Dale, tenés razón. Vamos a tomar un café y me explicás eso del laísmo madrileño.", en: "Okay, you're right. Let's go for a coffee and you can explain that Madrid laísmo thing to me." }
    questions:
      - { q: "What does Mateo say about the way he will address Ana?", options: ["He will use usted to be polite", "He will say vos, as comes naturally to him", "He will avoid pronouns altogether"], answer: 1 }
      - { q: "Why did the boss think Mateo was angry?", options: ["He used ustedes, which sounds formal in Madrid", "He wrote in capital letters", "He used slang in an email"], answer: 0 }
      - { q: "Which register mistake did Mateo nearly make in a legal translation?", options: ["Using vosotros", "Writing a slang word for 'died'", "Forgetting the accent on solo"], answer: 1 }
