id: r.b1.que-bom-que-voce-veio
level: b1
title: Que bom que você veio!
kind: dialogue
intro: Júlia, a history student in Ouro Preto, shows her cousin Rafael from São Paulo around the old gold-mining town. Notice how emotions and judgements trigger the subjunctive.
allow: [júlia, rafael, ouro, preto, aleijadinho, vila, rica, francisco, assis, pilar, tiradentes, unesco, paulistano, ok, uai, mineira, inconfidência]
paragraphs:
  - { es: "A rodoviária de Ouro Preto fica no alto de uma ladeira. Quando o Rafael desceu do ônibus, com a mochila nas costas e cara de sono, a prima dele já estava esperando.", en: "Ouro Preto's bus station is at the top of a steep street. When Rafael got off the bus, with his backpack on his back and looking sleepy, his cousin was already waiting." }
  - { es: "— Rafa! Que bom que você veio! Eu estava com medo de que você desistisse na última hora.", en: "'Rafa! I'm so glad you came! I was afraid you'd give up at the last minute.'" }
  - { es: "— Desistir? Nunca. Mas confesso que estou surpreso que a viagem seja tão longa. Foram quase dez horas de ônibus desde São Paulo!", en: "'Give up? Never. But I admit I'm surprised the journey is so long. It was almost ten hours on the bus from São Paulo!'" }
  - { es: "— Valeu a pena, você vai ver. Deixa a mochila na minha república e vamos andar. Só te aviso uma coisa: aqui não existe rua plana.", en: "'It was worth it, you'll see. Leave your backpack at my student house and let's walk. Just one warning: there's no such thing as a flat street here.'" }
  - { es: "Meia hora depois, os dois subiam uma rua de pedra tão inclinada que o Rafael tinha que parar a cada cinquenta metros.", en: "Half an hour later, the two of them were climbing a stone street so steep that Rafael had to stop every fifty metres." }
  - { es: "— Júlia, é incrível que as pessoas morem aqui. Como é que os carros sobem isso?", en: "'Júlia, it's incredible that people live here. How do cars get up this?'" }
  - { es: "— Devagar e com muita fé — ri ela. — Mas olha para trás.", en: "'Slowly and with a lot of faith,' she laughs. 'But look behind you.'" }
  - { es: "O Rafael virou e ficou em silêncio. Lá embaixo, a cidade inteira aparecia entre os morros: telhados vermelhos, casas brancas com janelas azuis e verdes, e as torres de mais de dez igrejas.", en: "Rafael turned and fell silent. Down below, the whole town appeared between the hills: red roofs, white houses with blue and green windows, and the towers of more than ten churches." }
  - { es: "— Nossa. Agora eu entendo por que você ama este lugar.", en: "'Wow. Now I understand why you love this place.'" }
  - { es: "— Fico feliz que você goste. Sabia que Ouro Preto já foi uma das cidades mais ricas da América? No século dezoito, ela se chamava Vila Rica, e saía daqui tanto ouro que boa parte foi para Portugal. Por isso as igrejas são assim, cheias de ouro por dentro.", en: "'I'm glad you like it. Did you know Ouro Preto was once one of the richest cities in the Americas? In the eighteenth century it was called Vila Rica, and so much gold came out of here that a large part of it went to Portugal. That's why the churches are like that, full of gold inside.'" }
  - { es: "Eles entraram na Igreja de São Francisco de Assis. A Júlia mostrou a porta de pedra-sabão e as imagens de madeira.", en: "They went into the Church of São Francisco de Assis. Júlia showed him the soapstone doorway and the wooden statues." }
  - { es: "— Isto é do Aleijadinho, o maior artista do barroco brasileiro. O mais impressionante é que ele tinha uma doença que deformou as mãos dele, e mesmo assim continuou trabalhando até velho. Dizem que no fim ele amarrava as ferramentas nos braços.", en: "'This is by Aleijadinho, the greatest artist of the Brazilian baroque. The most impressive thing is that he had an illness that deformed his hands, and even so he kept working into old age. They say that in the end he tied his tools to his arms.'" }
  - { es: "— Que história triste. É uma pena que pouca gente lá em São Paulo conheça isso.", en: "'What a sad story. It's a pity so few people back in São Paulo know about this.'" }
  - { es: "— Por isso eu estudo história, uai! Ah, e amanhã é a vez da Praça Tiradentes. Ali, no século dezoito, um grupo de mineiros planejou a independência contra Portugal. O líder, o Tiradentes, foi enforcado no Rio. Hoje ele é herói nacional, e o dia vinte e um de abril é feriado.", en: "'That's why I study history, uai! Oh, and tomorrow it's Praça Tiradentes' turn. There, in the eighteenth century, a group of people from Minas planned independence from Portugal. The leader, Tiradentes, was hanged in Rio. Today he's a national hero, and the twenty-first of April is a public holiday.'" }
  - { es: "— Estou gostando tanto que já lamento ter que ir embora no domingo.", en: "'I'm enjoying this so much that I'm already sorry I have to leave on Sunday.'" }
  - { es: "— Então volta no festival de inverno, em julho. Mas agora, chega de história: está na hora de um pão de queijo com café. Aqui em Minas a gente leva isso muito a sério.", en: "'Then come back for the winter festival, in July. But that's enough history for now: it's time for a pão de queijo with coffee. Here in Minas we take that very seriously.'" }
questions:
  - { q: "Do que a Júlia estava com medo?", options: ["De que o ônibus atrasasse", "De que o Rafael desistisse da viagem", "De que chovesse"], answer: 1, explain: "«Eu estava com medo de que você desistisse na última hora.»" }
  - { q: "Por que o Rafael parava a cada cinquenta metros?", options: ["Para tirar fotos", "Porque a rua era muito inclinada", "Porque estava com fome"], answer: 1, explain: "They climbed «uma rua de pedra tão inclinada que o Rafael tinha que parar a cada cinquenta metros»." }
  - { q: "Por que as igrejas de Ouro Preto têm tanto ouro?", options: ["Porque a cidade foi muito rica no século dezoito", "Porque foram construídas recentemente", "Porque Portugal mandou o ouro"], answer: 0, explain: "Vila Rica was «uma das cidades mais ricas da América» in the 18th century thanks to its gold." }
  - { q: "O que é impressionante na história do Aleijadinho, segundo a Júlia?", options: ["Ele era português", "Ele continuou trabalhando apesar de uma doença nas mãos", "Ele construiu a cidade sozinho"], answer: 1, explain: "«Ele tinha uma doença que deformou as mãos dele, e mesmo assim continuou trabalhando até velho.»" }
  - { q: "Quem foi Tiradentes?", options: ["Um artista do barroco", "O líder de um movimento pela independência", "Um rei de Portugal"], answer: 1, explain: "A group planned independence from Portugal; «o líder, o Tiradentes, foi enforcado no Rio»." }
