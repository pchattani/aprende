id: r.b1.si-j-etais-comedien-a-avignon
level: b1
title: Si j'étais comédien à Avignon
kind: dialogue
intro: It's July in Avignon, during the theatre festival. Théo, an accountant, tells his friend Inès that he would like to change his life. Listen to the conditional and the si + imparfait clauses.
allow: [théo, inès, vilar, off, ok]
paragraphs:
  - { es: "Inès : Alors, tu as aimé le spectacle d'hier soir, dans la cour du Palais des Papes ?", en: "Inès: So, did you like the show last night in the courtyard of the Palais des Papes?" }
  - { es: "Théo : J'ai adoré. Deux mille spectateurs en plein air, sous les étoiles, devant ces murs immenses… Tu imagines, être sur cette scène ? Si j'étais comédien, je donnerais tout pour jouer là.", en: "Théo: I loved it. Two thousand spectators in the open air, under the stars, in front of those huge walls… Can you imagine being on that stage? If I were an actor, I'd give anything to perform there." }
  - { es: "Inès : Toi, comédien ? Tu es comptable, Théo !", en: "Inès: You, an actor? You're an accountant, Théo!" }
  - { es: "Théo : Justement. J'en ai marre des chiffres. Tous les jours, je suis devant mon écran de neuf heures à six heures. Si je pouvais, je démissionnerais demain. Je m'inscrirais à un cours de théâtre et je viendrais ici chaque été, avec une petite troupe.", en: "Théo: Exactly. I'm fed up with numbers. Every day I'm in front of my screen from nine to six. If I could, I'd resign tomorrow. I'd sign up for a drama course and I'd come here every summer with a little theatre company." }
  - { es: "Inès : Attends, tu es sérieux ? Tu sais combien de troupes viennent au festival ? Dans le Off, il y a plus de mille spectacles chaque année ! Les comédiens distribuent des tracts toute la journée dans les rues, sous le soleil, pour avoir dix spectateurs le soir.", en: "Inès: Wait, are you serious? Do you know how many companies come to the festival? In the Off there are more than a thousand shows every year! The actors hand out flyers all day in the streets, in the sun, to get ten spectators in the evening." }
  - { es: "Théo : Je sais. Mais ce serait mieux que mon bureau. Le festival existe depuis 1947. Jean Vilar l'a créé parce qu'il voulait que le théâtre soit pour tout le monde, pas seulement pour les riches de Paris. J'aime cette idée.", en: "Théo: I know. But it would be better than my office. The festival has existed since 1947. Jean Vilar created it because he wanted theatre to be for everyone, not just for rich people in Paris. I love that idea." }
  - { es: "Inès : Moi aussi. Mais si tu démissionnais, comment est-ce que tu paierais ton loyer ?", en: "Inès: So do I. But if you resigned, how would you pay your rent?" }
  - { es: "Théo : Je trouverais un petit travail. Je pourrais être serveur, ou donner des cours de maths. Et je déménagerais dans un appartement plus petit.", en: "Théo: I'd find a little job. I could be a waiter, or give maths lessons. And I'd move into a smaller flat." }
  - { es: "Inès : Écoute, si j'étais toi, je ne quitterais pas mon travail tout de suite. Je commencerais par un cours de théâtre le soir, pour voir si ça me plaît vraiment. Ensuite, tu pourrais demander quelques semaines de congé et jouer dans le Off l'été prochain.", en: "Inès: Listen, if I were you, I wouldn't leave my job right away. I'd start with an evening drama class, to see if I really like it. Then you could ask for a few weeks off and perform in the Off next summer." }
  - { es: "Théo : Tu as peut-être raison. Ce serait moins risqué. Mais j'ai trente-cinq ans, Inès. Si j'attends trop, je ne le ferai jamais.", en: "Théo: Maybe you're right. It would be less risky. But I'm thirty-five, Inès. If I wait too long, I'll never do it." }
  - { es: "Inès : Trente-cinq ans, ce n'est pas vieux ! Et puis, tu sais, au Moyen Âge, les papes ont quitté Rome pour s'installer ici. Eux aussi, ils ont changé de vie !", en: "Inès: Thirty-five isn't old! And anyway, you know, in the Middle Ages the popes left Rome to settle here. They changed their lives too!" }
  - { es: "Théo : (rire) Ce n'est pas tout à fait la même chose… Bon, on va voir le pont avant le spectacle de ce soir ?", en: "Théo: (laughing) It's not quite the same thing… Right, shall we go and see the bridge before tonight's show?" }
  - { es: "Inès : Le pont Saint-Bénézet ? Il n'en reste que quatre arches ! Tu sais que dans la chanson, on danse sur le pont, mais on dit qu'autrefois, les gens dansaient plutôt sous le pont, sur une île au milieu du Rhône.", en: "Inès: The Pont Saint-Bénézet? Only four arches of it are left! You know that in the song people dance on the bridge, but they say that in the old days people actually danced under the bridge, on an island in the middle of the Rhône." }
  - { es: "Théo : Alors on ira danser dessous. Et l'été prochain, tu viendras me voir jouer ?", en: "Théo: Then we'll go and dance under it. And next summer, will you come and see me perform?" }
  - { es: "Inès : Si tu joues, je serai au premier rang. Promis !", en: "Inès: If you perform, I'll be in the front row. Promise!" }
questions:
  - { q: "Quel est le métier de Théo ?", options: ["Il est comédien", "Il est comptable", "Il est serveur"], answer: 1, explain: "«Tu es comptable, Théo !»" }
  - { q: "Que ferait Théo s'il pouvait ?", options: ["Il démissionnerait et ferait du théâtre", "Il partirait à Rome", "Il achèterait un appartement"], answer: 0, explain: "«Si je pouvais, je démissionnerais demain. Je m'inscrirais à un cours de théâtre…»" }
  - { q: "Pourquoi Jean Vilar a-t-il créé le festival ?", options: ["Pour gagner de l'argent", "Pour que le théâtre soit pour tout le monde", "Pour les riches de Paris"], answer: 1, explain: "«Il voulait que le théâtre soit pour tout le monde, pas seulement pour les riches de Paris.»" }
  - { q: "Quel conseil Inès donne-t-elle à Théo ?", options: ["Démissionner tout de suite", "Commencer par un cours de théâtre le soir", "Oublier le théâtre"], answer: 1, explain: "«Si j'étais toi, je ne quitterais pas mon travail tout de suite. Je commencerais par un cours de théâtre le soir.»" }
  - { q: "Selon Inès, où dansait-on autrefois ?", options: ["Sur le pont", "Sous le pont, sur une île", "Dans le Palais des Papes"], answer: 1, explain: "«On dit qu'autrefois, les gens dansaient plutôt sous le pont, sur une île au milieu du Rhône.»" }
glossary:
  - { es: comptable, en: accountant }
  - { es: "j'en ai marre", en: "I'm fed up (informal)" }
  - { es: marre, en: "(en avoir marre = to be fed up)" }
  - { es: chiffres, en: "numbers, figures" }
  - { es: distribuent, en: hand out }
  - { es: tracts, en: flyers }
  - { es: maths, en: maths }
  - { es: dessous, en: underneath }
  - { es: milieu, en: middle }
  - { es: rang, en: row }
