name: Diagnose live site in WebKit
on:
  push:
    branches: [diag/webkit]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit chromium
      - run: node scripts/diag/probe-live.mjs
