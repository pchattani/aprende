id: r.b1.la-carta-que-nadie-abrio
level: b1
title: La carta que nadie abrió
kind: text
intro: A short story. Clara goes back to her late grandmother's house to sell it and finds a letter that had never been opened.
allow: [clara, carmen, tomás, manuel, buenos, aires, argentina]
paragraphs:
  - { es: "Clara no había vuelto al pueblo desde el funeral de su abuela. Habían pasado dos años y la casa seguía igual: la puerta verde, el jardín lleno de plantas, el olor a madera vieja. Al entrar, sintió que su abuela acababa de salir a comprar el pan.", en: "Clara hadn't been back to the village since her grandmother's funeral. Two years had passed and the house was still the same: the green door, the garden full of plants, the smell of old wood. On entering, she felt her grandmother had just gone out to buy bread." }
  - { es: "Había ido para vender la casa. Antes de llamar a la agencia, quería mirar los armarios y guardar los recuerdos que valían la pena. Empezó por el dormitorio y terminó, al cabo de tres horas, en el desván, donde nunca había subido de niña porque le daba miedo.", en: "She had gone there to sell the house. Before calling the agency, she wanted to look through the wardrobes and keep the mementos that were worth it. She started with the bedroom and finished, three hours later, in the attic, where she had never gone up as a child because it frightened her." }
  - { es: "Allí, dentro de una caja de zapatos, encontró una carta. El sobre estaba cerrado y amarillo. Nadie lo había abierto. Iba dirigida a su abuela, Carmen, y tenía un sello de Argentina de 1962.", en: "There, inside a shoebox, she found a letter. The envelope was sealed and yellow. Nobody had opened it. It was addressed to her grandmother, Carmen, and had an Argentinian stamp from 1962." }
  - { es: "Clara se sentó en el suelo y la abrió con cuidado. La había escrito un hombre llamado Tomás. Le contaba que había llegado bien a Buenos Aires, que había encontrado trabajo en el puerto y que en dos años volvería a buscarla para casarse con ella.", en: "Clara sat down on the floor and opened it carefully. A man called Tomás had written it. He told her he had arrived safely in Buenos Aires, that he had found work at the port and that in two years he would come back for her to marry her." }
  - { es: "Clara no entendía nada. Su abuelo se llamaba Manuel, no Tomás, y nunca había vivido en Argentina. ¿Quién era ese hombre? ¿Por qué su abuela no había abierto la carta?", en: "Clara didn't understand anything. Her grandfather was called Manuel, not Tomás, and he had never lived in Argentina. Who was that man? Why hadn't her grandmother opened the letter?" }
  - { es: "Esa noche llamó a su madre. Después de un largo silencio, su madre le contó la historia. Tomás había sido el primer novio de Carmen. Se habían prometido esperarse, pero él emigró y, durante un año, no escribió ni una palabra. Cuando por fin llegó la carta, Carmen ya se había casado con Manuel, un vecino bueno y tranquilo que la quería desde siempre.", en: "That night she called her mother. After a long silence, her mother told her the story. Tomás had been Carmen's first boyfriend. They had promised to wait for each other, but he emigrated and, for a year, didn't write a single word. When the letter finally arrived, Carmen had already married Manuel, a good, quiet neighbour who had always loved her." }
  - { es: "«Tu abuela nunca quiso leerla», dijo su madre. «Decía que había tomado una decisión y que no quería pensar en otra vida». Clara pensó en todas las veces que su abuela había mirado hacia el jardín sin decir nada.", en: "'Your grandmother never wanted to read it,' her mother said. 'She said she had made a decision and didn't want to think about another life.' Clara thought of all the times her grandmother had looked out towards the garden without saying anything." }
  - { es: "Antes de marcharse, Clara volvió a meter la carta en el sobre y la dejó en el desván, en el mismo sitio. Ha decidido no vender la casa, al menos de momento. Algunas historias, piensa, necesitan quedarse donde nacieron.", en: "Before leaving, Clara put the letter back in the envelope and left it in the attic, in the same place. She has decided not to sell the house, at least for now. Some stories, she thinks, need to stay where they were born." }
questions:
  - { q: "Why had Clara gone back to the village?", options: ["To sell the house", "To visit her grandmother", "To look for a letter"], answer: 0 }
  - { q: "Who had written the letter?", options: ["Her grandfather Manuel", "Her grandmother's first boyfriend", "A neighbour from Argentina"], answer: 1 }
  - { q: "Why had Carmen never opened the letter?", options: ["She had lost it in the attic", "It arrived after she had married and she didn't want to think about another life", "She couldn't read"], answer: 1 }
  - { q: "What does Clara decide at the end?", options: ["To sell the house quickly", "To keep the letter with her", "Not to sell the house for now"], answer: 2 }
glossary:
  - { es: funeral, en: funeral }
  - { es: olor, en: smell }
  - { es: madera, en: wood }
  - { es: desván, en: attic }
  - { es: sobre, en: envelope }
  - { es: sello, en: stamp }
  - { es: dirigido a, en: addressed to }
