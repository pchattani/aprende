        a: { es: "C'est un triskell : c'était à ma grand-mère.", en: "It's a triskelion: it was my grandmother's." }
        alt: ["Un cadeau de ma grand-mère.", "C'est un triskell breton."]
        grammar: [g.c-etait]
        vocab: [w.pendentif, w.triskell]
    texts:
      - title: "Le Clos Lupin"
        es: ["Maurice Leblanc habitait dans cette maison à Étretat.", "Il écrivait ici les histoires d'Arsène Lupin, le gentleman cambrioleur.", "Aujourd'hui, c'est un musée."]
        en: ["Maurice Leblanc lived in this house in Étretat.", "He wrote the stories of Arsène Lupin, the gentleman burglar, here.", "Today it's a museum."]
        grammar: [g.imparfait-uses]
        vocab: [w.cambrioleur]
      - title: "Le samedi avec Papi"
        es: ["Le samedi, mon grand-père portait sa vieille marinière.", "On allait au port et il m'achetait une boule de glace.", "C'était le meilleur moment de la semaine."]
        en: ["On Saturdays my grandfather wore his old striped top.", "We went to the harbour and he bought me a scoop of ice cream.", "It was the best moment of the week."]
        grammar: [g.imparfait-uses, g.c-etait]
        vocab: [w.marinière, w.boule, w.papi]
    spicy:
      - { es: "Avec ta marinière, tu ressemblais à un marin de roman.", en: "In your striped top you looked like a sailor out of a novel.", grammar: [g.imparfait-uses], vocab: [w.marinière, w.roman] }
      - { es: "Je m'ennuyais beaucoup le dimanche... et puis tu es arrivé dans ma vie.", en: "I used to be so bored on Sundays... and then you came into my life.", altEs: ["Je m'ennuyais beaucoup le dimanche... et puis tu es arrivée dans ma vie."], grammar: [g.imparfait-uses, g.pc-vs-imparfait], vocab: [w.ennuyer] }
      - { es: "Tu prenais toujours mes frites ; aujourd'hui, tu prends mon cœur. Un vrai cambrioleur !", en: "You always used to take my chips; today you're taking my heart. A real burglar!", grammar: [g.imparfait-uses], vocab: [w.cambrioleur] }
      - { es: "Ma grand-mère disait que les hommes bavards étaient dangereux. Elle avait raison ?", en: "My grandmother used to say that chatty men were dangerous. Was she right?", grammar: [g.imparfait-uses], vocab: [w.bavard, w.dangereux] }
      - { es: "Deux boules de glace, deux cuillères, la mer devant nous : c'était notre premier rendez-vous.", en: "Two scoops of ice cream, two spoons, the sea in front of us: it was our first date.", grammar: [g.c-etait], vocab: [w.boule] }
dialogues:
  - id: a2.u03.d1
    title: "Les photos de Mamie"
    context: "Léa looks at old holiday photos with her grandmother."
    lines:
      - { speaker: Léa, es: "Mamie, c'est toi sur cette photo ?", en: "Granny, is that you in this photo?" }
      - { speaker: Mamie, es: "Oui ! J'avais huit ans. C'était à Étretat, en 1960.", en: "Yes! I was eight. It was in Étretat, in 1960." }
      - { speaker: Léa, es: "Vous habitiez à Étretat ?", en: "Did you live in Étretat?" }
      - { speaker: Mamie, es: "Non, nous habitions à Rouen, mais nous passions tous les étés à Étretat.", en: "No, we lived in Rouen, but we spent every summer in Étretat." }
      - { speaker: Léa, es: "Et qu'est-ce que vous faisiez toute la journée ?", en: "And what did you do all day?" }
      - { speaker: Mamie, es: "Le matin, on se baignait. L'après-midi, mon frère grimpait sur la falaise et moi, je cherchais des coquillages.", en: "In the morning we went swimming. In the afternoon my brother climbed on the cliff and I looked for shells." }
      - { speaker: Léa, es: "Il n'avait pas peur ?", en: "Wasn't he scared?" }
      - { speaker: Mamie, es: "Non, il était très courageux. Mais ma mère, elle, avait toujours peur !", en: "No, he was very brave. But my mother was always scared!" }
      - { speaker: Léa, es: "Et ce monsieur avec la marinière ?", en: "And this man in the striped top?" }
      - { speaker: Mamie, es: "C'était mon père. Il lisait des romans d'Arsène Lupin sous le parasol.", en: "That was my father. He used to read Arsène Lupin novels under the beach umbrella." }
      - { speaker: Léa, es: "C'était comment, la vie à l'époque ?", en: "What was life like back then?" }
      - { speaker: Mamie, es: "C'était simple. Il n'y avait pas de télé, mais on ne s'ennuyait jamais.", en: "It was simple. There was no TV, but we were never bored." }
    questions:
      - { q: "Où habitait la famille de Mamie ?", options: ["À Étretat", "À Rouen", "À Paris"], answer: 1, explain: "Nous habitions à Rouen, mais nous passions tous les étés à Étretat." }
      - { q: "Que faisait le frère de Mamie l'après-midi ?", options: ["Il cherchait des coquillages.", "Il grimpait sur la falaise.", "Il lisait des romans."], answer: 1, explain: "Mon frère grimpait sur la falaise." }
      - { q: "Qui lisait sous le parasol ?", options: ["La mère de Mamie", "Le père de Mamie", "Le frère de Mamie"], answer: 1, explain: "C'était mon père. Il lisait des romans d'Arsène Lupin." }
      - { q: "Comment était la vie à l'époque, selon Mamie ?", options: ["Simple", "Ennuyeuse", "Difficile"], answer: 0, explain: "C'était simple... on ne s'ennuyait jamais." }
writing:
  - task: "Describe your life when you were a child: where you lived, what you were like and what you did every day (imparfait)."
    min: 30
    max: 70
    use: [w.enfance, w.village, w.curieux, w.bavard, w.sage]
    useAtLeast: 3
    grammar: [g.imparfait-forms, g.imparfait-uses]
    expect:
      - { pattern: "\\bquand (j['’][eé]tais|nous [eé]tions|on [eé]tait|j['’]avais)", hint: "Start with Quand j'étais petit(e)…" }
      - { pattern: "(?<![a-zàâçéèêëîïôûùœ])(?!(mais|jamais|fais|fait|vais|sais|sait|frais|lait|parfait|anglais|fran[cç]ais|japonais|portugais|palais|souhait|vrais|mauvais)(?![a-zàâçéèêëîïôûùœ]))[a-zàâçéèêëîïôûùœ]{2,}(ais|ait|ions|iez|aient)(?![a-zàâçéèêëîïôûùœ])", hint: "Use the imparfait for past habits: j'habitais, j'allais, je jouais…" }
    model: { es: "Quand j'étais petite, j'habitais dans un village près de la mer. J'étais curieuse et un peu bavarde, mais assez sage. Tous les jours, j'allais à l'école à pied avec mon frère aîné. Le soir, je jouais avec mes poupées et mon chat. C'était une enfance très heureuse.", en: "When I was little, I lived in a village near the sea. I was curious and a bit chatty, but quite well-behaved. Every day I walked to school with my older brother. In the evening I played with my dolls and my cat. It was a very happy childhood." }
  - task: "Describe your childhood summer holidays: where you used to go and what you used to do every summer (Tous les étés, on allait…)."
    min: 30
    max: 70
    use: [w.plage, w.se-baigner, w.château-de-sable, w.pêcher, w.mamie]
    useAtLeast: 3
    grammar: [g.imparfait-uses]
    expect:
      - { pattern: "(?<![a-zàâçéèêëîïôûùœ])(?!(mais|jamais|fais|fait|vais|sais|sait|frais|lait|parfait|anglais|fran[cç]ais|japonais|portugais|palais|souhait|vrais|mauvais)(?![a-zàâçéèêëîïôûùœ]))[a-zàâçéèêëîïôûùœ]{2,}(ais|ait|ions|iez|aient)(?![a-zàâçéèêëîïôûùœ])", hint: "Use the imparfait for habits: on allait, on se baignait…" }
      - { pattern: "\\b(tous les|toutes les|chaque|souvent|toujours|d['’]habitude|le matin|le soir|l['’]apr[eè]s-midi)\\b", hint: "Say how often: tous les étés, chaque matin, souvent…" }
    model: { es: "Tous les étés, on allait chez ma mamie, en Normandie. Le matin, on se baignait dans la mer et on faisait des châteaux de sable. L'après-midi, mon papi pêchait au port. Le soir, on mangeait une glace sur la plage. J'adorais ces vacances !", en: "Every summer we used to go to my grandma's in Normandy. In the morning we swam in the sea and built sandcastles. In the afternoon my grandpa went fishing at the harbour. In the evening we ate an ice cream on the beach. I loved those holidays!" }
  - task: "Describe Étretat, or a place you loved as a child: what it was like and what there was (c'était…, il y avait…)."
    min: 30
    max: 70
    use: [w.falaise, w.mer, w.vague, w.endroit, w.mouette]
    useAtLeast: 3
    grammar: [g.c-etait, g.imparfait-uses]
    expect:
      - { pattern: "\\bc['’][eé]tait\\b", hint: "Give your impression: C'était magnifique…" }
      - { pattern: "\\bil y avait\\b", hint: "Say what there was: Il y avait …" }
    model: { es: "Quand j'étais enfant, j'allais souvent à Étretat. C'était un endroit magnifique ! Il y avait des falaises blanches, une grande arche et une aiguille dans la mer. Les vagues étaient fortes et il y avait beaucoup de mouettes. C'était calme et beau.", en: "When I was a child I often went to Étretat. It was a wonderful place! There were white cliffs, a big arch and a needle in the sea. The waves were strong and there were lots of seagulls. It was calm and beautiful." }
  - task: "Imagine Arsène Lupin, the gentleman thief, as a child: describe what he was like and what he used to do."
    min: 30
    max: 70
    use: [w.voleur, w.courageux, w.paresseux, w.bonbon, w.roman]
    useAtLeast: 3
    grammar: [g.imparfait-forms, g.imparfait-uses]
