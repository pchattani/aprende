id: a2.u04
title: Contar historias
lessons:
  - id: a2.u04.l1
    title: Estaba durmiendo cuando…
    teach: [g.preterite-vs-imperfect, g.mientras-cuando]
    tip: "Imperfect for the scene, preterite for what happened: Llovía cuando salí."
    vocab: [w.mientras, w.cuando.conj, w.en-ese-momento, w.de-pronto, w.oscuro.phr, w.ruido.phr, w.luz, w.oir, w.asustarse, w.gritar, w.susto, w.extrano, w.raro]
    sentences:
      - { es: "Estaba en la ducha cuando sonó el teléfono.", en: "I was in the shower when the phone rang.", grammar: [g.preterite-vs-imperfect, g.mientras-cuando], vocab: [w.cuando.conj, w.telefono] }
      - { es: "Mientras cenábamos, llamó mi madre.", en: "While we were having dinner, my mother called.", altEs: ["Mientras estábamos cenando, llamó mi madre."], grammar: [g.mientras-cuando], vocab: [w.mientras, w.llamar] }
      - { es: "Llovía mucho cuando salí de casa.", en: "It was raining hard when I left the house.", altEs: ["Estaba lloviendo mucho cuando salí de casa."], grammar: [g.preterite-vs-imperfect], vocab: [w.llover, w.salir], error: { wrong: "Llovió mucho cuando salí de casa.", explain: "The rain is the background to the event: llovía (imperfect).", grammar: g.preterite-vs-imperfect } }
      - { es: "Estaba oscuro y de pronto oí un ruido.", en: "It was dark and all of a sudden I heard a noise.", altEs: ["Estaba oscuro y de repente oí un ruido."], grammar: [g.preterite-vs-imperfect], vocab: [w.oscuro.phr, w.de-pronto, w.ruido.phr] }
      - { es: "Me asusté y grité.", en: "I got scared and screamed.", altEs: ["Yo me asusté y grité."], grammar: [g.preterite-regular], vocab: [w.asustarse, w.gritar] }
      - { es: "En ese momento se encendió la luz.", en: "At that moment the light came on.", grammar: [g.preterite-regular], vocab: [w.en-ese-momento, w.luz] }
      - { es: "Era mi gato, que jugaba con una pelota.", en: "It was my cat, playing with a ball.", grammar: [g.imperfect-uses], vocab: [w.gato, w.jugar] }
      - { es: "¡Qué susto me dio!", en: "What a fright it gave me!", grammar: [g.preterite-irregular], vocab: [w.susto, w.dar] }
      - { es: "Fue una noche muy extraña.", en: "It was a very strange night.", altEs: ["Fue una noche muy rara."], grammar: [g.preterite-ser-ir], vocab: [w.extrano, w.noche] }
      - { es: "Oímos algo raro en el jardín mientras dormíamos.", en: "We heard something odd in the garden while we were sleeping.", altEs: ["Oímos algo extraño en el jardín mientras dormíamos."], grammar: [g.mientras-cuando], vocab: [w.oir, w.raro] }
      - { es: "Cuando era pequeño, me asustaba la oscuridad.", en: "When I was little, the dark scared me.", altEs: ["Cuando era pequeño, tenía miedo de la oscuridad."], grammar: [g.mientras-cuando], vocab: [w.oscuridad, w.asustarse] }
      - { es: "Los niños estaban jugando cuando empezó a nevar.", en: "The children were playing when it started to snow.", grammar: [g.estar-gerund-past], vocab: [w.jugar, w.nevar] }
      - { es: "Yo estaba leyendo cuando llegaste.", en: "I was reading when you arrived.", altEs: ["Estaba leyendo cuando llegaste."], grammar: [g.estar-gerund-past], vocab: [w.leer, w.llegar], transform: { instruction: "Change 'I' to 'they'", answer: "Ellos estaban leyendo cuando llegaste.", alt: ["Estaban leyendo cuando llegaste."] } }
    exchanges:
      - q: { es: "¿Dónde estabas cuando llamó tu madre?", en: "Where were you when your mother called?" }
        a: { es: "Estaba en la ducha.", en: "I was in the shower." }
        alt: ["En la ducha.", "Estaba cenando."]
        grammar: [g.preterite-vs-imperfect, g.mientras-cuando]
        vocab: [w.cuando.conj, w.llamar]
      - q: { es: "¿Qué tiempo hacía cuando saliste de casa?", en: "What was the weather like when you left the house?" }
        a: { es: "Llovía mucho.", en: "It was raining hard." }
        alt: ["Llovía.", "Hacía sol."]
        grammar: [g.preterite-vs-imperfect]
        vocab: [w.llover, w.salir]
      - q: { es: "¿Qué era ese ruido?", en: "What was that noise?" }
        a: { es: "Era mi gato, que jugaba con una pelota.", en: "It was my cat, playing with a ball." }
        alt: ["Era el gato.", "Nada, era el gato."]
        grammar: [g.imperfect-uses]
        vocab: [w.ruido.phr, w.gato]
      - q: { es: "¿Te asustaste?", en: "Did you get scared?" }
        a: { es: "Sí, me asusté y grité.", en: "Yes, I got scared and screamed." }
        alt: ["Sí, mucho.", "No, no me asusté."]
        grammar: [g.preterite-regular]
        vocab: [w.asustarse, w.gritar]
    texts:
      - title: "Mensaje de Lucía"
        es: ["Anoche pasó algo muy raro.", "Estaba durmiendo cuando oí un ruido en la cocina.", "Me levanté, encendí la luz y... ¡era el gato!", "¡Qué susto me dio!"]
        en: ["Last night something very odd happened.", "I was sleeping when I heard a noise in the kitchen.", "I got up, turned on the light and... it was the cat!", "What a fright it gave me!"]
        grammar: [g.preterite-vs-imperfect, g.estar-gerund-past]
        vocab: [w.raro, w.oir, w.susto]
    spicy:
      - { es: "Estaba tomando un café cuando entraste. En ese momento olvidé mi nombre.", en: "I was having a coffee when you came in. At that moment I forgot my name.", grammar: [g.preterite-vs-imperfect, g.mientras-cuando], vocab: [w.en-ese-momento, w.cuando.conj] }
      - { es: "Mientras tú bailabas, yo miraba. De pronto, también bailé.", en: "While you were dancing, I was watching. Suddenly, I danced too.", grammar: [g.mientras-cuando, g.preterite-vs-imperfect], vocab: [w.mientras, w.de-pronto] }
      - { es: "Oí un ruido raro: era mi gato, que también quería hablar contigo.", en: "I heard a strange noise: it was my cat, who also wanted to talk to you.", grammar: [g.preterite-vs-imperfect], vocab: [w.oir, w.raro] }
      - { es: "Estaba oscuro y me asusté, pero cuando llegaste tú, todo tuvo luz.", en: "It was dark and I got scared, but when you arrived, everything lit up.", grammar: [g.preterite-vs-imperfect], vocab: [w.asustarse, w.luz] }
      - { es: "No grité cuando te vi, pero casi.", en: "I didn't scream when I saw you, but almost.", grammar: [g.preterite-vs-imperfect, g.mientras-cuando], vocab: [w.gritar] }
  - id: a2.u04.l2
    title: Una anécdota
    teach: [g.narration-connectors]
    vocab: [w.asi-que, w.como.conj, w.sin-embargo, w.afortunadamente, w.desgraciadamente, w.anecdota, w.accidente, w.sorpresa, w.caerse, w.romperse, w.hacerse-dano, w.resolver, w.ocurrir, w.suceder, w.darse-cuenta]
    sentences:
      - { es: "Te voy a contar una anécdota muy divertida.", en: "I'm going to tell you a very funny anecdote.", altEs: ["Voy a contarte una anécdota muy divertida."], grammar: [g.ir-a-infinitive], vocab: [w.anecdota, w.divertido] }
      - { es: "Como llovía, cogimos un taxi.", en: "As it was raining, we took a taxi.", altEs: ["Como llovía, tomamos un taxi."], grammar: [g.narration-connectors], vocab: [w.como.conj, w.coger] }
      - { es: "El taxi no llegó, así que fuimos andando.", en: "The taxi didn't come, so we walked.", altEs: ["El taxi no llegó, así que fuimos a pie."], grammar: [g.narration-connectors], vocab: [w.asi-que, w.andar] }
      - { es: "Me caí en la calle y me rompí el brazo.", en: "I fell in the street and broke my arm.", grammar: [g.preterite-regular], vocab: [w.caerse, w.romperse, w.brazo] }
      - { es: "Afortunadamente no me hice mucho daño.", en: "Fortunately I didn't hurt myself much.", altEs: ["Por suerte no me hice mucho daño."], grammar: [g.narration-connectors], vocab: [w.afortunadamente, w.hacerse-dano] }
      - { es: "Desgraciadamente llegamos tarde a la fiesta.", en: "Unfortunately we arrived late to the party.", altEs: ["Desgraciadamente llegamos a la fiesta tarde."], grammar: [g.narration-connectors], vocab: [w.desgraciadamente, w.llegar] }
      - { es: "Sin embargo, lo pasamos muy bien.", en: "However, we had a great time.", altEs: ["Sin embargo, lo pasamos genial."], grammar: [g.connectors-contrast], vocab: [w.sin-embargo, w.pasarlo-bien] }
      - { es: "¿Qué ocurrió después? — Nada especial.", en: "What happened next? — Nothing special.", altEs: ["¿Qué pasó después? — Nada especial."], grammar: [g.preterite-regular], vocab: [w.ocurrir, w.especial] }
      - { es: "Al final todo se resolvió.", en: "In the end everything was sorted out.", grammar: [g.se-passive], vocab: [w.resolver, w.al-final] }
      - { es: "Cuando llegué a casa, me di cuenta de que no tenía las llaves.", en: "When I got home, I realised I didn't have my keys.", grammar: [g.preterite-vs-imperfect], vocab: [w.darse-cuenta, w.llave], error: { wrong: "Me di cuenta que no tenía las llaves.", explain: "darse cuenta de que (keep the de).", grammar: g.prepositions-verbs } }
      - { es: "Fue una sorpresa muy agradable.", en: "It was a very pleasant surprise.", grammar: [g.preterite-ser-ir], vocab: [w.sorpresa] }
      - { es: "Ayer hubo un accidente en la autopista.", en: "Yesterday there was an accident on the motorway.", grammar: [g.preterite-irregular], vocab: [w.accidente, w.haber] }
      - { es: "Sucedió algo extraño el otro día.", en: "Something strange happened the other day.", grammar: [g.preterite-regular], vocab: [w.suceder, w.extrano] }
    exchanges:
      - q: { es: "¿Por qué cogisteis un taxi?", en: "Why did you take a taxi?" }
        a: { es: "Como llovía, cogimos un taxi.", en: "As it was raining, we took a taxi." }
        alt: ["Porque llovía.", "Porque estaba lloviendo."]
        grammar: [g.narration-connectors]
        vocab: [w.como.conj, w.coger]
      - q: { es: "¿Y qué pasó después?", en: "And what happened next?" }
        a: { es: "Nada especial; al final todo se resolvió.", en: "Nothing special; in the end everything was sorted out." }
        alt: ["Nada especial.", "Nada."]
        grammar: [g.narration-connectors]
        vocab: [w.ocurrir, w.al-final]
      - q: { es: "¿Te hiciste daño?", en: "Did you hurt yourself?" }
        a: { es: "Afortunadamente no, solo me caí.", en: "Fortunately not, I just fell." }
        alt: ["No, afortunadamente.", "Sí, me rompí el brazo."]
        grammar: [g.narration-connectors]
        vocab: [w.hacerse-dano, w.afortunadamente]
      - q: { es: "¿Llegasteis a tiempo a la fiesta?", en: "Did you get to the party on time?" }
        a: { es: "Desgraciadamente no, llegamos muy tarde.", en: "Unfortunately not, we arrived very late." }
        alt: ["No, llegamos tarde.", "Sí, llegamos a tiempo."]
        grammar: [g.narration-connectors]
        vocab: [w.desgraciadamente, w.llegar]
    texts:
      - title: "Una anécdota"
        es: ["El sábado fuimos a una boda en el campo.", "El taxi no llegó, así que fuimos andando bajo la lluvia.", "Desgraciadamente llegamos tarde; sin embargo, lo pasamos muy bien."]
        en: ["On Saturday we went to a wedding in the country.", "The taxi didn't come, so we walked in the rain.", "Unfortunately we arrived late; however, we had a great time."]
        grammar: [g.narration-connectors, g.connectors-contrast]
        vocab: [w.asi-que, w.desgraciadamente, w.sin-embargo]
    spicy:
      - { es: "Me caí delante de ti, así que ahora me debes un café.", en: "I fell over in front of you, so now you owe me a coffee.", grammar: [g.narration-connectors], vocab: [w.caerse, w.asi-que] }
      - { es: "Afortunadamente no me hice daño; desgraciadamente, me viste.", en: "Luckily I didn't hurt myself; unluckily, you saw me.", grammar: [g.narration-connectors], vocab: [w.afortunadamente, w.desgraciadamente, w.hacerse-dano] }
      - { es: "Como llovía, entré en el bar. Sin embargo, me quedé por ti.", en: "As it was raining, I went into the bar. However, I stayed because of you.", grammar: [g.narration-connectors, g.preterite-vs-imperfect], vocab: [w.como.conj, w.sin-embargo] }
      - { es: "Tengo una anécdota: ayer me di cuenta de que me gustas.", en: "I have an anecdote: yesterday I realised I like you.", grammar: [g.narration-connectors], vocab: [w.anecdota, w.darse-cuenta] }
      - { es: "Se rompió mi taza, pero fue una sorpresa bonita: me ayudaste tú.", en: "My cup broke, but it was a nice surprise: you helped me.", grammar: [g.narration-connectors, g.preterite-ser-ir], vocab: [w.romperse, w.sorpresa] }
  - id: a2.u04.l3
    title: ¡Qué susto!
    teach: [g.preterite-vs-imperfect]
    vocab: [w.policia, w.ladron, w.cartera, w.robar, w.peligroso, w.escalera, w.suelo, w.pared, w.techo, w.bombero, w.ambulancia, w.fuego, w.humo, w.tormenta, w.golpe, w.herido, w.salvar, w.escapar]
    sentences:
      - { es: "Un ladrón me robó la cartera en el metro.", en: "A thief stole my wallet on the metro.", altEs: ["Me robaron la cartera en el metro."], grammar: [g.preterite-regular], vocab: [w.ladron, w.robar, w.cartera] }
      - { es: "Llamé a la policía, pero el ladrón ya había escapado.", en: "I called the police, but the thief had already escaped.", grammar: [g.pluperfect], vocab: [w.policia, w.escapar] }
      - { es: "Mientras bajaba la escalera, oí un golpe.", en: "While I was going down the stairs, I heard a bang.", altEs: ["Mientras bajaba las escaleras, oí un golpe."], grammar: [g.mientras-cuando], vocab: [w.escalera, w.golpe] }
      - { es: "Había humo en la cocina: ¡fuego!", en: "There was smoke in the kitchen: fire!", grammar: [g.imperfect], vocab: [w.humo, w.fuego] }
      - { es: "Los bomberos llegaron enseguida y apagaron el fuego.", en: "The firefighters arrived right away and put out the fire.", altEs: ["Los bomberos llegaron rápidamente y apagaron el fuego."], grammar: [g.preterite-regular], vocab: [w.bombero, w.enseguida] }
      - { es: "Nadie resultó herido, afortunadamente.", en: "Nobody was injured, fortunately.", grammar: [g.preterite-regular], vocab: [w.herido, w.nadie] }
      - { es: "La ambulancia llevó al hombre al hospital.", en: "The ambulance took the man to the hospital.", altEs: ["La ambulancia se llevó al hombre al hospital."], grammar: [g.preterite-regular], vocab: [w.ambulancia, w.hospital] }
      - { es: "Durante la tormenta se cayó un árbol sobre el techo.", en: "During the storm a tree fell on the roof.", grammar: [g.preterite-regular], vocab: [w.tormenta, w.techo, w.caerse] }
      - { es: "El suelo estaba mojado y era muy peligroso.", en: "The floor was wet and very dangerous.", altEs: ["El suelo estaba mojado; era muy peligroso."], grammar: [g.imperfect-uses], vocab: [w.suelo, w.mojado, w.peligroso] }
      - { es: "Un vecino salvó al perro.", en: "A neighbour saved the dog.", grammar: [g.a-personal], vocab: [w.salvar, w.vecino] }
      - { es: "Había una mancha grande en la pared.", en: "There was a big stain on the wall.", altEs: ["Había una mancha muy grande en la pared."], grammar: [g.imperfect], vocab: [w.pared] }
      - { es: "El policía me preguntó qué había pasado.", en: "The police officer asked me what had happened.", altEs: ["El policía me preguntó qué pasó."], grammar: [g.reported-speech-past], vocab: [w.policia, w.preguntar] }
      - { es: "Cuando llegó la policía, el ladrón corría por la calle.", en: "When the police arrived, the thief was running down the street.", grammar: [g.preterite-vs-imperfect], vocab: [w.policia, w.correr], error: { wrong: "Cuando llegó la policía, el ladrón corrió por la calle.", explain: "An action in progress at that moment takes the imperfect: corría.", grammar: g.preterite-vs-imperfect } }
    exchanges:
      - q: { es: "¿Qué te robaron?", en: "What did they steal from you?" }
        a: { es: "Un ladrón me robó la cartera en el metro.", en: "A thief stole my wallet on the metro." }
        alt: ["La cartera.", "Me robaron la cartera."]
        grammar: [g.preterite-regular]
        vocab: [w.robar, w.cartera]
      - q: { es: "¿Llamaste a la policía?", en: "Did you call the police?" }
        a: { es: "Sí, pero el ladrón ya había escapado.", en: "Yes, but the thief had already escaped." }
        alt: ["Sí, enseguida.", "No, no llamé."]
        grammar: [g.pluperfect, g.preterite-regular]
        vocab: [w.policia, w.escapar]
      - q: { es: "¿Hubo heridos?", en: "Was anyone injured?" }
        a: { es: "No, afortunadamente no hubo heridos.", en: "No, fortunately nobody was injured." }
        alt: ["No, nadie.", "No, afortunadamente."]
        grammar: [g.preterite-irregular]
        vocab: [w.herido, w.nadie]
      - q: { es: "¿Qué hacía el ladrón cuando llegó la policía?", en: "What was the thief doing when the police arrived?" }
        a: { es: "Corría por la calle.", en: "He was running down the street." }
        alt: ["Estaba corriendo por la calle.", "Corría."]
        grammar: [g.preterite-vs-imperfect]
        vocab: [w.ladron, w.correr]
    texts:
      - title: "Noticia del barrio"
        es: ["Fuego en una cocina del barrio.", "Había mucho humo, pero los bomberos llegaron enseguida y apagaron el fuego.", "Un vecino salvó al perro de la familia."]
        en: ["Fire in a kitchen in the neighbourhood.", "There was a lot of smoke, but the firefighters arrived right away and put out the fire.", "A neighbour saved the family's dog."]
        grammar: [g.preterite-vs-imperfect]
        vocab: [w.fuego, w.humo, w.bombero]
    spicy:
      - { es: "Nadie me robó la cartera, pero tú me robaste el sueño.", en: "Nobody stole my wallet, but you stole my sleep.", grammar: [g.preterite-vs-imperfect], vocab: [w.robar, w.cartera] }
      - { es: "Había una tormenta y yo no tenía miedo: estabas tú.", en: "There was a storm and I wasn't scared: you were there.", grammar: [g.preterite-vs-imperfect, g.imperfect], vocab: [w.tormenta] }
      - { es: "No llamé a los bomberos cuando te vi, pero casi: ¡qué calor!", en: "I didn't call the fire brigade when I saw you, but almost: so hot!", grammar: [g.preterite-vs-imperfect], vocab: [w.bombero] }
      - { es: "Subía la escalera cuando te vi y casi me caí. Fue peligroso... y bonito.", en: "I was going up the stairs when I saw you and I nearly fell. It was dangerous... and nice.", grammar: [g.preterite-vs-imperfect, g.mientras-cuando], vocab: [w.escalera, w.peligroso] }
      - { es: "La policía no vino, pero tú me salvaste de una fiesta aburrida.", en: "The police didn't come, but you saved me from a boring party.", grammar: [g.preterite-vs-imperfect], vocab: [w.policia, w.salvar] }
  - id: a2.u04.l4
    title: Total, que…
    teach: [g.narration-connectors]
    vocab: [w.desaparecer, w.aparecer, w.seguir.phr, w.menos-mal, w.que-pasa, w.resulta-que, w.total-que, w.enseguida, w.mojado, w.solo.adj]
    sentences:
      - { es: "¿Qué pasó al final? — Resulta que era una broma.", en: "What happened in the end? — It turns out it was a joke.", grammar: [g.narration-connectors], vocab: [w.que-pasa, w.resulta-que] }
      - { es: "Total, que no fuimos al concierto.", en: "So, in the end we didn't go to the concert.", altEs: ["Así que al final no fuimos al concierto."], grammar: [g.narration-connectors], vocab: [w.total-que, w.concierto] }
      - { es: "Menos mal que llevaba el paraguas.", en: "Thank goodness I had my umbrella.", altEs: ["Menos mal que tenía el paraguas."], grammar: [g.imperfect-uses], vocab: [w.menos-mal, w.llevar] }
      - { es: "Mi gato desapareció tres días y luego apareció en el jardín del vecino.", en: "My cat disappeared for three days and then appeared in the neighbour's garden.", grammar: [g.preterite-regular], vocab: [w.desaparecer, w.aparecer] }
      - { es: "Estaba solo en casa y tenía miedo.", en: "I was alone at home and I was afraid.", altEs: ["Estaba sola en casa y tenía miedo."], grammar: [g.imperfect-uses], vocab: [w.solo.adj, w.miedo] }
      - { es: "Llegué a casa completamente mojado.", en: "I got home completely soaked.", altEs: ["Llegué a casa completamente mojada."], grammar: [g.preterite-spelling-changes], vocab: [w.mojado, w.llegar] }
      - { es: "A pesar de todo, seguimos adelante.", en: "Despite everything, we carried on.", grammar: [g.connectors-contrast], vocab: [w.seguir.phr] }
      - { es: "Enseguida me di cuenta del error.", en: "I immediately realised the mistake.", altEs: ["Me di cuenta del error enseguida."], grammar: [g.preterite-irregular], vocab: [w.enseguida, w.darse-cuenta] }
      - { es: "Primero perdí el tren, después empezó a llover y al final llegué dos horas tarde.", en: "First I missed the train, then it started to rain and in the end I arrived two hours late.", grammar: [g.narration-connectors], vocab: [w.perder, w.llover] }
      - { es: "De repente alguien gritó mi nombre.", en: "Suddenly someone shouted my name.", altEs: ["De pronto alguien gritó mi nombre."], grammar: [g.narration-connectors], vocab: [w.de-repente, w.gritar] }
      - { es: "Era tarde, no había nadie y las calles estaban vacías.", en: "It was late, there was nobody about and the streets were empty.", grammar: [g.imperfect-uses], vocab: [w.nadie, w.calle] }
      - { es: "Entonces vi una luz y corrí hacia ella.", en: "Then I saw a light and ran towards it.", altEs: ["Entonces vi una luz y fui corriendo hacia ella."], grammar: [g.narration-connectors], vocab: [w.luz, w.correr] }
      - { es: "Cuando abrí la puerta, mis amigos estaban allí: ¡era una fiesta sorpresa!", en: "When I opened the door, my friends were there: it was a surprise party!", grammar: [g.preterite-vs-imperfect], vocab: [w.sorpresa, w.abrir], transform: { instruction: "Change 'I' to 'she'", answer: "Cuando abrió la puerta, sus amigos estaban allí: ¡era una fiesta sorpresa!" } }
    exchanges:
      - q: { es: "¿Qué pasó al final?", en: "What happened in the end?" }
        a: { es: "Resulta que era una fiesta sorpresa.", en: "It turns out it was a surprise party." }
        alt: ["Era una fiesta sorpresa.", "Total, que era una fiesta sorpresa."]
        grammar: [g.narration-connectors]
        vocab: [w.resulta-que, w.sorpresa]
      - q: { es: "¿Fuisteis al concierto?", en: "Did you go to the concert?" }
        a: { es: "Total, que no fuimos; perdimos el tren.", en: "So, in the end we didn't go; we missed the train." }
        alt: ["No, al final no fuimos.", "No, perdimos el tren."]
        grammar: [g.narration-connectors]
        vocab: [w.total-que, w.perder]
      - q: { es: "¿Encontraste a tu gato?", en: "Did you find your cat?" }
        a: { es: "Sí, menos mal; apareció en el jardín del vecino.", en: "Yes, thank goodness; it turned up in the neighbour's garden." }
        alt: ["Sí, apareció en el jardín del vecino.", "Sí, menos mal."]
        grammar: [g.preterite-regular, g.narration-connectors]
        vocab: [w.aparecer, w.menos-mal]
      - q: { es: "¿Llegaste muy mojado?", en: "Did you arrive very wet?" }
        a: { es: "Sí, muy mojado; menos mal que llevaba otra camisa.", en: "Yes, very wet; thank goodness I had another shirt with me." }
        alt: ["Sí, muy mojado.", "No, llevaba un abrigo."]
        grammar: [g.imperfect-uses, g.narration-connectors]
        vocab: [w.mojado, w.menos-mal]
    texts:
      - title: "Mensaje de Tom"
        es: ["¿Qué pasa, Yuki?", "Resulta que perdí el autobús, después empezó a llover y total, que llegué dos horas tarde.", "Menos mal que el profesor no dijo nada."]
        en: ["What's up, Yuki?", "It turns out I missed the bus, then it started raining and so, in the end I arrived two hours late.", "Thank goodness the teacher didn't say anything."]
        grammar: [g.narration-connectors]
        vocab: [w.que-pasa, w.resulta-que, w.total-que]
    spicy:
      - { es: "Resulta que mi perro desapareció... y apareció en tu casa. Le gustas.", en: "Turns out my dog disappeared... and showed up at your house. He likes you.", grammar: [g.narration-connectors], vocab: [w.resulta-que, w.desaparecer, w.aparecer] }
      - { es: "Total, que llegué mojado, solo y tarde, pero tú me esperaste. Menos mal.", en: "Long story short, I arrived wet, alone and late, but you waited for me. Thank goodness.", altEs: ["Total, que llegué mojada, sola y tarde, pero tú me esperaste. Menos mal."], grammar: [g.narration-connectors], vocab: [w.total-que, w.mojado, w.menos-mal] }
      - { es: "¿Qué pasa? Nada, que estás muy guapo y no sé qué decir.", en: "What's up? Nothing, just that you look very handsome and I don't know what to say.", altEs: ["¿Qué pasa? Nada, que estás muy guapa y no sé qué decir."], grammar: [g.narration-connectors], vocab: [w.que-pasa] }
      - { es: "Enseguida me di cuenta: la persona más interesante de la fiesta estaba sola, así que le hablé.", en: "I realised straight away: the most interesting person at the party was alone, so I talked to them.", grammar: [g.narration-connectors, g.preterite-vs-imperfect], vocab: [w.enseguida, w.solo.adj] }
      - { es: "Seguí adelante con mi plan y te invité a cenar. Menos mal que dijiste que sí.", en: "I went ahead with my plan and invited you to dinner. Thank goodness you said yes.", grammar: [g.narration-connectors, g.preterite-irregular], vocab: [w.seguir.phr, w.menos-mal] }
dialogues:
  - id: a2.u04.d1
    title: ¿Qué te pasó?
    context: Yuki arrives late and soaked to a class. Tom asks what happened.
    lines:
      - { speaker: Tom, es: "¡Yuki! ¿Qué te pasó? Estás completamente mojada.", en: "Yuki! What happened to you? You're completely soaked." }
      - { speaker: Yuki, es: "Uf, qué día. Estaba esperando el autobús y de repente empezó a llover muchísimo.", en: "Ugh, what a day. I was waiting for the bus and suddenly it started raining really hard." }
      - { speaker: Tom, es: "¿No llevabas paraguas?", en: "Didn't you have an umbrella?" }
      - { speaker: Yuki, es: "No, porque cuando salí de casa hacía sol. Total, que el autobús no llegaba, así que fui andando.", en: "No, because when I left home it was sunny. So, the bus wasn't coming, so I walked." }
      - { speaker: Tom, es: "¿Y por qué llegas tan tarde? Son las once.", en: "And why are you so late? It's eleven." }
      - { speaker: Yuki, es: "Resulta que mientras caminaba, me caí y me hice daño en la rodilla.", en: "It turns out that while I was walking, I fell and hurt my knee." }
      - { speaker: Tom, es: "¡Qué susto! ¿Estás bien?", en: "What a fright! Are you OK?" }
      - { speaker: Yuki, es: "Sí, menos mal. Un señor muy amable me ayudó y me invitó a un café. Y después perdí el móvil.", en: "Yes, thank goodness. A very kind man helped me and bought me a coffee. And then I lost my phone." }
      - { speaker: Tom, es: "¡No! ¿Lo encontraste?", en: "No! Did you find it?" }
      - { speaker: Yuki, es: "Sí, afortunadamente estaba en la cafetería. En fin, una mañana horrible.", en: "Yes, fortunately it was in the café. Anyway, a horrible morning." }
    questions:
      - { q: "Why didn't Yuki have an umbrella?", options: ["She lost it", "It was sunny when she left", "She forgot it on the bus"], answer: 1 }
      - { q: "What happened while she was walking?", options: ["She met a friend", "She fell and hurt her knee", "She found a phone"], answer: 1 }
      - { q: "Where was her phone?", options: ["At home", "On the bus", "In the café"], answer: 2 }
writing:
  - task: "Something strange happened last night in your hotel in Santa Fe. Write what you were doing when it happened (Estaba … cuando …)."
    min: 30
    max: 60
    use: [w.mientras, w.ruido, w.oir, w.asustarse, w.de-pronto]
    useAtLeast: 3
    grammar: [g.preterite-vs-imperfect, g.mientras-cuando]
    expect:
      - { pattern: "\\b(estaba|est[aá]bamos|dorm[ií]a|le[ií]a|cenaba|ve[ií]a|buscaba|hab[ií]a)", hint: "Set the scene with the imperfect: estaba leyendo, dormía …" }
      - { pattern: "\\bcuando\\b|\\bmientras\\b", hint: "Link the two actions: … cuando oí …, mientras buscaba …" }
    model: { es: "Anoche estaba leyendo en mi habitación del hotel cuando oí un ruido extraño. De pronto, no había luz. Me asusté mucho. Mientras buscaba el móvil, alguien llamó a la puerta: ¡era mi amigo Juan con la cena!", en: "Last night I was reading in my hotel room when I heard a strange noise. Suddenly there was no light. I got really scared. While I was looking for my phone, someone knocked at the door: it was my friend Juan with dinner!" }
  - task: "Tell a short anecdote about a small accident, linking it with así que, sin embargo, afortunadamente or desgraciadamente."
    min: 35
    max: 65
    use: [w.asi-que, w.sin-embargo, w.afortunadamente, w.caerse, w.accidente]
    useAtLeast: 3
    grammar: [g.narration-connectors, g.preterite-vs-imperfect]
    expect:
      - { pattern: "as[ií] que|sin embargo|afortunadamente|desgraciadamente|total,? que|resulta que", hint: "Link the story: así que, sin embargo, afortunadamente …" }
    model: { es: "El sábado pasado iba en bicicleta por el puente de Santa Fe. Llovía mucho y el suelo estaba mojado, así que me caí. Desgraciadamente, me rompí el brazo. Sin embargo, fue un accidente con suerte: afortunadamente, un médico pasaba por allí y me ayudó.", en: "Last Saturday I was cycling over the bridge in Santa Fe. It was raining hard and the ground was wet, so I fell off. Unfortunately, I broke my arm. However, it was a lucky accident: fortunately, a doctor was passing by and helped me." }
  - task: "Your wallet was stolen in a café. Write what happened for the police: where you were, what the thief looked like and what he did."
    min: 35
    max: 65
    use: [w.ladron, w.cartera, w.policia, w.escapar, w.robar]
    useAtLeast: 3
    grammar: [g.preterite-vs-imperfect]
    expect:
      - { pattern: "\\b(estaba|era|ten[ií]a|llevaba|hab[ií]a)\\b", hint: "Describe the scene and the thief with the imperfect: estaba …, era alto, llevaba …" }
      - { pattern: "(rob|cog|escap|corr|llam|grit|lleg|sal|desaparec)[a-z]*(é|ó|í)(?![a-záéíóúñ])", hint: "Say what happened with the preterite: la cogió, se escapó, llamé …" }
    model: { es: "Ayer a las cinco estaba en un café del centro. Mi cartera estaba sobre la mesa. De pronto, un ladrón alto, con una gorra negra, la cogió y se escapó corriendo. Grité, pero nadie lo vio. Después llamé a la policía.", en: "Yesterday at five I was in a café in the centre. My wallet was on the table. Suddenly a tall thief in a black cap took it and ran away. I shouted, but nobody saw him. Then I called the police." }
  - task: "Write a short story that includes a storm, a bridge and the phrases resulta que, enseguida and menos mal."
    min: 35
    max: 65
    use: [w.tormenta, w.mojado, w.menos-mal, w.enseguida, w.resulta-que]
    useAtLeast: 3
    grammar: [g.narration-connectors, g.preterite-vs-imperfect]
    expect:
      - { pattern: "menos mal|resulta que|total,? que|enseguida", hint: "Use story phrases: resulta que …, enseguida, menos mal …" }
      - { pattern: "tormenta", hint: "Include the storm: una tormenta …" }
    model: { es: "Resulta que el domingo fuimos al río con unos amigos. Hacía sol, pero de pronto empezó una tormenta enorme. Corrimos enseguida hacia un puente y esperamos allí una hora. Total, que llegamos a casa muy mojados. ¡Menos mal que no hacía frío!", en: "So on Sunday we went to the river with some friends. It was sunny, but suddenly a huge storm started. We ran straight to a bridge and waited there for an hour. In the end we got home soaking wet. Thank goodness it wasn't cold!" }
