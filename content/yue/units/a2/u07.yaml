        a: { es: "好吖，唔該晒。", en: "Yes please, thanks a lot." }
        alt: ["唔使喇，我自己拎得。", "好吖，多謝。"]
        grammar: [g.aa1-offer, g.bong-help]
        vocab: [w.bong1, w.ling1]
      - q: { es: "佢點解識講日文嘅？", en: "How come he speaks Japanese?" }
        a: { es: "佢喺日本住過三年吖嘛。", en: "He lived in Japan for three years, you see." }
