lessons:
  - id: ph.vowels
    title: Seven vowels, five letters
    explanation: |
      Italian vowels are short, pure and tense: no gliding as in English "no" (nəʊ) or "day" (deɪ), and no reduction to "uh" in unstressed syllables. All three a's in *banana* sound the same, and the final vowel is always pronounced clearly: *pasta* ends in a full /a/, *gnocchi* in a full /i/.

      Five letters, but **seven** vowel sounds: **e** and **o** each have a closed and an open version, but only in stressed syllables.

      | Letter | Closed | Open |
      |---|---|---|
      | e | /e/ *séra*, *pésca* (fishing) | /ɛ/ *bèllo*, *pèsca* (peach) |
      | o | /o/ *sólo*, *bótte* (barrel) | /ɔ/ *pòrta*, *bòtte* (blows) |

      Dictionaries mark them with an acute (é, ó) for closed and a grave (è, ò) for open, but ordinary spelling only writes the accent on a final stressed vowel: *perché* (closed), *caffè*, *è* (open).

      ### Tips
      - Keep your mouth still for the whole vowel.
      - **i** is always /i/ as in "machine"; **u** always /u/ as in "food", never /ju/: *università* starts /u/.
      - Open and closed e/o vary from region to region; Italians understand both. Get the stressed vowel pure first, and pick up the open/closed contrast by ear.
    items:
      - { es: pasta, ipa: "ˈpa.sta", tip: both a's identical }
      - { es: sera, ipa: "ˈse.ra", tip: closed e }
      - { es: bello, ipa: "ˈbɛl.lo", tip: open e }
      - { es: sole, ipa: "ˈso.le", tip: closed o }
      - { es: porta, ipa: "ˈpɔr.ta", tip: open o }
      - { es: luna, ipa: "ˈlu.na" }
      - { es: università, ipa: "u.ni.ver.si.ˈta", tip: "u as in food, stress on the final à" }
    minimalPairs: [[pésca, pèsca], [bótte, bòtte], [vénti, vènti], [è, e], [cara, cura]]
    practice: ["Anna ama la banana.", "Il sole è bello stasera.", "Apri la porta, per favore.", "Leo vuole una pesca.", "La luna è lì, su Roma."]
  - id: ph.c-g
    title: C and G, hard and soft
    explanation: |
      **c** and **g** change sound depending on the next letter:

      | Before | c | g |
      |---|---|---|
      | a, o, u, consonant | /k/ *casa*, *come*, *cuore*, *classe* | /g/ *gatto*, *gola*, *gusto*, *grande* |
      | e, i | /tʃ/ "ch" in "church": *cena*, *cibo* | /dʒ/ "j" in "jam": *gelato*, *giro* |

      To get the soft sound before a, o, u, Italian adds a silent **i**: *ciao* /tʃao/, *cioccolato*, *giorno*, *giallo*, *giusto*. That i is not pronounced as a separate vowel: *ciao* has two syllables, not three.

      ### Tips
      - *Gelato* starts like "jelly", never like "gate".
      - In *farmacia* and *bugia* the i is stressed, so it is heard: far-ma-CI-a.
    items:
      - { es: casa, ipa: "ˈka.sa" }
      - { es: cena, ipa: "ˈtʃe.na" }
      - { es: ciao, ipa: "ˈtʃa.o", tip: the i is silent }
      - { es: gatto, ipa: "ˈɡat.to" }
      - { es: gelato, ipa: "dʒeˈla.to" }
      - { es: giorno, ipa: "ˈdʒor.no", tip: the i is silent }
      - { es: cioccolato, ipa: "tʃok.koˈla.to" }
    minimalPairs: [[cara, cera], [gatto, getto], [colla, cella], [gara, giara]]
    practice: ["Ciao, Gina! Che cosa ceniamo?", "Il gatto mangia un gelato.", "Giovedì giochiamo in giardino.", "Cinque cioccolatini, per piacere."]
  - id: ph.ch-gh
    title: CH and GH, keeping it hard
    explanation: |
      Italian **h** is never pronounced. Its main job is to keep **c** and **g** hard before **e** and **i**: **ch** = /k/, **gh** = /g/. English speakers often read *ch* as in "church"; in Italian it is always /k/.

      | Spelling | Sound | Examples |
      |---|---|---|
      | che, chi | /ke/, /ki/ | *che*, *chiesa*, *chiave*, *pochi* |
      | ghe, ghi | /ge/, /gi/ | *spaghetti*, *laghi*, *ghiaccio* |

      This is why plurals change spelling: *amica → amiche*, *lago → laghi*, *banca → banche*: the sound stays hard.

      ### Tips
      - *Chianti* is /ˈkjan.ti/: "key-AN-tee", not "chee-AN-tee".
      - *ho, hai, ha, hanno* (forms of avere) are just /ɔ, ai, a, ˈan.no/: the h is silent and only tells them apart from *o* (or), *ai* (to the), *a* (to), *anno* (year).
    items:
      - { es: chiesa, ipa: "ˈkjɛ.za" }
      - { es: chiave, ipa: "ˈkja.ve" }
      - { es: Chianti, ipa: "ˈkjan.ti", tip: "k sound, not 'ch'" }
      - { es: spaghetti, ipa: "spaˈɡet.ti" }
      - { es: laghi, ipa: "ˈla.ɡi" }
      - { es: anche, ipa: "ˈaŋ.ke" }
      - { es: hanno, ipa: "ˈan.no", tip: silent h }
    minimalPairs: [[Cina, china], [giro, ghiro], [cela, chela], [hanno, anno]]
    practice: ["Che cosa c'è in chiesa?", "Chiara mangia gli spaghetti.", "Anche i laghi sono freddi.", "Ho le chiavi della macchina."]
  - id: ph.gl-gn
    title: GL and GN
    explanation: |
      Two sounds English does not have as single consonants:

      - **gn** is /ɲ/, like "ny" in "canyon" said as one sound: *gnocchi*, *bagno*, *signora*, *lasagna*.
      - **gli** is /ʎ/, like "lli" in "million" but with the tongue flat against the palate: *figlio*, *famiglia*, *aglio*, *voglio*. Before a, e, o, u it is spelled **gli** + vowel and the i is silent: *figlia* /ˈfiʎ.ʎa/.

      Between vowels both are always long (double): *bagno* /ˈbaɲ.ɲo/, *aglio* /ˈaʎ.ʎo/.

      **gl** before a, e, o, u (not i) is a plain /gl/: *gloria*, *inglese*, *globo*. A few words keep /gl/ even before i: *glicine*, *anglicano*, *negligente*.
    items:
      - { es: gnocchi, ipa: "ˈɲɔk.ki" }
      - { es: bagno, ipa: "ˈbaɲ.ɲo" }
      - { es: signora, ipa: "siɲˈɲo.ra" }
      - { es: famiglia, ipa: "faˈmiʎ.ʎa" }
      - { es: aglio, ipa: "ˈaʎ.ʎo" }
      - { es: gli, ipa: "ʎi" }
      - { es: inglese, ipa: "iŋˈɡle.se", tip: "plain g + l" }
    minimalPairs: [[agli, ali], [figli, fili], [sogno, sono], [legna, lena]]
    practice: ["La signora mangia gli gnocchi.", "Mio figlio fa il bagno.", "Voglio l'aglio e l'olio.", "La mia famiglia è in montagna.", "Gli agnelli sono nel campo."]
  - id: ph.sc
    title: SC, SCI and SCH
    explanation: |
      **sc** follows the same logic as c:

      | Spelling | Sound | Examples |
      |---|---|---|
      | sce, sci | /ʃ/ "sh": *pesce*, *uscita*, *sci* | |
      | scia, scio, sciu | /ʃ/, with a silent i: *lasciare*, *sciopero*, *asciutto* | |
      | sca, sco, scu | /sk/: *scarpa*, *scuola*, *tasca* | |
      | sche, schi | /sk/: *scherzo*, *schiena*, *tedeschi* | |

      Between vowels /ʃ/ is always long: *pesce* /ˈpeʃ.ʃe/. Note *scienza* and *coscienza*: the i is written but not pronounced.
    items:
      - { es: pesce, ipa: "ˈpeʃ.ʃe" }
      - { es: uscita, ipa: "uʃˈʃi.ta" }
      - { es: sciare, ipa: "ʃiˈa.re" }
      - { es: lasciare, ipa: "laʃˈʃa.re", tip: the i is silent }
      - { es: scuola, ipa: "ˈskwɔ.la" }
      - { es: schiena, ipa: "ˈskjɛ.na" }
      - { es: scherzo, ipa: "ˈsker.tso" }
    minimalPairs: [[pesce, pesche], [esce, esche], [lisce, lische]]
    practice: ["Il pesce è fresco.", "Esco da scuola alle tre.", "Lasciami sciare in pace!", "Non è uno scherzo: ho mal di schiena."]
  - id: ph.doppie
    title: Double consonants (le doppie)
    explanation: |
      Every Italian consonant can be single or **double**, and the difference changes meaning: *pala* (shovel) vs *palla* (ball), *caro* (dear) vs *carro* (cart), *sete* (thirst) vs *sette* (seven), *nono* (ninth) vs *nonno* (grandfather).

      A double consonant is held **longer**, and the vowel before it is a little **shorter**:

      - stops (p, t, c, b, d, g): close, *pause*, then release: *fatto* = fat-to.
      - continuous sounds (l, m, n, r, s, f, v): just hold them: *palla* = pal-la, *mamma* = mam-ma.

      English has the same effect across word boundaries: compare "black cat" with "bla cat", or "ten nights" with "ten ights". Italians hear the difference instantly, so exaggerate at first.

      ### Tips
      - Write and say *ecco*, *tutto*, *sette*, *otto*, *nonno*, *pizza*, *cappuccino*: the double letters you see are the double sounds you say.
      - *Anno* (year) vs *ano* (anus): an embarrassing pair, worth getting right.
    items:
      - { es: palla, ipa: "ˈpal.la" }
      - { es: sette, ipa: "ˈsɛt.te" }
      - { es: nonno, ipa: "ˈnɔn.no" }
      - { es: fatto, ipa: "ˈfat.to", tip: pause before the release }
      - { es: cappuccino, ipa: "kap.putˈtʃi.no" }
      - { es: mamma, ipa: "ˈmam.ma" }
      - { es: anno, ipa: "ˈan.no" }
    minimalPairs: [[pala, palla], [caro, carro], [sete, sette], [nono, nonno], [capello, cappello], [papa, pappa], [fato, fatto], [pena, penna], [casa, cassa], [rosa, rossa]]
    practice: ["Il nonno ha sette anni più della nonna.", "Ho sete: un caffè e un cappuccino, per favore.", "La palla è rossa, la rosa è rosa.", "Metti il cappello sui capelli!", "Ecco tutto quello che ho fatto."]
  - id: ph.r-z
    title: R, and the two Z sounds
    explanation: |
      **r** is always rolled with the tip of the tongue: a single tap /ɾ/ between vowels (*caro*, *sera*), a full trill /r/ when doubled (*carro*, *terra*) and usually at the start of a word (*Roma*). Never the English "r" with the tongue pulled back. Some Italians have an uvular r (the *erre moscia*); it is a personal trait, not the standard.

      **z** has two sounds, both "d" or "t" + "s" pressed together:

      - /ts/ voiceless, as in "cats": *pizza*, *grazie*, *stazione*, *zucchero*, *-zione* words.
      - /dz/ voiced, as in "beds": *zero*, *zona*, *zaino*, *mezzo*, *pranzo* in some regions, *romanzo*.

      Which one a word takes varies by word and by region; Italians do not misunderstand either. Between vowels z is always long: *pizza*, *azione* /atˈtsjo.ne/.
    items:
      - { es: caro, ipa: "ˈka.ɾo", tip: single tap }
      - { es: carro, ipa: "ˈkar.ro", tip: trill }
      - { es: Roma, ipa: "ˈro.ma" }
      - { es: pizza, ipa: "ˈpit.tsa" }
      - { es: grazie, ipa: "ˈɡrat.tsje" }
      - { es: zero, ipa: "ˈdzɛ.ro" }
      - { es: stazione, ipa: "statˈtsjo.ne" }
    minimalPairs: [[caro, carro], [coro, corro], [poro, porro], [moro, morro], [sera, serra]]
    practice: ["Grazie per la pizza!", "Rita corre verso la stazione.", "Zero zucchero nel caffè, grazie.", "Il treno per Roma parte alle tre."]
  - id: ph.stress
    title: Stress and written accents
    explanation: |
      Most Italian words are stressed on the **second-to-last** syllable (*parole piane*): *ca-SA*, *a-MI-co*, *ra-GAZ-za*. But many are not, and spelling usually does not tell you:

      - **last syllable** (*parole tronche*): always written with an accent: *città*, *caffè*, *perché*, *però*, *università*, *lunedì*.
      - **third from last** (*parole sdrucciole*): no accent written: *MU-si-ca*, *TA-vo-lo*, *TE-le-fo-no*, *SA-ba-to*. Learn them with the word.
      - Verb forms: *PAR-la-no*, *TE-le-fo-na-no* (stress stays where the singular had it).

      ### The written accent
      Grave (`) on à, ì, ò, ù and open è; acute (´) on closed é, as in *perché*, *poiché*, *né*, *sé*. Accents on one-syllable words distinguish pairs: *è* (is) / *e* (and), *là* (there) / *la* (the), *lì* / *li*, *dà* (gives) / *da* (from), *sì* (yes) / *si*, *tè* (tea) / *te*, *né* (nor) / *ne*. Never accent *qui*, *qua*, *su*, *fa*, *va*, *sta*, *so*, *re*, *tre*.

      ### Same spelling, different stress
      *ÀN-co-ra* (anchor) vs *an-CO-ra* (again); *PRÌN-ci-pi* (princes) vs *prin-CÌ-pi* (principles).
    items:
      - { es: città, tip: "stressed on the last syllable: accent written" }
      - { es: perché, tip: "closed e: acute accent" }
      - { es: musica, tip: "MU-si-ca: third from last, no accent written" }
      - { es: telefono, tip: "te-LE-fo-no" }
      - { es: parlano, tip: "PAR-la-no, not par-LA-no" }
      - { es: ancora, tip: "AN-co-ra (anchor) or an-CO-ra (again)" }
    minimalPairs: [[papa, papà], [e, è], [la, là], [da, dà], [si, sì], [te, tè], [li, lì]]
    practice: ["Il papà del Papa è là.", "Perché non prendi un tè?", "Sì, lunedì vado in città.", "La musica è bella e io la ascolto ancora."]
  - id: ph.intonation
    title: Intonation and linking
    explanation: |
      Italian has no word order change and no "do" for questions: a yes/no question is a statement with a **rising** tune.

      - *Parli italiano.* ↘ (You speak Italian.)
      - *Parli italiano?* ↗ (Do you speak Italian?)

      Questions with a question word (*dove, quando, perché, che cosa*) usually start high and **fall**: *Dove abiti?* ↘. Exclamations start high: *Che bello!*

      ### Linking
      Words run together in a smooth legato: a final vowel slides into the next word's vowel (*come stai* → co-me-stai, *una amica* → u-n'amica). Writing often shows this with elision: *l'amico*, *un'amica*, *dov'è*, *c'è*.

      Italian is roughly **syllable-timed**: unstressed syllables are not swallowed, so every vowel stays clear even in fast speech.
    items:
      - { es: Parli italiano., tip: "falling: a statement" }
      - { es: Parli italiano?, tip: "rising: a question" }
      - { es: Dove abiti?, tip: "falling from a high start" }
      - { es: Che bello!, tip: "high start" }
      - { es: dov'è, tip: "dove + è, one word" }
    minimalPairs: []
    practice: ["Sei italiano? No, sono inglese.", "Dove abiti? Abito a Roma.", "C'è un bar qui vicino?", "Che bella giornata!", "Vieni con noi stasera?"]
  - id: ph.regional
    title: Regional accents
    explanation: |
      Standard Italian is based on educated Florentine, but every Italian speaks it with a regional colour. You do not need to copy these, but recognising them helps you understand real people:

      - **Tuscany**: the *gorgia toscana*: c between vowels softens to a breathy h: *la casa* → "la hasa", *amico* → "amiho".
      - **North** (Milan, Turin, Venice): s between vowels is voiced /z/ (*casa* → "caza"), the open/closed e is often swapped, and double consonants can be weakened.
      - **Centre and South**: s between vowels stays /s/ (*casa* /ˈka.sa/). After certain short words the next consonant is doubled (*raddoppiamento sintattico*): *a casa* → "accasa", *da me* → "dammè", *tre gatti* → "treggatti". Standard Italian has this too in central varieties.
      - **Rome**: double rr is often shortened (*terra* → "tera"), and *il* becomes *er* in dialect: *er Colosseo*.
      - **Naples and the South**: unstressed final vowels fade to a neutral "uh" in dialectal speech; *b* and *g* between vowels may be doubled: *subito* → "subbito".
      - **Sicily**: *tr* and *str* sound almost like "chr": *treno*, *strada*; *dd* for *ll* in dialect (*bello* → *beddu*).
    items:
      - { es: la casa, tip: "Tuscany: la hasa; North: la caza; South and Centre: la casa" }
      - { es: a casa, tip: "Centre and South: accasa" }
      - { es: tre gatti, tip: "raddoppiamento sintattico: treggatti" }
      - { es: terra, tip: "Rome: often tera" }
      - { es: subito, tip: "South: subbito" }
    minimalPairs: []
    practice: ["Vado a casa con l'amico.", "Ci sono tre gatti sulla terra.", "La Coca-Cola con la cannuccia corta corta.", "Da me c'è sempre posto."]
