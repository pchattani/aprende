      - { q: "Selon Bastien, pourquoi utilise-t-on le passé simple dans les romans ?", options: ["Parce que c'est plus facile", "Parce que tout le monde parle comme ça", "Parce que ça met de la distance"], answer: 2, explain: "« C'est bien pour ça qu'on l'utilise : ça met de la distance. »" }
