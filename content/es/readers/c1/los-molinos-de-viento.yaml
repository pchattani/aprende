id: r.c1.los-molinos-de-viento
level: c1
title: Los molinos de viento
kind: literature
author: Miguel de Cervantes (1547–1616)
source: "El ingenioso hidalgo don Quijote de la Mancha, Primera parte, capítulo VIII (1605). Dominio público."
intro: "The most famous episode of Don Quijote, quoted with modernised spelling and abridged; the cuts are marked with (…). Watch how Cervantes keeps reference clear across a long narrative paragraph (su escudero, aquellos que allí ves, el caballo y el caballero) and how each speaker's register tells you who is talking."
allow: [quijote, sancho, panza, rocinante, dulcinea, frestón, briareo, non, fuyades, vuestra, merced, válame, cervantes, mancha]
paragraphs:
  - { es: "En esto, descubrieron treinta o cuarenta molinos de viento que hay en aquel campo; y así como don Quijote los vio, dijo a su escudero: —La ventura va guiando nuestras cosas mejor de lo que acertáramos a desear, porque ves allí, amigo Sancho Panza, donde se descubren treinta, o pocos más, desaforados gigantes, con quien pienso hacer batalla y quitarles a todos las vidas, con cuyos despojos comenzaremos a enriquecer; que esta es buena guerra, y es gran servicio de Dios quitar tan mala simiente de sobre la faz de la tierra.", en: "At that moment they caught sight of thirty or forty windmills that stand in that plain; and as soon as Don Quixote saw them, he said to his squire: 'Fortune is guiding our affairs better than we could have wished, for you see there, friend Sancho Panza, where thirty or a few more monstrous giants appear, with whom I intend to do battle and take all their lives, and with their spoils we shall begin to grow rich; for this is a righteous war, and it is a great service to God to remove such an evil seed from the face of the earth.'" }
  - { es: "—¿Qué gigantes? —dijo Sancho Panza. —Aquellos que allí ves —respondió su amo—, de los brazos largos, que los suelen tener algunos de casi dos leguas.", en: "'What giants?' said Sancho Panza. 'Those you see there,' answered his master, 'with the long arms, which some of them have almost two leagues long.'" }
  - { es: "—Mire vuestra merced —respondió Sancho— que aquellos que allí se parecen no son gigantes, sino molinos de viento, y lo que en ellos parecen brazos son las aspas, que, volteadas del viento, hacen andar la piedra del molino.", en: "'Look, your worship,' answered Sancho, 'those that appear there are not giants but windmills, and what seem to be arms on them are the sails, which, turned by the wind, make the millstone go.'" }
  - { es: "—Bien parece —respondió don Quijote— que no estás cursado en esto de las aventuras: ellos son gigantes; y si tienes miedo, quítate de ahí, y ponte en oración en el espacio que yo voy a entrar con ellos en fiera y desigual batalla.", en: "'It is plain,' answered Don Quixote, 'that you are not experienced in this matter of adventures: they are giants; and if you are afraid, get away from here and say your prayers while I enter into fierce and unequal battle with them.'" }
  - { es: "Y, diciendo esto, dio de espuelas a su caballo Rocinante (…). Pero él iba tan puesto en que eran gigantes, que ni oía las voces de su escudero Sancho ni echaba de ver, aunque estaba ya bien cerca, lo que eran; antes iba diciendo en voces altas: —Non fuyades, cobardes y viles criaturas, que un solo caballero es el que os acomete.", en: "And, saying this, he spurred his horse Rocinante (…). But he was so convinced they were giants that he neither heard his squire Sancho's shouts nor noticed, though he was now very close, what they were; instead he went on shouting: 'Flee not, cowardly and vile creatures, for it is a single knight who attacks you.'" }
  - { es: "(…) Bien cubierto de su rodela, con la lanza en el ristre, arremetió a todo el galope de Rocinante y embistió con el primero molino que estaba delante; y, dándole una lanzada en el aspa, la volvió el viento con tanta furia, que hizo la lanza pedazos, llevándose tras sí al caballo y al caballero, que fue rodando muy maltrecho por el campo.", en: "(…) Well covered by his shield, with his lance at the ready, he charged at Rocinante's full gallop and attacked the first mill in front of him; and as he gave it a thrust of the lance in the sail, the wind turned it with such fury that it smashed the lance to pieces, dragging after it horse and rider, who went rolling across the field badly battered." }
  - { es: "Acudió Sancho Panza a socorrerle a todo el correr de su asno, y cuando llegó halló que no se podía menear: tal fue el golpe que dio con él Rocinante. —¡Válame Dios! —dijo Sancho—. ¿No le dije yo a vuestra merced que mirase bien lo que hacía, que no eran sino molinos de viento, y no lo podía ignorar sino quien llevase otros tales en la cabeza?", en: "Sancho Panza hurried to help him as fast as his donkey could run, and when he arrived he found that he could not move: such was the fall Rocinante had given him. 'God help me!' said Sancho. 'Didn't I tell your worship to watch what you were doing, that they were only windmills, and that nobody could fail to see it unless he had others like them in his head?'" }
  - { es: "—Calla, amigo Sancho —respondió don Quijote—, que las cosas de la guerra, más que otras, están sujetas a continua mudanza; cuanto más, que yo pienso, y es así verdad, que aquel sabio Frestón que me robó el aposento y los libros ha vuelto estos gigantes en molinos por quitarme la gloria de su vencimiento: tal es la enemistad que me tiene; mas al cabo al cabo, han de poder poco sus malas artes contra la bondad de mi espada. —Dios lo haga como puede —respondió Sancho Panza.", en: "'Hush, friend Sancho,' answered Don Quixote, 'for the things of war, more than any others, are subject to continual change; all the more so because I think, and it is the truth, that the sage Frestón who stole my room and my books has turned these giants into mills to rob me of the glory of defeating them: such is the enmity he bears me; but in the end his evil arts will have little power against the goodness of my sword.' 'God grant it as He can,' answered Sancho Panza." }
questions:
  - { q: "What does Don Quixote believe the windmills are?", options: ["Castles", "Giants with long arms", "Enemy soldiers"], answer: 1 }
  - { q: "How does Sancho explain what the 'arms' really are?", options: ["They are the sails, turned by the wind, that move the millstone", "They are flags", "They are branches of trees"], answer: 0 }
  - { q: "What happens when Don Quixote attacks the first windmill?", options: ["He destroys it", "The wind turns the sail, breaks his lance and throws horse and rider to the ground", "Sancho stops him just in time"], answer: 1 }
  - { q: "How does Don Quixote explain his defeat afterwards?", options: ["He admits they were windmills", "He blames the wind", "He says the sage Frestón turned the giants into mills to rob him of glory"], answer: 2 }
  - { q: "Who is 'su amo' in the second paragraph?", options: ["Sancho Panza", "Don Quixote", "Frestón"], answer: 1 }
