id: b1.u03
title: Dudas y opiniones
lessons:
  - id: b1.u03.l1
    title: Dudo que…
    teach: [g.subjunctive-doubt]
    vocab: [w.dudar, w.duda, w.sin-duda, w.negar, w.certeza, w.puede-que, w.posiblemente, w.posible, w.imposible, w.probable, w.improbable, w.suponer, w.sospechar, w.comprobar, w.fiable, w.fiarse, w.desconfiar, w.rumor, w.bulo, w.dato, w.prueba, w.demostrar]
    tip: "Doubt, denial and possibility → subjunctive: dudo que, no es seguro que, es posible que, puede que. Certainty → indicative: estoy seguro de que, sé que."
    sentences:
      - { es: "Dudo que el gobierno cumpla todo lo que ha prometido.", en: "I doubt the government will do everything it has promised.", altEs: ["Dudo que el gobierno cumpla todo lo que prometió.", "No creo que el gobierno cumpla todo lo que ha prometido."], grammar: [g.subjunctive-doubt, g.present-perfect], vocab: [w.dudar, w.gobierno, w.cumplir] }
      - { es: "No hay duda de que la tecnología ha cambiado el trabajo.", en: "There's no doubt that technology has changed work.", altEs: ["Sin duda, la tecnología ha cambiado el trabajo.", "No hay duda de que la tecnología cambió el trabajo."], grammar: [g.subjunctive-doubt, g.present-perfect], vocab: [w.duda, w.tecnologia, w.cambiar], note: "no hay duda de que = certainty → indicative." }
      - { es: "El ministro niega que haya una crisis en la sanidad.", en: "The minister denies that there's a crisis in healthcare.", grammar: [g.subjunctive-doubt, g.subjunctive-irregular], vocab: [w.negar, w.crisis, w.sanidad] }
      - { es: "Nadie sabe con certeza si habrá elecciones en primavera.", en: "Nobody knows for certain whether there will be elections in spring.", grammar: [g.future-irregular, g.indefinite-pronouns], vocab: [w.certeza, w.saber, w.elecciones] }
      - { es: "Puede que llueva el sábado; es posible que nos quedemos en casa.", en: "It may rain on Saturday; we might stay at home.", altEs: ["Puede que llueva el sábado; quizás nos quedemos en casa."], grammar: [g.subjunctive-doubt], vocab: [w.puede-que, w.posible, w.llover, w.quedarse] }
      - { es: "Es imposible que Marta sepa la noticia; nadie se lo ha dicho.", en: "It's impossible that Marta knows the news; nobody has told her.", grammar: [g.subjunctive-doubt, g.subjunctive-irregular], vocab: [w.imposible, w.saber, w.noticia] }
      - { es: "Es probable que suban los impuestos el año que viene.", en: "Taxes will probably go up next year.", altEs: ["Es probable que los impuestos suban el año que viene.", "Probablemente suban los impuestos el año que viene."], grammar: [g.subjunctive-doubt], vocab: [w.probable, w.subir, w.impuesto] }
      - { es: "Es improbable que lleguen a un acuerdo antes del verano.", en: "It's unlikely they'll reach an agreement before the summer.", altEs: ["Es poco probable que lleguen a un acuerdo antes del verano."], grammar: [g.subjunctive-doubt], vocab: [w.improbable, w.llegar, w.acuerdo] }
      - { es: "Supongo que vendrás a la cena; posiblemente venga también Marta.", en: "I suppose you'll come to the dinner; Marta may well come too.", grammar: [g.subjunctive-doubt, g.future-simple], vocab: [w.suponer, w.posiblemente, w.venir, w.cena], note: "suponer que + indicative; posiblemente + subjunctive when unsure." }
      - { es: "Sospecho que ese rumor es un bulo; no me fío de esa red social.", en: "I suspect that rumour is a hoax; I don't trust that social network.", grammar: [g.subjunctive-doubt], vocab: [w.sospechar, w.rumor, w.bulo, w.fiarse], note: "sospechar que + indicative." }
      - { es: "Antes de enviar una noticia a tus amigos, comprueba si es fiable.", en: "Before sending a news story to your friends, check whether it's reliable.", grammar: [g.imperative-tu], vocab: [w.comprobar, w.fiable, w.enviar] }
      - { es: "Desconfío de los titulares que no dan ningún dato.", en: "I distrust headlines that don't give any facts.", grammar: [g.indefinite-pronouns], vocab: [w.desconfiar, w.titular, w.dato] }
      - { es: "No está demostrado que el café sea malo para la salud.", en: "It isn't proven that coffee is bad for your health.", grammar: [g.subjunctive-doubt, g.subjunctive-irregular], vocab: [w.demostrar, w.cafe, w.salud] }
      - { es: "Dicen que el agua con limón adelgaza, pero no hay ninguna prueba.", en: "They say water with lemon makes you lose weight, but there's no proof.", grammar: [g.indefinite-pronouns], vocab: [w.prueba, w.adelgazar, w.limon] }
      - { es: "Dudo que venga a la fiesta.", en: "I doubt he'll come to the party.", altEs: ["Dudo que él venga a la fiesta.", "No creo que venga a la fiesta."], grammar: [g.subjunctive-doubt], vocab: [w.dudar, w.venir, w.fiesta], error: { wrong: "Dudo que viene a la fiesta.", explain: "dudar que expresses doubt, so the verb goes in the subjunctive: venga.", grammar: g.subjunctive-doubt } }
      - { es: "Estoy seguro de que el examen es fácil.", en: "I'm sure the exam is easy.", altEs: ["Estoy segura de que el examen es fácil.", "Seguro que el examen es fácil."], grammar: [g.subjunctive-doubt], vocab: [w.seguro.phr, w.examen, w.facil], transform: { instruction: "Make it negative (no estoy seguro de que…)", answer: "No estoy seguro de que el examen sea fácil.", alt: [] } }
    exchanges:
      - q: { es: "¿Crees que lloverá el fin de semana?", en: "Do you think it'll rain at the weekend?" }
        a: { es: "Puede que llueva el sábado, pero no es seguro.", en: "It may rain on Saturday, but it isn't certain." }
        alt: ["Es probable que llueva.", "Dudo que llueva; hace mucho calor."]
        grammar: [g.subjunctive-doubt]
        vocab: [w.puede-que, w.probable, w.dudar]
      - q: { es: "Dicen que van a cerrar la fábrica.", en: "They say they're going to close the factory." }
        a: { es: "Sospecho que es un bulo; no me fío de esa fuente.", en: "I suspect it's a hoax; I don't trust that source." }
        alt: ["Dudo que sea verdad.", "Es posible, pero no hay ninguna prueba."]
        grammar: [g.subjunctive-doubt]
        vocab: [w.sospechar, w.bulo, w.fiarse, w.prueba]
      - q: { es: "¿Va a venir Marta a la cena?", en: "Is Marta coming to the dinner?" }
        a: { es: "Es improbable que venga; trabaja hasta las diez.", en: "It's unlikely she'll come; she works until ten." }
        alt: ["Supongo que sí.", "Puede que venga tarde."]
        grammar: [g.subjunctive-doubt]
        vocab: [w.improbable, w.suponer]
      - q: { es: "¿Es fiable esta noticia?", en: "Is this news story reliable?" }
        a: { es: "No lo sé; comprueba los datos antes de enviarla.", en: "I don't know; check the facts before sending it." }
        alt: ["Sin duda; es de un periódico serio.", "Lo dudo; no da ningún dato."]
        grammar: [g.subjunctive-doubt, g.imperative-tu]
        vocab: [w.fiable, w.comprobar, w.dato]
      - q: { es: "¿Habrá elecciones en primavera?", en: "Will there be elections in spring?" }
        a: { es: "Nadie lo sabe con certeza, pero es probable que las haya.", en: "Nobody knows for certain, but there probably will be." }
        alt: ["Posiblemente.", "Dudo que haya elecciones antes del verano."]
        grammar: [g.subjunctive-doubt]
        vocab: [w.certeza, w.probable, w.posiblemente]
    texts:
      - title: "Mensaje a los amigos"
        es: ["Chicos, me ha llegado una noticia sobre el concierto.", "Dudo que sea verdad: no hay ninguna prueba y la fuente no es fiable.", "Puede que sea un bulo, así que no la enviéis a nadie."]
        en: ["Guys, I've received a news story about the concert.", "I doubt it's true: there's no proof and the source isn't reliable.", "It may be a hoax, so don't send it to anyone."]
        grammar: [g.subjunctive-doubt]
        vocab: [w.dudar, w.prueba, w.fiable, w.bulo]
      - title: "Nota del periódico"
        es: ["El ministro niega que haya una crisis en la sanidad.", "Sin embargo, los datos demuestran que hay menos médicos que hace cinco años.", "Es probable que el tema llegue al debate de la semana que viene."]
        en: ["The minister denies that there's a crisis in healthcare.", "However, the data shows there are fewer doctors than five years ago.", "The issue will probably reach next week's debate."]
        grammar: [g.subjunctive-doubt]
        vocab: [w.negar, w.dato, w.demostrar, w.probable]
  - id: b1.u03.l2
    title: Creo que… / No creo que…
    teach: [g.creer-no-creer]
    vocab: [w.punto-de-vista, w.a-favor, w.en-contra, w.discutir, w.discusion, w.debate, w.debatir, w.argumento, w.defender, w.criticar, w.critica, w.convencer, w.convencido, w.justificar, w.tema, w.asunto, w.cuestion, w.polemica, w.polemico, w.exagerar, w.tener-sentido, w.equivocado]
    tip: "Creo / pienso / me parece que + indicative. No creo / no pienso / no me parece que + subjunctive. Questions (¿crees que…?) keep the indicative."
    sentences:
      - { es: "Creo que el debate es necesario, pero no creo que sea el momento.", en: "I think the debate is necessary, but I don't think it's the right moment.", altEs: ["Creo que el debate es necesario, pero no pienso que sea el momento.", "Creo que el debate es necesario, pero no me parece que sea el momento."], grammar: [g.creer-no-creer], vocab: [w.debate, w.creer, w.momento] }
      - { es: "Desde mi punto de vista, el tema de la vivienda es el más urgente.", en: "From my point of view, the housing issue is the most urgent one.", grammar: [g.superlatives], vocab: [w.punto-de-vista, w.tema, w.vivienda] }
      - { es: "Estoy a favor de la ley, pero no pienso que vaya a cambiar mucho.", en: "I'm in favour of the law, but I don't think it's going to change much.", altEs: ["Estoy a favor de la ley, pero no creo que vaya a cambiar mucho."], grammar: [g.creer-no-creer, g.ir-a-future], vocab: [w.a-favor, w.ley, w.pensar] }
      - { es: "Muchos vecinos están en contra de la nueva carretera; creen que traerá más ruido.", en: "Many neighbours are against the new road; they think it will bring more noise.", grammar: [g.creer-no-creer, g.future-irregular], vocab: [w.en-contra, w.carretera, w.ruido] }
      - { es: "Siempre discutimos de política en las cenas con mis padres; es un asunto muy polémico.", en: "We always argue about politics at dinners with my parents; it's a very controversial subject.", grammar: [g.present-review], vocab: [w.discutir, w.asunto, w.polemico, w.politico] }
      - { es: "La discusión terminó cuando mi padre dijo que no tenía sentido seguir hablando.", en: "The argument ended when my father said there was no point in carrying on talking.", grammar: [g.preterite-vs-imperfect], vocab: [w.discusion, w.tener-sentido, w.decir] }
      - { es: "Vamos a debatir la cuestión con tranquilidad: ¿crees que la medida es justa?", en: "Let's debate the question calmly: do you think the measure is fair?", grammar: [g.creer-no-creer], vocab: [w.debatir, w.cuestion, w.medida, w.justo], note: "¿crees que…? keeps the indicative." }
      - { es: "Tu argumento es bueno, pero no me parece que justifique una huelga.", en: "Your argument is good, but I don't think it justifies a strike.", grammar: [g.creer-no-creer], vocab: [w.argumento, w.justificar, w.huelga, w.parecer] }
      - { es: "El ministro defiende la medida: piensa que es la mejor posible.", en: "The minister defends the measure: he thinks it is the best one possible.", grammar: [g.creer-no-creer], vocab: [w.defender, w.medida, w.pensar, w.posible] }
      - { es: "Es fácil criticar una película, pero esa crítica no me parece justa: creo que es la mejor del año.", en: "It's easy to criticise a film, but that review doesn't seem fair to me: I think it's the best of the year.", grammar: [g.creer-no-creer, g.superlatives], vocab: [w.criticar, w.critica, w.pelicula, w.justo] }
      - { es: "No me has convencido; sigo pensando que el precio es demasiado alto.", en: "You haven't convinced me; I still think the price is too high.", altEs: ["No me has convencido; sigo creyendo que el precio es demasiado alto."], grammar: [g.creer-no-creer, g.present-perfect], vocab: [w.convencer, w.precio, w.seguir-gerundio] }
      - { es: "Estoy convencido de que la polémica terminará pronto.", en: "I'm convinced the controversy will end soon.", altEs: ["Estoy convencida de que la polémica terminará pronto.", "Estoy convencido de que la polémica acabará pronto."], grammar: [g.creer-no-creer, g.future-simple], vocab: [w.convencido, w.polemica, w.terminar], note: "estar convencido de que = certainty → indicative." }
      - { es: "Creo que exageras: no pienso que la situación sea tan grave.", en: "I think you're exaggerating: I don't think the situation is that serious.", altEs: ["Creo que exageras: no creo que la situación sea tan grave."], grammar: [g.creer-no-creer], vocab: [w.exagerar, w.situacion, w.grave] }
      - { es: "Me parece que estás equivocado, pero entiendo tu punto de vista.", en: "I think you're wrong, but I understand your point of view.", grammar: [g.creer-no-creer], vocab: [w.equivocado, w.punto-de-vista, w.entender] }
      - { es: "No creo que la película sea tan buena.", en: "I don't think the film is that good.", altEs: ["No pienso que la película sea tan buena.", "No me parece que la película sea tan buena."], grammar: [g.creer-no-creer], vocab: [w.creer, w.pelicula], error: { wrong: "No creo que la película es tan buena.", explain: "Negated opinion → subjunctive: no creo que sea.", grammar: g.creer-no-creer } }
      - { es: "Creo que tienen razón.", en: "I think they're right.", altEs: ["Pienso que tienen razón.", "Me parece que tienen razón."], grammar: [g.creer-no-creer], vocab: [w.creer, w.tener-razon], transform: { instruction: "Make it negative", answer: "No creo que tengan razón.", alt: [] } }
    exchanges:
      - q: { es: "¿Crees que la nueva ley va a funcionar?", en: "Do you think the new law is going to work?" }
        a: { es: "No creo que cambie mucho, pero estoy a favor.", en: "I don't think it'll change much, but I'm in favour." }
        alt: ["Creo que sí; es una buena medida.", "No pienso que funcione."]
        grammar: [g.creer-no-creer]
        vocab: [w.a-favor]
      - q: { es: "¿Te ha convencido su argumento?", en: "Has his argument convinced you?" }
        a: { es: "No; no me parece que justifique una huelga.", en: "No; I don't think it justifies a strike." }
        alt: ["Sí, creo que tiene razón.", "Un poco, pero sigo pensando que exagera."]
        grammar: [g.creer-no-creer]
        vocab: [w.convencer, w.argumento, w.justificar]
      - q: { es: "¿Qué piensas de la película?", en: "What do you think of the film?" }
        a: { es: "Creo que es la mejor del año, aunque la crítica dice otra cosa.", en: "I think it's the best of the year, even though the critics say otherwise." }
        alt: ["No creo que sea tan buena.", "Me parece que es demasiado larga."]
        grammar: [g.creer-no-creer]
        vocab: [w.critica]
      - q: { es: "¿Estás en contra de la nueva carretera?", en: "Are you against the new road?" }
        a: { es: "Sí, creo que traerá más ruido y no pienso que sea necesaria.", en: "Yes, I think it'll bring more noise and I don't think it's necessary." }
        alt: ["No, estoy a favor; creo que hace falta.", "No tengo una opinión clara sobre ese tema."]
        grammar: [g.creer-no-creer]
        vocab: [w.en-contra, w.tema]
      - q: { es: "Creo que exageras con el precio.", en: "I think you're exaggerating about the price." }
        a: { es: "No me parece que exagere: ochenta euros por una cena es mucho.", en: "I don't think I'm exaggerating: eighty euros for a dinner is a lot." }
        alt: ["Puede que tengas razón.", "Quizás, pero sigo pensando que es caro."]
        grammar: [g.creer-no-creer]
        vocab: [w.exagerar]
    texts:
      - title: "Comentario en un artículo"
        es: ["Creo que el debate sobre la vivienda es necesario.", "Pero no creo que este sea el momento, con las elecciones tan cerca.", "Desde mi punto de vista, primero hay que escuchar a los vecinos."]
        en: ["I think the debate on housing is necessary.", "But I don't think this is the moment, with the elections so close.", "From my point of view, first we have to listen to the residents."]
        grammar: [g.creer-no-creer]
        vocab: [w.debate, w.punto-de-vista]
      - title: "Mensaje después de una discusión"
        es: ["Oye, siento la discusión de ayer.", "Creo que los dos exageramos un poco.", "No pienso que estés equivocado del todo, y entiendo tu punto de vista.", "¿Hablamos con tranquilidad este fin de semana?"]
        en: ["Hey, I'm sorry about yesterday's argument.", "I think we both exaggerated a bit.", "I don't think you're completely wrong, and I understand your point of view.", "Shall we talk calmly this weekend?"]
        grammar: [g.creer-no-creer]
        vocab: [w.discusion, w.exagerar, w.equivocado, w.punto-de-vista]
  - id: b1.u03.l3
    title: Quizás, tal vez, a lo mejor
    teach: [g.quizas-tal-vez]
    vocab: [w.quiza, w.igual.adv, w.lo-mismo, w.encuesta, w.estadistica, w.mayoria, w.minoria, w.porcentaje, w.segun, w.al-parecer, w.por-lo-visto, w.en-realidad, w.de-hecho, w.tendencia, w.generacion, w.adiccion, w.obligar, w.obligatorio, w.voluntario, w.derecho, w.responsabilidad, w.responsable, w.usar]
    tip: "quizás / tal vez / probablemente + subjunctive (or indicative if you feel fairly sure). a lo mejor, igual, lo mismo → always indicative."
    sentences:
      - { es: "Quizás los jóvenes de esta generación lean menos, pero escriben más que nunca.", en: "Maybe young people of this generation read less, but they write more than ever.", grammar: [g.quizas-tal-vez, g.comparatives], vocab: [w.quizas, w.generacion, w.leer] }
      - { es: "Quizá la encuesta no sea fiable: solo han preguntado a cien personas.", en: "Perhaps the survey isn't reliable: they've only asked a hundred people.", altEs: ["Quizás la encuesta no sea fiable: solo han preguntado a cien personas.", "Tal vez la encuesta no sea fiable: solo han preguntado a cien personas."], grammar: [g.quizas-tal-vez, g.present-perfect], vocab: [w.quiza, w.encuesta, w.fiable] }
      - { es: "Tal vez tengas razón, pero las estadísticas dicen otra cosa.", en: "You may be right, but the statistics say otherwise.", altEs: ["Quizás tengas razón, pero las estadísticas dicen otra cosa.", "Puede que tengas razón, pero las estadísticas dicen otra cosa."], grammar: [g.quizas-tal-vez], vocab: [w.tal-vez, w.estadistica, w.tener-razon] }
      - { es: "Según la encuesta, la mayoría está a favor de la medida y solo una minoría, el quince por ciento, en contra.", en: "According to the survey, the majority are in favour of the measure and only a minority, fifteen percent, are against.", grammar: [g.opinions], vocab: [w.segun, w.mayoria, w.minoria, w.por-ciento] }
      - { es: "A lo mejor el porcentaje cambia después de las elecciones.", en: "Maybe the percentage will change after the elections.", altEs: ["Igual el porcentaje cambia después de las elecciones.", "Quizás el porcentaje cambie después de las elecciones."], grammar: [g.quizas-tal-vez], vocab: [w.a-lo-mejor, w.porcentaje, w.elecciones], note: "a lo mejor + indicative, always." }
      - { es: "Igual no viene nadie a la reunión; es viernes por la tarde.", en: "Maybe nobody will come to the meeting; it's Friday afternoon.", altEs: ["A lo mejor no viene nadie a la reunión; es viernes por la tarde.", "Quizás no venga nadie a la reunión; es viernes por la tarde."], grammar: [g.quizas-tal-vez], vocab: [w.igual.adv, w.venir, w.reunion], note: "igual = maybe (colloquial, Spain) + indicative." }
      - { es: "Al parecer, la tendencia es trabajar desde casa dos días a la semana.", en: "Apparently, the trend is to work from home two days a week.", grammar: [g.quizas-tal-vez], vocab: [w.al-parecer, w.tendencia, w.trabajar] }
      - { es: "Por lo visto, la adicción a las pantallas es un problema cada vez mayor.", en: "Apparently, screen addiction is an ever-growing problem.", grammar: [g.quizas-tal-vez], vocab: [w.por-lo-visto, w.adiccion, w.pantalla] }
      - { es: "En realidad, probablemente sea la ley más polémica de los últimos años; de hecho, nadie sabe si va a cambiar algo.", en: "Actually, it's probably the most controversial law of recent years; in fact, nobody knows whether it's going to change anything.", grammar: [g.quizas-tal-vez, g.superlatives], vocab: [w.en-realidad, w.de-hecho, w.probablemente, w.polemico] }
      - { es: "Tal vez el gobierno obligue a las empresas a reducir la jornada.", en: "Perhaps the government will force companies to reduce working hours.", altEs: ["Quizás el gobierno obligue a las empresas a reducir la jornada.", "Puede que el gobierno obligue a las empresas a reducir la jornada."], grammar: [g.quizas-tal-vez], vocab: [w.obligar, w.reducir, w.jornada] }
      - { es: "Quizás debería ser obligatorio votar, como en otros países; o quizás no.", en: "Maybe voting should be compulsory, as in other countries; or maybe not.", grammar: [g.quizas-tal-vez, g.conditional-simple], vocab: [w.obligatorio, w.votar, w.deber] }
      - { es: "Probablemente el trabajo voluntario sea lo mejor para conocer gente nueva.", en: "Voluntary work is probably the best way to meet new people.", grammar: [g.quizas-tal-vez], vocab: [w.voluntario, w.probablemente, w.conocer] }
      - { es: "Todos tenemos derecho a opinar, pero también tenemos la responsabilidad de escuchar.", en: "We all have the right to have an opinion, but we also have the responsibility to listen.", grammar: [g.tener-expressions], vocab: [w.derecho, w.responsabilidad, w.opinar] }
      - { es: "Seguramente los medios son responsables de parte del problema.", en: "The media are surely responsible for part of the problem.", grammar: [g.quizas-tal-vez], vocab: [w.responsable, w.seguramente, w.parte], note: "seguramente + indicative." }
      - { es: "A lo mejor viene mañana.", en: "Maybe he'll come tomorrow.", altEs: ["Igual viene mañana.", "Quizás venga mañana."], grammar: [g.quizas-tal-vez], vocab: [w.a-lo-mejor, w.venir], error: { wrong: "A lo mejor venga mañana.", explain: "a lo mejor always takes the indicative: a lo mejor viene.", grammar: g.quizas-tal-vez } }
      - { es: "Quizás llueve esta tarde.", en: "Maybe it'll rain this afternoon.", altEs: ["Quizás llueva esta tarde.", "A lo mejor llueve esta tarde."], grammar: [g.quizas-tal-vez], vocab: [w.quizas, w.llover], transform: { instruction: "Express stronger doubt with the subjunctive", answer: "Quizás llueva esta tarde.", alt: ["Quizá llueva esta tarde."] } }
    exchanges:
      - q: { es: "¿Viene alguien a la reunión del viernes?", en: "Is anyone coming to Friday's meeting?" }
        a: { es: "Igual no viene nadie; es viernes por la tarde.", en: "Maybe nobody will come; it's Friday afternoon." }
        alt: ["Quizás vengan dos o tres personas.", "A lo mejor viene Marta."]
        grammar: [g.quizas-tal-vez]
        vocab: [w.igual.adv]
      - q: { es: "¿Qué dice la encuesta?", en: "What does the survey say?" }
        a: { es: "Según la encuesta, la mayoría está a favor, pero quizá no sea fiable.", en: "According to the survey, the majority are in favour, but perhaps it isn't reliable." }
        alt: ["Por lo visto, el sesenta por ciento está en contra.", "Al parecer, los jóvenes no han contestado."]
        grammar: [g.quizas-tal-vez]
        vocab: [w.encuesta, w.segun, w.mayoria, w.quiza]
      - q: { es: "¿Debería ser obligatorio votar?", en: "Should voting be compulsory?" }
        a: { es: "Tal vez sí, como en otros países; o tal vez no.", en: "Perhaps it should, as in other countries; or perhaps not." }
        alt: ["Quizás sea mejor que siga siendo voluntario.", "En mi opinión, sí."]
        grammar: [g.quizas-tal-vez]
        vocab: [w.obligatorio, w.voluntario]
      - q: { es: "¿Por qué los jóvenes leen menos?", en: "Why do young people read less?" }
        a: { es: "A lo mejor leen menos libros, pero en realidad escriben más que nunca.", en: "Maybe they read fewer books, but actually they write more than ever." }
        alt: ["Quizás por la adicción a las pantallas.", "De hecho, no creo que lean menos."]
        grammar: [g.quizas-tal-vez]
        vocab: [w.en-realidad, w.adiccion, w.de-hecho]
      - q: { es: "¿Vas a hacer trabajo voluntario este año?", en: "Are you going to do voluntary work this year?" }
        a: { es: "Probablemente sí; igual es lo mejor para conocer gente.", en: "Probably; it may be the best way to meet people." }
        alt: ["Quizás; depende del horario.", "Tal vez el año que viene."]
        grammar: [g.quizas-tal-vez]
        vocab: [w.voluntario, w.igual.adv]
    texts:
      - title: "Titular y entrada"
        es: ["Quizás la adicción a las pantallas sea el problema de esta generación.", "Según una encuesta, el setenta por ciento de los jóvenes usa el móvil más de cuatro horas al día.", "Por lo visto, la tendencia sigue creciendo."]
        en: ["Perhaps screen addiction is this generation's problem.", "According to a survey, seventy percent of young people use their phone more than four hours a day.", "Apparently, the trend keeps growing."]
        grammar: [g.quizas-tal-vez]
        vocab: [w.adiccion, w.generacion, w.encuesta, w.porcentaje, w.tendencia]
      - title: "Mensaje de trabajo"
        es: ["Igual no puedo ir a la reunión de mañana.", "Tal vez llegue a las once, pero no es seguro.", "Si no llego, empezad sin mí."]
        en: ["I may not be able to go to tomorrow's meeting.", "Perhaps I'll arrive at eleven, but it isn't certain.", "If I'm not there, start without me."]
        grammar: [g.quizas-tal-vez, g.imperative-vosotros]
        vocab: [w.igual.adv]
  - id: b1.u03.l4
    title: Expresar certeza y desacuerdo
    teach: [g.subjunctive-doubt]
    vocab: [w.por-un-lado, w.por-otro-lado, w.es-decir, w.o-sea, w.en-resumen, w.en-conclusion, w.en-cambio, w.mientras-que, w.en-cuanto-a, w.respecto-a, w.aunque, w.cadena, w.emisora, w.reportaje, w.articulo, w.columna, w.lector, w.influir, w.influencia, w.informarse, w.desinformacion, w.fuente, w.estar-seguro-de-que]
    tip: "Certainty keeps the indicative: estoy seguro de que viene, es verdad que, está claro que. Negate it and the subjunctive comes back: no estoy seguro de que venga."
    sentences:
      - { es: "Estoy seguro de que la cadena pública da mejor información que las privadas.", en: "I'm sure the public channel gives better information than the private ones.", altEs: ["Estoy segura de que la cadena pública da mejor información que las privadas.", "Estoy seguro de que la cadena pública informa mejor que las privadas."], grammar: [g.subjunctive-doubt, g.comparatives], vocab: [w.estar-seguro-de-que, w.cadena, w.informacion], note: "Certainty → indicative." }
      - { es: "No estoy segura de que esa emisora sea una fuente fiable.", en: "I'm not sure that radio station is a reliable source.", altEs: ["No estoy seguro de que esa emisora sea una fuente fiable.", "No es seguro que esa emisora sea una fuente fiable."], grammar: [g.subjunctive-doubt], vocab: [w.estar-seguro-de-que, w.emisora, w.fuente] }
      - { es: "Es verdad que el reportaje es largo, pero no es seguro que todos los datos sean ciertos.", en: "It's true the report is long, but it isn't certain that all the data is correct.", grammar: [g.subjunctive-doubt], vocab: [w.reportaje, w.dato, w.cierto] }
      - { es: "Por un lado, el artículo está bien escrito; por otro lado, no dice de dónde salen los datos.", en: "On the one hand, the article is well written; on the other, it doesn't say where the data comes from.", grammar: [g.connectors-contrast], vocab: [w.por-un-lado, w.por-otro-lado, w.articulo, w.dato] }
      - { es: "La columna de opinión influye mucho en los lectores mayores, mientras que los jóvenes casi no la leen.", en: "The opinion column has a lot of influence on older readers, whereas young people hardly read it.", grammar: [g.connectors-contrast], vocab: [w.columna, w.influir, w.lector, w.mientras-que] }
      - { es: "Está claro que las redes sociales tienen mucha influencia en los jóvenes.", en: "It's clear that social networks have a lot of influence on young people.", altEs: ["Es evidente que las redes sociales tienen mucha influencia en los jóvenes.", "Está claro que las redes sociales influyen mucho en los jóvenes."], grammar: [g.subjunctive-doubt], vocab: [w.influencia, w.red-social, w.joven], note: "está claro que → indicative." }
      - { es: "Es decir, no dudo que la información existe; dudo que la gente se informe bien.", en: "In other words, I don't doubt that the information exists; I doubt that people inform themselves properly.", grammar: [g.subjunctive-doubt], vocab: [w.es-decir, w.dudar, w.informarse], note: "no dudo que usually takes the indicative (it expresses certainty)." }
      - { es: "O sea, que no estás de acuerdo conmigo, ¿verdad?", en: "So you don't agree with me, right?", altEs: ["Es decir, que no estás de acuerdo conmigo, ¿verdad?", "O sea, que no estás de acuerdo conmigo, ¿no?"], grammar: [g.opinions], vocab: [w.o-sea, w.estar-de-acuerdo] }
      - { es: "En resumen: la desinformación es un problema, aunque no sea nuevo.", en: "In short: disinformation is a problem, even if it isn't a new one.", grammar: [g.connectors-contrast], vocab: [w.en-resumen, w.desinformacion, w.aunque] }
      - { es: "En conclusión, estoy convencido de que hace falta más educación sobre los medios.", en: "In conclusion, I'm convinced that more education about the media is needed.", grammar: [g.subjunctive-doubt], vocab: [w.en-conclusion, w.convencido, w.hacer-falta, w.educacion] }
      - { es: "Mi padre compra el periódico cada mañana; yo, en cambio, me informo por el móvil.", en: "My father buys the newspaper every morning; I, on the other hand, get my news on my phone.", grammar: [g.connectors-contrast], vocab: [w.en-cambio, w.periodico, w.informarse] }
      - { es: "En cuanto a los precios, no es seguro que bajen pronto.", en: "As for prices, it isn't certain they'll fall soon.", altEs: ["Respecto a los precios, no es seguro que bajen pronto."], grammar: [g.subjunctive-doubt], vocab: [w.en-cuanto-a, w.precio, w.bajar] }
      - { es: "Respecto a la entrevista, está claro que el periodista preparó bien las preguntas.", en: "As for the interview, it's clear the journalist prepared the questions well.", grammar: [g.subjunctive-doubt, g.preterite-regular], vocab: [w.respecto-a, w.entrevista, w.periodista, w.preparar] }
      - { es: "Aunque no estés de acuerdo, escucha el argumento hasta el final.", en: "Even if you don't agree, listen to the argument to the end.", altEs: ["Aunque no estés de acuerdo, escucha hasta el final."], grammar: [g.connectors-contrast, g.imperative-tu], vocab: [w.aunque, w.estar-de-acuerdo, w.argumento], note: "aunque + subjunctive = even if." }
      - { es: "Estoy seguro de que tiene razón.", en: "I'm sure he's right.", altEs: ["Estoy segura de que tiene razón.", "Seguro que tiene razón."], grammar: [g.subjunctive-doubt], vocab: [w.estar-seguro-de-que, w.tener-razon], error: { wrong: "Estoy seguro de que tenga razón.", explain: "estar seguro de que expresses certainty, so the verb stays in the indicative: tiene.", grammar: g.subjunctive-doubt } }
      - { es: "Es seguro que el periódico publica la noticia mañana.", en: "It's certain the newspaper will publish the news tomorrow.", grammar: [g.subjunctive-doubt], vocab: [w.seguro, w.periodico, w.publicar], transform: { instruction: "Make it negative", answer: "No es seguro que el periódico publique la noticia mañana.", alt: [] } }
    exchanges:
      - q: { es: "¿Estás seguro de que esa emisora es fiable?", en: "Are you sure that radio station is reliable?" }
        a: { es: "No estoy segura de que lo sea; nunca dice de dónde salen los datos.", en: "I'm not sure it is; it never says where the data comes from." }
        alt: ["Sí, estoy seguro de que es una buena fuente.", "No es seguro que sea fiable."]
        grammar: [g.subjunctive-doubt]
        vocab: [w.emisora, w.estar-seguro-de-que, w.fuente]
      - q: { es: "¿Cómo te informas?", en: "How do you get your news?" }
        a: { es: "Mi padre compra el periódico; yo, en cambio, me informo por el móvil.", en: "My father buys the newspaper; I, on the other hand, get my news on my phone." }
        alt: ["Por la radio, sobre todo.", "Leo dos o tres periódicos en internet."]
        grammar: [g.connectors-contrast]
        vocab: [w.informarse, w.en-cambio]
      - q: { es: "¿Crees que bajarán los precios?", en: "Do you think prices will fall?" }
        a: { es: "En cuanto a los precios, no es seguro que bajen pronto.", en: "As for prices, it isn't certain they'll fall soon." }
        alt: ["Está claro que no van a bajar.", "No estoy seguro de que bajen este año."]
        grammar: [g.subjunctive-doubt]
        vocab: [w.en-cuanto-a, w.estar-seguro-de-que]
      - q: { es: "O sea, que no estás de acuerdo conmigo.", en: "So you don't agree with me." }
        a: { es: "Es decir, estoy de acuerdo en parte, aunque no en todo.", en: "That is, I agree in part, though not with everything." }
        alt: ["No, no estoy de acuerdo.", "Por un lado sí; por otro lado, no."]
        grammar: [g.subjunctive-doubt]
        vocab: [w.o-sea, w.es-decir, w.aunque]
      - q: { es: "¿Qué te ha parecido el reportaje?", en: "What did you think of the report?" }
        a: { es: "Es verdad que es largo, pero no es seguro que todos los datos sean ciertos.", en: "It's true it's long, but it isn't certain that all the data is correct." }
        alt: ["Está claro que el periodista lo preparó bien.", "En resumen: interesante, aunque no sea nuevo."]
        grammar: [g.subjunctive-doubt]
        vocab: [w.reportaje, w.en-resumen]
    texts:
      - title: "Columna de opinión"
        es: ["Por un lado, las redes sociales nos dan información rápida.", "Por otro lado, no es seguro que esa información sea cierta.", "En conclusión, estoy convencido de que hace falta más educación sobre los medios."]
        en: ["On the one hand, social networks give us fast information.", "On the other hand, it isn't certain that that information is true.", "In conclusion, I'm convinced that more education about the media is needed."]
        grammar: [g.subjunctive-doubt]
        vocab: [w.por-un-lado, w.por-otro-lado, w.en-conclusion, w.columna]
      - title: "Mensaje a un compañero"
        es: ["He leído el artículo que me enviaste.", "Está claro que está bien escrito, aunque no estoy seguro de que la fuente sea fiable.", "O sea, que lo comprobaría antes de publicar nada."]
        en: ["I've read the article you sent me.", "It's clear it's well written, though I'm not sure the source is reliable.", "In other words, I'd check it before publishing anything."]
        grammar: [g.subjunctive-doubt]
        vocab: [w.articulo, w.fuente, w.o-sea]
dialogues:
  - id: b1.u03.d1
    title: ¿Es verdad o es un bulo?
    context: Irene shows her friend Raúl a story that is going round on social media.
    lines:
      - { speaker: Irene, es: "Raúl, mira esto: dicen que van a cerrar el metro todo el mes de agosto.", en: "Raúl, look at this: they say they're going to close the metro for the whole of August." }
      - { speaker: Raúl, es: "No me lo creo. Dudo que cierren el metro todo un mes; sería terrible.", en: "I don't believe it. I doubt they'll close the metro for a whole month; it would be terrible." }
      - { speaker: Irene, es: "Pues lo han compartido más de diez mil personas.", en: "Well, more than ten thousand people have shared it." }
      - { speaker: Raúl, es: "Eso no demuestra nada. ¿Cuál es la fuente? Igual es un bulo.", en: "That doesn't prove anything. What's the source? Maybe it's a hoax." }
      - { speaker: Irene, es: "No lo sé. Puede que tengas razón, pero a lo mejor cierran solo algunas estaciones.", en: "I don't know. You may be right, but maybe they're only closing some stations." }
      - { speaker: Raúl, es: "Eso sí es posible. Es probable que hagan obras en verano, como todos los años.", en: "That is possible. They'll probably do works in summer, like every year." }
      - { speaker: Irene, es: "Entonces, ¿no crees que sea verdad?", en: "So you don't think it's true?" }
      - { speaker: Raúl, es: "Creo que hay algo de verdad, pero no creo que la noticia sea del todo cierta. Vamos a comprobarlo en la página del ayuntamiento.", en: "I think there's some truth in it, but I don't think the story is entirely true. Let's check it on the council's website." }
      - { speaker: Irene, es: "Vale. Lo mismo mañana todos los periódicos hablan de esto.", en: "OK. Maybe tomorrow all the newspapers will be talking about this." }
      - { speaker: Raúl, es: "Sin duda. Y seguramente la mitad de ellos sin comprobar nada.", en: "Without a doubt. And probably half of them without checking anything." }
    questions:
      - { q: "What does the story claim?", options: ["The metro will be free in August", "The metro will close for the whole of August", "The metro will open new lines"], answer: 1 }
      - { q: "What does Raúl suggest doing?", options: ["Sharing the story", "Checking the council's website", "Calling the newspaper"], answer: 1 }
