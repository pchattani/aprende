id: c1.u10
title: "Palavras da floresta"
lessons:
  - id: c1.u10.l1
    title: Beija-flores e guarda-chuvas
    teach: [g.word-formation]
    vocab: [w.floresta, w.selva, w.mata, w.bioma, w.biodiversidade, w.ecossistema, w.várzea, w.igapó, w.igarapé, w.encontro-das-águas, w.afluente, w.nascente, w.foz, w.margem, w.cheia, w.vazante, w.transbordar, w.desabrigado, w.palafita, w.canoa, w.balsa, w.lancha, w.voadeira, w.embarcação, w.beija-flor, w.cor-de-rosa, w.vitória-régia, w.castanha-do-pará, w.derivação, w.composição, w.neologismo, w.radical, w.portunhol, w.contagem, w.avistar, w.vigia, w.vigiar, w.mãozinha, w.beira, w.espécie, w.hemisfério, w.junção, w.disputar, w.regressivo, w.ave, w.plural, w.alumínio]
    tip: "Compounds of verb + noun pluralise only the noun (beija-flores, guarda-chuvas); verbs give nouns by back-formation (pescar → a pesca) and infinitives become nouns (o amanhecer)."
    sentences:
      - { es: "Dois beija-flores disputavam a mesma flor na varanda do hotel.", en: "Two hummingbirds were fighting over the same flower on the hotel veranda.", altEs: ["Dois beija-flores brigavam pela mesma flor na varanda do hotel."], grammar: [g.word-formation, g.imperfect], vocab: [w.beija-flor, w.flor, w.varanda], note: "Verb + noun compound: only the noun takes the plural." }
      - { es: "Esqueci os guarda-chuvas na voadeira.", en: "I left the umbrellas in the speedboat.", altEs: ["Deixei os guarda-chuvas na voadeira."], grammar: [g.word-formation], vocab: [w.guarda-chuva, w.voadeira], error: { wrong: "Esqueci os guardas-chuvas na voadeira.", explain: "In a verb + noun compound only the noun changes: guarda-chuvas.", grammar: g.word-formation } }
      - { es: "Na cheia, o rio transborda e a várzea vira um lago enorme.", en: "In the flood season the river overflows and the floodplain becomes a huge lake.", altEs: ["Na cheia, o rio transborda e a várzea se transforma num lago enorme."], grammar: [g.word-formation], vocab: [w.cheia, w.transbordar, w.várzea, w.enorme] }
      - { es: "Em Macapá, muitas casas de palafita ficam na beira do rio.", en: "In Macapá, many stilt houses stand at the river's edge.", altEs: ["Em Macapá, muitas palafitas ficam na beira do rio."], grammar: [g.word-formation], vocab: [w.palafita, w.beira] }
      - { es: "De “pescar” vem “a pesca”; de “ajudar”, “a ajuda”: é a derivação regressiva.", en: "From pescar comes a pesca; from ajudar, a ajuda: that's back-formation.", grammar: [g.word-formation], vocab: [w.derivação, w.regressivo, w.pesca, w.ajuda] }
      - { es: "“Sambódromo” e “portunhol” são palavras formadas pela junção de outras duas.", en: "Sambódromo and portunhol are words formed by blending two others.", grammar: [g.word-formation], vocab: [w.portunhol, w.junção] }
      - { es: "Ela fala um portunhol divertido com os turistas argentinos.", en: "She speaks a funny Portuñol with the Argentinian tourists.", altEs: ["Ela fala um portunhol engraçado com os turistas argentinos."], grammar: [g.word-formation], vocab: [w.portunhol, w.argentino] }
      - { es: "A vitória-régia, cartão-postal da Amazônia, abre as flores à noite.", en: "The giant water lily, an emblem of the Amazon, opens its flowers at night.", grammar: [g.word-formation], vocab: [w.vitória-régia, w.cartão-postal, w.flor] }
      - { es: "Avistamos dois botos cor-de-rosa perto da foz do igarapé.", en: "We spotted two pink river dolphins near the mouth of the creek.", altEs: ["Vimos dois botos cor-de-rosa perto da foz do igarapé."], grammar: [g.word-formation], vocab: [w.avistar, w.boto, w.cor-de-rosa, w.foz, w.igarapé], note: "cor-de-rosa keeps its hyphens and does not change in the plural." }
      - { es: "O afluente nasce numa nascente escondida no meio da mata.", en: "The tributary rises from a spring hidden in the middle of the woods.", grammar: [g.word-formation], vocab: [w.afluente, w.nascente, w.mata, w.esconder] }
      - { es: "Na contagem de aves, os pesquisadores registraram mais de cem espécies num só dia.", en: "In the bird count, the researchers recorded more than a hundred species in a single day.", grammar: [g.word-formation], vocab: [w.contagem, w.ave, w.espécie, w.registrar] }
      - { es: "A biodiversidade do bioma amazônico ainda não foi totalmente estudada.", en: "The biodiversity of the Amazon biome has not yet been fully studied.", grammar: [g.word-formation, g.passive-ser], vocab: [w.biodiversidade, w.bioma, w.amazônico] }
      - { es: "Na cheia, dá para entrar de canoa no igapó, entre os troncos das árvores.", en: "In the flood season you can paddle a canoe into the flooded forest, among the tree trunks.", grammar: [g.word-formation], vocab: [w.canoa, w.igapó, w.tronco] }
      - { es: "“Selva” é palavra de livro; o povo daqui diz “mata” ou simplesmente “floresta”.", en: "Selva is a bookish word; people here say mata or simply floresta.", grammar: [g.word-formation], vocab: [w.selva, w.mata, w.floresta] }
      - { es: "Comprei um guarda-sol para a praia do rio.", en: "I bought a beach umbrella for the river beach.", grammar: [g.word-formation], vocab: [w.guarda-sol], transform: { instruction: "Change to two beach umbrellas", answer: "Comprei dois guarda-sóis para a praia do rio.", en: "I bought two beach umbrellas for the river beach." } }
      - { es: "É proibido pescar durante a piracema.", en: "Fishing is banned during the spawning season.", grammar: [g.word-formation], vocab: [w.piracema, w.proibido], transform: { instruction: "Replace pescar with the noun formed from it", answer: "A pesca é proibida durante a piracema.", alt: ["Durante a piracema, a pesca é proibida."] } }
    exchanges:
      - q: { es: "Como se forma o plural de “beija-flor”?", en: "How do you form the plural of “beija-flor”?" }
        a: { es: "Só o substantivo muda: beija-flores, como guarda-chuvas.", en: "Only the noun changes: beija-flores, like guarda-chuvas." }
        alt: ["Beija-flores.", "Só muda o substantivo."]
        grammar: [g.word-formation]
        vocab: [w.beija-flor, w.guarda-chuva]
      - q: { es: "Que palavra nova você aprendeu hoje?", en: "What new word did you learn today?" }
        a: { es: "“Voadeira”: o barco de alumínio que quase voa sobre o rio.", en: "“Voadeira”: the aluminium boat that almost flies over the river." }
        alt: ["Voadeira.", "Igarapé, que vem do tupi."]
        grammar: [g.word-formation]
        vocab: [w.voadeira, w.alumínio]
      - q: { es: "Onde estão os desabrigados da cheia?", en: "Where are the people made homeless by the flood?" }
        a: { es: "Numa escola da prefeitura, até o rio baixar.", en: "In a council school, until the river goes down." }
        alt: ["Numa escola, até o rio baixar.", "Na casa de parentes."]
        grammar: [g.word-formation, g.personal-infinitive-uses]
        vocab: [w.desabrigado, w.baixar]
      - q: { es: "Dá para atravessar de balsa até a outra margem?", en: "Can you cross by ferry to the other bank?" }
        a: { es: "Dá, mas a embarcação só sai quando enche, e às vezes demora.", en: "You can, but the boat only leaves when it's full, and sometimes it takes a while." }
        alt: ["Dá, sim.", "Dá, mas demora."]
        grammar: [g.word-formation]
        vocab: [w.balsa, w.margem, w.embarcação]
      - q: { es: "Como eram as casas na beira do rio?", en: "What were the houses at the river's edge like?" }
        a: { es: "Casebres e barracos de madeira; hoje há palafitas novas, mais seguras.", en: "Wooden hovels and shacks; today there are new, safer stilt houses." }
        alt: ["Barracos de madeira.", "Eram casebres simples."]
        grammar: [g.word-formation]
        vocab: [w.casebre, w.barraco, w.palafita]
      - q: { es: "“Zerão” é um neologismo?", en: "Is “Zerão” a neologism?" }
        a: { es: "É um aumentativo de “zero”: o estádio fica em cima da linha do Equador.", en: "It's an augmentative of “zero”: the stadium sits right on the Equator." }
        alt: ["É o aumentativo de zero.", "É o nome do estádio do Equador."]
        grammar: [g.word-formation, g.diminutives-augmentatives]
        vocab: [w.neologismo, w.aumentativo, w.estádio]
    texts:
      - title: "Placa no Marco Zero"
        es: ["Você está na linha do Equador.", "Ponha um pé em cada hemisfério e tire a sua foto.", "Proibido subir no monumento."]
        en: ["You are on the Equator.", "Put one foot in each hemisphere and take your photo.", "Climbing on the monument is forbidden."]
        grammar: [g.word-formation, g.imperative-formal]
        vocab: [w.hemisfério, w.monumento]
      - title: "Dicionário de bolso"
        es: ["Igarapé: “caminho de canoa”, do tupi.", "Igapó: floresta alagada pela cheia.", "Várzea: terra que o rio cobre e descobre todo ano."]
        en: ["Igarapé: “canoe path”, from Tupi.", "Igapó: forest flooded by the high water.", "Várzea: land that the river covers and uncovers every year."]
        grammar: [g.word-formation, g.tupi-african-loanwords]
        vocab: [w.igarapé, w.igapó, w.várzea]
    spicy:
      - { es: "Um pé em cada hemisfério e o coração todo do seu lado.", en: "One foot in each hemisphere and my whole heart on your side.", altEs: ["Um pé em cada hemisfério e o coração inteiro do seu lado."], grammar: [g.word-formation], vocab: [w.hemisfério, w.coração] }
      - { es: "O meu portunhol é horrível, mas o meu sorriso é fluente.", en: "My Portuñol is awful, but my smile is fluent.", altEs: ["Meu portunhol é horrível, mas meu sorriso é fluente."], grammar: [g.word-formation], vocab: [w.portunhol, w.sorriso] }
      - { es: "Dois beija-flores na mesma flor: tipo a gente na mesma rede.", en: "Two hummingbirds on the same flower: like us in the same hammock.", grammar: [g.word-formation], vocab: [w.beija-flor, w.rede] }
      - { es: "Me dá uma mãozinha para descer da canoa? Depois pode continuar segurando.", en: "Give me a hand getting out of the canoe? After that you can keep holding on.", altEs: ["Você me dá uma mãozinha para descer da canoa? Depois pode continuar segurando."], grammar: [g.word-formation, g.diminutives-augmentatives], vocab: [w.mãozinha, w.canoa, w.segurar] }
      - { es: "Na cheia, o rio transborda; quando você chega, quem transborda sou eu.", en: "In the flood season the river overflows; when you arrive, I'm the one who overflows.", grammar: [g.word-formation], vocab: [w.cheia, w.transbordar] }

  - id: c1.u10.l2
    title: Seringueiros, castanheiras e manauaras
    teach: [g.prefixes-suffixes]
    vocab: [w.seringueira, w.seringueiro, w.seringal, w.garimpo, w.garimpeiro, w.predatório, w.castanheira, w.cafezal, w.açaizeiro, w.aquático, w.comestível, w.navegável, w.ribeirinho, w.manauara, w.paraense, w.amazônico, w.amazonense, w.prefixo, w.sufixo, w.aumentativo, w.diminutivo, w.autoestima, w.extrativismo, w.exportação, w.agronegócio, w.mineradora, w.hidrelétrica, w.lilás, w.turquesa, w.escarlate, w.anil, w.ocre, w.tronco, w.raiz, w.galho, w.folha, w.semente, w.fruto, w.cipó, w.orquídea, w.palmeira, w.sumaúma, w.amapaense, w.casca, w.palmito, w.mercúrio, w.envenenar, w.bananal, w.adulto, w.avançar, w.diplomacia, w.regional]
    tip: "-eira names a tree (castanheira), -eiro a trade (seringueiro), -al a plantation (cafezal), -vel 'able to be' (navegável), and -ense / -ano / -ara where you come from (paraense, acreano, manauara)."
    sentences:
      - { es: "O seringueiro cortava a casca da seringueira de madrugada.", en: "The rubber tapper cut the bark of the rubber tree before dawn.", altEs: ["De madrugada, o seringueiro cortava a casca da seringueira."], grammar: [g.prefixes-suffixes, g.imperfect], vocab: [w.seringueiro, w.seringueira, w.casca, w.madrugada], note: "-eiro: the trade; -eira: the tree." }
      - { es: "O seringal ficava a três dias de barco da cidade mais próxima.", en: "The rubber plantation was three days by boat from the nearest town.", grammar: [g.prefixes-suffixes], vocab: [w.seringal, w.próximo] }
      - { es: "Uma castanheira adulta pode passar dos cinquenta metros de altura.", en: "A mature Brazil-nut tree can grow taller than fifty metres.", grammar: [g.prefixes-suffixes], vocab: [w.castanheira, w.adulto, w.altura] }
      - { es: "Do açaizeiro se aproveita tudo: o fruto, o palmito e as folhas.", en: "Every part of the açaí palm is used: the fruit, the palm heart and the leaves.", altEs: ["Do açaizeiro aproveita-se tudo: o fruto, o palmito e as folhas."], grammar: [g.prefixes-suffixes, g.se-passive], vocab: [w.açaizeiro, w.fruto, w.palmito, w.folha] }
      - { es: "O garimpo predatório envenena os rios com mercúrio.", en: "Predatory wildcat mining poisons the rivers with mercury.", grammar: [g.prefixes-suffixes], vocab: [w.garimpo, w.predatório, w.envenenar, w.mercúrio] }
      - { es: "O Amazonas é navegável por navios grandes até muito além de Manaus.", en: "The Amazon is navigable by large ships far beyond Manaus.", grammar: [g.prefixes-suffixes], vocab: [w.navegável, w.navio] }
      - { es: "Ela é manauara, mas mora em Macapá há dez anos.", en: "She's from Manaus, but she has lived in Macapá for ten years.", altEs: ["Ela é de Manaus, mas mora em Macapá há dez anos."], grammar: [g.prefixes-suffixes, g.ha-faz-time], vocab: [w.manauara] }
      - { es: "Os paraenses dizem que o melhor açaí é o deles; os amapaenses discordam.", en: "People from Pará say the best açaí is theirs; people from Amapá disagree.", grammar: [g.prefixes-suffixes], vocab: [w.paraense, w.amapaense, w.discordar] }
      - { es: "O sufixo “-al” indica plantação: cafezal, bananal, seringal.", en: "The suffix -al indicates a plantation: coffee plantation, banana plantation, rubber plantation.", grammar: [g.prefixes-suffixes], vocab: [w.sufixo, w.cafezal, w.bananal, w.seringal] }
      - { es: "A exportação de castanha-do-pará sustenta muitas famílias que vivem do extrativismo.", en: "Brazil-nut exports support many families who live from harvesting forest products.", grammar: [g.prefixes-suffixes], vocab: [w.exportação, w.castanha-do-pará, w.extrativismo, w.sustentar] }
      - { es: "A hidrelétrica alagou parte da floresta, e o agronegócio avança sobre o que sobrou.", en: "The hydroelectric dam flooded part of the forest, and agribusiness is advancing on what is left.", grammar: [g.prefixes-suffixes], vocab: [w.hidrelétrica, w.agronegócio, w.avançar] }
      - { es: "Ao entardecer, o céu do Equador passa do ocre ao escarlate, e depois ao lilás.", en: "At dusk, the Equator sky turns from ochre to scarlet, and then to lilac.", grammar: [g.prefixes-suffixes, g.colours], vocab: [w.ocre, w.escarlate, w.lilás] }
      - { es: "Os cipós descem dos galhos da sumaúma até as raízes.", en: "The lianas hang from the branches of the kapok tree down to its roots.", grammar: [g.prefixes-suffixes], vocab: [w.cipó, w.galho, w.sumaúma, w.raiz] }
      - { es: "Ela tem uma autoestima enorme.", en: "She has huge self-esteem.", grammar: [g.prefixes-suffixes, g.spelling-agreement], vocab: [w.autoestima], error: { wrong: "Ela tem uma auto-estima enorme.", explain: "Since the 1990 spelling agreement, auto- joins a different vowel without a hyphen: autoestima.", grammar: g.prefixes-suffixes } }
      - { es: "Ele nasceu em Belém, no Pará.", en: "He was born in Belém, in Pará.", grammar: [g.prefixes-suffixes], vocab: [w.nascer], transform: { instruction: "Say where he's from with the gentilic of the state", answer: "Ele é paraense.", alt: ["Ele é paraense, de Belém."], en: "He's from Pará." } }
      - { es: "Isso não é possível.", en: "That isn't possible.", grammar: [g.prefixes-suffixes], vocab: [w.possível], transform: { instruction: "Use a negative prefix", answer: "Isso é impossível.", en: "That's impossible." } }
    exchanges:
      - q: { es: "Essa fruta é comestível?", en: "Is this fruit edible?" }
        a: { es: "É, sim: é o cupuaçu, que vira suco, sorvete e doce.", en: "Yes, it is: it's cupuaçu, which becomes juice, ice cream and sweets." }
        alt: ["É, sim.", "Não, essa não se come."]
        grammar: [g.prefixes-suffixes]
        vocab: [w.comestível, w.cupuaçu]
      - q: { es: "De onde você é?", en: "Where are you from?" }
        a: { es: "Sou amapaense, de Macapá, mas a minha mãe é amazonense.", en: "I'm from Amapá, from Macapá, but my mother is from Amazonas." }
        alt: ["Sou de Macapá.", "Sou amapaense."]
        grammar: [g.prefixes-suffixes]
        vocab: [w.amapaense, w.amazonense]
      - q: { es: "O que é um seringal?", en: "What is a seringal?" }
        a: { es: "Uma área de floresta com muitas seringueiras, onde os seringueiros trabalhavam.", en: "An area of forest with lots of rubber trees, where the rubber tappers worked." }
        alt: ["Uma plantação de seringueiras."]
        grammar: [g.prefixes-suffixes]
        vocab: [w.seringal, w.seringueira, w.seringueiro]
      - q: { es: "Por que esse rio está tão sujo?", en: "Why is this river so dirty?" }
        a: { es: "Por causa do garimpo: os garimpeiros usam mercúrio, que envenena os peixes e os ribeirinhos.", en: "Because of the wildcat mining: the miners use mercury, which poisons the fish and the riverside people." }
        alt: ["Por causa do garimpo.", "É o garimpo ilegal."]
        grammar: [g.prefixes-suffixes]
        vocab: [w.garimpeiro, w.mercúrio, w.ribeirinho]
      - q: { es: "Quem quer comprar aquela área?", en: "Who wants to buy that area?" }
        a: { es: "Uma mineradora estrangeira; os moradores preferem o turismo e o extrativismo.", en: "A foreign mining company; the residents prefer tourism and forest harvesting." }
        alt: ["Uma mineradora.", "Uma empresa estrangeira."]
        grammar: [g.prefixes-suffixes]
        vocab: [w.mineradora, w.estrangeiro]
    texts:
      - title: "Placa num museu de Macapá"
        es: ["O extrativismo sustenta famílias ribeirinhas há séculos.", "Da floresta saem castanha, açaí, óleos e sementes.", "Preservar a floresta em pé também é economia."]
        en: ["Harvesting forest products has supported riverside families for centuries.", "From the forest come nuts, açaí, oils and seeds.", "Preserving the standing forest is also economics."]
        grammar: [g.prefixes-suffixes]
        vocab: [w.extrativismo, w.semente, w.óleo]
      - title: "Minidicionário de sufixos"
        es: ["-eira: árvore (castanheira, mangueira, seringueira).", "-al: plantação (cafezal, seringal).", "-ense: origem (paraense, amazonense)."]
        en: ["-eira: tree (Brazil-nut tree, mango tree, rubber tree).", "-al: plantation (coffee plantation, rubber plantation).", "-ense: origin (from Pará, from Amazonas)."]
        grammar: [g.prefixes-suffixes]
        vocab: [w.sufixo, w.castanheira, w.paraense]
    spicy:
      - { es: "Sou manauara, você é paraense: o nosso romance é uma questão de diplomacia regional.", en: "I'm from Manaus, you're from Pará: our relationship is a matter of regional diplomacy.", altEs: ["Eu sou manauara e você é paraense: nosso romance é uma questão de diplomacia regional."], grammar: [g.prefixes-suffixes], vocab: [w.manauara, w.paraense, w.romance] }
      - { es: "Esse seu vestido turquesa é um perigo: não consigo olhar para o pôr do sol.", en: "That turquoise dress of yours is a hazard: I can't look at the sunset.", altEs: ["Esse vestido turquesa é um perigo: eu não consigo olhar para o pôr do sol."], grammar: [g.prefixes-suffixes, g.colours], vocab: [w.turquesa, w.perigo] }
      - { es: "Com você, até o diminutivo vira aumentativo: um beijinho nunca é pequeno.", en: "With you, even the diminutive becomes an augmentative: a little kiss is never small.", grammar: [g.prefixes-suffixes, g.diminutives-augmentatives], vocab: [w.diminutivo, w.aumentativo] }
      - { es: "Você é tipo castanheira: alto, raro e protegido por lei.", en: "You're like a Brazil-nut tree: tall, rare and protected by law.", grammar: [g.prefixes-suffixes], vocab: [w.castanheira, w.raro, w.proteger], note: "Felling Brazil-nut trees is banned by law in Brazil." }
      - { es: "O meu amor por você é navegável o ano inteiro, na cheia e na vazante.", en: "My love for you is navigable all year round, in high water and low.", altEs: ["Meu amor por você é navegável o ano todo, na cheia e na vazante."], grammar: [g.prefixes-suffixes], vocab: [w.navegável, w.vazante] }

  - id: c1.u10.l3
    title: Falsos amigos e bichos da floresta
    teach: [g.false-friends]
    vocab: [w.falso-cognato, w.polvo, w.taça, w.pretender, w.apelido, w.borracha, w.comprido, w.distante, w.boto, w.pirarucu, w.tambaqui, w.tucunaré, w.piranha, w.sucuri, w.jiboia, w.bugio, w.sagui, w.papagaio, w.periquito, w.gavião, w.formiga, w.cupim, w.carapanã, w.aranha, w.escorpião, w.veneno, w.venenoso, w.repelente, w.malária, w.dengue, w.febre-amarela, w.picada, w.embaraçado, w.mancha, w.presa, w.buraco, w.posto, w.brindar, w.tentáculo, w.pó, w.cacau, w.cognato, w.encantar]
    tip: "pretender = to intend, atualmente = currently, esquisito = weird, largo = wide, comprido = long, polvo = octopus, borracha = eraser or rubber, apelido = nickname."
    sentences:
      - { es: "Para abrir a porta do barco, puxe; não empurre.", en: "To open the boat door, pull; don't push.", altEs: ["Para abrir a porta do barco, puxe, não empurre."], grammar: [g.false-friends, g.imperative-formal], vocab: [w.puxar, w.empurrar], note: "puxar = pull (not push)." }
      - { es: "Pretendo voltar ao Amapá no ano que vem.", en: "I intend to come back to Amapá next year.", altEs: ["Eu pretendo voltar ao Amapá no ano que vem.", "Pretendo voltar ao Amapá no próximo ano."], grammar: [g.false-friends], vocab: [w.pretender], note: "pretender = to intend; 'to pretend' is fingir." }
      - { es: "No restaurante, pedi polvo achando que era outra coisa.", en: "At the restaurant I ordered octopus thinking it was something else.", grammar: [g.false-friends], vocab: [w.polvo], note: "Spanish polvo (dust) is pó in Portuguese." }
      - { es: "O apelido dele é Peixinho, por causa do jeito como ele nada.", en: "His nickname is Peixinho (Little Fish), because of the way he swims.", grammar: [g.false-friends], vocab: [w.apelido, w.nadar], note: "apelido = nickname; surname is sobrenome." }
      - { es: "Me empresta uma borracha? Errei o nome do peixe.", en: "Can you lend me an eraser? I got the fish's name wrong.", altEs: ["Você me empresta uma borracha? Errei o nome do peixe."], grammar: [g.false-friends], vocab: [w.borracha, w.errar], variant: "In Portugal: Emprestas-me uma borracha?" }
      - { es: "O rio é largo, mas a ponte é ainda mais comprida.", en: "The river is wide, but the bridge is even longer.", grammar: [g.false-friends, g.comparatives], vocab: [w.largo, w.comprido, w.ponte], note: "largo = wide; long is comprido." }
      - { es: "Brindamos com uma taça de vinho no Marco Zero.", en: "We toasted with a glass of wine at the Marco Zero.", grammar: [g.false-friends], vocab: [w.brindar, w.taça, w.vinho] }
      - { es: "O pirarucu pode passar dos dois metros de comprimento.", en: "The pirarucu can grow longer than two metres.", grammar: [g.false-friends], vocab: [w.pirarucu, w.comprimento] }
      - { es: "O boto cor-de-rosa é parente distante do golfinho do mar.", en: "The pink river dolphin is a distant relative of the ocean dolphin.", grammar: [g.false-friends], vocab: [w.boto, w.parente, w.distante, w.golfinho], note: "parente = relative; parents are pais." }
      - { es: "Ninguém nada neste trecho do rio: tem piranha e sucuri.", en: "Nobody swims in this stretch of the river: there are piranhas and anacondas.", altEs: ["Ninguém nada nesse trecho do rio: tem piranha e sucuri."], grammar: [g.false-friends, g.tem-there-is], vocab: [w.piranha, w.sucuri, w.trecho], note: "nada here is the verb nadar (swims), not 'nothing'." }
      - { es: "Os bugios gritam ao amanhecer, e os saguis roubam banana da varanda.", en: "The howler monkeys scream at dawn, and the marmosets steal bananas from the veranda.", grammar: [g.false-friends], vocab: [w.bugio, w.sagui, w.gritar, w.roubar] }
      - { es: "A picada de carapanã pode transmitir malária, dengue ou febre amarela.", en: "A mosquito bite can transmit malaria, dengue or yellow fever.", grammar: [g.false-friends], vocab: [w.picada, w.carapanã, w.malária, w.dengue, w.febre-amarela] }
      - { es: "Na verdade, eu não gosto de tambaqui.", en: "Actually, I don't like tambaqui.", altEs: ["Para falar a verdade, eu não gosto de tambaqui."], grammar: [g.false-friends], vocab: [w.tambaqui, w.na-verdade], error: { wrong: "Atualmente, eu não gosto de tambaqui.", explain: "Atualmente means 'currently'; for 'actually' say na verdade.", grammar: g.false-friends } }
      - { es: "Ela está grávida de sete meses.", en: "She's seven months pregnant.", grammar: [g.false-friends], vocab: [w.grávida], error: { wrong: "Ela está embaraçada de sete meses.", explain: "Embaraçada means embarrassed or confused, never pregnant: grávida.", grammar: g.false-friends } }
      - { es: "O meu sobrenome é Dudu.", en: "My surname is Dudu.", grammar: [g.false-friends], vocab: [w.sobrenome, w.apelido], transform: { instruction: "Dudu is not a surname: correct the noun", answer: "O meu apelido é Dudu.", alt: ["Meu apelido é Dudu."], en: "My nickname is Dudu." } }
      - { es: "Eu tenho a intenção de visitar a Fortaleza de São José.", en: "I mean to visit the São José Fortress.", grammar: [g.false-friends], vocab: [w.intenção], transform: { instruction: "Say it with pretender", answer: "Pretendo visitar a Fortaleza de São José.", alt: ["Eu pretendo visitar a Fortaleza de São José."], en: "I intend to visit the São José Fortress." } }
    exchanges:
      - q: { es: "O que você pretende fazer em Macapá?", en: "What do you intend to do in Macapá?" }
        a: { es: "Pretendo visitar a fortaleza e pôr um pé em cada hemisfério no Marco Zero.", en: "I intend to visit the fortress and put one foot in each hemisphere at the Marco Zero." }
        alt: ["Pretendo conhecer o Marco Zero.", "Visitar a fortaleza."]
        grammar: [g.false-friends]
        vocab: [w.pretender, w.hemisfério]
      - q: { es: "Esse peixe é tucunaré ou tambaqui?", en: "Is this fish a peacock bass or a tambaqui?" }
        a: { es: "Tucunaré: olha a mancha no rabo, parece um olho.", en: "Peacock bass: look at the spot on its tail, it looks like an eye." }
        alt: ["É tucunaré.", "Tambaqui, pelo tamanho."]
        grammar: [g.false-friends]
        vocab: [w.tucunaré, w.tambaqui, w.mancha, w.rabo]
      - q: { es: "Tem cobra venenosa por aqui?", en: "Are there venomous snakes around here?" }
        a: { es: "Tem, mas a jiboia e a sucuri não têm veneno: elas apertam a presa.", en: "There are, but boas and anacondas have no venom: they squeeze their prey." }
        alt: ["Tem, então cuidado na trilha.", "Algumas, sim."]
        grammar: [g.false-friends, g.tem-there-is]
        vocab: [w.venenoso, w.jiboia, w.veneno, w.presa]
      - q: { es: "Que gritaria é essa lá fora?", en: "What's all that squawking outside?" }
        a: { es: "Um papagaio e dois periquitos fugindo do gavião.", en: "A parrot and two parakeets fleeing from the hawk." }
        alt: ["São os papagaios.", "É o gavião assustando os periquitos."]
        grammar: [g.false-friends]
        vocab: [w.papagaio, w.periquito, w.gavião]
      - q: { es: "O que é um falso cognato?", en: "What is a false friend?" }
        a: { es: "Uma palavra parecida com outra de outra língua, mas com outro sentido, como “polvo”.", en: "A word that looks like one in another language but means something else, like “polvo”." }
        alt: ["Uma palavra que engana, como “polvo”.", "Um falso amigo."]
        grammar: [g.false-friends]
        vocab: [w.falso-cognato, w.polvo]
      - q: { es: "Por que tem tanto pó de madeira no chão?", en: "Why is there so much sawdust on the floor?" }
        a: { es: "É cupim: está comendo a porta inteira.", en: "It's termites: they're eating the whole door." }
        alt: ["É cupim.", "Os cupins atacaram a porta."]
        grammar: [g.false-friends]
        vocab: [w.cupim, w.pó, w.madeira]
    texts:
      - title: "Aviso na trilha"
        es: ["Use repelente e calça comprida.", "Não coloque a mão em buracos de árvore: pode haver aranhas e escorpiões.", "Em caso de picada, procure o posto de saúde."]
        en: ["Wear insect repellent and long trousers.", "Don't put your hand into holes in trees: there may be spiders and scorpions.", "If you are bitten or stung, go to the health centre."]
        grammar: [g.false-friends, g.imperative-formal]
        vocab: [w.repelente, w.buraco, w.aranha, w.escorpião, w.posto]
      - title: "Mensagem de um estudante espanhol"
        es: ["Hoje pedi “polvo” achando que era um doce de cacau em pó.", "Veio um polvo inteiro, com tentáculos e tudo.", "Estava ótimo, mas agora desconfio de todos os falsos cognatos."]
        en: ["Today I ordered “polvo” thinking it was a cocoa-powder sweet.", "A whole octopus arrived, tentacles and all.", "It was great, but now I'm suspicious of every false friend."]
        grammar: [g.false-friends]
        vocab: [w.polvo, w.cacau, w.tentáculo, w.falso-cognato]
    spicy:
      - { es: "Não pretendo fingir que não reparei em você.", en: "I don't intend to pretend I didn't notice you.", altEs: ["Eu não pretendo fingir que não reparei em você."], grammar: [g.false-friends], vocab: [w.pretender, w.fingir, w.reparar] }
      - { es: "Atualmente estou solteiro; na verdade, só até você aceitar o meu convite.", en: "I'm currently single; actually, only until you accept my invitation.", altEs: ["Atualmente estou solteiro; na verdade, só até você aceitar meu convite."], grammar: [g.false-friends, g.personal-infinitive-uses], vocab: [w.atualmente, w.na-verdade, w.solteiro] }
      - { es: "Me diz o seu apelido, que o sobrenome eu descubro depois.", en: "Tell me your nickname; I'll find out your surname later.", altEs: ["Me fala o seu apelido, que o sobrenome eu descubro depois."], grammar: [g.false-friends], vocab: [w.apelido, w.sobrenome, w.descobrir] }
      - { es: "Uma taça de vinho, o pôr do sol no Equador e você do meu lado: o resto do mundo pode ficar distante.", en: "A glass of wine, the sunset on the Equator and you by my side: the rest of the world can stay far away.", grammar: [g.false-friends], vocab: [w.taça, w.distante] }
      - { es: "Você é tipo boto: aparece nas festas, encanta todo mundo e some antes do amanhecer.", en: "You're like the boto: you turn up at parties, charm everyone and vanish before dawn.", grammar: [g.false-friends], vocab: [w.boto, w.encantar, w.sumir], note: "Legend says the boto becomes a charming man at parties and disappears before daybreak." }

  - id: c1.u10.l4
    title: Do tupi e do quimbundo
    teach: [g.tupi-african-loanwords]
    vocab: [w.pajé, w.cacique, w.maloca, w.cocar, w.urucum, w.tupi, w.curumim, w.pororoca, w.piracema, w.capim, w.pipoca, w.cutucar, w.catapora, w.jururu, w.sapeca, w.mingau, w.cochilar, w.cochilo, w.cafuné, w.moleque, w.quitanda, w.dengo, w.fubá, w.quiabo, w.angu, w.batucada, w.marimbondo, w.minhoca, w.xingar, w.senzala, w.banzo, w.mandinga, w.guaçu, w.mirim, w.oca, w.barraco, w.casebre, w.chamego, w.xodó, w.namorico, w.tacacá, w.tucupi, w.jambu, w.maniçoba, w.pupunha, w.buriti, w.graviola, w.jabuticaba, w.maracujá, w.cupuaçu, w.desovar, w.goma, w.isca, w.carnaval, w.coberta, w.tremer, w.nheengatu, w.mimado, w.imitar, w.cozido, w.desanimado, w.bicho, w.percussão, w.feitiço, w.malícia]
    tip: "Tupi gave Portuguese its plants, animals and place names (-guaçu = big, -mirim = small, ita- = stone); Kimbundu, Kikongo and Yoruba gave words of home, food and affection: cafuné, dengo, moleque, quitanda."
    sentences:
      - { es: "“Pororoca” vem do tupi e imita o barulho da onda que sobe o rio.", en: "Pororoca comes from Tupi and imitates the roar of the wave that travels up the river.", grammar: [g.tupi-african-loanwords], vocab: [w.pororoca, w.tupi, w.barulho, w.onda] }
      - { es: "Durante a piracema, os peixes sobem o rio para desovar.", en: "During the spawning run, the fish swim upriver to spawn.", grammar: [g.tupi-african-loanwords], vocab: [w.piracema, w.desovar] }
      - { es: "O pajé usa urucum para pintar o rosto antes da festa.", en: "The shaman uses annatto to paint his face before the festival.", grammar: [g.tupi-african-loanwords], vocab: [w.pajé, w.urucum, w.rosto] }
      - { es: "O cacique recebeu os visitantes na maloca, com um cocar de penas de arara.", en: "The chief received the visitors in the communal house, wearing a headdress of macaw feathers.", grammar: [g.tupi-african-loanwords], vocab: [w.cacique, w.maloca, w.cocar, w.pena, w.arara] }
      - { es: "Em São Gabriel da Cachoeira, o nheengatu é língua oficial ao lado do português.", en: "In São Gabriel da Cachoeira, Nheengatu is an official language alongside Portuguese.", grammar: [g.tupi-african-loanwords], vocab: [w.nheengatu, w.oficial] }
      - { es: "Itaguaçu quer dizer “pedra grande”: ita é pedra, e guaçu é grande.", en: "Itaguaçu means “big stone”: ita is stone, and guaçu is big.", grammar: [g.tupi-african-loanwords], vocab: [w.guaçu, w.pedra], note: "And mirim means small: Mogi-Mirim, Itaquera-Mirim." }
      - { es: "A avó fazia cafuné nos netos até eles cochilarem na rede.", en: "Grandma would stroke the grandchildren's hair until they dozed off in the hammock.", altEs: ["A vó fazia cafuné nos netos até eles cochilarem na rede."], grammar: [g.tupi-african-loanwords, g.personal-infinitive-uses], vocab: [w.cafuné, w.neto, w.cochilar] }
      - { es: "Ela é a filha mais nova da família.", en: "She's the youngest child in the family.", grammar: [g.tupi-african-loanwords], vocab: [w.caçula], transform: { instruction: "Use the word of African origin for 'youngest child'", answer: "Ela é a caçula da família.", en: "She's the baby of the family." } }
      - { es: "Comprei fubá e quiabo na quitanda da esquina.", en: "I bought cornmeal and okra at the corner greengrocer's.", grammar: [g.tupi-african-loanwords], vocab: [w.fubá, w.quiabo, w.quitanda, w.esquina] }
      - { es: "No café da manhã, mingau de tapioca e pupunha cozida com café.", en: "For breakfast, tapioca porridge and boiled peach-palm fruit with coffee.", grammar: [g.tupi-african-loanwords], vocab: [w.mingau, w.tapioca, w.pupunha], variant: "In Portugal: Ao pequeno-almoço…" }
      - { es: "O tacacá é servido na cuia, com tucupi, goma, jambu e camarão.", en: "Tacacá is served in a gourd bowl, with tucupi, tapioca starch, jambu and shrimp.", grammar: [g.tupi-african-loanwords, g.passive-ser], vocab: [w.tacacá, w.cuia, w.tucupi, w.goma, w.jambu, w.camarão] }
      - { es: "A maniçoba leva uma semana para ficar pronta, porque a folha da mandioca precisa cozinhar muito.", en: "Maniçoba takes a week to make, because the cassava leaves need long cooking.", grammar: [g.tupi-african-loanwords], vocab: [w.maniçoba, w.mandioca, w.cozinhar] }
      - { es: "Na senzala, os escravizados chamavam de banzo a saudade da África.", en: "In the slave quarters, the enslaved called their longing for Africa banzo.", grammar: [g.tupi-african-loanwords], vocab: [w.senzala, w.escravizado, w.banzo, w.saudade] }
      - { es: "Não xingue o marimbondo; só se afaste devagar!", en: "Don't swear at the wasp; just back away slowly!", grammar: [g.tupi-african-loanwords, g.imperative-negative], vocab: [w.xingar, w.marimbondo, w.afastar-se] }
      - { es: "Ele cochilou na rede depois do almoço.", en: "He dozed off in the hammock after lunch.", altEs: ["Depois do almoço, ele cochilou na rede.", "Ele tirou um cochilo na rede depois do almoço."], grammar: [g.tupi-african-loanwords], vocab: [w.cochilar, w.cochilo, w.rede], error: { wrong: "Ele se cochilou na rede depois do almoço.", explain: "Cochilar is not reflexive: ele cochilou (or tirou um cochilo).", grammar: g.tupi-african-loanwords } }
      - { es: "Ela está triste e desanimada.", en: "She's sad and listless.", grammar: [g.tupi-african-loanwords], vocab: [w.desanimado], transform: { instruction: "Say it with one word of Tupi origin", answer: "Ela está jururu.", alt: ["Ela anda jururu.", "Ela ficou jururu."], en: "She's down in the dumps." } }
    exchanges:
      - q: { es: "Que palavras do tupi você conhece?", en: "Which words from Tupi do you know?" }
        a: { es: "Pipoca, capim, mingau, cutucar… e quase todos os nomes de bicho daqui.", en: "Popcorn, grass, porridge, to poke… and nearly all the animal names around here." }
        alt: ["Pipoca, capim e mingau.", "Quase todos os nomes de bicho."]
        grammar: [g.tupi-african-loanwords]
        vocab: [w.pipoca, w.capim, w.mingau, w.cutucar]
      - q: { es: "Você já viu a pororoca?", en: "Have you ever seen the tidal bore?" }
        a: { es: "No rio Araguari, não: ela desapareceu há alguns anos. Mas ainda acontece em outros rios, como o Capim, no Pará.", en: "On the Araguari, no: it disappeared some years ago. But it still happens on other rivers, like the Capim, in Pará." }
        alt: ["Ainda não.", "Já, no rio Capim."]
        grammar: [g.tupi-african-loanwords, g.ha-faz-time]
        vocab: [w.pororoca, w.capim]
      - q: { es: "Por que o moleque não foi à escola?", en: "Why didn't the kid go to school?" }
        a: { es: "Pegou catapora e está todo jururu.", en: "He's got chickenpox and he's really down in the dumps." }
        alt: ["Está com catapora.", "Ficou doente."]
        grammar: [g.tupi-african-loanwords]
        vocab: [w.moleque, w.catapora, w.jururu]
      - q: { es: "Qual é a sua fruta preferida?", en: "What's your favourite fruit?" }
        a: { es: "Jabuticaba, mas aqui no Norte é difícil; fico com o cupuaçu e o buriti.", en: "Jabuticaba, but it's hard to find up here in the North; I make do with cupuaçu and buriti." }
        alt: ["Maracujá.", "Graviola, sem dúvida."]
        grammar: [g.tupi-african-loanwords]
        vocab: [w.jabuticaba, w.cupuaçu, w.buriti, w.graviola, w.maracujá]
      - q: { es: "De quem é esse cachorro tão mimado?", en: "Whose is this very spoilt dog?" }
        a: { es: "É o xodó da casa: vive de dengo e de cafuné.", en: "He's the darling of the house: he lives on pampering and having his head stroked." }
        alt: ["É o xodó da família.", "É o nosso xodó."]
        grammar: [g.tupi-african-loanwords]
        vocab: [w.xodó, w.dengo, w.cafuné, w.mimado]
      - q: { es: "Que isca você usa para pescar?", en: "What bait do you use for fishing?" }
        a: { es: "Minhoca para os peixes pequenos; para o tucunaré, isca artificial.", en: "Earthworms for the small fish; for peacock bass, artificial bait." }
        alt: ["Minhoca.", "Depende do peixe."]
        grammar: [g.tupi-african-loanwords]
        vocab: [w.isca, w.minhoca, w.tucunaré]
    texts:
      - title: "Cardápio de uma barraca em Macapá"
        es: ["Tacacá na cuia, com tucupi e jambu.", "Maniçoba aos sábados; angu com quiabo às quartas.", "Sucos de graviola, maracujá e cupuaçu."]
        en: ["Tacacá in a gourd bowl, with tucupi and jambu.", "Maniçoba on Saturdays; cornmeal mush with okra on Wednesdays.", "Soursop, passion fruit and cupuaçu juices."]
        grammar: [g.tupi-african-loanwords]
        vocab: [w.tacacá, w.maniçoba, w.angu, w.quiabo]
      - title: "Glossário"
        es: ["Oca: casa indígena; maloca: casa grande, onde vivem várias famílias.", "Curumim: menino, em tupi.", "Batucada: percussão em roda, herança africana do samba e do carnaval.", "Mandinga: feitiço, e também a malícia do jogo de capoeira."]
        en: ["Oca: indigenous house; maloca: big house where several families live.", "Curumim: boy, in Tupi.", "Batucada: percussion in a circle, the African heritage of samba and carnival.", "Mandinga: a spell, and also the cunning of capoeira play."]
        grammar: [g.tupi-african-loanwords]
        vocab: [w.oca, w.maloca, w.curumim, w.batucada, w.mandinga]
    spicy:
      - { es: "Hoje eu só quero dengo, chamego e cafuné; o resto pode esperar.", en: "Today all I want is pampering, cuddles and my hair stroked; everything else can wait.", altEs: ["Hoje só quero dengo, chamego e cafuné; o resto pode esperar."], grammar: [g.tupi-african-loanwords], vocab: [w.dengo, w.chamego, w.cafuné] }
      - { es: "Não era namorico de verão: você virou o meu xodó no inverno também.", en: "It wasn't a summer fling: you became my sweetheart in the winter too.", altEs: ["Não foi namorico de verão: você virou meu xodó no inverno também."], grammar: [g.tupi-african-loanwords], vocab: [w.namorico, w.xodó, w.inverno] }
      - { es: "Pode me cutucar se eu cochilar no filme; ou, melhor ainda, me dá um beijo.", en: "You can nudge me if I doze off during the film; or, better still, give me a kiss.", altEs: ["Pode me cutucar se eu cochilar no filme; ou melhor, me dá um beijo."], grammar: [g.tupi-african-loanwords, g.future-subjunctive-se], vocab: [w.cutucar, w.cochilar, w.beijo] }
      - { es: "Que mandinga você fez? Desde ontem eu só penso em você.", en: "What spell have you cast? Since yesterday I can only think of you.", altEs: ["Que mandinga foi essa? Desde ontem só penso em você."], grammar: [g.tupi-african-loanwords], vocab: [w.mandinga, w.pensar] }
      - { es: "Você é sapeca demais: roubou a pipoca, a coberta e o meu coração.", en: "You're far too cheeky: you stole the popcorn, the blanket and my heart.", altEs: ["Você é muito sapeca: roubou a pipoca, a coberta e o meu coração."], grammar: [g.tupi-african-loanwords], vocab: [w.sapeca, w.pipoca, w.coberta] }
dialogues:
  - id: c1.u10.d1
    title: No Marco Zero
    context: At the Equator monument in Macapá, Teo, an Argentinian visitor, chats with the local guide Iracema.
    lines:
      - { speaker: Iracema, es: "Bem-vindo ao Marco Zero! Aqui a linha do Equador passa bem no meio do monumento.", en: "Welcome to the Marco Zero! Here the Equator runs right through the middle of the monument." }
      - { speaker: Teo, es: "Que legal! Desculpa o meu portunhol: eu pretendo… quer dizer, eu quero tirar uma foto com um pé em cada hemisfério.", en: "How cool! Sorry about my Portuñol: I intend… I mean, I want to take a photo with one foot in each hemisphere." }
      - { speaker: Iracema, es: "Em português, “pretender” também é ter a intenção. Você falou certo!", en: "In Portuguese, “pretender” also means to intend. You said it right!" }
      - { speaker: Teo, es: "Ah, que bom! Ontem pedi “polvo” num restaurante achando que era um doce de cacau em pó…", en: "Oh, good! Yesterday I ordered “polvo” in a restaurant thinking it was a cocoa-powder sweet…" }
      - { speaker: Iracema, es: "E veio um polvo inteiro, aposto! Aqui o prato típico é o tacacá, com tucupi e jambu.", en: "And a whole octopus arrived, I bet! The typical dish here is tacacá, with tucupi and jambu." }
      - { speaker: Teo, es: "Jambu é aquela folha que faz a boca tremer? Achei esquisitíssimo!", en: "Is jambu that leaf that makes your mouth tingle? I found it really weird!" }
      - { speaker: Iracema, es: "“Esquisito”? Cuidado: em português isso quer dizer estranho, não delicioso!", en: "“Esquisito”? Careful: in Portuguese that means strange, not delicious!" }
