grammar:
  - { prompt: "Il fatto che non ___ ancora chiamato mi preoccupa.", options: ["ha", "abbia", "avrà"], answer: 1, explain: "A clause with il fatto che placed before the verb takes the congiuntivo (g.il-fatto-che)." }
  - { prompt: "Non preoccuparti, ___ io!", options: ["che io sappia", "per carità", "ci penso"], answer: 2, explain: "The fixed phrase ci penso io = I'll take care of it (g.fixed-expressions)." }
  - { prompt: "___ pure, la porta è aperta.", options: ["Entri", "Entra lei", "Entrerebbe"], answer: 0, explain: "A congiuntivo used as a polite command or permission (Entri pure) (g.congiuntivo-independent)." }
  - { prompt: "Verga ___ a Catania nel 1840.", options: ["nascé", "nacque", "nasceva"], answer: 1, explain: "nascere has a strong passato remoto: nacqui, nacque, nacquero (g.passato-remoto-irregular)." }
  - { prompt: "Dopo che ebbero cenato, ___ a passeggiare sul lungomare.", options: ["uscirono", "sono usciti", "uscivano"], answer: 0, explain: "The trapassato remoto (ebbero cenato) goes with a main verb in the passato remoto (g.trapassato-remoto)." }
  - { prompt: "___ la domanda, riceverete una risposta entro trenta giorni.", options: ["Presentata", "Presentando", "Presentato"], answer: 0, explain: "Participio assoluto: the participle agrees with its own noun (la domanda) (g.participio-assoluto)." }
  - { prompt: "___ è un'arte, diceva mia nonna.", options: ["Il vivere bene", "Vivendo bene", "Vissuto bene"], answer: 0, explain: "An infinitive with the article becomes a noun: il vivere (g.infinito-sostantivato)." }
  - { prompt: "La proposta era interessante; ___, è stata rifiutata.", options: ["ciononostante", "pertanto", "infatti"], answer: 0, explain: "Contrast against expectation: ciononostante (g.discourse-markers-advanced)." }
  - { prompt: "Ne parleremo ___ ci sia tempo.", options: ["qualora", "perché", "siccome"], answer: 0, explain: "qualora (if, in case) is a formal conditional conjunction with the congiuntivo (g.conditional-conjunctions)." }
  - { prompt: "Dai dati raccolti ___ che il fenomeno è in crescita.", options: ["si evince", "si vede bene che", "dicono"], answer: 0, explain: "Academic register: si evince che = it emerges that (g.academic-register)." }
  - { prompt: "Stile da giornale: «Chiudono i porti» diventa «___ dei porti».", options: ["Chiusura", "Chiudendo", "Chiusi"], answer: 0, explain: "Nominalisation with -ura: la chiusura (g.nominalization)." }
  - { prompt: "Non è ___ colpa mia se il treno è in ritardo!", options: ["mica", "pure", "magari"], answer: 0, explain: "mica reinforces a negation in everyday speech (g.discourse-particles)." }
  - { prompt: "«Eventualmente» significa ___.", options: ["alla fine", "se necessario, nel caso", "in questo momento"], answer: 1, explain: "eventualmente = if necessary, should the case arise; 'eventually' is alla fine (g.false-friends-advanced)." }
  - { prompt: "In un romanzo dell'Ottocento: «___ tacque, e uscì dalla stanza.»", options: ["Egli", "Lui stesso che", "Esso"], answer: 0, explain: "egli is the literary subject pronoun for a person; esso is for things (g.literary-language)." }
  - { prompt: "Titolo di giornale: «Palermo, ___ il nuovo porto turistico».", options: ["inaugurato", "è stato inaugurando", "inaugurava"], answer: 0, explain: "Headlines drop the auxiliary and keep the participle (g.journalistic-language)." }
writing:
  prompt: "Write a formal letter (at least 220 words) to the mayor of a Sicilian or Sardinian town where you spent a study period. Propose a project to make the town more attractive to international students. Use a formal opening and closing, at least one participio assoluto or implicit clause, a conditional conjunction (qualora, purché, a patto che), formal discourse markers (in primo luogo, inoltre, ciononostante, in conclusione) and nominal style where appropriate."
  minWords: 220
  modelAnswer: |
    Egregio Signor Sindaco,
    mi chiamo Hannah Becker e ho passato gli ultimi sei mesi a Siracusa grazie al programma Erasmus. Tornata in Germania, ho sentito il bisogno di scriverLe per ringraziarLa dell'accoglienza ricevuta e, al tempo stesso, per presentarLe una proposta.

    In primo luogo, desidero sottolineare quanto la città sia apprezzata dagli studenti stranieri: il centro storico di Ortigia, la qualità della vita e la disponibilità degli abitanti sono state, per me e per i miei compagni, ragioni sufficienti per consigliarla ad altri. Ciononostante, alcune difficoltà rischiano di spaventare chi arriva per la prima volta, a cominciare dalla ricerca di una casa e dalla scarsa disponibilità di informazioni in lingua inglese.

    La mia proposta consiste nell'apertura di uno sportello unico per gli studenti internazionali, gestito in collaborazione con l'università e con le associazioni locali. Lo sportello potrebbe offrire assistenza per la ricerca della casa, informazioni sui trasporti e un programma di attività culturali. Inoltre, qualora il Comune lo ritenesse utile, gli studenti stessi potrebbero partecipare come volontari, purché ricevano una breve formazione.

    In conclusione, sono convinta che un piccolo investimento potrebbe produrre grandi benefici, sia per gli studenti sia per l'economia della città. Restando a disposizione per qualsiasi informazione, Le porgo i miei più cordiali saluti.

    Hannah Becker
  checklist:
    - "I used a formal opening and closing (Egregio Signor Sindaco… Le porgo i miei più cordiali saluti) and Lei forms with capital letters."
    - "I used at least one participio assoluto or implicit clause (Tornata in Germania…, Restando a disposizione…)."
    - "I used a conditional conjunction with the congiuntivo (qualora il Comune lo ritenesse utile, purché ricevano)."
    - "I organised the letter with formal discourse markers (in primo luogo, ciononostante, inoltre, in conclusione)."
    - "I used nominal style where appropriate (l'apertura di uno sportello, la ricerca di una casa)."
    - "I kept a consistent formal register, without colloquial expressions."
