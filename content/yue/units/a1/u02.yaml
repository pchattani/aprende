    es: "你喺機場嗎？"
    min: 8
    max: 25
    use: [w.hai2, w.m4, w.uk1-kei2, w.gei1-coeng4, w.ji4-gaa1]
    useAtLeast: 3
    grammar: [g.hai2-location, g.m-negation, g.maa-questions]
    expect:
      - { pattern: "唔喺", hint: "Say you're not there: 唔喺 / 我唔喺機場." }
      - { pattern: "喺屋企", hint: "Say where you are: 我喺屋企." }
    model: { es: "唔喺呀。我而家喺屋企，唔喺機場。", en: "No. I'm at home now, not at the airport." }
  - task: "Write two yes/no questions with 嗎 for a new friend: ask if they live in Central and if they are a student."
