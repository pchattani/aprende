id: c2.u03
title: Literatura III - siglos XIX y XX
lessons:
  - id: c2.u03.l1
    title: Galdós y Clarín, la novela realista
    teach: [g.realism-language]
    vocab: [w.realista, w.naturalismo, w.naturalista, w.costumbrismo, w.novelista, w.estilo-indirecto-libre, w.pensamiento, w.burgues, w.burguesia, w.aristocracia, w.clero, w.canonigo, w.devoto, w.provincia, w.folletin, w.episodio, w.retrato, w.retratar, w.describir, w.descripcion, w.minucioso, w.misericordia, w.arruinado, w.controlar, w.chisme, w.hipocresia, w.drama]
    tip: "Realism keys: an all-seeing but ironic narrator, minute description of city and customs, popular speech reproduced faithfully, and free indirect style (the character's thoughts in the narrator's voice)."
    sentences:
      - { es: "«La heroica ciudad dormía la siesta»: con esta frase irónica empieza «La Regenta», de Clarín.", en: "'The heroic city was taking its siesta': with this ironic sentence begins 'La Regenta', by Clarín.", grammar: [g.realism-language, g.imperfect], vocab: [w.heroico, w.siesta, w.ironico, w.frase] }
      - { es: "Galdós retrata el Madrid del siglo XIX con una descripción minuciosa de calles, tiendas y cafés.", en: "Galdós portrays nineteenth-century Madrid with a meticulous description of streets, shops and cafés.", grammar: [g.realism-language], vocab: [w.retratar, w.descripcion, w.minucioso, w.siglo] }
      - { es: "En «Fortunata y Jacinta», la burguesía y el pueblo se cruzan en la misma escalera.", en: "In 'Fortunata y Jacinta', the bourgeoisie and the common people cross paths on the same staircase.", grammar: [g.realism-language, g.reflexive-verbs-present], vocab: [w.burguesia, w.pueblo, w.escalera, w.cruzar] }
      - { es: "El narrador realista lo ve todo, pero a veces finge no saber: «ahora que a nadie le importa…».", en: "The realist narrator sees everything, but sometimes pretends not to know: 'now that nobody cares…'.", grammar: [g.realism-language, g.indirect-object-pronouns], vocab: [w.narrador, w.realista, w.fingir, w.importar] }
      - { es: "El estilo indirecto libre mezcla la voz del narrador con los pensamientos del personaje sin decir «pensó que».", en: "Free indirect style blends the narrator's voice with the character's thoughts without saying 'he thought that'.", grammar: [g.realism-language, g.reported-speech-past], vocab: [w.estilo-indirecto-libre, w.narrador, w.personaje] }
      - { es: "Las novelas se publicaban por entregas en los periódicos, como las series de hoy: eso era el folletín.", en: "Novels were published in instalments in the newspapers, like today's series: that was the folletín.", altEn: ["Novels came out in instalments in the newspapers, like today's series: that was the serial novel."], grammar: [g.realism-language, g.se-passive, g.imperfect], vocab: [w.entrega, w.folletin, w.periodico, w.serie, w.publicar] }
      - { es: "Vetusta es Oviedo: una capital de provincia donde el clero y la aristocracia lo controlan todo.", en: "Vetusta is Oviedo: a provincial capital where the clergy and the aristocracy control everything.", grammar: [g.realism-language, g.relative-donde-cuyo], vocab: [w.provincia, w.clero, w.aristocracia, w.capital] }
      - { es: "Ana Ozores, la Regenta, está casada con un hombre mayor y aburrido; el canónigo y el don Juan local la rodean.", en: "Ana Ozores, the Regenta, is married to an older, boring man; the canon and the local Don Juan circle around her.", grammar: [g.realism-language, g.ser-estar-advanced], vocab: [w.canonigo, w.casado, w.aburrido, w.rodear] }
      - { es: "Doña Perfecta era muy devota, y precisamente por eso fue cruel con su sobrino.", en: "Doña Perfecta was very devout, and precisely for that reason she was cruel to her nephew.", altEs: ["Doña Perfecta era muy devota, y justamente por eso fue cruel con su sobrino."], grammar: [g.realism-language, g.preterite-vs-imperfect], vocab: [w.devoto, w.sobrino, w.precisamente] }
      - { es: "En «Misericordia», Benina, una criada, pide limosna para mantener a la señora arruinada a la que sirve.", en: "In 'Misericordia', Benina, a maid, begs for alms to support the ruined lady she serves.", grammar: [g.realism-language, g.subjunctive-purpose, g.relative-que-quien], vocab: [w.misericordia, w.criado, w.limosna, w.mantener, w.servir] }
      - { es: "El naturalismo llegó a España con Pardo Bazán y Clarín: herencia, ambiente y detalle casi científico.", en: "Naturalism reached Spain with Pardo Bazán and Clarín: heredity, environment and almost scientific detail.", grammar: [g.realism-language, g.preterite-regular], vocab: [w.naturalismo, w.naturalista, w.herencia, w.detalle, w.cientifico] }
      - { es: "«¡Vaya usté con Dios!», dice un personaje popular de Galdós: el novelista imita el habla de la calle.", en: "'Go with God, sir!' says one of Galdós's popular characters: the novelist imitates the speech of the street.", grammar: [g.realism-language, g.sociolects], vocab: [w.personaje, w.novelista, w.imitar, w.popular] }
      - { es: "Los «Episodios nacionales» cuentan un siglo de historia de España en cuarenta y seis novelas.", en: "The 'Episodios nacionales' tell a century of Spanish history in forty-six novels.", grammar: [g.realism-language, g.numbers-1-100], vocab: [w.episodio, w.historia, w.novela, w.contar] }
      - { es: "Clarín describe Vetusta con ironía.", en: "Clarín describes Vetusta with irony.", altEs: ["Clarín describe Vetusta irónicamente."], grammar: [g.realism-language, g.nominalization], vocab: [w.describir, w.ironia], error: { wrong: "Clarín describe Vetusta con irónico.", explain: "After con you need the noun ironía; irónico is the adjective (un tono irónico).", grammar: g.nominalization } }
      - { es: "Ana pensó: «Nunca saldré de esta ciudad».", en: "Ana thought: 'I will never get out of this city'.", altEs: ["Ana pensó: «Jamás saldré de esta ciudad»."], grammar: [g.realism-language, g.reported-speech-past], vocab: [w.estilo-indirecto-libre, w.pensar, w.salir], transform: { instruction: "Rewrite as free indirect style (third person, conditional, no «pensó que»)", answer: "Nunca saldría de aquella ciudad.", alt: ["Ana nunca saldría de aquella ciudad.", "Nunca saldría de esa ciudad."] } }
      - { es: "El costumbrismo pinta tipos y escenas populares: la verbena, la tertulia del café, el mercado al amanecer.", en: "Costumbrismo paints popular types and scenes: the street fair, the café gathering, the market at dawn.", grammar: [g.realism-language], vocab: [w.costumbrismo, w.escena, w.popular, w.mercado] }
    exchanges:
      - q: { es: "¿Por qué dice Clarín que la ciudad es «heroica»?", en: "Why does Clarín say the city is 'heroic'?" }
        a: { es: "Por ironía: Vetusta es todo lo contrario, una ciudad dormida y llena de chismes.", en: "Out of irony: Vetusta is quite the opposite, a sleepy city full of gossip." }
        alt: ["Es irónico: la ciudad no tiene nada de heroica.", "Por ironía."]
        grammar: [g.realism-language]
        vocab: [w.ironia, w.heroico, w.contrario]
      - q: { es: "¿Qué es un folletín?", en: "What is a folletín?" }
        a: { es: "Una novela publicada por entregas en un periódico, con mucho drama y mucha intriga.", en: "A novel published in instalments in a newspaper, with lots of drama and intrigue." }
        alt: ["Una novela por entregas.", "Una novela publicada por entregas."]
        grammar: [g.realism-language]
        vocab: [w.folletin, w.entrega, w.novela]
      - q: { es: "¿Galdós escribía sobre ricos o sobre pobres?", en: "Did Galdós write about the rich or the poor?" }
        a: { es: "Sobre todos: en sus novelas la burguesía, los criados y los mendigos comparten las mismas calles.", en: "About everyone: in his novels the bourgeoisie, servants and beggars share the same streets." }
        alt: ["Sobre todas las clases sociales.", "Sobre todos."]
        grammar: [g.realism-language, g.imperfect]
        vocab: [w.burguesia, w.criado, w.mendigo, w.compartir]
      - q: { es: "¿Qué es el estilo indirecto libre?", en: "What is free indirect style?" }
        a: { es: "Los pensamientos del personaje contados por el narrador, sin verbo introductorio.", en: "The character's thoughts told by the narrator, without an introductory verb." }
        alt: ["La voz del personaje dentro de la del narrador.", "Los pensamientos del personaje en la voz del narrador."]
        grammar: [g.realism-language]
        vocab: [w.estilo-indirecto-libre, w.narrador]
    texts:
      - title: "Contraportada"
        es: ["Vetusta duerme la siesta, pero no descansa.", "Ana Ozores busca algo que ni su marido ni la ciudad pueden darle.", "Una novela sobre el deseo, la hipocresía y la vida de provincias."]
        en: ["Vetusta takes its siesta, but it does not rest.", "Ana Ozores is looking for something that neither her husband nor the city can give her.", "A novel about desire, hypocrisy and provincial life."]
        grammar: [g.realism-language, g.tambien-tampoco]
        vocab: [w.siesta, w.provincia, w.deseo]
      - title: "Nota del editor, 1887"
        es: ["La presente novela se publicará por entregas semanales.", "El autor retrata con fidelidad las costumbres de la capital.", "Rogamos a los lectores paciencia hasta el próximo número."]
        en: ["The present novel will be published in weekly instalments.", "The author portrays the customs of the capital faithfully.", "We ask readers for patience until the next issue."]
        grammar: [g.realism-language, g.se-passive, g.future-simple]
        vocab: [w.entrega, w.retratar, w.costumbre, w.lector]
  - id: c2.u03.l2
    title: Unamuno, Valle-Inclán y Pardo Bazán
    teach: [g.realism-language]
    vocab: [w.nivola, w.esperpento, w.grotesco, w.deformar, w.metaficcion, w.paradoja, w.intrahistoria, w.filosofico, w.filosofia, w.existencia, w.inmortalidad, w.inmortal, w.fe, w.martir, w.santo, w.cobarde, w.pazo, w.gallego, w.espejo, w.concavo, w.callejon, w.criatura, w.creador, w.rebelarse, w.agonia, w.tragico, w.arma, w.corriente, w.hundirse, w.clasificar, w.matar, w.alba, w.obsesionar, w.bohemia]
    tip: "Unamuno: nivola, paradox, metafiction, intrahistoria. Valle-Inclán: esperpento, the concave mirrors that deform reality. Pardo Bazán: naturalism and the Galician pazo."
    sentences:
      - { es: "Unamuno llamó «nivolas» a sus novelas para no tener que obedecer las reglas del género.", en: "Unamuno called his novels 'nivolas' so as not to have to obey the rules of the genre.", grammar: [g.realism-language, g.purpose-clauses-advanced], vocab: [w.nivola, w.novela, w.genero, w.regla, w.obedecer] }
      - { es: "En «Niebla», Augusto Pérez visita a su autor y le discute su propia muerte: eso es metaficción.", en: "In 'Niebla', Augusto Pérez visits his author and argues with him about his own death: that is metafiction.", grammar: [g.realism-language, g.a-personal], vocab: [w.metaficcion, w.autor, w.muerte, w.discutir] }
      - { es: "La paradoja es el arma favorita de Unamuno: creer para dudar y dudar para creer.", en: "Paradox is Unamuno's favourite weapon: believing in order to doubt and doubting in order to believe.", grammar: [g.realism-language, g.subjunctive-purpose], vocab: [w.paradoja, w.creer, w.dudar] }
      - { es: "San Manuel Bueno es un cura que ha perdido la fe y, sin embargo, la defiende en su aldea para que la gente viva en paz.", en: "San Manuel Bueno is a priest who has lost his faith and nevertheless defends it in his village so that people may live in peace.", grammar: [g.realism-language, g.subjunctive-purpose, g.connectors-contrast], vocab: [w.fe, w.cura, w.aldea, w.paz, w.defender] }
      - { es: "La intrahistoria es la vida silenciosa de la gente corriente, la que no aparece en los libros de historia.", en: "Intrahistoria is the silent life of ordinary people, the one that does not appear in history books.", grammar: [g.realism-language, g.relative-que-quien], vocab: [w.intrahistoria, w.silencioso, w.historia] }
      - { es: "Unamuno inventaba palabras («nivola», «intrahistoria») porque las existentes no le bastaban: es un maestro del neologismo.", en: "Unamuno invented words ('nivola', 'intrahistoria') because the existing ones were not enough for him: he is a master of the neologism.", grammar: [g.realism-language, g.imperfect], vocab: [w.neologismo, w.inventar, w.bastar, w.maestro] }
      - { es: "El esperpento de Valle-Inclán deforma la realidad como los espejos cóncavos del callejón del Gato.", en: "Valle-Inclán's esperpento deforms reality like the concave mirrors of the Callejón del Gato.", grammar: [g.realism-language, g.comparatives], vocab: [w.esperpento, w.deformar, w.espejo, w.concavo, w.realidad] }
      - { es: "«Luces de bohemia» es grotesca y trágica a la vez: Max Estrella, poeta ciego, muere en la calle una noche de invierno.", en: "'Luces de bohemia' is grotesque and tragic at the same time: Max Estrella, a blind poet, dies in the street one winter night.", grammar: [g.realism-language, g.ser-estar-advanced], vocab: [w.grotesco, w.tragico, w.poeta, w.ciego, w.invierno] }
      - { es: "Pardo Bazán describe en «Los pazos de Ulloa» la Galicia rural: un pazo que se hunde, un señor débil y un criado que manda.", en: "In 'Los pazos de Ulloa' Pardo Bazán describes rural Galicia: a decaying manor, a weak lord and a servant who gives the orders.", grammar: [g.realism-language, g.relative-que-quien], vocab: [w.pazo, w.gallego, w.rural, w.criado, w.debil] }
      - { es: "Fue la primera mujer que pidió entrar en la Academia; se lo negaron tres veces.", en: "She was the first woman to ask to join the Academy; they refused her three times.", altEs: ["Fue la primera mujer que solicitó entrar en la Academia; se lo negaron tres veces."], grammar: [g.realism-language, g.double-object-pronouns, g.preterite-irregular], vocab: [w.academia, w.negar, w.mujer] }
      - { es: "Unamuno sentía agonía ante la muerte y deseaba la inmortalidad, no del alma solamente, sino del cuerpo entero.", en: "Unamuno felt anguish in the face of death and longed for immortality, not of the soul alone but of the whole body.", grammar: [g.realism-language, g.imperfect, g.connectors-contrast], vocab: [w.agonia, w.inmortalidad, w.alma, w.cuerpo, w.desear] }
      - { es: "Sus personajes se rebelan contra él: la criatura discute con su creador y a veces gana.", en: "His characters rebel against him: the creature argues with its creator and sometimes wins.", grammar: [g.realism-language, g.reflexive-verbs-present], vocab: [w.rebelarse, w.criatura, w.personaje] }
      - { es: "Augusto le pidió a Unamuno que no lo matara.", en: "Augusto asked Unamuno not to kill him.", altEs: ["Augusto le pidió a Unamuno que no lo matase.", "Augusto le pidió a Unamuno que no le matara."], grammar: [g.realism-language, g.reported-commands], vocab: [w.pedir], error: { wrong: "Augusto le pidió a Unamuno que no lo mate.", explain: "After a past verb of request (pidió), the subordinate verb takes the imperfect subjunctive: matara.", grammar: g.reported-commands } }
      - { es: "Unamuno escribió novelas filosóficas.", en: "Unamuno wrote philosophical novels.", altEs: ["Unamuno escribía novelas filosóficas."], grammar: [g.realism-language, g.nominalization], vocab: [w.filosofia, w.filosofico, w.novela], transform: { instruction: "Replace the adjective with a noun phrase using «de»", answer: "Unamuno escribió novelas de filosofía.", alt: ["Unamuno escribió novelas sobre filosofía."] } }
      - { es: "¿Mártir o cobarde? San Manuel calla su duda por amor a los suyos; el lector decide.", en: "Martyr or coward? San Manuel keeps his doubt quiet out of love for his people; the reader decides.", grammar: [g.realism-language], vocab: [w.martir, w.duda, w.lector, w.amor] }
      - { es: "La existencia, para Unamuno, es una lucha: «mi religión es luchar con Dios desde el romper del alba hasta el caer de la noche».", en: "Existence, for Unamuno, is a struggle: 'my religion is to wrestle with God from the break of dawn to the fall of night'.", grammar: [g.realism-language, g.nominalization], vocab: [w.existencia, w.luchar, w.religion] }
    exchanges:
      - q: { es: "¿Qué es una nivola?", en: "What is a nivola?" }
        a: { es: "Así llamaba Unamuno a sus novelas: historias sin descripciones, hechas de diálogo y de ideas.", en: "That is what Unamuno called his novels: stories without descriptions, made of dialogue and ideas." }
        alt: ["Una novela a la manera de Unamuno.", "Así llamaba Unamuno a sus novelas."]
        grammar: [g.realism-language, g.imperfect]
        vocab: [w.nivola, w.descripcion, w.dialogo]
      - q: { es: "¿De qué va «Niebla»?", en: "What is 'Niebla' about?" }
        a: { es: "De un hombre, Augusto Pérez, que descubre que es un personaje y va a Salamanca a discutir con su autor.", en: "About a man, Augusto Pérez, who discovers he is a character and goes to Salamanca to argue with his author." }
        alt: ["De un personaje que discute con su autor.", "De un hombre que descubre que es un personaje de novela."]
        grammar: [g.realism-language, g.relative-que-quien]
        vocab: [w.personaje, w.autor, w.descubrir]
      - q: { es: "¿Qué es un esperpento?", en: "What is an esperpento?" }
        a: { es: "Una deformación grotesca de la realidad, como la que producen los espejos cóncavos.", en: "A grotesque deformation of reality, like the one produced by concave mirrors." }
        alt: ["Una visión grotesca de la realidad.", "Una deformación grotesca de la realidad."]
        grammar: [g.realism-language]
        vocab: [w.esperpento, w.grotesco, w.espejo, w.concavo]
      - q: { es: "¿Por qué no entró Pardo Bazán en la Academia?", en: "Why did Pardo Bazán not get into the Academy?" }
        a: { es: "Porque era mujer; se lo negaron a pesar de su prestigio.", en: "Because she was a woman; they refused her despite her prestige." }
        alt: ["Porque era mujer.", "Por ser mujer, a pesar de su prestigio."]
        grammar: [g.realism-language, g.a-pesar-de]
        vocab: [w.academia, w.prestigio, w.negar]
    texts:
      - title: "Apunte para el examen"
        es: ["Unamuno: nivola, paradoja, metaficción, intrahistoria.", "Valle-Inclán: esperpento, espejos cóncavos, lo grotesco.", "Pardo Bazán: naturalismo, Galicia rural, los pazos."]
        en: ["Unamuno: nivola, paradox, metafiction, intrahistoria.", "Valle-Inclán: esperpento, concave mirrors, the grotesque.", "Pardo Bazán: naturalism, rural Galicia, the pazos."]
        grammar: [g.realism-language]
        vocab: [w.nivola, w.paradoja, w.esperpento, w.pazo]
      - title: "Cartel de una librería"
        es: ["Club de lectura de octubre: «San Manuel Bueno, mártir».", "¿Puede un cura sin fe ser un santo?", "Ven a discutirlo el jueves a las siete; la entrada es libre."]
        en: ["October reading club: 'San Manuel Bueno, mártir'.", "Can a priest without faith be a saint?", "Come and discuss it on Thursday at seven; admission is free."]
        grammar: [g.realism-language, g.imperative-tu]
        vocab: [w.martir, w.fe, w.cura]
  - id: c2.u03.l3
    title: Voces, tiempos y silencios del relato
    teach: [g.modern-literary-devices]
    vocab: [w.monologo-interior, w.perspectivismo, w.in-medias-res, w.fragmentacion, w.polifonia, w.intertextualidad, w.cronologico, w.simbolico, w.ficticio, w.cuentista, w.horror, w.terror, w.contradiccion, w.acelerar, w.morder, w.pisar, w.accion, w.hinchado]
    tip: "Narrative devices to name: in medias res, interior monologue, unreliable narrator, ellipsis, perspectivism, polyphony, fragmentation, intertextuality, symbol. Practice texts here come from Quiroga, Unamuno and Clarín, all public domain."
    sentences:
      - { es: "Quiroga empieza sus cuentos in medias res: en la primera línea, la serpiente ya ha mordido al hombre.", en: "Quiroga begins his stories in medias res: in the first line, the snake has already bitten the man.", grammar: [g.modern-literary-devices, g.present-perfect], vocab: [w.in-medias-res, w.cuento, w.cuentista, w.serpiente] }
      - { es: "El monólogo interior nos mete en la cabeza del personaje: pensamientos sin orden, frases sin terminar.", en: "Interior monologue puts us inside the character's head: thoughts without order, unfinished sentences.", grammar: [g.modern-literary-devices], vocab: [w.monologo-interior, w.personaje, w.frase] }
      - { es: "Un narrador no fiable cuenta la historia a su manera y el lector debe desconfiar de él.", en: "An unreliable narrator tells the story his own way and the reader must distrust him.", altEs: ["Un narrador no fiable cuenta la historia a su manera y el lector tiene que desconfiar de él."], grammar: [g.modern-literary-devices, g.deber-tener-que], vocab: [w.narrador, w.fiable, w.lector, w.desconfiar] }
      - { es: "La elipsis salta años en una línea: «Pasaron diez inviernos».", en: "Ellipsis skips years in a single line: 'Ten winters went by'.", altEs: ["La elipsis se salta años en una línea: «Pasaron diez inviernos»."], grammar: [g.modern-literary-devices, g.preterite-regular], vocab: [w.elipsis, w.saltar, w.invierno] }
      - { es: "El perspectivismo ofrece la misma escena desde varios puntos de vista, y ninguno tiene toda la verdad.", en: "Perspectivism offers the same scene from several points of view, and none of them holds the whole truth.", grammar: [g.modern-literary-devices, g.indefinite-pronouns], vocab: [w.perspectivismo, w.punto-de-vista, w.escena, w.verdad] }
      - { es: "La polifonía mezcla voces: cartas, diálogos, periódicos y canciones dentro de una misma novela.", en: "Polyphony mixes voices: letters, dialogues, newspapers and songs within a single novel.", grammar: [g.modern-literary-devices], vocab: [w.polifonia, w.voz, w.carta, w.cancion] }
      - { es: "La fragmentación rompe el orden cronológico: el final puede contarse antes que el principio.", en: "Fragmentation breaks the chronological order: the end can be told before the beginning.", grammar: [g.modern-literary-devices, g.se-passive], vocab: [w.fragmentacion, w.cronologico, w.orden, w.principio] }
      - { es: "Cuando una novela cita o imita otra, hablamos de intertextualidad: el Quijote ya lo hacía con los libros de caballerías.", en: "When a novel quotes or imitates another, we speak of intertextuality: Don Quixote was already doing it with the books of chivalry.", grammar: [g.modern-literary-devices, g.imperfect], vocab: [w.intertextualidad, w.citar, w.imitar, w.caballeria] }
      - { es: "Los cuentos de Quiroga crean suspense con detalles pequeños: un ruido, un calor extraño, una mano que no responde.", en: "Quiroga's stories build suspense with small details: a noise, a strange heat, a hand that does not respond.", grammar: [g.modern-literary-devices, g.relative-que-quien], vocab: [w.suspense, w.detalle, w.ruido, w.calor] }
      - { es: "El símbolo dice sin decir: en Quiroga, la selva es la muerte que espera.", en: "The symbol says without saying: in Quiroga, the jungle is death lying in wait.", grammar: [g.modern-literary-devices], vocab: [w.simbolo, w.simbolico, w.selva, w.muerte] }
      - { es: "Un relato verosímil no es un relato verdadero, sino uno que el lector acepta como posible.", en: "A plausible story is not a true story, but one that the reader accepts as possible.", grammar: [g.modern-literary-devices, g.connectors-contrast], vocab: [w.verosimil, w.relato, w.lector, w.verdadero] }
      - { es: "Planteamiento, nudo y desenlace: la estructura clásica que los autores del siglo XX empezaron a romper.", en: "Setup, development and resolution: the classic structure that twentieth-century authors began to break.", grammar: [g.modern-literary-devices, g.verbal-periphrases], vocab: [w.planteamiento, w.nudo, w.desenlace, w.estructura, w.clasico] }
      - { es: "Los personajes de ficción son ficticios, pero el horror que sentimos al leer es real.", en: "Fictional characters are fictitious, but the horror we feel when reading is real.", grammar: [g.modern-literary-devices, g.connectors-contrast], vocab: [w.ficcion, w.ficticio, w.horror] }
      - { es: "Si el narrador no fuera fiable, dudaríamos de todo lo que cuenta.", en: "If the narrator were not reliable, we would doubt everything he tells.", altEs: ["Si el narrador no fuese fiable, dudaríamos de todo lo que cuenta."], grammar: [g.modern-literary-devices, g.si-clauses-unreal], vocab: [w.narrador, w.fiable, w.dudar], error: { wrong: "Si el narrador no sería fiable, dudaríamos de todo lo que cuenta.", explain: "Unreal condition: si + imperfect subjunctive (fuera), never the conditional.", grammar: g.si-clauses-unreal } }
      - { es: "Primero el hombre pisó la serpiente; después sintió el dolor; al final murió en la canoa.", en: "First the man stepped on the snake; then he felt the pain; in the end he died in the canoe.", grammar: [g.modern-literary-devices, g.connectors-order], vocab: [w.in-medias-res, w.serpiente, w.canoa, w.morir], transform: { instruction: "Rewrite starting in medias res, with the death first", answer: "El hombre murió en la canoa; antes había pisado la serpiente y había sentido el dolor.", alt: ["El hombre murió en la canoa; antes había pisado una serpiente y sentido el dolor.", "El hombre murió en la canoa: había pisado la serpiente y había sentido el dolor."] } }
      - { es: "¿Quién habla aquí, el autor o el personaje? En la metaficción de Unamuno, los dos a la vez.", en: "Who is speaking here, the author or the character? In Unamuno's metafiction, both at once.", grammar: [g.modern-literary-devices, g.question-words], vocab: [w.metaficcion, w.autor, w.personaje] }
    exchanges:
      - q: { es: "¿Qué significa empezar in medias res?", en: "What does beginning in medias res mean?" }
        a: { es: "Empezar en mitad de la acción, sin presentar antes a los personajes.", en: "Beginning in the middle of the action, without introducing the characters first." }
        alt: ["Empezar en medio de la acción.", "Empezar por la mitad de la historia."]
        grammar: [g.modern-literary-devices]
        vocab: [w.in-medias-res, w.personaje]
      - q: { es: "¿Cómo sabemos que un narrador no es fiable?", en: "How do we know a narrator is unreliable?" }
        a: { es: "Por las contradicciones: lo que dice no coincide con lo que vemos.", en: "By the contradictions: what he says does not match what we see." }
        alt: ["Porque se contradice.", "Por sus contradicciones."]
        grammar: [g.modern-literary-devices, g.neutral-lo]
        vocab: [w.narrador, w.fiable, w.coincidir]
      - q: { es: "¿Para qué sirve la elipsis?", en: "What is ellipsis for?" }
        a: { es: "Para saltar lo que no importa y acelerar el relato.", en: "To skip what does not matter and speed up the story." }
        alt: ["Para saltar tiempo.", "Para saltar lo que no importa."]
        grammar: [g.modern-literary-devices, g.purpose-clauses-advanced]
        vocab: [w.elipsis, w.saltar, w.relato]
      - q: { es: "¿Es Quiroga un autor de terror?", en: "Is Quiroga a horror writer?" }
        a: { es: "Más bien de horror y de selva: sus cuentos dan miedo porque son verosímiles.", en: "More of horror and jungle: his stories are frightening because they are plausible." }
        alt: ["Más de horror que de terror.", "Sí, pero un terror verosímil."]
        grammar: [g.modern-literary-devices]
        vocab: [w.horror, w.selva, w.verosimil, w.cuentista]
    texts:
      - title: "Reseña en una revista"
        es: ["Un cuento de diez páginas que se lee en cinco minutos y se recuerda toda la vida.", "Quiroga no explica nada: muestra el calor, la canoa, la mano hinchada.", "El desenlace llega cuando el lector ya lo sabe, y aun así duele."]
        en: ["A ten-page story that is read in five minutes and remembered for a lifetime.", "Quiroga explains nothing: he shows the heat, the canoe, the swollen hand.", "The ending comes when the reader already knows it, and even so it hurts."]
        grammar: [g.modern-literary-devices, g.se-passive]
        vocab: [w.cuento, w.desenlace, w.lector, w.canoa]
      - title: "Mensaje del club de lectura"
        es: ["Para el martes leemos «El hijo», de Horacio Quiroga.", "Fijaos en el punto de vista: ¿quién ve y quién cuenta?", "Traed ejemplos de elipsis y de suspense."]
        en: ["For Tuesday we are reading 'El hijo', by Horacio Quiroga.", "Pay attention to the point of view: who sees and who tells?", "Bring examples of ellipsis and suspense."]
        grammar: [g.modern-literary-devices, g.imperative-vosotros]
        vocab: [w.punto-de-vista, w.elipsis, w.suspense, w.ejemplo]
  - id: c2.u03.l4
    title: Bécquer, Darío y Machado
    teach: [g.modern-literary-devices]
    vocab: [w.romantico, w.modernista, w.intimo, w.sinestesia, w.musicalidad, w.tumba, w.senda, w.estela, w.olvido, w.desengaño, w.amoroso, w.evocar, w.piedra, w.tierra, w.tristeza, w.lejano, w.de-antemano, w.natal, w.sequedad, w.desnudo]
    tip: "Three poets, three tones: Bécquer's intimate Romanticism (swallows, the harp), Darío's musical modernismo (swans, alexandrines, 'Lo fatal') and Machado's bare Castile (the path made by walking)."
    sentences:
      - { es: "«Volverán las oscuras golondrinas en tu balcón sus nidos a colgar»: Bécquer habla del amor que no vuelve.", en: "'The dark swallows will return to hang their nests on your balcony': Bécquer speaks of the love that does not return.", grammar: [g.modern-literary-devices, g.future-simple, g.poetic-syntax], vocab: [w.golondrina, w.nido, w.balcon, w.colgar, w.amor] }
      - { es: "El romanticismo de Bécquer es íntimo y melancólico, muy lejos de los gritos de otros románticos.", en: "Bécquer's Romanticism is intimate and melancholy, very far from the cries of other Romantics.", altEs: ["El romanticismo de Bécquer es íntimo y melancólico, muy alejado de los gritos de otros románticos."], grammar: [g.modern-literary-devices], vocab: [w.romanticismo, w.romantico, w.melancolico] }
      - { es: "El modernismo de Rubén Darío trae cisnes, princesas y una musicalidad nueva al verso español.", en: "Rubén Darío's modernismo brings swans, princesses and a new musicality to Spanish verse.", grammar: [g.modern-literary-devices], vocab: [w.modernismo, w.modernista, w.cisne, w.princesa, w.verso] }
      - { es: "«Dichoso el árbol, que es apenas sensitivo, y más la piedra dura porque esa ya no siente»: así empieza «Lo fatal».", en: "'Happy the tree, which is barely sentient, and more so the hard stone because it no longer feels': so begins 'Lo fatal'.", grammar: [g.modern-literary-devices, g.comparatives], vocab: [w.arbol, w.sentir, w.dichoso] }
      - { es: "La sinestesia mezcla los sentidos: «verso azul», «canción dorada», «dulce silencio».", en: "Synaesthesia mixes the senses: 'blue verse', 'golden song', 'sweet silence'.", grammar: [g.modern-literary-devices], vocab: [w.sinestesia, w.sentido, w.azul, w.dulce, w.silencio] }
      - { es: "Machado evoca Castilla con pocas palabras: encinas, caminos de polvo, tardes de sol.", en: "Machado evokes Castile with few words: holm oaks, dusty roads, sunny afternoons.", altEs: ["Machado evoca Castilla con muy pocas palabras: encinas, caminos de polvo, tardes de sol."], grammar: [g.modern-literary-devices], vocab: [w.evocar, w.encina, w.camino, w.polvo] }
      - { es: "«Caminante, no hay camino, se hace camino al andar»: la senda se crea pisándola.", en: "'Wayfarer, there is no path, the path is made by walking': the track is created by treading it.", grammar: [g.modern-literary-devices, g.se-impersonal], vocab: [w.caminante, w.camino, w.senda] }
      - { es: "«Y al volver la vista atrás se ve la senda que nunca se ha de volver a pisar».", en: "'And on looking back one sees the track that will never be trodden again.'", grammar: [g.modern-literary-devices, g.se-impersonal, g.volver-a], vocab: [w.senda, w.haber-de, w.volver-a] }
      - { es: "Para Machado, el pasado deja estelas en la mar, no caminos: nada se repite.", en: "For Machado, the past leaves wakes in the sea, not paths: nothing is repeated.", grammar: [g.modern-literary-devices, g.se-passive], vocab: [w.estela, w.mar, w.repetir, w.pasado] }
      - { es: "Darío siente pesadumbre por «ser y no saber nada, y ser sin rumbo cierto».", en: "Darío feels sorrow at 'being and knowing nothing, and being without a sure course'.", grammar: [g.modern-literary-devices, g.nominalization], vocab: [w.pesadumbre, w.rumbo, w.cierto, w.saber] }
      - { es: "La tumba que aguarda y la carne que tienta: en «Lo fatal» la muerte y la vida tiran del poeta a la vez.", en: "The grave that waits and the flesh that tempts: in 'Lo fatal' death and life pull at the poet at the same time.", grammar: [g.modern-literary-devices, g.relative-que-quien], vocab: [w.tumba, w.carne, w.poeta, w.muerte] }
      - { es: "El desengaño amoroso llena las «Rimas»: «hoy la tierra y los cielos me sonríen», pero mañana, el olvido.", en: "Disillusionment in love fills the 'Rimas': 'today the earth and the heavens smile at me', but tomorrow, oblivion.", grammar: [g.modern-literary-devices, g.connectors-contrast], vocab: [w.desengaño, w.olvido, w.rima, w.sonreir, w.cielo] }
      - { es: "La tristeza de Machado no grita: «mi infancia son recuerdos de un patio de Sevilla».", en: "Machado's sadness does not shout: 'my childhood is memories of a courtyard in Seville'.", grammar: [g.modern-literary-devices], vocab: [w.tristeza, w.infancia, w.recuerdo, w.patio] }
      - { es: "Volverán las golondrinas, pero aquellas que aprendieron nuestros nombres, esas no volverán.", en: "The swallows will return, but those that learned our names, those will not return.", grammar: [g.modern-literary-devices, g.future-simple], vocab: [w.golondrina, w.volver, w.aprender], error: { wrong: "Volverán las golondrinas, pero aquellas que aprendieron nuestros nombres, esas no volvarán.", explain: "The future of volver is volverán (regular stem volver-); volvarán does not exist.", grammar: g.future-simple } }
      - { es: "Hacemos el camino cuando andamos.", en: "We make the path when we walk.", altEs: ["Hacemos el camino al andar."], grammar: [g.modern-literary-devices, g.se-impersonal], vocab: [w.camino, w.andar], transform: { instruction: "Rewrite with impersonal se, as Machado does", answer: "Se hace camino al andar.", alt: ["Se hace el camino al andar."] } }
      - { es: "¿Qué es poesía? «Poesía… eres tú», responde Bécquer a la mujer que le pregunta.", en: "What is poetry? 'Poetry… is you', Bécquer replies to the woman who asks him.", grammar: [g.modern-literary-devices, g.question-words], vocab: [w.poesia, w.responder, w.preguntar] }
    exchanges:
      - q: { es: "¿Qué representan las golondrinas en Bécquer?", en: "What do the swallows represent in Bécquer?" }
        a: { es: "El tiempo que pasa y el amor que, a diferencia de ellas, no vuelve.", en: "Passing time and the love that, unlike them, does not return." }
        alt: ["El amor que no vuelve.", "El paso del tiempo y el amor perdido."]
        grammar: [g.modern-literary-devices]
        vocab: [w.golondrina, w.representar, w.amor]
      - q: { es: "¿Qué aporta el modernismo?", en: "What does modernismo bring?" }
        a: { es: "Música, color y lugares lejanos: cisnes, princesas, versos alejandrinos.", en: "Music, colour and faraway places: swans, princesses, alexandrine lines." }
        alt: ["Musicalidad y nuevas imágenes.", "Música, color y versos nuevos."]
        grammar: [g.modern-literary-devices]
        vocab: [w.modernismo, w.cisne, w.alejandrino]
      - q: { es: "¿Qué quiere decir «se hace camino al andar»?", en: "What does 'se hace camino al andar' mean?" }
        a: { es: "Que la vida no está hecha de antemano: la construimos paso a paso.", en: "That life is not laid out beforehand: we build it step by step." }
        alt: ["Que el camino lo hacemos nosotros al vivir.", "Que la vida se construye paso a paso."]
        grammar: [g.modern-literary-devices, g.se-impersonal]
        vocab: [w.camino, w.construir, w.vida]
      - q: { es: "¿Por qué es «fatal» el poema de Darío?", en: "Why is Darío's poem 'fatal'?" }
        a: { es: "Porque habla del destino inevitable: vivir sabiendo que vamos a morir.", en: "Because it speaks of inevitable fate: living while knowing that we are going to die." }
        alt: ["Porque habla del destino y de la muerte.", "Porque trata del destino inevitable."]
        grammar: [g.modern-literary-devices]
        vocab: [w.destino, w.inevitable, w.morir]
    texts:
      - title: "Pie de foto"
        es: ["Sevilla, patio de la casa natal de Bécquer.", "Aquí pasó una infancia que después convirtió en versos.", "Las golondrinas siguen volviendo cada primavera."]
        en: ["Seville, courtyard of the house where Bécquer was born.", "Here he spent a childhood that he later turned into verse.", "The swallows keep coming back every spring."]
        grammar: [g.modern-literary-devices, g.periphrases-aspect]
        vocab: [w.patio, w.infancia, w.verso, w.golondrina]
      - title: "Entrada de un blog"
        es: ["He vuelto a leer «Lo fatal» y me ha dado el mismo escalofrío que a los dieciséis.", "Darío no consuela: pregunta.", "¿Hay un poema más honesto sobre el miedo a la muerte?"]
        en: ["I have reread 'Lo fatal' and it gave me the same shiver as at sixteen.", "Darío does not console: he asks.", "Is there a more honest poem about the fear of death?"]
        grammar: [g.modern-literary-devices, g.volver-a]
        vocab: [w.poema, w.miedo, w.muerte, w.honesto]
dialogues:
  - id: c2.u03.d1
    title: Club de lectura
    context: Marta and Óscar, members of a reading club, discuss Unamuno's Niebla and a poem by Machado over coffee.
    lines:
      - { speaker: Marta, es: "Confieso que «Niebla» me ha desconcertado. ¿Un personaje que viaja a Salamanca para pedirle a su autor que no lo mate?", en: "I confess 'Niebla' has thrown me. A character who travels to Salamanca to ask his author not to kill him?" }
      - { speaker: Óscar, es: "Eso es la metaficción: la novela habla de sí misma. Y fíjate en la paradoja: Unamuno le dice que él, el personaje, es más inmortal que su creador.", en: "That is metafiction: the novel talks about itself. And notice the paradox: Unamuno tells him that he, the character, is more immortal than his creator." }
      - { speaker: Marta, es: "Me pareció una broma, mas no lo es: a Unamuno le obsesionaba la muerte, y la nivola es su manera de pelear con ella.", en: "It seemed like a joke to me, but it isn't: Unamuno was obsessed with death, and the nivola is his way of fighting it." }
      - { speaker: Óscar, es: "¿Te has fijado en que casi no hay descripciones? Todo es diálogo y monólogo interior. Galdós habría llenado veinte páginas con la calle de Augusto.", en: "Did you notice there are almost no descriptions? Everything is dialogue and interior monologue. Galdós would have filled twenty pages with Augusto's street." }
      - { speaker: Marta, es: "Por eso lo llamó «nivola»: para que nadie le exigiera las reglas del realismo. Es casi un esperpento sin espejos.", en: "That is why he called it a 'nivola': so that nobody would demand the rules of realism from him. It's almost an esperpento without mirrors." }
      - { speaker: Óscar, es: "Oye, ¿y el poema de Machado para hoy? «Caminante, no hay camino». Lo he leído mil veces y sigue sin gastarse.", en: "Hey, and the Machado poem for today? 'Wayfarer, there is no path'. I've read it a thousand times and it still doesn't wear out." }
      - { speaker: Marta, es: "Es la repetición: «caminante», «camino», «andar». Y las estelas en la mar al final, que borran todo lo anterior.", en: "It's the repetition: 'caminante', 'camino', 'andar'. And the wakes in the sea at the end, which erase everything before." }
      - { speaker: Óscar, es: "Comparado con Darío, es casi desnudo: ni cisnes ni princesas, solo polvo y encinas.", en: "Compared with Darío, it's almost bare: no swans or princesses, just dust and holm oaks." }
      - { speaker: Marta, es: "Pues yo necesito las dos cosas: la música de Darío los lunes y la sequedad de Machado los viernes.", en: "Well, I need both: Darío's music on Mondays and Machado's dryness on Fridays." }
      - { speaker: Óscar, es: "Entonces para el mes que viene propongo a Quiroga, que no tiene ni música ni sequedad: tiene selva, y da miedo.", en: "Then for next month I propose Quiroga, who has neither music nor dryness: he has jungle, and he's frightening." }
    questions:
      - { q: "Why did Unamuno call Niebla a 'nivola', according to Marta?", options: ["Because it was written in verse", "So that nobody could demand the rules of realism from him", "Because it was published in instalments"], answer: 1 }
      - { q: "What does Óscar notice about the style of Niebla?", options: ["Long descriptions of Salamanca", "Almost no descriptions, mostly dialogue and interior monologue", "A chronological plot with many characters"], answer: 1 }
      - { q: "How does Óscar contrast Machado with Darío?", options: ["Machado is bare and dry; Darío is musical and ornate", "Machado writes about swans; Darío about Castile", "Both wrote only sonnets"], answer: 0 }
