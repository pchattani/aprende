id: c2.u08
title: Dominio nativo
lessons:
  - id: c2.u08.l1
    title: Sonar natural
    teach: [g.native-fluency-markers]
    vocab: [w.a-ver, w.bueno.interj, w.muletilla, w.coletilla, w.pausa, w.titubear, w.hilo, w.perder-el-hilo, w.divagar, w.deje, w.chapurrear, w.a-bote-pronto, w.tal-cual, w.pues-nada, w.hombre.interj, w.llover-a-mares, w.irse-por-las-ramas, w.la-pena, w.petarlo, w.inmenso]
    tip: "Natives pause between sentences, not inside them, and glue speech together with fillers (bueno, pues, o sea, es que, a ver, en plan) and tags (¿sabes?, ¿no?, ¿vale?). Use them, but don't drown in them."
    sentences:
      - { es: "Pues nada, o sea, al final no fuimos, ¿sabes? Es que llovía a mares.", en: "So, well, in the end we didn't go, you know? It was pouring.", altEs: ["Pues nada, al final no fuimos, ¿sabes? Es que llovía a mares."], grammar: [g.native-fluency-markers], vocab: [w.pues-nada, w.o-sea, w.es-que, w.llover-a-mares] }
      - { es: "A ver, mira, es que no me sale; lo intento otra vez.", en: "Let's see, look, the thing is I can't get it; I'll try again.", altEs: ["A ver, mira, es que no me sale; vuelvo a intentarlo."], altEn: ["Let's see, look, I just can't get it; I'll have another go."], grammar: [g.native-fluency-markers], vocab: [w.a-ver, w.es-que] }
      - { es: "Bueno, vamos, que tampoco fue para tanto.", en: "Well, I mean, it wasn't such a big deal either.", altEs: ["Bueno, vamos, que no fue para tanto."], grammar: [g.native-fluency-markers], vocab: [w.bueno.interj, w.vamos] }
      - { es: "Total, que nos quedamos en casa viendo la tele.", en: "So anyway, we stayed at home watching TV.", altEs: ["Total, que nos quedamos en casa viendo la televisión."], altEn: ["Long story short, we stayed home watching TV."], grammar: [g.native-fluency-markers], vocab: [w.total-que, w.tele] }
      - { es: "Hombre, claro que voy; ¿cómo no iba a ir?", en: "Of course I'm going, come on; how could I not go?", altEs: ["Hombre, pues claro que voy; ¿cómo no iba a ir?"], grammar: [g.native-fluency-markers], vocab: [w.hombre.interj] }
      - { es: "En plan, llegó, saludó y se fue, tal cual, sin dar explicaciones.", en: "Like, he arrived, said hello and left, just like that, without any explanation.", altEs: ["En plan, llegó, saludó y se marchó, tal cual, sin dar explicaciones."], grammar: [g.native-fluency-markers], vocab: [w.en-plan, w.tal-cual] }
      - { es: "No abuses de las muletillas: un «o sea» cada tres palabras cansa a cualquiera.", en: "Don't overuse fillers: an 'o sea' every three words wears anyone out.", altEs: ["No abuses de las muletillas: un «o sea» cada tres palabras acaba cansando a cualquiera."], grammar: [g.native-fluency-markers, g.imperative-negative], vocab: [w.muletilla, w.o-sea] }
      - { es: "¿Sabes? ¿No? ¿Vale? Las coletillas buscan que el otro diga que sí.", en: "You know? Right? Okay? Tag words seek a yes from the other person.", grammar: [g.native-fluency-markers], vocab: [w.coletilla] }
      - { es: "Perdí el hilo a mitad de la frase y tuve que empezar de nuevo.", en: "I lost the thread halfway through the sentence and had to start again.", altEs: ["Perdí el hilo a mitad de la frase y tuve que empezar otra vez."], altEn: ["I lost my thread halfway through the sentence and had to start over."], grammar: [g.native-fluency-markers], vocab: [w.perder-el-hilo, w.hilo] }
      - { es: "A bote pronto, te diría que sí, pero déjame pensarlo.", en: "Off the top of my head, I'd say yes, but let me think about it.", grammar: [g.native-fluency-markers, g.conditional-simple], vocab: [w.a-bote-pronto] }
      - { es: "Mi abuelo chapurrea el francés con un deje andaluz que encanta a los camareros de París.", en: "My grandfather speaks broken French with an Andalusian lilt that the waiters in Paris love.", grammar: [g.native-fluency-markers], vocab: [w.chapurrear, w.deje] }
      - { es: "Un nativo no titubea entre palabra y palabra; hace la pausa después de la frase.", en: "A native doesn't hesitate between one word and the next; he pauses after the sentence.", altEs: ["Un nativo no titubea entre una palabra y otra; hace la pausa al final de la frase."], grammar: [g.native-fluency-markers], vocab: [w.titubear, w.pausa, w.nativo] }
      - { es: "Deja de divagar y ve al grano: ¿vienes o no vienes?", en: "Stop rambling and get to the point: are you coming or not?", grammar: [g.native-fluency-markers, g.imperative-tu], vocab: [w.divagar, w.ir-al-grano] }
      - { es: "La peña flipó con el concierto: lo petaron, en plan, de verdad; el estadio era inmenso y estaba lleno.", en: "The crowd was blown away by the concert: they smashed it, like, for real; the stadium was immense and it was full.", grammar: [g.native-fluency-markers, g.sociolects], vocab: [w.la-pena, w.flipar, w.petarlo, w.en-plan, w.inmenso] }
      - { es: "Bueno, pues nada, me voy.", en: "Well, right then, I'm off.", grammar: [g.native-fluency-markers], vocab: [w.bueno.interj, w.pues-nada], error: { wrong: "Bien, pues nada, me voy.", explain: "As a discourse opener Spanish uses bueno, never bien; bien evaluates (está bien).", grammar: g.native-fluency-markers } }
      - { es: "No fuimos porque llovía mucho.", en: "We didn't go because it was raining a lot.", grammar: [g.native-fluency-markers], vocab: [w.llover], transform: { instruction: "Say it as a native would in casual speech, with fillers and the idiom llover a mares", answer: "Pues nada, al final no fuimos; es que llovía a mares.", alt: ["Pues es que llovía a mares, o sea, que no fuimos.", "Bueno, es que llovía a mares, así que no fuimos."] } }
    exchanges:
      - q: { es: "¿Y al final qué pasó con el piso?", en: "So what happened with the flat in the end?" }
        a: { es: "Pues nada, que no nos lo dieron, ¿sabes? Es que pedían tres meses de fianza.", en: "Well, nothing, they didn't give it to us, you know? The thing is they wanted three months' deposit." }
        alt: ["Nada, al final no nos lo dieron; pedían tres meses de fianza."]
        grammar: [g.native-fluency-markers]
        vocab: [w.pues-nada, w.es-que, w.fianza]
      - q: { es: "¿Vienes a la cena del sábado?", en: "Are you coming to dinner on Saturday?" }
        a: { es: "Hombre, claro; ¿a qué hora quedamos?", en: "Of course; what time shall we meet?" }
        alt: ["A ver, déjame mirar la agenda, pero en principio sí."]
        grammar: [g.native-fluency-markers]
        vocab: [w.hombre.interj, w.a-ver]
      - q: { es: "¿Cómo se nota que alguien no es nativo?", en: "How can you tell that someone isn't a native speaker?" }
        a: { es: "En las pausas: titubea a mitad de frase y busca la palabra en voz alta.", en: "In the pauses: he hesitates mid-sentence and searches for the word out loud." }
        alt: ["Por el ritmo: para donde un nativo no pararía."]
        grammar: [g.native-fluency-markers]
        vocab: [w.pausa, w.titubear]
      - q: { es: "¿Te gusta el nuevo jefe?", en: "Do you like the new boss?" }
        a: { es: "A bote pronto, sí: va al grano y no divaga en las reuniones.", en: "Off the top of my head, yes: he gets to the point and doesn't ramble in meetings." }
        alt: ["De momento sí; no se va por las ramas."]
        grammar: [g.native-fluency-markers]
        vocab: [w.a-bote-pronto, w.ir-al-grano, w.divagar, w.irse-por-las-ramas]
      - q: { es: "¿Entendiste la película en portugués?", en: "Did you understand the film in Portuguese?" }
        a: { es: "Más o menos; chapurreo algo y el resto lo saqué por el contexto.", en: "More or less; I speak a bit badly and the rest I got from the context." }
        alt: ["A medias: chapurreo algo de portugués."]
        grammar: [g.native-fluency-markers]
        vocab: [w.chapurrear, w.contexto]
    texts:
      - title: "Mensaje de voz"
        es: ["Oye, mira, es que no voy a llegar, ¿vale?", "O sea, que empecéis sin mí y luego ya os cuento.", "Venga, un beso, hasta ahora."]
        en: ["Hey, look, the thing is I'm not going to make it, okay?", "I mean, start without me and I'll tell you later.", "Right, kisses, see you soon."]
        grammar: [g.native-fluency-markers, g.indirect-commands]
        vocab: [w.es-que, w.o-sea, w.venga]
      - title: "Nota en la nevera"
        es: ["Bueno, pues me he ido a correr.", "Hay café hecho; tal cual lo dejé, caliente.", "Vuelvo en una hora, en plan tranquilo."]
        en: ["Well, so I've gone running.", "There's coffee made; just as I left it, hot.", "Back in an hour, taking it easy."]
        grammar: [g.native-fluency-markers]
        vocab: [w.bueno.interj, w.tal-cual, w.en-plan]
    spicy:
      - { es: "Pues nada, o sea, que me gustas, ¿sabes? Es que llevo tres «o sea» intentando decirlo.", en: "Well, I mean, I like you, you know? It's just that I've used three 'I mean's trying to say it.", altEs: ["Pues nada, o sea, que me gustas, ¿sabes? Es que llevo tres «o sea» para decirlo."], grammar: [g.native-fluency-markers], vocab: [w.pues-nada, w.o-sea, w.es-que] }
      - { es: "A ver, mira, es que cuando sonríes pierdo el hilo; empiezo otra vez.", en: "Look, it's just that when you smile I lose my thread; let me start again.", altEs: ["A ver, mira, es que cuando sonríes pierdo el hilo y tengo que empezar otra vez."], grammar: [g.native-fluency-markers], vocab: [w.a-ver, w.perder-el-hilo, w.hilo] }
      - { es: "Total, que se acercó, dijo «hombre, tú por aquí» y, tal cual, me invitó a un café.", en: "So anyway, he came over, said 'well, fancy seeing you here' and, just like that, invited me for a coffee.", altEs: ["Total, que se acercó, dijo «hombre, tú por aquí» y, tal cual, me invitó a un café."], grammar: [g.native-fluency-markers], vocab: [w.total-que, w.hombre.interj, w.tal-cual] }
      - { es: "A bote pronto te diría que sí a la cena; pensándolo mejor, también.", en: "Off the top of my head I'd say yes to dinner; on reflection, also yes.", altEs: ["A bote pronto te diría que sí a la cena; pensándolo mejor, también que sí."], grammar: [g.native-fluency-markers, g.conditional-simple], vocab: [w.a-bote-pronto] }
      - { es: "No titubees: ve al grano y pídeme el número antes de que divague yo.", en: "Don't hesitate: get to the point and ask for my number before I start rambling.", altEs: ["No titubees: ve al grano y pídeme el número antes de que empiece yo a divagar."], grammar: [g.native-fluency-markers, g.imperative-negative, g.imperative-tu], vocab: [w.titubear, w.ir-al-grano, w.divagar] }
  - id: c2.u08.l2
    title: Entre amigos
    teach: [g.native-fluency-markers]
    vocab: [w.aja, w.anda-ya, w.quiero-decir, w.ni-de-cona, w.por-si-las-moscas, w.costar-un-rinon, w.tirar-la-toalla, w.hacerse-el-sueco, w.montar-un-pollo, w.liarse, w.apanarse, w.cotilla, w.cotillear, w.resaca, w.a-tope, w.pasarse-tres-pueblos, w.matar-el-gusanillo, w.de-cajon, w.hacer-la-pelota, w.quedarse-frito, w.de-perdidos-al-rio, w.cantar-las-cuarenta, w.estar-al-loro, w.ni-fu-ni-fa, w.estar-en-babia, w.dar-el-pego, w.ser-la-leche]
    tip: "Backchannels (ya, claro, ajá, ¡no me digas!, ¡anda ya!) keep the conversation alive; repairs (quiero decir, mejor dicho) fix it; idioms (ni de coña, por si las moscas, meter la pata) give it a native density."
    sentences:
      - { es: "¡No me digas! ¿En serio te lo dijo así? Qué fuerte.", en: "You don't say! Did he really say it to you like that? That's wild.", grammar: [g.native-fluency-markers], vocab: [w.no-me-digas, w.en-serio, w.que-fuerte] }
      - { es: "Ajá, ya, claro… — ¿Me estás escuchando o solo dices ajá?", en: "Uh-huh, yeah, sure… — Are you listening to me or just saying uh-huh?", grammar: [g.native-fluency-markers, g.estar-gerund], vocab: [w.aja] }
      - { es: "¡Anda ya! Eso no te lo crees ni tú.", en: "Come off it! Not even you believe that.", altEs: ["¡Anda ya! Eso no se lo cree nadie."], altEn: ["Come off it! Nobody believes that, not even you."], grammar: [g.native-fluency-markers], vocab: [w.anda-ya] }
      - { es: "Quedamos a las ocho, quiero decir, a las ocho y media; mejor dicho, cuando salgas del curro.", en: "We'll meet at eight, I mean, at half past eight; or rather, when you get off work.", altEs: ["Quedamos a las ocho, quiero decir, a las ocho y media; mejor dicho, cuando salgas del trabajo."], grammar: [g.native-fluency-markers, g.subjunctive-time-clauses], vocab: [w.quiero-decir, w.mejor-dicho, w.curro] }
      - { es: "¿Ir en coche al centro un sábado? Ni de coña: no hay dónde aparcar.", en: "Drive into the centre on a Saturday? No way: there's nowhere to park.", altEs: ["¿Ir en coche al centro un sábado? Ni de broma: no hay dónde aparcar."], grammar: [g.native-fluency-markers], vocab: [w.ni-de-cona, w.aparcar] }
      - { es: "Llévate el paraguas, por si las moscas.", en: "Take the umbrella, just in case.", grammar: [g.native-fluency-markers, g.imperative-tu], vocab: [w.por-si-las-moscas, w.paraguas], error: { wrong: "Llévate el paraguas, por si los moscas.", explain: "Idioms are fixed: por si las moscas, with the feminine article (la mosca).", grammar: g.native-fluency-markers } }
      - { es: "Mi vecina es una cotilla: se pasa el día cotilleando desde el balcón.", en: "My neighbour is a gossip: she spends the whole day snooping from the balcony.", altEs: ["Mi vecina es muy cotilla: se pasa el día cotilleando desde el balcón."], grammar: [g.native-fluency-markers], vocab: [w.cotilla, w.cotillear, w.balcon] }
      - { es: "Deja de hacerle la pelota al jefe; con lo del regalo te has pasado tres pueblos.", en: "Stop sucking up to the boss; with the present you went way too far.", grammar: [g.native-fluency-markers, g.imperative-tu], vocab: [w.hacer-la-pelota, w.pasarse-tres-pueblos] }
      - { es: "La boda nos costó un riñón, pero no pensamos tirar la toalla con la hipoteca.", en: "The wedding cost us an arm and a leg, but we don't intend to throw in the towel on the mortgage.", altEs: ["La boda nos costó un ojo de la cara, pero no pensamos tirar la toalla con la hipoteca."], grammar: [g.native-fluency-markers], vocab: [w.costar-un-rinon, w.tirar-la-toalla, w.hipoteca] }
      - { es: "Me lié con las fechas y reservé el hotel para el mes equivocado; en fin, me apaño.", en: "I got muddled with the dates and booked the hotel for the wrong month; anyway, I'll manage.", altEs: ["Me lié con las fechas y reservé el hotel para el mes equivocado; en fin, ya me apaño."], grammar: [g.native-fluency-markers], vocab: [w.liarse, w.apanarse, w.en-fin] }
      - { es: "El bar estaba a tope y aun así nos hicieron un hueco.", en: "The bar was packed and even so they found us a spot.", altEs: ["El bar estaba a tope y, aun así, nos hicieron un hueco."], altEn: ["The bar was packed and they still found us a spot."], grammar: [g.native-fluency-markers], vocab: [w.a-tope] }
      - { es: "Decían que el examen era de cajón; pues yo me quedé en blanco.", en: "They said the exam was a no-brainer; well, my mind went blank.", grammar: [g.native-fluency-markers, g.imperfect-uses], vocab: [w.de-cajon, w.quedarse-en-blanco] }
      - { es: "Después de la fiesta tenía una resaca horrible y no pegué ojo.", en: "After the party I had a horrible hangover and didn't sleep a wink.", grammar: [g.native-fluency-markers, g.preterite-vs-imperfect], vocab: [w.resaca, w.no-pegar-ojo] }
      - { es: "Comemos algo rápido para matar el gusanillo y luego cenamos en serio.", en: "We'll eat something quick to take the edge off our hunger and then have a proper dinner.", grammar: [g.native-fluency-markers], vocab: [w.matar-el-gusanillo] }
      - { es: "¿Qué tal la peli? — Ni fu ni fa; de hecho me quedé frito a la mitad.", en: "How was the film? — So-so; in fact I nodded off halfway through.", grammar: [g.native-fluency-markers], vocab: [w.ni-fu-ni-fa, w.quedarse-frito, w.de-hecho] }
      - { es: "No voy a ir, de ninguna manera.", en: "I'm not going, no way.", grammar: [g.native-fluency-markers], vocab: [w.ir], transform: { instruction: "Say it colloquially with an idiom", answer: "Ni de coña voy.", alt: ["No voy ni de coña.", "Ni de broma voy."] } }
    exchanges:
      - q: { es: "¡Me han dado el trabajo!", en: "They've given me the job!" }
        a: { es: "¡No me digas! Qué bien, enhorabuena.", en: "You don't say! Great, congratulations." }
        alt: ["¡Anda! ¿En serio? Qué fuerte, enhorabuena."]
        grammar: [g.native-fluency-markers]
        vocab: [w.no-me-digas, w.enhorabuena]
      - q: { es: "¿Te vienes a correr a las seis de la mañana?", en: "Are you coming running at six in the morning?" }
        a: { es: "Ni de coña. A esa hora, ni muerto.", en: "No way. At that hour, not even dead." }
        alt: ["Anda ya, a esa hora ni muerto.", "Ni de broma."]
        grammar: [g.native-fluency-markers]
        vocab: [w.ni-de-cona]
      - q: { es: "¿Qué tal con el casero?", en: "How are things with the landlord?" }
        a: { es: "Se hace el sueco cada vez que le hablo de la calefacción.", en: "He plays dumb every time I mention the heating." }
        alt: ["Fatal: se hace el sueco con la calefacción."]
        grammar: [g.native-fluency-markers]
        vocab: [w.hacerse-el-sueco, w.calefaccion]
      - q: { es: "¿Vas a decirle al jefe lo que piensas?", en: "Are you going to tell the boss what you think?" }
        a: { es: "De perdidos al río: mañana le canto las cuarenta.", en: "In for a penny, in for a pound: tomorrow I'll give him a piece of my mind." }
        alt: ["Sí, mañana le canto las cuarenta.", "Hombre, ya estoy hasta las narices; se lo digo mañana."]
        grammar: [g.native-fluency-markers]
        vocab: [w.de-perdidos-al-rio, w.cantar-las-cuarenta]
      - q: { es: "¿Estabas escuchando? Estás en Babia.", en: "Were you listening? You're miles away." }
        a: { es: "Perdona, estoy al loro, de verdad; es que la presentación es la leche de larga.", en: "Sorry, I am paying attention, honestly; it's just that the presentation is incredibly long." }
        alt: ["Perdona, me he despistado un momento."]
        grammar: [g.native-fluency-markers]
        vocab: [w.estar-en-babia, w.estar-al-loro, w.ser-la-leche]
      - q: { es: "¿Qué le pasó a tu hermana en el restaurante?", en: "What happened to your sister at the restaurant?" }
        a: { es: "Montó un pollo porque le trajeron la carne fría.", en: "She made a scene because they brought her the meat cold." }
        alt: ["Nada, que montó un pollo por la carne fría."]
        grammar: [g.native-fluency-markers]
        vocab: [w.montar-un-pollo]
    texts:
      - title: "Chat de grupo"
        es: ["Chicos, me he liado con el día y he reservado para el jueves.", "¡Anda ya! Dime que es broma.", "Tranquilos, ya lo he cambiado; por si las moscas, lo confirmo mañana."]
        en: ["Guys, I got muddled with the day and booked for Thursday.", "Come off it! Tell me it's a joke.", "Relax, I've changed it already; just in case, I'll confirm tomorrow."]
        grammar: [g.native-fluency-markers]
        vocab: [w.liarse, w.anda-ya, w.por-si-las-moscas]
      - title: "Cotilleo de oficina"
        es: ["¿Sabes lo de Ramón? Lo han ascendido.", "¡No me digas! Si lleva dos meses haciéndole la pelota a la directora…", "Ya, pero también se lo ha currado; no seas cotilla.", "Pues con ese traje nuevo, desde luego, da el pego de director."]
        en: ["Have you heard about Ramón? He's been promoted.", "You don't say! He's been sucking up to the director for two months…", "Yeah, but he's also worked hard for it; don't be a gossip.", "Well, with that new suit he certainly looks the part of a director."]
        grammar: [g.native-fluency-markers]
        vocab: [w.no-me-digas, w.hacer-la-pelota, w.cotilla, w.currar, w.dar-el-pego]
    spicy:
      - { es: "¡Anda ya! ¿Que no te has fijado en mí? Eso no te lo crees ni tú.", en: "Come off it! You haven't noticed me? Even you don't believe that.", altEs: ["¡Anda ya! ¿Que no te has fijado en mí? Eso no te lo crees ni tú."], grammar: [g.native-fluency-markers], vocab: [w.anda-ya] }
      - { es: "Llevo el paraguas por si las moscas y tu número por si llueve de verdad.", en: "I carry the umbrella just in case and your number in case it really rains.", altEs: ["Llevo el paraguas por si las moscas, y tu número por si llueve de verdad."], grammar: [g.native-fluency-markers], vocab: [w.por-si-las-moscas, w.paraguas] }
      - { es: "No te hago la pelota, quiero decir, sí, pero con el jefe me paso tres pueblos y contigo me quedo corto.", en: "I'm not buttering you up, I mean, I am, but with the boss I go way over the top and with you I fall short.", altEs: ["No te hago la pelota; quiero decir, sí, pero con el jefe me paso tres pueblos y contigo me quedo corto."], grammar: [g.native-fluency-markers], vocab: [w.hacer-la-pelota, w.quiero-decir, w.pasarse-tres-pueblos] }
      - { es: "¿Dejar de escribirte? Ni de coña; de perdidos al río: te escribo dos veces.", en: "Stop writing to you? No way; in for a penny, in for a pound: I'll write twice.", altEs: ["¿Dejar de escribirte? Ni de coña. De perdidos al río: te escribo dos veces."], grammar: [g.native-fluency-markers], vocab: [w.ni-de-cona, w.de-perdidos-al-rio] }
      - { es: "Me quedé frito en el sofá y soñé que te cantaba las cuarenta por no llamarme; luego me desperté y te llamé yo.", en: "I fell asleep on the sofa and dreamt I was giving you a piece of my mind for not calling me; then I woke up and called you myself.", altEs: ["Me quedé frito en el sofá y soñé que te cantaba las cuarenta por no llamarme; después me desperté y te llamé yo."], grammar: [g.native-fluency-markers, g.preterite-vs-imperfect], vocab: [w.quedarse-frito, w.cantar-las-cuarenta] }
  - id: c2.u08.l3
    title: Referencias y costumbres
    teach: [g.native-fluency-markers]
    vocab: [w.tertuliano, w.culebron, w.derbi, w.aficion, w.nochevieja, w.uva, w.campanada, w.turron, w.roscon, w.encierro, w.procesion, w.sorteo, w.chiringuito, w.pincho, w.cercania, w.brusco, w.decimo, w.villancico, w.cabalgata, w.coger-el-toro-por-los-cuernos, w.cortarse-la-coleta, w.hacer-el-agosto, w.haba]
    tip: "Natives share references: the twelve grapes, the Christmas lottery, the derbi, the roscón, the tertulianos on TV. They exaggerate, interrupt, use diminutives and tú; none of it is rude, it is closeness."
    sentences:
      - { es: "En Nochevieja nos comemos las doce uvas con las campanadas, una por cada mes del año.", en: "On New Year's Eve we eat the twelve grapes with the chimes, one for each month of the year.", grammar: [g.native-fluency-markers], vocab: [w.nochevieja, w.uva, w.campanada], error: { wrong: "En Nochevieja comemos los doce uvas con las campanadas, una por cada mes del año.", explain: "uva is feminine: las doce uvas; natives also add nos (nos comemos) to stress finishing them all.", grammar: g.native-fluency-markers } }
      - { es: "El roscón de Reyes esconde una figura y un haba: a quien le toca el haba le toca pagar el roscón.", en: "The Three Kings cake hides a figurine and a bean: whoever gets the bean has to pay for the cake.", grammar: [g.native-fluency-markers], vocab: [w.roscon, w.haba, w.esconder, w.tocar] }
      - { es: "¿Has comprado un décimo para el sorteo de Navidad? — Dos, por si acaso toca el Gordo.", en: "Have you bought a ticket for the Christmas lottery? — Two, just in case the big prize comes up.", grammar: [g.native-fluency-markers], vocab: [w.decimo, w.sorteo, w.por-si-acaso] }
      - { es: "Los tertulianos del programa de la mañana discuten de todo y no saben de nada.", en: "The panellists on the morning show argue about everything and know nothing about anything.", altEs: ["Los tertulianos del programa de la mañana hablan de todo y no saben de nada."], grammar: [g.native-fluency-markers], vocab: [w.tertuliano, w.discutir] }
      - { es: "El derbi se vive en toda la ciudad: la afición llena los bares desde el mediodía.", en: "The derby is felt all over the city: the fans fill the bars from midday.", altEs: ["El derbi se vive en toda la ciudad: la afición llena los bares desde mediodía."], grammar: [g.native-fluency-markers, g.se-passive], vocab: [w.derbi, w.aficion] }
      - { es: "Mi abuela ve el culebrón de las cuatro y luego el telediario; no le quites ninguno de los dos.", en: "My grandmother watches the four o'clock soap and then the news; don't take either of them away from her.", altEs: ["Mi abuela ve la telenovela de las cuatro y luego el telediario; no le quites ninguno de los dos."], grammar: [g.native-fluency-markers, g.imperative-negative], vocab: [w.culebron, w.telediario] }
      - { es: "En San Fermín, el encierro empieza a las ocho de la mañana y dura apenas tres minutos.", en: "At San Fermín, the running of the bulls starts at eight in the morning and lasts barely three minutes.", grammar: [g.native-fluency-markers], vocab: [w.encierro, w.apenas] }
      - { es: "Comimos pinchos en la parte vieja y acabamos en un chiringuito de la playa.", en: "We ate pinchos in the old town and ended up in a beach bar.", altEs: ["Comimos pinchos en el casco viejo y acabamos en un chiringuito de la playa."], grammar: [g.native-fluency-markers, g.preterite-regular], vocab: [w.pincho, w.chiringuito] }
      - { es: "Los españoles exageramos: «me muero de hambre», «hace mil años que no te veo».", en: "We Spaniards exaggerate: 'I'm dying of hunger', 'I haven't seen you in a thousand years'.", altEs: ["Los españoles exageramos mucho: «me muero de hambre», «hace mil años que no te veo»."], altEn: ["We Spaniards exaggerate: 'I'm starving to death', 'I haven't seen you for a thousand years'."], grammar: [g.native-fluency-markers], vocab: [w.exagerar, w.exageracion] }
      - { es: "El tuteo y los diminutivos crean cercanía: «¿me pones un cafelito, guapa?».", en: "Using tú and diminutives creates closeness: 'can I have a little coffee, love?'", grammar: [g.native-fluency-markers, g.diminutives-augmentatives], vocab: [w.tuteo, w.diminutivo, w.cercania] }
      - { es: "A los extranjeros les parecemos bruscos porque interrumpimos y hablamos todos a la vez.", en: "To foreigners we seem abrupt because we interrupt and all talk at the same time.", altEs: ["A los extranjeros les parecemos bruscos porque interrumpimos y hablamos todos al mismo tiempo."], grammar: [g.native-fluency-markers], vocab: [w.brusco, w.interrumpir] }
      - { es: "Las referencias importan: si no sabes quién es Chiquito de la Calzada, te pierdes la mitad de los chistes.", en: "References matter: if you don't know who Chiquito de la Calzada is, you miss half the jokes.", grammar: [g.native-fluency-markers, g.si-clauses-real], vocab: [w.referencia, w.chiste] }
      - { es: "El turrón y los villancicos aparecen en noviembre, antes de que nadie los pida.", en: "Turrón and Christmas carols appear in November, before anyone asks for them.", grammar: [g.native-fluency-markers, g.antes-despues-de], vocab: [w.turron, w.villancico] }
      - { es: "La cabalgata de Reyes llena las calles de niños la noche del cinco de enero, y las tiendas de juguetes hacen el agosto.", en: "The Three Kings parade fills the streets with children on the night of the fifth of January, and the toy shops make a killing.", grammar: [g.native-fluency-markers], vocab: [w.cabalgata, w.hacer-el-agosto] }
      - { es: "El toreo dejó frases hechas que todo el mundo usa: coger el toro por los cuernos, cortarse la coleta.", en: "Bullfighting left set phrases that everyone uses: to take the bull by the horns, to hang up your boots.", grammar: [g.native-fluency-markers, g.sociolects], vocab: [w.coger-el-toro-por-los-cuernos, w.cortarse-la-coleta] }
      - { es: "Tengo mucha hambre.", en: "I'm very hungry.", grammar: [g.native-fluency-markers, g.tener-expressions], vocab: [w.hambre], transform: { instruction: "Exaggerate it the way a native would", answer: "Me muero de hambre.", alt: ["Estoy muerto de hambre.", "Tengo un hambre que no veo."] } }
    exchanges:
      - q: { es: "¿Qué hacéis en Nochevieja?", en: "What do you do on New Year's Eve?" }
        a: { es: "Cenamos en familia, nos tomamos las uvas con las campanadas y luego salimos.", en: "We have dinner as a family, eat the grapes with the chimes and then go out." }
        alt: ["Cena en familia, las doce uvas y luego fiesta."]
        grammar: [g.native-fluency-markers]
        vocab: [w.nochevieja, w.uva, w.campanada]
      - q: { es: "¿Quién ha ganado el derbi?", en: "Who won the derby?" }
        a: { es: "Nosotros, dos a uno; la afición todavía no se lo cree.", en: "We did, two one; the fans still can't believe it." }
        alt: ["Nosotros, dos a uno."]
        grammar: [g.native-fluency-markers]
        vocab: [w.derbi, w.aficion]
      - q: { es: "¿Te ha tocado algo en el sorteo?", en: "Did you win anything in the lottery?" }
        a: { es: "Veinte euros por el décimo: lo justo para el roscón.", en: "Twenty euros on the ticket: just enough for the roscón." }
        alt: ["Nada, como siempre.", "Veinte euros, lo justo para el roscón."]
        grammar: [g.native-fluency-markers]
        vocab: [w.sorteo, w.decimo, w.roscon]
      - q: { es: "¿Me pones un cafelito?", en: "Can I have a little coffee?" }
        a: { es: "Claro, guapa; ¿solo o con leche?", en: "Of course, love; black or with milk?" }
        alt: ["Ahora mismo. ¿Solo o con leche?"]
        grammar: [g.native-fluency-markers, g.diminutives-augmentatives]
        vocab: [w.cafe]
      - q: { es: "¿Por qué habláis todos a la vez?", en: "Why do you all talk at the same time?" }
        a: { es: "Porque aquí interrumpir no es de mala educación: es que estamos interesados.", en: "Because here interrupting isn't bad manners: it's that we're interested." }
        alt: ["Porque interrumpir, aquí, es señal de interés."]
        grammar: [g.native-fluency-markers]
        vocab: [w.interrumpir, w.educacion]
    texts:
      - title: "Programa de las fiestas"
        es: ["Viernes: inauguración de las fiestas a las doce.", "Sábado: procesión por el centro y baile en la plaza hasta la madrugada.", "Domingo: paella popular y sorteo de una cesta de Navidad."]
        en: ["Friday: opening of the festivities at twelve.", "Saturday: procession through the centre and dancing in the square until the early hours.", "Sunday: paella for everyone and the raffle of a Christmas hamper."]
        grammar: [g.native-fluency-markers]
        vocab: [w.procesion, w.sorteo]
      - title: "Pie de foto de Nochevieja"
        es: ["Las doce uvas, listas.", "Este año nadie se atraganta.", "¡Feliz año a todos!"]
        en: ["The twelve grapes, ready.", "This year nobody chokes.", "Happy New Year, everyone!"]
        grammar: [g.native-fluency-markers]
        vocab: [w.uva, w.nochevieja]
    spicy:
      - { es: "En Nochevieja me comí las doce uvas pidiendo un solo deseo, y las doce veces eras tú.", en: "On New Year's Eve I ate the twelve grapes making a single wish, and all twelve times it was you.", altEs: ["En Nochevieja me comí las doce uvas pidiendo un solo deseo y las doce veces eras tú."], grammar: [g.native-fluency-markers, g.preterite-regular], vocab: [w.nochevieja, w.uva] }
      - { es: "Me tocó el haba del roscón: pago yo, pero elijo con quién lo comparto.", en: "I got the bean in the roscón: I pay, but I choose who I share it with.", altEs: ["Me ha tocado el haba del roscón: pago yo, pero elijo con quién lo comparto."], grammar: [g.native-fluency-markers], vocab: [w.roscon, w.haba, w.tocar] }
      - { es: "Compré un décimo por si acaso; me tocó algo mejor que el Gordo: tu número.", en: "I bought a lottery ticket just in case; I won something better than the jackpot: your number.", altEs: ["Compré un décimo por si acaso y me tocó algo mejor que el Gordo: tu número."], grammar: [g.native-fluency-markers], vocab: [w.decimo, w.por-si-acaso, w.tocar] }
      - { es: "Nuestra historia es un culebrón: cada tarde a las cuatro, nadie se pierde el capítulo, ni los perros.", en: "Our story is a soap opera: every afternoon at four, nobody misses the episode, not even the dogs.", altEs: ["Nuestra historia es un culebrón: cada tarde a las cuatro nadie se pierde el capítulo, ni siquiera los perros."], grammar: [g.native-fluency-markers], vocab: [w.culebron] }
      - { es: "¿Me pones un cafelito, guapo? El diminutivo es cercanía; el «guapo», pura verdad.", en: "Can I have a little coffee, handsome? The diminutive is closeness; the 'handsome' is plain truth.", altEs: ["¿Me pones un cafelito, guapo? El diminutivo es cercanía y el «guapo», pura verdad."], grammar: [g.native-fluency-markers, g.diminutives-augmentatives], vocab: [w.diminutivo, w.cercania] }
  - id: c2.u08.l4
    title: Repaso del curso
    teach: [g.c2-review]
    vocab: [w.maestria, w.pulir, w.afinar, w.desenvolverse, w.espontaneo, w.hito, w.perseverancia, w.inagotable, w.horizonte, w.afianzar, w.consolidar]
    tip: "Mastery is a practice: input from several countries, output in several registers, noticing idioms, switching between the tweet, the formal report and the chat. This lesson recycles every unit of the course."
    sentences:
      - { es: "El dominio de una lengua se mide menos por lo que se sabe que por lo que se es capaz de hacer con ella.", en: "Mastery of a language is measured less by what one knows than by what one can do with it.", grammar: [g.c2-review, g.se-passive], vocab: [w.dominio, w.capaz] }
      - { es: "Quien domina los matices domina la lengua; quien domina los registros domina a su público.", en: "Whoever masters the nuances masters the language; whoever masters the registers masters their audience.", altEs: ["El que domina los matices domina la lengua; el que domina los registros domina a su público."], grammar: [g.c2-review, g.relative-que-quien], vocab: [w.matiz, w.registro, w.dominar], error: { wrong: "Quién domina los matices domina la lengua; quién domina los registros domina a su público.", explain: "The relative quien (whoever) carries no accent; quién is the question word.", grammar: g.c2-review } }
      - { es: "Si hubiera empezado a leer en español antes, ahora no me costaría tanto el Siglo de Oro.", en: "If I had started reading in Spanish earlier, the Golden Age wouldn't be so hard for me now.", grammar: [g.c2-review, g.si-clauses-past, g.golden-age-language], vocab: [w.siglo] }
      - { es: "Por mucho que estudies gramática, la fluidez solo llega hablando.", en: "However much grammar you study, fluency only comes through speaking.", altEs: ["Por más que estudies gramática, la fluidez solo llega hablando."], altEn: ["However much grammar you study, fluency comes only through speaking."], grammar: [g.c2-review, g.por-mucho-que], vocab: [w.fluidez, w.gramatica] }
      - { es: "Traducir un poema, redactar un informe técnico y contar un chiste son tres maneras de demostrar maestría.", en: "Translating a poem, drafting a technical report and telling a joke are three ways of showing mastery.", grammar: [g.c2-review, g.translation-nuance, g.technical-register, g.wordplay], vocab: [w.maestria, w.traducir, w.redactar, w.chiste] }
      - { es: "Se ruega a los lectores que no se desanimen: el aprendizaje de una lengua es inagotable.", en: "Readers are asked not to lose heart: learning a language is inexhaustible.", grammar: [g.c2-review, g.bureaucratic-language, g.indirect-commands], vocab: [w.inagotable, w.aprendizaje] }
      - { es: "No es que el español sea difícil; es que es inmenso.", en: "It's not that Spanish is difficult; it's that it is immense.", altEs: ["No es que el español sea difícil, es que es inmenso."], grammar: [g.c2-review, g.subjunctive-nuance], vocab: [w.es-que] }
      - { es: "Habla como un tertuliano, escribe como un notario y bromea como un cómico: eso es el dominio nativo.", en: "Talk like a TV panellist, write like a notary and joke like a comedian: that is native mastery.", grammar: [g.c2-review, g.imperative-tu, g.register-formal-informal], vocab: [w.tertuliano, w.notario, w.bromear] }
      - { es: "Me preguntó cómo había conseguido desenvolverme tan bien y le dije que perseverando.", en: "She asked me how I had managed to get by so well and I told her: by persevering.", grammar: [g.c2-review, g.reported-questions, g.gerund-uses-advanced], vocab: [w.desenvolverse, w.perseverar] }
      - { es: "La perseverancia afianza lo aprendido; el repaso lo consolida.", en: "Perseverance strengthens what has been learned; review consolidates it.", altEs: ["La perseverancia afianza lo aprendido y el repaso lo consolida."], grammar: [g.c2-review, g.neutral-lo], vocab: [w.perseverancia, w.afianzar, w.repaso, w.consolidar] }
      - { es: "Cuanto más leas, más espontáneo serás al hablar: las frases hechas se pegan solas.", en: "The more you read, the more spontaneous you'll be when speaking: fixed phrases stick by themselves.", grammar: [g.c2-review, g.comparatives, g.fixed-expressions], vocab: [w.espontaneo] }
      - { es: "Pulir el acento es cuestión de oído; afinar el registro, cuestión de lectura.", en: "Polishing your accent is a matter of ear; fine-tuning your register, a matter of reading.", altEs: ["Pulir el acento es cuestión de oído; afinar el registro es cuestión de lectura."], grammar: [g.c2-review, g.sociolects], vocab: [w.pulir, w.afinar, w.acento] }
      - { es: "He llegado a un hito, no a una meta: el horizonte de una lengua siempre se mueve.", en: "I've reached a milestone, not a finish line: the horizon of a language is always moving.", altEs: ["He alcanzado un hito, no una meta: el horizonte de una lengua siempre se mueve."], grammar: [g.c2-review, g.present-perfect], vocab: [w.hito, w.meta, w.horizonte] }
      - { es: "Sigue leyendo, hablando y escuchando: así se aprende.", en: "Keep reading, speaking and listening: that's how one learns.", altEs: ["Sigue leyendo, hablando y escuchando: así es como se aprende."], grammar: [g.c2-review, g.verbal-periphrases, g.se-impersonal], vocab: [w.seguir] }
      - { es: "¿Que si hablo con soltura? Me desenvuelvo en cualquier registro, de la tertulia al informe, pero sigo tomando notas.", en: "Do I speak with ease? I get by in any register, from the talk show to the report, but I still take notes.", grammar: [g.c2-review, g.reported-questions], vocab: [w.soltura, w.desenvolverse] }
      - { es: "Quiero que me corrijan cuando hable.", en: "I want to be corrected when I speak.", grammar: [g.c2-review, g.subjunctive-wishes, g.subjunctive-time-clauses], vocab: [w.corregir], transform: { instruction: "Put it in the past (quería)", answer: "Quería que me corrigieran cuando hablara.", alt: ["Quería que me corrigiesen cuando hablase."] } }
    exchanges:
      - q: { es: "¿Qué haces para no perder nivel?", en: "What do you do so as not to lose your level?" }
        a: { es: "Leo prensa de varios países, escucho pódcast y hablo con nativos cada semana.", en: "I read the press from several countries, listen to podcasts and talk to natives every week." }
        alt: ["Leer, escuchar y hablar: cada día un poco de cada."]
        grammar: [g.c2-review]
        vocab: [w.prensa, w.podcast, w.nativo]
      - q: { es: "¿Cuál ha sido la unidad más difícil?", en: "Which unit has been the hardest?" }
        a: { es: "La del Siglo de Oro, sin duda; Quevedo no perdona.", en: "The Golden Age one, without a doubt; Quevedo shows no mercy." }
        alt: ["La de literatura del Siglo de Oro: Quevedo es durísimo."]
        grammar: [g.c2-review, g.golden-age-language]
        vocab: [w.siglo, w.perdonar]
      - q: { es: "¿Te sientes ya nativo?", en: "Do you feel native yet?" }
        a: { es: "Ni de coña; me desenvuelvo, que no es poco.", en: "No way; I get by, which is no small thing." }
        alt: ["Nativo no, pero me apaño en cualquier situación."]
        grammar: [g.c2-review, g.native-fluency-markers]
        vocab: [w.ni-de-cona, w.desenvolverse]
      - q: { es: "¿Qué consejo le darías a alguien que empieza?", en: "What advice would you give someone starting out?" }
        a: { es: "Que persevere y que no tenga miedo de meter la pata.", en: "To persevere and not to be afraid of putting their foot in it." }
        alt: ["Que lea mucho y que hable sin miedo a equivocarse."]
        grammar: [g.c2-review, g.indirect-commands]
        vocab: [w.perseverar, w.meter-la-pata]
      - q: { es: "¿Y ahora qué?", en: "And now what?" }
        a: { es: "Pues nada, seguir: el horizonte se mueve cada vez que te acercas.", en: "Well, keep going: the horizon moves every time you get closer." }
        alt: ["Seguir leyendo y hablando; esto no se acaba."]
        grammar: [g.c2-review]
        vocab: [w.pues-nada, w.horizonte]
    texts:
      - title: "Carta a mi yo de hace dos años"
        es: ["Vas a entender chistes que hoy no pillas y a leer a Galdós sin diccionario.", "Vas a meter la pata mil veces y a apañarte igual.", "Sigue: lo que hoy es un muro mañana será una puerta."]
        en: ["You're going to understand jokes you don't get today and read Galdós without a dictionary.", "You're going to put your foot in it a thousand times and manage all the same.", "Keep going: what is a wall today will be a door tomorrow."]
        grammar: [g.c2-review, g.ir-a-future]
        vocab: [w.pillar, w.meter-la-pata, w.apanarse]
      - title: "Última nota del profesor"
        es: ["Hemos llegado al final del curso, no del camino.", "Repasad los matices, pulid el registro y buscad conversación.", "El resto lo hará el tiempo."]
        en: ["We've reached the end of the course, not of the road.", "Review the nuances, polish your register and seek out conversation.", "Time will do the rest."]
        grammar: [g.c2-review, g.imperative-vosotros]
        vocab: [w.matiz, w.pulir, w.registro]
    spicy:
      - { es: "Quien domina los matices domina la lengua; quien domina mi sonrisa, por lo visto, eres tú.", en: "Whoever masters the nuances masters the language; whoever masters my smile, apparently, is you.", altEs: ["Quien domina los matices domina la lengua; quien domina mi sonrisa, por lo visto, eres tú."], grammar: [g.c2-review, g.relative-que-quien], vocab: [w.dominar, w.matiz] }
      - { es: "Si hubiera empezado a hablarte antes, ahora te pediría una cita con soltura.", en: "If I'd started talking to you earlier, I'd be asking you out with ease by now.", altEs: ["Si hubiera empezado a hablarte antes, ahora te pediría una cita con más soltura."], grammar: [g.c2-review, g.si-clauses-past], vocab: [w.soltura] }
      - { es: "Por mucho que pulas el acento y afines el registro, lo que me gusta es cómo bromeas.", en: "However much you polish your accent and fine-tune your register, what I like is how you joke.", altEs: ["Por mucho que pulas el acento y afines el registro, lo que me gusta es cómo bromeas."], grammar: [g.c2-review, g.por-mucho-que], vocab: [w.pulir, w.afinar, w.acento, w.registro, w.bromear] }
      - { es: "He llegado a un hito, no a una meta: me has dicho tu nombre; el horizonte, de momento, es la cena.", en: "I've reached a milestone, not a goal: you've told me your name; the horizon, for now, is dinner.", altEs: ["He llegado a un hito, no a una meta: me has dicho tu nombre; el horizonte, por ahora, es la cena."], grammar: [g.c2-review, g.present-perfect], vocab: [w.hito, w.meta, w.horizonte] }
      - { es: "Metí la pata, quiero decir, me desenvolví muy mal; pues nada, a perseverar: ¿otro café mañana?", en: "I put my foot in it, I mean, I handled it very badly; oh well, persevere: another coffee tomorrow?", altEs: ["Metí la pata, o sea, me desenvolví muy mal; pues nada, a perseverar: ¿otro café mañana?"], grammar: [g.c2-review, g.native-fluency-markers], vocab: [w.meter-la-pata, w.desenvolverse, w.pues-nada, w.perseverar] }
dialogues:
  - id: c2.u08.d1
    title: La última clase
    context: Elena, the teacher, closes the C2 course with two students, Tom and Aiko, who look back on what they have learned.
    lines:
      - { speaker: Elena, es: "Bueno, pues hemos llegado al final. A ver, Tom, ¿qué es lo que más te ha costado?", en: "Well, so we've reached the end. Let's see, Tom, what has been hardest for you?" }
      - { speaker: Tom, es: "Hombre, el Siglo de Oro, sin duda. Quevedo me daba ganas de tirar la toalla cada dos páginas.", en: "The Golden Age, without a doubt. Quevedo made me want to throw in the towel every two pages." }
      - { speaker: Aiko, es: "A mí lo que más me costó fue la jerga. En Madrid todo molaba y en Buenos Aires todo era un quilombo; me liaba.", en: "For me the hardest thing was slang. In Madrid everything was cool and in Buenos Aires everything was chaos; I got muddled." }
      - { speaker: Elena, es: "Y, sin embargo, ahora os desenvolvéis en cualquier registro. ¿Os habéis dado cuenta?", en: "And yet now you get by in any register. Have you noticed?" }
      - { speaker: Tom, es: "Pues sí. Ayer leí una resolución de Hacienda y la entendí a la primera. Eso sí que es un hito.", en: "Yes indeed. Yesterday I read a tax office ruling and understood it on the first reading. Now that's a milestone." }
      - { speaker: Aiko, es: "Y yo le conté un chiste a mi vecina y se rio en el remate, no antes. ¡Qué fuerte!", en: "And I told my neighbour a joke and she laughed at the punchline, not before. Unbelievable!" }
      - { speaker: Elena, es: "Eso es dominio nativo: que te rían el chiste. ¿Y ahora qué vais a hacer para no perder nivel?", en: "That's native mastery: getting a laugh for your joke. And now what are you going to do to keep your level?" }
      - { speaker: Tom, es: "Leer prensa de varios países y escuchar pódcast. Y, por si las moscas, repasar los matices cada semana.", en: "Read the press from several countries and listen to podcasts. And, just in case, review the nuances every week." }
      - { speaker: Aiko, es: "Yo voy a seguir con la literatura: Galdós, Unamuno, Pardo Bazán. Y a hablar, claro, aunque meta la pata.", en: "I'm going to carry on with literature: Galdós, Unamuno, Pardo Bazán. And to talk, of course, even if I put my foot in it." }
      - { speaker: Elena, es: "Meter la pata es parte del camino. Quien no se equivoca no está hablando de verdad.", en: "Putting your foot in it is part of the journey. Whoever doesn't make mistakes isn't really talking." }
      - { speaker: Tom, es: "Pues nada, Elena, gracias por todo. ¿Nos tomamos algo para celebrarlo? Yo invito.", en: "Well then, Elena, thanks for everything. Shall we have a drink to celebrate? My treat." }
      - { speaker: Elena, es: "Venga, pero con una condición: la sobremesa, en español y sin diccionario.", en: "Alright, but on one condition: the after-lunch conversation in Spanish and without a dictionary." }
    questions:
      - { q: "What was hardest for Tom?", options: ["Slang", "Golden Age literature", "Bureaucratic language"], answer: 1 }
      - { q: "Why does Aiko consider telling the joke a success?", options: ["Her neighbour laughed at the punchline", "Her neighbour didn't understand it", "She told it in Japanese"], answer: 0 }
      - { q: "What does Elena say about making mistakes?", options: ["They should be avoided at all costs", "They are part of the journey", "They only happen to beginners"], answer: 1 }
writing:
  - task: "Tell a friend, in a natural spoken style, about the most chaotic day of your trip, using fillers and colloquial idioms (a ver, bueno, pues nada, por si las moscas, montar un pollo, irse por las ramas …)."
    min: 130
    max: 220
    use: [w.a-ver, w.pues-nada, w.por-si-las-moscas, w.montar-un-pollo, w.irse-por-las-ramas]
    useAtLeast: 3
    grammar: [g.native-fluency-markers]
    expect:
      - { pattern: "\\b(a ver|bueno|pues nada|o sea|en plan|vamos|hombre|tal cual)\\b", hint: "Use fillers: a ver, bueno, pues nada, o sea …" }
      - { pattern: "por si las moscas|montar un pollo|mont[oó] un pollo|por las ramas|tirar la toalla|costar un ri[nñ][oó]n|quedarse frito|de cajón|al loro|en babia|a tope|matar el gusanillo|hacerse el sueco", hint: "Add colloquial idioms: por si las moscas, montar un pollo, irse por las ramas …" }
    model: { es: "A ver, que te cuento. Bueno, el día que volvimos de Ushuaia fue una locura total. Llegamos al aeropuerto tres horas antes, por si las moscas, y ¿qué pasa? Que el vuelo tenía cuatro horas de retraso. Un señor que estaba a mi lado montó un pollo impresionante delante de la ventanilla, gritando que perdía una boda. Yo, mientras tanto, me quedé frito en una silla, porque no había dormido nada. Total, que cuando por fin subimos al avión, mi maleta no estaba. O sea, imagínate la cara que se me quedó. Bueno, no me quiero ir por las ramas: la maleta apareció en Buenos Aires dos días después, en otro vuelo, con todo dentro. Pues nada, al final fue una anécdota más del viaje. Eso sí, la próxima vez llevo ropa limpia en la mochila, por si acaso.", en: "Right, let me tell you. So, the day we came back from Ushuaia was total madness. We got to the airport three hours early, just in case, and what happens? The flight was four hours late. A man next to me kicked up a huge fuss at the counter, shouting that he was missing a wedding. Meanwhile I fell fast asleep on a chair, because I hadn't slept at all. Anyway, when we finally boarded the plane, my suitcase wasn't there. I mean, imagine my face. Well, I don't want to go off on a tangent: the suitcase turned up in Buenos Aires two days later, on another flight, with everything inside. So there you go, in the end it was just one more story from the trip. Still, next time I'm taking clean clothes in my rucksack, just in case." }
  - task: "Explain to a foreign friend two Spanish-speaking customs (New Year's grapes, the Three Kings, a village festival …) and compare them with your own country."
    min: 130
    max: 220
    use: [w.nochevieja, w.uva, w.campanada, w.roscon, w.cabalgata]
    useAtLeast: 3
    grammar: [g.native-fluency-markers]
    expect:
      - { pattern: "nochevieja|uvas|campanadas|rosc[oó]n|reyes|villancico|turr[oó]n|cabalgata", hint: "Describe the customs: Nochevieja, las uvas, el roscón, la cabalgata …" }
      - { pattern: "en mi pa[ií]s|en cambio|mientras que|a diferencia de|igual que", hint: "Compare with your country: en mi país …, en cambio …" }
    model: { es: "En España hay dos costumbres que siempre sorprenden a los extranjeros. La primera es la de las uvas de Nochevieja: a las doce de la noche, mientras suenan las doce campanadas del reloj de la Puerta del Sol, hay que comerse una uva con cada campanada. Si lo consigues, tendrás suerte todo el año, aunque casi todo el mundo termina riéndose con la boca llena. En mi país, en cambio, solo contamos los segundos y nos damos un beso. La segunda costumbre es la noche de Reyes, el 5 de enero. Por la tarde, en muchas ciudades hay una cabalgata con los tres Reyes Magos, que tiran caramelos a los niños. Al día siguiente, los niños abren sus regalos y la familia desayuna roscón, un dulce con forma de anillo y una sorpresa dentro. A diferencia de mi país, donde los regalos llegan el 25 de diciembre, aquí la Navidad dura casi dos semanas.", en: "In Spain there are two customs that always surprise foreigners. The first is the New Year's Eve grapes: at midnight, while the twelve chimes of the clock in the Puerta del Sol ring out, you have to eat one grape with each chime. If you manage it, you'll have luck all year, although almost everyone ends up laughing with their mouth full. In my country, by contrast, we simply count down the seconds and kiss each other. The second custom is Twelfth Night, on 5 January. In the evening, in many cities there's a parade with the Three Wise Men, who throw sweets to the children. The next day, children open their presents and the family has roscón for breakfast, a ring-shaped cake with a surprise inside. Unlike my country, where presents arrive on 25 December, here Christmas lasts almost two weeks." }
  - task: "Write a reflective text about the end of your journey, from Ezeiza back to Buenos Aires: milestones, what you have mastered and what you still want to polish."
    min: 130
    max: 220
    use: [w.hito, w.desenvolverse, w.pulir, w.perseverancia, w.afianzar]
    useAtLeast: 3
    grammar: [g.c2-review]
    expect:
      - { pattern: "\\b(he|hemos|ha|han) [a-zñ]+(ado|ido|to|cho|sto)\\b", hint: "Look back with the present perfect: he aprendido, he conseguido …" }
      - { pattern: "me gustar[ií]a|quiero|quisiera|espero|ojal[aá]", hint: "Look ahead: me gustaría pulir …, espero …" }
    model: { es: "Cuando aterricé en Ezeiza, apenas sabía decir «hola» y «gracias». Hoy, de vuelta en Buenos Aires, me cuesta creer todo lo que ha pasado. Ha sido un viaje lleno de hitos: la primera vez que pedí un café sin hacer gestos, la primera discusión que gané en español, el primer chiste que entendí sin pedir explicaciones. He aprendido a desenvolverme en un hospital, en una oficina de extranjería y en una fiesta llena de desconocidos. Sobre todo, he descubierto que la lengua no se aprende solo en los libros, sino con perseverancia y con muchas ganas de equivocarse. Todavía me queda mucho por pulir: el subjuntivo me sigue jugando alguna mala pasada y mi acento muestra enseguida que soy extranjero. Me gustaría afianzar lo que he aprendido leyendo más literatura y, ojalá, volver pronto para seguir este camino que, como diría Machado, se hace al andar.", en: "When I landed at Ezeiza, I could barely say 'hello' and 'thank you'. Today, back in Buenos Aires, I can hardly believe everything that has happened. It's been a journey full of milestones: the first time I ordered a coffee without using gestures, the first argument I won in Spanish, the first joke I understood without asking for an explanation. I've learned to get by in a hospital, an immigration office and a party full of strangers. Above all, I've discovered that a language isn't learned only from books, but with perseverance and a real willingness to make mistakes. I still have a lot to polish: the subjunctive still plays tricks on me now and then and my accent immediately gives away that I'm a foreigner. I'd like to consolidate what I've learned by reading more literature and, I hope, come back soon to continue this road which, as Machado would say, is made by walking." }
  - task: "Write a short opinion piece: 'Learning a language as an adult is worth it.' Use your full range: concessions, a rhetorical question, an idiom, the subjunctive and nuanced connectors."
    min: 130
    max: 220
    use: [w.maestria, w.espontaneo, w.consolidar, w.inagotable, w.tirar-la-toalla]
    useAtLeast: 3
    grammar: [g.c2-review]
    expect:
      - { pattern: "¿[^?]+\\?", hint: "Ask a rhetorical question: ¿Quién dijo que …?" }
      - { pattern: "si bien|aunque|por mucho que|a pesar de|es cierto que", hint: "Concede a point: si bien …, es cierto que …" }
      - { pattern: "tirar la toalla|costar un ri[nñ][oó]n|de cajón|por si las moscas|coger el toro por los cuernos|de perdidos al r[ií]o|pan comido|meter la pata", hint: "Add an idiom: no tirar la toalla, coger el toro por los cuernos …" }
    model: { es: "¿Quién dijo que después de los treinta ya es tarde para aprender un idioma? Es cierto que los niños tienen ventajas: imitan los sonidos con facilidad y no tienen miedo de equivocarse. Sin embargo, los que ya no somos niños contamos con algo igual de valioso: sabemos por qué estudiamos y somos capaces de organizarnos. Si bien es probable que nunca hablemos sin acento, eso no significa que no podamos expresarnos con maestría. Por mucho que cueste al principio, llega un día en que la lengua deja de ser un esfuerzo y se vuelve espontánea, casi natural. Para conseguirlo, lo importante es no tirar la toalla cuando aparecen las primeras dificultades y coger el toro por los cuernos: hablar, escuchar y leer cada día, aunque sea poco. Aprender un idioma no consiste solo en consolidar unas reglas, sino en abrir una puerta a un mundo inagotable de personas, libros y canciones. Y eso, a cualquier edad, merece la pena.", en: "Who said that after thirty it's too late to learn a language? It's true that children have advantages: they imitate sounds easily and aren't afraid of making mistakes. However, those of us who are no longer children have something just as valuable: we know why we're studying and we're able to organise ourselves. While we'll probably never speak without an accent, that doesn't mean we can't express ourselves masterfully. However hard it is at first, a day comes when the language stops being an effort and becomes spontaneous, almost natural. To get there, the important thing is not to throw in the towel when the first difficulties appear and to take the bull by the horns: speak, listen and read every day, even if only a little. Learning a language isn't just about consolidating some rules, but about opening a door to an endless world of people, books and songs. And that, at any age, is worth it." }
