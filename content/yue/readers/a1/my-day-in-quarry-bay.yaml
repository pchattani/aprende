id: r.a1.my-day-in-quarry-bay
level: a1
title: 我嘅一日
kind: text
intro: Sam, a young designer who lives in Quarry Bay, describes an ordinary weekday, the hot and humid Hong Kong summer, and what he does on Sundays.
paragraphs:
  - { es: "我叫Sam，今年二十八歲。我喺鰂魚涌住，喺一座好舊、好高嘅大廈。好多遊客叫呢度做「怪獸大廈」，日日都有人嚟影相。", en: "My name is Sam and I'm twenty-eight this year. I live in Quarry Bay, in a very old, very tall building. Lots of tourists call this place the \"Monster Building\", and every day people come here to take photos." }
  - { es: "我通常朝早七點起身。我先刷牙、洗面、沖涼，跟住着衫。七點半，我喺樓下茶餐廳食早餐，通常食多士，飲一杯熱奶茶。", en: "I usually get up at seven in the morning. First I brush my teeth, wash my face and have a shower, then I get dressed. At half past seven I have breakfast at the cha chaan teng downstairs, usually toast and a cup of hot milk tea." }
  - { es: "八點，我坐港鐵返工。我喺銅鑼灣一間公司做嘢，坐車十五分鐘就到。我公司好細，得八個人，但係大家都好好人。中午一點，我同同事一齊出街食晏。", en: "At eight I take the MTR to work. I work for a company in Causeway Bay, which is just fifteen minutes away by train. My company is small, only eight people, but they're all lovely. At one o'clock I go out for lunch with my colleagues." }
  - { es: "我六點放工。有時我去健身室做運動，有時我去行街。我好少喺屋企煮飯，因為我唔識煮！晚飯我通常喺出面食。夜晚我睇電視、上網或者打機，十二點瞓覺。", en: "I finish work at six. Sometimes I go to the gym, sometimes I go shopping. I rarely cook at home, because I can't cook! I usually eat dinner out. In the evening I watch TV, go online or play video games, and I go to bed at twelve." }
  - { es: "而家係七月，香港好熱，又好濕，日日都三十幾度。有時落好大雨，有時行雷。我出街一定帶遮。辦公室同港鐵入面有冷氣，好凍，所以我都帶件褸。", en: "It's July now, and Hong Kong is very hot and very humid, over thirty degrees every day. Sometimes it rains really hard, sometimes there's thunder. I always take an umbrella when I go out. The office and the MTR have air conditioning and it's freezing, so I take a jacket too." }
  - { es: "星期日我唔使返工。如果天氣好，我同朋友去赤柱。赤柱有海灘同市集，仲有好多餐廳。我哋喺海邊食嘢、飲啤酒，好舒服。我最鍾意星期日！", en: "On Sundays I don't have to work. If the weather is good, I go to Stanley with friends. Stanley has a beach and a market, and lots of restaurants too. We eat and drink beer by the sea; it's very relaxing. Sunday is my favourite day!" }
questions:
  - { q: "Sam通常幾點起身？", options: ["六點", "七點", "八點"], answer: 1, explain: "我通常朝早七點起身. He takes the MTR at eight." }
  - { q: "Sam早餐通常食乜嘢？", options: ["多士同熱奶茶", "粥", "菠蘿包同咖啡"], answer: 0, explain: "通常食多士，飲一杯熱奶茶." }
  - { q: "點解Sam好少喺屋企煮飯？", options: ["因為佢好忙", "因為佢唔識煮", "因為佢屋企冇廚房"], answer: 1, explain: "我好少喺屋企煮飯，因為我唔識煮！" }
  - { q: "點解Sam帶件褸？", options: ["因為出面好凍", "因為辦公室同港鐵有冷氣", "因為落雨"], answer: 1, explain: "Air conditioning makes the office and the MTR cold: 有冷氣，好凍，所以我都帶件褸. For rain he takes an umbrella." }
  - { q: "星期日天氣好，Sam去邊度？", options: ["銅鑼灣", "赤柱", "鰂魚涌"], answer: 1, explain: "如果天氣好，我同朋友去赤柱." }
glossary:
  - { es: 怪獸, en: monster }
  - { es: 同事, en: colleague }
  - { es: 辦公室, en: office }
