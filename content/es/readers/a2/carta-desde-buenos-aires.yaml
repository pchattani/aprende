id: r.a2.carta-desde-buenos-aires
level: a2
title: Carta desde Buenos Aires
kind: text
intro: Elena, from Madrid, writes to her brother after three months living in Argentina. Notice the Latin American words she has learnt.
allow: [elena, buenos, aires, argentina, argentinos, palermo, tango, asado, colectivo, departamento, vos, che, mate, empresa]
paragraphs:
  - { es: "Querido Javi: ¡Por fin te escribo! Llevo tres meses en Buenos Aires y todavía no me he acostumbrado a todo. La ciudad es enorme, mucho más grande que Madrid, y la gente es muy amable y muy habladora.", en: "Dear Javi: At last I'm writing to you! I've been in Buenos Aires for three months and I still haven't got used to everything. The city is enormous, much bigger than Madrid, and the people are very friendly and very talkative." }
  - { es: "Vivo en un departamento (así llaman aquí a los pisos) en el barrio de Palermo. Voy a la oficina en colectivo, que es el autobús. Al principio no entendía nada: aquí no dicen «tú», dicen «vos», y en lugar de «coger el autobús» hay que decir «tomar el colectivo». ¡«Coger» aquí significa otra cosa y la gente se ríe!", en: "I live in a 'departamento' (that's what they call flats here) in the Palermo neighbourhood. I go to the office by 'colectivo', which is the bus. At first I didn't understand anything: here they don't say 'tú', they say 'vos', and instead of 'coger el autobús' you have to say 'tomar el colectivo'. 'Coger' means something else here and people laugh!" }
  - { es: "Trabajo para una empresa de tecnología desde el uno de marzo. Mis compañeros son geniales. Los viernes, después del trabajo, salimos por el barrio y los domingos hacemos un asado, que es una barbacoa enorme con mucha carne. Por la tarde todos toman mate, una bebida caliente parecida al té.", en: "I've worked for a technology company since the first of March. My colleagues are great. On Fridays, after work, we go out around the neighbourhood and on Sundays we have an 'asado', which is an enormous barbecue with lots of meat. In the afternoon everyone drinks 'mate', a hot drink similar to tea." }
  - { es: "Hace un mes empecé clases de tango. Al principio me caía todo el tiempo, pero ahora bailo bastante bien. Mi profesor dice que tengo talento. Yo creo que es muy amable.", en: "A month ago I started tango classes. At first I kept falling over, but now I dance quite well. My teacher says I have talent. I think he's very kind." }
  - { es: "Me gustaría que vinieras en diciembre, cuando aquí es verano. Podríamos viajar al sur para ver los glaciares. Piénsalo y llámame por videollamada el domingo: aquí son cinco horas menos que en Madrid.", en: "I'd like you to come in December, when it's summer here. We could travel to the south to see the glaciers. Think about it and call me by video call on Sunday: here it's five hours earlier than in Madrid." }
  - { es: "Un abrazo muy grande para ti y para mamá. Os echo mucho de menos. Elena", en: "A big hug for you and for mum. I miss you a lot. Elena" }
questions:
  - { q: "What is a 'colectivo' in Buenos Aires?", options: ["A flat", "A bus", "A barbecue"], answer: 1 }
  - { q: "Since when has Elena worked for the technology company?", options: ["Since the first of March", "Since December", "Since a month ago"], answer: 0 }
  - { q: "Why does she suggest December for a visit?", options: ["It is winter there", "It is summer there", "Her classes finish then"], answer: 1 }
glossary:
  - { es: acostumbrarse a, en: to get used to }
  - { es: hablador, en: talkative }
  - { es: talento, en: talent }
  - { es: glaciar, en: glacier }
  - { es: videollamada, en: video call }
  - { es: echar de menos, en: to miss (someone) }
