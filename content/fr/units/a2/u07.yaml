id: a2.u07
title: "Saint-Malo, la cité corsaire"
lessons:
  - id: a2.u07.l1
    title: "Plus grande que Dinard"
    teach: [g.comparatives]
    tip: "plus / moins / aussi + adjective + que; with nouns plus de, moins de, autant de; after a verb plus, moins, autant."
    vocab: [w.plus, w.moins, w.autant, w.plus-de, w.moins-de, w.que, w.comparer, w.différence, w.lent, w.intéressant, w.ennuyeux, w.facile, w.difficile, w.large, w.étroit, w.cité, w.dinard.nm]
    sentences:
      - { es: "Saint-Malo est plus grande que Dinard.", en: "Saint-Malo is bigger than Dinard.", altEs: ["Saint-Malo est plus grand que Dinard.", "Saint-Malo, c'est plus grand que Dinard."], altEn: ["Saint-Malo is larger than Dinard."], grammar: [g.comparatives], vocab: [w.plus, w.que, w.dinard.nm] }
      - { es: "Les rues de la cité sont plus étroites que les rues de Rennes.", en: "The streets of the walled town are narrower than the streets of Rennes.", altEs: ["Les rues de la cité sont plus étroites que celles de Rennes."], altEn: ["The streets in the old walled town are narrower than the streets in Rennes."], grammar: [g.comparatives], vocab: [w.cité, w.étroit, w.plus] }
      - { es: "Les galettes sont moins sucrées que les crêpes.", en: "Galettes are less sweet than crêpes.", altEn: ["Galettes are not as sweet as crêpes."], grammar: [g.comparatives], vocab: [w.moins, w.galette] }
      - { es: "La plage du Sillon est aussi belle que les plages de Dinard.", en: "The Sillon beach is as beautiful as the beaches in Dinard.", altEs: ["La plage du Sillon est aussi jolie que les plages de Dinard."], altEn: ["Sillon beach is as beautiful as Dinard's beaches.", "The Sillon beach is as lovely as the beaches in Dinard."], grammar: [g.comparatives], vocab: [w.plage] }
      - { es: "Est-ce que le français est plus difficile que l'anglais ?", en: "Is French more difficult than English?", altEs: ["Le français est plus difficile que l'anglais ?", "Le français est-il plus difficile que l'anglais ?"], altEn: ["Is French harder than English?"], grammar: [g.comparatives], vocab: [w.difficile] }
      - { es: "Il y a plus de touristes en août qu'en mai.", en: "There are more tourists in August than in May.", altEs: ["En août, il y a plus de touristes qu'en mai."], grammar: [g.comparatives], vocab: [w.plus-de, w.touriste] }
      - { es: "Cette semaine, j'ai moins de temps que toi.", en: "This week I have less time than you.", altEs: ["J'ai moins de temps que toi cette semaine."], altEn: ["This week I've got less time than you.", "This week I have less time than you do."], grammar: [g.comparatives, g.stressed-pronouns], vocab: [w.moins-de, w.temps] }
      - { es: "Ici, il pleut autant qu'en Normandie.", en: "Here it rains as much as in Normandy.", altEs: ["Il pleut autant ici qu'en Normandie."], grammar: [g.comparatives], vocab: [w.autant, w.pleuvoir] }
      - { es: "Mon frère mange autant de crêpes que moi.", en: "My brother eats as many crêpes as me.", altEn: ["My brother eats as many crêpes as I do."], grammar: [g.comparatives], vocab: [w.autant, w.crêpe], error: { wrong: "Mon frère mange aussi de crêpes que moi.", explain: "With a noun, use autant de, not aussi: autant de crêpes.", grammar: g.comparatives } }
      - { es: "La visite des remparts est plus intéressante que la visite du musée.", en: "The tour of the ramparts is more interesting than the museum tour.", altEs: ["La visite des remparts est plus intéressante que celle du musée."], altEn: ["The ramparts tour is more interesting than the museum tour."], grammar: [g.comparatives], vocab: [w.intéressant, w.visite, w.rempart] }
      - { es: "Ce film est encore plus ennuyeux que le livre !", en: "This film is even more boring than the book!", altEn: ["This film is even duller than the book!"], grammar: [g.comparatives], vocab: [w.ennuyeux, w.film] }
      - { es: "Pour moi, le vélo est plus facile que la voile.", en: "For me, cycling is easier than sailing.", altEs: ["Pour moi, le vélo, c'est plus facile que la voile."], grammar: [g.comparatives], vocab: [w.facile, w.vélo, w.voile] }
      - { es: "Quelle est la différence entre une crêpe et une galette ?", en: "What's the difference between a crêpe and a galette?", altEs: ["C'est quoi, la différence entre une crêpe et une galette ?"], altEn: ["What is the difference between a crêpe and a galette?"], grammar: [g.quel], vocab: [w.différence, w.galette] }
      - { es: "La rue Saint-Vincent est moins large que la place.", en: "Rue Saint-Vincent is narrower than the square.", altEs: ["La rue Saint-Vincent est plus étroite que la place."], altEn: ["Rue Saint-Vincent is less wide than the square."], grammar: [g.comparatives], vocab: [w.large, w.moins] }
      - { es: "Paul est aussi grand que son père.", en: "Paul is as tall as his father.", grammar: [g.comparatives], vocab: [w.que], transform: { instruction: "Say that Paul is taller (plus … que)", answer: "Paul est plus grand que son père.", en: "Paul is taller than his father." } }
      - { es: "Le bus est lent et le train est rapide.", en: "The bus is slow and the train is fast.", grammar: [g.comparatives], vocab: [w.lent, w.comparer], transform: { instruction: "Compare them in one sentence with plus … que", answer: "Le bus est plus lent que le train.", alt: ["Le train est plus rapide que le bus.", "Le bus est moins rapide que le train.", "Le train est moins lent que le bus."], en: "The bus is slower than the train." } }
    exchanges:
      - q: { es: "Tu préfères Saint-Malo ou Dinard ?", en: "Do you prefer Saint-Malo or Dinard?" }
        a: { es: "Saint-Malo, parce que c'est plus grand et plus intéressant.", en: "Saint-Malo, because it's bigger and more interesting." }
        alt: ["Dinard, c'est plus calme.", "Saint-Malo, c'est plus intéressant.", "Saint-Malo : il y a plus de choses à voir."]
        grammar: [g.comparatives]
        vocab: [w.plus, w.intéressant, w.dinard.nm]
      - q: { es: "Le français est plus difficile que l'anglais ?", en: "Is French more difficult than English?" }
        a: { es: "Un peu, mais il est moins difficile que l'allemand !", en: "A little, but it's less difficult than German!" }
        alt: ["Oui, un peu plus difficile.", "Non, c'est aussi facile.", "Pour moi, c'est plus facile."]
        grammar: [g.comparatives]
        vocab: [w.difficile, w.facile]
      - q: { es: "Il y a beaucoup de touristes en mai ?", en: "Are there many tourists in May?" }
        a: { es: "Oui, mais il y en a moins qu'en août.", en: "Yes, but there are fewer than in August." }
        alt: ["Oui, mais moins qu'en août.", "Non, il y a moins de touristes qu'en été."]
        grammar: [g.comparatives, g.pronoun-en]
        vocab: [w.moins, w.touriste]
      - q: { es: "Tu as autant de vacances que moi ?", en: "Do you have as much holiday as me?" }
        a: { es: "Non, j'en ai moins que toi : deux semaines seulement.", en: "No, I have less than you: only two weeks." }
        alt: ["Non, j'ai moins de vacances que toi.", "Oui, j'en ai autant que toi.", "Non, j'en ai plus que toi !"]
        grammar: [g.comparatives]
        vocab: [w.autant, w.moins]
      - q: { es: "Quelle est la différence entre une crêpe et une galette ?", en: "What's the difference between a crêpe and a galette?" }
        a: { es: "La galette est salée et la crêpe est sucrée.", en: "The galette is savoury and the crêpe is sweet." }
        alt: ["La crêpe est plus sucrée que la galette.", "La galette est salée, la crêpe est sucrée."]
        grammar: [g.comparatives]
        vocab: [w.différence, w.galette]
    texts:
      - title: "Carte postale de Saint-Malo"
        es: ["Chère Julie, Saint-Malo est encore plus belle que sur les photos !", "Les rues de la cité sont étroites et la mer est plus froide qu'à Nice.", "Il y a autant de crêperies que de boulangeries. Bises, Léa"]
        en: ["Dear Julie, Saint-Malo is even more beautiful than in the photos!", "The streets of the walled town are narrow and the sea is colder than in Nice.", "There are as many crêperies as bakeries. Love, Léa"]
        grammar: [g.comparatives]
        vocab: [w.cité, w.étroit, w.autant, w.crêperie]
      - title: "Message de Thomas"
        es: ["Je prends le bus : il est plus lent que le train, mais beaucoup moins cher.", "J'arrive à Saint-Malo à six heures.", "Tu as plus de temps que moi, alors attends-moi à la gare !"]
        en: ["I'm taking the bus: it's slower than the train, but much cheaper.", "I arrive in Saint-Malo at six o'clock.", "You have more time than me, so wait for me at the station!"]
        grammar: [g.comparatives]
        vocab: [w.lent, w.moins, w.plus-de]
    spicy:
      - { es: "Tu es plus beau que la mer à marée haute.", en: "You're more handsome than the sea at high tide.", altEs: ["Tu es plus belle que la mer à marée haute."], altEn: ["You're more beautiful than the sea at high tide."], grammar: [g.comparatives], vocab: [w.plus, w.marée-haute] }
      - { es: "Ton sourire est plus chaud que le soleil breton.", en: "Your smile is warmer than the Breton sun.", grammar: [g.comparatives], vocab: [w.sourire, w.breton] }
      - { es: "Mes amis sont moins intéressants que toi, et ils le savent.", en: "My friends are less interesting than you, and they know it.", altEs: ["Mes amis sont moins intéressants que toi et ils le savent."], grammar: [g.comparatives], vocab: [w.moins, w.intéressant] }
      - { es: "J'ai moins de temps que toi, mais j'ai toujours du temps pour toi.", en: "I have less time than you, but I always have time for you.", grammar: [g.comparatives], vocab: [w.moins-de, w.temps] }
      - { es: "Tu danses aussi bien que tu cuisines ? Alors je reste.", en: "Do you dance as well as you cook? Then I'm staying.", altEs: ["Tu danses aussi bien que tu cuisines ? Alors, je reste."], grammar: [g.comparatives], vocab: [w.danser, w.cuisiner] }
  - id: a2.u07.l2
    title: "Les corsaires les plus célèbres"
    teach: [g.superlatives]
    tip: "le / la / les plus + adjective; when the adjective follows the noun, repeat the article: le navire le plus rapide. 'In' after a superlative is de."
    vocab: [w.le-plus, w.le-moins, w.corsaire, w.pirate, w.navire, w.marin, w.attaquer, w.roi, w.reine, w.célèbre, w.connu, w.profond, w.surcouf.nm]
    sentences:
      - { es: "Surcouf est un des corsaires les plus célèbres de Saint-Malo.", en: "Surcouf is one of the most famous corsairs of Saint-Malo.", altEs: ["Surcouf est l'un des corsaires les plus célèbres de Saint-Malo."], altEn: ["Surcouf is one of Saint-Malo's most famous corsairs.", "Surcouf is one of the most famous privateers of Saint-Malo."], grammar: [g.superlatives], vocab: [w.corsaire, w.célèbre, w.le-plus] }
      - { es: "C'est la plus vieille rue de la cité.", en: "It's the oldest street in the walled town.", altEs: ["C'est la rue la plus vieille de la cité.", "C'est la rue la plus ancienne de la cité."], altEn: ["This is the oldest street in the walled town."], grammar: [g.superlatives], vocab: [w.cité, w.le-plus] }
      - { es: "Les marées de Saint-Malo sont parmi les plus hautes d'Europe.", en: "Saint-Malo's tides are among the highest in Europe.", altEs: ["Les marées à Saint-Malo sont parmi les plus fortes d'Europe."], altEn: ["The tides in Saint-Malo are among the highest in Europe."], grammar: [g.superlatives], vocab: [w.marée, w.parmi] }
      - { es: "Quel est le navire le plus rapide du port ?", en: "Which is the fastest ship in the port?", altEs: ["Quel navire est le plus rapide du port ?"], altEn: ["What's the fastest ship in the harbour?"], grammar: [g.superlatives, g.quel], vocab: [w.navire, w.port] }
      - { es: "Le roi donnait aux corsaires le droit d'attaquer les navires ennemis.", en: "The king gave the corsairs the right to attack enemy ships.", altEn: ["The king gave privateers the right to attack enemy ships."], grammar: [g.imparfait-uses], vocab: [w.roi, w.attaquer, w.ennemi] }
      - { es: "Un pirate attaquait pour lui ; un corsaire attaquait pour le roi.", en: "A pirate attacked for himself; a corsair attacked for the king.", altEs: ["Un pirate attaquait pour lui, un corsaire attaquait pour le roi."], grammar: [g.imparfait-uses], vocab: [w.pirate, w.corsaire, w.attaquer] }
      - { es: "Qui est le plus jeune marin du navire ?", en: "Who is the youngest sailor on the ship?", altEs: ["Qui est le marin le plus jeune du navire ?"], grammar: [g.superlatives], vocab: [w.marin, w.navire] }
      - { es: "Quelle est la plage la plus calme de Saint-Malo ?", en: "Which is the quietest beach in Saint-Malo?", altEs: ["Quelle plage est la plus calme à Saint-Malo ?"], altEn: ["What's the quietest beach in Saint-Malo?"], grammar: [g.superlatives], vocab: [w.plage, w.calme] }
      - { es: "C'est le restaurant le moins cher du quartier.", en: "It's the cheapest restaurant in the neighbourhood.", altEn: ["It's the least expensive restaurant in the area."], grammar: [g.superlatives], vocab: [w.le-moins, w.restaurant], error: { wrong: "C'est le restaurant moins cher du quartier.", explain: "When the adjective follows the noun, repeat the article: le restaurant le moins cher.", grammar: g.superlatives } }
      - { es: "En été, c'est ici qu'il y a le plus de monde.", en: "In summer, this is where there are the most people.", altEs: ["C'est ici qu'il y a le plus de monde en été."], altEn: ["In summer, this is where it's busiest."], grammar: [g.superlatives], vocab: [w.le-plus] }
      - { es: "Qui est la reine la plus connue de l'histoire de France ?", en: "Who is the best-known queen in French history?", altEs: ["Quelle est la reine la plus connue de l'histoire de France ?"], altEn: ["Who is the most famous queen in French history?"], grammar: [g.superlatives], vocab: [w.reine, w.connu, w.histoire] }
      - { es: "À marée haute, c'est ici que l'eau est la plus profonde.", en: "At high tide, this is where the water is deepest.", altEs: ["C'est ici que l'eau est la plus profonde à marée haute."], grammar: [g.superlatives], vocab: [w.profond, w.marée-haute] }
      - { es: "En août, la mer est la moins froide de l'année.", en: "In August, the sea is at its least cold of the year.", altEs: ["C'est en août que la mer est la moins froide."], altEn: ["The sea is warmest in August."], grammar: [g.superlatives], vocab: [w.le-moins, w.mer] }
      - { es: "C'est le plus beau jour de mes vacances.", en: "It's the best day of my holiday.", altEn: ["It's the most beautiful day of my holidays.", "This is the best day of my vacation."], grammar: [g.superlatives], vocab: [w.le-plus], transform: { instruction: "Change jour to soirée", answer: "C'est la plus belle soirée de mes vacances.", en: "It's the most beautiful evening of my holiday." } }
      - { es: "Ce marin est très courageux.", en: "This sailor is very brave.", grammar: [g.superlatives], vocab: [w.marin, w.courageux], transform: { instruction: "Make it a superlative: the bravest on the ship (du navire)", answer: "C'est le marin le plus courageux du navire.", alt: ["Ce marin est le plus courageux du navire.", "C'est le plus courageux marin du navire."], en: "He's the bravest sailor on the ship." } }
    exchanges:
      - q: { es: "Quel est le corsaire le plus célèbre de Saint-Malo ?", en: "Who is the most famous corsair of Saint-Malo?" }
        a: { es: "C'est peut-être Surcouf.", en: "It's probably Surcouf." }
        alt: ["Surcouf, peut-être.", "Je pense que c'est Surcouf.", "Surcouf."]
        grammar: [g.superlatives]
        vocab: [w.corsaire, w.célèbre]
      - q: { es: "Quelle est la différence entre un pirate et un corsaire ?", en: "What's the difference between a pirate and a corsair?" }
        a: { es: "Le corsaire attaquait les navires ennemis pour le roi.", en: "The corsair attacked enemy ships for the king." }
        alt: ["Le pirate attaquait pour lui, le corsaire pour le roi.", "Le corsaire travaillait pour le roi."]
        grammar: [g.imparfait-uses]
        vocab: [w.pirate, w.corsaire, w.roi]
      - q: { es: "C'est quoi, le restaurant le moins cher ici ?", en: "What's the cheapest restaurant here?" }
        a: { es: "La crêperie de la place : c'est la moins chère du quartier.", en: "The crêperie on the square: it's the cheapest in the area." }
        alt: ["La crêperie de la place.", "C'est la crêperie, elle est la moins chère."]
        grammar: [g.superlatives]
        vocab: [w.le-moins, w.crêperie]
      - q: { es: "Quel est le mois le plus chaud ici ?", en: "What's the hottest month here?" }
        a: { es: "C'est août, mais l'eau reste froide !", en: "It's August, but the water stays cold!" }
        alt: ["Août.", "C'est juillet ou août.", "Le mois le plus chaud, c'est août."]
        grammar: [g.superlatives]
        vocab: [w.le-plus, w.mois]
      - q: { es: "Tu as vu le plus vieux navire du port ?", en: "Have you seen the oldest ship in the port?" }
        a: { es: "Oui, et c'est aussi le plus beau !", en: "Yes, and it's also the most beautiful!" }
        alt: ["Non, pas encore.", "Oui, il est magnifique.", "Oui, c'est le plus beau du port."]
        grammar: [g.superlatives]
        vocab: [w.navire, w.port]
    texts:
      - title: "Panneau sur les remparts"
        es: ["Saint-Malo, la cité corsaire.", "Ici vivaient les marins les plus courageux de Bretagne.", "Les corsaires attaquaient les navires ennemis pour le roi de France."]
        en: ["Saint-Malo, the corsair city.", "The bravest sailors in Brittany lived here.", "The corsairs attacked enemy ships for the King of France."]
        grammar: [g.superlatives, g.imparfait-uses]
        vocab: [w.corsaire, w.marin, w.navire, w.attaquer]
      - title: "Message de Camille"
        es: ["Je suis sur les remparts : c'est le plus bel endroit de la ville !", "La vue sur la mer est la plus belle à cette heure-ci.", "Viens vite !"]
        en: ["I'm on the ramparts: it's the most beautiful place in town!", "The view over the sea is at its most beautiful at this time.", "Come quickly!"]
        grammar: [g.superlatives]
        vocab: [w.le-plus, w.rempart]
    spicy:
      - { es: "Tu as le sourire le plus dangereux de Bretagne.", en: "You have the most dangerous smile in Brittany.", grammar: [g.superlatives], vocab: [w.sourire, w.dangereux] }
      - { es: "C'est le marin le plus mignon du port, et il le sait.", en: "He's the cutest sailor in the port, and he knows it.", altEs: ["C'est le marin le plus mignon du port et il le sait."], grammar: [g.superlatives], vocab: [w.marin, w.mignon] }
      - { es: "Le plus beau monument de Saint-Malo ? Toi, sur les remparts.", en: "The most beautiful monument in Saint-Malo? You, on the ramparts.", grammar: [g.superlatives], vocab: [w.monument, w.rempart] }
      - { es: "Je ne suis pas un pirate, mais je vais attaquer ton dessert.", en: "I'm not a pirate, but I'm going to attack your dessert.", grammar: [g.futur-proche], vocab: [w.pirate, w.attaquer] }
      - { es: "C'est la soirée la plus belle de l'année, et tu regardes ton portable ?", en: "It's the most beautiful evening of the year, and you're looking at your phone?", altEs: ["C'est la plus belle soirée de l'année et tu regardes ton portable ?"], grammar: [g.superlatives], vocab: [w.soirée, w.portable] }
  - id: a2.u07.l3
    title: "Les meilleures galettes"
    teach: [g.meilleur-mieux]
    tip: "meilleur is an adjective (de meilleures crêpes), mieux an adverb (elle cuisine mieux). Never plus bon or plus bien."
    vocab: [w.meilleur, w.mieux, w.pire, w.crêperie, w.galette, w.sablé, w.voile, w.africain, w.même, w.pareil]
    sentences:
      - { es: "Les galettes de cette crêperie sont meilleures qu'à Paris.", en: "The galettes in this crêperie are better than in Paris.", altEn: ["The galettes at this crêperie are better than in Paris."], grammar: [g.meilleur-mieux], vocab: [w.galette, w.crêperie, w.meilleur] }
      - { es: "C'est la meilleure crêperie de la ville !", en: "It's the best crêperie in town!", altEn: ["This is the best crêperie in town!"], grammar: [g.meilleur-mieux, g.superlatives], vocab: [w.meilleur, w.crêperie] }
      - { es: "Tu parles beaucoup mieux français qu'avant !", en: "You speak French much better than before!", altEs: ["Tu parles français beaucoup mieux qu'avant !"], grammar: [g.meilleur-mieux], vocab: [w.mieux] }
      - { es: "Je vais mieux, merci.", en: "I'm feeling better, thanks.", altEs: ["Ça va mieux, merci."], altEn: ["I'm better, thanks.", "I feel better, thank you."], grammar: [g.meilleur-mieux], vocab: [w.mieux] }
      - { es: "Le temps est pire qu'hier : il pleut et il y a du vent.", en: "The weather is worse than yesterday: it's raining and it's windy.", altEs: ["Le temps est pire qu'hier : il pleut et il fait du vent."], grammar: [g.meilleur-mieux], vocab: [w.pire, w.vent] }
      - { es: "C'est mieux de réserver une table le samedi soir.", en: "It's better to book a table on Saturday evenings.", altEs: ["Le samedi soir, c'est mieux de réserver une table."], altEn: ["It's better to book a table on a Saturday evening."], grammar: [g.meilleur-mieux], vocab: [w.mieux, w.réserver] }
      - { es: "Les sablés bretons sont les meilleurs !", en: "Breton shortbread biscuits are the best!", altEn: ["Breton shortbread is the best!"], grammar: [g.meilleur-mieux], vocab: [w.sablé, w.breton, w.meilleur] }
      - { es: "Ce n'est pas pareil : la galette est salée, la crêpe est sucrée.", en: "It's not the same: the galette is savoury, the crêpe is sweet.", altEs: ["Ce n'est pas la même chose : la galette est salée, la crêpe est sucrée."], grammar: [g.negation-ne-pas], vocab: [w.pareil, w.galette] }
      - { es: "Nous avons le même âge, mais tu cours mieux que moi.", en: "We're the same age, but you run better than me.", altEn: ["We're the same age, but you run better than I do."], grammar: [g.meilleur-mieux], vocab: [w.même, w.mieux] }
      - { es: "Le pire, c'est la pluie en août !", en: "The worst thing is the rain in August!", altEn: ["The worst is the rain in August!"], grammar: [g.meilleur-mieux], vocab: [w.pire, w.pluie] }
      - { es: "Cette galette est meilleure que l'autre.", en: "This galette is better than the other one.", grammar: [g.meilleur-mieux], vocab: [w.meilleur, w.galette], error: { wrong: "Cette galette est plus bonne que l'autre.", explain: "Never plus bon: the comparative of bon is meilleur (here meilleure, feminine).", grammar: g.meilleur-mieux } }
      - { es: "Elle fait de la voile mieux que moi.", en: "She sails better than me.", altEn: ["She sails better than I do."], grammar: [g.meilleur-mieux], vocab: [w.voile, w.mieux], error: { wrong: "Elle fait de la voile meilleur que moi.", explain: "How she sails is an adverb: mieux, not meilleur.", grammar: g.meilleur-mieux } }
      - { es: "Il chante bien.", en: "He sings well.", grammar: [g.meilleur-mieux], vocab: [w.mieux], transform: { instruction: "Say he sings better than his sister", answer: "Il chante mieux que sa sœur.", en: "He sings better than his sister." } }
      - { es: "C'est un bon restaurant.", en: "It's a good restaurant.", grammar: [g.meilleur-mieux], vocab: [w.meilleur], transform: { instruction: "Make it 'the best restaurant in town'", answer: "C'est le meilleur restaurant de la ville.", en: "It's the best restaurant in town." } }
      - { es: "La cuisine africaine de ce petit restaurant est la meilleure du quartier.", en: "The African food in this little restaurant is the best in the area.", altEn: ["The African cooking at this little restaurant is the best in the neighbourhood."], grammar: [g.meilleur-mieux], vocab: [w.africain, w.meilleur] }
      - { es: "Les meilleurs marins partent de Saint-Malo pour la Route du Rhum.", en: "The best sailors set off from Saint-Malo for the Route du Rhum.", altEn: ["The best sailors leave Saint-Malo for the Route du Rhum race."], grammar: [g.meilleur-mieux], vocab: [w.meilleur, w.marin], note: "The Route du Rhum is a solo sailing race from Saint-Malo to Guadeloupe, held every four years since 1978." }
    exchanges:
      - q: { es: "Elles sont comment, les galettes ici ?", en: "What are the galettes like here?" }
        a: { es: "Délicieuses ! Ce sont les meilleures de Saint-Malo.", en: "Delicious! They're the best in Saint-Malo." }
        alt: ["Très bonnes, les meilleures de la ville.", "Délicieuses !"]
        grammar: [g.meilleur-mieux]
        vocab: [w.galette, w.meilleur]
      - q: { es: "Tu vas mieux ?", en: "Are you feeling better?" }
        a: { es: "Oui, beaucoup mieux, merci.", en: "Yes, much better, thanks." }
        alt: ["Oui, ça va mieux.", "Non, c'est pire qu'hier.", "Un peu mieux, merci."]
        grammar: [g.meilleur-mieux]
        vocab: [w.mieux, w.pire]
      - q: { es: "On réserve ou on y va sans réservation ?", en: "Shall we book or go without a reservation?" }
        a: { es: "C'est mieux de réserver, c'est samedi.", en: "It's better to book, it's Saturday." }
        alt: ["Il vaut mieux réserver.", "On réserve, c'est mieux."]
        grammar: [g.meilleur-mieux]
        vocab: [w.mieux, w.réservation]
      - q: { es: "Qui fait les meilleures crêpes de la famille ?", en: "Who makes the best crêpes in the family?" }
        a: { es: "Ma grand-mère, évidemment !", en: "My grandmother, of course!" }
        alt: ["Mon père.", "C'est moi, évidemment !", "Ma mère, elle les fait mieux que tout le monde."]
        grammar: [g.meilleur-mieux]
        vocab: [w.meilleur, w.évidemment]
      - q: { es: "Tu fais de la voile ?", en: "Do you go sailing?" }
        a: { es: "Oui, mais mon frère en fait beaucoup mieux que moi.", en: "Yes, but my brother sails much better than me." }
        alt: ["Oui, mais mon frère est meilleur que moi.", "Non, je préfère la plage."]
        grammar: [g.meilleur-mieux, g.pronoun-en]
        vocab: [w.voile, w.mieux]
    texts:
      - title: "Avis sur une crêperie"
        es: ["Les galettes sont très bonnes, meilleures qu'à Rennes.", "Le service est plus lent le samedi.", "Le pire ? Il n'y a pas de terrasse."]
        en: ["The galettes are very good, better than in Rennes.", "The service is slower on Saturdays.", "The worst thing? There's no terrace."]
        grammar: [g.meilleur-mieux, g.comparatives]
        vocab: [w.galette, w.meilleur, w.pire]
      - title: "Message de Julie"
        es: ["Mon cours de voile s'est mieux passé qu'hier.", "Je suis tombée seulement deux fois !", "Ce soir, on mange les meilleures crêpes de la ville ?"]
        en: ["My sailing lesson went better than yesterday.", "I only fell twice!", "Tonight, shall we eat the best crêpes in town?"]
        grammar: [g.meilleur-mieux, g.passe-compose-etre]
        vocab: [w.voile, w.mieux, w.meilleur]
    spicy:
      - { es: "Tes crêpes sont bonnes, mais ton sourire est encore meilleur.", en: "Your crêpes are good, but your smile is even better.", grammar: [g.meilleur-mieux], vocab: [w.meilleur, w.sourire] }
      - { es: "Tu danses mieux que moi, alors apprends-moi !", en: "You dance better than me, so teach me!", altEn: ["You dance better than I do, so teach me!"], grammar: [g.meilleur-mieux], vocab: [w.mieux, w.danser] }
      - { es: "Le pire rendez-vous de ma vie ? Non, le meilleur : tu as payé les galettes.", en: "The worst date of my life? No, the best: you paid for the galettes.", grammar: [g.meilleur-mieux], vocab: [w.pire, w.meilleur, w.rendez-vous] }
      - { es: "Je ne cuisine pas mieux que toi, mais je fais la vaisselle avec le sourire.", en: "I don't cook better than you, but I do the washing-up with a smile.", grammar: [g.meilleur-mieux], vocab: [w.mieux, w.vaisselle] }
      - { es: "La voile, c'est mieux à deux. Le dessert aussi.", en: "Sailing is better for two. So is dessert.", altEs: ["La voile, c'est mieux à deux ; le dessert aussi."], grammar: [g.meilleur-mieux], vocab: [w.voile, w.mieux] }
  - id: a2.u07.l4
    title: "Bretagne ou Normandie ?"
    teach: [g.comparatives, g.superlatives]
    tip: "Linking words for comparing: par contre (on the other hand), pourtant (yet), d'ailleurs (besides), par exemple, comme (like)."
    vocab: [w.breton, w.normand, w.bretagne.nm, w.normandie.nm, w.d-ailleurs, w.pourtant, w.par-contre, w.par-exemple, w.exemple, w.comme, w.explorer, w.explorateur, w.découvrir, w.découverte, w.entourer, w.sens, w.yann.nm]
    sentences:
      - { es: "Les Bretons et les Normands pensent tous que leur région est la plus belle.", en: "Bretons and Normans all think their region is the most beautiful.", altEs: ["Les Bretons et les Normands pensent tous que leur région est la plus jolie."], grammar: [g.superlatives], vocab: [w.breton, w.normand, w.région] }
      - { es: "Le Mont-Saint-Michel est en Normandie ; pourtant, il est tout près de la Bretagne.", en: "Mont-Saint-Michel is in Normandy; yet it's very close to Brittany.", altEs: ["Le Mont-Saint-Michel est en Normandie, pourtant il est tout près de la Bretagne."], altEn: ["Mont-Saint-Michel is in Normandy, and yet it is very close to Brittany."], grammar: [g.narrative-connectors], vocab: [w.pourtant, w.normandie.nm, w.bretagne.nm] }
      - { es: "Les crêpes sont bretonnes ; par contre, le camembert est normand.", en: "Crêpes are Breton; on the other hand, camembert is Norman.", altEs: ["Les crêpes sont bretonnes, par contre le camembert est normand."], grammar: [g.adjective-agreement], vocab: [w.par-contre, w.breton, w.normand] }
      - { es: "Jacques Cartier, né à Saint-Malo, a exploré le Canada en 1534.", en: "Jacques Cartier, born in Saint-Malo, explored Canada in 1534.", grammar: [g.passe-compose-avoir], vocab: [w.explorer] }
      - { es: "C'est l'explorateur le plus connu de Saint-Malo.", en: "He's the best-known explorer from Saint-Malo.", altEs: ["C'est l'explorateur le plus célèbre de Saint-Malo."], altEn: ["He is Saint-Malo's best-known explorer."], grammar: [g.superlatives], vocab: [w.explorateur, w.connu], transform: { instruction: "Change it to 'the least known' (le moins)", answer: "C'est l'explorateur le moins connu de Saint-Malo.", en: "He's the least-known explorer from Saint-Malo." } }
      - { es: "La cité est entourée de remparts, comme une île de pierre.", en: "The walled town is surrounded by ramparts, like an island of stone.", altEn: ["The old town is surrounded by ramparts, like a stone island."], grammar: [g.comparatives], vocab: [w.entourer, w.comme, w.rempart] }
      - { es: "Il y a des remparts dans d'autres villes bretonnes, par exemple à Concarneau.", en: "There are ramparts in other Breton towns, for example in Concarneau.", grammar: [g.il-y-a], vocab: [w.par-exemple, w.breton] }
      - { es: "On boit du cidre en Normandie comme en Bretagne.", en: "People drink cider in Normandy as in Brittany.", altEs: ["En Normandie comme en Bretagne, on boit du cidre."], altEn: ["People drink cider in Normandy just like in Brittany."], grammar: [g.comparatives], vocab: [w.comme, w.cidre] }
      - { es: "D'ailleurs, en Bretagne, on préfère le beurre salé.", en: "Besides, in Brittany people prefer salted butter.", altEn: ["Anyway, in Brittany they prefer salted butter."], grammar: [g.on-nous], vocab: [w.d-ailleurs, w.beurre] }
      - { es: "Dans quel sens on fait le tour des remparts ?", en: "Which way do we go round the ramparts?", altEs: ["On fait le tour des remparts dans quel sens ?", "Dans quel sens est-ce qu'on fait le tour des remparts ?"], altEn: ["Which direction do we walk round the ramparts?"], grammar: [g.quel], vocab: [w.sens, w.tour.n] }
      - { es: "Pour moi, la plus belle découverte du voyage, c'est la côte bretonne.", en: "For me, the best discovery of the trip is the Breton coast.", altEn: ["For me, the most beautiful discovery of the trip is the Breton coast."], grammar: [g.superlatives], vocab: [w.découverte, w.côte] }
      - { es: "Le Couesnon est la rivière entre la Normandie et la Bretagne.", en: "The Couesnon is the river between Normandy and Brittany.", grammar: [g.articles-definite], vocab: [w.rivière, w.normandie.nm] }
      - { es: "Ce matin, nous avons découvert une petite plage derrière les rochers.", en: "This morning we discovered a little beach behind the rocks.", altEs: ["Nous avons découvert une petite plage derrière les rochers ce matin."], grammar: [g.passe-compose-avoir], vocab: [w.découvrir, w.plage] }
      - { es: "C'est la plus belle plage de Bretagne.", en: "It's the most beautiful beach in Brittany.", grammar: [g.superlatives], vocab: [w.bretagne.nm], error: { wrong: "C'est la plus belle plage en Bretagne.", explain: "After a superlative, 'in' is de: de Bretagne, not en Bretagne.", grammar: g.superlatives } }
      - { es: "Rennes est une grande ville ; Brest est plus petite.", en: "Rennes is a big city; Brest is smaller.", grammar: [g.comparatives], vocab: [w.exemple], transform: { instruction: "Say Brest is less big than Rennes (moins … que)", answer: "Brest est moins grande que Rennes.", alt: ["Brest est moins grand que Rennes."], en: "Brest is smaller than Rennes." } }
      - { es: "J'ai envie d'explorer toute la côte, de Saint-Malo jusqu'à Quimper.", en: "I want to explore the whole coast, from Saint-Malo to Quimper.", altEs: ["J'ai envie d'explorer toute la côte, de Saint-Malo à Quimper."], altEn: ["I feel like exploring the whole coast, from Saint-Malo to Quimper."], grammar: [g.avoir-expressions], vocab: [w.explorer, w.côte] }
    exchanges:
      - q: { es: "Tu préfères la Bretagne ou la Normandie ?", en: "Do you prefer Brittany or Normandy?" }
        a: { es: "La Bretagne, mais les fromages normands sont meilleurs !", en: "Brittany, but Norman cheeses are better!" }
        alt: ["La Normandie, c'est plus près de Paris.", "Les deux !", "La Bretagne, c'est plus beau."]
        grammar: [g.comparatives, g.meilleur-mieux]
        vocab: [w.bretagne.nm, w.normand]
      - q: { es: "Qui est Jacques Cartier ?", en: "Who is Jacques Cartier?" }
        a: { es: "C'est un explorateur né à Saint-Malo ; il a exploré le Canada.", en: "He's an explorer born in Saint-Malo; he explored Canada." }
        alt: ["Un explorateur de Saint-Malo.", "C'est l'explorateur le plus célèbre de Saint-Malo."]
        grammar: [g.passe-compose-avoir]
        vocab: [w.explorateur, w.explorer]
      - q: { es: "Le Mont-Saint-Michel est breton ?", en: "Is Mont-Saint-Michel Breton?" }
        a: { es: "Non, il est normand ; pourtant, il est tout près de la Bretagne.", en: "No, it's Norman; yet it's very close to Brittany." }
        alt: ["Non, il est en Normandie.", "Non, il est normand."]
        grammar: [g.narrative-connectors]
        vocab: [w.normand, w.pourtant]
      - q: { es: "Il y a d'autres villes entourées de remparts en Bretagne ?", en: "Are there other towns surrounded by ramparts in Brittany?" }
        a: { es: "Oui, par exemple Concarneau.", en: "Yes, Concarneau for example." }
        alt: ["Oui, Concarneau, par exemple.", "Oui, il y en a plusieurs."]
        grammar: [g.il-y-a]
        vocab: [w.entourer, w.par-exemple]
      - q: { es: "Qu'est-ce que tu as découvert ici ?", en: "What did you discover here?" }
        a: { es: "Le beurre salé ! C'est la meilleure découverte du voyage.", en: "Salted butter! It's the best discovery of the trip." }
        alt: ["Les galettes !", "Le beurre salé, évidemment."]
        grammar: [g.superlatives, g.meilleur-mieux]
        vocab: [w.découvrir, w.découverte]
    texts:
      - title: "Blog : Bretagne ou Normandie ?"
        es: ["Les deux régions sont très différentes.", "La Normandie a des falaises blanches ; par contre, la Bretagne a des rochers roses à Ploumanac'h.", "Pour moi, la plus belle, c'est… les deux !"]
        en: ["The two regions are very different.", "Normandy has white cliffs; on the other hand, Brittany has pink rocks at Ploumanac'h.", "For me, the most beautiful one is… both!"]
        grammar: [g.superlatives]
        vocab: [w.par-contre, w.normandie.nm, w.bretagne.nm]
      - title: "Jacques Cartier"
        es: ["Jacques Cartier est né à Saint-Malo en 1491.", "En 1534, il a traversé l'Atlantique et il a exploré le Canada.", "C'est l'explorateur breton le plus célèbre."]
        en: ["Jacques Cartier was born in Saint-Malo in 1491.", "In 1534 he crossed the Atlantic and explored Canada.", "He's the most famous Breton explorer."]
        grammar: [g.superlatives, g.passe-compose-avoir]
        vocab: [w.explorateur, w.explorer, w.breton]
    spicy:
      - { es: "Ma meilleure découverte en Bretagne ? Ce n'est pas le beurre salé, c'est toi.", en: "My best discovery in Brittany? It's not salted butter, it's you.", grammar: [g.meilleur-mieux], vocab: [w.découverte, w.meilleur] }
      - { es: "Tu cherches un guide pour explorer la ville ? Moi, par exemple, ce soir.", en: "Looking for a guide to explore the town? Me, for example, tonight.", grammar: [g.present-er], vocab: [w.explorer, w.par-exemple, w.guide] }
      - { es: "Tu es plus intéressant que tous les explorateurs du musée.", en: "You're more interesting than all the explorers in the museum.", altEs: ["Tu es plus intéressante que tous les explorateurs du musée."], grammar: [g.comparatives], vocab: [w.explorateur, w.intéressant] }
      - { es: "Tu es breton, je suis normande : on se dispute pour le beurre ou on danse ?", en: "You're Breton, I'm Norman: shall we argue about butter or dance?", altEs: ["Tu es normand, je suis bretonne : on se dispute pour le beurre ou on danse ?"], grammar: [g.adjective-agreement], vocab: [w.breton, w.normand] }
      - { es: "D'ailleurs, ton accent breton est le plus mignon du monde.", en: "Besides, your Breton accent is the cutest in the world.", grammar: [g.superlatives], vocab: [w.d-ailleurs, w.breton] }
dialogues:
  - id: a2.u07.d1
    title: "Sur les remparts"
    context: "Léa, visiting from Paris, walks round the ramparts of Saint-Malo with Yann, a friend who lives there."
    lines:
      - { speaker: Léa, es: "Quelle vue ! C'est encore plus beau que sur les photos.", en: "What a view! It's even more beautiful than in the photos." }
      - { speaker: Yann, es: "Attends de voir la mer à marée haute : c'est le plus beau moment de la journée.", en: "Wait till you see the sea at high tide: it's the most beautiful moment of the day." }
      - { speaker: Léa, es: "Et là-bas, c'est Dinard ? C'est plus grand que Saint-Malo ?", en: "And over there, is that Dinard? Is it bigger than Saint-Malo?" }
      - { speaker: Yann, es: "Non, c'est beaucoup plus petit, mais les plages sont aussi belles qu'ici.", en: "No, it's much smaller, but the beaches are as beautiful as here." }
      - { speaker: Léa, es: "Qui est la statue, sur les remparts ?", en: "Who is the statue on the ramparts?" }
      - { speaker: Yann, es: "C'est Surcouf, le corsaire le plus célèbre de la ville. Il attaquait les navires anglais.", en: "It's Surcouf, the town's most famous corsair. He attacked English ships." }
      - { speaker: Léa, es: "Un pirate, quoi !", en: "A pirate, then!" }
      - { speaker: Yann, es: "Non, pas pareil ! Les corsaires travaillaient pour le roi.", en: "No, not the same! Corsairs worked for the king." }
      - { speaker: Léa, es: "D'accord. Et pour manger, tu connais une bonne crêperie ?", en: "OK. And to eat, do you know a good crêperie?" }
      - { speaker: Yann, es: "La meilleure de Saint-Malo est rue Jacques-Cartier. Les galettes sont meilleures qu'à Paris, tu verras !", en: "The best one in Saint-Malo is on rue Jacques-Cartier. The galettes are better than in Paris, you'll see!" }
    questions:
      - { q: "Selon Yann, quel est le plus beau moment de la journée ?", options: ["La marée basse", "La marée haute", "Le matin"], answer: 1, explain: "Yann says the sea at high tide is the most beautiful moment of the day." }
      - { q: "Comment est Dinard ?", options: ["Plus grand que Saint-Malo", "Plus petit que Saint-Malo, avec de belles plages", "Sans plages"], answer: 1, explain: "Dinard is much smaller, but its beaches are as beautiful as Saint-Malo's." }
      - { q: "Qui est Surcouf ?", options: ["Un roi", "Un pirate", "Un corsaire"], answer: 2, explain: "Surcouf was a corsair; Yann insists that corsairs are not the same as pirates because they worked for the king." }
      - { q: "Où sont les meilleures galettes, selon Yann ?", options: ["À Paris", "À Dinard", "Rue Jacques-Cartier, à Saint-Malo"], answer: 2, explain: "Yann recommends a crêperie on rue Jacques-Cartier." }
