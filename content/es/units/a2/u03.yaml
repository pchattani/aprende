id: a2.u03
title: Cuando era niño
lessons:
  - id: a2.u03.l1
    title: Antes vivía en un pueblo
    teach: [g.imperfect]
    tip: "The imperfect describes how things were: vivía, tenía, era."
    vocab: [w.antes, w.de-nino, w.de-pequeno, w.en-aquella-epoca, w.colegio, w.instituto, w.recreo, w.maestro, w.patio, w.companero.phr, w.uniforme, w.recuerdo, w.pueblo.phr, w.verano.phr]
    sentences:
      - { es: "Cuando era niño, vivía en un pueblo pequeño.", en: "When I was a child, I lived in a small village.", grammar: [g.imperfect, g.imperfect-uses], vocab: [w.de-nino, w.pueblo.phr] }
      - { es: "Antes no había internet en casa.", en: "Before, there was no internet at home.", grammar: [g.imperfect], vocab: [w.antes, w.haber] }
      - { es: "De pequeña iba al colegio a pie.", en: "When I was little I walked to school.", grammar: [g.imperfect], vocab: [w.de-pequeno, w.colegio, w.ir] }
      - { es: "Mi maestro era muy amable y nos contaba cuentos.", en: "My teacher was very kind and told us stories.", grammar: [g.imperfect], vocab: [w.maestro, w.escuchar.phr] }
      - { es: "En el recreo jugábamos al fútbol en el patio.", en: "At break we played football in the playground.", grammar: [g.imperfect], vocab: [w.recreo, w.patio, w.jugar] }
      - { es: "Llevábamos uniforme en el instituto.", en: "We wore a uniform at secondary school.", grammar: [g.imperfect], vocab: [w.uniforme, w.instituto] }
      - { es: "Mis compañeros de clase eran muy divertidos.", en: "My classmates were great fun.", grammar: [g.imperfect], vocab: [w.companero.phr, w.divertido] }
      - { es: "En aquella época mis padres trabajaban mucho.", en: "At that time my parents worked a lot.", grammar: [g.imperfect-uses], vocab: [w.en-aquella-epoca, w.trabajar] }
      - { es: "Todos los veranos íbamos al pueblo de mis abuelos.", en: "Every summer we went to my grandparents' village.", grammar: [g.imperfect-uses], vocab: [w.verano.phr, w.abuelos.phr] }
      - { es: "Tengo muy buenos recuerdos de mi infancia.", en: "I have very good memories of my childhood.", grammar: [g.tener-present], vocab: [w.recuerdo, w.infancia] }
      - { es: "Mi abuela tenía una casa con un jardín enorme.", en: "My grandmother had a house with a huge garden.", grammar: [g.imperfect-uses], vocab: [w.tener, w.jardin] }
      - { es: "Éramos cinco hermanos y dormíamos en dos habitaciones.", en: "There were five of us siblings and we slept in two rooms.", grammar: [g.imperfect], vocab: [w.ser, w.dormir], error: { wrong: "Eramos cinco hermanos y dormíamos en dos habitaciones.", explain: "The nosotros imperfect of ser is éramos, with an accent.", grammar: g.imperfect } }
      - { es: "Yo veía dibujos animados por la mañana.", en: "I used to watch cartoons in the morning.", grammar: [g.imperfect], vocab: [w.ver, w.dibujos-animados], transform: { instruction: "Change to 'we'", answer: "Veíamos dibujos animados por la mañana.", alt: ["Nosotros veíamos dibujos animados por la mañana."] } }
  - id: a2.u03.l2
    title: Juegos y juguetes
    teach: [g.imperfect-uses]
    vocab: [w.juguete, w.muneca, w.pelota, w.dibujos-animados, w.comic, w.tebeo, w.bicicleta, w.columpio, w.mascota, w.caramelo, w.cuento, w.montar, w.saltar, w.esconderse, w.helado.phr]
    sentences:
      - { es: "Mi juguete favorito era un coche rojo.", en: "My favourite toy was a red car.", grammar: [g.imperfect-uses], vocab: [w.juguete, w.favorito] }
      - { es: "Mi hermana jugaba con muñecas y yo con la pelota.", en: "My sister played with dolls and I with the ball.", grammar: [g.imperfect-uses], vocab: [w.muneca, w.pelota] }
      - { es: "Los sábados veíamos dibujos animados y leíamos cómics.", en: "On Saturdays we watched cartoons and read comics.", grammar: [g.imperfect-uses], vocab: [w.dibujos-animados, w.comic] }
      - { es: "Mi padre coleccionaba tebeos antiguos.", en: "My father collected old comic books.", grammar: [g.imperfect-uses], vocab: [w.tebeo, w.antiguo] }
      - { es: "Montaba en bicicleta por el barrio con mis amigos.", en: "I rode my bike around the neighbourhood with my friends.", grammar: [g.imperfect-uses], vocab: [w.montar, w.bicicleta] }
      - { es: "En el parque había columpios y nosotros saltábamos y corríamos.", en: "In the park there were swings and we jumped and ran.", grammar: [g.imperfect], vocab: [w.columpio, w.saltar, w.correr] }
      - { es: "Teníamos una mascota: un gato que se llamaba Misi.", en: "We had a pet: a cat called Misi.", grammar: [g.imperfect-uses], vocab: [w.mascota, w.gato] }
      - { es: "Mi abuelo siempre me daba caramelos.", en: "My grandfather always gave me sweets.", grammar: [g.imperfect-uses], vocab: [w.caramelo, w.dar] }
      - { es: "Antes de dormir, mi madre me leía un cuento.", en: "Before bed, my mother read me a story.", grammar: [g.imperfect-uses], vocab: [w.cuento, w.leer] }
      - { es: "Nos escondíamos detrás de los árboles.", en: "We hid behind the trees.", grammar: [g.imperfect], vocab: [w.esconderse, w.arbol] }
      - { es: "Los domingos tomábamos un helado en la plaza.", en: "On Sundays we had an ice cream in the square.", grammar: [g.imperfect-uses], vocab: [w.helado.phr, w.plaza] }
      - { es: "¿A qué jugabas de pequeño? — Jugaba al escondite.", en: "What did you play as a child? — I played hide-and-seek.", grammar: [g.imperfect-uses], vocab: [w.jugar, w.de-pequeno] }
      - { es: "Mi hermano montaba a caballo en el pueblo.", en: "My brother rode horses in the village.", grammar: [g.imperfect-uses], vocab: [w.montar, w.caballo], transform: { instruction: "Change to 'my brothers' (plural)", answer: "Mis hermanos montaban a caballo en el pueblo." } }
  - id: a2.u03.l3
    title: Solía…
    teach: [g.soler]
    vocab: [w.soler, w.pelearse, w.obedecer, w.castigar, w.portarse, w.travieso, w.obediente, w.molestar, w.soñar, w.tener-miedo.phr, w.oscuridad, w.abuelos.phr, w.escuchar.phr]
    sentences:
      - { es: "Solía levantarme muy temprano para ir al colegio.", en: "I used to get up very early to go to school.", grammar: [g.soler], vocab: [w.soler, w.levantarse] }
      - { es: "Mis hermanos y yo solíamos pelearnos por la televisión.", en: "My brothers and I used to fight over the television.", grammar: [g.soler], vocab: [w.pelearse, w.television] }
      - { es: "Yo era muy travieso y no obedecía a mis padres.", en: "I was very naughty and didn't obey my parents.", grammar: [g.imperfect-uses], vocab: [w.travieso, w.obedecer] }
      - { es: "Mi hermana, en cambio, era muy obediente.", en: "My sister, on the other hand, was very obedient.", grammar: [g.connectors-contrast], vocab: [w.obediente, w.hermana] }
      - { es: "Cuando me portaba mal, mi madre me castigaba sin postre.", en: "When I behaved badly, my mother punished me with no dessert.", grammar: [g.mientras-cuando], vocab: [w.portarse, w.castigar, w.postre] }
      - { es: "Siempre molestaba a mi hermano mayor.", en: "I was always bothering my older brother.", grammar: [g.imperfect-uses], vocab: [w.molestar, w.mayor] }
      - { es: "Soñaba con ser futbolista.", en: "I dreamt of being a footballer.", grammar: [g.prepositions-verbs], vocab: [w.soñar, w.futbol], error: { wrong: "Soñaba de ser futbolista.", explain: "soñar con.", grammar: g.prepositions-verbs } }
      - { es: "Tenía miedo de la oscuridad.", en: "I was afraid of the dark.", grammar: [g.tener-expressions], vocab: [w.tener-miedo.phr, w.oscuridad] }
      - { es: "Mis abuelos solían contarnos cuentos por la noche.", en: "My grandparents used to tell us stories at night.", grammar: [g.soler], vocab: [w.escuchar.phr, w.abuelos.phr] }
      - { es: "¿Qué solías hacer los domingos?", en: "What did you usually do on Sundays?", grammar: [g.soler], vocab: [w.soler, w.domingo] }
      - { es: "Solíamos comer todos juntos en casa de los abuelos.", en: "We used to eat all together at our grandparents' house.", grammar: [g.soler], vocab: [w.abuelos.phr, w.juntos] }
      - { es: "Mi padre suele leer el periódico después de cenar.", en: "My father usually reads the paper after dinner.", grammar: [g.soler], vocab: [w.soler, w.periodico] }
      - { es: "Ella solía jugar en la calle.", en: "She used to play in the street.", grammar: [g.soler], vocab: [w.soler, w.jugar], transform: { instruction: "Change to 'you all' (vosotros)", answer: "Solíais jugar en la calle.", alt: ["Vosotros solíais jugar en la calle."] } }
  - id: a2.u03.l4
    title: El mundo de antes
    teach: [g.imperfect]
    vocab: [w.cambiar.phr, w.tranvia, w.fabrica, w.campo.phr, w.radio, w.gallina, w.vaca, w.caballo, w.arbol, w.flor, w.estrella]
    sentences:
      - { es: "Mi ciudad ha cambiado mucho: antes había tranvías.", en: "My city has changed a lot: before there were trams.", grammar: [g.imperfect], vocab: [w.cambiar.phr, w.tranvia] }
      - { es: "Mi abuelo trabajaba en una fábrica de coches.", en: "My grandfather worked in a car factory.", grammar: [g.imperfect-uses], vocab: [w.fabrica, w.trabajar] }
      - { es: "En el campo no había luz eléctrica.", en: "In the countryside there was no electric light.", grammar: [g.imperfect], vocab: [w.campo.phr, w.luz] }
      - { es: "Por la noche escuchábamos la radio.", en: "At night we listened to the radio.", grammar: [g.imperfect-uses], vocab: [w.radio, w.escuchar] }
      - { es: "Mis abuelos tenían gallinas, dos vacas y un caballo.", en: "My grandparents had hens, two cows and a horse.", grammar: [g.imperfect-uses], vocab: [w.gallina, w.vaca, w.caballo] }
      - { es: "Delante de la casa había un árbol enorme.", en: "In front of the house there was a huge tree.", grammar: [g.imperfect], vocab: [w.arbol, w.delante] }
      - { es: "Mi madre cultivaba flores en el jardín.", en: "My mother grew flowers in the garden.", grammar: [g.imperfect-uses], vocab: [w.flor, w.jardin] }
      - { es: "Por la noche veíamos muchas estrellas.", en: "At night we saw lots of stars.", grammar: [g.imperfect-uses], vocab: [w.estrella, w.ver] }
      - { es: "La gente no tenía móvil y escribía cartas.", en: "People didn't have mobile phones and wrote letters.", grammar: [g.imperfect-uses], vocab: [w.movil, w.escribir] }
      - { es: "Las tiendas cerraban a mediodía.", en: "Shops closed at noon.", grammar: [g.imperfect-uses], vocab: [w.cerrar, w.mediodia] }
      - { es: "Entonces los niños jugaban en la calle hasta la noche.", en: "Back then children played in the street until nightfall.", grammar: [g.imperfect-uses], vocab: [w.entonces, w.jugar] }
      - { es: "Mis padres se conocían desde el colegio.", en: "My parents had known each other since school.", grammar: [g.imperfect-uses], vocab: [w.conocer, w.colegio] }
      - { es: "Antes la vida era más tranquila pero más dura.", en: "Life used to be quieter but harder.", grammar: [g.comparatives], vocab: [w.vida, w.tranquilo], error: { wrong: "Antes la vida estaba más tranquila pero más dura.", explain: "A general characteristic takes ser: la vida era tranquila.", grammar: g.ser-vs-estar-basics } }
dialogues:
  - id: a2.u03.d1
    title: Fotos antiguas
    context: Pablo and his grandfather look at old photos.
    lines:
      - { speaker: Pablo, es: "Abuelo, ¿quién es este niño con la bicicleta?", en: "Grandpa, who is this boy with the bicycle?" }
      - { speaker: Abuelo, es: "Soy yo. Tenía ocho años. En aquella época vivíamos en el pueblo.", en: "That's me. I was eight. Back then we lived in the village." }
      - { speaker: Pablo, es: "¿Y cómo era el pueblo?", en: "And what was the village like?" }
      - { speaker: Abuelo, es: "Era muy pequeño. No había coches, solo caballos y carros. Jugábamos en la calle todo el día.", en: "It was very small. There were no cars, only horses and carts. We played in the street all day." }
      - { speaker: Pablo, es: "¿Ibas al colegio?", en: "Did you go to school?" }
      - { speaker: Abuelo, es: "Sí, pero el colegio estaba a cinco kilómetros e íbamos a pie. El maestro era muy serio.", en: "Yes, but the school was five kilometres away and we walked. The teacher was very serious." }
      - { speaker: Pablo, es: "¿Tenías televisión?", en: "Did you have television?" }
      - { speaker: Abuelo, es: "¡No! Escuchábamos la radio por la noche. Y los domingos solíamos ir al cine del pueblo.", en: "No! We listened to the radio at night. And on Sundays we used to go to the village cinema." }
      - { speaker: Pablo, es: "¿Eras un niño travieso?", en: "Were you a naughty boy?" }
      - { speaker: Abuelo, es: "Un poco. Mi madre me castigaba a menudo porque me peleaba con mi hermano.", en: "A bit. My mother often punished me because I fought with my brother." }
    questions:
      - { q: "How old was the grandfather in the photo?", options: ["Five", "Eight", "Ten"], answer: 1 }
      - { q: "How did he get to school?", options: ["By bike", "By car", "On foot"], answer: 2 }
      - { q: "What did they do on Sundays?", options: ["Listened to the radio", "Went to the cinema", "Watched television"], answer: 1 }
