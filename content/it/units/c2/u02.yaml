id: c2.u02
title: "Nel mezzo del cammin"
lessons:
  - id: c2.u02.l1
    title: Per una selva oscura
    teach: [g.old-italian]
    vocab: [w.riveder-le-stelle, w.amor-cha-nullo-amato-amar-perdona, w.fatti-non-foste-a-viver-come-bruti, w.cammino, w.selva, w.oscuro, w.smarrito, w.inferno, w.purgatorio, w.paradiso, w.girone, w.cerchio, w.bolgia, w.contrappasso, w.dannato, w.anima, w.peccatore, w.virtù, w.beatitudine, w.aldilà, w.ultraterreno, w.canto, w.cantica, w.allegoria, w.allegorico, w.endecasillabo, w.semenza, w.bruto, w.ché, w.diritto.adj, w.parafrasi]
    tip: "Read Dante with a modern paraphrase beside the text: per often means 'through' or 'in', ché means 'because', and words like cammin are simply cut short."
    sentences:
      - { es: "Nel mezzo del cammin di nostra vita mi ritrovai per una selva oscura.", en: "Midway upon the journey of our life I found myself within a dark wood.", altEn: ["Halfway along the road of our life I found myself in a dark forest."], grammar: [g.old-italian], vocab: [w.cammino, w.selva, w.oscuro] }
      - { es: "In italiano di oggi diremmo: a metà della mia vita mi sono ritrovato in un bosco buio.", en: "In today's Italian we'd say: halfway through my life I found myself in a dark forest.", altEs: ["Oggi diremmo: a metà della mia vita mi sono ritrovato in un bosco buio."], grammar: [g.old-italian], vocab: [w.selva] }
      - { es: "Ché la diritta via era smarrita.", en: "For the straight way was lost.", altEn: ["Because the right path had been lost."], grammar: [g.old-italian], vocab: [w.smarrito, w.ché, w.diritto.adj], error: { wrong: "Che la diritta via era smarrita.", explain: "Causal ché (= perché, because) carries an accent; che without an accent means 'that' or 'which'.", grammar: g.old-italian } }
      - { es: "Lo giorno se n'andava.", en: "The day was departing.", altEn: ["The day was going away."], grammar: [g.old-italian], vocab: [w.giorno], note: "Inferno II, 1: lo before a consonant where modern Italian has il.", transform: { instruction: "Rewrite in modern Italian", answer: "Il giorno se ne andava.", alt: ["Il giorno stava finendo."], en: "The day was going away." } }
      - { es: "La Commedia è divisa in tre cantiche: Inferno, Purgatorio e Paradiso.", en: "The Comedy is divided into three cantiche: Inferno, Purgatorio and Paradiso.", altEs: ["La Commedia si divide in tre cantiche: Inferno, Purgatorio e Paradiso."], grammar: [g.old-italian], vocab: [w.cantica, w.inferno, w.purgatorio, w.paradiso] }
      - { es: "L'inferno di Dante ha nove cerchi, sempre più stretti verso il centro della Terra.", en: "Dante's Hell has nine circles, narrower and narrower towards the centre of the Earth.", altEs: ["L'inferno dantesco ha nove cerchi, sempre più stretti verso il centro della Terra."], grammar: [g.old-italian], vocab: [w.inferno, w.cerchio] }
      - { es: "Il settimo cerchio è diviso in tre gironi.", en: "The seventh circle is divided into three rings.", altEs: ["Il settimo cerchio si divide in tre gironi."], grammar: [g.old-italian], vocab: [w.girone, w.cerchio] }
      - { es: "Nell'ottavo cerchio i dannati sono divisi in dieci bolge.", en: "In the eighth circle the damned are divided into ten pits.", altEs: ["Nell'ottavo cerchio i dannati si dividono in dieci bolge."], grammar: [g.old-italian, g.plural-nouns], vocab: [w.dannato, w.bolgia], error: { wrong: "Nell'ottavo cerchio i dannati sono divisi in dieci bolgie.", explain: "Nouns in -gia after a consonant drop the i in the plural: bolgia → bolge, like spiaggia → spiagge.", grammar: g.plural-nouns } }
      - { es: "Il contrappasso è una pena che somiglia al peccato.", en: "The contrappasso is a punishment that mirrors the sin.", altEs: ["Il contrappasso è la pena che corrisponde al peccato."], grammar: [g.old-italian], vocab: [w.contrappasso] }
      - { es: "Paolo e Francesca, peccatori per amore, sono trascinati da un vento che non si ferma mai.", en: "Paolo and Francesca, sinners for love, are swept along by a wind that never stops.", grammar: [g.old-italian], vocab: [w.peccatore, w.contrappasso] }
      - { es: "«Amor, ch'a nullo amato amar perdona»: chi è amato non può fare a meno di amare.", en: "'Love, which pardons no one loved from loving': whoever is loved cannot help loving in return.", grammar: [g.old-italian], vocab: [w.amor-cha-nullo-amato-amar-perdona] }
      - { es: "«Fatti non foste a viver come bruti, ma per seguir virtute e canoscenza.»", en: "'You were not made to live like brutes, but to pursue virtue and knowledge.'", grammar: [g.old-italian], vocab: [w.fatti-non-foste-a-viver-come-bruti, w.bruto, w.virtù], note: "Inferno XXVI: Ulysses' speech. virtute = virtù, canoscenza = conoscenza." }
      - { es: "Ulisse dice ai compagni: «Considerate la vostra semenza».", en: "Ulysses tells his companions: 'Consider your origin.'", altEs: ["Ulisse dice ai suoi compagni: «Considerate la vostra semenza»."], grammar: [g.old-italian], vocab: [w.semenza] }
      - { es: "Dante si ritrova in una selva e poi comincia il suo viaggio ultraterreno.", en: "Dante finds himself in a forest and then begins his journey through the other world.", grammar: [g.old-italian, g.passato-remoto-forms], vocab: [w.ultraterreno, w.aldilà], transform: { instruction: "Rewrite with the passato remoto, as a story", answer: "Dante si ritrovò in una selva e poi cominciò il suo viaggio ultraterreno.", alt: [], en: "Dante found himself in a forest and then began his journey through the other world." } }
      - { es: "Il viaggio è un'allegoria: l'anima smarrita cerca la salvezza.", en: "The journey is an allegory: the lost soul seeks salvation.", altEs: ["Il viaggio è un'allegoria dell'anima smarrita che cerca la salvezza."], grammar: [g.old-italian], vocab: [w.allegoria, w.anima, w.allegorico] }
      - { es: "L'ultimo verso dell'Inferno è «E quindi uscimmo a riveder le stelle».", en: "The last line of the Inferno is 'And thence we came forth to see the stars again'.", grammar: [g.old-italian], vocab: [w.riveder-le-stelle, w.endecasillabo] }
    exchanges:
      - q: { es: "Qual è il primo verso della Commedia?", en: "What is the first line of the Comedy?" }
        a: { es: "«Nel mezzo del cammin di nostra vita»: lo sanno tutti gli italiani.", en: "'Midway upon the journey of our life': every Italian knows it." }
        alt: ["«Nel mezzo del cammin di nostra vita».", "Nel mezzo del cammin di nostra vita."]
        grammar: [g.old-italian]
        vocab: [w.cammino]
      - q: { es: "Perché si chiama Commedia?", en: "Why is it called a Comedy?" }
        a: { es: "Perché comincia male e finisce bene, e perché lo stile è medio; «Divina» l'ha aggiunto Boccaccio.", en: "Because it starts badly and ends well, and because its style is middling; Boccaccio added 'Divine'." }
        alt: ["Perché comincia all'inferno e finisce in paradiso.", "Perché finisce bene."]
        grammar: [g.old-italian]
        vocab: [w.inferno, w.paradiso]
      - q: { es: "Dove sono Paolo e Francesca?", en: "Where are Paolo and Francesca?" }
        a: { es: "Nel secondo cerchio, tra chi ha peccato per amore.", en: "In the second circle, among those who sinned for love." }
        alt: ["Nel secondo cerchio.", "All'inferno, nel secondo cerchio."]
        grammar: [g.old-italian]
        vocab: [w.cerchio, w.peccatore]
      - q: { es: "Che cosa vuol dire contrappasso?", en: "What does contrappasso mean?" }
        a: { es: "È la pena che corrisponde al peccato, come in uno specchio.", en: "It's the punishment that matches the sin, as if in a mirror." }
        alt: ["La pena che somiglia al peccato.", "Una punizione che rispecchia la colpa."]
        grammar: [g.old-italian]
        vocab: [w.contrappasso]
      - q: { es: "Hai letto tutta la Commedia?", en: "Have you read the whole Comedy?" }
        a: { es: "L'Inferno sì, il Purgatorio a metà, il Paradiso prima o poi.", en: "The Inferno yes, the Purgatorio halfway, the Paradiso sooner or later." }
        alt: ["Solo l'Inferno.", "Sì, tutte e tre le cantiche."]
        grammar: [g.old-italian]
        vocab: [w.purgatorio, w.cantica]
    texts:
      - title: "Appunti di lezione"
        es: ["Oggi abbiamo letto il primo canto dell'Inferno.", "Accanto al testo c'era la parafrasi in italiano moderno.", "Secondo il professore, quasi tutte le parole di base di Dante si usano ancora."]
        en: ["Today we read the first canto of the Inferno.", "Next to the text there was the paraphrase in modern Italian.", "According to the professor, almost all of Dante's basic words are still in use."]
        grammar: [g.old-italian]
        vocab: [w.canto, w.inferno, w.parafrasi]
      - title: "Bigliettino in un Bacio Perugina"
        es: ["«Amor, ch'a nullo amato amar perdona.»", "Dante, Inferno, canto quinto."]
        en: ["'Love, which pardons no one loved from loving.'", "Dante, Inferno, canto five."]
        grammar: [g.old-italian]
        vocab: [w.amor-cha-nullo-amato-amar-perdona, w.canto]
    spicy:
      - { es: "Nel mezzo del cammin di nostra cena mi ritrovai a guardare solo te.", en: "Midway upon the journey of our dinner I found myself looking only at you.", grammar: [g.old-italian], vocab: [w.cammino] }
      - { es: "Amor, ch'a nullo amato amar perdona: quindi adesso tocca a te.", en: "Love, which pardons no one loved from loving: so now it's your turn.", grammar: [g.old-italian], vocab: [w.amor-cha-nullo-amato-amar-perdona] }
      - { es: "Per contrappasso, chi non risponde ai messaggi dovrà leggerli per l'eternità.", en: "As a fitting punishment, whoever doesn't answer messages will have to read them for all eternity.", grammar: [g.old-italian], vocab: [w.contrappasso] }
      - { es: "Con te anche l'inferno sembra il paradiso, solo un po' più caldo.", en: "With you even hell feels like paradise, just a bit warmer.", grammar: [g.old-italian], vocab: [w.inferno, w.paradiso] }
      - { es: "Fatti non foste a viver come bruti, ma a ballare con me stasera.", en: "You were not made to live like brutes, but to dance with me tonight.", grammar: [g.old-italian], vocab: [w.fatti-non-foste-a-viver-come-bruti] }
  - id: c2.u02.l2
    title: Guelfi, ghibellini ed esuli
    teach: [g.old-italian, g.archaic-forms]
    vocab: [w.guelfo, w.ghibellino, w.fazione, w.comune-medievale, w.podestà, w.signoria, w.fiorino, w.esule, w.esilio, w.pellegrino, w.pellegrinaggio, w.dimandare, w.guatare, w.quivi, w.indi, w.onde, w.cotale, w.et, w.nullo, w.volgere]
    tip: "Old texts are full of small words that have changed: quivi (there), indi (then, thence), onde (whence, whereby), cotale (such), nullo (no one), et (and)."
    sentences:
      - { es: "Nel Duecento i comuni medievali erano divisi tra guelfi e ghibellini.", en: "In the thirteenth century the medieval communes were split between Guelphs and Ghibellines.", altEs: ["Nel Duecento i comuni medievali si dividevano tra guelfi e ghibellini."], grammar: [g.old-italian], vocab: [w.comune-medievale, w.guelfo, w.ghibellino] }
      - { es: "In generale i guelfi stavano con il papa e i ghibellini con l'imperatore.", en: "Generally the Guelphs sided with the pope and the Ghibellines with the emperor.", altEs: ["I guelfi stavano dalla parte del papa, i ghibellini da quella dell'imperatore."], grammar: [g.old-italian], vocab: [w.guelfo, w.ghibellino] }
      - { es: "A Firenze i guelfi si divisero poi in due fazioni, i Bianchi e i Neri.", en: "In Florence the Guelphs later split into two factions, the Whites and the Blacks.", altEs: ["Poi a Firenze i guelfi si divisero in due fazioni: i Bianchi e i Neri."], grammar: [g.old-italian, g.passato-remoto-forms], vocab: [w.fazione], transform: { instruction: "Rewrite with the passato prossimo", answer: "A Firenze i guelfi si sono poi divisi in due fazioni, i Bianchi e i Neri.", alt: ["Poi a Firenze i guelfi si sono divisi in due fazioni: i Bianchi e i Neri."], en: "In Florence the Guelphs then split into two factions, the Whites and the Blacks." } }
      - { es: "Nel 1302 i Neri condannarono Dante all'esilio.", en: "In 1302 the Blacks sentenced Dante to exile.", grammar: [g.old-italian, g.passive-essere], vocab: [w.esilio], transform: { instruction: "Make it passive, starting with Dante", answer: "Nel 1302 Dante fu condannato all'esilio dai Neri.", alt: ["Dante fu condannato all'esilio dai Neri nel 1302."], en: "In 1302 Dante was sentenced to exile by the Blacks." } }
      - { es: "Da esule, Dante passò da una corte all'altra e non rivide mai più Firenze.", en: "As an exile, Dante went from one court to another and never saw Florence again.", altEs: ["Da esule Dante girò di corte in corte e non rivide mai più Firenze."], grammar: [g.old-italian, g.passato-remoto-forms], vocab: [w.esule] }
      - { es: "Dante morì in esilio a Ravenna nel 1321.", en: "Dante died in exile in Ravenna in 1321.", altEs: ["Dante è morto in esilio a Ravenna nel 1321."], grammar: [g.old-italian, g.participles-irregular], vocab: [w.esilio], error: { wrong: "Dante è morito in esilio a Ravenna nel 1321.", explain: "morire has an irregular participle, morto (è morto); in historical narrative the passato remoto morì is more usual.", grammar: g.participles-irregular } }
      - { es: "Il podestà veniva da un'altra città, così da essere imparziale.", en: "The podestà came from another city, so as to be impartial.", altEs: ["Il podestà veniva da fuori città, per essere imparziale."], grammar: [g.old-italian], vocab: [w.podestà] }
      - { es: "Con la signoria il potere passò dal comune a una sola famiglia.", en: "With the signoria, power passed from the commune to a single family.", altEs: ["Con la signoria il potere passò dalle mani del comune a quelle di una sola famiglia."], grammar: [g.old-italian], vocab: [w.signoria, w.comune-medievale] }
      - { es: "Il fiorino d'oro di Firenze era accettato in tutta Europa.", en: "Florence's gold florin was accepted all over Europe.", altEs: ["Il fiorino d'oro fiorentino era accettato in tutta Europa."], grammar: [g.old-italian], vocab: [w.fiorino] }
      - { es: "Nel 1300 il papa proclamò il primo Giubileo, e Roma si riempì di pellegrini.", en: "In 1300 the pope proclaimed the first Jubilee, and Rome filled up with pilgrims.", grammar: [g.old-italian, g.passato-remoto-forms], vocab: [w.pellegrino] }
      - { es: "Nei testi antichi si trova et al posto di e: è una grafia presa dal latino.", en: "In old texts you find 'et' instead of 'e': it's a spelling taken from Latin.", altEs: ["Nei testi antichi si legge et invece di e: è una grafia presa dal latino."], grammar: [g.old-italian], vocab: [w.et] }
      - { es: "Quivi significa lì, e indi significa poi oppure da lì.", en: "'Quivi' means there, and 'indi' means then or from there.", altEs: ["Quivi vuol dire lì e indi vuol dire poi, oppure da lì."], grammar: [g.archaic-forms], vocab: [w.quivi, w.indi] }
      - { es: "Nei testi antichi onde può voler dire da dove oppure per cui.", en: "In old texts 'onde' can mean 'from where' or 'for which reason'.", grammar: [g.archaic-forms], vocab: [w.onde] }
      - { es: "Dimandare è la forma antica di domandare, e cotale vale tale.", en: "'Dimandare' is the old form of 'domandare' (to ask), and 'cotale' means 'such'.", grammar: [g.archaic-forms], vocab: [w.dimandare, w.cotale] }
      - { es: "Chi è scampato al naufragio si volge all'acqua pericolosa e guata.", en: "The man who has escaped the shipwreck turns back to the dangerous water and stares.", grammar: [g.archaic-forms], vocab: [w.volgere, w.guatare, w.naufragio], note: "Inferno I, 24: si volge a l'acqua perigliosa e guata. Guatare = to stare at." }
      - { es: "In «amor ch'a nullo amato», nullo significa nessuno.", en: "In 'amor ch'a nullo amato', 'nullo' means no one.", grammar: [g.archaic-forms], vocab: [w.nullo] }
    exchanges:
      - q: { es: "Dante era guelfo o ghibellino?", en: "Was Dante a Guelph or a Ghibelline?" }
        a: { es: "Guelfo, e per la precisione guelfo bianco.", en: "A Guelph, and to be precise a White Guelph." }
        alt: ["Guelfo.", "Era un guelfo bianco."]
        grammar: [g.old-italian]
        vocab: [w.guelfo, w.ghibellino]
      - q: { es: "Perché Dante fu esiliato?", en: "Why was Dante exiled?" }
        a: { es: "Perché i Neri presero il potere a Firenze e lo condannarono mentre era a Roma.", en: "Because the Blacks took power in Florence and sentenced him while he was in Rome." }
        alt: ["Per ragioni politiche.", "Perché la sua fazione perse il potere."]
        grammar: [g.old-italian, g.passato-remoto-forms]
        vocab: [w.esilio, w.fazione]
      - q: { es: "Che cosa vuol dire quivi?", en: "What does 'quivi' mean?" }
        a: { es: "Vuol dire lì, in quel luogo.", en: "It means there, in that place." }
        alt: ["Lì.", "Significa lì."]
        grammar: [g.archaic-forms]
        vocab: [w.quivi]
      - q: { es: "Dov'è sepolto Dante?", en: "Where is Dante buried?" }
        a: { es: "A Ravenna, dove morì in esilio nel 1321.", en: "In Ravenna, where he died in exile in 1321." }
        alt: ["A Ravenna.", "A Ravenna, non a Firenze."]
        grammar: [g.old-italian]
        vocab: [w.esilio]
      - q: { es: "Quanto valeva un fiorino?", en: "How much was a florin worth?" }
        a: { es: "Molto: era una delle monete più forti d'Europa, una specie di dollaro del Medioevo.", en: "A lot: it was one of the strongest currencies in Europe, a sort of dollar of the Middle Ages." }
        alt: ["Molto.", "Era una moneta d'oro molto forte."]
        grammar: [g.old-italian]
        vocab: [w.fiorino]
    texts:
      - title: "Didascalia al museo"
        es: ["Questo è un fiorino d'oro del 1252.", "Da una parte c'è il giglio di Firenze, dall'altra San Giovanni Battista.", "Circolava in tutta Europa."]
        en: ["This is a gold florin from 1252.", "On one side is the lily of Florence, on the other St John the Baptist.", "It circulated all over Europe."]
        grammar: [g.old-italian]
        vocab: [w.fiorino]
      - title: "Dante esule"
        es: ["Nel 1302 Dante è condannato all'esilio.", "Non rivedrà mai più Firenze.", "Muore a Ravenna nel 1321, poco dopo aver finito il Paradiso."]
        en: ["In 1302 Dante is sentenced to exile.", "He will never see Florence again.", "He dies in Ravenna in 1321, shortly after finishing the Paradiso."]
        grammar: [g.old-italian]
        vocab: [w.esilio, w.esule]
    spicy:
      - { es: "Guelfa o ghibellina, per me è lo stesso: basta che stasera esci con me.", en: "Guelph or Ghibelline, it's all the same to me: as long as you go out with me tonight.", altEs: ["Guelfo o ghibellino, per me è lo stesso: basta che stasera esci con me."], grammar: [g.old-italian], vocab: [w.guelfo, w.ghibellino] }
      - { es: "Se mi mandi in esilio dal tuo cuore, divento un esule come Dante, ma scrivo peggio.", en: "If you exile me from your heart, I'll become an exile like Dante, only a worse writer.", grammar: [g.old-italian], vocab: [w.esilio, w.esule] }
      - { es: "Quivi t'aspetto, indi ti bacio: parlo antico, ma le intenzioni sono moderne.", en: "Here I'll wait for you, thence I'll kiss you: my language is old, but my intentions are modern.", altEs: ["Quivi ti aspetto, indi ti bacio: parlo antico, ma le intenzioni sono moderne."], grammar: [g.archaic-forms], vocab: [w.quivi, w.indi] }
      - { es: "Le nostre famiglie sono di due fazioni opposte: tu Roma, io Lazio. Ce la faremo?", en: "Our families belong to two opposing factions: you're Roma, I'm Lazio. Will we make it?", grammar: [g.old-italian], vocab: [w.fazione] }
      - { es: "La cena la offro io: non in fiorini, purtroppo, ma con tanto amore.", en: "Dinner's on me: not in florins, sadly, but with lots of love.", grammar: [g.old-italian], vocab: [w.fiorino] }
  - id: c2.u02.l3
    title: Core, speme e sospiri
    teach: [g.archaic-forms]
    vocab: [w.core, w.aere, w.loco, w.foco, w.uopo, w.alma, w.speme, w.lume, w.amor, w.mortal, w.fia, w.ahi, w.lasso, w.meco, w.fiero, w.ermo, w.colle, w.rimembrare, w.piuma, w.mirare, w.rimirare, w.favella, w.sembiante, w.vaghezza, w.fanciullo, w.donzella, w.chioma, w.sospiro, w.affanno, w.membro, w.dolere]
    tip: "Poetic words (core, speme, alma, lume, rimembrare) live on in literature, opera and songs; in everyday prose they sound parodic, so use them only with a wink."
    sentences:
      - { es: "Nelle canzoni core sta per cuore: non è un errore.", en: "In songs 'core' stands for 'cuore' (heart): it isn't a mistake.", altEs: ["Nelle canzoni core vuol dire cuore: non è un errore."], grammar: [g.archaic-forms], vocab: [w.core] }
      - { es: "La donna è mobile qual piuma al vento.", en: "Woman is fickle like a feather in the wind.", grammar: [g.archaic-forms], vocab: [w.piuma], note: "Verdi, Rigoletto: qual = come." }
      - { es: "Silvia, rimembri ancora quel tempo della tua vita mortale?", en: "Silvia, do you still remember that time of your mortal life?", grammar: [g.archaic-forms], vocab: [w.rimembrare], note: "Leopardi, A Silvia.", transform: { instruction: "Rewrite in everyday Italian", answer: "Silvia, ti ricordi ancora quel tempo della tua vita mortale?", alt: ["Silvia, ricordi ancora quel tempo della tua vita mortale?"], en: "Silvia, do you still remember that time of your mortal life?" } }
      - { es: "«Ahi lasso!» è il modo antico di dire «povero me».", en: "'Ahi lasso!' is the old way of saying 'poor me'.", altEs: ["«Ahi lasso!» era il modo antico di dire «povero me»."], altEn: ["'Alas!' is the old way of saying 'woe is me'."], grammar: [g.archaic-forms], vocab: [w.ahi, w.lasso] }
      - { es: "Lume è più poetico di luce, ma resiste in espressioni come a lume di candela.", en: "'Lume' is more poetic than 'luce', but it survives in expressions like 'by candlelight'.", grammar: [g.archaic-forms], vocab: [w.lume] }
      - { es: "Nei libretti d'opera si incontrano spesso alma, foco, loco e aere.", en: "In opera libretti you often come across 'alma', 'foco', 'loco' and 'aere' (soul, fire, place, air).", grammar: [g.archaic-forms], vocab: [w.alma, w.foco, w.loco, w.aere] }
      - { es: "Oggi «è d'uopo» si dice solo per scherzo: «è d'uopo un caffè».", en: "Today 'è d'uopo' is only said as a joke: a coffee is called for.", grammar: [g.archaic-forms], vocab: [w.uopo] }
      - { es: "Il poeta mira la donna amata e ne rimira il dolce sembiante.", en: "The poet gazes at his beloved and contemplates her sweet countenance again and again.", grammar: [g.archaic-forms], vocab: [w.mirare, w.rimirare, w.sembiante] }
      - { es: "La donzella delle poesie ha sempre la chioma bionda e il guardo sereno.", en: "The maiden in poems always has fair hair and a serene gaze.", grammar: [g.archaic-forms], vocab: [w.donzella, w.chioma] }
      - { es: "Da fanciullo leggeva favole; da vecchio leggeva Petrarca.", en: "As a boy he read fables; as an old man he read Petrarca.", grammar: [g.archaic-forms], vocab: [w.fanciullo] }
      - { es: "Il core mi duole.", en: "My heart aches.", grammar: [g.archaic-forms], vocab: [w.core, w.dolere], transform: { instruction: "Rewrite in everyday Italian", answer: "Mi fa male il cuore.", alt: ["Il cuore mi fa male.", "Ho il cuore che mi fa male."], en: "My heart hurts." } }
      - { es: "Tra un sospiro e l'altro, il poeta racconta il suo affanno e la vaghezza di lei.", en: "Between one sigh and the next, the poet tells of his torment and of her charm.", grammar: [g.archaic-forms], vocab: [w.sospiro, w.affanno, w.vaghezza] }
      - { es: "Spero che domani faccia bel tempo.", en: "I hope the weather's nice tomorrow.", grammar: [g.archaic-forms, g.congiuntivo-opinion], vocab: [w.speme], error: { wrong: "Ho speme che domani faccia bel tempo.", explain: "Speme is poetic: in everyday Italian it sounds parodic. Say spero, or la speranza.", grammar: g.archaic-forms } }
      - { es: "Dopo il pellegrinaggio avevo tutte le membra stanche.", en: "After the pilgrimage all my limbs were tired.", altEs: ["Dopo il pellegrinaggio avevo le membra tutte stanche."], grammar: [g.archaic-forms, g.irregular-plurals-body], vocab: [w.membro], error: { wrong: "Dopo il pellegrinaggio avevo tutti i membri stanchi.", explain: "membro has two plurals: i membri (members of a group) and le membra (the limbs of the body).", grammar: g.irregular-plurals-body } }
      - { es: "Farinata resta fiero anche all'inferno: guarda Dante dall'alto in basso.", en: "Farinata stays proud even in Hell: he looks down on Dante.", altEs: ["Anche all'inferno Farinata resta fiero e guarda Dante dall'alto in basso."], grammar: [g.archaic-forms], vocab: [w.fiero] }
      - { es: "«Fia» è la forma antica di «sarà»: lo trovi nei poeti, non nei giornali.", en: "'Fia' is the old form of 'sarà' (will be): you find it in poets, not in newspapers.", grammar: [g.archaic-forms], vocab: [w.fia] }
    exchanges:
      - q: { es: "Perché nella canzone dice core e non cuore?", en: "Why does the song say 'core' and not 'cuore'?" }
        a: { es: "Perché è la forma poetica, e poi ha una sillaba in meno.", en: "Because it's the poetic form, and besides it has one syllable less." }
        alt: ["È la forma poetica.", "Per la metrica."]
        grammar: [g.archaic-forms]
        vocab: [w.core]
      - q: { es: "Posso scrivere speme in un tema?", en: "Can I write 'speme' in an essay?" }
        a: { es: "Solo se citi un poeta; altrimenti scrivi speranza.", en: "Only if you're quoting a poet; otherwise write 'speranza'." }
        alt: ["Meglio di no.", "No, scrivi speranza."]
        grammar: [g.archaic-forms]
        vocab: [w.speme]
      - q: { es: "Che cosa vuol dire rimembrare?", en: "What does 'rimembrare' mean?" }
        a: { es: "È la forma poetica di ricordare.", en: "It's the poetic form of 'ricordare' (to remember)." }
        alt: ["Ricordare.", "Vuol dire ricordare."]
        grammar: [g.archaic-forms]
        vocab: [w.rimembrare]
      - q: { es: "Ceniamo a lume di candela?", en: "Shall we have dinner by candlelight?" }
        a: { es: "Volentieri, così non si vede che ho bruciato l'arrosto.", en: "Gladly, that way no one will see I've burnt the roast." }
        alt: ["Volentieri!", "Che idea romantica!"]
        grammar: [g.archaic-forms]
        vocab: [w.lume]
      - q: { es: "Chi canta La donna è mobile?", en: "Who sings 'La donna è mobile'?" }
        a: { es: "Il Duca di Mantova, nel Rigoletto di Verdi.", en: "The Duke of Mantua, in Verdi's Rigoletto." }
        alt: ["Il Duca, nel Rigoletto.", "È un'aria del Rigoletto."]
        grammar: [g.archaic-forms]
        vocab: [w.piuma]
    texts:
      - title: "Piccolo glossario poetico"
        es: ["Core: cuore.", "Speme: speranza.", "Alma: anima.", "Rimembrare: ricordare."]
        en: ["Core: heart.", "Speme: hope.", "Alma: soul.", "Rimembrare: to remember."]
        grammar: [g.archaic-forms]
        vocab: [w.core, w.speme, w.alma, w.rimembrare]
      - title: "Messaggio a un'amica"
        es: ["Ahi lasso, domani ho l'esame di letteratura!", "Ho la speme di passarlo, ma il core mi duole.", "Se lo passo, è d'uopo una pizza."]
        en: ["Alas, tomorrow I have my literature exam!", "I have hope of passing it, but my heart aches.", "If I pass, a pizza is called for."]
        grammar: [g.archaic-forms]
        vocab: [w.ahi, w.lasso, w.speme, w.core, w.uopo]
    spicy:
      - { es: "Il mio core è tuo, ma il dolce lo dividiamo a metà.", en: "My heart is yours, but we're splitting the dessert.", grammar: [g.archaic-forms], vocab: [w.core] }
      - { es: "Ti rimiro da mezz'ora e tu guardi ancora il telefono.", en: "I've been gazing at you for half an hour and you're still looking at your phone.", grammar: [g.archaic-forms], vocab: [w.rimirare] }
      - { es: "Vieni meco a cena? Prometto lume di candela e niente sonetti.", en: "Will you come to dinner with me? I promise candlelight and no sonnets.", grammar: [g.archaic-forms], vocab: [w.meco, w.lume] }
      - { es: "La tua chioma al vento mi toglie la favella.", en: "Your hair in the wind leaves me speechless.", grammar: [g.archaic-forms], vocab: [w.chioma, w.favella] }
      - { es: "Ahi lasso, sei così bella che mi dimentico perfino come ti chiami.", en: "Alas, you're so beautiful that I even forget your name.", altEs: ["Ahi lasso, sei così bello che mi dimentico perfino come ti chiami."], grammar: [g.archaic-forms], vocab: [w.ahi, w.lasso] }
  - id: c2.u02.l4
    title: Chiare, fresche et dolci acque
    teach: [g.poetic-syntax]
    vocab: [w.dolce-stil-novo, w.stilnovista, w.amor-cortese, w.donna-angelo, w.canzoniere, w.madrigale, w.ballata, w.novellino, w.decameron, w.cornice, w.mecenatismo, w.umanesimo, w.umanista, w.musa, w.ispirato, w.sublime, w.ruscello, w.fronda, w.aurora, w.crepuscolo, w.imbrunire, w.astro, w.firmamento, w.flutto, w.lido, w.sponda, w.vascello, w.naufragare, w.naufragio]
    tip: "To read verse, first rebuild the prose order (la costruzione): find the verb, put the subject and object back in place, then reread for the music."
    sentences:
      - { es: "Chiare, fresche et dolci acque: Petrarca mette gli aggettivi prima del nome.", en: "Clear, fresh and sweet waters: Petrarca puts the adjectives before the noun.", grammar: [g.poetic-syntax], vocab: [w.et], transform: { instruction: "Modernise the phrase: modern spelling and adjectives after the noun", answer: "Acque chiare, fresche e dolci.", alt: ["Acque chiare, fresche e dolci"], en: "Clear, fresh and sweet waters." } }
      - { es: "Nel Canzoniere Petrarca canta per tutta la vita il suo amore per Laura.", en: "In the Canzoniere Petrarca sings of his love for Laura all his life.", altEs: ["Nel Canzoniere Petrarca canta il suo amore per Laura per tutta la vita."], grammar: [g.poetic-syntax], vocab: [w.canzoniere] }
      - { es: "Sempre caro mi fu quest'ermo colle.", en: "This lonely hill was always dear to me.", grammar: [g.poetic-syntax, g.word-order-marked], vocab: [w.ermo, w.colle], note: "Leopardi, L'infinito: anastrophe.", transform: { instruction: "Rebuild the prose order", answer: "Questo colle solitario mi fu sempre caro.", alt: ["Quest'ermo colle mi fu sempre caro.", "Questo colle solitario mi è sempre stato caro."], en: "This lonely hill was always dear to me." } }
      - { es: "Per i poeti stilnovisti la donna angelo porta l'uomo verso Dio.", en: "For the stilnovo poets the angelic woman leads man towards God.", grammar: [g.poetic-syntax], vocab: [w.stilnovista, w.donna-angelo] }
      - { es: "L'amor cortese arriva in Italia dalla poesia della Provenza.", en: "Courtly love reaches Italy from the poetry of Provence.", grammar: [g.poetic-syntax], vocab: [w.amor-cortese] }
      - { es: "Tanto gentile e tanto onesta pare la donna mia quand'ella altrui saluta.", en: "So gentle and so modest seems my lady when she greets others.", grammar: [g.poetic-syntax], vocab: [w.donna-angelo], note: "Dante, Vita nuova: the verb pare comes before its subject, la donna mia." }
      - { es: "Amor e cor sono forme tronche, normali in poesia ma strane in prosa.", en: "'Amor' and 'cor' are truncated forms, normal in poetry but odd in prose.", grammar: [g.poetic-syntax], vocab: [w.amor, w.core] }
      - { es: "Il Decameron ha una cornice: dieci giovani fuggono dalla peste e si raccontano cento novelle.", en: "The Decameron has a frame story: ten young people flee the plague and tell each other a hundred tales.", grammar: [g.poetic-syntax], vocab: [w.decameron, w.cornice] }
      - { es: "Ho letto una novella del Decameron.", en: "I read a story from the Decameron.", grammar: [g.poetic-syntax, g.false-friends-advanced], vocab: [w.decameron], error: { wrong: "Ho letto un romanzo del Decameron.", explain: "The Decameron is made of novelle (short stories), not romanzi (novels): novella and romanzo are false friends for English speakers.", grammar: g.false-friends-advanced } }
      - { es: "Prima del Decameron c'era già il Novellino, una raccolta di racconti brevi.", en: "Before the Decameron there was already the Novellino, a collection of short tales.", grammar: [g.poetic-syntax], vocab: [w.novellino] }
      - { es: "Madrigali e ballate erano poesie fatte per essere cantate.", en: "Madrigals and ballads were poems made to be sung.", grammar: [g.poetic-syntax], vocab: [w.madrigale, w.ballata] }
      - { es: "Con l'Umanesimo gli umanisti tornano a studiare i classici latini e greci.", en: "With Humanism, humanists go back to studying the Latin and Greek classics.", grammar: [g.poetic-syntax], vocab: [w.umanesimo, w.umanista] }
      - { es: "Senza il mecenatismo dei signori, molti artisti non avrebbero potuto lavorare.", en: "Without the patronage of the lords, many artists couldn't have worked.", grammar: [g.poetic-syntax, g.condizionale-passato], vocab: [w.mecenatismo] }
      - { es: "All'aurora il ruscello canta tra le fronde.", en: "At dawn the stream sings among the leafy branches.", grammar: [g.poetic-syntax], vocab: [w.aurora, w.ruscello, w.fronda] }
      - { es: "Al crepuscolo, o all'imbrunire, i primi astri si accendono nel firmamento.", en: "At twilight, or at dusk, the first stars light up in the firmament.", grammar: [g.poetic-syntax], vocab: [w.crepuscolo, w.imbrunire, w.astro, w.firmamento] }
      - { es: "Il vascello lotta contro i flutti e naufraga lontano dal lido.", en: "The ship battles the waves and is wrecked far from the shore.", grammar: [g.poetic-syntax], vocab: [w.vascello, w.flutto, w.naufragare, w.lido] }
    exchanges:
      - q: { es: "Chi era Laura?", en: "Who was Laura?" }
        a: { es: "La donna amata da Petrarca: la vide per la prima volta in una chiesa di Avignone nel 1327.", en: "The woman Petrarca loved: he first saw her in a church in Avignon in 1327." }
        alt: ["La donna amata da Petrarca.", "La donna del Canzoniere."]
        grammar: [g.poetic-syntax, g.passato-remoto-forms]
        vocab: [w.canzoniere]
      - q: { es: "Che cos'è la cornice del Decameron?", en: "What is the frame story of the Decameron?" }
        a: { es: "È la storia di dieci giovani che, per fuggire dalla peste, si raccontano novelle per dieci giorni.", en: "It's the story of ten young people who tell each other tales for ten days to escape the plague." }
        alt: ["La storia dei dieci giovani che fuggono dalla peste.", "Il racconto che contiene tutte le novelle."]
        grammar: [g.poetic-syntax]
        vocab: [w.cornice, w.decameron]
      - q: { es: "Che cos'era il dolce stil novo?", en: "What was the dolce stil novo?" }
        a: { es: "Un modo nuovo di scrivere d'amore: la donna diventa un angelo che salva.", en: "A new way of writing about love: the woman becomes an angel who saves." }
        alt: ["Una scuola di poesia d'amore del Duecento.", "La poesia della donna angelo."]
        grammar: [g.poetic-syntax]
        vocab: [w.dolce-stil-novo, w.donna-angelo]
      - q: { es: "Come si legge una poesia antica?", en: "How do you read an old poem?" }
        a: { es: "Prima si rifà la costruzione, mettendo le parole in ordine di prosa; poi si rilegge per la musica.", en: "First you rebuild the construction, putting the words in prose order; then you reread it for the music." }
        alt: ["Prima si cerca il verbo.", "Con la parafrasi accanto."]
        grammar: [g.poetic-syntax]
        vocab: [w.poetico]
      - q: { es: "Ti piace Petrarca?", en: "Do you like Petrarca?" }
        a: { es: "Moltissimo, ma dopo dieci sonetti su Laura ho bisogno di un caffè.", en: "Very much, but after ten sonnets about Laura I need a coffee." }
        alt: ["Moltissimo.", "Sì, soprattutto il Canzoniere."]
        grammar: [g.poetic-syntax]
        vocab: [w.canzoniere]
    texts:
      - title: "Compiti per giovedì"
        es: ["Leggete il sonetto «Tanto gentile e tanto onesta pare».", "Trovate le inversioni e rifate la costruzione.", "Poi spiegate perché la donna è un angelo."]
        en: ["Read the sonnet 'Tanto gentile e tanto onesta pare'.", "Find the inversions and rebuild the prose order.", "Then explain why the woman is an angel."]
        grammar: [g.poetic-syntax]
        vocab: [w.donna-angelo]
      - title: "Sul lago Trasimeno"
        es: ["All'imbrunire il lago diventa d'oro.", "Le fronde degli ulivi si muovono appena.", "Sembra una poesia di Petrarca, ma ci sono le zanzare."]
        en: ["At dusk the lake turns golden.", "The leafy branches of the olive trees barely move.", "It's like a poem by Petrarca, except there are mosquitoes."]
        grammar: [g.poetic-syntax]
        vocab: [w.imbrunire, w.fronda]
    spicy:
      - { es: "Sei la mia musa: ogni volta che ti vedo scrivo un sonetto pessimo.", en: "You're my muse: every time I see you I write a terrible sonnet.", grammar: [g.poetic-syntax], vocab: [w.musa] }
      - { es: "Petrarca ha scritto più di trecento poesie per Laura; io ti ho mandato un messaggio e mi sembra già tanto.", en: "Petrarca wrote over three hundred poems for Laura; I sent you a text and that already feels like a lot.", grammar: [g.poetic-syntax], vocab: [w.canzoniere] }
      - { es: "Non sono una donna angelo, ma all'aurora ti porto il caffè.", en: "I'm no angelic woman, but at dawn I'll bring you coffee.", grammar: [g.poetic-syntax], vocab: [w.donna-angelo, w.aurora] }
      - { es: "Sulla sponda del lago, all'imbrunire, con te: più stil novo di così non si può.", en: "On the lake shore, at dusk, with you: it doesn't get more stil novo than this.", grammar: [g.poetic-syntax], vocab: [w.sponda, w.imbrunire] }
      - { es: "Naufragare nei tuoi occhi? Volentieri, ma con il giubbotto di salvataggio.", en: "Drown in your eyes? Gladly, but with a life jacket on.", grammar: [g.poetic-syntax], vocab: [w.naufragare] }
dialogues:
  - id: c2.u02.d1
    title: Lezione di Dante a Perugia
    context: At the University for Foreigners in Perugia, Professoressa Ranieri asks Ingrid, a Swedish student, to read the opening of the Inferno.
    lines:
      - { speaker: Professoressa Ranieri, es: "Allora, Ingrid, cominci Lei: legga i primi tre versi.", en: "Right, Ingrid, you start: read the first three lines." }
      - { speaker: Ingrid, es: "Nel mezzo del cammin di nostra vita mi ritrovai per una selva oscura, ché la diritta via era smarrita.", en: "Midway upon the journey of our life I found myself within a dark wood, for the straight way was lost." }
      - { speaker: Professoressa Ranieri, es: "Benissimo. Che cosa nota nella lingua?", en: "Very good. What do you notice about the language?" }
      - { speaker: Ingrid, es: "Cammin è troncato, e qui per non vuol dire per: vuol dire attraverso, o in. Giusto?", en: "'Cammin' is truncated, and here 'per' doesn't mean 'for': it means 'through', or 'in'. Right?" }
      - { speaker: Professoressa Ranieri, es: "Esatto. E ché, con l'accento?", en: "Exactly. And 'ché', with the accent?" }
      - { speaker: Ingrid, es: "Vuol dire perché. Dante ha perso la strada giusta.", en: "It means 'because'. Dante has lost the right path." }
      - { speaker: Professoressa Ranieri, es: "Bene. E secondo Lei la selva è solo un bosco?", en: "Good. And in your view is the forest just a wood?" }
      - { speaker: Ingrid, es: "No, è un'allegoria: rappresenta il peccato, la confusione dell'anima.", en: "No, it's an allegory: it represents sin, the confusion of the soul." }
      - { speaker: Professoressa Ranieri, es: "Perfetto. Per giovedì leggete tutto il primo canto, con la parafrasi accanto.", en: "Perfect. For Thursday read the whole first canto, with the paraphrase beside it." }
      - { speaker: Ingrid, es: "Tutto il canto? Professoressa, abbia pietà: siamo solo al secondo semestre!", en: "The whole canto? Professor, have mercy: we're only in the second semester!" }
      - { speaker: Professoressa Ranieri, es: "Lasciate ogni speranza, voi ch'entrate nel mio corso!", en: "Abandon all hope, ye who enter my course!" }
    questions:
      - { q: "Che cosa significa per nel verso di Dante?", options: ["A favore di", "Attraverso, in", "Dopo"], answer: 1, explain: "Ingrid explains that per here means 'through' or 'in', as in old Italian." }
      - { q: "Secondo Ingrid, che cosa rappresenta la selva?", options: ["Un bosco vero vicino a Firenze", "Il peccato e la confusione dell'anima", "La città di Perugia"], answer: 1, explain: "She reads the forest as an allegory of sin and the soul's confusion." }
      - { q: "Che cosa devono fare gli studenti per giovedì?", options: ["Imparare a memoria il primo canto", "Leggere il primo canto con la parafrasi", "Scrivere un sonetto"], answer: 1, explain: "The professor asks them to read the whole first canto with the paraphrase beside it." }
      - { q: "Con quale verso di Dante scherza la professoressa?", options: ["Lasciate ogni speranza, voi ch'entrate", "E quindi uscimmo a riveder le stelle", "Amor, ch'a nullo amato amar perdona"], answer: 0, explain: "She adapts the inscription on the gate of Hell (Inferno III) to her own course." }
writing:
  - task: "Paraphrase the opening lines of Dante's Inferno in modern Italian and comment on their allegorical meaning."
    es: "«Nel mezzo del cammin di nostra vita / mi ritrovai per una selva oscura, / ché la diritta via era smarrita.»"
    min: 130
    max: 210
    use: [w.parafrasi, w.selva, w.smarrito, w.allegoria, w.cammino]
    grammar: [g.old-italian]
    expect:
      - { pattern: "\\b(parafrasi|in altre parole|cioè|significa|vuol dire)\\b", hint: "Paraphrase: cioè…, in altre parole…" }
      - { pattern: "\\ballegori", hint: "Comment on the allegory: il senso allegorico…" }
    model: { es: "La parafrasi di questi versi è semplice: a metà della vita, Dante si trovò in un bosco buio, perché aveva perso la strada giusta. Il poeta immagina che il viaggio cominci nel 1300, quando aveva trentacinque anni, cioè la metà dei settanta anni che, secondo la tradizione, erano la vita normale di un uomo. Ma il senso più profondo è allegorico: la selva oscura rappresenta il peccato, lo smarrimento in cui l'uomo cade quando si separa da Dio, mentre la diritta via è quella della virtù. Interessante è anche l'uso di «nostra vita»: Dante parla di sé, ma il suo smarrimento riguarda tutti noi. Per questo la Commedia non è soltanto il racconto di un viaggio nell'aldilà, ma un cammino che ogni lettore può riconoscere come proprio. Ancora oggi, dopo settecento anni, la selva oscura descrive perfettamente i momenti di crisi di ciascuno di noi.", en: "The paraphrase of these lines is simple: halfway through life, Dante found himself in a dark wood, because he had lost the right path. The poet imagines that the journey begins in 1300, when he was thirty-five, that is, half of the seventy years that, according to tradition, were the normal span of a man's life. But the deeper meaning is allegorical: the dark wood represents sin, the bewilderment into which man falls when he separates himself from God, while the straight way is that of virtue. The use of 'our life' is also interesting: Dante is speaking about himself, but his bewilderment concerns all of us. That is why the Comedy is not only the story of a journey into the afterlife, but a path that every reader can recognise as their own. Even today, seven hundred years later, the dark wood perfectly describes each of our moments of crisis." }
  - task: "Write a short historical explanation of the conflict between Guelphs and Ghibellines and of how Dante's exile shaped his work."
    min: 130
    max: 210
    use: [w.guelfo, w.ghibellino, w.fazione, w.esilio, w.comune-medievale]
    grammar: [g.old-italian]
    expect:
      - { pattern: "\\b(guelf|ghibellin)", hint: "Explain the factions: guelfi e ghibellini…" }
      - { pattern: "\\b(esili|esule)", hint: "Talk about Dante's exile: l'esilio, l'esule…" }
    model: { es: "Nel Duecento i comuni medievali dell'Italia centrale e settentrionale erano divisi tra due grandi fazioni: i guelfi, che sostenevano il papa, e i ghibellini, che stavano dalla parte dell'imperatore. A Firenze, dopo la vittoria dei guelfi, il conflitto non finì: il partito vincitore si divise a sua volta in guelfi bianchi e guelfi neri. Dante, che apparteneva ai bianchi e aveva ricoperto importanti cariche pubbliche, fu condannato nel 1302 con false accuse di corruzione. Da quel momento visse in esilio, ospite di varie corti, tra cui quella di Verona e infine quella di Ravenna, dove morì nel 1321. L'esperienza dell'esule lasciò un segno profondo nella sua opera: nella Commedia il poeta mette all'Inferno molti dei suoi nemici politici e fa annunciare il proprio esilio da un antenato, Cacciaguida. Senza quel dolore, forse, non avremmo il più grande poema della letteratura italiana.", en: "In the thirteenth century the medieval city-states of central and northern Italy were divided between two great factions: the Guelphs, who supported the Pope, and the Ghibellines, who sided with the Emperor. In Florence, after the Guelphs' victory, the conflict did not end: the winning party split in turn into White Guelphs and Black Guelphs. Dante, who belonged to the Whites and had held important public offices, was condemned in 1302 on false charges of corruption. From then on he lived in exile, a guest at various courts, including that of Verona and finally that of Ravenna, where he died in 1321. The experience of exile left a deep mark on his work: in the Comedy the poet puts many of his political enemies in Hell and has his own exile foretold by an ancestor, Cacciaguida. Without that pain, perhaps, we would not have the greatest poem in Italian literature." }
  - task: "Write a short love message in the style of Petrarch, using archaic forms (core, foco, alma, speme, lume, loco, ahi lasso), then explain in modern Italian the forms you used."
    min: 130
    max: 210
    use: [w.core, w.speme, w.alma, w.foco, w.lasso]
    grammar: [g.archaic-forms]
    expect:
      - { pattern: "\\b(core|speme|alma|foco|lasso|meco|loco|aere|lume|fia|uopo)\\b", hint: "Use archaic forms: core, foco, alma, speme…" }
      - { pattern: "\\b(cioè|significa|vuol dire|in italiano moderno|deriva)\\b", hint: "Explain them in modern Italian: core vuol dire cuore…" }
    model: { es: "Ecco il mio messaggio nello stile di Petrarca: «Ahi lasso, il core mio brucia d'un foco che non si spegne, et l'alma mia non trova pace. Ogni giorno rimiro il loco ove ti vidi, et la speme di rivederti è il solo lume che mi resta.» In italiano moderno potremmo dire: povero me, il mio cuore brucia di un fuoco che non si spegne, e la mia anima non trova pace; ogni giorno guardo il luogo dove ti ho vista, e la speranza di rivederti è l'unica luce che mi resta. Core e foco conservano la forma antica, senza la i di cuore e fuoco, mentre loco è la forma più vicina al latino di luogo. Alma deriva dal latino anima, speme è una forma poetica di speranza e lume significa luce. Ahi lasso è un lamento che oggi vuol dire povero me. Et, infine, è il modo latino di scrivere e.", en: "Here is my message in Petrarch's style: 'Alas, weary me, my heart burns with a fire that does not go out, and my soul finds no peace. Every day I gaze upon the place where I saw you, and the hope of seeing you again is the only light left to me.' In modern Italian we could say: poor me, my heart burns with a fire that does not go out, and my soul finds no peace; every day I look at the place where I saw you, and the hope of seeing you again is the only light I have left. Core and foco keep the old form, without the i of cuore and fuoco, while loco is the form closest to the Latin for luogo. Alma comes from Latin anima, speme is a poetic form of speranza and lume means light. Ahi lasso is a lament that today means poor me. Finally, et is the Latin way of writing e." }
  - task: "Write a short commentary on the opening of Petrarch's «Chiare, fresche et dolci acque»: the landscape, the poetic word order and enjambement, and the figure of Laura."
    es: "«Chiare, fresche et dolci acque, / ove le belle membra / pose colei che sola a me par donna»"
    min: 130
    max: 210
    use: [w.ruscello, w.sublime, w.membro, w.donna-angelo, w.canzoniere]
    grammar: [g.poetic-syntax]
    expect:
      - { pattern: "\\b(ordine delle parole|enjambement|sintassi|inversion|anastrofe|iperbato)", hint: "Comment on the syntax: l'ordine delle parole, l'enjambement…" }
      - { pattern: "\\blaura\\b", hint: "Talk about Laura." }
    model: { es: "Questa canzone del Canzoniere si apre rivolgendosi direttamente alle acque del fiume Sorga, dove il poeta aveva visto Laura fare il bagno. I tre aggettivi iniziali, chiare, fresche et dolci, creano un ritmo lento e musicale e descrivono un paesaggio ideale, quasi sublime, simile a un piccolo ruscello di montagna. La costruzione della frase è tipicamente poetica: nel verso «ove le belle membra / pose colei» il verbo pose arriva dopo il complemento oggetto e dopo un enjambement, secondo un ordine delle parole molto lontano dall'italiano parlato. In prosa diremmo: dove colei che per me è l'unica vera donna riposò il suo bel corpo. Laura non è più soltanto la donna angelo degli stilnovisti: è una donna reale, ricordata con nostalgia, che rende speciale il luogo in cui è passata. Il ricordo trasforma così il paesaggio in uno spazio dell'anima, sospeso tra desiderio e memoria.", en: "This canzone from the Canzoniere opens by addressing the waters of the river Sorgue directly, where the poet had seen Laura bathing. The three opening adjectives, clear, fresh and sweet, create a slow, musical rhythm and describe an ideal, almost sublime landscape, like a small mountain stream. The sentence structure is typically poetic: in the line 'where her lovely limbs / she laid, she who alone to me seems woman' the verb laid comes after the object and after an enjambement, in a word order far removed from spoken Italian. In prose we would say: where she who for me is the only true woman rested her beautiful body. Laura is no longer just the angel-woman of the stilnovisti: she is a real woman, remembered with nostalgia, who makes the place she passed through special. Memory thus transforms the landscape into a space of the soul, suspended between desire and recollection." }
