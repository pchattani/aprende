id: a1.u07
title: Como ela é?
lessons:
  - id: a1.u07.l1
    title: Alto, moreno e de óculos
    teach: [g.adjective-position]
    tip: "Adjectives normally follow the noun: um rapaz alto, olhos castanhos. A few (bom, grande, velho, novo) can go before it."
    vocab: [w.alto, w.baixo, w.magro, w.gordo, w.jovem, w.moreno, w.loiro, w.ruivo, w.cabelo, w.olho, w.barba, w.óculos, w.rosto, w.boca, w.nariz, w.castanho, w.cacheado, w.liso, w.músico]
    sentences:
      - { es: "Meu irmão é alto e magro.", en: "My brother is tall and thin.", altEs: ["O meu irmão é alto e magro."], altEn: ["My brother is tall and slim."], grammar: [g.adjective-agreement, g.ser-vs-estar-basics], vocab: [w.alto, w.magro], transform: { instruction: "Change to 'my sister'", answer: "Minha irmã é alta e magra.", alt: ["A minha irmã é alta e magra."], en: "My sister is tall and thin." } }
      - { es: "A Bia tem cabelo cacheado e olhos castanhos.", en: "Bia has curly hair and brown eyes.", altEs: ["Bia tem cabelo cacheado e olhos castanhos.", "A Bia tem o cabelo cacheado e os olhos castanhos."], grammar: [g.adjective-position, g.ter-present], vocab: [w.cabelo, w.cacheado, w.olho, w.castanho] }
      - { es: "Ele é um rapaz moreno, de barba.", en: "He's a dark-haired guy with a beard.", altEs: ["Ele é um rapaz moreno, com barba.", "É um rapaz moreno, de barba."], altEn: ["He is a dark-haired young man with a beard."], grammar: [g.adjective-position], vocab: [w.moreno, w.barba, w.rapaz] }
      - { es: "A namorada do Lucas é ruiva?", en: "Is Lucas's girlfriend a redhead?", altEs: ["A namorada do Lucas é ruiva ou loira?"], altEn: ["Is Lucas's girlfriend red-haired?"], grammar: [g.adjective-agreement, g.contractions-de], vocab: [w.namorado, w.ruivo] }
      - { es: "Meu avô usa óculos e tem barba branca.", en: "My grandfather wears glasses and has a white beard.", altEs: ["O meu avô usa óculos e tem barba branca.", "Meu avô usa óculos e tem a barba branca."], grammar: [g.adjective-position], vocab: [w.avô, w.óculos, w.barba, w.usar] }
      - { es: "Ela não é baixa, é bem alta.", en: "She isn't short, she's really tall.", altEs: ["Ela não é baixa, ela é bem alta.", "Ela não é baixa: é muito alta."], altEn: ["She's not short, she's very tall."], grammar: [g.negation, g.adjective-agreement], vocab: [w.baixo, w.alto] }
      - { es: "Ela tem olhos castanhos.", en: "She has brown eyes.", altEs: ["Ela tem os olhos castanhos."], grammar: [g.adjective-position], vocab: [w.olho, w.castanho], error: { wrong: "Ela tem castanhos olhos.", explain: "Colours and descriptions go after the noun: olhos castanhos.", grammar: g.adjective-position } }
      - { es: "O Pedro é um velho amigo.", en: "Pedro is an old friend.", altEs: ["Pedro é um velho amigo."], altEn: ["Pedro is a long-time friend."], grammar: [g.adjective-position], vocab: [w.velho, w.amigo], note: "velho before the noun = long-time; um amigo velho = an elderly friend." }
      - { es: "Ela é uma grande amiga.", en: "She's a great friend.", grammar: [g.adjective-position], vocab: [w.grande, w.amigo], note: "grande before the noun = great; uma amiga grande = a big friend." }
      - { es: "Moro numa casa pequena perto dos Arcos da Lapa.", en: "I live in a small house near the Lapa Arches.", altEs: ["Moro em uma casa pequena perto dos Arcos da Lapa.", "Eu moro numa casa pequena perto dos Arcos da Lapa."], grammar: [g.adjective-position, g.contractions-de], vocab: [w.morar, w.pequeno, w.perto] }
      - { es: "Ela tem um rosto bonito e um nariz pequeno.", en: "She has a pretty face and a small nose.", altEs: ["Ela tem o rosto bonito e o nariz pequeno."], grammar: [g.adjective-position], vocab: [w.rosto, w.nariz, w.bonito] }
      - { es: "O rapaz alto é meu primo.", en: "The tall guy is my cousin.", altEs: ["O rapaz alto é o meu primo."], altEn: ["The tall young man is my cousin."], grammar: [g.adjective-position], vocab: [w.rapaz, w.alto, w.primo], transform: { instruction: "Make it plural", answer: "Os rapazes altos são meus primos.", alt: ["Os rapazes altos são os meus primos."], en: "The tall guys are my cousins." } }
      - { es: "Ele tem cabelo liso e olhos verdes.", en: "He has straight hair and green eyes.", altEs: ["Ele tem o cabelo liso e os olhos verdes."], grammar: [g.adjective-position, g.colours], vocab: [w.cabelo, w.liso, w.olho, w.verde] }
      - { es: "A Bonchita é pequena e um pouco gorda: ela adora pão de queijo.", en: "Bonchita is small and a bit chubby: she loves cheese bread.", altEs: ["A Bonchita é pequena e meio gorda: ela adora pão de queijo."], altEn: ["Bonchita is small and a little fat: she loves cheese bread."], grammar: [g.adjective-agreement, g.muito-pouco], vocab: [w.gordo, w.pequeno, w.adorar] }
      - { es: "Nos bares da Lapa tem músicos jovens e velhos.", en: "In the bars of Lapa there are young and old musicians.", altEs: ["Nos bares da Lapa há músicos jovens e velhos."], altEn: ["There are young and old musicians in Lapa's bars."], grammar: [g.adjective-position, g.tem-there-is], vocab: [w.músico, w.jovem, w.velho, w.bar] }
      - { es: "A boca dela é grande e o cabelo é loiro.", en: "Her mouth is big and her hair is blond.", altEs: ["Ela tem a boca grande e o cabelo loiro."], grammar: [g.adjective-agreement, g.possessives], vocab: [w.boca, w.loiro], variant: "Portugal: louro (blond)." }
    exchanges:
      - q: { es: "Como é o seu irmão?", en: "What's your brother like?" }
        a: { es: "Ele é alto, moreno e usa óculos.", en: "He's tall, dark-haired and wears glasses." }
        alt: ["É alto e moreno.", "Ele é baixo e loiro.", "É magro e tem barba."]
        grammar: [g.adjective-agreement, g.ser-vs-estar-basics]
        vocab: [w.alto, w.moreno, w.óculos]
      - q: { es: "De que cor são os olhos dela?", en: "What colour are her eyes?" }
        a: { es: "São castanhos.", en: "They're brown." }
        alt: ["Ela tem olhos castanhos.", "São verdes.", "Castanhos."]
        grammar: [g.adjective-position]
        vocab: [w.olho, w.castanho]
      - q: { es: "Ela tem cabelo liso?", en: "Does she have straight hair?" }
        a: { es: "Não, ela tem cabelo cacheado.", en: "No, she has curly hair." }
        alt: ["Não, é cacheado.", "Tem, sim.", "Tem, e é bem loiro."]
        grammar: [g.adjective-position, g.ter-present]
        vocab: [w.cabelo, w.liso, w.cacheado]
      - q: { es: "Quem é aquele rapaz de barba?", en: "Who's that guy with the beard?" }
        a: { es: "É o Lucas, um velho amigo da faculdade.", en: "It's Lucas, an old friend from university." }
        alt: ["É o Lucas, meu amigo.", "É o meu primo.", "Não sei."]
        grammar: [g.adjective-position, g.demonstratives]
        vocab: [w.barba, w.rapaz, w.velho]
      - q: { es: "O músico é jovem?", en: "Is the musician young?" }
        a: { es: "É, ele tem só vinte anos.", en: "Yes, he's only twenty." }
        alt: ["É, sim.", "Não, ele é bem velho.", "Não, tem sessenta anos."]
        grammar: [g.ser-vs-estar-basics, g.yes-no-answers]
        vocab: [w.músico, w.jovem]
    texts:
      - title: "Mensagem da Bia"
        es: ["Oi, Tom! Estou no bar ao lado da Escadaria Selarón.", "Sou baixa, tenho cabelo cacheado e uso óculos.", "Meu amigo Lucas é alto, moreno e tem barba."]
        en: ["Hi, Tom! I'm at the bar next to the Selarón Steps.", "I'm short, I have curly hair and I wear glasses.", "My friend Lucas is tall, dark-haired and has a beard."]
        grammar: [g.adjective-position, g.ser-vs-estar-basics]
        vocab: [w.baixo, w.cacheado, w.óculos, w.barba]
      - title: "Cachorro perdido"
        es: ["Cachorro perdido na Lapa!", "Ele é pequeno, gordo e tem olhos grandes e castanhos.", "O nome dele é Leo e ele adora bola."]
        en: ["Lost dog in Lapa!", "He's small, chubby and has big brown eyes.", "His name is Leo and he loves balls."]
        grammar: [g.adjective-position, g.adjective-agreement]
        vocab: [w.gordo, w.olho, w.castanho, w.perdido]
    spicy:
      - { es: "Você tem olhos lindos. São castanhos ou verdes? Preciso ver de perto.", en: "You have beautiful eyes. Are they brown or green? I need to see up close.", altEs: ["Você tem uns olhos lindos. São castanhos ou verdes? Preciso ver de perto."], grammar: [g.adjective-position], vocab: [w.olho, w.lindo, w.castanho] }
      - { es: "Alto, moreno, de óculos… e solteiro? Muito prazer!", en: "Tall, dark-haired, with glasses… and single? Very nice to meet you!", altEs: ["Alta, morena, de óculos… e solteira? Muito prazer!"], grammar: [g.adjective-agreement], vocab: [w.alto, w.moreno, w.óculos, w.solteiro] }
      - { es: "Você não é um velho amigo… ainda.", en: "You're not an old friend… yet.", altEs: ["Você não é uma velha amiga… ainda."], grammar: [g.adjective-position], vocab: [w.velho, w.amigo] }
      - { es: "Gosto de barba. A sua é muito bonita.", en: "I like beards. Yours is very handsome.", altEs: ["Eu gosto de barba. A sua é muito bonita."], grammar: [g.adjective-agreement, g.gostar-de], vocab: [w.barba, w.bonito] }
      - { es: "Cabelo cacheado, rosto lindo e esse nariz pequeno… Você é real?", en: "Curly hair, a beautiful face and that little nose… Are you real?", grammar: [g.adjective-position], vocab: [w.cacheado, w.rosto, w.nariz] }
  - id: a1.u07.l2
    title: Ele é muito simpático
    teach: [g.muito-pouco]
    tip: "Muito, bem, meio, bastante and tão never change before an adjective: elas são muito simpáticas. Demais goes after it: bom demais."
    vocab: [w.simpático, w.antipático, w.chato, w.inteligente, w.engraçado, w.tímido, w.alegre, w.trabalhador, w.gentil, w.educado, w.sério, w.tão, w.bastante, w.demais, w.meio.adv]
    sentences:
      - { es: "Minha vizinha é muito simpática.", en: "My neighbour is very nice.", altEs: ["A minha vizinha é muito simpática.", "Minha vizinha é bem simpática."], altEn: ["My neighbour is very friendly."], grammar: [g.muito-pouco, g.adjective-agreement], vocab: [w.simpático, w.vizinho] }
      - { es: "O garçom é um pouco antipático.", en: "The waiter is a bit unfriendly.", altEs: ["O garçom é meio antipático."], altEn: ["The waiter is a little unpleasant."], grammar: [g.muito-pouco], vocab: [w.garçom, w.antipático] }
      - { es: "Esse filme é chato demais.", en: "This film is way too boring.", altEs: ["Esse filme é muito chato.", "Este filme é chato demais."], altEn: ["That film is too boring."], grammar: [g.muito-pouco], vocab: [w.chato, w.demais, w.filme] }
      - { es: "Sua filha é tão inteligente!", en: "Your daughter is so clever!", altEs: ["A sua filha é tão inteligente!"], altEn: ["Your daughter is so intelligent!"], grammar: [g.muito-pouco, g.possessives], vocab: [w.tão, w.inteligente, w.filho] }
      - { es: "O Lucas é bem engraçado, mas é meio tímido.", en: "Lucas is really funny, but he's a bit shy.", altEs: ["Lucas é bem engraçado, mas é meio tímido.", "O Lucas é muito engraçado, mas é um pouco tímido."], grammar: [g.muito-pouco, g.connectors-basic], vocab: [w.engraçado, w.tímido, w.meio.adv] }
      - { es: "A Bia é meio tímida com pessoas novas.", en: "Bia is a bit shy with new people.", altEs: ["Bia é meio tímida com pessoas novas.", "A Bia é um pouco tímida com pessoas novas."], grammar: [g.muito-pouco], vocab: [w.meio.adv, w.tímido, w.pessoa], error: { wrong: "A Bia é meia tímida com pessoas novas.", explain: "meio meaning 'a bit' never changes before an adjective: meio tímida.", grammar: g.muito-pouco } }
      - { es: "Os cariocas são alegres e falam muito.", en: "Cariocas are cheerful and talk a lot.", altEn: ["People from Rio are cheerful and talk a lot."], grammar: [g.ser-vs-estar-basics, g.present-regular-ar], vocab: [w.carioca, w.alegre, w.falar] }
      - { es: "Minha mãe é trabalhadora e bastante séria.", en: "My mother is hard-working and quite serious.", altEs: ["A minha mãe é trabalhadora e bastante séria."], grammar: [g.muito-pouco, g.adjective-agreement], vocab: [w.trabalhador, w.bastante, w.sério], transform: { instruction: "Change to 'my parents'", answer: "Meus pais são trabalhadores e bastante sérios.", alt: ["Os meus pais são trabalhadores e bastante sérios."], en: "My parents are hard-working and quite serious." } }
      - { es: "Ele é muito gentil e educado.", en: "He's very kind and polite.", altEs: ["Ele é bem gentil e educado."], grammar: [g.muito-pouco, g.adjective-agreement], vocab: [w.gentil, w.educado], transform: { instruction: "Change to 'she'", answer: "Ela é muito gentil e educada.", alt: ["Ela é bem gentil e educada."], en: "She's very kind and polite." } }
      - { es: "Não sou chato, sou sério!", en: "I'm not boring, I'm serious!", altEs: ["Eu não sou chato, sou sério!", "Não sou chata, sou séria!"], grammar: [g.negation, g.ser-present], vocab: [w.chato, w.sério] }
      - { es: "Você não é nada tímido!", en: "You're not shy at all!", altEs: ["Você não é nada tímida!"], grammar: [g.negation, g.muito-pouco], vocab: [w.tímido, w.nada] }
      - { es: "O samba da Lapa é bom demais!", en: "The samba in Lapa is amazing!", altEs: ["O samba na Lapa é bom demais!"], altEn: ["Lapa's samba is so good!"], grammar: [g.muito-pouco], vocab: [w.samba, w.demais], note: "In Brazil bom demais is praise: really, really good." }
      - { es: "A comida é boa, mas o garçom é pouco educado.", en: "The food is good, but the waiter isn't very polite.", altEs: ["A comida é boa, mas o garçom é meio mal-educado."], grammar: [g.muito-pouco, g.connectors-basic], vocab: [w.comida, w.educado], note: "pouco + adjective = not very." }
      - { es: "Que menino inteligente!", en: "What a clever boy!", altEs: ["Que menino tão inteligente!"], grammar: [g.muito-pouco], vocab: [w.menino, w.inteligente] }
      - { es: "A professora é simpática e bem engraçada.", en: "The teacher is nice and really funny.", altEs: ["A professora é simpática e muito engraçada."], grammar: [g.muito-pouco, g.adjective-agreement], vocab: [w.professor, w.engraçado] }
    exchanges:
      - q: { es: "Como é a sua nova vizinha?", en: "What's your new neighbour like?" }
        a: { es: "É muito simpática, mas um pouco tímida.", en: "She's very nice, but a bit shy." }
        alt: ["Simpática e bem engraçada.", "É meio antipática.", "Ela é muito gentil."]
        grammar: [g.muito-pouco, g.adjective-position]
        vocab: [w.vizinho, w.simpático, w.tímido]
      - q: { es: "Você é tímido?", en: "Are you shy?" }
        a: { es: "Sou, um pouco.", en: "I am, a bit." }
        alt: ["Não, não sou nada tímido.", "Um pouco.", "Sou, sim, bastante tímida."]
        grammar: [g.yes-no-answers, g.muito-pouco]
        vocab: [w.tímido]
      - q: { es: "O show é bom?", en: "Is the show good?" }
        a: { es: "É bom demais!", en: "It's amazing!" }
        alt: ["É ótimo!", "É meio chato.", "É muito bom."]
        grammar: [g.muito-pouco]
        vocab: [w.show, w.demais]
      - q: { es: "Como são os cariocas?", en: "What are cariocas like?" }
        a: { es: "São alegres, gentis e falam muito!", en: "They're cheerful, kind and they talk a lot!" }
        alt: ["São muito simpáticos.", "São bem alegres."]
        grammar: [g.ser-vs-estar-basics]
        vocab: [w.carioca, w.alegre, w.gentil]
      - q: { es: "Seu professor é chato?", en: "Is your teacher boring?" }
        a: { es: "Não, ele é sério, mas é bem engraçado também.", en: "No, he's serious, but he's really funny too." }
        alt: ["Não, ele é muito legal.", "Um pouco.", "É, é bem chato."]
        grammar: [g.muito-pouco, g.connectors-basic]
        vocab: [w.chato, w.sério, w.engraçado]
    texts:
      - title: "Meus amigos da Lapa"
        es: ["O Lucas é músico e é muito engraçado.", "A Bia é inteligente, alegre e bastante trabalhadora.", "E o Tom? É simpático, mas meio tímido."]
        en: ["Lucas is a musician and he's very funny.", "Bia is clever, cheerful and quite hard-working.", "And Tom? He's nice, but a bit shy."]
        grammar: [g.muito-pouco, g.adjective-agreement]
        vocab: [w.engraçado, w.trabalhador, w.tímido]
      - title: "Opinião sobre um bar"
        es: ["Bar da Lapa: o samba é bom demais!", "Os garçons são gentis e educados.", "Mas a cerveja é um pouco cara."]
        en: ["Lapa bar: the samba is amazing!", "The waiters are kind and polite.", "But the beer is a bit expensive."]
        grammar: [g.muito-pouco]
        vocab: [w.demais, w.gentil, w.educado]
    spicy:
      - { es: "Você é tão engraçado! E bonito demais também.", en: "You're so funny! And way too good-looking too.", altEs: ["Você é tão engraçada! E bonita demais também."], grammar: [g.muito-pouco], vocab: [w.tão, w.engraçado, w.demais] }
      - { es: "Você é meio tímido… e eu gosto disso.", en: "You're a bit shy… and I like that.", altEs: ["Você é meio tímida… e eu gosto disso."], grammar: [g.muito-pouco, g.gostar-de], vocab: [w.meio.adv, w.tímido] }
      - { es: "Inteligente, gentil e educado… e solteiro? Bom demais!", en: "Clever, kind and polite… and single? Too good!", altEs: ["Inteligente, gentil e educada… e solteira? Boa demais!"], grammar: [g.muito-pouco], vocab: [w.inteligente, w.gentil, w.educado, w.solteiro] }
      - { es: "Não sou chata. Sou séria… até a segunda caipirinha.", en: "I'm not boring. I'm serious… until the second caipirinha.", altEs: ["Não sou chato. Sou sério… até a segunda caipirinha."], grammar: [g.negation, g.ser-present], vocab: [w.chato, w.sério, w.caipirinha] }
      - { es: "O samba é bom, mas o músico é lindo demais.", en: "The samba is good, but the musician is way too gorgeous.", altEs: ["O samba é bom, mas o músico é bonito demais."], grammar: [g.muito-pouco], vocab: [w.músico, w.demais, w.lindo] }
  - id: a1.u07.l3
    title: Como você está hoje?
    teach: [g.ser-vs-estar-basics]
    tip: "Ser says what someone is like; estar says how they are right now: Ela é alegre, mas hoje está triste."
    vocab: [w.triste, w.feliz, w.contente, w.cansado, w.nervoso, w.calmo, w.preocupado, w.doente, w.ótimo, w.tô]
    sentences:
      - { es: "A Bia é alegre, mas hoje está triste.", en: "Bia is cheerful, but today she's sad.", altEs: ["Bia é alegre, mas hoje está triste.", "A Bia é alegre, mas hoje ela está triste."], grammar: [g.ser-vs-estar-basics], vocab: [w.alegre, w.triste] }
      - { es: "Estou muito cansado hoje.", en: "I'm very tired today.", altEs: ["Tô muito cansado hoje.", "Hoje estou muito cansado.", "Estou muito cansada hoje."], grammar: [g.ser-vs-estar-basics], vocab: [w.cansado, w.hoje], error: { wrong: "Sou muito cansado hoje.", explain: "Being tired right now is a state: estar, not ser.", grammar: g.ser-vs-estar-basics } }
      - { es: "Você está nervoso? — Não, estou calmo.", en: "Are you nervous? — No, I'm calm.", altEs: ["Você está nervosa? — Não, estou calma.", "Tá nervoso? — Não, tô calmo."], grammar: [g.ser-vs-estar-basics, g.estar-present], vocab: [w.nervoso, w.calmo] }
      - { es: "Meu pai está doente e minha mãe está preocupada.", en: "My father is ill and my mother is worried.", altEs: ["O meu pai está doente e a minha mãe está preocupada."], altEn: ["My dad is sick and my mum is worried."], grammar: [g.ser-vs-estar-basics, g.possessives], vocab: [w.doente, w.preocupado] }
      - { es: "Tô feliz porque você está aqui.", en: "I'm happy because you're here.", altEs: ["Estou feliz porque você está aqui.", "Eu tô feliz porque você tá aqui."], grammar: [g.ser-vs-estar-basics, g.connectors-basic], vocab: [w.tô, w.feliz], note: "tô is the spoken form of estou." }
      - { es: "Como você está? — Ótimo, obrigado!", en: "How are you? — Great, thanks!", altEs: ["Como você está? — Ótima, obrigada!", "Como você está? — Tô ótimo, obrigado!"], grammar: [g.ser-vs-estar-basics], vocab: [w.ótimo, w.obrigado] }
      - { es: "O Lucas é simpático, mas hoje está chato.", en: "Lucas is nice, but today he's being annoying.", altEs: ["Lucas é simpático, mas hoje está chato."], grammar: [g.ser-vs-estar-basics], vocab: [w.simpático, w.chato], note: "ser chato = to be a boring/annoying person; estar chato = to be annoying right now." }
      - { es: "A sopa está ótima!", en: "The soup is great!", altEs: ["Essa sopa está ótima!"], altEn: ["The soup tastes great!"], grammar: [g.ser-vs-estar-basics], vocab: [w.sopa, w.ótimo] }
      - { es: "O show é na Lapa, e nós estamos em Copacabana.", en: "The gig is in Lapa, and we're in Copacabana.", altEs: ["O show é na Lapa e nós estamos em Copacabana.", "O show é na Lapa, e a gente está em Copacabana."], altEn: ["The show is in Lapa, and we're in Copacabana."], grammar: [g.ser-vs-estar-basics, g.contractions-em], vocab: [w.show], error: { wrong: "O show está na Lapa, e nós estamos em Copacabana.", explain: "Events take ser for where they happen: o show é na Lapa. People and things take estar.", grammar: g.ser-vs-estar-basics } }
      - { es: "Os alunos estão contentes com a aula.", en: "The students are pleased with the class.", altEs: ["Os alunos estão felizes com a aula."], grammar: [g.ser-vs-estar-basics, g.adjective-agreement], vocab: [w.aluno, w.contente, w.aula] }
