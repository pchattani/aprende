id: r.c2.o-que-se-perde-ao-traduzir
level: c2
title: "Crónica de uma tradutora: saudade, desenrascanço e cafuné"
kind: text
intro: "A literary translator who works between English and both varieties of Portuguese reflects on 'untranslatable' words, calques and slang. The text is in European Portuguese (crónica, facto, receção, tu forms) and quotes Brazilian usage; notice how she argues by examples, concessions and irony rather than by definitions."
allow: [muddle, through, cope, improvise, manual, lisboa, rio, janeiro, porto, inglaterra, londres, pessoa, camões, google]
paragraphs:
  - { es: "Há uma pergunta que me fazem em todos os jantares, assim que digo que sou tradutora: “Mas é verdade que a palavra saudade não se pode traduzir?” Respondo sempre que sim e que não, o que deixa toda a gente insatisfeita. É verdade que o inglês não tem uma palavra única que diga ao mesmo tempo a falta, a memória e o gosto amargo dessa falta. Mas também é verdade que os ingleses sentem saudade como toda a gente; apenas precisam de uma frase inteira para a dizer. Traduzir não é encontrar a palavra igual. É encontrar o efeito igual.", en: "There is a question I get asked at every dinner as soon as I say I am a translator: 'But is it true that the word saudade can't be translated?' I always answer yes and no, which leaves everybody dissatisfied. It is true that English has no single word that expresses at once the lack, the memory and the bittersweet taste of that lack. But it is also true that the English feel saudade like everybody else; they just need a whole sentence to say it. Translating is not finding the same word. It is finding the same effect." }
  - { es: "Mais traiçoeiras do que as palavras famosas são as pequenas, as do dia a dia. Pensa em desenrascar, verbo de que os portugueses se orgulham como de um monumento nacional. Desenrascar é resolver um problema à última hora, com os meios que se têm, sem plano nem manual, e de preferência com algum talento. O inglês tem muddle through, cope, improvise, mas nenhuma dessas expressões traz o orgulho secreto que um português sente quando diz “lá me desenrasquei”. Há até um substantivo, desenrascanço, que muitos portugueses apresentam, meio a brincar, como a sua maior virtude nacional. Num romance, a escolha entre aquelas expressões inglesas muda o carácter de uma personagem.", en: "More treacherous than the famous words are the small, everyday ones. Think of desenrascar, a verb the Portuguese are proud of as if it were a national monument. Desenrascar means solving a problem at the last minute with whatever means you have, without plan or manual, and preferably with some flair. English has muddle through, cope, improvise, but none of those expressions carries the secret pride a Portuguese person feels saying 'lá me desenrasquei' ('I managed somehow'). There is even a noun, desenrascanço, which many Portuguese present, half-jokingly, as their greatest national virtue. In a novel, the choice between those English expressions changes a character's personality." }
  - { es: "Depois há as palavras que só existem de um lado do Atlântico. Quando traduzo para o Brasil, aprendo sempre qualquer coisa. Cafuné, por exemplo, o gesto de passar os dedos pelo cabelo de alguém com carinho, é uma palavra de origem africana que os brasileiros usam todos os dias e que muitos portugueses não conhecem. Em contrapartida, um brasileiro que leia que uma personagem “apanhou o autocarro para ir ao talho” precisa de alguns segundos para perceber que alguém pegou o ônibus para ir ao açougue.", en: "Then there are the words that exist on only one side of the Atlantic. When I translate for Brazil I always learn something. Cafuné, for example, the gesture of running one's fingers affectionately through someone's hair, is a word of African origin that Brazilians use every day and that many Portuguese do not know. On the other hand, a Brazilian who reads that a character 'apanhou o autocarro para ir ao talho' needs a few seconds to realise that someone took the bus (pegou o ônibus) to go to the butcher's (açougue)." }
  - { es: "O perigo maior, contudo, não está no vocabulário, mas nos decalques: estruturas que passam de uma língua para a outra sem que ninguém dê por isso. Nos últimos anos, por influência do inglês, ouve-se cada vez mais “aplicar para uma vaga” em vez de candidatar-se, “fazer sentido” para tudo, “no final do dia” em vez de afinal. Algumas destas expressões acabarão por entrar na norma, como tantas outras entraram antes delas. Outras desaparecerão com a moda que as trouxe. O meu trabalho não é proibi-las, mas saber quando é que soam a tradução.", en: "The greatest danger, though, lies not in vocabulary but in calques: structures that pass from one language to the other without anyone noticing. In recent years, under the influence of English, one hears more and more 'aplicar para uma vaga' (apply for a job) instead of candidatar-se, 'fazer sentido' (make sense) for everything, 'no final do dia' (at the end of the day) instead of afinal. Some of these expressions will end up entering the norm, as so many others did before them. Others will disappear with the fashion that brought them. My job is not to ban them, but to know when they sound like translation." }
  - { es: "Com a gíria, o desafio é outro: envelhecer depressa. Se traduzo um romance passado em Lisboa e um rapaz diz que a festa estava “bué fixe”, sei que qualquer leitor português o reconhece imediatamente como jovem e lisboeta. Para a edição brasileira, posso escolher “muito legal” ou “massa”, mas cada opção tem a sua geografia: o que soa natural no Rio pode soar estranho em Recife. E daqui a dez anos, todas parecerão antiquadas. Os tradutores de gíria sabem que trabalham com prazo de validade.", en: "With slang the challenge is different: it ages fast. If I translate a novel set in Lisbon and a boy says the party was 'bué fixe' (really cool), I know any Portuguese reader will immediately recognise him as young and from Lisbon. For the Brazilian edition I can choose 'muito legal' or 'massa', but each option has its own geography: what sounds natural in Rio may sound odd in Recife. And ten years from now they will all seem dated. Translators of slang know they work with a use-by date." }
  - { es: "Há quem pense que as máquinas resolverão tudo isto em breve. É verdade que os tradutores automáticos melhoraram imenso, e eu própria os uso para tarefas aborrecidas. Mas uma máquina dificilmente sabe que, numa cena de despedida, “tenho saudades tuas” não deve ser traduzido da mesma maneira numa carta de amor e numa mensagem entre colegas de trabalho. Sabe as palavras; ainda não sabe as pessoas.", en: "Some people think machines will soon solve all this. It is true that automatic translators have improved enormously, and I use them myself for tedious tasks. But a machine can hardly know that, in a farewell scene, 'tenho saudades tuas' should not be translated the same way in a love letter and in a message between colleagues. It knows the words; it does not yet know the people." }
  - { es: "No fim dos jantares, alguém insiste sempre: “Então, afinal, como se traduz saudade?” Costumo responder com Pessoa, que, sendo ele próprio tradutor, sabia bem do que falava: cada língua é uma maneira de ver o mundo, e traduzir é emprestar os olhos de uma à outra por um momento. Às vezes o empréstimo corre bem. Às vezes fica a faltar qualquer coisa. E a essa falta, curiosamente, nós chamamos saudade. É com ela, aliás, que termino esta crónica.", en: "At the end of the dinners someone always insists: 'So, in the end, how do you translate saudade?' I usually answer with Pessoa, who, being a translator himself, knew what he was talking about: each language is a way of seeing the world, and translating is lending one language's eyes to the other for a moment. Sometimes the loan goes well. Sometimes something is left missing. And that lack, curiously, is what we call saudade. It is with saudade, in fact, that I end this column." }
questions:
  - { q: "Segundo a autora, o que significa traduzir?", options: ["Encontrar a palavra igual", "Traduzir palavra por palavra", "Encontrar o efeito igual", "Explicar cada palavra em nota"], answer: 2, explain: "'Traduzir não é encontrar a palavra igual. É encontrar o efeito igual.'" }
  - { q: "O que é “desenrascar”?", options: ["Resolver um problema à última hora, com os meios disponíveis e algum talento", "Desistir de um problema", "Planear tudo com antecedência", "Pedir ajuda a um especialista"], answer: 0, explain: "A proudly Portuguese verb for improvising a solution; no English equivalent carries its secret pride." }
  - { q: "Que exemplo mostra a diferença de vocabulário entre Portugal e o Brasil?", options: ["Saudade e nostalgia", "Apanhar o autocarro para ir ao talho / pegar o ônibus para ir ao açougue", "Bom dia e boa tarde", "Fado e samba"], answer: 1, explain: "autocarro/ônibus, apanhar/pegar, talho/açougue — the same sentence in two varieties." }
  - { q: "O que são “decalques”, no texto?", options: ["Palavras inventadas por poetas", "Erros de ortografia", "Estruturas copiadas de outra língua, como “aplicar para uma vaga”", "Palavras de origem africana"], answer: 2, explain: "Calques from English such as aplicar para (for candidatar-se) or no final do dia." }
  - { q: "Porque é que a gíria é difícil de traduzir?", options: ["Porque é sempre vulgar", "Porque envelhece depressa e tem uma geografia própria", "Porque não existe no Brasil", "Porque as máquinas a proíbem"], answer: 1, explain: "Slang marks age and place (bué fixe = young Lisbon) and goes out of date quickly: 'prazo de validade'." }
