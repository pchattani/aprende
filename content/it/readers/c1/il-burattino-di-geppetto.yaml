id: r.c1.il-burattino-di-geppetto
level: c1
title: Il burattino di Geppetto
kind: literature
author: Carlo Collodi (1826–1890)
source: "Le avventure di Pinocchio. Storia di un burattino, capitolo III (1883), prima parte. Dominio pubblico. Testo fedele all'originale (anche nelle forme toscane smesse, messe, scorciva); solo gli accenti sono normalizzati."
intro: "Geppetto carves his puppet and names him Pinocchio – and the puppet misbehaves before he is even finished. Notice the participle clauses (Fatti gli occhi, Appena finite le mani), the comic repetitions (cresci, cresci, cresci) and the Tuscan forms smesse and messe for smise and mise."
allow: [collodi, pinocchio, geppetto, pinocchi, pinocchia]
paragraphs:
  - { es: "La casa di Geppetto era una stanzina terrena, che pigliava luce da un sottoscala. La mobilia non poteva essere più semplice: una seggiola cattiva, un letto poco buono e un tavolino tutto rovinato. Nella parete di fondo si vedeva un caminetto col fuoco acceso; ma il fuoco era dipinto, e accanto al fuoco c'era dipinta una pentola che bolliva allegramente e mandava fuori una nuvola di fumo, che pareva fumo davvero.", en: "Geppetto's home was a small ground-floor room that took its light from under a staircase. The furniture could not have been simpler: a wretched chair, a not very good bed and a battered little table. On the back wall you could see a fireplace with a fire burning; but the fire was painted, and beside the fire there was a painted pot that was boiling merrily and giving off a cloud of steam that looked like real steam." }
  - { es: "Appena entrato in casa, Geppetto prese subito gli arnesi e si pose a intagliare e a fabbricare il suo burattino. — Che nome gli metterò? — disse fra sé e sé. — Lo voglio chiamar Pinocchio. Questo nome gli porterà fortuna. Ho conosciuto una famiglia intera di Pinocchi: Pinocchio il padre, Pinocchia la madre e Pinocchi i ragazzi, e tutti se la passavano bene. Il più ricco di loro chiedeva l'elemosina.", en: "As soon as he got home, Geppetto took his tools and set about carving and making his puppet. 'What shall I call him?' he said to himself. 'I'll call him Pinocchio. That name will bring him luck. I once knew a whole family of Pinocchios: Pinocchio the father, Pinocchia the mother and Pinocchios the children, and they all got along nicely. The richest of them begged for a living.'" }
  - { es: "Quando ebbe trovato il nome al suo burattino, allora cominciò a lavorare a buono, e gli fece subito i capelli, poi la fronte, poi gli occhi. Fatti gli occhi, figuratevi la sua maraviglia quando si accorse che gli occhi si muovevano e che lo guardavano fisso fisso. Geppetto, vedendosi guardare da quei due occhi di legno, se n'ebbe quasi per male, e disse con accento risentito: — Occhiacci di legno, perché mi guardate? Nessuno rispose.", en: "When he had found a name for his puppet, he began to work in earnest, and straight away he made the hair, then the forehead, then the eyes. Once the eyes were done, imagine his amazement when he noticed that they were moving and staring at him fixedly. Geppetto, seeing himself watched by those two wooden eyes, almost took offence, and said in a resentful tone: 'Nasty wooden eyes, why are you looking at me?' Nobody answered." }
  - { es: "Allora, dopo gli occhi, gli fece il naso; ma il naso, appena fatto, cominciò a crescere: e cresci, cresci, cresci diventò in pochi minuti un nasone che non finiva mai. Il povero Geppetto si affaticava a ritagliarlo; ma più lo ritagliava e lo scorciva, e più quel naso impertinente diventava lungo.", en: "Then, after the eyes, he made the nose; but the nose, as soon as it was made, began to grow: and it grew and grew and grew until in a few minutes it became an enormous nose that never ended. Poor Geppetto wore himself out cutting it back; but the more he cut it and shortened it, the longer that impertinent nose became." }
  - { es: "Dopo il naso, gli fece la bocca. La bocca non era ancora finita di fare, che cominciò subito a ridere e a canzonarlo. — Smetti di ridere! — disse Geppetto impermalito; ma fu come dire al muro. — Smetti di ridere, ti ripeto! — urlò con voce minacciosa. Allora la bocca smesse di ridere, ma cacciò fuori tutta la lingua. Geppetto, per non guastare i fatti suoi, finse di non avvedersene, e continuò a lavorare.", en: "After the nose, he made the mouth. The mouth was not yet finished when it immediately began to laugh and mock him. 'Stop laughing!' said Geppetto, offended; but he might as well have talked to the wall. 'Stop laughing, I tell you!' he shouted in a threatening voice. Then the mouth stopped laughing, but stuck its whole tongue out. Geppetto, so as not to spoil things, pretended not to notice and went on working." }
  - { es: "Dopo la bocca, gli fece il mento, poi il collo, le spalle, lo stomaco, le braccia e le mani. Appena finite le mani, Geppetto sentì portarsi via la parrucca dal capo. Si voltò in su, e che cosa vide? Vide la sua parrucca gialla in mano del burattino. — Pinocchio!... rendimi subito la mia parrucca! E Pinocchio, invece di rendergli la parrucca, se la messe in capo per sé, rimanendovi sotto mezzo affogato.", en: "After the mouth, he made the chin, then the neck, the shoulders, the stomach, the arms and the hands. The moment the hands were finished, Geppetto felt his wig being snatched off his head. He looked up, and what did he see? He saw his yellow wig in the puppet's hand. 'Pinocchio!... give me back my wig at once!' And Pinocchio, instead of giving it back, put it on his own head, and was half smothered underneath it." }
  - { es: "A quel garbo insolente e derisorio, Geppetto si fece triste e melanconico, come non era stato mai in vita sua, e voltandosi verso Pinocchio, gli disse: — Birba d'un figliuolo! Non sei ancora finito di fare, e già cominci a mancar di rispetto a tuo padre! Male, ragazzo mio, male! E si rasciugò una lacrima.", en: "At this insolent, mocking behaviour Geppetto grew sad and gloomy as he had never been in his life, and turning to Pinocchio he said: 'You rascal of a son! You're not even finished yet and already you're starting to disrespect your father! That's bad, my boy, bad!' And he wiped away a tear." }
  - { es: "Restavano sempre da fare le gambe e i piedi. Quando Geppetto ebbe finito di fargli i piedi, sentì arrivarsi un calcio sulla punta del naso. — Me lo merito! — disse allora fra sé. — Dovevo pensarci prima! Ormai è tardi!", en: "There were still the legs and feet to do. When Geppetto had finished making the feet, he felt a kick land on the tip of his nose. 'I deserve it!' he said to himself. 'I should have thought of it before! Now it's too late!'" }
  - { es: "Poi prese il burattino sotto le braccia e lo posò in terra, sul pavimento della stanza, per farlo camminare. Pinocchio aveva le gambe aggranchite e non sapeva muoversi, e Geppetto lo conduceva per la mano per insegnargli a mettere un passo dietro l'altro. Quando le gambe gli si furono sgranchite, Pinocchio cominciò a camminare da sé e a correre per la stanza; finché, infilata la porta di casa, saltò nella strada e si dette a scappare.", en: "Then he took the puppet under the arms and put him down on the floor of the room to make him walk. Pinocchio's legs were stiff and he couldn't move, and Geppetto led him by the hand to teach him to put one foot in front of the other. When his legs had loosened up, Pinocchio began to walk by himself and run round the room; until, slipping out of the front door, he jumped into the street and took to his heels." }
  - { es: "E il povero Geppetto a corrergli dietro senza poterlo raggiungere, perché quel birichino di Pinocchio andava a salti come una lepre, e battendo i suoi piedi di legno sul lastrico della strada, faceva un fracasso, come venti paia di zoccoli da contadini. — Piglialo! piglialo! — urlava Geppetto; ma la gente che era per la via, vedendo questo burattino di legno, che correva come un barbero, si fermava incantata a guardarlo, e rideva, rideva e rideva, da non poterselo figurare.", en: "And poor Geppetto ran after him without being able to catch him, because that little rascal Pinocchio went leaping like a hare, and as his wooden feet beat on the paving stones he made a racket like twenty pairs of peasants' clogs. 'Catch him! Catch him!' Geppetto shouted; but the people in the street, seeing this wooden puppet running like a racehorse, stopped spellbound to watch him, and laughed and laughed and laughed, more than you can imagine." }
  - { es: "Alla fine, e per buona fortuna, capitò un carabiniere, il quale, sentendo tutto quello schiamazzo e credendo si trattasse di un puledro che avesse levata la mano al padrone, si piantò coraggiosamente a gambe larghe in mezzo alla strada, coll'animo risoluto di fermarlo e di impedire il caso di maggiori disgrazie. Ma Pinocchio, quando si avvide da lontano del carabiniere che barricava tutta la strada, s'ingegnò di passargli, per sorpresa, frammezzo alle gambe, e invece fece fiasco.", en: "In the end, and by good luck, a carabiniere came along who, hearing all that uproar and thinking it was a colt that had bolted from its master, planted himself bravely in the middle of the street with his legs apart, firmly determined to stop it and prevent worse mishaps. But Pinocchio, when he spotted from afar the carabiniere blocking the whole street, tried to slip through between his legs by surprise, and failed miserably." }
  - { es: "Il carabiniere, senza punto smoversi, lo acciuffò pulitamente per il naso (era un nasone spropositato, che pareva fatto apposta per essere acchiappato dai carabinieri), e lo riconsegnò nelle proprie mani di Geppetto; il quale, a titolo di correzione, voleva dargli subito una buona tiratina d'orecchi. Ma figuratevi come rimase quando, nel cercargli gli orecchi, non gli riuscì di poterli trovare: e sapete perché? Perché, nella furia di scolpirlo, si era dimenticato di farglieli.", en: "The carabiniere, without budging an inch, neatly grabbed him by the nose (it was an absurdly huge nose that seemed made on purpose to be caught by carabinieri) and handed him back to Geppetto in person; Geppetto, by way of punishment, wanted to give his ears a good tug straight away. But imagine how he felt when, looking for the ears, he couldn't find them: and do you know why? Because, in his hurry to carve him, he had forgotten to make them." }
questions:
  - { q: "Che cosa c'è di strano nel caminetto di Geppetto?", options: ["È sempre spento", "Il fuoco e la pentola sono dipinti sul muro", "È più grande della stanza"], answer: 1, explain: "«il fuoco era dipinto, e accanto al fuoco c'era dipinta una pentola» – a detail that tells you how poor Geppetto is." }
  - { q: "Perché Geppetto sceglie il nome Pinocchio? Che cosa c'è di ironico nella sua spiegazione?", options: ["Il più ricco della famiglia Pinocchi chiedeva l'elemosina", "Era il nome di suo padre", "Pinocchio vuol dire «fortunato»"], answer: 0, explain: "He says the name will bring luck, yet «il più ricco di loro chiedeva l'elemosina» – Collodi's deadpan irony." }
  - { q: "Che cosa succede quando Geppetto cerca di accorciare il naso?", options: ["Il naso si rompe", "Più lo taglia, più il naso diventa lungo", "Il naso smette di crescere"], answer: 1, explain: "«più lo ritagliava e lo scorciva, e più quel naso impertinente diventava lungo» – più… e più: the more… the more." }
  - { q: "«Fatti gli occhi» e «Appena finite le mani» sono esempi di…", options: ["participio assoluto: azione compiuta prima di quella principale", "imperativo plurale", "passato prossimo senza ausiliare"], answer: 0, explain: "A past participle agreeing with its own noun opens a clause meaning 'once X had been done' – the participio assoluto of c1.u03." }
  - { q: "Perché il carabiniere riesce a fermare Pinocchio?", options: ["Lo prende per un orecchio", "Lo acchiappa per il naso, lunghissimo", "Pinocchio si ferma da solo"], answer: 1, explain: "«lo acciuffò pulitamente per il naso (era un nasone spropositato…)»." }
  - { q: "Perché Geppetto non riesce a tirargli gli orecchi?", options: ["Pinocchio scappa di nuovo", "Si era dimenticato di farglieli", "Il carabiniere glielo impedisce"], answer: 1, explain: "«nella furia di scolpirlo, si era dimenticato di farglieli»." }
