id: r.b1.noticias-de-la-semana
level: b1
title: Noticias de la semana
kind: text
intro: The Friday news bulletin of a local radio station, read by the presenter Elena Mora.
allow: [radio, elena, mora, mayor, carmen, ruiz, valenciana]
paragraphs:
  - { es: "Boletín informativo de Radio Ciudad, viernes catorce de marzo. Estas son las noticias más importantes de la semana.", en: "Radio Ciudad news bulletin, Friday the fourteenth of March. These are the most important news stories of the week." }
  - { es: "Tres personas fueron rescatadas ayer por los bomberos en un incendio en la calle Mayor. El fuego empezó en la cocina de un segundo piso y en pocos minutos llegó al edificio de al lado. Según la policía, ningún vecino está grave, pero veinte personas tuvieron que pasar la noche en un hotel.", en: "Three people were rescued yesterday by firefighters in a fire in Calle Mayor. The fire started in the kitchen of a second-floor flat and within a few minutes reached the building next door. According to the police, no resident is seriously hurt, but twenty people had to spend the night in a hotel." }
  - { es: "El nuevo museo del vidrio fue inaugurado el martes por la alcaldesa. El edificio, que fue diseñado por un arquitecto local, se construyó en solo dos años y costó ocho millones de euros. Se espera que lo visiten más de cien mil personas el primer año.", en: "The new glass museum was opened on Tuesday by the mayor. The building, which was designed by a local architect, was built in just two years and cost eight million euros. More than a hundred thousand people are expected to visit it in the first year." }
  - { es: "Los conductores de autobús han anunciado una huelga para la próxima semana. Se pide un aumento de sueldo y mejores horarios. Desde el ayuntamiento se ha informado de que se mantendrán los servicios mínimos y se ha pedido a los ciudadanos que vayan en metro.", en: "Bus drivers have announced a strike for next week. They are asking for a pay rise and better hours. The council has reported that minimum services will be maintained and has asked citizens to take the metro." }
  - { es: "Desde el lunes, en toda la ciudad se recoge el vidrio los martes y el papel y el cartón los jueves. Las nuevas normas se han enviado por correo a todas las casas. Quien no respete las reglas podrá ser multado con hasta cien euros.", en: "From Monday, throughout the city glass is collected on Tuesdays and paper and cardboard on Thursdays. The new rules have been sent by post to every home. Anyone who does not follow the rules may be fined up to a hundred euros." }
  - { es: "Dos jóvenes fueron detenidos el miércoles después de un robo en una tienda de móviles del centro. Según los testigos, los ladrones entraron por una ventana del patio y se llevaron más de cincuenta teléfonos. Los detenidos han sido acusados por el juez y el juicio será en mayo.", en: "Two young men were arrested on Wednesday after a robbery at a mobile phone shop in the centre. According to witnesses, the thieves got in through a courtyard window and took more than fifty phones. The detainees have been charged by the judge and the trial will be in May." }
  - { es: "Y una noticia agradable para terminar: la escritora valenciana Carmen Ruiz ha sido premiada por su última novela, que ya se ha traducido a doce idiomas. La autora declaró que el premio era «una sorpresa muy grande» y que era para sus lectores.", en: "And a pleasant piece of news to finish: the Valencian writer Carmen Ruiz has won a prize for her latest novel, which has already been translated into twelve languages. The author declared that the prize was 'a very big surprise' and that it was for her readers." }
  - { es: "Mañana se espera lluvia en toda la región, así que se recomienda llevar paraguas. Les hablaba Elena Mora. Buenas tardes.", en: "Tomorrow rain is expected across the whole region, so you are advised to take an umbrella. This was Elena Mora. Good afternoon." }
questions:
  - { q: "Where did the fire start?", options: ["In a shop", "In the kitchen of a second-floor flat", "In a hotel"], answer: 1 }
  - { q: "Who designed the new museum?", options: ["The mayor", "A local architect", "A Valencian writer"], answer: 1 }
  - { q: "What can happen to someone who does not follow the recycling rules?", options: ["They may be fined up to 100 euros", "Their rubbish is not collected", "They must go to court in May"], answer: 0 }
  - { q: "What did the two young men steal?", options: ["Glass", "Bicycles", "More than fifty phones"], answer: 2 }
glossary:
  - { es: boletín, en: bulletin }
  - { es: servicios mínimos, en: minimum service (during a strike) }
  - { es: multar, en: to fine }
  - { es: juicio, en: trial }
  - { es: agradable, en: pleasant }
  - { es: lector, en: reader }
  - { es: paraguas, en: umbrella }
