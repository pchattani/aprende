id: r.b1.a-agua-continua-transparente
level: b1
title: A água continua transparente
kind: text
intro: A travel feature about Bonito, in Mato Grosso do Sul, famous for its crystal-clear rivers. It shows how the town has managed to keep them clean — and practises ser, estar, ficar and periphrases like continuar, acabar de and voltar a.
allow: [bonito, mato, grosso, prata, sucuri, formoso, campo, grande, ok, voucher, vouchers, snorkel]
paragraphs:
  - { es: "Quem chega a Bonito pela primeira vez costuma ficar sem palavras. A cidade é pequena, tranquila, com cerca de vinte e cinco mil habitantes, mas os rios que estão em volta dela são famosos no mundo inteiro. A água é tão transparente que, quando você está flutuando, parece que está voando sobre os peixes.", en: "Anyone arriving in Bonito for the first time tends to be left speechless. The town is small and quiet, with about twenty-five thousand inhabitants, but the rivers around it are famous all over the world. The water is so clear that, when you're floating, it feels as if you're flying over the fish." }
  - { es: "Eu acabei de voltar de uma semana lá e ainda estou pensando no Rio da Prata. O passeio começa com uma caminhada pela mata. Depois, todos colocam roupa de neoprene, máscara e snorkel, e entram na água devagar. A partir daí, não se faz nada além de flutuar. Não se pode nadar com força, nem pisar no fundo, nem tocar nos peixes. A correnteza leva você, e você só olha.", en: "I've just come back from a week there and I'm still thinking about the Rio da Prata. The trip starts with a walk through the forest. Then everyone puts on a wetsuit, mask and snorkel, and gets into the water slowly. From then on, you do nothing but float. You're not allowed to swim hard, step on the bottom or touch the fish. The current carries you, and you just look." }
  - { es: "E há muito para ver. Os dourados, grandes peixes cor de ouro, passam ao seu lado sem medo. Há plantas verdes que dançam no fundo, e em alguns pontos a água sai da terra, fazendo a areia ferver como se fosse uma panela. Quando terminei o passeio, fiquei com vontade de voltar a entrar no rio imediatamente.", en: "And there's a lot to see. Dourados, big gold-coloured fish, swim past you without fear. There are green plants dancing on the bottom, and at some spots the water comes up out of the ground, making the sand bubble as if it were a pan. When I finished the trip, I wanted to get back into the river straight away." }
  - { es: "Mas por que a água de Bonito é assim? O guia me explicou que os rios correm sobre rochas de calcário. O calcário funciona como um filtro natural: as pequenas partículas de terra ficam presas no fundo, e a água fica limpa. Por isso, ela está quase sempre cristalina, a não ser depois de chuvas muito fortes.", en: "But why is Bonito's water like this? The guide explained that the rivers run over limestone rocks. The limestone works as a natural filter: tiny particles of earth get trapped on the bottom, and the water stays clean. That's why it's almost always crystal clear, except after very heavy rain." }
  - { es: "A natureza ajuda, mas o segredo de Bonito também é a organização. Há cerca de trinta anos, a cidade decidiu que o turismo teria regras. Todos os passeios são feitos com guias credenciados, e cada lugar tem um número máximo de visitantes por dia. Você não pode simplesmente chegar e entrar no rio: precisa comprar o passeio antes, numa agência, que emite um voucher. No começo, muita gente achou que isso ia acabar com o turismo. Aconteceu o contrário: Bonito virou exemplo de ecoturismo no Brasil e no exterior.", en: "Nature helps, but Bonito's secret is also organisation. About thirty years ago, the town decided that tourism would have rules. All trips are done with accredited guides, and each place has a maximum number of visitors per day. You can't just turn up and get in the river: you have to buy the trip in advance, at an agency, which issues a voucher. At first, many people thought this would kill tourism. The opposite happened: Bonito became an example of ecotourism in Brazil and abroad." }
  - { es: "Isso não quer dizer que não haja problemas. Os moradores com quem conversei estão preocupados com o crescimento das plantações de soja na região. Quando a terra fica sem árvores, a chuva leva mais lama para os rios, e a água pode ficar turva por dias. Em alguns anos, isso já aconteceu, e os passeios tiveram que ser cancelados. Os ambientalistas continuam lutando por leis mais rígidas.", en: "That doesn't mean there are no problems. The residents I talked to are worried about the growth of soy plantations in the region. When the land is left without trees, the rain carries more mud into the rivers, and the water can stay cloudy for days. In some years this has already happened, and trips had to be cancelled. Environmentalists keep fighting for stricter laws." }
  - { es: "No último dia, perguntei ao guia se ele achava que, daqui a vinte anos, a água ainda estaria transparente. Ele ficou um tempo em silêncio e respondeu: — Depende da gente. Se continuarmos cuidando, vai continuar assim. A natureza faz a parte dela; o resto é com a gente.", en: "On the last day, I asked the guide if he thought that, twenty years from now, the water would still be clear. He was silent for a while and answered: 'It depends on us. If we keep looking after it, it'll stay like this. Nature does its part; the rest is up to us.'" }
questions:
  - { q: "Como é a sensação de flutuar nos rios de Bonito, segundo o texto?", options: ["Parece que você está voando sobre os peixes", "É muito frio e desconfortável", "É como nadar no mar"], answer: 0, explain: "«A água é tão transparente que... parece que está voando sobre os peixes.»" }
  - { q: "O que NÃO se pode fazer durante a flutuação?", options: ["Olhar os peixes", "Usar máscara", "Pisar no fundo e tocar nos peixes"], answer: 2, explain: "«Não se pode nadar com força, nem pisar no fundo, nem tocar nos peixes.»" }
  - { q: "Por que a água de Bonito é tão limpa?", options: ["Porque é tratada com produtos químicos", "Porque o calcário funciona como um filtro natural", "Porque não chove na região"], answer: 1, explain: "«O calcário funciona como um filtro natural.»" }
  - { q: "Como funciona o turismo em Bonito?", options: ["Qualquer pessoa pode entrar nos rios", "Os passeios têm guias e número máximo de visitantes", "Só moradores podem visitar os rios"], answer: 1, explain: "«Todos os passeios são feitos com guias credenciados, e cada lugar tem um número máximo de visitantes por dia.»" }
  - { q: "O que preocupa os moradores?", options: ["O crescimento das plantações de soja", "A falta de turistas", "O preço dos passeios"], answer: 0, explain: "«Os moradores... estão preocupados com o crescimento das plantações de soja na região.»" }
