id: a1.u09
title: 去飲茶
lessons:
  - id: a1.u09.l1
    title: 唔該定多謝？
    teach: [g.mgoi-doze]
    vocab: [w.jam2-caa4, w.dim2-sam1, w.zau2-lau4, w.caa4-lau4, w.caa4, w.pou2-nei2, w.hoeng1-pin2, w.wu4, w.wai2.b, w.dang2-wai2, w.fo2-gei3, w.haak3-jan4, w.caan1-paai2, w.coi3-daan1, w.daan1, w.maai4-daan1, w.gaa1, w.gwan2-seoi2, w.ci4-gang1, w.dou1.b, w.caa1, w.sai2-sau2, w.lung4, w.zing1, w.daai6-koi3, w.ceng2, w.gei2-noi6, w.zoi3]
    tip: "唔該 is for a service or a favour (and means \"please\" and \"excuse me\"); 多謝 is for a gift, a treat or a compliment."
    sentences:
      - { es: "幾位呀？", en: "How many of you?", altEs: ["幾多位呀？", "唔該，幾位呀？"], altEn: ["Table for how many?"], grammar: [g.gei-how-many], vocab: [w.wai2.b] }
      - { es: "四位，唔該。", en: "Four, please.", altEs: ["唔該，四位。", "四個人，唔該。"], grammar: [g.mgoi-doze], vocab: [w.wai2.b], transform: { instruction: "Say there are two of you", answer: "兩位，唔該。", alt: ["唔該，兩位。"], en: "Two, please." } }
      - { es: "而家要等位，大概十五分鐘。", en: "There's a wait for a table now, about fifteen minutes.", altEs: ["而家要等位，差唔多十五分鐘。"], grammar: [g.clock-time], vocab: [w.dang2-wai2] }
      - { es: "唔該，埋單。", en: "The bill, please.", altEs: ["唔該埋單。", "伙記，埋單。", "唔該，埋單吖。"], grammar: [g.mgoi-doze], vocab: [w.maai4-daan1], error: { wrong: "多謝，埋單。", explain: "Asking for a service takes 唔該; 多謝 is for gifts and compliments.", grammar: g.mgoi-doze } }
      - { es: "唔該，畀張餐牌我睇吓。", en: "Could I see the menu, please?", altEs: ["唔該，畀張菜單我睇吓。", "唔該，畀個餐牌我睇吓。"], grammar: [g.mgoi-doze, g.bei-give], vocab: [w.caan1-paai2, w.coi3-daan1] }
      - { es: "唔該，加啲滾水。", en: "Some more hot water, please.", altEs: ["唔該，加滾水。", "唔該，加啲水。"], grammar: [g.mgoi-doze], vocab: [w.gaa1, w.gwan2-seoi2], note: "At yum cha, leave the teapot lid ajar and the waiter will top it up." }
      - { es: "伙記，唔該！", en: "Excuse me, waiter!", altEs: ["唔該！", "唔該，伙記！"], grammar: [g.mgoi-doze], vocab: [w.fo2-gei3] }
      - { es: "多謝你請我飲茶。", jp: "do1 ze6 nei5 ceng2 ngo5 jam2 caa4", en: "Thank you for treating me to yum cha.", altEs: ["多謝你請我飲茶呀。", "多謝晒你請我飲茶。"], grammar: [g.mgoi-doze], vocab: [w.jam2-caa4], error: { wrong: "唔該你請我飲茶。", explain: "Being treated is a kindness, not a service: thank someone for it with 多謝.", grammar: g.mgoi-doze } }
      - { es: "唔該晒！唔使唔該。", en: "Thanks a lot! No problem.", altEs: ["唔該晒！唔使客氣。"], grammar: [g.mgoi-doze], vocab: [] }
      - { es: "你哋飲咩茶呀？", en: "What tea will you have?", altEs: ["飲咩茶呀？", "你哋飲乜嘢茶呀？"], grammar: [g.question-words], vocab: [w.caa4] }
      - { es: "一壺普洱，一壺香片，唔該。", en: "A pot of pu'er and a pot of jasmine tea, please.", altEs: ["唔該，一壺普洱，一壺香片。"], grammar: [g.mgoi-doze, g.common-classifiers], vocab: [w.wu4, w.pou2-nei2, w.hoeng1-pin2], transform: { instruction: "Order just one pot of pu'er", answer: "一壺普洱，唔該。", alt: ["唔該，一壺普洱。"], en: "A pot of pu'er, please." } }
      - { es: "好多點心都係蒸嘅。", en: "Lots of dim sum is steamed.", altEs: ["好多點心係蒸嘅。"], grammar: [g.adj-ge-noun], vocab: [w.dim2-sam1, w.zing1] }
      - { es: "唔該，畀多對筷子我。", en: "Another pair of chopsticks, please.", altEs: ["唔該，畀對筷子我。", "唔該，多對筷子。"], grammar: [g.mgoi-doze, g.bei-give], vocab: [w.faai3-zi2] }
      - { es: "我唔識用筷子，有冇刀叉呀？", en: "I can't use chopsticks. Do you have a knife and fork?", altEs: ["我唔識用筷子，有冇刀同叉呀？"], grammar: [g.jau-have], vocab: [w.faai3-zi2, w.dou1.b, w.caa1] }
      - { es: "我去洗手先。", en: "I'll go and wash my hands first.", altEs: ["我先去洗手。"], grammar: [g.serial-verbs], vocab: [w.sai2-sau2] }
      - { es: "呢間酒樓好多客人。", en: "This restaurant has lots of customers.", altEs: ["呢間酒樓有好多客人。", "呢間茶樓好多客人。"], grammar: [g.jau-have], vocab: [w.zau2-lau4, w.caa4-lau4, w.haak3-jan4] }
    exchanges:
      - q: { es: "幾位呀？", en: "How many of you?" }
        a: { es: "三位，唔該。", en: "Three, please." }
        alt: ["三位。", "兩位，唔該。", "唔該，五位。"]
        grammar: [g.mgoi-doze]
        vocab: [w.wai2.b]
      - q: { es: "飲咩茶呀？", en: "What tea would you like?" }
        a: { es: "普洱，唔該。", en: "Pu'er, please." }
        alt: ["香片，唔該。", "一壺普洱。"]
        grammar: [g.mgoi-doze]
        vocab: [w.pou2-nei2, w.caa4]
      - q: { es: "唔該晒！", en: "Thanks a lot!" }
        a: { es: "唔使唔該。", en: "No problem." }
        alt: ["唔使客氣。"]
        grammar: [g.mgoi-doze]
        vocab: []
      - q: { es: "今日多謝你請客！", en: "Thanks for treating me today!" }
        a: { es: "唔使客氣。", en: "You're welcome." }
        alt: ["唔使謝。", "唔使多謝。"]
        grammar: [g.mgoi-doze]
        vocab: [w.jam2-caa4]
      - q: { es: "要等幾耐呀？", en: "How long is the wait?" }
        a: { es: "大概十五分鐘。", en: "About fifteen minutes." }
        alt: ["十五分鐘。", "唔使等，有位。"]
        grammar: [g.clock-time]
        vocab: [w.dang2-wai2]
    texts:
      - title: "星期日飲茶"
        es: ["星期日朝早，我哋一家人去酒樓飲茶。", "人好多，我哋要等位。", "我哋叫一壺普洱，仲有好多點心。"]
        en: ["On Sunday morning our whole family goes for yum cha at a Chinese restaurant.", "It's very busy and we have to wait for a table.", "We order a pot of pu'er, and lots of dim sum too."]
        grammar: [g.time-before-verb, g.mgoi-doze]
        vocab: [w.zau2-lau4, w.dang2-wai2, w.pou2-nei2, w.dim2-sam1]
      - title: "埋單"
        es: ["伙記，唔該埋單。", "一共三百二十蚊。", "唔該晒，我哋下個禮拜再嚟！"]
        en: ["Waiter, the bill please.", "That's three hundred and twenty dollars altogether.", "Thanks so much, we'll come again next week!"]
        grammar: [g.mgoi-doze, g.money]
        vocab: [w.fo2-gei3, w.maai4-daan1]
    spicy:
      - { es: "多謝你請我飲茶，下次我請你食飯。", jp: "do1 ze6 nei5 ceng2 ngo5 jam2 caa4 haa6 ci3 ngo5 ceng2 nei5 sik6 faan6", en: "Thanks for treating me to yum cha; next time I'll take you to dinner.", altEs: ["多謝你請我飲茶，下次到我請你食飯。"], grammar: [g.mgoi-doze], vocab: [w.jam2-caa4] }
      - { es: "伙記，唔該畀張餐牌我……同埋你嘅電話號碼。", en: "Waiter, the menu please... and your phone number.", altEs: ["伙記，唔該畀張餐牌我，同埋你嘅電話號碼。"], grammar: [g.mgoi-doze, g.bei-give], vocab: [w.fo2-gei3, w.caan1-paai2] }
      - { es: "唔使唔該，請我飲杯咖啡就得。", jp: "m4 sai2 m4 goi1 ceng2 ngo5 jam2 bui1 gaa3 fe1 zau6 dak1", en: "No need to thank me, just buy me a coffee.", altEs: ["唔使唔該，請我飲杯咖啡就得喇。"], grammar: [g.mgoi-doze], vocab: [] }
      - { es: "要等位？唔緊要，同你一齊等，我好開心。", en: "We have to wait for a table? No problem, I'm happy waiting with you.", altEs: ["要等位呀？唔緊要，同你一齊等，我好開心。"], grammar: [g.mgoi-doze], vocab: [w.dang2-wai2] }
      - { es: "我唔識用筷子，你教我好唔好？", en: "I can't use chopsticks. Will you teach me?", altEs: ["我唔識用筷子，你可唔可以教我？"], grammar: [g.a-not-a-questions], vocab: [w.faai3-zi2] }
  - id: a1.u09.l2
    title: 我好鍾意食蝦餃
    teach: [g.zung-ji-like]
    vocab: [w.zung1-ji3, w.haa1-gaau2, w.siu1-maai2, w.caa1-siu1-baau1, w.caa1-siu1, w.coeng2-fan2, w.fung6-zaau2, w.lo4-baak6-gou1, w.ceon1-gyun2, w.daan6-taat1, w.paai4-gwat1, w.no6-mai5-gai1, w.maa5-laai1-gou1, w.lau4-saa1-baau1, w.hou2-sik6, w.naan4-sik6, w.tim4, w.haam4, w.laat6, w.syun1.b, w.fu2, w.siu1, w.caau2, w.ning4-mung1-caa4]
    tip: "鍾意 + noun or verb: 我鍾意蝦餃, 我鍾意飲茶. Ask with 你鍾唔鍾意…呀？ and say \"favourite\" with 最鍾意."
    sentences:
      - { es: "我好鍾意飲茶。", en: "I love yum cha.", altEs: ["我好鍾意去飲茶。"], altEn: ["I really like going for yum cha."], grammar: [g.zung-ji-like], vocab: [w.zung1-ji3, w.jam2-caa4], error: { wrong: "我好喜歡飲茶。", explain: "鍾意 is the spoken word for \"like\"; 喜歡 is written Chinese and sounds bookish.", grammar: g.zung-ji-like } }
      - { es: "你鍾唔鍾意食蝦餃呀？", en: "Do you like har gow (shrimp dumplings)?", altEs: ["你鍾意食蝦餃嗎？", "你鍾唔鍾意蝦餃呀？"], grammar: [g.zung-ji-like, g.a-not-a-questions], vocab: [w.haa1-gaau2], transform: { instruction: "Answer that you really like them", answer: "我好鍾意食蝦餃。", alt: ["好鍾意。", "我好鍾意。", "我好鍾意蝦餃。"], en: "I really like har gow." } }
      - { es: "我最鍾意燒賣。", en: "Siu mai are my favourite.", altEs: ["我最鍾意食燒賣。"], grammar: [g.zung-ji-like], vocab: [w.siu1-maai2], transform: { instruction: "Say har gow are your favourite", answer: "我最鍾意蝦餃。", alt: ["我最鍾意食蝦餃。"], en: "Har gow are my favourite." } }
      - { es: "我唔係幾鍾意食鳳爪。", en: "I don't really like chicken feet.", altEs: ["我唔係好鍾意食鳳爪。", "我唔係幾鍾意鳳爪。"], grammar: [g.zung-ji-like, g.degree-adverbs], vocab: [w.fung6-zaau2] }
      - { es: "佢唔鍾意食辣。", en: "She doesn't like spicy food.", altEs: ["佢唔鍾意食辣嘢。"], altEn: ["He doesn't like spicy food."], grammar: [g.zung-ji-like, g.m-negation], vocab: [w.laat6], error: { wrong: "佢冇鍾意食辣。", explain: "Negate 鍾意 with 唔: 冇 means \"not have\".", grammar: g.m-negation } }
      - { es: "叉燒包好好食！", en: "The barbecue pork buns are delicious!", altEs: ["啲叉燒包好好食！"], grammar: [g.adjective-predicates], vocab: [w.caa1-siu1-baau1, w.hou2-sik6] }
      - { es: "呢碟腸粉好鹹。", en: "This plate of rice rolls is very salty.", altEs: ["呢碟腸粉太鹹喇。"], grammar: [g.adjective-predicates], vocab: [w.coeng2-fan2, w.haam4] }
      - { es: "蛋撻好甜，我好鍾意。", en: "Egg tarts are sweet, I love them.", altEs: ["啲蛋撻好甜，我好鍾意。"], grammar: [g.zung-ji-like], vocab: [w.daan6-taat1, w.tim4], transform: { instruction: "Say you don't like them", answer: "蛋撻好甜，我唔鍾意。", alt: ["啲蛋撻好甜，我唔鍾意。"], en: "Egg tarts are very sweet; I don't like them." } }
      - { es: "我哋叫一碟蘿蔔糕同一籠排骨啦。", en: "Let's order a plate of turnip cake and a basket of spare ribs.", altEs: ["叫一碟蘿蔔糕同一籠排骨啦。"], grammar: [g.particles-aa-laa], vocab: [w.lo4-baak6-gou1, w.paai4-gwat1, w.lung4] }
      - { es: "隻糯米雞好大，我哋兩個人食啦。", en: "The sticky rice in lotus leaf is big; let's share it between the two of us.", altEs: ["個糯米雞好大，我哋兩個人食啦。"], grammar: [g.particles-aa-laa], vocab: [w.no6-mai5-gai1] }
      - { es: "你最鍾意食乜嘢點心呀？", en: "What's your favourite dim sum?", altEs: ["你最鍾意食咩點心呀？", "你最鍾意乜嘢點心呀？"], grammar: [g.zung-ji-like, g.question-words], vocab: [w.zung1-ji3, w.dim2-sam1] }
      - { es: "呢度嘅春卷好難食。", en: "The spring rolls here are awful.", altEs: ["呢度啲春卷好難食。"], grammar: [g.adjective-predicates], vocab: [w.ceon1-gyun2, w.naan4-sik6] }
      - { es: "我鍾意食叉燒，唔鍾意食燒肉。", en: "I like barbecue pork, but not roast pork.", altEs: ["我鍾意叉燒，唔鍾意燒肉。"], grammar: [g.zung-ji-like], vocab: [w.caa1-siu1, w.siu1] }
      - { es: "流沙包好熱，小心呀！", en: "The custard buns are hot, careful!", altEs: ["啲流沙包好熱，小心呀！"], grammar: [g.adjective-predicates], vocab: [w.lau4-saa1-baau1] }
      - { es: "馬拉糕唔係好甜。", en: "Ma lai cake isn't very sweet.", altEs: ["馬拉糕唔係幾甜。"], grammar: [g.adjective-predicates], vocab: [w.maa5-laai1-gou1, w.tim4] }
      - { es: "呢杯咖啡好苦，呢杯檸檬茶好酸。", en: "This coffee is bitter, and this lemon tea is sour.", altEs: ["呢杯咖啡太苦，呢杯檸檬茶太酸。"], grammar: [g.adjective-predicates], vocab: [w.fu2, w.syun1.b] }
    exchanges:
      - q: { es: "你鍾唔鍾意食鳳爪呀？", en: "Do you like chicken feet?" }
        a: { es: "唔係幾鍾意。", en: "Not really." }
        alt: ["好鍾意！", "唔鍾意。", "幾鍾意。"]
        grammar: [g.zung-ji-like, g.a-not-a-questions]
        vocab: [w.fung6-zaau2]
      - q: { es: "你最鍾意食乜嘢點心呀？", en: "What's your favourite dim sum?" }
        a: { es: "我最鍾意蝦餃同燒賣。", en: "Har gow and siu mai are my favourites." }
        alt: ["蝦餃。", "叉燒包。", "我最鍾意腸粉。"]
        grammar: [g.zung-ji-like, g.question-words]
        vocab: [w.haa1-gaau2, w.siu1-maai2]
      - q: { es: "啲腸粉好唔好食呀？", en: "Are the rice rolls good?" }
        a: { es: "好好食！", en: "Really good!" }
        alt: ["幾好食。", "唔係好好食。"]
        grammar: [g.adjective-predicates, g.a-not-a-questions]
        vocab: [w.coeng2-fan2, w.hou2-sik6]
      - q: { es: "你食唔食辣㗎？", en: "Do you eat spicy food?" }
        a: { es: "我唔食辣。", en: "I don't eat spicy food." }
        alt: ["食，我好鍾意食辣。", "少少啦。"]
        grammar: [g.a-not-a-questions]
        vocab: [w.laat6]
      - q: { es: "叫多一碟蘿蔔糕好唔好？", en: "Shall we order another plate of turnip cake?" }
        a: { es: "好呀，我好鍾意蘿蔔糕。", en: "Yes, I love turnip cake." }
        alt: ["好呀。", "唔使喇，好飽。"]
        grammar: [g.zung-ji-like, g.particles-aa-laa]
        vocab: [w.lo4-baak6-gou1]
    texts:
      - title: "我最鍾意嘅點心"
        es: ["我最鍾意食蝦餃同燒賣。", "我唔係幾鍾意鳳爪。", "我日日都想食蛋撻！"]
        en: ["My favourite dim sum are har gow and siu mai.", "I don't really like chicken feet.", "I want to eat egg tarts every day!"]
        grammar: [g.zung-ji-like]
        vocab: [w.haa1-gaau2, w.siu1-maai2, w.fung6-zaau2, w.daan6-taat1]
      - title: "Bonchita"
        es: ["Bonchita好鍾意叉燒。", "佢唔鍾意辣嘢。", "佢最鍾意……你碟叉燒包！"]
        en: ["Bonchita loves barbecue pork.", "She doesn't like spicy things.", "What she likes best is... your plate of barbecue pork buns!"]
        grammar: [g.zung-ji-like]
        vocab: [w.caa1-siu1, w.caa1-siu1-baau1, w.laat6]
    spicy:
      - { es: "我鍾意蝦餃，鍾意燒賣，不過最鍾意你。", en: "I like har gow, I like siu mai, but I like you most.", altEs: ["我鍾意蝦餃，鍾意燒賣，但係最鍾意你。"], grammar: [g.zung-ji-like], vocab: [w.zung1-ji3, w.haa1-gaau2, w.siu1-maai2] }
      - { es: "你咁甜，我唔使食蛋撻喇。", en: "You're so sweet, I don't need any egg tarts.", altEs: ["你咁甜，我唔使食蛋撻啦。"], grammar: [g.zung-ji-like], vocab: [w.tim4, w.daan6-taat1] }
      - { es: "你鍾唔鍾意食辣呀？你自己都幾辣㗎。", en: "Do you like spicy food? You're pretty hot yourself.", altEs: ["你鍾意食辣嗎？你自己都幾辣㗎。"], grammar: [g.zung-ji-like, g.a-not-a-questions], vocab: [w.laat6] }
      - { es: "最後一粒蝦餃，我鍾意你，所以畀你。", en: "The last har gow: I like you, so it's yours.", altEs: ["最後一粒蝦餃，我鍾意你，所以畀你食。"], grammar: [g.zung-ji-like, g.bei-give], vocab: [w.haa1-gaau2] }
      - { es: "我唔鍾意鳳爪，但係鍾意同你飲茶。", en: "I don't like chicken feet, but I like having yum cha with you.", altEs: ["我唔鍾意鳳爪，不過鍾意同你飲茶。"], grammar: [g.zung-ji-like], vocab: [w.fung6-zaau2] }
  - id: a1.u09.l3
    title: 畀杯奶茶我
    teach: [g.bei-give]
    vocab: [w.jam2, w.jam2-je5, w.sik6-je5, w.seoi2, w.dung3-seoi2, w.gaa3-fe1, w.naai5-caa4, w.ning4-caa2, w.dung3-ning4-caa2, w.hei3-seoi2, w.gwo2-zap1, w.be1-zau2, w.zau2, w.naai5, w.jit6, w.bing1, w.zau2-bing1, w.zau2.b, w.dung3-jam2, w.caa4-caan1-teng1, w.hou2-jam2, w.zik1-hak1, w.zeoi3-hau6]
    tip: "With 畀 the thing comes first and the person last: 畀杯水我 \"give me a glass of water\"."
    sentences:
      - { es: "唔該，畀杯水我。", en: "Could I have a glass of water, please?", altEs: ["唔該，畀杯水我吖。", "唔該畀杯水我。"], grammar: [g.bei-give, g.mgoi-doze], vocab: [w.bei2, w.seoi2] }
      - { es: "畀杯熱奶茶我，唔該。", en: "A hot milk tea for me, please.", altEs: ["唔該，畀杯熱奶茶我。", "一杯熱奶茶，唔該。"], grammar: [g.bei-give], vocab: [w.jit6, w.naai5-caa4], transform: { instruction: "Ask for an iced lemon tea instead", answer: "畀杯凍檸茶我，唔該。", alt: ["唔該，畀杯凍檸茶我。", "畀杯凍檸檬茶我，唔該。"], en: "An iced lemon tea for me, please." } }
      - { es: "我要一杯凍檸茶，走冰。", en: "I'd like an iced lemon tea, no ice.", altEs: ["一杯凍檸茶，走冰，唔該。", "我要杯凍檸茶，走冰。"], grammar: [g.jiu-want], vocab: [w.dung3-ning4-caa2, w.zau2-bing1], note: "走 + something = \"without\": 走冰 no ice, 走糖 no sugar." }
      - { es: "我畀錢啦。", en: "I'll pay.", altEs: ["我畀啦。", "等我畀錢啦。"], grammar: [g.bei-give, g.particles-aa-laa], vocab: [w.bei2] }
      - { es: "邊個畀錢呀？", en: "Who's paying?", altEs: ["邊個畀錢？"], grammar: [g.bei-give, g.question-words], vocab: [w.bei2] }
      - { es: "我請你飲咖啡。", jp: "ngo5 ceng2 nei5 jam2 gaa3 fe1", en: "I'll buy you a coffee.", altEs: ["我請你飲杯咖啡。"], altEn: ["Coffee's on me."], grammar: [g.bei-give], vocab: [w.ceng2, w.gaa3-fe1], transform: { instruction: "Say she's buying you a milk tea", answer: "佢請我飲奶茶。", alt: ["佢請我飲杯奶茶。"], en: "She's buying me a milk tea." } }
      - { es: "我畀本書你。", en: "I'll give you a book.", altEs: ["我畀一本書你。"], grammar: [g.bei-give], vocab: [w.bei2], transform: { instruction: "Say you'll give her a present (份禮物)", answer: "我畀份禮物佢。", alt: ["我畀一份禮物佢。"], en: "I'll give her a present." } }
      - { es: "你拎杯咖啡畀佢啦。", en: "Take the coffee over to her.", altEs: ["你拎杯咖啡過去畀佢啦。"], altEn: ["Take the coffee over to him."], grammar: [g.bei-give, g.particles-aa-laa], vocab: [w.ling1, w.gaa3-fe1] }
      - { es: "我聽日打電話畀你。", en: "I'll call you tomorrow.", altEs: ["聽日我打電話畀你。"], grammar: [g.bei-give, g.time-before-verb], vocab: [w.bei2], error: { wrong: "我聽日打你電話。", explain: "\"Call someone\" is 打電話畀 + person: 我打電話畀你.", grammar: g.bei-give } }
      - { es: "茶餐廳嘅奶茶好好飲。", en: "Cha chaan teng milk tea is delicious.", altEs: ["茶餐廳啲奶茶好好飲。"], grammar: [g.ge-possessive, g.adjective-predicates], vocab: [w.caa4-caan1-teng1, w.naai5-caa4, w.hou2-jam2] }
      - { es: "我唔飲酒，畀杯汽水我得唔得呀？", en: "I don't drink alcohol. Could I have a soft drink instead?", altEs: ["我唔飲酒，畀罐汽水我得唔得呀？"], grammar: [g.bei-give, g.m-negation], vocab: [w.zau2, w.hei3-seoi2] }
      - { es: "咖啡要唔要加奶加糖呀？", en: "Do you want milk and sugar in your coffee?", altEs: ["咖啡加唔加奶同糖呀？", "咖啡要加奶加糖嗎？"], grammar: [g.a-not-a-questions], vocab: [w.naai5, w.tong2, w.gaa3-fe1] }
      - { es: "凍飲要加兩蚊。", en: "Cold drinks are two dollars extra.", altEs: ["凍飲加兩蚊。"], grammar: [g.money], vocab: [w.dung3-jam2], note: "In many cha chaan teng an iced drink costs a few dollars more than a hot one." }
      - { es: "你飲咩嘢呀？", en: "What would you like to drink?", altEs: ["你飲乜嘢呀？", "飲咩呀？", "你想飲咩呀？"], grammar: [g.question-words], vocab: [w.jam2] }
      - { es: "一杯啤酒，一杯果汁，唔該。", en: "A beer and a juice, please.", altEs: ["唔該，一杯啤酒，一杯果汁。"], grammar: [g.mgoi-doze, g.common-classifiers], vocab: [w.be1-zau2, w.gwo2-zap1] }
      - { es: "我哋喺赤柱海邊嘅餐廳飲嘢。", en: "We're having drinks at a seaside restaurant in Stanley.", altEs: ["我哋喺赤柱海邊間餐廳飲嘢。"], grammar: [g.hai2-location, g.adj-ge-noun], vocab: [w.caan1-teng1, w.jam2-je5] }
    exchanges:
      - q: { es: "飲咩呀？", en: "What are you drinking?" }
        a: { es: "一杯熱奶茶，唔該。", en: "A hot milk tea, please." }
        alt: ["熱奶茶。", "凍檸茶，走冰。", "一杯咖啡，唔該。"]
        grammar: [g.mgoi-doze]
        vocab: [w.naai5-caa4, w.jit6]
      - q: { es: "要唔要加糖呀？", en: "Would you like sugar?" }
        a: { es: "唔使，唔該。", en: "No thanks." }
        alt: ["要，唔該。", "少少就得。"]
        grammar: [g.a-not-a-questions, g.mgoi-doze]
        vocab: [w.tong2, w.gaa1]
      - q: { es: "邊個畀錢呀？", en: "Who's paying?" }
        a: { es: "我畀啦。", en: "I'll pay." }
        alt: ["我請客。", "佢畀。", "我畀錢啦。"]
        grammar: [g.bei-give]
        vocab: [w.bei2]
      - q: { es: "你飲唔飲酒㗎？", en: "Do you drink alcohol?" }
        a: { es: "唔飲，我飲果汁得喇。", en: "No, juice is fine for me." }
        alt: ["飲少少。", "唔飲。", "飲，我鍾意啤酒。"]
        grammar: [g.a-not-a-questions]
        vocab: [w.zau2, w.gwo2-zap1]
      - q: { es: "唔該，畀杯凍水我吖。", en: "A glass of cold water, please." }
        a: { es: "好，即刻嚟。", en: "Sure, coming right up." }
        alt: ["好呀。", "等一陣。"]
        grammar: [g.bei-give, g.mgoi-doze]
        vocab: [w.dung3-seoi2]
    texts:
      - title: "茶餐廳"
        es: ["我日日去茶餐廳食早餐。", "我通常叫一杯熱奶茶。", "夏天我飲凍檸茶，走冰。", "凍飲要加兩蚊。"]
        en: ["I have breakfast at a cha chaan teng every day.", "I usually order a hot milk tea.", "In summer I drink iced lemon tea, no ice.", "Cold drinks cost two dollars more."]
        grammar: [g.bei-give, g.frequency-adverbs]
        vocab: [w.caa4-caan1-teng1, w.naai5-caa4, w.dung3-ning4-caa2, w.dung3-jam2]
      - title: "赤柱"
        es: ["星期日我哋喺赤柱海邊飲嘢。", "我飲啤酒，佢飲汽水。", "最後佢畀錢，我好開心！"]
        en: ["On Sunday we have drinks by the sea in Stanley.", "I drink beer and she drinks a soft drink.", "In the end she pays, and I'm very happy!"]
        grammar: [g.bei-give]
        vocab: [w.jam2-je5, w.be1-zau2, w.hei3-seoi2, w.bei2]
    spicy:
      - { es: "畀你嘅電話號碼我，我就畀我嘅你。", en: "Give me your phone number, and I'll give you mine.", altEs: ["畀你個電話號碼我，我就畀我嘅你。"], grammar: [g.bei-give, g.ge-possessive], vocab: [w.bei2] }
      - { es: "唔該，畀杯凍水我，你太靚，我好熱。", en: "A cold water, please: you're too gorgeous, I'm overheating.", altEs: ["唔該，畀杯凍水我吖，你太靚，我好熱。"], grammar: [g.bei-give, g.mgoi-doze], vocab: [w.dung3-seoi2, w.jit6] }
      - { es: "今晚我畀錢，下次你請。", jp: "gam1 maan5 ngo5 bei2 cin2 haa6 ci3 nei5 ceng2", en: "Tonight I'll pay, next time it's on you.", altEs: ["今晚我畀錢，下次到你請。"], grammar: [g.bei-give], vocab: [w.bei2, w.ceng2] }
      - { es: "我請你飲咖啡，你畀多啲時間我，好唔好？", jp: "ngo5 ceng2 nei5 jam2 gaa3 fe1 nei5 bei2 do1 di1 si4 gaan3 ngo5 hou2 m4 hou2", en: "I'll buy you a coffee and you give me a bit more of your time, deal?", altEs: ["我請你飲咖啡，你畀多啲時間我吖，好唔好？"], grammar: [g.bei-give, g.a-not-a-questions], vocab: [w.ceng2, w.gaa3-fe1] }
      - { es: "你拎杯酒畀我，我就同你跳舞。", en: "Bring me a drink and I'll dance with you.", altEs: ["你拎杯酒畀我，我就同你去跳舞。"], grammar: [g.bei-give], vocab: [w.ling1, w.zau2] }
  - id: a1.u09.l4
    title: 食多啲啦
    teach: [g.particles-aa-laa]
    vocab: [w.laa1, w.tim1, w.min6, w.wan4-tan1-min6, w.wan4-tan1, w.jyu4-daan2, w.baau1.b, w.bo1-lo4-baau1, w.caau2-faan6, w.caau2-min6, w.faan6-hap2, w.tong1, w.ng5-caan1, w.maan5-faan6, w.caan1, w.dip2, w.tou5-ngo6, w.geng2-hot3, w.baau2, w.faai3-caan1, w.dou1-hou2, w.sai1-do1-si2]
    tip: "呀 softens a question or an answer; 啦 turns a sentence into a friendly request or suggestion: 坐啦, 食啦."
    sentences:
      - { es: "你食咗飯未呀？", en: "Have you eaten yet?", altEs: ["食咗飯未呀？", "你食咗飯未？"], grammar: [g.particles-aa-laa, g.greetings], vocab: [], note: "An everyday greeting: people ask it even when they don't plan to eat with you." }
      - { es: "食啦，唔使客氣。", en: "Go on, eat, don't be shy.", altEs: ["食啦，唔好客氣。"], grammar: [g.particles-aa-laa], vocab: [w.laa1] }
      - { es: "你食多啲啦。", en: "Have some more.", altEs: ["食多啲啦。"], grammar: [g.particles-aa-laa], vocab: [w.laa1], transform: { instruction: "Tell him to drink more instead", answer: "你飲多啲啦。", alt: ["飲多啲啦。"], en: "Drink some more." } }
      - { es: "我好肚餓呀！", en: "I'm so hungry!", altEs: ["好肚餓呀！", "我好肚餓啊！"], grammar: [g.particles-aa-laa, g.adjective-predicates], vocab: [w.tou5-ngo6] }
      - { es: "好呀，我哋去食雲吞麵。", en: "Great, let's go and have wonton noodles.", altEs: ["好呀，去食雲吞麵啦。"], grammar: [g.particles-aa-laa], vocab: [w.wan4-tan1-min6], transform: { instruction: "Make it a reluctant \"OK then\"", answer: "好啦，我哋去食雲吞麵。", alt: ["好啦，去食雲吞麵啦。"], en: "OK then, let's go and have wonton noodles." } }
      - { es: "好啦，食炒飯啦。", en: "OK then, fried rice it is.", altEs: ["好啦，叫炒飯啦。"], grammar: [g.particles-aa-laa], vocab: [w.caau2-faan6] }
      - { es: "我好飽，唔食喇。", en: "I'm full, I won't have any more.", altEs: ["我好飽呀，唔食喇。", "好飽，唔食喇。"], grammar: [g.particles-aa-laa, g.m-negation], vocab: [w.baau2], error: { wrong: "我好飽，冇食喇。", explain: "\"I won't eat (any more)\" uses 唔; 冇 means \"didn't\" or \"don't have\".", grammar: g.m-negation } }
      - { es: "我頸渴呀，有冇凍水呀？", en: "I'm thirsty, is there any cold water?", altEs: ["我頸渴，有冇凍水呀？", "我好頸渴呀，有冇凍水呀？"], grammar: [g.particles-aa-laa, g.jau-have], vocab: [w.geng2-hot3] }
      - { es: "早餐我食菠蘿包同飲奶茶。", en: "For breakfast I have a pineapple bun and milk tea.", altEs: ["我早餐食菠蘿包，飲奶茶。"], grammar: [g.time-before-verb], vocab: [w.zou2-caan1, w.bo1-lo4-baau1] }
      - { es: "一碗粥，一碟炒麵，唔該。", en: "A bowl of congee and a plate of fried noodles, please.", altEs: ["唔該，一碗粥，一碟炒麵。"], grammar: [g.common-classifiers, g.mgoi-doze], vocab: [w.zuk1, w.caau2-min6, w.dip2], transform: { instruction: "Order fried rice instead of fried noodles", answer: "一碗粥，一碟炒飯，唔該。", alt: ["唔該，一碗粥，一碟炒飯。"], en: "A bowl of congee and a plate of fried rice, please." } }
      - { es: "午餐我通常買飯盒。", en: "For lunch I usually buy a lunch box.", altEs: ["我午餐通常買飯盒。"], grammar: [g.frequency-adverbs], vocab: [w.ng5-caan1, w.faan6-hap2] }
      - { es: "加多碗飯添，唔該。", en: "Another bowl of rice, please.", altEs: ["唔該，加多碗飯添。", "唔該，加碗飯。"], grammar: [g.particles-aa-laa, g.mgoi-doze], vocab: [w.tim1], error: { wrong: "加多碗飯添，多謝。", explain: "Asking for more food is asking for a service, so say 唔該.", grammar: g.mgoi-doze } }
      - { es: "呢碗湯好熱呀，慢慢飲啦。", en: "This soup is very hot, drink it slowly.", altEs: ["呢碗湯好熱，慢慢飲啦。"], grammar: [g.particles-aa-laa], vocab: [w.tong1] }
      - { es: "我哋今晚喺屋企食晚飯啦。", en: "Let's have dinner at home tonight.", altEs: ["今晚我哋喺屋企食晚飯啦。"], grammar: [g.particles-aa-laa, g.time-before-verb], vocab: [w.maan5-faan6] }
      - { es: "快餐好平，不過唔係好好食。", jp: "faai3 caan1 hou2 peng4 bat1 gwo3 m4 hai6 hou2 hou2 sik6", en: "Fast food is cheap, but it's not very good.", altEs: ["快餐好平，但係唔係好好食。"], grammar: [g.adjective-predicates], vocab: [w.faai3-caan1] }
      - { es: "坐啦，食魚蛋啦！", en: "Have a seat, have some fish balls!", altEs: ["坐啦，食啲魚蛋啦！"], grammar: [g.particles-aa-laa], vocab: [w.jyu4-daan2, w.laa1] }
    exchanges:
      - q: { es: "你食咗飯未呀？", en: "Have you eaten yet?" }
        a: { es: "食咗喇，你呢？", en: "Yes, I have. And you?" }
        alt: ["未呀。", "未，好肚餓呀！"]
        grammar: [g.particles-aa-laa]
        vocab: [w.tou5-ngo6]
      - q: { es: "我哋去食雲吞麵，好唔好？", en: "Shall we go and have wonton noodles?" }
        a: { es: "好呀！", en: "Sure!" }
        alt: ["好啦。", "唔好喇，我好飽。"]
        grammar: [g.particles-aa-laa]
        vocab: [w.wan4-tan1-min6]
      - q: { es: "你食唔食多啲呀？", en: "Will you have some more?" }
        a: { es: "唔食喇，好飽呀。", en: "No more, I'm full." }
        alt: ["好呀，多謝。", "食多少少啦。"]
        grammar: [g.particles-aa-laa, g.a-not-a-questions]
        vocab: [w.baau2]
      - q: { es: "你早餐食咩呀？", en: "What do you have for breakfast?" }
        a: { es: "菠蘿包同奶茶。", en: "A pineapple bun and milk tea." }
        alt: ["我食粥。", "西多士。", "我唔食早餐。"]
        grammar: [g.question-words]
        vocab: [w.zou2-caan1, w.bo1-lo4-baau1, w.sai1-do1-si2]
      - q: { es: "坐啦，飲杯茶先啦。", en: "Have a seat and have a cup of tea first." }
        a: { es: "唔該晒！", en: "Thanks so much!" }
        alt: ["多謝！", "好呀。"]
        grammar: [g.particles-aa-laa]
        vocab: [w.laa1]
    texts:
      - title: "茶餐廳早餐"
        es: ["朝早八點，茶餐廳好多人。", "我叫一份西多士同一杯奶茶。", "好飽呀！"]
        en: ["At eight in the morning the cha chaan teng is packed.", "I order French toast and a milk tea.", "I'm so full!"]
        grammar: [g.particles-aa-laa]
        vocab: [w.sai1-do1-si2, w.baau2]
      - title: "阿媽"
        es: ["阿仔，食飯啦！", "今晚有湯，有魚，有菜。", "食多啲啦，你好瘦呀。"]
        en: ["Son, dinner's ready!", "Tonight there's soup, fish and vegetables.", "Have some more, you're so thin."]
        grammar: [g.particles-aa-laa]
        vocab: [w.laa1, w.tong1]
    spicy:
      - { es: "你好肚餓呀？我都係，一齊食飯啦。", en: "You're hungry? Me too, let's eat together.", altEs: ["你好肚餓呀？我都係呀，一齊食飯啦。"], grammar: [g.particles-aa-laa], vocab: [w.tou5-ngo6] }
      - { es: "你食飽未呀？我仲想同你傾偈。", en: "Have you finished eating? I still want to chat with you.", altEs: ["你食飽未呀？我仲想同你傾吓偈。"], grammar: [g.particles-aa-laa], vocab: [w.baau2] }
      - { es: "我唔肚餓，我係想見你咋。", en: "I'm not hungry, I just wanted to see you.", altEs: ["我唔係肚餓，我係想見你咋。"], grammar: [g.particles-aa-laa], vocab: [w.tou5-ngo6] }
      - { es: "坐啦，坐近啲啦。", jp: "co5 laa1 co5 kan5 di1 laa1", en: "Sit down, sit a bit closer.", altEs: ["坐啦，坐埋嚟啦。"], grammar: [g.particles-aa-laa], vocab: [w.laa1] }
      - { es: "好啦，你煮早餐，我煮咖啡。", en: "OK then: you make breakfast, I'll make the coffee.", altEs: ["好啦，你整早餐，我整咖啡。"], grammar: [g.particles-aa-laa], vocab: [w.zou2-caan1] }
dialogues:
  - id: a1.u09.d1
    title: 喺酒樓飲茶
    context: Mandy and Kelvin go for yum cha on Mandy's birthday.
    lines:
      - { speaker: 伙記, es: "早晨！幾位呀？", en: "Good morning! How many?" }
      - { speaker: Mandy, es: "兩位，唔該。", en: "Two, please." }
      - { speaker: 伙記, es: "飲咩茶呀？", en: "What tea would you like?" }
      - { speaker: Kelvin, es: "一壺普洱，唔該。", en: "A pot of pu'er, please." }
      - { speaker: Mandy, es: "你鍾唔鍾意食鳳爪呀？", en: "Do you like chicken feet?" }
      - { speaker: Kelvin, es: "唔係幾鍾意。我最鍾意蝦餃同燒賣。", en: "Not really. My favourites are har gow and siu mai." }
      - { speaker: Mandy, es: "好呀，叫一籠蝦餃、一籠燒賣，再加一碟腸粉啦。", en: "OK, let's order a basket of har gow, a basket of siu mai, and a plate of rice rolls as well." }
      - { speaker: Kelvin, es: "伙記，唔該加啲滾水。", en: "Waiter, more hot water, please." }
      - { speaker: 伙記, es: "好，即刻嚟。", en: "Sure, right away." }
      - { speaker: Mandy, es: "好飽呀！伙記，唔該埋單。", en: "I'm so full! Waiter, the bill, please." }
      - { speaker: Kelvin, es: "我畀啦，今日你生日！", en: "I'll pay, it's your birthday today!" }
      - { speaker: Mandy, es: "多謝你呀！", en: "Thank you!" }
    questions:
      - { q: "佢哋飲咩茶？", options: ["香片", "普洱", "奶茶"], answer: 1, explain: "Kelvin orders 一壺普洱." }
      - { q: "Kelvin最鍾意食乜嘢點心？", options: ["鳳爪", "蝦餃同燒賣", "腸粉"], answer: 1, explain: "He says 我最鍾意蝦餃同燒賣; he doesn't really like chicken feet." }
