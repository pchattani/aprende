id: r.c1.la-gente-rossa-di-cagliari
level: c1
title: La «gente rossa» di Cagliari
kind: text
intro: "A magazine essay about the pink flamingos that nest in the Molentargius lagoon, a few minutes from the centre of Cagliari: how a former salt works became a nature park inside a city. Watch for the cohesion and discourse markers of c1.u04 (tuttavia, ciononostante, in altre parole, quest'ultimo) and the nominal style of c1.u06."
allow: [cagliari, molentargius, poetto, sardegna, sardi, genti, arrubia, castello, sardo, unesco]
paragraphs:
  - { es: "Ci sono poche città al mondo in cui si possono vedere migliaia di fenicotteri dalla finestra dell'autobus. Cagliari è una di queste. Basta prendere la strada che dal centro porta alla spiaggia del Poetto e guardare a sinistra: nelle acque basse dello stagno di Molentargius, a pochi metri dalle case e dal traffico, centinaia di uccelli rosa camminano lentamente, con la testa sott'acqua, cercando il cibo.", en: "There are few cities in the world where you can see thousands of flamingos from a bus window. Cagliari is one of them. You only have to take the road that leads from the centre to Poetto beach and look to the left: in the shallow waters of the Molentargius lagoon, a few metres from the houses and the traffic, hundreds of pink birds walk slowly, heads underwater, looking for food." }
  - { es: "I sardi li chiamano «sa genti arrubia», la gente rossa, e il nome dice molto. Non sono semplici animali di passaggio, ma quasi degli abitanti della città, con le loro abitudini, i loro orari e perfino i loro quartieri preferiti. D'inverno se ne contano a volte più di diecimila; in primavera, quando costruiscono i nidi, lo stagno si trasforma in una grande colonia, una delle più importanti del Mediterraneo.", en: "Sardinians call them 'sa genti arrubia', the red people, and the name says a lot. They aren't just animals passing through, but almost inhabitants of the city, with their own habits, their own timetables and even their favourite neighbourhoods. In winter there are sometimes more than ten thousand of them; in spring, when they build their nests, the lagoon turns into a great colony, one of the most important in the Mediterranean." }
  - { es: "Eppure non è sempre stato così. Per secoli, nella zona di Molentargius si è prodotto il sale: l'acqua del mare entrava nelle vasche, il sole la faceva evaporare e gli operai raccoglievano il sale a mano. Era un lavoro durissimo, spesso svolto in condizioni difficili. Quando le saline chiusero, negli anni Ottanta, molti pensarono che l'area sarebbe diventata una periferia come tante, piena di palazzi e di strade.", en: "And yet it hasn't always been like this. For centuries salt was produced in the Molentargius area: sea water flowed into the pans, the sun evaporated it and workers gathered the salt by hand. It was extremely hard work, often done in difficult conditions. When the salt works closed in the 1980s, many people thought the area would become a suburb like any other, full of blocks of flats and roads." }
  - { es: "Andò diversamente. Proprio l'abbandono delle saline creò un ambiente ideale per gli uccelli: acque basse, poco disturbo, molto cibo. All'inizio degli anni Novanta i fenicotteri cominciarono a fare i nidi nello stagno, cosa che in Italia non succedeva da moltissimo tempo. La notizia fece il giro del Paese. Pochi anni dopo l'area fu trasformata in parco naturale regionale.", en: "Things turned out differently. It was precisely the abandonment of the salt works that created an ideal environment for the birds: shallow water, little disturbance, plenty of food. At the beginning of the 1990s the flamingos began to nest in the lagoon, something that hadn't happened in Italy for a very long time. The news went round the country. A few years later the area was turned into a regional nature park." }
  - { es: "La creazione del parco, tuttavia, non ha risolto tutti i problemi. Lo stagno si trova all'interno di un'area urbana di più di quattrocentomila abitanti, e quest'ultima continua a crescere. L'inquinamento dell'acqua, il rumore degli aerei e del traffico, le persone che entrano nelle zone protette con i cani: sono tutti rischi per una colonia che ha bisogno di tranquillità. In altre parole, la convivenza tra la città e gli uccelli è possibile, ma non è automatica.", en: "The creation of the park, however, did not solve every problem. The lagoon lies within an urban area of more than four hundred thousand inhabitants, and the latter keeps growing. Water pollution, the noise of planes and traffic, people walking into protected zones with their dogs: all are risks for a colony that needs peace and quiet. In other words, coexistence between the city and the birds is possible, but it isn't automatic." }
  - { es: "Ciononostante, il bilancio di questi trent'anni è positivo. Il parco è diventato uno dei luoghi preferiti dai cagliaritani, che ci vanno a correre, a passeggiare in bicicletta, a guardare il tramonto. Le scuole organizzano visite per gli studenti, e i ricercatori dell'università studiano la colonia come un laboratorio a cielo aperto. Per i turisti, poi, vedere i fenicotteri a due passi dalla città è spesso una sorpresa più forte delle spiagge.", en: "Nevertheless, the balance of these thirty years is positive. The park has become one of the favourite places of the people of Cagliari, who go there to run, cycle and watch the sunset. Schools organise visits for students, and university researchers study the colony as an open-air laboratory. For tourists, what's more, seeing flamingos a stone's throw from the city is often a bigger surprise than the beaches." }
  - { es: "Del resto, il parco non ospita solo i fenicotteri. Chi ha un po' di pazienza e un binocolo può osservare aironi, cavalieri d'Italia, gabbiani e decine di altre specie, alcune delle quali molto rare. Lungo i vecchi canali delle saline sono stati creati percorsi a piedi e in bicicletta, e alcuni edifici dove un tempo lavoravano gli operai sono diventati centri per l'educazione ambientale. Il passato industriale, in altre parole, non è stato cancellato: è diventato parte del paesaggio.", en: "Besides, the park isn't home only to flamingos. Anyone with a little patience and a pair of binoculars can watch herons, black-winged stilts, gulls and dozens of other species, some of them very rare. Along the old salt-works canals, walking and cycling paths have been created, and some of the buildings where the workers once worked have become centres for environmental education. The industrial past, in other words, hasn't been erased: it has become part of the landscape." }
  - { es: "C'è chi vede in questa storia una lezione più generale. Per decenni si è pensato che natura e città fossero nemiche, e che per proteggere la prima bisognasse allontanarla dalla seconda. Molentargius dimostra il contrario: un ambiente modificato dall'uomo, e poi abbandonato, può diventare un rifugio, a condizione che qualcuno decida di proteggerlo. Non si tratta, insomma, di tornare a un passato perfetto che forse non è mai esistito, ma di costruire un equilibrio nuovo.", en: "Some see a more general lesson in this story. For decades people thought that nature and cities were enemies, and that to protect the former it had to be kept away from the latter. Molentargius shows the opposite: an environment modified by humans, and then abandoned, can become a refuge, provided that someone decides to protect it. In short, it isn't a matter of going back to a perfect past that perhaps never existed, but of building a new balance." }
  - { es: "Al tramonto, quando il cielo sopra lo stagno diventa dello stesso colore delle loro piume, i fenicotteri si alzano in volo tutti insieme, con un rumore che sembra un applauso. Dal quartiere di Castello, sulla collina, la gente si ferma a guardarli. Qualcuno fa una foto; molti, semplicemente, restano in silenzio.", en: "At sunset, when the sky above the lagoon turns the same colour as their feathers, the flamingos take off all together, with a sound like applause. From the Castello district, up on the hill, people stop to watch them. Some take a photo; many simply stand in silence." }
questions:
  - { q: "Che cosa rende speciale Cagliari, secondo l'inizio del testo?", options: ["Ha la spiaggia più lunga d'Europa", "Si possono vedere migliaia di fenicotteri vicino al centro, perfino dall'autobus", "È l'unica città sarda con un parco"], answer: 1, explain: "«Ci sono poche città al mondo in cui si possono vedere migliaia di fenicotteri dalla finestra dell'autobus. Cagliari è una di queste.»" }
  - { q: "Che cosa si faceva a Molentargius prima del parco?", options: ["Si coltivava il riso", "Si produceva il sale", "C'era un aeroporto militare"], answer: 1, explain: "«Per secoli, nella zona di Molentargius si è prodotto il sale» – the si passivante." }
  - { q: "Perché la chiusura delle saline ha favorito i fenicotteri?", options: ["Perché l'abbandono ha creato un ambiente ideale: acque basse, poco disturbo, molto cibo", "Perché gli operai davano da mangiare agli uccelli", "Perché il Comune ha portato i fenicotteri da un altro Paese"], answer: 0, explain: "«Proprio l'abbandono delle saline creò un ambiente ideale per gli uccelli» – proprio + subject for focus." }
  - { q: "Nella frase «e quest'ultima continua a crescere», a che cosa si riferisce «quest'ultima»?", options: ["Alla colonia di fenicotteri", "All'area urbana", "Alla creazione del parco"], answer: 1, explain: "quest'ultimo / quest'ultima refers back to the last-mentioned noun of matching gender: un'area urbana (c1.u04 anaphora)." }
  - { q: "Qual è la «lezione più generale» che alcuni vedono in questa storia?", options: ["Che la natura va sempre separata dalla città", "Che un ambiente modificato dall'uomo può diventare un rifugio, se qualcuno decide di proteggerlo", "Che bisogna tornare al passato"], answer: 1, explain: "«Molentargius dimostra il contrario: un ambiente modificato dall'uomo… può diventare un rifugio, a condizione che qualcuno decida di proteggerlo» – a condizione che + congiuntivo." }
