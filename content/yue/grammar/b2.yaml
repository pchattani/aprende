# B2 grammar notes (Hong Kong Cantonese). Explanations use light markdown:
# ### headings, bullets, pipe tables, **bold**. Cantonese examples are in
# traditional characters followed by toned Jyutping in brackets.
- id: g.wo5-hearsay
  level: b2
  title: "喎 (wo5) - so I'm told, they say"
  summary: "喎 in tone 5 at the end marks reported information: 佢話今晚唔嚟喎 'he says he's not coming tonight'."
  explanation: |
    喎 (wo5), with a low rising tone, marks something as **second-hand**: you are passing on what someone else said.
    - 佢話今晚唔嚟喎 (keoi5 waa6 gam1 maan5 m4 lai4 wo5) - He says he isn't coming tonight.
    - 天文台話聽日會打風喎 - The Observatory says there'll be a typhoon tomorrow.
    - 老細叫你即刻入去喎 - The boss wants you in his office right away (he says).

    ### 話 is optional
    喎 alone can do the work of "he said": 佢唔嚟喎 "He's not coming, apparently."

    ### Passing on instructions
    It softens orders that come from someone else, so they don't sound like your own: 醫生叫你戒口喎 "The doctor says you should watch what you eat."

    | Without 喎 | With 喎 |
    |---|---|
    | 佢唔嚟 - he isn't coming (I state it) | 佢唔嚟喎 - he isn't coming (so he says) |

    Don't confuse it with 喎 (wo3), the particle of noticing (next note).
  examples:
    - { es: "阿媽話今晚煲湯喎。", en: "Mum says she's making soup tonight." }
    - { es: "佢話尾班船已經走咗喎。", en: "He says the last ferry has already gone.", altEn: ["She says the last ferry has already gone."] }
    - { es: "聽講長洲今年好多人喎。", en: "Apparently Cheung Chau is really crowded this year." }
    - { es: "經理叫你覆佢電話喎。", en: "The manager wants you to call him back." }
  pitfalls:
    - "喎 (wo5) for hearsay rises from low; 喎 (wo3) for noticing is mid-level. Saying the wrong one changes 'he says' into 'oh, I see'."
    - "喎 goes at the very end of the sentence, after any other particle except a following question."
  related: [g.reported-speech, g.wo3-noticing, g.particle-tones]
  drills:
    - { es: "佢話佢遲啲到喎。", en: "He says he'll be a bit late.", altEn: ["She says she'll be a bit late."] }
    - { es: "天文台話會落大雨喎。", en: "The Observatory says it's going to pour." }
    - { es: "老師叫你聽日帶埋本書喎。", en: "The teacher says to bring the book tomorrow." }

- id: g.wo3-noticing
  level: b2
  title: "喎 (wo3) - oh, I notice; mind you"
  summary: "喎 in tone 3 marks something just noticed or a reminder: 好靚喎 'oh, it's lovely!', 記住喎 'remember, mind'."
  explanation: |
    喎 (wo3), mid-level tone, has two related uses:

    ### Noticing, realising
    The speaker has just become aware of something:
    - 好靚喎 (hou2 leng3 wo3) - Oh, that's really pretty!
    - 落雨喎 (lok6 jyu5 wo3) - Oh, it's raining.
    - 原來你識講廣東話喎 - Oh, so you speak Cantonese!

    ### Reminding, insisting
    It adds "mind you, I'm telling you":
    - 唔好唔記得喎 - Don't forget, now.
    - 我唔係講笑喎 - I'm not joking, you know.
    - 好貴喎 - It's really expensive, mind.

    ### Polite objection
    With 唔係 it softly contradicts: 唔係喎，佢係星期六先到 "No, actually, he's arriving on Saturday."
  examples:
    - { es: "嘩，呢度個海好靚喎！", en: "Wow, the sea here is gorgeous!" }
    - { es: "咦，佢都喺度喎。", en: "Oh, he's here too.", altEn: ["Oh, she's here too."] }
    - { es: "記得帶身份證喎。", en: "Remember to bring your ID card, mind." }
    - { es: "唔係喎，尾班船係十點。", en: "No, actually, the last ferry is at ten." }
  pitfalls:
    - "Keep it mid-level (wo3); a rising wo5 would mean 'so they say'."
    - "Overusing reminder 喎 with seniors can sound naggy; use it with friends and family."
  related: [g.wo5-hearsay, g.jyun-loi-turns-out, g.particle-tones]
  drills:
    - { es: "好香喎！", en: "Smells great!" }
    - { es: "唔好遲到喎。", en: "Don't be late, now." }
    - { es: "原來今日放假喎。", en: "Oh, it's a holiday today." }
    - { es: "唔係喎，佢唔係噉講。", en: "No, actually, that's not what he said.", altEn: ["No, actually, that's not what she said."] }

- id: g.gaa3-explaining
  level: b2
  title: "㗎 - explaining, insisting, checking"
  summary: "㗎 (gaa3), a fusion of 嘅 + 呀, explains or insists ('you know'); in questions it seeks confirmation or shows surprise."
  explanation: |
    㗎 (gaa3) is 嘅 (ge3) + 呀 (aa3) fused into one syllable.

    ### Statements: explaining, "you know"
    - 呢度啲嘢好貴㗎 (ni1 dou6 di1 je5 hou2 gwai3 gaa3) - Things here are expensive, you know.
    - 佢係我表哥嚟㗎 - He's my cousin, you see.
    - 冇問題㗎 - It's no problem at all.

    ### Questions: checking, surprise
    Added to a question (which already has a question word or A-not-A), 㗎 makes it sound like "I'm curious / surprised":
    - 你點知㗎？ (nei5 dim2 zi1 gaa3) - How did you know?
    - 你係唔係香港人㗎？ - Are you from Hong Kong, then?

    ### 㗎 (gaa2): really?
    With a rising tone, 㗎 asks with disbelief: 真㗎？ (zan1 gaa2) "Really?" 係咪㗎？ "Is that so?"

    ### Classifying: 係…嚟㗎
    係 + noun + 嚟㗎 identifies what something is: 呢個係榴槤嚟㗎 "This is a durian (you know)."
  examples:
    - { es: "佢好叻㗎，識講五種語言。", en: "She's really clever, you know, she speaks five languages.", altEn: ["He's really clever, you know, he speaks five languages."] }
    - { es: "你幾時嚟㗎？", en: "When did you get here?" }
    - { es: "真㗎？我唔信。", en: "Really? I don't believe it." }
    - { es: "呢啲係平安包嚟㗎。", en: "These are peace buns, you see." }
  pitfalls:
    - "Don't use 㗎 to make a question by itself: it needs a question word or A-not-A (你去唔去㗎？), except rising 真㗎？"
    - "㗎 is not possession: 我㗎 is unusual; 'mine' is 我嘅."
  related: [g.ge-assertion, g.hai-ge-focus, g.particle-clusters]
  drills:
    - { es: "好遠㗎，你行唔行得到㗎？", en: "It's a long way, can you walk it?" }
    - { es: "我唔知㗎。", en: "I had no idea." }
    - { es: "呢個係咩嚟㗎？", en: "What's this, then?" }
    - { es: "唔使驚，佢唔咬人㗎。", en: "Don't be scared, he doesn't bite." }

- id: g.lo1-obvious
  level: b2
  title: "囉 - that's how it is, obviously"
  summary: "囉 (lo1) marks a conclusion as obvious or inevitable, sometimes with resignation: 咪坐的士囉 'just take a taxi, then'."
  explanation: |
    囉 (lo1) says "it's obvious, that's simply how it is", often with a shrug:
    - 唔鍾意咪唔好食囉 (m4 zung1 ji3 mai6 m4 hou2 sik6 lo1) - If you don't like it, then don't eat it.
    - 冇得揀，咪等囉 - There's no choice, so we wait.
    - 咪係囉 (mai6 hai6 lo1) - Exactly! That's what I said.

    ### With 咪
    咪 (mai6) "isn't it just …" often comes before the verb in 囉 sentences: 咪…囉 "well then, just …".

    ### Resignation
    - 佢唔嚟就算囉 - If he isn't coming, so be it.
    - 遲咗就遲咗囉 - Late is late (nothing to be done).

    ### 囉 (lo3)
    A mid-tone 囉 (lo3) is used in narration and listing to mark points as plain facts: 跟住佢就走咗囉 "And then he just left." Many speakers use lo1 and lo3 in overlapping ways.
  examples:
    - { es: "架船走咗，咪等下一班囉。", en: "The ferry's gone, so we'll just wait for the next one." }
    - { es: "你攰咪瞓囉。", en: "If you're tired, just go to sleep." }
    - { es: "咪係囉，我都係噉講。", en: "Exactly, that's what I said." }
    - { es: "佢唔聽，我都冇辦法囉。", en: "He won't listen, so there's nothing I can do.", altEn: ["She won't listen, so there's nothing I can do."] }
  pitfalls:
    - "囉 can sound offhand or impatient; with strangers or bosses, a neutral sentence is safer."
    - "咪 here (mai6) means 'isn't it just', not the 'don't' 咪 (mai5) in 咪郁."
  related: [g.maa3-as-you-know, g.particle-tones, g.particle-clusters]
  drills:
    - { es: "冇錢咪唔買囉。", en: "If you don't have the money, just don't buy it." }
    - { es: "佢鍾意咪由佢囉。", en: "If she likes it, let her be.", altEn: ["If he likes it, let him be."] }
    - { es: "咪係囉！", en: "Exactly!" }

- id: g.maa3-as-you-know
  level: b2
  title: "嘛 - after all, as you know"
  summary: "嘛 (maa3) presents a reason as obvious or already known: 佢係醫生嘛 'well, she is a doctor, after all'."
  explanation: |
    嘛 (maa3) points to something the listener **should already know** or that is self-evident:
    - 佢係醫生嘛 (keoi5 hai6 ji1 sang1 maa3) - She's a doctor, after all.
    - 我話咗你知㗎嘛 - I did tell you, you know.
    - 平嘛，咪買多啲 - It's cheap, after all, so buy a few more.

    ### 吖嘛
    吖嘛 (aa1 maa3) is the most common form, explaining a reason: 佢哋放假吖嘛 "Well, they're on holiday."

    ### 咋嘛 / 啫嘛
    With "only" particles it means "it's just …, that's all": 講吓咋嘛 "I'm only saying."

    ### 嘛 vs 囉
    | Particle | Points to |
    |---|---|
    | 嘛 | an obvious reason (because, after all) |
    | 囉 | an obvious conclusion (so, then) |

    佢病咗吖嘛 "He's ill, after all" (reason); 佢病咗，咪唔嚟囉 "He's ill, so he's not coming, obviously" (conclusion).
  examples:
    - { es: "梗係咁多人啦，係週末吖嘛。", en: "Of course it's crowded, it's the weekend after all." }
    - { es: "你唔使驚，佢係你朋友嘛。", en: "Don't be scared, he's your friend after all.", altEn: ["Don't be scared, she's your friend after all."] }
    - { es: "我講笑咋嘛。", en: "I'm only joking." }
    - { es: "佢識路㗎嘛，唔使擔心。", en: "He knows the way, you know, no need to worry.", altEn: ["She knows the way, you know, no need to worry."] }
  pitfalls:
    - "In Cantonese 嘛 is not the Mandarin question 嗎: 你去嘛 means 'you're going, after all', not 'are you going?'"
    - "Using 嘛 with someone senior can imply they should have known; soften with 我諗 or drop it."
  related: [g.lo1-obvious, g.aa1-offer, g.particle-clusters]
  drills:
    - { es: "佢好攰吖嘛，成日加班。", en: "Well, he's exhausted, he works overtime all the time.", altEn: ["Well, she's exhausted, she works overtime all the time."] }
    - { es: "試吓啫嘛，唔好咁緊張。", en: "It's just a try, don't be so nervous." }
    - { es: "梗係啦，佢係香港人嘛。", en: "Of course, he's from Hong Kong after all.", altEn: ["Of course, she's from Hong Kong after all."] }

- id: g.me1-surprise
  level: b2
  title: "咩 - surprised or doubtful questions"
  summary: "Statement + 咩 asks with surprise or disbelief: 你唔知咩？ 'You didn't know?!'"
  explanation: |
    咩 (me1) added to a **statement** turns it into a surprised or sceptical question, expecting the answer "no, surely not":
    - 你唔知咩？ (nei5 m4 zi1 me1) - You didn't know?!
    - 佢係你老公咩？ - He's your husband? (I'm surprised)
    - 有咁平咩？ - Is it really that cheap?

    ### 咩 vs 嗎
    | Question | Feel |
    |---|---|
    | 你去嗎？ | neutral: are you going? |
    | 你去咩？ | surprised: you're going?! |

    ### 嘅咩 / 㗎咩
    Combined with 嘅: 係噉嘅咩？ (hai6 gam2 ge3 me1) "Is that really how it is?" 唔係㗎咩？ "Isn't it?" (I thought it was).

    ### Two meanings of 咩
    Don't confuse it with 咩, the short form of 乜嘢 "what": 你食咩呀？ "What are you eating?" The particle comes at the very end and has no question word in the sentence.
  examples:
    - { es: "你未去過長洲咩？", en: "You've never been to Cheung Chau?" }
    - { es: "今日放假咩？", en: "Is today a holiday? (I didn't think so)" }
    - { es: "佢唔係香港人咩？", en: "Isn't he from Hong Kong?", altEn: ["Isn't she from Hong Kong?"] }
    - { es: "真係要排兩個鐘嘅咩？", en: "Do we really have to queue for two hours?" }
  pitfalls:
    - "Don't use 咩 for neutral questions; it signals surprise and can sound challenging."
    - "A sentence with a question word (邊度, 幾時) doesn't take particle 咩; there 咩 would be read as 'what'."
  related: [g.maa-questions, g.question-words, g.rhetorical-questions]
  drills:
    - { es: "你識佢咩？", en: "You know him?!", altEn: ["You know her?!"] }
    - { es: "咁快就走咩？", en: "Leaving so soon?" }
    - { es: "唔係星期六咩？", en: "Wasn't it Saturday?" }

- id: g.gwaa3-guess
  level: b2
  title: "啩 - I suppose, I guess"
  summary: "啩 at the end makes a statement a tentative guess: 應該係噉啩 'I guess that's right'."
  explanation: |
    啩 (gwaa3) marks the speaker's **uncertainty**, like "I suppose / probably":
    - 佢應該到咗啩 (keoi5 jing1 goi1 dou3 zo2 gwaa3) - I suppose he's arrived by now.
    - 唔會啩 (m4 wui5 gwaa3) - Surely not? / I doubt it.
    - 係啩 (hai6 gwaa3) - I guess so.

    ### With probability words
    啩 often pairs with 應該, 可能, 大概 (daai6 koi3) "probably": 大概三百蚊啩 "About three hundred dollars, I think."

    ### 唔會啩: polite disbelief
    唔會啩？ is a soft "No way?" when you hear surprising news.

    | Statement | + 啩 |
    |---|---|
    | 佢唔記得 - he forgot | 佢唔記得啩 - he forgot, I suppose |
    | 好貴 - expensive | 好貴啩 - must be expensive |
  examples:
    - { es: "坐船去大澳要個半鐘啩。", en: "The ferry to Tai O takes about an hour and a half, I think." }
    - { es: "佢今晚唔會嚟啩。", en: "I don't suppose he'll come tonight.", altEn: ["I don't suppose she'll come tonight."] }
    - { es: "唔會啩？真係咁貴？", en: "No way! Is it really that expensive?" }
    - { es: "應該冇事啩。", en: "It should be OK, I guess." }
  pitfalls:
    - "啩 makes your statement sound unsure; don't use it when giving firm information or instructions."
    - "唔會啩 is a reaction of disbelief, not a negative prediction, when said as a question."
  related: [g.probability, g.particle-clusters, g.hedging]
  drills:
    - { es: "佢已經瞓咗啩。", en: "She's probably asleep already.", altEn: ["He's probably asleep already."] }
    - { es: "大概十個人啩。", en: "About ten people, I guess." }
    - { es: "唔會啩！", en: "No way!" }

- id: g.particle-clusters
  level: b2
  title: "Particle clusters - 㗎喇, 咋嘛, 嘅咩, 㗎咋"
  summary: "Particles stack in a fixed order, each adding its own meaning: 好平㗎咋 'it's only cheap, you know'."
  explanation: |
    Cantonese can stack two or even three particles. Each keeps its meaning:
    | Cluster | Jyutping | Parts | Meaning |
    |---|---|---|---|
    | 㗎喇 | gaa3 laa3 | 㗎 explanation + 喇 change | it's (now) like that |
    | 咗喇 | zo2 laa3 | aspect + change | has (now) happened |
    | 咋嘛 | zaa3 maa3 | only + obvious | it's only …, that's all |
    | 嘅咩 | ge3 me1 | assertion + surprise | is it really …? |
    | 㗎咋 | gaa3 zaa3 | explanation + only | only …, you know |
    | 嘅喎 | ge3 wo3 | assertion + noticing | oh, it is … |

    - 好快就到㗎喇 (hou2 faai3 zau6 dou3 gaa3 laa3) - We'll be there very soon now.
    - 十蚊㗎咋 (sap6 man1 gaa3 zaa3) - It's only ten dollars, you know.
    - 佢講吓咋嘛 - He was only saying it.

    ### Order
    Aspect particles (咗) come first, then assertion (嘅/㗎), then change (喇), then attitude (咩, 喎, 嘛). You don't need to produce long clusters, but recognising them helps a lot with natural speech.
  examples:
    - { es: "唔使急，就嚟開㗎喇。", en: "No need to rush, it's about to start." }
    - { es: "呢對鞋三百蚊㗎咋。", en: "These shoes are only three hundred dollars, you know." }
    - { es: "佢都係講吓咋嘛，唔好當真。", en: "He was only joking, don't take it seriously.", altEn: ["She was only joking, don't take it seriously."] }
    - { es: "真係要錢嘅咩？", en: "Do you really have to pay?" }
  pitfalls:
    - "Don't invent random clusters; stick to the common ones and keep their order."
    - "Each particle keeps its tone in a cluster: 㗎喇 is gaa3 laa3, not gaa1 laa1."
  related: [g.gaa3-explaining, g.zaa3-ze1-only, g.particle-tones]
  drills:
    - { es: "我哋食咗飯㗎喇。", en: "We've already eaten." }
    - { es: "五分鐘咋嘛。", en: "It's only five minutes." }
    - { es: "原來係免費嘅喎。", en: "Oh, it's free." }

- id: g.particle-tones
  level: b2
  title: "Same letters, different tone - particle pairs"
  summary: "Many particles come in tone pairs with different meanings: 啦 laa1 vs 喇 laa3, 吖 aa1 vs 呀 aa3, 喎 wo3 vs wo5, 㗎 gaa3 vs gaa2."
  explanation: |
    Particles are short, but their **tone** carries meaning:
    | Particle | Tone | Meaning | Example |
    |---|---|---|---|
    | 啦 | laa1 | urging, suggestion | 走啦 Let's go! |
    | 喇 | laa3 | change of state | 走喇 I'm off now. |
    | 吖 | aa1 | offer, agreement | 好吖 Sure. |
    | 呀 | aa3 | softening | 好呀 OK! |
    | 喎 | wo3 | noticing, reminding | 好靚喎 Oh, pretty! |
    | 喎 | wo5 | hearsay | 佢唔嚟喎 He's not coming, he says. |
    | 㗎 | gaa3 | explaining | 好貴㗎 It's pricey, you know. |
    | 㗎 | gaa2 | disbelieving question | 真㗎？ Really? |
    | 囉 | lo1 | obviousness | 咪係囉 Exactly. |

    ### Intonation vs tone
    Cantonese uses particles where English uses intonation. Don't try to "raise your voice" at the end of a Cantonese question: the particle does the job, and its tone must stay correct.

    ### Listening tip
    Many writers use the same character for different tones (啦 for both laa1 and laa3), so listen rather than read.
  examples:
    - { es: "食啦，唔使客氣。", en: "Go on, eat, help yourself." }
    - { es: "我食飽喇。", en: "I'm full now." }
    - { es: "佢話唔嚟喎。", en: "He says he's not coming.", altEn: ["She says she's not coming."] }
    - { es: "真㗎？", en: "Really?" }
  pitfalls:
    - "Saying 走啦 (laa1) to your host means 'let's go!'; to announce you're leaving, say 我走喇 (laa3) or 我走先."
    - "Don't add English-style rising intonation on top of a particle; it can turn a statement into a strange question."
  related: [g.laa1-suggestion, g.laa3-change, g.wo5-hearsay]
  drills:
    - { es: "好吖，一齊去。", en: "Sure, let's go together." }
    - { es: "落雨喇。", en: "It's started raining." }
    - { es: "好靚喎。", en: "Oh, that's lovely." }

- id: g.lin-dou-even
  level: b2
  title: "連…都 - even"
  summary: "連 + the surprising item + 都 + verb means 'even …': 連阿婆都識用手機。"
  explanation: |
    To say "even X", put 連 (lin4) before X and 都 (dou1) (or 亦) before the verb:
    - 連阿婆都識用手機 (lin4 aa3 po4 dou1 sik1 jung6 sau2 gei1) - Even Grandma can use a smartphone.
    - 佢連早餐都冇食 - He didn't even have breakfast.
    - 我連佢個名都唔知 - I don't even know his name.

    ### What can follow 連
    - The subject: 連老師都唔識 "Even the teacher doesn't know."
    - The object, moved before the verb: 佢連水都唔飲 "She won't even drink water."

    ### 都 is required
    Without 都 the sentence is incomplete. 亦 (jik6) is a more formal alternative.

    ### 連埋: including
    Don't confuse 連…都 with 連埋 "including": 連埋我五個人 "five people including me".
  examples:
    - { es: "長洲連星期一都咁多人。", en: "Cheung Chau is this crowded even on a Monday." }
    - { es: "佢攰到連飯都唔想食。", en: "She's so tired she doesn't even want to eat.", altEn: ["He's so tired he doesn't even want to eat."] }
    - { es: "連小朋友都識答呢條問題。", en: "Even kids can answer this question." }
    - { es: "我連一蚊都冇。", en: "I don't even have a dollar." }
  pitfalls:
    - "Don't forget 都: 連佢都嚟咗, not 連佢嚟咗."
    - "The object goes before the verb in a 連 sentence: 連水都唔飲, not 都唔飲連水."
  related: [g.jat-dou-negative, g.dou-also, g.wh-dou-every]
  drills:
    - { es: "連我都唔知。", en: "Even I don't know." }
    - { es: "佢連多謝都冇講。", en: "He didn't even say thank you.", altEn: ["She didn't even say thank you."] }
    - { es: "連周末都要返工。", en: "I even have to work at weekends." }

- id: g.jat-dou-negative
  level: b2
  title: "一…都唔 / 一…都冇 - not a single one, not at all"
  summary: "一 + measure word + 都 + negative means 'not a single …': 一個人都冇; 一啲都唔 means 'not at all'."
  explanation: |
    ### Not a single …
    **一 + measure word (+ noun) + 都 + 冇 / 唔**
    - 一個人都冇 (jat1 go3 jan4 dou1 mou5) - There's not a single person.
    - 我一蚊都冇 - I don't have a single dollar.
    - 佢一句都冇講 - He didn't say a word.

    ### Not at all: 一啲都唔
    一啲都唔 + adjective / verb (jat1 di1 dou1 m4):
    - 一啲都唔貴 - Not expensive at all.
    - 我一啲都唔攰 - I'm not tired at all.

    ### Also with 連
    連一個人都冇 is the emphatic version with 連.

    ### Positive versions?
    This pattern only works with negatives. "Every single one" uses 個個 or question words + 都 (next note).
  examples:
    - { es: "島上面一架車都冇。", en: "There isn't a single car on the island." }
    - { es: "我一啲都唔驚。", en: "I'm not scared at all." }
    - { es: "佢成日一句說話都冇講。", en: "She didn't say a single word all day.", altEn: ["He didn't say a single word all day."] }
    - { es: "呢度一啲都唔嘈。", en: "It's not noisy here at all." }
  pitfalls:
    - "Use 一 + the right measure word: 一本書都冇, not 一書都冇."
    - "The pattern needs a negative; 一個人都有 is wrong."
  related: [g.lin-dou-even, g.wh-dou-every, g.mou-negation]
  drills:
    - { es: "雪櫃一樣嘢都冇。", en: "There's nothing at all in the fridge." }
    - { es: "我一啲都唔明。", en: "I don't understand at all." }
    - { es: "佢一次都冇遲到過。", en: "He's never been late, not even once.", altEn: ["She's never been late, not even once."] }

- id: g.wh-dou-every
  level: b2
  title: "Question word + 都 - everyone, everything, anywhere"
  summary: "A question word + 都 means 'every / any': 邊個都識 'everyone knows', 乜嘢都食 'eats anything', 點都要去 'have to go anyway'."
  explanation: |
    A question word followed by 都 (dou1) becomes "every-" or "any-":
    | Phrase | Jyutping | Meaning |
    |---|---|---|
    | 邊個都… | bin1 go3 dou1 | everyone, anyone |
    | 乜嘢都… | mat1 je5 dou1 | everything, anything |
    | 邊度都… | bin1 dou6 dou1 | everywhere, anywhere |
    | 幾時都… | gei2 si4 dou1 | any time, always |
    | 點都… | dim2 dou1 | anyway, no matter what |

    - 佢乜嘢都食 (keoi5 mat1 je5 dou1 sik6) - He eats anything.
    - 邊個都唔想去 - Nobody wants to go.
    - 你幾時嚟都得 - Come whenever you like.

    ### Negative: no one, nothing
    With 唔 / 冇 they mean "no one, nothing, nowhere": 我乜嘢都冇買 "I didn't buy anything."

    ### Object before the verb
    The question word + 都 comes **before** the verb, even when it's the object.
  examples:
    - { es: "坪洲邊度都行得到。", en: "You can walk anywhere on Peng Chau." }
    - { es: "佢乜嘢都唔怕。", en: "She's not afraid of anything.", altEn: ["He's not afraid of anything."] }
    - { es: "你揀邊間都得。", en: "Pick whichever one you like." }
    - { es: "我點都要試吓。", en: "I've got to try it no matter what." }
  pitfalls:
    - "Keep the question word before the verb: 我乜嘢都食, not 我食乜嘢都."
    - "Without 都 these are real questions: 邊個識？ 'who knows?' vs 邊個都識 'everyone knows'."
  related: [g.question-words, g.dou-also, g.mou-leon-dou-no-matter]
  drills:
    - { es: "邊個都鍾意佢。", en: "Everyone likes her.", altEn: ["Everyone likes him."] }
    - { es: "我乜嘢都唔想做。", en: "I don't want to do anything." }
    - { es: "你幾時打畀我都得。", en: "You can call me any time." }
    - { es: "佢點都唔肯。", en: "He just won't agree, no matter what.", altEn: ["She just won't agree, no matter what."] }

- id: g.jat-zau-as-soon-as
  level: b2
  title: "一…就… - as soon as"
  summary: "一 + first action, 就 + second action means 'as soon as': 我一落船就去食海鮮。"
  explanation: |
    一 (jat1) goes before the first verb and 就 (zau6) before the second:
    - 我一落船就去食海鮮 (ngo5 jat1 lok6 syun4 zau6 heoi3 sik6 hoi2 sin1) - As soon as I got off the ferry I went for seafood.
    - 佢一見到我就笑 - She smiled the moment she saw me.

    ### Habitual "whenever"
    It also describes something that happens every time: 我一飲咖啡就瞓唔着 "Whenever I drink coffee I can't sleep." 一落雨就塞車 "Every time it rains there are traffic jams."

    ### Two subjects
    If the subjects differ, each goes before its own 一 / 就: 你一到，我就打電話畀佢 "As soon as you arrive, I'll call him."

    ### Word order
    | Part | Position |
    |---|---|
    | 一 | after the first subject, before the first verb |
    | 就 | after the second subject, before the second verb |
  examples:
    - { es: "佢一到屋企就瞓咗。", en: "He fell asleep the moment he got home.", altEn: ["She fell asleep the moment she got home."] }
    - { es: "我一聽到呢首歌就諗起你。", en: "Whenever I hear this song, I think of you." }
    - { es: "你一到碼頭，我就嚟接你。", en: "As soon as you reach the pier, I'll come and pick you up." }
    - { es: "一打風啲船就停航。", en: "Whenever there's a typhoon, the ferries stop running." }
  pitfalls:
    - "Don't put 就 before the second subject: 我就打 is right, 就我打 is wrong."
    - "This 一 is not the number 'one'; it's the 'as soon as' marker and goes right before the verb."
  related: [g.zau-then, g.jyut-jyut-the-more, g.ji-cin-ji-hau]
  drills:
    - { es: "我一起身就飲咖啡。", en: "The first thing I do when I get up is have coffee." }
    - { es: "佢一講完就走咗。", en: "He left as soon as he'd finished speaking.", altEn: ["She left as soon as she'd finished speaking."] }
    - { es: "一放假我就去大嶼山。", en: "As soon as the holidays start I'm going to Lantau." }

- id: g.jyut-jyut-the-more
  level: b2
  title: "越…越… / 越嚟越 - the more …, the more; more and more"
  summary: "越 A 越 B means 'the more A, the more B': 越食越肥; 越嚟越 + adjective means 'more and more': 越嚟越熱."
  explanation: |
    ### The more …, the more …
    越 (jyut6) before each part:
    - 越食越肥 (jyut6 sik6 jyut6 fei4) - The more you eat, the fatter you get.
    - 佢越講越嬲 - The more he talked, the angrier he got.
    - 越快越好 - The sooner the better.

    ### More and more: 越嚟越
    越嚟越 (jyut6 lai4 jyut6) + adjective/verb describes steady change:
    - 天氣越嚟越熱 - The weather's getting hotter and hotter.
    - 佢嘅廣東話越嚟越好 - His Cantonese is getting better and better.

    ### Two subjects
    Each part can have its own subject: 你越催，佢越慢 "The more you rush him, the slower he gets."

    | Pattern | Example |
    |---|---|
    | 越 V 越 adj | 越行越攰 |
    | 越 adj 越 adj | 越平越好 |
    | 越嚟越 adj | 越嚟越貴 |
  examples:
    - { es: "大澳啲遊客越嚟越多。", en: "There are more and more tourists in Tai O." }
    - { es: "呢首歌越聽越好聽。", en: "This song gets better every time you listen." }
    - { es: "越早訂越平。", en: "The earlier you book, the cheaper it is." }
    - { es: "佢越諗越唔開心。", en: "The more she thought about it, the unhappier she became.", altEn: ["The more he thought about it, the unhappier he became."] }
  pitfalls:
    - "Don't add 好 before the adjective: 越嚟越熱, not 越嚟越好熱."
    - "越嚟越 needs 嚟: 越越熱 is wrong."
  related: [g.jat-zau-as-soon-as, g.bin-sing-become, g.bei2-comparison]
  drills:
    - { es: "樓價越嚟越貴。", en: "Property prices are getting higher and higher." }
    - { es: "越多人越好玩。", en: "The more the merrier." }
    - { es: "佢越大越似佢爸爸。", en: "The older he gets, the more he looks like his dad." }

- id: g.zi-jiu-zau-as-long-as
  level: b2
  title: "只要…就… - as long as"
  summary: "只要 + sufficient condition, 就 + result: 只要你肯學，就一定學得識。"
  explanation: |
    只要 (zi2 jiu3) introduces a condition that is **enough** for the result; 就 (zau6) goes before the result verb:
    - 只要你肯學，就一定學得識 (zi2 jiu3 nei5 hang2 hok6, zau6 jat1 ding6 hok6 dak1 sik1) - As long as you're willing to learn, you'll definitely master it.
    - 只要唔落雨，我哋就去 - As long as it doesn't rain, we'll go.

    ### 只要 vs 只有
    | Pattern | Meaning |
    |---|---|
    | 只要…就… | as long as (sufficient condition) |
    | 只有…先… | only if (necessary condition, see B2.10) |

    只要有錢就得 "As long as you've got money, it's fine." vs 只有有錢先得 "Only if you've got money will it work."

    ### Colloquial alternative
    In casual speech, 淨係…就得 is common: 淨係要你簽個名就得 "All you need to do is sign."
  examples:
    - { es: "只要天氣好，就可以睇到日落。", en: "As long as the weather's good, you can see the sunset." }
    - { es: "只要你開心就得。", en: "As long as you're happy, that's what matters." }
    - { es: "只要早啲到，就唔使排隊。", en: "As long as you get there early, you won't have to queue." }
    - { es: "淨係要你簽個名就得。", en: "All you have to do is sign." }
  pitfalls:
    - "就 goes before the verb of the result, after its subject: 只要你嚟，我就開心."
    - "Don't mix up 只要 'as long as' with 只有 'only if'; they express different logic."
  related: [g.zi-jau-sin-only-if, g.jyu-gwo-zau, g.zau-then]
  drills:
    - { es: "只要有你喺度，我就放心。", en: "As long as you're here, I feel at ease." }
    - { es: "只要肯努力，就會成功。", en: "As long as you work hard, you'll succeed." }
    - { es: "只要五分鐘就搞掂。", en: "It only takes five minutes." }

- id: g.mou-leon-dou-no-matter
  level: b2
  title: "無論…都… - no matter"
  summary: "無論 + question or alternatives, 都 + result means 'no matter …': 無論幾多人，佢哋都照搶包山。"
  explanation: |
    無論 (mou4 leon6) "no matter" is followed by a question word, an A-not-A form or alternatives, and the result takes 都:
    - 無論落唔落雨，我哋都會去 (mou4 leon6 lok6 m4 lok6 jyu5, ngo5 dei6 dou1 wui5 heoi3) - Whether it rains or not, we'll go.
    - 無論你去邊度，都要小心 - Wherever you go, be careful.
    - 無論幾貴，佢都要買 - However expensive it is, she'll buy it.

    ### Colloquial alternatives
    | Word | Jyutping | Register |
    |---|---|---|
    | 無論 | mou4 leon6 | neutral |
    | 不管 | bat1 gun2 | neutral, slightly Mandarin-like |
    | 理得佢 | lei5 dak1 keoi5 | casual: never mind |

    Casual speech often drops 無論 and keeps the question word + 都: 你去邊都要帶身份證 "Wherever you go, take your ID."
  examples:
    - { es: "無論幾忙，佢每年都返長洲睇太平清醮。", en: "However busy she is, she goes back to Cheung Chau for the Bun Festival every year.", altEn: ["However busy he is, he goes back to Cheung Chau for the Bun Festival every year."] }
    - { es: "無論你點講，我都唔會改變主意。", en: "Whatever you say, I won't change my mind." }
    - { es: "無論大人定細路，都可以參加。", en: "Adults and children alike can take part." }
    - { es: "無論邊個問，你都話唔知。", en: "Whoever asks, just say you don't know." }
  pitfalls:
    - "無論 needs a question or alternatives after it: 無論落唔落雨, not 無論落雨."
    - "Don't forget 都 in the result: 無論幾貴，我都買."
  related: [g.wh-dou-every, g.zau-syun-even-if]
  drills:
    - { es: "無論幾時，你都可以搵我。", en: "You can find me any time." }
    - { es: "無論成唔成功，都要試吓。", en: "Whether it works or not, we have to try." }
    - { es: "無論去邊，佢都帶住部相機。", en: "Wherever he goes, he takes his camera.", altEn: ["Wherever she goes, she takes her camera."] }

- id: g.ceoi-zo-apart-from
  level: b2
  title: "除咗…之外 - apart from, besides"
  summary: "除咗 X (之外) means 'besides X' with 仲/都 (inclusion) or 'except X' with a negative or 都 + exclusion."
  explanation: |
    除咗 (ceoi4 zo2) … (之外, zi1 ngoi6) has two meanings, decided by the rest of the sentence:

    ### Besides, in addition (+ 仲 / 都)
    - 除咗包山，仲有飄色巡遊 (ceoi4 zo2 baau1 saan1, zung6 jau5 piu1 sik1 ceon4 jau4) - Besides the bun towers, there's also the floating colours parade.
    - 除咗廣東話之外，佢仲識講日文 - Apart from Cantonese, she also speaks Japanese.

    ### Except (+ 都 / 冇 / 唔)
    - 除咗佢之外，個個都去咗 - Everyone went except him.
    - 除咗星期一，日日都開 - Open every day except Monday.

    | Second clause | Meaning of 除咗 |
    |---|---|
    | 仲 / 亦 | in addition |
    | 都 / 個個 / 全部 | except |

    之外 is optional in speech.
  examples:
    - { es: "除咗平安包，長洲仲有好多小食。", en: "Besides peace buns, Cheung Chau has lots of other snacks." }
    - { es: "除咗我，大家都食咗。", en: "Everyone has eaten except me." }
    - { es: "除咗週末之外，平日都好靜。", en: "Apart from weekends, it's quiet on weekdays." }
    - { es: "除咗游水，你仲鍾意做咩運動呀？", en: "Apart from swimming, what other sports do you like?" }
  pitfalls:
    - "Read the second clause: 仲 makes it 'besides', 都 with everyone makes it 'except'."
    - "除咗 goes at the start of the sentence, not at the end like English 'except me'."
  related: [g.bat-daan-not-only, g.zung-still]
  drills:
    - { es: "除咗佢，冇人知。", en: "No one knows except him.", altEn: ["No one knows except her."] }
    - { es: "除咗打工，我仲讀緊書。", en: "Besides working, I'm also studying." }
    - { es: "除咗星期日，我日日都返工。", en: "I work every day except Sunday." }

- id: g.bat-daan-not-only
  level: b2
  title: "不但…而且… / 唔單止…仲… - not only … but also"
  summary: "不但 A，而且 B is the neutral form; 唔單止 A，仲 B is the colloquial one: 佢唔單止識煮，仲煮得好好食。"
  explanation: |
    | Register | First part | Second part |
    |---|---|---|
    | colloquial | 唔單止 (m4 daan1 zi2) | 仲 (zung6) / 都 |
    | neutral / formal | 不但 (bat1 daan6) / 不單 | 而且 (ji4 ce2) / 並且 |

    - 呢間餐廳唔單止平，仲好好食 - This restaurant isn't just cheap, it's delicious too.
    - 太平清醮不但係宗教活動，而且係重要嘅文化遺產 - The Bun Festival is not only a religious event but also an important cultural heritage.

    ### Same subject, position
    With one subject, put it first: 佢唔單止…仲…. With two subjects, 唔單止 goes before the first subject: 唔單止我去，佢都去 "Not only me, he's going too."

    ### Adding 添
    The colloquial version often ends with 添 for extra emphasis: 唔單止請食飯，仲送埋禮物添.
  examples:
    - { es: "長洲唔單止有沙灘，仲有好多古廟。", en: "Cheung Chau doesn't just have beaches, it has lots of old temples too." }
    - { es: "佢不但識講廣東話，而且識寫。", en: "He can not only speak Cantonese but also write it.", altEn: ["She can not only speak Cantonese but also write it."] }
    - { es: "唔單止我，連我老細都去咗。", en: "Not just me, even my boss went." }
    - { es: "搶包山唔單止要力，仲要技巧。", en: "The bun scrambling race takes not just strength but skill." }
  pitfalls:
    - "Don't mix registers: 唔單止…而且 sounds odd; pair 唔單止 with 仲, 不但 with 而且."
    - "仲 goes before the verb in the second clause, after any subject."
  related: [g.ceoi-zo-apart-from, g.adding-points, g.tim-too]
  drills:
    - { es: "佢唔單止靚，仲好聰明。", en: "She's not just pretty, she's smart too." }
    - { es: "呢度不但交通方便，而且環境好。", en: "Not only is transport convenient here, but the environment is nice too." }
    - { es: "唔單止你，我都唔知。", en: "It's not just you, I don't know either." }

- id: g.colloquial-idioms
  level: b2
  title: "Everyday Cantonese idioms (慣用語)"
  summary: "Many colloquial expressions have figurative meanings: 炒魷魚 'fire', 放飛機 'stand someone up', 食白果 'come away with nothing'."
  explanation: |
    | Idiom | Jyutping | Literal | Meaning |
    |---|---|---|---|
    | 炒魷魚 | caau2 jau4 jyu2 | fry squid | fire (someone) |
    | 放飛機 | fong3 fei1 gei1 | fly a plane | stand someone up |
    | 食白果 | sik6 baak6 gwo2 | eat ginkgo nuts | come away empty-handed |
    | 擺烏龍 | baai2 wu1 lung2 | set out a black dragon | make a silly mistake |
    | 食死貓 | sik6 sei2 maau1 | eat a dead cat | take the blame unfairly |
    | 講耶穌 | gong2 je4 sou1 | talk about Jesus | lecture, moralise |
    | 煲電話粥 | bou1 din6 waa2 zuk1 | boil phone congee | have a long phone chat |
    | 搏懵 | bok3 mung2 | bet on confusion | try to get away with it |
    | 執輸 | zap1 syu1 | pick up a loss | lose out |

    ### Using them as verbs
    Most work as ordinary verbs with aspect markers and objects: 佢畀老細炒咗魷魚 "He got fired by the boss", 佢放咗我飛機 "She stood me up" - note the object can go inside the idiom.

    ### Register
    These are informal but not rude; you'll hear them on the radio and in films. In writing, use the plain word (解僱 for "dismiss").
  examples:
    - { es: "佢遲到太多次，畀人炒咗魷魚。", en: "He was late too many times and got fired.", altEn: ["She was late too many times and got fired."] }
    - { es: "佢又放我飛機！", en: "She stood me up again!", altEn: ["He stood me up again!"] }
    - { es: "我哋排咗兩個鐘，結果食白果。", en: "We queued for two hours and came away with nothing." }
    - { es: "唔好意思，我擺咗烏龍。", en: "Sorry, I made a silly mistake." }
  pitfalls:
    - "The object often goes inside the idiom: 放咗我飛機, not 放飛機咗我."
    - "These are spoken expressions; don't use them in formal writing."
  related: [g.three-character-idioms, g.body-idioms, g.chengyu-structure]
  drills:
    - { es: "我哋煲咗成晚電話粥。", en: "We chatted on the phone all night." }
    - { es: "唔好搏懵喎。", en: "Don't try to get away with it." }
    - { es: "做人唔好怕執輸。", en: "Don't be afraid of losing out in life." }

- id: g.three-character-idioms
  level: b2
  title: "Three-character expressions - 冇眼睇, 唔話得, 大頭蝦"
  summary: "Cantonese loves compact three-syllable expressions for reactions and character types: 冇眼睇 'can't bear to watch', 大頭蝦 'scatterbrain'."
  explanation: |
    ### Reactions
    | Expression | Jyutping | Meaning |
    |---|---|---|
    | 冇眼睇 | mou5 ngaan5 tai2 | can't bear to watch, embarrassing |
    | 唔話得 | m4 waa6 dak1 | can't complain, excellent |
    | 有冇搞錯 | jau5 mou5 gaau2 co3 | are you kidding me? (4 syllables) |
    | 冇癮 | mou5 jan5 | no fun, boring |
    | 有排 | jau5 paai4 | ages to go yet |

    ### Character types
    | Expression | Jyutping | Meaning |
    |---|---|---|
    | 大頭蝦 | daai6 tau4 haa1 | scatterbrain |
    | 老友記 | lou5 jau5 gei3 | old pal |
    | 一舊雲 | jat1 gau6 wan4 | clueless (lit. a lump of cloud) |
    | 孤寒鬼 | gu1 hon4 gwai2 | skinflint |

    ### Grammar
    Character nouns work like nouns (佢係個大頭蝦); reactions often stand alone or end a sentence: 呢度啲嘢真係唔話得 "The food here is really excellent."
  examples:
    - { es: "佢又唔記得帶鎖匙，真係大頭蝦。", en: "He forgot his keys again, what a scatterbrain.", altEn: ["She forgot her keys again, what a scatterbrain."] }
    - { es: "呢間民宿真係唔話得。", en: "This guesthouse is really excellent." }
    - { es: "佢哋喺度嗌交，真係冇眼睇。", en: "They're arguing here, it's embarrassing to watch." }
    - { es: "要等多十個字？仲有排呀。", en: "Another fifty minutes? That's ages yet." }
  pitfalls:
    - "唔話得 is praise; don't read it as 'can't say'."
    - "Calling someone 孤寒 or 一舊雲 is teasing between friends; it's rude with strangers."
  related: [g.colloquial-idioms, g.body-idioms]
  drills:
    - { es: "你真係大頭蝦！", en: "You're such a scatterbrain!" }
    - { es: "呢度嘅風景唔話得。", en: "The scenery here is excellent." }
    - { es: "一個人去好冇癮。", en: "Going alone is no fun." }

- id: g.body-idioms
  level: b2
  title: "Body-part expressions for feelings - 頭大, 心淡, 手痕"
  summary: "Cantonese describes emotions with body parts: 頭大 'at a loss', 心淡 'disheartened', 手痕 'itching to touch', 眼紅 'jealous'."
  explanation: |
    | Expression | Jyutping | Literal | Meaning |
    |---|---|---|---|
    | 頭大 | tau4 daai6 | head big | overwhelmed, at a loss |
    | 心淡 | sam1 taam5 | heart bland | disheartened, lost interest |
    | 心郁郁 | sam1 juk1 juk1 | heart moving | tempted |
    | 心急 | sam1 gap1 | heart in a hurry | impatient, anxious |
    | 有心 | jau5 sam1 | have heart | thoughtful (thanks for asking) |
    | 眼紅 | ngaan5 hung4 | red eyes | jealous |
    | 眼瞓 | ngaan5 fan3 | eyes sleep | sleepy |
    | 手痕 | sau2 han4 | itchy hand | itching to touch / buy |
    | 口痕 | hau2 han4 | itchy mouth | can't stop chattering |
    | 面皮厚 | min6 pei4 hau5 | thick face skin | shameless |
    | 腳軟 | goek3 jyun5 | soft legs | weak at the knees |

    ### Grammar
    They behave like adjectives: 好頭大, 有啲心郁郁, 唔好咁心急. Many take degree words and 到: 頭大到唔知點算.

    ### 有心
    有心 is a lovely reply when someone asks after you: 你好返未呀？ - 好返喇，有心 "I'm better now, thanks for asking."
  examples:
    - { es: "咁多嘢做，我好頭大。", en: "With so much to do, I'm totally overwhelmed." }
    - { es: "見到啲減價貨，我又心郁郁。", en: "Seeing the sale items, I'm tempted again." }
    - { es: "等咗咁耐都冇消息，我都心淡喇。", en: "No news after all this time, I've lost heart." }
    - { es: "好返喇，有心有心。", en: "I'm better now, thanks for asking." }
  pitfalls:
    - "眼紅 means 'jealous', not 'tired eyes'."
    - "手痕 is often a gentle warning: 唔好手痕 'don't touch!' - not about a skin problem."
  related: [g.three-character-idioms, g.colloquial-idioms, g.dou-extent]
  drills:
    - { es: "唔好咁心急。", en: "Don't be so impatient." }
    - { es: "我好眼瞓。", en: "I'm really sleepy." }
    - { es: "唔好手痕亂掂。", en: "Don't go touching things." }

- id: g.adding-points
  level: b2
  title: "Structuring an argument - 首先, 其次, 而且, 再加上"
  summary: "Order points with 首先, 其次, 另外, 最後, and add weight with 而且, 再加上, 仲有."
  explanation: |
    ### Ordering points
    | Word | Jyutping | Meaning |
    |---|---|---|
    | 首先 | sau2 sin1 | first of all |
    | 其次 | kei4 ci3 | secondly |
    | 另外 | ling6 ngoi6 | in addition, besides |
    | 最後 | zeoi3 hau6 | finally |

    ### Adding weight
    | Word | Jyutping | Register |
    |---|---|---|
    | 仲有 | zung6 jau5 | colloquial: and also |
    | 而且 | ji4 ce2 | neutral: moreover |
    | 再加上 | zoi3 gaa1 soeng6 | on top of that |
    | 更何況 | gang3 ho4 fong3 | let alone, all the more so |

    - 首先，填海會破壞環境；其次，成本太高；再加上，市民唔支持 - First, reclamation damages the environment; second, the cost is too high; on top of that, the public doesn't support it.

    ### Debate etiquette
    Turn-taking phrases: 我想補充一點 "I'd like to add a point", 我唔係好同意 "I don't quite agree", 請你畀我講完 "please let me finish".
  examples:
    - { es: "首先，我想多謝主席畀我發言。", en: "First of all, I'd like to thank the chair for letting me speak." }
    - { es: "呢個方案貴，而且未必有效。", en: "This proposal is expensive, and it may not even work." }
    - { es: "再加上交通唔方便，好少人會去。", en: "On top of that, transport is inconvenient, so few people will go." }
    - { es: "我想補充一點。", en: "I'd like to add one point." }
  pitfalls:
    - "Don't overuse 跟住 in a debate; 其次 and 另外 sound more structured."
    - "更何況 introduces a stronger point; it doesn't just mean 'and'."
  related: [g.bat-daan-not-only, g.summing-up, g.concessive-ji-sai]
  drills:
    - { es: "首先，我哋要搞清楚問題。", en: "First, we need to be clear about the problem." }
    - { es: "其次，我哋要諗吓成本。", en: "Second, we need to think about the cost." }
    - { es: "另外，仲要考慮居民嘅意見。", en: "In addition, residents' views must be considered." }

- id: g.concessive-ji-sai
  level: b2
  title: "Conceding - 即使, 固然, 就算係噉"
  summary: "Concede a point before countering: 即使…都 'even if', 固然…但係 'admittedly … but', 就算係噉 'even so'."
  explanation: |
    ### Even if: 即使 (zik1 si2)
    The formal counterpart of 就算: 即使政府資助，都未必夠 "Even with government funding, it may not be enough."

    ### Admittedly … but: 固然 (gu3 jin4)
    - 經濟發展固然重要，但係環境都唔可以忽視 - Economic growth is admittedly important, but the environment can't be ignored.

    ### Even so: 就算係噉 / 話雖如此
    - 就算係噉，我都覺得唔值 - Even so, I don't think it's worth it.
    - 話雖如此 (waa6 seoi1 jyu4 ci2) - That said (formal).

    ### Conceding politely
    | Phrase | Meaning |
    |---|---|
    | 你講得啱，不過… | You're right, but … |
    | 我明白你嘅意思，但係… | I see your point, but … |
    | 我唔否認…，但係… | I don't deny …, but … |
  examples:
    - { es: "即使成本高，我哋都應該做。", en: "Even if the cost is high, we should do it." }
    - { es: "方便固然好，但係安全更重要。", en: "Convenience is all very well, but safety matters more." }
    - { es: "我明白你嘅意思，但係我唔同意。", en: "I see your point, but I disagree." }
    - { es: "就算係噉，問題都未解決。", en: "Even so, the problem still isn't solved." }
  pitfalls:
    - "即使 still needs 都 in the second clause, like 就算."
    - "固然 concedes something true; it is not a hypothetical 'if'."
  related: [g.zau-syun-even-if, g.seoi-jin-daan-hai, g.adding-points]
  drills:
    - { es: "即使落雨，比賽都會照常舉行。", en: "Even if it rains, the match will go ahead." }
    - { es: "你講得啱，不過仲有其他因素。", en: "You're right, but there are other factors too." }
    - { es: "話雖如此，我哋都要小心。", en: "That said, we still need to be careful." }

- id: g.summing-up
  level: b2
  title: "Summing up - 總之, 總括嚟講, 講到尾"
  summary: "Close an argument with 總之 'anyway, in short', 總括嚟講 'to sum up', 講到尾 'at the end of the day'."
  explanation: |
    | Phrase | Jyutping | Register | Meaning |
    |---|---|---|---|
    | 總之 | zung2 zi1 | everyday | in short, anyway |
    | 總括嚟講 | zung2 kut3 lai4 gong2 | formal speech | to sum up |
    | 講到尾 | gong2 dou3 mei5 | colloquial | at the end of the day |
    | 所以話 | so2 ji5 waa6 | colloquial | which is why I say |
    | 換句話講 | wun6 geoi3 waa6 gong2 | neutral | in other words |

    - 總之，我哋唔可以再拖 - In short, we can't delay any longer.
    - 講到尾，都係錢嘅問題 - At the end of the day, it's about money.

    ### 總之 to cut a conversation short
    In everyday talk 總之 also means "whatever, the point is": 總之你聽日一定要嚟 "Anyway, the point is you must come tomorrow."
  examples:
    - { es: "總括嚟講，我哋反對呢個計劃。", en: "To sum up, we oppose this plan." }
    - { es: "講到尾，最重要係大家開心。", en: "At the end of the day, what matters most is that everyone's happy." }
    - { es: "所以話，做人唔好太貪心。", en: "Which is why I say, don't be too greedy in life." }
    - { es: "總之你記住帶護照。", en: "Anyway, just remember to bring your passport." }
  pitfalls:
    - "總之 can sound dismissive in a discussion ('whatever'); use 總括嚟講 to sum up formally."
    - "Summing-up phrases start the sentence, followed by a comma pause."
  related: [g.adding-points, g.rhetorical-questions, g.essay-structure]
  drills:
    - { es: "總之，冇問題就得。", en: "In short, as long as there's no problem, it's fine." }
    - { es: "換句話講，我哋要加錢。", en: "In other words, we need to pay more." }
    - { es: "講到尾，都係你自己揀。", en: "At the end of the day, it's your own choice." }

- id: g.rhetorical-questions
  level: b2
  title: "Rhetorical questions - 邊有…？ 點會…？ 唔通…？"
  summary: "Rhetorical questions make strong statements: 邊有咁平？ 'There's no way it's that cheap', 點會㗎？ 'How could that be?'"
  explanation: |
    | Pattern | Jyutping | Real meaning |
    |---|---|---|
    | 邊有…？ | bin1 jau5 | there's no such thing |
    | 點會…？ | dim2 wui5 | it can't be |
    | 唔通…？ | m4 tung1 | surely you don't mean … / could it be … |
    | 難道…？ | naan4 dou6 | surely … (more formal) |
    | 使乜…？ | sai2 mat1 | why bother …? no need |
    | 何必…？ | ho4 bit1 | why must …? (formal) |

    - 邊有咁平㗎？ (bin1 jau5 gam3 peng4 gaa3) - There's no way it's that cheap.
    - 點會唔記得㗎？ - How could I possibly forget?
    - 唔通你唔知？ - Don't tell me you didn't know.
    - 使乜咁客氣？ - No need to be so polite!

    ### In debate
    Rhetorical questions add punch: 如果連居民都反對，點解仲要起？ "If even the residents object, why build it?"
  examples:
    - { es: "邊有人咁早起身㗎？", en: "Who on earth gets up that early?" }
    - { es: "點會冇人知㗎？", en: "How could nobody know?" }
    - { es: "唔通你想一個人去？", en: "Surely you don't want to go alone?" }
    - { es: "使乜買咁多，食唔晒㗎。", en: "Why buy so much? We can't eat it all." }
  pitfalls:
    - "Don't answer a rhetorical question literally: 邊有咁平？ means 'it's not that cheap', not a request for directions."
    - "唔通 doesn't mean 'not through'; it introduces a doubtful suggestion."
  related: [g.me1-surprise, g.summing-up, g.gaa3-explaining]
  drills:
    - { es: "邊有咁簡單！", en: "It's not that simple!" }
    - { es: "使乜咁緊張？", en: "Why so nervous?" }
    - { es: "唔通佢唔嚟？", en: "Surely he isn't not coming?", altEn: ["Could it be she's not coming?"] }

- id: g.causatives-ling-gaau-dou
  level: b2
  title: "令, 搞到, 害到 - making something happen"
  summary: "令 + person + verb/adj 'make (someone feel)' is neutral or formal; 搞到 and 害到 are colloquial and usually negative."
  explanation: |
    ### 令 (ling6): make, cause
    - 呢個消息令我好開心 (ni1 go3 siu1 sik1 ling6 ngo5 hou2 hoi1 sam1) - This news makes me very happy.
    - 塑膠垃圾令海洋污染越嚟越嚴重 - Plastic waste makes ocean pollution worse and worse.
    - 令人 + adj: 令人感動 "moving", 令人擔心 "worrying".

    ### 搞到 (gaau2 dou3): result in (usually bad, colloquial)
    - 佢遲到搞到我哋冇得食 - He was late, so we didn't get to eat.
    - 冷氣太凍，搞到我感冒 - The air con was so cold I caught a cold.

    ### 害到 (hoi6 dou3): it's someone's fault
    - 你害到我遲到 - You made me late (it's your fault).

    ### 整到 / 弄到
    整到 (zing2 dou3) "managed to (mess up)": 佢整到部機壞咗 "He broke the machine."

    | Word | Register | Feel |
    |---|---|---|
    | 令 | neutral/formal | any result |
    | 搞到 | colloquial | usually bad |
    | 害到 | colloquial | blaming |
  examples:
    - { es: "南丫島嘅風景令人好放鬆。", en: "The scenery on Lamma is very relaxing." }
    - { es: "啲遊客亂拋垃圾，搞到個沙灘好污糟。", en: "Tourists litter and make the beach filthy." }
    - { es: "你冇提我，害到我錯過咗班船。", en: "You didn't remind me, and because of you I missed the ferry." }
    - { es: "呢件事令我好失望。", en: "This really disappointed me." }
  pitfalls:
    - "令 is followed directly by the person: 令我開心, not 令到我開心 in writing (令到 is colloquial)."
    - "搞到 has a negative flavour; for good results use 令 or 所以."
  related: [g.jau-jyu-because, g.dou-extent, g.jan-wai-so-ji]
  drills:
    - { es: "呢首歌令我諗起細個。", en: "This song reminds me of my childhood." }
    - { es: "塞車搞到我遲咗一個鐘。", en: "The traffic made me an hour late." }
    - { es: "令人好難忘。", en: "It's unforgettable." }

- id: g.jau-jyu-because
  level: b2
  title: "由於, 因此, 導致 - formal cause and effect"
  summary: "由於 'owing to', 因此 'therefore' and 導致 'lead to' are the formal relatives of 因為 and 所以."
  explanation: |
    | Formal | Jyutping | Everyday equivalent |
    |---|---|---|
    | 由於 | jau4 jyu1 | 因為 |
    | 因此 | jan1 ci2 | 所以 |
    | 導致 | dou6 zi3 | 搞到 / 令 |
    | 結果 | git3 gwo2 | 結果 |

    - 由於天氣惡劣，渡輪服務暫停 (jau4 jyu1 tin1 hei3 ok3 lyut6, dou6 leon4 fuk6 mou6 zaam6 ting4) - Owing to bad weather, ferry services are suspended.
    - 過度捕魚導致魚獲減少 - Overfishing has led to smaller catches.

    ### Where you'll hear them
    News, announcements, presentations and discussions about society. In casual chat they sound stiff, so mix: 由於…，所以… is acceptable in speech.

    ### Position
    由於 starts the reason clause; 因此 starts the result clause; 導致 links cause (subject) and effect (object) like a verb.
  examples:
    - { es: "由於人手不足，部分服務暫停。", en: "Owing to staff shortages, some services are suspended." }
    - { es: "島上冇汽車，因此空氣特別清新。", en: "There are no cars on the island, so the air is especially fresh." }
    - { es: "垃圾問題導致海洋生物死亡。", en: "The rubbish problem leads to the death of marine life." }
    - { es: "由於落大雨，所以活動延期。", en: "Because of the heavy rain, the event has been postponed." }
  pitfalls:
    - "導致 is a verb and usually describes negative outcomes; don't use it for good results."
    - "Using 由於 in casual chat sounds like reading the news; prefer 因為 with friends."
  related: [g.jan-wai-so-ji, g.causatives-ling-gaau-dou, g.news-register]
  drills:
    - { es: "由於颱風，航班取消。", en: "Owing to the typhoon, flights are cancelled." }
    - { es: "因此，我哋要減少用膠袋。", en: "Therefore we need to use fewer plastic bags." }
    - { es: "污染導致好多問題。", en: "Pollution leads to many problems." }

- id: g.ji-min-so-as-not
  level: b2
  title: "以免, 免得, 費事 - so as not to"
  summary: "以免 (formal) and 免得 'so as to avoid', and colloquial 費事 'so I don't have to / can't be bothered'."
  explanation: |
    These introduce something you want to **avoid**; they come in the second clause:
    | Word | Jyutping | Register |
    |---|---|---|
    | 以免 | ji5 min5 | formal, notices |
    | 免得 | min5 dak1 | neutral |
    | 費事 | fai3 si6 | colloquial |

    - 請帶走垃圾，以免污染環境 - Please take your rubbish with you to avoid polluting the environment.
    - 早啲出門口，免得趕唔切 (zou2 di1 ceot1 mun4 hau2, min5 dak1 gon2 m4 cit3) - Leave early so you don't end up rushing.
    - 我帶埋遮，費事落雨 - I'll take an umbrella in case it rains.

    ### 費事 alone: can't be bothered
    費事 + verb at the start of a sentence means "I can't be bothered to": 費事同佢嗌 "I can't be bothered arguing with him."
  examples:
    - { es: "行山記得帶夠水，以免脫水。", en: "Take enough water when hiking to avoid dehydration." }
    - { es: "講清楚啲，免得佢誤會。", en: "Make it clearer so he doesn't misunderstand.", altEn: ["Make it clearer so she doesn't misunderstand."] }
    - { es: "我自己煮，費事出去排隊。", en: "I'll cook myself so I don't have to queue outside." }
    - { es: "費事理佢。", en: "I can't be bothered with him.", altEn: ["I can't be bothered with her."] }
  pitfalls:
    - "以免 and 免得 introduce what you DON'T want; don't add another negative: 以免遲到, not 以免唔遲到."
    - "費事 also means 'can't be bothered'; context tells you which."
  related: [g.wai-zo-purpose, g.notice-language]
  drills:
    - { es: "請保持安靜，以免影響其他人。", en: "Please keep quiet so as not to disturb others." }
    - { es: "訂定位先，免得冇位。", en: "Book a table first so we don't miss out." }
    - { es: "費事等，我哋行路啦。", en: "Let's walk rather than wait." }

- id: g.hou-ci-seem
  level: b2
  title: "好似, 似乎, 睇落 - seem, look like, as if"
  summary: "好似 'seem / be like / as if' is the everyday word; 似乎 is more formal; 睇落 means 'looks (like)'."
  explanation: |
    ### 好似 (hou2 ci5)
    - Seems: 佢好似唔開心 - He seems unhappy.
    - Is like: 大佛好似一座山咁大 - The Big Buddha is as big as a mountain.
    - As if: 佢好似識我噉 - She acts as if she knows me.

    ### 好似…噉 (gam2)
    噉 (often written 咁) at the end of the comparison: 好似做夢噉 "like a dream".

    ### 似乎 (ci5 fu4)
    Formal "it seems": 情況似乎有改善 "The situation seems to have improved."

    ### 睇落 / 聽落 / 食落
    Sense verbs + 落 mean "seem when you look/listen/taste": 睇落好新 "looks new", 聽落幾好 "sounds good", 食落有啲甜 "tastes a bit sweet".

    ### 似 (ci5) on its own
    "Resemble": 佢好似佢媽媽 "She looks like her mum."
  examples:
    - { es: "天好似就嚟落雨。", en: "It looks like it's about to rain." }
    - { es: "嗰度好似有個寺廟。", en: "There seems to be a monastery over there." }
    - { es: "呢個計劃聽落幾好。", en: "This plan sounds quite good." }
    - { es: "佢講得好似好容易噉。", en: "He makes it sound so easy.", altEn: ["She makes it sound so easy."] }
  pitfalls:
    - "好似 here is one word 'seem', not 好 'very' + 似: 佢好似攰 'he seems tired'."
    - "Don't overuse 似乎 in conversation; it sounds formal."
  related: [g.probability, g.hedging, g.bin-sing-become]
  drills:
    - { es: "佢好似唔記得咗。", en: "He seems to have forgotten.", altEn: ["She seems to have forgotten."] }
    - { es: "睇落好好食。", en: "It looks delicious." }
    - { es: "好似發夢噉。", en: "It's like a dream." }

- id: g.zi-jau-sin-only-if
  level: b2
  title: "只有…先… - only if, only then"
  summary: "只有 + necessary condition, 先 + result: 只有坐纜車先睇到呢個景 'only by cable car can you see this view'."
  explanation: |
    只有 (zi2 jau5) states the **only** way something can happen; the result takes 先 (sin1) or 先至 (sin1 zi3) before the verb:
    - 只有坐纜車先睇到呢個景 (zi2 jau5 co5 laam6 ce1 sin1 tai2 dou2 ni1 go3 ging2) - Only by cable car can you see this view.
    - 只有佢先知密碼 - Only he knows the password.

    ### Colloquial: 要…先
    要 + condition + 先 + result: 要預約先入得 "You can only get in with a booking."

    ### 只要 vs 只有
    | Pattern | Logic | Example |
    |---|---|---|
    | 只要…就… | sufficient | 只要有票就入得 any ticket is enough |
    | 只有…先… | necessary | 只有有票先入得 you must have a ticket |

    ### 先 here means "only then"
    It's the same 先 as in 佢十點先到 "He didn't arrive until ten."
  examples:
    - { es: "只有行上山先見到大佛嘅全景。", en: "Only by walking up can you see the whole Big Buddha." }
    - { es: "要預約先可以參觀。", en: "Visits are by appointment only." }
    - { es: "只有努力先會有收穫。", en: "Only hard work brings results." }
    - { es: "只有你先明我。", en: "Only you understand me." }
  pitfalls:
    - "Use 先, not 就, in the result: 只有…先…, not 只有…就…."
    - "先 goes before the verb (after any subject): 只有佢先知, not 只有佢知先."
  related: [g.zi-jiu-zau-as-long-as, g.sin-final]
  drills:
    - { es: "只有星期六先有船。", en: "There are only ferries on Saturdays." }
    - { es: "要排隊先買到。", en: "You can only buy it if you queue." }
    - { es: "只有親身去先感受到。", en: "You can only feel it if you go in person." }

- id: g.bin-sing-become
  level: b2
  title: "變成, 變得, 變咗 - become, turn into"
  summary: "變成 + noun 'turn into', 變得 + adjective 'become (more) …', 變咗 'has changed'."
  explanation: |
    | Pattern | Jyutping | Use | Example |
    |---|---|---|---|
    | 變成 + noun | bin3 sing4 | turn into | 漁村變成旅遊區 |
    | 變得 + adj | bin3 dak1 | become (adjective) | 變得好熱鬧 |
    | 變咗 | bin3 zo2 | has changed | 呢度變咗好多 |
    | 越嚟越 + adj | jyut6 lai4 jyut6 | more and more | 越嚟越熱鬧 |

    - 大澳由漁村變成咗旅遊區 - Tai O has turned from a fishing village into a tourist spot.
    - 佢退休之後變得好開朗 - She's become very cheerful since retiring.
    - 香港變咗好多 - Hong Kong has changed a lot.

    ### Colloquial: adjective + 咗
    Everyday speech often just adds 咗 to the adjective: 佢肥咗 "He's put on weight", 靚咗 "got prettier", 貴咗 "got more expensive".
  examples:
    - { es: "條村而家變成咗度假村。", en: "The village has now become a resort." }
    - { es: "嚟咗大嶼山之後，佢變得好放鬆。", en: "Since coming to Lantau, she's become very relaxed.", altEn: ["Since coming to Lantau, he's become very relaxed."] }
    - { es: "呢度同十年前比，變咗好多。", en: "This place has changed a lot compared to ten years ago." }
    - { es: "啲嘢貴咗好多。", en: "Things have got a lot more expensive." }
  pitfalls:
    - "Use 變成 with nouns, 變得 with adjectives: 變得好靜, not 變成好靜."
    - "For simple changes, adjective + 咗 is more natural than 變得: 佢瘦咗 'he's lost weight'."
  related: [g.jyut-jyut-the-more, g.laa3-change, g.hou-ci-seem]
  drills:
    - { es: "個天變黑咗。", en: "The sky has gone dark." }
    - { es: "佢變成咗一個好出名嘅歌手。", en: "She has become a famous singer.", altEn: ["He has become a famous singer."] }
    - { es: "我嘅廣東話好咗好多。", en: "My Cantonese has improved a lot." }

- id: g.dou-extent
  level: b2
  title: "Adjective/verb + 到 + result - so … that"
  summary: "到 after an adjective or verb introduces the extreme result: 攰到唔想郁 'so tired I don't want to move', 笑到肚痛."
  explanation: |
    **Adjective / verb + 到 (dou3) + resulting state** expresses "so … that …":
    - 我攰到唔想郁 (ngo5 gui6 dou3 m4 soeng2 juk1) - I'm so tired I don't want to move.
    - 佢笑到肚痛 - She laughed so much her stomach hurt.
    - 凍到震 - so cold I'm shaking.

    ### Exaggeration
    Cantonese loves vivid extent phrases:
    | Phrase | Meaning |
    |---|---|
    | 開心到飛起 | over the moon (lit. happy enough to fly) |
    | 嬲到爆 | furious |
    | 平到冇朋友 | ridiculously cheap (slang) |
    | 靚到暈 | stunningly beautiful |

    ### 到 vs 得
    | Pattern | Use |
    |---|---|
    | V得 + adj | how something is done: 跑得好快 |
    | adj/V到 + result | to what extent: 跑到喘晒氣 |
  examples:
    - { es: "坪洲靜到聽到啲雀仔叫。", en: "Peng Chau is so quiet you can hear the birds." }
    - { es: "我餓到肚都扁埋。", en: "I'm so hungry I could eat a horse." }
    - { es: "佢開心到喊。", en: "She was so happy she cried.", altEn: ["He was so happy he cried."] }
    - { es: "呢度啲海鮮平到冇朋友。", en: "The seafood here is ridiculously cheap." }
  pitfalls:
    - "到 is followed by a result, not a degree word: 攰到瞓着 'so tired I fell asleep', not 攰到好."
    - "Don't confuse extent 到 (dou3) with 得 (dak1), which describes manner."
  related: [g.dak-descriptive, g.body-idioms, g.causatives-ling-gaau-dou]
  drills:
    - { es: "佢嬲到面都紅埋。", en: "He was so angry his face went red.", altEn: ["She was so angry her face went red."] }
    - { es: "我笑到喊。", en: "I laughed till I cried." }
    - { es: "熱到瞓唔着。", en: "It's so hot I can't sleep." }

- id: g.gam3-vs-gam2
  level: b2
  title: "咁 (gam3) vs 噉 (gam2) - so, like this, then"
  summary: "咁 (gam3) means 'so (much)' before adjectives; 噉 (gam2) means 'like this / in that way' and 'well then'."
  explanation: |
    These two words sound almost alike but differ in tone and use. Many people write both as 咁, but careful writers distinguish them.

    ### 咁 (gam3): so, such
    Before adjectives and some verbs: degree.
    - 咁貴 (gam3 gwai3) - so expensive
    - 唔好咁大聲 - don't be so loud
    - 冇佢咁高 - not as tall as him

    ### 噉 (gam2): like this, that way; so then
    - Manner: 噉做 (gam2 zou6) "do it like this", 係噉 "that's how it is".
    - Conclusion: 噉我哋走啦 "Well then, let's go."
    - After adverbs: 慢慢噉行 "walk slowly", 好似…噉 "just like".

    | Word | Tone | Meaning | Example |
    |---|---|---|---|
    | 咁 | gam3 | so (degree) | 咁靚 |
    | 噉 | gam2 | like this; then | 噉樣, 噉都得 |

    ### 咁樣 / 噉樣
    "Like this, this way": 噉樣 (gam2 joeng2) is the standard spelling.
  examples:
    - { es: "坪洲點解咁靜㗎？", en: "Why is Peng Chau so quiet?" }
    - { es: "噉我哋聽日先去啦。", en: "Well then, let's go tomorrow instead." }
    - { es: "你唔好噉講啦。", en: "Please don't talk like that." }
    - { es: "我冇諗過會咁好玩。", en: "I never thought it would be so much fun." }
  pitfalls:
    - "Before an adjective, 'so' is 咁 (gam3); 'like this' is 噉 (gam2). Mixing the tones sounds odd: 咁靚 gam3 leng3, not gam2."
    - "噉 at the start of a sentence means 'well then', not 'so much'."
  related: [g.mou-gam-not-as, g.hou-ci-seem, g.jau-gei-how]
  drills:
    - { es: "你點解咁遲呀？", en: "Why are you so late?" }
    - { es: "原來係噉。", en: "Oh, so that's how it is." }
    - { es: "噉樣做好啲。", en: "It's better to do it this way." }
    - { es: "唔使咁客氣。", en: "No need to be so polite." }

- id: g.jau-gei-how
  level: b2
  title: "有幾…呀！ / 冇幾… - how …!, not very"
  summary: "有幾 + adjective asks 'how …?' or exclaims 'how …!'; 冇幾 + adjective means 'not very'."
  explanation: |
    ### How …? (question)
    有幾 (jau5 gei2) + adjective asks about degree:
    - 有幾遠呀？ (jau5 gei2 jyun5 aa3) - How far is it?
    - 個海灘有幾大？ - How big is the beach?

    ### How …! (exclamation)
    With emphasis, the same pattern exclaims: 你知唔知呢度有幾靚呀！ "You have no idea how beautiful it is here!"

    ### Not very: 冇幾
    冇幾 (mou5 gei2) + adjective = not very: 冇幾遠 "not very far", 冇幾多人 "not many people".

    ### Rhetorical: 有幾…啫？
    "How … can it be?" (= not very): 有幾難啫？ "How hard can it be?"

    | Phrase | Meaning |
    |---|---|
    | 有幾貴呀？ | How expensive is it? |
    | 冇幾貴 | Not very expensive. |
    | 有幾貴啫？ | It can't be that expensive. |
  examples:
    - { es: "由碼頭行過去有幾遠呀？", en: "How far is it to walk from the pier?" }
    - { es: "冇幾遠，十分鐘就到。", en: "Not very far, ten minutes." }
    - { es: "你唔會明我有幾掛住你。", en: "You won't understand how much I miss you." }
    - { es: "有幾難啫？試吓先講。", en: "How hard can it be? Try it first." }
  pitfalls:
    - "有幾 is 'how (much)'; 幾 alone before an adjective is 'quite': 幾遠 'quite far' vs 有幾遠？ 'how far?'"
    - "冇幾 is softer than 唔: 冇幾好 'not that good', 唔好 'bad'."
  related: [g.degree-adverbs, g.gei-how-many, g.gam3-vs-gam2]
  drills:
    - { es: "有幾多人嚟呀？", en: "How many people are coming?" }
    - { es: "今日冇幾熱。", en: "It's not very hot today." }
    - { es: "有幾貴啫！", en: "It can't be that expensive!" }

- id: g.code-mixing
  level: b2
  title: "Code-mixing - English inside Cantonese"
  summary: "Hong Kongers drop English words into Cantonese grammar: 我聽日要 present, 你 check 吓 email 啦, 好 busy."
  explanation: |
    Mixing English words into Cantonese sentences (中英夾雜) is normal in Hong Kong, especially at work and among young people. The **grammar stays Cantonese**:
    - 我聽日要 present - I have to present tomorrow.
    - 你 check 吓個 email 啦 - Have a look at the email.
    - 佢今日好 busy - She's really busy today.
    - 我哋 sell 咗個 idea 畀客 - We sold the idea to the client.

    ### How English words behave
    | English word | Behaves like | Example |
    |---|---|---|
    | verbs (check, print, cancel) | Cantonese verbs, with 咗 / 緊 / 吓 | cancel 咗 |
    | adjectives (busy, nice, chill) | Cantonese adjectives, with 好 / 好唔… | 好 nice |
    | nouns (meeting, file) | nouns with measure words | 個 meeting |

    ### Established loanwords
    Older loans are written in characters: 巴士 (baa1 si2) bus, 的士 (dik1 si2) taxi, 士多 (si6 do1) store, 朱古力 (zyu1 gu1 lik1) chocolate, 三文治 (saam1 man4 zi6) sandwich, 貼士 (tip1 si2) tip.

    ### When not to mix
    Formal speeches, news and talking with older people who don't speak English.
  examples:
    - { es: "我而家有個 meeting，遲啲覆你。", en: "I'm in a meeting now, I'll get back to you later." }
    - { es: "呢間 café 好 chill。", en: "This café is really chill." }
    - { es: "你 print 咗份 file 未呀？", en: "Have you printed the file yet?" }
    - { es: "我要杯朱古力，同埋一份三文治。", en: "I'd like a hot chocolate and a sandwich." }
  pitfalls:
    - "Keep Cantonese grammar: 我 check 咗, not 我 checked."
    - "English nouns still need measure words: 一個 meeting, 份 report."
  related: [g.slang-word-formation, g.spoken-vs-written]
  drills:
    - { es: "我哋 book 咗枱。", en: "We've booked a table." }
    - { es: "我同佢好 friend。", en: "He and I are really close.", altEn: ["She and I are really close."] }
    - { es: "唔該 send 份 report 畀我。", en: "Please send me the report." }

- id: g.abb-adjectives
  level: b2
  title: "Vivid ABB adjectives - 紅卜卜, 香噴噴, 凍冰冰"
  summary: "An adjective + a doubled sound syllable paints a vivid picture: 紅卜卜 'rosy red', 熱辣辣 'piping hot', 靜英英 'dead quiet'."
  explanation: |
    Cantonese adds a reduplicated syllable to an adjective to make it **vivid and expressive**:
    | ABB | Jyutping | Meaning |
    |---|---|---|
    | 紅卜卜 | hung4 bok1 bok1 | rosy red |
    | 白雪雪 | baak6 syut1 syut1 | snow white |
    | 香噴噴 | hoeng1 pan3 pan3 | fragrant, delicious-smelling |
    | 熱辣辣 | jit6 laat6 laat6 | piping hot |
    | 凍冰冰 | dung3 bing1 bing1 | ice cold |
    | 肥嘟嘟 | fei4 dyut1 dyut1 | chubby |
    | 靜英英 | zing6 jing1 jing1 | dead quiet |
    | 滑捋捋 | waat6 lyut1 lyut1 | silky smooth |

    ### Grammar
    ABB adjectives are already intense, so they **don't take 好** or 非常. They usually end with 嘅 or 噉:
    - 個菠蘿包熱辣辣嘅 - The pineapple bun is piping hot.
    - 塊面紅卜卜噉 - (her) cheeks rosy red.

    They're used a lot in food descriptions, children's speech and advertising.
  examples:
    - { es: "啱啱出爐嘅蛋撻熱辣辣。", en: "The freshly baked egg tarts are piping hot." }
    - { es: "個 BB 肥嘟嘟，好得意。", en: "The baby is so chubby and cute." }
    - { es: "夜晚條街靜英英。", en: "At night the street is dead quiet." }
    - { es: "碗糖水凍冰冰，好正。", en: "The dessert soup is ice cold, perfect." }
  pitfalls:
    - "Don't add 好 to ABB adjectives: 熱辣辣, not 好熱辣辣."
    - "Each adjective has its own BB syllable; you can't swap them freely (not 紅辣辣)."
  related: [g.adj-reduplication, g.degree-adverbs]
  drills:
    - { es: "啲飯香噴噴。", en: "The rice smells wonderful." }
    - { es: "佢塊面紅卜卜噉。", en: "Her cheeks are rosy red." }
    - { es: "杯啤酒凍冰冰。", en: "The beer is ice cold." }

- id: g.adj-reduplication
  level: b2
  title: "Doubling - 慢慢, 細細個, 開開心心, 凍凍地"
  summary: "Doubling adjectives makes them vivid or gentle: 慢慢行 'walk slowly', 開開心心 'happily'; AA地 means 'fairly, somewhat'."
  explanation: |
    ### AA: gentle manner
    One-syllable adjectives doubled describe **how** something is done, often with a tone change on the second syllable:
    - 慢慢行 (maan6 maan2 haang4) - take your time (lit. walk slowly)
    - 好好休息 (hou2 hou2 jau1 sik1) - rest well
    - 靜靜雞 (zing6 zing2 gai1) - quietly, on the sly

    ### AABB: vivid and complete
    Two-syllable adjectives double each syllable:
    - 開開心心 (hoi1 hoi1 sam1 sam1) - happily
    - 乾乾淨淨 - spotlessly clean
    - 齊齊整整 - neat and tidy

    ### AA地: somewhat
    Adjective doubled + 地 (dei2) softens it to "fairly, a bit":
    - 凍凍地 (dung3 dung3 dei2) - a bit chilly
    - 紅紅地 - reddish

    ### 細細個: since childhood
    細細個 (sai3 sai3 go3) "when (I was) little": 我細細個就識游水 "I could swim from a young age."
  examples:
    - { es: "慢慢食，唔使急。", en: "Eat slowly, no rush." }
    - { es: "祝你哋開開心心過新年。", en: "Wishing you a happy New Year." }
    - { es: "今日凍凍地，記得著多件衫。", en: "It's a bit chilly today, remember an extra layer." }
    - { es: "我細細個已經鍾意聽廣東歌。", en: "I've liked Cantopop since I was little." }
  pitfalls:
    - "AA地 softens ('a bit'), while AABB intensifies; don't use 開開心心 to mean 'a bit happy'."
    - "Don't add 好 to AABB forms: 乾乾淨淨, not 好乾乾淨淨."
  related: [g.abb-adjectives, g.haa-briefly, g.degree-adverbs]
  drills:
    - { es: "慢慢行，小心啲。", en: "Take care, go carefully." }
    - { es: "間屋執得乾乾淨淨。", en: "The flat has been tidied spotless." }
    - { es: "杯茶暖暖地，啱啱好。", en: "The tea is warm, just right." }
