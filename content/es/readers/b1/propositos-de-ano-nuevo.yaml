id: r.b1.propositos-de-ano-nuevo
level: b1
title: Mis propósitos para el año nuevo
kind: text
intro: Elena, a 34-year-old from Valladolid, writes her New Year's resolutions on her personal blog.
allow: [elena, valladolid, irlanda, blog, inseguridad, apuntado, recupere, operación, demás, comentarios]
paragraphs:
  - { es: "Cada año, la noche del treinta y uno de diciembre, escribo en este blog mis propósitos para el año nuevo. Y cada año, en febrero, ya he olvidado la mitad. Pero esta vez quiero que sea diferente, así que escribo la lista con más cuidado y, sobre todo, con más ilusión.", en: "Every year, on the night of the thirty-first of December, I write my New Year's resolutions on this blog. And every year, by February, I've already forgotten half of them. But this time I want it to be different, so I'm writing the list more carefully and, above all, with more excitement." }
  - { es: "Mi primer deseo es profesional. Llevo seis años en la misma empresa con contratos de un año, y estoy harta de la inseguridad. Espero que este año me ofrezcan por fin un puesto fijo. Si no es así, quiero buscar otra cosa: he preparado un currículum nuevo y ya he enviado dos solicitudes.", en: "My first wish is professional. I've been at the same company for six years on one-year contracts, and I'm fed up with the insecurity. I hope this year they finally offer me a permanent position. If not, I want to look for something else: I've prepared a new CV and I've already sent two applications." }
  - { es: "El segundo propósito tiene que ver con la salud. Hace falta que duerma más y que haga más deporte; el año pasado pasé demasiadas horas delante del ordenador. Me he apuntado al gimnasio del barrio y he pedido a mi hermana que venga conmigo dos veces por semana. Ojalá no me rinda en marzo, como siempre.", en: "The second resolution has to do with health. I need to sleep more and do more sport; last year I spent too many hours in front of the computer. I've signed up at the neighbourhood gym and I've asked my sister to come with me twice a week. I hope I don't give up in March, like always." }
  - { es: "El tercero es el más difícil: independizarme. Con los alquileres de ahora, es casi imposible vivir sola con mi sueldo. Por eso quiero ahorrar un poco cada mes. Mis padres prefieren que me quede en casa hasta que tenga un contrato fijo, y es lógico que lo piensen, pero yo necesito mi espacio.", en: "The third is the hardest: moving out. With today's rents, it's almost impossible to live alone on my salary. That's why I want to save a little every month. My parents would rather I stayed at home until I have a permanent contract, and it's understandable that they think so, but I need my own space." }
  - { es: "También tengo deseos para los demás. Quiero que mi abuela se recupere de la operación de la rodilla y que vuelva a pasear por el parque. Deseo que mi mejor amiga, que vive en Irlanda desde hace tres años, encuentre un trabajo cerca de casa. Y espero que mi hermano pequeño apruebe las oposiciones; lleva dos años estudiando ocho horas al día.", en: "I also have wishes for other people. I want my grandmother to recover from her knee operation and to walk in the park again. I want my best friend, who has lived in Ireland for three years, to find a job close to home. And I hope my little brother passes his civil-service exams; he's been studying eight hours a day for two years." }
  - { es: "Por último, un propósito pequeño pero importante: leer un libro al mes y pasar menos tiempo en las redes sociales. Sé que quizás no cumpla todos los deseos de esta lista. Pero, como dice mi abuela, lo importante no es cumplirlos todos, sino intentarlo con ilusión.", en: "Finally, a small but important resolution: to read one book a month and spend less time on social media. I know I might not fulfil every wish on this list. But, as my grandmother says, the important thing isn't to fulfil them all, but to try with enthusiasm." }
  - { es: "Y vosotros, ¿qué propósitos tenéis? Dejad vuestros deseos en los comentarios. Que el año nuevo os traiga salud, trabajo y mucha suerte. ¡Feliz año a todos!", en: "And you, what resolutions do you have? Leave your wishes in the comments. May the new year bring you health, work and lots of luck. Happy New Year to everyone!" }
questions:
  - { q: "What does Elena hope for at work?", options: ["A permanent position", "A promotion abroad", "To open her own business"], answer: 0 }
  - { q: "Why do her parents prefer that she stays at home?", options: ["Because she is ill", "Until she has a permanent contract", "Because rents are cheap"], answer: 1 }
  - { q: "What is her younger brother doing?", options: ["Working in Ireland", "Studying for civil-service exams", "Going to the gym with her"], answer: 1 }
  - { q: "According to her grandmother, what is the important thing?", options: ["To fulfil every resolution", "To write the list early", "To try with enthusiasm"], answer: 2 }
glossary:
  - { es: sobre todo, en: above all }
  - { es: inseguridad, en: insecurity }
  - { es: tener que ver con, en: to have to do with }
  - { es: apuntarse, en: to sign up }
  - { es: recuperarse, en: to recover }
  - { es: operación, en: operation }
  - { es: los demás, en: other people }
  - { es: por último, en: finally }
  - { es: comentario, en: comment }
