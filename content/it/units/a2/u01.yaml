id: a2.u01
title: "Ieri a Firenze"
lessons:
  - id: a2.u01.l1
    title: Ieri ho visitato il Duomo
    teach: [g.passato-prossimo-avere]
    vocab: [w.ieri, w.duomo, w.cupola, w.campanile, w.gradino, w.cima, w.vista, w.fotografare, w.telefonare, w.incontrare, w.regalare, w.mandare, w.noleggiare, w.controllare, w.sbagliare, w.dimenticare, w.ricordare, w.salutare, w.accompagnare, w.fiorentino, w.toscano]
    tip: "avere + past participle: -are → -ato, -ere → -uto, -ire → -ito. With avere the participle stays in -o: Giulia ha mangiato."
    sentences:
      - { es: "Ieri ho visitato il Duomo di Firenze.", en: "Yesterday I visited Florence Cathedral.", altEs: ["Ho visitato il Duomo di Firenze ieri.", "Ieri io ho visitato il Duomo di Firenze."], altEn: ["I visited Florence Cathedral yesterday.", "Yesterday I visited the Duomo in Florence."], grammar: [g.passato-prossimo-avere], vocab: [w.ieri, w.duomo, w.visitare] }
      - { es: "Abbiamo fotografato la cupola di Brunelleschi.", en: "We photographed Brunelleschi's dome.", altEs: ["Noi abbiamo fotografato la cupola di Brunelleschi."], altEn: ["We took photos of Brunelleschi's dome."], grammar: [g.passato-prossimo-avere], vocab: [w.fotografare, w.cupola], transform: { instruction: "Change to 'I'", answer: "Ho fotografato la cupola di Brunelleschi.", alt: ["Io ho fotografato la cupola di Brunelleschi."], en: "I photographed Brunelleschi's dome." } }
      - { es: "Hai salito tutti i gradini del campanile?", en: "Did you climb all the steps of the bell tower?", altEs: ["Tu hai salito tutti i gradini del campanile?"], altEn: ["Have you climbed all the steps of the bell tower?"], grammar: [g.passato-prossimo-avere], vocab: [w.gradino, w.campanile, w.salire], note: "salire takes avere when it has an object (i gradini, le scale)." }
      - { es: "In cima al campanile ho guardato la vista per mezz'ora.", en: "At the top of the bell tower I looked at the view for half an hour.", altEs: ["Ho guardato la vista per mezz'ora in cima al campanile."], grammar: [g.passato-prossimo-avere], vocab: [w.cima, w.vista, w.guardare] }
      - { es: "Ho telefonato a mia madre dalla piazza del Duomo.", en: "I phoned my mother from the cathedral square.", altEs: ["Dalla piazza del Duomo ho telefonato a mia madre.", "Ho chiamato mia madre dalla piazza del Duomo."], altEn: ["I called my mother from the cathedral square."], grammar: [g.passato-prossimo-avere], vocab: [w.telefonare, w.madre] }
      - { es: "Non abbiamo noleggiato una bici: abbiamo camminato.", en: "We didn't rent a bike: we walked.", altEs: ["Non abbiamo noleggiato una bicicletta: abbiamo camminato.", "Non abbiamo noleggiato una bici, abbiamo camminato."], altEn: ["We didn't hire a bike: we walked."], grammar: [g.passato-prossimo-avere, g.negation], vocab: [w.noleggiare, w.camminare], transform: { instruction: "Change to 'I'", answer: "Non ho noleggiato una bici: ho camminato.", alt: ["Io non ho noleggiato una bici: ho camminato.", "Non ho noleggiato una bici, ho camminato."], en: "I didn't rent a bike: I walked." } }
      - { es: "Hai incontrato Giulia davanti al Duomo?", en: "Did you meet Giulia in front of the cathedral?", altEs: ["Davanti al Duomo hai incontrato Giulia?"], altEn: ["Did you run into Giulia in front of the cathedral?"], grammar: [g.passato-prossimo-avere], vocab: [w.incontrare, w.davanti-a] }
      - { es: "Ho controllato l'orario del museo, ma ho sbagliato giorno.", en: "I checked the museum's opening hours, but I got the day wrong.", altEs: ["Ho controllato l'orario del museo ma ho sbagliato giorno."], grammar: [g.passato-prossimo-avere], vocab: [w.controllare, w.sbagliare, w.orario] }
      - { es: "Marco ha regalato a sua sorella una guida di Firenze.", en: "Marco gave his sister a guidebook to Florence.", altEs: ["Marco ha regalato una guida di Firenze a sua sorella."], altEn: ["Marco gave his sister a guide to Florence as a present."], grammar: [g.passato-prossimo-avere], vocab: [w.regalare, w.guida] }
      - { es: "Avete mandato le foto ai nonni?", en: "Did you send the photos to your grandparents?", altEs: ["Voi avete mandato le foto ai nonni?", "Le foto, le avete mandate ai nonni?"], altEn: ["Have you sent the photos to your grandparents?"], grammar: [g.passato-prossimo-avere], vocab: [w.mandare, w.foto, w.nonno] }
      - { es: "Ho dimenticato il cellulare in albergo!", en: "I forgot my phone at the hotel!", altEs: ["Ho dimenticato il telefono in albergo!", "Ho dimenticato il cellulare all'albergo!"], altEn: ["I've left my phone at the hotel!"], grammar: [g.passato-prossimo-avere], vocab: [w.dimenticare, w.cellulare] }
      - { es: "Giulia ha accompagnato i turisti fino al campanile.", en: "Giulia took the tourists as far as the bell tower.", altEs: ["Giulia ha accompagnato i turisti al campanile."], altEn: ["Giulia went with the tourists as far as the bell tower."], grammar: [g.passato-prossimo-avere], vocab: [w.accompagnare, w.turista], error: { wrong: "Giulia ha accompagnata i turisti fino al campanile.", explain: "With avere the participle does not agree with the subject: Giulia ha accompagnato.", grammar: g.passato-prossimo-avere } }
      - { es: "Abbiamo salutato la guida e abbiamo cenato in una trattoria fiorentina.", en: "We said goodbye to the guide and had dinner in a Florentine trattoria.", altEs: ["Abbiamo salutato la guida e poi abbiamo cenato in una trattoria fiorentina."], grammar: [g.passato-prossimo-avere], vocab: [w.salutare, w.fiorentino, w.cenare] }
      - { es: "I miei amici hanno assaggiato il pane toscano: non ha sale!", en: "My friends tasted Tuscan bread: it has no salt!", altEs: ["I miei amici hanno provato il pane toscano: non ha sale!"], altEn: ["My friends tried Tuscan bread: there's no salt in it!"], grammar: [g.passato-prossimo-avere], vocab: [w.toscano, w.assaggiare, w.pane], note: "Traditional Tuscan bread (pane sciocco) is made without salt." }
      - { es: "Ieri sera abbiamo ricordato il nostro primo viaggio a Firenze.", en: "Last night we remembered our first trip to Florence.", altEs: ["Abbiamo ricordato il nostro primo viaggio a Firenze ieri sera."], altEn: ["Yesterday evening we reminisced about our first trip to Florence."], grammar: [g.passato-prossimo-avere, g.possessives], vocab: [w.ricordare, w.viaggio] }
      - { es: "Ho mangiato troppo e non ho dormito bene.", en: "I ate too much and I didn't sleep well.", altEs: ["Io ho mangiato troppo e non ho dormito bene."], altEn: ["I've eaten too much and I haven't slept well."], grammar: [g.passato-prossimo-avere, g.negation], vocab: [w.mangiare, w.dormire], error: { wrong: "Ho mangiato troppo e non dormo bene ieri.", explain: "A completed action in the past takes the passato prossimo: non ho dormito.", grammar: g.passato-prossimo-avere } }
    exchanges:
      - q: { es: "Che cosa hai visitato ieri?", en: "What did you visit yesterday?" }
        a: { es: "Ho visitato il Duomo e il campanile.", en: "I visited the cathedral and the bell tower." }
        alt: ["Il Duomo e il campanile.", "Ho visitato il Duomo."]
        grammar: [g.passato-prossimo-avere]
        vocab: [w.duomo, w.campanile, w.ieri]
      - q: { es: "Hai telefonato alla nonna?", en: "Did you phone grandma?" }
        a: { es: "Sì, ho telefonato stamattina.", en: "Yes, I phoned this morning." }
        alt: ["No, ho dimenticato!", "Sì, ho telefonato ieri sera."]
        grammar: [g.passato-prossimo-avere]
        vocab: [w.telefonare, w.dimenticare]
      - q: { es: "Avete noleggiato le bici?", en: "Did you rent the bikes?" }
        a: { es: "No, abbiamo camminato tutto il giorno.", en: "No, we walked all day." }
        alt: ["Sì, abbiamo noleggiato due bici.", "No, abbiamo preso l'autobus."]
        grammar: [g.passato-prossimo-avere]
        vocab: [w.noleggiare, w.camminare]
      - q: { es: "Hai fotografato la vista dalla cima?", en: "Did you photograph the view from the top?" }
        a: { es: "Sì, ho fatto cento foto!", en: "Yes, I took a hundred photos!" }
        alt: ["Sì, ho fotografato tutta la città.", "No, ho dimenticato il cellulare."]
        grammar: [g.passato-prossimo-avere, g.participles-irregular]
        vocab: [w.fotografare, w.vista, w.cima]
      - q: { es: "Chi hai incontrato in piazza?", en: "Who did you meet in the square?" }
        a: { es: "Ho incontrato Marco e sua sorella.", en: "I met Marco and his sister." }
        alt: ["Marco e sua sorella.", "Non ho incontrato nessuno."]
        grammar: [g.passato-prossimo-avere]
        vocab: [w.incontrare]
    texts:
      - title: "Cartolina da Firenze"
        es: ["Cara mamma, ieri ho visitato il Duomo.", "Ho salito tutti i gradini della cupola e ho fotografato la città.", "Che vista! Ti abbraccio."]
        en: ["Dear Mum, yesterday I visited the cathedral.", "I climbed all the steps of the dome and photographed the city.", "What a view! Hugs."]
        grammar: [g.passato-prossimo-avere]
        vocab: [w.duomo, w.gradino, w.cupola, w.fotografare]
      - title: "Messaggio di Luca"
        es: ["Ho controllato l'orario: il campanile chiude alle sette.", "Ho telefonato a Sara, ma non ha risposto.", "Ci vediamo in piazza alle cinque?"]
        en: ["I've checked the times: the bell tower closes at seven.", "I phoned Sara, but she didn't answer.", "Shall we meet in the square at five?"]
        grammar: [g.passato-prossimo-avere, g.participles-irregular]
        vocab: [w.controllare, w.telefonare, w.campanile]
    spicy:
      - { es: "Ho fotografato la cupola, ma la foto più bella è quella con te.", en: "I photographed the dome, but the best photo is the one with you.", altEs: ["Ho fotografato la cupola, ma la foto più bella è con te."], grammar: [g.passato-prossimo-avere], vocab: [w.fotografare, w.cupola] }
      - { es: "Ieri ho incontrato una persona fiorentina molto interessante: tu.", en: "Yesterday I met a very interesting Florentine person: you.", altEs: ["Ieri ho conosciuto una persona fiorentina molto interessante: tu."], grammar: [g.passato-prossimo-avere], vocab: [w.incontrare, w.fiorentino] }
      - { es: "Hai dimenticato la sciarpa da me... per la terza volta. Interessante.", en: "You've left your scarf at my place... for the third time. Interesting.", altEs: ["Hai dimenticato la sciarpa a casa mia... per la terza volta. Interessante."], grammar: [g.passato-prossimo-avere], vocab: [w.dimenticare, w.sciarpa] }
      - { es: "Ho noleggiato una bici per due. Hai tempo stasera?", en: "I've rented a bike for two. Are you free tonight?", altEs: ["Ho noleggiato una bicicletta per due. Hai tempo stasera?"], altEn: ["I've hired a tandem. Have you got time tonight?"], grammar: [g.passato-prossimo-avere], vocab: [w.noleggiare] }
      - { es: "Ho salito quattrocento gradini e ho ancora fiato... per un aperitivo con te.", en: "I climbed four hundred steps and I still have breath... for an aperitivo with you.", altEs: ["Ho salito quattrocento gradini e ho ancora fiato per un aperitivo con te."], grammar: [g.passato-prossimo-avere], vocab: [w.gradino, w.aperitivo] }
  - id: a2.u01.l2
    title: Che cosa hai fatto?
    teach: [g.participles-irregular]
    vocab: [w.decidere, w.vincere, w.perdere, w.rompere, w.scoprire, w.ridere, w.accendere, w.spegnere, w.galleria, w.opera, w.arte, w.pittore, w.scultore, w.statua, w.affresco, w.capolavoro, w.rinascimento, w.artistico, w.classico, w.nascita, w.storia]
    tip: "Learn irregular participles in families: fatto, detto, scritto, letto; preso, messo, chiuso, deciso; visto, chiesto, risposto; aperto, scoperto."
    sentences:
      - { es: "Che cosa avete fatto oggi pomeriggio?", en: "What did you do this afternoon?", altEs: ["Cosa avete fatto oggi pomeriggio?", "Che avete fatto oggi pomeriggio?"], altEn: ["What have you done this afternoon?"], grammar: [g.participles-irregular, g.question-words], vocab: [w.fare, w.pomeriggio] }
      - { es: "Ho visto il David di Michelangelo alla Galleria dell'Accademia.", en: "I saw Michelangelo's David at the Accademia Gallery.", altEs: ["Alla Galleria dell'Accademia ho visto il David di Michelangelo."], altEn: ["I've seen Michelangelo's David at the Accademia Gallery."], grammar: [g.participles-irregular], vocab: [w.vedere, w.galleria] }
      - { es: "Chi ha fatto questa statua? — Un grande scultore del Rinascimento.", en: "Who made this statue? — A great Renaissance sculptor.", altEs: ["Chi ha fatto questa statua? — Uno scultore del Rinascimento."], grammar: [g.participles-irregular], vocab: [w.statua, w.scultore, w.rinascimento] }
      - { es: "Abbiamo preso i biglietti per il Museo dell'Opera del Duomo.", en: "We got the tickets for the Cathedral Museum.", altEs: ["Abbiamo comprato i biglietti per il Museo dell'Opera del Duomo."], altEn: ["We bought the tickets for the Museo dell'Opera del Duomo."], grammar: [g.participles-irregular], vocab: [w.prendere, w.biglietto, w.opera], error: { wrong: "Abbiamo prenduto i biglietti per il Museo dell'Opera del Duomo.", explain: "prendere has an irregular participle: preso, never prenduto.", grammar: g.participles-irregular } }
      - { es: "Ho scoperto un capolavoro in una piccola chiesa.", en: "I discovered a masterpiece in a small church.", altEs: ["In una piccola chiesa ho scoperto un capolavoro."], altEn: ["I found a masterpiece in a little church."], grammar: [g.participles-irregular], vocab: [w.scoprire, w.capolavoro, w.chiesa] }
      - { es: "Hanno acceso le luci della chiesa e abbiamo visto gli affreschi.", en: "They switched on the church lights and we saw the frescoes.", altEs: ["Hanno acceso le luci nella chiesa e abbiamo visto gli affreschi."], grammar: [g.participles-irregular], vocab: [w.accendere, w.affresco, w.luce] }
      - { es: "Chi ha spento la luce? Non vedo niente!", en: "Who switched off the light? I can't see anything!", altEs: ["Chi ha spento la luce? Non si vede niente!"], grammar: [g.participles-irregular], vocab: [w.spegnere, w.luce] }
      - { es: "Chi ha vinto la partita ieri sera? — Ha vinto la Fiorentina!", en: "Who won the match last night? — Fiorentina won!", altEs: ["Chi ha vinto ieri sera? — La Fiorentina!"], grammar: [g.participles-irregular], vocab: [w.vincere, w.partita] }
      - { es: "Abbiamo perso il treno per Pisa.", en: "We missed the train to Pisa.", altEs: ["Noi abbiamo perso il treno per Pisa."], altEn: ["We've missed the train to Pisa."], grammar: [g.participles-irregular], vocab: [w.perdere, w.treno], transform: { instruction: "Change to 'I'", answer: "Ho perso il treno per Pisa.", alt: ["Io ho perso il treno per Pisa."], en: "I missed the train to Pisa." } }
      - { es: "Abbiamo riso tutta la sera con i ragazzi di Firenze.", en: "We laughed all evening with the guys from Florence.", altEs: ["Con i ragazzi di Firenze abbiamo riso tutta la sera."], grammar: [g.participles-irregular], vocab: [w.ridere] }
      - { es: "Avete deciso? Uffizi o Palazzo Pitti?", en: "Have you decided? The Uffizi or Palazzo Pitti?", altEs: ["Allora, avete deciso? Uffizi o Palazzo Pitti?"], grammar: [g.participles-irregular], vocab: [w.decidere] }
      - { es: "Non ho capito il nome del pittore: hai detto Botticelli?", en: "I didn't catch the painter's name: did you say Botticelli?", altEs: ["Non ho capito il nome del pittore. Hai detto Botticelli?"], grammar: [g.participles-irregular, g.passato-prossimo-avere], vocab: [w.pittore, w.dire] }
      - { es: "Hanno aperto una nuova galleria d'arte vicino al Duomo.", en: "They've opened a new art gallery near the cathedral.", altEs: ["Vicino al Duomo hanno aperto una nuova galleria d'arte."], altEn: ["A new art gallery has opened near the cathedral."], grammar: [g.participles-irregular], vocab: [w.aprire, w.galleria, w.arte] }
      - { es: "Ho messo la guida nello zaino e ho chiuso la porta.", en: "I put the guidebook in my backpack and closed the door.", altEs: ["Ho messo la guida nello zaino, poi ho chiuso la porta."], grammar: [g.participles-irregular], vocab: [w.mettere, w.chiudere, w.zaino], transform: { instruction: "Change to 'we'", answer: "Abbiamo messo la guida nello zaino e abbiamo chiuso la porta.", alt: ["Abbiamo messo la guida nello zaino e chiuso la porta."], en: "We put the guidebook in the backpack and closed the door." } }
      - { es: "Al museo abbiamo visto un film sulla nascita della cupola.", en: "At the museum we watched a film about the birth of the dome.", grammar: [g.participles-irregular], vocab: [w.nascita, w.cupola, w.film] }
      - { es: "Mia figlia ha scelto un corso artistico: ha letto tutta la storia dell'arte classica!", en: "My daughter chose an art course: she has read the whole history of classical art!", altEs: ["Mia figlia ha scelto un corso artistico e ha letto tutta la storia dell'arte classica!"], grammar: [g.participles-irregular], vocab: [w.scegliere, w.artistico, w.storia, w.classico, w.corso] }
    exchanges:
      - q: { es: "Che cosa hai fatto ieri?", en: "What did you do yesterday?" }
        a: { es: "Ho visto gli affreschi in Santa Maria Novella.", en: "I saw the frescoes in Santa Maria Novella." }
        alt: ["Ho visitato un museo.", "Niente, ho dormito tutto il giorno."]
        grammar: [g.participles-irregular]
        vocab: [w.affresco]
      - q: { es: "Avete preso i biglietti?", en: "Have you got the tickets?" }
        a: { es: "Sì, li abbiamo presi online.", en: "Yes, we got them online." }
        alt: ["Sì, abbiamo preso i biglietti ieri.", "No, abbiamo dimenticato!"]
        grammar: [g.participles-irregular]
        vocab: [w.biglietto]
      - q: { es: "Chi ha vinto?", en: "Who won?" }
        a: { es: "Ha vinto la Fiorentina, due a uno.", en: "Fiorentina won, two-one." }
        alt: ["La Fiorentina.", "Non lo so, non ho visto la partita."]
        grammar: [g.participles-irregular]
        vocab: [w.vincere]
      - q: { es: "Perché sei così triste?", en: "Why are you so sad?" }
        a: { es: "Ho perso il portafoglio al museo.", en: "I lost my wallet at the museum." }
        alt: ["Ho perso il treno.", "Ho rotto il cellulare."]
        grammar: [g.participles-irregular]
        vocab: [w.perdere, w.portafoglio]
      - q: { es: "Hai letto la storia della cupola?", en: "Have you read the story of the dome?" }
        a: { es: "Sì, ho letto un libro su Brunelleschi.", en: "Yes, I've read a book about Brunelleschi." }
        alt: ["No, non ho letto niente.", "Sì, ieri sera."]
        grammar: [g.participles-irregular]
        vocab: [w.storia]
    texts:
      - title: "Diario di viaggio"
        es: ["Oggi ho visto il David e ho scoperto che è alto più di cinque metri.", "Poi ho preso un caffè e ho scritto due cartoline.", "Stasera ho deciso: domani Uffizi!"]
        en: ["Today I saw the David and found out it's more than five metres tall.", "Then I had a coffee and wrote two postcards.", "Tonight I've decided: tomorrow, the Uffizi!"]
        grammar: [g.participles-irregular]
        vocab: [w.scoprire, w.decidere, w.cartolina]
      - title: "Recensione"
        es: ["Abbiamo visitato una piccola galleria d'arte vicino a Santa Croce.", "Non abbiamo speso molto e abbiamo visto un vero capolavoro.", "Consigliato!"]
        en: ["We visited a small art gallery near Santa Croce.", "We didn't spend much and we saw a real masterpiece.", "Recommended!"]
        grammar: [g.participles-irregular]
        vocab: [w.galleria, w.arte, w.capolavoro]
    spicy:
      - { es: "Ho visto il David, ma sinceramente ho visto di meglio... ieri sera.", en: "I've seen the David, but honestly I've seen better... last night.", altEs: ["Ho visto il David, ma sinceramente ho visto di meglio ieri sera."], grammar: [g.participles-irregular], vocab: [w.vedere] }
      - { es: "Hai rotto il ghiaccio con un sorriso. Bravo.", en: "You broke the ice with a smile. Well done.", altEs: ["Hai rotto il ghiaccio con un sorriso. Brava."], grammar: [g.participles-irregular], vocab: [w.rompere, w.sorriso] }
      - { es: "Ho perso il treno, ma ho trovato te.", en: "I missed the train, but I found you.", altEs: ["Ho perso il treno ma ho trovato te."], grammar: [g.participles-irregular, g.stressed-pronouns], vocab: [w.perdere, w.trovare] }
      - { es: "Chi ha spento la luce? Ah, sei stato tu... e adesso?", en: "Who switched off the light? Oh, it was you... and now what?", altEs: ["Chi ha spento la luce? Ah, sei stata tu... e adesso?"], grammar: [g.participles-irregular], vocab: [w.spegnere, w.luce] }
      - { es: "Sei un capolavoro del Rinascimento? No? Allora del weekend.", en: "Are you a Renaissance masterpiece? No? Then a weekend one.", grammar: [g.essere-present], vocab: [w.capolavoro, w.rinascimento] }
  - id: a2.u01.l3
    title: Due giorni fa
    teach: [g.time-markers-past]
    vocab: [w.laltro-ieri, w.ieri-sera, w.scorso, w.fa, w.appena, w.finalmente, w.durante, w.recentemente, w.ultimamente, w.una-volta, w.per-la-prima-volta, w.tutto-il-giorno, w.passato, w.fare-un-giro, w.gioiello, w.gioielleria, w.orefice, w.macellaio, w.mondo]
    tip: "fa follows the time (due giorni fa); scorso follows the noun and agrees (la settimana scorsa)."
    sentences:
      - { es: "Ho comprato un gioiello sul Ponte Vecchio due giorni fa.", en: "I bought a piece of jewellery on the Ponte Vecchio two days ago.", altEs: ["Due giorni fa ho comprato un gioiello sul Ponte Vecchio."], grammar: [g.time-markers-past, g.passato-prossimo-avere], vocab: [w.gioiello, w.fa, w.comprare] }
      - { es: "La settimana scorsa abbiamo visitato una vecchia gioielleria.", en: "Last week we visited an old jeweller's.", altEs: ["Abbiamo visitato una vecchia gioielleria la settimana scorsa."], grammar: [g.time-markers-past], vocab: [w.scorso, w.gioielleria, w.settimana], transform: { instruction: "Change 'la settimana scorsa' to 'last month'", answer: "Il mese scorso abbiamo visitato una vecchia gioielleria.", alt: ["Abbiamo visitato una vecchia gioielleria il mese scorso."], en: "Last month we visited an old jeweller's." } }
      - { es: "L'altro ieri ho conosciuto un orefice fiorentino.", en: "The day before yesterday I met a Florentine goldsmith.", altEs: ["L'altro ieri ho incontrato un orefice fiorentino."], grammar: [g.time-markers-past], vocab: [w.laltro-ieri, w.orefice] }
      - { es: "Ieri sera abbiamo cenato tardi, verso le dieci.", en: "Last night we had dinner late, around ten.", altEs: ["Abbiamo cenato tardi ieri sera, verso le dieci."], grammar: [g.time-markers-past], vocab: [w.ieri-sera, w.tardi] }
      - { es: "Ho appena finito il caffè: arrivo!", en: "I've just finished my coffee: I'm coming!", altEs: ["Ho appena finito il caffè, arrivo!"], grammar: [g.time-markers-past, g.gia-ancora-mai], vocab: [w.appena, w.finire] }
      - { es: "Finalmente ho visto il Ponte Vecchio!", en: "At last I've seen the Ponte Vecchio!", altEs: ["Ho visto finalmente il Ponte Vecchio!"], altEn: ["I've finally seen the Ponte Vecchio!"], grammar: [g.time-markers-past], vocab: [w.finalmente] }
      - { es: "Durante il viaggio abbiamo letto tre libri.", en: "During the trip we read three books.", altEs: ["Abbiamo letto tre libri durante il viaggio."], grammar: [g.time-markers-past, g.participles-irregular], vocab: [w.durante, w.viaggio] }
      - { es: "Recentemente hanno aperto un museo nuovo in centro.", en: "Recently they opened a new museum in the centre.", altEs: ["Hanno aperto recentemente un museo nuovo in centro."], grammar: [g.time-markers-past], vocab: [w.recentemente, w.museo] }
      - { es: "Ho visto Firenze una volta, nel 2015.", en: "I saw Florence once, in 2015.", altEs: ["Ho visto Firenze una volta sola, nel 2015."], grammar: [g.time-markers-past], vocab: [w.una-volta] }
      - { es: "Ieri ho preso il treno da solo per la prima volta.", en: "Yesterday I took the train on my own for the first time.", altEs: ["Ieri per la prima volta ho preso il treno da solo."], grammar: [g.time-markers-past], vocab: [w.per-la-prima-volta, w.treno] }
      - { es: "Abbiamo camminato tutto il giorno e adesso abbiamo fame.", en: "We walked all day and now we're hungry.", altEs: ["Abbiamo camminato tutto il giorno, adesso abbiamo fame."], grammar: [g.time-markers-past, g.avere-expressions], vocab: [w.tutto-il-giorno, w.camminare], transform: { instruction: "Change to 'they'", answer: "Hanno camminato tutto il giorno e adesso hanno fame.", alt: ["Loro hanno camminato tutto il giorno e adesso hanno fame."], en: "They walked all day and now they're hungry." } }
      - { es: "Nel 1593 Ferdinando I ha mandato via i macellai dal Ponte Vecchio.", en: "In 1593 Ferdinando I sent the butchers away from the Ponte Vecchio.", grammar: [g.time-markers-past], vocab: [w.macellaio, w.mandare] }
      - { es: "Sabato scorso abbiamo fatto un giro in bici sulle colline.", en: "Last Saturday we went for a bike ride in the hills.", altEs: ["Abbiamo fatto un giro in bici sulle colline sabato scorso."], grammar: [g.time-markers-past], vocab: [w.fare-un-giro, w.scorso, w.collina] }
      - { es: "Ho visto Marco due giorni fa.", en: "I saw Marco two days ago.", altEs: ["Due giorni fa ho visto Marco."], grammar: [g.time-markers-past], vocab: [w.fa], error: { wrong: "Ho visto Marco fa due giorni.", explain: "fa comes after the time expression: due giorni fa.", grammar: g.time-markers-past } }
      - { es: "L'anno scorso mio zio ha fatto il giro del mondo.", en: "Last year my uncle went round the world.", altEs: ["Mio zio ha fatto il giro del mondo l'anno scorso."], grammar: [g.time-markers-past], vocab: [w.mondo, w.scorso] }
      - { es: "Con la guida abbiamo parlato del passato della città.", en: "With the guide we talked about the city's past.", altEs: ["Abbiamo parlato del passato della città con la guida."], grammar: [g.passato-prossimo-avere], vocab: [w.passato, w.guida] }
    exchanges:
      - q: { es: "Quando hai visto Marco?", en: "When did you see Marco?" }
        a: { es: "Due giorni fa, al mercato.", en: "Two days ago, at the market." }
        alt: ["Ieri.", "La settimana scorsa.", "L'altro ieri."]
        grammar: [g.time-markers-past]
        vocab: [w.fa]
      - q: { es: "Che cosa avete fatto il weekend scorso?", en: "What did you do last weekend?" }
        a: { es: "Abbiamo fatto un giro in bici nel Chianti.", en: "We went for a bike ride in Chianti." }
        alt: ["Niente di speciale.", "Abbiamo visitato Firenze."]
        grammar: [g.time-markers-past]
        vocab: [w.scorso, w.fare-un-giro]
      - q: { es: "Hai già mangiato?", en: "Have you eaten yet?" }
        a: { es: "Sì, ho appena finito.", en: "Yes, I've just finished." }
        alt: ["No, non ancora.", "Sì, un'ora fa."]
        grammar: [g.time-markers-past, g.gia-ancora-mai]
        vocab: [w.appena]
      - q: { es: "Quando hai comprato questo anello?", en: "When did you buy this ring?" }
        a: { es: "L'anno scorso, in una gioielleria sul Ponte Vecchio.", en: "Last year, at a jeweller's on the Ponte Vecchio." }
        alt: ["Un anno fa.", "Il mese scorso."]
        grammar: [g.time-markers-past]
        vocab: [w.gioielleria, w.scorso, w.anello]
      - q: { es: "Hai dormito bene?", en: "Did you sleep well?" }
        a: { es: "Ultimamente no: ho lavorato troppo.", en: "Not lately: I've worked too much." }
        alt: ["Sì, benissimo.", "No, per niente."]
        grammar: [g.time-markers-past]
        vocab: [w.ultimamente]
    texts:
      - title: "Dal diario di Anna"
        es: ["Tre giorni fa ho lasciato Roma.", "Ieri ho visto finalmente il Ponte Vecchio.", "Stamattina ho comprato un piccolo gioiello per mia sorella."]
        en: ["Three days ago I left Rome.", "Yesterday I finally saw the Ponte Vecchio.", "This morning I bought a little piece of jewellery for my sister."]
        grammar: [g.time-markers-past]
        vocab: [w.fa, w.finalmente, w.gioiello]
      - title: "Messaggio"
        es: ["Ciao! Ho appena visto la tua foto.", "Ultimamente hai viaggiato tanto!", "La settimana scorsa Parigi, oggi Firenze: e domani?"]
        en: ["Hi! I've just seen your photo.", "Lately you've travelled so much!", "Last week Paris, today Florence: and tomorrow?"]
        grammar: [g.time-markers-past]
        vocab: [w.appena, w.ultimamente, w.scorso]
    spicy:
      - { es: "Ti ho visto due giorni fa sul Ponte Vecchio e da allora penso solo ai gioielli... e a te.", en: "I saw you two days ago on the Ponte Vecchio and since then I've only been thinking about jewellery... and you.", altEs: ["Ti ho visto due giorni fa sul Ponte Vecchio e da allora penso solo ai gioielli e a te."], grammar: [g.time-markers-past], vocab: [w.fa, w.gioiello] }
      - { es: "Ultimamente ho dormito poco. Colpa tua e dei tuoi messaggi.", en: "Lately I haven't slept much. Your fault, and your messages' fault.", altEs: ["Ultimamente ho dormito poco: colpa tua e dei tuoi messaggi."], grammar: [g.time-markers-past], vocab: [w.ultimamente, w.messaggio] }
      - { es: "Per la prima volta ho ballato in piazza. E per la prima volta non ho pensato ai piedi.", en: "For the first time I danced in the square. And for the first time I didn't think about my feet.", grammar: [g.time-markers-past], vocab: [w.per-la-prima-volta, w.ballare] }
      - { es: "Ho appena finito il gelato. Vuoi dividere il prossimo?", en: "I've just finished my ice cream. Do you want to share the next one?", altEs: ["Ho appena finito il gelato: vuoi dividere il prossimo?"], grammar: [g.time-markers-past], vocab: [w.appena, w.gelato] }
      - { es: "Ieri sera ti ho aspettato fino alle dieci. Finalmente sei arrivato... con la pizza!", en: "Last night I waited for you until ten. You finally arrived... with the pizza!", altEs: ["Ieri sera ti ho aspettata fino alle dieci. Finalmente sei arrivata... con la pizza!"], grammar: [g.time-markers-past], vocab: [w.ieri-sera, w.finalmente] }
  - id: a2.u01.l4
    title: Un weekend toscano
    teach: [g.passato-prossimo-avere, g.time-markers-past]
    vocab: [w.villa, w.tipico, w.simbolo, w.giglio, w.soprattutto, w.ospitare, w.forma, w.campo, w.grano, w.arco, w.artigiano, w.legno, w.paglia, w.fiasco, w.nobile, w.etrusco, w.governo]
    tip: "Telling someone about your weekend: start with a time marker, then use the passato prossimo for each thing you did."
    sentences:
      - { es: "Lo scorso fine settimana una famiglia di Fiesole ci ha ospitato nella sua villa.", en: "Last weekend a family from Fiesole put us up in their villa.", altEs: ["Il fine settimana scorso una famiglia di Fiesole ci ha ospitato nella sua villa."], altEn: ["Last weekend a family from Fiesole had us to stay in their villa."], grammar: [g.passato-prossimo-avere, g.time-markers-past], vocab: [w.ospitare, w.villa, w.fine-settimana] }
      - { es: "Abbiamo mangiato soprattutto piatti tipici toscani.", en: "We ate mostly typical Tuscan dishes.", altEs: ["Abbiamo mangiato soprattutto piatti toscani tipici."], altEn: ["Above all we ate typical Tuscan dishes."], grammar: [g.passato-prossimo-avere], vocab: [w.soprattutto, w.tipico, w.piatto] }
      - { es: "Il giglio rosso è il simbolo di Firenze.", en: "The red lily is the symbol of Florence.", altEs: ["Il simbolo di Firenze è il giglio rosso."], grammar: [g.essere-present], vocab: [w.giglio, w.simbolo] }
      - { es: "Ieri un artigiano ci ha mostrato come lavora il legno.", en: "Yesterday a craftsman showed us how he works wood.", altEs: ["Ieri un artigiano ci ha fatto vedere come lavora il legno."], grammar: [g.passato-prossimo-avere], vocab: [w.artigiano, w.legno, w.mostrare] }
      - { es: "Ho comprato un vecchio fiasco di vino con la paglia.", en: "I bought an old straw-covered wine flask.", altEs: ["Ho comprato un vecchio fiasco con la paglia."], grammar: [g.passato-prossimo-avere], vocab: [w.fiasco, w.paglia] }
      - { es: "Abbiamo attraversato i campi di grano in bicicletta.", en: "We crossed the wheat fields by bike.", altEs: ["In bicicletta abbiamo attraversato i campi di grano.", "Abbiamo attraversato i campi di grano in bici."], grammar: [g.passato-prossimo-avere], vocab: [w.campo, w.grano, w.attraversare], transform: { instruction: "Change to 'I'", answer: "Ho attraversato i campi di grano in bicicletta.", alt: ["Ho attraversato i campi di grano in bici."], en: "I crossed the wheat fields by bike." } }
      - { es: "Hai visto l'arco etrusco di Volterra?", en: "Have you seen the Etruscan arch in Volterra?", altEs: ["L'arco etrusco di Volterra, l'hai visto?"], altEn: ["Did you see the Etruscan arch at Volterra?"], grammar: [g.passato-prossimo-avere], vocab: [w.arco, w.etrusco] }
      - { es: "Cosimo de' Medici ha voluto un palazzo nuovo per il governo della città.", en: "Cosimo de' Medici wanted a new palace for the city's government.", grammar: [g.passato-prossimo-avere], vocab: [w.governo, w.palazzo], note: "That palace became the Uffizi: uffizi = offices." }
      - { es: "La piazza di Lucca ha una forma strana: è ovale.", en: "The square in Lucca has a strange shape: it's oval.", altEs: ["La piazza di Lucca ha una forma strana, è ovale."], grammar: [g.avere-present], vocab: [w.forma] }
      - { es: "Ieri sera abbiamo conosciuto una vecchia famiglia nobile di Firenze.", en: "Last night we met an old noble family from Florence.", altEs: ["Abbiamo conosciuto una vecchia famiglia nobile di Firenze ieri sera."], grammar: [g.passato-prossimo-avere, g.time-markers-past], vocab: [w.nobile, w.conoscere], transform: { instruction: "Change 'ieri sera' to 'three days ago'", answer: "Tre giorni fa abbiamo conosciuto una vecchia famiglia nobile di Firenze.", alt: ["Abbiamo conosciuto una vecchia famiglia nobile di Firenze tre giorni fa."], en: "Three days ago we met an old noble family from Florence." } }
      - { es: "Non avete visto la campagna toscana? Peccato!", en: "You haven't seen the Tuscan countryside? What a pity!", altEs: ["Non avete ancora visto la campagna toscana? Peccato!"], grammar: [g.passato-prossimo-avere, g.negation], vocab: [w.campagna, w.toscano] }
      - { es: "Venerdì abbiamo lavorato, sabato abbiamo dormito e domenica abbiamo visitato tre paesi.", en: "On Friday we worked, on Saturday we slept and on Sunday we visited three towns.", altEs: ["Venerdì abbiamo lavorato, sabato dormito e domenica abbiamo visitato tre paesi."], grammar: [g.passato-prossimo-avere, g.days-months], vocab: [w.lavorare, w.paese] }
      - { es: "Che cosa avete fatto nel fine settimana?", en: "What did you do at the weekend?", altEs: ["Cosa avete fatto nel fine settimana?", "Che cosa avete fatto il weekend?"], altEn: ["What did you get up to at the weekend?"], grammar: [g.participles-irregular, g.question-words], vocab: [w.fine-settimana] }
      - { es: "Abbiamo noleggiato una macchina e abbiamo guidato fino a Montepulciano.", en: "We rented a car and drove as far as Montepulciano.", altEs: ["Abbiamo noleggiato un'auto e abbiamo guidato fino a Montepulciano.", "Abbiamo noleggiato una macchina e siamo andati fino a Montepulciano."], grammar: [g.passato-prossimo-avere], vocab: [w.noleggiare, w.guidare, w.macchina], error: { wrong: "Abbiamo noleggiato una macchina e abbiamo guidata fino a Montepulciano.", explain: "With avere the participle stays in -o: abbiamo guidato.", grammar: g.passato-prossimo-avere } }
      - { es: "Il mese scorso ho comprato un tavolo di legno da un artigiano di Siena.", en: "Last month I bought a wooden table from a craftsman in Siena.", altEs: ["Ho comprato un tavolo di legno da un artigiano di Siena il mese scorso."], grammar: [g.time-markers-past, g.passato-prossimo-avere], vocab: [w.legno, w.artigiano, w.tavolo] }
    exchanges:
      - q: { es: "Dove avete dormito?", en: "Where did you sleep?" }
        a: { es: "In una villa vicino a Fiesole.", en: "In a villa near Fiesole." }
        alt: ["In albergo.", "Una famiglia ci ha ospitato."]
        grammar: [g.passato-prossimo-avere]
        vocab: [w.villa]
      - q: { es: "Che cosa avete mangiato?", en: "What did you eat?" }
        a: { es: "Soprattutto piatti tipici: ribollita e bistecca.", en: "Mostly typical dishes: ribollita and steak." }
        alt: ["La bistecca alla fiorentina.", "Piatti tipici toscani."]
        grammar: [g.passato-prossimo-avere]
        vocab: [w.soprattutto, w.tipico]
      - q: { es: "Che cosa hai comprato?", en: "What did you buy?" }
        a: { es: "Un fiasco di Chianti e una scatola di legno.", en: "A flask of Chianti and a wooden box." }
        alt: ["Niente, ho guardato e basta.", "Un fiasco di vino."]
        grammar: [g.passato-prossimo-avere]
        vocab: [w.fiasco, w.legno]
      - q: { es: "Qual è il simbolo di Firenze?", en: "What's the symbol of Florence?" }
        a: { es: "Il giglio rosso.", en: "The red lily." }
        alt: ["Il giglio.", "È il giglio rosso."]
        grammar: [g.question-words]
        vocab: [w.simbolo, w.giglio]
      - q: { es: "Avete visto Volterra?", en: "Did you see Volterra?" }
        a: { es: "Sì, abbiamo visto l'arco etrusco e il museo.", en: "Yes, we saw the Etruscan arch and the museum." }
        alt: ["No, non abbiamo avuto tempo.", "Sì, sabato scorso."]
        grammar: [g.passato-prossimo-avere]
        vocab: [w.arco, w.etrusco]
    texts:
      - title: "Il nostro weekend"
        es: ["Sabato abbiamo noleggiato due bici e abbiamo fatto un giro tra i campi di grano.", "A pranzo abbiamo mangiato in un agriturismo.", "Domenica un artigiano ci ha mostrato il suo lavoro."]
        en: ["On Saturday we rented two bikes and rode around the wheat fields.", "For lunch we ate at a farm restaurant.", "On Sunday a craftsman showed us his work."]
        grammar: [g.passato-prossimo-avere]
        vocab: [w.campo, w.grano, w.artigiano]
      - title: "Recensione di una villa"
        es: ["La signora Bianchi ci ha ospitato per tre notti.", "Abbiamo amato soprattutto la colazione e la vista sulle colline.", "Grazie di tutto!"]
        en: ["Signora Bianchi put us up for three nights.", "Above all we loved the breakfast and the view over the hills.", "Thanks for everything!"]
        grammar: [g.passato-prossimo-avere]
        vocab: [w.ospitare, w.soprattutto, w.vista]
    spicy:
      - { es: "Ho ospitato molti turisti, ma nessuno con un sorriso come il tuo.", en: "I've put up lots of tourists, but nobody with a smile like yours.", altEs: ["Ho ospitato tanti turisti, ma nessuno con un sorriso come il tuo."], grammar: [g.passato-prossimo-avere], vocab: [w.ospitare, w.sorriso] }
      - { es: "Il giglio è il simbolo di Firenze. E tu sei il simbolo del mio weekend.", en: "The lily is the symbol of Florence. And you're the symbol of my weekend.", grammar: [g.essere-present], vocab: [w.giglio, w.simbolo] }
      - { es: "Abbiamo bevuto un fiasco intero e abbiamo deciso di ballare tra il grano.", en: "We drank a whole flask and decided to dance in the wheat.", altEs: ["Abbiamo bevuto un fiasco intero e abbiamo deciso di ballare nel grano."], grammar: [g.passato-prossimo-avere, g.participles-irregular], vocab: [w.fiasco, w.grano] }
      - { es: "Sono di legno? No. Ma per te ho fatto la statua tutta la sera: non ho detto una parola.", en: "Am I made of wood? No. But for you I played statue all evening: I didn't say a word.", altEs: ["Non sono di legno, ma per te ho fatto la statua tutta la sera: non ho detto una parola."], grammar: [g.participles-irregular], vocab: [w.legno, w.statua] }
      - { es: "Hai una villa, una vigna e un sorriso nobile. Sei single?", en: "You've got a villa, a vineyard and a noble smile. Are you single?", grammar: [g.avere-present], vocab: [w.villa, w.nobile] }
dialogues:
  - id: a2.u01.d1
    title: Che cosa hai fatto ieri?
    context: Sara, on holiday in Florence, tells her Florentine friend Lorenzo about her day at the Duomo.
    lines:
      - { speaker: Lorenzo, es: "Ciao Sara! Che cosa hai fatto ieri?", en: "Hi Sara! What did you do yesterday?" }
      - { speaker: Sara, es: "Ho visitato il Duomo con mio fratello. Abbiamo salito tutti i gradini della cupola!", en: "I visited the cathedral with my brother. We climbed all the steps of the dome!" }
      - { speaker: Lorenzo, es: "Bravi! Quanto avete aspettato?", en: "Well done! How long did you wait?" }
      - { speaker: Sara, es: "Un'ora. Abbiamo comprato i biglietti online, ma abbiamo sbagliato orario.", en: "An hour. We bought the tickets online, but we got the time wrong." }
      - { speaker: Lorenzo, es: "E dalla cima avete fatto tante foto?", en: "And did you take lots of photos from the top?" }
      - { speaker: Sara, es: "Io ho fatto cento foto! Poi abbiamo mangiato un panino in una trattoria vicino a Santa Croce.", en: "I took a hundred photos! Then we had a sandwich in a trattoria near Santa Croce." }
      - { speaker: Lorenzo, es: "E ieri sera?", en: "And last night?" }
      - { speaker: Sara, es: "Ieri sera abbiamo incontrato degli amici e abbiamo bevuto un bicchiere di Chianti.", en: "Last night we met some friends and had a glass of Chianti." }
      - { speaker: Lorenzo, es: "E oggi che cosa fate?", en: "And what are you doing today?" }
      - { speaker: Sara, es: "Oggi noleggiamo due bici. Ma prima... oh no, ho dimenticato il cellulare in albergo!", en: "Today we're renting two bikes. But first... oh no, I've left my phone at the hotel!" }
    questions:
      - { q: "Con chi ha visitato il Duomo Sara?", options: ["Con Lorenzo", "Con suo fratello", "Con sua madre"], answer: 1, explain: "Sara says: Ho visitato il Duomo con mio fratello." }
      - { q: "Quanto hanno aspettato?", options: ["Dieci minuti", "Un'ora", "Due ore"], answer: 1, explain: "They waited an hour because they got the time wrong." }
      - { q: "Che cosa hanno fatto ieri sera?", options: ["Hanno incontrato degli amici", "Hanno noleggiato le bici", "Hanno visitato un museo"], answer: 0, explain: "Ieri sera abbiamo incontrato degli amici." }
      - { q: "Che cosa ha dimenticato Sara?", options: ["Il biglietto", "Il cellulare", "La guida"], answer: 1, explain: "Ho dimenticato il cellulare in albergo." }
