      - { es: "C'est ma voisine, elle est italienne.", en: "That's my neighbour, she's Italian.", grammar: [g.c-est-il-est, g.adjective-agreement], vocab: [w.voisin], transform: { instruction: "Talk about your male neighbour", answer: "C'est mon voisin, il est italien.", en: "That's my neighbour, he's Italian." } }
      - { es: "Il y a beaucoup de magasins et de restaurants.", en: "There are lots of shops and restaurants.", grammar: [g.il-y-a], vocab: [w.magasin, w.restaurant] }
