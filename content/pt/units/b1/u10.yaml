id: b1.u10
title: Ele disse que viria
lessons:
  - id: b1.u10.l1
    title: O guia diz que a trilha está fechada
    teach: [g.reported-speech-present]
    vocab: [w.afirmar, w.declarar, w.comentar, w.informar, w.comunicar, w.anunciar, w.mencionar, w.esclarecer, w.jornalista, w.repórter, w.reportagem, w.entrevistar, w.manchete, w.noticiário, w.canal, w.programa, w.emissora, w.revista, w.imprensa, w.jornalismo, w.mídia, w.publicidade, w.propaganda, w.assinante, w.assinatura]
    tip: "With a present reporting verb (diz, fala, comenta), tenses stay as they were; only the people change: 'Estou cansada' → Ela diz que está cansada."
    sentences:
      - { es: "O guia diz que a trilha está fechada por causa da chuva.", en: "The guide says the trail is closed because of the rain.", altEs: ["O guia fala que a trilha está fechada por causa da chuva.", "O guia diz que a trilha está fechada por causa das chuvas."], grammar: [g.reported-speech-present] }
      - { es: "A previsão do tempo informa que vai chover a semana toda.", en: "The weather forecast says it's going to rain all week.", altEs: ["A previsão do tempo informa que vai chover a semana inteira."], grammar: [g.reported-speech-present], vocab: [w.informar] }
      - { es: "O jornalista afirma que o parque nunca recebeu tantos visitantes.", en: "The journalist states that the park has never had so many visitors.", altEs: ["A jornalista afirma que o parque nunca recebeu tantos visitantes."], grammar: [g.reported-speech-present], vocab: [w.jornalista, w.afirmar] }
      - { es: "A manchete de hoje diz que a Chapada é o destino da moda.", en: "Today's headline says the Chapada is the fashionable destination.", grammar: [g.reported-speech-present], vocab: [w.manchete] }
      - { es: "No noticiário, anunciam que o parque vai ficar maior.", en: "On the news, they're announcing that the park is going to get bigger.", altEs: ["No noticiário anunciaram que o parque vai ficar maior."], grammar: [g.reported-speech-present, g.indeterminate-subject], vocab: [w.noticiário, w.anunciar] }
      - { es: "A repórter da emissora local declara que as queimadas diminuíram.", en: "The local station's reporter declares that the fires have decreased.", grammar: [g.reported-speech-present], vocab: [w.repórter, w.emissora, w.declarar] }
      - { es: "A revista menciona o Vale da Lua, mas não explica como chegar lá.", en: "The magazine mentions the Valley of the Moon, but doesn't explain how to get there.", grammar: [g.reported-speech-present], vocab: [w.revista, w.mencionar] }
      - { es: "A dona da pousada quer esclarecer que não é contra o turismo.", en: "The inn owner wants to make clear that she isn't against tourism.", grammar: [g.reported-speech-present], vocab: [w.esclarecer] }
      - { es: "A reportagem mostra que a imprensa local depende da publicidade dos hotéis.", en: "The report shows that the local press depends on hotel advertising.", grammar: [g.reported-speech-present], vocab: [w.reportagem, w.imprensa, w.publicidade] }
      - { es: "Minha mãe sempre fala que a mídia só mostra notícia ruim.", en: "My mum always says the media only shows bad news.", altEs: ["A minha mãe sempre diz que a mídia só mostra notícia ruim."], grammar: [g.reported-speech-present], vocab: [w.mídia] }
      - { es: "O canal diz que os assinantes podem assistir ao programa de graça.", en: "The channel says subscribers can watch the programme for free.", altEs: ["O canal diz que os assinantes podem ver o programa de graça."], grammar: [g.reported-speech-present], vocab: [w.canal, w.assinante, w.programa] }
      - { es: "A guia diz para a gente levar água e chapéu.", en: "The guide says we should bring water and a hat.", altEs: ["A guia diz que a gente leve água e chapéu.", "A guia diz para levarmos água e chapéu."], grammar: [g.reported-speech-present, g.personal-infinitive-uses], note: "Reported commands: dizer para + infinitive, or dizer que + subjunctive.", error: { wrong: "A guia diz para a gente levando água e chapéu.", explain: "A reported command is dizer para + infinitive (levar), never the gerund.", grammar: g.reported-speech-present } }
      - { es: "Bom jornalismo comunica fatos; propaganda vende uma ideia.", en: "Good journalism communicates facts; propaganda sells an idea.", grammar: [g.present-regular-ar], vocab: [w.jornalismo, w.comunicar, w.propaganda] }
      - { es: "A jornalista quer entrevistar um guia que conheça bem o parque.", en: "The journalist wants to interview a guide who knows the park well.", grammar: [g.relative-subjunctive], vocab: [w.entrevistar, w.jornalista] }
      - { es: "\"Estou com fome\", diz o Leo.", en: "\"I'm hungry,\" says Leo.", grammar: [g.reported-speech-present], transform: { instruction: "Report it: O Leo diz que…", answer: "O Leo diz que está com fome.", alt: ["O Leo fala que está com fome."], en: "Leo says he's hungry." } }
      - { es: "\"Leve um casaco\", diz a guia.", en: "\"Take a coat,\" says the guide.", grammar: [g.reported-speech-present], transform: { instruction: "Report the command with dizer para", answer: "A guia diz para você levar um casaco.", alt: ["A guia diz que você leve um casaco.", "A guia fala para você levar um casaco."] } }
    exchanges:
      - q: { es: "O que diz a previsão do tempo?", en: "What does the forecast say?" }
        a: { es: "Diz que vai fazer sol de manhã e chover à tarde.", en: "It says it'll be sunny in the morning and rain in the afternoon." }
        alt: ["Que vai chover à tarde.", "Diz que vai chover a semana toda."]
        grammar: [g.reported-speech-present]
        vocab: [w.informar]
      - q: { es: "O que o guia está falando?", en: "What's the guide saying?" }
        a: { es: "Ele diz que a gente tem que sair antes das oito.", en: "He says we have to leave before eight." }
        alt: ["Diz para a gente sair antes das oito.", "Que temos que sair cedo."]
        grammar: [g.reported-speech-present]
      - q: { es: "Você viu a manchete de hoje?", en: "Did you see today's headline?" }
        a: { es: "Vi: o jornal afirma que a entrada do parque vai ficar mais cara.", en: "I did: the paper states that the park entrance fee is going up." }
        alt: ["Vi, fala sobre o preço do parque.", "Ainda não, o que diz?"]
        grammar: [g.reported-speech-present]
        vocab: [w.manchete, w.afirmar]
      - q: { es: "Você ainda assina aquela revista de viagem?", en: "Do you still subscribe to that travel magazine?" }
        a: { es: "Assino, mas vou cancelar a assinatura: tem mais propaganda que reportagem.", en: "I do, but I'm going to cancel the subscription: it has more ads than reporting." }
        alt: ["Não, cancelei a assinatura.", "Assino, e gosto muito."]
        grammar: [g.comparatives]
        vocab: [w.assinatura, w.propaganda, w.reportagem]
      - q: { es: "A sua mãe gosta da Chapada?", en: "Does your mum like the Chapada?" }
        a: { es: "Ela diz que é o lugar mais bonito do Brasil.", en: "She says it's the most beautiful place in Brazil." }
        alt: ["Ela fala que é lindo.", "Diz que adora, mas que é muito longe."]
        grammar: [g.reported-speech-present]
    texts:
      - title: "Recado da guia"
        es: ["A Valéria mandou mensagem.", "Ela diz que o passeio de amanhã começa às sete.", "Também pede para a gente levar lanche e muita água."]
        en: ["Valéria sent a message.", "She says tomorrow's outing starts at seven.", "She also asks us to bring a snack and lots of water."]
        grammar: [g.reported-speech-present]
      - title: "Notícia na TV"
        es: ["A direção do parque anuncia que a trilha das cachoeiras abre de novo no sábado.", "O repórter comenta que a chuva estragou parte do caminho.", "Os guias informam que o passeio continua exigindo cuidado."]
        en: ["The park management announces that the waterfalls trail reopens on Saturday.", "The reporter remarks that the rain damaged part of the path.", "The guides say the hike still requires care."]
        grammar: [g.reported-speech-present]
        vocab: [w.anunciar, w.repórter, w.comentar, w.informar]
    spicy:
      - { es: "Minha avó diz que você tem cara de quem cozinha bem; eu digo que você tem cara de quem beija bem.", en: "My grandma says you look like someone who cooks well; I say you look like someone who kisses well.", altEs: ["A minha avó diz que você tem cara de quem cozinha bem; eu digo que você tem cara de quem beija bem."], grammar: [g.reported-speech-present] }
      - { es: "Você diz que só quer amizade, mas o seu olhar diz outra coisa.", en: "You say you only want friendship, but your eyes say something else.", altEs: ["Você fala que só quer amizade, mas seu olhar diz outra coisa."], grammar: [g.reported-speech-present] }
      - { es: "Ela comenta que gostou do meu chapéu; eu comento que gostei de tudo nela.", en: "She remarks that she liked my hat; I remark that I liked everything about her.", grammar: [g.reported-speech-present], vocab: [w.comentar] }
      - { es: "O jornal anuncia chuva para o fim de semana; eu anuncio um convite para ficar em casa com você.", en: "The paper forecasts rain for the weekend; I announce an invitation to stay in with you.", grammar: [g.reported-speech-present], vocab: [w.anunciar] }
      - { es: "Meu amigo diz para eu te convidar para jantar. Eu sempre ouço os meus amigos.", en: "My friend says I should invite you to dinner. I always listen to my friends.", altEs: ["Meu amigo fala para eu convidar você para jantar. Eu sempre escuto os meus amigos."], grammar: [g.reported-speech-present, g.personal-infinitive-uses] }

  - id: b1.u10.l2
    title: O policial disse que tinham encontrado a mochila
    teach: [g.reported-speech-past]
    vocab: [w.direito, w.dever.n, w.obrigação, w.liberdade, w.igualdade, w.justiça, w.juiz, w.tribunal, w.denúncia, w.denunciar, w.policial, w.acusar, w.inocente, w.prender, w.prisão, w.vítima, w.testemunha, w.investigar, w.investigação]
    tip: "With disse, contou, explicou the tenses step back: está → estava, foi → tinha ido, vai → ia, fará → faria. Hoje becomes naquele dia; amanhã, no dia seguinte."
    sentences:
      - { es: "O policial disse que tinham encontrado a minha mochila.", en: "The police officer said they had found my backpack.", altEs: ["O policial disse que tinham encontrado minha mochila.", "O policial falou que tinham achado a minha mochila."], grammar: [g.reported-speech-past, g.pluperfect], vocab: [w.policial] }
      - { es: "A vítima contou que estava dormindo quando levaram o carro.", en: "The victim said she was asleep when they took the car.", grammar: [g.reported-speech-past, g.estar-gerund-past], vocab: [w.vítima] }
      - { es: "A testemunha declarou que tinha visto dois homens perto do fogo.", en: "The witness stated that she had seen two men near the fire.", grammar: [g.reported-speech-past, g.pluperfect], vocab: [w.testemunha, w.declarar] }
      - { es: "O juiz afirmou que o rapaz era inocente.", en: "The judge stated that the young man was innocent.", altEs: ["A juíza afirmou que o rapaz era inocente."], grammar: [g.reported-speech-past], vocab: [w.juiz, w.inocente] }
      - { es: "Ela disse que ia denunciar o vizinho por causa das queimadas.", en: "She said she was going to report her neighbour because of the fires.", altEs: ["Ela falou que ia denunciar o vizinho por causa das queimadas."], grammar: [g.reported-speech-past], vocab: [w.denunciar] }
      - { es: "O jornal informou que a polícia tinha prendido o responsável pela queimada.", en: "The paper reported that the police had arrested the person responsible for the fire.", grammar: [g.reported-speech-past, g.pluperfect], vocab: [w.prender, w.informar] }
      - { es: "O advogado explicou que todo mundo tem o direito de ficar calado.", en: "The lawyer explained that everyone has the right to remain silent.", altEs: ["O advogado explicou que todos têm o direito de ficar calados."], grammar: [g.reported-speech-past], vocab: [w.direito], note: "Still true, so the present stays: tem o direito." }
      - { es: "A professora disse que liberdade e igualdade são direitos de todos.", en: "The teacher said that freedom and equality are everyone's rights.", grammar: [g.reported-speech-past], vocab: [w.liberdade, w.igualdade, w.direito] }
      - { es: "Ela me contou ontem que tinha feito uma denúncia na delegacia.", en: "She told me yesterday that she had made a report at the police station.", altEs: ["Ontem ela me contou que tinha feito uma denúncia na delegacia."], grammar: [g.reported-speech-past, g.pluperfect], vocab: [w.denúncia] }
      - { es: "O tribunal decidiu que ele tinha a obrigação de pagar pelo estrago.", en: "The court decided he had an obligation to pay for the damage.", grammar: [g.reported-speech-past], vocab: [w.tribunal, w.obrigação] }
      - { es: "O policial falou que era nosso dever avisar quando víssemos fumaça.", en: "The officer said it was our duty to report it whenever we saw smoke.", grammar: [g.reported-speech-past], vocab: [w.dever.n, w.fumaça] }
      - { es: "O homem acusado disse que não tinha feito nada e que queria justiça.", en: "The accused man said he hadn't done anything and that he wanted justice.", grammar: [g.reported-speech-past, g.pluperfect], vocab: [w.acusar, w.justiça] }
      - { es: "A polícia anunciou que ia investigar o caso e que o suspeito podia ir para a prisão.", en: "The police announced they would investigate the case and the suspect could go to prison.", grammar: [g.reported-speech-past], vocab: [w.investigar, w.prisão] }
      - { es: "Ela disse que estava com fome naquele momento.", en: "She said she was hungry at that moment.", grammar: [g.reported-speech-past], error: { wrong: "Ela disse que está com fome naquele momento.", explain: "With a past reporting verb and naquele momento, the present steps back to the imperfect: estava.", grammar: g.reported-speech-past } }
      - { es: "\"Perdi a chave\", disse ela.", en: "\"I've lost the key,\" she said.", grammar: [g.reported-speech-past], transform: { instruction: "Report it: Ela disse que…", answer: "Ela disse que tinha perdido a chave.", alt: ["Ela disse que havia perdido a chave.", "Ela falou que tinha perdido a chave."], en: "She said she had lost the key." } }
      - { es: "\"Vou ligar amanhã\", disse o policial.", en: "\"I'll call tomorrow,\" said the officer.", grammar: [g.reported-speech-past], vocab: [w.policial], transform: { instruction: "Report it, changing amanhã", answer: "O policial disse que ia ligar no dia seguinte.", alt: ["O policial disse que ligaria no dia seguinte.", "O policial falou que ia ligar no dia seguinte."] } }
    exchanges:
      - q: { es: "O que o policial disse?", en: "What did the police officer say?" }
        a: { es: "Disse que ia investigar o caso e me ligar no dia seguinte.", en: "He said he would investigate the case and call me the next day." }
        alt: ["Que ia investigar.", "Disse que ligaria no dia seguinte."]
        grammar: [g.reported-speech-past]
        vocab: [w.investigar]
      - q: { es: "A testemunha viu alguma coisa?", en: "Did the witness see anything?" }
        a: { es: "Disse que tinha visto um carro branco perto da cerca.", en: "She said she had seen a white car near the fence." }
        alt: ["Disse que não tinha visto nada.", "Viu um carro branco, segundo ela."]
        grammar: [g.reported-speech-past, g.pluperfect]
        vocab: [w.testemunha]
      - q: { es: "Por que prenderam o fazendeiro?", en: "Why did they arrest the farmer?" }
        a: { es: "A polícia disse que ele tinha começado a queimada de propósito.", en: "The police said he had started the fire on purpose." }
        alt: ["Disseram que ele tinha começado o fogo.", "Por causa da queimada."]
        grammar: [g.reported-speech-past]
        vocab: [w.prender]
      - q: { es: "O juiz já decidiu?", en: "Has the judge decided yet?" }
        a: { es: "Já. Disse que o rapaz era inocente e que podia ir para casa.", en: "Yes. He said the young man was innocent and could go home." }
        alt: ["Já, disse que ele era inocente.", "Ainda não, só no mês que vem."]
        grammar: [g.reported-speech-past]
        vocab: [w.juiz, w.inocente]
      - q: { es: "O que a advogada te explicou?", en: "What did the lawyer explain to you?" }
        a: { es: "Explicou que eu tinha o direito de pedir uma cópia do processo.", en: "She explained that I had the right to ask for a copy of the case file." }
        alt: ["Que eu tinha direito a uma cópia.", "Explicou os meus direitos."]
        grammar: [g.reported-speech-past]
        vocab: [w.direito]
    texts:
      - title: "Notícia do jornal local"
        es: ["Um fazendeiro foi preso ontem em Alto Paraíso.", "A polícia informou que ele tinha começado uma queimada perto do parque.", "Ele disse ao juiz que era inocente e que o fogo tinha começado sozinho."]
        en: ["A farmer was arrested yesterday in Alto Paraíso.", "The police reported that he had started a fire near the park.", "He told the judge he was innocent and that the fire had started on its own."]
        grammar: [g.reported-speech-past]
        vocab: [w.prender, w.juiz, w.inocente]
      - title: "O que aconteceu na cachoeira"
        es: ["Eu estava na cachoeira quando levaram a minha mochila.", "O policial disse que muita gente tinha feito a mesma denúncia.", "Prometeu que a investigação ia ser rápida."]
        en: ["I was at the waterfall when they took my backpack.", "The officer said lots of people had made the same complaint.", "He promised the investigation would be quick."]
        grammar: [g.reported-speech-past]
        vocab: [w.policial, w.denúncia, w.investigação]
    spicy:
      - { es: "Você disse que ia me ligar no dia seguinte. Já passaram três semanas.", en: "You said you'd call me the next day. It's been three weeks.", altEs: ["Você falou que ia me ligar no dia seguinte. Já passaram três semanas."], grammar: [g.reported-speech-past] }
      - { es: "Ele disse que era policial; depois admitiu que era só uma fantasia de Carnaval.", en: "He said he was a police officer; later he admitted it was just a Carnival costume.", grammar: [g.reported-speech-past], vocab: [w.policial] }
      - { es: "A testemunha disse que viu a gente de mãos dadas na cachoeira. Culpados!", en: "The witness said she saw us holding hands at the waterfall. Guilty!", altEs: ["A testemunha disse que tinha visto a gente de mãos dadas na cachoeira. Culpados!"], grammar: [g.reported-speech-past], vocab: [w.testemunha, w.culpado] }
      - { es: "Você prometeu que ia dançar comigo, e eu tenho testemunhas.", en: "You promised you'd dance with me, and I have witnesses.", grammar: [g.reported-speech-past], vocab: [w.testemunha] }
      - { es: "Ela me contou que tinha sonhado comigo; eu fingi que não fiquei feliz.", en: "She told me she had dreamed about me; I pretended I wasn't happy about it.", grammar: [g.reported-speech-past, g.pluperfect] }

  - id: b1.u10.l3
    title: Ela perguntou se eu podia apresentar
    teach: [g.reported-questions]
    vocab: [w.arquivo, w.pasta, w.site, w.navegador, w.digitar, w.teclado, w.notebook, w.impressora, w.verificar, w.específico, w.geral, w.disponível, w.útil, w.inútil, w.eficiente, w.prático, w.cobrar, w.reunir, w.telefonema, w.contato, w.comunicação, w.agendar, w.comparecer, w.palestra, w.seminário, w.apresentar, w.propor, w.ata, w.pauta, w.relatório]
    tip: "Yes/no questions are reported with se; question words stay: Perguntou se eu vinha. Quis saber onde eu morava. perguntar = ask a question; pedir = ask for something."
    sentences:
      - { es: "\"Você quer café?\", perguntou ela.", en: "\"Do you want coffee?\" she asked.", grammar: [g.reported-questions], transform: { instruction: "Report the question: Ela perguntou…", answer: "Ela perguntou se eu queria café.", alt: ["Ela me perguntou se eu queria café."], en: "She asked if I wanted coffee." } }
      - { es: "Perguntei se o notebook estava disponível para a palestra.", en: "I asked whether the laptop was available for the talk.", altEs: ["Eu perguntei se o notebook estava disponível para a palestra."], grammar: [g.reported-questions], vocab: [w.notebook, w.disponível, w.palestra], variant: "Portugal: portátil for notebook." }
      - { es: "Ele me perguntou como se digitava o ç num teclado inglês.", en: "He asked me how you type ç on an English keyboard.", altEs: ["Ele me perguntou como se digita o ç num teclado inglês."], grammar: [g.reported-questions], vocab: [w.digitar, w.teclado] }
      - { es: "A diretora quis saber quando a gente ia agendar o seminário.", en: "The director wanted to know when we were going to schedule the seminar.", altEs: ["A diretora quis saber quando nós íamos agendar o seminário."], grammar: [g.reported-questions], vocab: [w.agendar, w.seminário] }
      - { es: "Perguntaram se todo mundo tinha que comparecer à reunião.", en: "They asked whether everyone had to attend the meeting.", altEs: ["Perguntaram se todos tinham que comparecer à reunião."], grammar: [g.reported-questions, g.indeterminate-subject], vocab: [w.comparecer] }
      - { es: "Não sei se a impressora está funcionando.", en: "I don't know if the printer is working.", altEs: ["Eu não sei se a impressora está funcionando."], grammar: [g.reported-questions], vocab: [w.impressora] }
      - { es: "Pedi para ele verificar a pasta onde ficam os arquivos do projeto.", en: "I asked him to check the folder where the project files are kept.", altEs: ["Pedi que ele verificasse a pasta onde ficam os arquivos do projeto."], grammar: [g.reported-questions, g.relative-onde-cujo], vocab: [w.verificar, w.pasta, w.arquivo], note: "pedir para + infinitive = ask someone to do something." }
      - { es: "Ela perguntou qual navegador eu usava para entrar no site.", en: "She asked which browser I used to get onto the website.", grammar: [g.reported-questions], vocab: [w.navegador, w.site] }
      - { es: "Ele quis saber se a pauta da reunião já estava pronta.", en: "He wanted to know if the meeting agenda was ready yet.", grammar: [g.reported-questions], vocab: [w.pauta] }
      - { es: "O cliente perguntou quanto a gente cobrava por uma palestra.", en: "The client asked how much we charged for a talk.", altEs: ["O cliente perguntou quanto nós cobrávamos por uma palestra."], grammar: [g.reported-questions], vocab: [w.cobrar, w.palestra] }
      - { es: "Perguntei se alguém tinha feito a ata da última reunião.", en: "I asked if anyone had taken the minutes at the last meeting.", grammar: [g.reported-questions, g.pluperfect], vocab: [w.ata] }
      - { es: "A professora quis saber se a informação era específica ou geral.", en: "The teacher wanted to know if the information was specific or general.", grammar: [g.reported-questions], vocab: [w.específico, w.geral] }
      - { es: "Ele perguntou se a minha proposta era prática e eficiente ou só bonita no papel.", en: "He asked if my proposal was practical and efficient or just pretty on paper.", grammar: [g.reported-questions], vocab: [w.prático, w.eficiente, w.propor] }
      - { es: "Ela quis saber por que eu achava o sistema novo inútil.", en: "She wanted to know why I thought the new system was useless.", grammar: [g.reported-questions], vocab: [w.inútil], error: { wrong: "Ela quis saber por que achava eu o sistema novo inútil?", explain: "Reported questions keep normal word order (eu achava) and have no question mark.", grammar: g.reported-questions } }
      - { es: "Perguntei quanto custava a palestra.", en: "I asked how much the talk cost.", grammar: [g.reported-questions], vocab: [w.palestra], error: { wrong: "Pedi quanto custava a palestra.", explain: "'Ask a question' is perguntar; pedir means 'ask for' (pedi a conta).", grammar: g.reported-questions } }
      - { es: "\"Onde fica o seminário?\", perguntou o cliente.", en: "\"Where is the seminar?\" asked the client.", grammar: [g.reported-questions], vocab: [w.seminário], transform: { instruction: "Report the question: O cliente perguntou…", answer: "O cliente perguntou onde ficava o seminário.", alt: ["O cliente quis saber onde ficava o seminário.", "O cliente perguntou onde fica o seminário."] } }
    exchanges:
      - q: { es: "O que o gerente queria?", en: "What did the manager want?" }
        a: { es: "Quis saber se o relatório já estava pronto.", en: "He wanted to know if the report was ready yet." }
        alt: ["Perguntou pelo relatório.", "Queria saber se o relatório estava pronto."]
        grammar: [g.reported-questions]
        vocab: [w.relatório]
      - q: { es: "Você perguntou o preço da palestra?", en: "Did you ask the price of the talk?" }
        a: { es: "Perguntei, e ela disse que cobrava quinhentos reais.", en: "I did, and she said she charged five hundred reais." }
        alt: ["Perguntei, sim: quinhentos reais.", "Ainda não, vou perguntar amanhã."]
        grammar: [g.reported-questions, g.reported-speech-past]
        vocab: [w.cobrar, w.palestra]
      - q: { es: "Por que o Rodrigo te deu um telefonema?", en: "Why did Rodrigo give you a call?" }
        a: { es: "Queria saber se a gente tinha um notebook disponível para amanhã.", en: "He wanted to know if we had a laptop available for tomorrow." }
        alt: ["Perguntou se tinha notebook disponível.", "Para pedir o meu contato no seminário."]
        grammar: [g.reported-questions]
        vocab: [w.telefonema, w.notebook, w.disponível]
      - q: { es: "Vocês já agendaram a reunião?", en: "Have you scheduled the meeting yet?" }
        a: { es: "Ainda não; o diretor perguntou se dava para reunir todo mundo na sexta.", en: "Not yet; the director asked if it was possible to get everyone together on Friday." }
        alt: ["Ainda não.", "Já, para sexta às dez."]
        grammar: [g.reported-questions]
        vocab: [w.agendar, w.reunir]
      - q: { es: "Esse aplicativo novo é útil?", en: "Is this new app useful?" }
        a: { es: "Muito: é prático, e a comunicação com os clientes ficou bem mais fácil.", en: "Very: it's practical, and communication with clients has got much easier." }
        alt: ["É útil, sim.", "Não, é completamente inútil."]
        grammar: [g.ficar-change-of-state]
        vocab: [w.útil, w.prático, w.comunicação]
    texts:
      - title: "Recado na mesa"
        es: ["Rodrigo, a Valéria ligou.", "Perguntou se você podia apresentar a proposta no seminário de sexta.", "Também quis saber se você tinha o contato do fornecedor."]
        en: ["Rodrigo, Valéria called.", "She asked if you could present the proposal at Friday's seminar.", "She also wanted to know if you had the supplier's contact details."]
        grammar: [g.reported-questions]
        vocab: [w.apresentar, w.seminário, w.contato]
      - title: "Mensagem para a turma"
        es: ["O professor perguntou quem queria propor um tema para a palestra.", "Eu disse que podia falar sobre o cerrado.", "Ele quis saber quanto tempo eu precisava, e eu respondi: vinte minutos."]
        en: ["The teacher asked who wanted to suggest a topic for the talk.", "I said I could talk about the cerrado.", "He wanted to know how much time I needed, and I answered: twenty minutes."]
        grammar: [g.reported-questions, g.reported-speech-past]
        vocab: [w.propor, w.palestra]
    spicy:
      - { es: "Ela perguntou se eu era sempre tão engraçado ou se era só com ela.", en: "She asked if I was always this funny or just with her.", altEs: ["Ele perguntou se eu era sempre tão engraçada ou se era só com ele."], grammar: [g.reported-questions] }
      - { es: "Ele quis saber o meu signo; eu quis saber o telefone dele.", en: "He wanted to know my star sign; I wanted to know his phone number.", grammar: [g.reported-questions] }
      - { es: "Minha mãe perguntou quando eu ia apresentar você para a família.", en: "My mum asked when I was going to introduce you to the family.", altEs: ["A minha mãe perguntou quando eu ia te apresentar para a família."], grammar: [g.reported-questions], vocab: [w.apresentar] }
      - { es: "Perguntei se você estava disponível no sábado, e você respondeu com um coração.", en: "I asked if you were free on Saturday, and you replied with a heart.", grammar: [g.reported-questions], vocab: [w.disponível] }
      - { es: "Você me perguntou se eu tinha namorada; eu perguntei se a vaga estava aberta para você.", en: "You asked me if I had a girlfriend; I asked if you were applying for the position.", grammar: [g.reported-questions] }

  - id: b1.u10.l4
    title: Prezada Senhora, escrevo para…
    teach: [g.formal-email]
    vocab: [w.solicitar, w.aguardar, w.anexo, w.destinatário, w.remetente, w.prezado, w.atenciosamente, w.cordialmente, w.solicitação, w.informação, w.retorno, w.disposição, w.encaminhar, w.cópia, w.cargo, w.departamento, w.setor, w.gerente, w.diretor, w.cliente, w.fornecedor, w.contrato, w.proposta, w.entrega, w.pagamento, w.recibo, w.comprovante, w.boleto, w.urgente, w.pendente, w.incluir, w.excluir, w.disponibilidade]
    tip: "Open with Prezado / Prezada + title, state your purpose (Escrevo para…, Gostaria de…), attach (Segue em anexo…) and close with Fico no aguardo and Atenciosamente."
    sentences:
      - { es: "Prezada Senhora Valéria, escrevo para solicitar informações sobre o seminário.", en: "Dear Ms Valéria, I am writing to request information about the seminar.", altEs: ["Prezada Senhora Valéria, escrevo para pedir informações sobre o seminário."], grammar: [g.formal-email], vocab: [w.prezado, w.solicitar, w.informação] }
      - { es: "Segue em anexo o comprovante de pagamento.", en: "Please find attached the proof of payment.", altEs: ["Segue anexo o comprovante de pagamento."], grammar: [g.formal-email], vocab: [w.anexo, w.comprovante, w.pagamento] }
      - { es: "Seguem em anexo o contrato e a proposta.", en: "Please find attached the contract and the proposal.", altEs: ["Seguem anexos o contrato e a proposta."], grammar: [g.formal-email], vocab: [w.contrato, w.proposta], error: { wrong: "Segue em anexo o contrato e a proposta.", explain: "Two things are attached, so the verb is plural: seguem em anexo.", grammar: g.formal-email } }
      - { es: "Em resposta ao seu e-mail, informo que a entrega será feita na segunda-feira.", en: "In reply to your email, I can confirm that the delivery will be made on Monday.", grammar: [g.formal-email, g.passive-ser], vocab: [w.entrega, w.informar] }
      - { es: "Fico no aguardo do seu retorno.", en: "I look forward to hearing from you.", altEs: ["Fico no aguardo de seu retorno.", "Aguardo o seu retorno."], grammar: [g.formal-email], vocab: [w.retorno, w.aguardar] }
      - { es: "Qualquer dúvida, estou à disposição.", en: "If you have any questions, please let me know.", altEs: ["Qualquer dúvida, fico à disposição."], grammar: [g.formal-email], vocab: [w.disposição] }
      - { es: "Atenciosamente, Valéria Souza, gerente do setor de reservas.", en: "Yours sincerely, Valéria Souza, bookings manager.", altEs: ["Cordialmente, Valéria Souza, gerente do setor de reservas."], grammar: [g.formal-email], vocab: [w.atenciosamente, w.gerente, w.setor] }
      - { es: "Poderia me enviar o boleto até sexta-feira?", en: "Could you send me the payment slip by Friday?", altEs: ["O senhor poderia me enviar o boleto até sexta-feira?", "A senhora poderia me enviar o boleto até sexta-feira?"], grammar: [g.formal-email, g.polite-requests], vocab: [w.boleto], note: "A boleto is a printed or digital payment slip, paid at a bank or by app." }
      - { es: "Encaminho abaixo a mensagem do cliente, com cópia para o departamento financeiro.", en: "I'm forwarding the client's message below, copying in the finance department.", grammar: [g.formal-email], vocab: [w.encaminhar, w.cliente, w.cópia, w.departamento] }
      - { es: "O pagamento ainda está pendente; o recibo será enviado depois.", en: "The payment is still pending; the receipt will be sent afterwards.", grammar: [g.formal-email, g.passive-ser], vocab: [w.pendente, w.recibo] }
      - { es: "Peço que inclua o meu nome na lista e exclua o do meu colega.", en: "Please add my name to the list and remove my colleague's.", altEs: ["Peço que inclua meu nome na lista e exclua o do meu colega."], grammar: [g.formal-email, g.indirect-commands], vocab: [w.incluir, w.excluir] }
      - { es: "O destinatário não recebeu o e-mail; verifique o endereço do remetente.", en: "The recipient didn't get the email; check the sender's address.", grammar: [g.imperative-formal], vocab: [w.destinatário, w.remetente, w.verificar] }
      - { es: "Agradeço a solicitação e confirmo a disponibilidade da diretora para o dia 10.", en: "Thank you for the request; I can confirm the director is available on the 10th.", grammar: [g.formal-email], vocab: [w.solicitação, w.disponibilidade, w.diretor] }
      - { es: "Prezado Senhor Lima, escrevo em nome da Pousada Veredas.", en: "Dear Mr Lima, I am writing on behalf of the Pousada Veredas.", grammar: [g.formal-email], vocab: [w.prezado], error: { wrong: "Querido Senhor Lima, escrevo em nome da Pousada Veredas.", explain: "Querido is affectionate; a business email opens with Prezado.", grammar: g.formal-email } }
      - { es: "Me manda o boleto?", en: "Send me the payment slip?", grammar: [g.formal-email], vocab: [w.boleto], transform: { instruction: "Make it formal (Poderia…)", answer: "Poderia me enviar o boleto?", alt: ["O senhor poderia me enviar o boleto?", "A senhora poderia me enviar o boleto?", "Poderia enviar-me o boleto?"] } }
      - { es: "Segue em anexo o recibo.", en: "Please find the receipt attached.", grammar: [g.formal-email], vocab: [w.recibo, w.anexo], transform: { instruction: "Make it plural (os recibos)", answer: "Seguem em anexo os recibos.", alt: ["Seguem anexos os recibos."] } }
    exchanges:
      - q: { es: "Como eu começo um e-mail para alguém que não conheço?", en: "How do I start an email to someone I don't know?" }
        a: { es: "Com \"Prezado Senhor\" ou \"Prezada Senhora\", seguido do nome.", en: "With \"Dear Sir\" or \"Dear Madam\", followed by the name." }
        alt: ["Com Prezado ou Prezada.", "Escreva Prezado Senhor e o sobrenome."]
        grammar: [g.formal-email]
        vocab: [w.prezado]
      - q: { es: "E como eu termino?", en: "And how do I finish?" }
        a: { es: "Com \"Atenciosamente\" ou \"Cordialmente\", e o seu nome e cargo.", en: "With \"Yours sincerely\" or \"Kind regards\", and your name and position." }
        alt: ["Com Atenciosamente.", "Cordialmente, e a sua assinatura."]
        grammar: [g.formal-email]
        vocab: [w.atenciosamente, w.cordialmente, w.cargo]
      - q: { es: "Você já mandou o comprovante?", en: "Have you sent the proof of payment yet?" }
        a: { es: "Já, seguiu em anexo no e-mail de ontem.", en: "Yes, it went as an attachment in yesterday's email." }
        alt: ["Já mandei, sim.", "Ainda não, o pagamento está pendente."]
        grammar: [g.formal-email]
        vocab: [w.comprovante, w.anexo]
      - q: { es: "O fornecedor respondeu?", en: "Has the supplier replied?" }
        a: { es: "Ainda não; estou aguardando o retorno dele.", en: "Not yet; I'm waiting to hear back from him." }
        alt: ["Ainda não, fico no aguardo.", "Respondeu, a entrega é na segunda."]
        grammar: [g.formal-email]
        vocab: [w.fornecedor, w.aguardar, w.retorno]
      - q: { es: "Pode encaminhar o contrato para o gerente?", en: "Can you forward the contract to the manager?" }
        a: { es: "Posso, com cópia para o departamento de vendas.", en: "Yes, copying in the sales department." }
        alt: ["Posso, sim.", "Já encaminhei hoje de manhã."]
        grammar: [g.poder-present]
        vocab: [w.encaminhar, w.contrato, w.gerente]
    texts:
      - title: "E-mail para a pousada"
        es: ["Prezada Senhora Valéria,", "Escrevo para solicitar uma reserva para quatro pessoas, de 10 a 14 de julho.", "Gostaria de saber se o café da manhã está incluído e se vocês aceitam cachorros.", "Fico no aguardo. Atenciosamente, Rodrigo Lima."]
        en: ["Dear Ms Valéria,", "I am writing to request a booking for four people, from 10 to 14 July.", "I would like to know whether breakfast is included and whether you accept dogs.", "I look forward to hearing from you. Yours sincerely, Rodrigo Lima."]
        grammar: [g.formal-email]
        vocab: [w.prezado, w.solicitar, w.incluir, w.atenciosamente]
      - title: "Resposta da pousada"
        es: ["Prezado Senhor Rodrigo,", "Agradecemos o contato e confirmamos a disponibilidade para as datas solicitadas.", "Segue em anexo o boleto para o pagamento de metade do valor.", "Cordialmente, Valéria Souza, gerente."]
        en: ["Dear Mr Rodrigo,", "Thank you for getting in touch; we can confirm availability for the requested dates.", "Please find attached the payment slip for half of the amount.", "Kind regards, Valéria Souza, manager."]
        grammar: [g.formal-email]
        vocab: [w.disponibilidade, w.boleto, w.cordialmente]
    spicy:
      - { es: "Prezado senhor, escrevo para solicitar um jantar com o senhor no sábado.", en: "Dear sir, I am writing to request a dinner with you on Saturday.", grammar: [g.formal-email], vocab: [w.prezado, w.solicitar] }
      - { es: "Segue em anexo o meu coração; favor confirmar se chegou inteiro.", en: "Please find my heart attached; kindly confirm it arrived in one piece.", altEs: ["Segue em anexo meu coração; favor confirmar se chegou inteiro."], grammar: [g.formal-email], vocab: [w.anexo] }
      - { es: "Fico no aguardo do seu retorno, de preferência com um sim.", en: "I look forward to your reply, preferably a yes.", grammar: [g.formal-email], vocab: [w.retorno] }
      - { es: "Assunto: urgente. Mensagem: estou com saudade.", en: "Subject: urgent. Message: I miss you.", grammar: [g.formal-email], vocab: [w.urgente] }
      - { es: "Seu pedido de beijo está pendente; aguarde aprovação pessoal.", en: "Your kiss request is pending; please await personal approval.", grammar: [g.formal-email], vocab: [w.pendente] }
dialogues:
  - id: b1.u10.d1
    title: Recados na pousada
    context: Rodrigo comes back to the inn in São Jorge, at the gate of the Chapada dos Veadeiros, and Valéria, the manager, passes on the messages that arrived while he was out.
    lines:
      - { speaker: Valéria, es: "Rodrigo, enquanto você estava fora, chegaram vários recados.", en: "Rodrigo, while you were out, several messages came in." }
      - { speaker: Rodrigo, es: "Ih. Quem ligou?", en: "Uh-oh. Who called?" }
      - { speaker: Valéria, es: "O senhor Paulo, do grupo de São Paulo. Ele disse que viria na sexta, não na quinta.", en: "Mr Paulo, from the São Paulo group. He said he'd be coming on Friday, not Thursday." }
      - { speaker: Rodrigo, es: "Ele explicou por quê?", en: "Did he explain why?" }
      - { speaker: Valéria, es: "Disse que tinha uma reunião urgente e que não podia sair antes.", en: "He said he had an urgent meeting and couldn't leave earlier." }
      - { speaker: Rodrigo, es: "Tudo bem. E o fornecedor do café?", en: "That's fine. And the coffee supplier?" }
      - { speaker: Valéria, es: "Perguntou se a gente já tinha pago o boleto. Eu disse que o pagamento estava pendente.", en: "He asked if we had paid the payment slip yet. I said the payment was pending." }
      - { speaker: Rodrigo, es: "Vou pagar hoje e mandar o comprovante por e-mail.", en: "I'll pay today and send the proof of payment by email." }
      - { speaker: Valéria, es: "Ótimo. Ah, e uma jornalista quer saber se pode entrevistar você sobre as queimadas.", en: "Great. Oh, and a journalist wants to know if she can interview you about the fires." }
      - { speaker: Rodrigo, es: "Eu? Diz para ela que eu ligo amanhã de manhã.", en: "Me? Tell her I'll call tomorrow morning." }
      - { speaker: Valéria, es: "Já disse. Ela pediu para você levar fotos do parque.", en: "I already did. She asked you to bring photos of the park." }
    questions:
      - { q: "Quando o senhor Paulo vai chegar?", options: ["Na quinta", "Na sexta", "No sábado"], answer: 1, explain: "Ele disse que viria na sexta, não na quinta." }
      - { q: "Por que ele não pode sair antes?", options: ["Porque tem uma reunião urgente", "Porque está doente", "Porque perdeu o voo"], answer: 0, explain: "Disse que tinha uma reunião urgente." }
      - { q: "O que o fornecedor perguntou?", options: ["Se a pousada queria mais café", "Se o boleto já tinha sido pago", "Se podia fazer a entrega na sexta"], answer: 1, explain: "Perguntou se a gente já tinha pago o boleto." }
      - { q: "O que a jornalista pediu?", options: ["Para o Rodrigo levar fotos do parque", "Para o Rodrigo escrever um relatório", "Para a Valéria dar uma entrevista"], answer: 0, explain: "Ela pediu para você levar fotos do parque." }
