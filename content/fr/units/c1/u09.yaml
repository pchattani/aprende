id: c1.u09
title: "Bonifacio, bon, ben, du coup…"
lessons:
  - id: c1.u09.l1
    title: Bon, ben, du coup…
    teach: [g.discourse-markers]
    tip: "Little words organise spoken French: bon (right, moving on), ben (well), du coup (so), en fait (actually), quoi (you know, at the end), bref (anyway), tiens (here / well, well), hein (eh?). A few make you sound natural; too many du coup and genre make you sound fifteen. Keep them out of formal writing."
    vocab: [w.du-coup, w.bon.interj, w.genre, w.en-fait, w.bah, w.hein, w.tiens, w.dis-donc, w.voilà.interj, w.ah-bon, w.ouf, w.aïe, w.mince.interj, w.chut, w.c-est-pas-grave, w.t-inquiète, w.carrément, w.n-est-ce-pas, w.remarque, w.cela-dit, w.à-la-limite, w.limite, w.pour-ainsi-dire, w.comment-dire, w.disons]
    sentences:
      - { es: "Bon, ben, on va voir les falaises ou pas ?", en: "Right, well, are we going to see the cliffs or not?", altEs: ["Bon, on va voir les falaises ou pas ?", "Bon ben, on va voir les falaises, oui ou non ?"], grammar: [g.discourse-markers, g.futur-proche], vocab: [w.bon.interj, w.falaise] }
      - { es: "Le bateau était complet ; du coup, on a pris celui de midi.", en: "The boat was full, so we took the midday one.", altEs: ["Le bateau était complet, du coup on a pris celui de midi.", "Le bateau était complet, donc on a pris celui de midi."], grammar: [g.discourse-markers, g.demonstrative-pronouns], vocab: [w.du-coup], transform: { instruction: "Rewrite it for a formal written report (no du coup)", answer: "Le bateau étant complet, nous avons pris celui de midi.", alt: ["Le bateau était complet ; par conséquent, nous avons pris celui de midi.", "Le bateau était complet ; nous avons donc pris celui de midi."], en: "As the boat was full, we took the midday one." } }
      - { es: "Tu crois que je connais l'île ? En fait, je ne suis jamais venu en Corse.", en: "You think I know the island? Actually, I've never been to Corsica.", altEs: ["Tu crois que je connais l'île ? En fait, je ne suis jamais venue en Corse.", "Tu penses que je connais l'île ? En fait, je ne suis jamais venu en Corse."], grammar: [g.discourse-markers], vocab: [w.en-fait], error: { wrong: "Tu crois que je connais l'île ? En effet, je ne suis jamais venu en Corse.", explain: "To contradict what someone assumes, say en fait (actually); en effet means 'indeed' and would confirm it.", grammar: g.discourse-markers }, transform: { instruction: "Say it as a woman", answer: "Tu crois que je connais l'île ? En fait, je ne suis jamais venue en Corse.", alt: ["Tu penses que je connais l'île ? En fait, je ne suis jamais venue en Corse."], en: "You think I know the island? Actually, I've never been to Corsica." } }
      - { es: "C'était une ville incroyable, au bord du vide, quoi.", en: "It was an incredible town, right on the edge, you know.", altEs: ["C'était une ville incroyable, perchée au bord du vide, quoi."], grammar: [g.discourse-markers], vocab: [w.perché] }
      - { es: "Tiens, voilà ton café ; et tiens, regarde qui arrive !", en: "Here's your coffee; and hey, look who's coming!", altEs: ["Tiens, voilà ton café. Et tiens, regarde qui arrive !"], grammar: [g.discourse-markers], vocab: [w.tiens, w.voilà.interj] }
      - { es: "Dis donc, c'est beau, Bonifacio vu de la mer !", en: "Wow, Bonifacio is beautiful seen from the sea!", altEs: ["Eh ben dis donc, c'est beau, Bonifacio vu de la mer !"], grammar: [g.discourse-markers, g.dislocation], vocab: [w.dis-donc] }
      - { es: "C'est beau, hein ? Je t'avais dit que ça valait le détour.", en: "It's beautiful, isn't it? I told you it was worth the detour.", altEs: ["C'est beau, n'est-ce pas ? Je t'avais dit que ça valait le détour."], grammar: [g.discourse-markers, g.plus-que-parfait], vocab: [w.hein, w.n-est-ce-pas] }
      - { es: "Bah, c'est pas grave, on reviendra demain.", en: "Oh well, never mind, we'll come back tomorrow.", altEs: ["Bah, ce n'est pas grave, on reviendra demain.", "Bof, c'est pas grave, on reviendra demain."], grammar: [g.discourse-markers, g.spoken-negation], vocab: [w.bah, w.c-est-pas-grave] }
      - { es: "T'inquiète, je connais le chemin : on descend l'escalier et voilà.", en: "Don't worry, I know the way: we go down the stairs and that's it.", altEs: ["Ne t'inquiète pas, je connais le chemin : on descend l'escalier et voilà."], grammar: [g.discourse-markers, g.spoken-negation], vocab: [w.t-inquiète, w.voilà.interj] }
      - { es: "Il était genre trop content de son plongeon.", en: "He was, like, super pleased with his dive.", altEs: ["Il était genre super content de son plongeon."], grammar: [g.discourse-markers, g.register-levels], vocab: [w.genre], note: "Genre as a filler is very informal and young; avoid it with people you don't know." }
      - { es: "Remarque, la traversée n'a duré qu'une heure ; cela dit, j'ai été malade tout le long.", en: "Mind you, the crossing only took an hour; that said, I was sick the whole way.", altEs: ["Remarque, la traversée n'a duré qu'une heure. Cela dit, j'ai été malade tout le long."], grammar: [g.discourse-markers], vocab: [w.remarque, w.cela-dit, w.traversée] }
      - { es: "On pourrait dormir à la belle étoile ; à la limite, sur la plage.", en: "We could sleep under the stars; at a pinch, on the beach.", altEs: ["On pourrait dormir à la belle étoile, à la limite sur la plage."], grammar: [g.discourse-markers, g.conditional-politeness], vocab: [w.à-la-limite] }
      - { es: "Ce restaurant est carrément hors de prix ; c'est limite du vol.", en: "This restaurant is downright overpriced; it's bordering on robbery.", altEs: ["Ce restaurant est carrément hors de prix, c'est limite du vol."], grammar: [g.discourse-markers, g.register-levels], vocab: [w.carrément, w.limite] }
      - { es: "La ville est, pour ainsi dire, suspendue au-dessus de la mer.", en: "The town is, so to speak, hanging above the sea.", altEs: ["La ville est pour ainsi dire suspendue au-dessus de la mer."], grammar: [g.discourse-markers], vocab: [w.pour-ainsi-dire] }
      - { es: "Il est… comment dire… disons, un peu original.", en: "He's… how can I put it… let's say a bit eccentric.", altEs: ["Il est, comment dire, disons un peu original."], grammar: [g.discourse-markers], vocab: [w.comment-dire, w.disons] }
      - { es: "Aïe ! Mince, je me suis cogné la tête contre la porte de la citadelle.", en: "Ouch! Blast, I've banged my head on the citadel door.", altEs: ["Aïe ! Zut, je me suis cogné la tête contre la porte de la citadelle."], grammar: [g.discourse-markers, g.pronominal-passe-compose], vocab: [w.aïe, w.mince.interj, w.citadelle] }
    exchanges:
      - q: { es: "Le dernier bateau pour les grottes est parti.", en: "The last boat to the caves has left." }
        a: { es: "Ah bon ? Bon, ben, du coup, on va se baigner.", en: "Really? Right, well, in that case we'll go for a swim." }
        alt: ["Mince ! Bon, c'est pas grave, on ira demain.", "Ah bon ? Bah, tant pis."]
        grammar: [g.discourse-markers]
        vocab: [w.ah-bon, w.du-coup]
      - q: { es: "Tu as trouvé la clé de la location ?", en: "Did you find the key to the rental?" }
        a: { es: "Ouf, oui ! Elle était dans mon sac, en fait.", en: "Phew, yes! It was in my bag, actually." }
        alt: ["Ouf, oui, elle était sous le tapis.", "Non… mince, on fait comment ?"]
        grammar: [g.discourse-markers]
        vocab: [w.ouf, w.en-fait]
      - q: { es: "Alors, c'était comment, la plongée ?", en: "So, how was the dive?" }
        a: { es: "Génial ! On a vu des mérous énormes, genre un mètre de long.", en: "Brilliant! We saw huge groupers, like a metre long." }
        alt: ["Carrément génial, quoi.", "Bof, l'eau était trouble."]
        grammar: [g.discourse-markers]
        vocab: [w.genre, w.carrément]
      - q: { es: "Chut ! Le bébé dort.", en: "Shh! The baby's asleep." }
        a: { es: "Pardon… Bon, je parle plus bas, promis.", en: "Sorry… OK, I'll speak more quietly, promise." }
        alt: ["Oups, désolé.", "D'accord, je chuchote."]
        grammar: [g.discourse-markers]
        vocab: [w.chut, w.bon.interj]
      - q: { es: "Je suis vraiment désolé, j'ai cassé ton verre.", en: "I'm really sorry, I broke your glass." }
        a: { es: "T'inquiète, c'est pas grave ; il venait du supermarché.", en: "Don't worry, it doesn't matter; it came from the supermarket." }
        alt: ["C'est pas grave, vraiment.", "Bah, ce n'était qu'un verre."]
        grammar: [g.discourse-markers]
        vocab: [w.t-inquiète, w.c-est-pas-grave]
    texts:
      - title: "Message vocal de Julie"
        es: ["Bon, ben, je suis arrivée à Bonifacio.", "En fait, le bateau avait une heure de retard, du coup j'ai raté le bus.", "Bref, je suis à la citadelle, rappelle-moi, hein !"]
        en: ["Right, well, I've arrived in Bonifacio.", "Actually the boat was an hour late, so I missed the bus.", "Anyway, I'm at the citadel, call me back, OK?"]
        grammar: [g.discourse-markers]
        vocab: [w.bon.interj, w.en-fait, w.du-coup, w.hein]
      - title: "Commentaire sur un site de voyage"
        es: ["Vue magnifique, pour ainsi dire à couper le souffle.", "Cela dit, les prix sont carrément élevés en août.", "Remarque, en mai, c'est beaucoup plus calme."]
        en: ["Magnificent view, breathtaking so to speak.", "That said, prices are downright high in August.", "Mind you, in May it's much quieter."]
        grammar: [g.discourse-markers]
        vocab: [w.pour-ainsi-dire, w.cela-dit, w.carrément, w.remarque]
    spicy:
      - { es: "Bon, ben, du coup, on s'embrasse ou on continue à parler de la météo ?", en: "Right, well, so, are we kissing or do we keep talking about the weather?", altEs: ["Bon ben, du coup, on s'embrasse ou on continue de parler de la météo ?"], grammar: [g.discourse-markers], vocab: [w.bon.interj, w.du-coup] }
      - { es: "En fait, je ne suis pas venu pour les falaises, je suis venu pour toi.", en: "Actually, I didn't come for the cliffs, I came for you.", altEs: ["En fait, je ne suis pas venue pour les falaises, je suis venue pour toi."], grammar: [g.discourse-markers], vocab: [w.en-fait, w.falaise] }
      - { es: "Dis donc, tu as bronzé ! Ça te va carrément bien.", en: "Wow, you've got a tan! It really suits you.", altEs: ["Dis donc, tu as bronzé ! Ça te va vraiment bien."], grammar: [g.discourse-markers], vocab: [w.dis-donc, w.carrément] }
      - { es: "Tiens, prends ma veste ; et non, ce n'est pas une excuse pour me tenir la main.", en: "Here, take my jacket; and no, it's not an excuse to hold my hand.", altEs: ["Tiens, prends ma veste. Et non, ce n'est pas une excuse pour me tenir la main."], grammar: [g.discourse-markers], vocab: [w.tiens] }
      - { es: "Tu danses bien, hein… enfin, disons que tu marches en rythme.", en: "You dance well, eh… well, let's say you walk in time.", altEs: ["Tu danses bien, hein ! Enfin, disons que tu marches en rythme."], grammar: [g.discourse-markers], vocab: [w.hein, w.disons] }
  - id: c1.u09.l2
    title: Pas mal du tout !
    teach: [g.litotes-euphemism]
    tip: "French loves saying less to mean more. Ce n'est pas mal = it's good; ce n'est pas donné = it's expensive; je ne dis pas non = yes please; il n'est pas très doué = he's hopeless. Euphemisms soften: il nous a quittés (he died), les personnes âgées (old people)."
    vocab: [w.litote, w.euphémisme, w.ce-n-est-pas-terrible, w.éteint, w.doué, w.myrte, w.maquis, w.châtaigne, w.châtaignier, w.surplomber, w.perché, w.détroit, w.bouches, w.vendetta]
    sentences:
      - { es: "La vue depuis la citadelle ? Pas mal du tout !", en: "The view from the citadel? Absolutely stunning!", altEs: ["La vue depuis la citadelle ? Pas mal, vraiment !"], altEn: ["The view from the citadel? Not bad at all!"], grammar: [g.litotes-euphemism], vocab: [w.citadelle], note: "Pas mal du tout is high praise, not lukewarm." }
      - { es: "Un dîner sur le port, ce n'est pas donné.", en: "Dinner on the harbour isn't cheap.", altEs: ["Un dîner sur le port, c'est pas donné."], grammar: [g.litotes-euphemism], vocab: [w.port], transform: { instruction: "Say it directly, without litotes", answer: "Un dîner sur le port, c'est cher.", alt: ["Un dîner sur le port, ça coûte cher.", "Un dîner sur le port, c'est très cher."], en: "Dinner on the harbour is expensive." } }
      - { es: "Un petit verre de myrte ? Je ne dis pas non.", en: "A little glass of myrtle liqueur? Don't mind if I do.", altEs: ["Un petit verre de liqueur de myrte ? Je ne dis pas non."], grammar: [g.litotes-euphemism], vocab: [w.myrte], error: { wrong: "Un petit verre de myrte ? Je ne dis pas oui.", explain: "The fixed litotes is je ne dis pas non (= yes, gladly); je ne dis pas oui would not mean acceptance.", grammar: g.litotes-euphemism } }
      - { es: "Son grand-père s'est éteint l'an dernier, dans son village du maquis.", en: "His grandfather passed away last year, in his village in the maquis.", altEs: ["Son grand-père nous a quittés l'an dernier, dans son village du maquis."], grammar: [g.litotes-euphemism], vocab: [w.éteint, w.maquis] }
      - { es: "Ton idée de partir à l'aube, ce n'est pas bête.", en: "Your idea of leaving at dawn is quite clever.", altEs: ["Ton idée de partir à l'aube n'est pas bête.", "C'est pas bête, ton idée de partir à l'aube."], grammar: [g.litotes-euphemism], vocab: [w.aube] }
      - { es: "Le nouveau guide n'est pas très doué : il s'est perdu dans la vieille ville.", en: "The new guide is hopeless: he got lost in the old town.", altEs: ["Le nouveau guide n'est pas très doué, il s'est perdu dans la vieille ville."], grammar: [g.litotes-euphemism], vocab: [w.doué], transform: { instruction: "Say it bluntly, without litotes", answer: "Le nouveau guide est nul : il s'est perdu dans la vieille ville.", alt: ["Le nouveau guide est mauvais : il s'est perdu dans la vieille ville.", "Le nouveau guide est incompétent : il s'est perdu dans la vieille ville."], en: "The new guide is useless: he got lost in the old town." } }
      - { es: "Le vin de la maison ? Ce n'est pas terrible.", en: "The house wine? It's not great.", altEs: ["Le vin de la maison ? C'est pas terrible."], altEn: ["The house wine? It's pretty poor."], grammar: [g.litotes-euphemism, g.spoken-negation], vocab: [w.ce-n-est-pas-terrible] }
      - { es: "Il fait un temps magnifique, dit-il, sous une pluie battante.", en: "'Lovely weather,' he says, in pouring rain.", altEs: ["« Il fait un temps magnifique », dit-il sous une pluie battante."], grammar: [g.litotes-euphemism], vocab: [w.pluie], note: "Antiphrasis: saying the opposite of what you mean, ironically." }
      - { es: "La ville est perchée sur des falaises de calcaire blanc qui surplombent la mer.", en: "The town is perched on white limestone cliffs that overhang the sea.", altEs: ["Perchée sur des falaises de calcaire blanc, la ville surplombe la mer."], grammar: [g.relative-qui-que], vocab: [w.perché, w.surplomber, w.calcaire] }
      - { es: "Par beau temps, on aperçoit la Sardaigne de l'autre côté du détroit.", en: "On a clear day you can see Sardinia on the other side of the strait.", altEs: ["Par temps clair, on aperçoit la Sardaigne de l'autre côté du détroit."], grammar: [g.on-nous], vocab: [w.détroit] }
      - { es: "Les Bouches de Bonifacio ne font qu'une douzaine de kilomètres de large.", en: "The Strait of Bonifacio is only about a dozen kilometres wide.", altEs: ["Les Bouches de Bonifacio mesurent seulement une douzaine de kilomètres de large."], grammar: [g.ne-litteraire], vocab: [w.bouches] }
      - { es: "On dit « une vendetta » ; les Corses préfèrent souvent ne pas en parler du tout.", en: "People say 'a vendetta'; Corsicans often prefer not to talk about it at all.", altEs: ["On parle de vendetta, mais les Corses préfèrent souvent ne pas en parler du tout."], grammar: [g.pronoun-en, g.infinitive-clauses], vocab: [w.vendetta] }
      - { es: "Autrefois, la farine de châtaigne remplaçait le blé dans les villages de montagne.", en: "In the past, chestnut flour replaced wheat in mountain villages.", altEs: ["Jadis, la farine de châtaigne remplaçait le blé dans les villages de montagne."], grammar: [g.imparfait-uses], vocab: [w.châtaigne, w.farine] }
      - { es: "On appelait le châtaignier « l'arbre à pain » en Corse.", en: "In Corsica the chestnut tree was called 'the bread tree'.", altEs: ["En Corse, on appelait le châtaignier « l'arbre à pain »."], grammar: [g.imparfait-uses], vocab: [w.châtaignier] }
      - { es: "« Les personnes âgées » est un euphémisme pour dire « les vieux ».", en: "'Senior citizens' is a euphemism for 'old people'.", altEs: ["« Les personnes âgées », c'est un euphémisme pour « les vieux »."], grammar: [g.litotes-euphemism], vocab: [w.euphémisme] }
      - { es: "« Va, je ne te hais point » : c'est la litote la plus célèbre du théâtre français.", en: "'Go, I do not hate you': it's the most famous understatement in French theatre.", altEs: ["« Va, je ne te hais point » est la litote la plus célèbre du théâtre français."], grammar: [g.litotes-euphemism, g.ne-litteraire], vocab: [w.litote], note: "Chimène to Rodrigue in Corneille's Le Cid (1637): she means 'I love you'." }
    exchanges:
      - q: { es: "Alors, ce brocciu, tu aimes ?", en: "So, do you like this brocciu?" }
        a: { es: "Ce n'est pas mauvais du tout ; j'en reprendrais bien un peu.", en: "It's really good; I'd happily have some more." }
        alt: ["Pas mal du tout !", "Je ne dis pas non à une deuxième part."]
        grammar: [g.litotes-euphemism]
        vocab: [w.fromage]
      - q: { es: "Il est comment, le nouveau stagiaire ?", en: "What's the new intern like?" }
        a: { es: "Disons qu'il n'est pas très doué… mais il est gentil.", en: "Let's say he's not very bright… but he's nice." }
        alt: ["Il n'est pas idiot, il apprend vite.", "Pas terrible, pour l'instant."]
        grammar: [g.litotes-euphemism]
        vocab: [w.doué]
      - q: { es: "Tu as payé combien pour la balade en bateau ?", en: "How much did you pay for the boat trip?" }
        a: { es: "Quarante euros… ce n'est pas donné, mais les grottes valent le coup.", en: "Forty euros… it's not cheap, but the caves are worth it." }
        alt: ["Ce n'était pas donné !", "Assez cher, mais ça valait le coup."]
        grammar: [g.litotes-euphemism]
        vocab: [w.grotte]
      - q: { es: "Comment va ton grand-oncle ?", en: "How's your great-uncle?" }
        a: { es: "Il nous a quittés cet hiver, malheureusement.", en: "He passed away this winter, unfortunately." }
        alt: ["Il s'est éteint en janvier.", "Il va bien, il a quatre-vingt-dix ans !"]
        grammar: [g.litotes-euphemism]
        vocab: [w.éteint]
      - q: { es: "On monte au phare à pied ? C'est à quatre kilomètres.", en: "Shall we walk up to the lighthouse? It's four kilometres." }
        a: { es: "Ce n'est pas l'idée du siècle, avec cette chaleur.", en: "That's not the best idea ever, in this heat." }
        alt: ["Pourquoi pas, ce n'est pas si loin.", "Ce n'est pas bête, il y aura de l'ombre ce soir."]
        grammar: [g.litotes-euphemism]
        vocab: [w.phare]
    texts:
      - title: "Carte postale de Bonifacio"
        es: ["La ville, perchée sur ses falaises, n'est pas désagréable du tout.", "La cuisine non plus : le fromage de brebis n'est pas mal.", "Bref, on ne s'ennuie pas !"]
        en: ["The town, perched on its cliffs, is really lovely.", "So is the food: the sheep's cheese is very good.", "In short, we're having a great time!"]
        grammar: [g.litotes-euphemism]
        vocab: [w.perché]
      - title: "Avis de décès dans le journal"
        es: ["Monsieur Ange Santoni s'est éteint paisiblement à l'âge de quatre-vingt-douze ans.", "Il nous a quittés entouré des siens, dans sa maison du maquis.", "Ni fleurs ni couronnes."]
        en: ["Mr Ange Santoni passed away peacefully at the age of ninety-two.", "He left us surrounded by his family, in his house in the maquis.", "No flowers or wreaths."]
        grammar: [g.litotes-euphemism]
        vocab: [w.éteint, w.maquis]
    spicy:
      - { es: "Tu n'es pas désagréable à regarder, je dois l'avouer.", en: "You're not unpleasant to look at, I must admit.", altEs: ["Tu n'es pas désagréable à regarder, je l'avoue."], grammar: [g.litotes-euphemism], vocab: [w.litote] }
      - { es: "Un dernier verre de myrte chez moi ? Je ne dis pas non… mais juste un verre.", en: "A last glass of myrtle liqueur at my place? I won't say no… but just one glass.", altEs: ["Un dernier verre de myrte chez moi ? Je ne dis pas non, mais juste un verre."], grammar: [g.litotes-euphemism], vocab: [w.myrte] }
      - { es: "Va, je ne te hais point… et je ne déteste pas non plus tes chemises à fleurs.", en: "Go, I do not hate you… and I don't hate your flowery shirts either.", altEs: ["Va, je ne te hais point, et je ne déteste pas non plus tes chemises à fleurs."], grammar: [g.litotes-euphemism, g.ne-litteraire], vocab: [w.litote] }
      - { es: "Ton premier baiser n'était pas terrible ; le deuxième, en revanche, pas mal du tout.", en: "Your first kiss wasn't great; the second, on the other hand, was very good indeed.", altEs: ["Ton premier baiser n'était pas terrible, mais le deuxième, pas mal du tout."], grammar: [g.litotes-euphemism], vocab: [w.ce-n-est-pas-terrible] }
      - { es: "Il n'est pas très doué pour la danse, mais pour les compliments, il est imbattable.", en: "He's hopeless at dancing, but when it comes to compliments he's unbeatable.", altEs: ["Il n'est pas très doué pour danser, mais pour les compliments, il est imbattable."], grammar: [g.litotes-euphemism], vocab: [w.doué] }
  - id: c1.u09.l3
    title: Je dis ça, je dis rien…
    teach: [g.implicit-meaning]
    tip: "Much of what French speakers mean is left unsaid. Il fait un peu frais, non ? = please close the window. Je vais réfléchir = probably not. Sans vouloir te vexer… = a criticism is coming. Je dis ça, je dis rien = I'm just saying (and I mean it)."
    vocab: [w.sous-entendu, w.sous-entendre, w.insinuer, w.allusion, w.implicite, w.explicite, w.lire-entre-les-lignes, w.vexer, w.se-vexer, w.vexant, w.blessant, w.froisser, w.froissé, w.atténuer, w.adoucir, w.ménager, w.il-n-y-a-pas-de-souci, w.souci, w.gênant, w.mal-à-l-aise, w.à-l-aise]
    sentences:
      - { es: "Tu as vu l'heure ? Le dernier bateau part dans dix minutes.", en: "Have you seen the time? The last boat leaves in ten minutes.", altEs: ["T'as vu l'heure ? Le dernier bateau part dans dix minutes."], grammar: [g.implicit-meaning], vocab: [w.bateau], note: "Meaning: hurry up, we have to go." }
      - { es: "Il fait un peu frais ici, tu ne trouves pas ?", en: "It's a bit chilly in here, don't you think?", altEs: ["Il fait un peu frais ici, non ?"], grammar: [g.implicit-meaning], vocab: [w.frais], transform: { instruction: "Say what is really meant, as a direct request", answer: "Tu peux fermer la fenêtre, s'il te plaît ?", alt: ["Ferme la fenêtre, s'il te plaît.", "Tu pourrais fermer la fenêtre ?"], en: "Can you close the window, please?" } }
      - { es: "Votre proposition est intéressante ; nous allons y réfléchir.", en: "Your proposal is interesting; we'll think about it.", altEs: ["Votre proposition est intéressante, nous allons y réfléchir."], grammar: [g.implicit-meaning, g.pronoun-y], vocab: [w.proposition], note: "Often a polite no." }
      - { es: "Je dis ça, je dis rien, mais le restaurant d'à côté est meilleur.", en: "I'm just saying, but the restaurant next door is better.", altEs: ["Je dis ça, je dis rien, mais le resto d'à côté est meilleur."], grammar: [g.implicit-meaning, g.spoken-negation], vocab: [w.restaurant] }
      - { es: "Sans vouloir te vexer, ton cassoulet corse, c'est surtout des haricots.", en: "No offence, but your Corsican cassoulet is mostly beans.", altEs: ["Sans vouloir te vexer, ton cassoulet à la corse, c'est surtout des haricots."], grammar: [g.implicit-meaning], vocab: [w.vexer] }
      - { es: "Il a fait une allusion à mon retard, sans le dire explicitement.", en: "He hinted at my lateness, without saying so explicitly.", altEs: ["Il a fait allusion à mon retard sans le dire explicitement."], grammar: [g.implicit-meaning], vocab: [w.allusion, w.explicite] }
      - { es: "Qu'est-ce que tu insinues ? Que je ne sais pas conduire ?", en: "What are you insinuating? That I can't drive?", altEs: ["Tu insinues quoi ? Que je ne sais pas conduire ?"], grammar: [g.implicit-meaning, g.question-words], vocab: [w.insinuer] }
      - { es: "Quand il dit « on verra », il sous-entend que c'est non.", en: "When he says 'we'll see', he means it's a no.", altEs: ["Quand il dit « on verra », ça sous-entend que c'est non."], grammar: [g.implicit-meaning], vocab: [w.sous-entendre] }
      - { es: "« Tu as arrêté de fumer ? » contient un sous-entendu : tu fumais avant.", en: "'Have you stopped smoking?' contains an implication: you used to smoke.", altEs: ["La question « Tu as arrêté de fumer ? » contient un sous-entendu : tu fumais avant."], grammar: [g.implicit-meaning], vocab: [w.sous-entendu] }
      - { es: "Dans ce courriel très poli, il faut lire entre les lignes : le directeur est furieux.", en: "In this very polite email you have to read between the lines: the director is furious.", altEs: ["Dans ce mail très poli, il faut lire entre les lignes : le directeur est furieux."], grammar: [g.implicit-meaning], vocab: [w.lire-entre-les-lignes] }
      - { es: "Ne te vexe pas, ce n'était pas une critique.", en: "Don't take offence, it wasn't a criticism.", altEs: ["Ne te vexe pas, ce n'était pas une critique !"], grammar: [g.implicit-meaning, g.imperative-with-pronouns], vocab: [w.se-vexer], error: { wrong: "Ne vexe-toi pas, ce n'était pas une critique.", explain: "In a negative command the pronoun stays before the verb: Ne te vexe pas.", grammar: g.imperative-with-pronouns } }
      - { es: "Sa remarque était un peu blessante, et je me suis senti froissé.", en: "His remark was a bit hurtful, and I felt offended.", altEs: ["Sa remarque était assez blessante et je me suis senti froissé.", "Sa remarque était un peu vexante, et je me suis sentie froissée."], grammar: [g.implicit-meaning], vocab: [w.blessant, w.froissé, w.remarque] }
      - { es: "Il a atténué sa critique pour ne pas froisser son hôte.", en: "He toned down his criticism so as not to offend his host.", altEs: ["Il a adouci sa critique pour ne pas froisser son hôte."], grammar: [g.implicit-meaning, g.pour-sans-infinitive], vocab: [w.atténuer, w.froisser], transform: { instruction: "Use adoucir and 'she'", answer: "Elle a adouci sa critique pour ne pas froisser son hôte.", alt: ["Elle a adouci sa critique pour ne pas vexer son hôte."], en: "She softened her criticism so as not to offend her host." } }
      - { es: "Ménage-le un peu : il vient de perdre son travail.", en: "Go easy on him: he's just lost his job.", altEs: ["Ménage-le un peu, il vient de perdre son travail."], grammar: [g.implicit-meaning, g.imperative-with-pronouns], vocab: [w.ménager, w.adoucir] }
      - { es: "Il y a eu un silence gênant, et tout le monde s'est senti mal à l'aise.", en: "There was an awkward silence, and everyone felt ill at ease.", altEs: ["Il y a eu un silence gênant et tout le monde était mal à l'aise."], grammar: [g.implicit-meaning, g.passe-compose-etre], vocab: [w.gênant, w.mal-à-l-aise] }
      - { es: "Le message implicite était clair : on ne voulait pas de nous à cette fête.", en: "The implicit message was clear: they didn't want us at that party.", altEs: ["Le message implicite était clair : on ne voulait pas de nous à la fête."], grammar: [g.implicit-meaning], vocab: [w.implicite] }
    exchanges:
      - q: { es: "Tu veux venir à la randonnée de six heures demain ?", en: "Do you want to come on the six o'clock hike tomorrow?" }
        a: { es: "Euh… je vais voir. C'est un peu compliqué pour moi.", en: "Erm… I'll see. It's a bit tricky for me." }
        alt: ["Je vais réfléchir.", "Pourquoi pas… on verra."]
        grammar: [g.implicit-meaning]
        vocab: [w.randonnée]
      - q: { es: "Ça ne te dérange pas si j'ouvre la fenêtre ?", en: "You don't mind if I open the window?" }
        a: { es: "Il n'y a pas de souci, vas-y.", en: "No problem, go ahead." }
        alt: ["Pas de souci.", "Non, au contraire, il fait chaud."]
        grammar: [g.implicit-meaning]
        vocab: [w.il-n-y-a-pas-de-souci]
      - q: { es: "Tu es encore en retard, Paul.", en: "You're late again, Paul." }
        a: { es: "« Encore » ? Qu'est-ce que tu sous-entends, que je suis toujours en retard ?", en: "'Again'? What are you implying, that I'm always late?" }
        alt: ["Je sais, je sais, désolé.", "Tu insinues quoi, là ?"]
        grammar: [g.implicit-meaning]
        vocab: [w.sous-entendre]
      - q: { es: "Pourquoi tu as l'air mal à l'aise ?", en: "Why do you look ill at ease?" }
        a: { es: "Mon hôte m'a demandé si j'avais aimé son plat, et je n'ai pas osé dire la vérité.", en: "My host asked whether I'd liked his dish, and I didn't dare tell the truth." }
        alt: ["J'ai fait une remarque vexante sans le vouloir.", "Je ne connais personne ici."]
        grammar: [g.implicit-meaning]
        vocab: [w.mal-à-l-aise]
      - q: { es: "Je peux te dire franchement ce que je pense de ta robe ?", en: "Can I tell you frankly what I think of your dress?" }
        a: { es: "Si tu commences par « franchement », j'ai peur d'être vexée.", en: "If you start with 'frankly', I'm afraid I'll be offended." }
        alt: ["Vas-y, je ne me vexe pas.", "Ménage-moi un peu, quand même !"]
        grammar: [g.implicit-meaning]
        vocab: [w.vexer]
    texts:
      - title: "Courriel d'un collègue"
        es: ["Merci pour ton rapport, très complet.", "Peut-être pourrais-tu, à l'avenir, l'envoyer avant la réunion ?", "Je dis ça, bien sûr, sans vouloir te froisser."]
        en: ["Thanks for your report, very thorough.", "Perhaps in future you could send it before the meeting?", "I say this, of course, without wanting to offend you."]
        grammar: [g.implicit-meaning, g.conditional-politeness]
        vocab: [w.froisser]
      - title: "Petit guide de survie en France"
        es: ["Si on vous dit « c'est intéressant » d'un ton plat, lisez entre les lignes.", "« On verra » veut souvent dire non.", "Et « sans vouloir vous vexer » annonce toujours une critique."]
        en: ["If someone tells you 'that's interesting' in a flat tone, read between the lines.", "'We'll see' often means no.", "And 'no offence' always announces a criticism."]
        grammar: [g.implicit-meaning]
        vocab: [w.lire-entre-les-lignes, w.vexer]
    spicy:
      - { es: "Il fait un peu froid, non ? Tu pourrais peut-être t'asseoir plus près.", en: "It's a bit cold, isn't it? Maybe you could sit closer.", altEs: ["Il fait un peu froid, tu ne trouves pas ? Tu pourrais t'asseoir plus près."], grammar: [g.implicit-meaning], vocab: [w.allusion] }
      - { es: "Tu as vu l'heure ? Le dernier bateau est parti… quel dommage.", en: "Have you seen the time? The last boat has gone… what a shame.", altEs: ["T'as vu l'heure ? Le dernier bateau est parti, quel dommage."], grammar: [g.implicit-meaning], vocab: [w.sous-entendu] }
      - { es: "Je dis ça, je dis rien, mais ton ex ne t'a jamais emmenée voir les falaises au coucher du soleil.", en: "I'm just saying, but your ex never took you to see the cliffs at sunset.", altEs: ["Je dis ça, je dis rien, mais ton ex ne t'a jamais emmené voir les falaises au coucher du soleil."], grammar: [g.implicit-meaning], vocab: [w.insinuer] }
      - { es: "Quand tu dis « on se fait un café », c'est un café ou c'est un sous-entendu ?", en: "When you say 'let's grab a coffee', is it a coffee or an innuendo?", altEs: ["Quand tu dis « on se fait un café », c'est vraiment un café ou un sous-entendu ?"], grammar: [g.implicit-meaning], vocab: [w.sous-entendu] }
      - { es: "Pas besoin de lire entre les lignes : ton clin d'œil était assez explicite.", en: "No need to read between the lines: your wink was explicit enough.", altEs: ["Inutile de lire entre les lignes : ton clin d'œil était assez explicite."], grammar: [g.implicit-meaning], vocab: [w.lire-entre-les-lignes, w.explicite] }
  - id: c1.u09.l4
    title: L'hospitalité corse
    teach: [g.implicit-meaning, g.litotes-euphemism]
    tip: "Politeness is often indirect: decline softly (C'est très gentil, mais…), praise with litotes (Ce n'est pas mauvais du tout), and never refuse a host's food too bluntly. Reserved people say little, but say it with care."
    vocab: [w.politesse, w.courtoisie, w.hospitalité, w.hospitalier, w.pudeur, w.fierté, w.taiseux, w.réservé, w.méfiant, w.pudique, w.chaleureusement, w.cordial, w.aimable, w.affable, w.bienveillant, w.malveillant, w.maladroit, w.adroit]
    sentences:
      - { es: "L'hospitalité corse n'est pas une légende : on vous offre toujours un verre.", en: "Corsican hospitality isn't a myth: you're always offered a drink.", altEs: ["L'hospitalité corse n'est pas un mythe : on vous offre toujours à boire."], grammar: [g.litotes-euphemism, g.on-nous], vocab: [w.hospitalité, w.corse] }
      - { es: "Refuser un plat chez quelqu'un, c'est parfois manquer de politesse.", en: "Turning down a dish at someone's home can be impolite.", altEs: ["Refuser un plat chez quelqu'un, c'est parfois un manque de politesse."], grammar: [g.implicit-meaning, g.infinitive-clauses], vocab: [w.politesse], transform: { instruction: "Replace the infinitive subject with a noun (le refus)", answer: "Le refus d'un plat chez quelqu'un, c'est parfois un manque de politesse.", alt: ["Le refus d'un plat chez quelqu'un est parfois un manque de politesse."], en: "Refusing a dish at someone's home is sometimes a lack of politeness." } }
      - { es: "Mon voisin est un peu taiseux, mais il n'est pas malveillant pour autant.", en: "My neighbour is a bit taciturn, but that doesn't make him unkind.", altEs: ["Mon voisin est plutôt taiseux, mais il n'est pas malveillant pour autant."], grammar: [g.litotes-euphemism], vocab: [w.taiseux, w.malveillant] }
      - { es: "Les gens des villages sont réservés au début, voire méfiants, puis très chaleureux.", en: "Village people are reserved at first, even wary, and then very warm.", altEs: ["Au début, les gens des villages sont réservés, voire méfiants, puis très chaleureux."], grammar: [g.adjective-agreement], vocab: [w.réservé, w.méfiant, w.chaleureux] }
      - { es: "Par pudeur, ma grand-mère ne parlait jamais de ses sentiments.", en: "Out of reserve, my grandmother never talked about her feelings.", altEs: ["Par pudeur, ma grand-mère ne parlait jamais de ce qu'elle ressentait."], grammar: [g.implicit-meaning, g.negation-jamais-plus-rien], vocab: [w.pudeur] }
      - { es: "Il est très pudique : au lieu de dire « je t'aime », il te prépare un plat de châtaignes.", en: "He's very reserved: instead of saying 'I love you', he cooks you a chestnut dish.", altEs: ["Il est très pudique : plutôt que de dire « je t'aime », il te prépare un plat de châtaignes."], grammar: [g.implicit-meaning], vocab: [w.pudique, w.châtaigne] }
      - { es: "On nous a accueillis chaleureusement, avec du fromage et un verre de vin du pays.", en: "We were welcomed warmly, with cheese and a glass of local wine.", altEs: ["Nous avons été accueillis chaleureusement, avec du fromage et un verre de vin du pays."], grammar: [g.pc-object-agreement, g.on-nous], vocab: [w.chaleureusement], error: { wrong: "On nous a accueilli chaleureusement, avec du fromage et un verre de vin du pays.", explain: "The direct object nous comes before avoir, so the participle agrees: nous a accueillis.", grammar: g.pc-object-agreement } }
      - { es: "La patronne est très aimable, mais attention : elle n'aime pas qu'on critique sa cuisine.", en: "The owner is very friendly, but careful: she doesn't like people criticising her cooking.", altEs: ["La patronne est très aimable, mais attention, elle n'aime pas qu'on critique sa cuisine."], grammar: [g.subjonctif-emotion], vocab: [w.aimable] }
      - { es: "Il m'a répondu sur un ton cordial, mais sa réponse était plutôt froide.", en: "He replied in a cordial tone, but his answer was rather cold.", altEs: ["Il m'a répondu d'un ton cordial, mais sa réponse était assez froide."], grammar: [g.implicit-meaning], vocab: [w.cordial] }
      - { es: "Les Corses tirent une grande fierté de leur langue et de leur île.", en: "Corsicans take great pride in their language and their island.", altEs: ["Les Corses sont très fiers de leur langue et de leur île."], grammar: [g.precise-verbs], vocab: [w.fierté, w.corse.nm] }
      - { es: "Ce n'est pas très adroit de comparer la Corse à la Sardaigne devant un Bonifacien.", en: "It's not very tactful to compare Corsica to Sardinia in front of someone from Bonifacio.", altEs: ["Ce n'est pas très habile de comparer la Corse à la Sardaigne devant un Bonifacien."], grammar: [g.litotes-euphemism], vocab: [w.adroit] }
      - { es: "Pardon, j'ai été maladroit ; je ne voulais pas vous blesser.", en: "Sorry, that was clumsy of me; I didn't mean to hurt you.", altEs: ["Pardon, j'ai été maladroite ; je ne voulais pas vous blesser."], grammar: [g.implicit-meaning], vocab: [w.maladroit, w.blesser], transform: { instruction: "Say it to a friend (tu)", answer: "Pardon, j'ai été maladroit ; je ne voulais pas te blesser.", alt: ["Pardon, j'ai été maladroite ; je ne voulais pas te blesser.", "Désolé, j'ai été maladroit, je ne voulais pas te blesser."], en: "Sorry, that was clumsy of me; I didn't mean to hurt you." } }
      - { es: "La courtoisie veut qu'on salue tout le monde en entrant dans un petit commerce.", en: "Courtesy requires you to greet everyone when you go into a small shop.", altEs: ["La politesse veut qu'on dise bonjour à tout le monde en entrant dans un petit commerce."], grammar: [g.subjonctif-volonte], vocab: [w.courtoisie] }
      - { es: "Notre hôte, homme affable et bienveillant, nous a fait visiter son village.", en: "Our host, an affable and kindly man, showed us round his village.", altEs: ["Notre hôte, un homme affable et bienveillant, nous a fait visiter son village."], grammar: [g.faire-causatif], vocab: [w.affable, w.bienveillant] }
      - { es: "Un peuple hospitalier, mais qui n'aime pas qu'on lui donne des leçons.", en: "A hospitable people, but one that doesn't like being lectured.", altEs: ["Un peuple accueillant, mais qui n'aime pas qu'on lui fasse la leçon."], grammar: [g.subjonctif-emotion], vocab: [w.hospitalier, w.peuple] }
    exchanges:
      - q: { es: "Vous reprendrez bien un peu de fiadone ?", en: "You'll have a little more fiadone, won't you?" }
        a: { es: "C'est très gentil, mais je n'en peux plus ; c'était délicieux.", en: "That's very kind, but I can't manage any more; it was delicious." }
        alt: ["Je ne dis pas non, juste une petite part.", "Volontiers, il est excellent."]
        grammar: [g.implicit-meaning]
        vocab: [w.politesse]
      - q: { es: "Il est comment, ton beau-père ?", en: "What's your father-in-law like?" }
        a: { es: "Taiseux, mais bienveillant ; il parle peu, mais il a toujours un mot gentil.", en: "Taciturn but kind; he says little, but always has a kind word." }
        alt: ["Pas très bavard, mais adorable.", "Un peu méfiant au début, puis très chaleureux."]
        grammar: [g.litotes-euphemism]
        vocab: [w.taiseux, w.bienveillant]
      - q: { es: "Pourquoi elle ne m'a pas répondu franchement ?", en: "Why didn't she give me a straight answer?" }
        a: { es: "Par pudeur, sans doute ; ici, on ne parle pas de ces choses-là.", en: "Out of reserve, no doubt; here, people don't talk about those things." }
        alt: ["Elle est très réservée.", "Lis entre les lignes : c'était non."]
        grammar: [g.implicit-meaning]
        vocab: [w.pudeur]
      - q: { es: "Comment on vous a reçus, au village ?", en: "How were you received in the village?" }
        a: { es: "Très chaleureusement : on est repartis avec du fromage, du miel et trois invitations.", en: "Very warmly: we left with cheese, honey and three invitations." }
        alt: ["Avec une hospitalité incroyable.", "Froidement au début, puis comme des cousins."]
        grammar: [g.implicit-meaning]
        vocab: [w.chaleureusement, w.hospitalité]
    texts:
      - title: "Conseils aux visiteurs"
        es: ["En entrant dans une épicerie de village, dites bonjour à tout le monde.", "Ne refusez pas trop vite un verre offert : c'est une marque d'hospitalité.", "Et si on vous répond peu, ce n'est pas de la froideur, c'est de la pudeur."]
        en: ["When you go into a village grocery, say hello to everyone.", "Don't refuse an offered drink too quickly: it's a sign of hospitality.", "And if people say little to you, it isn't coldness, it's reserve."]
        grammar: [g.implicit-meaning, g.imperative]
        vocab: [w.hospitalité, w.pudeur]
      - title: "Note dans le livre d'or"
        es: ["Merci à Dumè et à sa famille pour leur accueil si chaleureux.", "Nous sommes arrivés en étrangers et repartis en amis."]
        en: ["Thank you to Dumè and his family for such a warm welcome.", "We arrived as strangers and left as friends."]
        grammar: [g.passe-compose-etre]
        vocab: [w.chaleureux]
    spicy:
      - { es: "Tu es un peu taiseux, mais tes yeux, eux, parlent beaucoup.", en: "You're a bit quiet, but your eyes do a lot of talking.", altEs: ["Tu es un peu taiseuse, mais tes yeux, eux, parlent beaucoup."], grammar: [g.implicit-meaning, g.stressed-pronouns], vocab: [w.taiseux] }
      - { es: "Par pudeur, je ne dirai rien ; mais je n'ai pas lâché ta main de la soirée.", en: "Out of modesty I won't say anything; but I didn't let go of your hand all evening.", altEs: ["Par pudeur, je ne dirai rien, mais je n'ai pas lâché ta main de toute la soirée."], grammar: [g.implicit-meaning], vocab: [w.pudeur] }
      - { es: "Tu as été maladroit en m'invitant, mais charmant en me raccompagnant.", en: "You were clumsy asking me out, but charming walking me home.", altEs: ["Tu as été maladroit pour m'inviter, mais charmant pour me raccompagner."], grammar: [g.gerondif], vocab: [w.maladroit] }
      - { es: "L'hospitalité corse, c'est bien ; l'hospitalité de tes bras, c'est encore mieux.", en: "Corsican hospitality is nice; the hospitality of your arms is even better.", altEs: ["L'hospitalité corse, c'est bien, mais l'hospitalité de tes bras, c'est encore mieux."], grammar: [g.meilleur-mieux], vocab: [w.hospitalité] }
      - { es: "Ce n'est pas très courtois de me regarder comme ça… mais continue.", en: "It's not very courteous to look at me like that… but carry on.", altEs: ["Ce n'est pas très poli de me regarder comme ça… mais continue."], grammar: [g.litotes-euphemism], vocab: [w.courtoisie] }
dialogues:
  - id: c1.u09.d1
    title: Une invitation chez Dumè
    context: Julie, on holiday in Bonifacio, is invited to lunch by Dumè, the owner of her guesthouse, and his wife Marie.
    lines:
      - { speaker: Dumè, es: "Bon, ben, asseyez-vous ! Vous prendrez bien un petit verre de myrte ?", en: "Right, well, sit down! You'll have a little glass of myrtle liqueur, won't you?" }
      - { speaker: Julie, es: "Je ne dis pas non… Mais juste un petit, hein, il est midi !", en: "I won't say no… But just a small one, mind, it's noon!" }
      - { speaker: Marie, es: "Alors, Bonifacio, ça vous plaît ?", en: "So, do you like Bonifacio?" }
      - { speaker: Julie, es: "Dis donc, c'est pas mal du tout ! Les falaises sont incroyables, quoi.", en: "Wow, it's absolutely amazing! The cliffs are incredible, you know." }
      - { speaker: Dumè, es: "Et vous avez pris le bateau pour les grottes ?", en: "And did you take the boat to the caves?" }
      - { speaker: Julie, es: "Oui, en fait, ce matin. Cela dit, ce n'est pas donné, quarante euros !", en: "Yes, actually, this morning. That said, it isn't cheap, forty euros!" }
      - { speaker: Marie, es: "Goûtez donc le fiadone, c'est moi qui l'ai fait.", en: "Do taste the fiadone, I made it." }
      - { speaker: Julie, es: "Mmm, délicieux. Mais je n'en peux plus, vraiment ; c'est très gentil.", en: "Mmm, delicious. But I really can't eat any more; it's very kind of you." }
      - { speaker: Dumè, es: "Tu as vu l'heure, Marie ? Le bateau de Julie pour la Sardaigne part à quatre heures.", en: "Have you seen the time, Marie? Julie's boat to Sardinia leaves at four." }
      - { speaker: Julie, es: "Ah bon, déjà ? Bon, du coup, je vais y aller. Merci pour tout, vraiment.", en: "Really, already? Right, so, I'll get going. Thank you for everything, truly." }
      - { speaker: Marie, es: "Revenez quand vous voulez. Ici, vous êtes chez vous.", en: "Come back whenever you like. Here, you're at home." }
    questions:
      - { q: "Que veut dire Julie par « Je ne dis pas non » ?", options: ["Elle refuse poliment", "Elle accepte volontiers", "Elle n'a pas compris"], answer: 1, explain: "Litotes: je ne dis pas non = yes, gladly." }
      - { q: "Que pense Julie de Bonifacio ?", options: ["C'est un peu décevant", "C'est vraiment magnifique", "C'est trop cher pour elle"], answer: 1, explain: "« Pas mal du tout » is high praise, and she calls the cliffs incredible." }
      - { q: "Pourquoi Dumè demande-t-il à Marie si elle a vu l'heure ?", options: ["Il veut que le repas finisse plus vite", "Il rappelle que Julie a un bateau à prendre", "Il est en retard pour le travail", "Il veut dormir"], answer: 1, explain: "An indirect hint: Julie's boat to Sardinia leaves at four." }
      - { q: "Comment Julie refuse-t-elle une deuxième part de fiadone ?", options: ["Elle dit que ce n'est pas bon", "Elle refuse poliment en complimentant le gâteau", "Elle ne répond pas"], answer: 1, explain: "« Délicieux… Mais je n'en peux plus ; c'est très gentil » : a soft, polite refusal." }
writing:
  - task: "Write the transcript of a casual voice message to a friend about your day in Bonifacio, using discourse markers (bon, ben, du coup, en fait, genre, quoi, hein, tiens)."
    min: 110
    max: 190
    use: [w.du-coup, w.en-fait, w.genre, w.carrément, w.cela-dit]
    useAtLeast: 3
    grammar: [g.discourse-markers]
    expect:
      - { pattern: "\\b(du coup|bon|ben|en fait|genre|quoi|hein|tiens|bah|carr[eé]ment|disons|remarque|cela dit|enfin bref)\\b", hint: "Use discourse markers: bon, ben, du coup, en fait, genre, quoi…" }
    model: { es: "Coucou Léa, c'est moi ! Bon, je t'appelle vite fait parce que je suis à Bonifacio, et franchement, c'est carrément magnifique. En fait, la ville est perchée au bord d'une falaise, genre à soixante mètres au-dessus de la mer, tu vois ? Ce matin, on voulait faire le tour en bateau, mais il y avait trop de vent, du coup on a visité la vieille ville à pied. Ben, il faisait super chaud, hein ! Cela dit, la vue sur la Sardaigne, ça valait le coup. Tiens, d'ailleurs, on a goûté les spécialités au fromage corse, un truc de fou, quoi. Bon, je te laisse, la batterie est presque morte. Rappelle-moi ce soir, bisous !", en: "Hi Léa, it's me! OK, I'm calling you quickly because I'm in Bonifacio, and honestly, it's absolutely gorgeous. Actually, the town is perched on the edge of a cliff, like sixty metres above the sea, you know? This morning we wanted to do the boat trip, but it was too windy, so we visited the old town on foot. Well, it was really hot, you know! That said, the view of Sardinia was worth it. Oh, by the way, we tried the Corsican cheese specialities, amazing, really. Right, I'll leave you, my battery's almost dead. Call me back tonight, love!" }
  - task: "Write a polite online review of a disappointing restaurant in Bonifacio, using litotes and euphemisms rather than criticising openly (ce n'était pas terrible, pas donné, il n'est pas très doué…)."
    min: 110
    max: 190
    use: [w.litote, w.ce-n-est-pas-terrible, w.doué, w.euphémisme, w.myrte]
    useAtLeast: 2
    grammar: [g.litotes-euphemism]
    expect:
      - { pattern: "\\b(ce n['’][eé]t(ait|ai)? pas|n['’][eé]tait pas|pas (mal|terrible|donn[eé]|g[eé]nial|vraiment|tr[eè]s|du tout|d[eé]sagr[eé]able|mauvais|[eé]vident))", hint: "Use litotes: ce n'était pas terrible, ce n'est pas donné, pas mal…" }
    model: { es: "Restaurant sur le port, dîner du 12 août. La terrasse est très agréable et la vue sur les bateaux n'est pas laide du tout, je le reconnais. En revanche, la cuisine n'était pas terrible. Le poisson, que le serveur nous avait chaudement recommandé, n'était pas de la première fraîcheur, disons. Le chef n'est sans doute pas très doué pour les sauces : la mienne était un peu trop salée à mon goût. Côté prix, ce n'est pas donné : quarante-cinq euros pour un plat et un dessert. Seul le digestif de myrte nous a laissé un souvenir plutôt positif. Le service, lui, était un peu lent, mais les serveurs n'étaient pas impolis. Bref, ce n'est pas le meilleur souvenir de nos vacances.", en: "Restaurant on the harbour, dinner on 12 August. The terrace is very pleasant and the view of the boats is not at all ugly, I admit. On the other hand, the food wasn't great. The fish, which the waiter had warmly recommended, wasn't exactly the freshest, let's say. The chef is probably not very gifted with sauces: mine was a bit too salty for my taste. Price-wise, it's not cheap: forty-five euros for a main course and a dessert. Only the myrtle liqueur left a rather positive memory. The service was a little slow, but the waiters weren't rude. In short, it's not the best memory of our holiday." }
  - task: "Your Corsican host made a comment full of implicit meaning. Explain to a friend what he or she really meant (il a sous-entendu que…, en fait, il voulait dire…, il faut lire entre les lignes)."
    es: "Tiens, tu es enfin réveillé ? Ici, le petit-déjeuner, c'est jusqu'à neuf heures… Mais bon, je dis ça, je dis rien !"
    min: 110
    max: 190
    use: [w.sous-entendre, w.insinuer, w.implicite, w.lire-entre-les-lignes, w.vexer]
    useAtLeast: 3
    grammar: [g.implicit-meaning]
    expect:
      - { pattern: "\\b(sous-entend|insinu|voulait dire|veut dire|allusion|implicite|entre les lignes|autrement dit|en fait)", hint: "Explain the hidden meaning: il a sous-entendu que…, en fait, il voulait dire…" }
    model: { es: "Ce matin, Madame Santoni m'a accueillie dans la cuisine avec un grand sourire et cette phrase : « Tiens, tu es enfin réveillée ? Ici, le petit-déjeuner, c'est jusqu'à neuf heures… Mais bon, je dis ça, je dis rien ! » Sur le moment, je n'ai pas compris. En fait, il fallait lire entre les lignes : il était dix heures et quart. Elle a sous-entendu que j'étais en retard et que je dérangeais ses habitudes. Le « tiens, enfin » était une allusion à l'heure, et le « je dis ça, je dis rien » voulait dire exactement le contraire : elle le disait très clairement ! Elle ne voulait pas me vexer, c'est sa manière d'être polie. Le message implicite est simple : demain, je me lève à huit heures.", en: "This morning Madame Santoni greeted me in the kitchen with a big smile and this sentence: 'Well, you're finally awake? Here, breakfast is until nine… But hey, I'm just saying!' At the time I didn't understand. In fact you had to read between the lines: it was a quarter past ten. She was implying I was late and disrupting her habits. The 'well, finally' was a hint at the time, and the 'I'm just saying' meant exactly the opposite: she was saying it very clearly! She didn't want to offend me, it's her way of being polite. The implicit message is simple: tomorrow I'm getting up at eight." }
  - task: "Write a thank-you message to your reserved but generous Corsican host family, tactfully mentioning one small problem with a euphemism."
    min: 110
    max: 190
    use: [w.hospitalité, w.pudeur, w.chaleureusement, w.bienveillant, w.réservé]
    useAtLeast: 3
    grammar: [g.implicit-meaning, g.litotes-euphemism]
    expect:
      - { pattern: "\\b(merci|remerci|reconnaissante?|gentillesse|hospitalit|accueil)", hint: "Thank them warmly: merci, je vous remercie, votre hospitalité…" }
      - { pattern: "\\b(petit (souci|probl[eè]me|d[eé]tail)|l[eé]ger (souci|probl[eè]me|d[eé]tail)|un peu|peut-[eê]tre|pas tr[eè]s|l[eé]g[eè]rement|si jamais|pas toujours)\\b", hint: "Mention the problem tactfully: un petit souci, peut-être un peu…" }
    model: { es: "Chers Ghjuvanni et Maria, je tenais à vous remercier très chaleureusement pour ces deux semaines inoubliables à Bonifacio. Au début, je vous ai trouvés un peu réservés, mais j'ai vite compris que c'était de la pudeur et non un manque d'amitié. Votre hospitalité a été extraordinaire : les repas en famille, les promenades dans le maquis et vos histoires sur la vieille ville resteront longtemps dans ma mémoire. Je suis aussi très reconnaissante pour votre patience avec mon français ! Juste un petit souci, si jamais vous accueillez d'autres étudiants : le chauffe-eau est peut-être un peu fatigué, et les douches du matin sont parfois légèrement fraîches. Merci encore pour votre accueil bienveillant. Je vous embrasse, Emma", en: "Dear Ghjuvanni and Maria, I wanted to thank you very warmly for these two unforgettable weeks in Bonifacio. At first I found you a little reserved, but I soon understood that it was modesty and not a lack of friendliness. Your hospitality was extraordinary: the family meals, the walks in the maquis and your stories about the old town will stay in my memory for a long time. I'm also very grateful for your patience with my French! Just one small problem, should you host other students: the water heater may be a little tired, and the morning showers are sometimes slightly chilly. Thank you again for your kindness. Love, Emma" }
