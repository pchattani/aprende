lessons:
  - id: ph.vowels
    title: The five vowels
    explanation: |
      Spanish has exactly five vowel sounds and they never change: **a** /a/, **e** /e/, **i** /i/, **o** /o/, **u** /u/. Each is short, pure and tense — no gliding as in English "no" (nəʊ) or "day" (deɪ). Unstressed vowels are never reduced to "uh": the three a's in *banana* sound identical.

      ### Tips
      - Keep your mouth position fixed for the whole vowel.
      - **e** is like the vowel in "bet", never "bay". **o** is like "or" without the r, never "oh-u".
      - **u** is always /u/ as in "food", never /ju/ as in "use": *universidad* starts /uni/.
      - **i** before another vowel becomes a glide /j/: *bien* /bjen/.
    items:
      - { es: casa, ipa: "ˈka.sa", tip: both a's identical }
      - { es: mesa, ipa: "ˈme.sa", tip: short pure e }
      - { es: piso, ipa: "ˈpi.so" }
      - { es: moto, ipa: "ˈmo.to", tip: no glide at the end }
      - { es: luna, ipa: "ˈlu.na" }
      - { es: universidad, ipa: "u.ni.βeɾ.siˈðað" }
    minimalPairs: [[peso, piso], [casa, cosa], [mesa, misa], [pelo, polo], [vino, vano]]
    practice: ["Ana ama a mamá.", "Pepe bebe leche.", "Mi piso es pequeño.", "Lola come solo pollo.", "Lulú usa su luz."]
  - id: ph.b-v-d-g
    title: B/V, D, G — the soft consonants
    explanation: |
      **b** and **v** are the same sound in Spanish. At the start of a phrase or after *m/n* they are a hard /b/ (*vamos*, *un beso*); between vowels they soften to /β/, lips almost touching (*la vaca*, *abuelo*). Never the English /v/ with teeth on lip.

      **d** between vowels or at the end of a word softens to /ð/, like "th" in "this": *nada*, *Madrid*. **g** before a/o/u between vowels softens similarly: *agua*, *amigo*.

      ### Tips
      - Say *beber* with soft second b: /βeˈβeɾ/.
      - *Madrid* ends in a very soft /ð/, almost silent in casual speech.
    items:
      - { es: vaca, ipa: "ˈba.ka", tip: hard b at the start }
      - { es: la vaca, ipa: "la ˈβa.ka", tip: soft between vowels }
      - { es: abuelo, ipa: "aˈβwe.lo" }
      - { es: nada, ipa: "ˈna.ða", tip: like English 'th' in 'this' }
      - { es: Madrid, ipa: "maˈðɾið" }
      - { es: amigo, ipa: "aˈmi.ɣo" }
    minimalPairs: [[baca, vaca], [tubo, tuvo], [cada, cara], [todo, toro]]
    practice: ["Bebo vino blanco.", "Vamos a ver a la abuela.", "Todo el día nada en el agua.", "Mi amigo David vive en Madrid."]
  - id: ph.c-z-s
    title: C, Z and S — the Spanish distinción
    explanation: |
      In most of Spain, **z** and **c** before e/i are pronounced /θ/, the "th" of "think": *zapato*, *cena*, *gracias*. **s** is always /s/. This contrast is called *distinción*; in Latin America and the Canaries both are /s/ (*seseo*).

      **c** before a/o/u and **qu** before e/i are /k/: *casa*, *queso*, *quiero*. **k** is rare.

      ### Tips
      - *casa* (house) and *caza* (hunt) differ in Spain: /ˈkasa/ vs /ˈkaθa/.
      - *qu* never sounds /kw/: *queso* is /ˈkeso/. For /kw/ Spanish writes *cu*: *cuatro*.
    items:
      - { es: zapato, ipa: "θaˈpa.to" }
      - { es: cena, ipa: "ˈθe.na" }
      - { es: gracias, ipa: "ˈɡɾa.θjas" }
      - { es: queso, ipa: "ˈke.so", tip: no w sound }
      - { es: cuatro, ipa: "ˈkwa.tɾo" }
      - { es: cerveza, ipa: "θeɾˈβe.θa" }
    minimalPairs: [[casa, caza], [sien, cien], [cocer, coser], [abrasar, abrazar]]
    practice: ["Cecilia cena cerezas.", "¿Quieres queso o chorizo?", "Gracias, Zaragoza es preciosa.", "Cinco cervezas, por favor."]
  - id: ph.j-g-h
    title: J, G and the silent H
    explanation: |
      **j** is always /x/, a rough h from the back of the throat (like Scottish "loch"): *jamón*, *Jorge*. **g** before e/i is the same sound: *gente*, *girasol*. To keep /g/ before e/i Spanish writes **gu**: *guerra*, *guitarra* (the u is silent). **gü** makes the u heard: *pingüino*.

      **h** is always silent: *hola* = /ˈola/, *hombre* = /ˈombɾe/. Only **ch** has a sound: /t͡ʃ/ as in "church".
    items:
      - { es: jamón, ipa: "xaˈmon" }
      - { es: gente, ipa: "ˈxen.te" }
      - { es: guitarra, ipa: "ɡiˈta.rra", tip: the u is silent }
      - { es: pingüino, ipa: "pinˈɡwi.no" }
      - { es: hola, ipa: "ˈo.la", tip: silent h }
      - { es: chico, ipa: "ˈt͡ʃi.ko" }
    minimalPairs: [[jota, gota], [gira, guira], [haber, a ver]]
    practice: ["Jorge come jamón con la gente.", "Hoy hay huevos en el hotel.", "Guillermo toca la guitarra.", "El chico chileno chilla."]
  - id: ph.r-rr-l
    title: R, RR and L
    explanation: |
      Single **r** between vowels is a quick tap /ɾ/, like the "tt" in American "butter": *pero*, *caro*. **rr**, and **r** at the start of a word or after *n/l/s*, is a trill /r/: *perro*, *rosa*, *Enrique*. The difference changes meaning: *pero* (but) vs *perro* (dog).

      **l** is always a clear, light /l/ with the tongue tip forward, never the dark English "l" of "ball". **ll** is pronounced /ʝ/ like **y** in most of Spain today (*yeísmo*): *calle*, *llamar*.

      ### Tips
      - Practise the trill by saying "tdtdtd" fast with a relaxed tongue, then add voice.
      - At the end of a word, r is a single tap: *hablar*.
    items:
      - { es: pero, ipa: "ˈpe.ɾo" }
      - { es: perro, ipa: "ˈpe.rro" }
      - { es: rosa, ipa: "ˈrro.sa", tip: initial r is trilled }
      - { es: Enrique, ipa: "enˈrri.ke" }
      - { es: calle, ipa: "ˈka.ʝe" }
      - { es: sol, ipa: "sol", tip: light l }
    minimalPairs: [[pero, perro], [caro, carro], [coro, corro], [cero, cerro], [pollo, poyo]]
    practice: ["El perro de Ramón corre por la carretera.", "Rosa y Roberto ríen.", "Me llamo Lola y vivo en la calle Real.", "Tres tristes tigres tragan trigo en un trigal."]
  - id: ph.n-ñ-y
    title: Ñ, N and Y
    explanation: |
      **ñ** is /ɲ/, like "ny" in "canyon" said as one sound: *año*, *España*, *niño*. It is a separate letter and changes meaning: *año* (year) vs *ano* (anus) — always write the tilde!

      **y** before a vowel is /ʝ/ (*yo*, *ayer*); alone or at the end of a word it is the vowel /i/ (*y*, *rey*, *hoy*). **n** before b/p/v sounds like m: *un beso* /umˈβeso/.
    items:
      - { es: año, ipa: "ˈa.ɲo" }
      - { es: España, ipa: "esˈpa.ɲa" }
      - { es: niño, ipa: "ˈni.ɲo" }
      - { es: yo, ipa: "ʝo" }
      - { es: rey, ipa: "rrei" }
      - { es: un beso, ipa: "um ˈβe.so" }
    minimalPairs: [[año, ano], [cana, caña], [pena, peña], [sonar, soñar]]
    practice: ["El niño pequeño tiene un año.", "Ayer yo ya no estaba aquí.", "Hoy es el cumpleaños de la señora Núñez.", "El rey y la reina."]
  - id: ph.stress
    title: Stress and the written accent
    explanation: |
      Every Spanish word has one stressed syllable, and three rules tell you where it is:

      1. If a vowel has a **tilde** (´), that syllable is stressed: *canción*, *música*.
      2. Otherwise, if the word ends in a **vowel, -n or -s**, stress the **second-to-last** syllable: *ca-SA*, *ha-BLAN*, *LU-nes*.
      3. Otherwise stress the **last** syllable: *ha-BLAR*, *ciu-DAD*, *re-LOJ*.

      The tilde is written exactly when the stress breaks rule 2 or 3. Words stressed on the third-from-last syllable always take it (*MÚ-si-ca*). A stressed **i** or **u** next to a/e/o breaks the diphthong and always takes a tilde: *pa-ÍS*, *RÍ-o*, *ba-ÚL*. One-syllable words never take it, except a few pairs that need distinguishing: *sí/si*, *él/el*, *tú/tu*, *más/mas*, *té/te*, *sé/se*, *qué/que*.

      ### Why it matters
      *hablo* (I speak) vs *habló* (he spoke); *papa* (potato) vs *papá* (dad); *esta* (this) vs *está* (is).
    items:
      - { es: canción, tip: "ends in -n but stressed on the last syllable → tilde" }
      - { es: música, tip: "stressed third from last → always a tilde" }
      - { es: árbol, tip: "ends in a consonant but stressed on second to last → tilde" }
      - { es: hablar, tip: "ends in r, stressed on last syllable → no tilde needed" }
      - { es: país, tip: "stressed i next to a → hiatus → tilde" }
      - { es: examen / exámenes, tip: "stress stays on the same vowel; the plural needs a tilde" }
    minimalPairs: [[hablo, habló], [papa, papá], [esta, está], [canto, cantó], [si, sí]]
    practice: ["Mi papá compró una papa.", "¿Está tu hermana en esta casa?", "Él habló y yo hablo.", "La canción de la música es fantástica."]
  - id: ph.linking
    title: Rhythm, linking and intonation
    explanation: |
      Spanish is **syllable-timed**: every syllable takes roughly the same time, giving a machine-gun rhythm, unlike English where unstressed syllables shrink. Words run together: a final consonant links to a following vowel (*los amigos* → lo-sa-mi-gos) and identical vowels merge (*la amiga* → l'amiga).

      ### Intonation
      - Statements fall at the end.
      - Yes/no questions **rise** at the end: *¿Vienes?* ↗
      - Questions with a question word (*qué, dónde, cuándo*) start high and **fall**: *¿Dónde vives?* ↘
      - Exclamations start high: *¡Qué bonito!*

      Written Spanish marks the start of questions and exclamations with ¿ and ¡ precisely because word order does not change: *Vienes.* / *¿Vienes?*
    items:
      - { es: los amigos, ipa: "lo.sa.ˈmi.ɡos", tip: link the s }
      - { es: la amiga, ipa: "laˈmi.ɣa", tip: the two a's merge }
      - { es: ¿Vienes?, tip: "rising" }
      - { es: ¿Dónde vives?, tip: "falling" }
      - { es: ¡Qué bonito!, tip: "high start" }
    minimalPairs: []
    practice: ["¿Vienes a la fiesta esta noche?", "¿Dónde está el hotel Europa?", "Los amigos de Ana están en el aula.", "¡Qué calor hace hoy!", "No sé si él es el hermano de Isabel."]
