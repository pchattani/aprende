id: r.c1.grandfathers-scrolls
level: c1
title: 阿爺嘅字：論語同增廣賢文
kind: literature
author: 孔子 Confucius (551–479 BC), as recorded in the 論語 Analects; 增廣賢文 (anonymous, Ming–Qing dynasties)
source: "Sayings from 《論語》 (學而, 為政, 述而, 衞靈公) and couplets from the Ming–Qing primer 《增廣賢文》, quoted exactly. Public domain. The memoir framing them is written for this course."
intro: "A Macau woman remembers her grandfather, a calligrapher who wrote classical sayings for the neighbours every Chinese New Year. Each saying from the Analects or the old primer of proverbs is quoted exactly and then explained the way he explained it to her, in plain Cantonese. Watch for the classical function words 之, 而, 其, 焉, 勿 and 矣."
allow: [孔子, 論語, 增廣賢文, 揮春, 營地大街, 阿爺]
paragraphs:
  - { es: "我阿爺以前喺營地大街開一間細細嘅紙料舖。佢唔係乜嘢大書法家，但係寫得一手好字。每年過年之前，街坊都會拎住紅紙嚟搵佢寫揮春，佢一寫就寫到半夜。我細個成日坐喺佢隔籬磨墨，佢寫一句，就用廣東話同我解一句。佢最鍾意寫嘅，唔係「恭喜發財」，而係《論語》同《增廣賢文》入面嘅句子。佢話：「呢啲係古人留低嘅說話，讀一世都用得着。」", en: "My grandfather used to run a tiny paper shop on Rua dos Mercadores. He wasn't any great calligrapher, but he had beautiful handwriting. Every year before Chinese New Year, the neighbours would bring red paper for him to write New Year scrolls, and once he started he'd write till midnight. As a child I often sat next to him grinding ink, and for every line he wrote, he'd explain it to me in Cantonese. What he liked writing most wasn't 'Wishing you prosperity' but lines from the Analects and the old book of proverbs. He'd say: 'These are words the ancients left us. You can read them all your life and they'll still be useful.'" }
  - { es: "《論語·學而》 ／ 子曰：「學而時習之，不亦說乎？有朋自遠方來，不亦樂乎？人不知而不慍，不亦君子乎？」", en: "Analects, 'Learning' / The Master said: 'To learn and at due times to practise what one has learned – is that not a pleasure? To have friends come from afar – is that not a joy? To be unrecognised by others and feel no resentment – is that not the mark of a gentleman?'" }
  - { es: "阿爺解釋：「『子曰』即係孔子講。學咗嘢，得閒就攞出嚟溫吓、練吓，唔係好開心咩？呢度個『說』讀 jyut6，同『悅』一樣，即係開心。有朋友由好遠嘅地方嚟探你，唔係好快樂咩？人哋唔明你、唔識欣賞你，你都唔嬲，噉先至係君子。」佢仲話，三句都用「不亦……乎」，即係口語嘅「唔係……咩？」，其實係用問題嚟講一個好肯定嘅意思。", en: "Grandfather explained: '\"The Master said\" means Confucius said. When you've learned something and you take it out to revise and practise whenever you're free, isn't that a pleasure? Here 說 is read jyut6, the same as 悅, meaning happy. When a friend comes from far away to visit you, isn't that a joy? When people don't understand you or appreciate you and you don't get angry, that's what makes a gentleman.' He added that all three lines use 不亦……乎, which is the colloquial 唔係……咩? – a question that actually makes a very firm statement." }
  - { es: "《論語·為政》 ／ 子曰：「溫故而知新，可以為師矣。」「學而不思則罔，思而不學則殆。」「知之為知之，不知為不知，是知也。」", en: "Analects, 'Government' / The Master said: 'One who reviews the old and so learns the new is fit to be a teacher.' 'Learning without thinking leads to confusion; thinking without learning is perilous.' 'To know what you know and to know what you do not know – that is knowledge.'" }
  - { es: "「溫習舊嘅嘢，又可以由入面諗到新嘅嘢，噉就可以做人哋老師喇。淨係讀書唔思考，就會一頭霧水；淨係諗唔讀書，就好危險，因為你會以為自己乜都啱。」講到最後一句，阿爺特登望住我：「識就話識，唔識就話唔識，咁先係真係識。你考試唔識就唔好亂作，做人都係噉。」我當時覺得佢好囉嗦，大個咗先知道，呢句說話我返工日日都用得着。", en: "'If you review old things and can also think of new things from them, then you can be someone's teacher. If you only read without thinking, you'll be completely confused; if you only think without reading, it's dangerous, because you'll believe you're always right.' When he got to the last line, Grandfather would look straight at me: 'If you know, say you know; if you don't, say you don't – that's real knowing. If you don't know an answer in an exam, don't make it up, and the same goes for life.' At the time I thought he was a nag; only when I grew up did I realise I'd use that line at work every day." }
  - { es: "《論語·述而》 ／ 子曰：「三人行，必有我師焉。擇其善者而從之，其不善者而改之。」 《論語·衞靈公》 ／ 子曰：「己所不欲，勿施於人。」", en: "Analects, 'Transmitting' / The Master said: 'When three people walk together, there is sure to be a teacher for me among them. I pick out their good points and follow them, and their bad points and correct them in myself.' Analects, 'Duke Ling of Wei' / The Master said: 'What you do not want done to yourself, do not do to others.'" }
  - { es: "「三個人一齊行路，入面一定有人可以做我老師。佢哋好嘅地方，我就跟住學；唔好嘅地方，我就睇吓自己有冇，有就改。」阿爺話，呢個「焉」同「之」，口語都唔會講，「焉」差唔多即係「喺入面」，「之」即係「佢」。至於「己所不欲，勿施於人」，佢解得最簡單：「你唔想人哋點對你，你就唔好噉對人。」「勿」即係「唔好」，同告示上面「請勿吸煙」嗰個「勿」一樣。", en: "'When three people walk together, there's sure to be someone among them who can be my teacher. Their good points I learn from; their bad points I look for in myself, and if I find them, I correct them.' Grandfather said nobody uses 焉 or 之 in speech: 焉 is roughly 'among them', 之 means 'it/them'. As for 'what you do not want done to yourself, do not do to others', his explanation was the simplest of all: 'However you don't want people to treat you, don't treat them that way.' 勿 means 唔好 'don't', the same 勿 as in 'No smoking' (請勿吸煙) on notices." }
  - { es: "《增廣賢文》 ／ 一寸光陰一寸金，寸金難買寸光陰。路遙知馬力，日久見人心。一年之計在於春，一日之計在於寅。近水樓臺先得月，向陽花木易為春。", en: "From the Expanded Words of Wisdom / An inch of time is an inch of gold, but an inch of gold cannot buy an inch of time. A long road tests a horse's strength; long days reveal a person's heart. The year's plans are made in spring, the day's plans at dawn. The tower by the water is the first to catch the moon; flowers and trees facing the sun are the first to bloom." }
  - { es: "《增廣賢文》係明清時候細路仔讀嘅書，入面全部都係俗語同格言，好多句我哋今日仲掛喺口邊。阿爺解：「時間好似金咁寶貴，但係有幾多錢都買唔返過去嘅時間。路遠先知道匹馬有幾大力，相處耐咗先知道一個人係好定壞。一年最緊要係春天，一日最緊要係朝早，做嘢要趁早。住近水邊嘅樓，最先見到月光，即係近住有利嘅位置就最先得到好處。」講到呢句，佢會笑住補多句：「所以你要住近學校，費事日日遲到！」", en: "The Expanded Words of Wisdom was a book children read in Ming and Qing times, full of proverbs and maxims, and many of its lines are still on our lips today. Grandfather explained: 'Time is as precious as gold, but no amount of money can buy back time that's gone. Only on a long road do you find out how strong a horse is; only after spending a long time with someone do you find out whether they're good or bad. The most important part of the year is spring, the most important part of the day is the morning: do things early. The building by the water sees the moonlight first – that is, whoever is close to an advantage benefits first.' At that line he'd add with a smile: 'So you should live near your school, then you won't be late every day!'" }
  - { es: "而家阿爺已經唔喺度，間紙料舖都變咗手信店。不過每年過年，我都會買幾張紅紙，自己寫兩句。我啲字冇阿爺咁靚，但係寫嘅時候，好似仲聽到佢喺隔籬用廣東話慢慢解：「學而時習之……即係呀，學咗嘢要練。」我個仔今年七歲，佢問我點解唔寫「恭喜發財」。我話：「發財就人人都寫，呢啲先係阿爺留畀我哋嘅嘢。」", en: "Grandfather is gone now, and the paper shop has become a souvenir shop. But every New Year I buy a few sheets of red paper and write a couple of lines myself. My handwriting isn't as beautiful as his, but as I write, I seem to hear him beside me, explaining slowly in Cantonese: 'To learn and at due times to practise… that means, when you've learned something you have to practise it.' My son is seven this year, and he asked me why I don't write 'Wishing you prosperity'. I told him: 'Everyone writes prosperity. These are what Grandfather left us.'" }
questions:
  - { q: "阿爺最鍾意寫邊啲句子？", options: ["「恭喜發財」同埋其他祝福說話", "《論語》同《增廣賢文》入面嘅句子", "佢自己作嘅詩"], answer: 1, explain: "He preferred lines from the Analects and the Expanded Words of Wisdom to standard New Year wishes." }
  - { q: "「不亦說乎」用口語講，最接近邊句？", options: ["唔係好開心咩？", "唔好講出嚟", "唔係好遠咩？"], answer: 0, explain: "不亦……乎 is a rhetorical question, colloquially 唔係……咩; 說 here = 悅 (happy), read jyut6." }
  - { q: "「知之為知之，不知為不知」，阿爺點樣解？", options: ["讀得多書就乜都識", "識就話識，唔識就話唔識", "唔識嘅嘢唔使學"], answer: 1, explain: "Admitting what you don't know is part of real knowledge: 是知也." }
  - { q: "「己所不欲，勿施於人」嘅「勿」，同邊個告示嘅字意思一樣？", options: ["「請勿吸煙」", "「歡迎光臨」", "「營業時間」"], answer: 0, explain: "勿 is the classical negative imperative 'do not', still used on notices: 請勿吸煙 'please do not smoke'." }
  - { q: "「近水樓臺先得月」比喻乜嘢？", options: ["住喺海邊會睇到好靚嘅月亮", "近住有利嘅位置，就最先得到好處", "做人要早起身"], answer: 1, explain: "The tower by the water catches the moon first: whoever is close to an advantage benefits first." }
