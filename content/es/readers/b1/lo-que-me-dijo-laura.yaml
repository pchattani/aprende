id: r.b1.lo-que-me-dijo-laura
level: b1
title: Lo que me dijo Laura
kind: text
intro: A short story in which the narrator reports a conversation with her friend Laura, who has some big news.
allow: [laura, lisboa, madrid]
paragraphs:
  - { es: "El sábado pasado quedé con Laura en el bar de siempre. Hacía meses que no la veía y me pareció distinta: más delgada, más tranquila. Antes de pedir el café, ya me había dicho que tenía algo importante que contarme.", en: "Last Saturday I met Laura at our usual bar. I hadn't seen her for months and she seemed different to me: thinner, calmer. Before ordering the coffee, she had already told me she had something important to tell me." }
  - { es: "Me contó que había dejado su trabajo en la empresa de publicidad. Yo le pregunté por qué, porque siempre decía que le encantaba. Me explicó que los últimos meses habían sido horribles: su jefe le exigía cada vez más y le había prometido un ascenso que nunca llegó.", en: "She told me she had left her job at the advertising company. I asked her why, because she always said she loved it. She explained that the last few months had been horrible: her boss demanded more and more of her and had promised her a promotion that never came." }
  - { es: "«¿Y qué vas a hacer ahora?», le pregunté. Me respondió que se iba a vivir a Lisboa con su pareja, que había encontrado trabajo allí. Añadió que el alquiler era más barato y que la ciudad le parecía más tranquila que Madrid. Me aseguró que no era una decisión rápida: llevaban un año pensándolo.", en: "'And what are you going to do now?' I asked her. She replied that she was going to live in Lisbon with her partner, who had found work there. She added that rent was cheaper and that the city seemed calmer to her than Madrid. She assured me it wasn't a quick decision: they had been thinking about it for a year." }
  - { es: "Le dije que me alegraba mucho por ella, pero que la echaría de menos. Ella se rio y me contestó que Lisboa estaba a una hora de avión y que la puerta de su casa siempre estaría abierta.", en: "I told her I was very happy for her, but that I would miss her. She laughed and answered that Lisbon was an hour away by plane and that the door of her house would always be open." }
  - { es: "Después me preguntó si yo seguía en el mismo piso y si todavía discutía con mi vecino de arriba. Le conté que me había mudado en enero a un barrio más tranquilo, donde por fin dormía bien. Me dijo que se alegraba y que quería ver el piso antes de irse.", en: "Then she asked me if I was still in the same flat and whether I still argued with my upstairs neighbour. I told her I had moved in January to a quieter neighbourhood, where I finally slept well. She said she was glad and that she wanted to see the flat before leaving." }
  - { es: "Al despedirnos, me pidió un favor: silencio. Quería contárselo ella misma a sus padres el domingo siguiente, y hasta entonces nadie debía saber nada. Yo le prometí que no diría una palabra.", en: "As we said goodbye, she asked me a favour: silence. She wanted to tell her parents herself the following Sunday, and until then nobody was to know anything. I promised her I wouldn't say a word." }
  - { es: "Esa noche, cuando llegué a casa, pensé en todo lo que me había dicho. Hace dos años, Laura afirmaba que nunca se iría de Madrid. Supongo que la gente cambia, y que a veces lo que decimos hoy no es lo que haremos mañana.", en: "That night, when I got home, I thought about everything she had told me. Two years ago, Laura used to say she would never leave Madrid. I suppose people change, and that sometimes what we say today is not what we will do tomorrow." }
  - { es: "Al día siguiente me llamó para decirme que ya había comprado los billetes. Se iban el quince de abril. Y me preguntó, con un tono muy serio, si quería quedarme con sus plantas.", en: "The next day she called to tell me she had already bought the tickets. They were leaving on the fifteenth of April. And she asked me, in a very serious tone, whether I wanted to keep her plants." }
questions:
  - { q: "Why did Laura leave her job?", options: ["The company closed", "Her boss demanded more and more and a promised promotion never came", "She wanted to study"], answer: 1 }
  - { q: "Why is she moving to Lisbon?", options: ["Her partner found work there and life is cheaper and calmer", "She was offered a promotion there", "Her parents live there"], answer: 0 }
  - { q: "What favour does Laura ask the narrator?", options: ["To look after her cat", "To help with the move", "Not to tell anyone yet"], answer: 2 }
glossary:
  - { es: distinto, en: different }
  - { es: palabra, en: word }
