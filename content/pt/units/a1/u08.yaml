      - { es: "Chapéu, óculos e bermuda bege… Você é turista ou ator de cinema?", en: "Hat, glasses and beige shorts… Are you a tourist or a film star?", altEs: ["Chapéu, óculos e bermuda bege… Você é turista ou atriz de cinema?"], grammar: [g.colours], vocab: [w.chapéu, w.bermuda, w.bege, w.turista] }
dialogues:
  - id: a1.u08.d1
    title: Uma camisa para o jogo
    context: It's match day at the Maracanã. Tom stops at a street stall outside the stadium to buy a Flamengo shirt.
    lines:
      - { speaker: Vendedor, es: "Boa tarde! Camisa do Flamengo, camiseta, boné… Tudo barato!", en: "Good afternoon! Flamengo shirts, T-shirts, caps… Everything's cheap!" }
      - { speaker: Tom, es: "Boa tarde! Quanto custa essa camisa vermelha e preta?", en: "Good afternoon! How much is this red and black shirt?" }
      - { speaker: Vendedor, es: "Essa custa cento e vinte reais.", en: "That one costs a hundred and twenty reais." }
      - { speaker: Tom, es: "Cento e vinte? Está caro! E aquela ali, a branca?", en: "A hundred and twenty? That's expensive! And that one over there, the white one?" }
      - { speaker: Vendedor, es: "Aquela é mais barata: oitenta reais.", en: "That one's cheaper: eighty reais." }
      - { speaker: Tom, es: "Mas eu quero a vermelha e preta. Tem em tamanho G?", en: "But I want the red and black one. Do you have it in large?" }
      - { speaker: Vendedor, es: "Tem, sim. Para você, faço por cem.", en: "Yes, I do. For you, I'll do it for a hundred." }
      - { speaker: Tom, es: "Cem reais… E o boné preto, quanto é?", en: "A hundred reais… And the black cap, how much is it?" }
      - { speaker: Vendedor, es: "O boné é trinta. Camisa e boné, cento e vinte.", en: "The cap is thirty. Shirt and cap, a hundred and twenty." }
      - { speaker: Tom, es: "Combinado! Posso pagar no Pix?", en: "Deal! Can I pay by Pix?" }
      - { speaker: Vendedor, es: "Pode, claro. E vamos, Mengão!", en: "Of course. And come on, Flamengo!" }
    questions:
      - { q: "Qual é o primeiro preço da camisa vermelha e preta?", options: ["Oitenta reais", "Cento e vinte reais", "Trinta reais"], answer: 1, explain: "The seller first asks a hundred and twenty reais for the red and black shirt." }
      - { q: "Que tamanho o Tom quer?", options: ["P", "M", "G"], answer: 2, explain: "Tom asks for the shirt in size G (large)." }
      - { q: "Quanto o Tom paga por tudo?", options: ["Cem reais", "Cento e vinte reais", "Cento e cinquenta reais"], answer: 1, explain: "The seller offers the shirt and the cap together for a hundred and twenty reais." }
      - { q: "Como o Tom paga?", options: ["Em dinheiro", "No cartão", "No Pix"], answer: 2, explain: "Tom asks to pay by Pix, and the seller says of course." }
