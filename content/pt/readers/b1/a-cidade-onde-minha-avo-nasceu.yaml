id: r.b1.a-cidade-onde-minha-avo-nasceu
level: b1
title: A cidade onde minha avó nasceu
kind: text
intro: Tiago visits Pirenópolis, in Goiás, the small colonial town where his grandmother was born, during the Festa do Divino. The text is full of relative clauses (que, onde, quem, cujo, o qual).
allow: [tiago, pirenópolis, goiás, goiânia, brasília, divino, espírito, santo, cavalhadas, mascarados, almas, ok, sílvia, meia, ponte]
paragraphs:
  - { es: "A minha avó Sílvia sempre falava de uma cidade que eu só conhecia por fotos: Pirenópolis, onde ela nasceu e viveu até os dezoito anos. Nas histórias que ela contava, havia ruas de pedra, um rio onde as crianças nadavam, cachoeiras escondidas no cerrado e uma festa durante a qual a cidade inteira se transformava. No ano passado, dois anos depois de a minha avó morrer, eu finalmente fui conhecer o lugar de que ela tanto falava.", en: "My grandmother Sílvia always talked about a town I only knew from photos: Pirenópolis, where she was born and lived until she was eighteen. In the stories she told, there were stone streets, a river where children swam, waterfalls hidden in the cerrado and a festival during which the whole town was transformed. Last year, two years after my grandmother died, I finally went to see the place she had talked about so much." }
  - { es: "Pirenópolis fica em Goiás, a pouco mais de duas horas de Brasília. É uma cidade pequena, que nasceu no século dezoito por causa do ouro, e cujo centro histórico ainda tem casas coloniais, igrejas antigas e muitas ladeiras. Escolhi ir em maio ou junho, na época da Festa do Divino Espírito Santo, que era a festa preferida da minha avó.", en: "Pirenópolis is in Goiás, a little over two hours from Brasília. It's a small town that was born in the eighteenth century because of gold, and whose historic centre still has colonial houses, old churches and lots of steep streets. I chose to go in May or June, at the time of the Festa do Divino Espírito Santo, which was my grandmother's favourite festival." }
  - { es: "O ponto alto da festa são as Cavalhadas, uma encenação que acontece há quase duzentos anos. Durante três dias, cavaleiros vestidos de azul, que representam os cristãos, e cavaleiros vestidos de vermelho, que representam os mouros, fazem uma batalha a cavalo no campo da cidade. As pessoas com quem conversei me explicaram que é uma tradição que veio de Portugal e que lembra as guerras da Idade Média.", en: "The high point of the festival is the Cavalhadas, a re-enactment that has been taking place for almost two hundred years. For three days, horsemen dressed in blue, who represent the Christians, and horsemen dressed in red, who represent the Moors, stage a battle on horseback in the town's field. The people I talked to explained that it's a tradition that came from Portugal and recalls the wars of the Middle Ages." }
  - { es: "Mas o que mais me impressionou foram os mascarados: homens e mulheres que se vestem com roupas coloridas e máscaras enormes, muitas vezes de boi, e andam a cavalo pela cidade fazendo brincadeiras com quem passa. As crianças correm atrás deles, metade com medo e metade rindo. Foi aí que eu entendi uma frase que a minha avó repetia: «Quem nunca viu os mascarados não sabe o que é alegria.»", en: "But what impressed me most were the mascarados: men and women who dress in colourful clothes and huge masks, often of oxen, and ride around town on horseback playing tricks on passers-by. The children run after them, half afraid and half laughing. That was when I understood a phrase my grandmother used to repeat: 'Whoever has never seen the mascarados doesn't know what joy is.'" }
  - { es: "Num dos dias, procurei a rua onde ficava a casa dela. Eu tinha um endereço antigo, escrito à mão numa foto em preto e branco. A casa ainda existe: é pequena, branca, com janelas azuis, e hoje é uma loja de artesanato cuja dona, por coincidência, conheceu a minha bisavó. Ela me mostrou o quintal onde, segundo ela, havia uma jabuticabeira que dava frutas o ano inteiro.", en: "On one of the days, I looked for the street where her house had been. I had an old address, handwritten on a black-and-white photo. The house still exists: it's small and white, with blue windows, and today it's a craft shop whose owner, by coincidence, knew my great-grandmother. She showed me the backyard where, according to her, there had been a jabuticaba tree that gave fruit all year round." }
  - { es: "No último dia, fui até o rio das Almas, o mesmo rio onde a minha avó nadava quando era menina. Sentei numa pedra, coloquei os pés na água fria e fiquei ali muito tempo. Pensei em todas as pessoas que tinham passado por aquela cidade antes de mim: os mineradores que a fundaram, as famílias que ficaram, a menina que um dia foi embora para Goiânia e nunca mais voltou para morar.", en: "On the last day, I went to the Almas river, the same river where my grandmother swam when she was a girl. I sat on a rock, put my feet in the cold water and stayed there a long time. I thought of all the people who had passed through that town before me: the miners who founded it, the families who stayed, the girl who one day left for Goiânia and never came back to live." }
  - { es: "Pirenópolis não é a cidade mais famosa do Brasil, nem a mais bonita. Mas é a cidade onde começou a história da minha família, e isso, para mim, basta.", en: "Pirenópolis isn't the most famous town in Brazil, nor the most beautiful. But it's the town where my family's story began, and that, for me, is enough." }
questions:
  - { q: "Por que o Tiago foi a Pirenópolis?", options: ["Para trabalhar", "Para conhecer a cidade onde a avó nasceu", "Para visitar Brasília"], answer: 1, explain: "He went to see «o lugar de que ela tanto falava», the town where his grandmother was born." }
  - { q: "Por que a cidade nasceu no século dezoito?", options: ["Por causa do ouro", "Por causa do café", "Por causa de uma festa"], answer: 0, explain: "«É uma cidade pequena, que nasceu no século dezoito por causa do ouro.»" }
  - { q: "Nas Cavalhadas, quem os cavaleiros de vermelho representam?", options: ["Os cristãos", "Os mouros", "Os portugueses"], answer: 1, explain: "Blue represents the Christians and «cavaleiros vestidos de vermelho... representam os mouros»." }
  - { q: "O que fazem os mascarados?", options: ["Andam a cavalo com máscaras e fazem brincadeiras", "Cantam na igreja", "Vendem artesanato"], answer: 0, explain: "They wear masks and colourful clothes «e andam a cavalo pela cidade fazendo brincadeiras com quem passa»." }
  - { q: "O que é hoje a antiga casa da avó?", options: ["Um museu", "Uma loja de artesanato", "Uma pousada"], answer: 1, explain: "«Hoje é uma loja de artesanato cuja dona, por coincidência, conheceu a minha bisavó.»" }
