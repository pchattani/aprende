id: r.b1.leonardo-e-il-cenacolo
level: b1
title: Leonardo e il Cenacolo
kind: text
intro: The story of Leonardo da Vinci's Last Supper in Milan, told like a magazine article. The historical part uses the passato remoto (arrivò, dipinse, fu), which at B1 you only need to recognise, and there are plenty of gerunds (lavorando, guardando).
allow: [milanesi, leonardo, vinci, ludovico, sforza, moro, cenacolo, maria, grazie, giuda, vasari, bandello, matteo, cristo, gesù]
paragraphs:
  - { es: "Ogni giorno, a Milano, centinaia di persone aspettano in fila davanti a una chiesa, Santa Maria delle Grazie, per vedere un solo dipinto per soli quindici minuti. Entrano in piccoli gruppi, passando attraverso porte di vetro che controllano l'aria e l'umidità. Poi, finalmente, se lo trovano davanti: l'Ultima Cena di Leonardo da Vinci, che i milanesi chiamano semplicemente «il Cenacolo».", en: "Every day in Milan hundreds of people queue in front of a church, Santa Maria delle Grazie, to see a single painting for just fifteen minutes. They go in in small groups, passing through glass doors that control the air and the humidity. Then, finally, there it is in front of them: Leonardo da Vinci's Last Supper, which the Milanese simply call 'il Cenacolo'." }
  - { es: "Leonardo arrivò a Milano intorno al 1482, quando aveva circa trent'anni. Lavorò per molti anni alla corte di Ludovico Sforza, detto il Moro, il duca della città, che gli chiese di tutto: progetti di macchine, feste, canali, statue. Nel 1494 il duca gli affidò un compito speciale: dipingere l'Ultima Cena sulla parete della sala dove i frati del convento mangiavano.", en: "Leonardo arrived in Milan around 1482, when he was about thirty. He worked for many years at the court of Ludovico Sforza, known as il Moro, the duke of the city, who asked him for all sorts of things: designs for machines, festivities, canals, statues. In 1494 the duke gave him a special task: to paint the Last Supper on the wall of the room where the friars of the monastery ate." }
  - { es: "Leonardo ci lavorò per circa quattro anni. Lo scrittore Matteo Bandello, che da ragazzo lo vide lavorare, raccontò che certi giorni Leonardo dipingeva dalla mattina alla sera senza mangiare, mentre altri giorni restava ore davanti al muro, guardando il dipinto senza toccare il pennello. Si racconta anche che il priore del convento, stanco di aspettare, si lamentò con il duca. Leonardo rispose che gli mancava ancora la faccia di Giuda e che, se non trovava un modello migliore, poteva sempre usare quella del priore.", en: "Leonardo worked on it for about four years. The writer Matteo Bandello, who saw him working as a boy, recounted that some days Leonardo painted from morning to night without eating, while other days he would stand for hours in front of the wall, looking at the painting without touching the brush. It's also said that the prior of the monastery, tired of waiting, complained to the duke. Leonardo replied that he still lacked the face of Judas and that, if he didn't find a better model, he could always use the prior's." }
  - { es: "Il dipinto mostra il momento in cui Gesù dice ai dodici apostoli: «Uno di voi mi tradirà.» Guardandolo, si vede subito la reazione di ciascuno: chi si alza, chi alza le mani, chi si avvicina agli altri per chiedere chi sia il traditore. Gesù, al centro, è l'unico calmo. Tutte le linee della stanza portano lo sguardo verso di lui.", en: "The painting shows the moment when Jesus tells the twelve apostles: 'One of you will betray me.' Looking at it, you immediately see each one's reaction: some stand up, some raise their hands, some lean towards the others to ask who the traitor is. Jesus, in the centre, is the only calm one. All the lines of the room draw your eye towards him." }
  - { es: "C'era però un problema. Volendo lavorare lentamente e cambiare idea quando voleva, Leonardo non usò la tecnica dell'affresco, che obbliga il pittore a dipingere velocemente sull'intonaco ancora bagnato. Usò invece una tecnica sperimentale su muro asciutto. Il risultato fu splendido, ma fragile: già pochi anni dopo il colore cominciò a staccarsi dal muro.", en: "There was a problem, though. Wanting to work slowly and change his mind whenever he liked, Leonardo didn't use the fresco technique, which forces the painter to work quickly on still-wet plaster. Instead he used an experimental technique on a dry wall. The result was splendid, but fragile: only a few years later the paint began to come away from the wall." }
  - { es: "Nei secoli successivi il Cenacolo sopravvisse a tutto: all'umidità, ai soldati di Napoleone, che usarono la sala come stalla, e perfino alle bombe del 1943, che distrussero quasi tutta la sala. Il muro del dipinto rimase in piedi, protetto da sacchi di sabbia. L'ultimo grande restauro è durato più di vent'anni ed è finito nel 1999.", en: "In the following centuries the Last Supper survived everything: damp, Napoleon's soldiers, who used the room as a stable, and even the bombs of 1943, which destroyed almost the whole room. The wall with the painting remained standing, protected by sandbags. The last major restoration took more than twenty years and finished in 1999." }
  - { es: "Oggi, uscendo dalla sala dopo quindici minuti, molti visitatori dicono la stessa cosa: che sembrava di essere lì, a quella cena, insieme a loro.", en: "Today, leaving the room after fifteen minutes, many visitors say the same thing: that it felt as if they were there, at that supper, with them." }
questions:
  - { q: "Per quanto tempo si può guardare il Cenacolo?", options: ["Un'ora", "Quindici minuti", "Tutto il giorno"], answer: 1, explain: "Visitors enter in small groups for just fifteen minutes." }
  - { q: "Chi chiese a Leonardo di dipingere l'Ultima Cena?", options: ["Il priore del convento", "Ludovico Sforza, il duca di Milano", "Napoleone"], answer: 1, explain: "«Il duca gli affidò un compito speciale» – affidò is the passato remoto of affidare." }
  - { q: "Che cosa rispose Leonardo al priore che si lamentava?", options: ["Che avrebbe finito il giorno dopo", "Che poteva usare la faccia del priore per Giuda", "Che non voleva più lavorare"], answer: 1, explain: "The famous anecdote (told by Vasari): he still needed a face for Judas, and the prior's might do." }
  - { q: "Perché il dipinto è così fragile?", options: ["Perché Leonardo non usò la tecnica dell'affresco", "Perché è molto antico", "Perché è stato dipinto su legno"], answer: 0, explain: "He painted on a dry wall with an experimental technique, so the paint started to flake off early." }
  - { q: "Che cosa successe nel 1943?", options: ["Fu finito il restauro", "Le bombe distrussero quasi tutta la sala, ma il muro del dipinto rimase in piedi", "I soldati di Napoleone usarono la sala come stalla"], answer: 1, explain: "Sandbags protected the wall while the rest of the refectory was almost destroyed." }
