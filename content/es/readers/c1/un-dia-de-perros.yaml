id: r.c1.un-dia-de-perros
level: c1
title: Un día de perros
kind: text
intro: "A humorous first-person story about a job interview that goes wrong, told almost entirely in idioms, proverbs and fixed expressions. Read it once for the plot and a second time hunting for the figurative expressions: there are more than twenty."
allow: [madrid, ramírez, lola, izquierdo, asentía, llenó, malísimo]
paragraphs:
  - { es: "El lunes me levanté con el pie izquierdo. Para empezar, no había pegado ojo: los vecinos de arriba celebraron algo hasta las cuatro y, a juzgar por el ruido, tiraron la casa por la ventana. A las siete sonó el despertador y, de golpe, recordé que a las nueve tenía la entrevista más importante de mi vida.", en: "On Monday I got up on the wrong side of the bed. To begin with, I hadn't slept a wink: the upstairs neighbours celebrated something until four and, judging by the noise, they spared no expense. At seven the alarm went off and, all at once, I remembered that at nine I had the most important interview of my life." }
  - { es: "Salí a toda prisa, sin desayunar, y llovía a cántaros. A falta de paraguas, me puse una bolsa de plástico en la cabeza; de pies a cabeza parecía un náufrago. En el metro, un señor que hablaba por los codos me contó la historia de su divorcio. Yo asentía de vez en cuando, con la cabeza en las nubes, repasando mentalmente las respuestas que había aprendido de memoria.", en: "I left in a great hurry, without breakfast, and it was pouring. For want of an umbrella, I put a plastic bag on my head; from head to toe I looked like a shipwreck survivor. On the metro, a man who talked nineteen to the dozen told me the story of his divorce. I nodded from time to time, with my head in the clouds, mentally going over the answers I had learnt by heart." }
  - { es: "Llegué a la empresa a las nueve menos cinco, hecho polvo pero puntual. «A quien madruga, Dios le ayuda», pensé. Me equivocaba: la recepcionista me informó, sin pelos en la lengua, de que la entrevista era a las ocho y media. Había leído mal el correo. A lo hecho, pecho: pedí disculpas y esperé.", en: "I arrived at the company at five to nine, shattered but punctual. 'The early bird catches the worm,' I thought. I was wrong: the receptionist informed me, without mincing her words, that the interview had been at half past eight. I had misread the email. What's done is done: I apologised and waited." }
  - { es: "A las diez me recibió el señor Ramírez, un hombre que, según decían, tenía muy mala leche. Fue al grano: «¿Por qué quiere trabajar aquí?». Me quedé en blanco. Todas las respuestas aprendidas de memoria se habían ido por donde habían venido. Dije algo acerca de la empresa, de su prestigio, de su historia; él me miraba como quien ve llover.", en: "At ten Mr Ramírez saw me, a man who, so they said, was very bad-tempered. He got straight to the point: 'Why do you want to work here?' I went blank. All the answers I had learnt by heart had gone back where they came from. I said something about the company, its prestige, its history; he looked at me like someone watching the rain." }
  - { es: "Entonces metí la pata hasta el fondo. Para romper el hielo, conté un chiste sobre jefes con mal carácter. A buen entendedor, pocas palabras bastan: el señor Ramírez no se rio. Cuando terminé, me preguntó, con una calma terrible, si sabía quién era el dueño de la empresa. Lo supe en ese instante, a juzgar por su cara.", en: "Then I really put my foot in it. To break the ice, I told a joke about bad-tempered bosses. A word to the wise is enough: Mr Ramírez didn't laugh. When I finished, he asked me, with a terrible calm, whether I knew who the owner of the company was. I knew it at that very instant, judging by his face." }
  - { es: "Salí a la calle convencido de que había perdido el trabajo y, de buenas a primeras, dejó de llover. En un abrir y cerrar de ojos la ciudad se llenó de sol. Me compré un café, me senté en un banco y me desahogué por teléfono con mi amiga Lola, que no tiene pelos en la lengua: «Estás como una cabra», me dijo, «pero no hay mal que por bien no venga».", en: "I went out into the street convinced I had lost the job and, out of the blue, it stopped raining. In the blink of an eye the city filled with sunshine. I bought myself a coffee, sat on a bench and let off steam on the phone with my friend Lola, who doesn't mince her words: 'You're nuts,' she told me, 'but every cloud has a silver lining.'" }
  - { es: "Tenía razón, como casi siempre. Esa misma tarde me llamó el señor Ramírez. Me dijo que yo era un desastre, que había llegado tarde y que mi chiste era malísimo. «Pero usted ha sido la única persona en diez años que me ha hecho reír en una entrevista. Empieza el lunes». Más vale tarde que nunca.", en: "She was right, as almost always. That very afternoon Mr Ramírez called me. He told me I was a disaster, that I had arrived late and that my joke was terrible. 'But you have been the only person in ten years who has made me laugh in an interview. You start on Monday.' Better late than never." }
  - { es: "Hoy por hoy sigo en la empresa. El señor Ramírez y yo somos uña y carne, aunque de vez en cuando me recuerda el chiste. Yo le recuerdo que perro ladrador, poco mordedor. Y los lunes, por si acaso, me levanto con el pie derecho.", en: "As things stand I'm still at the company. Mr Ramírez and I are inseparable, although from time to time he reminds me of the joke. I remind him that his bark is worse than his bite. And on Mondays, just in case, I get up on the right side of the bed." }
questions:
  - { q: "Why hadn't the narrator slept?", options: ["He was studying for the interview", "The upstairs neighbours were celebrating until four", "It was raining too loudly"], answer: 1 }
  - { q: "What mistake had the narrator made about the interview?", options: ["He went to the wrong company", "He misread the time: it was at half past eight, not nine", "He forgot his CV"], answer: 1 }
  - { q: "Why was the joke a serious blunder?", options: ["Because it was about bad-tempered bosses and Mr Ramírez was the owner", "Because it was in English", "Because it was too long"], answer: 0 }
  - { q: "Why does Mr Ramírez hire him in the end?", options: ["Because he was punctual", "Because Lola recommended him", "Because he was the only candidate in ten years who made him laugh"], answer: 2 }
  - { q: "What does «perro ladrador, poco mordedor» say about Mr Ramírez?", options: ["He has a dog", "He seems fierce but is not really dangerous", "He bites"], answer: 1 }
