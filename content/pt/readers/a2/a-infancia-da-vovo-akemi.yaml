id: r.a2.a-infancia-da-vovo-akemi
level: a2
title: A infância da vovó Akemi
kind: text
intro: In Liberdade, São Paulo's Japanese neighbourhood, Grandma Akemi tells her granddaughter what her childhood was like in the 1950s.
allow: [akemi, liberdade, galvão, bueno, japão, japonesa, japoneses, okinawa, tanabata, júlia, ok]
paragraphs:
  - { es: "A minha avó Akemi tem oitenta anos e mora na Liberdade, o bairro japonês de São Paulo. Os pais dela vieram do Japão em 1938, de navio. Ontem, eu fui à casa dela para um trabalho da escola e perguntei: «Vó, como era a sua vida quando você era criança?» Ela sorriu, fez um chá verde e começou a contar.", en: "My grandmother Akemi is eighty and lives in Liberdade, São Paulo's Japanese neighbourhood. Her parents came from Japan in 1938, by ship. Yesterday I went to her house for a school project and asked: 'Grandma, what was your life like when you were a child?' She smiled, made some green tea and started to tell me." }
  - { es: "«Quando eu era pequena, nós morávamos numa casa simples na Rua Galvão Bueno. A casa tinha só dois quartos, e eu dormia no mesmo quarto que os meus três irmãos. Meu pai tinha uma loja pequena de verduras e minha mãe costurava para fora. Os dois trabalhavam muito, do sol até a noite.»", en: "'When I was little, we lived in a simple house on Rua Galvão Bueno. The house had only two bedrooms, and I slept in the same room as my three brothers. My father had a small vegetable shop and my mother did sewing for other people. They both worked a lot, from sunrise until night.'" }
  - { es: "«Em casa, a gente falava japonês. Na escola, falava português. No começo era difícil, porque eu não entendia nada, mas depois eu aprendi rápido. Eu era uma menina tímida e estudiosa. Gostava muito de ler e de desenhar.»", en: "'At home we spoke Japanese. At school we spoke Portuguese. At first it was hard, because I didn't understand anything, but then I learned quickly. I was a shy, studious girl. I really liked reading and drawing.'" }
  - { es: "«Não tinha televisão. À noite, a família toda ficava na sala, ouvia rádio e conversava. Aos domingos, nós íamos ao parque ou visitávamos os amigos dos meus pais. As mulheres cozinhavam juntas, e as crianças brincavam na rua até tarde. A rua era tranquila; quase não tinha carros.»", en: "'There was no television. In the evening the whole family stayed in the living room, listened to the radio and talked. On Sundays we went to the park or visited my parents' friends. The women cooked together, and the children played in the street until late. The street was quiet; there were hardly any cars.'" }
  - { es: "«A festa que eu mais amava era o Tanabata, em julho. A gente escrevia desejos em papéis coloridos e pendurava nos bambus. Eu sempre escrevia o mesmo desejo: ser professora.»", en: "'The festival I loved most was Tanabata, in July. We wrote wishes on coloured paper and hung them on the bamboo. I always wrote the same wish: to be a teacher.'" }
  - { es: "E ela foi professora de matemática por trinta e cinco anos! Hoje, a Liberdade está muito diferente: tem lojas, restaurantes e turistas por todo lado. Mas a minha avó ainda vai à feira da praça todo domingo e ainda escreve um desejo no Tanabata. Este ano, ela me mostrou o papel: «Saúde para a família toda.»", en: "And she was a maths teacher for thirty-five years! Today Liberdade is very different: there are shops, restaurants and tourists everywhere. But my grandmother still goes to the market in the square every Sunday and still writes a wish at Tanabata. This year she showed me the paper: 'Health for the whole family.'" }
questions:
  - { q: "Como os pais da vovó Akemi chegaram ao Brasil?", options: ["De avião", "De navio", "De trem"], answer: 1, explain: "«Os pais dela vieram do Japão em 1938, de navio.»" }
  - { q: "Como era a casa da família?", options: ["Grande, com um jardim", "Simples, com só dois quartos", "Um apartamento moderno"], answer: 1, explain: "«A casa tinha só dois quartos, e eu dormia no mesmo quarto que os meus três irmãos.»" }
  - { q: "Que língua a família falava em casa?", options: ["Português", "Japonês", "Inglês"], answer: 1, explain: "«Em casa, a gente falava japonês. Na escola, falava português.»" }
  - { q: "O que a família fazia à noite?", options: ["Assistia televisão", "Ia ao cinema", "Ouvia rádio e conversava"], answer: 2, explain: "«Não tinha televisão. À noite, a família toda ficava na sala, ouvia rádio e conversava.»" }
  - { q: "Qual era o desejo da Akemi no Tanabata?", options: ["Ser professora", "Morar no Japão", "Ter uma loja"], answer: 0, explain: "«Eu sempre escrevia o mesmo desejo: ser professora.» And she became a maths teacher." }
