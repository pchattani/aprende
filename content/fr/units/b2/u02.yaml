      - { pattern: "\\b(s[uû]re?s?|certaine?s?|persuad[eé]e?s?|convaincue?s?|sais|crois|pense|probable|[eé]vident)\\b[^.!?]{0,10}\\bqu(e\\s|['’])", hint: "Express certainty + indicatif: je suis sûr(e) que tu vas…" }
    model: { es: "Tout ça ? Je doute fort que tu finisses ton assiette ! Je connais les bouchons : les portions sont énormes. Il est peu probable que tu aies encore faim après la salade lyonnaise, qui est déjà très copieuse. Il est possible que tu manges les quenelles, mais l'andouillette, franchement, ça m'étonnerait. En revanche, je suis persuadée que tu trouveras de la place pour le dessert, puisque tu adores le sucré. Et je suis sûre que tu vas faire une longue sieste demain. Probablement jusqu'à midi !", en: "All that? I very much doubt you'll finish your plate! I know bouchons: the portions are huge. It's unlikely you'll still be hungry after the salade lyonnaise, which is already very filling. You might manage the quenelles, but the andouillette, honestly, I'd be surprised. On the other hand, I'm convinced you'll find room for dessert, since you love sweet things. And I'm sure you'll have a long nap tomorrow. Probably until noon!" }
