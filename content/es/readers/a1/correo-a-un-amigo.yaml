id: r.a1.correo-a-un-amigo
level: a1
title: Un correo desde Granada
kind: text
intro: Tom emails his friend Sam about his new life in Granada.
paragraphs:
  - { es: "Hola, Sam. ¿Cómo estás? Yo estoy muy bien. Ya llevo tres semanas en Granada y me encanta la ciudad. Es pequeña, antigua y muy bonita, con montañas detrás y mucho sol.", en: "Hi, Sam. How are you? I'm very well. I've been in Granada for three weeks now and I love the city. It's small, old and very pretty, with mountains behind it and lots of sun." }
  - { es: "Vivo en un piso con dos estudiantes españoles, Pablo y Lucía. Son muy simpáticos y hablamos español todo el día. Al principio no entendía nada, pero ahora entiendo bastante.", en: "I live in a flat with two Spanish students, Pablo and Lucía. They're very nice and we speak Spanish all day. At first I didn't understand anything, but now I understand quite a lot." }
  - { es: "Por la mañana tengo clase de español de nueve a una. El profesor es muy bueno y la clase es divertida. Somos doce estudiantes de ocho países. Por la tarde estudio en la biblioteca o paseo por el centro.", en: "In the morning I have Spanish class from nine to one. The teacher is very good and the class is fun. We're twelve students from eight countries. In the afternoon I study in the library or walk around the centre." }
  - { es: "La comida es fantástica. Aquí en Granada, si tomas una bebida en un bar, la tapa es gratis. Mi tapa favorita es la tortilla. Ceno muy tarde, a las diez, como los españoles.", en: "The food is fantastic. Here in Granada, if you have a drink in a bar, the tapa is free. My favourite tapa is the omelette. I have dinner very late, at ten, like the Spaniards." }
  - { es: "Los fines de semana hacemos excursiones. El sábado pasado fuimos a la playa, a una hora en autobús. Este fin de semana vamos a la montaña. ¡En Granada puedes esquiar por la mañana y nadar en el mar por la tarde!", en: "At weekends we go on trips. Last Saturday we went to the beach, an hour away by bus. This weekend we're going to the mountains. In Granada you can ski in the morning and swim in the sea in the afternoon!" }
  - { es: "¿Por qué no vienes en abril? Hay una habitación libre y el viaje es barato. Escríbeme pronto. Un abrazo, Tom.", en: "Why don't you come in April? There's a free room and the trip is cheap. Write to me soon. A hug, Tom." }
questions:
  - { q: "How long has Tom been in Granada?", options: ["Three days", "Three weeks", "Three months"], answer: 1 }
  - { q: "When are Tom's Spanish classes?", options: ["In the afternoon", "From nine to one", "At the weekend"], answer: 1 }
  - { q: "What is special about bars in Granada?", options: ["Drinks are free", "The tapa is free with a drink", "They close at ten"], answer: 1 }
glossary:
  - { es: al principio, en: at first }
  - { es: excursión, en: trip, excursion }
  - { es: esquiar, en: to ski }
  - { es: libre, en: free (available) }
  - { es: abrazo, en: hug }
