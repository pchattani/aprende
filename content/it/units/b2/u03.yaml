id: b2.u03
title: "Magari!"
lessons:
  - id: b2.u03.l1
    title: Magari fosse vero!
    teach: [g.magari-se-solo]
    vocab: [w.se-solo, w.casa-al-mare, w.barca-a-vela, w.sognare-a-occhi-aperti, w.yacht, w.lusso, w.volesse-il-cielo, w.avverarsi, w.lussuoso, w.irraggiungibile, w.illudersi, w.sognatore, w.realista, w.utopia, w.benestante, w.immaginazione, w.veliero, w.illusione, w.idealista, w.fantasia]
    tip: "Magari / Se solo + congiuntivo imperfetto = If only…! for wishes about now or the future: Magari fosse vero! As a one-word answer, Magari! means 'I wish!'."
    sentences:
      - { es: "Magari ci fosse meno vento sul cratere!", en: "If only there were less wind on the crater!", altEs: ["Se solo ci fosse meno vento sul cratere!", "Magari ci fosse meno vento sul cratere."], grammar: [g.magari-se-solo], vocab: [w.vento, w.cratere] }
      - { es: "Se solo avessi più fiato, arriverei in cima in mezz'ora.", en: "If only I had more breath, I'd get to the top in half an hour.", altEs: ["Magari avessi più fiato: arriverei in cima in mezz'ora."], grammar: [g.magari-se-solo, g.periodo-ipotetico-2], vocab: [w.se-solo, w.cima] }
      - { es: "Vai in vacanza ad agosto? — Magari!", en: "Are you going on holiday in August? — I wish!", altEs: ["Vai in ferie ad agosto? — Magari!"], grammar: [g.magari-se-solo], vocab: [w.vacanza] }
      - { es: "Magari potessi vivere in una casa al mare a Sorrento!", en: "If only I could live in a house by the sea in Sorrento!", altEs: ["Se solo potessi vivere in una casa al mare a Sorrento!"], grammar: [g.magari-se-solo], vocab: [w.casa-al-mare] }
      - { es: "Se solo avessimo una barca a vela, andremmo a Capri ogni domenica.", en: "If only we had a sailing boat, we'd go to Capri every Sunday.", altEs: ["Magari avessimo una barca a vela: andremmo a Capri ogni domenica."], grammar: [g.magari-se-solo, g.periodo-ipotetico-2], vocab: [w.barca-a-vela] }
      - { es: "Sogno a occhi aperti uno yacht di lusso, ma prendo il traghetto delle otto.", en: "I daydream about a luxury yacht, but I take the eight o'clock ferry.", altEs: ["Sogno a occhi aperti uno yacht di lusso, però prendo il traghetto delle otto."], grammar: [g.present-are], vocab: [w.sognare-a-occhi-aperti, w.yacht, w.lusso, w.traghetto] }
      - { es: "Volesse il cielo che il Vesuvio dormisse per altri mille anni!", en: "Heaven grant that Vesuvius sleeps for another thousand years!", altEs: ["Magari il Vesuvio dormisse per altri mille anni!"], grammar: [g.magari-se-solo], vocab: [w.volesse-il-cielo] }
      - { es: "Magari si avverasse almeno uno dei miei sogni!", en: "If only at least one of my dreams came true!", altEs: ["Se solo si avverasse almeno uno dei miei sogni!"], grammar: [g.magari-se-solo], vocab: [w.avverarsi, w.sogno] }
      - { es: "Magari quella villa lussuosa fosse nostra! Ma non illudiamoci: è irraggiungibile.", en: "If only that luxurious villa were ours! But let's not kid ourselves: it's out of reach.", altEs: ["Magari quella villa lussuosa fosse nostra! Però non illudiamoci: è irraggiungibile."], grammar: [g.magari-se-solo, g.imperativo-noi-voi], vocab: [w.lussuoso, w.irraggiungibile, w.illudersi] }
      - { es: "Magari fossi un po' meno sognatore e un po' più realista!", en: "If only I were a bit less of a dreamer and a bit more realistic!", altEs: ["Magari fossi un po' meno sognatrice e un po' più realista!"], grammar: [g.magari-se-solo], vocab: [w.sognatore, w.realista] }
      - { es: "Un mondo senza guerre è un'utopia? Magari non lo fosse!", en: "A world without wars is a utopia? If only it weren't!", altEs: ["Un mondo senza guerre è un'utopia? Se solo non lo fosse!"], grammar: [g.magari-se-solo], vocab: [w.utopia, w.guerra] }
      - { es: "Se solo la mia famiglia fosse benestante, potrei studiare all'estero senza lavorare.", en: "If only my family were well-off, I could study abroad without working.", altEs: ["Magari la mia famiglia fosse benestante: potrei studiare all'estero senza lavorare."], grammar: [g.magari-se-solo, g.periodo-ipotetico-2], vocab: [w.benestante, w.estero] }
      - { es: "Magari avessi la sua immaginazione: vede un veliero in ogni nuvola!", en: "If only I had her imagination: she sees a sailing ship in every cloud!", altEs: ["Se solo avessi la sua immaginazione: vede un veliero in ogni nuvola!"], grammar: [g.magari-se-solo], vocab: [w.immaginazione, w.veliero, w.nuvola] }
      - { es: "Magari fosse vero!", en: "If only it were true!", altEs: ["Se solo fosse vero!"], altEn: ["I wish it were true!"], grammar: [g.magari-se-solo], vocab: [w.vero], error: { wrong: "Magari sia vero!", explain: "A wish with magari takes the congiuntivo imperfetto (fosse), never the present congiuntivo.", grammar: g.magari-se-solo } }
      - { es: "Vorrei avere più tempo.", en: "I'd like to have more time.", grammar: [g.volere-vorrei], vocab: [w.tempo], transform: { instruction: "Turn it into a wish with Magari…", answer: "Magari avessi più tempo!", alt: ["Se solo avessi più tempo!", "Magari avessi più tempo."], en: "If only I had more time!" } }
      - { es: "Purtroppo non abito a Napoli.", en: "Unfortunately I don't live in Naples.", grammar: [g.negation], vocab: [w.abitare], transform: { instruction: "Turn it into a wish with Magari…", answer: "Magari abitassi a Napoli!", alt: ["Se solo abitassi a Napoli!", "Magari vivessi a Napoli!"], en: "If only I lived in Naples!" } }
    exchanges:
      - q: { es: "Hai vinto alla lotteria?", en: "Did you win the lottery?" }
        a: { es: "Magari! Ho vinto solo dieci euro.", en: "I wish! I only won ten euros." }
        alt: ["Magari!", "Magari fosse vero!"]
        grammar: [g.magari-se-solo]
        vocab: [w.lotteria]
      - q: { es: "Ti piacerebbe vivere su una barca a vela?", en: "Would you like to live on a sailing boat?" }
        a: { es: "Magari! Se solo non soffrissi il mal di mare...", en: "I wish! If only I didn't get seasick..." }
        alt: ["Magari!", "Sì, ma soffro il mal di mare."]
        grammar: [g.magari-se-solo]
        vocab: [w.barca-a-vela, w.se-solo]
      - q: { es: "Pensi che il nuovo progetto funzionerà?", en: "Do you think the new project will work?" }
        a: { es: "Magari! Però non mi faccio illusioni.", en: "I hope so! But I'm not under any illusions." }
        alt: ["Lo spero, ma non mi faccio illusioni.", "Magari, ma ne dubito."]
        grammar: [g.magari-se-solo]
        vocab: [w.illusione, w.progetto]
      - q: { es: "Credi che un giorno si potranno prevedere tutte le eruzioni?", en: "Do you think one day it will be possible to predict every eruption?" }
        a: { es: "Magari fosse possibile! Per ora resta un sogno da idealista.", en: "If only it were possible! For now it remains an idealist's dream." }
        alt: ["Magari!", "Per ora no, purtroppo."]
        grammar: [g.magari-se-solo]
        vocab: [w.idealista, w.eruzione]
      - q: { es: "Qual è il tuo sogno?", en: "What's your dream?" }
        a: { es: "Una casa al mare e tanta tranquillità. Con un po' di fantasia, la vedo già!", en: "A house by the sea and lots of peace and quiet. With a bit of imagination, I can already see it!" }
        alt: ["Una casa al mare.", "Magari avessi una casa al mare!"]
        grammar: [g.magari-se-solo]
        vocab: [w.fantasia, w.casa-al-mare, w.tranquillità]
    texts:
      - title: "Cartolina dal Vesuvio"
        es: ["Ciao mamma, siamo saliti fino al cratere del Vesuvio!", "Magari ci fossi anche tu: da qui si vede tutto il golfo.", "Se solo non tirasse questo vento, resterei qui fino al tramonto."]
        en: ["Hi Mum, we've climbed all the way up to the crater of Vesuvius!", "If only you were here too: from up here you can see the whole bay.", "If only this wind weren't blowing, I'd stay here till sunset."]
        grammar: [g.magari-se-solo]
        vocab: [w.cratere, w.se-solo, w.golfo]
      - title: "Annuncio immobiliare"
        es: ["Vendesi villa lussuosa con vista sul golfo.", "Piscina, giardino e posto barca per il vostro yacht.", "Prezzo su richiesta: magari foste benestanti!"]
        en: ["Luxurious villa with a view over the bay for sale.", "Pool, garden and a mooring for your yacht.", "Price on request: if only you were well-off!"]
        grammar: [g.magari-se-solo, g.si-passivante]
        vocab: [w.lussuoso, w.yacht, w.benestante]
    spicy:
      - { es: "Magari mi guardassi come guardi quella pizza fritta!", en: "If only you looked at me the way you look at that fried pizza!", altEs: ["Se solo mi guardassi come guardi quella pizza fritta!"], grammar: [g.magari-se-solo], vocab: [w.guardare, w.pizza] }
      - { es: "Se solo fossi un po' meno timido, ti prenderei la mano anche sul sentiero del cratere.", en: "If only I were a bit less shy, I'd take your hand even on the crater path.", altEs: ["Se solo fossi un po' meno timida, ti prenderei la mano anche sul sentiero del cratere."], grammar: [g.magari-se-solo, g.periodo-ipotetico-2], vocab: [w.timido, w.sentiero, w.mano] }
      - { es: "Sogno a occhi aperti una cena con te in barca a vela; poi mi sveglio sul traghetto delle otto.", en: "I daydream about dinner with you on a sailing boat; then I wake up on the eight o'clock ferry.", altEs: ["Sogno a occhi aperti una cena con te in barca a vela, poi mi sveglio sul traghetto delle otto."], grammar: [g.present-are], vocab: [w.sognare-a-occhi-aperti, w.barca-a-vela, w.svegliarsi] }
      - { es: "Magari fossi io il tuo caffè: ti vedrei ogni mattina.", en: "If only I were your coffee: I'd see you every morning.", altEs: ["Magari fossi io il tuo caffè, così ti vedrei ogni mattina."], grammar: [g.magari-se-solo], vocab: [w.caffè, w.mattina] }
      - { es: "Volesse il cielo che il tuo numero fosse ancora libero!", en: "Heaven grant that your number is still free!", altEs: ["Magari il tuo numero fosse ancora libero!"], grammar: [g.magari-se-solo], vocab: [w.volesse-il-cielo, w.numero] }
  - id: b2.u03.l2
    title: Vorrei che tu venissi
    teach: [g.vorrei-che]
    vocab: [w.aspettativa, w.ritmo, w.equilibrio, w.benessere, w.accontentarsi, w.soddisfare, w.aspettarsi, w.stressato, w.serenità, w.routine, w.abitudinario, w.avventuroso, w.desiderare-che, w.spensierato, w.lentezza, w.deludere, w.tranquillità, w.solidarietà, w.noia, w.desideroso, w.monotonia]
    tip: "After a conditional (vorrei, preferirei, mi piacerebbe, sarebbe bello) the dependent verb goes into the congiuntivo imperfetto: vorrei che tu venissi, not 'che tu venga'."
    sentences:
      - { es: "Vorrei che tu venissi con me sul Vesuvio domenica.", en: "I'd like you to come up Vesuvius with me on Sunday.", altEs: ["Vorrei che venissi con me sul Vesuvio domenica.", "Mi piacerebbe che tu venissi con me sul Vesuvio domenica."], grammar: [g.vorrei-che], vocab: [w.venire] }
      - { es: "Preferirei che non avessi troppe aspettative su questa gita.", en: "I'd rather you didn't have too many expectations about this trip.", altEs: ["Preferirei che tu non avessi troppe aspettative su questa gita."], grammar: [g.vorrei-che], vocab: [w.aspettativa, w.gita] }
      - { es: "Mi piacerebbe che la vita avesse un ritmo più lento, come a Procida.", en: "I'd like life to have a slower pace, like in Procida.", altEs: ["Vorrei che la vita avesse un ritmo più lento, come a Procida."], grammar: [g.vorrei-che, g.piacere-intro], vocab: [w.ritmo, w.lento] }
      - { es: "Sarebbe bello che tutti trovassero un equilibrio tra lavoro e benessere.", en: "It would be nice if everyone found a balance between work and well-being.", altEs: ["Sarebbe bello se tutti trovassero un equilibrio tra lavoro e benessere."], grammar: [g.vorrei-che], vocab: [w.equilibrio, w.benessere] }
      - { es: "I miei genitori vorrebbero che mi accontentassi di un posto sicuro.", en: "My parents would like me to settle for a secure job.", altEs: ["I miei vorrebbero che mi accontentassi di un posto sicuro."], grammar: [g.vorrei-che], vocab: [w.accontentarsi, w.sicuro] }
      - { es: "Vorrei che il mio lavoro mi soddisfacesse di più.", en: "I wish my job satisfied me more.", altEs: ["Mi piacerebbe che il mio lavoro mi soddisfacesse di più."], grammar: [g.vorrei-che], vocab: [w.soddisfare, w.lavoro] }
      - { es: "Non vorrei che ti aspettassi un panorama perfetto: oggi ci sono le nuvole.", en: "I wouldn't want you to expect a perfect view: there are clouds today.", altEs: ["Non vorrei che ti aspettassi un panorama perfetto, perché oggi ci sono le nuvole."], grammar: [g.vorrei-che], vocab: [w.aspettarsi, w.panorama] }
      - { es: "Sono stressato: vorrei che qualcuno mi regalasse una settimana di serenità.", en: "I'm stressed: I wish someone would give me a week of peace of mind.", altEs: ["Sono stressata: vorrei che qualcuno mi regalasse una settimana di serenità."], grammar: [g.vorrei-che], vocab: [w.stressato, w.serenità, w.regalare] }
      - { es: "Vorrei che nella mia vita ci fosse meno routine e più avventura.", en: "I'd like there to be less routine and more adventure in my life.", altEs: ["Mi piacerebbe che nella mia vita ci fosse meno routine e più avventura."], grammar: [g.vorrei-che], vocab: [w.routine, w.avventura] }
      - { es: "Mio marito è abitudinario: vorrei che fosse un po' più avventuroso.", en: "My husband is a creature of habit: I wish he were a bit more adventurous.", altEs: ["Mia moglie è abitudinaria: vorrei che fosse un po' più avventurosa."], grammar: [g.vorrei-che], vocab: [w.abitudinario, w.avventuroso, w.marito] }
      - { es: "Desidererei che i miei figli crescessero spensierati.", en: "I would wish for my children to grow up carefree.", altEs: ["Vorrei che i miei figli crescessero spensierati."], grammar: [g.vorrei-che], vocab: [w.desiderare-che, w.spensierato, w.crescere] }
      - { es: "Avrei preferito che mi dicessi subito la verità.", en: "I would have preferred you to tell me the truth straight away.", altEs: ["Avrei preferito che mi avessi detto subito la verità."], grammar: [g.vorrei-che, g.condizionale-passato], vocab: [w.preferire, w.verità] }
      - { es: "Sarebbe ora che la lentezza tornasse di moda.", en: "It's about time slowness came back into fashion.", altEs: ["Sarebbe ora che la lentezza tornasse di moda!"], grammar: [g.vorrei-che], vocab: [w.lentezza, w.moda] }
      - { es: "Vorrei che tu venissi a cena da noi sabato.", en: "I'd like you to come to dinner at ours on Saturday.", altEs: ["Vorrei che venissi a cena da noi sabato.", "Mi farebbe piacere che tu venissi a cena da noi sabato."], grammar: [g.vorrei-che], vocab: [w.cena], error: { wrong: "Vorrei che tu venga a cena da noi sabato.", explain: "After the conditional vorrei, use the congiuntivo imperfetto (venissi), not the present (venga).", grammar: g.vorrei-che } }
      - { es: "Voglio che tu sia felice.", en: "I want you to be happy.", grammar: [g.congiuntivo-presente-forms], vocab: [w.felice], transform: { instruction: "Soften it with the conditional: Vorrei che…", answer: "Vorrei che tu fossi felice.", alt: ["Vorrei che fossi felice."], en: "I'd like you to be happy." } }
      - { es: "Mi piace che i turisti rispettino il sentiero.", en: "I like it that tourists respect the path.", grammar: [g.congiuntivo-wishes-emotion], vocab: [w.rispettare, w.sentiero], transform: { instruction: "Make it a wish: Mi piacerebbe che…", answer: "Mi piacerebbe che i turisti rispettassero il sentiero.", alt: ["Vorrei che i turisti rispettassero il sentiero."], en: "I'd like tourists to respect the path." } }
    exchanges:
      - q: { es: "Che cosa ti manca di più?", en: "What do you miss most?" }
        a: { es: "Un po' di tranquillità: vorrei che i vicini facessero meno rumore.", en: "A bit of peace and quiet: I wish the neighbours made less noise." }
        alt: ["La tranquillità.", "Vorrei che ci fosse più silenzio."]
        grammar: [g.vorrei-che]
        vocab: [w.tranquillità, w.vicino.n, w.rumore]
      - q: { es: "Che cosa vorresti dai tuoi colleghi?", en: "What would you like from your colleagues?" }
        a: { es: "Vorrei che ci fosse più solidarietà tra di noi.", en: "I'd like there to be more solidarity among us." }
        alt: ["Più solidarietà.", "Vorrei che mi aiutassero di più."]
        grammar: [g.vorrei-che]
        vocab: [w.solidarietà, w.collega]
      - q: { es: "Ti annoi in vacanza?", en: "Do you get bored on holiday?" }
        a: { es: "Un po': vorrei che ci fosse qualcosa da fare la sera, questa noia mi pesa.", en: "A bit: I wish there were something to do in the evenings, this boredom weighs on me." }
        alt: ["Sì, un po'.", "No, mi piace la monotonia delle vacanze."]
        grammar: [g.vorrei-che]
        vocab: [w.noia, w.annoiarsi]
      - q: { es: "Perché hai cambiato lavoro?", en: "Why did you change jobs?" }
        a: { es: "Ero desideroso di cambiare: avrei voluto che il capo mi desse più responsabilità.", en: "I was eager for a change: I would have liked the boss to give me more responsibility." }
        alt: ["Volevo cambiare.", "Avrei voluto che il capo mi desse più responsabilità."]
        grammar: [g.vorrei-che, g.modals-condizionale-passato]
        vocab: [w.desideroso, w.responsabilità]
      - q: { es: "Sei rimasta delusa dal Vesuvio?", en: "Were you disappointed by Vesuvius?" }
        a: { es: "Per niente! Il Vesuvio non delude mai: la salita è stata la parte più bella.", en: "Not at all! Vesuvius never disappoints: the climb was the best part." }
        alt: ["No, è stato bellissimo.", "Un po': vorrei che ci fossero state meno nuvole."]
        grammar: [g.vorrei-che]
        vocab: [w.deludere, w.salire]
    texts:
      - title: "Lettera al direttore del parco"
        es: ["Gentile direttore, sono una guida del Vesuvio.", "Vorrei che il sentiero restasse aperto anche la sera d'estate.", "Sarebbe bello che i visitatori potessero vedere il tramonto dal cratere."]
        en: ["Dear Director, I am a guide on Vesuvius.", "I would like the path to stay open in the evening in summer too.", "It would be lovely if visitors could see the sunset from the crater."]
        grammar: [g.vorrei-che, g.formal-letters]
        vocab: [w.sentiero, w.tramonto, w.visitatore]
      - title: "Buoni propositi"
        es: ["Basta con la monotonia!", "Quest'anno vorrei che ogni settimana ci fosse una piccola avventura.", "E mi piacerebbe che anche tu, amore mio abitudinario, mi seguissi."]
        en: ["Enough with the monotony!", "This year I'd like there to be a little adventure every week.", "And I'd love you, my creature-of-habit darling, to follow me too."]
        grammar: [g.vorrei-che]
        vocab: [w.monotonia, w.abitudinario, w.avventura]
    spicy:
      - { es: "Vorrei che mi chiamassi più spesso, e non solo quando ti serve un passaggio.", en: "I'd like you to call me more often, and not only when you need a lift.", altEs: ["Vorrei che mi telefonassi più spesso, e non solo quando ti serve un passaggio."], grammar: [g.vorrei-che], vocab: [w.chiamare, w.passaggio] }
      - { es: "Preferirei che non mi guardassi così mentre mangio la pizza a portafoglio.", en: "I'd rather you didn't look at me like that while I eat my folded pizza.", altEs: ["Preferirei che tu non mi guardassi così mentre mangio la pizza a portafoglio."], grammar: [g.vorrei-che], vocab: [w.preferire, w.pizza], note: "Pizza a portafoglio: a pizza folded in four and eaten on the street in Naples." }
      - { es: "Mi piacerebbe che la prossima gita fosse solo per due.", en: "I'd like the next trip to be just for two.", altEs: ["Vorrei che la prossima gita fosse solo per due."], grammar: [g.vorrei-che], vocab: [w.gita] }
      - { es: "Sarebbe meglio che tu non mi sorridessi così: devo concentrarmi sul sentiero.", en: "It would be better if you didn't smile at me like that: I need to concentrate on the path.", altEs: ["Sarebbe meglio che non mi sorridessi così: devo stare attento al sentiero."], grammar: [g.vorrei-che], vocab: [w.sorridere, w.sentiero] }
      - { es: "Non vorrei che ti facessi strane idee: ti ho offerto il gelato solo per il tuo bene.", en: "I wouldn't want you to get funny ideas: I only bought you the ice cream for your own good.", altEs: ["Non vorrei che ti facessi idee strane: ti ho offerto il gelato solo per il tuo bene."], grammar: [g.vorrei-che], vocab: [w.idea, w.gelato] }
  - id: b2.u03.l3
    title: Credevo che fosse spento
    teach: [g.concordanza-congiuntivo]
    vocab: [w.meraviglioso, w.favoloso, w.incredibile, w.invidiare, w.puntare, w.aspirazione, w.eccezionale, w.perfezione, w.impazzire, w.magnifico, w.splendido, w.concordanza, w.pessimismo, w.ambire, w.straordinario.adj, w.fuori-di-testa, w.ottimismo, w.pazzo]
    tip: "Present trigger → congiuntivo presente or passato (credo che sia, credo che sia stato); past or conditional trigger → imperfetto or trapassato (credevo che fosse, credevo che fosse stato). A later action after a past trigger takes the condizionale passato: pensavo che sarebbe venuto."
    sentences:
      - { es: "Credo che il Vesuvio sia ancora attivo.", en: "I believe Vesuvius is still active.", altEs: ["Penso che il Vesuvio sia ancora attivo."], grammar: [g.concordanza-congiuntivo, g.congiuntivo-opinion], vocab: [w.attivo] }
      - { es: "Credevo che il Vesuvio fosse spento da secoli.", en: "I thought Vesuvius had been extinct for centuries.", altEs: ["Pensavo che il Vesuvio fosse spento da secoli."], grammar: [g.concordanza-congiuntivo], vocab: [w.spegnere, w.secolo] }
      - { es: "Pensavo che ci fosse una funivia fino al cratere.", en: "I thought there was a cable car up to the crater.", altEs: ["Credevo che ci fosse una funivia fino al cratere."], grammar: [g.concordanza-congiuntivo], vocab: [w.funivia, w.cratere] }
      - { es: "Spero che tu abbia fatto delle foto splendide.", en: "I hope you took some splendid photos.", altEs: ["Spero che tu abbia scattato delle foto splendide."], grammar: [g.concordanza-congiuntivo, g.congiuntivo-passato], vocab: [w.splendido, w.foto] }
      - { es: "Speravo che aveste visto il tramonto dal cratere.", en: "I was hoping you had seen the sunset from the crater.", altEs: ["Speravo che voi aveste visto il tramonto dal cratere."], grammar: [g.concordanza-congiuntivo, g.congiuntivo-trapassato], vocab: [w.tramonto] }
      - { es: "Non immaginavo che il panorama fosse così meraviglioso.", en: "I didn't imagine the view would be so wonderful.", altEs: ["Non pensavo che il panorama fosse così meraviglioso."], grammar: [g.concordanza-congiuntivo], vocab: [w.meraviglioso, w.panorama] }
      - { es: "Ero sicuro che avrebbe piovuto, invece è stata una giornata favolosa.", en: "I was sure it would rain, but it turned out to be a fabulous day.", altEs: ["Ero sicura che avrebbe piovuto, invece è stata una giornata favolosa."], grammar: [g.concordanza-congiuntivo, g.condizionale-passato], vocab: [w.favoloso, w.piovere], note: "Ero sicuro che expresses certainty, so no congiuntivo; the later action takes the condizionale passato." }
      - { es: "Mi sembra incredibile che tu non sia mai salito sul Vesuvio.", en: "It seems incredible to me that you've never been up Vesuvius.", altEs: ["Mi sembra incredibile che tu non sia mai salita sul Vesuvio."], grammar: [g.concordanza-congiuntivo, g.congiuntivo-passato], vocab: [w.incredibile, w.salire] }
      - { es: "Mi sembrava incredibile che non fossi mai salito sul Vesuvio.", en: "It seemed incredible to me that you had never been up Vesuvius.", altEs: ["Mi sembrava incredibile che non fossi mai salita sul Vesuvio."], grammar: [g.concordanza-congiuntivo, g.congiuntivo-trapassato], vocab: [w.incredibile, w.salire] }
      - { es: "Lo invidiavo perché puntava sempre in alto, come se niente fosse impossibile.", en: "I envied him because he always aimed high, as if nothing were impossible.", altEs: ["La invidiavo perché puntava sempre in alto, come se niente fosse impossibile."], grammar: [g.concordanza-congiuntivo, g.come-se], vocab: [w.invidiare, w.puntare] }
      - { es: "Non pensavo che le sue aspirazioni fossero così alte.", en: "I didn't think her aspirations were so high.", altEs: ["Non credevo che le sue aspirazioni fossero così alte."], grammar: [g.concordanza-congiuntivo], vocab: [w.aspirazione] }
      - { es: "È stata un'impresa eccezionale: nessuno credeva che ce l'avrebbe fatta.", en: "It was an exceptional feat: nobody believed she would make it.", altEs: ["È stata un'impresa eccezionale: nessuno pensava che ce l'avrebbe fatta."], grammar: [g.concordanza-congiuntivo, g.condizionale-passato], vocab: [w.eccezionale, w.impresa] }
      - { es: "Voleva che tutto fosse alla perfezione, e siamo quasi impazziti.", en: "She wanted everything to be perfect, and we nearly went mad.", altEs: ["Voleva che tutto fosse perfetto, e siamo quasi impazziti."], grammar: [g.concordanza-congiuntivo], vocab: [w.perfezione, w.impazzire] }
      - { es: "Pensavo che fosse troppo tardi per salire.", en: "I thought it was too late to go up.", altEs: ["Credevo che fosse troppo tardi per salire."], grammar: [g.concordanza-congiuntivo], vocab: [w.tardi], error: { wrong: "Pensavo che sia troppo tardi per salire.", explain: "A past trigger (pensavo) needs the congiuntivo imperfetto: fosse, not sia.", grammar: g.concordanza-congiuntivo } }
      - { es: "Penso che il panorama sia magnifico.", en: "I think the view is magnificent.", altEs: ["Credo che il panorama sia magnifico."], grammar: [g.congiuntivo-opinion], vocab: [w.magnifico, w.panorama], transform: { instruction: "Put the main verb in the imperfetto: Pensavo che…", answer: "Pensavo che il panorama fosse magnifico.", alt: ["Credevo che il panorama fosse magnifico."], en: "I thought the view was magnificent." } }
      - { es: "Credo che abbiano scelto il sentiero giusto.", en: "I think they chose the right path.", altEs: ["Penso che abbiano scelto il sentiero giusto."], grammar: [g.congiuntivo-passato], vocab: [w.scegliere, w.sentiero], transform: { instruction: "Put the main verb in the imperfetto: Credevo che…", answer: "Credevo che avessero scelto il sentiero giusto.", alt: ["Pensavo che avessero scelto il sentiero giusto."], en: "I thought they had chosen the right path." } }
    exchanges:
      - q: { es: "Com'era la vista dal cratere?", en: "What was the view from the crater like?" }
        a: { es: "Splendida: non pensavo che si vedesse anche Capri.", en: "Splendid: I didn't think you could see Capri too." }
        alt: ["Splendida!", "Meravigliosa: si vedeva tutto il golfo."]
        grammar: [g.concordanza-congiuntivo]
        vocab: [w.splendido, w.cratere]
      - q: { es: "Come va lo studio dell'italiano?", en: "How's your Italian going?" }
        a: { es: "Insomma: pensavo che la concordanza dei tempi fosse facile, invece è un incubo.", en: "So-so: I thought the sequence of tenses was easy, but it's a nightmare." }
        alt: ["Bene, ma la concordanza dei tempi è difficile.", "Insomma."]
        grammar: [g.concordanza-congiuntivo]
        vocab: [w.concordanza]
      - q: { es: "Perché tuo fratello è così pessimista?", en: "Why is your brother so pessimistic?" }
        a: { es: "Non lo so: credevo che il suo pessimismo fosse passato, invece è peggiorato.", en: "I don't know: I thought his pessimism had passed, but it's got worse." }
        alt: ["Non lo so.", "È sempre stato così."]
        grammar: [g.concordanza-congiuntivo]
        vocab: [w.pessimismo, w.pessimista]
      - q: { es: "A che cosa ambisce Chiara?", en: "What does Chiara aspire to?" }
        a: { es: "Ambisce a lavorare all'Osservatorio Vesuviano, e credo che ce la farà: il suo ottimismo è contagioso.", en: "She aspires to work at the Vesuvius Observatory, and I think she'll make it: her optimism is contagious." }
        alt: ["A lavorare all'Osservatorio Vesuviano.", "Credo che voglia diventare vulcanologa."]
        grammar: [g.concordanza-congiuntivo]
        vocab: [w.ambire, w.ottimismo]
      - q: { es: "Ti è piaciuta la festa di ieri?", en: "Did you like yesterday's party?" }
        a: { es: "Straordinaria! Non immaginavo che i tuoi amici fossero così fuori di testa.", en: "Extraordinary! I had no idea your friends were so crazy." }
        alt: ["Moltissimo!", "Straordinaria, ma i tuoi amici sono pazzi."]
        grammar: [g.concordanza-congiuntivo]
        vocab: [w.straordinario.adj, w.fuori-di-testa, w.pazzo]
    texts:
      - title: "Recensione online"
        es: ["Pensavo che la salita fosse più faticosa, invece è adatta quasi a tutti.", "La guida ci ha spiegato che il vulcano è sorvegliato giorno e notte.", "Credo che sia una delle esperienze più straordinarie della Campania."]
        en: ["I thought the climb would be harder, but it's suitable for almost everyone.", "The guide explained to us that the volcano is monitored day and night.", "I think it's one of the most extraordinary experiences in Campania."]
        grammar: [g.concordanza-congiuntivo]
        vocab: [w.salire, w.sorvegliare, w.straordinario.adj]
      - title: "Messaggio da Ercolano"
        es: ["Sono rimasta senza parole.", "Non immaginavo che la città fosse conservata così bene.", "Spero che tu ci venga presto con me!"]
        en: ["I was left speechless.", "I didn't imagine the town was so well preserved.", "I hope you come here with me soon!"]
        grammar: [g.concordanza-congiuntivo]
        vocab: [w.conservare]
    spicy:
      - { es: "Pensavo che fossi pazzo a portarmi sul Vesuvio all'alba; poi ho visto il sole sul golfo e ho capito.", en: "I thought you were mad to take me up Vesuvius at dawn; then I saw the sun over the bay and I understood.", altEs: ["Pensavo che fossi pazza a portarmi sul Vesuvio all'alba; poi ho visto il sole sul golfo e ho capito."], grammar: [g.concordanza-congiuntivo], vocab: [w.pazzo, w.alba] }
      - { es: "Credevo che la perfezione non esistesse, poi hai cucinato la genovese.", en: "I thought perfection didn't exist, then you cooked the genovese.", altEs: ["Pensavo che la perfezione non esistesse, poi hai cucinato la genovese."], grammar: [g.concordanza-congiuntivo], vocab: [w.perfezione, w.cucinare], note: "La genovese: a Neapolitan pasta sauce of slow-cooked onions and meat." }
      - { es: "Non immaginavo che sapessi baciare così bene... cioè, cucinare.", en: "I had no idea you could kiss so well... I mean, cook.", altEs: ["Non pensavo che sapessi baciare così bene... cioè, cucinare."], grammar: [g.concordanza-congiuntivo], vocab: [w.baciare, w.cucinare] }
      - { es: "Spero che tu abbia dormito bene; io no, pensavo a te.", en: "I hope you slept well; I didn't, I was thinking about you.", altEs: ["Spero che tu abbia dormito bene. Io no: pensavo a te."], grammar: [g.concordanza-congiuntivo, g.congiuntivo-passato], vocab: [w.dormire] }
      - { es: "Mi sembra incredibile che tu sia ancora single; ai miei amici sembrava impossibile che lo fossi io.", en: "It seems incredible to me that you're still single; my friends thought it was impossible that I was.", altEs: ["Mi pare incredibile che tu sia ancora single; ai miei amici sembrava impossibile che lo fossi io."], grammar: [g.concordanza-congiuntivo], vocab: [w.incredibile, w.single] }
  - id: b2.u03.l4
    title: Ai miei tempi
    teach: [g.magari-se-solo, g.concordanza-congiuntivo]
    vocab: [w.ai-miei-tempi, w.pensionato, w.tempi-doro, w.giovinezza, w.gioventù, w.infanzia-felice, w.invecchiare, w.vecchiaia, w.nel-passato, w.malinconico, w.malinconia, w.nostalgico, w.rimpiangere-il-passato, w.ringiovanire, w.epoca-doro, w.funicolare]
    tip: "Regrets about the past: magari / se solo + congiuntivo trapassato. Magari l'avessi saputo prima! Careful: magari + indicative means 'maybe' (magari viene domani)."
    sentences:
      - { es: "Magari l'avessi saputo prima!", en: "If only I'd known before!", altEs: ["Se solo l'avessi saputo prima!"], grammar: [g.magari-se-solo, g.congiuntivo-trapassato], vocab: [w.sapere] }
      - { es: "Se solo fossimo partiti un giorno prima, avremmo visto l'alba dal cratere!", en: "If only we'd left a day earlier, we would have seen the dawn from the crater!", altEs: ["Magari fossimo partiti un giorno prima: avremmo visto l'alba dal cratere!"], grammar: [g.magari-se-solo, g.periodo-ipotetico-3], vocab: [w.alba, w.cratere] }
      - { es: "Ai miei tempi sul Vesuvio si saliva con la funicolare.", en: "In my day you went up Vesuvius on the funicular.", altEs: ["Ai miei tempi si saliva sul Vesuvio con la funicolare."], grammar: [g.imperfetto-uses, g.si-impersonale], vocab: [w.ai-miei-tempi, w.funicolare], note: "The Vesuvius funicular ran from 1880 until the 1944 eruption; it inspired the song Funiculì, funiculà." }
      - { es: "Mio nonno, pensionato da vent'anni, rimpiange i tempi d'oro del porto.", en: "My grandfather, retired for twenty years, misses the golden days of the port.", altEs: ["Mio nonno, in pensione da vent'anni, rimpiange i tempi d'oro del porto."], grammar: [g.present-are], vocab: [w.pensionato, w.tempi-doro, w.porto] }
      - { es: "Magari potessi rivivere la mia giovinezza per un solo giorno!", en: "If only I could relive my youth for just one day!", altEs: ["Se solo potessi rivivere la mia giovinezza per un giorno!"], grammar: [g.magari-se-solo], vocab: [w.giovinezza] }
      - { es: "La gioventù passa in fretta: magari me ne fossi accorto prima!", en: "Youth goes by quickly: if only I'd realised sooner!", altEs: ["La gioventù passa in fretta: magari me ne fossi accorta prima!"], grammar: [g.magari-se-solo, g.congiuntivo-trapassato], vocab: [w.gioventù, w.accorgersi] }
      - { es: "Ha avuto un'infanzia felice a Torre del Greco, ai piedi del vulcano.", en: "She had a happy childhood in Torre del Greco, at the foot of the volcano.", altEs: ["Ha avuto un'infanzia felice a Torre del Greco, sotto il vulcano."], grammar: [g.passato-prossimo-avere], vocab: [w.infanzia-felice, w.vulcano] }
      - { es: "Non voglio invecchiare con il rimpianto di non aver mai viaggiato.", en: "I don't want to grow old regretting never having travelled.", altEs: ["Non voglio invecchiare con il rimpianto di non avere mai viaggiato."], grammar: [g.past-infinitive], vocab: [w.invecchiare, w.rimpianto] }
      - { es: "La vecchiaia non mi fa paura, purché ci sia la salute.", en: "Old age doesn't frighten me, as long as I have my health.", altEs: ["Non ho paura della vecchiaia, purché ci sia la salute."], grammar: [g.congiuntivo-conjunctions], vocab: [w.vecchiaia, w.salute] }
      - { es: "Nel passato il Vesuvio ha distrutto molti paesi, eppure la gente è sempre tornata.", en: "In the past Vesuvius destroyed many villages, and yet people always came back.", altEs: ["In passato il Vesuvio ha distrutto molti paesi, eppure la gente è sempre tornata."], grammar: [g.passato-prossimo-essere], vocab: [w.nel-passato, w.distruggere] }
      - { es: "Questa canzone mi rende malinconico: magari tornassero quegli anni!", en: "This song makes me melancholy: if only those years would come back!", altEs: ["Questa canzone mi rende malinconica: magari tornassero quegli anni!"], grammar: [g.magari-se-solo], vocab: [w.malinconico, w.canzone] }
      - { es: "Che malinconia! Se solo l'estate durasse tutto l'anno!", en: "How melancholy! If only summer lasted all year!", altEs: ["Che malinconia! Magari l'estate durasse tutto l'anno!"], grammar: [g.magari-se-solo], vocab: [w.malinconia, w.estate] }
      - { es: "Sei nostalgico? — Un po': rimpiango il passato, ma vivo nel presente.", en: "Are you nostalgic? — A bit: I miss the past, but I live in the present.", altEs: ["Sei nostalgica? — Un po': rimpiango il passato, ma vivo nel presente."], grammar: [g.present-ere-ire], vocab: [w.nostalgico, w.rimpiangere-il-passato] }
      - { es: "Mi sembra che tu sia ringiovanito di dieci anni!", en: "You look ten years younger to me!", altEs: ["Mi sembra che tu sia ringiovanita di dieci anni!", "Mi pare che tu sia ringiovanito di dieci anni!"], grammar: [g.concordanza-congiuntivo, g.congiuntivo-passato], vocab: [w.ringiovanire], transform: { instruction: "Put the main verb in the imperfetto: Mi sembrava che…", answer: "Mi sembrava che tu fossi ringiovanito di dieci anni!", alt: ["Mi sembrava che tu fossi ringiovanita di dieci anni!", "Mi sembrava che fossi ringiovanito di dieci anni!"], en: "You looked ten years younger to me!" } }
      - { es: "Magari fossi venuto con noi!", en: "If only you'd come with us!", altEs: ["Magari fossi venuta con noi!", "Se solo fossi venuto con noi!"], grammar: [g.magari-se-solo, g.congiuntivo-trapassato], vocab: [w.venire], error: { wrong: "Magari sei venuto con noi!", explain: "A regret about the past needs magari + congiuntivo trapassato (fossi venuto); magari + indicative means 'maybe'.", grammar: g.magari-se-solo } }
      - { es: "Non sono andato a vedere il Napoli di Maradona.", en: "I didn't go and see Maradona's Napoli.", altEs: ["Non sono andata a vedere il Napoli di Maradona."], grammar: [g.passato-prossimo-essere], vocab: [w.andare], transform: { instruction: "Turn it into a regret with Magari…", answer: "Magari fossi andato a vedere il Napoli di Maradona!", alt: ["Magari fossi andata a vedere il Napoli di Maradona!", "Se solo fossi andato a vedere il Napoli di Maradona!"], en: "If only I'd gone to see Maradona's Napoli!" } }
    exchanges:
      - q: { es: "Com'era Napoli negli anni Ottanta?", en: "What was Naples like in the eighties?" }
        a: { es: "Era l'epoca d'oro del calcio, con Maradona: magari tu l'avessi visto giocare!", en: "It was the golden age of football, with Maradona: if only you'd seen him play!" }
        alt: ["Era l'epoca d'oro del calcio.", "Magari l'avessi vista!"]
        grammar: [g.magari-se-solo, g.congiuntivo-trapassato]
        vocab: [w.epoca-doro, w.calcio]
      - q: { es: "Ti manca la tua infanzia?", en: "Do you miss your childhood?" }
        a: { es: "Un po': magari potessi tornare a quelle estati spensierate!", en: "A bit: if only I could go back to those carefree summers!" }
        alt: ["Un po'.", "Sì, ho avuto un'infanzia felice."]
        grammar: [g.magari-se-solo]
        vocab: [w.infanzia, w.spensierato]
      - q: { es: "Che cosa fa tuo padre adesso?", en: "What does your father do now?" }
        a: { es: "È pensionato e passa le giornate a raccontare com'era la vita ai suoi tempi.", en: "He's retired and spends his days telling everyone what life was like in his day." }
        alt: ["È in pensione.", "È pensionato e fa il nonno a tempo pieno."]
        grammar: [g.imperfetto-uses]
        vocab: [w.pensionato]
      - q: { es: "Hai mai visto il Vesuvio in eruzione?", en: "Have you ever seen Vesuvius erupting?" }
        a: { es: "No, magari! L'ultima eruzione è del 1944, molto prima che nascessi.", en: "No, I wish! The last eruption was in 1944, long before I was born." }
        alt: ["No, mai.", "No: l'ultima eruzione è stata nel 1944."]
        grammar: [g.magari-se-solo, g.prima-che-prima-di]
        vocab: [w.eruzione]
    texts:
      - title: "Il diario del nonno"
        es: ["Nel 1944 avevo sei anni e ho visto la lava scendere verso San Sebastiano.", "Ai miei tempi non c'erano le guide: si saliva a piedi, senza biglietto.", "Magari i miei nipoti avessero la stessa curiosità che avevo io!"]
        en: ["In 1944 I was six and I saw the lava flowing down towards San Sebastiano.", "In my day there were no guides: you walked up, without a ticket.", "If only my grandchildren had the same curiosity I had!"]
        grammar: [g.magari-se-solo, g.imperfetto-uses]
        vocab: [w.ai-miei-tempi, w.lava, w.nipote]
      - title: "Canzone napoletana"
        es: ["Questa canzone parla di un emigrante nostalgico.", "Vorrebbe che la sua giovinezza tornasse, insieme al mare di Napoli.", "Ogni volta che la sento, mi viene una malinconia dolcissima."]
        en: ["This song is about a nostalgic emigrant.", "He wishes his youth would return, together with the sea of Naples.", "Every time I hear it, I get a very sweet melancholy."]
        grammar: [g.vorrei-che]
        vocab: [w.nostalgico, w.giovinezza, w.malinconia]
    spicy:
      - { es: "Magari ti avessi conosciuto prima: avrei risparmiato anni di appuntamenti noiosi.", en: "If only I'd met you sooner: I'd have saved myself years of boring dates.", altEs: ["Magari ti avessi conosciuta prima: avrei risparmiato anni di appuntamenti noiosi."], grammar: [g.magari-se-solo, g.congiuntivo-trapassato], vocab: [w.conoscere, w.appuntamento] }
      - { es: "Ai miei tempi si corteggiava con le serenate; tu mi mandi la faccina di un vulcano.", en: "In my day people courted with serenades; you send me a volcano emoji.", altEs: ["Ai miei tempi si corteggiava con le serenate, e tu mi mandi la faccina di un vulcano."], grammar: [g.imperfetto-uses, g.si-impersonale], vocab: [w.ai-miei-tempi, w.vulcano] }
      - { es: "Da quando esco con te, mi sembra di essere ringiovanito di dieci anni.", en: "Since I've been going out with you, I feel ten years younger.", altEs: ["Da quando esco con te, mi sembra di essere ringiovanita di dieci anni."], grammar: [g.da-since], vocab: [w.ringiovanire, w.uscire] }
      - { es: "Se solo avessi messo le scarpe giuste, ti avrei seguito fino al cratere.", en: "If only I'd worn the right shoes, I would have followed you all the way to the crater.", altEs: ["Se solo avessi messo le scarpe giuste, ti avrei seguita fino al cratere."], grammar: [g.magari-se-solo, g.periodo-ipotetico-3], vocab: [w.scarpa, w.seguire] }
      - { es: "Mia nonna dice che ai suoi tempi un bacio voleva dire matrimonio; per fortuna i tempi d'oro sono finiti.", en: "My grandmother says that in her day a kiss meant marriage; luckily the golden days are over.", altEs: ["Mia nonna dice che ai suoi tempi un bacio significava matrimonio; per fortuna i tempi d'oro sono finiti."], grammar: [g.imperfetto-uses], vocab: [w.bacio, w.tempi-doro] }
dialogues:
  - id: b2.u03.d1
    title: Sul sentiero del cratere
    context: Rosaria, a tourist, climbs the path to the crater of Vesuvius with Tonino, a local guide.
    lines:
      - { speaker: Rosaria, es: "Manca ancora tanto? Pensavo che il sentiero fosse più corto.", en: "Is it much further? I thought the path was shorter." }
      - { speaker: Tonino, es: "Venti minuti. Magari ci fosse ancora la funicolare, eh?", en: "Twenty minutes. If only the funicular were still here, eh?" }
      - { speaker: Rosaria, es: "C'era una funicolare? Non lo sapevo!", en: "There was a funicular? I didn't know that!" }
      - { speaker: Tonino, es: "Sì, ai tempi di mio nonno. Ne parlava sempre con malinconia, come dei tempi d'oro.", en: "Yes, in my grandfather's day. He always talked about it with melancholy, like the golden days." }
      - { speaker: Rosaria, es: "Magari l'avessi presa anch'io! Comunque, vorrei che mi raccontasse qualcosa del vulcano.", en: "If only I'd taken it too! Anyway, I'd like you to tell me something about the volcano." }
      - { speaker: Tonino, es: "Volentieri. Il Vesuvio è ancora attivo: l'Osservatorio lo sorveglia giorno e notte.", en: "Gladly. Vesuvius is still active: the Observatory monitors it day and night." }
      - { speaker: Rosaria, es: "Ancora attivo? Speravo che fosse spento!", en: "Still active? I was hoping it was extinct!" }
      - { speaker: Tonino, es: "Magari! Ma non si preoccupi: l'ultima eruzione è stata nel 1944.", en: "If only! But don't worry: the last eruption was in 1944." }
      - { speaker: Rosaria, es: "Ecco il cratere... è meraviglioso. Non immaginavo che si vedesse tutto il golfo.", en: "Here's the crater... it's wonderful. I didn't imagine you could see the whole bay." }
      - { speaker: Tonino, es: "Nelle giornate limpide si vede anche Capri. Vorrei che tutti i miei clienti avessero il suo entusiasmo.", en: "On clear days you can see Capri too. I wish all my clients had your enthusiasm." }
    questions:
      - { q: "Che cosa pensava Rosaria del sentiero?", options: ["Che fosse più corto.", "Che fosse chiuso.", "Che fosse più facile in funicolare."], answer: 0, explain: "Pensavo che il sentiero fosse più corto." }
      - { q: "Chi parlava della funicolare con malinconia?", options: ["Rosaria.", "Il nonno di Tonino.", "Il direttore dell'Osservatorio."], answer: 1, explain: "Ai tempi di mio nonno. Ne parlava sempre con malinconia." }
      - { q: "Quando c'è stata l'ultima eruzione del Vesuvio?", options: ["Nel 79 d.C.", "Nel 1944.", "Nel 2017."], answer: 1, explain: "L'ultima eruzione è stata nel 1944." }
      - { q: "Che cosa si vede dal cratere nelle giornate limpide?", options: ["Roma.", "Capri.", "La Sicilia."], answer: 1, explain: "Nelle giornate limpide si vede anche Capri." }
writing:
  - task: "Write a short text full of wishes and daydreams: your dream life by the sea (magari…, se solo… + congiuntivo imperfetto)."
    min: 80
    max: 140
    use: [w.se-solo, w.casa-al-mare, w.barca-a-vela, w.sognare-a-occhi-aperti, w.illudersi]
    grammar: [g.magari-se-solo]
    expect:
      - { pattern: "\\bmagari\\s+(\\S+\\s+){0,2}(fosse|fossi|avessi|avesse|potessi|potesse|\\S+(asse|esse|isse|assi|essi|issi))\\b|\\bse solo\\b", hint: "Use magari / se solo + congiuntivo imperfetto: magari avessi…, se solo potessi…" }
    model: { es: "Ogni tanto sogno a occhi aperti. Magari avessi una casa al mare sulla costiera, con una terrazza piena di limoni! Se solo potessi lavorare da lì, invece che in un ufficio grigio in città. Magari avessi anche una barca a vela per andare a Capri ogni fine settimana. Se solo il mio stipendio fosse un po' più alto! Lo so, non bisogna illudersi: sono una sognatrice, non una realista. Però sognare non costa niente, e qualche volta i sogni si avverano. Magari!", en: "Every now and then I daydream. If only I had a house by the sea on the coast, with a terrace full of lemon trees! If only I could work from there, instead of in a grey office in the city. If only I had a sailing boat too, to go to Capri every weekend. If only my salary were a bit higher! I know, you shouldn't fool yourself: I'm a dreamer, not a realist. But dreaming costs nothing, and sometimes dreams come true. If only!" }
  - task: "Write a message to your partner or a family member about how you would like things to change at home (vorrei che tu…, mi piacerebbe che…)."
    min: 80
    max: 140
    use: [w.equilibrio, w.stressato, w.serenità, w.routine, w.ritmo]
    grammar: [g.vorrei-che]
    expect:
      - { pattern: "\\b(vorrei|vorremmo|mi piacerebbe|preferirei|sarebbe bello) che\\b", hint: "Use vorrei che / mi piacerebbe che + congiuntivo imperfetto." }
      - { pattern: "\\b(fosse|fossi|avessi|avesse|potessimo|\\S+(asse|esse|isse|assi|essi|issi|assimo|essimo|issimo))\\b", hint: "Use the congiuntivo imperfetto: tornassi, fosse, trovassimo…" }
    model: { es: "Amore, ultimamente siamo tutti e due troppo stressati. Vorrei che trovassimo un nuovo equilibrio tra lavoro e vita privata. Mi piacerebbe che tu tornassi a casa prima la sera, così potremmo cenare insieme con calma. Vorrei anche che il weekend non fosse sempre pieno di impegni: preferirei che ci prendessimo del tempo solo per noi. Questo ritmo e questa routine mi pesano. Che ne dici se il mese prossimo andiamo qualche giorno a Napoli? Vorrei che salissimo insieme sul Vesuvio e che ritrovassimo un po' di serenità.", en: "Darling, lately we've both been too stressed. I'd like us to find a new balance between work and private life. I'd like you to come home earlier in the evening, so we could have dinner together calmly. I'd also like the weekend not to be always full of commitments: I'd rather we took some time just for us. This pace and this routine weigh on me. How about going to Naples for a few days next month? I'd like us to climb Vesuvius together and find a bit of peace again." }
  - task: "Write about your climb up Vesuvius: what you believed beforehand and what you discovered, using the right congiuntivo tense after past verbs (credevo che fosse…, non immaginavo che si vedesse…)."
    min: 80
    max: 140
    use: [w.incredibile, w.straordinario.adj, w.funicolare, w.aspettarsi, w.meraviglioso]
    grammar: [g.concordanza-congiuntivo]
    expect:
      - { pattern: "\\b(credevo|pensavo|immaginavo|non sapevo|temevo|speravo|mi aspettavo|non mi aspettavo|non immaginavo|sembrava) che\\b", hint: "Use a past verb + che: credevo che…, non immaginavo che…" }
      - { pattern: "\\b(fosse|fossero|avesse|avessero|ci fosse|\\S+(asse|esse|isse|assero|essero|issero))\\b", hint: "Use the congiuntivo imperfetto after a past verb: fosse, vedesse…" }
    model: { es: "Ieri sono salito sul Vesuvio. Credevo che fosse un vulcano spento da secoli, invece la guida ci ha spiegato che è ancora attivo e che l'ultima eruzione è stata nel 1944. Non mi aspettavo che la salita fosse così faticosa: pensavo che ci fosse ancora la funicolare, ma è stata chiusa molti anni fa. Arrivati in cima, però, il panorama era incredibile. Non immaginavo che si vedesse tutto il golfo di Napoli, fino a Capri! Era come se il mondo fosse ai miei piedi. Un'esperienza davvero straordinaria.", en: "Yesterday I climbed Vesuvius. I thought it was a volcano that had been extinct for centuries, but the guide explained that it's still active and that the last eruption was in 1944. I didn't expect the climb to be so tiring: I thought the funicular was still there, but it closed many years ago. At the top, though, the view was incredible. I never imagined you could see the whole Bay of Naples, as far as Capri! It was as if the world were at my feet. A truly extraordinary experience." }
  - task: "An elderly Neapolitan remembers the past. Write his or her monologue, full of nostalgia: ai miei tempi…, magari…, vorrei che i giovani…, come se…"
    min: 80
    max: 140
    use: [w.ai-miei-tempi, w.giovinezza, w.nostalgico, w.invecchiare, w.malinconia]
    grammar: [g.magari-se-solo, g.concordanza-congiuntivo]
    expect:
      - { pattern: "ai miei tempi", hint: "Start your memories: Ai miei tempi…" }
      - { pattern: "\\bmagari\\b|\\bse solo\\b|\\bvorrei che\\b|\\bcome se\\b", hint: "Add a wish or comparison: magari…, vorrei che…, come se…" }
    model: { es: "Ai miei tempi Napoli era diversa. Da giovane passavo le serate al porto con gli amici, e non avevamo bisogno di niente per essere felici. Oggi i ragazzi guardano sempre il telefono, come se il mondo fosse lì dentro. Vorrei che i miei nipoti capissero quanto era bella la vita semplice. Magari potessi tornare alla mia giovinezza, anche solo per un giorno! Non sono un vecchio nostalgico, eh: so che invecchiare fa parte della vita. Però ogni tanto mi prende un po' di malinconia, e allora vado a guardare il mare.", en: "In my day Naples was different. When I was young I spent my evenings at the port with my friends, and we didn't need anything to be happy. Today young people are always looking at their phones, as if the world were in there. I wish my grandchildren understood how beautiful the simple life was. If only I could go back to my youth, even just for a day! I'm not a nostalgic old man, mind: I know that growing old is part of life. But every now and then I feel a bit melancholy, and then I go and look at the sea." }
