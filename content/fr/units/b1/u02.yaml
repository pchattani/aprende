id: b1.u02
title: "La Bonne Mère, qui veille sur Marseille"
lessons:
  - id: b1.u02.l1
    title: La basilique qui domine la ville
    teach: [g.relative-qui-que]
    tip: "Look at what follows: a verb → qui (la statue qui brille); a subject → que (la vue que j'aime)."
    vocab: [w.basilique, w.statue, w.doré, w.dominer, w.surmonter, w.mesurer, w.veiller, w.ex-voto, w.offrande, w.émouvant, w.accompagner, w.sommet, w.croyant, w.prier, w.religion, w.religieux, w.foi, w.protéger, w.protection, w.voilier, w.sauver, w.danger, w.tempête, w.naufrage, w.reconnaissant, w.grâce-à, w.à-cause-de]
    sentences:
      - { es: "Notre-Dame-de-la-Garde est la basilique qui domine Marseille.", en: "Notre-Dame-de-la-Garde is the basilica that overlooks Marseille.", altEs: ["Notre-Dame-de-la-Garde, c'est la basilique qui domine Marseille."], altEn: ["Notre-Dame-de-la-Garde is the basilica which dominates Marseille."], grammar: [g.relative-qui-que], vocab: [w.basilique, w.dominer] }
      - { es: "La statue dorée qui surmonte la basilique mesure plus de onze mètres.", en: "The golden statue that tops the basilica is more than eleven metres tall.", altEs: ["La statue dorée qui est en haut de la basilique mesure plus de onze mètres."], grammar: [g.relative-qui-que], vocab: [w.statue, w.doré, w.surmonter, w.mesurer] }
      - { es: "Les Marseillais disent que la Bonne Mère veille sur les marins qui partent en mer.", en: "The people of Marseille say the Bonne Mère watches over the sailors who go to sea.", altEs: ["Les Marseillais disent que la Bonne Mère protège les marins qui partent en mer."], grammar: [g.relative-qui-que], vocab: [w.veiller] }
      - { es: "Les ex-voto que les marins ont offerts sont très émouvants.", en: "The ex-votos that the sailors offered are very moving.", altEs: ["Les ex-voto qu'ont offerts les marins sont très émouvants."], altEn: ["The ex-votos the sailors gave are very moving."], grammar: [g.relative-qui-que, g.pc-object-agreement], vocab: [w.ex-voto, w.émouvant], error: { wrong: "Les ex-voto que les marins ont offert sont très émouvants.", explain: "With que + passé composé, the participle agrees with the noun before it: les ex-voto … offerts.", grammar: g.pc-object-agreement } }
      - { es: "Sur ce tableau, on voit un voilier que la tempête a presque coulé.", en: "In this painting you can see a sailing boat that the storm almost sank.", altEs: ["Sur ce tableau, on voit un voilier qu'une tempête a presque coulé."], grammar: [g.relative-qui-que], vocab: [w.voilier, w.tempête] }
      - { es: "Le guide nous accompagne. Il connaît chaque ex-voto.", en: "The guide is with us. He knows every ex-voto.", altEs: ["Le guide nous accompagne ; il connaît chaque ex-voto."], grammar: [g.relative-qui-que], vocab: [w.accompagner], transform: { instruction: "Join the two sentences with qui", answer: "Le guide qui nous accompagne connaît chaque ex-voto.", alt: ["Le guide, qui nous accompagne, connaît chaque ex-voto."], en: "The guide who is with us knows every ex-voto." } }
      - { es: "C'est une basilique que les croyants et les touristes adorent.", en: "It's a basilica that believers and tourists love.", altEs: ["C'est une basilique qu'adorent les croyants et les touristes."], grammar: [g.relative-qui-que], vocab: [w.basilique, w.croyant] }
      - { es: "Ma grand-mère, qui est très religieuse, monte à la Bonne Mère chaque dimanche pour prier.", en: "My grandmother, who is very religious, goes up to the Bonne Mère every Sunday to pray.", altEs: ["Ma grand-mère, qui est très religieuse, va à la Bonne Mère tous les dimanches pour prier."], grammar: [g.relative-qui-que], vocab: [w.religieux, w.prier] }
      - { es: "La vue qu'on a depuis le sommet est incroyable.", en: "The view you get from the top is incredible.", altEs: ["La vue que l'on a depuis le sommet est incroyable.", "La vue qu'on a du sommet est incroyable."], grammar: [g.relative-qui-que], vocab: [w.sommet], error: { wrong: "La vue qui on a depuis le sommet est incroyable.", explain: "on is the subject of the relative clause, so use que: la vue qu'on a.", grammar: g.relative-qui-que } }
      - { es: "C'est moi qui suis montée à pied jusqu'au sommet.", en: "I'm the one who walked up to the top.", altEs: ["C'est moi qui suis monté à pied jusqu'au sommet."], altEn: ["It was me who walked up to the top."], grammar: [g.relative-qui-que], vocab: [w.sommet], transform: { instruction: "Change to 'nous'", answer: "C'est nous qui sommes montés à pied jusqu'au sommet.", alt: ["C'est nous qui sommes montées à pied jusqu'au sommet."], en: "We're the ones who walked up to the top." } }
      - { es: "Les pêcheurs remercient la Vierge qui les a sauvés du danger.", en: "The fishermen thank the Virgin who saved them from danger.", altEs: ["Les pêcheurs remercient la Vierge, qui les a sauvés du danger."], grammar: [g.relative-qui-que, g.pc-object-agreement], vocab: [w.sauver, w.danger] }
      - { es: "Ce marin, qui a connu une terrible tempête, est très reconnaissant à la Bonne Mère.", en: "This sailor, who went through a terrible storm, is very grateful to the Bonne Mère.", altEs: ["Ce marin, qui a vécu une terrible tempête, est très reconnaissant à la Bonne Mère."], grammar: [g.relative-qui-que], vocab: [w.tempête, w.reconnaissant] }
      - { es: "À cause du vent, le petit train qui monte à la basilique ne marche pas aujourd'hui.", en: "Because of the wind, the little train that goes up to the basilica isn't running today.", altEs: ["À cause du vent, le petit train qui monte à la basilique ne fonctionne pas aujourd'hui."], grammar: [g.relative-qui-que], vocab: [w.à-cause-de] }
      - { es: "Même ceux qui ne sont pas croyants disent que la Bonne Mère protège la ville.", en: "Even those who aren't believers say the Bonne Mère protects the city.", altEs: ["Même les gens qui ne sont pas croyants disent que la Bonne Mère protège la ville."], grammar: [g.relative-qui-que], vocab: [w.croyant, w.protéger] }
      - { es: "Les offrandes que les familles laissent ici racontent l'histoire de Marseille.", en: "The offerings that families leave here tell the story of Marseille.", altEs: ["Les offrandes que laissent les familles ici racontent l'histoire de Marseille."], grammar: [g.relative-qui-que], vocab: [w.offrande] }
    exchanges:
      - q: { es: "C'est quoi, la Bonne Mère ?", en: "What's the Bonne Mère?" }
        a: { es: "C'est la basilique qui domine Marseille, sur la colline.", en: "It's the basilica that overlooks Marseille, on the hill." }
        alt: ["C'est la basilique de Marseille.", "C'est Notre-Dame-de-la-Garde, la basilique qui veille sur la ville."]
        grammar: [g.relative-qui-que]
        vocab: [w.basilique, w.dominer]
      - q: { es: "Qu'est-ce que tu as pensé des ex-voto ?", en: "What did you think of the ex-votos?" }
        a: { es: "Je les ai trouvés très émouvants, en particulier ceux que les marins ont offerts.", en: "I found them very moving, especially the ones the sailors offered." }
        alt: ["Très émouvants.", "Je les ai trouvés magnifiques."]
        grammar: [g.relative-qui-que]
        vocab: [w.ex-voto, w.émouvant]
      - q: { es: "Qui est la dame qui prie là-bas ?", en: "Who's the lady praying over there?" }
        a: { es: "C'est une dame que je vois ici chaque dimanche.", en: "She's a lady I see here every Sunday." }
        alt: ["Je ne sais pas, je ne la connais pas.", "C'est ma tante, qui vient ici chaque semaine."]
        grammar: [g.relative-qui-que]
        vocab: [w.prier]
      - q: { es: "Tu montes à pied ou tu prends le petit train ?", en: "Are you walking up or taking the little train?" }
        a: { es: "Je prends le petit train qui part du Vieux-Port.", en: "I'm taking the little train that leaves from the Old Port." }
        alt: ["À pied, c'est plus joli.", "Le petit train, c'est plus facile."]
        grammar: [g.relative-qui-que]
        vocab: []
      - q: { es: "Pourquoi les marins offraient-ils des ex-voto ?", en: "Why did sailors offer ex-votos?" }
        a: { es: "Pour remercier la Vierge qui les avait protégés pendant une tempête.", en: "To thank the Virgin who had protected them during a storm." }
        alt: ["Pour remercier la Bonne Mère.", "Pour la remercier de sa protection."]
        grammar: [g.relative-qui-que]
        vocab: [w.ex-voto, w.protéger, w.protection]
    texts:
      - title: "Carte postale"
        es: ["Chère Julie, je suis à Notre-Dame-de-la-Garde.", "C'est la basilique qui veille sur Marseille depuis 1864.", "La vue que j'ai d'ici est incroyable !"]
        en: ["Dear Julie, I'm at Notre-Dame-de-la-Garde.", "It's the basilica that has watched over Marseille since 1864.", "The view I have from here is incredible!"]
        grammar: [g.relative-qui-que]
        vocab: [w.basilique, w.veiller]
      - title: "Dans la basilique"
        es: ["Ces ex-voto sont des offrandes que les croyants ont laissées ici.", "Beaucoup viennent de marins qui ont échappé à un naufrage grâce à leur foi, disent-ils.", "Merci de respecter ce lieu de religion et de silence."]
        en: ["These ex-votos are offerings that believers have left here.", "Many come from sailors who escaped a shipwreck thanks to their faith, they say.", "Please respect this place of religion and silence."]
        grammar: [g.relative-qui-que]
        vocab: [w.ex-voto, w.offrande, w.croyant, w.naufrage, w.grâce-à, w.foi, w.religion]
    spicy:
      - { es: "Tu es la seule vue qui me plaît plus que celle de la Bonne Mère.", en: "You're the only view I like more than the one from the Bonne Mère.", grammar: [g.relative-qui-que] }
      - { es: "C'est toi qui m'as fait monter toutes ces marches ? Tu me dois un verre.", en: "Are you the one who made me climb all these steps? You owe me a drink.", altEs: ["C'est toi qui m'as fait monter toutes ces marches ? Alors tu me dois un verre."], grammar: [g.relative-qui-que] }
      - { es: "La Bonne Mère veille sur les marins ; moi, je cherche quelqu'un qui veille sur moi ce soir.", en: "The Bonne Mère watches over sailors; I'm looking for someone who'll watch over me tonight.", grammar: [g.relative-qui-que], vocab: [w.veiller] }
      - { es: "Le garçon que tu regardes depuis dix minutes, c'est mon frère. Je te le présente ?", en: "The guy you've been looking at for ten minutes is my brother. Shall I introduce you?", altEs: ["Le garçon que tu regardes depuis dix minutes, c'est mon frère. Tu veux que je te le présente ?"], grammar: [g.relative-qui-que, g.double-object-pronouns] }
      - { es: "J'ai fait un vœu pour quelqu'un que j'ai rencontré hier soir. Devine qui.", en: "I made a wish for someone I met last night. Guess who.", grammar: [g.relative-qui-que] }
  - id: b1.u02.l2
    title: Le quartier où j'habite
    teach: [g.relative-ou]
    tip: "où for places (le quartier où j'habite) and for time (le jour où je suis arrivé), never quand."
    vocab: [w.quartier-populaire, w.populaire, w.lieu, w.avoir-lieu, w.au-lieu-de, w.panorama, w.bâtiment, w.centre-ville, w.banlieue, w.périurbain, w.zone, w.habitat, w.immigré, w.immigration, w.origine, w.multiculturel, w.naissance]
    sentences:
      - { es: "Le Panier est le quartier où je suis né.", en: "Le Panier is the neighbourhood where I was born.", altEs: ["Le Panier, c'est le quartier où je suis né.", "Le Panier est le quartier où je suis née."], grammar: [g.relative-ou], vocab: [], transform: { instruction: "Change to 'we'", answer: "Le Panier est le quartier où nous sommes nés.", alt: ["Le Panier est le quartier où nous sommes nées.", "Le Panier, c'est le quartier où on est nés."], en: "Le Panier is the neighbourhood where we were born." } }
      - { es: "Voici la colline d'où on a le plus beau panorama de la ville.", en: "Here's the hill from where you get the best panorama of the city.", altEs: ["Voici la colline d'où l'on a le plus beau panorama de la ville."], grammar: [g.relative-ou], vocab: [w.panorama] }
      - { es: "Je me souviens très bien du jour où nous sommes arrivés à Marseille.", en: "I remember very well the day we arrived in Marseille.", altEs: ["Je me rappelle très bien le jour où nous sommes arrivés à Marseille.", "Je me souviens très bien du jour où on est arrivés à Marseille."], grammar: [g.relative-ou], vocab: [] }
      - { es: "Marseille est une ville multiculturelle où vivent des gens de toutes les origines.", en: "Marseille is a multicultural city where people of all origins live.", altEs: ["Marseille est une ville multiculturelle où des gens de toutes les origines vivent."], grammar: [g.relative-ou], vocab: [w.multiculturel, w.origine] }
      - { es: "Mes grands-parents étaient des immigrés italiens ; ils habitaient un quartier populaire où tout le monde se connaissait.", en: "My grandparents were Italian immigrants; they lived in a working-class neighbourhood where everyone knew each other.", altEs: ["Mes grands-parents étaient des immigrés italiens et ils habitaient un quartier populaire où tout le monde se connaissait."], grammar: [g.relative-ou, g.imparfait-forms], vocab: [w.immigré, w.quartier-populaire] }
      - { es: "Le centre-ville est la zone où il y a le plus de bâtiments anciens.", en: "The town centre is the area where there are the most old buildings.", altEs: ["Le centre-ville, c'est la zone où il y a le plus de bâtiments anciens."], grammar: [g.relative-ou], vocab: [w.centre-ville, w.zone, w.bâtiment] }
      - { es: "La fête du quartier a lieu sur la place où il y a la fontaine.", en: "The neighbourhood party takes place on the square where the fountain is.", altEs: ["La fête du quartier a lieu sur la place où se trouve la fontaine."], grammar: [g.relative-ou], vocab: [w.avoir-lieu] }
      - { es: "Au moment où le bateau partait, il a commencé à pleuvoir.", en: "Just as the boat was leaving, it started to rain.", altEs: ["Au moment où le bateau partait, il s'est mis à pleuvoir."], altEn: ["At the moment the boat was leaving, it started to rain."], grammar: [g.relative-ou], vocab: [] }
      - { es: "Depuis sa naissance, mon fils vit dans le quartier où j'ai grandi.", en: "Since his birth, my son has lived in the neighbourhood where I grew up.", altEs: ["Depuis sa naissance, mon fils habite dans le quartier où j'ai grandi."], altEn: ["My son has lived in the neighbourhood where I grew up since he was born."], grammar: [g.relative-ou], vocab: [w.naissance] }
      - { es: "C'est le jour où ma fille est née.", en: "It's the day my daughter was born.", altEs: ["C'est le jour où est née ma fille."], altEn: ["It's the day when my daughter was born."], grammar: [g.relative-ou], vocab: [], error: { wrong: "C'est le jour quand ma fille est née.", explain: "After a time expression, French uses où, not quand: le jour où.", grammar: g.relative-ou } }
      - { es: "Au lieu de rester dans le centre, allons dans un quartier où il y a moins de touristes.", en: "Instead of staying in the centre, let's go to a neighbourhood where there are fewer tourists.", altEs: ["Au lieu de rester au centre, allons dans un quartier où il y a moins de touristes."], grammar: [g.relative-ou], vocab: [w.au-lieu-de] }
      - { es: "Beaucoup de gens habitent en banlieue, dans des zones où il n'y a pas de métro.", en: "Lots of people live in the suburbs, in areas where there's no metro.", altEs: ["Beaucoup de gens vivent en banlieue, dans des zones où il n'y a pas de métro."], grammar: [g.relative-ou], vocab: [w.banlieue, w.zone] }
      - { es: "Tu connais un café d'où on voit le port ?", en: "Do you know a café from where you can see the port?", altEs: ["Tu connais un café d'où l'on voit le port ?", "Est-ce que tu connais un café d'où on voit le port ?"], grammar: [g.relative-ou], vocab: [] }
      - { es: "C'est un lieu populaire où les jeunes se retrouvent le soir.", en: "It's a popular place where young people meet up in the evening.", altEs: ["C'est un endroit populaire où les jeunes se retrouvent le soir."], grammar: [g.relative-ou], vocab: [w.lieu, w.populaire] }
      - { es: "Je suis allé dans un restaurant. On y sert une bouillabaisse extraordinaire.", en: "I went to a restaurant. They serve an extraordinary bouillabaisse there.", altEs: ["Je suis allée dans un restaurant. On y sert une bouillabaisse extraordinaire."], grammar: [g.relative-ou], vocab: [w.bouillabaisse], transform: { instruction: "Join the two sentences with où", answer: "Je suis allé dans un restaurant où on sert une bouillabaisse extraordinaire.", alt: ["Je suis allée dans un restaurant où on sert une bouillabaisse extraordinaire.", "Je suis allé dans un restaurant où l'on sert une bouillabaisse extraordinaire."], en: "I went to a restaurant where they serve an extraordinary bouillabaisse." } }
      - { es: "L'immigration a toujours fait partie de l'histoire de Marseille, une ville où les cultures se mélangent.", en: "Immigration has always been part of Marseille's history, a city where cultures mix.", altEs: ["L'immigration fait partie de l'histoire de Marseille depuis toujours, une ville où les cultures se mélangent."], grammar: [g.relative-ou], vocab: [w.immigration] }
    exchanges:
      - q: { es: "Tu habites où ?", en: "Where do you live?" }
        a: { es: "Dans un petit quartier où il y a beaucoup de cafés, près du port.", en: "In a little neighbourhood where there are lots of cafés, near the port." }
        alt: ["Près du port.", "Au Panier, le quartier où je suis né."]
        grammar: [g.relative-ou]
        vocab: []
      - q: { es: "Où a lieu le concert ?", en: "Where is the concert taking place?" }
        a: { es: "Sur la place où on s'est vus hier.", en: "On the square where we saw each other yesterday." }
        alt: ["Sur la grande place.", "Au même endroit qu'hier."]
        grammar: [g.relative-ou]
        vocab: [w.avoir-lieu]
      - q: { es: "Tu te souviens du jour où on s'est rencontrés ?", en: "Do you remember the day we met?" }
        a: { es: "Bien sûr, c'était le jour où il a neigé à Marseille !", en: "Of course, it was the day it snowed in Marseille!" }
        alt: ["Oui, c'était au Vieux-Port.", "Non, je ne m'en souviens plus."]
        grammar: [g.relative-ou]
        vocab: []
      - q: { es: "Tu connais un endroit d'où on voit toute la ville ?", en: "Do you know a place from where you can see the whole city?" }
        a: { es: "Oui, la terrasse de la basilique : le panorama est magnifique.", en: "Yes, the basilica's terrace: the panorama is magnificent." }
        alt: ["La Bonne Mère, évidemment.", "Oui, monte à Notre-Dame-de-la-Garde."]
        grammar: [g.relative-ou]
        vocab: [w.panorama]
      - q: { es: "Tes parents sont d'où ?", en: "Where are your parents from?" }
        a: { es: "Ma mère est d'origine italienne et mon père vient du Maroc.", en: "My mother is of Italian origin and my father comes from Morocco." }
        alt: ["Ils sont d'origine italienne.", "De Marseille, tous les deux."]
        grammar: [g.relative-ou]
        vocab: [w.origine]
      - q: { es: "Tu préfères vivre en banlieue ou au centre-ville ?", en: "Do you prefer living in the suburbs or in the town centre?" }
        a: { es: "Au centre-ville, dans un quartier où je peux tout faire à pied.", en: "In the town centre, in a neighbourhood where I can do everything on foot." }
        alt: ["En banlieue, c'est plus calme.", "Au centre-ville."]
        grammar: [g.relative-ou]
        vocab: [w.banlieue, w.centre-ville]
    texts:
      - title: "Mon quartier"
        es: ["J'habite au Panier, le plus vieux quartier de Marseille.", "C'est un quartier où les rues sont étroites et pleines de couleurs.", "L'habitat y est ancien : ce sont de vieux immeubles où il n'y a pas d'ascenseur.", "Le soir, je vais sur une petite place où les voisins jouent aux boules."]
        en: ["I live in Le Panier, the oldest neighbourhood in Marseille.", "It's a neighbourhood where the streets are narrow and full of colour.", "The housing there is old: they're old buildings with no lift.", "In the evening, I go to a little square where the neighbours play boules."]
        grammar: [g.relative-ou]
        vocab: [w.habitat]
      - title: "Annonce"
        es: ["Fête des cultures du monde !", "Elle a lieu samedi au centre-ville, sur la place où se trouve la mairie.", "Venez découvrir des plats de toutes les origines."]
        en: ["World cultures festival!", "It takes place on Saturday in the town centre, on the square where the town hall is.", "Come and discover dishes of every origin."]
        grammar: [g.relative-ou]
        vocab: [w.avoir-lieu, w.centre-ville, w.origine]
    spicy:
      - { es: "Tu connais un endroit où on peut danser jusqu'au matin ?", en: "Do you know a place where we can dance until morning?", altEs: ["Tu connais un endroit où l'on peut danser jusqu'au matin ?"], grammar: [g.relative-ou] }
      - { es: "Je me souviens du jour où tu m'as souri pour la première fois : il pleuvait et j'étais sans parapluie.", en: "I remember the day you first smiled at me: it was raining and I had no umbrella.", grammar: [g.relative-ou] }
      - { es: "Montre-moi le quartier où tu as grandi ; après, je te montre le bar où je vais tous les vendredis.", en: "Show me the neighbourhood where you grew up; afterwards I'll show you the bar where I go every Friday.", grammar: [g.relative-ou, g.pronoun-order-imperative] }
      - { es: "Au lieu de regarder le panorama, tu me regardes. Ça me plaît.", en: "Instead of looking at the panorama, you're looking at me. I like that.", grammar: [g.relative-ou], vocab: [w.au-lieu-de, w.panorama] }
      - { es: "Le seul endroit où je veux être ce soir, c'est à côté de toi.", en: "The only place I want to be tonight is next to you.", grammar: [g.relative-ou] }
  - id: b1.u02.l3
    title: La ville dont je rêve
    teach: [g.relative-dont]
    tip: "dont replaces de + noun: rêver de → la ville dont je rêve; whose → l'homme dont la fille est peintre."
    vocab: [w.dont, w.rêver, w.rêve, w.auteur, w.chef, w.collègue, w.invité, w.relation, w.rapport, w.couple, w.amour, w.amoureux, w.tomber-amoureux, w.petit-ami, w.petite-amie, w.fiancé, w.mariage, w.divorcer, w.se-séparer, w.rompre, w.enterrement, w.deuil, w.veuf, w.orphelin, w.adopter]
    sentences:
      - { es: "C'est la ville dont je rêvais depuis toujours.", en: "It's the city I'd always dreamed of.", altEs: ["C'est la ville dont je rêve depuis toujours."], altEn: ["It's the city I had always dreamt of."], grammar: [g.relative-dont], vocab: [w.dont, w.rêver], error: { wrong: "C'est la ville que je rêvais depuis toujours.", explain: "rêver de → dont: la ville dont je rêvais.", grammar: g.relative-dont } }
      - { es: "Voilà l'auteur marseillais dont tout le monde parle en ce moment.", en: "There's the Marseille author everyone's talking about at the moment.", altEs: ["Voici l'auteur marseillais dont tout le monde parle en ce moment."], grammar: [g.relative-dont], vocab: [w.auteur, w.dont] }
      - { es: "J'ai une collègue dont le mari est chef dans un grand restaurant.", en: "I have a colleague whose husband is a chef in a big restaurant.", altEs: ["J'ai une collègue dont le mari est cuisinier dans un grand restaurant."], grammar: [g.relative-dont], vocab: [w.collègue, w.chef] }
      - { es: "C'est un couple dont l'histoire d'amour a commencé sur le Vieux-Port.", en: "They're a couple whose love story began on the Old Port.", grammar: [g.relative-dont], vocab: [w.couple, w.amour] }
      - { es: "Le mariage dont ils rêvaient a eu lieu dans une petite chapelle face à la mer.", en: "The wedding they dreamed of took place in a little chapel facing the sea.", altEs: ["Le mariage dont ils rêvaient s'est passé dans une petite chapelle face à la mer."], grammar: [g.relative-dont], vocab: [w.mariage, w.rêver, w.avoir-lieu] }
