id: r.b1.nice-a-mon-avis
level: b1
title: Nice, à mon avis…
kind: text
intro: "A local newspaper asked its readers: «Faut-il limiter le tourisme à Nice ?» Three readers answer. Look at how they give opinions and reasons (à mon avis, je pense que, car, donc, pourtant, alors que)."
allow: [pizzas, mireille, rousseau, stéphane, yasmine, airbnb, ok, centre]
paragraphs:
  - { es: "La question de la semaine : chaque année, des millions de visiteurs viennent à Nice pour son soleil, sa mer et sa célèbre Promenade des Anglais. Le tourisme fait vivre la ville, mais beaucoup d'habitants se plaignent du bruit, des prix et de la foule. Faut-il limiter le tourisme à Nice ? Vous avez été nombreux à nous répondre. Voici trois de vos lettres.", en: "The question of the week: every year millions of visitors come to Nice for its sun, its sea and its famous Promenade des Anglais. Tourism keeps the city alive, but many residents complain about the noise, the prices and the crowds. Should tourism in Nice be limited? Many of you replied. Here are three of your letters." }
  - { es: "Mireille, 67 ans, retraitée, Vieux-Nice : « Je suis née dans le Vieux-Nice et je ne reconnais plus mon quartier. À mon avis, il y a beaucoup trop de touristes. Les petits commerces ferment les uns après les autres et sont remplacés par des boutiques de souvenirs. Les appartements sont loués aux vacanciers, alors que les jeunes Niçois ne trouvent plus de logement. En été, on ne peut plus marcher dans les rues tellement il y a de monde. Je pense que la mairie devrait limiter les locations touristiques et les gros bateaux de croisière. Nice n'est pas un parc d'attractions, c'est une ville où des gens vivent ! »", en: "Mireille, 67, retired, Vieux-Nice: 'I was born in the Vieux-Nice and I no longer recognise my neighbourhood. In my opinion there are far too many tourists. The little shops are closing one after another and being replaced by souvenir shops. Flats are rented to holidaymakers, while young people from Nice can no longer find anywhere to live. In summer you can't walk in the streets, there are so many people. I think the town hall should limit tourist rentals and the big cruise ships. Nice isn't a theme park, it's a city where people live!'" }
  - { es: "Stéphane, 45 ans, restaurateur, cours Saleya : « Je comprends les habitants, mais je ne suis pas du tout d'accord avec l'idée de limiter le tourisme. Sans les touristes, mon restaurant fermerait en trois mois, et mes huit employés perdraient leur travail. Le tourisme, c'est des milliers d'emplois dans la région. Il faut le dire clairement : c'est grâce aux visiteurs que Nice est une ville riche et vivante. Pourtant, je reconnais qu'il y a des problèmes. La solution, selon moi, ce n'est pas d'avoir moins de touristes, c'est de mieux les répartir : en hiver, au printemps, et pas seulement en juillet et en août. Nice est belle toute l'année ! »", en: "Stéphane, 45, restaurant owner, Cours Saleya: 'I understand the residents, but I don't agree at all with the idea of limiting tourism. Without tourists my restaurant would close within three months and my eight employees would lose their jobs. Tourism means thousands of jobs in the region. It has to be said clearly: it's thanks to visitors that Nice is a rich, lively city. Still, I admit there are problems. The solution, in my view, isn't to have fewer tourists but to spread them out better: in winter, in spring, and not just in July and August. Nice is beautiful all year round!'" }
  - { es: "Yasmine, 23 ans, étudiante : « Je suis d'accord avec les deux lettres précédentes, en partie. D'un côté, le tourisme est indispensable pour l'économie. De l'autre, il ne doit pas détruire ce qui rend Nice unique. Par exemple, la socca : cette galette de farine de pois chiches, cuite au feu de bois, c'est notre plat traditionnel. Les Niçois la mangent depuis des générations, avec beaucoup de poivre, sur un coin de table. Si on la remplace par des pizzas industrielles pour touristes, on perd notre identité. C'est pourquoi je pense qu'il faut protéger les traditions locales, comme la socca, le carnaval ou les marchés. Les touristes viennent justement pour ça ! Donc, protéger notre culture, c'est aussi protéger le tourisme. »", en: "Yasmine, 23, student: 'I agree with the two previous letters, in part. On the one hand, tourism is essential for the economy. On the other, it mustn't destroy what makes Nice unique. Take socca, for example: that chickpea-flour pancake cooked over a wood fire is our traditional dish. People from Nice have been eating it for generations, with lots of pepper, at the corner of a table. If it's replaced by industrial pizzas for tourists, we lose our identity. That's why I think local traditions like socca, the carnival or the markets must be protected. Tourists come precisely for those! So protecting our culture also means protecting tourism.'" }
  - { es: "La rédaction : Merci à tous nos lecteurs. Comme vous le voyez, les avis sont partagés. Une chose est sûre : tout le monde aime Nice. La semaine prochaine, nous parlerons du carnaval, qui attire chaque mois de février des centaines de milliers de spectateurs. Et vous, qu'en pensez-vous ? Écrivez-nous !", en: "The editors: Thank you to all our readers. As you can see, opinions are divided. One thing is certain: everyone loves Nice. Next week we'll talk about the carnival, which every February attracts hundreds of thousands of spectators. And what do you think? Write to us!" }
questions:
  - { q: "Selon Mireille, quel est le problème du logement ?", options: ["Les appartements sont trop grands", "Les appartements sont loués aux vacanciers et les jeunes ne trouvent plus de logement", "Il n'y a pas assez d'hôtels"], answer: 1, explain: "«Les appartements sont loués aux vacanciers, alors que les jeunes Niçois ne trouvent plus de logement.»" }
  - { q: "Pourquoi Stéphane est-il contre l'idée de limiter le tourisme ?", options: ["Son restaurant fermerait et ses employés perdraient leur travail", "Il n'aime pas les habitants", "Il veut plus de bateaux de croisière"], answer: 0, explain: "«Sans les touristes, mon restaurant fermerait en trois mois, et mes huit employés perdraient leur travail.»" }
  - { q: "Quelle solution propose Stéphane ?", options: ["Fermer la ville en été", "Mieux répartir les touristes sur l'année", "Construire plus d'hôtels"], answer: 1, explain: "«Ce n'est pas d'avoir moins de touristes, c'est de mieux les répartir : en hiver, au printemps…»" }
  - { q: "Qu'est-ce que la socca ?", options: ["Une pizza", "Une galette de farine de pois chiches", "Un dessert au chocolat"], answer: 1, explain: "«Cette galette de farine de pois chiches, cuite au feu de bois, c'est notre plat traditionnel.»" }
  - { q: "Quelle est la conclusion de Yasmine ?", options: ["Il faut interdire les touristes", "Protéger la culture locale, c'est aussi protéger le tourisme", "La socca n'est plus importante"], answer: 1, explain: "«Donc, protéger notre culture, c'est aussi protéger le tourisme.»" }
