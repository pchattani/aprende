id: r.b1.glielo-porto-io
level: b1
title: Glielo porto io!
kind: dialogue
intro: Moving day in Milan. Giulia is moving into a flat near the Navigli with her friend Davide's help, and they meet the elderly neighbour, signora Ferri. Listen for the combined pronouns (glielo, me lo, ce ne).
allow: [giulia, davide, ferri, ikea, cristina, porta, genova]
paragraphs:
  - { es: "Davide: Giulia, il furgone è parcheggiato davanti al portone, ma i vigili passano ogni mezz'ora. Dobbiamo sbrigarci, altrimenti ci danno la multa.", en: "Davide: Giulia, the van is parked in front of the main door, but the traffic wardens come by every half hour. We have to hurry, otherwise they'll give us a fine." }
  - { es: "Giulia: Lo so. Allora, tu porti su gli scatoloni dei libri e io prendo le valigie. Ah, il ragazzo dell'agenzia mi ha dato le chiavi del portone? Non le trovo più!", en: "Giulia: I know. So, you carry the boxes of books upstairs and I'll take the suitcases. Oh, did the guy from the agency give me the keys to the main door? I can't find them!" }
  - { es: "Davide: Sì, te le ha date stamattina. Le hai messe nella borsa, insieme al contratto. Te l'ho visto fare.", en: "Davide: Yes, he gave them to you this morning. You put them in your bag, together with the contract. I saw you do it." }
  - { es: "Giulia: Ah, eccole. Meno male! E il divano? Come lo portiamo al quarto piano? L'ascensore è troppo piccolo.", en: "Giulia: Ah, here they are. Thank goodness! And the sofa? How are we going to get it up to the fourth floor? The lift is too small." }
  - { es: "Davide: Non preoccuparti, ci pensano i ragazzi della ditta di traslochi. Arrivano alle undici. Te lo montano anche, se vuoi: l'ho già chiesto io.", en: "Davide: Don't worry, the guys from the removal company will deal with it. They arrive at eleven. They'll even assemble it for you, if you like: I've already asked." }
  - { es: "Signora Ferri: Buongiorno! Scusate, siete i nuovi inquilini del quarto piano?", en: "Signora Ferri: Good morning! Excuse me, are you the new tenants on the fourth floor?" }
  - { es: "Giulia: Buongiorno! Sì, io sono Giulia. Lui è Davide, un amico che mi sta aiutando. Lei abita qui?", en: "Giulia: Good morning! Yes, I'm Giulia. This is Davide, a friend who's helping me. Do you live here?" }
  - { es: "Signora Ferri: Sì, al terzo, proprio sotto di Lei. Sono qui da quarant'anni, conosco tutti. Senta, ieri il postino ha lasciato un pacco per Lei. Gliel'ho tenuto io, perché in portineria non c'era nessuno.", en: "Signora Ferri: Yes, on the third floor, right below you. I've been here forty years, I know everyone. Listen, yesterday the postman left a parcel for you. I kept it for you, because there was nobody at the porter's lodge." }
  - { es: "Giulia: Che gentile! Grazie mille. Passo a prenderlo più tardi, va bene?", en: "Giulia: How kind! Thank you so much. I'll come and get it later, is that OK?" }
  - { es: "Signora Ferri: Ma no, non si disturbi, glielo porto io tra cinque minuti. Ha bisogno di qualcos'altro? Ha già il numero dell'amministratore del condominio?", en: "Signora Ferri: Oh no, don't trouble yourself, I'll bring it up to you in five minutes. Do you need anything else? Do you already have the building manager's number?" }
  - { es: "Giulia: No, purtroppo non ce l'ho. Me lo può dare?", en: "Giulia: No, unfortunately I don't have it. Could you give it to me?" }
  - { es: "Signora Ferri: Certo, glielo scrivo su un foglio. E Le spiego anche la raccolta differenziata, perché qui a Milano sono molto severi. La carta il martedì, la plastica il giovedì... Ma gliene parlo dopo, adesso siete occupati.", en: "Signora Ferri: Of course, I'll write it down for you on a piece of paper. And I'll explain the recycling to you too, because here in Milan they're very strict. Paper on Tuesdays, plastic on Thursdays... But I'll tell you about it later, you're busy now." }
  - { es: "Giulia: Grazie, signora, è molto gentile. E se ho un problema con il riscaldamento, a chi lo devo dire?", en: "Giulia: Thank you, signora, that's very kind. And if I have a problem with the heating, who should I tell?" }
  - { es: "Signora Ferri: Lo dica all'amministratore, naturalmente. Ma prima lo dica a me: io so sempre chi chiamare. Ah, un'ultima cosa: il sabato pomeriggio mio nipote suona il pianoforte. Se Le dà fastidio, me lo dica pure, e glielo faccio sapere.", en: "Signora Ferri: Tell the building manager, of course. But tell me first: I always know who to call. Oh, one last thing: on Saturday afternoons my grandson plays the piano. If it bothers you, just tell me, and I'll let him know." }
  - { es: "Giulia: Ma no, si figuri! Mi piace molto la musica. Anzi, se suona bene, glielo dirò io stessa.", en: "Giulia: Oh no, not at all! I really like music. In fact, if he plays well, I'll tell him so myself." }
  - { es: "Davide: (a voce bassa) Giulia, hai trovato la vicina perfetta. Fra una settimana saprà tutto di te.", en: "Davide: (quietly) Giulia, you've found the perfect neighbour. In a week she'll know everything about you." }
  - { es: "Giulia: (ridendo) Meglio così: almeno qualcuno mi annaffierà le piante quando torno a Genova. Dai, prendiamo gli scatoloni. Quanti ce ne sono ancora nel furgone?", en: "Giulia: (laughing) All the better: at least someone will water my plants when I go back to Genoa. Come on, let's get the boxes. How many are there still in the van?" }
  - { es: "Davide: Ce ne sono ancora dodici. E sono tutti di libri. Ma perché non li hai lasciati a casa dei tuoi?", en: "Davide: There are still twelve. And they're all books. But why didn't you leave them at your parents' place?" }
  - { es: "Giulia: Perché senza i miei libri non mi sento a casa. Su, coraggio! Stasera la pizza te la offro io.", en: "Giulia: Because without my books I don't feel at home. Come on, chin up! Tonight the pizza's on me." }
questions:
  - { q: "Perché Giulia e Davide devono sbrigarsi?", options: ["Perché il furgone è parcheggiato e i vigili possono dare la multa", "Perché il divano non entra in ascensore", "Perché la signora Ferri deve uscire"], answer: 0, explain: "The wardens pass every half hour and could fine them for the parked van." }
  - { q: "Nella frase «Te le ha date stamattina», che cosa significa «le»?", options: ["Le valigie", "Le chiavi", "Le piante"], answer: 1, explain: "Le stands for le chiavi; te = to you. Note the participle agrees: date." }
  - { q: "Chi porterà il divano al quarto piano?", options: ["Davide", "I ragazzi della ditta di traslochi", "La signora Ferri"], answer: 1, explain: "«Ci pensano i ragazzi della ditta di traslochi.»" }
  - { q: "Che cosa ha fatto la signora Ferri per Giulia?", options: ["Le ha tenuto un pacco", "Le ha dato le chiavi", "Le ha pulito l'appartamento"], answer: 0, explain: "«Il postino ha lasciato un pacco per Lei. Gliel'ho tenuto io.»" }
  - { q: "Perché Giulia ha portato tutti i suoi libri?", options: ["Perché deve venderli", "Perché senza i libri non si sente a casa", "Perché a casa dei genitori non c'è posto"], answer: 1, explain: "«Senza i miei libri non mi sento a casa.»" }
glossary:
  - { es: furgone, en: van }
  - { es: portone, en: main door (of a building) }
  - { es: scatoloni, en: (big) boxes }
  - { es: montano, en: they assemble }
  - { es: inquilini, en: tenants }
  - { es: portineria, en: porter's lodge }
  - { es: amministratore, en: (building) manager }
  - { es: foglio, en: sheet of paper }
  - { es: severi, en: strict }
  - { es: annaffierà, en: will water }
  - { es: piante, en: plants }
  - { es: coraggio, en: courage, come on }
  - { es: altrimenti, en: otherwise }
  - { es: naturalmente, en: of course }
