id: r.c1.one-more-storey
level: c1
title: 更上一層樓
kind: literature
author: 王之渙 Wang Zhihuan (688–742) and 孟郊 Meng Jiao (751–814)
source: "王之渙〈登鸛雀樓〉 and 孟郊〈遊子吟〉, Tang dynasty, quoted in full. Public domain. The story around them is written for this course."
intro: "The night before she leaves Macau to study abroad, a young woman goes up Macau Tower with her mother, who quotes a Tang poem about climbing a tower; back home, her mother sews a loose button on her coat, and another Tang poem comes to mind. Both poems are quoted in full and explained in colloquial Cantonese."
allow: [王之渙, 孟郊, 登鸛雀樓, 鸛雀樓, 遊子吟, 山西, 慧琪, 里斯本, 唐朝]
paragraphs:
  - { es: "慧琪聽日就要去里斯本讀大學，一去就四年。臨走前一晚，佢阿媽話：「陪我上旅遊塔睇吓夜景啦，你細個成日嚷住要上去，我都冇帶過你。」兩母女坐𨋢上到觀光層，成個澳門喺腳底：大三巴、新葡京、西灣大橋，一條條燈好似項鏈噉；遠啲仲見到港珠澳大橋，伸入一片黑色嘅海。", en: "Wai-kei is leaving tomorrow to study at university in Lisbon – four years away. On her last night, her mother says: 'Come up the tower with me to see the night view. You were always pestering me to go up when you were little, and I never took you.' Mother and daughter take the lift to the observation deck, and the whole of Macau lies at their feet: the Ruins of St Paul's, the Grand Lisboa, the Sai Van Bridge, strings of lights like necklaces; further off they can even see the Hong Kong–Zhuhai–Macau Bridge stretching out into the black sea." }
  - { es: "阿媽望住出面，忽然讀起一首詩：「白日依山盡，黃河入海流。欲窮千里目，更上一層樓。」慧琪笑：「〈登鸛雀樓〉喎，我小學背過。」阿媽話：「背過，未必明。你解畀我聽吖。」", en: "Gazing out, her mother suddenly recites a poem: 'The white sun sinks behind the mountains, / the Yellow River flows into the sea. / To see a thousand li further, / climb one more storey of the tower.' Wai-kei laughs: 'That's \"Climbing Stork Tower\"! I learned it by heart in primary school.' Her mother says: 'Learning it by heart isn't the same as understanding it. Explain it to me.'" }
  - { es: "〈登鸛雀樓〉　王之渙 ／ 白日依山盡，黃河入海流。欲窮千里目，更上一層樓。", en: "'Climbing Stork Tower' – Wang Zhihuan / The white sun sinks behind the mountains, / the Yellow River flows into the sea. / If you wish to see a thousand li to the end, / climb one more storey of the tower." }
  - { es: "慧琪諗咗一陣，用廣東話慢慢講：「鸛雀樓喺山西，黃河隔籬。詩人企喺樓上面，見到個太陽靠住啲山慢慢落，黃河一直流出大海。頭兩句係寫佢見到嘅嘢，好大、好闊。後兩句就話：如果你想睇得再遠啲，睇到千里咁遠，就要再行上一層。」阿媽點頭：「咁點解成千幾年，大家都仲講『更上一層樓』呢？」", en: "Wai-kei thinks for a moment, then explains slowly in Cantonese: 'Stork Tower is in Shanxi, next to the Yellow River. The poet is standing on the tower and sees the sun slowly going down against the mountains, and the Yellow River flowing all the way out to the sea. The first two lines describe what he sees – huge and wide. The last two say: if you want to see further, a thousand li away, you have to climb one more floor.' Her mother nods: 'So why, for more than a thousand years, has everyone still been saying \"climb one more storey\"?'" }
  - { es: "「因為佢唔單止講起樓。人想見識多啲，就要再努力，再上多一級。而家我哋讚人進步，都會話佢『更上一層樓』。」阿媽笑：「啱喇。你去到葡萄牙，就係更上一層樓。」慧琪又話：「老師仲講過，用廣東話讀，『白日』兩個字都係入聲，baak6、jat6，短短哋，一聽就知係仄聲；普通話讀『白』就好似平聲，聽唔出。」", en: "'Because it isn't only about climbing a tower. If you want to see more of the world, you have to work harder, go up another level. Nowadays when we praise someone for improving, we say they've \"climbed one more storey\".' Her mother laughs: 'That's right. When you go to Portugal, you'll be climbing one more storey.' Wai-kei adds: 'Our teacher also said that read in Cantonese, both characters of 白日 are entering tones, baak6 and jat6, short and clipped, so you can hear at once that they're oblique; in Mandarin 白 sounds like a level tone, so you can't tell.'" }
  - { es: "返到屋企已經十一點。慧琪執緊行李，阿媽見到佢件大褸甩咗粒鈕，即刻攞針線出嚟。慧琪話：「唔使喇，去到嗰邊再整啦。」阿媽冇理佢，戴起老花眼鏡，坐喺燈下面一針一針咁縫。慧琪企喺門口望住，忽然諗起另一首詩，喉嚨一陣酸。", en: "By the time they get home it's already eleven. Wai-kei is packing, and her mother notices that a button has come off her coat and immediately gets out a needle and thread. Wai-kei says: 'Don't bother, I'll fix it when I get there.' Her mother ignores her, puts on her reading glasses and sits under the lamp, sewing stitch by stitch. Standing in the doorway watching her, Wai-kei suddenly thinks of another poem, and a lump rises in her throat." }
  - { es: "〈遊子吟〉　孟郊 ／ 慈母手中線，遊子身上衣。臨行密密縫，意恐遲遲歸。誰言寸草心，報得三春暉。", en: "'The Wanderer's Song' – Meng Jiao / The thread in a loving mother's hand / becomes the coat on her wandering son. / Before he leaves she sews it close and tight, / fearing that he will be slow to return. / Who can say that the heart of an inch of grass / could ever repay the sunshine of the three months of spring?" }
  - { es: "呢首詩講一個阿媽喺個仔出門之前幫佢縫衫。「臨行密密縫，意恐遲遲歸」：臨走嗰陣縫得好密，因為驚個仔好耐都唔返嚟，件衫要着得耐啲。最後兩句用比喻：子女好似一條細細嘅草，阿媽嘅愛好似春天嘅太陽，一條草點報答得晒太陽呢？孟郊寫呢首詩嘅時候已經五十歲，終於做咗官，接佢阿媽嚟一齊住，所以首詩特別真。", en: "The poem is about a mother sewing her son's clothes before he leaves home. 'Before he leaves she sews it close and tight, fearing that he will be slow to return': she sews tight stitches at the moment of parting because she fears her son won't be back for a long time, so the clothes must last. The last two lines use a metaphor: children are like a tiny blade of grass, a mother's love like the spring sun – how could a blade of grass ever repay the sun? Meng Jiao wrote the poem when he was already fifty, having at last become an official and brought his mother to live with him, which is why it rings so true." }
  - { es: "慧琪行過去，攬住阿媽：「我會成日打畀你㗎，又會返嚟過年。」阿媽咬斷條線，拍拍件褸：「得喇，呢粒鈕實甩唔到。去到嗰邊記得食飽啲，唔好成日食麵包。」慧琪笑咗，眼淚就喺個時候跌咗落嚟。佢心諗：「誰言寸草心，報得三春暉」，原來一千二百年前，已經有人講晒佢想講嘅嘢。", en: "Wai-kei goes over and hugs her mother: 'I'll call you all the time, and I'll come back for Chinese New Year.' Her mother bites off the thread and pats the coat: 'There. That button definitely won't come off. When you get there, remember to eat properly – don't just eat bread all the time.' Wai-kei laughs, and that's when the tears fall. She thinks: 'Who can say that the heart of an inch of grass could ever repay the sunshine of spring?' Twelve hundred years ago, someone had already said everything she wanted to say." }
  - { es: "第二朝，兩母女喺機場門口道別。阿媽冇再講詩，淨係話：「到咗就打電話返嚟。」慧琪入閘之前擰轉頭，見到阿媽仲企喺度揮手，好細個噉。上咗飛機，佢摸吓件大褸粒鈕，縫得實一實。佢喺手機寫低一句：「更上一層樓，係為咗睇得更遠；但係行得幾遠，都記得屋企喺邊度。」寫完，佢就send咗畀阿媽。", en: "The next morning, mother and daughter say goodbye at the airport entrance. Her mother doesn't quote any more poems; she just says: 'Call home when you arrive.' Before going through the gate Wai-kei turns round and sees her mother still standing there waving, looking very small. On the plane she touches the button on her coat: it's sewn on firmly. She types a line on her phone: 'You climb one more storey to see further; but however far you go, you remember where home is.' Then she sends it to her mother." }
questions:
  - { q: "〈登鸛雀樓〉頭兩句主要寫乜嘢？", options: ["詩人見到嘅景物：太陽落山、黃河流出海", "詩人掛住屋企", "詩人同朋友飲酒"], answer: 0, explain: "白日依山盡，黃河入海流 describe the vast view from the tower; the second couplet draws the lesson." }
  - { q: "而家我哋講人「更上一層樓」，意思係？", options: ["佢搬咗去高層住", "佢再進步，去到更高嘅水平", "佢鍾意行樓梯"], answer: 1, explain: "The line has become an idiom for improving further, reaching a higher level." }
  - { q: "點解用廣東話讀「白日」，一聽就知係仄聲？", options: ["因為兩個字都係入聲，讀得好短", "因為兩個字都係第一聲", "因為普通話讀得好長"], answer: 0, explain: "白 baak6 and 日 jat6 end in -k and -t: entering tones, which are always oblique (仄)." }
  - { q: "「臨行密密縫，意恐遲遲歸」，阿媽點解縫得咁密？", options: ["因為件衫好貴", "因為驚個仔好耐都唔返嚟，件衫要着得耐", "因為佢唔識縫衫"], answer: 1, explain: "意恐遲遲歸: she fears her son will be slow to come home, so the stitches must last." }
  - { q: "「寸草心」同「三春暉」分別比喻乜嘢？", options: ["子女嘅心同阿媽嘅愛", "花園同太陽", "學生同老師"], answer: 0, explain: "The tiny blade of grass is the child's gratitude; the spring sunshine is the mother's love, which can never be fully repaid." }
