id: b2.u02
title: "Se l'avessi saputo..."
lessons:
  - id: b2.u02.l1
    title: Pensavo che fossi già stato a Pompei
    teach: [g.congiuntivo-trapassato]
    vocab: [w.tacere, w.coinvolgere, w.imperdonabile, w.trascurare, w.intendere, w.coinvolto, w.rancore, w.tirchio, w.riservato, w.compassione, w.estroverso, w.permaloso, w.approfittare, w.premuroso, w.sfruttare, w.umiltà, w.risentimento, w.gratitudine, w.ipocrita, w.ipocrisia, w.introverso, w.affettuoso, w.empatia, w.arroganza, w.lunatico, w.avaro, w.vanitoso]
    tip: "Past trigger + earlier action = congiuntivo trapassato: avessi/fossi + participle. Pensavo che fossi già partito. With essere the participle agrees: pensavo che fosse arrivata."
    sentences:
      - { es: "Pensavo che fossi già stato a Pompei.", en: "I thought you'd already been to Pompeii.", altEs: ["Credevo che fossi già stato a Pompei.", "Pensavo che fossi già stata a Pompei.", "Pensavo che tu fossi già stato a Pompei."], grammar: [g.congiuntivo-trapassato], vocab: [] }
      - { es: "Non sapevo che Marco avesse taciuto la verità per tanti anni.", en: "I didn't know Marco had kept quiet about the truth for so many years.", altEs: ["Non sapevo che Marco avesse nascosto la verità per tanti anni."], grammar: [g.congiuntivo-trapassato], vocab: [w.tacere, w.verità] }
      - { es: "Mi sembrava strano che la guida non avesse coinvolto i ragazzi nella visita.", en: "It seemed strange to me that the guide hadn't got the kids involved in the tour.", altEs: ["Mi pareva strano che la guida non avesse coinvolto i ragazzi nella visita."], grammar: [g.congiuntivo-trapassato, g.congiuntivo-impersonal], vocab: [w.coinvolgere, w.guida, w.visita] }
      - { es: "Era imperdonabile che avessero trascurato gli scavi per così tanto tempo.", en: "It was unforgivable that they had neglected the excavations for so long.", altEs: ["Era imperdonabile che avessero trascurato gli scavi così a lungo."], grammar: [g.congiuntivo-trapassato, g.congiuntivo-impersonal], vocab: [w.imperdonabile, w.trascurare, w.scavo] }
      - { es: "Credevo che avessi capito che cosa intendevo.", en: "I thought you'd understood what I meant.", altEs: ["Pensavo che avessi capito cosa intendevo.", "Credevo che tu avessi capito che cosa intendevo."], grammar: [g.congiuntivo-trapassato], vocab: [w.intendere, w.capire] }
      - { es: "Ero contenta che tutti si fossero sentiti coinvolti.", en: "I was glad everyone had felt involved.", altEs: ["Ero contento che tutti si fossero sentiti coinvolti."], grammar: [g.congiuntivo-trapassato, g.congiuntivo-wishes-emotion], vocab: [w.coinvolto] }
      - { es: "Pensavo che il rancore tra i due fratelli fosse ormai passato.", en: "I thought the grudge between the two brothers was over by now.", altEs: ["Credevo che il rancore tra i due fratelli fosse ormai passato."], grammar: [g.congiuntivo-trapassato], vocab: [w.rancore, w.fratello] }
      - { es: "Nessuno immaginava che un uomo così tirchio avesse lasciato tutto ai poveri.", en: "Nobody imagined that such a stingy man had left everything to the poor.", altEs: ["Nessuno pensava che un uomo così tirchio avesse lasciato tutto ai poveri."], grammar: [g.congiuntivo-trapassato], vocab: [w.tirchio, w.povero] }
      - { es: "Mi sorprendeva che Anna, così riservata, avesse raccontato a tutti la sua storia.", en: "It surprised me that Anna, who is so reserved, had told everyone her story.", altEs: ["Mi stupiva che Anna, così riservata, avesse raccontato a tutti la sua storia."], grammar: [g.congiuntivo-trapassato, g.congiuntivo-wishes-emotion], vocab: [w.riservato, w.raccontare] }
      - { es: "Speravo che avessero provato almeno un po' di compassione.", en: "I hoped they had felt at least a little compassion.", altEs: ["Speravo che avessero sentito almeno un po' di compassione."], grammar: [g.congiuntivo-trapassato], vocab: [w.compassione] }
      - { es: "Era strano che un ragazzo così estroverso non avesse detto una parola a cena.", en: "It was strange that such an outgoing guy hadn't said a word at dinner.", altEs: ["Era strano che una ragazza così estroversa non avesse detto una parola a cena."], grammar: [g.congiuntivo-trapassato, g.congiuntivo-impersonal], vocab: [w.estroverso] }
      - { es: "Temevo che si fosse offeso: è così permaloso!", en: "I was afraid he'd taken offence: he's so touchy!", altEs: ["Avevo paura che si fosse offeso: è così permaloso!", "Temevo che si fosse offesa: è così permalosa!"], grammar: [g.congiuntivo-trapassato, g.congiuntivo-wishes-emotion], vocab: [w.permaloso, w.offendere] }
      - { es: "Mi dispiaceva che avessero approfittato della sua gentilezza.", en: "I was sorry they had taken advantage of her kindness.", altEs: ["Mi dispiaceva che si fossero approfittati della sua gentilezza."], grammar: [g.congiuntivo-trapassato, g.congiuntivo-wishes-emotion], vocab: [w.approfittare, w.gentilezza] }
      - { es: "Credevo che fossero già partiti per Pompei.", en: "I thought they'd already left for Pompeii.", altEs: ["Pensavo che fossero già partiti per Pompei."], grammar: [g.congiuntivo-trapassato, g.concordanza-congiuntivo], vocab: [w.partire], error: { wrong: "Credevo che erano già partiti per Pompei.", explain: "After a past verb of opinion, an earlier action takes the congiuntivo trapassato (fossero partiti), not the indicative.", grammar: g.congiuntivo-trapassato } }
      - { es: "Penso che sia stato premuroso con te.", en: "I think he was thoughtful towards you.", altEs: ["Credo che sia stato premuroso con te."], grammar: [g.congiuntivo-passato, g.concordanza-congiuntivo], vocab: [w.premuroso], transform: { instruction: "Put the main verb in the imperfetto: Pensavo che…", answer: "Pensavo che fosse stato premuroso con te.", alt: ["Credevo che fosse stato premuroso con te."], en: "I thought he had been thoughtful towards you." } }
      - { es: "Mi sembra che abbiano sfruttato bene la giornata.", en: "It seems to me they made good use of the day.", altEs: ["Mi pare che abbiano sfruttato bene la giornata."], grammar: [g.congiuntivo-passato, g.concordanza-congiuntivo], vocab: [w.sfruttare, w.giornata], transform: { instruction: "Put the main verb in the imperfetto: Mi sembrava che…", answer: "Mi sembrava che avessero sfruttato bene la giornata.", alt: ["Mi pareva che avessero sfruttato bene la giornata."], en: "It seemed to me they had made good use of the day." } }
    exchanges:
      - q: { es: "Com'era la guida degli scavi?", en: "What was the guide at the excavations like?" }
        a: { es: "Bravissima: pensavo che avesse imparato tutto a memoria, invece parlava con grande umiltà e passione.", en: "Excellent: I thought she'd learnt everything by heart, but she spoke with great humility and passion." }
        alt: ["Bravissima e molto umile.", "Pensavo che fosse noiosa, invece era bravissima."]
        grammar: [g.congiuntivo-trapassato]
        vocab: [w.umiltà, w.scavo]
      - q: { es: "Perché tuo zio non parla con suo fratello?", en: "Why doesn't your uncle speak to his brother?" }
        a: { es: "Per un vecchio risentimento: credevo che l'avessero dimenticato, ma evidentemente no.", en: "Because of an old resentment: I thought they'd forgotten it, but evidently not." }
        alt: ["Per un vecchio risentimento.", "Per una storia di eredità."]
        grammar: [g.congiuntivo-trapassato]
        vocab: [w.risentimento, w.zio]
      - q: { es: "Ti ha ringraziato Paola?", en: "Did Paola thank you?" }
        a: { es: "Sì, con una gratitudine che non mi aspettavo: pensavo che non avesse neanche notato il mio aiuto.", en: "Yes, with a gratitude I wasn't expecting: I thought she hadn't even noticed my help." }
        alt: ["Sì, mi ha ringraziato di cuore.", "No, pensavo che lo avesse fatto, ma non mi ha detto niente."]
        grammar: [g.congiuntivo-trapassato]
        vocab: [w.gratitudine, w.ringraziare]
      - q: { es: "Che cosa pensi di Roberto?", en: "What do you think of Roberto?" }
        a: { es: "È un ipocrita: pensavo che avesse cambiato idea, invece dice una cosa e ne fa un'altra.", en: "He's a hypocrite: I thought he'd changed his mind, but he says one thing and does another." }
        alt: ["È un ipocrita.", "Non lo sopporto: odio l'ipocrisia."]
        grammar: [g.congiuntivo-trapassato]
        vocab: [w.ipocrita, w.ipocrisia]
      - q: { es: "Tua sorella è introversa?", en: "Is your sister introverted?" }
        a: { es: "Sì, ma è molto affettuosa: ieri mi ha abbracciata come se non mi avesse visto da anni.", en: "Yes, but she's very affectionate: yesterday she hugged me as if she hadn't seen me for years." }
        alt: ["Un po', ma è molto affettuosa.", "No, è estroversa come me."]
        grammar: [g.congiuntivo-trapassato, g.come-se]
        vocab: [w.introverso, w.affettuoso]
    texts:
      - title: "Recensione di una visita guidata"
        es: ["Pensavo che la visita fosse già finita, invece la guida ci ha portati alla Villa dei Misteri.", "Non credevo che si potesse parlare con tanta empatia di persone vissute duemila anni fa.", "Peccato che qualche turista avesse già perso la pazienza."]
        en: ["I thought the tour had already finished, but the guide took us to the Villa of the Mysteries.", "I didn't think anyone could talk with such empathy about people who lived two thousand years ago.", "A pity some tourists had already lost patience."]
        grammar: [g.congiuntivo-trapassato, g.congiuntivo-imperfetto]
        vocab: [w.empatia, w.visita]
      - title: "Messaggio di scuse"
        es: ["Scusa per ieri sera.", "Non pensavo che le mie parole ti avessero fatto così male.", "Non era arroganza, solo stanchezza: sono un po' lunatico, lo sai."]
        en: ["Sorry about last night.", "I didn't think my words had hurt you so much.", "It wasn't arrogance, just tiredness: I'm a bit moody, you know."]
        grammar: [g.congiuntivo-trapassato]
        vocab: [w.arroganza, w.lunatico]
    spicy:
      - { es: "Pensavo che fossi venuto a Pompei per gli affreschi, ma guardavi solo me.", en: "I thought you'd come to Pompeii for the frescoes, but you were only looking at me.", altEs: ["Pensavo che fossi venuta a Pompei per gli affreschi, ma guardavi solo me."], grammar: [g.congiuntivo-trapassato], vocab: [w.affresco] }
      - { es: "Credevo che fossi tirchio, poi mi hai offerto due pizze e un babà.", en: "I thought you were stingy, then you bought me two pizzas and a babà.", altEs: ["Credevo che fossi tirchia, poi mi hai offerto due pizze e un babà."], grammar: [g.congiuntivo-imperfetto], vocab: [w.tirchio, w.offrire] }
      - { es: "Pensavo che fossi avaro di complimenti, poi mi hai detto che ho gli occhi del colore del golfo.", en: "I thought you were stingy with compliments, then you told me my eyes are the colour of the bay.", altEs: ["Pensavo che fossi avara di complimenti, poi mi hai detto che ho gli occhi del colore del golfo."], grammar: [g.congiuntivo-imperfetto], vocab: [w.avaro, w.golfo] }
      - { es: "Non immaginavo che una persona così riservata avesse scritto una canzone per me.", en: "I didn't imagine such a reserved person had written a song for me.", altEs: ["Non pensavo che una persona così riservata avesse scritto una canzone per me."], grammar: [g.congiuntivo-trapassato], vocab: [w.riservato, w.canzone] }
      - { es: "Ero sicura che fossi vanitoso, finché non ti ho visto ballare con quel cappello ridicolo.", en: "I was sure you were vain, until I saw you dancing in that ridiculous hat.", altEs: ["Ero sicuro che fossi vanitosa, finché non ti ho vista ballare con quel cappello ridicolo."], grammar: [g.congiuntivo-imperfetto], vocab: [w.vanitoso, w.cappello] }
  - id: b2.u02.l2
    title: Se fossero scappati in tempo
    teach: [g.periodo-ipotetico-3]
    vocab: [w.accorgersi-in-tempo, w.salvarsi, w.avvertimento, w.sopravvivere, w.frenare, w.sorpassare, w.incidente-stradale, w.sbandare, w.per-poco, w.schiantarsi, w.assicurazione, w.risarcimento, w.danneggiare, w.danno, w.avvocato-difensore, w.colpevolezza, w.distratto, w.irresponsabile, w.intervenire, w.intervento, w.affondare, w.ritardare, w.investito, w.meno-male, w.mancare-poco, w.disastro, w.responsabile.adj, w.sbadato, w.sopravvivenza, w.miniera, w.compromettere, w.circondare]
    tip: "A past that did not happen: se + congiuntivo trapassato, + condizionale passato. Se l'avessi saputo, sarei venuto. In speech you will also hear the double imperfetto: se lo sapevo, venivo."
    sentences:
      - { es: "Se gli abitanti di Pompei si fossero accorti in tempo, si sarebbero salvati.", en: "If the inhabitants of Pompeii had noticed in time, they would have saved themselves.", altEs: ["Se gli abitanti di Pompei se ne fossero accorti in tempo, si sarebbero salvati."], grammar: [g.periodo-ipotetico-3], vocab: [w.accorgersi-in-tempo, w.salvarsi, w.abitante] }
      - { es: "Se avessero ascoltato gli avvertimenti del vulcano, molti sarebbero sopravvissuti.", en: "If they had listened to the volcano's warnings, many would have survived.", altEs: ["Molti sarebbero sopravvissuti, se avessero ascoltato gli avvertimenti del vulcano."], grammar: [g.periodo-ipotetico-3], vocab: [w.avvertimento, w.sopravvivere, w.vulcano] }
      - { es: "Se non avessi frenato in tempo, avrei investito un ciclista.", en: "If I hadn't braked in time, I would have hit a cyclist.", altEs: ["Se non avessi frenato in tempo, avrei messo sotto un ciclista."], grammar: [g.periodo-ipotetico-3], vocab: [w.frenare, w.investire] }
      - { es: "Se non avesse sorpassato in curva, non ci sarebbe stato nessun incidente stradale.", en: "If he hadn't overtaken on a bend, there wouldn't have been any road accident.", altEs: ["Non ci sarebbe stato nessun incidente stradale, se non avesse sorpassato in curva."], grammar: [g.periodo-ipotetico-3], vocab: [w.sorpassare, w.incidente-stradale, w.curva] }
      - { es: "Se la strada non fosse stata bagnata, la macchina non avrebbe sbandato.", en: "If the road hadn't been wet, the car wouldn't have skidded.", altEs: ["La macchina non avrebbe sbandato, se la strada non fosse stata bagnata."], grammar: [g.periodo-ipotetico-3], vocab: [w.sbandare, w.bagnato] }
      - { es: "Per poco non ci schiantavamo contro il muro: se non avessi frenato, sarebbe stata la fine.", en: "We very nearly crashed into the wall: if I hadn't braked, it would have been the end.", altEs: ["Per poco non ci siamo schiantati contro il muro: se non avessi frenato, sarebbe stata la fine."], grammar: [g.periodo-ipotetico-3], vocab: [w.per-poco, w.schiantarsi, w.muro], note: "per poco non + imperfetto (or passato prossimo) = very nearly: the non is not a real negative." }
      - { es: "Se avessi avuto un'assicurazione migliore, avrei ricevuto un risarcimento più alto.", en: "If I'd had better insurance, I would have received higher compensation.", altEs: ["Con un'assicurazione migliore, avrei ricevuto un risarcimento più alto."], grammar: [g.periodo-ipotetico-3], vocab: [w.assicurazione, w.risarcimento] }
      - { es: "Se la grandine non avesse danneggiato la macchina, non avremmo dovuto pagare tutti quei danni.", en: "If the hail hadn't damaged the car, we wouldn't have had to pay for all that damage.", altEs: ["Se la grandine non avesse rovinato la macchina, non avremmo dovuto pagare tutti quei danni."], grammar: [g.periodo-ipotetico-3, g.modals-condizionale-passato], vocab: [w.danneggiare, w.danno, w.grandine] }
      - { es: "Se l'avvocato difensore fosse stato più preparato, la colpevolezza dell'imputato non sarebbe stata provata.", en: "If the defence lawyer had been better prepared, the defendant's guilt wouldn't have been proved.", altEs: ["Se l'avvocato difensore fosse stato più preparato, non avrebbero provato la colpevolezza dell'imputato."], grammar: [g.periodo-ipotetico-3, g.passive-essere], vocab: [w.avvocato-difensore, w.colpevolezza, w.imputato] }
      - { es: "Se fossi stato meno distratto, non avresti perso il treno per Pompei.", en: "If you'd been less absent-minded, you wouldn't have missed the train to Pompeii.", altEs: ["Se fossi stata meno distratta, non avresti perso il treno per Pompei."], grammar: [g.periodo-ipotetico-3], vocab: [w.distratto, w.treno] }
      - { es: "Se non fosse stato così irresponsabile, nessuno si sarebbe fatto male.", en: "If he hadn't been so irresponsible, nobody would have got hurt.", altEs: ["Se non fosse stata così irresponsabile, nessuno si sarebbe fatto male."], grammar: [g.periodo-ipotetico-3], vocab: [w.irresponsabile, w.fare-male] }
      - { es: "Se l'ambulanza fosse intervenuta prima, l'intervento sarebbe stato più semplice.", en: "If the ambulance had stepped in sooner, the operation would have been simpler.", altEs: ["Se l'ambulanza fosse arrivata prima, l'intervento sarebbe stato più semplice."], grammar: [g.periodo-ipotetico-3], vocab: [w.intervenire, w.intervento, w.ambulanza] }
      - { es: "Se la nave non fosse affondata, le anfore sarebbero arrivate a Roma.", en: "If the ship hadn't sunk, the amphorae would have reached Rome.", altEs: ["Le anfore sarebbero arrivate a Roma, se la nave non fosse affondata."], grammar: [g.periodo-ipotetico-3], vocab: [w.affondare, w.nave, w.anfora] }
      - { es: "Se l'avessi saputo, sarei venuto.", en: "If I'd known, I would have come.", altEs: ["Se l'avessi saputo, sarei venuta.", "Se lo sapevo, venivo."], grammar: [g.periodo-ipotetico-3], vocab: [w.sapere, w.venire], error: { wrong: "Se l'avrei saputo, sarei venuto.", explain: "The se clause never takes the conditional: se l'avessi saputo (congiuntivo trapassato), sarei venuto (condizionale passato).", grammar: g.periodo-ipotetico-3 } }
      - { es: "Non sono partito presto, così ho trovato traffico.", en: "I didn't leave early, so I hit traffic.", altEs: ["Non sono partita presto, così ho trovato traffico."], grammar: [g.connectors-cause-consequence], vocab: [w.traffico], transform: { instruction: "Rewrite as a type-3 condition: Se…", answer: "Se fossi partito presto, non avrei trovato traffico.", alt: ["Se fossi partita presto, non avrei trovato traffico.", "Non avrei trovato traffico, se fossi partito presto."], en: "If I'd left early, I wouldn't have hit traffic." } }
      - { es: "Se ritardano il volo, perdiamo la coincidenza.", en: "If they delay the flight, we'll miss the connection.", grammar: [g.periodo-ipotetico-1], vocab: [w.ritardare, w.coincidenza], transform: { instruction: "Move it into the past: it could have happened but didn't (type 3)", answer: "Se avessero ritardato il volo, avremmo perso la coincidenza.", alt: ["Avremmo perso la coincidenza, se avessero ritardato il volo."], en: "If they had delayed the flight, we would have missed the connection." } }
    exchanges:
      - q: { es: "Com'è successo l'incidente?", en: "How did the accident happen?" }
        a: { es: "Un motorino è uscito all'improvviso da una strada laterale: se non avessi frenato, l'avrei investito.", en: "A moped suddenly came out of a side street: if I hadn't braked, I would have hit it." }
        alt: ["Un motorino è uscito all'improvviso.", "Se non avessi frenato, sarebbe stato peggio."]
        grammar: [g.periodo-ipotetico-3]
        vocab: [w.frenare, w.motorino, w.investire]
      - q: { es: "Ti sei fatto male?", en: "Did you get hurt?" }
        a: { es: "No, meno male! Ma c'è mancato poco: se non avessi avuto la cintura, sarebbe stato un disastro.", en: "No, thank goodness! But it was a close call: if I hadn't had my seatbelt on, it would have been a disaster." }
        alt: ["No, per fortuna.", "Meno male, no! Ma c'è mancato poco."]
        grammar: [g.periodo-ipotetico-3]
        vocab: [w.meno-male, w.mancare-poco, w.disastro, w.cintura]
      - q: { es: "Chi è responsabile del danno?", en: "Who is responsible for the damage?" }
        a: { es: "L'altro autista: se fosse stato meno sbadato, avrebbe visto il semaforo rosso.", en: "The other driver: if he'd been less careless, he would have seen the red light." }
        alt: ["L'altro autista.", "Lui: se fosse stato attento, avrebbe visto il rosso."]
        grammar: [g.periodo-ipotetico-3]
        vocab: [w.responsabile.adj, w.sbadato, w.danno, w.semaforo]
      - q: { es: "Gli abitanti di Pompei avrebbero potuto salvarsi?", en: "Could the inhabitants of Pompeii have saved themselves?" }
        a: { es: "Molti sì: se fossero scappati subito verso il mare, avrebbero avuto più possibilità di sopravvivenza.", en: "Many could: if they had fled straight towards the sea, they would have had a better chance of survival." }
        alt: ["Molti sì, se fossero scappati subito.", "Forse sì, se si fossero accorti in tempo."]
        grammar: [g.periodo-ipotetico-3]
        vocab: [w.sopravvivenza, w.salvarsi, w.scappare]
      - q: { es: "Perché hanno chiuso la vecchia miniera?", en: "Why did they close the old mine?" }
        a: { es: "Era pericolosa: se non l'avessero chiusa, avrebbero compromesso la sicurezza di tutto il paese.", en: "It was dangerous: if they hadn't closed it, they would have jeopardised the safety of the whole village." }
        alt: ["Perché era pericolosa.", "Se non l'avessero chiusa, sarebbe crollata."]
        grammar: [g.periodo-ipotetico-3]
        vocab: [w.miniera, w.compromettere, w.sicurezza]
    texts:
      - title: "Plinio il Vecchio, 79 d.C."
        es: ["Plinio il Vecchio vide una nuvola enorme sopra il Vesuvio e partì con le navi da Miseno.", "La cenere e il fumo circondarono presto tutta la costa.", "Se fosse rimasto a Miseno, forse sarebbe sopravvissuto."]
        en: ["Pliny the Elder saw an enormous cloud above Vesuvius and set off from Misenum with his ships.", "Ash and smoke soon surrounded the whole coast.", "If he had stayed in Misenum, perhaps he would have survived."]
        grammar: [g.periodo-ipotetico-3, g.passato-remoto-recognition]
        vocab: [w.circondare, w.cenere, w.sopravvivere]
      - title: "Notizia locale"
        es: ["Ieri sera un ciclista è stato investito sulla strada per Pompei.", "L'uomo è sopravvissuto: se l'ambulanza non fosse arrivata subito, sarebbe andata molto peggio.", "Secondo la polizia, il conducente dell'auto era distratto dal telefono."]
        en: ["Last night a cyclist was run over on the road to Pompeii.", "The man survived: if the ambulance hadn't arrived immediately, it would have been much worse.", "According to the police, the car driver was distracted by his phone."]
        grammar: [g.periodo-ipotetico-3, g.passive-essere]
        vocab: [w.investito, w.ambulanza, w.distratto]
    spicy:
      - { es: "Se mi avessi avvertito che eri così simpatico, mi sarei pettinata.", en: "If you'd warned me you were so charming, I would have brushed my hair.", altEs: ["Se mi avessi avvertita che eri così simpatica, mi sarei pettinato."], grammar: [g.periodo-ipotetico-3], vocab: [w.avvertire, w.pettinarsi] }
      - { es: "Se fossi arrivato puntuale, non avrei avuto il tempo di innamorarmi del cameriere.", en: "If you'd arrived on time, I wouldn't have had time to fall for the waiter.", altEs: ["Se fossi arrivata puntuale, non avrei avuto il tempo di innamorarmi della cameriera."], grammar: [g.periodo-ipotetico-3], vocab: [w.puntuale, w.innamorarsi, w.cameriere] }
      - { es: "Meno male che hai perso il treno: se fossi partito, non avremmo passato la notte a parlare sul lungomare.", en: "Thank goodness you missed the train: if you'd left, we wouldn't have spent the night talking on the seafront.", altEs: ["Meno male che hai perso il treno: se fossi partita, non avremmo passato la notte a parlare sul lungomare."], grammar: [g.periodo-ipotetico-3], vocab: [w.meno-male, w.lungomare] }
      - { es: "Per poco non ti baciavo davanti alla guida degli scavi: c'è mancato davvero poco.", en: "I very nearly kissed you in front of the excavations guide: it was a really close call.", altEs: ["Per poco non ti ho baciato davanti alla guida degli scavi: c'è mancato davvero poco."], grammar: [g.periodo-ipotetico-3], vocab: [w.per-poco, w.mancare-poco, w.baciare] }
      - { es: "Se non fossi stato così distratto dai tuoi occhi, non avrei sbagliato strada tre volte.", en: "If I hadn't been so distracted by your eyes, I wouldn't have taken the wrong road three times.", altEs: ["Se non fossi stata così distratta dai tuoi occhi, non avrei sbagliato strada tre volte."], grammar: [g.periodo-ipotetico-3], vocab: [w.distratto, w.occhio] }
  - id: b2.u02.l3
    title: A saperlo!
    teach: [g.periodo-ipotetico-3, g.congiuntivo-trapassato]
    vocab: [w.cogliere-lattimo, w.esitare, w.rimpianto, w.rimpiangere, w.rimorso, w.bivio, w.svolta, w.a-saperlo, w.saperlo, w.guaio, w.evitabile, w.sorte, w.rinunciare, w.pasticcio, w.ingenuo, w.superficiale, w.perdere-loccasione, w.occasione-persa, w.testardaggine, w.prevedibile, w.imprevedibile, w.ritardatario, w.destino, w.rinuncia, w.rovina, w.pentimento, w.rovinare, w.inevitabile, w.sfortuna, w.esitazione, w.cogliere, w.attimo]
    tip: "Regrets about the past: se + congiuntivo trapassato. A saperlo! (= had I known) and the spoken double imperfetto (se lo sapevo, venivo) are very common in conversation."
    sentences:
      - { es: "Se avessi colto l'attimo, le avrei detto tutto quella sera a Pompei.", en: "If I had seized the moment, I would have told her everything that evening in Pompeii.", altEs: ["Se avessi colto l'attimo, gli avrei detto tutto quella sera a Pompei."], grammar: [g.periodo-ipotetico-3], vocab: [w.cogliere-lattimo, w.sera] }
      - { es: "Se non avessi esitato, avrei avuto quel lavoro.", en: "If I hadn't hesitated, I would have got that job.", altEs: ["Avrei avuto quel lavoro, se non avessi esitato."], grammar: [g.periodo-ipotetico-3], vocab: [w.esitare, w.lavoro] }
      - { es: "Ho un solo rimpianto: se avessi ascoltato mio padre, avrei studiato archeologia.", en: "I have just one regret: if I'd listened to my father, I would have studied archaeology.", altEs: ["Ho un unico rimpianto: se avessi ascoltato mio padre, avrei studiato archeologia."], grammar: [g.periodo-ipotetico-3], vocab: [w.rimpianto, w.archeologia] }
      - { es: "Rimpiango di non averti chiamato: se l'avessi fatto, le cose sarebbero andate diversamente.", en: "I regret not calling you: if I had, things would have turned out differently.", altEs: ["Rimpiango di non averti chiamata: se l'avessi fatto, le cose sarebbero andate in un altro modo."], grammar: [g.periodo-ipotetico-3, g.past-infinitive], vocab: [w.rimpiangere, w.chiamare] }
      - { es: "Aveva un grande rimorso: se fosse rimasto a casa, sua madre non sarebbe stata sola.", en: "He felt great remorse: if he had stayed at home, his mother wouldn't have been alone.", altEs: ["Provava un grande rimorso: se fosse rimasto a casa, sua madre non sarebbe stata sola."], grammar: [g.periodo-ipotetico-3], vocab: [w.rimorso, w.solo] }
      - { es: "Era un bivio: se avessi scelto l'altra strada, chissà dove sarei finito.", en: "It was a crossroads: if I'd chosen the other road, who knows where I would have ended up.", altEs: ["Ero a un bivio: se avessi scelto l'altra strada, chissà dove sarei finita."], grammar: [g.periodo-ipotetico-3], vocab: [w.bivio, w.scegliere] }
      - { es: "Quel viaggio a Napoli fu una svolta: se non fossi partito, non avrei conosciuto mia moglie.", en: "That trip to Naples was a turning point: if I hadn't gone, I wouldn't have met my wife.", altEs: ["Quel viaggio a Napoli è stato una svolta: se non fossi partito, non avrei conosciuto mia moglie."], grammar: [g.periodo-ipotetico-3, g.passato-remoto-recognition], vocab: [w.svolta, w.viaggio, w.moglie] }
      - { es: "A saperlo, sarei venuta prima!", en: "Had I known, I would have come earlier!", altEs: ["A saperlo, sarei venuto prima!", "Se l'avessi saputo, sarei venuta prima!"], grammar: [g.periodo-ipotetico-3], vocab: [w.a-saperlo, w.saperlo], note: "A saperlo = se l'avessi saputo: a common spoken shortcut." }
      - { es: "Era un guaio evitabile: se avessimo controllato l'orario, non avremmo perso l'ultimo treno.", en: "It was an avoidable mess: if we'd checked the timetable, we wouldn't have missed the last train.", altEs: ["Era un guaio evitabile: se avessimo guardato l'orario, non avremmo perso l'ultimo treno."], grammar: [g.periodo-ipotetico-3], vocab: [w.guaio, w.evitabile, w.orario] }
      - { es: "Se la sorte fosse stata più generosa, il Napoli avrebbe vinto la partita.", en: "If fate had been more generous, Napoli would have won the match.", altEs: ["Con un po' più di fortuna, il Napoli avrebbe vinto la partita."], grammar: [g.periodo-ipotetico-3], vocab: [w.sorte, w.generoso, w.partita] }
      - { es: "Se non avesse rinunciato alla borsa di studio, avrebbe passato un anno a Parigi.", en: "If she hadn't turned down the scholarship, she would have spent a year in Paris.", altEs: ["Se non avesse rinunciato alla borsa di studio, avrebbe trascorso un anno a Parigi."], grammar: [g.periodo-ipotetico-3], vocab: [w.rinunciare, w.borsa-di-studio] }
      - { es: "Ho combinato un bel pasticcio: se ti avessi ascoltato, non sarebbe successo.", en: "I've made a real mess of things: if I'd listened to you, it wouldn't have happened.", altEs: ["Ho fatto un bel pasticcio: se ti avessi ascoltato, non sarebbe successo.", "Ho combinato un bel pasticcio: se ti avessi ascoltata, non sarebbe successo."], grammar: [g.periodo-ipotetico-3], vocab: [w.pasticcio, w.ascoltare] }
      - { es: "Se avessi saputo dello sciopero, sarei partita il giorno prima.", en: "If I'd known about the strike, I would have left the day before.", altEs: ["Se avessi saputo dello sciopero, sarei partito il giorno prima."], grammar: [g.periodo-ipotetico-3], vocab: [w.sciopero], error: { wrong: "Se sapessi dello sciopero, sarei partita il giorno prima.", explain: "The condition is in the past and didn't happen, so it needs the congiuntivo trapassato: se avessi saputo.", grammar: g.periodo-ipotetico-3 } }
      - { es: "Ero ingenuo e mi sono fidato di lui.", en: "I was naive and I trusted him.", altEs: ["Ero ingenua e mi sono fidata di lui."], grammar: [g.passato-prossimo-vs-imperfetto], vocab: [w.ingenuo, w.fidarsi], transform: { instruction: "Rewrite as a regret: Se non fossi stato così ingenuo…", answer: "Se non fossi stato così ingenuo, non mi sarei fidato di lui.", alt: ["Se non fossi stata così ingenua, non mi sarei fidata di lui."], en: "If I hadn't been so naive, I wouldn't have trusted him." } }
      - { es: "Sei stato superficiale e hai perso l'occasione.", en: "You were careless and you missed the chance.", altEs: ["Sei stata superficiale e hai perso l'occasione."], grammar: [g.passato-prossimo-essere], vocab: [w.superficiale, w.perdere-loccasione], transform: { instruction: "Rewrite as a type-3 condition: Se non…", answer: "Se non fossi stato superficiale, non avresti perso l'occasione.", alt: ["Se non fossi stata superficiale, non avresti perso l'occasione.", "Non avresti perso l'occasione, se non fossi stato superficiale."], en: "If you hadn't been careless, you wouldn't have missed the chance." } }
      - { es: "Se lo sapevo, non venivo.", en: "If I'd known, I wouldn't have come.", altEs: ["Se l'avessi saputo, non sarei venuto.", "Se l'avessi saputo, non sarei venuta."], grammar: [g.periodo-ipotetico-3], vocab: [w.sapere], note: "Double imperfetto: spoken Italian only. In writing use se l'avessi saputo, non sarei venuto." }
    exchanges:
      - q: { es: "Ti penti di non essere andato a vivere a Napoli?", en: "Do you regret not going to live in Naples?" }
        a: { es: "Un po': è la mia grande occasione persa. Se fossi partito allora, chissà che vita avrei fatto.", en: "A bit: it's my great missed opportunity. If I'd gone back then, who knows what life I'd have had." }
        alt: ["Un po'.", "No, se fossi partito non avrei conosciuto te."]
        grammar: [g.periodo-ipotetico-3]
        vocab: [w.occasione-persa, w.pentirsi]
      - q: { es: "Perché vi siete lasciati?", en: "Why did you break up?" }
        a: { es: "Per la sua testardaggine: se avesse ammesso l'errore almeno una volta, ci saremmo chiariti.", en: "Because of his stubbornness: if he'd admitted his mistake at least once, we would have sorted things out." }
        alt: ["Per la sua testardaggine.", "Per colpa di tutti e due."]
        grammar: [g.periodo-ipotetico-3]
        vocab: [w.testardaggine, w.errore]
      - q: { es: "Il temporale era prevedibile?", en: "Was the storm predictable?" }
        a: { es: "No, il tempo in montagna è imprevedibile. Ma se avessimo controllato il meteo, forse non saremmo partiti.", en: "No, mountain weather is unpredictable. But if we'd checked the forecast, perhaps we wouldn't have set off." }
        alt: ["Per niente.", "Sì, se avessimo guardato il meteo, l'avremmo saputo."]
        grammar: [g.periodo-ipotetico-3]
        vocab: [w.prevedibile, w.imprevedibile, w.meteo]
      - q: { es: "Sei arrivato di nuovo in ritardo!", en: "You've arrived late again!" }
        a: { es: "Lo so, sono un ritardatario. Se non avessi perso l'autobus, sarei arrivato in tempo.", en: "I know, I'm always late. If I hadn't missed the bus, I would have arrived on time." }
        alt: ["Scusa, ho perso l'autobus.", "Lo so, sono una ritardataria."]
        grammar: [g.periodo-ipotetico-3]
        vocab: [w.ritardatario, w.autobus]
      - q: { es: "Credi nel destino?", en: "Do you believe in fate?" }
        a: { es: "Un po' sì: se quella sera non avessi perso il treno, non ti avrei mai incontrata.", en: "A bit, yes: if I hadn't missed the train that evening, I would never have met you." }
        alt: ["Sì, ci credo.", "No, credo nelle scelte, non nel destino."]
        grammar: [g.periodo-ipotetico-3]
        vocab: [w.destino, w.incontrare]
    texts:
      - title: "Lettera della nonna"
        es: ["Cara Lucia, alla tua età ho avuto paura e ho detto di no a un viaggio in America.", "Se non avessi esitato, forse la mia vita sarebbe stata diversa.", "Non vivere di rimpianti: cogli l'attimo, perché ogni rinuncia ha un prezzo."]
        en: ["Dear Lucia, at your age I was scared and I said no to a trip to America.", "If I hadn't hesitated, perhaps my life would have been different.", "Don't live with regrets: seize the moment, because every renunciation has a price."]
        grammar: [g.periodo-ipotetico-3, g.imperativo-negative]
        vocab: [w.esitare, w.rimpianto, w.cogliere-lattimo, w.rinuncia]
      - title: "Il pentimento di Gigi"
        es: ["Gigi ha dimenticato di prenotare il ristorante per l'anniversario.", "Se l'avesse fatto, la serata non sarebbe stata una rovina.", "Il suo pentimento era sincero: il giorno dopo ha cucinato lui."]
        en: ["Gigi forgot to book the restaurant for their anniversary.", "If he had, the evening wouldn't have been a disaster.", "His remorse was sincere: the next day he did the cooking."]
        grammar: [g.periodo-ipotetico-3]
        vocab: [w.rovina, w.pentimento, w.anniversario]
    spicy:
      - { es: "Se avessi colto l'attimo quella sera, ti avrei baciato sotto le stelle invece di parlare del meteo.", en: "If I'd seized the moment that evening, I would have kissed you under the stars instead of talking about the weather forecast.", altEs: ["Se avessi colto l'attimo quella sera, ti avrei baciata sotto le stelle invece di parlare del meteo."], grammar: [g.periodo-ipotetico-3], vocab: [w.cogliere-lattimo, w.stella, w.meteo] }
      - { es: "Se ti avessi chiesto il numero subito, non avrei passato tre settimane a cercarti in tutta Napoli.", en: "If I'd asked for your number straight away, I wouldn't have spent three weeks looking for you all over Naples.", altEs: ["Se ti avessi chiesto subito il numero, non avrei passato tre settimane a cercarti per tutta Napoli."], grammar: [g.periodo-ipotetico-3], vocab: [w.numero, w.cercare] }
      - { es: "Hai rovinato la mia dieta: se non mi avessi fatto assaggiare quel babà, sarei ancora una persona seria.", en: "You've ruined my diet: if you hadn't made me taste that babà, I'd still be a serious person.", altEs: ["Mi hai rovinato la dieta: se non mi avessi fatto assaggiare quel babà, sarei ancora una persona seria."], grammar: [g.periodo-ipotetico-misto, g.fare-causative], vocab: [w.rovinare, w.dieta, w.assaggiare] }
      - { es: "A saperlo che ballavi così bene, ti avrei invitato molto prima!", en: "Had I known you danced so well, I would have asked you much sooner!", altEs: ["A saperlo che ballavi così bene, ti avrei invitata molto prima!"], grammar: [g.periodo-ipotetico-3], vocab: [w.a-saperlo, w.ballare] }
      - { es: "Non ho rimorsi per quel bacio, solo il rimpianto di non avertene dato un altro.", en: "I have no remorse about that kiss, only the regret of not giving you another one.", altEs: ["Non ho nessun rimorso per quel bacio, solo il rimpianto di non avertene dato un altro."], grammar: [g.past-infinitive, g.combined-pronouns], vocab: [w.rimorso, w.rimpianto, w.bacio] }
  - id: b2.u02.l4
    title: Se avessi studiato, adesso sarei archeologo
    teach: [g.periodo-ipotetico-misto]
    vocab: [w.esperienza-di-vita, w.consapevole, w.cavarsela, w.lezione-di-vita, w.crescita-personale, w.tornare-indietro, w.altrimenti, w.consapevolezza, w.in-tal-caso, w.avanti, w.indietro, w.semmai, w.maturare]
    tip: "Mix the halves when the times differ: past condition → present result (se avessi studiato, ora sarei medico); present quality → past result (se fossi più attento, non avrei sbagliato)."
    sentences:
      - { es: "Se avessi studiato archeologia, adesso lavorerei negli scavi di Pompei.", en: "If I'd studied archaeology, I'd be working at the excavations in Pompeii now.", altEs: ["Se avessi studiato archeologia, ora lavorerei negli scavi di Pompei."], grammar: [g.periodo-ipotetico-misto], vocab: [w.archeologia, w.scavo] }
      - { es: "Se non avessi fatto quell'esperienza di vita, oggi sarei una persona diversa.", en: "If I hadn't had that life experience, I'd be a different person today.", altEs: ["Senza quell'esperienza di vita, oggi sarei una persona diversa."], grammar: [g.periodo-ipotetico-misto], vocab: [w.esperienza-di-vita, w.diverso] }
      - { es: "Se fossi più consapevole dei rischi, non avrei accettato.", en: "If I were more aware of the risks, I wouldn't have accepted.", altEs: ["Se fossi più consapevole dei rischi, non avrei mai accettato."], grammar: [g.periodo-ipotetico-misto], vocab: [w.consapevole, w.rischio, w.accettare] }
      - { es: "Se non avessimo perso il treno, ora saremmo già a Pompei.", en: "If we hadn't missed the train, we'd already be in Pompeii now.", altEs: ["Se non avessimo perso il treno, adesso saremmo già a Pompei."], grammar: [g.periodo-ipotetico-misto], vocab: [w.treno, w.perdere] }
      - { es: "Se fosse meno testardo, avrebbe chiesto aiuto subito.", en: "If he were less stubborn, he would have asked for help straight away.", altEs: ["Se fosse meno testarda, avrebbe chiesto aiuto subito."], grammar: [g.periodo-ipotetico-misto], vocab: [w.testardo, w.aiuto] }
      - { es: "Se non avessi imparato a cavarmela da solo, adesso sarei in difficoltà.", en: "If I hadn't learnt to get by on my own, I'd be in trouble now.", altEs: ["Se non avessi imparato a cavarmela da sola, adesso sarei in difficoltà."], grammar: [g.periodo-ipotetico-misto, g.pronominal-verbs], vocab: [w.cavarsela, w.difficoltà] }
      - { es: "Quel fallimento è stato una lezione di vita: se non fosse successo, oggi non sarei la persona che sono.", en: "That failure was a life lesson: if it hadn't happened, I wouldn't be the person I am today.", altEs: ["Quel fallimento è stato una lezione di vita: senza quel fallimento, oggi non sarei la persona che sono."], grammar: [g.periodo-ipotetico-misto], vocab: [w.lezione-di-vita, w.fallimento] }
      - { es: "Anche se potessi tornare indietro, rifarei tutto.", en: "Even if I could go back, I'd do it all again.", altEs: ["Se potessi tornare indietro, rifarei tutto."], grammar: [g.periodo-ipotetico-2, g.concessive-clauses], vocab: [w.tornare-indietro, w.rifare] }
      - { es: "Se tu fossi più paziente, avresti già capito come funziona.", en: "If you were more patient, you'd already have understood how it works.", altEs: ["Se fossi più paziente, avresti già capito come funziona."], grammar: [g.periodo-ipotetico-misto], vocab: [w.paziente, w.funzionare] }
      - { es: "La crescita personale non è una gara: se l'avessi capito prima, oggi sarei più sereno.", en: "Personal growth isn't a race: if I'd understood that sooner, I'd be calmer today.", altEs: ["La crescita personale non è una gara: se l'avessi capito prima, oggi sarei più serena."], grammar: [g.periodo-ipotetico-misto], vocab: [w.crescita-personale, w.gara, w.sereno] }
      - { es: "Se fossi nato a Napoli, capirei tutte le battute di Totò.", en: "If I'd been born in Naples, I'd understand all of Totò's jokes.", altEs: ["Se fossi nata a Napoli, capirei tutte le battute di Totò."], grammar: [g.periodo-ipotetico-misto], vocab: [w.nascere, w.battuta] }
      - { es: "Abbiamo prenotato a marzo, altrimenti adesso non avremmo un posto per dormire.", en: "We booked in March, otherwise we wouldn't have anywhere to sleep now.", altEs: ["Abbiamo prenotato a marzo, sennò adesso non avremmo un posto per dormire."], grammar: [g.periodo-ipotetico-misto, g.connectors-cause-consequence], vocab: [w.altrimenti, w.prenotare] }
      - { es: "Se avessi studiato medicina, adesso sarei medico.", en: "If I'd studied medicine, I'd be a doctor now.", altEs: ["Se avessi studiato medicina, ora sarei medico.", "Se avessi studiato medicina, adesso farei il medico."], grammar: [g.periodo-ipotetico-misto], vocab: [w.medicina, w.medico], error: { wrong: "Se avessi studiato medicina, adesso sarei stato medico.", explain: "The result is about now, so it takes the condizionale presente (sarei), not the condizionale passato.", grammar: g.periodo-ipotetico-misto } }
      - { es: "Non ho preso l'ombrello e ora sono tutto bagnato.", en: "I didn't take my umbrella and now I'm soaking wet.", altEs: ["Non ho preso l'ombrello e adesso sono tutta bagnata."], grammar: [g.passato-prossimo-avere], vocab: [w.ombrello, w.bagnato], transform: { instruction: "Rewrite as a mixed condition: Se avessi preso…", answer: "Se avessi preso l'ombrello, ora non sarei tutto bagnato.", alt: ["Se avessi preso l'ombrello, adesso non sarei tutta bagnata.", "Se avessi preso l'ombrello, ora non sarei bagnato."], en: "If I'd taken my umbrella, I wouldn't be soaking wet now." } }
      - { es: "Non parlo napoletano, quindi non ho capito la battuta.", en: "I don't speak Neapolitan, so I didn't get the joke.", grammar: [g.connectors-cause-consequence], vocab: [w.napoletano, w.battuta], transform: { instruction: "Rewrite as a mixed condition: Se parlassi…", answer: "Se parlassi napoletano, avrei capito la battuta.", alt: ["Avrei capito la battuta, se parlassi napoletano."], en: "If I spoke Neapolitan, I'd have got the joke." } }
      - { es: "Se mi fossi trasferito a Napoli dieci anni fa, adesso parlerei il dialetto.", en: "If I'd moved to Naples ten years ago, I'd speak the dialect now.", altEs: ["Se mi fossi trasferita a Napoli dieci anni fa, adesso parlerei il dialetto."], grammar: [g.periodo-ipotetico-misto], vocab: [w.trasferirsi, w.dialetto] }
    exchanges:
      - q: { es: "Ti penti di aver lasciato l'università?", en: "Do you regret leaving university?" }
        a: { es: "No: se non l'avessi lasciata, adesso non avrei il mio ristorante.", en: "No: if I hadn't left, I wouldn't have my restaurant now." }
        alt: ["No, per niente.", "Un po': se avessi finito, adesso avrei una laurea."]
        grammar: [g.periodo-ipotetico-misto]
        vocab: [w.università, w.ristorante]
      - q: { es: "Che cosa hai imparato da quell'esperienza?", en: "What did you learn from that experience?" }
        a: { es: "Ho preso consapevolezza: se non fosse successo, sarei ancora ingenuo come prima.", en: "I became aware: if it hadn't happened, I'd still be as naive as before." }
        alt: ["Molto: è stata una lezione di vita.", "Ho preso consapevolezza dei miei limiti."]
        grammar: [g.periodo-ipotetico-misto]
        vocab: [w.consapevolezza, w.ingenuo]
      - q: { es: "E se domani piovesse?", en: "And what if it rained tomorrow?" }
        a: { es: "In tal caso visiteremmo il Museo Archeologico invece degli scavi.", en: "In that case we'd visit the Archaeological Museum instead of the excavations." }
        alt: ["In tal caso resteremmo a Napoli.", "Andremmo al museo."]
        grammar: [g.periodo-ipotetico-2]
        vocab: [w.in-tal-caso, w.museo]
      - q: { es: "Vado avanti o torno indietro?", en: "Shall I keep going or go back?" }
        a: { es: "Vai avanti: se fossi sempre tornato indietro, oggi non saresti arrivato fin qui.", en: "Keep going: if you'd always turned back, you wouldn't have got this far today." }
        alt: ["Vai avanti!", "Torna indietro, è tardi."]
        grammar: [g.periodo-ipotetico-3, g.imperativo-tu]
        vocab: [w.avanti, w.indietro]
      - q: { es: "Ho sbagliato a non dirglielo?", en: "Was I wrong not to tell him?" }
        a: { es: "Semmai hai sbagliato ad aspettare: se gliel'avessi detto subito, ora sarebbe tutto chiarito.", en: "If anything you were wrong to wait: if you'd told him straight away, everything would be cleared up now." }
        alt: ["No, hai fatto bene.", "Semmai hai sbagliato ad aspettare."]
        grammar: [g.periodo-ipotetico-misto, g.combined-pronouns]
        vocab: [w.semmai, w.sbagliare]
      - q: { es: "Tuo figlio è cambiato molto.", en: "Your son has changed a lot." }
        a: { es: "Sì, è maturato: se non avesse fatto quell'anno all'estero, sarebbe ancora un ragazzino.", en: "Yes, he's grown up: if he hadn't done that year abroad, he'd still be a kid." }
        alt: ["Sì, è maturato molto.", "Sì, l'anno all'estero gli ha fatto bene."]
        grammar: [g.periodo-ipotetico-misto]
        vocab: [w.maturare, w.estero]
    texts:
      - title: "Pensieri di un archeologo"
        es: ["Da ragazzo volevo fare il calciatore.", "Se non avessi visitato Pompei a dodici anni, oggi non farei questo mestiere.", "Quella gita di scuola è stata la mia lezione di vita."]
        en: ["As a boy I wanted to be a footballer.", "If I hadn't visited Pompeii at the age of twelve, I wouldn't be doing this job today.", "That school trip was my life lesson."]
        grammar: [g.periodo-ipotetico-misto]
        vocab: [w.lezione-di-vita, w.gita]
      - title: "Bilancio di fine anno"
        es: ["Quest'anno ho imparato a cavarmela da sola.", "Se non avessi cambiato città, adesso avrei ancora paura di tutto.", "La crescita personale costa fatica, ma ne vale la pena."]
        en: ["This year I learnt to get by on my own.", "If I hadn't moved to another city, I'd still be afraid of everything now.", "Personal growth takes effort, but it's worth it."]
        grammar: [g.periodo-ipotetico-misto]
        vocab: [w.cavarsela, w.crescita-personale, w.fatica]
    spicy:
      - { es: "Se fossi meno timido, ti avrei già chiesto di uscire tre settimane fa.", en: "If I were less shy, I'd have asked you out three weeks ago.", altEs: ["Se fossi meno timida, ti avrei già chiesto di uscire tre settimane fa."], grammar: [g.periodo-ipotetico-misto], vocab: [w.timido, w.uscire] }
      - { es: "Se ieri sera non avessimo ballato fino alle tre, oggi saremmo più svegli, ma molto meno felici.", en: "If we hadn't danced until three last night, we'd be more awake today, but much less happy.", altEs: ["Se ieri sera non avessimo ballato fino alle tre, oggi saremmo più svegli ma molto meno felici."], grammar: [g.periodo-ipotetico-misto], vocab: [w.ballare, w.felice] }
      - { es: "Se non mi avessi sorriso al museo, adesso starei guardando statue invece di guardare te.", en: "If you hadn't smiled at me in the museum, I'd be looking at statues now instead of looking at you.", altEs: ["Se non mi avessi sorriso al museo, ora guarderei le statue invece di guardare te."], grammar: [g.periodo-ipotetico-misto, g.stare-gerundio], vocab: [w.sorridere, w.statua] }
      - { es: "Se tu fossi meno affascinante, avrei finito la visita in un'ora invece di tre.", en: "If you were less charming, I'd have finished the tour in one hour instead of three.", altEs: ["Se fossi meno affascinante, avrei finito la visita in un'ora invece che in tre."], grammar: [g.periodo-ipotetico-misto], vocab: [w.visita, w.finire] }
      - { es: "Semmai te lo chiedessi, ti ho portata a Pompei solo per prenderti la mano sulle pietre antiche.", en: "In case you were wondering, I brought you to Pompeii just to hold your hand on the ancient stones.", altEs: ["Semmai te lo chiedessi, ti ho portato a Pompei solo per prenderti la mano sulle pietre antiche."], grammar: [g.congiuntivo-imperfetto], vocab: [w.semmai, w.pietra, w.mano] }
dialogues:
  - id: b2.u02.d1
    title: In ritardo agli scavi
    context: Nunzia and Ciro arrive at the excavations of Pompeii and find that their guided tour has already left.
    lines:
      - { speaker: Nunzia, es: "Ciro, la visita guidata è partita venti minuti fa!", en: "Ciro, the guided tour left twenty minutes ago!" }
      - { speaker: Ciro, es: "Davvero? Pensavo che l'avessero spostata alle undici.", en: "Really? I thought they'd moved it to eleven." }
      - { speaker: Nunzia, es: "Se avessi letto il messaggio della guida, avresti saputo che era alle dieci.", en: "If you'd read the guide's message, you would have known it was at ten." }
      - { speaker: Ciro, es: "Hai ragione, sono proprio sbadato. Se fossimo partiti prima da Napoli, saremmo arrivati in tempo.", en: "You're right, I'm really scatterbrained. If we'd left Naples earlier, we would have arrived on time." }
      - { speaker: Nunzia, es: "Meno male che i biglietti valgono tutto il giorno. Ce la caviamo da soli.", en: "Thank goodness the tickets are valid all day. We'll manage on our own." }
      - { speaker: Ciro, es: "Guarda questa casa: se non fosse stata sepolta dalla cenere, gli affreschi non sarebbero così belli oggi.", en: "Look at this house: if it hadn't been buried by the ash, the frescoes wouldn't be so beautiful today." }
      - { speaker: Nunzia, es: "È vero. Ed è incredibile pensare che tanti abitanti non si fossero accorti del pericolo.", en: "That's true. And it's incredible to think that so many inhabitants hadn't noticed the danger." }
      - { speaker: Ciro, es: "Alcuni se ne sono accorti, ma troppo tardi. Se fossero scappati subito, si sarebbero salvati.", en: "Some did notice, but too late. If they'd fled straight away, they would have saved themselves." }
      - { speaker: Nunzia, es: "Che storia triste. Comunque, la prossima volta controlla il telefono!", en: "What a sad story. Anyway, next time check your phone!" }
      - { speaker: Ciro, es: "Promesso. Se avessi un po' più di memoria, sarei il turista perfetto.", en: "I promise. If I had a slightly better memory, I'd be the perfect tourist." }
    questions:
      - { q: "Perché Nunzia e Ciro hanno perso la visita guidata?", options: ["Perché la guida era malata.", "Perché Ciro non aveva letto il messaggio della guida.", "Perché i biglietti non erano validi."], answer: 1, explain: "Se avessi letto il messaggio della guida, avresti saputo che era alle dieci." }
      - { q: "Che cosa ha conservato gli affreschi, secondo Ciro?", options: ["La cenere.", "La pioggia.", "Un tetto moderno."], answer: 0, explain: "Se non fosse stata sepolta dalla cenere, gli affreschi non sarebbero così belli: the ash preserved them." }
      - { q: "Che cosa decidono di fare?", options: ["Tornare a Napoli.", "Comprare altri biglietti.", "Visitare gli scavi da soli."], answer: 2, explain: "The tickets are valid all day: ce la caviamo da soli." }
      - { q: "Come si descrive Ciro?", options: ["Sbadato.", "Ambizioso.", "Riservato."], answer: 0, explain: "Hai ragione, sono proprio sbadato." }
