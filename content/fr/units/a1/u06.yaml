id: a1.u06
title: "Les cloches de Notre-Dame"
lessons:
  - id: a1.u06.l1
    title: "Quelle heure est-il ?"
    teach: [g.time-telling]
    tip: "Always say heure(s): il est trois heures. The 24-hour clock is common in France, even in speech: à vingt heures."
    vocab: [w.heure, w.minute, w.demi, w.quart, w.midi, w.minuit, w.matin, w.après-midi, w.soir, w.nuit, w.cloche, w.sonner, w.tôt, w.tard, w.maintenant, w.vite, w.arriver, w.commencer, w.ouvert, w.fermé, w.ouvrir, w.fermer]
    sentences:
      - { es: "Quelle heure est-il ? — Il est huit heures.", en: "What time is it? — It's eight o'clock.", altEs: ["Il est quelle heure ? — Il est huit heures."], grammar: [g.time-telling], vocab: [w.heure] }
      - { es: "Il est neuf heures et quart.", en: "It's quarter past nine.", altEs: ["Il est neuf heures quinze."], altEn: ["It's a quarter past nine.", "It's nine fifteen."], grammar: [g.time-telling], vocab: [w.quart] }
      - { es: "Il est dix heures et demie.", en: "It's half past ten.", altEs: ["Il est dix heures trente."], altEn: ["It's ten thirty."], grammar: [g.time-telling], vocab: [w.demi], error: { wrong: "Il est dix heures et demi.", explain: "After heures (feminine), write demie: dix heures et demie.", grammar: g.time-telling } }
      - { es: "Il est midi : les cloches de Notre-Dame sonnent.", en: "It's noon: the bells of Notre-Dame are ringing.", altEs: ["Il est midi, les cloches de Notre-Dame sonnent."], grammar: [g.time-telling, g.present-er], vocab: [w.midi, w.cloche, w.sonner] }
      - { es: "Il est minuit moins le quart.", en: "It's quarter to midnight.", altEs: ["Il est vingt-trois heures quarante-cinq."], altEn: ["It's a quarter to midnight."], grammar: [g.time-telling], vocab: [w.minuit, w.quart] }
      - { es: "Le cours commence à neuf heures du matin.", en: "The class starts at nine in the morning.", altEs: ["Le cours commence à neuf heures."], grammar: [g.time-telling, g.present-er], vocab: [w.commencer, w.matin, w.cours] }
      - { es: "J'arrive à cinq heures de l'après-midi.", en: "I'm arriving at five in the afternoon.", altEs: ["J'arrive à dix-sept heures."], altEn: ["I arrive at five in the afternoon."], grammar: [g.time-telling, g.present-er], vocab: [w.arriver, w.après-midi], transform: { instruction: "Use the 24-hour clock", answer: "J'arrive à dix-sept heures.", en: "I'm arriving at 17:00." } }
      - { es: "Le musée ouvre à dix heures et ferme à six heures du soir.", en: "The museum opens at ten and closes at six in the evening.", grammar: [g.time-telling, g.present-er], vocab: [w.ouvrir, w.fermer, w.soir], transform: { instruction: "Use the 24-hour clock for the closing time", answer: "Le musée ouvre à dix heures et ferme à dix-huit heures.", en: "The museum opens at 10:00 and closes at 18:00." } }
      - { es: "La boulangerie est fermée le lundi.", en: "The bakery is closed on Mondays.", grammar: [g.days-months-dates, g.adjective-agreement], vocab: [w.fermé] }
      - { es: "C'est ouvert maintenant ?", en: "Is it open now?", altEs: ["Est-ce que c'est ouvert maintenant ?", "C'est ouvert, maintenant ?"], grammar: [g.yes-no-questions], vocab: [w.ouvert, w.maintenant] }
      - { es: "Il est tard : il est onze heures du soir.", en: "It's late: it's eleven at night.", altEs: ["Il est tard, il est vingt-trois heures."], altEn: ["It's late: it's eleven in the evening."], grammar: [g.time-telling], vocab: [w.tard, w.soir] }
      - { es: "Il est tôt : il est six heures du matin.", en: "It's early: it's six in the morning.", altEs: ["Il est tôt, il est six heures du matin."], grammar: [g.time-telling], vocab: [w.tôt, w.matin] }
      - { es: "Vite, le train part dans cinq minutes !", en: "Quick, the train leaves in five minutes!", altEs: ["Vite ! Le train part dans cinq minutes !"], altEn: ["Hurry, the train leaves in five minutes!"], grammar: [g.present-ir-verbs], vocab: [w.vite, w.minute, w.train] }
      - { es: "À quelle heure tu arrives ? — Vers midi.", en: "What time are you arriving? — Around noon.", altEs: ["Tu arrives à quelle heure ? — Vers midi.", "À quelle heure est-ce que tu arrives ? — Vers midi."], grammar: [g.time-telling, g.question-words], vocab: [w.arriver, w.midi] }
      - { es: "La nuit, Notre-Dame est très belle.", en: "At night, Notre-Dame is very beautiful.", grammar: [g.time-telling], vocab: [w.nuit] }
    exchanges:
      - q: { es: "Pardon, madame, quelle heure est-il ?", en: "Excuse me, madam, what time is it?" }
        a: { es: "Il est trois heures et demie.", en: "It's half past three." }
        alt: ["Trois heures et demie.", "Il est quinze heures trente."]
        grammar: [g.time-telling]
        vocab: [w.heure, w.demi]
      - q: { es: "Le musée ouvre à quelle heure ?", en: "What time does the museum open?" }
        a: { es: "À neuf heures, mais il est fermé le mardi.", en: "At nine, but it's closed on Tuesdays." }
        alt: ["À neuf heures.", "Vers neuf heures."]
        grammar: [g.time-telling]
        vocab: [w.ouvrir, w.fermé]
      - q: { es: "Tu arrives quand ?", en: "When are you arriving?" }
        a: { es: "J'arrive à sept heures du soir.", en: "I'm arriving at seven in the evening." }
        alt: ["À dix-neuf heures.", "Ce soir, à sept heures."]
        grammar: [g.time-telling, g.question-words]
        vocab: [w.arriver, w.soir]
      - q: { es: "C'est ouvert maintenant ?", en: "Is it open now?" }
        a: { es: "Non, c'est fermé. Ça ouvre à deux heures.", en: "No, it's closed. It opens at two." }
        alt: ["Oui, c'est ouvert.", "Non, c'est fermé."]
        grammar: [g.time-telling]
        vocab: [w.ouvert, w.fermé, w.maintenant]
      - q: { es: "Le film commence à quelle heure ?", en: "What time does the film start?" }
        a: { es: "À vingt heures quinze.", en: "At 8.15 pm." }
        alt: ["À huit heures et quart.", "Vers vingt heures."]
        grammar: [g.time-telling]
        vocab: [w.commencer, w.heure]
    texts:
      - title: "Les cloches de Notre-Dame"
        es: ["Il est midi sur l'île de la Cité.", "Les cloches de Notre-Dame sonnent.", "Devant la cathédrale, les touristes écoutent."]
        en: ["It's noon on the Île de la Cité.", "The bells of Notre-Dame are ringing.", "In front of the cathedral, the tourists listen."]
        grammar: [g.time-telling, g.present-er]
        vocab: [w.midi, w.cloche, w.sonner]
      - title: "Horaires du café"
        es: ["Le café ouvre à sept heures du matin.", "Il ferme à minuit.", "Le dimanche, il est fermé."]
        en: ["The café opens at seven in the morning.", "It closes at midnight.", "On Sundays, it's closed."]
        grammar: [g.time-telling]
        vocab: [w.ouvrir, w.fermer, w.minuit, w.fermé]
    spicy:
      - { es: "Il est minuit. Tu rentres ou tu restes pour un dernier verre ?", en: "It's midnight. Are you going home or staying for one last drink?", grammar: [g.time-telling], vocab: [w.minuit] }
      - { es: "Quelle heure est-il ? L'heure d'un café avec toi.", en: "What time is it? Time for a coffee with you.", grammar: [g.time-telling], vocab: [w.heure] }
      - { es: "Les cloches sonnent… ah non, pardon, c'est mon cœur.", en: "The bells are ringing… oh no, sorry, that's my heart.", grammar: [g.present-er], vocab: [w.cloche, w.sonner] }
      - { es: "Tu arrives à huit heures ? Moi, j'arrive à huit heures moins cinq.", en: "You're arriving at eight? I'll be there at five to eight.", grammar: [g.time-telling], vocab: [w.arriver] }
      - { es: "Il est tard, mais avec toi, il est toujours tôt.", en: "It's late, but with you it's always early.", grammar: [g.time-telling], vocab: [w.tard, w.tôt] }
  - id: a1.u06.l2
    title: "Je me lève à sept heures"
    teach: [g.reflexive-intro]
    tip: "Routine verbs take a pronoun that matches the subject: je me lève, tu te lèves, il se lève, nous nous levons. Ne goes before the pronoun."
    vocab: [w.se-lever, w.se-réveiller, w.se-coucher, w.s-habiller, w.se-doucher, w.se-laver, w.se-reposer, w.douche, w.d-abord, w.ensuite, w.après, w.avant, w.rentrer, w.travail, w.métro, w.train, w.par]
    sentences:
      - { es: "Je me lève à sept heures.", en: "I get up at seven.", altEs: ["Moi, je me lève à sept heures."], altEn: ["I get up at seven o'clock."], grammar: [g.reflexive-intro, g.time-telling], vocab: [w.se-lever], error: { wrong: "Je lève à sept heures.", explain: "se lever needs its pronoun: je me lève.", grammar: g.reflexive-intro } }
      - { es: "Tu te réveilles tôt ?", en: "Do you wake up early?", altEs: ["Est-ce que tu te réveilles tôt ?"], grammar: [g.reflexive-intro], vocab: [w.se-réveiller, w.tôt] }
      - { es: "D'abord, je me douche, ensuite je m'habille.", en: "First I have a shower, then I get dressed.", altEs: ["D'abord je me douche, ensuite je m'habille.", "D'abord, je me douche, et ensuite je m'habille."], grammar: [g.reflexive-intro], vocab: [w.d-abord, w.se-doucher, w.ensuite, w.s-habiller], transform: { instruction: "Change to 'she'", answer: "D'abord, elle se douche, ensuite elle s'habille.", alt: ["D'abord elle se douche, ensuite elle s'habille."], en: "First she has a shower, then she gets dressed." } }
      - { es: "Il se couche à minuit.", en: "He goes to bed at midnight.", grammar: [g.reflexive-intro, g.time-telling], vocab: [w.se-coucher], transform: { instruction: "Change to 'we'", answer: "Nous nous couchons à minuit.", alt: ["On se couche à minuit."], en: "We go to bed at midnight." } }
      - { es: "Nous ne nous levons pas tôt le dimanche.", en: "We don't get up early on Sundays.", altEs: ["On ne se lève pas tôt le dimanche.", "On se lève pas tôt le dimanche."], grammar: [g.reflexive-intro, g.negation-ne-pas], vocab: [w.se-lever] }
      - { es: "Vous vous reposez après le travail ?", en: "Do you rest after work?", altEs: ["Est-ce que vous vous reposez après le travail ?"], grammar: [g.reflexive-intro], vocab: [w.se-reposer, w.après, w.travail] }
      - { es: "Je prends le métro à huit heures et quart.", en: "I take the metro at a quarter past eight.", altEs: ["Je prends le métro à huit heures quinze."], grammar: [g.time-telling], vocab: [w.métro] }
      - { es: "Avant le dîner, les enfants se lavent.", en: "Before dinner, the children wash.", altEn: ["Before dinner, the children have a wash."], grammar: [g.reflexive-intro], vocab: [w.se-laver, w.avant] }
      - { es: "Le matin, je prends une douche froide.", en: "In the morning, I take a cold shower.", altEn: ["In the morning I have a cold shower."], grammar: [g.time-telling], vocab: [w.douche] }
      - { es: "Après le travail, je rentre à la maison.", en: "After work, I go home.", altEs: ["Je rentre à la maison après le travail."], grammar: [g.present-er], vocab: [w.rentrer, w.après, w.travail] }
      - { es: "Ils prennent le train de sept heures.", en: "They take the seven o'clock train.", grammar: [g.time-telling], vocab: [w.train] }
      - { es: "Je travaille huit heures par jour.", en: "I work eight hours a day.", grammar: [g.present-er], vocab: [w.par] }
      - { es: "Métro, boulot, dodo : c'est la vie à Paris !", en: "Metro, work, sleep: that's life in Paris!", grammar: [g.c-est-il-est], vocab: [w.métro], note: "A famous Parisian expression for a dull daily routine: boulot (work) and dodo (sleep) are familiar words." }
      - { es: "Tu t'habilles vite le matin ?", en: "Do you get dressed quickly in the morning?", altEs: ["Est-ce que tu t'habilles vite le matin ?"], grammar: [g.reflexive-intro], vocab: [w.s-habiller] }
    exchanges:
      - q: { es: "Tu te lèves à quelle heure ?", en: "What time do you get up?" }
        a: { es: "Je me lève à sept heures et demie.", en: "I get up at half past seven." }
        alt: ["À sept heures.", "Vers sept heures."]
        grammar: [g.reflexive-intro, g.time-telling]
        vocab: [w.se-lever]
      - q: { es: "Tu te couches tard ?", en: "Do you go to bed late?" }
        a: { es: "Oui, je me couche vers minuit.", en: "Yes, I go to bed around midnight." }
        alt: ["Non, je me couche tôt.", "Oui, très tard."]
        grammar: [g.reflexive-intro]
        vocab: [w.se-coucher]
      - q: { es: "Qu'est-ce que tu fais le matin ?", en: "What do you do in the morning?" }
        a: { es: "D'abord je me douche, ensuite je prends un café.", en: "First I have a shower, then I have a coffee." }
        alt: ["Je me lève et je m'habille.", "Je prends le métro."]
        grammar: [g.reflexive-intro]
        vocab: [w.d-abord, w.ensuite, w.se-doucher]
      - q: { es: "Vous rentrez à quelle heure ?", en: "What time do you get home?" }
        a: { es: "Je rentre à six heures du soir.", en: "I get home at six in the evening." }
        alt: ["À dix-huit heures.", "Vers six heures."]
        grammar: [g.time-telling]
        vocab: [w.rentrer]
      - q: { es: "Tu prends le métro ?", en: "Do you take the metro?" }
        a: { es: "Non, je prends le train, puis le bus.", en: "No, I take the train, then the bus." }
        alt: ["Oui, tous les jours.", "Non, je vais à pied."]
        grammar: [g.present-er]
        vocab: [w.métro, w.train]
    texts:
      - title: "Ma journée"
        es: ["Je me réveille à six heures et demie.", "D'abord je me douche, ensuite je m'habille.", "À sept heures et quart, je prends le métro."]
        en: ["I wake up at half past six.", "First I have a shower, then I get dressed.", "At a quarter past seven, I take the metro."]
        grammar: [g.reflexive-intro, g.time-telling]
        vocab: [w.se-réveiller, w.se-doucher, w.s-habiller, w.métro]
      - title: "Métro, boulot, dodo"
        es: ["Le matin, Paul prend le métro.", "Il travaille de neuf heures à dix-huit heures.", "Le soir, il rentre, il dîne et il se couche."]
        en: ["In the morning, Paul takes the metro.", "He works from nine to six.", "In the evening, he goes home, has dinner and goes to bed."]
        grammar: [g.reflexive-intro, g.time-telling]
        vocab: [w.métro, w.rentrer, w.se-coucher]
    spicy:
      - { es: "Je prends le métro de huit heures… parce que tu es dans le métro de huit heures.", en: "I take the eight o'clock metro… because you're on the eight o'clock metro.", grammar: [g.time-telling], vocab: [w.métro] }
      - { es: "Tu te couches tard ? Moi aussi. On parle au téléphone ?", en: "Do you go to bed late? Me too. Shall we talk on the phone?", grammar: [g.reflexive-intro, g.moi-aussi-non-plus], vocab: [w.se-coucher] }
      - { es: "Après le travail, je me repose… avec toi ?", en: "After work, I rest… with you?", grammar: [g.reflexive-intro], vocab: [w.après, w.se-reposer] }
      - { es: "D'abord un café, ensuite un dîner, et après… on regarde un film.", en: "First a coffee, then dinner, and afterwards… we watch a film.", grammar: [g.present-er], vocab: [w.d-abord, w.ensuite, w.après] }
      - { es: "Je m'habille en bleu, parce que tu aimes le bleu.", en: "I'm dressing in blue, because you like blue.", grammar: [g.reflexive-intro], vocab: [w.s-habiller] }
  - id: a1.u06.l3
    title: "Lundi, mardi… le quatorze juillet"
    teach: [g.days-months-dates]
    tip: "Days and months take no capital letter. Lundi = on (this) Monday, le lundi = on Mondays. Only the 1st is ordinal: le premier mai, but le deux mai."
    vocab: [w.année, w.mois, w.week-end, w.aujourd-hui, w.demain, w.mardi, w.mercredi, w.jeudi, w.vendredi, w.samedi, w.dimanche, w.janvier, w.février, w.mars, w.avril, w.mai, w.juin, w.juillet, w.août, w.septembre, w.octobre, w.novembre, w.décembre, w.premier, w.date, w.anniversaire, w.fête, w.été]
    sentences:
      - { es: "Lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche.", en: "Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday.", grammar: [g.days-months-dates], vocab: [w.lundi, w.mardi, w.mercredi, w.jeudi, w.vendredi, w.samedi, w.dimanche], kinds: [dictation, listen, typeEs, order] }
      - { es: "Janvier, février, mars, avril, mai, juin.", en: "January, February, March, April, May, June.", grammar: [g.days-months-dates], vocab: [w.janvier, w.février, w.mars, w.avril, w.mai, w.juin], kinds: [dictation, listen, typeEs, order] }
      - { es: "Juillet, août, septembre, octobre, novembre, décembre.", en: "July, August, September, October, November, December.", grammar: [g.days-months-dates], vocab: [w.juillet, w.août, w.septembre, w.octobre, w.novembre, w.décembre], kinds: [dictation, listen, typeEs, order] }
      - { es: "Aujourd'hui, c'est mercredi.", en: "Today is Wednesday.", altEs: ["On est mercredi aujourd'hui.", "Aujourd'hui, on est mercredi."], altEn: ["It's Wednesday today."], grammar: [g.days-months-dates], vocab: [w.aujourd-hui, w.mercredi] }
      - { es: "Demain, c'est vendredi !", en: "Tomorrow is Friday!", altEs: ["Demain, on est vendredi !"], altEn: ["It's Friday tomorrow!"], grammar: [g.days-months-dates], vocab: [w.demain, w.vendredi] }
      - { es: "La fête nationale, c'est le quatorze juillet.", en: "Bastille Day is on the fourteenth of July.", altEs: ["La fête nationale est le quatorze juillet."], altEn: ["The national holiday is on 14 July."], grammar: [g.days-months-dates], vocab: [w.fête, w.juillet] }
      - { es: "Mon anniversaire, c'est le premier mai.", en: "My birthday is on the first of May.", altEs: ["Mon anniversaire est le premier mai."], altEn: ["My birthday is on 1 May."], grammar: [g.days-months-dates], vocab: [w.anniversaire, w.premier, w.mai], error: { wrong: "Mon anniversaire, c'est le un mai.", explain: "Only the first of the month is ordinal: le premier mai.", grammar: g.days-months-dates } }
      - { es: "On est le combien aujourd'hui ? — On est le trois mars.", en: "What's the date today? — It's the third of March.", altEs: ["Quelle est la date aujourd'hui ? — On est le trois mars.", "Quelle est la date aujourd'hui ? — C'est le trois mars."], grammar: [g.days-months-dates], vocab: [w.date, w.mars] }
      - { es: "Je ne travaille pas le samedi.", en: "I don't work on Saturdays.", altEs: ["Je travaille pas le samedi."], grammar: [g.days-months-dates, g.negation-ne-pas], vocab: [w.samedi], transform: { instruction: "Talk about this Saturday only (no article)", answer: "Je ne travaille pas samedi.", alt: ["Je travaille pas samedi."], en: "I'm not working on Saturday." } }
      - { es: "En août, beaucoup de Parisiens partent en vacances.", en: "In August, lots of Parisians go on holiday.", altEn: ["In August, many Parisians go on vacation."], grammar: [g.days-months-dates, g.present-ir-verbs], vocab: [w.août] }
      - { es: "Le week-end, je me repose.", en: "At the weekend, I rest.", altEs: ["Le week-end, je me repose à la maison."], altEn: ["On weekends, I rest."], grammar: [g.days-months-dates, g.reflexive-intro], vocab: [w.week-end], variant: "In Québec: la fin de semaine." }
      - { es: "Il y a douze mois dans une année.", en: "There are twelve months in a year.", grammar: [g.il-y-a, g.days-months-dates], vocab: [w.mois, w.année] }
      - { es: "En été, il fait très chaud à Paris.", en: "In summer it's very hot in Paris.", altEs: ["L'été, il fait très chaud à Paris."], grammar: [g.days-months-dates], vocab: [w.été] }
      - { es: "Notre-Dame rouvre en décembre deux mille vingt-quatre.", en: "Notre-Dame reopens in December 2024.", grammar: [g.days-months-dates], vocab: [w.décembre] }
      - { es: "Le dimanche, je déjeune chez mes parents.", en: "On Sundays, I have lunch at my parents' place.", grammar: [g.days-months-dates, g.present-er], vocab: [w.dimanche], transform: { instruction: "Change to 'we'", answer: "Le dimanche, nous déjeunons chez nos parents.", alt: ["Le dimanche, on déjeune chez nos parents."], en: "On Sundays, we have lunch at our parents' place." } }
      - { es: "C'est quand, la fête de la musique ? — Le vingt et un juin.", en: "When is the Fête de la Musique? — On the twenty-first of June.", altEs: ["La fête de la musique, c'est quand ? — Le vingt et un juin."], grammar: [g.days-months-dates, g.question-words], vocab: [w.juin, w.fête] }
    exchanges:
      - q: { es: "On est quel jour aujourd'hui ?", en: "What day is it today?" }
        a: { es: "Aujourd'hui, c'est jeudi.", en: "Today is Thursday." }
        alt: ["On est jeudi.", "Jeudi."]
        grammar: [g.days-months-dates]
        vocab: [w.aujourd-hui, w.jeudi]
      - q: { es: "Quelle est la date de ton anniversaire ?", en: "What's the date of your birthday?" }
        a: { es: "C'est le dix-sept octobre.", en: "It's the seventeenth of October." }
        alt: ["Le dix-sept octobre.", "C'est le premier avril !"]
        grammar: [g.days-months-dates]
        vocab: [w.date, w.anniversaire, w.octobre]
      - q: { es: "On est le combien ?", en: "What's the date?" }
        a: { es: "On est le vingt-cinq septembre.", en: "It's the twenty-fifth of September." }
        alt: ["Le vingt-cinq septembre.", "C'est le vingt-cinq."]
        grammar: [g.days-months-dates]
        vocab: [w.septembre]
      - q: { es: "Tu travailles le week-end ?", en: "Do you work at weekends?" }
        a: { es: "Non, le samedi et le dimanche, je me repose.", en: "No, on Saturdays and Sundays I rest." }
        alt: ["Oui, le samedi.", "Non, jamais le week-end."]
        grammar: [g.days-months-dates]
        vocab: [w.week-end, w.samedi, w.dimanche]
      - q: { es: "C'est quand, la fête nationale ?", en: "When is the national holiday?" }
        a: { es: "C'est le quatorze juillet.", en: "It's on the fourteenth of July." }
        alt: ["Le quatorze juillet."]
        grammar: [g.days-months-dates]
        vocab: [w.fête, w.juillet]
    texts:
      - title: "Le quatorze juillet"
        es: ["Le quatorze juillet, c'est la fête nationale.", "Le matin, il y a un défilé sur les Champs-Élysées.", "Le soir, il y a un feu d'artifice à la tour Eiffel."]
        en: ["The fourteenth of July is the national holiday.", "In the morning there's a parade on the Champs-Élysées.", "In the evening there's a firework display at the Eiffel Tower."]
        grammar: [g.days-months-dates]
        vocab: [w.juillet, w.fête]
      - title: "Mon agenda"
        es: ["Lundi : cours de français à neuf heures.", "Mercredi : dîner chez Léa.", "Samedi : anniversaire de Hugo !"]
        en: ["Monday: French class at nine.", "Wednesday: dinner at Léa's.", "Saturday: Hugo's birthday!"]
        grammar: [g.days-months-dates]
        vocab: [w.mercredi, w.samedi, w.anniversaire]
    spicy:
      - { es: "Tu es libre samedi soir ? Et dimanche ? Et lundi ?", en: "Are you free on Saturday evening? And Sunday? And Monday?", grammar: [g.days-months-dates], vocab: [w.samedi, w.dimanche] }
      - { es: "Lundi, mardi, mercredi… je pense à toi tous les jours de la semaine.", en: "Monday, Tuesday, Wednesday… I think of you every day of the week.", grammar: [g.days-months-dates], vocab: [w.mardi, w.mercredi] }
      - { es: "Mon anniversaire, c'est le dix mai. Mon cadeau, c'est un dîner avec toi.", en: "My birthday is on the tenth of May. My present is dinner with you.", grammar: [g.days-months-dates], vocab: [w.anniversaire, w.mai] }
      - { es: "En été, à Paris, on dîne tard et on danse sur les quais.", en: "In summer in Paris, we have dinner late and dance on the riverbanks.", grammar: [g.days-months-dates, g.on-nous], vocab: [w.été] }
      - { es: "Le quatorze juillet, il y a un feu d'artifice dans le ciel… et dans mes yeux quand je te vois.", en: "On the fourteenth of July there are fireworks in the sky… and in my eyes when I see you.", grammar: [g.days-months-dates], vocab: [w.juillet] }
  - id: a1.u06.l4
    title: "Souvent, parfois, jamais"
    teach: [g.frequency-adverbs, g.present-ir-verbs]
    tip: "Short adverbs go after the verb: je prends toujours le métro. Finir verbs add -iss- in the plural (nous finissons); dormir, partir, sortir lose a consonant in the singular (je dors, je pars, je sors)."
    vocab: [w.toujours, w.souvent, w.parfois, w.quelquefois, w.rarement, w.jamais, w.d-habitude, w.tous-les-jours, w.fois, w.chaque, w.jour, w.semaine, w.finir, w.choisir, w.réussir, w.réfléchir, w.partir, w.sortir, w.dormir, w.cours, w.université, w.réviser, w.étape]
    sentences:
      - { es: "Je prends toujours le métro.", en: "I always take the metro.", grammar: [g.frequency-adverbs], vocab: [w.toujours, w.métro], error: { wrong: "Je toujours prends le métro.", explain: "Short adverbs go after the verb: je prends toujours.", grammar: g.frequency-adverbs } }
      - { es: "Elle va souvent au cinéma.", en: "She often goes to the cinema.", altEn: ["She often goes to the movies."], grammar: [g.frequency-adverbs], vocab: [w.souvent] }
      - { es: "Parfois, je dors l'après-midi.", en: "Sometimes I sleep in the afternoon.", altEs: ["Je dors parfois l'après-midi.", "Quelquefois, je dors l'après-midi."], grammar: [g.frequency-adverbs, g.present-ir-verbs], vocab: [w.parfois, w.dormir] }
      - { es: "Je ne bois jamais de café le soir.", en: "I never drink coffee in the evening.", altEs: ["Je bois jamais de café le soir."], grammar: [g.frequency-adverbs, g.de-after-negation], vocab: [w.jamais], transform: { instruction: "Say you often drink it", answer: "Je bois souvent du café le soir.", en: "I often drink coffee in the evening." } }
      - { es: "D'habitude, je finis le travail à six heures.", en: "Usually, I finish work at six.", altEs: ["Je finis le travail à six heures, d'habitude.", "En général, je finis le travail à six heures."], grammar: [g.frequency-adverbs, g.present-ir-verbs], vocab: [w.d-habitude, w.finir] }
      - { es: "Nous finissons les cours à cinq heures.", en: "We finish classes at five.", altEs: ["On finit les cours à cinq heures."], grammar: [g.present-ir-verbs], vocab: [w.finir, w.cours], error: { wrong: "Nous finons les cours à cinq heures.", explain: "finir adds -iss- in the plural: nous finissons.", grammar: g.present-ir-verbs } }
      - { es: "Tu choisis quel dessert ?", en: "Which dessert are you choosing?", altEs: ["Quel dessert tu choisis ?", "Quel dessert est-ce que tu choisis ?"], grammar: [g.present-ir-verbs, g.question-words], vocab: [w.choisir] }
      - { es: "Ils partent à huit heures tous les jours.", en: "They leave at eight every day.", altEs: ["Tous les jours, ils partent à huit heures."], grammar: [g.present-ir-verbs, g.frequency-adverbs], vocab: [w.partir, w.tous-les-jours], transform: { instruction: "Change to 'I'", answer: "Je pars à huit heures tous les jours.", alt: ["Tous les jours, je pars à huit heures."], en: "I leave at eight every day." } }
      - { es: "Je sors avec mes amis le vendredi soir.", en: "I go out with my friends on Friday evenings.", altEs: ["Le vendredi soir, je sors avec mes amis."], grammar: [g.present-ir-verbs, g.days-months-dates], vocab: [w.sortir] }
      - { es: "Elle réussit toujours ses examens.", en: "She always passes her exams.", grammar: [g.present-ir-verbs, g.frequency-adverbs], vocab: [w.réussir, w.toujours] }
      - { es: "Je réfléchis… Je prends une crêpe !", en: "Let me think… I'll have a crêpe!", altEn: ["I'm thinking… I'll have a crêpe!"], grammar: [g.present-ir-verbs], vocab: [w.réfléchir] }
      - { es: "Je révise deux fois par semaine.", en: "I revise twice a week.", altEs: ["Je révise deux fois par semaine, le mardi et le jeudi."], altEn: ["I study twice a week."], grammar: [g.frequency-adverbs], vocab: [w.réviser, w.fois, w.semaine] }
      - { es: "Il va rarement à l'université le vendredi.", en: "He rarely goes to the university on Fridays.", altEn: ["He seldom goes to university on Fridays."], grammar: [g.frequency-adverbs], vocab: [w.rarement, w.université] }
      - { es: "Chaque jour, c'est une nouvelle étape.", en: "Every day is a new step.", grammar: [g.frequency-adverbs], vocab: [w.chaque, w.jour, w.étape] }
      - { es: "Vous dormez combien d'heures par nuit ?", en: "How many hours do you sleep a night?", altEs: ["Combien d'heures est-ce que vous dormez par nuit ?", "Tu dors combien d'heures par nuit ?"], grammar: [g.present-ir-verbs, g.question-words], vocab: [w.dormir, w.par] }
    exchanges:
      - q: { es: "Tu vas souvent au cinéma ?", en: "Do you often go to the cinema?" }
        a: { es: "Oui, une fois par semaine.", en: "Yes, once a week." }
        alt: ["Non, rarement.", "Parfois, le dimanche."]
        grammar: [g.frequency-adverbs]
        vocab: [w.souvent, w.fois, w.semaine]
      - q: { es: "Tu bois du café le soir ?", en: "Do you drink coffee in the evening?" }
        a: { es: "Non, jamais ! Après, je dors mal.", en: "No, never! Afterwards I sleep badly." }
        alt: ["Oui, toujours.", "Quelquefois."]
        grammar: [g.frequency-adverbs, g.present-ir-verbs]
        vocab: [w.jamais, w.quelquefois, w.dormir]
      - q: { es: "Tu finis à quelle heure aujourd'hui ?", en: "What time do you finish today?" }
        a: { es: "Je finis à cinq heures et demie.", en: "I finish at half past five." }
        alt: ["À dix-sept heures trente.", "Vers cinq heures."]
        grammar: [g.present-ir-verbs, g.time-telling]
        vocab: [w.finir]
      - q: { es: "Vous sortez ce soir ?", en: "Are you going out tonight?" }
        a: { es: "Oui, on sort avec des amis à Saint-Germain.", en: "Yes, we're going out with friends in Saint-Germain." }
        alt: ["Non, on reste à la maison.", "Oui, vers neuf heures."]
        grammar: [g.present-ir-verbs, g.on-nous]
        vocab: [w.sortir]
      - q: { es: "Qu'est-ce que tu choisis ?", en: "What are you choosing?" }
        a: { es: "Je réfléchis… Je choisis la crêpe au chocolat.", en: "Let me think… I'll go for the chocolate crêpe." }
        alt: ["La crêpe au chocolat.", "Je choisis une glace."]
        grammar: [g.present-ir-verbs]
        vocab: [w.choisir, w.réfléchir]
    texts:
      - title: "La semaine d'Emma"
        es: ["Emma a cours tous les jours à l'université.", "Le mercredi, elle finit à midi.", "Le vendredi soir, elle sort souvent avec Hugo et Léa."]
        en: ["Emma has classes every day at the university.", "On Wednesdays, she finishes at noon.", "On Friday evenings, she often goes out with Hugo and Léa."]
        grammar: [g.frequency-adverbs, g.present-ir-verbs]
        vocab: [w.cours, w.université, w.finir, w.sortir, w.souvent]
      - title: "Conseils pour les examens"
        es: ["Dormez huit heures par nuit.", "Révisez un peu chaque jour.", "Et ne buvez jamais de café après six heures !"]
        en: ["Sleep eight hours a night.", "Revise a little every day.", "And never drink coffee after six o'clock!"]
        grammar: [g.frequency-adverbs, g.present-ir-verbs]
        vocab: [w.dormir, w.réviser, w.chaque, w.jamais]
    spicy:
      - { es: "Je sors rarement, mais avec toi, je sors ce soir.", en: "I rarely go out, but with you, I'm going out tonight.", grammar: [g.present-ir-verbs, g.frequency-adverbs], vocab: [w.sortir, w.rarement] }
      - { es: "Tu choisis : un café avec moi ou un dîner avec moi ?", en: "You choose: a coffee with me or dinner with me?", grammar: [g.present-ir-verbs], vocab: [w.choisir] }
      - { es: "Je ne dors jamais bien quand je pense à toi.", en: "I never sleep well when I'm thinking of you.", grammar: [g.frequency-adverbs, g.present-ir-verbs], vocab: [w.dormir, w.jamais] }
      - { es: "D'habitude, je réfléchis beaucoup. Avec toi, je ne réfléchis pas.", en: "Usually I think a lot. With you, I don't think.", grammar: [g.frequency-adverbs, g.present-ir-verbs], vocab: [w.d-habitude, w.réfléchir] }
      - { es: "Tu pars déjà ? Il est tôt : il est seulement minuit !", en: "You're leaving already? It's early: it's only midnight!", grammar: [g.present-ir-verbs], vocab: [w.partir] }
dialogues:
  - id: a1.u06.d1
    title: "Midi devant Notre-Dame"
    context: "Léa and Hugo meet in front of Notre-Dame as the bells ring."
    lines:
      - { speaker: Léa, es: "Écoute, les cloches de Notre-Dame ! Il est quelle heure ?", en: "Listen, the bells of Notre-Dame! What time is it?" }
      - { speaker: Hugo, es: "Il est midi. J'ai faim !", en: "It's noon. I'm hungry!" }
      - { speaker: Léa, es: "Tu manges toujours à midi ?", en: "Do you always eat at noon?" }
      - { speaker: Hugo, es: "Oui, toujours. Je me lève à six heures, alors à midi, j'ai très faim.", en: "Yes, always. I get up at six, so at noon I'm very hungry." }
      - { speaker: Léa, es: "Six heures ! Moi, je me réveille à huit heures et je me lève à huit heures et demie.", en: "Six o'clock! I wake up at eight and I get up at half past eight." }
      - { speaker: Hugo, es: "Tu as de la chance. Tu as cours aujourd'hui ?", en: "You're lucky. Do you have classes today?" }
      - { speaker: Léa, es: "Oui, à deux heures. Je finis à six heures, et après, je sors avec Emma.", en: "Yes, at two. I finish at six, and afterwards I'm going out with Emma." }
      - { speaker: Hugo, es: "Vous sortez souvent ?", en: "Do you go out often?" }
      - { speaker: Léa, es: "Le vendredi, oui. Et aujourd'hui, c'est vendredi !", en: "On Fridays, yes. And today is Friday!" }
      - { speaker: Hugo, es: "Ah, c'est vrai ! Bon, on mange une crêpe ?", en: "Oh, that's true! Right, shall we have a crêpe?" }
    questions:
      - { q: "Quelle heure est-il ?", options: ["huit heures et demie", "midi", "deux heures"], answer: 1, explain: "« Il est midi. »" }
      - { q: "À quelle heure Hugo se lève ?", options: ["à six heures", "à huit heures", "à midi"], answer: 0, explain: "« Je me lève à six heures. »" }
      - { q: "Quand est-ce que Léa sort avec Emma ?", options: ["le lundi", "le mercredi", "le vendredi"], answer: 2, explain: "They go out on Fridays, and today is Friday." }
      - { q: "Léa finit son cours à…", options: ["deux heures", "six heures", "huit heures"], answer: 1, explain: "« Je finis à six heures, et après, je sors avec Emma. »" }
