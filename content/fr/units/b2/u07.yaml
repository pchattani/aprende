id: b2.u07
title: "Dijon, ancienne capitale des ducs"
lessons:
  - id: b2.u07.l1
    title: Les ducs, voulant rivaliser avec Paris
    teach: [g.participe-present]
    vocab: [w.chouette, w.chouette.adj, w.hibou, w.parcours, w.caresser, w.porter-bonheur, w.bonheur, w.malheur, w.superstition, w.superstitieux, w.désigner, w.rivaliser, w.puissance, w.puissant, w.duché, w.seigneur, w.noble, w.noblesse, w.prestigieux, w.impressionner, w.rechercher]
    tip: "The present participle is the nous stem + -ant (nous voulons → voulant) and never agrees. It replaces qui + verb or a 'because' clause, mostly in writing: les touristes venant de Paris, étant fatiguée…"
    sentences:
      - { es: "Les ducs de Bourgogne, voulant rivaliser avec le roi de France, ont fait de Dijon une capitale prestigieuse.", en: "The dukes of Burgundy, wanting to rival the King of France, made Dijon a prestigious capital.", altEs: ["Voulant rivaliser avec le roi de France, les ducs de Bourgogne ont fait de Dijon une capitale prestigieuse.", "Les ducs de Bourgogne, qui voulaient rivaliser avec le roi de France, ont fait de Dijon une capitale prestigieuse."], grammar: [g.participe-present], vocab: [w.duc, w.rivaliser, w.prestigieux] }
      - { es: "Ayant perdu notre plan, nous avons suivi les petites plaques de la chouette sur le trottoir.", en: "Having lost our map, we followed the little owl plaques on the pavement.", altEs: ["Ayant perdu notre plan, on a suivi les petites plaques de la chouette sur le trottoir.", "Comme nous avions perdu notre plan, nous avons suivi les petites plaques de la chouette sur le trottoir."], altEn: ["Having lost our map, we followed the little owl markers on the pavement."], grammar: [g.participe-present], vocab: [w.plan, w.chouette, w.plaque, w.trottoir] }
      - { es: "Le parcours de la chouette, comptant vingt-deux étapes, fait découvrir les principaux monuments de la ville.", en: "The owl trail, with twenty-two stops, takes you round the town's main monuments.", altEs: ["Le parcours de la chouette, qui compte vingt-deux étapes, fait découvrir les principaux monuments de la ville.", "Le parcours de la chouette, comptant 22 étapes, fait découvrir les principaux monuments de la ville."], grammar: [g.participe-present], vocab: [w.parcours, w.étape, w.monument] }
      - { es: "Les visiteurs souhaitant caresser la chouette doivent le faire de la main gauche.", en: "Visitors wishing to stroke the owl must do so with their left hand.", altEs: ["Les visiteurs qui souhaitent caresser la chouette doivent le faire de la main gauche.", "Les visiteurs désirant caresser la chouette doivent le faire de la main gauche."], grammar: [g.participe-present], vocab: [w.caresser, w.gauche] }
      - { es: "Étant superstitieuse, ma grand-mère caresse la chouette chaque fois qu'elle passe devant l'église Notre-Dame.", en: "Being superstitious, my grandmother strokes the owl every time she walks past Notre-Dame church.", altEs: ["Comme elle est superstitieuse, ma grand-mère caresse la chouette chaque fois qu'elle passe devant l'église Notre-Dame."], grammar: [g.participe-present], vocab: [w.superstitieux, w.caresser, w.église] }
      - { es: "Ne sachant pas où se trouvait la chouette, j'ai demandé mon chemin à un passant.", en: "Not knowing where the owl was, I asked a passer-by for directions.", altEs: ["Comme je ne savais pas où se trouvait la chouette, j'ai demandé mon chemin à un passant.", "Ne sachant pas où était la chouette, j'ai demandé mon chemin à un passant."], grammar: [g.participe-present], vocab: [w.passant, w.chemin] }
      - { es: "Le duché de Bourgogne, s'étendant jusqu'à la mer du Nord, rivalisait avec les plus grandes puissances d'Europe.", en: "The Duchy of Burgundy, stretching as far as the North Sea, rivalled the greatest powers in Europe.", altEs: ["Le duché de Bourgogne, qui s'étendait jusqu'à la mer du Nord, rivalisait avec les plus grandes puissances d'Europe."], grammar: [g.participe-present], vocab: [w.duché, w.rivaliser, w.puissance], note: "Through marriages and inheritance, the 15th-century Burgundian state included Flanders and much of the Low Countries." }
      - { es: "Philippe le Bon, étant l'un des seigneurs les plus puissants de son temps, attirait des artistes de toute l'Europe.", en: "Philip the Good, being one of the most powerful lords of his time, attracted artists from all over Europe.", altEs: ["Philippe le Bon, qui était l'un des seigneurs les plus puissants de son temps, attirait des artistes de toute l'Europe."], grammar: [g.participe-present, g.superlatives], vocab: [w.seigneur, w.puissant, w.artiste] }
      - { es: "Le mot « chouette », désignant un oiseau, veut aussi dire « sympa » quand on parle entre amis.", en: "The word 'chouette', which refers to a bird, also means 'nice' when you're talking among friends.", altEs: ["Le mot « chouette », qui désigne un oiseau, veut aussi dire « sympa » quand on parle entre amis."], grammar: [g.participe-present], vocab: [w.désigner, w.chouette.adj, w.oiseau] }
      - { es: "On reconnaît le hibou à ses petites oreilles de plumes, la chouette n'en ayant pas.", en: "You can tell a hibou by its little feather ears, since the chouette has none.", altEs: ["On reconnaît le hibou à ses petites oreilles de plumes, car la chouette n'en a pas."], grammar: [g.participe-present, g.pronoun-en], vocab: [w.hibou, w.plume, w.oreille], note: "Both words translate as 'owl'; the hibou has ear tufts, the chouette doesn't." }
      - { es: "Les nobles, voulant montrer leur puissance, faisaient construire de grands hôtels particuliers.", en: "The nobles, wanting to show off their power, had large town houses built.", altEs: ["Les nobles, qui voulaient montrer leur puissance, faisaient construire de grands hôtels particuliers."], grammar: [g.participe-present], vocab: [w.noble, w.puissance, w.construire], note: "Un hôtel particulier is a grand private town house, not a hotel." }
      - { es: "Les touristes qui viennent de Paris arrivent souvent en TGV.", en: "Tourists who come from Paris often arrive by TGV.", grammar: [g.participe-present, g.relative-qui-que], vocab: [w.touriste], transform: { instruction: "Replace qui + verb with a present participle", answer: "Les touristes venant de Paris arrivent souvent en TGV.", en: "Tourists coming from Paris often arrive by TGV." } }
      - { es: "Comme elle était fatiguée, elle a pris un taxi jusqu'au palais des ducs.", en: "As she was tired, she took a taxi to the Palace of the Dukes.", grammar: [g.participe-present], vocab: [w.fatigué, w.palais], transform: { instruction: "Express the cause with a present participle", answer: "Étant fatiguée, elle a pris un taxi jusqu'au palais des ducs.", en: "Being tired, she took a taxi to the Palace of the Dukes." } }
      - { es: "Il a visité le palais, puis il est parti pour Beaune.", en: "He visited the palace, then he left for Beaune.", grammar: [g.participe-present], vocab: [w.visiter, w.partir], transform: { instruction: "Start with the compound participle (having visited…)", answer: "Ayant visité le palais, il est parti pour Beaune.", alt: ["Après avoir visité le palais, il est parti pour Beaune."], en: "Having visited the palace, he left for Beaune." } }
      - { es: "Les guides parlant japonais sont tous réservés jusqu'à dimanche.", en: "The guides who speak Japanese are all booked until Sunday.", altEs: ["Les guides qui parlent japonais sont tous réservés jusqu'à dimanche."], grammar: [g.participe-present], vocab: [w.guide, w.réservé], error: { wrong: "Les guides parlants japonais sont tous réservés jusqu'à dimanche.", explain: "The present participle never agrees: parlant, not parlants.", grammar: g.participe-present } }
      - { es: "Étant arrivée en retard, Léa n'a pas pu monter dans la tour Philippe le Bon.", en: "Having arrived late, Léa couldn't go up the Philippe le Bon tower.", altEs: ["Comme elle était arrivée en retard, Léa n'a pas pu monter dans la tour Philippe le Bon."], grammar: [g.participe-present, g.passe-compose-etre], vocab: [w.en-retard, w.monter], error: { wrong: "Ayant arrivée en retard, Léa n'a pas pu monter dans la tour Philippe le Bon.", explain: "Arriver takes être, so its compound participle is étant arrivé(e), not ayant.", grammar: g.participe-present } }
    exchanges:
      - q: { es: "Comment on trouve la chouette ?", en: "How do you find the owl?" }
        a: { es: "Suivez les petites plaques portant une chouette, sur le trottoir.", en: "Follow the little plaques with an owl on them, on the pavement." }
        alt: ["Il suffit de suivre les plaques de la chouette sur le trottoir.", "Suivez les plaques qui portent une chouette."]
        grammar: [g.participe-present, g.imperative]
        vocab: [w.chouette, w.plaque]
      - q: { es: "Pourquoi tout le monde caresse cette chouette ?", en: "Why does everyone stroke this owl?" }
        a: { es: "Parce qu'elle porte bonheur, paraît-il ; ma tante, étant superstitieuse, la caresse à chaque fois.", en: "Because it brings luck, apparently; my aunt, being superstitious, strokes it every time." }
        alt: ["Parce qu'elle porte bonheur, paraît-il.", "On dit qu'elle porte bonheur."]
        grammar: [g.participe-present]
        vocab: [w.porter-bonheur, w.superstitieux]
      - q: { es: "Qui étaient les ducs de Bourgogne ?", en: "Who were the dukes of Burgundy?" }
        a: { es: "Des seigneurs très puissants, possédant des terres jusqu'en Flandre.", en: "Very powerful lords, owning land as far as Flanders." }
        alt: ["Des seigneurs très puissants qui possédaient des terres jusqu'en Flandre.", "Des seigneurs aussi puissants que le roi."]
        grammar: [g.participe-present]
        vocab: [w.seigneur, w.puissant, w.posséder]
      - q: { es: "Vous recrutez pour la boutique de souvenirs ?", en: "Are you hiring for the souvenir shop?" }
        a: { es: "Oui, nous cherchons une vendeuse parlant anglais et connaissant bien la ville.", en: "Yes, we're looking for a sales assistant who speaks English and knows the town well." }
        alt: ["Oui, quelqu'un parlant anglais.", "Oui, nous cherchons un vendeur parlant anglais."]
        grammar: [g.participe-present]
        vocab: [w.vendeur, w.souvenir]
      - q: { es: "Tu es monté en haut de la tour ?", en: "Did you go up to the top of the tower?" }
        a: { es: "Non, n'ayant plus d'énergie, je suis resté en bas avec les sacs.", en: "No, having no energy left, I stayed at the bottom with the bags." }
        alt: ["Non, étant trop fatigué, je suis resté en bas.", "Oui, et la vue était magnifique."]
        grammar: [g.participe-present, g.negation-jamais-plus-rien]
        vocab: [w.énergie, w.tour.n]
    texts:
      - title: "Petite annonce de l'office de tourisme"
        es: ["Office de tourisme de Dijon : nous recherchons un guide.", "Profil : personne parlant anglais et allemand, connaissant l'histoire des ducs.", "Les candidats souhaitant postuler peuvent envoyer leur CV avant le 15 mai."]
        en: ["Dijon tourist office: we're looking for a guide.", "Profile: someone who speaks English and German and knows the history of the dukes.", "Candidates wishing to apply can send their CV before 15 May."]
        grammar: [g.participe-present]
        vocab: [w.guide, w.cv, w.duc]
      - title: "Panneau rue de la Chouette"
        es: ["Ici se trouve la célèbre chouette de Dijon.", "Les visiteurs désirant faire un vœu la caressent de la main gauche.", "Respectez-la : abîmée, elle ne porterait plus bonheur à personne."]
        en: ["Here is the famous owl of Dijon.", "Visitors wishing to make a wish stroke it with their left hand.", "Respect it: damaged, it would no longer bring anyone luck."]
        grammar: [g.participe-present, g.participial-clauses]
        vocab: [w.vœu, w.porter-bonheur, w.abîmer]
    spicy:
      - { es: "Ne sachant pas comment t'aborder, j'ai fait semblant de chercher la chouette pendant une heure.", en: "Not knowing how to approach you, I pretended to look for the owl for an hour.", altEs: ["Ne sachant pas comment t'aborder, j'ai fait semblant de chercher la chouette pendant une heure entière."], grammar: [g.participe-present], vocab: [w.chouette] }
      - { es: "Ayant caressé la chouette trois fois, j'attends toujours que tu m'appelles.", en: "Having stroked the owl three times, I'm still waiting for you to call me.", altEs: ["J'ai caressé la chouette trois fois et j'attends toujours que tu m'appelles."], grammar: [g.participe-present], vocab: [w.caresser, w.chouette] }
      - { es: "Cherche personne charmante, aimant la moutarde forte et les promenades dans la vieille ville.", en: "Seeking charming person who loves strong mustard and walks in the old town.", altEs: ["Cherche personne charmante aimant la moutarde forte et les promenades dans la vieille ville."], grammar: [g.participe-present], vocab: [w.charmant, w.moutarde] }
      - { es: "Étant superstitieux, il refuse de m'embrasser avant d'avoir touché la chouette.", en: "Being superstitious, he refuses to kiss me before he's touched the owl.", altEs: ["Comme il est superstitieux, il refuse de m'embrasser avant d'avoir touché la chouette."], grammar: [g.participe-present, g.apres-avoir-avant-de], vocab: [w.superstitieux, w.embrasser] }
      - { es: "Voulant t'impressionner, j'ai appris par cœur toute l'histoire des ducs ; tu t'es endormie au bout de deux minutes.", en: "Wanting to impress you, I learned the whole history of the dukes by heart; you fell asleep after two minutes.", altEs: ["Voulant t'impressionner, j'ai appris par cœur toute l'histoire des ducs, et tu t'es endormie au bout de deux minutes."], grammar: [g.participe-present], vocab: [w.impressionner, w.duc] }
  - id: b2.u07.l2
    title: Une visite fatigante mais passionnante
    teach: [g.adjectif-verbal]
    vocab: [w.fatigant, w.convaincant, w.surprenant, w.négligent, w.excellent, w.fascinant, w.passionnant, w.intrigant, w.encourageant, w.précéder, w.fatiguer, w.chaleur, w.fraîcheur, w.épice, w.pain-d-épices, w.cassis, w.kir, w.escargot, w.bœuf-bourguignon, w.dorer, w.cuisson, w.savoir-vivre, w.intriguer]
    tip: "An -ant word that describes a quality is an adjective and agrees (des visites fatigantes); one that describes an action is a participle and stays invariable (des guides fatiguant leur public). Some adjectives change spelling: fatigant, convaincant, précédent, excellent."
    sentences:
      - { es: "La montée de la tour est fatigante, mais la vue sur les toits est fascinante.", en: "The climb up the tower is tiring, but the view over the rooftops is fascinating.", altEs: ["La montée de la tour est fatigante, mais la vue sur les toits est passionnante."], grammar: [g.adjectif-verbal], vocab: [w.fatigant, w.fascinant, w.toit] }
      - { es: "Les arguments du serveur étaient si convaincants que nous avons tous goûté les escargots.", en: "The waiter's arguments were so convincing that we all tried the snails.", altEs: ["Les arguments du serveur étaient tellement convaincants que nous avons tous goûté les escargots.", "Les arguments du serveur étaient si convaincants qu'on a tous goûté les escargots."], grammar: [g.adjectif-verbal], vocab: [w.convaincant, w.argument, w.escargot] }
      - { es: "Convainquant même les plus sceptiques, le chef nous a fait goûter ses escargots au beurre.", en: "Convincing even the most sceptical among us, the chef had us taste his snails in butter.", altEs: ["Convainquant même les plus sceptiques, le chef nous a fait goûter ses escargots au beurre persillé."], grammar: [g.adjectif-verbal, g.participe-present], vocab: [w.sceptique, w.escargot, w.beurre], note: "Participle: convainquant (action, with an object). Adjective: convaincant." }
      - { es: "Le jour précédant notre départ, nous avons acheté du pain d'épices pour toute la famille.", en: "The day before we left, we bought gingerbread for the whole family.", altEs: ["La veille de notre départ, nous avons acheté du pain d'épices pour toute la famille."], grammar: [g.adjectif-verbal, g.participe-present], vocab: [w.précéder, w.pain-d-épices] }
      - { es: "Le jour précédent, nous avions visité le musée des Beaux-Arts.", en: "The previous day, we had visited the Museum of Fine Arts.", altEs: ["La veille, nous avions visité le musée des Beaux-Arts."], grammar: [g.adjectif-verbal, g.plus-que-parfait], vocab: [w.précédent, w.musée], note: "précédant (participle, takes an object) / précédent (adjective)." }
      - { es: "Il fait une chaleur fatigante ; allons chercher un peu de fraîcheur dans l'église.", en: "The heat is exhausting; let's go and find somewhere cool in the church.", altEs: ["Il fait une chaleur fatigante : allons chercher un peu de fraîcheur dans l'église."], grammar: [g.adjectif-verbal, g.imperative], vocab: [w.chaleur, w.fraîcheur, w.fatigant] }
      - { es: "Le kir, un mélange de vin blanc et de crème de cassis, porte le nom d'un ancien maire de Dijon.", en: "Kir, a mix of white wine and blackcurrant liqueur, is named after a former mayor of Dijon.", altEs: ["Le kir, mélange de vin blanc et de crème de cassis, porte le nom d'un ancien maire de Dijon."], grammar: [g.adjectif-verbal], vocab: [w.kir, w.cassis, w.maire], note: "Canon Félix Kir was mayor of Dijon from 1945 to 1968." }
      - { es: "Ces résultats sont encourageants pour les producteurs de cassis de la région.", en: "These results are encouraging for the region's blackcurrant growers.", altEs: ["Ce sont des résultats encourageants pour les producteurs de cassis de la région."], grammar: [g.adjectif-verbal], vocab: [w.encourageant, w.résultat, w.producteur] }
      - { es: "Le chef, excellant dans la cuisine bourguignonne, prépare un bœuf bourguignon excellent.", en: "The chef, who excels at Burgundian cooking, makes an excellent beef bourguignon.", altEs: ["Le chef, qui excelle dans la cuisine bourguignonne, prépare un excellent bœuf bourguignon."], grammar: [g.adjectif-verbal, g.participe-present], vocab: [w.excellent, w.bœuf-bourguignon], note: "excellant (participle) / excellent (adjective)." }
      - { es: "C'est surprenant : la plupart des graines de moutarde viennent du Canada.", en: "It's surprising: most mustard seeds come from Canada.", altEs: ["C'est étonnant : la plupart des graines de moutarde viennent du Canada."], grammar: [g.adjectif-verbal], vocab: [w.surprenant, w.plupart, w.graine] }
      - { es: "Le serveur a été un peu négligent : il a oublié la moutarde.", en: "The waiter was a bit careless: he forgot the mustard.", altEs: ["Le serveur a été un peu négligent, il a oublié la moutarde."], grammar: [g.adjectif-verbal], vocab: [w.négligent, w.serveur] }
      - { es: "Chez mes grands-parents, refuser un kir, c'est manquer de savoir-vivre !", en: "At my grandparents' house, turning down a kir is bad manners!", altEs: ["Chez mes grands-parents, refuser un kir, c'est un manque de savoir-vivre !"], grammar: [g.dislocation], vocab: [w.savoir-vivre, w.refuser] }
      - { es: "Cette randonnée dans les vignes fatigue beaucoup.", en: "This walk through the vineyards really wears you out.", grammar: [g.adjectif-verbal], vocab: [w.fatiguer, w.randonnée], transform: { instruction: "Use the verbal adjective: Cette randonnée est très…", answer: "Cette randonnée dans les vignes est très fatigante.", en: "This walk through the vineyards is very tiring." } }
      - { es: "L'histoire de cette chouette intrigue tout le monde.", en: "The story of this owl intrigues everyone.", grammar: [g.adjectif-verbal], vocab: [w.chouette, w.histoire], transform: { instruction: "Use the verbal adjective of intriguer", answer: "L'histoire de cette chouette est intrigante.", alt: ["L'histoire de cette chouette est très intrigante."], en: "The story of this owl is intriguing." } }
      - { es: "Cette visite était vraiment fatigante.", en: "This tour was really tiring.", altEs: ["Cette visite était vraiment épuisante."], grammar: [g.adjectif-verbal], vocab: [w.fatigant, w.visite], error: { wrong: "Cette visite était vraiment fatiguante.", explain: "The adjective is spelled fatigant (no u); fatiguant is the present participle of fatiguer.", grammar: g.adjectif-verbal } }
      - { es: "Ce sont des chiffres surprenants.", en: "These are surprising figures.", grammar: [g.adjectif-verbal], vocab: [w.surprenant, w.chiffre], error: { wrong: "Ce sont des chiffres surprenant.", explain: "As an adjective, surprenant agrees with chiffres: surprenants.", grammar: g.adjectif-verbal } }
    exchanges:
      - q: { es: "Alors, ces escargots ?", en: "So, how were the snails?" }
        a: { es: "Surprenants ! Je ne pensais pas aimer ça.", en: "Surprising! I didn't think I'd like them." }
        alt: ["Excellents, avec beaucoup de beurre.", "Bof, pas très convaincants."]
        grammar: [g.adjectif-verbal]
        vocab: [w.escargot, w.surprenant]
      - q: { es: "Tu as aimé la visite du palais ?", en: "Did you enjoy the tour of the palace?" }
        a: { es: "Oui, passionnante, mais un peu fatigante avec tous ces escaliers.", en: "Yes, fascinating, but a bit tiring with all those stairs." }
        alt: ["Oui, elle était passionnante.", "Elle était fascinante mais fatigante."]
        grammar: [g.adjectif-verbal]
        vocab: [w.passionnant, w.fatigant, w.escalier]
      - q: { es: "On prend un kir avant de manger ?", en: "Shall we have a kir before we eat?" }
        a: { es: "Volontiers, mais avec peu de cassis, s'il vous plaît.", en: "Gladly, but with not much blackcurrant, please." }
        alt: ["Avec plaisir !", "Oui, un kir pour moi."]
        grammar: [g.quantities]
        vocab: [w.kir, w.cassis]
      - q: { es: "Comment tu as trouvé ses arguments ?", en: "What did you think of her arguments?" }
        a: { es: "Pas très convaincants ; elle n'a donné aucun exemple.", en: "Not very convincing; she didn't give a single example." }
        alt: ["Très convaincants.", "Assez convaincants, en fait."]
        grammar: [g.adjectif-verbal, g.ni-ni-aucun]
        vocab: [w.convaincant, w.argument]
      - q: { es: "Qu'est-ce qu'on rapporte de Dijon ?", en: "What shall we bring back from Dijon?" }
        a: { es: "Du pain d'épices, de la moutarde et une bouteille de crème de cassis.", en: "Gingerbread, mustard and a bottle of blackcurrant liqueur." }
        alt: ["De la moutarde, évidemment !", "Du pain d'épices."]
        grammar: [g.partitive-articles]
        vocab: [w.pain-d-épices, w.cassis]
    texts:
      - title: "Avis sur un restaurant"
        es: ["Accueil souriant et service excellent.", "Le bœuf bourguignon était fondant, les escargots surprenants.", "Seul bémol : une chaleur fatigante dans la salle, faute de climatisation."]
        en: ["Friendly welcome and excellent service.", "The beef bourguignon was melt-in-the-mouth, the snails surprising.", "Only drawback: an exhausting heat in the dining room, for lack of air conditioning."]
        grammar: [g.adjectif-verbal]
        vocab: [w.excellent, w.bœuf-bourguignon, w.chaleur]
      - title: "Recette de grand-mère"
        es: ["Mélangez le miel chaud, la farine et les épices.", "Laissez reposer la pâte une nuit entière.", "Le lendemain, laissez dorer au four : la cuisson est longue, mais le résultat est excellent."]
        en: ["Mix the warm honey, the flour and the spices.", "Leave the dough to rest overnight.", "The next day, let it brown in the oven: it takes a long time to bake, but the result is excellent."]
        grammar: [g.imperative, g.adjectif-verbal]
        vocab: [w.épice, w.dorer, w.cuisson]
    spicy:
      - { es: "Tes arguments sont convaincants, mais ton sourire l'est encore plus.", en: "Your arguments are convincing, but your smile is even more so.", altEs: ["Tes arguments sont convaincants, mais ton sourire est encore plus convaincant."], grammar: [g.adjectif-verbal], vocab: [w.convaincant, w.sourire] }
      - { es: "Tu es fatigante, tu sais ? Tu me fais rire toute la nuit et je dors au bureau le lendemain.", en: "You're exhausting, you know? You make me laugh all night and I sleep at the office the next day.", altEs: ["Tu es fatigante, tu sais : tu me fais rire toute la nuit et je dors au bureau le lendemain."], grammar: [g.adjectif-verbal], vocab: [w.fatigant, w.rire] }
      - { es: "Un homme qui fait son propre pain d'épices ? C'est surprenant… et très encourageant.", en: "A man who makes his own gingerbread? That's surprising… and very encouraging.", altEs: ["Un homme qui fait lui-même son pain d'épices ? C'est surprenant… et très encourageant."], grammar: [g.adjectif-verbal], vocab: [w.surprenant, w.encourageant, w.pain-d-épices] }
      - { es: "Ce kir était excellent, mais c'est la personne qui me l'a offert que je trouve fascinante.", en: "That kir was excellent, but it's the person who bought it for me I find fascinating.", altEs: ["Le kir était excellent, mais c'est la personne qui me l'a offert que je trouve fascinante."], grammar: [g.adjectif-verbal, g.mise-en-relief], vocab: [w.kir, w.excellent, w.fascinant] }
      - { es: "Avec toi, même la fraîcheur de la cave devient une chaleur intrigante.", en: "With you, even the cool of the cellar turns into an intriguing warmth.", altEs: ["Avec toi, même la fraîcheur de la cave se transforme en chaleur intrigante."], grammar: [g.adjectif-verbal], vocab: [w.fraîcheur, w.chaleur, w.intrigant] }
  - id: b2.u07.l3
    title: La vendange terminée
    teach: [g.participial-clauses]
    vocab: [w.moutarde, w.graine, w.grain, w.moudre, w.plupart, w.vignoble, w.vigne, w.coteau, w.moisson, w.vendange, w.vendanger, w.une-fois, w.terminé, w.achevé, w.achever, w.colombage, w.tuile, w.vernissé, w.multicolore, w.coloré, w.motif, w.géométrique, w.vente, w.agrandir, w.border, w.reproduire, w.forcément, w.soin, w.vider, w.raccompagner, w.larme]
    tip: "Noun + past participle at the start of a sentence says 'once / after': La vendange terminée, on fait la fête. The participle agrees with its noun, and a participle on its own must refer to the subject of the main clause."
    sentences:
      - { es: "La vendange terminée, les vignerons font la fête dans les caves.", en: "Once the grape harvest is over, the winegrowers party in the cellars.", altEs: ["Une fois la vendange terminée, les vignerons font la fête dans les caves.", "Les vendanges terminées, les vignerons font la fête dans les caves."], grammar: [g.participial-clauses], vocab: [w.vendange, w.terminé, w.vigneron, w.cave] }
      - { es: "Agrandi au XVIIe siècle, le palais des ducs abrite aujourd'hui la mairie et le musée des Beaux-Arts.", en: "Enlarged in the 17th century, the Palace of the Dukes now houses the town hall and the Museum of Fine Arts.", altEs: ["Agrandi au XVIIe siècle, le palais des ducs accueille aujourd'hui la mairie et le musée des Beaux-Arts."], grammar: [g.participial-clauses], vocab: [w.agrandir, w.palais, w.abriter, w.mairie] }
      - { es: "Couverts de tuiles vernissées, certains toits de Dijon forment des motifs géométriques multicolores.", en: "Covered in glazed tiles, some of Dijon's roofs form multicoloured geometric patterns.", altEs: ["Couverts de tuiles vernissées, certains toits de Dijon dessinent des motifs géométriques multicolores."], grammar: [g.participial-clauses], vocab: [w.tuile, w.vernissé, w.motif, w.géométrique, w.multicolore] }
      - { es: "Bâties il y a plus de cinq cents ans, ces maisons à colombages bordent encore la rue.", en: "Built more than five hundred years ago, these half-timbered houses still line the street.", altEs: ["Construites il y a plus de cinq cents ans, ces maisons à colombages bordent encore la rue."], grammar: [g.participial-clauses, g.pc-agreement-etre], vocab: [w.bâtir, w.colombage, w.border] }
      - { es: "Plantées sur les coteaux au sud de Dijon, les vignes donnent des vins célèbres dans le monde entier.", en: "Planted on the hillsides south of Dijon, the vines produce wines that are famous all over the world.", altEs: ["Plantées sur les coteaux au sud de Dijon, les vignes produisent des vins célèbres dans le monde entier."], grammar: [g.participial-clauses], vocab: [w.planter, w.coteau, w.vigne] }
      - { es: "La plupart des graines venant du Canada, « moutarde de Dijon » désigne une recette, pas une origine.", en: "Since most of the seeds come from Canada, 'Dijon mustard' means a recipe, not a place of origin.", altEs: ["Comme la plupart des graines viennent du Canada, « moutarde de Dijon » désigne une recette, pas une origine."], grammar: [g.participial-clauses, g.participe-present], vocab: [w.plupart, w.moutarde, w.recette, w.origine] }
      - { es: "Sitôt la moisson finie, les paysans commençaient à préparer les vendanges.", en: "As soon as the grain harvest was over, the farmers would start getting ready for the grape harvest.", altEs: ["Dès que la moisson était finie, les paysans commençaient à préparer les vendanges."], grammar: [g.participial-clauses, g.imparfait-uses], vocab: [w.moisson, w.paysan, w.vendange] }
      - { es: "Le travail achevé, les vendangeurs boivent un verre ensemble au bout de la vigne.", en: "With the work done, the grape pickers have a drink together at the end of the row of vines.", altEs: ["Une fois le travail achevé, les vendangeurs boivent un verre ensemble au bout de la vigne."], grammar: [g.participial-clauses], vocab: [w.achevé, w.vendangeur, w.vigne] }
      - { es: "Le grain moulu, on obtient une pâte jaune et piquante.", en: "Once the grain is ground, you get a yellow, hot paste.", altEs: ["Une fois le grain moulu, on obtient une pâte jaune et piquante."], grammar: [g.participial-clauses], vocab: [w.grain, w.moudre, w.pâte, w.piquant] }
      - { es: "Tu viens vendanger avec nous en septembre ? Les vendanges finies, on fait un grand repas.", en: "Are you coming grape-picking with us in September? Once the harvest is in, we have a big meal.", altEs: ["Tu viens faire les vendanges avec nous en septembre ? Les vendanges finies, on fait un grand repas."], grammar: [g.participial-clauses], vocab: [w.vendanger, w.vendange, w.repas] }
      - { es: "La vente terminée, la boutique ferme ses portes jusqu'au printemps.", en: "Once the sale is over, the shop closes its doors until spring.", altEs: ["Une fois la vente terminée, la boutique ferme ses portes jusqu'au printemps."], grammar: [g.participial-clauses], vocab: [w.vente, w.terminé, w.boutique] }
      - { es: "Les maisons à colombages, très colorées, attirent les photographes.", en: "The half-timbered houses, which are very colourful, attract photographers.", altEs: ["Très colorées, les maisons à colombages attirent les photographes."], grammar: [g.adjective-agreement], vocab: [w.coloré, w.colombage, w.photographe] }
      - { es: "Quand le repas a été fini, nous sommes allés nous promener dans le vignoble.", en: "When the meal was over, we went for a walk in the vineyard.", grammar: [g.participial-clauses], vocab: [w.repas, w.vignoble], transform: { instruction: "Use an absolute participle: Le repas…", answer: "Le repas fini, nous sommes allés nous promener dans le vignoble.", alt: ["Une fois le repas fini, nous sommes allés nous promener dans le vignoble.", "Le repas terminé, nous sommes allés nous promener dans le vignoble."], en: "Once the meal was over, we went for a walk in the vineyard." } }
      - { es: "Quand vous avez acheté les billets, vous pouvez monter dans la tour.", en: "When you've bought the tickets, you can go up the tower.", grammar: [g.participial-clauses], vocab: [w.billet, w.tour.n], transform: { instruction: "Start with Une fois + noun + participle", answer: "Une fois les billets achetés, vous pouvez monter dans la tour.", alt: ["Les billets achetés, vous pouvez monter dans la tour."], en: "Once you've bought the tickets, you can go up the tower." } }
      - { es: "Restaurée récemment, la tour est de nouveau ouverte aux visiteurs.", en: "Recently restored, the tower is open to visitors again.", altEs: ["Récemment restaurée, la tour est de nouveau ouverte aux visiteurs."], grammar: [g.participial-clauses], vocab: [w.restaurer, w.visiteur], error: { wrong: "Restaurée récemment, les visiteurs peuvent de nouveau monter dans la tour.", explain: "A participle at the start must refer to the subject of the main clause: here it would mean the visitors were restored. Make la tour the subject.", grammar: g.participial-clauses } }
      - { es: "La vendange terminée, on ouvre les premières bouteilles.", en: "Once the harvest is over, the first bottles are opened.", grammar: [g.participial-clauses], vocab: [w.vendange, w.bouteille], error: { wrong: "La vendange terminé, on ouvre les premières bouteilles.", explain: "The participle agrees with its own noun: la vendange terminée.", grammar: g.participial-clauses } }
    exchanges:
      - q: { es: "Comment on fait la moutarde ?", en: "How is mustard made?" }
        a: { es: "On moud les graines ; une fois la pâte obtenue, on ajoute du vinaigre et du sel.", en: "You grind the seeds; once you have the paste, you add vinegar and salt." }
        alt: ["On moud les graines, puis on ajoute du vinaigre.", "Avec des graines moulues, du vinaigre et du sel."]
        grammar: [g.participial-clauses]
        vocab: [w.moudre, w.graine, w.moutarde]
      - q: { es: "Qu'est-ce qu'on fait après les vendanges ?", en: "What do you do after the grape harvest?" }
        a: { es: "Le travail achevé, tout le village se retrouve pour un grand repas.", en: "When the work is done, the whole village gets together for a big meal." }
        alt: ["Les vendanges finies, on fait la fête.", "Une fois le travail fini, on mange tous ensemble."]
        grammar: [g.participial-clauses]
        vocab: [w.achevé, w.vendange]
      - q: { es: "Il date de quand, ce toit ?", en: "How old is this roof?" }
        a: { es: "Refaites au siècle dernier, les tuiles reproduisent les motifs d'origine.", en: "Redone last century, the tiles copy the original patterns." }
        alt: ["Il a été refait au siècle dernier.", "Je ne sais pas, mais les motifs sont d'origine."]
        grammar: [g.participial-clauses]
        vocab: [w.tuile, w.motif]
      - q: { es: "On peut entrer dans le palais ?", en: "Can we go into the palace?" }
        a: { es: "Oui, une fois les sacs laissés à l'accueil.", en: "Yes, once you've left your bags at reception." }
        alt: ["Oui, mais laissez vos sacs à l'accueil.", "Oui, l'entrée du musée est gratuite."]
        grammar: [g.participial-clauses]
        vocab: [w.une-fois, w.accueil]
      - q: { es: "Pourquoi la moutarde de Dijon ne vient pas forcément de Dijon ?", en: "Why doesn't Dijon mustard necessarily come from Dijon?" }
        a: { es: "Parce que c'est une recette ; la plupart des graines sont cultivées au Canada.", en: "Because it's a recipe; most of the seeds are grown in Canada." }
        alt: ["C'est une recette, pas une origine.", "Parce que la plupart des graines viennent du Canada."]
        grammar: [g.passive-voice]
        vocab: [w.plupart, w.graine]
    texts:
      - title: "Visite d'une moutarderie"
        es: ["Les graines arrivées, on les nettoie avec soin.", "Une fois moulues, elles donnent une pâte jaune.", "Mélangée au vinaigre, cette pâte devient la moutarde que vous achetez en pot."]
        en: ["Once the seeds have arrived, they're cleaned carefully.", "Once ground, they give a yellow paste.", "Mixed with vinegar, this paste becomes the mustard you buy in jars."]
        grammar: [g.participial-clauses]
        vocab: [w.graine, w.moudre, w.moutarde, w.pot]
      - title: "Carte postale des vignes"
        es: ["La vendange terminée, les coteaux sont devenus tout calmes.", "Les feuilles des vignes, rouges et dorées, sont magnifiques.", "Le vin achevé, nous reviendrons le goûter au printemps !"]
        en: ["Now the harvest is over, the hillsides have gone quiet.", "The vine leaves, red and gold, are magnificent.", "Once the wine is finished, we'll come back and taste it in the spring!"]
        grammar: [g.participial-clauses]
        vocab: [w.coteau, w.vigne, w.achevé]
    spicy:
      - { es: "Le dîner terminé, il a proposé de me raccompagner… par le chemin le plus long.", en: "Dinner over, he offered to walk me home… the long way round.", altEs: ["Une fois le dîner terminé, il a proposé de me raccompagner… par le chemin le plus long."], grammar: [g.participial-clauses], vocab: [w.terminé, w.raccompagner] }
      - { es: "Une fois la bouteille vidée, nos timidités ont disparu en même temps.", en: "Once the bottle was empty, our shyness vanished at the same time.", altEs: ["Une fois la bouteille vide, nos timidités ont disparu en même temps."], grammar: [g.participial-clauses], vocab: [w.une-fois, w.vider] }
      - { es: "Les vendanges finies, tous les vendangeurs se sont embrassés ; moi, j'ai visé le plus mignon.", en: "When the harvest was done, all the pickers kissed each other; I aimed for the cutest one.", altEs: ["Une fois les vendanges finies, tous les vendangeurs se sont embrassés ; moi, j'ai visé le plus mignon."], grammar: [g.participial-clauses], vocab: [w.vendangeur, w.mignon] }
      - { es: "Assise sous les tuiles multicolores, tu étais encore plus jolie que le toit.", en: "Sitting under the multicoloured tiles, you were even prettier than the roof.", altEs: ["Assise sous le toit multicolore, tu étais encore plus jolie que lui."], grammar: [g.participial-clauses], vocab: [w.tuile, w.multicolore] }
      - { es: "Le pot de moutarde vide, il m'a regardé avec des yeux pleins de larmes : c'était la plus forte de la boutique.", en: "With the mustard jar empty, he looked at me with eyes full of tears: it was the strongest in the shop.", altEs: ["Une fois le pot de moutarde vide, il m'a regardé les yeux pleins de larmes : c'était la plus forte de la boutique."], grammar: [g.participial-clauses], vocab: [w.moutarde, w.larme] }
  - id: b2.u07.l4
    title: Une maison exportant dans le monde entier
    teach: [g.participe-present, g.participial-clauses]
    vocab: [w.usine, w.fabriquer, w.fabrication, w.produire, w.production, w.industrie, w.industriel, w.économie, w.exporter, w.importer, w.marque, w.négocier, w.négociation, w.commerce, w.commercial, w.concurrent, w.concurrence, w.consommateur, w.consommer, w.consommation, w.bénéfice, w.perte, w.chiffre-d-affaires, w.croissance, w.récession, w.inflation, w.taux, w.fournisseur, w.exportation, w.importation, w.mondialisation, w.artisanal, w.artisanat, w.édelweiss, w.savoyard, w.marionnette, w.peluche, w.employer, w.faire-face, w.exploser]
    tip: "Business writing loves participles: Exportant dans trente pays, la marque… / Les ventes ayant baissé, l'entreprise… In speech you'd say comme les ventes ont baissé…"
    sentences:
      - { es: "Employant deux cents personnes, l'usine fabrique des millions de pots de moutarde par an.", en: "Employing two hundred people, the factory makes millions of jars of mustard a year.", altEs: ["Employant 200 personnes, l'usine fabrique des millions de pots de moutarde par an.", "L'usine, qui emploie deux cents personnes, fabrique des millions de pots de moutarde par an."], grammar: [g.participe-present], vocab: [w.employer, w.usine, w.fabriquer] }
      - { es: "La sécheresse ayant détruit une partie des récoltes canadiennes en 2021, la moutarde a manqué en France l'année suivante.", en: "As drought destroyed part of the Canadian harvest in 2021, there was a mustard shortage in France the following year.", altEs: ["Comme la sécheresse avait détruit une partie des récoltes canadiennes en 2021, la moutarde a manqué en France l'année suivante."], grammar: [g.participe-present, g.participial-clauses], vocab: [w.sécheresse, w.récolte, w.manquer] }
      - { es: "Exportant dans le monde entier, la marque doit faire face à une forte concurrence.", en: "Exporting all over the world, the brand has to face strong competition.", altEs: ["Comme elle exporte dans le monde entier, la marque doit faire face à une forte concurrence."], grammar: [g.participe-present], vocab: [w.exporter, w.marque, w.concurrence, w.faire-face] }
      - { es: "Le chiffre d'affaires ayant augmenté de dix pour cent, les bénéfices sont encourageants.", en: "With turnover up ten per cent, the profits are encouraging.", altEs: ["Le chiffre d'affaires ayant augmenté de 10 %, les bénéfices sont encourageants."], grammar: [g.participe-present, g.adjectif-verbal], vocab: [w.chiffre-d-affaires, w.bénéfice, w.encourageant] }
      - { es: "Une fois la négociation terminée, le fournisseur a enfin baissé ses prix.", en: "Once the negotiation was over, the supplier finally lowered his prices.", altEs: ["La négociation terminée, le fournisseur a enfin baissé ses prix."], grammar: [g.participial-clauses], vocab: [w.négociation, w.fournisseur, w.baisser] }
      - { es: "L'inflation dépassant cinq pour cent, les consommateurs achètent moins de produits de luxe.", en: "With inflation above five per cent, consumers are buying fewer luxury products.", altEs: ["Comme l'inflation dépasse cinq pour cent, les consommateurs achètent moins de produits de luxe."], grammar: [g.participe-present], vocab: [w.inflation, w.consommateur, w.luxe] }
      - { es: "La récession touchant d'abord les petits commerces, l'artisanat local a besoin d'aide.", en: "Since the recession hits small shops first, local crafts need help.", altEs: ["Comme la récession touche d'abord les petits commerces, l'artisanat local a besoin d'aide."], grammar: [g.participe-present], vocab: [w.récession, w.commerce, w.artisanat] }
      - { es: "Avec la mondialisation, les importations et les exportations ont explosé.", en: "With globalisation, imports and exports have soared.", altEs: ["Avec la mondialisation, les exportations et les importations ont explosé."], grammar: [g.passe-compose-avoir], vocab: [w.mondialisation, w.importation, w.exportation] }
      - { es: "Notre directeur commercial, négociant avec dix pays, n'est jamais au bureau.", en: "Our sales director, who negotiates with ten countries, is never in the office.", altEs: ["Notre directeur commercial, qui négocie avec dix pays, n'est jamais au bureau."], grammar: [g.participe-present], vocab: [w.commercial, w.négocier, w.directeur] }
      - { es: "La France importe ses graines et exporte sa moutarde : c'est ça, l'économie mondiale !", en: "France imports its seeds and exports its mustard: that's the global economy for you!", altEs: ["La France importe ses graines et exporte sa moutarde, c'est ça l'économie mondiale !"], grammar: [g.dislocation], vocab: [w.importer, w.exporter, w.économie, w.mondial] }
      - { es: "Rentrant des Alpes, ma sœur m'a rapporté un édelweiss et une fondue savoyarde.", en: "On her way back from the Alps, my sister brought me an edelweiss and a Savoyard fondue.", altEs: ["En rentrant des Alpes, ma sœur m'a rapporté un édelweiss et une fondue savoyarde."], grammar: [g.participe-present], vocab: [w.édelweiss, w.savoyard, w.fondue] }
      - { es: "Ayant vu un spectacle de marionnettes, ma nièce voulait une chouette en peluche.", en: "Having seen a puppet show, my niece wanted a soft-toy owl.", altEs: ["Après avoir vu un spectacle de marionnettes, ma nièce voulait une chouette en peluche."], grammar: [g.participe-present], vocab: [w.marionnette, w.peluche, w.spectacle] }
      - { es: "Comme le taux d'inflation est élevé, les entreprises investissent moins.", en: "As the inflation rate is high, companies are investing less.", grammar: [g.participe-present, g.connectors-cause-consequence], vocab: [w.taux, w.inflation, w.investir], transform: { instruction: "Replace comme… with a present participle", answer: "Le taux d'inflation étant élevé, les entreprises investissent moins.", en: "The inflation rate being high, companies are investing less." } }
      - { es: "Les entreprises qui produisent en France ont une bonne image.", en: "Companies that produce in France have a good image.", grammar: [g.participe-present], vocab: [w.produire, w.entreprise], transform: { instruction: "Replace qui + verb with a present participle", answer: "Les entreprises produisant en France ont une bonne image.", en: "Companies producing in France have a good image." } }
      - { es: "La production a baissé : l'entreprise a enregistré des pertes.", en: "Production went down: the company recorded losses.", grammar: [g.participial-clauses], vocab: [w.production, w.perte], transform: { instruction: "Join with a compound participle: La production ayant…", answer: "La production ayant baissé, l'entreprise a enregistré des pertes.", en: "Production having fallen, the company recorded losses." } }
      - { es: "Ayant baissé ses prix, le magasin a retrouvé ses clients.", en: "Having lowered its prices, the shop won its customers back.", altEs: ["Comme il a baissé ses prix, le magasin a retrouvé ses clients."], grammar: [g.participe-present], vocab: [w.baisser, w.client], error: { wrong: "Ayant baissé ses prix, les clients sont revenus au magasin.", explain: "The participle refers to the subject of the main verb: this says the customers lowered the prices. Make le magasin the subject.", grammar: g.participe-present } }
    exchanges:
      - q: { es: "Ça marche bien, votre entreprise ?", en: "Is your company doing well?" }
        a: { es: "Plutôt, oui : le chiffre d'affaires ayant augmenté, on va embaucher deux personnes.", en: "Pretty well, yes: with turnover up, we're going to hire two people." }
        alt: ["Oui, la croissance est bonne cette année.", "Pas vraiment, on a fait des pertes."]
        grammar: [g.participe-present]
        vocab: [w.chiffre-d-affaires]
      - q: { es: "Pourquoi la moutarde était si chère l'an dernier ?", en: "Why was mustard so expensive last year?" }
        a: { es: "La récolte de graines ayant été mauvaise au Canada, les fournisseurs ont augmenté leurs prix.", en: "The seed harvest having been poor in Canada, the suppliers raised their prices." }
        alt: ["À cause de la sécheresse au Canada.", "Parce que la récolte a été mauvaise."]
        grammar: [g.participe-present]
        vocab: [w.récolte, w.fournisseur]
      - q: { es: "Vous préférez les produits artisanaux ou industriels ?", en: "Do you prefer handmade or factory-made products?" }
        a: { es: "Artisanaux, quand j'en ai les moyens.", en: "Handmade, when I can afford it." }
        alt: ["Artisanaux, évidemment.", "Ça dépend du prix."]
        grammar: [g.pronoun-en]
        vocab: [w.artisanal, w.industriel]
      - q: { es: "Qui sont vos principaux concurrents ?", en: "Who are your main competitors?" }
        a: { es: "Deux grandes marques exportant en Asie et une petite maison artisanale de Beaune.", en: "Two big brands exporting to Asia and a small craft firm from Beaune." }
        alt: ["Deux grandes marques industrielles.", "Surtout des marques étrangères."]
        grammar: [g.participe-present]
        vocab: [w.concurrent, w.marque]
      - q: { es: "Tu m'as rapporté quoi de ton voyage ?", en: "What did you bring me back from your trip?" }
        a: { es: "Une chouette en peluche, achetée à Dijon, et du pain d'épices.", en: "A soft-toy owl, bought in Dijon, and some gingerbread." }
        alt: ["Une chouette en peluche.", "Un pot de moutarde, comme toujours."]
        grammar: [g.participial-clauses]
        vocab: [w.peluche, w.chouette]
    texts:
      - title: "Communiqué de presse"
        es: ["Fondée en 1850, notre maison fabrique de la moutarde à l'ancienne.", "Exportant aujourd'hui dans trente pays, elle reste fidèle à sa recette.", "Les ventes ayant progressé de 8 %, une nouvelle usine ouvrira en 2027."]
        en: ["Founded in 1850, our company makes traditional wholegrain mustard.", "Exporting to thirty countries today, it remains faithful to its recipe.", "Sales having grown by 8%, a new factory will open in 2027."]
        grammar: [g.participe-present, g.participial-clauses]
        vocab: [w.fabriquer, w.exporter, w.usine]
      - title: "Note du directeur"
        es: ["Le taux d'inflation restant élevé, nous devons négocier avec nos fournisseurs.", "Une fois les contrats signés, nous pourrons baisser nos prix.", "Objectif : retrouver la croissance malgré la concurrence."]
        en: ["As the inflation rate is still high, we must negotiate with our suppliers.", "Once the contracts are signed, we'll be able to lower our prices.", "Aim: get back to growth despite the competition."]
        grammar: [g.participe-present, g.participial-clauses]
