# Words treated as known at every level (function words, particles, numbers, the commonest
# measure words), and proper nouns / place names that may appear in any text. Used by the
# content checker and the journey test. Cantonese has no capital letters, so every proper
# noun that appears in course text must be listed under `names`.
always: [
  # copula, existence, location, negation
  係, 喺, 有, 冇, 唔, 唔係, 唔好, 未, 都係, 就係,
  # pronouns
  我, 你, 佢, 我哋, 你哋, 佢哋, 哋, 自己,
  # structural particles and aspect markers
  嘅, 咗, 緊, 過, 住, 吓, 啲, 得,
  # sentence-final particles
  呀, 啊, 啦, 喇, 嘞, 嗎, 呢, 咩, 吖, 喎, 囉, 㗎, 咋, 啫, 嘛, 噃, 㖭, 啩,
  # adverbs and connectors
  都, 就, 仲, 又, 再, 先, 好, 太, 最, 同, 同埋, 定, 定係, 或者, 但係, 不過, 因為, 所以, 如果, 而家, 已經,
  # demonstratives and question words
  嗰, 呢個, 嗰個, 呢度, 嗰度, 喺度, 呢啲, 嗰啲, 邊, 邊個, 邊度, 乜嘢, 咩嘢, 點, 點樣, 點解, 幾, 幾多, 幾時,
  # quantities and numbers
  好多, 少少, 一啲, 每, 第, 零, 一, 二, 兩, 三, 四, 五, 六, 七, 八, 九, 十, 百, 千, 萬, 億,
  # the commonest measure words
  個, 一個, 隻, 間, 條, 張, 本, 架, 位, 件,
  # politeness
  唔該, 多謝, 對唔住, 仲有
  ]
