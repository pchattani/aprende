id: b1.u12
title: Ser, estar y perífrasis
lessons:
  - id: b1.u12.l1
    title: ¿Es listo o está listo?
    teach: [g.ser-estar-advanced]
    vocab: [w.despierto, w.maduro, w.soso, w.atento, w.abierto, w.cerrado, w.callado, w.vivo, w.muerto, w.interesado, w.molesto, w.fresco, w.delicado, w.consciente, w.libre, w.sabor, w.caducado, w.moda, w.de-moda]
    tip: "ser + adjective = what something is like; estar + adjective = a state or result: es listo (clever) / está listo (ready), es aburrido (boring) / está aburrido (bored), es rico (rich) / está rico (tasty)."
    sentences:
      - { es: "Mi hija es muy lista para su edad, pero por las mañanas nunca está lista a tiempo.", en: "My daughter is very clever for her age, but in the mornings she's never ready on time.", grammar: [g.ser-estar-advanced], vocab: [w.listo, w.edad, w.a-tiempo] }
      - { es: "Mis tíos son ricos, pero su comida nunca está rica: todo está soso, hasta el pescado fresco.", en: "My aunt and uncle are rich, but their food is never tasty: everything is bland, even the fresh fish.", grammar: [g.ser-estar-advanced], vocab: [w.rico, w.soso, w.comida, w.fresco, w.pescado] }
      - { es: "Los plátanos todavía están verdes; cómpralos maduros.", en: "The bananas are still unripe; buy them ripe.", grammar: [g.ser-estar-advanced, g.imperative-tu], vocab: [w.verde, w.maduro, w.platano], note: "está verde = unripe (or inexperienced); es verde = green in colour." }
      - { es: "Carlos es muy orgulloso y nunca pide ayuda; hoy, en cambio, está orgulloso de su hija.", en: "Carlos is very proud (arrogant) and never asks for help; today, however, he's proud of his daughter.", grammar: [g.ser-estar-advanced, g.connectors-contrast], vocab: [w.orgulloso, w.ayuda, w.en-cambio, w.hija] }
      - { es: "Es un niño muy despierto; a las seis ya está despierto y haciendo preguntas.", en: "He's a very bright child; at six he's already awake and asking questions.", grammar: [g.ser-estar-advanced], vocab: [w.despierto, w.nino, w.pregunta] }
      - { es: "Mi abuelo es un hombre muy callado, pero hoy está más callado que nunca; algo le pasa.", en: "My grandfather is a very quiet man, but today he's quieter than ever; something's wrong with him.", grammar: [g.ser-estar-advanced, g.comparatives], vocab: [w.callado, w.abuelo, w.hombre, w.pasar] }
      - { es: "Esta leche está caducada: mira la fecha; además, tiene un sabor raro.", en: "This milk is past its date: look at the date; besides, it has an odd taste.", grammar: [g.ser-estar-advanced], vocab: [w.caducado, w.leche, w.fecha, w.sabor, w.raro] }
      - { es: "La música de los ochenta vuelve a estar de moda.", en: "Eighties music is in fashion again.", grammar: [g.ser-estar-advanced, g.volver-a], vocab: [w.de-moda, w.moda, w.musica, w.volver-a] }
      - { es: "Mis padres son muy abiertos: puedo hablar con ellos de todo. Mi tío, en cambio, es bastante cerrado.", en: "My parents are very open-minded: I can talk to them about everything. My uncle, on the other hand, is rather reserved.", grammar: [g.ser-estar-advanced], vocab: [w.abierto, w.cerrado, w.padres, w.hablar, w.tio] }
      - { es: "Después del accidente el perro estaba vivo, pero muy delicado; el gato, por desgracia, estaba muerto.", en: "After the accident the dog was alive, but very frail; the cat, unfortunately, was dead.", grammar: [g.ser-estar-advanced, g.imperfect], vocab: [w.vivo, w.delicado, w.muerto, w.accidente, w.perro, w.gato], note: "por desgracia = unfortunately." }
      - { es: "Es un vecino muy molesto: pone la música alta a las dos de la mañana y, claro, estoy molesta con él.", en: "He's a very annoying neighbour: he plays loud music at two in the morning and, of course, I'm annoyed with him.", grammar: [g.ser-estar-advanced], vocab: [w.molesto, w.vecino, w.musica, w.alto] }
      - { es: "No es consciente del problema; se lo hemos explicado tres veces.", en: "He isn't aware of the problem; we've explained it to him three times.", grammar: [g.ser-estar-advanced, g.double-object-pronouns], vocab: [w.consciente, w.problema, w.explicar, w.vez] }
      - { es: "Estoy interesada en el puesto, pero no soy una persona interesada: no lo hago por dinero.", en: "I'm interested in the job, but I'm not a self-interested person: I'm not doing it for the money.", grammar: [g.ser-estar-advanced], vocab: [w.interesado, w.puesto, w.persona, w.dinero] }
      - { es: "Mi hermana es muy atenta: siempre está atenta a lo que necesitan los demás.", en: "My sister is very thoughtful: she's always attentive to what other people need.", grammar: [g.ser-estar-advanced], vocab: [w.atento, w.hermana, w.necesitar], note: "los demás = the others, other people." }
      - { es: "Estoy aburrido porque no tengo nada que hacer.", en: "I'm bored because I have nothing to do.", grammar: [g.ser-estar-advanced], vocab: [w.aburrido, w.nada, w.hacer], error: { wrong: "Soy aburrido porque no tengo nada que hacer.", explain: "soy aburrido = I am boring; the state of being bored takes estar: estoy aburrido.", grammar: g.ser-estar-advanced } }
      - { es: "Juan es muy listo.", en: "Juan is very clever.", grammar: [g.ser-estar-advanced], vocab: [w.listo], transform: { instruction: "Change the meaning to 'ready'", answer: "Juan está listo.", alt: ["Juan ya está listo."] } }
  - id: b1.u12.l2
    title: Eventos, estados y precios
    teach: [g.ser-estar-advanced]
    vocab: [w.evento, w.ceremonia, w.inauguracion, w.celebracion, w.prohibido, w.disponible, w.pendiente, w.de-pie, w.humor, w.de-buen-humor, w.de-mal-humor, w.temporal, w.en-obras, w.sustituir, w.baja, w.de-baja, w.encargado, w.averiado, w.reparar, w.en-marcha, w.de-vacaciones, w.de-viaje]
    tip: "ser for events (La reunión es a las diez), estar for location and states; ser + participle = action, estar + participle = result; estar for prices, dates, temporary jobs and estar de + noun."
    sentences:
      - { es: "La inauguración del museo es el sábado a las siete; la ceremonia será en el jardín y el evento terminará con un concierto.", en: "The opening of the museum is on Saturday at seven; the ceremony will be in the garden and the event will end with a concert.", grammar: [g.ser-estar-advanced, g.future-simple], vocab: [w.inauguracion, w.museo, w.ceremonia, w.jardin, w.evento, w.concierto] }
      - { es: "La tienda fue cerrada por la policía y sigue cerrada.", en: "The shop was closed by the police and is still closed.", grammar: [g.ser-estar-advanced, g.passive-ser], vocab: [w.tienda, w.cerrar, w.policia, w.seguir] }
      - { es: "La lavadora está averiada otra vez; la nevera ya está reparada, pero esto es demasiado.", en: "The washing machine has broken down again; the fridge is already repaired, but this is too much.", grammar: [g.ser-estar-advanced], vocab: [w.averiado, w.lavadora, w.reparar, w.nevera, w.demasiado] }
      - { es: "Está prohibido fumar en el patio; lo prohibió la directora el año pasado.", en: "Smoking is forbidden in the courtyard; the headmistress banned it last year.", grammar: [g.ser-estar-advanced, g.preterite-regular], vocab: [w.prohibido, w.prohibir, w.fumar, w.director] }
      - { es: "Los tomates están a dos euros hoy; en invierno son mucho más caros.", en: "Tomatoes are two euros today; in winter they're much more expensive.", grammar: [g.ser-estar-advanced], vocab: [w.tomate, w.euro, w.invierno, w.caro], note: "estar a + price for prices that change." }
      - { es: "Mi primo es ingeniero, pero este verano está de camarero en la playa.", en: "My cousin is an engineer, but this summer he's working as a waiter at the beach.", grammar: [g.ser-estar-advanced], vocab: [w.primo, w.ingeniero, w.camarero, w.playa], note: "estar de + job = to be working temporarily as." }
      - { es: "La encargada está de baja, así que voy a sustituirla esta semana; es algo temporal.", en: "The manager is on sick leave, so I'm going to stand in for her this week; it's something temporary.", grammar: [g.ser-estar-advanced], vocab: [w.encargado, w.de-baja, w.baja, w.sustituir, w.temporal] }
      - { es: "El jefe está de muy buen humor: le han dado el ascenso.", en: "The boss is in a very good mood: they've given him the promotion.", grammar: [g.ser-estar-advanced, g.present-perfect], vocab: [w.de-buen-humor, w.humor, w.jefe, w.ascenso] }
      - { es: "Hoy estoy de mal humor porque el metro está en obras y he tardado una hora.", en: "Today I'm in a bad mood because the metro is under construction and it took me an hour.", grammar: [g.ser-estar-advanced], vocab: [w.de-mal-humor, w.metro, w.en-obras, w.tardar] }
      - { es: "El tren no sale por una avería y llevamos media hora de pie.", en: "The train isn't leaving because of a breakdown and we've been standing for half an hour.", grammar: [g.ser-estar-advanced, g.verbal-periphrases], vocab: [w.averia, w.de-pie, w.tren, w.media] }
      - { es: "La mesa está reservada, pero el camarero no está disponible ahora.", en: "The table is reserved, but the waiter isn't available right now.", grammar: [g.ser-estar-advanced], vocab: [w.reservar, w.camarero, w.disponible] }
      - { es: "Todavía hay dos facturas pendientes; ¿está pagada la de la luz?", en: "There are still two outstanding invoices; is the electricity one paid?", grammar: [g.ser-estar-advanced], vocab: [w.pendiente, w.factura, w.pagar, w.luz] }
      - { es: "La celebración de la boda es en un castillo, y los novios están nerviosísimos.", en: "The wedding celebration is in a castle, and the bride and groom are extremely nervous.", grammar: [g.ser-estar-advanced], vocab: [w.celebracion, w.boda, w.castillo, w.novio, w.nervioso] }
      - { es: "Estamos de vacaciones hasta el lunes; mi jefa, en cambio, está de viaje de trabajo y el proyecto sigue en marcha.", en: "We're on holiday until Monday; my boss, on the other hand, is away on a business trip and the project is still under way.", grammar: [g.ser-estar-advanced, g.connectors-contrast], vocab: [w.de-vacaciones, w.de-viaje, w.en-marcha, w.jefe, w.proyecto] }
      - { es: "La reunión es a las diez en el salón.", en: "The meeting is at ten in the lounge.", grammar: [g.ser-estar-advanced], vocab: [w.reunion, w.salon], error: { wrong: "La reunión está a las diez en el salón.", explain: "Events (meetings, parties, concerts) take ser for time and place: la reunión es a las diez.", grammar: g.ser-estar-advanced } }
      - { es: "El ayuntamiento cerró el parque.", en: "The council closed the park.", grammar: [g.ser-estar-advanced], vocab: [w.parque, w.cerrar, w.ayuntamiento], transform: { instruction: "Give the resulting state with estar + participle", answer: "El parque está cerrado.", alt: ["Ahora el parque está cerrado."] } }
  - id: b1.u12.l3
    title: Perífrasis verbales
    teach: [g.verbal-periphrases]
    vocab: [w.ponerse-a, w.llevar-gerundio, w.continuar, w.estar-a-punto-de, w.ir-gerundio, w.andar-gerundio, w.haber-de, w.comenzar, w.poco-a-poco, w.de-nuevo, w.cada-vez-mas, w.habito, w.rutina, w.trasnochar, w.entrenar, w.entrenamiento, w.progreso, w.tonteria, w.reto, w.superar, w.constancia, w.motivacion, w.pereza]
    tip: "ponerse a (start suddenly), llevar + time + gerund (have been doing), seguir / continuar + gerund (keep on), ir + gerund (gradually), estar a punto de (be about to), dejar de (stop), volver a (again)."
    sentences:
      - { es: "Llevo tres meses entrenando para la maratón y poco a poco voy mejorando.", en: "I've been training for the marathon for three months and little by little I'm improving.", grammar: [g.verbal-periphrases], vocab: [w.llevar-gerundio, w.entrenar, w.maraton, w.poco-a-poco, w.ir-gerundio, w.mejorar] }
      - { es: "Cuando oyó la noticia, se puso a llorar.", en: "When she heard the news, she started to cry.", grammar: [g.verbal-periphrases, g.preterite-irregular], vocab: [w.ponerse-a, w.oir, w.noticia, w.llorar] }
      - { es: "Estaba a punto de salir cuando llamaron a la puerta.", en: "I was about to leave when someone knocked on the door.", grammar: [g.verbal-periphrases, g.preterite-vs-imperfect], vocab: [w.estar-a-punto-de, w.salir, w.llamar, w.puerta] }
      - { es: "Mi abuelo sigue madrugando a los ochenta años; es un hábito de toda la vida.", en: "My grandfather still gets up early at eighty; it's a lifelong habit.", grammar: [g.verbal-periphrases], vocab: [w.seguir-gerundio, w.madrugar, w.habito, w.vida, w.abuelo] }
      - { es: "Deja de trasnochar y empieza a dormir ocho horas; tu rutina no es sana.", en: "Stop staying up late and start sleeping eight hours; your routine isn't healthy.", grammar: [g.verbal-periphrases, g.imperative-tu], vocab: [w.dejar-de, w.trasnochar, w.empezar, w.dormir, w.rutina, w.sano] }
      - { es: "Cada vez más gente trabaja desde casa y continúa haciéndolo aunque las oficinas ya han abierto.", en: "More and more people work from home and continue doing so even though offices have reopened.", grammar: [g.verbal-periphrases, g.connectors-contrast], vocab: [w.cada-vez-mas, w.gente, w.continuar, w.oficina, w.aunque, w.abrir] }
      - { es: "Volvieron a perder el partido, pero, con el entrenamiento, el equipo va jugando mejor cada semana.", en: "They lost the match again, but, with training, the team is playing better every week.", grammar: [g.verbal-periphrases, g.volver-a], vocab: [w.volver-a, w.perder, w.partido, w.entrenamiento, w.ir-gerundio, w.equipo] }
      - { es: "Acabo de terminar el informe y he de enviarlo antes de las cinco.", en: "I've just finished the report and I have to send it before five.", grammar: [g.verbal-periphrases, g.acabar-de], vocab: [w.acabar-de, w.terminar, w.informe, w.haber-de, w.enviar] }
      - { es: "No te rindas: con esfuerzo y constancia superarás este reto.", en: "Don't give up: with effort and perseverance you'll overcome this challenge.", grammar: [g.verbal-periphrases, g.imperative-negative, g.future-simple], vocab: [w.rendirse, w.esfuerzo, w.constancia, w.superar, w.reto] }
      - { es: "Mi vecino anda diciendo tonterías sobre nosotros por todo el barrio.", en: "My neighbour goes around talking nonsense about us all over the neighbourhood.", grammar: [g.verbal-periphrases], vocab: [w.andar-gerundio, w.tonteria, w.vecino, w.barrio] }
      - { es: "Comenzó a llover de nuevo a mitad del partido.", en: "It started raining again halfway through the match.", grammar: [g.verbal-periphrases, g.preterite-regular], vocab: [w.comenzar, w.llover, w.de-nuevo, w.a-mitad-de, w.partido] }
      - { es: "Se esfuerza mucho en clase y su progreso es evidente; le falta motivación, no capacidad.", en: "He tries very hard in class and his progress is evident; what he lacks is motivation, not ability.", grammar: [g.verbal-periphrases], vocab: [w.esforzarse, w.clase, w.progreso, w.evidente, w.motivacion], note: "faltar works like gustar: le falta motivación = he lacks motivation; capacidad = ability." }
      - { es: "Llevamos dos horas esperando y el médico todavía no ha llegado.", en: "We've been waiting for two hours and the doctor still hasn't arrived.", grammar: [g.verbal-periphrases, g.present-perfect], vocab: [w.llevar-gerundio, w.esperar, w.medico, w.todavia] }
      - { es: "Me da pereza ir al gimnasio, pero suelo ir tres veces por semana.", en: "I can't be bothered to go to the gym, but I usually go three times a week.", grammar: [g.verbal-periphrases], vocab: [w.pereza, w.gimnasio, w.soler, w.vez], note: "me da pereza = I can't be bothered." }
      - { es: "Llevo dos años viviendo en Valencia.", en: "I've been living in Valencia for two years.", grammar: [g.verbal-periphrases], vocab: [w.llevar-gerundio, w.vivir, w.ano], error: { wrong: "Llevo dos años vivir en Valencia.", explain: "llevar + time + gerund: viviendo, not the infinitive.", grammar: g.verbal-periphrases } }
      - { es: "Empezó a gritar de repente.", en: "He suddenly started shouting.", grammar: [g.verbal-periphrases], vocab: [w.ponerse-a, w.gritar, w.de-repente, w.empezar], transform: { instruction: "Use ponerse a", answer: "Se puso a gritar de repente.", alt: ["De repente se puso a gritar."] } }
  - id: b1.u12.l4
    title: Repaso B1 — en el trabajo
    teach: [g.b1-review]
    vocab: [w.repaso, w.resumen, w.contratar, w.despedir, w.empleado, w.anuncio, w.sorprendente, w.ambiente, w.horas-extra, w.nomina, w.puntual, w.eficaz, w.colaborar, w.lider, w.mejora]
    tip: "Subjunctive after wish, emotion, judgement, doubt, purpose, future time and unknown antecedents; indicative for facts. Pluperfect for the earlier past, reported speech shifts tenses, se for impersonal and accidental events."
    sentences:
      - { es: "La empresa quiere que todos los empleados firmen el nuevo contrato antes del viernes.", en: "The company wants all employees to sign the new contract before Friday.", grammar: [g.b1-review, g.subjunctive-wishes], vocab: [w.empresa, w.empleado, w.firmar, w.contrato, w.viernes] }
      - { es: "Me alegro de que te hayan contratado; el ambiente en esa oficina es estupendo.", en: "I'm glad they've hired you; the atmosphere in that office is wonderful.", grammar: [g.b1-review, g.subjunctive-emotion], vocab: [w.alegrarse, w.contratar, w.ambiente, w.oficina, w.estupendo], note: "hayan contratado is the perfect subjunctive: haya + participle." }
      - { es: "No creo que despidan a nadie este año, aunque la crisis es grave.", en: "I don't think they'll fire anyone this year, even though the crisis is serious.", grammar: [g.b1-review, g.creer-no-creer, g.connectors-contrast], vocab: [w.creer, w.despedir, w.crisis, w.aunque, w.grave] }
      - { es: "Cuando nos reunamos el lunes, hablaremos del aumento de sueldo y de las horas extra.", en: "When we meet on Monday, we'll talk about the pay rise and the overtime.", grammar: [g.b1-review, g.subjunctive-time-clauses], vocab: [w.reunirse, w.aumento, w.sueldo, w.horas-extra, w.lunes] }
      - { es: "El jefe exige que seamos puntuales y que cumplamos los plazos.", en: "The boss demands that we be punctual and that we meet the deadlines.", grammar: [g.b1-review, g.indirect-commands], vocab: [w.exigir, w.puntual, w.cumplir, w.plazo, w.jefe] }
      - { es: "Busco un empleo que me permita trabajar desde casa dos días a la semana.", en: "I'm looking for a job that lets me work from home two days a week.", grammar: [g.b1-review, g.relative-subjunctive], vocab: [w.empleo, w.permitir, w.trabajar, w.casa, w.semana] }
      - { es: "Cuando llegué a la reunión, ya habían anunciado las mejoras del horario.", en: "When I arrived at the meeting, they had already announced the improvements to the timetable.", grammar: [g.b1-review, g.pluperfect], vocab: [w.reunion, w.anunciar, w.mejora, w.horario, w.llegar] }
      - { es: "La encargada dijo que publicarían el anuncio del nuevo puesto esa misma semana.", en: "The manager said they would publish the advert for the new post that same week.", grammar: [g.b1-review, g.reported-speech-past], vocab: [w.encargado, w.publicar, w.anuncio, w.puesto, w.mismo] }
      - { es: "Me preguntó si había trabajado antes con jornada completa y si sabía leer una nómina.", en: "She asked me whether I had worked full-time before and whether I knew how to read a payslip.", grammar: [g.b1-review, g.reported-questions, g.pluperfect], vocab: [w.preguntar, w.trabajar, w.jornada, w.nomina, w.saber] }
      - { es: "Se buscan personas responsables y eficaces; se exige experiencia.", en: "Responsible, efficient people are wanted; experience is required.", grammar: [g.b1-review, g.se-passive], vocab: [w.buscar, w.persona, w.responsable, w.eficaz, w.exigir, w.experiencia] }
      - { es: "Se me olvidó el resumen de la reunión en casa; qué cabeza tengo.", en: "I left the summary of the meeting at home; what a memory I have.", grammar: [g.b1-review, g.se-accidental], vocab: [w.olvidar, w.resumen, w.reunion, w.cabeza] }
      - { es: "Es sorprendente que nadie se haya quejado del nuevo horario.", en: "It's surprising that nobody has complained about the new timetable.", grammar: [g.b1-review, g.subjunctive-impersonal], vocab: [w.sorprendente, w.quejarse, w.horario, w.nadie] }
      - { es: "Estás equivocado: el contrato no termina en junio, sino en julio.", en: "You're wrong: the contract doesn't end in June, but in July.", grammar: [g.b1-review, g.connectors-contrast], vocab: [w.equivocado, w.contrato, w.terminar, w.junio, w.julio, w.sino] }
      - { es: "Hoy hacemos un repaso para que nadie llegue perdido al examen; la líder del grupo nos ayuda a colaborar.", en: "Today we're doing a review so that nobody arrives at the exam lost; the group leader helps us to work together.", grammar: [g.b1-review, g.subjunctive-purpose], vocab: [w.repaso, w.perder, w.examen, w.lider, w.colaborar] }
      - { es: "Quiero que vengas a la reunión de mañana.", en: "I want you to come to tomorrow's meeting.", grammar: [g.b1-review, g.subjunctive-wishes], vocab: [w.querer, w.venir, w.reunion], error: { wrong: "Quiero que vienes a la reunión de mañana.", explain: "querer que + subjunctive: vengas, not vienes.", grammar: g.subjunctive-wishes } }
      - { es: "El director dijo: «Mañana firmaremos el contrato».", en: "The director said: 'Tomorrow we will sign the contract.'", grammar: [g.b1-review, g.reported-speech-past], vocab: [w.director, w.firmar, w.contrato], transform: { instruction: "Report it in the past (El director dijo que…)", answer: "El director dijo que al día siguiente firmarían el contrato.", alt: ["El director dijo que firmarían el contrato al día siguiente.", "El director dijo que mañana firmarían el contrato."] } }
dialogues:
  - id: b1.u12.d1
    title: Un lunes en la oficina
    context: Elena arrives at work on Monday and talks with her colleague Rubén about the week ahead.
    lines:
      - { speaker: Rubén, es: "Buenos días, Elena. ¿Ya estás lista para la reunión? Es a las nueve y media.", en: "Good morning, Elena. Are you ready for the meeting yet? It's at half past nine." }
      - { speaker: Elena, es: "Casi. Llevo media hora intentando abrir el informe, pero el ordenador está averiado otra vez.", en: "Almost. I've been trying to open the report for half an hour, but the computer is broken again." }
      - { speaker: Rubén, es: "Qué raro, lo repararon la semana pasada. Yo que tú llamaría a Marcos, el encargado de informática.", en: "How odd, they repaired it last week. If I were you I'd call Marcos, the IT manager." }
      - { speaker: Elena, es: "Marcos está de baja desde el jueves. Lo sustituye una chica nueva que es muy lista, pero todavía está muy verde.", en: "Marcos has been on sick leave since Thursday. A new girl is standing in for him; she's very clever, but she's still very green." }
      - { speaker: Rubén, es: "Bueno, poco a poco irá aprendiendo. ¿Y qué tal el jefe? Ayer estaba de muy mal humor.", en: "Well, little by little she'll learn. And how's the boss? Yesterday he was in a very bad mood." }
      - { speaker: Elena, es: "Hoy está de buen humor: acaban de confirmarle que el proyecto sigue en marcha.", en: "Today he's in a good mood: they've just confirmed to him that the project is still under way." }
      - { speaker: Rubén, es: "Menos mal. Estaba a punto de dejar de venir los lunes.", en: "Thank goodness. I was about to stop coming in on Mondays." }
      - { speaker: Elena, es: "No digas tonterías. Oye, ¿tú sabes si la cafetería está abierta? La semana pasada estaba en obras.", en: "Don't talk nonsense. Hey, do you know if the cafeteria is open? Last week it was being renovated." }
      - { speaker: Rubén, es: "Ya está abierta, y el café está mucho más rico que antes.", en: "It's open now, and the coffee is much tastier than before." }
      - { speaker: Elena, es: "Pues vamos antes de la reunión. Si no tomo un café, no soy persona.", en: "Then let's go before the meeting. If I don't have a coffee, I'm not human." }
