id: r.b1.spring-cleaning
level: b1
title: 年廿八，洗邋遢
kind: text
intro: A few days before Chinese New Year, Ah Si's family in Tuen Mun does the traditional big clean. Her mother gives the orders, her father loses things, and Ah Si finds a surprise at the back of a wardrobe.
allow: [阿詩]
paragraphs:
  - { es: "香港人有句老說話：「年廿八，洗邋遢。」意思係農曆新年之前，要將屋企由頭到尾執乾淨，將舊年啲衰運都清走，咁新一年先會有好運。所以每年年廿八，我哋一家人都會喺屋企大掃除。", en: "Hongkongers have an old saying: \"On the 28th of the twelfth month, wash away the dirt.\" It means that before Chinese New Year you have to clean the whole home from top to bottom, sweeping away the old year's bad luck, so that the new year brings good luck. So every year on the 28th, my family does a big clean at home." }
  - { es: "今年都唔例外。朝早九點，媽媽已經企喺客廳中間，好似將軍噉分工：「爸爸負責抹窗同洗廚房，阿詩負責執你間房同書架，細佬負責倒垃圾同吸塵。我就洗廁所同雪櫃。十二點之前做完，先有飯食！」", en: "This year was no exception. At nine in the morning, Mum was already standing in the middle of the living room, handing out jobs like a general: \"Dad, you clean the windows and the kitchen. Ah Si, you tidy your room and the bookshelves. Little brother, you take out the rubbish and do the vacuuming. I'll do the toilet and the fridge. Nobody eats until it's all done by twelve!\"" }
  - { es: "我先將衣櫃入面啲衫全部拎出嚟，攤晒喺張床度。有好多衫我已經兩三年冇着過，有啲仲細到着唔落。我將啲舊衫摺好，放入一個紙皮箱，準備捐畀慈善機構。跟住我將書架上面啲書一本一本攞落嚟，抹乾淨啲塵，再擺返好。", en: "First I took all the clothes out of my wardrobe and spread them out on the bed. There were lots of clothes I hadn't worn for two or three years, and some were too small to get into any more. I folded the old clothes and put them in a cardboard box to give to a charity. Then I took the books down from the shelves one by one, wiped off the dust and put them back neatly." }
  - { es: "喺衣櫃最入面，我搵到一個好舊嘅鐵罐。打開一睇，入面有一疊信同幾張相，原來係我細個嗰陣寫畀嫲嫲嘅生日卡！嫲嫲幾年前過咗身，我以為呢啲卡早就唔見咗，點知媽媽一直幫我收埋。我坐喺地下睇咗好耐，差啲唔記得自己仲未執完。", en: "At the very back of the wardrobe I found an old tin. When I opened it, inside there was a bundle of letters and a few photos. They were the birthday cards I'd written to Grandma when I was little! Grandma passed away a few years ago, and I thought these cards had been lost long ago, but it turned out Mum had been keeping them for me all along. I sat on the floor looking at them for ages, and almost forgot I hadn't finished tidying." }
  - { es: "另一邊，爸爸就搞到成間屋都亂晒。佢將廚房所有煲同鑊都攞晒出嚟洗，但係洗完之後唔記得原本放喺邊，最後要媽媽一樣一樣擺返好。佢又將把鉸剪放低咗喺窗台，之後搵咗半個鐘都搵唔到，最後喺自己褲袋度搵返。", en: "Meanwhile, Dad was turning the whole flat into a mess. He took all the pots and woks out of the kitchen to wash, but afterwards he forgot where they had been, and in the end Mum had to put them back one by one. He also put the scissors down on the windowsill, then spent half an hour looking for them, and finally found them in his own trouser pocket." }
  - { es: "細佬就最開心。佢將一袋袋垃圾拎落樓下嘅垃圾房，每次都順便喺樓下買啲嘢食。佢一共落咗六次樓，食咗兩包薯片、一支汽水同一個雞蛋仔。媽媽問佢點解去咗咁耐，佢話：「排隊倒垃圾呀，年廿八個個都喺度大掃除嘛。」", en: "My little brother was the happiest. He carried bag after bag of rubbish down to the refuse room, and each time he bought a snack downstairs while he was there. He went down six times in total and ate two packets of crisps, a can of soda and an egg waffle. When Mum asked why he'd been gone so long, he said: \"Queuing to throw out the rubbish! On the 28th everyone's cleaning, you know.\"" }
  - { es: "到咗一點半，我哋終於執完。成間屋乾乾淨淨，窗光到好似冇玻璃噉。媽媽將揮春貼喺門口，又將一盆桃花擺喺客廳。我將嫲嫲啲生日卡放咗喺床頭，等佢都可以同我哋一齊過年。", en: "By half past one we had finally finished. The whole flat was spotless, and the windows were so shiny it was as if there was no glass. Mum stuck the New Year couplets on the door and put a pot of peach blossom in the living room. I put Grandma's birthday cards by my bed, so that she could celebrate New Year with us too." }
  - { es: "雖然大掃除好攰，但係我覺得呢個習俗好有意思。執屋唔單止令屋企乾淨，仲令我諗返好多以前嘅事。年初一嗰朝，媽媽話：「今年一定好運，因為我哋將啲衰嘢全部掃走咗！」", en: "Although the big clean is exhausting, I think it's a really meaningful custom. Tidying doesn't just make your home clean; it also brings back lots of memories. On the morning of New Year's Day, Mum said: \"This year will definitely be lucky, because we've swept all the bad stuff away!\"" }
questions:
  - { q: "「年廿八，洗邋遢」係乜嘢意思？", options: ["新年之前要大掃除", "年廿八要沖涼", "新年唔可以洗衫"], answer: 0, explain: "將屋企由頭到尾執乾淨，將舊年啲衰運都清走 before New Year." }
  - { q: "媽媽叫阿詩負責做乜嘢？", options: ["抹窗同洗廚房", "執佢間房同書架", "倒垃圾同吸塵"], answer: 1, explain: "阿詩負責執你間房同書架. Dad has the windows and kitchen; the brother the rubbish and vacuuming." }
  - { q: "阿詩將啲舊衫點樣處理？", options: ["掉咗佢", "捐畀慈善機構", "畀細佬着"], answer: 1, explain: "放入一個紙皮箱，準備捐畀慈善機構." }
  - { q: "阿詩喺鐵罐入面搵到乜嘢？", options: ["錢", "佢寫畀嫲嫲嘅生日卡", "利是"], answer: 1, explain: "原來係我細個嗰陣寫畀嫲嫲嘅生日卡." }
  - { q: "爸爸最後喺邊度搵返把鉸剪？", options: ["窗台", "廚房", "自己褲袋"], answer: 2, explain: "最後喺自己褲袋度搵返. He had left them on the windowsill earlier." }
  - { q: "點解細佬去咗咁耐？", options: ["佢每次都順便買嘢食", "佢迷咗路", "部升降機壞咗"], answer: 0, explain: "每次都順便喺樓下買啲嘢食; his excuse was queuing to throw out the rubbish." }
