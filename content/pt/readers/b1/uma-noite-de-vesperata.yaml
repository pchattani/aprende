id: r.b1.uma-noite-de-vesperata
level: b1
title: Uma noite de Vesperata
kind: dialogue
intro: Valéria and her friends are spending a weekend in Diamantina, the old diamond town in northern Minas. They want to see the Vesperata, an open-air concert played from the balconies. Watch the personal infinitive at work.
allow: [valéria, iara, guilherme, diamantina, vesperata, quitanda, jk, juscelino, kubitschek, chica, silva, ok]
paragraphs:
  - { es: "Era sábado, cinco horas da tarde, e as três amigas estavam no quarto da pousada, em Diamantina. Valéria lia o folheto do evento em voz alta, enquanto a Iara secava o cabelo e a Heloísa procurava o casaco na mala.", en: "It was Saturday, five in the afternoon, and the three friends were in their guesthouse room in Diamantina. Valéria was reading the event leaflet aloud, while Iara dried her hair and Heloísa looked for her coat in her suitcase." }
  - { es: "— Escutem isso: «A Vesperata começa às oito e meia, na Rua da Quitanda. Os músicos tocam das sacadas dos casarões, e o maestro rege da rua.» Gente, é hoje! Para a gente conseguir um bom lugar, temos que sair daqui às sete, no máximo.", en: "'Listen to this: The Vesperata starts at half past eight, on Rua da Quitanda. The musicians play from the balconies of the old mansions, and the conductor conducts from the street. Guys, it's tonight! For us to get a good spot, we have to leave here at seven at the latest.'" }
  - { es: "— Às sete? Mas o concerto só começa às oito e meia! — reclamou a Iara.", en: "'At seven? But the concert only starts at half past eight!' Iara complained." }
  - { es: "— Exatamente. A dona da pousada disse que as mesas da rua acabam cedo. É melhor nós chegarmos antes de os ônibus de turistas chegarem.", en: "'Exactly. The guesthouse owner said the tables in the street run out early. It's better for us to get there before the tourist coaches arrive.'" }
  - { es: "— E se a gente comprasse as mesas agora, pelo telefone?", en: "'And what if we booked tables now, by phone?'" }
  - { es: "— Já tentei hoje de manhã. Estão esgotadas. Mas ela disse que, se ficarmos de pé perto da igreja, dá para ver tudo. O som é bom em qualquer lugar.", en: "'I already tried this morning. They're sold out. But she said that if we stand near the church, we can see everything. The sound is good anywhere.'" }
  - { es: "A Heloísa finalmente achou o casaco.", en: "Heloísa finally found her coat." }
  - { es: "— Ainda bem que eu trouxe isso. A dona da pousada também falou para levarmos agasalho, porque aqui em cima faz frio à noite. Diamantina fica a mais de mil metros de altitude.", en: "'Good thing I brought this. The guesthouse owner also told us to bring warm clothes, because up here it gets cold at night. Diamantina is more than a thousand metres above sea level.'" }
  - { es: "— Então vamos fazer assim — disse a Valéria. — Antes de sairmos, a gente come alguma coisa aqui perto, para não termos que procurar restaurante depois. Todo mundo de acordo?", en: "'So let's do this,' said Valéria. 'Before we go out, we'll eat something nearby, so we don't have to look for a restaurant afterwards. Everyone agreed?'" }
  - { es: "— De acordo! — responderam as duas.", en: "'Agreed!' the other two answered." }
  - { es: "Às sete e quinze, elas já estavam na Rua da Quitanda. A rua de pedra estava iluminada por luzes amarelas, e as sacadas dos casarões coloniais estavam enfeitadas com flores. Elas encontraram um lugar perto da igreja, ao lado de um senhor simpático chamado Guilherme.", en: "At a quarter past seven they were already on Rua da Quitanda. The stone street was lit with yellow lights, and the balconies of the colonial mansions were decorated with flowers. They found a spot near the church, next to a friendly man called Guilherme." }
  - { es: "— Primeira vez? — perguntou ele. — Eu moro aqui e venho todo ano. Sabiam que Diamantina é a cidade do Juscelino Kubitschek, o presidente que construiu Brasília? Ele nasceu numa casa aqui perto. E a música sempre foi muito forte por aqui. No século dezoito, com o dinheiro dos diamantes, a cidade tinha mais músicos do que muitas capitais da Europa.", en: "'First time?' he asked. 'I live here and come every year. Did you know Diamantina is the town of Juscelino Kubitschek, the president who built Brasília? He was born in a house near here. And music has always been very strong around here. In the eighteenth century, with the money from diamonds, the town had more musicians than many European capitals.'" }
  - { es: "Às oito e meia em ponto, as luzes da rua se apagaram. O maestro subiu num pequeno palco no meio da rua e levantou os braços. Das sacadas, dezenas de músicos começaram a tocar ao mesmo tempo: trompetes, clarinetes, tambores. A música parecia vir do céu.", en: "At half past eight on the dot, the street lights went out. The conductor stepped onto a small stage in the middle of the street and raised his arms. From the balconies, dozens of musicians started playing at the same time: trumpets, clarinets, drums. The music seemed to come from the sky." }
  - { es: "— É lindo demais — sussurrou a Iara. — Desculpa ter reclamado, Valéria. Valeu a pena chegarmos cedo.", en: "'It's so beautiful,' Iara whispered. 'Sorry for complaining, Valéria. It was worth getting here early.'" }
  - { es: "— Eu sei — respondeu a amiga, sorrindo. — Agora fica quieta, para a gente ouvir.", en: "'I know,' her friend replied, smiling. 'Now be quiet, so we can listen.'" }
questions:
  - { q: "Onde os músicos tocam na Vesperata?", options: ["Num teatro", "Nas sacadas dos casarões", "Dentro da igreja"], answer: 1, explain: "«Os músicos tocam das sacadas dos casarões, e o maestro rege da rua.»" }
  - { q: "Por que a Valéria quer sair às sete?", options: ["Para jantar num restaurante famoso", "Para conseguir um bom lugar antes dos turistas", "Porque o concerto começa às sete"], answer: 1, explain: "«Para a gente conseguir um bom lugar, temos que sair daqui às sete.» The tables run out early." }
  - { q: "Por que elas precisam levar agasalho?", options: ["Porque vai chover", "Porque Diamantina é alta e faz frio à noite", "Porque a igreja é fria"], answer: 1, explain: "«Aqui em cima faz frio à noite. Diamantina fica a mais de mil metros de altitude.»" }
  - { q: "Quem nasceu em Diamantina, segundo o Guilherme?", options: ["O Aleijadinho", "Juscelino Kubitschek", "O maestro"], answer: 1, explain: "«Diamantina é a cidade do Juscelino Kubitschek, o presidente que construiu Brasília.»" }
  - { q: "No fim, o que a Iara pensa?", options: ["Que valeu a pena chegar cedo", "Que o concerto foi longo demais", "Que preferia ter ficado na pousada"], answer: 0, explain: "«Desculpa ter reclamado, Valéria. Valeu a pena chegarmos cedo.»" }
