id: r.b2.il-etait-une-fois-a-colmar
level: b2
title: Il était une fois à Colmar
kind: text
intro: "In Colmar, a grandmother tells her grandson an Alsatian-style tale about a boatman of Little Venice and a stork. The tale itself is told in the passé simple, the tense of written stories (il trouva, elle revint, ils firent…). Notice also faire + infinitive (il fit venir, il fit réparer)."
allow: [hansi, lauch, joseph, ok, centre]
paragraphs:
  - { es: "Ce soir-là, il pleuvait sur Colmar. Le petit Louis, qui passait les vacances chez sa grand-mère, regardait par la fenêtre le nid de cigognes posé sur la cheminée de la maison d'en face. « Mamie, pourquoi est-ce qu'il y a des cigognes sur tous les toits ? » La grand-mère sourit, s'installa dans son fauteuil et commença : « Il était une fois… »", en: "That evening it was raining on Colmar. Little Louis, who was spending the holidays at his grandmother's, was looking out of the window at the storks' nest on the chimney of the house opposite. 'Grandma, why are there storks on all the roofs?' His grandmother smiled, settled into her armchair and began: 'Once upon a time…'" }
  - { es: "Il était une fois, dans le quartier de la Petite Venise, un batelier qui s'appelait Joseph. Il était pauvre mais honnête, et chaque jour, il transportait sur sa barque les légumes des jardiniers jusqu'au marché, le long de la Lauch. Un matin d'automne, alors que toutes les cigognes étaient déjà parties vers l'Afrique, il trouva au bord de l'eau une jeune cigogne qui ne pouvait plus voler. Elle avait une aile cassée.", en: "Once upon a time, in the Little Venice district, there was a boatman called Joseph. He was poor but honest, and every day he carried the gardeners' vegetables on his boat to the market, along the Lauch. One autumn morning, when all the storks had already left for Africa, he found at the water's edge a young stork that could no longer fly. It had a broken wing." }
  - { es: "Joseph la prit dans ses bras et l'emporta chez lui. Bien qu'il n'ait presque pas d'argent, il fit venir le vétérinaire du village, qui lui fit une attelle avec deux morceaux de bois. Tout l'hiver, le batelier partagea son pain et ses poissons avec l'oiseau. Les voisins se moquaient de lui : « Tu as à peine de quoi manger, et tu nourris une cigogne ! » Mais Joseph ne les écouta pas.", en: "Joseph took it in his arms and carried it home. Although he had almost no money, he sent for the village vet, who made a splint for it out of two pieces of wood. All winter long the boatman shared his bread and his fish with the bird. The neighbours made fun of him: 'You barely have enough to eat, and you're feeding a stork!' But Joseph didn't listen to them." }
  - { es: "Au printemps, l'aile était guérie. Un matin, la cigogne ouvrit ses grandes ailes blanches, fit trois tours au-dessus de la maison et s'envola vers le sud. Joseph fut triste, mais il pensa qu'elle était heureuse, et cela lui suffit.", en: "In spring the wing had healed. One morning the stork opened its great white wings, circled three times above the house and flew away to the south. Joseph was sad, but he thought it was happy, and that was enough for him." }
  - { es: "L'année suivante, le jour de Pâques, on frappa à sa porte. Quand il ouvrit, il vit la cigogne posée sur le seuil. Dans son bec, elle tenait une petite bourse en cuir. Joseph l'ouvrit : elle était pleine de pièces d'or. Avec cet argent, il fit réparer sa vieille maison, il fit construire une barque neuve et, surtout, il fit installer sur son toit une grande roue de charrette, pour que la cigogne puisse y faire son nid. Elle y revint chaque printemps, et Joseph ne manqua plus jamais de rien. Depuis ce jour, dit-on, les Alsaciens savent qu'une cigogne sur le toit porte bonheur à toute la maison.", en: "The following year, on Easter Day, there was a knock at his door. When he opened it, he saw the stork standing on the doorstep. In its beak it held a little leather purse. Joseph opened it: it was full of gold coins. With this money he had his old house repaired, he had a new boat built and, above all, he had a big cartwheel put on his roof so that the stork could build its nest there. It came back every spring, and Joseph never wanted for anything again. Since that day, they say, the people of Alsace have known that a stork on the roof brings luck to the whole house." }
  - { es: "« C'est vrai, Mamie ? » demanda Louis. La grand-mère rit. « C'est une histoire, mon chéri. Mais ce qui est vrai, c'est que dans les années soixante-dix, il ne restait presque plus de cigognes en Alsace. On les a protégées, on a construit des nids sur les toits, et aujourd'hui, elles sont revenues par centaines. Comme dans le conte, c'est parce que des gens se sont occupés d'elles. »", en: "'Is that true, Grandma?' asked Louis. His grandmother laughed. 'It's a story, my darling. But what is true is that in the seventies there were hardly any storks left in Alsace. People protected them, built nests on the roofs, and today they've come back in their hundreds. As in the tale, it's because people took care of them.'" }
  - { es: "Louis regarda encore une fois le nid sur la cheminée. « Demain, on pourra aller voir la statue de la Liberté ? Tu m'as dit qu'il y en avait une ici. » « Oui, une petite copie, à l'entrée de la ville. Car l'homme qui a créé la grande, à New York, Auguste Bartholdi, est né ici, à Colmar, en 1834. Mais ça, c'est une autre histoire… »", en: "Louis looked at the nest on the chimney once more. 'Tomorrow, can we go and see the Statue of Liberty? You told me there was one here.' 'Yes, a small copy, at the entrance to the town. Because the man who created the big one in New York, Auguste Bartholdi, was born here in Colmar, in 1834. But that's another story…'" }
questions:
  - { q: "Que trouva Joseph au bord de l'eau ?", options: ["Une bourse pleine d'or", "Une jeune cigogne avec une aile cassée", "Une barque abandonnée"], answer: 1, explain: "«Il trouva au bord de l'eau une jeune cigogne qui ne pouvait plus voler.»" }
  - { q: "Pourquoi les voisins se moquaient-ils de Joseph ?", options: ["Parce qu'il nourrissait une cigogne alors qu'il était pauvre", "Parce qu'il ne savait pas naviguer", "Parce qu'il parlait aux oiseaux"], answer: 0, explain: "«Tu as à peine de quoi manger, et tu nourris une cigogne !»" }
  - { q: "Qu'apporta la cigogne à Joseph le jour de Pâques ?", options: ["Un bébé", "Une petite bourse pleine de pièces d'or", "Un poisson"], answer: 1, explain: "«Dans son bec, elle tenait une petite bourse en cuir… pleine de pièces d'or.»" }
  - { q: "« Il fit réparer sa vieille maison » signifie :", options: ["Il répara la maison lui-même", "Il demanda à quelqu'un de réparer la maison", "Il vendit la maison"], answer: 1, explain: "Faire + infinitive (causative): he had someone else do the repairs." }
  - { q: "Qu'est-ce qui est vrai, selon la grand-mère ?", options: ["Les cigognes apportent de l'or", "Les cigognes avaient presque disparu d'Alsace et sont revenues grâce à la protection", "Il n'y a jamais eu de cigognes à Colmar"], answer: 1, explain: "In the seventies there were hardly any left; people protected them and they came back in their hundreds." }
  - { q: "Pourquoi y a-t-il une statue de la Liberté à Colmar ?", options: ["Parce que Bartholdi, son créateur, est né à Colmar", "Parce que des Américains l'ont offerte", "Parce que c'est l'originale"], answer: 0, explain: "«Auguste Bartholdi est né ici, à Colmar, en 1834.»" }
