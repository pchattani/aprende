id: r.c1.four-hundred-years-of-a-wall
level: c1
title: 一幅牆嘅四百年
kind: text
intro: "A colloquial history of the Ruins of St Paul's, written as a newspaper column for Macau secondary-school students. The writer quotes the formal wording of a heritage plaque (the plaque's text is written for this course) and then retells each part in everyday Cantonese, so the formal time expressions of c1.u05 (於, 自…以來, 其後, 至今, 隨着) sit side by side with their spoken equivalents."
allow: [大三巴, 大三巴牌坊, 聖保祿, 聖保祿學院, 耶穌會, 日本, 天主教, 張老師]
paragraphs:
  - { es: "每日都有幾萬個遊客企喺大三巴前面影相，攞住手機擺好甫士，影完就去隔籬買杏仁餅。但係有幾多人知道，佢哋身後嗰幅牆，其實係一間教堂淨低嘅最後一部分？今日呢篇文，我想用最簡單嘅廣東話，講吓呢幅牆四百年嘅故事。", en: "Every day tens of thousands of tourists stand in front of the Ruins of St Paul's taking photos, holding up their phones and striking a pose, and then go next door to buy almond cookies. But how many of them know that the wall behind them is actually the last remaining part of a church? In this column I want to tell the four-hundred-year story of this wall in the simplest Cantonese." }
  - { es: "門口塊牌寫住：「聖保祿教堂由耶穌會於一六零二年開始興建，至一六四零年前後落成。」用口語講，即係：十七世紀初，一班叫耶穌會嘅天主教傳教士嚟到澳門，起咗呢間教堂，起咗差唔多四十年先起好。「於」即係「喺」，「至」即係「到」，「前後」就係「左右」。書面語短啲，口語就長啲，但係意思一樣。", en: "The plaque at the entrance says: 'The Church of St Paul was begun by the Society of Jesus in 1602 and completed around 1640.' In colloquial Cantonese that means: at the beginning of the seventeenth century a group of Catholic missionaries called the Jesuits came to Macau and built this church, and it took almost forty years to finish. 於 is 喺 'in', 至 is 到 'until', and 前後 is 左右 'around'. The written version is shorter and the spoken one longer, but the meaning is the same." }
  - { es: "教堂隔籬，當時仲有一間聖保祿學院，係遠東第一間西式大學。好多傳教士喺度學中文，學完先去中國同日本傳教。所以喺嗰個年代，澳門唔單止係一個港口，仲係東西方文化交匯嘅地方。你睇吓幅牆上面嘅雕刻：有天使、有聖母，但係又有菊花、牡丹，甚至有中文字，好似「念死者無為罪」。中西合璧，就係噉嘅意思。", en: "Next to the church there was also the College of St Paul, the first Western-style university in the Far East. Many missionaries studied Chinese there before going on to preach in China and Japan. So in that era Macau wasn't just a port; it was also a place where Eastern and Western cultures met. Look at the carvings on the wall: there are angels and the Virgin Mary, but also chrysanthemums, peonies and even Chinese characters, such as 'Remember death and you will not sin'. That's what 'a blend of Chinese and Western' means." }
  - { es: "據講，幅牆嘅雕刻有一部分係由一班喺日本畀人趕走、逃難嚟澳門嘅天主教徒同本地工匠一齊做嘅。我第一次聽到嘅時候覺得好感動：一班離鄉別井嘅人，喺一個陌生嘅地方，將自己嘅信仰同手藝留喺石頭上面，留到今日。", en: "It is said that part of the carving on the wall was done by Catholics who had been expelled from Japan and fled to Macau, working together with local craftsmen. When I first heard that, I was very moved: people who had left their homes, in a strange place, left their faith and their craft in stone, and it has lasted until today." }
  - { es: "塊牌跟住寫：「一八三五年，教堂於一場大火中焚毀，僅餘前壁。」口語就係：一八三五年，有一日打風，教堂突然火燭，成間燒晒，淨係剩返前面呢幅石牆。「焚毀」係書面語，口語就講「燒晒」；「僅餘」即係「淨係剩返」。幅牆係石頭整嘅，所以燒唔到；後面木做嘅部分，就全部冇晒。", en: "The plaque continues: 'In 1835 the church was destroyed in a great fire, leaving only the front wall.' In colloquial terms: in 1835, one day during a typhoon, the church suddenly caught fire and burned down completely, leaving only this stone wall at the front. 焚毀 is written language – in speech we say 燒晒 'burned completely'; 僅餘 means 淨係剩返 'only … left'. The wall was made of stone, so it didn't burn; the wooden parts behind it were all lost." }
  - { es: "之後成百幾年，呢幅牆就孤零零噉企喺山上面，前面得一條長長嘅石級，總共六十八級。有人話佢好似一塊舞台佈景，前面好威，後面乜都冇。一九九零年代，政府開始維修，喺牆後面整咗一個博物館同地下墓室，等遊客可以行到後面睇。二零零五年，大三巴同其他古蹟一齊列入《世界遺產名錄》。塊牌最後一句係：「自此成為澳門最具代表性之標誌，至今仍吸引世界各地遊客。」用口語講：由嗰時開始，佢就成咗澳門最出名嘅地方，到而家都仲有好多人專登嚟睇。", en: "For more than a hundred years after that, the wall stood all alone on the hill, with only a long flight of stone steps in front – sixty-eight steps in all. Some said it looked like a piece of stage scenery: impressive at the front, nothing behind. In the 1990s the government began restoration work and built a museum and a crypt behind the wall so that visitors could walk round to the back. In 2005 the Ruins, together with other historic sites, were inscribed on the World Heritage List. The last line of the plaque reads: 'It has since become the most representative symbol of Macau and still attracts visitors from all over the world.' In colloquial terms: from then on it became the most famous place in Macau, and lots of people still come specially to see it." }
  - { es: "我教中文嘅朋友張老師話，佢帶學生嚟呢度，都會叫佢哋做一個練習：將塊牌上面嘅書面語，逐句變做口語，再將自己嘅口語寫返做書面語。學生開頭覺得好悶，但係做完之後，好多人話先第一次真係睇明塊牌講乜。佢話：「兩種語言都係我哋嘅，一種用嚟寫歷史，一種用嚟講故事。」", en: "My friend Ms Cheung, who teaches Chinese, says that when she brings students here, she always gives them an exercise: turn the written Chinese on the plaque into colloquial Cantonese sentence by sentence, then write their own colloquial version back into written Chinese. At first the students find it boring, but afterwards many say it's the first time they've really understood what the plaque says. She says: 'Both languages are ours: one is for writing history, the other for telling stories.'" }
  - { es: "我自己最鍾意嘅時間，係夜晚十點之後。嗰陣遊客走晒，手信舖閂晒門，射燈照住幅牆，金黃色噉。坐喺石級上面，聽到嘅淨係風聲同遠處嘅車聲。嗰一刻，你會覺得幅牆唔係一個景點，而係一個老人家，靜靜哋坐喺山上面，睇住呢個城市由細變大，由舊變新。", en: "My own favourite time is after ten at night. By then the tourists have all gone, the souvenir shops are all shut, and the floodlights turn the wall golden. Sitting on the steps, all you hear is the wind and the distant traffic. In that moment you feel the wall isn't a tourist sight but an old person sitting quietly on the hill, watching the city grow from small to big, from old to new." }
  - { es: "下次你行上嗰六十八級石級，唔好淨係掛住影相。行到後面睇吓，諗吓四百年前嗰班工匠、嗰場大火，同埋點解一幅淨低嘅牆，會變成成個城市嘅象徵。可能因為澳門本身都係噉：經歷過好多變化，有啲嘢冇咗，但係最重要嘅嘢，一直都企喺度。", en: "Next time you climb those sixty-eight steps, don't just think about taking photos. Walk round the back and think about the craftsmen of four hundred years ago, about that great fire, and about why a wall left standing could become the symbol of an entire city. Perhaps because Macau itself is like that: it has been through a great many changes, some things have gone, but the most important things are still standing." }
questions:
  - { q: "「聖保祿教堂由耶穌會於一六零二年開始興建」入面，「於」用口語講即係？", options: ["喺", "畀", "同"], answer: 0, explain: "於 is the formal preposition of time and place, colloquially 喺." }
  - { q: "點解大火之後淨係剩返前面幅牆？", options: ["因為幅牆係石頭整嘅，燒唔到", "因為消防員淨係救到幅牆", "因為幅牆係後來先起嘅"], answer: 0, explain: "The façade was stone; the wooden church behind it burned down in 1835." }
  - { q: "「僅餘前壁」嘅意思係？", options: ["前面幅牆好舊", "淨係剩返前面幅牆", "前面幅牆最靚"], answer: 1, explain: "僅餘 = 淨係剩返 'only … remains'; 前壁 = the front wall." }
  - { q: "幅牆上面嘅雕刻點解話係「中西合璧」？", options: ["因為有天使同聖母，又有菊花、牡丹同中文字", "因為係中國人同西方人一齊買嘅", "因為一半喺中國，一半喺葡萄牙"], answer: 0, explain: "The carvings mix Christian images with Chinese and Japanese motifs and Chinese characters." }
  - { q: "張老師叫學生做乜嘢練習？", options: ["數清楚有幾多級石級", "將塊牌嘅書面語變做口語，再將口語寫返做書面語", "用英文介紹大三巴"], answer: 1, explain: "Converting between written Chinese and colloquial Cantonese in both directions – the core skill of c1.u01." }
