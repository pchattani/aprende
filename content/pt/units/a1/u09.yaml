  - id: a1.u09.l4
    title: Posso entrar?
    teach: [g.poder-present]
    tip: "posso, pode, podemos, podem: permission (Posso entrar?), requests (Você pode me ajudar?) and possibility (Pode chover). Pode deixar! = Leave it to me!"
    vocab: [w.poder, w.ajudar, w.deixar, w.estacionar, w.fumar, w.licença, w.comigo, w.pronto]
    sentences:
      - { es: "Posso sentar aqui?", en: "Can I sit here?", altEs: ["Posso me sentar aqui?", "Eu posso sentar aqui?"], altEn: ["May I sit here?"], grammar: [g.poder-present], vocab: [w.poder, w.sentar-se] }
      - { es: "Você pode me ajudar, por favor?", en: "Can you help me, please?", altEs: ["Pode me ajudar, por favor?", "Você pode me ajudar?"], altEn: ["Could you help me, please?"], grammar: [g.poder-present], vocab: [w.ajudar] }
