id: c1.u07
title: "Toulouse, le cœur sur la main"
lessons:
  - id: c1.u07.l1
    title: Il pleut des cordes sur la Ville rose
    teach: [g.idioms-everyday]
    tip: "Idioms conjugate like any verb phrase: il m'a posé un lapin, j'avais le cafard, on aura du pain sur la planche. Keep the fixed words fixed (never 'un lièvre' for 'un lapin') and keep them out of formal writing."
    vocab: [w.brique, w.terre-cuite, w.poser-un-lapin, w.il-pleut-des-cordes, w.tomber-dans-les-pommes, w.avoir-le-cafard, w.raconter-des-salades, w.avoir-un-poil-dans-la-main, w.mettre-son-grain-de-sel, w.revenons-à-nos-moutons, w.être-dans-la-lune, w.avoir-du-pain-sur-la-planche, w.planche, w.c-est-la-fin-des-haricots, w.casser-les-pieds, w.faire-la-grasse-matinée, w.il-y-a-anguille-sous-roche, w.être-aux-anges, w.avoir-une-faim-de-loup, w.avoir-une-mémoire-d-éléphant, w.ne-pas-être-dans-son-assiette, w.donner-sa-langue-au-chat, w.avoir-un-chat-dans-la-gorge, w.appeler-un-chat-un-chat, w.quand-les-poules-auront-des-dents]
    sentences:
      - { es: "Il m'a posé un lapin devant le Capitole : j'ai attendu une heure sous la pluie.", en: "He stood me up outside the Capitole: I waited an hour in the rain.", altEs: ["Il m'a posé un lapin devant le Capitole, j'ai attendu une heure sous la pluie.", "Elle m'a posé un lapin devant le Capitole : j'ai attendu une heure sous la pluie."], altEn: ["She stood me up outside the Capitole: I waited an hour in the rain."], grammar: [g.idioms-everyday, g.passe-compose-avoir], vocab: [w.poser-un-lapin], transform: { instruction: "Turn it round: 'I stood him up'", answer: "Je lui ai posé un lapin devant le Capitole.", alt: ["Je lui ai posé un lapin devant le Capitole : il a attendu une heure sous la pluie."], en: "I stood him up outside the Capitole." } }
      - { es: "Prends un parapluie : il pleut des cordes sur la Ville rose.", en: "Take an umbrella: it's pouring down on the Pink City.", altEs: ["Prends un parapluie, il pleut des cordes sur la Ville rose.", "Prends un parapluie : il pleut à verse sur la Ville rose."], altEn: ["Take an umbrella: it's raining cats and dogs on the Pink City."], grammar: [g.idioms-everyday, g.imperative], vocab: [w.il-pleut-des-cordes], error: { wrong: "Prends un parapluie : il pleut des chats et des chiens sur la Ville rose.", explain: "Don't translate English idioms word for word: French says il pleut des cordes (or il pleut à verse).", grammar: g.idioms-everyday } }
      - { es: "Avec ses briques en terre cuite, la ville devient rose orangé au coucher du soleil.", en: "With its terracotta bricks, the city turns orangey pink at sunset.", altEs: ["Avec ses briques de terre cuite, la ville devient rose orangé au coucher du soleil."], grammar: [g.adjective-agreement], vocab: [w.brique, w.terre-cuite] }
      - { es: "Il faisait si chaud dans la mêlée de supporters qu'un homme est tombé dans les pommes.", en: "It was so hot in the crush of fans that a man fainted.", altEs: ["Il faisait tellement chaud dans la foule de supporters qu'un homme est tombé dans les pommes."], grammar: [g.idioms-everyday, g.pc-vs-imparfait], vocab: [w.tomber-dans-les-pommes, w.mêlée] }
      - { es: "Depuis que sa copine est partie à Bordeaux, Lucas a le cafard.", en: "Since his girlfriend left for Bordeaux, Lucas has been feeling down.", altEs: ["Lucas a le cafard depuis que sa copine est partie à Bordeaux.", "Depuis que sa petite amie est partie à Bordeaux, Lucas a le cafard."], grammar: [g.idioms-everyday, g.depuis-present], vocab: [w.avoir-le-cafard] }
      - { es: "Arrête de me raconter des salades : je sais que tu n'étais pas au match.", en: "Stop telling me fibs: I know you weren't at the match.", altEs: ["Arrête de me raconter des salades, je sais que tu n'étais pas au match."], grammar: [g.idioms-everyday], vocab: [w.raconter-des-salades] }
      - { es: "Mon colocataire a un poil dans la main : il n'a jamais lavé une assiette.", en: "My flatmate is bone idle: he has never washed a plate.", altEs: ["Mon colocataire a un poil dans la main, il n'a jamais lavé une assiette.", "Mon coloc a un poil dans la main : il n'a jamais lavé une assiette."], grammar: [g.idioms-everyday, g.negation-jamais-plus-rien], vocab: [w.avoir-un-poil-dans-la-main] }
      - { es: "Personne ne t'a demandé ton avis ; ne mets pas ton grain de sel partout.", en: "Nobody asked for your opinion; don't stick your oar in everywhere.", altEs: ["Personne ne t'a demandé ton avis, ne mets pas ton grain de sel partout."], grammar: [g.idioms-everyday, g.imperative], vocab: [w.mettre-son-grain-de-sel] }
      - { es: "Bon, revenons à nos moutons : qui réserve la table pour samedi ?", en: "Right, let's get back to the point: who's booking the table for Saturday?", altEs: ["Bref, revenons à nos moutons : qui réserve la table pour samedi ?"], grammar: [g.idioms-everyday], vocab: [w.revenons-à-nos-moutons] }
      - { es: "Tu es dans la lune ou tu m'écoutes ?", en: "Are you miles away or are you listening to me?", altEs: ["Tu es dans la lune, ou tu m'écoutes ?", "Est-ce que tu es dans la lune ou tu m'écoutes ?"], altEn: ["Are you daydreaming or are you listening to me?"], grammar: [g.idioms-everyday, g.yes-no-questions], vocab: [w.être-dans-la-lune] }
      - { es: "Je ne peux pas sortir ce soir : j'ai du pain sur la planche avant la réunion de lundi.", en: "I can't go out tonight: I've got a lot on my plate before Monday's meeting.", altEs: ["Je ne peux pas sortir ce soir, j'ai du pain sur la planche avant la réunion de lundi."], grammar: [g.idioms-everyday], vocab: [w.avoir-du-pain-sur-la-planche], transform: { instruction: "Put it in the past: 'last night I couldn't…'", answer: "Hier soir, je n'ai pas pu sortir : j'avais du pain sur la planche.", alt: ["Hier soir, je ne pouvais pas sortir : j'avais du pain sur la planche.", "Je n'ai pas pu sortir hier soir : j'avais du pain sur la planche."], en: "Last night I couldn't go out: I had a lot on my plate." } }
      - { es: "Le dimanche, je fais la grasse matinée jusqu'à midi.", en: "On Sundays I have a lie-in until midday.", altEs: ["Le dimanche, je fais la grasse mat' jusqu'à midi."], grammar: [g.idioms-everyday, g.frequency-adverbs], vocab: [w.faire-la-grasse-matinée] }
      - { es: "Ils chuchotent depuis une heure : il y a anguille sous roche.", en: "They've been whispering for an hour: something's up.", altEs: ["Ils chuchotent depuis une heure, il y a anguille sous roche."], altEn: ["They've been whispering for an hour: something fishy is going on."], grammar: [g.idioms-everyday], vocab: [w.il-y-a-anguille-sous-roche] }
      - { es: "Quand Toulouse a gagné la finale, mon père était aux anges.", en: "When Toulouse won the final, my father was over the moon.", altEs: ["Quand le Stade toulousain a gagné la finale, mon père était aux anges."], grammar: [g.idioms-everyday, g.pc-vs-imparfait], vocab: [w.être-aux-anges] }
      - { es: "J'ai une faim de loup ; on va manger un cassoulet ?", en: "I'm starving; shall we go and have a cassoulet?", altEs: ["J'ai une faim de loup, on va manger un cassoulet ?"], grammar: [g.idioms-everyday, g.futur-proche], vocab: [w.avoir-une-faim-de-loup, w.cassoulet] }
      - { es: "Ma grand-mère a une mémoire d'éléphant : elle se souvient de tous les scores depuis 1985.", en: "My grandmother has a memory like an elephant: she remembers every score since 1985.", altEs: ["Ma grand-mère a une mémoire d'éléphant, elle se rappelle tous les scores depuis 1985."], grammar: [g.idioms-everyday], vocab: [w.avoir-une-mémoire-d-éléphant] }
    exchanges:
      - q: { es: "Alors, ce rendez-vous d'hier soir ?", en: "So, how was last night's date?" }
        a: { es: "N'en parlons pas : il m'a posé un lapin.", en: "Don't ask: he stood me up." }
        alt: ["Il n'est jamais venu : un vrai lapin.", "J'étais aux anges, on se revoit samedi !"]
        grammar: [g.idioms-everyday]
        vocab: [w.poser-un-lapin, w.être-aux-anges]
      - q: { es: "Tu as l'air bizarre. Ça ne va pas ?", en: "You look odd. Are you all right?" }
        a: { es: "Je ne suis pas dans mon assiette aujourd'hui ; j'ai un peu le cafard.", en: "I'm not myself today; I'm feeling a bit down." }
        alt: ["Non, je ne suis pas dans mon assiette.", "J'ai le cafard, c'est la pluie."]
        grammar: [g.idioms-everyday]
        vocab: [w.ne-pas-être-dans-son-assiette, w.avoir-le-cafard]
      - q: { es: "Devine qui j'ai vu au marché Victor-Hugo !", en: "Guess who I saw at the Victor Hugo market!" }
        a: { es: "Aucune idée… je donne ma langue au chat.", en: "No idea… I give up." }
        alt: ["Je donne ma langue au chat, dis-moi !", "Ton ex ? Il y a anguille sous roche !"]
        grammar: [g.idioms-everyday]
        vocab: [w.donner-sa-langue-au-chat]
      - q: { es: "Tu peux parler plus fort ? On t'entend à peine.", en: "Can you speak up? We can barely hear you." }
        a: { es: "Pardon, j'ai un chat dans la gorge depuis le match d'hier.", en: "Sorry, I've had a frog in my throat since yesterday's match." }
        alt: ["Désolé, j'ai un chat dans la gorge.", "J'ai trop crié au stade, j'ai un chat dans la gorge."]
        grammar: [g.idioms-everyday]
        vocab: [w.avoir-un-chat-dans-la-gorge]
      - q: { es: "Tu crois qu'il va enfin payer sa part du loyer ?", en: "Do you think he'll finally pay his share of the rent?" }
        a: { es: "Oui, quand les poules auront des dents.", en: "Yes, when pigs fly." }
        alt: ["Ça m'étonnerait : il nous raconte des salades depuis des mois.", "S'il ne paie pas, c'est la fin des haricots."]
        grammar: [g.idioms-everyday]
        vocab: [w.quand-les-poules-auront-des-dents, w.raconter-des-salades]
    texts:
      - title: "Message de Léa"
        es: ["Désolée pour hier, je ne t'ai pas posé un lapin exprès !", "Il pleuvait des cordes et mon bus est tombé en panne.", "Je t'invite au cassoulet ce soir pour me faire pardonner ?"]
        en: ["Sorry about yesterday, I didn't stand you up on purpose!", "It was pouring and my bus broke down.", "Can I take you out for a cassoulet tonight to make up for it?"]
        grammar: [g.idioms-everyday]
        vocab: [w.poser-un-lapin, w.il-pleut-des-cordes]
      - title: "Note sur le frigo"
        es: ["À tous les colocataires : appelons un chat un chat.", "La vaisselle s'accumule depuis une semaine.", "Si personne ne la fait, c'est la fin des haricots !"]
        en: ["To all flatmates: let's call a spade a spade.", "The washing-up has been piling up for a week.", "If nobody does it, that's the last straw!"]
        grammar: [g.idioms-everyday]
        vocab: [w.appeler-un-chat-un-chat, w.c-est-la-fin-des-haricots]
    spicy:
      - { es: "Si tu me poses un lapin ce soir, je te préviens : j'ai une mémoire d'éléphant.", en: "If you stand me up tonight, I'm warning you: I have a memory like an elephant.", altEs: ["Si tu me poses un lapin ce soir, je te préviens, j'ai une mémoire d'éléphant."], grammar: [g.idioms-everyday, g.si-present-futur], vocab: [w.poser-un-lapin, w.avoir-une-mémoire-d-éléphant] }
      - { es: "Quand tu m'as souri au café, j'ai failli tomber dans les pommes.", en: "When you smiled at me in the café, I nearly fainted.", altEs: ["Quand tu m'as souri au café, j'ai bien failli tomber dans les pommes."], grammar: [g.idioms-everyday], vocab: [w.tomber-dans-les-pommes] }
      - { es: "Je suis dans la lune depuis notre dîner, et je crois que c'est ta faute.", en: "I've been miles away since our dinner, and I think it's your fault.", altEs: ["Je suis dans la lune depuis notre dîner et je crois que c'est de ta faute."], grammar: [g.idioms-everyday], vocab: [w.être-dans-la-lune] }
      - { es: "Ne me raconte pas de salades : tu es venu au match pour moi, pas pour le rugby.", en: "Don't tell me fibs: you came to the match for me, not for the rugby.", altEs: ["Ne me raconte pas de salades, tu es venu au match pour moi, pas pour le rugby."], grammar: [g.idioms-everyday], vocab: [w.raconter-des-salades, w.rugby] }
      - { es: "Ce matin, on fait la grasse matinée ; le cassoulet attendra.", en: "This morning we're having a lie-in; the cassoulet can wait.", altEs: ["Ce matin, on fait la grasse matinée, le cassoulet attendra."], grammar: [g.idioms-everyday, g.on-nous], vocab: [w.faire-la-grasse-matinée, w.cassoulet] }
  - id: c1.u07.l2
    title: Le cœur sur la main
    teach: [g.idioms-body]
    tip: "Body idioms are everywhere in French: avoir le cœur sur la main (be generous), mettre les pieds dans le plat (put your foot in it), coûter les yeux de la tête (cost a fortune), faire la tête (sulk). The possessive often changes with the person: je prends mes jambes à mon cou, elle prend ses jambes à son cou."
    vocab: [w.avoir-le-cœur-sur-la-main, w.coûter-les-yeux-de-la-tête, w.mettre-les-pieds-dans-le-plat, w.avoir-la-tête-dans-les-nuages, w.faire-la-tête, w.ne-pas-avoir-sa-langue-dans-sa-poche, w.avoir-le-bras-long, w.se-serrer-les-coudes, w.prendre-ses-jambes-à-son-cou, w.mettre-la-main-à-la-pâte, w.avoir-les-dents-longues, w.avoir-la-main-verte, w.tirer-les-vers-du-nez, w.coup-d-œil, w.en-un-clin-d-œil, w.clin-d-œil, w.mine, w.avoir-bonne-mine, w.rugby, w.mêlée, w.rugbyman, w.aéronautique, w.aérospatial, w.spatial, w.chaîne-d-assemblage, w.assemblage, w.réplique, w.grandeur-nature, w.finale, w.club, w.parrain]
    sentences:
      - { es: "Les Toulousains ont le cœur sur la main : ils t'invitent avant même de connaître ton nom.", en: "The people of Toulouse are very generous: they invite you before they even know your name.", altEs: ["Les Toulousains ont le cœur sur la main, ils t'invitent avant même de connaître ton prénom."], grammar: [g.idioms-body], vocab: [w.avoir-le-cœur-sur-la-main, w.toulousain] }
      - { es: "Un billet pour la finale de rugby, ça coûte les yeux de la tête !", en: "A ticket for the rugby final costs an arm and a leg!", altEs: ["Un billet pour la finale de rugby, ça coûte un bras !", "Une place pour la finale de rugby, ça coûte les yeux de la tête !"], altEn: ["A ticket for the rugby final costs a fortune!"], grammar: [g.idioms-body], vocab: [w.coûter-les-yeux-de-la-tête, w.rugby], error: { wrong: "Un billet pour la finale de rugby, ça coûte un bras et une jambe !", explain: "'An arm and a leg' is English: French says coûter un bras or coûter les yeux de la tête.", grammar: g.idioms-body } }
      - { es: "J'ai mis les pieds dans le plat en parlant de son ex devant sa nouvelle copine.", en: "I put my foot in it by talking about his ex in front of his new girlfriend.", altEs: ["J'ai mis les pieds dans le plat en parlant de son ex devant sa nouvelle petite amie."], grammar: [g.idioms-body, g.gerondif], vocab: [w.mettre-les-pieds-dans-le-plat], transform: { instruction: "Change the subject to 'she'", answer: "Elle a mis les pieds dans le plat en parlant de son ex devant sa nouvelle copine.", alt: ["Elle a mis les pieds dans le plat en parlant de son ex devant sa nouvelle petite amie."], en: "She put her foot in it by talking about his ex in front of his new girlfriend." } }
      - { es: "Ce stagiaire a toujours la tête dans les nuages ; il a oublié la réunion.", en: "That intern always has his head in the clouds; he forgot the meeting.", altEs: ["Ce stagiaire a toujours la tête dans les nuages, il a oublié la réunion."], grammar: [g.idioms-body], vocab: [w.avoir-la-tête-dans-les-nuages] }
      - { es: "Pourquoi tu fais la tête ? Toulouse a gagné !", en: "Why are you sulking? Toulouse won!", altEs: ["Pourquoi est-ce que tu fais la tête ? Toulouse a gagné !", "Tu fais la tête pourquoi ? Toulouse a gagné !"], grammar: [g.idioms-body, g.question-words], vocab: [w.faire-la-tête], transform: { instruction: "Ask the same question formally, with inversion and vous", answer: "Pourquoi faites-vous la tête ? Toulouse a gagné !", alt: ["Pourquoi est-ce que vous faites la tête ? Toulouse a gagné !"], en: "Why are you sulking? Toulouse won!" } }
      - { es: "Ma tante n'a pas sa langue dans sa poche : elle a dit à l'arbitre ce qu'elle pensait.", en: "My aunt is very outspoken: she told the referee what she thought.", altEs: ["Ma tante n'a pas sa langue dans sa poche, elle a dit à l'arbitre ce qu'elle pensait."], grammar: [g.idioms-body, g.ce-qui-ce-que], vocab: [w.ne-pas-avoir-sa-langue-dans-sa-poche] }
      - { es: "Dans une mêlée, les avants doivent se serrer les coudes.", en: "In a scrum, the forwards have to stick together.", altEs: ["Dans la mêlée, les avants doivent se serrer les coudes."], grammar: [g.idioms-body, g.modal-verbs], vocab: [w.mêlée, w.se-serrer-les-coudes] }
      - { es: "Quand l'orage a éclaté, les touristes ont pris leurs jambes à leur cou.", en: "When the storm broke, the tourists ran for it.", altEs: ["Quand l'orage a éclaté, les touristes ont pris leurs jambes à leur cou pour se mettre à l'abri."], altEn: ["When the storm broke, the tourists took to their heels."], grammar: [g.idioms-body, g.passe-compose-avoir], vocab: [w.prendre-ses-jambes-à-son-cou], error: { wrong: "Quand l'orage a éclaté, les touristes ont pris ses jambes à son cou.", explain: "The possessives follow the subject: les touristes ont pris leurs jambes à leur cou.", grammar: g.idioms-body } }
      - { es: "Si tu veux manger, mets la main à la pâte et épluche les oignons.", en: "If you want to eat, lend a hand and peel the onions.", altEs: ["Si tu veux manger, mets la main à la pâte : épluche les oignons."], grammar: [g.idioms-body, g.imperative], vocab: [w.mettre-la-main-à-la-pâte] }
      - { es: "Cette ingénieure a les dents longues : elle veut diriger la chaîne d'assemblage dans deux ans.", en: "That engineer is very ambitious: she wants to run the assembly line within two years.", altEs: ["Cette ingénieure a les dents longues, elle veut diriger la chaîne d'assemblage dans deux ans."], grammar: [g.idioms-body], vocab: [w.avoir-les-dents-longues, w.chaîne-d-assemblage] }
      - { es: "Son oncle a le bras long : il connaît tout le monde chez Airbus.", en: "Her uncle has friends in high places: he knows everyone at Airbus.", altEs: ["Son oncle a le bras long, il connaît tout le monde chez Airbus."], grammar: [g.idioms-body], vocab: [w.avoir-le-bras-long] }
      - { es: "J'ai essayé de lui tirer les vers du nez, mais il n'a rien dit sur le nouvel avion.", en: "I tried to worm it out of him, but he said nothing about the new plane.", altEs: ["J'ai essayé de lui tirer les vers du nez, mais il n'a rien voulu dire sur le nouvel avion."], grammar: [g.idioms-body, g.negation-jamais-plus-rien], vocab: [w.tirer-les-vers-du-nez] }
      - { es: "À la Cité de l'espace, on peut entrer dans une réplique grandeur nature d'un module de la station Mir.", en: "At the Cité de l'espace you can go inside a life-size replica of a module of the Mir station.", altEs: ["À la Cité de l'espace, on peut visiter une réplique grandeur nature d'un module de la station Mir."], grammar: [g.on-nous], vocab: [w.réplique, w.grandeur-nature, w.spatial], note: "The Cité de l'espace in Toulouse displays a full-size Ariane 5 replica and a Mir module you can walk through." }
      - { es: "On présente souvent Toulouse comme la capitale européenne de l'aéronautique et de l'industrie aérospatiale.", en: "Toulouse is often described as the European capital of aeronautics and the aerospace industry.", altEs: ["On décrit souvent Toulouse comme la capitale européenne de l'aéronautique et de l'industrie aérospatiale."], grammar: [g.on-nous], vocab: [w.aéronautique, w.aérospatial] }
      - { es: "Jette un coup d'œil sur l'assemblage de l'aile : en un clin d'œil, tout est vissé.", en: "Take a look at the wing assembly: in the blink of an eye, everything is screwed together.", altEs: ["Jette un coup d'œil à l'assemblage de l'aile : en un clin d'œil, tout est vissé."], grammar: [g.idioms-body, g.imperative], vocab: [w.coup-d-œil, w.en-un-clin-d-œil, w.assemblage] }
      - { es: "Tu as bonne mine ! Tu reviens de la montagne ?", en: "You look well! Are you back from the mountains?", altEs: ["Tu as bonne mine ! Tu rentres de la montagne ?"], grammar: [g.idioms-body], vocab: [w.avoir-bonne-mine, w.mine] }
    exchanges:
      - q: { es: "Il t'a vraiment offert ses places pour le match ?", en: "Did he really give you his tickets for the match?" }
        a: { es: "Oui, il a le cœur sur la main, ce garçon.", en: "Yes, he's so generous, that boy." }
        alt: ["Oui, il a vraiment le cœur sur la main.", "Oui, et en plus il m'a payé le repas !"]
        grammar: [g.idioms-body]
        vocab: [w.avoir-le-cœur-sur-la-main]
      - q: { es: "Pourquoi Marc ne te parle plus ?", en: "Why isn't Marc speaking to you any more?" }
        a: { es: "Il fait la tête depuis que j'ai mis les pieds dans le plat au dîner.", en: "He's been sulking since I put my foot in it at dinner." }
        alt: ["Il fait la tête, je ne sais pas pourquoi.", "J'ai mis les pieds dans le plat, je crois."]
        grammar: [g.idioms-body]
        vocab: [w.faire-la-tête, w.mettre-les-pieds-dans-le-plat]
      - q: { es: "Comment tu as eu ce stage chez Airbus ?", en: "How did you get that internship at Airbus?" }
        a: { es: "Mon parrain a le bras long, je ne vais pas te raconter de salades.", en: "My godfather has friends in high places, I won't lie to you." }
        alt: ["Grâce à mon oncle, qui a le bras long.", "J'ai envoyé cent candidatures, tout simplement."]
        grammar: [g.idioms-body]
        vocab: [w.avoir-le-bras-long]
      - q: { es: "Tes tomates sont magnifiques !", en: "Your tomatoes are magnificent!" }
        a: { es: "Merci, ma grand-mère avait la main verte, et moi aussi, apparemment.", en: "Thanks, my grandmother had green fingers, and so do I, apparently." }
        alt: ["Merci ! J'ai la main verte, que veux-tu.", "C'est le soleil de Toulouse, pas moi."]
        grammar: [g.idioms-body]
        vocab: [w.avoir-la-main-verte]
      - q: { es: "Tu peux m'aider à monter cette armoire ?", en: "Can you help me put this wardrobe together?" }
        a: { es: "Bien sûr, je mets la main à la pâte ; à deux, ce sera fait en un clin d'œil.", en: "Of course, I'll lend a hand; with two of us it'll be done in no time." }
        alt: ["Pas de souci, je te donne un coup de main.", "J'arrive : on va se serrer les coudes."]
        grammar: [g.idioms-body]
        vocab: [w.mettre-la-main-à-la-pâte, w.en-un-clin-d-œil]
    texts:
      - title: "Carte postale de la Cité de l'espace"
        es: ["Aujourd'hui, j'ai vu une réplique grandeur nature d'Ariane 5 !", "Un vrai coup de cœur, mais l'entrée coûte un bras.", "Je t'embrasse depuis la capitale de l'aéronautique."]
        en: ["Today I saw a life-size replica of Ariane 5!", "I absolutely loved it, but the entrance fee costs an arm and a leg.", "Love from the capital of aeronautics."]
        grammar: [g.idioms-body]
        vocab: [w.réplique, w.grandeur-nature, w.aéronautique]
      - title: "Le mot de l'entraîneur"
        es: ["Samedi, on joue contre les meilleurs.", "Dans la mêlée, serrez-vous les coudes et ne faites pas la tête si l'arbitre se trompe.", "Le rugby, c'est quinze hommes et un seul cœur."]
        en: ["On Saturday we're playing against the best.", "In the scrum, stick together, and don't sulk if the referee gets it wrong.", "Rugby is fifteen men and a single heart."]
        grammar: [g.idioms-body, g.imperative]
        vocab: [w.mêlée, w.se-serrer-les-coudes, w.faire-la-tête, w.rugby]
    spicy:
      - { es: "Ce rugbyman a le cœur sur la main… et des épaules qui ne laissent personne indifférent.", en: "That rugby player is generous to a fault… and has shoulders that leave no one indifferent.", altEs: ["Ce rugbyman a le cœur sur la main et des épaules qui ne laissent personne indifférent."], grammar: [g.idioms-body], vocab: [w.rugbyman, w.avoir-le-cœur-sur-la-main] }
      - { es: "Tu m'as fait un clin d'œil pendant la mêlée, ou c'était le soleil ?", en: "Did you wink at me during the scrum, or was it the sun?", altEs: ["Tu m'as fait un clin d'œil pendant la mêlée ou c'était le soleil ?"], grammar: [g.idioms-body], vocab: [w.clin-d-œil, w.mêlée] }
      - { es: "J'ai essayé de te tirer les vers du nez, mais tu caches bien ton jeu.", en: "I tried to worm it out of you, but you play your cards close to your chest.", altEs: ["J'ai essayé de te tirer les vers du nez, mais tu caches bien ton jeu, toi."], grammar: [g.idioms-body], vocab: [w.tirer-les-vers-du-nez] }
      - { es: "Tu as bonne mine ce soir ; c'est le soleil de Toulouse ou c'est moi ?", en: "You look great tonight; is it the Toulouse sun or is it me?", altEs: ["Tu as bonne mine ce soir : c'est le soleil de Toulouse ou c'est moi ?"], grammar: [g.idioms-body], vocab: [w.avoir-bonne-mine] }
      - { es: "Quand ta mère est rentrée plus tôt, j'ai pris mes jambes à mon cou par la fenêtre du rez-de-chaussée.", en: "When your mother came home early, I ran for it through the ground-floor window.", altEs: ["Quand ta mère est rentrée plus tôt, j'ai pris mes jambes à mon cou par la fenêtre du rez-de-chaussée !"], grammar: [g.idioms-body], vocab: [w.prendre-ses-jambes-à-son-cou] }
  - id: c1.u07.l3
    title: Coups de foudre et coups de main
    teach: [g.idioms-everyday, g.idioms-body]
    tip: "Coup de… builds dozens of idioms: un coup de main (a hand), un coup de fil (a call), un coup de soleil (sunburn), un coup de foudre (love at first sight). And to describe character: il est têtu comme une mule, elle est un peu râleuse, ils sont chaleureux."
    vocab: [w.coup-de-foudre, w.avoir-le-coup-de-foudre, w.coup-de-main, w.coup-de-fil, w.coup-de-soleil, w.faire-semblant, w.semblant, w.il-était-temps, w.tant-bien-que-mal, w.à-la-bonne-franquette, w.cassoulet, w.confit, w.foie-gras, w.tempérament, w.caractère, w.chaleureux, w.accueillant, w.susceptible, w.têtu, w.râleur, w.râler, w.fanfaron, w.toulousain, w.saucisse]
    sentences:
      - { es: "J'ai eu le coup de foudre pour Toulouse dès le premier soir, place du Capitole.", en: "I fell in love with Toulouse on the very first evening, on the Place du Capitole.", altEs: ["J'ai eu un coup de foudre pour Toulouse dès le premier soir, place du Capitole."], grammar: [g.idioms-everyday], vocab: [w.avoir-le-coup-de-foudre] }
      - { es: "Tu peux me donner un coup de main pour porter les cartons ?", en: "Can you give me a hand carrying the boxes?", altEs: ["Tu peux me filer un coup de main pour porter les cartons ?", "Pourrais-tu me donner un coup de main pour porter les cartons ?"], grammar: [g.idioms-everyday, g.modal-verbs], vocab: [w.coup-de-main], transform: { instruction: "Make it polite, for a neighbour you don't know (vous)", answer: "Pourriez-vous me donner un coup de main pour porter les cartons ?", alt: ["Vous pourriez me donner un coup de main pour porter les cartons ?", "Pouvez-vous me donner un coup de main pour porter les cartons ?"], en: "Could you give me a hand carrying the boxes?" } }
      - { es: "Passe-moi un coup de fil quand tu arrives à la gare Matabiau.", en: "Give me a call when you get to Matabiau station.", altEs: ["Passe-moi un coup de fil quand tu arriveras à la gare Matabiau.", "Appelle-moi quand tu arrives à la gare Matabiau."], grammar: [g.idioms-everyday, g.imperative], vocab: [w.coup-de-fil] }
      - { es: "J'ai pris un sacré coup de soleil au bord de la Garonne.", en: "I got badly sunburnt on the banks of the Garonne.", altEs: ["J'ai attrapé un sacré coup de soleil au bord de la Garonne."], grammar: [g.idioms-everyday], vocab: [w.coup-de-soleil] }
      - { es: "Il fait semblant de ne pas comprendre l'occitan, mais il le parle très bien.", en: "He pretends not to understand Occitan, but he speaks it very well.", altEs: ["Il fait semblant de ne pas comprendre l'occitan alors qu'il le parle très bien."], grammar: [g.idioms-everyday, g.infinitive-clauses], vocab: [w.faire-semblant, w.occitan], error: { wrong: "Il fait semblant de ne comprendre pas l'occitan, mais il le parle très bien.", explain: "Before an infinitive, ne and pas stay together: de ne pas comprendre.", grammar: g.infinitive-clauses } }
      - { es: "Tu as enfin rendu ton mémoire ? Il était temps !", en: "You've finally handed in your dissertation? About time too!", altEs: ["Tu as enfin rendu ton mémoire ? Il était grand temps !"], grammar: [g.idioms-everyday], vocab: [w.il-était-temps] }
      - { es: "On a réparé le vélo tant bien que mal, et il roule encore.", en: "We repaired the bike after a fashion, and it still works.", altEs: ["Nous avons réparé le vélo tant bien que mal, et il roule encore."], grammar: [g.idioms-everyday, g.on-nous], vocab: [w.tant-bien-que-mal] }
      - { es: "Venez dîner dimanche, ce sera à la bonne franquette : un cassoulet et du vin rouge.", en: "Come for dinner on Sunday, it'll be very informal: a cassoulet and some red wine.", altEs: ["Venez dîner dimanche, ce sera à la bonne franquette, un cassoulet et du vin rouge."], grammar: [g.idioms-everyday, g.futur-simple-forms], vocab: [w.à-la-bonne-franquette, w.cassoulet] }
      - { es: "Un vrai cassoulet toulousain, c'est des haricots, du confit de canard et de la saucisse de Toulouse.", en: "A real Toulouse cassoulet is beans, duck confit and Toulouse sausage.", altEs: ["Dans un vrai cassoulet toulousain, il y a des haricots, du confit de canard et de la saucisse de Toulouse."], grammar: [g.partitive-articles], vocab: [w.cassoulet, w.confit, w.toulousain], note: "Toulouse, Castelnaudary and Carcassonne each claim their own version of the cassoulet." }
      - { es: "Le foie gras du Sud-Ouest, ça ne coûte pas trois sous, mais c'est la fête.", en: "Foie gras from the Southwest isn't cheap, but it's a treat.", altEs: ["Le foie gras du Sud-Ouest n'est pas bon marché, mais c'est la fête."], grammar: [g.idioms-everyday], vocab: [w.foie-gras] }
      - { es: "Mon grand-père a un tempérament de feu : il râle contre l'arbitre à chaque match.", en: "My grandfather has a fiery temperament: he grumbles at the referee at every match.", altEs: ["Mon grand-père a un tempérament de feu, il râle contre l'arbitre à chaque match."], grammar: [g.idioms-everyday], vocab: [w.tempérament, w.râler] }
      - { es: "Elle a bon caractère, mais elle est un peu susceptible quand on parle de son accent.", en: "She's good-natured, but she's a bit touchy when people talk about her accent.", altEs: ["Elle a bon caractère, mais elle devient susceptible quand on parle de son accent."], grammar: [g.adjective-agreement], vocab: [w.caractère, w.susceptible] }
      - { es: "Les gens d'ici sont chaleureux et accueillants ; on se sent tout de suite chez soi.", en: "People here are warm and welcoming; you feel at home straight away.", altEs: ["Les gens d'ici sont chaleureux et accueillants : on se sent tout de suite chez soi."], grammar: [g.adjective-agreement], vocab: [w.chaleureux, w.accueillant] }
      - { es: "Ma sœur est têtue comme une mule et râleuse comme notre père.", en: "My sister is as stubborn as a mule and as grumpy as our father.", altEs: ["Ma sœur est aussi têtue qu'une mule et aussi râleuse que notre père."], grammar: [g.adjective-agreement, g.comparatives], vocab: [w.têtu, w.râleur], transform: { instruction: "Change 'ma sœur' to 'mon frère'", answer: "Mon frère est têtu comme une mule et râleur comme notre père.", alt: ["Mon frère est aussi têtu qu'une mule et aussi râleur que notre père."], en: "My brother is as stubborn as a mule and as grumpy as our father." } }
      - { es: "Ne sois pas si fanfaron : tu n'as marqué qu'un seul essai.", en: "Don't be such a show-off: you only scored one try.", altEs: ["Ne fais pas le fanfaron : tu n'as marqué qu'un seul essai."], grammar: [g.imperative], vocab: [w.fanfaron, w.essai] }
    exchanges:
      - q: { es: "Comment vous vous êtes rencontrés, tous les deux ?", en: "How did you two meet?" }
        a: { es: "Dans un café de la place Saint-Pierre : un vrai coup de foudre.", en: "In a café on the Place Saint-Pierre: love at first sight." }
        alt: ["Au stade ; j'ai eu le coup de foudre à la mi-temps.", "Grâce à un ami commun, tout simplement."]
        grammar: [g.idioms-everyday]
        vocab: [w.coup-de-foudre]
      - q: { es: "Tu viens dîner samedi ? Rien de compliqué, hein.", en: "Are you coming for dinner on Saturday? Nothing fancy, mind." }
        a: { es: "Avec plaisir ! J'adore les repas à la bonne franquette.", en: "With pleasure! I love informal meals." }
        alt: ["Volontiers, j'apporte le dessert.", "Oui, si c'est un cassoulet, je ne dis pas non !"]
        grammar: [g.idioms-everyday]
        vocab: [w.à-la-bonne-franquette]
      - q: { es: "Ton père n'a pas l'air content.", en: "Your father doesn't look happy." }
        a: { es: "Il râle pour le principe : c'est un vrai Toulousain, il adore se plaindre de l'arbitre.", en: "He grumbles on principle: he's a real Toulousain, he loves complaining about the referee." }
        alt: ["Ne t'inquiète pas, il est râleur mais il a bon caractère.", "C'est son tempérament, ça va passer."]
        grammar: [g.idioms-everyday]
        vocab: [w.râler, w.toulousain]
      - q: { es: "Tu es tout rouge ! Qu'est-ce qui t'est arrivé ?", en: "You're all red! What happened to you?" }
        a: { es: "Un coup de soleil : je me suis endormi au bord du canal du Midi.", en: "Sunburn: I fell asleep on the bank of the Canal du Midi." }
        alt: ["J'ai pris un coup de soleil au match.", "Rien, je suis juste un peu gêné."]
        grammar: [g.idioms-everyday]
        vocab: [w.coup-de-soleil]
      - q: { es: "Il a vraiment oublié notre rendez-vous ?", en: "Did he really forget our appointment?" }
        a: { es: "Il fait semblant ; en réalité, il n'avait pas envie de venir.", en: "He's pretending; actually, he didn't feel like coming." }
        alt: ["Je crois qu'il fait semblant.", "Oui, il a la tête dans les nuages en ce moment."]
        grammar: [g.idioms-everyday]
        vocab: [w.faire-semblant]
    texts:
      - title: "Invitation"
        es: ["Dimanche midi, cassoulet à la maison, à la bonne franquette.", "Apportez du pain et votre bonne humeur.", "Passez-moi un coup de fil si vous êtes en retard !"]
        en: ["Sunday lunch, cassoulet at home, nothing fancy.", "Bring some bread and your good mood.", "Give me a call if you're running late!"]
        grammar: [g.idioms-everyday, g.imperative]
        vocab: [w.à-la-bonne-franquette, w.coup-de-fil, w.humeur]
      - title: "Portrait de mon coloc"
        es: ["Hugo est têtu, un peu râleur et très susceptible.", "Mais il a bon caractère et il est toujours prêt à donner un coup de main.", "Bref, je ne l'échangerais pour rien au monde."]
        en: ["Hugo is stubborn, a bit grumpy and very touchy.", "But he's good-natured and always ready to lend a hand.", "In short, I wouldn't swap him for anything in the world."]
        grammar: [g.adjective-agreement]
        vocab: [w.têtu, w.râleur, w.susceptible, w.caractère, w.coup-de-main]
    spicy:
      - { es: "Coup de foudre ou coup de soleil ? Depuis que je t'ai vu, j'ai les joues toutes rouges.", en: "Love at first sight or sunburn? Since I saw you, my cheeks have been bright red.", altEs: ["Coup de foudre ou coup de soleil ? Depuis que je t'ai vue, j'ai les joues toutes rouges."], grammar: [g.idioms-everyday], vocab: [w.coup-de-foudre, w.coup-de-soleil] }
      - { es: "Tu fais semblant d'aimer le rugby pour me plaire, avoue.", en: "You're pretending to like rugby to impress me, admit it.", altEs: ["Avoue : tu fais semblant d'aimer le rugby pour me plaire."], grammar: [g.idioms-everyday], vocab: [w.faire-semblant] }
      - { es: "Tu m'as enfin invitée à dîner ? Il était temps !", en: "You've finally asked me to dinner? About time too!", altEs: ["Tu m'as enfin invité à dîner ? Il était temps !"], grammar: [g.idioms-everyday], vocab: [w.il-était-temps] }
      - { es: "J'ai besoin d'un coup de main pour fermer cette robe… et d'un compliment, aussi.", en: "I need a hand doing up this dress… and a compliment, too.", altEs: ["J'ai besoin d'un coup de main pour fermer ma robe, et d'un compliment aussi."], grammar: [g.idioms-everyday], vocab: [w.coup-de-main] }
      - { es: "Il est têtu, râleur et fanfaron, mais quand il cuisine le cassoulet, je lui pardonne tout.", en: "He's stubborn, grumpy and boastful, but when he cooks cassoulet, I forgive him everything.", altEs: ["Il est têtu, râleur et fanfaron, mais quand il fait le cassoulet, je lui pardonne tout."], grammar: [g.adjective-agreement], vocab: [w.têtu, w.râleur, w.fanfaron, w.cassoulet] }
  - id: c1.u07.l4
    title: Qui vivra verra
    teach: [g.proverbs]
    tip: "Proverbs are frozen: no article (Pierre qui roule…), qui meaning 'whoever' (Qui vivra verra), ellipsis (Chacun son goût). French speakers often quote only the first half: Quand le chat n'est pas là…"
    vocab: [w.proverbe, w.dicton, w.il-ne-faut-pas-vendre-la-peau-de-l-ours, w.tuer, w.qui-vivra-verra, w.petit-à-petit-l-oiseau-fait-son-nid, w.l-habit-ne-fait-pas-le-moine, w.pierre-qui-roule-n-amasse-pas-mousse, w.vouloir-le-beurre-et-l-argent-du-beurre, w.chacun-son-goût, w.aide-toi-le-ciel-t-aidera, w.les-absents-ont-toujours-tort, w.mieux-vaut-prévenir-que-guérir, w.la-nuit-porte-conseil, w.après-la-pluie-le-beau-temps]
    sentences:
      - { es: "On mène de dix points, mais il ne faut pas vendre la peau de l'ours avant de l'avoir tué.", en: "We're ten points ahead, but don't count your chickens before they hatch.", altEs: ["On a dix points d'avance, mais il ne faut pas vendre la peau de l'ours avant de l'avoir tué."], grammar: [g.proverbs, g.apres-avoir-avant-de], vocab: [w.il-ne-faut-pas-vendre-la-peau-de-l-ours, w.tuer] }
      - { es: "Est-ce qu'on va gagner le championnat ? Qui vivra verra.", en: "Are we going to win the championship? Time will tell.", altEs: ["On va gagner le championnat ? Qui vivra verra."], grammar: [g.proverbs], vocab: [w.qui-vivra-verra] }
      - { es: "Mon occitan progresse lentement, mais petit à petit, l'oiseau fait son nid.", en: "My Occitan is coming along slowly, but little by little it'll get there.", altEs: ["Mon occitan progresse doucement, mais petit à petit, l'oiseau fait son nid."], grammar: [g.proverbs], vocab: [w.petit-à-petit-l-oiseau-fait-son-nid, w.occitan] }
      - { es: "Il a l'air sévère, mais l'habit ne fait pas le moine : c'est le plus gentil des profs.", en: "He looks stern, but don't judge a book by its cover: he's the nicest of teachers.", altEs: ["Il a l'air sévère, mais l'habit ne fait pas le moine, c'est le plus gentil des profs."], grammar: [g.proverbs, g.superlatives], vocab: [w.l-habit-ne-fait-pas-le-moine] }
      - { es: "Il a changé six fois de métier ; pierre qui roule n'amasse pas mousse, disait sa mère.", en: "He's changed jobs six times; a rolling stone gathers no moss, as his mother used to say.", altEs: ["Il a changé six fois de travail ; pierre qui roule n'amasse pas mousse, disait sa mère."], grammar: [g.proverbs, g.imparfait-uses], vocab: [w.pierre-qui-roule-n-amasse-pas-mousse] }
      - { es: "Tu veux un salaire de ministre et travailler deux jours par semaine ? Tu veux le beurre et l'argent du beurre !", en: "You want a minister's salary and to work two days a week? You want to have your cake and eat it!", altEs: ["Un salaire de ministre pour deux jours par semaine ? Tu veux le beurre et l'argent du beurre !"], grammar: [g.proverbs], vocab: [w.vouloir-le-beurre-et-l-argent-du-beurre] }
      - { es: "Tu préfères le cassoulet de Castelnaudary ? Chacun son goût.", en: "You prefer the Castelnaudary cassoulet? Each to their own.", altEs: ["Tu préfères le cassoulet de Castelnaudary ? Chacun ses goûts."], grammar: [g.proverbs], vocab: [w.chacun-son-goût, w.cassoulet] }
      - { es: "Arrête d'attendre un miracle : aide-toi, le ciel t'aidera.", en: "Stop waiting for a miracle: God helps those who help themselves.", altEs: ["Arrête d'attendre un miracle, aide-toi, le ciel t'aidera."], grammar: [g.proverbs, g.imperative], vocab: [w.aide-toi-le-ciel-t-aidera] }
      - { es: "Tu n'es pas venu à la réunion, alors on t'a tout mis sur le dos : les absents ont toujours tort.", en: "You didn't come to the meeting, so we blamed everything on you: the absent are always in the wrong.", altEs: ["Tu n'es pas venu à la réunion, donc on t'a tout mis sur le dos : les absents ont toujours tort."], grammar: [g.proverbs], vocab: [w.les-absents-ont-toujours-tort] }
      - { es: "Prends un imperméable pour le match ; mieux vaut prévenir que guérir.", en: "Take a raincoat for the match; better safe than sorry.", altEs: ["Prends un imperméable pour le match, mieux vaut prévenir que guérir."], grammar: [g.proverbs, g.imperative], vocab: [w.mieux-vaut-prévenir-que-guérir], error: { wrong: "Prends un imperméable pour le match ; c'est mieux prévenir que guérir.", explain: "Proverbs are fixed: mieux vaut prévenir que guérir, with no article or extra words.", grammar: g.proverbs } }
      - { es: "Ne réponds pas tout de suite à cette offre : la nuit porte conseil.", en: "Don't reply to that offer straight away: sleep on it.", altEs: ["Ne réponds pas tout de suite à cette offre, la nuit porte conseil."], grammar: [g.proverbs, g.imperative], vocab: [w.la-nuit-porte-conseil], transform: { instruction: "Say it to your boss (vous)", answer: "Ne répondez pas tout de suite à cette offre : la nuit porte conseil.", alt: ["Ne répondez pas tout de suite à cette offre, la nuit porte conseil."], en: "Don't reply to that offer straight away: sleep on it." } }
      - { es: "On a perdu en demi-finale, mais après la pluie, le beau temps !", en: "We lost in the semi-final, but every cloud has a silver lining!", altEs: ["Nous avons perdu en demi-finale, mais après la pluie, le beau temps !"], grammar: [g.proverbs], vocab: [w.après-la-pluie-le-beau-temps] }
      - { es: "Quand le chat n'est pas là, les souris dansent : le chef est en vacances et personne ne travaille.", en: "When the cat's away, the mice will play: the boss is on holiday and nobody is working.", altEs: ["Quand le chat n'est pas là, les souris dansent : la cheffe est en vacances et personne ne travaille."], grammar: [g.proverbs], vocab: [w.proverbe] }
      - { es: "Garde ton pull : comme dit le dicton, en avril, ne te découvre pas d'un fil.", en: "Keep your jumper on: as the saying goes, in April don't shed a single thread.", altEs: ["Garde ton pull, comme dit le dicton : en avril, ne te découvre pas d'un fil."], altEn: ["Keep your sweater on: as the saying goes, ne'er cast a clout till May is out."], grammar: [g.proverbs, g.imperative], vocab: [w.dicton] }
      - { es: "N'abuse pas des proverbes : un seul, bien placé, suffit.", en: "Don't overdo the proverbs: a single well-placed one is enough.", altEs: ["N'abuse pas des proverbes, un seul bien placé suffit."], grammar: [g.proverbs, g.imperative], vocab: [w.proverbe], transform: { instruction: "Say it to a group of students (vous)", answer: "N'abusez pas des proverbes : un seul, bien placé, suffit.", alt: ["N'abusez pas des proverbes, un seul bien placé suffit."], en: "Don't overdo the proverbs: a single well-placed one is enough." } }
    exchanges:
      - q: { es: "Tu crois que Toulouse va être champion cette année ?", en: "Do you think Toulouse will be champions this year?" }
        a: { es: "Il ne faut pas vendre la peau de l'ours avant de l'avoir tué.", en: "Let's not count our chickens before they hatch." }
        alt: ["Qui vivra verra.", "Ne vendons pas la peau de l'ours !"]
        grammar: [g.proverbs]
        vocab: [w.il-ne-faut-pas-vendre-la-peau-de-l-ours]
      - q: { es: "Je n'arrive pas à décider si j'accepte ce poste à Paris.", en: "I can't decide whether to accept this job in Paris." }
        a: { es: "Dors dessus : la nuit porte conseil.", en: "Sleep on it: things will look clearer in the morning." }
        alt: ["La nuit porte conseil, tu verras demain.", "Qui ne tente rien n'a rien !"]
        grammar: [g.proverbs]
        vocab: [w.la-nuit-porte-conseil]
      - q: { es: "Il a l'air d'un voyou, ton nouveau voisin.", en: "Your new neighbour looks like a thug." }
        a: { es: "L'habit ne fait pas le moine : il est infirmier et adorable.", en: "Don't judge a book by its cover: he's a nurse and lovely." }
        alt: ["L'habit ne fait pas le moine, tu sais.", "Ne te fie pas aux apparences."]
        grammar: [g.proverbs]
        vocab: [w.l-habit-ne-fait-pas-le-moine]
      - q: { es: "J'ai raté mon examen de pilote. Je suis nul.", en: "I failed my pilot's exam. I'm hopeless." }
        a: { es: "Mais non ! Après la pluie, le beau temps ; tu le repasseras en juin.", en: "Of course not! Things will get better; you'll retake it in June." }
        alt: ["Petit à petit, l'oiseau fait son nid.", "Mieux vaut tard que jamais : tu l'auras la prochaine fois."]
        grammar: [g.proverbs]
        vocab: [w.après-la-pluie-le-beau-temps]
      - q: { es: "Pourquoi tu prends un parapluie ? Il fait grand soleil.", en: "Why are you taking an umbrella? It's bright sunshine." }
        a: { es: "Mieux vaut prévenir que guérir : à Toulouse, l'orage arrive vite.", en: "Better safe than sorry: in Toulouse, storms come quickly." }
        alt: ["Mieux vaut prévenir que guérir.", "On ne sait jamais !"]
        grammar: [g.proverbs]
        vocab: [w.mieux-vaut-prévenir-que-guérir]
    texts:
      - title: "Le proverbe du jour"
        es: ["Petit à petit, l'oiseau fait son nid.", "Autrement dit, les grands projets se construisent pas à pas.", "Airbus n'a pas assemblé son premier avion en un jour !"]
        en: ["Little by little the bird builds its nest.", "In other words, big projects are built step by step.", "Airbus didn't assemble its first plane in a day!"]
        grammar: [g.proverbs]
        vocab: [w.petit-à-petit-l-oiseau-fait-son-nid, w.proverbe]
      - title: "Message d'une amie"
        es: ["Tu n'étais pas à la réunion du club hier soir.", "Comme les absents ont toujours tort, tu es désormais trésorier !", "Qui vivra verra si c'était une bonne idée…"]
        en: ["You weren't at the club meeting last night.", "Since the absent are always in the wrong, you're now treasurer!", "Time will tell whether it was a good idea…"]
        grammar: [g.proverbs]
        vocab: [w.les-absents-ont-toujours-tort, w.qui-vivra-verra]
    spicy:
      - { es: "Tu veux mon numéro sans m'offrir un verre ? Tu veux le beurre et l'argent du beurre !", en: "You want my number without buying me a drink? You want to have your cake and eat it!", altEs: ["Tu veux mon numéro sans m'offrir un verre ? Tu veux le beurre et l'argent du beurre, toi !"], grammar: [g.proverbs], vocab: [w.vouloir-le-beurre-et-l-argent-du-beurre] }
      - { es: "Qui ne tente rien n'a rien : tu danses avec moi ?", en: "Nothing ventured, nothing gained: will you dance with me?", altEs: ["Qui ne tente rien n'a rien, tu danses avec moi ?"], grammar: [g.proverbs], vocab: [w.proverbe] }
      - { es: "L'habit ne fait pas le moine, mais ta chemise m'a quand même fait de l'effet.", en: "Clothes don't make the man, but your shirt still had quite an effect on me.", altEs: ["L'habit ne fait pas le moine, mais ta chemise m'a fait de l'effet quand même."], grammar: [g.proverbs], vocab: [w.l-habit-ne-fait-pas-le-moine] }
      - { es: "Tu veux un deuxième rendez-vous ? La nuit porte conseil… appelle-moi demain matin.", en: "You want a second date? Sleep on it… call me tomorrow morning.", altEs: ["Un deuxième rendez-vous ? La nuit porte conseil : appelle-moi demain matin."], grammar: [g.proverbs], vocab: [w.la-nuit-porte-conseil] }
      - { es: "Petit à petit, l'oiseau fait son nid : d'abord un café, puis un dîner, et qui vivra verra.", en: "Little by little: first a coffee, then a dinner, and time will tell.", altEs: ["Petit à petit, l'oiseau fait son nid : un café, puis un dîner, et qui vivra verra."], grammar: [g.proverbs], vocab: [w.petit-à-petit-l-oiseau-fait-son-nid, w.qui-vivra-verra] }
dialogues:
  - id: c1.u07.d1
    title: Après le match
    context: Léa, who has just moved to Toulouse, and her colleague Karim, a lifelong fan, leave the stadium after a Stade Toulousain match.
    lines:
      - { speaker: Karim, es: "Alors, ton premier match de rugby ? Avoue que tu as eu le coup de foudre.", en: "So, your first rugby match? Admit you fell in love with it." }
      - { speaker: Léa, es: "J'ai adoré l'ambiance ! Mais pendant la mêlée, j'étais un peu dans la lune, je ne comprenais rien.", en: "I loved the atmosphere! But during the scrum I was a bit lost, I didn't understand a thing." }
      - { speaker: Karim, es: "Ne t'inquiète pas, petit à petit, l'oiseau fait son nid. Mon père t'expliquera tout : il a une mémoire d'éléphant.", en: "Don't worry, little by little you'll get there. My father will explain everything: he has a memory like an elephant." }
      - { speaker: Léa, es: "Ton père, c'est le monsieur qui criait sur l'arbitre ?", en: "Your father is the man who was shouting at the referee?" }
      - { speaker: Karim, es: "Lui-même. Il n'a pas sa langue dans sa poche, mais il a le cœur sur la main : il nous invite ce soir.", en: "The very same. He's outspoken, but he's very generous: he's inviting us tonight." }
      - { speaker: Léa, es: "C'est gentil ! Mais je ne voudrais pas déranger…", en: "That's kind! But I wouldn't want to impose…" }
      - { speaker: Karim, es: "Tu ne déranges pas, c'est à la bonne franquette. Cassoulet maison ; tu vas te régaler.", en: "You're not imposing, it's very informal. Homemade cassoulet; you're going to love it." }
      - { speaker: Léa, es: "Un cassoulet après un match ? J'ai une faim de loup, je ne dis pas non.", en: "A cassoulet after a match? I'm starving, I won't say no." }
      - { speaker: Karim, es: "Par contre, ne mets pas les pieds dans le plat : ne dis jamais que tu préfères celui de Castelnaudary !", en: "But don't put your foot in it: never say you prefer the one from Castelnaudary!" }
      - { speaker: Léa, es: "Promis. Et la semaine prochaine, Toulouse sera champion ?", en: "Promise. And next week, will Toulouse be champions?" }
      - { speaker: Karim, es: "Il ne faut pas vendre la peau de l'ours avant de l'avoir tué. Qui vivra verra !", en: "Let's not count our chickens before they hatch. Time will tell!" }
    questions:
      - { q: "Qu'est-ce que Léa n'a pas compris pendant le match ?", options: ["Le score", "La mêlée", "Les chants des supporters", "Les horaires"], answer: 1, explain: "« Pendant la mêlée, j'étais un peu dans la lune, je ne comprenais rien. »" }
      - { q: "Comment est le père de Karim ?", options: ["Timide et avare", "Franc et très généreux", "Calme et silencieux"], answer: 1, explain: "Il « n'a pas sa langue dans sa poche » (outspoken) et il « a le cœur sur la main » (generous)." }
      - { q: "Que signifie « à la bonne franquette » dans ce dialogue ?", options: ["Un repas simple, sans cérémonie", "Un repas très cher", "Un repas au restaurant"], answer: 0, explain: "À la bonne franquette = informally, without fuss." }
      - { q: "Quelle erreur Léa doit-elle éviter au dîner ?", options: ["Arriver en retard", "Parler de rugby", "Dire qu'elle préfère le cassoulet de Castelnaudary", "Refuser le dessert"], answer: 2, explain: "« Ne mets pas les pieds dans le plat : ne dis jamais que tu préfères celui de Castelnaudary ! »" }
writing:
  - task: "Tell a funny anecdote about a bad day in Toulouse, using at least three everyday idioms (il pleut des cordes, poser un lapin, avoir le cafard, avoir une faim de loup…)."
    min: 110
    max: 190
    use: [w.il-pleut-des-cordes, w.poser-un-lapin, w.avoir-le-cafard, w.avoir-une-faim-de-loup, w.être-aux-anges]
    useAtLeast: 3
    grammar: [g.idioms-everyday]
    expect:
      - { pattern: "(pleu[a-z]* des cordes|un lapin|cafard|dans la lune|pain sur la planche|grasse matin|faim de loup|aux anges|dans (son|mon|ton) assiette|langue au chat|les pieds|fin des haricots|grain de sel|des salades|anguille sous roche|poil dans la main|chat dans la gorge|m[eé]moire d['’][eé]l[eé]phant)", hint: "Use everyday idioms: il pleut des cordes, poser un lapin, avoir le cafard…" }
    model: { es: "Samedi dernier, j'avais rendez-vous avec Julie place du Capitole. Évidemment, ce jour-là, il pleuvait des cordes sur la Ville rose. J'ai attendu une heure sous mon parapluie : elle m'a posé un lapin ! J'avais le cafard, alors je suis entré dans une brasserie. J'avais une faim de loup et j'ai commandé un énorme cassoulet. Au moment de payer, je me suis rendu compte que j'avais oublié mon portefeuille. C'était la fin des haricots ! Heureusement, le serveur, qui avait le cœur sur la main, m'a laissé revenir le lendemain. En sortant, j'ai reçu un message de Julie : elle était dans la lune et s'était trompée de jour. Finalement, quand je l'ai revue, j'étais aux anges.", en: "Last Saturday I had a date with Julie on the place du Capitole. Of course, that day it was pouring with rain on the Pink City. I waited an hour under my umbrella: she stood me up! I was feeling down, so I went into a brasserie. I was ravenous and ordered an enormous cassoulet. When it came to paying, I realised I'd forgotten my wallet. That was the last straw! Luckily the waiter, who was kindness itself, let me come back the next day. On the way out I got a message from Julie: she'd had her head in the clouds and got the day wrong. In the end, when I saw her again, I was over the moon." }
  - task: "Describe the character of a friend, relative or colleague using body idioms (avoir le cœur sur la main, ne pas avoir sa langue dans sa poche, avoir la main verte, avoir les dents longues…)."
    min: 110
    max: 190
    use: [w.avoir-le-cœur-sur-la-main, w.ne-pas-avoir-sa-langue-dans-sa-poche, w.avoir-la-main-verte, w.mettre-les-pieds-dans-le-plat, w.avoir-les-dents-longues]
    useAtLeast: 3
    grammar: [g.idioms-body]
    expect:
      - { pattern: "(c[oœ]eur sur la main|langue dans sa poche|bras long|main verte|dents longues|t[eê]te dans les nuages|pieds dans le plat|main [aà] la p[aâ]te|serrer les coudes|jambes [aà] son cou|yeux de la t[eê]te|fait la t[eê]te|clin d['’][oœ]eil|vers du nez|bonne mine)", hint: "Use body idioms: avoir le cœur sur la main, avoir la main verte…" }
    model: { es: "Ma tante Josette est un vrai personnage toulousain. Elle a le cœur sur la main : elle invite tout le quartier pour le cassoulet du dimanche et ne laisse jamais personne repartir les mains vides. Mais attention, elle n'a pas sa langue dans sa poche ! Quand quelque chose lui déplaît, elle le dit franchement, quitte à mettre les pieds dans le plat devant les invités. Elle a aussi la main verte : son jardin est le plus beau de la rue, et ses tomates font des jaloux. Son fils, en revanche, a les dents longues : il rêve de devenir directeur chez Airbus. Josette lui répète souvent qu'il ferait mieux de mettre la main à la pâte à la maison.", en: "My aunt Josette is a real Toulouse character. She's incredibly generous: she invites the whole neighbourhood for Sunday cassoulet and never lets anyone leave empty-handed. But watch out, she doesn't mince her words! When she doesn't like something, she says so frankly, even if it means putting her foot in it in front of the guests. She also has green fingers: her garden is the most beautiful in the street, and her tomatoes make people jealous. Her son, on the other hand, is very ambitious: he dreams of becoming a manager at Airbus. Josette often tells him he'd do better to pitch in at home." }
  - task: "Text a friend: you have fallen in love with a flat in Toulouse and need help moving in. Use idioms with coup (coup de foudre, coup de main, coup de fil) and others (à la bonne franquette, tant bien que mal)."
    min: 110
    max: 190
    use: [w.coup-de-foudre, w.coup-de-main, w.coup-de-fil, w.à-la-bonne-franquette, w.tant-bien-que-mal]
    useAtLeast: 3
    grammar: [g.idioms-everyday, g.idioms-body]
    expect:
      - { pattern: "\\bcoups? (de|d['’])\\s?(main|fil|foudre|soleil|t[eê]te|[oœ]il|pouce)", hint: "Use idioms with coup: un coup de main, un coup de fil, un coup de foudre…" }
      - { pattern: "(bonne franquette|tant bien que mal|faire semblant|il [eé]tait temps|grain de sel|pain sur la planche|serrer les coudes)", hint: "Add another idiom: à la bonne franquette, tant bien que mal…" }
    model: { es: "Salut, Romain ! Grande nouvelle : j'ai trouvé un appartement ! Dès la première visite, ça a été le coup de foudre : des murs en brique rose, une grande terrasse et une vue sur la Garonne. Il était temps, après six mois de recherches ! Je déménage samedi, et j'aurais bien besoin d'un coup de main. On a du pain sur la planche : il faut monter tous les meubles et les boîtes au quatrième étage, sans ascenseur. Mon frère viendra aussi, mais il a un poil dans la main, alors je compte surtout sur toi. Le soir, on mangera à la bonne franquette, assis par terre, et on s'organisera tant bien que mal. Passe-moi un coup de fil pour me dire si tu es libre !", en: "Hi, Romain! Big news: I've found a flat! From the first visit it was love at first sight: pink brick walls, a big terrace and a view of the Garonne. About time, after six months of searching! I'm moving on Saturday, and I could really do with a hand. We've got our work cut out: all the furniture and boxes have to go up to the fourth floor, with no lift. My brother will come too, but he's bone idle, so I'm mostly counting on you. In the evening we'll have a simple meal, sitting on the floor, and we'll manage as best we can. Give me a ring to tell me if you're free!" }
  - task: "A friend is hesitating about opening a restaurant in Toulouse. Give advice using proverbs appropriately (Qui vivra verra, Petit à petit l'oiseau fait son nid, Il ne faut pas vendre la peau de l'ours avant de l'avoir tué…)."
    es: "J'ai envie d'ouvrir un restaurant de cassoulet, mais j'ai peur de tout perdre…"
    min: 110
    max: 190
    use: [w.proverbe, w.qui-vivra-verra, w.petit-à-petit-l-oiseau-fait-son-nid, w.mieux-vaut-prévenir-que-guérir, w.la-nuit-porte-conseil]
    useAtLeast: 3
    grammar: [g.proverbs]
    expect:
      - { pattern: "(qui vivra verra|petit [aà] petit|peau de l['’]ours|habit ne fait pas|pierre qui roule|beurre et l['’]argent|chacun son go[uû]t|aide-toi|absents ont toujours tort|mieux vaut pr[eé]venir|nuit porte conseil|apr[eè]s la pluie)", hint: "Use a proverb: Qui vivra verra, Petit à petit l'oiseau fait son nid…" }
    model: { es: "Je comprends ta peur, mais ton projet me semble excellent ! Comme dit le proverbe, petit à petit l'oiseau fait son nid : commence par un petit local, avec une carte courte, et agrandis-toi plus tard si ça marche. Par contre, mieux vaut prévenir que guérir : prépare un budget sérieux et demande conseil à ta banque avant de signer quoi que ce soit. Et surtout, ne vends pas la peau de l'ours avant de l'avoir tué : n'achète pas tout le matériel avant d'avoir trouvé des clients. Tu ne peux pas vouloir le beurre et l'argent du beurre, il y aura forcément des risques. Réfléchis encore ce week-end, la nuit porte conseil. Après, qui vivra verra !", en: "I understand your fear, but your project seems excellent to me! As the proverb says, little by little the bird builds its nest: start with small premises and a short menu, and expand later if it works. On the other hand, better safe than sorry: prepare a serious budget and ask your bank for advice before signing anything. And above all, don't count your chickens before they hatch: don't buy all the equipment before you've found customers. You can't have your cake and eat it, there will inevitably be risks. Think it over again this weekend, sleep on it. After that, time will tell!" }
