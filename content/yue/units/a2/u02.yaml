id: a2.u02
title: 我做緊嘢
lessons:
  - id: a2.u02.l1
    title: 你做緊乜嘢呀？
    teach: [g.gan-progressive]
    tip: "緊 goes right after the verb and before its object: 食緊飯, 瞓緊覺, 排緊隊."
    vocab: [w.gan2, w.zou6-gan2-je5, w.zyu2-gan2-faan6, w.dang2-gan2, w.fan3-gan2-gaau3, w.se2, w.daa2-zi6, w.wan1-syu1, w.ngoi6-min6, w.sak1-ce1, w.paai4-deoi2, w.king1, w.din6-jau4, w.bo1-haai4, w.deoi2.b, w.wan1, w.haau2-si5, w.sak1]
    sentences:
      - { es: "你做緊乜嘢呀？", en: "What are you doing?", altEs: ["你做緊咩呀？", "你而家做緊乜嘢呀？", "你做緊咩嘢呀？"], altEn: ["What are you up to?"], grammar: [g.gan-progressive], vocab: [w.gan2], transform: { instruction: "Ask what they are doing", answer: "佢哋做緊乜嘢呀？", alt: ["佢哋做緊咩呀？", "佢哋做緊咩嘢呀？"], en: "What are they doing?" } }
      - { es: "我做緊嘢，一陣再傾。", en: "I'm working; let's talk later.", altEs: ["我做緊嘢，遲啲再傾。", "我做緊嘢，等陣再傾。"], altEn: ["I'm busy at work, talk later."], grammar: [g.gan-progressive], vocab: [w.zou6-gan2-je5] }
      - { es: "阿媽煮緊飯。", en: "Mum's cooking.", altEs: ["媽媽煮緊飯。"], altEn: ["Mum is making dinner."], grammar: [g.gan-progressive], vocab: [w.zyu2-gan2-faan6], error: { wrong: "阿媽緊煮飯。", explain: "緊 goes after the verb, not before it: 煮緊飯.", grammar: g.gan-progressive } }
      - { es: "我喺旺角等緊小巴。", en: "I'm waiting for a minibus in Mong Kok.", altEs: ["我喺旺角等緊架小巴。"], grammar: [g.gan-progressive, g.hai2-location], vocab: [w.dang2-gan2] }
      - { es: "外面落緊雨。", en: "It's raining outside.", altEs: ["出面落緊雨。", "外面而家落緊雨。"], grammar: [g.gan-progressive], vocab: [w.ngoi6-min6], transform: { instruction: "Say it has stopped raining (use 停咗)", answer: "外面停咗雨喇。", alt: ["雨停咗喇。", "出面停咗雨喇。"], en: "It's stopped raining outside." } }
      - { es: "佢瞓緊覺，唔好嘈。", en: "He's sleeping, don't make noise.", altEs: ["佢瞓緊覺，唔好咁嘈。"], altEn: ["She's asleep, keep it down."], grammar: [g.gan-progressive], vocab: [w.fan3-gan2-gaau3], error: { wrong: "佢瞓覺緊，唔好嘈。", explain: "With a verb + object like 瞓覺, 緊 goes in the middle: 瞓緊覺.", grammar: g.gan-progressive } }
      - { es: "我寫緊電郵畀老細。", en: "I'm writing an email to my boss.", altEs: ["我寫緊封電郵畀老細。"], grammar: [g.gan-progressive], vocab: [w.se2] }
      - { es: "佢打緊字，你等佢一陣。", en: "She's typing; wait for her a moment.", altEs: ["佢打緊字，等佢一陣。"], grammar: [g.gan-progressive], vocab: [w.daa2-zi6] }
      - { es: "我哋溫緊書，聽日考試。", en: "We're revising; the exam is tomorrow.", altEs: ["我哋溫緊書，因為聽日考試。"], altEn: ["We're studying, we have an exam tomorrow."], grammar: [g.gan-progressive], vocab: [w.wan1-syu1] }
      - { es: "旺角塞緊車。", en: "There's a traffic jam in Mong Kok.", altEs: ["旺角而家塞緊車。"], altEn: ["The traffic in Mong Kok is jammed right now."], grammar: [g.gan-progressive], vocab: [w.sak1-ce1] }
      - { es: "好多人排緊隊買波鞋。", en: "Lots of people are queuing to buy sneakers.", altEs: ["好多人喺度排緊隊買波鞋。"], grammar: [g.gan-progressive, g.serial-verbs], vocab: [w.paai4-deoi2] }
      - { es: "架巴士嚟緊。", en: "The bus is coming.", altEs: ["巴士嚟緊。"], altEn: ["The bus is on its way."], grammar: [g.gan-progressive, g.classifier-as-the], vocab: [w.gan2] }
      - { es: "嚟緊星期六你得唔得閒呀？", en: "Are you free this coming Saturday?", altEs: ["嚟緊禮拜六你得唔得閒呀？", "你嚟緊星期六得唔得閒呀？"], grammar: [g.gan-progressive, g.a-not-a-questions], vocab: [w.gan2], note: "嚟緊 + time = coming, next." }
      - { es: "我食緊飯，遲啲打畀你。", jp: "ngo5 sik6 gan2 faan6 ci4 di1 daa2 bei2 nei5", en: "I'm eating; I'll call you later.", altEs: ["我食緊飯，一陣打畀你。"], grammar: [g.gan-progressive], vocab: [w.gan2], transform: { instruction: "Change to 'we'", answer: "我哋食緊飯，遲啲打畀你。", alt: ["我哋食緊飯，一陣打畀你。"], en: "We're eating; we'll call you later." } }
      - { es: "你哋傾緊乜嘢呀？", en: "What are you talking about?", altEs: ["你哋傾緊咩呀？"], grammar: [g.gan-progressive], vocab: [w.gan2] }
    exchanges:
      - q: { es: "你做緊乜嘢呀？", en: "What are you doing?" }
        a: { es: "我溫緊書。", en: "I'm revising." }
        alt: ["冇做乜嘢。", "我睇緊電視。", "我做緊功課。"]
        grammar: [g.gan-progressive]
        vocab: [w.wan1-syu1]
      - q: { es: "你喺邊呀？", en: "Where are you?" }
        a: { es: "我喺旺角，等緊巴士。", en: "I'm in Mong Kok, waiting for the bus." }
        alt: ["我喺旺角。", "我喺巴士站等緊車。"]
        grammar: [g.gan-progressive, g.hai2-location]
        vocab: [w.dang2-gan2]
      - q: { es: "外面落緊雨呀？", en: "Is it raining outside?" }
        a: { es: "係呀，記得帶遮。", en: "Yes, remember to take an umbrella." }
        alt: ["冇落雨。", "係呀，落緊大雨。"]
        grammar: [g.gan-progressive]
        vocab: [w.ngoi6-min6]
      - q: { es: "點解咁多人排隊呀？", en: "Why are so many people queuing?" }
        a: { es: "佢哋排緊隊買新款波鞋。", en: "They're queuing for the new sneakers." }
        alt: ["買緊波鞋。", "排隊買波鞋。"]
        grammar: [g.gan-progressive]
        vocab: [w.paai4-deoi2]
      - q: { es: "你到咗未呀？", en: "Are you here yet?" }
        a: { es: "仲未，塞緊車。", en: "Not yet, I'm stuck in traffic." }
        alt: ["塞車呀。", "就快到喇。"]
        grammar: [g.gan-progressive, g.mei-questions]
        vocab: [w.sak1-ce1]
    texts:
      - title: "短訊：塞車"
        es: ["我喺旺角塞緊車。", "你哋食緊飯？", "唔使等我，你哋食先啦。"]
        en: ["I'm stuck in traffic in Mong Kok.", "Are you eating?", "Don't wait for me; go ahead and eat."]
        grammar: [g.gan-progressive]
        vocab: [w.sak1-ce1]
      - title: "波鞋街"
        es: ["星期六嘅波鞋街好多人。", "有啲人排緊隊，有啲人試緊鞋。", "我就喺度食緊雞蛋仔。"]
        en: ["Sneakers Street is packed on Saturdays.", "Some people are queuing and some are trying on shoes.", "Me, I'm eating egg waffles."]
        grammar: [g.gan-progressive]
        vocab: [w.paai4-deoi2, w.gan2]
    spicy:
      - { es: "你做緊乜嘢呀？係咪掛住我呀？", en: "What are you doing? Missing me?", altEs: ["你做緊咩呀？係唔係掛住我呀？"], grammar: [g.gan-progressive], vocab: [w.gan2] }
      - { es: "我溫緊書，不過我諗緊你。", en: "I'm supposed to be revising, but I'm thinking about you.", altEs: ["我溫緊書，但係我諗緊你。"], grammar: [g.gan-progressive], vocab: [w.wan1-syu1] }
      - { es: "唔好打畀我，我食緊飯⋯⋯算啦，打啦。", en: "Don't call me, I'm eating... oh fine, call.", altEs: ["唔好打畀我，我食緊飯。算啦，打啦。"], grammar: [g.gan-progressive], vocab: [w.gan2] }
      - { es: "外面落緊雨，不如留喺度飲杯茶？", en: "It's raining outside; why not stay and have a cup of tea?", altEs: ["出面落緊雨，不如留喺度飲杯茶？"], grammar: [g.gan-progressive], vocab: [w.ngoi6-min6] }
      - { es: "好多人排緊隊，但係我淨係等緊你。", en: "Lots of people are queuing, but I'm only waiting for you.", altEs: ["好多人排緊隊，不過我淨係等緊你。"], grammar: [g.gan-progressive], vocab: [w.paai4-deoi2, w.dang2-gan2] }

  - id: a2.u02.l2
    title: 佢喺度唱歌
    teach: [g.hai-dou-progressive]
    tip: "喺度 before a verb means 'busy doing'; 成日喺度 + verb often sounds like a complaint."
    vocab: [w.coeng3-go1, w.coeng3, w.tiu3-mou5, w.siu3, w.haam3, w.waan2, w.waak6-waa2, w.waa2.b, w.fuk1, w.king1, w.tung4-uk1, w.leoi5-hang4, w.gam1-jyu2, w.jit6-naau6]
    sentences:
      - { es: "你喺度做乜嘢呀？", en: "What are you doing?", altEs: ["你喺度做咩呀？", "你喺度做緊乜嘢呀？"], altEn: ["What are you up to there?"], grammar: [g.hai-dou-progressive], vocab: [], transform: { instruction: "Answer: say you're drawing", answer: "我喺度畫畫。", alt: ["我喺度畫緊畫。"], en: "I'm drawing." } }
      - { es: "我喺度諗嘢。", en: "I'm thinking.", altEs: ["我喺度諗緊嘢。"], altEn: ["I'm thinking something over."], grammar: [g.hai-dou-progressive], vocab: [], error: { wrong: "我喺諗緊嘢。", explain: "喺 alone needs a place after it; for an ongoing action say 喺度 + verb.", grammar: g.hai-dou-progressive } }
      - { es: "佢哋喺度傾偈。", en: "They're chatting.", altEs: ["佢哋喺度傾緊偈。", "佢哋傾緊偈。"], grammar: [g.hai-dou-progressive], vocab: [w.king1], transform: { instruction: "Change to 'we'", answer: "我哋喺度傾偈。", alt: ["我哋喺度傾緊偈。"], en: "We're chatting." } }
      - { es: "啲細路喺公園玩緊。", en: "The kids are playing in the park.", altEs: ["啲細路喺公園度玩緊。"], grammar: [g.gan-progressive, g.hai2-location], vocab: [w.waan2] }
      - { es: "旺角有人喺街唱歌。", en: "Someone is singing in the street in Mong Kok.", altEs: ["旺角有人喺街度唱歌。"], altEn: ["In Mong Kok there's someone singing on the street."], grammar: [g.hai2-location], vocab: [w.coeng3-go1] }
      - { es: "佢唱緊歌，好好聽。", en: "She's singing, and it sounds lovely.", altEs: ["佢喺度唱歌，好好聽。"], altEn: ["He's singing; it's really nice."], grammar: [g.gan-progressive], vocab: [w.coeng3], transform: { instruction: "Rewrite with 喺度", answer: "佢喺度唱歌，好好聽。", alt: ["佢喺度唱緊歌，好好聽。"], en: "She's singing; it sounds lovely." } }
      - { es: "我同屋喺度跳舞。", en: "My flatmate is dancing.", altEs: ["我同屋喺度跳緊舞。"], grammar: [g.hai-dou-progressive], vocab: [w.tung4-uk1, w.tiu3-mou5] }
      - { es: "佢喺度畫緊一幅畫。", jp: "keoi5 hai2 dou6 waak6 gan2 jat1 fuk1 waa2", en: "She's painting a picture.", altEs: ["佢喺度畫畫。"], altEn: ["He's in the middle of painting a picture."], grammar: [g.hai-dou-progressive, g.gan-progressive], vocab: [w.waak6-waa2, w.waa2.b, w.fuk1] }
      - { es: "唔好成日喺度打機啦！", en: "Stop playing video games all the time!", altEs: ["唔好成日喺度打機喇！"], grammar: [g.hai-dou-progressive], vocab: [] }
      - { es: "佢喺度笑乜嘢呀？", en: "What's he laughing at?", altEs: ["佢喺度笑咩呀？"], altEn: ["What is she laughing about?"], grammar: [g.hai-dou-progressive], vocab: [w.siu3] }
      - { es: "點解佢喺度喊呀？", en: "Why is she crying?", altEs: ["佢點解喺度喊呀？"], altEn: ["Why is he crying?"], grammar: [g.hai-dou-progressive], vocab: [w.haam3] }
      - { es: "佢喺度玩手機，冇聽我講嘢。", en: "He's playing on his phone and not listening to me.", altEs: ["佢喺度玩緊手機，冇聽我講嘢。"], grammar: [g.hai-dou-progressive, g.mou-past-negation], vocab: [w.waan2] }
      - { es: "我哋喺度傾下個月去邊度旅行。", en: "We're discussing where to travel next month.", altEs: ["我哋喺度傾緊下個月去邊度旅行。"], grammar: [g.hai-dou-progressive], vocab: [w.king1] }
      - { es: "我喺度搵鎖匙，你有冇見過呀？", en: "I'm looking for my keys; have you seen them?", altEs: ["我喺度搵緊條鎖匙，你有冇見過呀？"], grammar: [g.hai-dou-progressive], vocab: [] }
      - { es: "佢喺度唱緊歌。", en: "She's in the middle of singing.", altEs: ["佢喺度唱歌。"], grammar: [g.hai-dou-progressive], vocab: [w.coeng3-go1], error: { wrong: "佢喺度唱歌緊。", explain: "緊 goes between the verb and its object: 唱緊歌.", grammar: g.gan-progressive } }
    exchanges:
      - q: { es: "你喺度做乜嘢呀？", en: "What are you doing?" }
        a: { es: "我喺度畫畫。", en: "I'm drawing." }
        alt: ["我喺度諗嘢。", "冇做乜嘢。"]
        grammar: [g.hai-dou-progressive]
        vocab: [w.waak6-waa2]
      - q: { es: "你同屋喺度做咩呀？", en: "What's your flatmate doing?" }
        a: { es: "佢喺度唱歌，好嘈呀！", en: "He's singing; it's so noisy!" }
        alt: ["佢喺度跳舞。", "佢喺度瞓覺。"]
        grammar: [g.hai-dou-progressive]
        vocab: [w.tung4-uk1, w.coeng3-go1]
      - q: { es: "佢點解喺度喊呀？", en: "Why is she crying?" }
        a: { es: "佢唔見咗隻狗。", en: "She's lost her dog." }
        alt: ["我都唔知。", "佢唔開心。"]
        grammar: [g.hai-dou-progressive]
        vocab: [w.haam3]
      - q: { es: "你哋喺度傾乜嘢呀？", en: "What are you talking about?" }
        a: { es: "我哋喺度傾去邊度食飯。", en: "We're discussing where to eat." }
        alt: ["冇嘢，傾吓偈啫。", "傾緊去邊度食飯。"]
        grammar: [g.hai-dou-progressive]
        vocab: [w.king1]
      - q: { es: "啲細路喺度做乜嘢呀？", en: "What are the kids doing?" }
        a: { es: "佢哋喺度睇金魚。", en: "They're looking at the goldfish." }
        alt: ["喺度玩。", "佢哋喺度玩緊。"]
        grammar: [g.hai-dou-progressive]
        vocab: [w.waan2]
    texts:
      - title: "旺角夜晚"
        es: ["旺角夜晚好熱鬧。", "有人喺度唱歌，有人喺度跳舞。", "啲遊客喺度影相。"]
        en: ["Mong Kok is really lively at night.", "Some people are singing and some are dancing.", "The tourists are taking photos."]
        grammar: [g.hai-dou-progressive]
        vocab: [w.coeng3-go1, w.tiu3-mou5]
      - title: "我個同屋"
        es: ["我個同屋好得意。", "佢成日喺度唱歌。", "而家佢喺度畫畫。"]
        en: ["My flatmate is really funny.", "She's always singing.", "Right now she's drawing."]
        grammar: [g.hai-dou-progressive]
        vocab: [w.tung4-uk1, w.waak6-waa2, w.fuk1]
    spicy:
      - { es: "你喺度笑乜嘢呀？係咪笑我呀？", en: "What are you laughing at? Are you laughing at me?", altEs: ["你喺度笑咩呀？係唔係笑我呀？"], grammar: [g.hai-dou-progressive], vocab: [w.siu3] }
      - { es: "你成晚喺度望住我，係咪想同我跳舞？", en: "You've been looking at me all night; do you want to dance with me?", altEs: ["你成晚喺度望住我，係唔係想同我跳舞？"], grammar: [g.hai-dou-progressive, g.zyu-continuous], vocab: [w.tiu3-mou5] }
      - { es: "我唔係喺度等你㗎，我喺度⋯⋯睇金魚。", en: "I'm not waiting for you here, I'm... looking at the goldfish.", altEs: ["我唔係喺度等你，我喺度睇金魚咋。"], grammar: [g.hai-dou-progressive], vocab: [] }
      - { es: "唔好喺度玩手機啦，望吓我啦。", en: "Stop playing on your phone and look at me.", altEs: ["唔好成日喺度玩手機啦，望吓我啦。"], grammar: [g.hai-dou-progressive, g.haa-briefly], vocab: [w.waan2] }
      - { es: "你喺度諗乜嘢呀？諗緊我？", en: "What are you thinking about? Me?", altEs: ["你喺度諗咩呀？諗緊我呀？"], grammar: [g.hai-dou-progressive, g.gan-progressive], vocab: [] }

  - id: a2.u02.l3
    title: 佢戴住眼鏡
    teach: [g.zyu-continuous]
    tip: "住 is for a lasting state: 戴住眼鏡 'wearing glasses', 企住 'standing', 拎住 'holding'."
    vocab: [w.zyu6.b, w.kei5, w.daai3.b, w.ngaan5-geng2, w.fu3.b, w.zoek3-zyu6, w.sau2-biu1, w.pou5, w.mong6, w.tai2-zyu6, w.to1, w.juk1, w.mai5-juk1, w.seot1-saam1, w.sau2.b, w.jing2, w.mai5-zyu6, w.gaau2-dim6, w.ngoi6-tou3, w.pou3, w.gwaa3-zyu6]
    sentences:
      - { es: "佢戴住副眼鏡。", en: "She's wearing glasses.", altEs: ["佢戴住眼鏡。"], altEn: ["He wears glasses."], grammar: [g.zyu-continuous], vocab: [w.daai3.b, w.ngaan5-geng2, w.fu3.b], transform: { instruction: "Change to 'I'", answer: "我戴住副眼鏡。", alt: ["我戴住眼鏡。"], en: "I'm wearing glasses." }, error: { wrong: "佢戴緊副眼鏡。", explain: "戴緊 means 'putting on (right now)'; for wearing as a state use 戴住.", grammar: g.zyu-continuous } }
      - { es: "佢着住件白色恤衫。", en: "He's wearing a white shirt.", altEs: ["佢着住白色恤衫。"], altEn: ["She's in a white shirt."], grammar: [g.zyu-continuous, g.common-classifiers], vocab: [w.zoek3-zyu6] }
      - { es: "我拎住好多嘢，唔該開門。", en: "I'm carrying lots of things; could you open the door?", altEs: ["我拎住好多嘢，唔該幫我開門。"], grammar: [g.zyu-continuous], vocab: [w.zyu6.b] }
      - { es: "佢企住等車。", en: "She's standing waiting for the bus.", altEs: ["佢企住喺度等車。"], altEn: ["He's standing there waiting for the bus."], grammar: [g.zyu-continuous], vocab: [w.kei5], transform: { instruction: "Change 'standing' to 'sitting'", answer: "佢坐住等車。", alt: ["佢坐住喺度等車。"], en: "She's sitting waiting for the bus." } }
      - { es: "部冷氣開住。", en: "The air conditioner is on.", altEs: ["部冷氣開咗。"], altEn: ["The air-con's on."], grammar: [g.zyu-continuous, g.classifier-as-the], vocab: [w.zyu6.b] }
      - { es: "佢坐住睇書。", en: "He's sitting reading a book.", altEs: ["佢坐住喺度睇書。"], altEn: ["She's sitting and reading."], grammar: [g.zyu-continuous], vocab: [w.zyu6.b] }
      - { es: "唔好拎住手機過馬路。", en: "Don't cross the road holding your phone.", altEs: ["唔好拎住部手機過馬路。"], altEn: ["Don't cross the street with your phone in your hand."], grammar: [g.zyu-continuous], vocab: [w.zyu6.b] }
      - { es: "佢抱住隻貓。", en: "She's holding the cat in her arms.", altEs: ["佢抱住隻貓仔。"], altEn: ["He's holding the cat."], grammar: [g.zyu-continuous, g.classifier-as-the], vocab: [w.pou5], transform: { instruction: "Change 'cat' to 'dog'", answer: "佢抱住隻狗。", alt: ["佢抱住隻狗仔。"], en: "She's holding the dog in her arms." } }
      - { es: "佢戴住隻好貴嘅手錶。", en: "He's wearing a very expensive watch.", altEs: ["佢戴住一隻好貴嘅手錶。"], grammar: [g.zyu-continuous, g.adj-ge-noun], vocab: [w.sau2-biu1] }
      - { es: "你睇住我啲嘢，我去吓洗手間。", en: "Keep an eye on my things; I'm just going to the toilet.", altEs: ["唔該睇住我啲嘢，我去吓洗手間。"], grammar: [g.zyu-continuous, g.haa-briefly], vocab: [w.tai2-zyu6] }
      - { es: "佢拖住隻狗行街。", en: "She's out walking the dog.", altEs: ["佢拖住隻狗出街。"], altEn: ["He's walking the dog on a lead."], grammar: [g.zyu-continuous], vocab: [w.to1] }
      - { es: "佢哋拖住手行。", en: "They're walking hand in hand.", altEs: ["佢哋拖住手行街。"], grammar: [g.zyu-continuous], vocab: [w.to1] }
      - { es: "咪郁！我影緊相。", jp: "mai5 juk1 ngo5 jing2 gan2 soeng2", en: "Don't move! I'm taking a photo.", altEs: ["唔好郁！我影緊相。"], altEn: ["Hold still! I'm taking a picture."], grammar: [g.gan-progressive], vocab: [w.juk1, w.mai5-juk1] }
      - { es: "佢望住啲金魚笑。", en: "He's looking at the goldfish and smiling.", altEs: ["佢望住啲金魚喺度笑。"], altEn: ["She smiles as she watches the goldfish."], grammar: [g.zyu-continuous], vocab: [w.mong6] }
      - { es: "咪住，我未搞掂。", en: "Hang on, I'm not done yet.", altEs: ["等等，我未搞掂。", "咪住，我仲未搞掂。"], grammar: [g.zyu-continuous, g.mei-questions], vocab: [w.zyu6.b] }
    exchanges:
      - q: { es: "你個朋友係邊個呀？", en: "Which one is your friend?" }
        a: { es: "戴住眼鏡嗰個。", en: "The one wearing glasses." }
        alt: ["着住白色恤衫嗰個。", "企住喺門口嗰個。"]
        grammar: [g.zyu-continuous]
        vocab: [w.daai3.b, w.ngaan5-geng2]
      - q: { es: "點解部冷氣開住呀？", en: "Why is the air conditioner on?" }
        a: { es: "因為好熱呀。", en: "Because it's really hot." }
        alt: ["我唔記得熄。", "好熱呀。"]
        grammar: [g.zyu-continuous]
        vocab: [w.zyu6.b]
      - q: { es: "唔該睇住我啲嘢吖。", en: "Could you keep an eye on my things?" }
        a: { es: "得，冇問題。", en: "Sure, no problem." }
        alt: ["好呀。", "冇問題，你去啦。"]
        grammar: [g.zyu-continuous]
        vocab: [w.tai2-zyu6]
      - q: { es: "你喺邊呀？", en: "Where are you?" }
        a: { es: "我喺金魚街，着住件紅色外套。", en: "I'm on Goldfish Street, wearing a red jacket." }
        alt: ["我企住喺金魚街門口。", "我喺金魚街。"]
        grammar: [g.zyu-continuous]
        vocab: [w.zoek3-zyu6, w.kei5]
      - q: { es: "佢抱住乜嘢呀？", en: "What is she holding?" }
        a: { es: "佢抱住隻狗仔。", en: "She's holding a puppy." }
        alt: ["一隻貓。", "隻狗仔。"]
        grammar: [g.zyu-continuous]
        vocab: [w.pou5]
    texts:
      - title: "短訊：搵我"
        es: ["我喺金魚街門口。", "我着住件紅色外套，戴住副眼鏡。", "你好易認到我。"]
        en: ["I'm at the entrance of Goldfish Street.", "I'm wearing a red jacket and glasses.", "You'll easily recognise me."]
        grammar: [g.zyu-continuous]
        vocab: [w.zoek3-zyu6, w.daai3.b, w.ngaan5-geng2]
      - title: "金魚街"
        es: ["金魚街有好多金魚舖。", "啲金魚喺膠袋入面，掛住喺門口。", "好多人企住睇。"]
        en: ["Goldfish Street has lots of goldfish shops.", "The fish are in plastic bags hanging at the shop fronts.", "Lots of people stand there looking."]
        grammar: [g.zyu-continuous]
        vocab: [w.kei5, w.zyu6.b]
    spicy:
      - { es: "你戴住眼鏡好靚仔。", en: "You look really handsome in glasses.", altEs: ["你戴住眼鏡好靚女。", "你戴住眼鏡好靚。"], altEn: ["You look so pretty in glasses."], grammar: [g.zyu-continuous], vocab: [w.daai3.b, w.ngaan5-geng2] }
      - { es: "唔好拖住我隻手咁耐啦⋯⋯其實冇所謂。", en: "Don't hold my hand for so long... actually, never mind.", altEs: ["唔好拖住我隻手咁耐啦。其實冇所謂。"], grammar: [g.zyu-continuous], vocab: [w.to1] }
      - { es: "咪郁！你面有啲嘢⋯⋯冇呀，我淨係想望住你。", en: "Don't move! There's something on your face... no, there isn't, I just wanted to look at you.", altEs: ["咪郁！你塊面有啲嘢⋯⋯冇呀，我淨係想望住你。"], grammar: [g.zyu-continuous], vocab: [w.mai5-juk1, w.mong6] }
      - { es: "你着住呢件衫，我唔識講嘢。", jp: "nei5 zoek3 zyu6 ni1 gin6 saam1 ngo5 m4 sik1 gong2 je5", en: "When you wear that shirt, I forget how to talk.", altEs: ["你着住呢件衫，我講唔到嘢。"], grammar: [g.zyu-continuous], vocab: [w.zoek3-zyu6] }
      - { es: "佢抱住隻狗，我好想做嗰隻狗。", en: "She's cuddling the dog, and I'd really like to be that dog.", altEs: ["佢抱住隻狗，我好想做嗰隻狗呀。"], grammar: [g.zyu-continuous], vocab: [w.pou5] }

  - id: a2.u02.l4
    title: 我揸緊車
    teach: [g.gan-progressive, g.zyu-continuous]
    tip: "On the phone, explain why you can't talk with 緊: 我揸緊車, 我開緊會, 我沖緊涼."
    vocab: [w.gong2-din6-waa2, w.hoi1-ce1, w.zaa1, w.daam1-sam1, w.fan3-lin6, w.gau2-loeng4, w.cung2-mat6, w.jau5-jan4, w.fong1-bin6, w.ngai4-him2, w.cung1, w.bong1, w.mou5-mat1, w.mong5, w.wai2.c, w.gaa1-jan1, w.mat1]
    sentences:
      - { es: "我揸緊車，唔方便講電話。", en: "I'm driving; I can't really talk on the phone.", altEs: ["我揸緊車，唔方便聽電話。"], altEn: ["I'm driving, it's not a good time to talk."], grammar: [g.gan-progressive], vocab: [w.zaa1, w.gong2-din6-waa2] }
      - { es: "佢講緊電話。", en: "She's on the phone.", altEs: ["佢喺度講緊電話。", "佢喺度講電話。"], altEn: ["He's talking on the phone."], grammar: [g.gan-progressive], vocab: [w.gong2-din6-waa2], transform: { instruction: "Ask 'is she on the phone?'", answer: "佢係咪講緊電話呀？", alt: ["佢講緊電話呀？", "佢係唔係講緊電話呀？"], en: "Is she on the phone?" }, error: { wrong: "佢講電話緊。", explain: "緊 goes between the verb and its object: 講緊電話.", grammar: g.gan-progressive } }
      - { es: "架車開緊喇，快啲上車！", en: "The bus is leaving, get on quickly!", altEs: ["架車就開喇，快啲上車！"], altEn: ["The bus is pulling out, hurry and get on!"], grammar: [g.gan-progressive], vocab: [w.hoi1-ce1] }
      - { es: "我開緊會，遲啲覆你。", jp: "ngo5 hoi1 gan2 wui2 ci4 di1 fuk1 nei5", en: "I'm in a meeting; I'll get back to you later.", altEs: ["我開緊會，一陣覆你。"], grammar: [g.gan-progressive], vocab: [w.gan2], transform: { instruction: "Change to 'she'", answer: "佢開緊會，遲啲覆你。", alt: ["佢開緊會，一陣覆你。"], en: "She's in a meeting; she'll get back to you later." } }
      - { es: "你唔使擔心，我喺度做緊嘢。", en: "Don't worry, I'm working.", altEs: ["唔使擔心，我喺度做緊嘢。"], grammar: [g.hai-dou-progressive], vocab: [w.daam1-sam1] }
      - { es: "我喺公園訓練緊隻狗。", en: "I'm training the dog in the park.", altEs: ["我喺公園度訓練緊隻狗。"], grammar: [g.gan-progressive], vocab: [w.fan3-lin6] }
      - { es: "隻狗食緊狗糧。", en: "The dog is eating its food.", altEs: ["隻狗喺度食緊狗糧。"], grammar: [g.gan-progressive, g.classifier-as-the], vocab: [w.gau2-loeng4] }
      - { es: "你有冇養寵物呀？", en: "Do you have any pets?", altEs: ["你有冇養寵物？"], grammar: [g.jau-have], vocab: [w.cung2-mat6] }
      - { es: "有人喺門口等緊你。", en: "Someone is waiting for you at the door.", altEs: ["有人喺門口等你。"], grammar: [g.gan-progressive], vocab: [w.jau5-jan4] }
      - { es: "我拎住遮，唔使擔心。", en: "I've got an umbrella with me, don't worry.", altEs: ["我拎住把遮，唔使擔心。"], grammar: [g.zyu-continuous], vocab: [w.daam1-sam1] }
      - { es: "你仲講緊電話呀？", en: "Are you still on the phone?", altEs: ["你仲喺度講電話呀？"], grammar: [g.gan-progressive], vocab: [w.gong2-din6-waa2] }
      - { es: "佢揸住車講電話，好危險。", en: "He talks on the phone while he's driving; it's really dangerous.", altEs: ["佢揸車嗰陣講電話，好危險。"], grammar: [g.zyu-continuous], vocab: [w.zaa1], note: "V住 + another verb: doing one thing while in a state." }
      - { es: "我沖緊涼，你幫我聽電話。", en: "I'm in the shower; answer the phone for me.", altEs: ["我沖緊涼，你幫我聽吓電話。"], grammar: [g.gan-progressive], vocab: [w.gan2] }
      - { es: "我喺港鐵入面，冇乜網。", en: "I'm on the MTR; there's hardly any signal.", altEs: ["我喺地鐵入面，冇乜網。"], grammar: [g.hai2-location], vocab: [] }
    exchanges:
      - q: { es: "喂，你而家得唔得閒呀？", en: "Hello, are you free right now?" }
        a: { es: "唔得閒呀，我揸緊車。", en: "No, I'm driving." }
        alt: ["得閒，講啦。", "我開緊會，一陣覆你。"]
        grammar: [g.gan-progressive]
        vocab: [w.gan2]
      - q: { es: "你喺度做緊乜嘢呀？好嘈呀！", en: "What are you doing? It's so noisy!" }
        a: { es: "我喺旺角，好多人。", en: "I'm in Mong Kok; there are loads of people." }
        alt: ["我喺街市。", "我喺度行街。"]
        grammar: [g.hai-dou-progressive]
        vocab: [w.gan2]
      - q: { es: "你隻狗做緊乜嘢呀？", en: "What's your dog doing?" }
        a: { es: "佢食緊狗糧。", en: "It's eating its food." }
        alt: ["佢瞓緊覺。", "佢喺度玩。"]
        grammar: [g.gan-progressive]
        vocab: [w.gau2-loeng4]
      - q: { es: "你有冇養寵物呀？", en: "Do you have any pets?" }
        a: { es: "有呀，養咗兩條金魚。", en: "Yes, I have two goldfish." }
        alt: ["冇呀。", "有，一隻貓。"]
        grammar: [g.zo-perfective]
        vocab: [w.cung2-mat6]
      - q: { es: "陳生得唔得閒呀？", en: "Is Mr Chan free?" }
        a: { es: "佢講緊電話，你等一等。", en: "He's on the phone; hold on a moment." }
        alt: ["佢開緊會。", "佢唔喺度。"]
        grammar: [g.gan-progressive]
        vocab: [w.gong2-din6-waa2]
    texts:
      - title: "電話留言"
        es: ["喂，我係嘉欣。", "我而家揸緊車，唔方便講電話。", "一陣覆你。"]
        en: ["Hello, it's Ka-yan.", "I'm driving now, so I can't really talk.", "I'll get back to you in a bit."]
        grammar: [g.gan-progressive]
        vocab: [w.zaa1, w.gong2-din6-waa2]
      - title: "我嘅寵物"
        es: ["我養咗一隻狗。", "我每日喺公園訓練佢。", "而家佢喺度食緊狗糧。"]
        en: ["I have a dog.", "I train him in the park every day.", "Right now he's eating his food."]
        grammar: [g.gan-progressive, g.hai-dou-progressive]
        vocab: [w.cung2-mat6, w.fan3-lin6, w.gau2-loeng4]
    spicy:
      - { es: "我揸緊車，不過我諗緊你。", en: "I'm driving, but I'm thinking about you.", altEs: ["我揸緊車，但係我諗緊你。"], grammar: [g.gan-progressive], vocab: [w.zaa1] }
      - { es: "你講緊電話？同邊個講咁耐呀？", en: "You're on the phone? Who are you talking to for so long?", altEs: ["你講緊電話呀？同邊個講咁耐呀？"], grammar: [g.gan-progressive], vocab: [w.gong2-din6-waa2] }
      - { es: "我隻狗望住你，我都望住你。", en: "My dog is looking at you, and so am I.", altEs: ["我隻狗望住你，我都係。"], grammar: [g.zyu-continuous], vocab: [w.mong6] }
      - { es: "唔使擔心，有人送你返屋企。邊個？我囉。", en: "Don't worry, someone will take you home. Who? Me, of course.", altEs: ["唔使擔心，有人送你返去。邊個？我囉。"], grammar: [g.jiu-must-m-sai], vocab: [w.daam1-sam1, w.jau5-jan4] }
      - { es: "你喺度做緊乜嘢？我喺度諗緊今晚約你去邊。", en: "What are you doing? I'm thinking about where to take you tonight.", altEs: ["你喺度做緊咩？我喺度諗緊今晚約你去邊度。"], grammar: [g.hai-dou-progressive, g.gan-progressive], vocab: [w.gan2] }
dialogues:
  - id: a2.u02.d1
    title: 你喺邊度呀？
    context: "Chi-ming phones his flatmate Ka-yan, who is out shopping in Mong Kok."
    lines:
      - { speaker: 志明, es: "喂，嘉欣，你喺邊呀？", en: "Hello, Ka-yan, where are you?" }
      - { speaker: 嘉欣, es: "我喺旺角波鞋街，排緊隊買波鞋。", en: "I'm on Sneakers Street in Mong Kok, queuing to buy trainers." }
      - { speaker: 志明, es: "排隊？好多人呀？", en: "Queuing? Are there lots of people?" }
      - { speaker: 嘉欣, es: "好多呀，成條街都係人。你喺度做緊乜嘢呀？", en: "Loads, the whole street is full of people. What are you doing?" }
      - { speaker: 志明, es: "我喺屋企煮緊飯。你幾點返嚟呀？", en: "I'm at home cooking. What time are you coming back?" }
      - { speaker: 嘉欣, es: "唔知呀，前面仲有二十個人。", en: "No idea, there are still twenty people in front of me." }
      - { speaker: 志明, es: "隻狗喺度喊，佢掛住你呀。", en: "The dog is whining; he misses you." }
      - { speaker: 嘉欣, es: "哈哈，你抱住佢啦。我買完就返嚟。", en: "Ha ha, give him a cuddle. I'll come back as soon as I've bought them." }
      - { speaker: 志明, es: "好，外面落緊雨，記得帶遮。", en: "OK. It's raining outside; remember your umbrella." }
      - { speaker: 嘉欣, es: "我拎住遮，唔使擔心！", en: "I've got my umbrella with me, don't worry!" }
    questions:
      - { q: "嘉欣喺邊度呀？", options: ["金魚街", "波鞋街", "女人街"], answer: 1, explain: "She says 我喺旺角波鞋街: she is on Sneakers Street." }
      - { q: "志明喺度做緊乜嘢呀？", options: ["煮緊飯", "睇緊電視", "排緊隊"], answer: 0, explain: "我喺屋企煮緊飯: he is cooking at home." }
      - { q: "嘉欣前面仲有幾多人？", options: ["十個", "二十個", "兩個"], answer: 1, explain: "前面仲有二十個人: twenty people are still ahead of her." }
      - { q: "外面嘅天氣點呀？", options: ["好熱", "落緊雨", "打緊風"], answer: 1, explain: "外面落緊雨: it is raining outside." }
