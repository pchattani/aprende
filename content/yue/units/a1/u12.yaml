dialogues:
  - id: a1.u12.d1
    title: 去鰂魚涌影相
    context: Karen and Kelvin go to Quarry Bay to photograph the Monster Building.
    lines:
      - { speaker: Karen, es: "今日天氣好好，我哋去鰂魚涌影相啦！", en: "The weather's lovely today, let's go and take photos in Quarry Bay!" }
      - { speaker: Kelvin, es: "好呀。不過天文台話下晝會落雨。", en: "Sure. But the Observatory says it'll rain this afternoon." }
      - { speaker: Karen, es: "唔緊要，我有帶遮。", en: "Never mind, I've brought an umbrella." }
      - { speaker: Kelvin, es: "呢啲大廈好高、好舊呀！", en: "These buildings are so tall and so old!" }
      - { speaker: Karen, es: "係呀，好多人叫呢度做「怪獸大廈」。", en: "Yes, lots of people call this place the \"Monster Building\"." }
      - { speaker: Kelvin, es: "今日有啲熱，又好翳焗。", en: "It's a bit hot today, and really muggy." }
      - { speaker: Karen, es: "你睇，天上面好多黑色嘅雲。好似要落雨喇。", en: "Look, there are lots of dark clouds in the sky. It looks like rain." }
      - { speaker: Kelvin, es: "行雷喇！我哋快啲走啦。", en: "It's thundering! Let's get out of here." }
      - { speaker: Karen, es: "我哋去茶餐廳飲杯凍檸茶，好唔好？", en: "Shall we go to a cha chaan teng for an iced lemon tea?" }
      - { speaker: Kelvin, es: "好呀，嗰度有冷氣，好舒服。", en: "Good idea, it's air-conditioned there, really comfortable." }
    questions:
      - { q: "佢哋去鰂魚涌做咩？", options: ["影相", "行山", "買衫"], answer: 0, explain: "Karen says 我哋去鰂魚涌影相啦: they go to take photos." }
      - { q: "天文台話下晝點？", options: ["會出太陽", "會落雨", "會打風"], answer: 1, explain: "Kelvin says 天文台話下晝會落雨." }
      - { q: "天上面有乜嘢？", options: ["好多黑色嘅雲", "好多白色嘅雲", "太陽"], answer: 0, explain: "天上面好多黑色嘅雲: lots of dark clouds." }
      - { q: "最後佢哋去邊度？", options: ["海灘", "茶餐廳", "公園"], answer: 1, explain: "They go to a cha chaan teng for iced lemon tea, where there's air-con." }
