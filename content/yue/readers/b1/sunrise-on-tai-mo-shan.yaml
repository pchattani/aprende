id: r.b1.sunrise-on-tai-mo-shan
level: b1
title: 行上大帽山睇日出
kind: text
intro: Ka-chun and his friends hike up Tai Mo Shan, Hong Kong's highest mountain, in the dark to catch the sunrise above a sea of clouds. He describes the climb, the cold at the top and the walk back down.
paragraphs:
  - { es: "大帽山係香港最高嘅山，有九百五十七米高。好多人話，冬天喺山頂可以睇到雲海同日出，好似企喺天上面噉。所以上個禮拜六，我同三個朋友決定半夜行上去睇日出。", en: "Tai Mo Shan is Hong Kong's highest mountain, 957 metres high. Many people say that in winter you can see a sea of clouds and the sunrise from the top, as if you were standing in the sky. So last Saturday, three friends and I decided to hike up in the middle of the night to watch the sunrise." }
  - { es: "我哋凌晨三點喺荃灣地鐵站等，然後坐的士上到山腳。出發之前，我檢查咗一次背囊：電筒、水樽、外套、手套同少少食物，樣樣都帶齊晒。天氣預報話山頂得四度，所以我仲多帶咗一件褸。", en: "We met at Tsuen Wan MTR station at three in the morning, then took a taxi up to the foot of the mountain. Before setting off I checked my backpack once more: torch, water bottle, jacket, gloves and a bit of food - I had brought everything. The weather forecast said it would be only four degrees at the top, so I brought an extra coat as well." }
  - { es: "山路好黑，我哋開住電筒，一個跟住一個慢慢行上去。條路唔算難行，但係有好多斜路，行咗一個鐘，我已經成身都係汗，要將件褸除咗佢。阿峰行得最快，成日行到前面先停低等我哋。", en: "The mountain path was very dark. We switched on our torches and walked slowly up in single file. The path isn't really difficult, but there are lots of steep slopes. After an hour I was covered in sweat and had to take my coat off. Ah Fung walked fastest and kept getting ahead, then stopping to wait for us." }
  - { es: "行到差唔多山頂嘅時候，風好大，好凍，我又即刻將件褸着返。山頂已經有好多人喺度等，有啲人仲帶咗凳仔同熱水壺嚟。我哋搵到個好位，坐低飲咗杯熱朱古力，等太陽出嚟。", en: "When we were nearly at the top, the wind was very strong and very cold, and I immediately put my coat back on. Lots of people were already waiting at the top; some had even brought little stools and flasks of hot water. We found a good spot, sat down, drank a cup of hot chocolate and waited for the sun to come up." }
  - { es: "六點四十分，天邊慢慢變成橙色，跟住變成粉紅色。我哋腳下面係一片白色嘅雲海，遠遠望過去，荃灣同青衣啲高樓好似喺雲入面浮起嚟噉。太陽升上嚟嘅時候，周圍嘅人都「嘩」咗一聲，大家即刻用手機不停影相。嗰一刻，我覺得冇咗瞓覺都值得。", en: "At 6:40 the sky slowly turned orange, then pink. Below our feet was a white sea of clouds, and in the distance the tower blocks of Tsuen Wan and Tsing Yi looked as if they were floating up out of the clouds. When the sun rose, everyone around us went \"wow\", and they all started taking photo after photo with their phones. At that moment I felt that losing a night's sleep had been worth it." }
  - { es: "其實山頂最高嗰度唔可以上去，因為嗰度有天文台嘅雷達站，遠遠望過去好似兩個大白波。冬天特別凍嘅日子，大帽山有時仲會結霜，啲草同樹葉變到白雪雪，好多人會專登上山睇。不過啲路會變到好滑，行山要特別小心。", en: "In fact you can't go up to the very top, because there's an Observatory radar station there; from a distance it looks like two giant white balls. On especially cold winter days there is sometimes even frost on Tai Mo Shan: the grass and leaves turn white, and lots of people make a special trip up to see it. But the paths become very slippery, so you have to be especially careful when hiking." }
  - { es: "落山嘅時候，我哋行另一條路落去，經過一個舊茶園。路上面見到幾隻牛喺度食草，佢哋完全唔怕人。我哋行到山腳，搭小巴返去荃灣，喺一間茶餐廳食咗個好大嘅早餐。", en: "On the way down, we took a different path, passing an old tea plantation. On the way we saw a few cows grazing; they weren't afraid of people at all. We walked down to the foot of the mountain, took a minibus back to Tsuen Wan and had an enormous breakfast at a cha chaan teng." }
  - { es: "返到屋企，我一瞓低就瞓到夜晚。如果你都想去，記住要帶夠衫，因為山頂真係好凍。仲有，最好睇定天氣預報先出發：如果有霧，你上到去乜都睇唔到！", en: "When I got home, I lay down and slept until evening. If you want to go too, remember to bring enough clothes, because it's really cold at the top. And it's best to check the weather forecast before you set off: if it's foggy, you won't see a thing when you get up there!" }
questions:
  - { q: "大帽山有幾高？", options: ["五百五十二米", "九百五十七米", "九百三十四米"], answer: 1, explain: "大帽山…有九百五十七米高. 552 m is Victoria Peak and 934 m is Lantau Peak." }
  - { q: "佢哋點樣去到山腳？", options: ["行路", "坐的士", "坐小巴"], answer: 1, explain: "坐的士上到山腳. They took a minibus on the way back." }
  - { q: "點解家俊行咗一個鐘之後要除褸？", options: ["因為落雨", "因為佢行到成身都係汗", "因為褸爛咗"], answer: 1, explain: "我已經成身都係汗，要將件褸除咗佢." }
  - { q: "日出嘅時候，佢哋見到乜嘢？", options: ["一片雲海", "好多雀仔", "落雪"], answer: 0, explain: "我哋腳下面係一片白色嘅雲海." }
  - { q: "落山嗰陣，佢哋見到乜嘢動物？", options: ["野豬", "牛", "狗"], answer: 1, explain: "路上面見到幾隻牛喺度食草." }
  - { q: "家俊畀咗乜嘢建議？", options: ["帶夠衫，睇定天氣預報", "唔好半夜去", "一定要坐的士落山"], answer: 0, explain: "記住要帶夠衫… 最好睇定天氣預報先出發." }
glossary:
  - { es: 凌晨, en: small hours (after midnight) }
  - { es: 手套, en: gloves }
  - { es: 汗, en: sweat }
  - { es: 凳仔, en: little stool }
  - { es: 熱水壺, en: flask }
  - { es: 天邊, en: horizon }
  - { es: 浮, en: to float }
  - { es: 青衣, en: Tsing Yi }
  - { es: 茶園, en: tea plantation }
  - { es: 雷達站, en: radar station }
  - { es: 結霜, en: to frost over }
  - { es: 專登, en: "on purpose, specially" }
  - { es: 阿峰, en: Ah Fung (a name) }
