id: r.a1.sunday-yum-cha
level: a1
title: 星期日去飲茶
kind: text
intro: Ana describes her first Sunday yum cha with Mandy's family at a busy Cantonese restaurant in Central, from waiting for a table to fighting over the bill.
paragraphs:
  - { es: "香港人好鍾意飲茶。今日係星期日，Mandy一家人同我一齊去中環一間酒樓飲茶。我哋十點去到，但係酒樓好多人，我哋要等位。我哋等二十分鐘。", en: "Hongkongers love yum cha. Today is Sunday, and Mandy's family and I go for yum cha at a Cantonese restaurant in Central. We get there at ten, but the restaurant is packed and we have to wait for a table. We wait twenty minutes." }
  - { es: "伙記問：「幾位呀？」陳先生話：「五位，唔該。」我哋坐低，伙記問：「飲咩茶呀？」陳太話：「一壺普洱，一壺香片，唔該。」香港人飲茶，真係要飲茶㗎！", en: "The waiter asks: \"How many?\" Mr Chan says: \"Five, please.\" We sit down and the waiter asks: \"What tea would you like?\" Mrs Chan says: \"A pot of pu'er and a pot of jasmine, please.\" When Hongkongers go for yum cha, they really do drink tea!" }
  - { es: "Mandy畀張點心紙我睇，上面有好多點心。佢話：「你想食乜嘢，就喺度揀啦。」我唔識睇中文字，所以Mandy同我揀：兩籠蝦餃、一籠燒賣、一碟腸粉、一碟蘿蔔糕同三個叉燒包。", en: "Mandy shows me the order sheet, which has lots of dim sum on it. She says: \"Just choose whatever you want to eat here.\" I can't read Chinese characters, so Mandy chooses for me: two baskets of har gow, one basket of siu mai, a plate of rice rolls, a plate of turnip cake and three char siu buns." }
  - { es: "蝦餃好好食，我好鍾意！Mandy細佬Tommy最鍾意食鳳爪，但係我唔敢食。陳太話：「試吓啦，好好食㗎！」我試一隻……都唔錯！", en: "The har gow are delicious, I love them! Mandy's younger brother Tommy likes chicken feet best, but I don't dare eat them. Mrs Chan says: \"Have a try, they're really good!\" I try one... not bad at all!" }
  - { es: "我哋食好多嘢，好飽。陳先生話：「伙記，唔該埋單！」張單係四百五十蚊。我想畀錢，但係陳先生話：「唔使，唔使！你係我哋嘅客人。」最後，陳先生畀錢。", en: "We eat lots and we're very full. Mr Chan says: \"Waiter, the bill please!\" The bill is four hundred and fifty dollars. I want to pay, but Mr Chan says: \"No need, no need! You're our guest.\" In the end, Mr Chan pays." }
  - { es: "十二點，我哋行出去。出面仲有好多人等位。我好開心，下個禮拜日我哋再去飲茶！", en: "At twelve we walk out of the restaurant. Outside there are still lots of people waiting for tables. I'm very happy, and next Sunday we're going for yum cha again!" }
questions:
  - { q: "佢哋幾點去到酒樓？", options: ["九點", "十點", "十二點"], answer: 1, explain: "我哋十點去到. They leave at twelve." }
  - { q: "陳太叫乜嘢茶？", options: ["普洱同香片", "奶茶同咖啡", "檸檬茶"], answer: 0, explain: "一壺普洱，一壺香片: a pot of pu'er and a pot of jasmine tea." }
  - { q: "點解Mandy同Ana揀點心？", options: ["因為Ana唔識睇中文字", "因為Ana唔鍾意點心", "因為Ana好忙"], answer: 0, explain: "我唔識睇中文字，所以Mandy同我揀." }
  - { q: "Tommy最鍾意食乜嘢？", options: ["蝦餃", "叉燒包", "鳳爪"], answer: 2, explain: "Tommy最鍾意食鳳爪. Ana is the one who loves har gow." }
  - { q: "最後邊個畀錢？", options: ["Ana", "陳先生", "Mandy"], answer: 1, explain: "Ana wants to pay, but 最後，陳先生畀錢." }
glossary:
  - { es: 點心紙, en: dim sum order sheet }
  - { es: 坐低, en: to sit down }
  - { es: 唔敢, en: "don't dare" }
