  - { es: spirale, en: spiral }
  - { es: galeries, en: galleries }
  - { es: banquiers, en: bankers }
  - { es: accéder, en: "to reach, to access" }
  - { es: tisserands, en: weavers }
  - { es: "métiers à tisser", en: looms }
  - { es: soie, en: silk }
  - { es: "se sont révoltés", en: rebelled }
  - { es: révoltés, en: rebelled }
  - { es: combattant, en: fighting }
  - { es: échapper, en: to escape }
  - { es: Résistance, en: the (French) Resistance }
  - { es: plaques, en: plaques }
  - { es: "tourner en rond", en: to go round in circles }
  - { es: marchands, en: merchants }
