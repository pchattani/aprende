id: r.a2.a-night-in-jordan
level: a2
title: 你去過廟街未呀？
kind: dialogue
intro: Kelvin asks Ana what she has and hasn't tried in Hong Kong, then takes her to Jordan for scrambled eggs at a famous café and an evening at the Temple Street Night Market.
allow: [澳洲牛奶公司]
paragraphs:
  - { es: "Kelvin：「Ana，你嚟咗香港兩個月，去過邊度呀？」Ana：「我去過山頂、赤柱同旺角，仲坐過天星小輪同叮叮。」Kelvin：「咁廟街呢？你去過未呀？」Ana：「未去過。廟街喺邊度呀？」", en: "Kelvin: \"Ana, you've been in Hong Kong for two months. Where have you been?\" Ana: \"I've been to the Peak, Stanley and Mong Kok, and I've ridden the Star Ferry and the tram.\" Kelvin: \"What about Temple Street? Have you been yet?\" Ana: \"Not yet. Where is Temple Street?\"" }
  - { es: "Kelvin：「喺佐敦同油麻地中間，夜晚有夜市。今晚我帶你去啦！不過我哋先去食嘢。你食過澳洲牛奶公司未呀？」Ana：「未食過。係咪澳洲菜呀？」Kelvin：「唔係呀，係茶餐廳嚟㗎，佢哋嘅炒蛋同燉奶好出名。」", en: "Kelvin: \"It's between Jordan and Yau Ma Tei, and there's a night market in the evening. I'll take you tonight! But let's eat first. Have you ever eaten at Australia Dairy Company?\" Ana: \"No, never. Is it Australian food?\" Kelvin: \"No, it's a cha chaan teng. Their scrambled eggs and steamed milk pudding are famous.\"" }
  - { es: "喺茶餐廳門口，好多人喺度排隊。伙記講嘢好快，Ana聽唔明。Kelvin話：「呢度啲伙記係出名咁快㗎，你坐低就要即刻叫嘢。」佢哋叫咗兩個炒蛋多士同兩碗燉奶。五分鐘之後，嘢食已經嚟咗。", en: "Outside the café, lots of people are queuing. The waiter speaks very fast and Ana doesn't understand. Kelvin says: \"The waiters here are famous for being fast; you have to order as soon as you sit down.\" They order two scrambled-egg-on-toast sets and two bowls of steamed milk pudding. Five minutes later, the food has already arrived." }
  - { es: "Ana：「嘩，啲蛋好滑呀！我從來未食過咁好食嘅炒蛋。」Kelvin：「我細個成日同爺爺嚟食。爺爺話佢食咗幾十年都未食厭。」", en: "Ana: \"Wow, the eggs are so smooth! I've never had scrambled eggs this good.\" Kelvin: \"When I was little I often came here with my grandpa. Grandpa says he's been eating here for decades and he's still not tired of it.\"" }
  - { es: "食完飯，佢哋行去廟街。廟街好熱鬧，有好多檔口賣衫、玩具同紀念品，仲有人喺街邊唱粵曲同睇相。Ana：「睇相？我未試過喎，好唔好玩㗎？」Kelvin：「我試過一次，佢話我三十歲會結婚。我而家三十歲，仲未有女朋友！」", en: "After eating, they walk to Temple Street. Temple Street is very lively, with lots of stalls selling clothes, toys and souvenirs, and people singing Cantonese opera songs and telling fortunes at the side of the street. Ana: \"Fortune-telling? I've never tried that. Is it fun?\" Kelvin: \"I tried it once. He said I'd get married at thirty. I'm thirty now and I still don't have a girlfriend!\"" }
  - { es: "Ana笑到停唔到。最後佢買咗一個麻雀做手信，仲食咗一串咖喱魚蛋。Ana：「今晚好開心！廟街係我去過最好玩嘅地方。」Kelvin：「下次我帶你去試蛇羹！」Ana：「蛇？唔好喇，多謝！」", en: "Ana can't stop laughing. In the end she buys a mahjong tile as a souvenir, and eats a skewer of curry fish balls too. Ana: \"Tonight was so much fun! Temple Street is the most fun place I've been.\" Kelvin: \"Next time I'll take you to try snake soup!\" Ana: \"Snake? No thanks!\"" }
questions:
  - { q: "Ana去過邊度？", options: ["廟街", "山頂同赤柱", "澳洲"], answer: 1, explain: "我去過山頂、赤柱同旺角. She hasn't been to Temple Street yet." }
  - { q: "澳洲牛奶公司係乜嘢地方？", options: ["一間澳洲餐廳", "一間茶餐廳", "一間超市"], answer: 1, explain: "唔係呀，係茶餐廳嚟㗎: despite the name, it's a cha chaan teng." }
  - { q: "Ana點解聽唔明伙記？", options: ["因為伙記講英文", "因為伙記講嘢好快", "因為伙記好細聲"], answer: 1, explain: "伙記講嘢好快，Ana聽唔明." }
  - { q: "睇相嘅人同Kelvin講咗乜嘢？", options: ["佢三十歲會結婚", "佢會好有錢", "佢會去澳洲"], answer: 0, explain: "佢話我三十歲會結婚, which hasn't come true yet." }
  - { q: "Ana想唔想試蛇羹？", options: ["好想", "唔想", "佢已經試過"], answer: 1, explain: "蛇？唔好喇，多謝！ No thanks." }
glossary:
  - { es: 炒蛋, en: scrambled eggs }
  - { es: 燉, en: to steam slowly (燉奶 steamed milk pudding) }
  - { es: 滑, en: smooth }
  - { es: 玩具, en: toy }
  - { es: 串, en: skewer (measure word) }
  - { es: 檔口, en: stall }
  - { es: 粵曲, en: Cantonese opera song }
  - { es: 睇相, en: to tell fortunes (by reading faces or palms) }
  - { es: 麻雀, en: mahjong }
  - { es: 咖喱, en: curry }
