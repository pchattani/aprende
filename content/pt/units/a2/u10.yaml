id: a2.u10
title: Faça assim
lessons:
  - id: a2.u10.l1
    title: Corte a cebola
    teach: [g.imperative-formal]
    vocab: [w.receita, w.ingrediente, w.cortar, w.picar, w.misturar, w.mexer, w.ferver, w.fritar, w.assar, w.adicionar, w.colocar, w.esquentar, w.servir, w.preparar, w.temperar, w.tempero, w.forno, w.panela, w.frigideira, w.colher, w.garfo, w.faca, w.tigela, w.óleo, w.azeite, w.pimenta, w.alho, w.cebola, w.cenoura, w.farinha, w.leite-condensado, w.creme-de-leite, w.encher, w.derreter, w.fatia, w.fondue]
    tip: "Take the eu form, drop the -o and swap the vowel: corto → corte, mexo → mexa, sirvo → sirva. Recipes also use the infinitive: Misturar bem."
    sentences:
      - { es: "Pique a cebola e o alho.", en: "Chop the onion and the garlic.", altEs: ["Pica a cebola e o alho.", "Picar a cebola e o alho."], grammar: [g.imperative-formal], vocab: [w.picar, w.cebola, w.alho], error: { wrong: "Pice a cebola e o alho.", explain: "Picar changes its spelling to keep the k sound: pique (like ficar → fique).", grammar: g.imperative-formal } }
      - { es: "Esquente o azeite numa frigideira grande.", en: "Heat the olive oil in a large frying pan.", altEs: ["Esquenta o azeite numa frigideira grande.", "Esquentar o azeite numa frigideira grande.", "Esquente o azeite em uma frigideira grande."], grammar: [g.imperative-formal], vocab: [w.esquentar, w.azeite, w.frigideira] }
      - { es: "Frite a cebola por cinco minutos e mexa sempre.", en: "Fry the onion for five minutes and keep stirring.", altEs: ["Frite a cebola durante cinco minutos e mexa sempre.", "Frita a cebola por cinco minutos e mexe sempre."], grammar: [g.imperative-formal], vocab: [w.fritar, w.mexer, w.cebola] }
      - { es: "Corte as cenouras em fatias.", en: "Cut the carrots into slices.", altEs: ["Corta as cenouras em fatias.", "Cortar as cenouras em fatias."], grammar: [g.imperative-formal], vocab: [w.cortar, w.cenoura, w.fatia] }
      - { es: "Encha a panela de água e espere ferver.", en: "Fill the pan with water and wait for it to boil.", altEs: ["Encha a panela com água e espere ferver.", "Enche a panela de água e espera ferver."], grammar: [g.imperative-formal], vocab: [w.encher, w.panela, w.ferver, w.esperar] }
      - { es: "Misture a farinha com o leite numa tigela.", en: "Mix the flour with the milk in a bowl.", altEs: ["Misturar a farinha com o leite numa tigela.", "Mistura a farinha com o leite numa tigela."], grammar: [g.imperative-formal], vocab: [w.misturar, w.farinha, w.tigela] }
      - { es: "Adicione duas colheres de açúcar e um pouco de sal.", en: "Add two spoonfuls of sugar and a little salt.", altEs: ["Adicionar duas colheres de açúcar e um pouco de sal.", "Coloque duas colheres de açúcar e um pouco de sal."], grammar: [g.imperative-formal], vocab: [w.adicionar, w.colher, w.açúcar] }
      - { es: "Asse o bolo por quarenta minutos.", en: "Bake the cake for forty minutes.", altEs: ["Assar o bolo por quarenta minutos.", "Asse o bolo durante quarenta minutos."], grammar: [g.imperative-formal], vocab: [w.assar, w.bolo], transform: { instruction: "Tell several people (vocês)", answer: "Assem o bolo por quarenta minutos.", en: "Bake the cake for forty minutes. (to several people)" } }
      - { es: "Não abra o forno antes do tempo!", en: "Don't open the oven too early!", altEs: ["Não abre o forno antes do tempo!"], grammar: [g.imperative-formal], vocab: [w.forno, w.abrir] }
      - { es: "Tempere a carne com sal, pimenta, alho e um pouco de óleo.", en: "Season the meat with salt, pepper, garlic and a little oil.", altEs: ["Temperar a carne com sal, pimenta, alho e um pouco de óleo."], grammar: [g.imperative-formal], vocab: [w.temperar, w.pimenta, w.óleo, w.carne] }
      - { es: "Derreta o chocolate e sirva com frutas.", en: "Melt the chocolate and serve it with fruit.", altEs: ["Derreta o chocolate e sirva com fruta."], grammar: [g.imperative-formal], vocab: [w.derreter, w.servir, w.chocolate, w.fondue], note: "Chocolate fondue is a winter classic in Gramado.", error: { wrong: "Derreta o chocolate e serva com frutas.", explain: "Servir changes e to i in the eu form (sirvo), so the command is sirva.", grammar: g.imperative-formal } }
      - { es: "Coloque o leite condensado e o creme de leite na panela e mexa sem parar.", en: "Put the condensed milk and the cream in the pan and stir non-stop.", altEs: ["Coloque o leite condensado e o creme de leite na panela e mexa sempre."], grammar: [g.imperative-formal], vocab: [w.colocar, w.leite-condensado, w.creme-de-leite, w.mexer] }
      - { es: "Não use a faca no fondue: use o garfo.", en: "Don't use the knife for the fondue: use the fork.", altEs: ["Não usa a faca no fondue: usa o garfo."], grammar: [g.imperative-formal], vocab: [w.faca, w.garfo, w.fondue, w.usar] }
      - { es: "Prepare todos os ingredientes antes de começar.", en: "Get all the ingredients ready before you start.", altEs: ["Prepara todos os ingredientes antes de começar.", "Separe todos os ingredientes antes de começar."], grammar: [g.imperative-formal], vocab: [w.preparar, w.ingrediente, w.começar], transform: { instruction: "Tell several people (vocês)", answer: "Preparem todos os ingredientes antes de começar.", en: "Get all the ingredients ready before you start. (to several people)" } }
      - { es: "Esta receita é da minha avó: não mude nada!", en: "This recipe is my grandmother's: don't change anything!", altEs: ["Essa receita é da minha avó: não mude nada!", "Esta receita é da minha avó: não muda nada!"], grammar: [g.imperative-formal], vocab: [w.receita, w.mudar, w.avó] }
    exchanges:
      - q: { es: "Como eu faço o chocolate quente?", en: "How do I make hot chocolate?" }
        a: { es: "Esquente o leite e misture o chocolate devagar.", en: "Heat the milk and stir in the chocolate slowly." }
        alt: ["Misture leite e chocolate.", "É fácil: leite, chocolate e um pouco de açúcar."]
        grammar: [g.imperative-formal]
        vocab: [w.esquentar, w.misturar]
      - q: { es: "Quanto tempo o bolo fica no forno?", en: "How long does the cake stay in the oven?" }
        a: { es: "Deixe assar por meia hora.", en: "Let it bake for half an hour." }
        alt: ["Meia hora.", "Uns trinta minutos."]
        grammar: [g.imperative-formal]
        vocab: [w.forno, w.assar]
      - q: { es: "Posso ajudar na cozinha?", en: "Can I help in the kitchen?" }
        a: { es: "Pode! Corte as cenouras, por favor.", en: "You can! Cut the carrots, please." }
        alt: ["Claro, lave as verduras.", "Não precisa, obrigada."]
        grammar: [g.imperative-formal]
        vocab: [w.cortar, w.cenoura]
      - q: { es: "Quais são os ingredientes?", en: "What are the ingredients?" }
        a: { es: "Farinha, ovos, leite, açúcar e manteiga.", en: "Flour, eggs, milk, sugar and butter." }
        alt: ["Só farinha, ovos e leite."]
        vocab: [w.ingrediente, w.farinha]
      - q: { es: "Coloco o sal agora?", en: "Shall I put the salt in now?" }
        a: { es: "Não, coloque só no final.", en: "No, only put it in at the end." }
        alt: ["Pode colocar.", "Coloque um pouco."]
        grammar: [g.imperative-formal]
        vocab: [w.colocar]
    texts:
      - title: "Receita de chocolate quente"
        es: ["Esquente dois copos de leite numa panela.", "Adicione o chocolate e mexa até derreter.", "Sirva bem quente, com biscoitos."]
        en: ["Heat two glasses of milk in a pan.", "Add the chocolate and stir until it melts.", "Serve it piping hot, with biscuits."]
        grammar: [g.imperative-formal]
        vocab: [w.esquentar, w.adicionar, w.derreter, w.servir]
      - title: "Fondue de queijo"
        es: ["Corte o pão em pedaços.", "Derreta o queijo com um pouco de vinho branco.", "Sirva na mesa e use os garfos de fondue."]
        en: ["Cut the bread into pieces.", "Melt the cheese with a little white wine.", "Serve it at the table and use the fondue forks."]
        grammar: [g.imperative-formal]
        vocab: [w.fondue, w.derreter, w.garfo]
    spicy:
      - { es: "Prepare o fondue; eu levo o vinho e a conversa.", en: "You make the fondue; I'll bring the wine and the conversation.", altEs: ["Prepara o fondue que eu levo o vinho e a conversa."], grammar: [g.imperative-formal], vocab: [w.preparar, w.fondue, w.vinho] }
      - { es: "Misture chocolate, o frio de Gramado e você: receita perfeita.", en: "Mix chocolate, the Gramado cold and you: the perfect recipe.", grammar: [g.imperative-formal], vocab: [w.misturar, w.receita] }
      - { es: "Não coloque pimenta: eu já sou picante o suficiente.", en: "Don't add pepper: I'm hot enough already.", altEs: ["Não coloca pimenta: eu já sou picante o suficiente."], grammar: [g.imperative-formal], vocab: [w.colocar, w.pimenta, w.picante] }
      - { es: "Sirva o vinho e sente aqui do meu lado.", en: "Pour the wine and sit here next to me.", altEs: ["Serve o vinho e senta aqui do meu lado."], grammar: [g.imperative-formal], vocab: [w.servir, w.vinho] }
      - { es: "Deixe a sobremesa para depois. Primeiro, um beijo.", en: "Leave dessert for later. First, a kiss.", altEs: ["Deixa a sobremesa pra depois. Primeiro, um beijo."], grammar: [g.imperative-formal], vocab: [w.sobremesa, w.beijo] }
  - id: a2.u10.l2
    title: Vem cá!
    teach: [g.imperative-informal]
    vocab: [w.lixo, w.jogar-fora, w.limpar, w.arrumar, w.varrer, w.louça, w.pia, w.aspirador, w.máquina-de-lavar, w.guardar, w.gaveta, w.espelho, w.tapete, w.almofada, w.cortina, w.quadro, w.vaso, w.guarda-roupa, w.cesta, w.saco, w.lata, w.molhar, w.molhado, w.secar, w.segurar, w.quieto, w.cuidado, w.lavar, w.tirar, w.iogurte, w.cereal, w.mel, w.geleia, w.salsicha, w.bife, w.alface]
    tip: "Among friends and family, Brazilians use the ele form of the present as a command: fala, vem, arruma, me passa. Keep fale, venha for strangers and writing."
    sentences:
      - { es: "Vem cá, quero te mostrar a lareira.", en: "Come here, I want to show you the fireplace.", altEs: ["Venha cá, quero te mostrar a lareira.", "Vem aqui, quero te mostrar a lareira."], grammar: [g.imperative-informal], vocab: [w.vir, w.lareira] }
      - { es: "Me passa o mel?", en: "Can you pass me the honey?", altEs: ["Me passa o mel, por favor?", "Passa o mel?"], grammar: [g.imperative-informal], vocab: [w.mel, w.passar] }
      - { es: "Leva o lixo lá pra fora, por favor.", en: "Take the rubbish out, please.", altEs: ["Leva o lixo pra fora, por favor.", "Leva o lixo lá para fora, por favor."], altEn: ["Take the trash out, please."], grammar: [g.imperative-informal], vocab: [w.lixo, w.levar], transform: { instruction: "Make it standard (for a stranger or a note)", answer: "Leve o lixo lá para fora, por favor.", alt: ["Leve o lixo para fora, por favor.", "Leve o lixo lá pra fora, por favor."], en: "Take the rubbish out, please." } }
      - { es: "Joga fora esse iogurte, é da semana passada.", en: "Throw that yoghurt away, it's from last week.", altEs: ["Jogue fora esse iogurte, é da semana passada."], grammar: [g.imperative-informal], vocab: [w.jogar-fora, w.iogurte, w.passado] }
      - { es: "Arruma o teu quarto antes da visita chegar.", en: "Tidy your room before the visitors arrive.", altEs: ["Arruma o seu quarto antes da visita chegar.", "Arrume o seu quarto antes de a visita chegar."], grammar: [g.imperative-informal], vocab: [w.arrumar, w.quarto, w.visita], note: "In Rio Grande do Sul people say tu, often with the você verb form: tu vai, tu quer, o teu quarto." }
      - { es: "Lava a louça e guarda os pratos no armário.", en: "Wash the dishes and put the plates away in the cupboard.", altEs: ["Lave a louça e guarde os pratos no armário."], grammar: [g.imperative-informal], vocab: [w.lavar, w.louça, w.guardar, w.prato] }
      - { es: "Não deixa a toalha molhada na cama!", en: "Don't leave the wet towel on the bed!", altEs: ["Não deixe a toalha molhada na cama!"], grammar: [g.imperative-informal], vocab: [w.molhado, w.toalha, w.deixar], note: "In speech the negative usually keeps the same form: não deixa. The standard is não deixe." }
      - { es: "Passa o aspirador no tapete da sala.", en: "Vacuum the living-room rug.", altEs: ["Passe o aspirador no tapete da sala."], grammar: [g.imperative-informal], vocab: [w.aspirador, w.tapete, w.sala] }
      - { es: "Fica quieto, o bebê está dormindo!", en: "Keep still, the baby's sleeping!", altEs: ["Fica quieta, o bebê está dormindo!", "Fique quieto, o bebê está dormindo!"], altEn: ["Be quiet, the baby's asleep!"], grammar: [g.imperative-informal], vocab: [w.quieto, w.bebê] }
      - { es: "Segura a cesta, que eu abro a porta.", en: "Hold the basket and I'll open the door.", altEs: ["Segura a cesta que eu abro a porta.", "Segure a cesta, que eu abro a porta."], grammar: [g.imperative-informal], vocab: [w.segurar, w.cesta, w.porta] }
      - { es: "Tira a roupa da máquina de lavar e deixa secar no sol.", en: "Take the clothes out of the washing machine and let them dry in the sun.", altEs: ["Tire a roupa da máquina de lavar e deixe secar no sol."], grammar: [g.imperative-informal], vocab: [w.tirar, w.máquina-de-lavar, w.secar] }
      - { es: "Toma o café da manhã: tem pão, mel, geleia e cereal.", en: "Have your breakfast: there's bread, honey, jam and cereal.", altEs: ["Toma café: tem pão, mel, geleia e cereal."], grammar: [g.imperative-informal], vocab: [w.cereal, w.geleia, w.café-da-manhã], variant: "Portugal: Toma o pequeno-almoço." }
      - { es: "Abre a cortina e olha a geada lá fora!", en: "Open the curtain and look at the frost outside!", altEs: ["Abra a cortina e olhe a geada lá fora!"], grammar: [g.imperative-informal], vocab: [w.cortina, w.geada, w.lá-fora], error: { wrong: "Abri a cortina e olha a geada lá fora!", explain: "The informal command is the ele form of the present: abre (abri means 'I opened').", grammar: g.imperative-informal } }
      - { es: "Varre a varanda e limpa a pia, tá?", en: "Sweep the balcony and clean the sink, OK?", altEs: ["Varre a varanda e limpa a pia, tá bom?"], grammar: [g.imperative-informal], vocab: [w.varrer, w.limpar, w.pia, w.varanda], transform: { instruction: "Make it standard (você)", answer: "Varra a varanda e limpe a pia.", alt: ["Varra a varanda e limpe a pia, por favor."], en: "Sweep the balcony and clean the sink." } }
      - { es: "Cuidado! Não molha o chão, acabei de limpar!", en: "Careful! Don't get the floor wet, I've just cleaned it!", altEs: ["Cuidado! Não molhe o chão, acabei de limpar!", "Cuidado, não molha o chão, que eu acabei de limpar!"], grammar: [g.imperative-informal], vocab: [w.cuidado, w.molhar, w.chão, w.limpar] }
      - { es: "Fala sério! Você comeu toda a geleia?", en: "Seriously? You ate all the jam?", altEs: ["Fala sério, você comeu a geleia toda?"], altEn: ["Come on! You ate all the jam?"], grammar: [g.imperative-informal], vocab: [w.geleia, w.sério] }
    exchanges:
      - q: { es: "Onde eu guardo os garfos?", en: "Where do I put the forks away?" }
        a: { es: "Guarda na primeira gaveta.", en: "Put them in the top drawer." }
        alt: ["Na gaveta.", "Ali, na gaveta da pia."]
        grammar: [g.imperative-informal]
        vocab: [w.guardar, w.gaveta]
      - q: { es: "O que tem para o jantar?", en: "What's for dinner?" }
        a: { es: "Bife com salada. Lava a alface pra mim?", en: "Steak and salad. Will you wash the lettuce for me?" }
        alt: ["Salsicha com batata.", "Bife com salada."]
        grammar: [g.imperative-informal]
        vocab: [w.bife, w.alface, w.salsicha]
      - q: { es: "Me ajuda com esse quadro?", en: "Will you help me with this picture?" }
        a: { es: "Ajudo! Segura daí que eu seguro daqui.", en: "Sure! You hold that end and I'll hold this one." }
        alt: ["Claro, fala.", "Agora não, depois."]
        grammar: [g.imperative-informal]
        vocab: [w.quadro, w.segurar]
      - q: { es: "Onde eu ponho as almofadas?", en: "Where do I put the cushions?" }
        a: { es: "Põe no sofá, perto da janela.", en: "Put them on the sofa, by the window." }
        alt: ["No sofá.", "Deixa ali."]
        grammar: [g.imperative-informal, g.imperative-irregular]
        vocab: [w.almofada, w.sofá]
      - q: { es: "Posso jogar fora essas latas?", en: "Can I throw these cans away?" }
        a: { es: "Joga, mas coloca no saco amarelo.", en: "Yes, but put them in the yellow bag." }
        alt: ["Pode jogar.", "Não, guarda pra mim."]
        grammar: [g.imperative-informal]
        vocab: [w.jogar-fora, w.lata, w.saco]
    texts:
      - title: "Bilhete da mãe"
        es: ["Filho, a visita chega às sete.", "Arruma o quarto e guarda as roupas no guarda-roupa.", "Põe flores no vaso da sala.", "E não come o pudim, que é a sobremesa!"]
        en: ["Son, the visitors are arriving at seven.", "Tidy your room and put your clothes away in the wardrobe.", "Put some flowers in the vase in the living room.", "And don't eat the pudding, it's for dessert!"]
        grammar: [g.imperative-informal]
        vocab: [w.arrumar, w.guarda-roupa, w.vaso]
      - title: "Convite"
        es: ["Amiga, vem tomar um café colonial lá em casa!", "Traz só a sua fome.", "Aqui tem pão, geleia, mel e muito bolo."]
        en: ["Hey, come over for a café colonial at my place!", "Just bring your appetite.", "There's bread, jam, honey and lots of cake."]
        grammar: [g.imperative-informal]
        vocab: [w.geleia, w.mel]
    spicy:
      - { es: "Vem cá e me dá um abraço, que está frio.", en: "Come here and give me a hug, it's cold.", altEs: ["Vem cá e me dá um abraço, tá frio."], grammar: [g.imperative-informal], vocab: [w.vir, w.abraço] }
      - { es: "Fala sério: você cozinha, limpa e ainda dança bem?", en: "Seriously: you cook, you clean and you dance well too?", grammar: [g.imperative-informal], vocab: [w.limpar, w.cozinhar, w.dançar] }
      - { es: "Segura a minha mão, o chão está molhado. Só por isso, tá?", en: "Hold my hand, the floor's wet. That's the only reason, OK?", altEs: ["Segura a minha mão, que o chão está molhado. Só por isso, tá?"], grammar: [g.imperative-informal], vocab: [w.segurar, w.molhado, w.mão] }
      - { es: "Arruma a mala: sexta a gente vai pra Gramado.", en: "Pack your bag: on Friday we're going to Gramado.", altEs: ["Arruma a mala, que sexta a gente vai pra Gramado."], grammar: [g.imperative-informal], vocab: [w.arrumar, w.mala] }
      - { es: "Olha pro espelho e me diz: quem é a pessoa mais linda daqui?", en: "Look in the mirror and tell me: who's the most gorgeous person here?", altEs: ["Olha no espelho e me diz: quem é a pessoa mais linda daqui?"], grammar: [g.imperative-informal], vocab: [w.espelho, w.olhar] }
  - id: a2.u10.l3
    title: Seja bem-vindo a Gramado!
    teach: [g.imperative-irregular]
    vocab: [w.turma, w.prova, w.nota, w.matéria, w.dever-de-casa, w.anotar, w.revisar, w.corrigir, w.dicionário, w.página, w.liquidação, w.vitrine, w.provador, w.caixa, w.empurrar, w.puxar, w.atenção, w.paciência, w.lanchonete, w.sorveteria, w.açougue, w.peixaria, w.cachorro-quente, w.hambúrguer, w.batata-frita, w.macarrão, w.molho-de-tomate, w.sobremesa, w.pudim, w.torta, w.biscoito, w.hortênsia, w.pedalinho]
    tip: "Learn the six oddballs: seja, esteja, vá, dê, saiba, queira. The rest come from the eu form: faço → faça, ponho → ponha, trago → traga."
    sentences:
      - { es: "Seja bem-vindo a Gramado!", en: "Welcome to Gramado!", altEs: ["Seja bem-vinda a Gramado!", "Sejam bem-vindos a Gramado!"], grammar: [g.imperative-irregular], vocab: [w.bem-vindo, w.ser] }
      - { es: "Tenha paciência: a fila é grande, mas anda rápido.", en: "Be patient: the queue is long, but it moves quickly.", altEs: ["Tenha paciência, a fila é grande, mas anda rápido."], grammar: [g.imperative-irregular], vocab: [w.paciência, w.fila] }
      - { es: "Vá até o Lago Negro e alugue um pedalinho.", en: "Go to Lago Negro and hire a pedal boat.", altEs: ["Vai até o Lago Negro e aluga um pedalinho."], grammar: [g.imperative-irregular], vocab: [w.ir, w.alugar, w.pedalinho], note: "Lago Negro is a small lake in Gramado, surrounded by trees brought from the Black Forest in Germany." }
      - { es: "Tragam o dicionário amanhã, turma!", en: "Bring your dictionaries tomorrow, class!", altEs: ["Turma, tragam o dicionário amanhã!", "Tragam os dicionários amanhã, turma!"], grammar: [g.imperative-irregular], vocab: [w.trazer, w.dicionário, w.turma] }
      - { es: "Façam os exercícios da página trinta.", en: "Do the exercises on page thirty.", altEs: ["Façam os exercícios na página trinta."], grammar: [g.imperative-irregular], vocab: [w.fazer, w.exercício, w.página] }
      - { es: "Ponha o nome na prova antes de começar.", en: "Put your name on the test before you start.", altEs: ["Põe o nome na prova antes de começar.", "Coloque o nome na prova antes de começar."], grammar: [g.imperative-irregular], vocab: [w.pôr, w.prova, w.nome], error: { wrong: "Ponga o nome na prova antes de começar.", explain: "Pôr → ponho → ponha (Spanish ponga).", grammar: g.imperative-irregular } }
      - { es: "Diga para a professora que eu já fiz o dever de casa.", en: "Tell the teacher I've already done the homework.", altEs: ["Diz pra professora que eu já fiz o dever de casa.", "Diga à professora que eu já fiz o dever de casa."], grammar: [g.imperative-irregular], vocab: [w.dizer, w.dever-de-casa] }
      - { es: "Dê uma olhada na vitrine: a liquidação começou.", en: "Take a look in the shop window: the sale has started.", altEs: ["Dá uma olhada na vitrine: a liquidação começou."], grammar: [g.imperative-irregular], vocab: [w.dar, w.vitrine, w.liquidação], error: { wrong: "De uma olhada na vitrine: a liquidação começou.", explain: "The command form of dar is dê, with a circumflex; de without it is the preposition 'of'.", grammar: g.imperative-irregular } }
      - { es: "Esteja na sorveteria às três, combinado?", en: "Be at the ice-cream parlour at three, OK?", altEs: ["Esteja na sorveteria às três, tá?"], grammar: [g.imperative-irregular], vocab: [w.estar, w.sorveteria, w.combinado] }
      - { es: "Os provadores ficam no segundo andar; vá pela escada.", en: "The fitting rooms are on the second floor; take the stairs.", altEs: ["Os provadores ficam no segundo andar; vai pela escada."], grammar: [g.imperative-irregular], vocab: [w.provador, w.escada, w.andar.n] }
      - { es: "Venha comer um cachorro-quente na lanchonete da esquina.", en: "Come and have a hot dog at the snack bar on the corner.", altEs: ["Vem comer um cachorro-quente na lanchonete da esquina."], grammar: [g.imperative-irregular], vocab: [w.vir, w.cachorro-quente, w.lanchonete] }
      - { es: "Peça a torta de maçã: é a melhor da cidade.", en: "Order the apple pie: it's the best in town.", altEs: ["Pede a torta de maçã: é a melhor da cidade."], grammar: [g.imperative-irregular], vocab: [w.pedir, w.torta, w.maçã], note: "Pedir → peço → peça.", transform: { instruction: "Tell several people (vocês)", answer: "Peçam a torta de maçã: é a melhor da cidade.", en: "Order the apple pie: it's the best in town. (to several people)" } }
      - { es: "Vejam as notas e anotem as perguntas.", en: "Look at your marks and note down your questions.", altEs: ["Olhem as notas e anotem as perguntas."], grammar: [g.imperative-irregular], vocab: [w.ver, w.nota, w.anotar] }
      - { es: "Saia pela porta da direita e empurre, não puxe.", en: "Go out through the door on the right and push, don't pull.", altEs: ["Sai pela porta da direita e empurra, não puxa."], grammar: [g.imperative-irregular], vocab: [w.sair, w.empurrar, w.puxar] }
      - { es: "Ouça com atenção e repita.", en: "Listen carefully and repeat.", altEs: ["Escute com atenção e repita."], grammar: [g.imperative-irregular], vocab: [w.ouvir, w.atenção, w.repetir], transform: { instruction: "Tell the whole class (vocês)", answer: "Ouçam com atenção e repitam.", alt: ["Escutem com atenção e repitam."], en: "Listen carefully and repeat. (to the class)" } }
      - { es: "Revise a matéria antes da prova.", en: "Go over the material before the test.", altEs: ["Revisa a matéria antes da prova."], grammar: [g.imperative-formal], vocab: [w.revisar, w.matéria, w.prova] }
    exchanges:
      - q: { es: "Com licença, onde fica o caixa?", en: "Excuse me, where's the checkout?" }
        a: { es: "Siga em frente e vire à esquerda.", en: "Go straight on and turn left." }
        alt: ["Ali, à esquerda.", "Lá no fundo, à esquerda."]
        grammar: [g.imperative-formal]
        vocab: [w.caixa, w.seguir]
      - q: { es: "O que você me sugere?", en: "What would you suggest?" }
        a: { es: "Peça o macarrão com molho de tomate; é ótimo.", en: "Order the pasta with tomato sauce; it's great." }
        alt: ["O hambúrguer com batata frita.", "A torta de maçã."]
        grammar: [g.imperative-irregular]
        vocab: [w.macarrão, w.molho-de-tomate, w.hambúrguer, w.batata-frita]
      - q: { es: "Professora, posso usar o dicionário na prova?", en: "Miss, can I use the dictionary in the test?" }
        a: { es: "Não, guarde o dicionário, por favor.", en: "No, put the dictionary away, please." }
        alt: ["Pode, sim.", "Hoje não."]
        grammar: [g.imperative-formal]
        vocab: [w.dicionário, w.prova]
      - q: { es: "Onde eu compro peixe e carne?", en: "Where do I buy fish and meat?" }
        a: { es: "Vá à peixaria da praça; o açougue fica ao lado.", en: "Go to the fishmonger's on the square; the butcher's is next door." }
        alt: ["Na peixaria e no açougue.", "No mercado."]
        grammar: [g.imperative-irregular]
        vocab: [w.peixaria, w.açougue]
      - q: { es: "Quando a professora vai corrigir as provas?", en: "When is the teacher going to mark the tests?" }
        a: { es: "Ela disse que vai corrigir até sexta.", en: "She said she'll mark them by Friday." }
        alt: ["Até sexta.", "Não sei, pergunte para ela."]
        vocab: [w.corrigir, w.prova]
    texts:
      - title: "Instruções para a prova"
        es: ["Escreva o nome no alto da página.", "Leia todas as perguntas com atenção.", "Não use o dicionário e tenha paciência!"]
        en: ["Write your name at the top of the page.", "Read all the questions carefully.", "Don't use the dictionary, and be patient!"]
        grammar: [g.imperative-formal, g.imperative-irregular]
        vocab: [w.página, w.atenção, w.paciência]
      - title: "Aviso na sorveteria"
        es: ["Seja bem-vindo!", "Escolha até três sabores e pague no caixa.", "Volte sempre!"]
        en: ["Welcome!", "Choose up to three flavours and pay at the till.", "Come back soon!"]
        grammar: [g.imperative-irregular, g.imperative-formal]
        vocab: [w.sorveteria, w.caixa, w.sabor]
    spicy:
      - { es: "Diga a verdade: você veio pelo chocolate ou por mim?", en: "Tell the truth: did you come for the chocolate or for me?", altEs: ["Diz a verdade: você veio pelo chocolate ou por mim?"], grammar: [g.imperative-irregular], vocab: [w.dizer, w.verdade] }
      - { es: "Venha experimentar o meu pudim; a receita é segredo.", en: "Come and try my pudding; the recipe is a secret.", altEs: ["Vem experimentar o meu pudim; a receita é segredo."], grammar: [g.imperative-irregular], vocab: [w.pudim, w.experimentar, w.segredo] }
      - { es: "Tenha paciência comigo: eu danço mal, mas aprendo rápido.", en: "Be patient with me: I dance badly, but I learn fast.", grammar: [g.imperative-irregular], vocab: [w.paciência, w.dançar] }
      - { es: "Dê uma volta comigo no Lago Negro; o pedalinho é para dois.", en: "Go round Lago Negro with me; the pedal boat is for two.", altEs: ["Dá uma volta comigo no Lago Negro; o pedalinho é pra dois."], grammar: [g.imperative-irregular], vocab: [w.dar, w.pedalinho] }
      - { es: "Ponha o casaco e venha: as hortênsias e eu estamos esperando.", en: "Put your coat on and come: the hydrangeas and I are waiting.", altEs: ["Põe o casaco e vem: as hortênsias e eu estamos esperando."], grammar: [g.imperative-irregular], vocab: [w.pôr, w.hortênsia, w.casaco] }
  - id: a2.u10.l4
    title: Você poderia me ajudar?
    teach: [g.polite-requests]
    vocab: [w.abaixar, w.aumentar, w.desligar, w.apertar, w.clicar, w.baixar, w.enviar, w.salvar, w.senha, w.tela, w.imprimir, w.preencher, w.formulário, w.assinar, w.importar-se, w.imagina, w.moço, w.legume, w.verdura, w.morango, w.melancia, w.abacate, w.goiaba, w.pera, w.pêssego, w.pepino, w.brócolis, w.couve, w.abobrinha, w.berinjela, w.pimentão, w.milho, w.picante, w.azeitona, w.mandioca]
    tip: "Soften a request with Você pode…?, Você poderia…?, Dá pra…?, Tem como…? A bare command is fine with friends but can sound rude to strangers."
    sentences:
      - { es: "Você pode me ajudar com o formulário?", en: "Can you help me with the form?", altEs: ["Pode me ajudar com o formulário?", "Você poderia me ajudar com o formulário?"], grammar: [g.polite-requests], vocab: [w.formulário, w.ajudar] }
      - { es: "Dá pra abaixar o som? Estou estudando.", en: "Could you turn the music down? I'm studying.", altEs: ["Dá para abaixar o som? Estou estudando.", "Você pode abaixar o som? Tô estudando."], grammar: [g.polite-requests], vocab: [w.abaixar, w.som], transform: { instruction: "Make it more polite with poderia", answer: "Você poderia abaixar o som? Estou estudando.", alt: ["Você poderia abaixar o som, por favor? Estou estudando."], en: "Could you turn the music down? I'm studying." } }
      - { es: "Tem como pagar com cartão?", en: "Is it possible to pay by card?", altEs: ["Dá pra pagar com cartão?", "Dá para pagar com cartão?"], grammar: [g.polite-requests], vocab: [w.cartão, w.pagar], transform: { instruction: "Ask it with posso", answer: "Posso pagar com cartão?", en: "Can I pay by card?" } }
      - { es: "Você se importa de fechar a janela?", en: "Do you mind closing the window?", altEs: ["Você se importa de fechar a janela, por favor?"], grammar: [g.polite-requests], vocab: [w.importar-se, w.janela], error: { wrong: "Você se importa em fechar a janela?", explain: "Importar-se takes de: você se importa de fechar…?", grammar: g.polite-requests } }
      - { es: "Será que você podia me enviar as fotos por e-mail?", en: "I wonder if you could send me the photos by email?", altEs: ["Será que você poderia me enviar as fotos por e-mail?", "Você pode me mandar as fotos por e-mail?"], grammar: [g.polite-requests], vocab: [w.enviar, w.foto, w.e-mail] }
      - { es: "Moço, me traz mais uma água, por favor?", en: "Excuse me, could you bring me another water, please?", altEs: ["Moço, traz mais uma água, por favor?", "Moço, pode me trazer mais uma água?"], grammar: [g.polite-requests], vocab: [w.moço, w.trazer], note: "Moço / moça is how Brazilians call a waiter or shop assistant." }
      - { es: "Muito obrigado pelo café! — Imagina, foi um prazer.", en: "Thanks so much for the coffee! — Don't mention it, it was a pleasure.", altEs: ["Muito obrigada pelo café! — Imagina, foi um prazer."], grammar: [g.polite-requests], vocab: [w.imagina, w.prazer] }
      - { es: "Por favor, preencha e assine o formulário.", en: "Please fill in and sign the form.", altEs: ["Por gentileza, preencha e assine o formulário."], grammar: [g.polite-requests, g.imperative-formal], vocab: [w.preencher, w.assinar, w.formulário], error: { wrong: "Por favor, preenche e assina o formulário.", explain: "With customers and in writing, use the standard command: preencha, assine.", grammar: g.imperative-formal } }
      - { es: "Com licença, aperta o quatro pra mim?", en: "Excuse me, could you press four for me?", altEs: ["Com licença, você pode apertar o quatro pra mim?", "Com licença, aperta o quatro para mim?"], grammar: [g.polite-requests], vocab: [w.apertar, w.com-licença] }
      - { es: "Você poderia imprimir a reserva para mim?", en: "Could you print the booking for me?", altEs: ["Você pode imprimir a reserva pra mim?"], grammar: [g.polite-requests], vocab: [w.imprimir, w.reserva] }
      - { es: "Clique aqui e coloque a sua senha.", en: "Click here and enter your password.", altEs: ["Clica aqui e coloca a sua senha."], grammar: [g.imperative-formal], vocab: [w.clicar, w.senha] }
      - { es: "Não esqueça de salvar antes de desligar o computador.", en: "Don't forget to save before you switch off the computer.", altEs: ["Não se esqueça de salvar antes de desligar o computador.", "Não esquece de salvar antes de desligar o computador."], grammar: [g.imperative-formal], vocab: [w.salvar, w.desligar, w.computador] }
      - { es: "Baixe o aplicativo do parque para comprar os ingressos.", en: "Download the park's app to buy the tickets.", altEs: ["Baixa o aplicativo do parque pra comprar os ingressos."], grammar: [g.imperative-formal], vocab: [w.baixar, w.aplicativo, w.ingresso] }
      - { es: "Você pode aumentar o som? Não estou ouvindo nada.", en: "Can you turn the sound up? I can't hear anything.", altEs: ["Dá pra aumentar o som? Não estou ouvindo nada."], grammar: [g.polite-requests], vocab: [w.aumentar, w.som] }
      - { es: "A tela do meu celular quebrou. Tem como trocar?", en: "My phone screen has broken. Can it be replaced?", altEs: ["A tela do meu celular quebrou. Dá pra trocar?"], grammar: [g.polite-requests], vocab: [w.tela, w.quebrar, w.trocar] }
      - { es: "Moça, me vê um quilo de morangos, por favor.", en: "Could I have a kilo of strawberries, please?", altEs: ["Moça, me dá um quilo de morangos, por favor.", "Me vê um quilo de morango, por favor."], grammar: [g.polite-requests], vocab: [w.morango, w.quilo], note: "Me vê… is a very Brazilian way to order at a counter or market stall." }
    exchanges:
      - q: { es: "Moço, essa melancia está doce?", en: "Excuse me, is this watermelon sweet?" }
        a: { es: "Está, sim! Pode provar um pedaço.", en: "Yes, it is! You can try a piece." }
        alt: ["Está ótima.", "Está, pode levar."]
        grammar: [g.polite-requests]
        vocab: [w.melancia, w.moço]
      - q: { es: "Você se importa de esperar um pouco?", en: "Do you mind waiting a little?" }
        a: { es: "Imagina, pode ir tranquilo.", en: "Not at all, take your time." }
        alt: ["Não, tudo bem.", "Me importo, sim, estou com pressa."]
        grammar: [g.polite-requests]
        vocab: [w.importar-se, w.imagina]
      - q: { es: "Tem como trocar esse celular?", en: "Is it possible to exchange this phone?" }
        a: { es: "Tem, sim, mas preciso da nota.", en: "Yes, but I need the receipt." }
        alt: ["Tem, sim.", "Infelizmente não."]
        grammar: [g.polite-requests]
        vocab: [w.trocar, w.nota]
      - q: { es: "Esse molho é picante?", en: "Is this sauce spicy?" }
        a: { es: "Um pouco. Tem pimentão e pimenta.", en: "A bit. It's got peppers and chilli in it." }
        alt: ["Não, nada picante.", "É muito picante!"]
        vocab: [w.picante, w.pimentão]
      - q: { es: "Você come verduras?", en: "Do you eat greens?" }
        a: { es: "Como, mas prefiro legumes assados.", en: "I do, but I prefer roast vegetables." }
        alt: ["Como, sim.", "Só couve e alface."]
        vocab: [w.verdura, w.legume, w.couve]
    texts:
      - title: "Lista da feira"
        es: ["Por favor, compra na feira brócolis, couve, abobrinha e berinjela.", "Traz também milho, pepino e um pimentão vermelho.", "Se tiver goiaba e pera, traz um quilo de cada!"]
        en: ["Please buy broccoli, kale, courgettes and aubergines at the market.", "Bring corn, a cucumber and a red pepper too.", "If they have guavas and pears, bring a kilo of each!"]
        grammar: [g.imperative-informal]
        vocab: [w.brócolis, w.abobrinha, w.berinjela, w.milho, w.pepino, w.goiaba, w.pera]
      - title: "E-mail para a pousada"
        es: ["Bom dia! Vocês poderiam me enviar o formulário de reserva?", "Será que tem como chegar mais cedo, às dez?", "Muito obrigada!"]
        en: ["Good morning! Could you send me the booking form?", "I wonder if it's possible to arrive earlier, at ten?", "Thank you very much!"]
        grammar: [g.polite-requests]
        vocab: [w.enviar, w.formulário]
    spicy:
      - { es: "Você se importa de dividir a mesa comigo?", en: "Do you mind sharing the table with me?", grammar: [g.polite-requests], vocab: [w.importar-se, w.dividir] }
      - { es: "Moço, me vê uma mandioca frita e o seu telefone, por favor.", en: "Excuse me, I'll have some fried cassava and your phone number, please.", altEs: ["Moça, me vê uma mandioca frita e o seu telefone, por favor."], grammar: [g.polite-requests], vocab: [w.moço, w.mandioca] }
      - { es: "Tem como você tirar as azeitonas da minha pizza e sentar comigo?", en: "Could you take the olives off my pizza and sit with me?", grammar: [g.polite-requests], vocab: [w.azeitona, w.tirar] }
      - { es: "Dá pra desligar o celular e olhar só pra mim?", en: "Could you switch off your phone and look only at me?", altEs: ["Dá para desligar o celular e olhar só para mim?"], grammar: [g.polite-requests], vocab: [w.desligar, w.olhar] }
      - { es: "Você divide um pêssego comigo? Ou um abacate? Eu não sou difícil.", en: "Will you share a peach with me? Or an avocado? I'm not fussy.", grammar: [g.polite-requests], vocab: [w.pêssego, w.abacate] }
dialogues:
  - id: a2.u10.d1
    title: Na loja de chocolate
    context: Marinalva, a tourist from Recife, walks into a chocolate shop in Gramado run by Klaus.
    lines:
      - { speaker: Klaus, es: "Boa tarde, seja bem-vinda! Fique à vontade.", en: "Good afternoon, welcome! Take your time." }
      - { speaker: Marinalva, es: "Obrigada! Você poderia me ajudar? Quero levar chocolate para a minha família.", en: "Thank you! Could you help me? I want to take some chocolate home to my family." }
      - { speaker: Klaus, es: "Claro! Experimente este aqui, de morango.", en: "Of course! Try this one, it's strawberry." }
      - { speaker: Marinalva, es: "Que delícia! Me vê uma caixa desse, por favor.", en: "Delicious! Could I have a box of these, please?" }
      - { speaker: Klaus, es: "Pois não. E tem como mandar outras caixas para Recife, se a senhora quiser.", en: "Certainly. And we can also send other boxes to Recife, if you like." }
      - { speaker: Marinalva, es: "Ótimo! O que eu preciso fazer?", en: "Great! What do I need to do?" }
      - { speaker: Klaus, es: "Preencha este formulário e pague no caixa, por favor.", en: "Fill in this form and pay at the till, please." }
      - { speaker: Marinalva, es: "Pronto. Ah, e onde fica o Lago Negro?", en: "Done. Oh, and where's Lago Negro?" }
      - { speaker: Klaus, es: "Saia da loja, vire à direita e siga em frente. Mas vá antes das seis!", en: "Leave the shop, turn right and go straight on. But go before six!" }
      - { speaker: Marinalva, es: "Por quê?", en: "Why?" }
      - { speaker: Klaus, es: "Porque às seis começa o show de Natal na Rua Coberta. Não perca!", en: "Because at six the Christmas show starts on the Rua Coberta. Don't miss it!" }
    questions:
      - { q: "O que a Marinalva quer levar para a família?", options: ["Vinho", "Chocolate", "Hortênsias"], answer: 1, explain: "Quero levar chocolate para a minha família." }
      - { q: "O que a Marinalva precisa fazer para mandar as caixas?", options: ["Ligar para a loja", "Preencher um formulário e pagar no caixa", "Ir ao correio"], answer: 1, explain: "Klaus says: Preencha este formulário e pague no caixa." }
      - { q: "Como ela chega ao Lago Negro?", options: ["Sai da loja, vira à direita e segue em frente", "Pega um ônibus", "Vira à esquerda na Rua Coberta"], answer: 0, explain: "Saia da loja, vire à direita e siga em frente." }
      - { q: "Por que o Klaus diz para ela ir antes das seis?", options: ["Porque o lago fecha", "Porque às seis começa o show de Natal", "Porque vai chover"], answer: 1, explain: "Às seis começa o show de Natal na Rua Coberta: Gramado's Natal Luz festival." }
