id: r.b2.grenoble-la-ville-sur-laquelle-on-parie
level: b2
title: Grenoble, la ville sur laquelle on parie
kind: text
intro: Inès, a physicist from Paris, explains why she moved to Grenoble, the «capital of the Alps» and a city of science. Notice the relative pronouns lequel, laquelle, auquel and duquel.
allow: [inès, bergès, aristide, stendhal, vercors, chartreuse, belledonne, isère, synchrotron, ok, centre]
paragraphs:
  - { es: "Quand j'ai annoncé à mes amis parisiens que j'allais m'installer à Grenoble, ils m'ont regardée avec pitié. Pour eux, c'était une ville de province grise, entourée de montagnes, dans laquelle il ne se passait rien. Cinq ans plus tard, je ne la quitterais pour rien au monde. Voici pourquoi.", en: "When I told my Parisian friends I was moving to Grenoble, they looked at me with pity. For them it was a grey provincial town surrounded by mountains, in which nothing ever happened. Five years later, I wouldn't leave it for anything in the world. Here's why." }
  - { es: "D'abord, il y a les montagnes, sans lesquelles Grenoble ne serait pas Grenoble. La ville est construite au fond d'une vallée, au bord de l'Isère, et entourée de trois massifs : la Chartreuse, le Vercors et Belledonne. Au bout de chaque rue, on aperçoit un sommet. Le samedi, je peux partir faire du ski ou de la randonnée et être de retour pour le dîner. C'est d'ailleurs à Grenoble qu'ont eu lieu les Jeux olympiques d'hiver de 1968.", en: "First, there are the mountains, without which Grenoble wouldn't be Grenoble. The city is built at the bottom of a valley, on the banks of the Isère, and surrounded by three massifs: the Chartreuse, the Vercors and Belledonne. At the end of every street you catch sight of a summit. On Saturdays I can go skiing or hiking and be back for dinner. It was in Grenoble, by the way, that the 1968 Winter Olympics took place." }
  - { es: "Le symbole de la ville, ce sont les « bulles » : les petites cabines sphériques du téléphérique qui monte au fort de la Bastille. Ce téléphérique, auquel les Grenoblois sont très attachés, a été inauguré en 1934 ; c'est l'un des premiers téléphériques urbains du monde. Les bulles, elles, datent des années soixante-dix. Du haut du fort, la vue sur la ville et sur les Alpes est spectaculaire. Par temps clair, on aperçoit même le mont Blanc.", en: "The symbol of the city is the 'bubbles': the little spherical cabins of the cable car that goes up to the Bastille fort. This cable car, to which the people of Grenoble are very attached, was opened in 1934; it's one of the first urban cable cars in the world. The bubbles themselves date from the seventies. From the top of the fort, the view over the city and the Alps is spectacular. On a clear day you can even see Mont Blanc." }
  - { es: "Mais ce qui m'a fait venir ici, c'est la science. Grenoble est une ville d'ingénieurs et de chercheurs depuis plus d'un siècle. Tout a commencé avec l'eau des montagnes. À la fin du dix-neuvième siècle, un industriel, Aristide Bergès, a utilisé la force des chutes d'eau pour produire de l'électricité. C'est lui qui a popularisé l'expression « houille blanche », par opposition au charbon, la houille noire. Autour de cette énergie, une industrie s'est développée, puis des laboratoires, des écoles d'ingénieurs et des universités.", en: "But what brought me here was science. Grenoble has been a city of engineers and researchers for more than a century. It all began with the water from the mountains. At the end of the nineteenth century, an industrialist, Aristide Bergès, used the power of waterfalls to produce electricity. He was the one who popularised the expression 'white coal', as opposed to coal, 'black coal'. Around this energy an industry grew up, then laboratories, engineering schools and universities." }
  - { es: "Aujourd'hui, je travaille sur la « presqu'île scientifique », un quartier situé entre deux rivières, au milieu duquel se trouve un énorme anneau : le synchrotron. C'est un grand instrument européen grâce auquel des chercheurs du monde entier étudient la matière, des virus aux roches. Le laboratoire dans lequel je travaille réunit des physiciens de vingt nationalités. Le midi, à la cantine, on entend parler italien, allemand, chinois, espagnol… et parfois français.", en: "Today I work on the 'scientific peninsula', a district between two rivers, in the middle of which there is an enormous ring: the synchrotron. It's a large European instrument thanks to which researchers from all over the world study matter, from viruses to rocks. The laboratory in which I work brings together physicists of twenty nationalities. At lunchtime, in the canteen, you hear Italian, German, Chinese, Spanish… and sometimes French." }
  - { es: "Grenoble n'est pas parfaite, bien sûr. L'été, la chaleur dans la vallée peut être étouffante, et l'hiver, la pollution reste parfois coincée entre les montagnes. Les loyers ont augmenté. Mais c'est une ville jeune, avec beaucoup d'étudiants, une politique écologique ambitieuse et de nombreuses pistes cyclables, sur lesquelles je vais au travail chaque matin.", en: "Grenoble isn't perfect, of course. In summer the heat in the valley can be stifling, and in winter the pollution sometimes stays trapped between the mountains. Rents have gone up. But it's a young city, with lots of students, an ambitious green policy and many cycle lanes, which I ride to work on every morning." }
  - { es: "L'écrivain Stendhal, né à Grenoble en 1783, détestait sa ville natale. Il disait qu'elle lui rappelait son enfance malheureuse. Je suis sûre que s'il revenait aujourd'hui, il changerait d'avis. Moi, en tout cas, j'ai parié sur Grenoble. Et pour l'instant, j'ai gagné.", en: "The writer Stendhal, born in Grenoble in 1783, hated his home town. He said it reminded him of his unhappy childhood. I'm sure that if he came back today, he'd change his mind. As for me, anyway, I bet on Grenoble. And so far, I've won." }
questions:
  - { q: "Que pensaient les amis parisiens d'Inès de Grenoble ?", options: ["Que c'était une ville passionnante", "Que c'était une ville grise où il ne se passait rien", "Que c'était trop cher"], answer: 1, explain: "«Une ville de province grise… dans laquelle il ne se passait rien.»" }
  - { q: "Que sont « les bulles » ?", options: ["Des boissons typiques", "Les cabines du téléphérique de la Bastille", "Des bâtiments scientifiques"], answer: 1, explain: "«Les petites cabines sphériques du téléphérique qui monte au fort de la Bastille.»" }
  - { q: "Qu'est-ce que la « houille blanche » ?", options: ["L'électricité produite grâce à l'eau des montagnes", "La neige des stations de ski", "Un fromage local"], answer: 0, explain: "Bergès used waterfalls to make electricity: «houille blanche», as opposed to coal, «la houille noire»." }
  - { q: "Qu'est-ce que le synchrotron ?", options: ["Un téléphérique", "Un grand instrument scientifique européen", "Un quartier d'étudiants"], answer: 1, explain: "«Un grand instrument européen grâce auquel des chercheurs du monde entier étudient la matière.»" }
  - { q: "Dans « un quartier… au milieu duquel se trouve un énorme anneau », à quoi correspond « duquel » ?", options: ["À de + lequel (au milieu du quartier)", "À la rivière", "À l'anneau"], answer: 0, explain: "Au milieu de + le quartier → au milieu duquel (de + lequel)." }
