dialogues:
  - id: a1.u03.d1
    title: 喺山頂
    context: Sam and Mandy are at the Peak. A tourist asks them to take a photo, and they start chatting.
    lines:
      - { speaker: Ana, es: "唔好意思，你哋識唔識講英文呀？", en: "Excuse me, do you speak English?" }
      - { speaker: Mandy, es: "識呀。不過你講廣東話都得！", en: "Yes. But you can speak Cantonese too!" }
      - { speaker: Ana, es: "好呀，我講少少廣東話。我叫Ana，係西班牙人。", en: "Great, I speak a little Cantonese. I'm Ana, from Spain." }
      - { speaker: Sam, es: "我係Sam，係英國人。佢係Mandy，佢係香港人。", en: "I'm Sam, I'm British. She's Mandy; she's a Hongkonger." }
      - { speaker: Ana, es: "你哋係唔係同學呀？", en: "Are you classmates?" }
      - { speaker: Mandy, es: "唔係，我哋係好朋友。你喺香港做乜嘢呀？", en: "No, we're good friends. What are you doing in Hong Kong?" }
      - { speaker: Ana, es: "我喺大學讀書，讀中文。", en: "I'm studying at university. I study Chinese." }
      - { speaker: Sam, es: "我都係學生！我都學緊廣東話。", en: "I'm a student too! I'm learning Cantonese as well." }
      - { speaker: Ana, es: "好嘢！我哋一齊影相，好唔好呀？", en: "Great! Shall we take a photo together?" }
      - { speaker: Mandy, es: "好呀！一、二、三！", en: "Sure! One, two, three!" }
    questions:
      - { q: "Ana係邊度人呀？", options: ["英國人", "西班牙人", "香港人"], answer: 1, explain: "Ana says 我係西班牙人: she is Spanish." }
      - { q: "Sam同Mandy係唔係同學呀？", options: ["係，佢哋係同學", "唔係，佢哋係好朋友", "唔係，佢哋係兄弟姊妹"], answer: 1, explain: "Mandy answers 唔係，我哋係好朋友." }
      - { q: "Ana喺香港做乜嘢呀？", options: ["返工", "喺大學讀書", "做導遊"], answer: 1, explain: "我喺大學讀書，讀中文: she studies Chinese at university." }
      - { q: "邊個都學緊廣東話呀？", options: ["Mandy", "Sam", "冇人"], answer: 1, explain: "Sam says 我都學緊廣東話: he is learning Cantonese too." }
