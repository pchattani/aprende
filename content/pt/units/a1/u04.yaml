    texts:
      - title: "Como chegar"
        es: ["A minha casa fica perto da praça.", "Ao lado tem uma padaria e em frente tem um banco.", "O prédio é o azul, entre a farmácia e o bar."]
        en: ["My house is near the square.", "Next to it there's a bakery and opposite there's a bank.", "The building is the blue one, between the pharmacy and the bar."]
