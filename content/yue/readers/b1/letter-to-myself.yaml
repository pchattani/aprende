id: r.b1.letter-to-myself
level: b1
title: 寫畀十年後嘅自己
kind: text
intro: For a school project, eighteen-year-old Wing-si writes a letter to herself to be opened in ten years. She lists her hopes, her plans and her fears - and the song her father sings whenever life gets hard.
allow: [詠詩]
paragraphs:
  - { es: "十年後嘅詠詩：你好！我係十八歲嘅你。今日老師叫我哋寫一封信畀十年後嘅自己，佢會幫我哋收埋，十年後先寄返畀我哋。我諗咗好耐都唔知寫乜嘢好，最後決定將我而家嘅夢想同擔心全部寫低，等你睇吓自己做到幾多。", en: "Dear Wing-si ten years from now: hello! I'm you at eighteen. Today our teacher asked us to write a letter to ourselves ten years from now. She'll keep the letters safe and send them back to us in ten years. I thought for ages about what to write, and in the end decided to write down all my dreams and worries as they are now, so that you can see how many you've achieved." }
  - { es: "首先，我希望你已經大學畢業。我而家嘅目標係讀社工，因為我想幫有需要嘅人。我細個嗰陣，我哋屋企好窮，住喺一間好細嘅劏房。嗰陣有個社工姐姐成日嚟探我哋，幫我媽媽搵工，又教我做功課。如果冇佢，我可能讀唔到書。所以我好想將來都可以好似佢噉。", en: "First, I hope you've graduated from university. My goal at the moment is to study social work, because I want to help people in need. When I was little, our family was very poor and lived in a tiny subdivided flat. At that time a social worker often came to visit us; she helped my mum find work and helped me with my homework. Without her, I might not have been able to go to school. So I'd really like to be like her in the future." }
  - { es: "第二，我希望你去過旅行，最好係環遊世界。我而家一個禮拜喺便利店做三晚兼職，每個月儲一千蚊，就係為咗畢業之後去歐洲。我想去西班牙睇吓我嘅網友Ana講嘅嗰啲教堂，又想喺巴黎鐵塔下面影張相。你去咗未呀？如果未去，唔好再搵藉口喇！", en: "Second, I hope you've travelled - ideally around the world. At the moment I work three nights a week part-time at a convenience store and save a thousand dollars a month, all so I can go to Europe after I graduate. I want to go to Spain to see the churches my online friend Ana talks about, and I want to take a photo under the Eiffel Tower. Have you been yet? If not, stop making excuses!" }
  - { es: "第三，我希望你仍然同阿詩同美琪係好朋友。我哋三個由小學一年級開始就一齊，一齊溫書，一齊喊，一齊笑。我知道大個咗之後，大家可能會好忙，甚至會去唔同嘅地方生活，但係我希望你哋每年至少見一次面。", en: "Third, I hope you're still good friends with Ah Si and Mei-kei. The three of us have been together since Primary One: studying together, crying together, laughing together. I know that when we grow up we might all be very busy, and might even live in different places, but I hope you still see each other at least once a year." }
  - { es: "講到擔心，我最擔心嘅係考唔到大學。下年就要考文憑試，壓力真係好大。有時我溫書溫到半夜，都覺得自己乜都唔識。我又擔心爸爸媽媽嘅身體，佢哋做嘢做得好辛苦，爸爸成日腰痛都唔肯休息。希望十年後佢哋已經唔使咁辛苦，可以退休去飲茶、去旅行。", en: "Speaking of worries, my biggest worry is not getting into university. Next year I sit the DSE exam, and the pressure is really intense. Sometimes I revise until midnight and still feel I don't know anything. I also worry about Mum and Dad's health. They work so hard, and Dad often has back pain but won't rest. I hope that in ten years they won't have to work so hard and can retire, go for yum cha and travel." }
  - { es: "每次我好灰心嘅時候，爸爸都會唱一首好舊嘅歌，叫《獅子山下》。呢首歌係一九七九年嘅，講香港人同舟共濟、一齊努力。爸爸話：「人生有好多困難，但係只要唔放棄，總有一日會好。」以前我覺得首歌好老土，但係而家每次聽到，我都想喊。", en: "Whenever I'm feeling down, Dad sings a very old song called \"Below the Lion Rock\". The song is from 1979, and it's about Hongkongers being in the same boat and working hard together. Dad says: \"Life has lots of difficulties, but as long as you don't give up, things will get better one day.\" I used to think the song was really old-fashioned, but now every time I hear it, I want to cry." }
  - { es: "最後，無論你而家做緊乜嘢，無論你有冇實現呢啲夢想，我都希望你開心。如果你冇做社工，冇去到歐洲，都唔緊要，最緊要係你仲係一個善良、肯努力嘅人。記住，十八歲嘅你一直都好相信你。", en: "Finally, whatever you're doing now, and whether or not you've achieved these dreams, I hope you're happy. If you didn't become a social worker or didn't make it to Europe, that's OK. The most important thing is that you're still a kind person who's willing to work hard. Remember: the eighteen-year-old you has always believed in you." }
  - { es: "祝你身體健康，萬事如意！十八歲嘅詠詩", en: "Wishing you good health and every success! Wing-si, aged eighteen" }
questions:
  - { q: "老師會點樣處理啲信？", options: ["即刻寄畀學生", "收埋十年先寄返畀學生", "喺班上面讀畀大家聽"], answer: 1, explain: "佢會幫我哋收埋，十年後先寄返畀我哋." }
  - { q: "點解詠詩想讀社工？", options: ["因為人工高", "因為細個有個社工幫過佢屋企", "因為佢媽媽係社工"], answer: 1, explain: "有個社工姐姐成日嚟探我哋… 如果冇佢，我可能讀唔到書." }
  - { q: "詠詩點樣儲錢去歐洲？", options: ["喺便利店做兼職", "問爸爸媽媽攞", "喺網上賣嘢"], answer: 0, explain: "我而家一個禮拜喺便利店做三晚兼職，每個月儲一千蚊." }
  - { q: "詠詩最擔心乜嘢？", options: ["冇朋友", "考唔到大學", "冇錢去旅行"], answer: 1, explain: "我最擔心嘅係考唔到大學." }
  - { q: "《獅子山下》係講乜嘢嘅？", options: ["香港人一齊努力", "一隻獅子嘅故事", "行山"], answer: 0, explain: "講香港人同舟共濟、一齊努力." }
glossary:
  - { es: 社工, en: social worker; social work }
  - { es: 有需要, en: in need }
  - { es: 網友, en: online friend }
  - { es: 年級, en: "year, grade (at school)" }
  - { es: 教堂, en: church }
  - { es: 巴黎鐵塔, en: Eiffel Tower }
  - { es: 藉口, en: excuse }
  - { es: 仍然, en: still }
  - { es: 甚至, en: even }
  - { es: 至少, en: at least }
  - { es: 文憑試, en: DSE (Hong Kong secondary school exam) }
  - { es: 腰痛, en: back pain }
  - { es: 肯, en: to be willing to }
  - { es: 灰心, en: discouraged }
  - { es: 同舟共濟, en: to be in the same boat and help each other }
  - { es: 困難, en: difficulty }
  - { es: 老土, en: "old-fashioned, corny" }
  - { es: 無論, en: no matter }
