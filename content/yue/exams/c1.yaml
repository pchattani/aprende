reading:
  text: |
    【本報訊】澳門歷史城區自二零零五年列入《世界遺產名錄》以來，旅客人數持續增加。然而，有居民指出，大三巴牌坊及議事亭前地一帶於節假日人流過多，不但令古蹟承受壓力，亦嚴重影響附近居民的日常生活。

    據了解，當局正研究一系列措施，包括於假期實施人流管制、增設單向行人路線，以及推廣其他較少人認識的景點，例如東望洋燈塔及盧廉若公園。有關負責人表示，保育與旅遊並非互相矛盾，關鍵在於如何取得平衡。

    不過，亦有商戶對此表示憂慮。一名在官也街經營手信店的店主坦言：「遊客是我們的生計，若限制人數，生意必定大受影響。」他認為，當局應先改善交通配套，而非單純限制人流。

    學者則認為，問題的根源在於旅遊模式過於單一。大部分旅客只在澳門停留一天，集中前往少數熱門景點，拍照後便離開。若能鼓勵旅客留宿，並且深入了解澳門的歷史與文化，則既可分散人流，亦能為本地社區帶來更多收益。換言之，與其限制遊客，不如改變遊客的玩法。
  questions:
    - { q: "What problem do residents point out?", options: ["Too few tourists since 2005", "Overcrowding at heritage sites on holidays, affecting the sites and daily life", "The closure of the Ruins of St Paul's"], answer: 1 }
    - { q: "Which measure is NOT mentioned as being studied by the authorities?", options: ["Crowd control during holidays", "One-way pedestrian routes", "Charging an entrance fee to the Ruins"], answer: 2 }
    - { q: "According to the official, conservation and tourism…", options: ["are fundamentally in conflict", "are not contradictory; the key is balance", "should be handled by different governments"], answer: 1 }
    - { q: "What does the shop owner on Rua do Cunha want?", options: ["Better transport facilities rather than limits on visitor numbers", "A ban on tour groups", "Lower rents"], answer: 0 }
    - { q: "What do academics see as the root of the problem?", options: ["Too many hotels", "A one-dimensional tourism model: day trips to a few hot spots", "Poor signage"], answer: 1 }
