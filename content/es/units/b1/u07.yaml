id: b1.u07
title: Oraciones de relativo
lessons:
  - id: b1.u07.l1
    title: El piso que alquilamos — que, quien, lo que
    teach: [g.relative-que-quien]
    vocab: [w.quien.rel, w.lo-que, w.inquilino, w.inmobiliaria, w.edificio, w.ascensor, w.terraza, w.balcon, w.garaje, w.trastero, w.aire-acondicionado, w.amueblado, w.luminoso, w.exterior, w.interior, w.reformado, w.cuadrado, w.acogedor, w.amplio, w.estado, w.propietario, w.calefaccion, w.arriba]
    tip: "que works for people and things; after a preposition use el/la que or quien (people): la casa en la que vivo, el amigo con quien viajé. lo que = what."
    sentences:
      - { es: "El piso que hemos alquilado tiene dos dormitorios y una terraza muy grande.", en: "The flat we've rented has two bedrooms and a very big terrace.", grammar: [g.relative-que-quien, g.present-perfect], vocab: [w.terraza, w.piso, w.dormitorio] }
      - { es: "La inmobiliaria que nos enseñó el piso no nos dijo que el edificio no tenía ascensor.", en: "The estate agency that showed us the flat didn't tell us the building had no lift.", grammar: [g.relative-que-quien, g.preterite-vs-imperfect], vocab: [w.inmobiliaria, w.edificio, w.ascensor] }
      - { es: "Los inquilinos que vivían aquí antes dejaron el salón muy sucio.", en: "The tenants who lived here before left the living room very dirty.", grammar: [g.relative-que-quien, g.imperfect], vocab: [w.inquilino, w.salon, w.sucio] }
      - { es: "Vivo en un edificio antiguo que tiene un patio interior muy luminoso.", en: "I live in an old building that has a very bright inner courtyard.", grammar: [g.relative-que-quien], vocab: [w.edificio, w.interior, w.luminoso, w.patio] }
      - { es: "La chica con la que vivo trabaja de noche, así que casi nunca la veo.", en: "The girl I live with works nights, so I hardly ever see her.", grammar: [g.relative-que-quien], vocab: [w.vivir, w.trabajar, w.asi-que], note: "The preposition goes before the relative: con la que, never at the end." }
      - { es: "El propietario, que es muy amable, nos dejó el piso amueblado.", en: "The owner, who is very kind, left us the flat furnished.", grammar: [g.relative-que-quien], vocab: [w.propietario, w.amueblado, w.amable, w.dejar], note: "Commas = extra information about someone already identified." }
      - { es: "La casa en la que crecí tenía un garaje y un trastero lleno de cosas viejas.", en: "The house I grew up in had a garage and a storage room full of old things.", grammar: [g.relative-que-quien, g.imperfect-uses], vocab: [w.garaje, w.trastero, w.crecer] }
      - { es: "Lo que más me gusta del piso es el balcón exterior, que da a la plaza.", en: "What I like most about the flat is the balcony facing the street, which looks onto the square.", grammar: [g.relative-que-quien], vocab: [w.lo-que, w.balcon, w.exterior, w.plaza], note: "dar a = to look onto, to face." }
      - { es: "Lo que no entiendo es por qué un piso de sesenta metros cuadrados cuesta tanto.", en: "What I don't understand is why a sixty-square-metre flat costs so much.", grammar: [g.relative-que-quien], vocab: [w.lo-que, w.cuadrado, w.metro, w.costar] }
      - { es: "Mis vecinos de arriba, a quienes conozco desde hace años, se mudan a otro barrio.", en: "My upstairs neighbours, whom I've known for years, are moving to another neighbourhood.", grammar: [g.relative-que-quien, g.a-personal, g.desde-hace], vocab: [w.quien.rel, w.arriba, w.vecino, w.mudarse, w.barrio] }
      - { es: "El hombre con quien hablamos nos recomendó poner aire acondicionado en el salón.", en: "The man we spoke to recommended that we put air conditioning in the living room.", grammar: [g.relative-que-quien], vocab: [w.quien.rel, w.aire-acondicionado, w.recomendar, w.salon] }
      - { es: "Es un piso acogedor y amplio, pero está en muy mal estado.", en: "It's a cosy, spacious flat, but it's in very bad condition.", grammar: [g.ser-vs-estar-basics], vocab: [w.acogedor, w.amplio, w.estado] }
      - { es: "Quien vive en el centro no necesita coche.", en: "Anyone who lives in the centre doesn't need a car.", grammar: [g.relative-que-quien], vocab: [w.quien.rel, w.centro, w.coche, w.necesitar], note: "quien without a noun before it = whoever, anyone who." }
      - { es: "La casa en la que vivo está cerca del metro.", en: "The house I live in is near the metro.", grammar: [g.relative-que-quien], vocab: [w.casa, w.metro, w.cerca], error: { wrong: "La casa que vivo está cerca del metro.", explain: "vivir en: after a preposition the relative needs the article: la casa en la que vivo.", grammar: g.relative-que-quien } }
      - { es: "El piso tiene calefacción. / Alquilamos el piso ayer.", en: "The flat we rented yesterday has heating.", grammar: [g.relative-que-quien], vocab: [w.piso, w.calefaccion, w.ayer], transform: { instruction: "Join the two sentences with que", answer: "El piso que alquilamos ayer tiene calefacción.", alt: ["El piso que ayer alquilamos tiene calefacción."] } }
  - id: b1.u07.l2
    title: El pueblo donde nací — donde, cuyo, el cual
    teach: [g.relative-donde-cuyo]
    vocab: [w.donde.rel, w.cuyo, w.cual.rel, w.zona, w.afueras, w.centrico, w.comunidad, w.habitante, w.autor, w.empresario, w.arquitecto, w.disenar, w.dueno, w.rincon, w.local.adj, w.destacar, w.soleado, w.alcalde, w.unico]
    tip: "donde = en el que (place); cuyo/a/os/as = whose and agrees with the thing owned, not the owner; el cual / la cual is the formal option after prepositions."
    sentences:
      - { es: "El pueblo donde nací tiene menos de mil habitantes y un alcalde que conoce a todos.", en: "The village where I was born has fewer than a thousand inhabitants and a mayor who knows everyone.", grammar: [g.relative-donde-cuyo, g.relative-que-quien], vocab: [w.donde.rel, w.habitante, w.alcalde, w.pueblo, w.nacer] }
      - { es: "Vivimos en una zona muy céntrica donde hay tiendas, bares y mucho ruido.", en: "We live in a very central area where there are shops, bars and a lot of noise.", grammar: [g.relative-donde-cuyo], vocab: [w.zona, w.centrico, w.donde.rel, w.ruido] }
      - { es: "Mis padres se han mudado a las afueras, donde las casas son más baratas y tienen jardín.", en: "My parents have moved to the outskirts, where the houses are cheaper and have gardens.", grammar: [g.relative-donde-cuyo, g.present-perfect], vocab: [w.afueras, w.donde.rel, w.jardin, w.mudarse] }
      - { es: "Este es el rincón de la casa donde más tiempo paso: la terraza soleada.", en: "This is the corner of the house where I spend the most time: the sunny terrace.", grammar: [g.relative-donde-cuyo], vocab: [w.rincon, w.soleado, w.terraza, w.pasar] }
      - { es: "Es una arquitecta cuyos edificios destacan por su luz natural.", en: "She's an architect whose buildings stand out for their natural light.", grammar: [g.relative-donde-cuyo], vocab: [w.arquitecto, w.cuyo, w.edificio, w.destacar, w.natural] }
      - { es: "Conocí a un empresario cuya empresa diseña cocinas para pisos pequeños.", en: "I met a businessman whose company designs kitchens for small flats.", grammar: [g.relative-donde-cuyo, g.a-personal], vocab: [w.empresario, w.cuyo, w.disenar, w.empresa, w.cocina] }
      - { es: "La autora cuyo libro estoy leyendo vivió muchos años en este barrio.", en: "The author whose book I'm reading lived in this neighbourhood for many years.", grammar: [g.relative-donde-cuyo, g.estar-gerund], vocab: [w.autor, w.cuyo, w.libro, w.barrio] }
      - { es: "Recuerdo el verano en que nos mudamos: hacía un calor horrible.", en: "I remember the summer we moved: it was horribly hot.", grammar: [g.relative-donde-cuyo, g.imperfect-uses], vocab: [w.recordar, w.mudarse, w.verano, w.calor], note: "el verano en que… is more common than el verano cuando…" }
      - { es: "La comunidad de vecinos, con la cual tuvimos problemas, por fin ha arreglado el ascensor.", en: "The residents' association, with which we had problems, has finally fixed the lift.", grammar: [g.relative-donde-cuyo, g.present-perfect], vocab: [w.comunidad, w.cual.rel, w.vecino, w.ascensor, w.arreglar], note: "el cual / la cual is formal; in speech you would say con la que." }
      - { es: "El dueño del bar, al cual todos llaman Paco, lleva treinta años en la misma esquina.", en: "The owner of the bar, whom everyone calls Paco, has been on the same corner for thirty years.", grammar: [g.relative-donde-cuyo, g.desde-hace], vocab: [w.dueno, w.cual.rel, w.bar, w.esquina] }
      - { es: "Prefiero comprar en las tiendas locales, donde conozco a los dueños.", en: "I prefer to shop in the local shops, where I know the owners.", grammar: [g.relative-donde-cuyo, g.a-personal], vocab: [w.local.adj, w.donde.rel, w.dueno, w.tienda] }
      - { es: "Las afueras, adonde se ha mudado mucha gente joven, tienen cada vez más tiendas y colegios.", en: "The outskirts, where a lot of young people have moved to, have more and more shops and schools.", grammar: [g.relative-donde-cuyo, g.present-perfect], vocab: [w.afueras, w.donde.rel, w.mudarse, w.joven], note: "adonde with verbs of movement." }
      - { es: "Es el único barrio de la ciudad cuyos habitantes se conocen todos.", en: "It's the only neighbourhood in the city whose inhabitants all know each other.", grammar: [g.relative-donde-cuyo], vocab: [w.unico, w.cuyo, w.habitante, w.conocer] }
      - { es: "Es un escritor cuyas novelas se venden mucho.", en: "He's a writer whose novels sell a lot.", grammar: [g.relative-donde-cuyo], vocab: [w.escritor, w.cuyo, w.novela, w.vender], error: { wrong: "Es un escritor cuyo novelas se venden mucho.", explain: "cuyo agrees with the noun that follows it (novelas → cuyas), not with the owner.", grammar: g.relative-donde-cuyo } }
      - { es: "Esa es la plaza. / Allí jugábamos de niños.", en: "That's the square where we used to play as children.", grammar: [g.relative-donde-cuyo, g.imperfect-uses], vocab: [w.donde.rel, w.plaza, w.jugar], transform: { instruction: "Join the sentences with donde", answer: "Esa es la plaza donde jugábamos de niños.", alt: ["Esa es la plaza en la que jugábamos de niños."] } }
  - id: b1.u07.l3
    title: Busco un piso que tenga… — el subjuntivo en las oraciones de relativo
    teach: [g.relative-subjunctive]
    vocab: [w.compartir, w.companero-de-piso, w.fianza, w.incluir, w.admitir, w.asequible, w.bien-comunicado, w.ideal, w.caber, w.natural, w.silencioso, w.tener-en-cuenta, w.cobrar, w.importar]
    tip: "A specific thing you know exists → indicative (tengo un piso que tiene terraza). Something you are looking for, imagine or deny → subjunctive (busco un piso que tenga terraza; no hay nadie que…)."
    sentences:
      - { es: "Busco un piso que tenga dos habitaciones y que esté bien comunicado.", en: "I'm looking for a flat that has two bedrooms and is well connected.", grammar: [g.relative-subjunctive], vocab: [w.buscar, w.bien-comunicado, w.habitacion] }
      - { es: "Tenemos un piso que tiene terraza, pero queremos uno que tenga también garaje.", en: "We have a flat that has a terrace, but we want one that also has a garage.", grammar: [g.relative-subjunctive], vocab: [w.terraza, w.garaje, w.querer], note: "Known flat → tiene; the flat we want → tenga." }
      - { es: "Necesito un compañero de piso que sea limpio, silencioso y que no fume.", en: "I need a flatmate who is clean, quiet and doesn't smoke.", grammar: [g.relative-subjunctive, g.subjunctive-irregular], vocab: [w.companero-de-piso, w.silencioso, w.limpio, w.fumar] }
      - { es: "¿Conoces a alguien que quiera compartir piso en septiembre?", en: "Do you know anyone who wants to share a flat in September?", grammar: [g.relative-subjunctive, g.a-personal], vocab: [w.compartir, w.alguien, w.querer] }
      - { es: "No hay ningún piso asequible que esté cerca de la universidad.", en: "There isn't a single affordable flat near the university.", grammar: [g.relative-subjunctive, g.indefinite-pronouns], vocab: [w.asequible, w.ningun, w.universidad, w.cerca] }
      - { es: "Quiero un salón donde quepa un sofá grande y una mesa para seis personas.", en: "I want a living room where a big sofa and a table for six fit.", grammar: [g.relative-subjunctive], vocab: [w.caber, w.salon, w.sofa, w.mesa], note: "caber → quepa (irregular)." }
      - { es: "Prefiero una habitación que tenga luz natural; no me importa que sea pequeña.", en: "I prefer a room with natural light; I don't mind if it's small.", grammar: [g.relative-subjunctive, g.subjunctive-emotion], vocab: [w.natural, w.luz, w.habitacion, w.preferir, w.importar] }
      - { es: "No encuentro ningún propietario que admita mascotas.", en: "I can't find any landlord who allows pets.", grammar: [g.relative-subjunctive, g.indefinite-pronouns], vocab: [w.admitir, w.mascota, w.encontrar] }
      - { es: "Buscamos un alquiler que incluya los gastos de agua y luz.", en: "We're looking for a rental that includes the water and electricity bills.", grammar: [g.relative-subjunctive], vocab: [w.incluir, w.agua, w.luz] }
      - { es: "Es el piso ideal: tiene todo lo que necesitamos y cuesta lo que podemos pagar.", en: "It's the ideal flat: it has everything we need and costs what we can pay.", grammar: [g.relative-que-quien], vocab: [w.ideal, w.lo-que, w.costar, w.pagar] }
      - { es: "Hay que tener en cuenta que casi todos los propietarios cobran dos meses de fianza.", en: "You have to bear in mind that almost all landlords charge two months' deposit.", grammar: [g.hay-que], vocab: [w.tener-en-cuenta, w.cobrar, w.fianza] }
      - { es: "Lo que busques, búscalo con tiempo: en septiembre no queda nada.", en: "Whatever you're looking for, look for it in good time: in September there's nothing left.", grammar: [g.relative-subjunctive, g.imperative-tu], vocab: [w.lo-que, w.buscar, w.quedar], note: "lo que + subjunctive = whatever." }
      - { es: "Vive donde quieras, pero ten en cuenta el precio del transporte.", en: "Live wherever you like, but take the cost of transport into account.", grammar: [g.relative-subjunctive, g.imperative-tu], vocab: [w.donde.rel, w.tener-en-cuenta, w.precio, w.transporte] }
      - { es: "¿Hay algún banco que dé hipotecas a jóvenes sin contrato fijo?", en: "Is there any bank that gives mortgages to young people without a permanent contract?", grammar: [g.relative-subjunctive, g.subjunctive-irregular], vocab: [w.banco, w.joven] }
      - { es: "Busco un piso que tenga tres dormitorios y que no cueste más de 800 euros.", en: "I'm looking for a flat that has three bedrooms and doesn't cost more than 800 euros.", grammar: [g.relative-subjunctive], vocab: [w.dormitorio, w.euro, w.costar], error: { wrong: "Busco un piso que tiene tres dormitorios y que no cuesta más de 800 euros.", explain: "You are describing a flat you haven't found yet, so the relative clause takes the subjunctive: que tenga… que no cueste.", grammar: g.relative-subjunctive } }
      - { es: "Tengo un piso que tiene ascensor.", en: "I'm looking for a flat that has a lift.", grammar: [g.relative-subjunctive], vocab: [w.ascensor, w.piso], transform: { instruction: "Change tengo to busco and adjust the relative clause", answer: "Busco un piso que tenga ascensor." } }
  - id: b1.u07.l4
    title: Se busca persona que… — ofertas de trabajo
    teach: [g.relative-subjunctive]
    vocab: [w.oferta-de-trabajo, w.vacante, w.aspirante, w.requerir, w.jornada-completa, w.media-jornada, w.incorporacion, w.inmediato, w.formacion, w.nivel, w.dominar, w.conocimiento, w.habilidad, w.disponibilidad, w.valorar, w.capaz, w.flexible, w.organizado, w.dinamico, w.don-de-gentes, w.atencion-al-cliente, w.carne-de-conducir, w.seleccion, w.referencia]
    tip: "Job adverts describe the person they hope to find, so the relative clause goes in the subjunctive: se busca camarero que tenga experiencia; necesitamos a alguien que sepa inglés."
    sentences:
      - { es: "Se busca camarero que tenga experiencia y que hable inglés.", en: "Waiter wanted with experience who speaks English.", grammar: [g.relative-subjunctive, g.se-passive], vocab: [w.camarero, w.experiencia, w.hablar, w.ingles] }
      - { es: "Necesitamos una persona que domine el francés y que tenga disponibilidad los fines de semana.", en: "We need someone who has a good command of French and is available at weekends.", grammar: [g.relative-subjunctive], vocab: [w.dominar, w.disponibilidad, w.frances, w.fin-de-semana] }
      - { es: "La oferta de trabajo pide un aspirante que sea organizado, dinámico y capaz de trabajar en equipo.", en: "The job advert asks for an applicant who is organised, dynamic and able to work in a team.", grammar: [g.relative-subjunctive, g.subjunctive-irregular], vocab: [w.oferta-de-trabajo, w.aspirante, w.organizado, w.dinamico, w.capaz, w.equipo] }
      - { es: "Buscamos a alguien que tenga don de gentes para el puesto de atención al cliente.", en: "We're looking for someone with people skills for the customer service position.", grammar: [g.relative-subjunctive, g.a-personal], vocab: [w.don-de-gentes, w.atencion-al-cliente, w.alguien] }
      - { es: "Se valorará a los candidatos que tengan carné de conducir y conocimientos de alemán.", en: "Candidates who have a driving licence and some German will be looked on favourably.", grammar: [g.relative-subjunctive, g.future-simple], vocab: [w.valorar, w.carne-de-conducir, w.conocimiento, w.aleman] }
      - { es: "No hay nadie en la empresa que tenga el nivel de inglés que requiere el puesto.", en: "There is nobody in the company who has the level of English the position requires.", grammar: [g.relative-subjunctive, g.indefinite-pronouns], vocab: [w.nivel, w.requerir, w.ingles, w.empresa] }
      - { es: "Es una vacante de jornada completa con incorporación inmediata.", en: "It's a full-time vacancy with an immediate start.", grammar: [g.ser-vs-estar-basics], vocab: [w.vacante, w.jornada-completa, w.incorporacion, w.inmediato] }
      - { es: "Quiero un trabajo que me permita tener un horario flexible y trabajar media jornada.", en: "I want a job that lets me have flexible hours and work part time.", grammar: [g.relative-subjunctive], vocab: [w.flexible, w.media-jornada, w.trabajo] }
      - { es: "¿Hay alguna empresa que ofrezca formación a los empleados nuevos?", en: "Is there any company that offers training to new employees?", grammar: [g.relative-subjunctive], vocab: [w.formacion, w.ofrecer, w.empresa], note: "ofrecer → ofrezca (yo form ofrezco)." }
      - { es: "La selección es larga: lo que más valoran es la experiencia.", en: "The recruitment process is long: what they value most is experience.", grammar: [g.relative-que-quien], vocab: [w.seleccion, w.valorar, w.lo-que, w.experiencia] }
      - { es: "Piden dos referencias de tus trabajos anteriores.", en: "They ask for two references from your previous jobs.", grammar: [g.present-review], vocab: [w.referencia, w.pedir, w.trabajo, w.anterior] }
      - { es: "Quien quiera solicitar el puesto debe enviar el currículum antes del viernes.", en: "Anyone who wants to apply for the position must send their CV before Friday.", grammar: [g.relative-subjunctive, g.deber-tener-que], vocab: [w.quien.rel, w.enviar, w.viernes] }
      - { es: "Necesitan a alguien que sepa conducir y que pueda empezar mañana mismo.", en: "They need someone who can drive and can start tomorrow.", grammar: [g.relative-subjunctive, g.subjunctive-irregular], vocab: [w.conducir, w.empezar, w.manana, w.alguien] }
      - { es: "Las habilidades que se piden hoy en día son muy diferentes de las de hace veinte años.", en: "The skills that are asked for nowadays are very different from those of twenty years ago.", grammar: [g.relative-que-quien, g.se-passive], vocab: [w.habilidad, w.hoy-en-dia, w.diferente, w.pedir] }
      - { es: "Buscamos un guía que hable tres idiomas.", en: "We're looking for a guide who speaks three languages.", grammar: [g.relative-subjunctive], vocab: [w.guia, w.hablar, w.idioma], error: { wrong: "Buscamos un guía que habla tres idiomas.", explain: "The guide is not a specific person yet, so the relative clause takes the subjunctive: que hable.", grammar: g.relative-subjunctive } }
      - { es: "Tenemos un jefe que escucha a los empleados.", en: "We want a boss who listens to the employees.", grammar: [g.relative-subjunctive], vocab: [w.jefe, w.escuchar], transform: { instruction: "Change tenemos to queremos and adjust the relative clause", answer: "Queremos un jefe que escuche a los empleados." } }
dialogues:
  - id: b1.u07.d1
    title: Visita a un piso
    context: Marta is viewing a flat with Sergio, an estate agent.
    lines:
      - { speaker: Sergio, es: "Buenas tardes, Marta. Este es el piso del que te hablé por teléfono: tercera planta, exterior y muy luminoso.", en: "Good afternoon, Marta. This is the flat I told you about on the phone: third floor, facing the street and very bright." }
      - { speaker: Marta, es: "Qué bien. Lo que más me importa es la luz. ¿Es el edificio que tiene ascensor?", en: "Great. What matters most to me is the light. Is this the building that has a lift?" }
      - { speaker: Sergio, es: "Sí, y también hay un trastero en el que caben las bicis. El salón da a una plaza donde hay poco tráfico.", en: "Yes, and there's also a storage room where the bikes fit. The living room looks onto a square where there's little traffic." }
      - { speaker: Marta, es: "Busco algo que sea tranquilo, porque trabajo desde casa. ¿Quién vive en el piso de arriba?", en: "I'm looking for something quiet, because I work from home. Who lives in the flat upstairs?" }
      - { speaker: Sergio, es: "Una pareja mayor cuyos hijos ya no viven aquí. Son gente muy tranquila.", en: "An older couple whose children don't live here any more. They're very quiet people." }
      - { speaker: Marta, es: "Perfecto. ¿Y la cocina? En las fotos parecía pequeña.", en: "Perfect. And the kitchen? In the photos it looked small." }
      - { speaker: Sergio, es: "Es pequeña, pero está reformada y tiene todo lo que necesitas: horno, microondas y lavadora.", en: "It's small, but it's been renovated and has everything you need: oven, microwave and washing machine." }
      - { speaker: Marta, es: "¿Admiten mascotas? Tengo un gato.", en: "Do they allow pets? I have a cat." }
      - { speaker: Sergio, es: "La propietaria no quiere perros, pero un gato no es problema. Eso sí, pide dos meses de fianza.", en: "The owner doesn't want dogs, but a cat is no problem. Mind you, she asks for two months' deposit." }
      - { speaker: Marta, es: "Vale. ¿Hay algún otro piso que tenga terraza en esta zona?", en: "OK. Is there any other flat with a terrace in this area?" }
      - { speaker: Sergio, es: "Hay uno en la calle de al lado, que es más caro pero tiene una terraza de veinte metros cuadrados. Si quieres, lo vemos ahora.", en: "There's one in the next street, which is more expensive but has a twenty-square-metre terrace. If you like, we can see it now." }
      - { speaker: Marta, es: "Sí, vamos. Quien no mira, no encuentra.", en: "Yes, let's go. If you don't look, you don't find." }
