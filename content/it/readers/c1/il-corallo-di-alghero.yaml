id: r.c1.il-corallo-di-alghero
level: c1
title: Il corallo di Alghero
kind: text
intro: "A short story set in Alghero, the Sardinian town where some people still speak Catalan. An old coral craftsman, a granddaughter who left, and a necklace that brings her back. The story is told in the passato remoto, with the trapassato remoto after appena and dopo che (c1.u02), and flashes of free indirect thought."
allow: [alghero, barceloneta, nuria, sardegna, torino, barcellona, catalano, bonaria, avi, iaia, sardo]
paragraphs:
  - { es: "Quando Nuria tornò ad Alghero, dopo dodici anni passati a Torino, la prima cosa che notò fu il vento. Non se lo ricordava così forte. Il maestrale soffiava dal mare e faceva sbattere le bandiere sui bastioni, gli stessi su cui, da bambina, correva con i cugini mentre i turisti fotografavano il tramonto. Si fermò davanti alla porta della bottega di suo nonno e, per un momento, non ebbe il coraggio di entrare.", en: "When Nuria came back to Alghero after twelve years in Turin, the first thing she noticed was the wind. She didn't remember it being so strong. The mistral was blowing off the sea and making the flags flap on the ramparts, the same ones she used to run along as a child with her cousins while the tourists photographed the sunset. She stopped in front of the door of her grandfather's workshop and, for a moment, didn't have the courage to go in." }
  - { es: "La bottega era sempre la stessa: una stanza stretta e lunga, con un banco di legno sotto la finestra e, sulle pareti, decine di cassetti pieni di rami di corallo rosso. Suo nonno lo lavorava da sessant'anni, come prima di lui aveva fatto suo padre. Ad Alghero lo chiamavano tutti «l'avi», che in catalano vuol dire nonno, anche chi non era suo parente.", en: "The workshop was the same as ever: a long narrow room, with a wooden workbench under the window and, on the walls, dozens of drawers full of branches of red coral. Her grandfather had been working it for sixty years, as his father had done before him. In Alghero everybody called him 'l'avi', which means grandfather in Catalan, even people who weren't related to him." }
  - { es: "Il corallo di Alghero è famoso da secoli. I pescatori lo cercavano sui fondali della Riviera del Corallo, come si chiama ancora oggi questo tratto di costa, e gli artigiani lo trasformavano in gioielli, rosari e piccole sculture. Oggi la pesca è regolata in modo severo e il corallo buono costa caro, così caro che alcuni negozi del centro vendono imitazioni ai turisti distratti. Il nonno non ne aveva mai volute vedere in bottega.", en: "Alghero coral has been famous for centuries. Fishermen searched for it on the seabed of the Coral Riviera, as this stretch of coast is still called today, and craftsmen turned it into jewellery, rosaries and small sculptures. Today fishing for it is strictly regulated and good coral is expensive – so expensive that some shops in the centre sell imitations to unwary tourists. Her grandfather had never wanted to see any in his workshop." }
  - { es: "Nuria era partita a diciannove anni, subito dopo la maturità. Il nonno non aveva detto niente, né per fermarla né per incoraggiarla. Solo, il giorno della partenza, le aveva messo in mano una piccola scatola. Dentro c'era un pezzo di corallo grezzo, opaco, che non sembrava niente di speciale. «Quando sarai pronta, me lo riporti e lo finiamo insieme», le aveva detto. Lei aveva riso, l'aveva messa in valigia e non l'aveva più aperta.", en: "Nuria had left at nineteen, straight after her school-leaving exams. Her grandfather hadn't said anything, either to stop her or to encourage her. Only, on the day she left, he had put a little box in her hand. Inside was a piece of raw coral, dull, that looked like nothing special. 'When you're ready, bring it back to me and we'll finish it together,' he had told her. She had laughed, put it in her suitcase and never opened it again." }
  - { es: "A Torino studiò economia, trovò lavoro in una grande azienda e imparò a vivere con i ritmi della città. Ogni estate prometteva di tornare, e ogni estate qualcosa glielo impediva: una scadenza, un trasloco, un amore che finì male. Le telefonate con il nonno si fecero più rare. Lui parlava poco al telefono; lei, sempre di corsa, ancora meno.", en: "In Turin she studied economics, found a job at a big company and learned to live at the city's pace. Every summer she promised to go back, and every summer something stopped her: a deadline, a move, a love affair that ended badly. The phone calls with her grandfather grew rarer. He didn't say much on the phone; she, always in a hurry, said even less." }
  - { es: "Poi, un inverno, sua madre la chiamò per dirle che il nonno era caduto in bottega e che i medici gli avevano consigliato di smettere di lavorare. Appena ebbe chiuso la telefonata, Nuria cercò la scatola. La trovò in fondo a un armadio, sotto delle vecchie fotografie. Il corallo era ancora lì, opaco come dodici anni prima. Prenotò un volo per la mattina dopo.", en: "Then, one winter, her mother called to tell her that her grandfather had fallen in the workshop and that the doctors had advised him to stop working. As soon as she had hung up, Nuria looked for the box. She found it at the back of a wardrobe, under some old photographs. The coral was still there, as dull as twelve years before. She booked a flight for the next morning." }
  - { es: "Ora era lì, davanti alla porta. Entrò. Il nonno era seduto al banco, con gli occhiali sulla punta del naso, e non alzò nemmeno la testa. «Sei in ritardo», disse soltanto. Nuria non rispose: tirò fuori la scatola e gliela appoggiò davanti. Lui la aprì, prese il corallo tra le dita, lo guardò contro la luce della finestra. Poi sorrise, per la prima volta.", en: "Now she was there, in front of the door. She went in. Her grandfather was sitting at the workbench with his glasses on the tip of his nose, and didn't even look up. 'You're late,' was all he said. Nuria didn't answer: she took out the box and put it down in front of him. He opened it, took the coral between his fingers and looked at it against the light from the window. Then he smiled, for the first time." }
  - { es: "Lavorarono insieme per tre settimane. Lui le insegnò a tagliare il ramo senza romperlo, a dargli forma con la lima, a lucidarlo per ore finché il rosso non veniva fuori, vivo, quasi caldo. Le spiegò che il corallo cresce pochi millimetri all'anno e che per questo va rispettato: chi lo lavora in fretta lo rovina. Nuria pensò che forse non parlava solo del corallo.", en: "They worked together for three weeks. He taught her to cut the branch without breaking it, to shape it with the file, to polish it for hours until the red came out, alive, almost warm. He explained that coral grows only a few millimetres a year and must therefore be respected: anyone who works it in a hurry ruins it. Nuria thought that perhaps he wasn't only talking about coral." }
  - { es: "Dopo che ebbero finito la collana, il nonno gliela mise al collo, senza una parola. Quella sera Nuria scrisse una lunga e-mail al suo capo, a Torino. La riscrisse quattro volte. Alla fine la mandò. Non sapeva se stava facendo la scelta giusta; sapeva solo che, per la prima volta da anni, non aveva fretta.", en: "When they had finished the necklace, her grandfather put it round her neck without a word. That evening Nuria wrote a long e-mail to her boss in Turin. She rewrote it four times. In the end she sent it. She didn't know whether she was making the right choice; she only knew that, for the first time in years, she wasn't in a hurry." }
  - { es: "Oggi, sulla porta della bottega, c'è un cartello nuovo, scritto in italiano e in catalano. I turisti entrano, guardano, fanno domande. Nuria risponde con pazienza. Il nonno, seduto in un angolo, la osserva e ogni tanto la corregge. Non sempre a ragione, dice lei. Ma lo lascia fare.", en: "Today, on the workshop door, there is a new sign, written in Italian and Catalan. Tourists come in, look around, ask questions. Nuria answers patiently. Her grandfather, sitting in a corner, watches her and now and then corrects her. Not always rightly, she says. But she lets him do it." }
questions:
  - { q: "Perché ad Alghero tutti chiamano il nonno «l'avi»?", options: ["Perché è il più vecchio pescatore della città", "Perché in catalano, che ad Alghero si parla ancora, vuol dire «nonno»", "Perché è il suo cognome"], answer: 1, explain: "«l'avi, che in catalano vuol dire nonno» – Alghero, conquered by the Aragonese in 1354, still has Catalan speakers." }
  - { q: "Perché alcuni negozi vendono imitazioni di corallo?", options: ["Perché il corallo vero costa caro e la pesca è regolata", "Perché il corallo di Alghero è brutto", "Perché i turisti preferiscono la plastica"], answer: 0, explain: "«la pesca è regolata in modo severo e il corallo buono costa caro, così caro che alcuni negozi… vendono imitazioni»." }
  - { q: "Che cosa regalò il nonno a Nuria il giorno in cui partì?", options: ["Una collana di corallo finita", "Un pezzo di corallo grezzo da finire insieme", "Dei soldi per il viaggio"], answer: 1, explain: "«un pezzo di corallo grezzo, opaco… Quando sarai pronta, me lo riporti e lo finiamo insieme»." }
  - { q: "«Appena ebbe chiuso la telefonata, Nuria cercò la scatola.» Il tempo «ebbe chiuso» è…", options: ["trapassato prossimo", "trapassato remoto, dopo «appena», in una narrazione al passato remoto", "congiuntivo trapassato"], answer: 1, explain: "The trapassato remoto (passato remoto of avere/essere + participle) appears after appena, dopo che, quando, when the main verb is in the passato remoto." }
  - { q: "Che cosa intende Nuria quando pensa che il nonno «forse non parlava solo del corallo»?", options: ["Che il nonno stava parlando anche di lei e del tempo necessario nelle relazioni", "Che il nonno parlava di un altro materiale", "Che non capiva il dialetto del nonno"], answer: 0, explain: "Coral 'grows a few millimetres a year' and 'whoever works it in a hurry ruins it' – an implicit message about patience and their relationship (implicit meaning, c1.u08)." }
  - { q: "Che cosa decide probabilmente Nuria alla fine?", options: ["Di tornare subito a Torino", "Di lasciare il lavoro a Torino e restare ad Alghero nella bottega", "Di vendere la bottega"], answer: 1, explain: "The e-mail to her boss, rewritten four times, and the new sign on the door suggest she has stayed – the story implies it rather than saying it." }
