id: r.c1.quiet-night-and-spring-dawn
level: c1
title: 〈靜夜思〉同〈春曉〉
kind: literature
author: 李白 Li Bai (701–762) and 孟浩然 Meng Haoran (689–740)
source: "李白〈靜夜思〉and 孟浩然〈春曉〉, Tang dynasty quatrains, quoted in full in the standard modern text (the Song edition of 靜夜思 has 看月光 and 山月). Public domain. The explanation paragraphs are written for this course."
intro: "The two Tang poems every Hong Kong child learns by heart, quoted in full and then explained by a teacher in a Macau secondary school in colloquial Cantonese. Notice how she turns the classical lines into everyday speech, and what Cantonese pronunciation reveals about the poems' sound."
allow: [李白, 孟浩然, 陳老師, 唐朝, 宋朝, 明朝, 靜夜思, 春曉, bat1, gok3, hiu2, niu5, siu2, t, k, iu]
paragraphs:
  - { es: "喺香港同澳門，差唔多個個細路仔都識背兩首唐詩：李白嘅〈靜夜思〉同孟浩然嘅〈春曉〉。好多人讀幼稚園嘅時候已經學過，大個咗之後，數學公式可能唔記得晒，但係呢兩首詩一開口就讀得出。今日我哋去澳門一間中學，聽吓教中文嘅陳老師點樣用廣東話講呢兩首詩。", en: "In Hong Kong and Macau almost every child can recite two Tang poems: Li Bai's 'Quiet Night Thoughts' and Meng Haoran's 'Spring Dawn'. Many people learn them in kindergarten, and as adults they may have forgotten every maths formula, but they can still say these two poems the moment they open their mouths. Today we visit a secondary school in Macau to hear how Ms Chan, who teaches Chinese, talks about the two poems in Cantonese." }
  - { es: "〈靜夜思〉　李白 ／ 床前明月光，疑是地上霜。舉頭望明月，低頭思故鄉。", en: "'Quiet Night Thoughts' – Li Bai / Before my bed, bright moonlight; / I took it for frost upon the ground. / I raise my head and gaze at the bright moon, / I lower my head and think of home." }
  - { es: "陳老師話：「李白係唐朝最出名嘅詩人之一，好鍾意飲酒，一世都喺度四圍去，好少返屋企。呢首詩好短，得二十個字，但係入面講嘅嘢好多。佢夜晚瞓唔着，見到床前面有一片月光，白雪雪噉，一時以為係地上面結咗霜。跟住佢擡起個頭望吓個月亮，再低返個頭，就諗起自己嘅屋企，諗起自己嘅故鄉。」", en: "Ms Chan says: 'Li Bai is one of the most famous poets of the Tang dynasty. He loved drinking, spent his whole life travelling around and seldom went home. This poem is very short, only twenty characters, but there's a lot in it. He can't sleep at night and sees a patch of moonlight in front of his bed, snowy white, and for a moment he thinks frost has formed on the ground. Then he raises his head to look at the moon, lowers it again, and thinks of his home, of the place he comes from.'" }
  - { es: "「你哋留意吓，成首詩冇一個字講『我好掛住屋企』，但係個個讀完都知道佢好掛住屋企。呢個就係中國詩嘅手法：寫景，其實係寫情。仲有，『明月』出現咗兩次，一次喺第一句，一次喺第三句，好似個月亮由頭到尾都陪住佢。擡頭、低頭，兩個好簡單嘅動作，就將一個人喺外面嘅孤單講晒出嚟。」", en: "'Notice that not a single word in the whole poem says \"I miss home\", yet everyone who reads it knows how much he misses home. That's the technique of Chinese poetry: describing a scene is really describing a feeling. Also, \"bright moon\" appears twice, once in the first line and once in the third, as if the moon keeps him company from beginning to end. Raising the head, lowering the head: two very simple movements say everything about the loneliness of someone far from home.'" }
  - { es: "「有同學問我：個『床』係咪真係張床呢？其實學者都爭論咗好耐。有人話係井邊嘅欄杆，有人話係一種可以摺埋嘅凳。另外，宋朝嘅版本寫『床前看月光』同『舉頭望山月』，我哋而家讀嘅係明朝之後先流行嘅版本。不過，無論係邊個版本，嗰種思鄉嘅感覺都係一樣嘅。」", en: "'Some students ask me: is the \"bed\" really a bed? In fact scholars have argued about it for a long time. Some say it was the railing round a well, others a kind of folding stool. Also, the Song dynasty edition has \"before my bed I look at the moonlight\" and \"I raise my head and gaze at the mountain moon\"; what we read today is the version that only became popular after the Ming dynasty. But whichever version it is, that feeling of homesickness is the same.'" }
  - { es: "〈春曉〉　孟浩然 ／ 春眠不覺曉，處處聞啼鳥。夜來風雨聲，花落知多少。", en: "'Spring Dawn' – Meng Haoran / Sleeping in spring, I did not notice the dawn; / everywhere I hear the birds singing. / In the night came the sound of wind and rain; / who knows how many flowers have fallen?" }
  - { es: "「孟浩然同李白係老友，李白仲寫過詩送佢。〈春曉〉講嘅係春天朝早，詩人瞓得好舒服，唔知唔覺天光咗都唔知。一醒，周圍都聽到啲雀仔喺度叫。跟住佢諗起：琴晚又打風又落雨，唔知跌咗幾多花呢？呢首詩表面上好輕鬆，但係最後一句有少少唏噓：春天咁靚，但係一陣風、一陣雨，啲花就冇咗。」", en: "'Meng Haoran and Li Bai were old friends; Li Bai even wrote poems for him. \"Spring Dawn\" is about a spring morning: the poet sleeps so comfortably that he doesn't even notice it has become light. As soon as he wakes he hears the birds singing all around. Then he remembers: last night there was wind and rain – how many flowers must have fallen? On the surface the poem is light-hearted, but the last line has a touch of sadness: spring is so beautiful, yet one gust of wind, one shower of rain, and the flowers are gone.'" }
  - { es: "「用廣東話讀唐詩，有一樣嘢普通話做唔到：聽得出入聲。『春眠不覺曉』，『不』讀 bat1，『覺』讀 gok3，一個收 t 尾，一個收 k 尾，讀得好短促。古時寫詩要講平仄，入聲屬於仄聲。普通話已經冇咗入聲，『覺』聽落似平聲，但係廣東話仲保留住，所以我哋一讀就聽得出呢兩個字係仄聲。」", en: "'When you read Tang poetry in Cantonese, there's one thing Mandarin can't do: you can hear the entering tones. In \"spring sleep, not noticing the dawn\", 不 is read bat1 and 覺 gok3, one ending in t, the other in k, both short and clipped. In the old days poems had to follow the level–oblique tone pattern, and entering tones count as oblique. Mandarin has lost its entering tones, so 覺 sounds like a level tone there, but Cantonese has kept them, so the moment we read the line we can hear that these two characters are oblique.'" }
  - { es: "「再聽吓押韻：曉 hiu2、鳥 niu5、少 siu2，三個字都係 iu 收尾，讀落好順口。你哋可以試吓將首詩變做口語：『春天瞓覺瞓到天光都唔知，周圍都聽到雀仔叫。琴晚又風又雨，唔知跌咗幾多花呢？』意思一樣，但係冇咗嗰種節奏同味道。呢個就係書面語同口語嘅分別：口語講得清楚，詩就講得靚。」", en: "'Now listen to the rhyme: 曉 hiu2, 鳥 niu5, 少 siu2 – all three end in iu, so the poem rolls off the tongue. Try turning it into colloquial speech: \"In spring I slept till it was light without noticing, and heard birds singing all around. Last night there was wind and rain – who knows how many flowers have fallen?\" The meaning is the same, but the rhythm and flavour are gone. That's the difference between written language and speech: speech says things clearly, poetry says them beautifully.'" }
  - { es: "落堂之前，陳老師出咗份功課：每個同學揀一首詩，用口語寫一段，講吓自己最掛住嘅地方。有個由葡萄牙嚟嘅同學話：「我第一次讀〈靜夜思〉，就諗起里斯本。原來一千幾年前嘅中國詩人，同我有一樣嘅感覺。」陳老師笑住話：「係囉，詩就係噉，隔咗幾多年、幾多里路，都一樣讀得明。」", en: "Before the end of the lesson, Ms Chan set some homework: each student picks one poem and writes a paragraph in colloquial Cantonese about the place they miss most. A student from Portugal said: 'The first time I read \"Quiet Night Thoughts\" I thought of Lisbon. It turns out a Chinese poet more than a thousand years ago felt the same as me.' Ms Chan smiled: 'That's right, that's poetry: however many years and miles away, you can still understand it.'" }
questions:
  - { q: "〈靜夜思〉入面，李白點解以為地上有霜？", options: ["因為嗰晚天氣好凍", "因為床前面嘅月光白雪雪，好似霜噉", "因為佢飲醉咗酒"], answer: 1, explain: "疑是地上霜: the moonlight in front of his bed was so white that for a moment he took it for frost." }
  - { q: "「低頭思故鄉」用口語點講最啱？", options: ["低返個頭，諗起自己屋企", "擰轉頭望個月亮", "坐低寫封信返屋企"], answer: 0, explain: "思 = 諗起 / 掛住, 故鄉 = the place you come from; 低頭 = lower your head." }
  - { q: "陳老師話中國詩有咩手法？", options: ["一定要講出自己嘅感覺", "寫景，其實係寫情", "每句都要有一個月亮"], answer: 1, explain: "寫景，其實係寫情: describing a scene is really a way of describing a feeling; the poem never says 'I miss home'." }
  - { q: "〈春曉〉最後一句「花落知多少」有咩感覺？", options: ["好開心，因為春天嚟咗", "有少少唏噓，因為風雨令啲花跌咗", "好嬲，因為雀仔太嘈"], answer: 1, explain: "The light poem ends on a note of regret: wind and rain in the night have knocked down an unknown number of flowers." }
  - { q: "點解用廣東話讀「不覺」，聽得出佢哋係仄聲？", options: ["因為佢哋係入聲，收 t 同 k 尾", "因為佢哋都係第一聲", "因為佢哋係書面語"], answer: 0, explain: "Cantonese keeps the Middle Chinese -p, -t, -k endings (entering tones), which always count as oblique (仄); Mandarin has lost them." }
