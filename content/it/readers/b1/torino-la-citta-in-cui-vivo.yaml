id: r.b1.torino-la-citta-in-cui-vivo
level: b1
title: Torino, la città in cui vivo
kind: text
intro: Samir, who moved to Turin from Morocco as a teenager, describes the city he now calls home. Notice the relative pronouns che, cui, il cui and quello che.
allow: [samir, torino, torinesi, piemonte, mole, antonelliana, egizio, fiat, lingotto, po, superga, bicerin, gianduiotto, gianduiotti, savoia, marocco, casablanca, juventus]
paragraphs:
  - { es: "Sono arrivato a Torino quando avevo quindici anni, insieme ai miei genitori, che avevano trovato lavoro qui. All'inizio la città non mi piaceva per niente. Era grigia, faceva freddo e la gente mi sembrava chiusa. Venivo da Casablanca, una città rumorosa e piena di colori, e Torino, in confronto, mi pareva silenziosa come una biblioteca.", en: "I came to Turin when I was fifteen, with my parents, who had found work here. At first I didn't like the city at all. It was grey, it was cold and people seemed reserved to me. I came from Casablanca, a noisy city full of colour, and Turin, by comparison, seemed as silent as a library." }
  - { es: "Oggi ho trentadue anni e non vivrei in nessun altro posto. Torino è una città che non si mostra subito: bisogna conoscerla con pazienza. È stata la prima capitale d'Italia, nel 1861, e lo si capisce dalle sue piazze enormi e dai palazzi eleganti in cui abitavano i Savoia, la famiglia reale.", en: "Today I'm thirty-two and I wouldn't live anywhere else. Turin is a city that doesn't reveal itself straight away: you have to get to know it patiently. It was the first capital of Italy, in 1861, and you can tell from its enormous squares and the elegant palaces where the Savoys, the royal family, lived." }
  - { es: "La cosa che amo di più sono i portici. Il centro ne ha circa diciotto chilometri, sotto cui si può camminare per ore anche quando piove. Sotto i portici di via Po c'è la libreria in cui ho comprato il mio primo libro in italiano, e c'è il caffè storico dove la proprietaria, il cui figlio era mio compagno di classe, mi offriva ogni tanto un bicerin, la bevanda tipica fatta di caffè, cioccolato e panna.", en: "What I love most are the porticoes. The centre has about eighteen kilometres of them, under which you can walk for hours even when it rains. Under the porticoes of Via Po there's the bookshop where I bought my first book in Italian, and there's the historic café where the owner, whose son was in my class, sometimes treated me to a bicerin, the typical drink made of coffee, chocolate and cream." }
  - { es: "Il simbolo della città è la Mole Antonelliana, un edificio altissimo con una guglia sottile, che si vede da ogni punto della città. Dentro c'è il Museo Nazionale del Cinema, che è uno dei musei più originali che io conosca. Poi c'è il Museo Egizio, il cui patrimonio è secondo solo a quello del Cairo. Chi viene a Torino deve assolutamente visitarlo.", en: "The symbol of the city is the Mole Antonelliana, a very tall building with a slender spire, which can be seen from every part of the city. Inside is the National Cinema Museum, which is one of the most original museums I know. Then there's the Egyptian Museum, whose collection is second only to Cairo's. Anyone who comes to Turin absolutely must visit it." }
  - { es: "Torino è anche la città dell'industria. Qui è nata la FIAT, nel 1899, e per decenni migliaia di persone sono arrivate dal Sud Italia per lavorare nelle sue fabbriche, proprio come più tardi è successo alla mia famiglia. Il Lingotto, la vecchia fabbrica sul cui tetto le auto facevano le prove su una pista, oggi è un centro commerciale con un auditorium e un albergo.", en: "Turin is also the city of industry. FIAT was born here, in 1899, and for decades thousands of people came from the south of Italy to work in its factories, just as later happened to my family. The Lingotto, the old factory on whose roof cars were tested on a track, is now a shopping centre with an auditorium and a hotel." }
  - { es: "Quello che i turisti spesso non sanno è che Torino è anche una città verde. Lungo il Po ci sono parchi enormi, e d'estate i ragazzi si ritrovano sulle rive del fiume fino a tardi. Dalla collina di Superga, nelle giornate limpide, si vedono le Alpi tutte intorno: è lo spettacolo con cui mi sono finalmente innamorato di questa città.", en: "What tourists often don't know is that Turin is also a green city. Along the Po there are enormous parks, and in summer young people meet up on the riverbanks until late. From the hill of Superga, on clear days, you can see the Alps all around: it's the sight that finally made me fall in love with this city." }
  - { es: "I torinesi, quelli che all'inizio mi sembravano freddi, oggi sono i miei amici più cari. Non parlano molto, è vero, ma quando ti dicono «sei dei nostri», lo pensano davvero.", en: "The people of Turin, the ones who seemed cold to me at first, are now my dearest friends. They don't talk much, it's true, but when they tell you 'you're one of us', they really mean it." }
questions:
  - { q: "Perché all'inizio Samir non amava Torino?", options: ["Perché era grigia, fredda e silenziosa", "Perché non c'erano scuole", "Perché era troppo rumorosa"], answer: 0, explain: "Coming from noisy, colourful Casablanca, Turin seemed grey, cold and quiet." }
  - { q: "Che cosa ricorda il fatto che Torino sia stata la prima capitale d'Italia?", options: ["Le piazze enormi e i palazzi eleganti", "Le fabbriche", "I parchi lungo il Po"], answer: 0, explain: "«Lo si capisce dalle sue piazze enormi e dai palazzi eleganti in cui abitavano i Savoia.»" }
  - { q: "Che cos'è il bicerin?", options: ["Un dolce al cioccolato", "Una bevanda di caffè, cioccolato e panna", "Un tipo di pane"], answer: 1, explain: "«La bevanda tipica fatta di caffè, cioccolato e panna.»" }
  - { q: "Nella frase «la proprietaria, il cui figlio era mio compagno di classe», a chi si riferisce «il cui»?", options: ["Alla proprietaria", "A Samir", "Al caffè"], answer: 0, explain: "Il cui = whose: the owner's son was in Samir's class. The article (il) agrees with figlio, the thing possessed." }
  - { q: "Che cosa c'era sul tetto del Lingotto?", options: ["Un giardino", "Una pista per provare le auto", "Una piscina"], answer: 1, explain: "Cars were tested on a track on the factory's roof." }
glossary:
  - { es: chiusa, en: reserved, closed }
  - { es: in confronto, en: by comparison }
  - { es: silenziosa, en: silent, quiet }
  - { es: portici, en: porticoes, arcades }
  - { es: bevanda, en: drink }
  - { es: altissimo, en: very tall }
  - { es: sottile, en: slender, thin }
  - { es: originali, en: original }
  - { es: assolutamente, en: absolutely }
  - { es: auditorium, en: auditorium }
  - { es: limpide, en: clear }
  - { es: migliaia, en: thousands }
