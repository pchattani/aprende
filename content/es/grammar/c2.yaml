- id: g.sociolects
  level: c2
  title: "Sociolects — class, age, group and gender in language"
  summary: "Youth slang, professional jargon, rural and urban speech, inclusive language debates."
  explanation: |
    - **Youth language** (Spain): *en plan, literal, flipar, molar, tío/tía, guay, chungo, rayarse, petarlo, random, cringe, la peña, me da palo, bro.*
    - **Jargon**: medical, legal, IT (*loguearse, el servidor se ha caído, la nube*), football, bullfighting metaphors in politics (*pillar al toro por los cuernos, cortarse la coleta*).
    - **Rural vs urban**: *mujer / señora / tía*; aspiration, archaisms (*mesmo, ansí, truje*) in rural varieties.
    - **Gender and inclusive language**: *todos y todas, les alumnes* (contested), *-x / -@* in writing, RAE's position; strategies such as *el alumnado, la ciudadanía, las personas trabajadoras.*
    - **Taboo and euphemism**: *fallecer / palmar; servicio / váter; persona mayor / viejo; sin techo / vagabundo.*
    - **Prestige and stigma**: *leísmo* accepted, *laísmo* and *loísmo* stigmatised; *dequeísmo* (*pienso de que*) and *queísmo* (*me alegro que*) stigmatised; *haiga, naide* rural.
  examples:
    - { es: "Tío, el concierto lo petó, en plan, literal.", en: "Dude, the concert was a smash, like, literally." }
    - { es: "Se ruega al alumnado que permanezca en las aulas.", en: "Students are asked to remain in the classrooms." }
  drills:
    - { es: "Me estoy rayando con el examen.", en: "I'm stressing out about the exam." }
    - { es: "Su abuelo falleció el año pasado.", en: "Her grandfather passed away last year." }
- id: g.dialectal-grammar
  level: c2
  title: "Dialectal grammar — beyond pronunciation"
  summary: "Leísmo and laísmo, Andalusian ustedes + vosotros verb, Caribbean subject before infinitive, Andean possessives, Rioplatense pronouns, Mexican 'hasta'."
  explanation: |
    - **Spain**: *leísmo* for male persons (*le vi*); Madrid *laísmo* (*la dije*); *condicional por subjuntivo* in the north (*si tendría*); western Andalusia *ustedes vais*.
    - **Canaries / Caribbean**: *ustedes* informal; non-inverted questions (*¿Qué tú quieres?*); subject before infinitive (*para yo saber*); *más nada, más nunca.*
    - **Mexico / Central America**: *hasta* with negative meaning (*abre hasta las nueve* = not until nine); *¿mande?*; *ahorita; qué tanto; mero* (*el mero centro*); *le* intensifier (*ándale, órale*).
    - **Andes**: double possessive (*su casa de él*), *de mí* for *mío*, pluperfect for surprise (*¡había sido caro!*), *dizque.*
    - **Río de la Plata**: *vos*, *che*, *recién* (just, no participle: *recién llegué*), *acá / allá* preferred, *lo de* (at the house of: *lo de Juan*).
    - **Chile**: *cachái, po, al tiro, ¿cómo estái?*
  examples:
    - { es: "¿Qué tú quieres que yo haga? (Caribe)", en: "What do you want me to do?" }
    - { es: "La tienda abre hasta las diez. (México: no abre antes de las diez)", en: "The shop doesn't open until ten." }
  drills:
    - { es: "Recién llegué, che. (Argentina)", en: "I've just arrived, mate." }
    - { es: "Vamos al tiro, po. (Chile)", en: "Let's go right away." }
- id: g.historical-variation
  level: c2
  title: "How Spanish changed — from Latin to today"
  summary: "Sound changes, lost cases, the rise of ser/estar and haber/tener, the evolution of vos and usted, lexical layers."
  explanation: |
    - **From Latin**: loss of cases → prepositions; *f- → h-* (*facere → hacer*); *-ct- → -ch-* (*noctem → noche*); *pl-/cl-/fl- → ll-* (*plenum → lleno*); diphthongisation (*terra → tierra, porta → puerta*).
    - **Medieval Spanish**: *vos* respectful singular; sibilants /ts/ /dz/ /ʃ/ /ʒ/ later merged into /θ/ and /x/ (16th–17th c.); *aver* as possession verb (*he de*), *ser* as auxiliary of movement verbs (*es ido*).
    - **Golden Age**: *vuestra merced → usted*; *vos* becomes rude in Spain and survives in America; future subjunctive still alive.
    - **Lexical layers**: pre-Roman (*perro, izquierda*), Germanic (*guerra, guardar*), Arabic (*almohada, aceite, ojalá, alcalde*), Amerindian (*tomate, chocolate, canoa, maíz*), Italian (*piloto, novela*), French (*jardín, chef*), English (*fútbol, líder, güisqui*).
    - **Spelling reforms**: RAE 1726–2010: *solo / sólo, guion, truhan, ex marido / exmarido.*
  examples:
    - { es: "En un lugar de la Mancha… — el castellano de 1605 se lee aún con facilidad.", en: "In a village of La Mancha… — the Castilian of 1605 can still be read easily." }
    - { es: "Ojalá viene del árabe «law šá lláh», «si Dios quiere».", en: "Ojalá comes from the Arabic law šá lláh, 'God willing'." }
  drills:
    - { es: "La almohada y la alfombra son palabras árabes.", en: "Almohada and alfombra are Arabic words." }
    - { es: "Vuestra merced se convirtió en usted.", en: "Vuestra merced became usted." }
- id: g.golden-age-language
  level: c2
  title: "Reading the Siglo de Oro — Cervantes, Quevedo, Lope, Góngora"
  summary: "Archaic forms, enclitic pronouns, the future subjunctive, vos and vuestra merced, conceptismo and culteranismo."
  explanation: |
    - **Morphology**: *-ades/-edes* endings fading (*tenéis*), enclitics after finite verbs (*díjole, parecióle*), *haber* for *tener* (*ha menester*), *ser* with intransitives (*es muerto*), future subjunctive, *-ra* as pluperfect indicative (*el que naciera* = había nacido).
    - **Pronouns**: *vos* (respect), *vuestra merced*, *él* for *usted*, *aqueste, aquese, do, doquier, agora, ansí, mesmo, truje* (traje), *vide* (vi).
    - **Spelling**: *fermosa, fablar, dixo, mexor, hazer, agora.*
    - **Styles**: *conceptismo* (Quevedo: dense wit, puns) vs *culteranismo* (Góngora: Latinate syntax, hyperbaton, learned vocabulary).
    - **Theatre**: *comedia nueva* (Lope), verse forms (*redondilla, romance, soneto*), the *gracioso*, honour code vocabulary (*honra, agravio, venganza*).
  examples:
    - { es: "Érase un hombre a una nariz pegado. (Quevedo)", en: "There was a man stuck to a nose." }
    - { es: "Mientras por competir con tu cabello, oro bruñido al sol relumbra en vano… (Góngora)", en: "While, to compete with your hair, burnished gold gleams in the sun in vain…" }
  drills:
    - { es: "Díjole que no temiese.", en: "He told him not to fear." }
    - { es: "Agora que estamos solos, hablad.", en: "Now that we are alone, speak." }
- id: g.archaic-forms
  level: c2
  title: "Archaic and literary forms still met in reading"
  summary: "mas, empero, do, cual, harto, otrora, antaño, hogaño, so, allende, aquende, el cual que, enclitic pronouns."
  explanation: |
    | archaic / literary | modern |
    |---|---|
    | *mas* (no accent) | *pero* |
    | *empero* | *sin embargo* |
    | *do, doquier* | *donde, dondequiera* |
    | *cual* | *como* |
    | *harto* | *muy, mucho* |
    | *otrora, antaño* | *en otro tiempo, antes* |
    | *hogaño* | *este año, hoy* |
    | *so* (bajo) | *bajo* (*so pena de*) |
    | *allende / aquende* | *más allá / más acá* |
    | *acaso* | *quizá* |
    | *ha* (hace) | *hace* (*tiempo ha*) |
    | *díjole, hízose* | *le dijo, se hizo* |
    | *fuere, hubiere* | *sea, haya* |
    These survive in poetry, law, humour and set phrases (*so pena de, tiempo ha, mas no*).
  examples:
    - { es: "Quiso huir, mas no pudo.", en: "He wanted to flee, but could not." }
    - { es: "Tiempo ha que no nos veíamos.", en: "It has been a long time since we saw each other." }
  drills:
    - { es: "Harto cansado llegó a la posada.", en: "Exceedingly tired he reached the inn." }
    - { es: "Allende los mares, otrora hubo un reino.", en: "Beyond the seas, there was once a kingdom." }
- id: g.poetic-syntax
  level: c2
  title: "Poetic syntax and metre"
  summary: "Hyperbaton, enjambment, sinalefa, the Spanish syllable count, octosyllable and hendecasyllable, assonant and consonant rhyme."
  explanation: |
    - **Hyperbaton**: inverted order — *Del salón en el ángulo oscuro* (Bécquer) = *en el ángulo oscuro del salón.*
    - **Metre**: count syllables with *sinalefa* (vowels across words merge), add 1 if the line ends in a stressed syllable, subtract 1 if it ends *esdrújulo*. *Octosílabo* (romance, popular), *endecasílabo* (sonnet, Italianate), *alejandrino* (14).
    - **Rhyme**: *consonante* (all sounds from the stressed vowel) vs *asonante* (vowels only: *casa / mata*); *romance* = octosyllables with assonant rhyme in even lines.
    - **Forms**: *soneto* (14 hendecasyllables, ABBA ABBA CDC DCD), *romance, copla, seguidilla, décima, silva, verso libre.*
    - **Devices**: *anáfora, paralelismo, encabalgamiento* (enjambment), *aliteración, apóstrofe, hipálage, sinestesia.*
  examples:
    - { es: "Del salón en el ángulo oscuro, / de su dueña tal vez olvidada, / silenciosa y cubierta de polvo / veíase el arpa. (Bécquer)", en: "In the dark corner of the room, perhaps forgotten by its owner, silent and covered in dust, the harp could be seen." }
    - { es: "Verde que te quiero verde. (Lorca)", en: "Green, how I love you green." }
  drills:
    - { es: "Sobre el olivar se vio a la lechuza volar y volar. (Machado)", en: "Over the olive grove the owl was seen flying and flying." }
    - { es: "En el fondo del vaso quedaba el vino.", en: "At the bottom of the glass the wine remained." }
- id: g.realism-language
  level: c2
  title: "Realism and the 19th–20th century novel — Galdós, Clarín, Unamuno"
  summary: "Costumbrismo vocabulary, Madrid popular speech, free indirect style, the essayistic novel (nivola)."
  explanation: |
    - **Galdós** (*Fortunata y Jacinta, Misericordia, Episodios nacionales*): panoramic Madrid, popular speech (*¡Vaya usté con Dios!*), narrator's irony, long periodic sentences, free indirect style.
    - **Clarín** (*La Regenta*): Vetusta (Oviedo), psychological interiority, anticlerical irony, naturalist detail.
    - **Pardo Bazán** (*Los pazos de Ulloa*): Galician rural world, naturalism.
    - **Unamuno** (*Niebla, San Manuel Bueno, mártir*): *nivola*, metafiction, philosophical dialogue, paradox and neologism (*intrahistoria, nivola*).
    - **Baroja**: short sentences, pessimism; **Valle-Inclán**: *esperpento*, grotesque deformation, archaic-modernist lexicon.
    - **Language features**: *usted* among spouses in the upper class, *don/doña*, *vos* absent, abundant diminutives in popular speech, regional lexicon, period realia (*tartana, berlina, duro, real, peseta*).
  examples:
    - { es: "La heroica ciudad dormía la siesta. (Clarín, La Regenta)", en: "The heroic city was taking its siesta." }
    - { es: "Ahora que a nadie le importa… (Galdós)", en: "Now that nobody cares…" }
  drills:
    - { es: "Doña Perfecta era muy devota.", en: "Doña Perfecta was very devout." }
    - { es: "Augusto Pérez discutió con su propio autor.", en: "Augusto Pérez argued with his own author." }
- id: g.modern-literary-devices
  level: c2
  title: "Twentieth-century devices — stream of consciousness, magical realism, fragmentation"
  summary: "Reading Rulfo, García Márquez, Cortázar, Borges, Martín Gaite, Marsé: narrative time, voice and register."
  explanation: |
    - **Magical realism**: the extraordinary told in a matter-of-fact register (*García Márquez*: *Muchos años después, frente al pelotón de fusilamiento…*); hyperbole, circular time, biblical cadence.
    - **Fragmentation and polyphony**: *Rulfo* (*Pedro Páramo*: voices of the dead, rural Jalisco speech), *Cortázar* (*Rayuela*: alternative orders, invented language *glíglico*).
    - **Borges**: erudite irony, essay-fiction hybrids, Latinate syntax, adjective precision (*un vasto laberinto*), footnote fictions.
    - **Spanish postwar**: *tremendismo* (Cela), social realism, *Martín Gaite* (conversational interiority), *Marsé* (Barcelona bilingual texture), *Delibes* (rural Castilian lexicon).
    - **Devices**: *monólogo interior, perspectivismo, metalepsis, intertextualidad, elipsis temporal, in medias res, narrador no fiable.*
    - Copyright note: these authors are not public domain; read them through libraries and legitimate editions. Public-domain practice texts in this app come from pre-1930 authors.
  examples:
    - { es: "Vine a Comala porque me dijeron que acá vivía mi padre, un tal Pedro Páramo. (Rulfo)", en: "I came to Comala because I was told my father lived here, a certain Pedro Páramo." }
    - { es: "El universo (que otros llaman la Biblioteca)… (Borges)", en: "The universe (which others call the Library)…" }
  drills:
    - { es: "El narrador no es de fiar.", en: "The narrator is not to be trusted." }
    - { es: "La novela empieza in medias res.", en: "The novel begins in medias res." }
- id: g.rhetorical-figures
  level: c2
  title: "Rhetorical figures"
  summary: "Metaphor, metonymy, synecdoche, hyperbole, litotes, antithesis, oxymoron, paradox, anaphora, epiphora, chiasmus, rhetorical question, apostrophe."
  explanation: |
    | figure | example |
    |---|---|
    | *metáfora* | *Tus ojos son dos luceros.* |
    | *metonimia* | *Leer a Cervantes.* |
    | *sinécdoque* | *Cien cabezas de ganado.* |
    | *hipérbole* | *Te lo he dicho mil veces.* |
    | *lítote / atenuación* | *No es muy listo.* |
    | *antítesis* | *Es tan corto el amor y tan largo el olvido.* |
    | *oxímoron* | *un silencio ensordecedor* |
    | *paradoja* | *Vivo sin vivir en mí.* |
    | *anáfora* | *Verde que te quiero verde.* |
    | *quiasmo* | *Ni son todos los que están, ni están todos los que son.* |
    | *interrogación retórica* | *¿Hasta cuándo vamos a aguantar?* |
    | *apóstrofe* | *¡Oh, patria mía!* |
    | *gradación / clímax* | *Lo pidió, lo suplicó, lo exigió.* |
    | *eufemismo* | *una persona de edad avanzada* |
    | *ironía* | *¡Qué puntual eres!* (to a latecomer) |
  examples:
    - { es: "Es tan corto el amor y es tan largo el olvido. (Neruda)", en: "Love is so short and forgetting so long." }
    - { es: "Ni están todos los que son, ni son todos los que están.", en: "Not all who belong are here, nor do all who are here belong." }
  drills:
    - { es: "Un silencio ensordecedor llenó la sala.", en: "A deafening silence filled the room." }
    - { es: "Te lo he dicho mil veces.", en: "I've told you a thousand times." }
- id: g.persuasion-structures
  level: c2
  title: "Persuasion — speeches, advertising and political language"
  summary: "Tricolon, inclusive we, rhetorical questions, slogans, euphemism and dysphemism, framing."
  explanation: |
    - **Structures**: *tricolon* (*educación, sanidad y empleo*), parallelism, antithesis, anaphora (*Sí se puede*), rhetorical questions, call to action with imperative or *nosotros* (*Hagámoslo juntos*).
    - **Inclusive we and address**: *compañeros y compañeras, amigos, ciudadanos; vosotros / ustedes* depending on audience.
    - **Advertising**: imperatives (*Descubre, Vive, Siente*), *tú*, ellipsis, puns, superlatives, anglicisms, the *porque tú lo vales* formula.
    - **Political**: euphemism (*ajuste, flexibilización, crecimiento negativo*), dysphemism (*casta, chiringuito*), framing (*rescate / préstamo*), *nosotros / ellos*, buzzwords (*sostenible, transversal, hoja de ruta*).
    - **Fallacies to detect**: *ad hominem, hombre de paja, falsa dicotomía, pendiente resbaladiza, apelación a la autoridad / a la emoción.*
  examples:
    - { es: "No es una crisis, es un ajuste; no es un recorte, es una optimización.", en: "It's not a crisis, it's an adjustment; it's not a cut, it's an optimisation." }
    - { es: "Educación, sanidad y empleo: ese es nuestro compromiso.", en: "Education, health and employment: that is our commitment." }
  drills:
    - { es: "¿Vamos a permitir que esto siga así?", en: "Are we going to allow this to continue?" }
    - { es: "Descubre el sabor de lo auténtico.", en: "Discover the taste of the authentic." }
- id: g.translation-nuance
  level: c2
  title: "Translating with nuance — aspect, register, culture"
  summary: "Equivalence versus literalness: tense aspect, diminutives, modal particles, swearing, politeness and culture-bound terms."
  explanation: |
    - **Aspect**: English 'I lived there' → *vivía / viví* (choose); 'I've been living' → *vivo desde / llevo viviendo.*
    - **Register**: English neutral 'you' → *tú / usted / vosotros / ustedes*; titles and surnames.
    - **Diminutives and particles**: *un cafecito* ≈ 'a quick coffee'; *pues, bueno, es que, ya* carry attitude more than meaning.
    - **Swearing**: Spanish religious and sexual swearing (*hostia, joder, coño*) is milder in Spain than literal English equivalents; calibrate.
    - **Culture-bound terms** (*realia*): *sobremesa, tapas, puente, oposiciones, siesta, tertulia, piso patera, botellón* — borrow, explain or adapt.
    - **Syntax**: English short sentences → Spanish may join with relatives; avoid *gerundio* for sequence; passive → *se* or active.
    - **False equivalents**: 'actually', 'eventually' (*finalmente*, not *eventualmente*), 'sympathetic' (*comprensivo*).
  examples:
    - { es: "La sobremesa duró hasta las seis.", en: "The after-lunch conversation went on until six." }
    - { es: "'Eventually they agreed' → Finalmente se pusieron de acuerdo (no *eventualmente*).", en: "Translation note on a false friend." }
  drills:
    - { es: "Nos tomamos un cafecito y lo hablamos.", en: "Let's grab a quick coffee and talk it over." }
    - { es: "Es que no me apetece, ¿sabes?", en: "The thing is I don't feel like it, you know?" }
- id: g.untranslatables
  level: c2
  title: "Hard-to-translate Spanish words and concepts"
  summary: "sobremesa, estrenar, madrugar, tutear, empalagar, friolero, desvelado, vergüenza ajena, anteayer, merienda, puente."
  explanation: |
    - *sobremesa* — lingering at the table after a meal · *estrenar* — use/wear for the first time · *madrugar* — get up early · *trasnochar* — stay up late
    - *tutear* — address as tú · *empalagar* — be sickly sweet · *friolero* — sensitive to cold · *caluroso* — sensitive to heat
    - *desvelado* — unable to sleep · *vergüenza ajena* — embarrassment for someone else · *morriña* — homesickness (Galician)
    - *anteayer* — the day before yesterday · *merienda* — afternoon snack · *puente* — long weekend · *quincena* — fortnight
    - *te quiero* vs *te amo* — graded love · *cariño, mimar, consentir* — affection vocabulary
    - *duende, chispa, salero, enchufe, chapuza, pagafantas, aturdido, tocayo, consuegro, estrenar*
    - Verbs in one word: *anochecer, amanecer, atardecer, madrugar, trasnochar, almorzar, merendar, cenar.*
  examples:
    - { es: "Tengo vergüenza ajena cuando mi padre canta en público.", en: "I cringe for my father when he sings in public." }
    - { es: "Mañana estreno los zapatos nuevos.", en: "Tomorrow I'll wear my new shoes for the first time." }
  drills:
    - { es: "Soy muy friolera; siempre tengo frío.", en: "I feel the cold a lot; I'm always cold." }
    - { es: "Este fin de semana hay puente.", en: "This weekend is a long weekend." }
- id: g.calques
  level: c2
  title: "Anglicisms, calques and how to avoid them"
  summary: "Direct loans (ok), adapted loans, semantic calques (*aplicar* for apply, *soportar* for support), syntactic calques (overuse of passive and possessives)."
  explanation: |
    - **Accepted loans**: *fútbol, líder, mitin, estándar, güisqui, chat, blog, selfi, tuit, clic* — adapted spelling.
    - **Fashionable raw loans**: *marketing, online, feedback, coaching, briefing, startup* — Spanish alternatives exist (*mercadotecnia, en línea, retroalimentación*).
    - **Semantic calques to avoid**: *aplicar a un puesto* (→ *solicitar*), *soportar* (→ *apoyar*), *eventualmente* (→ *finalmente*), *asumir* for 'suppose' (→ *suponer*), *agresivo* for 'dynamic', *remover* for 'remove' (→ *quitar*), *bizarro* (= brave, not weird), *billón* (= 10¹², not 10⁹).
    - **Syntactic calques**: excessive passive (*fue construido por*), possessives with body parts (*lavó sus manos*), *estar siendo* overuse, adjective before noun, gerund as noun (*el fumar es malo*), *es por eso que* (→ *por eso*), *en base a* (→ *con base en, según*).
    - **Punctuation calques**: capitals in titles and months, decimal point, missing ¿ ¡.
  examples:
    - { es: "Solicitó el puesto, no «aplicó» al puesto.", en: "She applied for the job (solicitar, not aplicar)." }
    - { es: "Se lavó las manos (no «sus manos»).", en: "She washed her hands." }
  drills:
    - { es: "Finalmente aceptaron la oferta.", en: "Eventually they accepted the offer." }
    - { es: "Un billón español son un millón de millones.", en: "A Spanish billón is a million million." }
- id: g.scientific-register
  level: c2
  title: "Scientific and medical Spanish"
  summary: "Greek and Latin roots, nominal style, impersonal and passive, hedging, units and abbreviations."
  explanation: |
    - **Roots**: *hemo-, cardio-, neuro-, -itis, -osis, -oma, -logía, -patía; hidro-, termo-, -metro, -scopio.* Spanish keeps Latin/Greek forms close to English: *cardiología, hipótesis, análisis* (invariable plurals: *los análisis, las crisis*).
    - **Style**: *se observa, se ha demostrado, los datos sugieren, no se encontraron diferencias significativas, en nuestra serie, a la luz de estos resultados.*
    - **Units**: SI symbols without full stop (*5 km, 20 °C*), decimal comma, space before *%* (*un 15 %*), *mg/dl.*
    - **Abbreviations**: *ADN, ARN, TAC, RMN, IMC, OMS, UCI, ECG, SIDA, VIH, pág., cap., fig., et al.*
    - **Medical register with patients**: *dolor / molestia, infarto / ataque al corazón, hipertensión / tensión alta, analítica, tomar la tensión, dar de alta, dar de baja (sick leave).*
  examples:
    - { es: "No se observaron diferencias estadísticamente significativas entre ambos grupos.", en: "No statistically significant differences were observed between the two groups." }
    - { es: "El paciente fue dado de alta a los tres días.", en: "The patient was discharged after three days." }
  drills:
    - { es: "Los análisis muestran una leve anemia.", en: "The tests show mild anaemia." }
    - { es: "La temperatura subió a 39 °C.", en: "The temperature rose to 39 °C." }
- id: g.technical-register
  level: c2
  title: "Technical and IT Spanish"
  summary: "Manuals, specifications and software: imperatives and infinitives, anglicisms and their Spanish forms, menu and UI vocabulary."
  explanation: |
    - **Instructions**: infinitive (*Pulsar el botón*), impersonal *se* (*Se recomienda*), formal imperative (*Pulse, seleccione, introduzca*), *deberá*.
    - **IT vocabulary**: *archivo / fichero, carpeta, ratón, teclado, pantalla, contraseña, usuario, iniciar sesión / cerrar sesión, descargar, subir, actualizar, guardar, deshacer, copiar y pegar, enlace, navegador, correo, adjunto, nube, servidor, red, cortafuegos, copia de seguridad, código fuente, desarrollador, depurar, compilar, despliegue, interfaz.*
    - **Anglicisms**: *software, hardware, email, link, backup, login, bug, hacker* — Spanish forms exist and are preferred in formal docs (*programa, equipo, correo, enlace, copia de seguridad, inicio de sesión, error, pirata informático*).
    - **Engineering**: *plano, tolerancia, carga, esfuerzo, rendimiento, mantenimiento, avería, puesta en marcha, normativa, homologación.*
    - **Spelling**: *wifi, bluetooth, hardware* (italics optional), *clic* (not click), *tuitear, chatear, escanear.*
  examples:
    - { es: "Introduzca su contraseña y pulse «Iniciar sesión».", en: "Enter your password and press 'Log in'." }
    - { es: "Se recomienda realizar una copia de seguridad antes de actualizar.", en: "It is recommended to make a backup before updating." }
  drills:
    - { es: "El servidor está caído; avisa al desarrollador.", en: "The server is down; tell the developer." }
    - { es: "Guarda el archivo en la carpeta compartida.", en: "Save the file in the shared folder." }
- id: g.bureaucratic-language
  level: c2
  title: "Bureaucratic Spanish and plain-language alternatives"
  summary: "Understanding official letters, forms and notices; the burocratés and how institutions are simplifying it."
  explanation: |
    - **Typical forms**: *el interesado, la persona solicitante, el presente escrito, la citada resolución, en el plazo de diez días hábiles, a contar desde el día siguiente a la notificación, previo pago de la tasa, surtirá efectos, queda sin efecto, procede / no procede, subsanar, desestimar, estimar, recurrir, recurso de alzada, silencio administrativo.*
    - **Verbs**: *proceder a, efectuar, llevar a cabo, dar traslado, poner en conocimiento, requerir, instar, acreditar, aportar, cumplimentar, personarse.*
    - **Forms**: *DNI/NIE, empadronamiento, cita previa, nómina, IRPF, declaración de la renta, Seguridad Social, alta/baja, certificado, apostilla, compulsar, poder notarial.*
    - **Plain language movement** (*lenguaje claro*): short sentences, active voice, *usted* direct address, headings, examples; e.g. *Debe pagar antes del 15 de mayo* instead of *Deberá procederse al abono…*
  examples:
    - { es: "Se le requiere para que, en el plazo de diez días hábiles, subsane la documentación aportada.", en: "You are required, within ten working days, to correct the documentation submitted." }
    - { es: "Pida cita previa en la web antes de personarse en la oficina.", en: "Book an appointment online before coming to the office." }
  drills:
    - { es: "El recurso fue desestimado por silencio administrativo.", en: "The appeal was rejected by administrative silence." }
    - { es: "Tiene que empadronarse en el ayuntamiento.", en: "You have to register as a resident at the town hall." }
- id: g.wordplay
  level: c2
  title: "Wordplay — puns, palindromes, tongue twisters and riddles"
  summary: "Juegos de palabras, calambur, dilogía, trabalenguas, palíndromos, adivinanzas, chistes."
  explanation: |
    - **Dilogía** (double meaning): *banco* (bank/bench), *muñeca* (doll/wrist), *gato* (cat/jack), *cola, hoja, planta, sierra.*
    - **Calambur**: regrouping sounds — *Oro parece, plata no es* (*plátano es*); *Yo loco, loco, y ella loquita* (*ella lo quita*).
    - **Paronomasia**: *Entre el clavel y la rosa, su majestad escoja* (*es coja*, Quevedo to the queen).
    - **Palíndromos**: *Dábale arroz a la zorra el abad. Anita lava la tina.*
    - **Trabalenguas**: *Tres tristes tigres… El cielo está enladrillado, ¿quién lo desenladrillará?… Pablito clavó un clavito.*
    - **Adivinanzas**: *Blanca por dentro, verde por fuera; si quieres que te lo diga, espera.* (la pera)
    - **Chistes**: *¿Qué le dice un jaguar a otro? Jaguar you.* Jaimito, Lepe, *de gallegos*, absurd humour (*Gila*).
    - **Greguerías** (Ramón Gómez de la Serna): *El agua se suelta el pelo en las cascadas.*
  examples:
    - { es: "Oro parece, plata no es. ¿Qué es? — El plátano.", en: "It looks like gold, it isn't silver. What is it? — The banana (plata-no-es)." }
    - { es: "Dábale arroz a la zorra el abad.", en: "The abbot gave rice to the vixen (a palindrome)." }
  drills:
    - { es: "Tres tristes tigres tragaban trigo en un trigal.", en: "Three sad tigers swallowed wheat in a wheat field." }
    - { es: "¿Qué hace un pez? Nada.", en: "What does a fish do? Nothing / it swims (nada)." }
- id: g.neologisms
  level: c2
  title: "Neologisms and language change today"
  summary: "How new words enter Spanish: derivation, loans, acronyms, truncation; RAE and Fundéu recommendations."
  explanation: |
    - **Derivation**: *tuitear, whatsappear, googlear, procrastinar, empoderar, viralizar, postureo, machirulo, aporofobia, teletrabajar.*
    - **Loans adapted**: *selfi, bluyín (LatAm), espóiler, cuórum, pódcast, máster, nocaut, estrés, beicon, cruasán.*
    - **Truncation**: *profe, cole, bici, finde, boli, tele, insti, peli, compi.*
    - **Acronyms as words**: *ovni, sida, pyme, mileurista, ni-ni, OTAN, láser.*
    - **Semantic change**: *nube, ratón, ventana, tableta, migrar, perfil, muro, red.*
    - **Institutions**: RAE/ASALE dictionary updates yearly; *Fundéu RAE* issues daily recommendations (*escribe «wasap», no «whatsapp»*); criteria: use, need, adaptability.
    - **Gender-neutral neologisms** and *-e* forms as an ongoing debate.
  examples:
    - { es: "Me hicieron un espóiler de la peli en el finde.", en: "They spoiled the film for me at the weekend." }
    - { es: "Las pymes teletrabajan más desde la pandemia.", en: "Small businesses work remotely more since the pandemic." }
  drills:
    - { es: "Googléalo y luego me lo cuentas.", en: "Google it and then tell me." }
    - { es: "Es puro postureo, no le gusta el arte.", en: "It's pure posing, he doesn't like art." }
- id: g.slang
  level: c2
  title: "Slang across the Spanish-speaking world"
  summary: "Everyday colloquialisms by region: Spain, Mexico, Argentina, Colombia, Chile, Caribbean; swearing calibrated."
  explanation: |
    - **Spain**: *mola, guay, flipar, currar, pasta, tío/tía, colega, pillar, cutre, chungo, vale, venga, hostia (strong), joder (strong), coño, qué fuerte, me la suda (vulgar), ir de tranquis, hacer botellón.*
    - **Mexico**: *chido, padre, güey/wey, neta, chamba, lana, órale, ándale, qué onda, no manches, chale, fresa, naco, cuate, ahorita, mande.*
    - **Argentina / Uruguay**: *che, boludo (friendly/insult), quilombo, laburo, guita, copado, bárbaro, re (very), posta, mina, pibe, bondi, morfar, un montón.*
    - **Colombia**: *parcero/parce, chévere, bacano, berraco, qué pena (sorry), marica (friendly among youth), tinto (coffee), rumba, guayabo (hangover).*
    - **Chile**: *weón/weona (very frequent, multi-use), cachái, po, fome, la raja, al tiro, carrete, pololo/a, bacán, luca.*
    - **Caribbean**: *chévere, bochinche, jevo/jeva, guagua, mi pana, qué lo qué (DR), asere (Cuba), ¿qué bolá?.*
    - Calibrate: *boludo* is affectionate in Buenos Aires and an insult elsewhere; *coger* is vulgar in most of America.
  examples:
    - { es: "Qué onda, güey, ¿vamos a la chamba o qué?", en: "What's up, dude, are we going to work or what? (Mexico)" }
    - { es: "Che, boludo, qué quilombo este laburo.", en: "Hey mate, what a mess this job is. (Argentina)" }
  drills:
    - { es: "Parce, qué chévere la rumba de ayer.", en: "Mate, yesterday's party was great. (Colombia)" }
    - { es: "Está muy chulo, tío, me mola.", en: "It's really cool, mate, I like it. (Spain)" }
- id: g.native-fluency-markers
  level: c2
  title: "Sounding native — rhythm, fillers, discourse habits"
  summary: "Linking and reduction, intonation patterns, conversational fillers, repair, backchannels, idiomatic density, cultural references."
  explanation: |
    - **Sound**: syllable-timed rhythm, linking across words, weak *-d-* and *-s* reduction where regional, falling intonation in statements, rising only in yes/no questions, exclamative *¡Qué…!* contour.
    - **Fillers and connectors**: *bueno, pues, o sea, es que, en plan, vamos, a ver, mira, oye, ¿sabes?, ¿no?, total, en fin, nada.*
    - **Backchannels**: *ya, claro, ajá, sí sí, ¿en serio?, ¡no me digas!, ¡qué fuerte!, anda.*
    - **Repair**: *perdón, quiero decir, o sea, mejor dicho, cómo se dice…, eso.*
    - **Idiomatic density**: natives use collocations and fixed phrases constantly (*ni de coña, por si las moscas, a lo mejor, de hecho*).
    - **Cultural references**: TV, football, food, festivals, politics, songs — follow Spanish-language media to pick them up.
    - **Habits**: overlapping speech is normal, direct imperatives among friends, diminutives for affection, *tú* generic, exaggeration.
  examples:
    - { es: "Pues nada, o sea, al final no fuimos, ¿sabes? Es que llovía a mares.", en: "So, well, in the end we didn't go, you know? It was pouring." }
    - { es: "¡No me digas! ¿En serio? Qué fuerte.", en: "You don't say! Really? That's wild." }
  drills:
    - { es: "A ver, mira, es que no me sale.", en: "Let's see, look, the thing is I can't get it." }
    - { es: "Total, que nos quedamos en casa.", en: "So anyway, we stayed at home." }
- id: g.c2-review
  level: c2
  title: "C2 review — mastery"
  summary: "You can understand any variety and register, read the canon, write in specialised registers and play with the language. Keep going: input, output, people."
  explanation: |
    Mastery is not an endpoint but a practice. What keeps a C2 speaker sharp:
    - **Massive input**: novels, essays, long-form journalism, radio and podcasts from several countries, films without subtitles.
    - **Deliberate output**: writing in different genres, speaking with natives, recording yourself, getting corrected.
    - **Noticing**: new idioms, collocations and regionalisms into your review queue; the reader tool mines any text you import.
    - **Register switching**: practise the same message as a tweet, an email to a minister, a chat with a friend, a formal report.
    - **Culture**: history, politics, humour and current affairs of the Spanish-speaking world; references carry meaning.
    - **Review**: your spaced-repetition queue now holds thousands of items; a few minutes a day keeps them productive.
  examples:
    - { es: "El dominio de una lengua se mide menos por lo que se sabe que por lo que se es capaz de hacer con ella.", en: "Mastery of a language is measured less by what one knows than by what one can do with it." }
  drills:
    - { es: "Quien domina los matices, domina la lengua.", en: "Whoever masters the nuances masters the language." }
    - { es: "Sigue leyendo, hablando y escuchando: así se aprende.", en: "Keep reading, speaking and listening: that's how one learns." }
