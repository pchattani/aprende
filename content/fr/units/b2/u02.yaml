id: b2.u02
title: "Les bouchons : je doute que tu finisses"
lessons:
  - id: b2.u02.l1
    title: Je doute que tu finisses
    teach: [g.subjonctif-doute]
    tip: "Doubt and possibility take the subjonctif (je doute que, il se peut que, il est possible que); certainty and probability take the indicative (je suis sûr que, il est probable que)."
    vocab: [w.improbable, w.douteux, w.il-est-possible-que, w.il-se-peut-que, w.il-est-peu-probable-que, w.contester, w.certitude, w.incertitude, w.persuadé, w.sûrement, w.certainement, w.probablement, w.apparemment, w.vraisemblablement, w.quenelle, w.andouillette, w.cervelle, w.fromage-blanc, w.saucisson, w.pot, w.nappe, w.carreau, w.typiquement, w.lyonnais]
    sentences:
      - { es: "Je doute que tu finisses ce plat de quenelles.", en: "I doubt you'll finish this dish of quenelles.", altEs: ["Je doute que tu arrives à finir ce plat de quenelles."], altEn: ["I doubt you're going to finish this plate of quenelles."], grammar: [g.subjonctif-doute], vocab: [w.quenelle], error: { wrong: "Je doute que tu finis ce plat de quenelles.", explain: "douter que takes the subjonctif: que tu finisses.", grammar: g.subjonctif-doute } }
      - { es: "Il est possible que le bouchon soit complet ce soir.", en: "It's possible the bouchon is full tonight.", altEs: ["Il se peut que le bouchon soit complet ce soir."], altEn: ["The bouchon may be full tonight."], grammar: [g.subjonctif-doute], vocab: [w.il-est-possible-que], transform: { instruction: "Make it more likely with 'il est probable que'", answer: "Il est probable que le bouchon sera complet ce soir.", alt: ["Il est probable que le bouchon est complet ce soir."], en: "The bouchon will probably be full tonight." } }
      - { es: "Il se peut qu'il n'y ait plus d'andouillette à cette heure-ci.", en: "There may be no andouillette left at this time of night.", altEs: ["Il est possible qu'il n'y ait plus d'andouillette à cette heure-ci."], grammar: [g.subjonctif-doute], vocab: [w.il-se-peut-que, w.andouillette] }
      - { es: "Il est peu probable que les touristes commandent de la cervelle de canut.", en: "It's unlikely that the tourists will order cervelle de canut.", altEs: ["Il est improbable que les touristes commandent de la cervelle de canut."], grammar: [g.subjonctif-doute], vocab: [w.il-est-peu-probable-que, w.cervelle], note: "Cervelle de canut is fromage blanc with herbs: no brains involved." }
      - { es: "Je suis persuadé que tu vas adorer le saucisson chaud.", en: "I'm convinced you're going to love the hot sausage.", altEs: ["Je suis persuadée que tu vas adorer le saucisson chaud.", "Je suis sûr que tu vas adorer le saucisson chaud."], grammar: [g.subjonctif-doute], vocab: [w.persuadé, w.saucisson], note: "Certainty takes the indicative." }
      - { es: "Je ne suis pas sûr que le serveur ait compris notre commande.", en: "I'm not sure the waiter understood our order.", altEs: ["Je ne suis pas sûre que le serveur ait compris notre commande.", "Je ne suis pas certain que le serveur ait compris notre commande."], grammar: [g.subjonctif-doute, g.subjonctif-passe], vocab: [] }
      - { es: "Le serveur conteste qu'il y ait une erreur dans l'addition.", en: "The waiter disputes that there's a mistake in the bill.", grammar: [g.subjonctif-doute], vocab: [w.contester] }
      - { es: "Je doute qu'un seul pot suffise pour quatre personnes.", en: "I doubt one pot will be enough for four people.", altEs: ["Je doute qu'un pot suffise pour quatre personnes."], grammar: [g.subjonctif-doute], vocab: [w.pot], note: "A pot lyonnais is a thick-bottomed 46 cl bottle of wine." }
      - { es: "Les nappes à carreaux rouges et blancs sont typiquement lyonnaises.", en: "Red and white checked tablecloths are typical of Lyon.", altEs: ["Les nappes à carreaux rouges et blancs, c'est typiquement lyonnais."], grammar: [g.adjective-agreement], vocab: [w.nappe, w.carreau, w.typiquement, w.lyonnais] }
      - { es: "Apparemment, ce bouchon existe depuis 1890, mais je doute que ce soit vrai.", en: "Apparently this bouchon has been around since 1890, but I doubt that's true.", altEs: ["Apparemment, ce bouchon existe depuis 1890, mais j'en doute."], grammar: [g.subjonctif-doute, g.depuis-present], vocab: [w.apparemment] }
      - { es: "Il viendra sûrement, mais il est possible qu'il soit en retard.", en: "He'll surely come, but he may be late.", altEs: ["Il viendra sûrement, mais il se peut qu'il soit en retard."], grammar: [g.subjonctif-doute], vocab: [w.sûrement, w.il-est-possible-que], note: "Adverbs like sûrement and probablement don't change the mood: the verb stays indicative." }
      - { es: "Le chef est vraisemblablement en cuisine, mais je ne suis pas sûre qu'il puisse venir nous saluer.", en: "The chef is in all likelihood in the kitchen, but I'm not sure he can come and say hello.", altEs: ["Le chef est vraisemblablement en cuisine, mais je ne suis pas sûr qu'il puisse venir nous saluer."], grammar: [g.subjonctif-doute], vocab: [w.vraisemblablement] }
      - { es: "Il y aura probablement du monde, donc il se peut qu'on doive attendre.", en: "There'll probably be a crowd, so we might have to wait.", altEs: ["Il y aura probablement du monde, donc il est possible qu'on doive attendre."], grammar: [g.subjonctif-doute], vocab: [w.probablement, w.il-se-peut-que] }
      - { es: "Il est douteux que ce fromage blanc soit fait maison.", en: "It's doubtful that this fromage blanc is homemade.", altEs: ["Je doute que ce fromage blanc soit fait maison."], grammar: [g.subjonctif-doute], vocab: [w.douteux, w.fromage-blanc] }
      - { es: "C'est improbable qu'il reste une table libre un samedi soir.", en: "It's unlikely there's a table left on a Saturday night.", altEs: ["Il est improbable qu'il reste une table libre un samedi soir.", "Il est peu probable qu'il reste une table libre un samedi soir."], grammar: [g.subjonctif-doute], vocab: [w.improbable] }
      - { es: "Malgré l'incertitude, j'ai une certitude : nous reviendrons dans ce bouchon.", en: "Despite the uncertainty, I'm sure of one thing: we'll come back to this bouchon.", altEs: ["Malgré l'incertitude, j'ai une certitude : on reviendra dans ce bouchon."], grammar: [g.futur-simple-forms], vocab: [w.incertitude, w.certitude] }
    exchanges:
      - q: { es: "Tu vas finir tes quenelles ?", en: "Are you going to finish your quenelles?" }
        a: { es: "Je doute d'y arriver : c'est énorme !", en: "I doubt I'll manage: it's huge!" }
        alt: ["J'en doute, c'est énorme.", "Bien sûr que je vais les finir !"]
        grammar: [g.subjonctif-doute]
        vocab: [w.quenelle]
      - q: { es: "Il reste des tables pour ce soir ?", en: "Are there any tables left for tonight?" }
        a: { es: "Il se peut qu'il en reste une en terrasse.", en: "There may be one left on the terrace." }
        alt: ["Il est possible qu'il en reste une.", "Non, je doute qu'il en reste."]
        grammar: [g.subjonctif-doute, g.pronoun-en]
        vocab: [w.il-se-peut-que]
      - q: { es: "Tu prendras certainement un dessert ?", en: "You'll certainly have a dessert?" }
        a: { es: "Je ne suis pas sûr d'avoir encore de la place.", en: "I'm not sure I still have room." }
        alt: ["Il est peu probable que j'aie encore faim.", "Certainement !"]
        grammar: [g.subjonctif-doute]
        vocab: [w.certainement]
      - q: { es: "C'est vraiment de la cervelle ?", en: "Is it really brains?" }
        a: { es: "Mais non ! C'est du fromage blanc aux herbes, typiquement lyonnais.", en: "Of course not! It's fromage blanc with herbs, typical of Lyon." }
        alt: ["Non, c'est du fromage blanc.", "Pas du tout, c'est un fromage."]
        grammar: [g.partitive-articles]
        vocab: [w.cervelle, w.fromage-blanc, w.typiquement]
      - q: { es: "Le restaurant est ouvert le dimanche ?", en: "Is the restaurant open on Sundays?" }
        a: { es: "Apparemment oui, mais il est possible qu'il ferme plus tôt.", en: "Apparently so, but it may close earlier." }
        alt: ["Je n'en suis pas sûr.", "Il me semble que oui."]
        grammar: [g.subjonctif-doute]
        vocab: [w.apparemment]
    texts:
      - title: "Message de Lucas"
        es: ["On se retrouve au bouchon de la rue Mercière à vingt heures ?", "J'ai réservé, mais il est possible qu'on attende un peu.", "Et je doute que tu aies faim après ton goûter !"]
        en: ["Shall we meet at the bouchon on rue Mercière at eight?", "I've booked, but we may have to wait a bit.", "And I doubt you'll be hungry after your afternoon snack!"]
        grammar: [g.subjonctif-doute]
        vocab: [w.il-est-possible-que]
      - title: "Le menu du jour"
        es: ["Aujourd'hui : quenelle de brochet ou andouillette.", "En dessert, cervelle de canut ou tarte aux pralines.", "Il est possible que certains plats ne soient plus disponibles après vingt et une heures."]
        en: ["Today: pike quenelle or andouillette.", "For dessert, cervelle de canut or pink praline tart.", "Some dishes may no longer be available after 9 pm."]
        grammar: [g.subjonctif-doute]
        vocab: [w.quenelle, w.andouillette, w.cervelle]
    spicy:
      - { es: "Je doute que tu finisses ton assiette, mais je doute encore plus que tu partes sans mon numéro.", en: "I doubt you'll finish your plate, but I doubt even more that you'll leave without my number.", grammar: [g.subjonctif-doute], vocab: [] }
      - { es: "Il se peut que je sois venu ici pour les quenelles… ou pour toi.", en: "I may have come here for the quenelles… or for you.", altEs: ["Il se peut que je sois venue ici pour les quenelles… ou pour toi."], grammar: [g.subjonctif-doute, g.subjonctif-passe], vocab: [w.il-se-peut-que, w.quenelle] }
      - { es: "Apparemment, tu as dit à tout le monde que j'étais charmant. Je doute que ce soit encore un secret.", en: "Apparently you told everyone I was charming. I doubt it's still a secret.", altEs: ["Apparemment, tu as dit à tout le monde que j'étais charmante. Je doute que ce soit encore un secret."], grammar: [g.subjonctif-doute], vocab: [w.apparemment] }
      - { es: "Je suis persuadée que tu as choisi ce bouchon pour les nappes à carreaux, pas pour moi.", en: "I'm convinced you chose this bouchon for the checked tablecloths, not for me.", altEs: ["Je suis persuadé que tu as choisi ce bouchon pour les nappes à carreaux, pas pour moi."], grammar: [g.subjonctif-doute], vocab: [w.persuadé, w.nappe, w.carreau] }
      - { es: "Il est possible que ce soit un rendez-vous ? Tu as mis ta plus belle chemise.", en: "Is it possible this is a date? You've put on your nicest shirt.", grammar: [g.subjonctif-doute], vocab: [w.il-est-possible-que] }
  - id: b2.u02.l2
    title: Le meilleur bouchon que je connaisse
    teach: [g.subjonctif-relatives]
    tip: "Use the subjonctif in a relative clause when the thing may not exist (je cherche un restaurant qui soit ouvert), after a negative (il n'y a personne qui sache), and after superlatives and le seul, le premier."
    vocab: [w.rare, w.unique, w.exigeant, w.exigence, w.satisfaire, w.satisfait, w.bistrot, w.brasserie, w.traiteur, w.spécialité, w.plat-du-jour, w.entrée, w.plat-principal, w.digestif, w.sommelier, w.gastronomie, w.gastronomique, w.chef-cuisinier, w.cuisinier, w.toque, w.étoilé, w.gourmet, w.réputation]
    sentences:
      - { es: "Je cherche un bouchon qui soit ouvert le lundi.", en: "I'm looking for a bouchon that's open on Mondays.", altEs: ["Je cherche un bouchon ouvert le lundi."], grammar: [g.subjonctif-relatives], vocab: [], transform: { instruction: "Make it a specific bouchon you know exists ('le bouchon')", answer: "Je cherche le bouchon qui est ouvert le lundi.", en: "I'm looking for the bouchon that's open on Mondays." } }
      - { es: "C'est le chef cuisinier le plus exigeant que je connaisse.", en: "He's the most demanding head chef I know.", altEs: ["C'est la cheffe cuisinière la plus exigeante que je connaisse."], grammar: [g.subjonctif-relatives, g.superlatives], vocab: [w.chef-cuisinier, w.exigeant], transform: { instruction: "Change 'je' to 'nous'", answer: "C'est le chef cuisinier le plus exigeant que nous connaissions.", en: "He's the most demanding head chef we know." } }
      - { es: "Il n'y a aucun cuisinier qui fasse la quenelle comme lui.", en: "There's no cook who makes quenelles like him.", altEs: ["Aucun cuisinier ne fait la quenelle comme lui."], grammar: [g.subjonctif-relatives], vocab: [w.cuisinier, w.quenelle], error: { wrong: "Il n'y a aucun cuisinier qui fait la quenelle comme lui.", explain: "After a negative antecedent (aucun, personne, rien) the relative clause takes the subjonctif: qui fasse.", grammar: g.subjonctif-relatives } }
      - { es: "Connais-tu un traiteur qui puisse livrer cinquante repas samedi ?", en: "Do you know a caterer who can deliver fifty meals on Saturday?", altEs: ["Tu connais un traiteur qui puisse livrer cinquante repas samedi ?", "Est-ce que tu connais un traiteur qui puisse livrer cinquante repas samedi ?"], grammar: [g.subjonctif-relatives], vocab: [w.traiteur] }
      - { es: "Le restaurant de Paul Bocuse a gardé ses trois étoiles de 1965 à 2020 : c'est l'un des rares qui les aient conservées si longtemps.", en: "Paul Bocuse's restaurant kept its three stars from 1965 to 2020: it's one of the few to have kept them so long.", grammar: [g.subjonctif-relatives, g.subjonctif-passe], vocab: [w.rare] }
      - { es: "Nous cherchons une brasserie où l'on puisse manger après minuit.", en: "We're looking for a brasserie where you can eat after midnight.", altEs: ["On cherche une brasserie où on puisse manger après minuit."], grammar: [g.subjonctif-relatives], vocab: [w.brasserie] }
      - { es: "C'est le seul bistrot du quartier qui serve encore un vrai plat du jour à douze euros.", en: "It's the only bistro in the area that still serves a real dish of the day for twelve euros.", grammar: [g.subjonctif-relatives], vocab: [w.bistrot, w.plat-du-jour] }
      - { es: "Monsieur, je voudrais un vin qui aille bien avec les quenelles.", en: "I'd like a wine that goes well with the quenelles, please.", altEs: ["Je voudrais un vin qui aille bien avec les quenelles, s'il vous plaît."], grammar: [g.subjonctif-relatives], vocab: [w.sommelier] }
      - { es: "Je ne connais personne qui refuse un digestif après un tel repas.", en: "I don't know anyone who'd refuse a digestif after a meal like that.", grammar: [g.subjonctif-relatives], vocab: [w.digestif] }
      - { es: "Y a-t-il une ville qui ait une meilleure réputation gastronomique que Lyon ? Les Lyonnais en doutent.", en: "Is there a city with a better gastronomic reputation than Lyon? The people of Lyon doubt it.", altEs: ["Est-ce qu'il y a une ville qui ait une meilleure réputation gastronomique que Lyon ? Les Lyonnais en doutent."], grammar: [g.subjonctif-relatives], vocab: [w.réputation, w.gastronomique] }
      - { es: "Mon rêve ? Trouver un restaurant étoilé qui ne soit pas trop cher.", en: "My dream? To find a starred restaurant that isn't too expensive.", grammar: [g.subjonctif-relatives], vocab: [w.étoilé] }
      - { es: "Mon père est un vrai gourmet ; c'est la seule personne que je connaisse qui aime l'andouillette.", en: "My father is a real gourmet; he's the only person I know who likes andouillette.", grammar: [g.subjonctif-relatives], vocab: [w.gourmet, w.andouillette] }
      - { es: "La quenelle est une spécialité qu'on trouve partout à Lyon.", en: "The quenelle is a speciality you find everywhere in Lyon.", grammar: [g.subjonctif-relatives, g.relative-qui-que], vocab: [w.spécialité], note: "A real, known fact: indicative (qu'on trouve)." }
      - { es: "Pour satisfaire toutes les exigences des clients, il faudrait un chef qui ait quatre mains.", en: "To satisfy all the customers' demands, you'd need a chef with four hands.", grammar: [g.subjonctif-relatives], vocab: [w.satisfaire, w.exigence] }
      - { es: "Le chef a reçu sa première toque cette année : c'est le plus jeune cuisinier de la ville qui en ait obtenu une.", en: "The chef got his first toque this year: he's the youngest cook in the city to have won one.", grammar: [g.subjonctif-relatives, g.subjonctif-passe], vocab: [w.toque, w.cuisinier], note: "Here a toque is a rating from a restaurant guide." }
      - { es: "Ce bouchon est unique : c'est le seul que je connaisse qui soit installé dans une cour Renaissance.", en: "This bouchon is unique: it's the only one I know that's set in a Renaissance courtyard.", grammar: [g.subjonctif-relatives], vocab: [w.unique, w.gastronomie] }
    exchanges:
      - q: { es: "Tu connais un bon bouchon près d'ici ?", en: "Do you know a good bouchon near here?" }
        a: { es: "Oui, mais je n'en connais aucun qui soit ouvert le dimanche soir.", en: "Yes, but I don't know any that are open on Sunday evenings." }
        alt: ["Oui, il y en a un rue Mercière.", "Non, je ne connais personne qui puisse te conseiller."]
        grammar: [g.subjonctif-relatives]
        vocab: []
      - q: { es: "Qu'est-ce que vous prendrez en plat principal ?", en: "What will you have for your main course?" }
        a: { es: "Je voudrais un plat qui ne soit pas trop lourd.", en: "I'd like a dish that isn't too heavy." }
        alt: ["L'andouillette, s'il vous plaît.", "Le plat du jour."]
        grammar: [g.subjonctif-relatives]
        vocab: [w.plat-principal]
      - q: { es: "Vous avez un vin qui aille avec les quenelles ?", en: "Do you have a wine that goes with the quenelles?" }
        a: { es: "Bien sûr, le sommelier va vous en conseiller un.", en: "Of course, the wine waiter will recommend one." }
        alt: ["Oui, un blanc de Bourgogne.", "Je vous conseille un blanc de Mâcon."]
        grammar: [g.subjonctif-relatives, g.pronoun-en]
        vocab: [w.sommelier]
      - q: { es: "C'est un bon restaurant ?", en: "Is it a good restaurant?" }
        a: { es: "C'est le meilleur restaurant étoilé que je connaisse.", en: "It's the best starred restaurant I know." }
        alt: ["C'est le meilleur que je connaisse.", "Il a une excellente réputation."]
        grammar: [g.subjonctif-relatives]
        vocab: [w.étoilé, w.réputation]
      - q: { es: "Ton chef est satisfait de toi ?", en: "Is your chef happy with you?" }
        a: { es: "Il est rarement satisfait : c'est le cuisinier le plus exigeant qui soit.", en: "He's rarely satisfied: he's the most demanding cook there is." }
        alt: ["Pas vraiment, il est très exigeant.", "Oui, enfin !"]
        grammar: [g.subjonctif-relatives]
        vocab: [w.satisfait, w.exigeant, w.cuisinier]
    texts:
      - title: "Petite annonce"
        es: ["Bouchon du Vieux-Lyon cherche un cuisinier qui sache préparer les quenelles.", "Nous voulons quelqu'un qui soit disponible le soir et le week-end.", "Expérience exigée."]
        en: ["Bouchon in Vieux-Lyon seeks a cook who knows how to make quenelles.", "We want someone who is available in the evenings and at weekends.", "Experience required."]
        grammar: [g.subjonctif-relatives]
        vocab: [w.cuisinier, w.quenelle]
      - title: "Avis en ligne"
        es: ["C'est le seul bistrot du quartier qui serve encore un plat du jour fait maison.", "Le patron est généreux et le service rapide.", "Il n'y a rien que je puisse critiquer !"]
        en: ["It's the only bistro in the area that still serves a homemade dish of the day.", "The owner is generous and the service quick.", "There's nothing I can criticise!"]
        grammar: [g.subjonctif-relatives]
        vocab: [w.bistrot, w.plat-du-jour]
    spicy:
      - { es: "Je cherche quelqu'un qui sache cuisiner les quenelles… et qui ait envie de les partager avec moi.", en: "I'm looking for someone who can cook quenelles… and who'd like to share them with me.", grammar: [g.subjonctif-relatives], vocab: [w.quenelle] }
      - { es: "Tu es la seule personne que je connaisse qui commande deux desserts sans culpabiliser.", en: "You're the only person I know who orders two desserts without feeling guilty.", grammar: [g.subjonctif-relatives], vocab: [] }
      - { es: "C'est le rendez-vous le plus gastronomique que j'aie jamais eu.", en: "It's the most gastronomic date I've ever had.", grammar: [g.subjonctif-relatives, g.subjonctif-passe], vocab: [w.gastronomique] }
      - { es: "Il n'y a aucun digestif qui me fasse autant d'effet que ton sourire.", en: "There's no digestif that has as much effect on me as your smile.", grammar: [g.subjonctif-relatives], vocab: [w.digestif] }
      - { es: "Je ne trouve aucun traiteur qui puisse livrer le petit-déjeuner au lit… tu es libre demain matin ?", en: "I can't find a caterer who can deliver breakfast in bed… are you free tomorrow morning?", grammar: [g.subjonctif-relatives], vocab: [w.traiteur] }
  - id: b2.u02.l3
    title: J'espère qu'il viendra, je souhaite qu'il vienne
    teach: [g.indicatif-ou-subjonctif]
    tip: "Indicative for facts, subjonctif for ideas: j'espère qu'il viendra but je souhaite qu'il vienne; il est probable qu'il pleuvra but il est possible qu'il pleuve; après que + indicative but avant que + subjonctif."
    vocab: [w.il-semble-que, w.absent, w.présent, w.déguster, w.dégustation, w.savourer, w.saveur, w.épicé, w.fade, w.cru, w.cuit, w.saignant, w.à-point, w.bien-cuit, w.assaisonner, w.culinaire, w.apprécier, w.raffiné, w.gourmand]
    sentences:
      - { es: "J'espère que tu pourras venir à la dégustation.", en: "I hope you'll be able to come to the tasting.", altEs: ["J'espère que tu pourras venir à la dégustation de vins."], grammar: [g.indicatif-ou-subjonctif], vocab: [w.dégustation], error: { wrong: "J'espère que tu puisses venir à la dégustation.", explain: "espérer takes the indicative: j'espère que tu pourras.", grammar: g.indicatif-ou-subjonctif } }
      - { es: "Je souhaite que vous preniez le temps de savourer ce plat.", en: "I'd like you to take the time to savour this dish.", altEs: ["Je voudrais que vous preniez le temps de savourer ce plat."], grammar: [g.indicatif-ou-subjonctif, g.subjonctif-volonte], vocab: [w.savourer] }
      - { es: "Il semble que le chef soit absent ce soir.", en: "It seems the chef is away tonight.", altEs: ["On dirait que le chef est absent ce soir."], grammar: [g.indicatif-ou-subjonctif], vocab: [w.il-semble-que, w.absent], transform: { instruction: "Rewrite with 'il me semble que'", answer: "Il me semble que le chef est absent ce soir.", en: "I think the chef is away tonight." } }
      - { es: "Il est probable que le chef sera présent pour la dégustation.", en: "The chef will probably be there for the tasting.", altEs: ["Le chef sera probablement présent pour la dégustation."], grammar: [g.indicatif-ou-subjonctif], vocab: [w.présent, w.dégustation] }
      - { es: "Je pense que ce plat est trop épicé, mais je ne pense pas qu'il soit fade.", en: "I think this dish is too spicy, but I don't think it's bland.", altEs: ["Je trouve ce plat trop épicé, mais je ne pense pas qu'il soit fade."], grammar: [g.indicatif-ou-subjonctif, g.opinion-mood], vocab: [w.épicé, w.fade] }
      - { es: "Vous voulez votre steak saignant, à point ou bien cuit ? — Saignant, s'il vous plaît.", en: "Would you like your steak rare, medium or well done? — Rare, please.", altEs: ["Votre steak, vous le voulez saignant, à point ou bien cuit ? — Saignant, s'il vous plaît."], grammar: [g.question-words], vocab: [w.saignant, w.à-point, w.bien-cuit] }
      - { es: "Le serveur m'a dit que la viande était cuite, mais je doute qu'elle soit assez cuite.", en: "The waiter told me the meat was cooked, but I doubt it's cooked enough.", grammar: [g.indicatif-ou-subjonctif, g.subjonctif-doute], vocab: [w.cuit] }
      - { es: "Il est rare qu'un bouchon serve du poisson cru.", en: "It's rare for a bouchon to serve raw fish.", altEs: ["C'est rare qu'un bouchon serve du poisson cru."], grammar: [g.indicatif-ou-subjonctif], vocab: [w.cru] }
      - { es: "Après que le chef a assaisonné la sauce, il la goûte.", en: "After the chef has seasoned the sauce, he tastes it.", altEs: ["Une fois que le chef a assaisonné la sauce, il la goûte."], grammar: [g.indicatif-ou-subjonctif], vocab: [w.assaisonner], error: { wrong: "Après que le chef ait assaisonné la sauce, il la goûte.", explain: "In careful French après que takes the indicative: après qu'il a assaisonné.", grammar: g.indicatif-ou-subjonctif } }
      - { es: "Même si tu n'es pas gourmand, tu vas te régaler.", en: "Even if you're not a big eater, you're going to love it.", altEs: ["Même si tu n'es pas gourmande, tu vas te régaler."], grammar: [g.indicatif-ou-subjonctif], vocab: [w.gourmand], transform: { instruction: "Replace 'même si' with 'bien que'", answer: "Bien que tu ne sois pas gourmand, tu vas te régaler.", alt: ["Bien que tu ne sois pas gourmande, tu vas te régaler."], en: "Although you're not a big eater, you're going to love it." } }
      - { es: "Il paraît que le patrimoine culinaire de Lyon est le plus riche de France.", en: "Apparently Lyon's culinary heritage is the richest in France.", grammar: [g.indicatif-ou-subjonctif], vocab: [w.culinaire], note: "il paraît que (hearsay) takes the indicative." }
      - { es: "Dis au serveur qu'il nous apporte la carte des desserts.", en: "Tell the waiter to bring us the dessert menu.", altEs: ["Demande au serveur qu'il nous apporte la carte des desserts."], grammar: [g.indicatif-ou-subjonctif], vocab: [], note: "dire que + subjonctif = tell someone to do something; + indicative = tell someone that…" }
      - { es: "Il est évident que ce poulet de Bresse a plus de saveur qu'un poulet ordinaire.", en: "It's obvious this Bresse chicken has more flavour than an ordinary chicken.", grammar: [g.indicatif-ou-subjonctif], vocab: [w.saveur] }
      - { es: "Je ne dis pas que la cuisine lyonnaise soit légère !", en: "I'm not saying Lyon cooking is light!", altEs: ["Je ne dis pas que la cuisine lyonnaise est légère !"], grammar: [g.indicatif-ou-subjonctif], vocab: [w.lyonnais] }
      - { es: "Le sommelier veut que nous dégustions trois vins avant de choisir.", en: "The wine waiter wants us to taste three wines before choosing.", altEs: ["Le sommelier veut qu'on déguste trois vins avant de choisir."], grammar: [g.subjonctif-volonte, g.apres-avoir-avant-de], vocab: [w.déguster, w.sommelier] }
      - { es: "J'apprécie que tu aies choisi un restaurant si raffiné.", en: "I appreciate you choosing such a refined restaurant.", grammar: [g.indicatif-ou-subjonctif, g.subjonctif-passe], vocab: [w.apprécier, w.raffiné] }
    exchanges:
      - q: { es: "Tu penses que c'est trop épicé pour ma mère ?", en: "Do you think it's too spicy for my mother?" }
        a: { es: "Non, je ne pense pas que ce soit trop épicé.", en: "No, I don't think it's too spicy." }
        alt: ["Non, je pense que ça ira.", "Un peu, peut-être."]
        grammar: [g.indicatif-ou-subjonctif]
        vocab: [w.épicé]
      - q: { es: "Comment voulez-vous votre viande ?", en: "How would you like your meat?" }
        a: { es: "À point, s'il vous plaît.", en: "Medium, please." }
        alt: ["Saignante.", "Bien cuite, s'il vous plaît."]
        grammar: [g.adjective-agreement]
        vocab: [w.à-point, w.saignant, w.bien-cuit]
      - q: { es: "Le chef est là ce soir ?", en: "Is the chef here tonight?" }
        a: { es: "Il semble qu'il soit absent, mais il sera présent demain.", en: "It seems he's away, but he'll be here tomorrow." }
        alt: ["Il me semble qu'il est absent.", "Oui, il est en cuisine."]
        grammar: [g.indicatif-ou-subjonctif]
        vocab: [w.il-semble-que, w.absent, w.présent]
      - q: { es: "Tu crois qu'on aura une table ?", en: "Do you think we'll get a table?" }
        a: { es: "J'espère qu'on en aura une, mais il est possible qu'on attende.", en: "I hope we'll get one, but we may have to wait." }
        alt: ["Je souhaite qu'on en ait une !", "J'espère que oui."]
        grammar: [g.indicatif-ou-subjonctif]
        vocab: []
      - q: { es: "Alors, c'est bon ?", en: "So, is it good?" }
        a: { es: "Délicieux ! Je ne pensais pas que la cuisine lyonnaise soit si raffinée.", en: "Delicious! I didn't think Lyon cooking was so refined." }
        alt: ["Délicieux, je me régale !", "C'est un peu fade, non ?"]
        grammar: [g.indicatif-ou-subjonctif, g.opinion-mood]
        vocab: [w.raffiné]
    texts:
      - title: "Invitation"
        es: ["Nous espérons que vous pourrez venir à notre dégustation de vins samedi.", "Nous souhaitons que chacun puisse découvrir les saveurs du Beaujolais.", "Il est préférable que vous réserviez avant jeudi."]
        en: ["We hope you'll be able to come to our wine tasting on Saturday.", "We'd like everyone to be able to discover the flavours of the Beaujolais.", "It's best to book before Thursday."]
        grammar: [g.indicatif-ou-subjonctif]
        vocab: [w.dégustation, w.saveur]
      - title: "Conseil d'un ami"
        es: ["Même si tu n'aimes pas la viande, viens au bouchon avec nous.", "Il est probable qu'il y aura un plat végétarien.", "Et je doute que tu résistes aux desserts !"]
        en: ["Even if you don't like meat, come to the bouchon with us.", "There'll probably be a vegetarian dish.", "And I doubt you'll resist the desserts!"]
        grammar: [g.indicatif-ou-subjonctif]
        vocab: []
    spicy:
      - { es: "J'espère que tu aimes les surprises, parce que j'ai réservé une table pour deux.", en: "I hope you like surprises, because I've booked a table for two.", grammar: [g.indicatif-ou-subjonctif], vocab: [] }
      - { es: "Je souhaite que tu goûtes mon dessert, mais seulement si tu me laisses goûter le tien.", en: "I'd like you to taste my dessert, but only if you let me taste yours.", grammar: [g.indicatif-ou-subjonctif, g.subjonctif-volonte], vocab: [] }
      - { es: "Il me semble que tu rougis. Ce n'est pas le vin, j'espère ?", en: "I think you're blushing. It's not the wine, I hope?", grammar: [g.indicatif-ou-subjonctif], vocab: [] }
      - { es: "Je ne dis pas que tu sois parfait, mais tu cuisines comme un chef étoilé.", en: "I'm not saying you're perfect, but you cook like a starred chef.", altEs: ["Je ne dis pas que tu sois parfaite, mais tu cuisines comme une cheffe étoilée."], grammar: [g.indicatif-ou-subjonctif], vocab: [w.étoilé] }
      - { es: "Saignant, à point ou bien cuit ? Moi, je suis cuit depuis que tu m'as souri.", en: "Rare, medium or well done? Me, I've been done for since you smiled at me.", altEs: ["Saignant, à point ou bien cuit ? Moi, je suis cuite depuis que tu m'as souri."], grammar: [g.depuis-present], vocab: [w.saignant, w.à-point, w.bien-cuit, w.cuit] }
  - id: b2.u02.l4
    title: Les critiques, soupçons et éloges
    teach: [g.subjonctif-doute, g.indicatif-ou-subjonctif]
    tip: "Watch the pairs: douter que + subjonctif, but se douter que (to suspect) + indicative; soupçonner que + indicative; rien ne prouve que + subjonctif."
    vocab: [w.soupçonner, w.soupçon, w.méfiance, w.se-méfier, w.crédible, w.fiable, w.vérifier, w.prouver, w.preuve, w.éventuel, w.éventuellement, w.convive, w.festin, w.régal, w.se-régaler, w.plaisir, w.généreux, w.avare, w.éloge]
    sentences:
      - { es: "Je soupçonne que ce critique n'a jamais mis les pieds dans ce restaurant.", en: "I suspect this critic has never set foot in this restaurant.", altEs: ["Je soupçonne ce critique de n'avoir jamais mis les pieds dans ce restaurant."], grammar: [g.indicatif-ou-subjonctif], vocab: [w.soupçonner] }
      - { es: "Je doute que cet avis en ligne soit fiable.", en: "I doubt this online review is reliable.", altEs: ["Je doute que ce commentaire en ligne soit fiable."], grammar: [g.subjonctif-doute], vocab: [w.fiable], transform: { instruction: "Make it certain: 'Je suis sûr que…'", answer: "Je suis sûr que cet avis en ligne est fiable.", alt: ["Je suis sûre que cet avis en ligne est fiable."], en: "I'm sure this online review is reliable." } }
      - { es: "Il est peu probable qu'un vrai critique écrive un éloge aussi exagéré.", en: "It's unlikely a real critic would write such over-the-top praise.", grammar: [g.subjonctif-doute], vocab: [w.éloge, w.il-est-peu-probable-que] }
      - { es: "Je me doutais que tu choisirais la cervelle de canut.", en: "I suspected you'd choose the cervelle de canut.", grammar: [g.indicatif-ou-subjonctif, g.concordance-des-temps], vocab: [w.cervelle], transform: { instruction: "Use 'douter' instead of 'se douter' (and change the mood)", answer: "Je doutais que tu choisisses la cervelle de canut.", en: "I doubted you'd choose the cervelle de canut." } }
      - { es: "Rien ne prouve que le chef ait copié cette recette.", en: "Nothing proves the chef copied this recipe.", grammar: [g.subjonctif-doute, g.subjonctif-passe], vocab: [w.prouver] }
      - { es: "Tu as des preuves qu'il a menti ? — Non, juste des soupçons.", en: "Do you have proof that he lied? — No, just suspicions.", altEs: ["As-tu des preuves qu'il a menti ? — Non, juste des soupçons.", "Tu as des preuves qu'il a menti ? — Non, seulement des soupçons."], grammar: [g.indicatif-ou-subjonctif], vocab: [w.preuve, w.soupçon] }
      - { es: "Méfie-toi des restaurants qui ont un menu en dix langues.", en: "Be wary of restaurants that have a menu in ten languages.", grammar: [g.imperative, g.relative-qui-que], vocab: [w.se-méfier] }
      - { es: "Sa méfiance envers les guides gastronomiques est normale, bien qu'un peu exagérée.", en: "His mistrust of food guides is normal, if a little exaggerated.", grammar: [g.subjonctif-conjonctions], vocab: [w.méfiance, w.gastronomique] }
      - { es: "Il faut que tu vérifies l'addition : il me semble qu'il y a une erreur.", en: "You need to check the bill: I think there's a mistake.", altEs: ["Tu devrais vérifier l'addition : il me semble qu'il y a une erreur."], grammar: [g.indicatif-ou-subjonctif, g.subjonctif-necessite], vocab: [w.vérifier] }
      - { es: "Ce témoignage n'est pas crédible : il est impossible que quelqu'un ait mangé douze quenelles.", en: "That account isn't credible: it's impossible for anyone to have eaten twelve quenelles.", grammar: [g.subjonctif-doute, g.subjonctif-passe], vocab: [w.crédible], error: { wrong: "Ce témoignage n'est pas crédible : il est impossible que quelqu'un a mangé douze quenelles.", explain: "il est impossible que takes the subjonctif: qu'il ait mangé.", grammar: g.subjonctif-doute } }
      - { es: "Nous étions douze convives autour de la table, et c'était un vrai festin.", en: "There were twelve of us at the table, and it was a real feast.", grammar: [g.imparfait-uses], vocab: [w.convive, w.festin] }
      - { es: "Merci pour ce repas, c'était un régal ! — Je suis ravi que vous vous soyez régalés.", en: "Thank you for the meal, it was a treat! — I'm delighted you enjoyed it.", altEs: ["Merci pour ce repas, c'était un régal ! — Je suis ravie que vous vous soyez régalés."], grammar: [g.subjonctif-passe, g.subjonctif-emotion], vocab: [w.régal, w.se-régaler] }
      - { es: "Le patron est généreux, mais sa femme est plutôt avare : je doute qu'elle nous offre le café.", en: "The owner is generous, but his wife is rather stingy: I doubt she'll treat us to coffee.", grammar: [g.subjonctif-doute], vocab: [w.généreux, w.avare] }
      - { es: "Je ne suis pas sûr que la critique ait raison, mais j'ai mangé avec plaisir.", en: "I'm not sure the critic is right, but I enjoyed my meal.", altEs: ["Je ne suis pas sûre que la critique ait raison, mais j'ai mangé avec plaisir."], grammar: [g.subjonctif-doute], vocab: [w.plaisir] }
      - { es: "Nous pourrons éventuellement changer de table, si vous le souhaitez.", en: "We may be able to change tables, if you wish.", altEs: ["On pourra éventuellement changer de table, si vous le souhaitez."], grammar: [g.futur-simple-forms], vocab: [w.éventuellement], note: "éventuellement = possibly, if need be (not 'eventually')." }
      - { es: "En cas de retard éventuel, prévenez-nous : il se peut que nous donnions votre table à quelqu'un d'autre.", en: "In case of any delay, let us know: we may give your table to someone else.", grammar: [g.subjonctif-doute], vocab: [w.éventuel, w.il-se-peut-que] }
    exchanges:
      - q: { es: "Tu as lu la critique dans le journal ?", en: "Did you read the review in the paper?" }
        a: { es: "Oui, mais je doute que le journaliste soit vraiment venu.", en: "Yes, but I doubt the journalist really came." }
        alt: ["Oui, c'est un vrai éloge.", "Non, je me méfie des critiques."]
        grammar: [g.subjonctif-doute, g.subjonctif-passe]
        vocab: [w.éloge, w.se-méfier]
      - q: { es: "Cet avis est fiable, à ton avis ?", en: "Do you think this review is reliable?" }
        a: { es: "Je ne pense pas : rien ne prouve qu'il ait mangé ici.", en: "I don't think so: nothing proves he ate here." }
        alt: ["Je ne crois pas qu'il soit fiable.", "Oui, je le trouve crédible."]
        grammar: [g.subjonctif-doute]
        vocab: [w.fiable, w.prouver, w.crédible]
      - q: { es: "Alors, ce repas ?", en: "So, how was the meal?" }
        a: { es: "Un régal ! Je me suis régalé du début à la fin.", en: "A treat! I enjoyed it from start to finish." }
        alt: ["C'était un vrai festin.", "Délicieux, merci !"]
        grammar: [g.pronominal-passe-compose]
        vocab: [w.régal, w.se-régaler, w.festin]
      - q: { es: "Le patron va nous offrir le café ?", en: "Is the owner going to treat us to coffee?" }
        a: { es: "Ça m'étonnerait : il est plutôt avare.", en: "I'd be surprised: he's rather stingy." }
        alt: ["Je doute qu'il nous l'offre.", "Peut-être, il est très généreux."]
        grammar: [g.conditionnel-present]
        vocab: [w.avare, w.généreux]
      - q: { es: "On peut changer de table ?", en: "Can we change tables?" }
        a: { es: "Éventuellement, mais il se peut qu'il faille attendre un peu.", en: "Possibly, but you may have to wait a little." }
        alt: ["Oui, bien sûr.", "Je vais vérifier."]
        grammar: [g.subjonctif-doute]
        vocab: [w.éventuellement, w.vérifier]
    texts:
      - title: "Critique gastronomique"
        es: ["Douze convives, des nappes à carreaux et un patron généreux.", "Bien que la salle soit bruyante, le repas a été un régal.", "Il est rare qu'un bouchon mérite autant d'éloges."]
        en: ["Twelve diners, checked tablecloths and a generous owner.", "Although the dining room is noisy, the meal was a treat.", "It's rare for a bouchon to deserve so much praise."]
        grammar: [g.indicatif-ou-subjonctif]
        vocab: [w.convive, w.généreux, w.régal, w.éloge]
      - title: "Message de Julie"
        es: ["Je me méfie de ce restaurant : il n'a que des avis parfaits.", "Je soupçonne le patron de les écrire lui-même !", "Vérifions sur un site plus fiable avant de réserver."]
        en: ["I don't trust this restaurant: it has nothing but perfect reviews.", "I suspect the owner of writing them himself!", "Let's check on a more reliable site before we book."]
        grammar: [g.indicatif-ou-subjonctif]
        vocab: [w.se-méfier, w.soupçonner, w.vérifier, w.fiable]
    spicy:
      - { es: "Je soupçonne que tu m'as invitée pour finir mon dessert.", en: "I suspect you invited me so you could finish my dessert.", altEs: ["Je soupçonne que tu m'as invité pour finir mon dessert."], grammar: [g.indicatif-ou-subjonctif], vocab: [w.soupçonner] }
      - { es: "Je n'ai aucune preuve, mais je soupçonne que tu as réservé cette table pour être assis à côté de moi.", en: "I have no proof, but I suspect you booked this table so you could sit next to me.", altEs: ["Je n'ai aucune preuve, mais je soupçonne que tu as réservé cette table pour être assise à côté de moi."], grammar: [g.indicatif-ou-subjonctif], vocab: [w.preuve, w.soupçonner] }
      - { es: "Méfie-toi : après trois quenelles, je deviens très tendre.", en: "Watch out: after three quenelles, I get very affectionate.", grammar: [g.imperative], vocab: [w.se-méfier] }
      - { es: "Ce soir, tu es mon convive préféré, et le dessert, c'est moi qui l'offre.", en: "Tonight you're my favourite guest, and dessert is on me.", altEs: ["Ce soir, tu es ma convive préférée, et le dessert, c'est moi qui l'offre."], grammar: [g.ce-qui-c-est], vocab: [w.convive] }
      - { es: "Il est impossible que tu sois aussi charmant sans le faire exprès.", en: "There's no way you're that charming without doing it on purpose.", altEs: ["Il est impossible que tu sois aussi charmante sans le faire exprès."], grammar: [g.subjonctif-doute], vocab: [] }
dialogues:
  - id: b2.u02.d1
    title: Au bouchon
    context: "Inès and Thomas have dinner in a bouchon in Vieux-Lyon. The waiter makes some suggestions."
    lines:
      - { speaker: Le serveur, es: "Bonsoir ! Vous avez réservé ?", en: "Good evening! Have you booked?" }
      - { speaker: Inès, es: "Oui, au nom de Martin. Une table pour deux.", en: "Yes, under the name Martin. A table for two." }
      - { speaker: Le serveur, es: "Parfait. Je vous conseille le plat du jour : des quenelles de brochet. Mais je doute que vous ayez encore faim après !", en: "Perfect. I recommend the dish of the day: pike quenelles. But I doubt you'll still be hungry afterwards!" }
      - { speaker: Thomas, es: "Moi, je cherche un plat qui soit vraiment typique. Qu'est-ce que vous avez ?", en: "I'm looking for a dish that's really typical. What have you got?" }
      - { speaker: Le serveur, es: "L'andouillette, monsieur. C'est la spécialité la plus lyonnaise qui soit.", en: "Andouillette, sir. It's the most Lyonnais speciality there is." }
      - { speaker: Thomas, es: "Hum… je ne suis pas sûr que ce soit pour moi.", en: "Hmm… I'm not sure it's for me." }
      - { speaker: Inès, es: "Il paraît qu'elle est excellente ici. J'espère que tu oseras la goûter !", en: "Apparently it's excellent here. I hope you'll dare to try it!" }
      - { speaker: Thomas, es: "D'accord, mais il se peut que je te la laisse.", en: "All right, but I might leave it to you." }
      - { speaker: Le serveur, es: "Et pour le vin, un pot de beaujolais ?", en: "And for the wine, a pot of Beaujolais?" }
      - { speaker: Inès, es: "Volontiers. Et en dessert, une tarte aux pralines, à moins qu'il n'y en ait plus.", en: "Yes, please. And for dessert, a praline tart, unless there's none left." }
      - { speaker: Le serveur, es: "Il est peu probable qu'il n'y en ait plus : le chef en fait tous les matins.", en: "It's unlikely there's none left: the chef makes them every morning." }
    questions:
      - { q: "Que propose le serveur comme plat du jour ?", options: ["De l'andouillette", "Des quenelles de brochet", "De la cervelle de canut"], answer: 1, explain: "« Je vous conseille le plat du jour : des quenelles de brochet. »" }
      - { q: "Que pense Thomas de l'andouillette ?", options: ["Il l'adore", "Il n'est pas sûr que ce soit pour lui", "Il en a déjà mangé hier"], answer: 1, explain: "« Je ne suis pas sûr que ce soit pour moi » (subjonctif after a negative of certainty)." }
      - { q: "Que souhaite Inès ?", options: ["Que Thomas goûte l'andouillette", "Partir avant le dessert", "Changer de table"], answer: 0, explain: "« J'espère que tu oseras la goûter ! »" }
      - { q: "Pourquoi est-il peu probable qu'il n'y ait plus de tarte ?", options: ["Parce que personne ne l'aime", "Parce que le chef en fait tous les matins", "Parce qu'elle est trop chère"], answer: 1, explain: "« le chef en fait tous les matins »." }
writing:
  - task: "Write a review of a Lyon bouchon for a food website: the dishes, the atmosphere, and why it is the best you know (le meilleur… que je connaisse, le seul… qui soit…)."
    min: 80
    max: 150
    use: [w.quenelle, w.spécialité, w.plat-du-jour, w.réputation, w.lyonnais]
    useAtLeast: 3
    grammar: [g.subjonctif-relatives]
    expect:
      - { pattern: "\\b(meilleure?s?|seule?s?|premi[eè]re?|derni[eè]re?|unique|plus [a-zàâçéèêëîïôûùœ]+)\\b[^.!?]{0,30}\\b(que|qui|qu['’])\\s?(je |j['’]|on |nous |vous |tu )?(connaisse|connaissions|aie|ayons|puisse|puissions|sois|soit|fasse|soient|serve|propose)\\b", hint: "After le meilleur / le seul…, use the subjonctif: le meilleur bouchon que je connaisse…" }
    model: { es: "Chez Marie est le meilleur bouchon que je connaisse à Lyon. La salle est petite, avec des nappes à carreaux rouges et des photos anciennes sur les murs. Le plat du jour change chaque semaine, mais la spécialité de la maison, ce sont les quenelles de brochet. C'est le seul restaurant de la ville qui serve encore un vrai tablier de sapeur. Le service est rapide et le patron est très accueillant. Bien sûr, la cuisine lyonnaise est copieuse : prévoyez une longue promenade après le repas ! Ce bouchon mérite vraiment sa réputation.", en: "Chez Marie is the best bouchon I know in Lyon. The dining room is small, with red checked tablecloths and old photos on the walls. The dish of the day changes every week, but the house speciality is pike quenelles. It's the only restaurant in town that still serves a real tablier de sapeur. The service is quick and the owner is very welcoming. Of course, Lyon cooking is hearty: plan a long walk after the meal! This bouchon really deserves its reputation." }
  - task: "Your friend claims he can eat an enormous Lyon meal. Reply, expressing doubt, possibility and certainty with the right mood (je doute que…, il est possible que…, je suis sûr(e) que…)."
    es: "Ce soir, je vais manger une salade lyonnaise, des quenelles, une andouillette et une tarte aux pralines !"
    min: 80
    max: 150
    use: [w.douter, w.il-est-peu-probable-que, w.probablement, w.andouillette, w.persuadé]
    useAtLeast: 3
