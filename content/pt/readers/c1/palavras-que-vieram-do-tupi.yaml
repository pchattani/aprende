id: r.c1.palavras-que-vieram-do-tupi
level: c1
title: "Artigo acadêmico: as palavras que vieram do tupi"
kind: text
intro: "The abstract and opening sections of an invented academic article, of the kind written for a conference in Macapá, on Tupi words in Brazilian Portuguese. It models academic register: the abstract (resumo) and keywords, the impersonal se and the first-person plural of modesty (analisamos, propomos), hedging (parece, tudo indica que) and the explicit signposting of a paper's structure."
allow: [fauna, flora, paraná-mirim, mirim, -açu, -guaçu, -mirim, tupi, tupinambá, nheengatu, macapá, amapá, amazônia, anchieta, josé, pombal, marquês, gabriel, cachoeira, ibirapuera, itaquera, paraná, pindamonhangaba, guanabara, tijuca, pernambuco, piauí, iguaçu]
paragraphs:
  - { es: "RESUMO. Este artigo analisa a presença de palavras de origem tupi no português falado no Brasil, com ênfase nos campos da fauna, da flora, da alimentação e da toponímia. A partir de um levantamento em dicionários e em conversas gravadas em comunidades ribeirinhas do Amapá, propomos que a influência tupi é bem maior do que costuma ser reconhecida no ensino da língua. Os resultados indicam que, embora a maioria dessas palavras pertença a vocabulários específicos, várias delas fazem parte do uso cotidiano de todos os brasileiros, inclusive daqueles que desconhecem a sua origem. Palavras-chave: tupi; empréstimo linguístico; português brasileiro; Amazônia.", en: "ABSTRACT. This article analyses the presence of words of Tupi origin in the Portuguese spoken in Brazil, with an emphasis on the fields of fauna, flora, food and place names. On the basis of a survey of dictionaries and of conversations recorded in riverside communities in Amapá, we propose that Tupi influence is far greater than is usually acknowledged in language teaching. The results indicate that, although most of these words belong to specialised vocabularies, several of them are part of the everyday usage of all Brazilians, including those who are unaware of their origin. Keywords: Tupi; linguistic borrowing; Brazilian Portuguese; Amazonia." }
  - { es: "1. INTRODUÇÃO. Quando os portugueses chegaram ao litoral do que viria a ser o Brasil, encontraram povos que falavam línguas do tronco tupi, entre as quais se destacava o tupinambá. Para se comunicar com esses povos, colonos e missionários aprenderam a língua e, com o tempo, desenvolveram a partir dela uma língua geral, usada por indígenas, portugueses, africanos e mestiços. O padre José de Anchieta chegou a publicar, em 1595, uma gramática dessa língua, a chamada “língua mais usada na costa do Brasil”.", en: "1. INTRODUCTION. When the Portuguese arrived on the coast of what would become Brazil, they found peoples who spoke languages of the Tupi family, among which Tupinambá stood out. To communicate with these peoples, settlers and missionaries learned the language and, over time, developed from it a lingua franca used by Indigenous people, Portuguese, Africans and people of mixed descent. Father José de Anchieta even published, in 1595, a grammar of this language, the so-called 'language most used on the coast of Brazil'." }
  - { es: "Durante quase dois séculos, em grande parte do território, a língua geral foi mais falada do que o próprio português. Essa situação só mudou em meados do século XVIII, quando o Marquês de Pombal proibiu o seu uso e tornou obrigatório o ensino do português. Ainda assim, uma variedade dessa língua, o nheengatu, sobrevive até hoje na Amazônia: em São Gabriel da Cachoeira, no Amazonas, ela é inclusive uma das línguas oficiais do município, ao lado do português.", en: "For almost two centuries, in much of the territory, the lingua franca was spoken more than Portuguese itself. This situation only changed in the mid-eighteenth century, when the Marquis of Pombal banned its use and made the teaching of Portuguese compulsory. Even so, a variety of this language, Nheengatu, survives to this day in the Amazon: in São Gabriel da Cachoeira, in Amazonas state, it is even one of the official languages of the municipality, alongside Portuguese." }
  - { es: "2. OBJETIVOS E MÉTODO. O objetivo deste trabalho é duplo. Em primeiro lugar, pretende-se descrever quais áreas do vocabulário receberam mais palavras tupis; em segundo lugar, busca-se verificar até que ponto os falantes reconhecem essas palavras como indígenas. Para tanto, foram consultados três dicionários de referência e realizadas entrevistas com quarenta moradores de comunidades às margens do rio Amazonas, no Amapá, entre 2022 e 2024.", en: "2. AIMS AND METHOD. The aim of this work is twofold. Firstly, it seeks to describe which areas of the vocabulary received the most Tupi words; secondly, it seeks to determine to what extent speakers recognise these words as Indigenous. To that end, three reference dictionaries were consulted and interviews were carried out with forty residents of communities on the banks of the Amazon in Amapá between 2022 and 2024." }
  - { es: "3. RESULTADOS PRELIMINARES. Como seria de esperar, a maior concentração de palavras tupis está nos nomes de animais e plantas que os europeus não conheciam: jacaré, tatu, piranha, sabiá, capivara, mandioca, abacaxi, caju, maracujá, jabuticaba. Na alimentação, termos como tapioca, pipoca e mingau são de uso nacional. É na toponímia, porém, que a herança se torna mais visível. Paraná, Pernambuco, Piauí, Iguaçu, Tijuca, Ipanema e Ibirapuera são apenas alguns dos milhares de nomes de lugar que vêm do tupi, muitos deles descrevendo rios, pedras e plantas da paisagem.", en: "3. PRELIMINARY RESULTS. As might be expected, the greatest concentration of Tupi words is in the names of animals and plants unknown to Europeans: jacaré, tatu, piranha, sabiá, capivara, mandioca, abacaxi, caju, maracujá, jabuticaba. In food, terms such as tapioca, pipoca and mingau are in nationwide use. It is in place names, however, that the heritage becomes most visible. Paraná, Pernambuco, Piauí, Iguaçu, Tijuca, Ipanema and Ibirapuera are just a few of the thousands of place names that come from Tupi, many of them describing the rivers, rocks and plants of the landscape." }
  - { es: "Cabe lembrar, ainda, que alguns elementos tupis continuam produtivos na formação de palavras. O sufixo -açu (ou -guaçu), que significa “grande”, e o sufixo -mirim, que significa “pequeno”, aparecem em centenas de nomes: Iguaçu é, literalmente, “água grande”, e não são raros os rios chamados Paraná-Mirim, isto é, “rio pequeno”. Na fala informal, aliás, ainda se ouve “mirim” para designar categorias infantis, como em “time mirim” ou “escritor mirim”.", en: "It should also be remembered that some Tupi elements are still productive in word formation. The suffix -açu (or -guaçu), meaning 'big', and the suffix -mirim, meaning 'small', appear in hundreds of names: Iguaçu is literally 'big water', and rivers called Paraná-Mirim, that is, 'small river', are not rare. In informal speech, incidentally, mirim is still heard to designate children's categories, as in time mirim (junior team) or escritor mirim (child writer)." }
  - { es: "Mais surpreendente é a presença do tupi em expressões do dia a dia. Quando um brasileiro diz que está “de tocaia”, que alguém é “pereba” no futebol ou que vai “cutucar” um amigo, está, sem saber, usando palavras de origem indígena. Nas entrevistas realizadas no Amapá, a maior parte dos participantes identificou corretamente a origem de nomes de frutas e peixes, mas apenas uma minoria reconheceu como tupis palavras como “cutucar” ou “peteca”. Tudo indica, portanto, que quanto mais comum é a palavra, menos o falante percebe a sua origem.", en: "More surprising is the presence of Tupi in everyday expressions. When a Brazilian says they are 'lying in wait' (de tocaia), that someone is a 'pereba' (a poor player) at football or that they are going to 'poke' (cutucar) a friend, they are unwittingly using words of Indigenous origin. In the interviews carried out in Amapá, most participants correctly identified the origin of the names of fruits and fish, but only a minority recognised words like cutucar or peteca as Tupi. Everything suggests, therefore, that the more common the word, the less the speaker notices its origin." }
  - { es: "4. CONSIDERAÇÕES PARCIAIS. Os dados aqui apresentados ainda são parciais e não permitem generalizações definitivas. Parece claro, no entanto, que a contribuição indígena ao português brasileiro não se limita a uma lista de palavras exóticas, mas faz parte da própria identidade da língua. Nas próximas seções, discutiremos as consequências desses resultados para o ensino e proporemos atividades que permitam aos alunos descobrir, nos nomes da sua própria cidade, a língua que veio antes.", en: "4. PARTIAL CONCLUSIONS. The data presented here are still partial and do not allow definitive generalisations. It seems clear, however, that the Indigenous contribution to Brazilian Portuguese is not limited to a list of exotic words but is part of the very identity of the language. In the following sections we will discuss the consequences of these results for teaching and propose activities that allow students to discover, in the names of their own town, the language that came before." }
questions:
  - { q: "Qual é a tese principal apresentada no resumo?", options: ["Que o tupi desapareceu completamente", "Que o português veio do tupi", "Que a influência do tupi é maior do que se costuma reconhecer no ensino", "Que só os moradores do Amapá usam palavras tupis"], answer: 2, explain: "'propomos que a influência tupi é bem maior do que costuma ser reconhecida no ensino da língua'." }
  - { q: "O que era a “língua geral”?", options: ["Uma língua de base tupi usada por indígenas, colonos, africanos e mestiços", "O português de Portugal", "A língua dos missionários espanhóis", "O latim das igrejas"], answer: 0, explain: "It developed from Tupinambá and was spoken more widely than Portuguese for almost two centuries." }
  - { q: "O que aconteceu em meados do século XVIII?", options: ["Anchieta publicou uma gramática", "O Marquês de Pombal proibiu a língua geral e impôs o ensino do português", "O nheengatu virou língua oficial do Brasil", "Os portugueses chegaram ao Brasil"], answer: 1, explain: "Pombal's policy ended the dominance of the lingua franca, though Nheengatu survives in the Amazon." }
  - { q: "Em que área a herança tupi é mais visível, segundo o artigo?", options: ["Nos verbos", "Na gramática", "Na toponímia, os nomes de lugares", "Nos números"], answer: 2, explain: "Section 3: 'É na toponímia, porém, que a herança se torna mais visível.'" }
  - { q: "Que conclusão as entrevistas sugerem?", options: ["Todos conhecem a origem de todas as palavras", "Quanto mais comum é a palavra, menos o falante percebe a sua origem", "Ninguém reconhece nomes de frutas", "Os jovens falam tupi"], answer: 1, explain: "Participants knew that fruit and fish names were Tupi, but rarely recognised everyday words like cutucar or peteca." }
  - { q: "Que expressão mostra a atenuação (hedging) típica do texto acadêmico?", options: ["“Tudo indica, portanto, que…”", "“Quando os portugueses chegaram…”", "“Palavras-chave”", "“Em São Gabriel da Cachoeira”"], answer: 0, explain: "Tudo indica que, parece claro and os dados ainda são parciais are hedges: academic writers avoid claiming more than their data show." }
