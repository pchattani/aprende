id: r.c1.biarritz-entretien-avec-une-surfeuse
level: c1
title: "Biarritz : entretien avec une monitrice de surf"
kind: dialogue
intro: "A local magazine interviews a (fictional) surf instructor from the Basque coast about the history of surfing in Biarritz, the crowds of summer and the ocean's dangers. Notice the journalist's nominalised, headline-like style (l'arrivée du surf, la sécurité des baigneurs) and how the instructor answers in a looser spoken register."
allow: [image, tensions, agressifs, biarritz, maïder, etxeberria, viertel, peter, californie, eugénie, napoléon, iii, hollywood, surfrider, euskadi, basque, basques, surf, surfeuse, surfeurs, surfeur, surfer, planche, planches, monitrice, moniteurs, anglet, hossegor, ok]
paragraphs:
  - { es: "Journaliste : Maïder Etxeberria, vous êtes née à Biarritz, vous enseignez le surf depuis quinze ans sur la plage de la Côte des Basques. Biarritz se présente comme le berceau du surf européen. C'est une légende ou une réalité ?", en: "Journalist: Maïder Etxeberria, you were born in Biarritz and you've been teaching surfing for fifteen years on the Côte des Basques beach. Biarritz calls itself the cradle of European surfing. Is that a legend or a reality?" }
  - { es: "Maïder Etxeberria : Un peu des deux, comme toujours ! L'histoire qu'on raconte ici, c'est qu'en 1957 un scénariste américain, Peter Viertel, est venu dans la région pour le tournage d'un film. Il a vu les vagues de la Côte des Basques et il s'est fait envoyer une planche de Californie. Les jeunes du coin l'ont regardé, ils ont essayé, et voilà. Bon, il y avait sans doute eu des essais avant, mais c'est à partir de là que le surf s'est vraiment installé.", en: "Maïder Etxeberria: A bit of both, as always! The story people tell here is that in 1957 an American screenwriter, Peter Viertel, came to the region to shoot a film. He saw the waves at the Côte des Basques and had a board sent over from California. The local youngsters watched him, they had a go, and there you are. Well, there had probably been attempts before, but it's from then on that surfing really took hold." }
  - { es: "Journaliste : À l'époque, Biarritz était surtout connue pour son élégance. Napoléon III et l'impératrice Eugénie y avaient fait construire une villa, qui est devenue un palace. L'arrivée de ces jeunes en maillot, planche sous le bras, n'a pas choqué la bonne société ?", en: "Journalist: At the time, Biarritz was mainly known for its elegance. Napoleon III and the Empress Eugénie had had a villa built there, which became a luxury hotel. Didn't the arrival of these young people in swimsuits, boards under their arms, shock polite society?" }
  - { es: "Maïder Etxeberria : Si, au début ! Mon grand-père racontait qu'on les prenait pour des fous. Mais très vite, la ville a compris que c'était une chance. Aujourd'hui, le surf fait partie de notre identité, au même titre que la pelote basque. Il y a des compétitions internationales, des écoles partout, des magasins… Et puis le surf a changé l'image de la ville : on est passé de la station des rois à la station des jeunes.", en: "Maïder Etxeberria: Yes, at first! My grandfather used to say people took them for madmen. But very soon the town realised it was an opportunity. Today surfing is part of our identity, just like Basque pelota. There are international competitions, schools everywhere, shops… And surfing changed the town's image: it went from being the resort of kings to the resort of the young." }
  - { es: "Journaliste : Justement, chaque été, les journaux titrent « Biarritz : record d'affluence sur les plages ». La multiplication des écoles et des pratiquants ne pose-t-elle pas de problème ?", en: "Journalist: Precisely: every summer the papers run headlines like 'Biarritz: record crowds on the beaches'. Doesn't the growing number of schools and surfers cause problems?" }
  - { es: "Maïder Etxeberria : Ah ben, si, clairement. En août, il y a des jours où l'on compte plus de planches que de vagues ! Les débutants ne connaissent pas les règles de priorité, ils se mettent devant ceux qui sont déjà sur la vague, et ça crée des tensions. Certains locaux deviennent un peu agressifs. Moi, je dis toujours à mes élèves : l'océan n'appartient à personne, mais il y a des règles, et le respect, ça s'apprend.", en: "Maïder Etxeberria: Oh well, yes, clearly. In August there are days when you can count more boards than waves! Beginners don't know the priority rules, they get in front of people who are already on the wave, and that creates tension. Some locals get a bit aggressive. I always tell my students: the ocean belongs to nobody, but there are rules, and respect is something you learn." }
  - { es: "Journaliste : Quelles sont ces règles, pour ceux qui voudraient se lancer ?", en: "Journalist: What are these rules, for those who'd like to give it a try?" }
  - { es: "Maïder Etxeberria : La plus importante : le surfeur le plus proche du point où la vague se forme a la priorité. On ne lui « vole » pas sa vague. Ensuite, on ne lâche jamais sa planche, parce qu'elle peut blesser quelqu'un derrière soi. Et surtout, on prend des cours ! Pas seulement pour apprendre à se lever sur la planche, mais pour apprendre à lire l'océan : les courants, les marées, les endroits dangereux. Chaque année, des baigneurs se font surprendre par des courants qui les emportent vers le large.", en: "Maïder Etxeberria: The most important one: the surfer closest to the point where the wave breaks has priority. You don't 'steal' their wave. Next, you never let go of your board, because it can injure someone behind you. And above all, you take lessons! Not just to learn to stand up on the board, but to learn to read the ocean: the currents, the tides, the dangerous spots. Every year swimmers get caught by currents that carry them out to sea." }
  - { es: "Journaliste : On parle aussi beaucoup de la pollution de l'océan. Est-ce que les surfeurs ont un rôle à jouer ?", en: "Journalist: There's also a lot of talk about ocean pollution. Do surfers have a role to play?" }
  - { es: "Maïder Etxeberria : Évidemment ! Nous sommes les premiers à voir les déchets, les plastiques, l'eau sale après les orages. C'est d'ailleurs à Biarritz qu'a été créée, en 1990, la branche européenne de Surfrider, une association de surfeurs qui se bat pour la protection des océans. Avec mes élèves, on ramasse les déchets sur la plage une fois par semaine. Ça ne sauve pas la planète, mais ça change le regard des gens.", en: "Maïder Etxeberria: Of course! We're the first to see the rubbish, the plastic, the dirty water after storms. In fact it was in Biarritz that the European branch of Surfrider, an association of surfers fighting to protect the oceans, was founded in 1990. With my students we pick up rubbish on the beach once a week. It doesn't save the planet, but it changes the way people see things." }
  - { es: "Journaliste : Un dernier conseil pour nos lecteurs ?", en: "Journalist: One last piece of advice for our readers?" }
  - { es: "Maïder Etxeberria : Venez hors saison ! En octobre, les vagues sont belles, l'eau est encore bonne et il y a de la place pour tout le monde. Et n'ayez pas peur de tomber : en surf, on passe beaucoup plus de temps dans l'eau que debout sur la planche. C'est ça qui est beau, d'ailleurs. On apprend l'humilité.", en: "Maïder Etxeberria: Come out of season! In October the waves are beautiful, the water is still warm and there's room for everyone. And don't be afraid of falling: in surfing you spend much more time in the water than standing on the board. That's what's beautiful about it, in fact. You learn humility." }
questions:
  - { q: "Selon l'histoire racontée à Biarritz, comment le surf y est-il arrivé ?", options: ["Grâce à l'impératrice Eugénie", "Grâce à un scénariste américain venu pour un film en 1957", "Grâce à des pêcheurs basques"], answer: 1, explain: "Peter Viertel came for a film shoot in 1957, saw the waves and «s'est fait envoyer une planche de Californie»." }
  - { q: "Comment le surf a-t-il changé l'image de Biarritz ?", options: ["La ville est devenue plus chère", "Elle est passée de « station des rois » à « station des jeunes »", "Elle a perdu ses touristes"], answer: 1, explain: "«On est passé de la station des rois à la station des jeunes.»" }
  - { q: "Quelle est la règle de priorité la plus importante ?", options: ["Le surfeur le plus âgé passe en premier", "Le surfeur le plus proche du point où se forme la vague a la priorité", "Chacun prend la vague qu'il veut"], answer: 1, explain: "«Le surfeur le plus proche du point où la vague se forme a la priorité.»" }
  - { q: "Pourquoi Maïder conseille-t-elle de prendre des cours ?", options: ["Seulement pour apprendre à se lever sur la planche", "Aussi pour apprendre à « lire l'océan » : courants, marées, endroits dangereux", "Parce que c'est obligatoire"], answer: 1, explain: "«Pas seulement pour apprendre à se lever… mais pour apprendre à lire l'océan.»" }
  - { q: "Dans la question « La multiplication des écoles ne pose-t-elle pas de problème ? », quel procédé utilise la journaliste ?", options: ["La nominalisation (la multiplication des écoles) et l'inversion", "Le passé simple", "Le subjonctif"], answer: 0, explain: "Instead of «Les écoles se multiplient», she uses a noun (la multiplication) — typical of written and journalistic French — plus a formal inversion (ne pose-t-elle pas)." }
