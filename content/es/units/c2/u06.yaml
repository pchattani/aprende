id: c2.u06
title: Lenguaje especializado
lessons:
  - id: c2.u06.l1
    title: Registro científico y médico
    teach: [g.scientific-register]
    vocab: [w.grupo, w.diagnostico, w.diagnosticar, w.tratamiento, w.dosis, w.infarto, w.analitica, w.dar-de-alta, w.dar-de-baja, w.leve, w.cronico, w.celula, w.ensayo-clinico, w.quirofano, w.cirugia, w.unidad, w.inflamacion, w.gen, w.cardiologo, w.recetar, w.cirujano, w.hipertension, w.tomar-la-tension, w.efecto-secundario]
    tip: "Scientific Spanish is impersonal (se observa, los datos sugieren), nominal and precise: Greek and Latin roots, invariable -is plurals (los análisis, las crisis), SI units with a space (20 °C, un 15 %). With patients the register softens: tensión alta, molestia, dar de alta."
    sentences:
      - { es: "No se observaron diferencias estadísticamente significativas entre ambos grupos.", en: "No statistically significant differences were observed between the two groups.", altEs: ["No se observó ninguna diferencia estadísticamente significativa entre los dos grupos."], grammar: [g.scientific-register, g.se-passive], vocab: [w.observar, w.estadisticamente, w.significativo, w.grupo] }
      - { es: "Los datos sugieren que el tratamiento reduce la inflamación en pacientes con enfermedad crónica.", en: "The data suggest that the treatment reduces inflammation in patients with chronic disease.", altEn: ["The data indicate that the treatment reduces inflammation in patients with a chronic illness."], grammar: [g.scientific-register], vocab: [w.dato, w.sugerir, w.tratamiento, w.inflamacion, w.paciente, w.cronico] }
      - { es: "El paciente fue dado de alta a los tres días, sin complicaciones.", en: "The patient was discharged after three days, without complications.", altEs: ["Al paciente le dieron el alta a los tres días, sin complicaciones."], grammar: [g.scientific-register, g.passive-ser], vocab: [w.dar-de-alta, w.paciente] }
      - { es: "¿Le han tomado la tensión? — Sí, y la tengo alta: el médico habla de hipertensión.", en: "Have they taken your blood pressure? — Yes, and it's high: the doctor is talking about hypertension.", altEs: ["¿Le han tomado la presión? — Sí, y la tengo alta: el médico habla de hipertensión."], grammar: [g.scientific-register], vocab: [w.tomar-la-tension, w.hipertension] }
      - { es: "Se ha demostrado que una dosis baja produce menos efectos secundarios.", en: "It has been shown that a low dose produces fewer side effects.", altEs: ["Está demostrado que una dosis baja produce menos efectos secundarios."], grammar: [g.scientific-register, g.se-passive], vocab: [w.demostrar, w.dosis, w.efecto-secundario] }
      - { es: "El cardiólogo le diagnosticó un infarto leve y le recetó descanso absoluto.", en: "The cardiologist diagnosed a mild heart attack and prescribed complete rest.", altEs: ["La cardióloga le diagnosticó un infarto leve y le recetó descanso absoluto."], grammar: [g.scientific-register], vocab: [w.cardiologo, w.diagnosticar, w.infarto, w.leve, w.recetar] }
      - { es: "Los análisis muestran una leve anemia; no es grave, pero hay que repetir la analítica en un mes.", en: "The tests show mild anaemia; it isn't serious, but the blood test has to be repeated in a month.", grammar: [g.scientific-register], vocab: [w.analisis, w.leve, w.analitica], note: "análisis is invariable: el análisis, los análisis." }
      - { es: "En nuestra serie, el 15 % de los pacientes abandonó el ensayo clínico antes de la cuarta semana.", en: "In our series, 15 % of patients left the clinical trial before the fourth week.", grammar: [g.scientific-register], vocab: [w.ensayo-clinico, w.abandonar], note: "Spanish writes a space before %: un 15 %." }
      - { es: "A la luz de estos resultados, la hipótesis inicial no puede mantenerse.", en: "In the light of these results, the initial hypothesis cannot be maintained.", altEs: ["A la luz de estos resultados, no puede mantenerse la hipótesis inicial."], grammar: [g.scientific-register], vocab: [w.hipotesis, w.resultado, w.mantener] }
      - { es: "La temperatura subió a 39 °C y la enfermera avisó al cirujano de guardia.", en: "The temperature rose to 39 °C and the nurse alerted the surgeon on duty.", grammar: [g.scientific-register], vocab: [w.cirujano, w.enfermero, w.avisar] }
      - { es: "Cada célula contiene el mismo ADN, pero no todos los genes se expresan.", en: "Every cell contains the same DNA, but not all genes are expressed.", altEs: ["Todas las células contienen el mismo ADN, pero no todos los genes se expresan."], grammar: [g.scientific-register, g.se-passive], vocab: [w.celula, w.gen, w.expresar] }
      - { es: "La cirugía se realizará en el quirófano tres y durará unas dos horas.", en: "The surgery will be performed in operating theatre three and will last about two hours.", altEs: ["La operación se realizará en el quirófano tres y durará unas dos horas."], grammar: [g.scientific-register, g.se-passive], vocab: [w.cirugia, w.quirofano, w.realizar] }
      - { es: "Las unidades se escriben sin punto y con un espacio: 5 km, 20 °C, un 15 %.", en: "Units are written without a full stop and with a space: 5 km, 20 °C, 15 %.", altEs: ["Las unidades se escriben sin punto y separadas por un espacio: 5 km, 20 °C, un 15 %."], grammar: [g.scientific-register], vocab: [w.unidad] }
      - { es: "Tengo una molestia en el pecho desde ayer. — No se preocupe: es una inflamación muscular, no un infarto.", en: "I've had a discomfort in my chest since yesterday. — Don't worry: it's a muscular inflammation, not a heart attack.", grammar: [g.scientific-register, g.desde-hace], vocab: [w.molestia, w.inflamacion, w.infarto], note: "With patients: molestia rather than dolor, infarto softened to ataque al corazón." }
      - { es: "Las crisis se repiten cada invierno, según la evidencia de los últimos diez años.", en: "The crises recur every winter, according to the evidence of the last ten years.", grammar: [g.scientific-register], vocab: [w.crisis, w.evidencia], error: { wrong: "Las crisises se repiten cada invierno, según la evidencia de los últimos diez años.", explain: "Nouns ending in -is are invariable in the plural: la crisis / las crisis, el análisis / los análisis, la dosis / las dosis.", grammar: g.scientific-register } }
      - { es: "El equipo midió la tensión de todos los pacientes antes del tratamiento.", en: "The team measured the blood pressure of all the patients before the treatment.", grammar: [g.scientific-register], vocab: [w.medir, w.equipo, w.tratamiento], transform: { instruction: "Rewrite in impersonal scientific style with se", answer: "Se midió la tensión de todos los pacientes antes del tratamiento.", alt: ["Se midió la tensión a todos los pacientes antes del tratamiento.", "Se les midió la tensión a todos los pacientes antes del tratamiento."] } }
    exchanges:
      - q: { es: "¿Qué significa «dar de alta»?", en: "What does 'dar de alta' mean?" }
        a: { es: "Que el paciente puede irse a casa: el hospital da por terminado el tratamiento.", en: "That the patient can go home: the hospital considers the treatment finished." }
        alt: ["Que el paciente ya puede volver a casa.", "Es lo contrario de ingresar: el paciente se va a casa."]
        grammar: [g.scientific-register]
        vocab: [w.dar-de-alta]
      - q: { es: "Doctor, ¿es grave?", en: "Doctor, is it serious?" }
        a: { es: "No: es una molestia leve, pero vamos a hacer una analítica por si acaso.", en: "No: it's a mild discomfort, but we're going to do a blood test just in case." }
        alt: ["Tranquilo, es leve; le pido una analítica para descartar otras cosas."]
        grammar: [g.scientific-register]
        vocab: [w.leve, w.analitica, w.molestia]
      - q: { es: "¿Cuántas veces al día tomo las pastillas?", en: "How many times a day do I take the pills?" }
        a: { es: "Una dosis cada ocho horas, con comida, durante una semana.", en: "One dose every eight hours, with food, for a week." }
        alt: ["Tres al día, una cada ocho horas, siempre con comida."]
        grammar: [g.scientific-register]
        vocab: [w.dosis, w.pastilla]
      - q: { es: "¿Se dice «los análisis» o «los analisis»?", en: "Is it 'los análisis' or 'los analisis'?" }
        a: { es: "Los análisis, con acento y sin cambiar la palabra: el singular y el plural son iguales.", en: "Los análisis, with the accent and without changing the word: singular and plural are the same." }
        alt: ["Los análisis; la palabra no cambia en plural."]
        grammar: [g.scientific-register]
        vocab: [w.analisis]
      - q: { es: "¿Por qué los artículos científicos nunca dicen «yo»?", en: "Why do scientific articles never say 'I'?" }
        a: { es: "Porque el registro exige impersonalidad: se observa, se concluye, los datos indican.", en: "Because the register demands impersonality: it is observed, it is concluded, the data indicate." }
        alt: ["Por el registro: todo se dice con se o con «los datos sugieren»."]
        grammar: [g.scientific-register]
        vocab: [w.registro, w.observar]
    texts:
      - title: "Resumen de un artículo"
        es: ["Se estudió a 240 pacientes con hipertensión durante dos años.", "El grupo tratado redujo la tensión una media de doce puntos.", "No se registraron efectos secundarios graves.", "Los autores concluyen que el medicamento es seguro en adultos."]
        en: ["240 patients with hypertension were studied for two years.", "The treated group lowered their blood pressure by an average of twelve points.", "No serious side effects were recorded.", "The authors conclude that the drug is safe in adults."]
        grammar: [g.scientific-register, g.se-passive]
        vocab: [w.hipertension, w.grupo, w.efecto-secundario, w.medicamento]
      - title: "Nota del médico"
        es: ["Paciente de 54 años con molestias en el pecho desde hace tres días.", "Tensión 150/95; se le toma analítica y se le hace un electrocardiograma.", "Se recomienda descanso y revisión con cardiología en una semana."]
        en: ["54-year-old patient with chest discomfort for the last three days.", "Blood pressure 150/95; blood tests taken and an electrocardiogram performed.", "Rest is recommended and a check-up with cardiology in a week."]
        grammar: [g.scientific-register]
        vocab: [w.paciente, w.molestia, w.analitica]
  - id: c2.u06.l2
    title: Manuales e informática
    teach: [g.technical-register]
    vocab: [w.raton, w.teclado, w.contrasena, w.iniciar-sesion, w.cerrar-sesion, w.descargar, w.actualizar, w.actualizacion, w.copiar-y-pegar, w.enlace, w.navegador, w.servidor, w.copia-de-seguridad, w.codigo, w.desarrollador, w.interfaz, w.seleccionar, w.pirata-informatico, w.clic, w.configurar, w.reiniciar, w.instalar, w.mantenimiento, w.pestana, w.cortafuegos, w.depurar, w.cifrar, w.base-de-datos]
    tip: "Manuals use the infinitive (Pulsar), impersonal se (Se recomienda) or the formal imperative (Pulse, introduzca). Formal texts prefer Spanish forms: enlace, contraseña, copia de seguridad, clic."
    sentences:
      - { es: "Introduzca su contraseña y pulse «Iniciar sesión».", en: "Enter your password and press 'Log in'.", altEs: ["Introduzca su clave y pulse «Iniciar sesión»."], grammar: [g.technical-register, g.imperative-usted], vocab: [w.introducir, w.contrasena, w.pulsar, w.iniciar-sesion] }
      - { es: "Se recomienda realizar una copia de seguridad antes de actualizar el sistema.", en: "It is recommended to make a backup before updating the system.", altEs: ["Se recomienda hacer una copia de seguridad antes de actualizar el sistema."], grammar: [g.technical-register, g.se-impersonal], vocab: [w.copia-de-seguridad, w.actualizar] }
      - { es: "El servidor se ha caído otra vez; avisa al desarrollador de guardia.", en: "The server is down again; tell the developer on duty.", altEs: ["Se ha caído el servidor otra vez; avisa al desarrollador de guardia."], grammar: [g.technical-register, g.imperative-tu], vocab: [w.servidor, w.caerse, w.desarrollador] }
      - { es: "Guarda el archivo en la carpeta compartida y envíame el enlace, no el adjunto.", en: "Save the file in the shared folder and send me the link, not the attachment.", grammar: [g.technical-register, g.imperative-tu], vocab: [w.guardar, w.archivo, w.carpeta, w.enlace, w.adjunto] }
      - { es: "¿Has probado a reiniciar el ordenador? — Sí, tres veces, y el teclado sigue sin responder.", en: "Have you tried restarting the computer? — Yes, three times, and the keyboard still isn't responding.", altEs: ["¿Has probado a reiniciar la computadora? — Sí, tres veces, y el teclado sigue sin responder."], grammar: [g.technical-register], vocab: [w.reiniciar, w.ordenador, w.teclado] }
      - { es: "Para deshacer el último cambio, pulse Ctrl + Z.", en: "To undo the last change, press Ctrl + Z.", altEs: ["Para deshacer el último cambio, pulsa Ctrl + Z."], grammar: [g.technical-register, g.imperative-usted], vocab: [w.deshacer, w.pulsar] }
      - { es: "Un cortafuegos bien configurado habría detenido al pirata informático.", en: "A well-configured firewall would have stopped the hacker.", altEs: ["Un cortafuegos bien configurado habría parado al pirata informático."], altEn: ["A properly configured firewall would have stopped the hacker."], grammar: [g.technical-register, g.conditional-perfect], vocab: [w.cortafuegos, w.configurar, w.pirata-informatico] }
      - { es: "No escribas «click»: en español es clic, y se hace clic en el enlace.", en: "Don't write 'click': in Spanish it's clic, and you click on the link (hacer clic en).", grammar: [g.technical-register, g.imperative-negative], vocab: [w.clic, w.enlace] }
      - { es: "Antes de publicar la nueva versión hay que depurar el código fuente.", en: "Before releasing the new version the source code has to be debugged.", grammar: [g.technical-register], vocab: [w.depurar, w.codigo, w.version] }
      - { es: "Los datos de los usuarios se cifran antes de guardarse en la base de datos.", en: "Users' data are encrypted before being stored in the database.", altEs: ["Los datos de los usuarios se cifran antes de almacenarse en la base de datos."], grammar: [g.technical-register, g.se-passive], vocab: [w.cifrar, w.base-de-datos, w.usuario] }
      - { es: "Abre una pestaña nueva en el navegador y descarga la actualización desde la nube.", en: "Open a new tab in the browser and download the update from the cloud.", grammar: [g.technical-register, g.imperative-tu], vocab: [w.pestana, w.navegador, w.descargar, w.actualizacion, w.nube] }
      - { es: "El mantenimiento se efectuará el domingo de dos a cuatro; la interfaz no estará disponible.", en: "Maintenance will be carried out on Sunday from two to four; the interface will not be available.", altEs: ["El mantenimiento se realizará el domingo de dos a cuatro; la interfaz no estará disponible."], grammar: [g.technical-register, g.se-passive], vocab: [w.mantenimiento, w.efectuar, w.interfaz] }
      - { es: "Seleccione la opción «Configuración», active la copia automática y cierre sesión.", en: "Select the 'Settings' option, activate automatic backup and log out.", grammar: [g.technical-register, g.imperative-usted], vocab: [w.seleccionar, w.cerrar-sesion] }
      - { es: "El ratón inalámbrico se conecta por bluetooth; si falla, cambia las pilas.", en: "The wireless mouse connects via Bluetooth; if it fails, change the batteries.", altEs: ["El mouse inalámbrico se conecta por bluetooth; si falla, cambia las pilas."], grammar: [g.technical-register], vocab: [w.raton, w.pila] }
      - { es: "Hice clic en el enlace y se instaló la actualización sola.", en: "I clicked on the link and the update installed itself.", grammar: [g.technical-register], vocab: [w.clic, w.enlace, w.instalar], error: { wrong: "Hice click en el link y se instaló la actualización sola.", explain: "In formal Spanish the adapted forms are preferred: clic (not click) and enlace (not link).", grammar: g.technical-register } }
      - { es: "Pulsa el botón rojo y espera diez segundos.", en: "Press the red button and wait ten seconds.", grammar: [g.technical-register, g.imperative-tu], vocab: [w.pulsar, w.boton], transform: { instruction: "Rewrite as a formal manual instruction (usted)", answer: "Pulse el botón rojo y espere diez segundos.", alt: ["Pulsar el botón rojo y esperar diez segundos.", "Se debe pulsar el botón rojo y esperar diez segundos."] } }
    exchanges:
      - q: { es: "No puedo iniciar sesión.", en: "I can't log in." }
        a: { es: "¿Has escrito bien la contraseña? Comprueba que no tengas las mayúsculas activadas.", en: "Have you typed the password correctly? Check that you don't have caps lock on." }
        alt: ["Prueba a cambiar la contraseña desde el enlace de abajo."]
        grammar: [g.technical-register]
        vocab: [w.iniciar-sesion, w.contrasena]
      - q: { es: "¿Dónde está el archivo que te mandé?", en: "Where's the file I sent you?" }
        a: { es: "En la carpeta de descargas; si no, búscalo en la nube.", en: "In the downloads folder; if not, look for it in the cloud." }
        alt: ["Lo guardé en la carpeta compartida."]
        grammar: [g.technical-register]
        vocab: [w.archivo, w.carpeta, w.nube]
      - q: { es: "¿Qué hace exactamente un desarrollador?", en: "What exactly does a developer do?" }
        a: { es: "Escribe y depura el código de los programas que usas cada día.", en: "He writes and debugs the code of the programs you use every day." }
        alt: ["Programa: escribe código y arregla los fallos."]
        grammar: [g.technical-register]
        vocab: [w.desarrollador, w.depurar, w.codigo]
      - q: { es: "¿Es seguro conectarse al wifi del aeropuerto?", en: "Is it safe to connect to the airport wifi?" }
        a: { es: "Solo si la conexión va cifrada; si no, mejor usa tus datos.", en: "Only if the connection is encrypted; otherwise, better use your mobile data." }
        alt: ["No mucho: si no está cifrada, usa tus datos."]
        grammar: [g.technical-register]
        vocab: [w.cifrar]
      - q: { es: "¿«Backup» o copia de seguridad?", en: "'Backup' or copia de seguridad?" }
        a: { es: "En un manual, copia de seguridad; en la oficina, todo el mundo dice backup.", en: "In a manual, copia de seguridad; in the office, everyone says backup." }
        alt: ["Copia de seguridad por escrito; backup hablando."]
        grammar: [g.technical-register]
        vocab: [w.copia-de-seguridad]
    texts:
      - title: "Aviso de la empresa"
        es: ["El servidor de correo estará en mantenimiento el sábado de 8:00 a 12:00.", "Guarden sus archivos en la nube antes del viernes.", "Si observan algún fallo tras la actualización, escriban al equipo de informática."]
        en: ["The mail server will be under maintenance on Saturday from 8:00 to 12:00.", "Save your files to the cloud before Friday.", "If you notice any fault after the update, write to the IT team."]
        grammar: [g.technical-register, g.imperative-usted]
        vocab: [w.servidor, w.mantenimiento, w.nube, w.fallo, w.actualizacion]
      - title: "Instrucciones de la aplicación"
        es: ["Descargue la aplicación e inicie sesión con su cuenta.", "Seleccione «Ajustes» y active la copia de seguridad automática.", "Para cerrar sesión, pulse su nombre y después «Salir»."]
        en: ["Download the app and log in with your account.", "Select 'Settings' and activate automatic backup.", "To log out, press your name and then 'Exit'."]
        grammar: [g.technical-register, g.imperative-usted]
        vocab: [w.descargar, w.iniciar-sesion, w.seleccionar, w.copia-de-seguridad, w.cerrar-sesion]
  - id: c2.u06.l3
    title: Burocratés
    teach: [g.bureaucratic-language]
    vocab: [w.dia-habil, w.desestimar, w.silencio-administrativo, w.cumplimentar, w.personarse, w.empadronarse, w.declaracion-de-la-renta, w.estimar, w.compulsar, w.contribuyente, w.surtir-efecto, w.alta, w.sede-electronica, w.firma-digital, w.recargo, w.casilla, w.cotizar, w.prestacion, w.padron, w.instar, w.poner-en-conocimiento]
    tip: "Official Spanish has its own verbs (proceder, efectuar, subsanar, acreditar, aportar) and formulas (en el plazo de diez días hábiles, surtirá efectos, queda sin efecto). Learn to decode them; you rarely need to produce them."
    sentences:
      - { es: "Se le requiere para que, en el plazo de diez días hábiles, subsane la documentación aportada.", en: "You are required, within ten working days, to correct the documentation submitted.", grammar: [g.bureaucratic-language, g.subjunctive-purpose], vocab: [w.requerir, w.dia-habil, w.subsanar, w.aportar] }
      - { es: "El recurso fue desestimado por silencio administrativo.", en: "The appeal was rejected by administrative silence.", altEs: ["Desestimaron el recurso por silencio administrativo."], grammar: [g.bureaucratic-language, g.passive-ser], vocab: [w.recurso, w.desestimar, w.silencio-administrativo] }
      - { es: "La presente resolución surtirá efectos a partir del día siguiente a su notificación.", en: "This decision will take effect from the day after its notification.", altEs: ["Esta resolución surtirá efectos a partir del día siguiente a su notificación."], altEn: ["This ruling will take effect from the day following its notification."], grammar: [g.bureaucratic-language], vocab: [w.resolucion, w.surtir-efecto, w.notificacion] }
      - { es: "Pida cita previa en la sede electrónica antes de personarse en la oficina.", en: "Book an appointment on the online portal before coming to the office in person.", altEs: ["Pida cita previa en la web antes de personarse en la oficina."], grammar: [g.bureaucratic-language, g.imperative-usted], vocab: [w.cita-previa, w.sede-electronica, w.personarse] }
      - { es: "¿Ya te has empadronado? — Sí, y luego me pidieron el padrón para la tarjeta del médico.", en: "Have you registered as a resident yet? — Yes, and then they asked me for the residence certificate for the health card.", grammar: [g.bureaucratic-language], vocab: [w.empadronarse, w.padron] }
      - { es: "Para solicitar la prestación, el contribuyente deberá acreditar que ha cotizado al menos un año.", en: "To apply for the benefit, the taxpayer must prove that he has paid contributions for at least a year.", grammar: [g.bureaucratic-language], vocab: [w.prestacion, w.contribuyente, w.acreditar, w.cotizar] }
      - { es: "La instancia debe cumplimentarse en mayúsculas y firmarse con firma digital o a mano.", en: "The application form must be filled in in capital letters and signed with a digital signature or by hand.", grammar: [g.bureaucratic-language, g.se-passive], vocab: [w.instancia, w.cumplimentar, w.firma-digital] }
      - { es: "Si abona la tasa fuera de plazo, se aplicará un recargo del veinte por ciento.", en: "If you pay the fee after the deadline, a twenty per cent surcharge will be applied.", altEs: ["Si paga la tasa fuera de plazo, se le aplicará un recargo del veinte por ciento."], grammar: [g.bureaucratic-language, g.si-clauses-real], vocab: [w.abonar, w.tasa, w.recargo] }
      - { es: "Marque la casilla correspondiente y adjunte una copia compulsada del DNI.", en: "Tick the appropriate box and attach a certified copy of your ID card.", altEs: ["Marque la casilla que corresponda y adjunte una copia compulsada del DNI."], grammar: [g.bureaucratic-language, g.imperative-usted], vocab: [w.casilla, w.compulsar] }
      - { es: "Se insta al interesado a poner en conocimiento de la administración cualquier cambio de domicilio.", en: "The interested party is urged to inform the administration of any change of address.", grammar: [g.bureaucratic-language, g.se-impersonal], vocab: [w.instar, w.interesado, w.poner-en-conocimiento] }
      - { es: "La convocatoria de las oposiciones se publicó ayer: hay cuarenta plazas.", en: "The announcement of the civil-service exams was published yesterday: there are forty posts.", altEs: ["Ayer se publicó la convocatoria de las oposiciones: hay cuarenta plazas."], grammar: [g.bureaucratic-language, g.se-passive], vocab: [w.convocatoria, w.oposiciones] }
      - { es: "Hoy me han dado de alta en la Seguridad Social; hasta ahora no cotizaba.", en: "Today they registered me with Social Security; until now I wasn't paying contributions.", altEs: ["Hoy me han dado el alta en la Seguridad Social; hasta ahora no cotizaba."], grammar: [g.bureaucratic-language], vocab: [w.dar-de-alta, w.alta, w.cotizar] }
      - { es: "Hacienda estimó mi recurso y me devolvió el dinero de la declaración de la renta con intereses.", en: "The tax office upheld my appeal and refunded me the money from my tax return with interest.", grammar: [g.bureaucratic-language], vocab: [w.estimar, w.recurso, w.declaracion-de-la-renta] }
      - { es: "El notario leyó el poder en voz alta y nos preguntó si lo entendíamos; nadie dijo que no.", en: "The notary read the power of attorney aloud and asked us if we understood it; nobody said no.", grammar: [g.bureaucratic-language, g.reported-speech-past], vocab: [w.notario, w.poder] }
      - { es: "Se ruega a los solicitantes que aporten el certificado original.", en: "Applicants are requested to provide the original certificate.", grammar: [g.bureaucratic-language, g.indirect-commands], vocab: [w.solicitante, w.aportar, w.certificado], error: { wrong: "Se ruega a los solicitantes que aportan el certificado original.", explain: "rogar que (a request) takes the subjunctive: que aporten, not aportan.", grammar: g.bureaucratic-language } }
      - { es: "Deberá procederse al abono de la tasa antes del 15 de mayo.", en: "Payment of the fee must be made before 15 May.", grammar: [g.bureaucratic-language], vocab: [w.proceder, w.tasa], transform: { instruction: "Rewrite in plain language, addressing the reader as usted", answer: "Debe pagar la tasa antes del 15 de mayo.", alt: ["Tiene que pagar la tasa antes del 15 de mayo.", "Pague la tasa antes del 15 de mayo."] } }
    exchanges:
      - q: { es: "¿Qué significa «no procede»?", en: "What does 'no procede' mean?" }
        a: { es: "Que la administración considera que su petición no corresponde: es un no.", en: "That the administration considers your request inapplicable: it's a no." }
        alt: ["Que no, dicho en burocratés."]
        grammar: [g.bureaucratic-language]
        vocab: [w.proceder]
      - q: { es: "¿Qué es el silencio administrativo?", en: "What is administrative silence?" }
        a: { es: "Que pasa el plazo sin respuesta; según el caso, equivale a un sí o a un no.", en: "That the deadline passes with no reply; depending on the case, it counts as a yes or a no." }
        alt: ["Cuando no contestan a tiempo y la ley decide qué significa."]
        grammar: [g.bureaucratic-language]
        vocab: [w.silencio-administrativo, w.plazo]
      - q: { es: "¿Tengo que ir en persona?", en: "Do I have to go in person?" }
        a: { es: "No: puede presentarlo en la sede electrónica con su firma digital.", en: "No: you can submit it on the online portal with your digital signature." }
        alt: ["No hace falta personarse; hágalo en la sede electrónica."]
        grammar: [g.bureaucratic-language]
        vocab: [w.sede-electronica, w.firma-digital]
      - q: { es: "¿Me cobran algo por el certificado?", en: "Do they charge anything for the certificate?" }
        a: { es: "Una tasa de doce euros, que debe abonar antes de recogerlo.", en: "A fee of twelve euros, which you must pay before collecting it." }
        alt: ["Sí, una tasa de doce euros."]
        grammar: [g.bureaucratic-language]
        vocab: [w.tasa, w.abonar, w.certificado]
      - q: { es: "¿Qué papeles necesito para empadronarme?", en: "What papers do I need to register as a resident?" }
        a: { es: "El DNI, el contrato de alquiler y, si vive con alguien, su autorización firmada.", en: "Your ID card, the rental contract and, if you live with someone, their signed authorisation." }
        alt: ["DNI y contrato de alquiler; con eso basta."]
        grammar: [g.bureaucratic-language]
        vocab: [w.empadronarse]
    texts:
      - title: "Notificación oficial"
        es: ["Vista la solicitud presentada por el interesado, se resuelve estimarla.", "La presente resolución surtirá efectos desde el día siguiente a su notificación.", "Contra ella cabe recurso de alzada en el plazo de un mes."]
        en: ["Having examined the application submitted by the interested party, it is decided to uphold it.", "This decision will take effect from the day after its notification.", "An appeal against it may be lodged within one month."]
        grammar: [g.bureaucratic-language]
        vocab: [w.estimar, w.surtir-efecto, w.recurso]
      - title: "Mensaje de una amiga"
        es: ["¡Por fin me han dado el certificado!", "Tres citas previas, dos ventanillas y una copia compulsada que no servía.", "Celebramos el fin del trámite con unas cañas."]
        en: ["They've finally given me the certificate!", "Three appointments, two counters and a certified copy that was no good.", "We're celebrating the end of the paperwork with a few beers."]
        grammar: [g.bureaucratic-language]
        vocab: [w.cita-previa, w.ventanilla, w.compulsar, w.tramite]
  - id: c2.u06.l4
    title: Lenguaje claro
    teach: [g.bureaucratic-language]
    vocab: [w.claridad, w.enrevesado, w.encabezado, w.farragoso, w.voz-activa, w.voz-pasiva, w.lenguaje-claro]
    tip: "Plain language (lenguaje claro) turns burocratés into text people understand: short sentences, active voice, usted, headings and examples. Deberá procederse al abono → Debe pagar."
    sentences:
      - { es: "El lenguaje claro consiste en escribir para que el ciudadano entienda a la primera.", en: "Plain language consists in writing so that the citizen understands at the first reading.", altEs: ["El lenguaje claro consiste en escribir de modo que el ciudadano lo entienda a la primera."], grammar: [g.bureaucratic-language, g.subjunctive-purpose], vocab: [w.lenguaje-claro, w.ciudadano] }
      - { es: "Frases cortas, voz activa y encabezados: así se simplifica un texto farragoso.", en: "Short sentences, active voice and headings: that's how you simplify a long-winded text.", grammar: [g.bureaucratic-language, g.se-impersonal], vocab: [w.voz-activa, w.encabezado, w.simplificar, w.farragoso] }
      - { es: "«Deberá procederse al abono» se convierte en «debe pagar»: la misma información con la mitad de palabras.", en: "'Deberá procederse al abono' becomes 'debe pagar': the same information with half the words.", altEs: ["«Deberá procederse al abono» se convierte en «debe pagar»: la misma información en la mitad de palabras."], grammar: [g.bureaucratic-language], vocab: [w.proceder, w.abonar] }
      - { es: "El texto estaba tan enrevesado que ni los propios funcionarios lo entendían.", en: "The text was so convoluted that not even the officials themselves understood it.", grammar: [g.bureaucratic-language], vocab: [w.enrevesado, w.funcionario] }
      - { es: "¿Para quién escribes? Si no lo sabes, no puedes elegir ni el registro ni los tecnicismos.", en: "Who are you writing for? If you don't know, you can't choose either the register or the technical terms.", grammar: [g.bureaucratic-language], vocab: [w.registro, w.tecnicismo] }
      - { es: "Sustituye la voz pasiva por la activa: no «fue aprobado por el consejo», sino «el consejo lo aprobó».", en: "Replace the passive voice with the active: not 'fue aprobado por el consejo' but 'el consejo lo aprobó'.", grammar: [g.bureaucratic-language, g.imperative-tu], vocab: [w.sustituir, w.voz-pasiva, w.voz-activa] }
      - { es: "Un buen encabezado le dice al lector qué hay en cada párrafo antes de leerlo.", en: "A good heading tells the reader what is in each paragraph before reading it.", altEs: ["Un buen encabezado dice al lector qué hay en cada párrafo antes de leerlo."], altEn: ["A good heading tells the reader what each paragraph contains before he reads it."], grammar: [g.bureaucratic-language], vocab: [w.encabezado, w.lector, w.parrafo] }
      - { es: "La claridad no consiste en simplificar las ideas, sino en ordenarlas.", en: "Clarity doesn't consist in simplifying ideas but in ordering them.", altEs: ["La claridad no es simplificar las ideas, sino ordenarlas."], grammar: [g.bureaucratic-language], vocab: [w.claridad, w.simplificar] }
      - { es: "Muchas administraciones ya redactan sus cartas en lenguaje claro, con ejemplos y en segunda persona.", en: "Many public bodies already write their letters in plain language, with examples and in the second person.", altEs: ["Muchas administraciones ya escriben sus cartas en lenguaje claro, con ejemplos y en segunda persona."], grammar: [g.bureaucratic-language], vocab: [w.redactar, w.lenguaje-claro] }
      - { es: "No abuses de la jerga: lo que para ti es evidente, para el lector es un muro.", en: "Don't overuse jargon: what is obvious to you is a wall to the reader.", altEs: ["No abuses de la jerga: lo que a ti te parece evidente, para el lector es un muro."], grammar: [g.bureaucratic-language, g.imperative-negative], vocab: [w.jerga, w.lector] }
      - { es: "¿Es comprensible este aviso para alguien que no sea abogado? — Ni para los abogados.", en: "Is this notice understandable for someone who isn't a lawyer? — Not even for the lawyers.", grammar: [g.bureaucratic-language, g.relative-subjunctive], vocab: [w.comprensible, w.aviso, w.abogado] }
      - { es: "Me pidieron que reformulara el aviso en tres frases y sin tecnicismos.", en: "They asked me to rephrase the notice in three sentences and without technical terms.", grammar: [g.bureaucratic-language, g.reported-speech-past], vocab: [w.reformular, w.tecnicismo] }
      - { es: "Cuanto más corto es el párrafo, más probable es que lo lean entero.", en: "The shorter the paragraph, the more likely it is that people read it all the way through.", altEs: ["Cuanto más corto sea el párrafo, más probable será que lo lean entero."], grammar: [g.bureaucratic-language, g.comparatives], vocab: [w.parrafo] }
      - { es: "Debe presentar la solicitud antes del viernes.", en: "You must submit the application before Friday.", grammar: [g.bureaucratic-language], vocab: [w.solicitud, w.presentar], error: { wrong: "Debe de presentar la solicitud antes del viernes.", explain: "deber + infinitive = obligation (debe presentar); deber de + infinitive = probability (debe de estar en casa).", grammar: g.bureaucratic-language } }
      - { es: "Se pone en conocimiento de los usuarios que el servicio quedará interrumpido por obras.", en: "Users are hereby informed that the service will be interrupted due to works.", grammar: [g.bureaucratic-language, g.se-impersonal], vocab: [w.poner-en-conocimiento, w.usuario], transform: { instruction: "Rewrite in plain language", answer: "Les informamos de que el servicio se interrumpirá por obras.", alt: ["Aviso: el servicio se interrumpirá por obras.", "El servicio se interrumpirá por obras."] } }
      - { es: "El lenguaje claro no es lenguaje pobre: es respeto por quien lee.", en: "Plain language is not poor language: it is respect for the reader.", grammar: [g.bureaucratic-language], vocab: [w.lenguaje-claro, w.respeto] }
    exchanges:
      - q: { es: "¿Cómo digo «se procederá a la devolución del importe» en lenguaje claro?", en: "How do I say 'se procederá a la devolución del importe' in plain language?" }
        a: { es: "Le devolveremos el dinero.", en: "We will refund your money." }
        alt: ["Le devolvemos el importe.", "Le devolveremos el importe."]
        grammar: [g.bureaucratic-language]
        vocab: [w.lenguaje-claro, w.importe]
      - q: { es: "¿Qué cambiarías en este aviso?", en: "What would you change in this notice?" }
        a: { es: "Lo cortaría en tres frases y pondría un encabezado con lo importante.", en: "I'd cut it into three sentences and put a heading with the important part." }
        alt: ["Frases más cortas y un encabezado claro."]
        grammar: [g.bureaucratic-language, g.conditional-hypothetical]
        vocab: [w.encabezado, w.aviso]
      - q: { es: "¿La voz pasiva está prohibida?", en: "Is the passive voice banned?" }
        a: { es: "No, pero en una carta al ciudadano casi siempre sobra.", en: "No, but in a letter to a citizen it's almost always unnecessary." }
        alt: ["Prohibida no; innecesaria casi siempre."]
        grammar: [g.bureaucratic-language]
        vocab: [w.voz-pasiva, w.sobrar]
      - q: { es: "¿Por qué los textos oficiales son tan farragosos?", en: "Why are official texts so long-winded?" }
        a: { es: "Por costumbre y por miedo: copiar la fórmula de siempre parece más seguro.", en: "Out of habit and out of fear: copying the usual formula seems safer." }
        alt: ["Porque se copian unos a otros desde hace un siglo."]
        grammar: [g.bureaucratic-language]
        vocab: [w.farragoso, w.costumbre]
    texts:
      - title: "Antes y después"
        es: ["Antes: Se comunica a los interesados que deberán personarse en las oficinas municipales.", "Después: Venga a la oficina del ayuntamiento.", "La misma información con ocho palabras menos."]
        en: ["Before: Interested parties are informed that they must appear in person at the municipal offices.", "After: Come to the town hall office.", "The same information with eight fewer words."]
        grammar: [g.bureaucratic-language]
        vocab: [w.interesado, w.personarse, w.ayuntamiento]
      - title: "Cartel en la oficina"
        es: ["Escribimos claro.", "Si algo no se entiende, el error es nuestro, no suyo.", "Pregunte en la ventanilla tres."]
        en: ["We write clearly.", "If something isn't understood, the mistake is ours, not yours.", "Ask at counter three."]
        grammar: [g.bureaucratic-language, g.imperative-usted]
        vocab: [w.claridad, w.ventanilla]
dialogues:
  - id: c2.u06.d1
    title: En la ventanilla
    context: Señora Ruiz has come to the town hall to sort out a residence certificate for her mother; the official, Sr. Ortega, speaks two registers at once.
    lines:
      - { speaker: Sra. Ruiz, es: "Buenos días. Vengo a por el certificado de empadronamiento de mi madre. Lo pedí hace tres semanas.", en: "Good morning. I've come for my mother's residence certificate. I requested it three weeks ago." }
      - { speaker: Sr. Ortega, es: "A ver… Ruiz, Ruiz. Aquí está: «Se requiere a la interesada para que subsane la documentación aportada en el plazo de diez días hábiles».", en: "Let's see… Ruiz, Ruiz. Here it is: 'The interested party is required to correct the documentation submitted within ten working days'." }
      - { speaker: Sra. Ruiz, es: "¿Y eso qué significa, en cristiano?", en: "And what does that mean, in plain Spanish?" }
      - { speaker: Sr. Ortega, es: "Que falta un papel. La copia del DNI que trajo no estaba compulsada, y sin ella el expediente no puede seguir.", en: "That a document is missing. The copy of the ID card you brought wasn't certified, and without it the file can't move forward." }
      - { speaker: Sra. Ruiz, es: "Nadie me avisó. ¿No se me notificó nada?", en: "Nobody told me. Wasn't I notified of anything?" }
      - { speaker: Sr. Ortega, es: "Se le envió la notificación a la sede electrónica. Si no entró, el plazo corrió igual: ayer se cumplieron los diez días.", en: "The notification was sent to the online portal. If you didn't log in, the deadline ran anyway: the ten days were up yesterday." }
      - { speaker: Sra. Ruiz, es: "Entonces, ¿han desestimado la solicitud? ¿Tengo que empezar de cero?", en: "So have they rejected the application? Do I have to start from scratch?" }
      - { speaker: Sr. Ortega, es: "No, mujer. Tráigame hoy la copia compulsada y yo la incorporo al expediente. La compulsa se la hago aquí mismo, es gratis.", en: "No, don't worry. Bring me the certified copy today and I'll add it to the file. I'll certify it for you right here, it's free." }
      - { speaker: Sra. Ruiz, es: "¿Y la tasa? En la carta ponía algo de «previo pago de la tasa correspondiente».", en: "And the fee? The letter said something about 'subject to prior payment of the corresponding fee'." }
      - { speaker: Sr. Ortega, es: "Son cuatro euros con veinte. Puede abonarlos en la ventanilla dos o, si prefiere, en línea con la firma digital.", en: "It's four euros twenty. You can pay at counter two or, if you prefer, online with your digital signature." }
      - { speaker: Sra. Ruiz, es: "Prefiero pagar aquí y acabar hoy. Oiga, ¿y por qué no escriben las cartas como habla usted?", en: "I'd rather pay here and finish today. Listen, why don't they write the letters the way you talk?" }
      - { speaker: Sr. Ortega, es: "Eso mismo me pregunto yo cada mañana, señora. Ventanilla dos; cuando vuelva, el certificado estará listo.", en: "I ask myself the same thing every morning, madam. Counter two; when you come back, the certificate will be ready." }
    questions:
      - { q: "Why was the certificate not issued?", options: ["The fee was not paid", "The copy of the ID card was not certified", "The mother is not registered"], answer: 1 }
      - { q: "Where was the notification sent?", options: ["To her home address", "To the online portal (sede electrónica)", "It was never sent"], answer: 1 }
      - { q: "What does Sr. Ortega offer to do?", options: ["Certify the copy himself, free of charge", "Waive the fee", "Extend the deadline by ten days"], answer: 0 }
