grammar:
  - { prompt: "口語「我唔知」，書面語寫做「我___知道」。", options: ["不", "沒", "未"], answer: 0, explain: "Spoken 唔 corresponds to written 不 (g.written-negation)." }
  - { prompt: "口語「佢食咗飯」，書面語寫做「他吃___飯」。", options: ["了", "着", "過"], answer: 0, explain: "Spoken 咗 corresponds to written 了 (g.written-aspect)." }
  - { prompt: "「醫生」嘅「生」用文讀，讀___。", options: ["sang1", "saang1", "sing1"], answer: 0, explain: "生 has a literary reading sang1 (醫生, 生命) and a colloquial one saang1 (學生) (g.literary-colloquial-readings)." }
  - { prompt: "該名男子涉嫌盜竊，昨天___警方拘捕。", options: ["被", "畀", "給"], answer: 0, explain: "Formal written Chinese uses 被 for the passive where speech uses 畀 (g.formal-passive)." }
  - { prompt: "請問___姓？", options: ["貴", "令", "敝"], answer: 0, explain: "貴 elevates the other person: 貴姓 'your honourable surname' (g.honorifics)." }
  - { prompt: "___公司將於下月與貴公司簽約。（our company, humble）", options: ["敝", "貴", "令"], answer: 0, explain: "敝 lowers oneself: 敝公司 'our humble company' (g.humble-forms)." }
  - { prompt: "___各位準時出席。（written request）", options: ["敬請", "唔該", "麻煩晒"], answer: 0, explain: "In writing, requests use 敬請 / 煩請 / 懇請 (g.formal-requests)." }
  - { prompt: "佢一早已經準備好，講嘢好有信心，真係___。", options: ["胸有成竹", "畫蛇添足", "守株待兔"], answer: 0, explain: "胸有成竹 'have the bamboo already in one's mind': fully prepared and confident (g.chengyu-in-speech)." }
  - { prompt: "大三巴___一八三五年遭大火焚毀。", options: ["於", "在於", "由於"], answer: 0, explain: "於 'in, at' marks time in formal narration (g.formal-time)." }
  - { prompt: "本公司已完成調查，___決定暫停該服務。", options: ["因此", "然而", "以及"], answer: 0, explain: "因此 'therefore' links cause and result in formal writing (g.written-conjunctions)." }
  - { prompt: "警方正就事件___調查。", options: ["進行", "做緊", "搞"], answer: 0, explain: "Formal Chinese wraps verbs in dummy verbs: 進行調查 (g.nominalisation)." }
  - { prompt: "發言人___有關報道失實，並無此事。", options: ["否認", "承認", "透露"], answer: 0, explain: "否認 'denied' fits a statement that something did not happen (g.reporting-verbs)." }
  - { prompt: "所有參加者___於八時前抵達會場。", options: ["須", "唔使", "可能"], answer: 0, explain: "Rules use formal modals: 須 / 必須 'must' (g.formal-modals)." }
  - { prompt: "閒人___進。", options: ["免", "唔", "冇"], answer: 0, explain: "Notices use compressed classical forms: 閒人免進 'staff only' (g.notice-language, g.classical-negatives)." }
  - { prompt: "___有任何疑問，請與本公司聯絡。", options: ["如", "因為", "雖然"], answer: 0, explain: "如 / 若 / 倘若 are the formal 'if' of written and official language (g.formal-conditionals)." }
writing:
  prompt: "Write a formal letter in standard written Chinese (書面語) of at least 180 words to the management office of your building, complaining about construction noise and asking for action. Use a formal opening (敬啟者), honorific and humble forms (貴處, 本人), written negation and aspect (不, 沒有, 了), at least one formal conditional (如 / 若…則), a nominalised verb (進行, 作出), a formal request (懇請 / 煩請) and a closing formula (此致 / 順頌)."
  minWords: 180
  modelAnswer: |
    敬啟者：

    本人為貴大廈十八樓A室住戶，現就近日樓下單位裝修所造成的噪音問題，向貴處作出投訴。

    自本月初開始，該單位每日由早上八時至晚上九時不停進行工程，期間經常使用電鑽，噪音極大。本人家中有年邁父母及一名三歲幼兒，長期受噪音影響，不但無法休息，幼兒更因此多次在半夜驚醒。本人曾親自向有關工人反映，但情況並沒有改善。

    根據大廈公契，裝修工程只可於星期一至六上午九時至下午六時進行，星期日及公眾假期不得施工。由此可見，該單位的做法已明顯違反規定。

    為此，本人懇請貴處盡快派員了解情況，並要求有關單位嚴格遵守工程時間。如情況持續，本人將不得不向有關政府部門作出投訴。若貴處需要更多資料，歡迎隨時與本人聯絡。

    煩請貴處於七日內書面回覆。謹此致謝。

    此致
    大廈管理處

    十八樓A室住戶 陳大文 謹啟
  checklist:
    - "I used a formal opening and closing (敬啟者 … 此致 / 謹啟) and organised the letter into background, complaint, request."
    - "I used honorific and humble forms consistently (貴處, 貴大廈, 本人)."
    - "I used written negation and aspect (不, 沒有, 並非, 了) instead of 唔, 冇, 咗."
    - "I used at least one nominalised verb (進行工程, 作出投訴) and a formal modal (不得, 須)."
    - "I used a formal conditional (如 / 若 … 則 / 將) and a formal request (懇請, 煩請)."
    - "I used formal connectors (由此可見, 為此, 並) and avoided colloquial particles entirely."
