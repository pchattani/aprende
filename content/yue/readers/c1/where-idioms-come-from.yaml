id: r.c1.where-idioms-come-from
level: c1
title: 成語從何而來：守株待兔同畫蛇添足
kind: literature
author: 韓非 Han Fei (c. 280–233 BC) and the 戰國策 Strategies of the Warring States (compiled by 劉向 Liu Xiang, 1st century BC)
source: "〈守株待兔〉from 《韓非子·五蠹》; 〈畫蛇添足〉from 《戰國策·齊策二》. Both classical passages are quoted in full. Public domain. The framing story and the colloquial retellings are written for this course."
intro: "Two four-character idioms and the classical anecdotes they come from, quoted in full. A grandmother in Taipa helps her grandson with his Chinese homework: she reads each passage aloud in Cantonese, then retells it in everyday speech, so you can compare the classical text with the colloquial version line by line."
allow: [韓非子, 戰國策, 五蠹, 宋國, 楚國, 宋人, 楚, 嘉樂, 阿嫲, 嫲嫲]
paragraphs:
  - { es: "星期日下晝，氹仔一個屋企入面，十二歲嘅嘉樂對住本中文書，眉頭皺晒。老師叫佢哋寫一篇作文，要用兩個成語，仲要講埋個成語嘅出處。佢問阿嫲：「嫲嫲，『守株待兔』同『畫蛇添足』點解咁出名？佢哋究竟係邊度嚟㗎？」阿嫲放低份報紙，笑住話：「嚟，嫲嫲讀原文畀你聽，再用廣東話講一次。」", en: "Sunday afternoon, in a home in Taipa, twelve-year-old Ka-lok is frowning over his Chinese book. His teacher has asked the class to write an essay using two idioms and explaining where each one comes from. He asks his grandmother: 'Grandma, why are \"waiting for rabbits by the tree stump\" and \"drawing legs on a snake\" so famous? Where do they actually come from?' Grandma puts down her newspaper and smiles: 'Come here. I'll read you the original texts, then tell them again in Cantonese.'" }
  - { es: "〈守株待兔〉《韓非子·五蠹》 ／ 宋人有耕者，田中有株，兔走觸株，折頸而死，因釋其耒而守株，冀復得兔，兔不可復得，而身為宋國笑。", en: "'Guarding the Stump, Waiting for Rabbits' (Han Feizi, 'The Five Vermin') / There was a man of Song who tilled the land. In his field there was a tree stump. A rabbit, running, struck the stump, broke its neck and died. So he put down his plough and guarded the stump, hoping to get another rabbit. No rabbit was to be had again, and he himself became the laughing stock of the state of Song." }
  - { es: "阿嫲解釋：「從前宋國有個耕田佬，佢塊田中間有個樹頭。有一日，一隻兔仔跑得太快，一頭撞落個樹頭度，撞斷條頸，死咗。個耕田佬執到隻兔，開心到不得了，以為發達喇。於是佢連田都唔耕，掉低把犁，日日坐喺個樹頭隔籬等，希望再有兔仔撞過嚟。結果呢？當然冇第二隻兔仔啦，塊田仲荒晒，成個宋國都笑佢蠢。」", en: "Grandma explains: 'Once upon a time in the state of Song there was a farmer, and in the middle of his field there was a tree stump. One day a rabbit ran too fast, crashed head first into the stump, broke its neck and died. The farmer picked up the rabbit, overjoyed, and thought he'd struck it rich. So he stopped ploughing altogether, dropped his plough, and sat by the stump every day waiting for another rabbit to run into it. And the result? Of course there was never a second rabbit, his field went to ruin, and the whole state of Song laughed at how stupid he was.'" }
  - { es: "嘉樂笑到碌地：「佢真係好蠢！」阿嫲話：「你咪笑住先。韓非講呢個故仔，其實係批評嗰啲淨係識用舊方法治國嘅人。時代變咗，仲以為用返以前嘅方法就得，同坐喺度等兔仔有乜分別？而家我哋講『守株待兔』，就係話人唔肯努力，淨係等運氣，或者死守住一次嘅經驗，唔識變通。」", en: "Ka-lok laughs so hard he nearly rolls on the floor: 'He was so stupid!' Grandma says: 'Don't laugh just yet. Han Fei told this story to criticise people who only know how to run the state the old way. Times have changed, and they still think the old methods will do – how is that any different from sitting there waiting for rabbits? Nowadays when we say \"guard the stump and wait for rabbits\", we mean someone who won't make an effort and just waits for luck, or clings to one lucky experience and can't adapt.'" }
  - { es: "〈畫蛇添足〉《戰國策·齊策二》 ／ 楚有祠者，賜其舍人卮酒。舍人相謂曰：「數人飲之不足，一人飲之有餘。請畫地為蛇，先成者飲酒。」一人蛇先成，引酒且飲之，乃左手持卮，右手畫蛇曰：「吾能為之足。」未成，一人之蛇成，奪其卮曰：「蛇固無足，子安能為之足？」遂飲其酒。為蛇足者，終亡其酒。", en: "'Drawing Legs on a Snake' (Strategies of the Warring States, 'Qi II') / In Chu there was a man who held a sacrifice and gave his retainers a goblet of wine. The retainers said to one another: 'If several of us drink it, it won't be enough; if one drinks it, there'll be some to spare. Let's each draw a snake on the ground; the first to finish drinks the wine.' One man finished his snake first. He picked up the wine and was about to drink, but holding the goblet in his left hand and drawing with his right, he said: 'I can give it feet.' Before he had finished, another man's snake was done. He snatched the goblet and said: 'A snake has no feet to begin with. How can you give it feet?' And he drank the wine. The man who drew feet on the snake lost his wine in the end." }
  - { es: "阿嫲又講：「楚國有個人拜完神，將一壺酒送畀幫佢做嘢嘅人。佢哋傾吓傾吓：幾個人飲就唔夠，一個人飲就有剩，不如大家喺地下畫條蛇，邊個最快畫好，就成壺酒歸佢。有個人好快畫完，攞起壺酒就想飲，但係佢見自己咁快，就得戚起嚟，左手揸住個壺，右手繼續畫，話：『我仲可以幫條蛇加埋對腳添！』佢未畫完，另一個人已經畫好咗，一手搶走個壺，話：『蛇本來就冇腳㗎，你點可以幫佢畫腳呀？』講完就飲晒啲酒。畫蛇腳嗰個，最後一啖都冇得飲。」", en: "Grandma goes on: 'A man in Chu finished making offerings to the gods and gave a pot of wine to the people who helped him. They talked it over: if several of them drank it there wouldn't be enough, if one drank it there'd be some left, so why not all draw a snake on the ground, and whoever finished first would get the whole pot. One man finished very quickly and picked up the wine to drink, but seeing how fast he was, he got cocky. Holding the pot in his left hand and carrying on drawing with his right, he said: \"I can even add a pair of feet to my snake!\" Before he'd finished, another man had completed his snake. He snatched the pot and said: \"Snakes don't have feet to begin with – how can you draw feet on one?\" And with that he drank all the wine. The man who drew the snake's feet didn't get a single mouthful.'" }
  - { es: "「所以『畫蛇添足』係話人做多咗啲唔需要嘅嘢，好心做壞事。例如你篇作文本來寫得好好，最後硬係要加多段大道理，反而搞到成篇文好囉嗦，噉就係畫蛇添足。」嘉樂諗咗一陣，問：「咁呢兩個成語有乜相同呀？」阿嫲話：「兩個都係講人自作聰明。一個以為唔使做嘢都有收穫，一個以為做多啲一定好。其實兩樣都唔啱。」", en: "'So \"drawing legs on a snake\" means doing more than is needed and spoiling things with good intentions. For example, your essay is well written, but at the end you insist on adding another paragraph of moralising, and that just makes the whole essay long-winded – that's drawing legs on a snake.' Ka-lok thinks for a while and asks: 'So what do the two idioms have in common?' Grandma says: 'Both are about people who think they're clever. One thinks he can get something without working, the other thinks doing more is always better. In fact both are wrong.'" }
  - { es: "阿嫲仲教佢點樣睇文言文：「你睇，『而』、『其』、『之』呢啲字，口語唔會講，但係喺古文成日見。『釋其耒』嘅『其』即係『佢嘅』；『飲之』嘅『之』即係『佢』，指嗰壺酒。『蛇固無足』，就係『蛇本來就冇腳』。四個字講晒，口語就要用成句。所以成語咁短，就係因為佢由文言文嚟，一個字頂得幾個字用。」", en: "Grandma also shows him how to read Classical Chinese: 'Look, words like 而, 其 and 之 aren't used in speech, but you see them all the time in classical texts. 其 in \"put down his plough\" means \"his\"; 之 in \"drink it\" means \"it\", the pot of wine. \"A snake has no feet to begin with\" takes four characters; in speech you need a whole sentence. That's why idioms are so short: they come from Classical Chinese, where one character does the work of several.'" }
  - { es: "嘉樂好快就寫好篇作文。佢寫自己以前考試之前唔溫書，淨係靠估題目，好似守株待兔噉；後來有一次估中咗，佢以為自己好叻，下次就更加唔溫，結果肥佬。寫到最後，佢本來想再加一段，講「做人要努力」嘅大道理，但係諗起阿嫲講嘅嘢，就停咗筆。佢笑住同阿嫲講：「我唔畫蛇添足喇！」", en: "Ka-lok soon finishes his essay. He writes about how he used to skip revising before exams and rely on guessing the questions, like waiting for rabbits by the stump; then once he guessed right, thought he was brilliant, revised even less the next time, and failed. At the end he was going to add another paragraph moralising about 'working hard in life', but remembering what Grandma said, he put down his pen. He grins at Grandma: 'I'm not drawing legs on the snake!'" }
questions:
  - { q: "宋國個耕田佬點解唔再耕田？", options: ["因為塊田畀人搶咗", "因為佢以為坐喺樹頭隔籬等，會再有兔仔撞死", "因為佢病咗，冇力耕田"], answer: 1, explain: "冀復得兔: he hoped to get another rabbit, so he abandoned his plough and guarded the stump." }
  - { q: "韓非講〈守株待兔〉，原本想批評乜嘢人？", options: ["唔識捉兔仔嘅人", "淨係識用舊方法治國，唔肯變通嘅人", "鍾意笑人嘅宋國人"], answer: 1, explain: "Han Fei uses the story to attack rulers who cling to the methods of the past in changed times." }
  - { q: "〈畫蛇添足〉入面，第一個畫完蛇嘅人點解冇酒飲？", options: ["因為佢幫條蛇畫腳，第二個人畫完就搶走咗壺酒", "因為佢畫得唔好睇", "因為壺酒唔夠一個人飲"], answer: 0, explain: "He stopped to add feet; meanwhile another man finished, argued that snakes have no feet, and drank the wine." }
  - { q: "「蛇固無足」嘅意思係？", options: ["條蛇好硬淨，冇腳都得", "蛇本來就冇腳", "蛇唔夠快，因為冇腳"], answer: 1, explain: "固 = 本來 (originally, of course), 無 = 冇, 足 = 腳." }
  - { q: "「釋其耒」入面，「其」用口語即係？", options: ["佢嘅", "呢個", "好多"], answer: 0, explain: "其 is the classical possessive pronoun 'his, its': 釋其耒 = 放低佢把犁." }
  - { q: "下面邊個情況最似「畫蛇添足」？", options: ["溫晒書先去考試", "篇作文寫得好好，最後硬加一段大道理，搞到好囉嗦", "坐喺度等運氣嚟"], answer: 1, explain: "Adding something unnecessary that spoils a finished piece of work is 畫蛇添足; waiting for luck is 守株待兔." }
