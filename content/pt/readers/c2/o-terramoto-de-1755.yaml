id: r.c2.o-terramoto-de-1755
level: c2
title: "Ensaio: a manhã em que Lisboa caiu"
kind: text
intro: "An essay in formal European Portuguese on the Lisbon earthquake of 1 November 1755 and its consequences for Portugal and for European thought. Notice the EP spelling (terramoto, facto, receção), the enclisis of written European norm, the occasional mesoclisis of elevated prose (dir-se-ia, far-se-ia) and the long, balanced periods of the essay genre."
allow: [edifícios, destruição, comercial, volumes, revolucionária, regular, regularidade, reconstrução, distribuir, assumir, direção, situada, pombalinos, marchar, rossio, lisboa, baixa, alfama, belém, terreiro, paço, tejo, pombal, marquês, sebastião, josé, carvalho, melo, voltaire, rousseau, kant, cândido, europa, marrocos, algarve, açores, madeira, brasil, igreja, carmo, pombalina, pombalino, gaiola]
paragraphs:
  - { es: "Na manhã de 1 de novembro de 1755, dia de Todos os Santos, Lisboa era uma das cidades mais ricas da Europa. O ouro do Brasil enchia os cofres da Coroa, as igrejas brilhavam de talha dourada e o porto recebia navios de todo o mundo. Por volta das nove e meia, enquanto grande parte da população assistia à missa, a terra tremeu durante vários minutos. Três abalos sucessivos bastaram para que boa parte da cidade se desfizesse em pó.", en: "On the morning of 1 November 1755, All Saints' Day, Lisbon was one of the richest cities in Europe. Brazilian gold filled the Crown's coffers, the churches gleamed with gilded woodcarving and the port received ships from all over the world. At about half past nine, while much of the population was at Mass, the earth shook for several minutes. Three successive shocks were enough for a large part of the city to crumble into dust." }
  - { es: "O que se seguiu dir-se-ia uma sucessão de castigos bíblicos. Os sobreviventes que fugiram para a beira do rio, julgando-se ali mais seguros, viram o Tejo recuar e, pouco depois, regressar sob a forma de ondas gigantescas que varreram a zona ribeirinha. Ao mesmo tempo, as velas acesas nas igrejas e nas casas provocaram incêndios que lavraram durante cinco dias. Calcula-se que tenham morrido dezenas de milhares de pessoas, embora os números exatos continuem a ser objeto de debate entre historiadores.", en: "What followed might be called a succession of biblical punishments. The survivors who fled to the riverside, thinking themselves safer there, saw the Tagus draw back and, shortly afterwards, return in the form of gigantic waves that swept the waterfront. At the same time, the candles lit in churches and houses started fires that raged for five days. It is estimated that tens of thousands of people died, although the exact figures are still the subject of debate among historians." }
  - { es: "A destruição foi quase total na Baixa, o centro comercial da cidade. Desapareceram o Paço Real, com a sua biblioteca de dezenas de milhares de volumes, a Ópera do Tejo, inaugurada poucos meses antes, e incontáveis arquivos, quadros e documentos. Alfama, construída sobre rocha mais firme, resistiu em grande parte, e é por isso que ainda hoje conserva o traçado medieval das suas ruelas. Das ruínas do Convento do Carmo, que nunca foi reconstruído, ergue-se até hoje a nave sem teto, aberta ao céu, como uma memória de pedra.", en: "The destruction was almost total in the Baixa, the city's commercial centre. The Royal Palace disappeared, with its library of tens of thousands of volumes, as did the Tagus Opera House, inaugurated only a few months before, and countless archives, paintings and documents. Alfama, built on firmer rock, largely survived, which is why it still keeps the medieval layout of its alleys. From the ruins of the Carmo Convent, which was never rebuilt, the roofless nave still rises today, open to the sky, like a memory in stone." }
  - { es: "Perante o caos, coube a Sebastião José de Carvalho e Melo, futuro Marquês de Pombal, assumir a direção da resposta. Atribui-se-lhe uma frase que resume a sua atitude: “Enterrar os mortos e cuidar dos vivos.” Mandou distribuir alimentos, controlar os preços, impedir pilhagens e, num gesto de notável modernidade, enviou a todas as paróquias do país um inquérito sobre o sismo: a que horas começara, quanto tempo durara, se o mar subira, que danos causara. Essas respostas fazem dele, segundo muitos, o pai da sismologia moderna.", en: "Faced with chaos, it fell to Sebastião José de Carvalho e Melo, the future Marquis of Pombal, to take charge of the response. A sentence is attributed to him that sums up his attitude: 'Bury the dead and care for the living.' He had food distributed, prices controlled and looting prevented and, in a gesture of remarkable modernity, he sent every parish in the country a questionnaire about the earthquake: at what time it had begun, how long it had lasted, whether the sea had risen, what damage it had caused. Those answers make him, in the view of many, the father of modern seismology." }
  - { es: "A reconstrução da Baixa foi igualmente revolucionária. Em vez de se refazer o emaranhado de ruas medievais, traçou-se uma malha regular de ruas largas e retas, entre o Rossio e o Terreiro do Paço, rebatizado Praça do Comércio. Os edifícios, de fachadas uniformes, foram construídos com uma estrutura interna de madeira, a chamada gaiola pombalina, concebida para oscilar sem ruir em caso de novo abalo. Conta-se que os engenheiros testaram os modelos pondo soldados a marchar à sua volta, para simular os efeitos de um terramoto.", en: "The rebuilding of the Baixa was equally revolutionary. Instead of remaking the tangle of medieval streets, a regular grid of wide, straight streets was laid out between the Rossio and the Terreiro do Paço, renamed Praça do Comércio. The buildings, with uniform façades, were constructed with an internal wooden frame, the so-called Pombaline cage, designed to sway without collapsing in the event of another shock. It is said that the engineers tested the models by having soldiers march around them to simulate the effects of an earthquake." }
  - { es: "O abalo, porém, não se fez sentir apenas no chão. Na Europa das Luzes, a catástrofe levantou uma pergunta incómoda: como conciliar a ideia de um Deus bom e de um mundo ordenado com a morte de milhares de inocentes, muitos deles dentro de igrejas, num dia santo? Voltaire escreveu um poema sobre o desastre e, anos mais tarde, ridicularizou no Cândido a tese de que vivemos “no melhor dos mundos possíveis”. Rousseau respondeu-lhe que a culpa não era da natureza, mas dos homens, que se amontoavam em cidades de casas altas. Kant, por sua vez, dedicou ao sismo alguns dos seus primeiros textos científicos.", en: "The shock, however, was not felt only in the ground. In the Europe of the Enlightenment, the catastrophe raised an awkward question: how could the idea of a good God and an ordered world be reconciled with the death of thousands of innocents, many of them inside churches, on a holy day? Voltaire wrote a poem about the disaster and, years later, ridiculed in Candide the thesis that we live 'in the best of all possible worlds'. Rousseau replied that the fault lay not with nature but with men, who crowded together in cities of tall houses. Kant, for his part, devoted some of his first scientific texts to the earthquake." }
  - { es: "Quem hoje passeia pela Baixa, entre esplanadas e lojas de recordações, dificilmente imagina que caminha sobre os escombros de uma outra cidade. E, no entanto, a lição de 1755 mantém-se atual. Lisboa continua situada numa zona de risco sísmico, e os especialistas lembram com regularidade que muitos edifícios modernos foram construídos com menos cuidado do que os pombalinos. Far-se-ia bem em recordar, de vez em quando, que a cidade mais bonita é também a que melhor se prepara para o dia em que a terra voltar a tremer.", en: "Anyone strolling through the Baixa today, among café terraces and souvenir shops, can hardly imagine they are walking on the rubble of another city. And yet the lesson of 1755 remains relevant. Lisbon is still located in an area of seismic risk, and experts regularly point out that many modern buildings were constructed with less care than the Pombaline ones. One would do well to remember, now and then, that the most beautiful city is also the one that best prepares for the day the earth shakes again." }
questions:
  - { q: "Porque é que muitas pessoas estavam nas igrejas quando o sismo começou?", options: ["Porque era domingo de Páscoa", "Porque havia uma festa real", "Porque era dia de Todos os Santos e assistiam à missa", "Porque estava a chover"], answer: 2, explain: "1 November 1755 was All Saints' Day; at 9.30 much of the population was at Mass." }
  - { q: "Que três desastres se sucederam, segundo o ensaio?", options: ["Sismo, tsunami e incêndios", "Sismo, peste e fome", "Cheia, guerra e incêndio", "Tempestade, sismo e seca"], answer: 0, explain: "The earthquake was followed by the Tagus waves that swept the riverside and by fires that burned for five days." }
  - { q: "Porque é que Alfama resistiu melhor do que a Baixa?", options: ["Porque tinha edifícios pombalinos", "Porque foi construída sobre rocha mais firme", "Porque estava vazia", "Porque fica longe do rio"], answer: 1, explain: "Firmer rock protected it — which is why it keeps its medieval alleys today." }
  - { q: "Porque se diz que Pombal foi um precursor da sismologia?", options: ["Porque previu o sismo", "Porque inventou a gaiola pombalina sozinho", "Porque enviou a todas as paróquias um inquérito sobre o sismo", "Porque estudou na Alemanha"], answer: 2, explain: "His questionnaire collected systematic data on timing, duration, the sea and the damage." }
  - { q: "Que debate filosófico o terramoto provocou na Europa?", options: ["Sobre o preço do ouro", "Sobre como conciliar um Deus bom e um mundo ordenado com a morte de inocentes", "Sobre a independência do Brasil", "Sobre a língua portuguesa"], answer: 1, explain: "Voltaire, Rousseau and Kant all responded; Voltaire mocked the idea of 'the best of all possible worlds'." }
  - { q: "Qual é a forma não mesoclítica de “dir-se-ia” e “far-se-ia”?", options: ["se diria / se faria", "diria-se / faria-se", "dizia-se / fazia-se", "diz-se / faz-se"], answer: 0, explain: "Mesoclisis splits the conditional around the pronoun (dir-se-ia); in everyday European and Brazilian Portuguese one says se diria, se faria. *Diria-se is incorrect in the norm." }
