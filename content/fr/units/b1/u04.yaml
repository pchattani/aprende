id: b1.u04
title: "Aix-en-Provence : je veux que tu viennes"
lessons:
  - id: b1.u04.l1
    title: Il faut que je finisse mes devoirs
    teach: [g.subjonctif-forms]
    tip: "Take the ils form of the present, drop -ent, add -e, -es, -e, -ions, -iez, -ent: ils finissent → que je finisse."
    vocab: [w.il-faut-que, w.études, w.examen, w.diplôme, w.licence, w.master, w.baccalauréat, w.note, w.matière, w.lycée, w.collège, w.fac, w.amphithéâtre, w.bibliothèque, w.résidence-universitaire, w.bourse, w.redoubler, w.échouer, w.apprendre-par-cœur, w.réussir-un-examen, w.passer-un-examen, w.devoirs, w.inscription, w.s-inscrire, w.universitaire, w.cité-universitaire, w.restaurant-universitaire, w.cantine, w.cafétéria, w.rentrée, w.emploi-du-temps, w.programme, w.leçon, w.niveau, w.syllabe]
    sentences:
      - { es: "Il faut que tu t'inscrives à la fac avant le 15 juillet.", en: "You have to enrol at uni before 15 July.", altEs: ["Il faut que tu t'inscrives à l'université avant le 15 juillet."], altEn: ["You need to sign up at university before 15 July."], grammar: [g.subjonctif-forms, g.subjonctif-necessite], vocab: [w.il-faut-que, w.s-inscrire, w.fac] }
      - { es: "Il faut que je finisse mes devoirs avant ce soir.", en: "I have to finish my homework before tonight.", altEs: ["Il faut que je termine mes devoirs avant ce soir."], grammar: [g.subjonctif-forms], vocab: [w.il-faut-que, w.devoirs], error: { wrong: "Il faut que je finis mes devoirs avant ce soir.", explain: "The subjonctif stem comes from ils finissent: que je finisse.", grammar: g.subjonctif-forms } }
      - { es: "Mes parents veulent que je prenne une chambre en résidence universitaire.", en: "My parents want me to take a room in a student residence.", altEs: ["Mes parents veulent que je prenne une chambre dans une résidence universitaire."], grammar: [g.subjonctif-forms, g.subjonctif-volonte], vocab: [w.résidence-universitaire] }
      - { es: "Il faut que nous parlions au professeur de la note de l'examen.", en: "We need to talk to the teacher about the exam mark.", altEs: ["Il faut qu'on parle au professeur de la note de l'examen."], grammar: [g.subjonctif-forms], vocab: [w.note, w.examen], transform: { instruction: "Change to 'vous'", answer: "Il faut que vous parliez au professeur de la note de l'examen.", alt: [], en: "You need to talk to the teacher about the exam mark." } }
      - { es: "Le prof veut que nous apprenions ce poème par cœur.", en: "The teacher wants us to learn this poem by heart.", altEs: ["Le professeur veut que nous apprenions ce poème par cœur.", "Le prof veut qu'on apprenne ce poème par cœur."], grammar: [g.subjonctif-forms, g.subjonctif-volonte], vocab: [w.apprendre-par-cœur] }
      - { es: "Il faut que tu révises toutes les matières pour le bac.", en: "You have to revise all the subjects for the bac.", altEs: ["Il faut que tu révises toutes les matières pour le baccalauréat."], grammar: [g.subjonctif-forms], vocab: [w.matière, w.baccalauréat] }
      - { es: "Il ne faut pas que tu échoues encore, sinon tu vas redoubler.", en: "You mustn't fail again, otherwise you'll repeat the year.", altEs: ["Il ne faut pas que tu échoues encore une fois, sinon tu vas redoubler."], grammar: [g.subjonctif-forms, g.subjonctif-necessite], vocab: [w.échouer, w.redoubler] }
      - { es: "Pour obtenir ta licence, il faut que tu réussisses tous tes examens.", en: "To get your bachelor's degree, you have to pass all your exams.", grammar: [g.subjonctif-forms], vocab: [w.licence, w.réussir-un-examen] }
      - { es: "Il est temps que nous partions : l'amphi ferme à vingt heures.", en: "It's time we left: the lecture hall closes at eight pm.", altEs: ["Il est temps qu'on parte : l'amphi ferme à vingt heures.", "Il est temps que nous partions : l'amphithéâtre ferme à vingt heures."], grammar: [g.subjonctif-forms], vocab: [w.amphithéâtre] }
      - { es: "Je préfère que tu viennes me chercher à la bibliothèque.", en: "I'd rather you came to pick me up at the library.", altEs: ["Je préfère que tu viennes me prendre à la bibliothèque."], grammar: [g.subjonctif-forms, g.subjonctif-volonte], vocab: [w.bibliothèque] }
      - { es: "Il faut que vous lisiez le programme avant la rentrée.", en: "You need to read the syllabus before the start of term.", grammar: [g.subjonctif-forms], vocab: [w.programme, w.rentrée] }
      - { es: "Le restaurant universitaire est moins cher que la cafétéria, mais il faut que tu arrives tôt.", en: "The university canteen is cheaper than the cafeteria, but you have to get there early.", altEs: ["Le resto U est moins cher que la cafétéria, mais il faut que tu arrives tôt."], grammar: [g.subjonctif-forms], vocab: [w.restaurant-universitaire, w.cafétéria] }
      - { es: "Il faut que je demande une bourse ; sinon, je ne pourrai pas faire de master.", en: "I have to apply for a grant; otherwise I won't be able to do a master's.", grammar: [g.subjonctif-forms], vocab: [w.bourse, w.master] }
      - { es: "Ma mère attend que je reçoive mon diplôme pour m'offrir une voiture.", en: "My mother is waiting for me to get my degree before giving me a car.", grammar: [g.subjonctif-forms, g.subjonctif-volonte], vocab: [w.diplôme] }
      - { es: "Tu dois prendre le bus de huit heures.", en: "You have to take the eight o'clock bus.", grammar: [g.subjonctif-forms], vocab: [], transform: { instruction: "Rewrite with il faut que", answer: "Il faut que tu prennes le bus de huit heures.", alt: [], en: "You have to take the eight o'clock bus." } }
      - { es: "Au collège, mes parents voulaient que je mange à la cantine.", en: "At secondary school, my parents wanted me to eat in the canteen.", grammar: [g.subjonctif-forms, g.subjonctif-volonte], vocab: [w.collège, w.cantine] }
    exchanges:
      - q: { es: "Qu'est-ce que je dois faire pour l'inscription ?", en: "What do I have to do to register?" }
        a: { es: "Il faut que tu remplisses ce document et que tu le rendes demain.", en: "You have to fill in this document and hand it in tomorrow." }
        alt: ["Il faut que tu remplisses ce document.", "Remplis ce document et rends-le demain."]
        grammar: [g.subjonctif-forms]
        vocab: [w.inscription]
      - q: { es: "Tu passes un examen demain ?", en: "Are you taking an exam tomorrow?" }
        a: { es: "Oui, il faut que je révise toute la nuit !", en: "Yes, I've got to revise all night!" }
        alt: ["Oui, en histoire.", "Non, la semaine prochaine."]
        grammar: [g.subjonctif-forms]
        vocab: [w.passer-un-examen]
      - q: { es: "Tu as reçu ton emploi du temps ?", en: "Have you got your timetable?" }
        a: { es: "Oui, mais il faut que je le regarde : il y a deux cours en même temps.", en: "Yes, but I need to look at it: there are two classes at the same time." }
        alt: ["Oui, hier.", "Non, pas encore."]
        grammar: [g.subjonctif-forms]
        vocab: [w.emploi-du-temps]
      - q: { es: "Tu manges à la cité universitaire ce soir ?", en: "Are you eating at the student halls tonight?" }
        a: { es: "Non, il faut que je parte tôt : je dîne chez mes parents.", en: "No, I have to leave early: I'm having dinner at my parents'." }
        alt: ["Oui, comme tous les soirs.", "Non, je mange au resto U."]
        grammar: [g.subjonctif-forms]
        vocab: [w.cité-universitaire]
      - q: { es: "Ton niveau en anglais est bon ?", en: "Is your English good?" }
        a: { es: "Pas assez : il faut que je prenne des leçons cet été.", en: "Not good enough: I need to take lessons this summer." }
        alt: ["Oui, assez bon.", "Non, il faut que je travaille."]
        grammar: [g.subjonctif-forms]
        vocab: [w.niveau, w.leçon]
      - q: { es: "Comment est-ce qu'on prononce ce mot ?", en: "How do you pronounce this word?" }
        a: { es: "Il faut que tu le lises syllabe par syllabe.", en: "You have to read it syllable by syllable." }
        alt: ["Lis-le syllabe par syllabe.", "Je ne sais pas, demande au prof."]
        grammar: [g.subjonctif-forms]
        vocab: [w.syllabe]
    texts:
      - title: "Message de la fac"
        es: ["Chers étudiants, la rentrée universitaire a lieu le 9 septembre.", "Il faut que vous finissiez votre inscription avant le 1er septembre.", "N'oubliez pas de regarder votre emploi du temps en ligne."]
        en: ["Dear students, the university year starts on 9 September.", "You must finish your registration before 1 September.", "Don't forget to check your timetable online."]
        grammar: [g.subjonctif-forms]
        vocab: [w.rentrée, w.universitaire, w.inscription, w.emploi-du-temps]
      - title: "Conseils d'une étudiante"
        es: ["Au lycée, mes profs me disaient : « Il faut que tu travailles plus. »", "À la fac, personne ne te le dit : il faut que tu t'organises seul.", "Moi, je fais mes études à la bibliothèque tous les matins."]
        en: ["At school, my teachers used to tell me: 'You need to work harder.'", "At uni, nobody tells you: you have to organise yourself.", "I study at the library every morning."]
        grammar: [g.subjonctif-forms]
        vocab: [w.lycée, w.fac, w.études, w.bibliothèque]
    spicy:
      - { es: "Il faut que tu m'expliques comment on peut être aussi beau dans un amphi à huit heures du matin.", en: "You have to explain to me how anyone can look so good in a lecture hall at eight in the morning.", altEs: ["Il faut que tu m'expliques comment on peut être aussi belle dans un amphi à huit heures du matin."], grammar: [g.subjonctif-forms], vocab: [w.amphithéâtre] }
      - { es: "Il faut que je révise... mais il faut aussi que je prenne un café avec toi.", en: "I have to revise... but I also have to have a coffee with you.", grammar: [g.subjonctif-forms] }
      - { es: "Ma note en maths est mauvaise, mais celle que je te donne, c'est vingt sur vingt.", en: "My maths mark is bad, but the one I give you is twenty out of twenty.", grammar: [g.demonstrative-pronouns], vocab: [w.note] }
      - { es: "Il faut que tu choisisses : moi ou la bibliothèque.", en: "You have to choose: me or the library.", grammar: [g.subjonctif-forms], vocab: [w.bibliothèque] }
      - { es: "Il faut que nous parlions... de préférence autour d'un verre, ce soir.", en: "We need to talk... preferably over a drink, tonight.", grammar: [g.subjonctif-forms] }
  - id: b1.u04.l2
    title: Mes parents veulent que je sois médecin
    teach: [g.subjonctif-irregular]
    tip: "Learn these by heart: que je sois, que j'aie, que j'aille, que je fasse, que je puisse, que je sache, que je veuille."
    vocab: [w.famille-nombreuse, w.s-entendre-bien, w.élever, w.éducation, w.génération, w.indépendant, w.autonome, w.majeur, w.mineur, w.gâté, w.fier, w.déçu, w.déception, w.espoir, w.pression, w.stress, w.stressé, w.pourvu-que, w.cahier, w.stylo, w.crayon, w.gomme, w.règle, w.trousse, w.dictionnaire, w.chercheur, w.recherche, w.savant, w.thèse]
    sentences:
      - { es: "Mes parents veulent que je fasse des études de médecine.", en: "My parents want me to study medicine.", altEs: ["Mes parents veulent que je fasse médecine."], grammar: [g.subjonctif-irregular, g.subjonctif-volonte], vocab: [w.études], error: { wrong: "Mes parents veulent que je fais des études de médecine.", explain: "faire has an irregular subjonctif: que je fasse.", grammar: g.subjonctif-irregular } }
      - { es: "Ma mère veut que je sois indépendante, mais elle m'appelle tous les jours.", en: "My mother wants me to be independent, but she calls me every day.", altEs: ["Ma mère veut que je sois indépendant, mais elle m'appelle tous les jours."], grammar: [g.subjonctif-irregular], vocab: [w.indépendant] }
      - { es: "Il faut que tu aies ton bac pour t'inscrire à la fac.", en: "You need to have your bac to enrol at uni.", altEs: ["Il faut que tu aies ton baccalauréat pour t'inscrire à la fac."], grammar: [g.subjonctif-irregular], vocab: [w.baccalauréat, w.s-inscrire] }
      - { es: "Il faut que j'aille à la bibliothèque pour mes recherches.", en: "I have to go to the library for my research.", altEs: ["Il faut que j'aille à la bibliothèque pour faire mes recherches."], grammar: [g.subjonctif-irregular], vocab: [w.recherche, w.bibliothèque] }
      - { es: "Mon père souhaite que nous soyons plus autonomes.", en: "My father wishes we were more independent.", altEs: ["Mon père aimerait que nous soyons plus autonomes."], altEn: ["My father wants us to be more independent."], grammar: [g.subjonctif-irregular, g.subjonctif-volonte], vocab: [w.autonome] }
      - { es: "Dans une famille nombreuse, il faut que chacun sache partager.", en: "In a large family, everyone has to know how to share.", grammar: [g.subjonctif-irregular], vocab: [w.famille-nombreuse] }
      - { es: "Ma grand-mère veut que nous allions la voir tous les dimanches.", en: "My grandmother wants us to go and see her every Sunday.", altEs: ["Ma grand-mère veut qu'on aille la voir tous les dimanches."], grammar: [g.subjonctif-irregular], vocab: [], transform: { instruction: "Change 'nous' to 'tu'", answer: "Ma grand-mère veut que tu ailles la voir tous les dimanches.", alt: [], en: "My grandmother wants you to go and see her every Sunday." } }
      - { es: "Mon fils est majeur : je veux qu'il puisse prendre ses propres décisions.", en: "My son is an adult: I want him to be able to make his own decisions.", grammar: [g.subjonctif-irregular], vocab: [w.majeur] }
      - { es: "Pourvu qu'il fasse beau pour la fête de famille !", en: "Let's hope it's nice weather for the family party!", altEs: ["Pourvu qu'il fasse beau pour la fête de la famille !"], grammar: [g.subjonctif-irregular], vocab: [w.pourvu-que] }
      - { es: "Mes parents sont fiers de moi ; ils ne veulent pas que j'aie trop de pression.", en: "My parents are proud of me; they don't want me to be under too much pressure.", grammar: [g.subjonctif-irregular], vocab: [w.fier, w.pression] }
      - { es: "Elle a été élevée par sa grand-mère, qui voulait qu'elle ait une bonne éducation.", en: "She was brought up by her grandmother, who wanted her to have a good education.", grammar: [g.subjonctif-irregular], vocab: [w.élever, w.éducation] }
      - { es: "Je ne veux pas que tu sois stressé : le stress, c'est mauvais pour la santé.", en: "I don't want you to be stressed: stress is bad for your health.", altEs: ["Je ne veux pas que tu sois stressée : le stress, c'est mauvais pour la santé."], grammar: [g.subjonctif-irregular], vocab: [w.stressé, w.stress] }
      - { es: "Je ne veux pas que mes enfants soient gâtés.", en: "I don't want my children to be spoilt.", altEs: ["Je ne veux pas que mes enfants soient trop gâtés."], grammar: [g.subjonctif-irregular], vocab: [w.gâté] }
      - { es: "Mon directeur de thèse veut que je sois plus rapide.", en: "My thesis supervisor wants me to be faster.", grammar: [g.subjonctif-irregular], vocab: [w.thèse] }
      - { es: "Tu veux que je te prête un stylo ? J'ai aussi un crayon et une gomme dans ma trousse.", en: "Do you want me to lend you a pen? I've also got a pencil and a rubber in my pencil case.", altEn: ["Do you want me to lend you a pen? I've also got a pencil and an eraser in my pencil case."], grammar: [g.subjonctif-volonte], vocab: [w.stylo, w.crayon, w.gomme, w.trousse] }
      - { es: "Tu es à l'heure.", en: "You're on time.", grammar: [g.subjonctif-irregular], vocab: [], transform: { instruction: "Start with Il faut que…", answer: "Il faut que tu sois à l'heure.", alt: [], en: "You have to be on time." } }
    exchanges:
      - q: { es: "Tes parents veulent que tu fasses quoi plus tard ?", en: "What do your parents want you to do later on?" }
        a: { es: "Ils veulent que je sois médecin, comme eux.", en: "They want me to be a doctor, like them." }
        alt: ["Ils veulent que je sois heureux, c'est tout.", "Ils veulent que je reprenne le restaurant."]
        grammar: [g.subjonctif-irregular]
        vocab: []
      - q: { es: "Tu t'entends bien avec tes parents ?", en: "Do you get on well with your parents?" }
        a: { es: "Oui, très bien, même si on n'est pas de la même génération !", en: "Yes, very well, even though we're not from the same generation!" }
        alt: ["Oui, très bien.", "Pas toujours."]
        grammar: [g.subjonctif-irregular]
        vocab: [w.s-entendre-bien, w.génération]
      - q: { es: "Tu as besoin de quelque chose pour l'examen ?", en: "Do you need anything for the exam?" }
        a: { es: "Oui, il faut que j'aie un dictionnaire, une règle et un cahier.", en: "Yes, I need to have a dictionary, a ruler and an exercise book." }
        alt: ["Non, j'ai tout.", "Juste un stylo."]
        grammar: [g.subjonctif-irregular]
        vocab: [w.dictionnaire, w.règle, w.cahier]
      - q: { es: "Tes parents sont déçus de tes notes ?", en: "Are your parents disappointed with your marks?" }
        a: { es: "Un peu ; ils veulent que je fasse mieux l'année prochaine.", en: "A bit; they want me to do better next year." }
        alt: ["Non, ils sont fiers de moi.", "Oui, c'est une grosse déception."]
        grammar: [g.subjonctif-irregular]
        vocab: [w.déçu, w.déception]
      - q: { es: "Ta fille peut voter ?", en: "Can your daughter vote?" }
        a: { es: "Non, elle est encore mineure : elle a seize ans.", en: "No, she's still under age: she's sixteen." }
        alt: ["Oui, elle est majeure depuis mars.", "Pas encore."]
        grammar: [g.subjonctif-irregular]
        vocab: [w.mineur, w.majeur]
    texts:
      - title: "Lettre de ma mère"
        es: ["Ma grande, je veux que tu sois heureuse à Aix.", "Il faut que tu fasses attention à ton argent.", "Et pourvu que tu aies le temps de nous appeler le dimanche !"]
        en: ["My darling girl, I want you to be happy in Aix.", "You need to be careful with your money.", "And let's hope you have time to call us on Sundays!"]
        grammar: [g.subjonctif-irregular]
        vocab: [w.pourvu-que]
      - title: "Mon oncle"
        es: ["Mon oncle est chercheur à l'université.", "C'est un vrai savant : il veut que ses étudiants sachent tout sur les pierres de la Sainte-Victoire.", "Il a beaucoup d'espoir pour sa nouvelle recherche."]
        en: ["My uncle is a researcher at the university.", "He's a real scholar: he wants his students to know everything about the rocks of the Sainte-Victoire.", "He has high hopes for his new research."]
        grammar: [g.subjonctif-irregular]
        vocab: [w.chercheur, w.savant, w.espoir, w.recherche]
    spicy:
      - { es: "Je veux que tu sois honnête : tu es venu pour le nougat ou pour moi ?", en: "I want you to be honest: did you come for the nougat or for me?", altEs: ["Je veux que tu sois honnête : tu es venue pour le nougat ou pour moi ?"], grammar: [g.subjonctif-irregular], vocab: [w.nougat] }
      - { es: "Il faut que tu saches une chose : je danse mal, mais avec passion.", en: "There's one thing you need to know: I dance badly, but with passion.", grammar: [g.subjonctif-irregular] }
      - { es: "Ma mère veut que j'aie un copain sérieux ; moi, je veux un copain drôle.", en: "My mother wants me to have a serious boyfriend; I want a funny boyfriend.", altEs: ["Ma mère veut que j'aie une copine sérieuse ; moi, je veux une copine drôle."], grammar: [g.subjonctif-irregular] }
      - { es: "Pourvu qu'il n'ait pas de copine... et qu'il sache faire la cuisine !", en: "Let's hope he doesn't have a girlfriend... and that he can cook!", altEs: ["Pourvu qu'elle n'ait pas de copain... et qu'elle sache faire la cuisine !"], grammar: [g.subjonctif-irregular], vocab: [w.pourvu-que] }
      - { es: "Il faut que j'aille me changer : on ne dîne pas avec toi en jean.", en: "I have to go and get changed: you don't have dinner with you in jeans.", grammar: [g.subjonctif-irregular] }
  - id: b1.u04.l3
    title: Je veux que tu viennes au marché
    teach: [g.subjonctif-volonte]
    tip: "When you want someone else to do something: vouloir / préférer / aimer que + subjonctif. But espérer que + indicative."
    vocab: [w.aquarelle, w.platane, w.fontaine, w.bordé, w.atelier, w.herbes-de-provence, w.tapenade, w.nougat, w.melon, w.pastèque, w.abricot, w.figue, w.amande, w.noix, w.courgette, w.aubergine, w.poivron, w.haricot, w.petits-pois, w.champignon, w.épinards, w.autrement, w.posséder]
    sentences:
      - { es: "Je veux que tu viennes avec moi au marché d'Aix samedi.", en: "I want you to come with me to the Aix market on Saturday.", altEs: ["Je veux que tu viennes au marché d'Aix avec moi samedi."], grammar: [g.subjonctif-volonte], vocab: [], error: { wrong: "Je veux que tu viens avec moi au marché d'Aix samedi.", explain: "vouloir que + subjonctif: que tu viennes.", grammar: g.subjonctif-volonte } }
      - { es: "Ma mère veut que j'achète des herbes de Provence et de la tapenade.", en: "My mother wants me to buy some herbes de Provence and some tapenade.", grammar: [g.subjonctif-volonte], vocab: [w.herbes-de-provence, w.tapenade] }
      - { es: "Le vendeur préfère qu'on goûte ses melons avant de les acheter.", en: "The stallholder prefers people to taste his melons before buying them.", altEs: ["Le vendeur préfère que l'on goûte ses melons avant de les acheter."], grammar: [g.subjonctif-volonte], vocab: [w.melon] }
      - { es: "Des abricots ? J'aimerais que vous me choisissiez les plus beaux.", en: "Apricots? I'd like you to choose the best ones for me.", altEs: ["Des abricots ? J'aimerais que vous me choisissiez les meilleurs."], grammar: [g.subjonctif-volonte, g.subjonctif-forms], vocab: [w.abricot] }
      - { es: "Cézanne voulait qu'on regarde la nature autrement.", en: "Cézanne wanted people to look at nature differently.", grammar: [g.subjonctif-volonte], vocab: [w.autrement] }
      - { es: "Le guide souhaite que nous visitions l'atelier de Cézanne avant midi.", en: "The guide would like us to visit Cézanne's studio before noon.", altEs: ["Le guide aimerait que nous visitions l'atelier de Cézanne avant midi."], grammar: [g.subjonctif-volonte], vocab: [w.atelier] }
      - { es: "Mon prof d'art veut que je peigne une aquarelle par semaine.", en: "My art teacher wants me to paint one watercolour a week.", grammar: [g.subjonctif-volonte], vocab: [w.aquarelle] }
      - { es: "Je ne veux pas que tu achètes de pastèque : elle est trop lourde à porter.", en: "I don't want you to buy a watermelon: it's too heavy to carry.", grammar: [g.subjonctif-volonte], vocab: [w.pastèque, w.lourd] }
      - { es: "Tu veux que je fasse une ratatouille ? Il me faut des courgettes, des aubergines et des poivrons.", en: "Do you want me to make a ratatouille? I need courgettes, aubergines and peppers.", altEn: ["Do you want me to make ratatouille? I need zucchini, eggplant and peppers."], grammar: [g.subjonctif-volonte, g.subjonctif-irregular], vocab: [w.courgette, w.aubergine, w.poivron] }
      - { es: "Ils aimeraient que nous dînions sur une terrasse du cours Mirabeau, sous les platanes.", en: "They'd like us to have dinner on a terrace on the Cours Mirabeau, under the plane trees.", grammar: [g.subjonctif-volonte], vocab: [w.platane] }
      - { es: "Le vendeur refuse que je paie par carte pour une seule figue !", en: "The stallholder won't let me pay by card for a single fig!", altEn: ["The seller refuses to let me pay by card for one fig!"], grammar: [g.subjonctif-volonte], vocab: [w.figue] }
      - { es: "Qu'est-ce que tu veux que je t'achète au marché ? Du nougat ? Des amandes ?", en: "What do you want me to buy you at the market? Nougat? Almonds?", altEs: ["Tu veux que je t'achète quoi au marché ? Du nougat ? Des amandes ?"], grammar: [g.subjonctif-volonte], vocab: [w.nougat, w.amande] }
      - { es: "J'espère que tu viendras voir les fontaines d'Aix.", en: "I hope you'll come and see the fountains of Aix.", grammar: [g.subjonctif-volonte], vocab: [w.fontaine], error: { wrong: "J'espère que tu viennes voir les fontaines d'Aix.", explain: "espérer que takes the indicative (tu viendras), not the subjonctif.", grammar: g.subjonctif-volonte } }
      - { es: "Ma grand-mère veut que je mange des épinards, des haricots et des petits pois.", en: "My grandmother wants me to eat spinach, beans and peas.", grammar: [g.subjonctif-volonte], vocab: [w.épinards, w.haricot, w.petits-pois] }
      - { es: "Tu viens à Aix.", en: "You're coming to Aix.", grammar: [g.subjonctif-volonte], vocab: [], transform: { instruction: "Start with Je veux que…", answer: "Je veux que tu viennes à Aix.", alt: [], en: "I want you to come to Aix." } }
      - { es: "Vous prenez des champignons et des noix.", en: "You're taking mushrooms and walnuts.", grammar: [g.subjonctif-volonte], vocab: [w.champignon, w.noix], transform: { instruction: "Start with Elle aimerait que…", answer: "Elle aimerait que vous preniez des champignons et des noix.", alt: [], en: "She'd like you to take mushrooms and walnuts." } }
    exchanges:
      - q: { es: "Tu veux que je vienne avec toi au marché ?", en: "Do you want me to come to the market with you?" }
        a: { es: "Oui, j'aimerais bien que tu m'aides à porter les sacs.", en: "Yes, I'd really like you to help me carry the bags." }
        alt: ["Oui, viens !", "Non merci, je préfère y aller seul."]
        grammar: [g.subjonctif-volonte]
        vocab: []
      - q: { es: "Vous voulez que je vous les choisisse ?", en: "Do you want me to choose them for you?" }
        a: { es: "Oui, je préfère que vous les choisissiez pour moi.", en: "Yes, I'd rather you chose them for me." }
        alt: ["Non merci, je les prends moi-même.", "Oui, s'il vous plaît."]
        grammar: [g.subjonctif-volonte, g.double-object-pronouns]
        vocab: []
      - q: { es: "Pourquoi Cézanne peignait-il toujours la même montagne ?", en: "Why did Cézanne always paint the same mountain?" }
        a: { es: "Il voulait qu'on la voie autrement, à chaque saison.", en: "He wanted people to see it differently, in every season." }
        alt: ["Parce qu'il l'aimait.", "Parce qu'elle changeait tout le temps."]
        grammar: [g.subjonctif-volonte]
        vocab: [w.autrement]
      - q: { es: "Tu veux que je fasse une tapenade pour l'apéro ?", en: "Do you want me to make a tapenade for the drinks?" }
        a: { es: "Oh oui ! Et j'aimerais que tu apportes aussi du melon.", en: "Oh yes! And I'd like you to bring some melon too." }
        alt: ["Oui, bonne idée !", "Non, j'en ai déjà une."]
        grammar: [g.subjonctif-volonte]
        vocab: [w.tapenade, w.melon]
      - q: { es: "Ton père accepte que tu partes vivre à Aix ?", en: "Is your father OK with you going to live in Aix?" }
        a: { es: "Oui, mais il veut que je l'appelle chaque semaine.", en: "Yes, but he wants me to call him every week." }
        alt: ["Oui, il est d'accord.", "Non, il préfère que je reste à Marseille."]
        grammar: [g.subjonctif-volonte]
        vocab: []
    texts:
      - title: "Liste de maman"
        es: ["Je voudrais que tu achètes des courgettes et des aubergines.", "Je préfère que tu prennes les tomates chez Madame Roux.", "Et je ne veux pas que tu oublies le nougat pour ta grand-mère !"]
        en: ["I'd like you to buy courgettes and aubergines.", "I'd rather you got the tomatoes from Madame Roux.", "And I don't want you to forget the nougat for your grandmother!"]
        grammar: [g.subjonctif-volonte]
        vocab: [w.courgette, w.aubergine, w.nougat]
      - title: "Cézanne à Aix"
        es: ["La famille de Cézanne possédait une grande maison près d'Aix, le Jas de Bouffan.", "Plus tard, le peintre a fait construire un atelier au nord de la ville.", "Aujourd'hui, on peut encore le visiter."]
        en: ["Cézanne's family owned a large house near Aix, the Jas de Bouffan.", "Later, the painter had a studio built to the north of the town.", "Today you can still visit it."]
        grammar: [g.subjonctif-volonte]
        vocab: [w.posséder, w.atelier]
    spicy:
      - { es: "Je veux que tu me regardes comme Cézanne regardait sa montagne.", en: "I want you to look at me the way Cézanne looked at his mountain.", grammar: [g.subjonctif-volonte] }
      - { es: "J'aimerais que tu me fasses goûter ta tapenade... et après, on verra.", en: "I'd like you to let me taste your tapenade... and then we'll see.", grammar: [g.subjonctif-volonte, g.subjonctif-irregular], vocab: [w.tapenade] }
      - { es: "Le vendeur de melons veut que je revienne demain. Je crois que ce n'est pas pour les melons.", en: "The melon seller wants me to come back tomorrow. I don't think it's for the melons.", grammar: [g.subjonctif-volonte], vocab: [w.melon] }
      - { es: "Je préfère que tu m'offres des figues plutôt que des fleurs.", en: "I'd rather you gave me figs than flowers.", grammar: [g.subjonctif-volonte], vocab: [w.figue] }
      - { es: "Tu veux que je t'emmène dîner sous les platanes du cours Mirabeau ?", en: "Do you want me to take you to dinner under the plane trees on the Cours Mirabeau?", grammar: [g.subjonctif-volonte], vocab: [w.platane] }
  - id: b1.u04.l4
    title: Ils exigent que je sois rentrée à minuit
    teach: [g.subjonctif-volonte, g.subjonctif-forms]
    tip: "Asking, demanding, accepting and refusing take que + subjonctif: exiger que, accepter que, refuser que, insister pour que, douter que."
    vocab: [w.exiger, w.doute, w.sans-doute, w.douter, w.attente, w.attendre-de, w.permission, w.autoriser, w.interdire, w.empêcher, w.insister, w.obliger, w.volonté, w.avoir-hâte, w.hâte]
    sentences:
      - { es: "La directrice exige que les étudiants rendent leur travail avant juin.", en: "The head of department demands that the students hand in their work before June.", grammar: [g.subjonctif-volonte], vocab: [w.exiger] }
      - { es: "Mes parents refusent que je parte en vacances seule.", en: "My parents won't let me go on holiday alone.", altEs: ["Mes parents refusent que je parte en vacances seul."], altEn: ["My parents refuse to let me go on holiday on my own."], grammar: [g.subjonctif-volonte, g.subjonctif-forms], vocab: [] }
      - { es: "J'insiste pour que tu viennes dîner avec nous.", en: "I insist that you come and have dinner with us.", altEs: ["J'insiste pour que tu viennes dîner chez nous."], grammar: [g.subjonctif-volonte], vocab: [w.insister] }
      - { es: "Je doute que le musée soit ouvert le lundi.", en: "I doubt the museum is open on Mondays.", grammar: [g.subjonctif-volonte, g.subjonctif-irregular], vocab: [w.douter] }
      - { es: "Elle viendra sans doute, mais je préfère qu'elle m'envoie un message.", en: "She'll probably come, but I'd rather she sent me a message.", grammar: [g.subjonctif-volonte], vocab: [w.sans-doute] }
      - { es: "La résidence interdit qu'on reçoive des invités après vingt-deux heures.", en: "The residence forbids having guests after ten pm.", grammar: [g.subjonctif-volonte, g.subjonctif-forms], vocab: [w.interdire, w.invité] }
      - { es: "Mes parents m'autorisent à sortir, mais ils veulent que je rentre avant minuit.", en: "My parents allow me to go out, but they want me home before midnight.", grammar: [g.subjonctif-volonte], vocab: [w.autoriser] }
      - { es: "Personne ne peut t'obliger à faire ce que tu ne veux pas.", en: "Nobody can force you to do what you don't want to.", grammar: [g.ce-qui-ce-que], vocab: [w.obliger] }
      - { es: "Qu'est-ce que tes parents attendent de toi ? — Ils attendent que je finisse mes études.", en: "What do your parents expect of you? — They're waiting for me to finish my studies.", grammar: [g.subjonctif-volonte, g.subjonctif-forms], vocab: [w.attendre-de, w.études] }
      - { es: "J'ai hâte que tu voies Aix au printemps !", en: "I can't wait for you to see Aix in the spring!", grammar: [g.subjonctif-volonte, g.subjonctif-forms], vocab: [w.avoir-hâte] }
      - { es: "Ce n'est pas une question de volonté : je veux que tu comprennes que je suis fatigué.", en: "It's not a question of willpower: I want you to understand that I'm tired.", altEs: ["Ce n'est pas une question de volonté : je veux que tu comprennes que je suis fatiguée."], grammar: [g.subjonctif-volonte], vocab: [w.volonté] }
      - { es: "La pluie ne nous empêche pas d'aller au marché.", en: "The rain doesn't stop us going to the market.", grammar: [g.verbs-prepositions], vocab: [w.empêcher] }
      - { es: "Tu as la permission de tes parents ? Ils acceptent que tu dormes chez nous ?", en: "Have you got your parents' permission? Are they OK with you sleeping at our place?", grammar: [g.subjonctif-volonte, g.subjonctif-forms], vocab: [w.permission] }
      - { es: "Le patron veut que nous travaillions samedi.", en: "The boss wants us to work on Saturday.", altEs: ["Le patron veut qu'on travaille samedi."], grammar: [g.subjonctif-forms, g.subjonctif-volonte], vocab: [w.patron], error: { wrong: "Le patron veut que nous travaillons samedi.", explain: "The nous form of the subjonctif ends in -ions: que nous travaillions.", grammar: g.subjonctif-forms } }
      - { es: "Tu dis la vérité.", en: "You're telling the truth.", grammar: [g.subjonctif-volonte], vocab: [], transform: { instruction: "Start with Je veux que…", answer: "Je veux que tu dises la vérité.", alt: [], en: "I want you to tell the truth." } }
      - { es: "Ils font du bruit.", en: "They're making noise.", grammar: [g.subjonctif-volonte], vocab: [], transform: { instruction: "Start with Je refuse qu'…", answer: "Je refuse qu'ils fassent du bruit.", alt: [], en: "I won't have them making noise." } }
    exchanges:
      - q: { es: "Tes parents te laissent sortir ce soir ?", en: "Are your parents letting you go out tonight?" }
        a: { es: "Oui, mais ils exigent que je rentre avant minuit.", en: "Yes, but they insist I'm home before midnight." }
        alt: ["Oui, sans problème.", "Non, ils refusent que je sorte."]
        grammar: [g.subjonctif-volonte]
        vocab: [w.exiger]
      - q: { es: "Tu crois qu'il va venir ?", en: "Do you think he's going to come?" }
        a: { es: "J'en doute ; il a beaucoup de travail.", en: "I doubt it; he's got a lot of work." }
        alt: ["Sans doute.", "Je doute qu'il vienne."]
        grammar: [g.subjonctif-volonte]
        vocab: [w.douter, w.sans-doute]
      - q: { es: "Tu as hâte de partir ?", en: "Are you looking forward to leaving?" }
        a: { es: "Oui, j'ai hâte que les vacances commencent !", en: "Yes, I can't wait for the holidays to start!" }
        alt: ["Oui, très hâte !", "Pas vraiment."]
        grammar: [g.subjonctif-volonte]
        vocab: [w.avoir-hâte, w.hâte]
      - q: { es: "On peut fumer ici ?", en: "Can we smoke here?" }
        a: { es: "Non, la résidence interdit qu'on fume dans les chambres.", en: "No, the residence doesn't allow smoking in the rooms." }
        alt: ["Non, c'est interdit.", "Oui, sur le balcon."]
        grammar: [g.subjonctif-volonte]
        vocab: [w.interdire]
      - q: { es: "Pourquoi tu insistes ?", en: "Why are you insisting?" }
        a: { es: "Parce que je veux vraiment que tu sois là samedi !", en: "Because I really want you to be there on Saturday!" }
        alt: ["Parce que c'est important pour moi.", "Parce que j'ai besoin de toi."]
        grammar: [g.subjonctif-volonte, g.subjonctif-irregular]
        vocab: [w.insister]
      - q: { es: "Il y a un doute sur la date de l'examen ?", en: "Is there any doubt about the date of the exam?" }
        a: { es: "Aucun doute : il a lieu lundi, après une longue attente.", en: "No doubt at all: it's on Monday, after a long wait." }
        alt: ["Non, c'est lundi.", "Oui, demande au prof."]
        grammar: [g.subjonctif-volonte]
        vocab: [w.doute, w.attente]
    texts:
      - title: "Règlement de la résidence"
        es: ["La direction exige que chaque étudiant paie son loyer avant le 5 du mois.", "Elle interdit qu'on fasse du bruit après vingt-deux heures.", "Elle demande que les cuisines soient propres."]
        en: ["The management requires every student to pay their rent before the 5th of the month.", "It forbids making noise after ten pm.", "It asks for the kitchens to be kept clean."]
        grammar: [g.subjonctif-volonte, g.subjonctif-irregular]
        vocab: [w.exiger, w.interdire]
      - title: "SMS de Lucas"
        es: ["J'ai hâte que tu arrives à Aix !", "Mes parents insistent pour que tu dormes chez nous.", "Ils veulent que tu goûtes le nougat de ma grand-mère."]
        en: ["I can't wait for you to get to Aix!", "My parents insist that you sleep at our place.", "They want you to taste my grandmother's nougat."]
        grammar: [g.subjonctif-volonte]
        vocab: [w.avoir-hâte, w.insister, w.nougat]
    spicy:
      - { es: "J'exige que tu me rappelles... dans les cinq minutes.", en: "I demand that you call me back... within five minutes.", grammar: [g.subjonctif-volonte], vocab: [w.exiger] }
      - { es: "Je doute que tu saches danser, mais je veux que tu essaies avec moi.", en: "I doubt you can dance, but I want you to try with me.", grammar: [g.subjonctif-volonte, g.subjonctif-irregular], vocab: [w.douter] }
      - { es: "J'ai hâte que tu me présentes à tes amis... et à ton chien.", en: "I can't wait for you to introduce me to your friends... and to your dog.", grammar: [g.subjonctif-volonte], vocab: [w.avoir-hâte] }
      - { es: "Ma mère interdit que je sorte avec quelqu'un qui ne sait pas cuisiner. Tu sais faire des pâtes ?", en: "My mother won't let me go out with someone who can't cook. Can you make pasta?", grammar: [g.subjonctif-volonte], vocab: [w.interdire] }
      - { es: "Je ne veux obliger personne, mais j'insiste pour que tu m'offres un verre.", en: "I don't want to force anyone, but I insist that you buy me a drink.", grammar: [g.subjonctif-volonte], vocab: [w.obliger, w.insister] }
dialogues:
  - id: b1.u04.d1
    title: Première semaine à Aix
    context: Manon has just moved into student halls in Aix. Her mother calls.
    lines:
      - { speaker: La mère, es: "Alors, ma grande, tu es bien arrivée à Aix ?", en: "So, sweetheart, did you get to Aix all right?" }
      - { speaker: Manon, es: "Oui, maman. La résidence universitaire est petite, mais elle est près de la fac.", en: "Yes, Mum. The student residence is small, but it's near the university." }
      - { speaker: La mère, es: "Bien. Je veux que tu m'appelles tous les dimanches, d'accord ?", en: "Good. I want you to call me every Sunday, all right?" }
      - { speaker: Manon, es: "Promis. Mais il faut que tu acceptes que je sois indépendante maintenant !", en: "Promise. But you have to accept that I'm independent now!" }
      - { speaker: La mère, es: "Bien sûr. Ton père veut juste que tu réussisses tes examens.", en: "Of course. Your father just wants you to pass your exams." }
      - { speaker: Manon, es: "Je sais. Demain, il faut que j'aille à la bibliothèque pour mon inscription.", en: "I know. Tomorrow I have to go to the library to register." }
      - { speaker: La mère, es: "Et le week-end, qu'est-ce que tu vas faire ?", en: "And at the weekend, what are you going to do?" }
      - { speaker: Manon, es: "Lucas veut que je vienne au marché avec lui, puis on va voir l'atelier de Cézanne.", en: "Lucas wants me to come to the market with him, then we're going to see Cézanne's studio." }
      - { speaker: La mère, es: "Lucas ? Qui est Lucas ? J'aimerais bien que tu me le présentes...", en: "Lucas? Who's Lucas? I'd really like you to introduce him to me..." }
      - { speaker: Manon, es: "Maman ! C'est un camarade de classe, c'est tout.", en: "Mum! He's a classmate, that's all." }
    questions:
      - { q: "Où est la résidence de Manon ?", options: ["Près de la fac", "Au centre de Marseille", "Loin de tout"], answer: 0, explain: "« elle est près de la fac »." }
      - { q: "Qu'est-ce que la mère de Manon veut ?", options: ["Qu'elle rentre à la maison", "Qu'elle l'appelle tous les dimanches", "Qu'elle change de fac"], answer: 1, explain: "« Je veux que tu m'appelles tous les dimanches »." }
      - { q: "Qu'est-ce que Manon doit faire demain ?", options: ["Aller au marché", "Aller à la bibliothèque", "Passer un examen"], answer: 1, explain: "« il faut que j'aille à la bibliothèque »." }
      - { q: "Qui est Lucas, selon Manon ?", options: ["Son petit ami", "Un camarade de classe", "Son cousin"], answer: 1, explain: "« C'est un camarade de classe, c'est tout »." }
