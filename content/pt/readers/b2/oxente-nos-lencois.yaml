id: r.b2.oxente-nos-lencois
level: b2
title: Oxente! Nos Lençóis Maranhenses
kind: dialogue
intro: Bia, a carioca on her first trip to the Lençóis Maranhenses, spends a day in a 4x4 with Zé, a guide from Barreirinhas. Between dunes and lagoons, they talk about accents, slang, diminutives and when to speak formally.
allow: [r, bia, zé, barreirinhas, maranhão, maranhense, maranhenses, lençóis, carioca, cariocas, ok, oxe, oxente, vixe, égua, arretado, mainha, painho, 4x4]
paragraphs:
  - { es: "A caminhonete saiu de Barreirinhas às oito da manhã, atravessou o rio de balsa e entrou numa trilha de areia tão funda que a Bia teve que se segurar com as duas mãos. O guia, Zé, dirigia com uma mão só e conversava sem parar.", en: "The 4x4 left Barreirinhas at eight in the morning, crossed the river on a ferry and entered a sand track so deep that Bia had to hold on with both hands. The guide, Zé, drove with one hand and talked non-stop." }
  - { es: "— Segura firme, moça! Daqui pra frente é só areia. Daqui a pouquinho você vai ver uma coisa que nunca viu na vida.", en: "'Hold on tight, miss! From here on it's all sand. In a little while you'll see something you've never seen in your life.'" }
  - { es: "Meia hora depois, eles subiram uma duna a pé, e a Bia parou, sem fôlego. Até onde a vista alcançava, havia dunas brancas, e entre elas, centenas de lagoas azuis e verdes, como se alguém tivesse jogado pedaços de céu na areia.", en: "Half an hour later they climbed a dune on foot, and Bia stopped, breathless. As far as the eye could see there were white dunes, and between them, hundreds of blue and green lagoons, as if someone had thrown pieces of sky onto the sand." }
  - { es: "— Vixe Maria! Que coisa mais linda!", en: "'Goodness gracious! What a beautiful thing!'" }
  - { es: "— Olha aí, a carioca já tá falando que nem nordestina! — riu o Zé. — Em dois dias você vai estar dizendo «oxente».", en: "'Look at that, the carioca's already talking like a Northeasterner!' Zé laughed. 'In two days you'll be saying oxente.'" }
  - { es: "— Eu adoro o «oxente»! Mas, falando sério, o que quer dizer exatamente?", en: "'I love oxente! But seriously, what exactly does it mean?'" }
  - { es: "— Depende do jeito que você fala. Pode ser surpresa, pode ser «ué», pode ser «tá doido?». Se você fala «oxe» curtinho, é mais impaciente. É uma palavra que serve pra tudo. Aqui no Maranhão a gente também diz muito «égua»: «Égua, que calor!» Mas cuidado, porque em outros lugares isso soa estranho.", en: "'It depends on how you say it. It can be surprise, it can be ué, it can be are you crazy?. If you say a short oxe, it's more impatient. It's a word that works for everything. Here in Maranhão we also say égua a lot: Égua, what heat! But be careful, because in other places that sounds strange.'" }
  - { es: "— Engraçado. Lá no Rio, quando alguém fala com sotaque nordestino na televisão, quase sempre é para fazer piada. Isso me incomoda.", en: "'Funny. Back in Rio, when someone speaks with a Northeastern accent on TV, it's almost always to make a joke. That bothers me.'" }
  - { es: "— Incomoda a gente também. Tem gente que acha que quem fala assim fala errado, ou que é menos inteligente. Mas sotaque não é erro, é origem. O seu «r» carioca, puxado, também é sotaque, e ninguém diz que você fala errado, né?", en: "'It bothers us too. Some people think that anyone who talks like this speaks wrongly, or is less intelligent. But an accent isn't a mistake, it's origin. Your rasping carioca r is also an accent, and nobody says you speak wrongly, right?'" }
  - { es: "— Verdade. E vocês falam diferente com turista?", en: "'True. And do you talk differently with tourists?'" }
  - { es: "— Claro! Com um senhor de fora, eu falo «o senhor» e «a senhora», falo devagarinho, mais certinho. Com os meus amigos, é outra língua: muita gíria, muito diminutivo, frase cortada. E com a minha mãe, «mainha», eu falo de um jeito que ninguém entende, só ela. Todo mundo faz isso, em todo lugar. É o que a professora da escola chamava de registro.", en: "'Of course! With an older man from outside, I say o senhor and a senhora, I talk slowly, more correctly. With my friends, it's another language: lots of slang, lots of diminutives, clipped sentences. And with my mother, mainha, I talk in a way nobody understands except her. Everybody does that, everywhere. It's what my school teacher used to call register.'" }
  - { es: "— E os diminutivos? Vocês usam ainda mais que os cariocas: pouquinho, devagarinho, cafezinho...", en: "'And the diminutives? You use them even more than cariocas: pouquinho, devagarinho, cafezinho...'" }
  - { es: "— O diminutivo é carinho, moça. Quando eu digo «espera um minutinho», quero dizer que eu respeito você. E às vezes é ironia também: se eu disser que a trilha é «pertinho», prepara as pernas!", en: "'The diminutive is affection, miss. When I say espera um minutinho, I mean I respect you. And sometimes it's irony too: if I say the trail is pertinho, get your legs ready!'" }
  - { es: "Eles desceram até a Lagoa Azul. A água estava morna e tão transparente que dava para ver os pés. O Zé explicou que as lagoas se formam com as chuvas do começo do ano e que, entre julho e setembro, ficam mais cheias. Depois, com o sol e o vento, muitas secam e desaparecem, até a próxima estação de chuvas.", en: "They went down to the Lagoa Azul. The water was warm and so clear you could see your feet. Zé explained that the lagoons form with the rains at the start of the year and that, between July and September, they are at their fullest. Afterwards, with the sun and the wind, many dry up and disappear until the next rainy season." }
  - { es: "— Então daqui a uns meses esta lagoa não vai existir?", en: "'So in a few months this lagoon won't exist?'" }
  - { es: "— Pode ser que não. É por isso que é arretado: nada aqui fica igual. Nem as dunas, nem as lagoas, nem o jeito de falar. Tudo anda, tudo muda.", en: "'Maybe not. That's why it's amazing: nothing here stays the same. Not the dunes, not the lagoons, not the way of speaking. Everything moves, everything changes.'" }
questions:
  - { q: "Como a Bia descreve as lagoas?", options: ["Como pedaços de céu jogados na areia", "Como rios grandes", "Como piscinas artificiais"], answer: 0, explain: "The lagoons looked «como se alguém tivesse jogado pedaços de céu na areia»." }
  - { q: "Segundo o Zé, o que significa «oxente»?", options: ["Só «bom dia»", "Depende do jeito: pode ser surpresa, «ué» ou «tá doido?»", "É um palavrão"], answer: 1, explain: "«Depende do jeito que você fala. Pode ser surpresa, pode ser \"ué\", pode ser \"tá doido?\".»" }
  - { q: "O que incomoda a Bia na televisão?", options: ["Que o sotaque nordestino seja usado para fazer piada", "Que não haja programas sobre o Maranhão", "Que todos falem como cariocas"], answer: 0, explain: "«Quando alguém fala com sotaque nordestino na televisão, quase sempre é para fazer piada. Isso me incomoda.»" }
  - { q: "O que o Zé chama de «registro»?", options: ["Um documento de identidade", "Falar de maneira diferente conforme a pessoa e a situação", "Um sotaque regional"], answer: 1, explain: "He speaks one way to an older tourist, another to friends and another to his mother: «É o que a professora da escola chamava de registro.»" }
  - { q: "Por que algumas lagoas desaparecem?", options: ["Porque os turistas as secam", "Porque secam com o sol e o vento depois da estação de chuvas", "Porque o mar as cobre"], answer: 1, explain: "«Com o sol e o vento, muitas secam e desaparecem, até a próxima estação de chuvas.»" }
glossary:
  - { es: balsa, en: ferry, raft }
  - { es: caminhonete, en: pickup truck, 4x4 }
  - { es: piada, en: joke }
  - { es: curtinho, en: short (diminutive) }
  - { es: funda, en: deep }
  - { es: fôlego, en: breath (sem fôlego = breathless) }
  - { es: centenas, en: hundreds }
  - { es: impaciente, en: impatient }
  - { es: soa, en: sounds (soar) }
  - { es: puxado, en: (here) drawn out, rasping }
  - { es: diminutivo, en: diminutive }
  - { es: diminutivos, en: diminutives }
  - { es: registro, en: register (way of speaking) }
  - { es: ironia, en: irony }
