grammar:
  - { prompt: "Ti piace questa borsa? ___ regalo per il compleanno.", options: ["Te la", "Ti la", "Tela"], answer: 0, explain: "ti + la = te la (g.combined-pronouns)." }
  - { prompt: "Hai dato le chiavi a Paolo? — Sì, ___ ho date ieri.", options: ["gliele", "glieli", "le gli"], answer: 0, explain: "gli + le = gliele; the participle agrees with le chiavi: date (g.combined-pronouns-past)." }
  - { prompt: "Non ho capito: ___ di nuovo, per favore!", options: ["dimmelo", "dammelo", "mi lo di'"], answer: 0, explain: "di' + mi + lo: the consonant doubles: dimmelo (g.imperativo-short-forms)." }
  - { prompt: "Signora, non ___ preoccupi, ci penso io.", options: ["ti", "si", "Le"], answer: 1, explain: "With Lei the pronoun goes before the verb: non si preoccupi (g.imperativo-lei-pronouns)." }
  - { prompt: "Al tuo posto, io ___ con lui.", options: ["parlerei", "parlavo", "parlassi"], answer: 0, explain: "Advice: conditional (g.condizionale-uses)." }
  - { prompt: "Avremmo ___ partire prima, adesso c'è traffico.", options: ["dovuto", "dovere", "dovuti"], answer: 0, explain: "Regret: past conditional of dovere + infinitive (g.modals-condizionale-passato)." }
  - { prompt: "Quando sono arrivato alla festa, Marco ___ già andato via.", options: ["è", "era", "sarà"], answer: 1, explain: "An action before another past action: trapassato prossimo (g.trapassato-prossimo)." }
  - { prompt: "Credo che Giulia ___ ragione.", options: ["ha", "abbia", "avrà"], answer: 1, explain: "credere che + congiuntivo (g.congiuntivo-opinion)." }
  - { prompt: "È importante che voi ___ in orario.", options: ["arrivate", "arriviate", "arriverete"], answer: 1, explain: "Impersonal expressions of judgement take the congiuntivo (g.congiuntivo-impersonal)." }
  - { prompt: "Spero ___ presto.", options: ["di tornare", "che torno", "che tornare"], answer: 0, explain: "Same subject (I hope / I return): di + infinitive (g.congiuntivo-vs-infinitive)." }
  - { prompt: "Ti presto la macchina purché tu ___ attento.", options: ["sei", "sia", "saresti"], answer: 1, explain: "purché always takes the congiuntivo (g.congiuntivo-conjunctions)." }
  - { prompt: "La ragazza ___ ti ho parlato abita a Verona.", options: ["che", "di cui", "a cui"], answer: 1, explain: "parlare di qualcuno: after a preposition, cui (g.relative-cui)." }
  - { prompt: "In questo ristorante ___ gli spaghetti migliori di Bologna.", options: ["si mangia", "si mangiano", "si mangiamo"], answer: 1, explain: "si passivante: the verb agrees with gli spaghetti (g.si-passivante)." }
  - { prompt: "Mi ha chiesto ___ volevo venire al cinema.", options: ["se", "che", "di"], answer: 0, explain: "A reported yes/no question is introduced by se (g.reported-questions)." }
  - { prompt: "___ la televisione, mi sono addormentato.", options: ["Guardato", "Guardando", "A guardare"], answer: 1, explain: "The gerund expresses time / simultaneous action with the same subject (g.gerundio-uses)." }
writing:
  prompt: "Write a formal e-mail (Lei) to the manager of a hotel in Venice where you stayed last month. Thank them for something, complain politely about a problem, explain what happened and say what you would like them to do. Use at least one congiuntivo, one conditional and one relative clause."
  minWords: 130
  modelAnswer: |
    Gentile Direttrice,
    Le scrivo in merito al mio soggiorno nel Vostro albergo dal 12 al 15 maggio. Prima di tutto vorrei ringraziare il personale, che è stato sempre gentile e disponibile.
    Purtroppo, però, devo parlarLe di un problema. La camera che avevo prenotato doveva avere la vista sul canale, ma quando siamo arrivati ci hanno dato una stanza al piano terra che dava su un cortile buio. Abbiamo chiesto di cambiarla, ma ci hanno detto che l'albergo era pieno. Credo che sia giusto che un cliente riceva ciò che ha pagato, soprattutto considerando che avevamo prenotato tre mesi prima.
    Per questo motivo Le sarei grata se potesse restituirmi una parte del prezzo. Rimango in attesa di un Suo riscontro.
    Cordiali saluti,
    Sarah Collins
  checklist:
    - "I opened and closed the e-mail formally (Gentile…, Le scrivo in merito a…, In attesa di un Suo riscontro, Cordiali saluti)."
    - "I used Lei forms consistently, with a capital letter (Le scrivo, Suo riscontro)."
    - "I used the congiuntivo after an opinion or judgement (credo che sia giusto che…)."
    - "I used a polite conditional for my request (vorrei, Le sarei grata se…)."
    - "I used at least one relative clause (la camera che avevo prenotato, il personale… che è stato)."
    - "I narrated the problem with passato prossimo, imperfetto and trapassato prossimo correctly."
