id: r.c1.germinal
level: c1
title: Germinal, la nuit sans étoiles
kind: literature
author: Émile Zola (1840–1902)
source: "Germinal, première partie, chapitre I (1885), début. Domaine public. Texte abrégé d'après l'édition du Projet Gutenberg (n° 5711) ; les coupures sont marquées par (…), la ligature œ est rétablie."
intro: "The famous opening of Zola's mining novel: a jobless man walking through the night towards a coal mine in the north of France. The first paragraph is an editorial introduction written for this course; the rest is Zola's text, with cuts marked (…). Notice how the description moves from what the man cannot see to what slowly appears, how passé simple events (aperçut, hésita, reconnut) break into the imparfait background, and the dense, precise vocabulary of the mine."
allow: [treizième, sensation, coton, résister, masse, apparition, fantastique, respiration, violent, zola, rougon-macquart, anzin, marchiennes, montsou, voreux, étienne, lantier, machineur, coron, empire]
paragraphs:
  - { es: "Germinal est le treizième des vingt romans des Rougon-Macquart, l'immense fresque dans laquelle Émile Zola peint la société française du Second Empire. Pour le préparer, Zola s'est rendu en 1884 dans le bassin minier du Nord, à Anzin, où une grève venait d'éclater. Le roman s'ouvre sur l'arrivée d'Étienne Lantier, un jeune ouvrier sans travail, devant une mine de charbon, en pleine nuit.", en: "Germinal is the thirteenth of the twenty novels of the Rougon-Macquart, the vast fresco in which Émile Zola depicts French society under the Second Empire. To prepare it, Zola went in 1884 to the coalfield of the North, to Anzin, where a strike had just broken out. The novel opens with the arrival of Étienne Lantier, a young worker without a job, at a coal mine in the middle of the night." }
  - { es: "Dans la plaine rase, sous la nuit sans étoiles, d'une obscurité et d'une épaisseur d'encre, un homme suivait seul la grande route de Marchiennes à Montsou, dix kilomètres de pavé coupant tout droit, à travers les champs de betteraves. Devant lui, il ne voyait même pas le sol noir, et il n'avait la sensation de l'immense horizon plat que par les souffles du vent de mars, des rafales larges comme sur une mer, glacées d'avoir balayé des lieues de marais et de terres nues. Aucune ombre d'arbre ne tachait le ciel, le pavé se déroulait avec la rectitude d'une jetée, au milieu de l'embrun aveuglant des ténèbres.", en: "On the bare plain, under a starless night as dark and thick as ink, a man was walking alone along the main road from Marchiennes to Montsou, ten kilometres of cobbles cutting straight across the beet fields. In front of him he could not even see the black ground, and he sensed the immense flat horizon only through the gusts of the March wind, squalls as wide as at sea, icy from having swept over leagues of marshes and bare land. No shadow of a tree stained the sky; the road unrolled as straight as a pier, in the midst of the blinding spray of darkness." }
  - { es: "L'homme était parti de Marchiennes vers deux heures. Il marchait d'un pas allongé, grelottant sous le coton aminci de sa veste et de son pantalon de velours. Un petit paquet, noué dans un mouchoir à carreaux, le gênait beaucoup ; et il le serrait contre ses flancs, tantôt d'un coude, tantôt de l'autre, pour glisser au fond de ses poches les deux mains à la fois, des mains gourdes que les lanières du vent d'est faisaient saigner. Une seule idée occupait sa tête vide d'ouvrier sans travail et sans gîte, l'espoir que le froid serait moins vif après le lever du jour.", en: "The man had left Marchiennes at about two o'clock. He was walking with long strides, shivering in the thin cotton of his jacket and his corduroy trousers. A small bundle, tied up in a checked handkerchief, bothered him a lot; and he pressed it against his side, now with one elbow, now with the other, so as to slip both hands deep into his pockets at once, numb hands that the lashing east wind made bleed. A single idea filled his empty head, the head of a worker with no job and no roof: the hope that the cold would be less sharp after daybreak." }
  - { es: "Depuis une heure, il avançait ainsi, lorsque sur la gauche, à deux kilomètres de Montsou, il aperçut des feux rouges, trois brasiers brûlant au plein air, et comme suspendus. D'abord, il hésita, pris de crainte ; puis, il ne put résister au besoin douloureux de se chauffer un instant les mains. Un chemin creux s'enfonçait. Tout disparut. (…) Brusquement, à un coude du chemin, les feux reparurent près de lui, sans qu'il comprît davantage comment ils brûlaient si haut dans le ciel mort, pareils à des lunes fumeuses.", en: "He had been walking like this for an hour when, on the left, two kilometres from Montsou, he caught sight of red fires, three braziers burning in the open air and seemingly hanging in space. At first he hesitated, seized by fear; then he could not resist the painful need to warm his hands for a moment. A sunken lane went down. Everything vanished. (…) Suddenly, at a bend in the lane, the fires reappeared close to him, though he still could not understand how they burned so high in the dead sky, like smoky moons." }
  - { es: "Mais, au ras du sol, un autre spectacle venait de l'arrêter. C'était une masse lourde, un tas écrasé de constructions, d'où se dressait la silhouette d'une cheminée d'usine ; de rares lueurs sortaient des fenêtres encrassées, cinq ou six lanternes tristes étaient pendues dehors (…) ; et, de cette apparition fantastique, noyée de nuit et de fumée, une seule voix montait, la respiration grosse et longue d'un échappement de vapeur, qu'on ne voyait point.", en: "But at ground level another sight had just stopped him. It was a heavy mass, a squat heap of buildings, from which rose the outline of a factory chimney; a few rare gleams came from the grimy windows, five or six sad lanterns hung outside (…); and from this fantastic apparition, drowned in night and smoke, a single voice rose, the heavy, long breathing of an escape of steam that could not be seen." }
  - { es: "Alors, l'homme reconnut une fosse. Il fut repris de honte : à quoi bon ? il n'y aurait pas de travail. (…) — Bonjour, dit-il en s'approchant d'une des corbeilles. Tournant le dos au brasier, le charretier était debout, un vieillard vêtu d'un tricot de laine violette, coiffé d'une casquette en poil de lapin ; pendant que son cheval, un gros cheval jaune, attendait, dans une immobilité de pierre, qu'on eût vidé les six berlines montées par lui. (…) — Bonjour, répondit le vieux.", en: "Then the man recognised a pit. He was seized by shame again: what was the point? There would be no work. (…) 'Good morning,' he said, going up to one of the fire baskets. With his back to the brazier, the carter was standing there, an old man dressed in a purple woollen jersey, wearing a rabbit-fur cap; while his horse, a big yellow horse, waited as still as stone for the six tubs it had hauled up to be emptied. (…) 'Good morning,' answered the old man." }
  - { es: "Un silence se fit. L'homme, qui se sentait regardé d'un œil méfiant, dit son nom tout de suite. — Je me nomme Étienne Lantier, je suis machineur… Il n'y a pas de travail ici ? Les flammes l'éclairaient, il devait avoir vingt et un ans, très brun, joli homme, l'air fort malgré ses membres menus. Rassuré, le charretier hochait la tête. — Du travail pour un machineur, non, non… Il s'en est encore présenté deux hier. Il n'y a rien.", en: "There was a silence. The man, who felt himself watched with a suspicious eye, gave his name at once. 'My name is Étienne Lantier, I'm an engine-man… Is there any work here?' The flames lit him up; he must have been twenty-one, very dark, good-looking, strong-looking despite his slender limbs. Reassured, the carter shook his head. 'Work for an engine-man? No, no… Two more came asking yesterday. There's nothing.'" }
  - { es: "Une rafale leur coupa la parole. Puis, Étienne demanda, en montrant le tas sombre des constructions, au pied du terri : — C'est une fosse, n'est-ce pas ? Le vieux, cette fois, ne put répondre. Un violent accès de toux l'étranglait. Enfin, il cracha, et son crachat, sur le sol empourpré, laissa une tache noire. — Oui, une fosse, le Voreux… Tenez ! le coron est tout près.", en: "A gust of wind cut them short. Then Étienne asked, pointing at the dark heap of buildings at the foot of the slag heap: 'It's a pit, isn't it?' This time the old man could not answer. A violent fit of coughing was choking him. At last he spat, and his spittle left a black stain on the reddened ground. 'Yes, a pit, the Voreux… Look! The miners' village is right nearby.'" }
questions:
  - { q: "Dans quelles conditions l'homme marche-t-il au début du roman ?", options: ["Par une belle nuit étoilée d'été", "Dans une nuit noire et glaciale de mars, sur une route plate et droite", "Sous la pluie, dans une forêt"], answer: 1, explain: "«Sous la nuit sans étoiles, d'une obscurité et d'une épaisseur d'encre», with the icy «vent de mars» on a perfectly straight road." }
  - { q: "Quel est le seul espoir de l'homme ?", options: ["Trouver un trésor", "Que le froid soit moins vif après le lever du jour", "Retrouver sa famille à Montsou"], answer: 1, explain: "«Une seule idée occupait sa tête vide… l'espoir que le froid serait moins vif après le lever du jour.»" }
  - { q: "Pourquoi s'approche-t-il des feux rouges ?", options: ["Pour se chauffer les mains", "Pour demander son chemin", "Pour voler du charbon"], answer: 0, explain: "«Il ne put résister au besoin douloureux de se chauffer un instant les mains.»" }
  - { q: "Que lui répond le vieux charretier quand il demande du travail ?", options: ["Qu'on cherche justement un machineur", "Qu'il n'y a rien : deux hommes sont déjà venus la veille", "Qu'il faut parler au directeur"], answer: 1, explain: "«Du travail pour un machineur, non, non… Il s'en est encore présenté deux hier. Il n'y a rien.»" }
  - { q: "Quel détail annonce la dureté de la vie à la mine ?", options: ["Le cheval jaune", "Le crachat noir du vieux après sa toux", "La casquette en poil de lapin"], answer: 1, explain: "The old man's black spittle shows coal dust in his lungs: the mine is already in the body of those who work it." }
