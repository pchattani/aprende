id: r.b1.consultorio-de-marina
level: b1
title: El consultorio de Marina
kind: text
intro: An advice column in a Spanish magazine. Ana writes about problems at work and at home, and Marina answers.
allow: [marina, ana, sevilla]
paragraphs:
  - { es: "Querida Marina: Te escribo porque no sé qué hacer. Hace seis meses empecé a trabajar en una empresa pequeña y, al principio, todo iba bien. Pero ahora mi jefe me manda cada día más tareas y me pide que me quede en la oficina hasta las nueve.", en: "Dear Marina: I'm writing to you because I don't know what to do. Six months ago I started working at a small company and, at first, everything was going well. But now my boss gives me more tasks every day and asks me to stay in the office until nine." }
  - { es: "Además, mi pareja dice que ya no tengo tiempo para ella y que siempre estoy cansada. Discutimos casi todos los días. No quiero perder el trabajo, pero tampoco quiero perder a la persona que quiero. ¿Qué me aconsejas? — Ana, 29 años, Sevilla.", en: "What's more, my partner says I no longer have time for her and that I'm always tired. We argue almost every day. I don't want to lose my job, but I don't want to lose the person I love either. What do you advise? — Ana, 29, Seville." }
  - { es: "Querida Ana: Lo primero: no te culpes. Tu problema es muy común y se puede resolver. Pero no esperes a que tu jefe cambie solo; eso no va a pasar.", en: "Dear Ana: First of all: don't blame yourself. Your problem is very common and it can be solved. But don't wait for your boss to change on his own; that isn't going to happen." }
  - { es: "Te recomiendo que pidas una reunión con él esta misma semana. Explícale con calma que trabajas más horas de las que dice tu contrato y proponle un horario claro. No le hables enfadada y no le digas que vas a dejar el trabajo: eso no es una conversación, es una amenaza.", en: "I recommend that you ask for a meeting with him this very week. Explain to him calmly that you work more hours than your contract says and propose a clear timetable to him. Don't speak to him angrily and don't tell him you're going to quit: that isn't a conversation, it's a threat." }
  - { es: "Si después de hablar con él nada cambia, es mejor que busques otro empleo. Hay vida fuera de esa oficina. Yo que tú, empezaría a mirar ofertas ya, sin prisa pero sin miedo.", en: "If nothing changes after talking to him, it's better that you look for another job. There is life outside that office. If I were you, I'd start looking at job offers now, without hurry but without fear." }
  - { es: "En cuanto a tu pareja, no la dejes fuera de este problema. Cuéntale lo que sientes y pídele que tenga un poco de paciencia. Y, sobre todo, no discutáis por la noche, cuando las dos estáis agotadas: hablad el domingo por la mañana, con un café delante.", en: "As for your partner, don't leave her out of this problem. Tell her what you feel and ask her to have a little patience. And, above all, don't argue at night, when you're both exhausted: talk on Sunday morning, with a coffee in front of you." }
  - { es: "Dos consejos más. Primero: cuida tu salud. Sal a caminar media hora al día, come bien y duerme al menos siete horas. Segundo: no te rindas. Las personas que piden ayuda, como tú, suelen encontrar el camino. Un abrazo, Marina.", en: "Two more pieces of advice. First: look after your health. Go out walking for half an hour a day, eat well and sleep at least seven hours. Second: don't give up. People who ask for help, like you, usually find the way. A hug, Marina." }
questions:
  - { q: "What does Ana's boss ask her to do?", options: ["Stay in the office until nine", "Travel every week", "Change department"], answer: 0 }
  - { q: "What does Marina tell Ana not to do when she talks to her boss?", options: ["Ask for a meeting", "Threaten to quit", "Propose a timetable"], answer: 1 }
  - { q: "When does Marina suggest Ana and her partner should talk?", options: ["At night, after work", "On Sunday morning", "At lunchtime in the office"], answer: 1 }
  - { q: "Which of these is NOT one of Marina's final pieces of advice?", options: ["Walk half an hour a day", "Sleep at least seven hours", "Change city"], answer: 2 }
glossary:
  - { es: consultorio, en: advice column }
  - { es: con calma, en: calmly }
  - { es: conversación, en: conversation }
  - { es: amenaza, en: threat }
  - { es: en cuanto a, en: as for }
  - { es: cuidar, en: to look after }
