passScore: 0.8
reading:
  text: |
    Quand Claire a repris l'hôtel de montagne de ses grands-parents, près de Chamonix, beaucoup de gens du village ont pensé qu'elle commettait une erreur. Elle travaillait depuis douze ans à Lyon, dans une grande entreprise, et venait d'obtenir une promotion. « Si on m'avait proposé cet hôtel à vingt-cinq ans, j'aurais refusé sans hésiter, reconnaît-elle. Mais à quarante ans, j'en avais assez de passer ma vie dans les bouchons. »

    L'hôtel, construit en 1930, avait longtemps été l'un des plus fréquentés de la vallée. Pourtant, ces dernières années, il avait perdu une grande partie de ses clients : les chambres n'avaient pas été rénovées depuis les années quatre-vingt et, surtout, les hivers avaient changé. Faute de neige, la station voisine avait dû fermer plusieurs pistes, et les skieurs partaient vers des stations plus hautes.

    La première chose que Claire a faite, c'est d'écouter. Pendant un mois, elle n'a pris aucune décision ; elle s'est contentée de parler avec les employés, les guides et les commerçants du village. « Il s'est avéré que tout le monde savait ce qui n'allait pas, explique-t-elle. Simplement, personne ne leur avait jamais demandé leur avis. » Elle a ensuite fait trois choix : ouvrir l'hôtel toute l'année et non plus seulement l'hiver, proposer des randonnées et des séjours à vélo en été, et travailler uniquement avec des producteurs de la région.

    Certes, la première année a été très difficile, et elle a bien failli tout abandonner. Aujourd'hui, pourtant, l'hôtel est complet en juillet comme en février. Claire refuse néanmoins qu'on la présente comme une héroïne. « Ce n'est pas moi qui ai sauvé l'hôtel, ce sont les gens qui y travaillent depuis trente ans. Moi, je me suis contentée de les écouter. »
  questions:
    - { q: "Why did people in the village think Claire was making a mistake?", options: ["She had no experience of mountains", "She left a good job and a recent promotion in Lyon", "She wanted to sell the hotel"], answer: 1 }
    - { q: "Why had the hotel lost many of its customers?", options: ["It was too expensive", "The rooms were old and, with less snow, skiers went to higher resorts", "A new hotel had opened next door"], answer: 1 }
    - { q: "What did Claire do during her first month?", options: ["She renovated all the rooms", "She dismissed half the staff", "She listened to employees, guides and shopkeepers without making decisions"], answer: 2 }
    - { q: "Which of these was NOT one of her choices?", options: ["Opening all year round", "Offering hiking and cycling holidays in summer", "Building a new ski run"], answer: 2 }
    - { q: "Who saved the hotel, according to Claire?", options: ["She herself", "The people who have worked there for thirty years", "The mayor of the village"], answer: 1 }
