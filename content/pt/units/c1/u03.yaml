id: c1.u03
title: "Discurso e coesão"
lessons:
  - id: c1.u03.l1
    title: Ao passo que o Solimões…
    teach: [g.discourse-markers-advanced]
    vocab: [w.outrossim, w.destarte, w.porquanto, w.não-obstante, w.por-conseguinte, w.por-sua-vez, w.ao-passo-que, w.na-medida-em-que, w.tendo-em-vista, w.haja-vista, w.dado-que, w.em-decorrência-de, w.em-virtude-de, w.em-face-de, w.convergir, w.convergência, w.contraditório, w.paradoxo, w.paradoxal, w.ácido, w.densidade, w.sedimento, w.barro, w.bacia, w.hidrográfico, w.flutuante, w.contraste, w.ignorar, w.combinação]
    tip: "Long texts need markers of contrast (ao passo que, não obstante), cause (em virtude de, haja vista, dado que) and consequence (por conseguinte, destarte). Outrossim and destarte are bookish: use them in writing, sparingly."
    sentences:
      - { es: "O rio Negro é escuro e ácido, ao passo que o Solimões é barrento.", en: "The Rio Negro is dark and acidic, whereas the Solimões is muddy.", altEs: ["O rio Negro é escuro e ácido, enquanto o Solimões é barrento."], grammar: [g.discourse-markers-advanced], vocab: [w.ao-passo-que, w.ácido, w.barrento] }
      - { es: "Não obstante a chuva, o passeio até o Encontro das Águas saiu no horário.", en: "Despite the rain, the trip to the Meeting of the Waters left on time.", grammar: [g.discourse-markers-advanced], vocab: [w.não-obstante, w.passeio], transform: { instruction: "Replace não obstante with apesar de", answer: "Apesar da chuva, o passeio até o Encontro das Águas saiu no horário.", en: "Despite the rain, the trip to the Meeting of the Waters left on time." } }
      - { es: "Os dois rios correm lado a lado sem se misturar, em virtude de diferenças de temperatura, velocidade e densidade.", en: "The two rivers flow side by side without mixing, by virtue of differences in temperature, speed and density.", grammar: [g.discourse-markers-advanced, g.personal-infinitive-uses], vocab: [w.em-virtude-de, w.densidade, w.misturar] }
      - { es: "O Solimões traz sedimentos dos Andes; por conseguinte, suas águas têm cor de barro.", en: "The Solimões carries sediment from the Andes; consequently, its waters are the colour of clay.", altEs: ["O Solimões traz sedimentos dos Andes; por isso, as suas águas têm cor de barro."], grammar: [g.discourse-markers-advanced, g.connectors-cause-consequence], vocab: [w.por-conseguinte, w.sedimento, w.barro] }
      - { es: "O rio Negro corre devagar; o Solimões, por sua vez, é bem mais rápido.", en: "The Rio Negro flows slowly; the Solimões, for its part, is much faster.", grammar: [g.discourse-markers-advanced], vocab: [w.por-sua-vez, w.devagar], transform: { instruction: "Join the two clauses with ao passo que", answer: "O rio Negro corre devagar, ao passo que o Solimões é bem mais rápido.", alt: ["O rio Negro corre devagar, enquanto o Solimões é bem mais rápido."] } }
      - { es: "Tendo em vista a seca deste ano, os barcos não conseguem chegar até a praia.", en: "In view of this year's drought, the boats can't get as far as the beach.", grammar: [g.discourse-markers-advanced], vocab: [w.tendo-em-vista, w.seca] }
      - { es: "O passeio foi adiado, haja vista o nível baixo do rio.", en: "The trip was postponed, given the low level of the river.", altEs: ["O passeio foi adiado, tendo em vista o nível baixo do rio."], grammar: [g.discourse-markers-advanced, g.passive-ser], vocab: [w.haja-vista, w.adiar, w.nível], error: { wrong: "O passeio foi adiado, haja visto o nível baixo do rio.", explain: "The fixed phrase is haja vista (invariable): never haja visto.", grammar: g.discourse-markers-advanced } }
      - { es: "Dado que a lancha estava lotada, fomos no barco das três.", en: "Given that the speedboat was full, we went on the three o'clock boat.", altEs: ["Como a lancha estava lotada, fomos no barco das três."], grammar: [g.discourse-markers-advanced, g.connectors-cause-consequence], vocab: [w.dado-que, w.lancha, w.lotado] }
      - { es: "Em decorrência da cheia, a feira flutuante mudou de lugar.", en: "As a result of the flood, the floating market moved.", grammar: [g.discourse-markers-advanced], vocab: [w.em-decorrência-de, w.cheia, w.flutuante] }
      - { es: "A convergência dos dois rios forma o que, no Brasil, se chama rio Amazonas.", en: "The confluence of the two rivers forms what, in Brazil, is called the Amazon River.", grammar: [g.discourse-markers-advanced, g.se-passive], vocab: [w.convergência] }
      - { es: "É um paradoxo: dois rios que se encontram e, no entanto, não se misturam.", en: "It's a paradox: two rivers that meet and yet don't mix.", grammar: [g.discourse-markers-advanced, g.connectors-contrast], vocab: [w.paradoxo, w.no-entanto] }
      - { es: "A situação é paradoxal: a maior bacia hidrográfica do mundo sofre com secas cada vez mais graves.", en: "The situation is paradoxical: the largest river basin in the world suffers ever more severe droughts.", grammar: [g.discourse-markers-advanced, g.superlatives], vocab: [w.paradoxal, w.bacia, w.hidrográfico, w.grave] }
      - { es: "Os relatos dos pescadores são contraditórios: uns dizem que o rio subiu, outros, que baixou.", en: "The fishermen's accounts are contradictory: some say the river rose, others that it fell.", grammar: [g.discourse-markers-advanced, g.reported-speech-past], vocab: [w.contraditório, w.relato, w.pescador] }
      - { es: "O guia não explicou o fenômeno, porquanto ele próprio não o entendia.", en: "The guide didn't explain the phenomenon, since he himself didn't understand it.", grammar: [g.discourse-markers-advanced, g.clitic-placement-norm], vocab: [w.porquanto, w.fenômeno], variant: "In Portugal: fenómeno." }
      - { es: "O relatório é claro; outrossim, apresenta dados atualizados. Destarte, convence o leitor.", en: "The report is clear; furthermore, it presents updated data. Thus, it convinces the reader.", grammar: [g.discourse-markers-advanced], vocab: [w.outrossim, w.destarte, w.relatório] }
      - { es: "Na medida em que o turismo cresce, aumenta a pressão sobre os botos.", en: "Insofar as tourism grows, the pressure on the river dolphins increases.", altEs: ["À medida que o turismo cresce, aumenta a pressão sobre os botos."], grammar: [g.discourse-markers-advanced], vocab: [w.na-medida-em-que, w.turismo, w.boto], note: "na medida em que = insofar as / because; à medida que = as (progressively)." }
    exchanges:
      - q: { es: "Por que as águas não se misturam?", en: "Why don't the waters mix?" }
        a: { es: "Em virtude das diferenças de temperatura, velocidade e densidade.", en: "By virtue of the differences in temperature, speed and density." }
        alt: ["Por causa da temperatura e da velocidade.", "Porque um rio é mais quente e mais lento que o outro."]
        grammar: [g.discourse-markers-advanced]
        vocab: [w.em-virtude-de, w.densidade]
      - q: { es: "O passeio de hoje está confirmado?", en: "Is today's trip confirmed?" }
        a: { es: "Não, foi cancelado, haja vista a tempestade que se aproxima.", en: "No, it's been cancelled, given the storm that's coming." }
        alt: ["Não, por causa da tempestade.", "Está, não obstante a chuva."]
        grammar: [g.discourse-markers-advanced, g.passive-ser]
        vocab: [w.haja-vista, w.tempestade]
      - q: { es: "O rio Negro é mais quente que o Solimões?", en: "Is the Rio Negro warmer than the Solimões?" }
        a: { es: "É, sim; o Solimões, em contrapartida, é mais rápido.", en: "Yes, it is; the Solimões, on the other hand, is faster." }
        alt: ["É, e também mais lento.", "Sim, alguns graus mais quente."]
        grammar: [g.discourse-markers-advanced, g.comparatives]
        vocab: [w.contrapartida]
      - q: { es: "Os especialistas concordam sobre as causas da seca?", en: "Do the experts agree about the causes of the drought?" }
        a: { es: "Não; as opiniões são contraditórias, mas convergem em um ponto: o clima mudou.", en: "No; the opinions are contradictory, but they converge on one point: the climate has changed." }
        alt: ["Não totalmente.", "Em parte; há convergência sobre o papel do clima."]
        grammar: [g.discourse-markers-advanced]
        vocab: [w.contraditório, w.convergir, w.clima]
      - q: { es: "Em face da seca, ainda vale a pena fazer o passeio?", en: "In the face of the drought, is the trip still worth doing?" }
        a: { es: "Vale, sim: o contraste entre as águas continua impressionante.", en: "It is: the contrast between the waters is still impressive." }
        alt: ["Vale, mas o barco demora mais.", "Depende do nível do rio."]
        grammar: [g.discourse-markers-advanced]
        vocab: [w.em-face-de, w.contraste]
    texts:
      - title: "Painel informativo no barco"
        es: ["O rio Negro tem águas escuras e ácidas, ao passo que o Solimões traz águas barrentas dos Andes.", "Em virtude das diferenças de temperatura e velocidade, os dois correm lado a lado por vários quilômetros.", "Por conseguinte, o que você vê é um rio de duas cores."]
        en: ["The Rio Negro has dark, acidic water, whereas the Solimões brings muddy water from the Andes.", "By virtue of the differences in temperature and speed, the two flow side by side for several kilometres.", "Consequently, what you see is a two-coloured river."]
        grammar: [g.discourse-markers-advanced]
        vocab: [w.ao-passo-que, w.em-virtude-de, w.por-conseguinte]
      - title: "Trecho de um ensaio"
        es: ["O encontro dos rios é, de certo modo, um paradoxo.", "Dois rios convergem e, não obstante, permanecem separados.", "Destarte, a natureza nos ensina que união não significa uniformidade."]
        en: ["The meeting of the rivers is, in a way, a paradox.", "Two rivers converge and nevertheless remain separate.", "Thus nature teaches us that union does not mean uniformity."]
        grammar: [g.discourse-markers-advanced, g.text-types]
        vocab: [w.paradoxo, w.convergir, w.não-obstante, w.destarte]
    spicy:
      - { es: "Você é doce, ao passo que eu sou ácido; dizem que é a combinação perfeita.", en: "You're sweet, whereas I'm sarcastic; they say it's the perfect combination.", grammar: [g.discourse-markers-advanced], vocab: [w.ao-passo-que, w.ácido] }
      - { es: "Não obstante a chuva, você veio; por conseguinte, o jantar é por minha conta.", en: "Despite the rain, you came; consequently, dinner is on me.", grammar: [g.discourse-markers-advanced], vocab: [w.não-obstante, w.por-conseguinte] }
      - { es: "Tendo em vista o pôr do sol, a música e o seu sorriso, proponho que a gente fique mais um pouco.", en: "In view of the sunset, the music and your smile, I propose we stay a little longer.", altEs: ["Tendo em vista o pôr do sol, a música e o seu sorriso, proponho que fiquemos mais um pouco."], grammar: [g.discourse-markers-advanced, g.subjunctive-advice], vocab: [w.tendo-em-vista, w.sorriso] }
      - { es: "É um paradoxo: quanto mais você me ignora, mais eu reparo em você.", en: "It's a paradox: the more you ignore me, the more I notice you.", grammar: [g.discourse-markers-advanced, g.comparatives], vocab: [w.paradoxo, w.ignorar] }
      - { es: "Dado que você já sabe o meu nome, por uma questão de justiça me deve o seu telefone.", en: "Given that you already know my name, in all fairness you owe me your phone number.", altEs: ["Dado que você já sabe meu nome, por uma questão de justiça me deve seu telefone."], grammar: [g.discourse-markers-advanced], vocab: [w.dado-que, w.justiça] }
  - id: c1.u03.l2
    title: Este último, aquele
    teach: [g.anaphora-cohesion]
    vocab: [w.no-que-diz-respeito-a, w.no-que-tange-a, w.quanto-a, w.acerca-de, w.a-respeito-de, w.em-relação-a, w.ou-melhor, w.dito-isso, w.este-último, w.anáfora, w.referente, w.conector, w.marcador-discursivo, w.tópico-frasal, w.retomar, w.encadear, w.articular, w.progressão, w.preocupante, w.documentário, w.visar]
    tip: "In careful writing, este points to what is nearer in the text (the latter, or what follows), esse to what has just been said, aquele to the former. Vary the noun or use a pronoun so you don't repeat 'o rio' in every sentence."
    sentences:
      - { es: "O Negro e o Solimões se encontram perto de Manaus: este é barrento, aquele é escuro.", en: "The Negro and the Solimões meet near Manaus: the latter is muddy, the former dark.", grammar: [g.anaphora-cohesion, g.demonstratives], vocab: [w.barrento, w.escuro], error: { wrong: "O Negro e o Solimões se encontram perto de Manaus: esse é barrento, aquele é escuro.", explain: "To mean 'the latter' in writing, use este (the nearer one in the text), not esse.", grammar: g.anaphora-cohesion } }
      - { es: "Visitamos o Teatro Amazonas e o Mercado; o Mercado estava fechado para reforma.", en: "We visited the Teatro Amazonas and the Market; the Market was closed for renovation.", grammar: [g.anaphora-cohesion], vocab: [w.reforma], transform: { instruction: "Avoid repeating the noun: use este último", answer: "Visitamos o Teatro Amazonas e o Mercado; este último estava fechado para reforma.", en: "We visited the Teatro Amazonas and the Market; the latter was closed for renovation." } }
      - { es: "O problema é este: ninguém sabe ao certo quantos botos vivem na região.", en: "The problem is this: nobody knows for sure how many river dolphins live in the region.", grammar: [g.anaphora-cohesion, g.demonstratives], vocab: [w.boto, w.região] }
      - { es: "Falta dinheiro para a pesquisa. Esse é o problema.", en: "There's no money for the research. That's the problem.", altEs: ["Falta dinheiro para a pesquisa, e esse é o problema."], grammar: [g.anaphora-cohesion, g.demonstratives], vocab: [w.pesquisa, w.faltar], transform: { instruction: "Rewrite so the demonstrative points forward: O problema é…", answer: "O problema é este: falta dinheiro para a pesquisa.", en: "The problem is this: there's no money for the research." } }
      - { es: "No que diz respeito à qualidade da água, os dados são preocupantes.", en: "As regards water quality, the data are worrying.", altEs: ["Em relação à qualidade da água, os dados são preocupantes."], grammar: [g.anaphora-cohesion, g.discourse-markers-advanced], vocab: [w.no-que-diz-respeito-a, w.qualidade, w.preocupante] }
      - { es: "No que tange à pesca, a lei é clara: na piracema, não se pesca.", en: "As far as fishing is concerned, the law is clear: in the spawning season, there's no fishing.", grammar: [g.discourse-markers-advanced, g.indeterminate-subject], vocab: [w.no-que-tange-a, w.pesca, w.piracema] }
      - { es: "Quanto aos botos, o ideal é observá-los de longe.", en: "As for the river dolphins, the best thing is to watch them from a distance.", altEs: ["Quanto aos botos, o ideal é observar de longe."], grammar: [g.anaphora-cohesion, g.direct-object-pronouns], vocab: [w.quanto-a, w.observar] }
      - { es: "O guia falou acerca da formação dos rios e respondeu a todas as perguntas.", en: "The guide spoke about how the rivers formed and answered all the questions.", grammar: [g.anaphora-cohesion], vocab: [w.acerca-de, w.formação] }
      - { es: "Há muitas lendas a respeito do boto; numa delas, ele vira um rapaz bonito nas noites de festa.", en: "There are many legends about the river dolphin; in one of them, it turns into a handsome young man on festival nights.", grammar: [g.anaphora-cohesion, g.tem-there-is], vocab: [w.a-respeito-de, w.lenda, w.virar] }
      - { es: "Em relação ao ano passado, o rio está dois metros mais baixo.", en: "Compared with last year, the river is two metres lower.", grammar: [g.anaphora-cohesion, g.comparatives], vocab: [w.em-relação-a, w.metro] }
      - { es: "O passeio dura duas horas, ou melhor, duas horas e meia com a parada para o almoço.", en: "The trip lasts two hours, or rather, two and a half hours with the lunch stop.", grammar: [g.discourse-markers-advanced], vocab: [w.ou-melhor, w.parada] }
      - { es: "O rio está baixo. Dito isso, o passeio continua valendo a pena.", en: "The river is low. That said, the trip is still worth it.", grammar: [g.discourse-markers-advanced, g.anaphora-cohesion], vocab: [w.dito-isso, w.valer-a-pena] }
      - { es: "Em “vi o boto e o fotografei”, o pronome é uma anáfora: retoma o referente “boto”.", en: "In 'I saw the dolphin and photographed it', the pronoun is an anaphor: it refers back to the referent 'dolphin'.", grammar: [g.anaphora-cohesion], vocab: [w.anáfora, w.retomar, w.referente] }
      - { es: "Cada parágrafo deve começar com um tópico frasal claro.", en: "Each paragraph should begin with a clear topic sentence.", grammar: [g.anaphora-cohesion, g.text-types], vocab: [w.tópico-frasal, w.parágrafo] }
      - { es: "Use conectores para encadear as ideias e garantir a progressão do texto.", en: "Use connectives to link ideas and keep the text moving forward.", grammar: [g.anaphora-cohesion, g.imperative-formal], vocab: [w.conector, w.encadear, w.progressão] }
      - { es: "Os marcadores discursivos ajudam a articular os argumentos de um parágrafo a outro.", en: "Discourse markers help to articulate the arguments from one paragraph to the next.", grammar: [g.anaphora-cohesion, g.discourse-markers-advanced], vocab: [w.marcador-discursivo, w.articular, w.argumento] }
    exchanges:
      - q: { es: "Qual dos dois rios é mais quente, o Negro ou o Solimões?", en: "Which of the two rivers is warmer, the Negro or the Solimões?" }
        a: { es: "O Negro. Este último, por sua vez, é mais frio e mais rápido.", en: "The Negro. The latter, for its part, is colder and faster." }
        alt: ["O rio Negro.", "O Negro, que é também mais lento."]
        grammar: [g.anaphora-cohesion]
        vocab: [w.este-último]
      - q: { es: "O que você achou do documentário?", en: "What did you think of the documentary?" }
        a: { es: "No que diz respeito às imagens, é lindo; quanto ao texto, é fraco.", en: "As regards the images, it's beautiful; as for the script, it's weak." }
        alt: ["Lindo, mas o texto é fraco.", "Gostei muito."]
        grammar: [g.discourse-markers-advanced]
        vocab: [w.no-que-diz-respeito-a, w.quanto-a, w.documentário]
      - q: { es: "O que a professora disse acerca da sua redação?", en: "What did the teacher say about your essay?" }
        a: { es: "Que faltam conectores e que os parágrafos não têm tópico frasal.", en: "That there aren't enough connectives and that the paragraphs have no topic sentence." }
        alt: ["Que falta coesão.", "Que eu repito demais as palavras."]
        grammar: [g.anaphora-cohesion, g.reported-speech-past]
        vocab: [w.acerca-de, w.conector, w.tópico-frasal, w.redação]
      - q: { es: "Por que o meu texto parece repetitivo?", en: "Why does my text seem repetitive?" }
        a: { es: "Porque você repete “o rio” em toda frase; use sinônimos ou retome o referente com um pronome.", en: "Because you repeat 'the river' in every sentence; use synonyms or refer back to the referent with a pronoun." }
        alt: ["Porque você não usa pronomes.", "Falta variar as palavras."]
        grammar: [g.anaphora-cohesion]
        vocab: [w.retomar, w.referente, w.sinônimo]
      - q: { es: "O passeio é caro?", en: "Is the trip expensive?" }
        a: { es: "Um pouco, ou melhor, bastante. Dito isso, vale cada centavo.", en: "A bit, or rather, quite a lot. That said, it's worth every cent." }
        alt: ["É caro, mas vale a pena.", "Não muito."]
        grammar: [g.discourse-markers-advanced]
        vocab: [w.ou-melhor, w.dito-isso]
    texts:
      - title: "Comentário da professora"
        es: ["Seu texto sobre o Encontro das Águas está bem informado.", "No que diz respeito à coesão, porém, há problemas: você repete “o rio” onze vezes.", "Use “este” e “aquele”, sinônimos e pronomes para retomar os referentes."]
        en: ["Your text about the Meeting of the Waters is well informed.", "As regards cohesion, however, there are problems: you repeat 'the river' eleven times.", "Use 'este' and 'aquele', synonyms and pronouns to refer back to the referents."]
        grammar: [g.anaphora-cohesion]
        vocab: [w.no-que-diz-respeito-a, w.retomar, w.referente]
      - title: "Notícia"
        es: ["A prefeitura anunciou um limite para o número de barcos no Encontro das Águas.", "Tal medida, segundo o anúncio, visa proteger os botos.", "Os donos de barcos, por sua vez, criticaram a decisão."]
        en: ["The city council announced a limit on the number of boats at the Meeting of the Waters.", "This measure, according to the announcement, aims to protect the river dolphins.", "The boat owners, for their part, criticised the decision."]
        grammar: [g.anaphora-cohesion, g.discourse-markers-advanced]
        vocab: [w.medida, w.visar, w.por-sua-vez]
    spicy:
      - { es: "Conheci dois irmãos no barco, o Pedro e o Rui; este último me pediu o telefone.", en: "I met two brothers on the boat, Pedro and Rui; the latter asked for my number.", grammar: [g.anaphora-cohesion], vocab: [w.este-último] }
      - { es: "No que diz respeito a você, minha coesão textual desaparece: só sei dizer “uau”.", en: "Where you're concerned, my textual cohesion disappears: all I can say is 'wow'.", altEs: ["No que diz respeito a você, a minha coesão textual desaparece: só sei dizer “uau”."], grammar: [g.discourse-markers-advanced], vocab: [w.no-que-diz-respeito-a, w.coesão] }
      - { es: "Quanto ao jantar, eu cozinho; quanto à sobremesa, a gente negocia.", en: "As for dinner, I'll cook; as for dessert, we'll negotiate.", grammar: [g.discourse-markers-advanced, g.a-gente], vocab: [w.quanto-a, w.negociar] }
      - { es: "Você é linda, ou melhor, linda e engraçada. Dito isso, posso me sentar aqui?", en: "You're beautiful, or rather, beautiful and funny. That said, may I sit here?", altEs: ["Você é linda, ou melhor, linda e engraçada. Dito isso, posso sentar aqui?"], grammar: [g.discourse-markers-advanced], vocab: [w.ou-melhor, w.dito-isso] }
      - { es: "Em relação ao nosso primeiro encontro, o segundo foi uma progressão notável.", en: "Compared with our first date, the second was remarkable progress.", grammar: [g.anaphora-cohesion], vocab: [w.em-relação-a, w.progressão, w.notável] }
  - id: c1.u03.l3
    title: Crônica, resenha, editorial
    teach: [g.text-types]
    vocab: [w.a-propósito, w.em-última-análise, w.em-síntese, w.sobretudo, w.mormente, w.nomeadamente, w.designadamente, w.gênero-textual, w.tipologia, w.narração, w.descrição, w.resenha, w.resumo, w.síntese, w.editorial, w.artigo-de-opinião, w.dicotomia, w.controle, w.narrativo, w.descritivo, w.expositivo, w.argumentativo, w.cotidiano, w.convés]
    tip: "Match the language to the text type: description in the imperfect, narration in the preterite, exposition in the present, argument with a thesis and connectors, instructions in the imperative or infinitive."
    sentences:
      - { es: "Na descrição predomina o imperfeito; na narração, o pretérito perfeito.", en: "In description the imperfect predominates; in narration, the preterite.", grammar: [g.text-types, g.preterite-vs-imperfect], vocab: [w.descrição, w.narração, w.predominar] }
      - { es: "O barco parou e todos olharam para a água.", en: "The boat stopped and everyone looked at the water.", grammar: [g.text-types, g.preterite-regular], vocab: [w.barco, w.olhar], transform: { instruction: "Turn the narration into a description with the imperfect (estar parado, olhar)", answer: "O barco estava parado e todos olhavam para a água.", en: "The boat was still and everyone was looking at the water." } }
      - { es: "A crônica é um gênero textual muito brasileiro, entre o jornalismo e a literatura.", en: "The crônica is a very Brazilian text genre, somewhere between journalism and literature.", grammar: [g.text-types], vocab: [w.gênero-textual, w.crônica, w.jornalismo], variant: "In Portugal: crónica." }
      - { es: "Escrevi uma resenha do documentário sobre o Encontro das Águas.", en: "I wrote a review of the documentary about the Meeting of the Waters.", grammar: [g.text-types], vocab: [w.resenha, w.documentário] }
      - { es: "O resumo deve ter um único parágrafo e nenhuma opinião pessoal.", en: "The summary should be a single paragraph with no personal opinion.", grammar: [g.text-types, g.dever-ter-que], vocab: [w.resumo, w.único, w.opinião], transform: { instruction: "Turn it into an instruction to a student (você)", answer: "Escreva o resumo em um único parágrafo, sem opinião pessoal.", alt: ["Escreva o resumo num único parágrafo, sem opinião pessoal.", "Faça o resumo em um único parágrafo, sem opinião pessoal."], en: "Write the summary in a single paragraph, with no personal opinion." } }
      - { es: "Em síntese, o fenômeno se explica pela física, e não pela magia.", en: "In short, the phenomenon is explained by physics, not by magic.", grammar: [g.text-types, g.se-passive], vocab: [w.em-síntese, w.fenômeno, w.física] }
      - { es: "O editorial do jornal criticou o turismo sem controle no rio.", en: "The newspaper's editorial criticised uncontrolled tourism on the river.", grammar: [g.text-types], vocab: [w.editorial, w.turismo, w.controle] }
      - { es: "No artigo de opinião, o autor defende uma tese e tenta convencer o leitor.", en: "In an opinion piece, the author defends a thesis and tries to convince the reader.", grammar: [g.text-types], vocab: [w.artigo-de-opinião, w.autor, w.tese, w.leitor] }
      - { es: "A tipologia clássica distingue textos narrativos, descritivos, expositivos e argumentativos.", en: "The classic typology distinguishes narrative, descriptive, expository and argumentative texts.", grammar: [g.text-types], vocab: [w.tipologia, w.narrativo, w.descritivo, w.expositivo, w.argumentativo] }
      - { es: "O texto trata de vários temas, nomeadamente a pesca, o turismo e a poluição.", en: "The text deals with several subjects, namely fishing, tourism and pollution.", altEs: ["O texto trata de vários temas, como a pesca, o turismo e a poluição."], grammar: [g.text-types, g.discourse-markers-advanced], vocab: [w.nomeadamente, w.tema, w.poluição], variant: "nomeadamente is very common in Portugal; Brazilians often say como or a saber." }
      - { es: "Alguns rios, designadamente o Negro e o Tapajós, trazem poucos sedimentos.", en: "Some rivers, namely the Negro and the Tapajós, carry little sediment.", grammar: [g.text-types, g.discourse-markers-advanced], vocab: [w.designadamente, w.sedimento] }
      - { es: "O turismo traz renda, sobretudo para as comunidades ribeirinhas.", en: "Tourism brings income, above all for the riverside communities.", grammar: [g.text-types], vocab: [w.sobretudo, w.renda, w.ribeirinho] }
      - { es: "A propósito, você já leu alguma crônica de Clarice Lispector?", en: "By the way, have you ever read any of Clarice Lispector's crônicas?", grammar: [g.discourse-markers-advanced, g.perfeito-composto], vocab: [w.a-propósito, w.crônica] }
      - { es: "Ele deixou o livro aberto naquela página de propósito.", en: "He left the book open at that page on purpose.", grammar: [g.discourse-markers-advanced, g.fixed-expressions], vocab: [w.de-propósito, w.página], error: { wrong: "Ele deixou o livro aberto naquela página a propósito.", explain: "a propósito means 'by the way'; 'on purpose' is de propósito.", grammar: g.discourse-markers-advanced } }
      - { es: "A cidade sofre com o calor, mormente nos meses de setembro e outubro.", en: "The city suffers from the heat, especially in September and October.", altEs: ["A cidade sofre com o calor, sobretudo nos meses de setembro e outubro."], grammar: [g.text-types], vocab: [w.mormente, w.calor] }
      - { es: "Em última análise, a dicotomia entre progresso e preservação é falsa.", en: "Ultimately, the dichotomy between progress and preservation is a false one.", grammar: [g.text-types, g.discourse-markers-advanced], vocab: [w.em-última-análise, w.dicotomia, w.progresso, w.preservação] }
    exchanges:
      - q: { es: "Que tipo de texto é uma crônica?", en: "What kind of text is a crônica?" }
        a: { es: "É um texto curto e pessoal sobre o cotidiano; fica entre o jornalismo e a literatura.", en: "It's a short, personal text about everyday life; it sits between journalism and literature." }
        alt: ["Um texto literário curto sobre o dia a dia.", "Um gênero muito brasileiro."]
        grammar: [g.text-types]
        vocab: [w.crônica, w.cotidiano]
      - q: { es: "Quem você recomenda para começar a ler crônicas?", en: "Who would you recommend for starting to read crônicas?" }
        a: { es: "Rubem Braga, sobretudo; e, a propósito, Fernando Sabino também é ótimo.", en: "Rubem Braga, above all; and, by the way, Fernando Sabino is great too." }
        alt: ["Rubem Braga.", "Luis Fernando Verissimo, que é muito engraçado."]
        grammar: [g.text-types, g.discourse-markers-advanced]
        vocab: [w.sobretudo, w.a-propósito]
      - q: { es: "Você leu o editorial de hoje?", en: "Did you read today's editorial?" }
        a: { es: "Li. Em síntese, defende que o turismo no rio precisa de regras.", en: "I did. In short, it argues that tourism on the river needs rules." }
        alt: ["Li, e não concordo.", "Ainda não."]
        grammar: [g.text-types]
        vocab: [w.editorial, w.em-síntese]
      - q: { es: "Qual é a diferença entre resumo e resenha?", en: "What's the difference between a summary and a review?" }
        a: { es: "O resumo apenas sintetiza o conteúdo; a resenha também o avalia.", en: "A summary just condenses the content; a review also evaluates it." }
        alt: ["A resenha tem opinião; o resumo, não.", "O resumo é neutro."]
        grammar: [g.text-types, g.anaphora-cohesion]
        vocab: [w.resumo, w.resenha, w.sintetizar]
      - q: { es: "No fim das contas, o que você achou do livro?", en: "All things considered, what did you think of the book?" }
        a: { es: "Em última análise, é uma boa narração com descrições longas demais.", en: "Ultimately, it's a good narrative with descriptions that are far too long." }
        alt: ["Bom, mas longo demais.", "Gostei, sobretudo do final."]
        grammar: [g.text-types]
        vocab: [w.em-última-análise, w.narração, w.descrição]
    texts:
      - title: "Início de uma crônica"
        es: ["Era domingo, e o barco das nove saiu atrasado, como sempre.", "No convés, uma menina perguntou ao pai por que o rio tinha duas cores.", "O pai pensou, pensou, e respondeu: “Porque eles brigaram”."]
        en: ["It was Sunday, and the nine o'clock boat left late, as always.", "On deck, a little girl asked her father why the river had two colours.", "Her father thought and thought, and answered: 'Because they had a fight'."]
        grammar: [g.text-types, g.preterite-vs-imperfect]
        vocab: [w.crônica, w.convés]
      - title: "Resenha (trecho)"
        es: ["O documentário “Duas Águas” é, sobretudo, um belo ensaio visual.", "A narração, porém, é monótona e repete informações.", "Em síntese: imagens excelentes, roteiro fraco."]
        en: ["The documentary 'Two Waters' is, above all, a beautiful visual essay.", "The narration, however, is monotonous and repeats information.", "In short: excellent images, weak script."]
        grammar: [g.text-types]
        vocab: [w.resenha, w.sobretudo, w.narração, w.em-síntese]
    spicy:
      - { es: "Se a nossa história fosse um gênero textual, seria uma crônica: curta, engraçada e com final em aberto.", en: "If our story were a text genre, it would be a crônica: short, funny and with an open ending.", altEs: ["Se nossa história fosse um gênero textual, seria uma crônica: curta, engraçada e com o final em aberto."], grammar: [g.text-types, g.se-clauses-unreal], vocab: [w.gênero-textual, w.crônica] }
      - { es: "Fiz uma resenha do nosso primeiro encontro: cinco estrelas, sobretudo pela sobremesa.", en: "I wrote a review of our first date: five stars, above all for the dessert.", grammar: [g.text-types], vocab: [w.resenha, w.sobretudo] }
      - { es: "Em síntese: você é bonito, inteligente e está me devendo uma ligação.", en: "In short: you're handsome, clever and you owe me a call.", grammar: [g.text-types], vocab: [w.em-síntese, w.dever] }
      - { es: "A propósito, aquele sorriso foi de propósito?", en: "By the way, was that smile on purpose?", grammar: [g.discourse-markers-advanced, g.fixed-expressions], vocab: [w.a-propósito, w.de-propósito, w.sorriso] }
      - { es: "Em última análise, a dicotomia entre ficar e ir embora se resolve com mais um café.", en: "Ultimately, the dichotomy between staying and leaving is resolved with one more coffee.", grammar: [g.text-types], vocab: [w.em-última-análise, w.dicotomia] }
  - id: c1.u03.l4
    title: Elucidar, sintetizar, reiterar
    teach: [g.discourse-markers-advanced, g.anaphora-cohesion]
    vocab: [w.elucidar, w.explicitar, w.ratificar, w.retificar, w.reiterar, w.exemplificar, w.ilustrar, w.sintetizar, w.paráfrase, w.discorrer, w.permear, w.nortear, w.vigente, w.subjacente, w.intrínseco, w.inerente, w.abrangente, w.abranger, w.englobar, w.boto-cor-de-rosa, w.mistério, w.copiar, w.original, w.trema, w.eliminar, w.resistir, w.digital, w.guardanapo, w.tropeçar, w.frequente]
    tip: "Precise verbs make an essay cohesive: elucidar (clear up), explicitar (spell out), reiterar (repeat), sintetizar (sum up). Watch the pair retificar (correct) / ratificar (confirm)."
    sentences:
      - { es: "O guia elucidou o mistério: as águas não se misturam por causa da diferença de densidade.", en: "The guide cleared up the mystery: the waters don't mix because of the difference in density.", grammar: [g.discourse-markers-advanced], vocab: [w.elucidar, w.mistério, w.densidade] }
      - { es: "Explicite a sua tese logo no primeiro parágrafo.", en: "Spell out your thesis right in the first paragraph.", altEs: ["Explicite sua tese logo no primeiro parágrafo."], grammar: [g.imperative-formal, g.text-types], vocab: [w.explicitar, w.tese, w.parágrafo] }
      - { es: "O jornal retificou a informação: são cerca de seis quilômetros, e não sessenta.", en: "The newspaper corrected the information: it's about six kilometres, not sixty.", grammar: [g.discourse-markers-advanced], vocab: [w.retificar, w.quilômetro], error: { wrong: "O jornal ratificou a informação: são cerca de seis quilômetros, e não sessenta.", explain: "retificar = to correct; ratificar = to confirm. A newspaper corrects (retifica) a mistake.", grammar: g.discourse-markers-advanced } }
      - { es: "Eu disse antes que não se deve nadar ali e digo de novo.", en: "I said before that you shouldn't swim there, and I'm saying it again.", grammar: [g.discourse-markers-advanced, g.indeterminate-subject], vocab: [w.nadar], transform: { instruction: "Rewrite formally with reiterar", answer: "Reitero que não se deve nadar ali.", alt: ["Reitero o que disse antes: não se deve nadar ali."], en: "I reiterate that you shouldn't swim there." } }
      - { es: "Para exemplificar, o autor compara os dois rios a café e leite que não se misturam.", en: "By way of example, the author compares the two rivers to coffee and milk that don't mix.", grammar: [g.discourse-markers-advanced], vocab: [w.exemplificar, w.comparar] }
      - { es: "As fotos ilustram bem o contraste entre as duas águas.", en: "The photos illustrate the contrast between the two waters well.", grammar: [g.anaphora-cohesion], vocab: [w.ilustrar, w.contraste] }
      - { es: "Sintetize o artigo em menos de cem palavras.", en: "Sum up the article in under a hundred words.", grammar: [g.imperative-formal], vocab: [w.sintetizar, w.artigo] }
      - { es: "Uma boa paráfrase diz o mesmo com outras palavras, sem copiar o original.", en: "A good paraphrase says the same thing in other words, without copying the original.", grammar: [g.text-types], vocab: [w.paráfrase, w.copiar, w.original] }
      - { es: "No segundo capítulo, o autor discorre sobre a história da navegação no rio Negro.", en: "In the second chapter, the author discourses on the history of navigation on the Rio Negro.", grammar: [g.text-types], vocab: [w.discorrer, w.capítulo, w.navegação] }
      - { es: "Uma certa melancolia permeia todas as crônicas do livro.", en: "A certain melancholy permeates all the crônicas in the book.", grammar: [g.text-types], vocab: [w.permear, w.melancolia] }
      - { es: "Que pergunta norteia a sua pesquisa?", en: "What question guides your research?", altEs: ["Qual pergunta norteia a sua pesquisa?", "Que pergunta norteia sua pesquisa?"], grammar: [g.question-words], vocab: [w.nortear, w.pesquisa], transform: { instruction: "Make it an indirect question starting Quero saber…", answer: "Quero saber que pergunta norteia a sua pesquisa.", alt: ["Quero saber qual pergunta norteia a sua pesquisa.", "Quero saber que pergunta norteia sua pesquisa."], en: "I want to know what question guides your research." } }
      - { es: "O acordo ortográfico vigente eliminou o trema de palavras como “frequente”.", en: "The spelling agreement now in force removed the diaeresis from words like 'frequente'.", grammar: [g.spelling-agreement], vocab: [w.vigente, w.trema, w.eliminar] }
      - { es: "Há uma ideia subjacente ao texto: a natureza resiste ao controle humano.", en: "There's an idea underlying the text: nature resists human control.", grammar: [g.anaphora-cohesion], vocab: [w.subjacente, w.resistir, w.humano] }
      - { es: "A beleza do fenômeno é intrínseca ao lugar; não depende de nós.", en: "The beauty of the phenomenon is intrinsic to the place; it doesn't depend on us.", grammar: [g.ser-estar-ficar-advanced], vocab: [w.intrínseco, w.fenômeno] }
      - { es: "O risco é inerente a qualquer viagem pela floresta.", en: "Risk is inherent in any journey through the forest.", grammar: [g.ser-estar-ficar-advanced], vocab: [w.inerente, w.risco] }
      - { es: "O estudo é abrangente: abrange a bacia inteira e engloba dados de trinta anos.", en: "The study is comprehensive: it covers the whole basin and encompasses thirty years of data.", grammar: [g.anaphora-cohesion], vocab: [w.abrangente, w.abranger, w.englobar, w.estudo] }
    exchanges:
      - q: { es: "Você pode elucidar esse ponto?", en: "Can you clear up that point?" }
        a: { es: "Claro: em outras palavras, os rios correm juntos, mas não se misturam.", en: "Of course: in other words, the rivers flow together but don't mix." }
        alt: ["Posso: vou dar um exemplo.", "Vou tentar explicar melhor."]
        grammar: [g.discourse-markers-advanced]
        vocab: [w.elucidar]
      - q: { es: "O estudo novo confirmou os dados antigos?", en: "Did the new study confirm the old data?" }
        a: { es: "Ratificou quase tudo e retificou um único dado: a temperatura.", en: "It confirmed nearly everything and corrected a single figure: the temperature." }
        alt: ["Confirmou, sim.", "Em parte."]
        grammar: [g.discourse-markers-advanced]
        vocab: [w.ratificar, w.retificar]
      - q: { es: "Qual é a ideia subjacente ao livro?", en: "What's the idea underlying the book?" }
        a: { es: "Que o rio é inerente à identidade da cidade.", en: "That the river is inherent to the city's identity." }
        alt: ["Que o rio molda a cidade.", "Que natureza e cultura não se separam."]
        grammar: [g.anaphora-cohesion]
        vocab: [w.subjacente, w.inerente, w.identidade]
      - q: { es: "O relatório cobre só Manaus?", en: "Does the report only cover Manaus?" }
        a: { es: "Não, é bem abrangente: engloba toda a bacia.", en: "No, it's very comprehensive: it encompasses the whole basin." }
        alt: ["Não, abrange a região inteira.", "Só Manaus e arredores."]
        grammar: [g.anaphora-cohesion]
        vocab: [w.abrangente, w.englobar]
      - q: { es: "Posso copiar o parágrafo da internet?", en: "Can I copy the paragraph from the internet?" }
        a: { es: "Não; faça uma paráfrase e cite a fonte.", en: "No; paraphrase it and cite the source." }
        alt: ["Só se citar a fonte.", "Não, isso é plágio."]
        grammar: [g.imperative-formal]
        vocab: [w.paráfrase, w.fonte, w.copiar]
    texts:
      - title: "Orientações para a redação"
        es: ["Explicite a sua tese logo na introdução.", "Ilustre cada argumento com um exemplo concreto.", "Na conclusão, sintetize as ideias sem simplesmente repetir o que já disse."]
        en: ["Spell out your thesis right in the introduction.", "Illustrate each argument with a concrete example.", "In the conclusion, sum up the ideas without simply repeating what you've already said."]
        grammar: [g.imperative-formal, g.text-types]
        vocab: [w.explicitar, w.ilustrar, w.sintetizar]
      - title: "Correção no jornal"
        es: ["Ao contrário do que foi publicado ontem, as águas correm lado a lado por cerca de seis quilômetros, e não sessenta.", "Pedimos desculpas aos leitores.", "A informação já foi retificada na versão digital."]
        en: ["Contrary to what was published yesterday, the waters flow side by side for about six kilometres, not sixty.", "We apologise to our readers.", "The information has already been corrected in the digital edition."]
        grammar: [g.passive-ser, g.text-types]
        vocab: [w.retificar, w.digital]
    spicy:
      - { es: "Reitero o convite: jantar às oito, e desta vez o celular fica desligado.", en: "I repeat my invitation: dinner at eight, and this time the phone stays off.", grammar: [g.discourse-markers-advanced, g.passive-estar-ficar], vocab: [w.reiterar, w.convite] }
      - { es: "Para ilustrar o quanto gostei de você, guardei até o guardanapo.", en: "To illustrate how much I liked you, I even kept the napkin.", grammar: [g.discourse-markers-advanced], vocab: [w.ilustrar, w.guardanapo] }
      - { es: "Um certo charme permeia tudo o que você faz, até quando você tropeça.", en: "A certain charm permeates everything you do, even when you trip.", grammar: [g.anaphora-cohesion], vocab: [w.permear, w.charme, w.tropeçar] }
      - { es: "Você precisa explicitar as suas intenções, ou vou continuar fingindo que não entendi.", en: "You need to spell out your intentions, or I'll keep pretending I haven't understood.", altEs: ["Você precisa explicitar suas intenções, ou eu vou continuar fingindo que não entendi."], grammar: [g.periphrases-aspect], vocab: [w.explicitar, w.intenção] }
      - { es: "Vamos retificar a situação: estamos lado a lado há quilômetros, como o Negro e o Solimões, e ainda não nos misturamos.", en: "Let's correct the situation: we've been side by side for kilometres, like the Negro and the Solimões, and we still haven't mixed.", grammar: [g.discourse-markers-advanced, g.ha-faz-time], vocab: [w.retificar, w.misturar] }
dialogues:
  - id: c1.u03.d1
    title: No barco para o Encontro das Águas
    context: Laura, who writes a travel blog, and her friend Diego take a boat trip from Manaus. Seu Raimundo, the guide, explains what they are seeing.
    lines:
      - { speaker: Raimundo, es: "Pessoal, olhem à direita: ali começa o Encontro das Águas.", en: "Everyone, look to the right: that's where the Meeting of the Waters begins." }
      - { speaker: Laura, es: "Que impressionante! De um lado, a água escura; do outro, a barrenta.", en: "How impressive! On one side, the dark water; on the other, the muddy water." }
      - { speaker: Raimundo, es: "Exatamente. Aquela, escura, é do rio Negro; esta, mais clara, é do Solimões.", en: "Exactly. That dark one is the Rio Negro's; this lighter one is the Solimões's." }
      - { speaker: Diego, es: "E por que elas não se misturam?", en: "And why don't they mix?" }
      - { speaker: Raimundo, es: "Em virtude de três diferenças: temperatura, velocidade e densidade. O Negro é mais quente e mais lento, ao passo que o Solimões é mais frio e mais rápido.", en: "By virtue of three differences: temperature, speed and density. The Negro is warmer and slower, whereas the Solimões is colder and faster." }
      - { speaker: Laura, es: "E por quanto tempo elas correm assim, lado a lado?", en: "And for how long do they flow like that, side by side?" }
      - { speaker: Raimundo, es: "Por cerca de seis quilômetros. Depois, as águas acabam se misturando e formam o rio Amazonas.", en: "For about six kilometres. After that, the waters end up mixing and form the Amazon River." }
      - { speaker: Diego, es: "Vou pôr isso no blog. Ou melhor, a Laura vai escrever, que ela escreve muito melhor do que eu.", en: "I'm going to put this on the blog. Or rather, Laura's going to write it, because she writes much better than I do." }
      - { speaker: Laura, es: "Escrevo, mas com uma condição: você tira as fotos. A propósito, Seu Raimundo, é verdade que tem botos aqui?", en: "I will, on one condition: you take the photos. By the way, Seu Raimundo, is it true there are river dolphins here?" }
      - { speaker: Raimundo, es: "Tem, sim. Olhem ali, perto da margem: um boto-cor-de-rosa!", en: "There are. Look over there, near the bank: a pink river dolphin!" }
    questions:
      - { q: "Como é a água do Solimões?", options: ["Escura", "Barrenta", "Azul"], answer: 1, explain: "Aquela, escura, é do rio Negro; esta, mais clara (a barrenta), é do Solimões." }
      - { q: "Segundo o guia, qual dos rios é mais rápido?", options: ["O Negro", "O Solimões", "Os dois têm a mesma velocidade"], answer: 1, explain: "O Negro é mais lento, ao passo que o Solimões é mais rápido." }
      - { q: "O que acontece depois de cerca de seis quilômetros?", options: ["Os rios se separam de vez", "As águas se misturam e formam o Amazonas", "O rio Negro desaparece"], answer: 1, explain: "As águas acabam se misturando e formam o rio Amazonas." }
      - { q: "Quem vai escrever o texto para o blog?", options: ["Diego", "Laura", "Seu Raimundo"], answer: 1, explain: "Ou melhor, a Laura vai escrever: ou melhor corrects what Diego said first." }
writing:
  - task: "Write an expository paragraph explaining the Meeting of the Waters, using advanced connectors (ao passo que, em virtude de, por conseguinte, na medida em que…)."
    min: 110
    max: 190
    use: [w.ao-passo-que, w.em-virtude-de, w.por-conseguinte, w.densidade, w.sedimento]
    useAtLeast: 3
    grammar: [g.discourse-markers-advanced]
    expect:
      - { pattern: '\b(ao passo que|na medida em que|em virtude d|em decorr[eê]ncia d|tendo em vista|haja vista|dado que|por conseguinte|destarte|n[aã]o obstante|porquanto)', hint: "Use advanced connectors: ao passo que, em virtude de, por conseguinte…" }
    model: { es: "O Encontro das Águas, perto de Manaus, é um dos fenômenos naturais mais impressionantes da Amazônia. Ali, o Rio Negro, de águas escuras, encontra o Rio Solimões, de cor barrenta. O Rio Negro é ácido e quente, ao passo que o Solimões é mais frio e carrega muito sedimento. Em virtude dessas diferenças de temperatura, de velocidade e de densidade, as águas não se misturam logo: seguem lado a lado por cerca de seis quilômetros. Por conseguinte, quem observa a paisagem de um barco vê dois rios de cores diferentes dentro do mesmo leito. Só depois as águas se juntam e formam o Rio Amazonas, na medida em que a força do rio vence o contraste entre elas.", en: "The Meeting of the Waters, near Manaus, is one of the most impressive natural phenomena in the Amazon. There the Rio Negro, with its dark waters, meets the Solimões, which is muddy brown. The Rio Negro is acidic and warm, whereas the Solimões is colder and carries a lot of sediment. Because of these differences in temperature, speed and density, the waters don't mix straight away: they run side by side for about six kilometres. Consequently, anyone watching from a boat sees two rivers of different colours in the same bed. Only later do the waters merge and form the Amazon, as the force of the river overcomes the contrast between them." }
  - task: "Compare two Amazonian cities (or two rivers, or two people), keeping reference clear across sentences with a primeira / a segunda, este último, aquele, tais…"
    min: 110
    max: 190
    use: [w.este-último, w.no-que-diz-respeito-a, w.quanto-a, w.em-relação-a, w.sobretudo]
    useAtLeast: 3
    grammar: [g.anaphora-cohesion]
    expect:
      - { pattern: '\b(este [uú]ltimo|esta [uú]ltima|aquele|aquela|o primeiro|a primeira|o segundo|a segunda|tal|tais)\b', hint: "Refer back clearly: a primeira, a segunda, esta última, aquela…" }
      - { pattern: '\b(no que diz respeito|no que tange|quanto [aà]o?|em rela[cç][aã]o a)', hint: "Introduce each topic: no que diz respeito a…, quanto à…" }
    model: { es: "Manaus e Belém são as duas capitais mais importantes da Amazônia, mas são muito diferentes. A primeira fica no coração da floresta, às margens do Rio Negro; a segunda, perto do mar, na foz do Amazonas. No que diz respeito à economia, Manaus depende sobretudo da indústria, ao passo que Belém vive mais do comércio e do porto. Quanto à comida, esta última é famosa pelo açaí e pelo tacacá, enquanto aquela se destaca pelos peixes de rio, como o tambaqui. Em relação ao clima, as duas são quentes e úmidas o ano inteiro. Tais diferenças tornam a viagem entre as duas capitais, que dura cinco dias de barco, ainda mais interessante.", en: "Manaus and Belém are the two most important capitals in the Amazon, but they are very different. The former lies in the heart of the forest, on the banks of the Rio Negro; the latter near the sea, at the mouth of the Amazon. As far as the economy is concerned, Manaus depends above all on industry, whereas Belém lives more from trade and its port. As for food, the latter is famous for açaí and tacacá, while the former stands out for its river fish, such as tambaqui. With regard to climate, both are hot and humid all year round. Such differences make the journey between the two capitals, which takes five days by boat, all the more interesting." }
  - task: "Write a short review (resenha) of a documentary, book or film about the Amazon: a summary, your assessment and a recommendation."
    min: 110
    max: 190
    use: [w.resenha, w.documentário, w.cotidiano, w.em-síntese, w.narrativo]
    useAtLeast: 3
    grammar: [g.text-types]
    expect:
      - { pattern: '\b(em s[ií]ntese|em [uú]ltima an[aá]lise|em suma|em resumo)\b', hint: "Sum up: Em síntese…, Em última análise…" }
      - { pattern: '\b(recomendo|recomendo-o|vale a pena|merece|n[aã]o recomendo)\b', hint: "Recommend it or not: Recomendo…, Vale a pena…" }
    model: { es: "O documentário que assisti ontem acompanha a vida de uma família ribeirinha durante um ano inteiro, da cheia à vazante do rio. A proposta é simples: não há narrador, e são os moradores que contam a sua própria história. O ritmo lento pode incomodar alguns espectadores, mas, a meu ver, é justamente esse ritmo que nos faz entender o cotidiano da floresta. As imagens são impressionantes, sobretudo as cenas da cheia, quando a casa da família parece flutuar sobre a água. O texto narrativo é mínimo, e o silêncio diz muito. Em síntese, trata-se de um trabalho sensível e honesto. Recomendo-o a quem quiser conhecer a Amazônia real, longe dos cartões-postais.", en: "The documentary I watched yesterday follows the life of a riverside family for a whole year, from the river's high water to its low water. The approach is simple: there's no narrator, and it's the residents who tell their own story. The slow pace may bother some viewers, but in my view it's precisely this pace that makes us understand everyday life in the forest. The images are impressive, especially the flood scenes, when the family's house seems to float on the water. The narrative text is minimal, and the silence says a lot. In short, it's a sensitive and honest piece of work. I recommend it to anyone who wants to know the real Amazon, far from the postcards." }
  - task: "Write a paragraph for a study guide that explains and illustrates an abstract idea (for example, 'in the Amazon, the river shapes life'), using verbs like elucidar, exemplificar, ilustrar, sintetizar and reiterar."
    min: 110
    max: 190
    use: [w.elucidar, w.exemplificar, w.sintetizar, w.reiterar, w.inerente]
    useAtLeast: 3
    grammar: [g.discourse-markers-advanced, g.anaphora-cohesion]
    expect:
      - { pattern: '\b(elucid|exemplific|ilustr|sintetiz|reiter|explicit|discorr)', hint: "Use academic verbs: elucidar, exemplificar, ilustrar, reiterar…" }
    model: { es: "Para elucidar a ideia de que o rio organiza a vida na Amazônia, convém exemplificar com o calendário de uma comunidade ribeirinha. Durante a cheia, a pesca fica difícil e as famílias dependem da mandioca plantada nos meses anteriores; na vazante, ao contrário, as praias de areia aparecem de novo e há peixe para todos. A escola, as festas e até os casamentos seguem esse ritmo. Tais exemplos ilustram uma relação inerente entre as pessoas e a água, que não se explica apenas pelo mapa da região. Para sintetizar, reitero o argumento principal: na Amazônia, não é o calendário que decide o ritmo do rio, mas o rio que decide o ritmo do calendário.", en: "To shed light on the idea that the river organises life in the Amazon, it's worth giving the example of a riverside community's calendar. During the high water, fishing becomes difficult and families depend on cassava planted in previous months; at low water, by contrast, the sandy beaches reappear and there's fish for everyone. School, festivals and even weddings follow this rhythm. Such examples illustrate a relationship between people and water that is inherent, and not explained by the map of the region alone. To sum up, I reiterate the main argument: in the Amazon, it is not the calendar that sets the river's rhythm, but the river that sets the calendar's." }
