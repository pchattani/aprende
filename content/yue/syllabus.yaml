# The whole journey, A1 -> C2, in Hong Kong Cantonese (traditional characters,
# colloquial written Cantonese). Each unit lists the grammar points it teaches
# (ids resolve to notes in grammar/<level>.yaml) and CEFR can-do statements.
# `authored: true` means units/<level>/<unit>.yaml exists with lessons.
# Journey: A1 Hong Kong Island, A2 Kowloon, B1 New Territories,
# B2 Outlying Islands, C1 Macau, C2 Guangzhou & Foshan.
levels:
  - id: a1
    title: A1
    name: Breakthrough
    description: Start from zero with a slow starter path (numbers, first phrases, your first characters), then understand and use everyday Cantonese expressions and very basic phrases. Introduce yourself, ask and answer simple personal questions, count, shop and order food, and get around Hong Kong Island when people speak slowly.
    wordTarget: 700
    canDo:
      - Count to 99 and write the numbers, a first set of pictograms (山, 水, 人…) and the sight characters 上, 下, 大, 小, 不.
      - Greet people, introduce myself and others, and say where I am from and where I live.
      - Count, give my phone number and age, and use the right measure word for common things.
      - Ask prices, pay and shop at a market; order dim sum at a yum cha restaurant.
      - Tell the time, give dates and describe my family and my daily routine.
      - Ask for directions, take the MTR and talk about the weather.
    units:
      # Starter path (a1.u13–a1.u22): very short, slow units placed before a1.u01. New ids so stored progress keeps its meaning.
      - id: a1.u13
        title: 數數字
        subtitle: Numbers 1–99 - hear, say and write them
        authored: true
        canDo:
          - "Recognise, say and write the numbers 一 to 十."
          - "Count from zero to ninety-nine."
          - "Hear a number and pick it out."
        grammar: [g.counting-1-10, g.stroke-order, g.numbers-1-99]
      - id: a1.u14
        title: 你好、唔該、多謝
        subtitle: First words - hello, please and thank you
        authored: true
        canDo:
          - 'Say hello and answer "how are you?".'
          - "Use 唔該 for please, excuse me and thanks for a service."
          - "Use 多謝 for thanks for a gift or a compliment, and reply to both."
        grammar: [g.greetings, g.mgoi-doze]
      - id: a1.u15
        title: 象形字
        subtitle: Pictograms - characters that started as pictures
        authored: true
        canDo:
          - "Recognise ten pictograms: 人 口 山 木 火 水 田 月 雨 門."
          - "Write them in the right stroke order."
          - "Read 出口, 入口 and 門口 on signs."
        grammar: [g.pictograms, g.stroke-order]
      - id: a1.u16
        title: 我叫……
        subtitle: Introducing yourself - name, surname, country, age
        authored: true
        canDo:
          - "Say my name and surname and ask someone theirs."
          - "Say where I am from and ask where someone is from."
          - "Say how old I am and ask someone's age."
        grammar: [g.name-giu-sing, g.hai6-identity, g.nationality-language, g.age]
      - id: a1.u17
        title: 今日幾號？
        subtitle: Dates, days and time
        authored: true
        canDo:
          - "Say the date and the day of the week."
          - "Ask and tell the time on the hour and the half hour."
          - "Write 日 and 月 and the number characters."
        grammar: [g.dates, g.days-weeks, g.clock-time, g.loeng-vs-ji]
      - id: a1.u18
        title: 咖啡同點心
        subtitle: First foods and drinks
        authored: true
        canDo:
          - "Recognise seven foods by sound and by sight: 咖啡 茶 點心 菠蘿包 餃子 牛肉 炒飯."
          - "Say what I eat and drink with 食 and 飲."
        grammar: [g.sik-jam, g.classifiers-intro]
      - id: a1.u19
        title: 兩杯咖啡，唔該
        subtitle: Ordering - numbers, food and please
        authored: true
        canDo:
          - "Order drinks and food with a number and a measure word."
          - "Ask how much something is and understand the price."
          - "Say 唔該 and 多謝 at the right moment."
        grammar: [g.order-mgoi, g.loeng-vs-ji, g.prices-gei-do-cin, g.jiu-want]
      - id: a1.u20
        title: 我同我屋企人
        subtitle: Me and my family
        authored: true
        canDo:
          - "Recognise the words for mum, dad, brothers and sisters."
          - "Say who is in my family."
          - "Talk about pets with 隻: 我屋企有三隻狗狗."
        grammar: [g.kinship-terms, g.jau-have, g.common-classifiers]
      - id: a1.u21
        title: 上下大小不
        subtitle: Five sight characters - up, down, big, small, not
        authored: true
        canDo:
          - "Recognise and write 上 下 大 小 不."
          - "Read 上面, 下面, 樓上, 樓下 and 小心."
          - "Suggest something with 不如."
        grammar: [g.sight-characters, g.stroke-order]
      - id: a1.u22
        title: 早晨！拜拜！
        subtitle: Everyday words - morning, goodbye, today and tomorrow
        authored: true
        canDo:
          - 'Say good morning, goodbye and "time to eat!".'
          - "Talk about today, tomorrow and yesterday."
          - "Say sorry, say food is tasty and say what I like."
        grammar: [g.greetings, g.days-weeks, g.zung-ji-like]
      - id: a1.u01
        title: 打招呼同自我介紹
        subtitle: Greetings and introductions
        authored: true
        canDo:
          - "Greet people and say goodbye at different times of day."
          - "Say my name and surname and ask someone theirs."
          - 'Say who I am and ask "and you?".'
        grammar: [g.greetings, g.personal-pronouns, g.hai6-identity, g.name-giu-sing, g.ne-follow-up]
      - id: a1.u02
        title: 我喺香港
        subtitle: Being, being somewhere, having - 係, 喺, 有
        authored: true
        canDo:
          - "Say where I am and where I live."
          - "Say what I have and do not have."
          - "Make a sentence negative and turn it into a yes/no question."
        grammar: [g.hai2-location, g.jau-have, g.m-negation, g.mou-negation, g.maa-questions]
      - id: a1.u03
        title: 我哋係朋友
        subtitle: We, you and they - plurals and yes/no questions
        authored: true
        canDo:
          - "Talk about groups of people with 我哋, 你哋, 佢哋."
          - "Say where people are from and which languages they speak."
          - "Ask yes/no questions with 係唔係 and 去唔去."
        grammar: [g.dei-plural, g.dou-also, g.a-not-a-questions, g.nationality-language]
      - id: a1.u04
        title: 數字同電話號碼
        subtitle: Numbers, ages and phone numbers
        authored: true
        canDo:
          - "Count from one to ninety-nine."
          - "Give my phone number and age and ask for someone else's."
          - 'Ask "how many?" with 幾.'
        grammar: [g.numbers-1-99, g.loeng-vs-ji, g.phone-numbers, g.age, g.gei-how-many]
      - id: a1.u05
        title: 一個、兩隻、三本
        subtitle: Measure words, this and that
        authored: true
        canDo:
          - "Count things with the right measure word."
          - "Point things out with 呢個 and 嗰個."
          - 'Talk about "my phone" and "some books" the Cantonese way.'
        grammar: [g.classifiers-intro, g.common-classifiers, g.demonstratives, g.classifier-as-the, g.di-some]
      - id: a1.u06
        title: 去街市買嘢
        subtitle: Money and shopping at the market
        authored: true
        canDo:
          - "Understand prices in dollars and cents."
          - "Ask how much something costs and say how many I want."
          - "Count into the hundreds and thousands."
        grammar: [g.big-numbers, g.money, g.prices-gei-do-cin, g.jiu-want]
      - id: a1.u07
        title: 而家幾點？
        subtitle: Time, days and dates
        authored: true
        canDo:
          - "Tell and ask the time."
          - "Say the day of the week and the date."
          - "Say when I do things, with the time before the verb."
        grammar: [g.clock-time, g.days-weeks, g.dates, g.time-before-verb]
      - id: a1.u08
        title: 我屋企人
        subtitle: My family
        authored: true
        canDo:
          - "Introduce the members of my family."
          - "Describe people with simple adjectives."
          - "Ask who, what, where and when."
        grammar: [g.ge-possessive, g.kinship-terms, g.adjective-predicates, g.question-words]
      - id: a1.u09
        title: 去飲茶
        subtitle: Yum cha and food
        authored: true
        canDo:
          - "Order dim sum and drinks and ask for the bill."
          - "Thank people correctly with 唔該 and 多謝."
          - "Say what I like and don't like."
        grammar: [g.mgoi-doze, g.zung-ji-like, g.bei-give, g.particles-aa-laa]
      - id: a1.u10
        title: 坐港鐵、問路
        subtitle: Directions and the MTR
        authored: true
        canDo:
          - "Ask how to get somewhere and understand simple directions."
          - "Say where things are using position words."
          - "Say how I travel - by MTR, bus, tram or ferry."
        grammar: [g.position-words, g.heoi-lai, g.transport-verbs, g.asking-directions]
      - id: a1.u11
        title: 我嘅一日
        subtitle: My daily routine
        authored: true
        canDo:
          - "Describe my day in order."
          - "Say how often I do things."
          - "Say what I do when something happens."
        grammar: [g.serial-verbs, g.frequency-adverbs, g.sin-zoi-sequence, g.ge-si-hau]
      - id: a1.u12
        title: 今日天氣點呀？
        subtitle: The weather and describing things
        authored: true
        canDo:
          - "Talk about the weather and the seasons in Hong Kong."
          - "Say how hot, cold or tired I am - very, a bit, too."
          - "Describe things with adjective + 嘅 + noun."
        grammar: [g.weather, g.degree-adverbs, g.jau-di-a-bit, g.adj-ge-noun]

  - id: a2
    title: A2
    name: Waystage
    description: Understand sentences and frequent expressions about everyday life. Talk about what you have done, are doing and have experienced, compare things, say what you can and must do, and soften what you say with sentence-final particles while exploring Kowloon.
    wordTarget: 1500
    canDo:
      - Say what I have done, what I am doing and what I have never done, with 咗, 緊 and 過.
      - Compare places, prices and people with 比 and 過.
      - Say what I can, may, know how to and must do with 會, 可以, 識 and 要.
      - Describe how well and how fast something is done, and whether I manage to do it.
      - Make and answer invitations, phone calls and visits to the doctor using natural particles.
    units:
      - id: a2.u01
        title: 你食咗飯未呀？
        subtitle: Done and not yet - 咗 and 未
        authored: true
        canDo:
          - "Say what I have already done today."
          - 'Ask and answer "have you … yet?" with 未.'
          - "Say what I did not do with 冇."
        grammar: [g.zo-perfective, g.mei-questions, g.mou-past-negation, g.ji-ging-already]
      - id: a2.u02
        title: 我做緊嘢
        subtitle: In progress - 緊, 住 and 喺度
        authored: true
        canDo:
          - "Say what I and others are doing right now."
          - "Describe ongoing states like sitting, wearing and holding."
          - "Explain on the phone why I can't talk."
        grammar: [g.gan-progressive, g.zyu-continuous, g.hai-dou-progressive]
      - id: a2.u03
        title: 你去過日本未呀？
        subtitle: Experiences - 過
        authored: true
        canDo:
          - "Talk about places I have been to and things I have tried."
          - "Say I have never done something."
          - "Choose between 咗 and 過."
        grammar: [g.gwo-experiential, g.cang-ging, g.zo-vs-gwo]
      - id: a2.u04
        title: 旺角定銅鑼灣好？
        subtitle: Comparisons - 比 and 過
        authored: true
        canDo:
          - "Compare two things with 比 and with adjective + 過."
          - "Say something is not as … as something else."
          - "Say what is the best, the cheapest or the same."
        grammar: [g.bei2-comparison, g.adj-gwo-comparison, g.mou-gam-not-as, g.zeoi-superlative, g.jat-joeng-same]
      - id: a2.u05
        title: 我識講廣東話
        subtitle: Can, may, know how to, must - 會, 可以, 識, 要
        authored: true
        canDo:
          - "Say what will probably happen."
          - "Ask for and give permission."
          - "Say what I know how to do and what I must or needn't do."
        grammar: [g.wui-will, g.ho-ji-can-may, g.sik-know-how, g.jiu-must-m-sai]
      - id: a2.u06
        title: 你講得好好
        subtitle: Verb complements - 得, 到, 吓
        authored: true
        canDo:
          - "Say how well or how fast someone does something."
          - "Say whether I managed to find, see or buy something."
          - "Suggest having a quick look or a quick try."
        grammar: [g.dak-descriptive, g.dou-attain, g.potential-complements, g.haa-briefly]
      - id: a2.u07
        title: 啦、喇、吖、咋
        subtitle: Sentence-final particles
        authored: true
        canDo:
          - "Soften requests and suggestions with 啦."
          - "Announce a change with 喇."
          - "Make offers with 吖 and play things down with 咋 and 啫."
        grammar: [g.laa1-suggestion, g.laa3-change, g.aa1-offer, g.zaa3-ze1-only]
      - id: a2.u08
        title: 睇醫生
        subtitle: Health and seeing a doctor
        authored: true
        canDo:
          - "Say where it hurts and how I feel."
          - "Give reasons with 因為…所以…"
          - 'Give advice and make "if" sentences.'
        grammar: [g.jan-wai-so-ji, g.jyu-gwo-zau, g.body-pain, g.zeoi-hou-better]
      - id: a2.u09
        title: 去旅行
        subtitle: Travel plans
        authored: true
        canDo:
          - "Talk about my travel plans."
          - "Say how long I stayed or will stay somewhere."
          - "Say I will do something again or did it again."
        grammar: [g.daa-syun-plans, g.duration, g.zoi-vs-jau]
      - id: a2.u10
        title: 打電話
        subtitle: Phone calls
        authored: true
        canDo:
          - "Answer the phone and ask for someone."
          - "Leave a message and ask someone to call back."
          - "Ask someone to help me do something."
        grammar: [g.phone-phrases, g.bong-help, g.giu-someone]
      - id: a2.u11
        title: 一齊去食飯好唔好？
        subtitle: Invitations and suggestions
        authored: true
        canDo:
          - "Invite someone and suggest a time and place."
          - "Accept or decline politely."
          - "Tell someone not to do something."
        grammar: [g.hou-m-hou-suggestions, g.jat-cai-together, g.m-hou-dont]
      - id: a2.u12
        title: 上個週末
        subtitle: Last weekend - sequencing events
        authored: true
        canDo:
          - "Tell what I did before and after something."
          - "Link events with 就."
          - "Say I only did one thing with 淨係."
        grammar: [g.ji-cin-ji-hau, g.zau-then, g.zing-hai-only]

  - id: b1
    title: B1
    name: Threshold
    description: Deal with most situations in Hong Kong and the New Territories. Produce connected speech on familiar topics, describe results and movement precisely with verb complements, use passives and 將, give opinions with reasons, tell stories and follow the main points of the news.
    wordTarget: 3000
    canDo:
      - Say whether actions were finished, understood or done completely with resultative complements.
      - Describe movement in, out, up, down and back with directional complements.
      - Say what happened to me with 畀 and what I did to something with 將.
      - Describe people, places and things with relative clauses.
      - Give and justify opinions, report what others said and tell a story with a twist.
    units:
      - id: b1.u01
        title: 做完功課先出街
        subtitle: Finishing things - resultative complements
        authored: true
        canDo:
          - "Say I have finished, understood or got something wrong."
          - "Say something is all gone or all done with 晒."
          - "Say I can't finish or can't understand something."
        grammar: [g.resultative-complements, g.jyun-hou, g.saai-all, g.potential-resultatives]
      - id: b1.u02
        title: 行上大帽山
        subtitle: Up and down - directional complements
        authored: true
        canDo:
          - "Describe walking up, down, in and out."
          - "Say I am going back or coming back with 返."
          - "Say I will join in or do something too with 埋."
        grammar: [g.directional-complements, g.compound-directionals, g.faan-back, g.maai-closer]
      - id: b1.u03
        title: 我部手機畀人偷咗
        subtitle: Things that happen to you - 畀 passives
        authored: true
        canDo:
          - "Say what happened to me or my things."
          - "Ask someone to let me do something with 畀."
          - "Report an incident to the police."
        grammar: [g.bei-passive, g.bei-permissive, g.jau-jan-someone]
      - id: b1.u04
        title: 將啲嘢執好
        subtitle: Tidying up - 將, 搵 and 攞
        authored: true
        canDo:
          - "Say what I did to an object with 將."
          - "Say what I use to do something with 攞 / 搵…嚟."
          - "Give brisk instructions like 食咗佢."
        grammar: [g.zoeng-disposal, g.wan-lo-use, g.keoi-final]
      - id: b1.u05
        title: 我住嘅屋邨
        subtitle: Where I live - relative clauses
        authored: true
        canDo:
          - "Describe my flat and my estate."
          - 'Say "the person who…" and "the thing that…" with 嘅.'
          - "Use a measure word instead of 嘅 in relative clauses."
        grammar: [g.relative-ge, g.relative-classifier, g.ge-nominaliser]
      - id: b1.u06
        title: 我覺得…
        subtitle: Giving opinions
        authored: true
        canDo:
          - "Give my opinion and ask for others'."
          - "Say what should be done."
          - "Concede a point and make a counter-suggestion."
        grammar: [g.gok-dak-opinions, g.seoi-jin-daan-hai, g.jing-goi-should, g.bat-jyu-suggest]
      - id: b1.u07
        title: 返工
        subtitle: At work
        authored: true
        canDo:
          - "Say I do two things at the same time."
          - "Say what has to happen first."
          - "Say what has just happened at the office."
        grammar: [g.jat-bin-while, g.sin-final, g.ngaam-ngaam-just]
      - id: b1.u08
        title: 睇新聞
        subtitle: Following the news
        authored: true
        canDo:
          - "Report what people said."
          - "Stress when, where or how something happened with 係…嘅."
          - "Say what a report is about."
        grammar: [g.reported-speech, g.hai-ge-focus, g.gwaan-jyu-about]
      - id: b1.u09
        title: 講故仔
        subtitle: Telling stories
        authored: true
        canDo:
          - "Open a story and move it along."
          - "Reveal a twist with 原來."
          - "Say how things finally turned out."
        grammar: [g.story-openers, g.jyun-loi-turns-out, g.git-gwo-finally]
      - id: b1.u10
        title: 圍村食盆菜
        subtitle: Festivals and village traditions
        authored: true
        canDo:
          - "Talk about festivals and customs in the New Territories."
          - 'Add "as well!" with 添.'
          - "Say whether there is a chance to do something with 有得 and 冇得."
        grammar: [g.tim-too, g.ge-assertion, g.jau-dak-chance]
      - id: b1.u11
        title: 去西貢行山
        subtitle: The countryside - conditions and probability
        authored: true
        canDo:
          - "Make plans that depend on the weather."
