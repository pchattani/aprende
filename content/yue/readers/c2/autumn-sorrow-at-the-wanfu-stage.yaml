id: r.c2.autumn-sorrow-at-the-wanfu-stage
level: c2
title: 萬福台前聽〈客途秋恨〉
kind: literature
author: Attributed to 葉瑞伯 Ye Ruibo (19th century); some sources credit 繆艮 Miu Gen (蓮仙) himself
source: "〈客途秋恨〉, the best-known 南音 (Cantonese narrative song), Qing dynasty; its opening lines are quoted exactly. Public domain. Made famous on the opera stage by the actor 白駒榮. The visit to Foshan and the explanations are written for this course."
intro: "An opera-loving uncle takes his Hong Kong niece to the Wanfu Stage at the Foshan Ancestral Temple, where an old singer performs the opening of 'A Traveller's Autumn Lament', the most famous 南音 and a favourite of the Cantonese opera stage. He explains its mixture of literary verse and colloquial Cantonese (佢, 個, 睇), its classical first-person 小生 and how the voice follows the tones."
allow: [客途秋恨, 葉瑞伯, 繆艮, 繆, 蓮仙, 麥氏, 秋娟, 白駒榮, 杜煥, 萬福台, 瓊花會館, 九叔, 曉晴]
paragraphs:
  - { es: "星期六下晝，九叔帶住由香港上嚟嘅姪女曉晴，行入佛山祖廟。啱啱睇完醒獅表演，人潮散咗啲，萬福台前面擺咗幾排膠櫈，台上有個頭髮花白嘅伯伯，抱住一個古箏噉嘅樂器，準備唱嘢。九叔話：「呢個萬福台係清朝初年起嘅，係廣東最古老嘅戲台之一。以前做神功戲，成條街嘅人都嚟睇，比而家睇演唱會仲熱鬧。」", en: "On Saturday afternoon Uncle Kau takes his niece Hiu-ching, up from Hong Kong, into the Foshan Ancestral Temple. The lion dance show has just finished and the crowds have thinned out; in front of the Wanfu Stage a few rows of plastic stools are set out, and on stage a white-haired old man holding a zither-like instrument is getting ready to sing. Uncle Kau says: 'The Wanfu Stage was built in the early Qing dynasty; it's one of the oldest theatre stages in Guangdong. In the old days, when they put on opera for the gods, the whole street came to watch – livelier than a pop concert today.'" }
  - { es: "曉晴問：「佢唱粵劇呀？」九叔話：「今日佢唱南音。南音係一種說唱，一個人一邊彈一邊唱，講一個故事，好多粵劇老倌都會喺台上唱。佢今日唱嘅係〈客途秋恨〉，係最出名嘅南音，以前粵劇名伶白駒榮唱嘅版本，成個廣東冇人唔識。你聽吓先，聽完我再解畀你聽。」伯伯撥咗幾下弦，慢慢開口：", en: "Hiu-ching asks: 'Is he singing Cantonese opera?' Uncle Kau says: 'Today he's singing 南音. 南音 is a kind of narrative song: one person plays and sings at the same time, telling a story, and lots of opera actors sing it on stage. Today he's singing \"A Traveller's Autumn Lament\", the most famous 南音 of all; the version by the opera star Bak Kui-wing used to be known by everyone in Guangdong. Listen first, and I'll explain afterwards.' The old man plucks the strings a few times and slowly begins:" }
  - { es: "〈客途秋恨〉（開首） ／ 涼風有信，秋月無邊，虧我思嬌情緒好比度日如年。小生繆姓蓮仙字，為憶多情妓女麥氏秋娟。見佢聲色共藝才人讚羨，佢更兼才貌兩相全。今日天各一方難見面，是以孤舟沉寂晚景涼天。你睇斜陽照住個對雙飛燕，獨倚蓬窗思悄然。", en: "'A Traveller's Autumn Lament' (opening) / The cool wind keeps its season, the autumn moon is boundless; / poor me, longing for my beloved, each day feels like a year. / I, the young scholar, am surnamed Miu, styled Lin-sin, / remembering the tender-hearted courtesan Mak Chau-kuen. / Her voice, her looks and her art were praised by men of talent, / and she had both gifts and beauty in full. / Today we are worlds apart and cannot meet, / so I sit in a lonely boat, silent, on a cool evening. / Look at the setting sun shining on that pair of swallows flying together, / as I lean alone at the awning window, lost in quiet longing." }
  - { es: "唱完第一段，九叔細細聲解釋：「故事係講一個書生，叫繆蓮仙，喺秋天坐船去第二度，掛住一個叫秋娟嘅歌妓。第一句『涼風有信，秋月無邊』，即係秋風準時嚟到，秋月好大好光，一開口就係秋天嘅景。『虧我』即係『慘我』，『思嬌』就係掛住個心上人；佢話自己掛住佢，一日好似一年咁長。」", en: "When he finishes the first section, Uncle Kau explains quietly: 'The story is about a scholar called Miu Lin-sin who is travelling by boat in autumn, missing a singing girl called Chau-kuen. The first line, \"the cool wind keeps its season, the autumn moon is boundless\", means the autumn wind has come on time and the autumn moon is huge and bright – the very first words paint autumn. 虧我 means \"poor me\", and 思嬌 means missing his sweetheart; he says he misses her so much that one day feels as long as a year.'" }
  - { es: "「『小生』係粵劇入面書生嘅自稱，好似話『我呢個後生仔』，戲台上面嘅小生都係噉介紹自己。你留意，佢唔講『我姓繆』，而係講『繆姓蓮仙字』，好文雅。之後佢讚秋娟把聲好聽、樣靚、又有才華，『才貌兩相全』即係才華同樣貌兩樣都齊。」", en: "'小生 is how a young scholar refers to himself in Cantonese opera, as if saying \"this young fellow here\"; the young-scholar roles on stage always introduce themselves that way. Notice that he doesn't say \"my surname is Miu\" but \"surnamed Miu, styled Lin-sin\" – very refined. Then he praises Chau-kuen's lovely voice, her beauty and her talent; 才貌兩相全 means she has both talent and looks.'" }
  - { es: "曉晴話：「好似詩噉，但係又唔係全部都係書面語。」九叔好開心：「你聽得出喇！最後幾句最明顯：『見佢聲色』嘅『佢』、『個對雙飛燕』嘅『個』、『你睇』，全部都係廣東話口語。上半句『是以孤舟沉寂晚景涼天』好文雅，下半句就突然好似同你傾偈噉：『你睇吓，個太陽照住嗰對一齊飛嘅燕子。』燕子成雙，佢就得自己一個，倚住船窗思念，呢種對比特別淒涼。」", en: "Hiu-ching says: 'It's like a poem, but it's not all written language.' Uncle Kau is delighted: 'You can hear it! The last lines show it most clearly: the 佢 of 見佢聲色, the 個 of 個對雙飛燕, and 你睇 \"look\" are all colloquial Cantonese. The line before, \"so I sit in a lonely boat, silent, on a cool evening\", is very literary, and then suddenly it's as if he's chatting to you: \"Look, the sun is shining on that pair of swallows flying together.\" The swallows are a pair, and he's all alone, leaning at the boat window and longing – that contrast is especially desolate.'" }
  - { es: "「仲有，你聽佢點樣唱：廣東話有六個聲調（連埋入聲計就有九個），旋律一定要跟住字嘅聲調行，唔係就會變成另一個字，即係我哋講嘅『倒字』。南音嘅腔好慢，每個字都拉得好長，但係你仍然聽得明每個字，就係因為佢嘅旋律同聲調配合得好好。呢樣嘢，用普通話唱就做唔到。」", en: "'And listen to how he sings it: Cantonese has six tones (nine if you count the entering tones separately), and the melody has to follow the tone of each word, otherwise it turns into a different word – what we call 倒字. The 南音 melody is very slow and every word is drawn out, yet you can still understand each one, because the melody and the tones fit together so well. You couldn't do that singing it in Mandarin.'" }
  - { es: "曉晴聽完，問：「咁點解叫〈客途秋恨〉？」九叔話：「『客途』就係出門喺外，『秋恨』就係秋天嘅愁。一個人喺外地，秋天，掛住心愛嘅人，就係成首歌嘅感覺。有人話作者係清朝嘅葉瑞伯，亦有人話係繆蓮仙自己寫嘅。總之流傳咗成百幾年，仲有好多人識唱。二零零九年粵劇列入聯合國嘅非物質文化遺產，呢啲老曲就更加值得保存。」", en: "When she's heard this, Hiu-ching asks: 'So why is it called \"A Traveller's Autumn Lament\"?' Uncle Kau says: '客途 means being away from home, 秋恨 means the sorrow of autumn. Someone far from home, in autumn, missing the person he loves – that's the feeling of the whole song. Some say the author was Ye Ruibo of the Qing dynasty, others that Miu Lin-sin wrote it himself. Anyway, it has been handed down for well over a hundred years and lots of people can still sing it. In 2009 Cantonese opera was inscribed on UNESCO's list of intangible cultural heritage, which makes old songs like this all the more worth preserving.'" }
  - { es: "伯伯唱完，台下十幾個觀眾拍手，有個阿婆仲跟住哼。曉晴打開手機，想搜尋歌詞，九叔撳住佢隻手：「唔使睇字，你淨係聽，聽多幾次，自然就入咗腦。」返香港嘅高鐵上面，曉晴戴住耳筒，聽咗一次又一次白駒榮嘅錄音。到西九龍落車嗰陣，佢已經識得哼頭兩句：「涼風有信，秋月無邊……」", en: "When the old man finishes, the dozen or so people in the audience applaud, and an old lady even hums along. Hiu-ching opens her phone to search for the lyrics, but Uncle Kau puts his hand on hers: 'Don't read the words, just listen. Listen a few more times and it'll go into your head by itself.' On the high-speed train back to Hong Kong, Hiu-ching listens to Bak Kui-wing's recording again and again through her earphones. By the time she gets off at West Kowloon, she can hum the first two lines: 'The cool wind keeps its season, the autumn moon is boundless…'" }
questions:
  - { q: "南音係一種點樣嘅表演？", options: ["一大班人一齊跳舞", "一個人一邊彈一邊唱，講一個故事", "幾個演員用普通話對白"], answer: 1, explain: "南音 is a narrative song: a single performer accompanies himself and tells a story." }
  - { q: "「小生繆姓蓮仙字」入面，「小生」係乜嘢？", options: ["一個細路仔嘅名", "粵劇入面書生嘅自稱", "一種樂器"], answer: 1, explain: "小生 is the self-reference of a young scholar (and the name of that role type) in Cantonese opera." }
  - { q: "九叔話邊幾個字係廣東話口語？", options: ["「涼風有信」", "「佢」、「個」、「你睇」", "「是以孤舟沉寂」"], answer: 1, explain: "佢, 個 (that) and 你睇 are colloquial; 是以, 沉寂 are literary." }
  - { q: "「你睇斜陽照住個對雙飛燕」點解令人覺得淒涼？", options: ["因為燕子成雙，主角就得自己一個", "因為太陽落山好凍", "因為燕子飛走咗"], answer: 0, explain: "The pair of swallows contrasts with the lonely traveller." }
  - { q: "乜嘢叫「倒字」？", options: ["將字寫錯咗", "旋律唔跟字嘅聲調，令個字聽落變咗另一個字", "倒轉讀一句詩"], answer: 1, explain: "倒字 happens when the melody contradicts a word's tone, so it is heard as a different word." }
