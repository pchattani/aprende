id: r.b1.poon-choi-in-the-walled-village
level: b1
title: 圍村食盆菜
kind: text
intro: Ana is invited by her classmate Wai-ling to a poon choi banquet in her family's ancestral village at Ping Shan, Yuen Long. She describes the food, the ancestral hall and the traditions behind the feast.
allow: [慧玲, 鄧氏]
paragraphs:
  - { es: "上個月，我嘅同學慧玲請我去佢鄉下食盆菜。慧玲姓鄧，佢屋企係元朗屏山嘅原居民。佢話，鄧氏喺屏山已經住咗好幾百年，每逢有大節日或者有人擺酒，全村人都會一齊喺祠堂門口食盆菜。我第一次聽到「盆菜」呢個名，仲以為係用面盆裝嘅菜！", en: "Last month my classmate Wai-ling invited me to her village for poon choi. Wai-ling's surname is Tang, and her family are indigenous villagers of Ping Shan in Yuen Long. She said the Tang clan has lived in Ping Shan for several hundred years, and whenever there's a big festival or someone holds a banquet, the whole village eats poon choi together in front of the ancestral hall. The first time I heard the name 'poon choi' (basin food), I thought it meant food served in a washbasin!" }
  - { es: "嗰日我哋一早就去到。屏山有一條文物徑，我哋先行咗一轉。路上面有鄧氏宗祠、舊屋同一座三層高嘅古塔，叫聚星樓，係香港唯一一座古塔。慧玲話，以前啲村民起呢座塔，係希望村裡面多啲人讀書做官。", en: "We arrived early that day. Ping Shan has a heritage trail, so first we walked along it. On the way there's the Tang Ancestral Hall, old houses and a three-storey ancient pagoda called Tsui Sing Lau, the only ancient pagoda in Hong Kong. Wai-ling said that the villagers built the pagoda in the past because they hoped more people from the village would study and become officials." }
  - { es: "到咗中午，祠堂門口已經擺滿咗幾十張枱，每張枱中間放住一個好大嘅木盆。慧玲嘅叔叔話，盆菜要由村裡面嘅師傅煮，佢哋前一日就開始準備，煮咗成晚。一盆菜大概夠十個人食。", en: "By noon, dozens of tables had been set out in front of the ancestral hall, with a huge wooden basin in the middle of each table. Wai-ling's uncle said the poon choi had to be cooked by the village's own chefs, who started preparing the day before and cooked all night. One basin feeds about ten people." }
  - { es: "盆菜係一層一層咁擺嘅。最上面係最貴嘅材料，例如雞、大蝦同鮑魚；中間有豬肉、魚蛋同冬菇；最底下係蘿蔔、枝竹同豬皮，吸晒上面啲汁，所以最好食。慧玲教我：「食盆菜唔可以只係揀上面啲好嘢食，要由上面慢慢食落去，大家一齊分享。」", en: "Poon choi is arranged in layers. At the top are the most expensive ingredients, such as chicken, king prawns and abalone; in the middle there's pork, fish balls and shiitake mushrooms; at the very bottom are turnip, tofu skin and pork rind, which soak up all the sauce from above, so they're the tastiest. Wai-ling taught me: \"When you eat poon choi, you can't just pick out the good things on top. You have to eat your way down slowly, sharing with everyone.\"" }
  - { es: "關於盆菜嘅起源，有一個傳說。聽講宋朝嘅時候，有個小皇帝逃難到咗新界一帶，村民想請佢同啲士兵食飯，但係冇咁多碗碟，於是將所有餸放晒入大木盆入面。後來呢種食法就流傳落嚟，變成圍村嘅傳統。不過慧玲笑住話：「呢個故仔係真定假，冇人知㗎。」", en: "There's a legend about the origins of poon choi. They say that in the Song dynasty, a boy emperor fled to the area of the New Territories. The villagers wanted to feed him and his soldiers, but they didn't have enough bowls and plates, so they put all the dishes into big wooden basins. Later this way of eating was passed down and became a walled-village tradition. But Wai-ling said with a laugh: \"Whether this story is true or not, nobody knows.\"" }
  - { es: "食飯之前，村裡面嘅長輩先入祠堂拜祖先，跟住外面就有人舞獅、燒炮仗，好熱鬧。我坐喺慧玲嫲嫲隔籬，佢一直夾嘢畀我食，又問我西班牙人過年食乜嘢。我話我哋除夕夜要喺十二點食十二粒提子，佢聽完笑到停唔到。", en: "Before the meal, the village elders went into the ancestral hall to pay respects to the ancestors, and then outside there was a lion dance and firecrackers; it was very lively. I sat next to Wai-ling's grandmother, who kept putting food in my bowl and asked me what Spanish people eat at New Year. I told her that on New Year's Eve we eat twelve grapes at midnight, and she couldn't stop laughing." }
  - { es: "嗰日我食到好飽，返到屋企都仲唔肚餓。我覺得盆菜唔單止係一餐飯，仲係一種將全村人連埋一齊嘅方法。喺香港呢個咁快嘅城市，仲有地方會成村人坐埋一齊食飯，真係好難得。而家連酒樓同超市都有盆菜賣，好多香港家庭過年都會叫一盆返屋企食，不過慧玲話，喺祠堂門口食嘅味道係唔同嘅。", en: "I ate so much that day that I still wasn't hungry when I got home. I think poon choi isn't just a meal; it's a way of bringing the whole village together. In a city as fast as Hong Kong, it's rare to find places where a whole village still sits down to eat together. Nowadays even restaurants and supermarkets sell poon choi, and many Hong Kong families order one to eat at home for New Year, but Wai-ling says it tastes different when you eat it in front of the ancestral hall." }
questions:
  - { q: "慧玲屋企係邊度嘅原居民？", options: ["屯門", "元朗屏山", "大埔林村"], answer: 1, explain: "佢屋企係元朗屏山嘅原居民." }
  - { q: "聚星樓係乜嘢？", options: ["一間祠堂", "香港唯一一座古塔", "一間酒樓"], answer: 1, explain: "一座三層高嘅古塔，叫聚星樓，係香港唯一一座古塔." }
  - { q: "盆菜最底下有啲乜嘢？", options: ["雞同鮑魚", "蘿蔔、枝竹同豬皮", "魚蛋同冬菇"], answer: 1, explain: "最底下係蘿蔔、枝竹同豬皮, which soak up the sauce." }
  - { q: "根據傳說，點解村民用大木盆裝餸？", options: ["因為冇咁多碗碟", "因為皇帝鍾意木盆", "因為木盆好平"], answer: 0, explain: "冇咁多碗碟，於是將所有餸放晒入大木盆入面." }
  - { q: "Ana話西班牙人除夕夜食乜嘢？", options: ["盆菜", "十二粒提子", "年糕"], answer: 1, explain: "我哋除夕夜要喺十二點食十二粒提子." }
