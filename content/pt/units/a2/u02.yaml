dialogues:
  - id: a2.u02.d1
    title: Uma vida no Mercadão
    context: At the Municipal Market, Jussara chats with Seu Antônio, who has sold fruit there for decades.
    lines:
      - { speaker: Jussara, es: "Bom dia! O senhor trabalha aqui há muito tempo?", en: "Good morning! Have you worked here for a long time?" }
      - { speaker: Seu Antônio, es: "Há mais de quarenta anos, minha filha. Vim da Bahia em 1984.", en: "For over forty years, my dear. I came from Bahia in 1984." }
      - { speaker: Jussara, es: "Nossa! E o senhor sempre vendeu frutas?", en: "Wow! And have you always sold fruit?" }
      - { speaker: Seu Antônio, es: "Não. Primeiro trabalhei com o meu tio, que vendia queijo. Em 1990 abri a minha loja de frutas.", en: "No. First I worked with my uncle, who sold cheese. In 1990 I opened my fruit shop." }
      - { speaker: Jussara, es: "E o que mudou nesses anos todos?", en: "And what has changed over all these years?" }
      - { speaker: Seu Antônio, es: "Muita coisa! Vieram os turistas, as fotos, o famoso sanduíche de mortadela...", en: "A lot! The tourists came, the photos, the famous mortadella sandwich..." }
      - { speaker: Jussara, es: "Eu vi o sanduíche ali na fila. É enorme!", en: "I saw the sandwich over there in the queue. It's huge!" }
      - { speaker: Seu Antônio, es: "É mesmo. Quer provar uma fruta? É grátis.", en: "It really is. Do you want to try a piece of fruit? It's free." }
      - { speaker: Jussara, es: "Quero! Ontem eu não pude vir, mas hoje trouxe a minha mãe.", en: "Yes, please! Yesterday I couldn't come, but today I brought my mum." }
      - { speaker: Seu Antônio, es: "Então foi um bom dia para vocês duas. Foi um prazer!", en: "Then it was a good day for you both. It was a pleasure!" }
    questions:
      - { q: "De onde veio o seu Antônio?", options: ["Da Bahia", "De Minas Gerais", "Do Rio de Janeiro"], answer: 0, explain: "Vim da Bahia em 1984." }
      - { q: "Em que ano ele chegou a São Paulo?", options: ["Em 1933", "Em 1984", "Em 1990"], answer: 1, explain: "He came from Bahia in 1984; he opened his shop in 1990." }
      - { q: "O que ele abriu em 1990?", options: ["Um restaurante", "Uma loja de frutas", "Uma padaria"], answer: 1, explain: "Em 1990 abri a minha loja de frutas." }
      - { q: "Com quem a Jussara veio hoje?", options: ["Com a mãe", "Com o pai", "Sozinha"], answer: 0, explain: "Hoje trouxe a minha mãe." }
