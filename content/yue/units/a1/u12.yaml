      - { es: "我鍾意粉紅色嘅花。", en: "I like pink flowers.", altEs: ["我好鍾意粉紅色嘅花。"], grammar: [g.adj-ge-noun], vocab: [w.fan2-hung4-sik1, w.faa1], error: { wrong: "我鍾意花粉紅色。", explain: "The describing word comes before the noun: 粉紅色嘅花.", grammar: g.adj-ge-noun } }
      - { es: "呢套電影好特別。", en: "This film is really unusual.", altEs: ["呢套電影非常特別。"], grammar: [g.adjective-predicates], vocab: [w.dak6-bit6] }
      - { es: "嗰件灰色嘅褸好難睇。", en: "That grey jacket is ugly.", altEs: ["嗰件灰色褸好難睇。"], grammar: [g.adj-ge-noun], vocab: [w.fui1-sik1, w.naan4-tai2], transform: { instruction: "Say the brown jacket looks good", answer: "嗰件啡色嘅褸好好睇。", alt: ["嗰件啡色褸好好睇。"], en: "That brown jacket looks good." } }
