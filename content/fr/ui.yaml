# Interface text in the target language (keys are fixed; values are per course).
# `{word}`, `{region}` and `{language}` are placeholders filled in by the app.
# French typography: a no-break space goes before ! ? : ; and inside « ».
appName: Pawsport
tagline: French, one stamp at a time
welcome:
  title: Leo, Bonchita and Luna are off to France
  intro: Three small dogs, one hexagon-shaped country, and only you can talk to the locals. Luna has the map, Leo has the ball, Bonchita has the appetite (croissants, crêpes, cheese, anything). Every unit is a stop on a grand tour that lands in Paris, rolls through Normandy and Brittany, Provence, the Alps and the Southwest, then crosses the ocean to the French-speaking world and ends in Québec City. Where should the journey start? Everything is open; this just marks the first stop.
  firstStop: "Land in Paris: A1, lesson 1."
greetings: { morning: Bonjour, afternoon: Bon après-midi, evening: Bonsoir }
feedback: { correct: "Exact !", almost: "Presque !", goalDone: "Bravo !" }
stampEarned: "Tampon obtenu !"
spicyName: Mode piquant
games: { name: Mots, memory: Mémoire, rapid: Rapide, crossword: Mots croisés, listen: Écoute, soundMatch: Associe les sons, win: "Tu as réussi !" }
dogsPage: Les toutous
quizGreat: "Très bien !"
whatDoesItMean: "Que veut dire « {word} » ?"
badgeName: "insigne « {region} »"
typePlaceholder: Écris en français
voiceTest: "Bonjour, ça va ? Nous sommes Leo, Bonchita et Luna, et nous allons t'aider avec le français."
voiceHelp: No French voice installed. On Windows add “French (France)” speech in Settings → Time & Language; on Android install Google Text-to-speech and download the French voice; iOS and macOS include Thomas (France) and Amélie (Canada) (Settings → Accessibility → Spoken Content).
pronunciationIntro: French spelling looks scary, but read in the right direction it is very regular, and the same letters almost always make the same sounds. Learn the nasal vowels, u against ou, which final letters stay silent and how words link together, and you can read anything aloud.
