reading:
  text: |
    Il est des Parisiens qui s'étonnent encore qu'on puisse dire « septante » sans faute de goût, ou « souper » pour le repas du soir sans paraître sortir d'un roman du XIXe siècle. Ceux-là oublient que le français n'a pas un centre, mais des dizaines. On le parle à Bruxelles et à Genève, à Dakar et à Kinshasa, à Fort-de-France et à Montréal ; et, selon les estimations de l'Organisation internationale de la Francophonie, c'est en Afrique que vit aujourd'hui la majorité de ceux qui l'utilisent chaque jour.

    Chacune de ces communautés a façonné la langue à sa mesure. Le Québec, entouré de millions d'anglophones, a inventé « courriel » et « clavardage » pour ne pas avoir à dire « mail » ou « chat », pendant que la France, paradoxalement, accueillait sans complexe le « parking », le « week-end » et le « footing », mot que les anglophones eux-mêmes ignorent. Le Sénégal a créé « essencerie » ; la Suisse romande vote lors des « votations » et passe la « panosse » ; la Belgique « drache » quand il pleut à verse. Rien de tout cela n'est incorrect : ce sont autant de réponses locales à des besoins locaux.

    La question de la norme n'en demeure pas moins délicate. Longtemps, les dictionnaires publiés à Paris ont relégué ces usages au rang de curiosités régionales, comme si le français de France était le français tout court. Les choses ont changé : les grands dictionnaires accueillent désormais des mots belges, suisses, québécois et africains, et de nombreux écrivains revendiquent une langue qui n'appartient à personne en particulier. Encore faut-il que l'école suive, et qu'un élève de Liège ou de Lausanne ne se voie plus corriger « septante » dans ses copies.

    Car maîtriser le français, à un niveau avancé, ce n'est pas parler comme un académicien parisien. C'est savoir passer d'un registre à l'autre, d'une variété à l'autre, sans que l'effort se remarque : rédiger une lettre administrative le matin, comprendre une conversation en joual le soir, lire Molière ou Proust sans s'arrêter à chaque subjonctif imparfait. C'est, en somme, savoir reconnaître dans la langue de l'autre une manière différente, et tout aussi légitime, d'habiter la même langue.
