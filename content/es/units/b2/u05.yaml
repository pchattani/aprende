id: b2.u05
title: Hasta que termine
lessons:
  - id: b2.u05.l1
    title: A medida que pasaba el tiempo
    teach: [g.temporal-clauses-advanced]
    vocab: [w.franquismo, w.guerra-civil, w.transicion, w.exilio, w.exiliarse, w.referendum, w.moneda, w.peseta, w.golpe-de-estado, w.reinar, w.bando, w.amnistia, w.libertad-de-expresion, w.decada, w.a-medida-que, w.conforme, w.entretanto, w.debil, w.dividir, w.real]
    tip: "Time clauses about the past or about habits take the indicative; time clauses about the future take the subjunctive. Mientras duró la guerra… / Mientras haya gente que recuerde…"
    sentences:
      - { es: "A medida que pasaban los años, la dictadura se hacía más débil.", en: "As the years went by, the dictatorship grew weaker.", altEs: ["Conforme pasaban los años, la dictadura se hacía más débil."], grammar: [g.temporal-clauses-advanced, g.imperfect], vocab: [w.a-medida-que, w.dictadura, w.debil] }
      - { es: "Mientras duró la guerra civil, miles de familias huyeron al exilio.", en: "While the civil war lasted, thousands of families fled into exile.", grammar: [g.temporal-clauses-advanced, g.preterite-regular], vocab: [w.guerra-civil, w.exilio, w.huir, w.durar] }
      - { es: "Conforme vayan muriendo los testigos, será más difícil contar aquella historia.", en: "As the witnesses gradually die, it will be harder to tell that story.", altEs: ["A medida que vayan muriendo los testigos, será más difícil contar aquella historia."], grammar: [g.temporal-clauses-advanced, g.ir-venir-andar-gerund], vocab: [w.conforme, w.testigo, w.morir] }
      - { es: "Siempre que mi abuelo hablaba del franquismo, bajaba la voz.", en: "Whenever my grandfather talked about the Franco regime, he lowered his voice.", altEs: ["Cada vez que mi abuelo hablaba del franquismo, bajaba la voz."], grammar: [g.temporal-clauses-advanced], vocab: [w.siempre-que, w.franquismo, w.voz] }
      - { es: "Nada más morir el dictador, empezó la transición.", en: "As soon as the dictator died, the transition began.", altEs: ["Al morir el dictador, empezó la transición.", "En cuanto murió el dictador, empezó la transición."], grammar: [g.temporal-clauses-advanced], vocab: [w.nada-mas, w.dictador, w.transicion] }
      - { es: "En cuanto se aprobó la constitución, la censura desapareció de los periódicos.", en: "As soon as the constitution was passed, censorship disappeared from the newspapers.", grammar: [g.temporal-clauses-advanced, g.se-passive], vocab: [w.en-cuanto, w.constitucion, w.censura, w.periodico] }
      - { es: "Desde que España ingresó en la Unión Europea, la economía ha cambiado mucho.", en: "Since Spain joined the European Union, the economy has changed a lot.", grammar: [g.temporal-clauses-advanced, g.present-perfect], vocab: [w.ingresar, w.economia], note: "desde que always takes the indicative." }
      - { es: "Una vez que el rey firmó la amnistía, muchos exiliados pudieron regresar.", en: "Once the king signed the amnesty, many exiles were able to return.", grammar: [g.temporal-clauses-advanced], vocab: [w.una-vez-que, w.amnistia, w.exiliarse, w.regresar] }
      - { es: "Cuando pase otra década, casi nadie recordará la peseta.", en: "When another decade goes by, hardly anyone will remember the peseta.", grammar: [g.temporal-clauses-advanced], vocab: [w.decada, w.peseta, w.recordar] }
      - { es: "Al terminar la guerra, el país quedó dividido en dos bandos.", en: "When the war ended, the country was left divided into two sides.", grammar: [g.temporal-clauses-advanced], vocab: [w.dividir, w.bando, w.guerra], note: "al + infinitive = on / upon doing." }
      - { es: "Tan pronto como cambiaron de moneda, los precios subieron, según mis padres.", en: "As soon as they changed currency, prices went up, according to my parents.", altEs: ["En cuanto cambiaron de moneda, los precios subieron, según mis padres."], grammar: [g.temporal-clauses-advanced], vocab: [w.tan-pronto-como, w.moneda, w.precio] }
      - { es: "A medida que lea el libro, entenderá por qué fracasó el golpe de estado de 1981.", en: "As you read the book, you'll understand why the 1981 coup failed.", grammar: [g.temporal-clauses-advanced], vocab: [w.a-medida-que, w.golpe-de-estado, w.fracasar] }
      - { es: "Apenas llegaron a México, los exiliados fundaron revistas y escuelas; entretanto, en España reinaba el silencio.", en: "Hardly had they arrived in Mexico when the exiles founded magazines and schools; meanwhile, in Spain silence reigned.", grammar: [g.temporal-clauses-advanced], vocab: [w.apenas, w.entretanto, w.reinar, w.fundar] }
      - { es: "Sin libertad de expresión no hubo debate real hasta que llegó la democracia.", en: "Without freedom of speech there was no real debate until democracy arrived.", grammar: [g.temporal-clauses-advanced, g.hasta-que], vocab: [w.libertad-de-expresion, w.democracia, w.debate] }
      - { es: "Cuando pase otra década, nadie recordará la peseta.", en: "When another decade has gone by, nobody will remember the peseta.", grammar: [g.temporal-clauses-advanced], vocab: [w.decada, w.peseta], error: { wrong: "Cuando pasará otra década, nadie recordará la peseta.", explain: "A time clause about the future takes the subjunctive (pase), never the future tense.", grammar: g.temporal-clauses-advanced } }
      - { es: "Los testigos van muriendo y es más difícil contar la historia.", en: "The witnesses are dying and it is harder to tell the story.", grammar: [g.temporal-clauses-advanced, g.ir-venir-andar-gerund], vocab: [w.testigo, w.historia], transform: { instruction: "Link the two ideas with conforme and the future", answer: "Conforme vayan muriendo los testigos, será más difícil contar la historia.", alt: ["A medida que vayan muriendo los testigos, será más difícil contar la historia."] } }
    exchanges:
      - q: { es: "¿Cuándo volvió tu familia del exilio?", en: "When did your family come back from exile?" }
        a: { es: "En cuanto se aprobó la amnistía, en 1977.", en: "As soon as the amnesty was passed, in 1977." }
        alt: ["Nada más aprobarse la amnistía.", "En 1977, cuando llegó la amnistía."]
        grammar: [g.temporal-clauses-advanced]
        vocab: [w.exilio, w.amnistia]
      - q: { es: "¿Tu abuela hablaba de la guerra?", en: "Did your grandmother talk about the war?" }
        a: { es: "Solo cuando estábamos solos; siempre que entraba alguien, cambiaba de tema.", en: "Only when we were alone; whenever someone came in, she changed the subject." }
        alt: ["Muy poco; cada vez que entraba alguien, cambiaba de tema.", "Nunca; mientras vivió, no dijo una palabra."]
        grammar: [g.temporal-clauses-advanced]
        vocab: [w.guerra, w.tema]
      - q: { es: "¿Qué pasará con los documentos del archivo?", en: "What will happen to the archive documents?" }
        a: { es: "A medida que los vayan copiando, podrá leerlos cualquiera.", en: "As they gradually copy them, anyone will be able to read them." }
        alt: ["Conforme los vayan copiando, podrá leerlos cualquiera.", "Cuando los hayan copiado, serán públicos."]
        grammar: [g.temporal-clauses-advanced]
        vocab: [w.archivo, w.documento]
      - q: { es: "¿Reinó mucho tiempo el rey Juan Carlos?", en: "Did King Juan Carlos reign for long?" }
        a: { es: "Casi cuarenta años: desde que murió el dictador hasta que lo dejó en 2014.", en: "Almost forty years: from when the dictator died until he stepped down in 2014." }
        alt: ["Casi cuarenta años.", "Desde 1975 hasta 2014."]
        grammar: [g.temporal-clauses-advanced]
        vocab: [w.reinar, w.rey]
    texts:
      - title: "Pie de foto de un libro de historia"
        es: ["Madrid, 1977.", "Nada más abrirse las fronteras, miles de exiliados regresaron.", "Conforme bajaban del tren, muchos besaban el suelo."]
        en: ["Madrid, 1977.", "As soon as the borders opened, thousands of exiles returned.", "As they got off the train, many kissed the ground."]
        grammar: [g.temporal-clauses-advanced]
        vocab: [w.frontera, w.exiliarse, w.besar]
      - title: "Cronología"
        es: ["1975: muere el dictador y comienza la transición.", "1978: se aprueba la Constitución en referéndum.", "1986: España ingresa en la Unión Europea.", "2002: la peseta deja paso al euro."]
        en: ["1975: the dictator dies and the transition begins.", "1978: the Constitution is approved in a referendum.", "1986: Spain joins the European Union.", "2002: the peseta gives way to the euro."]
        grammar: [g.temporal-clauses-advanced]
        vocab: [w.transicion, w.referendum, w.peseta]
  - id: b2.u05.l2
    title: A fin de que todos lo entiendan
    teach: [g.purpose-clauses-advanced]
    vocab: [w.con-objeto-de, w.de-manera-que, w.por-lo-que, w.con-lo-que, w.en-lo-que-respecta-a, w.a-fin-de, w.bibliografia, w.plagio, w.plagiar, w.evaluacion, w.evaluar, w.sobresaliente, w.notable, w.titulacion, w.catedratico, w.metodologia, w.indice, w.anexo, w.tutor, w.tutoria, w.convocatoria, w.proceso, w.fondo, w.opcion, w.copiar, w.facilmente]
    tip: "Purpose takes the subjunctive (a fin de que lo entiendan); consequence takes the indicative (por lo que se retrasó). de modo que / de manera que can be either, depending on meaning."
    sentences:
      - { es: "El catedrático explicó la teoría despacio, a fin de que todos la entendieran.", en: "The professor explained the theory slowly, so that everyone would understand it.", altEs: ["El catedrático explicó la teoría despacio, a fin de que todos la entendiesen.", "El catedrático explicó la teoría despacio para que todos la entendieran."], grammar: [g.purpose-clauses-advanced, g.subjunctive-imperfect], vocab: [w.catedratico, w.a-fin-de-que, w.teoria] }
      - { es: "Hemos ampliado la bibliografía con objeto de que los alumnos tengan más fuentes.", en: "We have extended the bibliography with the aim of giving the students more sources.", grammar: [g.purpose-clauses-advanced], vocab: [w.con-objeto-de, w.bibliografia, w.ampliar, w.fuente] }
      - { es: "Redacta la introducción de manera que el lector sepa desde el principio cuál es tu hipótesis.", en: "Write the introduction so that the reader knows from the start what your hypothesis is.", grammar: [g.purpose-clauses-advanced, g.imperative-tu], vocab: [w.de-manera-que, w.redactar, w.hipotesis, w.introduccion], note: "Purpose: subjunctive (sepa)." }
      - { es: "Entregó la tesis tarde, por lo que la evaluación se retrasó un mes.", en: "He handed in the thesis late, so the assessment was delayed by a month.", grammar: [g.purpose-clauses-advanced], vocab: [w.por-lo-que, w.tesis, w.evaluacion, w.retrasarse], note: "Consequence: indicative (se retrasó)." }
      - { es: "Explicó el método muy claro, de modo que nadie tuvo dudas.", en: "She explained the method very clearly, so nobody had any doubts.", grammar: [g.purpose-clauses-advanced], vocab: [w.de-modo-que, w.metodo, w.duda] }
      - { es: "Copió tres párrafos sin mencionar la fuente, con lo que cometió plagio.", en: "He copied three paragraphs without mentioning the source, with the result that he committed plagiarism.", grammar: [g.purpose-clauses-advanced], vocab: [w.con-lo-que, w.plagio, w.parrafo, w.cometer] }
      - { es: "El trabajo era tan largo que el tutor tardó dos semanas en corregirlo.", en: "The paper was so long that the tutor took two weeks to mark it.", grammar: [g.purpose-clauses-advanced], vocab: [w.tutor, w.corregir, w.tardar], note: "tan + adjective + que: intensity and consequence." }
      - { es: "Había tantas citas sin fuente que el tribunal sospechó que había plagiado.", en: "There were so many quotations without a source that the panel suspected he had plagiarised.", grammar: [g.purpose-clauses-advanced, g.pluperfect], vocab: [w.plagiar, w.cita, w.tribunal, w.sospechar] }
      - { es: "En lo que respecta a la metodología, conviene que la expliques en un anexo.", en: "As regards the methodology, it's advisable to explain it in an appendix.", grammar: [g.purpose-clauses-advanced, g.subjunctive-impersonal], vocab: [w.en-lo-que-respecta-a, w.metodologia, w.anexo, w.convenir] }
      - { es: "Pon un índice al principio para que el tribunal encuentre cada capítulo rápidamente.", en: "Put a table of contents at the beginning so that the panel can find each chapter quickly.", grammar: [g.purpose-clauses-advanced, g.imperative-tu], vocab: [w.indice, w.capitulo, w.encontrar] }
      - { es: "Sacó un sobresaliente en la tesis; por lo tanto, podrá pedir la beca de doctorado.", en: "She got a top mark in her thesis; therefore, she'll be able to apply for the doctoral grant.", grammar: [g.purpose-clauses-advanced, g.connectors-cause-consequence], vocab: [w.sobresaliente, w.por-lo-tanto, w.doctorado, w.beca] }
      - { es: "La universidad abrió una segunda convocatoria con el fin de que nadie perdiera el curso.", en: "The university opened a second exam sitting so that nobody would lose the year.", altEs: ["La universidad abrió una segunda convocatoria con el fin de que nadie perdiese el curso."], grammar: [g.purpose-clauses-advanced, g.subjunctive-imperfect], vocab: [w.convocatoria, w.con-el-fin-de, w.universidad] }
      - { es: "Hizo tal esfuerzo que terminó la titulación en tres años.", en: "He made such an effort that he finished his degree in three years.", grammar: [g.purpose-clauses-advanced], vocab: [w.titulacion, w.esfuerzo, w.terminar], note: "tal + noun + que." }
      - { es: "No evalúes solo el resultado, sino el proceso, de manera que el alumno aprenda de sus errores.", en: "Don't assess only the result, but the process, so that the student learns from their mistakes.", grammar: [g.purpose-clauses-advanced, g.imperative-negative], vocab: [w.evaluar, w.proceso, w.de-manera-que, w.error] }
      - { es: "Lo repito para que no se te olvide.", en: "I'm repeating it so you don't forget.", grammar: [g.purpose-clauses-advanced, g.subjunctive-purpose], vocab: [w.repetir, w.olvidar], error: { wrong: "Lo repito para que no se te olvida.", explain: "Purpose clauses with para que take the subjunctive: olvide.", grammar: g.purpose-clauses-advanced } }
      - { es: "Habló alto. Quería que lo oyeran desde el fondo.", en: "He spoke loudly. He wanted them to hear him from the back.", grammar: [g.purpose-clauses-advanced, g.subjunctive-imperfect], vocab: [w.fondo, w.oir, w.alto], transform: { instruction: "Combine the two sentences with a fin de que", answer: "Habló alto a fin de que lo oyeran desde el fondo.", alt: ["Habló alto a fin de que lo oyesen desde el fondo.", "Habló alto para que lo oyeran desde el fondo."] } }
    exchanges:
      - q: { es: "¿Por qué has puesto tantas notas al final?", en: "Why have you put so many notes at the end?" }
        a: { es: "A fin de que el texto principal se lea más fácilmente.", en: "So that the main text can be read more easily." }
        alt: ["Para que el texto principal se lea más fácilmente.", "Con objeto de que el texto se lea mejor."]
        grammar: [g.purpose-clauses-advanced]
        vocab: [w.a-fin-de-que, w.nota, w.texto]
      - q: { es: "¿Qué nota sacaste en la tesis?", en: "What mark did you get for your thesis?" }
        a: { es: "Un notable; el tribunal dijo que faltaba bibliografía, por lo que no llegué al sobresaliente.", en: "A B; the panel said the bibliography was lacking, so I didn't reach the top mark." }
        alt: ["Un notable.", "Un sobresaliente, por lo que estoy muy contenta."]
        grammar: [g.purpose-clauses-advanced]
        vocab: [w.notable, w.sobresaliente, w.bibliografia]
      - q: { es: "¿Para qué sirve la tutoría de mañana?", en: "What is tomorrow's tutorial for?" }
        a: { es: "Para que el tutor revise el índice antes de la entrega.", en: "So that the tutor can check the table of contents before the hand-in." }
        alt: ["A fin de que el tutor revise el índice.", "Para revisar el índice con el tutor."]
        grammar: [g.purpose-clauses-advanced]
        vocab: [w.tutoria, w.tutor, w.indice]
      - q: { es: "¿Suspendieron a Jorge por plagio?", en: "Did they fail Jorge for plagiarism?" }
        a: { es: "Sí: copió medio capítulo, de modo que no tuvieron otra opción.", en: "Yes: he copied half a chapter, so they had no other option." }
        alt: ["Sí, copió medio capítulo.", "Sí, por lo que tendrá que repetir el trabajo."]
        grammar: [g.purpose-clauses-advanced]
        vocab: [w.plagio, w.suspender, w.opcion]
    texts:
      - title: "Instrucciones del tutor"
        es: ["Entregad el borrador antes del lunes, de modo que pueda corregirlo esa semana.", "Mencionad todas las fuentes a fin de evitar cualquier sospecha de plagio.", "Usad un índice claro para que el tribunal encuentre cada parte."]
        en: ["Hand in the draft before Monday, so that I can mark it that week.", "Mention all your sources in order to avoid any suspicion of plagiarism.", "Use a clear table of contents so that the panel can find each part."]
        grammar: [g.purpose-clauses-advanced, g.imperative-vosotros]
        vocab: [w.borrador, w.a-fin-de, w.plagio, w.indice]
      - title: "Nota en la puerta del despacho"
        es: ["Tutorías: martes de 10 a 12.", "Pedid cita por correo con objeto de evitar colas.", "Fuera de ese horario no se corrigen trabajos."]
        en: ["Tutorials: Tuesdays from 10 to 12.", "Request an appointment by email in order to avoid queues.", "Outside those hours no papers are marked."]
        grammar: [g.purpose-clauses-advanced, g.se-impersonal]
        vocab: [w.tutoria, w.con-objeto-de, w.horario]
  - id: b2.u05.l3
    title: Hasta que no firmes
    teach: [g.hasta-que]
    vocab: [w.hasta-que-no, w.mientras-no, w.sellar, w.fotocopia, w.caducar, w.denegar, w.desesperarse, w.desesperacion, w.papeleo, w.gestion, w.gestionar, w.impreso, w.registrar, w.copia, w.permiso-de-residencia, w.nacionalidad, w.extranjeria, w.tarifa, w.en-vigor, w.sistema]
    tip: "hasta que + indicative for the past (esperé hasta que llegó), + subjunctive for the future (esperaré hasta que llegue). After a negative main clause, Spain adds a redundant no: no me voy hasta que no me paguen."
    sentences:
      - { es: "No me iré de la ventanilla hasta que no me sellen el impreso.", en: "I won't leave the counter until they stamp my form.", altEs: ["No me iré de la ventanilla hasta que me sellen el impreso."], grammar: [g.hasta-que], vocab: [w.hasta-que-no, w.sellar, w.impreso, w.ventanilla], note: "The no after hasta que adds nothing to the meaning." }
      - { es: "Esperamos hasta que cerraron la oficina de extranjería, y nadie nos atendió.", en: "We waited until the immigration office closed, and nobody saw us.", grammar: [g.hasta-que, g.preterite-regular], vocab: [w.extranjeria, w.atender, w.cerrar], note: "Past fact: indicative." }
      - { es: "Mientras no entregues la fotocopia del pasaporte, no podrán registrar la solicitud.", en: "As long as you don't hand in the photocopy of your passport, they won't be able to register the application.", grammar: [g.hasta-que], vocab: [w.mientras-no, w.fotocopia, w.registrar, w.solicitud] }
      - { es: "No te desesperes: el permiso de residencia llegará, pero no hasta que lo firme el funcionario.", en: "Don't despair: the residence permit will come, but not until the official signs it.", grammar: [g.hasta-que, g.imperative-negative], vocab: [w.desesperarse, w.permiso-de-residencia, w.funcionario] }
      - { es: "La tarifa seguirá en vigor hasta que el gobierno apruebe la nueva ley.", en: "The fee will remain in force until the government approves the new law.", grammar: [g.hasta-que], vocab: [w.tarifa, w.en-vigor, w.aprobar, w.ley] }
      - { es: "Hasta que no caduque tu carnet, no pidas uno nuevo; es un papeleo enorme.", en: "Until your card expires, don't ask for a new one; it's an enormous amount of paperwork.", grammar: [g.hasta-que, g.imperative-negative], vocab: [w.caducar, w.carnet, w.papeleo] }
      - { es: "Se quedó en la cola hasta que le dieron el certificado.", en: "He stayed in the queue until they gave him the certificate.", grammar: [g.hasta-que, g.preterite-irregular], vocab: [w.cola, w.certificado, w.quedarse] }
      - { es: "Mientras no cumplas todos los requisitos, denegarán la gestión una y otra vez.", en: "As long as you don't meet all the requirements, they'll refuse the application again and again.", grammar: [g.hasta-que], vocab: [w.mientras-no, w.requisito, w.denegar, w.gestion] }
      - { es: "No gestionaremos la nacionalidad hasta tener todos los documentos.", en: "We won't process the citizenship application until we have all the documents.", grammar: [g.hasta-que], vocab: [w.gestionar, w.nacionalidad, w.documento], note: "hasta + infinitive when the subject is the same." }
      - { es: "Trabajó hasta caer rendida: tres horas de papeleo para una simple copia.", en: "She worked until she dropped: three hours of paperwork for a simple copy.", grammar: [g.hasta-que], vocab: [w.rendirse, w.papeleo, w.copia] }
      - { es: "Hasta que la cita previa no aparezca en la web, no puedes venir.", en: "Until the appointment appears on the website, you can't come.", grammar: [g.hasta-que], vocab: [w.hasta-que-no, w.cita-previa, w.aparecer] }
      - { es: "¿Hasta cuándo esperaremos? — Hasta que alguien conceda el permiso o lo deniegue.", en: "How long will we wait? — Until someone grants the permit or refuses it.", grammar: [g.hasta-que], vocab: [w.conceder, w.denegar, w.permiso] }
      - { es: "No pagué la tarifa hasta que me explicaron para qué era.", en: "I didn't pay the fee until they explained to me what it was for.", grammar: [g.hasta-que], vocab: [w.tarifa, w.pagar, w.explicar] }
      - { es: "La desesperación era total: llevaban desde las ocho sin que nadie los llamara.", en: "The despair was total: they had been there since eight without anyone calling them.", altEs: ["La desesperación era total: llevaban desde las ocho sin que nadie los llamase."], grammar: [g.hasta-que, g.subjunctive-imperfect], vocab: [w.desesperacion, w.sin-que, w.llamar] }
      - { es: "No saldré hasta que termine el papeleo.", en: "I won't leave until I finish the paperwork.", altEs: ["No saldré hasta que no termine el papeleo."], grammar: [g.hasta-que], vocab: [w.papeleo, w.salir], error: { wrong: "No saldré hasta que terminaré el papeleo.", explain: "hasta que about the future takes the subjunctive (termine), never the future tense.", grammar: g.hasta-que } }
      - { es: "Primero firma el funcionario y después te dan el permiso.", en: "First the official signs and then they give you the permit.", grammar: [g.hasta-que], vocab: [w.funcionario, w.permiso, w.firmar], transform: { instruction: "Link the two steps with hasta que", answer: "No te darán el permiso hasta que firme el funcionario.", alt: ["No te darán el permiso hasta que no firme el funcionario.", "No te dan el permiso hasta que firma el funcionario."] } }
    exchanges:
      - q: { es: "¿Cuándo tendré el permiso de residencia?", en: "When will I have my residence permit?" }
        a: { es: "No se lo puedo decir hasta que el expediente esté registrado.", en: "I can't tell you until the file is registered." }
        alt: ["No lo sé; hasta que no esté registrado el expediente, no puedo decirle nada.", "En cuanto esté registrado, le avisaremos."]
        grammar: [g.hasta-que]
        vocab: [w.permiso-de-residencia, w.expediente, w.registrar]
      - q: { es: "¿Puedo pagar la tarifa ahora?", en: "Can I pay the fee now?" }
        a: { es: "No hasta que le hayan sellado la solicitud.", en: "Not until they have stamped your application." }
        alt: ["Todavía no; hasta que no le sellen la solicitud, no.", "Sí, en la ventanilla tres."]
        grammar: [g.hasta-que, g.subjunctive-perfect]
        vocab: [w.tarifa, w.sellar, w.solicitud]
      - q: { es: "Llevo tres horas en la cola.", en: "I've been in the queue for three hours." }
        a: { es: "Pues mientras no le llamen por su número, no se vaya.", en: "Well, as long as they don't call your number, don't leave." }
        alt: ["No se vaya hasta que le llamen.", "Lo siento; hasta que no le llamen, tiene que esperar."]
        grammar: [g.hasta-que, g.imperative-usted]
        vocab: [w.mientras-no, w.cola, w.numero]
      - q: { es: "¿Me van a denegar la nacionalidad?", en: "Are they going to refuse me citizenship?" }
        a: { es: "Mientras no caduque el plazo, todavía tiene opciones.", en: "As long as the deadline hasn't expired, you still have options." }
        alt: ["Hasta que no caduque el plazo, tiene opciones.", "No lo sé; espere hasta que le contesten."]
        grammar: [g.hasta-que]
        vocab: [w.denegar, w.nacionalidad, w.caducar, w.plazo]
    texts:
      - title: "Aviso de la oficina de extranjería"
        es: ["No se atenderá a nadie sin cita previa.", "Hasta que no se llame a su número, espere sentado.", "Traiga el documento y una fotocopia de cada uno."]
        en: ["Nobody will be seen without an appointment.", "Until your number is called, wait seated.", "Bring the document and a photocopy of each one."]
        grammar: [g.hasta-que, g.imperative-usted]
        vocab: [w.extranjeria, w.cita-previa, w.fotocopia]
      - title: "Mensaje a un amigo"
        es: ["Sigo en la oficina.", "No me dan el certificado hasta que un funcionario firme no sé qué papel.", "Mientras no salga de aquí, no me esperes para comer."]
        en: ["I'm still at the office.", "They won't give me the certificate until some official signs who knows what paper.", "As long as I'm not out of here, don't wait for me for lunch."]
        grammar: [g.hasta-que]
        vocab: [w.certificado, w.funcionario, w.mientras-no]
  - id: b2.u05.l4
    title: Nada más llegar
    teach: [g.temporal-clauses-advanced]
    vocab: [w.sembrar, w.ordenar.v, w.oveja, w.cabra, w.cerdo, w.tractor, w.granja, w.invernadero, w.fruto, w.despoblacion, w.campesino, w.comarca, w.cosechar, w.pastor, w.establo, w.cultivo, w.cultivar, w.huerta, w.abandonar]
    tip: "Habits, past or present, take the indicative: nada más amanecer, salía; siempre que vuelvo, me sorprende. Future sequences take the subjunctive: en cuanto termine la cosecha, venderán."
    sentences:
      - { es: "Nada más amanecer, mi abuelo salía a ordeñar las cabras.", en: "As soon as it got light, my grandfather went out to milk the goats.", altEs: ["Al amanecer, mi abuelo salía a ordeñar las cabras."], grammar: [g.temporal-clauses-advanced, g.imperfect], vocab: [w.amanecer, w.ordenar.v, w.cabra] }
      - { es: "En cuanto termine la cosecha, los campesinos venderán el fruto en toda la comarca.", en: "As soon as the harvest is over, the country people will sell the produce all over the district.", grammar: [g.temporal-clauses-advanced], vocab: [w.cosecha, w.campesino, w.fruto, w.comarca] }
      - { es: "Siempre que vuelvo al pueblo, el silencio me sorprende: la despoblación se nota.", en: "Whenever I go back to the village, the silence surprises me: the depopulation is noticeable.", grammar: [g.temporal-clauses-advanced], vocab: [w.siempre-que, w.despoblacion, w.silencio] }
      - { es: "A medida que los jóvenes se van a la ciudad, las granjas se quedan vacías.", en: "As young people leave for the city, the farms are left empty.", grammar: [g.temporal-clauses-advanced], vocab: [w.a-medida-que, w.granja, w.joven, w.vacio] }
      - { es: "Cuando siembres, hazlo después de la lluvia, no antes.", en: "When you sow, do it after the rain, not before.", grammar: [g.temporal-clauses-advanced, g.imperative-tu], vocab: [w.sembrar, w.lluvia] }
      - { es: "Al caer la tarde, el pastor recogía las ovejas y las llevaba al establo.", en: "As evening fell, the shepherd gathered the sheep and took them to the barn.", grammar: [g.temporal-clauses-advanced, g.imperfect], vocab: [w.pastor, w.oveja, w.establo, w.recoger] }
      - { es: "Conforme madura el fruto, cambia de color: verde, amarillo, rojo.", en: "As the fruit ripens, it changes colour: green, yellow, red.", grammar: [g.temporal-clauses-advanced], vocab: [w.conforme, w.madurar, w.fruto, w.color] }
      - { es: "Mientras el tractor estuvo averiado, cultivamos la huerta a mano.", en: "While the tractor was broken down, we worked the market garden by hand.", grammar: [g.temporal-clauses-advanced, g.preterite-irregular], vocab: [w.tractor, w.averiado, w.cultivar, w.huerta] }
      - { es: "Una vez que abran el invernadero nuevo, cosecharemos tomates también en invierno.", en: "Once they open the new greenhouse, we'll harvest tomatoes in winter too.", grammar: [g.temporal-clauses-advanced], vocab: [w.una-vez-que, w.invernadero, w.cosechar, w.tomate] }
      - { es: "Cada vez que un vecino abandona su casa, la escuela pierde un alumno.", en: "Every time a neighbour abandons their house, the school loses a pupil.", grammar: [g.temporal-clauses-advanced], vocab: [w.cada-vez-que, w.abandonar, w.escuela, w.alumno] }
      - { es: "Tan pronto como llegue el frío, en el pueblo celebrarán la fiesta del cerdo.", en: "As soon as the cold arrives, in the village they'll celebrate the pig festival.", grammar: [g.temporal-clauses-advanced], vocab: [w.tan-pronto-como, w.cerdo, w.celebrar, w.frio] }
      - { es: "Hasta que no llueva, no sembraremos nada.", en: "Until it rains, we won't sow anything.", altEs: ["Hasta que llueva, no sembraremos nada.", "Mientras no llueva, no sembraremos nada."], grammar: [g.temporal-clauses-advanced, g.hasta-que], vocab: [w.hasta-que-no, w.llover, w.sembrar] }
      - { es: "Desde que cerraron la escuela, la comarca pierde habitantes cada año.", en: "Since they closed the school, the district has been losing inhabitants every year.", grammar: [g.temporal-clauses-advanced], vocab: [w.comarca, w.habitante, w.cerrar] }
      - { es: "Apenas sale el sol, los agricultores ya están en el campo con sus cultivos.", en: "Hardly has the sun come up when the farmers are already in the fields with their crops.", grammar: [g.temporal-clauses-advanced], vocab: [w.apenas, w.agricultor, w.cultivo, w.sol] }
      - { es: "Cuando llegue la primavera, sembraremos.", en: "When spring comes, we'll sow.", grammar: [g.temporal-clauses-advanced], vocab: [w.primavera, w.sembrar], error: { wrong: "Cuando llega la primavera, sembraremos.", explain: "The main clause is in the future, so the time clause takes the present subjunctive: llegue.", grammar: g.temporal-clauses-advanced } }
      - { es: "Llegó al pueblo y enseguida fue a ver a su abuela.", en: "He arrived in the village and immediately went to see his grandmother.", grammar: [g.temporal-clauses-advanced, g.preterite-irregular], vocab: [w.pueblo, w.abuela, w.enseguida], transform: { instruction: "Rephrase with nada más + infinitive", answer: "Nada más llegar al pueblo, fue a ver a su abuela.", alt: ["Al llegar al pueblo, fue a ver a su abuela.", "En cuanto llegó al pueblo, fue a ver a su abuela."] } }
    exchanges:
      - q: { es: "¿Cuándo volverás a la granja?", en: "When will you go back to the farm?" }
        a: { es: "En cuanto termine los exámenes, en junio.", en: "As soon as I finish my exams, in June." }
        alt: ["Cuando termine los exámenes.", "Nada más terminar los exámenes."]
        grammar: [g.temporal-clauses-advanced]
        vocab: [w.granja, w.examen]
      - q: { es: "¿Qué hacía tu abuela al amanecer?", en: "What did your grandmother do at dawn?" }
        a: { es: "Nada más levantarse, encendía el fuego y ordeñaba las cabras.", en: "As soon as she got up, she lit the fire and milked the goats." }
        alt: ["Encendía el fuego y ordeñaba las cabras.", "Al levantarse, encendía el fuego."]
        grammar: [g.temporal-clauses-advanced]
        vocab: [w.amanecer, w.ordenar.v, w.fuego]
      - q: { es: "¿Por qué está tan vacío el pueblo?", en: "Why is the village so empty?" }
        a: { es: "Desde que cerraron la fábrica, la gente se va conforme encuentra trabajo en la ciudad.", en: "Since they closed the factory, people leave as they find work in the city." }
        alt: ["Desde que cerraron la fábrica, la gente se va.", "Por la despoblación: los jóvenes se van a la ciudad."]
        grammar: [g.temporal-clauses-advanced]
        vocab: [w.fabrica, w.conforme, w.despoblacion]
      - q: { es: "¿Cuándo cosecháis la fruta?", en: "When do you harvest the fruit?" }
        a: { es: "Conforme madura, entre julio y septiembre.", en: "As it ripens, between July and September." }
        alt: ["A medida que madura, entre julio y septiembre.", "En verano, en cuanto madura."]
        grammar: [g.temporal-clauses-advanced]
        vocab: [w.cosechar, w.madurar, w.fruta]
    texts:
      - title: "Anuncio en el ayuntamiento del pueblo"
        es: ["Se buscan familias para vivir en nuestra comarca.", "En cuanto lleguéis, tendréis casa y huerta por un alquiler muy bajo.", "Mientras haya niños, la escuela seguirá abierta."]
        en: ["Families wanted to live in our district.", "As soon as you arrive, you'll have a house and a vegetable garden for a very low rent.", "As long as there are children, the school will stay open."]
        grammar: [g.temporal-clauses-advanced, g.se-passive]
        vocab: [w.comarca, w.huerta, w.escuela]
      - title: "Entrada de un blog rural"
        es: ["Hoy, nada más amanecer, ha nevado sobre el invernadero.", "A medida que subía el sol, la nieve desaparecía.", "Cuando termine el invierno, sembraremos los primeros tomates."]
        en: ["Today, as soon as it got light, it snowed on the greenhouse.", "As the sun rose, the snow disappeared.", "When winter ends, we'll sow the first tomatoes."]
        grammar: [g.temporal-clauses-advanced]
        vocab: [w.invernadero, w.nieve, w.sembrar]
dialogues:
  - id: b2.u05.d1
    title: En la oficina de extranjería
    context: Amina is applying for a residence permit. The civil servant explains what is missing and what happens next.
    lines:
      - { speaker: Funcionaria, es: "Buenos días. ¿Trae todos los documentos para el permiso de residencia?", en: "Good morning. Do you have all the documents for the residence permit?" }
      - { speaker: Amina, es: "Creo que sí: la solicitud, el pasaporte y las fotocopias.", en: "I think so: the application, my passport and the photocopies." }
      - { speaker: Funcionaria, es: "Falta el certificado del ayuntamiento. Hasta que no lo traiga, no puedo registrar el expediente.", en: "The certificate from the town hall is missing. Until you bring it, I can't register the file." }
      - { speaker: Amina, es: "¿Y no puede registrarlo mientras yo voy a buscarlo?", en: "And can't you register it while I go and get it?" }
      - { speaker: Funcionaria, es: "No, lo siento. Mientras no esté completo, el sistema no lo acepta.", en: "No, I'm sorry. As long as it isn't complete, the system won't accept it." }
      - { speaker: Amina, es: "Entiendo. ¿Y cuánto tardará, una vez que lo entregue todo?", en: "I see. And how long will it take, once I hand everything in?" }
      - { speaker: Funcionaria, es: "En cuanto el expediente esté registrado, entre dos y tres meses.", en: "As soon as the file is registered, between two and three months." }
      - { speaker: Amina, es: "¿Tres meses? Mi contrato de trabajo empieza en seis semanas.", en: "Three months? My work contract starts in six weeks." }
      - { speaker: Funcionaria, es: "Le daremos un justificante a fin de que pueda empezar a trabajar mientras espera la respuesta.", en: "We'll give you a receipt so that you can start working while you wait for the answer." }
      - { speaker: Amina, es: "Menos mal. Volveré esta tarde con el certificado, antes de que cierren.", en: "Thank goodness. I'll come back this afternoon with the certificate, before you close." }
      - { speaker: Funcionaria, es: "Hasta las dos. Y traiga también una copia, de modo que no tenga que volver otra vez.", en: "Until two. And bring a copy as well, so that you don't have to come back again." }
    questions:
      - { q: "Which document is Amina missing?", options: ["Her passport", "A certificate from the town hall", "A photocopy of her contract"], answer: 1 }
      - { q: "How long will the permit take once the file is registered?", options: ["Six weeks", "Two to three months", "One year"], answer: 1 }
      - { q: "What will the receipt allow Amina to do?", options: ["Start working while she waits", "Travel abroad", "Skip the queue next time"], answer: 0 }
