        es: ["Segunda: reunião às nove.", "Quarta: aula de português às sete da noite.", "Sábado: praia! Domingo: feijoada na casa da avó."]
        en: ["Monday: meeting at nine.", "Wednesday: Portuguese class at seven in the evening.", "Saturday: beach! Sunday: feijoada at Grandma's house."]
        grammar: [g.days-months]
        vocab: [w.segunda-feira, w.quarta-feira, w.sábado, w.domingo]
      - title: "O bonde de Santa Teresa"
        es: ["O bonde amarelo passa todo dia.", "Às vezes está cheio de turistas.", "As pessoas do bairro quase nunca pegam o bonde no fim de semana."]
        en: ["The yellow tram goes by every day.", "Sometimes it's full of tourists.", "The people from the neighbourhood hardly ever take the tram at the weekend."]
