id: r.b1.quando-voce-vier-a-congonhas
level: b1
title: Quando você vier a Congonhas
kind: text
intro: Seu Josué, a retired teacher in Congonhas, writes to his granddaughter in Lisbon, who is finally coming to visit. His letter is full of the future subjunctive.
allow: [josué, congonhas, lisboa, ana, aleijadinho, matosinhos, bom, jesus, unesco, ok, confins, jubileu, setembro]
paragraphs:
  - { es: "Querida Ana, que alegria receber a sua mensagem! Então é verdade: você vem mesmo ao Brasil em setembro. A sua avó já está fazendo planos e lista de comidas. Eu, que sou mais calmo, resolvi escrever esta carta para explicar como vão ser os seus dias aqui. Sei que hoje ninguém escreve cartas, mas o seu avô é antigo, você sabe.", en: "Dear Ana, what a joy to get your message! So it's true: you really are coming to Brazil in September. Your grandmother is already making plans and lists of food. I, being calmer, decided to write this letter to explain what your days here will be like. I know nobody writes letters nowadays, but your grandfather is old-fashioned, you know." }
  - { es: "Quando você chegar ao aeroporto de Confins, o seu tio Nando vai estar esperando. De lá até Congonhas são mais ou menos duas horas de carro. Se você estiver cansada, durma no caminho; a estrada não tem nada de especial. Mas quando vocês passarem pelas montanhas, perto daqui, acorde e olhe pela janela: é a paisagem da minha infância.", en: "When you arrive at Confins airport, your uncle Nando will be waiting. From there to Congonhas it's about two hours by car. If you're tired, sleep on the way; the road is nothing special. But when you pass through the mountains, near here, wake up and look out of the window: it's the landscape of my childhood." }
  - { es: "Na primeira manhã, se o tempo permitir, eu vou levar você ao Santuário do Bom Jesus de Matosinhos. Você vai subir a ladeira devagar, comigo, e no alto vai ver os doze profetas do Aleijadinho. São estátuas de pedra-sabão, quase do tamanho de uma pessoa, feitas no começo do século dezenove. Quando você olhar para o rosto de cada um, vai entender por que eu dei aulas de história por quarenta anos e nunca me cansei de falar deles.", en: "On the first morning, if the weather allows, I'll take you to the Sanctuary of Bom Jesus de Matosinhos. You'll walk up the slope slowly, with me, and at the top you'll see Aleijadinho's twelve prophets. They're soapstone statues, almost the size of a person, made at the beginning of the nineteenth century. When you look at each one's face, you'll understand why I taught history for forty years and never got tired of talking about them." }
  - { es: "Antes de chegar aos profetas, você vai passar por seis pequenas capelas. Dentro delas, há figuras de madeira, também do Aleijadinho e da oficina dele, que contam a história da Paixão de Cristo. Os turistas costumam passar rápido, mas eu peço que você vá com calma. Quanto mais você olhar, mais detalhes vai descobrir.", en: "Before you reach the prophets, you'll pass six small chapels. Inside them there are wooden figures, also by Aleijadinho and his workshop, that tell the story of the Passion of Christ. Tourists tend to go by quickly, but I ask you to take your time. The more you look, the more details you'll discover." }
  - { es: "Você chega bem na época do Jubileu, a grande festa religiosa da cidade. Milhares de pessoas vêm de toda Minas para rezar, pagar promessas e, claro, comer. A cidade fica cheia, barulhenta e alegre. Se você quiser, a gente vai à missa com a sua avó; se não quiser, eu levo você para comer pastel na feira. As duas coisas são tradição.", en: "You're arriving right at the time of the Jubileu, the town's big religious festival. Thousands of people come from all over Minas to pray, fulfil vows and, of course, eat. The town gets full, noisy and cheerful. If you like, we'll go to mass with your grandmother; if you don't, I'll take you to eat pastel at the fair. Both are tradition." }
  - { es: "Sobre a comida, aviso logo: enquanto você estiver aqui, não adianta dizer que está satisfeita. A sua avó vai fazer frango com quiabo, tutu de feijão, pão de queijo e doce de leite, e vai ficar ofendida se você não repetir. Traga roupas largas!", en: "About the food, I'll warn you now: while you're here, there's no point saying you're full. Your grandmother will make chicken with okra, tutu de feijão, pão de queijo and doce de leite, and she'll be offended if you don't have seconds. Bring loose clothes!" }
  - { es: "Ana, eu sei que você cresceu em Lisboa, que fala com sotaque português e que conhece muitas cidades bonitas. Mas aqui também é a sua terra. Quando você for embora, espero que leve um pedaço de Congonhas no coração, como o seu pai levou quando foi para Portugal. Estamos contando os dias. Um beijo do seu avô, Josué.", en: "Ana, I know you grew up in Lisbon, that you speak with a Portuguese accent and that you know lots of beautiful cities. But this is your land too. When you leave, I hope you'll take a piece of Congonhas in your heart, as your father did when he went to Portugal. We're counting the days. A kiss from your grandfather, Josué." }
questions:
  - { q: "Quem vai buscar a Ana no aeroporto?", options: ["O avô", "A avó", "O tio Nando"], answer: 2, explain: "«Quando você chegar ao aeroporto de Confins, o seu tio Nando vai estar esperando.»" }
  - { q: "O que são os doze profetas?", options: ["Pinturas numa igreja", "Estátuas de pedra-sabão do Aleijadinho", "Figuras de madeira nas capelas"], answer: 1, explain: "«São estátuas de pedra-sabão, quase do tamanho de uma pessoa.» The wooden figures are in the chapels." }
  - { q: "O que o avô pede que a Ana faça nas capelas?", options: ["Que passe rápido", "Que tire muitas fotos", "Que vá com calma e olhe os detalhes"], answer: 2, explain: "«Eu peço que você vá com calma. Quanto mais você olhar, mais detalhes vai descobrir.»" }
  - { q: "O que é o Jubileu?", options: ["Uma feira de pastel", "A grande festa religiosa de Congonhas", "Um museu"], answer: 1, explain: "«O Jubileu, a grande festa religiosa da cidade.»" }
  - { q: "Por que a Ana deve trazer roupas largas?", options: ["Porque faz muito calor", "Porque a avó vai cozinhar muito", "Porque vai à missa"], answer: 1, explain: "Her grandmother will cook a lot and be offended if Ana doesn't have seconds — hence «Traga roupas largas!»" }
