# A2 grammar notes (Tuscany). Explanations use light markdown: ### headings,
# bullets, tables, **bold**, *italic* (italic = Italian example inline).
- id: g.passato-prossimo-avere
  level: a2
  title: "The passato prossimo with avere"
  summary: "ho parlato, hai mangiato, ha dormito — avere + past participle for completed actions."
  explanation: |
    The *passato prossimo* is the everyday past tense: what you did yesterday, last year, this morning.

    ### Form: avere (present) + past participle
    | | -are → -ato | -ere → -uto | -ire → -ito |
    |---|---|---|---|
    | io | ho parl**ato** | ho cred**uto** | ho dorm**ito** |
    | tu | hai parlato | hai creduto | hai dormito |
    | lui / lei | ha parlato | ha creduto | ha dormito |
    | noi | abbiamo parlato | abbiamo creduto | abbiamo dormito |
    | voi | avete parlato | avete creduto | avete dormito |
    | loro | hanno parlato | hanno creduto | hanno dormito |

    - With *avere*, the participle normally **does not change**: *Anna ha mangiato, i ragazzi hanno mangiato.*
    - Most verbs take *avere*, especially verbs with a direct object (*ho visto il Duomo*).
    - Negative: *Non ho capito.* Adverbs like *già, mai, sempre, appena* go between: *Ho già mangiato.*

    It translates both 'I did' and 'I have done': *Ho visto il David* = I saw / I have seen the David.
  examples:
    - { es: "Ieri ho visitato gli Uffizi.", en: "Yesterday I visited the Uffizi." }
    - { es: "Abbiamo mangiato la bistecca alla fiorentina.", en: "We ate Florentine steak." }
    - { es: "Hai dormito bene?", en: "Did you sleep well?" }
    - { es: "Non hanno capito la domanda.", en: "They didn't understand the question." }
  pitfalls:
    - "Don't use the present for completed actions: 'I saw' is *ho visto*, not *vedo*."
    - "With *avere* the participle stays in -o: *Maria ha parlato*, not *ha parlata*."
    - "Spanish speakers: Italian uses the *passato prossimo* where Spain may use the *indefinido*: *Ieri ho comprato* (ayer compré)."
  variant: "In the South, especially Sicily and Calabria, many speakers use the passato remoto for the same meaning in speech (*ieri mangiai*). In the North the passato prossimo is used for all past events."
  related: [g.participles-irregular, g.passato-prossimo-essere, g.time-markers-past]
  drills:
    - { es: "Ho comprato un libro su Firenze.", en: "I bought a book about Florence." }
    - { es: "Avete finito i compiti?", en: "Have you finished your homework?" }
    - { es: "Lei ha lavorato tutto il giorno.", en: "She worked all day." }
    - { es: "Non abbiamo ricevuto il messaggio.", en: "We didn't get the message." }
- id: g.participles-irregular
  level: a2
  title: "Irregular past participles"
  summary: "fatto, detto, visto, preso, messo, scritto, letto, aperto, chiuso, bevuto, venuto…"
  explanation: |
    Many common verbs, mostly in **-ere**, have irregular participles. Learn them in groups:

    | ending | verbs |
    |---|---|
    | **-tto** | *fare → fatto, dire → detto, scrivere → scritto, leggere → letto, rompere → rotto, cuocere → cotto* |
    | **-so** | *prendere → preso, mettere → messo, chiudere → chiuso, decidere → deciso, spendere → speso, ridere → riso, scendere → sceso, perdere → perso* |
    | **-sto** | *vedere → visto, chiedere → chiesto, rispondere → risposto, rimanere → rimasto* |
    | **-erto** | *aprire → aperto, offrire → offerto, scoprire → scoperto, soffrire → sofferto* |
    | others | *essere → stato, bere → bevuto, venire → venuto, vivere → vissuto, nascere → nato, morire → morto, scegliere → scelto, vincere → vinto, accendere → acceso, succedere → successo* |

    *Vedere* also has *veduto* (rare) and *perdere* has *perduto* (formal).
  examples:
    - { es: "Che cosa hai fatto ieri sera?", en: "What did you do last night?" }
    - { es: "Abbiamo preso il treno per Lucca.", en: "We took the train to Lucca." }
    - { es: "Ho letto un libro di Collodi.", en: "I read a book by Collodi." }
    - { es: "Chi ha aperto la finestra?", en: "Who opened the window?" }
  pitfalls:
    - "*Ho visto*, not *ho veduto* in everyday Italian; *ho preso*, never *ho prenduto*."
    - "*Che cosa è successo?* (What happened?) uses *essere* + *successo*."
    - "Spanish speakers: *hecho → fatto, dicho → detto, puesto → messo, visto → visto*."
  related: [g.passato-prossimo-avere, g.passato-prossimo-essere]
  drills:
    - { es: "Ho messo le chiavi nella borsa.", en: "I put the keys in the bag." }
    - { es: "Hai scritto a tua madre?", en: "Did you write to your mother?" }
    - { es: "Abbiamo bevuto un Chianti ottimo.", en: "We drank an excellent Chianti." }
    - { es: "Chi ha vinto la partita?", en: "Who won the match?" }
    - { es: "Ho chiesto il conto.", en: "I asked for the bill." }
- id: g.time-markers-past
  level: a2
  title: "Past time expressions: ieri, fa, scorso"
  summary: "ieri, l'altro ieri, stamattina, due giorni fa, la settimana scorsa, l'anno scorso, nel 2019."
  explanation: |
    | expression | meaning |
    |---|---|
    | *ieri, ieri sera, ieri mattina* | yesterday, last night, yesterday morning |
    | *l'altro ieri* | the day before yesterday |
    | *stamattina, oggi pomeriggio* | this morning, this afternoon |
    | *tre giorni fa, un anno fa* | three days ago, a year ago |
    | *la settimana scorsa, il mese scorso, l'anno scorso* | last week / month / year |
    | *sabato scorso, l'estate scorsa* | last Saturday, last summer |
    | *nel 2019, a maggio, in estate* | in 2019, in May, in summer |
    | *una volta, tante volte* | once, many times |

    - *Fa* (ago) **follows** the time: *due ore fa*.
    - *Scorso* agrees and follows the noun: *la settimana scorsa, i giorni scorsi*.
    - *Ultimo* means 'last (in a series)' or 'latest': *l'ultima volta* (the last time).
  examples:
    - { es: "Sono arrivato a Firenze tre giorni fa.", en: "I arrived in Florence three days ago." }
    - { es: "L'estate scorsa abbiamo affittato una casa in Chianti.", en: "Last summer we rented a house in Chianti." }
    - { es: "Ieri sera ho mangiato troppo.", en: "Last night I ate too much." }
    - { es: "L'ultima volta ho preso il treno.", en: "Last time I took the train." }
  pitfalls:
    - "'Ago' is *fa* after the time: *un mese fa*, not *fa un mese*."
    - "*La settimana scorsa*, not *l'ultima settimana* (which means 'the final week')."
    - "Spanish speakers: *hace dos días* → *due giorni fa* (word order reversed)."
  related: [g.passato-prossimo-avere, g.da-since]
  drills:
    - { es: "Ho visto Marco due settimane fa.", en: "I saw Marco two weeks ago." }
    - { es: "Il mese scorso ho cambiato lavoro.", en: "Last month I changed jobs." }
    - { es: "Stamattina ho fatto colazione tardi.", en: "This morning I had breakfast late." }
- id: g.passato-prossimo-essere
  level: a2
  title: "The passato prossimo with essere — and agreement"
  summary: "sono andato/a, siamo arrivati/e: with essere the participle agrees with the subject."
  explanation: |
    Some verbs form the passato prossimo with **essere**. Then the participle **agrees** with the subject, like an adjective:

    | | andare |
    |---|---|
    | io | sono andat**o / a** |
    | tu | sei andat**o / a** |
    | lui / lei | è andat**o** / andat**a** |
    | noi | siamo andat**i / e** |
    | voi | siete andat**i / e** |
    | loro | sono andat**i / e** |

    ### Which verbs?
    - Most verbs of **movement to a place**: *andare, venire, arrivare, partire, tornare, entrare, uscire, salire, scendere, cadere*.
    - Verbs of **state and change of state**: *essere, stare, rimanere, diventare, nascere, morire, crescere, piacere, succedere, costare*.
    - All reflexive verbs (next units).

    *Essere* itself: *sono stato/a* (I was / I have been) — same participle as *stare*.
  examples:
    - { es: "Sabato siamo andati a Siena.", en: "On Saturday we went to Siena." }
    - { es: "Giulia è arrivata ieri sera.", en: "Giulia arrived last night." }
    - { es: "Sei mai stata in Toscana?", en: "Have you ever been to Tuscany? (to a woman)" }
    - { es: "I miei nonni sono nati a Pisa.", en: "My grandparents were born in Pisa." }
  pitfalls:
    - "Agreement is required: *Anna è andata*, not *Anna è andato*."
    - "Mixed groups use the masculine plural: *Marco e Sara sono partiti*."
    - "Spanish speakers: Spanish always uses *haber*; Italian switches to *essere* for these verbs: *sono andato*, never *ho andato*."
  related: [g.auxiliary-choice, g.passato-prossimo-avere, g.reflexive-passato-prossimo]
  drills:
    - { es: "Le ragazze sono uscite alle nove.", en: "The girls went out at nine." }
    - { es: "Sono rimasto a casa tutto il giorno.", en: "I stayed at home all day." }
    - { es: "Mia sorella è diventata medico.", en: "My sister became a doctor." }
    - { es: "Siete tornati tardi?", en: "Did you get back late?" }
- id: g.auxiliary-choice
  level: a2
  title: "Essere or avere? Choosing the auxiliary"
  summary: "Transitive verbs take avere; movement, change and reflexives take essere; some verbs take both."
  explanation: |
    ### Quick test
    1. Does the verb have a **direct object** (or could it)? → **avere**: *ho mangiato (la pizza), ho visto (il film)*.
    2. Is it **reflexive** (*-si*)? → **essere**: *mi sono alzato*.
    3. Is it movement to a place, staying, or a change of state? → usually **essere**: *sono arrivato, sono rimasto, sono cresciuto*.

    ### Exceptions to remember
    - Movement *without* destination focus takes **avere**: *camminare, viaggiare, nuotare, passeggiare, ballare* → *ho camminato, ho viaggiato*.
    - *Dormire, ridere, piangere, lavorare* take **avere**.

    ### Verbs that take both
    | with **avere** (object) | with **essere** (no object) |
    |---|---|
    | *Ho cominciato il corso.* | *Il corso è cominciato.* |
    | *Ho finito il lavoro.* | *Il film è finito.* |
    | *Ho passato l'estate a Lucca.* | *Sono passato da te.* |
    | *Ho salito le scale.* | *Sono salito al terzo piano.* |
    | *Ho cambiato casa.* | *Roma è cambiata.* |

    Weather verbs take either: *è piovuto / ha piovuto*.
  examples:
    - { es: "Abbiamo camminato tutto il giorno per Firenze.", en: "We walked all day around Florence." }
    - { es: "La lezione è cominciata alle dieci.", en: "The lesson started at ten." }
    - { es: "Ho cominciato un corso di cucina.", en: "I've started a cooking course." }
    - { es: "Siamo saliti sulla Torre di Pisa.", en: "We went up the Leaning Tower of Pisa." }
  pitfalls:
    - "*Ho viaggiato* and *ho camminato* take *avere* even though they are movement."
    - "*Finire, cominciare* take *essere* when the thing itself ends or starts: *Il concerto è finito*."
    - "Modal verbs usually take the auxiliary of the following verb: *sono dovuto andare*, *ho dovuto lavorare*."
  related: [g.passato-prossimo-essere, g.passato-prossimo-avere]
  drills:
    - { es: "Il film è finito tardi.", en: "The film finished late." }
    - { es: "Ho finito il libro ieri.", en: "I finished the book yesterday." }
    - { es: "Hanno viaggiato molto in Italia.", en: "They have travelled a lot in Italy." }
    - { es: "Sono passata da Lucca.", en: "I went via Lucca." }
- id: g.reflexive-passato-prossimo
  level: a2
  title: "Reflexive verbs in the past: mi sono alzato"
  summary: "Reflexive verbs always use essere, and the participle agrees: si è svegliata, ci siamo divertiti."
  explanation: |
    | | divertirsi |
    |---|---|
    | io | **mi sono** divertito/a |
    | tu | **ti sei** divertito/a |
    | lui / lei | **si è** divertito/a |
    | noi | **ci siamo** divertiti/e |
    | voi | **vi siete** divertiti/e |
    | loro | **si sono** divertiti/e |

    - The pronoun goes before *essere*: *Mi sono svegliato tardi.*
    - The participle agrees with the subject: *Sara si è vestita in fretta.*
    - Reciprocal meaning ('each other') works the same: *Ci siamo conosciuti a Firenze.* (We met in Florence.)
    - With a modal: *Mi sono dovuto alzare* or *Ho dovuto alzarmi*.
  examples:
    - { es: "Stamattina mi sono svegliata alle sei.", en: "This morning I woke up at six." }
    - { es: "Vi siete divertiti alla festa?", en: "Did you have fun at the party?" }
    - { es: "Ci siamo conosciuti a una festa a Pisa.", en: "We met at a party in Pisa." }
    - { es: "Si sono sposati in un castello.", en: "They got married in a castle." }
  pitfalls:
    - "Never *avere* with a reflexive: *mi sono lavato*, not *mi ho lavato*."
    - "Agreement: *Giulia si è alzata*, not *si è alzato*."
    - "Spanish speakers: *me he levantado* → *mi sono alzato* (essere, not avere)."
  related: [g.reflexive-present, g.passato-prossimo-essere]
  drills:
    - { es: "Mi sono fatto la doccia e mi sono vestito.", en: "I had a shower and got dressed." }
    - { es: "Ti sei ricordata di comprare il pane?", en: "Did you remember to buy the bread?" }
    - { es: "Si sono addormentati sul divano.", en: "They fell asleep on the sofa." }
    - { es: "Ci siamo persi nel centro di Siena.", en: "We got lost in the centre of Siena." }
- id: g.gia-ancora-mai
  level: a2
  title: "Già, non ancora, mai, appena, sempre"
  summary: "Ho già mangiato. Non ho ancora finito. Sei mai stato a Lucca? Sono appena arrivato."
  explanation: |
    These adverbs go **between the auxiliary and the participle**:

    | adverb | meaning | example |
    |---|---|---|
    | *già* | already | *Ho già visto quel film.* |
    | *non… ancora* | not yet | *Non ho ancora finito.* |
    | *mai* | ever (question) | *Sei mai stato a Lucca?* |
    | *non… mai* | never | *Non ho mai mangiato il lampredotto.* |
    | *appena* | just | *Sono appena arrivato.* |
    | *sempre* | always | *Ho sempre voluto vedere Pisa.* |

    ### Quick answers
    - *Hai già mangiato? — Sì, già. / No, non ancora.*
    - *Sei mai stato in Toscana? — Sì, una volta / tante volte. — No, mai.*
  examples:
    - { es: "Avete già prenotato l'albergo?", en: "Have you already booked the hotel?" }
    - { es: "Non sono ancora stata a San Gimignano.", en: "I haven't been to San Gimignano yet." }
    - { es: "Hai mai assaggiato il pecorino di Pienza?", en: "Have you ever tasted Pienza pecorino?" }
    - { es: "Il treno è appena partito.", en: "The train has just left." }
  pitfalls:
    - "Position: *ho già mangiato*, not *già ho mangiato* (possible but emphatic)."
    - "*Non… ancora* needs *non*: *non ho ancora deciso*."
    - "Spanish speakers: *acabo de llegar* → *sono appena arrivato* (no verb like *acabar*)."
  related: [g.passato-prossimo-avere, g.double-negation]
  drills:
    - { es: "Ho già comprato i biglietti.", en: "I've already bought the tickets." }
    - { es: "Non abbiamo ancora mangiato.", en: "We haven't eaten yet." }
    - { es: "Non sono mai salito sul campanile.", en: "I've never climbed the bell tower." }
    - { es: "Ho appena parlato con tua madre.", en: "I've just spoken to your mother." }
- id: g.imperfetto-forms
  level: a2
  title: "The imperfetto: forms"
  summary: "parlavo, leggevi, dormiva, eravamo — very regular, with essere as the main exception."
  explanation: |
    Drop **-re** from the infinitive and add *-vo, -vi, -va, -vamo, -vate, -vano*:

    | | parlare | leggere | dormire | essere |
    |---|---|---|---|---|
    | io | parla**vo** | legge**vo** | dormi**vo** | **ero** |
    | tu | parla**vi** | legge**vi** | dormi**vi** | **eri** |
    | lui / lei | parla**va** | legge**va** | dormi**va** | **era** |
    | noi | parla**vamo** | legge**vamo** | dormi**vamo** | **eravamo** |
    | voi | parla**vate** | legge**vate** | dormi**vate** | **eravate** |
    | loro | parla**vano** | legge**vano** | dormi**vano** | **erano** |

    ### Irregular stems (from old Latin forms)
    - *fare → facevo*, *dire → dicevo*, *bere → bevevo*, *tradurre → traducevo*, *porre → ponevo*.
    - *Avere, andare, stare, venire* are **regular**: *avevo, andavo, stavo, venivo*.

    Stress: *parlAvano, legGEvano* — the *loro* form is stressed on the third-last syllable.
  examples:
    - { es: "Da piccolo abitavo in campagna.", en: "When I was little I lived in the country." }
    - { es: "Era una bella giornata.", en: "It was a beautiful day." }
    - { es: "Facevamo sempre il bagno nel fiume.", en: "We always used to swim in the river." }
    - { es: "Che cosa dicevi?", en: "What were you saying?" }
  pitfalls:
    - "*Facevo*, not *favo*; *dicevo*, not *divo*; *bevevo*, not *bevo*."
    - "Stress the *loro* form correctly: *a-VE-va-no*, not *a-ve-VA-no*."
    - "Spanish speakers: no -aba / -ía split: all three groups use *-vo*: *parlavo, leggevo, dormivo*."
  related: [g.imperfetto-uses, g.passato-prossimo-vs-imperfetto]
  drills:
    - { es: "Mio nonno aveva un podere vicino a Siena.", en: "My grandfather had a farm near Siena." }
    - { es: "Eravate stanchi?", en: "Were you tired?" }
    - { es: "Ogni estate andavano al mare a Viareggio.", en: "Every summer they went to the seaside at Viareggio." }
    - { es: "Bevevo solo latte.", en: "I only drank milk." }
- id: g.imperfetto-uses
  level: a2
  title: "When to use the imperfetto"
  summary: "Habits, descriptions, background, ongoing actions and states in the past."
  explanation: |
    | use | example |
    |---|---|
    | **habits** (used to, would) | *D'estate andavamo al mare.* |
    | **description** of people, places, weather | *Il paese era piccolo e tranquillo. Pioveva.* |
    | **physical and mental states** | *Ero stanco. Avevo fame. Volevo uscire.* |
    | **age and time** | *Avevo dieci anni. Erano le otto.* |
    | **ongoing actions** (was doing) | *Leggevo mentre lui cucinava.* |
    | **politeness** | *Volevo chiedere un'informazione.* |

    Signal words: *di solito, sempre, ogni giorno, spesso, da bambino, una volta* (once upon a time / in the old days), *mentre*.

    ### Polite imperfetto
    In shops: *Volevo un chilo di pane* = I'd like (literally 'I wanted') — softer than *voglio*.
  examples:
    - { es: "Quando ero bambina, la domenica andavamo dalla nonna.", en: "When I was a child, on Sundays we used to go to grandma's." }
    - { es: "La casa aveva un giardino enorme.", en: "The house had a huge garden." }
    - { es: "Avevo sonno, quindi sono andato a letto.", en: "I was sleepy, so I went to bed." }
    - { es: "Buongiorno, volevo un'informazione.", en: "Good morning, I wanted to ask something." }
  pitfalls:
    - "Don't use the imperfetto for a single completed event: *Ieri ho visto Marco*, not *vedevo*."
    - "Age in the past is imperfetto: *Avevo vent'anni*."
    - "'Used to' is not *usavo*: just use the imperfetto (*giocavo*) or *ero solito* (formal)."
  related: [g.imperfetto-forms, g.passato-prossimo-vs-imperfetto, g.da-bambino]
  drills:
    - { es: "Faceva freddo e nevicava.", en: "It was cold and snowing." }
    - { es: "Ogni mattina prendevo l'autobus alle sette.", en: "Every morning I took the bus at seven." }
    - { es: "Il ristorante era pieno di turisti.", en: "The restaurant was full of tourists." }
    - { es: "Non sapevo che eri qui.", en: "I didn't know you were here." }
- id: g.da-bambino
  level: a2
  title: "Da bambino, una volta — talking about the old days"
  summary: "da bambino, da piccolo, da giovane, quando ero…, una volta, ai miei tempi, di solito."
  explanation: |
    ### 'When I was…'
    - *Da bambino / bambina* — as a child
    - *Da piccolo / piccola* — when I was small
    - *Da ragazzo / giovane* — as a youth / when I was young
    - *Quando ero studente…* — when I was a student

    *Da* + noun or adjective, no article, agrees with the person: *Da piccola ero timida.*

    ### Contrasting then and now
    | then | now |
    |---|---|
    | *una volta, prima, ai miei tempi* | *adesso, ora, oggi, oggigiorno* |
    | *Una volta qui c'era un mercato.* | *Adesso c'è un parcheggio.* |

    ### Habitual frequency
    *di solito, ogni estate, tutti i giorni, spesso, la domenica* + imperfetto.
    Formal 'used to': *ero solito / solevo* (rare).
  examples:
    - { es: "Da piccolo avevo paura del buio.", en: "When I was small I was afraid of the dark." }
    - { es: "Una volta in questa piazza c'era il mercato.", en: "There used to be a market in this square." }
    - { es: "Ai miei tempi non c'erano i cellulari.", en: "In my day there were no mobile phones." }
    - { es: "Da giovane mia madre ballava benissimo.", en: "When she was young my mother danced really well." }
  pitfalls:
    - "*Da bambino*, no article: not *da il bambino* or *come bambino*."
    - "*Una volta* means both 'once' (with passato prossimo) and 'in the old days' (with imperfetto)."
    - "Spanish speakers: *de niño* → *da bambino* (*da*, not *di*)."
  related: [g.imperfetto-uses, g.passato-prossimo-vs-imperfetto]
  drills:
    - { es: "Da bambina giocavo sempre in cortile.", en: "As a child I always played in the courtyard." }
    - { es: "Prima abitavo a Pisa, adesso abito a Lucca.", en: "I used to live in Pisa, now I live in Lucca." }
    - { es: "Da studenti mangiavamo sempre in mensa.", en: "As students we always ate in the canteen." }
- id: g.passato-prossimo-vs-imperfetto
  level: a2
  title: "Passato prossimo or imperfetto?"
  summary: "Passato prossimo = what happened (events); imperfetto = how things were (background, habits, ongoing)."
  explanation: |
    | passato prossimo | imperfetto |
    |---|---|
    | completed events, the story line | background, the setting |
    | *Sono arrivato alle otto.* | *Era buio e faceva freddo.* |
    | a limited, counted period | habits, repeated actions |
    | *Ho abitato a Siena per due anni.* | *Abitavo a Siena.* |
    | something that interrupts | the action that was going on |
    | *…quando è squillato il telefono.* | *Dormivo…* |

    ### Meaning changes with some verbs
    - *Sapevo* (I knew) — *Ho saputo* (I found out)
    - *Conoscevo Marco* (I knew him) — *Ho conosciuto Marco* (I met him)
    - *Dovevo partire* (I was supposed to leave, maybe didn't) — *Sono dovuto partire* (I had to and did)
    - *Volevo telefonarti* (I meant to) — *Ho voluto telefonarti* (I insisted on it)

    Tip: if you can say 'for two hours / three times', it's usually passato prossimo.
  examples:
    - { es: "Mentre passeggiavo per Lucca, ho incontrato un vecchio amico.", en: "While I was walking around Lucca, I met an old friend." }
    - { es: "Era tardi, quindi abbiamo preso un taxi.", en: "It was late, so we took a taxi." }
    - { es: "Ho abitato a Firenze per tre anni.", en: "I lived in Florence for three years." }
    - { es: "Ieri ho saputo che Paola si sposa.", en: "Yesterday I found out Paola is getting married." }
  pitfalls:
    - "Duration with a time limit takes passato prossimo: *Ho dormito otto ore*, not *dormivo otto ore*."
    - "Descriptions take imperfetto even if short: *Era una bella giornata*."
    - "Spanish speakers: the logic is the same as *indefinido / imperfecto*, so trust your instinct."
  related: [g.imperfetto-uses, g.passato-prossimo-avere, g.mentre-quando]
  drills:
    - { es: "Quando sono arrivata, pioveva.", en: "When I arrived, it was raining." }
    - { es: "Non sono uscito perché ero stanco.", en: "I didn't go out because I was tired." }
    - { es: "Conoscevo già Firenze, ma non Pisa.", en: "I already knew Florence, but not Pisa." }
    - { es: "Ho conosciuto mia moglie a Siena.", en: "I met my wife in Siena." }
    - { es: "Leggevo quando è andata via la luce.", en: "I was reading when the power went off." }
- id: g.mentre-quando
  level: a2
  title: "Mentre and quando — linking past actions"
  summary: "mentre + imperfetto (while); quando + passato prossimo (when something happened)."
  explanation: |
    ### Two actions going on at the same time
    *mentre* + imperfetto, imperfetto: *Mentre io cucinavo, lui apparecchiava.*

    ### An action interrupted
    *mentre* + imperfetto, passato prossimo: *Mentre dormivo, è suonato il telefono.*
    *quando* + passato prossimo, imperfetto: *Quando è arrivato, dormivo.*

    ### One event after another
    *quando* + passato prossimo, passato prossimo: *Quando è arrivato, siamo usciti.*

    | | |
    |---|---|
    | *mentre* | while — almost always with imperfetto |
    | *quando* | when — with either tense |
    | *appena* | as soon as — usually passato prossimo |
  examples:
    - { es: "Mentre visitavamo il Duomo, ha cominciato a piovere.", en: "While we were visiting the cathedral, it started to rain." }
    - { es: "Quando sono tornata a casa, i bambini dormivano.", en: "When I got back home, the children were asleep." }
    - { es: "Mentre lui parlava, io pensavo ad altro.", en: "While he was talking, I was thinking of something else." }
    - { es: "Appena siamo arrivati, abbiamo mangiato.", en: "As soon as we arrived, we ate." }
  pitfalls:
    - "*Mentre* + passato prossimo is almost always wrong: *mentre camminavo*, not *mentre ho camminato*."
    - "*Quando* doesn't decide the tense: look at whether the action is background or event."
    - "Spanish speakers: *mientras* → *mentre*, used the same way."
  related: [g.passato-prossimo-vs-imperfetto, g.stare-gerundio-past]
  drills:
    - { es: "Mentre facevo la doccia, è arrivato Luca.", en: "While I was having a shower, Luca arrived." }
    - { es: "Quando ho chiamato, non rispondeva nessuno.", en: "When I called, nobody answered." }
    - { es: "Mentre loro giocavano, noi leggevamo.", en: "While they were playing, we were reading." }
- id: g.narrative-connectors
  level: a2
  title: "Telling a story: prima, poi, all'improvviso, alla fine"
  summary: "Sequence and drama in a narrative: all'inizio, poi, dopo, a un certo punto, all'improvviso, alla fine."
  explanation: |
    | stage | connectors |
    |---|---|
    | start | *all'inizio, prima, una volta, un giorno* |
    | sequence | *poi, dopo, dopo un po', più tardi, il giorno dopo* |
    | surprise | *all'improvviso, improvvisamente, a un certo punto, a un tratto* |
    | simultaneity | *mentre, nel frattempo, intanto* |
    | end | *alla fine, finalmente, infine* |

    - *Finalmente* = at last (after waiting); *alla fine* = in the end.
    - *Dopo* + noun or infinitive: *dopo cena, dopo aver mangiato* (B1).
    - Fairy tales start with *C'era una volta…* (Once upon a time there was…) — note the imperfetto.
  examples:
    - { es: "All'inizio era tutto tranquillo, poi è arrivata la tempesta.", en: "At first everything was calm, then the storm came." }
    - { es: "A un certo punto si è spenta la luce.", en: "At one point the light went out." }
    - { es: "Dopo due ore, finalmente siamo arrivati a Volterra.", en: "After two hours we finally arrived in Volterra." }
    - { es: "C'era una volta un pezzo di legno.", en: "Once upon a time there was a piece of wood." }
  pitfalls:
    - "*Finalmente* ≠ 'finally' as in 'lastly' (that's *infine*): it means 'at long last'."
    - "*Dopo* as an adverb = afterwards; *poi* = then. Both work in a sequence."
    - "Spanish speakers: *de repente* → *all'improvviso*."
  related: [g.passato-prossimo-vs-imperfetto, g.connectors-basic]
  drills:
    - { es: "Prima abbiamo visitato il Campo, poi abbiamo pranzato.", en: "First we visited the Campo, then we had lunch." }
    - { es: "All'improvviso ha cominciato a nevicare.", en: "Suddenly it started to snow." }
    - { es: "Alla fine abbiamo deciso di restare.", en: "In the end we decided to stay." }
    - { es: "Nel frattempo Marco preparava la cena.", en: "Meanwhile Marco was making dinner." }
- id: g.stare-gerundio-past
  level: a2
  title: "Stavo facendo — the past progressive"
  summary: "imperfetto of stare + gerund: what was in progress at a moment in the past."
  explanation: |
    | | |
    |---|---|
    | io | **stavo** + gerund |
    | tu | **stavi** |
    | lui / lei | **stava** |
    | noi | **stavamo** |
    | voi | **stavate** |
    | loro | **stavano** |

    - *Stavo uscendo quando hai chiamato.* — I was going out when you called.
    - It stresses that the action was **in progress** at that exact moment.
    - The plain imperfetto is also correct: *Uscivo quando hai chiamato.*
    - Only with the imperfetto of *stare*: *sono stato facendo* does not exist.
  examples:
    - { es: "Che cosa stavi facendo alle otto?", en: "What were you doing at eight?" }
    - { es: "Stavamo cenando quando è arrivato il pacco.", en: "We were having dinner when the parcel arrived." }
    - { es: "Stava piovendo, così siamo rimasti dentro.", en: "It was raining, so we stayed in." }
  pitfalls:
    - "Never *sono stato mangiando*: use *stavo mangiando*."
    - "Not for habits: *Da piccolo giocavo a calcio*, not *stavo giocando*."
    - "Spanish speakers: *estaba comiendo* → *stavo mangiando*: same structure."
  related: [g.stare-gerundio, g.mentre-quando, g.imperfetto-uses]
  drills:
    - { es: "Stavo dormendo, scusa!", en: "I was asleep, sorry!" }
    - { es: "Stavano parlando di te.", en: "They were talking about you." }
    - { es: "Stavo per chiamarti, ma stavi già arrivando.", en: "I was about to call you, but you were already on your way." }
- id: g.direct-object-pronouns
  level: a2
  title: "Direct object pronouns: mi, ti, lo, la, ci, vi, li, le"
  summary: "Replace the direct object; they go before the conjugated verb or attach to an infinitive."
  explanation: |
    | | singular | plural |
    |---|---|---|
    | 1st | *mi* (me) | *ci* (us) |
    | 2nd | *ti* (you) | *vi* (you all) |
    | 3rd masculine | *lo* (him, it) | *li* (them) |
    | 3rd feminine | *la* (her, it) | *le* (them) |
    | formal | *La* (you) | — |

    ### Position
    - Before the conjugated verb: *Lo vedo domani. Non la conosco.*
    - Attached to an infinitive: *Voglio vederlo* = *Lo voglio vedere* (with modals both are fine).
    - Attached to *ecco*: *Eccolo! Eccoci!*

    ### Elision
    *Lo* and *la* usually become *l'* before a vowel or h: *L'ho visto. L'aspetto.* *Li* and *le* never elide.

    ### Formal La
    *La ringrazio* (I thank you), *La chiamo domani* — to a man or a woman.
  examples:
    - { es: "Conosci Sara? Sì, la conosco bene.", en: "Do you know Sara? Yes, I know her well." }
    - { es: "Il biglietto? Lo compro alla stazione.", en: "The ticket? I'll buy it at the station." }
    - { es: "Ti chiamo stasera.", en: "I'll call you tonight." }
    - { es: "Signora, La aspettiamo alle otto.", en: "Madam, we'll expect you at eight." }
  pitfalls:
    - "*Li* and *le* never take an apostrophe: *li ho visti*, not *l'ho visti*."
    - "Don't attach to a conjugated verb: *lo vedo*, not *vedolo*."
    - "Spanish speakers: *los, las* → *li, le*; *nos, os* → *ci, vi*."
  related: [g.lo-prendo, g.indirect-object-pronouns, g.pronoun-participle-agreement]
  drills:
    - { es: "Mi accompagni alla stazione?", en: "Will you take me to the station?" }
    - { es: "Le chiavi? Non le trovo.", en: "The keys? I can't find them." }
    - { es: "Posso aiutarvi?", en: "Can I help you?" }
    - { es: "I tuoi amici? Li vedo sabato.", en: "Your friends? I'm seeing them on Saturday." }
- id: g.indirect-object-pronouns
  level: a2
  title: "Indirect object pronouns: mi, ti, gli, le, ci, vi, gli"
  summary: "'to me, to him, to her': Gli scrivo, Le telefono, Mi dai una mano?"
  explanation: |
    | | singular | plural |
    |---|---|---|
    | 1st | *mi* (to me) | *ci* (to us) |
    | 2nd | *ti* (to you) | *vi* (to you all) |
    | 3rd | *gli* (to him), *le* (to her) | *gli* (to them) |
    | formal | *Le* (to you) | — |

    Use them with verbs that take *a* + person: *dare, dire, scrivere, telefonare, mandare, regalare, chiedere, rispondere, piacere, sembrare, interessare*.
    - *Scrivo a Marco → Gli scrivo.*
    - *Telefono a Giulia → Le telefono.*
    - *Rispondo ai clienti → Gli rispondo* (colloquial and standard; formal *Rispondo loro*).

    Same position rules as direct pronouns: before the verb, or attached to an infinitive (*Devo telefonargli*).

    ### Telefonare, chiedere, rispondere
    In Italian these take an indirect object: *Le telefono* (I phone her), not *la telefono*.
  examples:
    - { es: "Che cosa regali a tua madre? Le regalo un libro.", en: "What are you giving your mother? I'm giving her a book." }
    - { es: "Gli ho detto di venire alle otto.", en: "I told him to come at eight." }
    - { es: "Ti mando una foto della Torre.", en: "I'll send you a photo of the Tower." }
    - { es: "Le posso offrire un caffè, signora?", en: "May I offer you a coffee, madam?" }
  pitfalls:
    - "*Gli* = to him, *le* = to her: *le telefono* (her), *gli telefono* (him)."
    - "*Telefonare a* takes an indirect pronoun: *Le telefono*, not *La telefono*."
    - "Spanish speakers: Spanish *le* covers him and her; Italian splits it into *gli* and *le*."
  related: [g.direct-object-pronouns, g.combined-pronouns, g.piacere-intro]
  drills:
    - { es: "Mi presti la tua bici?", en: "Will you lend me your bike?" }
    - { es: "Gli scrivo un messaggio.", en: "I'll write him a message." }
    - { es: "Ci hanno mandato una cartolina da Lucca.", en: "They sent us a postcard from Lucca." }
    - { es: "Le chiedo scusa.", en: "I apologise to you. (formal)" }
- id: g.pronoun-participle-agreement
  level: a2
  title: "L'ho vista, li ho comprati — agreement with direct pronouns"
  summary: "With avere, the participle agrees with a preceding lo, la, li, le."
  explanation: |
    Normally the participle after *avere* does not change. But when a **direct object pronoun** *lo, la, li, le* comes before the verb, the participle **must agree** with it:

    | pronoun | example |
    |---|---|
    | lo | *Il film? L'ho visto.* |
    | la | *La torta? L'ho mangiata.* |
    | li | *I biglietti? Li ho comprati.* |
    | le | *Le chiavi? Le ho perse.* |

    - With *mi, ti, ci, vi* agreement is optional: *Ci ha visto / visti.*
    - With **indirect** pronouns there is no agreement: *Le ho telefonato* (to her) — no *-a*.
    - *L'* can stand for *lo* or *la*: the participle shows which: *l'ho visto* (him/it m.) vs *l'ho vista* (her/it f.).
  examples:
    - { es: "Hai visto Giulia? Sì, l'ho vista ieri.", en: "Have you seen Giulia? Yes, I saw her yesterday." }
    - { es: "Dove sono le foto? Le ho messe nel cassetto.", en: "Where are the photos? I put them in the drawer." }
    - { es: "Gli spaghetti li ho cucinati io.", en: "I cooked the spaghetti." }
    - { es: "Le ho scritto una lettera.", en: "I wrote her a letter. (no agreement)" }
  pitfalls:
    - "*Le ho comprate* (them, f.) vs *le ho comprato un regalo* (to her): agreement only with the direct pronoun."
    - "Don't forget the agreement in writing: *li ho visti*, not *li ho visto*."
    - "Spanish speakers: Spanish never agrees here (*las he comprado*); Italian does."
  related: [g.direct-object-pronouns, g.passato-prossimo-avere, g.ne-participle-agreement]
  drills:
    - { es: "La lettera? L'ho spedita stamattina.", en: "The letter? I posted it this morning." }
    - { es: "I tuoi genitori? Li ho incontrati al mercato.", en: "Your parents? I met them at the market." }
    - { es: "Le mele le ho comprate a Pistoia.", en: "I bought the apples in Pistoia." }
    - { es: "Il conto? L'abbiamo già pagato.", en: "The bill? We've already paid it." }
- id: g.stressed-pronouns
  level: a2
  title: "Stressed pronouns: me, te, lui, lei, noi, voi, loro"
  summary: "After prepositions and for emphasis: con me, per te, a lui, da noi; Chiamo te, non lui."
  explanation: |
    | unstressed | stressed |
    |---|---|
    | mi, ti | **me, te** |
    | lo / gli, la / le | **lui, lei** (formal **Lei**) |
    | ci, vi | **noi, voi** |
    | li, le / gli | **loro** |
    | si | **sé** (oneself) |

    ### Uses
    - **After prepositions**: *con me, per te, da lui, senza di loro, tra noi*.
    - **Emphasis or contrast** instead of the normal pronoun: *Cerco te, non lui. A me piace, a lei no.*
    - **Alone**: *Chi viene? — Io. — Chi hai visto? — Te.*
    - *Da me / da te* = at my / your place: *Ci vediamo da me?*
    - Some prepositions take *di* before a pronoun: *senza di te, dopo di me, contro di noi, secondo me* (no di).
  examples:
    - { es: "Vieni al cinema con me?", en: "Are you coming to the cinema with me?" }
    - { es: "Questo regalo è per te.", en: "This present is for you." }
    - { es: "Stasera cena da noi!", en: "Dinner at our place tonight!" }
    - { es: "Non posso vivere senza di te.", en: "I can't live without you." }
  pitfalls:
    - "After a preposition use *me, te*, not *mi, ti*: *con me*, never *con mi*."
    - "Don't double them: *a me piace* or *mi piace*, not *a me mi piace* in standard Italian."
    - "Spanish speakers: *conmigo, contigo* → *con me, con te*."
  related: [g.direct-object-pronouns, g.piacere-plural]
  drills:
    - { es: "Secondo me hai ragione.", en: "In my opinion you're right." }
    - { es: "Abita vicino a noi.", en: "She lives near us." }
    - { es: "Ho chiamato te, non tua sorella.", en: "I called you, not your sister." }
    - { es: "Parlano sempre di lui.", en: "They're always talking about him." }
- id: g.futuro-semplice
  level: a2
  title: "The future tense: parlerò, prenderò, dormirò"
  summary: "Drop the final -e of the infinitive (-are → -er-) and add -ò, -ai, -à, -emo, -ete, -anno."
  explanation: |
    | | parlare | prendere | partire |
    |---|---|---|---|
    | io | parler**ò** | prender**ò** | partir**ò** |
    | tu | parler**ai** | prender**ai** | partir**ai** |
    | lui / lei | parler**à** | prender**à** | partir**à** |
    | noi | parler**emo** | prender**emo** | partir**emo** |
    | voi | parler**ete** | prender**ete** | partir**ete** |
    | loro | parler**anno** | prender**anno** | partir**anno** |

    - **-are verbs change a → e**: *parlare → parlerò, comprare → comprerò*.
    - Spelling: *-care, -gare* add h: *cercherò, pagherò*; *-ciare, -giare* drop the i: *comincerò, mangerò*.
    - Accents on *-ò* and *-à* are compulsory.

    ### Uses
    - Predictions and promises: *Domani pioverà. Ti chiamerò.*
    - Plans further ahead: *L'anno prossimo andrò in Toscana.*
    - For close, fixed plans the present is more common: *Domani parto.*
  examples:
    - { es: "L'estate prossima visiteremo Pisa e Lucca.", en: "Next summer we'll visit Pisa and Lucca." }
    - { es: "Domani pioverà su tutta la Toscana.", en: "Tomorrow it will rain all over Tuscany." }
    - { es: "Ti scriverò ogni giorno, promesso!", en: "I'll write to you every day, I promise!" }
    - { es: "A che ora arriverete?", en: "What time will you arrive?" }
  pitfalls:
    - "*Parlerò*, not *parlarò*: -are verbs switch to *-er-*."
    - "*Mangerò*, not *mangierò*; *cercherò*, not *cercerò*."
    - "After *quando* and *appena* about the future, Italian uses the future: *Quando arriverò, ti chiamerò* (English uses the present)."
  related: [g.futuro-irregular, g.present-for-future, g.futuro-probability]
  drills:
    - { es: "Quando finirai l'università?", en: "When will you finish university?" }
    - { es: "Pagherò io questa volta.", en: "I'll pay this time." }
    - { es: "Comincerete il corso a ottobre.", en: "You'll start the course in October." }
    - { es: "Quando arriverò a Firenze, ti telefonerò.", en: "When I get to Florence, I'll phone you." }
- id: g.futuro-irregular
  level: a2
  title: "Irregular futures: sarò, avrò, andrò, farò, verrò…"
  summary: "Some verbs contract the stem (andrò, potrò, vedrò) or change it (sarò, verrò, berrò)."
  explanation: |
    The **endings** are always regular (*-ò, -ai, -à, -emo, -ete, -anno*); only the stem changes.

    | type | verbs |
    |---|---|
    | essere | **sar-**: *sarò, sarai, sarà…* |
    | short -are verbs | *fare → farò, dare → darò, stare → starò* (no a → e change) |
    | lose a vowel | *andare → andrò, avere → avrò, dovere → dovrò, potere → potrò, sapere → saprò, vedere → vedrò, vivere → vivrò* |
    | double r | *venire → verrò, volere → vorrò, bere → berrò, rimanere → rimarrò, tenere → terrò* |

    The conditional uses **the same stems**, so learning them now pays off twice: *sarei, avrei, andrei, verrei*.
  examples:
    - { es: "Sarò a Siena per il Palio.", en: "I'll be in Siena for the Palio." }
    - { es: "Che cosa farai dopo la laurea?", en: "What will you do after graduating?" }
    - { es: "Verremo a trovarti a Pisa.", en: "We'll come and see you in Pisa." }
    - { es: "Non potrò venire, avrò troppo lavoro.", en: "I won't be able to come, I'll have too much work." }
  pitfalls:
    - "*Andrò*, not *anderò*; *vedrò*, not *vederò*."
    - "*Verrò, vorrò, berrò, rimarrò* have a double r."
    - "*Farò, darò, starò* keep the -a-: not *ferò*."
  related: [g.futuro-semplice, g.condizionale-presente]
  drills:
    - { es: "Domani avremo più tempo.", en: "Tomorrow we'll have more time." }
    - { es: "Rimarrete a cena?", en: "Will you stay for dinner?" }
    - { es: "Saprò qualcosa domani.", en: "I'll know something tomorrow." }
    - { es: "Berremo un buon vino.", en: "We'll drink a good wine." }
- id: g.futuro-probability
  level: a2
  title: "Sarà vero? — the future for guesses"
  summary: "The future expresses a guess about the present: Che ore saranno? Saranno le tre."
  explanation: |
    Italian often uses the future to **speculate about now**, where English says 'must be', 'probably' or 'I wonder':

    | Italian | English |
    |---|---|
    | *Che ore saranno?* | I wonder what time it is. |
    | *Saranno le tre.* | It must be about three. |
    | *Dov'è Luca? — Sarà ancora al lavoro.* | He's probably still at work. |
    | *Avrà trent'anni.* | She must be about thirty. |
    | *Sarà, ma non ci credo.* | That may be, but I don't believe it. |

    *Sarà!* on its own is a sceptical 'If you say so!'
  examples:
    - { es: "Chi sarà a quest'ora?", en: "Who can that be at this time?" }
    - { es: "Non risponde, sarà sotto la doccia.", en: "She's not answering, she must be in the shower." }
    - { es: "Quanto costerà quella villa?", en: "I wonder how much that villa costs." }
    - { es: "Saranno stanchi dopo il viaggio.", en: "They must be tired after the journey." }
  pitfalls:
    - "*Sarà a casa* can mean 'he will be at home' or 'he's probably at home': context decides."
    - "Don't overuse *forse* + present when the future is more natural: *Avrà fame* (he must be hungry)."
    - "Spanish speakers: the same use exists in Spanish (*¿Qué hora será?*), so it transfers directly."
  related: [g.futuro-semplice, g.futuro-anteriore]
  drills:
    - { es: "Che ore saranno? Saranno le undici.", en: "What time can it be? It must be about eleven." }
    - { es: "Marco non è venuto, sarà malato.", en: "Marco didn't come, he must be ill." }
    - { es: "Questo palazzo avrà cinquecento anni.", en: "This building must be about five hundred years old." }
- id: g.periodo-ipotetico-1
  level: a2
  title: "Se piove, restiamo a casa — real conditions"
  summary: "se + present or future, then present, future or imperative: things that are possible and likely."
  explanation: |
    The first type of *periodo ipotetico* talks about **real, likely** conditions:

    | if-clause (*se*) | result |
    |---|---|
    | *Se piove,* | *restiamo a casa.* (present) |
    | *Se pioverà,* | *resteremo a casa.* (future) |
    | *Se hai tempo,* | *chiamami!* (imperative) |

    - Present + present is the most common in speech.
    - Using the future in **both** halves is correct and typical of careful Italian, where English uses the present after 'if'.
    - Don't mix in the conditional here: that is for unlikely conditions (B2: *Se avessi tempo, verrei*).
  examples:
    - { es: "Se fa bel tempo, andiamo a Viareggio.", en: "If the weather's nice, we'll go to Viareggio." }
    - { es: "Se arriverai presto, visiteremo il Duomo insieme.", en: "If you arrive early, we'll visit the cathedral together." }
    - { es: "Se hai fame, mangia qualcosa!", en: "If you're hungry, eat something!" }
    - { es: "Se non studi, non passi l'esame.", en: "If you don't study, you won't pass the exam." }
  pitfalls:
    - "Never the conditional after *se* for real conditions: *se ho tempo*, not *se avrei tempo*."
    - "If one half is future, the other usually is too: *se verrai, ti divertirai*."
    - "*Se* (if) has no accent; *sé* (oneself) does."
  related: [g.futuro-semplice, g.periodo-ipotetico-2]
  drills:
    - { es: "Se vuoi, ti accompagno.", en: "If you like, I'll go with you." }
    - { es: "Se perdiamo il treno, prenderemo l'autobus.", en: "If we miss the train, we'll take the bus." }
    - { es: "Se vedi Laura, salutala da parte mia.", en: "If you see Laura, say hi from me." }
- id: g.comparatives
  level: a2
  title: "Comparatives: più… di, meno… di, così… come"
  summary: "più / meno + adjective + di (before nouns and pronouns) or che (before other words)."
  explanation: |
    ### More / less than
    - **più / meno … di** before a noun, name or pronoun: *Firenze è più grande di Siena. Sei più alto di me.*
    - **più / meno … che** when comparing two adjectives, verbs, adverbs, or nouns after a preposition:
      - *È più bella che intelligente.*
      - *Mi piace più leggere che guardare la TV.*
      - *Fa più caldo a Firenze che a Pisa.*
      - quantities of two nouns: *Ci sono più turisti che abitanti.*

    ### As … as
    *(così) … come* or *(tanto) … quanto*: *Pisa è (così) bella come Lucca. Lavoro tanto quanto te.*

    *Di* fuses with articles: *più alto del fratello, più vecchia della sorella.*
  examples:
    - { es: "Siena è più piccola di Firenze.", en: "Siena is smaller than Florence." }
    - { es: "Il treno è meno caro dell'aereo.", en: "The train is cheaper than the plane." }
    - { es: "È più facile dire che fare.", en: "It's easier said than done." }
    - { es: "Mio fratello è alto come me.", en: "My brother is as tall as me." }
  pitfalls:
    - "Before a noun or pronoun use *di*: *più alto di me*, not *più alto che me*."
    - "Before an adjective, verb or prepositional phrase use *che*: *più a Roma che a Milano*."
    - "Spanish speakers: *más… que* splits into *più… di* and *più… che*."
  related: [g.superlatives, g.comparatives-irregular]
  drills:
    - { es: "Lucca è più tranquilla di Pisa.", en: "Lucca is quieter than Pisa." }
    - { es: "Leggo più libri che giornali.", en: "I read more books than newspapers." }
    - { es: "Questo vino è buono quanto quello.", en: "This wine is as good as that one." }
    - { es: "Oggi fa meno freddo di ieri.", en: "Today it's less cold than yesterday." }
- id: g.superlatives
  level: a2
  title: "Superlatives: il più bello, bellissimo"
  summary: "Relative: il/la più … di; absolute: -issimo (very, extremely)."
  explanation: |
    ### Relative superlative (the most / the least)
    article + (noun) + *più / meno* + adjective + *di*:
    - *Il Duomo è il monumento più famoso di Firenze.*
    - *È la città più bella del mondo.*
    - *Sei il meno stanco di tutti.*

    ### Absolute superlative (extremely)
    Drop the final vowel and add **-issimo**, which agrees:
    - *bello → bellissimo/a/i/e, buono → buonissimo, facile → facilissimo, ricco → ricchissimo*
    - With adverbs: *benissimo, malissimo, prestissimo*.
    - Alternatives: *molto bello, super bello* (colloquial), *bello bello* (repetition).
  examples:
    - { es: "Questa è la gelateria più buona di Firenze.", en: "This is the best ice-cream shop in Florence." }
    - { es: "Il Palio è una festa antichissima.", en: "The Palio is a very ancient festival." }
    - { es: "Sto benissimo, grazie!", en: "I'm really well, thanks!" }
    - { es: "È il ragazzo più simpatico della classe.", en: "He's the nicest boy in the class." }
  pitfalls:
    - "'In the world, in the class' uses *di*: *il più alto della classe*, not *in la classe*."
    - "Don't repeat the article: *la città più bella*, not *la città la più bella*."
    - "Plurals with h: *ricchissimi, lunghissimo*."
  related: [g.comparatives, g.comparatives-irregular]
  drills:
    - { es: "È il giorno più bello della mia vita.", en: "It's the best day of my life." }
    - { es: "La pizza era buonissima.", en: "The pizza was really good." }
    - { es: "Questa è la strada meno trafficata.", en: "This is the least busy road." }
    - { es: "Sono stanchissima.", en: "I'm exhausted." }
- id: g.comparatives-irregular
  level: a2
  title: "Migliore, meglio, peggiore, peggio — irregular comparatives"
  summary: "buono → migliore (better, adj.), bene → meglio (better, adv.); ottimo, pessimo; maggiore, minore."
  explanation: |
    | base | comparative | relative superlative | absolute |
    |---|---|---|---|
    | *buono* (good) | **migliore** | *il migliore* | *ottimo / buonissimo* |
    | *cattivo* (bad) | **peggiore** | *il peggiore* | *pessimo / cattivissimo* |
    | *grande* (big; older) | **maggiore** / più grande | *il maggiore* | *massimo* |
    | *piccolo* (small; younger) | **minore** / più piccolo | *il minore* | *minimo* |
    | *bene* (well) | **meglio** | *il meglio* | *benissimo* |
    | *male* (badly) | **peggio** | *il peggio* | *malissimo* |

    ### migliore or meglio?
    - **Migliore** is an adjective — it describes a noun and agrees: *un vino migliore, le migliori pizze*.
    - **Meglio** is an adverb — it goes with verbs, and after *essere* meaning 'it's better to': *Canti meglio di me. È meglio partire presto.*

    *Più buono* and *più cattivo* also exist, especially for taste and character.
  examples:
    - { es: "Questo ristorante è migliore di quello.", en: "This restaurant is better than that one." }
    - { es: "Oggi sto meglio, grazie.", en: "I'm better today, thanks." }
    - { es: "Mia sorella maggiore abita a Pisa.", en: "My older sister lives in Pisa." }
    - { es: "Il vino era ottimo.", en: "The wine was excellent." }
  pitfalls:
    - "Never *più migliore* or *più meglio*: they are already comparatives."
    - "*Sto meglio* (adverb), not *sto migliore*."
    - "Spanish speakers: *mejor* splits into *migliore* (adj.) and *meglio* (adv.)."
  related: [g.comparatives, g.superlatives]
  drills:
    - { es: "È meglio prenotare.", en: "It's better to book." }
    - { es: "È il peggior film dell'anno.", en: "It's the worst film of the year." }
    - { es: "Il mio fratello minore studia a Siena.", en: "My younger brother studies in Siena." }
    - { es: "Parli italiano meglio di me!", en: "You speak Italian better than me!" }
- id: g.opinions
  level: a2
  title: "Giving opinions: secondo me, per me, penso di sì"
  summary: "secondo me, per me, a mio parere, penso di sì / di no, sono d'accordo, hai ragione."
  explanation: |
    ### Giving your opinion
    - *Secondo me* / *Per me* + indicative: *Secondo me è troppo caro.*
    - *A mio parere* (in my view — a bit more formal)
    - *Penso di sì / di no* — I think so / I don't think so.
    - *Penso che* / *credo che* + a clause take the congiuntivo (B1); at A2 prefer *secondo me*.

    ### Agreeing and disagreeing
    | agree | disagree |
    |---|---|
    | *Sono d'accordo (con te).* | *Non sono d'accordo.* |
    | *Hai ragione.* | *Hai torto. / Non è vero.* |
    | *Anche secondo me.* | *Secondo me no.* |
    | *Esatto! / Appunto!* | *Dipende.* (It depends) |

    ### Asking
    *Che ne pensi? Che ne dici? Secondo te…?*
  examples:
    - { es: "Secondo me Siena è più bella di Firenze.", en: "In my opinion Siena is more beautiful than Florence." }
    - { es: "Che ne pensi di questo vino?", en: "What do you think of this wine?" }
    - { es: "Pioverà domani? Penso di no.", en: "Will it rain tomorrow? I don't think so." }
    - { es: "Non sono d'accordo con te.", en: "I don't agree with you." }
  pitfalls:
    - "*Sono d'accordo*, not *ho d'accordo* or *sono accordo*."
    - "*Penso di sì*, not *penso che sì* (Spanish *creo que sí*)."
    - "*Avere ragione* uses *avere*: *hai ragione*, not *sei ragione*."
  related: [g.congiuntivo-opinion, g.comparatives]
  drills:
    - { es: "Per me è meglio partire domani.", en: "For me it's better to leave tomorrow." }
    - { es: "Secondo te, qual è il più buono?", en: "Which one do you think is the best?" }
    - { es: "Hai ragione, è troppo tardi.", en: "You're right, it's too late." }
    - { es: "Dipende dal tempo.", en: "It depends on the weather." }
- id: g.ci-place
  level: a2
  title: "Ci = there: Ci vado domani"
  summary: "ci replaces a place introduced by a, in, da, su: Vai a Pisa? Sì, ci vado."
  explanation: |
    *Ci* replaces a phrase of **place**, usually with *a, in, da, su*:
    - *Vai a Siena? — Sì, ci vado sabato.*
    - *Sei mai stato in Toscana? — Sì, ci sono stato tre volte.*
    - *Torni dal medico? — Ci torno domani.*

    ### Position
    Like other pronouns: before the conjugated verb, attached to an infinitive (*Voglio andarci*), before *è / sono* (*c'è, ci sono*).
    Before *e, i* it often becomes *c'*: *c'è, c'era, c'entra*.

    ### Ci with other verbs
    *Ci* also replaces *a* + thing with verbs like *pensare a, credere a, riuscire a*:
    - *Pensi all'esame? — Sì, ci penso sempre.*
    - *Non ci credo!* (I don't believe it!)
    - *Ci riesci?* (Can you manage it?)
  examples:
    - { es: "Conosci San Gimignano? Sì, ci sono andata l'anno scorso.", en: "Do you know San Gimignano? Yes, I went there last year." }
    - { es: "Vieni al mare? No, ci vado domani.", en: "Are you coming to the beach? No, I'm going tomorrow." }
    - { es: "Non ci credo!", en: "I don't believe it!" }
    - { es: "Ci penso io.", en: "I'll take care of it." }
  pitfalls:
    - "Don't leave out *ci* where English drops 'there': *Ci vado domani*, not just *vado domani* in answer to 'Are you going to Pisa?'."
    - "*Ci* is also 'us' and 'ourselves': *Ci vediamo* (see each other), *ci vado* (go there) — context tells."
    - "*Pensare a* (think about) → *ci penso*; *pensare di* (have an opinion) → *ne penso* (B1)."
  related: [g.c-e-ci-sono, g.ne-partitive, g.metterci-volerci]
  drills:
    - { es: "Quando vai a Lucca? Ci vado domenica.", en: "When are you going to Lucca? I'm going on Sunday." }
    - { es: "Abiti ancora a Pisa? Sì, ci abito da dieci anni.", en: "Do you still live in Pisa? Yes, I've lived there for ten years." }
    - { es: "Non ci riesco!", en: "I can't do it!" }
    - { es: "Devo tornarci un giorno.", en: "I must go back there one day." }
- id: g.ne-partitive
  level: a2
  title: "Ne = of it, of them: Ne vorrei due"
  summary: "ne replaces a quantity or a phrase with di: Quante mele vuoi? Ne voglio tre."
  explanation: |
    *Ne* replaces a noun when you mention a **quantity** of it:
    - *Quanti fratelli hai? — **Ne** ho due.* (I have two of them.)
    - *Vuoi del vino? — Sì, **ne** prendo un bicchiere.*
    - *Hai delle sigarette? — No, non **ne** ho.* (I don't have any.)

    The quantity stays in the sentence: *ne ho due / molti / un po' / un chilo / nessuno*.
    If you take **all** of it, use *lo, la, li, le*: *Le mele? Le prendo tutte.*

    ### Ne with di
    *Ne* also replaces *di* + something with verbs like *parlare di, avere bisogno di, avere voglia di*:
    - *Parliamo del viaggio? — Ne parliamo domani.*
    - *Hai bisogno della macchina? — Sì, ne ho bisogno.*

    Position: like other pronouns. Before a vowel: *n'*: *Ce n'è uno.*
  examples:
    - { es: "Quanti biglietti vuoi? Ne vorrei due.", en: "How many tickets do you want? I'd like two." }
    - { es: "Ho comprato dei cantucci, ne vuoi uno?", en: "I bought some cantucci, do you want one?" }
    - { es: "Non ne ho idea.", en: "I have no idea (about it)." }
    - { es: "Ne parliamo stasera.", en: "We'll talk about it tonight." }
  pitfalls:
    - "Don't drop *ne* with a number: *ne ho tre*, not *ho tre* (in answer to 'how many?')."
    - "Don't use *ne* with *tutti*: *li ho mangiati tutti*, not *ne ho mangiati tutti*."
    - "Spanish has no equivalent: *tengo dos* becomes *ne ho due*."
  related: [g.partitive-di, g.ne-participle-agreement, g.ci-place]
  drills:
    - { es: "Quanti anni hai? Ne ho trentadue.", en: "How old are you? I'm thirty-two." }
    - { es: "Vuole del pecorino? Sì, ne prendo due etti.", en: "Would you like some pecorino? Yes, I'll have 200 grams." }
    - { es: "Di questo problema ne parlo con il capo.", en: "I'll talk to the boss about this problem." }
    - { es: "Non ne ho voglia.", en: "I don't feel like it." }
- id: g.ne-participle-agreement
  level: a2
  title: "Ne ho mangiate tre — ne in the passato prossimo"
  summary: "With ne the participle agrees with the noun ne stands for."
  explanation: |
    When *ne* comes before a compound tense, the participle **agrees in gender and number** with the thing counted:
    - *Quante pizze avete mangiato? — Ne abbiamo mangiat**e** quattro.*
    - *Quanti musei hai visto? — Ne ho vist**i** tre.*
    - *Quanto vino hai bevuto? — Ne ho bevut**o** troppo.*
    - *Quanta pasta hai comprato? — Ne ho comprat**a** un chilo.*

    With **one** item, the participle is singular: *Di cartoline, ne ho scritta una.*

    This mirrors the agreement with *lo, la, li, le* (*le ho mangiate*).
  examples:
    - { es: "Quante foto hai fatto? Ne ho fatte cento!", en: "How many photos did you take? I took a hundred!" }
    - { es: "Di libri ne ho letti tanti quest'anno.", en: "I've read lots of books this year." }
    - { es: "Quanti caffè hai preso? Ne ho presi tre.", en: "How many coffees did you have? I had three." }
  pitfalls:
    - "*Ne ho comprate due* (two f.), not *ne ho comprato due* in careful Italian."
    - "In speech the agreement is sometimes dropped, but write it."
    - "With *non… nessuno* the participle is singular: *non ne ho visto nessuno*."
  related: [g.ne-partitive, g.pronoun-participle-agreement]
  drills:
    - { es: "Quante cartoline hai scritto? Ne ho scritte cinque.", en: "How many postcards did you write? I wrote five." }
    - { es: "Abbiamo assaggiato dei vini e ne abbiamo comprati due.", en: "We tasted some wines and bought two." }
    - { es: "Di chiese ne abbiamo visitate moltissime.", en: "We visited loads of churches." }
- id: g.metterci-volerci
  level: a2
  title: "Ci vuole, ci metto — how long it takes"
  summary: "volerci (impersonal: ci vuole un'ora); metterci (personal: ci metto un'ora)."
  explanation: |
    ### volerci — 'it takes' (impersonal)
    The thing needed is the subject: *ci vuole* + singular, *ci vogliono* + plural.
    - *Ci vuole un'ora da Firenze a Siena.*
    - *Ci vogliono tre uova per questa torta.*
    - Past: *Ci è voluta un'ora. Ci sono voluti due giorni.*

    ### metterci — 'it takes me / you…' (personal)
    The person is the subject: *ci metto, ci metti, ci mette…*
    - *Quanto ci metti per andare al lavoro? — Ci metto venti minuti.*
    - Past with *avere*: *Ci ho messo due ore.*

    | | |
    |---|---|
    | *Ci vuole mezz'ora.* | It takes half an hour (in general). |
    | *Ci metto mezz'ora.* | It takes me half an hour. |
  examples:
    - { es: "Quanto ci vuole da Pisa a Lucca in treno?", en: "How long does it take from Pisa to Lucca by train?" }
    - { es: "Ci vogliono pazienza e tempo.", en: "It takes patience and time." }
    - { es: "Ci ho messo tre ore a trovare parcheggio!", en: "It took me three hours to find a parking space!" }
    - { es: "Quanto ci mettete a prepararvi?", en: "How long do you take to get ready?" }
  pitfalls:
    - "Plural needs *ci vogliono*: *ci vogliono due ore*, not *ci vuole due ore*."
    - "*Volerci* takes *essere* in the past (*ci è voluto*), *metterci* takes *avere* (*ci ho messo*)."
    - "Spanish speakers: *se tarda / tardo una hora* → *ci vuole / ci metto un'ora*."
  related: [g.ci-place, g.bisogna-avere-bisogno]
  drills:
    - { es: "Ci vuole poco a fare la panzanella.", en: "It doesn't take long to make panzanella." }
    - { es: "Ci sono volute due settimane.", en: "It took two weeks." }
    - { es: "Ci metto sempre troppo a decidere.", en: "I always take too long to decide." }
- id: g.imperativo-tu
  level: a2
  title: "The imperative with tu: parla! prendi! senti!"
  summary: "-are verbs end in -a, -ere and -ire verbs in -i; a few short irregular forms."
  explanation: |
    | | -are | -ere | -ire | -ire (isc) |
    |---|---|---|---|---|
    | tu | parl**a**! | prend**i**! | sent**i**! | fin**isci**! |

    Note: the -are form is the same as the *lui* present (*parla*); -ere/-ire the same as the *tu* present (*prendi*).

    ### Irregular tu forms
    | verb | imperative |
    |---|---|
    | *essere* | **sii** |
    | *avere* | **abbi** |
    | *andare* | **va'** / vai |
    | *fare* | **fa'** / fai |
    | *dare* | **da'** / dai |
    | *stare* | **sta'** / stai |
    | *dire* | **di'** |
    | *sapere* | **sappi** |

    ### Everyday uses
    Recipes (often with *tu* or infinitive), advice, invitations: *Assaggia! Vieni qui! Scusa! Guarda! Senti!* (Listen! / Hey!)
  examples:
    - { es: "Mescola bene e aggiungi il sale.", en: "Stir well and add the salt." }
    - { es: "Vieni a cena da noi stasera!", en: "Come to dinner at ours tonight!" }
    - { es: "Sii gentile con tua sorella.", en: "Be nice to your sister." }
    - { es: "Senti, hai un minuto?", en: "Listen, have you got a minute?" }
  pitfalls:
    - "-are verbs end in *-a*: *parla!*, not *parli!* (that's the Lei form)."
    - "*Sii* and *abbi* are irregular: not *sei paziente!* but *sii paziente!*"
    - "Spanish speakers: *ven* → *vieni*, *haz* → *fa'*, *di* → *di'*, *ve* → *va'*."
  related: [g.imperativo-lei, g.imperativo-negative, g.imperative-directions]
  drills:
    - { es: "Taglia le cipolle a fettine.", en: "Slice the onions thinly." }
    - { es: "Apri la finestra, per favore.", en: "Open the window, please." }
    - { es: "Abbi pazienza!", en: "Be patient!" }
    - { es: "Fa' presto!", en: "Hurry up!" }
- id: g.imperativo-lei
  level: a2
  title: "The formal imperative with Lei: prenda! scusi! venga!"
  summary: "-are verbs end in -i, -ere/-ire in -a; irregular verbs use the io-stem: venga, faccia, vada."
  explanation: |
    The *Lei* imperative swaps the vowels of the present:

    | | -are | -ere | -ire | -ire (isc) |
    |---|---|---|---|---|
    | Lei | parl**i** | prend**a** | sent**a** | fin**isca** |

    ### Irregular verbs: take the io form, change -o to -a
    | io present | Lei imperative |
    |---|---|
    | *vengo* | **venga** |
    | *faccio* | **faccia** |
    | *vado* | **vada** |
    | *dico* | **dica** |
    | *esco* | **esca** |
    | *bevo* | **beva** |

    Plus: *essere → sia, avere → abbia, dare → dia, stare → stia, sapere → sappia*.

    ### Very common
    *Scusi! Senta! Prego, si accomodi. Mi dica! Venga pure! Prenda pure!* (*pure* softens: 'go ahead').
  examples:
    - { es: "Scusi, mi può aiutare?", en: "Excuse me, can you help me?" }
    - { es: "Prego, si accomodi.", en: "Please, take a seat." }
    - { es: "Prenda la seconda strada a destra.", en: "Take the second street on the right." }
    - { es: "Mi dica, signora.", en: "How can I help you, madam?" }
  pitfalls:
    - "The vowels swap: *parli!* (Lei) vs *parla!* (tu)."
    - "*Venga*, not *vieni*, to someone you call *Lei*."
    - "Spanish speakers: same pattern as *usted* commands: *hable, coma, venga* → *parli, mangi, venga*."
  related: [g.imperativo-tu, g.imperativo-lei-pronouns, g.imperative-directions]
  drills:
    - { es: "Senta, quanto costa questo?", en: "Excuse me, how much is this?" }
    - { es: "Faccia attenzione, il pavimento è bagnato.", en: "Be careful, the floor is wet." }
    - { es: "Abbia pazienza, arrivo subito.", en: "Please be patient, I'll be right there." }
    - { es: "Giri a sinistra e vada sempre dritto.", en: "Turn left and keep going straight." }
- id: g.imperativo-noi-voi
  level: a2
  title: "Imperative with noi and voi: andiamo! venite!"
  summary: "noi and voi imperatives are the same as the present: mangiamo! guardate!"
  explanation: |
    | | parlare | prendere | sentire | finire |
    |---|---|---|---|---|
    | noi | parliamo! | prendiamo! | sentiamo! | finiamo! |
    | voi | parlate! | prendete! | sentite! | finite! |

    - **noi** = 'let's': *Andiamo! Mangiamo qualcosa! Vediamo…* (Let's see…)
    - **voi** = 'you all': *Ragazzi, venite qui! Entrate pure!*
    - Irregular only for *essere* (*siamo, siate*) and *avere* (*abbiamo, abbiate*): *Siate puntuali!*
    - The *loro* polite plural (*vengano, si accomodino*) is rare and very formal.
  examples:
    - { es: "Andiamo a vedere il tramonto!", en: "Let's go and watch the sunset!" }
    - { es: "Ragazzi, fate silenzio!", en: "Guys, be quiet!" }
    - { es: "Siate puntuali domani.", en: "Be on time tomorrow." }
    - { es: "Prendiamo un aperitivo?", en: "Shall we have an aperitivo?" }
  pitfalls:
    - "'Let's' needs no extra verb: *andiamo*, not *lasciamo andare*."
    - "*Siate* and *abbiate* are irregular: *Abbiate pazienza!*"
    - "Spanish speakers: *vamos / vámonos* → *andiamo*; *venid* → *venite*."
  related: [g.imperativo-tu, g.imperativo-negative]
  drills:
    - { es: "Aspettate un momento!", en: "Wait a moment!" }
    - { es: "Ordiniamo una bistecca per due.", en: "Let's order a steak for two." }
    - { es: "Bambini, lavatevi le mani!", en: "Children, wash your hands!" }
- id: g.imperativo-negative
  level: a2
  title: "Negative commands: non parlare! non preoccuparti!"
  summary: "tu: non + infinitive; Lei, noi, voi: non + the normal imperative."
  explanation: |
    | | affirmative | negative |
    |---|---|---|
    | tu | *Parla!* | **Non parlare!** (non + infinitive) |
    | Lei | *Parli!* | *Non parli!* |
    | noi | *Parliamo!* | *Non parliamo!* |
    | voi | *Parlate!* | *Non parlate!* |

    Only the **tu** form is special: *non* + infinitive:
    - *Non toccare! Non dimenticare il passaporto! Non fare rumore!*

    ### With pronouns (preview)
    *Non preoccuparti!* or *Non ti preoccupare!* — both correct. More in B1.

    Signs and instructions often use the infinitive for everyone: *Non fumare. Non calpestare l'erba.*
  examples:
    - { es: "Non dimenticare l'ombrello!", en: "Don't forget your umbrella!" }
    - { es: "Non si preoccupi, signora.", en: "Don't worry, madam." }
    - { es: "Non andate via, è presto!", en: "Don't go, it's early!" }
    - { es: "Non toccare, è caldo!", en: "Don't touch, it's hot!" }
  pitfalls:
    - "*Non parla!* is wrong for tu: say *Non parlare!*"
    - "Spanish speakers: *no hables* → *non parlare* (not a subjunctive form)."
    - "*Non preoccuparti* drops the -e of the infinitive before the pronoun."
  related: [g.imperativo-tu, g.imperativo-pronouns]
  drills:
    - { es: "Non mangiare troppo!", en: "Don't eat too much!" }
    - { es: "Non preoccuparti, ci penso io.", en: "Don't worry, I'll take care of it." }
    - { es: "Non attraversi col rosso!", en: "Don't cross on red! (formal)" }
    - { es: "Non arrivate tardi.", en: "Don't arrive late." }
- id: g.da-since
  level: a2
  title: "Da + present: studio italiano da due anni"
  summary: "Italian uses the present + da for actions that started in the past and are still going on."
  explanation: |
    When something **started in the past and continues now**, Italian uses the **present** with *da*:
    - *Abito a Firenze da tre anni.* — I have lived in Florence for three years.
    - *Studio italiano da settembre.* — I've been studying Italian since September.
    - *Da quanto tempo aspetti?* — How long have you been waiting?

    *Da* covers both 'for' (a period) and 'since' (a point in time): *da due ore, dalle due, dal 2020, da quando ero piccolo*.

    ### Finished periods: per
    If the action is over, use the passato prossimo with *per* (or nothing): *Ho abitato a Pisa per due anni.* (I don't live there now.)

    ### Past: imperfetto + da
    *Aspettavo da un'ora quando è arrivato.* — I had been waiting for an hour.
  examples:
    - { es: "Lavoro in questo ristorante da cinque anni.", en: "I've worked in this restaurant for five years." }
    - { es: "Da quanto tempo vi conoscete?", en: "How long have you known each other?" }
    - { es: "Non lo vedo da Natale.", en: "I haven't seen him since Christmas." }
    - { es: "Ho vissuto a Siena per un anno.", en: "I lived in Siena for a year (not any more)." }
  pitfalls:
    - "Don't use the passato prossimo for ongoing time: *abito qui da un anno*, not *ho abitato qui da un anno*."
    - "Don't confuse *da* (since/for, ongoing) with *fa* (ago, finished): *da due anni* vs *due anni fa*."
    - "Spanish speakers: *hace dos años que vivo* / *vivo aquí desde hace dos años* → *abito qui da due anni*."
  related: [g.fra-tra-per, g.time-markers-past]
  drills:
    - { es: "Abitiamo in Toscana da dieci anni.", en: "We've lived in Tuscany for ten years." }
    - { es: "Ti aspetto da mezz'ora!", en: "I've been waiting for you for half an hour!" }
    - { es: "Suona il pianoforte da quando aveva sei anni.", en: "She's played the piano since she was six." }
- id: g.fra-tra-per
  level: a2
  title: "Time words: fra / tra, per, entro, fino a"
  summary: "fra due giorni = in two days' time; per due ore = for two hours; entro venerdì = by Friday."
  explanation: |
    | expression | meaning | example |
    |---|---|---|
    | **fra / tra** + time | in (from now) | *Parto fra una settimana.* |
    | **per** + period | for (finished or planned) | *Ho dormito per dieci ore. Resto per tre giorni.* |
    | **in** + time | in (how long it takes) | *L'ho fatto in un'ora.* |
    | **entro** | by, within | *Entro venerdì. Entro tre giorni.* |
    | **fino a** | until | *Lavoro fino alle sei.* |
    | **da… a** | from… to | *Dalle nove alle cinque.* |

    - *Fra* and *tra* are interchangeable; pick the one that sounds better: *tra fratelli*, *fra tre giorni*.
    - *Per* is often dropped: *Ho dormito dieci ore.*
  examples:
    - { es: "Il treno parte tra dieci minuti.", en: "The train leaves in ten minutes." }
    - { es: "Siamo rimasti a Lucca per una settimana.", en: "We stayed in Lucca for a week." }
    - { es: "Devo consegnare la tesi entro giugno.", en: "I have to hand in my thesis by June." }
    - { es: "Il museo è aperto dalle nove alle diciannove.", en: "The museum is open from nine to seven p.m." }
  pitfalls:
    - "'In two days' (future) is *fra due giorni*, not *in due giorni* (which means 'within two days')."
    - "*Fino a* + article: *fino alle otto, fino al lunedì*."
    - "Spanish speakers: *dentro de dos días* → *fra due giorni*."
  related: [g.da-since, g.simple-prepositions]
  drills:
    - { es: "Ci vediamo fra un'ora.", en: "See you in an hour." }
    - { es: "Ho studiato per tre ore.", en: "I studied for three hours." }
    - { es: "Restiamo fino a domenica.", en: "We're staying until Sunday." }
    - { es: "Mi risponda entro domani, per favore.", en: "Please reply by tomorrow." }
- id: g.verbs-with-prepositions
  level: a2
  title: "Verbs + a / di + infinitive"
  summary: "cominciare a, imparare a, finire di, decidere di, cercare di — which preposition before an infinitive."
  explanation: |
    ### No preposition
    Modals and verbs of liking/needing: *volere, potere, dovere, sapere, preferire, piacere, bisogna*: *Preferisco restare.*

    ### a + infinitive
    Beginning, learning, helping, movement: *cominciare a, iniziare a, imparare a, aiutare a, continuare a, riuscire a, andare a, venire a, provare a* (try).

    ### di + infinitive
    Ending, deciding, trying, thinking, saying, hoping: *finire di, smettere di, decidere di, cercare di, pensare di, credere di, sperare di, dimenticare di, ricordarsi di, chiedere di, dire di, avere voglia di*.

    | a | di |
    |---|---|
    | *Comincio a capire.* | *Finisco di lavorare alle sei.* |
    | *Ho imparato a nuotare.* | *Ho deciso di partire.* |
    | *Mi aiuti a cucinare?* | *Cerca di dormire.* |
  examples:
    - { es: "Ho cominciato a studiare l'italiano a gennaio.", en: "I started studying Italian in January." }
    - { es: "Abbiamo deciso di restare un'altra notte.", en: "We decided to stay another night." }
    - { es: "Cerca di arrivare in orario!", en: "Try to arrive on time!" }
    - { es: "Non riesco a dormire.", en: "I can't (manage to) sleep." }
  pitfalls:
    - "*Smettere di fumare*, not *smettere fumare*; *imparare a guidare*, not *imparare guidare*."
    - "*Provare a* (try to) vs *cercare di* (try to): both fine, different prepositions."
    - "Spanish speakers: *tratar de* → *cercare di*; *empezar a* → *cominciare a*; *acabar de* is not *finire di*."
  related: [g.potere-dovere, g.past-infinitive]
  drills:
    - { es: "Ho smesso di bere caffè.", en: "I've stopped drinking coffee." }
    - { es: "Mi aiuti a portare le valigie?", en: "Will you help me carry the suitcases?" }
    - { es: "Ricordati di chiudere la porta.", en: "Remember to lock the door." }
    - { es: "Continua a piovere.", en: "It keeps raining." }
- id: g.prepositions-transport
  level: a2
  title: "In treno, a piedi, con l'autobus — transport"
  summary: "in + vehicle (no article), a piedi, a cavallo; con + article for a specific one."
  explanation: |
    | how | Italian |
    |---|---|
    | by car, train, bus, plane, boat, bike | *in macchina, in treno, in autobus, in aereo, in nave, in bici* |
    | on foot, on horseback | *a piedi, a cavallo* |
    | with a specific vehicle | *con il treno delle otto, con la macchina di Marco* |

    - *Prendere* + article: *prendere il treno, l'autobus, la metro*.
    - *Salire su / scendere da*: *salire sul treno, scendere dall'autobus*.
    - *Andare / venire in* + vehicle: *Vengo in bici.*
    - *Guidare* (drive), *pedalare* (cycle), *camminare* (walk), *volare* (fly).
  examples:
    - { es: "Andiamo a Pisa in treno.", en: "We're going to Pisa by train." }
    - { es: "Vado al lavoro a piedi.", en: "I walk to work." }
    - { es: "Arrivo con il treno delle 10.15.", en: "I'm arriving on the 10:15 train." }
    - { es: "Scendiamo alla prossima fermata.", en: "We get off at the next stop." }
  pitfalls:
    - "No article after *in*: *in macchina*, not *nella macchina* (that means 'inside the car')."
    - "*A piedi*, not *in piedi* (which means 'standing')."
    - "Spanish speakers: *en coche* → *in macchina*, but *a pie* → *a piedi*."
  related: [g.prepositions-motion, g.simple-prepositions]
  drills:
    - { es: "Sei venuto in macchina o in autobus?", en: "Did you come by car or by bus?" }
    - { es: "Facciamo il giro delle mura in bici.", en: "Let's go round the walls by bike." }
    - { es: "Siamo saliti sul treno sbagliato!", en: "We got on the wrong train!" }
- id: g.fare-male
  level: a2
  title: "Mi fa male la testa / ho mal di testa"
  summary: "Pain: mi fa male + singular, mi fanno male + plural; ho mal di + body part."
  explanation: |
    ### fare male (works like piacere)
    The part that hurts is the subject:
    - *Mi fa male la gola.* — My throat hurts.
    - *Mi fanno male i piedi.* — My feet hurt.
    - *Ti fa male?* — Does it hurt?
    - *Gli fa male la schiena.* — His back hurts.

    ### avere mal di
    *Ho mal di testa, mal di denti, mal di stomaco, mal di gola, mal di schiena, mal d'orecchi.*

    ### Other symptoms
    *Ho la febbre, ho il raffreddore, ho la tosse, ho la nausea, sono allergico a, mi gira la testa* (I feel dizzy), *mi sono fatto male* (I hurt myself), *mi sono rotto il braccio*.
  examples:
    - { es: "Dottore, mi fa male lo stomaco.", en: "Doctor, my stomach hurts." }
    - { es: "Ho mal di testa da stamattina.", en: "I've had a headache since this morning." }
    - { es: "Mi fanno male le gambe dopo la passeggiata.", en: "My legs hurt after the walk." }
    - { es: "Mi sono fatta male alla caviglia.", en: "I've hurt my ankle." }
  pitfalls:
    - "Plural body parts need *fanno*: *mi fanno male gli occhi*."
    - "Use the article, not a possessive: *mi fa male la testa*, not *la mia testa*."
    - "*Mal di* (no -e, no article): *ho mal di denti*."
  related: [g.irregular-plurals-body, g.piacere-plural]
  drills:
    - { es: "Ti fa ancora male il ginocchio?", en: "Does your knee still hurt?" }
    - { es: "Ho la febbre e mal di gola.", en: "I've got a temperature and a sore throat." }
    - { es: "Gli fanno male i denti.", en: "His teeth hurt." }
- id: g.irregular-plurals-body
  level: a2
  title: "Irregular plurals: le mani, le braccia, le dita, le uova"
  summary: "Some masculine nouns become feminine in -a in the plural; others are simply irregular."
  explanation: |
    ### Masculine singular → feminine plural in -a
    | singular | plural |
    |---|---|
    | *il braccio* (arm) | **le braccia** |
    | *il dito* (finger) | **le dita** |
    | *il ginocchio* (knee) | **le ginocchia** |
    | *il labbro* (lip) | **le labbra** |
    | *il ciglio* (eyelash) | **le ciglia** |
    | *l'osso* (bone) | **le ossa** |
    | *l'uovo* (egg) | **le uova** |
    | *il paio* (pair) | **le paia** |
    | *il centinaio, il migliaio* | **le centinaia, le migliaia** |

    Adjectives agree in the feminine plural: *le braccia rotte, le uova fresche*.

    ### Other irregular plurals
    - *la mano → le mani* (feminine in -o, plural in -i)
    - *l'uomo → gli uomini*
    - *il dio → gli dei*, *il bue → i buoi*
    - *l'orecchio → le orecchie* (also *gli orecchi*)
  examples:
    - { es: "Mi fanno male le braccia.", en: "My arms hurt." }
    - { es: "Lavati le mani prima di mangiare.", en: "Wash your hands before eating." }
    - { es: "Mi servono sei uova per la torta.", en: "I need six eggs for the cake." }
    - { es: "Ha le labbra rosse e le ciglia lunghe.", en: "She has red lips and long eyelashes." }
  pitfalls:
    - "*Le dita*, not *i diti*; *le uova*, not *gli uovi*."
    - "The adjective is feminine: *le uova sode*, not *le uova sodi*."
    - "*La mano* is feminine: *le mani pulite*."
  related: [g.plural-nouns, g.fare-male]
  drills:
    - { es: "Ho le mani fredde.", en: "My hands are cold." }
    - { es: "Mi sono rotto due dita.", en: "I broke two fingers." }
    - { es: "Ci sono centinaia di turisti in piazza.", en: "There are hundreds of tourists in the square." }
    - { es: "Ho comprato un paio di scarpe e due paia di calzini.", en: "I bought a pair of shoes and two pairs of socks." }
- id: g.condizionale-presente
  level: a2
  title: "The conditional: parlerei, prenderei, sarei"
  summary: "Future stem + -ei, -esti, -ebbe, -emmo, -este, -ebbero: 'would'."
  explanation: |
    The conditional uses **the same stem as the future**, with its own endings:

    | | parlare | prendere | essere | volere |
    |---|---|---|---|---|
    | io | parler**ei** | prender**ei** | sar**ei** | vorr**ei** |
    | tu | parler**esti** | prender**esti** | sar**esti** | vorr**esti** |
    | lui / lei | parler**ebbe** | prender**ebbe** | sar**ebbe** | vorr**ebbe** |
    | noi | parler**emmo** | prender**emmo** | sar**emmo** | vorr**emmo** |
    | voi | parler**este** | prender**este** | sar**este** | vorr**este** |
    | loro | parler**ebbero** | prender**ebbero** | sar**ebbero** | vorr**ebbero** |

    Irregular stems as in the future: *avrei, andrei, potrei, dovrei, saprei, vedrei, verrei, berrei, farei, darei, starei*.

    ### Uses
    - Wishes: *Vorrei andare a Firenze.*
    - Polite requests: *Potrebbe aiutarmi?*
    - Advice: *Dovresti riposare.*
    - Hypothetical: *Al tuo posto, andrei dal medico.*
  examples:
    - { es: "Mi piacerebbe vivere in campagna.", en: "I'd like to live in the countryside." }
    - { es: "Sarebbe bello restare un'altra settimana.", en: "It would be nice to stay another week." }
    - { es: "Che cosa faresti al mio posto?", en: "What would you do in my place?" }
    - { es: "Mangerei volentieri una pizza.", en: "I'd happily eat a pizza." }
  pitfalls:
    - "*Noi* conditional has a double m (*parleremmo*); the future has one (*parleremo*)."
    - "Same stem as the future: *andrei*, not *anderei*."
    - "Spanish speakers: *-ía* endings become *-ei, -esti, -ebbe…*: *hablaría* → *parlerei*."
  related: [g.futuro-irregular, g.condizionale-courtesy, g.condizionale-uses]
  drills:
    - { es: "Vorremmo una camera doppia.", en: "We'd like a double room." }
    - { es: "Andresti in Toscana con me?", en: "Would you go to Tuscany with me?" }
    - { es: "Sarebbe meglio partire presto.", en: "It would be better to leave early." }
    - { es: "Berrei un bicchiere di vino.", en: "I'd drink a glass of wine." }
- id: g.condizionale-courtesy
  level: a2
  title: "Polite requests and advice with the conditional"
  summary: "Potrebbe…? Vorrei… Mi darebbe…? Dovresti… Al tuo posto…"
  explanation: |
    ### Polite requests
    | direct | polite |
    |---|---|
    | *Puoi aiutarmi?* | *Potresti aiutarmi?* |
    | *Può chiudere la porta?* | *Potrebbe chiudere la porta?* |
    | *Voglio un'aspirina.* | *Vorrei un'aspirina.* |
    | *Mi dà il resto?* | *Mi darebbe il resto?* |
    | — | *Le dispiacerebbe…?* (Would you mind…?) |

    ### Advice
    - *Dovresti* + infinitive: *Dovresti bere più acqua.* (You should…)
    - *Faresti meglio a* + infinitive: *Faresti meglio a restare a letto.* (You'd better…)
    - *Al tuo posto* / *Se fossi in te* (B2) + conditional: *Al tuo posto andrei dal medico.*
    - *Bisognerebbe* (one ought to): *Bisognerebbe prenotare.*
  examples:
    - { es: "Scusi, potrebbe chiamare un medico?", en: "Excuse me, could you call a doctor?" }
    - { es: "Vorrei qualcosa per il mal di gola.", en: "I'd like something for a sore throat." }
    - { es: "Dovresti riposarti un po'.", en: "You should rest a bit." }
    - { es: "Le dispiacerebbe aprire la finestra?", en: "Would you mind opening the window?" }
  pitfalls:
    - "*Dovresti* (you should) is softer than *devi* (you must)."
    - "*Faresti meglio a*, with *a*: *faresti meglio a dormire*."
    - "Spanish speakers: *deberías* → *dovresti*; *podría* → *potrebbe* (Lei) / *potrei* (io)."
  related: [g.condizionale-presente, g.volere-vorrei]
  drills:
    - { es: "Potresti parlare più piano?", en: "Could you speak more slowly?" }
    - { es: "Dovreste mangiare più verdura.", en: "You should eat more vegetables." }
    - { es: "Al tuo posto non uscirei con questo freddo.", en: "If I were you I wouldn't go out in this cold." }
    - { es: "Mi saprebbe dire dov'è la farmacia?", en: "Could you tell me where the pharmacy is?" }
- id: g.stare-per
  level: a2
  title: "Stare per — to be about to"
  summary: "stare per + infinitive: Sto per uscire. Il treno stava per partire."
  explanation: |
    *Stare per* + infinitive = to be about to:
    - *Sto per uscire, ti chiamo dopo.* — I'm about to go out, I'll call you later.
    - *Il film sta per cominciare.* — The film is about to start.
    - Past (imperfetto): *Stavo per chiamarti!* — I was just about to call you!

    Compare:
    | | |
    |---|---|
    | *sto mangiando* | I'm eating (now) |
    | *sto per mangiare* | I'm about to eat |
    | *ho appena mangiato* | I've just eaten |

    Alternatives: *essere sul punto di* + infinitive (more formal).
  examples:
    - { es: "Sbrigati, il treno sta per partire!", en: "Hurry up, the train is about to leave!" }
    - { es: "Stavo per dirtelo.", en: "I was about to tell you." }
    - { es: "Sta per piovere, torniamo.", en: "It's about to rain, let's go back." }
  pitfalls:
    - "*Stare per* + infinitive, not gerund: *sto per partire*, not *sto per partendo*."
    - "Don't confuse with *stare a* + infinitive (regional: 'to be doing')."
    - "Spanish speakers: *estar a punto de* → *stare per*."
  related: [g.stare-gerundio, g.gia-ancora-mai]
  drills:
    - { es: "Stiamo per arrivare a Pisa.", en: "We're about to arrive in Pisa." }
    - { es: "Stavo per uscire quando ha chiamato.", en: "I was about to go out when she called." }
    - { es: "Il negozio sta per chiudere.", en: "The shop is about to close." }
- id: g.di-nuovo-ri
  level: a2
  title: "Doing it again: di nuovo, ancora, ri-"
  summary: "di nuovo / ancora una volta, and the prefix ri-: rifare, rivedere, ritornare."
  explanation: |
    ### Adverbs
    - *di nuovo* — again: *Ho perso di nuovo le chiavi!*
    - *ancora* — again / still / more: *Ancora tu?! Vorrei ancora un po' di pane.*
    - *ancora una volta* — once again.

    ### The prefix ri-
    Many verbs take **ri-** for 'again' or 'back':
    | verb | with ri- |
    |---|---|
    | *fare* | *rifare* (redo) |
    | *vedere* | *rivedere* (see again) — *Arrivederci* comes from it |
    | *leggere* | *rileggere* (reread) |
    | *tornare* | *ritornare* (return) |
    | *partire* | *ripartire* (set off again) |
    | *provare* | *riprovare* (try again) |

    Before a vowel it may become *r-* or *ria-*: *riaprire* (reopen), *riempire* (fill).
  examples:
    - { es: "Mi sono perso di nuovo a Siena!", en: "I got lost in Siena again!" }
    - { es: "Vorrei rivedere la Cappella Brancacci.", en: "I'd like to see the Brancacci Chapel again." }
    - { es: "Il museo riapre a marzo.", en: "The museum reopens in March." }
    - { es: "Riprova, non è difficile!", en: "Try again, it's not hard!" }
  pitfalls:
    - "*Ancora* also means 'still' and 'more': context decides."
    - "Not every *ri-* verb means 'again': *ricordare* (remember), *ridere* (laugh), *rispondere* (answer)."
    - "Spanish speakers: *volver a + infinitivo* → *ri-* verb or *di nuovo*: *volví a leerlo* = *l'ho riletto*."
  related: [g.stare-per, g.word-formation]
  drills:
    - { es: "Devo rifare tutto da capo.", en: "I have to redo everything from scratch." }
    - { es: "Piove di nuovo.", en: "It's raining again." }
    - { es: "Ho riletto la lettera tre volte.", en: "I reread the letter three times." }
- id: g.indefinites
  level: a2
  title: "Indefinites: qualcuno, qualcosa, ognuno, qualche, ogni, alcuni"
  summary: "someone, something, everyone, some, every — and their negative partners."
  explanation: |
    ### Pronouns
    | positive | negative |
    |---|---|
    | *qualcuno* (someone) | *nessuno* (no one) |
    | *qualcosa* (something) | *niente / nulla* (nothing) |
    | *ognuno* (everyone, each) | — |
    | *tutto / tutti* (everything, everyone) | — |

    ### Adjectives
    - *qualche* + **singular** = some, a few: *qualche giorno, qualche amico*.
    - *alcuni / alcune* + plural = some, a few: *alcuni giorni*.
    - *ogni* + singular = every: *ogni giorno*.
    - *tutto* + article: *tutto il giorno, tutti i giorni, tutta la città*.
    - *nessun / nessuno / nessuna* (like *un*): *nessun problema*.

    ### Something + adjective
    *qualcosa di* + adjective, *niente di* + adjective: *qualcosa di buono, niente di speciale*.
    *qualcosa da* + infinitive: *qualcosa da bere*.
  examples:
    - { es: "C'è qualcuno in casa?", en: "Is anyone home?" }
    - { es: "Vuoi qualcosa da bere?", en: "Do you want something to drink?" }
    - { es: "Siamo stati in Toscana qualche giorno.", en: "We were in Tuscany for a few days." }
    - { es: "Ognuno paga il suo.", en: "Everyone pays for their own." }
  pitfalls:
    - "*Qualche* + singular: *qualche volta*, never *qualche volte*."
    - "*Qualcosa di nuovo*, not *qualcosa nuovo*."
    - "Spanish speakers: *alguien* → *qualcuno*; *algo* → *qualcosa*; *cada* → *ogni*."
  related: [g.double-negation, g.partitive-di, g.chiunque-qualunque]
  drills:
    - { es: "Ho letto qualche libro di Tabucchi.", en: "I've read a few books by Tabucchi." }
    - { es: "Abbiamo mangiato qualcosa di tipico.", en: "We ate something typical." }
    - { es: "Ogni sera passeggiamo sulle mura.", en: "Every evening we walk on the walls." }
    - { es: "Tutti i miei amici sono qui.", en: "All my friends are here." }
- id: g.double-negation
  level: a2
  title: "Non… niente, non… nessuno, non… mai — double negatives"
  summary: "Italian keeps non before the verb when a negative word follows it."
  explanation: |
    | negative word | example |
    |---|---|
    | *non… niente / nulla* | *Non ho mangiato niente.* |
    | *non… nessuno* | *Non c'è nessuno.* |
    | *non… mai* | *Non vado mai in discoteca.* |
    | *non… più* | *Non fumo più.* (any more) |
    | *non… ancora* | *Non è ancora arrivato.* |
    | *non… neanche / nemmeno* | *Non ho neanche un euro.* |
    | *non… né… né* | *Non bevo né vino né birra.* |
    | *non… mica* | *Non è mica facile!* (colloquial: it's not exactly easy) |

    ### Before the verb: no non
    If the negative word comes **first**, drop *non*: *Nessuno mi ha chiamato. Niente è impossibile. Mai più!*

    In compound tenses, *mai, più, ancora* sit between auxiliary and participle; *niente, nessuno* go after: *Non ho mai visto niente.*
  examples:
    - { es: "Non conosco nessuno a Firenze.", en: "I don't know anyone in Florence." }
    - { es: "Non abbiamo visto niente di interessante.", en: "We didn't see anything interesting." }
    - { es: "Nessuno sa dov'è.", en: "Nobody knows where it is." }
    - { es: "Non abito più a Pisa.", en: "I don't live in Pisa any more." }
  pitfalls:
    - "Keep *non*: *non ho visto nessuno*, never *ho visto nessuno*."
    - "Drop *non* when the negative word starts the sentence: *Nessuno è venuto*."
    - "Spanish speakers: the system is the same as Spanish (*no he visto a nadie*)."
  related: [g.negation, g.indefinites, g.anche-neanche]
  drills:
    - { es: "Non ho mai mangiato il cinghiale.", en: "I've never eaten wild boar." }
    - { es: "Non c'è più pane.", en: "There's no bread left." }
    - { es: "Non voglio né tè né caffè.", en: "I want neither tea nor coffee." }
    - { es: "Niente è cambiato.", en: "Nothing has changed." }
- id: g.a2-review
  level: a2
  title: "A2 review: past, future, pronouns"
  summary: "passato prossimo vs imperfetto, future and conditional, object pronouns, ci and ne."
  explanation: |
    ### Past tenses
    | | form | use |
    |---|---|---|
    | passato prossimo | *avere / essere* + participle | events: *Sono andato a Siena.* |
    | imperfetto | *-vo, -vi, -va…* | background, habits: *Faceva caldo.* |
    | stare (imperf.) + gerund | *stavo leggendo* | in progress at a moment |

    Essere verbs: movement to a place, change, state, reflexives. Participle agrees with the subject.

    ### Future and conditional (same stem)
    *parlerò / parlerei, sarò / sarei, andrò / andrei, verrò / verrei.*

    ### Pronouns
    | direct | indirect | other |
    |---|---|---|
    | mi ti lo la ci vi li le | mi ti gli le ci vi gli | ci (there), ne (of it / some) |

    Agreement: *L'ho vista. Li ho comprati. Ne ho mangiate due.*
  examples:
    - { es: "Quando ero piccola andavo sempre a Viareggio, ma quest'anno sono andata a Elba.", en: "When I was little I always went to Viareggio, but this year I went to Elba." }
    - { es: "Le ho telefonato ma non ha risposto.", en: "I phoned her but she didn't answer." }
    - { es: "Quante foto hai fatto? Ne ho fatte trecento.", en: "How many photos did you take? I took three hundred." }
    - { es: "Se avrò tempo, verrò a trovarti.", en: "If I have time, I'll come and see you." }
  pitfalls:
    - "Check the auxiliary: *sono andato* vs *ho camminato*."
    - "*Gli* (to him) vs *le* (to her) vs *li* (them, direct)."
    - "Conditional *noi* has *-mm-*: *andremmo*."
  related: [g.passato-prossimo-vs-imperfetto, g.direct-object-pronouns, g.ne-partitive]
  drills:
    - { es: "Mentre visitavamo Pisa, abbiamo incontrato dei vecchi amici.", en: "While we were visiting Pisa, we met some old friends." }
    - { es: "Il vino? L'ho già comprato.", en: "The wine? I've already bought it." }
    - { es: "Ci andrei volentieri, ma non ho tempo.", en: "I'd gladly go there, but I don't have time." }
    - { es: "Dovresti venire in Toscana in autunno.", en: "You should come to Tuscany in autumn." }
