id: a2.u05
title: 我識講廣東話
lessons:
  - id: a2.u05.l1
    title: 聽日會落雨
    teach: [g.wui-will]
    tip: "會 + verb predicts or promises: 聽日會落雨; 唔會 'won't'; ask 會唔會…？"
    vocab: [w.jing1-goi1, w.ho2-nang4, w.jat1-ding6, w.sing4-gung1, w.haau2-si5, w.haau2, w.hap6-gaak3, w.fei4-lou2, w.nang4-gau3, w.wui5-m4-wui5, w.kau4-cim1, w.cim1.b, w.gaai2-cim1, w.kau4, w.zi1.c, w.fong3-sam1, w.min6-hung4, w.si1-fu2]
    sentences:
      - { es: "聽日會落雨。", en: "It'll rain tomorrow.", altEs: ["聽日應該會落雨。"], altEn: ["It's going to rain tomorrow."], grammar: [g.wui-will], vocab: [w.jing1-goi1], transform: { instruction: "Make it negative", answer: "聽日唔會落雨。", en: "It won't rain tomorrow." } }
      - { es: "我會打電話畀你。", en: "I'll call you.", altEs: ["我會打畀你。"], altEn: ["I will phone you."], grammar: [g.wui-will], vocab: [] }
      - { es: "佢唔會嚟。", en: "He won't come.", altEs: ["佢應該唔會嚟。"], altEn: ["She isn't going to come."], grammar: [g.wui-will], vocab: [], transform: { instruction: "Ask 'will he come?'", answer: "佢會唔會嚟呀？", alt: ["佢會唔會嚟？"], en: "Will he come?" }, error: { wrong: "佢會唔嚟。", explain: "唔 goes before 會: 唔會 'won't'.", grammar: g.wui-will } }
      - { es: "會唔會塞車呀？", en: "Will there be traffic?", altEs: ["會唔會塞車？", "今日會唔會塞車呀？"], grammar: [g.wui-will], vocab: [w.wui5-m4-wui5] }
      - { es: "你考試一定會合格。", en: "You'll definitely pass your exam.", altEs: ["你一定會考試合格。", "你考試實會合格。"], grammar: [g.wui-will], vocab: [w.jat1-ding6, w.haau2-si5, w.hap6-gaak3] }
      - { es: "我驚我會肥佬。", en: "I'm afraid I'll fail.", altEs: ["我好驚會肥佬。"], grammar: [g.wui-will], vocab: [w.fei4-lou2], transform: { instruction: "Say you'll definitely pass", answer: "我一定會合格。", en: "I'll definitely pass." } }
      - { es: "佢應該會遲到。", en: "She'll probably be late.", altEs: ["佢可能會遲到。"], grammar: [g.wui-will], vocab: [w.jing1-goi1], error: { wrong: "佢會應該遲到。", explain: "應該 comes before 會: 應該會遲到.", grammar: g.wui-will } }
      - { es: "可能會好多人，早啲去啦。", en: "There might be lots of people; let's go early.", altEs: ["可能會好多人，我哋早啲去啦。"], grammar: [g.wui-will, g.particles-aa-laa], vocab: [w.ho2-nang4] }
      - { es: "我求咗支籤，話我今年會成功。", en: "I drew a fortune stick, and it says I'll succeed this year.", altEs: ["我求咗支籤，支籤話我今年會成功。"], grammar: [g.wui-will, g.zo-perfective], vocab: [w.kau4-cim1, w.cim1.b, w.sing4-gung1] }
      - { es: "新年嘅時候，黃大仙會好多人。", en: "At Chinese New Year, Wong Tai Sin gets really crowded.", altEs: ["新年嗰陣，黃大仙會好多人。"], grammar: [g.wui-will, g.ge-si-hau], vocab: [w.wui5-m4-wui5] }
      - { es: "我下個月考試，好緊張。", en: "I have an exam next month; I'm really nervous.", altEs: ["我下個月要考試，好緊張。"], grammar: [g.time-before-verb], vocab: [w.haau2] }
      - { es: "放心，我唔會話畀人知。", en: "Don't worry, I won't tell anyone.", altEs: ["放心啦，我唔會話畀人知。"], grammar: [g.wui-will], vocab: [] }
      - { es: "佢飲酒會面紅。", en: "She goes red when she drinks.", altEs: ["佢一飲酒就會面紅。"], altEn: ["He turns red when he drinks."], grammar: [g.wui-will], vocab: [], note: "會 can also mean 'tends to'." }
      - { es: "你話佢會唔會鍾意呀？", en: "Do you think she'll like it?", altEs: ["你話佢會唔會鍾意？"], altEn: ["Do you reckon he'll like it?"], grammar: [g.wui-will], vocab: [w.wui5-m4-wui5] }
      - { es: "搵個師傅解籤，就知你今年會點。", en: "Find a fortune teller to read your stick and you'll know how your year will go.", altEs: ["搵人解籤，就知你今年會點。"], grammar: [g.wui-will], vocab: [w.gaai2-cim1] }
    exchanges:
      - q: { es: "聽日會唔會落雨呀？", en: "Will it rain tomorrow?" }
        a: { es: "天文台話會落雨。", en: "The Observatory says it will." }
        alt: ["應該唔會。", "可能會。"]
        grammar: [g.wui-will]
        vocab: [w.wui5-m4-wui5]
      - q: { es: "你幾時會返嚟呀？", en: "When will you be back?" }
        a: { es: "我七點之前會返嚟。", en: "I'll be back before seven." }
        alt: ["好快返嚟。", "我一陣會返嚟。"]
        grammar: [g.wui-will]
        vocab: []
      - q: { es: "你考試會唔會合格呀？", en: "Will you pass your exam?" }
        a: { es: "應該會，我溫咗好耐書。", en: "I should; I've revised for ages." }
        alt: ["唔知呀，好驚。", "一定會。"]
        grammar: [g.wui-will]
        vocab: [w.hap6-gaak3, w.jing1-goi1]
      - q: { es: "支籤點講呀？", en: "What does the fortune stick say?" }
        a: { es: "好籤，話我今年會搵到好工。", en: "A good one; it says I'll find a good job this year." }
        alt: ["唔知，要搵人解籤。", "話我今年會成功。"]
        grammar: [g.wui-will]
        vocab: [w.cim1.b, w.gaai2-cim1]
      - q: { es: "黃大仙多唔多人呀？", en: "Is Wong Tai Sin crowded?" }
        a: { es: "新年會好多人，平日冇咁多。", en: "It's packed at New Year, not so busy on weekdays." }
        alt: ["好多人。", "平日唔多。"]
        grammar: [g.wui-will, g.mou-gam-not-as]
        vocab: [w.wui5-m4-wui5]
    texts:
      - title: "黃大仙"
        es: ["好多人嚟黃大仙求籤。", "佢哋想知今年會點。", "新年嘅時候，呢度會好多人。"]
        en: ["Lots of people come to Wong Tai Sin to shake fortune sticks.", "They want to know how their year will go.", "At Chinese New Year it gets really crowded here."]
        grammar: [g.wui-will]
        vocab: [w.kau4-cim1]
      - title: "天氣預報"
        es: ["聽日會好熱。", "下晝可能會落雨。", "記得帶遮。"]
        en: ["It'll be hot tomorrow.", "It might rain in the afternoon.", "Remember to take an umbrella."]
        grammar: [g.wui-will]
        vocab: [w.ho2-nang4]
    spicy:
      - { es: "我求咗支籤，話我今年會遇到真愛。", en: "I drew a fortune stick, and it says I'll meet true love this year.", altEs: ["我求咗支籤，支籤話我今年會遇到真愛。"], grammar: [g.wui-will], vocab: [w.kau4-cim1, w.cim1.b] }
      - { es: "我唔會話畀人知我哋嘅約會。", en: "I won't tell anyone about our date.", altEs: ["我哋嘅約會，我唔會話畀人知。"], grammar: [g.wui-will], vocab: [] }
      - { es: "你今晚會唔會掛住我呀？", en: "Will you miss me tonight?", altEs: ["你今晚會唔會掛住我？"], grammar: [g.wui-will], vocab: [w.wui5-m4-wui5] }
      - { es: "我今年一定會成功約到你。", en: "This year I'll definitely manage to get a date with you.", altEs: ["今年我一定會成功約到你。"], grammar: [g.wui-will, g.dou-attain], vocab: [w.jat1-ding6, w.sing4-gung1] }
      - { es: "你應該會鍾意我，我好識煮飯。", en: "You'll probably like me; I'm a great cook.", altEs: ["你應該會鍾意我，因為我好識煮飯。"], grammar: [g.wui-will, g.sik-know-how], vocab: [w.jing1-goi1] }

  - id: a2.u05.l2
    title: 呢度可唔可以影相？
    teach: [g.ho-ji-can-may]
    tip: "可以 = allowed; 可唔可以…？ is the polite request; 得 / 唔得 'OK / no way'."
    vocab: [w.ho2-ji5, w.zeon2, w.m4-zeon2, w.paak3-ce1, w.sik6-jin1, w.jin1, w.kwai1-geoi2, w.dak1.b, w.tiu3, w.paau2, w.paa4, w.fei1.b, w.jin6-gam1, w.seon3-jung6-kaat1]
    sentences:
      - { es: "我可以坐呢度嗎？", en: "Can I sit here?", altEs: ["我可唔可以坐呢度呀？", "我坐呢度得唔得呀？"], altEn: ["May I sit here?"], grammar: [g.ho-ji-can-may], vocab: [w.ho2-ji5], transform: { instruction: "Ask politely with 可唔可以", answer: "我可唔可以坐呢度呀？", alt: ["可唔可以坐呢度呀？"], en: "Could I sit here?" } }
      - { es: "呢度可唔可以影相呀？", en: "Can you take photos here?", altEs: ["呢度可以影相嗎？", "呢度影相得唔得呀？"], grammar: [g.ho-ji-can-may], vocab: [w.ho2-ji5] }
      - { es: "可唔可以幫我影張相呀？", en: "Could you take a photo of me?", altEs: ["可唔可以幫我哋影張相呀？", "唔該幫我影張相吖。"], grammar: [g.ho-ji-can-may], vocab: [w.ho2-ji5] }
      - { es: "呢度唔准食煙。", en: "No smoking here.", altEs: ["呢度唔可以食煙。"], altEn: ["You're not allowed to smoke here."], grammar: [g.jiu-must-m-sai], vocab: [w.m4-zeon2, w.sik6-jin1], transform: { instruction: "Say smoking is allowed", answer: "呢度可以食煙。", en: "You can smoke here." } }
      - { es: "呢度唔可以泊車。", en: "You can't park here.", altEs: ["呢度唔准泊車。"], grammar: [g.ho-ji-can-may], vocab: [w.paak3-ce1], error: { wrong: "呢度冇可以泊車。", explain: "The negative of 可以 is 唔可以.", grammar: g.ho-ji-can-may } }
      - { es: "用八達通得唔得呀？", en: "Can I use an Octopus card?", altEs: ["可唔可以用八達通呀？", "用八達通得唔得？"], grammar: [g.ho-ji-can-may, g.a-not-a-questions], vocab: [w.dak1.b], transform: { instruction: "Answer 'no'", answer: "唔得。", alt: ["唔得呀。", "唔可以。"], en: "No." } }
      - { es: "得，冇問題。", en: "Sure, no problem.", altEs: ["可以，冇問題。"], grammar: [g.ho-ji-can-may], vocab: [w.dak1.b] }
      - { es: "老師准我哋早啲走。", en: "The teacher let us leave early.", altEs: ["老師畀我哋早啲走。"], grammar: [g.ho-ji-can-may], vocab: [w.zeon2] }
      - { es: "你可以入嚟。", en: "You can come in.", altEs: ["你可以入嚟喇。", "入嚟啦。"], grammar: [g.ho-ji-can-may], vocab: [w.ho2-ji5] }
      - { es: "可唔可以講慢啲呀？", en: "Could you speak more slowly?", altEs: ["可唔可以講慢少少呀？", "唔該講慢啲。"], grammar: [g.ho-ji-can-may], vocab: [w.ho2-ji5] }
      - { es: "呢度有好多規矩，唔可以大聲講嘢。", en: "There are lots of rules here; you can't talk loudly.", altEs: ["呢度好多規矩，唔可以大聲講嘢。"], grammar: [g.ho-ji-can-may], vocab: [w.kwai1-geoi2] }
      - { es: "啲細路可以喺度跑同跳。", en: "The kids can run and jump here.", altEs: ["啲細路可以喺呢度跑同跳。"], grammar: [g.ho-ji-can-may], vocab: [w.paau2, w.tiu3] }
      - { es: "唔好爬上去，好危險！", en: "Don't climb up there, it's dangerous!", altEs: ["唔好爬上去呀，好危險！"], grammar: [g.m-hou-dont], vocab: [w.paa4] }
      - { es: "呢架飛機幾點飛呀？", en: "What time does this plane take off?", altEs: ["呢班機幾點飛呀？"], grammar: [g.clock-time], vocab: [w.fei1.b] }
      - { es: "一枝煙都唔可以食。", en: "Not even one cigarette is allowed.", altEs: ["一枝煙都唔准食。"], grammar: [g.ho-ji-can-may], vocab: [w.jin1] }
    exchanges:
      - q: { es: "我可唔可以坐呢度呀？", en: "Could I sit here?" }
        a: { es: "可以，請坐。", en: "Yes, please sit down." }
        alt: ["唔好意思，有人坐。", "得，坐啦。"]
        grammar: [g.ho-ji-can-may]
        vocab: [w.ho2-ji5]
      - q: { es: "用信用卡得唔得呀？", en: "Can I pay by credit card?" }
        a: { es: "唔得，淨係收現金。", en: "No, cash only." }
        alt: ["得。", "可以。"]
        grammar: [g.ho-ji-can-may]
        vocab: [w.dak1.b]
      - q: { es: "呢度可唔可以食煙呀？", en: "Can you smoke here?" }
        a: { es: "唔可以，呢度唔准食煙。", en: "No, smoking isn't allowed here." }
        alt: ["唔可以。", "出面先可以。"]
        grammar: [g.ho-ji-can-may]
        vocab: [w.sik6-jin1, w.m4-zeon2]
      - q: { es: "可唔可以幫我影張相呀？", en: "Could you take a photo of me?" }
        a: { es: "得，冇問題。", en: "Sure, no problem." }
        alt: ["好呀。", "可以。"]
        grammar: [g.ho-ji-can-may]
        vocab: [w.ho2-ji5]
      - q: { es: "我可以泊車喺度嗎？", en: "Can I park here?" }
        a: { es: "唔得，呢度唔准泊車。", en: "No, parking isn't allowed here." }
        alt: ["可以，不過要畀錢。", "唔可以。"]
        grammar: [g.ho-ji-can-may]
        vocab: [w.paak3-ce1]
    texts:
      - title: "門口嘅告示"
        es: ["請排隊。", "唔准食煙。", "可以影相，但係請細聲講嘢。"]
        en: ["Please queue.", "No smoking.", "Photos are allowed, but please speak quietly."]
        grammar: [g.ho-ji-can-may]
        vocab: [w.m4-zeon2, w.sik6-jin1, w.ho2-ji5]
      - title: "畀阿媽嘅短訊"
        es: ["阿媽，我今晚可唔可以喺朋友屋企瞓？", "佢屋企好近。", "我聽朝會返嚟。"]
        en: ["Mum, can I sleep at my friend's place tonight?", "Her flat is really close.", "I'll be back tomorrow morning."]
        grammar: [g.ho-ji-can-may, g.wui-will]
        vocab: [w.ho2-ji5]
    spicy:
      - { es: "我可唔可以坐你隔籬呀？呢個位最好。", en: "Can I sit next to you? This is the best seat.", altEs: ["我可以坐你隔籬嗎？呢個位最好。"], grammar: [g.ho-ji-can-may], vocab: [w.ho2-ji5] }
      - { es: "可唔可以畀你個電話號碼我呀？", en: "Could you give me your phone number?", altEs: ["你可唔可以畀你個電話號碼我？"], grammar: [g.ho-ji-can-may, g.bei-give], vocab: [w.ho2-ji5] }
      - { es: "你可以拖我隻手，我准。", en: "You may hold my hand; I'll allow it.", altEs: ["你可以拖住我隻手，我准你。"], grammar: [g.ho-ji-can-may], vocab: [w.zeon2] }
      - { es: "呢度唔准食煙，但係准你望住我。", en: "No smoking here, but you're allowed to look at me.", altEs: ["呢度唔准食煙，不過准你望住我。"], grammar: [g.ho-ji-can-may], vocab: [w.m4-zeon2, w.zeon2] }
      - { es: "我可以請你飲杯嘢嗎？", en: "May I buy you a drink?", altEs: ["我可唔可以請你飲杯嘢呀？"], grammar: [g.ho-ji-can-may], vocab: [w.ho2-ji5] }

  - id: a2.u05.l3
    title: 我識講廣東話
    teach: [g.sik-know-how]
    tip: "識 + verb = a learned skill (我識游水); 識 + person = know someone; facts take 知."
    vocab: [w.zi1-dou3, w.jyu5-jin4, w.wui6-waa2, w.se2-zi6, w.taan4-kam4, w.gong3-kam4, w.git3-taa1, w.ce1-paai4, w.jau4-wing6, w.gaau3, w.ming4, w.ming4-baak6, w.faan1-jik6, w.duk6-jam1, w.sing1-diu6, w.jyut6-ping3, w.cing1-co2, w.taan4]
    sentences:
      - { es: "我識講廣東話。", en: "I can speak Cantonese.", altEs: ["我識講少少廣東話。"], grammar: [g.sik-know-how], vocab: [], error: { wrong: "我會講廣東話。", explain: "For a learned skill Hong Kong Cantonese uses 識; 會 sounds like Mandarin or means 'will'.", grammar: g.sik-know-how } }
      - { es: "你識唔識揸車呀？", en: "Can you drive?", altEs: ["你識唔識揸車？", "你識揸車嗎？"], grammar: [g.sik-know-how, g.a-not-a-questions], vocab: [], transform: { instruction: "Answer 'yes, I can'", answer: "識。", alt: ["我識揸車。", "識呀。"], en: "Yes, I can." } }
      - { es: "我唔識游水。", en: "I can't swim.", altEs: ["我唔識游泳。"], grammar: [g.sik-know-how], vocab: [w.jau4-wing6], transform: { instruction: "Say you can swim", answer: "我識游水。", alt: ["我識游泳。"], en: "I can swim." } }
      - { es: "我識佢，佢係我同學。", en: "I know her; she's my classmate.", altEs: ["我識佢㗎，佢係我同學。"], altEn: ["I know him, he's my classmate."], grammar: [g.sik-know-how], vocab: [] }
      - { es: "我唔知佢住喺邊。", en: "I don't know where she lives.", altEs: ["我唔知道佢住喺邊度。"], altEn: ["I don't know where he lives."], grammar: [g.sik-know-how], vocab: [w.zi1-dou3], error: { wrong: "我唔識佢住喺邊。", explain: "Facts take 知, not 識: 我唔知佢住喺邊.", grammar: g.sik-know-how } }
      - { es: "你識唔識彈琴呀？", en: "Can you play the piano?", altEs: ["你識唔識彈鋼琴呀？"], grammar: [g.sik-know-how], vocab: [w.taan4-kam4, w.gong3-kam4], transform: { instruction: "Ask about the guitar instead", answer: "你識唔識彈結他呀？", alt: ["你識唔識彈結他？"], en: "Can you play the guitar?" } }
      - { es: "佢識彈結他，仲識唱歌。", en: "He can play the guitar, and he can sing too.", altEs: ["佢識彈結他，又識唱歌。"], altEn: ["She plays the guitar and sings as well."], grammar: [g.sik-know-how], vocab: [w.git3-taa1] }
      - { es: "我啱啱考到車牌。", en: "I've just got my driving licence.", altEs: ["我啱啱考到車牌喇。"], grammar: [g.dou-attain], vocab: [w.ce1-paai4] }
      - { es: "你識唔識寫中文字呀？識寫少少。", en: "Can you write Chinese characters? A few.", altEs: ["你識唔識寫字呀？識寫少少。"], grammar: [g.sik-know-how], vocab: [w.se2-zi6] }
      - { es: "佢識講三種語言。", en: "She speaks three languages.", altEs: ["佢識講三種話。"], altEn: ["He can speak three languages."], grammar: [g.sik-know-how, g.common-classifiers], vocab: [w.jyu5-jin4] }
      - { es: "你可唔可以教我粵拼呀？", en: "Could you teach me Jyutping?", altEs: ["你可以教我粵拼嗎？"], grammar: [g.ho-ji-can-may], vocab: [w.gaau3, w.jyut6-ping3] }
      - { es: "廣東話有六個聲調，好難。", en: "Cantonese has six tones; it's hard.", altEs: ["廣東話有六個聲調，好難呀。"], grammar: [g.jau-have], vocab: [w.sing1-diu6] }
      - { es: "呢個字嘅讀音係乜嘢呀？", en: "What's the pronunciation of this character?", altEs: ["呢個字點讀呀？"], grammar: [g.question-words], vocab: [w.duk6-jam1] }
      - { es: "我明白，唔使翻譯。", en: "I understand; there's no need to translate.", altEs: ["我明，唔使翻譯。"], grammar: [g.jiu-must-m-sai], vocab: [w.ming4-baak6, w.faan1-jik6] }
      - { es: "你明唔明呀？", en: "Do you understand?", altEs: ["你明唔明白呀？", "明唔明呀？"], grammar: [g.a-not-a-questions], vocab: [w.ming4] }
      - { es: "佢喺學校學廣東話會話。", en: "She's learning Cantonese conversation at school.", altEs: ["佢喺學校學緊廣東話會話。"], grammar: [g.sik-know-how], vocab: [w.wui6-waa2] }
    exchanges:
      - q: { es: "你識唔識講廣東話呀？", en: "Can you speak Cantonese?" }
        a: { es: "識少少。", en: "A little." }
        alt: ["識，不過講得唔係幾好。", "唔識。"]
        grammar: [g.sik-know-how]
        vocab: []
      - q: { es: "你識唔識佢呀？", en: "Do you know him?" }
        a: { es: "識，佢係我同事。", en: "Yes, he's my colleague." }
        alt: ["唔識。", "識，佢係我朋友。"]
        grammar: [g.sik-know-how]
        vocab: []
      - q: { es: "你知唔知黃大仙點去呀？", en: "Do you know how to get to Wong Tai Sin?" }
        a: { es: "知，坐港鐵去黃大仙站。", en: "Yes, take the MTR to Wong Tai Sin station." }
        alt: ["唔知呀。", "坐港鐵就得。"]
        grammar: [g.sik-know-how]
        vocab: [w.zi1-dou3]
      - q: { es: "你識唔識彈琴呀？", en: "Can you play the piano?" }
        a: { es: "唔識，不過我識彈結他。", en: "No, but I can play the guitar." }
        alt: ["識少少。", "唔識。"]
        grammar: [g.sik-know-how]
        vocab: [w.taan4-kam4, w.git3-taa1]
      - q: { es: "你明唔明我講乜呀？", en: "Do you understand what I'm saying?" }
        a: { es: "明，你講得好清楚。", en: "Yes, you're speaking very clearly." }
        alt: ["唔係好明。", "明白。"]
        grammar: [g.sik-know-how, g.dak-descriptive]
        vocab: [w.ming4]
    texts:
      - title: "自我介紹"
        es: ["我識講英文同少少廣東話。", "我識寫幾個中文字。", "我仲識彈結他。"]
        en: ["I can speak English and a little Cantonese.", "I can write a few Chinese characters.", "I can also play the guitar."]
        grammar: [g.sik-know-how]
        vocab: [w.se2-zi6, w.git3-taa1]
      - title: "學廣東話"
        es: ["廣東話有六個聲調。", "我用粵拼學讀音。", "有時我唔明，要問老師。"]
        en: ["Cantonese has six tones.", "I learn the pronunciation with Jyutping.", "Sometimes I don't understand and have to ask the teacher."]
        grammar: [g.sik-know-how]
        vocab: [w.sing1-diu6, w.jyut6-ping3, w.duk6-jam1, w.ming4]
    spicy:
      - { es: "你識唔識跳舞呀？唔識？我教你。", en: "Can you dance? No? I'll teach you.", altEs: ["你識跳舞嗎？唔識？我教你啦。"], grammar: [g.sik-know-how], vocab: [w.gaau3] }
      - { es: "我唔識彈琴，不過我識講笑。", en: "I can't play the piano, but I can tell a good joke.", altEs: ["我唔識彈琴，但係我識講笑。"], grammar: [g.sik-know-how], vocab: [w.taan4-kam4] }
      - { es: "我唔知你叫咩名，但係我好想識你。", en: "I don't know your name, but I'd really like to get to know you.", altEs: ["我唔知你叫乜嘢名，但係我好想識你。"], grammar: [g.sik-know-how], vocab: [w.zi1-dou3] }
      - { es: "你講乜我都明，除咗「唔得」。", en: "I understand everything you say, except 'no'.", altEs: ["你講咩我都明，除咗「唔得」。"], grammar: [g.sik-know-how], vocab: [w.ming4] }
      - { es: "我識講三種語言，但係見到你就唔識講嘢。", en: "I speak three languages, but when I see you I can't say a word.", altEs: ["我識講三種語言，不過一見到你就唔識講嘢。"], grammar: [g.sik-know-how], vocab: [w.jyu5-jin4] }

  - id: a2.u05.l4
    title: 要定唔使？
    teach: [g.jiu-must-m-sai]
    tip: "要 + verb = have to; the negative is 唔使 'needn't', never 唔要. Ask 使唔使…？"
    vocab: [w.sai2.b, w.jat1-ding6-jiu3, w.bit1-seoi1, w.lin6-zaap6, w.saang1-zi6, w.gei3-jik1, w.fo3-cing4, w.baan1, w.sou3-hok6, w.fo1-hok6, w.lik6-si2, w.jyun4-bat1, w.jyu6-joek3, w.ceoi4, w.jap6]
    sentences:
      - { es: "我要返工。", en: "I have to go to work.", altEs: ["我要返工呀。"], grammar: [g.jiu-must-m-sai], vocab: [], transform: { instruction: "Say you don't have to", answer: "我唔使返工。", en: "I don't have to go to work." } }
      - { es: "你唔使畀錢。", en: "You don't have to pay.", altEs: ["唔使畀錢。"], grammar: [g.jiu-must-m-sai], vocab: [w.sai2.b], error: { wrong: "你唔要畀錢。", explain: "'Don't have to' is 唔使; 唔要 means 'don't want'.", grammar: g.jiu-must-m-sai } }
      - { es: "使唔使預約呀？", en: "Do I need to book?", altEs: ["使唔使預約？", "要唔要預約呀？"], grammar: [g.jiu-must-m-sai], vocab: [w.sai2.b], transform: { instruction: "Answer 'no need'", answer: "唔使。", alt: ["唔使預約。", "唔使呀。"], en: "No need." } }
      - { es: "你一定要試吓呢度嘅蛋撻。", en: "You really must try the egg tarts here.", altEs: ["你一定要試試呢度嘅蛋撻。"], grammar: [g.jiu-must-m-sai, g.haa-briefly], vocab: [w.jat1-ding6-jiu3] }
      - { es: "我聽日要考數學。", en: "I have a maths exam tomorrow.", altEs: ["聽日我要考數學。"], grammar: [g.jiu-must-m-sai], vocab: [w.sou3-hok6] }
      - { es: "我要練習寫字。", en: "I need to practise writing characters.", altEs: ["我要多啲練習寫字。"], grammar: [g.jiu-must-m-sai], vocab: [w.lin6-zaap6], transform: { instruction: "Change to 'we definitely must'", answer: "我哋一定要練習寫字。", en: "We really must practise writing characters." } }
      - { es: "我哋班有二十個學生。", en: "There are twenty students in our class.", altEs: ["我哋班有廿個學生。"], grammar: [g.jau-have], vocab: [w.baan1] }
      - { es: "每日要學十個生字。", en: "You have to learn ten new words a day.", altEs: ["我每日要學十個生字。"], grammar: [g.jiu-must-m-sai], vocab: [w.saang1-zi6] }
      - { es: "我嘅記憶好差。", en: "My memory is terrible.", altEs: ["我記憶好差。"], grammar: [g.ge-possessive], vocab: [w.gei3-jik1] }
      - { es: "呢個課程要讀一年。", en: "This course takes a year.", altEs: ["呢個課程要讀成年。"], grammar: [g.jiu-must-m-sai], vocab: [w.fo3-cing4] }
      - { es: "去黃大仙祠唔使買飛。", en: "You don't need a ticket to visit Wong Tai Sin Temple.", altEs: ["入黃大仙祠唔使錢。"], grammar: [g.jiu-must-m-sai], vocab: [w.sai2.b] }
      - { es: "我唔鍾意科學，我鍾意歷史。", en: "I don't like science; I like history.", altEs: ["我唔鍾意科學，鍾意歷史。"], grammar: [g.zung-ji-like], vocab: [w.fo1-hok6, w.lik6-si2] }
      - { es: "考試必須用鉛筆。", en: "You must use a pencil in the exam.", altEs: ["考試一定要用鉛筆。"], grammar: [g.jiu-must-m-sai], vocab: [w.bit1-seoi1, w.jyun4-bat1] }
      - { es: "使唔使除鞋呀？唔使。", en: "Do I need to take my shoes off? No.", altEs: ["要唔要除鞋呀？唔使。"], grammar: [g.jiu-must-m-sai], vocab: [w.sai2.b] }
      - { es: "我今個月使咗好多錢。", en: "I've spent a lot of money this month.", altEs: ["今個月我使咗好多錢。"], grammar: [g.zo-perfective], vocab: [w.sai2.b] }
    exchanges:
      - q: { es: "使唔使預約呀？", en: "Do I need to book?" }
        a: { es: "唔使，嚟到排隊就得。", en: "No, just come and queue." }
        alt: ["要預約。", "唔使。"]
        grammar: [g.jiu-must-m-sai]
        vocab: [w.sai2.b]
      - q: { es: "你聽日要唔要返學呀？", en: "Do you have school tomorrow?" }
        a: { es: "要呀，仲要考試。", en: "Yes, and I've got an exam too." }
        alt: ["唔使，放假。", "要呀。"]
        grammar: [g.jiu-must-m-sai]
        vocab: [w.haau2-si5]
      - q: { es: "入黃大仙祠使唔使買飛呀？", en: "Do you need a ticket for Wong Tai Sin Temple?" }
        a: { es: "唔使，唔使錢。", en: "No, it's free." }
        alt: ["唔使買飛。", "唔使。"]
        grammar: [g.jiu-must-m-sai]
        vocab: [w.sai2.b]
      - q: { es: "你今晚做乜嘢呀？", en: "What are you doing tonight?" }
        a: { es: "我要溫數學。", en: "I have to revise maths." }
        alt: ["我要溫歷史。", "冇嘢做。"]
        grammar: [g.jiu-must-m-sai]
        vocab: [w.sou3-hok6]
      - q: { es: "我要唔要帶鉛筆呀？", en: "Do I need to bring a pencil?" }
        a: { es: "要，考試要用鉛筆。", en: "Yes, you need a pencil for the exam." }
        alt: ["唔使。", "要呀。"]
        grammar: [g.jiu-must-m-sai]
        vocab: [w.jyun4-bat1]
    texts:
      - title: "學校通告"
        es: ["聽日考歷史。", "大家一定要帶鉛筆。", "唔使帶書。"]
        en: ["There's a history exam tomorrow.", "Everyone must bring a pencil.", "You don't need to bring books."]
        grammar: [g.jiu-must-m-sai]
        vocab: [w.lik6-si2, w.jyun4-bat1, w.jat1-ding6-jiu3]
      - title: "我嘅廣東話班"
        es: ["我每個禮拜上兩堂廣東話。", "老師話我哋要日日練習。", "我記憶唔好，所以要寫生字。"]
        en: ["I have two Cantonese lessons a week.", "The teacher says we have to practise every day.", "My memory isn't good, so I have to write down the new words."]
        grammar: [g.jiu-must-m-sai]
        vocab: [w.lin6-zaap6, w.gei3-jik1, w.saang1-zi6]
    spicy:
      - { es: "你唔使畀錢，今晚我請。", en: "You don't need to pay; tonight's on me.", altEs: ["唔使畀錢，今晚我請。"], grammar: [g.jiu-must-m-sai], vocab: [w.sai2.b] }
      - { es: "我要寫低你個電話號碼，我記憶好差。", en: "I need to write down your number; my memory is terrible.", altEs: ["我要寫低你電話號碼，因為我記憶好差。"], grammar: [g.jiu-must-m-sai], vocab: [w.gei3-jik1] }
      - { es: "我要練習講「我鍾意你」，你可唔可以幫我？", en: "I need to practise saying 'I like you'; could you help me?", altEs: ["我要練習講「我鍾意你」，你幫唔幫我呀？"], grammar: [g.jiu-must-m-sai, g.ho-ji-can-may], vocab: [w.lin6-zaap6] }
      - { es: "使唔使我送你返屋企呀？唔使？咁我陪你行。", en: "Shall I take you home? No need? Then I'll walk with you.", altEs: ["使唔使我送你返去呀？唔使？咁我陪你行吓。"], grammar: [g.jiu-must-m-sai], vocab: [w.sai2.b] }
      - { es: "你一定要試吓我煮嘅飯。", en: "You absolutely have to try my cooking.", altEs: ["你一定要試試我煮嘅飯。"], grammar: [g.jiu-must-m-sai], vocab: [w.jat1-ding6-jiu3] }
dialogues:
  - id: a2.u05.d1
    title: 喺黃大仙求籤
    context: "Ka-yan takes Chi-ming to Wong Tai Sin Temple, where he wants to shake fortune sticks for the first time."
    lines:
      - { speaker: 志明, es: "嘉欣，呢度可唔可以影相呀？", en: "Ka-yan, can you take photos here?" }
      - { speaker: 嘉欣, es: "可以，但係唔好影啲人拜神。", en: "Yes, but don't take pictures of people praying." }
      - { speaker: 志明, es: "我想求籤，使唔使排隊呀？", en: "I'd like to shake the fortune sticks; do I need to queue?" }
      - { speaker: 嘉欣, es: "要排隊，新年就更加多人。", en: "Yes, and at New Year there are even more people." }
      - { speaker: 志明, es: "求籤點做㗎？我唔識。", en: "How do you do it? I don't know how." }
      - { speaker: 嘉欣, es: "好簡單，我教你。你諗住你嘅問題，然後求一支籤。", en: "It's easy, I'll show you. Think of your question, then shake out one stick." }
      - { speaker: 志明, es: "我支籤寫咗乜嘢呀？我睇唔明。", en: "What does my stick say? I can't understand it." }
      - { speaker: 嘉欣, es: "我都唔識，要搵人解籤。", en: "I can't read it either; we need someone to interpret it." }
      - { speaker: 志明, es: "我今年會唔會考到車牌呀？", en: "Will I pass my driving test this year?" }
      - { speaker: 嘉欣, es: "應該會，不過你要練習多啲！", en: "Probably, but you need to practise more!" }
    questions:
      - { q: "喺度可唔可以影相呀？", options: ["可以", "唔可以", "要畀錢先可以"], answer: 0, explain: "嘉欣 says 可以, but not of people praying." }
      - { q: "新年嘅時候點樣呀？", options: ["冇乜人", "更加多人", "唔使排隊"], answer: 1, explain: "新年就更加多人: even more people at New Year." }
      - { q: "志明識唔識求籤呀？", options: ["識", "唔識", "佢求過好多次"], answer: 1, explain: "求籤點做㗎？我唔識: he doesn't know how." }
      - { q: "嘉欣話志明要做乜嘢？", options: ["練習多啲", "求多支籤", "買架車"], answer: 0, explain: "你要練習多啲: he needs to practise more for his driving test." }
writing:
  - task: "Write about tomorrow with 會, 應該 and 可能: the weather and what you will probably do."
    min: 25
    max: 55
    use: [w.wui5, w.jing1-goi1, w.ho2-nang4, w.haau2-si5]
    useAtLeast: 3
    grammar: [g.wui-will]
    expect:
      - { pattern: "會", hint: "Say what will happen with 會: 聽日會落雨." }
      - { pattern: "可能|應該|一定", hint: "Say how sure you are: 可能, 應該, 一定." }
    model: { es: "聽日應該會落雨，所以我可能唔會去行山。我會喺屋企溫書，因為下個禮拜要考試。", en: "It will probably rain tomorrow, so I might not go hiking. I'll study at home, because I have an exam next week." }
  - task: "At Wong Tai Sin Temple, ask a staff member whether you may take photos, then write their answer: yes, but no smoking inside."
    min: 20
    max: 45
    use: [w.ho2-ji5, w.m4-zeon2, w.sik6-jin1, w.jing2-soeng2]
    useAtLeast: 3
    grammar: [g.ho-ji-can-may]
    expect:
      - { pattern: "可唔可以|可以", hint: "Ask for permission: 可唔可以影相呀？" }
      - { pattern: "唔准|唔可以", hint: "Say what isn't allowed: 唔准食煙." }
    model: { es: "請問呢度可唔可以影相呀？可以，不過入面唔准食煙。", en: "Excuse me, may I take photos here? Yes, but smoking is not allowed inside." }
  - task: "Write what you know how to do with 識: languages and one skill, and one thing you can't do yet."
    min: 20
    max: 45
    use: [w.sik1, w.taan4, w.gong3-kam4, w.se2-zi6]
    useAtLeast: 3
    grammar: [g.sik-know-how]
    expect:
      - { pattern: "識(講|彈|寫|揸|煮|唱)", hint: "Say what you can do with 識 + verb: 我識講英文." }
      - { pattern: "唔識", hint: "Say what you can't do: 我唔識…" }
    model: { es: "我識講英文同少少廣東話，仲識彈鋼琴，不過我唔識寫中文字。", en: "I can speak English and a little Cantonese, and I can play the piano, but I can't write Chinese characters." }
  - task: "Tell a new classmate what they must do and what they needn't do in the Cantonese class (要 / 一定要 / 唔使)."
    min: 20
    max: 50
    use: [w.jat1-ding6-jiu3, w.lin6-zaap6, w.saang1-zi6, w.sai2.b]
    useAtLeast: 3
    grammar: [g.jiu-must-m-sai]
    expect:
      - { pattern: "要", hint: "Say what they must do: 一定要… / 要…" }
      - { pattern: "唔使", hint: "Say what they needn't do: 唔使…" }
    model: { es: "上堂一定要帶簿同筆，日日都要練習生字。唔使買書，老師會畀我哋。", en: "You must bring an exercise book and a pen to class, and practise new words every day. You don't need to buy a book; the teacher gives us one." }
