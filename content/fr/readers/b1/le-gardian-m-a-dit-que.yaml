id: r.b1.le-gardian-m-a-dit-que
level: b1
title: "La Camargue : le gardian m'a dit que…"
kind: text
intro: A journalist spends a day with Frédéric, a gardian (cowboy) in the Camargue, and reports what he told her. Notice reported speech (il m'a dit que…, il m'a expliqué que…, il m'a demandé si…).
allow: [naturel, frédéric, saintes-maries-de-la-mer, saintes-maries, raseteurs, raseteur, ok]
paragraphs:
  - { es: "Il est six heures du matin quand j'arrive au mas de Frédéric, entre Arles et les Saintes-Maries-de-la-Mer. Le ciel est rose au-dessus des marais. Frédéric est déjà à cheval. Il porte un chapeau noir, une chemise à fleurs et il tient à la main un long bâton terminé par un trident. Il me dit bonjour et me demande si je sais monter à cheval. Je lui réponds que oui, un peu. Il rit et me dit que nous allons voir ça.", en: "It's six in the morning when I arrive at Frédéric's farm, between Arles and Saintes-Maries-de-la-Mer. The sky is pink above the marshes. Frédéric is already on horseback. He's wearing a black hat and a flowered shirt, and he holds in his hand a long stick ending in a trident. He says hello and asks me if I can ride. I tell him yes, a little. He laughs and says we'll see about that." }
  - { es: "Pendant que nous avançons dans les marais, Frédéric m'explique son métier. Il me raconte que son père et son grand-père étaient déjà gardians, et qu'il est monté à cheval pour la première fois à quatre ans. Il m'explique que le travail du gardian, c'est de surveiller les taureaux, de les déplacer d'un pâturage à l'autre et de choisir ceux qui participeront aux courses. « Ce n'est pas un métier, m'a-t-il dit, c'est une façon de vivre. »", en: "As we move forward through the marshes, Frédéric explains his job to me. He tells me that his father and grandfather were already gardians, and that he first rode a horse at the age of four. He explains that a gardian's work is to watch over the bulls, move them from one pasture to another and choose the ones that will take part in the races. 'It's not a job,' he told me, 'it's a way of life.'" }
  - { es: "Je lui demande pourquoi les chevaux de Camargue sont tous blancs. Il me répond, en souriant, que c'est faux : les poulains naissent noirs ou bruns, et ils deviennent blancs vers l'âge de quatre ou cinq ans. Il ajoute que ces chevaux sont petits mais très solides, et qu'ils vivent dehors toute l'année, même en hiver, quand le mistral souffle.", en: "I ask him why Camargue horses are all white. He answers, smiling, that it isn't true: the foals are born black or brown, and they turn white around the age of four or five. He adds that these horses are small but very strong, and that they live outdoors all year round, even in winter when the mistral blows." }
  - { es: "Un peu plus loin, nous voyons le troupeau : une centaine de taureaux noirs, aux cornes en forme de lyre. Frédéric me prévient qu'il ne faut pas s'approcher à pied. Je lui demande si ses taureaux vont dans les corridas. Il secoue la tête. Il m'explique qu'ici, on pratique surtout la course camarguaise : de jeunes hommes en blanc, les raseteurs, essaient d'attraper de petits rubans attachés aux cornes du taureau. Il insiste sur le fait que le taureau n'est jamais tué. « Chez nous, la star, c'est le taureau. Certains ont même leur statue dans les villages ! »", en: "A little further on we see the herd: about a hundred black bulls with lyre-shaped horns. Frédéric warns me that you mustn't go near them on foot. I ask him if his bulls go to bullfights. He shakes his head. He explains that here people mostly practise the course camarguaise: young men in white, the raseteurs, try to catch small ribbons tied to the bull's horns. He insists that the bull is never killed. 'For us, the star is the bull. Some even have their own statue in the villages!'" }
  - { es: "Vers midi, nous nous arrêtons au bord d'un étang. Des centaines de flamants roses se nourrissent dans l'eau peu profonde. Frédéric me dit que la Camargue est l'un des rares endroits d'Europe où les flamants font leurs nids, et que c'est pour protéger ces oiseaux et ce paysage qu'on a créé un parc naturel en 1970. Il me montre aussi, au loin, les montagnes blanches des salins : on récolte le sel ici depuis l'Antiquité.", en: "Around noon we stop at the edge of a lagoon. Hundreds of pink flamingos are feeding in the shallow water. Frédéric tells me the Camargue is one of the few places in Europe where flamingos nest, and that it was to protect these birds and this landscape that a natural park was created in 1970. He also points out, in the distance, the white mountains of the salt works: salt has been harvested here since ancient times." }
  - { es: "Avant de partir, je lui demande s'il a peur que son métier disparaisse. Il réfléchit longtemps. Puis il me dit que la vie est plus difficile qu'avant, qu'il y a de plus en plus de touristes et de moins en moins de jeunes qui veulent faire ce travail. Mais il ajoute que son fils de douze ans monte déjà mieux que lui. « Tant qu'il y aura des taureaux en Camargue, m'a-t-il promis, il y aura des gardians. » Ensuite, il m'a demandé de revenir en mai, pour la fête des gardians à Arles. Et il m'a conseillé d'apporter de la crème contre les moustiques.", en: "Before leaving, I ask him if he's afraid his job will disappear. He thinks for a long time. Then he tells me that life is harder than before, that there are more and more tourists and fewer and fewer young people who want to do this work. But he adds that his twelve-year-old son already rides better than he does. 'As long as there are bulls in the Camargue,' he promised me, 'there will be gardians.' Then he asked me to come back in May for the gardians' festival in Arles. And he advised me to bring mosquito cream." }
questions:
  - { q: "Qu'est-ce que Frédéric demande à la journaliste en arrivant ?", options: ["Si elle a faim", "Si elle sait monter à cheval", "Si elle connaît Arles"], answer: 1, explain: "«Il me demande si je sais monter à cheval.» Reported yes/no questions use si." }
  - { q: "De quelle couleur sont les poulains de Camargue à la naissance ?", options: ["Blancs", "Noirs ou bruns", "Roux"], answer: 1, explain: "«Les poulains naissent noirs ou bruns, et ils deviennent blancs vers l'âge de quatre ou cinq ans.»" }
  - { q: "Qu'est-ce que les raseteurs essaient de faire ?", options: ["Tuer le taureau", "Attraper de petits rubans attachés aux cornes", "Monter sur le taureau"], answer: 1, explain: "They try to catch «de petits rubans attachés aux cornes du taureau»; the bull is never killed." }
  - { q: "Pourquoi a-t-on créé un parc naturel en 1970 ?", options: ["Pour protéger les oiseaux et le paysage", "Pour les courses de taureaux", "Pour produire du sel"], answer: 0, explain: "«C'est pour protéger ces oiseaux et ce paysage qu'on a créé un parc naturel en 1970.»" }
  - { q: "Qu'est-ce qui rend Frédéric optimiste pour l'avenir ?", options: ["Les touristes", "Son fils, qui monte déjà très bien", "Le parc naturel"], answer: 1, explain: "«Son fils de douze ans monte déjà mieux que lui.»" }
