# Irregular and stem-changing verbs. Anything not listed is conjugated
# regularly with automatic spelling changes (buscar->busqué, conocer->conozco,
# coger->cojo, seguir->sigo, construir->construyo, leer->leyó).
verbs:
  # ---- the big irregulars
  - lemma: ser
    pres: [soy, eres, es, somos, sois, son]
    pret: [fui, fuiste, fue, fuimos, fuisteis, fueron]
    impf: [era, eras, era, éramos, erais, eran]
    subjPres: [sea, seas, sea, seamos, seáis, sean]
    impTu: sé
  - lemma: estar
    pres: [estoy, estás, está, estamos, estáis, están]
    pretStem: estuv
    subjPres: [esté, estés, esté, estemos, estéis, estén]
    impTu: está
  - lemma: haber
    pres: [he, has, ha, hemos, habéis, han]
    pretStem: hub
    futStem: habr
    subjPres: [haya, hayas, haya, hayamos, hayáis, hayan]
  - lemma: ir
    pres: [voy, vas, va, vamos, vais, van]
    pret: [fui, fuiste, fue, fuimos, fuisteis, fueron]
    impf: [iba, ibas, iba, íbamos, ibais, iban]
    subjPres: [vaya, vayas, vaya, vayamos, vayáis, vayan]
    impAff: ["", ve, vaya, vamos, id, vayan]
    gerund: yendo
  - lemma: tener
    stemChange: e>ie
    yo: tengo
    pretStem: tuv
    futStem: tendr
    impTu: ten
  - lemma: hacer
    yo: hago
    pretStem: hic
    futStem: har
    participle: hecho
    impTu: haz
  - lemma: poder
    stemChange: o>ue
    pretStem: pud
    futStem: podr
    gerund: pudiendo
  - lemma: poner
    yo: pongo
    pretStem: pus
    futStem: pondr
    participle: puesto
    impTu: pon
  - lemma: querer
    stemChange: e>ie
    pretStem: quis
    futStem: querr
  - lemma: saber
    yo: sé
    pretStem: sup
    futStem: sabr
    subjPres: [sepa, sepas, sepa, sepamos, sepáis, sepan]
  - lemma: venir
    stemChange: e>ie
    irVowelRaise: e>i
    yo: vengo
    pretStem: vin
    futStem: vendr
    impTu: ven
  - lemma: decir
    stemChange: e>i
    yo: digo
    pretStem: dij
    futStem: dir
    participle: dicho
    impTu: di
  - lemma: dar
    pres: [doy, das, da, damos, dais, dan]
    pret: [di, diste, dio, dimos, disteis, dieron]
    subjPres: [dé, des, dé, demos, deis, den]
  - lemma: ver
    yo: veo
    pres: [veo, ves, ve, vemos, veis, ven]
    pret: [vi, viste, vio, vimos, visteis, vieron]
    impf: [veía, veías, veía, veíamos, veíais, veían]
    participle: visto
  - lemma: salir
    yo: salgo
    futStem: saldr
    impTu: sal
  - lemma: traer
    yo: traigo
    pretStem: traj
  - lemma: caer
    yo: caigo
  - lemma: oír
    pres: [oigo, oyes, oye, oímos, oís, oyen]
    yo: oigo
  - lemma: andar
    pretStem: anduv
  - lemma: caber
    yo: quepo
    pretStem: cup
    futStem: cabr
  - lemma: valer
    yo: valgo
    futStem: valdr
  - lemma: conducir
    pretStem: conduj
  - lemma: traducir
    pretStem: traduj
  - lemma: producir
    pretStem: produj
  - lemma: reducir
    pretStem: reduj
  - lemma: introducir
    pretStem: introduj
  - lemma: satisfacer
    yo: satisfago
    pretStem: satisfic
    futStem: satisfar
    participle: satisfecho
    impTu: satisfaz
  # ---- -eír
  - lemma: reír
    pres: [río, ríes, ríe, reímos, reís, ríen]
    pret: [reí, reíste, rio, reímos, reísteis, rieron]
    subjPres: [ría, rías, ría, riamos, riais, rían]
    gerund: riendo
    participle: reído
  - lemma: sonreír
    pres: [sonrío, sonríes, sonríe, sonreímos, sonreís, sonríen]
    pret: [sonreí, sonreíste, sonrió, sonreímos, sonreísteis, sonrieron]
    subjPres: [sonría, sonrías, sonría, sonriamos, sonriais, sonrían]
    gerund: sonriendo
    participle: sonreído
  - lemma: freír
    pres: [frío, fríes, fríe, freímos, freís, fríen]
    pret: [freí, freíste, frio, freímos, freísteis, frieron]
    subjPres: [fría, frías, fría, friamos, friais, frían]
    gerund: friendo
    participle: frito
