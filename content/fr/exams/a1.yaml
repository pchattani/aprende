grammar:
  - { prompt: "Ma mère ___ professeure.", options: ["est", "a", "fait"], answer: 0, explain: "Professions use être, with no article: elle est professeure (g.etre-present, g.c-est-il-est)." }
  - { prompt: "J'___ vingt ans.", options: ["suis", "ai", "fais"], answer: 1, explain: "Age uses avoir: j'ai vingt ans (g.avoir-expressions)." }
  - { prompt: "Dans ma rue, ___ un supermarché.", options: ["il y a", "il est", "c'est"], answer: 0, explain: "Existence of something: il y a (g.il-y-a)." }
  - { prompt: "Le matin, je bois ___ café.", options: ["de la", "du", "des"], answer: 1, explain: "Partitive with a masculine noun: du café (g.partitive-articles)." }
  - { prompt: "Je n'ai pas ___ voiture.", options: ["une", "de", "la"], answer: 1, explain: "After a negation, un / une / du / des become de: pas de voiture (g.de-after-negation)." }
  - { prompt: "Les maisons sont ___.", options: ["blanc", "blanche", "blanches"], answer: 2, explain: "Feminine plural agreement: blanches (g.adjective-agreement)." }
  - { prompt: "Ce soir, nous allons ___ cinéma.", options: ["à le", "au", "en"], answer: 1, explain: "à + le = au (g.contractions-au-du)." }
  - { prompt: "Elle ___ lève à sept heures.", options: ["me", "se", "te"], answer: 1, explain: "Reflexive pronoun for elle: se (g.reflexive-intro)." }
  - { prompt: "Demain, je ___ visiter le Louvre.", options: ["vais", "suis", "fais"], answer: 0, explain: "Futur proche: aller + infinitive (g.futur-proche)." }
  - { prompt: "C'est ___ frère, Paul.", options: ["ma", "mon", "mes"], answer: 1, explain: "frère is masculine singular: mon frère (g.possessives)." }
  - { prompt: "___ heure est-il ?", options: ["Quel", "Quelle", "Quels"], answer: 1, explain: "heure is feminine: quelle heure (g.quel)." }
  - { prompt: "Aujourd'hui, il ___ beau.", options: ["est", "a", "fait"], answer: 2, explain: "Weather uses il fait: il fait beau (g.weather)." }
  - { prompt: "J'habite ___ Paris, ___ France.", options: ["à … en", "en … à", "au … en"], answer: 0, explain: "à + city, en + feminine country (g.prepositions-cities-countries)." }
  - { prompt: "J'habite ici ___ deux ans.", options: ["pendant", "depuis", "il y a"], answer: 1, explain: "An action still going on: present + depuis (g.depuis-present)." }
  - { prompt: "Vous ___ d'où ?", options: ["êtes", "avez", "allez"], answer: 0, explain: "être de = to be from: vous êtes d'où ? (g.etre-present)." }
writing:
  prompt: "Write a short text about yourself in French: your name, age, nationality and where you live, your family, your job or studies, what you like and your daily routine."
  minWords: 60
  modelAnswer: |
    Je m'appelle Daniel et j'ai trente ans. Je suis anglais, de Londres, mais maintenant j'habite à Lyon avec ma femme. Je travaille dans un bureau et j'apprends le français le soir. Ma famille est petite : mes parents et ma sœur, qui habite à Manchester. J'aime beaucoup le sport : je joue au tennis deux fois par semaine et je cours le long du Rhône. J'adore aussi la cuisine française et le fromage. Le matin, je me lève à sept heures, je prends le petit-déjeuner et je vais au travail à vélo. Je rentre à la maison à six heures et nous dînons à huit heures.
  checklist:
    - "I gave my name, age and nationality with s'appeler, avoir and être correctly (je m'appelle, j'ai… ans, je suis…)."
    - "I said where I live with habiter à + city (and en / au + country)."
    - "I described at least two family members with possessives (mon, ma, mes) and adjectives that agree."
    - "I used aimer / adorer + le, la, les or an infinitive at least once."
    - "I described my routine with at least three present-tense verbs, including a reflexive verb (je me lève, je me couche…)."
    - "I used an article (le, la, un, une, du…) with every noun and wrote the accents (j'habite, français, frère)."
