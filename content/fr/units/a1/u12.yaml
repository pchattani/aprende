      - { es: "Je vis à Paris depuis trois ans, mais avec toi, c'est une autre ville.", en: "I've lived in Paris for three years, but with you it's a different city.", grammar: [g.depuis-present], vocab: [w.vivre, w.depuis] }
      - { es: "Tu viens d'arriver ? Parfait, moi aussi.", en: "You've just arrived? Perfect, me too.", grammar: [g.venir-de], vocab: [w.venir-de] }
      - { es: "Un souvenir de Paris ? Une bise sur le Pont Neuf.", en: "A souvenir of Paris? A kiss on the cheek on the Pont Neuf.", grammar: [g.articles-indefinite], vocab: [w.souvenir] }
      - { es: "Encore une danse, encore un verre… et encore toi, s'il te plaît.", en: "Another dance, another drink... and more of you, please.", grammar: [g.quantities], vocab: [w.encore] }
dialogues:
  - id: a1.u12.d1
    title: Le dernier jour
    context: On the 14th of July, Julie and Thomas watch the parade on the Champs-Élysées. It's Julie's last day in Paris.
    lines:
      - { speaker: Thomas, es: "C'est le 14 Juillet ! Tu entends ? Le défilé commence !", en: "It's the 14th of July! Can you hear? The parade is starting!" }
      - { speaker: Julie, es: "Oui, mais je ne vois rien. Il y a trop de monde !", en: "Yes, but I can't see anything. There are too many people!" }
      - { speaker: Thomas, es: "Regarde les avions : bleu, blanc, rouge !", en: "Look at the planes: blue, white, red!" }
      - { speaker: Julie, es: "Quelle belle fête ! Tu habites à Paris depuis combien de temps, toi ?", en: "What a great celebration! How long have you lived in Paris?" }
      - { speaker: Thomas, es: "Depuis deux ans. Et toi, tu rentres à Montréal demain ?", en: "For two years. And you, you're going back to Montreal tomorrow?" }
      - { speaker: Julie, es: "Oui… Je viens de faire ma valise.", en: "Yes... I've just packed my suitcase." }
      - { speaker: Thomas, es: "Déjà ? Quel dommage ! Il faut revenir bientôt.", en: "Already? What a shame! You have to come back soon." }
      - { speaker: Julie, es: "D'accord ! Mais ce soir, on va voir le feu d'artifice à la tour Eiffel ?", en: "OK! But tonight, shall we go and see the fireworks at the Eiffel Tower?" }
      - { speaker: Thomas, es: "Bien sûr. Il faut arriver tôt pour avoir une bonne place.", en: "Of course. We have to get there early to get a good spot." }
      - { speaker: Julie, es: "Alors on y va ! Au revoir, les Champs-Élysées !", en: "Let's go, then! Goodbye, Champs-Élysées!" }
    questions:
      - { q: "Quel jour est-ce ?", options: ["Le 1er janvier.", "Le 14 juillet.", "Le 25 décembre."], answer: 1, explain: "Thomas: « C'est le 14 Juillet ! », the French national holiday." }
      - { q: "Depuis combien de temps Thomas habite à Paris ?", options: ["Depuis deux mois.", "Depuis deux ans.", "Depuis toujours."], answer: 1, explain: "« Depuis deux ans. »" }
      - { q: "Où va Julie demain ?", options: ["À Montréal.", "À Lyon.", "À la tour Eiffel."], answer: 0, explain: "« Tu rentres à Montréal demain ? » — « Oui… »" }
      - { q: "Pourquoi faut-il arriver tôt ce soir ?", options: ["Pour avoir une bonne place.", "Pour acheter des billets.", "Pour manger."], answer: 0, explain: "« Il faut arriver tôt pour avoir une bonne place. »" }
