id: r.b1.teletrabajo-u-oficina
level: b1
title: ¿Teletrabajo u oficina?
kind: text
intro: A student's opinion essay weighs the advantages and drawbacks of working from home, using connectors to organise the argument.
allow: [barcelona]
paragraphs:
  - { es: "Desde la pandemia, millones de personas trabajan desde casa al menos un día a la semana. Algunas empresas quieren que sus empleados vuelvan a la oficina; otras, en cambio, han cerrado sus despachos para siempre. ¿Es el teletrabajo el futuro o solo una moda? En este texto voy a presentar las dos posturas y, por último, mi opinión.", en: "Since the pandemic, millions of people have worked from home at least one day a week. Some companies want their employees to go back to the office; others, on the other hand, have closed their offices for good. Is remote work the future or just a fashion? In this text I am going to present the two positions and, finally, my opinion." }
  - { es: "En primer lugar, los que están a favor del teletrabajo hablan de comodidad y de tiempo. Puesto que no hay que desplazarse, se ahorran una o dos horas diarias de atascos o de metro. Además, el horario es más flexible: se puede llevar a los niños al colegio o hacer la compra a las once de la mañana. Por lo tanto, muchas personas afirman que son más productivas en casa.", en: "Firstly, those in favour of remote work talk about convenience and time. Since there is no need to commute, one or two hours a day of traffic jams or the metro are saved. Moreover, the timetable is more flexible: you can take the children to school or do the shopping at eleven in the morning. Therefore, many people claim they are more productive at home." }
  - { es: "Asimismo, el teletrabajo tiene efectos positivos sobre el medio ambiente. Menos coches en la carretera significan menos contaminación y menos ruido. De hecho, algunas ciudades han notado una mejora del aire en los días de más teletrabajo.", en: "Likewise, remote work has positive effects on the environment. Fewer cars on the road mean less pollution and less noise. In fact, some cities have noticed an improvement in the air on the days with the most remote work." }
  - { es: "Por otra parte, los que están en contra señalan varios inconvenientes. Para empezar, la soledad: mucha gente se siente aislada después de meses sin ver a sus compañeros. Asimismo, en casa es difícil separar el trabajo de la vida personal, de modo que algunos acaban trabajando más horas, no menos. Por último, los jóvenes que empiezan en una empresa aprenden mucho más en la oficina, es decir, mirando y preguntando a los demás.", en: "On the other hand, those against point out several drawbacks. To begin with, loneliness: many people feel isolated after months without seeing their colleagues. Likewise, at home it is hard to separate work from personal life, so some end up working more hours, not fewer. Lastly, young people starting out in a company learn much more in the office, that is, by watching and asking the others." }
  - { es: "Desde mi punto de vista, no hay que elegir entre una cosa y la otra. Aunque el teletrabajo tiene ventajas evidentes, sobre todo para las familias, el contacto con los compañeros es imprescindible. Personalmente, trabajaría dos o tres días en casa y el resto en la oficina. Si pudiera elegir, los lunes y los viernes se quedarían en casa.", en: "From my point of view, there is no need to choose between one thing and the other. Although remote work has obvious advantages, especially for families, contact with colleagues is essential. Personally, I would work two or three days at home and the rest in the office. If I could choose, Mondays and Fridays would stay at home." }
  - { es: "En conclusión, el teletrabajo no es ni el paraíso ni el problema; es, en definitiva, una herramienta. Si las empresas la usan bien, ganarán todos: los trabajadores, las ciudades y, a largo plazo, las propias empresas.", en: "In conclusion, remote work is neither paradise nor the problem; it is, in short, a tool. If companies use it well, everyone will win: the workers, the cities and, in the long run, the companies themselves." }
questions:
  - { q: "According to the essay, why do supporters say they are more productive at home?", options: ["They sleep more", "They save commuting time and have a flexible timetable", "They earn more money"], answer: 1 }
  - { q: "Which environmental effect is mentioned?", options: ["Less pollution and noise thanks to fewer cars", "More recycling", "Cheaper electricity"], answer: 0 }
  - { q: "What drawback affects young workers in particular?", options: ["They earn less", "They learn less than in the office", "They have no internet"], answer: 1 }
  - { q: "What is the author's own conclusion?", options: ["Everyone should work from home", "Offices should close", "A mix of home and office days is best"], answer: 2 }
