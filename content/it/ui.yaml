# Interface text in the target language (keys are fixed; values are per course).
# `{word}`, `{region}` and `{language}` are placeholders filled in by the app.
appName: Impara
tagline: Italian, from your first words to fluency
welcome:
  title: Leo, Bonchita and Luna are off to Italy
  intro: Three small dogs, one long boot-shaped country, and only you can talk to the locals. Luna has the map, Leo has the ball, Bonchita has the appetite (pizza, gelato, anything). Every unit is a stop on a grand tour that lands in Rome, rolls through Tuscany, the North, the South and the islands, and comes home to Rome again. Where should the journey start? Everything is open; this just marks the first stop.
  firstStop: "Land in Rome: A1, lesson 1."
greetings: { morning: Buongiorno, afternoon: Buon pomeriggio, evening: Buonasera }
feedback: { correct: Esatto!, almost: Quasi!, goalDone: Bravo! }
stampEarned: Timbro conquistato!
spicyName: Modalità piccante
games: { name: Parole, memory: Memoria, rapid: Veloce, win: Ce l'hai fatta! }
dogsPage: I cagnolini
quizGreat: Benissimo!
whatDoesItMean: Che cosa significa “{word}”?
badgeName: distintivo di {region}
typePlaceholder: Scrivi in italiano
voiceTest: Ciao, come stai? Mi chiamo Impara e ti aiuto con l'italiano.
voiceHelp: No Italian voice installed. On Windows add “Italian (Italy)” speech in Settings → Time & Language; on Android install Google Text-to-speech and download the Italian voice; iOS and macOS include Alice and Federica (Settings → Accessibility → Spoken Content).
pronunciationIntro: Italian is spelled almost exactly as it is spoken. Learn a handful of rules (c and g, gl and gn, double consonants, where the stress falls) and you can read anything aloud.
cheers:
  - { es: "Bravo!", en: "Well done!" }
  - { es: "Bravissimo!", en: "Brilliant!" }
  - { es: "Fantastico!", en: "Fantastic!" }
  - { es: "Perfetto!", en: "Perfect!" }
  - { es: "Grande!", en: "Great stuff!" }
  - { es: "Così si fa!", en: "That's how it's done!" }
  - { es: "Sei un fenomeno!", en: "You're a star!" }
  - { es: "Che bello!", en: "Lovely!" }
