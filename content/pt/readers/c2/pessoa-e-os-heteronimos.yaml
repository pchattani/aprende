id: r.c2.pessoa-e-os-heteronimos
level: c2
title: "Fernando Pessoa e os seus outros"
kind: literature
author: Fernando Pessoa (1888–1935)
source: "«Mar Português» (Mensagem, 1934); «Autopsicografia» (Presença, 1932); Alberto Caeiro, O Guardador de Rebanhos, poema II (excerto; Athena, 1925); Ricardo Reis, «Para ser grande, sê inteiro» (Presença, 1933); Álvaro de Campos, «Tabacaria» (Presença, 1933; excertos). Domínio público na maioria dos países desde 2006. Os parágrafos em prosa foram escritos para este curso."
intro: "Fernando Pessoa wrote not only under his own name but as several invented poets, the heteronyms, each with a biography, a philosophy and a style. Here are poems by Pessoa himself and by three of his 'others'. Lines are separated by a slash. Notice the European Portuguese (comboio, humidade, enclisis as in acenou-me), the tu imperative (sê, põe) and how the syntax changes with each poet."
allow: [fernando, pessoa, alberto, caeiro, ricardo, reis, álvaro, campos, bojador, mensagem, presença, athena, esteves, durban, lisboa, chiado, brasileira]
paragraphs:
  - { es: "Fernando Pessoa passou quase toda a vida em Lisboa, num emprego modesto de tradutor de cartas comerciais, e publicou em vida um único livro em português, Mensagem. Quando morreu, em 1935, deixou uma arca com mais de vinte e cinco mil papéis. Neles viviam dezenas de autores inventados, a que chamou heterónimos: não pseudónimos, mas poetas completos, com datas de nascimento, profissões e maneiras próprias de ver o mundo. “Sê plural como o universo!”, escreveu numa nota.", en: "Fernando Pessoa spent almost his whole life in Lisbon, in a modest job translating business letters, and published in his lifetime only one book in Portuguese, Mensagem. When he died in 1935 he left a trunk with more than twenty-five thousand papers. In them lived dozens of invented authors, which he called heteronyms: not pseudonyms, but complete poets, with dates of birth, professions and their own ways of seeing the world. 'Be plural like the universe!' he wrote in a note." }
  - { es: "MAR PORTUGUÊS. Ó mar salgado, quanto do teu sal / São lágrimas de Portugal! / Por te cruzarmos, quantas mães choraram, / Quantos filhos em vão rezaram! / Quantas noivas ficaram por casar / Para que fosses nosso, ó mar! // Valeu a pena? Tudo vale a pena / Se a alma não é pequena. / Quem quer passar além do Bojador / Tem que passar além da dor. / Deus ao mar o perigo e o abismo deu, / Mas nele é que espelhou o céu.", en: "PORTUGUESE SEA. O salty sea, how much of your salt / is tears of Portugal! / For us to cross you, how many mothers wept, / how many sons prayed in vain! / How many brides were left unmarried / so that you might be ours, O sea! // Was it worth it? Everything is worth it / if the soul is not small. / Whoever wants to sail beyond Bojador / must sail beyond pain. / God gave the sea danger and the abyss, / but it is in the sea that He mirrored the sky." }
  - { es: "AUTOPSICOGRAFIA. O poeta é um fingidor. / Finge tão completamente / Que chega a fingir que é dor / A dor que deveras sente. // E os que leem o que escreve, / Na dor lida sentem bem, / Não as duas que ele teve, / Mas só a que eles não têm. // E assim nas calhas de roda / Gira, a entreter a razão, / Esse comboio de corda / Que se chama coração.", en: "AUTOPSYCHOGRAPHY. The poet is a pretender. / He pretends so completely / that he even pretends that it is pain, / the pain he really feels. // And those who read what he writes / feel clearly, in the pain they read, / not the two that he had, / but only the one they do not have. // And so, on its circular track, / round goes, to amuse reason, / that clockwork train / called the heart." }
  - { es: "Alberto Caeiro, o “mestre” de todos os outros, seria um homem do campo, quase sem estudos, que recusa a metafísica e só confia nos sentidos. Os seus versos são livres, a sua linguagem é simples, quase prosaica.", en: "Alberto Caeiro, the 'master' of all the others, was supposedly a countryman with almost no schooling, who rejects metaphysics and trusts only his senses. His lines are free, his language simple, almost prosaic." }
  - { es: "O meu olhar é nítido como um girassol. / Tenho o costume de andar pelas estradas / Olhando para a direita e para a esquerda, / E de vez em quando olhando para trás... / E o que vejo a cada momento / É aquilo que nunca antes eu tinha visto, / E eu sei dar por isso muito bem... / Sei ter o pasmo essencial / Que tem uma criança se, ao nascer, / Reparasse que nascera deveras... / Sinto-me nascido a cada momento / Para a eterna novidade do Mundo...", en: "My gaze is clear like a sunflower. / I have the habit of walking along the roads / looking to the right and to the left, / and now and then looking behind... / And what I see at each moment / is what I had never seen before, / and I am very good at noticing it... / I know how to have the essential amazement / that a child would have if, on being born, / it noticed that it had really been born... / I feel myself born at every moment / into the eternal newness of the World..." }
  - { es: "Ricardo Reis, médico e monárquico, exilado no Brasil, escreve odes à maneira dos clássicos latinos, com uma sintaxe cheia de inversões e uma filosofia de serenidade e disciplina.", en: "Ricardo Reis, a doctor and monarchist exiled in Brazil, writes odes in the manner of the Latin classics, with syntax full of inversions and a philosophy of serenity and discipline." }
  - { es: "Para ser grande, sê inteiro: nada / Teu exagera ou exclui. / Sê todo em cada coisa. Põe quanto és / No mínimo que fazes. / Assim em cada lago a lua toda / Brilha, porque alta vive.", en: "To be great, be whole: exaggerate / or exclude nothing of yours. / Be all of yourself in each thing. Put all you are / into the least you do. / So in each lake the whole moon / shines, because it lives on high." }
  - { es: "Álvaro de Campos, engenheiro naval formado em Glasgow, é o mais moderno e o mais angustiado. Em “Tabacaria”, um homem olha da janela para a loja de tabaco do outro lado da rua e mede o abismo entre os seus sonhos e a sua vida. No fim, um gesto banal de um vizinho, um simples aceno, basta para o devolver ao mundo real.", en: "Álvaro de Campos, a naval engineer trained in Glasgow, is the most modern and the most anguished. In 'Tobacco Shop' a man looks from his window at the tobacco shop across the street and measures the abyss between his dreams and his life. In the end, a neighbour's trivial gesture, a simple wave, is enough to bring him back to the real world." }
  - { es: "TABACARIA. Não sou nada. / Nunca serei nada. / Não posso querer ser nada. / À parte isso, tenho em mim todos os sonhos do mundo. // Janelas do meu quarto, / Do meu quarto de um dos milhões do mundo que ninguém sabe quem é / (E se soubessem quem é, o que saberiam?), / Dais para o mistério de uma rua cruzada constantemente por gente, / Para uma rua inacessível a todos os pensamentos, / Real, impossivelmente real, certa, desconhecidamente certa, / Com o mistério das coisas por baixo das pedras e dos seres, / Com a morte a pôr humidade nas paredes e cabelos brancos nos homens, / Com o Destino a conduzir a carroça de tudo pela estrada de nada. (…) Ah, conheço-o; é o Esteves sem metafísica. / (O Dono da Tabacaria chegou à porta.) / Como por um instinto divino o Esteves voltou-se e viu-me. / Acenou-me adeus, gritei-lhe Adeus ó Esteves!, e o universo / Reconstruiu-se-me sem ideal nem esperança, e o Dono da Tabacaria sorriu.", en: "TOBACCO SHOP. I am nothing. / I shall never be anything. / I cannot want to be anything. / Apart from that, I have in me all the dreams of the world. // Windows of my room, / of my room, one of the millions in the world that nobody knows who it is / (and if they knew who it is, what would they know?), / you look out on the mystery of a street constantly crossed by people, / on a street inaccessible to all thoughts, / real, impossibly real, certain, unknowably certain, / with the mystery of things beneath the stones and beings, / with death putting damp on the walls and white hairs on men, / with Destiny driving the cart of everything down the road of nothing. (…) Ah, I know him; it's Esteves without metaphysics. / (The Tobacco Shop Owner has come to the door.) / As if by a divine instinct Esteves turned round and saw me. / He waved goodbye, I shouted Goodbye, Esteves!, and the universe / rebuilt itself for me without ideal or hope, and the Tobacco Shop Owner smiled." }
questions:
  - { q: "O que são os heterónimos de Pessoa?", options: ["Simples pseudónimos para esconder o nome", "Amigos reais que escreviam com ele", "Poetas inventados, com biografia, estilo e visão do mundo próprios", "Traduções de poetas ingleses"], answer: 2, explain: "Unlike pseudonyms, heteronyms are complete fictional poets — Caeiro, Reis, Campos — each with a life and a style." }
  - { q: "Em “Mar Português”, qual é a resposta à pergunta “Valeu a pena?”", options: ["Tudo vale a pena se a alma não é pequena", "Não, foi tudo inútil", "Só valeu para os reis", "O poeta não responde"], answer: 0, explain: "The sacrifice (tears, prayers, brides left unmarried) is justified by greatness of soul; to go beyond Bojador one must go beyond pain." }
  - { q: "Segundo “Autopsicografia”, o que sentem os leitores?", options: ["As duas dores do poeta", "Só a dor que eles próprios não têm, a dor lida", "Nenhuma dor", "A dor verdadeira do poeta"], answer: 1, explain: "The poet feels a real pain and a pretended one; readers feel neither, but a third — the pain they read." }
  - { q: "Qual destes traços caracteriza Alberto Caeiro?", options: ["Sintaxe latina e odes clássicas", "Angústia moderna e versos longos", "Recusa da metafísica e confiança nos sentidos, com linguagem simples", "Poesia religiosa"], answer: 2, explain: "Caeiro sees each thing as if for the first time ('a eterna novidade do Mundo') and distrusts abstract thought." }
  - { q: "Que forma verbal é “sê” em “Para ser grande, sê inteiro”?", options: ["Presente do indicativo", "Imperativo de tu do verbo ser", "Futuro do subjuntivo", "Infinitivo pessoal"], answer: 1, explain: "Sê is the tu imperative of ser (like põe from pôr), normal in European Portuguese and in poetry." }
  - { q: "Que efeito tem o pronome em “o universo / Reconstruiu-se-me”?", options: ["Indica que o universo se reconstrói para o poeta, do ponto de vista dele", "É um erro gramatical", "Indica o futuro", "Marca uma pergunta"], answer: 0, explain: "Two enclitic pronouns: se (reflexive) + me (ethical dative) — the universe rebuilt itself, for me. Typically European clitic stacking." }
