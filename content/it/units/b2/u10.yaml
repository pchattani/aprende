id: b2.u10
title: "A mio avviso"
lessons:
  - id: b2.u10.l1
    title: Innanzitutto, inoltre, del resto
    teach: [g.argumentation-connectors]
    vocab: [w.daltronde, w.del-resto, w.in-sintesi, w.per-concludere, w.in-definitiva, w.in-altre-parole, w.ovvero, w.ossia, w.vale-a-dire, w.approfondire, w.ampliare, w.limitare, w.favorire, w.ostacolare, w.incentivare, w.comportare, w.implicare, w.provocare, w.causare, w.determinare, w.influenzare, w.influire, w.contribuire, w.derivare, w.consistere, w.risultare, w.emergere, w.verificarsi, w.diffondersi, w.diffusione, w.diffuso, w.mancanza]
    tip: "An argument is a path: innanzitutto (first), inoltre (moreover), d'altra parte (on the other hand), vale a dire (that is), in definitiva (ultimately)."
    sentences:
      - { es: "Innanzitutto, il turismo porta lavoro; inoltre, contribuisce a far conoscere la città.", en: "First of all, tourism brings jobs; moreover, it helps make the city known.", altEs: ["In primo luogo, il turismo porta lavoro; inoltre, contribuisce a far conoscere la città."], grammar: [g.argumentation-connectors], vocab: [w.contribuire], error: { wrong: "Innanzitutto, il turismo porta lavoro; invece, contribuisce a far conoscere la città.", explain: "Inoltre adds a point (moreover); invece contrasts (instead), which makes no sense here.", grammar: g.argumentation-connectors } }
      - { es: "D'altra parte, l'arrivo di troppi turisti può provocare un aumento degli affitti.", en: "On the other hand, the arrival of too many tourists can cause rents to rise.", altEs: ["D'altro canto, l'arrivo di troppi turisti può provocare un aumento degli affitti."], grammar: [g.argumentation-connectors], vocab: [w.provocare] }
      - { es: "Il turismo di massa comporta un rischio, ovvero la perdita dell'identità dei quartieri.", en: "Mass tourism carries a risk, namely the loss of the neighbourhoods' identity.", altEs: ["Il turismo di massa comporta un rischio, cioè la perdita dell'identità dei quartieri.", "Il turismo di massa comporta un rischio, vale a dire la perdita dell'identità dei quartieri."], grammar: [g.argumentation-connectors], vocab: [w.comportare, w.ovvero] }
      - { es: "In altre parole, Bari Vecchia rischia di diventare un museo all'aperto.", en: "In other words, Bari Vecchia risks becoming an open-air museum.", grammar: [g.argumentation-connectors], vocab: [w.in-altre-parole] }
      - { es: "Del resto, chi vive in centro lo dice da anni.", en: "After all, the people who live in the centre have been saying so for years.", altEs: ["D'altronde, chi vive in centro lo dice da anni."], grammar: [g.argumentation-connectors], vocab: [w.del-resto] }
      - { es: "In sintesi, servono regole che favoriscano un turismo sostenibile.", en: "In short, we need rules that encourage sustainable tourism.", altEs: ["In breve, servono regole che favoriscano un turismo sostenibile."], grammar: [g.argumentation-connectors, g.relative-advanced], vocab: [w.in-sintesi, w.favorire] }
      - { es: "I voli economici hanno favorito la diffusione del turismo nel Sud.", en: "Cheap flights have encouraged the spread of tourism in the South.", grammar: [g.argumentation-connectors], vocab: [w.favorire, w.diffusione] }
      - { es: "Il problema deriva soprattutto dalla mancanza di case in affitto.", en: "The problem stems above all from the lack of houses to rent.", grammar: [g.argumentation-connectors], vocab: [w.derivare, w.mancanza] }
      - { es: "Dallo studio emerge che molti giovani lasciano la città per lavoro.", en: "The study shows that many young people leave the city for work.", altEs: ["Dallo studio risulta che molti giovani lasciano la città per lavoro."], grammar: [g.argumentation-connectors], vocab: [w.emergere, w.risultare] }
      - { es: "La crisi ha influito sulle scelte di molte famiglie.", en: "The crisis has affected the choices of many families.", altEs: ["La crisi ha influenzato le scelte di molte famiglie."], grammar: [g.argumentation-connectors], vocab: [w.influire, w.influenzare] }
      - { es: "Bisogna incentivare i giovani a restare, non ostacolarli.", en: "We need to encourage young people to stay, not hinder them.", grammar: [g.argumentation-connectors], vocab: [w.incentivare, w.ostacolare] }
      - { es: "Il progetto consiste nel restaurare le case vuote per affittarle agli studenti.", en: "The project consists of restoring empty houses to rent them to students.", grammar: [g.argumentation-connectors], vocab: [w.consistere] }
      - { es: "Il progetto è economico e veloce.", en: "The project is cheap and quick.", grammar: [g.argumentation-connectors], vocab: [], transform: { instruction: "Stress both qualities with non solo… ma anche", answer: "Il progetto non solo è economico, ma anche veloce.", alt: ["Il progetto è non solo economico, ma anche veloce."] } }
      - { es: "Bisogna ampliare l'offerta culturale, cioè aprire nuovi musei.", en: "We need to broaden the cultural offer, that is, open new museums.", grammar: [g.argumentation-connectors], vocab: [w.ampliare], transform: { instruction: "Replace cioè with a more formal connector", answer: "Bisogna ampliare l'offerta culturale, vale a dire aprire nuovi musei.", alt: ["Bisogna ampliare l'offerta culturale, ovvero aprire nuovi musei.", "Bisogna ampliare l'offerta culturale, ossia aprire nuovi musei."] } }
      - { es: "Lo stesso fenomeno si è verificato anche a Napoli e a Lecce.", en: "The same phenomenon has also occurred in Naples and Lecce.", grammar: [g.argumentation-connectors], vocab: [w.verificarsi] }
      - { es: "Per concludere, vorrei approfondire un ultimo punto.", en: "To conclude, I'd like to look more closely at one last point.", altEs: ["In conclusione, vorrei approfondire un ultimo punto."], grammar: [g.argumentation-connectors], vocab: [w.per-concludere, w.approfondire] }
    exchanges:
      - q: { es: "Perché sei contrario al nuovo parcheggio?", en: "Why are you against the new car park?" }
        a: { es: "Innanzitutto costa troppo; inoltre, aumenterebbe il traffico.", en: "First of all, it costs too much; moreover, it would increase the traffic." }
        alt: ["Costa troppo e aumenterebbe il traffico.", "In primo luogo costa troppo; in secondo luogo, porterebbe più traffico."]
        grammar: [g.argumentation-connectors]
        vocab: [w.contrario]
      - q: { es: "Che cosa vuol dire «sostenibile»?", en: "What does 'sustainable' mean?" }
        a: { es: "In altre parole, che non danneggia l'ambiente e dura nel tempo.", en: "In other words, that it doesn't damage the environment and lasts over time." }
        alt: ["Vale a dire che rispetta l'ambiente.", "Cioè che non danneggia l'ambiente."]
        grammar: [g.argumentation-connectors]
        vocab: [w.in-altre-parole]
      - q: { es: "Da che cosa deriva il problema?", en: "Where does the problem come from?" }
        a: { es: "Deriva soprattutto dalla mancanza di lavoro.", en: "It mainly comes from the lack of jobs." }
        alt: ["Dalla mancanza di lavoro.", "Soprattutto dalla disoccupazione."]
        grammar: [g.argumentation-connectors]
        vocab: [w.derivare, w.mancanza]
      - q: { es: "Che cosa è emerso dalla riunione?", en: "What came out of the meeting?" }
        a: { es: "È emerso che nessuno vuole pagare di più, ovviamente.", en: "It emerged that nobody wants to pay more, obviously." }
        alt: ["Che nessuno vuole pagare di più.", "Niente di nuovo, in definitiva."]
        grammar: [g.argumentation-connectors]
        vocab: [w.emergere]
      - q: { es: "Allora, per concludere?", en: "So, to conclude?" }
        a: { es: "In definitiva, propongo di approfondire il tema la settimana prossima.", en: "Ultimately, I propose we look into the topic further next week." }
        alt: ["Propongo di riparlarne la settimana prossima.", "Per concludere, approfondiamo il tema la prossima volta."]
        grammar: [g.argumentation-connectors]
        vocab: [w.in-definitiva, w.approfondire]
    texts:
      - title: "Scaletta di un intervento"
        es: ["In primo luogo, i dati: il turismo a Bari è cresciuto molto.", "In secondo luogo, le conseguenze, vale a dire affitti più alti.", "Infine, le proposte."]
        en: ["First, the figures: tourism in Bari has grown a lot.", "Second, the consequences, that is to say higher rents.", "Finally, the proposals."]
        grammar: [g.argumentation-connectors]
        vocab: [w.vale-a-dire]
      - title: "Dal giornale"
        es: ["La diffusione delle case per turisti ha cambiato Bari Vecchia.", "Da un lato ha portato lavoro; dall'altro ha fatto salire gli affitti.", "In definitiva, servono regole chiare."]
        en: ["The spread of holiday lets has changed Bari Vecchia.", "On the one hand it has brought jobs; on the other it has pushed rents up.", "Ultimately, clear rules are needed."]
        grammar: [g.argumentation-connectors]
        vocab: [w.diffusione, w.in-definitiva]
    spicy:
      - { es: "Innanzitutto sei bellissima; inoltre, cucini benissimo; per concludere, quando ci rivediamo?", en: "First of all, you're gorgeous; moreover, you cook brilliantly; to conclude, when are we seeing each other again?", altEs: ["Innanzitutto sei bellissimo; inoltre, cucini benissimo; per concludere, quando ci rivediamo?"], grammar: [g.argumentation-connectors], vocab: [w.per-concludere] }
      - { es: "In altre parole, mi stai chiedendo di uscire?", en: "In other words, are you asking me out?", grammar: [g.argumentation-connectors, g.stare-gerundio], vocab: [w.in-altre-parole] }
      - { es: "La tua presenza influisce in modo negativo sulla mia attenzione.", en: "Your presence has a negative effect on my attention span.", grammar: [g.argumentation-connectors], vocab: [w.influire] }
      - { es: "Del resto, chi resisterebbe a un piatto di orecchiette e a quegli occhi?", en: "After all, who could resist a plate of orecchiette and those eyes?", grammar: [g.argumentation-connectors, g.condizionale-uses], vocab: [w.del-resto, w.orecchiette] }
      - { es: "In sintesi: tu mi piaci, io ti piaccio, il resto sono dettagli.", en: "In short: I like you, you like me, the rest is detail.", grammar: [g.argumentation-connectors], vocab: [w.in-sintesi] }

  - id: b2.u10.l2
    title: A mio avviso
    teach: [g.opinion-structures]
    vocab: [w.avviso, w.a-mio-avviso, w.a-mio-parere, w.favorevole, w.contrario, w.schierarsi, w.opinione-pubblica, w.consenso, w.dissenso, w.obiezione, w.punto-debole, w.punto-di-forza, w.pro-e-contro, w.sostanzialmente, w.essenzialmente, w.indubbiamente, w.senzaltro, w.ovviamente, w.naturalmente, w.certamente, w.assolutamente, w.affatto, w.dibattito, w.dibattere, w.discutibile, w.fondato, w.infondato, w.valido, w.convincente]
    tip: "A mio avviso and è evidente che take the indicative; ritengo che, non è detto che, dubito che take the congiuntivo."
    sentences:
      - { es: "A mio avviso, il problema è più complesso di così.", en: "In my view, the problem is more complex than that.", altEs: ["A mio parere, il problema è più complesso di così.", "Secondo me, il problema è più complesso di così."], grammar: [g.opinion-structures], vocab: [w.a-mio-avviso, w.avviso] }
      - { es: "Non è detto che i turisti portino solo vantaggi.", en: "It doesn't follow that tourists bring only advantages.", altEs: ["Non è affatto detto che i turisti portino solo vantaggi."], grammar: [g.opinion-structures], vocab: [] }
      - { es: "È innegabile che Bari è cambiata molto negli ultimi vent'anni.", en: "It's undeniable that Bari has changed a lot in the last twenty years.", altEs: ["È innegabile che Bari sia cambiata molto negli ultimi vent'anni."], grammar: [g.opinion-structures], vocab: [] }
      - { es: "Sono favorevole all'isola pedonale, ma capisco le obiezioni dei negozi.", en: "I'm in favour of the pedestrian zone, but I understand the shops' objections.", grammar: [g.opinion-structures], vocab: [w.favorevole, w.obiezione] }
      - { es: "Dubito che il nuovo piano basti a risolvere il problema.", en: "I doubt the new plan will be enough to solve the problem.", grammar: [g.opinion-structures], vocab: [] }
      - { es: "Condivido in pieno la tua analisi, ma non le tue conclusioni.", en: "I fully agree with your analysis, but not with your conclusions.", grammar: [g.opinion-structures], vocab: [w.conclusione] }
      - { es: "Il punto di forza della proposta è il costo; il punto debole, i tempi.", en: "The strong point of the proposal is the cost; the weak point, the timescale.", grammar: [g.opinion-structures], vocab: [w.punto-di-forza, w.punto-debole] }
      - { es: "L'opinione pubblica si è schierata contro la riforma.", en: "Public opinion has come out against the reform.", altEs: ["L'opinione pubblica si è schierata contro la nuova riforma."], grammar: [g.opinion-structures], vocab: [w.opinione-pubblica, w.schierarsi] }
      - { es: "Mi permetto di dissentire: i dati non sono affatto convincenti.", en: "Allow me to disagree: the data are not at all convincing.", grammar: [g.opinion-structures], vocab: [w.affatto, w.convincente, w.dissentire] }
      - { es: "La tua obiezione è fondata, ma non cambia le cose.", en: "Your objection is well-founded, but it doesn't change things.", grammar: [g.opinion-structures], vocab: [w.obiezione, w.fondato] }
      - { es: "Non è affatto certo che il progetto ottenga il consenso necessario.", en: "It's not at all certain that the project will get the necessary consensus.", grammar: [g.opinion-structures], vocab: [w.affatto, w.consenso] }
      - { es: "Ritengo che sia una scelta discutibile.", en: "I believe it's a questionable choice.", altEs: ["Ritengo che si tratti di una scelta discutibile."], grammar: [g.opinion-structures, g.congiuntivo-opinion], vocab: [w.discutibile], error: { wrong: "Ritengo che è una scelta discutibile.", explain: "Ritenere che expresses an opinion, so it takes the congiuntivo: sia.", grammar: g.opinion-structures } }
      - { es: "Secondo me, è la scelta giusta.", en: "In my opinion, it's the right choice.", grammar: [g.opinion-structures], vocab: [], transform: { instruction: "Make it formal with ritenere", answer: "Ritengo che sia la scelta giusta.", alt: ["Ritengo che questa sia la scelta giusta."] } }
      - { es: "Credo che il sindaco abbia ragione.", en: "I think the mayor is right.", grammar: [g.opinion-structures], vocab: [], transform: { instruction: "Express doubt instead, with dubitare", answer: "Dubito che il sindaco abbia ragione.", alt: ["Io dubito che il sindaco abbia ragione."] } }
      - { es: "Sostanzialmente siamo d'accordo; cambia solo il modo di farlo.", en: "Basically we agree; only the way of doing it is different.", grammar: [g.opinion-structures], vocab: [w.sostanzialmente] }
      - { es: "Prima di decidere, valutiamo bene i pro e i contro.", en: "Before deciding, let's carefully weigh up the pros and cons.", grammar: [g.opinion-structures, g.imperativo-noi-voi], vocab: [w.pro-e-contro] }
    exchanges:
      - q: { es: "Sei favorevole o contrario alla nuova legge?", en: "Are you for or against the new law?" }
        a: { es: "Sostanzialmente favorevole, anche se ha qualche punto debole.", en: "Basically in favour, even though it has some weak points." }
        alt: ["Favorevole, con qualche dubbio.", "Contrario, a dire il vero."]
        grammar: [g.opinion-structures]
        vocab: [w.favorevole, w.contrario, w.punto-debole]
      - q: { es: "Pensi che vincerà il sì al referendum?", en: "Do you think the yes vote will win the referendum?" }
        a: { es: "Non è detto: l'opinione pubblica è molto divisa.", en: "Not necessarily: public opinion is very divided." }
        alt: ["Dubito che vinca.", "Indubbiamente sì."]
        grammar: [g.opinion-structures]
        vocab: [w.opinione-pubblica]
      - q: { es: "Verrai al dibattito di stasera?", en: "Will you come to tonight's debate?" }
        a: { es: "Senz'altro! Non me lo perderei per niente al mondo.", en: "Definitely! I wouldn't miss it for the world." }
        alt: ["Certamente!", "Naturalmente."]
        grammar: [g.opinion-structures]
        vocab: [w.dibattito, w.senzaltro]
      - q: { es: "Allora, sei d'accordo con me?", en: "So, do you agree with me?" }
        a: { es: "Assolutamente no: non sono affatto d'accordo.", en: "Absolutely not: I don't agree at all." }
        alt: ["Certamente sì!", "Ovviamente sì."]
        grammar: [g.opinion-structures]
        vocab: [w.assolutamente, w.affatto]
      - q: { es: "Che cosa pensi della proposta?", en: "What do you think of the proposal?" }
        a: { es: "Essenzialmente è valida, ma va spiegata meglio.", en: "Essentially it's sound, but it needs explaining better." }
        alt: ["È valida.", "A mio parere è discutibile."]
        grammar: [g.opinion-structures, g.passive-andare]
        vocab: [w.essenzialmente, w.valido]
    texts:
      - title: "Lettera al direttore"
        es: ["Gentile direttore, a mio parere la nuova isola pedonale è un'ottima idea.", "Certo, ci sono obiezioni fondate, come il problema dei parcheggi.", "Tuttavia ritengo che i vantaggi superino gli svantaggi."]
        en: ["Dear Editor, in my opinion the new pedestrian zone is an excellent idea.", "Of course, there are well-founded objections, such as the parking problem.", "However, I believe the advantages outweigh the disadvantages."]
        grammar: [g.opinion-structures]
        vocab: [w.a-mio-parere, w.obiezione, w.fondato]
      - title: "Sondaggio"
        es: ["Il sessanta per cento dei baresi è favorevole al progetto.", "Il dissenso è più forte tra chi ha un negozio in centro.", "Il dibattito, insomma, è ancora aperto."]
        en: ["Sixty per cent of Bari's residents are in favour of the project.", "Dissent is strongest among those who own a shop in the centre.", "The debate, in short, is still open."]
        grammar: [g.opinion-structures]
        vocab: [w.favorevole, w.dissenso, w.dibattito, w.barese]
    spicy:
      - { es: "A mio avviso dovremmo approfondire la nostra conoscenza. Stasera, a cena.", en: "In my view we should get to know each other better. Tonight, over dinner.", grammar: [g.opinion-structures], vocab: [w.a-mio-avviso, w.approfondire] }
      - { es: "Non è detto che il primo bacio debba arrivare al terzo appuntamento.", en: "Who says the first kiss has to wait for the third date?", grammar: [g.opinion-structures], vocab: [] }
      - { es: "Il tuo punto di forza? Gli occhi. Il tuo punto debole? Io.", en: "Your strong point? Your eyes. Your weak point? Me.", grammar: [g.opinion-structures], vocab: [w.punto-di-forza, w.punto-debole] }
      - { es: "Mi permetto di dissentire: non sei affatto «solo un amico».", en: "Allow me to disagree: you're not 'just a friend' at all.", altEs: ["Mi permetto di dissentire: non sei affatto «solo un'amica»."], grammar: [g.opinion-structures], vocab: [w.affatto] }
      - { es: "Ho valutato i pro e i contro di baciarti: vincono i pro.", en: "I've weighed up the pros and cons of kissing you: the pros win.", grammar: [g.opinion-structures], vocab: [w.pro-e-contro] }

  - id: b2.u10.l3
    title: Il tema argomentativo
    teach: [g.essay-structure]
    vocab: [w.argomentare, w.argomentazione, w.premessa, w.conclusione, w.saggio, w.paragrafo, w.introduzione, w.riassunto, w.riassumere, w.schema, w.bozza, w.correggere, w.coerente, w.incoerente, w.evidenziare, w.confutare, w.tendenza, w.aspetto, w.fattore, w.elemento, w.criterio, w.principio, w.concetto, w.prospettiva, w.approccio, w.strategia, w.priorità, w.esplicito, w.implicito, w.ambiguo, w.vago, w.dettagliato, w.accurato, w.chiarezza]
    tip: "Introduction with your thesis, two or three arguments, the opposing view, your rebuttal, a conclusion that sums up. One idea per paragraph."
    sentences:
      - { es: "Negli ultimi anni si discute molto della partenza dei giovani dal Sud.", en: "In recent years there has been much debate about young people leaving the South.", grammar: [g.essay-structure, g.si-impersonale], vocab: [] }
      - { es: "In questo saggio sosterrò che il problema non è solo economico.", en: "In this essay I will argue that the problem is not only economic.", grammar: [g.essay-structure], vocab: [w.saggio], error: { wrong: "In questo saggio sostenerò che il problema non è solo economico.", explain: "Sostenere is conjugated like tenere: the future is sosterrò.", grammar: g.essay-structure } }
      - { es: "Nell'introduzione bisogna presentare la tesi in modo esplicito.", en: "In the introduction you need to state the thesis explicitly.", grammar: [g.essay-structure], vocab: [w.introduzione, w.esplicito] }
      - { es: "Ogni paragrafo dovrebbe sviluppare un solo concetto.", en: "Each paragraph should develop a single idea.", grammar: [g.essay-structure], vocab: [w.paragrafo, w.concetto] }
      - { es: "Qualcuno potrebbe obiettare che il fenomeno riguarda tutta l'Europa.", en: "Someone might object that the phenomenon affects the whole of Europe.", grammar: [g.essay-structure], vocab: [w.obiettare] }
      - { es: "Per confutare questa tesi basta guardare i dati.", en: "To refute this thesis, you only need to look at the data.", grammar: [g.essay-structure], vocab: [w.confutare] }
      - { es: "Un esempio significativo è quello di Bari, dove negli ultimi anni sono arrivate nuove aziende.", en: "A significant example is Bari, where new companies have arrived in recent years.", grammar: [g.essay-structure], vocab: [] }
      - { es: "La tua argomentazione è coerente, ma la conclusione è troppo vaga.", en: "Your line of argument is coherent, but the conclusion is too vague.", grammar: [g.essay-structure], vocab: [w.argomentazione, w.coerente, w.vago] }
      - { es: "Prima di scrivere, faccio sempre uno schema dettagliato.", en: "Before writing, I always make a detailed outline.", grammar: [g.essay-structure], vocab: [w.schema, w.dettagliato] }
      - { es: "Ti mando la bozza: puoi correggerla entro domani?", en: "I'll send you the draft: can you correct it by tomorrow?", altEs: ["Ti mando la bozza: me la puoi correggere entro domani?"], grammar: [g.essay-structure], vocab: [w.bozza, w.correggere] }
      - { es: "Riassumi il testo in cento parole, evidenziando i fattori principali.", en: "Summarise the text in a hundred words, highlighting the main factors.", grammar: [g.essay-structure, g.gerundio-uses], vocab: [w.riassumere, w.evidenziare, w.fattore] }
      - { es: "La professoressa mi ha detto che la premessa era ambigua.", en: "The teacher told me that the premise was ambiguous.", grammar: [g.essay-structure], vocab: [w.premessa, w.ambiguo] }
      - { es: "Bisogna guardare il problema da una prospettiva diversa.", en: "We need to look at the problem from a different perspective.", grammar: [g.essay-structure], vocab: [w.prospettiva] }
      - { es: "I prezzi aumentano e le famiglie soffrono.", en: "Prices go up and families suffer.", grammar: [g.essay-structure], vocab: [], transform: { instruction: "Use the nominal style: L'aumento…", answer: "L'aumento dei prezzi fa soffrire le famiglie.", alt: ["L'aumento dei prezzi mette in difficoltà le famiglie."] } }
      - { es: "Io dico che i dati sono incompleti.", en: "I say the data are incomplete.", grammar: [g.essay-structure], vocab: [], transform: { instruction: "Make it impersonal with va detto che", answer: "Va detto che i dati sono incompleti.", alt: [] } }
      - { es: "Il criterio principale per valutare un saggio è la chiarezza.", en: "The main criterion for assessing an essay is clarity.", grammar: [g.essay-structure], vocab: [w.criterio, w.chiarezza] }
    exchanges:
      - q: { es: "Come si struttura un tema argomentativo?", en: "How is an argumentative essay structured?" }
        a: { es: "Introduzione con la tesi, argomenti, obiezioni, risposta alle obiezioni e conclusione.", en: "Introduction with the thesis, arguments, objections, a reply to the objections and a conclusion." }
        alt: ["Tesi, argomenti e conclusione.", "Prima la tesi, poi gli argomenti, infine la conclusione."]
        grammar: [g.essay-structure]
        vocab: [w.introduzione, w.conclusione]
      - q: { es: "Hai finito il saggio?", en: "Have you finished the essay?" }
        a: { es: "Ho solo una bozza: devo ancora correggere la conclusione.", en: "I've only got a draft: I still have to correct the conclusion." }
        alt: ["Quasi: manca la conclusione.", "Non ancora, ho solo una bozza."]
        grammar: [g.essay-structure]
        vocab: [w.saggio, w.bozza, w.correggere]
      - q: { es: "Che cosa non va nel mio paragrafo?", en: "What's wrong with my paragraph?" }
        a: { es: "È un po' vago: manca un esempio concreto.", en: "It's a bit vague: there's no concrete example." }
        alt: ["Manca un esempio.", "È troppo vago."]
        grammar: [g.essay-structure]
        vocab: [w.paragrafo, w.vago]
      - q: { es: "Qual è la tua strategia per l'esame scritto?", en: "What's your strategy for the written exam?" }
        a: { es: "Faccio uno schema, scrivo e poi rileggo tutto con calma.", en: "I make an outline, write, and then reread everything calmly." }
        alt: ["Prima uno schema, poi scrivo.", "Scrivo uno schema dettagliato."]
        grammar: [g.essay-structure]
        vocab: [w.strategia, w.schema]
      - q: { es: "Puoi riassumere la sua argomentazione?", en: "Can you summarise her line of argument?" }
        a: { es: "Essenzialmente sostiene che il problema dipende da più fattori.", en: "Essentially she argues that the problem depends on several factors." }
        alt: ["Dice che ci sono più fattori.", "In sintesi, che le cause sono tante."]
        grammar: [g.essay-structure]
        vocab: [w.riassumere, w.argomentazione, w.fattore]
    texts:
      - title: "Consigli per il tema"
        es: ["Prima di scrivere, fa' uno schema.", "Presenta la tesi nell'introduzione e dedica un paragrafo a ogni argomento.", "Non concludere con un'idea nuova: la conclusione riassume."]
        en: ["Before you write, make an outline.", "State your thesis in the introduction and give each argument its own paragraph.", "Don't end with a new idea: the conclusion sums up."]
        grammar: [g.essay-structure, g.imperativo-tu]
        vocab: [w.schema, w.introduzione, w.paragrafo, w.conclusione, w.riassumere]
      - title: "Introduzione di un saggio"
        es: ["Negli ultimi vent'anni migliaia di giovani hanno lasciato la Puglia.", "In questo saggio sosterrò che il fenomeno dipende da più fattori, non solo dal lavoro.", "Analizzerò prima i dati, poi le possibili strategie."]
        en: ["Over the last twenty years thousands of young people have left Puglia.", "In this essay I will argue that the phenomenon depends on several factors, not just work.", "I will first analyse the data, then the possible strategies."]
        grammar: [g.essay-structure]
        vocab: [w.saggio, w.fattore, w.strategia]
    spicy:
      - { es: "La premessa della serata era chiara, ma la conclusione è stata ancora meglio.", en: "The premise of the evening was clear, but the conclusion was even better.", grammar: [g.essay-structure], vocab: [w.premessa, w.conclusione] }
      - { es: "Ho fatto uno schema dettagliato per il nostro appuntamento: punto primo, il gelato.", en: "I've made a detailed outline for our date: point one, ice cream.", grammar: [g.essay-structure], vocab: [w.schema, w.dettagliato] }
      - { es: "Il tuo messaggio era ambiguo: «ci vediamo» vuol dire stasera o tra un mese?", en: "Your message was ambiguous: does 'see you' mean tonight or in a month?", grammar: [g.essay-structure], vocab: [w.ambiguo] }
      - { es: "Non mi servono argomentazioni: mi basta che tu dica di sì.", en: "I don't need arguments: it's enough for me that you say yes.", grammar: [g.essay-structure, g.congiuntivo-impersonal], vocab: [w.argomentazione] }
      - { es: "Priorità della serata: cena, passeggiata sul lungomare e, se fai il bravo, un bacio.", en: "Tonight's priorities: dinner, a walk along the seafront and, if you behave, a kiss.", altEs: ["Priorità della serata: cena, passeggiata sul lungomare e, se fai la brava, un bacio."], grammar: [g.essay-structure], vocab: [w.priorità] }

  - id: b2.u10.l4
    title: Questioni che contano
    teach: [g.argumentation-connectors, g.opinion-structures]
    vocab: [w.strumento, w.misura, w.provvedimento, w.efficace, w.globalizzazione, w.sanità, w.libertà, w.uguaglianza, w.disuguaglianza, w.discriminazione, w.razzismo, w.parità, w.diritti-umani, w.pena-di-morte, w.censura, w.privacy, w.violenza, w.sicurezza, w.criminalità, w.povertà-assoluta, w.benessere-sociale, w.welfare, w.pensioni, w.precariato-giovanile, w.fuga-di-cervelli, w.natalità, w.invecchiamento, w.abolire, w.penalizzare]
    tip: "On big social questions, combine connectors and hedges: È vero che…, tuttavia non è detto che…; a mio parere…, per cui…"
    sentences:
      - { es: "La fuga di cervelli è uno dei problemi principali del Sud.", en: "The brain drain is one of the main problems of the South.", grammar: [g.opinion-structures], vocab: [w.fuga-di-cervelli] }
      - { es: "A mio parere, il precariato giovanile influisce anche sulla natalità.", en: "In my opinion, job insecurity among the young also affects the birth rate.", grammar: [g.opinion-structures], vocab: [w.a-mio-parere, w.precariato-giovanile, w.natalità, w.influire] }
      - { es: "L'invecchiamento della popolazione mette a rischio il sistema delle pensioni.", en: "The ageing of the population puts the pension system at risk.", grammar: [g.argumentation-connectors], vocab: [w.invecchiamento, w.pensioni] }
      - { es: "Non è detto che più polizia significhi più sicurezza.", en: "More police doesn't necessarily mean more safety.", grammar: [g.opinion-structures], vocab: [w.sicurezza] }
      - { es: "Indubbiamente la sanità pubblica va difesa; d'altra parte, servono risorse.", en: "Undoubtedly public health care must be defended; on the other hand, resources are needed.", grammar: [g.opinion-structures, g.argumentation-connectors, g.passive-andare], vocab: [w.indubbiamente, w.sanità] }
      - { es: "In Italia la pena di morte è stata abolita; ciononostante, il dibattito continua altrove.", en: "In Italy the death penalty has been abolished; nevertheless, the debate continues elsewhere.", grammar: [g.argumentation-connectors], vocab: [w.pena-di-morte, w.abolire] }
      - { es: "Il razzismo e ogni forma di discriminazione vanno combattuti.", en: "Racism and every form of discrimination must be fought.", grammar: [g.passive-andare], vocab: [w.razzismo, w.discriminazione] }
      - { es: "La parità tra uomini e donne è un principio della Costituzione.", en: "Equality between men and women is a principle of the Constitution.", grammar: [g.opinion-structures], vocab: [w.parità, w.principio] }
      - { es: "La globalizzazione ha favorito alcuni paesi e ne ha penalizzati altri.", en: "Globalisation has favoured some countries and penalised others.", grammar: [g.argumentation-connectors, g.ne-participle-agreement], vocab: [w.globalizzazione, w.penalizzare] }
      - { es: "Tutto sommato, i nuovi provvedimenti si sono rivelati efficaci.", en: "All things considered, the new measures have proved effective.", grammar: [g.argumentation-connectors], vocab: [w.provvedimento, w.efficace] }
      - { es: "La censura limita la libertà di espressione.", en: "Censorship limits freedom of expression.", grammar: [g.argumentation-connectors], vocab: [w.censura, w.libertà, w.limitare] }
      - { es: "Sostengo che la privacy sia un diritto, non un lusso.", en: "I maintain that privacy is a right, not a luxury.", altEs: ["Sostengo che la privacy è un diritto, non un lusso."], grammar: [g.opinion-structures], vocab: [w.privacy] }
      - { es: "Le nuove misure ridurranno la povertà.", en: "The new measures will reduce poverty.", grammar: [g.opinion-structures], vocab: [w.misura], transform: { instruction: "Hedge it with non è detto che", answer: "Non è detto che le nuove misure riducano la povertà.", alt: [] } }
      - { es: "Il precariato è un problema; anche la natalità è un problema.", en: "Job insecurity is a problem; the birth rate is a problem too.", grammar: [g.argumentation-connectors], vocab: [w.natalità], transform: { instruction: "Join them with non solo… ma anche", answer: "Non solo il precariato, ma anche la natalità è un problema.", alt: ["Non solo il precariato è un problema, ma anche la natalità."] } }
      - { es: "Non è detto che la misura funzioni nelle piccole città.", en: "It doesn't follow that the measure will work in small towns.", grammar: [g.opinion-structures], vocab: [w.misura], error: { wrong: "Non è detto che la misura funziona nelle piccole città.", explain: "Non è detto che expresses doubt, so it takes the congiuntivo: funzioni.", grammar: g.opinion-structures } }
      - { es: "Il welfare dovrebbe essere uno strumento contro la povertà assoluta.", en: "Welfare should be a tool against absolute poverty.", grammar: [g.opinion-structures], vocab: [w.welfare, w.strumento, w.povertà-assoluta] }
    exchanges:
      - q: { es: "Secondo te, perché tanti giovani partono?", en: "Why do you think so many young people leave?" }
        a: { es: "Innanzitutto per il lavoro; inoltre, per la mancanza di servizi.", en: "First of all for work; moreover, because of the lack of services." }
        alt: ["Per il lavoro, soprattutto.", "Per il precariato, direi."]
        grammar: [g.argumentation-connectors]
        vocab: [w.mancanza]
      - q: { es: "Sei favorevole alla pena di morte?", en: "Are you in favour of the death penalty?" }
        a: { es: "Assolutamente no: a mio avviso è contraria ai diritti umani.", en: "Absolutely not: in my view it goes against human rights." }
        alt: ["No, per niente.", "Assolutamente no."]
        grammar: [g.opinion-structures]
        vocab: [w.pena-di-morte, w.diritti-umani]
      - q: { es: "I nuovi provvedimenti funzionano?", en: "Are the new measures working?" }
        a: { es: "Non è detto: è presto per giudicare.", en: "Not necessarily: it's too early to judge." }
        alt: ["È presto per dirlo.", "Sembrano efficaci."]
        grammar: [g.opinion-structures]
        vocab: [w.provvedimento]
      - q: { es: "Che cosa servirebbe per aumentare la natalità?", en: "What would it take to raise the birth rate?" }
        a: { es: "Più asili, più parità sul lavoro e meno precariato.", en: "More nurseries, more equality at work and less job insecurity." }
        alt: ["Più servizi per le famiglie.", "Stipendi più alti, innanzitutto."]
        grammar: [g.argumentation-connectors]
        vocab: [w.natalità, w.parità]
      - q: { es: "Qual è la priorità per il Sud, secondo te?", en: "What's the priority for the South, in your view?" }
        a: { es: "A mio parere, fermare la fuga di cervelli.", en: "In my opinion, stopping the brain drain." }
        alt: ["Il lavoro per i giovani.", "Fermare la fuga di cervelli, senz'altro."]
        grammar: [g.opinion-structures]
        vocab: [w.priorità, w.fuga-di-cervelli]
    texts:
      - title: "Tema: la fuga di cervelli"
        es: ["Ogni anno migliaia di laureati lasciano il Sud.", "Le cause sono note: precariato, stipendi bassi e pochi servizi.", "Tuttavia, non è detto che il fenomeno non si possa fermare."]
        en: ["Every year thousands of graduates leave the South.", "The causes are well known: insecure jobs, low pay and few services.", "However, that doesn't mean the trend can't be stopped."]
        grammar: [g.opinion-structures, g.argumentation-connectors]
        vocab: [w.fuga-di-cervelli]
      - title: "Volantino"
        es: ["Sabato in piazza del Ferrarese: incontro sui diritti umani.", "Parleremo di discriminazione, razzismo e parità.", "Ingresso libero."]
        en: ["Saturday in Piazza del Ferrarese: a meeting on human rights.", "We'll talk about discrimination, racism and equality.", "Free entry."]
        grammar: [g.futuro-semplice]
        vocab: [w.diritti-umani, w.discriminazione, w.razzismo, w.parità]
    spicy:
      - { es: "Tra noi due c'è perfetta parità: tu paghi la cena, io il gelato.", en: "There's perfect equality between us: you pay for dinner, I pay for the ice cream.", grammar: [g.argumentation-connectors], vocab: [w.parità] }
      - { es: "La mia privacy è importante, ma per te potrei fare un piccolo strappo alla regola.", en: "My privacy matters, but for you I could bend the rules a little.", grammar: [g.argumentation-connectors, g.condizionale-presente], vocab: [w.privacy] }
      - { es: "A mio avviso la sicurezza viene prima di tutto: per questo stasera ti accompagno fino al portone.", en: "In my view safety comes first: that's why tonight I'm walking you right to your front door.", grammar: [g.opinion-structures], vocab: [w.sicurezza, w.a-mio-avviso] }
      - { es: "Garantisco piena libertà di scelta: pizza o orecchiette, purché sia con me.", en: "I guarantee complete freedom of choice: pizza or orecchiette, as long as it's with me.", grammar: [g.opinion-structures, g.congiuntivo-conjunctions], vocab: [w.libertà, w.garantire] }
      - { es: "Contro l'invecchiamento ho una sola strategia: ridere con te ogni giorno.", en: "I've got just one strategy against ageing: laughing with you every day.", grammar: [g.argumentation-connectors], vocab: [w.invecchiamento, w.strategia] }

dialogues:
  - id: b2.u10.d1
    title: Dibattito a Bari Vecchia
    context: A local radio debate in Bari. A professor and Antonietta, who makes orecchiette outside her door in the old town, discuss whether holiday lets should be limited.
    lines:
      - { speaker: Moderatrice, es: "Buonasera e benvenuti. Il tema di stasera: bisogna limitare le case per turisti a Bari Vecchia?", en: "Good evening and welcome. Tonight's topic: should holiday lets in Bari Vecchia be limited?" }
      - { speaker: Professore, es: "A mio avviso, sì. Innanzitutto, gli affitti sono raddoppiati; inoltre, molte famiglie hanno dovuto lasciare il quartiere.", en: "In my view, yes. First of all, rents have doubled; moreover, many families have had to leave the neighbourhood." }
      - { speaker: Antonietta, es: "Mi permetto di dissentire. Faccio le orecchiette davanti alla porta di casa da quarant'anni, e prima dei turisti in questi vicoli non passava nessuno.", en: "Allow me to disagree. I've been making orecchiette outside my front door for forty years, and before the tourists nobody came down these alleys." }
      - { speaker: Professore, es: "È vero che il turismo ha portato lavoro, ma non è detto che porti benessere a tutti.", en: "It's true that tourism has brought work, but it doesn't follow that it brings prosperity to everyone." }
      - { speaker: Antonietta, es: "D'altronde, professore, Lei abita a Poggiofranco, non in centro!", en: "Besides, professor, you live in Poggiofranco, not in the centre!" }
      - { speaker: Moderatrice, es: "Per favore, restiamo sugli argomenti. Professore, quali misure propone?", en: "Please, let's stick to the arguments. Professor, what measures do you propose?" }
      - { speaker: Professore, es: "Essenzialmente due: un limite al numero di case per turisti e incentivi per chi affitta agli studenti.", en: "Essentially two: a cap on the number of holiday lets and incentives for those who rent to students." }
      - { speaker: Antonietta, es: "Su questo punto ha ragione: nemmeno mio nipote trova una stanza.", en: "On that point you're right: not even my grandson can find a room." }
      - { speaker: Moderatrice, es: "Quindi, in sintesi, siete più d'accordo di quanto pensavate?", en: "So, in short, you agree more than you thought?" }
      - { speaker: Antonietta, es: "Diciamo che il professore ha qualche argomento valido. Ma le orecchiette restano mie!", en: "Let's say the professor has a few valid arguments. But the orecchiette stay mine!" }
    questions:
      - { q: "Qual è il tema del dibattito?", options: ["Il traffico in centro", "Le case per turisti a Bari Vecchia", "La fuga di cervelli"], answer: 1, explain: "'Bisogna limitare le case per turisti a Bari Vecchia?'" }
      - { q: "Che cosa fa Antonietta da quarant'anni?", options: ["Insegna all'università", "Fa le orecchiette davanti a casa", "Affitta case ai turisti"], answer: 1, explain: "She makes orecchiette outside her front door." }
      - { q: "Quali misure propone il professore?", options: ["Chiudere il centro ai turisti", "Un limite alle case per turisti e incentivi per chi affitta agli studenti", "Più tasse sulle orecchiette"], answer: 1, explain: "'Essenzialmente due: un limite… e incentivi per chi affitta agli studenti.'" }
      - { q: "Su che cosa è d'accordo Antonietta alla fine?", options: ["Sul problema delle stanze per gli studenti", "Sul prezzo delle orecchiette", "Sul quartiere dove abita il professore"], answer: 0, explain: "Her grandson can't find a room either." }
