  - id: a2.u07.l4
    title: 十蚊咋
    teach: [g.zaa3-ze1-only]
    tip: "咋 (zaa3) means 'only, that's all' (less than you'd think); 啫 (ze1) plays something down: 'just, no big deal'."
    vocab: [w.zaa3, w.ze1.b, w.gong2-siu3, w.siu2-si6, w.mou5-si6, w.gwaa3, w.m4-hai6-aa3, w.gong2-je5, w.sin1-zi3, w.dit3-can1]
    sentences:
      - { es: "呢杯茶十五蚊咋，好抵。", en: "This cup of tea is only fifteen dollars, great value.", altEs: ["呢杯茶十五蚊咋，好抵飲。", "呢杯茶先至十五蚊咋，好抵。"], grammar: [g.zaa3-ze1-only, g.money], vocab: [w.zaa3, w.man1, w.dai2] }
      - { es: "我得一百蚊咋。", en: "I've only got a hundred dollars.", altEs: ["我淨係得一百蚊咋。", "我身上得一百蚊咋。"], grammar: [g.zaa3-ze1-only, g.zing-hai-only], vocab: [w.zaa3, w.baak3] }
      - { es: "我等咗五分鐘咋，唔緊要。", en: "I only waited five minutes, it's fine.", altEs: ["我先至等咗五分鐘咋，唔緊要。", "我等咗五分鐘咋，冇事。"], grammar: [g.zaa3-ze1-only, g.duration], vocab: [w.fan1-zung1, w.m4-gan2-jiu3], error: { wrong: "我等咗咋五分鐘，唔緊要。", explain: "咋 goes at the very end of the sentence, never in the middle.", grammar: g.zaa3-ze1-only } }
      - { es: "由鑽石山站行過去，五分鐘咋。", en: "It's only a five-minute walk from Diamond Hill station.", altEs: ["由鑽石山站行過去五分鐘咋。", "由鑽石山站行五分鐘咋。"], grammar: [g.zaa3-ze1-only, g.duration], vocab: [w.jau4, w.zaam6, w.haang4] }
      - { es: "佢先至三歲咋，已經識講英文。", en: "She's only three and she can already speak English.", altEs: ["佢三歲咋，已經識講英文。"], altEn: ["He's only three and can already speak English."], grammar: [g.zaa3-ze1-only, g.age], vocab: [w.sin1-zi3, w.seoi3, w.jing1-man2] }
      - { es: "唔緊要，小事啫。", en: "Never mind, it's nothing.", altEs: ["唔緊要，小事嚟啫。", "冇所謂，小事啫。"], altEn: ["Don't worry, it's no big deal."], grammar: [g.zaa3-ze1-only], vocab: [w.siu2-si6, w.ze1.b] }
      - { es: "我講笑啫，唔好嬲啦。", en: "I'm only joking, don't be angry.", altEs: ["講笑啫，唔好嬲啦。", "我講吓笑啫，唔好嬲啦。"], grammar: [g.zaa3-ze1-only, g.m-hou-dont], vocab: [w.gong2-siu3, w.nau1] }
      - { es: "我問吓啫，你唔想講就算啦。", jp: "ngo5 man6 haa5 ze1 nei5 m4 soeng2 gong2 zau6 syun3 laa1", en: "I'm just asking; if you don't want to say, forget it.", altEs: ["我問吓啫，唔想講就算啦。"], grammar: [g.zaa3-ze1-only, g.zau-then], vocab: [w.man6, w.syun3-laa1] }
      - { es: "十蚊咋？咁平嘅？", en: "Only ten dollars? That cheap?", altEs: ["十蚊咋？咁平呀？", "十蚊咋？真係咁平？"], grammar: [g.zaa3-ze1-only], vocab: [w.zaa3, w.peng4] }
      - { es: "佢今日唔嚟啩，佢話有啲唔舒服。", en: "She's probably not coming today, she said she's a bit unwell.", altEs: ["佢今日應該唔嚟啩，佢話有啲唔舒服。"], altEn: ["I suppose he won't come today, he said he wasn't feeling well."], grammar: [g.jau-di-a-bit], vocab: [w.gwaa3, w.m4-syu1-fuk6] }
      - { es: "冇事，我跌親少少咋。", en: "I'm fine, I only hurt myself a little when I fell.", altEs: ["冇事，跌親少少咋。", "冇事呀，我跌親少少啫。"], grammar: [g.zaa3-ze1-only], vocab: [w.mou5-si6, w.dit3-can1] }
      - { es: "佢講嘢好細聲，我聽唔到。", en: "He speaks very quietly, I can't hear him.", altEs: ["佢講嘢好細聲，我聽唔到佢講乜。"], altEn: ["She talks so softly that I can't hear her."], grammar: [g.potential-complements, g.dak-descriptive], vocab: [w.gong2-je5, w.sai3-seng1, w.teng1-m4-dou2] }
      - { es: "唔係呀，我淨係得閒一陣咋。", en: "Not really, I'm only free for a little while.", altEs: ["唔係呀，我得閒一陣咋。"], grammar: [g.zaa3-ze1-only, g.zing-hai-only], vocab: [w.m4-hai6-aa3, w.dak1-haan4, w.jat1-zan6] }
      - { es: "呢件衫五十蚊。", en: "This top is fifty dollars.", altEs: ["呢件衫五十蚊㗎。"], grammar: [g.prices-gei-do-cin], vocab: [w.saam1.b, w.man1], transform: { instruction: "Say it's surprisingly cheap with 咋", answer: "呢件衫五十蚊咋。", alt: ["呢件衫先至五十蚊咋。"], en: "This top is only fifty dollars." } }
      - { es: "我得三日假期。", en: "I've got three days off.", altEs: ["我有三日假期。"], grammar: [g.zing-hai-only], vocab: [w.gaa3-kei4], transform: { instruction: "Stress how little it is with 咋", answer: "我得三日假期咋。", alt: ["我淨係得三日假期咋。"], en: "I've only got three days off." } }
    exchanges:
      - q: { es: "一杯茶幾錢呀？", en: "How much is a cup of tea?" }
        a: { es: "十五蚊咋。", en: "Only fifteen dollars." }
        alt: ["十五蚊。", "先至十五蚊咋。"]
        grammar: [g.zaa3-ze1-only, g.prices-gei-do-cin]
        vocab: [w.zaa3, w.gei2-cin2]
      - q: { es: "你等咗好耐呀？", en: "Have you been waiting long?" }
        a: { es: "唔係呀，五分鐘咋。", en: "Not really, only five minutes." }
        alt: ["五分鐘咋。", "唔係好耐，十分鐘咋。"]
        grammar: [g.zaa3-ze1-only, g.duration]
        vocab: [w.m4-hai6-aa3, w.fan1-zung1]
      - q: { es: "你冇事呀？", en: "Are you OK?" }
        a: { es: "冇事，跌親少少啫。", en: "I'm fine, I just hurt myself a little when I fell." }
        alt: ["冇事，小事啫。", "冇事，唔緊要。"]
        grammar: [g.zaa3-ze1-only]
        vocab: [w.mou5-si6, w.dit3-can1]
      - q: { es: "你真係要搬去英國？", en: "Are you really moving to the UK?" }
        a: { es: "講笑啫！我唔會走。", en: "Just kidding! I'm not leaving." }
        alt: ["唔係呀，我講笑咋。", "講笑咋。"]
        grammar: [g.zaa3-ze1-only, g.wui-will]
        vocab: [w.gong2-siu3, w.bun1]
      - q: { es: "佢幾點到呀？", en: "What time is he arriving?" }
        a: { es: "七點啩，我唔係好知。", en: "Seven, I think, I'm not really sure." }
        alt: ["七點啩。", "大概七點啩。"]
        grammar: [g.clock-time]
        vocab: [w.gwaa3, w.cing1-co2]
    texts:
      - title: "遊客指南"
        es: ["南蓮園池喺鑽石山，由地鐵站行過去五分鐘咋。", "入去唔使錢，不過唔好大聲講嘢。", "我淨係行咗一個鐘，已經好想再嚟。"]
        en: ["Nan Lian Garden is in Diamond Hill, only a five-minute walk from the MTR station.", "It's free to go in, but don't talk loudly.", "I only walked around for an hour and I already want to come back."]
        grammar: [g.zaa3-ze1-only, g.zing-hai-only]
        vocab: [w.zaa3, w.gong2-je5, w.daai6-seng1]
