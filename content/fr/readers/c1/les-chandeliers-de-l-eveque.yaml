id: r.c1.les-chandeliers-de-l-eveque
level: c1
title: Les chandeliers de l'évêque
kind: literature
author: Victor Hugo (1802–1885)
source: "Les Misérables, première partie (Fantine), livre deuxième, chapitre XII, « L'évêque travaille » (1862). Domaine public. Texte légèrement abrégé d'après l'édition du Projet Gutenberg (n° 17489) ; les coupures sont marquées par (…), la ligature œ est rétablie."
intro: "The turning point of Les Misérables: the morning after Jean Valjean has stolen the bishop's silver. The first paragraph is an editorial summary written for this course; the rest is Hugo's text, with cuts marked (…). Notice the bishop's calm, almost playful replies, the gendarmes' formal register (Monseigneur, votre grandeur) and the solemn final blessing."
allow: [abomination, significative, violent, militaire, humaine, hugo, valjean, jean, myriel, bienvenu, digne, magloire, cochefilet, jésus, jésus-dieu, monseigneur, grandeur, brigadier, gendarmerie, gendarmes, gendarme]
paragraphs:
  - { es: "Dans Les Misérables, Victor Hugo raconte l'histoire de Jean Valjean, un ancien forçat qui a passé dix-neuf ans au bagne pour avoir volé un pain. À sa libération, tout le monde le rejette, sauf l'évêque de Digne, que les pauvres surnomment « monseigneur Bienvenu » : il l'invite à sa table et lui offre un lit. Pendant la nuit, Valjean vole l'argenterie de l'évêque et s'enfuit par le jardin. Le lendemain matin, madame Magloire, la servante, découvre le vol.", en: "In Les Misérables, Victor Hugo tells the story of Jean Valjean, a former convict who spent nineteen years in prison with hard labour for stealing a loaf of bread. On his release everyone rejects him except the Bishop of Digne, whom the poor call 'Monseigneur Bienvenu' (Monsignor Welcome): he invites him to his table and offers him a bed. During the night Valjean steals the bishop's silver and escapes through the garden. The next morning Madame Magloire, the servant, discovers the theft." }
  - { es: "Le lendemain, au soleil levant, monseigneur Bienvenu se promenait dans son jardin. Madame Magloire accourut vers lui toute bouleversée. — Monseigneur, monseigneur, cria-t-elle, votre grandeur sait-elle où est le panier d'argenterie ? — Oui, dit l'évêque. — Jésus-Dieu soit béni ! reprit-elle. Je ne savais ce qu'il était devenu. L'évêque venait de ramasser le panier dans une plate-bande. Il le présenta à madame Magloire. — Le voilà. — Eh bien ? dit-elle. Rien dedans ! et l'argenterie ?", en: "The next morning, at sunrise, Monseigneur Bienvenu was walking in his garden. Madame Magloire ran up to him, very upset. 'Monseigneur, Monseigneur,' she cried, 'does Your Grace know where the silver basket is?' 'Yes,' said the bishop. 'Jesus be praised!' she went on. 'I didn't know what had become of it.' The bishop had just picked up the basket in a flower bed. He handed it to Madame Magloire. 'Here it is.' 'Well?' she said. 'Nothing in it! And the silver?'" }
  - { es: "— Ah ! repartit l'évêque. C'est donc l'argenterie qui vous occupe ? Je ne sais où elle est. — Grand bon Dieu ! elle est volée ! C'est l'homme d'hier soir qui l'a volée ! (…) — Tenez ! c'est par là qu'il s'en est allé. Il a sauté dans la ruelle Cochefilet ! Ah ! l'abomination ! Il nous a volé notre argenterie ! L'évêque resta un moment silencieux, puis leva son œil sérieux, et dit à madame Magloire avec douceur : — Et d'abord, cette argenterie était-elle à nous ?", en: "'Ah!' replied the bishop. 'So it's the silver you're worried about? I don't know where it is.' 'Good heavens! It's been stolen! It's the man from last night who stole it!' (…) 'Look! That's the way he went. He jumped into the Rue Cochefilet! Oh, the abomination! He has stolen our silver!' The bishop was silent for a moment, then raised his grave eyes and said gently to Madame Magloire: 'And first of all, was that silver ours?'" }
  - { es: "Madame Magloire resta interdite. Il y eut encore un silence, puis l'évêque continua : — Madame Magloire, je détenais à tort et depuis longtemps cette argenterie. Elle était aux pauvres. Qu'était-ce que cet homme ? Un pauvre évidemment. — Hélas Jésus ! repartit madame Magloire. (…) Mais c'est pour monseigneur. Dans quoi monseigneur va-t-il manger maintenant ? L'évêque la regarda d'un air étonné. — Ah çà mais ! est-ce qu'il n'y a pas des couverts d'étain ? Madame Magloire haussa les épaules. — L'étain a une odeur. — Alors, des couverts de fer. Madame Magloire fit une grimace significative. — Le fer a un goût. — Eh bien, dit l'évêque, des couverts de bois.", en: "Madame Magloire was speechless. There was another silence, then the bishop went on: 'Madame Magloire, I had been wrongly keeping that silver for a long time. It belonged to the poor. Who was that man? A poor man, obviously.' 'Oh, Lord Jesus!' replied Madame Magloire. '(…) But it's for Monseigneur's sake. What is Monseigneur going to eat with now?' The bishop looked at her in astonishment. 'Well now! Aren't there pewter spoons and forks?' Madame Magloire shrugged. 'Pewter has a smell.' 'Iron ones, then.' Madame Magloire pulled a meaningful face. 'Iron has a taste.' 'Very well,' said the bishop, 'wooden ones.'" }
  - { es: "(…) Comme le frère et la sœur allaient se lever de table, on frappa à la porte. — Entrez, dit l'évêque. La porte s'ouvrit. Un groupe étrange et violent apparut sur le seuil. Trois hommes en tenaient un quatrième au collet. Les trois hommes étaient des gendarmes ; l'autre était Jean Valjean. Un brigadier de gendarmerie, qui semblait conduire le groupe, était près de la porte. Il entra et s'avança vers l'évêque en faisant le salut militaire. — Monseigneur… dit-il.", en: "(…) As the brother and sister were about to get up from the table, there was a knock at the door. 'Come in,' said the bishop. The door opened. A strange and violent group appeared on the threshold. Three men were holding a fourth by the collar. The three men were gendarmes; the other was Jean Valjean. A gendarme sergeant, who seemed to be leading the group, stood near the door. He came in and stepped towards the bishop, giving a military salute. 'Monseigneur…' he said." }
  - { es: "À ce mot Jean Valjean, qui était morne et semblait abattu, releva la tête d'un air stupéfait. — Monseigneur ! murmura-t-il. Ce n'est donc pas le curé ?… — Silence ! dit un gendarme. C'est monseigneur l'évêque. Cependant monseigneur Bienvenu s'était approché aussi vivement que son grand âge le lui permettait. — Ah ! vous voilà ! s'écria-t-il en regardant Jean Valjean. Je suis aise de vous voir. Et bien mais ! je vous avais donné les chandeliers aussi, qui sont en argent comme le reste et dont vous pourrez bien avoir deux cents francs. Pourquoi ne les avez-vous pas emportés avec vos couverts ?", en: "At that word Jean Valjean, who was gloomy and seemed crushed, raised his head with a look of amazement. 'Monseigneur!' he murmured. 'So he's not the parish priest?…' 'Silence!' said a gendarme. 'This is Monseigneur the Bishop.' Meanwhile Monseigneur Bienvenu had come forward as quickly as his great age allowed. 'Ah! There you are!' he exclaimed, looking at Jean Valjean. 'I'm glad to see you. Well now! I had given you the candlesticks too, which are silver like the rest and for which you could easily get two hundred francs. Why didn't you take them with your spoons and forks?'" }
  - { es: "Jean Valjean ouvrit les yeux et regarda le vénérable évêque avec une expression qu'aucune langue humaine ne pourrait rendre. — Monseigneur, dit le brigadier de gendarmerie, ce que cet homme disait était donc vrai ? Nous l'avons rencontré. Il allait comme quelqu'un qui s'en va. Nous l'avons arrêté pour voir. Il avait cette argenterie… — Et il vous a dit, interrompit l'évêque en souriant, qu'elle lui avait été donnée par un vieux bonhomme de prêtre chez lequel il avait passé la nuit ? Je vois la chose. Et vous l'avez ramené ici ? C'est une méprise.", en: "Jean Valjean opened his eyes wide and looked at the venerable bishop with an expression no human tongue could describe. 'Monseigneur,' said the sergeant, 'so what this man was saying was true? We came across him. He was walking like someone running away. We stopped him to check. He had this silver…' 'And he told you,' the bishop interrupted with a smile, 'that it had been given to him by an old fellow of a priest at whose house he had spent the night? I see. And you brought him back here? It's a misunderstanding.'" }
  - { es: "— Comme cela, reprit le brigadier, nous pouvons le laisser aller ? — Sans doute, répondit l'évêque. Les gendarmes lâchèrent Jean Valjean qui recula. (…) — Mon ami, reprit l'évêque, avant de vous en aller, voici vos chandeliers. Prenez-les. Il alla à la cheminée, prit les deux flambeaux d'argent et les apporta à Jean Valjean. Les deux femmes le regardaient faire sans un mot, sans un geste, sans un regard qui pût déranger l'évêque. Jean Valjean tremblait de tous ses membres. Il prit les deux chandeliers machinalement et d'un air égaré.", en: "'In that case,' the sergeant went on, 'we can let him go?' 'Of course,' replied the bishop. The gendarmes let go of Jean Valjean, who stepped back. (…) 'My friend,' the bishop went on, 'before you go, here are your candlesticks. Take them.' He went to the mantelpiece, took the two silver candlesticks and brought them to Jean Valjean. The two women watched him do it without a word, without a gesture, without a look that might disturb the bishop. Jean Valjean was trembling in every limb. He took the two candlesticks mechanically, with a bewildered air." }
  - { es: "— Maintenant, dit l'évêque, allez en paix. (…) Puis se tournant vers la gendarmerie : — Messieurs, vous pouvez vous retirer. Les gendarmes s'éloignèrent. Jean Valjean était comme un homme qui va s'évanouir. L'évêque s'approcha de lui, et lui dit à voix basse : — N'oubliez pas, n'oubliez jamais que vous m'avez promis d'employer cet argent à devenir honnête homme.", en: "'Now,' said the bishop, 'go in peace.' (…) Then, turning to the gendarmes: 'Gentlemen, you may withdraw.' The gendarmes went away. Jean Valjean was like a man about to faint. The bishop went up to him and said in a low voice: 'Do not forget, never forget, that you have promised me to use this money to become an honest man.'" }
  - { es: "Jean Valjean, qui n'avait aucun souvenir d'avoir rien promis, resta interdit. L'évêque avait appuyé sur ces paroles en les prononçant. Il reprit avec une sorte de solennité : — Jean Valjean, mon frère, vous n'appartenez plus au mal, mais au bien. C'est votre âme que je vous achète ; je la retire aux pensées noires et à l'esprit de perdition, et je la donne à Dieu.", en: "Jean Valjean, who had no memory of having promised anything, stood speechless. The bishop had stressed these words as he spoke them. He went on with a kind of solemnity: 'Jean Valjean, my brother, you no longer belong to evil, but to good. It is your soul that I am buying from you; I take it away from dark thoughts and the spirit of perdition, and I give it to God.'" }
questions:
  - { q: "Comment l'évêque réagit-il quand il apprend le vol ?", options: ["Il appelle aussitôt les gendarmes", "Il reste calme et dit que l'argenterie appartenait aux pauvres", "Il se met en colère contre madame Magloire"], answer: 1, explain: "«Cette argenterie était-elle à nous ? … Elle était aux pauvres. … Un pauvre évidemment.»" }
  - { q: "Pourquoi Jean Valjean est-il stupéfait quand le brigadier dit « Monseigneur » ?", options: ["Il ne savait pas que son hôte était l'évêque", "Il ne connaît pas ce mot", "Il croyait que l'évêque était mort"], answer: 0, explain: "«Ce n'est donc pas le curé ?» — he thought his host was an ordinary parish priest." }
  - { q: "Que fait l'évêque pour sauver Jean Valjean ?", options: ["Il paie les gendarmes", "Il affirme qu'il lui a donné l'argenterie et lui offre en plus les chandeliers", "Il le cache dans le jardin"], answer: 1, explain: "He says «je vous avais donné les chandeliers aussi», so the silver was a gift and there was «une méprise»." }
  - { q: "Que signifie « Madame Magloire resta interdite » ?", options: ["Elle n'eut plus le droit de parler", "Elle ne sut quoi répondre, stupéfaite", "Elle quitta la maison"], answer: 1, explain: "rester interdit(e) = to be dumbfounded, speechless; it has nothing to do with interdire (to forbid) here." }
  - { q: "Quelle « promesse » l'évêque rappelle-t-il à Valjean ?", options: ["De revenir le voir chaque dimanche", "D'employer cet argent à devenir honnête homme", "De rendre les chandeliers"], answer: 1, explain: "Valjean never made it: the bishop invents the promise, «vous m'avez promis d'employer cet argent à devenir honnête homme», to change his life." }
