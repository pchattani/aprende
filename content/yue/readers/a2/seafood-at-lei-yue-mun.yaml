id: r.a2.seafood-at-lei-yue-mun
level: a2
title: 一齊去鯉魚門食海鮮好唔好？
kind: dialogue
intro: Mandy phones Kelvin to invite him to a seafood dinner at Lei Yue Mun for Ana's birthday. The call goes to voicemail first, then they make plans and book a table.
paragraphs:
  - { es: "星期三晏晝，Mandy打電話畀Kelvin，但係冇人聽。佢留咗個口訊：「喂，Kelvin，我係Mandy呀。有啲嘢想問你，你得閒覆我電話吖。」", en: "On Wednesday afternoon Mandy calls Kelvin, but nobody answers. She leaves a message: \"Hi, Kelvin, it's Mandy. There's something I want to ask you; call me back when you're free.\"" }
  - { es: "半個鐘之後，電話響喇。Kelvin：「喂，Mandy？頭先我喺度開會，唔方便聽電話。咩事呀？」Mandy：「下個禮拜六係Ana生日，我想請佢食飯。不如我哋一齊去鯉魚門食海鮮，好唔好？」", en: "Half an hour later, the phone rings. Kelvin: \"Hello, Mandy? I was in a meeting just now and couldn't take the call. What's up?\" Mandy: \"Next Saturday is Ana's birthday, and I want to take her out for dinner. Why don't we all go for seafood at Lei Yue Mun?\"" }
  - { es: "Kelvin：「好主意！Ana未去過鯉魚門。喺鯉魚門，你要先喺海鮮檔揀海鮮，然後拎去酒家，叫佢哋幫你煮。Ana一定好鍾意。」Mandy：「係呀！你鍾意食咩呀？」Kelvin：「我想食龍蝦同椒鹽蝦，你呢？」Mandy：「我想食蒸魚。」", en: "Kelvin: \"Great idea! Ana has never been to Lei Yue Mun. At Lei Yue Mun you first choose your seafood at a fish stall, then take it to a restaurant and ask them to cook it for you. Ana will think it's great fun.\" Mandy: \"Exactly! What do you like?\" Kelvin: \"I'd like lobster and salt-and-pepper prawns. What about you?\" Mandy: \"I'd like steamed fish.\"" }
  - { es: "Mandy：「不過Ana好怕食生猛嘅嘢……佢見到隻蟹仲郁緊，可能會驚。」Kelvin：「唔緊要，我哋揀，佢淨係食就得喇。幾點去好呀？」Mandy：「七點啦。我哋六點半喺油塘站門口等，然後一齊行過去，大概行十五分鐘。」", en: "Mandy: \"But Ana is a bit nervous about live seafood... if she sees a crab that's still moving, she might be scared.\" Kelvin: \"Never mind, we'll choose and she just has to eat. What time shall we go?\" Mandy: \"Seven. Let's meet at half past six outside Yau Tong station, then walk over together; it's about a fifteen-minute walk.\"" }
  - { es: "Kelvin：「好。使唔使訂枱呀？」Mandy：「禮拜六好多人，最好訂定。我而家就打去酒家訂。仲有，唔好同Ana講呀，我想畀個驚喜佢！」Kelvin：「明白，我唔會講。我買個蛋糕帶去吖。」", en: "Kelvin: \"OK. Do we need to book a table?\" Mandy: \"Saturdays are busy, so it's best to book ahead. I'll call the restaurant now. Also, don't tell Ana, I want to surprise her!\" Kelvin: \"Got it, I won't say anything. I'll buy a cake and bring it.\"" }
  - { es: "Mandy打去酒家。伙記：「喂，你好，海景酒家。」Mandy：「你好，我想訂枱。下個禮拜六夜晚七點，三位。」伙記：「好，請問貴姓？」Mandy：「姓陳，電話係九一二三 四五六七。」伙記：「陳小姐，三位，禮拜六七點，搞掂。到時見！」", en: "Mandy calls the restaurant. Waiter: \"Hello, Sea View Restaurant.\" Mandy: \"Hello, I'd like to book a table. Next Saturday at seven in the evening, for three.\" Waiter: \"Fine, may I have your surname?\" Mandy: \"Chan, and my number is 9123 4567.\" Waiter: \"Miss Chan, three people, Saturday at seven, all done. See you then!\"" }
questions:
  - { q: "點解Kelvin頭先冇聽電話？", options: ["因為佢瞓緊覺", "因為佢喺度開會", "因為佢冇帶電話"], answer: 1, explain: "頭先我喺度開會，唔方便聽電話." }
  - { q: "佢哋點解去食飯？", options: ["因為係Ana生日", "因為Kelvin轉工", "因為Mandy搬屋"], answer: 0, explain: "下個禮拜六係Ana生日." }
  - { q: "喺鯉魚門食海鮮，第一步要做乜嘢？", options: ["喺酒家睇餐牌", "喺海鮮檔揀海鮮", "打電話叫外賣"], answer: 1, explain: "你要先喺海鮮檔揀海鮮，然後拎去酒家." }
  - { q: "佢哋幾點喺油塘站等？", options: ["六點", "六點半", "七點"], answer: 1, explain: "我哋六點半喺油塘站門口等. Dinner is at seven." }
  - { q: "Kelvin會帶乜嘢去？", options: ["一個蛋糕", "一隻蟹", "一枝紅酒"], answer: 0, explain: "我買個蛋糕帶去吖." }
glossary:
  - { es: 海鮮檔, en: seafood stall }
  - { es: 椒鹽, en: salt and pepper (cooking style) }
  - { es: 生猛, en: live (seafood) }
  - { es: 驚喜, en: surprise }
  - { es: 訂枱, en: to book a table }
  - { es: 油塘, en: Yau Tong }
  - { es: 海景, en: sea view }
