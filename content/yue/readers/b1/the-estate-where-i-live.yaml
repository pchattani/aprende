  - { es: 剪頭髮, en: to get a haircut }
  - { es: 夫婦, en: married couple }
  - { es: 寫字樓, en: office building }
  - { es: 客家, en: Hakka }
  - { es: 陳氏, en: the Chan clan }
  - { es: 起, en: to build }
  - { es: 農具, en: farm tools }
  - { es: 過日子, en: "to live one's daily life" }
  - { es: 窄, en: "narrow, cramped" }
  - { es: 對我嚟講, en: "for me, as far as I'm concerned" }
  - { es: 師奶, en: Mrs (for a married woman of a certain age) }
