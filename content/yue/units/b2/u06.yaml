id: b2.u06
title: 長洲太平清醮
lessons:
  - id: b2.u06.l1
    title: 無論幾多人都要去
    teach: [g.mou-leon-dou-no-matter]
    vocab: [w.coeng4-zau1, w.bak1-dai3, w.baau1-saan1, w.coeng2-baau1-saan1, w.piu1-sik1, w.ceon4-jau4, w.ziu3.b, w.daa2-ziu3, w.mou4-leon6, w.bat1-leon6, w.bat1-gun2, w.nung4-lik6, w.geoi2-hang4, w.geoi2-baan6, w.caam1-gaa1, w.caam1-jyu5, w.gun1-zung3, w.jan4-saan1-jan4-hoi2, w.zai1-jung2, w.hei3-fan1, w.ziu3-soeng4, w.geoi1-man4, w.zi1.d, w.noi6.b, w.bou3-meng2, w.paak3-sau2, w.kei4-gaan1, w.gung1-lik6]
    tip: "無論 + a question word, A-not-A or alternatives, then 都 + result: 無論落唔落雨，我哋都會去 'whether it rains or not, we'll go'."
    sentences:
      - { es: "無論幾多人，我每年都去長洲睇太平清醮。", en: "However crowded it is, I go to Cheung Chau for the Bun Festival every year.", altEs: ["無論幾多人，我每年都會去長洲睇太平清醮。"], grammar: [g.mou-leon-dou-no-matter], vocab: [w.mou4-leon6, w.coeng4-zau1] }
      - { es: "無論落唔落雨，飄色巡遊都照常舉行。", en: "Rain or shine, the floating colours parade goes ahead as usual.", altEs: ["不論落唔落雨，飄色巡遊都照常舉行。"], grammar: [g.mou-leon-dou-no-matter], vocab: [w.piu1-sik1, w.ceon4-jau4, w.geoi2-hang4, w.ziu3-soeng4] }
      - { es: "落雨，我哋都會去。", en: "If it rains, we'll still go.", altEs: ["落雨我哋都去。"], grammar: [g.mou-leon-dou-no-matter], vocab: [w.mou4-leon6], transform: { instruction: "Make it 'whether it rains or not' with 無論…都", answer: "無論落唔落雨，我哋都會去。", alt: ["無論落唔落雨，我哋都去。", "不管落唔落雨，我哋都會去。"], en: "Whether it rains or not, we'll go." } }
      - { es: "無論落雨，我哋都會去。", en: "Whatever the weather, we'll go.", altEs: ["無論落唔落雨，我哋都會去。"], grammar: [g.mou-leon-dou-no-matter], vocab: [w.mou4-leon6], error: { wrong: "無論落雨，我哋都會去。", explain: "無論 needs a question or alternatives after it: 無論落唔落雨, not 無論落雨.", grammar: g.mou-leon-dou-no-matter } }
      - { es: "太平清醮喺農曆四月舉行，通常係公曆五月。", en: "The Bun Festival is held in the fourth lunar month — usually in May.", altEs: ["太平清醮喺農曆四月舉行，通常係五月。", "太平清醮喺農曆四月舉行，一般係五月。"], grammar: [g.mou-leon-dou-no-matter], vocab: [w.nung4-lik6, w.geoi2-hang4] }
      - { es: "長洲人打醮，係為咗拜北帝同祈求平安。", en: "Cheung Chau people hold the festival to worship Pak Tai and pray for peace.", altEs: ["長洲人打醮係為咗拜北帝，祈求平安。"], grammar: [g.wai-zo-purpose], vocab: [w.daa2-ziu3, w.bak1-dai3] }
      - { es: "呢個醮每年都由長洲居民舉辦。", en: "This festival is organised every year by Cheung Chau's residents.", altEs: ["呢個醮每年都係長洲居民舉辦嘅。"], grammar: [g.mou-leon-dou-no-matter], vocab: [w.ziu3.b, w.geoi2-baan6] }
      - { es: "搶包山比賽要喺三分鐘之內爬上包山搶包。", en: "In the bun-scrambling race you have three minutes to climb the tower and grab buns.", altEs: ["搶包山比賽要喺三分鐘內爬上包山搶包。"], grammar: [g.mou-leon-dou-no-matter], vocab: [w.coeng2-baau1-saan1, w.baau1-saan1, w.paa4-soeng5] }
      - { es: "無論大人定細路，都可以參加飄色巡遊。", en: "Adults and children alike can take part in the parade.", altEs: ["無論大人定小朋友，都可以參加飄色巡遊。"], grammar: [g.mou-leon-dou-no-matter], vocab: [w.caam1-gaa1] }
      - { es: "全島嘅人都會參與呢個節日。", en: "The whole island takes part in this festival.", altEs: ["成個島嘅人都會參與呢個節日。"], grammar: [g.mou-leon-dou-no-matter], vocab: [w.caam1-jyu5] }
      - { es: "碼頭人山人海，船一泊岸就擠到爆。", en: "The pier is a sea of people — the moment a boat docks, it's packed solid.", altEs: ["碼頭人山人海，船一泊岸就迫到爆。"], grammar: [g.jat-zau-as-soon-as], vocab: [w.jan4-saan1-jan4-hoi2] }
      - { es: "街道好擠擁，大家要慢慢行。", en: "The streets are crowded — everyone has to walk slowly.", altEs: ["條街好擠擁，大家慢慢行啦。"], grammar: [g.mou-leon-dou-no-matter], vocab: [w.zai1-jung2] }
      - { es: "觀眾一齊大叫，氣氛好熱鬧。", en: "The spectators all shout together — the atmosphere is electric.", altEs: ["啲觀眾一齊大叫，氣氛非常熱鬧。"], grammar: [g.mou-leon-dou-no-matter], vocab: [w.gun1-zung3, w.hei3-fan1] }
      - { es: "不管你點講，我今晚都要留喺長洲睇搶包山。", en: "Whatever you say, I'm staying on Cheung Chau tonight to watch the bun scramble.", altEs: ["無論你點講，我今晚都要留喺長洲睇搶包山。"], grammar: [g.mou-leon-dou-no-matter], vocab: [w.bat1-gun2, w.coeng2-baau1-saan1] }
      - { es: "邊個贏都好，大家都好開心。", en: "Whoever wins, everyone's happy.", altEs: ["邊個贏都冇所謂，大家都好開心。"], grammar: [g.mou-leon-dou-no-matter, g.wh-dou-every], vocab: [w.bat1-leon6], transform: { instruction: "Start with 不論 to make it 'no matter who wins'", answer: "不論邊個贏，大家都好開心。", alt: ["無論邊個贏，大家都好開心。"], en: "No matter who wins, everyone's happy." } }
    exchanges:
      - q: { es: "落雨仲有冇飄色巡遊㗎？", en: "Is the parade still on if it rains, then?" }
        a: { es: "有呀，無論天氣點都照常舉行。", en: "Yes — whatever the weather, it goes ahead as usual." }
        alt: ["有，照常舉行。", "除非打風啦。"]
        grammar: [g.mou-leon-dou-no-matter]
        vocab: [w.mou4-leon6, w.ziu3-soeng4]
      - q: { es: "長洲今日多唔多人？", en: "Is Cheung Chau busy today?" }
        a: { es: "人山人海呀，碼頭擠擁到行唔郁。", en: "A sea of people — the pier is so crowded you can't move." }
        alt: ["好多人呀。", "人山人海。"]
        grammar: [g.mou-leon-dou-no-matter]
        vocab: [w.jan4-saan1-jan4-hoi2, w.zai1-jung2]
      - q: { es: "邊個可以參加搶包山？", en: "Who can take part in the bun scramble?" }
        a: { es: "要報名同訓練，唔係邊個都得。", en: "You have to sign up and train — not just anyone can." }
        alt: ["有訓練嘅人先得。", "要報名先得。"]
        grammar: [g.wh-dou-every]
        vocab: [w.caam1-gaa1, w.coeng2-baau1-saan1]
      - q: { es: "太平清醮係邊個月舉行？", en: "Which month is the Bun Festival held?" }
        a: { es: "農曆四月，通常係公曆五月。", en: "The fourth lunar month — usually May." }
        alt: ["五月左右。", "農曆四月。"]
        grammar: [g.mou-leon-dou-no-matter]
        vocab: [w.nung4-lik6, w.geoi2-hang4]
      - q: { es: "你覺得氣氛點呀？", en: "What do you think of the atmosphere?" }
        a: { es: "好熱鬧，觀眾一路嗌一路拍手。", en: "Really lively — the crowd keeps shouting and clapping." }
        alt: ["好正！", "好熱鬧。"]
        grammar: [g.mou-leon-dou-no-matter]
        vocab: [w.hei3-fan1, w.gun1-zung3]
    texts:
      - title: "長洲太平清醮簡介"
        es: ["太平清醮每年農曆四月喺長洲舉行。", "節日期間有飄色巡遊同搶包山比賽。", "無論本地人定遊客，都會擠到長洲睇熱鬧。"]
        en: ["The Bun Festival is held on Cheung Chau every year in the fourth lunar month.", "During the festival there's the floating colours parade and the bun-scrambling race.", "Locals and tourists alike pack onto Cheung Chau to join the fun."]
        grammar: [g.mou-leon-dou-no-matter]
        vocab: [w.nung4-lik6, w.geoi2-hang4, w.piu1-sik1, w.coeng2-baau1-saan1, w.mou4-leon6]
    spicy:
      - { es: "無論你去邊度，我都想跟埋你去。", en: "Wherever you go, I want to tag along.", altEs: ["不管你去邊，我都想跟你去。"], grammar: [g.mou-leon-dou-no-matter], vocab: [w.mou4-leon6] }
      - { es: "人山人海，我都一眼就見到你。", en: "In a sea of people, I spotted you straight away.", altEs: ["人山人海咁多人，我都一眼見到你。"], grammar: [g.jat-zau-as-soon-as], vocab: [w.jan4-saan1-jan4-hoi2] }
      - { es: "不管你幾忙，今晚都要陪我睇巡遊。", en: "However busy you are, you're watching the parade with me tonight.", altEs: ["無論你幾忙，今晚都要陪我睇巡遊。"], grammar: [g.mou-leon-dou-no-matter], vocab: [w.bat1-gun2, w.ceon4-jau4] }
      - { es: "咁擠擁，你拖實我隻手啦，唔好走失。", en: "It's so crowded — hold my hand tight so you don't get lost.", altEs: ["咁擠擁，拖實我隻手，唔好走失呀。"], grammar: [g.mou-leon-dou-no-matter], vocab: [w.zai1-jung2] }
      - { es: "我唔係嚟睇搶包山，我係嚟睇你㗎。", en: "I'm not here for the bun scramble — I'm here to see you.", altEs: ["我唔係嚟睇搶包山，係嚟睇你㗎。"], grammar: [g.gaa3-explaining], vocab: [w.coeng2-baau1-saan1], jp: "ngo5 m4 hai6 lai4 tai2 coeng2 baau1 saan1 ngo5 hai6 lai4 tai2 nei5 gaa3" }
  - id: b2.u06.l2
    title: 除咗包山，仲有乜嘢？
    teach: [g.ceoi-zo-apart-from]
    vocab: [w.ceoi4-zo2, w.zi1-ngoi6, w.ji5-ngoi6, w.ceoi4-ci2-zi1-ngoi6, w.san4-zoeng6, w.dou6-si2, w.wo4-soeng2, w.nei4-gu1, w.ji4-sik1, w.zung1-gaau3, w.fat6-gaau3, w.dou6-gaau3, w.gei1-duk1-gaau3, w.tin1-zyu2-gaau3, w.seon3.b, w.mai4-seon3, w.bou2-jau6, w.kei4-fuk1, w.san4-taan4, w.zai3-zi6, w.seon3-joeng5]
    tip: "除咗 X (之外) + 仲 = 'besides X, also …'; 除咗 X (之外) + 都 / 冇 = 'except X'. Read the second half to know which."
    sentences:
      - { es: "除咗包山，仲有飄色巡遊。", en: "Besides the bun towers, there's also the floating colours parade.", altEs: ["除咗包山之外，仲有飄色巡遊。"], grammar: [g.ceoi-zo-apart-from], vocab: [w.ceoi4-zo2, w.baau1-saan1] }
      - { es: "除咗我，大家都食咗平安包。", en: "Everyone has eaten a peace bun except me.", altEs: ["除咗我之外，大家都食咗平安包。"], grammar: [g.ceoi-zo-apart-from], vocab: [w.ceoi4-zo2, w.zi1-ngoi6] }
      - { es: "除咗星期一之外，北帝廟日日都開。", en: "Pak Tai Temple is open every day except Monday.", altEs: ["除咗星期一，北帝廟日日都開。"], grammar: [g.ceoi-zo-apart-from], vocab: [w.zi1-ngoi6, w.bak1-dai3] }
      - { es: "佢識講廣東話，亦識講英文。", en: "She speaks Cantonese, and English too.", altEs: ["佢識講廣東話，又識講英文。"], altEn: ["He speaks Cantonese and also English."], grammar: [g.ceoi-zo-apart-from], vocab: [w.ceoi4-zo2], transform: { instruction: "Rewrite with 除咗…之外，仲…", answer: "除咗廣東話之外，佢仲識講英文。", alt: ["除咗廣東話，佢仲識講英文。"], en: "Apart from Cantonese, she also speaks English." } }
      - { es: "道士喺神壇前面做儀式。", en: "The Taoist priests perform rituals in front of the altar.", altEs: ["啲道士喺神壇前面做儀式。"], grammar: [g.ceoi-zo-apart-from], vocab: [w.dou6-si2, w.san4-taan4, w.ji4-sik1] }
      - { es: "巡遊嘅時候，居民會抬住神像行過大街。", en: "During the parade, residents carry the statues of the gods through the main street.", altEs: ["巡遊期間，居民抬住神像行過大街。"], grammar: [g.ceoi-zo-apart-from], vocab: [w.san4-zoeng6] }
      - { es: "太平清醮主要係道教嘅節日。", en: "The Bun Festival is mainly a Taoist festival.", altEs: ["太平清醮基本上係道教節日。"], grammar: [g.ceoi-zo-apart-from], vocab: [w.dou6-gaau3] }
      - { es: "除咗道教，香港人亦信佛教、基督教同天主教。", en: "Besides Taoism, Hong Kong people also follow Buddhism, Protestantism and Catholicism.", altEs: ["除咗道教之外，香港人仲信佛教、基督教同天主教。"], grammar: [g.ceoi-zo-apart-from], vocab: [w.fat6-gaau3, w.gei1-duk1-gaau3, w.tin1-zyu2-gaau3, w.seon3.b] }
      - { es: "宗教以外，呢個節日亦係社區嘅大事。", en: "Beyond religion, this festival is also a big community event.", altEs: ["除咗宗教，呢個節日亦係社區嘅大事。"], grammar: [g.ceoi-zo-apart-from], vocab: [w.zung1-gaau3, w.ji5-ngoi6] }
      - { es: "寶蓮寺有好多和尚，亦有尼姑。", en: "Po Lin Monastery has many monks, and nuns too.", altEs: ["寶蓮寺有好多和尚，又有尼姑。"], grammar: [g.ceoi-zo-apart-from], vocab: [w.wo4-soeng2, w.nei4-gu1], transform: { instruction: "Rewrite with 除咗…之外，仲…", answer: "寶蓮寺除咗和尚之外，仲有尼姑。", alt: ["寶蓮寺除咗和尚，仲有尼姑。"], en: "Besides monks, Po Lin Monastery also has nuns." } }
      - { es: "我阿婆好迷信，乜都要問神。", en: "My grandma is very superstitious — she asks the gods about everything.", altEs: ["我阿婆好迷信，乜嘢都要問神。"], grammar: [g.wh-dou-every], vocab: [w.mai4-seon3] }
      - { es: "長洲人相信北帝會保佑個島。", en: "Cheung Chau people believe Pak Tai protects the island.", altEs: ["長洲人信北帝會保佑成個島。"], grammar: [g.ceoi-zo-apart-from], vocab: [w.bou2-jau6, w.bak1-dai3] }
      - { es: "好多人喺廟入面祈福，求家人身體健康。", en: "Many people pray for blessings at the temple, asking for their family's good health.", altEs: ["好多人去廟祈福，求屋企人身體健康。"], grammar: [g.ceoi-zo-apart-from], vocab: [w.kei4-fuk1] }
      - { es: "祭祀之後，啲平安包會分畀居民。", en: "After the rites, the peace buns are given out to residents.", altEs: ["祭祀完之後，啲平安包會派畀居民。"], grammar: [g.ji-cin-ji-hau], vocab: [w.zai3-zi6] }
      - { es: "除此之外，島上仲有好多細廟。", en: "Apart from that, there are lots of small temples on the island.", altEs: ["除此之外，島上面仲有好多細廟。"], grammar: [g.ceoi-zo-apart-from], vocab: [w.ceoi4-ci2-zi1-ngoi6] }
      - { es: "除咗佢，冇人知包山有幾高。", en: "No one knows how tall the bun tower is except him.", altEs: ["除咗佢之外，冇人知包山有幾高。"], grammar: [g.ceoi-zo-apart-from], vocab: [w.ceoi4-zo2], error: { wrong: "冇人知包山有幾高，除咗佢。", explain: "In Cantonese 除咗 comes at the start of the sentence, not at the end like English 'except him'.", grammar: g.ceoi-zo-apart-from } }
    exchanges:
      - q: { es: "除咗搶包山，仲有咩好睇？", en: "Apart from the bun scramble, what else is worth seeing?" }
        a: { es: "仲有飄色巡遊，啲小朋友扮到好得意。", en: "There's also the parade — the kids are dressed up adorably." }
        alt: ["仲有飄色。", "除咗搶包山，仲有巡遊同舞獅。"]
        grammar: [g.ceoi-zo-apart-from]
        vocab: [w.ceoi4-zo2, w.piu1-sik1]
      - q: { es: "你信唔信宗教㗎？", en: "Are you religious, then?" }
        a: { es: "我唔信，不過我尊重人哋嘅信仰。", en: "I'm not, but I respect other people's faith." }
        alt: ["信，我信佛教。", "我信天主教。"]
        grammar: [g.ceoi-zo-apart-from]
        vocab: [w.seon3.b, w.zung1-gaau3]
      - q: { es: "大家都去咗睇巡遊？", en: "Has everyone gone to watch the parade?" }
        a: { es: "除咗阿婆，個個都去咗。", en: "Everyone except Grandma." }
        alt: ["除咗我，大家都去咗。", "個個都去咗。"]
        grammar: [g.ceoi-zo-apart-from]
        vocab: [w.ceoi4-zo2]
      - q: { es: "點解要拜北帝？", en: "Why do people worship Pak Tai?" }
        a: { es: "佢哋相信北帝會保佑長洲平安。", en: "They believe Pak Tai keeps Cheung Chau safe." }
        alt: ["求保佑囉。", "為咗祈福。"]
        grammar: [g.ceoi-zo-apart-from]
        vocab: [w.bou2-jau6, w.bak1-dai3]
    texts:
      - title: "北帝廟"
        es: ["北帝廟係長洲最重要嘅廟。", "太平清醮期間，道士喺廟前做儀式，居民喺度祈福。", "除此之外，巡遊亦由北帝廟出發。"]
        en: ["Pak Tai Temple is Cheung Chau's most important temple.", "During the Bun Festival, Taoist priests perform rituals in front of it and residents pray for blessings there.", "On top of that, the parade also sets off from Pak Tai Temple."]
        grammar: [g.ceoi-zo-apart-from]
        vocab: [w.bak1-dai3, w.dou6-si2, w.ji4-sik1, w.kei4-fuk1, w.ceoi4-ci2-zi1-ngoi6]
    spicy:
      - { es: "除咗你，我邊個都唔想約。", en: "Apart from you, there's no one I want to ask out.", altEs: ["除咗你之外，我邊個都唔想約。"], grammar: [g.ceoi-zo-apart-from], vocab: [w.ceoi4-zo2] }
      - { es: "我唔迷信，不過今日見到你，我開始信緣分。", en: "I'm not superstitious, but meeting you today, I'm starting to believe in fate.", altEs: ["我唔迷信，但係今日見到你，我開始信緣分。"], grammar: [g.ceoi-zo-apart-from], vocab: [w.mai4-seon3, w.seon3.b] }
      - { es: "我去祈福，求北帝保佑你今晚肯同我食飯。", en: "I prayed for blessings — asked Pak Tai to make you say yes to dinner tonight.", altEs: ["我去咗祈福，求北帝保佑你今晚肯同我食飯。"], grammar: [g.ceoi-zo-apart-from], vocab: [w.kei4-fuk1, w.bou2-jau6] }
      - { es: "除咗平安包，我仲想同你分享一碗糖水。", en: "Besides a peace bun, I'd like to share a bowl of sweet soup with you.", altEs: ["除咗平安包之外，我仲想同你食碗糖水。"], grammar: [g.ceoi-zo-apart-from], vocab: [w.ceoi4-zo2] }
  - id: b2.u06.l3
    title: 不但好食，而且平安
    teach: [g.bat-daan-not-only]
    vocab: [w.bat1-daan6, w.bat1-daan1, w.ji4-ce2, w.bing6-ce2, w.siu2-sik6, w.taan1-dong3, w.no6-mai5-ci4, w.zaai1, w.sik6-zaai1.b, w.ziu3-soeng4, w.jin4-kei4, w.wan1-jik6, w.hei2-jyun4, w.gei2-nim6, w.paa4-soeng5, w.gou1-fung1, w.ze2.b, w.cing1-ciu4, w.siu1-sat1, w.cung4-ci2]
    tip: "Colloquial: 唔單止 A，仲 B. Neutral: 不但 A，而且 B. Don't mix them: 唔單止 goes with 仲, 不但 with 而且."
    sentences:
      - { es: "平安包唔單止好食，仲好意頭。", en: "Peace buns aren't just tasty — they're lucky too.", altEs: ["平安包唔單止好食，仲好有意頭。"], grammar: [g.bat-daan-not-only], vocab: [w.bat1-daan6, w.ji4-ce2], transform: { instruction: "Switch to the neutral register: 不但…而且…", answer: "平安包不但好食，而且好意頭。", alt: ["平安包不單好食，而且好意頭。"], en: "Peace buns are not only tasty but also lucky." } }
      - { es: "太平清醮不但係宗教活動，而且係社區嘅節日。", en: "The Bun Festival is not only a religious event but also a community celebration.", altEs: ["太平清醮唔單止係宗教活動，仲係社區嘅節日。"], grammar: [g.bat-daan-not-only], vocab: [w.bat1-daan6, w.ji4-ce2] }
      - { es: "長洲有沙灘，有好多古廟。", en: "Cheung Chau has beaches and lots of old temples.", altEs: ["長洲有沙灘，又有好多古廟。"], grammar: [g.bat-daan-not-only], vocab: [w.bat1-daan6], transform: { instruction: "Rewrite with 唔單止…仲…", answer: "長洲唔單止有沙灘，仲有好多古廟。", alt: ["長洲不但有沙灘，而且有好多古廟。"], en: "Cheung Chau doesn't just have beaches, it has lots of old temples too." } }
      - { es: "搶包山唔單止要力，仲要技巧。", en: "The bun scramble takes not just strength but skill.", altEs: ["搶包山不單要力，而且要技巧。"], grammar: [g.bat-daan-not-only], vocab: [w.bat1-daan1, w.coeng2-baau1-saan1] }
      - { es: "呢間餐廳唔單止平，仲好好食。", en: "This restaurant isn't just cheap, it's delicious too.", altEs: ["呢間餐廳不但平，而且好好食。"], grammar: [g.bat-daan-not-only], vocab: [w.ji4-ce2], error: { wrong: "呢間餐廳唔單止平，而且好好食。", explain: "Keep the register consistent: 唔單止 pairs with 仲 (唔單止平，仲好好食); 不但 pairs with 而且.", grammar: g.bat-daan-not-only } }
      - { es: "節日期間，全島食齋三日。", en: "During the festival, the whole island eats vegetarian for three days.", altEs: ["節日嗰三日，成個島都食齋。"], grammar: [g.bat-daan-not-only], vocab: [w.zaai1, w.sik6-zaai1.b] }
      - { es: "街上面有好多攤檔賣小食。", en: "There are lots of stalls in the street selling snacks.", altEs: ["條街有好多攤檔賣小食。"], grammar: [g.bat-daan-not-only], vocab: [w.taan1-dong3, w.siu2-sik6] }
      - { es: "芒果糯米糍係長洲出名嘅小食。", en: "Mango mochi is a famous Cheung Chau snack.", altEs: ["芒果糯米糍係長洲好出名嘅小食。"], grammar: [g.bat-daan-not-only], vocab: [w.no6-mai5-ci4, w.siu2-sik6] }
      - { es: "雖然落雨，巡遊照常舉行，並且冇延期。", en: "Although it rained, the parade went ahead as usual and wasn't postponed.", altEs: ["雖然落雨，巡遊都照常舉行，冇延期。"], grammar: [g.seoi-jin-daan-hai], vocab: [w.ziu3-soeng4, w.bing6-ce2, w.jin4-kei4] }
      - { es: "據講太平清醮嘅起源同一場瘟疫有關。", en: "The Bun Festival's origins are said to be linked to a plague.", altEs: ["聽講太平清醮嘅起源同一場瘟疫有關。"], grammar: [g.bat-daan-not-only], vocab: [w.hei2-jyun4, w.wan1-jik6] }
      - { es: "居民打醮，係為咗紀念喺瘟疫入面死去嘅人。", en: "Residents hold the festival to remember those who died in the plague.", altEs: ["居民打醮係為咗紀念瘟疫入面死咗嘅人。"], grammar: [g.wai-zo-purpose], vocab: [w.gei2-nim6, w.wan1-jik6] }
      - { es: "參加者一爬上包山頂，就開始搶包。", en: "As soon as the climbers get up the tower, they start grabbing buns.", altEs: ["參加者一爬上包山，就開始搶包。"], grammar: [g.jat-zau-as-soon-as], vocab: [w.paa4-soeng5], jp: "caam1 gaa1 ze2 jat1 paa4 soeng5 baau1 saan1 deng2 zau6 hoi1 ci2 coeng2 baau1" }
      - { es: "半夜十二點係成個節日嘅高峰。", en: "Midnight is the high point of the whole festival.", altEs: ["半夜十二點係成個節日最高峰嘅時候。"], grammar: [g.bat-daan-not-only], vocab: [w.gou1-fung1] }
      - { es: "呢度唔單止有平安包，仲有魚蛋同糖水。", en: "There aren't just peace buns here — there are fish balls and sweet soup too.", altEs: ["呢度不單有平安包，而且有魚蛋同糖水。"], grammar: [g.bat-daan-not-only], vocab: [w.bat1-daan1] }
      - { es: "唔單止我，連我老細都去咗長洲。", en: "Not just me — even my boss went to Cheung Chau.", altEs: ["唔單止我，我老細都去咗長洲。"], grammar: [g.bat-daan-not-only, g.lin-dou-even], vocab: [w.lin4] }
    exchanges:
      - q: { es: "長洲有咩好食？", en: "What's good to eat on Cheung Chau?" }
        a: { es: "唔單止有平安包，仲有芒果糯米糍同大魚蛋。", en: "Not just peace buns — there's mango mochi and big fish balls too." }
        alt: ["平安包同糯米糍。", "好多小食㗎。"]
        grammar: [g.bat-daan-not-only]
        vocab: [w.no6-mai5-ci4]
      - q: { es: "節日期間有冇肉食？", en: "Is there meat during the festival?" }
        a: { es: "冇呀，全島食齋，連快餐店都賣齋。", en: "No — the whole island goes vegetarian, even the fast-food places sell vegetarian food." }
        alt: ["冇，食齋㗎。", "要食齋三日。"]
        grammar: [g.bat-daan-not-only, g.lin-dou-even]
        vocab: [w.zaai1]
      - q: { es: "巡遊會唔會延期？", en: "Will the parade be postponed?" }
        a: { es: "唔會，除非打大風，唔係都照常舉行。", en: "No — unless there's a big typhoon, it goes ahead as usual." }
        alt: ["照常舉行。", "應該唔會啩。"]
        grammar: [g.bat-daan-not-only]
        vocab: [w.jin4-kei4, w.ziu3-soeng4]
      - q: { es: "呢個節日嘅起源係乜嘢？", en: "What are the origins of this festival?" }
        a: { es: "據講以前長洲有瘟疫，居民打醮之後就冇事。", en: "Supposedly there was once a plague on Cheung Chau, and after the residents held the ritual it ended." }
        alt: ["同瘟疫有關。", "我都唔太清楚。"]
        grammar: [g.bat-daan-not-only]
        vocab: [w.hei2-jyun4, w.wan1-jik6]
    texts:
      - title: "攤檔招牌"
        es: ["長洲芒果糯米糍，每粒十蚊。", "唔單止新鮮，仲係人手即製。", "節日期間照常營業，歡迎試食。"]
        en: ["Cheung Chau mango mochi, ten dollars each.", "Not only fresh but made by hand on the spot.", "Open as usual during the festival — come and try a sample."]
        grammar: [g.bat-daan-not-only]
        vocab: [w.no6-mai5-ci4, w.ziu3-soeng4]
      - title: "歷史小知識"
        es: ["據講太平清醮嘅起源係清朝一場瘟疫。", "居民請道士打醮，瘟疫之後就消失咗。", "從此，長洲人每年都舉辦呢個節日。"]
        en: ["The Bun Festival is said to have begun with a plague in the Qing dynasty.", "Residents asked Taoist priests to hold a ritual, and afterwards the plague disappeared.", "Since then, Cheung Chau people have held the festival every year."]
        grammar: [g.bat-daan-not-only]
        vocab: [w.hei2-jyun4, w.wan1-jik6, w.geoi2-baan6]
    spicy:
      - { es: "你唔單止靚，仲好識講笑。", en: "You're not just good-looking — you're funny too.", altEs: ["你不但靚，而且好識講笑。"], grammar: [g.bat-daan-not-only], vocab: [w.bat1-daan6] }
      - { es: "同你分一粒糯米糍，唔單止甜，仲好浪漫。", en: "Sharing a mochi with you isn't just sweet — it's romantic.", altEs: ["同你食一粒糯米糍，唔單止甜，仲好浪漫。"], grammar: [g.bat-daan-not-only], vocab: [w.no6-mai5-ci4] }
      - { es: "我今晚嘅高峰，就係你應承同我睇巡遊。", en: "The high point of my evening was you agreeing to watch the parade with me.", altEs: ["我今晚最開心，就係你應承同我睇巡遊。"], grammar: [g.bat-daan-not-only], vocab: [w.gou1-fung1] }
      - { es: "約會可以延期，但係唔可以取消。", en: "Our date can be postponed, but it can't be cancelled.", altEs: ["約會延期得，取消唔得。"], grammar: [g.bat-daan-not-only], vocab: [w.jin4-kei4] }
  - id: b2.u06.l4
    title: 珍貴嘅文化遺產
    teach: [g.bat-daan-not-only, g.mou-leon-dou-no-matter]
    vocab: [w.wai4-caan2, w.cyun4-sing4, w.bou2-lau4, w.ging1-lik6, w.ceot1-jin6, w.siu1-sat1, w.cyun4-zoi6, w.suk6-jyu1, w.doi6-biu2, w.zoeng6-zing1, w.dak6-sik1, w.dak6-dim2, w.duk6-dak6, w.dak6-syu4, w.pou2-tung1, w.hon2-gin3, w.zan1-gwai3, w.bou2-gwai3, w.ji3-ji6, w.gaa3-zik6, w.paau3-toi4, w.biu2-jin2]
    tip: "To describe a tradition, combine the unit's patterns: 太平清醮不但有特色，而且有歷史 / 無論時代點變，都要保留."
    sentences:
      - { es: "太平清醮係香港珍貴嘅文化遺產。", en: "The Bun Festival is a precious part of Hong Kong's cultural heritage.", altEs: ["太平清醮係香港好珍貴嘅文化遺產。"], grammar: [g.bat-daan-not-only], vocab: [w.zan1-gwai3, w.wai4-caan2] }
      - { es: "無論時代點變，呢個習俗都要傳承落去。", en: "However times change, this custom must be carried on.", altEs: ["不管時代點變，呢個習俗都要傳承落去。"], grammar: [g.mou-leon-dou-no-matter], vocab: [w.cyun4-sing4], error: { wrong: "無論時代點變，呢個習俗要傳承落去。", explain: "The result of a 無論 clause needs 都: 無論時代點變，呢個習俗都要….", grammar: g.mou-leon-dou-no-matter } }
      - { es: "長洲人保留咗好多傳統。", en: "Cheung Chau people have preserved many traditions.", altEs: ["長洲嘅人保留咗好多傳統。"], grammar: [g.bat-daan-not-only], vocab: [w.bou2-lau4], transform: { instruction: "Add 'and pass them on to the next generation' with 不但…而且…", answer: "長洲人不但保留咗好多傳統，而且傳承畀下一代。", alt: ["長洲人唔單止保留咗好多傳統，仲傳承畀下一代。"], en: "Cheung Chau people have not only preserved many traditions but passed them on to the next generation." } }
      - { es: "呢個節日經歷咗百幾年，依然好熱鬧。", en: "This festival has gone through more than a century and is still lively.", altEs: ["呢個節日經歷咗一百幾年，仍然好熱鬧。"], grammar: [g.bat-daan-not-only], vocab: [w.ging1-lik6] }
      - { es: "一九七八年包山塌咗，比賽之後停咗好多年。", en: "In 1978 a bun tower collapsed, and the race was stopped for many years afterwards.", altEs: ["一九七八年包山塌咗，之後比賽停咗好多年。"], grammar: [g.bat-daan-not-only], vocab: [w.baau1-saan1] }
      - { es: "搶包山比賽喺二零零五年再次出現。", en: "The bun-scrambling race reappeared in 2005.", altEs: ["二零零五年，搶包山比賽再次出現。"], grammar: [g.bat-daan-not-only], vocab: [w.ceot1-jin6] }
      - { es: "好多傳統節日已經慢慢消失。", en: "Many traditional festivals have slowly disappeared.", altEs: ["好多傳統節日已經漸漸消失。"], grammar: [g.bat-daan-not-only], vocab: [w.siu1-sat1] }
      - { es: "呢個習俗存在咗幾百年。", en: "This custom has existed for several hundred years.", altEs: ["呢個習俗已經存在咗幾百年。"], grammar: [g.bat-daan-not-only], vocab: [w.cyun4-zoi6] }
      - { es: "長洲屬於離島區。", en: "Cheung Chau belongs to the Islands District.", altEs: ["長洲係屬於離島區嘅。"], grammar: [g.bat-daan-not-only], vocab: [w.suk6-jyu1] }
      - { es: "平安包上面嘅紅字代表平安。", en: "The red characters on the peace buns stand for peace.", altEs: ["平安包上面啲紅字代表平安。"], grammar: [g.bat-daan-not-only], vocab: [w.doi6-biu2] }
      - { es: "包山象徵豐收同平安。", en: "The bun tower symbolises a good harvest and peace.", altEs: ["包山係象徵豐收同平安。"], grammar: [g.bat-daan-not-only], vocab: [w.zoeng6-zing1] }
      - { es: "飄色係長洲最有特色嘅表演。", en: "The floating colours are Cheung Chau's most distinctive performance.", altEs: ["飄色係長洲最有特色嘅節目。"], grammar: [g.bat-daan-not-only], vocab: [w.dak6-sik1] }
      - { es: "呢個節日嘅特點係唔單止有宗教，仲有比賽。", en: "What's special about this festival is that it's not just religious — there's a race too.", altEs: ["呢個節日嘅特點係不但有宗教，而且有比賽。"], grammar: [g.bat-daan-not-only], vocab: [w.dak6-dim2] }
      - { es: "咁獨特嘅節日，喺世界上都好罕見。", en: "Such a unique festival is rare anywhere in the world.", altEs: ["咁獨特嘅節日，全世界都好罕見。"], grammar: [g.bat-daan-not-only], vocab: [w.duk6-dak6, w.hon2-gin3] }
      - { es: "呢啲唔係普通嘅包，係有特殊意義嘅平安包。", en: "These aren't ordinary buns — they're peace buns with a special meaning.", altEs: ["呢啲唔係普通包，係有特殊意義嘅平安包。"], grammar: [g.bat-daan-not-only], vocab: [w.pou2-tung1, w.dak6-syu4, w.ji3-ji6] }
      - { es: "老人家嘅經驗好寶貴，好有價值。", en: "Old people's experience is valuable and worth a lot.", altEs: ["老人家嘅經驗好寶貴，好有價值㗎。"], grammar: [g.bat-daan-not-only], vocab: [w.bou2-gwai3, w.gaa3-zik6], transform: { instruction: "Rewrite with 不但…而且…", answer: "老人家嘅經驗不但寶貴，而且好有價值。", alt: ["老人家嘅經驗唔單止寶貴，仲好有價值。"], en: "Old people's experience is not only precious but also very valuable." } }
    exchanges:
      - q: { es: "點解太平清醮咁重要？", en: "Why is the Bun Festival so important?" }
        a: { es: "因為佢唔單止有歷史，仲代表長洲人嘅團結。", en: "Because it doesn't just have history — it stands for Cheung Chau people's unity." }
        alt: ["佢係珍貴嘅文化遺產。", "因為好有意義。"]
        grammar: [g.bat-daan-not-only]
        vocab: [w.doi6-biu2, w.wai4-caan2]
      - q: { es: "後生仔仲會唔會傳承呢個習俗？", en: "Will young people carry on these customs?" }
        a: { es: "會呀，無論幾忙，佢哋每年都返嚟幫手。", en: "They will — however busy they are, they come back to help every year." }
        alt: ["希望會啦。", "越嚟越少人識喇。"]
        grammar: [g.mou-leon-dou-no-matter]
        vocab: [w.cyun4-sing4]
      - q: { es: "包山上面啲包有咩意義？", en: "What do the buns on the tower mean?" }
        a: { es: "象徵平安，搶得越高嘅包，運氣越好。", en: "They symbolise peace — the higher the bun you grab, the better your luck." }
        alt: ["代表平安。", "平安同好運。"]
        grammar: [g.jyut-jyut-the-more]
        vocab: [w.zoeng6-zing1, w.ji3-ji6]
      - q: { es: "長洲有冇炮台㗎？", en: "Does Cheung Chau have a fort, then?" }
        a: { es: "冇呀，炮台喺東涌，唔係長洲。", en: "No — the fort is in Tung Chung, not Cheung Chau." }
        alt: ["東涌先有炮台。", "冇喎。"]
        grammar: [g.gaa3-explaining]
        vocab: [w.paau3-toi4]
    texts:
      - title: "旅程總結"
        es: ["喺離島呢幾個星期，我哋由東涌炮台行到長洲。", "每個島都有自己嘅特色，唔單止風景靚，仲有好多故事。", "無論去到邊度，最珍貴嘅都係遇到嘅人。"]
        en: ["In our time on the Outlying Islands, we went from Tung Chung Fort all the way to Cheung Chau.", "Every island has its own character — not just beautiful scenery, but lots of stories too.", "Wherever we went, the most precious thing was the people we met."]
        grammar: [g.bat-daan-not-only, g.mou-leon-dou-no-matter]
        vocab: [w.paau3-toi4, w.dak6-sik1, w.zan1-gwai3]
    spicy:
      - { es: "你喺我心入面嘅價值，比一百個平安包仲高。", en: "You're worth more to me than a hundred peace buns.", altEs: ["你喺我心入面嘅價值高過一百個平安包。"], grammar: [g.bei2-comparison], vocab: [w.gaa3-zik6] }
      - { es: "你咁獨特，好似長洲嘅飄色，一年先見一次。", en: "You're as unique as Cheung Chau's floating colours — the kind you see once a year.", altEs: ["你好獨特，好似長洲嘅飄色噉，一年先見一次。"], grammar: [g.bat-daan-not-only], vocab: [w.duk6-dak6] }
      - { es: "同你嘅第一次約會，我會好好保留喺記憶入面。", en: "I'll keep our first date safe in my memory.", altEs: ["同你第一次約會，我會好好保留喺記憶度。"], grammar: [g.bat-daan-not-only], vocab: [w.bou2-lau4] }
      - { es: "你笑起上嚟，比任何風景都珍貴。", en: "Your smile is more precious than any view.", altEs: ["你嘅笑容比任何風景都珍貴。"], grammar: [g.bei2-comparison], vocab: [w.zan1-gwai3] }
dialogues:
  - id: b2.u06.d1
    title: 長洲嘅晚上
    context: Ka-lok, a Cheung Chau local, shows his friend Eva around the island on the night of the bun-scrambling race.
    lines:
      - { speaker: Eva, es: "嘩，人山人海！無論去邊度都咁擠擁㗎？", en: "Wow, a sea of people! Is it this crowded wherever you go?" }
      - { speaker: 家樂, es: "今晚係搶包山吖嘛，全香港嘅人都嚟咗啩。", en: "Well, it's the bun scramble tonight — I guess all of Hong Kong is here." }
      - { speaker: Eva, es: "除咗搶包山，今日仲有咩活動？", en: "Apart from the bun scramble, what else was on today?" }
      - { speaker: 家樂, es: "下晝有飄色巡遊，啲小朋友企喺高高嘅架上面，好似飛緊噉。", en: "In the afternoon there was the floating colours parade — the kids stand on tall frames, as if they're flying." }
      - { speaker: Eva, es: "我好肚餓，有冇魚蛋燒賣食？", en: "I'm starving — are there any fish balls or siu mai?" }
