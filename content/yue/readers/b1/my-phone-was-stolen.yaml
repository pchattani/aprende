id: r.b1.my-phone-was-stolen
level: b1
title: 我部手機畀人偷咗
kind: dialogue
intro: Mei-kei's phone disappears on a crowded minibus to Tsuen Wan. At the police station she reports what happened - and gets an unexpected phone call.
paragraphs:
  - { es: "星期五夜晚，美琪坐小巴由旺角返荃灣。車上面好多人，佢好攰，瞓着咗一陣。落車之後，佢想打電話畀媽媽，先發現手袋開咗，部手機唔見咗。佢即刻行去附近嘅警察局報警。", en: "On Friday night, Mei-kei took a minibus from Mong Kok back to Tsuen Wan. The bus was crowded and she was tired, so she dozed off for a while. After getting off she wanted to call her mother, and only then did she notice that her handbag was open and her phone was gone. She immediately walked to the nearest police station to report it." }
  - { es: "警察：「小姐，有咩可以幫你？」美琪：「我部手機畀人偷咗！」警察：「唔使驚，慢慢講。你幾時發現唔見咗？」美琪：「大概十分鐘之前，我喺荃灣落小巴嘅時候。」", en: "Police officer: \"Can I help you, miss?\" Mei-kei: \"My phone has been stolen!\" Officer: \"Don't panic, take your time. When did you notice it was missing?\" Mei-kei: \"About ten minutes ago, when I got off the minibus in Tsuen Wan.\"" }
  - { es: "警察：「你點知係畀人偷咗，唔係你自己跌咗？」美琪：「我上車之前仲用緊，之後將佢放咗入手袋。落車嘅時候，我個手袋嘅拉鏈畀人拉開咗。」警察：「車上面有冇人特別貼近你？」", en: "Officer: \"How do you know it was stolen and you didn't just drop it?\" Mei-kei: \"I was still using it before I got on, then I put it in my handbag. When I got off, the zip of my bag had been opened.\" Officer: \"Was anyone standing especially close to you on the bus?\"" }
  - { es: "美琪：「有一個男人企咗喺我隔籬，戴住帽同口罩，佢比我早一個站落車。不過我瞓着咗，睇唔清楚佢個樣。」警察：「明白。你部手機係咩牌子、咩顏色㗎？」美琪：「係黑色嘅，有個粉紅色嘅殼，殼上面有隻貓仔。」", en: "Mei-kei: \"There was a man standing next to me, wearing a cap and a face mask. He got off one stop before me. But I'd fallen asleep, so I didn't get a good look at his face.\" Officer: \"I see. What brand and colour is your phone?\" Mei-kei: \"It's black, with a pink case, and there's a kitten on the case.\"" }
  - { es: "警察：「你有冇開咗搵手機嘅功能？」美琪：「有呀，不過我部手機唔喺度，點樣睇呀？」警察：「可以用我哋部電腦登入你嘅帳戶。」佢哋一齊睇，發現部手機而家喺荃灣西站附近，仲郁緊。", en: "Officer: \"Did you turn on the find-my-phone function?\" Mei-kei: \"Yes, but my phone isn't here, so how can I check?\" Officer: \"You can log in to your account on our computer.\" They looked together and found the phone was now near Tsuen Wan West station, and still moving." }
  - { es: "警察即刻用對講機通知同事。佢同美琪講：「你喺度等一陣，我哋啲同事會去睇吓。你要填呢張表，寫低你嘅姓名、地址同電話號碼。」美琪填表嘅時候，警察局部電話響咗。", en: "The officer immediately radioed his colleagues. He said to Mei-kei: \"Wait here a moment, our colleagues will go and take a look. You need to fill in this form with your name, address and phone number.\" While Mei-kei was filling in the form, the police station phone rang." }
  - { es: "警察聽完電話，笑住同美琪講：「好消息！我哋啲同事喺荃灣西站捉到一個男人，佢身上面有三部手機，有一部有粉紅色嘅殼。」半個鐘之後，同事將部手機送咗返嚟警察局。美琪一睇就知：「係我嘅！唔該晒你哋！」", en: "The officer finished the call and said to Mei-kei with a smile: \"Good news! Our colleagues have caught a man at Tsuen Wan West station with three phones on him, and one of them has a pink case.\" Half an hour later, his colleagues brought the phone back to the police station. Mei-kei knew at a glance: \"It's mine! Thank you all so much!\"" }
  - { es: "原來個男人專登喺多人嘅小巴同地鐵上面搵瞓着咗嘅乘客，佢已經偷咗成個月。警察話，呢排好多人坐夜車嘅時候畀人偷嘢，因為大家返工返到好攰，一上車就瞓着。", en: "It turned out the man deliberately looked for passengers who had fallen asleep on crowded minibuses and trains, and he had been stealing for a whole month. The officer said that lately lots of people had had things stolen on late-night journeys, because everyone is so tired from work that they fall asleep as soon as they get on." }
  - { es: "警察：「你要遲啲返嚟做證人，我哋會再聯絡你。下次坐車要小心啲，唔好將手機放喺手袋最面嗰度，亦唔好喺車上面瞓着。」美琪點頭：「我以後一定會小心，再唔會畀人偷嘢！」", en: "Officer: \"You'll need to come back later as a witness, and we'll contact you again. Be more careful next time you're on a bus: don't put your phone at the top of your bag, and don't fall asleep on the bus.\" Mei-kei nodded: \"I'll definitely be careful from now on. Nobody's going to steal from me again!\"" }
questions:
  - { q: "美琪喺邊度唔見咗部手機？", options: ["喺地鐵站", "喺小巴上面", "喺警察局"], answer: 1, explain: "佢坐小巴由旺角返荃灣… 落車之後…部手機唔見咗." }
  - { q: "點解美琪知道部手機係畀人偷咗？", options: ["因為佢個手袋嘅拉鏈畀人拉開咗", "因為有人同佢講", "因為佢見到個賊"], answer: 0, explain: "我個手袋嘅拉鏈畀人拉開咗." }
  - { q: "美琪部手機係點樣嘅？", options: ["白色，有個黑色嘅殼", "黑色，有個粉紅色嘅殼", "粉紅色，冇殼"], answer: 1, explain: "係黑色嘅，有個粉紅色嘅殼，殼上面有隻貓仔." }
  - { q: "佢哋點樣知道部手機喺邊度？", options: ["個賊打電話嚟", "用電腦登入美琪嘅帳戶", "有證人睇到"], answer: 1, explain: "可以用我哋部電腦登入你嘅帳戶 - the find-my-phone function showed it near Tsuen Wan West." }
  - { q: "警察喺荃灣西站捉到嘅男人身上有乜嘢？", options: ["一部手機", "兩個手袋", "三部手機"], answer: 2, explain: "佢身上面有三部手機." }
