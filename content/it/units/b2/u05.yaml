id: b2.u05
title: "Nonostante tutto"
lessons:
  - id: b2.u05.l1
    title: Benché sia agosto
    teach: [g.concessive-clauses]
    vocab: [w.eccessivo, w.nonostante, w.tremendo, w.malgrado, w.anche-se, w.paradosso, w.per-quanto, w.impatto-ambientale, w.innegabile, w.a-dispetto-di, w.record, w.scarso, w.ciononostante, w.tutto-sommato, w.severo, w.colmo, w.benino, w.drastico, w.nonostante-ciò, w.rigoroso, w.abbondante, w.moderato, w.attendere, w.basarsi, w.contraddizione, w.significativo, w.estremo, w.impatto, w.contrasto]
    tip: "benché, sebbene, nonostante (che), malgrado (che) + congiuntivo; anche se + indicative for real facts. Nonostante and malgrado can also take a noun: nonostante la pioggia."
    sentences:
      - { es: "Benché sia agosto, a Capri stasera fa fresco.", en: "Although it's August, it's cool in Capri this evening.", altEs: ["Sebbene sia agosto, a Capri stasera fa fresco.", "Anche se è agosto, a Capri stasera fa fresco."], grammar: [g.concessive-clauses], vocab: [w.benché, w.fresco] }
      - { es: "Sebbene i prezzi siano eccessivi, la Piazzetta è sempre piena.", en: "Although the prices are excessive, the Piazzetta is always full.", altEs: ["Benché i prezzi siano eccessivi, la Piazzetta è sempre piena.", "Anche se i prezzi sono eccessivi, la Piazzetta è sempre piena."], grammar: [g.concessive-clauses], vocab: [w.eccessivo, w.prezzo] }
      - { es: "Nonostante la coda tremenda, siamo riusciti a entrare nella Grotta Azzurra.", en: "Despite the terrible queue, we managed to get into the Blue Grotto.", altEs: ["Malgrado la coda tremenda, siamo riusciti a entrare nella Grotta Azzurra."], grammar: [g.concessive-clauses], vocab: [w.nonostante, w.tremendo, w.riuscire] }
      - { es: "Malgrado la pioggia, abbiamo preso la seggiovia per il Monte Solaro.", en: "Despite the rain, we took the chairlift up Monte Solaro.", altEs: ["Nonostante la pioggia, abbiamo preso la seggiovia per il Monte Solaro."], grammar: [g.concessive-clauses], vocab: [w.malgrado, w.pioggia, w.seggiovia] }
      - { es: "Anche se costa tanto, il giro dell'isola in barca vale la pena.", en: "Even though it costs a lot, the boat trip round the island is worth it.", altEs: ["Anche se è caro, il giro dell'isola in barca vale la pena."], grammar: [g.concessive-clauses], vocab: [w.anche-se, w.isola, w.valere] }
      - { es: "Anche se ci fosse il sole, oggi la grotta resterebbe chiusa per il mare mosso.", en: "Even if the sun were out, the grotto would stay closed today because of the rough sea.", altEs: ["Anche se ci fosse il sole, oggi la grotta rimarrebbe chiusa per il mare mosso."], grammar: [g.concessive-clauses, g.periodo-ipotetico-2], vocab: [w.anche-se, w.mosso], note: "anche se + congiuntivo imperfetto = a hypothetical 'even if'." }
      - { es: "È un paradosso: benché viva di turismo, l'isola soffre per i troppi turisti.", en: "It's a paradox: although it lives off tourism, the island suffers from too many tourists.", altEs: ["È un paradosso: sebbene viva di turismo, l'isola soffre per i troppi turisti."], grammar: [g.concessive-clauses], vocab: [w.paradosso, w.soffrire] }
      - { es: "Per quanto i biglietti del traghetto siano cari, d'estate sono sempre esauriti.", en: "However expensive the ferry tickets are, in summer they're always sold out.", altEs: ["Benché i biglietti del traghetto siano cari, d'estate sono sempre esauriti."], grammar: [g.concessive-clauses], vocab: [w.per-quanto, w.traghetto] }
      - { es: "Sebbene l'impatto ambientale del turismo sia innegabile, nessuno vuole fermarlo.", en: "Although the environmental impact of tourism is undeniable, nobody wants to stop it.", altEs: ["Benché l'impatto ambientale del turismo sia innegabile, nessuno vuole fermarlo."], grammar: [g.concessive-clauses], vocab: [w.impatto-ambientale, w.innegabile, w.turismo] }
      - { es: "A dispetto del caldo record, abbiamo camminato fino a Villa Jovis.", en: "In spite of the record heat, we walked all the way to Villa Jovis.", altEs: ["Nonostante il caldo record, abbiamo camminato fino a Villa Jovis."], grammar: [g.concessive-clauses], vocab: [w.a-dispetto-di, w.record, w.camminare], note: "Villa Jovis: the villa of the emperor Tiberius, who lived on Capri from AD 27." }
      - { es: "L'acqua sull'isola è scarsa; ciononostante, quasi ogni albergo ha la piscina.", en: "Water on the island is scarce; nevertheless, almost every hotel has a pool.", altEs: ["L'acqua sull'isola è scarsa; nonostante ciò, quasi ogni albergo ha la piscina."], grammar: [g.concessive-clauses, g.connectors-contrast], vocab: [w.scarso, w.ciononostante, w.piscina] }
      - { es: "Tutto sommato, nonostante la folla, è stata una giornata bellissima.", en: "All things considered, despite the crowds, it was a wonderful day.", altEs: ["Tutto sommato, malgrado la folla, è stata una giornata bellissima."], grammar: [g.concessive-clauses], vocab: [w.tutto-sommato, w.folla] }
      - { es: "Benché le regole siano severe, qualche turista prova sempre a nuotare dove è vietato.", en: "Although the rules are strict, some tourist always tries to swim where it's forbidden.", altEs: ["Sebbene le regole siano severe, qualche turista prova sempre a nuotare dove è vietato."], grammar: [g.concessive-clauses], vocab: [w.severo, w.regola, w.nuotare] }
      - { es: "Benché sia tardi, restiamo ancora un po'.", en: "Although it's late, let's stay a bit longer.", altEs: ["Sebbene sia tardi, restiamo ancora un po'.", "Anche se è tardi, restiamo ancora un po'."], grammar: [g.concessive-clauses], vocab: [w.benché, w.tardi], error: { wrong: "Benché è tardi, restiamo ancora un po'.", explain: "benché always takes the congiuntivo in standard Italian: benché sia. With the indicative, use anche se (anche se è tardi).", grammar: g.concessive-clauses } }
      - { es: "È stanco, ma continua a camminare.", en: "He's tired, but he keeps on walking.", grammar: [g.connectors-contrast], vocab: [w.stanco, w.continuare], transform: { instruction: "Rewrite with benché", answer: "Benché sia stanco, continua a camminare.", alt: ["Sebbene sia stanco, continua a camminare.", "Nonostante sia stanco, continua a camminare."], en: "Although he's tired, he keeps on walking." } }
      - { es: "Benché piova, usciamo lo stesso.", en: "Although it's raining, we're going out anyway.", altEs: ["Sebbene piova, usciamo lo stesso."], grammar: [g.concessive-clauses], vocab: [w.piovere, w.uscire], transform: { instruction: "Rewrite with anche se", answer: "Anche se piove, usciamo lo stesso.", alt: ["Usciamo lo stesso, anche se piove."], en: "Even though it's raining, we're going out anyway." } }
    exchanges:
      - q: { es: "Com'era la cena in Piazzetta?", en: "How was dinner in the Piazzetta?" }
        a: { es: "Buona, anche se il conto era il colmo: venti euro per un'insalata!", en: "Good, although the bill was the last straw: twenty euros for a salad!" }
        alt: ["Buona, ma carissima.", "Ottima, nonostante i prezzi."]
        grammar: [g.concessive-clauses]
        vocab: [w.colmo, w.conto]
      - q: { es: "Ti è piaciuta Capri?", en: "Did you like Capri?" }
        a: { es: "Benino: sebbene il paesaggio sia splendido, c'era davvero troppa gente.", en: "Fairly: although the scenery is splendid, there were really too many people." }
        alt: ["Benino.", "Moltissimo, nonostante la folla."]
        grammar: [g.concessive-clauses]
        vocab: [w.benino, w.paesaggio]
      - q: { es: "Che cosa pensi delle nuove regole per i traghetti?", en: "What do you think of the new rules for the ferries?" }
        a: { es: "Sono un po' drastiche, ma nonostante ciò credo che servano.", en: "They're a bit drastic, but even so I think they're needed." }
        alt: ["Sono drastiche, ma servono.", "Benché siano severe, credo che servano."]
        grammar: [g.concessive-clauses, g.congiuntivo-opinion]
        vocab: [w.drastico, w.nonostante-ciò]
      - q: { es: "Il professore di storia è severo?", en: "Is the history teacher strict?" }
        a: { es: "Rigoroso, ma giusto: benché i suoi esami siano difficili, tutti lo rispettano.", en: "Rigorous, but fair: although his exams are hard, everyone respects him." }
        alt: ["Rigoroso, ma giusto.", "Sì, anche se è simpatico."]
        grammar: [g.concessive-clauses]
        vocab: [w.rigoroso, w.severo]
      - q: { es: "Avete mangiato bene ad Anacapri?", en: "Did you eat well in Anacapri?" }
        a: { es: "Benissimo: le porzioni erano abbondanti, benché il prezzo fosse moderato.", en: "Very well: the portions were generous, although the price was moderate." }
        alt: ["Benissimo, e abbiamo speso poco.", "Sì, porzioni abbondanti e prezzi giusti."]
        grammar: [g.concessive-clauses, g.congiuntivo-imperfetto]
        vocab: [w.abbondante, w.moderato, w.porzione]
    texts:
      - title: "Avviso al porto di Marina Grande"
        es: ["Si avvisano i signori passeggeri che, a causa del mare mosso, oggi la Grotta Azzurra è chiusa.", "Nonostante ciò, i giri dell'isola in barca sono regolari.", "Vi preghiamo di attendere l'imbarco sul molo."]
        en: ["Passengers are advised that, owing to the rough sea, the Blue Grotto is closed today.", "Despite this, boat trips round the island are running normally.", "Please wait for boarding on the quay."]
        grammar: [g.concessive-clauses, g.si-passivante]
        vocab: [w.nonostante-ciò, w.attendere, w.molo, w.mosso]
      - title: "Uno studio sul turismo"
        es: ["Lo studio si basa su dati raccolti in dieci anni.", "Benché i visitatori siano aumentati, gli abitanti dell'isola sono diminuiti: una contraddizione significativa.", "Gli autori chiedono di limitare il turismo estremo."]
        en: ["The study is based on data collected over ten years.", "Although visitors have increased, the island's inhabitants have decreased: a significant contradiction.", "The authors call for limits on extreme tourism."]
        grammar: [g.concessive-clauses, g.congiuntivo-passato]
        vocab: [w.basarsi, w.contraddizione, w.significativo, w.estremo]
    spicy:
      - { es: "Benché tu sia sempre in ritardo, ti aspetterei anche un'ora in Piazzetta.", en: "Although you're always late, I'd wait an hour for you in the Piazzetta.", altEs: ["Sebbene tu sia sempre in ritardo, ti aspetterei anche un'ora in Piazzetta."], grammar: [g.concessive-clauses], vocab: [w.benché, w.ritardo] }
      - { es: "Anche se il traghetto è pieno, trovo sempre un posto vicino a te.", en: "Even if the ferry is full, I always find a seat next to you.", altEs: ["Anche se il traghetto è pieno, riesco sempre a sedermi vicino a te."], grammar: [g.concessive-clauses], vocab: [w.anche-se, w.traghetto] }
      - { es: "Nonostante il prezzo tremendo dello spritz, offro io: stasera sei tu il mio lusso.", en: "Despite the terrible price of the spritz, it's on me: tonight you're my luxury.", altEs: ["Malgrado il prezzo tremendo dello spritz, offro io: stasera il mio lusso sei tu."], grammar: [g.concessive-clauses], vocab: [w.nonostante, w.tremendo, w.lusso] }
      - { es: "Sebbene giuri di non essere romantico, mi hai portata a vedere il tramonto ai Faraglioni.", en: "Although you swear you're not romantic, you took me to see the sunset at the Faraglioni.", altEs: ["Benché giuri di non essere romantico, mi hai portata a vedere il tramonto ai Faraglioni.", "Sebbene giuri di non essere romantica, mi hai portato a vedere il tramonto ai Faraglioni."], grammar: [g.concessive-clauses], vocab: [w.romantico, w.tramonto] }
      - { es: "Malgrado le mie regole severe sul primo appuntamento, ti ho già presentato a mia madre.", en: "Despite my strict rules about first dates, I've already introduced you to my mother.", altEs: ["Nonostante le mie regole severe sul primo appuntamento, ti ho già presentata a mia madre."], grammar: [g.concessive-clauses], vocab: [w.malgrado, w.severo, w.presentare] }
  - id: b2.u05.l2
    title: Pur essendo lontano
    teach: [g.pur-gerundio]
    vocab: [w.pur, w.emigrante, w.emigrare, w.emigrazione, w.sfida, w.sacrificio, w.difficoltà, w.questione-meridionale, w.meridionale, w.settentrionale, w.ostacolo, w.tenacia, w.determinazione, w.lottare, w.lotta, w.miseria, w.sacrificare, w.determinato, w.tenace, w.dignità, w.orgoglioso-di, w.migrante, w.coraggio, w.resilienza, w.soffrire]
    tip: "pur + gerund = although, when both clauses share the subject: Pur essendo stanco, è uscito = Benché fosse stanco, è uscito. For an earlier action use the compound gerund: pur avendo vinto."
    sentences:
      - { es: "Pur vivendo a New York da trent'anni, mio zio parla ancora napoletano.", en: "Although he's lived in New York for thirty years, my uncle still speaks Neapolitan.", altEs: ["Benché viva a New York da trent'anni, mio zio parla ancora napoletano."], grammar: [g.pur-gerundio, g.da-since], vocab: [w.pur, w.zio, w.napoletano] }
      - { es: "Pur essendo partiti senza niente, molti emigranti hanno costruito una vita nuova.", en: "Despite having left with nothing, many emigrants built a new life.", altEs: ["Benché fossero partiti senza niente, molti emigranti hanno costruito una vita nuova."], grammar: [g.pur-gerundio, g.gerundio-composto], vocab: [w.emigrante, w.costruire] }
      - { es: "Pur amando la sua isola, dovette emigrare per lavoro.", en: "Although he loved his island, he had to emigrate for work.", altEs: ["Pur amando la sua isola, è dovuto emigrare per lavoro.", "Benché amasse la sua isola, dovette emigrare per lavoro."], grammar: [g.pur-gerundio, g.passato-remoto-recognition], vocab: [w.emigrare, w.isola] }
      - { es: "L'emigrazione dal Sud verso le Americhe crebbe molto alla fine dell'Ottocento.", en: "Emigration from the South to the Americas grew a great deal at the end of the 19th century.", altEs: ["Alla fine dell'Ottocento l'emigrazione dal Sud verso le Americhe crebbe molto."], grammar: [g.passato-remoto-recognition], vocab: [w.emigrazione, w.sud] }
      - { es: "Pur sapendo che sarebbe stata dura, ha accettato la sfida.", en: "Even though she knew it would be hard, she accepted the challenge.", altEs: ["Benché sapesse che sarebbe stata dura, ha accettato la sfida."], grammar: [g.pur-gerundio, g.concordanza-congiuntivo], vocab: [w.sfida, w.accettare] }
      - { es: "Pur avendo fatto tanti sacrifici, i miei nonni non si sono mai lamentati.", en: "Despite having made so many sacrifices, my grandparents never complained.", altEs: ["Benché avessero fatto tanti sacrifici, i miei nonni non si sono mai lamentati."], grammar: [g.pur-gerundio, g.gerundio-composto], vocab: [w.sacrificio, w.lamentarsi] }
      - { es: "Pur tra mille difficoltà, la famiglia è rimasta unita.", en: "Despite a thousand difficulties, the family stayed together.", altEs: ["Nonostante mille difficoltà, la famiglia è rimasta unita."], grammar: [g.pur-gerundio], vocab: [w.difficoltà, w.famiglia], note: "pur + preposition phrase (pur tra, pur nella) is a formal variant." }
      - { es: "Il dibattito sulla questione meridionale cominciò poco dopo l'Unità d'Italia.", en: "The debate on the Southern question began shortly after Italian Unification.", altEs: ["Il dibattito sulla questione meridionale è cominciato poco dopo l'Unità d'Italia."], grammar: [g.passato-remoto-recognition], vocab: [w.questione-meridionale, w.dibattito] }
      - { es: "Pur lavorando in una fabbrica di Torino, si sentiva profondamente meridionale.", en: "Although he worked in a factory in Turin, he felt deeply southern.", altEs: ["Benché lavorasse in una fabbrica di Torino, si sentiva profondamente meridionale."], grammar: [g.pur-gerundio], vocab: [w.meridionale, w.fabbrica] }
      - { es: "Molti settentrionali, pur non conoscendo il Sud, avevano tanti pregiudizi.", en: "Many northerners, despite not knowing the South, had lots of prejudices.", altEs: ["Molti settentrionali, benché non conoscessero il Sud, avevano tanti pregiudizi."], grammar: [g.pur-gerundio], vocab: [w.settentrionale, w.conoscere] }
      - { es: "Ha superato ogni ostacolo con tenacia e determinazione.", en: "She overcame every obstacle with tenacity and determination.", altEs: ["Ha superato tutti gli ostacoli con tenacia e determinazione."], grammar: [g.passato-prossimo-avere], vocab: [w.ostacolo, w.tenacia, w.determinazione, w.superare] }
      - { es: "Pur essendo stanca, ha continuato a lottare per i suoi diritti.", en: "Although she was tired, she kept fighting for her rights.", altEs: ["Benché fosse stanca, ha continuato a lottare per i suoi diritti."], grammar: [g.pur-gerundio], vocab: [w.lottare, w.diritto] }
      - { es: "La lotta contro la miseria è durata intere generazioni.", en: "The struggle against poverty lasted entire generations.", altEs: ["La lotta contro la miseria è andata avanti per intere generazioni."], grammar: [g.passato-prossimo-essere], vocab: [w.lotta, w.miseria] }
      - { es: "Pur essendo stanco, continua a lavorare.", en: "Although he's tired, he keeps working.", altEs: ["Benché sia stanco, continua a lavorare."], grammar: [g.pur-gerundio], vocab: [w.pur, w.stanco], error: { wrong: "Pur è stanco, continua a lavorare.", explain: "pur is followed by a gerund (essendo); with a conjugated verb use benché + congiuntivo (benché sia stanco).", grammar: g.pur-gerundio } }
      - { es: "Benché conoscesse la strada, si è perso.", en: "Although he knew the way, he got lost.", altEs: ["Sebbene conoscesse la strada, si è perso."], grammar: [g.concessive-clauses], vocab: [w.strada, w.perdersi], transform: { instruction: "Rewrite with pur + gerund", answer: "Pur conoscendo la strada, si è perso.", alt: ["Si è perso, pur conoscendo la strada."], en: "Despite knowing the way, he got lost." } }
      - { es: "Anche se ha vinto, la squadra non era contenta.", en: "Even though it won, the team wasn't happy.", grammar: [g.concessive-clauses], vocab: [w.vincere, w.squadra], transform: { instruction: "Rewrite with pur + compound gerund", answer: "Pur avendo vinto, la squadra non era contenta.", alt: ["La squadra, pur avendo vinto, non era contenta."], en: "Despite having won, the team wasn't happy." } }
    exchanges:
      - q: { es: "Perché tuo nonno è partito per la Germania?", en: "Why did your grandfather leave for Germany?" }
        a: { es: "Per lavoro: pur non volendo lasciare l'isola, ha sacrificato tutto per la famiglia.", en: "For work: although he didn't want to leave the island, he sacrificed everything for his family." }
        alt: ["Per lavoro.", "Pur non volendo partire, non aveva scelta."]
        grammar: [g.pur-gerundio]
        vocab: [w.sacrificare, w.famiglia]
      - q: { es: "Com'era tua nonna?", en: "What was your grandmother like?" }
        a: { es: "Una donna determinata e tenace: pur avendo poco, non ha mai perso la dignità.", en: "A determined, tenacious woman: although she had little, she never lost her dignity." }
        alt: ["Determinata e tenace.", "Una donna forte, pur avendo poco."]
        grammar: [g.pur-gerundio]
        vocab: [w.determinato, w.tenace, w.dignità]
      - q: { es: "Che cosa provi per la tua famiglia?", en: "How do you feel about your family?" }
        a: { es: "Sono orgoglioso di loro: pur partendo da zero, ce l'hanno fatta.", en: "I'm proud of them: despite starting from nothing, they made it." }
        alt: ["Sono orgogliosa di loro.", "Tanta gratitudine e tanto orgoglio."]
        grammar: [g.pur-gerundio, g.pronominal-verbs]
        vocab: [w.orgoglioso-di]
      - q: { es: "Che cosa serve a un migrante, secondo te?", en: "What does a migrant need, in your view?" }
        a: { es: "Tanto coraggio, un po' di fortuna e qualcuno che lo accolga.", en: "Lots of courage, a bit of luck and someone to welcome them." }
        alt: ["Coraggio e fortuna.", "Tanto coraggio."]
        grammar: [g.congiuntivo-presente-forms]
        vocab: [w.migrante, w.coraggio]
      - q: { es: "Che cos'è la resilienza?", en: "What is resilience?" }
        a: { es: "È la capacità di andare avanti pur tra mille difficoltà.", en: "It's the ability to keep going despite a thousand difficulties." }
        alt: ["La capacità di non arrendersi.", "Andare avanti nonostante tutto."]
        grammar: [g.pur-gerundio]
        vocab: [w.resilienza, w.difficoltà]
    texts:
      - title: "Lettera dall'America, 1910"
        es: ["Cara madre, pur lavorando dodici ore al giorno, guadagno più che a casa.", "La vita qui è dura, ma non mi arrendo.", "Pur essendo lontano, penso a voi ogni sera."]
        en: ["Dear Mother, although I work twelve hours a day, I earn more than at home.", "Life here is hard, but I'm not giving up.", "Although I'm far away, I think of you every evening."]
        grammar: [g.pur-gerundio]
        vocab: [w.pur, w.arrendersi]
      - title: "Pannello del museo dell'emigrazione"
        es: ["In un secolo milioni di italiani lasciarono il Paese.", "Molti partirono dal Sud pur non sapendo né leggere né scrivere.", "Le loro storie parlano di sacrificio, ma anche di coraggio."]
        en: ["In a century millions of Italians left the country.", "Many left from the South even though they could neither read nor write.", "Their stories speak of sacrifice, but also of courage."]
        grammar: [g.pur-gerundio, g.passato-remoto-recognition]
        vocab: [w.sacrificio, w.coraggio]
    spicy:
      - { es: "Pur conoscendoti da una settimana, so già che ordini sempre il dolce di qualcun altro.", en: "Despite knowing you for only a week, I already know you always order someone else's dessert.", altEs: ["Pur conoscendoti solo da una settimana, so già che ordini sempre il dolce di qualcun altro."], grammar: [g.pur-gerundio], vocab: [w.pur, w.dolce] }
      - { es: "Pur essendo settentrionale, hai imparato a dire «amore» con l'accento napoletano.", en: "Although you're a northerner, you've learnt to say 'amore' with a Neapolitan accent.", altEs: ["Pur essendo del Nord, hai imparato a dire «amore» con l'accento napoletano."], grammar: [g.pur-gerundio], vocab: [w.settentrionale, w.accento] }
      - { es: "Pur sapendo che sei sempre in ritardo, ti ho dato appuntamento alle otto: ci vediamo alle nove.", en: "Knowing you're always late, I told you to meet me at eight: see you at nine.", altEs: ["Pur sapendo che arrivi sempre in ritardo, ti ho dato appuntamento alle otto: ci vediamo alle nove."], grammar: [g.pur-gerundio], vocab: [w.appuntamento, w.ritardo] }
      - { es: "Pur non sapendo ballare, mi hai invitata a ballare la tarantella: che coraggio!", en: "Even though you can't dance, you asked me to dance the tarantella: what courage!", altEs: ["Pur non sapendo ballare, mi hai invitato a ballare la tarantella: che coraggio!"], grammar: [g.pur-gerundio], vocab: [w.coraggio, w.ballare] }
  - id: b2.u05.l3
    title: Qualunque cosa succeda
    teach: [g.chiunque-qualunque]
    vocab: [w.qualunque-cosa, w.dovunque, w.comunque-vada, w.qualunque, w.ovunque, w.chiunque-sia, w.comunque-sia, w.arrendersi, w.in-ogni-caso, w.compromesso, w.ad-ogni-modo, w.conflitto, w.cedere, w.alternativa, w.tensione, w.ostinato, w.debole, w.perseverare, w.debolezza, w.resistenza, w.fragile, w.importare]
    tip: "chiunque, qualunque / qualsiasi, dovunque / ovunque, comunque + congiuntivo: chiunque venga, qualunque cosa succeda, dovunque tu vada, comunque vada. Qualunque and qualsiasi take a singular noun."
    sentences:
      - { es: "Chiunque arrivi dopo le sei, dovrà aspettare il traghetto successivo.", en: "Whoever arrives after six will have to wait for the next ferry.", altEs: ["Chi arriva dopo le sei dovrà aspettare il traghetto successivo."], grammar: [g.chiunque-qualunque], vocab: [w.chiunque, w.traghetto] }
      - { es: "Qualunque cosa succeda, chiamami.", en: "Whatever happens, call me.", altEs: ["Qualsiasi cosa succeda, chiamami.", "Qualunque cosa accada, chiamami."], grammar: [g.chiunque-qualunque, g.imperativo-pronouns], vocab: [w.qualunque-cosa, w.succedere] }
      - { es: "Dovunque tu vada sull'isola, troverai limoni e fiori.", en: "Wherever you go on the island, you'll find lemons and flowers.", altEs: ["Ovunque tu vada sull'isola, troverai limoni e fiori."], grammar: [g.chiunque-qualunque], vocab: [w.dovunque, w.limone, w.fiore] }
      - { es: "Comunque vada, sarà un viaggio che non dimenticheremo.", en: "However it turns out, it'll be a trip we won't forget.", altEs: ["Comunque vada, sarà un viaggio da non dimenticare."], grammar: [g.chiunque-qualunque], vocab: [w.comunque-vada, w.dimenticare] }
      - { es: "Qualunque decisione prendiate, io la rispetterò.", en: "Whatever decision you take, I'll respect it.", altEs: ["Qualsiasi decisione prendiate, io la rispetterò."], grammar: [g.chiunque-qualunque], vocab: [w.qualunque, w.decisione, w.rispettare] }
      - { es: "Ovunque guardassi, vedevo turisti con il telefono in mano.", en: "Wherever I looked, I saw tourists with phones in their hands.", altEs: ["Dovunque guardassi, vedevo turisti con il telefono in mano."], grammar: [g.chiunque-qualunque, g.congiuntivo-imperfetto], vocab: [w.ovunque, w.turista] }
      - { es: "Chiunque sia, digli che non ci sono.", en: "Whoever it is, tell them I'm not in.", altEs: ["Chiunque sia, dille che non ci sono."], grammar: [g.chiunque-qualunque, g.imperativo-pronouns], vocab: [w.chiunque-sia] }
      - { es: "Comunque sia, io non mi arrendo.", en: "Be that as it may, I'm not giving up.", altEs: ["Comunque sia, non mi arrendo."], grammar: [g.chiunque-qualunque], vocab: [w.comunque-sia, w.arrendersi] }
      - { es: "In ogni caso, dobbiamo trovare un compromesso.", en: "In any case, we need to find a compromise.", altEs: ["Ad ogni modo, dobbiamo trovare un compromesso."], grammar: [g.connectors-contrast], vocab: [w.in-ogni-caso, w.compromesso] }
      - { es: "Ad ogni modo, il conflitto tra residenti e turisti non si risolverà facilmente.", en: "Anyway, the conflict between residents and tourists won't be easily resolved.", altEs: ["In ogni caso, il conflitto tra residenti e turisti non si risolverà facilmente."], grammar: [g.connectors-contrast], vocab: [w.ad-ogni-modo, w.conflitto, w.risolvere] }
      - { es: "Per quanto tu insista, non cederò.", en: "However much you insist, I won't give in.", altEs: ["Anche se insisti, non cederò."], grammar: [g.concessive-clauses], vocab: [w.per-quanto, w.cedere, w.insistere] }
      - { es: "Qualsiasi alternativa tu proponga, la discuteremo insieme.", en: "Whatever alternative you propose, we'll discuss it together.", altEs: ["Qualunque alternativa tu proponga, la discuteremo insieme."], grammar: [g.chiunque-qualunque], vocab: [w.alternativa, w.proporre, w.discutere] }
      - { es: "C'è tensione in Piazzetta: chiunque passi, si ferma a guardare.", en: "There's tension in the Piazzetta: whoever walks by stops to look.", altEs: ["C'è tensione in Piazzetta: chi passa si ferma a guardare."], grammar: [g.chiunque-qualunque], vocab: [w.tensione, w.chiunque] }
      - { es: "Qualunque cosa tu decida, ti aiuterò.", en: "Whatever you decide, I'll help you.", altEs: ["Qualsiasi cosa tu decida, ti aiuterò."], grammar: [g.chiunque-qualunque], vocab: [w.qualunque-cosa, w.decidere], error: { wrong: "Qualunque cose tu decida, ti aiuterò.", explain: "qualunque (and qualsiasi) takes a singular noun: qualunque cosa.", grammar: g.chiunque-qualunque } }
      - { es: "Non importa chi viene: è il benvenuto.", en: "It doesn't matter who comes: they're welcome.", grammar: [g.indefinites], vocab: [w.importare, w.benvenuto], transform: { instruction: "Rewrite with chiunque", answer: "Chiunque venga, è il benvenuto.", alt: ["Chiunque venga è il benvenuto."], en: "Whoever comes is welcome." } }
      - { es: "Non importa dove andate: vi seguiremo.", en: "It doesn't matter where you go: we'll follow you.", grammar: [g.indefinites], vocab: [w.importare, w.seguire], transform: { instruction: "Rewrite with dovunque", answer: "Dovunque andiate, vi seguiremo.", alt: ["Ovunque andiate, vi seguiremo."], en: "Wherever you go, we'll follow you." } }
    exchanges:
      - q: { es: "E se perdo l'ultimo traghetto?", en: "And what if I miss the last ferry?" }
        a: { es: "Qualunque cosa succeda, chiamami: ti ospito io ad Anacapri.", en: "Whatever happens, call me: you can stay at mine in Anacapri." }
        alt: ["Chiamami e dormi da me.", "In ogni caso, c'è sempre un albergo."]
        grammar: [g.chiunque-qualunque]
        vocab: [w.qualunque-cosa, w.ospitare]
      - q: { es: "Chi può partecipare alla regata?", en: "Who can take part in the regatta?" }
        a: { es: "Chiunque abbia una barca e un po' di coraggio.", en: "Anyone with a boat and a bit of courage." }
        alt: ["Chiunque abbia una barca.", "Tutti, basta avere una barca."]
        grammar: [g.chiunque-qualunque]
        vocab: [w.chiunque, w.barca]
      - q: { es: "Sei ancora convinto di aprire il ristorante?", en: "Are you still set on opening the restaurant?" }
        a: { es: "Sì: sono ostinato, e chiunque mi conosca lo sa.", en: "Yes: I'm stubborn, and anyone who knows me knows it." }
        alt: ["Sì, sono ostinato.", "Certo, comunque vada."]
        grammar: [g.chiunque-qualunque]
        vocab: [w.ostinato, w.convinto]
      - q: { es: "Come stai dopo l'operazione?", en: "How are you after the operation?" }
        a: { es: "Ancora un po' debole, ma comunque vada, voglio perseverare con gli esercizi.", en: "Still a bit weak, but however it goes, I want to keep at the exercises." }
        alt: ["Un po' debole.", "Meglio, grazie."]
        grammar: [g.chiunque-qualunque]
        vocab: [w.debole, w.perseverare]
      - q: { es: "Qual è la tua debolezza?", en: "What's your weakness?" }
        a: { es: "I dolci: dovunque io sia, trovo sempre una pasticceria.", en: "Sweets: wherever I am, I always find a pastry shop." }
        alt: ["I dolci.", "La mia debolezza? Il gelato."]
        grammar: [g.chiunque-qualunque]
        vocab: [w.debolezza, w.dovunque, w.pasticceria]
    texts:
      - title: "Informazioni per i turisti"
        es: ["Chiunque voglia visitare la Grotta Azzurra deve prendere una barca a Marina Grande.", "Qualunque sia il tempo, portate acqua e cappello.", "In ogni caso, la grotta può chiudere senza preavviso."]
        en: ["Anyone who wants to visit the Blue Grotto must take a boat at Marina Grande.", "Whatever the weather, bring water and a hat.", "In any case, the grotto may close without notice."]
        grammar: [g.chiunque-qualunque, g.imperativo-noi-voi]
        vocab: [w.chiunque, w.qualunque, w.in-ogni-caso]
      - title: "La regata"
        es: ["I partecipanti hanno mostrato una resistenza incredibile.", "Qualunque cosa succedesse, nessuno si è arreso.", "Perfino la barca più fragile è arrivata al traguardo."]
        en: ["The participants showed incredible endurance.", "Whatever happened, nobody gave up.", "Even the most fragile boat reached the finishing line."]
        grammar: [g.chiunque-qualunque, g.concordanza-congiuntivo]
        vocab: [w.resistenza, w.fragile, w.traguardo]
    spicy:
      - { es: "Dovunque tu vada stasera, io sarò per caso nello stesso posto.", en: "Wherever you go tonight, I'll happen to be in the same place.", altEs: ["Ovunque tu vada stasera, io sarò per caso nello stesso posto."], grammar: [g.chiunque-qualunque], vocab: [w.dovunque, w.posto] }
      - { es: "Chiunque ti abbia insegnato a ballare, merita un monumento.", en: "Whoever taught you to dance deserves a monument.", altEs: ["Chiunque ti abbia insegnato a ballare meriterebbe un monumento."], grammar: [g.chiunque-qualunque, g.congiuntivo-passato], vocab: [w.chiunque, w.insegnare] }
      - { es: "Qualunque cosa tu ordini, io ne ordino un'altra: così assaggio anche la tua.", en: "Whatever you order, I'll order something else: that way I get to taste yours too.", altEs: ["Qualsiasi cosa tu ordini, io ne ordino un'altra: così assaggio anche la tua."], grammar: [g.chiunque-qualunque], vocab: [w.qualunque-cosa, w.assaggiare] }
      - { es: "Comunque vada questa cena, almeno il panorama è bellissimo... e anche tu.", en: "However this dinner goes, at least the view is beautiful... and so are you.", altEs: ["Comunque vada questa cena, almeno il panorama è stupendo... e anche tu."], grammar: [g.chiunque-qualunque], vocab: [w.comunque-vada, w.panorama] }
      - { es: "Sono ostinato: chiunque altro si sarebbe arreso dopo tre no, io ti invito per la quarta volta.", en: "I'm stubborn: anyone else would have given up after three noes, I'm asking you out for the fourth time.", altEs: ["Sono ostinata: chiunque altro si sarebbe arreso dopo tre no, io ti invito per la quarta volta."], grammar: [g.chiunque-qualunque, g.condizionale-passato], vocab: [w.ostinato, w.arrendersi] }
  - id: b2.u05.l4
    title: Nonostante tutto, rinascere
    teach: [g.concessive-clauses, g.chiunque-qualunque]
    vocab: [w.sassi, w.abbandonare, w.abbandono, w.rinascita, w.esempio-da-seguire, w.spopolamento, w.grotta, w.riscatto, w.ispirare, w.ammirare, w.ammirazione, w.ispirazione, w.modello, w.svuotare]
    tip: "Put it all together: concession (benché fosse, nonostante l'abbandono, pur essendo) and indefinites (chiunque visiti, qualunque cosa si dica)."
    sentences:
      - { es: "Benché i Sassi fossero abitati da migliaia di anni, negli anni Cinquanta furono svuotati.", en: "Although the Sassi had been inhabited for thousands of years, they were emptied in the 1950s.", altEs: ["Sebbene i Sassi fossero abitati da migliaia di anni, negli anni Cinquanta furono svuotati."], grammar: [g.concessive-clauses, g.passive-essere], vocab: [w.sassi, w.abitare, w.svuotare] }
      - { es: "Nonostante l'abbandono, le case scavate nella roccia non sono mai crollate del tutto.", en: "Despite being abandoned, the houses carved into the rock never completely collapsed.", altEs: ["Malgrado l'abbandono, le case scavate nella roccia non sono mai crollate del tutto."], grammar: [g.concessive-clauses], vocab: [w.abbandono, w.roccia, w.crollare] }
      - { es: "Chiunque visiti Matera oggi resta senza parole.", en: "Anyone who visits Matera today is left speechless.", altEs: ["Chi visita Matera oggi resta senza parole."], grammar: [g.chiunque-qualunque], vocab: [w.chiunque, w.visitare] }
      - { es: "Pur essendo stata chiamata «vergogna nazionale», Matera è diventata Capitale europea della cultura.", en: "Despite having been called a 'national disgrace', Matera became European Capital of Culture.", altEs: ["Benché fosse stata chiamata «vergogna nazionale», Matera è diventata Capitale europea della cultura."], grammar: [g.pur-gerundio, g.gerundio-composto], vocab: [w.vergogna, w.cultura] }
      - { es: "La rinascita dei Sassi è un esempio da seguire per tutto il Sud.", en: "The revival of the Sassi is a model for the whole South to follow.", altEs: ["La rinascita dei Sassi è un modello per tutto il Sud."], grammar: [g.concessive-clauses], vocab: [w.rinascita, w.esempio-da-seguire] }
      - { es: "Benché lo spopolamento continui in molti paesi, alcuni giovani stanno tornando.", en: "Although depopulation is continuing in many villages, some young people are coming back.", altEs: ["Sebbene lo spopolamento continui in molti paesi, alcuni giovani stanno tornando."], grammar: [g.concessive-clauses, g.stare-gerundio], vocab: [w.spopolamento, w.giovane] }
      - { es: "Anche se viveva in una grotta, la famiglia non ha mai perso la dignità.", en: "Even though it lived in a cave, the family never lost its dignity.", altEs: ["Pur vivendo in una grotta, la famiglia non ha mai perso la dignità."], grammar: [g.concessive-clauses], vocab: [w.grotta, w.dignità] }
      - { es: "Per i materani, il 2019 è stato un vero riscatto.", en: "For the people of Matera, 2019 was a real redemption.", altEs: ["Per gli abitanti di Matera, il 2019 è stato un vero riscatto."], grammar: [g.passato-prossimo-essere], vocab: [w.riscatto] }
      - { es: "Qualunque cosa si dica del Sud, la sua cultura continua a ispirare il mondo.", en: "Whatever people say about the South, its culture keeps inspiring the world.", altEs: ["Qualsiasi cosa si dica del Sud, la sua cultura continua a ispirare il mondo."], grammar: [g.chiunque-qualunque, g.si-impersonale], vocab: [w.ispirare, w.qualunque-cosa] }
      - { es: "Ammiro chiunque abbia il coraggio di ricominciare da zero.", en: "I admire anyone who has the courage to start again from scratch.", altEs: ["Ammiro chi ha il coraggio di ricominciare da zero."], grammar: [g.chiunque-qualunque], vocab: [w.ammirare, w.coraggio] }
      - { es: "L'ammirazione dei turisti per Matera è enorme, sebbene pochi conoscano la sua storia.", en: "Tourists' admiration for Matera is enormous, although few know its history.", altEs: ["L'ammirazione dei turisti per Matera è enorme, benché pochi ne conoscano la storia."], grammar: [g.concessive-clauses], vocab: [w.ammirazione, w.storia] }
      - { es: "Per chiunque cerchi ispirazione, i Sassi all'alba sono perfetti.", en: "For anyone looking for inspiration, the Sassi at dawn are perfect.", altEs: ["Per chi cerca ispirazione, i Sassi all'alba sono perfetti."], grammar: [g.chiunque-qualunque], vocab: [w.ispirazione, w.alba] }
      - { es: "Mia nonna è il mio modello: pur avendo sofferto tanto, sorride sempre.", en: "My grandmother is my role model: despite having suffered so much, she always smiles.", altEs: ["Mia nonna è il mio modello: benché abbia sofferto tanto, sorride sempre."], grammar: [g.pur-gerundio, g.gerundio-composto], vocab: [w.modello, w.soffrire] }
      - { es: "Anche se piove, andiamo a vedere i Sassi.", en: "Even if it's raining, let's go and see the Sassi.", altEs: ["Andiamo a vedere i Sassi anche se piove."], grammar: [g.concessive-clauses], vocab: [w.anche-se, w.sassi], error: { wrong: "Anche se piova, andiamo a vedere i Sassi.", explain: "anche se takes the indicative for real situations (piove); the congiuntivo goes after benché or sebbene.", grammar: g.concessive-clauses } }
      - { es: "Era povera, ma era felice.", en: "She was poor, but she was happy.", grammar: [g.imperfetto-uses], vocab: [w.povero, w.felice], transform: { instruction: "Rewrite with benché", answer: "Benché fosse povera, era felice.", alt: ["Sebbene fosse povera, era felice.", "Pur essendo povera, era felice."], en: "Although she was poor, she was happy." } }
      - { es: "Tutti quelli che vengono a Matera se ne innamorano.", en: "Everyone who comes to Matera falls in love with it.", grammar: [g.relative-chi-quello-che], vocab: [w.innamorarsi], transform: { instruction: "Rewrite with chiunque", answer: "Chiunque venga a Matera se ne innamora.", alt: ["Chiunque venga a Matera, se ne innamora."], en: "Whoever comes to Matera falls in love with it." } }
    exchanges:
      - q: { es: "Perché i Sassi furono abbandonati?", en: "Why were the Sassi abandoned?" }
        a: { es: "Perché, nonostante la loro bellezza, la gente viveva in condizioni durissime, spesso con gli animali in casa.", en: "Because, despite their beauty, people lived in very harsh conditions, often with animals in the house." }
        alt: ["Per le condizioni di vita difficili.", "Perché la gente viveva in miseria."]
        grammar: [g.concessive-clauses]
        vocab: [w.abbandonare, w.condizione]
      - q: { es: "Che cosa ti ha colpito di Matera?", en: "What struck you about Matera?" }
        a: { es: "La sua rinascita: nonostante tutto, ce l'ha fatta.", en: "Its revival: despite everything, it made it." }
        alt: ["La rinascita della città.", "La luce sui Sassi all'alba."]
        grammar: [g.concessive-clauses, g.pronominal-verbs]
        vocab: [w.rinascita, w.colpire]
      - q: { es: "Chi ammiri di più?", en: "Who do you admire most?" }
        a: { es: "Chiunque lotti per il proprio paese invece di abbandonarlo.", en: "Anyone who fights for their home town instead of abandoning it." }
        alt: ["Chi lotta per il proprio paese.", "Mia nonna."]
        grammar: [g.chiunque-qualunque]
        vocab: [w.ammirare, w.lottare, w.abbandonare]
      - q: { es: "Tornerai al tuo paese?", en: "Will you go back to your village?" }
        a: { es: "Forse: benché lì ci sia poco lavoro, è casa mia.", en: "Maybe: although there's little work there, it's my home." }
        alt: ["Forse un giorno.", "Sì, nonostante tutto."]
        grammar: [g.concessive-clauses]
        vocab: [w.paese, w.tornare]
    texts:
      - title: "Matera, Capitale europea della cultura"
        es: ["Negli anni Cinquanta i Sassi furono svuotati, nonostante le proteste di alcuni abitanti.", "Per decenni rimasero un simbolo di miseria.", "Oggi chiunque li visiti scopre una città rinata."]
        en: ["In the 1950s the Sassi were emptied, despite protests from some inhabitants.", "For decades they remained a symbol of poverty.", "Today anyone who visits them discovers a city reborn."]
        grammar: [g.concessive-clauses, g.chiunque-qualunque]
        vocab: [w.sassi, w.miseria, w.simbolo]
      - title: "Capri d'inverno"
        es: ["D'inverno Capri si svuota: benché l'isola sia bellissima, molti negozi chiudono.", "Chi resta lotta contro lo spopolamento.", "Eppure, comunque vada, i capresi non abbandonerebbero mai la loro isola."]
        en: ["In winter Capri empties: although the island is beautiful, many shops close.", "Those who stay fight against depopulation.", "And yet, whatever happens, the people of Capri would never abandon their island."]
        grammar: [g.concessive-clauses, g.chiunque-qualunque]
        vocab: [w.spopolamento, w.abbandonare, w.comunque-vada]
    spicy:
      - { es: "Benché tu dica di non essere romantico, mi hai portata a vedere i Sassi illuminati.", en: "Although you say you're not romantic, you took me to see the Sassi lit up.", altEs: ["Sebbene tu dica di non essere romantico, mi hai portata a vedere i Sassi illuminati."], grammar: [g.concessive-clauses], vocab: [w.sassi, w.illuminare] }
      - { es: "Chiunque ti abbia spezzato il cuore prima di me, grazie: adesso è libero.", en: "Whoever broke your heart before me, thank you: now it's free.", altEs: ["Chiunque ti abbia spezzato il cuore prima di me: grazie, adesso è libero."], grammar: [g.chiunque-qualunque, g.congiuntivo-passato], vocab: [w.chiunque, w.cuore] }
      - { es: "Ti ammiro: nonostante il mio caratteraccio, mi inviti ancora a cena.", en: "I admire you: despite my awful temper, you still invite me to dinner.", altEs: ["Ti ammiro: malgrado il mio caratteraccio, mi inviti ancora a cena."], grammar: [g.concessive-clauses], vocab: [w.ammirare, w.invitare] }
      - { es: "Sei la mia ispirazione: da quando ti conosco, scrivo canzoni terribili.", en: "You're my inspiration: since I've known you, I've been writing terrible songs.", altEs: ["Sei la mia ispirazione: da quando ti conosco scrivo canzoni terribili."], grammar: [g.da-since], vocab: [w.ispirazione, w.canzone] }
dialogues:
  - id: b2.u05.d1
    title: Al porto di Marina Grande
    context: Lidia, visiting Capri from Milan, tries to buy tickets for the Blue Grotto from Salvatore, a boatman.
    lines:
      - { speaker: Lidia, es: "Buongiorno, vorrei due biglietti per la Grotta Azzurra.", en: "Good morning, I'd like two tickets for the Blue Grotto." }
      - { speaker: Salvatore, es: "Mi dispiace, signora: benché ci sia il sole, oggi la grotta è chiusa per il mare mosso.", en: "I'm sorry, madam: although it's sunny, the grotto is closed today because of the rough sea." }
      - { speaker: Lidia, es: "Che peccato! Siamo venuti apposta da Milano, nonostante il viaggio lunghissimo.", en: "What a shame! We came specially from Milan, despite the very long journey." }
      - { speaker: Salvatore, es: "Lo capisco. Qualunque cosa le dica, sarà delusa. Ma posso proporle un'alternativa.", en: "I understand. Whatever I tell you, you'll be disappointed. But I can suggest an alternative." }
      - { speaker: Lidia, es: "Quale?", en: "What?" }
      - { speaker: Salvatore, es: "Il giro dell'isola in barca: anche se non si entra nella grotta, si vedono i Faraglioni da vicino.", en: "The boat trip round the island: even though you don't go into the grotto, you see the Faraglioni close up." }
      - { speaker: Lidia, es: "È sicuro, pur con queste onde?", en: "Is it safe, even with these waves?" }
      - { speaker: Salvatore, es: "Sicurissimo. Faccio questo lavoro da quarant'anni, con qualunque tempo.", en: "Perfectly safe. I've been doing this job for forty years, in any weather." }
      - { speaker: Lidia, es: "Allora va bene. E se domani il mare fosse calmo?", en: "All right then. And if the sea were calm tomorrow?" }
      - { speaker: Salvatore, es: "In tal caso torni qui alle nove: chiunque arrivi prima entra per primo.", en: "In that case come back here at nine: whoever arrives first goes in first." }
    questions:
      - { q: "Perché la Grotta Azzurra è chiusa?", options: ["Per il mare mosso.", "Per la pioggia.", "Per uno sciopero."], answer: 0, explain: "Benché ci sia il sole, oggi la grotta è chiusa per il mare mosso." }
      - { q: "Da dove viene Lidia?", options: ["Da Napoli.", "Da Milano.", "Da Capri."], answer: 1, explain: "Siamo venuti apposta da Milano." }
      - { q: "Che cosa propone Salvatore?", options: ["Un giro dell'isola in barca.", "Una visita a Villa Jovis.", "Un biglietto gratis per domani."], answer: 0, explain: "Il giro dell'isola in barca: si vedono i Faraglioni da vicino." }
      - { q: "Che cosa deve fare Lidia per entrare nella grotta domani?", options: ["Prenotare online.", "Arrivare presto, alle nove.", "Pagare il doppio."], answer: 1, explain: "Torni qui alle nove: chiunque arrivi prima entra per primo." }
