id: r.a2.la-vida-de-mi-abuela
level: a2
title: La vida de mi abuela
kind: text
intro: Pablo describes his grandmother's life, from a village childhood to the city.
allow: [pablo, carmen, zaragoza, aragón, pilar]
paragraphs:
  - { es: "Mi abuela Carmen nació en 1950 en un pueblo pequeño de Aragón. Su familia era pobre: su padre trabajaba en el campo y su madre cuidaba de seis hijos. No había agua en las casas y los niños iban a la escuela andando, a cuatro kilómetros.", en: "My grandmother Carmen was born in 1950 in a small village in Aragon. Her family was poor: her father worked in the fields and her mother looked after six children. There was no water in the houses and the children walked to school, four kilometres away." }
  - { es: "De pequeña, Carmen era muy traviesa. Se escondía en el bosque con sus hermanos, montaba a caballo sin permiso y se peleaba con los chicos del pueblo. Pero también le gustaba mucho leer, y leía todos los libros de la pequeña biblioteca del colegio.", en: "As a child, Carmen was very naughty. She hid in the woods with her brothers, rode horses without permission and fought with the village boys. But she also loved reading, and read all the books in the school's small library." }
  - { es: "A los dieciséis años se mudó a Zaragoza para trabajar en una fábrica. Vivía con una tía y enviaba casi todo el dinero a sus padres. Allí conoció a mi abuelo, Pilar, que era mecánico. Se casaron en 1972 y tuvieron tres hijos.", en: "At sixteen she moved to Zaragoza to work in a factory. She lived with an aunt and sent almost all her money to her parents. There she met my grandfather, Pilar, who was a mechanic. They got married in 1972 and had three children." }
  - { es: "Cuando mi madre era pequeña, la abuela estudiaba por la noche. Terminó la carrera de maestra a los treinta y cinco años y trabajó en una escuela durante veinticinco años. Sus alumnos la querían mucho.", en: "When my mother was little, grandma studied at night. She finished her teaching degree at thirty-five and worked in a school for twenty-five years. Her pupils loved her very much." }
  - { es: "Hoy tiene más de setenta años y sigue leyendo un libro cada semana. Dice que la vida ha cambiado mucho, pero que lo más importante sigue siendo lo mismo: la familia, los amigos y un buen libro.", en: "Today she is over seventy and still reads a book every week. She says life has changed a lot, but that the most important things are still the same: family, friends and a good book." }
questions:
  - { q: "How did the children get to school?", options: ["By bus", "On foot, four kilometres", "By horse"], answer: 1 }
  - { q: "Why did Carmen move to Zaragoza?", options: ["To study", "To work in a factory", "To get married"], answer: 1 }
  - { q: "When did she finish her teaching degree?", options: ["At sixteen", "At thirty-five", "At seventy"], answer: 1 }
glossary:
  - { es: cuidar de, en: to look after }
  - { es: sin permiso, en: without permission }
  - { es: mecánico, en: mechanic }
  - { es: alumno, en: pupil }
