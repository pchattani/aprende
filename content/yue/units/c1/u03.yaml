id: c1.u03
title: 正式場合
lessons:
  - id: c1.u03.l1
    title: 請問先生貴姓？
    teach: [g.honorifics]
    vocab: [w.gok3-haa6, w.nei5.b, w.gwai3-gung1-si1, w.fu2-soeng6, w.ling6-zyun1, w.ling6-tong4, w.ling6-long4, w.ling6-cin1-gam1, w.gwong1-lam4, w.fun1-jing4-gwong1-lam4, w.gaa1-ban1, w.gwai3-ban1, w.gaau3-sau6, w.bok3-si6, w.neoi5-si6, w.sin1-saang1-mun4, w.gok3-wai2, w.zyun1-ging3, w.zyun1-cing1, w.cing1-fu1, w.meng2-pin2, w.gun2-zoeng2]
    tip: "Formal Cantonese raises the other person: 貴姓 'your surname', 貴公司 'your company', 府上 'your home', 令尊 'your father'. Never use these about yourself."
    sentences:
      - { es: "請問先生貴姓？", en: "May I ask your surname, sir?", altEs: ["先生，請問貴姓？", "請問貴姓？"], altEn: ["May I have your name, sir?"], grammar: [g.honorifics], vocab: [], note: "The reply is humble: 小姓陳 or simply 我姓陳." }
      - { es: "歡迎各位嘉賓光臨澳門博物館。", en: "Welcome, honoured guests, to the Macau Museum.", altEs: ["歡迎各位嘉賓嚟到澳門博物館。"], grammar: [g.honorifics], vocab: [w.gok3-wai2, w.gaa1-ban1, w.gwong1-lam4] }
      - { es: "令尊身體好嗎？", en: "How is your father's health?", altEs: ["令尊身體幾好嗎？", "你爸爸身體好嗎？"], grammar: [g.honorifics], vocab: [w.ling6-zyun1] }
      - { es: "你爸爸身體點呀？", en: "How's your dad doing?", altEs: ["你老豆身體點呀？"], grammar: [g.honorifics], vocab: [w.ling6-zyun1], transform: { instruction: "Ask politely with an honorific", answer: "令尊身體好嗎？", alt: ["請問令尊身體好嗎？"], en: "How is your father's health? (formal)" } }
      - { es: "代我問候令堂。", en: "Please give my regards to your mother.", altEs: ["請代我問候令堂。"], grammar: [g.honorifics], vocab: [w.ling6-tong4] }
      - { es: "聽講令郎今年考入咗大學，恭喜晒！", en: "I hear your son got into university this year — congratulations!", altEs: ["聽講令郎今年入咗大學，恭喜恭喜！"], grammar: [g.honorifics], vocab: [w.ling6-long4, w.gung1-hei2] }
      - { es: "令千金真係多才多藝。", en: "Your daughter is truly talented in so many ways.", altEs: ["令千金真係好多才多藝。"], grammar: [g.honorifics], vocab: [w.ling6-cin1-gam1] }
      - { es: "請問府上喺邊度？", en: "May I ask where you live?", altEs: ["請問府上喺邊區？"], grammar: [g.honorifics], vocab: [w.fu2-soeng6] }
      - { es: "你屋企喺邊度？", en: "Where's your place?", altEs: ["你住邊度？"], altEn: ["Where do you live?"], grammar: [g.honorifics], vocab: [w.fu2-soeng6], transform: { instruction: "Ask politely with an honorific", answer: "請問府上喺邊度？", alt: ["請問府上喺邊？"], en: "May I ask where you live? (formal)" } }
      - { es: "多謝貴公司嘅支持。", en: "Thank you for your company's support.", altEs: ["多謝貴公司一直嘅支持。"], grammar: [g.honorifics], vocab: [w.gwai3-gung1-si1], error: { wrong: "多謝敝公司嘅支持。", explain: "敝公司 is your own company (humble); the other side's company is 貴公司.", grammar: g.honorifics } }
      - { es: "尊敬的館長、各位貴賓，晚上好。", en: "Respected Curator, distinguished guests, good evening.", altEs: ["尊敬嘅館長、各位貴賓，晚上好。"], grammar: [g.honorifics], vocab: [w.zyun1-ging3, w.gun2-zoeng2, w.gwai3-ban1], note: "Speech openings keep the written 的 in 尊敬的." }
      - { es: "閣下嘅意見，我哋會認真考慮。", en: "We will consider your views seriously, sir.", altEs: ["閣下嘅意見我哋會認真考慮。"], grammar: [g.honorifics], vocab: [w.gok3-haa6] }
      - { es: "您好，請問有咩可以幫到您？", en: "Hello, how may I help you?", altEs: ["你好，請問有咩可以幫到你？"], grammar: [g.honorifics], vocab: [w.nei5.b], note: "您 is used in writing and by some service staff; in speech most people say 你." }
      - { es: "我應該點稱呼你？叫你何教授定何博士？", en: "How should I address you — Professor Ho or Dr Ho?", altEs: ["我點稱呼你好？何教授定何博士？"], grammar: [g.honorifics], vocab: [w.cing1-fu1, w.gaau3-sau6, w.bok3-si6] }
      - { es: "各位女士、各位先生，典禮即將開始。", en: "Ladies and gentlemen, the ceremony is about to begin.", altEs: ["各位女士、先生們，典禮即將開始。"], grammar: [g.honorifics], vocab: [w.neoi5-si6, w.sin1-saang1-mun4, w.din2-lai5] }
      - { es: "呢張係我嘅名片，請多多指教。", en: "Here's my business card; I look forward to working with you.", altEs: ["呢張係我卡片，請多多指教。"], grammar: [g.honorifics, g.humble-forms], vocab: [w.meng2-pin2, w.do1-do1-zi2-gaau3] }
    exchanges:
      - q: { es: "請問先生貴姓？", en: "May I ask your surname, sir?" }
        a: { es: "小姓陳，叫我陳生得喇。", en: "My name is Chan; just call me Mr Chan." }
        alt: ["我姓陳。", "姓陳，耳東陳。"]
        grammar: [g.honorifics, g.humble-forms]
        vocab: []
      - q: { es: "令尊近來好嗎？", en: "How has your father been lately?" }
        a: { es: "幾好，多謝關心。佢上個月退咗休。", en: "Quite well, thanks for asking. He retired last month." }
        alt: ["佢好好，多謝。", "幾好，多謝你關心。"]
        grammar: [g.honorifics]
        vocab: [w.ling6-zyun1]
      - q: { es: "我應該點稱呼你？", en: "How should I address you?" }
        a: { es: "叫我何教授就得，唔使咁客氣。", en: "Just call me Professor Ho, no need to be so formal." }
        alt: ["叫我阿何得喇。", "叫我何教授啦。"]
        grammar: [g.honorifics]
        vocab: [w.cing1-fu1, w.gaau3-sau6]
      - q: { es: "呢張係我嘅名片。", en: "Here's my business card." }
        a: { es: "多謝，呢張係我嘅，請多多指教。", en: "Thank you; here's mine. I look forward to working with you." }
        alt: ["多謝，請多多指教。", "多謝晒，我嘅喺度。"]
        grammar: [g.honorifics, g.humble-forms]
        vocab: [w.meng2-pin2, w.do1-do1-zi2-gaau3]
      - q: { es: "貴公司幾時方便開會？", en: "When would be convenient for your company to meet?" }
        a: { es: "下星期二下晝，唔知貴公司方唔方便？", en: "Next Tuesday afternoon — would that suit your company?" }
        alt: ["下星期二得唔得？", "我哋星期二方便。"]
        grammar: [g.honorifics]
        vocab: [w.gwai3-gung1-si1]
    texts:
      - title: "大炮台酒會開場白"
        es: ["尊敬的館長、各位嘉賓：", "歡迎大家光臨大炮台上嘅澳門博物館。", "今晚我哋一齊慶祝博物館開館周年。"]
        en: ["Respected Curator, honoured guests:", "Welcome to the Macau Museum on Monte Fort.", "Tonight we celebrate the museum's anniversary together."]
        grammar: [g.honorifics]
        vocab: [w.zyun1-ging3, w.gun2-zoeng2, w.gaa1-ban1, w.gwong1-lam4]
      - title: "餐廳門口"
        es: ["歡迎光臨！", "請問幾多位？", "請跟我入嚟，呢邊有窗口位。"]
        en: ["Welcome!", "How many of you?", "Please follow me in; there's a window table this way."]
        grammar: [g.honorifics]
        vocab: [w.fun1-jing4-gwong1-lam4]
    spicy:
      - { es: "請問小姐貴姓？我想記住你成世。", en: "May I ask your surname, miss? I'd like to remember it for the rest of my life.", altEs: ["請問小姐貴姓？我想記你一世。"], grammar: [g.honorifics], vocab: [] }
      - { es: "令千金咁靚，唔知令尊准唔准佢同我飲杯咖啡？", en: "Your daughter is so lovely — would her father allow her to have a coffee with me?", altEs: ["令千金咁靚，唔知令尊肯唔肯畀佢同我飲杯咖啡？"], grammar: [g.honorifics], vocab: [w.ling6-cin1-gam1, w.ling6-zyun1] }
      - { es: "閣下今晚咁靚仔，係咪專登嚟搶主角？", en: "You look so handsome tonight, sir — did you come specially to steal the show?", altEs: ["閣下今晚咁靚仔，係咪專登搶晒風頭？"], grammar: [g.honorifics], vocab: [w.gok3-haa6] }
      - { es: "我想光臨府上，不過要你親自請我先得。", en: "I'd love to grace your home, but only if you invite me yourself.", altEs: ["我好想光臨府上，不過要你親自請我。"], grammar: [g.honorifics], vocab: [w.gwong1-lam4, w.fu2-soeng6], jp: "ngo5 soeng2 gwong1 lam4 fu2 soeng6 bat1 gwo3 jiu3 nei5 can1 zi6 ceng2 ngo5 sin1 dak1" }
  - id: c1.u03.l2
    title: 敬請準時出席
    teach: [g.formal-requests]
    vocab: [w.han2-cing2, w.ging3-cing2, w.faan4-cing2, w.mou6-bit1, w.mung4, w.sing4-mung4, w.bat1-sing1, w.pou5-hip3, w.daa2-jiu2, w.wai6-gu3, w.wui4-fuk1, w.ceng2-tip2, w.ceot1-zik6, w.gam2-ze6, w.cung1-sam1, w.ze6-ze6, w.bat1-haak3-hei3, w.taan2-baak6]
    tip: "Spoken requests climb from 唔該 to 麻煩你 to 可唔可以請你… and 唔知可唔可以…; written ones use 煩請, 敬請 and 懇請. Apologies go from 唔好意思 to 對唔住 to 抱歉."
    sentences:
      - { es: "麻煩你等一陣。", en: "Would you mind waiting a moment?", altEs: ["麻煩你等等。", "唔該你等一陣。"], altEn: ["Sorry to trouble you, could you wait a moment?"], grammar: [g.formal-requests], vocab: [] }
      - { es: "麻煩你幫我轉告陳經理。", en: "Could you please pass this on to Manager Chan?", altEs: ["唔該你幫我轉告陳經理。", "麻煩你同陳經理講聲。"], grammar: [g.formal-requests], vocab: [] }
      - { es: "唔知可唔可以改期呢？", en: "I wonder if it might be possible to reschedule?", altEs: ["唔知可唔可以改過第日呢？"], grammar: [g.formal-requests], vocab: [] }
      - { es: "改期得唔得？", en: "Can we reschedule?", altEs: ["可唔可以改期？"], grammar: [g.formal-requests], vocab: [], transform: { instruction: "Make it more polite with 唔知…呢", answer: "唔知可唔可以改期呢？", alt: ["唔知可唔可以改期？", "唔知改期得唔得呢？"], en: "I wonder if we might reschedule? (polite)" } }
      - { es: "敬請準時出席。", en: "Kindly attend punctually.", altEs: ["請準時出席。"], grammar: [g.formal-requests], vocab: [w.ging3-cing2, w.ceot1-zik6] }
      - { es: "工程期間如有不便之處，敬請原諒。", en: "We apologise for any inconvenience during the works.", altEs: ["工程期間如有不便，敬請原諒。"], grammar: [g.formal-requests], vocab: [w.ging3-cing2] }
      - { es: "煩請各位於星期五前回覆。", en: "Would everyone kindly reply by Friday.", altEs: ["煩請各位在星期五前回覆。"], grammar: [g.formal-requests], vocab: [w.faan4-cing2, w.wui4-fuk1] }
      - { es: "懇請各界繼續支持博物館嘅保育工作。", en: "We earnestly ask everyone to continue supporting the museum's conservation work.", altEs: ["懇請社會各界繼續支持博物館嘅保育工作。"], grammar: [g.formal-requests], vocab: [w.han2-cing2] }
      - { es: "如蒙賜覆，不勝感激。", en: "We would be most grateful for your reply.", altEs: ["如蒙回覆，不勝感激。"], grammar: [g.formal-requests], vocab: [w.mung4, w.bat1-sing1], note: "A fixed letter-closing formula: 如蒙 + V，不勝感激." }
      - { es: "承蒙各位支持，展覽非常成功。", en: "Thanks to everyone's support, the exhibition was a great success.", altEs: ["承蒙大家支持，展覽好成功。"], grammar: [g.formal-requests], vocab: [w.sing4-mung4] }
      - { es: "對唔住，係我嘅錯。", en: "I'm sorry, it's my fault.", altEs: ["對唔住，係我錯。"], grammar: [g.formal-requests], vocab: [], transform: { instruction: "Apologise formally with 抱歉", answer: "非常抱歉，係我嘅錯。", alt: ["真係好抱歉，係我嘅錯。", "抱歉，係我嘅錯。"], en: "I'm terribly sorry, it's my fault. (formal)" } }
      - { es: "唔好意思，打擾一下，請問洗手間喺邊？", en: "Excuse me, sorry to bother you — where's the toilet?", altEs: ["唔好意思，打擾吓，請問洗手間喺邊度？"], grammar: [g.formal-requests], vocab: [w.daa2-jiu2], error: { wrong: "對唔住，打擾一下，請問洗手間喺邊？", explain: "對唔住 admits a real fault; to interrupt someone politely, 唔好意思 is enough.", grammar: g.formal-requests } }
      - { es: "我哋對今次嘅延誤深表抱歉。", en: "We deeply apologise for this delay.", altEs: ["我哋對今次延誤深感抱歉。"], grammar: [g.formal-requests], vocab: [w.pou5-hip3] }
      - { es: "衷心感謝各位今晚出席。", en: "Heartfelt thanks to all of you for attending tonight.", altEs: ["衷心多謝各位今晚出席。"], grammar: [g.formal-requests], vocab: [w.cung1-sam1, w.gam2-ze6, w.ceot1-zik6] }
      - { es: "多謝惠顧，歡迎再來。", en: "Thank you for your custom; please come again.", altEs: ["多謝惠顧，歡迎下次再嚟。"], grammar: [g.formal-requests], vocab: [w.wai6-gu3] }
      - { es: "佢收到請帖之後，務必要喺月底前回覆。", en: "Once he receives the invitation, he must reply before the end of the month.", altEs: ["收到請帖之後，務必喺月底前回覆。"], grammar: [g.formal-requests], vocab: [w.ceng2-tip2, w.mou6-bit1, w.wui4-fuk1] }
    exchanges:
      - q: { es: "唔該，可唔可以請你講慢少少？", en: "Excuse me, could I ask you to speak a little more slowly?" }
        a: { es: "冇問題，唔好意思，我講得太快。", en: "No problem — sorry, I was talking too fast." }
        alt: ["好，冇問題。", "唔好意思，我講慢啲。"]
        grammar: [g.formal-requests]
        vocab: []
      - q: { es: "唔好意思，打擾你一陣，得唔得？", en: "Sorry, could I bother you for a moment?" }
        a: { es: "唔緊要，有咩事呀？", en: "That's fine, what is it?" }
        alt: ["得，請講。", "冇問題，咩事？"]
        grammar: [g.formal-requests]
        vocab: [w.daa2-jiu2]
      - q: { es: "請帖寫「敬請回覆」，即係點？", en: "The invitation says 敬請回覆 — what does that mean?" }
        a: { es: "即係請你話畀主人家知你去唔去。", en: "It means please let the hosts know whether you're coming." }
        alt: ["即係要覆佢哋。", "即係請你回覆。"]
        grammar: [g.formal-requests]
        vocab: [w.ceng2-tip2, w.ging3-cing2, w.wui4-fuk1]
      - q: { es: "謝謝你今晚嚟。", en: "Thank you for coming tonight." }
        a: { es: "不客氣，係我嘅榮幸。", en: "You're welcome; it's my honour." }
        alt: ["唔使客氣。", "唔使多謝，應該嘅。"]
        grammar: [g.formal-requests]
        vocab: [w.ze6-ze6, w.bat1-haak3-hei3, w.wing4-hang6]
      - q: { es: "你坦白講，我篇講稿點呀？", en: "Be frank: how's my speech?" }
        a: { es: "坦白講，太長喇，可以刪走一半。", en: "Frankly, it's too long; you could cut half." }
        alt: ["幾好，不過長咗啲。", "坦白講，有啲悶。"]
        grammar: [g.formal-requests]
        vocab: [w.taan2-baak6]
    texts:
      - title: "請帖"
        es: ["謹定於十二月八日晚上七時，假大炮台舉行周年酒會。", "敬請準時出席。", "煩請於十一月三十日前回覆。"]
        en: ["Our anniversary reception will be held at Monte Fort at 7 pm on 8 December.", "Kindly attend punctually.", "Please reply by 30 November."]
        grammar: [g.formal-requests]
        vocab: [w.ging3-cing2, w.ceot1-zik6, w.faan4-cing2, w.wui4-fuk1]
      - title: "博物館告示"
        es: ["博物館正在進行維修工程。", "期間部分展館暫停開放。", "如有不便之處，敬請原諒。"]
        en: ["The museum is undergoing maintenance works.", "During this time some galleries are closed.", "We apologise for any inconvenience."]
        grammar: [g.formal-requests]
        vocab: [w.ging3-cing2]
    spicy:
      - { es: "唔知可唔可以請你今晚同我食飯呢？", en: "I wonder if I might take you to dinner tonight?", altEs: ["唔知可唔可以約你今晚食飯呢？"], grammar: [g.formal-requests], vocab: [], jp: "m4 zi1 ho2 m4 ho2 ji5 ceng2 nei5 gam1 maan5 tung4 ngo5 sik6 faan6 ne1" }
      - { es: "敬請閣下今晚準時出席我嘅心房。", en: "You are kindly requested to attend my heart punctually tonight.", altEs: ["敬請閣下今晚準時嚟我心入面。"], grammar: [g.formal-requests], vocab: [w.ging3-cing2, w.ceot1-zik6], jp: "ging3 cing2 gok3 haa6 gam1 maan5 zeon2 si4 ceot1 zik6 ngo5 ge3 sam1 fong4" }
      - { es: "如蒙你畀電話號碼，小弟不勝感激。", en: "Should you grant me your phone number, this humble one would be most grateful.", altEs: ["如蒙你留低電話號碼，小弟不勝感激。"], grammar: [g.formal-requests, g.humble-forms], vocab: [w.mung4, w.bat1-sing1, w.siu2-dai6] }
      - { es: "打擾晒，我淨係想話你知：你今晚好靚。", en: "Sorry to bother you, I just wanted to tell you: you look lovely tonight.", altEs: ["打擾吓，我只係想講：你今晚好靚。"], grammar: [g.formal-requests], vocab: [w.daa2-jiu2] }
      - { es: "坦白講，我嚟呢個酒會，唔係為咗啲紅酒。", en: "Frankly, I didn't come to this reception for the red wine.", altEs: ["坦白講，我嚟酒會唔係為咗飲紅酒。"], grammar: [g.formal-requests], vocab: [w.taan2-baak6, w.zau2-wui2] }
  - id: c1.u03.l3
    title: 小弟獻醜喇
    teach: [g.humble-forms]
    vocab: [w.bai6-gung1-si1, w.bai6, w.siu2-dai6, w.bun2-jan4, w.zyut3-gin3, w.gou1-gin3, w.hin3-cau2, w.bat1-gam2-dong1, w.do1-do1-zi2-gaau3, w.zi2-gaau3, w.him1-cing1, w.hon4-se3, w.haak3-tou3, w.ceng2-haak3, w.sat1-pui4, w.dak1-tai2, w.lai5-ji4]
    tip: "Chinese politeness lowers yourself as it raises the other person: 敝公司 vs 貴公司, 拙見 vs 高見, 寒舍 vs 府上. Answer praise modestly: 過獎過獎, 邊度呀, 不敢當."
    sentences:
      - { es: "敝公司會盡快回覆。", en: "Our company will reply as soon as possible.", altEs: ["敝公司會盡快答覆。"], grammar: [g.humble-forms], vocab: [w.bai6-gung1-si1, w.wui4-fuk1] }
      - { es: "多謝貴公司對敝公司嘅支持。", en: "Thank you for your company's support of ours.", altEs: ["多謝貴公司一直對敝公司嘅支持。"], grammar: [g.humble-forms, g.honorifics], vocab: [w.gwai3-gung1-si1, w.bai6-gung1-si1] }
      - { es: "依小弟拙見，呢個方案仲有改善空間。", en: "In my humble opinion, this plan still has room for improvement.", altEs: ["依我拙見，呢個方案仲有改善空間。"], grammar: [g.humble-forms], vocab: [w.siu2-dai6, w.zyut3-gin3] }
      - { es: "我覺得呢個方案唔係幾好。", en: "I don't think this plan is very good.", altEs: ["我覺得呢個方案麻麻哋。"], grammar: [g.humble-forms], vocab: [w.zyut3-gin3], transform: { instruction: "Soften it for a formal meeting with 依我拙見", answer: "依我拙見，呢個方案仲有改善空間。", alt: ["依小弟拙見，呢個方案仲有改善空間。", "依我拙見，呢個方案仲可以改善。"], en: "In my humble opinion, this plan has room for improvement. (formal)" } }
      - { es: "唔知何教授有咩高見？", en: "May I ask your view, Professor Ho?", altEs: ["何教授有咩高見呢？"], grammar: [g.humble-forms, g.honorifics], vocab: [w.gou1-gin3], transform: { instruction: "Ask casually, without the honorific", answer: "何教授，你點睇？", alt: ["何教授，你覺得點？", "你點睇呀，何教授？"], en: "Professor Ho, what do you think? (casual)" } }
      - { es: "過獎過獎，我只係盡力而為。", en: "You flatter me; I just did my best.", altEs: ["過獎喇，我只係盡力而為。"], grammar: [g.humble-forms], vocab: [] }
      - { es: "我唱得唔好，獻醜喇。", en: "I don't sing well, but here goes.", altEs: ["我唱得麻麻哋，獻醜喇。"], grammar: [g.humble-forms], vocab: [w.hin3-cau2] }
      - { es: "歡迎嚟寒舍坐吓。", en: "You're welcome to drop by my humble home.", altEs: ["得閒嚟寒舍坐吓。"], grammar: [g.humble-forms], vocab: [w.hon4-se3], error: { wrong: "歡迎嚟府上坐吓。", explain: "府上 is the other person's home; your own is 寒舍 (or just 我屋企).", grammar: g.humble-forms } }
      - { es: "你叫我大師？真係不敢當。", en: "You call me a master? I really don't deserve that.", altEs: ["叫我大師？真係不敢當。"], grammar: [g.humble-forms], vocab: [w.bat1-gam2-dong1] }
      - { es: "我啱啱入公司，請各位前輩多多指教。", en: "I've just joined the company; I look forward to learning from all my seniors.", altEs: ["我啱啱入職，請各位前輩多多指教。"], grammar: [g.humble-forms], vocab: [w.do1-do1-zi2-gaau3, w.zi2-gaau3] }
      - { es: "本人謹代表敝公司，感謝各位光臨。", en: "On behalf of our company, I thank you all for coming.", altEs: ["本人代表敝公司，感謝各位光臨。"], grammar: [g.humble-forms], vocab: [w.bun2-jan4, w.bai6] }
      - { es: "小弟今日請客，大家唔使客氣。", en: "This humble one is treating today — don't stand on ceremony.", altEs: ["今日小弟請客，大家唔使客氣。"], grammar: [g.humble-forms], vocab: [w.siu2-dai6, w.ceng2-haak3], note: "小弟 is also used jokingly among friends." }
      - { es: "朋友之間講得太客套，反而顯得疏遠。", en: "Being too formal between friends actually makes you sound distant.", altEs: ["朋友之間太客套，反而好疏遠。"], grammar: [g.humble-forms], vocab: [w.haak3-tou3] }
      - { es: "「敝公司」係謙稱，「貴公司」係尊稱。", en: "敝公司 is a humble form; 貴公司 is an honorific.", altEs: ["「敝公司」屬於謙稱，「貴公司」屬於尊稱。"], grammar: [g.humble-forms, g.honorifics], vocab: [w.him1-cing1, w.zyun1-cing1] }
      - { es: "唔好意思，我有啲事，失陪一陣。", en: "Excuse me, something's come up; I'll leave you for a moment.", altEs: ["不好意思，我失陪一陣。"], grammar: [g.humble-forms], vocab: [w.sat1-pui4] }
      - { es: "喺正式場合講嘢得體，係基本禮儀。", en: "Speaking appropriately on formal occasions is basic etiquette.", altEs: ["正式場合講嘢要得體，呢個係基本禮儀。"], grammar: [g.humble-forms], vocab: [w.dak1-tai2, w.lai5-ji4] }
    exchanges:
      - q: { es: "你啲廣東話講得好好呀！", en: "Your Cantonese is really good!" }
        a: { es: "邊度呀，過獎過獎，仲要多啲學習。", en: "Not at all, you flatter me; I still have a lot to learn." }
        alt: ["過獎喇。", "麻麻哋啦。"]
        grammar: [g.humble-forms]
        vocab: [w.hok6-zaap6]
      - q: { es: "唔知你有咩高見？", en: "What's your view?" }
        a: { es: "高見就唔敢講，小弟有少少拙見。", en: "I wouldn't call it a view, but I have a small humble opinion." }
        alt: ["我有少少拙見。", "我嘅拙見係……"]
        grammar: [g.humble-forms]
        vocab: [w.gou1-gin3, w.zyut3-gin3, w.siu2-dai6]
      - q: { es: "唱一首歌啦！", en: "Sing us a song!" }
        a: { es: "好啦，我唱得唔好，獻醜喇。", en: "All right — I'm not a good singer, but here goes." }
        alt: ["獻醜喇。", "唔好啦，我唱得好差。"]
        grammar: [g.humble-forms]
        vocab: [w.hin3-cau2]
      - q: { es: "你屋企好靚呀！", en: "Your home is gorgeous!" }
        a: { es: "寒舍簡陋，多謝你賞面嚟坐。", en: "It's a modest home; thank you for honouring us with a visit." }
        alt: ["邊度呀，好細咋。", "多謝你嚟。"]
        grammar: [g.humble-forms]
        vocab: [w.hon4-se3]
      - q: { es: "陳生，你係專家，大家都想聽你講。", en: "Mr Chan, you're the expert — everyone wants to hear you." }
        a: { es: "不敢當，我只係分享吓經驗。", en: "I don't deserve that; I'm just sharing some experience." }
        alt: ["不敢當。", "專家就唔敢當。"]
        grammar: [g.humble-forms]
        vocab: [w.bat1-gam2-dong1]
    texts:
      - title: "回覆電郵"
        es: ["陳經理：", "多謝貴公司嘅查詢。", "敝公司會於三日內提供報價，如有任何問題，歡迎隨時聯絡本人。"]
        en: ["Dear Manager Chan,", "Thank you for your company's enquiry.", "Our company will provide a quotation within three days; please feel free to contact me with any questions."]
        grammar: [g.humble-forms, g.honorifics]
        vocab: [w.gwai3-gung1-si1, w.bai6-gung1-si1, w.bun2-jan4]
      - title: "新同事自我介紹"
        es: ["大家好，我叫李家明，今日第一日返工。", "我經驗唔多，請各位多多指教。", "今晚小弟請大家飲嘢！"]
        en: ["Hello everyone, I'm Lee Ka-ming, and it's my first day at work.", "I don't have much experience, so I look forward to learning from you all.", "Tonight drinks are on me!"]
        grammar: [g.humble-forms]
        vocab: [w.do1-do1-zi2-gaau3, w.siu2-dai6]
    spicy:
      - { es: "小弟唔才，想請你今晚食餐飯。", en: "This humble one, untalented as he is, would like to take you to dinner tonight.", altEs: ["小弟想請你今晚食餐飯。"], grammar: [g.humble-forms], vocab: [w.siu2-dai6], jp: "siu2 dai6 m4 coi4 soeng2 ceng2 nei5 gam1 maan5 sik6 caan1 faan6" }
      - { es: "寒舍雖然細，但係景觀好，咖啡仲好飲。", en: "My humble home is small, but the view is good and the coffee's even better.", altEs: ["寒舍細細，不過景觀好，咖啡又好飲。"], grammar: [g.humble-forms], vocab: [w.hon4-se3] }
      - { es: "你話我靚仔？過獎過獎，不過你講多次都得。", en: "You say I'm handsome? You flatter me — but feel free to say it again.", altEs: ["你話我靚仔？過獎喇，不過可以再講多次。"], grammar: [g.humble-forms], vocab: [] }
      - { es: "我跳舞跳得唔好，今晚獻醜，你要拖住我。", en: "I'm a bad dancer; I'll embarrass myself tonight, so you'll have to hold my hand.", altEs: ["我唔識跳舞，今晚獻醜，你要拖實我。"], grammar: [g.humble-forms], vocab: [w.hin3-cau2] }
      - { es: "依小弟拙見，你今晚應該坐我隔籬。", en: "In this humble one's opinion, you should sit next to me tonight.", altEs: ["依我拙見，你今晚應該坐喺我隔籬。"], grammar: [g.humble-forms], vocab: [w.siu2-dai6, w.zyut3-gin3] }
  - id: c1.u03.l4
    title: 典禮、酒會同喜酒
    teach: [g.honorifics, g.humble-forms]
    vocab: [w.zi3-ci4, w.zyu2-ci4, w.si1-ji4, w.din2-lai5, w.bai3-mok6, w.jin3-wui6, w.zau2-wui2, w.maan5-jin3, w.ging3-zau2, w.wing4-hang6, w.zyu2-baan6, w.lung4-zung6, w.haau6-jau5, w.gung1-hei2, w.zuk1-ho6, w.wai3-man6, w.zit3-oi1-seon6-bin3, w.baak6-si6, w.hung4-si6, w.hei2-zau2]
    tip: "Ceremonies follow a script: the 司儀 opens, guests of honour 致辭, everyone 敬酒. Congratulate with 恭喜 / 祝賀; at a funeral say 節哀順變."
    sentences:
      - { es: "今晚嘅晚宴由澳門博物館主辦。", en: "Tonight's banquet is hosted by the Macau Museum.", altEs: ["今晚晚宴係由澳門博物館主辦。"], grammar: [g.honorifics], vocab: [w.maan5-jin3, w.zyu2-baan6] }
      - { es: "首先，請館長為我哋致辭。", en: "First, I invite the Curator to say a few words.", altEs: ["首先，有請館長致辭。"], grammar: [g.honorifics], vocab: [w.gun2-zoeng2, w.zi3-ci4] }
      - { es: "今晚嘅典禮由我同李小姐主持。", en: "Tonight's ceremony is hosted by Miss Lee and me.", altEs: ["今晚典禮由我同李小姐一齊主持。"], grammar: [g.honorifics], vocab: [w.din2-lai5, w.zyu2-ci4] }
      - { es: "司儀請大家起身，向主禮嘉賓敬酒。", en: "The MC asked everyone to stand and toast the guests of honour.", altEs: ["司儀請大家企起身，向主禮嘉賓敬酒。"], grammar: [g.honorifics], vocab: [w.si1-ji4, w.ging3-zau2, w.gaa1-ban1] }
      - { es: "我好榮幸今日可以喺度致辭。", en: "I'm very honoured to be able to speak here today.", altEs: ["今日可以喺度致辭，我好榮幸。"], grammar: [g.humble-forms], vocab: [w.wing4-hang6, w.zi3-ci4] }
      - { es: "多謝你今日嚟。", en: "Thanks for coming today.", altEs: ["多謝你今日嚟呀。"], grammar: [g.honorifics], vocab: [w.gwong1-lam4], transform: { instruction: "Say it in a formal speech with 各位 and 光臨", answer: "多謝各位今日光臨。", alt: ["衷心感謝各位今日光臨。", "感謝各位今日光臨。"], en: "Thank you all for honouring us with your presence today. (formal)" } }
      - { es: "開幕典禮好隆重，嚟咗好多貴賓。", en: "The opening ceremony was very grand; lots of VIPs came.", altEs: ["開幕典禮好隆重，有好多貴賓嚟咗。"], grammar: [g.honorifics], vocab: [w.din2-lai5, w.lung4-zung6, w.gwai3-ban1] }
      - { es: "展覽今日正式閉幕。", en: "The exhibition officially closes today.", altEs: ["展覽今日正式結束。"], grammar: [g.honorifics], vocab: [w.bai3-mok6] }
      - { es: "酒會之後，仲有一個宴會。", en: "After the reception there's also a banquet.", altEs: ["酒會完咗之後仲有宴會。"], grammar: [g.honorifics], vocab: [w.zau2-wui2, w.jin3-wui6] }
      - { es: "恭喜晒！祝你哋白頭到老。", en: "Congratulations! Wishing you a long life together.", altEs: ["恭喜恭喜！祝你哋白頭到老。"], grammar: [g.honorifics], vocab: [w.gung1-hei2], transform: { instruction: "Congratulate formally with 祝賀", answer: "祝賀你哋新婚之喜，白頭到老。", alt: ["衷心祝賀你哋新婚，白頭到老。"], en: "Congratulations on your marriage; may you grow old together. (formal)" } }
      - { es: "謹代表全體校友，祝賀母校成立一百周年。", en: "On behalf of all alumni, I congratulate our alma mater on its centenary.", altEs: ["我代表全體校友，祝賀母校一百周年。"], grammar: [g.humble-forms], vocab: [w.haau6-jau5, w.zuk1-ho6] }
      - { es: "下個月我表哥擺喜酒，係紅事，要著得喜慶啲。", en: "My cousin's wedding banquet is next month — a happy occasion, so dress festively.", altEs: ["下個月我表哥擺喜酒，係紅事，著得喜慶啲。"], grammar: [g.honorifics], vocab: [w.hei2-zau2, w.hung4-si6] }
      - { es: "去白事唔好著紅色衫。", en: "Don't wear red to a funeral.", altEs: ["去白事千祈唔好著紅衫。"], grammar: [g.honorifics], vocab: [w.baak6-si6], error: { wrong: "去紅事唔好著紅色衫。", explain: "紅事 is a happy occasion such as a wedding, where red is welcome; a funeral is 白事.", grammar: g.honorifics } }
      - { es: "陳太，節哀順變。", en: "Mrs Chan, my condolences.", altEs: ["陳太，請節哀順變。"], grammar: [g.honorifics], vocab: [w.zit3-oi1-seon6-bin3] }
      - { es: "經理去醫院慰問受傷嘅同事。", en: "The manager went to the hospital to visit the injured colleague.", altEs: ["經理去醫院探望受傷嘅同事。"], grammar: [g.honorifics], vocab: [w.wai3-man6] }
      - { es: "我哋一齊舉杯，敬各位嘉賓！", en: "Let's all raise our glasses to our honoured guests!", altEs: ["大家一齊舉杯，敬各位嘉賓！"], grammar: [g.honorifics], vocab: [w.gok3-wai2, w.gaa1-ban1] }
    exchanges:
      - q: { es: "邊個做今晚嘅司儀？", en: "Who's the MC tonight?" }
        a: { es: "李小姐，佢主持過好多典禮。", en: "Miss Lee — she's hosted lots of ceremonies." }
        alt: ["李小姐。", "係李小姐主持。"]
        grammar: [g.honorifics]
        vocab: [w.si1-ji4, w.zyu2-ci4, w.din2-lai5]
      - q: { es: "我下個月結婚，你嚟飲喜酒啦！", en: "I'm getting married next month — come to the banquet!" }
        a: { es: "恭喜晒！我一定嚟。", en: "Congratulations! I'll definitely be there." }
        alt: ["恭喜恭喜！", "一定嚟，恭喜你！"]
        grammar: [g.honorifics]
        vocab: [w.hei2-zau2, w.gung1-hei2]
      - q: { es: "我爸爸上個禮拜過咗身。", en: "My father passed away last week." }
        a: { es: "我好難過，請你節哀順變。", en: "I'm so sorry; my condolences." }
        alt: ["節哀順變。", "唔好太傷心，節哀順變。"]
        grammar: [g.honorifics]
        vocab: [w.zit3-oi1-seon6-bin3]
      - q: { es: "你要致辭，緊唔緊張？", en: "You have to give a speech — are you nervous?" }
        a: { es: "少少，不過好榮幸有呢個機會。", en: "A little, but I'm honoured to have this chance." }
        alt: ["好緊張呀！", "少少緊張。"]
        grammar: [g.humble-forms]
        vocab: [w.zi3-ci4, w.wing4-hang6]
      - q: { es: "晚宴幾點開始？", en: "What time does the banquet start?" }
        a: { es: "七點酒會，八點入席。", en: "Reception at seven, seated at eight." }
        alt: ["八點入席。", "七點先有酒會。"]
        grammar: [g.honorifics]
        vocab: [w.maan5-jin3, w.zau2-wui2]
    texts:
      - title: "司儀講稿"
        es: ["各位嘉賓，晚上好！", "歡迎大家出席今晚隆重嘅晚宴。", "首先，有請館長上台致辭。"]
        en: ["Good evening, honoured guests!", "Welcome to tonight's grand banquet.", "First, please welcome the Curator to the stage to give a speech."]
        grammar: [g.honorifics]
        vocab: [w.gaa1-ban1, w.lung4-zung6, w.maan5-jin3, w.zi3-ci4]
      - title: "賀卡"
        es: ["祝賀你哋新婚之喜！", "祝你哋永結同心，白頭到老。"]
        en: ["Congratulations on your wedding!", "Wishing you a lifetime of love and togetherness."]
        grammar: [g.honorifics]
        vocab: [w.zuk1-ho6]
    spicy:
      - { es: "我想同你敬一杯，敬我哋今晚咁啱坐埋一枱。", en: "Let me toast with you — to us happening to sit at the same table tonight.", altEs: ["我敬你一杯，敬我哋今晚咁啱同枱。"], grammar: [g.honorifics], vocab: [w.ging3-zau2] }
      - { es: "司儀講咗成晚，我只係聽到你笑。", en: "The MC talked all night, but all I heard was your laugh.", altEs: ["司儀講咗成晚嘢，我淨係聽到你笑。"], grammar: [g.honorifics], vocab: [w.si1-ji4], jp: "si1 ji4 gong2 zo2 seng4 maan5 ngo5 zi2 hai6 teng1 dou2 nei5 siu3" }
      - { es: "今晚嘅宴會好隆重，不過我最想同你走去露台。", en: "Tonight's banquet is very grand, but what I really want is to slip out to the balcony with you.", altEs: ["宴會好隆重，不過我最想同你出露台。"], grammar: [g.honorifics], vocab: [w.jin3-wui6, w.lung4-zung6] }
      - { es: "能夠同你跳第一隻舞，係我今晚最大嘅榮幸。", en: "Dancing the first dance with you is my greatest honour tonight.", altEs: ["可以同你跳第一隻舞，係我今晚最大嘅榮幸。"], grammar: [g.humble-forms], vocab: [w.wing4-hang6] }
dialogues:
  - id: c1.u03.d1
    title: 大炮台嘅酒會
    context: At a reception at the Macau Museum on Monte Fort, Manager Chan meets Professor Ho for the first time.
    lines:
      - { speaker: 陳經理, es: "你好，請問先生貴姓？", en: "Hello, may I ask your surname, sir?" }
      - { speaker: 何教授, es: "小姓何，喺大學教歷史。呢張係我嘅名片。", en: "My name is Ho; I teach history at the university. Here's my card." }
      - { speaker: 陳經理, es: "原來係何教授，久仰久仰。呢張係我嘅，請多多指教。", en: "So you're Professor Ho — I've long heard of you. Here's mine; I look forward to working with you." }
      - { speaker: 何教授, es: "不敢當。陳經理，貴公司今次贊助展覽，真係多謝晒。", en: "I don't deserve that. Manager Chan, thank you so much for your company sponsoring the exhibition." }
      - { speaker: 陳經理, es: "邊度呀，敝公司只係盡少少力。唔知教授對展覽有咩高見？", en: "Not at all, our company only did a little. What's your view of the exhibition, Professor?" }
      - { speaker: 何教授, es: "依我拙見，大炮台嘅歷史可以介紹多啲，例如一六二二年擊退荷蘭人嗰段。", en: "In my humble opinion, the history of Monte Fort could be covered more, for example the episode in 1622 when the Dutch were driven back." }
      - { speaker: 陳經理, es: "好提議！唔知可唔可以請教授幫我哋寫一段介紹呢？", en: "Good suggestion! I wonder if we could ask you to write a section for us?" }
      - { speaker: 何教授, es: "我樂意幫忙，不過寫得唔好，到時唔好見笑。", en: "I'm happy to help, but if it's not well written, please don't laugh." }
