id: r.a2.domingo-no-ibirapuera
level: a2
title: Domingo no Ibirapuera
kind: dialogue
intro: Two friends, Paula and Mariana, meet in Ibirapuera Park on a Sunday morning. Listen to how a gente replaces nós in everyday Brazilian speech.
allow: [paula, mariana, ibirapuera, oca, niemeyer, ok, tá]
paragraphs:
  - { es: "É domingo de manhã e o Parque Ibirapuera está cheio. Tem gente correndo, andando de bicicleta e fazendo piquenique na grama. A Mariana espera a amiga Paula perto do lago.", en: "It's Sunday morning and Ibirapuera Park is full. There are people running, cycling and having picnics on the grass. Mariana is waiting for her friend Paula near the lake." }
  - { es: "— Mari! Desculpa o atraso. O metrô estava lotado — diz a Paula.", en: "'Mari! Sorry I'm late. The metro was packed,' says Paula." }
  - { es: "— Tudo bem, eu também cheguei agora. E aí, o que a gente vai fazer primeiro?", en: "'That's OK, I just got here too. So, what are we going to do first?'" }
  - { es: "— Que tal uma volta no parque? A gente pode andar até a Oca e depois tomar uma água de coco.", en: "'How about a walk around the park? We can walk to the Oca and then have a coconut water.'" }
  - { es: "— Boa ideia. O que é a Oca?", en: "'Good idea. What's the Oca?'" }
  - { es: "— É um prédio branco e redondo, do Oscar Niemeyer. Parece uma meia bola enorme no chão! Às vezes tem exposições lá dentro.", en: "'It's a round white building by Oscar Niemeyer. It looks like a giant half ball on the ground! Sometimes there are exhibitions inside.'" }
  - { es: "As duas andam pelo parque. Passam por um grupo que faz ioga na grama e por um homem que vende pipoca.", en: "The two of them walk through the park. They pass a group doing yoga on the grass and a man selling popcorn." }
  - { es: "— Sabe, Paula, eu ainda não entendo uma coisa. Na aula de português, a professora diz «nós vamos», mas aqui em São Paulo todo mundo diz «a gente vai». Qual é o certo?", en: "'You know, Paula, there's still something I don't understand. In Portuguese class, the teacher says nós vamos, but here in São Paulo everyone says a gente vai. Which is right?'" }
  - { es: "— Os dois estão certos! «Nós» é mais formal. No dia a dia, a gente usa mais «a gente». E o verbo fica como «ele»: a gente vai, a gente come, a gente está.", en: "'Both are right! Nós is more formal. In everyday life, we use a gente more. And the verb is like ele: a gente vai, a gente come, a gente está.'" }
  - { es: "— Ah, então «a gente estamos» está errado?", en: "'Ah, so a gente estamos is wrong?'" }
  - { es: "— Está errado, sim, mas você vai ouvir muito por aí! — ri a Paula.", en: "'Yes, it's wrong, but you'll hear it a lot around here!' Paula laughs." }
  - { es: "Elas chegam à Oca e tiram fotos. Depois, compram duas águas de coco e sentam embaixo de uma árvore.", en: "They reach the Oca and take photos. Then they buy two coconut waters and sit under a tree." }
  - { es: "— E à tarde? A gente pode ir ao cinema — diz a Mariana.", en: "'And this afternoon? We could go to the cinema,' says Mariana." }
  - { es: "— Hoje não dá, tenho almoço na casa da minha mãe. Mas sábado que vem a gente vai, combinado?", en: "'Not today, I've got lunch at my mother's. But next Saturday we'll go, deal?'" }
  - { es: "— Combinado! Então a gente se fala durante a semana.", en: "'Deal! So we'll talk during the week.'" }
  - { es: "— Isso. A gente se vê! Beijo!", en: "'Right. See you! Kisses!'" }
questions:
  - { q: "Por que a Paula chegou atrasada?", options: ["Porque acordou tarde", "Porque o metrô estava lotado", "Porque estava chovendo"], answer: 1, explain: "«Desculpa o atraso. O metrô estava lotado.»" }
  - { q: "O que é a Oca?", options: ["Um restaurante no parque", "Um prédio branco e redondo do Oscar Niemeyer", "Um lago"], answer: 1, explain: "«É um prédio branco e redondo, do Oscar Niemeyer.» Its dome shape looks like a giant half ball." }
  - { q: "Segundo a Paula, qual é a diferença entre «nós» e «a gente»?", options: ["«Nós» é mais formal", "«A gente» é errado", "«Nós» é só para São Paulo"], answer: 0, explain: "«Os dois estão certos! Nós é mais formal. No dia a dia, a gente usa mais a gente.»" }
  - { q: "Com «a gente», o verbo fica como...", options: ["«nós»: a gente vamos", "«ele»: a gente vai", "«eles»: a gente vão"], answer: 1, explain: "«O verbo fica como ele: a gente vai, a gente come, a gente está.»" }
  - { q: "Por que a Paula não pode ir ao cinema hoje?", options: ["Porque tem almoço na casa da mãe", "Porque está cansada", "Porque não gosta de cinema"], answer: 0, explain: "«Hoje não dá, tenho almoço na casa da minha mãe.»" }
glossary:
  - { es: que tal, en: how about }
  - { es: tal, en: such (que tal...? = how about...?) }
  - { es: verbo, en: verb }
  - { es: lotado, en: packed, full }
  - { es: redondo, en: round }
  - { es: pipoca, en: popcorn }
  - { es: formal, en: formal }
  - { es: dá, en: "it's possible (não dá = I can't, it won't work)" }
