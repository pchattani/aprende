id: c2.u02
title: 諧音同避忌
lessons:
  - id: c2.u02.l1
    title: 年年有餘
    teach: [g.homophone-puns]
    vocab: [w.haai4-jam1, w.faat3-coi3, w.faat3-coi4, w.hou4-si2, w.hou2-si5, w.saang1-coi3, w.saang1-coi4, w.gat1, w.gat1.b, w.nin4-saa1-maan5, w.nin4-je6-faan6, w.cin4-aang1, w.gam1, w.jyun4-bou2, w.jyu4-gong1, w.zuk1.d, w.soeng1-gwaan1, w.jat1-jyu5-soeng1-gwaan1, w.am3-si6, w.nam2-tau4, w.bin1-fuk1, w.fuk1.c, w.muk6-diu1, w.zyun1-diu1, w.diu1-hak1, w.faat3-daat6, w.pun4.b]
    tip: "Read a lucky word aloud and listen for its twin: 魚 jyu4 = 餘 jyu4, 桔 gat1 = 吉 gat1, 蝠 fuk1 = 福 fuk1. Near-homophones count too: 髮菜 faat3 coi3 ≈ 發財 faat3 coi4."
    sentences:
      - { es: "過年食髮菜，因為「髮菜」同「發財」差唔多同音。", en: "We eat black moss at New Year because 'faat choi' sounds almost the same as 'get rich'.", altEs: ["過年要食髮菜，因為「髮菜」同「發財」差唔多同音。", "過年食髮菜，因為「髮菜」聽落似「發財」。"], grammar: [g.homophone-puns], vocab: [w.faat3-coi3, w.faat3-coi4] }
      - { es: "年夜飯一定有魚，祝大家年年有餘。", en: "There's always fish at the New Year's Eve dinner, wishing everyone abundance year after year.", altEs: ["年夜飯實有魚，祝大家年年有餘。", "年夜飯一定要有魚，祝大家年年有餘。"], grammar: [g.homophone-puns], vocab: [w.nin4-je6-faan6, w.nin4-nin4-jau5-jyu4], error: { wrong: "年夜飯一定有魚，祝大家年年有魚。", explain: "The fish (魚) is on the table, but the wish uses its homophone 餘 'surplus': 年年有餘.", grammar: g.homophone-puns } }
      - { es: "阿爸做生意，年卅晚一定要食蠔豉，即係「好市」。", en: "Dad runs a business, so on New Year's Eve he has to eat dried oysters - they mean 'good business'.", altEs: ["阿爸做生意，年卅晚實食蠔豉，即係「好市」。"], grammar: [g.homophone-puns], vocab: [w.hou4-si2, w.hou2-si5, w.nin4-saa1-maan5] }
      - { es: "醒獅採青用生菜，因為「生菜」即係「生財」。", en: "Lion dancers 'pluck the greens' with lettuce because lettuce means 'making money'.", altEs: ["舞獅採青用生菜，因為「生菜」即係「生財」。"], grammar: [g.homophone-puns], vocab: [w.saang1-coi3, w.saang1-coi4] }
      - { es: "過年好多人屋企都擺兩盆桔，因為「桔」同「吉」同音。", en: "At New Year lots of homes have two pots of kumquats, because 'gat' (kumquat) sounds like 'gat' (lucky).", altEs: ["過年好多屋企都擺兩盆桔，因為「桔」同「吉」同音。"], grammar: [g.homophone-puns, g.common-classifiers], vocab: [w.gat1, w.gat1.b, w.pun4.b], transform: { instruction: "Turn it into a question: why do many homes put out two pots of kumquats?", answer: "點解過年好多人屋企都擺兩盆桔？", alt: ["點解過年好多屋企都擺兩盆桔？", "點解過年好多人屋企都擺兩盆桔呀？"] } }
      - { es: "陳家祠啲木雕有好多蝙蝠，因為「蝠」同「福」同音。", en: "The wood carvings at the Chen Clan Academy have lots of bats, because 'bat' sounds like 'blessing'.", altEs: ["陳家祠嘅木雕有好多蝙蝠，因為「蝠」同「福」同音。"], grammar: [g.homophone-puns], vocab: [w.muk6-diu1, w.bin1-fuk1, w.fuk1.c] }
      - { es: "導遊話，陳家祠啲磚雕同木雕好多都係玩諧音。", en: "The guide says many of the brick and wood carvings at the Chen Clan Academy play on homophones.", altEs: ["導遊話陳家祠好多磚雕同木雕都係玩諧音。"], grammar: [g.homophone-puns, g.reported-speech], vocab: [w.zyun1-diu1, w.muk6-diu1, w.haai4-jam1] }
      - { es: "每件雕刻都有個好意頭，你睇唔明就問吓導遊啦。", en: "Every carving has a lucky meaning; if you can't work it out, ask the guide.", altEs: ["每件雕刻都有好意頭，睇唔明就問吓導遊啦。"], grammar: [g.homophone-puns], vocab: [w.diu1-hak1] }
      - { es: "細路仔過年收到利是，就擺入錢罌儲起。", en: "When kids get red packets at New Year, they put them in their piggy bank.", altEs: ["細路過年收到利是，就擺入錢罌儲起佢。"], grammar: [g.homophone-puns], vocab: [w.cin4-aang1], transform: { instruction: "Ask whether your son (你個仔) does this", answer: "你個仔過年收到利是，會唔會擺入錢罌儲起？", alt: ["你個仔過年收到利是，有冇擺入錢罌儲起？"] } }
      - { es: "古時嘅元寶係用金或者銀整嘅。", en: "In ancient times ingots were made of gold or silver.", altEs: ["以前嘅元寶係用金或者銀整嘅。"], grammar: [g.hai-ge-focus], vocab: [w.jyun4-bou2, w.gam1] }
      - { es: "佢喺舖頭門口擺咗個魚缸，話係風水，可以招財。", en: "He put a fish tank by the shop door; he says it's feng shui and brings in money.", altEs: ["佢喺舖頭門口擺咗個魚缸，話對風水好，可以招財。"], altEn: ["She put a fish tank at the shop entrance - feng shui, she says, to attract wealth."], grammar: [g.homophone-puns, g.reported-speech], vocab: [w.jyu4-gong1] }
      - { es: "新年擺富貴竹，因為竹一節高過一節，好似步步高升。", en: "People put out lucky bamboo at New Year, because bamboo grows higher section by section, like rising step by step.", altEs: ["新年擺富貴竹，因為竹一節比一節高，好似步步高升。"], grammar: [g.homophone-puns, g.adj-gwo-comparison], vocab: [w.zuk1.d] }
      - { es: "間髮型屋叫「髮達」，個諗頭係「發達」嘅雙關。", en: "The hair salon is called 'Faat Daat' - the idea is a pun on 'strike it rich'.", altEs: ["間髮型屋叫「髮達」，係「發達」嘅雙關。"], grammar: [g.homophone-puns], vocab: [w.nam2-tau4, w.soeng1-gwaan1, w.faat3-daat6] }
      - { es: "呢句廣告一語雙關，「食」字有兩個意思。", en: "This advert is a double entendre: the word 'eat' has two meanings.", altEs: ["呢個廣告一語雙關，「食」字有兩個意思。"], grammar: [g.homophone-puns], vocab: [w.jat1-jyu5-soeng1-gwaan1], jp: "ni1 geoi3 gwong2 gou3 jat1 jyu5 soeng1 gwaan1 sik6 zi6 jau5 loeng5 go3 ji3 si1" }
      - { es: "佢冇明講，不過暗示咗想要封大利是。", en: "He didn't say it outright, but he hinted that he wanted a big red packet.", altEs: ["佢冇講明，不過暗示咗想要封大利是。"], altEn: ["She didn't say it directly, but she hinted she'd like a big red packet."], grammar: [g.homophone-puns], vocab: [w.am3-si6] }
    exchanges:
      - q: { es: "點解年夜飯一定要有魚？", en: "Why does the New Year's Eve dinner have to include fish?" }
        a: { es: "因為「魚」同「餘」同音，年年有餘吖嘛。", en: "Because 'fish' sounds like 'surplus' - abundance every year, you know." }
        alt: ["年年有餘吖嘛。", "「魚」即係「餘」囉。"]
        grammar: [g.homophone-puns]
        vocab: [w.nin4-je6-faan6, w.nin4-nin4-jau5-jyu4]
      - q: { es: "你屋企過年擺乜嘢呀？", en: "What do you put out at home at New Year?" }
        a: { es: "擺兩盆桔，桔即係吉，好意頭。", en: "Two pots of kumquats - kumquat means luck, a good omen." }
        alt: ["兩盆桔同一盆富貴竹。", "擺桔囉，好意頭吖嘛。"]
        grammar: [g.homophone-puns]
        vocab: [w.gat1, w.pun4.b]
      - q: { es: "呢件木雕上面係咩動物呀？", en: "What animal is on this wood carving?" }
        a: { es: "係蝙蝠，「蝠」同「福」同音。", en: "It's a bat - 'bat' sounds like 'blessing'." }
        alt: ["蝙蝠嚟㗎，即係福。", "係蝙蝠，好意頭嚟㗎。"]
        grammar: [g.homophone-puns]
        vocab: [w.bin1-fuk1, w.muk6-diu1]
      - q: { es: "點解阿爸咁鍾意食蠔豉？", en: "Why does Dad like dried oysters so much?" }
        a: { es: "佢做生意㗎嘛，蠔豉即係好市。", en: "He runs a business, you know - dried oysters mean good business." }
        alt: ["好市吖嘛。", "因為「蠔豉」聽落似「好市」。"]
        grammar: [g.homophone-puns]
        vocab: [w.hou4-si2, w.hou2-si5]
      - q: { es: "間舖個名有咩特別？", en: "What's special about the shop's name?" }
        a: { es: "佢玩緊雙關，「髮達」即係「發達」。", en: "It's a pun: 'Faat Daat' means 'strike it rich'." }
        alt: ["係雙關嚟㗎。", "一語雙關，聽落似「發達」。"]
        grammar: [g.homophone-puns]
        vocab: [w.soeng1-gwaan1, w.faat3-daat6]
    texts:
      - title: "陳家祠導賞"
        es: ["陳家祠嘅木雕同磚雕都好精細。", "雕刻上面成日見到蝙蝠同魚。", "蝠即係福，魚即係餘，全部都係好意頭嘅諧音。"]
        en: ["The wood and brick carvings at the Chen Clan Academy are exquisite.", "You often see bats and fish in the carvings.", "Bat means blessing and fish means surplus: they're all lucky homophones."]
        grammar: [g.homophone-puns]
        vocab: [w.muk6-diu1, w.zyun1-diu1, w.bin1-fuk1, w.haai4-jam1]
      - title: "年卅晚菜單"
        es: ["髮菜蠔豉：發財好市。", "生菜：生財有道。", "清蒸魚：年年有餘。"]
        en: ["Black moss with dried oysters: get rich, good business.", "Lettuce: make money the right way.", "Steamed fish: abundance year after year."]
        grammar: [g.homophone-puns]
        vocab: [w.faat3-coi3, w.hou4-si2, w.saang1-coi3]
    spicy:
      - { es: "你送我一盆桔，係咪暗示我哋嘅關係大吉？", en: "You gave me a pot of kumquats - are you hinting that we're a lucky match?", altEs: ["你送盆桔畀我，係咪暗示我哋嘅關係大吉？"], grammar: [g.homophone-puns], vocab: [w.gat1, w.am3-si6] }
      - { es: "我唔求發財，只求同你年年有餘，餘生都一齊。", en: "I don't want to get rich; I just want abundance with you every year - the rest of my life together.", altEs: ["我唔求發財，淨係想同你年年有餘，餘生都一齊。"], grammar: [g.homophone-puns], vocab: [w.faat3-coi4, w.nin4-nin4-jau5-jyu4] }
      - { es: "我個錢罌儲咗成年，就係為咗請你食餐好嘅。", en: "I've been filling my piggy bank for a whole year just to treat you to a good meal.", altEs: ["我個錢罌儲咗成年，為咗請你食一餐好嘅。"], grammar: [g.homophone-puns], vocab: [w.cin4-aang1], jp: "ngo5 go3 cin4 aang1 cyu5 zo2 seng4 nin4 zau6 hai6 wai6 zo2 ceng2 nei5 sik6 caan1 hou2 ge3" }
      - { es: "你成晚望住我，係咪暗示咩呀？", en: "You've been looking at me all night - are you hinting at something?", altEs: ["你成晚都望住我，係咪想暗示啲咩？"], grammar: [g.homophone-puns], vocab: [w.am3-si6] }
      - { es: "蝙蝠即係福，你即係我嘅福氣。", en: "A bat means a blessing, and you are my blessing.", altEs: ["蝙蝠即係福，而你就係我嘅福氣。"], grammar: [g.homophone-puns], vocab: [w.bin1-fuk1, w.fuk1.c] }
  - id: c2.u02.l2
    title: 送鐘定送終？
    teach: [g.taboo-euphemisms]
    vocab: [w.bei6-gei6, w.gei6-wai5, w.gam3-gei6, w.saan3, w.saan3.b, w.sung3-zung1, w.sung3-zung1.b, w.fan1-lei4, w.lei2, w.fan1-lei4.b, w.daai6-gat1-lei6-si6, w.pei1-pei1-pei1, w.gwo3-san1, w.gwaa1, w.maai6-haam4-aap3-daan2, w.coeng4-saang1-dim3, w.gun1-coi4, w.ban3-ji4-gun2, w.zi2-zaat3, w.siu1-ji1, w.jyu4-laan4-zit3, w.gwai2-zit3, w.wai2-jyun2, w.jyun2-zyun2, w.jan2-fui3, w.laam4]
    tip: "Unlucky gifts are unlucky because of their sound: 送鐘 = 送終, 分梨 = 分離, 傘 = 散. Death is talked around with softer words: 過身, 走咗, and in slang 瓜咗."
    sentences:
      - { es: "千祈唔好送鐘畀長輩，「送鐘」聽落好似「送終」。", en: "Never give a clock to an older relative: 'giving a clock' sounds like 'attending a deathbed'.", altEs: ["千祈唔好送鐘畀長輩，因為「送鐘」同「送終」同音。", "千萬唔好送鐘畀長輩，「送鐘」聽落似「送終」。"], grammar: [g.taboo-euphemisms, g.homophone-puns], vocab: [w.sung3-zung1, w.sung3-zung1.b] }
      - { es: "情侶之間唔好分梨食，因為「分梨」即係「分離」。", en: "Couples shouldn't share a pear, because 'sharing a pear' means 'separation'.", altEs: ["情侶唔好分梨食，因為「分梨」即係「分離」。"], grammar: [g.taboo-euphemisms, g.homophone-puns], vocab: [w.fan1-lei4, w.lei2, w.fan1-lei4.b] }
      - { es: "送遮畀朋友都唔好，因為「傘」同「散」同音。", en: "Giving a friend an umbrella isn't good either, because 'umbrella' sounds like 'break up'.", altEs: ["送遮畀朋友都唔好，「傘」同「散」同音。"], grammar: [g.taboo-euphemisms, g.homophone-puns], vocab: [w.saan3.b, w.saan3] }
      - { es: "呢啲都係老人家嘅避忌，後生一代未必理。", en: "These are older people's taboos; the younger generation doesn't necessarily care.", altEs: ["呢啲係老人家嘅避忌，後生一代未必理。"], grammar: [g.taboo-euphemisms], vocab: [w.bei6-gei6] }
      - { es: "每個地方都有自己嘅忌諱，入鄉要隨俗。", en: "Every place has its own taboos; when in Rome, do as the Romans do.", altEs: ["每個地方都有佢嘅忌諱，入鄉隨俗啦。"], grammar: [g.taboo-euphemisms], vocab: [w.gei6-wai5] }
      - { es: "喺醫院講「死」字係禁忌，大家都會講得婉轉啲。", en: "Saying the word 'die' in a hospital is taboo; everyone puts it more gently.", altEs: ["喺醫院講「死」係禁忌，大家都講得婉轉啲。"], grammar: [g.taboo-euphemisms], vocab: [w.gam3-gei6, w.jyun2-zyun2] }
      - { es: "阿婆一聽到我講「死」字，就即刻話「大吉利是」。", en: "As soon as Grandma hears me say 'die', she immediately says 'touch wood'.", altEs: ["阿婆一聽到我講「死」，就即刻講「大吉利是」。"], grammar: [g.taboo-euphemisms, g.jat-zau-as-soon-as], vocab: [w.daai6-gat1-lei6-si6] }
      - { es: "佢阿爺上個月過咗身，佢仲好唔開心。", en: "His grandfather passed away last month, and he's still very sad.", altEs: ["佢阿爺上個月過身，佢仲好唔開心。"], altEn: ["Her grandfather passed away last month and she's still very upset."], grammar: [g.taboo-euphemisms, g.zo-perfective], vocab: [w.gwo3-san1], error: { wrong: "佢阿爺上個月過身咗，佢仲好唔開心。", explain: "過身 is verb + object, so 咗 goes after the verb: 過咗身.", grammar: g.zo-perfective } }
      - { es: "「瓜咗」同「賣鹹鴨蛋」都係講死嘅俗語，唔好喺長輩面前講。", en: "'Gwaa-ed' and 'selling salted duck eggs' are both slang for dying; don't say them in front of older relatives.", altEs: ["「瓜咗」同「賣鹹鴨蛋」都係死嘅俗語，唔好喺長輩面前講。"], grammar: [g.taboo-euphemisms, g.m-hou-dont], vocab: [w.gwaa1, w.maai6-haam4-aap3-daan2] }
      - { es: "以前啲人唔講「棺材舖」，會叫佢做「長生店」。", en: "In the old days people didn't say 'coffin shop'; they called it a 'longevity store'.", altEs: ["以前啲人唔講「棺材舖」，叫「長生店」。"], grammar: [g.taboo-euphemisms], vocab: [w.coeng4-saang1-dim3, w.gun1-coi4], transform: { instruction: "Say people still call it that today (而家)", answer: "而家啲人都唔講「棺材舖」，會叫佢做「長生店」。", alt: ["而家仲有人唔講「棺材舖」，會叫佢做「長生店」。"] } }
      - { es: "有人話夢見棺材係好意頭，因為「棺材」同「官財」同音。", en: "Some people say dreaming of a coffin is lucky, because 'coffin' sounds like 'office and wealth'.", altEs: ["有人話發夢見到棺材係好意頭，因為「棺材」同「官財」同音。"], grammar: [g.homophone-puns, g.taboo-euphemisms], vocab: [w.gun1-coi4] }
      - { es: "紅磡有好多殯儀館同紙紮舖。", en: "Hung Hom has lots of funeral parlours and paper-offering shops.", altEs: ["紅磡有好多間殯儀館同紙紮舖。"], grammar: [g.taboo-euphemisms], vocab: [w.ban3-ji4-gun2, w.zi2-zaat3] }
      - { es: "盂蘭節嗰陣，街邊成日見到有人燒衣。", en: "During the Hungry Ghost Festival you often see people burning paper clothes by the roadside.", altEs: ["盂蘭節嗰陣，成日見到有人喺街邊燒衣。"], grammar: [g.taboo-euphemisms], vocab: [w.jyu4-laan4-zit3, w.siu1-ji1] }
      - { es: "鬼節夜晚，阿媽叫我早啲返屋企。", en: "On Ghost Festival night, Mum tells me to come home early.", altEs: ["鬼節嗰晚，阿媽叫我早啲返屋企。"], grammar: [g.taboo-euphemisms, g.giu-someone], vocab: [w.gwai2-zit3], transform: { instruction: "Say Mum tells you not to come home too late", answer: "鬼節夜晚，阿媽叫我唔好太夜返屋企。", alt: ["鬼節夜晚，阿媽叫我唔好咁夜返屋企。"] } }
      - { es: "講壞消息要委婉啲，唔好咁直接。", en: "Break bad news more tactfully; don't be so blunt.", altEs: ["講壞消息要講得委婉啲，唔好咁直接。"], grammar: [g.taboo-euphemisms], vocab: [w.wai2-jyun2] }
      - { es: "呢首詩寫得好隱晦，我睇咗三次都唔明。", en: "This poem is so veiled that I've read it three times and still don't understand it.", altEs: ["首詩寫得好隱晦，我睇咗三次都唔明。"], grammar: [g.dak-descriptive], vocab: [w.jan2-fui3] }
    exchanges:
      - q: { es: "我想送個鐘畀阿爺做生日禮物，好唔好？", en: "I want to give Grandpa a clock for his birthday. Is that OK?" }
        a: { es: "千祈唔好，送鐘即係送終呀！", en: "Absolutely not - giving a clock means attending his deathbed!" }
        alt: ["唔好啦，送鐘好大忌。", "大吉利是！送第二樣啦。"]
        grammar: [g.taboo-euphemisms]
        vocab: [w.sung3-zung1, w.sung3-zung1.b]
      - q: { es: "我哋分個梨食吖？", en: "Shall we share a pear?" }
        a: { es: "唔好喇，分梨即係分離，你食晒佢啦。", en: "Better not - sharing a pear means separation. You have the whole thing." }
        alt: ["唔分喇，一人一個啦。", "分梨唔好意頭，你食啦。"]
        grammar: [g.taboo-euphemisms]
        vocab: [w.fan1-lei4, w.lei2]
      - q: { es: "阿婆聽到我講「死」字，點解咁嬲？", en: "Why did Grandma get so cross when she heard me say 'die'?" }
        a: { es: "佢好避忌，你要講「過身」。", en: "She's very superstitious about it; you should say 'pass away'." }
        alt: ["老人家好避忌嘅。", "要講得婉轉啲，講「過身」。"]
        grammar: [g.taboo-euphemisms]
        vocab: [w.bei6-gei6, w.gwo3-san1]
      - q: { es: "你哋盂蘭節做啲咩？", en: "What do you do at the Hungry Ghost Festival?" }
        a: { es: "阿媽喺街口燒衣，我就早啲返屋企。", en: "Mum burns paper clothes at the end of the street, and I come home early." }
        alt: ["燒衣囉。", "冇咩做，早啲返屋企。"]
        grammar: [g.taboo-euphemisms]
        vocab: [w.jyu4-laan4-zit3, w.siu1-ji1]
      - q: { es: "佢點解講嘢咁兜圈？", en: "Why is he beating about the bush?" }
        a: { es: "佢想講得委婉啲，唔想你唔開心。", en: "He wants to put it tactfully; he doesn't want to upset you." }
        alt: ["佢想婉轉啲。", "驚你唔開心囉。"]
        grammar: [g.taboo-euphemisms]
        vocab: [w.wai2-jyun2, w.jyun2-zyun2]
    texts:
      - title: "送禮小貼士"
        es: ["唔好送鐘，送鐘即係送終。", "唔好送遮，「傘」即係「散」。", "探病就送一籃生果，唔好送梨。"]
        en: ["Don't give a clock: it means attending a deathbed.", "Don't give an umbrella: 'umbrella' means 'break up'.", "When visiting someone sick, bring a basket of fruit - but no pears."]
        grammar: [g.taboo-euphemisms]
        vocab: [w.sung3-zung1, w.saan3.b, w.laam4, w.lei2]
      - title: "阿婆嘅規矩"
        es: ["年初一唔可以掃地，會掃走啲財。", "唔好講「死」，要講「過身」。", "講錯嘢就即刻講「大吉利是」。"]
        en: ["You mustn't sweep the floor on New Year's Day, or you'll sweep the wealth away.", "Don't say 'die'; say 'pass away'.", "If you say something unlucky, immediately say 'touch wood'."]
        grammar: [g.taboo-euphemisms]
        vocab: [w.gwo3-san1, w.daai6-gat1-lei6-si6]
    spicy:
      - { es: "送鐘唔得，送遮又唔得，不如我送自己畀你？", en: "A clock is out and an umbrella is out - so how about I give you myself?", altEs: ["送鐘唔得，送遮都唔得，不如我將自己送畀你？"], grammar: [g.taboo-euphemisms], vocab: [w.sung3-zung1] }
      - { es: "我哋一齊食個梨，但係唔分，你一啖我一啖。", en: "Let's eat a pear together, but not split it - you take a bite, then I take a bite.", altEs: ["我哋一齊食個梨，唔分，你一啖我一啖。"], grammar: [g.taboo-euphemisms], vocab: [w.lei2, w.fan1-lei4] }
      - { es: "你一話要走，我就即刻講「呸呸呸」。", en: "The moment you say you have to leave, I say 'touch wood'.", altEs: ["你一講要走，我就即刻「呸呸呸」。"], grammar: [g.taboo-euphemisms, g.jat-zau-as-soon-as], vocab: [w.pei1-pei1-pei1] }
      - { es: "我唔驚鬼節，我驚你唔覆我短訊。", en: "I'm not scared of the Ghost Festival; I'm scared you won't reply to my message.", altEs: ["我唔怕鬼節，最驚你唔覆我短訊。"], grammar: [g.taboo-euphemisms], vocab: [w.gwai2-zit3] }
      - { es: "你講嘢咁婉轉，係咪想約我又唔敢講？", en: "You're talking around it so much - do you want to ask me out but don't dare say it?", altEs: ["你講嘢咁婉轉，係咪想約我但係唔敢講？"], grammar: [g.taboo-euphemisms], vocab: [w.jyun2-zyun2] }
  - id: c2.u02.l3
    title: 豬脷同吉屋
    teach: [g.taboo-euphemisms, g.homophone-puns]
    vocab: [w.tung1-syu1, w.tung1-sing3, w.gat1-uk1, w.hung1-uk1, w.jap6-fo2, w.zyu1-lei6, w.lei6, w.sit6, w.zyu1-hung4, w.zyu1-jeon2, w.sing3-gwaa1, w.si1-gwaa1, w.loeng4-gwaa1, w.fu2-gwaa1, w.bei6-wai5, w.fung1-seoi2, w.baat3-zi6, w.syun3-meng6, w.saang1-ciu3, w.suk6.b, w.faan6-taai3-seoi3, w.seoi1-wan6, w.daa2-maa4-zoek2, w.ceot1-zou1]
    tip: "When a word sounds like loss, Cantonese swaps in its opposite: 舌 (= 蝕 lose) → 脷 (利 profit), 肝 (= 乾 dry) → 膶 (潤 moist), 書 (= 輸 lose) → 勝 (win), 空 (= 凶) → 吉."
    sentences:
      - { es: "唔該，我要一碗豬膶粥。", en: "A bowl of pork liver congee, please.", altEs: ["唔該，一碗豬膶粥。", "我要碗豬膶粥，唔該。"], grammar: [g.taboo-euphemisms], vocab: [w.zyu1-jeon2], transform: { instruction: "Order two bowls instead", answer: "唔該，我要兩碗豬膶粥。", alt: ["唔該，兩碗豬膶粥。", "我要兩碗豬膶粥，唔該。"] }, error: { wrong: "唔該，我要一碗豬肝粥。", explain: "In Hong Kong liver is 豬膶: 肝 gon1 sounds like 乾 'dry' (no money), so it was replaced by 膶 'moist'.", grammar: g.taboo-euphemisms } }
      - { es: "「肝」同「乾」同音，所以廣東人將豬肝叫做豬膶。", en: "'Liver' sounds like 'dry', so Cantonese speakers call pig's liver 'zyu jeon'.", altEs: ["「肝」同「乾」同音，所以廣東人叫豬肝做豬膶。"], grammar: [g.taboo-euphemisms, g.zoeng-disposal], vocab: [w.zyu1-jeon2] }
      - { es: "滷水豬脷好好食，你試吓啦。", en: "Braised pork tongue is delicious - try some.", altEs: ["滷水豬脷好正，你試吓啦。"], grammar: [g.taboo-euphemisms], vocab: [w.zyu1-lei6], jp: "lou5 seoi2 zyu1 lei6 hou2 hou2 sik6 nei5 si3 haa5 laa1" }
      - { es: "「舌」同「蝕」同音，所以廣東話叫做「脷」。", en: "'Tongue' sounds like 'lose money', so in Cantonese it's called 'lei'.", altEs: ["「舌」同「蝕」同音，所以廣東話講「脷」。"], grammar: [g.taboo-euphemisms, g.homophone-puns], vocab: [w.sit6, w.lei6] }
      - { es: "醫生叫我伸條脷出嚟睇吓。", en: "The doctor told me to stick out my tongue so he could have a look.", altEs: ["醫生叫我伸條脷出嚟畀佢睇吓。"], altEn: ["The doctor asked me to put my tongue out so she could look."], grammar: [g.taboo-euphemisms, g.giu-someone], vocab: [w.lei6], jp: "ji1 sang1 giu3 ngo5 san1 tiu4 lei6 ceot1 lai4 tai2 haa5" }
      - { es: "豬紅蘿蔔係街邊小食，好多人一放學就去買。", en: "Pig's blood curd with radish is a street snack; lots of people go and buy it straight after school.", altEs: ["豬紅蘿蔔係街邊小食，好多學生一放學就去買。"], grammar: [g.jat-zau-as-soon-as], vocab: [w.zyu1-hung4] }
      - { es: "呢個屋苑有幾間吉屋出租，下個月就可以入伙。", en: "There are a few vacant flats to let on this estate; you can move in next month.", altEs: ["呢個屋苑有幾間吉屋出租，下個月可以入伙。"], grammar: [g.taboo-euphemisms], vocab: [w.gat1-uk1, w.ceot1-zou1, w.jap6-fo2], transform: { instruction: "Turn it into a question: are there any vacant flats to let on this estate?", answer: "呢個屋苑有冇吉屋出租？", alt: ["呢個屋苑有冇吉屋出租呀？"] } }
      - { es: "「空屋」聽落好似「凶屋」，所以地產廣告會寫「吉屋」。", en: "'Empty flat' sounds like 'haunted flat', so estate agents' ads say 'lucky flat'.", altEs: ["「空屋」聽落似「凶屋」，所以地產廣告寫「吉屋」。"], grammar: [g.taboo-euphemisms, g.homophone-puns], vocab: [w.hung1-uk1, w.gat1-uk1] }
      - { es: "阿婆睇通勝揀日子搬屋。", en: "Grandma consults the almanac to pick a day to move house.", altEs: ["阿婆睇咗通勝先揀日子搬屋。"], grammar: [g.taboo-euphemisms], vocab: [w.tung1-sing3] }
      - { es: "「通書」嘅「書」同「輸」同音，打麻雀嘅人最驚。", en: "The 'book' in 'almanac' sounds like 'lose', which mahjong players dread most.", altEs: ["「通書」個「書」字同「輸」同音，打麻雀嘅人最怕。"], grammar: [g.taboo-euphemisms, g.homophone-puns], vocab: [w.tung1-syu1, w.daa2-maa4-zoek2] }
      - { es: "今晚有勝瓜炒蛋同涼瓜炒牛肉。", en: "Tonight there's stir-fried loofah with egg and bitter melon with beef.", altEs: ["今晚食勝瓜炒蛋同涼瓜炒牛肉。"], grammar: [g.taboo-euphemisms], vocab: [w.sing3-gwaa1, w.loeng4-gwaa1] }
      - { es: "「絲瓜」改做「勝瓜」，「苦瓜」改做「涼瓜」，都係為咗避諱。", en: "'Silk melon' became 'victory melon' and 'bitter melon' became 'cool melon', all to avoid unlucky words.", altEs: ["「絲瓜」叫做「勝瓜」，「苦瓜」叫做「涼瓜」，都係為咗避諱。"], grammar: [g.taboo-euphemisms], vocab: [w.si1-gwaa1, w.fu2-gwaa1, w.bei6-wai5] }
      - { es: "佢搬屋之前搵咗個師傅睇風水。", en: "Before moving house he got a master to check the feng shui.", altEs: ["佢搬屋前搵咗個師傅嚟睇風水。"], altEn: ["She had a feng shui master look at the flat before moving in."], grammar: [g.ji-cin-ji-hau], vocab: [w.fung1-seoi2] }
      - { es: "我屬馬，今年犯太歲，阿媽叫我去黃大仙拜神。", en: "I was born in the Year of the Horse and it's a clash year for me, so Mum told me to go and pray at Wong Tai Sin.", altEs: ["我屬馬，今年犯太歲，阿媽叫我去拜神。"], grammar: [g.taboo-euphemisms, g.giu-someone], vocab: [w.suk6.b, w.faan6-taai3-seoi3] }
      - { es: "你哋三個屬咩生肖㗎？", en: "What zodiac signs are the three of you?", altEs: ["你哋三個屬乜嘢生肖㗎？", "你哋三個屬咩㗎？"], grammar: [g.question-words], vocab: [w.saang1-ciu3, w.suk6.b] }
      - { es: "佢去算命，師傅話佢八字好，唔使驚衰運。", en: "She went to a fortune teller, who said her birth chart is good and she needn't fear bad luck.", altEs: ["佢去算命，師傅話佢八字好，唔使怕衰運。"], altEn: ["He had his fortune told; the master said his birth chart is good and bad luck is nothing to worry about."], grammar: [g.reported-speech], vocab: [w.syun3-meng6, w.baat3-zi6, w.seoi1-wan6] }
    exchanges:
      - q: { es: "你食唔食豬膶呀？", en: "Do you eat pork liver?" }
        a: { es: "唔食，我淨係食豬紅。", en: "No, I only eat pig's blood curd." }
        alt: ["食呀，豬膶粥最好食。", "唔鍾意，不過豬脷就食。"]
        grammar: [g.taboo-euphemisms]
        vocab: [w.zyu1-jeon2, w.zyu1-hung4]
      - q: { es: "點解叫勝瓜唔叫絲瓜？", en: "Why is it called 'victory melon' and not 'silk melon'?" }
        a: { es: "因為「絲」聽落似「輸」，叫「勝」就贏晒。", en: "Because 'silk' sounds like 'lose'; call it 'victory' and you win everything." }
        alt: ["避諱囉，「絲」似「輸」。", "因為「絲瓜」唔好意頭。"]
        grammar: [g.taboo-euphemisms]
        vocab: [w.sing3-gwaa1, w.si1-gwaa1]
      - q: { es: "你屬咩㗎？", en: "What's your zodiac sign?" }
        a: { es: "我屬龍，今年犯太歲。", en: "I'm a Dragon - this year clashes with my sign." }
        alt: ["屬龍。", "我屬馬，今年行好運。"]
        grammar: [g.taboo-euphemisms]
        vocab: [w.suk6.b, w.faan6-taai3-seoi3]
      - q: { es: "嗰個單位有冇人住？", en: "Does anyone live in that flat?" }
        a: { es: "冇，係吉屋，隨時可以入伙。", en: "No, it's vacant; you can move in any time." }
        alt: ["吉屋嚟㗎。", "冇人住，業主想出租。"]
        grammar: [g.taboo-euphemisms]
        vocab: [w.gat1-uk1, w.jap6-fo2]
      - q: { es: "你搬屋揀咗日子未呀？", en: "Have you picked a date for the move yet?" }
        a: { es: "阿婆睇咗通勝，揀咗下個月初八。", en: "Grandma checked the almanac and chose the eighth of next month." }
        alt: ["未呀，等阿婆睇通勝先。", "揀咗喇，下個月初八。"]
        grammar: [g.taboo-euphemisms]
        vocab: [w.tung1-sing3]
    texts:
      - title: "地產舖廣告"
        es: ["吉屋出租！", "兩房一廳，近港鐵站。", "即時入伙，業主好有誠意。"]
        en: ["Vacant flat to let!", "Two bedrooms and a living room, near an MTR station.", "Immediate occupancy; the landlord is very open to offers."]
        grammar: [g.taboo-euphemisms, g.notice-language]
        vocab: [w.gat1-uk1, w.ceot1-zou1, w.jap6-fo2]
      - title: "茶餐廳今日特餐"
        es: ["勝瓜炒蛋飯，送凍檸茶。", "加五蚊有豬膶粥。", "滷水豬脷，每碟四十八蚊。"]
        en: ["Loofah and egg on rice, with a free iced lemon tea.", "Add five dollars for pork liver congee.", "Braised pork tongue, forty-eight dollars a plate."]
        grammar: [g.taboo-euphemisms]
        vocab: [w.sing3-gwaa1, w.zyu1-jeon2, w.zyu1-lei6]
    spicy:
      - { es: "我算過命，師傅話我八字同你好夾。", en: "I had my fortune told; the master says my birth chart and yours are a perfect match.", altEs: ["我去算過命，師傅話我嘅八字同你好夾。"], grammar: [g.taboo-euphemisms], vocab: [w.syun3-meng6, w.baat3-zi6] }
      - { es: "我個心而家係吉屋，你幾時入伙？", en: "My heart is a vacant flat right now - when are you moving in?", altEs: ["我個心而家係間吉屋，你幾時入伙呀？"], grammar: [g.taboo-euphemisms], vocab: [w.gat1-uk1, w.jap6-fo2] }
      - { es: "請你食豬脷，因為同你一齊實有「利」。", en: "I'm treating you to pork tongue, because being with you is bound to be 'profitable'.", altEs: ["我請你食豬脷，同你一齊實有「利」。"], grammar: [g.taboo-euphemisms, g.homophone-puns], vocab: [w.zyu1-lei6], jp: "ceng2 nei5 sik6 zyu1 lei6 jan1 wai6 tung4 nei5 jat1 cai4 sat6 jau5 lei6" }
      - { es: "我睇過通勝，今晚最啱約會。", en: "I've checked the almanac - tonight is perfect for a date.", altEs: ["我睇咗通勝，今晚最啱約會。"], grammar: [g.taboo-euphemisms], vocab: [w.tung1-sing3] }
      - { es: "你今年犯太歲？唔使驚，有我陪住你。", en: "This year clashes with your sign? Don't worry, I'll be right by your side.", altEs: ["你今年犯太歲呀？唔使怕，有我陪你。"], grammar: [g.taboo-euphemisms], vocab: [w.faan6-taai3-seoi3] }
  - id: c2.u02.l4
    title: 「你」定「理」？
    teach: [g.lazy-sounds]
    vocab: [w.laan5-jam1, w.zing3-jam1, w.co3-jam1, w.bei6-jam1, w.sing1-mou5, w.wan5-mou5, w.jam1-zit3, w.tung4-jam1-zi6, w.tung4-jam1, w.sik6-zi6, w.zi6-mai4, w.dang1-mai4, w.waan2-je5]
    tip: "Recognise lazy sounds but produce the standard: 你 nei5 (not lei5), 我 ngo5 (not o5), 廣 gwong2 (not gong2), 學 hok6 (not hot6)."
    sentences:
      - { es: "好多後生講嘢有懶音，將「你」讀成「理」。", en: "Lots of young people have lazy pronunciation and say 'nei' (you) as 'lei'.", altEs: ["好多後生講嘢有懶音，將「你」讀做「理」。"], grammar: [g.lazy-sounds, g.zoeng-disposal], vocab: [w.laan5-jam1] }
      - { es: "佢將「廣州」讀成「港州」，係好常見嘅懶音。", en: "He pronounces 'Gwongzau' as 'Gongzau' - a very common lazy sound.", altEs: ["佢將「廣州」讀做「港州」，係好常見嘅懶音。"], altEn: ["She says 'Guangzhou' like 'Gongzau', a very common lazy sound."], grammar: [g.lazy-sounds, g.zoeng-disposal], vocab: [w.laan5-jam1] }
      - { es: "有咗懶音，「男」同「藍」就變成同音字。", en: "With lazy sounds, 'male' and 'blue' become homophones.", altEs: ["有懶音嘅話，「男」同「藍」就變成同音字。"], grammar: [g.lazy-sounds], vocab: [w.tung4-jam1-zi6], error: { wrong: "有咗懶音，「男」同「藍」就變成同義字。", explain: "They come to sound the same (同音字), not to mean the same (同義字).", grammar: g.lazy-sounds } }
      - { es: "有懶音嘅人會將「國」同「角」讀到一模一樣。", en: "People with lazy sounds pronounce 'country' and 'corner' exactly the same.", altEs: ["有懶音嘅人讀「國」同「角」係一樣嘅。"], grammar: [g.lazy-sounds, g.zoeng-disposal], vocab: [w.laan5-jam1, w.tung4-jam1], jp: "jau5 laan5 jam1 ge3 jan4 wui5 zoeng1 gwok3 tung4 gok3 duk6 dou3 jat1 mou4 jat1 joeng6" }
      - { es: "新聞主持人講嘢一定要用正音。", en: "News presenters must always use the standard pronunciation.", altEs: ["新聞主持人講嘢要用正音。"], grammar: [g.lazy-sounds], vocab: [w.zing3-jam1], transform: { instruction: "Make it negative: you don't have to use it when chatting with friends (同朋友傾偈)", answer: "同朋友傾偈唔一定要用正音。", alt: ["同朋友傾偈就唔使用正音。"] } }
      - { es: "你讀錯音喇，「我」字要有鼻音。", en: "You've mispronounced it: 'ngo' (I) needs its nasal sound.", altEs: ["你讀錯音呀，「我」字要有鼻音㗎。"], grammar: [g.lazy-sounds], vocab: [w.co3-jam1, w.bei6-jam1] }
      - { es: "「我」字個聲母係鼻音，好多後生都唔讀出嚟。", en: "The initial of 'ngo' is a nasal, and lots of young people don't pronounce it.", altEs: ["「我」嘅聲母係鼻音，好多後生都唔讀出嚟。"], grammar: [g.lazy-sounds], vocab: [w.sing1-mou5, w.bei6-jam1] }
      - { es: "每個音節都有韻母，但係唔係個個都有聲母。", en: "Every syllable has a final, but not every one has an initial.", altEs: ["每個音節都有韻母，不過唔係個個都有聲母。"], grammar: [g.lazy-sounds], vocab: [w.jam1-zit3, w.wan5-mou5, w.sing1-mou5] }
      - { es: "將「香港」讀成「香趕」，係韻母嘅懶音。", en: "Saying 'Heunggong' as 'Heunggon' is a lazy sound in the final.", altEs: ["「香港」讀做「香趕」，係韻母嘅懶音。"], grammar: [g.lazy-sounds, g.zoeng-disposal], vocab: [w.wan5-mou5, w.laan5-jam1] }
      - { es: "老師成日改我哋嘅懶音，不過一落堂大家又照講。", en: "The teacher keeps correcting our lazy sounds, but as soon as class is over everyone talks the same way again.", altEs: ["老師成日改我哋啲懶音，但係一落堂大家又照講。"], grammar: [g.lazy-sounds, g.jat-zau-as-soon-as], vocab: [w.laan5-jam1] }
      - { es: "香港廣告好鍾意食字，將一句成語改一個同音字。", en: "Hong Kong ads love puns: they change one character of an idiom for a homophone.", altEs: ["香港啲廣告好鍾意食字，將成語改一個同音字。"], grammar: [g.homophone-puns, g.zoeng-disposal], vocab: [w.sik6-zi6, w.tung4-jam1-zi6] }
      - { es: "元宵節我哋去估燈謎，啲燈謎好多都係玩字。", en: "At the Lantern Festival we go and guess lantern riddles; many of them play on characters.", altEs: ["元宵節我哋去估燈謎，好多燈謎都係玩字。"], grammar: [g.homophone-puns], vocab: [w.dang1-mai4], transform: { instruction: "Ask a friend whether they're going to guess lantern riddles at the Lantern Festival", answer: "元宵節你去唔去估燈謎？", alt: ["元宵節你會唔會去估燈謎？"] } }
      - { es: "呢個字謎好難：「一口咬甩牛尾」，係咩字？", en: "This character riddle is hard: 'one mouth bites off the ox's tail' - which character is it?", altEs: ["呢個字謎好難：「一口咬甩牛尾」，係乜嘢字？"], grammar: [g.homophone-puns], vocab: [w.zi6-mai4], note: "The answer is 告: 口 under 牛 with its tail gone." }
      - { es: "佢成日喺度玩嘢，故意將「我」讀成「哦」。", en: "He's always fooling around, deliberately saying 'ngo' as 'o'.", altEs: ["佢成日玩嘢，故意將「我」讀做「哦」。"], grammar: [g.lazy-sounds, g.zoeng-disposal], vocab: [w.waan2-je5] }
      - { es: "有懶音唔代表冇文化，不過見工嗰陣最好講正音。", en: "Lazy sounds don't mean you're uncultured, but at a job interview it's best to use standard pronunciation.", altEs: ["有懶音唔等於冇文化，不過見工最好講正音。"], grammar: [g.lazy-sounds], vocab: [w.laan5-jam1, w.zing3-jam1] }
    exchanges:
      - q: { es: "我講嘢有冇懶音呀？", en: "Do I have lazy sounds when I talk?" }
        a: { es: "有少少，你將「你」讀成「理」。", en: "A little - you say 'nei' as 'lei'." }
        alt: ["冇呀，好標準。", "有啲，「我」字冇鼻音。"]
        grammar: [g.lazy-sounds]
        vocab: [w.laan5-jam1, w.bei6-jam1]
      - q: { es: "點解老師成日改我哋讀音？", en: "Why does the teacher keep correcting our pronunciation?" }
        a: { es: "因為佢想我哋學好正音。", en: "Because she wants us to learn the standard pronunciation properly." }
        alt: ["佢唔鍾意懶音囉。", "驚我哋讀錯音吖嘛。"]
        grammar: [g.lazy-sounds]
        vocab: [w.zing3-jam1]
      - q: { es: "「男」同「藍」讀音一唔一樣？", en: "Are 'male' and 'blue' pronounced the same?" }
        a: { es: "正音唔同，不過有懶音就變咗同音。", en: "In the standard they're different, but with lazy sounds they become homophones." }
        alt: ["唔一樣，一個係鼻音。", "有懶音先會同音。"]
        grammar: [g.lazy-sounds]
        vocab: [w.tung4-jam1, w.zing3-jam1]
      - q: { es: "呢個燈謎嘅答案係咩？", en: "What's the answer to this lantern riddle?" }
        a: { es: "我估係「告」字。", en: "I'd guess it's the character 'gou'." }
        alt: ["唔知呀，好難估。", "係咪「告」字？"]
        grammar: [g.homophone-puns]
        vocab: [w.dang1-mai4]
      - q: { es: "呢個廣告點解咁好笑？", en: "Why is this ad so funny?" }
        a: { es: "佢食字，將成語改咗一個同音字。", en: "It's a pun: they changed one character of an idiom for a homophone." }
        alt: ["食字囉。", "佢玩緊同音字。"]
        grammar: [g.homophone-puns]
        vocab: [w.sik6-zi6, w.tung4-jam1-zi6]
    texts:
      - title: "廣東話課堂筆記"
        es: ["懶音唔係錯字，係讀音嘅變化。", "常見例子：「你」讀成「理」，「我」冇咗鼻音。", "自己講嘢，最好用正音。"]
        en: ["Lazy sounds aren't misspellings; they're changes in pronunciation.", "Common examples: 'nei' said as 'lei', 'ngo' losing its nasal.", "When you speak yourself, it's best to use the standard pronunciation."]
        grammar: [g.lazy-sounds]
        vocab: [w.laan5-jam1, w.bei6-jam1, w.zing3-jam1]
    spicy:
      - { es: "你講「我愛你」都有懶音，不過我照樣聽得明。", en: "Even your 'I love you' has lazy sounds, but I understand it all the same.", altEs: ["你講「我愛你」都有懶音，不過我都聽得明。"], grammar: [g.lazy-sounds], vocab: [w.laan5-jam1] }
      - { es: "你個名有冇同音字？我想日日寫一次。", en: "Does your name have a homophone? I want to write it once a day.", altEs: ["你個名有冇同音字呀？我想日日都寫一次。"], grammar: [g.lazy-sounds], vocab: [w.tung4-jam1-zi6], jp: "nei5 go3 meng2 jau5 mou5 tung4 jam1 zi6 ngo5 soeng2 jat6 jat6 se2 jat1 ci3" }
      - { es: "你估唔估到呢個燈謎？答案係我想約你。", en: "Can you guess this lantern riddle? The answer is that I want to ask you out.", altEs: ["你估唔估到呢個燈謎呀？答案係我想約你。"], grammar: [g.homophone-puns], vocab: [w.dang1-mai4] }
      - { es: "唔好喺度玩嘢喇，你明明想我送你返屋企。", en: "Stop playing games - you obviously want me to walk you home.", altEs: ["唔好再玩嘢喇，你明明想我送你返屋企。"], grammar: [g.lazy-sounds], vocab: [w.waan2-je5] }
dialogues:
  - id: c2.u02.d1
    title: 陳家祠買入伙禮物
    context: At the gift shop of the Chen Clan Academy in Guangzhou, Chi-ming looks for a housewarming present for Ah Sam, and Ka-yan steers him away from unlucky gifts.
    lines:
      - { speaker: 志明, es: "阿琛下個月入伙，我想喺陳家祠買份禮物送畀佢。", en: "Ah Sam is moving into his new flat next month; I want to buy him a present here at the Chen Clan Academy." }
      - { speaker: 嘉欣, es: "好主意，不過千祈唔好送鐘，送鐘即係送終。", en: "Good idea, but whatever you do, don't give a clock - giving a clock means attending a deathbed." }
      - { speaker: 志明, es: "我知，我諗住送把遮，佢屋企成日冇遮。", en: "I know. I was thinking of an umbrella; there's never one at his place." }
      - { speaker: 嘉欣, es: "大吉利是！遮又叫傘，「傘」同「散」同音，人哋會以為你想佢兩公婆散。", en: "Touch wood! An umbrella is also 'saan', which sounds like 'break up' - they'll think you want the couple to split." }
      - { speaker: 志明, es: "嘩，咁麻煩？噉送一籃梨呢？佢老婆好鍾意食梨。", en: "Wow, that complicated? Then how about a basket of pears? His wife loves pears." }
      - { speaker: 嘉欣, es: "都唔好，分梨即係分離。不如送盆桔，桔即係吉，好意頭。", en: "No good either: sharing pears means separation. Why not a pot of kumquats? Kumquat means luck - a good omen." }
      - { speaker: 志明, es: "好，再加個陶瓷元寶，祝佢哋發財。", en: "OK, and I'll add a ceramic gold ingot, wishing them wealth." }
      - { speaker: 嘉欣, es: "叻仔！你睇，呢件木雕有蝙蝠，蝠即係福，都幾啱送。", en: "Good boy! Look, this wood carving has bats - bat means blessing, so it would make a nice gift too." }
      - { speaker: 志明, es: "你咁識，係咪日日睇通勝㗎？", en: "You know so much - do you read the almanac every day?" }
      - { speaker: 嘉欣, es: "唔係呀，我阿婆成日講，我聽到熟晒啫。", en: "No, my grandma says these things all the time; I just know them by heart." }
    questions:
      - { q: "點解唔可以送遮？", options: ["「傘」同「散」同音", "遮太貴", "阿琛已經有好多遮"], answer: 0, explain: "傘 saan3 sounds like 散 saan3 'break up'." }
      - { q: "點解嘉欣叫志明唔好送梨？", options: ["阿琛老婆唔鍾意食梨", "分梨聽落似分離", "啲梨唔新鮮"], answer: 1, explain: "分梨 'share a pear' sounds like 分離 'separation'." }
      - { q: "最後志明決定送乜嘢？", options: ["一個鐘", "一籃梨", "一盆桔同一個陶瓷元寶"], answer: 2, explain: "He chooses kumquats (桔 = 吉 'lucky') and a ceramic ingot for wealth." }
      - { q: "嘉欣點解咁識呢啲避忌？", options: ["佢阿婆成日講", "佢日日睇通勝", "佢喺陳家祠做導遊"], answer: 0, explain: "Her grandmother talks about them all the time (我阿婆成日講)." }
