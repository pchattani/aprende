id: c1.u06
title: "Le pic du Midi : veuillez agréer…"
lessons:
  - id: c1.u06.l1
    title: "Madame, Monsieur,"
    teach: [g.formal-letter]
    tip: "A French formal letter opens with Madame, Monsieur, (never 'Cher' to a stranger), states its purpose at once (Je me permets de vous écrire afin de…) and closes with one long formula that repeats the opening: Je vous prie d'agréer, Madame, Monsieur, l'expression de mes salutations distinguées."
    vocab: [w.solliciter, w.observation, w.observatoire, w.télescope, w.astronome, w.astronomie, w.scruter, w.photographier, w.pic, w.curriculum-vitae, w.lettre-de-motivation, w.agréer, w.salutations, w.distingué, w.disposition, w.dans-l-attente-de, w.remerciement, w.avoir-l-honneur-de, w.faire-suite-à, w.suite-à, w.destinataire, w.expéditeur, w.objet, w.cordialement, w.renseignement, w.se-renseigner, w.doctorant, w.prolongation, w.téléphonique, w.complémentaire]
    sentences:
      - { es: "Madame, Monsieur, je me permets de vous écrire afin de solliciter un séjour d'observation à l'observatoire du pic du Midi.", en: "Dear Sir or Madam, I am writing to request an observation stay at the Pic du Midi observatory.", altEs: ["Madame, Monsieur, je me permets de vous écrire pour solliciter un séjour d'observation à l'observatoire du pic du Midi.", "Madame, Monsieur, je vous écris afin de solliciter un séjour d'observation à l'observatoire du pic du Midi."], altEn: ["Dear Sir or Madam, I am writing to apply for an observation stay at the Pic du Midi observatory."], grammar: [g.formal-letter], vocab: [w.solliciter, w.observation, w.observatoire, w.pic] }
      - { es: "Vous trouverez ci-joint mon curriculum vitae et ma lettre de motivation.", en: "Please find attached my CV and my cover letter.", altEs: ["Vous trouverez ci-joints mon curriculum vitae et ma lettre de motivation.", "Veuillez trouver ci-joint mon curriculum vitae et ma lettre de motivation."], altEn: ["Please find enclosed my CV and my cover letter.", "You will find attached my CV and my cover letter."], grammar: [g.formal-letter, g.administrative-french], vocab: [w.curriculum-vitae, w.lettre-de-motivation, w.ci-joint] }
      - { es: "Je vous serais reconnaissante de bien vouloir me confirmer les dates de mon séjour.", en: "I would be grateful if you could confirm the dates of my stay.", altEs: ["Je vous serais reconnaissant de bien vouloir me confirmer les dates de mon séjour.", "Je vous serais reconnaissante de me confirmer les dates de mon séjour."], grammar: [g.formal-letter, g.conditional-politeness], vocab: [w.séjour], transform: { instruction: "Make the request less formal, for a colleague you know (pourriez-vous)", answer: "Pourriez-vous me confirmer les dates de mon séjour ?", alt: ["Pourriez-vous me confirmer les dates de mon séjour, s'il vous plaît ?", "Est-ce que vous pourriez me confirmer les dates de mon séjour ?"], en: "Could you confirm the dates of my stay?" } }
      - { es: "Dans l'attente de votre réponse, je vous prie d'agréer, Madame, Monsieur, l'expression de mes salutations distinguées.", en: "I look forward to hearing from you. Yours faithfully.", altEs: ["Dans l'attente de votre réponse, veuillez agréer, Madame, Monsieur, l'expression de mes salutations distinguées."], altEn: ["Looking forward to your reply, yours faithfully.", "Awaiting your reply, yours faithfully."], grammar: [g.formal-letter], vocab: [w.dans-l-attente-de, w.agréer, w.salutations, w.distingué] }
      - { es: "Suite à notre entretien téléphonique du 3 mai, je vous adresse mon dossier de candidature.", en: "Following our telephone conversation of 3 May, I am sending you my application.", altEs: ["Suite à notre entretien téléphonique du 3 mai, je vous envoie mon dossier de candidature.", "Faisant suite à notre entretien téléphonique du 3 mai, je vous adresse mon dossier de candidature."], grammar: [g.formal-letter], vocab: [w.suite-à, w.entretien, w.candidature] }
      - { es: "Je fais suite à votre courriel du 12 mars concernant les nuits au télescope.", en: "I am following up on your email of 12 March about the nights at the telescope.", altEs: ["Je fais suite à votre mail du 12 mars concernant les nuits au télescope.", "Je fais suite à votre courriel du 12 mars au sujet des nuits au télescope."], grammar: [g.formal-letter], vocab: [w.faire-suite-à, w.télescope] }
      - { es: "Je reste à votre disposition pour tout renseignement complémentaire.", en: "I remain at your disposal for any further information.", altEs: ["Je me tiens à votre disposition pour tout renseignement complémentaire.", "Je reste à votre entière disposition pour tout renseignement complémentaire."], altEn: ["Please do not hesitate to contact me for any further information."], grammar: [g.formal-letter], vocab: [w.disposition, w.renseignement] }
      - { es: "J'ai l'honneur de solliciter votre bienveillance pour une prolongation de mon séjour.", en: "I have the honour of requesting your kind consideration for an extension of my stay.", altEs: ["J'ai l'honneur de vous demander une prolongation de mon séjour."], grammar: [g.formal-letter], vocab: [w.avoir-l-honneur-de, w.solliciter], note: "J'ai l'honneur de… is the most formal opening, used in letters to authorities." }
      - { es: "Monsieur le Directeur, je vous écris au sujet du programme d'astronomie de l'été prochain.", en: "Dear Director, I am writing regarding next summer's astronomy programme.", altEs: ["Monsieur le Directeur, je vous écris concernant le programme d'astronomie de l'été prochain.", "Madame la Directrice, je vous écris au sujet du programme d'astronomie de l'été prochain."], grammar: [g.formal-letter], vocab: [w.astronomie, w.directeur] }
      - { es: "Monsieur, je me permets de vous écrire afin de solliciter un stage à l'observatoire.", en: "Dear Sir, I am writing to apply for an internship at the observatory.", altEs: ["Monsieur, je me permets de vous écrire pour solliciter un stage à l'observatoire.", "Madame, je me permets de vous écrire afin de solliciter un stage à l'observatoire."], grammar: [g.formal-letter], vocab: [w.destinataire, w.solliciter], error: { wrong: "Cher Monsieur, je me permets de vous écrire afin de solliciter un stage à l'observatoire.", explain: "In a first formal letter to someone you don't know, open with Monsieur, alone: Cher Monsieur is too familiar.", grammar: g.formal-letter } }
      - { es: "En vous remerciant par avance de votre attention, je vous prie d'agréer, Monsieur, mes salutations distinguées.", en: "Thanking you in advance for your attention, yours faithfully.", altEs: ["En vous remerciant par avance de votre attention, veuillez agréer, Monsieur, mes salutations distinguées."], grammar: [g.formal-letter, g.gerondif], vocab: [w.agréer, w.salutations], error: { wrong: "En vous remerciant par avance de votre attention, je vous prie d'agréer, Monsieur, mes salutations distinguées. Bisous.", explain: "A formal letter ends with the closing formula alone: no friendly sign-off after it.", grammar: g.formal-letter } }
      - { es: "Dans l'objet du courriel, précisez la nature de votre demande.", en: "In the subject line of the email, state the nature of your request.", altEs: ["Dans l'objet du mail, précisez la nature de votre demande.", "Précisez la nature de votre demande dans l'objet du courriel."], grammar: [g.formal-letter, g.imperative], vocab: [w.objet, w.préciser], variant: "Québec: courriel is the everyday word; France also says mail or e-mail." }
      - { es: "Les astronomes scrutent le ciel depuis le sommet, à 2 877 mètres d'altitude.", en: "The astronomers scan the sky from the summit, at an altitude of 2,877 metres.", altEs: ["Depuis le sommet, à 2 877 mètres d'altitude, les astronomes scrutent le ciel."], grammar: [g.present-er], vocab: [w.astronome, w.scruter, w.sommet] }
      - { es: "Avant d'écrire à l'observatoire, je me suis renseignée sur les conditions d'accueil des chercheurs.", en: "Before writing to the observatory, I found out about the arrangements for hosting researchers.", altEs: ["Avant d'écrire à l'observatoire, je me suis renseigné sur les conditions d'accueil des chercheurs."], grammar: [g.apres-avoir-avant-de, g.pronominal-passe-compose], vocab: [w.se-renseigner, w.chercheur] }
      - { es: "Je souhaiterais photographier la Lune avec le grand télescope.", en: "I would like to photograph the Moon with the large telescope.", altEs: ["J'aimerais photographier la Lune avec le grand télescope.", "Je voudrais photographier la Lune avec le grand télescope."], grammar: [g.conditional-politeness], vocab: [w.photographier, w.télescope], transform: { instruction: "Put it into a formal request: Je vous serais reconnaissant(e) de bien vouloir m'autoriser à…", answer: "Je vous serais reconnaissant de bien vouloir m'autoriser à photographier la Lune avec le grand télescope.", alt: ["Je vous serais reconnaissante de bien vouloir m'autoriser à photographier la Lune avec le grand télescope."], en: "I would be grateful if you would allow me to photograph the Moon with the large telescope." } }
      - { es: "Cordialement, Inès Morel, doctorante en astrophysique.", en: "Kind regards, Inès Morel, PhD student in astrophysics.", altEs: ["Bien cordialement, Inès Morel, doctorante en astrophysique.", "Bien à vous, Inès Morel, doctorante en astrophysique."], altEn: ["Best regards, Inès Morel, PhD student in astrophysics."], grammar: [g.formal-letter], vocab: [w.cordialement, w.doctorant] }
    exchanges:
      - q: { es: "Comment est-ce que je commence la lettre ? Je ne connais pas le nom du directeur.", en: "How do I begin the letter? I don't know the director's name." }
        a: { es: "Écris simplement « Madame, Monsieur, » et entre tout de suite dans le sujet.", en: "Just write 'Madame, Monsieur,' and get straight to the point." }
        alt: ["Mets « Monsieur le Directeur, » : c'est plus sûr.", "« Madame, Monsieur, » suffit, sans « Cher »."]
        grammar: [g.formal-letter]
        vocab: [w.destinataire]
      - q: { es: "Et pour finir ? « Bisous » ne me paraît pas idéal.", en: "And to finish? 'Love' doesn't seem ideal." }
        a: { es: "Non ! « Je vous prie d'agréer, Madame, Monsieur, l'expression de mes salutations distinguées. »", en: "No! 'Yours faithfully', in the full French formula." }
        alt: ["Pour un courriel, « Cordialement » suffit.", "Mets « Bien cordialement » si c'est un courriel."]
        grammar: [g.formal-letter]
        vocab: [w.agréer, w.salutations, w.cordialement]
      - q: { es: "Tu as joint ton CV à ta candidature ?", en: "Did you attach your CV to your application?" }
        a: { es: "Oui, et j'ai ajouté une phrase : « Vous trouverez ci-joint mon curriculum vitae. »", en: "Yes, and I added a sentence: 'Please find my CV attached.'" }
        alt: ["Oui, avec ma lettre de motivation.", "Pas encore, je le joins ce soir."]
        grammar: [g.formal-letter]
        vocab: [w.curriculum-vitae, w.candidature]
      - q: { es: "Qu'est-ce que je mets dans l'objet du mail ?", en: "What do I put in the subject line of the email?" }
        a: { es: "Quelque chose de précis : « Demande de séjour d'observation, août prochain ».", en: "Something precise: 'Request for an observation stay, next August'." }
        alt: ["« Candidature : séjour d'observation au pic du Midi ».", "Le motif de ta demande, en quelques mots."]
        grammar: [g.formal-letter]
        vocab: [w.objet, w.observation]
      - q: { es: "Vous avez reçu ma lettre du 3 mai, Monsieur ?", en: "Did you receive my letter of 3 May, sir?" }
        a: { es: "Oui, et je vous en remercie ; je vous réponds par écrit dans les meilleurs délais.", en: "Yes, and thank you for it; I will reply in writing as soon as possible." }
        alt: ["Oui, nous l'avons bien reçue.", "Oui, votre demande est en cours d'examen."]
        grammar: [g.formal-letter]
        vocab: [w.remerciement]
    texts:
      - title: "Courriel à l'observatoire"
        es: ["Objet : demande de séjour d'observation.", "Madame, Monsieur, suite à notre échange téléphonique, je me permets de solliciter une semaine au télescope en août.", "Vous trouverez ci-joint mon curriculum vitae.", "Bien cordialement, Inès Morel."]
        en: ["Subject: request for an observation stay.", "Dear Sir or Madam, following our phone conversation, I am writing to request a week at the telescope in August.", "Please find my CV attached.", "Kind regards, Inès Morel."]
        grammar: [g.formal-letter]
        vocab: [w.objet, w.solliciter, w.curriculum-vitae, w.cordialement]
      - title: "Conseil d'une directrice de thèse"
        es: ["Renseigne-toi sur le nom du destinataire avant d'écrire.", "Garde un ton sobre : pas de point d'exclamation, pas d'émoticône.", "Et relis la formule finale deux fois !"]
        en: ["Find out the recipient's name before you write.", "Keep a sober tone: no exclamation marks, no emoticons.", "And read the closing formula twice!"]
        grammar: [g.formal-letter, g.imperative]
        vocab: [w.se-renseigner, w.destinataire]
    spicy:
      - { es: "Madame, j'ai l'honneur de solliciter un dîner en votre compagnie, sous les étoiles du pic du Midi.", en: "Madam, I have the honour of requesting a dinner in your company, under the stars of the Pic du Midi.", altEs: ["Madame, j'ai l'honneur de solliciter un dîner en votre compagnie sous les étoiles du pic du Midi."], grammar: [g.formal-letter], vocab: [w.avoir-l-honneur-de, w.solliciter] }
      - { es: "Dans l'attente de votre réponse, je reste à votre entière disposition, surtout le samedi soir.", en: "Awaiting your reply, I remain entirely at your disposal, especially on Saturday nights.", altEs: ["Dans l'attente de votre réponse, je reste à votre disposition, surtout le samedi soir."], grammar: [g.formal-letter], vocab: [w.dans-l-attente-de, w.disposition] }
      - { es: "Vous trouverez ci-joint mon numéro de téléphone ; je vous serais reconnaissant d'en faire bon usage.", en: "Please find my phone number attached; I would be grateful if you made good use of it.", altEs: ["Vous trouverez ci-joint mon numéro ; je vous serais reconnaissant d'en faire bon usage."], grammar: [g.formal-letter], vocab: [w.ci-joint] }
      - { es: "Il m'a écrit « veuillez agréer l'expression de mes sentiments les plus tendres » : c'est la lettre d'amour la plus administrative du monde.", en: "He wrote to me 'please accept the expression of my most tender feelings': it's the most bureaucratic love letter in the world.", altEs: ["Il m'a écrit « veuillez agréer l'expression de mes sentiments les plus tendres » : c'est la lettre d'amour la plus administrative qui soit."], grammar: [g.formal-letter, g.superlatives], vocab: [w.agréer] }
      - { es: "Objet : demande d'observation prolongée de vos beaux yeux.", en: "Subject: request for the extended observation of your beautiful eyes.", altEs: ["Objet : demande d'observation prolongée de tes beaux yeux."], grammar: [g.formal-letter], vocab: [w.objet, w.observation] }
  - id: c1.u06.l2
    title: Veuillez remplir le formulaire
    teach: [g.administrative-french]
    tip: "Administrative French: veuillez + infinitive (please…), ci-joint (enclosed), le cas échéant (if applicable), sous réserve de (subject to), à compter du (as from), dûment rempli (duly completed). Ci-joint stays invariable at the start of a sentence, but agrees after the noun: les pièces ci-jointes."
    vocab: [w.ci-joint, w.ci-dessus, w.ci-dessous, w.parvenir, w.dûment, w.compléter, w.le-cas-échéant, w.échéance, w.joindre, w.justificatif, w.domicile, w.tarif, w.applicable, w.sous-réserve-de, w.soussigné, w.certifier, w.exactitude, w.document, w.formulaire, w.à-compter-de, w.à-titre-de, w.au-titre-de, w.accusé-de-réception, w.pièce-justificative, w.signataire, w.cachet, w.paraphe, w.valider, w.dépôt, w.déposer, w.remettre, w.page, w.incomplet, w.secrétariat, w.paiement, w.examiner, w.confirmation]
    sentences:
      - { es: "Veuillez nous faire parvenir votre dossier dûment complété avant le 15 mars.", en: "Please send us your duly completed file before 15 March.", altEs: ["Veuillez nous faire parvenir votre dossier dûment rempli avant le 15 mars.", "Merci de nous faire parvenir votre dossier dûment complété avant le 15 mars."], altEn: ["Please submit your duly completed file before 15 March."], grammar: [g.administrative-french], vocab: [w.parvenir, w.dûment, w.compléter], transform: { instruction: "Say it to a friend, informally (tu peux…)", answer: "Tu peux m'envoyer ton dossier rempli avant le 15 mars ?", alt: ["Tu peux m'envoyer ton dossier complet avant le 15 mars ?", "Envoie-moi ton dossier rempli avant le 15 mars."], en: "Can you send me your completed file before 15 March?" } }
      - { es: "Le cas échéant, joignez un justificatif de domicile de moins de trois mois.", en: "If applicable, attach proof of address less than three months old.", altEs: ["Le cas échéant, veuillez joindre un justificatif de domicile de moins de trois mois.", "Joignez, le cas échéant, un justificatif de domicile de moins de trois mois."], grammar: [g.administrative-french], vocab: [w.le-cas-échéant, w.joindre, w.justificatif, w.domicile] }
      - { es: "Ce tarif est applicable à compter du 1er janvier, sous réserve de modifications.", en: "This rate applies as from 1 January, subject to change.", altEs: ["Ce tarif s'applique à compter du 1er janvier, sous réserve de modifications.", "Ce tarif est applicable à partir du 1er janvier, sous réserve de modifications."], grammar: [g.administrative-french], vocab: [w.tarif, w.applicable, w.à-compter-de, w.sous-réserve-de] }
      - { es: "Je soussignée, Inès Morel, certifie l'exactitude des renseignements ci-dessus.", en: "I, the undersigned, Inès Morel, certify that the above information is correct.", altEs: ["Je soussigné, Paul Morel, certifie l'exactitude des renseignements ci-dessus."], grammar: [g.administrative-french], vocab: [w.soussigné, w.certifier, w.exactitude, w.ci-dessus] }
      - { es: "Vous trouverez les documents ci-joints.", en: "Please find the documents attached.", altEs: ["Vous trouverez ci-joint les documents.", "Veuillez trouver les documents ci-joints."], grammar: [g.administrative-french], vocab: [w.document, w.ci-joint], error: { wrong: "Vous trouverez les documents ci-joint.", explain: "After the noun, ci-joint agrees: les documents ci-joints (but ci-joint les documents, at the front, is invariable).", grammar: g.administrative-french } }
      - { es: "Remplissez le formulaire ci-dessous en lettres capitales.", en: "Fill in the form below in capital letters.", altEs: ["Veuillez remplir le formulaire ci-dessous en lettres capitales.", "Complétez le formulaire ci-dessous en lettres capitales."], altEn: ["Complete the form below in block capitals."], grammar: [g.administrative-french, g.imperative], vocab: [w.formulaire, w.ci-dessous] }
      - { es: "Le dépôt des candidatures se fait en ligne ; aucun dossier papier ne sera accepté.", en: "Applications are submitted online; no paper files will be accepted.", altEs: ["Le dépôt des candidatures se fait en ligne et aucun dossier papier ne sera accepté."], grammar: [g.administrative-french, g.pronominal-passive], vocab: [w.dépôt, w.candidature] }
      - { es: "Les pièces justificatives doivent être déposées au secrétariat au plus tard le 30 juin.", en: "Supporting documents must be submitted to the office no later than 30 June.", altEs: ["Les pièces justificatives sont à déposer au secrétariat au plus tard le 30 juin."], grammar: [g.administrative-french, g.passive-voice], vocab: [w.pièce-justificative, w.déposer] }
      - { es: "Nous accusons réception de votre demande et vous en remercions.", en: "We acknowledge receipt of your request and thank you for it.", altEs: ["Nous accusons bonne réception de votre demande et vous en remercions."], grammar: [g.administrative-french], vocab: [w.accusé-de-réception] }
      - { es: "Envoyez le contrat en recommandé avec accusé de réception.", en: "Send the contract by recorded delivery with acknowledgement of receipt.", altEs: ["Envoyez le contrat en lettre recommandée avec accusé de réception."], altEn: ["Send the contract by registered post with proof of delivery."], grammar: [g.administrative-french, g.imperative], vocab: [w.accusé-de-réception] }
      - { es: "Chaque page doit porter le paraphe du signataire et le cachet de l'établissement.", en: "Each page must bear the signatory's initials and the institution's stamp.", altEs: ["Chaque page doit comporter le paraphe du signataire et le cachet de l'établissement."], grammar: [g.administrative-french], vocab: [w.paraphe, w.signataire, w.cachet] }
      - { es: "Votre inscription ne sera validée qu'à réception du paiement.", en: "Your registration will only be confirmed once payment is received.", altEs: ["Votre inscription sera validée uniquement à réception du paiement."], grammar: [g.administrative-french, g.ni-ni-aucun], vocab: [w.valider] }
      - { es: "À titre d'information, l'accès au sommet est gratuit pour les chercheurs invités.", en: "For information, access to the summit is free for visiting researchers.", altEs: ["Pour information, l'accès au sommet est gratuit pour les chercheurs invités."], grammar: [g.administrative-french], vocab: [w.à-titre-de, w.sommet, w.chercheur] }
      - { es: "Au titre de votre bourse, vous bénéficiez d'un logement sur place.", en: "Under the terms of your grant, you are entitled to accommodation on site.", altEs: ["Dans le cadre de votre bourse, vous bénéficiez d'un logement sur place."], grammar: [g.administrative-french], vocab: [w.au-titre-de, w.bourse] }
      - { es: "Veuillez remettre votre badge à l'accueil à la fin de votre séjour.", en: "Please hand your badge in at reception at the end of your stay.", altEs: ["Merci de remettre votre badge à l'accueil à la fin de votre séjour."], grammar: [g.administrative-french], vocab: [w.remettre, w.séjour], transform: { instruction: "Turn it into a form instruction with a bare infinitive", answer: "Remettre le badge à l'accueil à la fin du séjour.", alt: ["Remettre son badge à l'accueil à la fin du séjour."], en: "Hand the badge in at reception at the end of the stay." } }
      - { es: "Merci de ne pas oublier de signer le formulaire avant l'échéance.", en: "Please don't forget to sign the form before the deadline.", altEs: ["Veuillez ne pas oublier de signer le formulaire avant l'échéance.", "N'oubliez pas de signer le formulaire avant l'échéance."], grammar: [g.administrative-french, g.infinitive-clauses], vocab: [w.échéance, w.formulaire] }
    exchanges:
      - q: { es: "Qu'est-ce que ça veut dire, « le cas échéant » ?", en: "What does 'le cas échéant' mean?" }
        a: { es: "« Si c'est votre cas » : par exemple, si vous avez déménagé, vous joignez un justificatif.", en: "'If that applies to you': for example, if you've moved, you attach proof." }
        alt: ["Ça veut dire « si nécessaire ».", "« Si besoin », en langage courant."]
        grammar: [g.administrative-french]
        vocab: [w.le-cas-échéant, w.justificatif]
      - q: { es: "Bonjour, je viens déposer mon dossier pour le séjour au pic du Midi.", en: "Hello, I've come to hand in my file for the stay at the Pic du Midi." }
        a: { es: "Très bien. Vous avez toutes les pièces justificatives et le formulaire signé ?", en: "Very good. Do you have all the supporting documents and the signed form?" }
        alt: ["Merci, je vous remets un accusé de réception.", "Il manque le justificatif de domicile, je crains."]
        grammar: [g.administrative-french]
        vocab: [w.déposer, w.pièce-justificative, w.formulaire]
      - q: { es: "À partir de quand le nouveau tarif est-il applicable ?", en: "From when does the new rate apply?" }
        a: { es: "À compter du 1er janvier, sous réserve de validation par le conseil.", en: "As from 1 January, subject to approval by the board." }
        alt: ["Dès le mois prochain.", "À compter du 1er janvier."]
        grammar: [g.administrative-french]
        vocab: [w.tarif, w.à-compter-de, w.sous-réserve-de]
      - q: { es: "On a bien reçu ma candidature ?", en: "Did they get my application?" }
        a: { es: "Oui, regarde : ils t'ont envoyé un accusé de réception ce matin.", en: "Yes, look: they sent you an acknowledgement of receipt this morning." }
        alt: ["Oui, le dépôt a été validé.", "Je ne sais pas, appelle le secrétariat."]
        grammar: [g.administrative-french]
        vocab: [w.accusé-de-réception, w.valider]
      - q: { es: "Où est-ce que je signe ?", en: "Where do I sign?" }
        a: { es: "En bas de la page, sous la mention « Je soussigné(e) », et paraphez chaque page.", en: "At the bottom of the page, under 'I, the undersigned', and initial each page." }
        alt: ["Ici, à côté du cachet.", "En bas, après « lu et approuvé »."]
        grammar: [g.administrative-french]
        vocab: [w.soussigné, w.paraphe]
    texts:
      - title: "Extrait d'un formulaire"
        es: ["Compléter toutes les rubriques en lettres capitales.", "Joindre, le cas échéant, une attestation de l'employeur.", "Tout dossier incomplet sera retourné à l'expéditeur."]
        en: ["Complete every section in capital letters.", "Attach, where applicable, a certificate from your employer.", "Any incomplete file will be returned to the sender."]
        grammar: [g.administrative-french, g.infinitive-clauses]
        vocab: [w.compléter, w.le-cas-échéant, w.attestation, w.expéditeur]
      - title: "Accusé de réception"
        es: ["Madame, nous accusons réception de votre dossier.", "Celui-ci sera examiné sous réserve qu'il soit complet.", "Une réponse vous parviendra dans un délai de six semaines."]
        en: ["Madam, we acknowledge receipt of your file.", "It will be examined provided that it is complete.", "You will receive a reply within six weeks."]
        grammar: [g.administrative-french]
        vocab: [w.parvenir, w.sous-réserve-de]
    spicy:
      - { es: "Veuillez me faire parvenir votre numéro de téléphone dûment complété avant vendredi.", en: "Please send me your duly completed phone number before Friday.", altEs: ["Veuillez me faire parvenir votre numéro de téléphone, dûment complété, avant vendredi."], grammar: [g.administrative-french], vocab: [w.parvenir, w.dûment] }
      - { es: "Je soussigné certifie l'exactitude de ce compliment : vous êtes ravissante.", en: "I, the undersigned, certify the accuracy of this compliment: you are lovely.", altEs: ["Je soussignée certifie l'exactitude de ce compliment : vous êtes ravissant."], grammar: [g.administrative-french], vocab: [w.soussigné, w.certifier, w.exactitude] }
      - { es: "Le cas échéant, joignez un sourire à votre réponse.", en: "Where applicable, attach a smile to your reply.", altEs: ["Joignez, le cas échéant, un sourire à votre réponse."], grammar: [g.administrative-french], vocab: [w.le-cas-échéant, w.joindre] }
      - { es: "Ce rendez-vous est accordé sous réserve que vous arriviez à l'heure, cette fois.", en: "This date is granted on condition that you arrive on time, this time.", altEs: ["Ce rendez-vous vous est accordé sous réserve que vous arriviez à l'heure, cette fois."], grammar: [g.administrative-french, g.subjonctif-conjonctions], vocab: [w.sous-réserve-de] }
      - { es: "Votre baiser a bien été reçu ; nous vous en accusons réception avec plaisir.", en: "Your kiss has been received; we are pleased to acknowledge receipt of it.", altEs: ["Votre baiser a bien été reçu et nous vous en accusons réception avec plaisir."], grammar: [g.administrative-french, g.passive-voice], vocab: [w.accusé-de-réception] }
  - id: c1.u06.l3
    title: Il est rappelé aux visiteurs que…
    teach: [g.impersonal-passive-formal]
    tip: "Formal notices hide the person: il est rappelé que (please note), il a été décidé de (it has been decided to), il convient de (it is advisable to), il importe que + subjonctif, il s'avère que (it turns out that), il ressort de… que (it emerges from… that)."
    vocab: [w.en-vigueur, w.vigueur, w.s-appliquer, w.rappeler, w.nuitée, w.ressortir, w.il-ressort-que, w.étude, w.lumineux, w.s-avérer, w.réserve, w.nocturne, w.diurne, w.astre, w.galaxie, w.comète, w.éclipse, w.constellation, w.étoile-filante, w.voie-lactée, w.conformément-à, w.en-application-de, w.en-vertu-de, w.prolonger]
    sentences:
      - { es: "Il est rappelé aux visiteurs que l'éclairage est interdit sur la terrasse d'observation.", en: "Visitors are reminded that lights are forbidden on the observation terrace.", altEs: ["Il est rappelé aux visiteurs que toute lumière est interdite sur la terrasse d'observation."], altEn: ["Visitors are reminded that lighting is not allowed on the observation terrace."], grammar: [g.impersonal-passive-formal], vocab: [w.rappeler, w.observation], transform: { instruction: "Say it to a group of friends, plainly", answer: "N'oubliez pas : pas de lumière sur la terrasse !", alt: ["Attention, pas de lumière sur la terrasse.", "On n'allume pas de lumière sur la terrasse."], en: "Don't forget: no lights on the terrace!" } }
      - { es: "Il a été décidé de limiter le nombre de nuitées au sommet.", en: "It has been decided to limit the number of overnight stays at the summit.", altEs: ["Il a été décidé que le nombre de nuitées au sommet serait limité."], grammar: [g.impersonal-passive-formal, g.passive-voice], vocab: [w.nuitée, w.sommet], transform: { instruction: "Rewrite with a named subject: 'the management'", answer: "La direction a décidé de limiter le nombre de nuitées au sommet.", alt: ["La direction a décidé que le nombre de nuitées au sommet serait limité."], en: "The management has decided to limit the number of overnight stays at the summit." } }
      - { es: "Il ressort de cette étude que la pollution lumineuse a diminué dans la vallée.", en: "This study shows that light pollution has decreased in the valley.", altEs: ["Il ressort de cette étude que la pollution lumineuse a baissé dans la vallée."], altEn: ["It emerges from this study that light pollution has fallen in the valley."], grammar: [g.impersonal-passive-formal], vocab: [w.il-ressort-que, w.étude, w.lumineux] }
      - { es: "Il convient de réserver le téléphérique plusieurs semaines à l'avance.", en: "It is advisable to book the cable car several weeks in advance.", altEs: ["Il est conseillé de réserver le téléphérique plusieurs semaines à l'avance."], grammar: [g.impersonal-passive-formal], vocab: [w.convenir, w.téléphérique] }
      - { es: "Il importe que chacun puisse profiter de l'obscurité du site après 22 heures.", en: "It is important that everyone can enjoy the darkness of the site after 10 p.m.", altEs: ["Il importe que chacun puisse profiter de l'obscurité du site après vingt-deux heures."], grammar: [g.impersonal-passive-formal, g.subjonctif-necessite], vocab: [w.importer, w.obscurité], error: { wrong: "Il importe que chacun peut profiter de l'obscurité du site après 22 heures.", explain: "Il importe que takes the subjonctif: que chacun puisse, not peut.", grammar: g.impersonal-passive-formal } }
      - { es: "Il s'avère que le ciel est beaucoup plus pur au sommet que dans la vallée.", en: "It turns out that the sky is much clearer at the summit than in the valley.", altEs: ["Il s'avère que le ciel est bien plus pur au sommet que dans la vallée."], grammar: [g.impersonal-passive-formal, g.comparatives], vocab: [w.s-avérer] }
      - { es: "Il est demandé de ne pas utiliser de flash pendant les observations nocturnes.", en: "You are asked not to use a flash during night observations.", altEs: ["Il est demandé de ne pas utiliser le flash pendant les observations nocturnes.", "Prière de ne pas utiliser de flash pendant les observations nocturnes."], grammar: [g.impersonal-passive-formal, g.infinitive-clauses], vocab: [w.nocturne], error: { wrong: "Il est demandé de n'utiliser pas de flash pendant les observations nocturnes.", explain: "With an infinitive, both parts of the negation come before it: de ne pas utiliser.", grammar: g.infinitive-clauses } }
      - { es: "Le règlement en vigueur s'applique à tous les visiteurs, y compris les chercheurs.", en: "The regulations in force apply to all visitors, including researchers.", altEs: ["Le règlement en vigueur est applicable à tous les visiteurs, y compris aux chercheurs."], grammar: [g.impersonal-passive-formal], vocab: [w.en-vigueur, w.s-appliquer, w.règlement] }
      - { es: "Conformément à l'arrêté préfectoral, l'éclairage public est éteint à partir de minuit.", en: "In accordance with the prefectoral order, public lighting is switched off from midnight.", altEs: ["Conformément à l'arrêté préfectoral, l'éclairage public est coupé à partir de minuit."], grammar: [g.impersonal-passive-formal], vocab: [w.conformément-à, w.éteint] }
      - { es: "En vertu de ce label, la réserve de ciel étoilé est protégée de la pollution lumineuse.", en: "By virtue of this label, the dark-sky reserve is protected from light pollution.", altEs: ["En vertu de ce label, la réserve de ciel étoilé est protégée contre la pollution lumineuse."], grammar: [g.impersonal-passive-formal, g.passive-voice], vocab: [w.en-vertu-de, w.réserve, w.lumineux], note: "The Pic du Midi dark-sky reserve received the international label in 2013." }
      - { es: "En application de la loi, les communes voisines réduisent leur éclairage nocturne.", en: "Pursuant to the law, the neighbouring towns reduce their night-time lighting.", altEs: ["En application de la loi, les communes voisines diminuent leur éclairage nocturne."], grammar: [g.impersonal-passive-formal], vocab: [w.en-application-de, w.nocturne] }
      - { es: "Par une nuit claire, on distingue la Voie lactée et des milliers d'astres.", en: "On a clear night you can make out the Milky Way and thousands of stars.", altEs: ["Par nuit claire, on distingue la Voie lactée et des milliers d'astres."], grammar: [g.on-nous], vocab: [w.voie-lactée, w.astre] }
      - { es: "Il est à noter que l'éclipse ne sera visible qu'au lever du soleil.", en: "It should be noted that the eclipse will only be visible at sunrise.", altEs: ["Il est à noter que l'éclipse sera visible uniquement au lever du soleil."], grammar: [g.impersonal-passive-formal], vocab: [w.éclipse] }
      - { es: "Il appartient à chaque visiteur de vérifier la météo avant de monter.", en: "It is each visitor's responsibility to check the weather before going up.", altEs: ["C'est à chaque visiteur de vérifier la météo avant de monter."], grammar: [g.impersonal-passive-formal], vocab: [w.appartenir] }
      - { es: "Tu as vu cette étoile filante au-dessus de la constellation d'Orion ?", en: "Did you see that shooting star above the constellation of Orion?", altEs: ["Tu as vu l'étoile filante au-dessus de la constellation d'Orion ?", "As-tu vu cette étoile filante au-dessus de la constellation d'Orion ?"], grammar: [g.passe-compose-avoir], vocab: [w.étoile-filante, w.constellation] }
      - { es: "Il ne s'agit pas d'une comète mais d'une galaxie très lointaine.", en: "It isn't a comet but a very distant galaxy.", altEs: ["Ce n'est pas une comète, c'est une galaxie très lointaine."], grammar: [g.impersonal-constructions], vocab: [w.comète, w.galaxie] }
    exchanges:
      - q: { es: "Pourquoi il n'y a pas de lumière sur la terrasse ?", en: "Why is there no light on the terrace?" }
        a: { es: "Il est interdit d'allumer quoi que ce soit : les télescopes ont besoin d'une obscurité totale.", en: "It's forbidden to switch anything on: the telescopes need total darkness." }
        alt: ["C'est le règlement : la moindre lampe gêne les observations.", "Il est demandé de rester dans le noir pour les astronomes."]
        grammar: [g.impersonal-passive-formal]
        vocab: [w.obscurité]
      - q: { es: "Qu'est-ce que dit le rapport sur la pollution lumineuse ?", en: "What does the report say about light pollution?" }
        a: { es: "Il en ressort que le ciel de la vallée est plus sombre qu'il y a dix ans.", en: "It shows that the valley's sky is darker than ten years ago." }
        alt: ["Il ressort de l'étude que la situation s'est améliorée.", "Qu'elle a nettement diminué."]
        grammar: [g.impersonal-passive-formal]
        vocab: [w.il-ressort-que, w.lumineux]
      - q: { es: "On peut dormir au sommet ?", en: "Can you sleep at the summit?" }
        a: { es: "Oui, mais il a été décidé de limiter les nuitées : il convient de réserver tôt.", en: "Yes, but it's been decided to limit overnight stays: it's best to book early." }
        alt: ["Oui, quelques nuitées par semaine seulement.", "Oui, il convient de réserver longtemps à l'avance."]
        grammar: [g.impersonal-passive-formal]
        vocab: [w.nuitée]
      - q: { es: "Cette tache floue, là, c'est une comète ?", en: "That blurry patch there, is it a comet?" }
        a: { es: "Non, il s'avère que c'est la galaxie d'Andromède.", en: "No, it turns out to be the Andromeda galaxy." }
        alt: ["Non, c'est une galaxie.", "Je crois que c'est une nébuleuse, pas une comète."]
        grammar: [g.impersonal-passive-formal]
        vocab: [w.s-avérer, w.galaxie, w.comète]
      - q: { es: "Le nouveau règlement s'applique dès cet été ?", en: "Do the new rules apply from this summer?" }
        a: { es: "Oui, il est en vigueur depuis le 1er juin.", en: "Yes, they've been in force since 1 June." }
        alt: ["Oui, conformément à la décision du conseil.", "Non, à compter de l'année prochaine."]
        grammar: [g.impersonal-passive-formal]
        vocab: [w.en-vigueur, w.s-appliquer]
    texts:
      - title: "Panneau à l'entrée de la terrasse"
        es: ["Il est rappelé aux visiteurs que la terrasse est fermée la nuit par grand vent.", "Il est demandé de ne pas utiliser de lampe blanche.", "Il appartient à chacun de respecter le silence."]
        en: ["Visitors are reminded that the terrace is closed at night in high winds.", "You are asked not to use a white torch.", "Everyone is responsible for respecting the silence."]
        grammar: [g.impersonal-passive-formal]
        vocab: [w.rappeler, w.appartenir]
      - title: "Communiqué de la réserve"
        es: ["Il ressort des dernières mesures que le ciel reste exceptionnellement noir.", "Il a donc été décidé de prolonger les soirées d'observation.", "Les dates seront publiées sur le site de la réserve."]
        en: ["The latest measurements show that the sky remains exceptionally dark.", "It has therefore been decided to extend the observation evenings.", "The dates will be published on the reserve's website."]
        grammar: [g.impersonal-passive-formal, g.passive-voice]
        vocab: [w.il-ressort-que, w.réserve, w.observation]
    spicy:
      - { es: "Il est rappelé aux visiteurs que s'embrasser sous la Voie lactée n'est pas interdit.", en: "Visitors are reminded that kissing under the Milky Way is not forbidden.", altEs: ["Il est rappelé aux visiteurs qu'il n'est pas interdit de s'embrasser sous la Voie lactée."], grammar: [g.impersonal-passive-formal], vocab: [w.rappeler, w.voie-lactée] }
      - { es: "Il s'avère que tes yeux sont plus lumineux que toutes les étoiles du pic du Midi.", en: "It turns out your eyes are brighter than all the stars on the Pic du Midi.", altEs: ["Il s'avère que vos yeux sont plus lumineux que toutes les étoiles du pic du Midi."], grammar: [g.impersonal-passive-formal, g.comparatives], vocab: [w.s-avérer, w.lumineux] }
      - { es: "Il a été décidé, à l'unanimité de nous deux, de prolonger la nuitée.", en: "It has been decided, unanimously by the two of us, to extend the overnight stay.", altEs: ["Il a été décidé à l'unanimité de nous deux de prolonger la nuitée."], grammar: [g.impersonal-passive-formal], vocab: [w.nuitée] }
      - { es: "Il convient de ne pas regarder les étoiles filantes quand on a quelqu'un d'aussi charmant à côté de soi.", en: "One should not watch shooting stars when there's someone so charming beside you.", altEs: ["Il convient de ne pas regarder les étoiles filantes quand on a quelqu'un de si charmant à côté de soi."], grammar: [g.impersonal-passive-formal, g.infinitive-clauses], vocab: [w.étoile-filante] }
      - { es: "Il ressort de mes observations nocturnes que vous ronflez, mais avec élégance.", en: "My nocturnal observations show that you snore, but elegantly.", altEs: ["Il ressort de mes observations nocturnes que tu ronfles, mais avec élégance."], grammar: [g.impersonal-passive-formal], vocab: [w.il-ressort-que, w.nocturne, w.observation] }
  - id: c1.u06.l4
    title: Les joies de la bureaucratie
    teach: [g.administrative-french, g.formal-letter]
    tip: "Formal complaints and requests combine the letter formulas with administrative language: Je me permets de contester…, Conformément à…, Je vous saurais gré de bien vouloir… and a precise objet."
    vocab: [w.administration, w.administratif, w.fonctionnaire, w.démarche, w.formalité, w.préfecture, w.titre-de-séjour, w.délivrer, w.attestation, w.certificat, w.bureaucratie, w.modalité, w.procédure, w.requête, w.demandeur, w.bénéficiaire, w.allocation, w.indemnité, w.cotisation, w.prélèvement, w.versement, w.virement, w.relevé, w.échéancier, w.quittance, w.contribuable, w.déclaration-d-impôts, w.service-public, w.usager, w.savoir-gré, w.effectuer, w.référence, w.fournir, w.humeur, w.changement, w.remboursement, w.défaut]
    sentences:
      - { es: "La préfecture m'a délivré mon titre de séjour après quatre mois d'attente.", en: "The prefecture issued my residence permit after four months of waiting.", altEs: ["La préfecture m'a enfin délivré mon titre de séjour après quatre mois d'attente."], grammar: [g.administrative-french, g.passe-compose-avoir], vocab: [w.préfecture, w.délivrer, w.titre-de-séjour], transform: { instruction: "Make it passive, starting with Mon titre de séjour", answer: "Mon titre de séjour m'a été délivré par la préfecture après quatre mois d'attente.", alt: ["Mon titre de séjour m'a été délivré après quatre mois d'attente par la préfecture."], en: "My residence permit was issued to me by the prefecture after four months of waiting." } }
      - { es: "Pour toute démarche administrative, munissez-vous d'une pièce d'identité.", en: "For any administrative procedure, bring an identity document.", altEs: ["Pour toute démarche administrative, veuillez vous munir d'une pièce d'identité."], grammar: [g.administrative-french, g.imperative], vocab: [w.démarche, w.administratif] }
      - { es: "Ce n'est qu'une formalité, mais sans ce certificat, votre demande ne sera pas examinée.", en: "It's only a formality, but without this certificate your request won't be examined.", altEs: ["C'est juste une formalité, mais sans ce certificat, votre demande ne sera pas examinée."], grammar: [g.administrative-french, g.passive-voice], vocab: [w.formalité, w.certificat] }
      - { es: "Je me permets de contester le prélèvement effectué le 5 avril sur mon compte.", en: "I wish to dispute the direct debit taken from my account on 5 April.", altEs: ["Je me permets de contester le prélèvement du 5 avril sur mon compte."], grammar: [g.formal-letter], vocab: [w.prélèvement, w.contester] }
      - { es: "Je vous saurais gré de bien vouloir me rembourser dans les meilleurs délais.", en: "I would be obliged if you would refund me as soon as possible.", altEs: ["Je vous serais reconnaissant de bien vouloir me rembourser dans les meilleurs délais.", "Je vous saurais gré de bien vouloir me rembourser au plus vite."], grammar: [g.formal-letter, g.conditional-politeness], vocab: [w.rembourser], transform: { instruction: "Make it a plain request to a friend", answer: "Tu peux me rembourser vite, s'il te plaît ?", alt: ["Tu me rembourses vite, s'il te plaît ?", "Tu pourrais me rembourser rapidement ?"], en: "Can you pay me back quickly, please?" } }
      - { es: "Le versement de l'allocation est suspendu tant que le dossier reste incomplet.", en: "Payment of the benefit is suspended as long as the file remains incomplete.", altEs: ["Le versement de l'allocation reste suspendu tant que le dossier est incomplet."], grammar: [g.administrative-french], vocab: [w.versement, w.allocation] }
      - { es: "Les bénéficiaires reçoivent une indemnité de déplacement au titre de leur mission.", en: "Beneficiaries receive a travel allowance for their assignment.", altEs: ["Les bénéficiaires perçoivent une indemnité de déplacement au titre de leur mission."], grammar: [g.administrative-french], vocab: [w.bénéficiaire, w.indemnité, w.au-titre-de] }
      - { es: "Joignez un relevé d'identité bancaire pour que nous puissions effectuer le virement.", en: "Enclose your bank details so that we can make the transfer.", altEs: ["Veuillez joindre un relevé d'identité bancaire afin que nous puissions effectuer le virement."], grammar: [g.administrative-french, g.subjonctif-conjonctions], vocab: [w.relevé, w.virement], note: "Le RIB (relevé d'identité bancaire) is the slip with your bank details that French administrations ask for." }
      - { es: "Les contribuables doivent remplir leur déclaration d'impôts en ligne avant fin mai.", en: "Taxpayers must fill in their tax return online before the end of May.", altEs: ["Les contribuables doivent faire leur déclaration d'impôts en ligne avant fin mai."], grammar: [g.administrative-french], vocab: [w.contribuable, w.déclaration-d-impôts] }
      - { es: "Votre cotisation annuelle sera prélevée en trois fois, selon l'échéancier ci-joint.", en: "Your annual subscription will be debited in three instalments, according to the attached schedule.", altEs: ["Votre cotisation annuelle sera prélevée en trois fois selon l'échéancier ci-joint."], grammar: [g.administrative-french, g.passive-voice], vocab: [w.cotisation, w.échéancier, w.ci-joint] }
      - { es: "Le propriétaire doit remettre une quittance de loyer au locataire qui la demande.", en: "The landlord must give a rent receipt to any tenant who asks for one.", altEs: ["Le propriétaire est tenu de remettre une quittance de loyer au locataire qui la demande."], grammar: [g.administrative-french], vocab: [w.quittance, w.remettre] }
      - { es: "Les modalités de la procédure sont précisées dans le règlement ci-dessous.", en: "The terms of the procedure are set out in the regulations below.", altEs: ["Les modalités de la procédure figurent dans le règlement ci-dessous."], grammar: [g.administrative-french], vocab: [w.modalité, w.procédure, w.ci-dessous] }
      - { es: "Le demandeur doit adresser sa requête au service compétent, et non au fonctionnaire de l'accueil.", en: "The applicant must address the request to the relevant department, not to the civil servant at reception.", altEs: ["Le demandeur doit adresser sa requête au service compétent et non au fonctionnaire de l'accueil."], grammar: [g.administrative-french], vocab: [w.demandeur, w.requête, w.fonctionnaire] }
      - { es: "La bureaucratie française est célèbre, mais les usagers du service public savent aussi s'en moquer.", en: "French bureaucracy is famous, but public service users also know how to laugh at it.", altEs: ["La bureaucratie française est réputée, mais les usagers du service public savent aussi en rire."], grammar: [g.pronoun-en], vocab: [w.bureaucratie, w.usager, w.service-public] }
      - { es: "L'administration vous demande une attestation sur l'honneur.", en: "The administration is asking you for a sworn statement.", altEs: ["L'administration vous réclame une attestation sur l'honneur."], grammar: [g.administrative-french], vocab: [w.administration, w.attestation] }
      - { es: "Voici l'attestation que vous aviez perdue ; elle était restée au guichet.", en: "Here is the certificate you had lost; it had been left at the counter.", grammar: [g.administrative-french, g.relative-qui-que], vocab: [w.attestation], error: { wrong: "Voici l'attestation que vous aviez perdu ; elle était restée au guichet.", explain: "The past participle with avoir agrees with a preceding direct object: que (= l'attestation, feminine) → perdue.", grammar: g.pc-object-agreement } }
    exchanges:
      - q: { es: "Tu as enfin reçu ton titre de séjour ?", en: "Did you finally get your residence permit?" }
        a: { es: "Oui ! Après trois rendez-vous à la préfecture et une attestation perdue.", en: "Yes! After three appointments at the prefecture and a lost certificate." }
        alt: ["Pas encore, il manque une pièce justificative.", "Oui, la préfecture me l'a délivré hier."]
        grammar: [g.administrative-french]
        vocab: [w.titre-de-séjour, w.préfecture, w.attestation]
      - q: { es: "Comment je conteste ce prélèvement ?", en: "How do I dispute this direct debit?" }
        a: { es: "Écris une lettre recommandée : objet, référence du contrat, et « je vous saurais gré de bien vouloir… ».", en: "Write a recorded letter: subject line, contract reference, and 'I would be obliged if you would…'." }
        alt: ["Appelle ta banque, puis confirme par écrit.", "Envoie une réclamation avec ton relevé de compte."]
        grammar: [g.formal-letter]
        vocab: [w.prélèvement]
      - q: { es: "C'est quoi, exactement, un usager ?", en: "What exactly is an 'usager'?" }
        a: { es: "Quelqu'un qui utilise un service public : la poste, les transports, la préfecture.", en: "Someone who uses a public service: the post office, transport, the prefecture." }
        alt: ["L'utilisateur d'un service public.", "Toi, quand tu prends le train !"]
        grammar: [g.administrative-french]
        vocab: [w.usager, w.service-public]
      - q: { es: "Quand est-ce que l'indemnité sera versée ?", en: "When will the allowance be paid?" }
        a: { es: "Le virement sera effectué à la fin du mois, sous réserve que le dossier soit complet.", en: "The transfer will be made at the end of the month, provided the file is complete." }
        alt: ["À la fin du mois, par virement.", "Dès réception de votre relevé d'identité bancaire."]
        grammar: [g.administrative-french]
        vocab: [w.indemnité, w.virement]
      - q: { es: "Encore une formalité ? Je n'en peux plus de la bureaucratie !", en: "Another formality? I can't take any more bureaucracy!" }
        a: { es: "Courage, c'est la dernière démarche ; après, tu n'auras plus rien à remplir.", en: "Hang in there, it's the last step; after that you won't have anything else to fill in." }
        alt: ["Patience, ce n'est qu'un formulaire de plus.", "Bienvenue en France !"]
        grammar: [g.administrative-french]
        vocab: [w.formalité, w.bureaucratie, w.démarche]
    texts:
      - title: "Lettre de réclamation"
        es: ["Objet : contestation d'un prélèvement.", "Madame, Monsieur, je constate sur mon relevé un prélèvement de 89 euros que je n'ai pas autorisé.", "Je vous saurais gré de bien vouloir procéder à son remboursement.", "Je vous prie d'agréer, Madame, Monsieur, mes salutations distinguées."]
        en: ["Subject: disputed direct debit.", "Dear Sir or Madam, I note on my statement a direct debit of 89 euros that I did not authorise.", "I would be obliged if you would refund it.", "Yours faithfully."]
        grammar: [g.formal-letter, g.administrative-french]
        vocab: [w.prélèvement, w.relevé]
      - title: "Note du service des bourses"
        es: ["Les bénéficiaires sont priés de déclarer tout changement de domicile.", "À défaut, le versement de l'allocation pourra être suspendu."]
        en: ["Beneficiaries are asked to declare any change of address.", "Failing that, payment of the allowance may be suspended."]
        grammar: [g.administrative-french]
        vocab: [w.bénéficiaire, w.versement, w.allocation, w.domicile]
    spicy:
      - { es: "Mon cœur est un service public : ouvert à tous les usagers, sauf le dimanche.", en: "My heart is a public service: open to all users, except on Sundays.", altEs: ["Mon cœur est un service public, ouvert à tous les usagers sauf le dimanche."], grammar: [g.administrative-french], vocab: [w.service-public, w.usager] }
      - { es: "Pour obtenir un deuxième rendez-vous, veuillez fournir une attestation de bonne humeur.", en: "To get a second date, please provide a certificate of good humour.", altEs: ["Pour obtenir un deuxième rendez-vous, merci de fournir une attestation de bonne humeur."], grammar: [g.administrative-french], vocab: [w.attestation] }
      - { es: "Je vous saurais gré de bien vouloir effectuer un virement de baisers sur mon compte.", en: "I would be obliged if you would make a transfer of kisses to my account.", altEs: ["Je te saurais gré de bien vouloir effectuer un virement de baisers sur mon compte."], grammar: [g.formal-letter], vocab: [w.virement] }
      - { es: "Il m'a demandé mon numéro comme un fonctionnaire de la préfecture : « Pièce justificative, s'il vous plaît. »", en: "He asked for my number like a prefecture official: 'Supporting document, please.'", altEs: ["Il m'a demandé mon numéro comme un fonctionnaire de préfecture : « Pièce justificative, s'il vous plaît. »"], grammar: [g.administrative-french], vocab: [w.fonctionnaire, w.préfecture] }
      - { es: "Ce n'est qu'une formalité, mais j'aimerais quand même un baiser dûment signé.", en: "It's only a formality, but I'd still like a duly signed kiss.", altEs: ["Ce n'est qu'une formalité, mais je voudrais quand même un baiser dûment signé."], grammar: [g.administrative-french], vocab: [w.formalité, w.dûment] }
dialogues:
  - id: c1.u06.d1
    title: Un dossier presque complet
    context: Inès, a PhD student, calls the Pic du Midi observatory office about her application for an observation stay.
    lines:
      - { speaker: Secrétaire, es: "Observatoire du pic du Midi, secrétariat scientifique, bonjour.", en: "Pic du Midi observatory, scientific office, good morning." }
      - { speaker: Inès, es: "Bonjour Madame. Je vous appelle au sujet de ma demande de séjour d'observation, envoyée le 3 mai.", en: "Good morning. I'm calling about my request for an observation stay, sent on 3 May." }
      - { speaker: Secrétaire, es: "Je vois. Nous avons bien reçu votre dossier, mais il s'avère qu'il manque une pièce.", en: "I see. We did receive your file, but it turns out a document is missing." }
      - { speaker: Inès, es: "Ah bon ? J'avais pourtant joint mon CV, ma lettre de motivation et l'attestation de mon laboratoire.", en: "Really? I had attached my CV, my cover letter and the certificate from my lab, though." }
      - { speaker: Secrétaire, es: "C'est l'attestation d'assurance qui fait défaut. Conformément au règlement, elle est obligatoire pour monter au sommet.", en: "It's the insurance certificate that's missing. Under the regulations, it's compulsory to go up to the summit." }
      - { speaker: Inès, es: "Je comprends. Puis-je vous la faire parvenir par courriel ?", en: "I understand. May I send it to you by email?" }
      - { speaker: Secrétaire, es: "Tout à fait. Veuillez préciser votre nom et la référence du dossier dans l'objet.", en: "Certainly. Please give your name and the file reference in the subject line." }
      - { speaker: Inès, es: "Très bien. Et les nuitées au sommet sont-elles confirmées ?", en: "Very good. And are the nights at the summit confirmed?" }
      - { speaker: Secrétaire, es: "Sous réserve de la météo, oui. Il est rappelé aux chercheurs que le téléphérique ne monte pas par grand vent.", en: "Weather permitting, yes. Researchers are reminded that the cable car doesn't go up in high winds." }
      - { speaker: Inès, es: "Entendu. Je vous envoie l'attestation dès aujourd'hui. Merci beaucoup, Madame.", en: "Understood. I'll send you the certificate today. Thank you very much." }
      - { speaker: Secrétaire, es: "Je vous en prie. Dès réception, nous vous adresserons une confirmation écrite.", en: "You're welcome. As soon as we receive it, we'll send you a written confirmation." }
    questions:
      - { q: "Pourquoi le dossier d'Inès est-il incomplet ?", options: ["Il manque son curriculum vitae", "Il manque l'attestation d'assurance", "Sa lettre n'est pas signée", "Elle l'a envoyé trop tard"], answer: 1, explain: "« C'est l'attestation d'assurance qui fait défaut »: the insurance certificate is missing." }
      - { q: "Comment Inès va-t-elle envoyer la pièce manquante ?", options: ["Par la poste, en recommandé", "Elle va la déposer au sommet", "Par courriel", "Par téléphone"], answer: 2, explain: "« Puis-je vous la faire parvenir par courriel ? — Tout à fait. »" }
      - { q: "Que doit-elle indiquer dans l'objet du message ?", options: ["Son nom et la référence du dossier", "Les dates de son séjour", "Le nom de son laboratoire"], answer: 0, explain: "« Veuillez préciser votre nom et la référence du dossier dans l'objet. »" }
      - { q: "Les nuitées au sommet sont-elles garanties ?", options: ["Oui, sans condition", "Non, elles sont annulées", "Oui, sous réserve de la météo"], answer: 2, explain: "« Sous réserve de la météo, oui »: the cable car doesn't run in high winds." }
