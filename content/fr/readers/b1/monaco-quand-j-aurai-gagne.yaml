id: r.b1.monaco-quand-j-aurai-gagne
level: b1
title: Monaco, quand j'aurai gagné…
kind: text
intro: Sofiane, a 26-year-old mechanic from Nice, works in Monaco and has big plans. Notice the futur antérieur (quand j'aurai économisé, dès que j'aurai fini) for things that will be done before others.
allow: [sofiane, monte-carlo, monégasques, monégasque, ferrari, ok, centre]
paragraphs:
  - { es: "Tous les matins, à six heures et demie, je prends le train à Nice avec des milliers d'autres personnes. Vingt minutes plus tard, je descends à Monaco. Comme moi, la plupart des gens qui travaillent ici n'y habitent pas : ils viennent de France ou d'Italie. C'est normal, les logements sont si chers à Monaco qu'un petit studio coûte plus que mon salaire !", en: "Every morning at half past six, I take the train in Nice with thousands of other people. Twenty minutes later I get off in Monaco. Like me, most of the people who work here don't live here: they come from France or Italy. That's normal – housing is so expensive in Monaco that a tiny studio costs more than my salary!" }
  - { es: "Monaco est un pays minuscule : il fait à peu près deux kilomètres carrés. C'est le deuxième plus petit pays du monde, après le Vatican. On peut le traverser à pied en une heure. Pourtant, c'est un vrai pays, avec son prince, son drapeau rouge et blanc et sa petite armée. La famille Grimaldi y règne depuis 1297. Selon la tradition, le premier Grimaldi est entré dans la forteresse déguisé en moine, et il l'a prise par surprise. C'est pour ça qu'il y a des moines sur les armes de la famille !", en: "Monaco is a tiny country: it's roughly two square kilometres. It's the second-smallest country in the world, after the Vatican. You can cross it on foot in an hour. Yet it's a real country, with its prince, its red and white flag and its small army. The Grimaldi family has ruled here since 1297. According to tradition, the first Grimaldi entered the fortress disguised as a monk and took it by surprise. That's why there are monks on the family's coat of arms!" }
  - { es: "Je suis mécanicien dans un garage de voitures de luxe, près du port. Les clients arrivent en Ferrari et ils me laissent leurs clés comme si c'était une petite voiture de location. Au début, j'avais peur de les toucher. Maintenant, j'ai l'habitude. Mais mon vrai rêve, c'est la course automobile. Depuis que je suis petit, je regarde le Grand Prix de Monaco à la télévision avec mon père. La course existe depuis 1929 et elle a lieu dans les rues de la ville : les voitures passent devant le casino, dans le tunnel, sur le port, à plus de deux cent cinquante kilomètres à l'heure. Pendant une semaine, toute la ville se transforme en circuit.", en: "I'm a mechanic in a luxury car garage near the port. Customers arrive in Ferraris and leave me their keys as if it were a little hire car. At first I was afraid to touch them. Now I'm used to it. But my real dream is motor racing. Since I was little I've watched the Monaco Grand Prix on TV with my father. The race has existed since 1929 and it takes place in the streets of the city: the cars go past the casino, through the tunnel, along the port, at more than two hundred and fifty kilometres an hour. For a week the whole city turns into a racing circuit." }
  - { es: "J'ai un plan. D'abord, je vais suivre une formation en mécanique de course, le soir et le week-end. Quand j'aurai obtenu mon diplôme, j'enverrai ma candidature à toutes les équipes de course. D'ici deux ans, j'aurai économisé assez d'argent pour faire des stages en Angleterre ou en Italie, là où se trouvent la plupart des équipes. Dès que j'aurai trouvé une place, même petite, je quitterai le garage.", en: "I have a plan. First I'm going to take a training course in racing mechanics, in the evenings and at weekends. When I've got my diploma, I'll send my application to all the racing teams. Within two years I'll have saved enough money to do internships in England or Italy, where most of the teams are based. As soon as I've found a position, even a small one, I'll leave the garage." }
  - { es: "Mes amis se moquent un peu de moi. Ils me disent : « Quand tu seras devenu célèbre, tu ne nous parleras plus ! » Ma mère, elle, a peur que je sois déçu. Elle me répète que le monde de la course est très difficile et qu'il y a peu de places. Elle a raison. Mais j'aurai au moins essayé. Je ne veux pas avoir de regrets à cinquante ans.", en: "My friends tease me a bit. They say: 'When you've become famous, you won't talk to us anymore!' My mother is afraid I'll be disappointed. She keeps telling me that the racing world is very tough and that there are few positions. She's right. But at least I'll have tried. I don't want to have regrets at fifty." }
  - { es: "Le soir, quand je reprends le train pour Nice, je regarde la mer et les yachts dans le port. Je ne rêve pas d'avoir un yacht ni de jouer au casino. Je rêve d'être dans le garage d'une équipe, un dimanche de Grand Prix, quand la voiture rentrera de la course. Et ce jour-là, quand nous aurons gagné, je regarderai Monaco d'une autre façon.", en: "In the evening, when I take the train back to Nice, I look at the sea and the yachts in the port. I don't dream of owning a yacht or playing at the casino. I dream of being in a team's garage on a Grand Prix Sunday, when the car comes back in from the race. And on that day, when we've won, I'll look at Monaco in a different way." }
questions:
  - { q: "Pourquoi Sofiane n'habite-t-il pas à Monaco ?", options: ["Il n'aime pas la ville", "Les logements sont trop chers", "Il n'a pas le droit"], answer: 1, explain: "«Les logements sont si chers à Monaco qu'un petit studio coûte plus que mon salaire !»" }
  - { q: "Selon la tradition, comment le premier Grimaldi a-t-il pris la forteresse ?", options: ["Avec une grande armée", "Déguisé en moine", "En l'achetant"], answer: 1, explain: "«Le premier Grimaldi est entré dans la forteresse déguisé en moine.»" }
  - { q: "Où a lieu le Grand Prix de Monaco ?", options: ["Sur un circuit en dehors de la ville", "Dans les rues de la ville", "En Italie"], answer: 1, explain: "«Elle a lieu dans les rues de la ville» – past the casino, through the tunnel, along the port." }
  - { q: "Que fera Sofiane quand il aura obtenu son diplôme ?", options: ["Il quittera Monaco", "Il enverra sa candidature aux équipes de course", "Il achètera une Ferrari"], answer: 1, explain: "«Quand j'aurai obtenu mon diplôme, j'enverrai ma candidature à toutes les équipes de course.»" }
  - { q: "« D'ici deux ans, j'aurai économisé assez d'argent. » Quel temps est « j'aurai économisé » ?", options: ["Le futur simple", "Le futur antérieur", "Le conditionnel"], answer: 1, explain: "Futur antérieur (avoir in the future + past participle): an action completed before a point in the future." }
