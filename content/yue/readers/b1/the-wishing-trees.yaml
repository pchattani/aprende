id: r.b1.the-wishing-trees
level: b1
title: 林村許願樹
kind: text
intro: On a visit to the Lam Tsuen wishing trees, a grandmother tells her grandson a story from her own childhood - and explains why people no longer throw their wishes up into the old banyan.
allow: [林村, 阿明]
paragraphs:
  - { es: "年初三，阿明同嫲嫲去大埔林村。林村有兩棵好大嘅榕樹，香港人叫佢哋做「許願樹」。每年農曆新年，都有好多人嚟呢度許願。嫲嫲一邊行，一邊同阿明講：「我細個嗰陣，成日嚟呢度。等我講個故仔你聽啦。」", en: "On the third day of Chinese New Year, Ming went with his grandmother to Lam Tsuen in Tai Po. Lam Tsuen has two huge banyan trees, which Hongkongers call the \"wishing trees\". Every Chinese New Year lots of people come here to make wishes. As they walked, Grandma said to Ming: \"When I was little, I often came here. Let me tell you a story.\"" }
  - { es: "「從前，林村啲村民相信呢棵樹有神靈。新年嘅時候，大家會將自己嘅願望寫喺一張紅紙上面，叫做寶牒。寶牒用繩綁住一個橙，然後用力將佢拋上樹。如果寶牒掛到喺樹枝上面，就代表個願望會實現；如果跌返落嚟，就要再拋過。拋得越高，願望就越容易成真。」", en: "\"Once upon a time, the villagers of Lam Tsuen believed this tree had a spirit. At New Year, people would write their wishes on a piece of red paper called a wish placard. The placard was tied to an orange with string, and then thrown up into the tree as hard as you could. If the placard caught on a branch, it meant your wish would come true; if it fell back down, you had to throw it again. The higher you threw it, the more likely your wish would come true.\"" }
  - { es: "嫲嫲繼續講：「我八歲嗰年，我阿媽病咗好耐都未好。年初一，我一個人行咗成個鐘嚟到呢度，喺寶牒上面寫：『希望阿媽快啲好返。』我人細，力又唔夠，拋咗十幾次都拋唔上去。我喊到好大聲，旁邊有個阿伯見到，就話：『妹妹，我幫你。』」", en: "Grandma went on: \"The year I was eight, my mother had been ill for a long time and wasn't getting better. On New Year's Day I walked for a whole hour on my own to get here, and on my placard I wrote: 'I hope Mum gets better soon.' I was small and not strong enough, and I threw it more than ten times without getting it up. I was crying loudly, and an old man nearby saw me and said: 'Little girl, I'll help you.'\"" }
  - { es: "「個阿伯好高大，佢接過我個橙，一拋就拋到最高嗰條樹枝度。佢話：『掛得咁高，個神仙一定睇到。』跟住佢就走咗，我連多謝都未講。嗰年夏天，我阿媽真係好返。我成日諗，個阿伯究竟係邊個呢？」", en: "\"The old man was tall and strong. He took my orange and threw it right up to the highest branch in one go. He said: 'Hanging that high, the spirit will definitely see it.' Then he left, before I'd even said thank you. That summer, my mother really did get better. I've often wondered who that old man really was.\"" }
  - { es: "阿明好奇咁問：「咁點解而家冇人拋寶牒上樹嘅？」嫲嫲指住旁邊幾個木架：「因為後來嚟許願嘅人越嚟越多，棵樹負擔唔到。二零零五年新年，有一條大樹枝斷咗，跌落嚟整親咗幾個人。之後政府為咗保護棵樹同遊客，就唔再准人拋。而家大家將寶牒掛喺呢啲木架上面。」", en: "Ming asked curiously: \"So why does nobody throw placards up into the tree now?\" Grandma pointed at some wooden racks nearby: \"Because later more and more people came to make wishes, and the tree couldn't bear the weight. At New Year in 2005, a big branch broke off and fell, injuring several people. After that, to protect the tree and the visitors, the government stopped allowing people to throw. Now everyone hangs their placards on these wooden racks.\"" }
  - { es: "阿明有啲失望：「噉仲靈唔靈㗎？」嫲嫲笑住話：「許願最緊要係誠心，唔係拋得幾高。神仙睇嘅係你個心，唔係你嘅力。」", en: "Ming was a bit disappointed: \"So does it still work?\" Grandma laughed: \"What matters most in making a wish is sincerity, not how high you throw. The spirit looks at your heart, not your strength.\"" }
  - { es: "阿明諗咗一陣，買咗一張寶牒，喺上面寫：「希望嫲嫲身體健康，長命百歲。」佢將寶牒小心噉掛喺木架最高嗰度，然後轉頭問嫲嫲：「嫲嫲，你今年寫咗乜嘢？」嫲嫲眨吓眼：「秘密！講出嚟就唔靈㗎喇。」", en: "Ming thought for a moment, bought a placard and wrote on it: \"I hope Grandma stays healthy and lives to a hundred.\" He carefully hung it at the very top of the rack, then turned to ask Grandma: \"Grandma, what did you write this year?\" Grandma winked: \"It's a secret! If you say it out loud, it won't come true.\"" }
questions:
  - { q: "以前啲人點樣將寶牒掛上樹？", options: ["用梯爬上去", "綁住個橙拋上去", "請村民幫手"], answer: 1, explain: "寶牒用繩綁住一個橙，然後用力將佢拋上樹." }
  - { q: "嫲嫲八歲嗰年許咗乜嘢願？", options: ["希望阿媽快啲好返", "希望考試合格", "希望有新衫着"], answer: 0, explain: "希望阿媽快啲好返." }
  - { q: "邊個幫嫲嫲將寶牒拋上樹？", options: ["佢阿爸", "一個阿伯", "一個村民細路"], answer: 1, explain: "旁邊有個阿伯見到，就話：『妹妹，我幫你。』" }
  - { q: "點解而家唔准拋寶牒？", options: ["因為二零零五年有條樹枝斷咗，整親人", "因為村民唔鍾意", "因為橙太貴"], answer: 0, explain: "二零零五年新年，有一條大樹枝斷咗，跌落嚟整親咗幾個人." }
  - { q: "嫲嫲覺得許願最緊要係乜嘢？", options: ["拋得高", "誠心", "買最貴嘅寶牒"], answer: 1, explain: "許願最緊要係誠心，唔係拋得幾高." }
  - { q: "阿明喺寶牒上面寫咗乜嘢？", options: ["希望自己考試好", "希望嫲嫲身體健康，長命百歲", "秘密"], answer: 1, explain: "希望嫲嫲身體健康，長命百歲. It's Grandma who keeps her wish a secret." }
