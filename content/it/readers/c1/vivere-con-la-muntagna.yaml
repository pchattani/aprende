id: r.c1.vivere-con-la-muntagna
level: c1
title: Vivere con la Muntagna
kind: dialogue
intro: "An interview for a Sicilian radio programme with a volcanologist who has studied Etna for twenty-five years. Listen for the strategies of c1.u08 (hedging, ironic understatement, discourse particles such as mah, insomma, figuriamoci) and the academic register of c1.u06 when she explains the science."
allow: [etna, muntagna, catania, catanesi, catanese, marta, ferlito, bronte, nicolosi, ingv, giornalista]
paragraphs:
  - { es: "Giornalista: Dottoressa Ferlito, lei lavora all'Istituto Nazionale di Geofisica e Vulcanologia e studia l'Etna da venticinque anni. Prima domanda, la più semplice: ci si abitua mai a vivere sotto un vulcano attivo?", en: "Interviewer: Dr Ferlito, you work at the National Institute of Geophysics and Volcanology and have studied Etna for twenty-five years. First question, the simplest: do you ever get used to living under an active volcano?" }
  - { es: "Dottoressa Ferlito: Mah, dipende da che cosa intendiamo per «abituarsi». I catanesi lo chiamano «a Muntagna», la montagna per eccellenza, come se fosse un parente un po' difficile: lo rispettano, ne parlano ogni giorno, a volte ci litigano. Paura vera, però, ne hanno poca. E in parte hanno ragione.", en: "Dr Ferlito: Well, it depends on what we mean by 'getting used to it'. People in Catania call it 'a Muntagna', the mountain par excellence, as if it were a somewhat difficult relative: they respect it, they talk about it every day, sometimes they quarrel with it. Real fear, though, they have little of. And partly they're right." }
  - { es: "Giornalista: In che senso hanno ragione?", en: "Interviewer: In what sense are they right?" }
  - { es: "Dottoressa Ferlito: Nel senso che l'Etna è un vulcano generoso, per così dire. Le sue eruzioni sono quasi sempre effusive: la lava esce lentamente, scende lungo i fianchi e di solito si può prevedere dove andrà. È molto diverso dal Vesuvio, che è un vulcano esplosivo e che preoccupa di più gli esperti. Detto questo, non vorrei dare l'impressione che l'Etna sia innocuo. Nel 1669 la lava arrivò fino al mare e distrusse una parte di Catania. E ancora nel 1928 un paese intero, Mascali, fu cancellato in pochi giorni.", en: "Dr Ferlito: In the sense that Etna is a generous volcano, so to speak. Its eruptions are almost always effusive: the lava comes out slowly, flows down the sides, and you can usually predict where it will go. It's very different from Vesuvius, which is an explosive volcano and worries the experts more. Having said that, I wouldn't want to give the impression that Etna is harmless. In 1669 the lava reached the sea and destroyed part of Catania. And as recently as 1928 a whole town, Mascali, was wiped out in a few days." }
  - { es: "Giornalista: Eppure la gente continua a costruire case sulle sue pendici.", en: "Interviewer: And yet people go on building houses on its slopes." }
  - { es: "Dottoressa Ferlito: Certo, e non da oggi. Il motivo è semplice: la terra vulcanica è fertilissima. Sull'Etna crescono vigneti, agrumi, i pistacchi di Bronte, che sono famosi in tutto il mondo. Chi ha un terreno qui difficilmente se ne va. Mio nonno diceva: «La Muntagna si prende, ma poi restituisce». Non è una frase scientifica, ovviamente, però descrive bene il rapporto che le persone hanno con il vulcano.", en: "Dr Ferlito: Of course, and not just recently. The reason is simple: volcanic soil is extremely fertile. On Etna there are vineyards, citrus fruit, Bronte pistachios, which are famous all over the world. Anyone who has land here is unlikely to leave. My grandfather used to say: 'The Mountain takes, but then it gives back.' It's not a scientific statement, obviously, but it describes well the relationship people have with the volcano." }
  - { es: "Giornalista: Come si controlla oggi un vulcano così attivo?", en: "Interviewer: How is such an active volcano monitored today?" }
  - { es: "Dottoressa Ferlito: Con una rete di strumenti che funziona ventiquattro ore su ventiquattro: sismografi, telecamere, sensori che misurano i gas e le deformazioni del suolo. Quando il magma sale, la montagna si «gonfia» di qualche centimetro, e noi lo vediamo. I dati arrivano alla nostra sala operativa di Catania, dove c'è sempre qualcuno di turno, anche a Natale. Insomma, l'Etna è probabilmente uno dei vulcani più studiati al mondo.", en: "Dr Ferlito: With a network of instruments that works twenty-four hours a day: seismographs, cameras, sensors that measure gases and ground deformation. When magma rises, the mountain 'swells' by a few centimetres, and we can see it. The data come to our operations room in Catania, where someone is always on duty, even at Christmas. In short, Etna is probably one of the most studied volcanoes in the world." }
  - { es: "Giornalista: Quindi potete prevedere un'eruzione?", en: "Interviewer: So you can predict an eruption?" }
  - { es: "Dottoressa Ferlito: Figuriamoci! Magari fosse così semplice. Possiamo dire che la probabilità aumenta, che qualcosa si sta preparando. Ma il giorno e l'ora esatti, no. Chi lo promette, o è un mago o non ha mai visto un vulcano da vicino. Il nostro lavoro consiste soprattutto nel dare alla Protezione civile le informazioni necessarie per prendere decisioni: chiudere l'aeroporto, per esempio, quando la cenere rende pericolosi i voli.", en: "Dr Ferlito: Not a chance! If only it were that simple. We can say that the probability is increasing, that something is building up. But the exact day and hour, no. Anyone who promises that is either a magician or has never seen a volcano up close. Our work consists above all in giving Civil Protection the information it needs to make decisions: closing the airport, for example, when the ash makes flights dangerous." }
  - { es: "Giornalista: La cenere è forse il problema più sentito dai cittadini.", en: "Interviewer: Ash is perhaps the problem citizens feel most." }
  - { es: "Dottoressa Ferlito: Senza dubbio. Quando c'è una fontana di lava, la cenere ricopre tutto: le strade, le macchine, i balconi. I catanesi la raccolgono in sacchi speciali e la portano nei punti di raccolta. Non è pericolosa come una colata, ma è faticosa da gestire e costa parecchio ai Comuni. Diciamo che non è il momento in cui la gente ama di più la Muntagna.", en: "Dr Ferlito: Without a doubt. When there's a lava fountain, the ash covers everything: streets, cars, balconies. People in Catania collect it in special sacks and take it to collection points. It isn't as dangerous as a lava flow, but it's tiring to deal with and costs the councils quite a lot. Let's say it's not the moment when people love the Mountain most." }
  - { es: "Giornalista: E i turisti? Ogni estate migliaia di persone salgono verso i crateri.", en: "Interviewer: And the tourists? Every summer thousands of people climb up towards the craters." }
  - { es: "Dottoressa Ferlito: Ed è giusto che lo facciano, perché è un'esperienza unica. Però consiglio sempre di salire con una guida autorizzata e di rispettare i divieti. In alta quota il tempo cambia in fretta, e molti partono in scarpe da ginnastica e maglietta, come se andassero al mare. Il vulcano non perdona la superficialità.", en: "Dr Ferlito: And it's right that they do, because it's a unique experience. But I always advise going up with an authorised guide and respecting the bans. At high altitude the weather changes quickly, and many set off in trainers and a T-shirt, as if they were going to the beach. The volcano doesn't forgive carelessness." }
  - { es: "Giornalista: Un'ultima domanda. Dopo venticinque anni, l'Etna la sorprende ancora?", en: "Interviewer: One last question. After twenty-five years, does Etna still surprise you?" }
  - { es: "Dottoressa Ferlito: Ogni volta. Ed è proprio questo il bello del mio mestiere. Quando di notte la vedo accendersi dalla finestra, dopo tanti anni di studio, mi viene ancora la pelle d'oca. I miei colleghi dicono che sono poco professionale. Io rispondo che un vulcanologo che non si emoziona più dovrebbe cambiare lavoro.", en: "Dr Ferlito: Every time. And that's exactly the beauty of my job. When I see it light up at night from my window, after so many years of study, I still get goosebumps. My colleagues say that's unprofessional. I reply that a volcanologist who no longer gets excited should change jobs." }
questions:
  - { q: "Come vivono i catanesi il rapporto con l'Etna, secondo la vulcanologa?", options: ["Con un terrore costante", "Come con un parente difficile: lo rispettano ma ne hanno poca paura", "Con totale indifferenza"], answer: 1, explain: "«come se fosse un parente un po' difficile: lo rispettano, ne parlano ogni giorno… Paura vera, però, ne hanno poca»." }
  - { q: "Perché l'Etna è considerato meno pericoloso del Vesuvio?", options: ["Perché è più piccolo", "Perché le sue eruzioni sono quasi sempre effusive e la lava scende lentamente", "Perché non ha mai distrutto nessun paese"], answer: 1, explain: "«Le sue eruzioni sono quasi sempre effusive: la lava esce lentamente» – but she reminds us of 1669 and Mascali in 1928." }
  - { q: "Perché la gente continua a vivere sulle pendici del vulcano?", options: ["Perché le case costano poco", "Perché la terra vulcanica è fertilissima", "Perché è obbligata dal Comune"], answer: 1, explain: "«la terra vulcanica è fertilissima»: vineyards, citrus fruit and Bronte pistachios." }
  - { q: "Con «Figuriamoci! Magari fosse così semplice.», la dottoressa…", options: ["conferma che è facile prevedere un'eruzione", "nega con decisione: non si può prevedere il giorno e l'ora esatti", "cambia argomento"], answer: 1, explain: "figuriamoci = 'not at all, don't even think it'; magari + congiuntivo imperfetto expresses an unreal wish (c1.u08 discourse particles)." }
  - { q: "Qual è il problema più sentito dai cittadini durante le eruzioni?", options: ["La cenere che ricopre tutto", "I terremoti", "Il caldo"], answer: 0, explain: "«La cenere è forse il problema più sentito… Senza dubbio. Quando c'è una fontana di lava, la cenere ricopre tutto»." }
