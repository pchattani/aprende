id: r.b1.prima-che-faccia-buio
level: b1
title: Prima che faccia buio
kind: text
intro: Two friends set out on a hike in the Dolomites and learn the hard way why mountain people check the weather before they leave. Watch the conjunctions that take the congiuntivo (prima che, benché, a meno che, affinché, senza che).
allow: [elisa, sofia, cortina, lagazuoi, enrosadira, tre, cime]
paragraphs:
  - { es: "Erano le otto di mattina quando io ed Elisa siamo partite dal paese, vicino a Cortina d'Ampezzo. Il programma era semplice: salire fino a un rifugio a 2.400 metri, mangiare lassù e tornare giù prima che facesse buio. Il gestore del nostro albergo ci aveva guardato le scarpe e aveva scosso la testa. «Benché sia una bella giornata,» ci aveva detto, «portatevi una giacca pesante. In montagna il tempo cambia in fretta.»", en: "It was eight in the morning when Elisa and I set off from the village, near Cortina d'Ampezzo. The plan was simple: climb up to a mountain hut at 2,400 metres, eat up there and come back down before it got dark. The manager of our hotel had looked at our shoes and shaken his head. 'Even though it's a lovely day,' he'd told us, 'take a heavy jacket. In the mountains the weather changes fast.'" }
  - { es: "La salita è stata bellissima. Il sentiero passava tra i boschi, poi tra prati pieni di fiori, e intorno a noi le montagne diventavano sempre più alte. Abbiamo visto due marmotte e, da lontano, un'aquila. Elisa, che è molto più allenata di me, si fermava ogni tanto ad aspettarmi senza che io glielo chiedessi.", en: "The climb was beautiful. The path went through woods, then through meadows full of flowers, and around us the mountains grew higher and higher. We saw two marmots and, in the distance, an eagle. Elisa, who's much fitter than me, stopped every so often to wait for me without my asking her to." }
  - { es: "Siamo arrivate al rifugio all'una. Abbiamo mangiato polenta con i funghi e un dolce di mele, sedute fuori al sole. Il gestore del rifugio, un uomo anziano con la barba bianca, ci ha chiesto da quale sentiero volevamo scendere. Quando gliel'abbiamo detto, ha guardato il cielo verso ovest. «Io scenderei subito,» ha detto, «a meno che non vogliate dormire qui. Fra due ore arriva un temporale.»", en: "We got to the hut at one o'clock. We ate polenta with mushrooms and an apple cake, sitting outside in the sun. The hut keeper, an old man with a white beard, asked us which path we wanted to take down. When we told him, he looked at the sky to the west. 'I'd go down straight away,' he said, 'unless you want to sleep here. There's a storm coming in two hours.'" }
  - { es: "Il cielo era ancora azzurro e noi abbiamo pensato che esagerasse. Abbiamo fatto qualche foto, ci siamo riposate un po', e siamo partite alle due e mezza. Dopo un'ora il cielo è diventato grigio, poi nero. Il vento era freddissimo. Quando sono cominciati i tuoni, eravamo su un tratto di sentiero senza alberi, e io avevo davvero paura.", en: "The sky was still blue and we thought he was exaggerating. We took a few photos, rested for a bit, and set off at half past two. After an hour the sky turned grey, then black. The wind was freezing. When the thunder started, we were on a stretch of path with no trees, and I was really scared." }
  - { es: "Elisa è stata bravissima. Mi ha preso per mano e mi ha detto di camminare veloce ma con calma, affinché non cadessimo sulle rocce bagnate. Abbiamo indossato le giacche pesanti, per fortuna, e siamo scese senza fermarci fino a una malga dove c'erano un pastore e le sue mucche. Ci ha fatto entrare e ci ha offerto un tè caldo, mentre fuori cadeva la grandine.", en: "Elisa was brilliant. She took my hand and told me to walk quickly but calmly, so that we wouldn't fall on the wet rocks. We put on our heavy jackets, luckily, and went down without stopping to a mountain farm where there was a herdsman with his cows. He let us in and offered us hot tea, while outside the hail was falling." }
  - { es: "Dopo un'ora il temporale è finito com'era arrivato, all'improvviso. Siamo uscite e abbiamo visto una cosa incredibile: il sole al tramonto colorava le montagne di rosa e di arancione. È il fenomeno che qui chiamano «enrosadira». Il pastore ci ha spiegato che le Dolomiti diventano rosa perché la loro roccia, la dolomia, riflette la luce in modo particolare.", en: "After an hour the storm ended as it had arrived, suddenly. We went outside and saw something incredible: the setting sun was colouring the mountains pink and orange. It's the phenomenon that people here call 'enrosadira'. The herdsman explained to us that the Dolomites turn pink because their rock, dolomite, reflects light in a special way." }
  - { es: "Siamo arrivate in albergo alle otto, stanche e bagnate. Il gestore non ha detto niente: ha solo sorriso. Quella sera abbiamo deciso che la prossima volta controlleremo il meteo prima di partire, e che ascolteremo chi la montagna la conosce davvero.", en: "We got back to the hotel at eight, tired and wet. The manager didn't say anything: he just smiled. That evening we decided that next time we'll check the forecast before setting off, and that we'll listen to people who really know the mountains." }
questions:
  - { q: "Che consiglio aveva dato il gestore dell'albergo?", options: ["Di partire più tardi", "Di portare una giacca pesante", "Di non andare al rifugio"], answer: 1, explain: "«Benché sia una bella giornata, portatevi una giacca pesante.»" }
  - { q: "Perché il gestore del rifugio voleva che scendessero subito?", options: ["Perché il rifugio chiudeva", "Perché stava arrivando un temporale", "Perché faceva buio"], answer: 1, explain: "He looked west and said a storm would arrive in two hours." }
  - { q: "Che cosa hanno fatto le ragazze dopo il consiglio del gestore del rifugio?", options: ["Sono partite subito", "Sono rimaste a dormire al rifugio", "Hanno aspettato e sono partite alle due e mezza"], answer: 2, explain: "They thought he was exaggerating, took photos and rested before leaving." }
  - { q: "Dove si sono riparate dal temporale?", options: ["In una malga", "In una chiesa", "Sotto un albero"], answer: 0, explain: "They reached a malga (mountain farm) where a herdsman gave them hot tea." }
  - { q: "Che cos'è l'«enrosadira»?", options: ["Un dolce tipico", "Il colore rosa delle Dolomiti al tramonto", "Un tipo di temporale"], answer: 1, explain: "The Dolomites glow pink and orange at sunset because of the way dolomite rock reflects light." }
glossary:
