id: r.c1.la-parure
level: c1
title: La Parure
kind: literature
author: Guy de Maupassant (1850–1893)
source: "« La Parure », nouvelle parue dans Le Gaulois en 1884, reprise dans Contes du jour et de la nuit (1885). Domaine public. Texte abrégé d'après l'édition du Projet Gutenberg (n° 14790) ; les coupures sont marquées par (…), la ligature œ est rétablie."
intro: "Maupassant's most famous short story, abridged, with its celebrated final twist. The first paragraph is an editorial introduction written for this course; the rest is Maupassant's text, with cuts marked (…). Notice how the narration in passé simple and imparfait (rentra, souffrait) alternates with lively dialogue in the passé composé, and how the pluperfect subjunctive eût désiré expresses Mathilde's longing."
allow: [diamants, ministère, instruction, satin, glorieux, horrible, désir, gloire, enveloppe, maupassant, gaulois, mathilde, loisel, forestier, jeanne, ramponneau, georges, palais-royal, champs-élysées, mme]
paragraphs:
  - { es: "Guy de Maupassant a écrit environ trois cents nouvelles. « La Parure », publiée en 1884, raconte l'histoire de Mathilde Loisel, la femme d'un modeste employé de ministère à Paris, qui rêve d'une vie de luxe. Le texte qui suit est abrégé, mais la fin est donnée en entier.", en: "Guy de Maupassant wrote about three hundred short stories. 'The Necklace', published in 1884, tells the story of Mathilde Loisel, the wife of a modest ministry clerk in Paris, who dreams of a life of luxury. The text that follows is abridged, but the ending is given in full." }
  - { es: "C'était une de ces jolies et charmantes filles, nées, comme par une erreur du destin, dans une famille d'employés. Elle n'avait pas de dot, pas d'espérances, aucun moyen d'être connue, comprise, aimée, épousée par un homme riche et distingué ; et elle se laissa marier avec un petit commis du ministère de l'instruction publique.", en: "She was one of those pretty, charming girls born, as if by a mistake of fate, into a family of clerks. She had no dowry, no expectations, no means of being known, understood, loved and married by a rich and distinguished man; and she let herself be married to a minor clerk at the Ministry of Education." }
  - { es: "Elle souffrait sans cesse, se sentant née pour toutes les délicatesses et tous les luxes. Elle souffrait de la pauvreté de son logement, de la misère des murs, de l'usure des sièges, de la laideur des étoffes. (…) Elle n'avait pas de toilettes, pas de bijoux, rien. Et elle n'aimait que cela ; elle se sentait faite pour cela. Elle eût tant désiré plaire, être enviée, être séduisante et recherchée.", en: "She suffered constantly, feeling she had been born for every refinement and every luxury. She suffered from the poverty of her home, the shabbiness of the walls, the worn chairs, the ugliness of the fabrics. (…) She had no gowns, no jewels, nothing. And that was all she loved; she felt she was made for it. She would so much have liked to please, to be envied, to be attractive and sought after." }
  - { es: "Or, un soir, son mari rentra, l'air glorieux, et tenant à la main une large enveloppe. (…) Elle déchira vivement le papier et en tira une carte imprimée qui portait ces mots : « Le ministre de l'instruction publique et Mme Georges Ramponneau prient M. et Mme Loisel de leur faire l'honneur de venir passer la soirée à l'hôtel du ministère, le lundi 18 janvier. »", en: "Now, one evening, her husband came home with a triumphant air, holding a large envelope in his hand. (…) She tore the paper open eagerly and took out a printed card bearing these words: 'The Minister of Education and Madame Georges Ramponneau request the honour of the company of Monsieur and Madame Loisel for an evening reception at the Ministry, on Monday 18 January.'" }
  - { es: "Au lieu d'être ravie, comme l'espérait son mari, elle jeta avec dépit l'invitation sur la table, murmurant : — Que veux-tu que je fasse de cela ? (…) Que veux-tu que je me mette sur le dos pour aller là ?", en: "Instead of being delighted, as her husband had hoped, she threw the invitation on the table in vexation, murmuring: 'What do you expect me to do with that? (…) What do you expect me to put on my back to go there?'" }
  - { es: "Le jour de la fête approchait, et Mme Loisel semblait triste, inquiète, anxieuse. Sa toilette était prête cependant. (…) — Cela m'ennuie de n'avoir pas un bijou, pas une pierre, rien à mettre sur moi. (…) Mais son mari s'écria : — Que tu es bête ! Va trouver ton amie Mme Forestier et demande-lui de te prêter des bijoux.", en: "The day of the party was drawing near, and Madame Loisel seemed sad, uneasy, anxious. Her dress was ready, however. (…) 'It bothers me not to have a single jewel, not a single stone, nothing to wear.' (…) But her husband exclaimed: 'How silly you are! Go and see your friend Madame Forestier and ask her to lend you some jewellery.'" }
  - { es: "Mme Forestier alla vers son armoire à glace, prit un large coffret, l'apporta, l'ouvrit, et dit à Mme Loisel : — Choisis, ma chère. (…) Tout à coup elle découvrit, dans une boîte de satin noir, une superbe rivière de diamants ; et son cœur se mit à battre d'un désir immodéré. (…) Puis, elle demanda, hésitante, pleine d'angoisse : — Peux-tu me prêter cela, rien que cela ? — Mais, oui, certainement.", en: "Madame Forestier went to her mirrored wardrobe, took out a large casket, brought it over, opened it and said to Madame Loisel: 'Choose, my dear.' (…) Suddenly she discovered, in a black satin box, a superb diamond necklace; and her heart began to beat with an immoderate desire. (…) Then she asked, hesitantly, full of anguish: 'Can you lend me this, just this?' 'Why, yes, of course.'" }
  - { es: "Le jour de la fête arriva. Mme Loisel eut un succès. Elle était plus jolie que toutes, élégante, gracieuse, souriante et folle de joie. (…) Elle ôta les vêtements dont elle s'était enveloppé les épaules, devant la glace, afin de se voir encore une fois dans sa gloire. Mais soudain elle poussa un cri. Elle n'avait plus sa rivière autour du cou !", en: "The day of the party arrived. Madame Loisel was a success. She was prettier than all the others, elegant, graceful, smiling and wild with joy. (…) In front of the mirror, she took off the wrap she had put round her shoulders, so as to see herself once more in her glory. But suddenly she let out a cry. The necklace was no longer round her neck!" }
  - { es: "(…) Ils trouvèrent, dans une boutique du Palais-Royal, un chapelet de diamants qui leur parut entièrement semblable à celui qu'ils cherchaient. Il valait quarante mille francs. On le leur laisserait à trente-six mille. (…) Mme Loisel connut la vie horrible des nécessiteux. Elle prit son parti, d'ailleurs, tout d'un coup, héroïquement. Il fallait payer cette dette effroyable. Elle payerait. (…) Et cette vie dura dix ans.", en: "(…) In a shop in the Palais-Royal they found a string of diamonds that seemed to them exactly like the one they were looking for. It was worth forty thousand francs. They could have it for thirty-six thousand. (…) Madame Loisel came to know the horrible life of the needy. She made up her mind to it, however, all at once, heroically. That dreadful debt had to be paid. She would pay it. (…) And that life lasted ten years." }
  - { es: "Or, un dimanche, comme elle était allée faire un tour aux Champs-Élysées pour se délasser des besognes de la semaine, elle aperçut tout à coup une femme qui promenait un enfant. C'était Mme Forestier, toujours jeune, toujours belle, toujours séduisante. (…) Elle s'approcha. — Bonjour, Jeanne. (…) — Non. Je suis Mathilde Loisel. Son amie poussa un cri : — Oh !… ma pauvre Mathilde, comme tu es changée !…", en: "Now, one Sunday, when she had gone for a stroll on the Champs-Élysées to rest from the chores of the week, she suddenly noticed a woman walking with a child. It was Madame Forestier, still young, still beautiful, still attractive. (…) She went up to her. 'Good morning, Jeanne.' (…) 'No. I am Mathilde Loisel.' Her friend let out a cry: 'Oh!… my poor Mathilde, how you have changed!…'" }
  - { es: "— Tu te rappelles bien cette rivière de diamants que tu m'as prêtée pour aller à la fête du Ministère. — Oui. Eh bien ? — Eh bien, je l'ai perdue. — Comment ! puisque tu me l'as rapportée. — Je t'en ai rapporté une autre toute pareille. Et voilà dix ans que nous la payons. Tu comprends que ça n'était pas aisé pour nous, qui n'avions rien… Enfin c'est fini, et je suis rudement contente.", en: "'You remember that diamond necklace you lent me to go to the party at the Ministry.' 'Yes. Well?' 'Well, I lost it.' 'What do you mean? You brought it back to me.' 'I brought you back another one just like it. And for ten years we've been paying for it. You understand it wasn't easy for us, who had nothing… Anyway, it's over, and I'm awfully glad.'" }
  - { es: "Mme Forestier s'était arrêtée. — Tu dis que tu as acheté une rivière de diamants pour remplacer la mienne ? — Oui. Tu ne t'en étais pas aperçue, hein ? Elles étaient bien pareilles. Et elle souriait d'une joie orgueilleuse et naïve. Mme Forestier, fort émue, lui prit les deux mains. — Oh ! ma pauvre Mathilde ! Mais la mienne était fausse. Elle valait au plus cinq cents francs !…", en: "Madame Forestier had stopped. 'You say you bought a diamond necklace to replace mine?' 'Yes. You hadn't noticed, had you? They were very alike.' And she smiled with a proud and naive joy. Madame Forestier, deeply moved, took both her hands. 'Oh! my poor Mathilde! But mine was fake. It was worth five hundred francs at most!…'" }
questions:
  - { q: "Pourquoi Mathilde est-elle malheureuse au début de la nouvelle ?", options: ["Son mari est méchant avec elle", "Elle se sent née pour le luxe mais vit modestement", "Elle est malade"], answer: 1, explain: "«Elle souffrait sans cesse, se sentant née pour toutes les délicatesses et tous les luxes» — but she married a minor clerk." }
  - { q: "Comment Mathilde réagit-elle d'abord à l'invitation ?", options: ["Elle est ravie", "Elle la jette sur la table avec dépit", "Elle la montre à son amie"], answer: 1, explain: "«Au lieu d'être ravie… elle jeta avec dépit l'invitation sur la table»: she has nothing to wear." }
  - { q: "Que fait le couple pour remplacer la rivière perdue ?", options: ["Ils avouent tout à Mme Forestier", "Ils achètent une rivière semblable pour trente-six mille francs et travaillent dix ans pour payer leur dette", "Ils la retrouvent dans le fiacre"], answer: 1, explain: "They buy a similar necklace at the Palais-Royal for 36,000 francs; paying the debt takes ten years." }
  - { q: "Que révèle Mme Forestier à la fin ?", options: ["Qu'elle savait tout depuis le début", "Que sa rivière était fausse et ne valait que cinq cents francs", "Qu'elle a perdu la nouvelle rivière"], answer: 1, explain: "«Mais la mienne était fausse. Elle valait au plus cinq cents francs !» — the ten years of sacrifice were for nothing." }
  - { q: "Que signifie « Elle eût tant désiré plaire » ?", options: ["Elle avait plu à tout le monde", "Elle aurait tant aimé plaire", "Elle désire plaire demain"], answer: 1, explain: "eût désiré is the subjonctif plus-que-parfait used as a literary conditionnel passé: = elle aurait tant désiré." }
