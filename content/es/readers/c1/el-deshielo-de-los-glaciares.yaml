id: r.c1.el-deshielo-de-los-glaciares
level: c1
title: "Informe: el deshielo de los glaciares"
kind: text
intro: An extract from a popular-science report on melting glaciers in the Pyrenees, written in the dense, subordinated style of formal Spanish, with absolute constructions and correlatives.
allow: [pirineos, aneto, monte perdido, huesca, españa, europa, alpes]
paragraphs:
  - { es: "Terminada la última campaña de medición, los investigadores que desde 1984 siguen la evolución de los glaciares del Pirineo han llegado a una conclusión que, dadas las circunstancias, a nadie sorprende: de los cincuenta y dos glaciares que existían a comienzos del siglo XX quedan diecinueve, y ninguno de ellos, según el informe, sobrevivirá más allá de 2050.", en: "With the last measuring campaign over, the researchers who have followed the evolution of the Pyrenean glaciers since 1984 have reached a conclusion which, given the circumstances, surprises nobody: of the fifty-two glaciers that existed at the start of the twentieth century, nineteen remain, and none of them, according to the report, will survive beyond 2050." }
  - { es: "El documento, cuya versión completa se dará a conocer en una rueda de prensa la semana próxima, no solo describe la pérdida de hielo, sino que analiza sus consecuencias para el ecosistema de alta montaña, para los ríos que nacen en él y, a su vez, para los pueblos que viven de esos ríos.", en: "The document, the full version of which will be released at a press conference next week, not only describes the loss of ice, but analyses its consequences for the high-mountain ecosystem, for the rivers that rise in it and, in turn, for the villages that live off those rivers." }
  - { es: "Los datos son claros. El glaciar del Aneto, el mayor de la cordillera, ha perdido la mitad de su superficie desde que comenzaron las mediciones; el de Monte Perdido, que antaño bajaba hasta el valle, se ha partido en dos. Ya sea por el aumento de las temperaturas, ya sea por la falta de nieve en invierno, el proceso se ha acelerado en la última década.", en: "The data are clear. The Aneto glacier, the largest in the range, has lost half its surface since measurements began; the Monte Perdido glacier, which in the old days reached down to the valley, has split in two. Whether because of rising temperatures or because of the lack of winter snow, the process has speeded up in the last decade." }
  - { es: "Al no haber hielo que alimente los arroyos en verano, los pueblos del valle dependerán cada vez más de las lluvias, cada vez más irregulares. De confirmarse las previsiones, algunos ríos que hoy corren todo el año se secarán en agosto, con lo cual la agricultura y el turismo, que son tanto la riqueza como la debilidad de la zona, sufrirán a la vez.", en: "With no ice to feed the streams in summer, the villages in the valley will depend more and more on rainfall, which is increasingly irregular. If the forecasts are confirmed, some rivers that now run all year will dry up in August, so that agriculture and tourism, which are both the wealth and the weakness of the area, will suffer at the same time." }
  - { es: "Los autores, si bien reconocen que el deshielo de los glaciares pirenaicos es ya inevitable, insisten en que lo que ocurra en los Alpes o en los Andes todavía depende de las decisiones que se tomen esta década. «No se trata de salvar estos glaciares, sino de aprender de ellos», declaró la coordinadora del estudio, matizando que el informe «no es un adiós, sino una advertencia».", en: "The authors, while acknowledging that the melting of the Pyrenean glaciers is now inevitable, insist that what happens in the Alps or the Andes still depends on the decisions taken this decade. 'It is not a matter of saving these glaciers, but of learning from them', the study's coordinator declared, adding that the report 'is not a goodbye, but a warning'." }
  - { es: "Dicho esto, el informe propone medidas concretas: vigilar los lagos que se forman al derretirse el hielo, puesto que pueden desbordarse de golpe; limitar el acceso de los turistas a las zonas más frágiles; y, sobre todo, registrar lo que queda. Una vez desaparecido un glaciar, no solo se pierde hielo, sino también información sobre el clima de los últimos miles de años.", en: "That said, the report proposes concrete measures: monitoring the lakes that form as the ice melts, since they can overflow suddenly; limiting tourist access to the most fragile areas; and, above all, recording what remains. Once a glacier has disappeared, not only ice is lost, but also information about the climate of the last thousands of years." }
  - { es: "Con todo, los investigadores no quieren terminar con una nota pesimista. Habiendo trabajado cuarenta años en la montaña, afirman haber visto cambiar no solo el paisaje, sino también a las personas: los ayuntamientos que antes ignoraban sus informes hoy los piden, y los colegios del valle suben cada primavera a medir el hielo con ellos. De ahí que el informe termine con una frase que no parece científica: «El glaciar morirá; que no muera con él la memoria».", en: "Even so, the researchers do not want to end on a pessimistic note. Having worked forty years in the mountains, they claim to have seen not only the landscape change but also the people: the town councils that used to ignore their reports now ask for them, and the valley's schools go up every spring to measure the ice with them. Hence the report ends with a sentence that does not sound scientific: 'The glacier will die; let its memory not die with it'." }
questions:
  - { q: "How many Pyrenean glaciers remain, according to the report?", options: ["Fifty-two", "Nineteen", "None"], answer: 1 }
  - { q: "What two causes does the text give for the faster melting of the last decade?", options: ["Tourism and agriculture", "Rising temperatures and lack of winter snow", "Overflowing lakes and deforestation"], answer: 1 }
  - { q: "Why does the loss of a glacier mean more than the loss of ice?", options: ["Because the ice is sold", "Because climate information about thousands of years disappears with it", "Because the tourists stop coming"], answer: 1 }
  - { q: "What does the coordinator say the report is?", options: ["A goodbye", "A warning rather than a goodbye", "A scientific failure"], answer: 1 }
  - { q: "Which change in people do the researchers mention?", options: ["Town councils now ask for their reports and schools help measure the ice", "Villagers have left the valley", "Tourists have stopped visiting"], answer: 0 }
