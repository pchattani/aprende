id: a1.u08
title: Quanto custa?
lessons:
  - id: a1.u08.l1
    title: Está caro!
    teach: [g.quanto-custa]
    tip: "Quanto custa? for one thing, Quanto custam? for several, Quanto é tudo? for the total. The currency is o real, plural os reais."
    vocab: [w.quanto-custa, w.custar, w.preço, w.real, w.centavo, w.dinheiro, w.cartão, w.pix, w.troco, w.caro, w.barato, w.desconto, w.promoção, w.sacola, w.feira, w.aceitar, w.custo, w.grátis, w.vender]
    sentences:
      - { es: "Quanto custa essa camisa?", en: "How much is this shirt?", altEs: ["Quanto é essa camisa?", "Qual é o preço dessa camisa?", "Quanto custa esta camisa?"], altEn: ["How much is that shirt?", "How much does this shirt cost?"], grammar: [g.quanto-custa, g.demonstratives], vocab: [w.quanto-custa, w.camisa] }
      - { es: "Quanto custam as havaianas?", en: "How much are the Havaianas?", altEs: ["Quanto custam essas havaianas?"], altEn: ["How much are the flip-flops?"], grammar: [g.quanto-custa], vocab: [w.custar, w.havaianas], error: { wrong: "Quanto custa as havaianas?", explain: "With plural things the verb is plural too: quanto custam.", grammar: g.quanto-custa } }
      - { es: "Custa oitenta reais.", en: "It costs eighty reais.", altEs: ["São oitenta reais.", "Fica oitenta reais.", "Oitenta reais."], altEn: ["It's eighty reais."], grammar: [g.quanto-custa], vocab: [w.custar, w.real] }
      - { es: "Está muito caro! Tem desconto?", en: "That's very expensive! Is there a discount?", altEs: ["Tá muito caro! Tem desconto?", "Está caro demais! Tem desconto?", "Está muito caro! Tem algum desconto?"], altEn: ["It's really expensive! Is there a discount?", "It's very expensive! Do you give a discount?"], grammar: [g.quanto-custa, g.tem-there-is], vocab: [w.caro, w.desconto] }
      - { es: "As frutas da feira estão baratas hoje.", en: "The fruit at the market is cheap today.", altEs: ["Hoje as frutas da feira estão baratas."], grammar: [g.quanto-custa, g.adjective-agreement], vocab: [w.feira, w.barato, w.fruta], note: "caro and barato agree with the noun: as frutas estão baratas.", transform: { instruction: "Make it singular: 'the mango'", answer: "A manga da feira está barata hoje.", alt: ["Hoje a manga da feira está barata."], en: "The mango at the market is cheap today." } }
      - { es: "Posso pagar no cartão?", en: "Can I pay by card?", altEs: ["Posso pagar com cartão?", "Eu posso pagar no cartão?"], grammar: [g.quanto-custa, g.poder-present], vocab: [w.cartão, w.pagar], transform: { instruction: "Change to 'we'", answer: "Podemos pagar no cartão?", alt: ["Nós podemos pagar no cartão?", "Podemos pagar com cartão?"], en: "Can we pay by card?" } }
      - { es: "Vocês aceitam Pix?", en: "Do you take Pix?", altEs: ["Aceita Pix?", "Vocês aceitam pix?", "Aceitam Pix?"], altEn: ["Do you accept Pix?"], grammar: [g.quanto-custa], vocab: [w.aceitar, w.pix], note: "Pix is Brazil's instant bank transfer: you pay by scanning a QR code with your phone." }
      - { es: "Não tenho dinheiro, só cartão.", en: "I don't have any cash, only a card.", altEs: ["Eu não tenho dinheiro, só cartão.", "Não tenho dinheiro, só o cartão."], altEn: ["I don't have cash, just a card."], grammar: [g.negation, g.ter-present], vocab: [w.dinheiro, w.cartão] }
      - { es: "Aqui está o seu troco: dois reais e cinquenta centavos.", en: "Here's your change: two reais and fifty cents.", altEs: ["Aqui está o troco: dois reais e cinquenta centavos.", "O seu troco: dois e cinquenta."], grammar: [g.quanto-custa, g.numbers-0-100], vocab: [w.troco, w.centavo, w.real] }
      - { es: "Quanto é tudo?", en: "How much is it all together?", altEs: ["Quanto fica tudo?", "Quanto deu tudo?", "Quanto é?"], altEn: ["How much is everything?"], grammar: [g.quanto-custa, g.todo-tudo], vocab: [w.tudo] }
      - { es: "A camisa do Flamengo está em promoção.", en: "The Flamengo shirt is on sale.", altEs: ["A camisa do Flamengo tá em promoção."], altEn: ["The Flamengo shirt is on special offer."], grammar: [g.quanto-custa, g.contractions-de], vocab: [w.promoção, w.camisa] }
      - { es: "O vendedor vende camisetas na frente do Maracanã.", en: "The seller sells T-shirts in front of the Maracanã.", altEs: ["O vendedor vende camisetas em frente ao Maracanã."], grammar: [g.present-regular-er-ir, g.prepositions-place], vocab: [w.vender, w.vendedor, w.camiseta] }
      - { es: "A sacola é grátis?", en: "Is the bag free?", altEs: ["A sacola é de graça?"], altEn: ["Is the carrier bag free?"], grammar: [g.quanto-custa], vocab: [w.sacola, w.grátis] }
      - { es: "Qual é o preço do ingresso?", en: "What's the price of the ticket?", altEs: ["Quanto custa o ingresso?", "Quanto é o ingresso?"], grammar: [g.quanto-custa, g.question-words], vocab: [w.preço, w.ingresso] }
      - { es: "O custo do hotel é alto, mas a vista é linda.", en: "The cost of the hotel is high, but the view is beautiful.", altEs: ["O hotel é caro, mas a vista é linda."], grammar: [g.quanto-custa, g.connectors-basic], vocab: [w.custo, w.hotel] }
    exchanges:
      - q: { es: "Quanto custa esse boné?", en: "How much is this cap?" }
        a: { es: "Custa trinta reais.", en: "It costs thirty reais." }
        alt: ["Trinta reais.", "São trinta.", "Trinta."]
        grammar: [g.quanto-custa]
        vocab: [w.quanto-custa, w.boné, w.real]
      - q: { es: "Aceita cartão?", en: "Do you take cards?" }
        a: { es: "Aceito, e Pix também.", en: "Yes, and Pix too." }
        alt: ["Aceito, sim.", "Não, só dinheiro.", "Aceito."]
        grammar: [g.quanto-custa, g.yes-no-answers]
        vocab: [w.aceitar, w.cartão, w.pix]
      - q: { es: "Tem desconto?", en: "Is there a discount?" }
        a: { es: "Tem: na promoção, duas camisetas custam cinquenta reais.", en: "Yes: on special offer, two T-shirts cost fifty reais." }
        alt: ["Não, não tem.", "Tem, sim.", "Hoje não."]
        grammar: [g.quanto-custa, g.tem-there-is]
        vocab: [w.desconto, w.promoção]
      - q: { es: "Quanto é tudo?", en: "How much is it all together?" }
        a: { es: "Fica noventa e cinco reais.", en: "That comes to ninety-five reais." }
        alt: ["Noventa e cinco.", "São noventa e cinco reais.", "Noventa e cinco reais."]
        grammar: [g.quanto-custa, g.numbers-0-100]
        vocab: [w.real]
      - q: { es: "Quer uma sacola?", en: "Do you want a bag?" }
        a: { es: "Não precisa, obrigado.", en: "No need, thanks." }
        alt: ["Quero, obrigada.", "Sim, por favor.", "Não, obrigado."]
        grammar: [g.querer-present]
        vocab: [w.sacola]
    texts:
      - title: "Placa na feira"
        es: ["Manga: cinco reais o quilo.", "Abacaxi: oito reais.", "Aceitamos Pix e cartão!"]
        en: ["Mangoes: five reais a kilo.", "Pineapple: eight reais.", "We take Pix and cards!"]
        grammar: [g.quanto-custa]
        vocab: [w.real, w.aceitar, w.pix]
      - title: "Mensagem do Tom"
        es: ["Bia, a camisa do Flamengo custa trezentos reais!", "É muito cara.", "Mas na feira tem uma camiseta barata, por cinquenta."]
        en: ["Bia, the Flamengo shirt costs three hundred reais!", "It's very expensive.", "But at the market there's a cheap T-shirt, for fifty."]
        grammar: [g.quanto-custa]
        vocab: [w.custar, w.caro, w.barato, w.feira]
    spicy:
      - { es: "Quanto custa um beijo seu? Aceita Pix?", en: "How much is a kiss from you? Do you take Pix?", altEs: ["Quanto custa um beijo seu? Você aceita Pix?"], grammar: [g.quanto-custa], vocab: [w.custar, w.beijo, w.pix] }
      - { es: "Você é caro demais para mim? Tem desconto para estudantes?", en: "Are you too expensive for me? Is there a student discount?", altEs: ["Você é cara demais para mim? Tem desconto para estudantes?"], grammar: [g.quanto-custa, g.muito-pouco], vocab: [w.caro, w.desconto] }
      - { es: "Não tenho dinheiro, mas pago o café… com um abraço?", en: "I don't have any money, but I'll pay for the coffee… with a hug?", grammar: [g.quanto-custa], vocab: [w.dinheiro, w.abraço] }
      - { es: "Pode ficar com o troco. E com o meu número também.", en: "Keep the change. And my number too.", altEs: ["Pode ficar com o troco. E com meu número também."], grammar: [g.poder-present], vocab: [w.troco, w.número] }
      - { es: "Grátis? Então eu quero dois abraços.", en: "Free? Then I want two hugs.", altEs: ["É grátis? Então eu quero dois abraços."], grammar: [g.quanto-custa, g.querer-present], vocab: [w.grátis, w.abraço] }
  - id: a1.u08.l2
    title: Cem, mil, um milhão
    teach: [g.numbers-100-plus]
    tip: "Cem is exactly 100; from 101 it's cento: cento e vinte. Hundreds agree with feminine nouns: duzentas pessoas, but duzentos reais."
    vocab: [w.cento, w.duzentos, w.trezentos, w.quatrocentos, w.quinhentos, w.seiscentos, w.setecentos, w.oitocentos, w.novecentos, w.mil, w.milhão, w.levar, w.trocar, w.sapato, w.tênis, w.sandália, w.chinelo, w.havaianas, w.meia]
    sentences:
      - { es: "O ingresso custa cento e vinte reais.", en: "The ticket costs a hundred and twenty reais.", altEs: ["O ingresso custa cento e vinte.", "O ingresso é cento e vinte reais."], grammar: [g.numbers-100-plus, g.quanto-custa], vocab: [w.cento, w.ingresso] }
      - { es: "Cem, duzentos, trezentos, quatrocentos, quinhentos.", en: "One hundred, two hundred, three hundred, four hundred, five hundred.", grammar: [g.numbers-100-plus], vocab: [w.duzentos, w.trezentos, w.quatrocentos, w.quinhentos], kinds: [dictation, listen, typeEs, order] }
      - { es: "Seiscentos, setecentos, oitocentos, novecentos, mil.", en: "Six hundred, seven hundred, eight hundred, nine hundred, one thousand.", grammar: [g.numbers-100-plus], vocab: [w.seiscentos, w.setecentos, w.oitocentos, w.novecentos, w.mil], kinds: [dictation, listen, typeEs, order] }
      - { es: "O Maracanã tem lugar para mais de setenta mil pessoas.", en: "The Maracanã has room for more than seventy thousand people.", altEs: ["No Maracanã tem lugar para mais de setenta mil pessoas."], grammar: [g.numbers-100-plus], vocab: [w.mil, w.lugar, w.pessoa] }
      - { es: "Esses tênis custam quatrocentos reais!", en: "These trainers cost four hundred reais!", altEs: ["Estes tênis custam quatrocentos reais!"], altEn: ["Those sneakers cost four hundred reais!"], grammar: [g.numbers-100-plus, g.quanto-custa], vocab: [w.tênis, w.quatrocentos] }
      - { es: "Tem duzentas pessoas na festa.", en: "There are two hundred people at the party.", altEs: ["Há duzentas pessoas na festa."], grammar: [g.numbers-100-plus, g.tem-there-is], vocab: [w.duzentos, w.pessoa, w.festa], error: { wrong: "Tem duzentos pessoas na festa.", explain: "Hundreds agree with feminine nouns: duzentas pessoas.", grammar: g.numbers-100-plus } }
      - { es: "O sapato custa trezentos e cinquenta reais.", en: "The shoe costs three hundred and fifty reais.", altEs: ["O sapato é trezentos e cinquenta reais."], grammar: [g.numbers-100-plus, g.quanto-custa], vocab: [w.sapato, w.trezentos], transform: { instruction: "Make it plural: 'the shoes'", answer: "Os sapatos custam trezentos e cinquenta reais.", alt: ["Os sapatos são trezentos e cinquenta reais."], en: "The shoes cost three hundred and fifty reais." } }
      - { es: "Ela ganha dois mil e quinhentos reais por mês.", en: "She earns two thousand five hundred reais a month.", grammar: [g.numbers-100-plus], vocab: [w.mil, w.quinhentos, w.ganhar, w.mês] }
      - { es: "O Rio tem mais de seis milhões de habitantes.", en: "Rio has more than six million inhabitants.", altEs: ["O Rio de Janeiro tem mais de seis milhões de habitantes."], grammar: [g.numbers-100-plus], vocab: [w.milhão, w.habitante], note: "milhão is a noun, so it takes de: seis milhões de pessoas." }
      - { es: "Um apartamento em Ipanema custa mais de um milhão de reais.", en: "A flat in Ipanema costs more than a million reais.", altEn: ["An apartment in Ipanema costs over a million reais."], grammar: [g.numbers-100-plus, g.quanto-custa], vocab: [w.milhão, w.apartamento] }
      - { es: "Os chinelos custam trinta reais.", en: "The flip-flops cost thirty reais.", altEs: ["Os chinelos são trinta reais."], altEn: ["The slippers cost thirty reais."], grammar: [g.quanto-custa], vocab: [w.chinelo] }
      - { es: "Quero trocar estas sandálias: são pequenas.", en: "I want to exchange these sandals: they're small.", altEs: ["Quero trocar essas sandálias: são pequenas.", "Eu quero trocar estas sandálias, são pequenas."], altEn: ["I'd like to exchange these sandals: they're too small."], grammar: [g.demonstratives, g.querer-present], vocab: [w.trocar, w.sandália] }
      - { es: "Vou levar as havaianas azuis.", en: "I'll take the blue Havaianas.", altEs: ["Eu vou levar as havaianas azuis.", "Vou levar essas havaianas azuis."], altEn: ["I'll take the blue flip-flops."], grammar: [g.colours, g.ir-infinitive], vocab: [w.levar, w.havaianas, w.azul], note: "Vou levar = I'll take it (when buying)." }
      - { es: "Meias brancas: três por vinte reais.", en: "White socks: three for twenty reais.", grammar: [g.quanto-custa, g.colours], vocab: [w.meia, w.branco] }
      - { es: "Mil reais? Nem pensar!", en: "A thousand reais? No way!", altEs: ["Mil reais? De jeito nenhum!"], grammar: [g.numbers-100-plus], vocab: [w.mil, w.nem], error: { wrong: "Um mil reais? Nem pensar!", explain: "mil never takes um: mil reais.", grammar: g.numbers-100-plus } }
      - { es: "O hotel custa seiscentos reais por noite.", en: "The hotel costs six hundred reais a night.", altEs: ["O hotel é seiscentos reais por noite."], grammar: [g.numbers-100-plus], vocab: [w.seiscentos, w.hotel, w.noite], transform: { instruction: "Change the price to 800", answer: "O hotel custa oitocentos reais por noite.", alt: ["O hotel é oitocentos reais por noite."], en: "The hotel costs eight hundred reais a night." } }
    exchanges:
      - q: { es: "Quanto custa o ingresso para o jogo?", en: "How much is the ticket for the match?" }
        a: { es: "Custa cento e cinquenta reais.", en: "It costs a hundred and fifty reais." }
        alt: ["Cento e cinquenta.", "Uns cento e cinquenta reais.", "É cento e cinquenta."]
        grammar: [g.numbers-100-plus, g.quanto-custa]
        vocab: [w.ingresso, w.cento, w.jogo]
      - q: { es: "Quantas pessoas tem na festa?", en: "How many people are there at the party?" }
        a: { es: "Tem umas duzentas pessoas.", en: "There are about two hundred people." }
        alt: ["Duzentas, mais ou menos.", "Mais de mil!", "Umas trezentas."]
        grammar: [g.numbers-100-plus, g.tem-there-is]
        vocab: [w.duzentos, w.pessoa]
      - q: { es: "Posso trocar esses tênis?", en: "Can I exchange these trainers?" }
        a: { es: "Pode, sim. Qual é o problema?", en: "Yes, you can. What's the problem?" }
        alt: ["Pode.", "Não, não pode.", "Pode, claro."]
        grammar: [g.poder-present, g.yes-no-answers]
        vocab: [w.trocar, w.tênis, w.problema]
      - q: { es: "Quanto é o hotel por noite?", en: "How much is the hotel per night?" }
        a: { es: "São quatrocentos e oitenta reais.", en: "It's four hundred and eighty reais." }
        alt: ["Quatrocentos e oitenta.", "Custa quatrocentos e oitenta reais."]
        grammar: [g.numbers-100-plus, g.quanto-custa]
        vocab: [w.quatrocentos, w.hotel]
      - q: { es: "Você vai levar as sandálias?", en: "Are you going to take the sandals?" }
        a: { es: "Vou, e as meias também.", en: "Yes, and the socks too." }
        alt: ["Vou, sim.", "Não, são caras demais.", "Vou."]
        grammar: [g.yes-no-answers, g.ir-infinitive]
        vocab: [w.levar, w.sandália, w.meia]
    texts:
      - title: "Conta da loja"
        es: ["Tênis: quatrocentos reais.", "Meias: vinte reais.", "Tudo: quatrocentos e vinte reais."]
        en: ["Trainers: four hundred reais.", "Socks: twenty reais.", "All together: four hundred and twenty reais."]
        grammar: [g.numbers-100-plus]
        vocab: [w.tênis, w.meia, w.quatrocentos]
      - title: "O Maracanã em números"
        es: ["O Maracanã é de 1950.", "Hoje, ele tem lugar para mais de setenta mil pessoas.", "Um ingresso custa de cinquenta a trezentos reais."]
        en: ["The Maracanã dates from 1950.", "Today it has room for more than seventy thousand people.", "A ticket costs from fifty to three hundred reais."]
        grammar: [g.numbers-100-plus]
        vocab: [w.mil, w.trezentos, w.ingresso]
    spicy:
      - { es: "Você é um em um milhão.", en: "You're one in a million.", altEs: ["Você é uma em um milhão."], grammar: [g.numbers-100-plus], vocab: [w.milhão] }
      - { es: "Quinhentos reais por um jantar? Com você, pode ser.", en: "Five hundred reais for a dinner? With you, maybe.", grammar: [g.numbers-100-plus, g.poder-present], vocab: [w.quinhentos, w.jantar] }
      - { es: "Tenho mil problemas, mas você não é um deles.", en: "I have a thousand problems, but you're not one of them.", altEs: ["Eu tenho mil problemas, mas você não é um deles."], grammar: [g.numbers-100-plus], vocab: [w.mil, w.problema] }
      - { es: "Posso trocar o meu número pelo seu?", en: "Can I swap my number for yours?", altEs: ["Posso trocar meu número pelo seu?"], grammar: [g.poder-present], vocab: [w.trocar, w.número] }
      - { es: "Vou levar esses sapatos… e o vendedor também.", en: "I'll take these shoes… and the salesman too.", altEs: ["Vou levar esses sapatos… e a vendedora também."], grammar: [g.ir-infinitive, g.demonstratives], vocab: [w.levar, w.sapato, w.vendedor] }
  - id: a1.u08.l3
    title: Essa ou aquela?
    teach: [g.demonstratives, g.demonstrative-contractions]
    tip: "esse/essa = this or that near you (the everyday Brazilian choice); aquele/aquela = that over there. With de and em they contract: desse, naquele."
    vocab: [w.este, w.esse, w.aquele, w.isto, w.isso, w.aquilo, w.deste, w.desse, w.daquele, w.neste, w.nesse, w.naquele, w.roupa, w.camisa, w.camiseta, w.calça, w.saia, w.vestido, w.tamanho, w.provar]
    sentences:
      - { es: "Essa camisa é muito bonita.", en: "This shirt is really nice.", altEs: ["Esta camisa é muito bonita.", "Essa camisa é bem bonita."], altEn: ["That shirt is very pretty."], grammar: [g.demonstratives], vocab: [w.esse, w.camisa], transform: { instruction: "Make it plural", answer: "Essas camisas são muito bonitas.", alt: ["Estas camisas são muito bonitas."], en: "These shirts are really nice." } }
      - { es: "Aquela saia vermelha é cara?", en: "Is that red skirt over there expensive?", altEs: ["Aquela saia vermelha ali é cara?"], grammar: [g.demonstratives, g.colours], vocab: [w.aquele, w.saia, w.vermelho] }
      - { es: "O que é isso?", en: "What's that?", altEs: ["O que é isto?", "Que é isso?"], altEn: ["What is that?", "What's this?"], grammar: [g.demonstratives], vocab: [w.isso] }
      - { es: "Eu gosto muito desse vestido.", en: "I really like this dress.", altEs: ["Gosto muito desse vestido.", "Eu gosto muito deste vestido."], altEn: ["I really like that dress."], grammar: [g.demonstrative-contractions, g.gostar-de], vocab: [w.desse, w.vestido], error: { wrong: "Eu gosto muito de esse vestido.", explain: "de + esse always contracts: desse.", grammar: g.demonstrative-contractions } }
      - { es: "Nesta loja tem roupa barata.", en: "There are cheap clothes in this shop.", altEs: ["Nessa loja tem roupa barata.", "Nesta loja há roupa barata."], grammar: [g.demonstrative-contractions, g.tem-there-is], vocab: [w.neste, w.roupa, w.loja] }
      - { es: "Posso provar essa calça?", en: "Can I try on these trousers?", altEs: ["Posso provar esta calça?", "Eu posso provar essa calça?"], altEn: ["Can I try on those trousers?", "Can I try these pants on?"], grammar: [g.demonstratives, g.poder-present], vocab: [w.provar, w.calça], note: "In Brazil uma calça is one pair of trousers." }
      - { es: "Que tamanho você usa? — Uso M.", en: "What size do you wear? — I wear medium.", altEs: ["Qual é o seu tamanho? — Uso M.", "Que tamanho você usa? — M."], altEn: ["What size are you? — Medium."], grammar: [g.question-words], vocab: [w.tamanho, w.usar], note: "Clothes sizes in Brazil: P (small), M (medium), G (large), GG (extra large)." }
      - { es: "Esses tênis são meus, e aqueles são do Tom.", en: "These trainers are mine, and those over there are Tom's.", altEs: ["Estes tênis são meus e aqueles são do Tom."], grammar: [g.demonstratives, g.possessives], vocab: [w.esse, w.aquele, w.tênis] }
      - { es: "Moro naquele prédio amarelo.", en: "I live in that yellow building.", altEs: ["Eu moro naquele prédio amarelo."], altEn: ["I live in that yellow building over there."], grammar: [g.demonstrative-contractions, g.colours], vocab: [w.naquele, w.prédio, w.amarelo] }
      - { es: "Não sei nada disso.", en: "I don't know anything about that.", altEs: ["Eu não sei nada disso."], grammar: [g.demonstrative-contractions, g.negation], vocab: [w.isso, w.saber] }
      - { es: "Isso! Muito bem!", en: "That's it! Well done!", altEs: ["Isso aí! Muito bem!"], altEn: ["Exactly! Very good!"], grammar: [g.demonstratives], vocab: [w.isso, w.muito-bem] }
      - { es: "Gosto daquela camiseta do Flamengo.", en: "I like that Flamengo T-shirt over there.", altEs: ["Eu gosto daquela camiseta do Flamengo."], grammar: [g.demonstrative-contractions, g.gostar-de], vocab: [w.daquele, w.camiseta] }
      - { es: "Tem essa saia num tamanho grande?", en: "Do you have this skirt in a large size?", altEs: ["Tem essa saia em um tamanho grande?", "Tem esta saia num tamanho grande?"], grammar: [g.demonstratives, g.tem-there-is], vocab: [w.saia, w.tamanho] }
      - { es: "Aquilo ali é o Maracanã?", en: "Is that over there the Maracanã?", altEs: ["Aquilo lá é o Maracanã?"], grammar: [g.demonstratives], vocab: [w.aquilo] }
      - { es: "Nesse sábado tem jogo no Maracanã.", en: "This Saturday there's a match at the Maracanã.", altEs: ["Neste sábado tem jogo no Maracanã."], altEn: ["There's a game at the Maracanã this Saturday."], grammar: [g.demonstrative-contractions, g.tem-there-is], vocab: [w.nesse, w.jogo, w.sábado] }
      - { es: "Quero um quilo deste queijo.", en: "I'd like a kilo of this cheese.", altEs: ["Quero um quilo desse queijo.", "Eu quero um quilo deste queijo."], grammar: [g.demonstrative-contractions, g.quantity-words], vocab: [w.deste, w.quilo, w.queijo], transform: { instruction: "Change to 'that cheese over there'", answer: "Quero um quilo daquele queijo.", alt: ["Eu quero um quilo daquele queijo."], en: "I'd like a kilo of that cheese over there." } }
    exchanges:
      - q: { es: "Qual camiseta você quer?", en: "Which T-shirt do you want?" }
        a: { es: "Essa aqui, a amarela.", en: "This one here, the yellow one." }
        alt: ["Aquela ali.", "Essa azul.", "Esta aqui."]
        grammar: [g.demonstratives]
        vocab: [w.esse, w.camiseta]
      - q: { es: "O que é aquilo?", en: "What's that over there?" }
        a: { es: "É o Maracanã! Hoje tem jogo.", en: "It's the Maracanã! There's a match today." }
        alt: ["É o Maracanã.", "Não sei."]
        grammar: [g.demonstratives]
        vocab: [w.aquilo, w.jogo]
      - q: { es: "Posso provar esse vestido?", en: "Can I try on this dress?" }
        a: { es: "Pode, claro. É ali, à direita.", en: "Of course. It's over there, on the right." }
        alt: ["Pode, sim.", "Claro, pode."]
        grammar: [g.poder-present, g.yes-no-answers]
        vocab: [w.provar, w.vestido]
      - q: { es: "Você gosta dessa calça?", en: "Do you like these trousers?" }
        a: { es: "Gosto, mas é cara demais.", en: "I do, but they're too expensive." }
        alt: ["Gosto muito!", "Não, prefiro aquela.", "Não gosto."]
        grammar: [g.demonstrative-contractions, g.yes-no-answers]
        vocab: [w.desse, w.calça]
      - q: { es: "Que tamanho você usa?", en: "What size do you wear?" }
        a: { es: "Uso M.", en: "I wear medium." }
        alt: ["M, por favor.", "Uso G.", "Médio."]
        grammar: [g.question-words]
        vocab: [w.tamanho, w.usar]
    texts:
      - title: "Na loja"
        es: ["Essa camisa é bonita, mas é cara.", "Aquela ali está em promoção.", "Vou provar as duas!"]
        en: ["This shirt is nice, but it's expensive.", "That one over there is on sale.", "I'm going to try on both!"]
        grammar: [g.demonstratives]
        vocab: [w.esse, w.aquele, w.provar]
      - title: "Mensagem para a Bia"
        es: ["Bia, estou naquela loja perto do Maracanã.", "Tem camisetas do Flamengo por quarenta reais!", "Qual é o seu tamanho?"]
        en: ["Bia, I'm in that shop near the Maracanã.", "There are Flamengo T-shirts for forty reais!", "What's your size?"]
        grammar: [g.demonstrative-contractions, g.quanto-custa]
        vocab: [w.naquele, w.camiseta, w.tamanho]
    spicy:
      - { es: "Essa camisa fica linda em você.", en: "That shirt looks beautiful on you.", altEs: ["Esta camisa fica linda em você."], grammar: [g.demonstratives], vocab: [w.esse, w.camisa, w.lindo] }
      - { es: "Aquele rapaz de boné? Não, eu prefiro esse aqui na minha frente.", en: "That guy in the cap? No, I prefer this one here in front of me.", altEs: ["Aquela moça de boné? Não, eu prefiro essa aqui na minha frente."], grammar: [g.demonstratives], vocab: [w.aquele, w.esse, w.boné] }
