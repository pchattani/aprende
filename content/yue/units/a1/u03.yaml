      - { es: "我識講英文、法文同廣東話，仲識講「我鍾意你」。", en: "I can speak English, French and Cantonese, and I can also say 'I like you'.", altEs: ["我識講英文、法文同埋廣東話，仲識講「我鍾意你」。"], grammar: [g.nationality-language], vocab: [w.sik1-gong2] }
