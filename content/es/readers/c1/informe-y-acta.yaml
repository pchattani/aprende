id: r.c1.informe-y-acta
level: c1
title: Un resumen académico y un acta de reunión
kind: text
intro: "Two professional documents on the same topic, remote work. The first is the abstract of an academic study, written in impersonal, hedged register; the second is the minutes of a company meeting that discusses the study's findings. Compare how each genre handles the same facts."
allow: [madrid, garcía, lópez, ruiz, vega, soto, españa, españolas, español, mixto, representantes, aplicó, positiva, moderada, flexibilidad, horaria, teletrabajan, satisfacción, controlados, tipo, coordina, constituye, línea, futura, finanzas, ruegos, aplicables, expresan, iniciar, secretaria, evidencia]
paragraphs:
  - { es: "RESUMEN. El presente estudio analiza la relación entre el teletrabajo y la productividad en 120 empresas españolas de más de cincuenta empleados. Se aplicó un cuestionario a 1.400 trabajadores entre enero de 2023 y junio de 2025, y se compararon los resultados con los datos de facturación de cada empresa. Palabras clave: teletrabajo, productividad, conciliación, España.", en: "ABSTRACT. This study analyses the relationship between remote work and productivity in 120 Spanish companies with more than fifty employees. A questionnaire was given to 1,400 workers between January 2023 and June 2025, and the results were compared with each company's turnover figures. Keywords: remote work, productivity, work-life balance, Spain." }
  - { es: "Los datos parecen indicar una correlación positiva, si bien moderada, entre la flexibilidad horaria y el rendimiento. En líneas generales, los empleados que teletrabajan dos o tres días por semana declaran mayor satisfacción y faltan menos al trabajo. No es descartable, sin embargo, que parte de este efecto se deba a factores no controlados, como el tipo de tarea o la antigüedad en la empresa.", en: "The data seem to indicate a positive, albeit moderate, correlation between flexible hours and performance. Broadly speaking, employees who work remotely two or three days a week report greater satisfaction and are absent from work less. It cannot be ruled out, however, that part of this effect is due to uncontrolled factors, such as the type of task or length of service in the company." }
  - { es: "Cabe señalar que el teletrabajo a tiempo completo no mejora los resultados: en este sentido, nuestros datos coinciden con los de García y López (2022), según los cuales la desconexión del equipo perjudica, a la larga, la productividad. Como señalan dichos autores, «la cuestión no es dónde se trabaja, sino cómo se coordina el trabajo».", en: "It should be noted that full-time remote work does not improve results: in this regard, our data coincide with those of García and López (2022), according to whom disconnection from the team harms productivity in the long run. As these authors point out, 'the question is not where one works, but how the work is coordinated'." }
  - { es: "En síntesis, el estudio aporta evidencia a favor de un modelo mixto. Convendría, no obstante, ampliar la muestra a las pequeñas empresas antes de generalizar las conclusiones; esta limitación constituye, a nuestro juicio, la principal línea de investigación futura.", en: "In summary, the study provides evidence in favour of a hybrid model. It would, however, be advisable to extend the sample to small companies before generalising the conclusions; this limitation constitutes, in our view, the main line of future research." }
  - { es: "ACTA DE LA REUNIÓN DEL COMITÉ DE DIRECCIÓN. Fecha: 14 de octubre de 2026. Asistentes: Marta Ruiz (directora general), Luis Vega (finanzas), Ana Soto (recursos humanos) y dos representantes de la plantilla. Orden del día: primero, análisis del estudio sobre teletrabajo; segundo, propuesta de nuevo horario; tercero, ruegos y preguntas.", en: "MINUTES OF THE MANAGEMENT COMMITTEE MEETING. Date: 14 October 2026. Attendees: Marta Ruiz (managing director), Luis Vega (finance), Ana Soto (human resources) and two staff representatives. Agenda: one, analysis of the study on remote work; two, proposal for a new timetable; three, any other business." }
  - { es: "Desarrollo. Toma la palabra la directora general, quien resume las conclusiones del estudio y subraya que el modelo mixto es el que mejores resultados ofrece. El señor Vega puntualiza que la empresa tiene menos de cincuenta empleados y que, por tanto, los datos no son directamente aplicables; sugiere que se haga una prueba de seis meses antes de tomar una decisión definitiva.", en: "Proceedings. The managing director takes the floor, summarises the conclusions of the study and stresses that the hybrid model is the one that offers the best results. Mr Vega points out that the company has fewer than fifty employees and that, therefore, the data are not directly applicable; he suggests a six-month trial be carried out before taking a final decision." }
  - { es: "La señora Soto, por su parte, plantea que cualquier cambio de horario deberá pactarse con los representantes de la plantilla, quienes expresan su acuerdo con la prueba siempre que sea voluntaria. Acuerdos: se aprueba por unanimidad iniciar una prueba de teletrabajo mixto, de dos días por semana, a partir del 1 de diciembre; se encarga a recursos humanos la redacción del procedimiento.", en: "Mrs Soto, for her part, raises the point that any change of timetable must be agreed with the staff representatives, who express their agreement with the trial provided that it is voluntary. Agreements: it is unanimously approved to start a hybrid remote-work trial, of two days a week, from 1 December; human resources is tasked with drafting the procedure." }
  - { es: "Queda pendiente el punto tres del orden del día, que se tratará en la próxima reunión. Sin más asuntos que tratar, se levanta la sesión a las doce y cuarto. Firmado: la secretaria del comité.", en: "Item three on the agenda remains pending and will be dealt with at the next meeting. There being no further business, the meeting is closed at a quarter past twelve. Signed: the committee secretary." }
questions:
  - { q: "What relationship does the study find between flexible hours and performance?", options: ["None", "A positive but moderate correlation", "A strong negative correlation"], answer: 1 }
  - { q: "Why do the authors say the results should not yet be generalised?", options: ["Because the questionnaire was too short", "Because the sample does not include small companies", "Because the study only covered Madrid"], answer: 1 }
  - { q: "What objection does Mr Vega raise at the meeting?", options: ["That the study is too old", "That the company is smaller than those studied, so the data do not apply directly", "That remote work is illegal"], answer: 1 }
  - { q: "What condition do the staff representatives put on the trial?", options: ["That it be voluntary", "That it last a year", "That it include Fridays"], answer: 0 }
  - { q: "Which phrase shows that the decision was taken without any votes against?", options: ["Queda pendiente", "Se levanta la sesión", "Se aprueba por unanimidad"], answer: 2 }
