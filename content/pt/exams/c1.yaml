grammar:
  - { prompt: "Procuro um apartamento que ___ (ter) varanda. (Não sei se existe.)", options: ["tem", "terá", "tenha"], answer: 2, explain: "The subjunctive in a relative clause signals that the antecedent is hypothetical; tem would mean I know a specific one exists." }
  - { prompt: "Onde quer que você ___ (ir), leve um guarda-chuva.", options: ["vai", "vá", "foi"], answer: 1, explain: "Concessive relatives (onde quer que, quem quer que, o que quer que) take the subjunctive: onde quer que você vá." }
  - { prompt: "O fato de que ele não ___ (ligar) me preocupa.", options: ["tenha ligado", "ligou", "ligará"], answer: 0, explain: "O fato de que as a subject clause normally takes the subjunctive: tenha ligado." }
  - { prompt: "O candidato que não ___ (apresentar) os documentos será eliminado.", options: ["apresentar", "apresenta", "apresente"], answer: 0, explain: "Laws and regulations use the future subjunctive for conditions: quem / o que não apresentar." }
  - { prompt: "Vossa Excelência ___ razão, senhor ministro.", options: ["tendes", "tem", "têm"], answer: 1, explain: "Titles with Vossa take third-person singular verbs: Vossa Excelência tem." }
  - { prompt: "A proposta reduz custos; ___, aumenta os prazos.", options: ["com efeito", "por conseguinte", "em contrapartida"], answer: 2, explain: "em contrapartida introduces a counterbalancing point; com efeito confirms, por conseguinte draws a consequence." }
  - { prompt: "Machado e Alencar foram contemporâneos; ___ era irônico, este, romântico.", options: ["este", "esse", "aquele"], answer: 2, explain: "In paired reference, aquele points to the first-mentioned (Machado) and este to the last-mentioned (Alencar)." }
  - { prompt: "Só quando li o e-mail pela terceira vez é que me ___ a ficha.", options: ["caiu", "pisou", "pagou"], answer: 0, explain: "cair a ficha = for something to sink in (pisar na bola = mess up; pagar o pato = take the blame)." }
  - { prompt: "Quem não tem cão, caça com ___.", options: ["rato", "gato", "pato"], answer: 1, explain: "The proverb: make do with what you have." }
  - { prompt: "Ficamos conversando ___ a noite inteira, sem nenhum motivo especial.", options: ["à beça", "à vontade", "à toa"], answer: 2, explain: "à toa = aimlessly, for no reason; à beça = loads; à vontade = at ease." }
  - { prompt: "___ a Manaus, procuramos imediatamente um hotel.", options: ["Chegado", "Chegando", "Chegar"], answer: 1, explain: "A gerund clause can express time/sequence: chegando a Manaus = when we arrived in Manaus." }
  - { prompt: "___ a reunião, todos foram almoçar.", options: ["Terminada", "Terminando", "Terminado"], answer: 0, explain: "Absolute participle agreeing with its noun: terminada a reunião (= depois que a reunião terminou)." }
  - { prompt: "Ao ___ (nós, chegar), vimos os barcos no porto.", options: ["chegar", "chegarmos", "chegamos"], answer: 1, explain: "ao + personal infinitive with its own subject: ao chegarmos." }
  - { prompt: "Quando entrei na sala, ele já ___ (sair). (escrita formal)", options: ["sairia", "saísse", "saíra"], answer: 2, explain: "The simple pluperfect (saíra = tinha saído) is typical of literary and formal written Portuguese." }
  - { prompt: "“Pretender”, em português, significa:", options: ["ter a intenção de", "fingir", "imaginar"], answer: 0, explain: "False friend: pretender = to intend; 'to pretend' is fingir." }
writing:
  prompt: "The opinion section of a Brazilian newspaper has asked readers for columns on the question «O turismo pode salvar a Amazônia?». Write a column of at least 220 words in a formal but personal register: open with a nuanced thesis (embora…, cabe perguntar se…), build at least two long sentences with subordination, gerund or absolute participle clauses (terminada a visita…, levando em conta…), use at least two advanced discourse markers (com efeito, em contrapartida, no que tange a, dito isso), one idiom or proverb used appropriately, and a conclusion that does not merely repeat the introduction."
  minWords: 220
  modelAnswer: |
    Turismo na floresta: remédio ou veneno?

    Embora o turismo seja frequentemente apresentado como a grande alternativa ao desmatamento, cabe perguntar se ele é, de fato, capaz de salvar a Amazônia, ou se apenas troca um problema por outro. A meu ver, a resposta depende menos do número de visitantes do que de quem decide como eles chegam, onde ficam e para onde vai o dinheiro.

    Com efeito, há bons exemplos. Em comunidades do rio Negro, pousadas dirigidas pelos próprios moradores vêm gerando renda sem derrubar uma única árvore, e os guias, conhecendo a floresta como ninguém, transformam cada passeio numa aula de ciência e de história. Terminada a visita, o turista leva fotos e lembranças; a comunidade fica com recursos para manter a escola e o posto de saúde.

    Em contrapartida, no que tange aos grandes empreendimentos, o quadro é bem diferente. Hotéis construídos sem consulta às populações locais, navios que trazem milhares de pessoas num único dia e passeios que tratam os animais como espetáculo acabam pondo em risco justamente aquilo que os turistas vêm ver. Nesses casos, quem paga o pato são sempre os mesmos: os ribeirinhos e a própria floresta.

    Dito isso, não me parece razoável jogar fora o bebê com a água do banho. O turismo pode, sim, ajudar a proteger a Amazônia, desde que seja pequeno, controlado e, sobretudo, feito com as comunidades, e não apesar delas. A floresta não precisa de mais visitantes; precisa de visitantes melhores.
  checklist:
    - "I opened with a nuanced thesis that admits complexity (embora…, cabe perguntar se…, a meu ver…)."
    - "I used at least two advanced discourse markers correctly (com efeito, em contrapartida, no que tange a, dito isso)."
    - "I wrote long sentences with controlled subordination, including a gerund clause and an absolute participle (conhecendo a floresta…, terminada a visita…)."
    - "I used the subjunctive where required (embora seja, desde que seja)."
    - "I used at least one idiom or proverb naturally (pagar o pato, jogar fora o bebê com a água do banho)."
    - "My conclusion adds a final idea or formulation instead of repeating the introduction."
