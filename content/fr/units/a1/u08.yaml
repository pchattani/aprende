      - { es: "Quatre tranches de jambon, s'il vous plaît.", en: "Four slices of ham, please.", altEs: ["Je voudrais quatre tranches de jambon, s'il vous plaît."], grammar: [g.quantities], vocab: [w.tranche], transform: { instruction: "Ask for two slices", answer: "Deux tranches de jambon, s'il vous plaît.", en: "Two slices of ham, please." } }
