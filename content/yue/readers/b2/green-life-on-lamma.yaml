id: r.b2.green-life-on-lamma
level: b2
title: 南丫島嘅環保生活
kind: text
intro: Five years ago Joyce and her husband left a flat in Causeway Bay for a village house on Lamma Island. In this magazine column she explains how island life changed their habits - and why living green is harder than it looks.
paragraphs:
  - { es: "五年前，我同老公仲住喺銅鑼灣一個三百呎嘅單位。每日返工放工，坐地鐵、搭巴士，周圍都係人同車，空氣污染到連窗都唔敢開。有一晚，我哋喺露台見到對面大廈嘅冷氣機不斷噴熱風，老公忽然問我：「我哋係咪可以過另一種生活？」半年之後，我哋搬咗去南丫島。", en: "Five years ago my husband and I were still living in a three-hundred-square-foot flat in Causeway Bay. Every day we commuted by MTR and bus, surrounded by people and cars, and the air was so polluted we didn't even dare open the windows. One night, standing on the balcony watching the air conditioners on the building opposite blasting out hot air, my husband suddenly asked me: \"Could we live a different kind of life?\" Six months later, we moved to Lamma Island." }
  - { es: "南丫島冇私家車，大家出入都係行路或者踩單車。島上面有發電廠，亦都有一座風力發電機，係香港第一座商業規模嘅風車。我第一次行山經過嗰座風車，好難想像同一個島上面，一邊係燒煤嘅發電廠，一邊係用風發電嘅風車。呢個畫面令我諗咗好耐：我哋嘅生活方式，究竟要靠幾多能源先維持到？", en: "Lamma has no private cars; people get around on foot or by bike. The island has a power station, and also a wind turbine - Hong Kong's first commercial-scale wind turbine. The first time I hiked past it, I found it hard to imagine that on the same island there was a coal-burning power station on one side and a wind turbine on the other. That image made me think for a long time: how much energy does our way of life actually take to sustain?" }
  - { es: "搬嚟之後，我哋嘅習慣改變咗好多。因為由碼頭返屋企要行二十分鐘，買嘢都要自己拎，所以我哋唔會再亂咁買嘢。一買多咗，就要拎到手都斷，自然就學識只買需要嘅嘢。我哋又開始自備購物袋同食物盒，去餐廳食飯就帶埋自己嘅餐具，盡量唔用即棄嘅膠嘢。", en: "After moving here, our habits changed a lot. Because it's a twenty-minute walk from the pier to our house and we have to carry everything ourselves, we no longer buy things on impulse. If you buy too much, your arms feel like they're about to drop off, so you naturally learn to buy only what you need. We also started bringing our own shopping bags and food boxes, and when we eat out we take our own cutlery, avoiding disposable plastic as much as possible." }
  - { es: "最大嘅改變係對垃圾嘅態度。島上面嘅垃圾要用船運出市區處理，成本好高。所以我哋同鄰居組織咗一個回收小組，將膠樽、紙同鋁罐分類，每個月送去回收。我哋仲喺屋後面整咗個堆肥箱，將菜葉同果皮變成肥料，用嚟種番茄同香草。", en: "The biggest change was in our attitude to rubbish. Rubbish from the island has to be shipped to the urban area for processing, which is very costly. So we and our neighbours organised a recycling group, sorting plastic bottles, paper and aluminium cans and sending them for recycling every month. We also built a compost bin behind the house, turning vegetable leaves and fruit peel into fertiliser to grow tomatoes and herbs." }
  - { es: "每逢颱風之後，我哋都會參加淨灘活動。最令我震驚嘅係，沙灘上面嘅垃圾大部分唔係遊客留低嘅，而係由海上面沖上岸嘅：膠袋、膠飲管、發泡膠，甚至有好多唔同國家嘅膠樽。原來海洋垃圾係冇國界嘅，一個地方嘅污染，最終會影響晒所有人。海龜誤食膠袋，導致死亡嘅新聞，我以前睇完就算，而家每次見到都好心痛。", en: "After every typhoon we take part in beach clean-ups. What shocked me most was that most of the rubbish on the beach wasn't left by visitors; it had washed ashore from the sea: plastic bags, plastic straws, polystyrene, and even plastic bottles from lots of different countries. It turns out marine rubbish has no borders: pollution from one place eventually affects everyone. I used to read news stories about sea turtles dying after swallowing plastic bags and simply move on; now every time I see one, it breaks my heart." }
  - { es: "不過講真，環保生活唔係咁浪漫。夏天冇冷氣真係熱到瞓唔着，最後我哋都係裝咗一部，只係會設定喺二十六度。落大雨嘅時候，條路會變到好滑，買餸返嚟成身濕晒。有時朋友嚟探我哋，坐完船、行完路，第一句就係：「你哋點捱㗎？」", en: "But to be honest, green living isn't that romantic. In summer, without air conditioning it's so hot you can't sleep, and in the end we did install one - we just keep it set at twenty-six degrees. When it pours with rain the path becomes very slippery, and you come home from shopping soaked through. Sometimes when friends visit, after the ferry and the walk, the first thing they say is: \"How do you put up with this?\"" }
  - { es: "我會話佢哋知，環保唔係要做到完美，而係由一啲細嘅改變開始。你唔一定要搬去離島，只要每個人少用一個膠袋、少開一度冷氣，加埋就係好大嘅分別。南丫島教識我嘅，係簡單生活唔代表生活差咗，反而令我更加清楚自己真正需要啲乜嘢。", en: "I tell them that green living isn't about being perfect; it starts with small changes. You don't have to move to an outlying island; if everyone uses one less plastic bag and sets the air conditioning one degree warmer, together that makes a huge difference. What Lamma has taught me is that a simple life doesn't mean a worse life; if anything, it has made me see more clearly what I really need." }
questions:
  - { q: "點解Joyce同老公決定搬去南丫島？", options: ["想過另一種生活", "公司搬咗去南丫島", "銅鑼灣租金太貴"], answer: 0, explain: "老公忽然問我：「我哋係咪可以過另一種生活？」" }
  - { q: "南丫島上面有乜嘢令Joyce諗咗好耐？", options: ["發電廠同風車喺同一個島上", "冇私家車", "海鮮酒家"], answer: 0, explain: "一邊係燒煤嘅發電廠，一邊係用風發電嘅風車." }
  - { q: "點解佢哋唔再亂咁買嘢？", options: ["因為要自己拎返屋企，好重", "因為島上冇舖頭", "因為冇錢"], answer: 0, explain: "由碼頭返屋企要行二十分鐘，買嘢都要自己拎." }
  - { q: "沙灘上面大部分垃圾係邊度嚟？", options: ["遊客留低", "由海上面沖到沙灘", "居民掉嘅"], answer: 1, explain: "大部分唔係遊客留低嘅，而係由海上面沖上岸嘅." }
  - { q: "佢哋點樣用冷氣？", options: ["完全唔用", "裝咗一部，設定喺二十六度", "日日開到十八度"], answer: 1, explain: "最後我哋都係裝咗一部，只係會設定喺二十六度." }
  - { q: "Joyce覺得環保應該點樣開始？", options: ["一定要搬去離島", "由細嘅改變開始", "要做到完美"], answer: 1, explain: "環保唔係要做到完美，而係由一啲細嘅改變開始." }
