id: c1.u03
title: "Il sottoscritto dichiara"
lessons:
  - id: c1.u03.l1
    title: La sottoscritta chiede il rilascio
    teach: [g.bureaucratic-italian]
    vocab: [w.sottoscritto, w.autocertificazione, w.certificato, w.attestato, w.attestare, w.documentazione, w.pratica, w.procedura, w.sportello, w.anagrafe, w.residenza, w.domicilio, w.codice-fiscale, w.tessera-sanitaria, w.permesso-di-soggiorno, w.marca-da-bollo, w.bollo, w.richiedente, w.rilasciare, w.rilascio, w.rinnovo, w.rinnovare, w.intestatario, w.delegato, w.delega, w.in-fede, w.modulistica, w.esibire, w.apporre, w.previo, w.veritiero, w.sezione, w.nulla-osta]
    tip: "Burocratese has its own words: il sottoscritto (I), il richiedente (the applicant), rilasciare (to issue), previa (after, subject to), si prega di (please). Learn to read it; in your own writing, prefer plain Italian."
    sentences:
      - { es: "La sottoscritta Giulia Ferrante dichiara di essere residente a Cefalù, in via Roma 12.", en: "I, the undersigned Giulia Ferrante, declare that I am resident in Cefalù, at via Roma 12.", grammar: [g.bureaucratic-italian], vocab: [w.sottoscritto, w.residenza] }
      - { es: "Io, Giulia Ferrante, abito a Cefalù.", en: "I, Giulia Ferrante, live in Cefalù.", grammar: [g.bureaucratic-italian], vocab: [], transform: { instruction: "Rewrite it in bureaucratic style (La sottoscritta… dichiara di…)", answer: "La sottoscritta Giulia Ferrante dichiara di essere residente a Cefalù.", alt: ["La sottoscritta Giulia Ferrante dichiara di risiedere a Cefalù."], en: "I, the undersigned Giulia Ferrante, declare that I am resident in Cefalù." } }
      - { es: "Si prega di allegare copia del documento d'identità e del codice fiscale.", en: "Please attach a copy of your identity document and tax code.", altEs: ["Si prega di allegare una copia del documento d'identità e del codice fiscale."], grammar: [g.bureaucratic-italian, g.si-impersonale], vocab: [w.codice-fiscale] }
      - { es: "Per il rinnovo della carta d'identità bisogna prenotare un appuntamento all'anagrafe.", en: "To renew your identity card you need to book an appointment at the registry office.", altEs: ["Per il rinnovo della carta d'identità occorre prenotare un appuntamento all'anagrafe."], grammar: [g.bureaucratic-italian], vocab: [w.rinnovo, w.anagrafe] }
      - { es: "Lo sportello dell'anagrafe riceve il pubblico dal lunedì al venerdì, dalle nove alle dodici.", en: "The registry office counter is open to the public from Monday to Friday, from nine to twelve.", grammar: [g.bureaucratic-italian], vocab: [w.sportello, w.anagrafe] }
      - { es: "Il certificato viene rilasciato in giornata, previa presentazione della marca da bollo.", en: "The certificate is issued on the same day, on presentation of the revenue stamp.", grammar: [g.bureaucratic-italian, g.passive-venire], vocab: [w.certificato, w.rilasciare, w.previo, w.marca-da-bollo], error: { wrong: "Il certificato viene rilasciato in giornata, previo presentazione della marca da bollo.", explain: "previo agrees with the noun that follows: previa presentazione (f), previo pagamento (m).", grammar: g.bureaucratic-italian } }
      - { es: "Per la tessera sanitaria basta un'autocertificazione.", en: "For the health card a self-certification is enough.", altEs: ["Per la tessera sanitaria è sufficiente un'autocertificazione."], grammar: [g.bureaucratic-italian], vocab: [w.tessera-sanitaria, w.autocertificazione] }
      - { es: "Il rinnovo del permesso di soggiorno va chiesto almeno sessanta giorni prima della scadenza.", en: "Renewal of the residence permit must be requested at least sixty days before it expires.", altEs: ["Il rinnovo del permesso di soggiorno deve essere chiesto almeno sessanta giorni prima della scadenza."], grammar: [g.bureaucratic-italian, g.passive-andare], vocab: [w.permesso-di-soggiorno, w.rinnovo] }
      - { es: "Il domicilio può essere diverso dalla residenza.", en: "Your address for correspondence can be different from your place of residence.", grammar: [g.bureaucratic-italian], vocab: [w.domicilio, w.residenza] }
      - { es: "Chi non può presentarsi di persona può firmare una delega.", en: "Anyone who can't come in person can sign a proxy.", grammar: [g.relative-chi-quello-che], vocab: [w.delega] }
      - { es: "Il delegato deve esibire il proprio documento e quello del richiedente.", en: "The proxy must show his own identity document and the applicant's.", grammar: [g.bureaucratic-italian], vocab: [w.delegato, w.esibire, w.richiedente] }
      - { es: "L'intestatario del contratto deve apporre la firma in fondo al modulo.", en: "The holder of the contract must sign at the bottom of the form.", altEs: ["L'intestatario del contratto deve firmare in fondo al modulo."], grammar: [g.bureaucratic-italian], vocab: [w.intestatario, w.apporre] }
      - { es: "Tutta la documentazione richiesta si trova sul sito, nella sezione modulistica.", en: "All the required documentation can be found on the website, in the forms section.", grammar: [g.si-passivante], vocab: [w.documentazione, w.modulistica] }
      - { es: "Mi hanno detto di tornare domani: la pratica non è ancora pronta.", en: "They told me to come back tomorrow: the paperwork isn't ready yet.", altEs: ["Mi hanno detto di ripassare domani: la pratica non è ancora pronta."], grammar: [g.reported-commands-di], vocab: [w.pratica] }
      - { es: "Il sottoscritto attesta che i dati riportati sono veritieri.", en: "The undersigned certifies that the data given are true.", grammar: [g.bureaucratic-italian], vocab: [w.attestare, w.veritiero] }
      - { es: "Mi serve il certificato di residenza.", en: "I need my certificate of residence.", grammar: [g.bureaucratic-italian], vocab: [w.certificato], transform: { instruction: "Turn it into a formal request (Il sottoscritto chiede…)", answer: "Il sottoscritto chiede il rilascio del certificato di residenza.", alt: ["La sottoscritta chiede il rilascio del certificato di residenza."], en: "The undersigned requests the issue of a certificate of residence." } }
    exchanges:
      - q: { es: "Buongiorno, che documenti servono per la residenza?", en: "Good morning, what documents do I need for residence?" }
        a: { es: "Il modulo compilato, un documento d'identità e il codice fiscale.", en: "The completed form, an identity document and your tax code." }
        alt: ["Il modulo, un documento e il codice fiscale.", "Trova l'elenco sul sito, nella sezione modulistica."]
        grammar: [g.bureaucratic-italian]
        vocab: [w.residenza, w.codice-fiscale]
      - q: { es: "Posso mandare mio marito al posto mio?", en: "Can I send my husband in my place?" }
        a: { es: "Sì, ma deve portare una delega firmata e una copia del Suo documento.", en: "Yes, but he must bring a signed proxy and a copy of your identity document." }
        alt: ["Sì, con una delega firmata.", "Certo, basta una delega."]
        grammar: [g.lei-forms]
        vocab: [w.delega]
      - q: { es: "Quando posso ritirare il certificato?", en: "When can I collect the certificate?" }
        a: { es: "Se la pratica è in regola, glielo rilasciamo subito.", en: "If the paperwork is in order, we'll issue it to you straight away." }
        alt: ["Anche subito, se è tutto in regola.", "Domani mattina, allo sportello tre."]
        grammar: [g.combined-pronouns]
        vocab: [w.rilasciare, w.pratica]
      - q: { es: "Ho perso la tessera sanitaria. Che cosa devo fare?", en: "I've lost my health card. What should I do?" }
        a: { es: "Può chiederne un'altra online o allo sportello dell'ASL.", en: "You can request another one online or at the health authority desk." }
        alt: ["Ne chieda un'altra all'ASL.", "Deve chiedere un duplicato."]
        grammar: [g.ne-partitive, g.lei-forms]
        vocab: [w.tessera-sanitaria, w.sportello]
      - q: { es: "Serve la marca da bollo?", en: "Do I need a revenue stamp?" }
        a: { es: "Sì, da sedici euro; la trova in qualsiasi tabaccheria.", en: "Yes, a sixteen-euro one; you can find it at any tobacconist's." }
        alt: ["Sì, da sedici euro.", "Sì, il bollo è obbligatorio per il certificato."]
        grammar: [g.lei-forms]
        vocab: [w.marca-da-bollo, w.bollo]
      - q: { es: "Ho seguito tutta la procedura: perché non mi hanno ancora dato l'attestato?", en: "I followed the whole procedure: why haven't they given me the certificate yet?" }
        a: { es: "Forse manca il rilascio del nulla osta: chieda allo sportello.", en: "Perhaps the clearance hasn't been issued yet: ask at the counter." }
        alt: ["Chieda allo sportello.", "Ci vuole ancora qualche giorno."]
        grammar: [g.imperativo-lei]
        vocab: [w.procedura, w.attestato, w.rilascio]
    texts:
      - title: "Dichiarazione sostitutiva"
        es: ["Il sottoscritto Salvatore Cusimano, nato a Cefalù il 3 marzo 1980,", "dichiara di essere residente in via Roma 25.", "Si allega copia del documento d'identità.", "In fede, Salvatore Cusimano."]
        en: ["I, the undersigned Salvatore Cusimano, born in Cefalù on 3 March 1980,", "declare that I am resident at via Roma 25.", "A copy of my identity document is attached.", "In witness whereof, Salvatore Cusimano."]
        grammar: [g.bureaucratic-italian]
        vocab: [w.sottoscritto, w.in-fede]
      - title: "Avviso allo sportello"
        es: ["Per il rinnovo dei documenti è necessario prenotare online.", "I richiedenti senza prenotazione saranno ricevuti solo in caso di urgenza.", "Si ringrazia per la collaborazione."]
        en: ["To renew documents you must book online.", "Applicants without a booking will only be seen in an emergency.", "Thank you for your cooperation."]
        grammar: [g.bureaucratic-italian, g.passive-essere]
        vocab: [w.rinnovare, w.richiedente]
    spicy:
      - { es: "Il sottoscritto dichiara di essersi innamorato allo sportello numero tre.", en: "The undersigned declares that he fell in love at counter number three.", grammar: [g.bureaucratic-italian, g.past-infinitive], vocab: [w.sottoscritto, w.sportello] }
      - { es: "Si prega di allegare il proprio numero di telefono alla richiesta di caffè.", en: "Please attach your phone number to the coffee request.", grammar: [g.bureaucratic-italian], vocab: [] }
      - { es: "Ti rilascio un attestato di simpatia, valido fino al prossimo litigio.", en: "I hereby issue you a certificate of fondness, valid until our next argument.", grammar: [g.bureaucratic-italian], vocab: [w.rilasciare, w.attestato] }
      - { es: "Per il rinnovo del nostro appuntamento serve solo la Sua firma… e una cena.", en: "To renew our date, all that's needed is your signature… and a dinner.", grammar: [g.bureaucratic-italian], vocab: [w.rinnovo] }
      - { es: "In fede, la persona che ti guarda da mezz'ora dalla fila accanto.", en: "Yours faithfully, the person who's been watching you for half an hour from the next queue.", grammar: [g.bureaucratic-italian], vocab: [w.in-fede] }
  - id: c1.u03.l2
    title: Verificata la documentazione
    teach: [g.participio-assoluto]
    vocab: [w.protocollo, w.delibera, w.decreto, w.normativa, w.regolamento, w.disposizione, w.comma, w.ai-sensi-di, w.in-base-a, w.ai-fini-di, w.ottemperare, w.adempiere, w.adempimento, w.istanza, w.ricorso, w.termine, w.sanzione, w.ammenda, w.contravvenzione, w.notificare, w.notifica, w.vigente, w.compiuto, w.terminato, w.participio, w.evacuare, w.frazione, w.portuale, w.assessore, w.sosta, w.accertare, w.cessare, w.chiusura, w.autorità, w.indicare, w.regolarmente, w.assoluto, w.rivolgersi, w.istituzionale]
    tip: "A past participle at the start of the sentence, agreeing with its own noun, means 'once / after X was done': Verificata la documentazione… (f. sing.), Terminati i lavori… (m. pl.). Typical of notices, news and official letters."
    sentences:
      - { es: "Considerata l'allerta meteo, il sindaco ha disposto la chiusura delle scuole.", en: "Given the weather warning, the mayor has ordered the schools to close.", altEs: ["Vista l'allerta meteo, il sindaco ha disposto la chiusura delle scuole."], grammar: [g.participio-assoluto], vocab: [] }
      - { es: "Verificata la documentazione, l'ufficio provvederà al rilascio del certificato.", en: "Once the documentation has been checked, the office will issue the certificate.", grammar: [g.participio-assoluto, g.bureaucratic-italian], vocab: [w.documentazione, w.provvedere, w.rilascio] }
      - { es: "Terminati i lavori, il porto riaprirà ai pescatori.", en: "Once the work is finished, the harbour will reopen to the fishermen.", altEs: ["Finiti i lavori, il porto riaprirà ai pescatori."], grammar: [g.participio-assoluto], vocab: [w.terminato], error: { wrong: "Terminato i lavori, il porto riaprirà ai pescatori.", explain: "The absolute participle agrees with its own noun: i lavori (m. pl.) → terminati.", grammar: g.participio-assoluto } }
      - { es: "Ai sensi del regolamento comunale, è vietato parcheggiare sul lungomare.", en: "Under the municipal regulations, parking on the seafront is prohibited.", altEs: ["In base al regolamento comunale, è vietato parcheggiare sul lungomare."], grammar: [g.bureaucratic-italian], vocab: [w.ai-sensi-di, w.regolamento] }
      - { es: "Dopo aver ricevuto la notifica, il cittadino può fare ricorso.", en: "After receiving the notification, the citizen can appeal.", grammar: [g.participio-assoluto, g.past-infinitive], vocab: [w.notifica, w.ricorso], transform: { instruction: "Use an absolute participle instead of dopo aver…", answer: "Ricevuta la notifica, il cittadino può fare ricorso.", alt: [], en: "Having received the notification, the citizen can appeal." } }
      - { es: "In base alla normativa vigente, la contravvenzione va pagata entro sessanta giorni.", en: "Under current regulations, the fine must be paid within sixty days.", grammar: [g.bureaucratic-italian, g.passive-andare], vocab: [w.in-base-a, w.normativa, w.vigente, w.contravvenzione] }
      - { es: "Ai fini del rimborso, l'istanza deve pervenire entro il termine indicato.", en: "For the purposes of the refund, the application must arrive by the stated deadline.", grammar: [g.bureaucratic-italian], vocab: [w.ai-fini-di, w.istanza, w.termine] }
      - { es: "Pagata l'ammenda, il caso è chiuso.", en: "Once the fine is paid, the case is closed.", altEs: ["Una volta pagata l'ammenda, il caso è chiuso."], grammar: [g.participio-assoluto], vocab: [w.ammenda] }
      - { es: "Il comma 3 dell'articolo 5 prevede un'eccezione per i residenti.", en: "Paragraph 3 of article 5 provides for an exception for residents.", grammar: [g.bureaucratic-italian], vocab: [w.comma] }
      - { es: "Con la delibera numero 45, la giunta ha approvato il nuovo regolamento del porto.", en: "With resolution number 45, the council executive approved the new harbour regulations.", grammar: [g.bureaucratic-italian], vocab: [w.delibera, w.regolamento] }
      - { es: "Il decreto entra in vigore il giorno successivo alla pubblicazione.", en: "The decree comes into force on the day after publication.", grammar: [g.bureaucratic-italian], vocab: [w.decreto] }
      - { es: "Data l'urgenza, gli abitanti della frazione sono stati evacuati in serata.", en: "Given the urgency, the residents of the hamlet were evacuated in the evening.", grammar: [g.participio-assoluto, g.passive-essere], vocab: [w.frazione, w.evacuare] }
      - { es: "I cittadini sono tenuti a ottemperare alle disposizioni dell'autorità portuale.", en: "Citizens are required to comply with the harbour authority's provisions.", grammar: [g.bureaucratic-italian], vocab: [w.ottemperare, w.disposizione, w.portuale] }
      - { es: "Adempiuti tutti gli obblighi, l'assessore ha firmato il protocollo d'intesa.", en: "Having fulfilled all the obligations, the councillor signed the memorandum of understanding.", grammar: [g.participio-assoluto], vocab: [w.adempiere, w.assessore, w.protocollo] }
      - { es: "Compiuti diciotto anni, si può votare.", en: "Once you've turned eighteen, you can vote.", altEs: ["Una volta compiuti diciotto anni, si può votare."], grammar: [g.participio-assoluto, g.si-impersonale], vocab: [w.compiuto, w.participio], note: "compiere gli anni = to have a birthday; compiuti i diciotto anni = having turned eighteen." }
      - { es: "Quando avrà verificato i dati, l'ufficio Le notificherà la decisione.", en: "When it has checked the data, the office will notify you of the decision.", grammar: [g.participio-assoluto, g.futuro-anteriore], vocab: [w.notificare], transform: { instruction: "Replace the time clause with an absolute participle", answer: "Verificati i dati, l'ufficio Le notificherà la decisione.", alt: ["Una volta verificati i dati, l'ufficio Le notificherà la decisione."], en: "Once the data has been checked, the office will notify you of the decision." } }
    exchanges:
      - q: { es: "Quando riapre la strada per Gibilmanna?", en: "When does the road to Gibilmanna reopen?" }
        a: { es: "Terminati i lavori, cioè tra due settimane.", en: "Once the work is finished, so in two weeks." }
        alt: ["Tra due settimane, finiti i lavori.", "Appena finiscono i lavori."]
        grammar: [g.participio-assoluto]
        vocab: [w.terminato]
      - q: { es: "Ho preso una multa per sosta vietata. Posso fare ricorso?", en: "I got a parking fine. Can I appeal?" }
        a: { es: "Sì, entro trenta giorni dalla notifica, davanti al giudice di pace.", en: "Yes, within thirty days of notification, before the justice of the peace." }
        alt: ["Sì, entro trenta giorni.", "Certo, ma conviene pagare la sanzione ridotta."]
        grammar: [g.bureaucratic-italian]
        vocab: [w.sosta, w.ricorso, w.notifica]
      - q: { es: "Perché hanno chiuso le scuole?", en: "Why have they closed the schools?" }
        a: { es: "Data l'allerta meteo, il sindaco ha preferito non rischiare.", en: "Given the weather warning, the mayor preferred not to take risks." }
        alt: ["Per l'allerta meteo.", "Considerato il maltempo, era più prudente."]
        grammar: [g.participio-assoluto]
        vocab: []
      - q: { es: "Chi ha firmato la delibera sul porto?", en: "Who signed the resolution on the harbour?" }
        a: { es: "L'assessore al turismo, sentito il parere della giunta.", en: "The councillor for tourism, having heard the executive's opinion." }
        alt: ["L'assessore al turismo.", "La giunta, all'unanimità."]
        grammar: [g.participio-assoluto]
        vocab: [w.delibera, w.assessore]
      - q: { es: "Il regolamento vale anche per i turisti?", en: "Do the regulations apply to tourists as well?" }
        a: { es: "Certo: la normativa è vigente per tutti, e la sanzione pure.", en: "Of course: the rules are in force for everyone, and so is the penalty." }
        alt: ["Sì, vale per tutti.", "Certo, residenti e non."]
        grammar: [g.bureaucratic-italian]
        vocab: [w.normativa, w.vigente, w.sanzione]
      - q: { es: "Perché nei moduli c'è sempre un participio all'inizio della frase?", en: "Why is there always a participle at the start of the sentence on forms?" }
        a: { es: "Perché il participio assoluto è breve e preciso: «verificati i dati», «pagata l'ammenda».", en: "Because the absolute participle is short and precise: «verificati i dati», «pagata l'ammenda»." }
        alt: ["Perché è più breve.", "È tipico dello stile burocratico."]
        grammar: [g.participio-assoluto]
        vocab: [w.participio]
    texts:
      - title: "Avviso del Comune"
        es: ["Considerata l'allerta meteo, domani le scuole resteranno chiuse.", "Si invitano i cittadini a evitare il lungomare e la zona portuale.", "Cessata l'allerta, i servizi riprenderanno regolarmente.", "Per ogni altro adempimento, rivolgersi allo sportello del Comune."]
        en: ["In view of the weather warning, the schools will stay closed tomorrow.", "Citizens are asked to avoid the seafront and the harbour area.", "Once the warning has ended, services will resume as normal.", "For any other formalities, please contact the town hall counter."]
        grammar: [g.participio-assoluto, g.bureaucratic-italian]
        vocab: [w.portuale, w.cessare, w.adempimento]
      - title: "Verbale di contravvenzione"
        es: ["Accertata la sosta in zona vietata, si notifica la presente contravvenzione.", "L'ammenda va pagata entro sessanta giorni.", "Contro il presente verbale è ammesso ricorso."]
        en: ["Having established that the vehicle was parked in a prohibited zone, notice of this fine is hereby served.", "The fine must be paid within sixty days.", "An appeal may be lodged against this report."]
        grammar: [g.participio-assoluto, g.passive-andare]
        vocab: [w.accertare, w.notificare, w.contravvenzione, w.ammenda]
    spicy:
      - { es: "Finita la riunione, l'assessore mi ha chiesto il numero, per motivi non istituzionali.", en: "When the meeting was over, the councillor asked for my number, for non-official reasons.", grammar: [g.participio-assoluto], vocab: [w.assessore, w.istituzionale] }
      - { es: "Ricevuta la tua notifica alle due di notte, ho capito che non dormivi pensando a me.", en: "Having got your notification at two in the morning, I realised you couldn't sleep for thinking of me.", grammar: [g.participio-assoluto], vocab: [w.notifica] }
      - { es: "Considerata l'ora, ti accompagno a casa; considerata la luna, facciamo il giro lungo.", en: "Given the time, I'll walk you home; given the moon, let's take the long way round.", grammar: [g.participio-assoluto], vocab: [] }
      - { es: "Pagata l'ammenda per il parcheggio, mi restavano solo i soldi per un gelato: per fortuna l'hai offerto tu.", en: "Once I'd paid the parking fine, I only had money left for an ice cream: luckily you paid for it.", grammar: [g.participio-assoluto], vocab: [w.ammenda] }
      - { es: "Ai sensi del regolamento del nostro primo appuntamento, il dolce si divide a metà.", en: "Under the regulations of our first date, dessert is split down the middle.", grammar: [g.bureaucratic-italian], vocab: [w.ai-sensi-di, w.regolamento] }
  - id: c1.u03.l3
    title: Il vivere a Cefalù
    teach: [g.infinito-sostantivato]
    vocab: [w.contribuente, w.dichiarazione-dei-redditi, w.imposta, w.detrazione, w.rimborsare, w.esente, w.beneficiare, w.beneficiario, w.usufruire, w.avvalersi, w.effettuare, w.provvedere, w.espletare, w.burocrazia, w.burocratico, w.pubblica-amministrazione, w.funzionario, w.ente, w.firma-digitale, w.passatempo, w.commercialista, w.tremare, w.calare, w.contributo, w.umore]
    tip: "Any infinitive can be a masculine noun: Viaggiare apre la mente; il vivere in un'isola; nel compilare il modulo (while filling in the form); al calar del sole (at sunset). Italian never uses the gerund as a noun."
    sentences:
      - { es: "Il vivere in una piccola città ha i suoi ritmi.", en: "Living in a small town has its own rhythms.", altEs: ["Vivere in una piccola città ha i suoi ritmi."], grammar: [g.infinito-sostantivato], vocab: [] }
      - { es: "Il mangiare siciliano è una cosa seria.", en: "Sicilian food is a serious matter.", grammar: [g.infinito-sostantivato], vocab: [w.il-mangiare] }
      - { es: "Nel compilare la dichiarazione dei redditi, ho dimenticato una detrazione.", en: "While filling in my tax return, I forgot a deduction.", altEs: ["Compilando la dichiarazione dei redditi, ho dimenticato una detrazione."], grammar: [g.infinito-sostantivato], vocab: [w.dichiarazione-dei-redditi, w.detrazione] }
      - { es: "Fare la fila allo sportello è il nostro passatempo nazionale.", en: "Queuing at the counter is our national pastime.", grammar: [g.infinito-sostantivato], vocab: [w.passatempo, w.sportello] }
      - { es: "Il sapere non occupa spazio, ma la modulistica sì.", en: "Knowledge takes up no space, but the paperwork does.", grammar: [g.infinito-sostantivato], vocab: [w.il-sapere, w.modulistica] }
      - { es: "Al calar del sole, i turisti lasciano la spiaggia e passeggiano sul lungomare.", en: "At sunset, the tourists leave the beach and stroll along the seafront.", grammar: [g.infinito-sostantivato], vocab: [], note: "al calar del sole = a + il + calare (apocopated)." }
      - { es: "Il continuo cambiare delle regole rende la burocrazia ancora più lenta.", en: "The constant changing of the rules makes bureaucracy even slower.", grammar: [g.infinito-sostantivato], vocab: [w.burocrazia] }
      - { es: "Nuotare tra la Rocca e il porto fa bene alla salute.", en: "Swimming between the Rock and the harbour is good for your health.", grammar: [g.infinito-sostantivato], vocab: [], error: { wrong: "Nuotando tra la Rocca e il porto fa bene alla salute.", explain: "An activity used as a subject is an infinitive in Italian (nuotare), never a gerund (nuotando).", grammar: g.infinito-sostantivato } }
      - { es: "Ogni contribuente può beneficiare di alcune detrazioni.", en: "Every taxpayer can benefit from some deductions.", grammar: [g.bureaucratic-italian], vocab: [w.contribuente, w.beneficiare, w.detrazione] }
      - { es: "I beneficiari del contributo sono esenti dall'imposta per un anno.", en: "Those receiving the grant are exempt from the tax for a year.", grammar: [g.bureaucratic-italian], vocab: [w.beneficiario, w.esente, w.imposta] }
      - { es: "Per usufruire del servizio online bisogna avere la firma digitale.", en: "To use the online service you need a digital signature.", grammar: [g.bureaucratic-italian], vocab: [w.usufruire, w.firma-digitale] }
      - { es: "Ci siamo avvalsi di un commercialista per espletare tutte le pratiche.", en: "We used an accountant to deal with all the paperwork.", grammar: [g.pronominal-verbs], vocab: [w.avvalersi, w.commercialista, w.espletare] }
      - { es: "L'ente provvederà a rimborsare le spese entro novanta giorni.", en: "The agency will refund the expenses within ninety days.", grammar: [g.bureaucratic-italian], vocab: [w.ente, w.provvedere, w.rimborsare] }
      - { es: "Il suo parlare così burocratico mi fa ridere.", en: "The way he talks, so bureaucratic, makes me laugh.", altEs: ["Il suo modo di parlare così burocratico mi fa ridere."], grammar: [g.infinito-sostantivato], vocab: [w.burocratico] }
      - { es: "Quando ho aperto la busta del Comune, mi tremavano le mani.", en: "When I opened the envelope from the town hall, my hands were shaking.", grammar: [g.infinito-sostantivato], vocab: [w.tremare], transform: { instruction: "Use nel + infinitive for the time clause", answer: "Nell'aprire la busta del Comune, mi tremavano le mani.", alt: ["Aprendo la busta del Comune, mi tremavano le mani."], en: "As I opened the envelope from the town hall, my hands were shaking." } }
      - { es: "Mi piace vivere al mare.", en: "I like living by the sea.", grammar: [g.infinito-sostantivato], vocab: [], transform: { instruction: "Make the infinitive the subject, with the article", answer: "Il vivere al mare mi piace.", alt: ["Vivere al mare mi piace."], en: "Living by the sea appeals to me." } }
    exchanges:
      - q: { es: "Che cosa ti manca di più di Cefalù?", en: "What do you miss most about Cefalù?" }
        a: { es: "Il mangiare, il chiacchierare con i vicini e il passeggiare sul lungomare.", en: "The food, chatting with the neighbours and strolling on the seafront." }
        alt: ["Il mare e il mangiare.", "Il passeggiare sul lungomare."]
        grammar: [g.infinito-sostantivato]
        vocab: [w.il-mangiare]
      - q: { es: "Hai già fatto la dichiarazione dei redditi?", en: "Have you done your tax return yet?" }
        a: { es: "Sì, mi sono avvalsa di un commercialista: con la burocrazia italiana è più sicuro.", en: "Yes, I used an accountant: with Italian bureaucracy it's safer." }
        alt: ["Sì, me l'ha fatta il commercialista.", "Non ancora, scade a settembre."]
        grammar: [g.pronominal-verbs]
        vocab: [w.dichiarazione-dei-redditi, w.avvalersi, w.burocrazia]
      - q: { es: "Chi può beneficiare dello sconto?", en: "Who can benefit from the discount?" }
        a: { es: "I residenti e gli studenti; i bambini sotto i sei anni sono esenti dal biglietto.", en: "Residents and students; children under six don't need a ticket." }
        alt: ["I residenti e gli studenti.", "Chi risiede a Cefalù."]
        grammar: [g.bureaucratic-italian]
        vocab: [w.beneficiare, w.esente]
      - q: { es: "Come si paga l'imposta di soggiorno?", en: "How do you pay the tourist tax?" }
        a: { es: "Si paga in albergo, che poi provvede a versarla al Comune.", en: "You pay it at the hotel, which then sees to paying it to the town council." }
        alt: ["In albergo, alla partenza.", "La paga in albergo."]
        grammar: [g.si-impersonale]
        vocab: [w.imposta, w.provvedere]
      - q: { es: "Perché sei così di buon umore?", en: "Why are you in such a good mood?" }
        a: { es: "Mi hanno rimborsato le tasse: il ricevere soldi dallo Stato è un'emozione rara.", en: "They've refunded my taxes: getting money from the State is a rare thrill." }
        alt: ["Mi hanno rimborsato le tasse!", "Il funzionario è stato gentilissimo."]
        grammar: [g.infinito-sostantivato]
        vocab: [w.rimborsare]
      - q: { es: "Con chi devo parlare per la mia pratica?", en: "Who should I talk to about my case?" }
        a: { es: "Con il funzionario del secondo piano: è l'unico che conosca bene la pubblica amministrazione.", en: "With the official on the second floor: he's the only one who really knows the public administration." }
        alt: ["Con il funzionario del secondo piano.", "Chieda all'ufficio informazioni."]
        grammar: [g.congiuntivo-nuance]
        vocab: [w.funzionario, w.pubblica-amministrazione]
    texts:
      - title: "Dal blog di un'inglese a Cefalù"
        es: ["Il vivere qui è un piacere, e il fare la spesa al mercato è un rito.", "Il difficile è l'avere a che fare con la burocrazia.", "Ma al calar del sole, davanti al Duomo, si dimentica tutto."]
        en: ["Living here is a pleasure, and doing the shopping at the market is a ritual.", "The hard part is dealing with bureaucracy.", "But at sunset, in front of the cathedral, you forget everything."]
        grammar: [g.infinito-sostantivato]
        vocab: [w.burocrazia]
    spicy:
      - { es: "Il tuo camminare sul lungomare dovrebbe essere vietato da un decreto.", en: "The way you walk along the seafront should be banned by decree.", grammar: [g.infinito-sostantivato], vocab: [w.decreto] }
      - { es: "Il baciarsi in pubblico, a Cefalù, è esente da imposta.", en: "Kissing in public, in Cefalù, is tax-exempt.", grammar: [g.infinito-sostantivato], vocab: [w.esente, w.imposta] }
      - { es: "Nel guardarti, ho dimenticato il numero di protocollo.", en: "Looking at you, I forgot the reference number.", altEs: ["Guardandoti, ho dimenticato il numero di protocollo."], grammar: [g.infinito-sostantivato], vocab: [w.protocollo] }
      - { es: "Il tuo sorridere allo sportello ha reso piacevole perfino la burocrazia.", en: "Your smiling at the counter made even bureaucracy pleasant.", grammar: [g.infinito-sostantivato], vocab: [w.burocrazia] }
      - { es: "Il saper cucinare è una dote; il saper lavare i piatti dopo, un miracolo.", en: "Knowing how to cook is a gift; knowing how to wash up afterwards, a miracle.", grammar: [g.infinito-sostantivato], vocab: [w.dote, w.miracolo] }
  - id: c1.u03.l4
    title: Dal burocratese all'italiano chiaro
    teach: [g.bureaucratic-italian, g.participio-assoluto]
    vocab: [w.medesimo, w.nonché, w.altresì, w.apposito, w.idoneo, w.pervenire, w.obbligatorio, w.facoltativo, w.disdetta, w.evincere, w.articolarsi, w.burocratese, w.restituzione, w.deposito, w.possesso, w.risiedere, w.familiare, w.concentrazione, w.oppure, w.mancante, w.odierno]
    tip: "Read burocratese, write plain Italian: in data odierna → oggi; effettuare il pagamento → pagare; codesto ufficio → il vostro ufficio. Entro takes no preposition: entro il 30 giugno."
    sentences:
      - { es: "Con la presente si comunica la disdetta del contratto di affitto.", en: "We hereby give notice of termination of the rental contract.", grammar: [g.bureaucratic-italian], vocab: [w.disdetta] }
      - { es: "La disdetta deve pervenire almeno sei mesi prima della scadenza.", en: "Notice of termination must arrive at least six months before the expiry date.", grammar: [g.bureaucratic-italian], vocab: [w.disdetta, w.pervenire] }
      - { es: "La domanda va presentata entro e non oltre il 30 giugno.", en: "Applications must be submitted no later than 30 June.", grammar: [g.bureaucratic-italian, g.passive-andare], vocab: [], error: { wrong: "La domanda va presentata entro e non oltre del 30 giugno.", explain: "entro takes the date directly, with no preposition: entro il 30 giugno.", grammar: g.bureaucratic-italian } }
      - { es: "Dal documento si evince che il pagamento non è mai stato effettuato.", en: "It can be inferred from the document that the payment was never made.", grammar: [g.bureaucratic-italian, g.passive-essere], vocab: [w.evincere, w.effettuare] }
      - { es: "Il corso si articola in tre moduli: due obbligatori e uno facoltativo.", en: "The course is divided into three modules: two compulsory and one optional.", grammar: [g.bureaucratic-italian], vocab: [w.articolarsi, w.obbligatorio, w.facoltativo] }
      - { es: "Le visite guidate al Duomo si effettuano previa prenotazione.", en: "Guided tours of the cathedral are by prior booking only.", grammar: [g.bureaucratic-italian, g.si-passivante], vocab: [w.effettuare, w.previo] }
      - { es: "Il candidato deve essere in possesso di un titolo di studio idoneo.", en: "The candidate must hold a suitable qualification.", grammar: [g.bureaucratic-italian], vocab: [w.possesso, w.idoneo] }
      - { es: "Si allega altresì copia del contratto.", en: "A copy of the contract is also attached.", grammar: [g.bureaucratic-italian], vocab: [w.altresì] }
      - { es: "Il richiedente, nonché i suoi familiari, deve risiedere nel medesimo comune.", en: "The applicant, as well as his family members, must reside in the same municipality.", grammar: [g.bureaucratic-italian], vocab: [w.nonché, w.familiare, w.risiedere, w.medesimo] }
      - { es: "Le risposte vanno scritte nell'apposito spazio in fondo alla pagina.", en: "Answers must be written in the space provided at the bottom of the page.", grammar: [g.passive-andare], vocab: [w.apposito] }
      - { es: "Codesto ufficio è pregato di inviare la documentazione mancante.", en: "Your office is kindly requested to send the missing documentation.", grammar: [g.bureaucratic-italian], vocab: [w.documentazione], note: "codesto = your (the addressee's), only in bureaucratic letters." }
      - { es: "Esaminata la Sua richiesta, siamo lieti di comunicarLe che è stata accolta.", en: "Having examined your request, we are pleased to inform you that it has been accepted.", grammar: [g.participio-assoluto, g.lei-forms], vocab: [] }
      - { es: "Scaduto il termine, non sarà più possibile presentare ricorso.", en: "Once the deadline has passed, it will no longer be possible to appeal.", grammar: [g.participio-assoluto], vocab: [w.termine, w.ricorso] }
      - { es: "Il burocratese si può quasi sempre riscrivere in un italiano più semplice.", en: "Bureaucratese can almost always be rewritten in simpler Italian.", grammar: [g.bureaucratic-italian, g.si-passivante], vocab: [w.burocratese] }
      - { es: "Si comunica che in data odierna l'ufficio resterà chiuso.", en: "Please note that the office will be closed today.", grammar: [g.bureaucratic-italian], vocab: [], transform: { instruction: "Say it in plain Italian", answer: "Oggi l'ufficio è chiuso.", alt: ["L'ufficio oggi è chiuso.", "Oggi l'ufficio resta chiuso.", "Oggi l'ufficio resterà chiuso."], en: "The office is closed today." } }
      - { es: "Il pagamento deve essere effettuato presso qualsiasi ufficio postale.", en: "Payment must be made at any post office.", grammar: [g.bureaucratic-italian], vocab: [w.effettuare], transform: { instruction: "Say it in plain Italian, addressing the reader as Lei", answer: "Può pagare in qualsiasi ufficio postale.", alt: ["Può pagare in un qualsiasi ufficio postale.", "Paghi in qualsiasi ufficio postale."], en: "You can pay at any post office." } }
    exchanges:
      - q: { es: "Come comincio una lettera formale al Comune?", en: "How do I start a formal letter to the town council?" }
        a: { es: "Con «Spettabile Comune di Cefalù» e poi «Il sottoscritto…».", en: "With «Spettabile Comune di Cefalù» and then «Il sottoscritto…»." }
        alt: ["Con «Spettabile Comune».", "Con «Gentili Signori»."]
        grammar: [g.formal-letters]
        vocab: [w.sottoscritto]
      - q: { es: "Che cosa significa «previo appuntamento»?", en: "What does «previo appuntamento» mean?" }
        a: { es: "Che bisogna prenotare prima: senza appuntamento non ti ricevono.", en: "That you have to book beforehand: without an appointment they won't see you." }
        alt: ["Che serve un appuntamento.", "Solo su appuntamento."]
        grammar: [g.bureaucratic-italian]
        vocab: [w.previo]
      - q: { es: "Il corso di sicurezza è obbligatorio?", en: "Is the safety course compulsory?" }
        a: { es: "Sì, mentre quello di inglese è facoltativo.", en: "Yes, whereas the English one is optional." }
        alt: ["Sì, per tutti.", "Sì, è obbligatorio per legge."]
        grammar: [g.bureaucratic-italian]
        vocab: [w.obbligatorio, w.facoltativo]
      - q: { es: "Che cosa si evince dalla lettera del proprietario?", en: "What can be inferred from the landlord's letter?" }
        a: { es: "Che vuole la casa libera entro giugno, ma non dice niente sul deposito.", en: "That he wants the house vacated by June, but he says nothing about the deposit." }
        alt: ["Che vuole la casa libera entro giugno.", "Che dobbiamo lasciare l'appartamento."]
        grammar: [g.bureaucratic-italian]
        vocab: [w.evincere, w.deposito]
      - q: { es: "Come si chiude una lettera formale?", en: "How do you close a formal letter?" }
        a: { es: "Con «Distinti saluti» oppure, nelle dichiarazioni, con «In fede».", en: "With «Distinti saluti» or, in declarations, with «In fede»." }
        alt: ["Con «Distinti saluti».", "Con «Cordiali saluti»."]
        grammar: [g.formal-letters]
        vocab: [w.in-fede]
    texts:
      - title: "Lettera di disdetta"
        es: ["Spettabile agenzia,", "con la presente il sottoscritto comunica la disdetta del contratto di affitto dell'appartamento di via Mandralisca 7.", "Restituite le chiavi, si prega di provvedere alla restituzione del deposito.", "Distinti saluti."]
        en: ["Dear Sirs,", "I, the undersigned, hereby give notice of termination of the rental contract for the flat at via Mandralisca 7.", "Once the keys have been returned, please arrange for the deposit to be refunded.", "Yours faithfully."]
        grammar: [g.bureaucratic-italian, g.participio-assoluto]
        vocab: [w.disdetta, w.restituzione, w.deposito]
      - title: "La stessa lettera, in italiano chiaro"
        es: ["Cara agenzia,", "lascio l'appartamento di via Mandralisca 7.", "Quando vi avrò dato le chiavi, restituitemi per favore il deposito.", "Saluti."]
        en: ["Dear agency,", "I'm leaving the flat at via Mandralisca 7.", "When I've given you the keys, please give me back my deposit.", "Regards."]
        grammar: [g.bureaucratic-italian, g.futuro-anteriore]
        vocab: [w.deposito]
    spicy:
      - { es: "Con la presente La informo che il Suo sorriso è pericoloso per la mia concentrazione.", en: "I hereby inform you that your smile is dangerous for my concentration.", grammar: [g.bureaucratic-italian, g.lei-forms], vocab: [w.concentrazione] }
      - { es: "Si comunica altresì che sono libero sabato sera, previo invito a cena.", en: "Notice is also given that I am free on Saturday evening, subject to a dinner invitation.", grammar: [g.bureaucratic-italian], vocab: [w.altresì, w.previo] }
      - { es: "Dalla Sua lettera si evince un certo interesse per la sottoscritta.", en: "A certain interest in the undersigned can be inferred from your letter.", grammar: [g.bureaucratic-italian], vocab: [w.evincere, w.sottoscritto] }
      - { es: "Esaminato il Suo curriculum sentimentale, siamo lieti di offrirLe un secondo appuntamento.", en: "Having examined your romantic CV, we are pleased to offer you a second date.", grammar: [g.participio-assoluto, g.lei-forms], vocab: [w.sentimentale] }
      - { es: "La sottoscritta richiede un caffè, nonché la Sua compagnia, entro e non oltre le cinque.", en: "The undersigned requests a coffee, as well as your company, no later than five o'clock.", grammar: [g.bureaucratic-italian], vocab: [w.nonché, w.sottoscritto] }
dialogues:
  - id: c1.u03.d1
    title: All'anagrafe di Cefalù
    context: Amelia, an Englishwoman who has just moved to Cefalù, applies for residence at the registry office.
    lines:
      - { speaker: Funzionaria, es: "Buongiorno, si accomodi. Di che cosa ha bisogno?", en: "Good morning, take a seat. What do you need?" }
      - { speaker: Amelia, es: "Mi sono trasferita a Cefalù e vorrei chiedere la residenza.", en: "I've moved to Cefalù and I'd like to apply for residence." }
      - { speaker: Funzionaria, es: "Benissimo. Ha compilato il modulo? Va firmato qui, nell'apposito spazio.", en: "Very good. Have you filled in the form? It needs to be signed here, in the space provided." }
      - { speaker: Amelia, es: "Sì, ma non capisco questa frase: «consapevole delle sanzioni previste dalla legge».", en: "Yes, but I don't understand this sentence: «aware of the penalties provided by law»." }
      - { speaker: Funzionaria, es: "Significa che, firmato il modulo, Lei è responsabile di quello che dichiara.", en: "It means that, once you've signed the form, you're responsible for what you declare." }
      - { speaker: Amelia, es: "Ah, ho capito. Serve altro?", en: "Ah, I see. Is anything else needed?" }
      - { speaker: Funzionaria, es: "Il documento d'identità, il codice fiscale e il contratto d'affitto. Verificati i dati, un vigile passerà a casa Sua.", en: "Your identity document, your tax code and your rental contract. Once the details have been checked, a municipal officer will come to your home." }
      - { speaker: Amelia, es: "Un vigile? E quando?", en: "A municipal officer? And when?" }
      - { speaker: Funzionaria, es: "Entro quarantacinque giorni. Nel frattempo, la pratica risulta in corso.", en: "Within forty-five days. In the meantime, your application is shown as in progress." }
      - { speaker: Amelia, es: "Il vivere in Italia è bellissimo, ma il fare le pratiche è un'arte!", en: "Living in Italy is wonderful, but doing the paperwork is an art!" }
      - { speaker: Funzionaria, es: "Lo dica a me, signora: io ci lavoro da trent'anni!", en: "You're telling me, madam: I've been working here for thirty years!" }
    questions:
      - { q: "Che cosa vuole chiedere Amelia?", options: ["Il permesso di guida", "La residenza", "Un certificato di nascita"], answer: 1, explain: "Vorrei chiedere la residenza." }
      - { q: "Che cosa succede una volta verificati i dati?", options: ["Amelia deve pagare un'ammenda", "Riceve subito la carta d'identità", "Un vigile passa a casa sua"], answer: 2, explain: "Verificati i dati, un vigile passerà a casa Sua: an absolute participle." }
      - { q: "Entro quanto tempo passerà il vigile?", options: ["Una settimana", "Tre mesi", "Quarantacinque giorni"], answer: 2, explain: "Entro quarantacinque giorni." }
      - { q: "Come si rivolge la funzionaria ad Amelia?", options: ["Con il tu", "Con il Lei", "Con il voi"], answer: 1, explain: "She uses the formal Lei: si accomodi, Lei è responsabile, lo dica a me." }
writing:
  - task: "Write a formal request to the registry office (Ufficio Anagrafe) of Cefalù for a residence certificate, in bureaucratic style (La sottoscritta…, chiede il rilascio di…, allega…)."
    min: 110
    max: 180
    use: [w.sottoscritto, w.rilascio, w.certificato, w.residenza, w.marca-da-bollo]
    grammar: [g.bureaucratic-italian]
    expect:
      - { pattern: "\\b(il sottoscritto|la sottoscritta)\\b", hint: "Present yourself in bureaucratic style: Il sottoscritto / La sottoscritta…" }
      - { pattern: "\\b(chiede|richiede)\\s+(il|la|l['’])\\s*\\S+", hint: "State the request: chiede il rilascio di…" }
    model: { es: "Al Comune di Cefalù, Ufficio Anagrafe. Oggetto: richiesta di certificato di residenza. La sottoscritta Emma Clarke, nata a Leeds, nel Regno Unito, il 3 marzo 1995 e residente a Cefalù in via Vittorio Emanuele 12, chiede il rilascio di un certificato di residenza da presentare alla propria banca. A tal fine allega copia del documento d'identità e del codice fiscale. La sottoscritta dichiara inoltre di essere a conoscenza che il certificato in bollo richiede una marca da bollo da sedici euro, che consegnerà al momento del ritiro. Chiede inoltre che il certificato le venga inviato anche per email. Resta a disposizione per ulteriori informazioni e ringrazia per l'attenzione. Cefalù, 15 ottobre 2026. In fede.", en: "To the Municipality of Cefalù, Registry Office. Subject: request for a residence certificate. The undersigned Emma Clarke, born in Leeds, in the United Kingdom, on 3 March 1995 and resident in Cefalù at Via Vittorio Emanuele 12, requests the issue of a residence certificate to present to her bank. To this end she encloses a copy of her identity document and tax code. The undersigned also declares that she is aware that the stamped certificate requires a sixteen-euro revenue stamp, which she will hand in on collection. She also asks for the certificate to be sent to her by e-mail as well. She remains available for any further information and thanks you for your attention. Cefalù, 15 October 2026. In good faith." }
  - task: "Write an official notice from the town hall about road closures for the patron saint's festival, using absolute participles (Considerata…, Accertata…, Terminata la processione…) and formulas like ai sensi di."
    min: 110
    max: 180
    use: [w.ai-sensi-di, w.chiusura, w.sosta, w.sanzione, w.accertare]
    grammar: [g.participio-assoluto, g.bureaucratic-italian]
    expect:
      - { pattern: "\\b(considerat|verificat|terminat|accertat|vist|sentit|conclus|ottenut|ricevut|valutat|esaminat)[oaie]\\s+(il|la|i|le|l['’]|gli|lo)", hint: "Open with absolute participles: Considerata la festa…, Terminata la processione…" }
    model: { es: "Avviso alla cittadinanza. Considerata la festa del Santo Patrono prevista per il 6 agosto, e accertato il bisogno di garantire la sicurezza dei cittadini e dei visitatori, si comunica quanto segue. Ai sensi del regolamento comunale vigente, dalle ore 18 alle ore 24 è disposta la chiusura al traffico del centro storico. Durante questo periodo è vietata la sosta in Piazza Duomo e nelle strade vicine; i proprietari delle auto in sosta riceveranno una sanzione. Terminata la processione, le strade saranno riaperte al traffico. Si invitano i residenti a lasciare libere le strade del centro entro le ore 17. Per ulteriori informazioni, i cittadini sono pregati di rivolgersi agli uffici della Polizia Municipale. Si ringraziano tutti i cittadini per la collaborazione. Il Sindaco.", en: "Notice to residents. In view of the patron saint's festival scheduled for 6 August, and the need to guarantee the safety of residents and visitors having been established, the following is announced. Pursuant to the municipal regulations in force, the historic centre will be closed to traffic from 6 p.m. to midnight. During this period parking is forbidden in Piazza Duomo and the neighbouring streets; the owners of parked cars will receive a fine. Once the procession is over, the streets will reopen to traffic. Residents are asked to leave the streets of the centre clear by 5 p.m. For further information, residents are requested to contact the offices of the Municipal Police. All residents are thanked for their cooperation. The Mayor." }
