id: a2.u12
title: 上個週末
lessons:
  - id: a2.u12.l1
    title: 食飯之前，食飯之後
    teach: [g.ji-cin-ji-hau]
    tip: "之前 'before' and 之後 'after' follow the event, and the whole phrase comes first: 食飯之前洗手. 'Ago' is 前 after the time: 三年前."
    vocab: [w.zi1-cin4, w.zi1-hau6, w.ji5-hau6, w.go2-maan5, w.go2-jat6, w.sau2-sin1, w.dat6-jin4, w.ging1-gwo3, w.jyu6-dou2, w.tin1-hak1, w.faan1-hoeng1-haa2, w.baai3-san4, w.taam3, w.gau3-zung1, w.gai3, w.ping4-jat6, w.bin3-sing4, w.gai3-zuk6, w.soeng6-go3-zau1-mut6, w.cin4]
    sentences:
      - { es: "食飯之前要洗手。", en: "Wash your hands before eating.", altEs: ["食飯之前記得洗手。", "食飯前要洗手。"], altEn: ["You must wash your hands before meals."], grammar: [g.ji-cin-ji-hau, g.jiu-must-m-sai], vocab: [w.zi1-cin4, w.sai2-sau2] }
      - { es: "放工之後我去咗健身。", en: "After work I went to the gym.", altEs: ["我放工之後去咗健身。", "放工後我去咗健身。"], grammar: [g.ji-cin-ji-hau, g.zo-perfective], vocab: [w.zi1-hau6, w.gin6-san1] }
      - { es: "上個週末，我哋去咗九龍寨城公園。", en: "Last weekend we went to Kowloon Walled City Park.", altEs: ["我哋上個週末去咗九龍寨城公園。"], grammar: [g.time-before-verb, g.zo-perfective], vocab: [w.soeng6-go3-zau1-mut6, w.gung1-jyun2] }
      - { es: "九龍寨城以前住咗好多人，而家變成咗公園。", en: "Lots of people used to live in Kowloon Walled City; now it has become a park.", altEs: ["九龍寨城以前有好多人住，而家變成咗公園。"], grammar: [g.zo-perfective], vocab: [w.ji5-cin4, w.bin3-sing4] }
      - { es: "首先我哋去咗飲茶，跟住去公園行吓。", jp: "sau2 sin1 ngo5 dei6 heoi3 zo2 jam2 caa4 gan1 zyu6 heoi3 gung1 jyun2 haang4 haa5", en: "First we went for yum cha, then we took a walk in the park.", altEs: ["首先我哋去飲茶，跟住去公園行吓。"], grammar: [g.sin-zoi-sequence, g.haa-briefly], vocab: [w.sau2-sin1, w.gan1-zyu6.b] }
      - { es: "我經過公園嘅時候，突然落雨。", en: "As I was passing the park, it suddenly started to rain.", altEs: ["我經過公園嗰陣，突然落雨。"], grammar: [g.ge-si-hau], vocab: [w.ging1-gwo3, w.dat6-jin4] }
      - { es: "嗰日我喺九龍城遇到我以前嘅老師。", en: "That day I ran into my old teacher in Kowloon City.", altEs: ["嗰日我喺九龍城撞到我以前嘅老師。"], grammar: [g.ge-possessive], vocab: [w.go2-jat6, w.jyu6-dou2, w.lou5-si1] }
      - { es: "嗰晚我哋傾到天黑先返屋企。", jp: "go2 maan5 ngo5 dei6 king1 dou3 tin1 hak1 sin1 faan1 uk1 kei2", en: "That evening we chatted until it got dark before going home.", altEs: ["嗰晚我哋傾到天黑先至返屋企。"], grammar: [g.ji-cin-ji-hau], vocab: [w.go2-maan5, w.tin1-hak1] }
      - { es: "星期日我返鄉下探婆婆。", en: "On Sunday I went back to my home village to visit Grandma.", altEs: ["星期日我返咗鄉下探婆婆。"], grammar: [g.serial-verbs], vocab: [w.faan1-hoeng1-haa2, w.taam3, w.po4-po2] }
      - { es: "去黃大仙拜神之前，佢買咗啲香。", en: "Before going to pray at Wong Tai Sin, she bought some incense.", altEs: ["去黃大仙拜神前，佢買咗啲香。"], grammar: [g.ji-cin-ji-hau], vocab: [w.baai3-san4, w.zi1-cin4] }
      - { es: "兩年前我喺九龍城住。", en: "Two years ago I lived in Kowloon City.", altEs: ["我兩年前喺九龍城住。", "兩年之前我喺九龍城住。"], grammar: [g.ji-cin-ji-hau], vocab: [w.cin4] }
      - { es: "我平日好忙，週末先至得閒。", en: "I'm busy on weekdays, I'm only free at weekends.", altEs: ["我平日好忙，週末先得閒。"], grammar: [g.ji-cin-ji-hau], vocab: [w.ping4-jat6, w.sin1-zi3] }
      - { es: "夠鐘喇，你計吓我哋使咗幾多錢。", jp: "gau3 zung1 laa3 nei5 gai3 haa5 ngo5 dei6 sai2 zo2 gei2 do1 cin2", en: "Time's up, work out how much we've spent.", altEs: ["夠鐘喇，你計吓用咗幾多錢。"], grammar: [g.laa3-change, g.haa-briefly], vocab: [w.gau3-zung1, w.gai3] }
      - { es: "以後我會早啲起身。", en: "From now on I'll get up earlier.", altEs: ["我以後會早啲起身。"], grammar: [g.wui-will], vocab: [w.ji5-hau6, w.hei2-san1] }
      - { es: "食完飯，我哋繼續傾偈。", en: "After eating, we carried on chatting.", altEs: ["食完飯之後，我哋繼續傾偈。"], grammar: [g.ji-cin-ji-hau], vocab: [w.gai3-zuk6, w.king1-gai2] }
      - { es: "我返到屋企之後沖涼。", jp: "ngo5 faan1 dou3 uk1 kei2 zi1 hau6 cung1 loeng4", en: "I have a shower after I get home.", altEs: ["返到屋企之後我沖涼。"], grammar: [g.ji-cin-ji-hau], vocab: [w.zi1-hau6, w.cung1-loeng4], error: { wrong: "我之後返到屋企沖涼。", explain: "之後 follows the event it refers to: 返到屋企之後.", grammar: g.ji-cin-ji-hau } }
      - { es: "我出門口，我熄燈。", en: "I go out, I turn off the lights.", altEs: ["我出門口，熄燈。"], grammar: [g.ji-cin-ji-hau], vocab: [w.sik1.b, w.dang1], transform: { instruction: "Say you turn off the lights before going out, with 之前", answer: "我出門口之前熄燈。", alt: ["出門口之前我熄燈。", "我出門口之前熄咗燈。"], en: "I turn off the lights before I go out." } }
      - { es: "我做完功課，去踢波。", en: "I finish my homework and go to play football.", altEs: ["我做完功課就去踢波。"], grammar: [g.ji-cin-ji-hau], vocab: [w.gung1-fo3, w.tek3-bo1], transform: { instruction: "Use 之後 to say what you do afterwards", answer: "我做完功課之後去踢波。", alt: ["做完功課之後我去踢波。"], en: "After I finish my homework I go and play football." } }
    exchanges:
      - q: { es: "你上個週末做咗啲咩呀？", en: "What did you do last weekend?" }
        a: { es: "我去咗九龍寨城公園，之後去九龍城食泰國菜。", en: "I went to Kowloon Walled City Park, then had Thai food in Kowloon City." }
        alt: ["我返咗鄉下。", "我去咗公園行吓。"]
        grammar: [g.ji-cin-ji-hau, g.zo-perfective]
        vocab: [w.soeng6-go3-zau1-mut6, w.zi1-hau6]
      - q: { es: "你幾時嚟香港㗎？", en: "When did you come to Hong Kong?" }
        a: { es: "我三年前嚟㗎。", en: "I came three years ago." }
        alt: ["三年前。", "我兩年前嚟咗。"]
        grammar: [g.ji-cin-ji-hau]
        vocab: [w.cin4]
      - q: { es: "食飯之前你做咩呀？", en: "What do you do before dinner?" }
        a: { es: "我通常去跑步，之後沖涼。", en: "I usually go running and then have a shower." }
        alt: ["我煮飯。", "我去跑步。"]
        grammar: [g.ji-cin-ji-hau, g.frequency-adverbs]
        vocab: [w.zi1-cin4, w.zi1-hau6]
      - q: { es: "嗰晚你哋傾到幾點呀？", en: "How late did you chat that night?" }
        a: { es: "傾到十二點先返屋企。", en: "Until twelve before we went home." }
        alt: ["好夜。", "傾到十二點。"]
        grammar: [g.ji-cin-ji-hau]
        vocab: [w.go2-maan5]
      - q: { es: "你平日幾點放工呀？", en: "What time do you usually finish work on weekdays?" }
        a: { es: "六點，不過放工之後要去買餸。", en: "Six, but after work I have to buy groceries." }
        alt: ["六點。", "通常七點。"]
        grammar: [g.ji-cin-ji-hau, g.clock-time]
        vocab: [w.ping4-jat6, w.maai5-sung3]
    texts:
      - title: "週末日記"
        es: ["上個週末，我同朋友去咗九龍寨城公園。", "以前好多人住喺度，而家變成咗一個好靜嘅中式公園。", "行完之後，我哋去咗九龍城食泰國菜。"]
        en: ["Last weekend I went to Kowloon Walled City Park with friends.", "Lots of people used to live there; now it's a quiet Chinese-style park.", "After our walk we went for Thai food in Kowloon City."]
        grammar: [g.ji-cin-ji-hau, g.zo-perfective]
        vocab: [w.soeng6-go3-zau1-mut6, w.bin3-sing4, w.zi1-hau6]
    spicy:
      - { es: "識你之前，我週末淨係瞓覺；識你之後，我瞓唔着。", en: "Before I met you I slept all weekend; since I met you, I can't sleep.", altEs: ["識你之前我週末淨係瞓覺，識你之後我瞓唔着。"], grammar: [g.ji-cin-ji-hau, g.zing-hai-only], vocab: [w.zi1-cin4, w.zi1-hau6] }
      - { es: "嗰晚我哋傾到天黑，你仲記唔記得？", jp: "go2 maan5 ngo5 dei6 king1 dou3 tin1 hak1 nei5 zung6 gei3 m4 gei3 dak1", en: "That night we talked until it got dark, do you still remember?", altEs: ["嗰晚我哋傾到天黑，你記唔記得呀？"], grammar: [g.a-not-a-questions], vocab: [w.go2-maan5, w.tin1-hak1] }
      - { es: "我經過你屋企樓下，突然好想見你。", en: "I walked past your building and suddenly really wanted to see you.", altEs: ["我經過你樓下，突然好想見你。"], grammar: [g.ji-cin-ji-hau], vocab: [w.ging1-gwo3, w.dat6-jin4] }
      - { es: "食飯之前，我想講：你今日好靚。", en: "Before we eat, I'd like to say something: you look gorgeous today.", altEs: ["食飯之前我想講，你今日好靚。"], grammar: [g.ji-cin-ji-hau], vocab: [w.zi1-cin4, w.leng3] }
      - { es: "以後你嘅週末，可唔可以留畀我？", en: "From now on, could you save your weekends for me?", altEs: ["以後你啲週末，可唔可以留畀我？"], grammar: [g.ho-ji-can-may], vocab: [w.ji5-hau6, w.zau1-mut6] }
  - id: a2.u12.l2
    title: 返到屋企就瞓
    teach: [g.zau-then]
    tip: "就 goes after the subject, right before the verb: 我返到屋企就瞓 'as soon as I got home I slept'; 我七點就起身 'I was up as early as seven'."
    vocab: [w.zau6-hai6, w.sin1-zi3, w.fan3-aan3-gaau3, w.sou3-dei6, w.bou1-kek6, w.kek6, w.din6-si6-kek6, w.jin2-jyun4, w.go1-sau2, w.fong3, w.baai2, w.deu6, w.laai1, w.teoi1, w.gwaan1, w.ceoi4, w.je5-caan1, w.siu1-je5-sik6]
    sentences:
      - { es: "我返到屋企就瞓覺。", jp: "ngo5 faan1 dou3 uk1 kei2 zau6 fan3 gaau3", en: "I went to bed as soon as I got home.", altEs: ["我返到屋企就瞓咗。", "返到屋企我就瞓覺。"], grammar: [g.zau-then], vocab: [w.zau6, w.fan3-gaau3] }
      - { es: "食完飯就走啦。", en: "Let's leave right after eating.", altEs: ["食完飯我哋就走啦。"], grammar: [g.zau-then, g.ji-cin-ji-hau], vocab: [w.sik6-jyun4, w.zau6] }
      - { es: "我七點就起身，好早。", en: "I was up as early as seven, really early.", altEs: ["我七點就起咗身，好早。"], grammar: [g.zau-then], vocab: [w.hei2-san1] }
      - { es: "佢一陣就到。", jp: "keoi5 jat1 zan6 zau6 dou3", en: "She'll be here in a moment.", altEs: ["佢一陣間就到。", "佢就嚟到。"], altEn: ["He'll arrive shortly."], grammar: [g.zau-then], vocab: [w.jat1-zan6, w.dou3.b] }
      - { es: "就係呢度！", en: "This is the place!", altEs: ["就係呢度喇！"], altEn: ["Here it is!"], grammar: [g.zau-then], vocab: [w.zau6-hai6] }
      - { es: "星期六下晝我喺屋企瞓晏覺。", en: "On Saturday afternoon I had a nap at home.", altEs: ["星期六下晝我喺屋企瞓咗晏覺。"], grammar: [g.zo-perfective], vocab: [w.fan3-aan3-gaau3] }
      - { es: "星期日我喺屋企煲劇，煲咗成日。", en: "On Sunday I binge-watched a series at home all day.", altEs: ["星期日我喺屋企煲咗成日劇。"], grammar: [g.duration], vocab: [w.bou1-kek6, w.seng4-jat6] }
      - { es: "嗰套電視劇好好睇，個男演員好靚仔。", en: "That TV series is great, and the leading man is really handsome.", altEs: ["嗰套劇好好睇，個男演員好靚仔。"], grammar: [g.classifier-as-the], vocab: [w.din6-si6-kek6, w.kek6, w.jin2-jyun4] }
      - { es: "掃完地，我就去買餸。", en: "After sweeping the floor, I went to buy groceries.", altEs: ["掃完地我就去買餸。"], grammar: [g.zau-then, g.ji-cin-ji-hau], vocab: [w.sou3-dei6, w.maai5-sung3] }
      - { es: "天氣好，我哋去公園野餐啦。", en: "The weather's nice, let's go for a picnic in the park.", altEs: ["天氣咁好，我哋去公園野餐啦。"], grammar: [g.laa1-suggestion], vocab: [w.je5-caan1, w.gung1-jyun2] }
      - { es: "我哋喺海邊燒嘢食，食到天黑。", jp: "ngo5 dei6 hai2 hoi2 bin1 siu1 je5 sik6 sik6 dou3 tin1 hak1", en: "We had a barbecue by the sea and ate until it got dark.", altEs: ["我哋喺海邊燒嘢食，一路食到天黑。"], grammar: [g.ji-cin-ji-hau], vocab: [w.siu1-je5-sik6, w.hoi2-bin1] }
      - { es: "唔該幫我關燈，我想瞓喇。", en: "Please turn off the light for me, I want to sleep.", altEs: ["唔該幫我熄燈，我想瞓喇。"], grammar: [g.bong-help, g.laa3-change], vocab: [w.gwaan1, w.dang1] }
      - { es: "道門要推，唔係拉。", en: "You push this door, not pull it.", altEs: ["呢道門要推，唔係拉。"], grammar: [g.jiu-must-m-sai], vocab: [w.teoi1, w.laai1, w.mun4] }
      - { es: "返到屋企，除咗對鞋先入嚟。", jp: "faan1 dou3 uk1 kei2 ceoi4 zo2 deoi3 haai4 sin1 jap6 lai4", en: "When you get home, take your shoes off before coming in.", altEs: ["返到屋企，除咗鞋先入嚟。"], grammar: [g.sin-zoi-sequence], vocab: [w.ceoi4, w.haai4] }
      - { es: "唔要嘅嘢就掉咗佢啦。", en: "Just throw away the things you don't want.", altEs: ["唔要嘅嘢就掉咗佢。"], grammar: [g.zau-then, g.laa1-suggestion], vocab: [w.deu6] }
      - { es: "本書放喺枱面就得，啲杯擺喺廚房。", en: "Just put the book on the table, and put the cups in the kitchen.", altEs: ["本書放喺枱面就得，啲杯放喺廚房。"], grammar: [g.zau-then, g.hai2-location], vocab: [w.fong3, w.baai2] }
      - { es: "個歌手唱完，我哋就返屋企。", en: "As soon as the singer finished, we went home.", altEs: ["個歌手唱完我哋就返屋企。"], grammar: [g.zau-then], vocab: [w.go1-sau2, w.coeng3] }
      - { es: "我十二點先至瞓。", en: "I didn't go to bed until twelve.", altEs: ["我十二點先瞓。"], grammar: [g.zau-then], vocab: [w.sin1-zi3], note: "就 means 'as early as', 先至 means 'not until': 七點就起身 vs 十二點先至瞓." }
      - { es: "食完飯，我就去搵你。", en: "After I've eaten, I'll come and find you.", altEs: ["食完飯我就去搵你。"], grammar: [g.zau-then], vocab: [w.zau6, w.wan2], error: { wrong: "食完飯，就我去搵你。", explain: "就 goes after the subject, right before the verb: 我就去.", grammar: g.zau-then } }
      - { es: "你到咗，打畀我。", jp: "nei5 dou3 zo2 daa2 bei2 ngo5", en: "When you get there, call me.", altEs: ["你到咗打畀我。"], grammar: [g.zau-then], vocab: [w.daa2-bei2], transform: { instruction: "Link the two parts with 就", answer: "你到咗就打畀我。", alt: ["到咗就打畀我。"], en: "Call me as soon as you get there." } }
      - { es: "我八點瞓咗。", en: "I was asleep at eight.", altEs: ["我八點瞓着咗。"], grammar: [g.zo-perfective], vocab: [w.fan3], transform: { instruction: "Say it was as early as eight, with 就", answer: "我八點就瞓咗。", alt: ["我八點就瞓着咗。"], en: "I was already asleep by eight." } }
    exchanges:
      - q: { es: "你星期六做咗咩呀？", en: "What did you do on Saturday?" }
        a: { es: "掃完地就瞓晏覺。", en: "I swept the floor and then had a nap." }
        alt: ["我瞓晏覺。", "我喺屋企煲劇。"]
        grammar: [g.zau-then]
        vocab: [w.sou3-dei6, w.fan3-aan3-gaau3]
      - q: { es: "你幾時到呀？", en: "When will you get here?" }
        a: { es: "我一陣就到，等多五分鐘啦。", en: "I'll be there in a moment, give me five more minutes." }
        alt: ["就嚟到喇。", "五分鐘。"]
        grammar: [g.zau-then]
        vocab: [w.jat1-zan6]
      - q: { es: "你最近煲緊咩劇呀？", en: "What series are you binge-watching at the moment?" }
        a: { es: "一套韓國電視劇，好好睇。", en: "A Korean TV series, it's really good." }
        alt: ["一套韓劇。", "冇煲劇呀。"]
        grammar: [g.gan-progressive]
        vocab: [w.bou1-kek6, w.din6-si6-kek6]
      - q: { es: "呢啲舊雜誌點呀？", en: "What about these old magazines?" }
        a: { es: "唔要就掉咗佢啦。", en: "If you don't want them, throw them away." }
        alt: ["擺返喺度啦。", "掉咗佢啦。"]
        grammar: [g.zau-then]
        vocab: [w.deu6, w.baai2]
      - q: { es: "你哋喺邊度燒嘢食呀？", en: "Where did you have the barbecue?" }
        a: { es: "喺海邊，食完就去游水。", en: "By the sea, and after eating we went swimming." }
        alt: ["喺海邊。", "喺公園。"]
        grammar: [g.zau-then]
        vocab: [w.siu1-je5-sik6, w.hoi2-bin1]
    texts:
      - title: "我嘅星期六"
        es: ["我十點先至起身。", "食完早餐就掃地，跟住瞓晏覺。", "晚黑我煲劇，煲到兩點先瞓。"]
        en: ["I didn't get up until ten.", "After breakfast I swept the floor, then had a nap.", "In the evening I binge-watched a series until two before going to bed."]
        grammar: [g.zau-then, g.ji-cin-ji-hau]
        vocab: [w.sin1-zi3, w.sou3-dei6, w.bou1-kek6]
    spicy:
      - { es: "你一叫我，我就嚟。", en: "Just call me and I'll come.", altEs: ["你叫我，我就嚟。"], grammar: [g.zau-then], vocab: [w.zau6, w.giu3] }
      - { es: "就係你！我等咗成個週末。", en: "It's you! I've been waiting all weekend.", altEs: ["就係你呀！我等咗成個週末。"], grammar: [g.zau-then, g.duration], vocab: [w.zau6-hai6, w.seng4-go3] }
      - { es: "煲劇冇意思，同你行街先至好玩。", en: "Binge-watching is no fun; going out with you, now that's fun.", altEs: ["煲劇好悶，同你行街先至好玩。"], grammar: [g.zau-then], vocab: [w.bou1-kek6, w.hou2-waan2] }
      - { es: "你笑起上嚟，好似電視劇入面嘅演員。", en: "When you smile, you look like an actor in a TV drama.", altEs: ["你笑起嚟好似電視劇入面嘅演員。"], grammar: [g.adjective-predicates], vocab: [w.din6-si6-kek6, w.jin2-jyun4] }
      - { es: "我哋去野餐啦，你帶笑容，我帶三文治。", en: "Let's go for a picnic: you bring your smile, I'll bring sandwiches.", altEs: ["去野餐啦，你帶笑容，我帶三文治。"], grammar: [g.laa1-suggestion], vocab: [w.je5-caan1, w.saam1-man4-zi6] }
  - id: a2.u12.l3
    title: 我淨係瞓覺
    teach: [g.zing-hai-only]
    tip: "淨係 + verb or noun means 'only, just': 我淨係瞓覺. 得 + amount means 'only have': 我得十蚊. Add 咋 at the end for extra 'that's all'."
    vocab: [w.zing6-hai6, w.zi2-hai6, w.zi2-jau5, w.seng4-go3, w.hou2-waan2, w.mun6, w.mou4-liu4, w.zung6-hai6, w.ze3, w.waan4, w.zaan6, w.zyun3-gung1, w.kung4, w.ngai4-him2, w.on1-cyun4, w.zan1, w.gaa2, w.suk6, w.saang1.b]
    sentences:
      - { es: "上個週末我淨係瞓覺。", en: "All I did last weekend was sleep.", altEs: ["上個週末我淨係喺度瞓覺。", "我上個週末淨係瞓覺。"], grammar: [g.zing-hai-only], vocab: [w.zing6-hai6, w.fan3-gaau3] }
      - { es: "我淨係食咗個麵包，冇食午餐。", en: "I only had a bun, I didn't have lunch.", altEs: ["我淨係食咗個麵包，冇食晏。"], grammar: [g.zing-hai-only, g.mou-past-negation], vocab: [w.zing6-hai6, w.min6-baau1] }
      - { es: "淨係我一個人去。", en: "Only I went.", altEs: ["淨係得我一個人去。"], altEn: ["I went by myself."], grammar: [g.zing-hai-only], vocab: [w.zing6-hai6, w.jat1-go3-jan4] }
      - { es: "我得一百蚊，唔夠買。", en: "I've only got a hundred dollars, it's not enough to buy it.", altEs: ["我得一百蚊咋，唔夠買。"], grammar: [g.zing-hai-only], vocab: [w.dak1, w.gau3] }
      - { es: "唔好淨係玩，記得做功課。", en: "Don't just play, remember to do your homework.", altEs: ["唔好淨係識玩，記得做功課。"], grammar: [g.zing-hai-only, g.m-hou-dont], vocab: [w.zing6-hai6, w.waan2] }
      - { es: "成個週末都落雨，好悶。", en: "It rained the whole weekend, so boring.", altEs: ["成個週末都喺度落雨，好悶。"], grammar: [g.dou-also], vocab: [w.seng4-go3, w.mun6] }
      - { es: "呢套戲好無聊，我睇咗一半就走咗。", en: "This film was so dull that I left halfway through.", altEs: ["套戲好無聊，我睇咗一半就走咗。"], grammar: [g.zau-then], vocab: [w.mou4-liu4] }
      - { es: "行山好好玩，下次你一定要嚟。", en: "Hiking is great fun, you have to come next time.", altEs: ["行山好好玩，下次你一定要嚟呀。"], grammar: [g.jiu-must-m-sai], vocab: [w.hou2-waan2, w.haang4-saan1] }
      - { es: "我只係講笑，你唔好嬲。", en: "I was only joking, don't be angry.", altEs: ["我只係講笑啫，你唔好嬲。"], grammar: [g.zing-hai-only, g.m-hou-dont], vocab: [w.zi2-hai6, w.gong2-siu3] }
      - { es: "呢條街只有一間餐廳。", en: "There's only one restaurant on this street.", altEs: ["呢條街得一間餐廳。"], grammar: [g.zing-hai-only], vocab: [w.zi2-jau5] }
      - { es: "佢仲係好窮，賺唔到錢。", en: "He's still very poor, he can't earn any money.", altEs: ["佢仲係好窮，搵唔到錢。"], grammar: [g.potential-complements], vocab: [w.zung6-hai6, w.kung4, w.zaan6] }
      - { es: "我想轉工，因為人工太少。", en: "I want to change jobs because the pay is too low.", altEs: ["我想轉工，因為份人工太少。"], grammar: [g.jan-wai-so-ji], vocab: [w.zyun3-gung1, w.jan4-gung1] }
      - { es: "可唔可以借本書畀我？我聽日還畀你。", en: "Could you lend me the book? I'll give it back tomorrow.", altEs: ["借本書畀我得唔得？我聽日還畀你。"], grammar: [g.ho-ji-can-may, g.bei-give], vocab: [w.ze3, w.waan4] }
      - { es: "夜晚一個人行山好危險。", en: "Hiking alone at night is very dangerous.", altEs: ["晚黑一個人行山好危險。"], grammar: [g.adjective-predicates], vocab: [w.ngai4-him2] }
      - { es: "九龍寨城以前好擠迫，而家好安全。", en: "Kowloon Walled City used to be very crowded; now it's very safe.", altEs: ["九龍寨城以前好擠迫，而家好安全喇。"], grammar: [g.laa3-change], vocab: [w.on1-cyun4, w.ji5-cin4] }
      - { es: "呢個手袋係真定假㗎？", en: "Is this handbag real or fake?", altEs: ["呢個手袋係真嘅定假嘅？"], grammar: [g.question-words], vocab: [w.zan1, w.gaa2, w.sau2-doi2] }
      - { es: "啲牛肉未熟，仲係生嘅。", en: "The beef isn't cooked yet, it's still raw.", altEs: ["啲牛肉仲未熟，仲係生嘅。"], grammar: [g.mei-questions], vocab: [w.suk6, w.saang1.b] }
      - { es: "我淨係飲咗咖啡。", en: "I only had coffee.", altEs: ["我淨係飲咗杯咖啡。"], grammar: [g.zing-hai-only], vocab: [w.zing6-hai6], error: { wrong: "我飲咗咖啡淨係。", explain: "淨係 goes before the verb, not at the end.", grammar: g.zing-hai-only } }
      - { es: "我飲咗杯咖啡。", en: "I had a cup of coffee.", altEs: ["我飲咗一杯咖啡。"], grammar: [g.zo-perfective], vocab: [w.gaa3-fe1], transform: { instruction: "Say that's all you had, with 淨係", answer: "我淨係飲咗杯咖啡。", alt: ["我淨係飲咗一杯咖啡。", "我淨係飲咗杯咖啡咋。"], en: "All I had was a cup of coffee." } }
      - { es: "佢知。", en: "She knows.", altEs: ["佢知道。"], grammar: [g.zing-hai-only], vocab: [w.zi1], transform: { instruction: "Say only she knows, with 淨係", answer: "淨係佢知。", alt: ["淨係佢知道。"], en: "Only she knows." } }
    exchanges:
      - q: { es: "你週末做咗啲咩呀？", en: "What did you do at the weekend?" }
        a: { es: "冇做乜，淨係喺屋企瞓覺。", en: "Nothing much, I just slept at home." }
        alt: ["淨係瞓覺。", "我去咗行山。"]
        grammar: [g.zing-hai-only]
        vocab: [w.zing6-hai6]
      - q: { es: "套戲好唔好睇呀？", en: "Was the film any good?" }
        a: { es: "好無聊，我睇咗一半就瞓着咗。", en: "Really dull, I fell asleep halfway through." }
        alt: ["好好睇！", "好悶。"]
        grammar: [g.zau-then]
        vocab: [w.mou4-liu4, w.fan3-zoek6]
      - q: { es: "你點解想轉工呀？", en: "Why do you want to change jobs?" }
        a: { es: "因為人工太少，又成日加班。", en: "Because the pay is too low and I'm always working overtime." }
        alt: ["人工太少。", "太悶喇。"]
        grammar: [g.jan-wai-so-ji]
        vocab: [w.zyun3-gung1, w.jan4-gung1]
      - q: { es: "可唔可以借把遮畀我？", en: "Could you lend me an umbrella?" }
        a: { es: "得，記得還返畀我呀。", en: "Sure, remember to give it back to me." }
        alt: ["得。", "我得一把咋。"]
        grammar: [g.bei-give]
        vocab: [w.ze3, w.waan4, w.ze1]
      - q: { es: "呢度安全唔安全㗎？", en: "Is it safe here?" }
        a: { es: "好安全，唔使擔心。", en: "Very safe, don't worry." }
        alt: ["好安全。", "夜晚有啲危險。"]
        grammar: [g.a-not-a-questions]
        vocab: [w.on1-cyun4]
    texts:
      - title: "好悶嘅週末"
        es: ["成個週末都落雨。", "我淨係喺屋企瞓覺同煲劇。", "我得一個好朋友得閒，不過佢又病咗。"]
