    sentences:
      - { es: "好吖，幾點呀？", en: "Sure, what time?", altEs: ["好呀，幾點呀？", "好吖，約幾點呀？"], altEn: ["Sounds good, what time?"], grammar: [g.aa1-offer, g.clock-time], vocab: [w.aa1, w.gei2-dim2] }
