        vocab: [w.fong3-sam1, w.zai1-bik1]
    spicy:
      - { es: "見到你之前好緊張，見到你之後好興奮。", en: "Before seeing you I was nervous; after seeing you I'm excited.", altEs: ["見你之前好緊張，見你之後好興奮。"], grammar: [g.ji-cin-ji-hau], vocab: [w.gan2-zoeng1, w.hing1-fan5] }
