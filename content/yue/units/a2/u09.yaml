id: a2.u09
title: 去旅行
lessons:
  - id: a2.u09.l1
    title: 你有咩打算？
    teach: [g.daa-syun-plans]
    tip: "打算 'plan to', 諗住 'be thinking of' and 準備 'be about to' all take a verb straight after them: 打算去, 諗住住, 準備出發."
    vocab: [w.leoi5-hang4, w.daa2-syun3, w.nam2-zyu6, w.zeon2-bei6, w.gai3-waak6, w.ceot1-faat3, w.zi6-jau4-hang4, w.leoi5-hang4-tyun4, w.dou6-jau4, w.ging2-dim2, w.fung1-ging2, w.ceot1-mun4, w.nin4-mei5, w.nin4-tau4, w.syu2-gaa3, w.hon4-gaa3, w.sing4-si5, w.dei6-keoi1, w.maan6-guk1, w.taam3]
    sentences:
      - { es: "我打算暑假去台灣旅行。", en: "I'm planning to travel to Taiwan in the summer holidays.", altEs: ["我暑假打算去台灣旅行。", "暑假我打算去台灣旅行。"], altEn: ["I plan to go on a trip to Taiwan this summer."], grammar: [g.daa-syun-plans, g.time-before-verb], vocab: [w.daa2-syun3, w.syu2-gaa3, w.leoi5-hang4] }
      - { es: "你今年有咩打算呀？", en: "What are your plans for this year?", altEs: ["你今年有乜嘢打算呀？", "今年你有咩打算呀？"], grammar: [g.daa-syun-plans, g.question-words], vocab: [w.daa2-syun3, w.gam1-nin2] }
      - { es: "我諗住年尾去曼谷玩。", en: "I'm thinking of going to Bangkok at the end of the year.", altEs: ["我諗住年尾去曼谷玩吓。", "年尾我諗住去曼谷玩。"], altEn: ["I have in mind a trip to Bangkok at the end of the year."], grammar: [g.daa-syun-plans], vocab: [w.nam2-zyu6, w.nin4-mei5, w.maan6-guk1] }
      - { es: "我哋準備出發喇，你搞掂未呀？", en: "We're about to set off, are you ready?", altEs: ["我哋準備出發喇，你搞掂未？", "準備出發喇，你搞掂未呀？"], altEn: ["We're just leaving, have you finished?"], grammar: [g.daa-syun-plans, g.laa3-change], vocab: [w.zeon2-bei6, w.ceot1-faat3, w.gaau2-dim6] }
      - { es: "我唔鍾意旅行團，鍾意自由行。", en: "I don't like tour groups, I prefer travelling independently.", altEs: ["我唔鍾意去旅行團，鍾意自由行。", "我唔鍾意旅行團，我鍾意自由行。"], grammar: [g.zung-ji-like], vocab: [w.leoi5-hang4-tyun4, w.zi6-jau4-hang4] }
      - { es: "導遊會帶我哋去睇唔同嘅景點。", en: "The tour guide will take us to see different sights.", altEs: ["導遊會帶我哋去睇唔同景點。"], grammar: [g.wui-will], vocab: [w.dou6-jau4, w.ging2-dim2, w.daai3] }
      - { es: "日本秋天嘅風景好靚。", en: "The scenery in Japan in autumn is beautiful.", altEs: ["秋天日本嘅風景好靚。", "日本秋天啲風景好靚。"], grammar: [g.ge-possessive], vocab: [w.fung1-ging2, w.cau1-tin1] }
      - { es: "佢諗住寒假返英國探屋企人。", en: "She's thinking of going back to the UK in the winter holidays to visit her family.", altEs: ["寒假佢諗住返英國探屋企人。"], altEn: ["He's planning to go back to England in the winter break to see his family."], grammar: [g.daa-syun-plans, g.serial-verbs], vocab: [w.nam2-zyu6, w.hon4-gaa3, w.taam3] }
      - { es: "你有咩計劃呀？", en: "What's your plan?", altEs: ["你有乜嘢計劃呀？", "你嘅計劃係點呀？"], altEn: ["What are your plans?"], grammar: [g.question-words], vocab: [w.gai3-waak6] }
      - { es: "我未有咩打算，可能留喺香港。", en: "I don't have any plans yet, I might stay in Hong Kong.", altEs: ["我仲未有咩打算，可能留喺香港。", "我未有打算，可能留喺香港。"], grammar: [g.daa-syun-plans, g.mei-questions], vocab: [w.daa2-syun3, w.ho2-nang4, w.lau4.b] }
      - { es: "我哋打算出年年頭去北京。", en: "We're planning to go to Beijing at the start of next year.", altEs: ["出年年頭我哋打算去北京。"], grammar: [g.daa-syun-plans, g.time-before-verb], vocab: [w.nin4-tau4, w.ceot1-nin2] }
      - { es: "你想去邊個城市呀？", en: "Which city do you want to go to?", altEs: ["你想去邊個城市？", "你想去邊度呀？"], grammar: [g.question-words], vocab: [w.sing4-si5] }
      - { es: "佢成日出門，好少喺香港。", en: "He travels a lot, he's rarely in Hong Kong.", altEs: ["佢成日出門，好少留喺香港。"], altEn: ["She's always away, she's hardly ever in Hong Kong."], grammar: [g.frequency-adverbs], vocab: [w.ceot1-mun4, w.seng4-jat6] }
      - { es: "香港唔同地區有唔同嘅景點。", en: "Different districts of Hong Kong have different sights.", altEs: ["香港唔同嘅地區有唔同嘅景點。"], grammar: [g.jau-have], vocab: [w.dei6-keoi1, w.ging2-dim2] }
      - { es: "我打算去日本。", en: "I'm planning to go to Japan.", altEs: ["我打算去日本旅行。"], grammar: [g.daa-syun-plans], vocab: [w.daa2-syun3], error: { wrong: "我打算去到日本。", explain: "打算 takes the plain verb straight after it: 打算去, not 打算去到.", grammar: g.daa-syun-plans } }
      - { es: "我暑假去台灣。", en: "I'm going to Taiwan in the summer holidays.", altEs: ["暑假我去台灣。"], grammar: [g.time-before-verb], vocab: [w.syu2-gaa3], transform: { instruction: "Say it's your plan, with 打算", answer: "我打算暑假去台灣。", alt: ["我暑假打算去台灣。", "暑假我打算去台灣。"], en: "I'm planning to go to Taiwan in the summer holidays." } }
      - { es: "我哋出發。", en: "We're setting off.", altEs: ["我哋出發喇。"], grammar: [g.daa-syun-plans], vocab: [w.ceot1-faat3], transform: { instruction: "Say you're about to set off: 準備…喇", answer: "我哋準備出發喇。", alt: ["我哋準備出發。"], en: "We're about to set off." } }
    exchanges:
      - q: { es: "你暑假有咩打算呀？", en: "What are your plans for the summer holidays?" }
        a: { es: "我打算去日本旅行。", en: "I'm planning to travel to Japan." }
        alt: ["我諗住去日本。", "我未有打算。", "去日本旅行。"]
        grammar: [g.daa-syun-plans]
        vocab: [w.syu2-gaa3, w.daa2-syun3]
      - q: { es: "你鍾意旅行團定自由行呀？", en: "Do you prefer tour groups or independent travel?" }
        a: { es: "自由行，我唔鍾意跟住導遊行。", en: "Independent travel, I don't like following a guide around." }
        alt: ["自由行。", "旅行團，方便啲。"]
        grammar: [g.zung-ji-like]
        vocab: [w.zi6-jau4-hang4, w.dou6-jau4]
      - q: { es: "你哋幾時出發呀？", en: "When are you setting off?" }
        a: { es: "聽朝八點出發。", en: "Tomorrow at eight in the morning." }
        alt: ["聽朝。", "星期六出發。"]
        grammar: [g.time-before-verb]
        vocab: [w.ceot1-faat3, w.ting1-ziu1]
      - q: { es: "你想去邊度玩呀？", en: "Where do you want to go?" }
        a: { es: "我諗住去曼谷，我好鍾意泰國菜。", en: "I'm thinking of Bangkok, I love Thai food." }
        alt: ["我諗住去曼谷。", "去曼谷。"]
        grammar: [g.daa-syun-plans]
        vocab: [w.nam2-zyu6, w.maan6-guk1, w.taai3-gwok3-coi3]
      - q: { es: "你去過邊啲城市呀？", en: "Which cities have you been to?" }
        a: { es: "我去過東京同上海。", en: "I've been to Tokyo and Shanghai." }
        alt: ["東京同上海。", "我未去過外國。"]
        grammar: [g.gwo-experiential]
        vocab: [w.sing4-si5]
    texts:
      - title: "旅行計劃"
        es: ["今年年尾我打算同朋友去曼谷。", "我哋唔參加旅行團，自己去。", "我諗住住五晚，睇吓唔同嘅景點。"]
        en: ["At the end of this year I'm planning to go to Bangkok with friends.", "We're not joining a tour group, we're going on our own.", "I'm thinking of staying five nights and seeing different sights."]
        grammar: [g.daa-syun-plans]
        vocab: [w.nin4-mei5, w.leoi5-hang4-tyun4, w.ging2-dim2]
    spicy:
      - { es: "我暑假未有打算，你有冇興趣同我一齊去？", en: "I don't have summer plans yet, are you interested in coming with me?", altEs: ["我暑假仲未有打算，你有冇興趣同我一齊去？"], grammar: [g.daa-syun-plans, g.jat-cai-together], vocab: [w.daa2-syun3, w.hing3-ceoi3] }
      - { es: "我諗住去旅行，個喼仲有位放你。", en: "I'm thinking of going on a trip, and there's still room in my suitcase for you.", altEs: ["我諗住去旅行，我個喼仲有位放你。"], grammar: [g.daa-syun-plans], vocab: [w.nam2-zyu6, w.gip1, w.fong3] }
      - { es: "你做我嘅導遊吖，我淨係想睇你呢個景點。", en: "Be my tour guide; the only sight I want to see is you.", altEs: ["你做我導遊吖，我淨係想睇你呢個景點。"], grammar: [g.aa1-offer, g.zing-hai-only], vocab: [w.dou6-jau4, w.ging2-dim2] }
      - { es: "我嘅計劃好簡單：成個暑假都同你一齊。", en: "My plan is simple: spend the whole summer with you.", altEs: ["我嘅計劃好簡單，成個暑假都同你一齊。"], grammar: [g.jat-cai-together], vocab: [w.gai3-waak6, w.gaan2-daan1, w.syu2-gaa3] }
      - { es: "你搞掂未呀？我已經準備同你去旅行喇。", en: "Are you ready? I'm all set to go travelling with you.", altEs: ["你搞掂未？我準備同你去旅行喇。"], grammar: [g.daa-syun-plans, g.laa3-change], vocab: [w.zeon2-bei6, w.leoi5-hang4] }
  - id: a2.u09.l2
    title: 住幾耐？
    teach: [g.duration]
    tip: "Time when goes before the verb, time how long goes after it: 我喺香港住咗三年. Ask with 幾耐."
    vocab: [w.deng6, w.deng6-fong2, w.gei1-piu3, w.wu6-ziu3, w.cim1-zing3, w.zau2-dim3, w.man4-suk1, w.zou1, w.gei2-jat6, w.jat6-zi2, w.hei2-fei1, w.hong4-baan1, w.dang1-gei1, w.hoi2-gwaan1]
    sentences:
      - { es: "我哋喺台灣玩咗五日。", en: "We spent five days in Taiwan.", altEs: ["我哋喺台灣玩咗五日喇。", "我哋去台灣玩咗五日。"], altEn: ["We had five days in Taiwan."], grammar: [g.duration, g.zo-perfective], vocab: [w.waan2] }
      - { es: "你打算住幾耐呀？", en: "How long are you planning to stay?", altEs: ["你打算住幾耐？", "你諗住住幾耐呀？"], grammar: [g.duration, g.daa-syun-plans], vocab: [w.gei2-noi6, w.zyu6] }
      - { es: "我諗住住三晚，已經訂咗酒店。", en: "I'm thinking of staying three nights, I've already booked a hotel.", altEs: ["我諗住住三晚，訂咗酒店喇。"], grammar: [g.duration, g.zo-perfective], vocab: [w.deng6, w.zau2-dim3] }
      - { es: "坐船去澳門要一個鐘。", en: "The ferry to Macau takes an hour.", altEs: ["坐船去澳門要一個鐘頭。", "搭船去澳門要一個鐘。"], grammar: [g.duration], vocab: [w.syun4, w.zung1] }
      - { es: "飛曼谷要三個鐘。", en: "The flight to Bangkok takes three hours.", altEs: ["飛去曼谷要三個鐘。", "坐飛機去曼谷要三個鐘。"], grammar: [g.duration], vocab: [w.fei1.b, w.maan6-guk1] }
      - { es: "我嘅航班遲咗兩個鐘先起飛。", en: "My flight took off two hours late.", altEs: ["我班飛機遲咗兩個鐘先起飛。"], altEn: ["My flight was delayed two hours before taking off."], grammar: [g.duration], vocab: [w.hong4-baan1, w.hei2-fei1] }
      - { es: "香港人去日本唔使簽證，有護照就得。", en: "Hongkongers don't need a visa for Japan, a passport is enough.", altEs: ["香港人去日本唔使簽證，有護照就得喇。"], grammar: [g.jiu-must-m-sai, g.zau-then], vocab: [w.cim1-zing3, w.wu6-ziu3] }
      - { es: "記得帶護照呀，唔係唔可以登機。", en: "Remember to bring your passport, otherwise you can't board.", altEs: ["記得帶護照，唔係唔可以登機。"], grammar: [g.ho-ji-can-may], vocab: [w.wu6-ziu3, w.dang1-gei1, w.gei3-dak1] }
      - { es: "我上網訂咗機票，好平。", en: "I booked my plane tickets online, they were really cheap.", altEs: ["我喺網上訂咗機票，好平。"], grammar: [g.zo-perfective], vocab: [w.gei1-piu3, w.soeng5-mong5] }
      - { es: "我哋租咗間民宿，住咗一個禮拜。", en: "We rented a guesthouse and stayed for a week.", altEs: ["我哋租咗一間民宿，住咗一個禮拜。", "我哋租咗間民宿，住咗一個星期。"], grammar: [g.duration, g.zo-perfective], vocab: [w.zou1, w.man4-suk1] }
      - { es: "我哋喺海關等咗半個鐘。", en: "We waited half an hour at customs.", altEs: ["喺海關我哋等咗半個鐘。"], grammar: [g.duration], vocab: [w.hoi2-gwaan1, w.bun3] }
      - { es: "我學咗兩年廣東話。", en: "I've studied Cantonese for two years.", altEs: ["我學廣東話學咗兩年。", "我學咗兩年廣東話喇。"], grammar: [g.duration], vocab: [w.hok6, w.gwong2-dung1-waa2] }
      - { es: "佢喺英國讀咗四年書。", en: "She studied in the UK for four years.", altEs: ["佢喺英國讀書讀咗四年。"], altEn: ["He studied in England for four years."], grammar: [g.duration], vocab: [w.duk6-syu1] }
      - { es: "你今次去幾日呀？", en: "How many days are you going for this time?", altEs: ["你今次去幾耐呀？", "今次你去幾日？"], grammar: [g.duration, g.question-words], vocab: [w.gei2-jat6, w.gam1-ci3] }
      - { es: "去旅行嘅日子過得好快。", en: "The days on a trip go by so fast.", altEs: ["旅行嘅日子過得好快。"], grammar: [g.dak-descriptive], vocab: [w.jat6-zi2, w.leoi5-hang4] }
      - { es: "我喺香港住咗三年。", en: "I've lived in Hong Kong for three years.", altEs: ["我喺香港住咗三年喇。"], grammar: [g.duration], vocab: [w.zyu6], error: { wrong: "我三年喺香港住咗。", explain: "How long goes after the verb: 住咗三年.", grammar: g.duration } }
      - { es: "我等咗你。", en: "I waited for you.", altEs: ["我等咗你喇。"], grammar: [g.zo-perfective], vocab: [w.dang2], transform: { instruction: "Add 'for half an hour' (半個鐘)", answer: "我等咗你半個鐘。", alt: ["我等咗你半個鐘喇。"], en: "I waited for you for half an hour." } }
      - { es: "我訂咗房。", en: "I've booked a room.", altEs: ["我訂咗房喇。"], grammar: [g.zo-perfective], vocab: [w.deng6-fong2], transform: { instruction: "Add how long: three nights (三晚)", answer: "我訂咗三晚房。", alt: ["我訂咗三晚。", "我訂咗房，住三晚。"], en: "I've booked a room for three nights." } }
    exchanges:
      - q: { es: "你打算去幾耐呀？", en: "How long are you planning to go for?" }
        a: { es: "大概一個禮拜。", en: "About a week." }
        alt: ["一個禮拜。", "五日左右。"]
        grammar: [g.duration]
        vocab: [w.gei2-noi6, w.daai6-koi3]
      - q: { es: "你訂咗酒店未呀？", en: "Have you booked a hotel yet?" }
        a: { es: "訂咗喇，訂咗三晚。", en: "Yes, for three nights." }
        alt: ["仲未訂。", "訂咗喇。"]
        grammar: [g.mei-questions, g.duration]
        vocab: [w.deng6, w.zau2-dim3]
      - q: { es: "去日本使唔使簽證呀？", en: "Do you need a visa for Japan?" }
        a: { es: "唔使，有護照就得。", en: "No, a passport is enough." }
        alt: ["唔使。", "香港人唔使。"]
        grammar: [g.jiu-must-m-sai]
        vocab: [w.cim1-zing3, w.wu6-ziu3]
      - q: { es: "飛機幾點起飛呀？", en: "What time does the plane take off?" }
        a: { es: "十點起飛，我哋最好八點去機場。", en: "At ten, we'd better head to the airport at eight." }
        alt: ["十點。", "十點起飛。"]
        grammar: [g.clock-time, g.zeoi-hou-better]
        vocab: [w.hei2-fei1, w.gei1-coeng4]
      - q: { es: "你喺香港住咗幾耐呀？", en: "How long have you lived in Hong Kong?" }
        a: { es: "住咗三年喇。", en: "Three years now." }
        alt: ["三年。", "啱啱嚟咗一個月。"]
        grammar: [g.duration]
        vocab: [w.zyu6, w.gei2-noi6]
    texts:
      - title: "訂房"
        es: ["我哋喺網上訂咗一間民宿。", "我哋會住四晚，一晚八百蚊。", "航班星期五朝早九點起飛。"]
        en: ["We've booked a guesthouse online.", "We'll stay four nights, at eight hundred dollars a night.", "The flight takes off at nine on Friday morning."]
        grammar: [g.duration]
        vocab: [w.man4-suk1, w.hong4-baan1, w.mong5-soeng6]
    spicy:
      - { es: "我等咗你成個鐘，見到你就唔嬲喇。", en: "I waited a whole hour for you, but now I see you I'm not cross any more.", altEs: ["我等咗你成個鐘，不過見到你就唔嬲喇。"], grammar: [g.duration, g.laa3-change], vocab: [w.dang2, w.nau1] }
      - { es: "你想同我傾幾耐都得。", en: "You can talk to me for as long as you like.", altEs: ["你想同我傾幾耐都得呀。"], grammar: [g.duration], vocab: [w.gei2-noi6, w.king1] }
      - { es: "我哋訂一間房定兩間房呀？講笑啫！", en: "Shall we book one room or two? Just kidding!", altEs: ["我哋訂一間定兩間房呀？講笑咋！"], grammar: [g.zaa3-ze1-only], vocab: [w.deng6, w.fong2, w.gong2-siu3] }
      - { es: "同你坐三個鐘飛機，我都嫌太短。", en: "Three hours on a plane with you still feels too short.", altEs: ["同你坐三個鐘飛機都嫌太短。"], grammar: [g.duration], vocab: [w.fei1-gei1, w.dyun2] }
      - { es: "我學咗一年廣東話，因為想同你傾偈。", en: "I've studied Cantonese for a year because I wanted to chat with you.", altEs: ["我學廣東話學咗一年，因為想同你傾偈。"], grammar: [g.duration, g.jan-wai-so-ji], vocab: [w.king1-gai2] }
  - id: a2.u09.l3
    title: 我一定會再嚟
    teach: [g.zoi-vs-jau]
    tip: "再 is 'again' for things still to come (再嚟); 又 is 'again' for things that already happened, often annoyed (又落雨！)."
    vocab: [w.hang4-lei5, w.gip1, w.zap1, w.wun6-cin2, w.wun6, w.jin6-gam1, w.seon3-jung6-kaat1, w.soeng2-gei1, w.jap6, w.ging1, w.sau2-seon3, w.gei2-nim6-ban2, w.zyu1-gu1-lik1]
    sentences:
      - { es: "我好鍾意鯉魚門，一定會再嚟。", en: "I love Lei Yue Mun, I'll definitely come again.", altEs: ["我好鍾意鯉魚門，我一定會再嚟。"], grammar: [g.zoi-vs-jau, g.wui-will], vocab: [w.zoi3, w.jat1-ding6] }
      - { es: "又落雨！今日唔去碼頭喇。", en: "It's raining again! We're not going to the pier today.", altEs: ["又落雨喇！今日唔去碼頭喇。"], grammar: [g.zoi-vs-jau, g.laa3-change], vocab: [w.jau6.b, w.maa5-tau4] }
      - { es: "呢間酒店又平又乾淨。", en: "This hotel is both cheap and clean.", altEs: ["呢間酒店又乾淨又平。"], grammar: [g.zoi-vs-jau], vocab: [w.zau2-dim3, w.gon1-zeng6] }
      - { es: "唔該再講一次。", en: "Please say it again.", altEs: ["唔該你再講一次。", "唔該再講多一次。"], altEn: ["Could you say that again, please?"], grammar: [g.zoi-vs-jau], vocab: [w.zoi3, w.ci3] }
      - { es: "佢又唔記得帶護照！", en: "He's forgotten his passport again!", altEs: ["佢又唔記得帶護照喇！"], altEn: ["She forgot her passport again!"], grammar: [g.zoi-vs-jau], vocab: [w.m4-gei3-dak1, w.wu6-ziu3] }
      - { es: "我哋先換錢，再去搭車。", en: "Let's change money first, then go and get the bus.", altEs: ["我哋換咗錢先，再去搭車。", "先換錢，再去搭車。"], grammar: [g.sin-zoi-sequence, g.zoi-vs-jau], vocab: [w.wun6-cin2, w.daap3.b] }
      - { es: "你個喼又大又重，我幫你拎吖。", en: "Your suitcase is big and heavy, let me carry it for you.", altEs: ["你個喼又重又大，我幫你拎吖。"], grammar: [g.zoi-vs-jau, g.aa1-offer], vocab: [w.gip1, w.cung5] }
      - { es: "你執咗喼未呀？聽朝就出發喇。", en: "Have you packed your suitcase? We leave tomorrow morning.", altEs: ["你執咗喼未？聽朝就出發喇。"], grammar: [g.mei-questions, g.zau-then], vocab: [w.zap1, w.gip1] }
      - { es: "呢度收唔收信用卡呀？定係淨係收現金？", en: "Do you take credit cards here? Or only cash?", altEs: ["呢度收唔收信用卡？定係淨係收現金？"], grammar: [g.a-not-a-questions, g.zing-hai-only], vocab: [w.seon3-jung6-kaat1, w.jin6-gam1, w.sau1] }
      - { es: "我想入去睇吓，你喺度等我吖。", jp: "ngo5 soeng2 jap6 heoi3 tai2 haa5 nei5 hai2 dou6 dang2 ngo5 aa1", en: "I want to go in and have a look, wait for me here.", altEs: ["我想入去睇吓，你喺呢度等我吖。"], grammar: [g.haa-briefly, g.aa1-offer], vocab: [w.jap6-heoi3, w.dang2] }
      - { es: "我哋經上海去北京。", en: "We're going to Beijing via Shanghai.", altEs: ["我哋經上海飛北京。"], grammar: [g.heoi-lai], vocab: [w.ging1] }
      - { es: "記得買手信畀同事呀。", en: "Remember to buy souvenirs for your colleagues.", altEs: ["記得買啲手信畀同事呀。"], grammar: [g.bei-give], vocab: [w.sau2-seon3, w.tung4-si6] }
      - { es: "呢件紀念品又細又靚。", en: "This souvenir is small and pretty.", altEs: ["呢件紀念品又靚又細。"], grammar: [g.zoi-vs-jau], vocab: [w.gei2-nim6-ban2] }
      - { es: "唔好再遲到喇！", en: "Don't be late again!", altEs: ["唔好再遲到啦！"], grammar: [g.zoi-vs-jau, g.m-hou-dont], vocab: [w.zoi3, w.ci4-dou3] }
      - { es: "部相機又冇電！", en: "The camera's dead again!", altEs: ["部相機又冇電喇！"], grammar: [g.zoi-vs-jau], vocab: [w.soeng2-gei1, w.mou5-din6] }
      - { es: "啲行李放入個喼度啦。", en: "Put the luggage into the suitcase.", altEs: ["啲行李放入喼度啦。"], grammar: [g.laa1-suggestion], vocab: [w.hang4-lei5, w.jap6, w.fong3] }
      - { es: "我出年會再嚟。", en: "I'll come again next year.", altEs: ["出年我會再嚟。"], grammar: [g.zoi-vs-jau, g.wui-will], vocab: [w.zoi3, w.ceot1-nin2], error: { wrong: "我出年會又嚟。", explain: "又 is for repetition that has already happened; for the future use 再: 會再嚟.", grammar: g.zoi-vs-jau } }
      - { es: "佢遲到。", en: "He's late.", altEs: ["佢遲到呀。"], altEn: ["She's late."], grammar: [g.zoi-vs-jau], vocab: [w.ci4-dou3], transform: { instruction: "Say he's late again (it has happened before), with 又", answer: "佢又遲到。", alt: ["佢又遲到喇。"], en: "He's late again." } }
      - { es: "我哋下次嚟。", en: "We'll come next time.", altEs: ["下次我哋嚟。"], grammar: [g.zoi-vs-jau], vocab: [w.haa6-ci3], transform: { instruction: "Say you'll come again, with 再", answer: "我哋下次再嚟。", alt: ["下次我哋再嚟。", "我哋下次再嚟啦。"], en: "We'll come again next time." } }
    exchanges:
      - q: { es: "你仲會唔會再嚟香港呀？", en: "Will you come to Hong Kong again?" }
        a: { es: "會呀，我出年再嚟。", en: "Yes, I'll come again next year." }
        alt: ["會，一定會再嚟。", "會呀。"]
        grammar: [g.zoi-vs-jau, g.wui-will]
        vocab: [w.zoi3, w.ceot1-nin2]
      - q: { es: "點解你又遲到呀？", en: "Why are you late again?" }
        a: { es: "對唔住，又塞車。", en: "Sorry, the traffic was bad again." }
        alt: ["對唔住。", "又塞車呀。"]
        grammar: [g.zoi-vs-jau]
        vocab: [w.jau6.b, w.sak1-ce1]
      - q: { es: "呢度收唔收信用卡呀？", en: "Do you take credit cards here?" }
        a: { es: "唔收，淨係收現金。", en: "No, cash only." }
        alt: ["收呀。", "淨係收現金。"]
        grammar: [g.a-not-a-questions, g.zing-hai-only]
        vocab: [w.seon3-jung6-kaat1, w.jin6-gam1]
      - q: { es: "你買咗咩手信呀？", en: "What souvenirs did you buy?" }
        a: { es: "買咗啲朱古力同茶。", en: "Some chocolate and tea." }
        alt: ["朱古力。", "我冇買手信。"]
        grammar: [g.zo-perfective]
        vocab: [w.sau2-seon3, w.zyu1-gu1-lik1]
      - q: { es: "你執咗喼未呀？", en: "Have you packed your suitcase?" }
        a: { es: "執咗喇，聽朝出發。", en: "Yes, we leave tomorrow morning." }
        alt: ["仲未執。", "執咗喇。"]
        grammar: [g.mei-questions]
        vocab: [w.zap1, w.gip1]
    texts:
      - title: "又遲到"
        es: ["又落雨，又塞車。", "我哋去到碼頭，船已經走咗。", "冇計喇，我哋等下一班再去。"]
        en: ["It was raining and there was traffic again.", "When we got to the pier, the boat had already left.", "Nothing for it, we'll wait for the next one."]
        grammar: [g.zoi-vs-jau]
        vocab: [w.maa5-tau4, w.mou5-gai2]
    spicy:
      - { es: "你又望住我？不如我哋一齊食餐飯啦。", en: "Looking at me again? Why don't we have a meal together?", altEs: ["你又望住我呀？不如一齊食餐飯啦。"], grammar: [g.zoi-vs-jau, g.laa1-suggestion], vocab: [w.jau6.b, w.mong6] }
      - { es: "同你去旅行，我一定會再去，再去，再去。", en: "Travelling with you, I'd definitely go again, and again, and again.", altEs: ["同你去旅行，我一定會再去。"], grammar: [g.zoi-vs-jau], vocab: [w.zoi3, w.leoi5-hang4] }
      - { es: "你又靚又叻，我仲可以點呀？", en: "You're gorgeous and clever, what else can I do?", altEs: ["你又叻又靚，我仲可以點呀？"], grammar: [g.zoi-vs-jau], vocab: [w.leng3, w.lek1] }
      - { es: "唔該再笑一次，我未影到。", jp: "m4 goi1 zoi3 siu3 jat1 ci3 ngo5 mei6 jing2 dou3", en: "Smile again, please, I didn't get the shot.", altEs: ["唔該你再笑一次，我未影到。"], grammar: [g.zoi-vs-jau], vocab: [w.siu3, w.jing2] }
      - { es: "你冇買手信畀我？噉下次同我一齊去啦。", en: "You didn't buy me a souvenir? Then next time take me with you.", altEs: ["你冇買手信畀我呀？噉下次同我一齊去啦。"], grammar: [g.jat-cai-together], vocab: [w.sau2-seon3, w.haa6-ci3] }
  - id: a2.u09.l4
    title: 鯉魚門食海鮮
    teach: [g.daa-syun-plans, g.duration]
    tip: "Weather words for planning: 天氣預報 'forecast', 天晴 'sunny', 陰天 'cloudy', 落雪 'snow'. Duration: 食咗三個鐘."
    vocab: [w.tin1-hei3-jyu6-bou3, w.jyu6-bou3, w.hei3-wan1, w.tin1-cing4, w.jam1-tin1, w.sim2-din6, w.lok6-syut3, w.syut3, w.hoeng1-haa2, w.jyu4-cyun1, w.zau2-gaa1, w.maa5-tau4, w.ngon6]
    sentences:
      - { es: "鯉魚門係一條漁村，有好多海鮮酒家。", en: "Lei Yue Mun is a fishing village with lots of seafood restaurants.", altEs: ["鯉魚門係條漁村，有好多海鮮酒家。"], grammar: [g.hai6-identity, g.jau-have], vocab: [w.jyu4-cyun1, w.zau2-gaa1, w.hoi2-sin1] }
      - { es: "我哋坐船去鯉魚門，喺碼頭上岸。", en: "We're taking a boat to Lei Yue Mun and getting off at the pier.", altEs: ["我哋搭船去鯉魚門，喺碼頭上岸。"], grammar: [g.transport-verbs], vocab: [w.maa5-tau4, w.syun4] }
      - { es: "喺鯉魚門，你可以先揀海鮮，再拎去酒家煮。", en: "In Lei Yue Mun you first choose your seafood, then take it to a restaurant to be cooked.", altEs: ["喺鯉魚門可以先揀海鮮，再拎去酒家煮。"], grammar: [g.sin-zoi-sequence], vocab: [w.gaan2, w.zau2-gaa1, w.zyu2] }
      - { es: "天氣預報話聽日天晴，我哋去行山啦。", en: "The forecast says it'll be sunny tomorrow, let's go hiking.", altEs: ["天氣預報話聽日天晴，去行山啦。"], grammar: [g.weather, g.laa1-suggestion], vocab: [w.tin1-hei3-jyu6-bou3, w.tin1-cing4], transform: { instruction: "Say it as a plan with 打算 instead of a suggestion", answer: "天氣預報話聽日天晴，我哋打算去行山。", alt: ["預報話聽日天晴，我哋打算去行山。"], en: "The forecast says it will be sunny tomorrow, we're planning to go hiking." } }
      - { es: "今日陰天，不過冇落雨。", en: "It's cloudy today, but it hasn't rained.", altEs: ["今日陰天，但係冇落雨。"], grammar: [g.weather, g.mou-past-negation], vocab: [w.jam1-tin1] }
      - { es: "氣溫得十度咋，好凍。", en: "It's only ten degrees, it's freezing.", altEs: ["氣溫得十度，好凍呀。"], grammar: [g.zaa3-ze1-only, g.weather], vocab: [w.hei3-wan1, w.dou6.b, w.dung3] }
      - { es: "閃電喇，快啲入嚟！", en: "There's lightning, come inside quickly!", altEs: ["閃電呀，快啲入嚟！"], grammar: [g.laa3-change, g.laa1-suggestion], vocab: [w.sim2-din6] }
      - { es: "我好想睇落雪，所以打算寒假去日本。", en: "I really want to see snow falling, so I'm planning to go to Japan in the winter holidays.", altEs: ["我好想睇吓落雪，所以打算寒假去日本。"], grammar: [g.jan-wai-so-ji, g.daa-syun-plans], vocab: [w.lok6-syut3, w.hon4-gaa3] }
      - { es: "香港唔會落雪㗎。", en: "It doesn't snow in Hong Kong.", altEs: ["香港唔落雪㗎。"], grammar: [g.wui-will], vocab: [w.lok6-syut3] }
      - { es: "啲雪好白好靚，我玩咗成日。", en: "The snow was so white and pretty, I played in it all day.", altEs: ["啲雪又白又靚，我玩咗成日。"], grammar: [g.duration], vocab: [w.syut3, w.seng4-jat6] }
      - { es: "佢返咗鄉下兩個禮拜。", en: "He's been back in his home village for two weeks.", altEs: ["佢返鄉下返咗兩個禮拜。"], altEn: ["She went back to her home town for two weeks."], grammar: [g.duration], vocab: [w.hoeng1-haa2] }
      - { es: "預報話下晝會行雷，最好唔好去海灘。", en: "The forecast says there'll be thunder this afternoon, better not go to the beach.", altEs: ["天氣預報話下晝會行雷，最好唔好去海灘。"], grammar: [g.zeoi-hou-better, g.wui-will], vocab: [w.jyu6-bou3, w.haang4-leoi4, w.hoi2-taan1] }
      - { es: "我哋喺鯉魚門食咗三個鐘。", en: "We ate for three hours at Lei Yue Mun.", altEs: ["我哋喺鯉魚門食咗三個鐘喇。"], grammar: [g.duration], vocab: [w.sik6] }
      - { es: "你打算點樣去鯉魚門呀？坐船定坐車？", en: "How are you planning to get to Lei Yue Mun? By boat or by road?", altEs: ["你打算點去鯉魚門呀？坐船定坐車？"], grammar: [g.daa-syun-plans, g.transport-verbs], vocab: [w.daa2-syun3, w.dim2-joeng2] }
      - { es: "坐船去鯉魚門要半個鐘。", en: "The boat to Lei Yue Mun takes half an hour.", altEs: ["搭船去鯉魚門要半個鐘。"], grammar: [g.duration], vocab: [w.bun3, w.zung1], error: { wrong: "坐船去鯉魚門要半點鐘。", explain: "Half an hour is 半個鐘; 點鐘 is only for clock times.", grammar: g.duration } }
      - { es: "我哋喺鯉魚門食飯。", en: "We're eating at Lei Yue Mun.", altEs: ["我哋喺鯉魚門食飯呀。"], grammar: [g.hai2-location], vocab: [w.sik6-faan6], transform: { instruction: "Say you ate there for three hours, with 咗", answer: "我哋喺鯉魚門食咗三個鐘飯。", alt: ["我哋喺鯉魚門食飯食咗三個鐘。"], en: "We ate at Lei Yue Mun for three hours." } }
    exchanges:
      - q: { es: "聽日天氣點呀？", en: "What's the weather like tomorrow?" }
        a: { es: "天氣預報話天晴，好熱。", en: "The forecast says sunny and hot." }
        alt: ["天晴。", "預報話會落雨。"]
        grammar: [g.weather]
        vocab: [w.tin1-hei3-jyu6-bou3, w.tin1-cing4]
      - q: { es: "鯉魚門點去呀？", en: "How do you get to Lei Yue Mun?" }
        a: { es: "坐小巴或者坐船都得。", en: "You can take a minibus or a boat." }
        alt: ["坐船。", "坐小巴。"]
        grammar: [g.transport-verbs]
        vocab: [w.siu2-baa1, w.syun4]
      - q: { es: "你哋喺度食咗幾耐呀？", en: "How long did you eat there for?" }
        a: { es: "食咗三個鐘，好飽。", en: "Three hours, we're stuffed." }
        alt: ["三個鐘。", "兩個鐘左右。"]
        grammar: [g.duration]
        vocab: [w.gei2-noi6, w.baau2]
      - q: { es: "你喺邊度揀海鮮呀？", en: "Where do you choose the seafood?" }
        a: { es: "喺酒家門口揀，佢哋幫你煮。", en: "At the front of the restaurant, and they cook it for you." }
        alt: ["喺門口揀。", "喺街上面揀。"]
        grammar: [g.bong-help]
        vocab: [w.zau2-gaa1, w.hoi2-sin1]
      - q: { es: "香港會唔會落雪㗎？", en: "Does it snow in Hong Kong?" }
        a: { es: "唔會，香港冬天唔係好凍。", en: "No, winter in Hong Kong isn't that cold." }
        alt: ["唔會。", "唔會，最多有啲凍。"]
        grammar: [g.wui-will]
        vocab: [w.lok6-syut3, w.dung1-tin1]
    texts:
      - title: "鯉魚門"
        es: ["鯉魚門係一條細細嘅漁村。", "你可以先揀海鮮，再拎去酒家幫你煮。", "我哋食咗兩個鐘，下次一定再嚟。"]
        en: ["Lei Yue Mun is a small fishing village.", "You can choose your seafood first, then take it to a restaurant to cook for you.", "We ate for two hours, and we'll definitely come back next time."]
        grammar: [g.duration, g.zoi-vs-jau]
        vocab: [w.jyu4-cyun1, w.zau2-gaa1]
    spicy:
      - { es: "天氣預報話今晚好凍，你最好坐近啲我。", en: "The forecast says it'll be cold tonight, you'd better sit closer to me.", altEs: ["預報話今晚好凍，你最好坐近啲我。"], grammar: [g.zeoi-hou-better, g.weather], vocab: [w.tin1-hei3-jyu6-bou3, w.dung3] }
      - { es: "揀海鮮我唔識，揀人我就好叻。", en: "I'm no good at choosing seafood, but I'm great at choosing people.", altEs: ["揀海鮮我唔識，不過揀人我好叻。"], grammar: [g.sik-know-how], vocab: [w.gaan2, w.hoi2-sin1, w.lek1] }
      - { es: "我同你食咗三個鐘，仲未想走。", en: "I've been eating with you for three hours and I still don't want to leave.", altEs: ["同你食咗三個鐘，我仲未想走。"], grammar: [g.duration], vocab: [w.zau2.b] }
      - { es: "外面行雷閃電，入面得我同你。", en: "Outside there's thunder and lightning; inside it's just you and me.", altEs: ["出面行雷閃電，入面得你同我。"], grammar: [g.zing-hai-only], vocab: [w.sim2-din6, w.haang4-leoi4] }
      - { es: "落雪我都會嚟接你。", en: "Even if it snows, I'll come and pick you up.", altEs: ["就算落雪，我都會嚟接你。"], grammar: [g.wui-will], vocab: [w.lok6-syut3, w.zip3] }
dialogues:
  - id: a2.u09.d1
    title: 喺鯉魚門傾旅行
    context: Leo and 志明 are waiting for their crab at a seafood restaurant in Lei Yue Mun and talk about summer plans.
    lines:
      - { speaker: 志明, es: "Leo，你暑假有咩打算呀？", en: "Leo, what are your plans for the summer holidays?" }
      - { speaker: Leo, es: "我諗住去台灣旅行，可能去十日。", en: "I'm thinking of travelling to Taiwan, maybe for ten days." }
      - { speaker: 志明, es: "十日？咁耐！你打算自由行定參加旅行團呀？", en: "Ten days? That long! Are you planning to go independently or with a tour group?" }
      - { speaker: Leo, es: "自由行。我已經上網訂咗機票，不過仲未訂酒店。", en: "On my own. I've already booked my plane tickets online, but I haven't booked a hotel yet." }
      - { speaker: 志明, es: "我舊年喺台灣住過一間民宿，又平又乾淨。", en: "Last year I stayed in a guesthouse in Taiwan, it was cheap and clean." }
      - { speaker: Leo, es: "真係？你可唔可以畀個地址我呀？", en: "Really? Could you give me the address?" }
      - { speaker: 志明, es: "冇問題。嘩，隻蟹嚟喇！我哋頭先揀嗰隻好大隻。", en: "No problem. Wow, the crab's here! The one we picked earlier is huge." }
      - { speaker: Leo, es: "好香呀！鯉魚門啲海鮮真係好好食。", en: "It smells great! The seafood in Lei Yue Mun is really good." }
      - { speaker: 志明, es: "係呀，我每年都嚟幾次。下次你返嚟，我哋再嚟食啦。", en: "Yes, I come a few times every year. Next time you're back, let's come and eat here again." }
      - { speaker: Leo, es: "好吖！不過下次到我請。", en: "Sure! But next time it's my treat." }
    questions:
      - { q: "Leo暑假打算去邊度？", options: ["日本", "台灣", "曼谷"], answer: 1, explain: "Leo says 我諗住去台灣旅行." }
