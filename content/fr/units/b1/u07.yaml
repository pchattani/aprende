writing:
  - task: "Tell the story of Van Gogh's arrival in Arles: what he had already done and lived before (plus-que-parfait) and what he did there."
    min: 50
    max: 100
    use: [w.tournesol, w.impressionniste, w.peindre, w.souffrir, w.folie]
    useAtLeast: 3
    grammar: [g.plus-que-parfait]
    expect:
      - { pattern: "(?<![a-zàâçéèêëîïôûùœ])(avais|avait|avions|aviez|avaient|[eé]tais|[eé]tait|[eé]tions|[eé]tiez|[eé]taient) (d[eé]j[aà] |jamais |pas |bien |toujours )?[a-zàâçéèêëîïôûùœ]+(é|ée|és|ées|i|ie|is|ies|u|ue|us|ert|it|eint|cu)(?![a-zàâçéèêëîïôûùœ])", hint: "Use the plus-que-parfait for what happened before: il avait déjà vécu, il était venu…" }
    model: { es: "Quand Van Gogh est arrivé à Arles en 1888, il avait déjà vécu à Paris pendant deux ans. Il avait rencontré des peintres impressionnistes et il avait découvert la couleur. À Arles, il a peint des tournesols, des cafés et les arènes. Avant, il n'avait jamais vu une lumière aussi forte ! Malheureusement, il était déjà très malade, et il a beaucoup souffert de sa folie.", en: "When Van Gogh arrived in Arles in 1888, he had already lived in Paris for two years. He had met Impressionist painters and had discovered colour. In Arles he painted sunflowers, cafés and the arena. He had never seen such strong light before! Unfortunately he was already very ill, and he suffered a great deal from his madness." }
  - task: "Describe your day in Arles step by step, using après avoir / après être + past participle and avant de + infinitive."
    min: 50
    max: 100
    use: [w.après-avoir, w.avant-de, w.arène, w.romain, w.appareil-photo]
    useAtLeast: 3
