id: c2.u04
title: "Kinshasa, deux capitales face à face"
lessons:
  - id: c2.u04.l1
    title: Ne me divulgâche pas la fin !
    teach: [g.neologisms]
    tip: "French makes new words by derivation (ubériser), compounding (mot-dièse), blending (courriel, divulgâcher), clipping (appli) and borrowing (selfie). Québec's OQLF and France's terminology commission both propose official terms; usage decides which ones survive."
    vocab: [w.néologisme, w.divulgâcher, w.égoportrait, w.selfie, w.infox, w.mot-dièse, w.pourriel, w.clavardage, w.clavarder, w.ubériser, w.ubérisation, w.covoiturage, w.télétravail, w.visioconférence, w.mot-valise, w.mégapole, w.mégalopole, w.agglomération, w.bidonville, w.fleuve-congo.nm, w.face-à-face]
    sentences:
      - { es: "Ne me divulgâche pas la fin du film !", en: "Don't spoil the end of the film for me!", altEs: ["Ne me raconte pas la fin du film !", "Me divulgâche pas la fin du film !"], altEn: ["Don't give away the ending of the film!"], grammar: [g.neologisms, g.imperative-with-pronouns], vocab: [w.divulgâcher], note: "divulgâcher = divulguer + gâcher, proposed in Québec." }
      - { es: "« Divulgâcher » est un mot-valise : divulguer plus gâcher.", en: "'Divulgâcher' is a portmanteau word: divulguer (reveal) plus gâcher (spoil).", altEs: ["« Divulgâcher » est un mot-valise formé de « divulguer » et de « gâcher »."], grammar: [g.neologisms], vocab: [w.mot-valise, w.divulgâcher] }
      - { es: "Le mot « courriel » vient du Québec : c'est le courrier électronique en un seul mot.", en: "The word 'courriel' comes from Québec: it's electronic mail in a single word.", altEs: ["Le mot « courriel » vient du Québec ; c'est « courrier électronique » en un seul mot."], grammar: [g.neologisms], vocab: [] }
      - { es: "Au Québec, on publie un égoportrait ; en France, on poste un selfie.", en: "In Québec you post an 'égoportrait'; in France you post a selfie.", altEs: ["Au Québec on publie un égoportrait, en France on poste un selfie."], grammar: [g.neologisms, g.on-nous], vocab: [w.égoportrait, w.selfie] }
      - { es: "Méfiez-vous des infox qui circulent pendant les élections.", en: "Beware of the fake news that circulates during elections.", altEs: ["Méfiez-vous des fausses nouvelles qui circulent pendant les élections.", "Méfiez-vous des infox qui circulent en période électorale."], grammar: [g.neologisms, g.imperative], vocab: [w.infox], note: "infox (information + intox) became the official French term in 2018." }
      - { es: "Ajoute un mot-dièse à ta publication, sinon personne ne la verra.", en: "Add a hashtag to your post, otherwise nobody will see it.", altEs: ["Ajoute un hashtag à ta publication, sinon personne ne la verra."], grammar: [g.neologisms, g.futur-simple-forms], vocab: [w.mot-dièse] }
      - { es: "Ma boîte de réception est pleine de pourriels.", en: "My inbox is full of spam.", altEs: ["Ma boîte de réception est remplie de pourriels.", "Ma boîte mail est pleine de spams."], grammar: [g.neologisms], vocab: [w.pourriel] }
      - { es: "Mes cousins de Montréal clavardent avec nous tous les dimanches.", en: "My cousins in Montreal chat online with us every Sunday.", altEs: ["Mes cousins de Montréal chattent avec nous tous les dimanches.", "Tous les dimanches, mes cousins de Montréal clavardent avec nous."], grammar: [g.neologisms], vocab: [w.clavarder], transform: { instruction: "Use the noun 'clavardage' instead of the verb", answer: "Tous les dimanches, on fait du clavardage avec nos cousins de Montréal.", alt: ["Le dimanche, c'est clavardage avec nos cousins de Montréal.", "Tous les dimanches, nous faisons du clavardage avec nos cousins de Montréal."], en: "Every Sunday we chat online with our cousins in Montreal." } }
      - { es: "Le clavardage a remplacé les longs coups de fil du dimanche.", en: "Online chat has replaced the long Sunday phone calls.", altEs: ["Le clavardage a pris la place des longs coups de fil du dimanche."], grammar: [g.neologisms, g.passe-compose-avoir], vocab: [w.clavardage] }
      - { es: "Les applis de transport ont ubérisé les taxis, à Kinshasa comme ailleurs.", en: "Ride-hailing apps have uberised taxis, in Kinshasa as elsewhere.", altEs: ["Les applications de transport ont ubérisé les taxis, à Kinshasa comme ailleurs."], grammar: [g.neologisms, g.passe-compose-avoir], vocab: [w.ubériser], error: { wrong: "Les applis de transport ont ubérisés les taxis.", explain: "New verbs from brand names are regular -er verbs: with avoir, the participle ubérisé does not agree with the subject.", grammar: g.neologisms } }
      - { es: "L'ubérisation transforme le marché du travail.", en: "Uberisation is transforming the job market.", grammar: [g.neologisms], vocab: [w.ubérisation], transform: { instruction: "Use the verb 'ubériser' in the passive", answer: "Le marché du travail est ubérisé.", alt: ["Le marché du travail est en train d'être ubérisé.", "Le marché du travail se fait ubériser."], en: "The job market is being uberised." } }
      - { es: "Pour aller au bureau, je fais du covoiturage avec deux collègues.", en: "To get to the office, I car-share with two colleagues.", altEs: ["Pour aller au bureau, je fais du covoiturage avec deux collègues de travail."], grammar: [g.neologisms, g.jouer-faire-de], vocab: [w.covoiturage] }
      - { es: "Depuis que je suis en télétravail, je fais trois visioconférences par jour.", en: "Since I've been working from home, I do three video calls a day.", altEs: ["Depuis que je télétravaille, je fais trois visioconférences par jour.", "Depuis que je suis en télétravail, j'ai trois visios par jour."], grammar: [g.neologisms, g.depuis-present], vocab: [w.télétravail, w.visioconférence] }
      - { es: "Un néologisme ne vit que si les gens l'adoptent.", en: "A new word only lives if people adopt it.", altEs: ["Un néologisme ne survit que si les gens l'adoptent."], grammar: [g.neologisms, g.negation-jamais-plus-rien], vocab: [w.néologisme] }
      - { es: "Kinshasa et Brazzaville se font face, de part et d'autre du fleuve Congo.", en: "Kinshasa and Brazzaville face each other, on either side of the Congo River.", altEs: ["Kinshasa et Brazzaville se font face de chaque côté du fleuve Congo."], grammar: [g.pronominal-verbs], vocab: [w.fleuve-congo.nm, w.face-à-face] }
      - { es: "On dit souvent que ce sont les deux capitales les plus proches du monde.", en: "People often say they're the two closest capitals in the world.", altEs: ["On dit souvent que ce sont les capitales les plus proches du monde."], grammar: [g.superlatives], vocab: [], note: "Leaving aside Rome and the Vatican." }
      - { es: "Avec plus de quinze millions d'habitants, Kinshasa est devenue une mégapole.", en: "With more than fifteen million inhabitants, Kinshasa has become a megacity.", altEs: ["Avec plus de 15 millions d'habitants, Kinshasa est devenue une mégapole.", "Kinshasa, avec plus de quinze millions d'habitants, est devenue une mégapole."], grammar: [g.passe-compose-etre], vocab: [w.mégapole] }
      - { es: "Autour du centre s'étend une immense agglomération, avec des quartiers riches et des bidonvilles.", en: "Around the centre stretches a vast conurbation, with wealthy districts and shanty towns.", altEs: ["Une immense agglomération s'étend autour du centre, avec des quartiers riches et des bidonvilles."], grammar: [g.literary-inversion], vocab: [w.agglomération, w.bidonville] }
      - { es: "Une mégalopole, c'est plusieurs grandes villes qui finissent par se toucher.", en: "A megalopolis is several big cities that end up merging into one another.", altEs: ["Une mégalopole, ce sont plusieurs grandes villes qui finissent par se toucher."], grammar: [g.neologisms, g.c-est-il-est], vocab: [w.mégalopole] }
    exchanges:
      - q: { es: "Tu as vu le dernier épisode ?", en: "Have you seen the last episode?" }
        a: { es: "Pas encore, alors ne me divulgâche rien, s'il te plaît !", en: "Not yet, so don't spoil anything for me, please!" }
        alt: ["Pas encore, ne me raconte rien !", "Oui, mais je ne te divulgâche rien."]
        grammar: [g.neologisms]
        vocab: [w.divulgâcher]
      - q: { es: "C'est quoi, un égoportrait ?", en: "What's an 'égoportrait'?" }
        a: { es: "Le mot québécois pour « selfie » : une photo de soi-même.", en: "The Québec word for 'selfie': a photo of yourself." }
        alt: ["Un selfie, au Québec.", "Une photo qu'on prend de soi-même."]
        grammar: [g.neologisms]
        vocab: [w.égoportrait, w.selfie]
      - q: { es: "Comment tu vas au travail ?", en: "How do you get to work?" }
        a: { es: "En covoiturage le lundi, et le reste de la semaine, je suis en télétravail.", en: "Car-sharing on Monday, and the rest of the week I work from home." }
        alt: ["En covoiturage.", "Je suis en télétravail."]
        grammar: [g.neologisms]
        vocab: [w.covoiturage, w.télétravail]
      - q: { es: "Tu crois cette histoire qui circule sur les réseaux ?", en: "Do you believe that story going round on social media?" }
        a: { es: "Non, c'est une infox : aucun journal sérieux n'en parle.", en: "No, it's fake news: no serious newspaper is reporting it." }
        alt: ["Non, c'est une infox.", "Je vérifie d'abord, il y a tellement d'infox."]
        grammar: [g.neologisms, g.ni-ni-aucun]
        vocab: [w.infox]
      - q: { es: "On peut aller à Brazzaville en bateau ?", en: "Can you get to Brazzaville by boat?" }
        a: { es: "Oui, il suffit de traverser le fleuve Congo, mais il faut un visa.", en: "Yes, you just cross the Congo River, but you need a visa." }
        alt: ["Oui, en traversant le fleuve.", "Oui, c'est juste en face."]
        grammar: [g.il-faut]
        vocab: [w.fleuve-congo.nm]
    texts:
      - title: "Message d'un collègue"
        es: ["Réunion en visioconférence à dix heures.", "Je t'ai envoyé le lien par courriel ; vérifie tes pourriels si tu ne le trouves pas.", "Et ne divulgâche pas la surprise pour le départ du chef !"]
        en: ["Video meeting at ten.", "I sent you the link by email; check your spam if you can't find it.", "And don't spoil the surprise for the boss's leaving party!"]
        grammar: [g.neologisms, g.imperative]
        vocab: [w.visioconférence, w.pourriel, w.divulgâcher]
      - title: "Kinshasa en chiffres"
        es: ["Plus de quinze millions d'habitants, selon les estimations.", "Une agglomération qui s'étend le long du fleuve Congo.", "En face, Brazzaville, l'autre capitale."]
        en: ["More than fifteen million inhabitants, according to estimates.", "A conurbation stretching along the Congo River.", "Opposite, Brazzaville, the other capital."]
        grammar: [g.neologisms]
        vocab: [w.agglomération, w.fleuve-congo.nm]
    spicy:
      - { es: "Ne me divulgâche pas la fin de la soirée ; je préfère la découvrir avec toi.", en: "Don't spoil the end of the evening for me; I'd rather discover it with you.", altEs: ["Ne me divulgâche pas la fin de la soirée, je préfère la découvrir avec toi."], grammar: [g.neologisms, g.imperative-with-pronouns], vocab: [w.divulgâcher] }
      - { es: "Un égoportrait à deux, ça s'appelle comment ? Un nousportrait ?", en: "What do you call a selfie for two? An 'us-portrait'?", altEs: ["Un égoportrait à deux, comment ça s'appelle ? Un nousportrait ?"], grammar: [g.neologisms], vocab: [w.égoportrait] }
      - { es: "Ton message a fini dans mes pourriels ; heureusement, je vérifie tous les jours, au cas où ce serait toi.", en: "Your message ended up in my spam; luckily I check every day, in case it's you.", altEs: ["Ton message a fini dans mes pourriels ; heureusement, je les vérifie tous les jours au cas où ce serait toi."], grammar: [g.neologisms, g.conditionnel-present], vocab: [w.pourriel] }
      - { es: "Fini le clavardage : je propose un face-à-face, ce soir, au bord du fleuve.", en: "Enough online chat: I suggest a face-to-face, tonight, by the river.", altEs: ["Assez de clavardage : je propose un face-à-face ce soir au bord du fleuve."], grammar: [g.neologisms], vocab: [w.clavardage, w.face-à-face] }
      - { es: "Covoiturage ce matin, visioconférence cet après-midi… ce soir, je veux juste un tête-à-tête.", en: "Car-sharing this morning, a video call this afternoon… tonight, I just want a tête-à-tête.", altEs: ["Covoiturage ce matin, visioconférence cet après-midi, et ce soir, je veux juste un tête-à-tête."], grammar: [g.neologisms], vocab: [w.covoiturage, w.visioconférence] }
  - id: c2.u04.l2
    title: C'est ouf !
    teach: [g.verlan-slang]
    tip: "Verlan reverses syllables (à l'envers → verlan): fou → ouf, lourd → relou, louche → chelou, femme → meuf. Argot: thune, taf, bouffe, kiffer, pote. Recognise all of it; use it only with friends, and sparingly."
    vocab: [w.verlan, w.meuf, w.keum, w.ouf.adj, w.relou, w.chelou, w.louche, w.zarbi, w.vénère, w.teuf, w.keuf, w.pote, w.frangin, w.thune, w.kiffer, w.kif, w.taf, w.galère, w.galérer, w.bouffe, w.mytho, w.grave.adv, w.béton]
    sentences:
      - { es: "C'est ouf, cette ville !", en: "This city is amazing!", altEs: ["Elle est ouf, cette ville !", "C'est fou, cette ville !"], altEn: ["This city is crazy!"], grammar: [g.verlan-slang, g.dislocation], vocab: [w.ouf.adj], note: "ouf = fou in verlan." }
      - { es: "Il est trop relou, ton pote : il parle pendant tout le film.", en: "Your mate is so annoying: he talks through the whole film.", altEs: ["Il est trop lourd, ton pote : il parle pendant tout le film.", "Ton pote est trop relou, il parle pendant tout le film."], grammar: [g.verlan-slang, g.dislocation], vocab: [w.relou, w.pote] }
      - { es: "C'est chelou, ce bruit dans la cuisine.", en: "That noise in the kitchen is weird.", altEs: ["C'est bizarre, ce bruit dans la cuisine.", "C'est louche, ce bruit dans la cuisine."], grammar: [g.verlan-slang], vocab: [w.chelou, w.louche], note: "chelou = louche (shady, dodgy) in verlan." }
      - { es: "Ce type est louche, il pose trop de questions.", en: "That guy is dodgy, he asks too many questions.", altEs: ["Ce type est chelou, il pose trop de questions."], grammar: [g.verlan-slang], vocab: [w.louche] }
      - { es: "Verlan, ça vient de « l'envers » : on inverse les syllabes.", en: "Verlan comes from 'l'envers' (backwards): you swap the syllables.", altEs: ["Le mot « verlan » vient de « l'envers » : on inverse les syllabes."], grammar: [g.verlan-slang], vocab: [w.verlan] }
      - { es: "On va à une teuf ce soir ? C'est chez le frangin de Karim.", en: "Shall we go to a party tonight? It's at Karim's brother's.", altEs: ["On va à une fête ce soir ? C'est chez le frère de Karim.", "On va en teuf ce soir ? C'est chez le frangin de Karim."], grammar: [g.verlan-slang], vocab: [w.teuf, w.frangin] }
      - { es: "Je kiffe grave cette chanson.", en: "I really love this song.", altEs: ["J'adore cette chanson.", "Je kiffe trop cette chanson."], altEn: ["I'm totally into this song."], grammar: [g.verlan-slang], vocab: [w.kiffer, w.grave.adv], transform: { instruction: "Say it in neutral French", answer: "J'aime beaucoup cette chanson.", alt: ["J'adore cette chanson.", "Cette chanson me plaît beaucoup."], en: "I really like this song." } }
      - { es: "Ce concert, c'était un vrai kif.", en: "That concert was a real buzz.", altEs: ["Ce concert, c'était le kif.", "Ce concert, c'était vraiment génial."], grammar: [g.verlan-slang, g.c-etait], vocab: [w.kif] }
      - { es: "J'ai plus de thune, je peux pas sortir ce week-end.", en: "I'm out of cash, I can't go out this weekend.", altEs: ["Je n'ai plus d'argent, je ne peux pas sortir ce week-end.", "J'ai plus de thunes, je peux pas sortir ce week-end."], grammar: [g.verlan-slang, g.spoken-negation], vocab: [w.thune], error: { wrong: "J'ai plus de la thune, je peux pas sortir ce week-end.", explain: "Even in slang, the negative takes de, not de la: j'ai plus de thune.", grammar: g.de-after-negation } }
      - { es: "Je cherche un taf pour l'été, n'importe quoi.", en: "I'm looking for a job for the summer, anything.", altEs: ["Je cherche un boulot pour l'été, n'importe quoi.", "Je cherche un travail pour l'été, n'importe lequel."], grammar: [g.verlan-slang], vocab: [w.taf] }
      - { es: "Quelle galère, ce trajet ! On a galéré deux heures pour trouver un taxi.", en: "What a nightmare, this journey! We struggled for two hours to find a taxi.", altEs: ["Quelle galère, ce trajet ! On a mis deux heures à trouver un taxi."], grammar: [g.verlan-slang, g.passe-compose-avoir], vocab: [w.galère, w.galérer] }
      - { es: "La bouffe est bonne ici, et c'est pas cher.", en: "The grub is good here, and it's not expensive.", altEs: ["La nourriture est bonne ici, et ce n'est pas cher."], grammar: [g.verlan-slang, g.spoken-negation], vocab: [w.bouffe] }
      - { es: "Arrête de mytho, personne te croit.", en: "Stop making stuff up, nobody believes you.", altEs: ["Arrête de mentir, personne ne te croit.", "Arrête de mytho, personne ne te croit."], grammar: [g.verlan-slang, g.spoken-negation], vocab: [w.mytho], note: "mytho (from mythomane) is a noun and, in slang, a verb." }
      - { es: "Ma meuf est vénère : j'ai oublié son anniversaire.", en: "My girlfriend is fuming: I forgot her birthday.", altEs: ["Ma copine est énervée : j'ai oublié son anniversaire.", "Ma meuf est vénère, j'ai oublié son anniversaire."], grammar: [g.verlan-slang], vocab: [w.meuf, w.vénère] }
      - { es: "Il est zarbi, ce keum : il porte des lunettes de soleil la nuit.", en: "That guy is weird: he wears sunglasses at night.", altEs: ["Il est bizarre, ce mec : il porte des lunettes de soleil la nuit."], grammar: [g.verlan-slang, g.dislocation], vocab: [w.zarbi, w.keum] }
      - { es: "Attention, les keufs arrivent !", en: "Watch out, the cops are coming!", altEs: ["Attention, la police arrive !", "Attention, les flics arrivent !"], grammar: [g.verlan-slang], vocab: [w.keuf] }
      - { es: "« Laisse béton », chantait Renaud en mille neuf cent soixante-dix-sept : c'est « laisse tomber » en verlan.", en: "'Laisse béton', Renaud sang in 1977: it's 'laisse tomber' (forget it) in verlan.", altEs: ["Renaud chantait « Laisse béton » en 1977 : c'est « laisse tomber » en verlan."], grammar: [g.verlan-slang, g.imparfait-uses], vocab: [w.béton, w.verlan] }
    exchanges:
      - q: { es: "Alors, ce concert ?", en: "So, how was the concert?" }
        a: { es: "C'était ouf ! J'ai kiffé du début à la fin.", en: "It was amazing! I loved it from start to finish." }
        alt: ["Trop bien, c'était ouf.", "Un vrai kif !"]
        grammar: [g.verlan-slang]
        vocab: [w.ouf.adj, w.kiffer]
      - q: { es: "Tu viens à la teuf samedi ?", en: "Are you coming to the party on Saturday?" }
        a: { es: "J'aimerais bien, mais j'ai pas de thune et je bosse dimanche.", en: "I'd love to, but I'm broke and I'm working on Sunday." }
        alt: ["Grave, je viens !", "Non, c'est trop la galère pour moi ce week-end."]
        grammar: [g.verlan-slang, g.spoken-negation]
        vocab: [w.teuf, w.thune]
      - q: { es: "Pourquoi tu fais cette tête ?", en: "Why the long face?" }
        a: { es: "Mon frangin m'a emprunté ma voiture et il l'a rendue sans essence. Je suis vénère.", en: "My brother borrowed my car and gave it back with no petrol. I'm fuming." }
        alt: ["Je suis vénère.", "Quelle galère, ma journée !"]
        grammar: [g.verlan-slang, g.pc-object-agreement]
        vocab: [w.frangin, w.vénère]
      - q: { es: "Tu le crois, quand il dit qu'il a rencontré Papa Wemba ?", en: "Do you believe him when he says he met Papa Wemba?" }
        a: { es: "Pas du tout, c'est un mytho, il invente tout.", en: "Not at all, he's a fibber, he makes everything up." }
        alt: ["Non, c'est un mytho.", "Laisse béton, il mytho."]
        grammar: [g.verlan-slang]
        vocab: [w.mytho]
      - q: { es: "Je peux dire « meuf » à ma prof ?", en: "Can I say 'meuf' to my teacher?" }
        a: { es: "Surtout pas ! Le verlan, c'est entre potes.", en: "Definitely not! Verlan is for between mates." }
        alt: ["Non, c'est trop familier.", "Évite, c'est entre potes."]
        grammar: [g.verlan-slang]
        vocab: [w.meuf, w.verlan, w.pote]
    texts:
      - title: "Message d'un pote"
        es: ["Wesh, t'es où ?", "La teuf a commencé, la bouffe est ouf.", "Ramène ton frangin, mais pas son pote relou."]
        en: ["Hey, where are you?", "The party's started, the food is amazing.", "Bring your brother, but not his annoying mate."]
        grammar: [g.verlan-slang]
        vocab: [w.teuf, w.bouffe, w.ouf.adj, w.frangin, w.pote, w.relou]
      - title: "Le même message, en français standard"
        es: ["Salut, où es-tu ?", "La fête a commencé et la nourriture est excellente.", "Amène ton frère, mais pas son ami pénible."]
        en: ["Hi, where are you?", "The party has started and the food is excellent.", "Bring your brother, but not his tiresome friend."]
        grammar: [g.verlan-slang, g.inversion-questions]
        vocab: []
    spicy:
      - { es: "T'es ouf, toi : tu m'as fait danser jusqu'à quatre heures, et j'en redemande.", en: "You're crazy: you had me dancing till four, and I want more.", altEs: ["Tu es ouf, toi : tu m'as fait danser jusqu'à quatre heures, et j'en redemande."], grammar: [g.verlan-slang, g.faire-causatif], vocab: [w.ouf.adj] }
      - { es: "Je kiffe grave ton sourire, mais ton pote relou peut rentrer chez lui.", en: "I'm totally into your smile, but your annoying mate can go home.", altEs: ["Je kiffe grave ton sourire, mais ton pote relou, il peut rentrer chez lui."], grammar: [g.verlan-slang], vocab: [w.kiffer, w.grave.adv, w.pote, w.relou] }
      - { es: "C'est chelou : chaque fois que tu passes, j'oublie ce que je voulais dire.", en: "It's weird: every time you walk by, I forget what I meant to say.", altEs: ["C'est chelou, chaque fois que tu passes, j'oublie ce que je voulais dire."], grammar: [g.verlan-slang, g.ce-qui-ce-que], vocab: [w.chelou] }
      - { es: "J'ai pas de thune pour un resto, mais j'ai une couverture, un parc et une bouteille de jus.", en: "I've got no cash for a restaurant, but I have a blanket, a park and a bottle of juice.", altEs: ["Je n'ai pas de thune pour un resto, mais j'ai une couverture, un parc et une bouteille de jus."], grammar: [g.verlan-slang, g.spoken-negation], vocab: [w.thune] }
      - { es: "Arrête de mytho : tu n'es pas venu à la teuf pour la musique.", en: "Stop making things up: you didn't come to the party for the music.", altEs: ["Arrête de mytho, tu n'es pas venue à la teuf pour la musique."], grammar: [g.verlan-slang], vocab: [w.mytho, w.teuf] }
  - id: c2.u04.l3
    title: La Sape et la débrouille
    teach: [g.neologisms, g.verlan-slang]
    tip: "Kinshasa's street French coins its own words: ambiancer, un ambianceur, la Sape (an acronym that is also slang for clothes). Système D is everyday resourcefulness, from the slang verb se débrouiller."
    vocab: [w.sapeur, w.sape, w.dandy, w.frime, w.frimer, w.ambiancer, w.ambianceur, w.rumba, w.paroles, w.griffe, w.haute-couture, w.couturière, w.coquet, w.débrouillard, w.se-débrouiller, w.débrouille, w.système-d, w.vendeur-ambulant, w.marché-noir, w.se-saper]
    sentences:
      - { es: "La Sape, c'est la Société des ambianceurs et des personnes élégantes.", en: "La Sape is the Society of Ambiance-Makers and Elegant People.", altEs: ["La SAPE, c'est la Société des ambianceurs et des personnes élégantes."], grammar: [g.neologisms], vocab: [w.sape, w.ambianceur], note: "An acronym that is also a pun: la sape, se saper = clothes, to dress (slang)." }
      - { es: "Le dimanche, les sapeurs défilent dans leurs costumes de couleur, comme des dandys.", en: "On Sundays the sapeurs parade in their coloured suits, like dandies.", altEs: ["Le dimanche, les sapeurs défilent en costumes de couleur, comme des dandys."], grammar: [g.neologisms], vocab: [w.sapeur, w.dandy] }
      - { es: "Pour un sapeur, la griffe compte plus que le prix.", en: "For a sapeur, the designer label matters more than the price.", altEs: ["Pour un sapeur, la marque compte plus que le prix."], grammar: [g.comparatives], vocab: [w.griffe, w.sapeur] }
      - { es: "Il a économisé six mois pour une veste de haute couture.", en: "He saved for six months for a haute couture jacket.", altEs: ["Il a mis six mois d'économies dans une veste de haute couture."], grammar: [g.passe-compose-avoir], vocab: [w.haute-couture] }
      - { es: "Il est très coquet : il change de chaussures trois fois par jour.", en: "He's very particular about his looks: he changes shoes three times a day.", altEs: ["Il est très coquet, il change de chaussures trois fois par jour.", "Elle est très coquette : elle change de chaussures trois fois par jour."], grammar: [g.verlan-slang], vocab: [w.coquet] }
      - { es: "Arrête de frimer avec ta montre, tout le monde l'a vue.", en: "Stop showing off with your watch, everyone has seen it.", altEs: ["Arrête de frimer avec ta montre, tout le monde l'a déjà vue."], grammar: [g.verlan-slang, g.pc-object-agreement], vocab: [w.frimer] }
      - { es: "Chez les sapeurs, la frime est un art, pas un défaut.", en: "Among the sapeurs, showing off is an art, not a flaw.", altEs: ["Pour les sapeurs, la frime est un art, pas un défaut."], grammar: [g.verlan-slang], vocab: [w.frime] }
      - { es: "La couturière du quartier a refait mon costume en deux jours.", en: "The local dressmaker remade my suit in two days.", altEs: ["La couturière du quartier m'a refait mon costume en deux jours."], grammar: [g.passe-compose-avoir], vocab: [w.couturière] }
      - { es: "Ce musicien sait ambiancer une salle en trois notes.", en: "This musician can liven up a room in three notes.", altEs: ["Ce musicien sait mettre l'ambiance dans une salle en trois notes."], grammar: [g.neologisms, g.savoir-connaitre], vocab: [w.ambiancer], note: "ambiancer is a Central and West African coinage: to create a party atmosphere." }
      - { es: "La rumba congolaise est inscrite au patrimoine immatériel de l'UNESCO depuis deux mille vingt et un.", en: "Congolese rumba has been on UNESCO's intangible heritage list since 2021.", altEs: ["Depuis 2021, la rumba congolaise est inscrite au patrimoine immatériel de l'UNESCO."], grammar: [g.passive-voice, g.depuis-present], vocab: [w.rumba] }
      - { es: "Les paroles mélangent le lingala et le français, parfois dans le même vers.", en: "The lyrics mix Lingala and French, sometimes in the same line.", altEs: ["Les paroles mêlent le lingala et le français, parfois dans un même vers."], grammar: [g.neologisms], vocab: [w.paroles, w.lingala] }
      - { es: "À Kinshasa, il faut être débrouillard : tout le monde se débrouille comme il peut.", en: "In Kinshasa you have to be resourceful: everyone gets by as best they can.", altEs: ["À Kinshasa, il faut être débrouillard ; chacun se débrouille comme il peut."], grammar: [g.verlan-slang, g.il-faut], vocab: [w.débrouillard, w.se-débrouiller] }
      - { es: "Selon une plaisanterie célèbre, l'« article quinze » de la constitution dit : « Débrouillez-vous ».", en: "According to a famous joke, 'Article 15' of the constitution says: 'Fend for yourselves'.", altEs: ["Selon une blague célèbre, l'« article 15 » de la constitution dit : « Débrouillez-vous »."], grammar: [g.imperative], vocab: [w.se-débrouiller], note: "A running joke in the DR Congo about everyday resourcefulness." }
      - { es: "La débrouille, c'est ce qu'on appelle en France le système D.", en: "La débrouille is what in France they call 'système D'.", altEs: ["La débrouille, c'est ce qu'en France on appelle le système D."], grammar: [g.verlan-slang, g.ce-qui-ce-que], vocab: [w.débrouille, w.système-d] }
      - { es: "Dans les embouteillages, des vendeurs ambulants proposent de l'eau, du crédit téléphonique et des cacahuètes.", en: "In the traffic jams, street vendors offer water, phone credit and peanuts.", altEs: ["Dans les embouteillages, les vendeurs ambulants vendent de l'eau, du crédit téléphonique et des cacahuètes."], grammar: [g.partitive-articles], vocab: [w.vendeur-ambulant] }
      - { es: "Ce parfum « de luxe » vient sûrement du marché noir.", en: "That 'luxury' perfume surely comes from the black market.", altEs: ["Ce parfum « de luxe » vient sans doute du marché noir."], grammar: [g.verlan-slang], vocab: [w.marché-noir], error: { wrong: "Ce parfum « de luxe » vient sûrement du noir marché.", explain: "In marché noir the colour adjective follows the noun, as colour adjectives do.", grammar: g.adjective-position } }
      - { es: "Mon oncle se débrouille toujours.", en: "My uncle always manages.", grammar: [g.verlan-slang], vocab: [w.se-débrouiller], transform: { instruction: "Use the adjective 'débrouillard' with être", answer: "Mon oncle est toujours débrouillard.", alt: ["Mon oncle est très débrouillard.", "Mon oncle est débrouillard."], en: "My uncle is always resourceful." } }
    exchanges:
      - q: { es: "Pourquoi tu as mis ce costume rose ?", en: "Why have you put on that pink suit?" }
        a: { es: "C'est dimanche : un sapeur ne sort jamais sans sa plus belle griffe.", en: "It's Sunday: a sapeur never goes out without his finest label." }
        alt: ["Pour frimer un peu.", "C'est dimanche, je me sape."]
        grammar: [g.verlan-slang]
        vocab: [w.sapeur, w.griffe]
      - q: { es: "Tu comprends les paroles de cette rumba ?", en: "Do you understand the lyrics of this rumba?" }
        a: { es: "La moitié : le refrain est en lingala, les couplets en français.", en: "Half: the chorus is in Lingala, the verses in French." }
        alt: ["Juste les mots en français.", "Pas tout, mais je kiffe la musique."]
        grammar: [g.neologisms]
        vocab: [w.paroles, w.rumba]
      - q: { es: "Comment tu as trouvé un billet pour le concert ?", en: "How did you find a ticket for the concert?" }
        a: { es: "Système D : un ami d'un ami connaissait le videur.", en: "Système D: a friend of a friend knew the bouncer." }
        alt: ["Je me suis débrouillé.", "La débrouille, comme toujours."]
        grammar: [g.neologisms]
        vocab: [w.système-d]
      - q: { es: "Qui va ambiancer la fête ?", en: "Who's going to liven up the party?" }
        a: { es: "Mon cousin : c'est le plus grand ambianceur de Kinshasa.", en: "My cousin: he's the biggest party animal in Kinshasa." }
        alt: ["Un groupe de rumba.", "Mon cousin, il ambiance tout le monde."]
        grammar: [g.neologisms, g.superlatives]
        vocab: [w.ambiancer, w.ambianceur]
    texts:
      - title: "Légende d'une photo"
        es: ["Kinshasa, un dimanche après-midi.", "Deux sapeurs défilent devant les vendeurs ambulants.", "Costume de haute couture et chaussures de griffe : la frime est un art."]
        en: ["Kinshasa, a Sunday afternoon.", "Two sapeurs parade past the street vendors.", "A haute couture suit and designer shoes: showing off is an art."]
        grammar: [g.neologisms]
        vocab: [w.sapeur, w.vendeur-ambulant, w.haute-couture, w.griffe, w.frime]
      - title: "Annonce dans un salon de coiffure"
        es: ["Couturière débrouillarde cherche clients coquets.", "Retouches, costumes sur mesure, prix d'ami.", "Pas de marché noir : ici, tout est fait main."]
        en: ["Resourceful dressmaker seeks well-dressed clients.", "Alterations, made-to-measure suits, friendly prices.", "No black market: here, everything is handmade."]
        grammar: [g.neologisms]
        vocab: [w.couturière, w.débrouillard, w.coquet, w.marché-noir]
    spicy:
      - { es: "Je me suis sapé pour toi : costume, griffe et parfum. Tu remarques, ou je recommence ?", en: "I dressed up for you: suit, label and perfume. Do you notice, or shall I start again?", altEs: ["Je me suis sapée pour toi : robe, griffe et parfum. Tu remarques, ou je recommence ?"], grammar: [g.verlan-slang, g.pronominal-passe-compose], vocab: [w.griffe, w.se-saper] }
      - { es: "Tu frimes avec ta montre ; moi, je frime avec toi à mon bras.", en: "You show off with your watch; I show off with you on my arm.", altEs: ["Tu frimes avec ta montre, et moi, je frime avec toi à mon bras."], grammar: [g.verlan-slang, g.stressed-pronouns], vocab: [w.frimer] }
      - { es: "Pas besoin d'ambianceur ce soir : quand tu danses la rumba, toute la salle s'allume.", en: "No need for a party starter tonight: when you dance the rumba, the whole room lights up.", altEs: ["Pas besoin d'ambianceur ce soir ; quand tu danses la rumba, toute la salle s'allume."], grammar: [g.neologisms], vocab: [w.ambianceur, w.rumba] }
      - { es: "Je suis débrouillard : j'ai trouvé ton numéro sans le demander à personne. Ça te fait peur ou ça te plaît ?", en: "I'm resourceful: I found your number without asking anyone. Does that scare you or do you like it?", altEs: ["Je suis débrouillarde : j'ai trouvé ton numéro sans le demander à personne. Ça te fait peur ou ça te plaît ?"], grammar: [g.verlan-slang, g.ni-ni-aucun], vocab: [w.débrouillard] }
      - { es: "Ce n'est pas de la frime : je danse vraiment aussi bien, et je te le prouve tout de suite.", en: "It's not showing off: I really do dance this well, and I'll prove it to you right now.", altEs: ["Ce n'est pas de la frime, je danse vraiment aussi bien, et je te le prouve tout de suite."], grammar: [g.double-object-pronouns], vocab: [w.frime] }
  - id: c2.u04.l4
    title: Le comble de l'électricien
    teach: [g.wordplay]
    tip: "French is full of homophones (vers, vert, verre, ver; mer, mère, maire), which fuels calembours, punning names and shop signs. Contrepèteries swap sounds between words; many hide a risqué meaning, so be careful whom you tell them to."
    vocab: [w.calembour, w.jeu-de-mots, w.contrepèterie, w.homophone, w.double-sens, w.humoriste, w.humoristique, w.connivence, w.complice, w.ironie, w.ironique, w.sarcasme, w.sarcastique, w.caricature, w.parodie, w.pastiche, w.satire, w.satirique, w.canular, w.vanne, w.chambrer, w.taquiner, w.se-moquer, w.moquerie, w.salon-de-coiffure, w.comble]
    sentences:
      - { es: "Quel est le comble pour un électricien ? Ne pas être au courant.", en: "What's the worst thing that can happen to an electrician? Not being 'au courant' (in the know / connected to the current).", altEs: ["Le comble pour un électricien ? Ne pas être au courant."], grammar: [g.wordplay], vocab: [w.calembour, w.comble], note: "A calembour: courant = electric current and being informed." }
      - { es: "Le comble pour un jardinier, c'est de raconter des salades.", en: "The ultimate irony for a gardener is telling tall tales ('salads').", altEs: ["Le comble pour un jardinier ? Raconter des salades."], grammar: [g.wordplay], vocab: [], note: "raconter des salades = to tell lies." }
      - { es: "Le maire est allé à la mer avec sa mère.", en: "The mayor went to the seaside with his mother.", altEs: ["Le maire est parti à la mer avec sa mère."], grammar: [g.wordplay, g.passe-compose-etre], vocab: [w.homophone], note: "maire, mer, mère: three homophones." }
      - { es: "Un ver vert boit dans un verre vers le soir.", en: "A green worm drinks from a glass towards evening.", altEs: ["Vers le soir, un ver vert boit dans un verre."], grammar: [g.wordplay], vocab: [w.homophone] }
      - { es: "Le salon de coiffure s'appelle « L'Hair du temps » : un jeu de mots sur « l'air du temps ».", en: "The hairdresser's is called 'L'Hair du temps': a pun on 'l'air du temps' (the spirit of the times).", altEs: ["Le salon de coiffure s'appelle « L'Hair du temps », un jeu de mots sur « l'air du temps »."], grammar: [g.wordplay], vocab: [w.salon-de-coiffure, w.jeu-de-mots] }
      - { es: "Assurancetourix, dans Astérix, c'est « assurance tous risques ».", en: "Cacofonix's French name, Assurancetourix, is 'assurance tous risques' (comprehensive insurance).", altEs: ["Dans Astérix, Assurancetourix, ça veut dire « assurance tous risques »."], grammar: [g.wordplay], vocab: [] }
      - { es: "« Sonnez, trompettes ! » devient « Trompez, sonnettes ! » : c'est une contrepèterie.", en: "'Sound, trumpets!' becomes 'Deceive, doorbells!': it's a spoonerism.", altEs: ["« Sonnez, trompettes ! » qui devient « Trompez, sonnettes ! », c'est une contrepèterie."], grammar: [g.wordplay], vocab: [w.contrepèterie] }
      - { es: "Dans « un mur pâle », on échange deux sons et on obtient « un pur mâle ».", en: "In 'un mur pâle' (a pale wall), you swap two sounds and get 'un pur mâle' (a real man).", altEs: ["On échange deux sons dans « un mur pâle » et on obtient « un pur mâle »."], grammar: [g.wordplay], vocab: [w.contrepèterie] }
      - { es: "Ce titre a un double sens : il faut le lire deux fois.", en: "This headline has a double meaning: you have to read it twice.", altEs: ["Ce titre est à double sens : il faut le lire deux fois."], grammar: [g.wordplay, g.il-faut], vocab: [w.double-sens] }
      - { es: "Un calembour ne se traduit pas : il s'explique.", en: "A pun can't be translated: it has to be explained.", altEs: ["Un jeu de mots ne se traduit pas, il s'explique."], grammar: [g.wordplay, g.pronominal-passive], vocab: [w.calembour], error: { wrong: "Un calembour ne se traduit pas : il s'explique pas.", explain: "The second clause is positive: il s'explique. The ne…pas belongs only to the first clause.", grammar: g.wordplay } }
      - { es: "Cet humoriste joue avec les mots comme d'autres jonglent avec des balles.", en: "This comedian plays with words the way others juggle balls.", altEs: ["Cet humoriste jongle avec les mots comme d'autres avec des balles."], grammar: [g.wordplay], vocab: [w.humoriste] }
      - { es: "Le Canard enchaîné est un journal satirique célèbre pour ses titres humoristiques.", en: "Le Canard enchaîné is a satirical newspaper famous for its humorous headlines.", altEs: ["Le Canard enchaîné, journal satirique, est célèbre pour ses titres humoristiques."], grammar: [g.wordplay], vocab: [w.satirique, w.humoristique] }
      - { es: "La satire attaque les puissants ; la caricature exagère leurs traits ; la parodie imite leur style pour s'en moquer.", en: "Satire attacks the powerful; caricature exaggerates their features; parody imitates their style to mock it.", altEs: ["La satire attaque les puissants, la caricature exagère leurs traits et la parodie imite leur style pour s'en moquer."], grammar: [g.wordplay, g.pronoun-en], vocab: [w.satire, w.caricature, w.parodie, w.se-moquer] }
      - { es: "Un pastiche imite un auteur par admiration ; une parodie, par moquerie.", en: "A pastiche imitates an author out of admiration; a parody, out of mockery.", altEs: ["Le pastiche imite un auteur par admiration, la parodie par moquerie."], grammar: [g.wordplay], vocab: [w.pastiche, w.parodie, w.moquerie] }
      - { es: "« Quel temps magnifique ! », dit-il sous la pluie, avec ironie.", en: "'What magnificent weather!' he said in the rain, ironically.", altEs: ["« Quel temps magnifique ! », dit-il ironiquement sous la pluie."], grammar: [g.wordplay, g.formal-inversion], vocab: [w.ironie], transform: { instruction: "Use the adjective 'ironique' with 'sur un ton'", answer: "« Quel temps magnifique ! », dit-il sur un ton ironique sous la pluie.", alt: ["« Quel temps magnifique ! », dit-il sous la pluie, sur un ton ironique."], en: "'What magnificent weather!' he said ironically in the rain." } }
      - { es: "Ton ton ironique ne m'échappe pas, mais ton sarcasme me blesse.", en: "Your ironic tone doesn't escape me, but your sarcasm hurts me.", altEs: ["Ton ton ironique ne m'échappe pas, mais ton sarcasme me fait mal."], grammar: [g.wordplay], vocab: [w.ironique, w.sarcasme] }
      - { es: "Ne sois pas sarcastique, je t'ai demandé un vrai conseil.", en: "Don't be sarcastic, I asked you for real advice.", altEs: ["Ne sois pas sarcastique : je t'ai demandé un vrai conseil."], grammar: [g.wordplay, g.imperative], vocab: [w.sarcastique] }
      - { es: "Le premier avril, la radio a diffusé un canular, et la moitié du pays y a cru.", en: "On the first of April the radio broadcast a hoax, and half the country believed it.", altEs: ["Le 1er avril, la radio a diffusé un canular, et la moitié du pays y a cru."], grammar: [g.wordplay, g.pronoun-y], vocab: [w.canular] }
      - { es: "Mes potes me chambrent depuis que je suis tombé dans le fleuve ; à chaque vanne, je ris avec eux.", en: "My mates have been teasing me since I fell in the river; at every dig, I laugh with them.", altEs: ["Mes potes me chambrent depuis que je suis tombée dans le fleuve ; à chaque vanne, je ris avec eux."], grammar: [g.wordplay, g.depuis-present], vocab: [w.chambrer, w.vanne] }
      - { es: "Entre nous, il y a une vraie connivence : un regard, et nous sommes complices.", en: "Between us there's real complicity: one look, and we're in on it together.", altEs: ["Entre nous, il y a une vraie connivence : un regard suffit, et nous sommes complices."], grammar: [g.wordplay], vocab: [w.connivence, w.complice] }
    exchanges:
      - q: { es: "Tu connais le comble pour un professeur de géographie ?", en: "Do you know the worst thing for a geography teacher?" }
        a: { es: "Oui : perdre le nord ! Tu me la racontes chaque année.", en: "Yes: losing the north (losing their bearings)! You tell me it every year." }
        alt: ["Perdre le nord ?", "Non, vas-y, raconte."]
        grammar: [g.wordplay, g.double-object-pronouns]
        vocab: []
      - q: { es: "Pourquoi tout le monde rit ? Je ne comprends pas la blague.", en: "Why is everyone laughing? I don't get the joke." }
        a: { es: "C'est un jeu de mots sur deux homophones ; je te l'explique après.", en: "It's a pun on two homophones; I'll explain it to you afterwards." }
        alt: ["C'est un calembour, je t'explique.", "C'est un double sens, attends."]
        grammar: [g.wordplay, g.double-object-pronouns]
        vocab: [w.jeu-de-mots, w.homophone]
      - q: { es: "Il était sérieux, l'article sur la tour Eiffel à vendre ?", en: "Was the article about the Eiffel Tower being for sale serious?" }
        a: { es: "Mais non, c'était un canular du premier avril !", en: "Of course not, it was an April Fool's hoax!" }
        alt: ["Non, c'était une blague.", "C'était un canular."]
        grammar: [g.wordplay, g.c-etait]
        vocab: [w.canular]
      - q: { es: "Tu te vexes quand ils te chambrent ?", en: "Do you get offended when they tease you?" }
        a: { es: "Jamais : ils me taquinent entre complices, ce n'est pas de la moquerie.", en: "Never: they tease me as friends, it isn't mockery." }
        alt: ["Non, ce sont des vannes entre potes.", "Un peu, au début."]
        grammar: [g.wordplay]
        vocab: [w.chambrer, w.complice, w.moquerie, w.taquiner]
      - q: { es: "Ce film, c'est une parodie ou un pastiche ?", en: "Is that film a parody or a pastiche?" }
        a: { es: "Une parodie : il se moque des films d'espionnage, avec beaucoup d'ironie.", en: "A parody: it makes fun of spy films, with lots of irony." }
        alt: ["Plutôt une parodie.", "Un pastiche, il est très respectueux."]
        grammar: [g.wordplay]
        vocab: [w.parodie, w.pastiche, w.se-moquer, w.ironie]
    texts:
      - title: "Enseignes de Kinshasa et d'ailleurs"
        es: ["Un salon de coiffure s'appelle « L'Hair du temps ».", "Une boulangerie s'appelle « À la mie de mon cœur ».", "Chaque enseigne cache un jeu de mots, et chaque passant sourit avec connivence."]
        en: ["A hairdresser's is called 'L'Hair du temps'.", "A bakery is called 'À la mie de mon cœur' (mie, the soft part of bread, sounds like amie, friend).", "Every sign hides a pun, and every passer-by smiles knowingly."]
        grammar: [g.wordplay]
        vocab: [w.salon-de-coiffure, w.jeu-de-mots, w.connivence]
      - title: "Programme du festival"
        es: ["Vendredi : soirée des humoristes, vannes et satire politique.", "Samedi : concours de calembours et de contrepèteries.", "Attention : les contrepèteries les plus osées seront réservées aux adultes."]
        en: ["Friday: comedians' night, jokes and political satire.", "Saturday: pun and spoonerism contest.", "Note: the most daring spoonerisms will be for adults only."]
        grammar: [g.wordplay, g.passive-voice]
        vocab: [w.humoriste, w.vanne, w.satire, w.calembour, w.contrepèterie]
    spicy:
      - { es: "Quel est le comble pour un séducteur ? Rester sans voix devant toi.", en: "What's the ultimate irony for a charmer? Being left speechless in front of you.", altEs: ["Le comble pour un séducteur ? Rester sans voix devant toi."], grammar: [g.wordplay], vocab: [] }
      - { es: "Tu me chambres toute la soirée ; à ce niveau-là, ce n'est plus de la taquinerie, c'est de la drague.", en: "You've been teasing me all evening; at this point it's not teasing any more, it's flirting.", altEs: ["Tu me chambres depuis le début de la soirée ; à ce niveau, ce n'est plus de la taquinerie, c'est de la drague."], grammar: [g.wordplay, g.negation-jamais-plus-rien], vocab: [w.chambrer] }
      - { es: "Ma déclaration a un double sens : relis-la lentement, à voix basse, et regarde-moi.", en: "My declaration has a double meaning: read it again slowly, in a low voice, and look at me.", altEs: ["Ma déclaration est à double sens : relis-la lentement, à voix basse, et regarde-moi."], grammar: [g.wordplay, g.imperative-with-pronouns], vocab: [w.double-sens] }
      - { es: "Entre nous, il y a de la connivence : tu lances une vanne, je la rattrape, et tout le monde se demande depuis quand on est complices.", en: "There's a connection between us: you throw out a joke, I catch it, and everyone wonders how long we've been in cahoots.", altEs: ["Entre nous, c'est de la connivence : tu lances une vanne, je la rattrape, et tout le monde se demande depuis quand nous sommes complices."], grammar: [g.wordplay, g.indirect-questions], vocab: [w.connivence, w.vanne, w.complice] }
      - { es: "Ce n'est pas un canular : je t'invite vraiment à souper, et j'ai même réservé.", en: "It's not a hoax: I really am inviting you to dinner, and I've even booked.", altEs: ["Ce n'est pas un canular, je t'invite vraiment à souper, et j'ai même réservé."], grammar: [g.wordplay], vocab: [w.canular] }
dialogues:
  - id: c2.u04.d1
    title: Sur le bac, entre deux rives
    context: "Joël, a young Kinois, crosses the Congo River to Brazzaville with Inès, a French journalist preparing a report on the Sape."
    lines:
      - { speaker: Inès, es: "C'est fou, on voit Brazzaville comme si c'était un autre quartier de Kinshasa.", en: "It's crazy, you can see Brazzaville as if it were another district of Kinshasa." }
      - { speaker: Joël, es: "C'est ouf, hein ? Deux capitales face à face, et le fleuve Congo au milieu.", en: "Amazing, isn't it? Two capitals face to face, with the Congo River in between." }
      - { speaker: Inès, es: "« Ouf », c'est du verlan, ça ? On le dit aussi à Kinshasa ?", en: "'Ouf', that's verlan, isn't it? Do people say it in Kinshasa too?" }
      - { speaker: Joël, es: "Les jeunes, oui, avec les séries et les réseaux. Mais ici, on a nos mots : on dit qu'un bon musicien sait « ambiancer ».", en: "Young people do, with TV series and social media. But here we have our own words: we say a good musician knows how to 'ambiancer'." }
      - { speaker: Inès, es: "Et les sapeurs que je vais rencontrer, ils parlent comment ?", en: "And the sapeurs I'm going to meet, how do they talk?" }
      - { speaker: Joël, es: "Comme ils s'habillent : avec élégance et beaucoup de frime. Et attention, ils adorent les jeux de mots.", en: "The way they dress: with elegance and a lot of showing off. And watch out, they love puns." }
      - { speaker: Inès, es: "Par exemple ?", en: "For example?" }
      - { speaker: Joël, es: "La SAPE elle-même : la Société des ambianceurs et des personnes élégantes. Et « se saper », ça veut dire s'habiller.", en: "La SAPE itself: the Society of Ambiance-Makers and Elegant People. And 'se saper' means to get dressed." }
      - { speaker: Inès, es: "Un sigle qui est aussi un calembour, j'adore. Je vais le mettre dans le titre de mon reportage.", en: "An acronym that's also a pun, I love it. I'm going to put it in the headline of my report." }
      - { speaker: Joël, es: "Ne divulgâche pas tout dans le titre, sinon personne ne lira la suite !", en: "Don't give everything away in the headline, or nobody will read the rest!" }
    questions:
      - { q: "Qu'est-ce qui sépare Kinshasa et Brazzaville ?", options: ["Une montagne", "Le fleuve Congo", "Une frontière linguistique"], answer: 1, explain: "« Deux capitales face à face, et le fleuve Congo au milieu »." }
      - { q: "D'où vient le mot « ouf » ?", options: ["Du lingala", "Du verlan de « fou »", "De l'anglais"], answer: 1, explain: "Inès recognises it as verlan: ouf = fou." }
      - { q: "Pourquoi « la SAPE » est-il un jeu de mots ?", options: ["C'est un sigle qui veut aussi dire « vêtements » en argot", "C'est le nom d'un musicien célèbre", "C'est un mot québécois"], answer: 0, explain: "Société des ambianceurs et des personnes élégantes, and la sape / se saper = clothes / to dress." }
      - { q: "Que conseille Joël à Inès à la fin ?", options: ["De ne pas tout révéler dans le titre", "D'écrire en lingala", "De s'habiller comme un sapeur"], answer: 0, explain: "« Ne divulgâche pas tout dans le titre »: divulgâcher = spoil, give away." }
writing:
  - task: "Write a short article about new French words created in France, Québec and Africa (divulgâcher, courriel, clavarder, infox, égoportrait…): where they come from and whether they catch on."
    min: 130
    max: 220
    use: [w.néologisme, w.divulgâcher, w.clavarder, w.infox, w.égoportrait]
    useAtLeast: 3
    grammar: [g.neologisms]
    expect:
      - { pattern: "\\b(divulg[aâ]ch|courriels?|clavard|infox|[eé]goportraits?|pourriels?|mots?-di[eè]ses?|t[eé]l[eé]travail|covoiturage|ub[eé]ris|n[eé]ologismes?|mots?-valises?)", hint: "Give examples of neologisms: divulgâcher, courriel, infox, égoportrait…" }
      - { pattern: "\\b(qu[eé]bec|acad[eé]mie|anglicismes?|anglais|cr[eé][eé]|invent|propos)", hint: "Say where they come from: créés au Québec, pour remplacer un anglicisme…" }
    model: { es: "Chaque année, des dizaines de néologismes entrent dans la langue française. Beaucoup sont nés au Québec, où l'on cherche depuis longtemps à remplacer les anglicismes par des mots français. C'est ainsi qu'est apparu « courriel », pour remplacer « mail », un mot aujourd'hui adopté dans toute la francophonie. Les Québécois ont aussi inventé « clavarder », un mot-valise formé de « clavier » et « bavarder », pour parler d'une discussion en ligne, ainsi que « divulgâcher », qui mélange le verbe « gâcher » avec un mot qui signifie « dire un secret » : il désigne le fait de raconter la fin d'un film. En France, les commissions officielles ont proposé « infox » pour parler des fausses informations, et « égoportrait » pour remplacer « selfie ». Tous ces mots n'ont pas le même succès : « courriel » s'est imposé, mais presque personne ne dit « égoportrait ». En Afrique, enfin, les inventions sont nombreuses, comme le verbe « ambiancer ». Une langue vivante, c'est une langue qui invente.", en: "Every year dozens of neologisms enter the French language. Many were born in Québec, where people have long tried to replace anglicisms with French words. That is how 'courriel' appeared, to replace 'mail', a word now adopted throughout the French-speaking world. Quebecers also invented 'clavarder', a portmanteau of 'clavier' (keyboard) and 'bavarder' (chat), to refer to an online conversation, as well as 'divulgâcher', which blends the verb 'gâcher' (spoil) with a word meaning 'to reveal a secret': it means telling the end of a film. In France, official committees proposed 'infox' to refer to fake news, and 'égoportrait' to replace 'selfie'. Not all these words are equally successful: 'courriel' has caught on, but almost nobody says 'égoportrait'. In Africa, finally, inventions abound, such as the verb 'ambiancer'. A living language is a language that invents." }
  - task: "A French teenager sent your friend this message. Rewrite it in standard French and explain the slang and verlan words."
    es: "La teuf d'hier, c'était ouf ! Y'avait des keufs partout, c'était trop chelou. Ma meuf était vénère parce que j'ai pas de thune…"
    min: 130
    max: 220
    use: [w.verlan, w.teuf, w.keuf, w.chelou, w.thune]
    useAtLeast: 3
    grammar: [g.verlan-slang]
    expect:
      - { pattern: "\\b(verlan|argot|argotique|familier|signifie|veut dire|c['’]est-[aà]-dire|autrement dit|[aà] l['’]envers)", hint: "Explain the words: en verlan, …, cela signifie…" }
      - { pattern: "\\b(f[eê]tes?|policiers?|bizarre|argent|folle?|fou|femme|copine|[eé]nerv[eé]e?)\\b", hint: "Give the standard words: fête, policiers, bizarre, argent…" }
    model: { es: "En français standard, ce message deviendrait : « La fête d'hier soir était incroyable ! Il y avait des policiers partout, c'était très bizarre. Ma copine était énervée parce que je n'ai pas d'argent. » La plupart de ces mots viennent du verlan, une forme d'argot qui met les syllabes d'un mot à l'envers. Ainsi, « teuf » est le verlan de « fête », « ouf » celui de « fou », « keuf » celui de « flic », c'est-à-dire « policier », et « meuf » celui de « femme ». « Chelou » vient de « louche », qui signifie « bizarre », tandis que « vénère » veut dire « énervé ». Quant à « thune », c'est un mot d'argot ancien pour désigner l'argent. Ce langage permet aux jeunes de se distinguer de leurs parents et de se sentir complices. Il faut toutefois l'utiliser avec prudence : dans la bouche d'un étranger, il peut sembler peu naturel, et il serait évidemment déplacé dans une situation formelle.", en: "In standard French this message would become: 'Last night's party was incredible! There were police officers everywhere, it was really weird. My girlfriend was annoyed because I have no money.' Most of these words come from verlan, a form of slang that turns the syllables of a word back to front. Thus 'teuf' is the verlan of 'fête' (party), 'ouf' that of 'fou' (crazy), 'keuf' that of 'flic', i.e. 'policier' (police officer), and 'meuf' that of 'femme' (woman). 'Chelou' comes from 'louche', meaning 'weird', while 'vénère' corresponds to 'énervé' (annoyed). As for 'thune', it's an old slang word for money. This language lets young people set themselves apart from their parents and feel close to each other. It should, however, be used with care: from a foreigner's mouth it can sound unnatural, and it would obviously be out of place in a formal situation." }
  - task: "Describe the Sape of Kinshasa and Brazzaville and the culture of la débrouille: what the sapeurs do, and what this elegance means to them."
    min: 130
    max: 220
    use: [w.sapeur, w.sape, w.dandy, w.griffe, w.débrouille]
    useAtLeast: 3
    grammar: [g.neologisms, g.verlan-slang]
    expect:
      - { pattern: "\\b(sape|sapes|sapeurs?|[eé]l[eé]gan|griffes?|dandys?|frime|d[eé]brouill|ambianc)", hint: "Describe the Sape: les sapeurs, l'élégance, les griffes, la débrouille…" }
    model: { es: "De part et d'autre du fleuve Congo, à Kinshasa comme à Brazzaville, les sapeurs font partie du paysage. Membres de la Société des ambianceurs et des personnes élégantes, la Sape, ces dandys se promènent le dimanche dans des costumes de toutes les couleurs, chaussures neuves aux pieds et chapeau sur la tête. Ils portent fièrement les griffes des grands couturiers parisiens ou italiens, qu'ils montrent volontiers aux passants. Pour un sapeur, l'élégance n'est pas de la frime : c'est un art de vivre, une manière d'affirmer sa dignité malgré la pauvreté. Beaucoup gagnent pourtant peu d'argent et doivent faire preuve d'une incroyable débrouille pour s'offrir une veste de marque. Certains économisent pendant des mois ; d'autres empruntent les vêtements de leurs amis. Les critiques y voient une manière bête de gaspiller l'argent ; les sapeurs, eux, répondent que la beauté est un droit. Leur style a d'ailleurs inspiré photographes et couturiers du monde entier.", en: "On both sides of the Congo River, in Kinshasa as in Brazzaville, the sapeurs are part of the landscape. Members of the Society of Ambiance-Makers and Elegant People, the Sape, these dandies stroll on Sundays in suits of every colour, with new shoes on their feet and hats on their heads. They proudly wear the labels of the great Parisian or Italian designers, which they happily show to passers-by. For a sapeur, elegance is not showing off: it's an art of living, a way of asserting one's dignity in spite of poverty. Yet many earn little money and have to show incredible resourcefulness to afford a designer jacket. Some save for months; others borrow their friends' clothes. Critics see it as a silly way of wasting money; the sapeurs reply that beauty is a right. Their style has in fact inspired photographers and fashion designers all over the world." }
  - task: "Write about French humour and wordplay: give at least two examples of puns, combles or contrepèteries, and explain why they are funny."
    min: 130
    max: 220
    use: [w.calembour, w.jeu-de-mots, w.comble, w.homophone, w.double-sens]
    useAtLeast: 3
    grammar: [g.wordplay]
    expect:
      - { pattern: "\\b(calembours?|jeux? de mots|double sens|homophones?|combles?|contrep[eè]teries?)\\b", hint: "Name the type of wordplay: calembour, jeu de mots, comble, homophone…" }
      - { pattern: "\\b(parce qu|car\\b|puisqu|en effet|signifie|veut dire|repose sur|joue sur)", hint: "Explain why it's funny: le jeu de mots repose sur…, parce que…" }
    model: { es: "Les Français adorent les jeux de mots, et leur langue, riche en homophones, s'y prête particulièrement bien. Prenons d'abord le comble, une petite question très populaire : « Quel est le comble pour un électricien ? Ne pas être au courant. » L'humour repose sur le double sens du mot « courant » : le courant électrique et le fait d'être informé. De même : « Quel est le comble pour un vendeur de légumes ? Raconter des salades. » Ici, le jeu de mots joue sur une expression qui signifie « dire des mensonges ». Plus difficile, la contrepèterie échange les premières lettres de deux mots pour créer une seconde phrase, souvent un peu osée, que l'auditeur doit deviner lui-même. Ce genre d'humour suppose une connivence : pour rire, il faut connaître la langue en profondeur. C'est pourquoi comprendre un calembour est souvent, pour un étranger, la preuve qu'il maîtrise vraiment le français.", en: "The French love wordplay, and their language, rich in homophones, lends itself particularly well to it. Take first the 'comble', a very popular little riddle: 'What's the worst thing for an electrician? Not being au courant (not having current / not being informed).' The humour relies on the double meaning of the word 'courant': electric current and being informed. Likewise: 'What's the worst thing for a greengrocer? Telling salads (lies).' Here the wordplay rests on an expression that means 'telling lies'. More difficult, the contrepèterie swaps the first letters of two words to create a second sentence, often a little risqué, which the listener has to guess. This kind of humour presupposes complicity: to laugh, you have to know the language in depth. That's why understanding a pun is often, for a foreigner, proof that they truly master French." }
