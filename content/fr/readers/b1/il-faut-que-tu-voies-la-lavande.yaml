id: r.b1.il-faut-que-tu-voies-la-lavande
level: b1
title: Il faut que tu voies la lavande
kind: text
intro: A magazine article about the lavender fields of Gordes and the abbey of Sénanque, and about the tourists who come to photograph them. Look for the subjunctive after expressions of feeling and necessity.
allow: [gilles, instagram, lavandin, ok]
paragraphs:
  - { es: "Chaque été, c'est la même chose. Entre la fin du mois de juin et la mi-juillet, des milliers de visiteurs arrivent sur la petite route qui descend de Gordes vers l'abbaye de Sénanque. Ils veulent tous la même photo : la vieille abbaye de pierre grise, devant un champ de lavande d'un violet intense. « Il faut que tu voies ça au moins une fois dans ta vie », disent les guides de voyage. Ils n'ont pas tort : c'est un des paysages les plus célèbres de Provence.", en: "Every summer it's the same thing. Between the end of June and mid-July, thousands of visitors arrive on the little road that goes down from Gordes to the abbey of Sénanque. They all want the same photo: the old grey stone abbey in front of a field of intensely purple lavender. 'You have to see this at least once in your life,' say the travel guides. They're not wrong: it's one of the most famous landscapes in Provence." }
  - { es: "L'abbaye a été fondée en 1148 par des moines cisterciens, qui cherchaient un lieu calme et isolé pour prier. Aujourd'hui encore, une petite communauté de moines y vit. Ils prient plusieurs fois par jour, ils travaillent et ils cultivent la lavande. « Nous sommes heureux que les gens viennent ici, explique l'un d'eux. Mais nous aimerions qu'ils respectent le silence. Ce n'est pas un parc d'attractions, c'est un lieu de prière. »", en: "The abbey was founded in 1148 by Cistercian monks, who were looking for a calm, isolated place to pray. Even today a small community of monks lives there. They pray several times a day, they work and they grow lavender. 'We are happy that people come here,' explains one of them. 'But we would like them to respect the silence. It isn't a theme park, it's a place of prayer.'" }
  - { es: "Le problème, c'est que beaucoup de touristes entrent dans les champs pour faire la photo parfaite. Ils marchent entre les plantes, s'assoient dessus, cueillent des fleurs. Gilles, un agriculteur qui cultive la lavande près de Gordes depuis trente ans, est furieux : « Je suis triste que les gens ne comprennent pas que c'est notre travail. Une plante de lavande vit dix ans. Si on la casse, elle est perdue. Je ne veux pas que les touristes partent, mais il faut qu'ils restent au bord du champ ! » Certains agriculteurs ont installé des panneaux, d'autres demandent quelques euros aux visiteurs qui veulent entrer.", en: "The problem is that many tourists go into the fields to take the perfect photo. They walk between the plants, sit on them, pick flowers. Gilles, a farmer who has been growing lavender near Gordes for thirty years, is furious: 'It makes me sad that people don't understand this is our work. A lavender plant lives for ten years. If you break it, it's lost. I don't want the tourists to leave, but they need to stay at the edge of the field!' Some farmers have put up signs; others ask visitors who want to go in for a few euros." }
  - { es: "Il y a aussi des inquiétudes plus graves. Avec le réchauffement climatique, les étés sont plus secs et plus chauds, et la sécheresse fatigue les plantes. Une maladie touche aussi beaucoup de champs. « J'ai peur que, dans vingt ans, il y ait beaucoup moins de lavande en Provence, regrette Gilles. Il est essentiel qu'on protège ce paysage. »", en: "There are also more serious worries. With global warming, summers are drier and hotter, and drought weakens the plants. A disease is also affecting many fields. 'I'm afraid that in twenty years there will be much less lavender in Provence,' Gilles says sadly. 'It's essential that we protect this landscape.'" }
  - { es: "La lavande n'est pas seulement belle. On l'utilise pour fabriquer du savon, des parfums et de l'huile essentielle, et les abeilles en font un miel délicieux. En juillet et en août, après la récolte, les fleurs sont distillées dans de grands alambics. Il faut savoir aussi que la plupart des champs que voient les touristes ne sont pas de la vraie lavande, mais du lavandin, une plante plus grande qui pousse plus bas. La vraie lavande, elle, préfère la montagne.", en: "Lavender isn't just beautiful. It's used to make soap, perfume and essential oil, and bees make a delicious honey from it. In July and August, after the harvest, the flowers are distilled in large stills. You should also know that most of the fields tourists see aren't true lavender but lavandin, a bigger plant that grows lower down. True lavender prefers the mountains." }
  - { es: "Alors, faut-il encore aller à Sénanque ? Oui, bien sûr. Mais il vaut mieux que vous y alliez tôt le matin, quand la lumière est douce et qu'il y a moins de monde. Restez sur les chemins, parlez doucement près de l'abbaye, et achetez votre miel et votre savon aux producteurs du village. Comme ça, tout le monde sera content : vous, les moines, les agriculteurs… et les abeilles.", en: "So should you still go to Sénanque? Yes, of course. But it's better to go early in the morning, when the light is soft and there are fewer people. Stay on the paths, speak quietly near the abbey, and buy your honey and soap from the producers in the village. That way everyone will be happy: you, the monks, the farmers… and the bees." }
questions:
  - { q: "Quand la lavande est-elle en fleur à Sénanque ?", options: ["En avril", "Entre la fin juin et la mi-juillet", "En septembre"], answer: 1, explain: "«Entre la fin du mois de juin et la mi-juillet.»" }
  - { q: "Qu'est-ce que les moines aimeraient ?", options: ["Que les touristes ne viennent plus", "Que les visiteurs respectent le silence", "Que l'abbaye devienne un musée"], answer: 1, explain: "«Nous aimerions qu'ils respectent le silence. Ce n'est pas un parc d'attractions.»" }
  - { q: "Pourquoi Gilles est-il furieux ?", options: ["Les touristes marchent dans ses champs et cassent les plantes", "Les touristes ne viennent pas", "Il n'a pas assez d'abeilles"], answer: 0, explain: "Tourists walk among the plants and sit on them; «si on la casse, elle est perdue»." }
  - { q: "Quelles menaces pèsent sur la lavande ?", options: ["Le froid et la neige", "La sécheresse et une maladie", "Les abeilles"], answer: 1, explain: "Hotter, drier summers cause drought, and «une maladie touche aussi beaucoup de champs»." }
  - { q: "Qu'est-ce que le lavandin ?", options: ["Une plante plus grande qui pousse plus bas", "Un parfum", "Le miel de lavande"], answer: 0, explain: "Most fields are lavandin, «une plante plus grande qui pousse plus bas»; true lavender prefers the mountains." }
