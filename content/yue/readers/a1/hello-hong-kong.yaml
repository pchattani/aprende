id: r.a1.hello-hong-kong
level: a1
title: 你好，香港！
kind: text
intro: Mandy, an English teacher from Wan Chai, meets her Spanish friend Ana at the airport and shows her around on her first day in Hong Kong.
allow: []
paragraphs:
  - { es: "你哋好！我叫Mandy，姓陳，係香港人。我今年二十五歲，係英文老師。我喺灣仔住，同爸爸、媽媽同細佬一齊住。我哋屋企喺一座好高嘅大廈，喺二十八樓。", en: "Hello, everyone! My name is Mandy, my surname is Chan, and I'm a Hongkonger. I'm twenty-five this year and I'm an English teacher. I live in Wan Chai, with my dad, my mum and my younger brother. Our home is in a very tall building, on the twenty-eighth floor." }
  - { es: "今日係星期六，我唔使返工。而家我喺機場，等我個好朋友Ana。Ana係西班牙人，今年二十六歲。佢係學生，嚟香港讀書，學廣東話。佢識講西班牙話同英文，仲識講少少廣東話！", en: "Today is Saturday, so I don't have to go to work. Right now I'm at the airport, waiting for my good friend Ana. Ana is Spanish and she's twenty-six this year. She's a student, coming to Hong Kong to study Cantonese. She speaks Spanish and English, and a little Cantonese too!" }
  - { es: "Ana落機喇！佢好開心，話：「哈囉，Mandy！好耐冇見！」我話：「歡迎你嚟香港！」機場好大，有好多人，好多飛機。Ana話：「香港好靚呀！」", en: "Ana is off the plane! She's very happy and says: \"Hi, Mandy! Long time no see!\" I say: \"Welcome to Hong Kong!\" The airport is very big, with lots of people and lots of planes. Ana says: \"Hong Kong is so beautiful!\"" }
  - { es: "我哋坐車去中環，跟住坐叮叮返灣仔。叮叮好平，好慢，但係好得意。Ana好鍾意坐叮叮，佢喺車上面一直影相。", en: "We take a bus to Central, then take the ding ding tram back to Wan Chai. The tram is cheap and slow, but lots of fun. Ana loves riding the tram, and she keeps taking photos the whole ride." }
  - { es: "我屋企唔係好大，有兩間房。Ana同我一齊住我間房。我有一隻貓，叫Coco。Coco好細，好可愛，佢好鍾意Ana！Ana冇香港手機，我畀我嘅電話號碼佢：九八七六 五四三二。", en: "My home isn't very big; it has two bedrooms. Ana shares my room with me. I have a cat called Coco. Coco is very small and very cute, and he loves Ana! Ana doesn't have a Hong Kong phone, so I give her my phone number: 9876 5432." }
  - { es: "夜晚，我哋去灣仔一間茶餐廳食飯。Ana問：「呢個係乜嘢呀？」我話：「呢個係菠蘿包，好好食㗎！」Ana食一個，話：「真係好好食！唔該晒，Mandy！」", en: "In the evening we go to a cha chaan teng café in Wan Chai to eat. Ana asks: \"What's this?\" I say: \"It's a pineapple bun. It's delicious!\" Ana eats one and says: \"It really is delicious! Thanks so much, Mandy!\"" }
questions:
  - { q: "Mandy做咩工作？", options: ["學生", "英文老師", "司機"], answer: 1, explain: "Mandy says 我…係英文老師. Ana is the student." }
  - { q: "Ana係邊度人？", options: ["香港人", "英國人", "西班牙人"], answer: 2, explain: "Ana係西班牙人: Ana is Spanish." }
  - { q: "Mandy屋企喺幾多樓？", options: ["二十五樓", "二十八樓", "二十六樓"], answer: 1, explain: "喺二十八樓: on the 28th floor. Twenty-five is Mandy's age and twenty-six is Ana's." }
  - { q: "Coco係乜嘢？", options: ["Mandy嘅細佬", "Mandy隻貓", "Ana嘅朋友"], answer: 1, explain: "我有一隻貓，叫Coco: Coco is Mandy's cat." }
  - { q: "夜晚佢哋喺邊度食飯？", options: ["酒樓", "茶餐廳", "屋企"], answer: 1, explain: "我哋去灣仔一間茶餐廳食飯." }
glossary:
  - { es: 西班牙話, en: Spanish (the language) }
