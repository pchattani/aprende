id: r.a1.o-dia-a-dia-do-thiago
level: a1
title: O dia a dia do Thiago
kind: text
intro: Thiago is a lifeguard on Copacabana beach. He describes a normal day, from sunrise on the beach to the evening.
allow: [thiago, copacabana, ipanema, carol, posto]
paragraphs:
  - { es: "Meu nome é Thiago e eu sou salva-vidas na praia de Copacabana. Moro num apartamento pequeno perto do Posto 5, com dois amigos. Meu trabalho começa cedo, mas eu adoro: o meu escritório é a praia!", en: "My name is Thiago and I'm a lifeguard on Copacabana beach. I live in a small flat near Posto 5, with two friends. My work starts early, but I love it: my office is the beach!" }
  - { es: "Eu acordo todo dia às cinco e meia. Eu me levanto, tomo banho e me visto rápido. No café da manhã, eu como pão com ovo e uma banana e tomo um café bem forte. Às seis e meia, eu saio de casa e vou a pé para a praia.", en: "I wake up every day at half past five. I get up, have a shower and get dressed quickly. For breakfast, I eat bread with egg and a banana and have a really strong coffee. At half past six, I leave home and walk to the beach." }
  - { es: "Às sete horas, a praia já tem muitas pessoas. Elas correm, andam de bicicleta ou jogam vôlei na areia. Eu fico na cadeira alta e olho o mar. Quando as ondas estão grandes, eu nado e ajudo as pessoas. Eu nunca leio no trabalho e nunca uso o celular!", en: "At seven o'clock, the beach already has lots of people. They run, ride bikes or play volleyball on the sand. I stay on the high chair and watch the sea. When the waves are big, I swim and help people. I never read at work and never use my phone!" }
  - { es: "Ao meio-dia, eu almoço num restaurante pequeno atrás do calçadão. Geralmente eu como arroz, feijão, salada e frango. Depois, eu volto para a praia. À tarde, o sol é muito quente e as pessoas precisam de protetor solar e água. Eu sempre bebo muita água de coco.", en: "At noon, I have lunch in a small restaurant behind the promenade. I usually eat rice, beans, salad and chicken. Then I go back to the beach. In the afternoon, the sun is very hot and people need sunscreen and water. I always drink lots of coconut water." }
  - { es: "Meu trabalho termina às cinco horas. Às vezes, eu vou a Ipanema com a minha namorada, a Carol, para ver o pôr do sol. As pessoas batem palmas para o sol. É lindo! Outras vezes, eu vou à academia ou fico em casa e assisto a um filme.", en: "My work finishes at five o'clock. Sometimes I go to Ipanema with my girlfriend, Carol, to see the sunset. People clap for the sun. It's beautiful! Other times, I go to the gym or stay home and watch a film." }
  - { es: "À noite, eu janto com meus amigos e nós conversamos sobre o dia. Eu me deito cedo, às dez horas, porque amanhã eu acordo às cinco e meia de novo. No sábado e no domingo eu não trabalho: eu durmo até as nove!", en: "In the evening, I have dinner with my friends and we talk about the day. I go to bed early, at ten, because tomorrow I wake up at half past five again. On Saturday and Sunday I don't work: I sleep until nine!" }
questions:
  - { q: "Qual é o trabalho do Thiago?", options: ["Professor de vôlei", "Salva-vidas", "Garçom num restaurante"], answer: 1, explain: "«Eu sou salva-vidas na praia de Copacabana.»" }
  - { q: "A que horas o Thiago acorda?", options: ["Às cinco e meia", "Às seis e meia", "Às sete horas"], answer: 0, explain: "«Eu acordo todo dia às cinco e meia.» At half past six he leaves home." }
  - { q: "Como o Thiago vai para a praia?", options: ["De ônibus", "De bicicleta", "A pé"], answer: 2, explain: "«Eu saio de casa e vou a pé para a praia.»" }
  - { q: "O que as pessoas fazem em Ipanema no fim da tarde?", options: ["Batem palmas para o pôr do sol", "Jogam futebol", "Jantam no calçadão"], answer: 0, explain: "«As pessoas batem palmas para o sol.» Clapping for the sunset is an Ipanema tradition." }
  - { q: "Por que o Thiago se deita cedo?", options: ["Porque está doente", "Porque acorda muito cedo", "Porque não gosta de sair"], answer: 1, explain: "He goes to bed at ten «porque amanhã eu acordo às cinco e meia de novo»." }
glossary:
  - { es: salva-vidas, en: lifeguard }
  - { es: calçadão, en: seafront promenade }
  - { es: olho, en: I watch, I look at (olhar) }
  - { es: conversamos, en: we chat (conversar) }
  - { es: de novo, en: again }
  - { es: forte, en: strong }
  - { es: batem, en: they clap (bater palmas = to clap) }
