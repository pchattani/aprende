      - { es: "Elles sont avec eux.", en: "They're with them.", altEs: ["Elles, elles sont avec eux."], grammar: [g.stressed-pronouns], vocab: [w.eux, w.elles], transform: { instruction: "Replace eux with 'me'", answer: "Elles sont avec moi.", en: "They're with me." } }
      - { es: "Qui est là ? — Nous !", en: "Who's there? — Us!", altEs: ["Qui est là ? — C'est nous !"], altEn: ["Who's there? — It's us!"], grammar: [g.stressed-pronouns], vocab: [w.qui, w.là] }
    exchanges:
