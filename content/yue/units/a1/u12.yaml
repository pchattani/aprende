id: a1.u12
title: 今日天氣點呀？
lessons:
  - id: a1.u12.l1
    title: 今日天氣點呀？
    teach: [g.weather]
    vocab: [w.tin1-hei3, w.tin1, w.lok6-jyu5, w.jyu5, w.ceot1-taai3-joeng4, w.taai3-joeng4, w.fung1, w.daai6-fung1, w.daa2-fung1, w.toi4-fung1, w.wan4, w.gau6.b, w.haang4-leoi4, w.tin1-man4-toi4, w.dou6.b, w.ceon1-tin1, w.haa6-tin1, w.cau1-tin1, w.dung1-tin1, w.gwai3-zit3, w.mou6, w.baat3-hou6-fung1-kau4, w.hak1-jyu5, w.daai3, w.gei3-dak1, w.m4-gei3-dak1, w.wui5]
    tip: "Weather needs no \"it\": 落雨 \"it's raining\", 今日好熱 \"it's hot today\". Use 會 for the forecast: 聽日會落雨."
    sentences:
      - { es: "今日天氣點呀？", en: "What's the weather like today?", altEs: ["今日天氣點樣呀？", "今日天氣點？"], grammar: [g.weather, g.question-words], vocab: [w.tin1-hei3] }
      - { es: "今日好熱，三十三度。", en: "It's hot today, thirty-three degrees.", altEs: ["今日好熱，有三十三度。"], grammar: [g.weather, g.adjective-predicates], vocab: [w.dou6.b], transform: { instruction: "Say it's cold today, twelve degrees", answer: "今日好凍，十二度。", alt: ["今日好凍，得十二度。"], en: "It's cold today, twelve degrees." }, error: { wrong: "今日係熱，三十三度。", explain: "Weather adjectives need no 係: 今日好熱.", grammar: g.weather } }
      - { es: "出面落緊雨，記得帶遮。", en: "It's raining outside, remember your umbrella.", altEs: ["出面落緊雨，記住帶遮。", "出面落雨，記得帶遮。"], grammar: [g.weather], vocab: [w.lok6-jyu5, w.gei3-dak1, w.daai3] }
      - { es: "天文台話聽日會打風。", en: "The Observatory says there'll be a typhoon tomorrow.", altEs: ["天文台話聽日打風。"], grammar: [g.weather], vocab: [w.tin1-man4-toi4, w.daa2-fung1, w.wui5] }
      - { es: "聽日會落雨。", en: "It'll rain tomorrow.", altEs: ["聽日落雨。"], grammar: [g.weather], vocab: [w.lok6-jyu5, w.wui5], transform: { instruction: "Say it'll be sunny tomorrow", answer: "聽日會出太陽。", en: "It'll be sunny tomorrow." } }
      - { es: "今日出太陽，我哋去海灘啦。", en: "It's sunny today, let's go to the beach.", altEs: ["今日出太陽，去海灘啦。"], grammar: [g.weather, g.particles-aa-laa], vocab: [w.ceot1-taai3-joeng4] }
      - { es: "香港夏天好熱，又好潮濕。", en: "Hong Kong summers are hot and humid.", altEs: ["香港嘅夏天好熱又好潮濕。"], grammar: [g.weather], vocab: [w.haa6-tin1] }
      - { es: "冬天唔係好凍。", en: "Winter isn't very cold.", altEs: ["冬天唔係幾凍。", "冬天唔凍。"], grammar: [g.weather, g.degree-adverbs], vocab: [w.dung1-tin1], error: { wrong: "冬天唔好凍。", explain: "唔好 means \"don't\"; \"not very cold\" is 唔係好凍.", grammar: g.adjective-predicates } }
      - { es: "八號風球嘅時候，唔使返工。", en: "When typhoon signal no. 8 is up, you don't have to go to work.", altEs: ["八號風球唔使返工。"], grammar: [g.weather, g.ge-si-hau], vocab: [w.baat3-hou6-fung1-kau4] }
      - { es: "黑雨嘅時候，唔好出街。", en: "Don't go out during a black rainstorm.", altEs: ["黑雨嘅時候唔好出街。"], grammar: [g.weather, g.ge-si-hau], vocab: [w.hak1-jyu5] }
      - { es: "今日好大風。", en: "It's very windy today.", altEs: ["今日好大風呀。"], grammar: [g.weather], vocab: [w.daai6-fung1, w.fung1] }
      - { es: "行雷喇，我哋入去啦。", en: "It's thundering, let's go inside.", altEs: ["行雷呀，我哋入去啦。"], grammar: [g.weather, g.particles-aa-laa], vocab: [w.haang4-leoi4] }
      - { es: "我唔記得帶遮。", en: "I forgot to bring my umbrella.", altEs: ["我唔記得帶把遮。"], grammar: [g.weather], vocab: [w.m4-gei3-dak1, w.daai3] }
      - { es: "你最鍾意邊個季節呀？", en: "Which season do you like best?", altEs: ["你最鍾意邊個季節？"], grammar: [g.zung-ji-like, g.question-words], vocab: [w.gwai3-zit3] }
      - { es: "我鍾意秋天，唔熱又唔凍。", en: "I like autumn: it's not hot and not cold.", altEs: ["我鍾意秋天，又唔熱又唔凍。"], grammar: [g.weather, g.zung-ji-like], vocab: [w.cau1-tin1], transform: { instruction: "Say it about spring", answer: "我鍾意春天，唔熱又唔凍。", alt: ["我鍾意春天，又唔熱又唔凍。"], en: "I like spring: it's not hot and not cold." } }
      - { es: "春天成日有霧，天上面有好多嚿雲。", en: "In spring it's often foggy, and there are lots of clouds in the sky.", altEs: ["春天成日有霧，天上有好多雲。"], grammar: [g.weather], vocab: [w.ceon1-tin1, w.mou6, w.tin1, w.wan4, w.gau6.b] }
    exchanges:
      - q: { es: "今日天氣點呀？", en: "What's the weather like today?" }
        a: { es: "好熱，出太陽。", en: "Hot and sunny." }
        alt: ["好熱。", "落緊雨。", "有啲凍。"]
        grammar: [g.weather]
        vocab: [w.tin1-hei3, w.ceot1-taai3-joeng4]
      - q: { es: "聽日會落雨嗎？", en: "Will it rain tomorrow?" }
        a: { es: "天文台話會。", en: "The Observatory says it will." }
        alt: ["唔會。", "會呀，記得帶遮。"]
        grammar: [g.weather, g.maa-questions]
        vocab: [w.lok6-jyu5, w.tin1-man4-toi4]
      - q: { es: "今日幾多度呀？", en: "What's the temperature today?" }
        a: { es: "三十度。", en: "Thirty degrees." }
        alt: ["大概三十度。", "好熱，三十四度。"]
        grammar: [g.weather, g.gei-how-many]
        vocab: [w.dou6.b]
      - q: { es: "你最鍾意邊個季節呀？", en: "Which season do you like best?" }
        a: { es: "我最鍾意秋天。", en: "I like autumn best." }
        alt: ["秋天。", "冬天。", "我鍾意春天。"]
        grammar: [g.zung-ji-like]
        vocab: [w.gwai3-zit3, w.cau1-tin1]
      - q: { es: "你有冇帶遮呀？", en: "Have you got an umbrella?" }
        a: { es: "唔記得帶呀！", en: "I forgot it!" }
        alt: ["有呀。", "冇呀。"]
        grammar: [g.jau-have]
        vocab: [w.m4-gei3-dak1, w.daai3]
    texts:
      - title: "天文台"
        es: ["今日香港好熱，三十四度。", "下晝會行雷同落雨。", "記得帶遮。"]
        en: ["It's hot in Hong Kong today, thirty-four degrees.", "This afternoon there'll be thunder and rain.", "Remember your umbrella."]
        grammar: [g.weather]
        vocab: [w.haang4-leoi4, w.lok6-jyu5, w.gei3-dak1]
      - title: "Luna 嘅夏天"
        es: ["香港夏天好熱。", "Luna日日都想喺屋企瞓覺，因為屋企有冷氣。", "佢最鍾意冬天！"]
        en: ["Summer in Hong Kong is very hot.", "Every day Luna wants to sleep at home, because home has air conditioning.", "Her favourite season is winter!"]
        grammar: [g.weather]
        vocab: [w.haa6-tin1, w.dung1-tin1]
    spicy:
      - { es: "出面落雨，喺我度飲杯茶先啦。", en: "It's raining outside; have a cup of tea at my place first.", altEs: ["出面落緊雨，喺我度飲杯茶先啦。"], grammar: [g.weather, g.particles-aa-laa], vocab: [w.lok6-jyu5] }
      - { es: "今日好熱……定係因為你喺度？", en: "It's so hot today... or is it because you're here?", altEs: ["今日好熱，定係因為你喺度？"], grammar: [g.weather], vocab: [w.tin1-hei3] }
      - { es: "我唔記得帶遮，我哋一齊用你把遮啦。", en: "I forgot my umbrella; let's share yours.", altEs: ["我唔記得帶遮，一齊用你把遮啦。"], grammar: [g.weather, g.particles-aa-laa], vocab: [w.m4-gei3-dak1] }
      - { es: "打風都要見你。", en: "Typhoon or not, I want to see you.", altEs: ["打風我都要見你。"], grammar: [g.weather], vocab: [w.daa2-fung1] }
      - { es: "天文台話今晚會行雷，你嚟我度啦。", en: "The Observatory says there'll be thunder tonight; come over to my place.", altEs: ["天文台話今晚行雷，你嚟我度啦。"], grammar: [g.weather], vocab: [w.tin1-man4-toi4, w.haang4-leoi4] }
  - id: a1.u12.l2
    title: 太熱喇！
    teach: [g.degree-adverbs]
    vocab: [w.taai3, w.fei1-soeng4, w.gam3, w.zan1-hai6, w.laa3, w.gaa3.b, w.aa1, w.nyun5, w.loeng4.b, w.sap1, w.gon1, w.ai3, w.guk6, w.ai3-guk6, w.ciu4-sap1, w.laang5-hei3, w.hung1-hei3, w.syu1-fuk6, w.san1-fu2]
    tip: "Degree words go before the adjective: 好熱, 幾好, 太貴, 非常出名. 太 usually comes with 喇: 太熱喇！"
    sentences:
      - { es: "今日太熱喇！", en: "It's too hot today!", altEs: ["今日真係太熱喇！"], grammar: [g.degree-adverbs], vocab: [w.taai3, w.laa3], transform: { instruction: "Say it's too cold", answer: "今日太凍喇！", en: "It's too cold today!" }, error: { wrong: "今日熱太喇！", explain: "Degree words go before the adjective: 太熱, never 熱太.", grammar: g.degree-adverbs } }
      - { es: "呢間餐廳幾好。", en: "This restaurant is quite good.", altEs: ["呢間餐廳都幾好。"], grammar: [g.degree-adverbs], vocab: [], note: "幾 before an adjective means \"quite\", not \"how\"." }
      - { es: "嗰間茶餐廳非常出名。", en: "That cha chaan teng is extremely famous.", altEs: ["嗰間茶餐廳好出名。"], grammar: [g.degree-adverbs], vocab: [w.fei1-soeng4] }
      - { es: "佢屋企唔係幾遠。", en: "Her place isn't very far.", altEs: ["佢屋企唔係好遠。"], altEn: ["His place isn't very far."], grammar: [g.degree-adverbs], vocab: [] }
      - { es: "呢杯咖啡太甜喇。", en: "This coffee is too sweet.", altEs: ["呢杯咖啡太甜。"], grammar: [g.degree-adverbs], vocab: [w.taai3], transform: { instruction: "Say it's not very sweet", answer: "呢杯咖啡唔係好甜。", alt: ["呢杯咖啡唔係幾甜。"], en: "This coffee isn't very sweet." } }
      - { es: "佢嘅廣東話幾好。", en: "Her Cantonese is quite good.", altEs: ["佢嘅廣東話都幾好。"], altEn: ["His Cantonese is quite good."], grammar: [g.degree-adverbs, g.ge-possessive], vocab: [], transform: { instruction: "Say it's extremely good", answer: "佢嘅廣東話非常好。", en: "Her Cantonese is excellent." } }
      - { es: "今日真係好翳焗。", en: "It's really muggy today.", altEs: ["今日好翳焗呀。", "今日真係好焗。"], grammar: [g.degree-adverbs, g.weather], vocab: [w.zan1-hai6, w.ai3-guk6, w.ai3, w.guk6] }
      - { es: "好靚呀！", en: "It's so beautiful!", altEs: ["好靚啊！", "真係好靚！"], grammar: [g.degree-adverbs], vocab: [] }
      - { es: "春天好暖，秋天好涼。", en: "Spring is warm and autumn is cool.", altEs: ["春天幾暖，秋天幾涼。"], grammar: [g.degree-adverbs, g.weather], vocab: [w.nyun5, w.loeng4.b] }
      - { es: "香港夏天非常潮濕。", en: "Hong Kong summers are extremely humid.", altEs: ["香港嘅夏天非常潮濕。"], grammar: [g.degree-adverbs, g.weather], vocab: [w.fei1-soeng4, w.ciu4-sap1] }
      - { es: "冬天啲空氣好乾。", en: "In winter the air is very dry.", altEs: ["冬天空氣好乾。"], grammar: [g.degree-adverbs, g.weather], vocab: [w.hung1-hei3, w.gon1], error: { wrong: "冬天啲空氣乾好。", explain: "好 goes before the adjective: 好乾.", grammar: g.degree-adverbs } }
      - { es: "開冷氣啦，太焗喇！", en: "Turn on the air-con, it's too stuffy!", altEs: ["開冷氣吖，太焗喇！"], grammar: [g.degree-adverbs, g.particles-aa-laa], vocab: [w.laang5-hei3, w.guk6] }
      - { es: "我啲衫仲係濕㗎。", en: "My clothes are still wet.", altEs: ["我啲衫仲濕㗎。"], grammar: [g.degree-adverbs], vocab: [w.sap1, w.gaa3.b] }
      - { es: "呢張床好舒服。", en: "This bed is really comfortable.", altEs: ["呢張床非常舒服。"], grammar: [g.degree-adverbs], vocab: [w.syu1-fuk6] }
      - { es: "天氣咁熱，返工好辛苦。", en: "When it's this hot, going to work is tough.", altEs: ["天氣咁熱，返工真係好辛苦。"], grammar: [g.degree-adverbs, g.weather], vocab: [w.gam3, w.san1-fu2] }
      - { es: "嚟，飲杯凍水吖。", en: "Here, have a glass of cold water.", altEs: ["飲杯凍水吖。"], grammar: [g.particles-aa-laa], vocab: [w.aa1] }
    exchanges:
      - q: { es: "今日熱唔熱呀？", en: "Is it hot today?" }
        a: { es: "好熱呀，三十五度！", en: "Very hot, thirty-five degrees!" }
        alt: ["唔係好熱。", "幾熱。", "太熱喇！"]
        grammar: [g.degree-adverbs, g.a-not-a-questions]
        vocab: [w.taai3]
      - q: { es: "你嘅廣東話好好呀！", en: "Your Cantonese is really good!" }
        a: { es: "唔係啦，麻麻哋。", en: "Not really, it's so-so." }
        alt: ["多謝！", "都幾好啦。"]
        grammar: [g.degree-adverbs]
        vocab: []
      - q: { es: "冷氣凍唔凍呀？", en: "Is the air-con cold?" }
        a: { es: "太凍喇！", en: "It's too cold!" }
        alt: ["啱啱好。", "唔凍。", "幾凍。"]
        grammar: [g.degree-adverbs, g.a-not-a-questions]
        vocab: [w.laang5-hei3, w.taai3]
      - q: { es: "返工辛唔辛苦呀？", en: "Is work tough?" }
        a: { es: "幾辛苦，日日都好忙。", en: "Quite tough, I'm busy every day." }
        alt: ["唔係好辛苦。", "好辛苦呀！"]
        grammar: [g.degree-adverbs]
        vocab: [w.san1-fu2]
      - q: { es: "呢張床舒唔舒服呀？", en: "Is this bed comfortable?" }
        a: { es: "非常舒服。", en: "Extremely comfortable." }
        alt: ["好舒服。", "唔係幾舒服。"]
        grammar: [g.degree-adverbs, g.a-not-a-questions]
        vocab: [w.syu1-fuk6, w.fei1-soeng4]
    texts:
      - title: "香港嘅夏天"
        es: ["香港嘅夏天非常熱。", "空氣好濕，好翳焗。", "我日日都開冷氣。"]
        en: ["Summer in Hong Kong is extremely hot.", "The air is very humid and muggy.", "I turn on the air-con every day."]
        grammar: [g.degree-adverbs, g.weather]
        vocab: [w.fei1-soeng4, w.sap1, w.ai3-guk6, w.laang5-hei3]
      - title: "Mandy 嘅短訊"
        es: ["公司嘅冷氣太凍喇！", "我要帶件褸返工。", "你哋公司凍唔凍㗎？"]
        en: ["The air-con at work is far too cold!", "I have to take a jacket to work.", "Is it cold at your office?"]
        grammar: [g.degree-adverbs]
        vocab: [w.laang5-hei3, w.taai3, w.gaa3.b]
    spicy:
      - { es: "冷氣咁凍，你坐近啲啦。", jp: "laang5 hei3 gam3 dung3 nei5 co5 kan5 di1 laa1", en: "The air-con is so cold, sit a bit closer.", altEs: ["冷氣咁凍，你坐埋嚟啦。"], grammar: [g.degree-adverbs, g.particles-aa-laa], vocab: [w.laang5-hei3, w.gam3] }
      - { es: "你真係好叻，又咁靚，太犀利喇。", en: "You're really clever and so good-looking, it's too much.", altEs: ["你真係好叻，又咁靚，太犀利啦。"], grammar: [g.degree-adverbs], vocab: [w.zan1-hai6, w.taai3] }
      - { es: "天氣幾熱，你都幾熱。", en: "The weather's quite hot, and so are you.", altEs: ["天氣幾熱，你都幾熱㗎。"], grammar: [g.degree-adverbs], vocab: [] }
      - { es: "同你行山好辛苦，因為我成日睇你，唔睇路。", en: "Hiking with you is hard work, because I keep looking at you instead of the path.", altEs: ["同你行山真係好辛苦，因為我成日睇你，唔睇路。"], grammar: [g.degree-adverbs], vocab: [w.san1-fu2] }
      - { es: "呢度好舒服，我唔想走喇。", en: "It's so cosy here, I don't want to leave.", altEs: ["呢度好舒服呀，我唔想走喇。"], grammar: [g.degree-adverbs], vocab: [w.syu1-fuk6] }
  - id: a1.u12.l3
    title: 有啲凍
    teach: [g.jau-di-a-bit]
    vocab: [w.jau5-di1, w.hou2-ci5, w.wu1-zou1, w.gon1-zeng6, w.cou4, w.zing6, w.ji6.b, w.naan4, w.daai6-seng1, w.sai3-seng1, w.waai6, w.caa1.b, w.wong1-wong1]
    tip: "有啲 + adjective is \"a bit\" (often a mild complaint): 有啲凍. Adjective + 啲 is \"a bit more\": 大啲 \"bigger\"."
    sentences:
      - { es: "我有啲攰。", jp: "ngo5 jau5 di1 gui6", en: "I'm a bit tired.", altEs: ["我有少少攰。"], grammar: [g.jau-di-a-bit], vocab: [w.jau5-di1], transform: { instruction: "Say she's a bit unhappy", answer: "佢有啲唔開心。", en: "She's a bit unhappy." } }
      - { es: "今日有啲凍。", en: "It's a bit cold today.", altEs: ["今日有少少凍。"], grammar: [g.jau-di-a-bit, g.weather], vocab: [w.jau5-di1], transform: { instruction: "Say it's a bit hot", answer: "今日有啲熱。", en: "It's a bit hot today." }, error: { wrong: "今日凍有啲。", explain: "有啲 goes before the adjective: 有啲凍.", grammar: g.jau-di-a-bit } }
      - { es: "呢度有啲嘈。", en: "It's a bit noisy here.", altEs: ["呢度好嘈。"], grammar: [g.jau-di-a-bit], vocab: [w.cou4], transform: { instruction: "Ask whether there's somewhere quieter (靜啲)", answer: "有冇靜啲嘅地方呀？", alt: ["有冇靜啲嘅地方？"], en: "Is there somewhere quieter?" } }
      - { es: "呢對鞋有啲細。", en: "These shoes are a bit small.", altEs: ["呢對鞋有少少細。"], grammar: [g.jau-di-a-bit], vocab: [w.jau5-di1], error: { wrong: "呢對鞋細啲。", explain: "細啲 means \"smaller\"; \"a bit small\" is 有啲細.", grammar: g.jau-di-a-bit } }
      - { es: "有冇大啲嘅呀？", en: "Is there a bigger one?", altEs: ["有冇大啲嘅？", "有冇大少少嘅呀？"], grammar: [g.jau-di-a-bit, g.adj-ge-noun], vocab: [] }
      - { es: "有啲人唔食牛肉。", en: "Some people don't eat beef.", altEs: ["有啲人唔食牛。"], grammar: [g.jau-di-a-bit], vocab: [w.jau5-di1] }
      - { es: "講大聲啲，唔該。", en: "A bit louder, please.", altEs: ["唔該講大聲啲。", "大聲啲，唔該。"], grammar: [g.jau-di-a-bit, g.mgoi-doze], vocab: [w.daai6-seng1] }
      - { es: "我屋企好靜。", en: "My flat is very quiet.", altEs: ["我屋企好靜㗎。"], grammar: [g.adjective-predicates], vocab: [w.zing6] }
