id: r.a2.la-ribollita-della-nonna
level: a2
title: La ribollita della nonna
kind: text
intro: A recipe for ribollita, the Tuscan bread-and-vegetable soup, written by a grandmother for her granddaughter who has moved abroad. Notice the informal imperative.
allow: [ribollita, cavolo, nero, bianca, toscana, chiara]
paragraphs:
  - { es: "Cara Chiara, mi hai chiesto la ricetta della ribollita. Eccola! È un piatto povero della Toscana: una volta le famiglie di contadini non buttavano mai il pane vecchio e lo mettevano nella minestra. Si chiama «ribollita» perché è più buona il giorno dopo, quando la fai bollire di nuovo.", en: "Dear Chiara, you asked me for the ribollita recipe. Here it is! It's a peasant dish from Tuscany: in the old days farming families never threw away stale bread and they put it in the soup. It's called 'ribollita' (reboiled) because it's better the next day, when you boil it again." }
  - { es: "Ingredienti per quattro persone: mezzo chilo di fagioli bianchi già cotti, un cavolo nero, mezzo cavolo verde, due carote, due patate, una cipolla, due zucchine, un pomodoro, pane toscano vecchio, olio extravergine, sale e pepe.", en: "Ingredients for four people: half a kilo of cooked white beans, a bunch of cavolo nero, half a green cabbage, two carrots, two potatoes, an onion, two courgettes, a tomato, stale Tuscan bread, extra-virgin olive oil, salt and pepper." }
  - { es: "Prima taglia la cipolla e le carote a pezzetti piccoli. Metti un po' d'olio in una pentola grande e cuocile a fuoco basso per dieci minuti. Non farle bruciare! Poi aggiungi le patate, le zucchine e il pomodoro, sempre a pezzetti, e mescola bene.", en: "First chop the onion and the carrots into small pieces. Put a little oil in a large pot and cook them over a low heat for ten minutes. Don't let them burn! Then add the potatoes, the courgettes and the tomato, also in small pieces, and stir well." }
  - { es: "Lava il cavolo nero e il cavolo verde, tagliali e mettili nella pentola. Aggiungi metà dei fagioli e due litri d'acqua. Con l'altra metà dei fagioli fai una crema e versala nella minestra: così diventa più densa. Aggiungi sale e pepe e lascia cuocere per almeno due ore.", en: "Wash the cavolo nero and the green cabbage, cut them up and put them in the pot. Add half the beans and two litres of water. Make a purée with the other half of the beans and pour it into the soup: that way it gets thicker. Add salt and pepper and let it cook for at least two hours." }
  - { es: "Alla fine prendi una ciotola grande e fai uno strato di pane tagliato a fette, uno strato di minestra, poi ancora pane e ancora minestra. Lasciala riposare fino al giorno dopo. Il giorno dopo scaldala in padella con un po' d'olio. Servila calda, con un filo d'olio crudo sopra.", en: "Finally take a large bowl and make a layer of sliced bread, a layer of soup, then bread again and soup again. Leave it to rest until the next day. The next day heat it in a frying pan with a little oil. Serve it hot, with a drizzle of raw oil on top." }
  - { es: "Non avere fretta: la ribollita vuole pazienza. E quando la mangi, pensa alla tua nonna! Un bacione, Nonna Bianca.", en: "Don't rush: ribollita needs patience. And when you eat it, think of your grandma! Lots of love, Grandma Bianca." }
questions:
  - { q: "Perché la minestra si chiama «ribollita»?", options: ["Perché è più buona quando la fai bollire di nuovo il giorno dopo", "Perché si cucina in dieci minuti", "Perché si mangia fredda"], answer: 0, explain: "Ri-bollita means 'boiled again': it's better reheated the next day." }
  - { q: "Che cosa facevano una volta le famiglie di contadini con il pane vecchio?", options: ["Lo buttavano", "Lo mettevano nella minestra", "Lo davano agli animali"], answer: 1, explain: "«Non buttavano mai il pane vecchio e lo mettevano nella minestra.»" }
  - { q: "Che cosa bisogna fare con metà dei fagioli?", options: ["Una crema da versare nella minestra", "Un'insalata", "Niente: non servono"], answer: 0, explain: "Half the beans are puréed (fai una crema) to thicken the soup." }
  - { q: "Quanto tempo deve cuocere la minestra?", options: ["Dieci minuti", "Almeno due ore", "Un giorno intero"], answer: 1, explain: "«Lascia cuocere per almeno due ore.»" }
  - { q: "Che cosa significa «Non farle bruciare!»?", options: ["Don't let them burn!", "Don't cut them!", "Don't wash them!"], answer: 0, explain: "A negative informal imperative: non + infinitive (non fare), with the pronoun le (the onion and carrots) attached." }
glossary:
  - { es: cavolo, en: cabbage }
  - { es: cavolo nero, en: cavolo nero, Tuscan black kale }
  - { es: extravergine, en: extra-virgin }
  - { es: pezzetti, en: small pieces }
  - { es: bruciare, en: to burn }
  - { es: crema, en: purée, cream }
  - { es: densa, en: thick }
  - { es: almeno, en: at least }
  - { es: strato, en: layer }
  - { es: filo, en: (un filo d'olio) a drizzle }
  - { es: bacione, en: big kiss }
