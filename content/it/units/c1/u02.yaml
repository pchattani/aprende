id: c1.u02
title: "Fu allora che capì"
lessons:
  - id: c1.u02.l1
    title: Guglielmo fondò il Duomo
    teach: [g.passato-remoto-forms]
    vocab: [w.narrare, w.narratore, w.narrazione, w.vicenda, w.cronologia, w.epopea, w.gesta, w.sovrano, w.monarchia, w.nobiltà, w.aristocrazia, w.barone, w.latifondo, w.feudale, w.dominio, w.conquista, w.invasione, w.invasore, w.lanno-seguente, w.poco-dopo, w.in-seguito, w.tramandare, w.storiografia, w.narrativo, w.monaco, w.benedettino, w.corona, w.antenato, w.arcivescovo, w.sfidare, w.governare, w.terminare, w.paladino, w.ripartire, w.rivestire, w.sentimentale, w.arcivescovile]
    tip: "Regular passato remoto: parlai, parlò, parlarono · credetti / credei, credette / credé · partii, partì, partirono. Watch the accent (parlò = he spoke, parlo = I speak) and the double m of noi (arrivammo, not arriviamo)."
    sentences:
      - { es: "Nel 1174 il re Guglielmo II fondò il Duomo di Monreale.", en: "In 1174 King William II founded Monreale Cathedral.", altEs: ["Il re Guglielmo II fondò il Duomo di Monreale nel 1174."], grammar: [g.passato-remoto-forms], vocab: [] }
      - { es: "Il re ha fondato il Duomo per sfidare l'arcivescovo di Palermo.", en: "The king founded the cathedral to challenge the Archbishop of Palermo.", grammar: [g.passato-remoto-forms], vocab: [w.arcivescovo], transform: { instruction: "Rewrite it as history, in the passato remoto", answer: "Il re fondò il Duomo per sfidare l'arcivescovo di Palermo.", alt: ["Il sovrano fondò il Duomo per sfidare l'arcivescovo di Palermo."], en: "The king founded the cathedral to challenge the Archbishop of Palermo." } }
      - { es: "Arrivammo a Monreale all'alba e cercammo subito un caffè.", en: "We arrived in Monreale at dawn and immediately looked for a coffee.", altEs: ["Arrivammo a Monreale all'alba e subito cercammo un caffè."], grammar: [g.passato-remoto-forms], vocab: [], transform: { instruction: "Change the subject to io", answer: "Arrivai a Monreale all'alba e cercai subito un caffè.", alt: ["Arrivai a Monreale all'alba e subito cercai un caffè."], en: "I arrived in Monreale at dawn and immediately looked for a coffee." } }
      - { es: "Poco dopo arrivarono da Cava i primi monaci benedettini.", en: "Shortly afterwards the first Benedictine monks arrived from Cava.", altEs: ["Poco dopo i primi monaci benedettini arrivarono da Cava."], grammar: [g.passato-remoto-forms], vocab: [w.poco-dopo, w.monaco, w.benedettino] }
      - { es: "Il giovane sovrano sognò una chiesa più grande di quella di Palermo.", en: "The young ruler dreamed of a church bigger than the one in Palermo.", grammar: [g.passato-remoto-forms, g.comparatives], vocab: [w.sovrano] }
      - { es: "Per secoli i baroni governarono il latifondo come un piccolo regno.", en: "For centuries the barons ruled the great estates like small kingdoms.", altEs: ["Per secoli i baroni governarono i latifondi come piccoli regni."], grammar: [g.passato-remoto-forms], vocab: [w.barone, w.latifondo] }
      - { es: "Il sistema feudale durò in Sicilia fino al 1812.", en: "The feudal system lasted in Sicily until 1812.", grammar: [g.passato-remoto-forms], vocab: [w.feudale] }
      - { es: "La conquista normanna dell'isola cominciò nel 1061 e terminò trent'anni dopo.", en: "The Norman conquest of the island began in 1061 and ended thirty years later.", altEs: ["La conquista normanna dell'isola iniziò nel 1061 e finì trent'anni dopo."], grammar: [g.passato-remoto-forms], vocab: [w.conquista, w.normanno] }
      - { es: "Gli Arabi non accettarono subito il dominio dei nuovi invasori.", en: "The Arabs did not immediately accept the rule of the new invaders.", grammar: [g.passato-remoto-forms], vocab: [w.dominio, w.invasore] }
      - { es: "Ruggero II ricevette la corona nel 1130 e trasformò Palermo in una capitale cosmopolita.", en: "Roger II received the crown in 1130 and turned Palermo into a cosmopolitan capital.", altEs: ["Ruggero II ricevé la corona nel 1130 e trasformò Palermo in una capitale cosmopolita."], grammar: [g.passato-remoto-forms], vocab: [w.corona, w.cosmopolita], note: "-ere verbs: ricevette and ricevé are both correct." }
      - { es: "Nel Gattopardo, capolavoro narrativo del Novecento, Tomasi di Lampedusa narrò la fine dell'aristocrazia siciliana.", en: "In The Leopard, a twentieth-century narrative masterpiece, Tomasi di Lampedusa narrated the end of the Sicilian aristocracy.", grammar: [g.passato-remoto-forms], vocab: [w.narrare, w.aristocrazia, w.narrativo] }
      - { es: "Mia nonna mi tramandò le ricette di famiglia, ma non le gesta dei nostri antenati.", en: "My grandmother handed down the family recipes to me, but not the exploits of our ancestors.", grammar: [g.passato-remoto-forms], vocab: [w.tramandare, w.gesta, w.antenato] }
      - { es: "In seguito, gli storici cercarono di ricostruire la cronologia esatta dei lavori.", en: "Later, historians tried to reconstruct the exact chronology of the building work.", altEs: ["Successivamente, gli storici cercarono di ricostruire la cronologia esatta dei lavori."], grammar: [g.passato-remoto-forms], vocab: [w.in-seguito, w.cronologia] }
      - { es: "Lo spettacolo dei pupi narrò l'epopea di Orlando e dei paladini di Francia.", en: "The puppet show told the epic of Orlando and the paladins of France.", grammar: [g.passato-remoto-forms], vocab: [w.epopea, w.pupo] }
      - { es: "Credettero alla leggenda e l'anno seguente partirono per Monreale.", en: "They believed the legend and the following year set off for Monreale.", altEs: ["Crederono alla leggenda e l'anno seguente partirono per Monreale.", "Credettero alla leggenda e l'anno dopo partirono per Monreale."], grammar: [g.passato-remoto-forms], vocab: [w.leggenda, w.lanno-seguente] }
      - { es: "Il giorno dopo arrivammo al chiostro prima dei turisti.", en: "The next day we reached the cloister before the tourists.", grammar: [g.passato-remoto-forms], vocab: [w.chiostro], error: { wrong: "Il giorno dopo arriviamo al chiostro prima dei turisti.", explain: "The noi form of the passato remoto doubles the m: arrivammo. Arriviamo is the present.", grammar: g.passato-remoto-forms } }
    exchanges:
      - q: { es: "Quando cominciarono i lavori del Duomo?", en: "When did work on the cathedral begin?" }
        a: { es: "Nel 1174, sotto Guglielmo II; nel 1183 Monreale diventò sede arcivescovile.", en: "In 1174, under William II; in 1183 Monreale became the seat of an archbishop." }
        alt: ["Nel 1174.", "Sotto Guglielmo II, nel 1174."]
        grammar: [g.passato-remoto-forms]
        vocab: [w.arcivescovo]
      - q: { es: "Chi governò la Sicilia dopo gli Arabi?", en: "Who ruled Sicily after the Arabs?" }
        a: { es: "I Normanni, che conquistarono l'isola nell'XI secolo e fondarono una monarchia potente.", en: "The Normans, who conquered the island in the 11th century and founded a powerful monarchy." }
        alt: ["I Normanni.", "La monarchia normanna."]
        grammar: [g.passato-remoto-forms]
        vocab: [w.monarchia]
      - q: { es: "Ti è piaciuta la narrazione della guida?", en: "Did you like the guide's narration?" }
        a: { es: "Moltissimo: raccontò la vicenda dei mosaici come un narratore di romanzi.", en: "Very much: she told the story of the mosaics like a novelist." }
        alt: ["Sì, raccontò tutto come un romanzo.", "Sì, è stata bravissima."]
        grammar: [g.passato-remoto-forms]
        vocab: [w.narrazione, w.vicenda, w.narratore]
      - q: { es: "La nobiltà perse le terre nel 1812?", en: "Did the nobility lose their land in 1812?" }
        a: { es: "No: perse i diritti feudali, ma il latifondo restò nelle sue mani ancora a lungo.", en: "No: it lost its feudal rights, but the great estates stayed in its hands for a long time." }
        alt: ["No, i latifondi restarono ai baroni.", "Solo in parte."]
        grammar: [g.passato-remoto-forms, g.passato-remoto-irregular]
        vocab: [w.nobiltà, w.feudale, w.latifondo]
      - q: { es: "In che anno arrivaste in Sicilia?", en: "What year did you (all) arrive in Sicily?" }
        a: { es: "Arrivammo nel 1998 e non ripartimmo più.", en: "We arrived in 1998 and never left again." }
        alt: ["Nel 1998.", "Arrivammo nel 1998."]
        grammar: [g.passato-remoto-forms]
        vocab: []
      - q: { es: "Che cosa pensa la storiografia moderna dell'invasione araba?", en: "What does modern historiography think of the Arab invasion?" }
        a: { es: "Che portò alla Sicilia agrumi, canali per l'acqua e parole che usiamo ancora.", en: "That it brought Sicily citrus fruit, water channels and words we still use." }
        alt: ["Che portò molte novità.", "Che non fu solo una conquista."]
        grammar: [g.passato-remoto-forms]
        vocab: [w.storiografia, w.invasione]
    texts:
      - title: "Pannello del museo"
        es: ["Nel 1174 Guglielmo II fondò a Monreale un'abbazia benedettina.", "Gli artigiani rivestirono le pareti di mosaici a fondo oro.", "Poco dopo arrivarono i primi monaci, e il chiostro si riempì di voci."]
        en: ["In 1174 William II founded a Benedictine abbey in Monreale.", "The craftsmen covered the walls with gold-ground mosaics.", "Shortly afterwards the first monks arrived, and the cloister filled with voices."]
        grammar: [g.passato-remoto-forms]
        vocab: [w.benedettino, w.monaco, w.chiostro]
      - title: "Cronologia"
        es: ["1061: i Normanni cominciarono la conquista della Sicilia.", "1130: Ruggero II ricevette la corona di re.", "1174: Guglielmo II fondò il Duomo di Monreale."]
        en: ["1061: the Normans began the conquest of Sicily.", "1130: Roger II received the king's crown.", "1174: William II founded Monreale Cathedral."]
        grammar: [g.passato-remoto-forms]
        vocab: [w.cronologia, w.conquista, w.corona]
    spicy:
      - { es: "Quella sera ballammo fino all'alba, e il giorno dopo nessuno dei due trovò le scarpe.", en: "That night we danced until dawn, and the next day neither of us could find our shoes.", grammar: [g.passato-remoto-forms], vocab: [] }
      - { es: "Mi baciò nel chiostro e io pensai solo: speriamo che i monaci non guardino.", en: "He kissed me in the cloister and all I thought was: let's hope the monks aren't watching.", altEs: ["Mi baciò nel chiostro e pensai soltanto: speriamo che i monaci non guardino."], grammar: [g.passato-remoto-forms], vocab: [w.chiostro, w.monaco] }
      - { es: "Il barone mi invitò a cena, ma io preferii il cameriere.", en: "The baron invited me to dinner, but I preferred the waiter.", grammar: [g.passato-remoto-forms], vocab: [w.barone] }
      - { es: "Mi narrò le sue gesta sentimentali per tre ore; io sognai il dessert.", en: "He narrated his romantic exploits to me for three hours; I dreamed about dessert.", grammar: [g.passato-remoto-forms], vocab: [w.narrare, w.gesta] }
      - { es: "Ci incontrammo davanti ai mosaici e passammo il pomeriggio a guardarci invece dei santi.", en: "We met in front of the mosaics and spent the afternoon looking at each other instead of the saints.", grammar: [g.passato-remoto-forms], vocab: [w.santo] }
  - id: c1.u02.l2
    title: Fu allora che capì
    teach: [g.passato-remoto-irregular]
    vocab: [w.sbarco, w.sbarcare, w.unificazione, w.unità, w.risorgimento, w.borbonico, w.rivolta, w.rivoluzione, w.insurrezione, w.ribelle, w.assedio, w.plebiscito, w.annessione, w.brigantaggio, w.brigante, w.fu-allora-che, w.giungere, w.scorgere, w.ribellarsi, w.insorgere, w.truppa, w.combattimento, w.silenzioso, w.tregua]
    tip: "Most irregular verbs change only in io, lui / lei and loro (the 1-3-3 rule): ebbi, ebbe, ebbero · feci, fece, fecero · vidi, vide, videro. Tu, noi and voi stay regular: avesti, facemmo, vedeste."
    sentences:
      - { es: "Garibaldi sbarcò a Marsala l'11 maggio 1860 con poco più di mille uomini.", en: "Garibaldi landed at Marsala on 11 May 1860 with just over a thousand men.", grammar: [g.passato-remoto-forms], vocab: [w.sbarcare] }
      - { es: "Fu allora che i siciliani capirono che il dominio borbonico stava per finire.", en: "It was then that the Sicilians understood that Bourbon rule was about to end.", altEs: ["Fu in quel momento che i siciliani capirono che il dominio borbonico stava per finire."], grammar: [g.passato-remoto-irregular, g.cleft-sentences], vocab: [w.fu-allora-che, w.borbonico, w.dominio] }
      - { es: "Giunse a Palermo alla fine di maggio e la città insorse.", en: "He reached Palermo at the end of May and the city rose up.", altEs: ["Arrivò a Palermo alla fine di maggio e la città insorse."], grammar: [g.passato-remoto-irregular], vocab: [w.giungere, w.insorgere] }
      - { es: "Dopo tre giorni di combattimenti, le truppe borboniche chiesero una tregua.", en: "After three days of fighting, the Bourbon troops asked for a truce.", grammar: [g.passato-remoto-irregular], vocab: [w.combattimento, w.truppa, w.borbonico] }
      - { es: "Il plebiscito dell'ottobre 1860 approvò l'annessione al Regno di Sardegna.", en: "The plebiscite of October 1860 approved annexation to the Kingdom of Sardinia.", grammar: [g.passato-remoto-forms], vocab: [w.plebiscito, w.annessione] }
      - { es: "L'unificazione non diede ai contadini le terre che speravano.", en: "Unification did not give the peasants the land they had hoped for.", altEs: ["L'unificazione non dette ai contadini le terre che speravano."], grammar: [g.passato-remoto-irregular], vocab: [w.unificazione], note: "diede and dette are both correct." }
      - { es: "Nel Sud molti contadini si diedero al brigantaggio; il brigante più famoso della zona visse nei boschi per anni.", en: "In the South many peasants turned to brigandage; the most famous brigand in the area lived in the woods for years.", altEs: ["Nel Sud molti contadini si dettero al brigantaggio; il brigante più famoso della zona visse nei boschi per anni."], grammar: [g.passato-remoto-irregular], vocab: [w.brigantaggio, w.brigante] }
      - { es: "Nel 1282 i palermitani si ribellarono ai Francesi: la rivolta prese il nome di Vespri siciliani.", en: "In 1282 the people of Palermo rebelled against the French: the revolt took the name of the Sicilian Vespers.", grammar: [g.passato-remoto-irregular], vocab: [w.ribellarsi, w.rivolta, w.palermitano] }
      - { es: "Nel 1848 l'insurrezione di Palermo fu la prima di una lunga serie di rivoluzioni in Europa.", en: "In 1848 the Palermo insurrection was the first of a long series of revolutions in Europe.", grammar: [g.passato-remoto-irregular], vocab: [w.insurrezione, w.rivoluzione] }
      - { es: "I ribelli resisterono all'assedio per settimane, poi dovettero arrendersi.", en: "The rebels held out against the siege for weeks, then had to surrender.", grammar: [g.passato-remoto-irregular], vocab: [w.ribelle, w.assedio] }
      - { es: "Quando lo vidi, capii subito che qualcosa non andava.", en: "When I saw him, I immediately understood that something was wrong.", grammar: [g.passato-remoto-irregular], vocab: [], error: { wrong: "Quando lo vedetti, capii subito che qualcosa non andava.", explain: "vedere is strong in the passato remoto: vidi, vide, videro (1-3-3 rule).", grammar: g.passato-remoto-irregular } }
      - { es: "Da lontano scorsi le camicie rosse che scendevano verso la città.", en: "From afar I made out the redshirts coming down towards the city.", grammar: [g.passato-remoto-irregular], vocab: [w.scorgere, w.camicia-rossa] }
      - { es: "Il Risorgimento fece l'Italia, ma non fece subito gli italiani.", en: "The Risorgimento made Italy, but it didn't make Italians straight away.", grammar: [g.passato-remoto-irregular], vocab: [w.risorgimento] }
      - { es: "Garibaldi è venuto in Sicilia e ha vinto.", en: "Garibaldi came to Sicily and won.", grammar: [g.passato-remoto-irregular], vocab: [], transform: { instruction: "Rewrite in the passato remoto", answer: "Garibaldi venne in Sicilia e vinse.", alt: [], en: "Garibaldi came to Sicily and won." } }
      - { es: "Perché facesti finta di niente?", en: "Why did you pretend nothing had happened?", grammar: [g.passato-remoto-irregular], vocab: [], error: { wrong: "Perché fecesti finta di niente?", explain: "The tu form is regular, built on the infinitive stem: facesti (not fecesti).", grammar: g.passato-remoto-irregular } }
      - { es: "Ebbi paura e scappai.", en: "I got scared and ran away.", grammar: [g.passato-remoto-irregular], vocab: [], transform: { instruction: "Change the subject to loro", answer: "Ebbero paura e scapparono.", alt: [], en: "They got scared and ran away." } }
    exchanges:
      - q: { es: "Dove sbarcò Garibaldi?", en: "Where did Garibaldi land?" }
        a: { es: "A Marsala, l'11 maggio 1860: lo sbarco durò poche ore.", en: "At Marsala, on 11 May 1860: the landing lasted a few hours." }
        alt: ["A Marsala.", "Sbarcò a Marsala nel 1860."]
        grammar: [g.passato-remoto-forms]
        vocab: [w.sbarco]
      - q: { es: "Chi vinse alla fine?", en: "Who won in the end?" }
        a: { es: "Vinsero le camicie rosse, con l'aiuto di molti siciliani.", en: "The redshirts won, with the help of many Sicilians." }
        alt: ["Vinse Garibaldi.", "Vinsero i garibaldini."]
        grammar: [g.passato-remoto-irregular]
        vocab: [w.camicia-rossa]
      - q: { es: "Quando nacque il Regno d'Italia?", en: "When was the Kingdom of Italy born?" }
        a: { es: "Il 17 marzo 1861: l'unità arrivò dopo i plebisciti e le annessioni.", en: "On 17 March 1861: unity came after the plebiscites and the annexations." }
        alt: ["Nel 1861.", "Nacque nel 1861."]
        grammar: [g.passato-remoto-irregular]
        vocab: [w.plebiscito, w.annessione, w.unità]
      - q: { es: "Che cosa ti disse tuo nonno dei briganti?", en: "What did your grandfather tell you about the brigands?" }
        a: { es: "Mi disse che suo nonno ne conobbe uno, ma non volle mai dire il nome.", en: "He told me his grandfather knew one, but never wanted to say his name." }
        alt: ["Mi disse che erano eroi per alcuni e criminali per altri.", "Non mi disse quasi niente."]
        grammar: [g.passato-remoto-irregular, g.ne-partitive]
        vocab: [w.brigante]
      - q: { es: "Che cosa successe nel 1848?", en: "What happened in 1848?" }
        a: { es: "Palermo insorse per prima e la rivoluzione si diffuse in tutta Europa.", en: "Palermo rose up first and the revolution spread across Europe." }
        alt: ["Ci fu un'insurrezione a Palermo.", "Scoppiò la rivoluzione."]
        grammar: [g.passato-remoto-irregular]
        vocab: [w.insorgere, w.rivoluzione]
    texts:
      - title: "Diario di un volontario, 1860"
        es: ["Partimmo da Quarto la notte del 5 maggio.", "Sei giorni dopo sbarcammo a Marsala, mentre le navi borboniche si avvicinavano.", "Fu allora che capii che non saremmo tornati indietro."]
        en: ["We set off from Quarto on the night of 5 May.", "Six days later we landed at Marsala, while the Bourbon ships were approaching.", "It was then that I understood we would not turn back."]
        grammar: [g.passato-remoto-irregular, g.passato-remoto-forms]
        vocab: [w.sbarcare, w.borbonico, w.fu-allora-che]
    spicy:
      - { es: "Quando ti vidi alla festa, fu allora che capii che la serata non sarebbe stata noiosa.", en: "When I saw you at the party, that was when I knew the evening wouldn't be boring.", grammar: [g.passato-remoto-irregular], vocab: [w.fu-allora-che] }
      - { es: "Mi disse che mi avrebbe chiamato; non chiamò, ma venne di persona con i cannoli.", en: "He said he'd call me; he didn't call, but he came in person with cannoli.", grammar: [g.passato-remoto-irregular], vocab: [w.cannolo] }
      - { es: "Sbarcasti nella mia vita come Garibaldi a Marsala: senza invito e con mille amici.", en: "You landed in my life like Garibaldi at Marsala: uninvited and with a thousand friends.", grammar: [g.passato-remoto-forms], vocab: [w.sbarcare] }
      - { es: "Ebbi un dubbio, feci una domanda, e lui arrossì fino alle orecchie.", en: "I had a doubt, I asked a question, and he blushed to the tips of his ears.", grammar: [g.passato-remoto-irregular], vocab: [w.arrossire] }
      - { es: "Facemmo finta di non conoscerci, ma tutta la piazza capì.", en: "We pretended not to know each other, but the whole square worked it out.", grammar: [g.passato-remoto-irregular], vocab: [] }
  - id: c1.u02.l3
    title: Nacque nel 1939, l'ho visto ieri
    teach: [g.passato-remoto-vs-prossimo]
    vocab: [w.mafia, w.mafioso, w.omertà, w.pizzo, w.criminalità-organizzata, w.legalità, w.antimafia, w.magistrato, w.giudice, w.attentato, w.strage, w.scorta, w.memoria-storica, w.testimonianza, w.testimoniare, w.avvenuto, w.esplosione, w.pentito, w.adesivo, w.commerciante, w.complicità, w.serenata, w.decisivo, w.maxiprocesso, w.agente, w.astratto, w.scomparire, w.pestare]
    tip: "Passato prossimo for the past still linked to now (Ho studiato a Palermo); passato remoto for closed, distant events, history and biography (Falcone nacque nel 1939). In Sicily the remoto is also used in everyday speech."
    sentences:
      - { es: "Giovanni Falcone nacque a Palermo nel 1939.", en: "Giovanni Falcone was born in Palermo in 1939.", grammar: [g.passato-remoto-vs-prossimo, g.passato-remoto-irregular], vocab: [] }
      - { es: "Paolo Borsellino è cresciuto nel quartiere della Kalsa.", en: "Paolo Borsellino grew up in the Kalsa district.", grammar: [g.passato-remoto-vs-prossimo], vocab: [], transform: { instruction: "Rewrite it as a biography, in the passato remoto", answer: "Paolo Borsellino crebbe nel quartiere della Kalsa.", alt: [], en: "Paolo Borsellino grew up in the Kalsa district." } }
      - { es: "Il maxiprocesso cominciò nel 1986 e portò alla condanna di centinaia di mafiosi.", en: "The maxi-trial began in 1986 and led to the conviction of hundreds of mafiosi.", grammar: [g.passato-remoto-vs-prossimo], vocab: [w.maxiprocesso, w.mafioso, w.condanna] }
      - { es: "La strage di Capaci avvenne il 23 maggio 1992.", en: "The Capaci massacre took place on 23 May 1992.", grammar: [g.passato-remoto-irregular], vocab: [w.strage] }
      - { es: "Nell'attentato morirono il giudice, sua moglie e tre agenti della scorta.", en: "The judge, his wife and three officers of his escort died in the attack.", grammar: [g.passato-remoto-irregular], vocab: [w.attentato, w.giudice, w.scorta] }
      - { es: "Quei due magistrati hanno cambiato per sempre il modo in cui gli italiani guardano la mafia.", en: "Those two magistrates changed forever the way Italians look at the Mafia.", altEs: ["Quei due giudici hanno cambiato per sempre il modo in cui gli italiani guardano la mafia."], grammar: [g.passato-remoto-vs-prossimo], vocab: [w.magistrato, w.mafia], note: "The effect is still felt today: passato prossimo." }
      - { es: "Mio padre sentì la notizia alla radio e non l'ha mai dimenticata.", en: "My father heard the news on the radio and has never forgotten it.", grammar: [g.passato-remoto-vs-prossimo], vocab: [], note: "A closed event (sentì) and a consequence that lasts until now (non l'ha mai dimenticata)." }
      - { es: "Per decenni l'omertà protesse i boss, ma oggi molti hanno il coraggio di testimoniare.", en: "For decades the code of silence protected the bosses, but today many have the courage to testify.", grammar: [g.passato-remoto-irregular], vocab: [w.omertà, w.testimoniare] }
      - { es: "Nel 2004 alcuni ragazzi riempirono Palermo di adesivi contro il pizzo.", en: "In 2004 some young people covered Palermo in stickers against protection money.", grammar: [g.passato-remoto-forms], vocab: [w.adesivo, w.pizzo] }
      - { es: "Da allora centinaia di commercianti hanno detto no al pizzo.", en: "Since then hundreds of shopkeepers have said no to protection money.", grammar: [g.passato-remoto-vs-prossimo], vocab: [w.commerciante, w.pizzo] }
      - { es: "Stamattina mi alzai presto e andai al mercato.", en: "This morning I got up early and went to the market.", grammar: [g.passato-remoto-vs-prossimo, g.regional-italian-south], vocab: [], note: "Sicilian regional usage: in standard Italian, use the passato prossimo for this morning.", transform: { instruction: "Rewrite in standard Italian (passato prossimo)", answer: "Stamattina mi sono alzato presto e sono andato al mercato.", alt: ["Stamattina mi sono alzata presto e sono andata al mercato."], en: "This morning I got up early and went to the market." } }
      - { es: "Ieri sera siamo andati al cinema con Giulia.", en: "Last night we went to the cinema with Giulia.", altEs: ["Ieri sera siamo andate al cinema con Giulia."], grammar: [g.passato-remoto-vs-prossimo], vocab: [], error: { wrong: "Ieri sera andammo al cinema con Giulia.", explain: "In standard Italian, last night is recent and still connected to now: passato prossimo (siamo andati). The remoto here is Sicilian regional or narrative.", grammar: g.passato-remoto-vs-prossimo } }
      - { es: "La memoria storica di quegli anni vive nelle scuole e nelle piazze.", en: "The historical memory of those years lives on in schools and squares.", grammar: [g.passato-remoto-vs-prossimo], vocab: [w.memoria-storica] }
      - { es: "La legalità non è un'idea astratta: è il pane che compri senza pagare il pizzo.", en: "The rule of law isn't an abstract idea: it's the bread you buy without paying protection money.", grammar: [g.relative-che], vocab: [w.legalità, w.pizzo] }
      - { es: "La criminalità organizzata ha cambiato volto, ma non è scomparsa.", en: "Organised crime has changed its face, but it hasn't disappeared.", grammar: [g.passato-remoto-vs-prossimo, g.auxiliary-choice], vocab: [w.criminalità-organizzata] }
      - { es: "Le testimonianze dei pentiti furono decisive per il processo sulle stragi avvenute nel 1992.", en: "The informers' testimony was decisive for the trial over the massacres that took place in 1992.", grammar: [g.passato-remoto-irregular], vocab: [w.testimonianza, w.pentito, w.decisivo, w.avvenuto, w.strage] }
    exchanges:
      - q: { es: "Dov'era tuo padre quando avvenne la strage di Capaci?", en: "Where was your father when the Capaci massacre happened?" }
        a: { es: "Era a casa: era sabato, e sentì la notizia al telegiornale della sera.", en: "He was at home: it was a Saturday, and he heard the news on the evening bulletin." }
        alt: ["Era a casa.", "Era al lavoro e sentì la notizia alla radio."]
        grammar: [g.passato-remoto-vs-prossimo, g.passato-prossimo-vs-imperfetto]
        vocab: [w.strage]
      - q: { es: "Sei già stata all'albero Falcone?", en: "Have you been to the Falcone tree yet?" }
        a: { es: "Sì, ci sono andata stamattina: è pieno di messaggi.", en: "Yes, I went this morning: it's full of messages." }
        alt: ["Sì, ci sono andata stamattina.", "Non ancora, ci vado domani."]
        grammar: [g.passato-remoto-vs-prossimo, g.ci-place]
        vocab: []
      - q: { es: "Quando morì Borsellino?", en: "When did Borsellino die?" }
        a: { es: "Il 19 luglio 1992, cinquantasette giorni dopo Falcone.", en: "On 19 July 1992, fifty-seven days after Falcone." }
        alt: ["Nel luglio del 1992.", "Il 19 luglio 1992, in via D'Amelio."]
        grammar: [g.passato-remoto-irregular]
        vocab: []
      - q: { es: "Perché a Palermo dite «mi alzai» anche per stamattina?", en: "Why do you say «mi alzai» in Palermo even for this morning?" }
        a: { es: "Da noi il passato remoto si usa anche nel parlato, perfino per le cose di oggi.", en: "Here the passato remoto is used in speech too, even for things that happened today." }
        alt: ["È un uso regionale del Sud.", "Perché in Sicilia si parla così."]
        grammar: [g.passato-remoto-vs-prossimo]
        vocab: []
      - q: { es: "Che cosa significa omertà?", en: "What does omertà mean?" }
        a: { es: "È il silenzio di chi sa e non parla, per paura o per complicità.", en: "It's the silence of those who know and don't talk, out of fear or complicity." }
        alt: ["È il silenzio di chi sa e non parla.", "Significa non testimoniare."]
        grammar: [g.relative-chi-quello-che]
        vocab: [w.omertà, w.complicità]
    texts:
      - title: "Targa in via D'Amelio"
        es: ["Qui, il 19 luglio 1992, morirono il giudice Paolo Borsellino e cinque agenti della sua scorta.", "La loro memoria ci chiede ancora oggi di non abbassare la testa."]
        en: ["Here, on 19 July 1992, Judge Paolo Borsellino and five officers of his escort died.", "Their memory still asks us today not to bow our heads."]
        grammar: [g.passato-remoto-vs-prossimo]
        vocab: [w.giudice, w.scorta]
      - title: "Volantino antimafia"
        es: ["«Un intero popolo che paga il pizzo è un popolo senza dignità.»", "Con questa frase, nel 2004, alcuni giovani cominciarono una silenziosa rivoluzione antimafia.", "Oggi centinaia di commercianti hanno detto no, e l'esplosione di coraggio continua."]
        en: ["“An entire people that pays protection money is a people without dignity.”", "With this sentence, in 2004, some young people began a silent anti-mafia revolution.", "Today hundreds of shopkeepers have said no, and the explosion of courage goes on."]
        grammar: [g.passato-remoto-vs-prossimo]
        vocab: [w.antimafia, w.pizzo, w.commerciante, w.esplosione]
    spicy:
      - { es: "Il nostro primo appuntamento fu un disastro, ma il secondo è andato benissimo.", en: "Our first date was a disaster, but the second went brilliantly.", grammar: [g.passato-remoto-vs-prossimo], vocab: [] }
      - { es: "Tre anni fa mi dicesti che non ballavi; stasera mi hai pestato i piedi tutta la sera.", en: "Three years ago you told me you didn't dance; tonight you've been treading on my feet all evening.", grammar: [g.passato-remoto-vs-prossimo], vocab: [w.pestare] }
      - { es: "Ti ho visto ieri al mercato e non ho comprato niente, perché guardavo te.", en: "I saw you yesterday at the market and didn't buy anything, because I was looking at you.", grammar: [g.passato-remoto-vs-prossimo], vocab: [] }
      - { es: "Il nonno conquistò la nonna con una serenata; tu mi hai mandato un messaggio con tre cuori.", en: "Grandpa won Grandma over with a serenade; you sent me a message with three hearts.", grammar: [g.passato-remoto-vs-prossimo], vocab: [w.serenata] }
      - { es: "Stamattina mi svegliai pensando a te; sì, in Sicilia si dice così.", en: "This morning I woke up thinking of you; yes, in Sicily that's how we say it.", grammar: [g.passato-remoto-vs-prossimo, g.regional-italian-south], vocab: [] }
  - id: c1.u02.l4
    title: Appena ebbe finito, uscì
    teach: [g.trapassato-remoto]
    vocab: [w.voltarsi, w.chinarsi, w.sussultare, w.trasalire, w.impallidire, w.arrossire, w.sospirare, w.fissare, w.scrutare, w.balenare, w.svanire, w.precipitarsi, w.irrompere, w.indugiare, w.destarsi, w.dun-tratto, w.ad-un-tratto, w.di-lì-a-poco, w.allorché, w.recarsi, w.dirigersi, w.avviarsi, w.accingersi, w.apprestarsi, w.caccia, w.carrubo, w.inganno, w.soglia, w.fantasma, w.bussare, w.orizzonte, w.di-scatto, w.folla, w.applaudire, w.pullman]
    tip: "Trapassato remoto = ebbi / ebbe / ebbero (or fui / fu / furono) + participle. Only after appena, dopo che, quando, non appena, allorché, with a passato remoto in the main clause: Appena ebbe finito, uscì."
    sentences:
      - { es: "Appena ebbe finito la caccia, il re si addormentò sotto un carrubo.", en: "As soon as he had finished hunting, the king fell asleep under a carob tree.", altEs: ["Non appena ebbe finito la caccia, il re si addormentò sotto un carrubo."], grammar: [g.trapassato-remoto], vocab: [w.caccia, w.carrubo] }
      - { es: "Quando si fu addormentato, gli apparve in sogno la Madonna.", en: "When he had fallen asleep, the Virgin Mary appeared to him in a dream.", grammar: [g.trapassato-remoto, g.passato-remoto-irregular], vocab: [], note: "Reflexive and essere verbs use fu / furono: si fu addormentato." }
      - { es: "Non appena si fu destato, il re fece scavare sotto l'albero.", en: "As soon as he had woken up, the king had them dig under the tree.", grammar: [g.trapassato-remoto, g.fare-causative], vocab: [w.destarsi] }
      - { es: "Dopo che ebbe trovato il tesoro, decise di costruire il Duomo.", en: "After he had found the treasure, he decided to build the cathedral.", altEs: ["Dopo aver trovato il tesoro, decise di costruire il Duomo.", "Trovato il tesoro, decise di costruire il Duomo."], grammar: [g.trapassato-remoto], vocab: [], error: { wrong: "Dopo che ha trovato il tesoro, decise di costruire il Duomo.", explain: "With a passato remoto main verb (decise), the time clause after dopo che takes the trapassato remoto: ebbe trovato.", grammar: g.trapassato-remoto } }
      - { es: "D'un tratto la porta si aprì e un uomo irruppe nella stanza.", en: "Suddenly the door opened and a man burst into the room.", altEs: ["Ad un tratto la porta si aprì e un uomo irruppe nella stanza.", "All'improvviso la porta si aprì e un uomo irruppe nella stanza."], grammar: [g.passato-remoto-irregular], vocab: [w.dun-tratto, w.irrompere] }
      - { es: "Si voltò, impallidì e uscì senza dire una parola.", en: "She turned round, went pale and left without saying a word.", altEs: ["Si girò, impallidì e uscì senza dire una parola."], grammar: [g.passato-remoto-forms], vocab: [w.voltarsi, w.impallidire] }
      - { es: "Finì di cenare e uscì.", en: "He finished dinner and went out.", grammar: [g.trapassato-remoto], vocab: [], transform: { instruction: "Link the two actions with appena + trapassato remoto", answer: "Appena ebbe finito di cenare, uscì.", alt: ["Non appena ebbe finito di cenare, uscì.", "Dopo che ebbe finito di cenare, uscì."], en: "As soon as he had finished dinner, he went out." } }
      - { es: "Quando ebbe letto la lettera, sospirò e la bruciò.", en: "When she had read the letter, she sighed and burned it.", grammar: [g.trapassato-remoto], vocab: [w.sospirare], transform: { instruction: "Make it sound modern with a past participle clause", answer: "Letta la lettera, sospirò e la bruciò.", alt: ["Dopo aver letto la lettera, sospirò e la bruciò."], en: "Having read the letter, she sighed and burned it." } }
      - { es: "Lei arrossì, si chinò a raccogliere il fazzoletto e svanì tra la folla.", en: "She blushed, bent down to pick up the handkerchief and vanished into the crowd.", grammar: [g.passato-remoto-forms], vocab: [w.arrossire, w.chinarsi, w.svanire] }
      - { es: "Il vecchio scrutò l'orizzonte a lungo; di lì a poco scorse una vela.", en: "The old man scanned the horizon for a long time; shortly afterwards he made out a sail.", grammar: [g.passato-remoto-irregular], vocab: [w.scrutare, w.orizzonte, w.di-lì-a-poco, w.scorgere] }
      - { es: "Allorché ebbe compreso l'inganno, si precipitò fuori.", en: "When he had grasped the deception, he rushed outside.", altEs: ["Quando ebbe capito l'inganno, si precipitò fuori."], grammar: [g.trapassato-remoto], vocab: [w.allorché, w.inganno, w.precipitarsi] }
      - { es: "Indugiò un attimo sulla soglia, poi si avviò verso il chiostro.", en: "He lingered a moment on the threshold, then set off towards the cloister.", grammar: [g.passato-remoto-forms], vocab: [w.indugiare, w.soglia, w.avviarsi] }
      - { es: "Ad un tratto le balenò un'idea: il tesoro era sotto il carrubo!", en: "All of a sudden an idea flashed into her mind: the treasure was under the carob tree!", altEs: ["D'un tratto le balenò un'idea: il tesoro era sotto il carrubo!"], grammar: [g.passato-remoto-forms], vocab: [w.ad-un-tratto, w.balenare] }
      - { es: "Mi fissò a lungo, poi trasalì come se avesse visto un fantasma.", en: "He stared at me for a long time, then gave a start as if he had seen a ghost.", grammar: [g.passato-remoto-forms, g.come-se], vocab: [w.fissare, w.trasalire, w.fantasma] }
      - { es: "La mattina seguente si recò a Monreale e si diresse subito al Duomo.", en: "The next morning she went to Monreale and headed straight for the cathedral.", grammar: [g.passato-remoto-irregular], vocab: [w.recarsi, w.dirigersi] }
      - { es: "Mentre si accingeva a partire, sentì bussare e sussultò.", en: "As he was about to leave, he heard a knock and jumped.", altEs: ["Mentre si apprestava a partire, sentì bussare e sussultò."], grammar: [g.passato-remoto-forms, g.mentre-quando], vocab: [w.accingersi, w.bussare, w.sussultare] }
    exchanges:
      - q: { es: "Che cosa fece il re appena si fu svegliato?", en: "What did the king do as soon as he had woken up?" }
        a: { es: "Fece scavare sotto il carrubo e trovò il tesoro.", en: "He had them dig under the carob tree and found the treasure." }
        alt: ["Fece scavare sotto l'albero.", "Cercò il tesoro."]
        grammar: [g.trapassato-remoto, g.fare-causative]
        vocab: [w.carrubo]
      - q: { es: "Perché la ragazza arrossì?", en: "Why did the girl blush?" }
        a: { es: "Perché, appena l'ebbe visto, capì che lui l'aveva riconosciuta.", en: "Because, as soon as she had seen him, she understood that he had recognised her." }
        alt: ["Perché lui l'aveva riconosciuta.", "Perché capì di essere stata riconosciuta."]
        grammar: [g.trapassato-remoto, g.trapassato-prossimo]
        vocab: [w.arrossire]
      - q: { es: "Come finisce il racconto?", en: "How does the story end?" }
        a: { es: "Dopo che ebbero cenato, i monaci si apprestarono a dormire e nessuno parlò più del tesoro.", en: "After they had dined, the monks got ready for bed and nobody spoke of the treasure again." }
        alt: ["I monaci andarono a dormire.", "Nessuno parlò più del tesoro."]
        grammar: [g.trapassato-remoto]
        vocab: [w.apprestarsi, w.monaco]
      - q: { es: "Si usa ancora il trapassato remoto?", en: "Is the trapassato remoto still used?" }
        a: { es: "Quasi solo nei romanzi; parlando diciamo «dopo aver finito».", en: "Almost only in novels; when speaking we say «dopo aver finito»." }
        alt: ["Solo nella lingua letteraria.", "Pochissimo, quasi solo per scritto."]
        grammar: [g.trapassato-remoto, g.past-infinitive]
        vocab: []
      - q: { es: "Che cosa vide il pescatore all'alba?", en: "What did the fisherman see at dawn?" }
        a: { es: "Scorse una vela all'orizzonte e si precipitò al porto.", en: "He made out a sail on the horizon and rushed to the harbour." }
        alt: ["Una vela all'orizzonte.", "Vide una barca e corse al porto."]
        grammar: [g.passato-remoto-irregular]
        vocab: [w.orizzonte, w.precipitarsi]
    texts:
      - title: "La leggenda del Duomo di Monreale"
        es: ["Un giorno Guglielmo II andò a caccia nei boschi sopra Palermo.", "Appena si fu addormentato sotto un carrubo, la Madonna gli apparve in sogno.", "Gli rivelò che sotto l'albero c'era un tesoro nascosto.", "Quando l'ebbe trovato, il re lo usò per costruire il Duomo."]
        en: ["One day William II went hunting in the woods above Palermo.", "As soon as he had fallen asleep under a carob tree, the Virgin appeared to him in a dream.", "She revealed to him that there was a hidden treasure under the tree.", "When he had found it, the king used it to build the cathedral."]
        grammar: [g.trapassato-remoto, g.passato-remoto-irregular]
        vocab: [w.caccia, w.carrubo]
      - title: "Inizio di un racconto"
        es: ["Era una notte senza luna.", "Non appena ebbe chiuso la porta, sentì un passo nel corridoio.", "Si voltò di scatto: non c'era nessuno."]
        en: ["It was a moonless night.", "No sooner had she shut the door than she heard a footstep in the corridor.", "She spun round: there was nobody there."]
        grammar: [g.trapassato-remoto]
        vocab: [w.voltarsi, w.di-scatto]
    spicy:
      - { es: "Appena ebbe visto il conto, il mio cavaliere svanì nella notte.", en: "As soon as he had seen the bill, my knight vanished into the night.", grammar: [g.trapassato-remoto], vocab: [w.svanire] }
      - { es: "Non appena si fu seduto accanto a me, dimenticai tutto il mio italiano.", en: "No sooner had he sat down next to me than I forgot all my Italian.", grammar: [g.trapassato-remoto], vocab: [] }
      - { es: "Dopo che mi ebbe fissato a lungo, sospirò e disse: «Hai del pistacchio sul naso».", en: "After he had stared at me for a long time, he sighed and said: «You've got pistachio on your nose».", grammar: [g.trapassato-remoto], vocab: [w.fissare, w.sospirare, w.pistacchio] }
      - { es: "Arrossii, mi voltai e finsi di guardare i mosaici.", en: "I blushed, turned round and pretended to look at the mosaics.", grammar: [g.passato-remoto-irregular], vocab: [w.arrossire, w.voltarsi] }
      - { es: "Quando ebbe finito la sua serenata, tutto il palazzo applaudì e io feci finta di dormire.", en: "When he had finished his serenade, the whole building applauded and I pretended to be asleep.", grammar: [g.trapassato-remoto], vocab: [w.serenata] }
dialogues:
  - id: c1.u02.d1
    title: Davanti al Duomo di Monreale
    context: Fortunato, a local guide, tells the story of the cathedral to Giuditta, a visitor who has just arrived.
    lines:
      - { speaker: Fortunato, es: "Benvenuta a Monreale. Il Duomo fu fondato da Guglielmo II nel 1174.", en: "Welcome to Monreale. The cathedral was founded by William II in 1174." }
      - { speaker: Giuditta, es: "Ho letto che lo costruì grazie a un tesoro. È vero?", en: "I read that he built it thanks to a treasure. Is that true?" }
      - { speaker: Fortunato, es: "Così narra la leggenda. Un giorno il re andò a caccia e si addormentò sotto un carrubo.", en: "So the legend goes. One day the king went hunting and fell asleep under a carob tree." }
      - { speaker: Giuditta, es: "E poi che cosa successe?", en: "And then what happened?" }
      - { speaker: Fortunato, es: "Appena si fu addormentato, gli apparve la Madonna e gli disse dove scavare.", en: "As soon as he had fallen asleep, the Virgin appeared to him and told him where to dig." }
      - { speaker: Giuditta, es: "Bella storia! Ma gli storici che cosa dicono?", en: "Lovely story! But what do the historians say?" }
      - { speaker: Fortunato, es: "Che il re volle una chiesa più potente della cattedrale dell'arcivescovo di Palermo.", en: "That the king wanted a church more powerful than the Archbishop of Palermo's cathedral." }
      - { speaker: Giuditta, es: "Io invece stamattina ho perso il pullman e sono arrivata a piedi da Palermo!", en: "As for me, this morning I missed the coach and walked all the way from Palermo!" }
      - { speaker: Fortunato, es: "A piedi? Ai tempi dei Normanni lo facevano tutti. Lei è una pellegrina moderna!", en: "On foot? In Norman times everybody did it. You're a modern pilgrim!" }
      - { speaker: Giuditta, es: "Allora mi merito un cannolo, prima di salire sul tetto.", en: "Then I deserve a cannolo before I climb up onto the roof." }
    questions:
      - { q: "Chi fondò il Duomo di Monreale?", options: ["Ruggero II", "Guglielmo II", "Garibaldi"], answer: 1, explain: "Il Duomo fu fondato da Guglielmo II nel 1174." }
      - { q: "Secondo la leggenda, dove si addormentò il re?", options: ["Sotto un carrubo", "Nel chiostro", "Sul tetto del Duomo"], answer: 0, explain: "Si addormentò sotto un carrubo, dopo la caccia." }
      - { q: "Perché Giuditta usa il passato prossimo per il suo viaggio?", options: ["Perché è successo stamattina", "Perché è una leggenda", "Perché è siciliana"], answer: 0, explain: "A recent event still linked to the present takes the passato prossimo: ho perso, sono arrivata." }
      - { q: "Come è arrivata Giuditta a Monreale?", options: ["In pullman", "A piedi", "In treno"], answer: 1, explain: "She missed the coach and walked from Palermo." }
writing:
  - task: "Write a short biography, in the passato remoto, of William II of Sicily, the king who built Monreale cathedral (or another historical figure linked to Sicily)."
    min: 110
    max: 180
    use: [w.sovrano, w.fondare, w.monaco, w.benedettino, w.rivestire]
    grammar: [g.passato-remoto-forms, g.passato-remoto-irregular]
    expect:
      - { pattern: "\\b(fu|furono|ebbe|ebbero|nacque|morì|fondò|divenne|fece|decise|volle|venne|regnò|salì|sposò|diede|lasciò|costruì|ordinò|chiamò|arrivò|cominciarono|rivestirono|governò)(?![a-zà-ù])", hint: "Use the passato remoto: nacque, salì al trono, fondò, morì…" }
    model: { es: "Guglielmo II d'Altavilla, detto il Buono, nacque a Palermo nel 1153. Diventò re quando era ancora un bambino, e per alcuni anni il regno fu governato da sua madre. Quando fu più grande, il giovane sovrano decise di costruire una grande cattedrale sulla collina di Monreale, perché voleva una chiesa che fosse più bella di quelle di Palermo. I lavori cominciarono nel 1174 e furono terminati in pochi anni. Il re chiamò i migliori artisti bizantini, che rivestirono le pareti di mosaici d'oro. Accanto al Duomo fondò anche un monastero per i monaci benedettini. Guglielmo sposò Giovanna d'Inghilterra, ma non ebbe figli. Morì molto giovane nel 1189 e fu sepolto proprio nella sua cattedrale.", en: "William II of Hauteville, known as the Good, was born in Palermo in 1153. He became king when he was still a child, and for some years the kingdom was governed by his mother. When he was older, the young sovereign decided to build a great cathedral on the hill of Monreale, because he wanted a church that would be more beautiful than those of Palermo. Work began in 1174 and was finished within a few years. The king called in the best Byzantine artists, who covered the walls with gold mosaics. Beside the cathedral he also founded a monastery for Benedictine monks. William married Joan of England, but had no children. He died very young in 1189 and was buried in his own cathedral." }
  - task: "Write the dramatic climax of a historical narrative in the passato remoto: Garibaldi and the Thousand landing in Sicily in 1860. Use at least one cleft sentence with fu allora che…"
    min: 110
    max: 180
    use: [w.sbarcare, w.scorgere, w.giungere, w.fu-allora-che, w.unificazione]
    grammar: [g.passato-remoto-irregular, g.passato-remoto-forms]
    expect:
      - { pattern: "fu allora che|fu in quel momento che|fu così che", hint: "Mark the turning point: Fu allora che…" }
