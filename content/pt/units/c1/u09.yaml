id: c1.u09
title: "Mídia e jornalismo"
lessons:
  - id: c1.u09.l1
    title: O lide e o furo
    teach: [g.journalistic-language]
    vocab: [w.lide, w.furo, w.apuração, w.apurar, w.checagem, w.checar, w.anonimato, w.em-off, w.sigilo, w.sigiloso, w.vazar, w.escândalo, w.propina, w.desvio-de-verbas, w.cpi, w.operação, w.deflagrar, w.indiciar, w.delação-premiada, w.supostamente, w.alegadamente, w.búfalo, w.delegado, w.criminoso, w.envolvido, w.encalhar, w.ferimento, w.anônimo, w.devidamente]
    tip: "In the press, teria + participle means 'allegedly' (O suspeito teria fugido), and para + person means 'in X's view' (Para o delegado, …). Acronyms take articles in the body of the text: a PF, o STF."
    sentences:
      - { es: "Um incêndio atingiu na madrugada de ontem uma fazenda de búfalos em Soure, no Marajó.", en: "A fire hit a buffalo farm in Soure, on Marajó, in the early hours of yesterday.", altEs: ["Na madrugada de ontem, um incêndio atingiu uma fazenda de búfalos em Soure, no Marajó."], grammar: [g.journalistic-language, g.subordination-complex], vocab: [w.incêndio, w.atingir, w.madrugada, w.búfalo], note: "A typical lead: what, where and when in the first sentence." }
      - { es: "Para o delegado, o incêndio foi criminoso.", en: "In the police chief's view, the fire was arson.", altEs: ["Na opinião do delegado, o incêndio foi criminoso."], altEn: ["According to the police chief, the fire was started deliberately."], grammar: [g.journalistic-language], vocab: [w.delegado, w.criminoso], note: "Para + person in the press = in X's view, not 'for'." }
      - { es: "O prefeito teria recebido propina de uma empresa de transporte fluvial.", en: "The mayor allegedly received a bribe from a river transport company.", altEs: ["O prefeito supostamente recebeu propina de uma empresa de transporte fluvial.", "O prefeito alegadamente recebeu propina de uma empresa de transporte fluvial."], grammar: [g.journalistic-language, g.conditional-perfect], vocab: [w.propina, w.empresa, w.fluvial], variant: "In Portugal propina means university tuition fees; a bribe is um suborno." }
      - { es: "O jornal deu o furo: a operação da PF foi deflagrada às seis da manhã.", en: "The paper got the scoop: the Federal Police operation was launched at six in the morning.", grammar: [g.journalistic-language, g.passive-ser], vocab: [w.furo, w.operação, w.deflagrar] }
      - { es: "Antes de publicar, a redação fez a checagem de todos os dados.", en: "Before publishing, the newsroom fact-checked all the data.", altEs: ["Antes de publicar, a redação checou todos os dados."], grammar: [g.journalistic-language], vocab: [w.redação, w.checagem, w.dado] }
      - { es: "A fonte pediu anonimato e falou em off com a repórter.", en: "The source asked for anonymity and spoke to the reporter off the record.", altEs: ["A fonte pediu anonimato e conversou em off com a repórter."], grammar: [g.journalistic-language], vocab: [w.fonte, w.anonimato, w.em-off, w.repórter] }
      - { es: "Os documentos sigilosos vazaram para a imprensa na véspera da votação.", en: "The confidential documents were leaked to the press on the eve of the vote.", altEs: ["Os documentos sigilosos vazaram para a imprensa um dia antes da votação."], grammar: [g.journalistic-language], vocab: [w.sigiloso, w.vazar, w.véspera, w.votação] }
      - { es: "O ex-secretário foi indiciado por desvio de verbas da saúde.", en: "The former secretary was indicted for embezzling health funds.", grammar: [g.journalistic-language, g.passive-ser], vocab: [w.indiciar, w.desvio-de-verbas, w.saúde] }
      - { es: "A CPI vai ouvir os envolvidos no escândalo na semana que vem.", en: "The parliamentary inquiry will hear those involved in the scandal next week.", altEs: ["A CPI vai ouvir os envolvidos no escândalo na próxima semana."], grammar: [g.journalistic-language], vocab: [w.cpi, w.envolvido, w.escândalo], note: "CPI = Comissão Parlamentar de Inquérito." }
      - { es: "Em delação premiada, o empresário teria citado três deputados.", en: "In a plea bargain, the businessman allegedly named three congressmen.", altEs: ["Na delação premiada, o empresário teria citado três deputados."], grammar: [g.journalistic-language, g.conditional-perfect], vocab: [w.delação-premiada, w.empresário, w.citar, w.deputado] }
      - { es: "O suspeito, que alegadamente fugiu de barco, ainda não foi encontrado.", en: "The suspect, who allegedly fled by boat, has not yet been found.", altEs: ["O suspeito, que supostamente fugiu de barco, ainda não foi encontrado.", "O suspeito, que teria fugido de barco, ainda não foi encontrado."], grammar: [g.journalistic-language, g.subordination-complex], vocab: [w.alegadamente, w.suspeito, w.fugir] }
      - { es: "A apuração do caso levou meses e envolveu dezenas de entrevistas.", en: "The investigation into the case took months and involved dozens of interviews.", grammar: [g.journalistic-language], vocab: [w.apuração, w.entrevista, w.envolver] }
      - { es: "O lide responde às perguntas básicas: o quê, quem, quando, onde, como e por quê.", en: "The lead answers the basic questions: what, who, when, where, how and why.", grammar: [g.journalistic-language], vocab: [w.lide, w.básico] }
      - { es: "A PF prendeu dois suspeitos em Breves.", en: "The Federal Police arrested two suspects in Breves.", altEs: ["A Polícia Federal prendeu dois suspeitos em Breves."], grammar: [g.journalistic-language], vocab: [w.prender, w.suspeito], error: { wrong: "PF prendeu dois suspeitos em Breves.", explain: "In the body of a news story, acronyms take an article like any noun: a PF, o STF, o IBGE. Only headlines drop it.", grammar: g.journalistic-language } }
      - { es: "O suspeito fugiu, de acordo com testemunhas.", en: "The suspect fled, according to witnesses.", grammar: [g.journalistic-language], vocab: [w.testemunha], transform: { instruction: "Report it as an allegation with teria and segundo", answer: "Segundo testemunhas, o suspeito teria fugido.", alt: ["O suspeito teria fugido, segundo testemunhas.", "Segundo as testemunhas, o suspeito teria fugido."], en: "According to witnesses, the suspect allegedly fled." } }
      - { es: "A polícia diz que ninguém ficou ferido.", en: "The police say nobody was injured.", grammar: [g.journalistic-language], vocab: [w.polícia, w.ferido], transform: { instruction: "Start the sentence with segundo", answer: "Segundo a polícia, ninguém ficou ferido.", alt: ["De acordo com a polícia, ninguém ficou ferido.", "Conforme a polícia, ninguém ficou ferido."] } }
    exchanges:
      - q: { es: "Quem deu o furo sobre o escândalo?", en: "Who broke the story about the scandal?" }
        a: { es: "Um jornal de Belém, depois de seis meses de apuração.", en: "A Belém newspaper, after six months of investigation." }
        alt: ["Um jornal de Belém.", "Uma repórter de Belém."]
        grammar: [g.journalistic-language]
        vocab: [w.furo, w.escândalo, w.apuração]
      - q: { es: "A fonte vai aparecer na matéria?", en: "Will the source appear in the article?" }
        a: { es: "Não, falou em off; o nome dela fica em sigilo.", en: "No, she spoke off the record; her name stays confidential." }
        alt: ["Não, pediu anonimato.", "Não, falou em off."]
        grammar: [g.journalistic-language]
        vocab: [w.em-off, w.sigilo, w.matéria]
      - q: { es: "Por que a notícia diz “teria recebido”?", en: "Why does the story say “teria recebido”?" }
        a: { es: "Porque é uma acusação que ainda não foi provada.", en: "Because it's an accusation that hasn't been proved yet." }
        alt: ["Porque ainda não está provado.", "Porque é só uma suspeita."]
        grammar: [g.journalistic-language, g.conditional-perfect]
        vocab: [w.acusação, w.provar]
      - q: { es: "Você checou essa informação?", en: "Did you check this information?" }
        a: { es: "Chequei com duas fontes independentes antes de publicar.", en: "I checked it with two independent sources before publishing." }
        alt: ["Chequei, sim.", "Ainda não, estou apurando."]
        grammar: [g.journalistic-language]
        vocab: [w.checar, w.independente, w.fonte]
      - q: { es: "O que aconteceu com o ex-prefeito?", en: "What happened to the former mayor?" }
        a: { es: "Foi indiciado por desvio de verbas e agora negocia uma delação premiada.", en: "He was indicted for embezzlement and is now negotiating a plea bargain." }
        alt: ["Foi indiciado.", "Está negociando uma delação premiada."]
        grammar: [g.journalistic-language, g.passive-ser]
        vocab: [w.indiciar, w.desvio-de-verbas, w.delação-premiada]
    texts:
      - title: "Lide de uma notícia"
        es: ["Um barco que levava quarenta passageiros de Belém a Soure encalhou na madrugada desta terça-feira na baía do Marajó.", "Segundo a Capitania dos Portos, todos foram resgatados sem ferimentos."]
        en: ["A boat carrying forty passengers from Belém to Soure ran aground in the early hours of this Tuesday in Marajó Bay.", "According to the Port Authority, everyone was rescued without injury."]
        grammar: [g.journalistic-language]
        vocab: [w.encalhar, w.resgatar, w.ferimento]
      - title: "Nota da redação"
        es: ["Ao contrário do que foi publicado ontem, o prefeito não foi indiciado.", "A informação, vazada por uma fonte anônima, não foi devidamente checada.", "Pedimos desculpas aos leitores."]
        en: ["Contrary to what was published yesterday, the mayor has not been indicted.", "The information, leaked by an anonymous source, was not properly checked.", "We apologise to our readers."]
        grammar: [g.journalistic-language, g.passive-ser]
        vocab: [w.indiciar, w.vazar, w.anônimo, w.checar]
    spicy:
      - { es: "Segundo fontes próximas, você teria dito à sua irmã que eu sou “bonitinho”. Confirma?", en: "According to sources close to you, you allegedly told your sister I'm “cute”. Do you confirm?", altEs: ["Segundo fontes próximas, você teria dito para a sua irmã que eu sou “bonitinho”. Confirma?"], grammar: [g.journalistic-language, g.conditional-perfect], vocab: [w.fonte, w.próximo] }
      - { es: "Vou te dar um furo: hoje à noite eu estou livre.", en: "I'll give you a scoop: tonight I'm free.", altEs: ["Vou te dar um furo: hoje à noite estou livre."], grammar: [g.journalistic-language], vocab: [w.furo, w.livre] }
      - { es: "Em off: o seu sorriso é o maior escândalo desta redação.", en: "Off the record: your smile is the biggest scandal in this newsroom.", altEs: ["Cá entre nós: o seu sorriso é o maior escândalo desta redação."], grammar: [g.journalistic-language], vocab: [w.em-off, w.escândalo, w.sorriso] }
      - { es: "Fiz a checagem: você é solteiro, adora carimbó e não tem compromisso no sábado.", en: "I've fact-checked it: you're single, you love carimbó and you've got no plans on Saturday.", altEs: ["Fiz a checagem: você está solteiro, adora carimbó e não tem compromisso no sábado."], grammar: [g.journalistic-language], vocab: [w.checagem, w.solteiro, w.compromisso] }
      - { es: "Não precisa de delação premiada: confesso que fiquei olhando para você a festa inteira.", en: "No need for a plea bargain: I confess I spent the whole party looking at you.", altEs: ["Nem precisa de delação premiada: confesso que fiquei olhando você a festa inteira."], grammar: [g.journalistic-language], vocab: [w.delação-premiada, w.confessar] }

  - id: c1.u09.l2
    title: Manchetes
    teach: [g.headlines]
    vocab: [w.isolar, w.combate, w.intensificar, w.cenário, w.premiado, w.sessão, w.plenário, w.sancionar, w.vetar, w.veto, w.projeto-de-lei, w.medida-provisória, w.votação, w.urna, w.segundo-turno, w.candidatura, w.mandato, w.reeleição, w.oposição, w.coalizão, w.renúncia, w.eleitoral, w.opinião-pública, w.sondagem, w.polarização, w.manguezal, w.tarifa, w.patrulha, w.marajoara, w.indicação-geográfica, w.fechamento, w.unanimidade]
    tip: "Read headlines as telegrams: the present means the past (Governo anuncia = announced), deve + infinitive means 'is expected to', articles disappear, and a bare participle is a passive (Preso suspeito = suspect arrested)."
    sentences:
      - { es: "Seca histórica isola comunidades no Marajó", en: "Historic drought cuts off communities on Marajó", altEn: ["Historic drought isolates communities on Marajó"], grammar: [g.headlines], vocab: [w.seca, w.isolar, w.comunidade], note: "Present tense for a past event; no article." }
      - { es: "Presidente sanciona lei de proteção aos manguezais", en: "President signs mangrove protection law", altEn: ["President signs law protecting mangroves"], grammar: [g.headlines], vocab: [w.sancionar, w.lei, w.manguezal] }
      - { es: "Câmara vota hoje projeto de lei sobre transporte fluvial", en: "Chamber votes today on river transport bill", grammar: [g.headlines], vocab: [w.projeto-de-lei, w.votar, w.fluvial] }
      - { es: "Governador deve vetar aumento da tarifa das balsas", en: "Governor expected to veto ferry fare rise", altEn: ["Governor likely to veto increase in ferry fares"], grammar: [g.headlines], vocab: [w.vetar, w.tarifa, w.balsa], note: "Deve + infinitive in a headline = is expected to." }
      - { es: "Polícia montada em búfalos intensifica patrulhas em Soure", en: "Buffalo-mounted police step up patrols in Soure", grammar: [g.headlines], vocab: [w.intensificar, w.patrulha, w.búfalo] }
      - { es: "Prefeito anuncia renúncia; oposição pede novas eleições", en: "Mayor announces resignation; opposition calls for new elections", grammar: [g.headlines], vocab: [w.renúncia, w.oposição, w.eleição] }
      - { es: "Queijo do Marajó ganha selo de indicação geográfica", en: "Marajó cheese wins geographical indication label", grammar: [g.headlines], vocab: [w.queijo, w.indicação-geográfica], note: "Marajó cheese, made from buffalo milk, received its geographical indication in 2021." }
      - { es: "Documentário premiado mostra a cerâmica marajoara", en: "Award-winning documentary showcases Marajoara pottery", grammar: [g.headlines], vocab: [w.premiado, w.documentário, w.cerâmica] }
      - { es: "Na manchete, o presente indica um fato passado: “Governo anuncia” quer dizer “o governo anunciou”.", en: "In a headline, the present indicates a past event: “Governo anuncia” means “the government announced”.", grammar: [g.headlines], vocab: [w.manchete, w.fato] }
      - { es: "A sondagem mostra o candidato da oposição na frente para o segundo turno.", en: "The poll shows the opposition candidate ahead for the run-off.", altEs: ["A pesquisa mostra o candidato da oposição na frente para o segundo turno."], grammar: [g.headlines, g.journalistic-language], vocab: [w.sondagem, w.candidato, w.segundo-turno], variant: "In Brazil an opinion poll is usually uma pesquisa; sondagem is more formal and common in Portugal." }
      - { es: "Com a polarização, a coalizão do governo perdeu apoio no plenário.", en: "With the polarisation, the government coalition lost support on the floor.", grammar: [g.headlines, g.journalistic-language], vocab: [w.polarização, w.coalizão, w.plenário, w.apoio], variant: "In Portugal: coligação." }
      - { es: "A candidatura à reeleição foi registrada no último dia do prazo.", en: "The bid for re-election was registered on the last day of the deadline.", grammar: [g.journalistic-language, g.passive-ser], vocab: [w.candidatura, w.reeleição, w.prazo] }
      - { es: "A medida provisória perde a validade se não for votada em cento e vinte dias.", en: "A provisional measure loses its validity if it is not voted on within a hundred and twenty days.", grammar: [g.journalistic-language, g.future-subjunctive-se], vocab: [w.medida-provisória, w.validade] }
      - { es: "Presos dois suspeitos de pesca ilegal em Soure", en: "Two suspects arrested for illegal fishing in Soure", grammar: [g.headlines, g.absolute-participle], vocab: [w.preso, w.suspeito], error: { wrong: "Preso dois suspeitos de pesca ilegal em Soure", explain: "The bare participle in a headline still agrees with its noun: presos dois suspeitos.", grammar: g.headlines } }
      - { es: "O governo anunciou ontem um novo plano para a região.", en: "The government announced a new plan for the region yesterday.", grammar: [g.headlines], vocab: [w.anunciar, w.plano], transform: { instruction: "Turn it into a headline", answer: "Governo anuncia novo plano para a região", alt: ["Governo anuncia plano para a região", "Governo anuncia novo plano para região"], en: "Government announces new plan for the region" } }
      - { es: "A polícia prendeu um suspeito de garimpo ilegal.", en: "The police arrested a suspect for illegal mining.", grammar: [g.headlines], vocab: [w.garimpo, w.prender], transform: { instruction: "Write it as a headline with a bare participle", answer: "Preso suspeito de garimpo ilegal", alt: ["Polícia prende suspeito de garimpo ilegal"], en: "Suspect arrested for illegal mining" } }
    exchanges:
      - q: { es: "O que quer dizer “Governo anuncia novo plano”?", en: "What does “Governo anuncia novo plano” mean?" }
        a: { es: "Que o governo já anunciou: nas manchetes, o presente vale pelo passado.", en: "That the government has already announced it: in headlines, the present stands for the past." }
        alt: ["Que o governo anunciou um plano.", "O governo já anunciou."]
        grammar: [g.headlines]
        vocab: [w.manchete, w.anunciar]
      - q: { es: "Quem ganhou a votação no plenário?", en: "Who won the vote on the floor?" }
        a: { es: "A oposição, por três votos; o governo já fala em veto.", en: "The opposition, by three votes; the government is already talking about a veto." }
        alt: ["A oposição.", "Ganhou a oposição, por pouco."]
        grammar: [g.journalistic-language]
        vocab: [w.votação, w.plenário, w.veto]
      - q: { es: "A que horas abrem as urnas?", en: "What time do the polls open?" }
        a: { es: "Às oito da manhã; a apuração começa logo depois do fechamento, às cinco da tarde.", en: "At eight in the morning; the count starts right after closing, at five in the afternoon." }
        alt: ["Às oito da manhã.", "Das oito às cinco."]
        grammar: [g.journalistic-language]
        vocab: [w.urna, w.apuração, w.fechamento]
      - q: { es: "O prefeito vai tentar a reeleição?", en: "Is the mayor going to run for re-election?" }
        a: { es: "Vai, mas o cenário eleitoral mudou muito desde o último mandato.", en: "He is, but the electoral landscape has changed a lot since his last term." }
        alt: ["Vai, sim.", "Ainda não decidiu."]
        grammar: [g.journalistic-language]
        vocab: [w.reeleição, w.cenário, w.eleitoral, w.mandato]
      - q: { es: "O que a opinião pública acha do projeto?", en: "What does public opinion make of the project?" }
        a: { es: "Está dividida, segundo a última sondagem.", en: "It's divided, according to the latest poll." }
        alt: ["Está dividida.", "A maioria apoia, segundo a pesquisa."]
        grammar: [g.journalistic-language]
        vocab: [w.opinião-pública, w.sondagem]
      - q: { es: "Qual é a prioridade da nova governadora?", en: "What is the new governor's priority?" }
        a: { es: "O combate ao garimpo ilegal, segundo o discurso de posse.", en: "The fight against illegal mining, according to her inauguration speech." }
        alt: ["O combate ao garimpo ilegal.", "A saúde e a educação."]
        grammar: [g.journalistic-language]
        vocab: [w.combate, w.garimpo, w.posse]
    texts:
      - title: "Primeira página"
        es: ["Seca isola comunidades no Marajó", "Câmara aprova projeto de lei das balsas; governador deve vetar", "Documentário premiado mostra a cerâmica marajoara"]
        en: ["Drought cuts off communities on Marajó", "Chamber passes ferry bill; governor expected to veto", "Award-winning documentary showcases Marajoara pottery"]
        grammar: [g.headlines]
        vocab: [w.isolar, w.vetar, w.premiado]
      - title: "Explicando as manchetes"
        es: ["“Câmara aprova projeto” quer dizer que a Câmara aprovou o projeto.", "“Governador deve vetar” quer dizer que se espera que ele vete.", "Nas manchetes, os artigos desaparecem para economizar espaço."]
        en: ["“Câmara aprova projeto” means that the Chamber passed the bill.", "“Governador deve vetar” means he is expected to veto it.", "In headlines, articles disappear to save space."]
        grammar: [g.headlines]
        vocab: [w.manchete, w.vetar]
    spicy:
      - { es: "Urgente: rapaz bonito é visto sozinho no bar; testemunhas pedem que alguém tome uma atitude", en: "Breaking: handsome young man seen alone at the bar; witnesses urge someone to take action", grammar: [g.headlines, g.subjunctive-wishes], vocab: [w.urgente, w.testemunha, w.atitude] }
      - { es: "Moradora de Soure diz que só aceita convite para jantar se for de búfalo", en: "Soure resident says she will only accept a dinner invitation if they go by buffalo", grammar: [g.headlines, g.future-subjunctive-se], vocab: [w.morador, w.convite, w.búfalo] }
      - { es: "Sondagem confirma: setenta por cento desta festa quer dançar com você", en: "Poll confirms: seventy per cent of this party wants to dance with you", altEs: ["Pesquisa confirma: setenta por cento desta festa quer dançar com você"], grammar: [g.headlines], vocab: [w.sondagem, w.confirmar] }
      - { es: "Plenário do meu coração aprova o seu nome por unanimidade", en: "The floor of my heart approves your name unanimously", altEs: ["Plenário do meu coração aprova seu nome por unanimidade"], grammar: [g.headlines], vocab: [w.plenário, w.unanimidade] }
      - { es: "Coalizão improvável: eu, você e uma rede na varanda", en: "Unlikely coalition: me, you and a hammock on the veranda", grammar: [g.headlines], vocab: [w.coalizão, w.improvável, w.varanda] }

  - id: c1.u09.l3
    title: — Vamos pegar a balsa — disse ela
    teach: [g.quotation]
    vocab: [w.editor, w.colunista, w.correspondente, w.âncora, w.telespectador, w.ouvinte, w.audiência, w.tiragem, w.boletim, w.ao-vivo, w.transmissão, w.transmitir, w.cobrir, w.veicular, w.veículo-de-comunicação, w.liberdade-de-imprensa, w.censura, w.censurar, w.ceramista, w.telejornal, w.montar, w.recorde, w.coluna, w.frágil, w.rodada, w.veículo, w.corte, w.entrevistado]
    tip: "Fiction marks speech with a dash and puts the reporting verb before its subject: — Não vou — disse ela. The press uses quotation marks and segundo, conforme, para or nas palavras de."
    sentences:
      - { es: "— Vamos pegar a balsa das seis — disse o pescador.", en: "\"Let's catch the six o'clock ferry,\" said the fisherman.", altEs: ["— Vamos pegar a balsa das seis — falou o pescador."], grammar: [g.quotation], vocab: [w.balsa, w.pescador] }
      - { es: "— E se chover? — perguntou ela, sem tirar os olhos do rio.", en: "\"And what if it rains?\" she asked, without taking her eyes off the river.", grammar: [g.quotation], vocab: [w.perguntar, w.chover] }
      - { es: "“O Marajó não pode esperar mais”, afirmou a governadora.", en: "\"Marajó can't wait any longer,\" the governor stated.", altEs: ["“O Marajó não pode mais esperar”, afirmou a governadora."], grammar: [g.quotation], vocab: [w.afirmar, w.governador], variant: "European print uses guillemets: «O Marajó não pode esperar mais», afirmou a governadora." }
      - { es: "A governadora afirmou que “o Marajó não pode esperar mais”.", en: "The governor stated that “Marajó can't wait any longer”.", grammar: [g.quotation, g.reported-speech-present], vocab: [w.afirmar] }
      - { es: "Nas palavras da ceramista, cada desenho marajoara conta uma história.", en: "In the potter's words, every Marajoara design tells a story.", grammar: [g.quotation], vocab: [w.ceramista, w.desenho] }
      - { es: "Para o correspondente, a cobertura nacional ignora a ilha.", en: "In the correspondent's view, national coverage ignores the island.", grammar: [g.quotation, g.journalistic-language], vocab: [w.correspondente, w.cobertura, w.ignorar] }
      - { es: "A âncora do telejornal entrou ao vivo de Soure, montada num búfalo.", en: "The news anchor went live from Soure, riding a buffalo.", grammar: [g.quotation, g.journalistic-language], vocab: [w.âncora, w.telejornal, w.ao-vivo] }
      - { es: "O boletim da manhã é transmitido pela rádio local para a ilha inteira.", en: "The morning bulletin is broadcast by the local radio station to the whole island.", altEs: ["O boletim da manhã é transmitido pela rádio local para toda a ilha."], grammar: [g.journalistic-language, g.passive-ser], vocab: [w.boletim, w.transmitir, w.rádio] }
      - { es: "Os ouvintes ligam para a rádio para avisar quando a balsa atrasa.", en: "Listeners phone the radio station to let people know when the ferry is late.", grammar: [g.journalistic-language], vocab: [w.ouvinte, w.avisar, w.atrasar] }
      - { es: "O programa bateu recorde de audiência entre os telespectadores do Norte.", en: "The programme broke the audience record among viewers in the North.", grammar: [g.journalistic-language], vocab: [w.audiência, w.telespectador, w.recorde] }
      - { es: "A tiragem do jornal caiu, mas o site nunca teve tantos leitores.", en: "The newspaper's print run has fallen, but the website has never had so many readers.", grammar: [g.journalistic-language], vocab: [w.tiragem, w.site, w.leitor] }
      - { es: "Durante a ditadura, a censura cortava trechos inteiros das reportagens.", en: "During the dictatorship, the censors cut whole passages from news reports.", grammar: [g.journalistic-language, g.imperfect], vocab: [w.ditadura, w.censura, w.reportagem] }
      - { es: "O editor cortou dois parágrafos e marcou com [sic] um erro do entrevistado.", en: "The editor cut two paragraphs and marked an error made by the interviewee with [sic].", grammar: [g.quotation], vocab: [w.editor, w.parágrafo, w.entrevistado] }
      - { es: "— Não vou — disse ela.", en: "\"I'm not going,\" she said.", altEs: ["— Eu não vou — disse ela."], grammar: [g.quotation], vocab: [w.dizer], error: { wrong: "— Não vou — ela disse.", explain: "After a quotation in written narrative, the reporting verb comes first: disse ela.", grammar: g.quotation } }
      - { es: "O pescador disse: “O rio está subindo”.", en: "The fisherman said, \"The river is rising.\"", grammar: [g.quotation], vocab: [w.subir], transform: { instruction: "Rewrite it as dialogue in fiction, with dashes", answer: "— O rio está subindo — disse o pescador.", alt: ["— O rio está subindo — falou o pescador."] } }
      - { es: "“Não haverá cortes”, disse o ministro.", en: "\"There will be no cuts,\" said the minister.", grammar: [g.quotation, g.reported-speech-past], vocab: [w.corte, w.ministro], transform: { instruction: "Report it in indirect speech", answer: "O ministro disse que não haveria cortes.", alt: ["O ministro afirmou que não haveria cortes.", "O ministro disse que não ia haver cortes."], en: "The minister said there would be no cuts." } }
    exchanges:
      - q: { es: "Como se marca a fala de um personagem num romance brasileiro?", en: "How do you mark a character's speech in a Brazilian novel?" }
        a: { es: "Com um travessão, e o verbo vem antes do sujeito: “disse ela”.", en: "With a dash, and the verb comes before the subject: “disse ela”." }
        alt: ["Com travessão.", "Com um traço no começo da linha."]
        grammar: [g.quotation]
        vocab: [w.personagem, w.romance]
      - q: { es: "Quem vai cobrir o festival de Soure?", en: "Who's going to cover the Soure festival?" }
        a: { es: "A nossa correspondente em Belém; a transmissão começa às oito.", en: "Our correspondent in Belém; the broadcast starts at eight." }
        alt: ["A correspondente de Belém.", "Ainda não sabemos."]
        grammar: [g.journalistic-language]
        vocab: [w.cobrir, w.correspondente, w.transmissão]
      - q: { es: "Você leu a coluna de domingo?", en: "Did you read Sunday's column?" }
        a: { es: "Li. Para a colunista, a liberdade de imprensa no interior ainda é frágil.", en: "I did. In the columnist's view, press freedom in the interior is still fragile." }
        alt: ["Li, sim.", "Ainda não, vou ler hoje."]
        grammar: [g.quotation, g.journalistic-language]
        vocab: [w.colunista, w.liberdade-de-imprensa, w.frágil]
      - q: { es: "Por que o governo quis censurar a reportagem?", en: "Why did the government want to censor the report?" }
        a: { es: "Porque ela mostrava os documentos do contrato das balsas.", en: "Because it showed the documents from the ferry contract." }
        alt: ["Por causa dos documentos.", "Porque era sobre o contrato das balsas."]
        grammar: [g.journalistic-language]
        vocab: [w.censurar, w.reportagem, w.contrato]
      - q: { es: "Que veículos de comunicação chegam à ilha?", en: "Which media outlets reach the island?" }
        a: { es: "Basicamente a rádio, a televisão e o celular, quando tem sinal.", en: "Basically radio, television and mobile phones, when there's a signal." }
        alt: ["A rádio e a televisão.", "Quase só a rádio."]
        grammar: [g.journalistic-language]
        vocab: [w.veículo-de-comunicação, w.sinal, w.celular]
    texts:
      - title: "Trecho de um conto"
        es: ["— A balsa não vem hoje — disse o velho, olhando o céu.", "— Como o senhor sabe? — perguntou o menino.", "— O vento me contou — respondeu ele, sem sorrir."]
        en: ["\"The ferry isn't coming today,\" said the old man, looking at the sky.", "\"How do you know?\" asked the boy.", "\"The wind told me,\" he replied, without smiling."]
        grammar: [g.quotation]
        vocab: [w.balsa, w.vento, w.responder]
      - title: "Reportagem de rádio"
        es: ["“A estrada está alagada há uma semana”, contou à reportagem a professora Raimunda Lobato.", "Segundo ela, os alunos atravessam o campo de canoa para chegar à escola.", "A notícia foi veiculada no boletim das oito."]
        en: ["\"The road has been flooded for a week,\" teacher Raimunda Lobato told our reporters.", "According to her, the pupils cross the field by canoe to get to school.", "The story was broadcast in the eight o'clock bulletin."]
        grammar: [g.quotation, g.journalistic-language]
        vocab: [w.alagar, w.atravessar, w.veicular, w.boletim]
    spicy:
      - { es: "— Você vem sempre aqui? — perguntou ela. — Agora venho — respondi.", en: "\"Do you come here often?\" she asked. \"I do now,\" I replied.", altEs: ["— Você vem sempre aqui? — perguntou ela. — A partir de hoje, venho — respondi."], grammar: [g.quotation], vocab: [w.perguntar, w.responder] }
      - { es: "“Foi amor à primeira vista”, declarou a testemunha, que era eu mesmo.", en: "\"It was love at first sight,\" declared the witness, who happened to be me.", altEs: ["“Foi amor à primeira vista”, declarou a testemunha, que no caso era eu."], grammar: [g.quotation], vocab: [w.declarar, w.testemunha] }
      - { es: "Segundo fontes da cozinha, o garçom bonito pediu para atender a nossa mesa.", en: "According to sources in the kitchen, the handsome waiter asked to serve our table.", altEs: ["Segundo fontes da cozinha, o garçom bonito pediu para servir a nossa mesa."], grammar: [g.quotation, g.journalistic-language], vocab: [w.garçom, w.atender] }
      - { es: "— Está tarde — disse ele. — Está cedo — disse eu, e pedimos outra rodada.", en: "\"It's late,\" he said. \"It's early,\" I said, and we ordered another round.", grammar: [g.quotation], vocab: [w.cedo, w.rodada] }
      - { es: "Nas palavras da minha avó, “quem dança bem carimbó merece um segundo encontro”.", en: "In my grandmother's words, \"anyone who dances carimbó well deserves a second date\".", grammar: [g.quotation], vocab: [w.avó, w.merecer, w.carimbó] }

  - id: c1.u09.l4
    title: Viralizou!
    teach: [g.journalistic-language, g.quotation]
    vocab: [w.divulgar, w.divulgação, w.sensacionalismo, w.sensacionalista, w.imparcialidade, w.desinformação, w.internauta, w.viralizar, w.influenciador, w.engajamento, w.clique, w.espalhar, w.correção, w.milagroso, w.credibilidade, w.título, w.exclamação, w.perfil, w.invadir, w.ferir]
    tip: "Before sharing, check: who says so (segundo quem?), when, and whether teria hides an unproved claim. Viralizar is the everyday verb for going viral."
    sentences:
      - { es: "O vídeo do policial montado num búfalo viralizou em poucas horas.", en: "The video of the police officer riding a buffalo went viral within a few hours.", grammar: [g.journalistic-language], vocab: [w.viralizar, w.policial, w.búfalo] }
      - { es: "Muitos internautas compartilharam a notícia sem checar a fonte.", en: "Many internet users shared the story without checking the source.", altEs: ["Vários internautas compartilharam a notícia sem checar a fonte."], grammar: [g.journalistic-language], vocab: [w.internauta, w.compartilhar, w.checar] }
      - { es: "Segundo a agência de checagem, a foto é de 2015 e não mostra o Marajó.", en: "According to the fact-checking agency, the photo is from 2015 and doesn't show Marajó.", grammar: [g.journalistic-language, g.quotation], vocab: [w.agência, w.checagem, w.foto] }
      - { es: "Manchetes sensacionalistas geram cliques, mas destroem a confiança do leitor.", en: "Sensationalist headlines generate clicks, but destroy the reader's trust.", grammar: [g.journalistic-language], vocab: [w.sensacionalista, w.clique, w.confiança, w.destruir] }
      - { es: "O sensacionalismo transformou uma cheia comum numa “tragédia sem fim”.", en: "Sensationalism turned an ordinary flood into a “never-ending tragedy”.", grammar: [g.journalistic-language], vocab: [w.sensacionalismo, w.cheia, w.tragédia] }
      - { es: "A desinformação se espalha mais rápido do que a correção.", en: "Disinformation spreads faster than the correction.", altEs: ["A desinformação se espalha mais depressa do que a correção."], grammar: [g.journalistic-language, g.comparatives], vocab: [w.desinformação, w.espalhar, w.correção] }
      - { es: "Um influenciador divulgou um remédio milagroso contra a malária, e a prefeitura teve que desmentir.", en: "An influencer promoted a miracle cure for malaria, and the town hall had to deny it.", grammar: [g.journalistic-language], vocab: [w.influenciador, w.divulgar, w.milagroso, w.malária, w.desmentir] }
      - { es: "A divulgação dos dados da saúde foi adiada para depois das eleições.", en: "The release of the health figures was postponed until after the elections.", grammar: [g.journalistic-language, g.passive-ser], vocab: [w.divulgação, w.adiar, w.eleição] }
      - { es: "A imparcialidade total não existe, mas o jornalista deve ouvir os dois lados.", en: "Total impartiality doesn't exist, but a journalist must hear both sides.", grammar: [g.journalistic-language], vocab: [w.imparcialidade, w.jornalista, w.lado] }
      - { es: "Engajamento nas redes não é o mesmo que credibilidade.", en: "Engagement on social media isn't the same as credibility.", altEs: ["O engajamento nas redes não é a mesma coisa que credibilidade."], grammar: [g.journalistic-language], vocab: [w.engajamento, w.credibilidade] }
      - { es: "Para a pesquisadora, “quem compartilha sem ler também é responsável”.", en: "In the researcher's view, “whoever shares without reading is also responsible”.", grammar: [g.quotation], vocab: [w.pesquisador, w.responsável] }
      - { es: "O ministério divulgou uma nota: “As informações que circulam nas redes são falsas”.", en: "The ministry issued a statement: “The information circulating on social media is false”.", grammar: [g.quotation, g.journalistic-language], vocab: [w.ministério, w.nota, w.falso] }
      - { es: "Antes de compartilhar, desconfie de títulos com ponto de exclamação.", en: "Before sharing, be wary of headlines with exclamation marks.", grammar: [g.journalistic-language, g.imperative-formal], vocab: [w.desconfiar, w.título] }
      - { es: "O influenciador teria recebido dinheiro para divulgar o produto.", en: "The influencer allegedly received money to promote the product.", altEs: ["O influenciador supostamente recebeu dinheiro para divulgar o produto."], grammar: [g.journalistic-language, g.conditional-perfect], vocab: [w.influenciador, w.produto], error: { wrong: "O influenciador teria recebendo dinheiro para divulgar o produto.", explain: "The allegational form is teria + past participle: teria recebido.", grammar: g.journalistic-language } }
      - { es: "O vídeo foi compartilhado milhares de vezes em poucas horas.", en: "The video was shared thousands of times in a few hours.", grammar: [g.journalistic-language], vocab: [w.compartilhar], transform: { instruction: "Say it with one verb", answer: "O vídeo viralizou em poucas horas.", alt: ["O vídeo viralizou."], en: "The video went viral in a few hours." } }
      - { es: "A notícia é falsa, diz a agência de checagem.", en: "The story is false, says the fact-checking agency.", grammar: [g.quotation], vocab: [w.agência], transform: { instruction: "Start with segundo", answer: "Segundo a agência de checagem, a notícia é falsa.", alt: ["De acordo com a agência de checagem, a notícia é falsa.", "Conforme a agência de checagem, a notícia é falsa."] } }
    exchanges:
      - q: { es: "Essa notícia é verdade?", en: "Is this story true?" }
        a: { es: "Não sei; vou checar numa agência antes de compartilhar.", en: "I don't know; I'll check with an agency before sharing it." }
        alt: ["Não sei, vou checar.", "É falsa, já foi desmentida."]
        grammar: [g.journalistic-language]
        vocab: [w.checar, w.compartilhar]
      - q: { es: "Por que esse vídeo viralizou?", en: "Why did that video go viral?" }
        a: { es: "Porque tem búfalo, polícia e humor: a receita perfeita para o engajamento.", en: "Because it has a buffalo, police and humour: the perfect recipe for engagement." }
        alt: ["Porque é engraçado.", "Por causa do búfalo, claro."]
        grammar: [g.journalistic-language]
        vocab: [w.viralizar, w.engajamento, w.receita]
      - q: { es: "O que você acha desse jornal?", en: "What do you think of that newspaper?" }
        a: { es: "Sensacionalista demais: cada chuva vira uma catástrofe.", en: "Far too sensationalist: every shower becomes a catastrophe." }
        alt: ["Muito sensacionalista.", "É sério e imparcial."]
        grammar: [g.journalistic-language]
        vocab: [w.sensacionalista, w.catástrofe]
      - q: { es: "Quem espalhou a desinformação?", en: "Who spread the disinformation?" }
        a: { es: "Um influenciador com dois milhões de seguidores, segundo a polícia.", en: "An influencer with two million followers, according to the police." }
        alt: ["Um influenciador, segundo a polícia.", "Ninguém sabe ainda."]
        grammar: [g.journalistic-language, g.quotation]
        vocab: [w.desinformação, w.influenciador, w.seguidor]
      - q: { es: "Como a prefeitura reagiu ao boato?", en: "How did the town hall react to the rumour?" }
        a: { es: "Divulgou uma nota desmentindo tudo e pediu que os internautas não compartilhassem o vídeo.", en: "It issued a statement denying everything and asked internet users not to share the video." }
        alt: ["Desmentiu tudo numa nota.", "Divulgou uma nota."]
        grammar: [g.journalistic-language, g.reported-speech-subjunctive]
        vocab: [w.boato, w.divulgar, w.internauta]
    texts:
      - title: "Alerta da agência de checagem"
        es: ["É falso que a balsa entre Belém e o Marajó vá parar de funcionar.", "A informação foi divulgada por perfis anônimos e viralizou no fim de semana.", "A empresa nega e diz que os horários continuam os mesmos."]
        en: ["It is false that the ferry between Belém and Marajó is going to stop running.", "The information was spread by anonymous profiles and went viral over the weekend.", "The company denies it and says the timetable remains the same."]
        grammar: [g.journalistic-language]
        vocab: [w.divulgar, w.perfil, w.viralizar]
      - title: "Comentário de um internauta"
        es: ["Compartilhei sem ler, confesso.", "Da próxima vez, leio a matéria inteira antes de sair espalhando por aí."]
        en: ["I shared it without reading it, I confess.", "Next time, I'll read the whole article before going around spreading it."]
        grammar: [g.journalistic-language]
        vocab: [w.compartilhar, w.espalhar]
    spicy:
      - { es: "A foto que você postou comigo viralizou na família inteira; a minha tia já quer saber a data do casamento.", en: "The photo you posted with me went viral in the whole family; my aunt already wants to know the wedding date.", altEs: ["A foto que você postou comigo viralizou na família toda; minha tia já quer saber a data do casamento."], grammar: [g.journalistic-language], vocab: [w.postar, w.viralizar, w.tio] }
      - { es: "Não sou influenciador, mas consegui te convencer a sair comigo; isso é que é engajamento.", en: "I'm not an influencer, but I managed to convince you to go out with me; now that's engagement.", altEs: ["Não sou influenciador, mas convenci você a sair comigo; isso é que é engajamento."], grammar: [g.journalistic-language, g.emphatic-structures], vocab: [w.influenciador, w.engajamento, w.convencer] }
      - { es: "Alerta de desinformação: eu não disse que te achava bonito; eu disse que te achava lindo.", en: "Disinformation alert: I didn't say I thought you were good-looking; I said I thought you were gorgeous.", altEs: ["Alerta de desinformação: não disse que achava você bonito; disse que achava você lindo."], grammar: [g.journalistic-language], vocab: [w.desinformação, w.lindo] }
      - { es: "Imparcialidade total não existe: entre o jogo na TV e você, eu escolho você.", en: "Total impartiality doesn't exist: between the match on TV and you, I choose you.", grammar: [g.journalistic-language], vocab: [w.imparcialidade, w.jogo] }
      - { es: "Divulgação oficial: hoje à noite, jantar a dois, sem celular e sem plateia.", en: "Official announcement: tonight, dinner for two, no phones and no audience.", grammar: [g.journalistic-language], vocab: [w.divulgação, w.plateia] }
dialogues:
  - id: c1.u09.d1
    title: Na rádio comunitária de Soure
    context: At the community radio station in Soure, on Marajó, the editor Dona Socorro and the young reporter Caio prepare the eight o'clock bulletin.
    lines:
      - { speaker: Socorro, es: "Caio, o vídeo do búfalo que invadiu a praça viralizou. Você já checou a história?", en: "Caio, the video of the buffalo that invaded the square has gone viral. Have you checked the story yet?" }
      - { speaker: Caio, es: "Chequei. Segundo a polícia, o animal fugiu de uma fazenda e ninguém se feriu.", en: "I have. According to the police, the animal escaped from a farm and nobody was hurt." }
      - { speaker: Socorro, es: "Ótimo. E aquela denúncia sobre o contrato das balsas?", en: "Great. And that allegation about the ferry contract?" }
      - { speaker: Caio, es: "Ainda estou apurando. A fonte só fala em off, e os documentos são sigilosos.", en: "I'm still looking into it. The source will only talk off the record, and the documents are confidential." }
      - { speaker: Socorro, es: "Então nada de publicar por enquanto. Sem duas fontes, não vai ao ar.", en: "Then nothing gets published for now. Without two sources, it doesn't go on air." }
      - { speaker: Caio, es: "Mas um site de Belém já deu a notícia, com uma manchete bem sensacionalista.", en: "But a Belém website has already run the story, with a very sensationalist headline." }
      - { speaker: Socorro, es: "Deixa que deem. Prefiro chegar em segundo lugar a errar em primeiro.", en: "Let them. I'd rather come second than be wrong first." }
      - { speaker: Caio, es: "Entendido. E o boletim das oito, quem apresenta hoje?", en: "Understood. And the eight o'clock bulletin, who's presenting today?" }
      - { speaker: Socorro, es: "Você mesmo. E, por favor, nada de dizer que o búfalo “teria fugido”: ele fugiu, todo mundo viu.", en: "You are. And please, don't say the buffalo “allegedly escaped”: it escaped, everyone saw it." }
      - { speaker: Caio, es: "Combinado, chefe! Notícia confirmada, sem “teria”.", en: "Agreed, boss! A confirmed story, no “allegedly”." }
    questions:
      - { q: "O que aconteceu com o búfalo, segundo a polícia?", options: ["Fugiu de uma fazenda e ninguém se feriu", "Foi levado para Belém", "Feriu duas pessoas na praça"], answer: 0, explain: "Segundo a polícia, o animal fugiu de uma fazenda e ninguém se feriu." }
      - { q: "Por que a Socorro não quer publicar a denúncia sobre as balsas?", options: ["Porque a notícia é antiga", "Porque ainda não tem duas fontes", "Porque o prefeito pediu"], answer: 1, explain: "Sem duas fontes, não vai ao ar: the source only speaks off the record." }
      - { q: "O que a Socorro quer dizer com “Prefiro chegar em segundo lugar a errar em primeiro”?", options: ["Que a rapidez é mais importante que tudo", "Que é melhor publicar depois, mas com a informação correta", "Que a rádio sempre perde para os sites"], answer: 1, explain: "She values accuracy over being first." }
      - { q: "Por que o Caio não precisa dizer “teria fugido” no boletim?", options: ["Porque o fato está confirmado", "Porque é proibido na rádio", "Porque o búfalo já voltou"], answer: 0, explain: "Teria marks an unconfirmed allegation; here everyone saw the buffalo escape." }
