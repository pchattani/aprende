id: b1.u09
title: "Grasse, c'est en sentant qu'on apprend"
lessons:
  - id: b1.u09.l1
    title: En sentant les fleurs
    teach: [g.gerondif]
    vocab: [w.parfum, w.parfumerie, w.sentir, w.odeur, w.cueillir, w.jasmin, w.rose.n, w.pétale, w.doux, w.mondial, w.arrière-pays, w.figurer, w.patrimoine, w.culturel, w.longer, w.tout-en, w.gant, w.cuir, w.parfumé, w.piquer, w.parfumer, w.attentif]
    tip: "The gérondif is en + -ant (nous sentons → en sentant). It says how or while you do something, and its subject is always the subject of the main verb."
    sentences:
      - { es: "C'est en sentant des fleurs tous les jours qu'on forme son nez.", en: "It's by smelling flowers every day that you train your nose.", altEs: ["C'est en sentant des fleurs chaque jour qu'on forme son nez."], grammar: [g.gerondif], vocab: [w.sentir, w.nez] }
      - { es: "En arrivant à Grasse, on sent tout de suite l'odeur du jasmin.", en: "As you arrive in Grasse, you immediately smell the jasmine.", altEs: ["En arrivant à Grasse, on sent immédiatement l'odeur du jasmin."], altEn: ["When you arrive in Grasse, you can smell the jasmine straight away."], grammar: [g.gerondif], vocab: [w.odeur, w.jasmin] }
      - { es: "Elles cueillent les roses en bavardant.", en: "They pick the roses while chatting.", altEs: ["Elles cueillent les roses tout en bavardant."], grammar: [g.gerondif], vocab: [w.cueillir, w.rose.n] }
      - { es: "On cueille le jasmin à la main, en commençant très tôt le matin.", en: "Jasmine is picked by hand, starting very early in the morning.", altEs: ["Le jasmin se cueille à la main, en commençant très tôt le matin."], grammar: [g.gerondif, g.on-instead-of-passive], vocab: [w.cueillir, w.jasmin] }
      - { es: "En longeant la route de l'arrière-pays, on traverse des champs de fleurs.", en: "Going along the road through the hinterland, you cross fields of flowers.", altEs: ["En suivant la route de l'arrière-pays, on traverse des champs de fleurs."], grammar: [g.gerondif], vocab: [w.longer, w.arrière-pays, w.champ] }
      - { es: "Tout en travaillant à la parfumerie, elle suit des cours le soir.", en: "While working at the perfume factory, she takes classes in the evening.", altEs: ["Tout en travaillant dans la parfumerie, elle suit des cours le soir."], grammar: [g.gerondif], vocab: [w.tout-en, w.parfumerie] }
      - { es: "Il s'est piqué le doigt en cueillant une rose.", en: "He pricked his finger picking a rose.", altEs: ["Il s'est piqué au doigt en cueillant une rose."], grammar: [g.gerondif, g.body-parts-article], vocab: [w.piquer, w.doigt], error: { wrong: "Il s'est piqué le doigt cueillant une rose.", explain: "The gérondif always needs en: en cueillant.", grammar: g.gerondif } }
      - { es: "En mélangeant ces deux essences, vous obtiendrez une odeur plus douce.", en: "By mixing these two essences, you'll get a softer smell.", altEs: ["En mélangeant ces deux essences, vous aurez une odeur plus douce."], grammar: [g.gerondif, g.futur-irregular-stems], vocab: [w.mélanger, w.doux] }
      - { es: "Depuis 2018, le savoir-faire des parfumeurs de Grasse figure au patrimoine culturel de l'UNESCO.", en: "Since 2018, the know-how of Grasse's perfumers has been on UNESCO's cultural heritage list.", altEs: ["Le savoir-faire des parfumeurs de Grasse figure au patrimoine culturel de l'UNESCO depuis 2018."], grammar: [g.depuis-present], vocab: [w.figurer, w.patrimoine, w.culturel] }
      - { es: "En touchant les pétales, on sent qu'ils sont très doux.", en: "When you touch the petals, you can feel how soft they are.", altEs: ["En touchant les pétales, on sent qu'ils sont tout doux."], grammar: [g.gerondif], vocab: [w.pétale, w.toucher] }
      - { es: "Elle a découvert sa passion en visitant une parfumerie à dix ans.", en: "She discovered her passion while visiting a perfume factory at the age of ten.", altEs: ["Elle a découvert sa passion à dix ans, en visitant une parfumerie."], grammar: [g.gerondif], vocab: [w.passion, w.parfumerie] }
      - { es: "En étant attentif, on reconnaît chaque fleur à son odeur.", en: "If you pay attention, you can recognise each flower by its smell.", altEs: ["En faisant attention, on reconnaît chaque fleur à son odeur."], grammar: [g.gerondif], vocab: [w.attentif, w.reconnaître] }
      - { es: "Grasse est connue comme la capitale mondiale du parfum.", en: "Grasse is known as the world capital of perfume.", altEs: ["On connaît Grasse comme la capitale mondiale du parfum."], grammar: [g.adjective-agreement], vocab: [w.mondial, w.capitale] }
      - { es: "Elle chante pendant qu'elle cueille le jasmin.", en: "She sings while she picks the jasmine.", altEs: ["Elle chante tandis qu'elle cueille le jasmin."], grammar: [g.gerondif, g.time-clauses], vocab: [w.chanter], transform: { instruction: "Use a gérondif instead of pendant que", answer: "Elle chante en cueillant le jasmin.", alt: ["Elle cueille le jasmin en chantant.", "Elle chante tout en cueillant le jasmin."], en: "She sings while picking the jasmine." } }
      - { es: "Si tu pars tôt, tu éviteras la foule.", en: "If you leave early, you'll avoid the crowds.", altEs: ["Si tu pars de bonne heure, tu éviteras la foule."], grammar: [g.si-present-futur], vocab: [w.éviter, w.foule], transform: { instruction: "Replace the si clause with a gérondif", answer: "En partant tôt, tu éviteras la foule.", alt: ["En partant de bonne heure, tu éviteras la foule."], en: "By leaving early, you'll avoid the crowds." } }
      - { es: "En sortant de la parfumerie, nous avons vu qu'il pleuvait.", en: "As we came out of the perfume factory, we saw that it was raining.", altEs: ["En sortant de la parfumerie, on a vu qu'il pleuvait."], grammar: [g.gerondif, g.pc-vs-imparfait], vocab: [w.sortir], error: { wrong: "En sortant de la parfumerie, la pluie a commencé.", explain: "The gérondif must have the same subject as the main verb: the rain didn't come out of the shop. Say: En sortant…, nous avons vu qu'il pleuvait.", grammar: g.gerondif } }
    exchanges:
      - q: { es: "Comment tu as trouvé la parfumerie ?", en: "How did you find the perfume factory?" }
        a: { es: "En suivant l'odeur du jasmin, bien sûr !", en: "By following the smell of jasmine, of course!" }
        alt: ["En demandant mon chemin.", "En regardant le plan."]
        grammar: [g.gerondif]
        vocab: [w.odeur, w.jasmin]
      - q: { es: "Qu'est-ce que tu faisais pendant la visite ?", en: "What were you doing during the tour?" }
        a: { es: "Je prenais des notes en écoutant la guide.", en: "I was taking notes while listening to the guide." }
        alt: ["Je prenais des photos en écoutant la guide.", "J'écoutais la guide."]
        grammar: [g.gerondif, g.imparfait-uses]
        vocab: [w.note, w.écouter]
      - q: { es: "Ça sent quoi, ici ?", en: "What's that smell in here?" }
        a: { es: "Ça sent la rose et un peu le jasmin.", en: "It smells of roses and a bit of jasmine." }
        alt: ["Ça sent la rose.", "Ça sent le jasmin."]
        grammar: [g.articles-definite]
        vocab: [w.sentir, w.rose.n]
      - q: { es: "Comment on cueille le jasmin ?", en: "How do you pick jasmine?" }
        a: { es: "À la main, fleur par fleur, en commençant très tôt le matin.", en: "By hand, flower by flower, starting very early in the morning." }
        alt: ["À la main, très tôt le matin.", "Fleur par fleur."]
        grammar: [g.gerondif]
        vocab: [w.cueillir, w.fleur]
      - q: { es: "Tu t'es fait mal ?", en: "Did you hurt yourself?" }
        a: { es: "Oui, je me suis piqué en cueillant une rose.", en: "Yes, I pricked myself picking a rose." }
        alt: ["Oui, je me suis piquée en cueillant une rose.", "Un peu, ce n'est rien."]
        grammar: [g.gerondif, g.pronominal-passe-compose]
        vocab: [w.piquer]
    texts:
      - title: "Au musée de la parfumerie"
        es: ["Autrefois, Grasse fabriquait des gants en cuir.", "Pour cacher leur mauvaise odeur, on les parfumait avec des fleurs de la région.", "C'est ainsi, en parfumant des gants, que la ville est devenue la capitale du parfum."]
        en: ["In the past, Grasse made leather gloves.", "To hide their bad smell, they were perfumed with local flowers.", "That's how, by perfuming gloves, the town became the capital of perfume."]
        grammar: [g.gerondif, g.imparfait-uses]
        vocab: [w.gant, w.cuir, w.odeur]
      - title: "Carte postale de Grasse"
        es: ["Ici, tout sent bon !", "Ce matin, nous avons visité une parfumerie en écoutant les explications d'un nez.", "Demain, nous allons cueillir du jasmin dans l'arrière-pays."]
        en: ["Everything smells good here!", "This morning we visited a perfume factory, listening to a perfumer's explanations.", "Tomorrow we're going to pick jasmine in the hills."]
        grammar: [g.gerondif]
        vocab: [w.parfumerie, w.cueillir, w.arrière-pays]
    spicy:
      - { es: "En passant près de toi, j'ai cru sentir du jasmin. C'était toi ?", en: "As I walked past you, I thought I smelled jasmine. Was that you?", grammar: [g.gerondif], vocab: [w.sentir, w.jasmin] }
      - { es: "Ne me regarde pas comme ça en sentant mon parfum : je vais rougir.", en: "Don't look at me like that while you smell my perfume: I'm going to blush.", grammar: [g.gerondif, g.imperative], vocab: [w.parfum, w.rougir] }
      - { es: "Il m'a offert une rose en rougissant. Adorable.", en: "He gave me a rose, blushing. Adorable.", altEs: ["Elle m'a offert une rose en rougissant. Adorable."], grammar: [g.gerondif], vocab: [w.rose.n, w.rougir] }
      - { es: "En dansant avec toi, j'ai compris pourquoi on parle de chimie.", en: "Dancing with you, I understood why people talk about chemistry.", grammar: [g.gerondif], vocab: [w.danser] }
      - { es: "Tout en jouant les timides, tu m'as donné ton numéro.", en: "All the while playing shy, you gave me your number.", grammar: [g.gerondif], vocab: [w.tout-en, w.timide] }
  - id: b1.u09.l2
    title: Je m'intéresse à la parfumerie
    teach: [g.verbs-prepositions]
    vocab: [w.dépendre, w.manque, w.servir-à, w.utiliser, w.se-servir-de, w.outil, w.qualité, w.odorat, w.toucher.n, w.ouïe, w.sensible, w.essence, w.mélange, w.flacon, w.goutte, w.tromper, w.s-habituer, w.parfumeur, w.papier, w.liste]
    tip: "Learn verbs with their preposition: penser à, s'intéresser à, tenir à, s'habituer à; dépendre de, se servir de, se passer de, se moquer de. And remember: tu me manques = I miss you."
    sentences:
      - { es: "Elle s'intéresse à la parfumerie depuis toute petite.", en: "She has been interested in perfume-making since she was very little.", altEs: ["Elle s'intéresse à la parfumerie depuis qu'elle est toute petite."], grammar: [g.verbs-prepositions], vocab: [w.s-intéresser, w.parfumerie], transform: { instruction: "Replace à la parfumerie with a pronoun", answer: "Elle s'y intéresse depuis toute petite.", alt: ["Elle s'y intéresse depuis qu'elle est toute petite."], en: "She has been interested in it since she was very little." } }
      - { es: "Le prix d'un flacon dépend de la qualité des essences.", en: "The price of a bottle depends on the quality of the essences.", altEs: ["Le prix d'un flacon dépend de la qualité des essences utilisées."], grammar: [g.verbs-prepositions], vocab: [w.dépendre, w.flacon, w.qualité] }
      - { es: "Le nez se sert d'une petite bande de papier pour sentir chaque mélange.", en: "The perfumer uses a little strip of paper to smell each blend.", altEs: ["Le nez utilise une petite bande de papier pour sentir chaque mélange."], grammar: [g.verbs-prepositions, g.pour-sans-infinitive], vocab: [w.se-servir-de, w.mélange], error: { wrong: "Le nez se sert une petite bande de papier pour sentir chaque mélange.", explain: "Se servir (to use) needs de: il se sert d'une bande de papier.", grammar: g.verbs-prepositions } }
      - { es: "À quoi sert cet outil ? — Il sert à compter les gouttes.", en: "What's this tool for? — It's for counting the drops.", altEs: ["Cet outil sert à quoi ? — Il sert à compter les gouttes."], grammar: [g.verbs-prepositions], vocab: [w.servir-à, w.outil, w.goutte] }
      - { es: "Qu'est-ce que tu penses de ce mélange de rose et de jasmin ?", en: "What do you think of this blend of rose and jasmine?", altEs: ["Tu penses quoi de ce mélange de rose et de jasmin ?", "Que penses-tu de ce mélange de rose et de jasmin ?"], grammar: [g.verbs-prepositions], vocab: [w.mélange, w.penser] }
      - { es: "Je pense souvent à cette odeur : c'était celle de ma grand-mère.", en: "I often think about that smell: it was my grandmother's.", altEs: ["Je pense souvent à cette odeur, c'était celle de ma grand-mère."], grammar: [g.verbs-prepositions, g.demonstrative-pronouns], vocab: [w.penser, w.odeur] }
      - { es: "Grasse me manque : je n'oublierai jamais ses odeurs.", en: "I miss Grasse: I'll never forget its smells.", grammar: [g.verbs-prepositions], vocab: [w.manquer, w.odeur], transform: { instruction: "Say that your parents miss Grasse", answer: "Grasse manque à mes parents : ils n'oublieront jamais ses odeurs.", alt: ["Grasse leur manque : ils n'oublieront jamais ses odeurs."], en: "My parents miss Grasse: they'll never forget its smells." } }
      - { es: "Un parfumeur ne peut pas se passer de son odorat.", en: "A perfumer can't do without his sense of smell.", altEs: ["Un parfumeur ne peut pas vivre sans son odorat."], grammar: [g.verbs-prepositions], vocab: [w.odorat, w.parfumeur], transform: { instruction: "Replace de son odorat with a pronoun", answer: "Un parfumeur ne peut pas s'en passer.", en: "A perfumer can't do without it." } }
      - { es: "Ne te moque pas de moi : je ne reconnais aucune odeur !", en: "Don't make fun of me: I can't recognise a single smell!", altEs: ["Ne te moque pas de moi, je ne reconnais aucune odeur !"], grammar: [g.verbs-prepositions, g.ni-ni-aucun], vocab: [w.se-moquer, w.odeur] }
      - { es: "Tu as participé à l'atelier de création de parfum ?", en: "Did you take part in the perfume-making workshop?", altEs: ["Est-ce que tu as participé à l'atelier de création de parfum ?"], grammar: [g.verbs-prepositions], vocab: [w.participer, w.atelier], error: { wrong: "Tu as participé l'atelier de création de parfum ?", explain: "Participer takes à: participer à l'atelier.", grammar: g.verbs-prepositions } }
      - { es: "Elle tient beaucoup à ce flacon : c'était un cadeau de sa mère.", en: "She's very attached to this bottle: it was a present from her mother.", altEs: ["Elle tient énormément à ce flacon : c'était un cadeau de sa mère."], grammar: [g.verbs-prepositions], vocab: [w.tenir, w.flacon] }
      - { es: "Le manque de pluie a rendu les roses moins parfumées cette année.", en: "The lack of rain made the roses less fragrant this year.", altEs: ["À cause du manque de pluie, les roses sont moins parfumées cette année."], grammar: [g.comparatives], vocab: [w.manque, w.parfumé] }
      - { es: "Les étiquettes peuvent tromper les clients : lisez bien la liste des ingrédients.", en: "Labels can mislead customers: read the list of ingredients carefully.", altEs: ["Les étiquettes peuvent tromper les clients, lisez bien la liste des ingrédients."], grammar: [g.modal-verbs, g.imperative], vocab: [w.tromper, w.client] }
      - { es: "On utilise l'essence de rose dans beaucoup de grands parfums.", en: "Rose essence is used in many great perfumes.", altEs: ["L'essence de rose est utilisée dans beaucoup de grands parfums."], grammar: [g.on-instead-of-passive], vocab: [w.utiliser, w.essence] }
      - { es: "L'ouïe, le toucher, l'odorat : un bon artisan se sert de tous ses sens.", en: "Hearing, touch, smell: a good craftsman uses all his senses.", altEs: ["L'ouïe, le toucher et l'odorat : un bon artisan utilise tous ses sens."], grammar: [g.verbs-prepositions], vocab: [w.ouïe, w.toucher.n, w.sens] }
      - { es: "Je suis très sensible aux odeurs fortes, mais je m'habitue à celle-ci.", en: "I'm very sensitive to strong smells, but I'm getting used to this one.", altEs: ["Je suis très sensible aux odeurs fortes, mais je commence à m'habituer à celle-ci."], grammar: [g.verbs-prepositions, g.demonstrative-pronouns], vocab: [w.sensible, w.s-habituer] }
    exchanges:
      - q: { es: "Qu'est-ce que tu penses de ce parfum ?", en: "What do you think of this perfume?" }
        a: { es: "Je le trouve un peu trop sucré, mais l'odeur de rose est jolie.", en: "I find it a bit too sweet, but the rose smell is nice." }
        alt: ["Il est trop sucré.", "Je l'adore !"]
        grammar: [g.verbs-prepositions, g.opinion-mood]
        vocab: [w.parfum, w.sucré]
      - q: { es: "À quoi sert ce petit papier ?", en: "What's this little piece of paper for?" }
        a: { es: "Il sert à sentir le parfum sans le mettre sur la peau.", en: "It's for smelling the perfume without putting it on your skin." }
        alt: ["À sentir le parfum.", "Il sert à tester les essences."]
        grammar: [g.verbs-prepositions, g.pour-sans-infinitive]
        vocab: [w.servir-à, w.peau]
      - q: { es: "Ça coûte combien, un flacon ?", en: "How much is a bottle?" }
        a: { es: "Ça dépend de la taille et des essences.", en: "It depends on the size and the essences." }
        alt: ["Ça dépend.", "Ça dépend de la taille du flacon."]
        grammar: [g.verbs-prepositions]
        vocab: [w.dépendre, w.taille]
      - q: { es: "Tu t'intéresses au parfum ?", en: "Are you interested in perfume?" }
        a: { es: "Oui, j'y pense depuis que j'ai visité Grasse.", en: "Yes, I've been thinking about it since I visited Grasse." }
        alt: ["Oui, beaucoup.", "Pas vraiment, je préfère le vin."]
        grammar: [g.verbs-prepositions, g.pronoun-y]
        vocab: [w.s-intéresser, w.penser]
      - q: { es: "Tu peux t'occuper de mes fleurs pendant mon absence ?", en: "Can you look after my flowers while I'm away?" }
        a: { es: "Bien sûr, je m'en occupe.", en: "Of course, I'll take care of them." }
        alt: ["Pas de problème.", "Oui, je m'occupe de tout."]
        grammar: [g.verbs-prepositions, g.pronoun-en]
        vocab: [w.s-occuper, w.fleur]
    texts:
      - title: "Chez le parfumeur"
        es: ["Le nez se sert d'un orgue à parfums : des centaines de petits flacons.", "Il pense à une odeur, puis il choisit les essences une par une.", "Le résultat dépend de quelques gouttes."]
        en: ["The perfumer uses a perfume organ: hundreds of little bottles.", "He thinks of a smell, then chooses the essences one by one.", "The result depends on a few drops."]
        grammar: [g.verbs-prepositions]
        vocab: [w.se-servir-de, w.flacon, w.dépendre]
      - title: "Merci !"
        es: ["Merci pour le parfum !", "Je tiens beaucoup à ce petit flacon : il sent comme le jardin de mes grands-parents.", "Tu as pensé à tout, comme toujours."]
        en: ["Thanks for the perfume!", "I'm very attached to this little bottle: it smells like my grandparents' garden.", "You thought of everything, as always."]
        grammar: [g.verbs-prepositions]
        vocab: [w.tenir, w.flacon, w.penser]
    spicy:
      - { es: "Je pense à toi plus souvent qu'au dessert. C'est dire.", en: "I think about you more often than about dessert. That says a lot.", grammar: [g.verbs-prepositions], vocab: [w.penser, w.dessert] }
      - { es: "Tu me manques déjà, et tu n'es même pas encore parti.", en: "I miss you already, and you haven't even left yet.", altEs: ["Tu me manques déjà, et tu n'es même pas encore partie."], grammar: [g.verbs-prepositions], vocab: [w.manquer] }
      - { es: "Ne te moque pas de mon parfum : il marche, tu es là.", en: "Don't make fun of my perfume: it works, you're here.", grammar: [g.verbs-prepositions, g.imperative], vocab: [w.se-moquer, w.parfum] }
      - { es: "Je ne peux plus me passer de ton parfum. Tu me le prêtes ?", en: "I can't do without your perfume any more. Will you lend it to me?", grammar: [g.verbs-prepositions, g.double-object-pronouns], vocab: [w.parfum] }
      - { es: "Tout dépend de toi : on se revoit ce soir ?", en: "It's all up to you: shall we see each other again tonight?", grammar: [g.verbs-prepositions], vocab: [w.dépendre] }
  - id: b1.u09.l3
    title: Pour devenir un nez
    teach: [g.pour-sans-infinitive]
    vocab: [w.afin-de, w.de-façon-à, w.façon, w.manière, w.méthode, w.technique, w.éviter, w.précis, w.facilement, w.difficilement, w.complètement, w.totalement, w.absolument, w.simplement, w.directement, w.immédiatement, w.respirer, w.vanille]
    tip: "After a preposition French uses the infinitive, never -ing: pour apprendre, sans parler, au lieu de rester, afin de préserver. The only exception is en + -ant."
    sentences:
      - { es: "On cueille le jasmin avant le lever du soleil pour garder tout son parfum.", en: "Jasmine is picked before sunrise to keep all its scent.", altEs: ["On cueille le jasmin avant le lever du soleil afin de garder tout son parfum."], grammar: [g.pour-sans-infinitive], vocab: [w.jasmin, w.garder] }
      - { es: "Elle a créé son premier parfum sans suivre de formation.", en: "She created her first perfume without doing any training.", altEs: ["Elle a créé son premier parfum sans avoir suivi de formation."], grammar: [g.pour-sans-infinitive, g.de-after-negation], vocab: [w.créer, w.formation] }
      - { es: "Au lieu d'acheter un parfum, viens créer le tien à l'atelier !", en: "Instead of buying a perfume, come and create your own at the workshop!", altEs: ["Au lieu d'acheter un parfum, viens fabriquer le tien à l'atelier !"], grammar: [g.pour-sans-infinitive, g.possessive-pronouns], vocab: [w.atelier, w.créer] }
      - { es: "Afin de préserver la tradition, la ville forme de jeunes parfumeurs.", en: "In order to preserve the tradition, the town trains young perfumers.", altEs: ["Pour préserver la tradition, la ville forme de jeunes parfumeurs."], grammar: [g.pour-sans-infinitive], vocab: [w.afin-de, w.tradition] }
      - { es: "Ne touche pas aux flacons sans demander.", en: "Don't touch the bottles without asking.", altEs: ["Ne touche pas les flacons sans demander."], grammar: [g.pour-sans-infinitive, g.imperative], vocab: [w.toucher, w.flacon], transform: { instruction: "Say it to visitors (vous)", answer: "Ne touchez pas aux flacons sans demander.", alt: ["Ne touchez pas les flacons sans demander."], en: "Don't touch the bottles without asking." } }
      - { es: "Elle est sortie de l'atelier sans dire au revoir.", en: "She left the workshop without saying goodbye.", altEs: ["Elle a quitté l'atelier sans dire au revoir."], grammar: [g.pour-sans-infinitive], vocab: [w.atelier], error: { wrong: "Elle est sortie de l'atelier sans disant au revoir.", explain: "Sans is followed by the infinitive: sans dire, never sans disant.", grammar: g.pour-sans-infinitive } }
      - { es: "Je suis venue à Grasse pour apprendre le métier de nez.", en: "I came to Grasse to learn the perfumer's trade.", altEs: ["Je suis venu à Grasse pour apprendre le métier de nez."], grammar: [g.pour-sans-infinitive], vocab: [w.métier, w.apprendre], transform: { instruction: "Use afin de instead of pour", answer: "Je suis venue à Grasse afin d'apprendre le métier de nez.", alt: ["Je suis venu à Grasse afin d'apprendre le métier de nez."], en: "I came to Grasse in order to learn the perfumer's trade." } }
      - { es: "Tenez le papier sous le nez, de façon à bien sentir l'odeur.", en: "Hold the paper under your nose, so as to smell it properly.", altEs: ["Tenez le papier sous le nez pour bien sentir l'odeur."], grammar: [g.pour-sans-infinitive, g.imperative], vocab: [w.de-façon-à, w.nez] }
      - { es: "Au lieu de te plaindre, essaie une autre méthode.", en: "Instead of complaining, try another method.", altEs: ["Au lieu de te plaindre, essaie une autre technique."], grammar: [g.pour-sans-infinitive, g.imperative], vocab: [w.méthode, w.se-plaindre] }
      - { es: "Il faut des années pour reconnaître facilement des centaines d'odeurs.", en: "It takes years to recognise hundreds of smells easily.", altEs: ["Il faut des années pour reconnaître sans difficulté des centaines d'odeurs."], grammar: [g.pour-sans-infinitive, g.il-faut], vocab: [w.facilement, w.reconnaître] }
      - { es: "On ne peut pas devenir parfumeur sans avoir un odorat très précis.", en: "You can't become a perfumer without having a very precise sense of smell.", grammar: [g.pour-sans-infinitive], vocab: [w.précis, w.odorat] }
      - { es: "Elle travaille de manière très précise pour ne jamais se tromper.", en: "She works very precisely so as never to make a mistake.", altEs: ["Elle travaille de façon très précise pour ne jamais se tromper."], grammar: [g.pour-sans-infinitive, g.negation-jamais-plus-rien], vocab: [w.manière, w.précis], error: { wrong: "Elle travaille de manière très précise pour ne se tromper jamais.", explain: "Before an infinitive, both parts of the negation come first: pour ne jamais se tromper.", grammar: g.pour-sans-infinitive } }
      - { es: "On transporte les fleurs directement à l'usine pour ne pas perdre leur parfum.", en: "The flowers are taken straight to the factory so as not to lose their scent.", altEs: ["Les fleurs vont directement à l'usine pour ne pas perdre leur parfum."], grammar: [g.pour-sans-infinitive], vocab: [w.directement, w.perdre] }
      - { es: "Avec ce rhume, je sens difficilement les odeurs.", en: "With this cold, I can hardly smell anything.", altEs: ["Avec ce rhume, j'ai du mal à sentir les odeurs."], grammar: [g.adverbs-ment], vocab: [w.difficilement, w.rhume] }
      - { es: "Ce parfum est complètement différent du premier : on sent immédiatement la vanille.", en: "This perfume is completely different from the first: you smell the vanilla straight away.", altEs: ["Ce parfum est totalement différent du premier : on sent tout de suite la vanille."], grammar: [g.adverbs-ment], vocab: [w.complètement, w.immédiatement, w.vanille] }
      - { es: "Je ne prends pas la voiture : je vais à la parfumerie à pied.", en: "I'm not taking the car: I'm walking to the perfume factory.", altEs: ["Je ne prends pas la voiture, je vais à la parfumerie à pied."], grammar: [g.negation-ne-pas], vocab: [w.voiture, w.à-pied], transform: { instruction: "Use au lieu de", answer: "Au lieu de prendre la voiture, je vais à la parfumerie à pied.", alt: ["Je vais à la parfumerie à pied au lieu de prendre la voiture."], en: "Instead of taking the car, I'm walking to the perfume factory." } }
    exchanges:
      - q: { es: "Pourquoi tu es venu à Grasse ?", en: "Why did you come to Grasse?" }
        a: { es: "Pour apprendre à faire du parfum.", en: "To learn how to make perfume." }
        alt: ["Pour voir les champs de fleurs.", "Afin de suivre une formation de parfumeur."]
        grammar: [g.pour-sans-infinitive]
        vocab: [w.parfum, w.apprendre]
      - q: { es: "On prend la voiture ?", en: "Shall we take the car?" }
        a: { es: "Non, au lieu de prendre la voiture, allons-y à pied : c'est tout près.", en: "No, instead of taking the car, let's walk: it's really close." }
        alt: ["Non, allons-y à pied.", "Oui, c'est plus simple."]
        grammar: [g.pour-sans-infinitive, g.imperative]
        vocab: [w.voiture, w.à-pied]
      - q: { es: "Tu arrives à sentir les essences ?", en: "Can you smell the essences?" }
        a: { es: "Difficilement : j'ai un gros rhume !", en: "Only just: I've got a bad cold!" }
        alt: ["Oui, facilement.", "Pas du tout, j'ai un rhume."]
        grammar: [g.adverbs-ment]
        vocab: [w.difficilement, w.rhume]
      - q: { es: "Pourquoi vous fermez les yeux ?", en: "Why are you closing your eyes?" }
        a: { es: "Pour mieux me concentrer sur l'odeur.", en: "To concentrate better on the smell." }
        alt: ["Pour mieux sentir.", "Afin de mieux me concentrer."]
        grammar: [g.pour-sans-infinitive]
        vocab: [w.se-concentrer, w.odeur]
      - q: { es: "Je peux entrer ?", en: "May I come in?" }
        a: { es: "Oui, mais sans toucher aux flacons, s'il vous plaît.", en: "Yes, but without touching the bottles, please." }
        alt: ["Oui, bien sûr.", "Oui, mais ne touchez à rien."]
        grammar: [g.pour-sans-infinitive]
        vocab: [w.toucher, w.flacon]
    texts:
      - title: "Atelier « Créez votre parfum »"
        es: ["Pas besoin d'être un nez pour participer !", "Au lieu d'acheter un parfum, venez créer le vôtre en deux heures.", "Vous repartirez avec votre flacon, sans oublier le nom de votre parfum."]
        en: ["No need to be a perfumer to take part!", "Instead of buying a perfume, come and create your own in two hours.", "You'll leave with your bottle, without forgetting the name of your perfume."]
        grammar: [g.pour-sans-infinitive]
        vocab: [w.atelier, w.flacon]
      - title: "Conseils d'une parfumeuse"
        es: ["Pour bien sentir, ne mettez pas le papier directement sous le nez.", "Respirez doucement, sans vous presser.", "Entre deux odeurs, sentez un peu de café afin de reposer votre odorat."]
        en: ["To smell properly, don't put the paper right under your nose.", "Breathe gently, without rushing.", "Between two smells, sniff a little coffee to rest your sense of smell."]
        grammar: [g.pour-sans-infinitive]
        vocab: [w.directement, w.respirer, w.afin-de]
    spicy:
      - { es: "Je suis venue à Grasse pour sentir des roses, pas pour tomber amoureuse.", en: "I came to Grasse to smell roses, not to fall in love.", altEs: ["Je suis venu à Grasse pour sentir des roses, pas pour tomber amoureux."], grammar: [g.pour-sans-infinitive], vocab: [w.rose.n, w.tomber-amoureux] }
      - { es: "Au lieu de m'envoyer des textos, invite-moi à dîner.", en: "Instead of sending me texts, ask me out to dinner.", grammar: [g.pour-sans-infinitive, g.imperative], vocab: [w.texto, w.inviter] }
      - { es: "Tu es parti sans me laisser ton numéro. Erreur de débutant.", en: "You left without giving me your number. Rookie mistake.", altEs: ["Tu es partie sans me laisser ton numéro. Erreur de débutante."], grammar: [g.pour-sans-infinitive], vocab: [w.erreur, w.débutant] }
      - { es: "J'ai mis ce parfum pour te plaire. Ça marche ?", en: "I put this perfume on to please you. Is it working?", grammar: [g.pour-sans-infinitive], vocab: [w.parfum, w.plaire] }
      - { es: "Impossible de passer devant toi sans sourire.", en: "Impossible to walk past you without smiling.", grammar: [g.pour-sans-infinitive], vocab: [w.sourire.v] }
  - id: b1.u09.l4
    title: Apprendre un métier
    teach: [g.gerondif, g.verbs-prepositions]
    vocab: [w.savoir-faire, w.artisan, w.apprenti, w.apprentissage, w.progresser, w.progrès, w.s-entraîner, w.entraînement, w.pratiquer, w.expérience, w.débutant, w.habile, w.patient, w.patience, w.se-concentrer, w.réussite, w.formation, w.compétence, w.diplômé, w.qualifié, w.expérimenté, w.enseigner, w.enseignant, w.maître, w.séduire]
    tip: "With a pronominal verb, the pronoun in the gérondif matches the subject: en m'entraînant, en t'entraînant, en nous entraînant."
    sentences:
      - { es: "C'est en pratiquant tous les jours qu'on progresse.", en: "It's by practising every day that you improve.", altEs: ["C'est en pratiquant chaque jour qu'on progresse.", "On progresse en pratiquant tous les jours."], grammar: [g.gerondif], vocab: [w.pratiquer, w.progresser] }
      - { es: "L'apprenti apprend le métier en regardant travailler son maître.", en: "The apprentice learns the trade by watching his master work.", altEs: ["L'apprenti apprend le métier en regardant son maître travailler."], grammar: [g.gerondif], vocab: [w.apprenti, w.maître], transform: { instruction: "Change to the plural (les apprentis)", answer: "Les apprentis apprennent le métier en regardant travailler leur maître.", alt: ["Les apprentis apprennent le métier en regardant leur maître travailler."], en: "The apprentices learn the trade by watching their master work." } }
      - { es: "Elle s'entraîne à reconnaître les odeurs en fermant les yeux.", en: "She practises recognising smells with her eyes closed.", altEs: ["Elle s'entraîne à reconnaître les odeurs les yeux fermés."], grammar: [g.gerondif, g.verbs-plus-infinitive], vocab: [w.s-entraîner, w.odeur] }
      - { es: "Ce débutant fait des progrès rapides : il est très habile.", en: "This beginner is making quick progress: he's very skilful.", altEs: ["Cette débutante fait des progrès rapides : elle est très habile."], grammar: [g.adjective-agreement], vocab: [w.débutant, w.progrès, w.habile] }
      - { es: "Sois patient : il faut des années pour devenir un vrai nez.", en: "Be patient: it takes years to become a real perfumer.", altEs: ["Sois patiente : il faut des années pour devenir un vrai nez."], grammar: [g.imperative, g.pour-sans-infinitive], vocab: [w.patient, w.nez] }
      - { es: "La patience est la qualité la plus importante dans ce métier.", en: "Patience is the most important quality in this job.", grammar: [g.superlatives], vocab: [w.patience, w.qualité] }
      - { es: "En nous entraînant chaque jour, nous avons beaucoup progressé.", en: "By practising every day, we've made a lot of progress.", altEs: ["En nous entraînant tous les jours, nous avons beaucoup progressé."], grammar: [g.gerondif, g.pronominal-verbs], vocab: [w.s-entraîner, w.progresser], error: { wrong: "En s'entraînant chaque jour, nous avons beaucoup progressé.", explain: "In a gérondif the reflexive pronoun matches the subject: nous → en nous entraînant.", grammar: g.gerondif } }
      - { es: "Si tu t'entraînes chaque jour, tu progresseras vite.", en: "If you practise every day, you'll improve quickly.", altEs: ["Si tu t'entraînes tous les jours, tu progresseras vite."], grammar: [g.si-present-futur], vocab: [w.s-entraîner], transform: { instruction: "Replace the si clause with a gérondif", answer: "En t'entraînant chaque jour, tu progresseras vite.", alt: ["En t'entraînant tous les jours, tu progresseras vite."], en: "By practising every day, you'll improve quickly." } }
      - { es: "Pour cette formation, il faut être diplômé en biologie.", en: "For this course, you need a degree in biology.", altEs: ["Pour cette formation, il faut un diplôme de biologie."], grammar: [g.il-faut], vocab: [w.formation, w.diplômé] }
      - { es: "Nous cherchons un artisan qualifié et expérimenté.", en: "We're looking for a skilled, experienced craftsman.", altEs: ["On cherche un artisan qualifié et expérimenté."], grammar: [g.adjective-agreement], vocab: [w.artisan, w.qualifié, w.expérimenté] }
      - { es: "Mon maître m'a enseigné le savoir-faire de sa famille.", en: "My master taught me his family's know-how.", altEs: ["Mon maître m'a transmis le savoir-faire de sa famille."], grammar: [g.indirect-object-pronouns], vocab: [w.enseigner, w.savoir-faire] }
      - { es: "Concentre-toi sur l'odeur au lieu de regarder ton téléphone !", en: "Concentrate on the smell instead of looking at your phone!", grammar: [g.verbs-prepositions, g.pour-sans-infinitive], vocab: [w.se-concentrer, w.téléphone] }
      - { es: "Sa réussite dépend de son expérience autant que de son talent.", en: "Her success depends on her experience as much as on her talent.", altEs: ["Sa réussite dépend autant de son expérience que de son talent."], altEn: ["His success depends on his experience as much as on his talent."], grammar: [g.verbs-prepositions], vocab: [w.réussite, w.expérience, w.talent] }
      - { es: "Tu t'habitueras vite à cette odeur en travaillant ici.", en: "You'll quickly get used to this smell working here.", altEs: ["En travaillant ici, tu t'habitueras vite à cette odeur."], grammar: [g.verbs-prepositions, g.gerondif], vocab: [w.s-habituer], error: { wrong: "Tu t'habitueras vite de cette odeur en travaillant ici.", explain: "S'habituer takes à: s'habituer à quelque chose.", grammar: g.verbs-prepositions } }
      - { es: "Les enseignants de l'école aiment les débutants qui posent beaucoup de questions.", en: "The teachers at the school like beginners who ask lots of questions.", grammar: [g.relative-qui-que], vocab: [w.enseignant, w.débutant] }
      - { es: "L'entraînement commence par des odeurs simples : on apprend en sentant du citron et de la vanille.", en: "Training starts with simple smells: you learn by smelling lemon and vanilla.", altEs: ["L'entraînement commence avec des odeurs simples : on apprend en sentant du citron et de la vanille."], grammar: [g.gerondif], vocab: [w.entraînement, w.citron, w.vanille] }
    exchanges:
      - q: { es: "Comment tu as appris le métier ?", en: "How did you learn the trade?" }
        a: { es: "En travaillant avec un vieil artisan pendant cinq ans.", en: "By working with an old craftsman for five years." }
        alt: ["En regardant mon maître.", "En faisant un apprentissage."]
        grammar: [g.gerondif]
        vocab: [w.artisan, w.apprendre]
      - q: { es: "Vous avez de l'expérience ?", en: "Do you have any experience?" }
        a: { es: "Un peu : j'ai fait un stage dans une parfumerie l'été dernier.", en: "A little: I did an internship at a perfume house last summer." }
        alt: ["Non, je suis débutant.", "Oui, cinq ans d'expérience."]
        grammar: [g.passe-compose-avoir]
        vocab: [w.expérience, w.stage]
      - q: { es: "C'est difficile, l'apprentissage ?", en: "Is the apprenticeship hard?" }
        a: { es: "Oui, il faut beaucoup de patience, mais on progresse vite en pratiquant.", en: "Yes, it takes a lot of patience, but you improve fast by practising." }
        alt: ["Oui, mais on progresse vite.", "Pas trop, avec de la patience."]
        grammar: [g.gerondif]
        vocab: [w.apprentissage, w.patience]
      - q: { es: "Qu'est-ce que tu fais pour te concentrer ?", en: "What do you do to concentrate?" }
        a: { es: "Je ferme les yeux en respirant lentement.", en: "I close my eyes and breathe slowly." }
        alt: ["Je ferme les yeux.", "J'éteins mon téléphone."]
        grammar: [g.gerondif]
        vocab: [w.se-concentrer, w.respirer]
      - q: { es: "Tu t'es habitué à l'odeur ?", en: "Have you got used to the smell?" }
        a: { es: "Oui, maintenant je ne la sens même plus !", en: "Yes, now I don't even smell it any more!" }
        alt: ["Oui, je m'y suis habitué.", "Pas encore !"]
        grammar: [g.verbs-prepositions, g.negation-jamais-plus-rien]
        vocab: [w.s-habituer, w.sentir]
    texts:
      - title: "Offre d'apprentissage"
        es: ["Parfumerie de Grasse cherche apprenti motivé.", "Débutants acceptés : nous assurons la formation.", "Compétences demandées : patience, odorat sensible et envie d'apprendre."]
        en: ["Grasse perfume house seeks motivated apprentice.", "Beginners welcome: we provide the training.", "Skills required: patience, a sensitive nose and a desire to learn."]
        grammar: [g.adjective-agreement]
        vocab: [w.apprenti, w.formation, w.compétence]
      - title: "Témoignage d'une parfumeuse"
        es: ["J'ai commencé comme apprentie à dix-huit ans.", "En regardant travailler mon maître, j'ai appris à reconnaître des centaines d'odeurs.", "Aujourd'hui, c'est moi qui enseigne ce savoir-faire aux jeunes."]
        en: ["I started as an apprentice at eighteen.", "By watching my master work, I learned to recognise hundreds of smells.", "Today I'm the one who teaches this know-how to young people."]
        grammar: [g.gerondif]
        vocab: [w.apprenti, w.enseigner, w.savoir-faire]
    spicy:
      - { es: "Je suis débutante en danse, mais tu peux m'enseigner.", en: "I'm a beginner at dancing, but you can teach me.", altEs: ["Je suis débutant en danse, mais tu peux m'enseigner."], grammar: [g.modal-verbs], vocab: [w.débutant, w.enseigner] }
      - { es: "Tu as beaucoup d'expérience… en compliments, je veux dire.", en: "You've got a lot of experience… with compliments, I mean.", grammar: [g.quantities], vocab: [w.expérience] }
      - { es: "Il faut de la patience pour me séduire. Tu es patient ?", en: "It takes patience to win me over. Are you patient?", altEs: ["Il faut de la patience pour me séduire. Tu es patiente ?"], grammar: [g.il-faut, g.pour-sans-infinitive], vocab: [w.patience, w.patient] }
      - { es: "En te voyant, j'ai oublié tout ce que mon maître m'avait enseigné.", en: "When I saw you, I forgot everything my master had taught me.", grammar: [g.gerondif, g.plus-que-parfait], vocab: [w.maître, w.enseigner] }
      - { es: "Entraîne-toi encore un peu à me faire rire : tu fais des progrès.", en: "Keep practising making me laugh: you're making progress.", grammar: [g.verbs-prepositions, g.imperative], vocab: [w.s-entraîner, w.progrès] }
dialogues:
  - id: b1.u09.d1
    title: À l'atelier de parfum
    context: Lucas has signed up for a perfume-making workshop in Grasse. Sandrine, a perfumer, shows him how to start.
    lines:
      - { speaker: Sandrine, es: "Bienvenue à l'atelier ! Vous vous intéressez au parfum depuis longtemps ?", en: "Welcome to the workshop! Have you been interested in perfume for long?" }
      - { speaker: Lucas, es: "Depuis toujours, mais je n'y connais rien. Je suis un vrai débutant.", en: "Forever, but I know nothing about it. I'm a real beginner." }
      - { speaker: Sandrine, es: "Ce n'est pas grave. C'est en sentant qu'on apprend. Prenez ce petit papier.", en: "That doesn't matter. You learn by smelling. Take this little strip of paper." }
      - { speaker: Lucas, es: "À quoi il sert ?", en: "What's it for?" }
      - { speaker: Sandrine, es: "Il sert à sentir chaque essence sans la mettre sur la peau. Fermez les yeux pour mieux vous concentrer.", en: "It's for smelling each essence without putting it on your skin. Close your eyes to concentrate better." }
      - { speaker: Lucas, es: "Mmm… C'est de la rose ?", en: "Mmm… Is it rose?" }
      - { speaker: Sandrine, es: "Presque : c'est du jasmin. On le cueille à la main, très tôt le matin, pour garder son parfum.", en: "Almost: it's jasmine. It's picked by hand, very early in the morning, to keep its scent." }
      - { speaker: Lucas, es: "Et comment je fais pour créer mon parfum ?", en: "And how do I go about creating my perfume?" }
      - { speaker: Sandrine, es: "En mélangeant des gouttes de plusieurs essences. Mais attention : tout dépend des quantités !", en: "By mixing drops of several essences. But be careful: it all depends on the amounts!" }
      - { speaker: Lucas, es: "Je peux mettre beaucoup de jasmin ? J'adore cette odeur.", en: "Can I put in lots of jasmine? I love that smell." }
      - { speaker: Sandrine, es: "Allez-y, mais doucement. Au lieu de verser, comptez les gouttes.", en: "Go ahead, but gently. Instead of pouring, count the drops." }
    questions:
      - { q: "Lucas a-t-il de l'expérience ?", options: ["Oui, il est parfumeur", "Non, c'est un débutant", "Il a fait un stage à Grasse"], answer: 1, explain: "Je suis un vrai débutant." }
      - { q: "À quoi sert le petit papier ?", options: ["À sentir les essences sans les mettre sur la peau", "À écrire le nom du parfum", "À nettoyer les flacons"], answer: 0, explain: "Il sert à sentir chaque essence sans la mettre sur la peau." }
      - { q: "Quelle fleur Lucas sent-il ?", options: ["La rose", "La lavande", "Le jasmin"], answer: 2, explain: "Lucas thinks it's rose, but Sandrine says it's jasmine." }
      - { q: "Que conseille Sandrine à la fin ?", options: ["De verser vite", "De compter les gouttes", "D'acheter un flacon"], answer: 1, explain: "Au lieu de verser, comptez les gouttes." }
