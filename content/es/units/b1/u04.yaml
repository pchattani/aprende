id: b1.u04
title: Consejos y mandatos
lessons:
  - id: b1.u04.l1
    title: No hables, no corras
    teach: [g.imperative-negative]
    vocab: [w.castigo, w.prohibicion, w.exceso, w.comportarse, w.comportamiento, w.evitar, w.peligro, w.casco, w.cinturon, w.interrumpir, w.en-voz-alta, w.permiso, w.carnet, w.alcohol, w.limite, w.peaton, w.acera, w.frenar, w.borracho, w.norma, w.respetar, w.voz]
    tip: "Negative commands use the present subjunctive for every person: no hables, no hable, no habléis, no hablen."
    sentences:
      - { es: "No hables en voz alta en la biblioteca, por favor.", en: "Don't talk loudly in the library, please.", grammar: [g.imperative-negative], vocab: [w.en-voz-alta, w.biblioteca] }
      - { es: "No conduzcas después de beber alcohol.", en: "Don't drive after drinking alcohol.", grammar: [g.imperative-negative], vocab: [w.conducir, w.alcohol, w.beber] }
      - { es: "No conduzcáis por encima del límite de velocidad.", en: "Don't drive over the speed limit.", grammar: [g.imperative-negative], vocab: [w.limite, w.velocidad, w.conducir] }
      - { es: "No montes en bici sin casco.", en: "Don't ride a bike without a helmet.", grammar: [g.imperative-negative], vocab: [w.casco, w.bici, w.montar] }
      - { es: "No viajes nunca sin el cinturón de seguridad.", en: "Never travel without your seat belt.", grammar: [g.imperative-negative], vocab: [w.cinturon, w.viajar] }
      - { es: "No frenes de repente en la autopista.", en: "Don't brake suddenly on the motorway.", grammar: [g.imperative-negative], vocab: [w.frenar, w.de-repente, w.autopista] }
      - { es: "No interrumpas al profesor cuando está explicando.", en: "Don't interrupt the teacher when he's explaining.", grammar: [g.imperative-negative], vocab: [w.interrumpir, w.explicar, w.profesor], error: { wrong: "No interrumpes al profesor cuando está explicando.", explain: "Negative tú commands take the subjunctive: no interrumpas, not no interrumpes.", grammar: g.imperative-negative } }
      - { es: "Niños, no os comportéis así delante de los invitados.", en: "Children, don't behave like that in front of the guests.", grammar: [g.imperative-negative], vocab: [w.comportarse, w.invitar, w.delante] }
      - { es: "No salgas de casa sin permiso de tus padres.", en: "Don't leave the house without your parents' permission.", grammar: [g.imperative-negative], vocab: [w.permiso, w.salir, w.padres] }
      - { es: "No cojas el coche: todavía no tienes carnet.", en: "Don't take the car: you don't have a licence yet.", grammar: [g.imperative-negative], vocab: [w.carnet, w.coger, w.coche], variant: "In Latin America coger is avoided (it is vulgar in several countries): no tomes el coche." }
      - { es: "No aparquéis en la acera; molesta a los peatones.", en: "Don't park on the pavement; it bothers pedestrians.", grammar: [g.imperative-negative], vocab: [w.acera, w.peaton, w.molestar] }
      - { es: "No vuelvas a casa borracho; tus padres se van a preocupar.", en: "Don't come home drunk; your parents are going to worry.", grammar: [g.imperative-negative], vocab: [w.borracho, w.preocuparse, w.volver] }
      - { es: "El exceso de velocidad es la primera causa de accidentes; no corráis.", en: "Speeding is the first cause of accidents; don't drive fast.", grammar: [g.imperative-negative], vocab: [w.exceso, w.velocidad, w.accidente] }
      - { es: "No fuméis dentro: hay una prohibición de fumar en todos los bares.", en: "Don't smoke inside: there's a smoking ban in all bars.", grammar: [g.imperative-negative], vocab: [w.prohibicion, w.fumar, w.bar] }
      - { es: "Evita el peligro: no nades en el río después de la tormenta.", en: "Avoid danger: don't swim in the river after the storm.", grammar: [g.imperative-negative, g.imperative-tu], vocab: [w.evitar, w.peligro, w.nadar, w.tormenta] }
      - { es: "Abre la ventana.", en: "Open the window.", grammar: [g.imperative-negative], vocab: [w.abrir, w.ventana], transform: { instruction: "Make the command negative", answer: "No abras la ventana." } }
  - id: b1.u04.l2
    title: No te preocupes, no se lo digas
    teach: [g.imperative-negative]
    vocab: [w.estresarse, w.tranquilizarse, w.ofender, w.herir, w.celos, w.celoso, w.de-ninguna-manera, w.relajarse, w.culpar, w.sentimiento, w.confianza, w.juzgar, w.dejar-en-paz, w.meterse, w.ni-se-te-ocurra, w.manera, w.animar, w.distraerse, w.honesto, w.sinceridad, w.demas, w.enfadarse, w.culpa, w.animo]
    tip: "With negative commands the pronouns go before the verb: no te preocupes, no me lo digas, no os vayáis."
    sentences:
      - { es: "No te preocupes tanto por el examen; vas a aprobar.", en: "Don't worry so much about the exam; you're going to pass.", grammar: [g.imperative-negative], vocab: [w.preocuparse, w.examen] }
      - { es: "No te estreses: todavía quedan dos semanas para entregar el proyecto.", en: "Don't get stressed: there are still two weeks to hand in the project.", grammar: [g.imperative-negative], vocab: [w.estresarse, w.entregar, w.proyecto] }
      - { es: "No se lo digas a nadie; es un secreto.", en: "Don't tell anyone; it's a secret.", grammar: [g.imperative-negative, g.double-object-pronouns], vocab: [w.decir, w.secreto, w.nadie], error: { wrong: "No díselo a nadie; es un secreto.", explain: "In negative commands the pronouns go before the verb: no se lo digas. Attached pronouns (díselo) are only for affirmative commands.", grammar: g.imperative-negative } }
      - { es: "No culpes a tu hermano de tus problemas.", en: "Don't blame your brother for your problems.", grammar: [g.imperative-negative], vocab: [w.culpar, w.hermano, w.problema] }
      - { es: "No te metas en los asuntos de los demás.", en: "Don't meddle in other people's business.", grammar: [g.imperative-negative], vocab: [w.meterse, w.demas] }
      - { es: "No la juzgues sin conocer toda la historia.", en: "Don't judge her without knowing the whole story.", grammar: [g.imperative-negative], vocab: [w.juzgar, w.conocer, w.historia] }
      - { es: "No la ofendas: lo que dices hiere sus sentimientos.", en: "Don't offend her: what you say hurts her feelings.", grammar: [g.imperative-negative], vocab: [w.ofender, w.herir, w.sentimiento] }
      - { es: "No seas celoso; los celos acaban con la confianza.", en: "Don't be jealous; jealousy destroys trust.", grammar: [g.imperative-negative], vocab: [w.celoso, w.celos, w.confianza], note: "acabar con = to destroy, to put an end to." }
      - { es: "No os relajéis demasiado; todavía queda mucho trabajo.", en: "Don't relax too much; there's still a lot of work left.", grammar: [g.imperative-negative], vocab: [w.relajarse, w.quedar, w.trabajo] }
      - { es: "No te distraigas con el móvil mientras conduces.", en: "Don't get distracted by your phone while you're driving.", grammar: [g.imperative-negative], vocab: [w.distraerse, w.movil, w.conducir] }
      - { es: "Déjame en paz, no me hables de esa manera.", en: "Leave me alone, don't talk to me like that.", grammar: [g.imperative-negative, g.imperative-tu], vocab: [w.dejar-en-paz, w.hablar, w.manera] }
      - { es: "¿Puedo coger tu coche? — ¡Ni se te ocurra! De ninguna manera.", en: "Can I take your car? — Don't even think about it! No way.", grammar: [g.imperative-negative], vocab: [w.ni-se-te-ocurra, w.de-ninguna-manera, w.coger] }
      - { es: "Anímate y no pienses más en eso.", en: "Cheer up and don't think about it any more.", grammar: [g.imperative-negative, g.imperative-tu], vocab: [w.animar, w.pensar] }
      - { es: "Sé honesto con ella y no le hagas daño: la sinceridad es lo más importante.", en: "Be honest with her and don't hurt her: sincerity is what matters most.", grammar: [g.imperative-negative], vocab: [w.honesto, w.sinceridad, w.hacerse-dano] }
      - { es: "No os pongáis nerviosos; tranquilizaos y respirad despacio.", en: "Don't get nervous; calm down and breathe slowly.", grammar: [g.imperative-negative], vocab: [w.tranquilizarse, w.nervioso, w.respirar], note: "Vosotros imperative of reflexive verbs drops the d: tranquilizaos, levantaos." }
      - { es: "Levántate temprano.", en: "Get up early.", grammar: [g.imperative-negative], vocab: [w.levantarse, w.temprano], transform: { instruction: "Make the command negative", answer: "No te levantes temprano." } }
  - id: b1.u04.l3
    title: Te recomiendo que descanses
    teach: [g.subjunctive-advice]
    vocab: [w.sugerencia, w.recomendacion, w.grasa, w.terapia, w.especialista, w.vacuna, w.en-forma, w.mantener, w.alimentacion, w.ansiedad, w.revision, w.psicologo, w.apuntes, w.repasar, w.concentrarse, w.matricularse, w.peso, w.al-menos, w.tension, w.postura, w.estirar, w.aconsejar, w.sugerir, w.proponer, w.doctor]
    tip: "recomendar / aconsejar / sugerir que + subjunctive; or use deberías + infinitive, yo que tú + conditional, es mejor que + subjunctive."
    sentences:
      - { es: "Te recomiendo que descanses al menos ocho horas.", en: "I recommend that you rest at least eight hours.", grammar: [g.subjunctive-advice], vocab: [w.recomendar, w.descansar, w.al-menos] }
      - { es: "El médico me aconseja que haga una revisión cada año.", en: "The doctor advises me to have a check-up every year.", grammar: [g.subjunctive-advice], vocab: [w.medico, w.revision] }
      - { es: "Es mejor que vayas a un especialista si el dolor sigue.", en: "It's better to go to a specialist if the pain continues.", grammar: [g.subjunctive-advice], vocab: [w.especialista, w.dolor, w.seguir] }
      - { es: "Yo que tú, me pondría la vacuna de la gripe antes del invierno.", en: "If I were you, I'd get the flu vaccine before winter.", grammar: [g.subjunctive-advice, g.conditional-simple], vocab: [w.vacuna, w.gripe, w.invierno] }
      - { es: "Conviene que reduzcas la grasa y el azúcar en tu alimentación.", en: "It's advisable to cut down the fat and sugar in your diet.", grammar: [g.subjunctive-advice], vocab: [w.grasa, w.azucar, w.alimentacion] }
      - { es: "Deberías mantenerte en forma: camina media hora al día.", en: "You should stay fit: walk half an hour a day.", grammar: [g.subjunctive-advice, g.imperative-tu], vocab: [w.mantener, w.en-forma, w.caminar] }
      - { es: "Mi recomendación es que hables con un psicólogo sobre tu ansiedad.", en: "My recommendation is that you talk to a psychologist about your anxiety.", grammar: [g.subjunctive-advice], vocab: [w.recomendacion, w.psicologo, w.ansiedad] }
      - { es: "La terapia me ha ayudado mucho; te aconsejo que la pruebes.", en: "Therapy has helped me a lot; I advise you to try it.", grammar: [g.subjunctive-advice, g.present-perfect], vocab: [w.terapia, w.probar, w.ayudar] }
      - { es: "¿Por qué no te matriculas en un curso de español por la tarde?", en: "Why don't you enrol in an evening Spanish course?", grammar: [g.subjunctive-advice], vocab: [w.matricularse, w.curso] }
      - { es: "Os recomiendo que repaséis los apuntes antes del examen.", en: "I recommend you go over your notes before the exam.", grammar: [g.subjunctive-advice], vocab: [w.repasar, w.apuntes, w.examen], error: { wrong: "Os recomiendo que repasáis los apuntes antes del examen.", explain: "After recomendar que use the subjunctive: repaséis, not repasáis.", grammar: g.subjunctive-advice } }
      - { es: "Si quieres concentrarte, es mejor que apagues el móvil.", en: "If you want to concentrate, it's better to switch off your phone.", grammar: [g.subjunctive-advice], vocab: [w.concentrarse, w.apagar, w.movil] }
      - { es: "Tienes la tensión alta: hay que evitar la sal.", en: "Your blood pressure is high: you have to avoid salt.", grammar: [g.subjunctive-advice], vocab: [w.tension, w.evitar, w.sal, w.hay-que] }
      - { es: "Le recomiendo que cambie de postura a menudo cuando trabaja con el ordenador.", en: "I recommend you change position often when working at the computer.", grammar: [g.subjunctive-advice], vocab: [w.postura, w.cambiar, w.a-menudo, w.ordenador], note: "Formal usted: le recomiendo que cambie." }
      - { es: "Estira las piernas y la espalda después de correr.", en: "Stretch your legs and back after running.", grammar: [g.subjunctive-advice, g.imperative-tu], vocab: [w.estirar, w.pierna, w.espalda] }
      - { es: "Mi sugerencia es que no te preocupes tanto por el peso.", en: "My suggestion is that you don't worry so much about your weight.", grammar: [g.subjunctive-advice], vocab: [w.sugerencia, w.peso, w.preocuparse] }
      - { es: "Deberías dormir más.", en: "You should sleep more.", grammar: [g.subjunctive-advice], vocab: [w.dormir], transform: { instruction: "Rewrite with 'Te recomiendo que…'", answer: "Te recomiendo que duermas más.", alt: ["Te aconsejo que duermas más."] } }
  - id: b1.u04.l4
    title: Dice que vengas
    teach: [g.indirect-commands]
    vocab: [w.orden, w.encargar, w.turno, w.presentacion, w.cuanto-antes, w.advertencia, w.redactar, w.ambos, w.cualquiera, w.convocar, w.becario, w.archivar, w.archivo, w.imprimir, w.proveedor, w.almacen, w.despacho, w.practicas, w.plantilla]
    tip: "decir / pedir / mandar que + subjunctive reports an order; que + subjunctive on its own passes one on: Que pase."
    sentences:
      - { es: "La jefa dice que vengas a su despacho cuanto antes.", en: "The boss says you should come to her office as soon as possible.", grammar: [g.indirect-commands], vocab: [w.jefe, w.despacho, w.cuanto-antes] }
      - { es: "Nos ha pedido que redactemos el informe antes del viernes.", en: "She has asked us to write up the report before Friday.", grammar: [g.indirect-commands], vocab: [w.redactar, w.informe, w.pedir] }
      - { es: "El director manda que los becarios archiven las facturas de este mes.", en: "The director orders the interns to file this month's invoices.", grammar: [g.indirect-commands], vocab: [w.becario, w.archivar, w.factura, w.director] }
      - { es: "¿El señor Ruiz está esperando? — Que pase, por favor.", en: "Is Mr Ruiz waiting? — Let him in, please.", grammar: [g.indirect-commands], vocab: [w.esperar, w.pasar], note: "que + subjunctive passes an order on to a third person." }
      - { es: "Dice el proveedor que le enviemos la dirección del almacén.", en: "The supplier says we should send him the warehouse address.", grammar: [g.indirect-commands], vocab: [w.proveedor, w.almacen, w.enviar, w.direccion] }
      - { es: "Te he dicho mil veces que no imprimas los correos: es malo para el medio ambiente.", en: "I've told you a thousand times not to print the emails: it's bad for the environment.", grammar: [g.indirect-commands], vocab: [w.imprimir, w.correo, w.medio-ambiente], error: { wrong: "Te he dicho mil veces que no imprimes los correos.", explain: "decir que + subjunctive when it reports an order (que no imprimas); the indicative (imprimes) would only report information.", grammar: g.indirect-commands } }
      - { es: "Han convocado una reunión y dicen que vayan ambos equipos.", en: "They've called a meeting and say both teams should go.", grammar: [g.indirect-commands], vocab: [w.convocar, w.reunion, w.ambos, w.equipo] }
      - { es: "Mi madre insiste en que coma más verdura.", en: "My mother insists that I eat more vegetables.", grammar: [g.indirect-commands], vocab: [w.comer, w.verdura] }
      - { es: "El médico me ha dicho que no trabaje en el turno de noche.", en: "The doctor has told me not to work the night shift.", grammar: [g.indirect-commands], vocab: [w.turno, w.trabajar, w.noche] }
      - { es: "Que lo haga cualquiera de la plantilla; no hace falta que seas tú.", en: "Let anyone on the staff do it; it doesn't have to be you.", grammar: [g.indirect-commands], vocab: [w.cualquiera, w.plantilla] }
      - { es: "La jefa ha dado la orden de que nadie salga antes de las seis.", en: "The boss has given the order that nobody leaves before six.", grammar: [g.indirect-commands], vocab: [w.orden, w.salir, w.nadie] }
      - { es: "Me han encargado que prepare la presentación para los clientes.", en: "They've put me in charge of preparing the presentation for the clients.", grammar: [g.indirect-commands], vocab: [w.encargar, w.presentacion, w.cliente] }
      - { es: "Última advertencia: que nadie toque el ordenador del despacho.", en: "Last warning: nobody is to touch the office computer.", grammar: [g.indirect-commands], vocab: [w.advertencia, w.tocar, w.ordenador] }
      - { es: "Mis padres quieren que haga unas prácticas en una empresa este verano.", en: "My parents want me to do an internship at a company this summer.", grammar: [g.indirect-commands, g.subjunctive-wishes], vocab: [w.practicas, w.empresa, w.verano] }
      - { es: "El jefe dice que guardes el archivo y se lo envíes hoy.", en: "The boss says you should save the file and send it to him today.", grammar: [g.indirect-commands, g.double-object-pronouns], vocab: [w.archivo, w.guardar, w.enviar] }
      - { es: "La jefa: «Venid a las ocho.»", en: "The boss: 'Come at eight.'", grammar: [g.indirect-commands], vocab: [w.venir], transform: { instruction: "Report the order: La jefa dice que…", answer: "La jefa dice que vengamos a las ocho.", alt: ["La jefa dice que vayamos a las ocho."] } }
dialogues:
  - id: b1.u04.d1
    title: Consejos de una amiga
    context: Marta has had a terrible week at work; her friend Lucía gives her advice over a coffee.
    lines:
      - { speaker: Lucía, es: "¿Qué te pasa, Marta? Tienes mala cara.", en: "What's wrong, Marta? You look terrible." }
      - { speaker: Marta, es: "Estoy agotada. Mi jefe dice que termine el informe para el lunes y que, además, prepare la presentación de los clientes.", en: "I'm exhausted. My boss says I have to finish the report for Monday and, on top of that, prepare the clients' presentation." }
      - { speaker: Lucía, es: "No te estreses tanto. Yo que tú, hablaría con él y le pediría más tiempo.", en: "Don't get so stressed. If I were you, I'd talk to him and ask him for more time." }
      - { speaker: Marta, es: "Es que me da miedo que se enfade.", en: "The thing is I'm afraid he'll get angry." }
      - { speaker: Lucía, es: "No pienses eso. Te recomiendo que le expliques el problema sin miedo. Y, sobre todo, no trabajes este fin de semana.", en: "Don't think that. I recommend you explain the problem to him without fear. And above all, don't work this weekend." }
      - { speaker: Marta, es: "Imposible. Además, no duermo bien y me duele la espalda.", en: "Impossible. Besides, I don't sleep well and my back hurts." }
      - { speaker: Lucía, es: "Pues es mejor que vayas al médico cuanto antes. Y deberías estirar un poco cada mañana.", en: "Then it's better you go to the doctor as soon as possible. And you should stretch a bit every morning." }
      - { speaker: Marta, es: "Vale, vale. ¿Algo más, doctora?", en: "OK, OK. Anything else, doctor?" }
      - { speaker: Lucía, es: "Sí: no te rías, lo digo en serio. Tu salud es lo primero.", en: "Yes: don't laugh, I mean it. Your health comes first." }
      - { speaker: Marta, es: "Tienes razón. Mañana mismo pido cita.", en: "You're right. I'll make an appointment tomorrow." }
