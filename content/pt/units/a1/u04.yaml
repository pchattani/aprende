        alt: ["Tem dois.", "Não tem não.", "Tem, sim."]
        grammar: [g.tem-there-is, g.ficar-location]
        vocab: [w.supermercado, w.bairro]
    texts:
      - title: "Meu bairro"
        es: ["Moro em Laranjeiras, um bairro tranquilo.", "Tem uma praça, uma igreja antiga e muitos restaurantes.", "O Cristo fica bem perto, lá em cima no morro."]
        en: ["I live in Laranjeiras, a quiet neighbourhood.", "There's a square, an old church and lots of restaurants.", "Christ the Redeemer is very close, up there on the hill."]
        grammar: [g.ficar-location, g.tem-there-is]
        vocab: [w.bairro, w.praça, w.igreja, w.restaurante, w.morro]
      - title: "Placa no Corcovado"
        es: ["Bem-vindos ao Cristo Redentor!", "O trem fica à esquerda.", "O ponto de ônibus fica na praça."]
        en: ["Welcome to Christ the Redeemer!", "The train is on the left.", "The bus stop is in the square."]
        grammar: [g.ficar-location]
        vocab: [w.ponto, w.praça]
    spicy:
      - { es: "O hotel fica perto, o restaurante fica perto... e você, fica?", en: "The hotel is close, the restaurant is close... and you, are you staying?", altEs: ["O hotel fica perto, o restaurante fica perto... e você, fica ou não?"], grammar: [g.ficar-location], vocab: [w.ficar, w.hotel, w.restaurante] }
      - { es: "Você fica no Rio até domingo? Que bom...", en: "You're staying in Rio until Sunday? How nice...", altEs: ["Você fica no Rio até domingo? Que ótimo..."], grammar: [g.ficar-location], vocab: [w.ficar] }
      - { es: "Qual é o seu endereço? É para levar flores, claro.", en: "What's your address? It's to bring you flowers, of course.", altEs: ["Qual o seu endereço? É pra levar flores, claro."], grammar: [g.question-words], vocab: [w.endereço] }
      - { es: "Meu bairro é tranquilo, mas com você aqui fica muito mais interessante.", en: "My neighbourhood is quiet, but with you here it gets much more interesting.", altEs: ["O meu bairro é tranquilo, mas com você aqui fica bem mais interessante."], grammar: [g.ficar-location], vocab: [w.bairro, w.ficar] }
      - { es: "Hoje eu fico em casa, com um filme e um sofá grande demais para uma pessoa.", en: "Tonight I'm staying in, with a film and a sofa that's too big for one person.", altEs: ["Hoje fico em casa, com um filme e um sofá grande demais pra uma pessoa."], grammar: [g.ficar-location], vocab: [w.ficar] }
  - id: a1.u04.l4
    title: Perto ou longe?
    teach: [g.prepositions-place]
    vocab: [w.perto, w.longe, w.ali, w.lá, w.aí, w.cima, w.embaixo, w.dentro, w.fora, w.atrás, w.frente, w.lado, w.entre, w.daqui, w.vizinho, w.tranquilo, w.barulhento]
    tip: "Most place expressions end in de, which contracts: perto do mar, ao lado da padaria, em cima da mesa."
    sentences:
      - { es: "A padaria fica ao lado do banco.", en: "The bakery is next to the bank.", altEs: ["A padaria é ao lado do banco."], grammar: [g.prepositions-place, g.ficar-location], vocab: [w.lado], error: { wrong: "A padaria fica ao lado o banco.", explain: "ao lado needs de: ao lado do banco.", grammar: g.prepositions-place } }
      - { es: "Moro perto da praia, mas longe do centro.", en: "I live near the beach, but far from the centre.", altEs: ["Eu moro perto da praia, mas longe do centro."], grammar: [g.prepositions-place, g.contractions-de], vocab: [w.perto, w.longe], transform: { instruction: "Swap: near the centre, far from the beach", answer: "Moro perto do centro, mas longe da praia.", alt: ["Eu moro perto do centro, mas longe da praia."], en: "I live near the centre, but far from the beach." } }
      - { es: "O gato está em cima da mesa.", en: "The cat is on the table.", altEs: ["O gato tá em cima da mesa."], altEn: ["The cat is on top of the table."], grammar: [g.prepositions-place, g.estar-present], vocab: [w.cima], error: { wrong: "O gato está em cima de a mesa.", explain: "de + a contracts: em cima da mesa.", grammar: g.prepositions-place } }
      - { es: "O carro está atrás do prédio.", en: "The car is behind the building.", altEs: ["O carro tá atrás do prédio."], grammar: [g.prepositions-place], vocab: [w.atrás] }
      - { es: "A escola fica em frente à igreja.", en: "The school is opposite the church.", altEs: ["A escola fica na frente da igreja.", "A escola fica em frente da igreja."], altEn: ["The school is in front of the church."], grammar: [g.prepositions-place], vocab: [w.frente] }
      - { es: "O banco fica entre a farmácia e o mercado.", en: "The bank is between the pharmacy and the market.", altEs: ["O banco é entre a farmácia e o mercado."], grammar: [g.prepositions-place], vocab: [w.entre] }
      - { es: "O Cristo fica lá em cima.", en: "Christ the Redeemer is up there.", altEs: ["O Cristo Redentor fica lá em cima."], grammar: [g.prepositions-place], vocab: [w.lá, w.cima] }
      - { es: "Tem uma padaria aqui perto?", en: "Is there a bakery near here?", altEs: ["Tem alguma padaria aqui perto?", "Há uma padaria aqui perto?"], altEn: ["Is there a bakery nearby?"], grammar: [g.tem-there-is, g.prepositions-place], vocab: [w.perto] }
      - { es: "Fica a dez minutos daqui.", en: "It's ten minutes from here.", altEs: ["É a dez minutos daqui."], altEn: ["It's ten minutes away."], grammar: [g.prepositions-place], vocab: [w.daqui] }
      - { es: "Os cachorros estão lá fora, no jardim.", en: "The dogs are outside, in the garden.", altEs: ["Os cachorros tão lá fora, no jardim."], grammar: [g.prepositions-place, g.estar-present], vocab: [w.fora] }
      - { es: "O que tem dentro do armário?", en: "What's inside the wardrobe?", altEs: ["O que há dentro do armário?"], altEn: ["What's in the cupboard?"], grammar: [g.prepositions-place, g.tem-there-is], vocab: [w.dentro] }
      - { es: "Meu vizinho é muito barulhento.", en: "My neighbour is very noisy.", altEs: ["O meu vizinho é muito barulhento.", "Minha vizinha é muito barulhenta."], grammar: [g.adjective-agreement], vocab: [w.vizinho, w.barulhento] }
      - { es: "A rua é tranquila, mas aquele bar ali é barulhento.", en: "The street is quiet, but that bar there is noisy.", altEs: ["A rua é tranquila, mas o bar ali é barulhento."], grammar: [g.adjective-agreement], vocab: [w.tranquilo, w.ali] }
      - { es: "Você está aí? — Estou, sim, aqui embaixo.", en: "Are you there? — Yes, I'm down here.", altEs: ["Você tá aí? — Tô, sim, aqui embaixo."], grammar: [g.prepositions-place, g.estar-present], vocab: [w.aí, w.embaixo] }
      - { es: "Meu quarto fica em cima da cozinha.", en: "My room is above the kitchen.", altEs: ["O meu quarto fica em cima da cozinha."], grammar: [g.prepositions-place, g.ficar-location], vocab: [w.cima], transform: { instruction: "Say it's below the kitchen", answer: "Meu quarto fica embaixo da cozinha.", alt: ["O meu quarto fica embaixo da cozinha."], en: "My room is below the kitchen." } }
    exchanges:
      - q: { es: "Tem uma farmácia aqui perto?", en: "Is there a pharmacy near here?" }
        a: { es: "Tem, sim. Fica ao lado do banco.", en: "Yes, there is. It's next to the bank." }
        alt: ["Tem, ali na esquina.", "Não, fica longe.", "Tem, sim."]
        grammar: [g.prepositions-place, g.tem-there-is]
        vocab: [w.perto, w.lado]
      - q: { es: "Onde está o gato?", en: "Where's the cat?" }
        a: { es: "Está embaixo da cama.", en: "It's under the bed." }
        alt: ["Embaixo da cama.", "Está lá fora.", "Em cima do sofá."]
        grammar: [g.prepositions-place, g.estar-present]
        vocab: [w.embaixo]
      - q: { es: "O centro fica longe daqui?", en: "Is the centre far from here?" }
        a: { es: "Não, fica a dez minutos.", en: "No, it's ten minutes away." }
        alt: ["Fica um pouco longe.", "Não, é perto.", "Fica, sim."]
        grammar: [g.prepositions-place, g.ficar-location]
        vocab: [w.longe, w.daqui]
      - q: { es: "Cadê você?", en: "Where are you?" }
        a: { es: "Estou aqui embaixo, na frente do prédio.", en: "I'm down here, in front of the building." }
        alt: ["Aqui embaixo.", "Na frente do prédio.", "Tô aqui fora."]
        grammar: [g.prepositions-place]
        vocab: [w.embaixo, w.frente]
      - q: { es: "Como é o seu vizinho?", en: "What's your neighbour like?" }
        a: { es: "É simpático, mas muito barulhento.", en: "He's nice, but very noisy." }
        alt: ["É tranquilo.", "É legal.", "É muito barulhento."]
        grammar: [g.adjective-agreement]
