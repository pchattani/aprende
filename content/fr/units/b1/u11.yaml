id: b1.u11
title: "Nice, à mon avis"
lessons:
  - id: b1.u11.l1
    title: À mon avis, c'est délicieux
    teach: [g.opinion-mood]
    vocab: [w.avis, w.à-mon-avis, w.opinion, w.selon, w.d-après, w.croire, w.trouver-que, w.il-me-semble-que, w.sembler, w.d-accord-avec, w.pas-du-tout, w.point-de-vue, w.certain, w.probable, w.évident, w.juste, w.injuste, w.normal, w.bizarre, w.étrange, w.charmant, w.pois-chiche, w.carnaval, w.convaincu, w.galet, w.animé, w.exagérer]
    tip: "Affirmative opinions take the indicative: je pense que c'est…, je crois qu'il a…, je trouve que c'est… À mon avis / selon moi / d'après moi + a normal sentence."
    sentences:
      - { es: "À mon avis, la socca est meilleure avec beaucoup de poivre.", en: "In my opinion, socca is better with lots of pepper.", altEs: ["Selon moi, la socca est meilleure avec beaucoup de poivre.", "D'après moi, la socca est meilleure avec beaucoup de poivre."], grammar: [g.opinion-mood, g.meilleur-mieux], vocab: [w.à-mon-avis, w.socca, w.poivre], error: { wrong: "Dans mon opinion, la socca est meilleure avec beaucoup de poivre.", explain: "'In my opinion' is à mon avis (or selon moi), never dans mon opinion.", grammar: g.opinion-mood } }
      - { es: "Je trouve que la promenade des Anglais est plus belle le matin.", en: "I think the Promenade des Anglais is more beautiful in the morning.", altEs: ["Je trouve la promenade des Anglais plus belle le matin."], grammar: [g.opinion-mood, g.comparatives], vocab: [w.trouver-que, w.promenade], transform: { instruction: "Start with À mon avis", answer: "À mon avis, la promenade des Anglais est plus belle le matin.", alt: ["Selon moi, la promenade des Anglais est plus belle le matin."], en: "In my opinion, the Promenade des Anglais is more beautiful in the morning." } }
      - { es: "Je crois que le carnaval de Nice a lieu en février.", en: "I think the Nice carnival takes place in February.", altEs: ["Je pense que le carnaval de Nice a lieu en février."], grammar: [g.opinion-mood], vocab: [w.croire, w.carnaval, w.avoir-lieu], transform: { instruction: "Make it negative (Je ne crois pas que…)", answer: "Je ne crois pas que le carnaval de Nice ait lieu en février.", en: "I don't think the Nice carnival takes place in February." } }
      - { es: "D'après moi, c'est normal de payer plus cher en été.", en: "As far as I'm concerned, it's normal to pay more in summer.", altEs: ["Selon moi, c'est normal de payer plus cher en été.", "Pour moi, c'est normal de payer plus cher en été."], grammar: [g.opinion-mood], vocab: [w.d-après, w.normal] }
      - { es: "Il me semble que le Vieux-Nice est plus animé que l'année dernière.", en: "It seems to me that Old Nice is livelier than last year.", altEs: ["J'ai l'impression que le Vieux-Nice est plus animé que l'année dernière."], grammar: [g.opinion-mood, g.comparatives], vocab: [w.il-me-semble-que, w.animé] }
      - { es: "Je suis d'accord avec toi : cette vue est magnifique.", en: "I agree with you: this view is magnificent.", altEs: ["Je suis d'accord avec toi, cette vue est magnifique."], grammar: [g.opinion-mood], vocab: [w.d-accord-avec, w.vue], error: { wrong: "J'ai d'accord avec toi : cette vue est magnifique.", explain: "Être d'accord, not avoir: je suis d'accord.", grammar: g.opinion-mood } }
      - { es: "Je suis certain que tu vas adorer la vue depuis la colline du Château.", en: "I'm certain you're going to love the view from Castle Hill.", altEs: ["Je suis certaine que tu vas adorer la vue depuis la colline du Château.", "Je suis sûr que tu vas adorer la vue depuis la colline du Château."], grammar: [g.opinion-mood, g.futur-proche], vocab: [w.certain, w.vue] }
      - { es: "C'est évident : cette plage est trop petite pour tout le monde.", en: "It's obvious: this beach is too small for everyone.", altEs: ["Il est évident que cette plage est trop petite pour tout le monde."], grammar: [g.opinion-mood, g.tres-trop-assez], vocab: [w.évident, w.plage] }
      - { es: "Il est probable qu'il pleuvra pendant le carnaval.", en: "It will probably rain during the carnival.", altEs: ["Il va probablement pleuvoir pendant le carnaval."], grammar: [g.opinion-mood, g.futur-irregular-stems], vocab: [w.probable, w.carnaval], note: "Il est probable que takes the indicative; il est possible que takes the subjonctif." }
      - { es: "Faire payer l'accès à la plage ? Je trouve ça injuste.", en: "Charging people to get onto the beach? I find that unfair.", altEs: ["Faire payer l'accès à la plage, je trouve ça injuste."], grammar: [g.opinion-mood], vocab: [w.injuste, w.plage] }
      - { es: "Les galets sur la plage ? Je trouve ça bizarre, mais on s'y habitue.", en: "Pebbles on the beach? I find it odd, but you get used to it.", altEs: ["Les galets sur la plage, je trouve ça bizarre, mais on s'y habitue."], grammar: [g.opinion-mood, g.pronoun-y], vocab: [w.galet, w.bizarre, w.s-habituer] }
      - { es: "Quel est ton point de vue sur les nouvelles pistes cyclables ?", en: "What's your view on the new cycle lanes?", altEs: ["Quelle est ton opinion sur les nouvelles pistes cyclables ?", "Qu'est-ce que tu penses des nouvelles pistes cyclables ?"], grammar: [g.quel], vocab: [w.point-de-vue, w.opinion, w.piste-cyclable] }
      - { es: "Elle semble convaincue que la ville est trop chère pour les jeunes.", en: "She seems convinced that the city is too expensive for young people.", altEs: ["Elle a l'air convaincue que la ville est trop chère pour les jeunes."], grammar: [g.opinion-mood], vocab: [w.sembler, w.convaincu] }
      - { es: "C'est étrange : tout le monde adore la socca, mais personne ne sait la faire.", en: "It's strange: everybody loves socca, but nobody knows how to make it.", altEs: ["C'est bizarre : tout le monde adore la socca, mais personne ne sait la faire."], grammar: [g.indefinite-pronouns], vocab: [w.étrange, w.socca] }
      - { es: "Le Vieux-Nice est charmant, à mon avis, en particulier le soir.", en: "Old Nice is charming, in my opinion, especially in the evening.", altEs: ["À mon avis, le Vieux-Nice est charmant, en particulier le soir."], grammar: [g.opinion-mood], vocab: [w.charmant, w.à-mon-avis] }
      - { es: "La socca est faite avec de la farine de pois chiche, de l'eau et de l'huile d'olive.", en: "Socca is made with chickpea flour, water and olive oil.", altEs: ["On fait la socca avec de la farine de pois chiche, de l'eau et de l'huile d'olive."], grammar: [g.passive-voice, g.partitive-articles], vocab: [w.pois-chiche, w.farine] }
    exchanges:
      - q: { es: "Qu'est-ce que tu penses de la socca ?", en: "What do you think of socca?" }
        a: { es: "Je trouve ça délicieux, mais un peu gras.", en: "I find it delicious, but a bit greasy." }
        alt: ["C'est délicieux !", "À mon avis, il faut beaucoup de poivre."]
        grammar: [g.opinion-mood]
        vocab: [w.trouver-que, w.socca]
      - q: { es: "Tu crois qu'il fera beau demain ?", en: "Do you think it'll be nice tomorrow?" }
        a: { es: "Je crois que oui : le ciel est tout bleu.", en: "I think so: the sky is completely blue." }
        alt: ["Je crois que oui.", "Je ne crois pas, la météo annonce de la pluie."]
        grammar: [g.opinion-mood]
        vocab: [w.croire, w.ciel]
      - q: { es: "Tu es d'accord avec moi ?", en: "Do you agree with me?" }
        a: { es: "Pas du tout ! Selon moi, tu exagères.", en: "Not at all! In my view, you're exaggerating." }
        alt: ["Oui, tout à fait.", "Pas vraiment."]
        grammar: [g.opinion-mood]
        vocab: [w.pas-du-tout, w.d-accord-avec, w.exagérer]
      - q: { es: "À ton avis, où est-ce qu'on mange la meilleure socca ?", en: "Where do you reckon you get the best socca?" }
        a: { es: "D'après les Niçois, au marché du cours Saleya.", en: "According to the people of Nice, at the Cours Saleya market." }
        alt: ["Au marché, à mon avis.", "Dans le Vieux-Nice."]
        grammar: [g.opinion-mood, g.superlatives]
        vocab: [w.avis, w.d-après]
      - q: { es: "Ça te semble normal de payer dix euros pour une chaise longue ?", en: "Does it seem normal to you to pay ten euros for a sun lounger?" }
        a: { es: "Non, je trouve ça beaucoup trop cher.", en: "No, I think that's far too expensive." }
        alt: ["Non, c'est trop cher.", "Oui, c'est normal en été."]
        grammar: [g.opinion-mood]
        vocab: [w.sembler, w.normal]
    texts:
      - title: "Avis sur un restaurant"
        es: ["Selon moi, c'est la meilleure socca du Vieux-Nice.", "Je trouve que les prix sont justes et que le service est charmant.", "Seul petit défaut : il me semble qu'on attend trop longtemps."]
        en: ["In my view, it's the best socca in Old Nice.", "I find the prices fair and the service charming.", "Only one small flaw: it seems to me you wait too long."]
        grammar: [g.opinion-mood]
        vocab: [w.selon, w.juste, w.il-me-semble-que]
      - title: "Le carnaval"
        es: ["Chaque février, Nice organise un grand carnaval.", "À mon avis, la bataille de fleurs est le plus beau moment.", "Mes amis, eux, croient que les défilés de nuit sont plus spectaculaires."]
        en: ["Every February, Nice holds a big carnival.", "In my opinion, the flower battle is the best moment.", "My friends, on the other hand, think the night parades are more spectacular."]
        grammar: [g.opinion-mood]
        vocab: [w.carnaval, w.à-mon-avis, w.croire]
    spicy:
      - { es: "À mon avis, tu es encore plus beau que la baie des Anges.", en: "In my opinion, you're even more beautiful than the Bay of Angels.", altEs: ["À mon avis, tu es encore plus belle que la baie des Anges."], grammar: [g.opinion-mood, g.comparatives], vocab: [w.à-mon-avis] }
      - { es: "Je trouve que tu danses très bien… pour quelqu'un qui marche sur mes pieds.", en: "I think you dance very well… for someone who's treading on my feet.", grammar: [g.opinion-mood], vocab: [w.trouver-que, w.danser] }
      - { es: "Il me semble que tu me regardes depuis une heure. Je me trompe ?", en: "It seems to me you've been looking at me for an hour. Am I wrong?", grammar: [g.opinion-mood, g.depuis-present], vocab: [w.il-me-semble-que, w.se-tromper] }
      - { es: "Selon ma meilleure amie, tu es exactement mon type.", en: "According to my best friend, you're exactly my type.", grammar: [g.opinion-mood], vocab: [w.selon] }
      - { es: "Je crois qu'on devrait partager une socca. Et peut-être un dessert.", en: "I think we should share a socca. And maybe a dessert.", grammar: [g.opinion-mood, g.conditional-advice], vocab: [w.croire, w.partager] }
  - id: b1.u11.l2
    title: Je ne pense pas que ce soit juste
    teach: [g.opinion-mood]
    vocab: [w.argument, w.justifier, w.débat, w.débattre, w.convaincre, w.critiquer, w.soutenir, w.partager, w.exprimer, w.s-exprimer, w.propos, w.à-propos, w.pour-ou-contre, w.contre, w.avantage, w.inconvénient, w.solution, w.résoudre, w.société, w.citoyen, w.voter, w.élection, w.mairie, w.maire, w.officiel, w.croisière, w.raisonnable]
    tip: "Negative and inverted opinions usually take the subjonctif: je ne pense pas que ce soit…, crois-tu qu'il ait raison ? In casual speech you'll hear the indicative, but write the subjonctif."
    sentences:
      - { es: "Je ne pense pas que ce soit une bonne idée de construire un nouvel hôtel.", en: "I don't think it's a good idea to build a new hotel.", altEs: ["Je ne crois pas que ce soit une bonne idée de construire un nouvel hôtel."], grammar: [g.opinion-mood, g.subjonctif-irregular], vocab: [w.construire, w.hôtel] }
      - { es: "Je ne crois pas que les touristes soient le vrai problème.", en: "I don't think tourists are the real problem.", altEs: ["Je ne pense pas que les touristes soient le vrai problème."], grammar: [g.opinion-mood, g.subjonctif-irregular], vocab: [w.croire, w.touriste], error: { wrong: "Je ne crois pas que les touristes sont le vrai problème.", explain: "In careful French a negative opinion takes the subjonctif: je ne crois pas qu'ils soient.", grammar: g.opinion-mood } }
      - { es: "Penses-tu que la mairie puisse résoudre le problème ?", en: "Do you think the town hall can solve the problem?", altEs: ["Tu penses que la mairie peut résoudre le problème ?", "Crois-tu que la mairie puisse résoudre le problème ?"], grammar: [g.opinion-mood, g.subjonctif-irregular, g.inversion-questions], vocab: [w.mairie, w.résoudre] }
      - { es: "Je ne trouve pas que la ville soit trop chère.", en: "I don't think the city is too expensive.", grammar: [g.opinion-mood], vocab: [w.trouver-que, w.ville], transform: { instruction: "Make it affirmative (Je trouve que…)", answer: "Je trouve que la ville est trop chère.", en: "I think the city is too expensive." } }
      - { es: "Je ne suis pas sûre qu'il ait raison.", en: "I'm not sure he's right.", altEs: ["Je ne suis pas sûr qu'il ait raison.", "Je ne suis pas certaine qu'il ait raison."], grammar: [g.opinion-mood, g.subjonctif-irregular], vocab: [w.raison] }
      - { es: "Je crois que le maire a raison.", en: "I think the mayor is right.", altEs: ["Je pense que le maire a raison."], grammar: [g.opinion-mood], vocab: [w.maire, w.raison], transform: { instruction: "Make it negative (Je ne crois pas que…)", answer: "Je ne crois pas que le maire ait raison.", alt: ["Je ne pense pas que le maire ait raison."], en: "I don't think the mayor is right." } }
      - { es: "Je pense que c'est la meilleure solution.", en: "I think it's the best solution.", altEs: ["Je crois que c'est la meilleure solution."], grammar: [g.opinion-mood, g.superlatives], vocab: [w.solution], error: { wrong: "Je pense que ce soit la meilleure solution.", explain: "An affirmative opinion takes the indicative: je pense que c'est…", grammar: g.opinion-mood } }
      - { es: "Pendant le débat, chaque candidat a justifié ses arguments.", en: "During the debate, each candidate justified their arguments.", altEs: ["Pendant le débat, chaque candidat a défendu ses arguments."], grammar: [g.tout-chaque-plusieurs], vocab: [w.débat, w.justifier, w.argument] }
      - { es: "Le maire a essayé de convaincre les habitants, mais beaucoup le critiquent.", en: "The mayor tried to convince the residents, but many criticise him.", altEs: ["La maire a essayé de convaincre les habitants, mais beaucoup la critiquent."], grammar: [g.connectors-opposition, g.direct-object-pronouns], vocab: [w.convaincre, w.critiquer] }
      - { es: "Je soutiens ce projet parce qu'il aide d'abord les habitants.", en: "I support this project because it helps the residents first.", altEs: ["Je soutiens ce projet, car il aide d'abord les habitants."], grammar: [g.connectors-cause-consequence], vocab: [w.soutenir, w.projet] }
      - { es: "Chacun a le droit de s'exprimer pendant le débat.", en: "Everyone has the right to speak during the debate.", altEs: ["Tout le monde a le droit de s'exprimer pendant le débat."], grammar: [g.indefinite-pronouns], vocab: [w.s-exprimer, w.débat] }
      - { es: "Quels sont les avantages et les inconvénients du tourisme pour la ville ?", en: "What are the advantages and disadvantages of tourism for the city?", grammar: [g.quel], vocab: [w.avantage, w.inconvénient] }
      - { es: "À propos, tu vas voter dimanche ?", en: "By the way, are you going to vote on Sunday?", altEs: ["Au fait, tu vas voter dimanche ?"], grammar: [g.futur-proche], vocab: [w.à-propos, w.voter] }
      - { es: "Tu es pour ou contre les bateaux de croisière dans le port ?", en: "Are you for or against cruise ships in the harbour?", altEs: ["Tu es pour ou contre les paquebots de croisière dans le port ?"], grammar: [g.yes-no-questions], vocab: [w.pour-ou-contre, w.croisière] }
      - { es: "Les citoyens attendent le résultat officiel de l'élection.", en: "Citizens are waiting for the official election result.", altEs: ["Les citoyens attendent les résultats officiels de l'élection."], grammar: [g.adjective-agreement], vocab: [w.citoyen, w.officiel, w.élection] }
      - { es: "Je ne suis pas convaincu que ce soit la seule solution pour notre société.", en: "I'm not convinced it's the only solution for our society.", altEs: ["Je ne suis pas convaincue que ce soit la seule solution pour notre société."], grammar: [g.opinion-mood], vocab: [w.convaincu, w.société] }
    exchanges:
      - q: { es: "Tu penses que c'est une bonne idée ?", en: "Do you think it's a good idea?" }
        a: { es: "Non, je ne pense pas que ce soit une bonne idée.", en: "No, I don't think it's a good idea." }
        alt: ["Oui, je pense que c'est une excellente idée.", "Je ne suis pas sûr que ce soit une bonne idée."]
        grammar: [g.opinion-mood]
        vocab: [w.idée]
      - q: { es: "Tu vas voter pour qui ?", en: "Who are you going to vote for?" }
        a: { es: "Je ne sais pas encore : aucun candidat ne m'a convaincu.", en: "I don't know yet: no candidate has convinced me." }
        alt: ["Je ne sais pas encore.", "C'est un secret !"]
        grammar: [g.ni-ni-aucun]
        vocab: [w.voter, w.convaincre]
      - q: { es: "Crois-tu qu'il ait raison ?", en: "Do you think he's right?" }
        a: { es: "Je ne crois pas qu'il ait tort, mais il exagère un peu.", en: "I don't think he's wrong, but he's exaggerating a bit." }
        alt: ["Oui, je crois qu'il a raison.", "Non, je ne crois pas qu'il ait raison."]
        grammar: [g.opinion-mood, g.subjonctif-irregular]
        vocab: [w.raison, w.exagérer]
      - q: { es: "Quels sont les avantages du tourisme ?", en: "What are the advantages of tourism?" }
        a: { es: "Il crée des emplois, mais il fait aussi monter les prix.", en: "It creates jobs, but it also pushes prices up." }
        alt: ["Il crée du travail.", "Il apporte de l'argent à la ville."]
        grammar: [g.connectors-opposition]
        vocab: [w.avantage, w.emploi]
      - q: { es: "Tu es pour ou contre ?", en: "Are you for or against?" }
        a: { es: "Plutôt pour, mais je comprends les arguments contre.", en: "Rather for, but I understand the arguments against." }
        alt: ["Pour !", "Contre, sans hésiter."]
        grammar: [g.connectors-opposition]
        vocab: [w.pour-ou-contre, w.argument]
    texts:
      - title: "Courrier des lecteurs"
        es: ["Je ne pense pas que les bateaux de croisière soient bons pour Nice.", "Ils amènent beaucoup de monde, mais ils polluent l'air du port.", "Et je ne crois pas que la mairie fasse assez pour les habitants."]
        en: ["I don't think cruise ships are good for Nice.", "They bring lots of people, but they pollute the air in the harbour.", "And I don't think the town hall does enough for the residents."]
        grammar: [g.opinion-mood]
        vocab: [w.croisière, w.mairie]
      - title: "Débat à la mairie"
        es: ["Ce soir, débat public à la mairie : pour ou contre une nouvelle plage privée ?", "Tous les citoyens pourront s'exprimer.", "Le maire présentera son projet et répondra aux critiques."]
        en: ["Tonight, public debate at the town hall: for or against a new private beach?", "All citizens will be able to have their say.", "The mayor will present his project and answer criticism."]
        grammar: [g.futur-simple-forms]
        vocab: [w.débat, w.citoyen, w.s-exprimer]
    spicy:
      - { es: "Je ne crois pas que tu sois venu ici juste pour la socca.", en: "I don't believe you came here just for the socca.", altEs: ["Je ne crois pas que tu sois venue ici juste pour la socca."], grammar: [g.opinion-mood, g.subjonctif-irregular], vocab: [w.croire] }
      - { es: "Je ne pense pas que ce soit raisonnable… mais on se revoit demain ?", en: "I don't think this is sensible… but shall we see each other tomorrow?", grammar: [g.opinion-mood], vocab: [w.raisonnable] }
      - { es: "Je ne suis pas sûre que tu saches danser. Prouve-le-moi.", en: "I'm not sure you know how to dance. Prove it to me.", altEs: ["Je ne suis pas sûr que tu saches danser. Prouve-le-moi."], grammar: [g.opinion-mood, g.pronoun-order-imperative], vocab: [w.danser, w.prouver] }
      - { es: "Pour ou contre un dernier verre ? Moi, je vote pour.", en: "For or against one last drink? I vote for.", grammar: [g.opinion-mood], vocab: [w.pour-ou-contre, w.voter] }
      - { es: "Tu penses vraiment que je vais te laisser partir sans ton numéro ?", en: "Do you really think I'm going to let you leave without your number?", grammar: [g.opinion-mood, g.futur-proche], vocab: [w.penser] }
  - id: b1.u11.l3
    title: Parce que, donc, c'est pourquoi
    teach: [g.connectors-cause-consequence]
    vocab: [w.car, w.donc, w.puisque, w.c-est-pourquoi, w.par-conséquent, w.en-effet, w.tellement, w.cause, w.conséquence, w.fréquenter, w.attirer, w.augmenter, w.diminuer, w.baisser, w.logement, w.bouchon, w.embouteillage, w.circulation, w.transports-en-commun, w.grève, w.insécurité, w.local, w.financer, w.signe]
    tip: "Cause: parce que, car (never first), puisque (obvious cause), comme (at the start), à cause de / grâce à + noun. Consequence: donc, alors, c'est pourquoi, par conséquent, du coup (spoken)."
    sentences:
      - { es: "Comme il y avait trop de monde sur la plage, nous sommes allés sur les rochers.", en: "As there were too many people on the beach, we went onto the rocks.", altEs: ["Comme il y avait trop de monde sur la plage, on est allés sur les rochers."], grammar: [g.connectors-cause-consequence], vocab: [w.plage, w.rocher] }
      - { es: "Grâce à son climat doux, Nice attire des visiteurs toute l'année.", en: "Thanks to its mild climate, Nice attracts visitors all year round.", altEs: ["Nice attire des visiteurs toute l'année grâce à son climat doux."], grammar: [g.connectors-cause-consequence], vocab: [w.attirer, w.climat], transform: { instruction: "Use parce que + a clause", answer: "Nice attire des visiteurs toute l'année parce que son climat est doux.", alt: ["Parce que son climat est doux, Nice attire des visiteurs toute l'année."], en: "Nice attracts visitors all year round because its climate is mild." } }
      - { es: "Les loyers augmentent, c'est pourquoi beaucoup de jeunes quittent le centre.", en: "Rents are going up, which is why many young people are leaving the centre.", altEs: ["Les loyers augmentent, donc beaucoup de jeunes quittent le centre."], grammar: [g.connectors-cause-consequence], vocab: [w.augmenter, w.c-est-pourquoi, w.loyer] }
      - { es: "Il y avait des embouteillages sur la Promenade, du coup on a raté le défilé.", en: "There were traffic jams on the Promenade, so we missed the parade.", altEs: ["Il y avait des bouchons sur la Promenade, alors on a raté le défilé."], grammar: [g.connectors-cause-consequence], vocab: [w.embouteillage, w.rater] }
      - { es: "Je prends le tram parce que la circulation est épouvantable en voiture.", en: "I take the tram because the traffic is dreadful by car.", altEs: ["Je prends le tram, car la circulation est épouvantable en voiture."], grammar: [g.connectors-cause-consequence], vocab: [w.circulation, w.tramway] }
      - { es: "Puisque tu connais la ville, choisis le restaurant !", en: "Since you know the city, you choose the restaurant!", altEs: ["Puisque tu connais bien la ville, choisis le restaurant !"], grammar: [g.connectors-cause-consequence, g.imperative], vocab: [w.puisque, w.connaître] }
      - { es: "À cause de la grève, il y a eu d'énormes bouchons.", en: "Because of the strike, there were huge traffic jams.", altEs: ["À cause de la grève, il y a eu des bouchons énormes."], grammar: [g.connectors-cause-consequence], vocab: [w.grève, w.bouchon], error: { wrong: "Grâce à la grève, il y a eu d'énormes bouchons.", explain: "Grâce à is only for good results; for a bad result use à cause de.", grammar: g.connectors-cause-consequence } }
      - { es: "Il fait tellement chaud qu'on ne peut pas marcher pieds nus sur les galets.", en: "It's so hot you can't walk barefoot on the pebbles.", altEs: ["Il fait si chaud qu'on ne peut pas marcher pieds nus sur les galets."], grammar: [g.connectors-cause-consequence], vocab: [w.tellement, w.galet] }
      - { es: "Les prix ont baissé, car il y a moins de touristes en novembre.", en: "Prices have come down, because there are fewer tourists in November.", altEs: ["Les prix ont baissé parce qu'il y a moins de touristes en novembre."], grammar: [g.connectors-cause-consequence], vocab: [w.baisser, w.car], error: { wrong: "Car il y a moins de touristes en novembre, les prix ont baissé.", explain: "Car never starts a sentence; use comme at the start: Comme il y a moins de touristes…", grammar: g.connectors-cause-consequence } }
      - { es: "Le nombre de voitures a diminué ; par conséquent, l'air est plus propre.", en: "The number of cars has gone down; consequently, the air is cleaner.", altEs: ["Le nombre de voitures a diminué, donc l'air est plus propre."], grammar: [g.connectors-cause-consequence], vocab: [w.diminuer, w.par-conséquent] }
      - { es: "En effet, beaucoup d'habitants se plaignent du bruit la nuit.", en: "Indeed, many residents complain about the noise at night.", altEs: ["Effectivement, beaucoup d'habitants se plaignent du bruit la nuit."], grammar: [g.connectors-cause-consequence], vocab: [w.en-effet, w.bruit] }
      - { es: "La ville finance des logements pour les familles locales.", en: "The city is funding housing for local families.", altEs: ["La mairie finance des logements pour les familles locales."], grammar: [g.adjective-agreement], vocab: [w.financer, w.logement, w.local] }
      - { es: "Le maire dit que la lutte contre l'insécurité est sa priorité.", en: "The mayor says that tackling crime is his priority.", altEs: ["Le maire affirme que la lutte contre l'insécurité est sa priorité."], grammar: [g.discours-indirect], vocab: [w.insécurité, w.maire] }
      - { es: "Ils fréquentent ce café depuis des années, donc tout le monde les connaît.", en: "They've been going to this café for years, so everyone knows them.", altEs: ["Ils fréquentent ce café depuis des années, alors tout le monde les connaît."], grammar: [g.connectors-cause-consequence, g.depuis-present], vocab: [w.fréquenter, w.donc] }
      - { es: "Quelle est la cause du problème, et quelles en sont les conséquences ?", en: "What is the cause of the problem, and what are its consequences?", grammar: [g.quel, g.pronoun-en], vocab: [w.cause, w.conséquence] }
      - { es: "Je reste à l'hôtel parce qu'il pleut.", en: "I'm staying at the hotel because it's raining.", altEs: ["Je reste à l'hôtel, car il pleut."], grammar: [g.connectors-cause-consequence], vocab: [w.pleuvoir], transform: { instruction: "Start the sentence with Comme", answer: "Comme il pleut, je reste à l'hôtel.", en: "As it's raining, I'm staying at the hotel." } }
    exchanges:
      - q: { es: "Pourquoi tu prends toujours le tram ?", en: "Why do you always take the tram?" }
        a: { es: "Parce que c'est plus rapide que la voiture, en particulier le soir.", en: "Because it's quicker than the car, especially in the evening." }
        alt: ["Parce que c'est plus rapide.", "Parce que je ne trouve jamais de place pour me garer."]
        grammar: [g.connectors-cause-consequence]
        vocab: [w.tramway]
      - q: { es: "Pourquoi tant de gens viennent à Nice ?", en: "Why do so many people come to Nice?" }
        a: { es: "Grâce au soleil, à la mer et à la socca, bien sûr !", en: "Thanks to the sun, the sea and socca, of course!" }
        alt: ["Grâce au climat.", "Parce qu'il fait beau toute l'année."]
        grammar: [g.connectors-cause-consequence]
        vocab: [w.soleil, w.mer]
      - q: { es: "Tu es arrivé en retard ?", en: "Did you arrive late?" }
        a: { es: "Oui, il y avait une grève, du coup j'ai dû marcher.", en: "Yes, there was a strike, so I had to walk." }
        alt: ["Oui, à cause des bouchons.", "Oui, il y avait une grève, donc j'ai marché."]
        grammar: [g.connectors-cause-consequence]
        vocab: [w.grève, w.en-retard]
      - q: { es: "Pourquoi les jeunes quittent le centre-ville ?", en: "Why are young people leaving the town centre?" }
        a: { es: "Parce que les loyers ont tellement augmenté qu'ils ne peuvent plus payer.", en: "Because rents have gone up so much that they can't pay any more." }
        alt: ["À cause des loyers.", "Parce que les logements sont trop chers."]
        grammar: [g.connectors-cause-consequence]
        vocab: [w.loyer, w.augmenter]
      - q: { es: "On va à la plage ?", en: "Shall we go to the beach?" }
        a: { es: "Puisque tu insistes… mais à mon avis, il y aura trop de monde.", en: "Since you insist… but in my opinion there'll be too many people." }
        alt: ["Oui, allons-y !", "Non, il fait trop chaud."]
        grammar: [g.connectors-cause-consequence, g.opinion-mood]
        vocab: [w.puisque, w.insister]
    texts:
      - title: "Info trafic"
        es: ["Grève des transports en commun ce jeudi.", "Par conséquent, la circulation sera difficile dans le centre.", "C'est pourquoi la mairie conseille de partir plus tôt ou de travailler chez soi."]
        en: ["Public transport strike this Thursday.", "As a result, traffic will be difficult in the centre.", "That's why the town hall advises leaving earlier or working from home."]
        grammar: [g.connectors-cause-consequence]
        vocab: [w.grève, w.par-conséquent, w.c-est-pourquoi]
      - title: "Mail à un ami"
        es: ["Comme il pleuvait hier, on est restés à l'hôtel.", "Aujourd'hui, il fait tellement beau qu'on a passé la journée à la plage.", "Bref, on adore Nice !"]
        en: ["As it was raining yesterday, we stayed at the hotel.", "Today it's so sunny that we spent the day at the beach.", "In short, we love Nice!"]
        grammar: [g.connectors-cause-consequence]
        vocab: [w.tellement, w.bref]
    spicy:
      - { es: "Comme tu es libre ce soir et moi aussi, c'est un signe, non ?", en: "Since you're free tonight and so am I, it's a sign, isn't it?", grammar: [g.connectors-cause-consequence], vocab: [w.libre, w.signe] }
      - { es: "Il fait tellement chaud… c'est toi ou c'est le soleil ?", en: "It's so hot… is it you or the sun?", grammar: [g.connectors-cause-consequence], vocab: [w.tellement, w.soleil] }
      - { es: "J'ai raté mon bus à cause de ton sourire. Tu me ramènes ?", en: "I missed my bus because of your smile. Will you give me a lift home?", grammar: [g.connectors-cause-consequence], vocab: [w.rater, w.sourire] }
      - { es: "Puisque tu insistes, je veux bien danser avec toi.", en: "Since you insist, I'll happily dance with you.", grammar: [g.connectors-cause-consequence], vocab: [w.puisque, w.danser] }
      - { es: "Tu es charmant, c'est pourquoi je me méfie.", en: "You're charming, which is why I'm wary.", altEs: ["Tu es charmante, c'est pourquoi je me méfie."], grammar: [g.connectors-cause-consequence], vocab: [w.charmant, w.c-est-pourquoi] }
  - id: b1.u11.l4
    title: Pourtant, par contre, malgré tout
    teach: [g.connectors-opposition]
    vocab: [w.alors-que, w.cependant, w.malgré, w.bien-que, w.en-revanche, w.au-contraire, w.d-un-côté, w.de-l-autre, w.bref, w.en-conclusion, w.limiter, w.piste-cyclable, w.espace-vert, w.piéton, w.zone-piétonne, w.trottoir, w.se-garer, w.stationnement, w.autoroute, w.péage, w.station-service, w.permis, w.amende, w.circuler, w.plaque, w.agréable, w.bloquer, w.compliqué]
    tip: "Pourtant (and yet: surprise), par contre / en revanche (on the other hand), alors que (whereas), malgré + noun, même si + indicative. Bien que + subjonctif comes at B2, but you'll meet it here."
    sentences:
      - { es: "Le tourisme fait vivre Nice ; pourtant, beaucoup de Niçois s'en plaignent.", en: "Tourism keeps Nice alive; yet many people from Nice complain about it.", altEs: ["Le tourisme fait vivre Nice, pourtant beaucoup de Niçois s'en plaignent."], grammar: [g.connectors-opposition, g.pronoun-en], vocab: [w.tourisme, w.se-plaindre] }
      - { es: "Le Vieux-Nice est charmant ; par contre, il est difficile de s'y garer.", en: "Old Nice is charming; on the other hand, it's hard to park there.", altEs: ["Le Vieux-Nice est charmant, par contre il est difficile de s'y garer."], grammar: [g.connectors-opposition, g.pronoun-y], vocab: [w.se-garer, w.charmant] }
      - { es: "Malgré la pluie, le carnaval a eu lieu.", en: "Despite the rain, the carnival went ahead.", altEs: ["Le carnaval a eu lieu malgré la pluie."], grammar: [g.connectors-opposition], vocab: [w.malgré, w.carnaval], transform: { instruction: "Use même si + a clause", answer: "Même s'il a plu, le carnaval a eu lieu.", alt: ["Le carnaval a eu lieu même s'il a plu."], en: "Even though it rained, the carnival went ahead." }, error: { wrong: "Malgré qu'il pleuve, le carnaval a eu lieu.", explain: "Malgré is followed by a noun (malgré la pluie); malgré que is avoided in careful French.", grammar: g.connectors-opposition } }
      - { es: "Même s'il fait froid, certains Niçois se baignent le premier janvier.", en: "Even if it's cold, some people in Nice go swimming on the first of January.", altEs: ["Même quand il fait froid, certains Niçois se baignent le premier janvier."], grammar: [g.connectors-opposition], vocab: [w.se-baigner], error: { wrong: "Même s'il fasse froid, certains Niçois se baignent le premier janvier.", explain: "Même si takes the indicative, never the subjonctif: même s'il fait froid.", grammar: g.connectors-opposition } }
      - { es: "Le centre est très animé, alors que les collines sont calmes.", en: "The centre is very lively, whereas the hills are calm.", altEs: ["Le centre est très animé, tandis que les collines sont calmes."], grammar: [g.connectors-opposition], vocab: [w.alors-que, w.animé] }
      - { es: "La ville est chère, mais elle reste très populaire.", en: "The city is expensive, but it remains very popular.", grammar: [g.connectors-opposition], vocab: [w.ville, w.populaire], transform: { instruction: "Use bien que (+ subjonctif)", answer: "Bien que la ville soit chère, elle reste très populaire.", en: "Although the city is expensive, it remains very popular." } }
      - { es: "La zone piétonne est agréable ; en revanche, les livraisons sont compliquées.", en: "The pedestrian area is pleasant; on the other hand, deliveries are complicated.", altEs: ["La zone piétonne est agréable, par contre les livraisons sont compliquées."], grammar: [g.connectors-opposition], vocab: [w.zone-piétonne, w.en-revanche] }
      - { es: "D'un côté, les pistes cyclables sont pratiques ; de l'autre, elles prennent des places de stationnement.", en: "On the one hand, the cycle lanes are practical; on the other, they take up parking spaces.", altEs: ["D'un côté, les pistes cyclables sont pratiques, de l'autre, elles prennent des places de stationnement."], grammar: [g.connectors-opposition], vocab: [w.d-un-côté, w.de-l-autre, w.piste-cyclable, w.stationnement] }
      - { es: "Moi, au contraire, je trouve qu'il manque des espaces verts dans le centre.", en: "I, on the contrary, think there aren't enough green spaces in the centre.", altEs: ["Au contraire, je trouve qu'il manque des espaces verts dans le centre."], grammar: [g.connectors-opposition, g.opinion-mood], vocab: [w.au-contraire, w.espace-vert] }
      - { es: "Il a eu une amende parce qu'il s'était garé sur le trottoir.", en: "He got a fine because he had parked on the pavement.", altEs: ["Il a eu une contravention parce qu'il s'était garé sur le trottoir."], grammar: [g.plus-que-parfait, g.connectors-cause-consequence], vocab: [w.amende, w.trottoir] }
      - { es: "Les piétons circulent librement dans la vieille ville, alors que les voitures sont interdites.", en: "Pedestrians move about freely in the old town, whereas cars are banned.", altEs: ["Les piétons circulent librement dans la vieille ville, tandis que les voitures sont interdites."], grammar: [g.connectors-opposition], vocab: [w.piéton, w.circuler] }
      - { es: "On peut éviter le péage ; pourtant, l'autoroute est beaucoup plus rapide.", en: "You can avoid the toll; and yet the motorway is much faster.", altEs: ["On peut éviter le péage, mais l'autoroute est beaucoup plus rapide."], grammar: [g.connectors-opposition], vocab: [w.péage, w.autoroute] }
      - { es: "Je n'ai pas encore mon permis ; cependant, je conduis déjà avec mon père.", en: "I don't have my licence yet; however, I already drive with my father.", altEs: ["Je n'ai pas encore mon permis, mais je conduis déjà avec mon père."], grammar: [g.connectors-opposition], vocab: [w.permis, w.conduire] }
      - { es: "Fais le plein à la station-service avant de prendre l'autoroute.", en: "Fill up at the petrol station before getting on the motorway.", altEs: ["Fais le plein à la station-service avant d'aller sur l'autoroute."], grammar: [g.apres-avoir-avant-de, g.imperative], vocab: [w.station-service, w.autoroute] }
      - { es: "Sa voiture a des plaques étrangères, mais il parle français comme un Niçois.", en: "His car has foreign plates, but he speaks French like someone from Nice.", grammar: [g.connectors-opposition], vocab: [w.plaque, w.étranger] }
      - { es: "Bref, en conclusion, il faut limiter les voitures sans oublier ceux qui en ont besoin.", en: "So, in conclusion, we need to limit cars without forgetting those who need them.", altEs: ["En conclusion, il faut limiter les voitures sans oublier ceux qui en ont besoin."], grammar: [g.connectors-opposition, g.pour-sans-infinitive], vocab: [w.bref, w.en-conclusion, w.limiter] }
    exchanges:
      - q: { es: "Tu aimes vivre à Nice ?", en: "Do you like living in Nice?" }
        a: { es: "Oui, j'adore la mer ; par contre, les loyers sont trop chers.", en: "Yes, I love the sea; on the other hand, rents are too high." }
        alt: ["Oui, beaucoup.", "Oui, malgré les prix."]
        grammar: [g.connectors-opposition]
        vocab: [w.loyer, w.mer]
      - q: { es: "On y va en voiture ?", en: "Shall we go by car?" }
        a: { es: "Non, on ne pourra pas se garer. En revanche, le tram passe juste devant.", en: "No, we won't be able to park. On the other hand, the tram goes right past." }
        alt: ["Non, prenons le tram.", "Oui, mais on se garera loin."]
        grammar: [g.connectors-opposition]
        vocab: [w.se-garer, w.en-revanche]
      - q: { es: "Tu as eu une amende ?", en: "Did you get a fine?" }
        a: { es: "Oui, je m'étais garé sur une place de livraison.", en: "Yes, I'd parked in a delivery bay." }
        alt: ["Oui, je m'étais garée sur une place de livraison.", "Oui, cinquante euros !"]
        grammar: [g.plus-que-parfait]
        vocab: [w.amende, w.se-garer]
      - q: { es: "Il pleut ! On annule la sortie ?", en: "It's raining! Shall we cancel the outing?" }
        a: { es: "Mais non, on y va quand même, malgré la pluie !", en: "Of course not, we're going anyway, despite the rain!" }
        alt: ["Non, on y va quand même.", "Oui, on reste à la maison."]
        grammar: [g.connectors-opposition]
        vocab: [w.malgré, w.pluie]
      - q: { es: "Alors, en conclusion, tu es pour ou contre la zone piétonne ?", en: "So, in conclusion, are you for or against the pedestrian area?" }
        a: { es: "Pour, même si ce n'est pas toujours pratique.", en: "For, even if it isn't always practical." }
        alt: ["Pour !", "Contre, à cause des livraisons."]
        grammar: [g.connectors-opposition]
        vocab: [w.zone-piétonne, w.en-conclusion]
    texts:
      - title: "Lettre au maire"
        es: ["Monsieur le Maire, la nouvelle zone piétonne est très agréable.", "Cependant, les personnes âgées ont du mal à venir en centre-ville.", "Ne serait-il pas possible de créer quelques places de stationnement à côté ?"]
        en: ["Dear Mr Mayor, the new pedestrian area is very pleasant.", "However, elderly people find it hard to get into the town centre.", "Would it not be possible to create a few parking spaces nearby?"]
        grammar: [g.connectors-opposition, g.conditional-politeness]
        vocab: [w.zone-piétonne, w.cependant, w.stationnement]
      - title: "Bilan"
        es: ["D'un côté, les pistes cyclables ont fait baisser la circulation.", "De l'autre, les commerçants se plaignent de perdre des clients.", "Bref, le débat n'est pas fini."]
        en: ["On the one hand, the cycle lanes have reduced traffic.", "On the other, shopkeepers complain about losing customers.", "In short, the debate isn't over."]
        grammar: [g.connectors-opposition]
        vocab: [w.d-un-côté, w.de-l-autre, w.bref]
    spicy:
      - { es: "Tu dis que tu n'es pas romantique ; pourtant, tu m'as apporté des fleurs.", en: "You say you're not romantic; and yet you brought me flowers.", grammar: [g.connectors-opposition], vocab: [w.romantique, w.fleur] }
      - { es: "Malgré tes blagues nulles, je passe une excellente soirée.", en: "Despite your terrible jokes, I'm having a wonderful evening.", grammar: [g.connectors-opposition], vocab: [w.malgré, w.soirée] }
      - { es: "D'un côté, je devrais rentrer ; de l'autre, la nuit est encore jeune.", en: "On the one hand, I should go home; on the other, the night is still young.", grammar: [g.connectors-opposition, g.conditional-advice], vocab: [w.d-un-côté, w.de-l-autre] }
      - { es: "Même si tu chantes faux, je veux bien chanter encore une chanson avec toi.", en: "Even if you sing out of tune, I'm happy to sing one more song with you.", grammar: [g.connectors-opposition], vocab: [w.chanter, w.chanson] }
      - { es: "Je déteste les bouchons ; par contre, être bloqué dans une voiture avec toi, ça va.", en: "I hate traffic jams; on the other hand, being stuck in a car with you is fine.", altEs: ["Je déteste les bouchons ; par contre, être bloquée dans une voiture avec toi, ça va."], grammar: [g.connectors-opposition], vocab: [w.bouchon, w.bloquer] }
dialogues:
  - id: b1.u11.d1
    title: Débat en terrasse
    context: In a café in Old Nice, Manon, who grew up in Nice, and her friend Karim argue about tourism.
    lines:
      - { speaker: Manon, es: "Tu as vu ? Encore trois bateaux de croisière dans le port ce matin.", en: "Did you see? Another three cruise ships in the harbour this morning." }
      - { speaker: Karim, es: "Et alors ? À mon avis, c'est bon pour la ville : les touristes dépensent de l'argent.", en: "So what? In my opinion it's good for the city: the tourists spend money." }
      - { speaker: Manon, es: "Je ne pense pas que ce soit si simple. Ils restent quelques heures, donc ils ne dépensent presque rien.", en: "I don't think it's that simple. They stay a few hours, so they spend almost nothing." }
      - { speaker: Karim, es: "Peut-être, mais grâce au tourisme, beaucoup de Niçois ont un travail.", en: "Maybe, but thanks to tourism, lots of people in Nice have a job." }
      - { speaker: Manon, es: "C'est vrai. Pourtant, les loyers ont tellement augmenté que mes amis quittent le centre.", en: "That's true. And yet rents have gone up so much that my friends are leaving the centre." }
      - { speaker: Karim, es: "D'un côté, je te comprends ; de l'autre, la ville ne peut pas fermer ses portes.", en: "On the one hand I understand you; on the other, the city can't close its doors." }
      - { speaker: Manon, es: "Je ne dis pas ça ! Je crois qu'il faut limiter les locations pour les touristes, c'est tout.", en: "I'm not saying that! I think we need to limit holiday rentals, that's all." }
      - { speaker: Karim, es: "Là, je suis d'accord avec toi. Il me semble que c'est une solution juste.", en: "There I agree with you. It seems to me that's a fair solution." }
      - { speaker: Manon, es: "Bref, on n'est pas si différents. On partage une socca pour fêter ça ?", en: "So, we're not that different. Shall we share a socca to celebrate?" }
      - { speaker: Karim, es: "Avec plaisir, puisque c'est toi qui invites !", en: "With pleasure, since it's your treat!" }
    questions:
      - { q: "Au début, que pense Karim des bateaux de croisière ?", options: ["Qu'ils sont bons pour la ville", "Qu'ils polluent trop", "Qu'il faut les interdire"], answer: 0, explain: "À mon avis, c'est bon pour la ville." }
      - { q: "Selon Manon, pourquoi les passagers des bateaux dépensent-ils peu ?", options: ["Ils n'aiment pas Nice", "Ils restent seulement quelques heures", "Tout est trop cher"], answer: 1, explain: "Ils restent quelques heures, donc ils ne dépensent presque rien." }
      - { q: "Pourquoi les amis de Manon quittent-ils le centre ?", options: ["À cause du bruit", "Parce qu'ils ont trouvé du travail ailleurs", "Parce que les loyers ont beaucoup augmenté"], answer: 2, explain: "Les loyers ont tellement augmenté que mes amis quittent le centre." }
      - { q: "Sur quoi sont-ils d'accord à la fin ?", options: ["Construire de nouveaux hôtels", "Limiter les locations pour les touristes", "Fermer le port"], answer: 1, explain: "Karim agrees that limiting holiday rentals is a fair solution." }
writing:
  - task: "A friend asks what you think of the food in Nice. Give your opinion and justify it (à mon avis, je trouve que…, je ne pense pas que + subjonctif)."
    es: "Alors, tu aimes la cuisine niçoise ?"
    min: 50
    max: 100
    use: [w.à-mon-avis, w.trouver-que, w.pois-chiche, w.selon, w.croire]
    useAtLeast: 3
    grammar: [g.opinion-mood]
    expect:
      - { pattern: "mon avis|\\bselon moi|\\bje (trouve|pense|crois) qu|\\bil me semble qu|apr[eè]s moi", hint: "Give your opinion: à mon avis, je trouve que, je pense que…" }
      - { pattern: "\\b(ne (pense|crois|trouve) pas|doute|pas (s[uû]re?|certaine?)) qu(e\\s|['’])", hint: "Add a negative opinion with the subjonctif: je ne pense pas que ce soit…" }
    model: { es: "À mon avis, la cuisine niçoise est une des meilleures de France. Je trouve que la socca, cette galette de pois chiches, est délicieuse quand elle est chaude. Je crois aussi que la vraie salade niçoise est très bonne, avec des tomates et des olives. Par contre, je ne pense pas que la cuisine des grands restaurants de la Promenade soit la meilleure. Selon moi, il faut manger au marché !", en: "In my opinion, the food of Nice is among the best in France. I find socca, that chickpea pancake, delicious when it's hot. I also think a real salade niçoise is very good, with tomatoes and olives. On the other hand, I don't think the food in the big restaurants on the Promenade is the best. For me, you have to eat at the market!" }
  - task: "Write a paragraph about traffic and transport in Nice or your own city: give causes and consequences (car, puisque, parce que, donc, c'est pourquoi, par conséquent)."
    min: 50
    max: 100
    use: [w.embouteillage, w.circulation, w.transports-en-commun, w.par-conséquent, w.c-est-pourquoi]
