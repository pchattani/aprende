id: a1.u09
title: Vamos à praia!
lessons:
  - id: a1.u09.l1
    title: Aonde você vai?
    teach: [g.ir-present, g.contractions-a]
    tip: "vou, vai, vamos, vão. Vou ao cinema (a + o), vou à praia (a + a). In speech Brazilians also say vou pra praia."
    vocab: [w.ir, w.a, w.ao, w.à, w.aonde, w.vamos, w.embora, w.cinema, w.teatro, w.academia, w.festa, w.show]
    sentences:
      - { es: "Vou à praia no sábado de manhã.", en: "I'm going to the beach on Saturday morning.", altEs: ["Eu vou à praia no sábado de manhã.", "Vou pra praia no sábado de manhã.", "No sábado de manhã vou à praia."], grammar: [g.ir-present, g.contractions-a], vocab: [w.ir, w.à, w.praia] }
      - { es: "Aonde você vai?", en: "Where are you going?", altEs: ["Pra onde você vai?", "Para onde você vai?", "Aonde você vai agora?"], grammar: [g.ir-present, g.question-words], vocab: [w.aonde], note: "aonde = where to; onde = where (no movement)." }
      - { es: "Nós vamos ao cinema hoje à noite.", en: "We're going to the cinema tonight.", altEs: ["Vamos ao cinema hoje à noite.", "A gente vai ao cinema hoje à noite.", "Hoje à noite nós vamos ao cinema."], altEn: ["We're going to the movies tonight."], grammar: [g.ir-present, g.contractions-a], vocab: [w.ao, w.cinema], transform: { instruction: "Change to 'they'", answer: "Eles vão ao cinema hoje à noite.", alt: ["Elas vão ao cinema hoje à noite."], en: "They're going to the cinema tonight." } }
      - { es: "Minha irmã vai à academia três vezes por semana.", en: "My sister goes to the gym three times a week.", altEs: ["A minha irmã vai à academia três vezes por semana."], grammar: [g.ir-present, g.contractions-a, g.frequency-adverbs], vocab: [w.academia, w.vez] }
      - { es: "Vocês vão à festa da Bia?", en: "Are you going to Bia's party?", altEs: ["Vocês vão na festa da Bia?"], grammar: [g.ir-present, g.contractions-a], vocab: [w.festa], note: "ir na festa is very common in Brazilian speech; write ir à festa." }
      - { es: "Vou ao Jardim Botânico com o Tom.", en: "I'm going to the Botanical Garden with Tom.", altEs: ["Eu vou ao Jardim Botânico com o Tom."], grammar: [g.ir-present, g.contractions-a], vocab: [w.ao, w.jardim], transform: { instruction: "Change to 'we'", answer: "Vamos ao Jardim Botânico com o Tom.", alt: ["Nós vamos ao Jardim Botânico com o Tom."], en: "We're going to the Botanical Garden with Tom." } }
      - { es: "Eles vão de ônibus ou de metrô?", en: "Are they going by bus or by metro?", altEs: ["Eles vão de ônibus ou metrô?"], altEn: ["Are they taking the bus or the metro?"], grammar: [g.ir-present, g.prepositions-movement], vocab: [w.ônibus, w.metrô], variant: "Portugal: autocarro (bus)." }
      - { es: "Ela vai a pé para o trabalho.", en: "She walks to work.", altEs: ["Ela vai a pé pro trabalho."], altEn: ["She goes to work on foot."], grammar: [g.ir-present, g.prepositions-movement], vocab: [w.a-pé, w.trabalho], note: "a pé (on foot) has no crase: pé is masculine." }
      - { es: "Vou ao teatro com a minha mãe.", en: "I'm going to the theatre with my mother.", altEs: ["Eu vou ao teatro com minha mãe."], grammar: [g.ir-present, g.contractions-a], vocab: [w.teatro, w.mãe] }
      - { es: "Vamos embora! Está tarde.", en: "Let's go! It's late.", altEs: ["Vamos embora, está tarde!", "Vamos embora! Já está tarde."], altEn: ["Let's leave! It's late."], grammar: [g.ir-present], vocab: [w.vamos, w.embora] }
      - { es: "Hoje à noite eu vou a um show de samba.", en: "Tonight I'm going to a samba concert.", altEs: ["Hoje à noite vou a um show de samba."], altEn: ["Tonight I'm going to a samba show."], grammar: [g.ir-present, g.contractions-a], vocab: [w.show, w.samba] }
      - { es: "Vou para casa.", en: "I'm going home.", altEs: ["Vou pra casa.", "Eu vou para casa."], grammar: [g.ir-present, g.prepositions-movement], vocab: [w.casa], note: "ir para = going somewhere to stay; ir a = a short visit." }
      - { es: "Vamos à praia amanhã?", en: "Shall we go to the beach tomorrow?", altEs: ["Vamos pra praia amanhã?", "Amanhã vamos à praia?"], grammar: [g.contractions-a, g.ir-present], vocab: [w.à, w.praia], error: { wrong: "Vamos ao praia amanhã?", explain: "praia is feminine, so a + a = à: vamos à praia.", grammar: g.contractions-a } }
      - { es: "Aos domingos, nós vamos à feira.", en: "On Sundays we go to the market.", altEs: ["Aos domingos vamos à feira.", "Aos domingos a gente vai à feira."], grammar: [g.contractions-a, g.days-months], vocab: [w.feira, w.domingo] }
      - { es: "Vou ao mercado e depois vou à farmácia.", en: "I'm going to the market and then to the pharmacy.", altEs: ["Eu vou ao mercado e depois à farmácia."], grammar: [g.contractions-a], vocab: [w.mercado, w.farmácia], error: { wrong: "Vou a o mercado e depois vou a a farmácia.", explain: "a + o always joins as ao, and a + a as à.", grammar: g.contractions-a } }
    exchanges:
      - q: { es: "Aonde você vai?", en: "Where are you going?" }
        a: { es: "Vou à praia. Quer ir comigo?", en: "I'm going to the beach. Do you want to come with me?" }
        alt: ["Vou ao mercado.", "Vou pra casa.", "Vou à academia."]
        grammar: [g.ir-present, g.contractions-a]
        vocab: [w.aonde, w.à]
      - q: { es: "Vocês vão à festa hoje?", en: "Are you going to the party today?" }
        a: { es: "Vamos! A festa é na casa do Lucas.", en: "We are! The party is at Lucas's house." }
        alt: ["Vamos, sim.", "Não, hoje não vamos.", "Vamos."]
        grammar: [g.ir-present, g.yes-no-answers]
        vocab: [w.festa]
      - q: { es: "Como você vai para o trabalho?", en: "How do you get to work?" }
        a: { es: "Vou de ônibus.", en: "I go by bus." }
        alt: ["De metrô.", "Vou a pé.", "Vou de bicicleta."]
        grammar: [g.ir-present, g.prepositions-movement]
        vocab: [w.ir, w.ônibus]
      - q: { es: "Vamos embora?", en: "Shall we go?" }
        a: { es: "Vamos, estou cansado.", en: "Let's, I'm tired." }
        alt: ["Vamos!", "Ainda não.", "Vamos, sim."]
        grammar: [g.ir-present]
        vocab: [w.vamos, w.embora]
      - q: { es: "Você vai ao cinema com quem?", en: "Who are you going to the cinema with?" }
        a: { es: "Vou com a Bia e o Lucas.", en: "I'm going with Bia and Lucas." }
        alt: ["Com a Bia.", "Vou sozinho.", "Com meus amigos."]
        grammar: [g.ir-present, g.question-words]
        vocab: [w.cinema]
    texts:
      - title: "Mensagem da Bia"
        es: ["Tom, vou à praia agora.", "Depois vou ao Jardim Botânico com a Carla.", "Você vai também?"]
        en: ["Tom, I'm going to the beach now.", "Then I'm going to the Botanical Garden with Carla.", "Are you coming too?"]
        grammar: [g.ir-present, g.contractions-a]
        vocab: [w.à, w.ao]
      - title: "A minha semana"
        es: ["Segunda: vou à academia.", "Quarta: vou ao teatro com a minha mãe.", "Sábado: vamos à festa do Lucas!"]
        en: ["Monday: I go to the gym.", "Wednesday: I'm going to the theatre with my mother.", "Saturday: we're going to Lucas's party!"]
        grammar: [g.ir-present, g.contractions-a]
        vocab: [w.academia, w.teatro, w.festa]
    spicy:
      - { es: "Aonde você vai tão bonito?", en: "Where are you off to looking so handsome?", altEs: ["Aonde você vai tão bonita?"], grammar: [g.ir-present, g.muito-pouco], vocab: [w.aonde, w.bonito] }
      - { es: "Vou à festa só porque você vai.", en: "I'm only going to the party because you're going.", altEs: ["Eu vou à festa só porque você vai."], grammar: [g.ir-present, g.contractions-a], vocab: [w.festa] }
      - { es: "Vamos embora daqui? Só nós dois.", en: "Shall we get out of here? Just the two of us.", altEs: ["Vamos embora daqui? Só nós duas."], grammar: [g.ir-present], vocab: [w.vamos, w.embora] }
      - { es: "Você vai ao cinema comigo ou eu vou sozinho e triste?", en: "Are you coming to the cinema with me, or do I go alone and sad?", altEs: ["Você vai ao cinema comigo ou eu vou sozinha e triste?"], grammar: [g.ir-present, g.contractions-a], vocab: [w.cinema, w.comigo, w.sozinho] }
      - { es: "Vou ao teatro, mas o show é você.", en: "I'm going to the theatre, but you're the show.", grammar: [g.ir-present, g.contractions-a], vocab: [w.teatro, w.show] }
  - id: a1.u09.l2
    title: Vou viajar amanhã
    teach: [g.ir-infinitive]
    tip: "ir + infinitive is the everyday future in Brazil: Vou viajar amanhã. There is no a in between."
    vocab: [w.viajar, w.visitar, w.passear, w.passeio, w.nadar, w.dançar, w.casar, w.ilha, w.ingresso, w.futebol, w.jogo, w.bola]
    sentences:
      - { es: "Vou viajar para a Ilha Grande no sábado.", en: "I'm going to travel to Ilha Grande on Saturday.", altEs: ["Eu vou viajar para a Ilha Grande no sábado.", "Vou viajar pra Ilha Grande no sábado."], altEn: ["I'm travelling to Ilha Grande on Saturday."], grammar: [g.ir-infinitive], vocab: [w.viajar, w.ilha], error: { wrong: "Vou a viajar para a Ilha Grande no sábado.", explain: "No a between ir and the infinitive: vou viajar.", grammar: g.ir-infinitive } }
      - { es: "O que você vai fazer no fim de semana?", en: "What are you going to do at the weekend?", altEs: ["O que você vai fazer nesse fim de semana?", "Que você vai fazer no fim de semana?"], altEn: ["What are you doing at the weekend?"], grammar: [g.ir-infinitive, g.question-words], vocab: [w.fazer, w.fim-de-semana] }
      - { es: "Vamos visitar o Jardim Botânico amanhã.", en: "We're going to visit the Botanical Garden tomorrow.", altEs: ["Nós vamos visitar o Jardim Botânico amanhã.", "A gente vai visitar o Jardim Botânico amanhã.", "Amanhã vamos visitar o Jardim Botânico."], grammar: [g.ir-infinitive], vocab: [w.visitar, w.jardim] }
      - { es: "Vai chover amanhã?", en: "Is it going to rain tomorrow?", altEs: ["Amanhã vai chover?"], altEn: ["Will it rain tomorrow?"], grammar: [g.ir-infinitive], vocab: [w.chover, w.amanhã] }
      - { es: "Eles vão casar no ano que vem.", en: "They're getting married next year.", altEs: ["Eles vão se casar no ano que vem.", "Eles vão casar ano que vem."], altEn: ["They're going to get married next year."], grammar: [g.ir-infinitive], vocab: [w.casar, w.ano] }
      - { es: "Hoje à noite nós vamos dançar forró.", en: "Tonight we're going to dance forró.", altEs: ["Hoje à noite vamos dançar forró.", "Hoje à noite a gente vai dançar forró."], grammar: [g.ir-infinitive], vocab: [w.dançar, w.forró] }
      - { es: "Você vai nadar no mar ou na piscina?", en: "Are you going to swim in the sea or in the pool?", altEs: ["Você vai nadar no mar ou na piscina do hotel?"], grammar: [g.ir-infinitive, g.contractions-em], vocab: [w.nadar, w.mar, w.piscina] }
      - { es: "Vamos passear no Jardim Botânico?", en: "Shall we go for a walk in the Botanical Garden?", altEs: ["Vamos dar um passeio no Jardim Botânico?"], grammar: [g.ir-infinitive], vocab: [w.passear], note: "Vamos + infinitive = let's / shall we." }
      - { es: "O passeio de barco vai ser lindo.", en: "The boat trip is going to be beautiful.", altEs: ["O passeio de barco vai ser muito lindo."], altEn: ["The boat trip will be lovely."], grammar: [g.ir-infinitive], vocab: [w.passeio, w.barco] }
      - { es: "Vou comprar os ingressos para o jogo.", en: "I'm going to buy the tickets for the match.", altEs: ["Eu vou comprar os ingressos para o jogo.", "Vou comprar os ingressos pro jogo."], altEn: ["I'll buy the tickets for the game."], grammar: [g.ir-infinitive], vocab: [w.ingresso, w.jogo, w.comprar], transform: { instruction: "Change to 'we'", answer: "Vamos comprar os ingressos para o jogo.", alt: ["Nós vamos comprar os ingressos para o jogo."], en: "We're going to buy the tickets for the match." } }
      - { es: "Os meninos vão jogar futebol na praia.", en: "The boys are going to play football on the beach.", altEs: ["Os meninos vão jogar bola na praia."], altEn: ["The boys are going to play soccer on the beach."], grammar: [g.ir-infinitive], vocab: [w.futebol, w.menino, w.jogar] }
      - { es: "O Leo vai trazer a bola.", en: "Leo is going to bring the ball.", altEn: ["Leo will bring the ball."], grammar: [g.ir-infinitive], vocab: [w.bola, w.trazer] }
      - { es: "Não vou trabalhar amanhã: vou descansar.", en: "I'm not going to work tomorrow: I'm going to rest.", altEs: ["Amanhã não vou trabalhar: vou descansar.", "Eu não vou trabalhar amanhã, vou descansar."], grammar: [g.ir-infinitive, g.negation], vocab: [w.trabalhar, w.descansar], transform: { instruction: "Change to 'she'", answer: "Ela não vai trabalhar amanhã: vai descansar.", alt: ["Ela não vai trabalhar amanhã, vai descansar."], en: "She isn't going to work tomorrow: she's going to rest." } }
      - { es: "Você vai gostar do Rio.", en: "You're going to like Rio.", altEn: ["You'll like Rio.", "You'll love Rio."], grammar: [g.ir-infinitive, g.gostar-de], vocab: [w.gostar] }
      - { es: "Vamos comer!", en: "Let's eat!", altEs: ["Vamos comer?"], altEn: ["Shall we eat?"], grammar: [g.ir-infinitive], vocab: [w.vamos, w.comer] }
      - { es: "Daqui a pouco eu vou sair.", en: "I'm going out in a little while.", altEs: ["Vou sair daqui a pouco.", "Daqui a pouco vou sair."], altEn: ["I'm leaving in a bit."], grammar: [g.ir-infinitive], vocab: [w.sair, w.daqui] }
    exchanges:
      - q: { es: "O que você vai fazer no sábado?", en: "What are you going to do on Saturday?" }
        a: { es: "Vou viajar para a Ilha Grande.", en: "I'm going to travel to Ilha Grande." }
        alt: ["Vou à praia.", "Vou descansar.", "Vou dançar forró."]
        grammar: [g.ir-infinitive]
        vocab: [w.viajar, w.ilha]
      - q: { es: "Vocês vão dançar hoje?", en: "Are you going dancing today?" }
        a: { es: "Vamos! Tem forró na Lapa.", en: "We are! There's forró in Lapa." }
        alt: ["Vamos, sim.", "Não, vamos ficar em casa.", "Vamos."]
        grammar: [g.ir-infinitive, g.yes-no-answers]
        vocab: [w.dançar, w.forró]
      - q: { es: "Você vai nadar?", en: "Are you going to swim?" }
        a: { es: "Agora não, a água está fria.", en: "Not now, the water's cold." }
        alt: ["Vou!", "Vou, sim.", "Vou nadar depois."]
        grammar: [g.ir-infinitive, g.ser-vs-estar-basics]
        vocab: [w.nadar, w.água]
      - q: { es: "Quando vocês vão casar?", en: "When are you getting married?" }
        a: { es: "Vamos casar em dezembro.", en: "We're getting married in December." }
        alt: ["No ano que vem.", "Em dezembro.", "Ainda não sabemos."]
        grammar: [g.ir-infinitive, g.days-months]
        vocab: [w.casar, w.dezembro]
      - q: { es: "Quem vai comprar os ingressos?", en: "Who's going to buy the tickets?" }
        a: { es: "Eu vou comprar, pode deixar.", en: "I'll buy them, leave it to me." }
        alt: ["Eu vou.", "O Tom vai comprar.", "Eu compro."]
        grammar: [g.ir-infinitive, g.question-words]
        vocab: [w.ingresso, w.comprar]
    texts:
      - title: "Planos para o sábado"
        es: ["No sábado, vou passear no Jardim Botânico.", "Depois vou nadar em Ipanema.", "À noite, vamos dançar na Lapa!"]
        en: ["On Saturday, I'm going to walk around the Botanical Garden.", "Then I'm going to swim at Ipanema.", "At night, we're going dancing in Lapa!"]
        grammar: [g.ir-infinitive]
        vocab: [w.passear, w.nadar, w.dançar]
      - title: "Convite"
        es: ["Oi, Tom! Amanhã vamos jogar futebol na praia.", "O Lucas vai levar a bola.", "Você vai jogar também?"]
        en: ["Hi, Tom! Tomorrow we're going to play football on the beach.", "Lucas is going to bring the ball.", "Are you going to play too?"]
        grammar: [g.ir-infinitive]
        vocab: [w.futebol, w.bola, w.jogar]
    spicy:
      - { es: "Vou casar com você… depois do terceiro jantar.", en: "I'm going to marry you… after the third dinner.", grammar: [g.ir-infinitive], vocab: [w.casar, w.jantar, w.terceiro] }
      - { es: "Hoje à noite você vai dançar comigo.", en: "Tonight you're going to dance with me.", altEs: ["Hoje à noite você vai dançar só comigo."], grammar: [g.ir-infinitive], vocab: [w.dançar, w.comigo] }
      - { es: "Vamos passear na praia? Eu levo o vinho.", en: "Shall we go for a walk on the beach? I'll bring the wine.", grammar: [g.ir-infinitive], vocab: [w.passear, w.vinho, w.levar] }
      - { es: "Você vai gostar do meu forró… e de mim também.", en: "You're going to like my forró… and me too.", grammar: [g.ir-infinitive, g.gostar-de], vocab: [w.forró, w.gostar] }
      - { es: "Não vou dormir hoje: vou pensar em você.", en: "I'm not going to sleep tonight: I'm going to think about you.", altEs: ["Hoje não vou dormir: vou pensar em você."], grammar: [g.ir-infinitive, g.negation], vocab: [w.dormir, w.pensar] }
  - id: a1.u09.l3
    title: O que você faz?
    teach: [g.fazer-present]
    tip: "fazer = to do and to make: faço, faz, fazemos, fazem. Fazer compras (go shopping), fazer aniversário (have a birthday), fazer academia (go to the gym)."
    vocab: [w.fazer, w.compras, w.exercício, w.ioga, w.brincar, w.vontade, w.mar, w.sol, w.areia, w.onda, w.protetor-solar, w.guarda-sol, w.toalha, w.piquenique]
    sentences:
      - { es: "O que vocês fazem no domingo?", en: "What do you do on Sundays?", altEs: ["O que vocês fazem aos domingos?"], altEn: ["What do you all do on Sunday?"], grammar: [g.fazer-present, g.question-words], vocab: [w.fazer, w.domingo] }
      - { es: "Eu faço ioga na praia de manhã.", en: "I do yoga on the beach in the morning.", altEs: ["Faço ioga na praia de manhã.", "Eu faço yoga na praia de manhã.", "De manhã eu faço ioga na praia."], grammar: [g.fazer-present], vocab: [w.ioga, w.praia], error: { wrong: "Eu fazo ioga na praia de manhã.", explain: "fazer is irregular with eu: faço.", grammar: g.fazer-present } }
      - { es: "Minha mãe faz aniversário no sábado.", en: "It's my mother's birthday on Saturday.", altEs: ["A minha mãe faz aniversário no sábado."], altEn: ["My mother's birthday is on Saturday."], grammar: [g.fazer-present], vocab: [w.aniversário, w.mãe], variant: "Portugal: fazer anos (Ela faz anos no sábado)." }
      - { es: "Nós fazemos compras na feira.", en: "We do our shopping at the market.", altEs: ["Fazemos compras na feira.", "A gente faz compras na feira."], altEn: ["We go shopping at the market."], grammar: [g.fazer-present], vocab: [w.compras, w.feira], transform: { instruction: "Change to 'I'", answer: "Eu faço compras na feira.", alt: ["Faço compras na feira."], en: "I do my shopping at the market." } }
      - { es: "Faço um bolo de chocolate para a festa.", en: "I'm making a chocolate cake for the party.", altEs: ["Eu faço um bolo de chocolate para a festa.", "Vou fazer um bolo de chocolate para a festa."], altEn: ["I'll make a chocolate cake for the party."], grammar: [g.fazer-present], vocab: [w.bolo, w.chocolate] }
      - { es: "As crianças brincam na areia.", en: "The children play in the sand.", altEs: ["As crianças estão brincando na areia."], altEn: ["The kids are playing in the sand."], grammar: [g.present-regular-ar, g.jogar-vs-tocar], vocab: [w.brincar, w.areia, w.criança], note: "Children brincam; adults jogam a game." }
      - { es: "Você faz exercício todo dia?", en: "Do you exercise every day?", altEs: ["Você faz exercícios todo dia?", "Você faz exercício todos os dias?"], altEn: ["Do you work out every day?"], grammar: [g.fazer-present, g.todo-tudo], vocab: [w.exercício] }
      - { es: "Com esse sol, você precisa de protetor solar.", en: "With this sun, you need sunscreen.", altEs: ["Com este sol, você precisa de protetor solar."], grammar: [g.precisar-de], vocab: [w.sol, w.protetor-solar] }
      - { es: "Eu levo o guarda-sol e duas toalhas.", en: "I'll bring the beach umbrella and two towels.", altEs: ["Levo o guarda-sol e duas toalhas."], altEn: ["I'm taking the parasol and two towels."], grammar: [g.present-regular-ar], vocab: [w.guarda-sol, w.toalha, w.levar] }
      - { es: "As ondas estão grandes hoje.", en: "The waves are big today.", altEs: ["Hoje as ondas estão grandes."], grammar: [g.ser-vs-estar-basics], vocab: [w.onda] }
      - { es: "Estou com vontade de tomar um sorvete.", en: "I feel like having an ice cream.", altEs: ["Tô com vontade de tomar um sorvete."], grammar: [g.estar-com], vocab: [w.vontade, w.sorvete], note: "estar com vontade de = to feel like." }
      - { es: "Eles fazem um piquenique no parque.", en: "They're having a picnic in the park.", altEs: ["Eles fazem piquenique no parque."], grammar: [g.fazer-present], vocab: [w.piquenique, w.parque] }
      - { es: "O que o seu pai faz? — Ele é médico.", en: "What does your father do? — He's a doctor.", altEs: ["O que seu pai faz? — Ele é médico.", "O que o seu pai faz? — É médico."], grammar: [g.fazer-present, g.ser-present], vocab: [w.fazer, w.médico] }
      - { es: "O mar está calmo: vamos nadar!", en: "The sea is calm: let's swim!", altEs: ["O mar está calmo, vamos nadar!"], grammar: [g.ser-vs-estar-basics, g.ir-infinitive], vocab: [w.mar, w.calmo, w.nadar] }
      - { es: "Nós fazemos tudo juntos.", en: "We do everything together.", altEs: ["Fazemos tudo juntos.", "Nós fazemos tudo juntas."], grammar: [g.fazer-present, g.todo-tudo], vocab: [w.tudo, w.junto], transform: { instruction: "Change to 'they'", answer: "Eles fazem tudo juntos.", alt: ["Elas fazem tudo juntas."], en: "They do everything together." } }
      - { es: "Vocês fazem academia?", en: "Do you go to the gym?", altEs: ["Vocês vão à academia?"], grammar: [g.fazer-present], vocab: [w.academia], variant: "Portugal: ir ao ginásio." }
    exchanges:
