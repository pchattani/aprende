id: b1.u03
title: "Les Calanques, ce qui me plaît"
lessons:
  - id: b1.u03.l1
    title: Ce qui me plaît dans les Calanques
    teach: [g.ce-qui-ce-que]
    tip: "'What' in the middle of a sentence: ce qui + verb (ce qui me plaît), ce que + subject (ce que j'aime)."
    vocab: [w.ce-qui, w.ce-que, w.calanque, w.crique, w.turquoise, w.parc-national, w.national, w.s-étendre, w.terrestre, w.mériter, w.kayak, w.plongée, w.plonger, w.bronzer, w.pagayer, w.transparent, w.préféré, w.favori, w.goût, w.déplaire, w.valoir, w.dauphin, w.méduse, w.requin, w.oursin, w.couler]
    sentences:
      - { es: "Ce qui me plaît dans les Calanques, c'est l'eau turquoise.", en: "What I like about the Calanques is the turquoise water.", altEs: ["Dans les Calanques, ce qui me plaît, c'est l'eau turquoise."], altEn: ["What I love about the Calanques is the turquoise water."], grammar: [g.ce-qui-ce-que], vocab: [w.ce-qui, w.calanque, w.turquoise] }
      - { es: "Ce que j'aime le plus, c'est plonger depuis les rochers.", en: "What I love most is diving from the rocks.", altEs: ["Ce que je préfère, c'est plonger depuis les rochers."], altEn: ["What I like most is diving off the rocks."], grammar: [g.ce-qui-ce-que], vocab: [w.ce-que, w.plonger, w.rocher] }
      - { es: "Je ne sais pas ce que tu veux faire demain : du kayak ou de la plongée ?", en: "I don't know what you want to do tomorrow: kayaking or diving?", altEs: ["Je ne sais pas ce que tu veux faire demain, du kayak ou de la plongée ?"], grammar: [g.ce-qui-ce-que, g.indirect-questions], vocab: [w.kayak, w.plongée], error: { wrong: "Je ne sais pas qu'est-ce que tu veux faire demain : du kayak ou de la plongée ?", explain: "In an indirect question, 'what' is ce que, not qu'est-ce que.", grammar: g.ce-qui-ce-que } }
      - { es: "Tu as l'air fatigué : dis-moi ce qui ne va pas.", en: "You look tired: tell me what's wrong.", altEs: ["Tu as l'air fatiguée : dis-moi ce qui ne va pas."], grammar: [g.ce-qui-ce-que], vocab: [w.ce-qui] }
      - { es: "Le parc national des Calanques s'étend entre Marseille et Cassis, ce qui en fait un paradis pour les randonneurs.", en: "The Calanques National Park stretches between Marseille and Cassis, which makes it a paradise for hikers.", grammar: [g.ce-qui-ce-que], vocab: [w.parc-national, w.national, w.s-étendre, w.randonneur] }
      - { es: "C'est un parc à la fois terrestre, marin et périurbain, ce qui est unique en Europe.", en: "It's a park that is on land, at sea and on the edge of a city all at once, which is unique in Europe.", altEs: ["C'est un parc terrestre, marin et périurbain à la fois, ce qui est unique en Europe."], grammar: [g.ce-qui-ce-que], vocab: [w.terrestre, w.marin.adj, w.périurbain] }
      - { es: "Ce que je trouve génial, c'est que les criques se méritent : on y arrive à pied ou en bateau.", en: "What I think is great is that you have to earn the coves: you get there on foot or by boat.", grammar: [g.ce-qui-ce-que], vocab: [w.crique, w.mériter] }
      - { es: "Ce qui me fait peur, ce sont les méduses, pas les requins.", en: "What scares me is the jellyfish, not the sharks.", altEs: ["Ce qui me fait peur, c'est les méduses, pas les requins."], grammar: [g.ce-qui-ce-que], vocab: [w.méduse, w.requin] }
      - { es: "On a vu des dauphins près de la côte, ce qui n'arrive pas souvent.", en: "We saw dolphins near the coast, which doesn't happen often.", altEs: ["Nous avons vu des dauphins près de la côte, ce qui n'arrive pas souvent."], grammar: [g.ce-qui-ce-que], vocab: [w.dauphin] }
      - { es: "Fais ce que tu veux : moi, je vais bronzer sur la plage.", en: "Do what you want: I'm going to sunbathe on the beach.", altEs: ["Fais ce que tu veux, moi je vais bronzer sur la plage."], grammar: [g.ce-qui-ce-que], vocab: [w.bronzer] }
      - { es: "Attention aux oursins : c'est ce qui fait mal quand on marche dans l'eau !", en: "Watch out for the sea urchins: that's what hurts when you walk in the water!", grammar: [g.ce-qui-ce-que], vocab: [w.oursin] }
      - { es: "Mon activité préférée, c'est la plongée ; ce que j'aime, c'est le silence sous l'eau.", en: "My favourite activity is diving; what I love is the silence underwater.", altEs: ["Mon activité favorite, c'est la plongée ; ce que j'aime, c'est le silence sous l'eau."], grammar: [g.ce-qui-ce-que], vocab: [w.préféré, w.favori, w.plongée] }
      - { es: "Ce n'est pas une question de goût : ce qui compte, c'est de ne pas prendre de risques.", en: "It's not a matter of taste: what matters is not taking any risks.", grammar: [g.ce-qui-ce-que], vocab: [w.goût, w.risque] }
      - { es: "Ce qui vaut vraiment la peine, c'est l'eau transparente d'En-Vau.", en: "What's really worth it is the crystal-clear water at En-Vau.", altEs: ["Ce qui vaut vraiment le coup, c'est l'eau transparente d'En-Vau."], grammar: [g.ce-qui-ce-que], vocab: [w.valoir, w.transparent] }
      - { es: "J'aime le silence de la crique.", en: "I love the silence of the cove.", grammar: [g.ce-qui-ce-que], vocab: [w.crique], transform: { instruction: "Start with Ce que…, c'est…", answer: "Ce que j'aime, c'est le silence de la crique.", alt: ["Ce que j'aime dans la crique, c'est le silence."], en: "What I love is the silence of the cove." } }
      - { es: "Le bruit des bateaux me déplaît.", en: "The noise of the boats annoys me.", altEn: ["I don't like the noise of the boats."], grammar: [g.ce-qui-ce-que], vocab: [w.déplaire], transform: { instruction: "Start with Ce qui…, c'est…", answer: "Ce qui me déplaît, c'est le bruit des bateaux.", alt: ["Ce qui me déplaît ici, c'est le bruit des bateaux."], en: "What annoys me is the noise of the boats." } }
    exchanges:
      - q: { es: "Qu'est-ce qui te plaît le plus ici ?", en: "What do you like most here?" }
        a: { es: "Ce qui me plaît le plus, c'est la couleur de l'eau.", en: "What I like most is the colour of the water." }
        alt: ["La couleur de l'eau.", "Le calme et la mer."]
        grammar: [g.ce-qui-ce-que]
        vocab: [w.ce-qui]
      - q: { es: "Qu'est-ce que tu veux faire cet après-midi ?", en: "What do you want to do this afternoon?" }
        a: { es: "Je ne sais pas encore ; fais ce que tu préfères.", en: "I don't know yet; do whatever you prefer." }
        alt: ["Du kayak !", "Bronzer, c'est tout ce que je veux."]
        grammar: [g.ce-qui-ce-que]
        vocab: [w.ce-que]
      - q: { es: "Tu sais ce qui s'est passé avec le kayak ?", en: "Do you know what happened with the kayak?" }
        a: { es: "Oui, il a coulé près des rochers, mais tout le monde va bien.", en: "Yes, it sank near the rocks, but everyone's fine." }
        alt: ["Non, qu'est-ce qui s'est passé ?", "Il a coulé !"]
        grammar: [g.ce-qui-ce-que]
        vocab: [w.kayak, w.couler]
      - q: { es: "Ça vaut la peine d'aller jusqu'à En-Vau ?", en: "Is it worth going all the way to En-Vau?" }
        a: { es: "Oui, c'est ce que j'ai vu de plus beau en Provence.", en: "Yes, it's the most beautiful thing I've seen in Provence." }
        alt: ["Oui, absolument.", "Oui, mais prends de l'eau."]
        grammar: [g.ce-qui-ce-que, g.quelque-chose-de]
        vocab: [w.valoir]
      - q: { es: "Tu as peur des requins ?", en: "Are you afraid of sharks?" }
        a: { es: "Non, ce qui me fait peur, ce sont les méduses.", en: "No, what scares me is jellyfish." }
        alt: ["Non, pas du tout.", "Un peu, oui."]
        grammar: [g.ce-qui-ce-que]
        vocab: [w.requin, w.méduse]
    texts:
      - title: "Mon carnet de voyage"
        es: ["Ce qui m'a le plus plu, c'est la couleur de l'eau.", "Ce que j'ai préféré, c'est la plongée dans la crique.", "Ce dont je me souviendrai toujours, c'est le silence."]
        en: ["What I liked most was the colour of the water.", "What I preferred was diving in the cove.", "What I'll always remember is the silence."]
        grammar: [g.ce-qui-ce-que]
        vocab: [w.ce-qui, w.ce-que, w.plongée, w.crique]
      - title: "Le parc national des Calanques"
        es: ["Créé en 2012, le parc s'étend entre Marseille et Cassis.", "Ce qui le rend unique, c'est qu'il est à la fois terrestre, marin et périurbain.", "Ses criques se méritent : on y arrive à pied ou en bateau."]
        en: ["Created in 2012, the park stretches between Marseille and Cassis.", "What makes it unique is that it is at once on land, at sea and on the edge of a city.", "Its coves must be earned: you get there on foot or by boat."]
        grammar: [g.ce-qui-ce-que]
        vocab: [w.parc-national, w.s-étendre, w.terrestre, w.crique, w.mériter]
    spicy:
      - { es: "Ce qui me plaît chez toi ? Tout, sauf ta façon de pagayer.", en: "What do I like about you? Everything, except the way you paddle.", grammar: [g.ce-qui-ce-que], vocab: [w.pagayer] }
      - { es: "Ce que je veux ce soir, c'est un coucher de soleil et toi à côté de moi.", en: "What I want tonight is a sunset and you next to me.", grammar: [g.ce-qui-ce-que] }
      - { es: "Je ne sais pas ce que tu as mis dans cette salade, mais je crois que je suis amoureux.", en: "I don't know what you put in this salad, but I think I'm in love.", altEs: ["Je ne sais pas ce que tu as mis dans cette salade, mais je crois que je suis amoureuse."], grammar: [g.ce-qui-ce-que], vocab: [w.amoureux] }
      - { es: "Ce qui est dangereux ici, ce ne sont pas les requins, c'est ton sourire.", en: "What's dangerous here isn't the sharks, it's your smile.", grammar: [g.ce-qui-ce-que], vocab: [w.requin] }
      - { es: "Bronzer à côté de toi ? C'est exactement ce dont j'avais besoin.", en: "Sunbathing next to you? That's exactly what I needed.", grammar: [g.ce-qui-ce-que], vocab: [w.bronzer] }
  - id: b1.u03.l2
    title: Celle-ci ou celle-là ?
    teach: [g.demonstrative-pronouns]
    tip: "celui, celle, ceux, celles need -ci/-là, de + noun or a relative: celle-ci, celui de Paul, ceux qui marchent."
    vocab: [w.celui, w.randonneur, w.sentier, w.rocher, w.gourde, w.sac-à-dos, w.casquette, w.stable, w.égal, w.choix, w.escalade, w.alpinisme, w.camper, w.tente, w.sac-de-couchage, w.boussole, w.s-orienter, w.se-perdre, w.pente, w.vallée, w.interdit, w.autorisé]
    sentences:
      - { es: "Quelle calanque tu préfères ? — Celle d'En-Vau, sans hésiter.", en: "Which calanque do you prefer? — The En-Vau one, no question.", altEs: ["Tu préfères quelle calanque ? — Celle d'En-Vau, sans hésiter."], altEn: ["Which calanque do you prefer? — En-Vau, without hesitation."], grammar: [g.demonstrative-pronouns], vocab: [w.celui, w.calanque] }
      - { es: "Ce sentier est plus facile que celui de la côte.", en: "This path is easier than the one along the coast.", altEs: ["Ce sentier-ci est plus facile que celui de la côte."], grammar: [g.demonstrative-pronouns, g.comparatives], vocab: [w.sentier] }
      - { es: "Je prends ce sac à dos : celui-là est trop lourd.", en: "I'll take this rucksack: that one's too heavy.", altEs: ["Je prends ce sac à dos, celui-là est trop lourd."], altEn: ["I'll take this backpack: that one is too heavy."], grammar: [g.demonstrative-pronouns], vocab: [w.sac-à-dos, w.lourd] }
      - { es: "Ta gourde est vide ? Prends celle de Paul.", en: "Is your water bottle empty? Take Paul's.", altEs: ["Ta gourde est vide ? Prends celle de Paul, alors."], grammar: [g.demonstrative-pronouns], vocab: [w.gourde, w.vide], error: { wrong: "Ta gourde est vide ? Prends la de Paul.", explain: "'Paul's' is celui / celle de Paul, never le / la de Paul.", grammar: g.demonstrative-pronouns } }
      - { es: "Ceux qui n'aiment pas marcher peuvent prendre le bateau à Cassis.", en: "Those who don't like walking can take the boat at Cassis.", altEs: ["Les gens qui n'aiment pas marcher peuvent prendre le bateau à Cassis."], grammar: [g.demonstrative-pronouns], vocab: [w.celui] }
      - { es: "Les kayaks bleus sont plus stables que ceux-là.", en: "The blue kayaks are more stable than those ones.", altEs: ["Les kayaks bleus sont plus stables que ceux-ci."], altEn: ["The blue kayaks are steadier than those."], grammar: [g.demonstrative-pronouns], vocab: [w.kayak, w.stable] }
      - { es: "Quelle casquette ? Celle-ci ou celle-là ? — Ça m'est égal.", en: "Which cap? This one or that one? — I don't mind.", altEs: ["Quelle casquette ? Celle-ci ou celle-là ? — Ça m'est complètement égal."], grammar: [g.demonstrative-pronouns], vocab: [w.casquette, w.égal] }
      - { es: "Les randonneurs qui campaient près de la source sont ceux que nous avons rencontrés hier.", en: "The hikers who were camping by the spring are the ones we met yesterday.", altEs: ["Les randonneurs qui campaient près de la source sont ceux qu'on a rencontrés hier."], grammar: [g.demonstrative-pronouns, g.relative-qui-que], vocab: [w.randonneur, w.camper, w.source] }
      - { es: "Camper est interdit dans le parc ; ceux qui veulent dormir dehors doivent aller au camping.", en: "Camping is forbidden in the park; those who want to sleep outdoors have to go to a campsite.", altEs: ["Le camping est interdit dans le parc ; ceux qui veulent dormir dehors doivent aller au camping."], grammar: [g.demonstrative-pronouns], vocab: [w.camper, w.interdit] }
      - { es: "Ma tente est plus grande que la tente de Paul.", en: "My tent is bigger than Paul's tent.", grammar: [g.demonstrative-pronouns], vocab: [w.tente], transform: { instruction: "Replace 'la tente de Paul' with a demonstrative pronoun", answer: "Ma tente est plus grande que celle de Paul.", alt: [], en: "My tent is bigger than Paul's." } }
      - { es: "Les sacs de couchage ? Ceux qui sont dans la voiture sont les nôtres.", en: "The sleeping bags? The ones in the car are ours.", grammar: [g.demonstrative-pronouns], vocab: [w.sac-de-couchage] }
      - { es: "Sans boussole, on peut facilement se perdre ; prends celle de mon père.", en: "Without a compass you can easily get lost; take my father's.", altEs: ["Sans boussole, on se perd facilement ; prends celle de mon père."], grammar: [g.demonstrative-pronouns], vocab: [w.boussole, w.se-perdre] }
      - { es: "Je m'oriente mieux avec une carte qu'avec mon téléphone.", en: "I find my way better with a map than with my phone.", grammar: [g.comparatives], vocab: [w.s-orienter] }
      - { es: "Cette pente est plus difficile que celle d'hier.", en: "This slope is harder than yesterday's.", altEs: ["Cette pente-ci est plus difficile que celle d'hier."], grammar: [g.demonstrative-pronouns], vocab: [w.pente] }
      - { es: "La vallée que je préfère, c'est celle où coule la petite rivière.", en: "The valley I like best is the one where the little river flows.", altEs: ["La vallée que je préfère est celle où coule la petite rivière."], grammar: [g.demonstrative-pronouns, g.relative-ou], vocab: [w.vallée, w.couler] }
      - { es: "Les randonneurs qui partent tôt ont moins chaud.", en: "Hikers who set off early are less hot.", altEn: ["Hikers who leave early don't get as hot."], grammar: [g.demonstrative-pronouns], vocab: [w.randonneur], transform: { instruction: "Replace 'Les randonneurs' with a demonstrative pronoun", answer: "Ceux qui partent tôt ont moins chaud.", alt: [], en: "Those who set off early are less hot." } }
    exchanges:
      - q: { es: "Tu veux quel sac à dos ?", en: "Which rucksack do you want?" }
        a: { es: "Celui-ci, il est plus léger.", en: "This one, it's lighter." }
        alt: ["Le rouge.", "Celui-là, s'il te plaît."]
        grammar: [g.demonstrative-pronouns]
        vocab: [w.sac-à-dos, w.celui]
      - q: { es: "On prend le sentier de la côte ou celui de la forêt ?", en: "Shall we take the coast path or the forest one?" }
        a: { es: "Celui de la côte : la vue est plus belle.", en: "The coast one: the view is nicer." }
        alt: ["Ça m'est égal.", "Celui de la forêt, il fait moins chaud."]
        grammar: [g.demonstrative-pronouns]
        vocab: [w.sentier, w.égal]
      - q: { es: "Tu fais de l'escalade ?", en: "Do you go climbing?" }
        a: { es: "Oui, mais pas d'alpinisme : la haute montagne, ce n'est pas pour moi.", en: "Yes, but not mountaineering: high mountains aren't for me." }
        alt: ["Non, j'ai peur.", "Oui, tous les week-ends."]
        grammar: [g.demonstrative-pronouns]
        vocab: [w.escalade, w.alpinisme]
      - q: { es: "C'est ta gourde ?", en: "Is this your water bottle?" }
        a: { es: "Non, la mienne est bleue ; celle-là, c'est celle de Karim.", en: "No, mine is blue; that one is Karim's." }
        alt: ["Non, c'est celle de Karim.", "Oui, c'est la mienne."]
        grammar: [g.demonstrative-pronouns]
        vocab: [w.gourde]
      - q: { es: "Tu as fait ton choix entre les deux tentes ?", en: "Have you chosen between the two tents?" }
        a: { es: "Oui, je prends celle qui est la plus légère.", en: "Yes, I'm taking the one that's lightest." }
        alt: ["Oui, celle-ci.", "Pas encore, elles sont bien toutes les deux."]
        grammar: [g.demonstrative-pronouns]
        vocab: [w.choix, w.tente]
      - q: { es: "Les chiens sont autorisés sur ce sentier ?", en: "Are dogs allowed on this path?" }
        a: { es: "Sur celui-ci, oui ; sur celui de la falaise, non.", en: "On this one, yes; on the cliff one, no." }
        alt: ["Oui, mais en laisse.", "Non, ils sont interdits."]
        grammar: [g.demonstrative-pronouns]
        vocab: [w.autorisé, w.interdit]
    texts:
      - title: "Conseils du parc"
        es: ["Ceux qui partent en randonnée doivent prendre au moins deux litres d'eau.", "Restez sur les sentiers : il est facile de se perdre.", "Le camping est interdit dans le parc."]
        en: ["Those who go hiking must take at least two litres of water.", "Stay on the paths: it's easy to get lost.", "Camping is forbidden in the park."]
        grammar: [g.demonstrative-pronouns]
        vocab: [w.sentier, w.se-perdre, w.interdit]
      - title: "Message de Hugo"
        es: ["J'ai deux sacs de couchage : celui de mon frère et le mien.", "Celui de mon frère est plus chaud.", "Tu veux lequel ?"]
        en: ["I've got two sleeping bags: my brother's and mine.", "My brother's is warmer.", "Which one do you want?"]
        grammar: [g.demonstrative-pronouns]
        vocab: [w.sac-de-couchage, w.lequel]
    spicy:
      - { es: "De tous les randonneurs, c'est celui avec la casquette rouge qui me plaît.", en: "Of all the hikers, it's the one with the red cap I like.", altEs: ["De tous les randonneurs, c'est celle avec la casquette rouge qui me plaît."], grammar: [g.demonstrative-pronouns], vocab: [w.randonneur, w.casquette] }
      - { es: "Ta tente ou la mienne ? Celle qui a la plus belle vue gagne.", en: "Your tent or mine? The one with the best view wins.", grammar: [g.demonstrative-pronouns], vocab: [w.tente] }
      - { es: "Ceux qui disent que la randonnée n'est pas romantique n'ont jamais marché avec toi.", en: "Those who say hiking isn't romantic have never walked with you.", grammar: [g.demonstrative-pronouns] }
      - { es: "J'ai perdu ma boussole... Tu veux être celui qui me montre le chemin ?", en: "I've lost my compass... Do you want to be the one who shows me the way?", altEs: ["J'ai perdu ma boussole... Tu veux être celle qui me montre le chemin ?"], grammar: [g.demonstrative-pronouns], vocab: [w.boussole] }
      - { es: "Je ne me perds jamais, sauf dans tes yeux, et dans ceux de ton chien.", en: "I never get lost, except in your eyes, and in your dog's.", grammar: [g.demonstrative-pronouns], vocab: [w.se-perdre] }
  - id: b1.u03.l3
    title: Quelque chose d'extraordinaire
    teach: [g.quelque-chose-de]
    tip: "quelque chose / rien / quelqu'un / personne + de + masculine adjective: quelque chose de beau, rien de spécial. With an infinitive: quelque chose à boire."
    vocab: [w.quelque-chose-de, w.rien-de, w.incroyable, w.spécial, w.extraordinaire, w.sauvage, w.pin, w.grotte, w.source, w.cascade, w.plante, w.buisson, w.feuille, w.branche, w.racine, w.olivier, w.olive, w.cigale, w.lézard, w.serpent, w.insecte, w.papillon, w.volcan, w.rive, w.air, w.pur]
    sentences:
      - { es: "On a vu quelque chose d'extraordinaire dans la grotte.", en: "We saw something extraordinary in the cave.", altEs: ["Nous avons vu quelque chose d'extraordinaire dans la grotte."], grammar: [g.quelque-chose-de], vocab: [w.quelque-chose-de, w.extraordinaire, w.grotte], error: { wrong: "On a vu quelque chose extraordinaire dans la grotte.", explain: "quelque chose + de + adjective: quelque chose d'extraordinaire.", grammar: g.quelque-chose-de } }
      - { es: "Rien de spécial, on a juste marché et nagé.", en: "Nothing special, we just walked and swam.", altEs: ["Rien de spécial : on a juste marché et nagé.", "Rien de spécial, nous avons juste marché et nagé."], grammar: [g.quelque-chose-de], vocab: [w.rien-de, w.spécial] }
      - { es: "C'est quelqu'un de très calme : il peut regarder la mer pendant des heures.", en: "He's a very calm person: he can look at the sea for hours.", altEs: ["C'est quelqu'un de très calme : elle peut regarder la mer pendant des heures."], altEn: ["She's a very calm person: she can look at the sea for hours."], grammar: [g.quelque-chose-de], vocab: [] }
      - { es: "Tu veux quelque chose à boire ? — Oui, quelque chose de frais, s'il te plaît.", en: "Do you want something to drink? — Yes, something cold, please.", altEs: ["Tu veux boire quelque chose ? — Oui, quelque chose de frais, s'il te plaît."], grammar: [g.quelque-chose-de], vocab: [w.frais] }
      - { es: "Il n'y a rien d'intéressant à la télé ; allons écouter les cigales.", en: "There's nothing interesting on TV; let's go and listen to the cicadas.", altEs: ["Il n'y a rien d'intéressant à la télé, allons écouter les cigales."], grammar: [g.quelque-chose-de], vocab: [w.cigale] }
      - { es: "Ces pins qui poussent sur les rochers ont quelque chose de sauvage.", en: "These pines growing on the rocks have something wild about them.", grammar: [g.quelque-chose-de], vocab: [w.pin, w.sauvage] }
      - { es: "Quoi de neuf ? — Rien de grave, j'ai juste vu un serpent sur le sentier !", en: "What's new? — Nothing serious, I just saw a snake on the path!", altEs: ["Quoi de neuf ? — Rien de grave, j'ai simplement vu un serpent sur le sentier !"], grammar: [g.quelque-chose-de], vocab: [w.serpent, w.sentier] }
      - { es: "Je cherche quelque chose de plus simple : une petite crique sans touristes.", en: "I'm looking for something simpler: a little cove with no tourists.", grammar: [g.quelque-chose-de], vocab: [w.crique] }
      - { es: "L'air est pur ici ; il y a quelque chose de différent dans la lumière.", en: "The air is clean here; there's something different about the light.", altEs: ["Ici, l'air est pur ; il y a quelque chose de différent dans la lumière."], grammar: [g.quelque-chose-de], vocab: [w.air, w.pur] }
      - { es: "Regarde, il y a quelque chose de vert sur la branche : c'est un lézard !", en: "Look, there's something green on the branch: it's a lizard!", grammar: [g.quelque-chose-de], vocab: [w.branche, w.lézard] }
      - { es: "Je ne connais personne d'aussi patient que mon frère : il regarde les papillons pendant des heures.", en: "I don't know anyone as patient as my brother: he watches butterflies for hours.", grammar: [g.quelque-chose-de], vocab: [w.papillon] }
      - { es: "Prends quelque chose de joli pour ta mère : une feuille d'olivier ou une petite pierre.", en: "Take something pretty for your mother: an olive leaf or a little stone.", grammar: [g.quelque-chose-de], vocab: [w.feuille, w.olivier] }
      - { es: "Près de la source, il y a quelque chose de très beau : une petite cascade.", en: "Near the spring there's something really beautiful: a little waterfall.", grammar: [g.quelque-chose-de], vocab: [w.source, w.cascade] }
      - { es: "Ce buisson a des racines très profondes ; il n'y a rien de plus solide.", en: "This bush has very deep roots; there's nothing sturdier.", grammar: [g.quelque-chose-de], vocab: [w.buisson, w.racine, w.solide] }
      - { es: "Je veux manger un plat léger.", en: "I want to eat a light dish.", grammar: [g.quelque-chose-de], vocab: [w.léger], transform: { instruction: "Use quelque chose de", answer: "Je veux manger quelque chose de léger.", alt: [], en: "I want to eat something light." } }
      - { es: "J'ai vu quelque chose d'intéressant.", en: "I saw something interesting.", grammar: [g.quelque-chose-de], vocab: [w.quelque-chose-de], transform: { instruction: "Make it negative with rien", answer: "Je n'ai rien vu d'intéressant.", alt: [], en: "I didn't see anything interesting." } }
    exchanges:
      - q: { es: "Quoi de neuf ?", en: "What's new?" }
        a: { es: "Rien de spécial. Et toi ?", en: "Nothing special. And you?" }
        alt: ["Pas grand-chose.", "Rien de nouveau."]
        grammar: [g.quelque-chose-de]
        vocab: [w.rien-de, w.spécial]
      - q: { es: "Tu veux quelque chose à manger ?", en: "Do you want something to eat?" }
        a: { es: "Oui, quelque chose de léger : des olives et du pain.", en: "Yes, something light: olives and bread." }
        alt: ["Non merci, je n'ai pas faim.", "Oui, quelque chose de simple."]
        grammar: [g.quelque-chose-de]
        vocab: [w.olive]
      - q: { es: "Qu'est-ce que vous avez vu dans la grotte ?", en: "What did you see in the cave?" }
        a: { es: "Rien d'extraordinaire, juste quelques insectes.", en: "Nothing extraordinary, just a few insects." }
        alt: ["Quelque chose d'incroyable !", "Rien de spécial."]
        grammar: [g.quelque-chose-de]
        vocab: [w.grotte, w.insecte, w.incroyable]
      - q: { es: "Tu connais quelqu'un de sérieux pour arroser mes plantes ?", en: "Do you know someone reliable to water my plants?" }
        a: { es: "Oui, ma voisine : c'est quelqu'un de très sérieux.", en: "Yes, my neighbour: she's a very reliable person." }
        alt: ["Non, personne.", "Demande à ma sœur."]
        grammar: [g.quelque-chose-de]
        vocab: [w.plante]
      - q: { es: "Qu'est-ce qu'il y a sur l'autre rive ?", en: "What's on the other bank?" }
        a: { es: "Rien d'intéressant, juste un parking.", en: "Nothing interesting, just a car park." }
        alt: ["Un petit village.", "Je ne sais pas."]
        grammar: [g.quelque-chose-de]
        vocab: [w.rive]
      - q: { es: "Qu'est-ce que tu aimerais voir d'autre en France ?", en: "What else would you like to see in France?" }
        a: { es: "Quelque chose de très différent : un volcan en Auvergne.", en: "Something very different: a volcano in the Auvergne." }
        alt: ["Un volcan, par exemple.", "Rien d'autre, je suis bien ici."]
        grammar: [g.quelque-chose-de]
        vocab: [w.volcan]
    texts:
      - title: "Carnet du randonneur"
        es: ["Ce matin, rien de spécial : du soleil et des cigales.", "À midi, quelque chose d'incroyable : un dauphin dans la crique !", "Le soir, nous avons mangé quelque chose de simple sous un olivier."]
        en: ["This morning, nothing special: sunshine and cicadas.", "At noon, something incredible: a dolphin in the cove!", "In the evening, we ate something simple under an olive tree."]
        grammar: [g.quelque-chose-de]
        vocab: [w.cigale, w.incroyable, w.dauphin, w.olivier]
      - title: "Panneau du parc"
        es: ["Ne cueillez pas les plantes : certaines espèces sont protégées.", "Ne touchez pas aux serpents ni aux insectes.", "Il n'y a rien de plus beau qu'une nature respectée."]
        en: ["Don't pick the plants: some species are protected.", "Don't touch the snakes or the insects.", "There's nothing more beautiful than nature that is respected."]
        grammar: [g.quelque-chose-de]
        vocab: [w.plante, w.espèce, w.serpent, w.insecte]
    spicy:
      - { es: "Tu as quelque chose de différent ce soir... Ah, tu souris !", en: "There's something different about you tonight... Ah, you're smiling!", grammar: [g.quelque-chose-de] }
      - { es: "Il n'y a rien de plus dangereux qu'un randonneur qui sait faire la cuisine.", en: "There's nothing more dangerous than a hiker who can cook.", grammar: [g.quelque-chose-de], vocab: [w.randonneur] }
      - { es: "J'ai envie de quelque chose de sucré : un dessert, ou un baiser.", en: "I feel like something sweet: a dessert, or a kiss.", grammar: [g.quelque-chose-de], vocab: [w.baiser] }
      - { es: "Tu cherches quelqu'un de sportif ? Je fais du kayak... une fois par an.", en: "Are you looking for someone sporty? I go kayaking... once a year.", grammar: [g.quelque-chose-de], vocab: [w.kayak] }
      - { es: "Quoi de neuf ? Rien de spécial, à part que je pense à toi depuis ce matin.", en: "What's new? Nothing special, except that I've been thinking about you since this morning.", grammar: [g.quelque-chose-de], vocab: [w.rien-de] }
  - id: b1.u03.l4
    title: Ce dont la planète a besoin
    teach: [g.ce-qui-ce-que, g.demonstrative-pronouns]
    tip: "ce dont = what, with verbs taking de (avoir besoin de, parler de). Ceux qui… = those who…"
    vocab: [w.incendie, w.risque, w.faune, w.flore, w.espèce, w.préserver, w.environnement, w.déchet, w.poubelle, w.recycler, w.polluer, w.pollution, w.écologique, w.écologie, w.énergie, w.renouvelable, w.solaire, w.nucléaire, w.plastique, w.emballage, w.tri, w.trier, w.planète, w.terre]
    sentences:
      - { es: "Ce dont la planète a besoin, c'est d'énergie renouvelable.", en: "What the planet needs is renewable energy.", altEs: ["Ce dont la planète a besoin, ce sont les énergies renouvelables."], grammar: [g.ce-qui-ce-que], vocab: [w.planète, w.énergie, w.renouvelable] }
      - { es: "Le risque d'incendie est très élevé en été, ce qui explique pourquoi certaines calanques sont fermées.", en: "The risk of fire is very high in summer, which explains why some calanques are closed.", grammar: [g.ce-qui-ce-que], vocab: [w.risque, w.incendie, w.calanque] }
      - { es: "Ce que je ne supporte pas, ce sont les déchets que les touristes laissent sur la plage.", en: "What I can't stand is the rubbish tourists leave on the beach.", altEs: ["Ce que je ne supporte pas, c'est les déchets que les touristes laissent sur la plage."], grammar: [g.ce-qui-ce-que], vocab: [w.déchet] }
      - { es: "Mets les emballages dans la poubelle jaune et le reste dans celle-là.", en: "Put the packaging in the yellow bin and the rest in that one.", altEs: ["Mets les emballages dans la poubelle jaune et le reste dans celle-ci."], grammar: [g.demonstrative-pronouns], vocab: [w.emballage, w.poubelle] }
      - { es: "Recycler, c'est bien ; ne pas produire de déchets, c'est encore mieux.", en: "Recycling is good; not producing waste is even better.", grammar: [g.ce-qui-ce-que], vocab: [w.recycler, w.déchet] }
      - { es: "Les bateaux à moteur polluent l'eau, ce qui est mauvais pour la faune et la flore.", en: "Motor boats pollute the water, which is bad for the wildlife and the plants.", altEn: ["Motorboats pollute the water, which is bad for the fauna and flora."], grammar: [g.ce-qui-ce-que], vocab: [w.polluer, w.faune, w.flore] }
      - { es: "Parmi les espèces du parc, celles qui vivent sous l'eau sont les plus fragiles.", en: "Among the park's species, the ones that live underwater are the most fragile.", grammar: [g.demonstrative-pronouns], vocab: [w.espèce, w.fragile] }
      - { es: "Il faut préserver l'environnement pour ceux qui viendront après nous.", en: "We must preserve the environment for those who will come after us.", altEs: ["On doit préserver l'environnement pour ceux qui viendront après nous."], grammar: [g.demonstrative-pronouns], vocab: [w.préserver, w.environnement] }
      - { es: "Je ne comprends pas ce que tu dis sur l'énergie nucléaire.", en: "I don't understand what you're saying about nuclear energy.", grammar: [g.ce-qui-ce-que], vocab: [w.nucléaire, w.énergie], error: { wrong: "Je ne comprends pas qu'est-ce que tu dis sur l'énergie nucléaire.", explain: "After a verb like comprendre or savoir, 'what' is ce que, not qu'est-ce que.", grammar: g.ce-qui-ce-que } }
      - { es: "Les panneaux solaires de mon voisin sont plus grands que ceux de la mairie.", en: "My neighbour's solar panels are bigger than the town hall's.", grammar: [g.demonstrative-pronouns], vocab: [w.solaire] }
      - { es: "Trier ses déchets, c'est ce que tout le monde devrait faire.", en: "Sorting your rubbish is what everyone should do.", grammar: [g.ce-qui-ce-que], vocab: [w.trier, w.déchet] }
      - { es: "La pollution des plages, c'est ce dont tout le monde parle cet été.", en: "Beach pollution is what everyone's talking about this summer.", grammar: [g.ce-qui-ce-que], vocab: [w.pollution] }
      - { es: "Ces sacs en plastique sont interdits ; prends plutôt ceux en papier.", en: "These plastic bags are banned; take the paper ones instead.", grammar: [g.demonstrative-pronouns], vocab: [w.plastique, w.interdit] }
      - { es: "L'écologie, ce n'est pas ce qui m'intéresse le plus, mais je fais le tri et j'ai une voiture écologique.", en: "Ecology isn't what interests me most, but I sort my rubbish and I have a green car.", grammar: [g.ce-qui-ce-que], vocab: [w.écologie, w.tri, w.écologique] }
      - { es: "J'ai besoin d'une gourde et d'une casquette.", en: "I need a water bottle and a cap.", grammar: [g.ce-qui-ce-que], vocab: [w.gourde, w.casquette], transform: { instruction: "Start with Ce dont…, c'est…", answer: "Ce dont j'ai besoin, c'est d'une gourde et d'une casquette.", alt: ["Ce dont j'ai besoin, c'est une gourde et une casquette."], en: "What I need is a water bottle and a cap." } }
      - { es: "Les touristes qui respectent la nature sont les bienvenus.", en: "Tourists who respect nature are welcome.", grammar: [g.demonstrative-pronouns], vocab: [], transform: { instruction: "Replace 'Les touristes' with a demonstrative pronoun", answer: "Ceux qui respectent la nature sont les bienvenus.", alt: [], en: "Those who respect nature are welcome." } }
    exchanges:
      - q: { es: "Qu'est-ce qu'on fait de ces bouteilles ?", en: "What do we do with these bottles?" }
        a: { es: "Mets-les dans la poubelle jaune, c'est celle du tri.", en: "Put them in the yellow bin, it's the recycling one." }
        alt: ["On les recycle.", "Dans la poubelle jaune."]
        grammar: [g.demonstrative-pronouns]
        vocab: [w.poubelle, w.tri]
      - q: { es: "Pourquoi la calanque est fermée aujourd'hui ?", en: "Why is the calanque closed today?" }
        a: { es: "À cause du risque d'incendie : il fait trop chaud et il y a du vent.", en: "Because of the fire risk: it's too hot and windy." }
        alt: ["À cause du vent.", "Parce qu'il y a un risque d'incendie."]
        grammar: [g.ce-qui-ce-que]
        vocab: [w.risque, w.incendie]
      - q: { es: "Tu sais ce dont on a besoin pour le pique-nique ?", en: "Do you know what we need for the picnic?" }
        a: { es: "De l'eau, du pain et un sac pour les déchets.", en: "Water, bread and a bag for the rubbish." }
        alt: ["Pas vraiment.", "De l'eau et du pain."]
        grammar: [g.ce-qui-ce-que]
        vocab: [w.déchet]
      - q: { es: "C'est ton sac en papier ?", en: "Is that your paper bag?" }
        a: { es: "Non, le mien est vert ; celui-là est à Inès.", en: "No, mine is green; that one is Inès's." }
        alt: ["Oui, c'est le mien.", "Non, c'est celui d'Inès."]
        grammar: [g.demonstrative-pronouns]
        vocab: [w.celui]
      - q: { es: "Que penses-tu de l'énergie nucléaire ?", en: "What do you think of nuclear energy?" }
        a: { es: "Ce que j'en pense ? Je préfère l'énergie solaire.", en: "What do I think of it? I prefer solar energy." }
        alt: ["Je ne sais pas trop.", "Je préfère les énergies renouvelables."]
        grammar: [g.ce-qui-ce-que]
        vocab: [w.nucléaire, w.solaire]
    texts:
      - title: "Affiche du parc"
        es: ["Vos déchets, gardez-les avec vous jusqu'à la prochaine poubelle.", "Ce qu'on jette dans la nature y reste des années.", "Le parc appartient à ceux qui le respectent."]
        en: ["Your rubbish: keep it with you until the next bin.", "What gets thrown away in nature stays there for years.", "The park belongs to those who respect it."]
        grammar: [g.ce-qui-ce-que, g.demonstrative-pronouns]
        vocab: [w.déchet, w.poubelle]
      - title: "Une seule Terre"
        es: ["Nous n'avons qu'une Terre.", "Ce dont elle a besoin, c'est de notre respect.", "Triez, recyclez et choisissez les énergies renouvelables."]
        en: ["We only have one Earth.", "What it needs is our respect.", "Sort, recycle and choose renewable energy."]
        grammar: [g.ce-qui-ce-que]
        vocab: [w.terre, w.trier, w.recycler, w.renouvelable]
    spicy:
      - { es: "Ce dont j'ai besoin ? Un café, un peu de soleil et ton numéro de téléphone.", en: "What do I need? A coffee, a bit of sun and your phone number.", grammar: [g.ce-qui-ce-que] }
      - { es: "Ce qui est écologique, c'est de tout partager : ton parapluie, ton dessert, ton temps.", en: "What's green is sharing everything: your umbrella, your dessert, your time.", grammar: [g.ce-qui-ce-que], vocab: [w.écologique] }
      - { es: "Les gens qui trient leurs déchets sont ceux que je préfère. Tu fais le tri ?", en: "People who sort their rubbish are my favourite kind. Do you recycle?", grammar: [g.demonstrative-pronouns], vocab: [w.trier, w.tri] }
      - { es: "Je ne sais pas ce que tu as fait, mais j'ai de l'énergie pour danser jusqu'à demain.", en: "I don't know what you did, but I've got the energy to dance until tomorrow.", grammar: [g.ce-qui-ce-que], vocab: [w.énergie] }
      - { es: "De tous les panneaux solaires de la ville, c'est toi qui me donnes le plus d'énergie.", en: "Of all the solar panels in town, you're the one who gives me the most energy.", grammar: [g.relative-qui-que], vocab: [w.solaire, w.énergie] }
dialogues:
  - id: b1.u03.d1
    title: En kayak dans les Calanques
    context: Inès and Hugo choose a calanque and set off by kayak from Cassis.
    lines:
      - { speaker: Inès, es: "Alors, quelle calanque on visite aujourd'hui ? Celle de Sormiou ou celle d'En-Vau ?", en: "So, which calanque are we visiting today? Sormiou or En-Vau?" }
      - { speaker: Hugo, es: "Celle d'En-Vau. Ce qui me plaît là-bas, ce sont les grands rochers et l'eau turquoise.", en: "En-Vau. What I like there is the big rocks and the turquoise water." }
      - { speaker: Inès, es: "D'accord, mais le sentier est difficile. Tu as pris ta gourde ?", en: "OK, but the path is hard. Did you bring your water bottle?" }
      - { speaker: Hugo, es: "J'ai pris celle de mon frère, la mienne est cassée.", en: "I took my brother's, mine is broken." }
      - { speaker: Inès, es: "Et si on y allait en kayak ? C'est ce que je préfère.", en: "What if we went there by kayak? That's what I like best." }
      - { speaker: Hugo, es: "Bonne idée ! Ceux du port de Cassis sont très stables.", en: "Good idea! The ones at Cassis harbour are very stable." }
      - { speaker: Inès, es: "Regarde, là-bas ! Il y a quelque chose de gris dans l'eau...", en: "Look, over there! There's something grey in the water..." }
      - { speaker: Hugo, es: "C'est un dauphin ! Je n'ai jamais vu quelque chose d'aussi beau.", en: "It's a dolphin! I've never seen anything so beautiful." }
      - { speaker: Inès, es: "Ne va pas trop près. Ce dont il a besoin, c'est de calme.", en: "Don't go too close. What it needs is peace and quiet." }
      - { speaker: Hugo, es: "Tu as raison. Bon, ce que je veux maintenant, c'est un bain et un pique-nique !", en: "You're right. Right, what I want now is a swim and a picnic!" }
    questions:
      - { q: "Quelle calanque choisissent-ils ?", options: ["Sormiou", "En-Vau", "Cassis"], answer: 1, explain: "Hugo chooses « celle d'En-Vau »." }
      - { q: "Pourquoi Hugo a-t-il la gourde de son frère ?", options: ["Il a perdu la sienne", "La sienne est cassée", "Elle est plus grande"], answer: 1, explain: "« la mienne est cassée »: his own is broken." }
      - { q: "Qu'est-ce qu'ils voient dans l'eau ?", options: ["Un requin", "Un dauphin", "Une méduse"], answer: 1, explain: "The grey thing in the water is a dolphin." }
      - { q: "Que veut faire Hugo à la fin ?", options: ["Rentrer au port", "Se baigner et pique-niquer", "Suivre le dauphin"], answer: 1, explain: "« un bain et un pique-nique »: a swim and a picnic." }
