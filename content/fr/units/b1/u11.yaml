    model: { es: "À Nice, il y a beaucoup d'embouteillages, car beaucoup d'habitants prennent leur voiture pour aller travailler. En été, la circulation est encore pire, puisque des milliers de touristes arrivent. Par conséquent, l'air est pollué et les gens sont stressés. C'est pourquoi la ville a construit un tramway. Donc, aujourd'hui, je prends les transports en commun : c'est plus rapide !", en: "In Nice there are lots of traffic jams, because many residents take their car to go to work. In summer the traffic is even worse, since thousands of tourists arrive. As a result the air is polluted and people are stressed. That's why the city built a tramway. So today I use public transport: it's quicker!" }
  - task: "For or against a car-free Promenade des Anglais? Write a balanced paragraph (d'un côté… de l'autre, cependant, bien que, malgré)."
    min: 50
    max: 100
    use: [w.d-un-côté, w.de-l-autre, w.cependant, w.malgré, w.piéton]
    useAtLeast: 3
    grammar: [g.connectors-opposition]
    expect:
      - { pattern: "\\b(pourtant|cependant|malgr[eé]|bien qu|alors qu|en revanche|par contre|au contraire|d['’]un c[oô]t[eé])", hint: "Contrast the arguments: d'un côté… de l'autre, cependant, malgré…" }
      - { pattern: "\\bbien qu(e\\s|['’])|\\bmalgr[eé]", hint: "Use bien que + subjonctif or malgré + noun." }
    model: { es: "D'un côté, une Promenade des Anglais sans voitures serait agréable pour les piétons et les vélos. L'air serait plus pur et il y aurait moins de bruit. De l'autre, les habitants auraient du mal à se garer, et les commerçants perdraient peut-être des clients. Bien que l'idée soit bonne, elle est compliquée. Cependant, malgré les inconvénients, je suis plutôt pour.", en: "On the one hand, a car-free Promenade des Anglais would be pleasant for pedestrians and bikes. The air would be cleaner and there would be less noise. On the other hand, residents would struggle to park, and shopkeepers might lose customers. Although the idea is good, it's complicated. However, despite the drawbacks, I'm rather in favour." }
  - task: "Write a formal letter to the mayor of Nice giving your opinion about the carnival: what you think, your reasons and a solution you propose."
