id: r.c1.contrato-e-instancia
level: c1
title: Un contrato, una instancia y su traducción al lenguaje claro
kind: text
intro: "Three short documents a tenant meets in a single week: an excerpt from a rental contract, the formal application (instancia) she sends to the town hall, and the plain-language version an adviser writes for her. Compare the legal formulas with their everyday equivalents."
allow: [lucía, ferrer, zaragoza, aragón, manuel, torres, pilar, iban, don, doña]
paragraphs:
  - { es: "CONTRATO DE ARRENDAMIENTO DE VIVIENDA. En Zaragoza, a 1 de septiembre de 2026. De una parte, don Manuel Torres, en calidad de arrendador y propietario del inmueble; de otra parte, doña Lucía Ferrer, en calidad de arrendataria. Ambas partes se reconocen capacidad legal para suscribir el presente contrato y, a tal efecto, acuerdan las siguientes cláusulas.", en: "RESIDENTIAL LEASE CONTRACT. In Zaragoza, on 1 September 2026. On the one hand, Mr Manuel Torres, in his capacity as landlord and owner of the property; on the other, Ms Lucía Ferrer, as tenant. Both parties acknowledge their legal capacity to sign this contract and, to that end, agree the following clauses." }
  - { es: "Primera. – El arrendador cede en arrendamiento a la arrendataria la vivienda situada en la calle del Pilar, número 14, tercero izquierda, que esta declara conocer y aceptar en su estado actual. Segunda. – La renta se fija en setecientos cincuenta euros mensuales, que la arrendataria abonará por transferencia dentro de los cinco primeros días de cada mes.", en: "One. – The landlord leases to the tenant the dwelling located at calle del Pilar, number 14, third floor left, which she declares she knows and accepts in its current condition. Two. – The rent is set at seven hundred and fifty euros per month, which the tenant shall pay by bank transfer within the first five days of each month." }
  - { es: "Tercera. – El contrato tendrá una vigencia de un año y se prorrogará por periodos anuales salvo que cualquiera de las partes comunique lo contrario por escrito con dos meses de antelación. Cuarta. – El incumplimiento del pago de dos mensualidades consecutivas facultará al arrendador para rescindir el contrato, sin perjuicio de las acciones legales que procedan.", en: "Three. – The contract shall have a term of one year and shall be extended for annual periods unless either party gives written notice to the contrary two months in advance. Four. – Failure to pay two consecutive monthly instalments shall entitle the landlord to terminate the contract, without prejudice to any legal action that may be appropriate." }
  - { es: "Quinta. – La arrendataria entrega en este acto una fianza equivalente a una mensualidad, que le será devuelta en el plazo de un mes desde la entrega de las llaves, una vez comprobado el estado del inmueble. En prueba de conformidad, ambas partes firman el presente documento por duplicado.", en: "Five. – The tenant hereby hands over a deposit equivalent to one month's rent, which shall be returned to her within one month of the handing over of the keys, once the condition of the property has been checked. As proof of agreement, both parties sign this document in duplicate." }
  - { es: "INSTANCIA. Doña Lucía Ferrer, con domicilio en la calle del Pilar, 14, de Zaragoza, EXPONE: que desde el 1 de septiembre reside en la citada vivienda en calidad de arrendataria, como acredita el contrato que se adjunta; que sus ingresos anuales no superan el límite establecido en la convocatoria de ayudas al alquiler publicada por el Gobierno de Aragón. Por todo ello, SOLICITA: que se le conceda la ayuda al alquiler correspondiente al año en curso y que, a efectos de notificación, se utilice la dirección de correo electrónico indicada. Zaragoza, 10 de septiembre de 2026. Firmado: Lucía Ferrer.", en: "APPLICATION. Ms Lucía Ferrer, resident at calle del Pilar, 14, Zaragoza, STATES: that since 1 September she has lived in the aforementioned dwelling as a tenant, as proved by the attached contract; that her annual income does not exceed the limit established in the call for rental allowances published by the Government of Aragon. For all these reasons, she REQUESTS: that she be granted the rental allowance for the current year and that, for notification purposes, the email address indicated be used. Zaragoza, 10 September 2026. Signed: Lucía Ferrer." }
  - { es: "RESPUESTA DEL AYUNTAMIENTO (extracto). Se le comunica que su solicitud ha sido admitida a trámite. En el plazo de diez días hábiles deberá aportar certificado de residencia; de no hacerlo, se entenderá que renuncia a la ayuda. Contra la presente resolución cabe recurso en el plazo de un mes.", en: "REPLY FROM THE TOWN HALL (excerpt). You are informed that your application has been accepted for processing. Within ten working days you must provide a certificate of residence; should you fail to do so, it will be understood that you waive the allowance. This decision may be appealed within one month." }
  - { es: "VERSIÓN EN LENGUAJE CLARO (escrita por un asesor). Lucía: tu contrato dura un año y se renueva solo, salvo que tú o el dueño aviséis por escrito dos meses antes. Si dejas de pagar dos meses seguidos, el dueño puede echarte. La fianza te la devuelven un mes después de dar las llaves, si el piso está bien.", en: "PLAIN-LANGUAGE VERSION (written by an adviser). Lucía: your contract lasts a year and renews automatically, unless you or the owner give written notice two months beforehand. If you stop paying for two months in a row, the owner can throw you out. They give the deposit back a month after you hand over the keys, if the flat is in good condition." }
  - { es: "Sobre la ayuda: el ayuntamiento la está estudiando. Tienes diez días laborables para llevarles el certificado de residencia; si no lo llevas, pierdes la ayuda. Si al final te la niegan, puedes reclamar durante un mes. Es lo mismo que dicen los papeles, dicho de otro modo.", en: "About the allowance: the town hall is looking at it. You have ten working days to take them the certificate of residence; if you don't, you lose the allowance. If in the end they refuse it, you can appeal for a month. It's the same thing the papers say, put another way." }
questions:
  - { q: "What happens if neither party gives written notice two months before the year ends?", options: ["The contract ends automatically", "The contract is extended for another year", "The rent doubles"], answer: 1 }
  - { q: "Under clause four, when can the landlord terminate the contract?", options: ["After one late payment", "After two consecutive unpaid months", "Whenever he wants"], answer: 1 }
  - { q: "What two things does Lucía state in the EXPONE part of her instancia?", options: ["That she is a tenant of the flat and that her income is below the limit", "That she is the owner and that she wants to sell", "That she has paid the deposit and the rent"], answer: 0 }
  - { q: "What must Lucía do within ten working days?", options: ["Pay the fee", "Provide a certificate of residence", "Sign a new contract"], answer: 1 }
  - { q: "What is the purpose of the final two paragraphs?", options: ["To add new conditions", "To restate the legal documents in plain language", "To cancel the application"], answer: 1 }
