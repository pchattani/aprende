    model: { es: "Salut, Claire ! Tu connais tous les bons restaurants de Lyon, alors j'ai besoin de tes conseils. Mes parents viennent pour leur anniversaire de mariage et ils sont très exigeants. Je cherche un restaurant gastronomique qui soit raffiné, mais pas trop cher. Je voudrais un endroit où l'on puisse parler tranquillement, sans musique forte. L'idéal, ce serait un chef cuisinier qui propose des plats lyonnais modernes. Ma mère ne mange pas de viande : il faut donc une carte qui ait aussi des plats végétariens. Tu connais un endroit qui puisse les satisfaire ?", en: "Hi, Claire! You know all the good restaurants in Lyon, so I need your advice. My parents are coming for their wedding anniversary and they're very demanding. I'm looking for a gourmet restaurant that's refined but not too expensive. I'd like a place where we can talk quietly, without loud music. Ideally, a chef who offers modern Lyon dishes. My mother doesn't eat meat, so we need a menu that also has vegetarian dishes. Do you know a place that could satisfy them?" }
