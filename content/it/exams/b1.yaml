title: Level check B1
passScore: 0.8
reading:
  text: |
    Quando Luca ha detto ai suoi genitori che voleva lasciare il lavoro in banca a Milano per aprire un'osteria a Bologna, sua madre ha pensato che stesse scherzando. «Avevi un buon lavoro, uno stipendio sicuro… e vuoi fare il cuoco?», gli ha chiesto. Luca aveva trentadue anni e da tempo si sentiva stanco: passava dieci ore al giorno davanti a un computer e la sera non aveva più energie per niente.

    L'amore per la cucina, in realtà, l'aveva sempre avuto. Da ragazzo passava le domeniche a guardare la nonna che preparava i tortellini a mano, e ancora oggi dice che nessun corso gli ha insegnato quanto quei pomeriggi. Prima di decidere, comunque, ha voluto essere sicuro: per un anno ha lavorato il fine settimana nella cucina di un ristorante, per capire se quel lavoro gli piaceva davvero o se era solo un sogno.

    L'osteria ha aperto tre anni fa, in una via del centro vicino all'università. All'inizio è stato molto difficile: Luca lavorava quattordici ore al giorno e ha speso quasi tutti i suoi risparmi. Oggi, però, il locale è sempre pieno, soprattutto di studenti e di famiglie del quartiere, e in cucina lavorano quattro persone. «Ho meno soldi di quando lavoravo in banca», ammette Luca, «ma la sera torno a casa stanco e contento. Prima tornavo solo stanco». E sua madre? Viene a pranzo ogni domenica e, dice lui ridendo, ordina sempre i tortellini per controllare che siano buoni come quelli della nonna.
  questions:
    - { q: "How did Luca's mother react to his decision at first?", options: ["She was enthusiastic", "She thought he was joking", "She offered to lend him money"], answer: 1 }
    - { q: "Why was Luca unhappy with his job at the bank?", options: ["The salary was too low", "He was tired: ten hours a day at a computer and no energy in the evening", "His colleagues were unpleasant"], answer: 1 }
    - { q: "What did Luca do before opening the osteria?", options: ["He took an expensive cookery course", "He worked weekends in a restaurant kitchen for a year", "He travelled around Italy"], answer: 1 }
    - { q: "What does Luca say about his income now?", options: ["He earns more than at the bank", "He earns less, but he is happier", "He earns exactly the same"], answer: 1 }
    - { q: "Why does his mother always order tortellini?", options: ["They are the cheapest dish", "To check they are as good as his grandmother's", "She doesn't like the other dishes"], answer: 1 }
