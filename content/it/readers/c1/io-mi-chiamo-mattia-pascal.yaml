id: r.c1.io-mi-chiamo-mattia-pascal
level: c1
title: Io mi chiamo Mattia Pascal
kind: literature
author: Luigi Pirandello (1867–1936)
source: "Il fu Mattia Pascal, capitolo I, «Premessa», integrale, e inizio del capitolo II, «Premessa seconda (filosofica) a mo' di scusa» (1904). Dominio pubblico. Accenti normalizzati all'uso moderno (né, giacché)."
intro: "The narrator of Pirandello's most famous novel introduces himself: the only thing he was ever sure of was his name – and he has since lost even that. Enjoy the irony (costa così poco… costa anche meno), the long periods full of subordinate clauses, and the infinitive used as a noun (il non sapere, il non poter più rispondere)."
allow: [pirandello, mattia, pascal, boccamazza, monsignor, monsignore, maria, liberale, eligio, pellegrinotto, don, de']
paragraphs:
  - { es: "Una delle poche cose, anzi forse la sola ch'io sapessi di certo era questa: che mi chiamavo Mattia Pascal. E me ne approfittavo. Ogni qual volta qualcuno de' miei amici o conoscenti dimostrava d'aver perduto il senno fino al punto di venire da me per qualche consiglio o suggerimento, mi stringevo nelle spalle, socchiudevo gli occhi e gli rispondevo: — Io mi chiamo Mattia Pascal. — Grazie, caro. Questo lo so. — E ti par poco?", en: "One of the few things, indeed perhaps the only thing, I knew for certain was this: that my name was Mattia Pascal. And I took advantage of it. Whenever one of my friends or acquaintances showed he had lost his wits so far as to come to me for some advice or a suggestion, I would shrug my shoulders, half close my eyes and answer: 'My name is Mattia Pascal.' 'Thank you, my friend. I know that.' 'And you think that's not much?'" }
  - { es: "Non pareva molto, per dir la verità, neanche a me. Ma ignoravo allora che cosa volesse dire il non sapere neppur questo, il non poter più rispondere, cioè, come prima, all'occorrenza: — Io mi chiamo Mattia Pascal.", en: "To tell the truth, it didn't seem much to me either. But I did not know then what it meant not to know even that, not to be able any longer, that is, to answer as before, when the need arose: 'My name is Mattia Pascal.'" }
  - { es: "Qualcuno vorrà bene compiangermi (costa così poco), immaginando l'atroce cordoglio d'un disgraziato, al quale avvenga di scoprire tutt'a un tratto che... sì, niente, insomma: né padre, né madre, né come fu o come non fu; e vorrà pur bene indignarsi (costa anche meno) della corruzione dei costumi, e de' vizii, e della tristezza dei tempi, che di tanto male possono esser cagione a un povero innocente.", en: "Someone will no doubt want to pity me (it costs so little), imagining the dreadful grief of a poor wretch who suddenly happens to discover that... yes, nothing, in short: no father, no mother, no knowing how it happened or didn't; and he will no doubt also want to be indignant (that costs even less) at the corruption of morals, and the vices, and the wickedness of the times, which can be the cause of so much harm to a poor innocent." }
  - { es: "Ebbene, si accomodi. Ma è mio dovere avvertirlo che non si tratta propriamente di questo. Potrei qui esporre, di fatti, in un albero genealogico, l'origine e la discendenza della mia famiglia e dimostrare come qualmente non solo ho conosciuto mio padre e mia madre, ma e gli antenati miei e le loro azioni, in un lungo decorso di tempo, non tutte veramente lodevoli. E allora? Ecco: il mio caso è assai più strano e diverso; tanto diverso e strano che mi faccio a narrarlo.", en: "Well, go ahead. But it is my duty to warn him that this is not really the point. I could in fact set out here, in a family tree, the origin and descent of my family and show how not only did I know my father and my mother, but also my ancestors and their deeds, over a long stretch of time – not all of them truly praiseworthy. So then? Here it is: my case is far stranger and different; so different and strange that I am setting out to tell it." }
  - { es: "Fui, per circa due anni, non so se più cacciatore di topi che guardiano di libri nella biblioteca che un Monsignor Boccamazza, nel 1803, volle lasciar morendo al nostro Comune. È ben chiaro che questo Monsignore dovette conoscer poco l'indole e le abitudini de' suoi concittadini; o forse sperò che il suo lascito dovesse col tempo e con la comodità accendere nel loro animo l'amore per lo studio. Finora, ne posso rendere testimonianza, non si è acceso: e questo dico in lode de' miei concittadini.", en: "For about two years I was – I don't know whether more a rat-catcher than a keeper of books – in the library that a certain Monsignor Boccamazza, in 1803, chose to leave on his death to our town. It is quite clear that this Monsignor can have known little of the character and habits of his fellow citizens; or perhaps he hoped that his bequest would, with time and convenience, kindle in their hearts a love of study. So far, as I can testify, it has not been kindled: and I say this in praise of my fellow citizens." }
  - { es: "Del dono anzi il Comune si dimostrò così poco grato al Boccamazza, che non volle neppure erigergli un mezzobusto pur che fosse, e i libri lasciò per molti e molti anni accatastati in un vasto e umido magazzino, donde poi li trasse, pensate voi in quale stato, per allogarli nella chiesetta fuori mano di Santa Maria Liberale, non so per qual ragione sconsacrata.", en: "Indeed, the town showed itself so little grateful to Boccamazza for the gift that it would not even put up a bust of him, however modest, and it left the books piled up for many, many years in a huge damp warehouse, from which it later took them – just imagine in what state – to house them in the out-of-the-way little church of Santa Maria Liberale, deconsecrated for I don't know what reason." }
  - { es: "Qua li affidò, senz'alcun discernimento, a titolo di beneficio, e come sinecura, a qualche sfaccendato ben protetto il quale, per due lire al giorno, stando a guardarli, o anche senza guardarli affatto, ne avesse sopportato per alcune ore il tanfo della muffa e del vecchiume.", en: "Here it entrusted them, without any discernment, as a favour and a sinecure, to some well-connected idler who, for two lire a day, by watching over them, or even without watching them at all, would put up for a few hours with the stench of mould and old rubbish." }
  - { es: "Tal sorte toccò anche a me; e fin dal primo giorno io concepii così misera stima dei libri, sieno essi a stampa o manoscritti (come alcuni antichissimi della nostra biblioteca), che ora non mi sarei mai e poi mai messo a scrivere, se, come ho detto, non stimassi davvero strano il mio caso e tale da poter servire d'ammaestramento a qualche curioso lettore, che per avventura, riducendosi finalmente a effetto l'antica speranza della buon'anima di Monsignor Boccamazza, capitasse in questa biblioteca, a cui io lascio questo mio manoscritto, con l'obbligo però che nessuno possa aprirlo se non cinquant'anni dopo la mia terza, ultima e definitiva morte.", en: "That fate fell to me too; and from the very first day I formed such a poor opinion of books, whether printed or handwritten (like some very ancient ones in our library), that I would never ever have started writing now if, as I said, I did not consider my case truly strange and such as to serve as a lesson to some curious reader who might by chance – the old hope of the late Monsignor Boccamazza being finally fulfilled – happen into this library, to which I leave this manuscript of mine, on condition, however, that nobody may open it until fifty years after my third, last and final death." }
  - { es: "Giacché, per il momento (e Dio sa quanto me ne duole), io sono morto, sì, già due volte, ma la prima per errore, e la seconda… sentirete.", en: "For, at the moment (and God knows how sorry I am about it), I have died, yes, twice already, but the first time by mistake, and the second… you will hear." }
  - { es: "(…) L'idea o piuttosto, il consiglio di scrivere mi è venuto dal mio reverendo amico don Eligio Pellegrinotto, che al presente ha in custodia i libri della Boccamazza, e al quale io affido il manoscritto appena sarà terminato, se mai sarà. Lo scrivo qua, nella chiesetta sconsacrata, al lume che mi viene dalla lanterna lassù, della cupola; qua, nell'abside riservata al bibliotecario e chiusa da una bassa cancellata di legno a pilastrini, mentre don Eligio sbuffa sotto l'incarico che si è eroicamente assunto di mettere un po' d'ordine in questa vera babilonia di libri. Temo che non ne verrà mai a capo.", en: "(…) The idea, or rather the advice, to write came to me from my reverend friend Don Eligio Pellegrinotto, who at present has charge of the Boccamazza books, and to whom I shall entrust the manuscript as soon as it is finished, if it ever is. I am writing it here, in the deconsecrated little church, by the light that comes down to me from the lantern of the dome up there; here, in the apse reserved for the librarian and closed off by a low wooden railing with little pillars, while Don Eligio puffs and pants under the task he has heroically taken on of putting some order into this real Babel of books. I fear he will never get to the end of it." }
questions:
  - { q: "Qual è l'unica cosa che il narratore sapeva con certezza?", options: ["Dove era nato", "Il proprio nome", "Chi erano i suoi antenati"], answer: 1, explain: "«la sola ch'io sapessi di certo era questa: che mi chiamavo Mattia Pascal»." }
  - { q: "Che funzione hanno le parentesi «(costa così poco)» e «(costa anche meno)»?", options: ["Danno informazioni sul prezzo dei libri", "Commentano con ironia la compassione e l'indignazione facili dei lettori", "Correggono un errore di stampa"], answer: 1, explain: "Pirandello's asides mock the reader's cheap pity and cheaper indignation – irony through understatement." }
  - { q: "Il narratore dice che il suo caso non è quello di un orfano. Perché lo precisa?", options: ["Perché ha conosciuto padre, madre e antenati: la sua stranezza è un'altra", "Perché vuole parlare della sua famiglia nobile", "Perché è stato adottato"], answer: 0, explain: "«non solo ho conosciuto mio padre e mia madre, ma e gli antenati miei… il mio caso è assai più strano e diverso»." }
  - { q: "Che cosa fece il Comune con la biblioteca di Monsignor Boccamazza?", options: ["La aprì subito con una grande festa", "Lasciò i libri per anni in un magazzino umido e poi li mise in una chiesetta sconsacrata", "Vendette tutti i libri"], answer: 1, explain: "«accatastati in un vasto e umido magazzino… per allogarli nella chiesetta… di Santa Maria Liberale, non so per qual ragione sconsacrata»." }
  - { q: "«e questo dico in lode de' miei concittadini»: che cosa intende davvero il narratore?", options: ["È un complimento sincero alla città", "È ironico: lodarli perché non leggono è una critica", "Vuole ringraziare il Monsignore"], answer: 1, explain: "Praising people because the love of study never took hold in them is irony – the narrator says the opposite of what he means (c1.u08)." }
  - { q: "Quando si potrà aprire il manoscritto?", options: ["Subito, da qualsiasi lettore curioso", "Cinquant'anni dopo la terza e definitiva morte del narratore", "Dopo la morte di Monsignor Boccamazza"], answer: 1, explain: "«nessuno possa aprirlo se non cinquant'anni dopo la mia terza, ultima e definitiva morte» – he has already 'died' twice." }
