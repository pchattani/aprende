    model: { es: "Il vivere a Cefalù ha un ritmo tutto suo. La mattina, il camminare lungo il mare prima che arrivino i turisti è il mio passatempo preferito. Il mangiare insieme è un rito: il pranzo della domenica può durare tre ore, e nessuno guarda l'orologio. Anche lo stare seduti in piazza, senza fare niente, ha un valore: è il modo in cui nascono le amicizie. Certo, non tutto è perfetto: il dover affrontare la burocrazia per un semplice certificato mette di cattivo umore anche le persone più pazienti. Eppure il saper aspettare, qui, diventa quasi un'arte. Quando cala il sole dietro la Rocca, il chiacchierare dei vicini sotto casa mi ricorda che il tempo, in questo paese, si misura in un altro modo.", en: "Living in Cefalù has a rhythm all of its own. In the morning, walking along the sea before the tourists arrive is my favourite pastime. Eating together is a ritual: Sunday lunch can last three hours, and nobody looks at the clock. Even sitting in the square, doing nothing, has value: it's the way friendships are born. Of course, not everything is perfect: having to face bureaucracy for a simple certificate puts even the most patient people in a bad mood. And yet knowing how to wait becomes almost an art here. When the sun sets behind the Rock, the chatter of the neighbours below my window reminds me that time, in this town, is measured in a different way." }
  - task: "Rewrite this bureaucratic notice in clear, simple Italian for the residents of Cefalù, and briefly explain the most difficult expressions."
    es: "«Si rende noto che, ai fini del rinnovo, i richiedenti sono tenuti a provvedere alla presentazione dell'istanza, corredata dalla documentazione prevista, entro e non oltre il termine del 30 novembre, pena l'esclusione.»"
    min: 110
    max: 180
    use: [w.burocratese, w.istanza, w.termine, w.rinnovo, w.obbligatorio]
    grammar: [g.bureaucratic-italian]
    expect:
      - { pattern: "\\b(cioè|in parole semplici|vuol dire|significa|in altre parole|ovvero)\\b", hint: "Explain in plain words: cioè, vuol dire, in altre parole…" }
      - { pattern: "\\b30 novembre\\b|\\btrenta novembre\\b", hint: "Keep the key information: entro il 30 novembre." }
    model: { es: "In parole semplici: chi vuole rinnovare il documento deve presentare la domanda entro il 30 novembre. Insieme alla domanda bisogna portare tutti i documenti richiesti. Attenzione: questa data è obbligatoria, quindi se la domanda arriva dopo il 30 novembre non sarà accettata. Il testo originale usa molte parole difficili. Per esempio, istanza significa domanda, e documentazione prevista vuol dire i documenti necessari. L'espressione entro e non oltre indica che non ci sono eccezioni, mentre pena l'esclusione vuol dire che chi è in ritardo perde il diritto al rinnovo. Il burocratese rende i testi lunghi e difficili da capire, mentre un italiano chiaro aiuta tutti i cittadini, soprattutto gli anziani e gli stranieri.", en: "In simple words: anyone who wants to renew the document must submit the application by 30 November. Together with the application you must bring all the required documents. Careful: this date is compulsory, so if the application arrives after 30 November it will not be accepted. The original text uses many difficult words. For example, istanza means application, and documentazione prevista means the necessary documents. The expression entro e non oltre indicates that there are no exceptions, while pena l'esclusione means that anyone who is late loses the right to renewal. Bureaucratese makes texts long and hard to understand, while clear Italian helps all citizens, especially the elderly and foreigners." }
