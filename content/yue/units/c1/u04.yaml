id: c1.u04
title: 四字成語
lessons:
  - id: c1.u04.l1
    title: 成語點樣砌出嚟
    teach: [g.chengyu-structure]
    vocab: [w.sing4-jyu5, w.din2-gu3, w.jyu6-ji3, w.bei2-jyu6, w.jat1-sam1-jat1-ji3, w.waak6-se4-tim1-zuk1, w.sau2-zyu1-doi6-tou3, w.jap6-hoeng1-ceoi4-zuk6, w.jat1-sek6-ji6-niu5, w.zeng2-dai2-zi1-waa1, w.bun3-tou4-ji4-fai3, w.mong4-joeng4-bou2-lou4, w.deoi3-ngau4-taan4-kam4, w.coi3-jung1-sat1-maa5, w.hak1-zau1-kau4-gim3, w.wu4-gaa2-fu2-wai1, w.jim2-ji5-dou6-ling4, w.bui1-gung1-se4-jing2]
    tip: "成語 are compressed classical phrases, usually four characters: parallel pairs (一心一意), mini-sentences (畫蛇添足) and story allusions (守株待兔). Never change a character."
    sentences:
      - { es: "佢做嘢一心一意。", en: "He puts his whole heart into his work.", altEs: ["佢做嘢好一心一意。"], altEn: ["She puts her whole heart into her work."], grammar: [g.chengyu-structure], vocab: [w.jat1-sam1-jat1-ji3] }
      - { es: "你再解釋就係畫蛇添足喇。", en: "If you explain any more, you'll be overdoing it.", altEs: ["你再解釋落去就畫蛇添足喇。"], grammar: [g.chengyu-structure], vocab: [w.waak6-se4-tim1-zuk1], transform: { instruction: "Say it plainly without the 成語", answer: "你唔使再解釋，講多咗反而唔好。", alt: ["唔使再解釋喇，講多咗反而唔好。"], en: "No need to explain any more; saying more would only make it worse." } }
      - { es: "入鄉隨俗，喺澳門就試吓葡國菜。", en: "When in Rome: in Macau, try Portuguese food.", altEs: ["入鄉隨俗，嚟到澳門就試吓葡國菜啦。"], grammar: [g.chengyu-structure], vocab: [w.jap6-hoeng1-ceoi4-zuk6] }
      - { es: "做事唔好半途而廢。", en: "Don't give up halfway.", altEs: ["做嘢唔好半途而廢。"], grammar: [g.chengyu-structure], vocab: [w.bun3-tou4-ji4-fai3], error: { wrong: "做事唔好半路而廢。", explain: "成語 are fixed: it is always 半途而廢, never 半路而廢.", grammar: g.chengyu-structure } }
      - { es: "做嘢做到一半就唔做，好可惜。", en: "Stopping halfway through a job is such a shame.", altEs: ["做到一半就唔做，真係可惜。"], grammar: [g.chengyu-structure], vocab: [w.bun3-tou4-ji4-fai3], transform: { instruction: "Say it with a 成語 (半途而廢)", answer: "半途而廢，好可惜。", alt: ["做嘢半途而廢，好可惜。", "半途而廢真係可惜。"], en: "Giving up halfway is such a shame." } }
      - { es: "坐地鐵去博物館，又快又可以順路食嘢，一石二鳥。", en: "Taking the metro to the museum is quick and you can eat on the way — two birds with one stone.", altEs: ["坐車去博物館，又快又順路食嘢，真係一石二鳥。"], grammar: [g.chengyu-structure], vocab: [w.jat1-sek6-ji6-niu5] }
      - { es: "唔好做井底之蛙，多啲出去睇吓世界。", en: "Don't be a frog in a well; get out and see the world more.", altEs: ["唔好做井底之蛙，出去睇多啲世界啦。"], grammar: [g.chengyu-structure], vocab: [w.zeng2-dai2-zi1-waa1], note: "之 is the classical 嘅: 井底之蛙 = 井底嘅青蛙." }
      - { es: "亡羊補牢，未為晚也。", en: "It's never too late to mend.", altEs: ["亡羊補牢，仲未遲。"], grammar: [g.chengyu-structure], vocab: [w.mong4-joeng4-bou2-lou4], note: "Literally 'mend the pen after the sheep is lost'. The second half is classical: 未為晚也 'is not yet too late'." }
      - { es: "同佢講道理，簡直係對牛彈琴。", en: "Reasoning with him is like playing the lute to a cow.", altEs: ["同佢講道理，即係對牛彈琴。"], altEn: ["Reasoning with her is talking to a brick wall."], grammar: [g.chengyu-structure], vocab: [w.deoi3-ngau4-taan4-kam4] }
      - { es: "守株待兔係批評人唔努力，淨係等運氣。", en: "守株待兔 criticises people who don't work and just wait for luck.", altEs: ["守株待兔係講人淨係等運氣，唔肯努力。"], grammar: [g.chengyu-structure], vocab: [w.sau2-zyu1-doi6-tou3], note: "The story: a farmer saw a rabbit break its neck on a tree stump, then gave up farming to wait for another." }
      - { es: "冇咗份工未必係壞事，塞翁失馬，焉知非福。", en: "Losing your job isn't necessarily bad — it could be a blessing in disguise.", altEs: ["冇咗份工唔一定係壞事，塞翁失馬，焉知非福。"], grammar: [g.chengyu-structure], vocab: [w.coi3-jung1-sat1-maa5] }
      - { es: "時代變咗，仲用舊方法就係刻舟求劍。", en: "Times have changed; sticking to old methods is like marking the boat to find a sword.", altEs: ["時代唔同咗，仲用舊方法即係刻舟求劍。"], grammar: [g.chengyu-structure], vocab: [w.hak1-zau1-kau4-gim3] }
      - { es: "佢靠老闆撐腰就周圍呼喝人，狐假虎威。", en: "He bosses everyone around because the boss backs him — the fox borrowing the tiger's might.", altEs: ["佢有老闆撐腰就呼喝人，真係狐假虎威。"], grammar: [g.chengyu-structure], vocab: [w.wu4-gaa2-fu2-wai1] }
      - { es: "唔睇銀行月結單就當自己冇使錢，即係掩耳盜鈴。", en: "Not looking at your bank statement and pretending you haven't spent anything is just fooling yourself.", altEs: ["唔睇月結單當自己冇使錢，掩耳盜鈴嚟啫。"], grammar: [g.chengyu-structure], vocab: [w.jim2-ji5-dou6-ling4], jp: "m4 tai2 ngan4 hong4 jyut6 git3 daan1 zau6 dong3 zi6 gei2 mou5 sai2 cin2 zik1 hai6 jim2 ji5 dou6 ling4" }
      - { es: "佢成日以為有人跟住佢，杯弓蛇影。", en: "She's always imagining someone's following her — jumping at shadows.", altEs: ["佢成日覺得有人跟蹤佢，杯弓蛇影。"], altEn: ["He always thinks someone is following him; he's needlessly suspicious."], grammar: [g.chengyu-structure], vocab: [w.bui1-gung1-se4-jing2], jp: "keoi5 seng4 jat6 ji5 wai4 jau5 jan4 gan1 zyu6 keoi5 bui1 gung1 se4 jing2" }
      - { es: "好多成語都有典故，背後有個故事。", en: "Many idioms have an allusion — there's a story behind them.", altEs: ["好多成語都有典故，即係背後有個故事。"], grammar: [g.chengyu-structure], vocab: [w.sing4-jyu5, w.din2-gu3] }
    exchanges:
      - q: { es: "「畫蛇添足」係咩意思？", en: "What does 畫蛇添足 mean?" }
        a: { es: "即係做多咗，反而弄巧反拙。", en: "Doing too much and spoiling it — like drawing legs on a snake." }
        alt: ["即係多此一舉。", "做多咗反而唔好。"]
        grammar: [g.chengyu-structure]
        vocab: [w.waak6-se4-tim1-zuk1]
      - q: { es: "呢個成語有冇典故㗎？", en: "Does this idiom have a story behind it?" }
        a: { es: "有，嚟自一個農夫等兔仔嘅故事。", en: "Yes, it comes from the story of a farmer waiting for a rabbit." }
        alt: ["有，係守株待兔嘅故事。", "有㗎，好多成語都有。"]
        grammar: [g.chengyu-structure]
        vocab: [w.sing4-jyu5, w.din2-gu3]
      - q: { es: "「井底之蛙」嘅寓意係咩？", en: "What's the moral of 井底之蛙?" }
        a: { es: "比喻見識少嘅人，以為世界得咁大。", en: "It's a metaphor for people who've seen little and think the world is that small." }
        alt: ["即係眼光好窄。", "見識少，以為自己乜都知。"]
        grammar: [g.chengyu-structure]
        vocab: [w.zeng2-dai2-zi1-waa1, w.jyu6-ji3, w.bei2-jyu6]
      - q: { es: "我學到一半想放棄喇。", en: "I'm halfway through learning and want to give up." }
        a: { es: "唔好半途而廢呀，你已經學咗咁多。", en: "Don't give up halfway — you've already learnt so much." }
        alt: ["唔好半途而廢！", "堅持吓啦，就快得喇。"]
        grammar: [g.chengyu-structure]
        vocab: [w.bun3-tou4-ji4-fai3]
      - q: { es: "我唔小心刪咗份文件，點算？", en: "I accidentally deleted the file — what do I do?" }
        a: { es: "亡羊補牢，即刻搵 IT 部幫手救返。", en: "Better late than never — get IT to help recover it right away." }
        alt: ["即刻搵人救返啦。", "亡羊補牢，未為晚也。"]
        grammar: [g.chengyu-structure]
        vocab: [w.mong4-joeng4-bou2-lou4]
    texts:
      - title: "語文堂筆記"
        es: ["成語多數係四個字。", "例如「一心一意」係並列結構，「畫蛇添足」就好似一句短句。", "好多成語都有典故，要知道故事先用得啱。"]
        en: ["Most idioms have four characters.", "For example, 一心一意 is a parallel structure, while 畫蛇添足 is like a short sentence.", "Many idioms have a story behind them; you need to know it to use them correctly."]
        grammar: [g.chengyu-structure]
        vocab: [w.sing4-jyu5, w.jat1-sam1-jat1-ji3, w.waak6-se4-tim1-zuk1, w.din2-gu3]
      - title: "媽閣廟前面"
        es: ["導遊話：入鄉隨俗，入廟要細聲講嘢。", "唔好守株待兔等人幫你影相，自己問就得。"]
        en: ["The guide says: when in Rome — speak quietly inside the temple.", "Don't just wait for someone to offer to take your photo; ask yourself."]
        grammar: [g.chengyu-structure]
        vocab: [w.jap6-hoeng1-ceoi4-zuk6, w.sau2-zyu1-doi6-tou3]
    spicy:
      - { es: "我對你一心一意，連手機都冇其他人。", en: "I'm devoted to you heart and soul — there's no one else even in my phone.", altEs: ["我對你一心一意，手機入面都冇其他人。"], grammar: [g.chengyu-structure], vocab: [w.jat1-sam1-jat1-ji3] }
      - { es: "我唔想守株待兔，所以主動嚟搵你傾偈。", en: "I didn't want to just sit and wait for luck, so I came over to chat with you.", altEs: ["我唔想守株待兔，所以自己過嚟同你傾偈。"], grammar: [g.chengyu-structure], vocab: [w.sau2-zyu1-doi6-tou3] }
      - { es: "同你食飯又可以練廣東話，一石二鳥。", en: "Having dinner with you means I get to practise Cantonese too — two birds with one stone.", altEs: ["同你食飯又練到廣東話，真係一石二鳥。"], grammar: [g.chengyu-structure], vocab: [w.jat1-sek6-ji6-niu5] }
      - { es: "你已經好靚，再化妝就畫蛇添足喇。", en: "You're already gorgeous; more make-up would just be gilding the lily.", altEs: ["你已經好靚，再化妝就係畫蛇添足。"], grammar: [g.chengyu-structure], vocab: [w.waak6-se4-tim1-zuk1] }
  - id: c1.u04.l2
    title: 胸有成竹噉講
    teach: [g.chengyu-in-speech]
    vocab: [w.hung1-jau5-sing4-zuk1, w.jat1-faan4-fung1-seon6, w.jat1-lou6-ping4-on1, w.jat1-lou6-seon6-fung1, w.jat1-geoi2-loeng5-dak1, w.jat1-gin3-zung1-cing4, w.zi6-soeng1-maau4-teon5, w.deoi3-zing3-haa6-joek6, w.sap6-cyun4-sap6-mei5, w.saam1-sam1-loeng5-ji3, w.cin1-fong1-baak3-gai3, w.sei3-min6-baat3-fong1, w.ng5-faa1-baat3-mun4, w.jat1-mou4-jat1-joeng6, w.jat1-cing1-ji6-co2, w.bat1-zi1-bat1-gok3, w.lei5-so2-dong1-jin4, w.jau5-sing1-jau5-sik1]
    tip: "成語 behave like single words: a predicate (佢胸有成竹), an adverb with 噉 (胸有成竹噉回答), or a modifier with 嘅 (一帆風順嘅旅程). Don't put 咗 or 緊 inside them."
    sentences:
      - { es: "佢對今次考試胸有成竹。", en: "He's confident about this exam.", altEs: ["今次考試佢胸有成竹。"], altEn: ["She's well prepared for this exam."], grammar: [g.chengyu-in-speech], vocab: [w.hung1-jau5-sing4-zuk1] }
      - { es: "佢胸有成竹噉行入考場。", en: "She walked into the exam hall full of confidence.", altEs: ["佢好胸有成竹噉行入試場。"], altEn: ["He strode into the exam hall confidently."], grammar: [g.chengyu-in-speech], vocab: [w.hung1-jau5-sing4-zuk1] }
      - { es: "佢好有信心噉答問題。", en: "He answered the questions very confidently.", altEs: ["佢好有自信噉答問題。"], grammar: [g.chengyu-in-speech], vocab: [w.hung1-jau5-sing4-zuk1], transform: { instruction: "Replace 好有信心 with a 成語 used as an adverb", answer: "佢胸有成竹噉答問題。", alt: ["佢胸有成竹噉回答問題。"], en: "He answered the questions with complete assurance." } }
      - { es: "祝你一帆風順！", en: "Wishing you smooth sailing!", altEs: ["祝你一切一帆風順！"], grammar: [g.chengyu-in-speech], vocab: [w.jat1-faan4-fung1-seon6] }
      - { es: "祝你哋一路平安，到咗打個電話返嚟。", en: "Have a safe journey, and call when you get there.", altEs: ["一路平安，到咗打電話返嚟啦。"], grammar: [g.chengyu-in-speech], vocab: [w.jat1-lou6-ping4-on1] }
      - { es: "佢哋喺媽閣廟門口一見鍾情。", en: "They fell in love at first sight outside A-Ma Temple.", altEs: ["佢哋係喺媽閣廟門口一見鍾情嘅。"], grammar: [g.chengyu-in-speech], vocab: [w.jat1-gin3-zung1-cing4] }
      - { es: "你頭先話鍾意，而家又話唔鍾意，自相矛盾。", en: "A moment ago you said you liked it, now you say you don't — you're contradicting yourself.", altEs: ["你頭先話鍾意，而家話唔鍾意，真係自相矛盾。"], grammar: [g.chengyu-in-speech], vocab: [w.zi6-soeng1-maau4-teon5] }
      - { es: "解決問題要對症下藥，唔好亂嚟。", en: "To solve a problem, find the right remedy — don't just try anything.", altEs: ["解決問題要對症下藥，唔好亂咁試。"], grammar: [g.chengyu-in-speech], vocab: [w.deoi3-zing3-haa6-joek6] }
      - { es: "世界上冇十全十美嘅人。", en: "Nobody in the world is perfect.", altEs: ["呢個世界冇十全十美嘅人。"], grammar: [g.chengyu-in-speech], vocab: [w.sap6-cyun4-sap6-mei5] }
      - { es: "佢千方百計都要買到嗰場演唱會飛。", en: "She tried every possible way to get a ticket for that concert.", altEs: ["佢用盡千方百計都要買到演唱會飛。"], altEn: ["He went to any lengths to get a concert ticket."], grammar: [g.chengyu-in-speech], vocab: [w.cin1-fong1-baak3-gai3] }
      - { es: "過年嘅時候，四面八方嘅人都嚟媽閣廟拜神。", en: "At New Year, people come from all directions to worship at A-Ma Temple.", altEs: ["過年嗰陣，四面八方嘅人都嚟媽閣廟拜神。"], grammar: [g.chengyu-in-speech], vocab: [w.sei3-min6-baat3-fong1] }
      - { es: "廟外面啲小食五花八門。", en: "There's every kind of snack outside the temple.", altEs: ["廟外面嘅小食五花八門。"], grammar: [g.chengyu-in-speech], vocab: [w.ng5-faa1-baat3-mun4] }
      - { es: "兩個神像一模一樣，我分唔到。", en: "The two statues are exactly the same; I can't tell them apart.", altEs: ["兩個神像一模一樣，我分唔出。"], grammar: [g.chengyu-in-speech], vocab: [w.jat1-mou4-jat1-joeng6, w.san4-zoeng6] }
      - { es: "老師解釋得一清二楚，佢仲問。", en: "The teacher explained it perfectly clearly, and he still asks.", altEs: ["老師講得一清二楚，佢都仲問。"], grammar: [g.chengyu-in-speech], vocab: [w.jat1-cing1-ji6-co2] }
      - { es: "我哋傾得太開心，不知不覺已經夜晚。", en: "We were chatting so happily that before we knew it, it was night.", altEs: ["傾得太開心，不知不覺就夜晚喇。"], grammar: [g.chengyu-in-speech], vocab: [w.bat1-zi1-bat1-gok3], transform: { instruction: "Say it without the 成語", answer: "我哋傾得太開心，冇留意到已經夜晚。", alt: ["我哋傾得太開心，唔覺意已經夜晚。"], en: "We were chatting so happily that we didn't notice it was already night." } }
      - { es: "佢講故事講得有聲有色，啲遊客聽到入晒迷。", en: "She tells stories so vividly that the tourists are spellbound.", altEs: ["佢講故事有聲有色，遊客都聽到入迷。"], grammar: [g.chengyu-in-speech], vocab: [w.jau5-sing1-jau5-sik1], error: { wrong: "佢講故事講得有聲咗有色。", explain: "Don't put aspect markers like 咗 inside a 成語; it works as one unit.", grammar: g.chengyu-in-speech } }
    exchanges:
      - q: { es: "聽日面試，你準備得點呀？", en: "Your interview's tomorrow — how prepared are you?" }
        a: { es: "胸有成竹，問咩我都答到。", en: "Fully prepared; I can answer whatever they ask." }
        alt: ["胸有成竹！", "準備好晒喇。"]
        grammar: [g.chengyu-in-speech]
        vocab: [w.hung1-jau5-sing4-zuk1]
      - q: { es: "我聽日飛去里斯本。", en: "I'm flying to Lisbon tomorrow." }
        a: { es: "一路順風，到咗記得報平安！", en: "Have a good trip, and let us know you've arrived safely!" }
        alt: ["一路平安！", "祝你一路順風！"]
        grammar: [g.chengyu-in-speech]
        vocab: [w.jat1-lou6-seon6-fung1]
      - q: { es: "你同你老公點識㗎？", en: "How did you and your husband meet?" }
        a: { es: "喺媽閣廟求籤嗰陣識嘅，一見鍾情。", en: "We met while drawing fortune sticks at A-Ma Temple — love at first sight." }
        alt: ["一見鍾情㗎。", "喺廟度識嘅。"]
        grammar: [g.chengyu-in-speech]
        vocab: [w.jat1-gin3-zung1-cing4]
      - q: { es: "揀邊個好呢？兩個都差唔多。", en: "Which one should I choose? They're about the same." }
        a: { es: "唔好三心兩意喇，揀咗就算。", en: "Stop dithering — pick one and that's that." }
        alt: ["隨便揀一個啦。", "唔好再三心兩意喇。"]
        grammar: [g.chengyu-in-speech]
        vocab: [w.saam1-sam1-loeng5-ji3]
      - q: { es: "呢個計劃有冇問題？", en: "Is there anything wrong with this plan?" }
        a: { es: "冇計劃係十全十美嘅，但係呢個已經幾好。", en: "No plan is perfect, but this one is pretty good." }
        alt: ["冇乜問題。", "唔係十全十美，不過幾好。"]
        grammar: [g.chengyu-in-speech]
        vocab: [w.sap6-cyun4-sap6-mei5]
    texts:
      - title: "畢業卡"
        es: ["恭喜你畢業！", "祝你前途一帆風順，心想事成。", "記住，世上冇十全十美，盡力就得。"]
        en: ["Congratulations on graduating!", "Wishing you smooth sailing ahead and every wish come true.", "Remember, nothing is perfect; doing your best is enough."]
        grammar: [g.chengyu-in-speech]
        vocab: [w.jat1-faan4-fung1-seon6, w.sap6-cyun4-sap6-mei5]
      - title: "遊記"
        es: ["媽閣廟前面嘅小食五花八門。", "我哋行行吓，不知不覺就到咗海邊。"]
        en: ["Outside A-Ma Temple there's every kind of snack.", "We strolled along and before we knew it we'd reached the waterfront."]
        grammar: [g.chengyu-in-speech]
        vocab: [w.ng5-faa1-baat3-mun4, w.bat1-zi1-bat1-gok3]
    spicy:
      - { es: "我信一見鍾情，但係你可唔可以再行過一次？", en: "I believe in love at first sight, but could you walk past me one more time?", altEs: ["我信一見鍾情，不過你可唔可以再行過多次？"], grammar: [g.chengyu-in-speech], vocab: [w.jat1-gin3-zung1-cing4] }
      - { es: "我千方百計搵你嘅電話，結果你自己畀咗我。", en: "I tried every trick to get your number, and in the end you just gave it to me.", altEs: ["我用盡千方百計搵你電話，最後你自己畀咗我。"], grammar: [g.chengyu-in-speech], vocab: [w.cin1-fong1-baak3-gai3] }
      - { es: "你話唔鍾意我，但係成晚望住我，自相矛盾喎。", en: "You say you don't like me, but you've been staring at me all night — that's contradictory.", altEs: ["你話唔鍾意我，又成晚望住我，自相矛盾喎。"], grammar: [g.chengyu-in-speech], vocab: [w.zi6-soeng1-maau4-teon5], jp: "nei5 waa6 m4 zung1 ji3 ngo5 daan6 hai6 seng4 maan5 mong6 zyu6 ngo5 zi6 soeng1 maau4 teon5 wo3" }
      - { es: "你唔係十全十美，不過啱晒我。", en: "You're not perfect, but you're just right for me.", altEs: ["你未必十全十美，但係啱晒我。"], grammar: [g.chengyu-in-speech], vocab: [w.sap6-cyun4-sap6-mei5] }
      - { es: "同你喺一齊，時間不知不覺就過咗。", en: "When I'm with you, time slips by without my noticing.", altEs: ["同你一齊，時間不知不覺就過咗。"], grammar: [g.chengyu-in-speech], vocab: [w.bat1-zi1-bat1-gok3] }
  - id: c1.u04.l3
    title: 雞同鴨講
    teach: [g.four-character-colloquial]
    vocab: [w.jat1-tau4-mou6-seoi2, w.gai1-tung4-aap3-gong2, w.cat1-gwok3-gam3-lyun6, w.saam1-m4-sik1-cat1, w.gau2-m4-daap3-baat3, w.sau2-mong4-goek3-lyun6, w.mok6-ming4-kei4-miu6, w.gong2-dou3-tin1-faa1-lung4-fung6, w.maa5-maa5-fu2-fu2, w.lyun6-cat1-baat3-zou1, w.lam4-gap1-pou5-fat6-goek3, w.cat1-soeng5-baat3-lok6, w.hou3-sik6-laan5-fei1, w.zi2-sau2-waak6-goek3, w.hau2-bat1-deoi3-sam1, w.sat6-ngaa4-sat6-ci2, w.tau4-tau4-pung3-zoek6-hak1, w.bat1-saam1-bat1-sei3]
    tip: "Cantonese has its own colloquial four-character phrases, full of numbers and animals: 雞同鴨講, 七國咁亂, 三唔識七. They're lively in speech but don't belong in formal writing."
    sentences:
      - { es: "我同個客雞同鴨講，講極都唔明。", en: "The client and I were talking at cross purposes; he just didn't get it.", altEs: ["我同個客戶雞同鴨講，點講都唔明。"], grammar: [g.four-character-colloquial], vocab: [w.gai1-tung4-aap3-gong2] }
      - { es: "佢解釋完我仲一頭霧水。", en: "After his explanation I was still baffled.", altEs: ["佢解釋完，我都仲係一頭霧水。"], altEn: ["After her explanation I was still baffled."], grammar: [g.four-character-colloquial], vocab: [w.jat1-tau4-mou6-seoi2] }
      - { es: "我完全唔明佢講咩。", en: "I have no idea what he's talking about.", altEs: ["我完全唔知佢講乜。"], grammar: [g.four-character-colloquial], vocab: [w.jat1-tau4-mou6-seoi2], transform: { instruction: "Say it with 一頭霧水", answer: "我聽到一頭霧水。", alt: ["佢講咩我一頭霧水。", "我一頭霧水，唔知佢講咩。"], en: "I listened and was completely lost." } }
      - { es: "搬屋嗰日成間屋七國咁亂。", en: "On moving day the whole flat was total chaos.", altEs: ["搬屋嗰日，成間屋七國咁亂。"], grammar: [g.four-character-colloquial], vocab: [w.cat1-gwok3-gam3-lyun6], jp: "bun1 uk1 go2 jat6 seng4 gaan1 uk1 cat1 gwok3 gam3 lyun6" }
      - { es: "我哋三唔識七，佢點解搵我？", en: "We're complete strangers; why is he looking for me?", altEs: ["我同佢三唔識七，佢做咩搵我？"], grammar: [g.four-character-colloquial], vocab: [w.saam1-m4-sik1-cat1] }
      - { es: "佢講嘢九唔搭八。", en: "What he says is all over the place.", altEs: ["佢講嘢成日九唔搭八。"], altEn: ["What she says is all over the place."], grammar: [g.four-character-colloquial], vocab: [w.gau2-m4-daap3-baat3] }
      - { es: "佢突然嬲咗，真係莫名其妙。", en: "She suddenly got angry — it's baffling.", altEs: ["佢無啦啦嬲咗，莫名其妙。"], altEn: ["He suddenly got angry for no reason at all."], grammar: [g.four-character-colloquial], vocab: [w.mok6-ming4-kei4-miu6] }
      - { es: "佢講到天花龍鳳，其實冇咩內容。", en: "He talked it up spectacularly, but there was nothing to it.", altEs: ["佢講到天花龍鳳，其實乜都冇。"], grammar: [g.four-character-colloquial], vocab: [w.gong2-dou3-tin1-faa1-lung4-fung6] }
      - { es: "你間房亂七八糟，執吓佢啦！", en: "Your room is a terrible mess — tidy it up!", altEs: ["你間房亂七八糟，快啲執吓啦！"], grammar: [g.four-character-colloquial], vocab: [w.lyun6-cat1-baat3-zou1], transform: { instruction: "Say it with 七國咁亂", answer: "你間房七國咁亂，執吓佢啦！", alt: ["你間房真係七國咁亂，執吓佢啦！"], en: "Your room is total chaos — tidy it up!" } }
      - { es: "聽日考試，佢今晚先臨急抱佛腳。", en: "The exam's tomorrow, and only tonight is he cramming.", altEs: ["聽日考試，佢今晚先嚟臨急抱佛腳。"], altEn: ["The exam's tomorrow and she's only cramming tonight."], grammar: [g.four-character-colloquial], vocab: [w.lam4-gap1-pou5-fat6-goek3] }
      - { es: "等緊放榜，我個心七上八落。", en: "Waiting for the results, I'm on tenterhooks.", altEs: ["等放榜，我個心七上八落。"], grammar: [g.four-character-colloquial], vocab: [w.cat1-soeng5-baat3-lok6] }
      - { es: "佢好食懶飛，乜都唔做。", en: "He's greedy and lazy; he does nothing.", altEs: ["佢好食懶飛，咩都唔肯做。"], altEn: ["She's lazy and does nothing at all."], grammar: [g.four-character-colloquial], vocab: [w.hou3-sik6-laan5-fei1] }
      - { es: "佢自己唔做，淨係識喺度指手畫腳。", en: "He doesn't do anything himself; he just bosses everyone around.", altEs: ["佢自己唔做，淨係識指手畫腳。"], grammar: [g.four-character-colloquial], vocab: [w.zi2-sau2-waak6-goek3] }
      - { es: "佢話唔介意，其實口不對心。", en: "She says she doesn't mind, but she doesn't mean it.", altEs: ["佢話唔介意，其實係口不對心。"], grammar: [g.four-character-colloquial], vocab: [w.hau2-bat1-deoi3-sam1] }
      - { es: "佢實牙實齒話會還錢，到而家都未還。", en: "He swore he'd pay the money back, and he still hasn't.", altEs: ["佢實牙實齒講會還錢，到而家仲未還。"], grammar: [g.four-character-colloquial], vocab: [w.sat6-ngaa4-sat6-ci2] }
      - { es: "今日頭頭碰着黑，冇一樣順。", en: "Everything's gone wrong today; nothing has worked out.", altEs: ["今日真係頭頭碰着黑，乜都唔順。"], grammar: [g.four-character-colloquial], vocab: [w.tau4-tau4-pung3-zoek6-hak1], error: { wrong: "今日頭頭碰住黑，冇一樣順。", explain: "The set phrase keeps 着: 頭頭碰着黑. Set phrases don't swap in 住.", grammar: g.four-character-colloquial } }
    exchanges:
      - q: { es: "你哋開會有冇結果？", en: "Did your meeting get anywhere?" }
        a: { es: "冇呀，兩邊雞同鴨講，講咗兩個鐘。", en: "No, the two sides talked at cross purposes for two hours." }
        alt: ["雞同鴨講，冇結果。", "冇，大家講極都唔明。"]
        grammar: [g.four-character-colloquial]
        vocab: [w.gai1-tung4-aap3-gong2]
      - q: { es: "你識唔識嗰個人？", en: "Do you know that person?" }
        a: { es: "唔識，三唔識七。", en: "No, he's a total stranger." }
        alt: ["完全唔識。", "唔識，我哋三唔識七。"]
        grammar: [g.four-character-colloquial]
        vocab: [w.saam1-m4-sik1-cat1]
      - q: { es: "你溫好書未呀？", en: "Have you finished revising?" }
        a: { es: "未呀，今晚臨急抱佛腳。", en: "Not yet — I'm cramming tonight." }
        alt: ["臨急抱佛腳囉。", "未，今晚先溫。"]
        grammar: [g.four-character-colloquial]
        vocab: [w.lam4-gap1-pou5-fat6-goek3]
      - q: { es: "老師頭先講咩呀？", en: "What did the teacher just say?" }
        a: { es: "我都一頭霧水，你問吓其他同學啦。", en: "I'm baffled too — ask the other students." }
        alt: ["我都唔明。", "一頭霧水呀。"]
        grammar: [g.four-character-colloquial]
        vocab: [w.jat1-tau4-mou6-seoi2]
      - q: { es: "今日點呀？", en: "How was today?" }
        a: { es: "頭頭碰着黑，冇一樣順。", en: "Bad luck at every turn; nothing went right." }
        alt: ["唔好提喇，頭頭碰着黑。", "麻麻哋。"]
        grammar: [g.four-character-colloquial]
        vocab: [w.tau4-tau4-pung3-zoek6-hak1]
    texts:
      - title: "WhatsApp 訊息"
        es: ["今朝搬屋，屋企七國咁亂。", "搬屋師傅同我雞同鴨講，搞到我手忙腳亂。", "而家終於可以坐低飲杯茶。"]
        en: ["We moved house this morning and home is total chaos.", "The movers and I were talking at cross purposes, which got me in a total flap.", "Now I can finally sit down and have a cup of tea."]
        grammar: [g.four-character-colloquial]
        vocab: [w.cat1-gwok3-gam3-lyun6, w.gai1-tung4-aap3-gong2, w.sau2-mong4-goek3-lyun6]
      - title: "考試前夜"
        es: ["聽日考試，我個心七上八落。", "成個學期都馬馬虎虎，今晚先臨急抱佛腳。"]
        en: ["The exam's tomorrow and I'm on tenterhooks.", "I coasted all term, and only tonight am I cramming."]
        grammar: [g.four-character-colloquial]
        vocab: [w.cat1-soeng5-baat3-lok6, w.maa5-maa5-fu2-fu2, w.lam4-gap1-pou5-fat6-goek3]
    spicy:
      - { es: "我哋三唔識七，不過我好想識你。", en: "We're total strangers, but I'd really like to get to know you.", altEs: ["我哋三唔識七，但係我好想識你。"], grammar: [g.four-character-colloquial], vocab: [w.saam1-m4-sik1-cat1] }
      - { es: "見到你，我個心七上八落，講嘢都九唔搭八。", en: "When I see you, my heart's all over the place and my words come out nonsense.", altEs: ["一見到你，我個心就七上八落，講嘢九唔搭八。"], grammar: [g.four-character-colloquial], vocab: [w.cat1-soeng5-baat3-lok6, w.gau2-m4-daap3-baat3] }
      - { es: "你話唔鍾意我？口不對心喎。", en: "You say you don't like me? You don't mean that.", altEs: ["你話唔鍾意我？你口不對心喎。"], grammar: [g.four-character-colloquial], vocab: [w.hau2-bat1-deoi3-sam1] }
      - { es: "你實牙實齒答應咗聽晚陪我食飯，唔准走數。", en: "You promised faithfully to have dinner with me tomorrow night — no backing out.", altEs: ["你實牙實齒應承咗聽晚同我食飯，唔准走數。"], grammar: [g.four-character-colloquial], vocab: [w.sat6-ngaa4-sat6-ci2] }
  - id: c1.u04.l4
    title: 新年講吉利說話
    teach: [g.chengyu-in-speech, g.chengyu-structure]
    vocab: [w.maa5-dou3-gung1-sing4, w.lung4-maa5-zing1-san4, w.bou6-bou6-gou1-sing1, w.nin4-nin4-jau5-jyu4, w.fu2-tau4-se4-mei5, w.jat1-zi1-bun3-gaai2, w.ji6-hau2-tung4-sing1, w.zeon1-zeon1-jau5-mei6, w.muk6-dang6-hau2-ngoi4, w.zi6-jin4-zi6-jyu5, w.jau5-tau4-jau5-mei5, w.mou4-jing2-mou4-zung1, w.daai6-ging1-siu2-gwaai3, w.siu2-tai4-daai6-zou6, w.jat1-gon1-ji6-zeng6, w.bun3-seon3-bun3-ji4, w.jat1-bun2-zing3-ging1, w.jat1-jin4-wai4-ding6]
    tip: "Lunar New Year greetings are mostly 成語 used alone: 龍馬精神 for elders, 步步高升 for people at work, 年年有餘 for the family, 馬到功成 for anyone starting something."
    sentences:
      - { es: "祝你身體健康，龍馬精神！", en: "Wishing you good health and boundless energy!", altEs: ["祝你龍馬精神，身體健康！"], grammar: [g.chengyu-in-speech], vocab: [w.lung4-maa5-zing1-san4] }
      - { es: "祝你新一年步步高升。", en: "Wishing you promotion after promotion in the new year.", altEs: ["祝你今年步步高升。"], grammar: [g.chengyu-in-speech], vocab: [w.bou6-bou6-gou1-sing1], transform: { instruction: "Wish an elderly relative vigour instead, with 龍馬精神", answer: "祝你新一年龍馬精神。", alt: ["祝你新一年身體健康，龍馬精神。", "祝你龍馬精神。"], en: "Wishing you vigour in the new year." } }
      - { es: "年年有餘，所以過年一定要食魚。", en: "'Abundance every year' — that's why you must eat fish at New Year.", altEs: ["過年要食魚，因為年年有餘。"], grammar: [g.chengyu-in-speech], vocab: [w.nin4-nin4-jau5-jyu4], note: "魚 jyu4 sounds like 餘 jyu4 'surplus'." }
      - { es: "聽日比賽，祝你哋馬到功成！", en: "Good luck in tomorrow's match — may you win straight away!", altEs: ["祝你哋聽日比賽馬到功成！"], grammar: [g.chengyu-in-speech], vocab: [w.maa5-dou3-gung1-sing4] }
      - { es: "做嘢要有頭有尾，唔好虎頭蛇尾。", en: "See things through; don't start strong and fizzle out.", altEs: ["做事要有頭有尾，唔好虎頭蛇尾。"], grammar: [g.chengyu-structure], vocab: [w.jau5-tau4-jau5-mei5, w.fu2-tau4-se4-mei5] }
      - { es: "我對媽祖嘅傳說只係一知半解。", en: "I only know a little about the legend of Mazu.", altEs: ["媽祖嘅傳說我只係一知半解。"], grammar: [g.chengyu-in-speech], vocab: [w.jat1-zi1-bun3-gaai2, w.maa1-zou2] }
      - { es: "我哋問佢去唔去，佢哋異口同聲話去。", en: "We asked if they were going, and they all said yes in one voice.", altEs: ["問佢哋去唔去，佢哋異口同聲話去。"], grammar: [g.chengyu-in-speech], vocab: [w.ji6-hau2-tung4-sing1] }
      - { es: "佢食杏仁餅食得津津有味。", en: "She's eating the almond cookies with real relish.", altEs: ["佢津津有味噉食杏仁餅。"], altEn: ["He's tucking into the almond cookies with relish."], grammar: [g.chengyu-in-speech], vocab: [w.zeon1-zeon1-jau5-mei6, w.hang6-jan4-beng2] }
      - { es: "佢好開心噉食緊杏仁餅。", en: "She's happily eating almond cookies.", altEs: ["佢好開心咁食杏仁餅。"], grammar: [g.chengyu-in-speech], vocab: [w.zeon1-zeon1-jau5-mei6], transform: { instruction: "Use 津津有味 as an adverb with 噉", answer: "佢津津有味噉食緊杏仁餅。", alt: ["佢津津有味噉食杏仁餅。"], en: "She's eating almond cookies with relish." } }
      - { es: "見到媽閣廟咁多人，啲遊客目瞪口呆。", en: "Seeing so many people at A-Ma Temple, the tourists were dumbfounded.", altEs: ["啲遊客見到媽閣廟咁多人，目瞪口呆。"], grammar: [g.chengyu-in-speech], vocab: [w.muk6-dang6-hau2-ngoi4] }
      - { es: "阿婆喺廟度自言自語，原來係同媽祖講嘢。", en: "Grandma was talking to herself in the temple; it turned out she was talking to Mazu.", altEs: ["阿婆喺廟入面自言自語，原來佢同媽祖傾偈。"], grammar: [g.chengyu-in-speech], vocab: [w.zi6-jin4-zi6-jyu5] }
      - { es: "我轉個身，個豬扒包已經無影無蹤。", en: "I turned around and the pork chop bun had vanished without a trace.", altEs: ["轉個頭，個豬扒包就無影無蹤。"], grammar: [g.chengyu-in-speech], vocab: [w.mou4-jing2-mou4-zung1, w.zyu1-paa2-baau1] }
      - { es: "少少事啫，唔使大驚小怪。", en: "It's nothing much; no need to make a fuss.", altEs: ["小事啫，唔使大驚小怪。"], grammar: [g.chengyu-in-speech], vocab: [w.daai6-ging1-siu2-gwaai3], error: { wrong: "少少事啫，唔使大驚細怪。", explain: "成語 are fixed: 大驚小怪 keeps 小, even though speech says 細.", grammar: g.chengyu-structure } }
      - { es: "遲到五分鐘就要開會檢討？小題大做。", en: "A meeting to review being five minutes late? That's making a mountain out of a molehill.", altEs: ["遲五分鐘就開會檢討，太小題大做喇。"], grammar: [g.chengyu-in-speech], vocab: [w.siu2-tai4-daai6-zou6] }
      - { es: "佢一本正經噉講笑，大家都笑到碌地。", en: "He told the joke with a straight face, and everyone was rolling on the floor.", altEs: ["佢一本正經噉講笑話，大家笑到碌地。"], grammar: [g.chengyu-in-speech], vocab: [w.jat1-bun2-zing3-ging1] }
      - { es: "聽晚七點媽閣廟門口等，一言為定！", en: "Tomorrow at seven outside A-Ma Temple — it's a deal!", altEs: ["聽晚七點喺媽閣廟門口等，一言為定！"], grammar: [g.chengyu-in-speech], vocab: [w.jat1-jin4-wai4-ding6] }
    exchanges:
      - q: { es: "新年快樂！", en: "Happy New Year!" }
        a: { es: "新年快樂，祝你龍馬精神，身體健康！", en: "Happy New Year! Wishing you vigour and good health!" }
        alt: ["恭喜發財！", "新年快樂，萬事如意！"]
        grammar: [g.chengyu-in-speech]
        vocab: [w.lung4-maa5-zing1-san4]
      - q: { es: "我下個月轉新工。", en: "I'm starting a new job next month." }
        a: { es: "恭喜！祝你步步高升，馬到功成。", en: "Congratulations! Wishing you promotion after promotion and instant success." }
        alt: ["恭喜晒，步步高升！", "祝你馬到功成！"]
        grammar: [g.chengyu-in-speech]
        vocab: [w.bou6-bou6-gou1-sing1, w.maa5-dou3-gung1-sing4]
      - q: { es: "你信唔信佢講嘅嘢？", en: "Do you believe what he says?" }
        a: { es: "半信半疑，佢成日講到天花龍鳳。", en: "Only half — he always makes things sound amazing." }
        alt: ["半信半疑啦。", "唔係好信。"]
        grammar: [g.chengyu-in-speech]
        vocab: [w.bun3-seon3-bun3-ji4]
      - q: { es: "我啲豬扒包呢？", en: "Where's my pork chop bun?" }
        a: { es: "無影無蹤喇，Leo 食得一乾二淨。", en: "Gone without a trace — Leo polished it off completely." }
        alt: ["Leo 食晒喇。", "冇晒喇。"]
        grammar: [g.chengyu-in-speech]
        vocab: [w.mou4-jing2-mou4-zung1, w.jat1-gon1-ji6-zeng6]
      - q: { es: "聽日十點喺媽閣廟等，好唔好？", en: "Meet at A-Ma Temple at ten tomorrow, OK?" }
        a: { es: "好，一言為定！", en: "OK, it's a deal!" }
        alt: ["一言為定！", "冇問題，十點見。"]
        grammar: [g.chengyu-in-speech]
        vocab: [w.jat1-jin4-wai4-ding6]
    texts:
      - title: "揮春"
        es: ["龍馬精神。", "步步高升。", "年年有餘。"]
        en: ["Vigour like a dragon-horse.", "Rise step by step.", "Abundance year after year."]
        grammar: [g.chengyu-in-speech]
        vocab: [w.lung4-maa5-zing1-san4, w.bou6-bou6-gou1-sing1, w.nin4-nin4-jau5-jyu4]
      - title: "年初一喺媽閣廟"
        es: ["年初一，四面八方嘅人嚟媽閣廟燒香。", "我哋買咗一盒杏仁餅，Luna 食得津津有味。", "一轉身，一盒餅已經無影無蹤。"]
        en: ["On New Year's Day, people from all over come to A-Ma Temple to burn incense.", "We bought a box of almond cookies and Luna ate them with relish.", "We turned around and the whole box had vanished without a trace."]
        grammar: [g.chengyu-in-speech]
        vocab: [w.zeon1-zeon1-jau5-mei6, w.mou4-jing2-mou4-zung1]
    spicy:
      - { es: "你一本正經噉講笑，我反而更加鍾意你。", en: "You crack jokes with a straight face, and it makes me like you even more.", altEs: ["你一本正經講笑，我仲鍾意你。"], grammar: [g.chengyu-in-speech], vocab: [w.jat1-bun2-zing3-ging1] }
      - { es: "我哋聽晚見，一言為定，唔准放我飛機。", en: "See you tomorrow night — it's a deal, no standing me up.", altEs: ["聽晚見，一言為定，唔好放我飛機。"], grammar: [g.chengyu-in-speech], vocab: [w.jat1-jin4-wai4-ding6] }
      - { es: "你笑一笑，我就目瞪口呆，連自己講到邊都唔記得。", en: "You smile and I'm dumbstruck — I forget what I was even saying.", altEs: ["你一笑，我就目瞪口呆，唔記得自己講到邊。"], grammar: [g.chengyu-in-speech], vocab: [w.muk6-dang6-hau2-ngoi4] }
      - { es: "我對你嘅了解仲係一知半解，所以要約多幾次。", en: "I only half know you so far, so we'll need a few more dates.", altEs: ["我對你仲係一知半解，所以要多約幾次。"], grammar: [g.chengyu-in-speech], vocab: [w.jat1-zi1-bun3-gaai2], jp: "ngo5 deoi3 nei5 ge3 liu5 gaai2 zung6 hai6 jat1 zi1 bun3 gaai2 so2 ji5 jiu3 joek3 do1 gei2 ci3" }
dialogues:
  - id: c1.u04.d1
    title: 媽閣廟前面講成語
    context: Outside A-Ma Temple, 阿詩 explains a few idioms to her friend 家俊 while they wait for a fortune-stick reading.
    lines:
      - { speaker: 家俊, es: "阿詩，頭先個廟祝講咩呀？我一頭霧水。", en: "Si, what did the temple keeper just say? I'm completely lost." }
      - { speaker: 阿詩, es: "佢話你支籤係「塞翁失馬」，即係壞事可能變好事。", en: "He said your fortune stick is 塞翁失馬 — something bad may turn out well." }
      - { speaker: 家俊, es: "咁啱我上個月冇咗份工，原來未必係壞事。", en: "Funny, I lost my job last month — so maybe it's not a bad thing." }
      - { speaker: 阿詩, es: "係呀，你唔好守株待兔，快啲搵新工啦。", en: "Exactly, don't just sit around waiting for luck — find a new job soon." }
      - { speaker: 家俊, es: "我已經寄咗好多份履歷，但係個個都雞同鴨講。", en: "I've already sent off loads of CVs, but every interview is people talking at cross purposes." }
      - { speaker: 阿詩, es: "唔好心急，對症下藥，改吓份履歷先。", en: "Don't rush; find the right fix — improve your CV first." }
      - { speaker: 家俊, es: "好，我一心一意搵工，唔會半途而廢。", en: "OK, I'll put my whole heart into job hunting and won't give up halfway." }
      - { speaker: 阿詩, es: "咁就啱喇！祝你馬到功成！", en: "That's the spirit! Wishing you instant success!" }
      - { speaker: 家俊, es: "多謝！搵到工我請你食葡國菜，一言為定。", en: "Thanks! When I find a job I'll treat you to Portuguese food, it's a deal." }
    questions:
      - { q: "家俊支籤係邊個成語？", options: ["守株待兔", "塞翁失馬", "畫蛇添足"], answer: 1, explain: "The temple keeper said the stick was 塞翁失馬, a blessing in disguise." }
      - { q: "家俊上個月發生咩事？", options: ["佢冇咗份工", "佢結咗婚", "佢搬咗屋"], answer: 0, explain: "He says 我上個月冇咗份工: he lost his job." }
      - { q: "阿詩建議家俊先做咩？", options: ["去旅行", "改吓份履歷", "再求一支籤"], answer: 1, explain: "對症下藥: fix the real problem by improving his CV first." }
      - { q: "家俊搵到工之後會做咩？", options: ["請阿詩食葡國菜", "再嚟媽閣廟拜神", "買杏仁餅畀阿詩"], answer: 0, explain: "He promises to treat her to Portuguese food: 一言為定." }
