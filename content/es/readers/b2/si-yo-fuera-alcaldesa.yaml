id: r.b2.si-yo-fuera-alcaldesa
level: b2
title: Si yo fuera alcaldesa
kind: text
intro: An opinion column in a local newspaper imagines what the writer would do if she ran the city, using unreal conditions, wishes and como si.
allow: [veinticinco, quitáramos, admiramos]
paragraphs:
  - { es: "Cada cuatro años, los candidatos nos prometen una ciudad distinta. Y cada cuatro años, nada más terminar las elecciones, la ciudad sigue igual: los mismos atascos, el mismo ruido, las mismas colas en el centro de salud. Por eso hoy quiero hacer un ejercicio de imaginación: ¿qué haría yo si fuera alcaldesa?", en: "Every four years, the candidates promise us a different city. And every four years, as soon as the elections are over, the city stays the same: the same traffic jams, the same noise, the same queues at the health centre. That is why today I want to do an exercise in imagination: what would I do if I were mayor?" }
  - { es: "Para empezar, no prometería nada que no pudiera cumplir. Parece sencillo, pero ningún político se atreve. Si yo tuviera el cargo, diría la verdad: que el presupuesto es limitado, que no se puede subvencionar todo y que hay que elegir prioridades.", en: "To begin with, I wouldn't promise anything I couldn't deliver. It sounds simple, but no politician dares. If I held the post, I would tell the truth: that the budget is limited, that not everything can be subsidised and that priorities have to be chosen." }
  - { es: "Mi primera prioridad sería el transporte público. Ojalá los autobuses pasaran cada cinco minutos y llegaran hasta el último barrio. Si el metro fuera gratuito para los menores de veinticinco años, muchos jóvenes dejarían el coche en casa. Y el carril bici no sería un dibujo en el suelo, sino una red de verdad por la que se pudiera ir sin miedo.", en: "My first priority would be public transport. If only the buses came every five minutes and reached the furthest neighbourhood. If the metro were free for people under twenty-five, many young people would leave the car at home. And the cycle lane wouldn't be a drawing on the ground, but a real network you could ride along without fear." }
  - { es: "En segundo lugar, la vivienda. Me gustaría que ninguna familia tuviera que irse de su barrio porque el alquiler se ha convertido en un lujo. Quisiera que el ayuntamiento construyera pisos públicos y que recaudara una tasa a los pisos vacíos. Sé que los propietarios protestarían como si les quitáramos la casa, pero no es así: es justicia.", en: "Secondly, housing. I would like no family to have to leave its neighbourhood because rent has become a luxury. I would like the council to build public flats and to collect a fee on empty flats. I know the owners would protest as if we were taking their homes away, but that is not the case: it is justice." }
  - { es: "También cambiaría la relación con la ciudadanía. Los concejales actúan a veces como si los vecinos fueran un problema y no la razón de su trabajo. Si yo fuera alcaldesa, cada mes habría una reunión abierta en cada barrio, y las decisiones importantes se consultarían con la gente antes de tomarlas.", en: "I would also change the relationship with the citizens. Councillors sometimes act as if residents were a problem and not the reason for their job. If I were mayor, every month there would be an open meeting in each neighbourhood, and important decisions would be put to the people before being taken." }
  - { es: "Alguien dirá que todo esto es un sueño, que si fuera tan fácil ya lo habría hecho alguien. Puede ser. Pero las ciudades que admiramos —las que tienen zonas verdes, calles peatonales y aire limpio— no nacieron así; alguien, en algún momento, decidió que valía la pena intentarlo.", en: "Someone will say that all this is a dream, that if it were so easy someone would already have done it. Maybe. But the cities we admire — the ones with green spaces, pedestrian streets and clean air — were not born that way; someone, at some point, decided it was worth trying." }
  - { es: "No soy candidata ni quiero serlo. Escribo esta columna porque creo que imaginar es el primer paso para exigir. Si todos pensáramos en la ciudad que queremos, quizá dejaríamos de aceptar la que tenemos. Ya era hora de que alguien lo dijera.", en: "I am not a candidate, nor do I want to be. I write this column because I believe that imagining is the first step towards demanding. If we all thought about the city we want, perhaps we would stop accepting the one we have. It was about time someone said so." }
questions:
  - { q: "What is the writer's first rule if she were mayor?", options: ["To lower all taxes", "Not to promise anything she couldn't deliver", "To close the city centre to cars"], answer: 1 }
  - { q: "What would she do about housing?", options: ["Build public flats and tax empty ones", "Ban all rentals", "Give every family a house"], answer: 0 }
  - { q: "How does she describe some councillors' attitude?", options: ["As if residents were a problem", "As if they were on holiday", "As if the city were a company"], answer: 0 }
  - { q: "Why does she say she writes the column?", options: ["Because she is running for mayor", "Because imagining is the first step towards demanding", "Because the newspaper asked her to"], answer: 1 }
glossary:
  - { es: imaginación, en: imagination }
  - { es: limitado, en: limited }
  - { es: dibujo, en: drawing }
  - { es: quitar, en: to take away }
  - { es: admirar, en: to admire }
