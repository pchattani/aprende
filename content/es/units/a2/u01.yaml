id: a2.u01
title: Ayer
lessons:
  - id: a2.u01.l1
    title: ¿Qué hiciste ayer?
    teach: [g.preterite-regular, g.time-markers-past]
    tip: "The preterite tells what happened: ayer comí, anoche salí."
    vocab: [w.ayer, w.anoche, w.anteayer, w.pasado, w.hace, w.el-otro-dia, w.rato, w.excursion, w.quedar-con, w.pasar, w.pasarlo-bien, w.disfrutar, w.gastar, w.genial]
    sentences:
      - { es: "Ayer trabajé hasta las ocho.", en: "Yesterday I worked until eight.", altEs: ["Ayer yo trabajé hasta las ocho."], grammar: [g.preterite-regular, g.time-markers-past], vocab: [w.ayer, w.trabajar] }
      - { es: "Anoche cené con mis padres.", en: "Last night I had dinner with my parents.", altEs: ["Ayer por la noche cené con mis padres."], grammar: [g.preterite-regular], vocab: [w.anoche, w.cenar] }
      - { es: "¿Qué comiste anteayer?", en: "What did you eat the day before yesterday?", altEs: ["¿Qué comiste tú anteayer?"], grammar: [g.preterite-regular], vocab: [w.anteayer, w.comer] }
      - { es: "La semana pasada visitamos a mis abuelos.", en: "Last week we visited my grandparents.", grammar: [g.time-markers-past], vocab: [w.pasado, w.visitar] }
      - { es: "Hace dos años viajé a Perú.", en: "Two years ago I travelled to Peru.", altEs: ["Viajé a Perú hace dos años."], grammar: [g.time-markers-past], vocab: [w.hace, w.viajar], error: { wrong: "Hace dos años viajo a Perú.", explain: "A finished past event takes the preterite: viajé.", grammar: g.preterite-regular } }
      - { es: "El otro día quedé con Ana en el centro.", en: "The other day I met up with Ana in the centre.", grammar: [g.preterite-regular], vocab: [w.el-otro-dia, w.quedar-con] }
      - { es: "Pasamos un rato muy agradable.", en: "We spent a very pleasant while.", grammar: [g.preterite-regular], vocab: [w.pasar, w.rato] }
      - { es: "Lo pasamos genial en la excursión.", en: "We had a great time on the trip.", grammar: [g.preterite-regular], vocab: [w.pasarlo-bien, w.genial, w.excursion] }
      - { es: "Disfruté mucho de las vacaciones.", en: "I really enjoyed the holidays.", altEs: ["Disfruté mucho las vacaciones."], grammar: [g.preterite-regular], vocab: [w.disfrutar, w.vacaciones] }
      - { es: "Gastaste demasiado dinero en ropa.", en: "You spent too much money on clothes.", altEs: ["Tú gastaste demasiado dinero en ropa.", "Te gastaste demasiado dinero en ropa."], grammar: [g.preterite-regular], vocab: [w.gastar, w.ropa] }
      - { es: "Mis hermanos llegaron tarde a la fiesta.", en: "My brothers arrived late to the party.", altEs: ["Mis hermanos llegaron a la fiesta tarde."], grammar: [g.preterite-regular], vocab: [w.llegar, w.fiesta] }
      - { es: "El año pasado aprendí a nadar.", en: "Last year I learnt to swim.", altEs: ["Aprendí a nadar el año pasado."], grammar: [g.preterite-regular], vocab: [w.aprender, w.nadar] }
      - { es: "Ella estudió toda la noche.", en: "She studied all night.", grammar: [g.preterite-regular], vocab: [w.estudiar, w.entradas.phr], transform: { instruction: "Change to 'we'", answer: "Estudiamos toda la noche.", alt: ["Nosotros estudiamos toda la noche."] } }
    exchanges:
      - q: { es: "¿Qué hiciste ayer?", en: "What did you do yesterday?" }
        a: { es: "Trabajé hasta las ocho y luego cené con mis padres.", en: "I worked until eight and then had dinner with my parents." }
        alt: ["Ayer trabajé hasta las ocho.", "Cené con mis padres."]
        grammar: [g.preterite-regular, g.time-markers-past]
        vocab: [w.ayer, w.trabajar]
      - q: { es: "¿Cuándo viajaste a Perú?", en: "When did you travel to Peru?" }
        a: { es: "Hace dos años.", en: "Two years ago." }
        alt: ["Viajé a Perú hace dos años.", "Hace dos años viajé a Perú."]
        grammar: [g.time-markers-past]
        vocab: [w.hace, w.viajar]
      - q: { es: "¿Qué tal la excursión?", en: "How was the trip?" }
        a: { es: "Genial, lo pasamos muy bien.", en: "Great, we had a very good time." }
        alt: ["Lo pasamos genial.", "Muy bien, disfrutamos mucho."]
        grammar: [g.preterite-regular]
        vocab: [w.pasarlo-bien, w.excursion]
      - q: { es: "¿Cuánto gastaste en ropa?", en: "How much did you spend on clothes?" }
        a: { es: "Gasté demasiado, casi cien euros.", en: "I spent too much, almost a hundred euros." }
        alt: ["Demasiado, casi cien euros.", "Casi cien euros."]
        grammar: [g.preterite-regular]
        vocab: [w.gastar, w.ropa]
    texts:
      - title: "Mensaje de Ana"
        es: ["Hola, ¿qué tal?", "Ayer quedé con Luis en el centro y cenamos en un restaurante nuevo.", "Lo pasamos genial.", "¿Quedamos el sábado?"]
        en: ["Hi, how are you?", "Yesterday I met up with Luis in the centre and we had dinner at a new restaurant.", "We had a great time.", "Shall we meet on Saturday?"]
        grammar: [g.preterite-regular, g.time-markers-past]
        vocab: [w.quedar-con, w.pasarlo-bien]
    spicy:
      - { es: "Anoche bailé contigo y hoy no trabajé nada.", en: "Last night I danced with you and today I didn't do any work.", grammar: [g.preterite-regular, g.time-markers-past], vocab: [w.anoche] }
      - { es: "El otro día te miré en el bar y hoy te hablo. Hola.", en: "The other day I looked at you in the bar and today I'm talking to you. Hi.", grammar: [g.preterite-regular, g.time-markers-past], vocab: [w.el-otro-dia] }
      - { es: "Lo pasé genial contigo. ¿Repetimos mañana?", en: "I had a great time with you. Shall we do it again tomorrow?", altEs: ["Me lo pasé genial contigo. ¿Repetimos mañana?"], grammar: [g.preterite-regular], vocab: [w.pasarlo-bien, w.genial] }
      - { es: "Gasté todo mi dinero en la cena de ayer, pero disfruté cada minuto contigo.", en: "I spent all my money on dinner yesterday, but I enjoyed every minute with you.", grammar: [g.preterite-regular], vocab: [w.gastar, w.disfrutar] }
      - { es: "Anteayer me miraste, ayer me hablaste... ¿y hoy?", en: "The day before yesterday you looked at me, yesterday you talked to me... and today?", grammar: [g.preterite-regular, g.time-markers-past], vocab: [w.anteayer, w.ayer] }
  - id: a2.u01.l2
    title: Un fin de semana estupendo
    teach: [g.preterite-spelling-changes]
    vocab: [w.de-repente, w.al-final, w.por-fin, w.exposicion, w.obra, w.discoteca, w.barbacoa, w.picnic, w.encontrarse, w.descubrir, w.bañarse, w.tomar-el-sol, w.sacar, w.estupendo, w.maravilloso]
    sentences:
      - { es: "El sábado fuimos a una exposición de fotografía.", en: "On Saturday we went to a photography exhibition.", grammar: [g.preterite-ser-ir], vocab: [w.exposicion] }
      - { es: "Vimos una obra de teatro estupenda.", en: "We saw a wonderful play.", altEs: ["Vimos una obra de teatro maravillosa."], grammar: [g.preterite-irregular], vocab: [w.obra, w.estupendo, w.teatro] }
      - { es: "Por la noche bailamos en una discoteca hasta las cuatro.", en: "At night we danced in a club until four.", grammar: [g.preterite-regular], vocab: [w.discoteca, w.bailar] }
      - { es: "El domingo hicimos una barbacoa en el jardín.", en: "On Sunday we had a barbecue in the garden.", grammar: [g.preterite-irregular], vocab: [w.barbacoa, w.hacer] }
      - { es: "Busqué un sitio para el picnic y pagué la comida.", en: "I looked for a spot for the picnic and paid for the food.", grammar: [g.preterite-spelling-changes], vocab: [w.buscar, w.pagar, w.picnic], error: { wrong: "Buscé un sitio para el picnic.", explain: "buscar → busqué (c → qu before e).", grammar: g.preterite-spelling-changes } }
      - { es: "Empecé a leer una novela maravillosa.", en: "I started reading a marvellous novel.", altEs: ["Empecé a leer una novela estupenda."], grammar: [g.preterite-spelling-changes], vocab: [w.empezar, w.maravilloso, w.novela] }
      - { es: "Nos bañamos en el mar y tomamos el sol.", en: "We swam in the sea and sunbathed.", grammar: [g.preterite-regular], vocab: [w.bañarse, w.tomar-el-sol] }
      - { es: "Saqué muchas fotos del paisaje.", en: "I took lots of photos of the landscape.", altEs: ["Hice muchas fotos del paisaje.", "Tomé muchas fotos del paisaje."], grammar: [g.preterite-spelling-changes], vocab: [w.sacar, w.foto] }
      - { es: "De repente empezó a llover.", en: "Suddenly it started to rain.", altEs: ["De pronto empezó a llover."], grammar: [g.time-markers-past], vocab: [w.de-repente, w.llover] }
      - { es: "Al final volvimos a casa en taxi.", en: "In the end we went back home by taxi.", altEs: ["Al final volvimos en taxi a casa."], grammar: [g.time-markers-past], vocab: [w.al-final, w.taxi.phr] }
      - { es: "Por fin descubrí un restaurante barato cerca de casa.", en: "At last I discovered a cheap restaurant near home.", grammar: [g.preterite-regular], vocab: [w.por-fin, w.descubrir] }
      - { es: "Me encontré con un viejo amigo en el mercado.", en: "I ran into an old friend at the market.", altEs: ["Me encontré con un antiguo amigo en el mercado."], grammar: [g.preterite-regular], vocab: [w.encontrarse, w.amigo] }
      - { es: "Mi abuela leyó el periódico y oyó la radio.", en: "My grandmother read the paper and listened to the radio.", grammar: [g.preterite-spelling-changes], vocab: [w.leer, w.oir, w.radio] }
      - { es: "Llegué a casa a las diez.", en: "I got home at ten.", altEs: ["Yo llegué a casa a las diez."], grammar: [g.preterite-spelling-changes], vocab: [w.llegar], transform: { instruction: "Change to 'you' (tú)", answer: "Llegaste a casa a las diez." } }
    exchanges:
      - q: { es: "¿Qué hicisteis el sábado?", en: "What did you do on Saturday?" }
        a: { es: "Fuimos a una exposición y después bailamos en una discoteca.", en: "We went to an exhibition and then danced in a club." }
        alt: ["Fuimos a una exposición.", "Bailamos en una discoteca hasta las cuatro."]
        grammar: [g.preterite-ser-ir, g.preterite-regular]
        vocab: [w.exposicion, w.discoteca]
      - q: { es: "¿Sacaste muchas fotos?", en: "Did you take many photos?" }
        a: { es: "Sí, saqué más de cien.", en: "Yes, I took more than a hundred." }
        alt: ["Sí, muchas.", "No, no saqué ninguna."]
        grammar: [g.preterite-spelling-changes]
        vocab: [w.sacar, w.foto]
      - q: { es: "¿A qué hora llegaste a casa?", en: "What time did you get home?" }
        a: { es: "Llegué a las dos de la mañana.", en: "I got home at two in the morning." }
        alt: ["A las dos.", "Llegué muy tarde."]
        grammar: [g.preterite-spelling-changes]
        vocab: [w.llegar]
      - q: { es: "¿Pagaste tú la comida?", en: "Did you pay for the food?" }
        a: { es: "Sí, la pagué yo.", en: "Yes, I paid for it." }
        alt: ["Sí, pagué yo.", "No, pagó Marta."]
        grammar: [g.preterite-spelling-changes, g.direct-object-pronouns]
        vocab: [w.pagar]
    texts:
      - title: "Nota en la nevera"
        es: ["Busqué las llaves por toda la casa y al final las encontré en el jardín.", "Saqué al perro y pagué la factura de la luz.", "¡Por fin un fin de semana tranquilo!"]
        en: ["I looked for the keys all over the house and in the end I found them in the garden.", "I took the dog out and paid the electricity bill.", "At last a quiet weekend!"]
        grammar: [g.preterite-spelling-changes]
        vocab: [w.buscar, w.pagar, w.por-fin]
    spicy:
      - { es: "Llegué a la discoteca, te vi y de repente olvidé bailar.", en: "I arrived at the club, I saw you and suddenly I forgot how to dance.", grammar: [g.preterite-spelling-changes, g.preterite-irregular], vocab: [w.de-repente, w.discoteca] }
      - { es: "Saqué una foto del cielo, pero al final saqué diez fotos de ti.", en: "I took a photo of the sky, but in the end I took ten photos of you.", grammar: [g.preterite-spelling-changes], vocab: [w.sacar, w.al-final] }
      - { es: "En el picnic busqué el queso y encontré a la persona más guapa del parque.", en: "At the picnic I looked for the cheese and found the best-looking person in the park.", grammar: [g.preterite-spelling-changes, g.preterite-regular], vocab: [w.picnic] }
      - { es: "Por fin te encontraste conmigo en la barbacoa. Fue estupendo.", en: "You finally ran into me at the barbecue. It was great.", grammar: [g.preterite-ser-ir, g.preterite-regular], vocab: [w.por-fin, w.encontrarse, w.estupendo] }
      - { es: "Empecé a hablar contigo por el vino y seguí por tus ojos.", en: "I started talking to you because of the wine and carried on because of your eyes.", grammar: [g.preterite-spelling-changes], vocab: [w.empezar] }
  - id: a2.u01.l3
    title: ¿Y qué tal?
    teach: [g.time-markers-past]
    vocab: [w.reir, w.llorar, w.cansarse, w.divertirse, w.aburrirse, w.quedarse, w.horrible, w.increible, w.fantastico, w.terrible, w.jefe, w.companero, w.vecino, w.nadie, w.alguien]
    sentences:
      - { es: "La película fue horrible; nos aburrimos mucho.", en: "The film was horrible; we got very bored.", grammar: [g.preterite-ser-ir], vocab: [w.horrible, w.aburrirse] }
      - { es: "El concierto fue increíble.", en: "The concert was incredible.", altEs: ["El concierto fue fantástico."], grammar: [g.preterite-ser-ir], vocab: [w.increible, w.concierto] }
      - { es: "Nos divertimos muchísimo en la boda.", en: "We had a great time at the wedding.", grammar: [g.preterite-stem-changing], vocab: [w.divertirse, w.boda] }
      - { es: "Me reí mucho con mis compañeros.", en: "I laughed a lot with my colleagues.", altEs: ["Yo me reí mucho con mis compañeros."], grammar: [g.preterite-regular], vocab: [w.reir, w.companero] }
      - { es: "El niño lloró toda la noche.", en: "The child cried all night.", altEs: ["El niño estuvo llorando toda la noche."], grammar: [g.preterite-regular], vocab: [w.llorar, w.nino] }
      - { es: "Me cansé y me quedé en casa.", en: "I got tired and stayed at home.", grammar: [g.preterite-regular], vocab: [w.cansarse, w.quedarse] }
      - { es: "Mi jefe no vino a la reunión.", en: "My boss didn't come to the meeting.", altEs: ["Mi jefe no fue a la reunión."], grammar: [g.preterite-irregular], vocab: [w.jefe, w.venir] }
      - { es: "Los vecinos hicieron mucho ruido anoche.", en: "The neighbours made a lot of noise last night.", grammar: [g.preterite-irregular], vocab: [w.vecino, w.ruido] }
      - { es: "No vi a nadie en la calle.", en: "I didn't see anyone in the street.", grammar: [g.indefinite-pronouns, g.a-personal], vocab: [w.nadie, w.ver] }
      - { es: "¿Alguien llamó por teléfono?", en: "Did anyone phone?", altEs: ["¿Llamó alguien por teléfono?"], grammar: [g.indefinite-pronouns], vocab: [w.alguien, w.llamar] }
      - { es: "Fue un día terrible: perdí las llaves y el autobús.", en: "It was a terrible day: I lost my keys and missed the bus.", grammar: [g.preterite-regular], vocab: [w.terrible, w.perder] }
      - { es: "Las vacaciones fueron fantásticas.", en: "The holidays were fantastic.", altEs: ["Las vacaciones fueron estupendas."], grammar: [g.preterite-ser-ir], vocab: [w.fantastico, w.vacaciones] }
      - { es: "Mi vecina se quedó en casa todo el fin de semana.", en: "My neighbour stayed at home all weekend.", grammar: [g.preterite-regular], vocab: [w.vecino, w.quedarse], error: { wrong: "Mi vecina quedó en casa todo el fin de semana.", explain: "quedarse (to stay) is reflexive: se quedó.", grammar: g.reflexive-verbs-present } }
    exchanges:
      - q: { es: "¿Qué tal la película?", en: "How was the film?" }
        a: { es: "Horrible, nos aburrimos mucho.", en: "Horrible, we got very bored." }
        alt: ["Fue horrible.", "Muy aburrida."]
        grammar: [g.preterite-ser-ir, g.preterite-regular]
        vocab: [w.horrible, w.aburrirse]
      - q: { es: "¿Vino tu jefe a la reunión?", en: "Did your boss come to the meeting?" }
        a: { es: "No, no vino nadie.", en: "No, nobody came." }
        alt: ["No, no vino.", "Sí, pero llegó tarde."]
        grammar: [g.preterite-irregular, g.indefinite-pronouns]
        vocab: [w.jefe, w.venir]
      - q: { es: "¿Te divertiste en la boda?", en: "Did you have fun at the wedding?" }
        a: { es: "Sí, me reí mucho con mis compañeros.", en: "Yes, I laughed a lot with my colleagues." }
        alt: ["Sí, mucho.", "Sí, lo pasé genial."]
        grammar: [g.preterite-stem-changing, g.preterite-regular]
        vocab: [w.divertirse, w.reir]
      - q: { es: "¿Alguien llamó esta mañana?", en: "Did anyone call this morning?" }
        a: { es: "No, nadie llamó.", en: "No, nobody called." }
        alt: ["No, no llamó nadie.", "Sí, llamó tu vecina."]
        grammar: [g.indefinite-pronouns]
        vocab: [w.alguien, w.nadie]
    texts:
      - title: "Mensaje de Marta"
        es: ["¡Qué día tan terrible!", "Perdí las llaves, llegué tarde al trabajo y mi jefe no vino a la reunión.", "Al final me quedé en casa y lloré un rato.", "Mañana será otro día."]
        en: ["What a terrible day!", "I lost my keys, got to work late and my boss didn't come to the meeting.", "In the end I stayed at home and cried for a while.", "Tomorrow is another day."]
        grammar: [g.preterite-regular, g.preterite-irregular]
        vocab: [w.terrible, w.quedarse, w.llorar]
    spicy:
      - { es: "Me reí mucho contigo anoche. Nadie me hace reír así.", en: "I laughed a lot with you last night. Nobody makes me laugh like that.", grammar: [g.preterite-stem-changing, g.indefinite-pronouns], vocab: [w.reir, w.nadie] }
      - { es: "Ayer mi vecino fue muy simpático, pero tú fuiste increíble.", en: "Yesterday my neighbour was very nice, but you were incredible.", altEs: ["Ayer mi vecina fue muy simpática, pero tú fuiste increíble."], grammar: [g.preterite-ser-ir], vocab: [w.vecino, w.increible] }
      - { es: "Nos divertimos tanto que me quedé hasta las tres.", en: "We had so much fun that I stayed until three.", grammar: [g.preterite-stem-changing, g.preterite-regular], vocab: [w.divertirse, w.quedarse] }
      - { es: "¿Alguien te dijo hoy que eres fantástico? Pues ya lo dije yo.", en: "Did anyone tell you today that you're fantastic? Well, now I have.", altEs: ["¿Alguien te dijo hoy que eres fantástica? Pues ya lo dije yo."], grammar: [g.preterite-irregular, g.indefinite-pronouns], vocab: [w.alguien, w.fantastico] }
      - { es: "No me aburrí ni un segundo contigo. Fue una noche terrible... para mi sueño.", en: "I wasn't bored for a second with you. It was a terrible night... for my sleep.", grammar: [g.preterite-regular, g.preterite-ser-ir], vocab: [w.aburrirse, w.terrible] }
  - id: a2.u01.l4
    title: Contar el fin de semana
    teach: [g.preterite-regular]
    vocab: [w.playa.phr, w.tarde.phr, w.taxi.phr, w.entrada.phr, w.pescar, w.llevar.phr, w.perderse, w.atasco, w.paella, w.buscar.phr, w.entradas.phr]
    sentences:
      - { es: "El fin de semana pasado fui a la playa con mi familia.", en: "Last weekend I went to the beach with my family.", grammar: [g.preterite-ser-ir], vocab: [w.playa.phr, w.playa] }
      - { es: "Salimos de casa a las siete y había un atasco enorme.", en: "We left home at seven and there was a huge traffic jam.", grammar: [g.preterite-vs-imperfect], vocab: [w.salir, w.atasco] }
      - { es: "Nos perdimos dos veces por el camino.", en: "We got lost twice on the way.", altEs: ["Nos perdimos dos veces en el camino."], grammar: [g.preterite-regular], vocab: [w.perderse, w.vez] }
      - { es: "El viaje llevó más de tres horas.", en: "The journey took more than three hours.", altEs: ["El viaje nos llevó más de tres horas."], grammar: [g.preterite-regular], vocab: [w.llevar.phr, w.viaje] }
      - { es: "Mi padre pescó un pez enorme.", en: "My father caught a huge fish.", grammar: [g.preterite-spelling-changes], vocab: [w.pescar] }
      - { es: "Comimos una paella riquísima en un restaurante de la playa.", en: "We ate a delicious paella in a beach restaurant.", grammar: [g.superlatives], vocab: [w.paella, w.comer] }
      - { es: "Por la tarde dimos una vuelta por el pueblo.", en: "In the afternoon we went for a stroll around the village.", altEs: ["Por la tarde paseamos por el pueblo."], grammar: [g.preterite-irregular], vocab: [w.buscar.phr, w.pueblo] }
      - { es: "Sacamos entradas para el concierto de la noche.", en: "We got tickets for the evening concert.", altEs: ["Compramos entradas para el concierto de la noche."], grammar: [g.preterite-regular], vocab: [w.entrada.phr, w.concierto] }
      - { es: "Bailamos hasta tarde y volvimos al hotel en taxi.", en: "We danced till late and went back to the hotel by taxi.", grammar: [g.preterite-regular], vocab: [w.tarde.phr, w.taxi.phr] }
      - { es: "El domingo dormimos toda la mañana.", en: "On Sunday we slept all morning.", altEs: ["El domingo nosotros dormimos toda la mañana."], grammar: [g.preterite-stem-changing], vocab: [w.dormir, w.manana.noun] }
      - { es: "¿Qué tal el fin de semana? — Genial, lo pasé muy bien.", en: "How was the weekend? — Great, I had a very good time.", grammar: [g.preterite-regular], vocab: [w.pasarlo-bien, w.genial] }
      - { es: "Mis primos pasaron toda la noche en la discoteca.", en: "My cousins spent all night at the club.", altEs: ["Mis primos se pasaron toda la noche en la discoteca."], grammar: [g.preterite-regular], vocab: [w.pasar, w.entradas.phr, w.discoteca], transform: { instruction: "Change to 'I'", answer: "Pasé toda la noche en la discoteca.", alt: ["Yo pasé toda la noche en la discoteca."] } }
    exchanges:
      - q: { es: "¿Adónde fuiste el fin de semana pasado?", en: "Where did you go last weekend?" }
        a: { es: "Fui a la playa con mi familia.", en: "I went to the beach with my family." }
        alt: ["A la playa, con mi familia.", "A la playa."]
        grammar: [g.preterite-ser-ir]
        vocab: [w.playa.phr, w.playa]
      - q: { es: "¿Cuánto tiempo llevó el viaje?", en: "How long did the journey take?" }
        a: { es: "Más de tres horas; había un atasco.", en: "More than three hours; there was a traffic jam." }
        alt: ["Más de tres horas.", "Tres horas, por el atasco."]
        grammar: [g.preterite-regular, g.preterite-vs-imperfect]
        vocab: [w.llevar.phr, w.atasco]
      - q: { es: "¿Qué comisteis?", en: "What did you eat?" }
        a: { es: "Comimos una paella en un restaurante de la playa.", en: "We ate a paella in a beach restaurant." }
        alt: ["Una paella.", "Comimos paella."]
        grammar: [g.preterite-regular]
        vocab: [w.paella, w.comer]
      - q: { es: "¿Os perdisteis?", en: "Did you get lost?" }
        a: { es: "Sí, nos perdimos dos veces.", en: "Yes, we got lost twice." }
        alt: ["Sí, dos veces.", "No, no nos perdimos."]
        grammar: [g.preterite-regular]
        vocab: [w.perderse, w.vez]
    texts:
      - title: "Postal desde la playa"
        es: ["¡Hola a todos!", "El sábado llegamos a la playa después de tres horas de atasco.", "Comimos paella, dimos una vuelta por el pueblo y bailamos hasta tarde.", "El domingo dormimos toda la mañana."]
        en: ["Hi everyone!", "On Saturday we got to the beach after three hours of traffic jam.", "We ate paella, went for a stroll around the village and danced till late.", "On Sunday we slept all morning."]
        grammar: [g.preterite-regular, g.preterite-irregular]
        vocab: [w.atasco, w.paella, w.tarde.phr]
    spicy:
      - { es: "Fuimos a la playa: tú nadaste y yo olvidé nadar.", en: "We went to the beach: you swam and I forgot how to swim.", grammar: [g.preterite-regular, g.preterite-ser-ir], vocab: [w.playa.phr] }
      - { es: "Compré dos entradas para el cine y la segunda es para ti.", en: "I bought two cinema tickets and the second one is for you.", grammar: [g.preterite-regular], vocab: [w.entradas.phr] }
      - { es: "Me perdí en la ciudad y llegué tarde, pero tú me esperaste. Gracias.", en: "I got lost in the city and arrived late, but you waited for me. Thanks.", grammar: [g.preterite-regular, g.preterite-stem-changing], vocab: [w.perderse, w.tarde.phr] }
      - { es: "Cocinaste una paella y yo comí tres platos. Ahora te quiero más.", en: "You cooked a paella and I ate three plates. Now I love you even more.", grammar: [g.preterite-regular], vocab: [w.paella] }
      - { es: "Tomamos un taxi juntos, hubo un atasco y fue la mejor hora de mi semana.", en: "We took a taxi together, there was a traffic jam and it was the best hour of my week.", grammar: [g.preterite-regular, g.preterite-irregular, g.superlatives], vocab: [w.taxi.phr, w.atasco] }
dialogues:
  - id: a2.u01.d1
    title: El lunes en la oficina
    context: Two colleagues, Marta and Luis, talk about their weekend on Monday morning.
    lines:
      - { speaker: Luis, es: "Buenos días, Marta. ¿Qué tal el fin de semana?", en: "Good morning, Marta. How was the weekend?" }
      - { speaker: Marta, es: "¡Genial! El sábado fuimos a la montaña y el domingo descansé en casa. ¿Y tú?", en: "Great! On Saturday we went to the mountains and on Sunday I rested at home. And you?" }
      - { speaker: Luis, es: "Yo lo pasé fatal. El sábado trabajé hasta las nueve y el domingo me quedé en casa con fiebre.", en: "I had an awful time. On Saturday I worked till nine and on Sunday I stayed at home with a fever." }
      - { speaker: Marta, es: "¡Qué horror! ¿Fuiste al médico?", en: "How awful! Did you go to the doctor?" }
      - { speaker: Luis, es: "No, tomé una pastilla y dormí toda la tarde. Hoy estoy mejor.", en: "No, I took a pill and slept all afternoon. Today I'm better." }
      - { speaker: Marta, es: "Menos mal. Nosotros caminamos cuatro horas, comimos en un pueblo pequeño y sacamos muchas fotos.", en: "Thank goodness. We walked for four hours, ate in a small village and took lots of photos." }
      - { speaker: Luis, es: "¿Y no llovió? El sábado aquí llovió mucho.", en: "And it didn't rain? Here it rained a lot on Saturday." }
      - { speaker: Marta, es: "Empezó a llover a las cinco, así que volvimos pronto. Al final llegamos a casa a las ocho.", en: "It started raining at five, so we came back early. In the end we got home at eight." }
      - { speaker: Luis, es: "Bueno, el próximo fin de semana quiero hacer algo divertido.", en: "Well, next weekend I want to do something fun." }
      - { speaker: Marta, es: "Pues ven con nosotros a la playa.", en: "Then come to the beach with us." }
    questions:
      - { q: "What did Marta do on Saturday?", options: ["She worked", "She went to the mountains", "She went to the beach"], answer: 1 }
      - { q: "Why did Luis stay home on Sunday?", options: ["It was raining", "He had a fever", "He was tired from work"], answer: 1 }
      - { q: "What time did Marta get home?", options: ["At five", "At eight", "At nine"], answer: 1 }
writing:
  - task: "Your friend tried to call you yesterday. Reply and tell her what you did in Luján: morning, afternoon and evening."
    es: "¿Qué hiciste ayer? ¡Te llamé tres veces!"
    min: 25
    max: 60
    use: [w.ayer, w.visitar, w.comprar, w.genial, w.pasar]
    useAtLeast: 3
    grammar: [g.preterite-regular, g.time-markers-past]
    expect:
      - { pattern: "\\b(ayer|anoche|por la (ma[nñ]ana|tarde|noche))", hint: "Say when: ayer, anoche, por la tarde …" }
      - { pattern: "\\b[a-zñ]{3,}(é|ó|aste|iste|amos|imos|aron|ieron)(?![a-záéíóúñ])|\\b(fui|fue|fuimos|hice|hizo|tuve|estuve|vi|comí|salí|bebí|volví|conocí|escribí|leí|aprendí)(?![a-záéíóúñ])", hint: "Use the preterite: visité, compré, comí …" }
    model: { es: "Ayer por la mañana visité la Basílica de Luján con mi amiga Clara. Después paseamos por la feria y compré unos regalos para mi familia. Por la noche cenamos en un restaurante pequeño. ¡Lo pasé genial!", en: "Yesterday morning I visited the Basilica of Luján with my friend Clara. Then we walked around the fair and I bought some presents for my family. In the evening we had dinner in a small restaurant. I had a great time!" }
  - task: "Write about last weekend. Use at least two yo forms with spelling changes: llegué, saqué, empecé, pagué, jugué, busqué."
    min: 30
    max: 60
    use: [w.sacar, w.llegar, w.empezar, w.pagar, w.por-fin]
    useAtLeast: 3
    grammar: [g.preterite-spelling-changes]
    expect:
      - { pattern: "(llegu|saqu|empec|pagu|jugu|busqu|toqu|almorc|expliqu|practiqu|cruc|comenc|aparqu|apagu)é", hint: "Use spelling-change forms: llegué, saqué, empecé, pagué …" }
      - { pattern: "fin de semana|\\bel (s[aá]bado|domingo|viernes)", hint: "Say when: el fin de semana pasado, el sábado …" }
    model: { es: "El fin de semana pasado fui a Luján en autobús. Llegué a las diez y empecé la visita en la Basílica. Saqué muchas fotos de la feria. Al final compré un helado y por fin descansé en un parque.", en: "Last weekend I went to Luján by bus. I arrived at ten and started the visit at the Basilica. I took lots of photos of the fair. In the end I bought an ice cream and finally rested in a park." }
  - task: "Reply to your friend's question: say how the trip went and how you felt (me divertí, me cansé, nos reímos …)."
    es: "¿Y qué tal la excursión? ¿Te divertiste?"
    min: 25
    max: 55
    use: [w.excursion, w.divertirse, w.cansarse, w.disfrutar, w.increible]
    useAtLeast: 3
    grammar: [g.preterite-regular]
    expect:
      - { pattern: "\\b(me|nos|se) (divert|aburr|cans|re[ií]|qued|perd)", hint: "Say how you felt: me divertí, me cansé, nos reímos …" }
    model: { es: "¡La excursión fue increíble! Me divertí mucho con mis compañeros y disfruté de la comida de la feria. Por la tarde me cansé un poco, pero nadie se aburrió. Nos reímos todo el día.", en: "The trip was incredible! I had lots of fun with my classmates and enjoyed the food at the fair. In the afternoon I got a bit tired, but nobody got bored. We laughed all day." }
  - task: "Write a diary entry about the last few days, using at least three past time expressions: anteayer, ayer, anoche, hace dos días, el otro día …"
    min: 25
    max: 55
    use: [w.anteayer, w.anoche, w.gastar, w.barbacoa]
    useAtLeast: 2
    grammar: [g.time-markers-past, g.preterite-regular]
    expect:
      - { pattern: "\\b(anteayer|anoche|ayer|hace (dos|tres|unos|un)|el otro d[ií]a|la semana pasada)", hint: "Use past time expressions: anteayer, anoche, hace dos días …" }
    model: { es: "Anteayer llegué a Luján en tren. Ayer visité el museo y gasté mucho dinero en la feria. Anoche quedé con unos amigos argentinos y cenamos una barbacoa. ¡Ahora tengo amigos nuevos!", en: "The day before yesterday I arrived in Luján by train. Yesterday I visited the museum and spent a lot of money at the fair. Last night I met up with some Argentine friends and we had a barbecue for dinner. Now I have new friends!" }
