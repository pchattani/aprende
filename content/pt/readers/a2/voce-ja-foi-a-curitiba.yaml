id: r.a2.voce-ja-foi-a-curitiba
level: a2
title: Você já foi a Curitiba?
kind: dialogue
intro: A local radio programme interviews Carmen, an architect from Salvador who moved to Curitiba three years ago. She talks about the experiences she has had in the city.
allow: [carmen, salvador, curitiba, curitibanos, curitibano, paraná, ok, rádio]
paragraphs:
  - { es: "— Bom dia, ouvintes! Hoje, no programa «Gente da Cidade», a nossa convidada é a Carmen, uma arquiteta baiana que mora em Curitiba há três anos. Bom dia, Carmen!", en: "'Good morning, listeners! Today on the programme People of the City, our guest is Carmen, an architect from Bahia who has lived in Curitiba for three years. Good morning, Carmen!'" }
  - { es: "— Bom dia! Obrigada pelo convite.", en: "'Good morning! Thank you for the invitation.'" }
  - { es: "— Carmen, por que você saiu de Salvador e veio para cá?", en: "'Carmen, why did you leave Salvador and come here?'" }
  - { es: "— Por causa do trabalho. Uma empresa daqui me ofereceu um emprego e eu aceitei. Antes, eu nunca tinha visitado o Sul. Para mim, foi uma aventura!", en: "'Because of work. A company here offered me a job and I accepted. Before, I'd never visited the South. For me, it was an adventure!'" }
  - { es: "— E qual foi a maior diferença?", en: "'And what was the biggest difference?'" }
  - { es: "— O frio, claro! Em Salvador faz calor o ano todo. Aqui, no inverno, a temperatura às vezes chega a zero grau. No meu primeiro inverno, eu comprei três casacos, luvas e um gorro. Hoje eu já me acostumei... quase!", en: "'The cold, of course! In Salvador it's hot all year round. Here, in winter, the temperature sometimes gets down to zero degrees. In my first winter, I bought three coats, gloves and a woolly hat. Now I'm used to it... almost!'" }
  - { es: "— E o que você já conheceu na cidade?", en: "'And what have you already seen in the city?'" }
  - { es: "— Já conheci muita coisa. Já fui ao Jardim Botânico, com aquela estufa de vidro linda. Já fui à Ópera de Arame, um teatro feito de metal, no meio das árvores. E já andei muito nos parques: Curitiba tem parques em todos os bairros.", en: "'I've already seen a lot. I've been to the Botanical Garden, with that beautiful glass greenhouse. I've been to the Ópera de Arame, a theatre made of metal, in the middle of the trees. And I've walked a lot in the parks: Curitiba has parks in every neighbourhood.'" }
  - { es: "— Como arquiteta, o que você acha do transporte da cidade?", en: "'As an architect, what do you think of the city's transport?'" }
  - { es: "— Eu acho muito interessante. Os ônibus têm pistas só para eles, e as estações são tubos de vidro. A gente paga antes de entrar, então é rápido. Muitas cidades do mundo já copiaram esse sistema.", en: "'I find it very interesting. The buses have lanes just for them, and the stations are glass tubes. You pay before getting on, so it's quick. Many cities around the world have already copied this system.'" }
  - { es: "— E as pessoas? Dizem que o curitibano é fechado...", en: "'And the people? They say people from Curitiba are reserved...'" }
  - { es: "— É verdade que no começo eles são mais sérios que os baianos. Mas, depois que você conhece, eles são muito amigos. Os meus vizinhos me convidam para almoçar todo domingo!", en: "'It's true that at first they're more serious than people from Bahia. But once you get to know them, they're very good friends. My neighbours invite me for lunch every Sunday!'" }
  - { es: "— E tem alguma coisa que você ainda não fez aqui?", en: "'And is there anything you haven't done here yet?'" }
  - { es: "— Tem! Eu ainda não peguei o trem para Morretes, que desce a serra até o litoral. Todo mundo diz que a viagem é linda. Vou fazer isso no mês que vem.", en: "'There is! I still haven't taken the train to Morretes, which goes down the mountains to the coast. Everyone says the journey is beautiful. I'm going to do it next month.'" }
  - { es: "— Muito obrigado, Carmen. E boa viagem!", en: "'Thank you very much, Carmen. And have a good trip!'" }
questions:
  - { q: "Por que a Carmen se mudou para Curitiba?", options: ["Por causa do trabalho", "Por causa da família", "Para estudar"], answer: 0, explain: "«Por causa do trabalho. Uma empresa daqui me ofereceu um emprego e eu aceitei.»" }
  - { q: "Qual foi a maior diferença para a Carmen?", options: ["A comida", "O frio", "O trânsito"], answer: 1, explain: "«O frio, claro! Em Salvador faz calor o ano todo.»" }
  - { q: "O que é a Ópera de Arame?", options: ["Uma estação de ônibus", "Um teatro de metal no meio das árvores", "Um restaurante famoso"], answer: 1, explain: "«Um teatro feito de metal, no meio das árvores.»" }
  - { q: "Como são as estações de ônibus de Curitiba?", options: ["Tubos de vidro", "Prédios antigos", "Embaixo da terra"], answer: 0, explain: "«As estações são tubos de vidro. A gente paga antes de entrar.»" }
  - { q: "O que a Carmen ainda não fez?", options: ["Visitar o Jardim Botânico", "Almoçar com os vizinhos", "Pegar o trem para Morretes"], answer: 2, explain: "«Eu ainda não peguei o trem para Morretes.» She plans to do it next month." }
glossary:
  - { es: ouvintes, en: listeners }
  - { es: transporte, en: transport }
  - { es: programa, en: programme }
  - { es: arquiteta, en: architect (f) }
  - { es: baiana, en: from Bahia (f) }
  - { es: baianos, en: people from Bahia }
  - { es: gorro, en: woolly hat }
  - { es: metal, en: metal }
  - { es: pistas, en: lanes }
  - { es: tubos, en: tubes }
  - { es: copiaram, en: copied (copiar) }
