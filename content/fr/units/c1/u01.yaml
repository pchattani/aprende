id: c1.u01
title: "Bordeaux, le port de la Lune"
lessons:
  - id: c1.u01.l1
    title: Il était une fois un port
    teach: [g.passe-simple-forms]
    tip: "-er verbs take -a (il épousa, ils arrivèrent); most -ir and -re verbs take -i (il partit, ils répondirent). In stories you will mostly meet the il / ils forms."
    vocab: [w.port-de-la-lune.nm, w.épouser, w.négociant, w.négoce, w.armateur, w.cargaison, w.entrepôt, w.développer, w.se-développer, w.développement, w.prospère, w.prospérité, w.repartir, w.s-éloigner, w.s-approcher, w.se-diriger, w.parcourir, w.flâner, w.errer, w.s-attarder, w.reflet, w.brume, w.lueur, w.déporter, w.jadis, w.naguère, w.barrique, w.traite, w.marchand, w.bordelais, w.charger, w.décharger, w.s-enrichir, w.revendre, w.renverser, w.s-endormir]
    sentences:
      - { es: "En 1137, Aliénor d'Aquitaine épousa le futur roi de France dans la cathédrale de Bordeaux.", en: "In 1137 Eleanor of Aquitaine married the future king of France in Bordeaux cathedral.", altEs: ["Aliénor d'Aquitaine épousa le futur roi de France dans la cathédrale de Bordeaux en 1137."], grammar: [g.passe-simple-forms], vocab: [w.épouser] }
      - { es: "Au XVIIIe siècle, le port se développa très vite grâce au négoce du vin.", en: "In the 18th century the port developed very quickly thanks to the wine trade.", altEs: ["Au dix-huitième siècle, le port se développa très vite grâce au négoce du vin.", "Le port se développa très vite au XVIIIe siècle grâce au négoce du vin."], grammar: [g.passe-simple-forms, g.passe-simple-usage], vocab: [w.se-développer, w.négoce] }
      - { es: "Les négociants des Chartrons gagnèrent des fortunes et la ville devint prospère.", en: "The Chartrons merchants made fortunes and the town became prosperous.", altEs: ["Les négociants du quartier des Chartrons gagnèrent des fortunes et la ville devint prospère."], grammar: [g.passe-simple-forms], vocab: [w.négociant, w.prospère, w.fortune] }
      - { es: "Les armateurs chargèrent leurs navires de barriques et les envoyèrent vers l'Angleterre.", en: "The shipowners loaded their ships with barrels and sent them to England.", altEs: ["Les armateurs remplirent leurs navires de barriques et les envoyèrent vers l'Angleterre."], grammar: [g.passe-simple-forms], vocab: [w.armateur, w.navire, w.barrique] }
      - { es: "On déchargea la cargaison sur le quai, puis on la rangea dans un entrepôt.", en: "They unloaded the cargo onto the quay, then stored it in a warehouse.", altEs: ["La cargaison fut déchargée sur le quai, puis rangée dans un entrepôt."], grammar: [g.passe-simple-forms], vocab: [w.cargaison, w.entrepôt, w.quai] }
      - { es: "Des armateurs bordelais participèrent à la traite : des milliers d'Africains furent déportés vers les Antilles.", en: "Bordeaux shipowners took part in the slave trade: thousands of Africans were deported to the West Indies.", grammar: [g.passe-simple-forms, g.passive-voice], vocab: [w.armateur, w.traite, w.déporter], note: "Bordeaux was one of France's main slave-trading ports in the 18th century; the city has commemorated this history since 2009 with rooms in the Musée d'Aquitaine." }
      - { es: "Elle flâna sur les quais, s'attarda devant les façades puis se dirigea vers la place de la Bourse.", en: "She strolled along the quays, lingered in front of the façades, then headed for the Place de la Bourse.", altEs: ["Elle flâna le long des quais, s'attarda devant les façades et se dirigea vers la place de la Bourse."], grammar: [g.passe-simple-forms], vocab: [w.flâner, w.s-attarder, w.se-diriger, w.façade] }
      - { es: "Nous errâmes longtemps dans les petites rues avant de retrouver le fleuve.", en: "We wandered for a long time in the little streets before finding the river again.", altEs: ["Nous errâmes longtemps dans les ruelles avant de retrouver le fleuve."], grammar: [g.passe-simple-forms], vocab: [w.errer, w.fleuve], note: "First-person plural passé simple: circumflex on -âmes." }
      - { es: "Le bateau s'éloigna lentement et disparut dans la brume du matin.", en: "The boat moved slowly away and disappeared into the morning mist.", altEs: ["Lentement, le bateau s'éloigna et disparut dans la brume du matin."], grammar: [g.passe-simple-forms], vocab: [w.s-éloigner, w.brume] }
      - { es: "Les façades blondes se reflétaient dans le miroir d'eau ; un enfant s'approcha pour toucher leur reflet.", en: "The golden façades were reflected in the water mirror; a child came closer to touch their reflection.", altEs: ["Les façades blondes se reflétaient dans le miroir d'eau, et un enfant s'approcha pour toucher leur reflet."], grammar: [g.passe-simple-forms, g.passe-simple-usage], vocab: [w.s-approcher, w.reflet, w.miroir] }
      - { es: "Jadis, les navires accostaient au pied de la place ; naguère encore, les quais étaient fermés par des grilles.", en: "Long ago ships docked at the foot of the square; not so long ago the quays were still shut off by railings.", grammar: [g.passe-simple-usage, g.imparfait-uses], vocab: [w.jadis, w.naguère, w.quai] }
      - { es: "Une lueur apparut sur la Garonne : le dernier navire repartit dans la nuit.", en: "A glimmer appeared on the Garonne: the last ship set off again into the night.", altEs: ["Une lueur apparut sur la Garonne, et le dernier navire repartit dans la nuit."], grammar: [g.passe-simple-forms], vocab: [w.lueur, w.repartir] }
      - { es: "Le développement du port attira des marchands de toute l'Europe.", en: "The development of the port attracted merchants from all over Europe.", altEs: ["Le développement du port fit venir des marchands de toute l'Europe."], grammar: [g.passe-simple-forms], vocab: [w.développement, w.marchand] }
      - { es: "Les négociants ont développé le commerce avec les îles.", en: "The merchants developed trade with the islands.", grammar: [g.passe-simple-forms], vocab: [w.négociant, w.développer], transform: { instruction: "Rewrite it in the passé simple, as in a history book", answer: "Les négociants développèrent le commerce avec les îles.", en: "The merchants developed trade with the islands." } }
      - { es: "Elle a quitté le quai et elle a marché vers le pont.", en: "She left the quay and walked towards the bridge.", grammar: [g.passe-simple-forms], vocab: [w.quai, w.pont], transform: { instruction: "Rewrite it in the passé simple", answer: "Elle quitta le quai et marcha vers le pont.", alt: ["Elle quitta le quai et elle marcha vers le pont."], en: "She left the quay and walked towards the bridge." } }
      - { es: "Les marins arrivèrent au port à l'aube.", en: "The sailors arrived at the port at dawn.", altEs: ["À l'aube, les marins arrivèrent au port."], grammar: [g.passe-simple-forms], vocab: [w.marin, w.aube], error: { wrong: "Les marins arrivirent au port à l'aube.", explain: "-er verbs take -èrent in the ils form: ils arrivèrent, never arrivirent.", grammar: g.passe-simple-forms } }
    exchanges:
      - q: { es: "Pourquoi appelle-t-on Bordeaux le port de la Lune ?", en: "Why is Bordeaux called the Port of the Moon?" }
        a: { es: "Parce que la Garonne y dessine un croissant, comme une lune.", en: "Because the Garonne forms a crescent there, like a moon." }
        alt: ["À cause du croissant que forme la Garonne.", "Parce que le fleuve a la forme d'un croissant de lune."]
        grammar: [g.passe-simple-usage]
        vocab: [w.port-de-la-lune.nm, w.croissant]
      - q: { es: "Comment les négociants se sont-ils enrichis ?", en: "How did the merchants get rich?" }
        a: { es: "Grâce au vin : ils l'ont acheté aux châteaux et l'ont revendu dans toute l'Europe.", en: "Thanks to wine: they bought it from the châteaux and sold it on all over Europe." }
        alt: ["Grâce au négoce du vin.", "Ils ont acheté et revendu du vin dans toute l'Europe.", "Le guide dit qu'ils achetèrent le vin aux châteaux et le revendirent dans toute l'Europe."]
        grammar: [g.passe-simple-forms]
        vocab: [w.négociant, w.négoce]
      - q: { es: "Tu as lu la plaque sur l'entrepôt ?", en: "Did you read the plaque on the warehouse?" }
        a: { es: "Oui : « Ici, en 1785, un armateur entreposa ses cargaisons de café. »", en: "Yes: 'Here, in 1785, a shipowner stored his cargoes of coffee.'" }
        alt: ["Oui, ça parle d'un armateur et de ses cargaisons.", "Non, je ne l'ai pas vue."]
        grammar: [g.passe-simple-usage]
        vocab: [w.entrepôt, w.armateur, w.cargaison]
      - q: { es: "On s'attarde encore un peu sur les quais ?", en: "Shall we linger on the quays a bit longer?" }
        a: { es: "Volontiers, la brume se lève et les reflets sur l'eau sont magnifiques.", en: "Gladly, the mist is lifting and the reflections on the water are magnificent." }
        alt: ["Oui, flânons encore un peu.", "Non, je suis fatigué, rentrons."]
        grammar: [g.passe-simple-usage]
        vocab: [w.s-attarder, w.brume, w.reflet]
      - q: { es: "La ville a toujours été aussi prospère ?", en: "Has the town always been so prosperous?" }
        a: { es: "Non, après la Révolution, le commerce s'est effondré et le port a perdu beaucoup de sa prospérité.", en: "No, after the Revolution trade collapsed and the port lost much of its prosperity." }
        alt: ["Non, elle a connu des périodes difficiles.", "Pas du tout, le port a beaucoup souffert après la Révolution."]
        grammar: [g.passe-simple-forms]
        vocab: [w.prospère, w.prospérité]
    texts:
      - title: "Panneau sur les quais"
        es: ["Au XVIIIe siècle, Bordeaux devint l'un des premiers ports du royaume.", "Les négociants firent construire les belles façades que vous voyez.", "Le port se développa grâce au vin, au sucre et au café, mais aussi grâce à la traite."]
        en: ["In the 18th century, Bordeaux became one of the leading ports of the kingdom.", "The merchants had the beautiful façades you can see built.", "The port grew thanks to wine, sugar and coffee, but also thanks to the slave trade."]
        grammar: [g.passe-simple-forms, g.passe-simple-usage]
        vocab: [w.négociant, w.se-développer, w.traite]
      - title: "Début d'une nouvelle"
        es: ["Ce soir-là, Jeanne erra longtemps sur les quais.", "Elle s'approcha de l'eau et regarda le reflet de la lune.", "Puis elle se dirigea vers le pont de pierre sans se retourner."]
        en: ["That evening, Jeanne wandered for a long time along the quays.", "She went up to the water and looked at the moon's reflection.", "Then she headed for the stone bridge without looking back."]
        grammar: [g.passe-simple-forms]
        vocab: [w.errer, w.s-approcher, w.reflet, w.se-diriger]
    spicy:
      - { es: "Il me regarda, je rougis, et le serveur renversa tout le vin sur la nappe.", en: "He looked at me, I blushed, and the waiter spilled all the wine on the tablecloth.", altEs: ["Il me regarda, je rougis et le serveur renversa tout le vin sur la nappe."], grammar: [g.passe-simple-forms], vocab: [w.rougir, w.renverser] }
      - { es: "Elle s'approcha, me prit la main, puis repartit sans un mot : je n'ai toujours pas compris.", en: "She came closer, took my hand, then left again without a word: I still haven't understood.", altEs: ["Elle s'approcha, me prit la main et repartit sans un mot ; je n'ai toujours pas compris."], grammar: [g.passe-simple-forms, g.passe-simple-usage], vocab: [w.s-approcher, w.repartir] }
      - { es: "Nous flânâmes sur les quais jusqu'à minuit ; mon téléphone, lui, s'éteignit à dix heures.", en: "We strolled along the quays until midnight; my phone, however, died at ten.", grammar: [g.passe-simple-forms], vocab: [w.flâner, w.s-éteindre] }
      - { es: "Jadis, on m'invitait à danser ; naguère encore, on me demandait mon numéro. Aujourd'hui, on me demande le wifi.", en: "Long ago people asked me to dance; not long ago they still asked for my number. Today they ask me for the wifi.", grammar: [g.passe-simple-usage, g.imparfait-uses], vocab: [w.jadis, w.naguère] }
      - { es: "Il parcourut trois cents kilomètres pour me voir et s'endormit pendant le dessert.", en: "He travelled three hundred kilometres to see me and fell asleep during dessert.", altEs: ["Il parcourut trois cents kilomètres pour me voir, puis il s'endormit pendant le dessert."], grammar: [g.passe-simple-forms], vocab: [w.parcourir, w.s-endormir] }
  - id: c1.u01.l2
    title: Naquit, vécut, mourut
    teach: [g.passe-simple-forms, g.passe-simple-usage]
    tip: "Learn the irregular trio: il naquit (naître), il vécut (vivre), il mourut (mourir). Être and avoir give il fut, il eut; venir and tenir give il vint, il tint."
    vocab: [w.publier, w.publication, w.éditeur, w.édition, w.esprit, w.essai, w.essayiste, w.philosophe, w.philosophie, w.philosophique, w.pensée, w.penseur, w.sagesse, w.moraliste, w.lumières, w.séparation-des-pouvoirs, w.magistrat, w.s-éteindre, w.périr, w.destinée, w.funèbre, w.dès-lors, w.s-emparer, w.paraître, w.succès, w.inspirer]
    sentences:
      - { es: "Montaigne naquit en 1533 au château de Montaigne et mourut en 1592.", en: "Montaigne was born in 1533 at the Château de Montaigne and died in 1592.", altEs: ["Montaigne naquit en 1533, au château de Montaigne, et mourut en 1592."], grammar: [g.passe-simple-forms], vocab: [w.naître, w.mourir] }
      - { es: "Il fut maire de Bordeaux de 1581 à 1585.", en: "He was mayor of Bordeaux from 1581 to 1585.", altEs: ["De 1581 à 1585, il fut maire de Bordeaux."], grammar: [g.passe-simple-forms], vocab: [w.maire] }
      - { es: "La première édition des Essais parut à Bordeaux en 1580.", en: "The first edition of the Essays came out in Bordeaux in 1580.", altEs: ["En 1580, la première édition des Essais parut à Bordeaux."], grammar: [g.passe-simple-forms], vocab: [w.édition, w.essai, w.paraître] }
      - { es: "L'essayiste prit pour devise une simple question : « Que sais-je ? »", en: "The essayist took a simple question as his motto: 'What do I know?'", altEs: ["L'essayiste choisit pour devise une simple question : « Que sais-je ? »"], grammar: [g.passe-simple-forms], vocab: [w.essayiste, w.devise] }
      - { es: "Montesquieu naquit au château de La Brède, près de Bordeaux, en 1689.", en: "Montesquieu was born at the Château de La Brède, near Bordeaux, in 1689.", grammar: [g.passe-simple-forms], vocab: [w.naître] }
      - { es: "Jeune magistrat, il vécut d'abord à Bordeaux, puis il voyagea dans toute l'Europe.", en: "As a young magistrate he lived first in Bordeaux, then he travelled all over Europe.", altEs: ["Jeune magistrat, il vécut d'abord à Bordeaux avant de voyager dans toute l'Europe."], grammar: [g.passe-simple-forms], vocab: [w.magistrat, w.vivre] }
      - { es: "En 1748, il publia De l'esprit des lois, où il défendit la séparation des pouvoirs.", en: "In 1748 he published The Spirit of the Laws, in which he argued for the separation of powers.", altEs: ["Il publia De l'esprit des lois en 1748 ; il y défendit la séparation des pouvoirs."], grammar: [g.passe-simple-forms], vocab: [w.publier, w.esprit, w.séparation-des-pouvoirs] }
      - { es: "Les penseurs des Lumières lurent ce livre avec passion.", en: "The thinkers of the Enlightenment read this book passionately.", altEs: ["Les penseurs des Lumières lurent ce livre avec passion et le discutèrent."], grammar: [g.passe-simple-forms], vocab: [w.penseur, w.lumières, w.lire] }
      - { es: "Le philosophe s'éteignit à Paris en 1755.", en: "The philosopher passed away in Paris in 1755.", altEs: ["Le philosophe mourut à Paris en 1755."], grammar: [g.passe-simple-forms], vocab: [w.philosophe, w.s-éteindre] }
      - { es: "En 1793, plusieurs députés girondins périrent sur l'échafaud.", en: "In 1793 several Girondin deputies perished on the scaffold.", grammar: [g.passe-simple-forms], vocab: [w.périr, w.député] }
      - { es: "Dès lors, sa destinée fut liée à celle de la ville.", en: "From then on, his destiny was bound up with that of the town.", altEs: ["Sa destinée fut dès lors liée à celle de la ville."], grammar: [g.passe-simple-forms, g.passe-simple-usage], vocab: [w.dès-lors, w.destinée] }
      - { es: "Ses pensées sur la mort ne sont pas funèbres : c'est une philosophie de la sagesse et de la liberté.", en: "His thoughts on death are not gloomy: it is a philosophy of wisdom and freedom.", grammar: [g.passe-simple-usage], vocab: [w.pensée, w.funèbre, w.philosophie, w.sagesse] }
      - { es: "Le moraliste écrivit ses textes philosophiques pour un large public, dit le guide.", en: "The moralist wrote his philosophical texts for a wide readership, the guide says.", altEs: ["D'après le guide, le moraliste écrivit ses textes philosophiques pour un large public."], grammar: [g.passe-simple-forms], vocab: [w.moraliste, w.philosophique] }
      - { es: "Il a vécu à Bordeaux et il est mort à Paris.", en: "He lived in Bordeaux and died in Paris.", grammar: [g.passe-simple-forms], vocab: [w.vivre, w.mourir], transform: { instruction: "Rewrite it in the passé simple, as in a biography", answer: "Il vécut à Bordeaux et mourut à Paris.", alt: ["Il vécut à Bordeaux et il mourut à Paris."], en: "He lived in Bordeaux and died in Paris." } }
      - { es: "François Mauriac est né à Bordeaux et a reçu le prix Nobel en 1952.", en: "François Mauriac was born in Bordeaux and received the Nobel Prize in 1952.", grammar: [g.passe-simple-forms], vocab: [w.naître, w.recevoir], transform: { instruction: "Rewrite it in the passé simple", answer: "François Mauriac naquit à Bordeaux et reçut le prix Nobel en 1952.", en: "François Mauriac was born in Bordeaux and received the Nobel Prize in 1952." } }
      - { es: "L'éditeur publia le livre et il eut un succès immédiat.", en: "The publisher brought out the book and it was an immediate success.", altEs: ["L'éditeur publia le livre, qui eut un succès immédiat."], grammar: [g.passe-simple-forms], vocab: [w.éditeur, w.publier, w.succès], error: { wrong: "L'éditeur publia le livre et il avit un succès immédiat.", explain: "avoir has the passé simple il eut (u type), from its participle eu.", grammar: g.passe-simple-forms } }
    exchanges:
      - q: { es: "Montaigne, c'était un écrivain ou un homme politique ?", en: "Was Montaigne a writer or a politician?" }
        a: { es: "Les deux : il écrivit les Essais et fut maire de Bordeaux.", en: "Both: he wrote the Essays and was mayor of Bordeaux." }
        alt: ["Les deux : il a écrit les Essais et il a été maire de Bordeaux.", "Un essayiste qui fut aussi maire de Bordeaux."]
        grammar: [g.passe-simple-forms]
        vocab: [w.essai, w.maire]
      - q: { es: "Que dit la plaque sur la maison ?", en: "What does the plaque on the house say?" }
        a: { es: "« Ici vécut le philosophe Montesquieu, qui publia De l'esprit des lois. »", en: "'Here lived the philosopher Montesquieu, who published The Spirit of the Laws.'" }
        alt: ["Que Montesquieu vécut ici.", "Elle dit qu'un philosophe a vécu ici."]
        grammar: [g.passe-simple-usage, g.literary-inversion]
        vocab: [w.philosophe, w.publier]
      - q: { es: "Tu connais la devise de Montaigne ?", en: "Do you know Montaigne's motto?" }
        a: { es: "Oui, « Que sais-je ? » : toute sa philosophie tient dans cette question.", en: "Yes, 'What do I know?': his whole philosophy is in that question." }
        alt: ["« Que sais-je ? »", "Non, c'est quoi ?"]
        grammar: [g.passe-simple-usage]
        vocab: [w.philosophie, w.devise]
      - q: { es: "Pourquoi lit-on encore Montesquieu aujourd'hui ?", en: "Why do people still read Montesquieu today?" }
        a: { es: "Parce que sa pensée sur la séparation des pouvoirs a inspiré de nombreuses constitutions.", en: "Because his thinking on the separation of powers inspired many constitutions." }
        alt: ["Pour ses idées sur la séparation des pouvoirs.", "Parce que c'est un grand penseur des Lumières."]
        grammar: [g.passe-simple-forms]
        vocab: [w.pensée, w.séparation-des-pouvoirs]
      - q: { es: "Ce livre est en quelle édition ?", en: "What edition is this book?" }
        a: { es: "C'est une édition de poche, publiée l'an dernier par un éditeur bordelais.", en: "It's a paperback edition, published last year by a Bordeaux publisher." }
        alt: ["Une édition de poche.", "Une vieille édition, je crois."]
        grammar: [g.passe-simple-usage]
        vocab: [w.édition, w.éditeur]
    texts:
      - title: "Notice biographique"
        es: ["Michel de Montaigne naquit en 1533 et mourut en 1592.", "Il fut magistrat, puis maire de Bordeaux.", "Dans les Essais, il fit de sa propre vie un sujet de philosophie."]
        en: ["Michel de Montaigne was born in 1533 and died in 1592.", "He was a magistrate, then mayor of Bordeaux.", "In the Essays, he made his own life a subject of philosophy."]
        grammar: [g.passe-simple-forms]
        vocab: [w.magistrat, w.essai, w.philosophie]
      - title: "Montesquieu en bref"
        es: ["Né en 1689 près de Bordeaux, Montesquieu publia d'abord les Lettres persanes, sans les signer.", "Puis il voyagea, observa et écrivit De l'esprit des lois.", "Il s'éteignit en 1755, célèbre dans toute l'Europe des Lumières."]
        en: ["Born in 1689 near Bordeaux, Montesquieu first published the Persian Letters without signing them.", "Then he travelled, observed and wrote The Spirit of the Laws.", "He passed away in 1755, famous throughout Enlightenment Europe."]
        grammar: [g.passe-simple-forms, g.passe-simple-usage]
        vocab: [w.publier, w.s-éteindre, w.lumières]
    spicy:
      - { es: "Il naquit charmant, vécut charmant et mourut sans jamais rappeler personne.", en: "He was born charming, lived charming and died without ever calling anyone back.", altEs: ["Il naquit charmant, vécut charmant et mourut sans avoir jamais rappelé personne."], grammar: [g.passe-simple-forms], vocab: [w.naître, w.vivre, w.mourir] }
      - { es: "Elle eut un sourire, il eut un vertige, et la soirée fut longue.", en: "She smiled, he went dizzy, and the evening was a long one.", grammar: [g.passe-simple-forms], vocab: [w.sourire, w.vertige] }
      - { es: "Dès lors, chaque fois qu'il parlait de philosophie, elle commandait une autre bouteille.", en: "From then on, every time he talked about philosophy, she ordered another bottle.", grammar: [g.passe-simple-usage, g.imparfait-uses], vocab: [w.dès-lors, w.philosophie] }
      - { es: "Il me cita Montaigne pour me séduire ; je lui répondis par la sagesse de ma grand-mère : « Paie l'addition. »", en: "He quoted Montaigne to win me over; I answered with my grandmother's wisdom: 'Pay the bill.'", grammar: [g.passe-simple-forms], vocab: [w.sagesse, w.séduire] }
      - { es: "Notre histoire parut en trois éditions : la version romantique, la version de ma mère et la vraie.", en: "Our story came out in three editions: the romantic version, my mother's version and the real one.", grammar: [g.passe-simple-forms], vocab: [w.édition, w.paraître] }
  - id: c1.u01.l3
    title: "« Non », répliqua-t-elle"
    teach: [g.passe-simple-usage]
    tip: "The narration is in passé simple + imparfait; what the characters say stays in spoken tenses. After a quotation the verb comes first: « Non », répliqua-t-elle."
    vocab: [w.narrer, w.narration, w.narratif, w.romanesque, w.intrigue, w.dénouement, w.chapitre, w.protagoniste, w.sangloter, w.soupirer, w.frémir, w.tressaillir, w.s-écrier, w.s-exclamer, w.répliquer, w.rétorquer, w.balbutier, w.chuchoter, w.gémir, w.fièrement, w.murmure, w.frapper, w.décor, w.distance]
    sentences:
      - { es: "« J'ai trouvé du travail au port », annonça-t-il fièrement.", en: "'I've found work at the port,' he announced proudly.", altEs: ["« J'ai trouvé du travail au port ! » annonça-t-il fièrement."], grammar: [g.passe-simple-usage, g.literary-inversion], vocab: [w.fièrement, w.annoncer] }
      - { es: "« Tu pars déjà ? » chuchota-t-elle.", en: "'Are you leaving already?' she whispered.", altEs: ["« Tu t'en vas déjà ? » chuchota-t-elle."], grammar: [g.passe-simple-usage, g.literary-inversion], vocab: [w.chuchoter] }
      - { es: "« Jamais ! » s'écria le vieux négociant.", en: "'Never!' cried the old merchant.", altEs: ["« Jamais ! » s'exclama le vieux négociant."], grammar: [g.passe-simple-usage], vocab: [w.s-écrier, w.négociant] }
      - { es: "« Vous vous trompez », répliqua-t-elle froidement.", en: "'You are mistaken,' she retorted coldly.", altEs: ["« Vous vous trompez », rétorqua-t-elle froidement."], grammar: [g.passe-simple-usage, g.literary-inversion], vocab: [w.répliquer] }
      - { es: "Il balbutia quelques excuses et sortit sans regarder personne.", en: "He stammered a few apologies and went out without looking at anyone.", altEs: ["Il balbutia des excuses et sortit sans regarder personne."], grammar: [g.passe-simple-forms, g.passe-simple-usage], vocab: [w.balbutier, w.excuse] }
      - { es: "La jeune femme tressaillit quand on frappa à la porte.", en: "The young woman started when someone knocked at the door.", altEs: ["La jeune femme tressaillit lorsqu'on frappa à la porte."], grammar: [g.passe-simple-forms, g.passe-simple-usage], vocab: [w.tressaillir, w.frapper] }
      - { es: "Elle lut la lettre, soupira, puis se mit à sangloter.", en: "She read the letter, sighed, then began to sob.", altEs: ["Elle lut la lettre, soupira et se mit à sangloter."], grammar: [g.passe-simple-forms], vocab: [w.soupirer, w.sangloter, w.lettre], transform: { instruction: "Tell it to a friend: rewrite it in the passé composé", answer: "Elle a lu la lettre, elle a soupiré, puis elle s'est mise à sangloter.", alt: ["Elle a lu la lettre, a soupiré, puis s'est mise à sangloter.", "Elle a lu la lettre, elle a soupiré et elle s'est mise à sangloter."], en: "She read the letter, sighed, then began to sob." } }
      - { es: "Le vent gémissait dans les mâts et toute la ville frémit.", en: "The wind was moaning in the masts and the whole town shuddered.", altEs: ["Le vent gémissait dans les mâts, et toute la ville frémit."], grammar: [g.passe-simple-usage, g.imparfait-uses], vocab: [w.gémir, w.frémir] }
      - { es: "Dans ce roman, la narration est au passé simple, mais les dialogues restent au passé composé.", en: "In this novel the narration is in the passé simple, but the dialogue stays in the passé composé.", grammar: [g.passe-simple-usage], vocab: [w.narration, w.roman] }
      - { es: "Le protagoniste arrive à Bordeaux au premier chapitre et repart au dernier.", en: "The protagonist arrives in Bordeaux in the first chapter and leaves in the last.", altEs: ["Le protagoniste arrive à Bordeaux dans le premier chapitre et repart dans le dernier."], grammar: [g.passe-simple-usage], vocab: [w.protagoniste, w.chapitre, w.repartir] }
      - { es: "L'intrigue est romanesque, mais le dénouement m'a déçue.", en: "The plot is romantic, but the ending disappointed me.", altEs: ["L'intrigue est très romanesque, mais le dénouement m'a déçu."], grammar: [g.passe-simple-usage], vocab: [w.intrigue, w.romanesque, w.dénouement] }
      - { es: "On entendait le murmure du fleuve sous les fenêtres.", en: "You could hear the murmur of the river under the windows.", grammar: [g.imparfait-uses, g.passe-simple-usage], vocab: [w.murmure] }
      - { es: "L'auteur narre la vie d'une famille de négociants sur trois générations.", en: "The author narrates the life of a family of merchants over three generations.", altEs: ["L'auteur raconte la vie d'une famille de négociants sur trois générations."], grammar: [g.passe-simple-usage], vocab: [w.narrer, w.génération] }
      - { es: "Ce texte narratif utilise le passé simple pour les actions et l'imparfait pour le décor.", en: "This narrative text uses the passé simple for actions and the imparfait for the setting.", grammar: [g.passe-simple-usage], vocab: [w.narratif, w.décor] }
      - { es: "« Je ne sais pas », a-t-il balbutié.", en: "'I don't know,' he stammered.", grammar: [g.passe-simple-usage], vocab: [w.balbutier], transform: { instruction: "Put the reporting verb in the passé simple, as in a novel", answer: "« Je ne sais pas », balbutia-t-il.", en: "'I don't know,' he stammered." } }
      - { es: "« C'est fini », dit-elle en soupirant.", en: "'It's over,' she said with a sigh.", altEs: ["« C'est fini », soupira-t-elle."], grammar: [g.passe-simple-usage, g.literary-inversion], vocab: [w.soupirer], error: { wrong: "« C'est fini », elle dit en soupirant.", explain: "After a quotation the reporting verb goes before its subject: dit-elle, not elle dit.", grammar: g.literary-inversion } }
    exchanges:
      - q: { es: "Il parle de quoi, ton roman ?", en: "What's your novel about?" }
        a: { es: "D'un jeune armateur qui arrive à Bordeaux en 1780 ; l'intrigue est très romanesque.", en: "A young shipowner who arrives in Bordeaux in 1780; the plot is very romantic." }
        alt: ["D'une famille de négociants bordelais.", "C'est l'histoire d'un armateur au XVIIIe siècle."]
        grammar: [g.passe-simple-usage]
        vocab: [w.intrigue, w.romanesque, w.armateur]
      - q: { es: "Pourquoi le livre est-il au passé simple ?", en: "Why is the book in the passé simple?" }
        a: { es: "C'est le temps de la narration écrite : il met de la distance entre le lecteur et l'histoire.", en: "It's the tense of written narration: it puts distance between the reader and the story." }
        alt: ["Parce que c'est un récit littéraire.", "Parce que les romans classiques sont souvent écrits au passé simple."]
        grammar: [g.passe-simple-usage]
        vocab: [w.narration]
      - q: { es: "Tu as aimé le dénouement ?", en: "Did you like the ending?" }
        a: { es: "Pas du tout : le protagoniste meurt au dernier chapitre !", en: "Not at all: the protagonist dies in the last chapter!" }
        alt: ["Oui, beaucoup.", "Pas vraiment, je l'ai trouvé trop triste."]
        grammar: [g.passe-simple-usage]
        vocab: [w.dénouement, w.protagoniste, w.chapitre]
      - q: { es: "Qu'est-ce qu'elle a répondu ?", en: "What did she answer?" }
        a: { es: "Dans le livre ? « Jamais », rétorqua-t-elle, et elle claqua la porte.", en: "In the book? 'Never,' she retorted, and she slammed the door." }
        alt: ["Elle a répondu « jamais ».", "Elle a dit non et elle est partie."]
        grammar: [g.passe-simple-usage, g.literary-inversion]
        vocab: [w.rétorquer]
      - q: { es: "Pourquoi tu chuchotes ?", en: "Why are you whispering?" }
        a: { es: "Parce qu'on est dans une bibliothèque, et que tout le monde nous regarde.", en: "Because we're in a library, and everyone is looking at us." }
        alt: ["On est à la bibliothèque !", "Parce que le bébé dort."]
        grammar: [g.passe-simple-usage]
        vocab: [w.chuchoter]
    texts:
      - title: "Extrait d'un roman"
        es: ["La pluie tombait sur le port depuis le matin.", "Soudain, une voix s'écria : « Le navire est là ! »", "Marie tressaillit, laissa sa lettre et courut vers le quai."]
        en: ["The rain had been falling on the port since morning.", "Suddenly a voice cried out: 'The ship is here!'", "Marie started, left her letter and ran towards the quay."]
        grammar: [g.passe-simple-usage, g.passe-simple-forms]
        vocab: [w.s-écrier, w.tressaillir]
      - title: "Conseil d'écriture"
        es: ["Choisissez un système de temps et gardez-le.", "Le récit avance au passé simple ; le décor reste à l'imparfait.", "Dans les dialogues, vos personnages parlent comme tout le monde."]
        en: ["Choose one tense system and keep to it.", "The story moves forward in the passé simple; the setting stays in the imparfait.", "In the dialogue, your characters speak like everybody else."]
        grammar: [g.passe-simple-usage]
        vocab: [w.récit]
    spicy:
      - { es: "« Tu danses ? » chuchota-t-il. « Seulement si tu ne chantes pas », répliqua-t-elle.", en: "'Do you dance?' he whispered. 'Only if you don't sing,' she retorted.", grammar: [g.passe-simple-usage, g.literary-inversion], vocab: [w.chuchoter, w.répliquer] }
      - { es: "Il balbutia trois mots, rougit, et je compris que le dénouement serait romanesque.", en: "He stammered three words, blushed, and I knew the ending would be a romantic one.", grammar: [g.passe-simple-forms, g.passe-simple-usage], vocab: [w.balbutier, w.dénouement, w.romanesque] }
      - { es: "« Encore un chapitre ? » soupira-t-elle. Il ne parlait pas du livre.", en: "'One more chapter?' she sighed. He wasn't talking about the book.", grammar: [g.passe-simple-usage, g.imparfait-uses], vocab: [w.soupirer, w.chapitre] }
      - { es: "Quand il me prit la main, je tressaillis ; quand il me montra la facture, je frémis.", en: "When he took my hand, I started; when he showed me the bill, I shuddered.", grammar: [g.passe-simple-forms], vocab: [w.tressaillir, w.frémir] }
      - { es: "« Tu es le protagoniste de mes rêves », s'exclama-t-il. « Et toi, le figurant », rétorqua-t-elle.", en: "'You're the protagonist of my dreams,' he exclaimed. 'And you're an extra,' she retorted.", grammar: [g.passe-simple-usage, g.literary-inversion], vocab: [w.s-exclamer, w.protagoniste, w.rétorquer] }
  - id: c1.u01.l4
    title: Quand il eut fini
    teach: [g.passe-anterieur]
    tip: "Passé antérieur = eut / fut + participle, for an action finished just before another in the passé simple: Quand il eut fini, il sortit. Dès qu'elle fut partie, on dîna."
    vocab: [w.aussitôt-que, w.après-que, w.à-peine-que, w.sitôt, w.s-effondrer, w.effondrement, w.s-enfuir, w.s-élancer, w.se-précipiter, w.surgir, w.naufragé, w.lugubre, w.sinistre, w.ténèbres, w.éclat, w.ombre, w.rosée, w.tumulte, w.fracas, w.vacarme, w.relâche, w.cadence, w.accoster, w.cacheter, w.instant, w.inconnu, w.capitaine, w.silhouette, w.volet, w.calmer]
    sentences:
      - { es: "Quand il eut fini sa lettre, il la cacheta et descendit au port.", en: "When he had finished his letter, he sealed it and went down to the port.", altEs: ["Lorsqu'il eut fini sa lettre, il la cacheta et descendit au port."], grammar: [g.passe-anterieur], vocab: [w.lettre, w.cacheter] }
      - { es: "Dès que le navire eut accosté, les dockers déchargèrent la cargaison.", en: "As soon as the ship had docked, the dockers unloaded the cargo.", altEs: ["Aussitôt que le navire eut accosté, les dockers déchargèrent la cargaison."], grammar: [g.passe-anterieur], vocab: [w.cargaison, w.accoster] }
      - { es: "Aussitôt que les invités furent partis, elle s'effondra dans un fauteuil.", en: "As soon as the guests had left, she collapsed into an armchair.", altEs: ["Dès que les invités furent partis, elle s'effondra dans un fauteuil."], grammar: [g.passe-anterieur], vocab: [w.aussitôt-que, w.s-effondrer, w.fauteuil] }
      - { es: "À peine eut-il ouvert la porte qu'une odeur de vin l'envahit.", en: "No sooner had he opened the door than a smell of wine filled the air around him.", altEs: ["À peine avait-il ouvert la porte qu'une odeur de vin l'envahit."], grammar: [g.passe-anterieur, g.literary-inversion], vocab: [w.à-peine-que, w.odeur], note: "À peine at the start of the clause triggers inversion: à peine eut-il…" }
      - { es: "Après que la tempête se fut calmée, les pêcheurs repartirent en mer.", en: "After the storm had died down, the fishermen went back out to sea.", altEs: ["Une fois la tempête calmée, les pêcheurs repartirent en mer."], grammar: [g.passe-anterieur], vocab: [w.après-que, w.tempête, w.repartir] }
      - { es: "Un homme surgit des ténèbres ; dès que le voleur l'eut aperçu, il s'enfuit.", en: "A man appeared out of the darkness; as soon as the thief had caught sight of him, he ran off.", altEs: ["Un homme surgit des ténèbres ; aussitôt que le voleur l'eut aperçu, il s'enfuit."], grammar: [g.passe-anterieur, g.passe-simple-forms], vocab: [w.surgir, w.ténèbres, w.s-enfuir, w.voleur] }
      - { es: "En un instant, il eut compris : le naufragé, c'était son frère.", en: "In an instant he had understood: the castaway was his brother.", grammar: [g.passe-anterieur], vocab: [w.naufragé], note: "In a main clause with en un instant, bientôt or vite, the passé antérieur stresses speed." }
      - { es: "Le navire heurta un rocher ; dans le fracas, les marins se précipitèrent sur le pont.", en: "The ship struck a rock; amid the crash, the sailors rushed onto the deck.", altEs: ["Le navire heurta un rocher, et dans le fracas, les marins se précipitèrent sur le pont."], grammar: [g.passe-simple-forms], vocab: [w.fracas, w.se-précipiter, w.heurter] }
      - { es: "La maison était lugubre et le jardin, à l'abandon, avait un air sinistre.", en: "The house was gloomy and the garden, neglected, looked sinister.", altEs: ["La maison était lugubre, et le jardin abandonné avait un air sinistre."], grammar: [g.passe-simple-usage, g.imparfait-uses], vocab: [w.lugubre, w.sinistre] }
      - { es: "L'effondrement de la vieille tour fit un vacarme terrible, puis le silence revint.", en: "The collapse of the old tower made a terrible din, then the silence returned.", grammar: [g.passe-simple-forms], vocab: [w.effondrement, w.vacarme, w.silence] }
      - { es: "Les rameurs gardèrent la cadence sans relâche jusqu'à l'aube.", en: "The rowers kept up the rhythm without a break until dawn.", altEs: ["Les rameurs gardèrent la cadence sans relâche jusqu'au lever du jour."], grammar: [g.passe-simple-forms], vocab: [w.cadence, w.relâche, w.aube] }
      - { es: "Au matin, la rosée brillait d'un éclat étrange sur les vignes ; dans l'ombre des arbres, il faisait froid.", en: "In the morning, the dew was shining with a strange brightness on the vines; in the shade of the trees it was cold.", grammar: [g.passe-simple-usage, g.imparfait-uses], vocab: [w.rosée, w.éclat, w.ombre, w.vigne] }
      - { es: "Sitôt la nouvelle connue, un grand tumulte s'empara de la ville.", en: "As soon as the news was known, a great commotion took hold of the town.", altEs: ["Dès que la nouvelle fut connue, un grand tumulte s'empara de la ville."], grammar: [g.passe-anterieur, g.passe-simple-forms], vocab: [w.sitôt, w.tumulte, w.s-emparer] }
      - { es: "Quand il a eu fini, il est sorti.", en: "When he had finished, he went out.", grammar: [g.passe-anterieur], vocab: [], note: "Quand il a eu fini is the spoken passé surcomposé, heard in the south of France.", transform: { instruction: "Rewrite it in literary style (passé antérieur + passé simple)", answer: "Quand il eut fini, il sortit.", alt: ["Lorsqu'il eut fini, il sortit."], en: "When he had finished, he went out." } }
      - { es: "Elle était partie. Ensuite, le silence est revenu.", en: "She had left. Then the silence came back.", grammar: [g.passe-anterieur], vocab: [w.silence], transform: { instruction: "Join them with après que, in literary style", answer: "Après qu'elle fut partie, le silence revint.", en: "After she had left, the silence came back." } }
      - { es: "Dès qu'il eut terminé son discours, la salle l'applaudit.", en: "As soon as he had finished his speech, the hall applauded him.", altEs: ["Dès qu'il eut fini son discours, la salle l'applaudit."], grammar: [g.passe-anterieur], vocab: [w.discours, w.applaudir], error: { wrong: "Dès qu'il eût terminé son discours, la salle l'applaudit.", explain: "The passé antérieur is il eut (no circumflex). Il eût, with a circumflex, is the subjonctif.", grammar: g.passe-anterieur } }
    exchanges:
      - q: { es: "Comment finit l'histoire du naufragé ?", en: "How does the castaway's story end?" }
        a: { es: "Dès qu'il eut aperçu la côte, il nagea sans relâche et finit par atteindre la plage.", en: "As soon as he had caught sight of the coast, he swam without stopping and finally reached the beach." }
        alt: ["Il atteint la plage, épuisé.", "Il est sauvé à la fin."]
        grammar: [g.passe-anterieur]
        vocab: [w.naufragé, w.relâche]
      - q: { es: "C'est quoi, ce vacarme dehors ?", en: "What's that racket outside?" }
        a: { es: "Les supporters : le match vient de finir et ils fêtent la victoire.", en: "The fans: the match has just ended and they're celebrating the win." }
        alt: ["Je ne sais pas, va voir.", "C'est un concert sur les quais."]
        grammar: [g.passe-anterieur]
        vocab: [w.vacarme]
      - q: { es: "Que se passe-t-il au chapitre trois ?", en: "What happens in chapter three?" }
        a: { es: "À peine le héros fut-il arrivé qu'un inconnu surgit de l'ombre.", en: "The hero had scarcely arrived when a stranger sprang out of the shadows." }
        alt: ["Un inconnu surgit de l'ombre.", "Le héros arrive et rencontre un inconnu."]
        grammar: [g.passe-anterieur, g.literary-inversion]
        vocab: [w.à-peine-que, w.surgir, w.ombre]
      - q: { es: "Pourquoi cette maison te fait peur ?", en: "Why does that house scare you?" }
        a: { es: "Elle est lugubre, avec ses volets fermés et son jardin plein d'ombres.", en: "It's gloomy, with its closed shutters and its garden full of shadows." }
        alt: ["Elle a l'air sinistre.", "Parce qu'elle est vide depuis des années."]
        grammar: [g.passe-simple-usage]
        vocab: [w.lugubre, w.ombre]
      - q: { es: "Qu'est-ce qu'ils ont fait après le dîner ?", en: "What did they do after dinner?" }
        a: { es: "Dans le roman ? Quand ils eurent dîné, ils se précipitèrent sur les quais pour voir le feu d'artifice.", en: "In the novel? When they had had dinner, they rushed to the quays to see the fireworks." }
        alt: ["Ils sont allés voir le feu d'artifice.", "Ils se sont promenés sur les quais."]
        grammar: [g.passe-anterieur]
        vocab: [w.se-précipiter]
    texts:
      - title: "La tempête"
        es: ["Vers minuit, le vent se leva.", "Quand les marins eurent fermé les écoutilles, une vague immense frappa le navire.", "Dans le fracas, le capitaine s'écria : « Tous sur le pont ! »"]
        en: ["Around midnight the wind got up.", "When the sailors had closed the hatches, a huge wave struck the ship.", "In the din, the captain cried: 'All hands on deck!'"]
        grammar: [g.passe-anterieur, g.passe-simple-usage]
        vocab: [w.fracas, w.s-écrier]
      - title: "Le retour"
        es: ["Dès qu'elle eut reconnu la silhouette du navire, elle s'élança sur le quai.", "Le naufragé descendit, épuisé.", "Elle se jeta dans ses bras sans un mot."]
        en: ["As soon as she had recognised the outline of the ship, she dashed onto the quay.", "The castaway came down, exhausted.", "She threw herself into his arms without a word."]
        grammar: [g.passe-anterieur]
        vocab: [w.s-élancer, w.naufragé]
    spicy:
      - { es: "À peine eut-il dit « bonsoir » que je sus que la soirée serait longue.", en: "He had barely said 'good evening' when I knew the evening would be a long one.", grammar: [g.passe-anterieur, g.literary-inversion], vocab: [w.à-peine-que] }
      - { es: "Dès qu'il eut goûté mes canelés, il me demanda en mariage ; dès qu'il eut goûté mon dessert, il retira sa demande.", en: "As soon as he had tasted my canelés, he asked me to marry him; as soon as he had tasted my dessert, he withdrew the offer.", grammar: [g.passe-anterieur], vocab: [w.goûter, w.dessert] }
      - { es: "Quand elle eut fini de danser, toute la salle s'effondra… d'admiration.", en: "When she had finished dancing, the whole room collapsed… with admiration.", grammar: [g.passe-anterieur], vocab: [w.s-effondrer, w.admiration] }
      - { es: "Il surgit des ténèbres avec deux verres de vin : je lui pardonnai tout.", en: "He appeared out of the darkness with two glasses of wine: I forgave him everything.", grammar: [g.passe-simple-forms], vocab: [w.surgir, w.ténèbres, w.pardonner] }
      - { es: "Aussitôt que ses parents furent partis, il mit de la musique et me fit danser jusqu'à l'aube.", en: "As soon as his parents had left, he put on music and danced with me until dawn.", grammar: [g.passe-anterieur], vocab: [w.aussitôt-que, w.aube] }
dialogues:
  - id: c1.u01.d1
    title: Devant le miroir d'eau
    context: Inès and Bastien sit by the water mirror on the Place de la Bourse. Bastien reads aloud from a historical novel set in 18th-century Bordeaux.
    lines:
      - { speaker: Bastien, es: "Écoute ça : « Le navire entra dans le port à l'aube. Quand il eut accosté, le jeune armateur descendit sur le quai. »", en: "Listen to this: 'The ship entered the port at dawn. When it had docked, the young shipowner went down onto the quay.'" }
      - { speaker: Inès, es: "Le passé simple, ça fait tout de suite grand roman. Personne ne parle comme ça !", en: "The passé simple instantly sounds like a great novel. Nobody talks like that!" }
      - { speaker: Bastien, es: "C'est bien pour ça qu'on l'utilise : ça met de la distance. Attends, la suite : « Il leva les yeux vers les façades et frémit. »", en: "That's exactly why it's used: it creates distance. Wait, here's the next bit: 'He looked up at the façades and shuddered.'" }
      - { speaker: Inès, es: "Pourquoi il frémit ? Elles sont superbes, ces façades.", en: "Why does he shudder? Those façades are superb." }
      - { speaker: Bastien, es: "Parce qu'elles ont été payées en partie par la traite. Le roman ne cache rien : son père était armateur négrier.", en: "Because they were partly paid for by the slave trade. The novel hides nothing: his father was a slave-ship owner." }
      - { speaker: Inès, es: "Ah, c'est sérieux. Le musée d'Aquitaine en parle aussi, il y a des salles entières sur ce sujet.", en: "Ah, it's serious. The Musée d'Aquitaine talks about it too; there are whole rooms on the subject." }
      - { speaker: Bastien, es: "Je sais, j'y suis allé hier. Bon, je continue : « Dès qu'il eut lu la lettre, il s'élança vers les Chartrons. »", en: "I know, I went yesterday. OK, I'll go on: 'As soon as he had read the letter, he dashed towards the Chartrons.'" }
      - { speaker: Inès, es: "Et après ? Ne me raconte pas le dénouement, hein !", en: "And then? Don't tell me the ending, OK!" }
      - { speaker: Bastien, es: "Promis. Mais regarde : le miroir d'eau se remplit, on voit le reflet de la place.", en: "Promise. But look: the water mirror is filling up, you can see the square's reflection." }
      - { speaker: Inès, es: "Magnifique. « Ils restèrent là jusqu'au soir, sans dire un mot », comme dans ton livre.", en: "Magnificent. 'They stayed there until evening, without saying a word,' like in your book." }
    questions:
