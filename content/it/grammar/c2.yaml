# C2 grammar notes (central Italy and back to Rome). Explanations use light
# markdown: ### headings, bullets, tables, **bold**, *italic* (Italian inline).
- id: g.dialects-overview
  level: c2
  title: "The dialects of Italy: sister languages, not 'bad Italian'"
  summary: "Italo-Romance dialects descend directly from Latin; Sardinian, Friulian and others are recognised minority languages."
  explanation: |
    The *dialetti* are not corrupted Italian: they developed from spoken Latin **alongside** Florentine, which became standard Italian. Many have centuries of literature.

    ### Main groups
    | group | where | examples |
    |---|---|---|
    | Gallo-Italic | Piedmont, Lombardy, Liguria, Emilia-Romagna | *piemontèis, lombard, zeneise* |
    | Venetan | Veneto, parts of Friuli and Trentino | *venexian* |
    | Tuscan | Tuscany | the base of standard Italian |
    | central | Lazio, Umbria, Marche, Abruzzo (north) | *romanesco* |
    | upper southern | Campania, Abruzzo, Molise, Apulia, Basilicata, north Calabria | *napoletano, barese* |
    | extreme southern | Sicily, Salento, south Calabria | *sicilianu* |

    ### Minority languages
    Law 482 of 1999 protects twelve historical minority languages, among them **Sardinian** (*sardu*), **Friulian**, **Ladin**, Occitan, Franco-Provençal, Albanian (*arbëresh*), Greek (*griko*), Catalan in Alghero, Slovene, Croatian and German.

    ### Diglossia today
    Most Italians now speak Italian as their first language; dialect survives in families, small towns, songs and humour, and is often mixed with Italian (*code-switching*).
  examples:
    - { es: "Il napoletano ha una tradizione letteraria e musicale di secoli.", en: "Neapolitan has a literary and musical tradition going back centuries." }
    - { es: "Il sardo è considerato una lingua a sé, non un dialetto italiano.", en: "Sardinian is considered a language in its own right, not an Italian dialect." }
    - { es: "Mio nonno passava dal dialetto all'italiano a seconda di chi aveva davanti.", en: "My grandfather switched between dialect and Italian depending on who he was talking to." }
  pitfalls:
    - "*Dialetto* in Italian linguistics means a distinct local language, not an accent; the accent with local features is *italiano regionale*."
    - "Don't assume a dialect speaker can understand every other dialect: Piedmontese and Sicilian are mutually unintelligible."
    - "Spanish speakers: the situation is closer to the relation between Castilian and Asturian or Aragonese than to Latin American accents."
  related: [g.regional-italian-features, g.questione-della-lingua, g.italian-varieties-overview]
  drills:
    - { es: "In famiglia parlavamo dialetto, a scuola italiano.", en: "At home we spoke dialect, at school Italian." }
    - { es: "Il friulano è tutelato come lingua minoritaria.", en: "Friulian is protected as a minority language." }
    - { es: "Ogni paese ha le sue parole e i suoi modi di dire.", en: "Every town has its own words and sayings." }
- id: g.regional-italian-features
  level: c2
  title: "Regional Italian: pronunciation, grammar and words across the country"
  summary: "The North, Tuscany, Rome and the South speak the same Italian with recognisably different sounds and structures."
  explanation: |
    ### Pronunciation
    | area | feature | example |
    |---|---|---|
    | North | intervocalic *s* is voiced; open/closed *e, o* differ from Tuscan | *ca[z]a*; *perch[è]* |
    | North | weak double consonants | *fato* for *fatto* |
    | Tuscany | *gorgia*: *c, t, p* between vowels softened | *la hasa* (*la casa*) |
    | Rome | *rr* single, *l* → *r* before consonant (in dialect) | *tera, er gatto* |
    | Centre-South | *raddoppiamento sintattico* | *a casa* → [akˈkaːsa] |
    | South | voicing after *n*, open final vowels | *tembo* (*tempo*) |

    ### Grammar
    - North: article with names (*la Giulia, il Marco*), passato prossimo only.
    - Tuscany: *noi si va* (we go), *codesto*, *te* as subject (*te che dici?*).
    - Rome and centre: *stare a* + infinitive (*sto a mangià*), *mo'* (now).
    - South: passato remoto, *tenere* = *avere*, *stare* = *essere*, accusative *a*.

    ### Words
    *anguria / cocomero / mellone* (watermelon); *stracchino / crescenza*; *michetta / rosetta* (bread roll); *marinare / bigiare / fare sega / fare forca* (skip school).
  examples:
    - { es: "A Milano senti dire 'la Giulia è arrivata'.", en: "In Milan you hear 'la Giulia è arrivata' (with the article)." }
    - { es: "A Firenze: 'Noi si va al cinema, te che fai?'", en: "In Florence: 'We're going to the cinema, what are you doing?'" }
    - { es: "A Roma: 'Che stai a fa'?'", en: "In Rome: 'What are you up to?'" }
    - { es: "A Napoli: 'Tengo sonno.'", en: "In Naples: 'I'm sleepy.'" }
  pitfalls:
    - "Regional features are normal in speech; identify them, but write standard Italian."
    - "*Fare sega* (skip school, Rome) is informal and not rude, but don't use it in an exam essay."
    - "Imitating an accent badly can come across as mockery."
  variant: "Umbria and Marche sit between Tuscan and southern patterns: you may hear Tuscan-like *-ccia* words and southern-style doubling in the same town."
  related: [g.dialects-overview, g.regional-italian-south, g.romanesco]
  drills:
    - { es: "In Toscana dicono cocomero, in Lombardia anguria.", en: "In Tuscany they say cocomero, in Lombardy anguria." }
    - { es: "Mo' arrivo!", en: "I'm coming now! (central-southern)" }
    - { es: "Te che ne pensi?", en: "What do you think? (Tuscan)" }
- id: g.questione-della-lingua
  level: c2
  title: "La questione della lingua: how Florentine became Italian"
  summary: "From Dante and Bembo to Manzoni, school, radio and television: a written language that became a spoken one."
  explanation: |
    ### Milestones
    | date | event |
    |---|---|
    | early 1300s | Dante's *De vulgari eloquentia* defends the vernacular; the *Commedia* gives it prestige |
    | 1300s | Petrarca and Boccaccio make Florentine the model for poetry and prose |
    | 1525 | Pietro Bembo, *Prose della volgar lingua*: imitate 14th-century Florentine (Petrarca, Boccaccio) |
    | 1583 / 1612 | the Accademia della Crusca is founded; its *Vocabolario* appears in 1612 |
    | 1840–42 | Manzoni's revised *I promessi sposi*, 'rinsed in the Arno' (*risciacquare i panni in Arno*): living Florentine as the model |
    | 1861 | unification: only a small minority speaks Italian habitually (Tullio De Mauro estimated about 2.5%) |
    | 1900s | compulsory schooling, the army, internal migration, radio and above all television spread spoken Italian |

    The result: Italian was for centuries a **written, literary language**; it became everyone's spoken language only in the twentieth century.
  examples:
    - { es: "Manzoni andò a Firenze per 'risciacquare i panni in Arno'.", en: "Manzoni went to Florence to 'rinse his clothes in the Arno'." }
    - { es: "Per secoli l'italiano fu soprattutto una lingua scritta.", en: "For centuries Italian was above all a written language." }
    - { es: "La televisione ha insegnato l'italiano a milioni di persone.", en: "Television taught Italian to millions of people." }
  pitfalls:
    - "Standard Italian is based on literary Florentine, not on Roman or modern Florentine speech."
    - "The Crusca is an academy of linguists, not a legal authority: it advises, it does not legislate."
    - "Spanish speakers: unlike Castilian, Italian spread without a central state for most of its history."
  related: [g.dialects-overview, g.old-italian, g.ottocento-prose]
  drills:
    - { es: "Bembo propose come modello Petrarca e Boccaccio.", en: "Bembo proposed Petrarca and Boccaccio as models." }
    - { es: "L'Accademia della Crusca fu fondata a Firenze.", en: "The Accademia della Crusca was founded in Florence." }
    - { es: "Dopo l'Unità, pochi italiani parlavano italiano.", en: "After Unification, few Italians spoke Italian." }
- id: g.old-italian
  level: c2
  title: "Reading Dante: the Italian of the Trecento"
  summary: "Old Florentine is close to modern Italian, but spelling, articles, verb forms and word order differ."
  explanation: |
    > *Nel mezzo del cammin di nostra vita*
    > *mi ritrovai per una selva oscura,*
    > *ché la diritta via era smarrita.* (Inferno I, 1–3)

    ### What changes
    | old | modern | note |
    |---|---|---|
    | *cammin* | *cammino* | truncation (apocope) |
    | *per una selva* | *in una selva* | *per* = through, in |
    | *ché* | *perché* | causal |
    | *diritta* | *dritta* | |
    | *lo* before consonants | *il* | *lo giorno* (Inf. II) |
    | *fue, puote* | *fu, può* | epithetic *-e* |
    | *avea, dicea* | *aveva, diceva* | old imperfetto |
    | *et* | *e* | Latinate spelling |
    | *ei, e'* | *egli, essi* | pronouns |
    | *vo, fo* | *vado, faccio* | short forms |

    ### Strategy
    Read with a modern paraphrase (*parafrasi*) beside the text; most Italian schools teach Dante this way. About 90% of Dante's basic vocabulary is still in use.
  examples:
    - { es: "Lo giorno se n'andava, e l'aere bruno toglieva li animai che sono in terra da le fatiche loro.", en: "The day was departing, and the dusky air was releasing the creatures on earth from their labours. (Inferno II)" }
    - { es: "Amor, ch'a nullo amato amar perdona.", en: "Love, which pardons no one loved from loving in return. (Inferno V)" }
    - { es: "Fatti non foste a viver come bruti.", en: "You were not made to live like brutes. (Inferno XXVI)" }
  pitfalls:
    - "*Per* often means 'through' or 'in' in old Italian, not 'for'."
    - "*Ché* with accent = because; *che* = that/which."
    - "Don't imitate Trecento forms in modern writing except as deliberate quotation."
  related: [g.archaic-forms, g.poetic-syntax, g.questione-della-lingua]
  drills:
    - { es: "Nel mezzo del cammin di nostra vita.", en: "Midway upon the journey of our life." }
    - { es: "E quindi uscimmo a riveder le stelle.", en: "And thence we came forth to see again the stars." }
    - { es: "Considerate la vostra semenza.", en: "Consider your origin." }
- id: g.archaic-forms
  level: c2
  title: "Archaic and poetic vocabulary: core, speme, augello, desio"
  summary: "Words and forms of the poetic tradition, alive in literature, opera libretti and songs."
  explanation: |
    | poetic | modern | English |
    |---|---|---|
    | *core, cor* | *cuore* | heart |
    | *speme* | *speranza* | hope |
    | *alma* | *anima* | soul |
    | *augello* | *uccello* | bird |
    | *desio* | *desiderio* | desire |
    | *beltà, beltade* | *bellezza* | beauty |
    | *lume* | *luce* | light |
    | *rimembrare* | *ricordare* | remember |
    | *aere* | *aria* | air |
    | *guardo* | *sguardo* | gaze |
    | *ermo* | *solitario* | lonely |
    | *periglio* | *pericolo* | danger |
    | *sovente* | *spesso* | often |
    | *fia* | *sarà* | will be |
    | *uopo (è d'uopo)* | *bisogno (è necessario)* | need |

    ### Where you meet them
    Leopardi, Foscolo, opera (*Libiamo ne' lieti calici*, *La donna è mobile qual piuma al vento*), Neapolitan song, and ironic modern use (*è d'uopo* = it is needful, jokingly).
  examples:
    - { es: "Silvia, rimembri ancora quel tempo della tua vita mortale?", en: "Silvia, do you still remember that time of your mortal life? (Leopardi)" }
    - { es: "La donna è mobile qual piuma al vento.", en: "Woman is fickle like a feather in the wind. (Verdi, Rigoletto)" }
    - { es: "Per questo lavoro è d'uopo una certa pazienza.", en: "This work calls for a certain patience. (ironic-formal)" }
  pitfalls:
    - "*Core* in a pop song is poetic or Roman/southern, not a spelling mistake."
    - "Using *speme* or *desio* in normal prose sounds parodic."
    - "*Ermo* means solitary, not 'hermit' (*eremita*)."
  related: [g.old-italian, g.poetic-syntax, g.literary-language]
  drills:
    - { es: "Ho il core in mano.", en: "My heart is in my hand. (poetic)" }
    - { es: "Sempre caro mi fu quest'ermo colle.", en: "This lonely hill was always dear to me. (Leopardi)" }
    - { es: "Sovente ripenso a quei giorni.", en: "I often think back to those days. (literary)" }
- id: g.poetic-syntax
  level: c2
  title: "Poetic syntax: inversion, truncation, elision"
  summary: "Anastrophe, hyperbaton, apocope (amor, son) and elision shape the rhythm of Italian verse."
  explanation: |
    ### Word order
    - **Anastrophe** (inverted pair): *Sempre caro mi fu* (= *mi fu sempre caro*).
    - **Hyperbaton** (words separated): *quest'ermo colle, / e questa siepe, che da tanta parte / dell'ultimo orizzonte il guardo esclude* (Leopardi) — object *il guardo* before its verb *esclude*.
    - Adjective before the noun: *dolci acque, verde prato*.

    ### Shortened forms
    - **Apocope / truncation**: *amor, cor, ver, son, dir, mar, fin* — *Amor che nella mente mi ragiona* (Dante).
    - **Elision**: *ch'io, s'io, d'amore*.
    - **Syncope**: *spirto* (*spirito*), *opra* (*opera*).

    ### Pronouns and verbs
    Enclisis on finite verbs (*dolce e chiara è la notte e senza vento*… *e queta sovra i tetti e in mezzo agli orti / posa la luna*), *ei* for *egli*, *fe'* for *fece*.

    To read verse, first rebuild the prose order (*costruzione*), then reread for the music.
  examples:
    - { es: "Chiare, fresche et dolci acque, ove le belle membra pose colei che sola a me par donna.", en: "Clear, fresh and sweet waters, where she who alone seems a woman to me laid her lovely limbs. (Petrarca)" }
    - { es: "Ei fu. Siccome immobile, dato il mortal sospiro…", en: "He was. Just as, motionless, having given his last breath… (Manzoni, Il cinque maggio)" }
    - { es: "Dolce e chiara è la notte e senza vento.", en: "Sweet and clear is the night and windless. (Leopardi)" }
  pitfalls:
    - "Truncated forms (*amor, cor*) are correct in verse and song; in prose they sound affected."
    - "Look for the verb first: hyperbaton often pushes it to the end of the clause."
    - "*Ei fu* = *egli fu* (he was / he is no more), the opening of Manzoni's ode on Napoleon."
  related: [g.archaic-forms, g.verse-metre, g.word-order-marked]
  drills:
    - { es: "Quel ramo del lago di Como, che volge a mezzogiorno.", en: "That branch of Lake Como which turns to the south. (Manzoni)" }
    - { es: "Son contento, ma il cor mi duole.", en: "I am content, but my heart aches. (poetic)" }
    - { es: "E il naufragar m'è dolce in questo mare.", en: "And sweet to me is foundering in this sea. (Leopardi)" }
- id: g.ottocento-prose
  level: c2
  title: "Nineteenth-century prose: Manzoni, Collodi, Verga"
  summary: "Long periods, passato remoto, egli/ella, and forms like la quale, giacché, onde."
  explanation: |
    ### Manzoni, *I promessi sposi* (1840–42)
    > *Quel ramo del lago di Como, che volge a mezzogiorno, tra due catene non interrotte di monti, tutto a seni e a golfi, a seconda dello sporgere e del rientrare di quelli…*

    Long, balanced periods; ironic narrator; Tuscanised but readable.

    ### Collodi, *Le avventure di Pinocchio* (1881–83)
    > *C'era una volta… — Un re! — diranno subito i miei piccoli lettori. — No, ragazzi, avete sbagliato. C'era una volta un pezzo di legno.*

    Lively Florentine: *codesto, babbo, garbato, uscio*.

    ### Typical 19th-century features
    | feature | example |
    |---|---|
    | *egli, ella, essi* | *Egli si volse.* |
    | enclitics on finite verbs | *volgevasi, disselo* |
    | *giacché, onde, ove, laonde* | conjunctions |
    | *-ava / -eva* imperfetto 1st person *-a* | *io aveva, io era* (Manzoni) |
    | *innanzi, dinanzi, appresso* | prepositions |
    | spelling *-j-* | *gioja, noja* |
  examples:
    - { es: "Questo matrimonio non s'ha da fare, né domani, né mai.", en: "This marriage is not to be performed, not tomorrow, not ever. (Manzoni)" }
    - { es: "C'era una volta un pezzo di legno.", en: "Once upon a time there was a piece of wood. (Collodi)" }
    - { es: "Io aveva promesso di tornare.", en: "I had promised to return. (19th-century first person)" }
  pitfalls:
    - "*Io aveva* is not an error in Manzoni: it was a common 1st-person form."
    - "*Babbo* (Tuscan) = *papà*; *uscio* = door."
    - "*Non s'ha da fare* = *non si deve fare*: a famous threat now used jokingly."
  related: [g.literary-language, g.questione-della-lingua, g.literary-devices]
  drills:
    - { es: "Questo matrimonio non s'ha da fare.", en: "This marriage must not take place." }
    - { es: "Il babbo di Pinocchio si chiamava Geppetto.", en: "Pinocchio's father was called Geppetto." }
    - { es: "Egli si volse e vide il lago.", en: "He turned and saw the lake." }
- id: g.literary-devices
  level: c2
  title: "Analysing literary style: narrator, focus, irony, symbol"
  summary: "The vocabulary of Italian literary analysis: narratore, focalizzazione, straniamento, umorismo pirandelliano."
  explanation: |
    | term | meaning |
    |---|---|
    | *narratore onnisciente / interno / esterno* | omniscient / first-person / external narrator |
    | *focalizzazione* | point of view |
    | *discorso indiretto libero* | free indirect speech (C1) |
    | *straniamento* | estrangement (Verga): the strange presented as normal and vice versa |
    | *regressione* | the narrator adopts the community's viewpoint (Verga) |
    | *umorismo* | Pirandello's 'feeling of the opposite' (*sentimento del contrario*) |
    | *flusso di coscienza* | stream of consciousness (Svevo) |
    | *allegoria, simbolo* | allegory, symbol |
    | *incipit / explicit* | opening / ending |
    | *registro, tono, lessico* | register, tone, vocabulary |

    ### Writing a *commento*
    *Il brano è tratto da… / Il narratore adotta il punto di vista di… / Il lessico è… / L'autore ricorre a… / Ne emerge un'immagine di…*
  examples:
    - { es: "Il brano è tratto dal primo capitolo dei Promessi sposi.", en: "The passage is taken from the first chapter of The Betrothed." }
    - { es: "Pirandello definisce l'umorismo come 'sentimento del contrario'.", en: "Pirandello defines humour as 'the feeling of the opposite'." }
    - { es: "Il narratore adotta il punto di vista del paese.", en: "The narrator adopts the village's point of view." }
  pitfalls:
    - "*Umorismo* in Pirandello is a technical concept, not just 'humour'."
    - "Use the present tense to discuss a text: *Manzoni descrive*, not *descrisse*."
    - "*Romanzo* = novel; *romanzesco* = novelistic / fanciful."
  related: [g.ottocento-prose, g.discorso-indiretto-libero, g.rhetorical-figures]
  drills:
    - { es: "L'autore ricorre a un lessico semplice e quotidiano.", en: "The author uses simple, everyday vocabulary." }
    - { es: "Ne emerge un ritratto amaro della società.", en: "A bitter portrait of society emerges." }
    - { es: "L'incipit del romanzo è celebre.", en: "The novel's opening is famous." }
- id: g.verse-metre
  level: c2
  title: "Italian metre: endecasillabo, settenario, sonetto, terzina"
  summary: "Counting syllables (with sinalefe), the main lines and forms of Italian poetry."
  explanation: |
    ### Counting syllables
    - Count up to and including the **last stressed syllable**, plus one.
    - **Sinalefe**: a final vowel and the next initial vowel merge into one syllable: *Nel / mez / zo / del / cam / min / di / no / stra / vi / ta* = 11.
    - **Dialefe**: the opposite, kept apart (rarer).

    ### Main lines
    | line | syllables | main stress |
    |---|---|---|
    | *endecasillabo* | 11 | on the 10th (and 4th or 6th) |
    | *settenario* | 7 | on the 6th |
    | *novenario* | 9 | on the 8th |

    ### Forms
    - **Terzina dantesca**: three-line stanzas rhyming ABA BCB CDC (*terza rima*).
    - **Sonetto**: 14 endecasillabi: two *quartine* + two *terzine* (ABBA ABBA CDE CDE…).
    - **Canzone leopardiana / canzone libera**: free mix of endecasillabi and settenari.
    - **Verso libero**: 20th century (Ungaretti, Montale).

    Rhymes: *baciata* (AA), *alternata* (ABAB), *incrociata* (ABBA), *incatenata* (ABA BCB).
  examples:
    - { es: "M'illumino d'immenso.", en: "I illuminate myself with immensity. (Ungaretti, free verse)" }
    - { es: "Meriggiare pallido e assorto presso un rovente muro d'orto.", en: "To spend the noon pale and absorbed by a scorching garden wall. (Montale)" }
    - { es: "Tanto gentile e tanto onesta pare la donna mia quand'ella altrui saluta.", en: "So gentle and so modest seems my lady when she greets others. (Dante, sonnet)" }
  pitfalls:
    - "Don't count every vowel: apply sinalefe between words."
    - "An Italian line ending on a stressed syllable (*verso tronco*) counts one extra syllable: *virtù* line of 10 written syllables = endecasillabo."
    - "English iambic pentameter counts stresses; Italian metre counts syllables."
  related: [g.poetic-syntax, g.rhetorical-figures]
  drills:
    - { es: "Nel mezzo del cammin di nostra vita.", en: "Midway upon the journey of our life. (an endecasillabo)" }
    - { es: "Il sonetto ha quattordici versi.", en: "The sonnet has fourteen lines." }
    - { es: "La Commedia è scritta in terzine.", en: "The Comedy is written in tercets." }
- id: g.rhetorical-figures
  level: c2
  title: "Rhetorical figures: anafora, chiasmo, litote, ossimoro…"
  summary: "Recognising and naming the figures of speech used in literature, speeches and advertising."
  explanation: |
    | figure | definition | example |
    |---|---|---|
    | *anafora* | repetition at the start | *Per me si va ne la città dolente, / per me si va ne l'etterno dolore* (Dante) |
    | *climax* | rising sequence | *Ho visto, ho capito, ho deciso.* |
    | *antitesi* | opposition | *Pace non trovo, et non ò da far guerra* (Petrarca) |
    | *ossimoro* | contradictory pair | *silenzio assordante, lucida follia* |
    | *chiasmo* | ABBA order | *Le donne, i cavallier, l'arme, gli amori* (Ariosto) |
    | *litote* | negating the opposite | *Non è un genio* (he's not clever) |
    | *metafora* | implicit comparison | *una pioggia di critiche* |
    | *metonimia* | part for related thing | *leggere Dante* (his works), *bere un bicchiere* |
    | *sineddoche* | part for whole | *una vela all'orizzonte* (a boat) |
    | *iperbole* | exaggeration | *Te l'ho detto mille volte!* |
    | *domanda retorica* | question needing no answer | *Chi non vorrebbe vivere qui?* |
    | *preterizione* | saying you won't say it | *Non dirò quanto sia stato scorretto…* |
    | *allitterazione* | repeated sounds | *il fresco profumo dei fiori* |
  examples:
    - { es: "È stato un silenzio assordante.", en: "It was a deafening silence. (oxymoron)" }
    - { es: "Non è certo il miglior ristorante di Roma.", en: "It's hardly the best restaurant in Rome. (litotes)" }
    - { es: "Non parlerò dei suoi errori, che tutti conoscono.", en: "I won't talk about his mistakes, which everyone knows. (preterition)" }
  pitfalls:
    - "*Litote* in Italian is very common in polite criticism: *non è il massimo*."
    - "*Climax* in Italian rhetoric means a gradual rise, not the peak itself."
    - "Metonymy vs synecdoche: *bere un bicchiere* (container for content) is metonymy."
  related: [g.persuasion-structures, g.literary-devices, g.irony-humour]
  drills:
    - { es: "Te l'ho detto mille volte!", en: "I've told you a thousand times! (hyperbole)" }
    - { es: "Chi non ama Roma?", en: "Who doesn't love Rome? (rhetorical question)" }
    - { es: "Ho letto tutto Pirandello.", en: "I've read all of Pirandello. (metonymy)" }
- id: g.persuasion-structures
  level: c2
  title: "Persuasion: tricolon, inclusive noi, concession and appeal"
  summary: "The structures of persuasive speeches and texts in Italian."
  explanation: |
    ### Techniques
    | technique | example |
    |---|---|
    | **tricolon** (three-part list) | *Lavoro, dignità, futuro.* |
    | **inclusive *noi*** | *Tutti noi sappiamo che…* |
    | **concession + rebuttal** | *È vero che costa, ma quanto ci costa non farlo?* |
    | **rhetorical question** | *Possiamo davvero permetterci di aspettare?* |
    | **contrast** | *Non chiediamo privilegi, chiediamo diritti.* |
    | **appeal to values** | *in nome dei nostri figli* |
    | **anaphora** | *Vogliamo scuole… Vogliamo ospedali… Vogliamo lavoro…* |
    | **imperative / exhortative** | *Facciamolo insieme. Scegliamo il futuro.* |

    ### Softening and authority
    *Come ha detto giustamente…*, *I dati parlano chiaro*, *Nessuno può negare che…*, *Mi permetto di ricordare che…*

    ### In advertising
    Second person *tu*, imperatives, wordplay, superlatives: *Scopri, prova, approfitta!*
  examples:
    - { es: "Non chiediamo favori: chiediamo giustizia.", en: "We are not asking for favours: we are asking for justice." }
    - { es: "Possiamo davvero restare a guardare?", en: "Can we really stand by and watch?" }
    - { es: "Insieme possiamo, insieme dobbiamo, insieme ce la faremo.", en: "Together we can, together we must, together we will make it." }
  pitfalls:
    - "Overusing rhetorical questions weakens an argument: one or two per speech."
    - "*Noi* inclusive can sound paternalistic if overused."
    - "Spanish speakers: Italian political rhetoric is often more elaborate and formal than Spanish; keep sentences balanced."
  related: [g.rhetorical-figures, g.political-language, g.argumentation-connectors]
  drills:
    - { es: "È vero che costa, ma non farlo costerebbe di più.", en: "It's true it's expensive, but not doing it would cost more." }
    - { es: "Scegliamo il futuro, scegliamo il coraggio.", en: "Let's choose the future, let's choose courage." }
    - { es: "Nessuno può negare che il problema esista.", en: "No one can deny that the problem exists." }
- id: g.political-language
  level: c2
  title: "Political Italian: politichese and its key terms"
  summary: "The vocabulary of Palazzo Chigi and Montecitorio, from manovra to inciucio."
  explanation: |
    ### Institutions
    *il Quirinale* (the President), *Palazzo Chigi* (the Prime Minister's office), *Montecitorio* (Chamber of Deputies), *Palazzo Madama* (Senate), *il Colle* (the President, informally).

    ### Everyday political terms
    | term | meaning |
    |---|---|
    | *la manovra (finanziaria)* | the budget |
    | *il decreto, il DPCM* | decree, prime-ministerial decree |
    | *la fiducia* | vote of confidence |
    | *le larghe intese* | grand coalition |
    | *il governo tecnico* | technocratic government |
    | *il rimpasto* | reshuffle |
    | *l'inciucio* (colloquial) | backroom deal |
    | *la poltrona* | a seat of power ('armchair') |
    | *il politichese* | opaque political jargon |
    | *convergenze parallele* | famous oxymoron (attributed to Aldo Moro) for unlikely alliances |

    ### Politichese
    Vague, nominal, euphemistic: *nell'ottica di un confronto costruttivo, a livello di, porre in essere, verificare le condizioni*.
  examples:
    - { es: "Il governo ha posto la fiducia sulla manovra.", en: "The government made the budget a matter of confidence." }
    - { es: "Si parla di un rimpasto dopo l'estate.", en: "There's talk of a reshuffle after the summer." }
    - { es: "È solo una questione di poltrone.", en: "It's just about grabbing positions." }
  pitfalls:
    - "*Il Colle* = the President of the Republic, not a hill in this context."
    - "*Inciucio* is pejorative and colloquial."
    - "Spanish speakers: *la manovra* is not a manoeuvre here but the annual budget law."
  related: [g.persuasion-structures, g.journalistic-language, g.economic-register]
  drills:
    - { es: "Il Quirinale ha firmato il decreto.", en: "The President has signed the decree." }
    - { es: "Le larghe intese non sono durate a lungo.", en: "The grand coalition didn't last long." }
    - { es: "Basta con il politichese!", en: "Enough of the political jargon!" }
- id: g.translation-nuance
  level: c2
  title: "Translating with nuance: structures that don't map"
  summary: "Phrasal verbs, -ing forms, 'you', passive, tense and register: translating sense, not words."
  explanation: |
    ### English → Italian
    | English | Italian strategy |
    |---|---|
    | phrasal verbs: *give up, carry on* | single verbs: *rinunciare, continuare* |
    | '-ing' as a noun | infinitive: *Swimming is fun* → *Nuotare è divertente* |
    | generic 'you' | *si*: *You never know* → *Non si sa mai* |
    | heavy passive | *si* passivante or active: *It is said that* → *Si dice che* |
    | 'would' for habits | imperfetto: *He would walk* → *Passeggiava* |
    | 'will' for willingness | present / *volere*: *Will you help me?* → *Mi aiuti?* |
    | adjective + noun stacks | *di* / relative clause: *a three-day city break* → *una vacanza di tre giorni in città* |

    ### Italian → English
    - Reflexive and pronominal verbs: *me ne vado* → I'm off.
    - Congiuntivo: usually disappears: *Penso che sia vero* → I think it's true.
    - Diminutives: *un caffettino* → a quick coffee.
    - Long periods: split into shorter sentences.

    ### Register
    Keep the same level: *Gentile cliente* → Dear customer; *Ciao bello!* → Hi, gorgeous!
  examples:
    - { es: "Non si sa mai.", en: "You never know." }
    - { es: "Ha smesso di fumare.", en: "He gave up smoking." }
    - { es: "Ci facciamo un caffettino?", en: "Shall we grab a quick coffee?" }
    - { es: "Da bambino passeggiava ogni sera con il nonno.", en: "As a child he would walk every evening with his grandfather." }
  pitfalls:
    - "Don't translate 'would' automatically with the conditional: often it is an imperfetto or a condizionale passato."
    - "Avoid literal calques like *fare senso* for 'make sense' (= *avere senso*)."
    - "Translate idioms with idioms: *piove a catinelle* = it's raining cats and dogs."
  related: [g.untranslatables, g.anglicisms-calques, g.false-friends-advanced]
  drills:
    - { es: "Ha senso quello che dici.", en: "What you say makes sense." }
    - { es: "Piove a catinelle.", en: "It's raining cats and dogs." }
    - { es: "Continua pure!", en: "Carry on!" }
- id: g.untranslatables
  level: c2
  title: "Untranslatable words: abbiocco, culaccino, menefreghismo, sprezzatura"
  summary: "Italian words with no single-word English equivalent, and how to render them."
  explanation: |
    | word | meaning |
    |---|---|
    | *abbiocco* | drowsiness after a big meal |
    | *culaccino* | the ring left on a table by a wet glass |
    | *gattara* | a (usually older) woman who feeds stray cats |
    | *menefreghismo* | not-caring attitude (from *me ne frego*, I don't care) |
    | *sprezzatura* | studied nonchalance (Castiglione, *Il Cortegiano*, 1528) |
    | *dolce far niente* | sweet idleness |
    | *meriggiare* | to rest in the shade at midday (Montale) |
    | *struscio* | the evening stroll on the main street (South) |
    | *magari* | I wish / maybe / even |
    | *qualunquismo* | cynical indifference to politics |
    | *furbizia* | cunning, street-smartness |
    | *figuraccia* | an embarrassing gaffe |
    | *spaghettata* | an informal spaghetti meal with friends |
    | *ci sta* (Roman) | it's fine / it makes sense / it's fair enough |

    ### Translation strategy
    Paraphrase (*a post-lunch slump*), borrow and explain (*sprezzatura*), or find a functional equivalent in context.
  examples:
    - { es: "Dopo la carbonara mi è venuto un abbiocco tremendo.", en: "After the carbonara I got terribly drowsy." }
    - { es: "Che figuraccia! Ho sbagliato nome.", en: "How embarrassing! I got her name wrong." }
    - { es: "Facciamo una spaghettata stasera?", en: "Shall we do a spaghetti night tonight?" }
    - { es: "Arrivare in ritardo ci sta, ma due ore no.", en: "Being late is fine, but two hours isn't." }
  pitfalls:
    - "Don't force a one-word translation: explain or adapt."
    - "*Menefreghismo* comes from *me ne frego*, a colloquial phrase; it's fine as a noun in writing."
    - "*Ci sta* is Roman-colloquial; in formal writing use *è comprensibile*, *è giusto*."
  related: [g.translation-nuance, g.wordplay, g.romanesco]
  drills:
    - { es: "Il menefreghismo è un problema serio.", en: "Not caring is a serious problem." }
    - { es: "Ho fatto una figuraccia davanti a tutti.", en: "I embarrassed myself in front of everyone." }
    - { es: "Che bello il dolce far niente!", en: "How lovely to do nothing at all!" }
- id: g.anglicisms-calques
  level: c2
  title: "Anglicisms, pseudo-anglicisms and calques"
  summary: "Il weekend, lo smart working, il footing, realizzare: English words and patterns in Italian."
  explanation: |
    ### Loanwords (invariable, mostly masculine)
    *il computer, il weekend, il file, la mail, lo stress, il manager, lo sport, i film* — no plural *-s*.

    ### Pseudo-anglicisms (English-looking, Italian meaning)
    | Italian | English meaning |
    |---|---|
    | *lo smart working* | remote working |
    | *il footing* | jogging |
    | *il ticket* | prescription co-payment |
    | *il box* | garage |
    | *il mister* | football coach |
    | *lo slip* | briefs |
    | *il beauty case* | toiletry bag |

    ### Calques (Italian words on English models)
    *grattacielo* (skyscraper), *fine settimana*, *fare la differenza*, *supportare* (support), *realizzare* (realise, disputed), *assumere* (assume, disputed: traditionally 'hire'), *processare dati*.

    The Accademia della Crusca often suggests Italian alternatives: *lavoro agile* for *smart working*, *riunione* for *meeting*.
  examples:
    - { es: "Lavoro in smart working due giorni a settimana.", en: "I work remotely two days a week." }
    - { es: "Ho mandato tre mail e nessuno risponde.", en: "I've sent three emails and nobody answers." }
    - { es: "Il mister ha cambiato formazione.", en: "The coach changed the line-up." }
  pitfalls:
    - "No *-s* plural on loanwords in Italian: *i computer, le mail*."
    - "*Box* in Italy is a garage; *smart working* is not used in English."
    - "*Assumere* traditionally means 'to hire'; 'assume' = *supporre, presumere*."
  related: [g.false-friends-advanced, g.neologisms, g.translation-nuance]
  drills:
    - { es: "Ho parcheggiato la macchina nel box.", en: "I parked the car in the garage." }
    - { es: "L'azienda ha assunto tre ragazzi.", en: "The company hired three young people." }
    - { es: "Vado a fare footing al parco.", en: "I'm going jogging in the park." }
- id: g.legal-register
  level: c2
  title: "Legal Italian: il ricorrente, ai sensi del comma 2, fatto salvo"
  summary: "The vocabulary and syntax of laws, contracts and judgments."
  explanation: |
    ### Vocabulary
    | term | meaning |
    |---|---|
    | *l'attore / il convenuto* | claimant / defendant (civil) |
    | *il ricorrente / il resistente* | appellant / respondent |
    | *l'imputato* | the accused (criminal) |
    | *la sentenza, il ricorso, l'udienza* | judgment, appeal, hearing |
    | *il codice civile (c.c.), il codice penale (c.p.)* | civil / criminal code |
    | *art., comma, lettera* | article, paragraph, point |
    | *il decreto legislativo (d.lgs.)* | legislative decree |
    | *fatto salvo, salvo quanto previsto* | without prejudice to, except as provided |
    | *decorrere* | to run (of time limits) |
    | *in difetto di, in mancanza di* | failing, in the absence of |
    | *recedere dal contratto* | withdraw from the contract |

    ### Syntax
    Future with deontic value (*Il conduttore pagherà…* = shall pay), passive and impersonal forms, present participles (*le parti contraenti*), *qualora* + congiuntivo, long chains of subordinates.
  examples:
    - { es: "Ai sensi dell'art. 1571 c.c., il conduttore è tenuto al pagamento del canone.", en: "Pursuant to art. 1571 of the Civil Code, the tenant is required to pay the rent." }
    - { es: "Il termine decorre dalla data di notifica.", en: "The time limit runs from the date of service." }
    - { es: "Fatto salvo quanto previsto dal comma 2, il contratto si intende rinnovato.", en: "Without prejudice to paragraph 2, the contract is deemed renewed." }
  pitfalls:
    - "*L'attore* in law = the claimant, not an actor."
    - "The legal future (*pagherà*) expresses obligation, like English 'shall'."
    - "*Comma* = paragraph of an article, not a punctuation comma (*virgola*)."
  related: [g.bureaucratic-italian, g.conditional-conjunctions, g.scientific-register]
  drills:
    - { es: "Le parti contraenti si impegnano a rispettare il presente accordo.", en: "The contracting parties undertake to respect this agreement." }
    - { es: "Il ricorso è stato respinto.", en: "The appeal was dismissed." }
    - { es: "Il conduttore potrà recedere dal contratto con sei mesi di preavviso.", en: "The tenant may withdraw from the contract with six months' notice." }
- id: g.scientific-register
  level: c2
  title: "Scientific Italian: impersonal, nominal, precise"
  summary: "Present tense, si passivante, Greek and Latin terminology, hedging and data language."
  explanation: |
    ### Features
    - **Present tense** for general truths: *L'acqua bolle a 100 °C.*
    - **Impersonal / passive**: *si osserva, è stato rilevato, viene misurato*.
    - **Nominalisation**: *la misurazione della temperatura*.
    - **Terminology** from Greek and Latin: *fotosintesi, ipotesi, emoglobina*.
    - **Hedging**: *i dati suggeriscono, sembrerebbe, è plausibile*.
    - **Numbers**: decimal comma (*3,5 %*), *circa, all'incirca, pari a, a fronte di*.

    ### Data and trends
    | | |
    |---|---|
    | *aumentare / crescere del 10 %* | rise by 10% |
    | *diminuire / calare, un calo* | fall, a drop |
    | *raddoppiare, dimezzarsi* | double, halve |
    | *rispetto a* | compared with |
    | *in media, la media* | on average |
    | *statisticamente significativo* | statistically significant |
  examples:
    - { es: "I risultati suggeriscono una correlazione tra le due variabili.", en: "The results suggest a correlation between the two variables." }
    - { es: "Il campione è stato analizzato a temperatura ambiente.", en: "The sample was analysed at room temperature." }
    - { es: "Le emissioni si sono ridotte del 12 % rispetto al 2020.", en: "Emissions fell by 12% compared with 2020." }
  pitfalls:
    - "Use *del* with percentages of change: *aumentare del 5 %*, not *aumentare di 5 %* (also found, but less common)."
    - "The decimal separator is a comma: *2,5 milioni*."
    - "Avoid *io* in papers; use *si* or authorial *noi*."
  related: [g.academic-register, g.nominalization, g.economic-register]
  drills:
    - { es: "Si osserva un aumento significativo.", en: "A significant increase is observed." }
    - { es: "La popolazione si è dimezzata in cinquant'anni.", en: "The population halved in fifty years." }
    - { es: "In media, il valore è pari a 3,2.", en: "On average, the value is 3.2." }
- id: g.economic-register
  level: c2
  title: "Economic Italian: il PIL, lo spread, la manovra"
  summary: "The vocabulary of finance and economics in the Italian press."
  explanation: |
    | term | meaning |
    |---|---|
    | *il PIL* (*prodotto interno lordo*) | GDP |
    | *lo spread* | gap between Italian and German bond yields |
    | *i titoli di Stato, i BTP* | government bonds |
    | *Piazza Affari* | the Milan Stock Exchange |
    | *il tasso d'interesse, d'inflazione, di disoccupazione* | interest / inflation / unemployment rate |
    | *crescita congiunturale / tendenziale* | quarter-on-quarter / year-on-year growth |
    | *il rapporto debito/PIL* | debt-to-GDP ratio |
    | *il fatturato, l'utile, la perdita* | turnover, profit, loss |
    | *il bilancio* | balance sheet / budget |
    | *la recessione, la ripresa* | recession, recovery |
    | *il cuneo fiscale* | tax wedge |
    | *la cassa integrazione* | state-backed short-time work scheme |

    Verbs: *salire, scendere, chiudere in rialzo / in ribasso, toccare un massimo, registrare un calo*.
  examples:
    - { es: "Piazza Affari ha chiuso in rialzo dell'1,2 %.", en: "The Milan Stock Exchange closed up 1.2%." }
    - { es: "Il PIL è cresciuto dello 0,3 % su base congiunturale.", en: "GDP grew by 0.3% quarter on quarter." }
    - { es: "L'azienda ha registrato un utile record.", en: "The company recorded a record profit." }
  pitfalls:
    - "*Bilancio* = balance sheet or budget; 'balance' of an account is *saldo*."
    - "*Lo spread* (masculine) is an established loanword in Italian news."
    - "*Fatturato* = turnover, not 'invoiced' as an adjective in this context."
  related: [g.political-language, g.scientific-register, g.journalistic-language]
  drills:
    - { es: "Lo spread è sceso sotto i 150 punti.", en: "The spread fell below 150 points." }
    - { es: "Il fatturato è aumentato del 7 %.", en: "Turnover rose by 7%." }
    - { es: "Il paese è uscito dalla recessione.", en: "The country has come out of recession." }
- id: g.wordplay
  level: c2
  title: "Wordplay: puns, double meanings and playful language"
  summary: "Giochi di parole in jokes, headlines and adverts; how Italians play with sounds and meanings."
  explanation: |
    ### Types
    | type | example |
    |---|---|
    | **homophones / homographs** | *pesca* (peach / fishing), *riso* (rice / laughter), *porto* (port / I carry) |
    | **stress pairs** | *àncora* (anchor) / *ancóra* (again), *prìncipi* (princes) / *princìpi* (principles) |
    | **idioms taken literally** | *Ho perso la testa* — *E dove l'hai lasciata?* |
    | **blends** | *apericena* (aperitivo + cena) |
    | **spoonerisms and anagrams** | *Roma / amor* |
    | **headlines** | puns on names and idioms are a newspaper favourite |

    ### Classic jokes
    *Le barzellette*: *C'è un italiano, un francese e un tedesco…* — and *freddure* (groan-worthy puns): *Qual è il colmo per un elettricista? — Fare le scintille.*

    *Il colmo per…* ('the height of… for a…') is a traditional pun format.
  examples:
    - { es: "Qual è il colmo per un elettricista? Non essere al corrente.", en: "What's the height of irony for an electrician? Not being 'al corrente' (up to date / on the current). (pun)" }
    - { es: "Roma letta al contrario fa amor.", en: "Roma read backwards gives 'amor'." }
    - { es: "Ridere fa bene, e anche il riso con i funghi.", en: "Laughing is good for you, and so is rice with mushrooms. (riso = laughter / rice)" }
  pitfalls:
    - "Puns rarely survive translation: explain or replace them."
    - "Stress pairs are not marked in normal spelling: context decides *àncora / ancóra*."
    - "*Freddura* = a deliberately bad pun; laugh politely."
  related: [g.irony-humour, g.neologisms, g.untranslatables]
  drills:
    - { es: "Vado a pesca e mangio una pesca.", en: "I go fishing and eat a peach." }
    - { es: "Questo è un principio, non un principe!", en: "This is a principle, not a prince!" }
    - { es: "L'apericena è un'invenzione milanese.", en: "The apericena is a Milanese invention." }
- id: g.slang-giovanile
  level: c2
  title: "Youth slang: figo, sbatti, scialla, cringe"
  summary: "Linguaggio giovanile: regional slang gone national, anglicisms and abbreviations."
  explanation: |
    | word | meaning | origin / note |
    |---|---|---|
    | *figo / figa* | cool | national (*figa* also vulgar for a woman: careful) |
    | *ganzo* | cool | Tuscan |
    | *scialla* | chill, relax | Roman |
    | *sbatti* | hassle | *che sbatti!* |
    | *gasato* | excited, pumped | |
    | *rosicare* | to be jealous, sore | Roman, now national |
    | *bella!* | hi! / nice! | greeting |
    | *raga* | guys | *ragazzi* |
    | *cringe, boomer, crush, flexare* | as in English | anglicisms |
    | *spoilerare, ghostare* | to spoil, to ghost | verbed anglicisms |
    | *tvb, cmq, nn, xké* | ti voglio bene, comunque, non, perché | texting |

    Slang changes fast and marks age and region: understand it, use it only with friends.
  examples:
    - { es: "Bella, raga! Che si fa stasera?", en: "Hey guys! What are we doing tonight?" }
    - { es: "Scialla, non c'è fretta.", en: "Chill, there's no rush." }
    - { es: "Che sbatti andare in centro con questo traffico!", en: "What a hassle going into town with this traffic!" }
    - { es: "Non spoilerarmi il finale!", en: "Don't spoil the ending for me!" }
  pitfalls:
    - "*Figa* as a noun is vulgar; *figo / fighissimo* as adjectives are fine among friends."
    - "Texting abbreviations (*xké, cmq*) never belong in formal writing."
    - "Slang dates quickly: what is cool today may sound like a *boomer* tomorrow."
  related: [g.colloquial-italian, g.neologisms, g.romanesco]
  drills:
    - { es: "Che figata questo concerto!", en: "This concert is awesome!" }
    - { es: "Non rosicare, hai perso!", en: "Don't be a sore loser, you lost!" }
    - { es: "Cmq ci vediamo dopo, tvb.", en: "Anyway, see you later, love you. (texting)" }
- id: g.neologisms
  level: c2
  title: "Neologisms: petaloso, apericena, googlare"
  summary: "How new Italian words are formed and accepted: suffixes, blends, verbs from brands and loans."
  explanation: |
    ### Formation patterns
    | pattern | examples |
    |---|---|
    | suffix *-oso, -ismo, -ista* | *petaloso* (full of petals), *buonismo* (do-goodism) |
    | blends | *apericena, webete* (web + ebete), *cantautore* (older) |
    | verbs in *-are* from nouns and brands | *googlare, whatsappare, taggare, postare* |
    | prefix *ri-, de-, s-* | *ripostare, desecretare, sbloccare* |
    | from English | *il follower, lo streaming, il podcast* |

    ### Petaloso
    In 2016 a primary-school pupil used *petaloso*; the Accademia della Crusca replied that the word is well formed and could enter the dictionary if people used it. It became a national story — an example of how Italian accepts new words.

    Dictionaries (Treccani, Zingarelli) publish annual lists of *neologismi*.
  examples:
    - { es: "Ci vediamo per un apericena sui Navigli?", en: "Shall we meet for an apericena on the Navigli?" }
    - { es: "Googla l'indirizzo, io non me lo ricordo.", en: "Google the address, I can't remember it." }
    - { es: "Il bambino ha descritto il fiore come 'petaloso'.", en: "The child described the flower as 'petaloso' (full of petals)." }
  pitfalls:
    - "New verbs follow -are conjugation: *googlo, googli, googla*."
    - "Many neologisms are informal: *webete* is insulting."
    - "Spanish speakers: Italian adapts verbs similarly (*googlear* → *googlare*)."
  related: [g.word-formation, g.anglicisms-calques, g.slang-giovanile]
  drills:
    - { es: "Ho postato le foto del matrimonio.", en: "I posted the wedding photos." }
    - { es: "Mi ha ghostato dopo due appuntamenti.", en: "He ghosted me after two dates." }
    - { es: "Il buonismo non risolve i problemi.", en: "Do-goodism doesn't solve problems." }
- id: g.romanesco
  level: c2
  title: "Romanesco: annamo, mo', daje, er"
  summary: "The speech of Rome, from Belli's sonnets to football chants and Alberto Sordi."
  explanation: |
    Romanesco is close to Italian (Rome was 'Tuscanised' in the Renaissance), so it is easy to understand once you know its patterns.

    | romanesco | Italian | feature |
    |---|---|---|
    | *annamo* | *andiamo* | *nd → nn* |
    | *quanno, monno* | *quando, mondo* | *nd → nn* |
    | *er gatto, sordi* | *il gatto, soldi* | *l → r* before a consonant |
    | *fijo, mejo, moje* | *figlio, meglio, moglie* | *gl → j* |
    | *magnà, fa', vedé* | *mangiare, fare, vedere* | truncated infinitives |
    | *nun* | *non* | |
    | *sò, semo* | *sono, siamo* | |
    | *mo'* | *adesso* | now |
    | *daje!* | *dai!* | come on! |
    | *aò!* | *ehi!* | hey! |
    | *che te frega?* | *che t'importa?* | what's it to you? |
    | *stai a dì / sto a magnà* | *stai dicendo / sto mangiando* | *stare a* + inf. |

    ### Culture
    Giuseppe Gioachino Belli wrote over two thousand sonnets in romanesco in the 1800s; Trilussa followed in the early 1900s; cinema made it famous nationwide (Alberto Sordi, Anna Magnani).
  examples:
    - { es: "Daje Roma, daje!", en: "Come on, Roma! (football)" }
    - { es: "Aò, che stai a dì?", en: "Hey, what are you on about?" }
    - { es: "Annamo a magnà, che c'ho fame.", en: "Let's go and eat, I'm hungry." }
    - { es: "Mo' te lo spiego.", en: "I'll explain it to you now." }
  pitfalls:
    - "Romanesco forms are for listening and fun; don't put *annamo* in an email."
    - "*Che te frega* is informal and can sound rude."
    - "*Daje* is cheerful encouragement, now heard well beyond Rome."
  variant: "Roman Italian (the regional Italian of educated Romans) shows softer versions: *mo'*, *stare a* + infinitive, open vowels, single *rr*, without full dialect forms like *er* or *sò*."
  related: [g.regional-italian-features, g.slang-giovanile, g.native-fluency-markers]
  drills:
    - { es: "Che te frega?", en: "What's it to you?" }
    - { es: "Daje, che ce la famo!", en: "Come on, we can do it!" }
    - { es: "Mo' annamo a casa.", en: "Now let's go home." }
- id: g.native-fluency-markers
  level: c2
  title: "Sounding native: rhythm, fillers, backchannels and gestures"
  summary: "The small things that make Italian sound natural: allora, cioè, niente; raddoppiamento; reacting while listening."
  explanation: |
    ### Fillers and openers
    *Allora…, Dunque…, Cioè…, Niente, …* (*Niente, alla fine non è venuto.* = Anyway…), *Praticamente…, Diciamo che…, Tipo…*

    ### Backchannels (showing you're listening)
    *Sì sì. Certo. Ah, ecco. Esatto. Appunto. Davvero? Ma dai! Ma va'! Pensa te! Che peccato! Ci credo!* (I'm not surprised!)

    ### Rhythm and sound
    - **Raddoppiamento sintattico** (Centre-South and standard): after *a, da, e, è, che, tre, più, ma* the next consonant doubles: *a casa* [akˈkaːsa], *tre cani* [trekˈkaːni].
    - Real **double consonants**: *pala / palla, caro / carro, sete / sette*.
    - Short, rising tag questions: *…, no?*, *…, vero?*, *…, eh?*

    ### Gestures (recognise them)
    Fingers pinched upward (*ma che vuoi?*), hand flicked under the chin (*non me ne importa*), finger on the cheek (*buono!*).

    ### Turn-taking
    Overlapping speech is normal and friendly; long silences feel awkward.
  examples:
    - { es: "Niente, alla fine siamo rimasti a casa.", en: "Anyway, in the end we stayed home." }
    - { es: "Ma va'! Davvero ha detto così?", en: "No way! Did he really say that?" }
    - { es: "Diciamo che non è stata una bella serata.", en: "Let's just say it wasn't a great evening." }
    - { es: "Ah, ecco, ora capisco.", en: "Oh, right, now I get it." }
  pitfalls:
    - "Overusing *tipo* and *cioè* sounds teenage; mix them with *diciamo, praticamente*."
    - "Double consonants change meaning: *nonno* (grandpa) vs *nono* (ninth), *anno* vs *ano*."
    - "Spanish speakers: Spanish has almost no geminates, so practise *fatto, sette, palla* carefully."
  related: [g.discourse-particles, g.colloquial-italian, g.romanesco]
  drills:
    - { es: "Allora, dove eravamo rimasti?", en: "So, where were we?" }
    - { es: "Pensa te, non lo sapevo!", en: "Fancy that, I didn't know!" }
    - { es: "Ci credo, con quel traffico!", en: "No wonder, with that traffic!" }
- id: g.c2-review
  level: c2
  title: "C2 review: the whole of Italian"
  summary: "From dialect to Dante, from burocratese to slang: choosing the right Italian for every situation."
  explanation: |
    ### What mastery means
    | area | can you…? |
    |---|---|
    | grammar | use all moods and tenses by meaning, not by rule |
    | varieties | recognise regional Italian, the main dialect groups and Romanesco |
    | history | explain how Florentine became Italian |
    | literature | read Dante with notes, Manzoni, Leopardi and Pirandello unaided |
    | registers | switch between legal, scientific, journalistic, colloquial and youth Italian |
    | rhetoric | analyse and use figures and persuasive structures |
    | translation | render idioms, puns and untranslatables naturally |
    | pragmatics | soften, joke, ironise and react like a native |

    ### Final checklist
    - *Se l'avessi saputo, sarei venuto* — and *se lo sapevo, venivo* in speech.
    - *Qualora fosse necessario…* in writing; *Daje!* at the stadium.
    - *Nel mezzo del cammin…*: you can scan it, paraphrase it and quote it.
  examples:
    - { es: "Qualora ce ne fosse bisogno, sarò a disposizione.", en: "Should the need arise, I'll be available." }
    - { es: "Se lo sapevo, non venivo.", en: "If I'd known, I wouldn't have come. (spoken)" }
    - { es: "E quindi uscimmo a riveder le stelle.", en: "And thence we came forth to see again the stars. (Dante)" }
    - { es: "Daje, che pure stavolta ce l'abbiamo fatta!", en: "Come on, we've made it this time too!" }
  pitfalls:
    - "Register mistakes are now more noticeable than grammar mistakes: match form to situation."
    - "Native-like doesn't mean slang-heavy: educated Italians switch registers constantly."
    - "Keep reading: literature, newspapers and dialect songs all feed your Italian."
  related: [g.native-fluency-markers, g.regional-italian-features, g.c1-review]
  drills:
    - { es: "Tutte le strade portano a Roma.", en: "All roads lead to Rome." }
    - { es: "Ci sta, ma secondo me si poteva fare meglio.", en: "Fair enough, but I think it could have been done better." }
    - { es: "Il presente contratto si intende rinnovato salvo disdetta.", en: "This contract is deemed renewed unless cancelled." }
