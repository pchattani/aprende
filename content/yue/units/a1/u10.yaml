  - id: a1.u10.l4
    title: 請問點去？
    teach: [g.asking-directions]
    vocab: [w.zik6-haang4, w.zyun3-zo2, w.zyun3-jau6, w.zyun3, w.jyun5, w.kan5, w.gaai1, w.lou6, w.maa5-lou6, w.gwo3-maa5-lou6, w.dei6-tou4, w.mai4-lou6, w.man6-lou6, w.man6, w.lok6, w.soeng5, w.ceot1-hau2, w.jap6-hau2, w.lou6-hau2, w.gei2-noi6, w.noi6, w.daai6-koi3, w.caa1-m4-do1, w.jat1-zik6, w.zau6-faai3, w.gan1-zyu6, w.jiu3.b, w.ze3-ze3, w.siu2-sam1]
    tip: "Ask 請問…點去呀？ and listen for 直行, 轉左, 轉右, 過馬路. Link the steps with 先, 再 and 然後."
    sentences:
      - { es: "請問港鐵站點去呀？", en: "Excuse me, how do I get to the MTR station?", altEs: ["請問港鐵站點樣去呀？", "唔該，港鐵站點去呀？", "請問地鐵站點去呀？"], grammar: [g.asking-directions], vocab: [w.zaam6], error: { wrong: "請問港鐵站點去嗎？", explain: "點 is already a question word, so don't add 嗎; end with 呀.", grammar: g.question-words } }
      - { es: "直行，第二個路口轉右。", en: "Go straight on, then turn right at the second junction.", altEs: ["一直行，第二個路口轉右。"], grammar: [g.asking-directions], vocab: [w.zik6-haang4, w.lou6-hau2, w.zyun3-jau6], error: { wrong: "直行，二個路口轉右。", explain: "\"The second\" needs 第: 第二個路口.", grammar: g.asking-directions } }
      - { es: "過馬路就係。", en: "Cross the road and you're there.", altEs: ["過咗馬路就係。"], altEn: ["It's just across the road."], grammar: [g.asking-directions], vocab: [w.gwo3-maa5-lou6, w.maa5-lou6] }
      - { es: "喺金鐘轉車，然後喺B出口出。", en: "Change at Admiralty, then take exit B.", altEs: ["喺金鐘轉車，跟住喺B出口出。"], grammar: [g.asking-directions, g.sin-zoi-sequence], vocab: [w.ceot1-hau2] }
      - { es: "遠唔遠呀？", en: "Is it far?", altEs: ["遠唔遠？", "遠唔遠㗎？"], grammar: [g.asking-directions, g.a-not-a-questions], vocab: [w.jyun5], transform: { instruction: "Ask whether it's close instead", answer: "近唔近呀？", alt: ["近唔近？"], en: "Is it close?" } }
      - { es: "唔遠，行五分鐘就到。", en: "Not far, it's a five-minute walk.", altEs: ["唔係好遠，行五分鐘就到。"], grammar: [g.asking-directions], vocab: [w.jyun5] }
      - { es: "我迷路喇，你有冇地圖呀？", en: "I'm lost. Do you have a map?", altEs: ["我迷咗路，你有冇地圖呀？"], grammar: [g.asking-directions, g.jau-have], vocab: [w.mai4-lou6, w.dei6-tou4] }
      - { es: "轉左，再直行。", en: "Turn left, then go straight on.", altEs: ["轉左，然後直行。"], grammar: [g.asking-directions, g.sin-zoi-sequence], vocab: [w.zyun3-zo2], transform: { instruction: "Turn right instead", answer: "轉右，再直行。", alt: ["轉右，然後直行。"], en: "Turn right, then go straight on." } }
      - { es: "一直行，就會見到海洋公園。", jp: "jat1 zik6 haang4 zau6 wui5 gin3 dou2 hoi2 joeng4 gung1 jyun2", en: "Keep going and you'll see Ocean Park.", altEs: ["直行，就會見到海洋公園。"], grammar: [g.asking-directions], vocab: [w.jat1-zik6] }
      - { es: "大概要行十分鐘。", en: "It's about a ten-minute walk.", altEs: ["大概行十分鐘。", "差唔多要行十分鐘。"], grammar: [g.asking-directions], vocab: [w.daai6-koi3, w.jiu3.b] }
      - { es: "由呢度去香港仔要幾耐呀？", en: "How long does it take to get from here to Aberdeen?", altEs: ["由呢度去香港仔要幾耐？", "去香港仔要幾耐呀？"], grammar: [g.asking-directions, g.question-words], vocab: [w.gei2-noi6, w.noi6] }
      - { es: "坐巴士差唔多半個鐘。", en: "About half an hour by bus.", altEs: ["坐巴士大概半個鐘。", "搭巴士差唔多半個鐘。"], grammar: [g.transport-verbs], vocab: [w.caa1-m4-do1] }
      - { es: "我哋就快到喇。", en: "We're almost there.", altEs: ["就快到喇。", "我哋就到喇。"], grammar: [g.asking-directions], vocab: [w.zau6-faai3] }
      - { es: "唔該，借借！", en: "Excuse me, coming through!", altEs: ["借借！", "唔該借借！"], grammar: [g.mgoi-doze], vocab: [w.ze3-ze3] }
      - { es: "過馬路要小心呀！", en: "Be careful when you cross the road!", altEs: ["過馬路小心呀！", "過馬路要小心啲呀！"], grammar: [g.asking-directions], vocab: [w.siu2-sam1, w.gwo3-maa5-lou6] }
      - { es: "唔識路就問人啦，跟住佢行。", en: "If you don't know the way, ask someone and follow them.", altEs: ["唔識路就問人啦。"], grammar: [g.asking-directions], vocab: [w.man6, w.gan1-zyu6, w.lou6] }
    exchanges:
      - q: { es: "請問海洋公園點去呀？", en: "Excuse me, how do I get to Ocean Park?" }
        a: { es: "坐港鐵，喺海洋公園站落車。", en: "Take the MTR and get off at Ocean Park station." }
        alt: ["坐港鐵去。", "喺金鐘轉車。"]
        grammar: [g.asking-directions, g.transport-verbs]
        vocab: [w.man6-lou6]
      - q: { es: "遠唔遠呀？", en: "Is it far?" }
        a: { es: "唔遠，行五分鐘就到。", en: "Not far, five minutes on foot." }
        alt: ["好近咋。", "幾遠，要坐車。"]
        grammar: [g.asking-directions]
        vocab: [w.jyun5, w.kan5]
      - q: { es: "要行幾耐呀？", en: "How long is the walk?" }
        a: { es: "大概十分鐘。", en: "About ten minutes." }
        alt: ["十分鐘。", "差唔多十分鐘。"]
        grammar: [g.asking-directions]
        vocab: [w.gei2-noi6, w.daai6-koi3]
      - q: { es: "洗手間點去呀？", en: "How do I get to the toilet?" }
        a: { es: "直行，轉左就係。", en: "Straight ahead, then left and you're there." }
        alt: ["喺後面。", "喺左邊。"]
        grammar: [g.asking-directions]
        vocab: [w.zik6-haang4, w.zyun3-zo2]
      - q: { es: "你迷路呀？", en: "Are you lost?" }
        a: { es: "係呀，我搵唔到港鐵站。", en: "Yes, I can't find the MTR station." }
        alt: ["係呀。", "唔係，我等朋友。"]
        grammar: [g.asking-directions]
        vocab: [w.mai4-lou6]
    texts:
      - title: "點去我屋企"
        es: ["你喺香港仔巴士站落車。", "直行，第一個路口轉左。", "過馬路，我屋企喺銀行對面。"]
        en: ["Get off at the Aberdeen bus stop.", "Go straight, and turn left at the first junction.", "Cross the road; my flat is opposite the bank."]
        grammar: [g.asking-directions, g.position-words]
        vocab: [w.zik6-haang4, w.zyun3-zo2, w.gwo3-maa5-lou6]
      - title: "Luna 迷路"
        es: ["Luna喺香港仔迷路。", "佢問一個遊客：「請問海邊點去呀？」", "個遊客話：「我都唔知呀！」"]
        en: ["Luna gets lost in Aberdeen.", "She asks a tourist: \"Excuse me, how do I get to the seafront?\"", "The tourist says: \"I don't know either!\""]
        grammar: [g.asking-directions]
        vocab: [w.mai4-lou6, w.man6]
    spicy:
      - { es: "我迷路喇，你帶我去飲杯嘢好唔好？", en: "I'm lost. How about you take me for a drink?", altEs: ["我迷咗路，你帶我去飲杯嘢好唔好？"], grammar: [g.asking-directions, g.a-not-a-questions], vocab: [w.mai4-lou6] }
      - { es: "唔使地圖，跟住你行就得。", en: "I don't need a map; I'll just follow you.", altEs: ["唔使睇地圖，跟住你行就得。"], grammar: [g.asking-directions], vocab: [w.dei6-tou4, w.gan1-zyu6] }
      - { es: "遠唔遠都唔緊要，同你一齊行就得。", en: "Far or not, it doesn't matter, as long as I'm walking with you.", altEs: ["遠唔遠都冇所謂，同你一齊行就得。"], grammar: [g.asking-directions], vocab: [w.jyun5] }
      - { es: "過馬路要小心，行我隔籬啦。", en: "Be careful crossing the road, walk next to me.", altEs: ["過馬路小心，行我隔籬啦。"], grammar: [g.asking-directions, g.position-words], vocab: [w.siu2-sam1] }
      - { es: "你問路呀？我好得閒，我帶你去啦。", en: "Asking for directions? I'm very free, I'll take you there.", altEs: ["你問路？我好得閒，我帶你去啦。"], grammar: [g.asking-directions], vocab: [w.man6-lou6] }
dialogues:
  - id: a1.u10.d1
    title: 海洋公園點去？
    context: In Aberdeen, a tourist asks Mandy the way to Ocean Park.
    lines:
      - { speaker: 遊客, es: "唔好意思，請問海洋公園點去呀？", en: "Excuse me, how do I get to Ocean Park?" }
      - { speaker: Mandy, es: "你坐巴士，或者坐港鐵都得。", en: "You can take a bus or the MTR." }
      - { speaker: 遊客, es: "港鐵站喺邊度呀？", en: "Where's the MTR station?" }
      - { speaker: Mandy, es: "直行，第二個路口轉左，港鐵站喺銀行對面。", en: "Go straight, turn left at the second junction; the station is opposite the bank." }
      - { speaker: 遊客, es: "遠唔遠呀？", en: "Is it far?" }
      - { speaker: Mandy, es: "唔遠，行五分鐘就到。", en: "Not far, five minutes on foot." }
      - { speaker: 遊客, es: "跟住我想坐港鐵返中環，要唔要轉車呀？", en: "Afterwards I want to take the MTR back to Central. Do I have to change?" }
      - { speaker: Mandy, es: "要，喺金鐘轉車。", en: "Yes, change at Admiralty." }
      - { speaker: 遊客, es: "唔該晒！", en: "Thanks so much!" }
      - { speaker: Mandy, es: "唔使唔該。過馬路小心呀！", en: "No problem. Be careful crossing the road!" }
    questions:
      - { q: "遊客想去邊度？", options: ["海洋公園", "赤柱", "山頂"], answer: 0, explain: "He asks 海洋公園點去呀？" }
      - { q: "港鐵站喺邊度？", options: ["銀行隔籬", "銀行對面", "公園入面"], answer: 1, explain: "Mandy says 港鐵站喺銀行對面." }
      - { q: "行去港鐵站要幾耐？", options: ["五分鐘", "十五分鐘", "半個鐘"], answer: 0, explain: "行五分鐘就到: five minutes on foot." }
      - { q: "返中環要喺邊度轉車？", options: ["銅鑼灣", "金鐘", "北角"], answer: 1, explain: "喺金鐘轉車: change at Admiralty." }
