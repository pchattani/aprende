id: r.a2.la-foto-con-la-torre
level: a2
title: La foto con la torre
kind: text
intro: Paolo tells the story of a day trip to Pisa that did not go as planned. Watch how the passato prossimo moves the story forward while the imperfetto sets the scene.
allow: [paolo, valeria, miracoli]
paragraphs:
  - { es: "L'anno scorso, ad aprile, io e la mia ragazza Valeria abbiamo fatto una gita a Pisa. Era una bella giornata di primavera: c'era il sole, faceva caldo e in Piazza dei Miracoli c'erano centinaia di turisti.", en: "Last year, in April, my girlfriend Valeria and I went on a day trip to Pisa. It was a lovely spring day: the sun was shining, it was warm and in Piazza dei Miracoli there were hundreds of tourists." }
  - { es: "Tutti facevano la stessa cosa: stavano in piedi sul prato, con le mani in alto, e facevano finta di tenere la torre. Anche Valeria voleva la foto classica. «Dai, Paolo, è un gioco!» ha detto. Io ho preso il cellulare e lei si è messa in posizione.", en: "Everyone was doing the same thing: they were standing on the lawn with their hands up, pretending to hold up the tower. Valeria wanted the classic photo too. 'Come on, Paolo, it's a game!' she said. I took out my phone and she got into position." }
  - { es: "Mentre cercavo la foto perfetta, un bambino è passato di corsa con un pallone ed è caduto davanti a me. Mi sono girato per aiutarlo, e proprio in quel momento un gabbiano è sceso dal cielo e ha preso il panino dalla mano di Valeria! Lei ha gridato, il bambino ha cominciato a ridere e tutti i turisti si sono girati.", en: "While I was looking for the perfect photo, a little boy ran past with a football and fell over in front of me. I turned round to help him, and just at that moment a seagull swooped down from the sky and took the sandwich out of Valeria's hand! She screamed, the boy started laughing and all the tourists turned round." }
  - { es: "Quando ho guardato il cellulare, ho visto che avevo fatto una foto per sbaglio. Nella foto c'erano la torre, Valeria con la bocca aperta e le braccia in alto... e il gabbiano con il panino. Era una foto bellissima, molto più divertente della foto classica.", en: "When I looked at my phone, I saw that I had taken a photo by mistake. In the photo there were the tower, Valeria with her mouth open and her arms in the air... and the seagull with the sandwich. It was a beautiful photo, much funnier than the classic one." }
  - { es: "Dopo, siamo saliti sulla torre: dall'alto la vista era magnifica, anche se la torre pende davvero e salire fa un effetto strano. Poi abbiamo mangiato in una piccola trattoria, lontano dai gabbiani. Oggi quella foto è sul frigorifero di casa nostra, e ogni volta che la vediamo ridiamo ancora.", en: "Afterwards we climbed the tower: from the top the view was magnificent, even though the tower really does lean and climbing it feels strange. Then we ate in a small trattoria, far from the seagulls. Today that photo is on our fridge at home, and every time we see it we still laugh." }
questions:
  - { q: "Che tempo faceva quel giorno a Pisa?", options: ["Pioveva", "C'era il sole e faceva caldo", "C'era la nebbia"], answer: 1, explain: "«C'era il sole, faceva caldo» – description of the scene in the imperfetto." }
  - { q: "Che cosa facevano tutti i turisti sul prato?", options: ["Mangiavano un panino", "Facevano finta di tenere la torre", "Giocavano a pallone"], answer: 1, explain: "They stood with their hands up, pretending to hold the tower – the classic Pisa photo." }
  - { q: "Perché Paolo si è girato?", options: ["Per aiutare un bambino caduto", "Per guardare la torre", "Per comprare un panino"], answer: 0, explain: "A boy with a football fell in front of him and he turned to help him." }
  - { q: "Che cosa ha fatto il gabbiano?", options: ["Ha preso il cellulare di Paolo", "Ha preso il panino di Valeria", "È entrato nella torre"], answer: 1, explain: "«Un gabbiano è sceso dal cielo e ha preso il panino dalla mano di Valeria!»" }
  - { q: "Dov'è oggi la foto?", options: ["Sul frigorifero", "In un museo di Pisa", "Su un giornale"], answer: 0, explain: "«Oggi quella foto è sul frigorifero di casa nostra.»" }
glossary:
  - { es: facevano finta di, en: they were pretending to }
  - { es: finta, en: (fare finta) pretend }
  - { es: posizione, en: position }
  - { es: di corsa, en: running, in a hurry }
  - { es: gabbiano, en: seagull }
  - { es: gabbiani, en: seagulls }
  - { es: per sbaglio, en: by mistake }
  - { es: magnifica, en: magnificent }
  - { es: fa un effetto strano, en: feels strange }
  - { es: effetto, en: effect }
  - { es: strano, en: strange }
