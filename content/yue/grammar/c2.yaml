# C2 grammar notes (Hong Kong Cantonese). Explanations use light markdown:
# ### headings, bullets, pipe tables, **bold**. Cantonese examples are in
# traditional characters followed by toned Jyutping in brackets.
- id: g.slang-modern
  level: c2
  title: "Hong Kong slang (潮語)"
  summary: "Current slang mixes Cantonese, English and internet culture: 正 'great', 中伏 'got ripped off', 食花生 'watch the drama', hea 'laze about', chur 'overworked'."
  explanation: |
    Slang (潮語, ciu4 jyu5) changes fast, but some terms have lasted for years:
    | Slang | Jyutping | Meaning |
    |---|---|---|
    | 正 | zeng3 | great, awesome |
    | 型 | jing4 | cool, stylish |
    | 中伏 | zung3 fuk6 | fall into a trap; buy something disappointing |
    | 食花生 | sik6 faa1 sang1 | watch a drama unfold as a bystander |
    | 屈機 | wat1 gei1 | overpowered, unfair advantage (from gaming) |
    | 老土 | lou5 tou2 | corny, old-fashioned |
    | 搞笑 | gaau2 siu3 | funny, ridiculous |
    | 打卡 | daa2 kaat1 | take a check-in photo at a hot spot |
    | hea | (English letters) | laze about, do things half-heartedly |
    | chur | (English letters) | high pressure, overworked |

    ### Grammar of slang
    Slang slots into normal Cantonese grammar: 今日好 chur, 我 hea 咗成日, 呢間餐廳中伏.

    ### Register and risk
    Slang marks you as an insider, but misused it sounds try-hard. Avoid it in formal settings, and listen for how it's used before trying it. Some slang is vulgar; learn to recognise it rather than use it.
  examples:
    - { es: "呢間 cafe 啲蛋糕好正！", en: "This café's cakes are amazing!" }
    - { es: "買咗件衫，著一次就爛，真係中伏。", en: "Bought a top and it fell apart after one wear - what a rip-off." }
    - { es: "佢哋喺網上嗌交，我喺度食花生。", en: "They're arguing online and I'm just watching the show." }
    - { es: "今個星期返工好 chur，週末淨係想 hea。", en: "Work's been so intense this week, I just want to laze about at the weekend." }
  pitfalls:
    - "Slang ages quickly; a word that was cool five years ago may now sound 老土."
    - "Don't use slang with elders, in interviews or in writing that matters."
    - "Some slang has vulgar origins; if you're not sure, don't use it."
  related: [g.slang-intensifiers, g.slang-word-formation, g.code-mixing]
  drills:
    - { es: "好正呀！", en: "Awesome!" }
    - { es: "呢個 game 嘅角色好屈機。", en: "That character in the game is totally overpowered." }
    - { es: "我哋去嗰度打卡啦。", en: "Let's go there for a photo." }

- id: g.slang-intensifiers
  level: c2
  title: "Slang intensifiers - 超, 勁, 極, 好鬼, …到爆"
  summary: "Casual speech piles up intensifiers: 超 'super', 勁 'really', 好鬼 'damn', 極 'extremely', adjective + 到爆 / 到癲 'to the max'."
  explanation: |
    | Intensifier | Jyutping | Position | Example |
    |---|---|---|---|
    | 超 | ciu1 | before adj | 超好食 super tasty |
    | 勁 | ging6 | before adj/verb | 勁好玩 so much fun |
    | 好鬼 | hou2 gwai2 | before adj | 好鬼凍 damn cold |
    | 極 | gik6 | before adj (or in 極之) | 極之麻煩 extremely troublesome |
    | 鬼咁 | gwai2 gam3 | before adj | 鬼咁貴 ridiculously expensive |
    | …到爆 | dou3 baau3 | after adj | 正到爆 awesome to the max |
    | …到癲 | dou3 din1 | after adj | 忙到癲 crazy busy |
    | …到飛起 | dou3 fei1 hei2 | after adj | 貴到飛起 sky-high prices |

    ### Stacking
    Speakers often combine them for comedic effect: 超級好鬼正 "ridiculously, insanely good".

    ### Register
    好 and 非常 are neutral; 超 and 勁 are casual; 好鬼 and 鬼咁 are earthy but not rude among friends. All of them are out of place in formal speech.
  examples:
    - { es: "呢度啲夜景超靚。", en: "The night view here is super beautiful." }
    - { es: "今日好鬼熱。", en: "It's damn hot today." }
    - { es: "嗰間舖嘅嘢鬼咁貴。", en: "That shop's stuff is ridiculously expensive." }
    - { es: "我今個月忙到癲。", en: "I've been crazy busy this month." }
  pitfalls:
    - "Don't use 好鬼 or 鬼咁 with people you need to impress; keep them for friends."
    - "…到爆 goes after the adjective; 爆正 is a different (slangier) form."
  related: [g.slang-modern, g.degree-adverbs, g.dou-extent]
  drills:
    - { es: "勁好笑！", en: "So funny!" }
    - { es: "啲樓貴到飛起。", en: "Property prices are sky-high." }
    - { es: "呢首歌正到爆。", en: "This song is awesome." }

- id: g.slang-word-formation
  level: c2
  title: "How slang is made - loans, 族, 友 and letters"
  summary: "New slang is built from English loans with Cantonese grammar (hea 吓), group labels (月光族, 低頭族, 行山友) and letters or numbers in place of syllables."
  explanation: |
    ### English loans, Cantonese grammar
    English words become verbs or adjectives and take Cantonese aspect and degree: hea 咗成日, 好 man (macho), like 咗你張相, 呃 like (aak1 like) "fish for likes".

    ### Group labels
    | Suffix | Example | Jyutping | Meaning |
    |---|---|---|---|
    | 族 | 月光族 | jyut6 gwong1 zuk6 | people who spend their whole salary each month |
    | 族 | 低頭族 | dai1 tau4 zuk6 | people glued to their phones |
    | 友 | 行山友 | haang4 saan1 jau5 | hiking enthusiast |
    | 黨 | 夜貓黨 | je6 maau1 dong2 | night owls |
    | 仔 / 妹 | MK仔 | | Mong Kok-style youth |

    ### Puns and letters
    Letters and numbers stand for syllables or words in texting and slang, and puns on near-homophones create new words. Much of this comes from forums and social media.

    ### Productivity
    Learners can understand new coinages by spotting the pattern: once you know …族, 宅族 or 上班族 make sense immediately.
  examples:
    - { es: "我係月光族，每個月都唔夠錢使。", en: "I spend my whole salary every month, it's never enough." }
    - { es: "港鐵上面個個都係低頭族。", en: "Everyone on the MTR is glued to their phone." }
    - { es: "佢成日喺網上呃 like。", en: "He's always fishing for likes online.", altEn: ["She's always fishing for likes online."] }
    - { es: "我老公係行山友，日日都去郊野公園。", en: "My husband is a hiking fanatic, he's in the country parks every day." }
  pitfalls:
    - "Not every noun takes 族; use established coinages rather than inventing your own in serious contexts."
    - "Letter slang often hides vulgar meanings; check before using an abbreviation you've seen online."
  related: [g.slang-modern, g.code-mixing, g.homophone-puns]
  drills:
    - { es: "我哋都係上班族。", en: "We're all office workers." }
    - { es: "佢 like 咗我張相。", en: "She liked my photo.", altEn: ["He liked my photo."] }
    - { es: "我係夜貓黨，好少早瞓。", en: "I'm a night owl, I rarely go to bed early." }

- id: g.homophone-puns
  level: c2
  title: "Homophone puns (諧音) - lucky foods and unlucky gifts"
  summary: "Cantonese culture is full of sound puns: 髮菜 = 發財, 生菜 = 生財, 魚 = 餘; but 送鐘 = 送終 and 四 = 死 are unlucky."
  explanation: |
    With six tones and many homophones, Cantonese is ideal for **puns (諧音)**, used in festivals, advertising and gifts.

    ### Lucky foods (New Year)
    | Food | Jyutping | Sounds like | Meaning |
    |---|---|---|---|
    | 髮菜 | faat3 coi3 | 發財 faat3 coi4 | get rich |
    | 生菜 | saang1 coi3 | 生財 sang1 coi4 | make money |
    | 蠔豉 | hou4 si2 | 好市 hou2 si5 | good business |
    | 魚 | jyu4 | 餘 jyu4 | surplus: 年年有餘 |

    ### Unlucky gifts
    - 送鐘 (sung3 zung1) "give a clock" sounds like 送終 (sung3 zung1) "attend a deathbed".
    - 分梨 "share a pear" sounds like 分離 (fan1 lei4) "separation".
    - 四 (sei3) is close to 死 (sei2) "die"; 八 (baat3) rhymes with 發 (faat3) "prosper", so 8 is lucky.

    ### In advertising
    Ads and shop names twist idioms with near-homophones; to get the joke, read the slogan aloud.
  examples:
    - { es: "過年食髮菜，祝你發財！", en: "Eat 'hair moss' at New Year - may you get rich!" }
    - { es: "年年有餘，所以年夜飯一定有魚。", en: "'Surplus every year' - so there's always fish at the New Year's Eve dinner." }
    - { es: "千祈唔好送鐘畀長輩。", en: "Never give a clock to an older relative." }
    - { es: "好多大廈冇四樓。", en: "Many buildings have no fourth floor." }
  pitfalls:
    - "Don't give clocks, pears to share, or sets of four as gifts in a traditional setting."
    - "Puns depend on exact Cantonese sounds; many don't work in Mandarin, and vice versa."
  related: [g.taboo-euphemisms, g.xiehouyu-puns, g.tone-melody]
  drills:
    - { es: "恭喜發財！", en: "Happy New Year! (Wishing you prosperity!)" }
    - { es: "生菜即係生財。", en: "Lettuce means making money." }
    - { es: "八字好意頭。", en: "Eight is a lucky number." }

- id: g.taboo-euphemisms
  level: c2
  title: "Taboo euphemisms (避諱) - 豬脷, 豬膶, 通勝, 吉屋"
  summary: "Words that sound like loss, dryness or death are replaced: 舌 → 脷, 肝 → 膶, 通書 → 通勝, 空屋 → 吉屋, 絲瓜 → 勝瓜."
  explanation: |
    Cantonese replaces everyday words whose sound is unlucky with a word of **opposite** meaning:
    | Avoided | Why | Replacement | Jyutping |
    |---|---|---|---|
    | 豬舌 (tongue) | 舌 sit6 sounds like 蝕 sit6 "lose money" | 豬脷 | zyu1 lei6 (脷 from 利 "profit") |
    | 豬肝 (liver) | 肝 gon1 sounds like 乾 "dry" (no money) | 豬膶 | zyu1 jeon2 (膶 from 潤 "moist") |
    | 通書 (almanac) | 書 syu1 sounds like 輸 "lose" | 通勝 | tung1 sing3 (勝 "win") |
    | 空屋 (empty flat) | 空 hung1 sounds like 凶 "ominous" | 吉屋 | gat1 uk1 (吉 "lucky") |
    | 絲瓜 (loofah) | 絲 si1 is close to 輸 | 勝瓜 | sing3 gwaa1 |

    ### Characters made for the purpose
    脷 and 膶 are characters created for Cantonese: they keep the 月 (flesh) radical and borrow the sound of the lucky word.

    ### Still alive
    These words are fully standard in Hong Kong: menus say 豬膶, estate agents advertise 吉屋出租 "vacant flat to let". Gamblers and business people are especially careful; avoid 書 around mahjong players at New Year.
  examples:
    - { es: "我要一碗豬膶粥。", en: "I'd like a bowl of pork liver congee." }
    - { es: "吉屋出租，即時入伙。", en: "Vacant flat to let, immediate occupancy." }
    - { es: "阿婆睇通勝揀日子。", en: "Grandma consults the almanac to pick a date." }
    - { es: "今晚有勝瓜炒蛋。", en: "There's stir-fried loofah with egg tonight." }
  pitfalls:
    - "吉屋 is not a lucky house; it's an empty one available to rent or buy."
    - "Don't 'correct' 豬脷 to 豬舌 in Hong Kong; 脷 is the normal word."
  related: [g.homophone-puns, g.writing-cantonese, g.address-terms]
  drills:
    - { es: "滷水豬脷好好食。", en: "Braised pork tongue is delicious." }
    - { es: "呢度有冇吉屋呀？", en: "Are there any vacant flats here?" }
    - { es: "唔該，一碟勝瓜。", en: "A plate of loofah, please." }

- id: g.lazy-sounds
  level: c2
  title: "Lazy sounds (懶音) - n/l, dropped ng, gw → g"
  summary: "Casual Hong Kong speech merges sounds: n → l (你 lei5), dropped ng- (我 o5), gw → g (廣 gong2), -ng → -n, -k → -t; recognise them, but learn the standard forms."
  explanation: |
    懶音 (laan5 jam1) "lazy sounds" are widespread sound mergers, especially among younger speakers:
    | Change | Standard | Casual | Word |
    |---|---|---|---|
    | n- → l- | nei5 | lei5 | 你 |
    | ng- dropped | ngo5 | o5 | 我 |
    | gw- → g- (before o) | gwong2 | gong2 | 廣 |
    | -ng → -n | hoeng1 gong2 | hoeng1 gon2 | 香港 |
    | -k → -t | hok6 | hot6 | 學 |
    | ng (syllable) → m | ng5 | m5 | 五 |

    ### Consequences
    Mergers create new homophones: with n → l, 男 (naam4, male) and 藍 (laam4, blue) sound the same; with gw → g, 國 (gwok3) and 角 (gok3) merge.

    ### Attitudes
    Teachers and broadcasters correct 懶音, and there were school campaigns against them; but they are normal in everyday speech. Learners should **produce the standard** and **recognise the casual** forms.

    ### Wordplay
    Comedians and advertisers exploit 懶音 for puns, which is why they matter at C2.
  examples:
    - { es: "你係唔係香港人呀？", en: "Are you from Hong Kong? (often heard as lei5 hai6 m4 hai6 …)" }
    - { es: "我哋學廣東話。", en: "We study Cantonese. (casual: o5 dei6 hot6 gong2 dung1 waa2)" }
    - { es: "男人同藍色喺懶音入面同音。", en: "With lazy sounds, 'man' and 'blue' sound the same." }
    - { es: "主持人講嘢冇懶音。", en: "The presenter speaks without lazy sounds." }
  pitfalls:
    - "Don't copy 懶音 in your own speech as a learner; it can make you harder to understand."
    - "Jyutping and dictionaries show the standard forms; casual pronunciations are not spelling errors in the dictionary."
  related: [g.homophone-puns, g.guangzhou-vs-hk, g.entering-tones]
  drills:
    - { es: "我好鍾意講廣東話。", en: "I really like speaking Cantonese." }
    - { es: "你今日去唔去學校？", en: "Are you going to school today?" }
    - { es: "請讀清楚啲。", en: "Please pronounce it more clearly." }

- id: g.xiehouyu
  level: c2
  title: "歇後語 - two-part allegorical sayings"
  summary: "A 歇後語 is a riddle-like saying: you say the first part (an image) and the listener supplies the second (the meaning): 牛皮燈籠——點極唔明."
  explanation: |
    A 歇後語 (hit3 hau6 jyu5) has two parts:
    1. **The image** (引子): a funny or vivid scene.
    2. **The punchline** (後襯): what it means, often unspoken because everyone knows it.

    | Image | Punchline | Meaning |
    |---|---|---|
    | 牛皮燈籠 (ngau4 pei4 dang1 lung4) | 點極唔明 | an ox-hide lantern won't let light through however you light it: someone who never understands however you explain |
    | 床下底破柴 | 撞板 (zong6 baan2) | chopping wood under the bed hits the boards: run into trouble, get rebuffed |
    | 隔夜油炸鬼 (gaak3 je6 jau4 zaa3 gwai2) | 冇火氣 (mou5 fo2 hei3) | day-old fried dough has lost its heat: a mild-tempered person |
    | 阿茂整餅 (aa3 mau6 zing2 beng2) | 冇嗰樣整嗰樣 | Ah Mau bakes cakes nobody asked for: doing pointless things |
    | 年三十晚謝灶 | 好做唔做 | doing the Kitchen God offering on New Year's Eve: choosing the worst time |
    | 黃大仙 | 有求必應 (jau5 kau4 bit1 jing3) | Wong Tai Sin: always grants requests (a too-obliging person) |

    ### Usage
    Often only the first part is said, with a knowing look: 佢真係牛皮燈籠 "He's a real ox-hide lantern."
  examples:
    - { es: "我同佢解釋咗十次，佢都係牛皮燈籠，點極唔明。", en: "I explained ten times, but he's an ox-hide lantern - no light gets through.", altEn: ["I explained ten times, but she's an ox-hide lantern - no light gets through."] }
    - { es: "今次真係床下底破柴，撞晒板。", en: "This time I really ran straight into a wall." }
    - { es: "佢好少發脾氣，隔夜油炸鬼嚟㗎。", en: "He rarely loses his temper - he's day-old fried dough.", altEn: ["She rarely loses her temper - she's day-old fried dough."] }
    - { es: "你係咪阿茂整餅呀？冇人叫你做。", en: "Are you Ah Mau baking cakes? Nobody asked you to." }
  pitfalls:
    - "Don't explain a 歇後語 to a native speaker after saying it; leaving the punchline unsaid is the point."
    - "Many 歇後語 are regional; Mandarin ones often don't work in Cantonese."
  related: [g.xiehouyu-puns, g.cantonese-proverbs, g.colloquial-idioms]
  drills:
    - { es: "佢牛皮燈籠嚟㗎。", en: "He just doesn't get it.", altEn: ["She just doesn't get it."] }
    - { es: "我又撞板喇。", en: "I've hit a wall again." }
    - { es: "唔好學阿茂整餅。", en: "Don't go making cakes nobody ordered." }

- id: g.xiehouyu-puns
  level: c2
  title: "Punning 歇後語 - 外甥打燈籠, 和尚擔遮"
  summary: "Many 歇後語 hinge on a homophone in the punchline: 外甥打燈籠——照舊 (照舅), 和尚擔遮——無法無天 (無髮無天), 老公撥扇——淒涼 (妻涼)."
  explanation: |
    In punning 歇後語 the punchline has a **literal** reading that fits the image and a **homophone** that gives the real meaning:
    | Image | Literal punchline | Homophone meaning |
    |---|---|---|
    | 外甥打燈籠 (a nephew carries a lantern) | 照舅 (light the way for his uncle) | 照舊 (ziu3 gau6) "as before, same as usual" |
    | 和尚擔遮 (a monk holds an umbrella) | 無髮無天 (no hair, no sky) | 無法無天 (mou4 faat3 mou4 tin1) "lawless" |
    | 老公撥扇 (a husband fans someone) | 妻涼 (the wife is cool) | 淒涼 (cai1 loeng4) "miserable" |

    ### Sound matching
    - 髮 and 法 are both faat3.
    - 妻 and 淒 are both cai1.
    - 舅 (kau5) and 舊 (gau6) are close but not identical: puns tolerate near-homophones.

    ### Reading them
    Say the punchline aloud and look for a second meaning. These puns rarely survive translation into Mandarin pronunciation, which makes them a hallmark of Cantonese wit.
  examples:
    - { es: "今年加唔加人工？外甥打燈籠，照舊。", en: "Any pay rise this year? Same as ever (no change)." }
    - { es: "啲細路冇人管，和尚擔遮，無法無天。", en: "With nobody watching them, the kids are completely out of control." }
    - { es: "一個人過節，真係老公撥扇，淒涼。", en: "Spending the festival alone - truly miserable." }
  pitfalls:
    - "The written punchline in a book may show either the homophone or the literal word; read it aloud to catch the pun."
    - "Don't use 無法無天 to describe your boss; it means 'lawless, out of control'."
  related: [g.xiehouyu, g.homophone-puns]
  drills:
    - { es: "外甥打燈籠，照舊。", en: "Same as usual." }
    - { es: "佢哋真係無法無天。", en: "They're completely out of control." }
    - { es: "好淒涼呀。", en: "How miserable." }

- id: g.cantonese-proverbs
  level: c2
  title: "Cantonese proverbs (俗語)"
  summary: "Colloquial proverbs pack everyday wisdom: 食得鹹魚抵得渴 'accept the consequences', 三歲定八十 'the child is father to the man', 心急食唔到熱豆腐 'haste makes waste'."
  explanation: |
    | Proverb | Jyutping (key part) | Meaning |
    |---|---|---|
    | 食得鹹魚抵得渴 | sik6 dak1 haam4 jyu4 dai2 dak1 hot3 | if you eat salted fish, put up with the thirst: accept the consequences |
    | 三歲定八十 | saam1 seoi3 ding6 baat3 sap6 | character at three decides you at eighty |
    | 一樣米養百樣人 | jat1 joeng6 mai5 joeng5 baak3 joeng6 jan4 | it takes all sorts |
    | 有麝自然香 | jau5 se6 zi6 jin4 hoeng1 | real quality speaks for itself |
    | 心急食唔到熱豆腐 | | haste makes waste |
    | 好心著雷劈 | | no good deed goes unpunished |
    | 冇咁大個頭，就唔好戴咁大頂帽 | | don't take on more than you can handle |
    | 人比人，比死人 | | comparing yourself with others will drive you mad |

    ### Using them
    Proverbs are quoted whole, often to close an argument: 你自己揀㗎嘛，食得鹹魚抵得渴. They're common in TV dramas and among older speakers.

    ### Grammar note
    Many keep older grammar: 抵得 "able to endure", 有麝 "if there is musk".
  examples:
    - { es: "你揀咗呢份工，食得鹹魚就要抵得渴。", en: "You chose this job, so you have to accept what comes with it." }
    - { es: "一樣米養百樣人，唔使嬲。", en: "It takes all sorts, no need to get angry." }
    - { es: "慢慢嚟，心急食唔到熱豆腐。", en: "Take it slowly - haste makes waste." }
    - { es: "我幫佢反而畀佢鬧，真係好心著雷劈。", en: "I helped him and got told off for it - no good deed goes unpunished." }
  pitfalls:
    - "Quote proverbs exactly; changing words breaks the effect."
    - "Some proverbs can sound preachy (講耶穌); use them sparingly with peers."
  related: [g.xiehouyu, g.colloquial-idioms, g.chengyu-structure]
  drills:
    - { es: "有麝自然香。", en: "Quality speaks for itself." }
    - { es: "三歲定八十。", en: "The child is father to the man." }
    - { es: "人比人，比死人。", en: "Comparing yourself to others will only make you miserable." }

- id: g.opera-language
  level: c2
  title: "The language of Cantonese opera (粵劇)"
  summary: "Cantonese opera mixes classical Chinese verse, formal spoken passages and colloquial Cantonese, sung with stylised voices (平喉, 子喉) and built on four skills: 唱做唸打."
  explanation: |
    粵劇 (jyut6 kek6), inscribed on UNESCO's intangible heritage list in 2009, grew up in the Pearl River Delta; Foshan (佛山, fat6 saan1) is traditionally regarded as one of its cradles, and its Ancestral Temple still has a historic opera stage.

    ### Language layers
    | Layer | Use |
    |---|---|
    | classical verse (曲詞) | sung arias, full of 成語 and classical pronouns |
    | 戲棚官話 (hei3 paang4 gun1 waa2) | "stage Mandarin", used in older traditional plays |
    | formal Cantonese speech | spoken dialogue (白) |
    | colloquial Cantonese | comic roles and asides |

    Early troupes performed largely in stage Mandarin; from the early 20th century Cantonese increasingly replaced it.

    ### Voices and skills
    - 平喉 (ping4 hau4): natural voice, typically for male roles.
    - 子喉 (zi2 hau4): high falsetto, for female roles.
    - 唱做唸打: singing, acting, recitation, martial arts.

    ### Roles
    生 (male lead), 旦 (female lead, 花旦 faa1 daan2), 淨 (painted face), 丑 (clown).
  examples:
    - { es: "佛山祖廟嘅萬福台係一個古老嘅戲台。", en: "The Wanfu Stage in Foshan's Ancestral Temple is an old opera stage." }
    - { es: "粵劇喺二零零九年列入人類非物質文化遺產。", en: "Cantonese opera was inscribed as Intangible Cultural Heritage of Humanity in 2009." }
    - { es: "佢唱平喉，聲線好雄厚。", en: "She sings in the natural (male-role) voice, and it's very rich." }
    - { es: "做大戲要識唱做唸打。", en: "To perform opera you need to master singing, acting, recitation and fighting." }
  pitfalls:
    - "Don't expect opera lyrics to be colloquial Cantonese; most sung text is classical in style."
    - "平喉 is about voice type, not the performer's gender; women often sing 平喉 male roles."
  related: [g.classical-pronouns, g.opera-idioms, g.tone-melody]
  drills:
    - { es: "我第一次睇粵劇。", en: "It's my first time watching Cantonese opera." }
    - { es: "嗰個花旦唱得好好。", en: "That leading lady sings beautifully." }
    - { es: "老一輩叫粵劇做大戲。", en: "Older people call Cantonese opera 'the big show'." }

- id: g.classical-pronouns
  level: c2
  title: "Classical pronouns and forms of address - 吾, 汝, 君, 妾, 朕"
  summary: "Opera libretti and classical texts use old pronouns: 吾 / 余 'I', 汝 / 爾 'you', 君 'you (respectful)', 妾 'I (a woman, humble)', 朕 'I (emperor)', 小生 'I (young scholar)'."
  explanation: |
    | Form | Jyutping | Meaning | Used by |
    |---|---|---|---|
    | 吾 | ng4 | I | general classical |
    | 余 / 予 | jyu4 | I | classical prose |
    | 汝 | jyu5 | you | to equals or inferiors |
    | 爾 | ji5 | you | classical |
    | 君 | gwan1 | you (respectful) / sir | between lovers, friends |
    | 卿 | hing1 | you (to a minister, wife) | emperor, husband |
    | 妾 | cip3 | I (humble woman) | female roles |
    | 朕 | zam6 | I (the emperor) | emperor only |
    | 小生 | siu2 sang1 | I (young scholar) | male scholar roles |
    | 老夫 | lou5 fu1 | I (old man) | elderly roles |

    ### Why so many?
    Classical Chinese marks social relations in pronouns. Choosing 妾 or 朕 instantly tells the audience who is speaking.

    ### Today
    Some survive in fixed expressions (吾愛 "my love" in lyrics, 君 in song titles) and in humorous speech: 朕今日好攰 "We are most tired today" (mock-imperial).
  examples:
    - { es: "妾身願隨君去。", en: "I would gladly go with you, my lord. (opera)" }
    - { es: "汝何故來此？", en: "Why have you come here? (classical)" }
    - { es: "小生姓梁。", en: "This humble scholar's surname is Leung. (opera)" }
    - { es: "朕今日唔想返工。", en: "We do not wish to go to work today. (joking)" }
  pitfalls:
    - "Don't use classical pronouns in normal conversation except as a joke."
    - "君 in lyrics usually means 'you, my love', not 'king'."
  related: [g.opera-language, g.classical-grammar, g.lyrics-register]
  drills:
    - { es: "吾愛", en: "my love (literary)" }
    - { es: "君知否？", en: "Do you know, my dear? (literary)" }
    - { es: "老夫今年七十。", en: "This old man is seventy this year. (opera)" }

- id: g.opera-idioms
  level: c2
  title: "Everyday expressions from the opera stage"
  summary: "Several common Cantonese expressions come from opera: 做大龍鳳 'put on a show', 爆肚 'ad-lib', 跑龍套 'play a bit part', 收科 'wrap things up', 好戲在後頭 'the best is yet to come'."
  explanation: |
    | Expression | Jyutping | Stage origin | Everyday meaning |
    |---|---|---|---|
    | 做大龍鳳 | zou6 daai6 lung4 fung6 | named after a famous opera troupe | stage a big act, make a fuss for show |
    | 爆肚 | baau3 tou5 | actors improvising lines | ad-lib, make it up on the spot |
    | 跑龍套 | paau2 lung4 tou3 | extras running across the stage | play a minor role, be a bit player |
    | 收科 | sau1 fo1 | ending a scene's stage business | wrap up, find a way out of a situation |
    | 好戲在後頭 | hou2 hei3 zoi6 hau6 tau4 | the best scenes come last | the best (or worst) is yet to come |
    | 做大戲 | zou6 daai6 hei3 | perform opera | put on a dramatic act |

    ### Grammar
    They act as ordinary verbs and phrases: 佢又喺度做大龍鳳 "He's making a big show of it again", 我冇準備，唯有爆肚 "I hadn't prepared, so I had to wing it", 呢件事點收科？ "How do we get out of this?"

    These expressions are a reminder of how central opera was to everyday entertainment in Hong Kong and Guangdong for most of the 20th century.
  examples:
    - { es: "佢哋兩個喺度做大龍鳳，其實早就和好咗。", en: "Those two are just putting on a show; they made up long ago." }
    - { es: "我唔記得講稿，唯有爆肚。", en: "I forgot my script, so I had to ad-lib." }
    - { es: "我喺公司只係跑龍套。", en: "I'm just a bit player at the company." }
    - { es: "搞成咁，睇你點收科。", en: "Look at the mess - let's see how you get out of this." }
  pitfalls:
    - "做大龍鳳 implies insincerity; don't use it for a genuine celebration."
    - "爆肚 is about speaking without a script; it has nothing to do with stomachs in this sense."
  related: [g.opera-language, g.colloquial-idioms]
  drills:
    - { es: "佢最叻爆肚。", en: "He's brilliant at ad-libbing.", altEn: ["She's brilliant at ad-libbing."] }
    - { es: "好戲在後頭。", en: "The best is yet to come." }
    - { es: "唔好再做大龍鳳喇。", en: "Stop putting on a show." }

- id: g.tone-melody
  level: c2
  title: "Tones and melody - why Cantopop lyrics are hard to write"
  summary: "Sung Cantonese must follow the melody's contour so words stay intelligible; lyricists map the six tones onto melodic levels (often called the 0243 system: 零 ling4, 二 ji6, 四 sei3, 三 saam1)."
  explanation: |
    In Cantonese, pitch distinguishes words. If a melody rises where the syllable's tone falls, listeners hear a different word. So Cantopop lyricists usually **write words to an existing melody** (先曲後詞) and choose each syllable to fit the notes.

    ### The 0243 system
    Lyricists group tones into relative melodic levels, named after the four numbers whose own tones exemplify them:
    | Level | Example word | Tones |
    |---|---|---|
    | 0 (lowest) | 零 (ling4) | tone 4 |
    | 2 | 二 (ji6) | tone 6 |
    | 4 | 四 (sei3) | tone 3 |
    | 3 (highest) | 三 (saam1) | tone 1 |

    The digits are only names: from low to high the levels run 0, 2, 4, 3. The rising tones 2 and 5 are treated flexibly, fitting different levels depending on the melody.

    ### Consequence
    The same melody can't take any lyric: replacing 我愛你 with a near-synonym may make it unsingable. Cover versions of Mandarin songs need entirely new Cantonese lyrics, not a translation.

    ### For learners
    Singing along to Cantopop is excellent tone practice because the melody shows each tone's height.
  examples:
    - { es: "填詞要跟住旋律揀字。", en: "When writing lyrics, you must choose words to fit the melody." }
    - { es: "廣東歌通常係先曲後詞。", en: "Cantopop is usually written melody first, lyrics second." }
    - { es: "如果聲調唔啱，聽眾會聽錯字。", en: "If the tones don't fit, listeners will hear the wrong words." }
  pitfalls:
    - "Don't sing Cantonese words to a melody that contradicts their tones; it changes the meaning."
    - "The 0243 levels are relative pitches within a phrase, not fixed notes."
  related: [g.lyrics-register, g.cantonese-rhyme, g.ping-zak]
  drills:
    - { es: "零二四三", en: "zero, two, four, three (the four melodic levels)" }
    - { es: "我鍾意唱廣東歌練聲調。", en: "I like singing Cantopop to practise my tones." }
    - { es: "呢首歌嘅詞填得好好。", en: "The lyrics of this song are beautifully written." }

- id: g.lyrics-register
  level: c2
  title: "The register of Cantopop lyrics"
  summary: "Most Cantopop lyrics are written in a literary style (我們, 的, 你的) sung with Cantonese sounds; colloquial lyrics (嘅, 咗, 佢) are a deliberate choice, made famous by Sam Hui in the 1970s."
  explanation: |
    ### Literary lyrics (the norm)
    The majority of Cantopop uses **書面語** vocabulary sung in Cantonese pronunciation: 我們 (ngo5 mun4), 的 (dik1), 不 (bat1), 沒有 (mut6 jau5). This sounds poetic and serious.

    ### Colloquial lyrics (口語歌詞)
    Songs that use spoken Cantonese - 嘅, 咗, 佢, 冇 - sound down-to-earth, humorous or socially critical. Sam Hui (許冠傑) popularised this style in the 1970s with songs about working-class life such as 《半斤八兩》 (1976, bun3 gan1 baat3 loeng2, "six of one, half a dozen of the other").

    ### Mixed style
    Many modern songs mix: literary verses with a colloquial hook, or English phrases in the chorus.

    | Line style | Example |
    |---|---|
    | literary | 我們的愛沒有終點 |
    | colloquial | 我哋嘅愛冇終點 |

    ### Reading lyrics aloud
    Read literary lyrics with literary readings (C1): 生命 sang1 ming6, not saang1 meng6.
  examples:
    - { es: "呢首歌嘅歌詞用書面語寫。", en: "This song's lyrics are written in literary Chinese." }
    - { es: "許冠傑嘅歌好多都用口語。", en: "Many of Sam Hui's songs use colloquial Cantonese." }
    - { es: "我們的愛沒有終點。", en: "Our love has no end. (literary lyric)" }
    - { es: "用口語寫歌詞，聽落好親切。", en: "Lyrics in colloquial Cantonese sound warm and familiar." }
  pitfalls:
    - "Don't assume a song's lyrics show how people talk; most are literary."
    - "When singing literary lyrics, use Cantonese readings (的 = dik1), not Mandarin."
  related: [g.tone-melody, g.spoken-vs-written, g.cantonese-rhyme]
  drills:
    - { es: "你最鍾意邊首廣東歌？", en: "What's your favourite Cantopop song?" }
    - { es: "呢句歌詞好有詩意。", en: "This lyric is very poetic." }
    - { es: "我跟住歌詞唱。", en: "I sing along with the lyrics." }

- id: g.cantonese-rhyme
  level: c2
  title: "Rhyme in Cantonese (押韻)"
  summary: "Cantonese rhymes on the syllable final (韻母), including -p, -t, -k endings; lyrics and verse usually rhyme at line ends, and rhymes that work in Cantonese often fail in Mandarin."
  explanation: |
    押韻 (aap3 wan5) means ending lines with syllables that share the same **final** (韻母):
    | Rhyme group | Examples | Jyutping |
    |---|---|---|
    | -ong | 光, 方, 忘 | gwong1, fong1, mong4 |
    | -oeng | 香, 鄉, 想 | hoeng1, hoeng1, soeng2 |
    | -ai | 西, 低, 迷 | sai1, dai1, mai4 |
    | -it (entering) | 熱, 結, 別 | jit6, git3, bit6 |
    | -ik (entering) | 力, 色, 識 | lik6, sik1, sik1 |

    ### Tone doesn't matter for rhyme
    Rhyme ignores tone: 光 (gwong1) rhymes with 忘 (mong4).

    ### Entering finals
    Syllables ending in -p, -t, -k only rhyme with each other: 熱 (jit6) rhymes with 結 (git3), not with 天 (tin1).

    ### Rap and wordplay
    Cantonese hip-hop and advertising slogans use internal rhymes and puns; spotting rhymes is part of understanding the joke.
  examples:
    - { es: "呢兩句歌詞押韻：月光、故鄉。", en: "These two lines rhyme: 'moonlight', 'hometown'." }
    - { es: "熱同別押韻，都係入聲。", en: "'Hot' and 'farewell' rhyme; both are entering tones." }
    - { es: "填詞人好重視押韻。", en: "Lyricists care a lot about rhyme." }
  pitfalls:
    - "Don't rhyme an entering-tone syllable with an open one: 雪 (syut3) doesn't rhyme with 書 (syu1)."
    - "A rhyme in Mandarin may not rhyme in Cantonese, and vice versa; check the Jyutping finals."
  related: [g.tone-melody, g.entering-tones, g.folk-rhymes]
  drills:
    - { es: "邊兩個字押韻？", en: "Which two characters rhyme?" }
    - { es: "香同鄉押韻。", en: "'Fragrant' and 'hometown' rhyme." }
    - { es: "試吓用廣東話寫兩句押韻嘅句子。", en: "Try writing two rhyming lines in Cantonese." }

- id: g.entering-tones
  level: c2
  title: "Entering tones (入聲) - why Tang poems rhyme better in Cantonese"
  summary: "Cantonese keeps the -p, -t, -k endings of Middle Chinese, lost in Mandarin; poems that rhyme on entering tones, like 柳宗元's 〈江雪〉, still rhyme in Cantonese."
  explanation: |
    入聲 (jap6 sing1) "entering tones" are syllables ending in **-p, -t, -k**. Middle Chinese had them; Mandarin lost them, but Cantonese kept them all.

    ### 〈江雪〉 by Liu Zongyuan (柳宗元)
    | Line | Jyutping |
    |---|---|
    | 千山鳥飛絕， | cin1 saan1 niu5 fei1 zyut6 |
    | 萬徑人蹤滅。 | maan6 ging3 jan4 zung1 mit6 |
    | 孤舟蓑笠翁， | gu1 zau1 so1 lap1 jung1 |
    | 獨釣寒江雪。 | duk6 diu3 hon4 gong1 syut3 |

    The rhymes 絕 (zyut6), 滅 (mit6), 雪 (syut3) all end in **-t**. In Mandarin (jué, miè, xuě) the shared ending has disappeared, and the poem's sharp, clipped sound is lost.

    ### Tone counting
    Jyutping writes entering tones with tones 1, 3 and 6 (e.g. 一 jat1, 八 baat3, 六 luk6). Traditional analysis counts them separately, giving Cantonese "nine tones" (九聲).

    ### Reading poetry aloud
    Use literary readings and keep the final stops short and unreleased.
  examples:
    - { es: "千山鳥飛絕，萬徑人蹤滅。", en: "A thousand hills, no birds in flight; ten thousand paths, no human trace." }
    - { es: "孤舟蓑笠翁，獨釣寒江雪。", en: "In a lone boat, an old man in a straw cape fishes alone in the cold river snow." }
    - { es: "廣東話保留咗入聲。", en: "Cantonese has kept the entering tones." }
    - { es: "用廣東話讀唐詩，押韻押得好好。", en: "Read in Cantonese, Tang poems rhyme beautifully." }
  pitfalls:
    - "Don't release the final -p, -t, -k like English; they are stopped silently."
    - "'Nine tones' counts entering tones separately; Jyutping writes them with the six tone numbers."
  related: [g.ping-zak, g.cantonese-rhyme, g.literary-colloquial-readings]
  drills:
    - { es: "獨釣寒江雪。", en: "Fishing alone in the cold river snow." }
    - { es: "一、六、八都係入聲字。", en: "One, six and eight are all entering-tone characters." }
    - { es: "我想用廣東話背唐詩。", en: "I'd like to learn Tang poems by heart in Cantonese." }

- id: g.ping-zak
  level: c2
  title: "Level and oblique tones (平仄)"
  summary: "Classical verse alternates 平 (level: Cantonese tones 1 and 4) and 仄 (oblique: tones 2, 3, 5, 6 and all entering tones); Cantonese makes the pattern audible."
  explanation: |
    Tang regulated verse arranges syllables by **平仄** (ping4 zak1):
    | Category | Cantonese tones | Examples |
    |---|---|---|
    | 平 (level) | 1, 4 (non-entering) | 光 gwong1, 明 ming4 |
    | 仄 (oblique) | 2, 3, 5, 6 and all entering tones | 舉 geoi2, 故 gu3, 上 soeng6, 月 jyut6 |

    ### 〈靜夜思〉 by Li Bai (李白)
    床前明月光 (cong4 cin4 ming4 jyut6 gwong1): 平平平仄平
    疑是地上霜 (ji4 si6 dei6 soeng6 soeng1): 平仄仄仄平
    舉頭望明月 (geoi2 tau4 mong6 ming4 jyut6): 仄平仄平仄
    低頭思故鄉 (dai1 tau4 si1 gu3 hoeng1): 平平平仄平

    The rhyming syllables 光, 霜, 鄉 are all level tones in the same rhyme group.

    ### Why Cantonese helps
    Because Cantonese preserves entering tones (月 jyut6 is clearly short and oblique), the 平仄 pattern is easy to hear; in Mandarin, 月 (yuè) and some entering syllables have moved into level tones.

    ### Couplets
    Spring couplets and 對聯 follow 平仄 too: the first line usually ends oblique, the second level.
  examples:
    - { es: "床前明月光，疑是地上霜。", en: "Before my bed, the bright moonlight - I took it for frost on the ground." }
    - { es: "舉頭望明月，低頭思故鄉。", en: "I raise my head to gaze at the bright moon, lower it and think of home." }
    - { es: "第一聲同第四聲屬於平聲。", en: "Tones 1 and 4 belong to the level tones." }
    - { es: "入聲字一定係仄聲。", en: "Entering-tone characters are always oblique." }
  pitfalls:
    - "Tone 1 entering syllables (like 一 jat1) are oblique, not level: entering beats tone height."
    - "平仄 is about tone categories, not about rhyme; a line can follow the pattern and still need a rhyme at the end."
  related: [g.entering-tones, g.parallelism, g.tone-melody]
  drills:
    - { es: "低頭思故鄉。", en: "I lower my head and think of home." }
    - { es: "呢句係咩平仄？", en: "What's the tone pattern of this line?" }
    - { es: "我識用廣東話讀〈靜夜思〉。", en: "I can read 'Quiet Night Thoughts' in Cantonese." }

- id: g.classical-grammar
  level: c2
  title: "Classical Chinese grammar in poems"
  summary: "Classical verse is terse: mostly one-syllable words, frequent subject omission, flexible word classes, and particles like 之, 乎, 者, 也, 而, 於 that have no colloquial equivalent."
  explanation: |
    ### One word, one syllable
    Classical texts use single-character words where Cantonese uses two: 思 = 諗起 "think of", 望 = 望住 "gaze at", 故鄉 = 屋企嗰度 "home".

    ### Omitted subjects
    In 〈靜夜思〉 the "I" is never stated: 舉頭望明月 "(I) raise (my) head and gaze at the bright moon".

    ### Word-class flexibility
    A noun can act as a verb: 春風又綠江南岸 "the spring wind again greens the south bank" (綠 green → to make green).

    ### Function words
    | Particle | Jyutping | Function | Colloquial |
    |---|---|---|---|
    | 之 | zi1 | of; it | 嘅; 佢 |
    | 乎 | fu4 | question | 呀？ / 嗎？ |
    | 者 | ze2 | one who | …嘅人 |
    | 也 | jaa5 | assertion | 嘅 / 係 |
    | 而 | ji4 | and, but | 而且 / 但係 |
    | 於 | jyu1 | at, than | 喺 / 過 |

    ### Paraphrasing into Cantonese
    A good exercise is to retell a poem in colloquial Cantonese: 床前明月光 → 張床前面有好光嘅月光.
  examples:
    - { es: "學而時習之，不亦說乎？", en: "To learn and practise it regularly - is that not a pleasure?" }
    - { es: "知之為知之，不知為不知。", en: "To know what you know and know what you don't know." }
    - { es: "春風又綠江南岸。", en: "The spring wind greens the south bank of the river once more." }
    - { es: "用廣東話講：學咗嘢再時時練習，唔係好開心咩？", en: "In Cantonese: Isn't it a joy to learn something and practise it often?" }
  pitfalls:
    - "說 in 不亦說乎 is read jyut6 (= 悅, 'pleased'), not syut3 'say': classical texts preserve old readings."
    - "Don't add colloquial particles when reciting classical text; paraphrase separately."
  related: [g.classical-function-words, g.classical-pronouns, g.ping-zak]
  drills:
    - { es: "三人行，必有我師。", en: "Among any three people walking, one can be my teacher." }
    - { es: "溫故而知新。", en: "Review the old to learn the new." }
    - { es: "己所不欲，勿施於人。", en: "Do not do to others what you would not want done to yourself." }

- id: g.guangzhou-vs-hk
  level: c2
  title: "Guangzhou vs Hong Kong Cantonese"
  summary: "Guangzhou and Hong Kong share grammar and sounds but differ in vocabulary (公交 vs 巴士, 冰箱 vs 雪櫃, 草莓 vs 士多啤梨), in English vs Mandarin loans, and in script (simplified vs traditional)."
  explanation: |
    Guangzhou (廣州, gwong2 zau1) Cantonese is the historical prestige variety; Hong Kong Cantonese developed from it. They are fully mutually intelligible.

    ### Vocabulary
    | Meaning | Hong Kong | Guangzhou |
    |---|---|---|
    | bus | 巴士 (baa1 si2) | 公交 / 巴士 |
    | fridge | 雪櫃 (syut3 gwai6) | 冰箱 (bing1 soeng1) / 雪櫃 |
    | strawberry | 士多啤梨 (si6 do1 be1 lei2) | 草莓 (cou2 mui2) |
    | take a taxi | 搭的士 / 截的士 | 打的 (daa2 dik1) |
    | the bill | 埋單 | 埋單 / 買單 (maai5 daan1) |

    ### Loans
    Hong Kong borrows from English (巴士, 士多, 波); Guangzhou increasingly borrows from Mandarin (see next note).

    ### Address and manners
    In Guangzhou, 靚仔 and 靚女 are standard ways to address strangers, including service staff; in Hong Kong this is less common outside markets.

    ### Script
    Guangzhou writes in simplified characters (广州, 冇, 嘅 still used informally); Hong Kong uses traditional characters.

    ### Sounds
    Both have the same six tones; "lazy sounds" (n → l etc.) are common among younger speakers in both cities.
  examples:
    - { es: "喺香港坐巴士，喺廣州好多人講坐公交。", en: "In Hong Kong you take the 'bas-si'; in Guangzhou many people say 'gung-gaau'." }
    - { es: "我哋去西關食艇仔粥。", en: "Let's go to Xiguan for sampan congee." }
    - { es: "靚女，唔該埋單！", en: "Excuse me, miss, the bill please! (Guangzhou style)" }
    - { es: "香港人叫士多啤梨，廣州人多數叫草莓。", en: "Hongkongers say 'si-do-be-lei'; Guangzhou people mostly say 'cou-mui'." }
  pitfalls:
    - "Don't assume Guangzhou speakers will understand every English loan used in Hong Kong."
    - "Both varieties are 'real' Cantonese; avoid calling one more correct."
  variant: "Guangzhou usage: 公交 (bus), 冰箱 (fridge), 打的 (take a taxi), 買單 (bill) and 靚仔 / 靚女 as everyday address; written in simplified characters."
  related: [g.mandarin-influence, g.address-terms, g.code-mixing]
  drills:
    - { es: "我哋打的去陳家祠啦。", en: "Let's take a taxi to the Chen Clan Ancestral Hall. (Guangzhou style)" }
    - { es: "廣州同香港講嘅都係廣東話。", en: "Guangzhou and Hong Kong both speak Cantonese." }
    - { es: "雪櫃有冇嘢飲呀？", en: "Is there anything to drink in the fridge?" }

- id: g.mandarin-influence
  level: c2
  title: "Mandarin influence on Cantonese vocabulary"
  summary: "Mandarin loans are entering Cantonese, especially in Guangzhou: 搞定 for 搞掂, 視頻 for 影片, 質量 for 質素, 屏幕 for 熒幕, and 有 + verb for 'did'."
  explanation: |
    ### Vocabulary pairs
    | Hong Kong traditional | Jyutping | Mandarin-influenced | Jyutping | Meaning |
    |---|---|---|---|---|
    | 搞掂 | gaau2 dim6 | 搞定 | gaau2 ding6 | sorted, done |
    | 影片 | jing2 pin2 | 視頻 | si6 pan4 | video |
    | 資訊 | zi1 seon3 | 信息 | seon3 sik1 | information |
    | 質素 | zat1 sou3 | 質量 | zat1 loeng6 | quality |
    | 熒幕 | jing4 mok6 | 屏幕 | ping4 mok6 | screen |

    ### Grammar: 有 + verb
    Mandarin-influenced 有 + V for a completed action ("did") is spreading: 我有去 "I did go". Traditional Cantonese prefers V咗 or 有去到: 我去咗 / 我有去過.

    ### Attitudes
    In Hong Kong, some see these words as signs of mainlandisation; in Guangzhou they are ordinary. As a learner, recognise both and match the people you talk to.

    ### Reverse flow
    Cantonese has also given words to Mandarin: 埋單 (Mandarin 買單 mǎidān), 的士 → 打的, 靚仔.
  examples:
    - { es: "件事搞掂咗。", en: "It's all sorted. (Hong Kong)" }
    - { es: "件事搞定咗。", en: "It's all sorted. (Mandarin-influenced)" }
    - { es: "我喺網上睇咗條片。", en: "I watched a video online. (Hong Kong)" }
    - { es: "我有去過，好好玩。", en: "I've been there, it was great." }
  pitfalls:
    - "Using 視頻 or 質量 in Hong Kong may sound mainland-style; 影片 and 質素 are the local norms."
    - "有 + V without 過 or 咗 (我有食) still sounds odd to many Hong Kong speakers."
  related: [g.guangzhou-vs-hk, g.spoken-vs-written, g.zo-perfective]
  drills:
    - { es: "我哋搞掂喇。", en: "We're done." }
    - { es: "呢條片好好笑。", en: "This video is hilarious." }
    - { es: "呢間公司嘅質素好高。", en: "This company's quality is very high." }

- id: g.address-terms
  level: c2
  title: "Terms of address - 師傅, 老細, 阿姐, 靚仔, 老友記"
  summary: "Cantonese addresses people by role and relation: 師傅 for skilled workers, 老細 for the boss, 阿姐 / 阿叔 / 阿姨 for older people, 靚仔 / 靚女 for young people, 老友記 for old friends and the elderly."
  explanation: |
    | Term | Jyutping | Used for |
    |---|---|---|
    | 師傅 | si1 fu2 | drivers, chefs, tradesmen, kung fu masters |
    | 老細 | lou5 sai3 | the boss, shop owner |
    | 阿姐 | aa3 ze1 | older woman (colleague, worker); also a famous singer |
    | 阿叔 | aa3 suk1 | middle-aged man |
    | 阿姨 | aa3 ji1 | middle-aged woman; also a nanny |
    | 阿伯 / 阿婆 | aa3 baak3 / aa3 po4 | elderly man / woman |
    | 靚仔 / 靚女 | leng3 zai2 / leng3 neoi2 | young man / woman (friendly) |
    | 老友記 | lou5 jau5 gei3 | old pal; senior citizens |
    | 大佬 | daai6 lou2 | big brother; (in films) gang boss |
    | 師奶 | si1 naai1 | housewife (can be dismissive) |

    ### Choosing well
    - Taxi driver: 師傅，唔該去西關.
    - Restaurant in Guangzhou: 靚女，埋單.
    - Elderly stranger: 阿伯 / 阿婆, softened with 呀.

    ### Pitfalls of age
    Calling a 30-year-old woman 阿姨 can offend; 靚女 or 小姐 is safer. 師奶 can sound condescending.
  examples:
    - { es: "師傅，唔該去火車站。", en: "Driver, to the railway station please." }
    - { es: "老細，呢個點賣呀？", en: "Boss, how much is this?" }
    - { es: "阿婆，使唔使幫手呀？", en: "Granny, do you need a hand?" }
    - { es: "社區中心有好多老友記活動。", en: "The community centre has lots of activities for seniors." }
  pitfalls:
    - "Don't call a young woman 阿姨 unless she's actually a nanny or much older; it implies age."
    - "大佬 is fine for your big brother or jokingly, but in some contexts it suggests gangsters."
  related: [g.kinship-terms, g.honorifics, g.guangzhou-vs-hk]
  drills:
    - { es: "唔該晒師傅。", en: "Thank you, driver." }
    - { es: "阿叔，請問點去陳家祠？", en: "Excuse me, sir, how do I get to the Chen Clan Hall?" }
    - { es: "老細今日唔喺度。", en: "The boss isn't in today." }

- id: g.folk-rhymes
  level: c2
  title: "Cantonese nursery rhymes (童謠) - 月光光, 落雨大, 氹氹轉"
  summary: "Traditional rhymes like 月光光 use short lines, chain linking (each line picks up the last word) and end rhymes, and preserve old village vocabulary."
  explanation: |
    ### 月光光 (opening)
    月光光，照地堂 (jyut6 gwong1 gwong1, ziu3 dei6 tong4)，
    年卅晚，摘檳榔 (zaak6 ban1 long4)，
    檳榔香，摘子薑 (zaak6 zi2 goeng1)……

    Features:
    - **Chain linking (頂真)**: each line starts with the end of the previous one: 摘檳榔 → 檳榔香.
    - **End rhymes** in -ong / -oeng: 光, 堂, 榔, 香, 薑.
    - **Three-syllable lines**, easy for children to chant.

    ### 落雨大
    落雨大，水浸街，阿哥擔柴上街賣 - "Heavy rain, the street floods, big brother carries firewood to sell in the street." It paints old Guangzhou street life.

    ### 氹氹轉
    氹氹轉 (dam4 dam4 zyun3)，菊花園 - a spinning-game rhyme listing snacks like 炒米餅 (caau2 mai5 beng2).

    ### Old vocabulary
    地堂 "threshing floor / front yard", 擔柴 "carry firewood", 年卅晚 "New Year's Eve" reflect village life in the Pearl River Delta.
  examples:
    - { es: "月光光，照地堂。", en: "The moon shines bright on the front yard." }
    - { es: "落雨大，水浸街。", en: "Heavy rain, the street floods." }
    - { es: "細個嗰陣，阿嫲成日唱月光光。", en: "When I was little, Grandma always sang 'Moon So Bright'." }
    - { es: "呢首童謠每句都連住上一句。", en: "Each line of this rhyme links to the line before." }
  pitfalls:
    - "Rhyme texts vary from family to family; don't treat one version as the only correct one."
    - "Some old versions contain dated or offensive words; modern versions often change them."
  related: [g.cantonese-rhyme, g.yuet-au, g.writing-cantonese]
  drills:
    - { es: "年卅晚，摘檳榔。", en: "On New Year's Eve, picking betel nuts." }
    - { es: "氹氹轉，菊花園。", en: "Round and round, chrysanthemum garden." }
    - { es: "你識唔識唱月光光呀？", en: "Can you sing 'Moon So Bright'?" }

- id: g.yuet-au
  level: c2
  title: "粵謳 - Zhao Ziyong's Cantonese love songs (1828)"
  summary: "粵謳 'Cantonese songs' by 招子庸 (1828) are among the earliest literary works written largely in colloquial Cantonese, mixing classical diction with 唔, 佢, 嘅 and 咁."
  explanation: |
    **粵謳** (jyut6 au1) is a song form from Guangzhou's pleasure boats. In **1828** the scholar **招子庸** (Zhao Ziyong) published a collection of them, making it one of the earliest printed literary works in written Cantonese. Its opening piece is 〈解心事〉 ("Unburdening the heart").

    ### Language
    The songs blend:
    - **classical diction**: 苦海, 茫茫, 命 (fate), 神仙;
    - **colloquial Cantonese**: 唔 (not), 佢 (he/she), 嘅, 咁 / 噉, 點 (how), 乜 (what);
    - **sung fillers and repetitions** typical of folk song.

    The first line of 〈解心事〉: 心各有事，總要解脫為先 "Every heart has its troubles; first of all, one must find release."

    ### Themes
    Love, longing, the hardship of courtesans and the impermanence of life, often with Buddhist undertones.

    ### Reading tips
    - Read classical phrases with literary readings and colloquial words with everyday ones.
    - Use a glossary for older characters: some colloquial words were written differently in the 19th century.
    - Notice how little the core grammar (唔, 佢, 嘅) has changed in two hundred years.
  examples:
    - { es: "心各有事，總要解脫為先。", en: "Every heart has its troubles; first of all, one must find release." }
    - { es: "粵謳係招子庸喺一八二八年出版嘅。", en: "Zhao Ziyong published the Yue'ou in 1828." }
    - { es: "粵謳入面有好多口語字，例如唔同佢。", en: "The Yue'ou contain many colloquial words, such as 'not' and 'he/she'." }
  pitfalls:
    - "Don't expect fully modern spelling; 19th-century written Cantonese used some different characters."
    - "粵謳 is a song form, not the same as 粵劇 (opera)."
  related: [g.writing-cantonese, g.folk-rhymes, g.lyrics-register]
  drills:
    - { es: "呢首粵謳講愛情。", en: "This Yue'ou is about love." }
    - { es: "我睇緊招子庸嘅粵謳。", en: "I'm reading Zhao Ziyong's Yue'ou." }
    - { es: "粵謳有好多佛教思想。", en: "The Yue'ou contain a lot of Buddhist thought." }

- id: g.writing-cantonese
  level: c2
  title: "How Cantonese is written - 本字, 借音字, 方言字"
  summary: "Written Cantonese uses old characters with original meanings (企, 食, 行), sound loans (係, 咪), dialect characters with the 口 radical (嘅, 咗, 嘢, 哋), and Latin letters for words with no agreed character."
  explanation: |
    Spoken Cantonese has many words that standard Chinese characters don't cover. Writers solve this in several ways:

    | Type | Examples | Explanation |
    |---|---|---|
    | 本字 (original characters) | 企 (stand), 食 (eat), 行 (walk), 睇 (look) | old characters keeping classical meanings |
    | 借音字 (sound loans) | 係, 咪, 噉 | existing characters borrowed for their sound |
    | 方言字 with 口 | 嘅, 咗, 嘢, 啲, 哋, 嚟, 喺 | 口 radical marks "a spoken sound" |
    | Created characters | 冇, 脷, 膶 | new shapes (冇 = 有 minus two strokes) |
    | Letters | hea, chur, D (for 啲) | no agreed character, or informal shorthand |

    ### Standardisation
    There is no single official standard. Dictionaries and the Hong Kong Supplementary Character Set (HKSCS) made many Cantonese characters available on computers; romanisation such as **Jyutping**, devised by the Linguistic Society of Hong Kong in 1993, gives a standard spelling for sounds.

    ### Variation
    Expect alternatives: 畀 / 俾, 嘅 / 既, 噉 / 咁, 吓 / 下. This course chooses one consistent spelling.
  examples:
    - { es: "冇字係將有字拎走兩筆。", en: "The character for 'not have' is 'have' with two strokes removed." }
    - { es: "好多廣東話字都有口字旁。", en: "Many Cantonese characters have the 'mouth' radical." }
    - { es: "粵拼係香港語言學學會喺一九九三年制定嘅。", en: "Jyutping was devised by the Linguistic Society of Hong Kong in 1993." }
    - { es: "有啲字冇統一寫法，例如畀同俾。", en: "Some words have no single spelling, like the two ways of writing 'give'." }
  pitfalls:
    - "Don't assume a Cantonese character exists for every syllable; some words are only written with letters."
    - "Characters like 嘅 and 咗 are not 'wrong' Chinese; they're standard in written Cantonese, though not in formal 書面語."
  related: [g.spoken-vs-written, g.yuet-au, g.taboo-euphemisms]
  drills:
    - { es: "啲、嘢、哋都係廣東話字。", en: "'Some', 'thing' and the plural suffix are all Cantonese characters." }
    - { es: "你識唔識打廣東話字？", en: "Can you type Cantonese characters?" }
    - { es: "我用粵拼學發音。", en: "I use Jyutping to learn pronunciation." }
