id: r.c2.tres-poemas
level: c2
title: Tres poemas
kind: literature
author: Gustavo Adolfo Bécquer, Rubén Darío, Antonio Machado
source: "Bécquer, Rimas, LIII (1871); Darío, Cantos de vida y esperanza, «Lo fatal» (1905); Machado, Campos de Castilla, «Proverbios y cantares», XXIX (1912)"
intro: Three short poems quoted in full, one per movement studied in this unit. Each stanza is given as a paragraph so you can read it as a unit. The authors died in 1870, 1916 and 1939; all three texts are public domain.
allow: [bécquer, darío, machado, dios]
paragraphs:
  - { es: "Volverán las oscuras golondrinas / en tu balcón sus nidos a colgar, / y otra vez con el ala a sus cristales / jugando llamarán.", en: "The dark swallows will return / to hang their nests on your balcony, / and once again with their wing at its panes / they will knock, playing." }
  - { es: "Pero aquellas que el vuelo refrenaban / tu hermosura y mi dicha a contemplar, / aquellas que aprendieron nuestros nombres… / ¡esas… no volverán!", en: "But those that checked their flight / to gaze on your beauty and my happiness, / those that learned our names… / those… will not return!" }
  - { es: "Volverán las tupidas madreselvas / de tu jardín las tapias a escalar, / y otra vez a la tarde aún más hermosas / sus flores se abrirán.", en: "The thick honeysuckles will return / to climb the walls of your garden, / and once again in the evening, lovelier still, / their flowers will open." }
  - { es: "Pero aquellas, cuajadas de rocío / cuyas gotas mirábamos temblar / y caer como lágrimas del día… / ¡esas… no volverán!", en: "But those, heavy with dew, / whose drops we watched tremble / and fall like the tears of the day… / those… will not return!" }
  - { es: "Volverán del amor en tus oídos / las palabras ardientes a sonar; / tu corazón de su profundo sueño / tal vez despertará.", en: "The burning words of love will return / to sound in your ears; / your heart from its deep sleep / will perhaps awaken." }
  - { es: "Pero mudo y absorto y de rodillas / como se adora a Dios ante su altar, / como yo te he querido…; desengáñate, / ¡así… no te querrán!", en: "But silent and rapt and on my knees, / as God is worshipped before his altar, / as I have loved you…; be under no illusion: / like that… they will not love you!" }
  - { es: "Dichoso el árbol, que es apenas sensitivo, / y más la piedra dura porque esa ya no siente, / pues no hay dolor más grande que el dolor de ser vivo, / ni mayor pesadumbre que la vida consciente.", en: "Happy the tree, which is barely sentient, / and more so the hard stone, for it no longer feels, / since there is no greater pain than the pain of being alive, / nor greater sorrow than conscious life." }
  - { es: "Ser y no saber nada, y ser sin rumbo cierto, / y el temor de haber sido y un futuro terror… / Y el espanto seguro de estar mañana muerto, / y sufrir por la vida y por la sombra y por", en: "To be, and to know nothing, and to be without a sure course, / and the dread of having been, and a future terror… / And the certain horror of being dead tomorrow, / and to suffer for life, and for the shadow, and for" }
  - { es: "lo que no conocemos y apenas sospechamos, / y la carne que tienta con sus frescos racimos, / y la tumba que aguarda con sus fúnebres ramos, / ¡y no saber adónde vamos, / ni de dónde venimos!…", en: "what we do not know and barely suspect, / and the flesh that tempts with its fresh clusters, / and the tomb that waits with its funeral wreaths, / and not to know where we are going, / nor where we come from!…" }
  - { es: "Caminante, son tus huellas / el camino y nada más; / caminante, no hay camino, / se hace camino al andar. / Al andar se hace el camino, / y al volver la vista atrás / se ve la senda que nunca / se ha de volver a pisar. / Caminante, no hay camino, / sino estelas en la mar.", en: "Wayfarer, your footprints / are the path, and nothing more; / wayfarer, there is no path, / the path is made by walking. / By walking the path is made, / and on looking back / one sees the track that will never / be trodden again. / Wayfarer, there is no path, / only wakes upon the sea." }
questions:
  - { q: "In Bécquer's poem, what will not return?", options: ["The swallows and the honeysuckle", "The particular swallows, dewdrops and love that the couple shared", "The spring"], answer: 1 }
  - { q: "What device structures Bécquer's six stanzas?", options: ["A sonnet form", "Alternation of 'volverán' and 'pero aquellas… no volverán' (anaphora and antithesis)", "Free verse without rhyme"], answer: 1 }
  - { q: "Why does Darío call the tree and the stone 'happy'?", options: ["Because they are beautiful", "Because they live in the countryside", "Because they do not feel, and the greatest pain is conscious life"], answer: 2 }
  - { q: "What does the final image of Machado's poem say about the past?", options: ["It leaves only wakes in the sea: nothing can be walked again", "It is a road we can return to", "It should be forgotten"], answer: 0 }
  - { q: "Which line from Darío ends mid-sentence and continues in the next stanza (enjambment)?", options: ["Dichoso el árbol, que es apenas sensitivo", "y sufrir por la vida y por la sombra y por", "ni de dónde venimos"], answer: 1 }
