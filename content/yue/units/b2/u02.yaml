id: b2.u02
title: 梗係啦，咁簡單嘛
lessons:
  - id: b2.u02.l1
    title: 咪坐巴士囉
    teach: [g.lo1-obvious]
    vocab: [w.lo1, w.mai6, w.mai6-hai6-lo1, w.hai6-lo1, w.jau4-keoi5, w.lei5-dak1-keoi5, w.laan5-lei5, w.lei5.b, w.faan2-zing3, w.waang4-dim6, w.ding2-ngaang6-soeng5, w.ding2, w.dim2-dou1-hou2, w.gam2-jau6-hai6, w.ning4-ho2, w.kap1.b, w.daai6-fat6, w.baan6-faat3]
    tip: "囉 (lo1) presents a conclusion as obvious, often with a shrug. 咪…囉 means 'well then, just …'."
    sentences:
      - { es: "纜車停咗，咪坐巴士上去囉。", en: "The cable car's stopped, so just take the bus up.", altEs: ["纜車停咗，咪搭巴士上去囉。", "纜車停咗咪坐巴士上去囉。"], altEn: ["The cable car isn't running, so we'll just get the bus up."], grammar: [g.lo1-obvious], vocab: [w.lo1, w.mai6], jp: "laam6 ce1 ting4 zo2 mai6 co5 baa1 si2 soeng5 heoi3 lo1" }
      - { es: "你攰就坐低休息吓。", en: "If you're tired, sit down and have a rest.", altEs: ["你攰就坐低唞吓。"], grammar: [g.lo1-obvious], vocab: [w.mai6], transform: { instruction: "Make it a shrugging 'well then, just…' with 咪…囉", answer: "你攰咪坐低休息吓囉。", alt: ["你攰咪坐低唞吓囉。"], en: "If you're tired, well, just sit down and rest." }, jp: "nei5 gui6 zau6 co5 dai1 jau1 sik1 haa5" }
      - { es: "咪係囉，我都係噉講。", en: "Exactly, that's what I said.", altEs: ["咪係囉，我都係咁講。"], altEn: ["That's exactly what I said."], grammar: [g.lo1-obvious], vocab: [w.mai6-hai6-lo1] }
      - { es: "係囉，二百幾級，梗係攰啦。", en: "Right, two hundred-odd steps — of course you're tired.", altEs: ["係囉，二百幾級，實攰啦。"], grammar: [g.lo1-obvious], vocab: [w.hai6-lo1] }
      - { es: "佢唔想行樓梯就由佢囉，我哋自己上去。", en: "If he doesn't want to climb the steps, let him be — we'll go up ourselves.", altEs: ["佢唔想行樓梯咪由佢囉，我哋自己上去。"], altEn: ["If she won't take the stairs, leave her — we'll go up on our own."], grammar: [g.lo1-obvious], vocab: [w.jau4-keoi5] }
      - { es: "理得佢啦，佢鍾意點就點囉。", en: "Who cares — let him do as he likes.", altEs: ["理得佢，佢鍾意點就點囉。"], altEn: ["Never mind her, she can do what she wants."], grammar: [g.lo1-obvious], vocab: [w.lei5-dak1-keoi5] }
      - { es: "我懶理佢哋講乜，反正我一定要上去睇大佛。", en: "I couldn't care less what they say — I'm going up to see the Buddha anyway.", altEs: ["我懶理佢哋講咩，反正我一定要上去睇大佛。"], grammar: [g.lo1-obvious], vocab: [w.laan5-lei5, w.faan2-zing3] }
      - { es: "橫掂都嚟咗昂坪，咪去寶蓮寺食齋囉。", en: "Since we're in Ngong Ping anyway, we might as well have a vegetarian lunch at Po Lin.", altEs: ["橫掂嚟咗昂坪，咪去寶蓮寺食齋囉。"], grammar: [g.lo1-obvious], vocab: [w.waang4-dim6, w.mai6], jp: "waang4 dim6 dou1 lai4 zo2 ngong4 ping4 mai6 heoi3 bou2 lin4 zi6 sik6 zaai1 lo1" }
      - { es: "冇得揀，咪頂硬上囉。", en: "There's no choice, so just grit your teeth and keep going.", altEs: ["冇得揀咪頂硬上囉。"], grammar: [g.lo1-obvious], vocab: [w.ding2-ngaang6-soeng5], jp: "mou5 dak1 gaan2 mai6 ding2 ngaang6 soeng5 lo1" }
      - { es: "咁曬你都頂得住？", en: "You can stand this sun?", altEs: ["咁曬你都頂得順？"], altEn: ["How can you stand the sun like this?"], grammar: [g.potential-complements], vocab: [w.ding2] }
      - { es: "點都好，我哋今日一定要行晒二百六十八級。", en: "Whatever happens, we're climbing all 268 steps today.", altEs: ["點都好，今日一定要行晒二百六十八級。"], grammar: [g.lo1-obvious, g.saai-all], vocab: [w.dim2-dou1-hou2] }
      - { es: "噉又係，坐纜車快啲。", en: "That's true, I suppose — the cable car's quicker.", altEs: ["噉又係嘅，坐纜車快啲。", "都係，坐纜車快啲。"], grammar: [g.lo1-obvious], vocab: [w.gam2-jau6-hai6] }
      - { es: "我寧可行多兩步，都唔想排一個鐘隊。", en: "I'd rather walk a bit further than queue for an hour.", altEs: ["我寧願行多兩步，都唔想排一個鐘隊。"], grammar: [g.lo1-obvious], vocab: [w.ning4-ho2], jp: "ngo5 ning4 ho2 haang4 do1 loeng5 bou6 dou1 m4 soeng2 paai4 jat1 go3 zung1 deoi2" }
      - { es: "唔鍾意食齋咪唔好食囉。", en: "If you don't like vegetarian food, then don't eat it.", altEs: ["唔鍾意食齋咪唔食囉。"], grammar: [g.lo1-obvious], vocab: [w.mai6], error: { wrong: "唔鍾意食齋咪食囉。", explain: "咪…囉 says 'well then, just …'; to say 'then don't' keep the negative: 咪唔好食囉 / 咪唔食囉.", grammar: g.lo1-obvious }, jp: "m4 zung1 ji3 sik6 zaai1 mai6 m4 hou2 sik6 lo1" }
      - { es: "佢唔嚟。", en: "He isn't coming.", altEs: ["佢唔嚟呀。"], altEn: ["She isn't coming."], grammar: [g.lo1-obvious], vocab: [w.lo1], transform: { instruction: "Shrug it off: add 就算囉", answer: "佢唔嚟就算囉。", alt: ["佢唔嚟咪算囉。"], en: "If he isn't coming, so be it." } }
    exchanges:
      - q: { es: "纜車排成兩個鐘，點算呀？", en: "There's a two-hour queue for the cable car — what do we do?" }
        a: { es: "咪坐巴士囉，一樣上到昂坪。", en: "Just take the bus, then — it gets to Ngong Ping all the same." }
        alt: ["咪等囉。", "咪坐巴士囉。"]
        grammar: [g.lo1-obvious]
        vocab: [w.mai6, w.lo1]
      - q: { es: "我覺得行樓梯上去睇大佛先有意思。", en: "I think walking up the steps is the whole point of seeing the Buddha." }
        a: { es: "咪係囉！坐車上去就冇味道喇。", en: "Exactly! Driving up takes all the fun out of it." }
        alt: ["係囉，我都係噉諗。", "咪係囉。"]
        grammar: [g.lo1-obvious]
        vocab: [w.mai6-hai6-lo1]
      - q: { es: "阿明話佢唔上去喎。", en: "Ming says he's not going up." }
        a: { es: "由佢囉，我哋自己去。", en: "Let him be — we'll go by ourselves." }
        alt: ["理得佢囉。", "佢唔去就算囉。"]
        grammar: [g.lo1-obvious, g.wo5-hearsay]
        vocab: [w.jau4-keoi5, w.lei5-dak1-keoi5]
      - q: { es: "落雨喎，仲去唔去呀？", en: "Oh, it's raining — are we still going?" }
        a: { es: "去囉，反正都嚟咗。", en: "Of course we're going — we're here anyway." }
        alt: ["橫掂都嚟咗，去囉。", "點都好都要去。"]
        grammar: [g.lo1-obvious]
        vocab: [w.faan2-zing3, w.waang4-dim6]
      - q: { es: "坐纜車貴過巴士好多喎。", en: "The cable car costs a lot more than the bus, you know." }
        a: { es: "噉又係，不過我寧可畀多啲錢睇風景。", en: "True, but I'd rather pay more and see the view." }
        alt: ["噉又係。", "係囉，坐巴士囉。"]
        grammar: [g.lo1-obvious]
        vocab: [w.gam2-jau6-hai6, w.ning4-ho2]
    texts:
      - title: "昂坪 WhatsApp 群組"
        es: ["纜車暫停，個個都話要排兩個鐘。", "冇辦法囉，我哋改坐巴士。", "反正都係去睇大佛，早啲遲啲都冇所謂。"]
        en: ["The cable car's suspended and everyone says there's a two-hour queue.", "Nothing for it — we're taking the bus instead.", "We're going to see the Buddha either way, a bit earlier or later doesn't matter."]
        grammar: [g.lo1-obvious]
        vocab: [w.lo1, w.faan2-zing3]
    spicy:
      - { es: "你唔約我，咪我約你囉。", en: "If you won't ask me out, then I'll ask you.", altEs: ["你唔約我咪我約你囉。"], grammar: [g.lo1-obvious], vocab: [w.mai6, w.lo1], jp: "nei5 m4 joek3 ngo5 mai6 ngo5 joek3 nei5 lo1" }
      - { es: "咪係囉，我哋兩個咁襯，唔拍拖好嘥。", en: "Exactly — we're so well matched, it'd be a waste not to go out.", altEs: ["咪係囉，我哋咁襯，唔拍拖好嘥。"], grammar: [g.lo1-obvious], vocab: [w.mai6-hai6-lo1] }
      - { es: "橫掂你都得閒，咪陪我食晚飯囉。", en: "Since you're free anyway, you might as well have dinner with me.", altEs: ["橫掂你得閒，咪陪我食晚飯囉。"], grammar: [g.lo1-obvious], vocab: [w.waang4-dim6], jp: "waang4 dim6 nei5 dou1 dak1 haan4 mai6 pui4 ngo5 sik6 maan5 faan6 lo1" }
      - { es: "我寧可行多二百六十八級，都想同你多傾一陣。", en: "I'd climb another 268 steps just to talk to you a bit longer.", altEs: ["我寧願行多二百六十八級，都想同你多傾一陣。"], grammar: [g.lo1-obvious], vocab: [w.ning4-ho2] }
      - { es: "理得佢哋點睇，我鍾意你就鍾意你囉。", en: "Who cares what they think — I like you, and that's that.", altEs: ["理得佢哋點諗，我鍾意你就鍾意你囉。"], grammar: [g.lo1-obvious], vocab: [w.lei5-dak1-keoi5] }
  - id: b2.u02.l2
    title: 大佛又唔會走嘛
    teach: [g.maa3-as-you-know]
    vocab: [w.maa3.b, w.ming4-ming4, w.gan1-bun2, w.bun2-san1, w.jat1-zou2, w.zou2-zau6, w.dou1-waa6-zo2, w.sai2-mat1, w.ho4-bit1, w.zi2-bat1-gwo3, w.jyu1-si6, w.sam1-gap1, w.gap1, w.ceoi1.b, w.gaau2-cing1-co2, w.zaai1, w.gin3-sing4]
    tip: "嘛 (maa3), usually as 吖嘛, gives a reason the listener should already know: 'after all, you know'."
    sentences:
      - { es: "梗係咁多人啦，今日放假吖嘛。", en: "Of course it's crowded — it's a holiday, after all.", altEs: ["梗係咁多人啦，今日放假嘛。"], grammar: [g.maa3-as-you-know], vocab: [w.maa3.b, w.aa1-maa3] }
      - { es: "唔使急，大佛又唔會走嘛。", en: "No need to rush, the Buddha isn't going anywhere.", altEs: ["唔使急，大佛又唔會走吖嘛。"], altEn: ["Take your time, the Buddha won't run away."], grammar: [g.maa3-as-you-know], vocab: [w.maa3.b, w.gap1] }
      - { es: "我都話咗好多樓梯㗎嘛。", en: "I did tell you there'd be lots of steps.", altEs: ["我都話咗有好多樓梯㗎嘛。"], grammar: [g.maa3-as-you-know, g.particle-clusters], vocab: [w.dou1-waa6-zo2] }
      - { es: "我一早叫你帶水嘛。", en: "I told you ages ago to bring water.", altEs: ["我一早叫咗你帶水吖嘛。"], grammar: [g.maa3-as-you-know], vocab: [w.jat1-zou2] }
      - { es: "佢早就知道寶蓮寺有齋食。", en: "He knew long ago that Po Lin serves vegetarian food.", altEs: ["佢一早就知寶蓮寺有齋食。"], altEn: ["She's known for ages that Po Lin has vegetarian meals."], grammar: [g.maa3-as-you-know], vocab: [w.zou2-zau6] }
      - { es: "明明好近，點解要坐的士呀？", en: "It's obviously close — why take a taxi?", altEs: ["明明好近，做乜要坐的士呀？"], grammar: [g.maa3-as-you-know], vocab: [w.ming4-ming4], jp: "ming4 ming4 hou2 kan5 dim2 gaai2 jiu3 co5 dik1 si2 aa3", transform: { instruction: "Replace 點解 with 何必 to say 'why bother'", answer: "明明好近，何必坐的士呢？", alt: ["明明好近，何必要坐的士呢？"], en: "It's obviously close — why bother with a taxi?" } }
      - { es: "佢根本冇嚟過昂坪。", en: "He's never actually been to Ngong Ping at all.", altEs: ["佢根本未嚟過昂坪。"], altEn: ["She's never even been to Ngong Ping."], grammar: [g.maa3-as-you-know], vocab: [w.gan1-bun2] }
      - { es: "大佛本身唔係好舊，一九九三年先建成。", en: "The Buddha itself isn't very old — it was only finished in 1993.", altEs: ["大佛本身唔算好舊，一九九三年先建成。"], grammar: [g.maa3-as-you-know], vocab: [w.bun2-san1] }
      - { es: "使乜咁早起身呀？纜車平日十點先開。", en: "Why bother getting up so early? On weekdays the cable car doesn't open until ten.", altEs: ["使乜咁早起身？纜車平日十點先開。"], grammar: [g.maa3-as-you-know], vocab: [w.sai2-mat1], jp: "sai2 mat1 gam3 zou2 hei2 san1 aa3 laam6 ce1 ping4 jat6 sap6 dim2 sin1 hoi1" }
      - { es: "何必坐的士呢？巴士都好方便吖嘛。", en: "Why bother with a taxi? The bus is very convenient, after all.", altEs: ["何必坐的士？巴士都好方便嘛。"], grammar: [g.maa3-as-you-know], vocab: [w.ho4-bit1] }
      - { es: "我只不過講吓咋嘛，你唔好嬲。", en: "I was only saying, don't be angry.", altEs: ["我只不過講吓啫嘛，你唔好嬲。"], grammar: [g.maa3-as-you-know, g.particle-clusters], vocab: [w.zi2-bat1-gwo3], jp: "ngo5 zi2 bat1 gwo3 gong2 haa5 zaa3 maa3 nei5 m4 hou2 nau1" }
      - { es: "佢心急想睇大佛，於是一個人跑咗上去。", en: "He couldn't wait to see the Buddha, so he ran up on his own.", altEs: ["佢好心急想睇大佛，於是自己一個人跑咗上去。"], altEn: ["She was impatient to see the Buddha, so she ran up by herself."], grammar: [g.maa3-as-you-know], vocab: [w.sam1-gap1, w.jyu1-si6] }
      - { es: "唔好催我啦，我行得好慢㗎嘛。", en: "Stop rushing me — I walk slowly, you know.", altEs: ["唔好催我，我行得好慢㗎嘛。"], grammar: [g.maa3-as-you-know], vocab: [w.ceoi1.b, w.gaa3-maa3] }
      - { es: "搞清楚先，坐纜車定坐巴士平啲？", en: "Let's get this straight first: is the cable car or the bus cheaper?", altEs: ["搞清楚先，纜車定巴士平啲？"], grammar: [g.maa3-as-you-know], vocab: [w.gaau2-cing1-co2] }
      - { es: "佢住喺大嶼山嘛，梗係識路啦。", en: "He lives on Lantau, after all — of course he knows the way.", altEs: ["佢住喺大嶼山吖嘛，梗係識路啦。"], altEn: ["She lives on Lantau, so naturally she knows the way."], grammar: [g.maa3-as-you-know], vocab: [w.maa3.b], error: { wrong: "佢住喺大嶼山嗎，梗係識路啦。", explain: "嗎 asks a yes/no question; the 'after all' particle is 嘛 (maa3).", grammar: g.maa3-as-you-know } }
      - { es: "佢今日好攰。", en: "She's really tired today.", altEs: ["佢今日好攰呀。"], altEn: ["He's really tired today."], grammar: [g.maa3-as-you-know], vocab: [w.aa1-maa3], transform: { instruction: "Give it as the obvious reason: end with 吖嘛", answer: "佢今日好攰吖嘛。", alt: ["佢今日好攰嘛。"], en: "Well, she's really tired today." } }
    exchanges:
      - q: { es: "點解今日咁多人嘅？", en: "Why are there so many people today?" }
        a: { es: "星期六吖嘛，梗係多人啦。", en: "It's Saturday, after all — of course it's busy." }
        alt: ["週末吖嘛。", "放假嘛。"]
        grammar: [g.maa3-as-you-know]
        vocab: [w.maa3.b]
      - q: { es: "嘩，原來要行二百六十八級！", en: "Wow, it turns out there are 268 steps to climb!" }
        a: { es: "我都話咗㗎嘛，你唔信。", en: "I told you so, but you didn't believe me." }
        alt: ["我一早講咗㗎嘛。", "都話咗囉。"]
        grammar: [g.maa3-as-you-know]
        vocab: [w.dou1-waa6-zo2, w.jat1-zou2]
      - q: { es: "使唔使訂位食齋？", en: "Do we need to book for the vegetarian meal?" }
        a: { es: "使乜呀，平日冇乜人嘛。", en: "No need — it's not busy on weekdays, after all." }
        alt: ["唔使啦。", "何必呢，平日好少人。"]
        grammar: [g.maa3-as-you-know]
        vocab: [w.sai2-mat1]
      - q: { es: "快啲啦，就嚟冇位喇！", en: "Hurry up, there'll be no seats left in a minute!" }
        a: { es: "唔好催啦，又唔係趕時間。", en: "Stop rushing me, it's not as if we're in a hurry." }
        alt: ["唔使咁心急嘛。", "唔好催我啦。"]
        grammar: [g.maa3-as-you-know]
        vocab: [w.ceoi1.b, w.sam1-gap1]
      - q: { es: "你肯定佢冇嚟過？", en: "Are you sure he's never been here?" }
        a: { es: "肯定，佢根本唔知寶蓮寺喺邊。", en: "Sure — he doesn't even know where Po Lin is." }
        alt: ["佢根本冇嚟過。", "肯定，佢明明話冇嚟過。"]
        grammar: [g.maa3-as-you-know]
        vocab: [w.gan1-bun2]
    texts:
      - title: "旅遊日記"
        es: ["我心急想睇大佛，於是一早出門。", "點知纜車十點先開，我等咗成個鐘。", "早知搞清楚先吖嘛！"]
        en: ["I was impatient to see the Buddha, so I set out early.", "But the cable car didn't open until ten, and I waited a whole hour.", "I should have checked first, obviously!"]
        grammar: [g.maa3-as-you-know]
        vocab: [w.sam1-gap1, w.jyu1-si6, w.gaau2-cing1-co2]
    spicy:
      - { es: "我請你食飯好正常嘛，我鍾意你吖嘛。", en: "It's only natural I'd buy you dinner — I like you, after all.", altEs: ["我請你食飯好正常吖嘛，我鍾意你嘛。"], grammar: [g.maa3-as-you-know], vocab: [w.maa3.b] }
      - { es: "唔使咁心急，我又唔會走嘛。", en: "No need to be so eager, I'm not going anywhere.", altEs: ["唔使咁心急，我又唔會走吖嘛。"], grammar: [g.maa3-as-you-know], vocab: [w.sam1-gap1] }
      - { es: "我只不過想拖吓你隻手啫嘛。", en: "I only wanted to hold your hand, that's all.", altEs: ["我只不過想拖你隻手啫。"], grammar: [g.maa3-as-you-know, g.particle-clusters], vocab: [w.zi2-bat1-gwo3], jp: "ngo5 zi2 bat1 gwo3 soeng2 to1 haa5 nei5 zek3 sau2 ze1 maa3" }
      - { es: "你明明鍾意我，何必扮冷靜呢？", en: "You obviously like me, so why bother playing it cool?", altEs: ["你明明鍾意我，使乜扮冷靜呢？"], grammar: [g.maa3-as-you-know], vocab: [w.ming4-ming4, w.ho4-bit1] }
  - id: b2.u02.l3
    title: 你未去過咩？
    teach: [g.me1-surprise]
    vocab: [w.me1.b, w.m4-tung1, w.naan4-dou6, w.jau5-mou5-gaau2-co3, w.gaau2-mat1-gwai2, w.dong3-zan1, w.ceoi1-seoi2, w.syut3-waa6, w.baan6, w.baan6-je5, w.jiu1-kau4, w.keoi5-zyut6, w.zip3-sau6, w.m4-goi1-nei5, w.hang2]
    tip: "Statement + 咩 asks with surprise or disbelief, expecting 'no, surely not': 你唔知咩？ 'You didn't know?!'"
    sentences:
      - { es: "你未去過天壇大佛咩？", en: "You've never been to the Big Buddha?", altEs: ["你未去過大佛咩？"], grammar: [g.me1-surprise], vocab: [w.me1.b] }
      - { es: "大佛有三十四米高咩？咁高？", en: "The Buddha is thirty-four metres tall? That tall?", altEs: ["大佛真係有三十四米高咩？"], grammar: [g.me1-surprise], vocab: [w.me1.b] }
      - { es: "要行二百六十八級咩？", en: "We have to climb 268 steps?", altEs: ["真係要行二百六十八級咩？"], grammar: [g.me1-surprise], vocab: [w.me1.b] }
      - { es: "唔通你冇帶錢咩？", en: "Don't tell me you didn't bring any money?", altEs: ["唔通你冇帶錢？"], grammar: [g.me1-surprise], vocab: [w.m4-tung1] }
      - { es: "難道你唔記得咗佢生日？", en: "Surely you haven't forgotten his birthday?", altEs: ["難道你唔記得佢生日？"], altEn: ["Don't tell me you've forgotten her birthday?"], grammar: [g.me1-surprise], vocab: [w.naan4-dou6] }
      - { es: "有冇搞錯？纜車又停呀？", en: "Are you kidding me? The cable car's stopped again?", altEs: ["有冇搞錯呀？纜車又停？"], grammar: [g.me1-surprise], vocab: [w.jau5-mou5-gaau2-co3], jp: "jau5 mou5 gaau2 co3 laam6 ce1 jau6 ting4 aa3" }
      - { es: "你喺度搞乜鬼呀？", en: "What on earth are you doing there?", altEs: ["你喺度搞咩鬼呀？"], grammar: [g.me1-surprise], vocab: [w.gaau2-mat1-gwai2] }
      - { es: "你唔好當真，佢鍾意吹水㗎咋。", en: "Don't take it seriously, he just likes to talk big.", altEs: ["唔好當真，佢鍾意吹水啫。"], altEn: ["Don't take her seriously, she just likes to shoot the breeze."], grammar: [g.particle-clusters], vocab: [w.dong3-zan1, w.ceoi1-seoi2] }
      - { es: "佢講嘅說話你都信咩？", en: "You actually believe what he says?", altEs: ["佢啲說話你都信咩？"], altEn: ["You believe what she says?"], grammar: [g.me1-surprise], vocab: [w.syut3-waa6] }
      - { es: "佢成日扮識，其實乜都唔知。", en: "He always pretends to know, but actually he knows nothing.", altEs: ["佢成日扮識，其實乜嘢都唔知。"], grammar: [g.me1-surprise], vocab: [w.baan6] }
      - { es: "唔好扮嘢啦，你都係第一次嚟啫。", en: "Stop showing off — it's your first time here too.", altEs: ["咪扮嘢啦，你都係第一次嚟啫。"], grammar: [g.zaa3-ze1-only], vocab: [w.baan6-je5] }
      - { es: "佢要求退錢，但係職員拒絕咗。", en: "He demanded a refund, but the staff refused.", altEs: ["佢要求退錢，不過職員拒絕咗。"], altEn: ["She asked for her money back, but the staff said no."], grammar: [g.me1-surprise], vocab: [w.jiu1-kau4, w.keoi5-zyut6] }
      - { es: "佢肯接受我哋嘅道歉咩？", en: "He's willing to accept our apology?", altEs: ["佢真係肯接受我哋道歉咩？"], altEn: ["She's actually going to accept our apology?"], grammar: [g.me1-surprise], vocab: [w.hang2, w.zip3-sau6], transform: { instruction: "Make it a neutral question with A-not-A", answer: "佢肯唔肯接受我哋嘅道歉？", alt: ["佢肯唔肯接受我哋道歉？"], en: "Is he willing to accept our apology?" } }
      - { es: "唔該你，行快啲啦！", en: "Do me a favour and walk faster!", altEs: ["唔該你行快啲啦！"], grammar: [g.laa1-suggestion], vocab: [w.m4-goi1-nei5], jp: "m4 goi1 nei5 haang4 faai3 di1 laa1" }
      - { es: "你唔知。", en: "You don't know.", altEs: ["你唔知道。"], grammar: [g.me1-surprise], vocab: [w.me1.b], transform: { instruction: "Turn it into a surprised question with 咩", answer: "你唔知咩？", alt: ["你唔知道咩？"], en: "You didn't know?" } }
      - { es: "你幾時嚟㗎？", en: "When did you get here?", altEs: ["你幾時到㗎？"], grammar: [g.me1-surprise, g.gaa3-explaining], vocab: [w.me1.b], error: { wrong: "你幾時嚟咩？", explain: "A question with a question word (幾時, 邊度) can't take the surprise particle 咩; use 㗎 or 呀 instead.", grammar: g.me1-surprise } }
    exchanges:
      - q: { es: "我未食過齋喎。", en: "Oh, I've never had a vegetarian temple meal." }
        a: { es: "真係未食過咩？寶蓮寺啲齋好出名㗎。", en: "Really, never? Po Lin's vegetarian food is famous." }
        alt: ["未食過咩？一定要試吓。", "唔係嘛？"]
        grammar: [g.me1-surprise]
        vocab: [w.me1.b]
      - q: { es: "佢話佢一個鐘就行到上山頂喎。", en: "He says he can walk up to the top in an hour." }
        a: { es: "唔好當真，佢鍾意吹水㗎咋。", en: "Don't take it seriously, he just likes to brag." }
        alt: ["佢吹水咋。", "你信佢咩？"]
        grammar: [g.me1-surprise, g.wo5-hearsay]
        vocab: [w.dong3-zan1, w.ceoi1-seoi2]
      - q: { es: "唔通你冇買飛咩？", en: "Don't tell me you didn't buy a ticket?" }
        a: { es: "冇呀，我以為唔使買。", en: "No, I thought you didn't have to." }
        alt: ["冇呀，唔記得咗。", "梗係有啦。"]
        grammar: [g.me1-surprise]
        vocab: [w.m4-tung1]
      - q: { es: "佢肯唔肯同我哋一齊去？", en: "Is he willing to come with us?" }
        a: { es: "唔肯呀，佢拒絕咗。", en: "No, he said no." }
        alt: ["肯呀，佢話一齊去喎。", "佢拒絕咗。"]
        grammar: [g.me1-surprise]
        vocab: [w.hang2, w.keoi5-zyut6]
      - q: { es: "有冇搞錯，排咗成個鐘都未到我哋！", en: "You've got to be kidding — we've queued a whole hour and it's still not our turn!" }
        a: { es: "冇計啦，今日放假吖嘛。", en: "Nothing we can do, it's a holiday, after all." }
        alt: ["忍吓啦。", "冇辦法囉。"]
        grammar: [g.me1-surprise, g.maa3-as-you-know]
        vocab: [w.jau5-mou5-gaau2-co3]
    texts:
      - title: "朋友嘅短訊"
        es: ["你未去過昂坪咩？", "唔通你嚟咗香港三年都未見過大佛？", "下個星期日我帶你去，唔准拒絕！"]
        en: ["You've never been to Ngong Ping?", "Don't tell me you've been in Hong Kong three years and never seen the Big Buddha?", "I'm taking you next Sunday — no saying no!"]
        grammar: [g.me1-surprise]
        vocab: [w.me1.b, w.m4-tung1, w.keoi5-zyut6]
    spicy:
      - { es: "你未有女朋友咩？我唔信。", en: "You don't have a girlfriend? I don't believe it.", altEs: ["你未有男朋友咩？我唔信。"], altEn: ["You're single? I don't believe you."], grammar: [g.me1-surprise], vocab: [w.me1.b] }
      - { es: "唔通你特登坐我隔籬咩？", en: "Don't tell me you sat next to me on purpose?", altEs: ["唔通你特登坐喺我隔籬？"], grammar: [g.me1-surprise], vocab: [w.m4-tung1] }
      - { es: "唔好扮嘢啦，我知你鍾意我。", en: "Stop putting on an act — I know you like me.", altEs: ["咪扮嘢啦，我知你鍾意我。"], grammar: [g.me1-surprise], vocab: [w.baan6-je5] }
      - { es: "你肯同我食飯咩？我以為你會拒絕。", en: "You'll have dinner with me? I thought you'd say no.", altEs: ["你真係肯同我食飯咩？我以為你會拒絕。"], grammar: [g.me1-surprise], vocab: [w.hang2, w.keoi5-zyut6] }
      - { es: "你講嘅說話咁甜，我點會唔當真呀？", en: "You say such sweet things — how could I not take you seriously?", altEs: ["你啲說話咁甜，我點會唔當真呀？"], grammar: [g.me1-surprise], vocab: [w.syut3-waa6, w.dong3-zan1], jp: "nei5 gong2 ge3 syut3 waa6 gam3 tim4 ngo5 dim2 wui5 m4 dong3 zan1 aa3" }
  - id: b2.u02.l4
    title: 真係頂唔住喇
    teach: [g.lo1-obvious, g.maa3-as-you-know]
    vocab: [w.dai2-sei2, w.wut6-goi1, w.gik1-hei3, w.faan4, w.lo1-so1, w.coeng4-hei3, w.aai3, w.naau6-gaau1, w.jan2, w.jan2-noi6, w.jan2-m4-zyu6, w.ding2-m4-zyu6, w.pai1-ping4, w.cing1-zaan3, w.gu2-lai6]
    tip: "嘛 gives the obvious reason, 囉 the obvious conclusion: 佢病咗吖嘛 'he's ill, after all'; 佢病咗，咪唔嚟囉 'he's ill, so he's not coming, obviously'."
    sentences:
      - { es: "佢成日遲到，真係激氣。", en: "He's always late — it's infuriating.", altEs: ["佢成日都遲到，真係好激氣。"], altEn: ["She's late all the time, it drives me mad."], grammar: [g.lo1-obvious], vocab: [w.gik1-hei3] }
      - { es: "好煩呀，個個都要同大佛影相。", en: "It's so annoying — everyone wants a photo with the Buddha.", altEs: ["好煩呀，人人都要同大佛影相。"], grammar: [g.lo1-obvious], vocab: [w.faan4], jp: "hou2 faan4 aa3 go3 go3 dou1 jiu3 tung4 daai6 fat6 jing2 soeng2" }
      - { es: "阿媽好囉唆，叫我帶遮又叫我帶水。", en: "Mum's such a nag — she tells me to bring an umbrella, then water.", altEs: ["我阿媽好囉唆，又叫我帶遮又叫我帶水。"], grammar: [g.lo1-obvious], vocab: [w.lo1-so1] }
      - { es: "個導遊好長氣，一講就講成個鐘。", en: "The guide is so long-winded — once he starts, he talks for a whole hour.", altEs: ["導遊好長氣，一開口就講成個鐘。"], grammar: [g.lo1-obvious], vocab: [w.coeng4-hei3] }
      - { es: "叫你帶水你又唔帶，而家頸渴，抵死囉。", en: "I told you to bring water and you didn't — now you're thirsty, serves you right.", altEs: ["叫你帶水你唔帶，而家頸渴，抵死囉。"], grammar: [g.lo1-obvious], vocab: [w.dai2-sei2] }
      - { es: "佢唔聽人講，迷路都係活該。", en: "He never listens, so getting lost serves him right.", altEs: ["佢唔聽人講，蕩失路都係活該。"], altEn: ["She doesn't listen — if she gets lost, it's her own fault."], grammar: [g.lo1-obvious], vocab: [w.wut6-goi1] }
      - { es: "佢喺樓梯上面嗌我個名。", en: "She shouted my name from the top of the steps.", altEs: ["佢喺樓梯上邊嗌我個名。"], altEn: ["He called my name from the top of the stairs."], grammar: [g.lo1-obvious], vocab: [w.aai3], jp: "keoi5 hai2 lau4 tai1 soeng6 min6 aai3 ngo5 go3 meng2" }
      - { es: "兩個遊客為咗搶位鬧交。", en: "Two tourists got into a row over seats.", altEs: ["兩個遊客為咗爭位鬧交。"], grammar: [g.lo1-obvious], vocab: [w.naau6-gaau1], jp: "loeng5 go3 jau4 haak3 wai6 zo2 coeng2 wai2 naau6 gaau1" }
      - { es: "忍吓啦，就快到喇。", en: "Hang in there, we're nearly there.", altEs: ["忍多陣啦，就快到喇。"], grammar: [g.laa3-change], vocab: [w.jan2], jp: "jan2 haa5 laa1 zau6 faai3 dou3 laa3" }
      - { es: "排隊要有耐性，大家忍耐吓啦。", en: "Queuing takes patience — let's all bear with it.", altEs: ["排隊要有耐性，忍耐吓啦。"], grammar: [g.lo1-obvious], vocab: [w.jan2-noi6], jp: "paai4 deoi2 jiu3 jau5 noi6 sing3 daai6 gaa1 jan2 noi6 haa5 laa1" }
      - { es: "我忍唔住笑咗出嚟。", en: "I couldn't help laughing out loud.", altEs: ["我忍唔住笑咗。"], grammar: [g.lo1-obvious], vocab: [w.jan2-m4-zyu6], transform: { instruction: "Say you managed to hold it in: 忍得住…冇", answer: "我忍得住，冇笑出嚟。", alt: ["我忍住冇笑出嚟。"], en: "I managed to hold it in and didn't laugh." } }
      - { es: "咁熱，我真係頂唔住喇。", en: "It's so hot, I really can't take it any more.", altEs: ["咁熱，我真係頂唔順喇。"], grammar: [g.laa3-change], vocab: [w.ding2-m4-zyu6], error: { wrong: "咁熱，我真係唔頂住喇。", explain: "The potential form puts 唔 between the verb and its complement: 頂唔住, not 唔頂住.", grammar: g.potential-complements } }
      - { es: "唔好成日批評人，要多啲稱讚人。", en: "Don't criticise people all the time — praise them more.", altEs: ["唔好成日批評人，多啲稱讚人啦。"], grammar: [g.lo1-obvious], vocab: [w.pai1-ping4, w.cing1-zaan3] }
      - { es: "老師鼓勵我哋行晒二百六十八級。", en: "The teacher encouraged us to climb all 268 steps.", altEs: ["老師鼓勵我哋行晒成二百六十八級。"], grammar: [g.saai-all], vocab: [w.gu2-lai6] }
      - { es: "佢病咗，所以唔嚟。", en: "He's ill, so he isn't coming.", altEs: ["佢病咗，所以佢唔嚟。"], altEn: ["She's sick, so she's not coming."], grammar: [g.lo1-obvious], vocab: [w.lo1], transform: { instruction: "Say it as an obvious conclusion: replace 所以 with 咪 and end with 囉", answer: "佢病咗，咪唔嚟囉。", alt: ["佢病咗咪唔嚟囉。"], en: "He's ill, so obviously he's not coming." } }
      - { es: "佢哋鬧交，你何必理佢哋呢？", en: "They're quarrelling — why bother getting involved?", altEs: ["佢哋鬧交，你使乜理佢哋呢？"], grammar: [g.maa3-as-you-know], vocab: [w.naau6-gaau1, w.ho4-bit1] }
    exchanges:
      - q: { es: "點解你咁激氣呀？", en: "Why are you so wound up?" }
        a: { es: "佢又遲到吖嘛，等咗佢成個鐘。", en: "He's late again, of course — I waited a whole hour for him." }
        alt: ["佢又遲到囉。", "排隊排到頂唔住吖嘛。"]
        grammar: [g.maa3-as-you-know]
        vocab: [w.gik1-hei3]
      - q: { es: "你頂唔頂得住呀？仲有一百級。", en: "Can you keep going? There are another hundred steps." }
        a: { es: "頂唔住都要頂囉，都嚟咗喇。", en: "Even if I can't, I'll have to — we've come this far." }
        alt: ["頂硬上囉。", "頂唔住喇，休息吓先。"]
        grammar: [g.lo1-obvious]
        vocab: [w.ding2-m4-zyu6, w.ding2]
      - q: { es: "佢又話我行得慢。", en: "He says I'm slow again." }
        a: { es: "佢咁長氣，理得佢囉。", en: "He goes on and on — never mind him." }
        alt: ["由佢講囉。", "唔使理佢。"]
        grammar: [g.lo1-obvious]
        vocab: [w.coeng4-hei3]
      - q: { es: "老師點樣鼓勵你哋？", en: "How did the teacher encourage you?" }
        a: { es: "佢話行到上面就請我哋食雪糕。", en: "She said she'd buy us ice cream if we made it to the top." }
        alt: ["佢話我哋好叻。", "佢稱讚我哋行得快。"]
        grammar: [g.lo1-obvious]
        vocab: [w.gu2-lai6, w.cing1-zaan3]
    texts:
      - title: "行山群組留言"
        es: ["今日好熱，阿峰行到一半就話頂唔住。", "我哋鼓勵佢忍多陣，佢終於行到上去。", "見到大佛嗰陣，佢開心到忍唔住嗌咗出嚟！"]
        en: ["It was really hot today; Fung said he couldn't take it halfway up.", "We encouraged him to hang on a bit longer, and he finally made it to the top.", "When he saw the Buddha, he was so happy he couldn't help shouting out!"]
        grammar: [g.lo1-obvious]
        vocab: [w.ding2-m4-zyu6, w.gu2-lai6, w.jan2-m4-zyu6, w.aai3]
    spicy:
      - { es: "你咁抵死，我都忍唔住笑。", en: "You're so cheeky, I can't help laughing.", altEs: ["你好抵死，我忍唔住笑。"], grammar: [g.lo1-obvious], vocab: [w.dai2-sei2, w.jan2-m4-zyu6] }
      - { es: "你成日稱讚我，我會當真㗎。", en: "If you keep complimenting me, I'll start taking it seriously.", altEs: ["你成日讚我，我會當真㗎。"], grammar: [g.gaa3-explaining], vocab: [w.cing1-zaan3, w.dong3-zan1], jp: "nei5 seng4 jat6 cing1 zaan3 ngo5 ngo5 wui5 dong3 zan1 gaa3" }
      - { es: "我哋鬧完交，不如去食個飯和好囉。", en: "Now that we've finished arguing, let's go for dinner and make up.", altEs: ["鬧完交，不如去食飯和好囉。"], grammar: [g.lo1-obvious], vocab: [w.naau6-gaau1] }
      - { es: "你咁靚仔，我真係頂唔住喇。", en: "You're so handsome, I really can't cope.", altEs: ["你咁靚女，我真係頂唔住喇。"], altEn: ["You're so gorgeous, it's too much for me."], grammar: [g.laa3-change], vocab: [w.ding2-m4-zyu6] }
dialogues:
  - id: b2.u02.d1
    title: 二百六十八級樓梯
    context: Wing and her cousin Fung stand at the foot of the steps up to the Big Buddha at Ngong Ping.
    lines:
      - { speaker: 阿詠, es: "嘩，原來要行咁多級樓梯咩？", en: "Wow, we really have to climb all these steps?" }
      - { speaker: 阿峰, es: "我都話咗有二百六十八級㗎嘛。", en: "I did tell you there are 268 of them." }
      - { speaker: 阿詠, es: "咁熱，我未行已經頂唔住喇。", en: "It's so hot, I can't take it and I haven't even started." }
      - { speaker: 阿峰, es: "頂唔住咪慢慢行囉，大佛又唔會走嘛。", en: "If you can't take it, just walk slowly then — the Buddha isn't going anywhere." }
      - { speaker: 阿詠, es: "你唔好咁長氣啦。有冇水呀？", en: "Stop lecturing me. Have you got any water?" }
      - { speaker: 阿峰, es: "唔通你冇帶水咩？我一早叫你帶㗎嘛。", en: "Don't tell me you didn't bring water? I told you ages ago." }
      - { speaker: 阿詠, es: "唔記得咗囉。你咪分啲畀我囉。", en: "I forgot, so there. Just share some with me, then." }
      - { speaker: 阿峰, es: "抵死！好啦，畀你。行到上面我請你食雪糕。", en: "Serves you right! Fine, here. I'll buy you an ice cream when we get to the top." }
      - { speaker: 阿詠, es: "真㗎？噉我忍耐吓，頂硬上囉！", en: "Really? Then I'll grit my teeth and keep going!" }
    questions:
      - { q: "樓梯有幾多級？", options: ["一百級", "二百六十八級", "三十四級"], answer: 1, explain: "阿峰 says 我都話咗有二百六十八級㗎嘛." }
      - { q: "阿詠點解冇水飲？", options: ["佢唔記得帶", "佢飲晒", "佢唔鍾意飲水"], answer: 0, explain: "She says 唔記得咗囉: she forgot to bring it, even though Fung told her ages ago." }
      - { q: "阿峰話行到上面會點？", options: ["坐纜車落山", "請阿詠食雪糕", "去寶蓮寺食齋"], answer: 1, explain: "行到上面我請你食雪糕: he'll buy her an ice cream at the top." }
      - { q: "最後阿詠決定點做？", options: ["坐巴士返去", "喺下面等", "頂硬上，行上去"], answer: 2, explain: "Her last line, 頂硬上囉, means she'll grit her teeth and climb." }
writing:
  - task: "Your friend is worried about the long wait for the Ngong Ping cable car. Reply that the answer is obvious, using 咪…囉 and 嘛."
    es: "纜車要等成個鐘，點算呀？"
    min: 60
    max: 110
    use: [w.mai6, w.lo1, w.faan2-zing3, w.daai6-fat6, w.sam1-gap1]
    useAtLeast: 3
    grammar: [g.lo1-obvious, g.maa3-as-you-know]
    expect:
