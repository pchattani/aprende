id: b1.u11
title: 去西貢行山
lessons:
  - id: b1.u11.l1
    title: 天氣好嘅話…
    teach: [g.ge-waa-conditional]
    vocab: [w.gaa2-jyu4, w.maan6-jat1, w.jat1-hai6, w.fau2-zak1, w.m4-hai6-zau6, w.ceoi4-si4, w.sai1-gung3, w.gaau1-je5-gung1-jyun2, w.gaau1-ngoi6, w.lou6-sin3, w.lou6-paai4, w.din6-tung2, w.zi1.c, w.mak6-lei5-hou6-ging3, w.daan1-ce1-ging3]
    tip: "嘅話 closes the 'if' clause, which always comes first: 落雨嘅話，我哋就唔去. 萬一 means 'if by any chance'."
    sentences:
      - { es: "天氣好嘅話，我哋去獅子山行山。", en: "If the weather's good, we'll go hiking on Lion Rock.", altEs: ["如果天氣好嘅話，我哋就去獅子山行山。", "天氣好嘅話，我哋就去獅子山行山。"], grammar: [g.ge-waa-conditional], vocab: [] }
      - { es: "如果你攰嘅話，就喺度唞吓啦。", en: "If you're tired, have a rest here.", altEs: ["你攰嘅話，就喺度唞吓啦。", "要係你攰嘅話，就喺度唞吓啦。"], grammar: [g.ge-waa-conditional, g.jyu-gwo-zau], vocab: [] }
      - { es: "萬一行錯路嘅話，記得睇路牌。", en: "If you happen to take the wrong path, remember to check the signs.", altEs: ["萬一行錯路，記得睇路牌。", "萬一行錯路嘅話，記住睇路牌。"], grammar: [g.ge-waa-conditional], vocab: [w.maan6-jat1, w.lou6-paai4] }
      - { es: "假如聽日打風，活動就會取消。", en: "If there's a typhoon tomorrow, the event will be cancelled.", altEs: ["假如聽日打風嘅話，活動就會取消。", "如果聽日打風，活動就會取消。"], grammar: [g.ge-waa-conditional], vocab: [w.gaa2-jyu4] }
      - { es: "夜晚行山要帶支電筒，唔係就睇唔到路。", en: "Bring a torch for night hikes, otherwise you won't be able to see the path.", altEs: ["夜晚行山要帶支電筒，否則睇唔到路。", "夜晚行山要帶電筒，唔係就睇唔到路。"], grammar: [g.ge-waa-conditional], vocab: [w.din6-tung2, w.zi1.c, w.m4-hai6-zau6] }
      - { es: "你一係行麥理浩徑，一係行單車徑，自己揀啦。", en: "Either walk the MacLehose Trail or take the cycle track; you choose.", altEs: ["你一係行麥理浩徑，一係行單車徑，你自己揀啦。"], grammar: [g.ge-waa-conditional], vocab: [w.jat1-hai6, w.mak6-lei5-hou6-ging3, w.daan1-ce1-ging3] }
      - { es: "我哋早啲出發，否則會好熱。", en: "Let's set off early, otherwise it'll be really hot.", altEs: ["我哋早啲出發，唔係就會好熱。", "早啲出發啦，否則會好熱。"], grammar: [g.ge-waa-conditional], vocab: [w.fau2-zak1] }
      - { es: "郊野公園入面，只可以喺燒烤場燒嘢食。", en: "In the country parks, you can only barbecue at the barbecue sites.", altEs: ["喺郊野公園，只可以喺燒烤場燒嘢食。"], grammar: [g.ho-ji-can-may], vocab: [w.gaau1-je5-gung1-jyun2] }
      - { es: "天文台話隨時會落大雨。", en: "The Observatory says it could pour at any moment.", altEs: ["天文台話隨時都會落大雨。"], grammar: [g.reported-speech, g.wui-will], vocab: [w.ceoi4-si4] }
      - { es: "呢條路線好斜，唔夠體力嘅話就唔好行。", en: "This route is very steep; if you're not fit enough, don't do it.", altEs: ["呢條路線好斜，體力唔夠嘅話就唔好行。"], grammar: [g.ge-waa-conditional], vocab: [w.lou6-sin3] }
      - { es: "得閒嘅話，我哋去西貢郊外行吓。", en: "If you're free, let's go for a walk in the Sai Kung countryside.", altEs: ["得閒嘅話，不如去西貢郊外行吓。", "如果得閒嘅話，我哋去西貢郊外行吓啦。"], grammar: [g.ge-waa-conditional], vocab: [w.sai1-gung3, w.gaau1-ngoi6] }
      - { es: "唔想行山嘅話，可以喺海邊等我哋。", en: "If you don't want to hike, you can wait for us by the sea.", altEs: ["如果唔想行山嘅話，可以喺海邊等我哋。"], grammar: [g.ge-waa-conditional], vocab: [] }
      - { es: "跟住路牌行，就唔會迷路。", en: "Follow the signs and you won't get lost.", altEs: ["跟住啲路牌行，就唔會迷路。"], grammar: [g.zau-then], vocab: [w.lou6-paai4] }
      - { es: "落雨嘅話，我哋就改期。", en: "If it rains, we'll postpone.", altEs: ["如果落雨嘅話，我哋就改期。", "落雨就改期。"], grammar: [g.ge-waa-conditional], vocab: [], error: { wrong: "我哋就改期，落雨嘅話。", explain: "The 嘅話 clause comes first, like all conditions in Cantonese: 落雨嘅話，我哋就改期.", grammar: g.ge-waa-conditional } }
      - { es: "天氣好，我哋就去西貢。", en: "The weather's good, so we'll go to Sai Kung.", altEs: ["天氣好，我哋去西貢。"], grammar: [g.ge-waa-conditional], vocab: [w.sai1-gung3], transform: { instruction: "Make the first part a condition with 嘅話", answer: "天氣好嘅話，我哋就去西貢。", alt: ["如果天氣好嘅話，我哋就去西貢。", "天氣好嘅話，我哋去西貢。"], en: "If the weather's good, we'll go to Sai Kung." } }
      - { es: "落大雨嘅話，我哋就坐車落山。", en: "If it pours, we'll take a bus down the hill.", altEs: ["落大雨嘅話，我哋坐車落山。"], grammar: [g.ge-waa-conditional], vocab: [w.maan6-jat1], transform: { instruction: "Make it an unlikely 'in case' condition with 萬一", answer: "萬一落大雨嘅話，我哋就坐車落山。", alt: ["萬一落大雨，我哋就坐車落山。"] } }
    exchanges:
      - q: { es: "聽日去唔去行山？", en: "Are we going hiking tomorrow?" }
        a: { es: "天氣好嘅話就去。", en: "If the weather's good, yes." }
        alt: ["天氣好就去。", "落雨嘅話就唔去。"]
        grammar: [g.ge-waa-conditional]
        vocab: []
      - q: { es: "落雨嘅話點算？", en: "What if it rains?" }
        a: { es: "落雨嘅話，我哋就去睇戲。", en: "If it rains, we'll go to the cinema." }
        alt: ["改期囉。", "落雨就去睇戲。"]
        grammar: [g.ge-waa-conditional]
        vocab: []
      - q: { es: "我哋行邊條路線？", en: "Which route shall we take?" }
        a: { es: "一係行麥理浩徑，一係行單車徑。", en: "Either the MacLehose Trail or the cycle track." }
        alt: ["行麥理浩徑啦。", "你揀啦。"]
        grammar: [g.ge-waa-conditional]
        vocab: [w.lou6-sin3, w.jat1-hai6, w.mak6-lei5-hou6-ging3]
      - q: { es: "使唔使帶電筒？", en: "Do we need to bring a torch?" }
        a: { es: "要呀，夜晚落山嘅話會好黑。", en: "Yes, it'll be very dark if we come down at night." }
        alt: ["要呀。", "唔使，我哋會早啲落山。"]
        grammar: [g.ge-waa-conditional]
        vocab: [w.din6-tung2]
      - q: { es: "幾點出發好？", en: "What time should we set off?" }
        a: { es: "早啲啦，否則好曬。", en: "Early, otherwise the sun will be fierce." }
        alt: ["七點啦。", "早啲出發，唔係就好熱。"]
        grammar: [g.ge-waa-conditional]
        vocab: [w.fau2-zak1]
    texts:
      - title: "行山計劃"
        es: ["星期六天氣好嘅話，我哋去獅子山行山。", "萬一落雨，就改去西貢食海鮮。", "記得帶水同電筒，唔係就麻煩喇。"]
        en: ["If the weather's good on Saturday, we'll hike Lion Rock.", "If by any chance it rains, we'll go to Sai Kung for seafood instead.", "Remember to bring water and a torch, otherwise it'll be a hassle."]
        grammar: [g.ge-waa-conditional]
        vocab: [w.maan6-jat1, w.sai1-gung3, w.din6-tung2, w.m4-hai6-zau6]
      - title: "郊野公園告示"
        es: ["天文台發出暴雨警告嘅話，請盡快離開郊野公園。", "請跟住路牌行。", "有需要嘅話，請打九九九。"]
        en: ["If the Observatory issues a rainstorm warning, please leave the country park as soon as possible.", "Please follow the signs.", "If you need help, please call 999."]
        grammar: [g.ge-waa-conditional]
        vocab: [w.gaau1-je5-gung1-jyun2, w.lou6-paai4]
    spicy:
      - { es: "你攰嘅話，我可以拖住你行落山。", en: "If you're tired, I can hold your hand all the way down.", altEs: ["你攰嘅話，我拖住你行落山啦。"], grammar: [g.ge-waa-conditional], vocab: [] }
      - { es: "萬一迷路嘅話，你跟住我就得，我好識路㗎。", en: "If by any chance you get lost, just follow me; I know the way really well.", altEs: ["萬一迷路，你跟住我就得，我好識路㗎。"], grammar: [g.ge-waa-conditional], vocab: [w.maan6-jat1] }
      - { es: "落雨嘅話，我哋就喺屋企煮飯睇戲，好過行山。", en: "If it rains, we'll stay home, cook and watch a film; better than hiking.", altEs: ["落雨嘅話，我哋留喺屋企煮飯睇戲，好過行山。"], grammar: [g.ge-waa-conditional], vocab: [] }
      - { es: "你一係今晚同我食飯，一係聽晚同我食飯，自己揀。", en: "Either you have dinner with me tonight or tomorrow night; your choice.", altEs: ["一係今晚，一係聽晚，你自己揀邊晚同我食飯。"], grammar: [g.ge-waa-conditional], vocab: [w.jat1-hai6] }
      - { es: "天氣好嘅話去行山；天氣唔好嘅話，去你屋企飲茶？", en: "If the weather's good, we hike; if not, tea at your place?", altEs: ["天氣好就去行山，天氣唔好嘅話，去你屋企飲茶？"], grammar: [g.ge-waa-conditional], vocab: [] }
  - id: b1.u11.l2
    title: 就算落雨我都去
    teach: [g.zau-syun-even-if]
    vocab: [w.zau6-syun3, w.zik1-si2, w.naa5-paa3, w.hoi2-dou2, w.dou2.b, w.hoi2-seoi2, w.long6, w.ciu4-seoi2, w.duk6-muk6-zau1, w.waa4-teng5, w.saai3-taai3-joeng4, w.saai3-soeng1, w.fong4-saai3, w.kiu4-zeoi2-zau1, w.maan6-ji4-seoi2-fu3, w.hoi2-joeng4]
    tip: "就算 + condition, then (subject) 都 + result: 就算落雨，我都去. Don't forget the 都."
    sentences:
      - { es: "就算落雨，我哋都會去橋咀洲。", en: "Even if it rains, we'll still go to Sharp Island.", altEs: ["就算落雨，我哋都去橋咀洲。", "即使落雨，我哋都會去橋咀洲。"], grammar: [g.zau-syun-even-if], vocab: [w.zau6-syun3, w.kiu4-zeoi2-zau1] }
      - { es: "就算好曬，我都想喺沙灘曬太陽。", en: "Even if the sun's fierce, I want to sunbathe on the beach.", altEs: ["就算好曬，我都想去沙灘曬太陽。"], grammar: [g.zau-syun-even-if], vocab: [w.saai3-taai3-joeng4] }
      - { es: "就算有防曬，都會曬傷嘅。", en: "Even with sunscreen, you can still get sunburnt.", altEs: ["就算搽咗防曬，都會曬傷嘅。"], grammar: [g.zau-syun-even-if, g.ge-assertion], vocab: [w.fong4-saai3, w.saai3-soeng1] }
      - { es: "就算唔識游水，都可以玩獨木舟，不過要小心。", en: "Even if you can't swim, you can go kayaking, but be careful.", altEs: ["就算唔識游水，都可以玩獨木舟，但係要小心。"], grammar: [g.zau-syun-even-if], vocab: [w.duk6-muk6-zau1] }
      - { es: "潮水退咗，我哋就可以行去橋咀洲。", en: "Once the tide goes out, we can walk to Sharp Island.", altEs: ["潮水退咗嘅話，我哋就可以行去橋咀洲。"], grammar: [g.ge-waa-conditional], vocab: [w.ciu4-seoi2, w.kiu4-zeoi2-zau1] }
      - { es: "今日啲浪好大，就算你游水好叻，都唔好落水。", en: "The waves are huge today; even if you're a good swimmer, don't go in.", altEs: ["今日啲浪好大，就算你好識游水，都唔好落水。"], grammar: [g.zau-syun-even-if], vocab: [w.long6] }
      - { es: "萬宜水庫嘅石柱好出名。", en: "The rock columns at High Island Reservoir are famous.", altEs: ["萬宜水庫啲石柱好出名。"], grammar: [g.adjective-predicates], vocab: [w.maan6-ji4-seoi2-fu3] }
      - { es: "就算要行三個鐘，我都要去睇萬宜水庫。", en: "Even if it means walking for three hours, I'm going to see High Island Reservoir.", altEs: ["就算要行三個鐘頭，我都要去睇萬宜水庫。"], grammar: [g.zau-syun-even-if], vocab: [w.maan6-ji4-seoi2-fu3] }
      - { es: "即使係夏天，啲海水都好凍。", en: "Even in summer, the seawater is cold.", altEs: ["就算係夏天，啲海水都好凍。"], grammar: [g.zau-syun-even-if], vocab: [w.zik1-si2, w.hoi2-seoi2] }
      - { es: "哪怕只有半日，我都想去海島玩吓。", en: "Even if it's only for half a day, I'd like to go and have fun on an island.", altEs: ["就算只有半日，我都想去海島玩吓。"], grammar: [g.zau-syun-even-if], vocab: [w.naa5-paa3, w.hoi2-dou2] }
      - { es: "我哋划艇去對面個島。", en: "Let's paddle over to the island opposite.", altEs: ["我哋划艇過對面個島啦。"], grammar: [g.serial-verbs], vocab: [w.waa4-teng5, w.dou2.b] }
      - { es: "海洋入面有好多膠樽，好污糟。", en: "There are lots of plastic bottles in the ocean; it's filthy.", altEs: ["海入面有好多膠樽，好污糟。"], grammar: [g.jau-have], vocab: [w.hoi2-joeng4] }
      - { es: "就算畀錢我，我都唔會跳落海。", en: "Even if you paid me, I wouldn't jump into the sea.", altEs: ["就算你畀錢我，我都唔會跳落海。"], grammar: [g.zau-syun-even-if], vocab: [w.zau6-syun3] }
      - { es: "就算好曬，我都要去游水。", en: "Even if the sun's fierce, I'm going swimming.", altEs: ["就算好曬，我都會去游水。"], grammar: [g.zau-syun-even-if], vocab: [w.zau6-syun3], error: { wrong: "就算好曬，我要去游水。", explain: "Don't forget 都 in the second clause: 就算好曬，我都要去游水.", grammar: g.zau-syun-even-if } }
      - { es: "雖然好曬，我都去游水。", en: "Although it's very sunny, I'm going swimming.", altEs: ["雖然好曬，但係我都去游水。"], grammar: [g.zau-syun-even-if, g.seoi-jin-daan-hai], vocab: [w.zau6-syun3], transform: { instruction: "Make it a hypothesis: 'even if it's sunny' (就算)", answer: "就算好曬，我都去游水。", alt: ["就算好曬，我都會去游水。"] } }
      - { es: "佢唔划艇，我哋都去。", en: "He isn't paddling, but we're going anyway.", altEs: ["佢唔去划艇，我哋都去。"], grammar: [g.zau-syun-even-if], vocab: [w.waa4-teng5], transform: { instruction: "Rewrite with 就算…都: 'Even if he doesn't paddle, we'll go.'", answer: "就算佢唔划艇，我哋都去。", alt: ["就算佢唔划艇，我哋都照去。"] } }
    exchanges:
      - q: { es: "落雨你仲去唔去？", en: "Are you still going if it rains?" }
        a: { es: "就算落雨，我都去。", en: "Even if it rains, I'm going." }
        alt: ["去，就算落雨都去。", "落雨就唔去喇。"]
        grammar: [g.zau-syun-even-if]
        vocab: [w.zau6-syun3]
      - q: { es: "你識唔識玩獨木舟？", en: "Can you paddle a kayak?" }
        a: { es: "唔識，不過就算唔識，都想試吓。", en: "No, but even if I can't, I'd like to try." }
        alt: ["識呀。", "唔識，不過想學。"]
        grammar: [g.zau-syun-even-if]
        vocab: [w.duk6-muk6-zau1]
      - q: { es: "幾時可以行去橋咀洲？", en: "When can you walk across to Sharp Island?" }
        a: { es: "潮水退咗嘅話就可以。", en: "When the tide is out." }
        alt: ["潮水退咗先得。", "下晝，潮水退咗嘅時候。"]
        grammar: [g.ge-waa-conditional]
        vocab: [w.ciu4-seoi2, w.kiu4-zeoi2-zau1]
      - q: { es: "要唔要帶防曬？", en: "Should I bring sunscreen?" }
        a: { es: "要呀，就算陰天都會曬傷。", en: "Yes, you can get burnt even when it's cloudy." }
        alt: ["要呀。", "梗係要啦。"]
        grammar: [g.zau-syun-even-if]
        vocab: [w.fong4-saai3, w.saai3-soeng1]
      - q: { es: "你會唔會落水游水？", en: "Are you going in for a swim?" }
        a: { es: "唔會，啲浪太大喇。", en: "No, the waves are too big." }
        alt: ["會呀。", "就算浪大我都會落水。"]
        grammar: [g.wui-will]
        vocab: [w.long6]
    texts:
      - title: "橋咀洲"
        es: ["西貢附近有個海島叫橋咀洲。", "潮水退咗嘅話，可以由沙灘行過去。", "就算係冬天，都有好多人去。"]
        en: ["Near Sai Kung there's an island called Sharp Island.", "When the tide's out, you can walk across from the beach.", "Even in winter, lots of people go."]
        grammar: [g.zau-syun-even-if, g.ge-waa-conditional]
        vocab: [w.hoi2-dou2, w.kiu4-zeoi2-zau1, w.ciu4-seoi2]
    spicy:
      - { es: "就算你曬到好黑，我都覺得你好靚。", en: "Even if you get really tanned, I'll still think you're gorgeous.", altEs: ["就算你曬到好黑，我都覺得你好靚仔。"], grammar: [g.zau-syun-even-if], vocab: [w.zau6-syun3] }
      - { es: "就算啲浪幾大，我都會划艇過嚟搵你。", en: "However big the waves are, I'll paddle over to find you.", altEs: ["就算浪幾大，我都會划艇過嚟搵你。"], grammar: [g.zau-syun-even-if], vocab: [w.long6, w.waa4-teng5] }
      - { es: "就算全世界都話你傻，我都覺得你好可愛。", en: "Even if the whole world says you're silly, I think you're adorable.", altEs: ["就算全世界都話你傻，我都覺得你可愛。"], grammar: [g.zau-syun-even-if], vocab: [w.zau6-syun3] }
      - { es: "哪怕只有一日，我都想同你去海島。", en: "Even if it's just for a day, I want to go to an island with you.", altEs: ["就算只有一日，我都想同你去海島。"], grammar: [g.zau-syun-even-if], vocab: [w.naa5-paa3, w.hoi2-dou2] }
      - { es: "曬傷唔緊要，最緊要你陪我曬太陽。", en: "Getting sunburnt doesn't matter; what matters is you sunbathing with me.", altEs: ["曬傷都唔緊要，最緊要係你陪我曬太陽。"], grammar: [g.zau-syun-even-if], vocab: [w.saai3-soeng1, w.saai3-taai3-joeng4] }
  - id: b1.u11.l3
    title: 可能會落雨
    teach: [g.probability]
    vocab: [w.ho2-nang4-sing3, w.daai6-gei1-wui6, w.tai2-lai4, w.tai2-paa3, w.je5-zyu1, w.wu4-dip2, w.kwan1-cung4, w.zik6-mat6, w.dung6-mat6, w.jip6, w.daai6-zi6-jin4, w.zi6-jin4, w.sing1-hung1, w.cing1-san1, w.fung1-ce1]
    tip: "From sure to unsure: 一定 → 應該 → 可能 / 或者 → 唔一定 → 唔會. In questions, 'or' is 定係, not 或者."
    sentences:
      - { es: "獅子山頂可能有霧，睇唔到景色。", en: "There might be fog on top of Lion Rock, so we won't see the view.", altEs: ["獅子山頂可能會有霧，睇唔到景色。"], grammar: [g.probability], vocab: [] }
      - { es: "今晚應該會落雨，記得帶遮。", en: "It'll probably rain tonight; remember your umbrella.", altEs: ["今晚應該落雨，記住帶遮。"], grammar: [g.probability, g.jing-goi-should], vocab: [] }
      - { es: "阿明一定識路，佢每個禮拜都嚟。", en: "Ming definitely knows the way; he comes every week.", altEs: ["阿明梗係識路啦，佢每個禮拜都嚟。"], grammar: [g.probability], vocab: [] }
      - { es: "呢度大機會見到野豬，唔好行埋去。", en: "You're very likely to see wild boar here; don't go near them.", altEs: ["呢度好大機會見到野豬，唔好行埋去。"], grammar: [g.probability], vocab: [w.daai6-gei1-wui6, w.je5-zyu1] }
      - { es: "睇嚟聽日會好熱。", en: "It looks like it'll be very hot tomorrow.", altEs: ["睇嚟聽日好熱。"], grammar: [g.probability], vocab: [w.tai2-lai4] }
      - { es: "大自然唔一定安全，要小心。", en: "Nature isn't necessarily safe; be careful.", altEs: ["大自然未必安全，要小心。"], grammar: [g.probability], vocab: [w.daai6-zi6-jin4] }
      - { es: "呢隻蝴蝶好靚，可能好少見。", en: "This butterfly is beautiful; it might be quite rare.", altEs: ["呢隻蝴蝶好靚，可能係好少見嘅。"], grammar: [g.probability], vocab: [w.wu4-dip2] }
      - { es: "西貢有好多植物同昆蟲。", en: "Sai Kung has lots of plants and insects.", altEs: ["西貢有好多植物同埋昆蟲。"], grammar: [g.jau-have], vocab: [w.zik6-mat6, w.kwan1-cung4] }
      - { es: "今日落雨嘅可能性好細。", en: "The chance of rain today is very small.", altEs: ["今日落雨嘅機會好細。"], grammar: [g.probability], vocab: [w.ho2-nang4-sing3] }
      - { es: "郊外嘅空氣好清新。", en: "The air in the countryside is very fresh.", altEs: ["郊外啲空氣好清新。"], grammar: [g.adjective-predicates], vocab: [w.cing1-san1] }
      - { es: "好多動物住喺郊野公園入面。", en: "Lots of animals live in the country parks.", altEs: ["郊野公園入面住咗好多動物。"], grammar: [g.hai2-location], vocab: [w.dung6-mat6] }
      - { es: "秋天啲葉會變黃色。", en: "In autumn the leaves turn yellow.", altEs: ["秋天啲樹葉會變黃。"], grammar: [g.wui-will], vocab: [w.jip6] }
      - { es: "風車附近風好大，可能會好凍。", en: "It's very windy near the wind turbine; it might be cold.", altEs: ["風車附近風好大，或者會好凍。"], grammar: [g.probability], vocab: [w.fung1-ce1] }
      - { es: "你想行山定係踩單車？", en: "Do you want to hike or cycle?", altEs: ["你想行山定踩單車？"], grammar: [g.probability, g.a-not-a-questions], vocab: [w.zi6-jin4], error: { wrong: "你想行山或者踩單車？", explain: "In questions, 'or' is 定係, not 或者.", grammar: g.probability } }
      - { es: "聽日會落雨。", en: "It'll rain tomorrow.", altEs: ["聽日落雨。"], grammar: [g.probability], vocab: [], transform: { instruction: "Say it *might* rain (可能)", answer: "聽日可能會落雨。", alt: ["聽日可能落雨。", "可能聽日會落雨。"], en: "It might rain tomorrow." } }
      - { es: "佢哋已經到咗山頂。", en: "They've already reached the top.", altEs: ["佢哋已經上咗山頂。"], grammar: [g.probability], vocab: [], transform: { instruction: "Say they have *probably* got there already (應該)", answer: "佢哋應該已經到咗山頂。", alt: ["佢哋應該到咗山頂。"] } }
    exchanges:
      - q: { es: "聽日會唔會落雨？", en: "Will it rain tomorrow?" }
        a: { es: "天文台話可能會，不過唔一定。", en: "The Observatory says it might, but not necessarily." }
        alt: ["可能會。", "應該唔會。"]
        grammar: [g.probability]
        vocab: []
      - q: { es: "佢會唔會遲到？", en: "Will he be late?" }
        a: { es: "應該唔會，佢好準時嘅。", en: "Probably not; he's very punctual." }
        alt: ["唔會嘅。", "可能會。"]
        grammar: [g.probability, g.ge-assertion]
        vocab: []
      - q: { es: "呢度有冇野豬㗎？", en: "Are there wild boar here?" }
        a: { es: "有，大機會喺垃圾桶附近見到。", en: "Yes, you're very likely to see them near the bins." }
        alt: ["有呀。", "可能有。"]
        grammar: [g.probability]
        vocab: [w.je5-zyu1, w.daai6-gei1-wui6]
      - q: { es: "睇唔睇到星呀？", en: "Can we see the stars?" }
        a: { es: "或者可以，今晚冇乜雲。", en: "Maybe; there aren't many clouds tonight." }
        alt: ["應該睇到。", "睇怕睇唔到。"]
        grammar: [g.probability]
        vocab: [w.sing1-hung1]
      - q: { es: "我哋今日行唔行到山頂？", en: "Will we make it to the top today?" }
        a: { es: "睇怕行唔到，天就快黑喇。", en: "I'm afraid not; it's nearly dark." }
        alt: ["應該行到。", "一定得。"]
        grammar: [g.probability, g.potential-complements]
        vocab: [w.tai2-paa3]
    texts:
      - title: "獅子山"
        es: ["獅子山好似一隻瞓喺度嘅獅子。", "天氣好嘅話，喺山頂可以睇到成個九龍。", "不過今日有霧，睇怕乜都睇唔到。"]
        en: ["Lion Rock looks like a lion lying down.", "If the weather's good, you can see the whole of Kowloon from the top.", "But it's foggy today, so I'm afraid we won't see a thing."]
        grammar: [g.probability, g.ge-waa-conditional]
        vocab: [w.tai2-paa3]
      - title: "大自然"
        es: ["西貢嘅大自然好靚。", "你大機會見到好多蝴蝶同昆蟲。", "可能仲會見到野豬，唔使怕。"]
        en: ["The countryside in Sai Kung is beautiful.", "You're very likely to see lots of butterflies and insects.", "You might even see wild boar; don't be scared."]
        grammar: [g.probability]
        vocab: [w.daai6-zi6-jin4, w.daai6-gei1-wui6, w.wu4-dip2, w.kwan1-cung4, w.je5-zyu1]
    spicy:
      - { es: "睇嚟你今晚好得閒，不如陪我睇星？", en: "Looks like you're free tonight; how about stargazing with me?", altEs: ["睇嚟你今晚得閒，不如陪我睇星吖？"], grammar: [g.probability], vocab: [w.tai2-lai4] }
      - { es: "我大機會鍾意咗你。", en: "Chances are I've fallen for you.", altEs: ["我好大機會鍾意咗你。"], grammar: [g.probability], vocab: [w.daai6-gei1-wui6] }
      - { es: "你可能唔知，我每次行山都係想見你。", en: "You may not know this, but every time I go hiking it's because I want to see you.", altEs: ["你可能唔知，我每次去行山都係想見你。"], grammar: [g.probability], vocab: [] }
      - { es: "天上啲星好靚，不過唔一定靚過你。", en: "The stars are beautiful, but not necessarily more beautiful than you.", altEs: ["天上嘅星好靚，但係唔一定靚過你。"], grammar: [g.probability, g.adj-gwo-comparison], vocab: [w.sing1-hung1] }
      - { es: "或者我哋唔好行山，去食糖水？", en: "Maybe we skip the hike and go for dessert instead?", altEs: ["不如我哋唔好行山，去食糖水？"], grammar: [g.probability], vocab: [] }
  - id: b1.u11.l4
    title: 行山要小心
    teach: [g.ge-waa-conditional, g.probability]
    vocab: [w.zung3-syu2, w.cau1-gan1, w.gap1-gau3, w.kau4-gau3, w.bou2-cung1, w.tai2-lik6, w.paan1-sek6, w.seoi2-tong4, w.jyu4-tong4, w.nung4-tin4, w.gaang1-tin4, w.zung3]
    tip: "Safety talk mixes conditions and probability: 太熱嘅話好易中暑; 佢應該中咗暑."
    sentences:
      - { es: "太熱嘅話好易中暑，要飲多啲水。", en: "If it's too hot you can easily get heatstroke, so drink more water.", altEs: ["太熱嘅話好容易中暑，要飲多啲水。"], grammar: [g.ge-waa-conditional], vocab: [w.zung3-syu2] }
      - { es: "我游水嗰陣隻腳抽筋。", en: "My leg cramped up while I was swimming.", altEs: ["我游水嗰陣隻腳抽咗筋。"], grammar: [g.ge-si-hau], vocab: [w.cau1-gan1] }
      - { es: "識急救嘅話，就可以幫到人。", en: "If you know first aid, you can help people.", altEs: ["識急救嘅話，可以幫到人。"], grammar: [g.ge-waa-conditional], vocab: [w.gap1-gau3] }
      - { es: "萬一有人受傷，要即刻打九九九求救。", en: "If anyone gets hurt, call 999 for help straight away.", altEs: ["萬一有人受傷嘅話，要即刻打九九九求救。"], grammar: [g.ge-waa-conditional], vocab: [w.kau4-gau3] }
      - { es: "行山之前要食飽，補充體力。", en: "Eat well before a hike to keep your energy up.", altEs: ["行山之前食飽啲，補充體力。"], grammar: [g.ji-cin-ji-hau], vocab: [w.bou2-cung1, w.tai2-lik6] }
      - { es: "佢體力好好，行咗六個鐘都唔攰。", en: "She's very fit; she walked for six hours without getting tired.", altEs: ["佢體力好好，行咗六個鐘頭都唔攰。"], altEn: ["He's really fit; he hiked for six hours and wasn't tired."], grammar: [g.duration], vocab: [w.tai2-lik6] }
      - { es: "攀石好危險，冇人教嘅話唔好試。", en: "Rock climbing is dangerous; don't try it without someone to teach you.", altEs: ["攀石好危險，冇人教就唔好試。"], grammar: [g.ge-waa-conditional], vocab: [w.paan1-sek6] }
      - { es: "呢個水塘嘅水好乾淨。", en: "The water in this reservoir is very clean.", altEs: ["呢個水塘啲水好乾淨。"], grammar: [g.adjective-predicates], vocab: [w.seoi2-tong4] }
      - { es: "元朗有好多魚塘同農田。", en: "Yuen Long has lots of fish ponds and farmland.", altEs: ["元朗有好多魚塘同埋農田。"], grammar: [g.jau-have], vocab: [w.jyu4-tong4, w.nung4-tin4] }
      - { es: "我阿爺以前喺新界耕田。", en: "My grandfather used to farm in the New Territories.", altEs: ["我爺爺以前喺新界耕田。"], grammar: [g.story-openers], vocab: [w.gaang1-tin4] }
      - { es: "我哋喺天台種菜。", en: "We grow vegetables on the roof.", altEs: ["我哋喺屋企天台種菜。"], jp: "ngo5 dei6 hai2 tin1 toi4 zung3 coi3", grammar: [g.hai2-location], vocab: [w.zung3] }
      - { es: "你唔夠體力嘅話，可能行唔晒麥理浩徑。", en: "If you're not fit enough, you might not finish the MacLehose Trail.", altEs: ["體力唔夠嘅話，你可能行唔晒麥理浩徑。"], grammar: [g.ge-waa-conditional, g.probability], vocab: [w.tai2-lik6] }
      - { es: "就算你好有經驗，都要帶藥。", en: "Even if you're very experienced, you should bring medicine.", altEs: ["就算你好有經驗，都要帶定藥。"], grammar: [g.zau-syun-even-if], vocab: [w.gap1-gau3] }
      - { es: "佢唔一定識路，你最好帶地圖。", en: "He doesn't necessarily know the way; you'd better bring a map.", altEs: ["佢未必識路，你最好帶地圖。"], grammar: [g.probability, g.zeoi-hou-better], vocab: [], error: { wrong: "唔一定佢識路，你最好帶地圖。", explain: "唔一定 goes before the verb, after the subject: 佢唔一定識路.", grammar: g.probability } }
      - { es: "你好攰，就唞吓啦。", en: "You're tired, so take a break.", altEs: ["你好攰，唞吓啦。"], grammar: [g.ge-waa-conditional], vocab: [], transform: { instruction: "Make the first part a condition with 如果…嘅話", answer: "如果你好攰嘅話，就唞吓啦。", alt: ["你好攰嘅話，就唞吓啦。", "如果你攰嘅話，就唞吓啦。"] } }
      - { es: "佢中咗暑。", jp: "keoi5 zung3 zo2 syu2", en: "He's got heatstroke.", altEs: ["佢中暑。"], altEn: ["She's got heatstroke."], grammar: [g.probability], vocab: [w.zung3-syu2], transform: { instruction: "Say he has *probably* got heatstroke (應該)", answer: "佢應該中咗暑。", alt: ["佢應該中暑。"] } }
    exchanges:
      - q: { es: "你做咩呀？", en: "What's wrong?" }
        a: { es: "我隻腳抽筋，行唔郁。", en: "My leg's cramped and I can't move." }
        alt: ["抽筋呀。", "我隻腳好痛。"]
        grammar: [g.potential-complements]
        vocab: [w.cau1-gan1]
      - q: { es: "你識唔識急救？", en: "Do you know first aid?" }
        a: { es: "識少少，我上個月學過。", en: "A little; I learnt some last month." }
        alt: ["識呀。", "唔識。"]
        grammar: [g.gwo-experiential]
        vocab: [w.gap1-gau3]
      - q: { es: "有人中暑點算？", en: "What do you do if someone gets heatstroke?" }
        a: { es: "帶佢去冇太陽嘅地方，畀啲水佢飲。", en: "Get them out of the sun and give them some water." }
        alt: ["打九九九求救。", "畀水佢飲。"]
        grammar: [g.bei-give]
        vocab: [w.zung3-syu2]
      - q: { es: "你屋企附近有冇農田？", en: "Is there farmland near your home?" }
        a: { es: "有，我阿爺仲有耕田。", en: "Yes, my grandpa still farms." }
        alt: ["冇呀。", "有，仲有魚塘。"]
        grammar: [g.zung-still]
        vocab: [w.nung4-tin4, w.gaang1-tin4]
      - q: { es: "攀石難唔難？", en: "Is rock climbing hard?" }
        a: { es: "好難，要好多體力。", en: "Very hard; you need a lot of strength." }
        alt: ["幾難。", "唔難，好好玩。"]
        grammar: [g.adjective-predicates]
        vocab: [w.paan1-sek6, w.tai2-lik6]
    texts:
      - title: "行山安全"
        es: ["行山之前要睇天氣預報。", "天氣太熱嘅話，好易中暑。", "萬一有人受傷，即刻打九九九求救。"]
        en: ["Check the weather forecast before you hike.", "If it's too hot, it's easy to get heatstroke.", "If anyone gets hurt, call 999 for help at once."]
        grammar: [g.ge-waa-conditional]
        vocab: [w.zung3-syu2, w.kau4-gau3]
    spicy:
      - { es: "我一見到你就好似中咗暑，個頭好熱。", jp: "ngo5 jat1 gin3 dou2 nei5 zau6 hou2 ci5 zung3 zo2 syu2 go3 tau4 hou2 jit6", en: "Every time I see you it's like heatstroke; my head goes all hot.", altEs: ["我見到你就好似中暑咁，個頭好熱。"], grammar: [g.probability], vocab: [w.zung3-syu2] }
      - { es: "你識急救？咁我心跳得咁快，你要唔要幫我睇吓？", en: "You know first aid? Then my heart's racing; want to check it for me?", altEs: ["你識急救呀？我心跳得咁快，你幫我睇吓啦。"], grammar: [g.probability], vocab: [w.gap1-gau3] }
      - { es: "我阿婆話識耕田嘅男仔最好嫁。", en: "My granny says a guy who can farm is the best kind to marry.", altEs: ["我阿婆話識耕田嘅男人最好嫁。"], grammar: [g.reported-speech, g.relative-ge], vocab: [w.gaang1-tin4] }
      - { es: "行到抽筋都唔緊要，你喺山頂等我就得。", en: "I don't care if I get cramp, as long as you're waiting for me at the top.", altEs: ["行到抽筋都唔緊要，只要你喺山頂等我。"], grammar: [g.ge-waa-conditional], vocab: [w.cau1-gan1] }
      - { es: "你笑一笑，我就有晒體力。", en: "One smile from you and I've got all my energy back.", altEs: ["你笑一下，我就有晒體力。"], grammar: [g.zau-then], vocab: [w.tai2-lik6] }
dialogues:
  - id: b1.u11.d1
    title: 行唔行獅子山？
    context: Kayan and Chi-ming are planning a hike up Lion Rock, but the forecast is uncertain.
    lines:
      - { speaker: 嘉欣, es: "聽日天氣好嘅話，我哋去行獅子山好唔好？", en: "If the weather's good tomorrow, shall we hike Lion Rock?" }
      - { speaker: 志明, es: "好呀，不過天文台話可能會落雨。", en: "Sure, but the Observatory says it might rain." }
      - { speaker: 嘉欣, es: "落雨嘅話，我哋就改去西貢食海鮮。", en: "If it rains, we'll go to Sai Kung for seafood instead." }
      - { speaker: 志明, es: "就算落雨，我都想行山。我好耐冇行過喇。", en: "Even if it rains, I want to hike. I haven't been for ages." }
      - { speaker: 嘉欣, es: "你夠唔夠體力呀？上山條路好斜。", en: "Are you fit enough? The path up is very steep." }
      - { speaker: 志明, es: "冇問題，我應該行得到。", en: "No problem, I should be able to make it." }
      - { speaker: 嘉欣, es: "記得帶多啲水，太熱嘅話好易中暑。", en: "Remember to bring plenty of water; if it's too hot it's easy to get heatstroke." }
      - { speaker: 志明, es: "仲要帶支電筒，萬一落山嗰陣天黑咗。", en: "And a torch, in case it gets dark while we're coming down." }
      - { speaker: 嘉欣, es: "好主意。聽朝七點喺黃大仙站等。", en: "Good idea. Let's meet at Wong Tai Sin station at seven tomorrow morning." }
      - { speaker: 志明, es: "七點？咁早！好啦，我一定會到。", en: "Seven? That early! OK, I'll definitely be there." }
    questions:
      - { q: "天文台話聽日點？", options: ["一定好天", "可能會落雨", "會打風"], answer: 1, explain: "天文台話可能會落雨: the Observatory says it might rain." }
      - { q: "落雨嘅話，嘉欣想做乜嘢？", options: ["喺屋企睇戲", "去西貢食海鮮", "照去行山"], answer: 1, explain: "落雨嘅話，我哋就改去西貢食海鮮." }
      - { q: "點解要帶電筒？", options: ["萬一落山嗰陣天黑咗", "山頂冇電", "要影相"], answer: 0, explain: "萬一落山嗰陣天黑咗: in case it gets dark on the way down." }
      - { q: "佢哋幾點喺邊度等？", options: ["七點，黃大仙站", "八點，西貢", "七點，獅子山頂"], answer: 0, explain: "聽朝七點喺黃大仙站等." }
