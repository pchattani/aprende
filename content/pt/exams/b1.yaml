reading:
  text: |
    Há cinco anos, a professora Helena Dias teve uma ideia que muita gente achou estranha: transformar a antiga estação de trem de Tiradentes, em Minas Gerais, numa biblioteca aberta a todos. A estação estava fechada havia décadas, e a prefeitura pensava em vendê-la para uma empresa que queria construir um hotel. “Quando eu soube disso, fiquei triste. Aquele prédio faz parte da memória da cidade”, conta Helena.

    Ela reuniu um grupo de vizinhos e, juntos, começaram a pedir livros usados na internet. Em poucos meses, receberam mais de dez mil livros de todo o Brasil. Os próprios moradores pintaram as paredes, consertaram as janelas e construíram as estantes. A prefeitura acabou desistindo da venda, desde que o grupo cuidasse do prédio.

    Hoje, a biblioteca abre todos os dias, inclusive aos domingos, e não cobra nada de ninguém. Além de emprestar livros, oferece aulas para pessoas mais velhas que querem aprender a ler, oficinas de desenho para crianças e um grupo que se reúne toda quinta-feira para conversar sobre livros. “É importante que as crianças cresçam perto dos livros, mas também é importante que as pessoas que não tiveram essa chance possam ter agora o que não tiveram antes”, diz Helena.

    O projeto ainda tem problemas: falta dinheiro para cuidar do prédio e quase ninguém recebe salário. Mesmo assim, Helena está otimista. “Quem quiser ajudar será sempre bem-vindo. Se cada visitante trouxer um livro, a biblioteca nunca vai parar de crescer.”
  questions:
