id: c1.u10
title: Léxico avanzado
lessons:
  - id: c1.u10.l1
    title: Envejecimiento imparable
    teach: [g.word-formation]
    vocab: [w.imparable, w.sacacorchos, w.abrelatas, w.lavavajillas, w.pelirrojo, w.vejez, w.enriquecer, w.fortalecer, w.debilitar, w.derivar, w.prefijo, w.sufijo, w.raiz, w.lexico, w.termino, w.aislamiento, w.deshacer, w.modernizar, w.traduccion, w.belleza, w.altura, w.creativo, w.bello, w.movimiento]
    tip: "Decode words by their parts: envejec-imiento (verb → noun), imparable (in- + parar + -able), sacacorchos (verb + noun), pelirrojo (noun + adjective). Suffixes make nouns (-ción, -miento, -dad, -ez), adjectives (-able, -oso, -ivo) and verbs (-izar, -ecer, -ificar)."
    sentences:
      - { es: "El envejecimiento de la población es imparable: en 2050 uno de cada tres españoles tendrá más de sesenta y cinco años.", en: "The ageing of the population is unstoppable: in 2050 one in three Spaniards will be over sixty-five.", grammar: [g.word-formation], vocab: [w.envejecimiento, w.poblacion, w.imparable], note: "envejecer → envejecimiento; in- + parar + -able = imparable." }
      - { es: "Necesito un sacacorchos y un abrelatas; en esta cocina solo hay un lavavajillas que no funciona.", en: "I need a corkscrew and a tin opener; in this kitchen there's only a dishwasher that doesn't work.", altEs: ["Necesito un sacacorchos y un abrelatas; en esta cocina solo hay un lavaplatos que no funciona."], grammar: [g.word-formation], vocab: [w.sacacorchos, w.abrelatas, w.lavavajillas, w.cocina], note: "Compounds verb + noun are masculine and invariable in the plural." }
      - { es: "¿De qué verbo deriva «aprendizaje»? De aprender, con el sufijo -aje, como «paisaje» viene de país.", en: "Which verb does 'aprendizaje' derive from? From aprender, with the suffix -aje, as 'paisaje' comes from país.", grammar: [g.word-formation], vocab: [w.derivar, w.aprendizaje, w.sufijo, w.paisaje] }
      - { es: "La raíz «-vej-» da vejez, viejo, envejecer y envejecimiento: cuatro palabras, una sola idea.", en: "The root '-vej-' gives vejez, viejo, envejecer and envejecimiento: four words, one single idea.", grammar: [g.word-formation], vocab: [w.raiz, w.vejez, w.viejo, w.envejecer] }
      - { es: "Mi hermana es pelirroja y mi hermano, pelirrojo; es la única familia pelirroja del pueblo.", en: "My sister is red-haired and my brother is red-haired; it's the only red-haired family in the village.", grammar: [g.word-formation, g.adjective-agreement], vocab: [w.pelirrojo, w.hermano, w.familia], note: "pelo + rojo → pelirrojo, a noun + adjective compound." }
      - { es: "Viajar enriquece; quedarse siempre en casa debilita la curiosidad y fortalece los prejuicios.", en: "Travelling enriches; always staying at home weakens curiosity and strengthens prejudices.", grammar: [g.word-formation], vocab: [w.enriquecer, w.debilitar, w.fortalecer, w.curiosidad, w.prejuicio], note: "en- + rico + -ecer; débil + -itar; fuerte → fortalecer." }
      - { es: "Con el prefijo des- deshacemos lo hecho: deshacer, desconectar, desaparecer.", en: "With the prefix des- we undo what has been done: deshacer, desconectar, desaparecer.", grammar: [g.word-formation], vocab: [w.prefijo, w.deshacer, w.desconectar, w.desaparecer] }
      - { es: "El término «sostenibilidad» no existía hace cuarenta años; hoy aparece en todos los informes.", en: "The term 'sustainability' didn't exist forty years ago; today it appears in every report.", grammar: [g.word-formation, g.quotation], vocab: [w.termino, w.sostenibilidad, w.existir, w.informe], note: "sostenible → sostenibilidad (-dad)." }
      - { es: "Es una persona insoportable pero inteligentísima: in- niega y -ísimo intensifica.", en: "He's an unbearable but extremely intelligent person: in- negates and -ísimo intensifies.", grammar: [g.word-formation], vocab: [w.insoportable, w.inteligente, w.negar] }
      - { es: "El aislamiento de los pueblos pequeños se nota en el léxico: palabras que la ciudad olvidó hace un siglo.", en: "The isolation of small villages shows in the vocabulary: words the city forgot a century ago.", grammar: [g.word-formation], vocab: [w.aislamiento, w.pueblo, w.lexico, w.olvidar], note: "aislar → aislamiento (-miento)." }
      - { es: "De «feliz» sale «felicidad»; de «bello», «belleza»; de «alto», «altura»: tres sufijos para hacer nombres.", en: "From 'feliz' comes 'felicidad'; from 'bello', 'belleza'; from 'alto', 'altura': three suffixes for making nouns.", grammar: [g.word-formation], vocab: [w.sufijo, w.felicidad, w.feliz, w.alto] }
      - { es: "El crecimiento de la ciudad fue imparable.", en: "The growth of the city was unstoppable.", grammar: [g.word-formation], vocab: [w.crecimiento, w.ciudad, w.imparable], error: { wrong: "El crecimiento de la ciudad fue inparable.", explain: "Before p and b the negative prefix is im-, not in-: imparable, imposible, imborrable.", grammar: g.word-formation } }
      - { es: "La población envejece.", en: "The population is ageing.", grammar: [g.word-formation], vocab: [w.poblacion, w.envejecer], transform: { instruction: "Nominalise: turn the verb into a noun with -miento and complete with 'es imparable'", answer: "El envejecimiento de la población es imparable.", alt: ["El envejecimiento de la población resulta imparable."] } }
      - { es: "Realizar, modernizar, organizar: con -izar convertimos casi cualquier nombre o adjetivo en verbo.", en: "Realizar, modernizar, organizar: with -izar we turn almost any noun or adjective into a verb.", grammar: [g.word-formation], vocab: [w.realizar, w.modernizar] }
      - { es: "¡Qué palabra tan larga! «Anticonstitucionalmente» tiene prefijo, raíz y dos sufijos.", en: "What a long word! 'Anticonstitucionalmente' has a prefix, a root and two suffixes.", grammar: [g.word-formation], vocab: [w.palabra, w.prefijo, w.raiz, w.sufijo] }
      - { es: "No digas «un lavavajillas roto»; di «un lavavajillas estropeado», que es lo que decimos en España.", en: "Don't say 'un lavavajillas roto'; say 'un lavavajillas estropeado', which is what we say in Spain.", grammar: [g.word-formation, g.imperative-negative], vocab: [w.lavavajillas] }
    exchanges:
      - q: { es: "¿Qué significa «imparable»?", en: "What does 'imparable' mean?" }
        a: { es: "Que no se puede parar: in- más parar más -able.", en: "That it can't be stopped: in- plus parar plus -able." }
        alt: ["Que nadie lo puede parar."]
        grammar: [g.word-formation]
        vocab: [w.imparable, w.parar]
      - q: { es: "¿Cómo se dice la persona que tiene el pelo rojo?", en: "What do you call a person with red hair?" }
        a: { es: "Pelirroja o pelirrojo: pelo más rojo en una sola palabra.", en: "Pelirroja or pelirrojo: pelo plus rojo in a single word." }
        alt: ["Pelirrojo."]
        grammar: [g.word-formation]
        vocab: [w.pelirrojo, w.pelo, w.rojo]
      - q: { es: "¿De dónde viene «envejecimiento»?", en: "Where does 'envejecimiento' come from?" }
        a: { es: "De envejecer, que a su vez viene de viejo.", en: "From envejecer, which in turn comes from viejo." }
        alt: ["Del verbo envejecer."]
        grammar: [g.word-formation]
        vocab: [w.envejecimiento, w.envejecer, w.a-su-vez]
      - q: { es: "¿Tienes un sacacorchos?", en: "Have you got a corkscrew?" }
        a: { es: "Sí, en el cajón de la izquierda, al lado del abrelatas.", en: "Yes, in the left-hand drawer, next to the tin opener." }
        alt: ["Sí, en el cajón."]
        grammar: [g.word-formation]
        vocab: [w.sacacorchos, w.cajon, w.abrelatas]
    texts:
      - title: "Apunte de clase"
        es: ["Para formar nombres a partir de verbos usamos -ción, -miento y -aje: traducir → traducción, crecer → crecimiento, aprender → aprendizaje.", "Para formar adjetivos: -able, -oso, -ivo: imparable, peligroso, creativo.", "Y para formar verbos: -izar y -ecer: modernizar, envejecer."]
        en: ["To form nouns from verbs we use -ción, -miento and -aje: traducir → traducción, crecer → crecimiento, aprender → aprendizaje.", "To form adjectives: -able, -oso, -ivo: imparable, peligroso, creativo.", "And to form verbs: -izar and -ecer: modernizar, envejecer."]
        grammar: [g.word-formation]
        vocab: [w.sufijo, w.crecimiento, w.aprendizaje, w.imparable, w.envejecer]
  - id: c1.u10.l2
    title: Portazos y codazos
    teach: [g.prefixes-suffixes]
    vocab: [w.codazo, w.punetazo, w.patada, w.docena, w.panadero, w.papelera, w.llavero, w.ecologismo, w.ecologista, w.pesimismo, w.pesimista, w.mirador, w.desconectar, w.ilegal, w.impaciente, w.insoportable, w.releer, w.empujon, w.lloron, w.dormilon, w.manzano, w.cerezo, w.cereza, w.fuerza, w.panaderia, w.cenicero, w.cajon, w.volumen, w.ilogico, w.al-reves]
    tip: "Suffixes carry meaning: -azo is a blow or something big (portazo, cochazo), -ada an action or a group (patada, docena), -ero/-era a trade or a container (panadero, papelera), -ería a shop or a quality (panadería, tontería), -ón a big or abrupt thing or a type of person (empujón, dormilón). des- undoes; in-/im-/i- negates; re- repeats."
    sentences:
      - { es: "Dio un portazo y se fue sin decir nada; dos minutos después volvió y dio otro.", en: "He slammed the door and left without a word; two minutes later he came back and slammed it again.", grammar: [g.prefixes-suffixes], vocab: [w.portazo, w.puerta, w.volver], note: "puerta + -azo = a blow with the door." }
      - { es: "Me dio un codazo para que me callara y, cuando no me callé, una patada por debajo de la mesa.", en: "She elbowed me so I'd shut up and, when I didn't, kicked me under the table.", grammar: [g.prefixes-suffixes], vocab: [w.codazo, w.callar, w.patada, w.mesa] }
      - { es: "Mi hijo es un dormilón: duerme doce horas; mi hija es una llorona: llora por todo.", en: "My son is a sleepyhead: he sleeps twelve hours; my daughter is a cry-baby: she cries about everything.", grammar: [g.prefixes-suffixes], vocab: [w.dormilon, w.dormir, w.lloron, w.llorar], note: "-ón/-ona describes a type of person." }
      - { es: "Hay una papelera al lado de la panadería; el panadero la vacía cada mañana.", en: "There's a bin next to the bakery; the baker empties it every morning.", grammar: [g.prefixes-suffixes], vocab: [w.papelera, w.panaderia, w.panadero], note: "papel + -era (container), pan + -adero (trade), pan + -adería (shop)." }
      - { es: "El manzano da manzanas y el cerezo, cerezas: el árbol es masculino y la fruta, femenina.", en: "The apple tree gives apples and the cherry tree, cherries: the tree is masculine and the fruit, feminine.", grammar: [g.prefixes-suffixes, g.gender-nouns], vocab: [w.manzano, w.manzana, w.cerezo, w.cereza, w.arbol] }
      - { es: "Compra una docena de huevos y, de paso, un llavero nuevo, que el mío se rompió.", en: "Buy a dozen eggs and, while you're at it, a new key ring, because mine broke.", grammar: [g.prefixes-suffixes, g.imperative-tu], vocab: [w.docena, w.huevo, w.llavero, w.romper] }
      - { es: "Un puñetazo en la mesa no es un argumento; un empujón, tampoco.", en: "A punch on the table isn't an argument; a shove isn't either.", grammar: [g.prefixes-suffixes], vocab: [w.punetazo, w.argumento, w.empujon] }
      - { es: "No es lo mismo ser ecologista que votar al ecologismo, igual que no es lo mismo ser pesimista que teorizar sobre el pesimismo.", en: "Being an environmentalist isn't the same as voting for environmentalism, just as being a pessimist isn't the same as theorising about pessimism.", grammar: [g.prefixes-suffixes], vocab: [w.ecologista, w.ecologismo, w.pesimista, w.pesimismo], note: "-ista = the person; -ismo = the doctrine." }
      - { es: "Desde el mirador se ve toda la bahía; sube despacio, que la cuesta es insoportable.", en: "From the viewpoint you can see the whole bay; go up slowly, the slope is unbearable.", grammar: [g.prefixes-suffixes], vocab: [w.mirador, w.insoportable], note: "mirar + -dor = a place for looking." }
      - { es: "Desconecta el móvil, releé el capítulo y, si sigues sin entenderlo, ven a verme.", en: "Switch off your phone, reread the chapter and, if you still don't understand it, come and see me.", grammar: [g.prefixes-suffixes, g.imperative-tu], vocab: [w.desconectar, w.releer, w.capitulo, w.entender], note: "des- undoes (conectar → desconectar); re- repeats (leer → releer)." }
      - { es: "Lo que hace es ilegal, ilógico e irresponsable; y no se lo digo porque sea impaciente.", en: "What he's doing is illegal, illogical and irresponsible; and I'm not saying so because I'm impatient.", grammar: [g.prefixes-suffixes], vocab: [w.ilegal, w.ilogico, w.irresponsable, w.impaciente], note: "in- becomes il- before l, ir- before r, im- before p/b." }
      - { es: "Deja de decir tonterías: eso no es un cochazo, es un coche viejo con la pintura nueva.", en: "Stop talking nonsense: that isn't a flashy car, it's an old car with new paint.", grammar: [g.prefixes-suffixes], vocab: [w.tonteria, w.cochazo, w.coche, w.pintura], note: "coche + -azo = a big, impressive car." }
      - { es: "Dio un portazo y se fue.", en: "He slammed the door and left.", grammar: [g.prefixes-suffixes], vocab: [w.portazo], error: { wrong: "Dio una portaza y se fue.", explain: "The suffix -azo (a blow) is masculine whatever the base noun: la puerta → el portazo, la mano → el manotazo.", grammar: g.prefixes-suffixes } }
      - { es: "Cerró la puerta con mucha fuerza.", en: "He closed the door very hard.", grammar: [g.prefixes-suffixes], vocab: [w.cerrar, w.puerta, w.fuerza], transform: { instruction: "Say it with a noun in -azo", answer: "Dio un portazo.", alt: ["Cerró la puerta de un portazo.", "Pegó un portazo."] } }
      - { es: "¿Deshacer o desconectar? Deshacemos la maleta y desconectamos la tele; nunca al revés.", en: "Deshacer or desconectar? We unpack (undo) the suitcase and disconnect the TV; never the other way round.", grammar: [g.prefixes-suffixes], vocab: [w.deshacer, w.desconectar, w.maleta, w.al-reves] }
      - { es: "El sufijo -ería forma tiendas (panadería, librería) y también defectos (tontería, grosería).", en: "The suffix -ería forms shops (panadería, librería) and also faults (tontería, grosería).", grammar: [g.prefixes-suffixes], vocab: [w.sufijo, w.tienda, w.libreria, w.groseria] }
    exchanges:
      - q: { es: "¿Qué es un portazo?", en: "What is a 'portazo'?" }
        a: { es: "Cerrar la puerta con fuerza: puerta más -azo, un golpe.", en: "Slamming the door: puerta plus -azo, a blow." }
        alt: ["Un golpe de puerta."]
        grammar: [g.prefixes-suffixes]
        vocab: [w.portazo, w.golpe]
      - q: { es: "¿Por qué le llamas dormilón a tu hijo?", en: "Why do you call your son a sleepyhead?" }
        a: { es: "Porque duerme doce horas y aun así bosteza por la mañana.", en: "Because he sleeps twelve hours and still yawns in the morning." }
        alt: ["Porque duerme muchísimo."]
        grammar: [g.prefixes-suffixes]
        vocab: [w.dormilon, w.dormir, w.bostezar]
      - q: { es: "¿Dónde está la papelera?", en: "Where's the bin?" }
        a: { es: "Debajo de la mesa, al lado del cenicero que ya nadie usa.", en: "Under the table, next to the ashtray that nobody uses any more." }
        alt: ["Debajo de la mesa."]
        grammar: [g.prefixes-suffixes]
        vocab: [w.papelera, w.mesa]
      - q: { es: "¿Cuál es la diferencia entre ecologista y ecologismo?", en: "What's the difference between ecologista and ecologismo?" }
        a: { es: "El ecologista es la persona; el ecologismo, el movimiento.", en: "The ecologista is the person; ecologismo is the movement." }
        alt: ["Uno es la persona y el otro la idea."]
        grammar: [g.prefixes-suffixes]
        vocab: [w.ecologista, w.ecologismo, w.movimiento]
    texts:
      - title: "Lista de la compra con sufijos"
        es: ["Una docena de huevos de la granja.", "Pan de la panadería de la esquina, no del supermercado.", "Un llavero para las llaves del garaje y una papelera para el baño.", "Y cerezas, si el cerezo del vecino ya ha dado fruta."]
        en: ["A dozen farm eggs.", "Bread from the corner bakery, not from the supermarket.", "A key ring for the garage keys and a bin for the bathroom.", "And cherries, if the neighbour's cherry tree has borne fruit yet."]
        grammar: [g.prefixes-suffixes]
        vocab: [w.docena, w.panaderia, w.llavero, w.papelera, w.cereza, w.cerezo]
      - title: "Queja de un vecino"
        es: ["Cada noche, a las dos, el del quinto da un portazo que despierta a todo el edificio.", "Luego sube el volumen de la tele y, cuando le pedimos silencio, contesta con grosería.", "Es insoportable e irresponsable; pedimos a la comunidad que tome cartas en el asunto."]
        en: ["Every night, at two, the man on the fifth floor slams a door that wakes up the whole building.", "Then he turns the TV volume up and, when we ask him for silence, he answers rudely.", "It's unbearable and irresponsible; we ask the residents' association to take action."]
        grammar: [g.prefixes-suffixes]
        vocab: [w.portazo, w.volumen, w.groseria, w.insoportable, w.irresponsable, w.tomar-cartas-en-el-asunto]
  - id: c1.u10.l3
    title: Falsos amigos
    teach: [g.false-friends-advanced]
    vocab: [w.avergonzado, w.carpeta, w.alfombra, w.constipado, w.estrenido, w.sensible, w.soportar, w.libreria, w.bibliotecario, w.grabar, w.realizar, w.abusar, w.facultad, w.disgusto, w.embarazoso, w.eventualmente, w.emocionado, w.tela, w.reanudar, w.cuerda, w.conservante, w.preservativo, w.quitar, w.confundir, w.jarron, w.pariente]
    tip: "False friends look English but mean something else: actualmente = currently (not actually), realizar = carry out (not realise), sensible = sensitive (not sensible = sensato), constipado = with a cold, embarazada = pregnant, librería = bookshop, carpeta = folder, éxito = success, discutir = argue, pretender = aim to, soportar = put up with."
    sentences:
      - { es: "Actualmente trabajo en una librería, pero en realidad soy bibliotecario.", en: "Currently I work in a bookshop, but actually I'm a librarian.", grammar: [g.false-friends-advanced], vocab: [w.actualmente, w.libreria, w.en-realidad, w.bibliotecario], note: "actualmente ≠ actually; librería ≠ library (biblioteca)." }
      - { es: "No pretendo ser perfecto; solo intento mejorar, y no finjo lo contrario.", en: "I don't aim to be perfect; I just try to improve, and I don't pretend otherwise.", grammar: [g.false-friends-advanced], vocab: [w.pretender, w.intentar, w.mejorar, w.fingir], note: "pretender = to aim to; to pretend = fingir." }
      - { es: "Estoy constipado, no estreñido: tengo la nariz tapada, nada más.", en: "I have a cold, I'm not constipated: my nose is blocked, that's all.", grammar: [g.false-friends-advanced], vocab: [w.constipado, w.estrenido, w.nariz] }
      - { es: "Mi hermana está embarazada, no avergonzada; de hecho, está emocionadísima.", en: "My sister is pregnant, not embarrassed; in fact, she's over the moon.", grammar: [g.false-friends-advanced], vocab: [w.embarazada, w.avergonzado, w.emocionado], note: "embarazada ≠ embarrassed (avergonzado); emocionado = excited, moved." }
      - { es: "Es una persona muy sensible, pero poco sensata: llora con las películas y luego se gasta el sueldo en lotería.", en: "She's a very sensitive person, but not very sensible: she cries at films and then spends her salary on the lottery.", grammar: [g.false-friends-advanced], vocab: [w.sensible, w.sensato, w.llorar, w.loteria] }
      - { es: "Fue un éxito; la salida está por allí, junto a la carpeta roja que hay sobre la alfombra.", en: "It was a success; the exit is over there, next to the red folder lying on the carpet.", grammar: [g.false-friends-advanced], vocab: [w.exito, w.salida, w.carpeta, w.alfombra], note: "éxito ≠ exit; carpeta ≠ carpet." }
      - { es: "No soporto a mi vecino, pero apoyo su propuesta de pintar la escalera.", en: "I can't stand my neighbour, but I support his proposal to paint the stairwell.", grammar: [g.false-friends-advanced], vocab: [w.soportar, w.apoyar, w.propuesta, w.escalera], note: "soportar = to bear; to support = apoyar." }
      - { es: "Grabamos la conferencia para los que no pudieron asistir; nadie la introdujo con un discurso.", en: "We recorded the lecture for those who couldn't attend; nobody introduced it with a speech.", grammar: [g.false-friends-advanced], vocab: [w.grabar, w.conferencia, w.asistir, w.introducir], note: "grabar = to record; recordar = to remember. asistir = to attend." }
      - { es: "Eventualmente, es decir, de vez en cuando, trabajo en la facultad; al final, o sea, finalmente, me contratarán.", en: "Occasionally, that is, now and then, I work at the faculty; in the end, that is, eventually, they'll hire me.", grammar: [g.false-friends-advanced], vocab: [w.eventualmente, w.de-vez-en-cuando, w.facultad, w.finalmente], note: "eventualmente ≠ eventually (finalmente, al final)." }
      - { es: "Qué disgusto me llevé cuando vi que habían quitado la alfombra del salón; y qué asco daba el suelo.", en: "What an upset I got when I saw they had removed the carpet from the living room; and how disgusting the floor was.", grammar: [g.false-friends-advanced], vocab: [w.disgusto, w.quitar, w.alfombra, w.asco], note: "disgusto = upset; disgust = asco. quitar = to remove, not to quit." }
      - { es: "Es una situación embarazosa: le he pedido conservantes en la farmacia y me han dado preservativos.", en: "It's an embarrassing situation: I asked for preservatives at the chemist's and they gave me condoms.", grammar: [g.false-friends-advanced], vocab: [w.embarazoso, w.conservante, w.farmacia, w.preservativo] }
      - { es: "Realizaron el proyecto en seis meses y solo entonces se dieron cuenta del error.", en: "They carried out the project in six months and only then did they realise the mistake.", grammar: [g.false-friends-advanced], vocab: [w.realizar, w.proyecto, w.darse-cuenta], error: { wrong: "Realizaron el proyecto en seis meses y solo entonces realizaron el error.", explain: "realizar = to carry out; to realise (become aware) is darse cuenta de.", grammar: g.false-friends-advanced } }
      - { es: "Actualmente vivo en Madrid.", en: "Currently I live in Madrid.", grammar: [g.false-friends-advanced], vocab: [w.actualmente, w.vivir], transform: { instruction: "Translate the meaning of 'Actually, I live in Madrid' (correcting a wrong assumption)", answer: "En realidad vivo en Madrid.", alt: ["En realidad, vivo en Madrid.", "De hecho, vivo en Madrid."] } }
      - { es: "La ropa es de tela, no de cuerda; y el vaso no es un jarrón, aunque le pongas flores.", en: "Clothes are made of fabric, not rope; and a glass isn't a vase, even if you put flowers in it.", grammar: [g.false-friends-advanced], vocab: [w.ropa, w.tela, w.cuerda, w.vaso], note: "ropa ≠ rope (cuerda); vaso ≠ vase (jarrón)." }
      - { es: "Después de la huelga se reanudaron las clases; nadie «resumió» nada, porque resumir es otra cosa.", en: "After the strike, classes resumed; nobody 'summarised' anything, because resumir is something else.", grammar: [g.false-friends-advanced, g.quotation], vocab: [w.reanudar, w.resumir, w.huelga, w.clase] }
      - { es: "No abuses de su confianza: molestar no es lo mismo que abusar, pero cansa igual.", en: "Don't take advantage of her trust: bothering isn't the same as abusing, but it's just as tiring.", grammar: [g.false-friends-advanced, g.imperative-negative], vocab: [w.abusar, w.confianza, w.molestar] }
    exchanges:
      - q: { es: "¿Estás constipado?", en: "Have you got a cold?" }
        a: { es: "Sí, llevo tres días con la nariz tapada; nada grave.", en: "Yes, I've had a blocked nose for three days; nothing serious." }
        alt: ["Sí, un poco."]
        grammar: [g.false-friends-advanced]
        vocab: [w.constipado, w.nariz]
      - q: { es: "¿Realizaste el curso al final?", en: "Did you do the course in the end?" }
        a: { es: "Sí, lo realicé en marzo, pero no me di cuenta de lo difícil que era hasta el examen.", en: "Yes, I did it in March, but I didn't realise how hard it was until the exam." }
        alt: ["Sí, en marzo."]
        grammar: [g.false-friends-advanced]
        vocab: [w.realizar, w.darse-cuenta]
      - q: { es: "¿Dónde está la biblioteca?", en: "Where is the library?" }
        a: { es: "¿La biblioteca o la librería? La librería está enfrente; la biblioteca, en la facultad.", en: "The library or the bookshop? The bookshop is opposite; the library is in the faculty." }
        alt: ["En la facultad."]
        grammar: [g.false-friends-advanced]
        vocab: [w.biblioteca, w.libreria, w.facultad]
      - q: { es: "¿Te molesta que fume?", en: "Does it bother you if I smoke?" }
        a: { es: "Un poco, la verdad; soy bastante sensible al humo.", en: "A little, to be honest; I'm quite sensitive to smoke." }
        alt: ["Sí, lo soporto mal."]
        grammar: [g.false-friends-advanced]
        vocab: [w.molestar, w.sensible, w.humo]
    texts:
      - title: "Correo de un estudiante de intercambio"
        es: ["Hola, Carmen, perdona el error de ayer: dije que estaba «embarazado» y quería decir avergonzado.", "Actualmente vivo con una familia muy sensible y sensata, así que aprendo mucho.", "Eventualmente, es decir, a veces, todavía confundo «soportar» con «apoyar».", "Un abrazo desde la librería donde trabajo."]
        en: ["Hi Carmen, sorry about yesterday's mistake: I said I was 'embarazado' and I meant embarrassed.", "Currently I live with a very sensitive and sensible family, so I'm learning a lot.", "Occasionally, that is, sometimes, I still confuse 'soportar' with 'apoyar'.", "A hug from the bookshop where I work."]
        grammar: [g.false-friends-advanced]
        vocab: [w.avergonzado, w.actualmente, w.sensible, w.sensato, w.eventualmente, w.libreria]
      - title: "Aviso en la farmacia"
        es: ["Conservantes y preservativos no son lo mismo; pregunte sin vergüenza.", "Si está constipado, la sección de resfriados está a la derecha.", "Gracias por su confianza."]
        en: ["Preservatives and condoms are not the same thing; ask without embarrassment.", "If you have a cold, the colds section is on the right.", "Thank you for your trust."]
        grammar: [g.false-friends-advanced]
        vocab: [w.conservante, w.preservativo, w.verguenza, w.constipado]
  - id: c1.u10.l4
    title: Repaso C1
    teach: [g.c1-review]
    vocab: [w.desproporcionado, w.a-grandes-rasgos, w.en-ultima-instancia, w.huelga-decir, w.por-descontado, w.a-todas-luces, w.en-el-fondo, w.sea-como-fuere, w.precision, w.preciso, w.bilingue, w.extrapolar, w.distinguir, w.reaccion]
    tip: "At C1 you shade meaning with mood, build long controlled sentences, write cohesive formal texts, handle idioms and pragmatics, and read press and literature critically. These review sentences bring the whole level together."
    sentences:
      - { es: "Si bien el estudio es riguroso, cabe cuestionar que sus conclusiones sean extrapolables, lo cual, dicho sea de paso, reconocen los propios autores.", en: "While the study is rigorous, it is questionable whether its conclusions can be generalised, which, incidentally, the authors themselves acknowledge.", grammar: [g.c1-review, g.subordination-complex, g.subjunctive-nuance], vocab: [w.si-bien, w.riguroso, w.cuestionar, w.extrapolar, w.dicho-sea-de-paso] }
      - { es: "Fuera cual fuera el motivo, la reacción fue a todas luces desproporcionada.", en: "Whatever the reason, the reaction was clearly disproportionate.", grammar: [g.c1-review, g.subjunctive-relative-advanced], vocab: [w.motivo, w.reaccion, w.a-todas-luces, w.desproporcionado] }
      - { es: "Que yo recuerde, nunca se habló de ello; sea como fuere, ahora es tarde para quejarse.", en: "As far as I remember, it was never discussed; be that as it may, it's too late to complain now.", grammar: [g.c1-review, g.future-subjunctive], vocab: [w.recordar, w.sea-como-fuere, w.quejarse], note: "fuere: the future subjunctive survives in set phrases." }
      - { es: "A grandes rasgos, el informe concluye que, de no cambiar la ley, la situación empeorará.", en: "Broadly speaking, the report concludes that, if the law doesn't change, the situation will get worse.", grammar: [g.c1-review, g.absolute-constructions], vocab: [w.a-grandes-rasgos, w.concluir, w.ley, w.empeorar] }
      - { es: "Huelga decir que no solo agradecemos su ayuda, sino que la consideramos imprescindible.", en: "It goes without saying that we not only appreciate your help, but consider it essential.", grammar: [g.c1-review, g.subordination-complex], vocab: [w.huelga-decir, w.agradecer, w.no-solo-sino-tambien, w.imprescindible] }
      - { es: "¿Te importaría, cuando puedas, echarle un vistazo? Por descontado, sin ninguna prisa.", en: "Would you mind, when you get a chance, taking a look at it? Of course, no rush at all.", grammar: [g.c1-review, g.pragmatics], vocab: [w.cuando-puedas, w.echar-un-vistazo, w.por-descontado, w.prisa] }
      - { es: "«Detenido el presunto autor», dice el titular; en el fondo, nadie sabe todavía si es culpable.", en: "'Alleged perpetrator arrested', says the headline; deep down, nobody knows yet whether he is guilty.", grammar: [g.c1-review, g.headlines, g.quotation], vocab: [w.detener, w.presunto, w.titular, w.en-el-fondo, w.culpable] }
      - { es: "Terminada la lectura, el club acordó que, en última instancia, lo que importa de un poema es que te haga sentir algo.", en: "Once the reading was over, the club agreed that, ultimately, what matters about a poem is that it makes you feel something.", grammar: [g.c1-review, g.absolute-constructions, g.subjunctive-nuance], vocab: [w.lectura, w.acordar, w.en-ultima-instancia, w.poema] }
      - { es: "Un hablante bilingüe no es necesariamente preciso: la precisión se aprende leyendo, no naciendo en dos idiomas.", en: "A bilingual speaker isn't necessarily precise: precision is learnt by reading, not by being born into two languages.", grammar: [g.c1-review, g.gerund-uses-advanced], vocab: [w.hablante, w.bilingue, w.preciso, w.precision, w.idioma] }
      - { es: "¡Anda que no has tardado en releer el capítulo! Ni que fuera el Quijote entero.", en: "Well, you took your time rereading the chapter! As if it were the whole of Don Quixote.", grammar: [g.c1-review, g.irony-humor], vocab: [w.anda-que, w.releer, w.capitulo, w.ni-que] }
      - { es: "No es que el periodista mienta, sino que elige las fuentes que confirman su línea editorial.", en: "It's not that the journalist lies; it's that he chooses the sources that confirm his editorial line.", grammar: [g.c1-review, g.subjunctive-nuance, g.journalistic-language], vocab: [w.periodista, w.mentir, w.fuente, w.linea-editorial] }
      - { es: "Es preciso que matices tus palabras; dicho de otro modo, suaviza el tono antes de enviar el correo.", en: "You need to qualify your words; in other words, soften the tone before sending the email.", grammar: [g.c1-review, g.subjunctive-impersonal], vocab: [w.preciso, w.matizar, w.dicho-de-otro-modo, w.suavizar] }
      - { es: "Si bien el estudio es riguroso, sus conclusiones no son extrapolables.", en: "While the study is rigorous, its conclusions cannot be generalised.", grammar: [g.c1-review], vocab: [w.si-bien, w.riguroso, w.extrapolar], error: { wrong: "Si bien el estudio sea riguroso, sus conclusiones no son extrapolables.", explain: "Si bien (= although, conceding a fact) takes the indicative: si bien el estudio es riguroso.", grammar: g.c1-review } }
      - { es: "Cuando terminó la reunión, los ministros se marcharon sin firmar nada.", en: "When the meeting ended, the ministers left without signing anything.", grammar: [g.c1-review], vocab: [w.reunion, w.ministro, w.firmar], transform: { instruction: "Condense into formal written style with an absolute participle clause", answer: "Terminada la reunión, los ministros se marcharon sin firmar nada.", alt: ["Una vez terminada la reunión, los ministros se marcharon sin firmar nada."] } }
      - { es: "A estas alturas del curso, deberías distinguir sin esfuerzo «sensible» de «sensato» y «mas» de «más».", en: "At this stage of the course, you should distinguish effortlessly between 'sensible' and 'sensato' and between 'mas' and 'más'.", grammar: [g.c1-review, g.false-friends-advanced], vocab: [w.a-estas-alturas, w.distinguir, w.esfuerzo, w.sensible, w.sensato, w.mas] }
      - { es: "El Modernismo, a fin de cuentas, buscó la belleza; el periodismo busca la verdad; y el C1, la precisión para hablar de ambas.", en: "Modernismo, at the end of the day, sought beauty; journalism seeks truth; and C1, the precision to talk about both.", grammar: [g.c1-review], vocab: [w.modernismo, w.a-fin-de-cuentas, w.belleza, w.periodismo, w.precision] }
    exchanges:
      - q: { es: "¿Qué te ha parecido el curso, a grandes rasgos?", en: "What did you think of the course, broadly speaking?" }
        a: { es: "Exigente pero útil; en el fondo, lo que más me ha costado ha sido la ironía.", en: "Demanding but useful; deep down, what I found hardest was irony." }
        alt: ["Difícil pero útil."]
        grammar: [g.c1-review]
        vocab: [w.a-grandes-rasgos, w.exigente, w.en-el-fondo, w.ironia]
      - q: { es: "¿Y si no apruebo el examen?", en: "And if I don't pass the exam?" }
        a: { es: "Sea como fuere, lo que has aprendido no se pierde; de no aprobar, lo repites en junio.", en: "Be that as it may, what you've learnt isn't lost; if you don't pass, you retake it in June." }
        alt: ["Lo repites en junio, sin más."]
        grammar: [g.c1-review, g.absolute-constructions]
        vocab: [w.sea-como-fuere, w.aprobar, w.repetir]
      - q: { es: "¿Hace falta ser bilingüe para llegar al C2?", en: "Do you need to be bilingual to reach C2?" }
        a: { es: "Qué va; hace falta leer mucho y tener paciencia. Por descontado, ayuda.", en: "Not at all; you need to read a lot and have patience. Of course, it helps." }
        alt: ["No, pero ayuda."]
        grammar: [g.c1-review, g.pragmatics]
        vocab: [w.bilingue, w.que-va, w.por-descontado]
      - q: { es: "¿Podrías resumir la noticia en una frase?", en: "Could you sum up the news item in one sentence?" }
        a: { es: "Claro: según fuentes judiciales, el alcalde habría desviado fondos públicos; él lo niega.", en: "Sure: according to judicial sources, the mayor allegedly diverted public funds; he denies it." }
        alt: ["El alcalde, acusado de desviar fondos, lo niega."]
        grammar: [g.c1-review, g.journalistic-language]
        vocab: [w.resumir, w.noticia, w.alcalde, w.negar]
    texts:
      - title: "Autoevaluación de fin de nivel"
        es: ["A estas alturas sé elegir entre indicativo y subjuntivo para matizar lo que digo.", "Construyo oraciones largas con correlativos y construcciones absolutas sin perder la concordancia.", "Leo prensa y literatura con sentido crítico: distingo un titular de una entradilla y una metáfora de un símil.", "Huelga decir que todavía me queda camino; sea como fuere, ya no me suena a chino."]
        en: ["At this stage I can choose between indicative and subjunctive to shade what I say.", "I build long sentences with correlatives and absolute constructions without losing agreement.", "I read the press and literature critically: I can tell a headline from a lead and a metaphor from a simile.", "It goes without saying that I still have a way to go; be that as it may, it no longer sounds like Greek to me."]
        grammar: [g.c1-review]
        vocab: [w.a-estas-alturas, w.matizar, w.concordancia, w.entradilla, w.metafora, w.huelga-decir, w.sea-como-fuere]
      - title: "Mensaje de la profesora al grupo"
        es: ["Enhorabuena a todos: habéis terminado el C1.", "Dicho esto, no olvidéis que el léxico se pierde si no se usa; releed, escuchad y, por descontado, hablad.", "Nos vemos en el C2, donde, a todas luces, os espera más literatura."]
        en: ["Congratulations everyone: you've finished C1.", "That said, don't forget that vocabulary is lost if it isn't used; reread, listen and, of course, speak.", "See you at C2, where, clearly, more literature awaits you."]
        grammar: [g.c1-review, g.imperative-vosotros]
        vocab: [w.enhorabuena, w.dicho-esto, w.lexico, w.releer, w.por-descontado, w.a-todas-luces]
dialogues:
  - id: c1.u10.d1
    title: Palabras que engañan
    context: Clara, a Spanish teacher, and Mark, an advanced student, go over the words Mark got wrong in his last essay.
    lines:
      - { speaker: Clara, es: "Mark, a grandes rasgos el ensayo está muy bien, pero hay tres palabras que te han traicionado.", en: "Mark, broadly speaking the essay is very good, but three words have betrayed you." }
      - { speaker: Mark, es: "Déjame adivinar: «actualmente», «realizar» y «sensible».", en: "Let me guess: 'actualmente', 'realizar' and 'sensible'." }
      - { speaker: Clara, es: "Las tres. Escribiste «actualmente, el autor realiza que la sociedad es sensible»; en el fondo querías decir «en realidad, el autor se da cuenta de que la sociedad es sensata».", en: "All three. You wrote 'actualmente, el autor realiza que la sociedad es sensible'; deep down you meant 'actually, the author realises that society is sensible'." }
      - { speaker: Mark, es: "¡Lo que me faltaba! Tres falsos amigos en una sola frase. ¿Y lo del «envejecimiento»?", en: "Just what I needed! Three false friends in one sentence. And the thing about 'envejecimiento'?" }
      - { speaker: Clara, es: "Eso estaba perfecto: de envejecer sacaste envejecimiento, y de parar, imparable. Se nota que entiendes los sufijos.", en: "That was perfect: from envejecer you got envejecimiento, and from parar, imparable. You clearly understand the suffixes." }
      - { speaker: Mark, es: "Es que, a fuerza de leer prensa, se me pegan las palabras largas. Por cierto, ¿«portazo» es un golpe grande o una puerta grande?", en: "The thing is, by dint of reading the press, long words stick to me. By the way, is 'portazo' a big blow or a big door?" }
      - { speaker: Clara, es: "Un golpe: dar un portazo. Si quisieras una puerta grande dirías «un portón», con -ón.", en: "A blow: to slam a door. If you wanted a big door you'd say 'un portón', with -ón." }
      - { speaker: Mark, es: "Entonces, si mi vecino da un portazo cada noche, ¿puedo escribir que es «insoportable e irresponsable»?", en: "So, if my neighbour slams the door every night, can I write that he's 'unbearable and irresponsible'?" }
      - { speaker: Clara, es: "Puedes, y además con los prefijos bien puestos. Sea como fuere, no se lo digas a la cara; con todo el respeto, claro.", en: "You can, and with the prefixes correctly placed too. Be that as it may, don't say it to his face; with all due respect, of course." }
      - { speaker: Mark, es: "Huelga decir que no me atrevería. Dicho esto, ¿apruebo el C1?", en: "It goes without saying I wouldn't dare. That said, do I pass C1?" }
      - { speaker: Clara, es: "A todas luces. Y, en última instancia, no por las palabras difíciles, sino por saber cuándo no usarlas.", en: "Clearly. And, ultimately, not because of the difficult words, but because you know when not to use them." }
