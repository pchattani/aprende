id: r.c2.le-ossa-di-dante
level: c2
title: Le ossa contese di Dante
kind: text
intro: "A newspaper feature on one of the longest quarrels in Italian cultural history: Florence exiled Dante in 1302 and has been trying to get his remains back from Ravenna ever since. A story told with the irony and the long, balanced periods of good Italian journalism (c1.u10), plus a touch of rhetoric (c2.u04)."
allow: [dantedì, dante, ravenna, firenze, fiorentini, ravennati, leone, francescani, morigia, santa, croce, polenta, guido, novello, alighieri, quadrarco, braccioforte, commedia, unesco]
paragraphs:
  - { es: "Ogni anno, a settembre, una delegazione del Comune di Firenze arriva a Ravenna con un dono insolito: una piccola quantità di olio d'oliva prodotto sulle colline toscane. Con quell'olio si alimenta la lampada che arde giorno e notte nella tomba di Dante Alighieri. È un gesto di pace, ma anche, a ben guardare, una specie di ammissione di colpa, che i ravennati accettano con cortesia e con un sorriso appena trattenuto.", en: "Every year, in September, a delegation from the city of Florence arrives in Ravenna with an unusual gift: a small quantity of olive oil produced on the Tuscan hills. That oil feeds the lamp that burns day and night in Dante Alighieri's tomb. It is a gesture of peace but also, if you look closely, a kind of admission of guilt, which the people of Ravenna accept with courtesy and a barely suppressed smile." }
  - { es: "Per capire perché, bisogna tornare indietro di sette secoli. Nel 1302 Dante, che a Firenze era stato uno dei priori, cioè uno dei magistrati più importanti della città, fu condannato all'esilio dalla fazione avversaria, con accuse che gli storici considerano in gran parte pretestuose. Poco dopo la condanna fu aggravata: se fosse tornato, sarebbe stato bruciato vivo. Dante non tornò mai più. Visse per quasi vent'anni ospite di diverse corti dell'Italia del Nord, e proprio in esilio scrisse la «Commedia».", en: "To understand why, you have to go back seven centuries. In 1302 Dante, who had been one of the priors in Florence, that is, one of the city's most important magistrates, was sentenced to exile by the opposing faction, on charges that historians largely consider trumped-up. Soon afterwards the sentence was made harsher: if he came back, he would be burned alive. Dante never went back. For almost twenty years he lived as a guest of various courts in northern Italy, and it was in exile that he wrote the 'Comedy'." }
  - { es: "Gli ultimi anni li trascorse a Ravenna, accolto da Guido Novello da Polenta, signore della città. Qui morì nel settembre del 1321, di ritorno da una missione diplomatica a Venezia, probabilmente per la malaria. Fu sepolto accanto alla chiesa di San Francesco, e i suoi resti avrebbero potuto restare lì in pace, se Firenze non si fosse resa conto, con un certo ritardo, di aver cacciato il suo cittadino più illustre.", en: "He spent his last years in Ravenna, welcomed by Guido Novello da Polenta, lord of the city. He died there in September 1321, on his way back from a diplomatic mission to Venice, probably of malaria. He was buried next to the church of San Francesco, and his remains could have rested there in peace, if Florence had not realised, rather belatedly, that it had driven out its most illustrious citizen." }
  - { es: "Le richieste di restituzione cominciarono già nel Quattrocento e non si sono mai davvero fermate. Il tentativo più serio risale al 1519, quando papa Leone X, che era un fiorentino della famiglia Medici, autorizzò il trasferimento delle ossa a Firenze. La delegazione fiorentina arrivò a Ravenna, aprì il sarcofago e lo trovò vuoto. I frati francescani, che custodivano la tomba, avevano fatto un buco nel muro del convento e avevano nascosto le ossa. Nessuno, per secoli, seppe esattamente dove.", en: "Requests for their return began as early as the fifteenth century and have never really stopped. The most serious attempt dates back to 1519, when Pope Leo X, a Florentine of the Medici family, authorised the transfer of the bones to Florence. The Florentine delegation arrived in Ravenna, opened the sarcophagus and found it empty. The Franciscan friars who looked after the tomb had made a hole in the convent wall and hidden the bones. For centuries nobody knew exactly where." }
  - { es: "Il mistero si risolse per caso nel 1865, mentre si celebravano in tutta Italia i seicento anni dalla nascita del poeta. Durante alcuni lavori di restauro, un operaio trovò in un muro una cassetta di legno con un'iscrizione dei frati del Seicento: dentro c'erano le ossa di Dante. Furono esposte al pubblico per qualche giorno e poi riposte nel sepolcro, quello piccolo e neoclassico che si visita ancora oggi, costruito alla fine del Settecento.", en: "The mystery was solved by chance in 1865, while all Italy was celebrating the six hundredth anniversary of the poet's birth. During some restoration work, a worker found a wooden box in a wall, with an inscription by seventeenth-century friars: inside were Dante's bones. They were put on public display for a few days and then laid back in the tomb – the small neoclassical one you can still visit today, built at the end of the eighteenth century." }
  - { es: "Firenze, intanto, si era consolata a modo suo. Nel 1829 aveva inaugurato nella basilica di Santa Croce un grande monumento funebre in onore del poeta. È un'opera imponente, con statue allegoriche e un'iscrizione solenne; ha un solo difetto, che le guide turistiche non mancano mai di sottolineare: è vuoto. Dante, a Santa Croce, non c'è.", en: "Florence, meanwhile, had consoled itself in its own way. In 1829 it had unveiled a great funerary monument in honour of the poet in the basilica of Santa Croce. It is an imposing work, with allegorical statues and a solemn inscription; it has just one flaw, which tour guides never fail to point out: it is empty. Dante isn't in Santa Croce." }
  - { es: "Oggi la questione è diventata soprattutto un gioco, alimentato a ogni anniversario da qualche politico in cerca di titoli sui giornali. I ravennati rispondono con un argomento difficile da contestare: Dante a Firenze non voleva tornare da morto, dal momento che la città non lo aveva voluto da vivo. C'è chi cita, a questo proposito, i versi del Paradiso in cui il poeta parla con amarezza dell'esilio e del «sale» del pane altrui. Che l'argomento sia storicamente fondato o no, funziona benissimo.", en: "Today the matter has become mostly a game, revived at every anniversary by some politician looking for newspaper headlines. The people of Ravenna reply with an argument that is hard to dispute: Dante did not want to return to Florence dead, since the city had not wanted him alive. Some quote, in this regard, the lines of the Paradiso in which the poet speaks bitterly of exile and of the 'salt' of other people's bread. Whether or not the argument is historically sound, it works very well." }
  - { es: "Nel 2021, settecento anni dopo la morte del poeta, la rivalità si è trasformata quasi in una collaborazione. Le due città hanno organizzato mostre, letture e concerti, e l'anno prima il governo aveva istituito il Dantedì, una giornata nazionale dedicata a Dante che si celebra il 25 marzo, data in cui, secondo molti studiosi, comincerebbe il viaggio della «Commedia». Anche in quell'occasione, però, qualcuno non ha resistito alla tentazione di chiedere, ancora una volta, la restituzione delle ossa.", en: "In 2021, seven hundred years after the poet's death, the rivalry almost turned into a collaboration. The two cities organised exhibitions, readings and concerts, and the year before the government had established Dantedì, a national day dedicated to Dante celebrated on 25 March, the date on which, according to many scholars, the journey of the 'Comedy' begins. Even on that occasion, however, someone could not resist the temptation to ask, once again, for the bones to be returned." }
  - { es: "Intorno alla tomba, a Ravenna, c'è una piccola area chiamata «zona del silenzio», dove i visitatori sono invitati a parlare a bassa voce. È un'idea che piacerebbe, forse, anche al poeta: dopo sette secoli di liti, un po' di silenzio non guasta.", en: "Around the tomb, in Ravenna, there is a small area called the 'zone of silence', where visitors are asked to speak softly. It's an idea the poet himself might perhaps have liked: after seven centuries of quarrels, a little silence does no harm." }
questions:
  - { q: "Perché Firenze manda ogni anno l'olio per la lampada della tomba?", options: ["Per un contratto commerciale con Ravenna", "Come gesto di pace e, in un certo senso, ammissione di colpa per l'esilio di Dante", "Perché a Ravenna non si produce olio"], answer: 1, explain: "«È un gesto di pace, ma anche, a ben guardare, una specie di ammissione di colpa»." }
  - { q: "Che cosa sarebbe successo a Dante se fosse tornato a Firenze dopo la condanna?", options: ["Sarebbe stato messo in prigione per un anno", "Sarebbe stato bruciato vivo", "Avrebbe dovuto pagare una multa"], answer: 1, explain: "«se fosse tornato, sarebbe stato bruciato vivo» – periodo ipotetico of the past, inside a passive." }
  - { q: "Che cosa trovò la delegazione fiorentina nel 1519?", options: ["Le ossa di Dante, che portò a Firenze", "Il sarcofago vuoto: i frati avevano nascosto le ossa", "Una lettera di Dante"], answer: 1, explain: "«aprì il sarcofago e lo trovò vuoto. I frati francescani… avevano nascosto le ossa»." }
  - { q: "Qual è il «solo difetto» del monumento di Santa Croce?", options: ["È troppo piccolo", "È vuoto: Dante non c'è", "Ha un'iscrizione sbagliata"], answer: 1, explain: "«ha un solo difetto…: è vuoto» – the joke depends on the delay of the punchline." }
  - { q: "Che cos'è il Dantedì?", options: ["Una giornata nazionale dedicata a Dante, il 25 marzo", "Il giorno in cui Firenze porta l'olio a Ravenna", "La festa dei frati francescani"], answer: 0, explain: "«il Dantedì, una giornata nazionale dedicata a Dante che si celebra il 25 marzo» – established in 2020." }
  - { q: "Nella frase «Che l'argomento sia storicamente fondato o no, funziona benissimo», perché si usa il congiuntivo «sia»?", options: ["Perché la frase con «che» è soggetto ed è posta prima del verbo principale", "Perché esprime un ordine", "Perché è un periodo ipotetico"], answer: 0, explain: "A che-clause placed first as a subject (here concessive: whether or not…) takes the congiuntivo – c1.u01 il fatto che." }
