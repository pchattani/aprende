id: r.c2.discurso-de-fin-de-curso
level: c2
title: Discurso de fin de curso
kind: text
intro: A speech given by a secondary-school head teacher at the end-of-year ceremony, written for this course. Read it twice; the second time, name the rhetorical devices (tricolon, anaphora, rhetorical question, antithesis, metaphor, call to action) that hold it together.
allow: [bachillerato, septiembre, junio]
paragraphs:
  - { es: "Queridas familias, queridos compañeros y compañeras, queridos alumnos y alumnas: hace seis años entrasteis por esa puerta con una mochila demasiado grande y una pregunta demasiado pequeña: «¿Dónde está mi clase?». Hoy salís por la misma puerta con una pregunta mucho más grande: «¿Y ahora qué?».", en: "Dear families, dear colleagues, dear students: six years ago you came in through that door with a rucksack that was too big and a question that was too small: 'Where is my classroom?'. Today you leave through the same door with a much bigger question: 'And now what?'." }
  - { es: "No voy a responderla por vosotros. Nadie puede. Pero sí voy a deciros tres cosas que habéis aprendido aquí, aunque no aparezcan en ninguna nota: habéis aprendido a dudar, habéis aprendido a escuchar y habéis aprendido a levantaros después de caer.", en: "I am not going to answer it for you. Nobody can. But I am going to tell you three things you have learned here, even though they do not appear in any grade: you have learned to doubt, you have learned to listen and you have learned to get up after falling." }
  - { es: "Habéis aprendido a dudar, porque un examen de historia no sirve para repetir fechas, sino para preguntarse quién las escribió y por qué. Habéis aprendido a escuchar, porque en esta clase había veintisiete acentos, seis lenguas y una sola pizarra. Y habéis aprendido a levantaros, porque algunos de vosotros suspendisteis en junio y aprobasteis en septiembre, y eso vale más que cualquier sobresaliente.", en: "You have learned to doubt, because a history exam is not for repeating dates but for asking who wrote them and why. You have learned to listen, because in this class there were twenty-seven accents, six languages and a single blackboard. And you have learned to get up, because some of you failed in June and passed in September, and that is worth more than any top mark." }
  - { es: "¿Ha sido fácil? No. ¿Ha sido justo siempre? Tampoco. Hubo días en que la calefacción no funcionaba y días en que no funcionábamos nosotros, los profesores. Pero hubo más días de los otros: días en que alguien entendió por fin una ecuación, días en que un poema de Machado dejó la clase en silencio, días en que la risa salía por las ventanas hasta el patio.", en: "Has it been easy? No. Has it always been fair? Not that either. There were days when the heating did not work and days when we, the teachers, did not work. But there were more days of the other kind: days when someone finally understood an equation, days when a poem by Machado left the class in silence, days when laughter poured out of the windows into the courtyard." }
  - { es: "Os van a decir muchas cosas en los próximos años. Os dirán que el mundo es una competición y que solo gana el más rápido. Os dirán que estudiar no sirve para nada y, al día siguiente, que sin un título no sois nadie. Os dirán, sobre todo, lo que tenéis que pensar. No les hagáis caso. Pensad vosotros. Equivocaos vosotros. Corregidlo vosotros.", en: "They are going to tell you many things in the coming years. They will tell you that the world is a competition and that only the fastest wins. They will tell you that studying is useless and, the next day, that without a degree you are nobody. Above all, they will tell you what you have to think. Do not listen to them. Think for yourselves. Make your own mistakes. Correct them yourselves." }
  - { es: "Este instituto no es un edificio: es la suma de todas las personas que han pasado por él. Vosotros ya formáis parte de esa suma. Así que, cuando dentro de veinte años paséis por esta calle con vuestros hijos y señaléis la ventana de vuestra clase, recordad lo que os pido hoy.", en: "This school is not a building: it is the sum of all the people who have passed through it. You are already part of that sum. So when, in twenty years' time, you walk down this street with your children and point to the window of your classroom, remember what I ask of you today." }
  - { es: "Sed curiosos. Sed generosos. Sed valientes. Y, si alguna vez el camino desaparece, acordaos de que se hace camino al andar. Enhorabuena a todos. ¡Y ahora, a la vida!", en: "Be curious. Be generous. Be brave. And if the path ever disappears, remember that the path is made by walking. Congratulations to you all. And now, on to life!" }
questions:
  - { q: "What three things does the head teacher say the students have learned?", options: ["To read, to write and to count", "To doubt, to listen and to get up after falling", "To pass exams, to be punctual and to obey"], answer: 1 }
  - { q: "Which rhetorical device opens the fourth paragraph?", options: ["A metaphor", "A series of rhetorical questions", "A euphemism"], answer: 1 }
  - { q: "What does the speaker warn the students about?", options: ["That people will try to tell them what to think", "That the heating will never work", "That history exams are useless"], answer: 0 }
  - { q: "How does the speech end?", options: ["With a list of grades", "With a call to action in the imperative and a quotation from Machado", "With an apology"], answer: 1 }
glossary:
  - { es: mochila, en: rucksack }
  - { es: pizarra, en: blackboard }
  - { es: sobresaliente, en: top mark (A grade) }
  - { es: calefacción, en: heating }
  - { es: ecuación, en: equation }
  - { es: competición, en: competition }
  - { es: título, en: degree, qualification }
  - { es: señaléis, en: you point to }
  - { es: enhorabuena, en: congratulations }
  - { es: equivocaos, en: make your own mistakes }
  - { es: corregidlo, en: correct it }
