id: r.b2.the-bun-festival
level: b2
title: 長洲太平清醮
kind: text
intro: Every spring, Cheung Chau holds its Bun Festival, with a parade of children who seem to float in the air and a midnight race up a tower of buns. A Cheung Chau resident explains the customs and the history behind them.
paragraphs:
  - { es: "每年農曆四月，長洲都會舉行太平清醮，又叫「包山節」。到咗嗰幾日，成個島人山人海，渡輪班班爆滿，好多人專登由市區入嚟睇熱鬧。我喺長洲出世，由細到大年年都參加，對我嚟講，太平清醮唔單止係一個節日，仲係全島人嘅大事。", en: "Every year in the fourth lunar month, Cheung Chau holds the Tai Ping Ching Chiu, also known as the Bun Festival. On those days the whole island is packed, every ferry is full, and lots of people come over from the city specially to join in the fun. I was born on Cheung Chau and have taken part every year since I was small. For me, the festival isn't just a holiday; it's the biggest event of the year for the whole island." }
  - { es: "太平清醮嘅起源有唔同講法。最普遍嘅講法係：清朝嘅時候，長洲發生瘟疫，好多人病死。居民去北帝廟請北帝出巡，又打醮拜祭，求神保佑。之後瘟疫果然停咗，於是大家每年都舉辦儀式，感謝神明，祈求平安。呢個傳統就一直傳承到今日。", en: "There are different accounts of how the festival began. The most common is this: during the Qing dynasty a plague broke out on Cheung Chau and many people died. The residents asked the god Pak Tai at the Pak Tai Temple to go out in procession, and held Taoist rites to pray for protection. After that the plague did indeed stop, so every year people held a ceremony to thank the gods and pray for peace. The tradition has been passed down to this day." }
  - { es: "醮期嗰幾日，全島居民都會食齋，連麥當勞都會賣素食漢堡。我細個嗰陣最唔鍾意呢樣，因為連魚蛋都冇得食。不過而家我覺得幾有意義，因為大家一齊遵守同一個習俗，好有團結嘅感覺。", en: "During the festival days the whole island eats vegetarian food - even McDonald's sells meat-free burgers. When I was little that was the part I liked least, because you couldn't even get fish balls. But now I find it quite meaningful, because everyone keeps the same custom together, and there's a real feeling of unity." }
  - { es: "最受歡迎嘅活動係飄色巡遊。一班四五歲嘅細路扮成古代人物或者時事人物，企喺高高嘅支架上面，由大人抬住喺街上面巡遊。因為支架藏喺衫入面，遠遠睇過去，啲細路好似飄喺半空噉，所以叫「飄色」。每年啲飄色都會諷刺吓社會上嘅熱門話題，觀眾一睇就笑。", en: "The most popular event is the floating children parade. A group of four- and five-year-olds dress up as figures from history or from current affairs and stand on tall frames, which adults carry through the streets in procession. Because the frames are hidden inside their costumes, from a distance the children seem to be floating in mid-air, which is why it's called \"piu sik\" (floating colours). Every year the floats poke fun at the hot topics of the day, and the audience laughs as soon as they see them." }
  - { es: "壓軸嘅係半夜嘅搶包山比賽。包山係一座十幾米高嘅鐵架，上面掛滿幾千個印住「平安」兩個紅字嘅平安包。參加者要喺三分鐘之內爬上去，搶得越多包，分數越高；越高位嘅包，分數就越多。聽講搶到包嘅人會有好運，所以比賽之後，好多人都想買個平安包返屋企。", en: "The grand finale is the bun-scrambling contest at midnight. The bun tower is an iron frame more than ten metres high, covered in thousands of lucky buns stamped with the two red characters for \"peace\". Competitors have three minutes to climb up; the more buns they grab, the higher their score, and the higher up a bun is, the more points it's worth. People say those who grab buns will have good luck, so after the contest many people want to buy a lucky bun to take home." }
  - { es: "其實搶包山曾經停辦過。一九七八年，因為太多人一齊爬，個竹搭嘅包山冧咗，令到過百人受傷。之後政府禁止咗呢個活動成二十幾年，直到二零零五年先恢復。今日嘅包山改咗用鋼鐵，參加者要預先受訓，仲要綁安全繩，安全得多。", en: "In fact, the bun scramble was once suspended. In 1978, because too many people climbed at once, the bamboo bun tower collapsed and more than a hundred people were injured. Afterwards the government banned the event for over twenty years, and it wasn't revived until 2005. Today's tower is made of steel, competitors must train in advance and wear safety ropes, so it's much safer." }
  - { es: "有人話，太平清醮而家變得太商業化，好多舖頭都賣平安包手信、平安包匙扣，失去咗原本嘅宗教意義。我明白呢種擔心，但係我覺得，只要居民仍然重視呢個節日，願意參與，傳統就唔會消失。每年見到細路企喺飄色上面嘅笑容，我就知道，長洲嘅故事會繼續講落去。", en: "Some people say the festival has become too commercial, with lots of shops selling bun souvenirs and bun keyrings, and that it has lost its original religious meaning. I understand that worry, but I believe that as long as residents still value the festival and are willing to take part, the tradition won't disappear. Every year, when I see the smiles of the children standing on the floats, I know Cheung Chau's story will go on being told." }
questions:
  - { q: "根據最普遍嘅講法，太平清醮係點樣開始嘅？", options: ["清朝長洲有瘟疫，居民求神保佑", "為咗慶祝漁民豐收", "政府想吸引遊客"], answer: 0, explain: "清朝嘅時候，長洲發生瘟疫… 求神保佑. 之後瘟疫果然停咗." }
  - { q: "醮期嗰幾日，長洲居民會點樣？", options: ["食齋", "唔出街", "食好多魚蛋"], answer: 0, explain: "全島居民都會食齋，連麥當勞都會賣素食漢堡." }
  - { q: "點解叫「飄色」？", options: ["因為細路好似飄喺半空", "因為啲衫好多顏色", "因為巡遊喺海上面"], answer: 0, explain: "支架藏喺衫入面…啲細路好似飄喺半空噉." }
  - { q: "搶包山嘅參加者有幾耐時間？", options: ["一分鐘", "三分鐘", "十分鐘"], answer: 1, explain: "參加者要喺三分鐘之內爬上去." }
  - { q: "點解搶包山停辦過二十幾年？", options: ["一九七八年包山冧咗，過百人受傷", "冇人想參加", "平安包太貴"], answer: 0, explain: "一九七八年…個竹搭嘅包山冧咗，令到過百人受傷. It came back in 2005." }
  - { q: "寫呢篇文章嘅人對太平清醮變得商業化有咩睇法？", options: ["佢覺得傳統一定會消失", "只要居民重視同參與，傳統就唔會消失", "佢覺得應該取消"], answer: 1, explain: "只要居民仍然重視呢個節日，願意參與，傳統就唔會消失." }
