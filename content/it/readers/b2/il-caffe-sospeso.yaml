id: r.b2.il-caffe-sospeso
level: b2
title: Il caffè sospeso
kind: text
intro: "A short feature on a Neapolitan tradition – paying for an extra coffee for a stranger. Notice the ways Italian puts words in focus: dislocation (il caffè lo prendo amaro), cleft sentences (è a Napoli che…, è stato lui a…) and focus words (proprio, perfino, persino)."
allow: [napoli, napoletani, napoletano, napoletana, crescenzo, luciano, de, gambrinus, plebiscito, cuccuma]
paragraphs:
  - { es: "Il caffè, a Napoli, non lo si beve: lo si celebra. Lo si prende in piedi, al bancone, in una tazzina così bollente che bisogna tenerla con la punta delle dita. Prima, però, si beve un bicchiere d'acqua, per pulire la bocca e sentire meglio il sapore. E il caffè, quello vero, lo si prende senza fretta, anche se dura soltanto due sorsi.", en: "Coffee in Naples isn't drunk: it's celebrated. You take it standing at the counter, in a cup so hot that you have to hold it with your fingertips. First, though, you drink a glass of water, to clean your mouth and taste it better. And real coffee you drink without hurrying, even if it lasts only two sips." }
  - { es: "Ma è proprio a Napoli che è nata una delle tradizioni più belle legate a questa bevanda: il caffè sospeso. Il funzionamento è semplice. Chi è di buon umore, o ha appena ricevuto una buona notizia, paga due caffè ma ne beve uno solo. L'altro resta «sospeso»: il barista lo segna su un foglietto o se lo ricorda. Quando entra qualcuno che non può permettersi di pagarlo, chiede se ci sia un sospeso, e lo beve gratis.", en: "But it was in Naples, of all places, that one of the loveliest traditions connected with this drink was born: the caffè sospeso, the 'suspended coffee'. The way it works is simple. Someone in a good mood, or who has just had good news, pays for two coffees but only drinks one. The other stays 'suspended': the barman notes it on a slip of paper or remembers it. When someone comes in who can't afford to pay, they ask whether there's a sospeso, and drink it for free." }
  - { es: "Quello che colpisce di questo gesto è il fatto che sia anonimo. Chi paga non sa chi berrà il suo caffè, e chi lo beve non sa chi l'ha pagato. Non c'è nessuno da ringraziare, e quindi nessuno si deve sentire in debito. È questa, forse, la vera eleganza della generosità napoletana: offrire senza umiliare.", en: "What strikes you about this gesture is that it's anonymous. The person paying doesn't know who will drink their coffee, and the person drinking it doesn't know who paid. There's nobody to thank, and so nobody has to feel indebted. This, perhaps, is the true elegance of Neapolitan generosity: giving without humiliating." }
  - { es: "Le origini dell'usanza non sono chiare. C'è chi dice che risalga all'inizio del Novecento, chi invece la colloca nel dopoguerra, quando a Napoli la povertà era enorme e un caffè era, per molti, un lusso. Di certo, a un certo punto, la tradizione stava quasi scomparendo. È stato lo scrittore e filosofo napoletano Luciano De Crescenzo a renderla di nuovo famosa, con un libro intitolato proprio «Il caffè sospeso», pubblicato nel 2008.", en: "The origins of the custom aren't clear. Some say it goes back to the early twentieth century, others place it in the post-war period, when poverty in Naples was enormous and a coffee was a luxury for many. What is certain is that at some point the tradition was almost dying out. It was the Neapolitan writer and philosopher Luciano De Crescenzo who made it famous again, with a book called, precisely, 'Il caffè sospeso', published in 2008." }
  - { es: "Da allora l'idea ha viaggiato lontano. In altre città italiane e persino all'estero sono nati il «pane sospeso», la «pizza sospesa», perfino il «libro sospeso» nelle librerie. In alcuni bar sono comparse lavagnette con il numero dei caffè in attesa. Durante la pandemia, poi, molti hanno ricominciato a lasciare sospesi per chi aveva perso il lavoro.", en: "Since then the idea has travelled far. In other Italian cities and even abroad, the 'suspended bread', the 'suspended pizza', even the 'suspended book' in bookshops have appeared. In some bars little blackboards have sprung up with the number of coffees waiting. During the pandemic, too, many people started leaving sospesi again for those who had lost their jobs." }
  - { es: "Non tutti, è vero, sono entusiasti. Qualche barista ammette che non sempre è facile capire chi abbia davvero bisogno, e c'è chi sospetta che a volte il sospeso finisca per essere bevuto dagli amici del bancone. Ma i napoletani, a queste critiche, rispondono con un'alzata di spalle. Il sospeso, dicono, non è beneficenza organizzata: è un segno di fiducia. E la fiducia, si sa, qualche volta la tradisci, ma se non la dai mai, non vivi.", en: "Not everyone, it's true, is enthusiastic. Some baristas admit that it isn't always easy to tell who really needs it, and some suspect that the sospeso sometimes ends up being drunk by the regulars at the counter. But Neapolitans respond to these criticisms with a shrug. The sospeso, they say, isn't organised charity: it's a sign of trust. And trust, as everyone knows, is sometimes betrayed, but if you never give it, you're not really living." }
  - { es: "La prossima volta che entrate in un bar di Napoli, allora, provate a dirlo anche voi: «Un caffè, e uno sospeso.» Il barista vi guarderà con un mezzo sorriso. È così che, per un attimo, diventerete un po' napoletani anche voi.", en: "So next time you walk into a bar in Naples, try saying it yourself: 'A coffee, and one suspended.' The barman will give you a half-smile. That's how, for a moment, you'll become a little bit Neapolitan too." }
questions:
  - { q: "Perché a Napoli si beve un bicchiere d'acqua prima del caffè?", options: ["Perché il caffè è troppo forte", "Per pulire la bocca e sentire meglio il sapore", "Perché fa caldo"], answer: 1, explain: "«Per pulire la bocca e sentire meglio il sapore.»" }
  - { q: "Come funziona il caffè sospeso?", options: ["Si paga un caffè in più per chi non può permetterselo", "Si beve il caffè più tardi", "Il barista offre un caffè ai clienti abituali"], answer: 0, explain: "You pay for two and drink one; the other waits for someone who can't afford it." }
  - { q: "Che cosa colpisce di più l'autore in questa tradizione?", options: ["Il prezzo basso", "Il fatto che sia anonima", "La velocità"], answer: 1, explain: "Neither giver nor receiver knows the other: «offrire senza umiliare»." }
  - { q: "Chi ha reso di nuovo famosa la tradizione?", options: ["Un barista del centro", "Lo scrittore Luciano De Crescenzo", "Il sindaco di Napoli"], answer: 1, explain: "Cleft sentence: «È stato lo scrittore… Luciano De Crescenzo a renderla di nuovo famosa», with his 2008 book." }
  - { q: "Nella frase «Il caffè, a Napoli, non lo si beve», perché c'è il pronome «lo»?", options: ["È un errore", "Il complemento oggetto, messo all'inizio per enfasi, viene ripreso dal pronome", "Si riferisce a Napoli"], answer: 1, explain: "Left dislocation: the object il caffè is moved to the front for emphasis and repeated with lo." }
