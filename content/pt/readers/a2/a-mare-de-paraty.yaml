id: r.a2.a-mare-de-paraty
level: a2
title: A maré de Paraty
kind: text
intro: Lucas and his girlfriend spend a weekend in Paraty, the colonial town between Rio and São Paulo. Nobody warned them about the sea coming into the streets.
allow: [lucas, bia, paraty, joão, ok]
paragraphs:
  - { es: "No mês passado, eu e a minha namorada, a Bia, fomos passar um fim de semana em Paraty. Paraty é uma cidade pequena e antiga, entre o Rio e São Paulo, com casas brancas, portas e janelas coloridas e ruas de pedra. Nós chegamos na sexta à noite, depois de cinco horas de ônibus, e fomos direto para a pousada.", en: "Last month, my girlfriend Bia and I went to spend a weekend in Paraty. Paraty is a small, old town between Rio and São Paulo, with white houses, colourful doors and windows and stone streets. We arrived on Friday night, after five hours on the bus, and went straight to the guesthouse." }
  - { es: "No sábado, acordamos cedo e saímos para conhecer o centro histórico. Andar nas ruas de Paraty não é fácil: as pedras são grandes e irregulares. A Bia estava de sandália e quase caiu duas vezes. Nós visitamos as igrejas, tomamos um café numa praça e compramos uma garrafa de cachaça para o meu pai.", en: "On Saturday, we woke up early and went out to see the historic centre. Walking on Paraty's streets isn't easy: the stones are big and uneven. Bia was wearing sandals and nearly fell twice. We visited the churches, had a coffee in a square and bought a bottle of cachaça for my father." }
  - { es: "À tarde, fizemos um passeio de barco pelas ilhas. O mar estava calmo e a água era verde e transparente. Nós nadamos, comemos peixe frito numa praia deserta e voltamos para a cidade às seis horas, felizes e muito cansados.", en: "In the afternoon, we took a boat trip around the islands. The sea was calm and the water was green and clear. We swam, ate fried fish on a deserted beach and came back to town at six o'clock, happy and very tired." }
  - { es: "Foi aí que aconteceu a surpresa. Quando nós entramos no centro, a rua estava cheia de água! A água chegava até os nossos pés. A Bia ficou assustada: «Lucas, o que está acontecendo? Choveu?» Mas não tinha chovido. O céu estava azul.", en: "That's when the surprise happened. When we entered the centre, the street was full of water! The water came up to our feet. Bia got scared: 'Lucas, what's happening? Did it rain?' But it hadn't rained. The sky was blue." }
  - { es: "Um senhor que estava sentado na porta de uma loja começou a rir. «Calma, gente! É a maré. Quando a maré sobe, o mar entra nas ruas. Os portugueses construíram a cidade assim, de propósito, para limpar as ruas. Daqui a duas horas, a água vai embora.»", en: "A man who was sitting in the doorway of a shop started to laugh. 'Calm down, folks! It's the tide. When the tide comes in, the sea comes into the streets. The Portuguese built the town like that, on purpose, to clean the streets. In two hours, the water will be gone.'" }
  - { es: "Nós tiramos os sapatos e andamos devagar até a pousada, com a água nos pés e a lua no céu. Foi a melhor parte da viagem. No domingo, quando contamos a história para o dono da pousada, ele disse: «Ah, vocês viram a maré alta? Que sorte! Muitos turistas vêm aqui e nunca veem.»", en: "We took off our shoes and walked slowly to the guesthouse, with water at our feet and the moon in the sky. It was the best part of the trip. On Sunday, when we told the story to the owner of the guesthouse, he said: 'Ah, you saw the high tide? How lucky! Lots of tourists come here and never see it.'" }
questions:
  - { q: "Como são as ruas do centro de Paraty?", options: ["Largas e modernas", "De pedra, com pedras grandes e irregulares", "Cheias de carros"], answer: 1, explain: "Paraty has «ruas de pedra», and «as pedras são grandes e irregulares»." }
  - { q: "O que eles compraram para o pai do Lucas?", options: ["Uma garrafa de cachaça", "Um peixe frito", "Uma sandália"], answer: 0, explain: "«Compramos uma garrafa de cachaça para o meu pai.»" }
  - { q: "Por que a rua estava cheia de água?", options: ["Porque choveu muito", "Por causa da maré alta", "Porque um cano quebrou"], answer: 1, explain: "The man explains: «É a maré. Quando a maré sobe, o mar entra nas ruas.»" }
  - { q: "Segundo o senhor, por que os portugueses construíram a cidade assim?", options: ["Para proteger a cidade", "Para limpar as ruas", "Para os barcos entrarem"], answer: 1, explain: "«Os portugueses construíram a cidade assim, de propósito, para limpar as ruas.»" }
  - { q: "O que o dono da pousada achou da história?", options: ["Que eles tiveram sorte", "Que eles chegaram tarde", "Que a história não era verdade"], answer: 0, explain: "He says «Que sorte! Muitos turistas vêm aqui e nunca veem.»" }
