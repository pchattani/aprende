level: c2
title: Level check C2
passScore: 0.8
reading:
  text: |
    Hay quien cree que dominar una lengua es hablarla sin acento. Los que la enseñamos sabemos que es otra cosa: es poder cambiar de registro sin que se note el esfuerzo. El mismo hablante que por la mañana redacta un informe en el que «no se observaron diferencias significativas» tiene que poder, por la tarde, decirle a un amigo que la reunión «fue un rollo» y, por la noche, leer a Quevedo sin que un «díjole» lo detenga. Ninguna de esas tres destrezas vale sin las otras dos.

    El español, además, no es una lengua, sino muchas. Un madrileño que «coge» el autobús provoca risas en Buenos Aires; un mexicano que promete algo «ahorita» desconcierta a un sevillano; un chileno que termina cada frase con «po» parece, a oídos ajenos, estar siempre de acuerdo. Nada de esto es incorrecto. Es, simplemente, variación, y el hablante maduro la reconoce, la calibra y, cuando hace falta, la evita.

    También cambia la lengua en el tiempo. «Vuestra merced» se convirtió en «usted»; el futuro de subjuntivo, que Cervantes usaba a diario, sobrevive solo en las leyes y en algún refrán. Leer el Siglo de Oro no exige un diccionario distinto, sino paciencia con los pronombres pegados al verbo y con la sintaxis invertida de los poetas. Quien supera esa barrera descubre que el castellano de 1605 se lee con sorprendente facilidad.

    Queda, por último, el humor: el calambur, la dilogía, el chiste malo que solo funciona porque «nada» es a la vez verbo y pronombre. Entender un juego de palabras en una lengua extranjera es la prueba más fiable de que esa lengua ha dejado de ser extranjera. Por eso, cuando un alumno se ríe en el remate y no antes, sé que el curso ha terminado y que ya no me necesita.
  questions:
    - { q: "According to the author, what does mastering a language really mean?", options: ["Speaking without an accent", "Being able to switch register without visible effort", "Knowing a lot of vocabulary"], answer: 1 }
    - { q: "Why does the author mention the Madrid speaker who 'coge' the bus?", options: ["To show a grammatical mistake", "To illustrate regional variation that is not incorrect", "To criticise Argentine Spanish"], answer: 1 }
    - { q: "What does the text say about the future subjunctive?", options: ["It is used daily in modern Spanish", "It survives only in laws and some proverbs", "Cervantes never used it"], answer: 1 }
    - { q: "What is needed to read Golden Age literature, according to the author?", options: ["A different dictionary", "Patience with enclitic pronouns and inverted syntax", "A translation into modern Spanish"], answer: 1 }
    - { q: "What is the most reliable sign that a language has stopped being foreign?", options: ["Understanding wordplay and laughing at the punchline", "Passing an official exam", "Writing a scientific report"], answer: 0 }
