      - { es: "Les bénéfices de notre relation dépassant largement les pertes, je propose de signer pour un an de plus.", en: "The profits of our relationship far outweighing the losses, I propose we sign for another year.", altEs: ["Comme les bénéfices de notre relation dépassent largement les pertes, je propose de signer pour un an de plus."], grammar: [g.participe-present], vocab: [w.bénéfice, w.perte, w.relation] }
      - { es: "Il dort avec une chouette en peluche, mais à part ça, c'est un homme très sérieux.", en: "He sleeps with a soft-toy owl, but apart from that, he's a very serious man.", altEs: ["Il dort avec une chouette en peluche ; à part ça, c'est un homme très sérieux."], grammar: [g.c-est-il-est], vocab: [w.peluche, w.sérieux] }
dialogues:
  - id: b2.u07.d1
    title: Sur le parcours de la chouette
    context: Emma and Lucas join a guided walk along the owl trail in Dijon. The guide speaks in the polished style of a tour, full of participles.
    lines:
      - { speaker: Guide, es: "Bienvenue à Dijon ! Notre parcours, comptant vingt-deux étapes, commence ici, devant le palais des ducs.", en: "Welcome to Dijon! Our trail, with twenty-two stops, begins here, in front of the Palace of the Dukes." }
      - { speaker: Emma, es: "Le palais est immense ! Il a été construit quand ?", en: "The palace is huge! When was it built?" }
      - { speaker: Guide, es: "Commencé au Moyen Âge, agrandi au XVIIe siècle, il abrite aujourd'hui la mairie et un musée.", en: "Begun in the Middle Ages and enlarged in the 17th century, it now houses the town hall and a museum." }
      - { speaker: Lucas, es: "Et les ducs, ils vivaient tous ici ?", en: "And the dukes, did they all live here?" }
      - { speaker: Guide, es: "Oui. Voulant rivaliser avec le roi de France, ils ont fait de Dijon une capitale prestigieuse.", en: "Yes. Wanting to rival the King of France, they made Dijon a prestigious capital." }
      - { speaker: Emma, es: "Et la fameuse chouette, elle est loin ?", en: "And the famous owl, is it far?" }
      - { speaker: Guide, es: "Non, sur le mur de l'église Notre-Dame. Les visiteurs souhaitant avoir de la chance la caressent de la main gauche.", en: "No, on the wall of Notre-Dame church. Visitors wishing for luck stroke it with their left hand." }
      - { speaker: Lucas, es: "Moi, n'étant pas superstitieux, je vais juste la prendre en photo.", en: "Not being superstitious, I'm just going to take a photo of it." }
      - { speaker: Emma, es: "Tu dis ça, mais tu as caressé trois fois le chat de l'hôtel ce matin !", en: "You say that, but you stroked the hotel cat three times this morning!" }
      - { speaker: Guide, es: "La visite terminée, je vous conseille de goûter le pain d'épices. C'est fatigant, la culture !", en: "Once the tour is over, I recommend you try the gingerbread. Culture is tiring!" }
    questions:
      - { q: "Combien d'étapes compte le parcours ?", options: ["Douze", "Vingt-deux", "Quarante-deux"], answer: 1, explain: "The guide says the trail has vingt-deux étapes." }
      - { q: "Qu'est-ce que le palais des ducs abrite aujourd'hui ?", options: ["Un hôtel et un restaurant", "La mairie et un musée", "Une moutarderie"], answer: 1, explain: "Il abrite aujourd'hui la mairie et un musée." }
      - { q: "Pourquoi les ducs ont-ils fait de Dijon une capitale prestigieuse ?", options: ["Ils voulaient rivaliser avec le roi de France.", "Ils voulaient vendre de la moutarde.", "Le roi le leur avait demandé."], answer: 0, explain: "Voulant rivaliser avec le roi de France: they wanted to rival him." }
      - { q: "Que va faire Lucas devant la chouette ?", options: ["La caresser de la main gauche", "La prendre en photo", "Faire un vœu"], answer: 1, explain: "N'étant pas superstitieux, he's just going to take a photo — though Emma teases him." }
