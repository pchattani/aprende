id: r.a2.fin-de-semana-en-barcelona
level: a2
title: Un fin de semana en Barcelona
kind: text
intro: Laura writes on her blog about a weekend trip with her friend Nora.
allow: [barcelona, nora, laura, gaudí, blog, mediterráneo, catalán, sagrada, familia, barceloneta]
paragraphs:
  - { es: "El viernes pasado Nora y yo fuimos a Barcelona en tren. Salimos de Madrid a las siete de la mañana y llegamos a las diez. El viaje fue rápido y cómodo, y dormimos casi todo el camino.", en: "Last Friday Nora and I went to Barcelona by train. We left Madrid at seven in the morning and arrived at ten. The journey was quick and comfortable, and we slept almost the whole way." }
  - { es: "Primero dejamos las maletas en el albergue, que estaba en el centro, cerca de la plaza. Después dimos una vuelta por el barrio antiguo y comimos en un restaurante pequeño. Yo pedí pescado y Nora tomó una ensalada enorme.", en: "First we left our suitcases at the hostel, which was in the centre, near the square. Then we went for a walk around the old quarter and ate in a small restaurant. I ordered fish and Nora had an enormous salad." }
  - { es: "Por la tarde visitamos la Sagrada Familia. Hicimos cola casi una hora, pero valió la pena: el edificio es impresionante. Mientras esperábamos, conocimos a dos chicas argentinas que también viajaban solas.", en: "In the afternoon we visited the Sagrada Familia. We queued almost an hour, but it was worth it: the building is impressive. While we were waiting, we met two Argentinian girls who were also travelling on their own." }
  - { es: "El sábado hacía muy buen tiempo, así que fuimos a la playa de la Barceloneta. Nos bañamos en el Mediterráneo, tomamos el sol y jugamos a las cartas. Por la noche cenamos con las argentinas y lo pasamos genial.", en: "On Saturday the weather was lovely, so we went to Barceloneta beach. We swam in the Mediterranean, sunbathed and played cards. In the evening we had dinner with the Argentinian girls and had a great time." }
  - { es: "El domingo por la mañana estaba lloviendo, pero no nos importó: visitamos un museo y compramos algunos regalos para la familia. A las seis cogimos el tren de vuelta, cansadas pero muy contentas.", en: "On Sunday morning it was raining, but we didn't mind: we visited a museum and bought some presents for the family. At six we caught the train back, tired but very happy." }
  - { es: "Fue un fin de semana corto pero inolvidable. Ya estamos pensando en el próximo viaje: ¿Valencia o Sevilla? Vosotros, ¿qué me recomendáis?", en: "It was a short but unforgettable weekend. We're already thinking about the next trip: Valencia or Seville? What do you recommend?" }
questions:
  - { q: "How did Laura and Nora travel to Barcelona?", options: ["By plane", "By train", "By car"], answer: 1 }
  - { q: "Why was the queue at the Sagrada Familia worth it?", options: ["It was short", "The building is impressive", "It was free"], answer: 1 }
  - { q: "What did they do on Sunday morning?", options: ["Went to the beach", "Visited a museum and bought presents", "Slept in the hostel"], answer: 1 }
glossary:
  - { es: casi, en: almost }
  - { es: edificio, en: building }
  - { es: no nos importó, en: we didn't mind }
  - { es: de vuelta, en: back (return) }
