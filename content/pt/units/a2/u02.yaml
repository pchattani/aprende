id: a2.u02
title: Biografias
lessons:
  - id: a2.u02.l1
    title: Ele fez sucesso
    teach: [g.preterite-irregular]
    vocab: [w.vida, w.carreira, w.sucesso, w.fama, w.obra, w.canção, w.disco, w.escritor, w.cantor, w.compositor, w.pintor, w.artista, w.poeta, w.publicar, w.gravar, w.lançar]
    tip: "Learn the eu / ele pairs together: tive / teve, fiz / fez, estive / esteve, pude / pôde. Disse, quis, soube and trouxe are the same for eu and ele."
    sentences:
      - { es: "Tom Jobim fez muito sucesso com a canção “Garota de Ipanema”.", en: "Tom Jobim had great success with the song “The Girl from Ipanema”.", altEs: ["Tom Jobim fez muito sucesso com a música “Garota de Ipanema”."], altEn: ["Tom Jobim was a big hit with the song “The Girl from Ipanema”."], grammar: [g.preterite-irregular], vocab: [w.sucesso, w.canção, w.fazer] }
      - { es: "Ele escreveu a canção com o poeta Vinicius de Moraes.", en: "He wrote the song with the poet Vinicius de Moraes.", altEs: ["Ele escreveu a música com o poeta Vinicius de Moraes."], grammar: [g.preterite-regular], vocab: [w.escrever, w.poeta, w.canção] }
      - { es: "Machado de Assis publicou muitos livros e teve uma carreira longa.", en: "Machado de Assis published many books and had a long career.", altEs: ["Machado de Assis publicou vários livros e teve uma carreira longa."], grammar: [g.preterite-irregular, g.preterite-regular], vocab: [w.publicar, w.carreira, w.ter] }
      - { es: "A cantora gravou o primeiro disco aos dezoito anos.", en: "The singer recorded her first album at eighteen.", altEs: ["A cantora gravou o seu primeiro disco aos dezoito anos.", "A cantora gravou o primeiro disco com dezoito anos."], altEn: ["The singer recorded her first record at the age of eighteen."], grammar: [g.preterite-regular], vocab: [w.gravar, w.disco, w.cantor] }
      - { es: "O que você fez no fim de semana?", en: "What did you do at the weekend?", altEs: ["Que você fez no fim de semana?", "O que é que você fez no fim de semana?"], grammar: [g.preterite-irregular, g.question-words], vocab: [w.fazer, w.fim-de-semana], transform: { instruction: "Ask several people (vocês)", answer: "O que vocês fizeram no fim de semana?", alt: ["Que vocês fizeram no fim de semana?"], en: "What did you (all) do at the weekend?" } }
      - { es: "Não fiz nada: estive em casa o dia todo.", en: "I didn't do anything: I was at home all day.", altEs: ["Eu não fiz nada: estive em casa o dia todo.", "Não fiz nada, estive em casa o dia inteiro."], altEn: ["I did nothing: I was at home all day."], grammar: [g.preterite-irregular, g.negation], vocab: [w.fazer, w.estar], error: { wrong: "Não fez nada: estive em casa o dia todo.", explain: "eu fiz, ele fez: with eu the form is fiz.", grammar: g.preterite-irregular } }
      - { es: "Ela teve uma vida difícil, mas deixou uma obra enorme.", en: "She had a hard life, but she left a huge body of work.", altEs: ["Ela teve uma vida difícil, mas deixou uma obra imensa."], grammar: [g.preterite-irregular], vocab: [w.vida, w.obra, w.deixar] }
      - { es: "A fama chegou cedo para Carmen Miranda.", en: "Fame came early for Carmen Miranda.", altEs: ["Para Carmen Miranda, a fama chegou cedo."], grammar: [g.preterite-regular], vocab: [w.fama, w.chegar], note: "Carmen Miranda (1909–1955), born in Portugal and raised in Rio, became a Hollywood star." }
      - { es: "O pintor não pôde terminar o quadro.", en: "The painter couldn't finish the painting.", altEs: ["O pintor não conseguiu terminar o quadro."], grammar: [g.preterite-irregular, g.negation], vocab: [w.pintor, w.quadro, w.poder], note: "pôde (past) has a circumflex; pode (present) does not.", transform: { instruction: "Change to 'I'", answer: "Eu não pude terminar o quadro.", alt: ["Não pude terminar o quadro."], en: "I couldn't finish the painting." } }
      - { es: "Ninguém quis ouvir a canção nova.", en: "Nobody wanted to listen to the new song.", altEs: ["Ninguém quis escutar a canção nova.", "Ninguém quis ouvir a música nova."], grammar: [g.preterite-irregular], vocab: [w.querer, w.canção, w.ouvir] }
      - { es: "Quem trouxe o disco do Gilberto Gil?", en: "Who brought the Gilberto Gil record?", altEs: ["Quem foi que trouxe o disco do Gilberto Gil?"], altEn: ["Who brought Gilberto Gil's album?"], grammar: [g.preterite-irregular, g.question-words], vocab: [w.trazer, w.disco] }
      - { es: "Onde você pôs as minhas chaves?", en: "Where did you put my keys?", altEs: ["Onde você colocou as minhas chaves?", "Onde você pôs minhas chaves?"], grammar: [g.preterite-irregular, g.question-words], vocab: [w.pôr, w.chave] }
      - { es: "O artista disse numa entrevista que vai lançar um disco.", en: "The artist said in an interview that he's going to release an album.", altEs: ["O artista disse em uma entrevista que vai lançar um disco."], grammar: [g.preterite-irregular], vocab: [w.artista, w.dizer, w.lançar, w.entrevista] }
      - { es: "Eu soube da notícia pelo rádio.", en: "I found out about the news on the radio.", altEs: ["Soube da notícia pelo rádio."], altEn: ["I heard the news on the radio."], grammar: [g.preterite-irregular], vocab: [w.saber, w.notícia, w.rádio], note: "saber in the preterite means 'to find out'." }
      - { es: "Houve uma festa enorme quando o livro saiu.", en: "There was a huge party when the book came out.", altEs: ["Teve uma festa enorme quando o livro saiu."], grammar: [g.preterite-irregular], vocab: [w.haver, w.livro, w.escritor], note: "In speech Brazilians often say teve for 'there was'." }
      - { es: "O compositor esteve três vezes em São Paulo.", en: "The composer was in São Paulo three times.", altEs: ["O compositor esteve em São Paulo três vezes."], grammar: [g.preterite-irregular], vocab: [w.compositor, w.estar] }
    exchanges:
      - q: { es: "O que vocês fizeram no sábado?", en: "What did you do on Saturday?" }
        a: { es: "Passeamos no centro e trouxemos pastel do Mercadão.", en: "We walked around downtown and brought back pastel from the Mercadão." }
        alt: ["Não fizemos nada.", "Ficamos em casa.", "Fizemos um churrasco."]
        grammar: [g.preterite-irregular]
        vocab: [w.fazer, w.trazer, w.mercadão]
      - q: { es: "Você pôde ir ao show?", en: "Were you able to go to the concert?" }
        a: { es: "Não pude: tive que trabalhar.", en: "I couldn't: I had to work." }
        alt: ["Pude, sim!", "Não, não deu.", "Não pude, que pena."]
        grammar: [g.preterite-irregular]
        vocab: [w.poder, w.ter-que]
      - q: { es: "Quem escreveu esse livro?", en: "Who wrote this book?" }
        a: { es: "Foi o Machado de Assis, um escritor do Rio.", en: "It was Machado de Assis, a writer from Rio." }
        alt: ["Machado de Assis.", "Não sei.", "Um escritor carioca."]
        grammar: [g.preterite-regular]
        vocab: [w.escritor, w.escrever]
      - q: { es: "O que ela disse?", en: "What did she say?" }
        a: { es: "Disse que gravou um disco novo.", en: "She said she's recorded a new album." }
        alt: ["Não disse nada.", "Disse que vem amanhã.", "Disse que está feliz."]
        grammar: [g.preterite-irregular]
        vocab: [w.dizer, w.gravar, w.disco]
      - q: { es: "Onde você esteve a tarde toda?", en: "Where were you all afternoon?" }
        a: { es: "Estive no Mercadão com a minha tia.", en: "I was at the Mercadão with my aunt." }
        alt: ["Estive em casa.", "Estive no trabalho.", "No Mercadão."]
        grammar: [g.preterite-irregular]
        vocab: [w.estar, w.tio]
    texts:
      - title: "Uma vida de sucesso"
        es: ["Tom Jobim nasceu no Rio de Janeiro em 1927.", "Fez muito sucesso no Brasil e nos Estados Unidos.", "Teve uma carreira longa e gravou discos com grandes artistas."]
        en: ["Tom Jobim was born in Rio de Janeiro in 1927.", "He had great success in Brazil and in the United States.", "He had a long career and recorded albums with great artists."]
        grammar: [g.preterite-irregular]
        vocab: [w.sucesso, w.carreira, w.gravar, w.artista]
      - title: "Mensagem"
        es: ["Oi, mãe! Fiz as compras no Mercadão.", "Trouxe queijo, frutas e mortadela.", "Não pude comprar o pão: a padaria fechou cedo."]
        en: ["Hi, Mum! I did the shopping at the Mercadão.", "I brought cheese, fruit and mortadella.", "I couldn't buy the bread: the bakery closed early."]
        grammar: [g.preterite-irregular]
        vocab: [w.fazer, w.trazer, w.poder]
    spicy:
      - { es: "Fiz um bolo para você. Bom, eu tentei.", en: "I made you a cake. Well, I tried.", altEs: ["Fiz um bolo pra você. Bom, eu tentei."], grammar: [g.preterite-irregular], vocab: [w.fazer, w.bolo] }
      - { es: "Ontem você disse que não sabe dançar. Mentira!", en: "Yesterday you said you can't dance. Lies!", altEs: ["Você disse ontem que não sabe dançar. Mentira!"], grammar: [g.preterite-irregular], vocab: [w.dizer, w.mentira] }
      - { es: "Trouxe flores e uma canção para você.", en: "I brought flowers and a song for you.", altEs: ["Eu trouxe flores e uma canção pra você."], grammar: [g.preterite-irregular], vocab: [w.trazer, w.canção, w.flor] }
      - { es: "Quis ligar para você a noite toda, mas fiquei tímido.", en: "I wanted to call you all night, but I got shy.", altEs: ["Quis te ligar a noite toda, mas fiquei tímida."], grammar: [g.preterite-irregular], vocab: [w.querer, w.ligar, w.tímido] }
      - { es: "Você esteve na minha cabeça a semana inteira.", en: "You've been on my mind all week.", altEs: ["Você esteve na minha cabeça a semana toda."], grammar: [g.preterite-irregular], vocab: [w.estar, w.cabeça] }
  - id: a2.u02.l2
    title: Como foi?
    teach: [g.preterite-ser-ir]
    vocab: [w.presidente, w.rei, w.rainha, w.governo, w.político, w.estado, w.capital, w.independência, w.independente, w.guerra, w.história, w.carta, w.que-pena, w.pena, w.personagem, w.papel, w.vitral]
    tip: "fui, foi, fomos, foram = both 'went' (ir + a / para) and 'was / were' (ser + a description). Fui ao Rio. Foi ótimo!"
    sentences:
      - { es: "Fui ao Mercadão no sábado.", en: "I went to the Mercadão on Saturday.", altEs: ["Eu fui ao Mercadão no sábado.", "Fui no Mercadão no sábado."], grammar: [g.preterite-ser-ir], vocab: [w.ir, w.mercadão] }
      - { es: "Como foi a viagem? — Foi ótima!", en: "How was the trip? — It was great!", altEs: ["Como foi a viagem? — Ótima!"], grammar: [g.preterite-ser-ir], vocab: [w.viagem, w.ótimo], error: { wrong: "Como esteve a viagem? — Esteve ótima!", explain: "To say how an event was, use foi (ser), not esteve.", grammar: g.preterite-ser-ir } }
      - { es: "A independência do Brasil foi em 1822.", en: "Brazil's independence was in 1822.", altEs: ["A independência do Brasil foi no ano de 1822."], grammar: [g.preterite-ser-ir, g.dates-years], vocab: [w.independência] }
      - { es: "O Rio de Janeiro foi a capital do Brasil até 1960.", en: "Rio de Janeiro was the capital of Brazil until 1960.", altEs: ["O Rio foi a capital do Brasil até 1960."], grammar: [g.preterite-ser-ir], vocab: [w.capital] }
      - { es: "A rainha Elizabeth II esteve em São Paulo em 1968 e foi ao novo prédio do MASP.", en: "Queen Elizabeth II was in São Paulo in 1968 and went to the new MASP building.", grammar: [g.preterite-ser-ir, g.preterite-irregular], vocab: [w.rainha, w.prédio], note: "The Queen opened MASP's building on Avenida Paulista in November 1968." }
      - { es: "Getúlio Vargas foi presidente do Brasil duas vezes.", en: "Getúlio Vargas was president of Brazil twice.", grammar: [g.preterite-ser-ir], vocab: [w.presidente] }
      - { es: "Fomos ao centro de metrô.", en: "We went downtown by metro.", altEs: ["A gente foi ao centro de metrô.", "Nós fomos ao centro de metrô.", "Fomos pro centro de metrô."], altEn: ["We went into town on the metro."], grammar: [g.preterite-ser-ir], vocab: [w.centro, w.metrô], transform: { instruction: "Change to 'they'", answer: "Eles foram ao centro de metrô.", alt: ["Foram ao centro de metrô.", "Elas foram ao centro de metrô."], en: "They went downtown by metro." } }
      - { es: "Vocês foram ao jogo ontem?", en: "Did you go to the match yesterday?", altEs: ["Vocês foram no jogo ontem?"], altEn: ["Did you (all) go to the game yesterday?"], grammar: [g.preterite-ser-ir], vocab: [w.jogo], error: { wrong: "Vocês foi ao jogo ontem?", explain: "vocês takes the eles form: vocês foram.", grammar: g.preterite-ser-ir } }
      - { es: "Foi um prazer conhecer você.", en: "It was a pleasure to meet you.", altEs: ["Foi um prazer te conhecer.", "Foi um prazer conhecê-lo."], altEn: ["It was nice meeting you."], grammar: [g.preterite-ser-ir], vocab: [w.prazer, w.conhecer] }
      - { es: "O meu avô foi político e escreveu muitas cartas ao governo.", en: "My grandfather was a politician and wrote many letters to the government.", altEs: ["Meu avô foi político e escreveu muitas cartas para o governo."], grammar: [g.preterite-ser-ir, g.preterite-regular], vocab: [w.político, w.carta, w.governo] }
      - { es: "Os meus pais são do Paraná, mas foram morar em São Paulo.", en: "My parents are from Paraná, but they went to live in São Paulo.", altEs: ["Meus pais são do Paraná, mas foram morar em São Paulo."], grammar: [g.preterite-ser-ir], vocab: [w.estado, w.morar], note: "O Paraná is a state in the South of Brazil; its capital is Curitiba.", transform: { instruction: "Change to 'my sister'", answer: "A minha irmã é do Paraná, mas foi morar em São Paulo.", alt: ["Minha irmã é do Paraná, mas foi morar em São Paulo."], en: "My sister is from Paraná, but she went to live in São Paulo." } }
      - { es: "Na novela, ele fez o papel de um rei.", en: "In the soap opera, he played the role of a king.", altEs: ["Ele fez o papel de um rei na novela."], grammar: [g.preterite-irregular], vocab: [w.papel, w.rei, w.novela] }
      - { es: "A personagem do livro foi uma mulher muito forte.", en: "The character in the book was a very strong woman.", grammar: [g.preterite-ser-ir], vocab: [w.personagem, w.forte] }
      - { es: "Que pena que você não foi! A festa foi ótima.", en: "What a shame you didn't go! The party was great.", altEs: ["Que pena que você não foi! A festa foi muito boa."], grammar: [g.preterite-ser-ir], vocab: [w.que-pena, w.festa] }
      - { es: "A viagem foi longa, mas valeu a pena.", en: "The journey was long, but it was worth it.", altEs: ["Foi uma viagem longa, mas valeu a pena."], grammar: [g.preterite-ser-ir], vocab: [w.pena, w.valer-a-pena, w.longo] }
      - { es: "A Guerra do Paraguai foi a maior guerra da história da América do Sul.", en: "The Paraguayan War was the biggest war in South American history.", grammar: [g.preterite-ser-ir], vocab: [w.guerra, w.história], note: "It lasted from 1864 to 1870: Brazil, Argentina and Uruguay against Paraguay." }
    exchanges:
      - q: { es: "Como foi o fim de semana?", en: "How was the weekend?" }
        a: { es: "Foi ótimo! Fui à praia com os meus primos.", en: "It was great! I went to the beach with my cousins." }
        alt: ["Foi tranquilo.", "Foi cansativo.", "Foi ótimo!"]
        grammar: [g.preterite-ser-ir]
        vocab: [w.ir, w.praia]
      - q: { es: "Aonde vocês foram ontem à noite?", en: "Where did you go last night?" }
        a: { es: "Fomos a um bar na Vila Madalena.", en: "We went to a bar in Vila Madalena." }
        alt: ["Fomos ao cinema.", "A gente foi a um bar.", "Não fomos a lugar nenhum."]
        grammar: [g.preterite-ser-ir]
        vocab: [w.aonde, w.bar]
      - q: { es: "Quem foi o primeiro presidente do Brasil?", en: "Who was the first president of Brazil?" }
        a: { es: "Foi o Marechal Deodoro da Fonseca, em 1889.", en: "It was Marshal Deodoro da Fonseca, in 1889." }
        alt: ["Deodoro da Fonseca.", "Não sei.", "Foi o Deodoro."]
        grammar: [g.preterite-ser-ir]
        vocab: [w.presidente]
      - q: { es: "A festa foi ótima. Pena que você não foi!", en: "The party was great. Shame you didn't go!" }
        a: { es: "Que pena mesmo! Tive que trabalhar.", en: "Such a shame! I had to work." }
        alt: ["Pois é, que pena.", "Da próxima vez eu vou.", "Que pena!"]
        grammar: [g.preterite-ser-ir, g.preterite-irregular]
        vocab: [w.que-pena, w.pena]
      - q: { es: "Qual foi a capital do Brasil antes de Brasília?", en: "What was Brazil's capital before Brasília?" }
        a: { es: "Foi o Rio de Janeiro.", en: "It was Rio de Janeiro." }
        alt: ["O Rio.", "Rio de Janeiro.", "Foi o Rio."]
        grammar: [g.preterite-ser-ir]
        vocab: [w.capital]
    texts:
      - title: "Três capitais"
        es: ["Salvador foi a primeira capital do Brasil.", "Depois, em 1763, a capital foi para o Rio de Janeiro.", "Em 1960, foi a vez de Brasília."]
        en: ["Salvador was Brazil's first capital.", "Then, in 1763, the capital moved to Rio de Janeiro.", "In 1960, it was Brasília's turn."]
        grammar: [g.preterite-ser-ir, g.dates-years]
        vocab: [w.capital]
      - title: "Cartão-postal"
        es: ["Oi, avó! Fui ao Mercadão e foi incrível.", "Os vitrais do prédio são lindos.", "Que pena que você não veio comigo!"]
        en: ["Hi, Gran! I went to the Mercadão and it was amazing.", "The building's stained-glass windows are beautiful.", "What a shame you didn't come with me!"]
        grammar: [g.preterite-ser-ir]
        vocab: [w.vitral, w.que-pena]
    spicy:
      - { es: "Foi amor à primeira vista. Ou foi a caipirinha?", en: "Was it love at first sight? Or was it the caipirinha?", altEs: ["Foi amor à primeira vista... ou foi a caipirinha?"], altEn: ["It was love at first sight. Or was it the caipirinha?"], grammar: [g.preterite-ser-ir], vocab: [w.caipirinha] }
      - { es: "Fui ao Mercadão só para ver o vendedor de frutas sorrir.", en: "I went to the Mercadão just to see the fruit seller smile.", altEs: ["Fui ao Mercadão só pra ver a vendedora de frutas sorrir."], grammar: [g.preterite-ser-ir], vocab: [w.ir, w.vendedor, w.sorrir] }
      - { es: "Ontem à noite você foi o rei da festa.", en: "Last night you were the king of the party.", altEs: ["Ontem à noite você foi a rainha da festa."], altEn: ["Last night you were the queen of the party."], grammar: [g.preterite-ser-ir], vocab: [w.rei, w.rainha] }
      - { es: "Escrevi uma carta para você. Foi a primeira da minha vida.", en: "I wrote you a letter. It was the first of my life.", altEs: ["Escrevi uma carta pra você. Foi a primeira da minha vida."], grammar: [g.preterite-ser-ir], vocab: [w.carta, w.vida] }
      - { es: "Que pena que a festa acabou... Vamos para outro lugar?", en: "What a shame the party's over... Shall we go somewhere else?", altEs: ["Que pena que a festa terminou... Vamos pra outro lugar?"], grammar: [g.preterite-regular], vocab: [w.que-pena, w.lugar] }
  - id: a2.u02.l3
    title: Vi, vim, dei
    teach: [g.preterite-dar-ver-vir]
    vocab: [w.nascer, w.crescer, w.morrer, w.morte, w.nascimento, w.formar-se, w.tornar-se, w.separar-se, w.divorciar-se, w.aposentar-se, w.aposentado, w.pai-de-família, w.estrangeiro, w.país-natal, w.jogador, w.cientista]
    tip: "viu (saw) and veio (came); vimos (we saw) and viemos (we came); viram (saw) and vieram (came)."
    sentences:
      - { es: "Clarice Lispector nasceu na Ucrânia e veio para o Brasil ainda bebê.", en: "Clarice Lispector was born in Ukraine and came to Brazil as a baby.", altEs: ["Clarice Lispector nasceu na Ucrânia e veio ainda bebê para o Brasil."], grammar: [g.preterite-dar-ver-vir], vocab: [w.nascer, w.vir, w.bebê] }
      - { es: "Ela cresceu no Recife.", en: "She grew up in Recife.", altEs: ["Ela cresceu em Recife."], grammar: [g.preterite-regular], vocab: [w.crescer] }
      - { es: "Meus avós vieram de Portugal nos anos 50.", en: "My grandparents came from Portugal in the fifties.", altEs: ["Os meus avós vieram de Portugal nos anos 50.", "Meus avós vieram de Portugal na década de 50."], grammar: [g.preterite-dar-ver-vir, g.dates-years], vocab: [w.vir, w.avô], transform: { instruction: "Change to 'my grandfather'", answer: "Meu avô veio de Portugal nos anos 50.", alt: ["O meu avô veio de Portugal nos anos 50."], en: "My grandfather came from Portugal in the fifties." } }
      - { es: "Você viu o jogo ontem?", en: "Did you see the match yesterday?", altEs: ["Viu o jogo ontem?", "Cê viu o jogo ontem?"], altEn: ["Did you watch the game yesterday?"], grammar: [g.preterite-dar-ver-vir], vocab: [w.ver, w.jogo], error: { wrong: "Você veio o jogo ontem?", explain: "veio is from vir (to come); 'saw' is viu, from ver.", grammar: g.preterite-dar-ver-vir } }
      - { es: "Meu pai viu o Pelé jogar no Santos.", en: "My dad saw Pelé play for Santos.", altEs: ["O meu pai viu o Pelé jogar no Santos."], grammar: [g.preterite-dar-ver-vir], vocab: [w.ver, w.jogar], note: "Pelé (1940–2022) played for Santos from 1956 to 1974." }
      - { es: "O jogador deu a camisa para um torcedor.", en: "The player gave his shirt to a fan.", altEs: ["O jogador deu a camisa dele para um torcedor.", "O jogador deu a camisa pra um torcedor."], grammar: [g.preterite-dar-ver-vir], vocab: [w.jogador, w.dar, w.torcedor, w.camisa] }
      - { es: "Ontem demos um presente de aniversário para a nossa avó.", en: "Yesterday we gave our grandmother a birthday present.", altEs: ["Ontem a gente deu um presente de aniversário para a nossa avó.", "Ontem nós demos um presente de aniversário pra nossa avó."], grammar: [g.preterite-dar-ver-vir], vocab: [w.dar, w.presente, w.aniversário], error: { wrong: "Ontem damos um presente de aniversário para a nossa avó.", explain: "The preterite of dar for nós is demos; damos is the present.", grammar: g.preterite-dar-ver-vir } }
      - { es: "Eles se separaram em 2010 e se divorciaram dois anos depois.", en: "They separated in 2010 and got divorced two years later.", altEs: ["Eles se separaram em 2010 e se divorciaram dois anos mais tarde."], grammar: [g.preterite-regular], vocab: [w.separar-se, w.divorciar-se] }
      - { es: "Depois da morte do marido, ela se tornou uma mulher muito independente.", en: "After her husband's death, she became a very independent woman.", altEs: ["Depois da morte do marido, ela ficou muito independente."], grammar: [g.preterite-regular], vocab: [w.morte, w.tornar-se, w.independente] }
      - { es: "O cientista morreu em 1999, mas a obra dele continua importante.", en: "The scientist died in 1999, but his work is still important.", altEs: ["O cientista morreu em 1999, mas a sua obra continua importante."], grammar: [g.preterite-regular, g.dates-years], vocab: [w.cientista, w.morrer, w.obra] }
      - { es: "Meu pai se aposentou ano passado e agora é um aposentado que nunca fica em casa.", en: "My dad retired last year and now he's a pensioner who's never at home.", altEs: ["O meu pai se aposentou no ano passado e agora é um aposentado que nunca fica em casa."], grammar: [g.preterite-regular], vocab: [w.aposentar-se, w.aposentado] }
      - { es: "Ela se formou em Recife e veio morar em São Paulo.", en: "She graduated in Recife and came to live in São Paulo.", altEs: ["Ela se formou no Recife e veio morar em São Paulo."], grammar: [g.preterite-dar-ver-vir], vocab: [w.formar-se, w.vir, w.morar] }
      - { es: "Muitos estrangeiros vieram para São Paulo no século XX.", en: "Many foreigners came to São Paulo in the 20th century.", altEs: ["No século XX, muitos estrangeiros vieram para São Paulo."], grammar: [g.preterite-dar-ver-vir], vocab: [w.estrangeiro, w.vir, w.século] }
      - { es: "Ele nunca mais viu o seu país natal.", en: "He never saw his home country again.", altEs: ["Ele nunca mais viu o país natal dele."], grammar: [g.preterite-dar-ver-vir], vocab: [w.país-natal, w.ver] }
      - { es: "O meu avô foi um pai de família muito presente.", en: "My grandfather was a very hands-on family man.", altEs: ["Meu avô foi um pai de família muito presente."], grammar: [g.preterite-ser-ir], vocab: [w.pai-de-família, w.avô] }
      - { es: "Viemos ao hospital para o nascimento da minha sobrinha.", en: "We came to the hospital for my niece's birth.", altEs: ["Nós viemos ao hospital para o nascimento da minha sobrinha.", "A gente veio ao hospital para o nascimento da minha sobrinha."], grammar: [g.preterite-dar-ver-vir], vocab: [w.nascimento, w.vir, w.hospital], transform: { instruction: "Change to 'they'", answer: "Eles vieram ao hospital para o nascimento da minha sobrinha.", alt: ["Vieram ao hospital para o nascimento da minha sobrinha."], en: "They came to the hospital for my niece's birth." } }
    exchanges:
      - q: { es: "Onde você nasceu?", en: "Where were you born?" }
        a: { es: "Nasci em Campinas, mas cresci em São Paulo.", en: "I was born in Campinas, but I grew up in São Paulo." }
        alt: ["Em Campinas.", "Nasci aqui mesmo.", "Nasci em São Paulo."]
        grammar: [g.preterite-regular]
        vocab: [w.nascer, w.crescer]
      - q: { es: "Quando vocês vieram para o Brasil?", en: "When did you come to Brazil?" }
        a: { es: "Viemos em 2015, com os nossos filhos.", en: "We came in 2015, with our children." }
        alt: ["Em 2015.", "Há dez anos.", "Faz dez anos."]
        grammar: [g.preterite-dar-ver-vir]
        vocab: [w.vir]
      - q: { es: "Você viu o meu celular?", en: "Have you seen my phone?" }
        a: { es: "Vi, sim: está em cima da mesa.", en: "Yes, I have: it's on the table." }
        alt: ["Não vi.", "Vi, está na cozinha.", "Não, não vi."]
        grammar: [g.preterite-dar-ver-vir]
        vocab: [w.ver, w.celular]
      - q: { es: "O que você deu para a sua mãe?", en: "What did you give your mum?" }
        a: { es: "Dei umas flores e um livro.", en: "I gave her some flowers and a book." }
        alt: ["Dei um livro.", "Ainda não dei nada.", "Umas flores."]
        grammar: [g.preterite-dar-ver-vir]
        vocab: [w.dar, w.flor]
      - q: { es: "O seu avô ainda trabalha?", en: "Does your grandfather still work?" }
        a: { es: "Não, ele se aposentou há cinco anos.", en: "No, he retired five years ago." }
        alt: ["Não, está aposentado.", "Trabalha, sim.", "Não, se aposentou."]
        grammar: [g.preterite-regular, g.past-time-markers]
        vocab: [w.aposentar-se, w.aposentado]
    texts:
      - title: "Uma vida"
        es: ["Clarice Lispector nasceu em 1920, na Ucrânia.", "A família veio para o Brasil quando ela era bebê.", "Ela se tornou uma das escritoras mais importantes do país."]
        en: ["Clarice Lispector was born in 1920, in Ukraine.", "The family came to Brazil when she was a baby.", "She became one of the country's most important writers."]
        grammar: [g.preterite-dar-ver-vir, g.dates-years]
        vocab: [w.nascer, w.vir, w.tornar-se]
      - title: "Mensagem no grupo"
        es: ["Gente, vocês viram o jogo?", "O jogador novo deu um show e fez dois gols!", "Meu pai veio aqui em casa só para ver comigo."]
        en: ["Guys, did you see the match?", "The new player put on a show and scored two goals!", "My dad came over just to watch it with me."]
        grammar: [g.preterite-dar-ver-vir]
        vocab: [w.ver, w.dar, w.vir, w.jogador]
    spicy:
      - { es: "Vi você no Mercadão e esqueci o que vim comprar.", en: "I saw you at the Mercadão and forgot what I came to buy.", altEs: ["Te vi no Mercadão e esqueci o que vim comprar."], grammar: [g.preterite-dar-ver-vir], vocab: [w.ver, w.vir, w.esquecer] }
      - { es: "Você veio sozinho ou posso me sentar aqui?", en: "Did you come alone or can I sit here?", altEs: ["Você veio sozinha ou posso me sentar aqui?", "Você veio sozinho ou posso sentar aqui?"], grammar: [g.preterite-dar-ver-vir], vocab: [w.vir, w.sozinho, w.sentar-se] }
      - { es: "Eu dei o meu número; você me deu um sorriso. Ainda estou esperando a ligação.", en: "I gave you my number; you gave me a smile. I'm still waiting for the call.", altEs: ["Dei o meu número; você me deu um sorriso. Ainda estou esperando a ligação."], grammar: [g.preterite-dar-ver-vir], vocab: [w.dar, w.número, w.ligação] }
