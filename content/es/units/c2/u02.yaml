id: c2.u02
title: Literatura II - Siglo de Oro
lessons:
  - id: c2.u02.l1
    title: El ingenioso hidalgo
    teach: [g.golden-age-language]
    vocab: [w.caballeria, w.escudero, w.gigante, w.molino, w.escudo, w.cordura, w.cuerdo, w.enclitico, w.dijole, w.agora, w.ansi, w.mesmo, w.menester, w.doncella, w.villano, w.noble, w.rango, w.honra, w.agravio, w.vengar, w.humillar, w.espada, w.corte]
    tip: "Read Cervantes with four keys: enclitic pronouns after the verb (díjole = le dijo), haber for hacer (no ha mucho = no hace mucho), vuestra merced and vos as forms of address, and -ra as a pluperfect (naciera = había nacido)."
    sentences:
      - { es: "«En un lugar de la Mancha, de cuyo nombre no quiero acordarme, no ha mucho tiempo que vivía un hidalgo».", en: "'In a village of La Mancha, whose name I do not care to remember, not long ago there lived a hidalgo.'", grammar: [g.golden-age-language, g.relative-donde-cuyo], vocab: [w.hidalgo, w.acordarse], note: "Cervantes, 1605. «No ha mucho tiempo» = no hace mucho tiempo." }
      - { es: "Don Quijote leía libros de caballerías hasta que, del poco dormir y del mucho leer, se le secó el cerebro.", en: "Don Quixote read books of chivalry until, from little sleep and much reading, his brain dried up.", grammar: [g.golden-age-language, g.hasta-que], vocab: [w.caballeria, w.leer, w.dormir] }
      - { es: "Díjole Sancho que aquellos gigantes eran molinos de viento, mas el caballero no quiso escucharle.", en: "Sancho told him that those giants were windmills, but the knight would not listen to him.", altEs: ["Le dijo Sancho que aquellos gigantes eran molinos de viento, pero el caballero no quiso escucharle."], grammar: [g.golden-age-language, g.reported-speech-past], vocab: [w.dijole, w.gigante, w.molino, w.mas, w.caballero] }
      - { es: "Los pronombres enclíticos («parecióle», «levantose») van detrás del verbo conjugado; hoy decimos «le pareció», «se levantó».", en: "Enclitic pronouns ('parecióle', 'levantose') go after the conjugated verb; today we say 'le pareció', 'se levantó'.", grammar: [g.golden-age-language, g.pronoun-placement], vocab: [w.enclitico, w.pronombre, w.verbo] }
      - { es: "«Agora» es «ahora», «ansí» es «así» y «mesmo» es «mismo»: tres formas que aún se oyen en algunos pueblos.", en: "'Agora' is 'ahora', 'ansí' is 'así' and 'mesmo' is 'mismo': three forms still heard in some villages.", grammar: [g.golden-age-language], vocab: [w.agora, w.ansi, w.mesmo, w.pueblo] }
      - { es: "El escudero tenía harta hambre y era menester buscar una posada antes de que anocheciera.", en: "The squire was extremely hungry and it was necessary to find an inn before night fell.", grammar: [g.golden-age-language, g.subjunctive-time-clauses], vocab: [w.menester, w.harto.adv, w.hambre] }
      - { es: "Con la lanza en una mano y el escudo en la otra, el hidalgo salió al campo en busca de aventuras.", en: "With his lance in one hand and his shield in the other, the hidalgo rode out into the countryside in search of adventures.", grammar: [g.golden-age-language, g.preterite-irregular], vocab: [w.lanza, w.escudo, w.aventura, w.campo] }
      - { es: "¿Locura o cordura? Don Quijote está loco en lo que ve, pero cuerdo en lo que dice.", en: "Madness or sanity? Don Quixote is mad in what he sees, but sane in what he says.", grammar: [g.golden-age-language, g.neutral-lo], vocab: [w.locura, w.cordura, w.loco] }
      - { es: "En el Siglo de Oro, «vuestra merced» se usaba con los superiores y «vos», con los criados y los villanos.", en: "In the Golden Age, 'vuestra merced' was used with superiors and 'vos' with servants and commoners.", grammar: [g.golden-age-language, g.imperfect, g.se-passive], vocab: [w.vuestra-merced, w.vos, w.criado, w.villano] }
      - { es: "La honra era lo más valioso de un caballero: un agravio se vengaba con la espada.", en: "Honour was a knight's most valuable possession: an affront was avenged with the sword.", grammar: [g.golden-age-language, g.se-passive], vocab: [w.honra, w.agravio, w.vengar] }
      - { es: "«El que naciera en Toledo» significaba «el que había nacido en Toledo»: la forma en -ra era un pluscuamperfecto.", en: "'El que naciera en Toledo' meant 'the one who had been born in Toledo': the -ra form was a pluperfect.", grammar: [g.golden-age-language, g.pluperfect], vocab: [w.nacer, w.significar] }
      - { es: "«Quienquiera que fuere el culpable, pagará su agravio», dijo el rey en la corte.", en: "'Whoever the guilty one may be, he will pay for his offence,' said the king at court.", grammar: [g.golden-age-language, g.future-subjunctive], vocab: [w.fuere, w.corte, w.agravio, w.culpable, w.rey] }
      - { es: "Le dijo que no tuviera miedo.", en: "He told him not to be afraid.", altEs: ["Le dijo que no tuviese miedo."], grammar: [g.golden-age-language, g.reported-commands], vocab: [w.enclitico, w.miedo], error: { wrong: "Díjole que no tuviera miedo.", explain: "Enclitic pronouns after a conjugated verb («díjole») are archaic; modern Spanish puts them before: «le dijo».", grammar: g.golden-age-language } }
      - { es: "Levantose el hidalgo y díjole a Sancho que callase.", en: "The hidalgo got up and told Sancho to be quiet.", grammar: [g.golden-age-language, g.pronoun-placement], vocab: [w.dijole, w.hidalgo, w.callarse], transform: { instruction: "Rewrite in modern Spanish (pronouns before the verb)", answer: "El hidalgo se levantó y le dijo a Sancho que callase.", alt: ["El hidalgo se levantó y le dijo a Sancho que se callara.", "Se levantó el hidalgo y le dijo a Sancho que callase."] } }
      - { es: "¿Sabías que Cervantes y Shakespeare murieron casi el mismo año, en 1616?", en: "Did you know that Cervantes and Shakespeare died almost in the same year, 1616?", altEs: ["¿Sabías que Cervantes y Shakespeare fallecieron casi el mismo año, en 1616?"], grammar: [g.golden-age-language, g.preterite-irregular], vocab: [w.morir, w.mismo] }
      - { es: "Cuatro siglos después, el Quijote sigue siendo la novela más traducida del mundo después de la Biblia.", en: "Four centuries later, Don Quixote is still the most translated novel in the world after the Bible.", altEn: ["Four centuries on, Don Quixote remains the world's most translated novel after the Bible."], grammar: [g.golden-age-language, g.superlatives, g.periphrases-aspect], vocab: [w.novela, w.siglo, w.traducir] }
    exchanges:
      - q: { es: "¿Qué significa «no ha mucho tiempo»?", en: "What does 'no ha mucho tiempo' mean?" }
        a: { es: "«No hace mucho tiempo»: en el Siglo de Oro «haber» se usaba como hoy usamos «hacer».", en: "'Not long ago': in the Golden Age 'haber' was used as we use 'hacer' today." }
        alt: ["No hace mucho tiempo.", "Significa «no hace mucho tiempo»."]
        grammar: [g.golden-age-language]
        vocab: [w.haber, w.hacer]
      - q: { es: "¿Por qué don Quijote ataca los molinos?", en: "Why does Don Quixote attack the windmills?" }
        a: { es: "Porque cree que son gigantes; la locura le hace ver aventuras donde no las hay.", en: "Because he thinks they are giants; madness makes him see adventures where there are none." }
        alt: ["Porque los confunde con gigantes.", "Porque cree que son gigantes."]
        grammar: [g.golden-age-language]
        vocab: [w.molino, w.gigante, w.locura]
      - q: { es: "¿Qué es un hidalgo?", en: "What is a hidalgo?" }
        a: { es: "Un noble de bajo rango, sin dinero pero con honra.", en: "A nobleman of low rank, without money but with honour." }
        alt: ["Un noble pobre, de rango bajo.", "Un noble de bajo rango."]
        grammar: [g.golden-age-language]
        vocab: [w.hidalgo, w.honra]
      - q: { es: "¿«Díjole» es un error?", en: "Is 'díjole' a mistake?" }
        a: { es: "No, es una forma arcaica: el pronombre va detrás del verbo.", en: "No, it is an archaic form: the pronoun goes after the verb." }
        alt: ["No, es arcaico: hoy diríamos «le dijo».", "No, es una forma antigua."]
        grammar: [g.golden-age-language, g.pronoun-placement]
        vocab: [w.dijole, w.arcaico, w.enclitico]
    texts:
      - title: "Nota de un profesor en el margen"
        es: ["«Ansí» y «mesmo» no son errores del copista.", "Son formas normales del castellano de 1605.", "Compáralas con las actuales «así» y «mismo»."]
        en: ["'Ansí' and 'mesmo' are not copyist's errors.", "They are normal forms of the Castilian of 1605.", "Compare them with the current 'así' and 'mismo'."]
        grammar: [g.golden-age-language, g.imperative-pronouns]
        vocab: [w.ansi, w.mesmo, w.castellano]
      - title: "Cartel de una exposición"
        es: ["Esta edición del Quijote se imprimió en Madrid en 1605.", "Hoy se conservan muy pocos ejemplares de aquella primera tirada.", "No toque el cristal, por favor."]
        en: ["This edition of Don Quixote was printed in Madrid in 1605.", "Today very few copies of that first print run survive.", "Please do not touch the glass."]
        grammar: [g.golden-age-language, g.se-passive, g.imperative-usted]
        vocab: [w.imprimir, w.conservar]
  - id: c2.u02.l2
    title: Comedias, sonetos y dos estilos
    teach: [g.golden-age-language]
    vocab: [w.comedia, w.galan, w.dama, w.conceptismo, w.culteranismo, w.agudeza, w.cultismo, w.barroco, w.soneto, w.dramaturgo, w.monarca, w.vasallo, w.capitan, w.representar, w.corral, w.bruñido, w.relumbrar, w.competir, w.cabello, w.erase, w.honor, w.rebelde, w.cruel, w.definir, w.obediencia, w.rivalidad]
    tip: "Lope's comedia nueva (galán, dama, gracioso, honour) on the stage; Quevedo's conceptismo (wit, puns) versus Góngora's culteranismo (Latinate words, hyperbaton) on the page."
    sentences:
      - { es: "Lope de Vega escribió cientos de comedias; él mismo presumía de haber compuesto más de cien en veinticuatro horas.", en: "Lope de Vega wrote hundreds of plays; he himself boasted of having composed more than a hundred in twenty-four hours.", grammar: [g.golden-age-language, g.preterite-regular], vocab: [w.comedia, w.dramaturgo, w.presumir] }
      - { es: "En la comedia nueva, el galán ama a la dama, el gracioso hace reír y el criado lo sabe todo.", en: "In the comedia nueva, the leading man loves the lady, the gracioso makes people laugh and the servant knows everything.", grammar: [g.golden-age-language, g.a-personal], vocab: [w.galan, w.dama, w.gracioso, w.criado, w.amar] }
      - { es: "Las comedias se representaban en los corrales, patios abiertos donde el público comía, bebía y gritaba.", en: "Plays were performed in the corrales, open courtyards where the audience ate, drank and shouted.", grammar: [g.golden-age-language, g.se-passive, g.imperfect], vocab: [w.representar, w.corral, w.publico, w.patio] }
      - { es: "«¿Qué es la vida? Un frenesí. ¿Qué es la vida? Una ilusión»: así define Calderón el sueño que es vivir.", en: "'What is life? A frenzy. What is life? An illusion': that is how Calderón defines the dream that living is.", grammar: [g.golden-age-language, g.question-words], vocab: [w.ilusion, w.sueno] }
      - { es: "Fuenteovejuna, todos a una: en la obra de Lope, un pueblo entero se rebela contra el señor que lo humilla.", en: "Fuenteovejuna, all as one: in Lope's play, a whole village rebels against the lord who humiliates it.", grammar: [g.golden-age-language, g.relative-que-quien], vocab: [w.rebelarse, w.pueblo, w.obra, w.senor] }
      - { es: "«Érase un hombre a una nariz pegado»: Quevedo convierte la burla de una nariz en un soneto perfecto.", en: "'Once there was a man stuck to a nose': Quevedo turns the mockery of a nose into a perfect sonnet.", grammar: [g.golden-age-language], vocab: [w.erase, w.nariz, w.soneto, w.burla] }
      - { es: "El conceptismo de Quevedo busca la agudeza: dice mucho con pocas palabras y juega con los dobles sentidos.", en: "Quevedo's conceptismo seeks wit: it says a lot with few words and plays with double meanings.", grammar: [g.golden-age-language], vocab: [w.conceptismo, w.agudeza, w.sentido, w.jugar] }
      - { es: "El culteranismo de Góngora, en cambio, busca la belleza del sonido: cultismos, hipérbatos y metáforas difíciles.", en: "Góngora's culteranismo, on the other hand, seeks the beauty of sound: learned words, hyperbatons and difficult metaphors.", grammar: [g.golden-age-language, g.connectors-contrast], vocab: [w.culteranismo, w.cultismo, w.hiperbaton, w.metafora, w.sonido] }
      - { es: "«Mientras por competir con tu cabello, oro bruñido al sol relumbra en vano»: así empieza el soneto más famoso de Góngora.", en: "'While, to compete with your hair, burnished gold gleams in the sun in vain': so begins Góngora's most famous sonnet.", grammar: [g.golden-age-language, g.poetic-syntax], vocab: [w.oro, w.bruñido, w.relumbrar, w.soneto] }
      - { es: "Quevedo y Góngora se odiaban y se dedicaban versos crueles; el barroco también era eso.", en: "Quevedo and Góngora hated each other and dedicated cruel verses to one another; the baroque was that too.", altEs: ["Quevedo y Góngora se odiaban y se dedicaban versos crueles; el Barroco también era eso."], grammar: [g.golden-age-language, g.imperfect, g.reflexive-verbs-present], vocab: [w.barroco, w.verso, w.odiar] }
      - { es: "En «El alcalde de Zalamea», un villano defiende su honor frente a un capitán noble: «el honor es patrimonio del alma».", en: "In 'The Mayor of Zalamea', a commoner defends his honour against a noble captain: 'honour is the patrimony of the soul'.", grammar: [g.golden-age-language], vocab: [w.villano, w.alma, w.defender, w.alcalde] }
      - { es: "El monarca era el centro de la corte y los vasallos le debían obediencia, pero el teatro se atrevía a criticar a los nobles.", en: "The monarch was the centre of the court and the vassals owed him obedience, but the theatre dared to criticise the nobles.", grammar: [g.golden-age-language, g.imperfect, g.a-personal], vocab: [w.monarca, w.corte, w.vasallo, w.criticar, w.atreverse, w.teatro] }
      - { es: "Lope escribió el soneto que explica cómo se escribe un soneto: «Un soneto me manda hacer Violante».", en: "Lope wrote the sonnet that explains how a sonnet is written: 'Violante orders me to write a sonnet'.", grammar: [g.golden-age-language, g.se-passive], vocab: [w.soneto, w.explicar] }
      - { es: "Vuestra merced tiene razón, señor.", en: "Your grace is right, sir.", altEs: ["Vuestra merced lleva razón, señor."], grammar: [g.golden-age-language, g.tu-vs-usted], vocab: [w.vuestra-merced, w.tener-razon], error: { wrong: "Vuestra merced tenéis razón, señor.", explain: "Vuestra merced is a noun phrase and takes third-person forms (tiene), like modern usted; «tenéis» goes with vos or vosotros.", grammar: g.golden-age-language } }
      - { es: "Un soneto tiene catorce versos.", en: "A sonnet has fourteen lines.", altEs: ["El soneto tiene catorce versos."], grammar: [g.golden-age-language, g.question-words], vocab: [w.soneto, w.verso], transform: { instruction: "Turn it into a question with «cuántos»", answer: "¿Cuántos versos tiene un soneto?", alt: ["¿Cuántos versos tiene el soneto?"] } }
      - { es: "¡Qué dramaturgo tan rebelde fue Tirso de Molina: inventó a don Juan, el galán que se burla de todos!", en: "What a rebellious playwright Tirso de Molina was: he invented Don Juan, the gallant who mocks everyone!", grammar: [g.golden-age-language, g.preterite-ser-ir], vocab: [w.dramaturgo, w.rebelde, w.galan, w.burlarse, w.inventar] }
    exchanges:
      - q: { es: "¿Quién es el gracioso en una comedia de Lope?", en: "Who is the gracioso in a play by Lope?" }
        a: { es: "El criado del galán: dice la verdad riendo y hace reír al público.", en: "The leading man's servant: he tells the truth laughing and makes the audience laugh." }
        alt: ["El criado que hace reír.", "El criado del galán, que hace reír."]
        grammar: [g.golden-age-language]
        vocab: [w.gracioso, w.criado, w.galan]
      - q: { es: "¿Cuál es la diferencia entre conceptismo y culteranismo?", en: "What is the difference between conceptismo and culteranismo?" }
        a: { es: "El conceptismo juega con las ideas y los dobles sentidos; el culteranismo, con la forma y los cultismos.", en: "Conceptismo plays with ideas and double meanings; culteranismo, with form and learned words." }
        alt: ["Uno juega con el sentido y el otro con la forma.", "El conceptismo es de Quevedo y el culteranismo, de Góngora."]
        grammar: [g.golden-age-language]
        vocab: [w.conceptismo, w.culteranismo, w.cultismo]
      - q: { es: "¿Dónde se representaban las comedias?", en: "Where were the plays performed?" }
        a: { es: "En los corrales, unos patios entre casas con el público de pie.", en: "In the corrales, courtyards between houses with the audience standing." }
        alt: ["En los corrales de comedias.", "En los corrales."]
        grammar: [g.golden-age-language, g.se-passive]
        vocab: [w.representar, w.corral, w.comedia]
      - q: { es: "¿Por qué se odiaban Quevedo y Góngora?", en: "Why did Quevedo and Góngora hate each other?" }
        a: { es: "Por rivalidad literaria y también personal: se dedicaban sonetos muy crueles.", en: "Out of literary and also personal rivalry: they dedicated very cruel sonnets to each other." }
        alt: ["Por rivalidad: se escribían sonetos crueles.", "Por rivalidad literaria."]
        grammar: [g.golden-age-language, g.imperfect]
        vocab: [w.odiar, w.soneto, w.literario]
      - q: { es: "¿Qué significa «érase»?", en: "What does 'érase' mean?" }
        a: { es: "«Había una vez»: es el comienzo típico de los cuentos.", en: "'Once upon a time': it is the typical beginning of stories." }
        alt: ["Había una vez.", "Significa «había una vez»."]
        grammar: [g.golden-age-language]
        vocab: [w.erase, w.cuento]
    texts:
      - title: "Programa de mano"
        es: ["Esta noche, «El perro del hortelano», comedia de Lope de Vega.", "La función comienza a las ocho en el corral de comedias de Almagro.", "Se ruega al público que apague el móvil, aunque Lope no lo conociera."]
        en: ["Tonight, 'The Gardener's Dog', a play by Lope de Vega.", "The performance begins at eight in the corral de comedias of Almagro.", "The audience is asked to switch off their phones, even though Lope never knew them."]
        grammar: [g.golden-age-language, g.indirect-commands]
        vocab: [w.comedia, w.corral, w.funcion]
      - title: "Reseña breve"
        es: ["Un Quevedo feroz y divertido, con sonetos que todavía duelen.", "El actor dice los versos como si fueran conversación de bar.", "Recomendable, sobre todo para los que creen que el barroco es aburrido."]
        en: ["A fierce and funny Quevedo, with sonnets that still hurt.", "The actor delivers the lines as if they were bar conversation.", "Recommended, especially for those who think the baroque is boring."]
        grammar: [g.golden-age-language, g.como-si]
        vocab: [w.soneto, w.verso, w.barroco, w.actor]
  - id: c2.u02.l3
    title: Mas, empero, so pena de
    teach: [g.archaic-forms]
    vocab: [w.empero, w.do, w.otrora, w.hogaño, w.so, w.so-pena-de, w.allende, w.tiempo-ha, w.fuere, w.pluscuamperfecto, w.temer, w.harto.adv, w.aqueste, w.vide, w.truje, w.literario, w.juridico, w.yacer, w.equivaler, w.aguardar, w.feroz, w.preposicion]
    tip: "Archaic words you will still meet: mas (pero), empero (sin embargo), do (donde), harto (muy), otrora / antaño (antes), hogaño (hoy), so pena de, allende, tiempo ha, and the future subjunctive fuere / hubiere."
    sentences:
      - { es: "Quiso huir, mas no pudo: la puerta estaba cerrada.", en: "He wanted to flee, but could not: the door was locked.", altEs: ["Quiso huir, pero no pudo: la puerta estaba cerrada."], grammar: [g.archaic-forms, g.preterite-irregular], vocab: [w.huir, w.mas, w.puerta] }
      - { es: "«Empero» equivale a «sin embargo»; hoy solo se encuentra en textos literarios o jurídicos.", en: "'Empero' is equivalent to 'sin embargo'; today it is found only in literary or legal texts.", grammar: [g.archaic-forms, g.se-passive], vocab: [w.literario, w.juridico, w.texto] }
      - { es: "¿Do están los amigos de antaño? Ninguno vino a la fiesta.", en: "Where are the friends of yesteryear? Not one came to the party.", grammar: [g.archaic-forms, g.indefinite-pronouns], vocab: [w.do, w.antano, w.ninguno] }
      - { es: "Otrora esta plaza era un mercado; hogaño es un aparcamiento.", en: "This square was once a market; nowadays it is a car park.", altEn: ["In former times this square was a market; today it is a car park."], grammar: [g.archaic-forms, g.imperfect], vocab: [w.hogaño, w.plaza, w.mercado, w.aparcamiento] }
      - { es: "Está prohibido fumar, so pena de multa.", en: "Smoking is forbidden, on pain of a fine.", altEs: ["Se prohíbe fumar, so pena de multa."], grammar: [g.archaic-forms, g.impersonal-expressions], vocab: [w.so-pena-de, w.multa, w.prohibir, w.fumar] }
      - { es: "Allende los mares buscó fortuna y la encontró: volvió rico y harto cansado.", en: "Beyond the seas he sought his fortune and found it: he came back rich and exceedingly tired.", grammar: [g.archaic-forms, g.preterite-regular], vocab: [w.allende, w.fortuna, w.harto.adv, w.mar] }
      - { es: "Tiempo ha que no sabemos nada de él; acaso haya muerto.", en: "It has been a long time since we heard anything of him; perhaps he has died.", grammar: [g.archaic-forms, g.quizas-tal-vez, g.subjunctive-perfect], vocab: [w.tiempo-ha, w.acaso, w.morir] }
      - { es: "«Sea lo que fuere», dijo el juez, «la ley se aplicará»: el futuro de subjuntivo sobrevive en el lenguaje jurídico.", en: "'Be that as it may,' said the judge, 'the law will be applied': the future subjunctive survives in legal language.", grammar: [g.archaic-forms, g.future-subjunctive], vocab: [w.fuere, w.juridico, w.subjuntivo, w.juez, w.ley] }
      - { es: "Aquí yace un hombre que temió a Dios y a nadie más.", en: "Here lies a man who feared God and no one else.", grammar: [g.archaic-forms, g.relative-que-quien], vocab: [w.yacer, w.temer, w.nadie] }
      - { es: "«Aqueste castillo», leyó el guía, y añadió: «es decir, este castillo».", en: "'Aqueste castillo,' read the guide, and added: 'that is, this castle'.", grammar: [g.archaic-forms, g.demonstratives], vocab: [w.aqueste, w.castillo, w.guia, w.anadir] }
      - { es: "«Vide» por «vi» y «truje» por «traje» todavía se oyen en zonas rurales de España y América.", en: "'Vide' for 'vi' and 'truje' for 'traje' can still be heard in rural areas of Spain and America.", grammar: [g.archaic-forms, g.se-passive], vocab: [w.vide, w.rural, w.zona] }
      - { es: "Los refranes conservan arcaísmos: «a quien madruga, Dios le ayuda» mantiene un orden muy antiguo.", en: "Proverbs preserve archaisms: 'a quien madruga, Dios le ayuda' keeps a very old word order.", grammar: [g.archaic-forms, g.proverbs], vocab: [w.refran, w.arcaismo, w.conservar, w.madrugar, w.orden] }
      - { es: "Harto difícil es leer a Góngora sin notas, mas no imposible.", en: "It is exceedingly difficult to read Góngora without notes, but not impossible.", altEs: ["Es muy difícil leer a Góngora sin notas, pero no imposible."], grammar: [g.archaic-forms, g.a-personal], vocab: [w.harto.adv, w.mas, w.dificil, w.imposible] }
      - { es: "Quería venir, pero no pudo.", en: "He wanted to come, but couldn't.", grammar: [g.archaic-forms, g.connectors-contrast], vocab: [w.mas, w.venir], error: { wrong: "Quería venir, más no pudo.", explain: "The archaic conjunction «mas» (= pero) has no accent; «más» with an accent means more.", grammar: g.archaic-forms } }
      - { es: "Hace mucho tiempo que no llueve, pero el río sigue lleno.", en: "It hasn't rained for a long time, but the river is still full.", grammar: [g.archaic-forms, g.desde-hace], vocab: [w.tiempo-ha, w.mas, w.llover, w.rio], transform: { instruction: "Rewrite in literary style with «tiempo ha» and «mas»", answer: "Tiempo ha que no llueve, mas el río sigue lleno.", alt: ["Tiempo ha que no llueve, mas el río sigue lleno de agua."] } }
      - { es: "No te preocupes por el «so» de «so pena de»: es la única frase donde sobrevive esa preposición.", en: "Don't worry about the 'so' in 'so pena de': it is the only phrase where that preposition survives.", grammar: [g.archaic-forms, g.imperative-negative], vocab: [w.so, w.so-pena-de, w.preocuparse, w.frase] }
    exchanges:
      - q: { es: "¿«Mas» y «más» son lo mismo?", en: "Are 'mas' and 'más' the same thing?" }
        a: { es: "No: «mas» sin tilde es «pero»; «más» con tilde es lo contrario de «menos».", en: "No: 'mas' without an accent is 'but'; 'más' with an accent is the opposite of 'less'." }
        alt: ["No, mas sin tilde significa pero.", "No: mas es pero y más es lo contrario de menos."]
        grammar: [g.archaic-forms, g.stress-and-tilde]
        vocab: [w.mas, w.tilde, w.contrario]
      - q: { es: "¿Dónde se sigue usando el futuro de subjuntivo?", en: "Where is the future subjunctive still used?" }
        a: { es: "En las leyes y en frases hechas: «sea lo que fuere», «quien hubiere».", en: "In laws and in set phrases: 'sea lo que fuere', 'quien hubiere'." }
        alt: ["En el lenguaje jurídico.", "En las leyes y en algunas frases hechas."]
        grammar: [g.archaic-forms, g.future-subjunctive]
        vocab: [w.fuere, w.subjuntivo, w.ley]
      - q: { es: "¿Qué pone en la tumba?", en: "What does it say on the grave?" }
        a: { es: "«Aquí yace don Pedro, que temió a Dios».", en: "'Here lies Don Pedro, who feared God'." }
        alt: ["Aquí yace don Pedro.", "Pone «aquí yace don Pedro»."]
        grammar: [g.archaic-forms]
        vocab: [w.yacer, w.temer, w.tumba]
      - q: { es: "¿Está permitido aparcar aquí?", en: "Is parking allowed here?" }
        a: { es: "No, está prohibido so pena de multa.", en: "No, it is forbidden on pain of a fine." }
        alt: ["No, so pena de multa.", "No, está prohibido."]
        grammar: [g.archaic-forms, g.impersonal-expressions]
        vocab: [w.so-pena-de, w.aparcar, w.multa]
    texts:
      - title: "Inscripción en una iglesia"
        es: ["Aquí yace doña Leonor, que vivió harto poco.", "Murió el año de mil seiscientos y diez.", "Rogad a Dios por su alma."]
        en: ["Here lies Doña Leonor, who lived all too briefly.", "She died in the year sixteen hundred and ten.", "Pray to God for her soul."]
        grammar: [g.archaic-forms, g.imperative-vosotros]
        vocab: [w.yacer, w.harto.adv, w.alma, w.rogar]
      - title: "Aviso en un edificio antiguo"
        es: ["Prohibido el paso so pena de multa.", "Esta escalera, otrora de uso público, es hoy privada.", "Los visitantes han de usar la puerta principal."]
        en: ["No entry, on pain of a fine.", "This staircase, formerly for public use, is now private.", "Visitors must use the main door."]
        grammar: [g.archaic-forms, g.periphrases-modal]
        vocab: [w.so-pena-de, w.haber-de, w.escalera]
  - id: c2.u02.l4
    title: Hipérbaton y endecasílabos
    teach: [g.poetic-syntax]
    vocab: [w.encabalgamiento, w.sinalefa, w.silaba, w.vocal, w.metrica, w.rimar, w.octosilabo, w.endecasilabo, w.alejandrino, w.romance, w.consonante, w.asonante, w.copla, w.cuarteto, w.terceto, w.aliteracion, w.arpa, w.polvo, w.angulo, w.agudo, w.esdrujulo, w.par, w.impar]
    tip: "Count syllables with sinalefa (vowels across words merge); add one if the line ends in a stressed syllable, subtract one if it ends esdrújulo. Octosyllable = romance and copla; hendecasyllable = sonnet; alexandrine = fourteen."
    sentences:
      - { es: "«Del salón en el ángulo oscuro, de su dueña tal vez olvidada, silenciosa y cubierta de polvo veíase el arpa»: así empieza una rima de Bécquer.", en: "'In the dark corner of the room, perhaps forgotten by its owner, silent and covered in dust, the harp could be seen': so begins one of Bécquer's Rimas.", grammar: [g.poetic-syntax], vocab: [w.arpa, w.polvo, w.salon, w.dueno, w.rima, w.hiperbaton] }
      - { es: "Sin hipérbaton, el verso diría «el arpa se veía en el ángulo oscuro del salón».", en: "Without hyperbaton, the line would say 'the harp could be seen in the dark corner of the room'.", grammar: [g.poetic-syntax, g.conditional-simple], vocab: [w.hiperbaton, w.verso, w.arpa] }
      - { es: "Un endecasílabo tiene once sílabas; el soneto se compone de catorce endecasílabos.", en: "A hendecasyllable has eleven syllables; the sonnet is made up of fourteen hendecasyllables.", altEs: ["Un endecasílabo tiene once sílabas; el soneto está formado por catorce endecasílabos."], grammar: [g.poetic-syntax, g.numbers-1-100], vocab: [w.endecasilabo, w.silaba, w.soneto] }
      - { es: "El octosílabo es el verso del romance y de la copla: el verso del pueblo.", en: "The octosyllable is the line of the romance and the copla: the people's line.", grammar: [g.poetic-syntax], vocab: [w.octosilabo, w.romance, w.copla, w.verso] }
      - { es: "Para contar sílabas, une las vocales de palabras distintas: eso es la sinalefa.", en: "To count syllables, join the vowels of different words: that is sinalefa.", grammar: [g.poetic-syntax, g.imperative-tu], vocab: [w.sinalefa, w.silaba] }
      - { es: "Si el verso termina en palabra aguda, se cuenta una sílaba más; si termina en esdrújula, una menos.", en: "If the line ends in a word stressed on the last syllable, one more syllable is counted; if it ends in an esdrújula, one fewer.", grammar: [g.poetic-syntax, g.si-present-future, g.stress-and-tilde], vocab: [w.agudo, w.silaba, w.verso] }
      - { es: "La rima consonante repite todos los sonidos desde la vocal tónica; la asonante, solo las vocales.", en: "Consonant rhyme repeats all the sounds from the stressed vowel; assonant rhyme, only the vowels.", grammar: [g.poetic-syntax], vocab: [w.consonante, w.asonante, w.rima, w.sonido] }
      - { es: "El romance tiene rima asonante en los versos pares y deja libres los impares.", en: "The romance has assonant rhyme in the even lines and leaves the odd ones free.", grammar: [g.poetic-syntax], vocab: [w.romance, w.asonante, w.rima] }
      - { es: "El alejandrino, de catorce sílabas, fue el verso favorito de Rubén Darío.", en: "The alexandrine, of fourteen syllables, was Rubén Darío's favourite line.", grammar: [g.poetic-syntax, g.preterite-ser-ir], vocab: [w.alejandrino, w.silaba, w.favorito] }
      - { es: "«Sobre el olivar se vio a la lechuza volar y volar»: Machado repite el verbo y crea ritmo.", en: "'Over the olive grove the owl was seen flying and flying': Machado repeats the verb and creates rhythm.", grammar: [g.poetic-syntax, g.se-passive], vocab: [w.ritmo, w.volar, w.repetir, w.verbo] }
      - { es: "Cuando una frase no termina al final del verso y sigue en el siguiente, hay encabalgamiento.", en: "When a sentence does not end at the end of the line and continues into the next, there is enjambment.", grammar: [g.poetic-syntax, g.mientras-cuando], vocab: [w.encabalgamiento, w.verso, w.frase] }
      - { es: "La aliteración repite un sonido: «en el silencio solo se escuchaba un susurro de abejas que sonaba».", en: "Alliteration repeats a sound: 'in the silence only a murmur of bees could be heard sounding'.", grammar: [g.poetic-syntax, g.se-passive], vocab: [w.aliteracion, w.sonido, w.silencio], note: "Garcilaso de la Vega, Égloga III." }
      - { es: "¿Cuántas estrofas tiene un soneto? Dos cuartetos y dos tercetos.", en: "How many stanzas does a sonnet have? Two quatrains and two tercets.", grammar: [g.poetic-syntax, g.question-words], vocab: [w.estrofa, w.soneto] }
      - { es: "Veíase el arpa en el rincón.", en: "The harp could be seen in the corner.", altEs: ["Se veía el arpa en el rincón."], grammar: [g.poetic-syntax, g.pronoun-placement], vocab: [w.arpa, w.rincon], error: { wrong: "Se veíase el arpa en el rincón.", explain: "The enclitic -se already is the pronoun; do not double it: veíase = se veía.", grammar: g.poetic-syntax } }
      - { es: "El arpa se veía en el ángulo oscuro del salón.", en: "The harp could be seen in the dark corner of the room.", grammar: [g.poetic-syntax], vocab: [w.hiperbaton, w.arpa, w.salon], transform: { instruction: "Reorder it as a hyperbaton, starting with «Del salón»", answer: "Del salón en el ángulo oscuro se veía el arpa.", alt: ["Del salón en el ángulo oscuro veíase el arpa."] } }
      - { es: "Hoy muchos poetas escriben en verso libre, sin rima ni métrica fija, pero el ritmo sigue importando.", en: "Today many poets write in free verse, without rhyme or fixed metre, but rhythm still matters.", altEs: ["Hoy muchos poetas escriben en verso libre, sin rima ni métrica fija, aunque el ritmo sigue importando."], grammar: [g.poetic-syntax, g.periphrases-aspect], vocab: [w.poeta, w.verso, w.metrica, w.rima, w.ritmo] }
    exchanges:
      - q: { es: "¿Cuántas sílabas tiene «mientras por competir con tu cabello»?", en: "How many syllables does 'mientras por competir con tu cabello' have?" }
        a: { es: "Once: es un endecasílabo perfecto.", en: "Eleven: it is a perfect hendecasyllable." }
        alt: ["Once.", "Tiene once: es un endecasílabo."]
        grammar: [g.poetic-syntax]
        vocab: [w.silaba, w.endecasilabo]
      - q: { es: "¿Qué es un hipérbaton?", en: "What is a hyperbaton?" }
        a: { es: "Un cambio del orden normal de las palabras, muy típico de la poesía.", en: "A change in the normal order of words, very typical of poetry." }
        alt: ["Cambiar el orden de las palabras.", "Un cambio en el orden de las palabras."]
        grammar: [g.poetic-syntax]
        vocab: [w.hiperbaton, w.orden, w.poesia]
      - q: { es: "¿Rima asonante o consonante: «casa» y «mata»?", en: "Assonant or consonant rhyme: 'casa' and 'mata'?" }
        a: { es: "Asonante: solo coinciden las vocales a-a.", en: "Assonant: only the vowels a-a coincide." }
        alt: ["Asonante.", "Es asonante."]
        grammar: [g.poetic-syntax]
        vocab: [w.asonante, w.consonante, w.coincidir]
      - q: { es: "¿Por qué el romance es tan popular?", en: "Why is the romance so popular?" }
        a: { es: "Porque el octosílabo es el ritmo natural del habla y se recuerda fácilmente.", en: "Because the octosyllable is the natural rhythm of speech and is easily remembered." }
        alt: ["Porque es fácil de recordar.", "Porque el octosílabo es el ritmo natural del habla."]
        grammar: [g.poetic-syntax, g.se-passive]
        vocab: [w.romance, w.octosilabo, w.ritmo]
    texts:
      - title: "Apunte de clase"
        es: ["Soneto: catorce endecasílabos.", "Dos cuartetos con rima ABBA y dos tercetos.", "Si el verso acaba en aguda, suma una sílaba."]
        en: ["Sonnet: fourteen hendecasyllables.", "Two quatrains with ABBA rhyme and two tercets.", "If the line ends in a stressed syllable, add one syllable."]
        grammar: [g.poetic-syntax, g.imperative-tu]
        vocab: [w.soneto, w.endecasilabo, w.rima, w.agudo, w.silaba]
      - title: "Mensaje a un compañero"
        es: ["Oye, ¿cómo se cuentan las sílabas con sinalefa?", "El profe dijo que las vocales de dos palabras se unen.", "Pásame tus apuntes, que mañana hay examen de métrica."]
        en: ["Hey, how do you count syllables with sinalefa?", "The teacher said the vowels of two words join together.", "Send me your notes, because tomorrow there's a metrics exam."]
        grammar: [g.poetic-syntax, g.reported-speech-past]
        vocab: [w.silaba, w.sinalefa, w.metrica, w.apuntes]
dialogues:
  - id: c2.u02.d1
    title: Después de la comedia
    context: Irene and Pablo leave the corral de comedias in Almagro after a performance of a play by Lope de Vega.
    lines:
      - { speaker: Irene, es: "¿Qué te ha parecido? Yo no esperaba entender tanto; pensaba que el castellano del siglo XVII sería mucho más difícil.", en: "What did you think? I didn't expect to understand so much; I thought seventeenth-century Castilian would be much harder." }
      - { speaker: Pablo, es: "Se entiende casi todo. Lo que me pierde son los pronombres detrás del verbo: «díjole», «hízose»… tardo un segundo en darles la vuelta.", en: "You understand almost everything. What throws me are the pronouns after the verb: 'díjole', 'hízose'… it takes me a second to turn them round." }
      - { speaker: Irene, es: "A mí me ha encantado el gracioso. Dice más verdades que el galán, mas nadie le hace caso.", en: "I loved the gracioso. He tells more truths than the leading man, but nobody listens to him." }
      - { speaker: Pablo, es: "¡Has dicho «mas» sin tilde! Se te ha pegado el estilo.", en: "You said 'mas' without an accent! The style has rubbed off on you." }
      - { speaker: Irene, es: "Es que suena bien. Y lo de la honra: el padre prefiere morir antes que vivir con un agravio sin vengar. Qué mundo tan duro.", en: "It's just that it sounds good. And the honour thing: the father would rather die than live with an unavenged affront. What a hard world." }
      - { speaker: Pablo, es: "Para eso iban al teatro: a ver cómo se vengaba un villano del noble que lo había humillado, aunque en la vida real fuera imposible.", en: "That's what they went to the theatre for: to see how a commoner took revenge on the noble who had humiliated him, even if in real life it was impossible." }
      - { speaker: Irene, es: "¿Te has fijado en los versos? Octosílabos casi todo el tiempo, y de pronto un soneto cuando el galán se queda solo.", en: "Did you notice the lines? Octosyllables almost all the time, and suddenly a sonnet when the leading man is left alone." }
      - { speaker: Pablo, es: "Lope lo explica en su «Arte nuevo»: el soneto está bien para los que aguardan, y el romance para contar.", en: "Lope explains it in his 'Arte nuevo': the sonnet is good for those who wait, and the romance for narrating." }
      - { speaker: Irene, es: "Pues yo aguardo una cena, so pena de desmayo. ¿Vamos a la posada de la plaza?", en: "Well, I await a dinner, on pain of fainting. Shall we go to the inn in the square?" }
      - { speaker: Pablo, es: "Vamos, que tiempo ha que no comemos. Y de postre, un soneto de Quevedo a una nariz.", en: "Let's go, it's been ages since we ate. And for dessert, a Quevedo sonnet to a nose." }
    questions:
      - { q: "What does Pablo find hardest to follow in the play?", options: ["The honour code", "Enclitic pronouns after the verb", "The octosyllables"], answer: 1 }
      - { q: "According to Pablo, why did Golden Age audiences enjoy revenge plots?", options: ["They saw a commoner avenge himself on a noble, which was impossible in real life", "They disliked the gracioso", "They wanted to learn sonnets"], answer: 0 }
      - { q: "Which verse form appears when the leading man is alone?", options: ["A romance", "A copla", "A sonnet"], answer: 2 }
