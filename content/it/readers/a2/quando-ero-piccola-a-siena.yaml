id: r.a2.quando-ero-piccola-a-siena
level: a2
title: Quando ero piccola a Siena
kind: text
intro: Nonna Lucia remembers her childhood in Siena in the 1950s – and the Palio, the horse race that the whole city waited for all year. Notice the imperfetto for habits and descriptions.
allow: [lucia, oca, campo, contrade, palio]
paragraphs:
  - { es: "Quando ero piccola abitavo a Siena, in una casa vecchia vicino a Piazza del Campo. Eravamo una famiglia numerosa: c'erano i miei genitori, i nonni, io e i miei quattro fratelli. La casa era piccola e un po' buia, ma era sempre piena di gente e di rumore.", en: "When I was little I lived in Siena, in an old house near Piazza del Campo. We were a big family: there were my parents, my grandparents, me and my four brothers. The house was small and a bit dark, but it was always full of people and noise." }
  - { es: "Mio padre faceva il falegname e lavorava tutto il giorno nel suo piccolo negozio sotto casa. Mia madre cucinava, lavava e cuciva per tutti. Noi bambini andavamo a scuola la mattina e il pomeriggio giocavamo in strada fino a sera. Non avevamo molti giocattoli: giocavamo a nascondino, a palla, e con una bambola di stoffa che mia nonna aveva fatto per me.", en: "My father was a carpenter and worked all day in his little shop below our house. My mother cooked, washed and sewed for everyone. We children went to school in the morning and in the afternoon we played in the street until evening. We didn't have many toys: we played hide-and-seek, ball, and with a rag doll that my grandmother had made for me." }
  - { es: "Ma il momento più bello dell'anno era il Palio. Ogni contrada di Siena ha un nome e un simbolo: la nostra era la contrada dell'Oca. Già a giugno tutti parlavano solo del Palio. Gli uomini preparavano le bandiere e i bambini cantavano le canzoni della contrada per le strade.", en: "But the best moment of the year was the Palio. Every contrada (district) of Siena has a name and a symbol: ours was the contrada of the Goose. Already in June everyone talked only about the Palio. The men prepared the flags and the children sang the contrada's songs in the streets." }
  - { es: "Il due luglio la piazza era piena di gente. Io ero piccola e non vedevo niente, così mio padre mi teneva sulle spalle. La corsa durava solo un minuto e mezzo, ma il mio cuore batteva fortissimo. Quando vinceva l'Oca, tutta la contrada piangeva e rideva insieme, e quella sera mangiavamo tutti a una lunga tavola in strada.", en: "On the second of July the square was full of people. I was small and couldn't see anything, so my father carried me on his shoulders. The race lasted only a minute and a half, but my heart beat really fast. When the Goose won, the whole contrada cried and laughed together, and that evening we all ate at one long table in the street." }
  - { es: "Oggi abito a Firenze, ma ogni estate torno a Siena per il Palio. I miei nipoti mi prendono in giro: «Nonna, sei ancora una bambina!» Forse hanno ragione.", en: "Today I live in Florence, but every summer I go back to Siena for the Palio. My grandchildren tease me: 'Grandma, you're still a little girl!' Maybe they're right." }
questions:
  - { q: "Che lavoro faceva il padre di Lucia?", options: ["Il cuoco", "Il falegname", "Il fantino"], answer: 1, explain: "«Mio padre faceva il falegname» – fare + article + job, in the imperfetto because it was his habitual job." }
  - { q: "Con che cosa giocavano i bambini?", options: ["Con molti giocattoli moderni", "Con una palla e una bambola di stoffa", "Con il computer"], answer: 1, explain: "They didn't have many toys: they played hide-and-seek, ball and with a rag doll." }
  - { q: "Qual era la contrada della famiglia di Lucia?", options: ["L'Oca", "Il Campo", "La Torre"], answer: 0, explain: "«La nostra era la contrada dell'Oca» – the Goose." }
  - { q: "Perché il padre teneva Lucia sulle spalle?", options: ["Perché era stanca", "Perché era piccola e non vedeva niente", "Perché pioveva"], answer: 1, explain: "«Io ero piccola e non vedevo niente, così mio padre mi teneva sulle spalle.»" }
  - { q: "Quanto durava la corsa?", options: ["Un minuto e mezzo", "Un'ora", "Tutto il giorno"], answer: 0, explain: "The Palio race is famously short: about ninety seconds." }
glossary:
  - { es: numerosa, en: large (of a family) }
  - { es: buia, en: dark }
  - { es: tavola, en: table (for eating) }
  - { es: stoffa, en: cloth, fabric }
  - { es: aveva fatto, en: had made }
  - { es: oca, en: goose }
  - { es: batteva, en: beat }
  - { es: fortissimo, en: very hard, very fast }
  - { es: prendono in giro, en: they tease }
