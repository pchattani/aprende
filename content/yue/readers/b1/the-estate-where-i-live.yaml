id: r.b1.the-estate-where-i-live
level: b1
title: 我住嘅屋邨
kind: text
intro: Mr Ho, a retired bus driver, has lived in the same public housing estate in Tsuen Wan for forty years. He describes the estate, the neighbours who have become family, and the old Hakka walled village down the road.
allow: [何生, 何太, 陳師奶]
paragraphs:
  - { es: "我姓何，今年七十二歲，以前係巴士司機，而家已經退休。我同我太太喺荃灣一個公共屋邨住咗四十年。我哋住嘅單位唔大，得三百幾呎，但係我哋喺度養大咗兩個仔女，有好多開心嘅回憶。", en: "My surname is Ho. I'm seventy-two this year, I used to be a bus driver and I'm now retired. My wife and I have lived in a public housing estate in Tsuen Wan for forty years. The flat we live in isn't big, just over three hundred square feet, but we raised two children here and have lots of happy memories." }
  - { es: "我哋嘅屋邨有八座樓，每座有三十幾層。樓下有街市、茶餐廳、診所同一個細細嘅公園。我哋成日話，住喺屋邨唔使出去都可以過一世：買餸、睇醫生、剪頭髮，行幾分鐘就搞掂。", en: "Our estate has eight blocks, each over thirty storeys high. Downstairs there's a market, a cha chaan teng, a clinic and a small park. We often say that you could live your whole life on the estate without ever leaving: buying groceries, seeing the doctor, getting a haircut - all done within a few minutes' walk." }
  - { es: "不過對我嚟講，屋邨最好嘅唔係設施，而係啲街坊。住我隔籬嘅陳師奶，認識咗我哋成四十年。我太太入醫院嗰陣，佢日日煲湯送去醫院；佢老公過身嗰年，我哋就成日請佢過嚟食飯。對面嗰個單位住咗一對後生夫婦，佢哋有個三歲嘅仔，叫我做「何爺爺」。", en: "But for me, the best thing about the estate isn't the facilities, it's the neighbours. Mrs Chan, who lives next door, has known us for a full forty years. When my wife was in hospital, she made soup every day and took it to the hospital; the year her husband passed away, we often invited her over for dinner. In the flat opposite lives a young couple with a three-year-old son, who calls me \"Grandpa Ho\"." }
  - { es: "我記得我哋啱啱搬嚟嘅時候，荃灣同而家好唔同。以前呢度有好多工廠，好多人喺工廠返工；而家啲工廠大部分都搬走咗，變成商場同寫字樓。不過有啲嘢一直冇變，例如屋邨樓下嗰間茶餐廳，老闆由我後生做到而家，佢啲奶茶仲係咁好飲。", en: "I remember that when we first moved here, Tsuen Wan was very different from today. In the past there were lots of factories here and many people worked in them; now most of the factories have moved away and become shopping centres and office buildings. But some things have never changed. For example, the cha chaan teng downstairs: the owner has been running it since I was young, and his milk tea is still just as good." }
  - { es: "離我哋屋邨唔遠，有一條叫三棟屋嘅圍村。三棟屋係客家陳氏喺一七八六年起嘅，而家變咗博物館，可以免費入去參觀。我成日帶對面嗰個細路去嗰度，話佢聽以前嘅人點樣耕田、煮飯同過日子。佢最鍾意睇嗰啲舊農具，每次都問：「何爺爺，你細個係咪用呢啲㗎？」", en: "Not far from our estate is a walled village called Sam Tung Uk. Sam Tung Uk was built by the Hakka Chan clan in 1786, and now it's a museum that you can visit for free. I often take the little boy from across the corridor there and tell him how people used to farm, cook and live. He loves looking at the old farming tools, and every time he asks: \"Grandpa Ho, did you use these when you were little?\"" }
  - { es: "我話：「我冇咁老呀！」不過老實講，我細個喺鄉下都真係耕過田。所以每次見到嗰啲農具，我都會諗起我阿爸，同埋嗰啲冇電視、冇冷氣嘅日子。", en: "I say: \"I'm not that old!\" But to be honest, when I was a boy in my home village I really did farm. So every time I see those tools, I think of my father, and of those days without television or air conditioning." }
  - { es: "我個仔叫我哋搬去同佢住，佢喺將軍澳買咗一個單位，有會所同泳池。佢話：「你哋年紀大，同我哋一齊住，我哋可以照顧你哋。」我同太太諗咗好耐，最後都係決定留喺度。新屋苑好靚，但係嗰度冇人識我哋。喺呢度，我落樓食早餐，個個都同我打招呼。", en: "My son has asked us to move in with him. He has bought a flat in Tseung Kwan O with a clubhouse and a swimming pool. He says: \"You're getting old. If you live with us, we can look after you.\" My wife and I thought about it for a long time, but in the end we decided to stay here. The new estate is lovely, but nobody there knows us. Here, when I go downstairs for breakfast, everyone says hello to me." }
  - { es: "有人話屋邨又舊又窄，但係我覺得，一個地方好唔好，唔係睇佢有幾大、有幾靚，而係睇住喺度嘅人。對我嚟講，呢度就係屋企。", en: "Some people say the estates are old and cramped, but I think whether a place is good doesn't depend on how big or beautiful it is, but on the people who live there. To me, this is home." }
questions:
  - { q: "何生以前做咩工作？", options: ["巴士司機", "工廠工人", "茶餐廳老闆"], answer: 0, explain: "以前係巴士司機，而家已經退休." }
  - { q: "何生覺得屋邨最好嘅係乜嘢？", options: ["設施", "啲街坊", "樓價平"], answer: 1, explain: "屋邨最好嘅唔係設施，而係啲街坊." }
  - { q: "三棟屋係乜嘢？", options: ["一個新屋苑", "一條客家圍村，而家係博物館", "一間工廠"], answer: 1, explain: "三棟屋係客家陳氏喺一七八六年起嘅，而家變咗博物館." }
  - { q: "對面嗰個細路叫何生做乜嘢？", options: ["何生", "何爺爺", "阿伯"], answer: 1, explain: "叫我做「何爺爺」." }
  - { q: "點解何生同太太唔搬去將軍澳？", options: ["因為將軍澳太遠", "因為佢哋想留喺識佢哋嘅地方", "因為個仔唔想佢哋搬"], answer: 1, explain: "新屋苑好靚，但係嗰度冇人識我哋. Here everyone greets them." }
