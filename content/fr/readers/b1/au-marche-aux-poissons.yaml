id: r.b1.au-marche-aux-poissons
level: b1
title: Au Vieux-Port, je vous le mets ?
kind: dialogue
intro: Early morning at the fish market on Marseille's Vieux-Port. Nadia, who is from Marseille, takes her English friend Tom shopping for a bouillabaisse. Listen to the double pronouns (je vous le mets, je te les rends).
allow: [nadia, tom, rascasse, rascasses, congre, rouille, ok]
paragraphs:
  - { es: "Nadia : Dépêche-toi, Tom ! Les pêcheurs arrivent vers huit heures et à dix heures, il ne reste plus rien. Les meilleurs poissons partent en premier.", en: "Nadia: Hurry up, Tom! The fishermen arrive around eight, and by ten there's nothing left. The best fish go first." }
  - { es: "Tom : C'est ici, le marché ? Je pensais que c'était un grand bâtiment. Ce ne sont que quelques tables sur le quai !", en: "Tom: This is the market? I thought it was a big building. It's just a few tables on the quay!" }
  - { es: "Nadia : Oui, et c'est ça qui est génial. Les pêcheurs vendent directement ce qu'ils ont pêché pendant la nuit. Ça se passe comme ça depuis des siècles. Tu sais que Marseille a été fondée par des marins grecs, il y a plus de deux mille six cents ans ? Ils sont arrivés exactement ici, dans ce port.", en: "Nadia: Yes, and that's what's great about it. The fishermen sell directly what they caught during the night. It's been like this for centuries. Did you know Marseille was founded by Greek sailors more than two thousand six hundred years ago? They arrived exactly here, in this port." }
  - { es: "Tom : Et ce grand miroir au-dessus de nous, il est grec aussi ?", en: "Tom: And this big mirror above us, is it Greek too?" }
  - { es: "Nadia : (rire) Non, ça, c'est l'Ombrière, de l'architecte Norman Foster. Elle date de 2013. Regarde en haut : tu te vois la tête en bas ! Bon, allons-y. Bonjour, madame ! Qu'est-ce que vous avez de beau ce matin ?", en: "Nadia: (laughing) No, that's the Ombrière, by the architect Norman Foster. It dates from 2013. Look up: you can see yourself upside down! Right, let's go. Good morning! What have you got that's nice this morning?" }
  - { es: "La poissonnière : Bonjour, ma belle ! J'ai des rougets, des dorades et des rascasses toutes fraîches. Mon mari les a pêchées cette nuit.", en: "Fishwife: Morning, love! I've got red mullet, sea bream and scorpion fish, all fresh. My husband caught them last night." }
  - { es: "Nadia : Parfait. Je fais une bouillabaisse pour six personnes. Qu'est-ce que vous me conseillez ?", en: "Nadia: Perfect. I'm making a bouillabaisse for six people. What do you recommend?" }
  - { es: "La poissonnière : Pour une vraie bouillabaisse, il faut au moins quatre ou cinq poissons différents, et surtout de la rascasse. Sans rascasse, ce n'est pas une bouillabaisse, c'est une soupe de poisson ! Je vous mets deux rascasses, un congre et quelques rougets ?", en: "Fishwife: For a real bouillabaisse you need at least four or five different fish, and above all scorpion fish. Without scorpion fish it's not a bouillabaisse, it's fish soup! Shall I give you two scorpion fish, a conger eel and a few red mullet?" }
  - { es: "Nadia : Oui, très bien. Vous pouvez me les nettoyer, s'il vous plaît ?", en: "Nadia: Yes, very good. Could you clean them for me, please?" }
  - { es: "La poissonnière : Bien sûr, je vous les nettoie tout de suite. Et le monsieur, il ne parle pas ?", en: "Fishwife: Of course, I'll clean them for you right away. And the gentleman, doesn't he talk?" }
  - { es: "Tom : Si, si ! Je suis anglais. Excusez-moi, mais pourquoi la bouillabaisse est-elle si célèbre ? C'est juste une soupe, non ?", en: "Tom: Yes, I do! I'm English. Excuse me, but why is bouillabaisse so famous? It's just a soup, isn't it?" }
  - { es: "La poissonnière : Juste une soupe ? Oh, malheureux ! Autrefois, c'était le plat des pêcheurs. Ils cuisaient les poissons qu'ils n'avaient pas vendus, avec de l'huile d'olive, des tomates, de l'ail et du safran. Aujourd'hui, on la sert en deux fois : d'abord le bouillon avec du pain et de la rouille, ensuite les poissons. Votre amie va vous la préparer, vous verrez.", en: "Fishwife: Just a soup? Oh, you poor thing! In the old days it was the fishermen's dish. They cooked the fish they hadn't sold, with olive oil, tomatoes, garlic and saffron. Today it's served in two stages: first the broth with bread and rouille, then the fish. Your friend is going to make it for you, you'll see." }
  - { es: "Nadia : Ça fait combien ?", en: "Nadia: How much is that?" }
  - { es: "La poissonnière : Quarante-huit euros, ma belle.", en: "Fishwife: Forty-eight euros, love." }
  - { es: "Nadia : Oh non… Je n'ai que trente euros sur moi, et elle ne prend pas la carte. Tom, tu peux me prêter vingt euros ? Je te les rends ce soir, promis.", en: "Nadia: Oh no… I've only got thirty euros on me, and she doesn't take cards. Tom, can you lend me twenty euros? I'll give it back to you tonight, I promise." }
  - { es: "Tom : Pas de problème, je te les prête. Mais à une condition : c'est moi qui choisis le vin ce soir !", en: "Tom: No problem, I'll lend it to you. But on one condition: I choose the wine tonight!" }
  - { es: "La poissonnière : Voilà vos poissons. Et je vous donne aussi un peu de persil, je vous l'offre. Bon appétit, et revenez me dire si elle était bonne, votre bouillabaisse !", en: "Fishwife: Here's your fish. And I'll give you a bit of parsley too, it's on the house. Enjoy your meal, and come back and tell me if your bouillabaisse was good!" }
  - { es: "Tom : Promis, madame. Et la prochaine fois, je vous parlerai en français, avec l'accent de Marseille !", en: "Tom: Promise. And next time I'll talk to you in French, with a Marseille accent!" }
questions:
  - { q: "Pourquoi Nadia demande-t-elle à Tom de se dépêcher ?", options: ["Parce que le marché ferme à huit heures", "Parce que les meilleurs poissons partent en premier", "Parce qu'il va pleuvoir"], answer: 1, explain: "«À dix heures, il ne reste plus rien. Les meilleurs poissons partent en premier.»" }
  - { q: "Qu'est-ce qui surprend Tom quand il arrive au marché ?", options: ["C'est seulement quelques tables sur le quai", "C'est un grand bâtiment moderne", "Il n'y a pas de poissons"], answer: 0, explain: "«Je pensais que c'était un grand bâtiment. Ce ne sont que quelques tables sur le quai !»" }
  - { q: "Selon la poissonnière, quel poisson est indispensable dans une vraie bouillabaisse ?", options: ["Le rouget", "La dorade", "La rascasse"], answer: 2, explain: "«Sans rascasse, ce n'est pas une bouillabaisse, c'est une soupe de poisson !»" }
  - { q: "Dans « Je te les rends ce soir », que remplace « les » ?", options: ["Les poissons", "Les vingt euros", "Les tomates"], answer: 1, explain: "Nadia borrows twenty euros: je te les rends = I'll give them (the euros) back to you." }
  - { q: "Que demande Tom en échange ?", options: ["De choisir le vin", "De faire la cuisine", "Un poisson gratuit"], answer: 0, explain: "«À une condition : c'est moi qui choisis le vin ce soir !»" }
glossary:
  - { es: "tête en bas", en: upside down }
  - { es: "ma belle", en: "love, dear (friendly, southern)" }
  - { es: congre, en: conger eel }
  - { es: malheureux, en: "you poor thing (lit. unhappy one)" }
  - { es: bouillon, en: broth }
  - { es: rouille, en: garlic and saffron mayonnaise }
  - { es: persil, en: parsley }
