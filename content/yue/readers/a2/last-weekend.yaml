id: r.a2.last-weekend
level: a2
title: 上個週末
kind: text
intro: Mandy writes about a busy weekend in Kowloon - shaking fortune sticks at Wong Tai Sin, a quiet walk in Nan Lian Garden and a concert at the Hong Kong Coliseum.
paragraphs:
  - { es: "上個週末好忙，不過好開心。禮拜六朝早，我同媽媽去黃大仙祠拜神。媽媽每年都去，佢話黃大仙好靈㗎。我哋九點去到，已經好多人喺度排隊。", en: "Last weekend was busy, but lots of fun. On Saturday morning my mum and I went to Wong Tai Sin Temple to pray. Mum goes every year; she says Wong Tai Sin really answers prayers. We got there at nine, and lots of people were already queuing." }
  - { es: "首先，我哋買咗香，然後喺大殿前面拜神。跟住媽媽求籤：佢跪喺度，搖個籤筒，搖咗好耐，終於跌咗一枝籤出嚟。佢拎住枝籤去搵解籤師傅。師傅話：「好籤！今年你屋企人身體健康，冇病冇痛。」媽媽笑到好開心。", en: "First we bought incense, then prayed in front of the main hall. Next Mum shook the fortune sticks: she knelt, shook the bamboo cylinder for a long time, and finally one stick fell out. She took the stick to a fortune-teller to have it read. He said: \"A good stick! This year your family will be healthy and free of illness.\" Mum was all smiles." }
  - { es: "拜完神，我哋坐咗一個站地鐵去鑽石山，行咗去南蓮園池。南蓮園池係一個唐朝風格嘅中式花園，好靜，好靚，有池塘、荷花同好多樹。我哋喺度行咗一個鐘，影咗好多相。之後我哋去隔籬嘅志蓮淨苑，食咗一餐齋菜，好好食。", en: "After praying, we took the MTR one stop to Diamond Hill and walked to Nan Lian Garden. Nan Lian Garden is a Chinese garden in the Tang dynasty style. It's very quiet and beautiful, with a pond, lotus flowers and lots of trees. We walked around for an hour and took lots of photos. After that we went to Chi Lin Nunnery next door for a vegetarian meal, which was delicious." }
  - { es: "禮拜六夜晚，我同Ana去紅磡紅館睇演唱會。紅館一九八三年開幕，好多出名歌手都喺度開過演唱會。嗰晚嘅歌手係Ana最鍾意嘅歌手，佢唱咗三個鐘，我哋跟住佢一齊唱，唱到聲都啞埋。", en: "On Saturday night Ana and I went to a concert at the Hong Kong Coliseum in Hung Hom. The Coliseum opened in 1983, and lots of famous singers have given concerts there. That night's singer was Ana's favourite. He sang for three hours, and we sang along with him until we lost our voices." }
  - { es: "禮拜日，我好攰，十一點先起身。晏晝我喺屋企執屋、洗衫，然後就煲劇，煲到夜晚。夜晚媽媽煮咗好多餸，佢話：「求到好籤，要食餐好嘅吖嘛！」", en: "On Sunday I was exhausted and didn't get up until eleven. In the afternoon I tidied the flat and did the laundry, then binge-watched a drama until evening. In the evening Mum cooked lots of dishes. She said: \"We drew a good fortune stick, so we have to eat well!\"" }
  - { es: "呢個週末我去咗三個地方：一間廟、一個花園同一個演唱會。下個週末我唔想出街喇，我想喺屋企瞓一日！", en: "This weekend I went to three places: a temple, a garden and a concert. Next weekend I don't want to go out. I want to stay home and sleep all day!" }
questions:
  - { q: "禮拜六朝早Mandy同邊個去黃大仙祠？", options: ["Ana", "媽媽", "Kelvin"], answer: 1, explain: "我同媽媽去黃大仙祠拜神. She went to the concert with Ana." }
  - { q: "解籤師傅話媽媽枝籤點樣？", options: ["係好籤", "唔係幾好", "佢唔知"], answer: 0, explain: "師傅話：「好籤！」" }
  - { q: "南蓮園池係乜嘢地方？", options: ["一間廟", "一個中式花園", "一間餐廳"], answer: 1, explain: "南蓮園池係一個唐朝風格嘅中式花園." }
  - { q: "紅館係幾時開幕？", options: ["一九八三年", "一九九八年", "二零零六年"], answer: 0, explain: "紅館一九八三年開幕." }
  - { q: "禮拜日Mandy做咗乜嘢？", options: ["去咗行山", "喺屋企執屋、洗衫同煲劇", "去咗睇演唱會"], answer: 1, explain: "晏晝我喺屋企執屋、洗衫，然後煲咗一集劇." }
glossary:
  - { es: 靈, en: (of a god) responsive to prayers }
  - { es: 廟, en: temple }
  - { es: 出嚟, en: out (towards the speaker) }
  - { es: 大殿, en: main hall (of a temple) }
  - { es: 求籤, en: to shake fortune sticks }
  - { es: 跪, en: to kneel }
  - { es: 搖, en: to shake }
  - { es: 籤筒, en: fortune-stick cylinder }
  - { es: 解籤, en: to interpret a fortune stick }
  - { es: 啞, en: "hoarse, mute" }
  - { es: 風格, en: style }
