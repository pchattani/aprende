        alt: ["Oui, il arrive.", "Il vient de partir."]
        grammar: [g.venir-de]
        vocab: [w.venir-de]
      - q: { es: "Tu attends depuis longtemps ?", en: "Have you been waiting long?" }
        a: { es: "Depuis une heure ! Tu es en retard !", en: "For an hour! You're late!" }
        alt: ["Non, je viens d'arriver.", "Depuis dix minutes."]
