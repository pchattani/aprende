id: r.c2.nel-mezzo-del-cammin
level: c2
title: Nel mezzo del cammin di nostra vita
kind: literature
author: Dante Alighieri (1265–1321)
source: "Commedia, Inferno, canto I, versi 1–90 (c. 1306–1308). Dominio pubblico. Testo secondo l'edizione critica di G. Petrocchi; le barre (/) separano i versi."
intro: "The first ninety lines of the Divine Comedy: lost in a dark wood, Dante meets three beasts and then the ghost of Virgil. The glossary gives the modern Italian for each old form (mod. = modern Italian). Read each tercet aloud: the hendecasyllables and the terza rima (ABA BCB CDC…) carry you through the archaic grammar."
allow: [dante, virgilio, anchise, troia, ilión, iulio, augusto, roma, miserere, sub, lombardi, mantoani]
paragraphs:
  - { es: "Nel mezzo del cammin di nostra vita / mi ritrovai per una selva oscura, / ché la diritta via era smarrita. / Ahi quanto a dir qual era è cosa dura / esta selva selvaggia e aspra e forte / che nel pensier rinova la paura! / Tant'è amara che poco è più morte; / ma per trattar del ben ch'i' vi trovai, / dirò de l'altre cose ch'i' v'ho scorte.", en: "Midway along the journey of our life / I found myself in a dark wood, / for the straight way had been lost. / Ah, how hard it is to tell what it was like, / this wood so savage, harsh and dense, / which in the very thought renews my fear! / It is so bitter that death is little more; / but to speak of the good I found there, / I will tell of the other things I saw there." }
  - { es: "Io non so ben ridir com'i' v'intrai, / tant'era pien di sonno a quel punto / che la verace via abbandonai. / Ma poi ch'i' fui al piè d'un colle giunto, / là dove terminava quella valle / che m'avea di paura il cor compunto, / guardai in alto, e vidi le sue spalle / vestite già de' raggi del pianeta / che mena dritto altrui per ogne calle.", en: "I cannot rightly say how I entered it, / I was so full of sleep at that moment / when I abandoned the true way. / But when I had reached the foot of a hill, / there where that valley ended / which had pierced my heart with fear, / I looked up and saw its shoulders / already clothed in the rays of the planet / that leads people straight on every path." }
  - { es: "Allor fu la paura un poco queta / che nel lago del cor m'era durata / la notte ch'i' passai con tanta pieta. / E come quei che con lena affannata / uscito fuor del pelago a la riva / si volge a l'acqua perigliosa e guata, / così l'animo mio, ch'ancor fuggiva, / si volse a retro a rimirar lo passo / che non lasciò già mai persona viva.", en: "Then the fear was calmed a little / that had lasted in the lake of my heart / through the night I spent in such distress. / And like one who, with labouring breath, / having escaped from the sea to the shore, / turns to the perilous water and stares, / so my mind, which was still fleeing, / turned back to gaze again at the pass / that never yet let any person out alive." }
  - { es: "Poi ch'èi posato un poco il corpo lasso, / ripresi via per la piaggia diserta, / sì che 'l piè fermo sempre era 'l più basso. / Ed ecco, quasi al cominciar de l'erta, / una lonza leggera e presta molto, / che di pel macolato era coverta; / e non mi si partia dinanzi al volto, / anzi 'mpediva tanto il mio cammino, / ch'i' fui per ritornar più volte vòlto.", en: "After I had rested my weary body a little, / I set off again along the deserted slope, / so that my firm foot was always the lower. / And look – almost at the start of the climb, / a leopard, light and very quick, / covered with a spotted hide; / and it would not leave my sight, / but so blocked my way / that more than once I turned to go back." }
  - { es: "Temp'era dal principio del mattino, / e 'l sol montava 'n sù con quelle stelle / ch'eran con lui quando l'amor divino / mosse di prima quelle cose belle; / sì ch'a bene sperar m'era cagione / di quella fiera a la gaetta pelle / l'ora del tempo e la dolce stagione; / ma non sì che paura non mi desse / la vista che m'apparve d'un leone.", en: "It was the beginning of the morning, / and the sun was rising with those stars / that were with it when divine love / first set those beautiful things in motion; / so that the hour of the day and the sweet season / gave me reason to hope well / of that beast with the gaily spotted skin; / but not so much that I did not feel fear / at the sight of a lion that appeared to me." }
  - { es: "Questi parea che contra me venisse / con la test'alta e con rabbiosa fame, / sì che parea che l'aere ne tremesse. / Ed una lupa, che di tutte brame / sembiava carca ne la sua magrezza, / e molte genti fé già viver grame, / questa mi porse tanto di gravezza / con la paura ch'uscia di sua vista, / ch'io perdei la speranza de l'altezza.", en: "It seemed to be coming at me / with its head held high and with raging hunger, / so that the air itself seemed to tremble at it. / And a she-wolf, which in her leanness / seemed laden with every craving, / and has already made many people live in misery, / she brought such heaviness upon me / with the fear that came from the sight of her / that I lost hope of reaching the height." }
  - { es: "E qual è quei che volontieri acquista, / e giugne 'l tempo che perder lo face, / che 'n tutt'i suoi pensier piange e s'attrista; / tal mi fece la bestia sanza pace, / che, venendomi 'ncontro, a poco a poco / mi ripigneva là dove 'l sol tace. / Mentre ch'i' rovinava in basso loco, / dinanzi a li occhi mi si fu offerto / chi per lungo silenzio parea fioco.", en: "And like one who gladly gains, / and then the time comes that makes him lose, / and in all his thoughts weeps and grieves; / so the restless beast made me, / which, coming towards me, little by little / pushed me back to where the sun is silent. / While I was falling back down to the low ground, / before my eyes appeared / one who seemed faint from long silence." }
  - { es: "Quando vidi costui nel gran diserto, / «Miserere di me», gridai a lui, / «qual che tu sii, od ombra od omo certo!». / Rispuosemi: «Non omo, omo già fui, / e li parenti miei furon lombardi, / mantoani per patria ambedui. / Nacqui sub Iulio, ancor che fosse tardi, / e vissi a Roma sotto 'l buono Augusto / nel tempo de li dèi falsi e bugiardi.", en: "When I saw him in that great wilderness, / 'Have pity on me,' I cried to him, / 'whatever you are, shade or real man!' / He answered me: 'Not a man; once I was a man, / and my parents were Lombards, / both of them Mantuan by birth. / I was born under Julius, though late in his time, / and I lived in Rome under the good Augustus / in the age of the false and lying gods." }
  - { es: "Poeta fui, e cantai di quel giusto / figliuol d'Anchise che venne di Troia, / poi che 'l superbo Ilión fu combusto. / Ma tu perché ritorni a tanta noia? / perché non sali il dilettoso monte / ch'è principio e cagion di tutta gioia?». / «Or se' tu quel Virgilio e quella fonte / che spandi di parlar sì largo fiume?», / rispuos'io lui con vergognosa fronte.", en: "I was a poet, and I sang of that just / son of Anchises who came from Troy / after proud Ilium was burned. / But you, why do you return to such misery? / Why do you not climb the delightful mountain / which is the source and cause of all joy?' / 'Are you, then, that Virgil, that spring / which pours out so broad a river of speech?' / I answered him, my forehead bowed in shame." }
  - { es: "«O de li altri poeti onore e lume, / vagliami 'l lungo studio e 'l grande amore / che m'ha fatto cercar lo tuo volume. / Tu se' lo mio maestro e 'l mio autore; / tu se' solo colui da cu' io tolsi / lo bello stilo che m'ha fatto onore. / Vedi la bestia per cu' io mi volsi: / aiutami da lei, famoso saggio, / ch'ella mi fa tremar le vene e i polsi».", en: "'O honour and light of all other poets, / may the long study and the great love / that made me search your book avail me now. / You are my master and my author; / you alone are the one from whom I took / the fine style that has brought me honour. / See the beast that made me turn back: / help me against her, famous sage, / for she makes my veins and pulses tremble.'" }
questions:
  - { q: "Che cosa rappresenta la «selva oscura» all'inizio del poema?", options: ["Un bosco reale vicino a Firenze", "Lo smarrimento morale: Dante ha perso la «diritta via»", "Il regno dei morti"], answer: 1, explain: "The dark wood is an allegory of sin and moral confusion; «la diritta via era smarrita» – the right path had been lost." }
  - { q: "Che cosa vede Dante quando arriva ai piedi del colle?", options: ["La cima illuminata dal sole («i raggi del pianeta»)", "Una città in fiamme", "Virgilio che lo aspetta"], answer: 0, explain: "«vidi le sue spalle / vestite già de' raggi del pianeta»: in Ptolemaic astronomy the sun is a planet. The light is a sign of hope." }
  - { q: "Quali sono le tre fiere che impediscono a Dante di salire?", options: ["Un lupo, un orso e un'aquila", "Una lonza, un leone e una lupa", "Un serpente, un cane e un leone"], answer: 1, explain: "The lonza (leopard), the leone (lion) and the lupa (she-wolf), traditionally read as lust, pride and greed." }
  - { q: "Nella similitudine «E come quei che con lena affannata / uscito fuor del pelago a la riva…», Dante si paragona a…", options: ["un naufrago che, arrivato a riva, si volta a guardare il mare pericoloso", "un pescatore che torna a casa", "un soldato che fugge dalla battaglia"], answer: 0, explain: "A shipwrecked man who has just reached the shore and looks back at the perilous water – as Dante's mind looks back at the wood." }
  - { q: "Come si presenta l'ombra che appare a Dante?", options: ["Come un santo di Firenze", "Come un poeta nato sotto Giulio Cesare, vissuto a Roma sotto Augusto, che cantò di Enea", "Come un re di Troia"], answer: 1, explain: "«Nacqui sub Iulio… vissi a Roma sotto 'l buono Augusto… cantai di quel giusto / figliuol d'Anchise» – Virgil, author of the Aeneid." }
  - { q: "«Rispuosemi», «avea», «ogne», «sanza» sono esempi di…", options: ["forme dell'italiano antico (mod. mi rispose, aveva, ogni, senza)", "errori di stampa", "parole dialettali siciliane"], answer: 0, explain: "Old Florentine forms (c2.u02): enclitic pronoun on a finite verb (rispuosemi), imperfect without -v- (avea), ogne for ogni, sanza for senza." }
