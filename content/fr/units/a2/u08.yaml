id: a2.u08
title: "Demain, à Quimper"
lessons:
  - id: a2.u08.l1
    title: "Nous mangerons des galettes"
    teach: [g.futur-simple-forms]
    tip: "Future = infinitive + -ai, -as, -a, -ons, -ez, -ont (je parlerai, tu finiras); -re verbs drop the final e: il prendra."
    vocab: [w.futur, w.avenir, w.un-jour, w.l-année-prochaine, w.promettre, w.préparer, w.organiser, w.projet, w.espérer, w.sarrasin, w.blé, w.farine, w.froment, w.faïence]
    sentences:
      - { es: "Demain, nous visiterons la cathédrale de Quimper.", en: "Tomorrow we'll visit Quimper cathedral.", altEs: ["Nous visiterons la cathédrale de Quimper demain.", "Demain, on visitera la cathédrale de Quimper."], altEn: ["Tomorrow we will visit Quimper cathedral."], grammar: [g.futur-simple-forms], vocab: [w.cathédrale] }
      - { es: "Ce soir, je mangerai une galette complète.", en: "Tonight I'll eat a galette with ham, cheese and egg.", altEs: ["Je mangerai une galette complète ce soir."], altEn: ["Tonight I'll have a galette complète."], grammar: [g.futur-simple-forms], vocab: [w.galette], note: "Une galette complète: ham, cheese and egg." }
      - { es: "La galette se prépare avec de la farine de sarrasin.", en: "The galette is made with buckwheat flour.", altEs: ["On prépare la galette avec de la farine de sarrasin.", "On fait la galette avec de la farine de sarrasin."], altEn: ["Galettes are made with buckwheat flour."], grammar: [g.partitive-articles], vocab: [w.farine, w.sarrasin, w.préparer] }
      - { es: "Le sarrasin, on l'appelle aussi le blé noir.", en: "Buckwheat is also called black wheat.", altEs: ["On appelle aussi le sarrasin le blé noir."], altEn: ["Buckwheat is also known as black wheat."], grammar: [g.direct-object-pronouns], vocab: [w.sarrasin, w.blé] }
      - { es: "Je te promets : je t'écrirai tous les jours.", en: "I promise you: I'll write to you every day.", altEs: ["Je te le promets : je t'écrirai tous les jours.", "Promis, je t'écrirai tous les jours."], grammar: [g.futur-simple-forms], vocab: [w.promettre, w.écrire] }
      - { es: "L'année prochaine, j'habiterai à Quimper.", en: "Next year I'll live in Quimper.", altEs: ["J'habiterai à Quimper l'année prochaine."], altEn: ["Next year I will live in Quimper."], grammar: [g.futur-simple-forms], vocab: [w.l-année-prochaine, w.habiter] }
      - { es: "Un jour, nous ouvrirons une crêperie.", en: "One day we'll open a crêperie.", altEs: ["Nous ouvrirons une crêperie un jour.", "Un jour, on ouvrira une crêperie."], altEn: ["Some day we'll open a crêperie."], grammar: [g.futur-simple-forms], vocab: [w.un-jour, w.ouvrir, w.crêperie] }
      - { es: "Le festival commencera le 20 juillet.", en: "The festival will start on 20 July.", altEs: ["Le festival commencera le vingt juillet."], altEn: ["The festival will begin on the 20th of July."], grammar: [g.futur-simple-forms], vocab: [w.festival, w.commencer] }
      - { es: "Ils prendront le train de huit heures.", en: "They'll take the eight o'clock train.", altEn: ["They will take the eight o'clock train."], grammar: [g.futur-simple-forms], vocab: [w.prendre], error: { wrong: "Ils prendreront le train de huit heures.", explain: "-re verbs drop the final e: prendr- + ont = prendront.", grammar: g.futur-simple-forms } }
      - { es: "Qui organisera la fête de samedi ?", en: "Who will organise Saturday's party?", altEs: ["Qui va organiser la fête de samedi ?"], altEn: ["Who'll organise the party on Saturday?"], grammar: [g.futur-simple-forms], vocab: [w.organiser, w.fête] }
      - { es: "J'espère que tu aimeras la Bretagne.", en: "I hope you'll like Brittany.", altEs: ["J'espère que la Bretagne te plaira."], altEn: ["I hope you will love Brittany."], grammar: [g.futur-simple-forms], vocab: [w.espérer, w.aimer] }
      - { es: "Quels sont vos projets pour l'avenir ?", en: "What are your plans for the future?", altEs: ["Qu'est-ce que vous ferez à l'avenir ?"], altEn: ["What plans do you have for the future?"], grammar: [g.quel], vocab: [w.projet, w.avenir] }
      - { es: "Vous finirez le travail avant midi ?", en: "Will you finish the work before noon?", altEs: ["Est-ce que vous finirez le travail avant midi ?", "Finirez-vous le travail avant midi ?"], grammar: [g.futur-simple-forms], vocab: [w.finir] }
      - { es: "Le futur n'est pas difficile, tu verras !", en: "The future tense isn't difficult, you'll see!", altEs: ["Le futur, ce n'est pas difficile, tu verras !"], altEn: ["The future isn't hard, you'll see!"], grammar: [g.futur-simple-forms], vocab: [w.futur] }
      - { es: "Je parle breton avec ma grand-mère.", en: "I speak Breton with my grandmother.", grammar: [g.futur-simple-forms], vocab: [w.breton], transform: { instruction: "Put it in the future", answer: "Je parlerai breton avec ma grand-mère.", en: "I'll speak Breton with my grandmother." } }
      - { es: "Nous achetons des crêpes au marché.", en: "We buy crêpes at the market.", grammar: [g.futur-simple-forms, g.stem-changing-er], vocab: [w.acheter], transform: { instruction: "Put it in the future", answer: "Nous achèterons des crêpes au marché.", alt: ["On achètera des crêpes au marché."], en: "We'll buy crêpes at the market." } }
    exchanges:
      - q: { es: "Qu'est-ce que tu mangeras ce soir ?", en: "What will you eat tonight?" }
        a: { es: "Je mangerai une galette et une crêpe au caramel.", en: "I'll eat a galette and a caramel crêpe." }
        alt: ["Une galette complète.", "Je mangerai des crêpes, évidemment !"]
        grammar: [g.futur-simple-forms]
        vocab: [w.galette]
      - q: { es: "Tu m'écriras ?", en: "Will you write to me?" }
        a: { es: "Oui, je te le promets.", en: "Yes, I promise." }
        alt: ["Bien sûr, je t'écrirai tous les jours.", "Oui, promis !"]
        grammar: [g.futur-simple-forms]
        vocab: [w.promettre]
      - q: { es: "Quels sont tes projets pour l'année prochaine ?", en: "What are your plans for next year?" }
        a: { es: "Je travaillerai à Quimper et j'apprendrai le breton.", en: "I'll work in Quimper and I'll learn Breton." }
        alt: ["Je voyagerai en Bretagne.", "J'habiterai à Quimper."]
        grammar: [g.futur-simple-forms]
        vocab: [w.projet, w.l-année-prochaine]
      - q: { es: "C'est quoi, le sarrasin ?", en: "What's buckwheat?" }
        a: { es: "C'est le blé noir : on prépare les galettes avec sa farine.", en: "It's 'black wheat': galettes are made with its flour." }
        alt: ["C'est le blé noir.", "On l'utilise pour les galettes."]
        grammar: [g.c-est-il-est]
        vocab: [w.sarrasin, w.blé, w.farine]
      - q: { es: "Qui préparera le dîner ?", en: "Who will make dinner?" }
        a: { es: "Moi ! Je préparerai des crêpes pour tout le monde.", en: "Me! I'll make crêpes for everyone." }
        alt: ["C'est moi qui le préparerai.", "Papa le préparera."]
        grammar: [g.futur-simple-forms]
        vocab: [w.préparer]
    texts:
      - title: "Programme de la journée"
        es: ["Le matin, nous visiterons la cathédrale Saint-Corentin.", "À midi, nous mangerons des galettes près de l'Odet.", "L'après-midi, nous visiterons le musée de la faïence."]
        en: ["In the morning, we'll visit Saint-Corentin cathedral.", "At noon, we'll eat galettes near the Odet.", "In the afternoon, we'll visit the earthenware museum."]
        grammar: [g.futur-simple-forms]
        vocab: [w.cathédrale, w.galette, w.faïence]
      - title: "Message de Sophie"
        es: ["J'arriverai à Quimper vendredi soir.", "Je t'appellerai de la gare.", "Prépare la farine, on fera des crêpes !"]
        en: ["I'll arrive in Quimper on Friday evening.", "I'll call you from the station.", "Get the flour ready, we'll make crêpes!"]
        grammar: [g.futur-simple-forms]
        vocab: [w.farine, w.préparer]
    spicy:
      - { es: "Je te promets une chose : je ne t'oublierai jamais.", en: "I promise you one thing: I'll never forget you.", altEs: ["Je te promets une chose : je ne t'oublierai pas."], grammar: [g.futur-simple-forms], vocab: [w.promettre, w.oublier] }
      - { es: "Un jour, tu me prépareras des crêpes au petit-déjeuner.", en: "One day, you'll make me crêpes for breakfast.", grammar: [g.futur-simple-forms], vocab: [w.un-jour, w.préparer] }
      - { es: "J'espère que tu danseras avec moi au festival.", en: "I hope you'll dance with me at the festival.", grammar: [g.futur-simple-forms], vocab: [w.espérer, w.festival] }
      - { es: "Mon projet pour l'avenir ? Je mangerai plus de crêpes et je passerai plus de temps avec toi.", en: "My plan for the future? I'll eat more crêpes and I'll spend more time with you.", grammar: [g.futur-simple-forms], vocab: [w.projet, w.avenir] }
      - { es: "Ce soir, je t'inviterai à la meilleure crêperie de Quimper.", en: "Tonight I'll take you to the best crêperie in Quimper.", altEn: ["Tonight I'll invite you to the best crêperie in Quimper."], grammar: [g.futur-simple-forms], vocab: [w.inviter, w.crêperie] }
  - id: a2.u08.l2
    title: "Au festival de Cornouaille"
    teach: [g.futur-irregular-stems]
    tip: "Irregular stems, regular endings: j'irai, je serai, j'aurai, je ferai, je viendrai, je pourrai, je verrai, il faudra, il pleuvra."
    vocab: [w.festival, w.costume, w.coiffe, w.bigoudène, w.cornemuse, w.biniou, w.partout, w.dès, w.caramel-au-beurre-salé, w.repos, w.musicien, w.dentelle]
    sentences:
      - { es: "Nous irons au festival de Cornouaille en juillet.", en: "We'll go to the Cornouaille festival in July.", altEs: ["En juillet, nous irons au festival de Cornouaille.", "On ira au festival de Cornouaille en juillet."], grammar: [g.futur-irregular-stems], vocab: [w.festival] }
      - { es: "Il y aura de la musique partout dans la ville.", en: "There'll be music everywhere in the town.", altEs: ["Il y aura de la musique partout en ville."], altEn: ["There will be music all over town."], grammar: [g.futur-irregular-stems], vocab: [w.partout, w.musique] }
      - { es: "Tu verras des femmes avec la coiffe bigoudène.", en: "You'll see women wearing the Bigouden headdress.", altEn: ["You'll see women in the tall Bigouden lace headdress."], grammar: [g.futur-irregular-stems], vocab: [w.coiffe, w.bigoudène], note: "The coiffe bigoudène, a tall tower of lace, comes from the Pays bigouden near Quimper." }
      - { es: "Les musiciens seront en costume traditionnel.", en: "The musicians will be in traditional costume.", altEn: ["The musicians will wear traditional costume."], grammar: [g.futur-irregular-stems], vocab: [w.costume, w.traditionnel, w.musicien] }
      - { es: "Je ferai une photo du défilé pour ma mère.", en: "I'll take a photo of the parade for my mother.", altEs: ["Je prendrai une photo du défilé pour ma mère."], grammar: [g.futur-irregular-stems], vocab: [w.défilé, w.photo] }
      - { es: "On pourra écouter la cornemuse et le biniou.", en: "We'll be able to listen to the bagpipes and the biniou.", altEs: ["Nous pourrons écouter la cornemuse et le biniou."], grammar: [g.futur-irregular-stems], vocab: [w.cornemuse, w.biniou] }
      - { es: "Il faudra réserver l'hôtel dès maintenant.", en: "We'll have to book the hotel right now.", altEs: ["Il faudra réserver l'hôtel dès aujourd'hui."], altEn: ["We'll need to book the hotel starting now."], grammar: [g.futur-irregular-stems, g.il-faut], vocab: [w.dès, w.réserver] }
      - { es: "Mes cousins viendront de Brest pour le week-end.", en: "My cousins will come from Brest for the weekend.", altEn: ["My cousins are going to come from Brest for the weekend."], grammar: [g.futur-irregular-stems], vocab: [w.cousin, w.venir], variant: "Québec: pour la fin de semaine." }
      - { es: "Est-ce que tu auras le temps de goûter le caramel au beurre salé ?", en: "Will you have time to taste the salted butter caramel?", altEs: ["Tu auras le temps de goûter le caramel au beurre salé ?"], grammar: [g.futur-irregular-stems], vocab: [w.caramel-au-beurre-salé, w.goûter] }
      - { es: "Vous serez fatigués, mais ce sera génial !", en: "You'll be tired, but it'll be great!", altEs: ["Vous serez fatigués mais ce sera génial !"], grammar: [g.futur-irregular-stems], vocab: [w.fatigué, w.génial] }
      - { es: "Il fera beau samedi, mais il pleuvra dimanche.", en: "The weather will be nice on Saturday, but it'll rain on Sunday.", altEn: ["It'll be sunny on Saturday, but it will rain on Sunday."], grammar: [g.futur-irregular-stems, g.weather], vocab: [w.pleuvoir] }
      - { es: "Après le festival, je voudrai seulement du repos !", en: "After the festival, all I'll want is rest!", altEn: ["After the festival, I'll only want some rest!"], grammar: [g.futur-irregular-stems], vocab: [w.repos, w.seulement] }
      - { es: "J'irai au concert ce soir.", en: "I'll go to the concert tonight.", grammar: [g.futur-irregular-stems], vocab: [w.concert], error: { wrong: "J'allerai au concert ce soir.", explain: "aller has the irregular future stem ir-: j'irai, not j'allerai.", grammar: g.futur-irregular-stems } }
      - { es: "On verra !", en: "We'll see!", grammar: [g.futur-irregular-stems], vocab: [w.voir] }
      - { es: "Nous faisons la fête toute la nuit.", en: "We party all night.", grammar: [g.futur-irregular-stems], vocab: [w.fête], transform: { instruction: "Put it in the future", answer: "Nous ferons la fête toute la nuit.", alt: ["On fera la fête toute la nuit."], en: "We'll party all night." } }
      - { es: "Elle est en retard et elle ne peut pas venir.", en: "She's late and she can't come.", grammar: [g.futur-irregular-stems], vocab: [w.en-retard], transform: { instruction: "Put it in the future", answer: "Elle sera en retard et elle ne pourra pas venir.", en: "She'll be late and she won't be able to come." } }
    exchanges:
      - q: { es: "Tu viendras au festival avec nous ?", en: "Will you come to the festival with us?" }
        a: { es: "Oui, je viendrai samedi.", en: "Yes, I'll come on Saturday." }
        alt: ["Oui, avec plaisir !", "Non, je ne pourrai pas, je travaille.", "Peut-être, on verra."]
        grammar: [g.futur-irregular-stems]
        vocab: [w.festival, w.venir]
      - q: { es: "Il y aura beaucoup de monde ?", en: "Will there be lots of people?" }
        a: { es: "Oui, il y aura du monde partout.", en: "Yes, there'll be people everywhere." }
        alt: ["Oui, beaucoup.", "Oui, comme chaque année."]
        grammar: [g.futur-irregular-stems]
        vocab: [w.partout]
      - q: { es: "Qu'est-ce qu'on verra au défilé ?", en: "What will we see at the parade?" }
        a: { es: "Des costumes traditionnels et des coiffes en dentelle.", en: "Traditional costumes and lace headdresses." }
        alt: ["Des costumes et des coiffes.", "On verra des musiciens et des danseurs."]
        grammar: [g.futur-irregular-stems]
        vocab: [w.costume, w.coiffe, w.dentelle]
      - q: { es: "Quel temps fera-t-il demain ?", en: "What will the weather be like tomorrow?" }
        a: { es: "Il fera beau le matin, mais il pleuvra l'après-midi.", en: "It'll be nice in the morning, but it'll rain in the afternoon." }
        alt: ["Il pleuvra.", "Il fera beau, d'après la météo."]
        grammar: [g.futur-irregular-stems, g.weather]
        vocab: [w.pleuvoir, w.météo]
      - q: { es: "Tu seras là à quelle heure ?", en: "What time will you be there?" }
        a: { es: "Je serai là vers dix heures.", en: "I'll be there around ten." }
        alt: ["Vers dix heures.", "Je serai là dès neuf heures."]
        grammar: [g.futur-irregular-stems, g.time-telling]
        vocab: [w.dès]
    texts:
      - title: "Affiche du festival"
        es: ["Festival de Cornouaille, Quimper, du 20 au 26 juillet.", "Il y aura des concerts, des danses et un grand défilé dimanche.", "Venez en costume !"]
        en: ["Cornouaille Festival, Quimper, from 20 to 26 July.", "There will be concerts, dances and a big parade on Sunday.", "Come in costume!"]
        grammar: [g.futur-irregular-stems]
        vocab: [w.festival, w.costume, w.défilé]
      - title: "Message de Nicolas"
        es: ["Je ne pourrai pas venir vendredi.", "Par contre, je serai à Quimper samedi dès midi.", "On ira voir le défilé ensemble ?"]
        en: ["I won't be able to come on Friday.", "On the other hand, I'll be in Quimper on Saturday from noon.", "Shall we go and see the parade together?"]
        grammar: [g.futur-irregular-stems]
        vocab: [w.dès, w.défilé]
    spicy:
      - { es: "Tu verras, après une danse bretonne avec moi, tu voudras rester en Bretagne.", en: "You'll see, after a Breton dance with me, you'll want to stay in Brittany.", grammar: [g.futur-irregular-stems], vocab: [w.voir, w.breton] }
      - { es: "Je serai le garçon en costume, près de la cornemuse. Tu ne pourras pas me rater.", en: "I'll be the guy in the costume, near the bagpipes. You can't miss me.", altEn: ["I'll be the boy in costume near the bagpipes. You won't be able to miss me."], grammar: [g.futur-irregular-stems], vocab: [w.costume, w.cornemuse] }
      - { es: "Il pleuvra demain ? Tant mieux, on aura une excuse pour rester ensemble.", en: "It'll rain tomorrow? All the better, we'll have an excuse to stay together.", grammar: [g.futur-irregular-stems], vocab: [w.pleuvoir, w.ensemble] }
      - { es: "Tu feras la fête avec moi ce soir, ou tu seras sage et tu iras dormir ?", en: "Will you party with me tonight, or will you be good and go to bed?", altEs: ["Tu feras la fête avec moi ce soir ou tu seras sage et tu iras dormir ?"], altEn: ["Are you going to party with me tonight, or will you be good and go to bed?"], grammar: [g.futur-irregular-stems], vocab: [w.fête, w.sage] }
      - { es: "Si ma coiffe tombe, tu devras danser avec moi toute la nuit.", en: "If my headdress falls off, you'll have to dance with me all night.", grammar: [g.si-present-futur, g.futur-irregular-stems], vocab: [w.coiffe, w.danser] }
  - id: a2.u08.l3
    title: "S'il pleut, on restera dedans"
    teach: [g.si-present-futur]
    tip: "Si + present, then future: S'il pleut, nous resterons dedans. Never the future right after si (if)."
    vocab: [w.si.conj, w.température, w.prévision, w.averse, w.éclaircie, w.brouillard, w.humide, w.sec, w.orage, w.prévoir, w.dedans, w.dehors, w.bonnet, w.moufle, w.cas]
    sentences:
      - { es: "S'il pleut demain, nous visiterons le musée.", en: "If it rains tomorrow, we'll visit the museum.", altEs: ["Nous visiterons le musée s'il pleut demain.", "S'il pleut demain, on visitera le musée."], grammar: [g.si-present-futur], vocab: [w.si.conj, w.pleuvoir] }
      - { es: "S'il fait beau, on mangera dehors.", en: "If the weather's nice, we'll eat outside.", altEs: ["On mangera dehors s'il fait beau.", "S'il fait beau, nous mangerons dehors."], grammar: [g.si-present-futur], vocab: [w.dehors] }
      - { es: "S'il y a un orage, nous resterons dedans.", en: "If there's a storm, we'll stay inside.", altEs: ["Nous resterons dedans s'il y a un orage.", "S'il y a de l'orage, on restera dedans."], grammar: [g.si-present-futur], vocab: [w.orage, w.dedans] }
      - { es: "Les prévisions annoncent des averses et quelques éclaircies.", en: "The forecast is for showers and a few sunny spells.", altEn: ["The forecast says showers and some sunny spells."], grammar: [g.quantities], vocab: [w.prévision, w.averse, w.éclaircie] }
      - { es: "Si tu as froid, prends mon bonnet.", en: "If you're cold, take my woolly hat.", altEs: ["Prends mon bonnet si tu as froid."], altEn: ["If you're cold, take my beanie."], grammar: [g.si-present-futur, g.imperative], vocab: [w.bonnet], variant: "Québec: une tuque." }
      - { es: "Ce matin, il y a du brouillard sur la rivière.", en: "This morning there's fog on the river.", altEs: ["Il y a du brouillard sur la rivière ce matin."], grammar: [g.weather], vocab: [w.brouillard, w.rivière] }
      - { es: "Si la température baisse, il faudra des moufles.", en: "If the temperature drops, we'll need mittens.", altEs: ["Il faudra des moufles si la température baisse."], grammar: [g.si-present-futur], vocab: [w.température, w.moufle], variant: "Québec: des mitaines." }
      - { es: "Ici, l'air est humide ; à Marseille, il est plus sec.", en: "Here the air is damp; in Marseille it's drier.", altEs: ["Ici, l'air est humide ; à Marseille, l'air est plus sec."], grammar: [g.comparatives], vocab: [w.humide, w.sec] }
      - { es: "La météo prévoit du soleil pour le week-end.", en: "The weather forecast says sun for the weekend.", altEn: ["The forecast predicts sunshine for the weekend."], grammar: [g.partitive-articles], vocab: [w.prévoir, w.météo] }
      - { es: "Si vous venez en juillet, vous verrez le festival.", en: "If you come in July, you'll see the festival.", altEs: ["Vous verrez le festival si vous venez en juillet."], grammar: [g.si-present-futur], vocab: [w.si.conj, w.festival] }
      - { es: "S'il pleut, nous resterons à l'hôtel.", en: "If it rains, we'll stay at the hotel.", altEs: ["Nous resterons à l'hôtel s'il pleut.", "S'il pleut, on restera à l'hôtel."], grammar: [g.si-present-futur], vocab: [w.rester], error: { wrong: "S'il pleuvra, nous resterons à l'hôtel.", explain: "After si (if), use the present: s'il pleut, never s'il pleuvra.", grammar: g.si-present-futur } }
      - { es: "Si elle arrive tôt, on ira à la plage.", en: "If she arrives early, we'll go to the beach.", altEs: ["On ira à la plage si elle arrive tôt."], grammar: [g.si-present-futur], vocab: [w.arriver], error: { wrong: "S'elle arrive tôt, on ira à la plage.", explain: "si elides only before il and ils: s'il, but si elle.", grammar: g.si-present-futur } }
      - { es: "Si tu veux, on peut manger ici.", en: "If you want, we can eat here.", altEs: ["On peut manger ici si tu veux."], altEn: ["We can eat here if you like."], grammar: [g.si-present-futur], vocab: [w.vouloir] }
      - { es: "En Bretagne, il fait beau plusieurs fois par jour !", en: "In Brittany, the weather is nice several times a day!", grammar: [g.weather], vocab: [w.plusieurs], note: "A Breton joke: the weather changes so often that the sun always comes back." }
      - { es: "Il fait froid. Je mets mon bonnet.", en: "It's cold. I put on my woolly hat.", grammar: [g.si-present-futur], vocab: [w.bonnet, w.mettre], transform: { instruction: "Join them with si and the future", answer: "S'il fait froid, je mettrai mon bonnet.", alt: ["Je mettrai mon bonnet s'il fait froid."], en: "If it's cold, I'll put on my woolly hat." } }
      - { es: "Il y a du brouillard. Le bateau ne part pas.", en: "There's fog. The boat isn't leaving.", grammar: [g.si-present-futur], vocab: [w.brouillard, w.bateau], transform: { instruction: "Join them with si and the future", answer: "S'il y a du brouillard, le bateau ne partira pas.", alt: ["Le bateau ne partira pas s'il y a du brouillard."], en: "If there's fog, the boat won't leave." } }
    exchanges:
      - q: { es: "Qu'est-ce qu'on fera s'il pleut ?", en: "What will we do if it rains?" }
        a: { es: "S'il pleut, on ira au musée.", en: "If it rains, we'll go to the museum." }
        alt: ["On restera dedans.", "On ira au cinéma.", "S'il pleut, nous visiterons la cathédrale."]
        grammar: [g.si-present-futur]
        vocab: [w.si.conj, w.dedans]
      - q: { es: "Quelles sont les prévisions pour demain ?", en: "What's the forecast for tomorrow?" }
        a: { es: "Des averses le matin et des éclaircies l'après-midi.", en: "Showers in the morning and sunny spells in the afternoon." }
        alt: ["Du soleil toute la journée.", "Il pleuvra, comme d'habitude !"]
        grammar: [g.weather]
        vocab: [w.prévision, w.averse, w.éclaircie]
      - q: { es: "Je prends mon bonnet ?", en: "Shall I take my woolly hat?" }
        a: { es: "Oui, s'il fait froid, tu seras content de l'avoir.", en: "Yes, if it's cold, you'll be glad to have it." }
        alt: ["Oui, prends-le.", "Non, il fait chaud aujourd'hui."]
        grammar: [g.si-present-futur]
        vocab: [w.bonnet]
      - q: { es: "On mange dehors ou dedans ?", en: "Shall we eat outside or inside?" }
        a: { es: "Dehors, s'il ne pleut pas !", en: "Outside, if it doesn't rain!" }
        alt: ["Dedans, il fait trop froid.", "Dehors, il fait beau."]
        grammar: [g.si-present-futur]
        vocab: [w.dehors, w.dedans]
      - q: { es: "Quelle température fera-t-il ?", en: "What will the temperature be?" }
        a: { es: "Environ dix-huit degrés, c'est plutôt humide.", en: "About eighteen degrees; it's rather damp." }
        alt: ["Dix-huit degrés.", "Il fera environ vingt degrés."]
        grammar: [g.futur-irregular-stems]
        vocab: [w.température, w.humide]
    texts:
      - title: "Météo de la Bretagne"
        es: ["Demain matin, il y aura du brouillard sur la côte.", "L'après-midi, des averses avec quelques éclaircies.", "Les températures seront de quinze à dix-huit degrés."]
        en: ["Tomorrow morning there'll be fog on the coast.", "In the afternoon, showers with a few sunny spells.", "Temperatures will be from fifteen to eighteen degrees."]
        grammar: [g.futur-irregular-stems, g.weather]
        vocab: [w.brouillard, w.averse, w.éclaircie, w.température]
      - title: "Message de Léa"
        es: ["S'il fait beau samedi, on ira à la plage de Bénodet.", "S'il pleut, on restera à Quimper.", "Dans tous les cas, prends ton bonnet !"]
        en: ["If the weather's nice on Saturday, we'll go to the beach at Bénodet.", "If it rains, we'll stay in Quimper.", "Either way, take your woolly hat!"]
        grammar: [g.si-present-futur]
        vocab: [w.si.conj, w.bonnet, w.cas]
    spicy:
      - { es: "S'il pleut, je partagerai mon parapluie avec toi.", en: "If it rains, I'll share my umbrella with you.", altEs: ["S'il pleut, je partagerai mon parapluie avec toi, et seulement avec toi."], grammar: [g.si-present-futur], vocab: [w.parapluie] }
      - { es: "Si tu as froid, je te prêterai mon bonnet. Et mes bras.", en: "If you're cold, I'll lend you my woolly hat. And my arms.", grammar: [g.si-present-futur], vocab: [w.bonnet, w.prêter, w.bras] }
      - { es: "Les prévisions annoncent un orage ce soir. Moi, j'annonce un dîner aux chandelles.", en: "The forecast says there'll be a storm tonight. I'm announcing a candlelit dinner.", grammar: [g.weather], vocab: [w.prévision, w.orage] }
      - { es: "Si tu me souris encore, la température va monter.", en: "If you smile at me again, the temperature is going to rise.", grammar: [g.si-present-futur, g.futur-proche], vocab: [w.température, w.sourire] }
      - { es: "S'il y a du brouillard demain, on restera au lit et personne ne dira rien.", en: "If there's fog tomorrow, we'll stay in bed and nobody will say a thing.", grammar: [g.si-present-futur], vocab: [w.brouillard, w.lit] }
  - id: a2.u08.l4
    title: "Quand je serai grande"
    teach: [g.quand-futur]
    tip: "When the action is in the future, French uses the future after quand, lorsque and dès que: Quand je serai à Quimper, je t'appellerai."
    vocab: [w.quand.conj, w.dès-que, w.lorsque, w.pilote, w.gagner-sa-vie, w.métier, w.chômage, w.charme]
    sentences:
      - { es: "Quand je serai grande, je serai pilote.", en: "When I grow up, I'll be a pilot.", altEs: ["Je serai pilote quand je serai grande."], grammar: [g.quand-futur], vocab: [w.quand.conj, w.pilote] }
      - { es: "Dès que nous arriverons, nous irons à la crêperie.", en: "As soon as we arrive, we'll go to the crêperie.", altEs: ["Dès qu'on arrivera, on ira à la crêperie.", "Nous irons à la crêperie dès que nous arriverons."], grammar: [g.quand-futur], vocab: [w.dès-que, w.crêperie] }
      - { es: "Appelle-moi quand tu seras à la gare.", en: "Call me when you're at the station.", altEs: ["Quand tu seras à la gare, appelle-moi."], altEn: ["Call me when you get to the station."], grammar: [g.quand-futur, g.imperative-with-pronouns], vocab: [w.quand.conj, w.gare] }
      - { es: "Quand tu verras Yann, dis-lui bonjour.", en: "When you see Yann, say hello to him.", altEs: ["Dis bonjour à Yann quand tu le verras."], altEn: ["When you see Yann, say hi to him."], grammar: [g.quand-futur], vocab: [w.voir, w.yann.nm] }
      - { es: "Lorsque le festival commencera, la ville sera pleine.", en: "When the festival starts, the town will be full.", altEs: ["Quand le festival commencera, la ville sera pleine."], grammar: [g.quand-futur], vocab: [w.lorsque, w.festival] }
      - { es: "Je te répondrai dès que je pourrai.", en: "I'll answer you as soon as I can.", altEs: ["Dès que je pourrai, je te répondrai."], grammar: [g.quand-futur], vocab: [w.dès-que, w.répondre] }
      - { es: "Quand j'aurai un métier, je gagnerai ma vie.", en: "When I have a job, I'll earn my living.", altEs: ["Je gagnerai ma vie quand j'aurai un métier."], altEn: ["When I have a trade, I'll earn a living."], grammar: [g.quand-futur], vocab: [w.métier, w.gagner-sa-vie] }
      - { es: "Mon frère est au chômage, mais il trouvera bientôt un travail.", en: "My brother is unemployed, but he'll soon find a job.", altEs: ["Mon frère est au chômage mais il trouvera bientôt du travail."], grammar: [g.futur-simple-forms], vocab: [w.chômage, w.trouver] }
      - { es: "Quand il fait beau, je vais à la plage.", en: "When the weather's nice, I go to the beach.", grammar: [g.quand-futur], vocab: [w.quand.conj], note: "A habit: quand + present." }
      - { es: "Quand nous serons à la retraite, nous habiterons au bord de la mer.", en: "When we're retired, we'll live by the sea.", altEs: ["Nous habiterons au bord de la mer quand nous serons à la retraite."], grammar: [g.quand-futur], vocab: [w.mer] }
      - { es: "Qu'est-ce que tu feras quand tu auras fini tes études ?", en: "What will you do when you've finished your studies?", altEs: ["Tu feras quoi quand tu auras fini tes études ?"], grammar: [g.quand-futur], vocab: [w.finir] }
      - { es: "Quand je serai à Quimper, je t'appellerai.", en: "When I'm in Quimper, I'll call you.", altEs: ["Je t'appellerai quand je serai à Quimper."], grammar: [g.quand-futur], vocab: [w.appeler], error: { wrong: "Quand je suis à Quimper, je t'appellerai.", explain: "The action is in the future, so quand takes the future: quand je serai.", grammar: g.quand-futur } }
      - { es: "Dès qu'il arrivera, on mangera.", en: "As soon as he arrives, we'll eat.", altEs: ["On mangera dès qu'il arrivera."], grammar: [g.quand-futur], vocab: [w.dès-que], error: { wrong: "Dès qu'il arrive, on mangera.", explain: "Both actions are in the future: dès qu'il arrivera.", grammar: g.quand-futur } }
      - { es: "Tu as le temps. Tu viens nous voir.", en: "You have time. You come and see us.", grammar: [g.quand-futur], vocab: [w.venir], transform: { instruction: "Join them with quand and the future", answer: "Quand tu auras le temps, tu viendras nous voir.", alt: ["Tu viendras nous voir quand tu auras le temps."], en: "When you have time, you'll come and see us." } }
      - { es: "Le train arrive. Je t'envoie un message.", en: "The train arrives. I send you a message.", grammar: [g.quand-futur], vocab: [w.envoyer, w.message], transform: { instruction: "Join them with dès que and the future", answer: "Dès que le train arrivera, je t'enverrai un message.", alt: ["Je t'enverrai un message dès que le train arrivera."], en: "As soon as the train arrives, I'll send you a message." } }
    exchanges:
      - q: { es: "Qu'est-ce que tu feras quand tu seras grand ?", en: "What will you do when you grow up?" }
        a: { es: "Je serai pilote, comme mon oncle.", en: "I'll be a pilot, like my uncle." }
        alt: ["Je serai médecin.", "Quand je serai grand, je serai pilote."]
        grammar: [g.quand-futur]
        vocab: [w.quand.conj, w.pilote]
      - q: { es: "Tu m'appelles quand tu arrives ?", en: "Will you call me when you arrive?" }
        a: { es: "Oui, je t'appellerai dès que j'arriverai à la gare.", en: "Yes, I'll call you as soon as I get to the station." }
        alt: ["Oui, dès que j'arriverai.", "Promis, je t'appellerai."]
        grammar: [g.quand-futur]
        vocab: [w.dès-que]
      - q: { es: "Quel métier tu feras plus tard ?", en: "What job will you do later?" }
        a: { es: "Je ne sais pas encore, mais je voudrais gagner ma vie en Bretagne.", en: "I don't know yet, but I'd like to earn my living in Brittany." }
        alt: ["Je serai professeur.", "Je ne sais pas encore."]
        grammar: [g.futur-simple-forms]
        vocab: [w.métier, w.gagner-sa-vie]
      - q: { es: "Ton frère travaille ?", en: "Does your brother work?" }
        a: { es: "Non, il est au chômage, mais il commencera un nouveau travail en septembre.", en: "No, he's unemployed, but he'll start a new job in September." }
        alt: ["Non, il est au chômage.", "Oui, il est pilote."]
        grammar: [g.futur-simple-forms]
        vocab: [w.chômage]
      - q: { es: "On mange quand ?", en: "When are we eating?" }
        a: { es: "Lorsque tout le monde sera là.", en: "When everyone's here." }
        alt: ["Quand tout le monde sera là.", "Dès que Papa arrivera."]
        grammar: [g.quand-futur]
        vocab: [w.lorsque]
    texts:
      - title: "Lettre au futur"
        es: ["Quand tu liras cette lettre, tu auras trente ans.", "Tu seras peut-être pilote, ou tu auras une crêperie à Quimper.", "Quand tu seras triste, souviens-toi de tes rêves."]
        en: ["When you read this letter, you'll be thirty.", "Maybe you'll be a pilot, or you'll have a crêperie in Quimper.", "When you're sad, remember your dreams."]
        grammar: [g.quand-futur]
        vocab: [w.quand.conj, w.pilote]
      - title: "Message de Paul"
        es: ["Dès que j'aurai mes vacances, je viendrai en Bretagne.", "Quand je serai chez toi, on fera des crêpes ensemble.", "À bientôt !"]
        en: ["As soon as I have my holidays, I'll come to Brittany.", "When I'm at your place, we'll make crêpes together.", "See you soon!"]
        grammar: [g.quand-futur]
        vocab: [w.dès-que]
    spicy:
      - { es: "Quand tu seras à Quimper, appelle-moi : je serai ton guide et je t'offrirai la meilleure galette de la ville.", en: "When you're in Quimper, call me: I'll be your guide and I'll treat you to the best galette in town.", grammar: [g.quand-futur], vocab: [w.quand.conj, w.guide] }
      - { es: "Dès que tu arriveras, je t'emmènerai danser.", en: "As soon as you arrive, I'll take you dancing.", grammar: [g.quand-futur], vocab: [w.dès-que, w.danser] }
      - { es: "Lorsque nous serons vieux, je te ferai encore des crêpes au caramel.", en: "When we're old, I'll still make you caramel crêpes.", grammar: [g.quand-futur], vocab: [w.lorsque, w.crêpe] }
      - { es: "Quand tu me verras en costume breton, tu tomberas sous le charme.", en: "When you see me in Breton costume, you'll fall under my spell.", grammar: [g.quand-futur], vocab: [w.costume, w.tomber, w.charme] }
      - { es: "Je te dirai oui quand tu m'inviteras à dîner. Donc ce soir ?", en: "I'll say yes when you invite me to dinner. So tonight?", grammar: [g.quand-futur], vocab: [w.inviter] }
dialogues:
  - id: a2.u08.d1
    title: "Le programme du week-end"
    context: "Sophie phones her friend Yann, who lives in Quimper, to plan her weekend visit during the festival."
    lines:
      - { speaker: Sophie, es: "Allô, Yann ? J'arriverai à Quimper samedi à onze heures.", en: "Hello, Yann? I'll arrive in Quimper on Saturday at eleven." }
      - { speaker: Yann, es: "Super ! Je viendrai te chercher à la gare.", en: "Great! I'll come and pick you up at the station." }
      - { speaker: Sophie, es: "Qu'est-ce qu'on fera ?", en: "What will we do?" }
      - { speaker: Yann, es: "Dès que tu arriveras, on ira manger des galettes. Après, on verra le grand défilé.", en: "As soon as you arrive, we'll go and eat galettes. Afterwards, we'll see the big parade." }
      - { speaker: Sophie, es: "Et s'il pleut ?", en: "And if it rains?" }
      - { speaker: Yann, es: "S'il pleut, on visitera le musée. Mais la météo prévoit du soleil avec quelques averses.", en: "If it rains, we'll visit the museum. But the forecast says sun with a few showers." }
      - { speaker: Sophie, es: "Typique de la Bretagne ! Je prendrai mon parapluie.", en: "Typical of Brittany! I'll take my umbrella." }
      - { speaker: Yann, es: "Et le soir, il y aura un concert de cornemuse sur la place.", en: "And in the evening there'll be a bagpipe concert on the square." }
      - { speaker: Sophie, es: "Génial ! Quand je serai là, tu m'apprendras une danse bretonne ?", en: "Brilliant! When I'm there, will you teach me a Breton dance?" }
      - { speaker: Yann, es: "Promis. Tu verras, ce sera facile !", en: "Promise. You'll see, it'll be easy!" }
    questions:
      - { q: "Quand est-ce que Sophie arrivera à Quimper ?", options: ["Vendredi soir", "Samedi à onze heures", "Dimanche matin"], answer: 1, explain: "Sophie says: J'arriverai à Quimper samedi à onze heures." }
      - { q: "Qu'est-ce qu'ils feront s'il pleut ?", options: ["Ils resteront à la gare", "Ils visiteront le musée", "Ils iront à la plage"], answer: 1, explain: "Yann: S'il pleut, on visitera le musée." }
      - { q: "Que prévoit la météo ?", options: ["Du soleil avec quelques averses", "De la neige", "Un orage toute la journée"], answer: 0, explain: "The forecast is sun with a few showers." }
      - { q: "Qu'est-ce que Yann apprendra à Sophie ?", options: ["À faire des galettes", "À jouer de la cornemuse", "Une danse bretonne"], answer: 2, explain: "Sophie asks him to teach her a Breton dance, and he promises." }
