id: r.c1.la-tortuga-gigante
level: c1
title: La tortuga gigante (fragmento)
kind: literature
author: Horacio Quiroga (1878–1937)
source: "Cuentos de la selva (1918), «La tortuga gigante», primeras páginas"
intro: The opening of Quiroga's children's story about a sick man sent to the jungle of Misiones to hunt, and the wounded tortoise he decides to save. The text follows the original closely; a few sentences have been shortened or omitted, and Río de la Plata usages (plata = money, bichos = animals, mate) are explained in the glossary.
allow: [buenos aires, misiones, zoológico]
paragraphs:
  - { es: "Había una vez un hombre que vivía en Buenos Aires, y estaba muy contento porque era un hombre sano y trabajador. Pero un día se enfermó, y los médicos le dijeron que solamente yéndose al campo podría curarse. Él no quería ir, porque tenía hermanos chicos a quienes daba de comer; y se enfermaba cada día más.", en: "Once upon a time there was a man who lived in Buenos Aires, and he was very happy because he was a healthy, hard-working man. But one day he fell ill, and the doctors told him that only by going to the country could he get well. He did not want to go, because he had small brothers whom he fed; and he grew sicker every day." }
  - { es: "Hasta que un amigo suyo, que era director del Zoológico, le dijo un día: —Usted es amigo mío, y es un hombre bueno y trabajador. Por eso quiero que se vaya a vivir al monte, a hacer mucho ejercicio al aire libre para curarse. Y como usted tiene mucha puntería con la escopeta, cace bichos del monte para traerme los cueros, y yo le daré plata adelantada para que sus hermanitos puedan comer bien.", en: "Until a friend of his, who was the director of the Zoo, said to him one day: 'You are my friend, and you are a good, hard-working man. That is why I want you to go and live in the bush, to get lots of exercise in the open air to recover. And since you are a very good shot with the shotgun, hunt wild animals to bring me their skins, and I will give you money in advance so that your little brothers can eat well.'" }
  - { es: "El hombre enfermo aceptó, y se fue a vivir al monte, lejos, más lejos que Misiones todavía. Hacía allá mucho calor, y eso le hacía bien.", en: "The sick man accepted, and went to live in the bush, far away, farther even than Misiones. It was very hot there, and that did him good." }
  - { es: "Vivía solo en el bosque, y él mismo se cocinaba. Comía pájaros y bichos del monte, que cazaba con la escopeta, y después comía frutas. Dormía bajo los árboles, y cuando hacía mal tiempo construía en cinco minutos una ramada con hojas de palmera, y allí pasaba sentado y fumando, muy contento en medio del bosque que bramaba con el viento y la lluvia.", en: "He lived alone in the forest, and cooked for himself. He ate birds and wild animals, which he hunted with the shotgun, and afterwards he ate fruit. He slept under the trees, and when the weather was bad he built in five minutes a shelter of palm leaves, and there he sat smoking, very happy in the middle of the forest that roared with the wind and the rain." }
  - { es: "Había hecho un atado con los cueros de los animales, y lo llevaba al hombro. Había agarrado, vivas, muchas víboras venenosas, y las llevaba dentro de un gran mate, porque allá hay mates tan grandes como una lata de querosene.", en: "He had made a bundle of the animals' skins, and carried it on his shoulder. He had caught, alive, many poisonous vipers, and carried them inside a big gourd, because over there gourds grow as big as a can of kerosene." }
  - { es: "El hombre tenía otra vez buen color, estaba fuerte y tenía apetito. Precisamente un día en que tenía mucha hambre, porque hacía dos días que no cazaba nada, vio a la orilla de una gran laguna un tigre enorme que quería comer una tortuga, y la ponía parada de canto para meter dentro una pata y sacar la carne con las uñas.", en: "The man had a good colour again, he was strong and had an appetite. Precisely one day when he was very hungry, because he had not hunted anything for two days, he saw on the shore of a great lagoon an enormous tiger that wanted to eat a tortoise, and was standing it on its edge to put a paw inside and pull out the meat with its claws." }
  - { es: "Al ver al hombre el tigre lanzó un rugido espantoso y se lanzó de un salto sobre él. Pero el cazador, que tenía una gran puntería, le apuntó entre los dos ojos, y le rompió la cabeza. Después le sacó el cuero, tan grande que él solo podría servir de alfombra para un cuarto.", en: "On seeing the man the tiger let out a dreadful roar and sprang at him. But the hunter, who was a very good shot, aimed between its two eyes and shattered its head. Then he took off its skin, so big that on its own it could serve as a rug for a room." }
  - { es: "—Ahora —se dijo el hombre— voy a comer tortuga, que es una carne muy rica. Pero cuando se acercó a la tortuga, vio que estaba ya herida, y tenía la cabeza casi separada del cuello, y la cabeza colgaba casi de dos o tres hilos de carne.", en: "'Now,' the man said to himself, 'I am going to eat tortoise, which is very tasty meat.' But when he approached the tortoise, he saw that it was already wounded, and its head was almost separated from its neck, and the head hung by barely two or three threads of flesh." }
  - { es: "A pesar del hambre que sentía, el hombre tuvo lástima de la pobre tortuga, y la llevó arrastrando con una soga hasta su ramada y le vendó la cabeza con tiras de género que sacó de su camisa, porque no tenía más que una sola camisa, y no tenía trapos.", en: "In spite of the hunger he felt, the man took pity on the poor tortoise, and dragged it with a rope to his shelter and bandaged its head with strips of cloth that he tore from his shirt, because he had only one shirt, and had no rags." }
questions:
  - { q: "Why does the man not want to leave Buenos Aires at first?", options: ["He is afraid of the jungle", "He feeds his small brothers and does not want to leave them", "He does not trust the doctors"], answer: 1 }
  - { q: "What deal does the director of the Zoo offer him?", options: ["A job as a zookeeper", "To hunt animals and bring back their skins in exchange for money paid in advance", "A free trip to Misiones"], answer: 1 }
  - { q: "What is the man doing when the tiger appears?", options: ["Sleeping under a tree", "Hunting after two days without food", "Building a shelter"], answer: 1 }
  - { q: "Why does he not eat the tortoise after killing the tiger?", options: ["Tortoise meat is poisonous", "He feels pity because the tortoise is badly wounded", "The tiger had already eaten it"], answer: 1 }
  - { q: "What does he use to bandage the tortoise's head?", options: ["Palm leaves", "Strips torn from his only shirt", "The tiger's skin"], answer: 1 }
