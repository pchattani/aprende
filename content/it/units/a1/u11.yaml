id: a1.u11
title: "Scusi, dov'è la fontana?"
lessons:
  - id: a1.u11.l1
    title: Scusi, per andare a Testaccio?
    teach: [g.imperative-directions]
    vocab: [w.destra, w.sinistra, w.dritto, w.sempre-dritto, w.girare, w.attraversare, w.continuare, w.angolo, w.incrocio, w.semaforo, w.viale, w.ponte, w.fontana, w.fermata, w.di-fronte-a, w.fino-in-fondo]
    tip: "To a friend: gira, vai, prendi, attraversa. To a stranger (Lei): giri, vada, prenda, attraversi."
    sentences:
      - { es: "Scusi, per andare a Piazza Testaccio?", en: "Excuse me, how do I get to Piazza Testaccio?", altEs: ["Scusi, come arrivo a Piazza Testaccio?", "Scusi, per Piazza Testaccio?"], grammar: [g.imperative-directions, g.tu-vs-lei], vocab: [w.scusi, w.piazza] }
      - { es: "Vada sempre dritto e poi giri a sinistra.", en: "Keep going straight on and then turn left.", altEs: ["Vada dritto e poi giri a sinistra."], altEn: ["Go straight ahead and then turn left."], grammar: [g.imperative-directions], vocab: [w.sempre-dritto, w.girare, w.sinistra],
          transform: { instruction: "Say it to a friend (tu)", answer: "Vai sempre dritto e poi gira a sinistra.", alt: ["Vai dritto e poi gira a sinistra."], en: "Keep going straight on and then turn left." } }
      - { es: "Giri a destra all'incrocio.", en: "Turn right at the crossroads.", altEs: ["All'incrocio giri a destra."], altEn: ["Turn right at the junction."], grammar: [g.imperative-directions], vocab: [w.destra, w.incrocio] }
      - { es: "Attraversa il ponte e sei a Testaccio.", en: "Cross the bridge and you're in Testaccio.", altEs: ["Attraversa il ponte e arrivi a Testaccio."], grammar: [g.imperative-directions], vocab: [w.attraversare, w.ponte] }
      - { es: "Continui fino alla fontana.", en: "Carry on as far as the fountain.", altEs: ["Continui fino alla fontana, per favore."], grammar: [g.imperative-directions], vocab: [w.continuare, w.fontana, w.fino-a] }
      - { es: "La fermata dell'autobus è di fronte alla farmacia.", en: "The bus stop is opposite the chemist's.", altEs: ["La fermata dell'autobus è davanti alla farmacia."], grammar: [g.articulated-prepositions], vocab: [w.fermata, w.di-fronte-a, w.farmacia] }
      - { es: "Prenda il viale e vada fino in fondo.", en: "Take the avenue and go all the way to the end.", altEs: ["Prenda il viale e continui fino in fondo."], grammar: [g.imperative-directions], vocab: [w.viale, w.fino-in-fondo],
          error: { wrong: "Prende il viale e vada fino in fondo.", explain: "The Lei command of -ere verbs ends in -a: prenda (prende means 'he/she takes').", grammar: g.imperative-directions } }
      - { es: "Scusi, dov'è la Fontana delle Anfore?", en: "Excuse me, where's the Fountain of the Amphorae?", altEs: ["Scusi, sa dov'è la Fontana delle Anfore?"], grammar: [g.question-words], vocab: [w.fontana, w.dove] }
      - { es: "È in Piazza Testaccio, vicino al mercato.", en: "It's in Piazza Testaccio, near the market.", altEs: ["È in Piazza Testaccio, accanto al mercato."], grammar: [g.simple-prepositions], vocab: [w.vicino, w.mercato] }
      - { es: "Gira all'angolo e poi vai dritto.", en: "Turn at the corner and then go straight on.", altEs: ["Gira all'angolo e poi vai sempre dritto."], grammar: [g.imperative-directions], vocab: [w.angolo, w.dritto],
          transform: { instruction: "Say it formally (Lei)", answer: "Giri all'angolo e poi vada dritto.", alt: ["Giri all'angolo e poi vada sempre dritto."], en: "Turn at the corner and then go straight on." } }
      - { es: "Non attraversare la strada con il rosso!", en: "Don't cross the road when the light is red!", altEs: ["Non attraversare la strada col rosso!"], grammar: [g.imperative-directions, g.negation], vocab: [w.attraversare, w.strada, w.rosso] }
      - { es: "Signora, giri a sinistra dopo il ponte.", en: "Madam, turn left after the bridge.", altEs: ["Dopo il ponte giri a sinistra, signora."], grammar: [g.imperative-directions, g.tu-vs-lei], vocab: [w.girare, w.ponte],
          error: { wrong: "Signora, gira a sinistra dopo il ponte.", explain: "With Lei, -are verbs end in -i: giri. Gira is the tu form.", grammar: g.imperative-directions } }
      - { es: "È lontano? — No, sono cinque minuti a piedi.", en: "Is it far? — No, it's five minutes on foot.", altEs: ["È lontano? — No, cinque minuti a piedi."], grammar: [g.question-words], vocab: [w.lontano, w.a-piedi] }
      - { es: "Vai sempre dritto fino al semaforo.", en: "Keep going straight on to the traffic lights.", altEs: ["Vai dritto fino al semaforo."], grammar: [g.imperative-directions], vocab: [w.semaforo, w.sempre-dritto] }
      - { es: "Attraversi la piazza e la fermata è lì.", en: "Cross the square and the stop is there.", altEs: ["Attraversi la piazza: la fermata è lì."], grammar: [g.imperative-directions], vocab: [w.attraversare, w.fermata] }
      - { es: "Dov'è la fermata della metro? — All'angolo, a destra.", en: "Where's the metro stop? — At the corner, on the right.", altEs: ["Dov'è la fermata della metropolitana? — All'angolo, a destra."], grammar: [g.question-words], vocab: [w.fermata, w.angolo, w.destra] }
    exchanges:
      - q: { es: "Scusi, per andare al mercato di Testaccio?", en: "Excuse me, how do I get to Testaccio market?" }
        a: { es: "Vada dritto e giri alla seconda a destra.", en: "Go straight on and take the second on the right." }
        alt: ["È lì, all'angolo.", "Sempre dritto, cinque minuti."]
        grammar: [g.imperative-directions]
        vocab: [w.dritto, w.destra]
      - q: { es: "È lontano?", en: "Is it far?" }
        a: { es: "No, è qui vicino.", en: "No, it's close by." }
        alt: ["Sì, è meglio prendere l'autobus.", "Dieci minuti a piedi."]
        grammar: [g.question-words]
        vocab: [w.lontano, w.vicino]
      - q: { es: "Scusi, dov'è la fontana?", en: "Excuse me, where's the fountain?" }
        a: { es: "È in fondo alla strada, di fronte al bar.", en: "It's at the end of the street, opposite the bar." }
        alt: ["In piazza.", "Mi dispiace, non lo so."]
        grammar: [g.imperative-directions]
        vocab: [w.fontana, w.di-fronte-a]
      - q: { es: "Dove giro?", en: "Where do I turn?" }
        a: { es: "Al semaforo, a sinistra.", en: "At the lights, left." }
        alt: ["Gira a destra all'incrocio.", "Non giri, vada sempre dritto."]
        grammar: [g.imperative-directions]
        vocab: [w.girare, w.semaforo]
      - q: { es: "Devo attraversare il ponte?", en: "Do I have to cross the bridge?" }
        a: { es: "Sì, attraversa il ponte e poi gira a destra.", en: "Yes, cross the bridge and then turn right." }
        alt: ["No, rimani su questa strada.", "Sì, e poi vai dritto."]
        grammar: [g.imperative-directions, g.potere-dovere]
        vocab: [w.attraversare, w.ponte]
    texts:
      - title: "Come arrivare da me"
        es: ["Scendi alla fermata Piramide.", "Attraversa il viale e gira a sinistra.", "Casa mia è la terza porta a destra, di fronte alla fontana."]
        en: ["Get off at the Piramide stop.", "Cross the avenue and turn left.", "My place is the third door on the right, opposite the fountain."]
        grammar: [g.imperative-directions, g.ordinal-numbers]
        vocab: [w.viale, w.sinistra, w.di-fronte-a]
      - title: "Indicazioni per i turisti"
        es: ["Per il Monte dei Cocci, vada sempre dritto.", "Al semaforo giri a destra.", "Il mercato è in fondo alla strada."]
        en: ["For Monte dei Cocci, keep going straight on.", "Turn right at the traffic lights.", "The market is at the end of the street."]
        grammar: [g.imperative-directions]
        vocab: [w.sempre-dritto, w.semaforo, w.in-fondo]
    spicy:
      - { es: "Scusa, per andare al tuo cuore? Destra o sinistra?", en: "Excuse me, which way to your heart? Right or left?", grammar: [g.imperative-directions], vocab: [w.destra, w.sinistra, w.cuore] }
      - { es: "Gira a destra, gira a sinistra... tanto arrivi sempre da me.", en: "Turn right, turn left... you always end up at my place anyway.", grammar: [g.imperative-directions], vocab: [w.girare] }
      - { es: "Non attraversare la strada: rimani qui con me.", en: "Don't cross the road: stay here with me.", grammar: [g.imperative-directions], vocab: [w.attraversare, w.rimanere] }
      - { es: "Tu sei il mio semaforo verde.", en: "You're my green light.", grammar: [g.colours], vocab: [w.semaforo, w.verde] }
      - { es: "Vai sempre dritto... e non guardare le altre ragazze!", en: "Keep going straight on... and don't look at the other girls!", altEs: ["Vai sempre dritto... e non guardare gli altri ragazzi!"], grammar: [g.imperative-directions], vocab: [w.dritto, w.guardare] }
  - id: a1.u11.l2
    title: La seconda a destra
    teach: [g.ordinal-numbers]
    vocab: [w.primo, w.secondo, w.terzo, w.quarto.adj, w.quinto, w.sesto, w.settimo, w.ottavo, w.nono, w.decimo, w.ultimo, w.metro, w.metro.f, w.chilometro]
    tip: "Ordinals agree like adjectives: il primo piano, la prima strada. Il primo piano is one floor above the ground floor."
    sentences:
      - { es: "Prenda la prima strada a sinistra.", en: "Take the first street on the left.", altEs: ["Prenda la prima a sinistra."], grammar: [g.ordinal-numbers, g.imperative-directions], vocab: [w.primo, w.strada] }
      - { es: "Abito al terzo piano, senza ascensore!", en: "I live on the third floor, with no lift!", altEs: ["Abito al terzo piano e non c'è l'ascensore!"], grammar: [g.ordinal-numbers], vocab: [w.terzo, w.piano, w.ascensore],
          transform: { instruction: "Change to 'we'", answer: "Abitiamo al terzo piano, senza ascensore!", en: "We live on the third floor, with no lift!" } }
      - { es: "È la mia prima volta a Testaccio.", en: "It's my first time in Testaccio.", altEs: ["Sono a Testaccio per la prima volta."], grammar: [g.ordinal-numbers], vocab: [w.primo, w.volta] }
      - { es: "Giri alla seconda a destra.", en: "Turn at the second on the right.", altEs: ["Prenda la seconda a destra."], altEn: ["Take the second right."], grammar: [g.ordinal-numbers, g.imperative-directions], vocab: [w.secondo, w.destra],
          transform: { instruction: "Change to 'third'", answer: "Giri alla terza a destra.", en: "Turn at the third on the right." } }
      - { es: "Il bagno è al primo piano.", en: "The bathroom is on the first floor.", altEs: ["Il bagno è di sopra, al primo piano."], grammar: [g.ordinal-numbers], vocab: [w.primo, w.bagno] }
      - { es: "La terza porta a sinistra è il mio ufficio.", en: "The third door on the left is my office.", altEs: ["Il mio ufficio è la terza porta a sinistra."], grammar: [g.ordinal-numbers], vocab: [w.terzo, w.porta, w.ufficio],
          error: { wrong: "Il terzo porta a sinistra è il mio ufficio.", explain: "Ordinals agree with the noun: porta is feminine, so la terza porta.", grammar: g.ordinal-numbers } }
      - { es: "Il mercato è a cento metri.", en: "The market is a hundred metres away.", altEs: ["Il mercato è a cento metri da qui."], grammar: [g.numbers-100-plus], vocab: [w.metro, w.mercato] }
      - { es: "La stazione è a due chilometri da qui.", en: "The station is two kilometres from here.", altEs: ["La stazione è a due chilometri."], grammar: [g.simple-prepositions], vocab: [w.chilometro, w.stazione] }
      - { es: "Dicembre è il dodicesimo mese dell'anno.", en: "December is the twelfth month of the year.", altEs: ["Dicembre è l'ultimo mese dell'anno."], grammar: [g.ordinal-numbers, g.days-months], vocab: [w.dicembre, w.mese] }
      - { es: "Sono il quinto in fila.", en: "I'm fifth in the queue.", altEs: ["Sono il quinto della fila.", "Sono la quinta in fila."], grammar: [g.ordinal-numbers], vocab: [w.quinto, w.fila] }
      - { es: "Arriviamo sempre ultimi!", en: "We always arrive last!", altEs: ["Arriviamo sempre per ultimi!"], grammar: [g.ordinal-numbers, g.frequency-adverbs], vocab: [w.ultimo, w.arrivare] }
      - { es: "Per secondo prendo il pollo.", en: "For the main course I'll have the chicken.", altEs: ["Come secondo prendo il pollo."], grammar: [g.ordinal-numbers], vocab: [w.secondo, w.pollo], note: "Il primo (piatto) is pasta or soup; il secondo is the meat or fish course." }
      - { es: "Prendi la quarta strada a destra, non la terza.", en: "Take the fourth street on the right, not the third.", altEs: ["Prendi la quarta a destra, non la terza."], grammar: [g.ordinal-numbers, g.imperative-directions], vocab: [w.quarto.adj, w.terzo],
          error: { wrong: "Prendi la quattro strada a destra, non la tre.", explain: "For 'fourth' and 'third' use the ordinals: la quarta, la terza.", grammar: g.ordinal-numbers } }
      - { es: "Il Monte dei Cocci è alto circa trentacinque metri.", en: "Monte dei Cocci is about thirty-five metres high.", altEs: ["Il Monte dei Cocci è alto più o meno trentacinque metri."], grammar: [g.numbers-0-100], vocab: [w.metro, w.circa] }
      - { es: "Abitano all'ottavo piano e prendono sempre l'ascensore.", en: "They live on the eighth floor and always take the lift.", altEs: ["Abitano all'ottavo piano e usano sempre l'ascensore."], grammar: [g.ordinal-numbers], vocab: [w.ottavo, w.ascensore] }
      - { es: "Il sesto giorno della settimana è il sabato.", en: "The sixth day of the week is Saturday.", altEs: ["Il sabato è il sesto giorno della settimana."], grammar: [g.ordinal-numbers, g.days-months], vocab: [w.sesto, w.settimana] }
    exchanges:
      - q: { es: "A che piano abiti?", en: "Which floor do you live on?" }
        a: { es: "Al quinto piano.", en: "On the fifth floor." }
        alt: ["Al primo.", "Al piano terra."]
        grammar: [g.ordinal-numbers]
        vocab: [w.quinto, w.piano]
      - q: { es: "È lontana la stazione?", en: "Is the station far?" }
        a: { es: "No, è a cinquecento metri.", en: "No, it's five hundred metres away." }
        alt: ["Circa un chilometro.", "Sì, abbastanza."]
        grammar: [g.numbers-100-plus]
        vocab: [w.metro, w.chilometro]
      - q: { es: "Quale strada prendo?", en: "Which street do I take?" }
        a: { es: "La seconda a sinistra.", en: "The second on the left." }
        alt: ["La prima a destra.", "L'ultima in fondo."]
        grammar: [g.ordinal-numbers]
        vocab: [w.secondo, w.sinistra]
      - q: { es: "È la tua prima volta a Roma?", en: "Is it your first time in Rome?" }
        a: { es: "No, è la terza!", en: "No, it's my third!" }
        alt: ["Sì, la prima.", "No, la seconda."]
        grammar: [g.ordinal-numbers]
        vocab: [w.primo, w.terzo]
      - q: { es: "Per secondo che cosa prende?", en: "What will you have for the main course?" }
        a: { es: "Il pollo con le patate, grazie.", en: "The chicken with potatoes, thanks." }
        alt: ["Niente, grazie.", "Il pesce."]
        grammar: [g.ordinal-numbers]
        vocab: [w.secondo, w.pollo]
    texts:
      - title: "Il mio palazzo"
        es: ["Abito in un vecchio palazzo a Testaccio.", "Il mio appartamento è al quarto piano.", "Al piano terra c'è una trattoria buonissima."]
        en: ["I live in an old building in Testaccio.", "My flat is on the fourth floor.", "On the ground floor there's a great trattoria."]
        grammar: [g.ordinal-numbers]
        vocab: [w.quarto.adj, w.palazzo]
      - title: "Le indicazioni di Giulia"
        es: ["Esci dalla metro e prendi la seconda strada a destra.", "Dopo cento metri c'è una piazza.", "Casa mia è la terza a sinistra."]
        en: ["Come out of the metro and take the second street on the right.", "After a hundred metres there's a square.", "My place is the third on the left."]
        grammar: [g.ordinal-numbers, g.imperative-directions]
        vocab: [w.secondo, w.terzo, w.metro]
    spicy:
      - { es: "È la nostra prima cena insieme? Allora pago io.", en: "Is it our first dinner together? Then I'm paying.", grammar: [g.ordinal-numbers], vocab: [w.primo, w.cena, w.pagare] }
      - { es: "Sono al settimo cielo quando sei qui.", en: "I'm on cloud nine when you're here.", grammar: [g.ordinal-numbers], vocab: [w.settimo, w.cielo], note: "Literally 'in seventh heaven'." }
      - { es: "Primo: sei carina. Secondo: sei simpatica. Terzo: sei libera stasera?", en: "One: you're pretty. Two: you're nice. Three: are you free tonight?", altEs: ["Primo: sei carino. Secondo: sei simpatico. Terzo: sei libero stasera?"], grammar: [g.ordinal-numbers], vocab: [w.primo, w.secondo, w.terzo] }
      - { es: "Abito al quinto piano. Le scale? Per te salgo anche al decimo.", en: "I live on the fifth floor. The stairs? For you I'd even climb to the tenth.", grammar: [g.ordinal-numbers], vocab: [w.quinto, w.decimo, w.salire] }
      - { es: "Non sei la prima ragazza che vedo a Roma, ma sei la più bella.", en: "You're not the first girl I've seen in Rome, but you're the most beautiful.", altEs: ["Non sei il primo ragazzo che vedo a Roma, ma sei il più bello."], grammar: [g.ordinal-numbers], vocab: [w.primo, w.bello] }
  - id: a1.u11.l3
    title: Che cosa stai facendo?
    teach: [g.stare-gerundio]
    vocab: [w.mappa, w.cartina, w.indicazione, w.nord, w.sud, w.est, w.ovest, w.trovare, w.perdersi, w.chiamare, w.traffico]
    tip: "Stare + gerund (-ando, -endo) is for what is happening right now: sto cercando la fermata."
    sentences:
      - { es: "Che cosa stai facendo?", en: "What are you doing?", altEs: ["Cosa stai facendo?", "Che stai facendo?"], grammar: [g.stare-gerundio], vocab: [w.stare, w.fare],
          transform: { instruction: "Ask several people (voi)", answer: "Che cosa state facendo?", alt: ["Cosa state facendo?"], en: "What are you (all) doing?" } }
      - { es: "Sto cercando la Piramide.", en: "I'm looking for the Pyramid.", altEs: ["Cerco la Piramide."], grammar: [g.stare-gerundio], vocab: [w.cercare],
          transform: { instruction: "Change to 'we'", answer: "Stiamo cercando la Piramide.", alt: ["Cerchiamo la Piramide."], en: "We're looking for the Pyramid." } }
      - { es: "Non posso rispondere, sto guidando.", en: "I can't answer, I'm driving.", altEs: ["Non posso rispondere: sto guidando."], grammar: [g.stare-gerundio, g.potere-dovere], vocab: [w.guidare, w.rispondere] }
      - { es: "Stiamo arrivando!", en: "We're on our way!", altEs: ["Arriviamo!"], altEn: ["We're coming!"], grammar: [g.stare-gerundio], vocab: [w.arrivare] }
      - { es: "Mi sto perdendo: dove siamo?", en: "I'm getting lost: where are we?", altEs: ["Sto perdendomi: dove siamo?"], grammar: [g.stare-gerundio, g.reflexive-present], vocab: [w.perdersi] }
      - { es: "Sta piovendo: prendiamo l'autobus?", en: "It's raining: shall we take the bus?", altEs: ["Piove: prendiamo l'autobus?"], grammar: [g.stare-gerundio, g.weather], vocab: [w.piovere, w.autobus] }
      - { es: "Guarda la cartina: siamo a sud del centro.", en: "Look at the map: we're south of the centre.", altEs: ["Guarda la mappa: siamo a sud del centro."], grammar: [g.imperative-directions], vocab: [w.cartina, w.mappa, w.sud] }
      - { es: "Il ristorante è a nord o a sud della piazza?", en: "Is the restaurant north or south of the square?", altEs: ["Il ristorante è a sud o a nord della piazza?"], grammar: [g.articulated-prepositions], vocab: [w.nord, w.sud] }
      - { es: "Ti sto chiamando da dieci minuti!", en: "I've been calling you for ten minutes!", altEs: ["Ti chiamo da dieci minuti!"], grammar: [g.stare-gerundio], vocab: [w.chiamare] }
      - { es: "Non trovo la fermata: sto guardando la mappa.", en: "I can't find the stop: I'm looking at the map.", altEs: ["Non trovo la fermata, sto guardando la mappa."], grammar: [g.stare-gerundio], vocab: [w.trovare, w.mappa] }
      - { es: "Che cosa state mangiando? — Stiamo mangiando una pizza.", en: "What are you (all) eating? — We're eating a pizza.", altEs: ["Cosa state mangiando? — Una pizza."], grammar: [g.stare-gerundio], vocab: [w.mangiare, w.pizza],
          error: { wrong: "Che cosa state mangiando? — Stiamo mangiare una pizza.", explain: "Stare is followed by the gerund: stiamo mangiando.", grammar: g.stare-gerundio } }
      - { es: "I ragazzi stanno giocando a calcio a Campo Testaccio.", en: "The kids are playing football at Campo Testaccio.", altEs: ["A Campo Testaccio i ragazzi stanno giocando a calcio."], grammar: [g.stare-gerundio, g.giocare-suonare], vocab: [w.giocare, w.calcio] }
      - { es: "C'è molto traffico: stiamo andando piano.", en: "There's a lot of traffic: we're going slowly.", altEs: ["C'è tanto traffico, stiamo andando piano."], grammar: [g.stare-gerundio, g.molto-poco-troppo], vocab: [w.traffico] }
      - { es: "Parto domani per Firenze.", en: "I'm leaving for Florence tomorrow.", altEs: ["Domani parto per Firenze."], grammar: [g.stare-gerundio, g.present-for-future], vocab: [w.partire, w.domani],
          error: { wrong: "Sto partendo domani per Firenze.", explain: "Stare + gerund is only for what is happening right now; for a future plan use the present: parto domani.", grammar: g.stare-gerundio } }
      - { es: "Sto leggendo le indicazioni, ma non capisco niente!", en: "I'm reading the directions, but I don't understand a thing!", altEs: ["Leggo le indicazioni, ma non capisco niente!"], grammar: [g.stare-gerundio, g.negation], vocab: [w.indicazione, w.capire] }
      - { es: "Il Tevere è a ovest di Testaccio e il centro storico è a nord.", en: "The Tiber is west of Testaccio and the historic centre is to the north.", altEs: ["Il Tevere è a ovest di Testaccio, il centro storico è a nord."], grammar: [g.simple-prepositions], vocab: [w.ovest, w.nord] }
    exchanges:
      - q: { es: "Che cosa stai facendo?", en: "What are you doing?" }
        a: { es: "Sto cucinando la cena.", en: "I'm cooking dinner." }
        alt: ["Niente, sto guardando la tv.", "Sto lavorando."]
        grammar: [g.stare-gerundio]
        vocab: [w.cucinare, w.cena]
      - q: { es: "Dove sei? Ti sto aspettando!", en: "Where are you? I'm waiting for you!" }
        a: { es: "Scusa, sto arrivando!", en: "Sorry, I'm on my way!" }
        alt: ["Arrivo!", "Sono quasi lì."]
        grammar: [g.stare-gerundio]
        vocab: [w.aspettare, w.arrivare]
      - q: { es: "Che cosa cerchi?", en: "What are you looking for?" }
        a: { es: "Sto cercando il mercato di Testaccio.", en: "I'm looking for Testaccio market." }
        alt: ["La fermata della metro.", "Una farmacia."]
        grammar: [g.stare-gerundio]
        vocab: [w.cercare, w.mercato]
      - q: { es: "Piove ancora?", en: "Is it still raining?" }
        a: { es: "Sì, sta piovendo forte.", en: "Yes, it's raining hard." }
        alt: ["No, c'è il sole.", "Un po'."]
        grammar: [g.stare-gerundio, g.weather]
        vocab: [w.piovere]
      - q: { es: "Hai la cartina?", en: "Have you got the map?" }
        a: { es: "Sì, la sto guardando adesso.", en: "Yes, I'm looking at it now." }
        alt: ["No, guardo il telefono.", "Sì, eccola."]
        grammar: [g.stare-gerundio, g.lo-prendo]
        vocab: [w.cartina, w.guardare]
    texts:
      - title: "Messaggio di Tom"
        es: ["Giulia, mi sto perdendo a Testaccio!", "Sono vicino a una piramide bianca.", "Mi chiami, per favore?"]
        en: ["Giulia, I'm getting lost in Testaccio!", "I'm near a white pyramid.", "Will you call me, please?"]
        grammar: [g.stare-gerundio]
        vocab: [w.perdersi, w.chiamare]
      - title: "Al telefono"
        es: ["Che cosa stai facendo? Io sto andando al mercato.", "Mia madre sta cucinando e mio padre sta leggendo.", "E il cane? Sta dormendo, come sempre."]
        en: ["What are you doing? I'm on my way to the market.", "My mother is cooking and my father is reading.", "And the dog? He's sleeping, as always."]
        grammar: [g.stare-gerundio]
        vocab: [w.cucinare, w.leggere, w.dormire]
    spicy:
      - { es: "Che cosa stai facendo? Io sto ascoltando la nostra canzone.", en: "What are you doing? I'm listening to our song.", grammar: [g.stare-gerundio], vocab: [w.ascoltare, w.canzone] }
      - { es: "Non ti sto guardando... sto guardando la piazza dietro di te.", en: "I'm not looking at you... I'm looking at the square behind you.", grammar: [g.stare-gerundio], vocab: [w.guardare, w.dietro] }
      - { es: "Mi sto perdendo... nei tuoi occhi.", en: "I'm getting lost... in your eyes.", grammar: [g.stare-gerundio], vocab: [w.perdersi, w.occhio] }
      - { es: "Sto arrivando! Metti il vino in frigo.", en: "I'm on my way! Put the wine in the fridge.", grammar: [g.stare-gerundio], vocab: [w.arrivare, w.vino, w.frigorifero] }
      - { es: "Stai sorridendo? Allora la cena sta andando bene.", en: "Are you smiling? Then dinner is going well.", grammar: [g.stare-gerundio], vocab: [w.cena] }
  - id: a1.u11.l4
    title: Bisogna prenotare?
    teach: [g.bisogna-avere-bisogno]
    vocab: [w.bisogna, w.storico, w.centro-storico, w.già, w.quasi, w.circa, w.più-o-meno, w.grazie-lo-stesso]
    tip: "Bisogna + infinitive = you have to (in general); ho bisogno di = I need; mi serve / mi servono = I need (it is needed)."
    sentences:
      - { es: "Per entrare nel museo bisogna prenotare.", en: "To get into the museum you have to book.", altEs: ["Per entrare nel museo è necessario prenotare.", "Bisogna prenotare per entrare nel museo."], grammar: [g.bisogna-avere-bisogno], vocab: [w.bisogna, w.prenotare],
          error: { wrong: "Per entrare nel museo bisognano prenotare.", explain: "Bisogna never changes: bisogna prenotare.", grammar: g.bisogna-avere-bisogno } }
      - { es: "Non bisogna pagare: è gratis.", en: "You don't have to pay: it's free.", altEs: ["Non bisogna pagare, è gratis."], grammar: [g.bisogna-avere-bisogno, g.negation], vocab: [w.bisogna, w.gratis] }
      - { es: "Ho bisogno di una mappa del centro storico.", en: "I need a map of the historic centre.", altEs: ["Mi serve una mappa del centro storico.", "Ho bisogno di una cartina del centro storico."], grammar: [g.bisogna-avere-bisogno], vocab: [w.bisogno, w.centro-storico],
          transform: { instruction: "Change to 'we'", answer: "Abbiamo bisogno di una mappa del centro storico.", alt: ["Ci serve una mappa del centro storico."], en: "We need a map of the historic centre." } }
      - { es: "Abbiamo bisogno di un caffè!", en: "We need a coffee!", altEs: ["Ci serve un caffè!"], grammar: [g.bisogna-avere-bisogno], vocab: [w.bisogno, w.caffè] }
      - { es: "Ti serve qualcosa?", en: "Do you need anything?", altEs: ["Hai bisogno di qualcosa?"], grammar: [g.bisogna-avere-bisogno], vocab: [w.servire, w.qualcosa],
          transform: { instruction: "Ask formally (Lei)", answer: "Le serve qualcosa?", alt: ["Ha bisogno di qualcosa?"], en: "Do you need anything?" } }
      - { es: "Mi servono due biglietti per la metro.", en: "I need two metro tickets.", altEs: ["Ho bisogno di due biglietti per la metro."], grammar: [g.bisogna-avere-bisogno], vocab: [w.servire, w.biglietto],
          error: { wrong: "Mi serve due biglietti per la metro.", explain: "The things needed are plural, so the verb is plural: mi servono.", grammar: g.bisogna-avere-bisogno } }
      - { es: "Il mercato di Testaccio è già aperto?", en: "Is Testaccio market already open?", altEs: ["È già aperto il mercato di Testaccio?"], grammar: [g.question-words], vocab: [w.già, w.mercato] }
      - { es: "Siamo quasi a Testaccio.", en: "We're almost in Testaccio.", altEs: ["Siamo quasi arrivati a Testaccio."], grammar: [g.essere-present], vocab: [w.quasi] }
      - { es: "Ci vogliono circa venti minuti a piedi.", en: "It takes about twenty minutes on foot.", altEs: ["Ci vogliono più o meno venti minuti a piedi."], grammar: [g.bisogna-avere-bisogno], vocab: [w.circa, w.minuto] }
      - { es: "Sono più o meno le tre.", en: "It's more or less three o'clock.", altEs: ["Sono circa le tre."], grammar: [g.time-telling], vocab: [w.più-o-meno] }
      - { es: "Non so dov'è. — Grazie lo stesso!", en: "I don't know where it is. — Thanks anyway!", altEs: ["Non lo so, mi dispiace. — Grazie lo stesso!"], grammar: [g.sapere-conoscere], vocab: [w.grazie-lo-stesso] }
      - { es: "Avete bisogno di aiuto?", en: "Do you (all) need help?", altEs: ["Vi serve aiuto?", "Avete bisogno d'aiuto?"], grammar: [g.bisogna-avere-bisogno], vocab: [w.bisogno, w.aiuto] }
      - { es: "Bisogna attraversare il ponte per andare a Trastevere.", en: "You have to cross the bridge to get to Trastevere.", altEs: ["Per andare a Trastevere bisogna attraversare il ponte."], grammar: [g.bisogna-avere-bisogno], vocab: [w.bisogna, w.ponte] }
      - { es: "Testaccio non è nel centro storico, ma è molto vicino.", en: "Testaccio isn't in the historic centre, but it's very close.", altEs: ["Testaccio non è nel centro storico, però è molto vicino."], grammar: [g.negation], vocab: [w.centro-storico, w.vicino] }
      - { es: "Per la metro è necessario avere il biglietto.", en: "For the metro you need a ticket.", altEs: ["Per la metro bisogna avere il biglietto."], grammar: [g.bisogna-avere-bisogno], vocab: [w.biglietto] }
      - { es: "Il Monte dei Cocci è un posto storico, ma non è molto famoso.", en: "Monte dei Cocci is a historic place, but it isn't very famous.", altEs: ["Il Monte dei Cocci è un luogo storico, ma non è molto famoso."], grammar: [g.adjective-position], vocab: [w.storico, w.famoso] }
    exchanges:
      - q: { es: "Bisogna prenotare?", en: "Do you have to book?" }
        a: { es: "No, non bisogna: si entra e basta.", en: "No, you don't: you just go in." }
        alt: ["Sì, bisogna prenotare.", "Sì, è meglio."]
        grammar: [g.bisogna-avere-bisogno]
        vocab: [w.bisogna, w.prenotare]
      - q: { es: "Ti serve qualcosa dal supermercato?", en: "Do you need anything from the supermarket?" }
        a: { es: "Sì, mi servono il pane e il latte.", en: "Yes, I need bread and milk." }
        alt: ["No, grazie.", "Sì, un po' di frutta."]
        grammar: [g.bisogna-avere-bisogno]
        vocab: [w.servire, w.supermercato]
      - q: { es: "Quanto tempo ci vuole per arrivare a Testaccio?", en: "How long does it take to get to Testaccio?" }
        a: { es: "Circa un quarto d'ora in metro.", en: "About a quarter of an hour by metro." }
        alt: ["Più o meno venti minuti.", "Dieci minuti a piedi."]
        grammar: [g.bisogna-avere-bisogno]
        vocab: [w.circa, w.quarto]
      - q: { es: "Mi dispiace, non lo so.", en: "I'm sorry, I don't know." }
        a: { es: "Grazie lo stesso!", en: "Thanks anyway!" }
        alt: ["Va bene, grazie.", "Non importa, grazie."]
        grammar: [g.greetings]
        vocab: [w.grazie-lo-stesso]
      - q: { es: "Hai bisogno di aiuto?", en: "Do you need help?" }
        a: { es: "Sì, grazie: sto cercando la metro.", en: "Yes, thanks: I'm looking for the metro." }
        alt: ["No, grazie, va tutto bene.", "Sì, non trovo la fermata."]
        grammar: [g.bisogna-avere-bisogno, g.stare-gerundio]
        vocab: [w.bisogno, w.aiuto]
    texts:
      - title: "Informazioni utili"
        es: ["Per prendere l'autobus bisogna avere il biglietto.", "Il biglietto costa un euro e cinquanta.", "Bisogna comprarlo prima di salire."]
        en: ["To take the bus you need a ticket.", "The ticket costs one euro fifty.", "You have to buy it before getting on."]
        grammar: [g.bisogna-avere-bisogno]
        vocab: [w.bisogna, w.biglietto]
      - title: "Per la gita"
        es: ["Abbiamo bisogno di acqua, panini e una cartina.", "Ci servono anche due biglietti per il treno.", "Il treno parte già alle otto!"]
        en: ["We need water, sandwiches and a map.", "We also need two train tickets.", "The train leaves at eight already!"]
        grammar: [g.bisogna-avere-bisogno]
        vocab: [w.bisogno, w.servire, w.già]
    spicy:
      - { es: "Ho bisogno di un caffè... e di un'ora con te.", en: "I need a coffee... and an hour with you.", grammar: [g.bisogna-avere-bisogno], vocab: [w.bisogno, w.caffè] }
      - { es: "Per uscire con me non bisogna prenotare.", en: "You don't need to book to go out with me.", grammar: [g.bisogna-avere-bisogno], vocab: [w.bisogna, w.prenotare] }
      - { es: "Ti serve qualcosa? Un caffè, un ombrello, un fidanzato?", en: "Do you need anything? A coffee, an umbrella, a boyfriend?", altEs: ["Ti serve qualcosa? Un caffè, un ombrello, una fidanzata?"], grammar: [g.bisogna-avere-bisogno], vocab: [w.servire, w.fidanzato] }
      - { es: "Non ho bisogno di una mappa: so già la strada per il tuo cuore.", en: "I don't need a map: I already know the way to your heart.", grammar: [g.bisogna-avere-bisogno], vocab: [w.mappa, w.già, w.cuore] }
      - { es: "Bisogna dirlo: stasera sei proprio bella.", en: "It has to be said: you look really beautiful tonight.", altEs: ["Bisogna dirlo: stasera sei proprio bello."], grammar: [g.bisogna-avere-bisogno], vocab: [w.bisogna, w.bello] }
dialogues:
  - id: a1.u11.d1
    title: "Scusi, dov'è la fontana?"
    context: Tom is lost in Testaccio. He is looking for the Fountain of the Amphorae, where Giulia is waiting, and asks an elderly gentleman for directions.
    lines:
      - { speaker: Tom, es: "Scusi, signore, dov'è la Fontana delle Anfore?", en: "Excuse me, sir, where's the Fountain of the Amphorae?" }
      - { speaker: Signore, es: "La fontana? È in Piazza Testaccio. Lei è a piedi?", en: "The fountain? It's in Piazza Testaccio. Are you on foot?" }
      - { speaker: Tom, es: "Sì, e sto cercando la piazza da venti minuti!", en: "Yes, and I've been looking for the square for twenty minutes!" }
      - { speaker: Signore, es: "Allora, vada sempre dritto fino al semaforo.", en: "Right, keep going straight on to the traffic lights." }
      - { speaker: Tom, es: "E al semaforo giro a destra?", en: "And at the lights do I turn right?" }
      - { speaker: Signore, es: "No, giri a sinistra, poi prenda la seconda strada a destra.", en: "No, turn left, then take the second street on the right." }
      - { speaker: Tom, es: "Bisogna attraversare il viale?", en: "Do I have to cross the avenue?" }
      - { speaker: Signore, es: "Sì. Poi la piazza è lì, di fronte al mercato. Sono circa cinque minuti.", en: "Yes. Then the square is there, opposite the market. It's about five minutes." }
      - { speaker: Tom, es: "Grazie mille! Lei è molto gentile.", en: "Thanks a lot! You're very kind." }
      - { speaker: Signore, es: "Prego! E se ha fame, al mercato fanno dei panini fantastici.", en: "You're welcome! And if you're hungry, they make fantastic sandwiches at the market." }
      - { speaker: Tom, es: "Giulia? Sto arrivando: ci vediamo alla fontana tra cinque minuti!", en: "Giulia? I'm on my way: see you at the fountain in five minutes!" }
    questions:
      - { q: "Che cosa cerca Tom?", options: ["Il mercato", "La Fontana delle Anfore", "La fermata della metro"], answer: 1, explain: "Tom asks where the Fountain of the Amphorae is." }
      - { q: "Che cosa deve fare Tom al semaforo?", options: ["Girare a destra", "Girare a sinistra", "Attraversare il ponte"], answer: 1, explain: "The gentleman says: 'No, giri a sinistra.'" }
      - { q: "Dov'è la piazza?", options: ["Di fronte al mercato", "Dietro la chiesa", "Vicino al Tevere"], answer: 0, explain: "The square is opposite the market." }
      - { q: "Quanto tempo ci vuole?", options: ["Circa cinque minuti", "Venti minuti", "Un'ora"], answer: 0, explain: "It's about five minutes from the avenue." }
