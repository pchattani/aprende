id: r.b1.comment-la-palme-d-or-est-decernee
level: b1
title: Cannes, comment la Palme d'or est décernée
kind: text
intro: A short explainer from a cinema magazine on how the Cannes Film Festival works, from the selection of films to the Palme d'or. Watch the passive voice (est choisi, sont projetés, a été créée).
allow: [croisette, chopard, ok]
paragraphs:
  - { es: "Chaque année, au mois de mai, la petite ville de Cannes devient pendant douze jours la capitale mondiale du cinéma. Des milliers de journalistes, de producteurs et de stars arrivent sur la Croisette, la célèbre promenade au bord de la mer. Mais comment ce festival est-il organisé, et comment la fameuse Palme d'or est-elle décernée ? Voici quelques réponses.", en: "Every year, in May, the small town of Cannes becomes the world capital of cinema for twelve days. Thousands of journalists, producers and stars arrive on the Croisette, the famous seafront promenade. But how is the festival organised, and how is the famous Palme d'or awarded? Here are a few answers." }
  - { es: "Le festival a été créé juste après la Seconde Guerre mondiale : la première édition a eu lieu en 1946. Une édition avait été prévue en 1939, mais elle a été annulée à cause de la guerre. Depuis, le festival n'a été interrompu que quelques fois, par exemple en 1968, pendant les grandes grèves, et en 2020, à cause de la pandémie.", en: "The festival was created just after the Second World War: the first edition took place in 1946. An edition had been planned for 1939, but it was cancelled because of the war. Since then the festival has only been interrupted a few times, for example in 1968, during the big strikes, and in 2020, because of the pandemic." }
  - { es: "Comment les films sont-ils choisis ? Chaque année, plusieurs milliers de films sont envoyés au festival du monde entier. Ils sont tous regardés par un comité de sélection, et seulement une vingtaine sont retenus pour la compétition officielle. Être choisi est déjà une grande récompense pour un réalisateur.", en: "How are the films chosen? Every year several thousand films are sent to the festival from all over the world. They are all watched by a selection committee, and only about twenty are kept for the official competition. Being chosen is already a big reward for a director." }
  - { es: "Les films de la compétition sont projetés dans le Palais des Festivals. Le soir, les équipes des films montent les célèbres marches, couvertes d'un tapis rouge, devant des centaines de photographes. Les règles sont strictes : les hommes doivent porter un costume et les selfies sur les marches sont interdits depuis quelques années. Ces règles sont parfois critiquées, mais elles sont toujours respectées… ou presque.", en: "The competition films are screened in the Palais des Festivals. In the evening, the film crews climb the famous steps, covered with a red carpet, in front of hundreds of photographers. The rules are strict: men must wear a suit, and selfies on the steps have been banned for a few years. These rules are sometimes criticised, but they are always respected… or almost." }
  - { es: "Les films sont jugés par un jury d'environ neuf personnes : des acteurs, des réalisateurs, des écrivains, venus de différents pays. Le jury est présidé chaque année par une grande personnalité du cinéma. Les discussions du jury sont secrètes. Le dernier jour, les prix sont annoncés pendant la cérémonie de clôture, qui est diffusée à la télévision dans de nombreux pays.", en: "The films are judged by a jury of about nine people: actors, directors, writers from different countries. The jury is chaired every year by a major figure in cinema. The jury's discussions are secret. On the last day, the prizes are announced during the closing ceremony, which is broadcast on television in many countries." }
  - { es: "Le prix le plus important est la Palme d'or. Elle a été créée en 1955 ; avant, le meilleur film recevait un « Grand Prix ». Sa forme rappelle les palmiers de la Croisette et les armes de la ville. Depuis 1998, elle est fabriquée en or par un joaillier suisse, Chopard. Une Palme d'or peut changer la carrière d'un réalisateur : son film est ensuite vendu et distribué dans le monde entier.", en: "The most important prize is the Palme d'or. It was created in 1955; before that, the best film received a 'Grand Prix'. Its shape recalls the palm trees of the Croisette and the town's coat of arms. Since 1998 it has been made of gold by a Swiss jeweller, Chopard. A Palme d'or can change a director's career: the film is then sold and distributed all over the world." }
  - { es: "Et le public, dans tout ça ? En principe, le festival est réservé aux professionnels, et il est très difficile d'obtenir une invitation. Mais tout n'est pas fermé : chaque soir, des films sont projetés gratuitement sur la plage, en plein air. Asseyez-vous sur le sable, regardez l'écran sous les étoiles… C'est peut-être la plus belle façon de vivre le festival.", en: "And what about the public? In principle the festival is reserved for professionals, and it's very hard to get an invitation. But not everything is closed: every evening, films are shown free of charge on the beach, in the open air. Sit on the sand, watch the screen under the stars… It may be the most beautiful way to experience the festival." }
questions:
  - { q: "Quand a eu lieu la première édition du festival ?", options: ["En 1939", "En 1946", "En 1955"], answer: 1, explain: "«La première édition a eu lieu en 1946.» The 1939 edition was cancelled because of the war; 1955 is when the Palme d'or was created." }
  - { q: "Combien de films sont retenus pour la compétition officielle ?", options: ["Plusieurs milliers", "Une vingtaine", "Neuf"], answer: 1, explain: "Thousands are sent, but «seulement une vingtaine sont retenus»." }
  - { q: "Qu'est-ce qui est interdit sur les marches ?", options: ["Les costumes", "Les photographes", "Les selfies"], answer: 2, explain: "«Les selfies sur les marches sont interdits depuis quelques années.»" }
  - { q: "Par qui les films sont-ils jugés ?", options: ["Par le public", "Par un jury d'environ neuf personnes", "Par les journalistes"], answer: 1, explain: "«Les films sont jugés par un jury d'environ neuf personnes.» Passive voice + par." }
  - { q: "Comment le public peut-il profiter du festival ?", options: ["En achetant un billet pour les marches", "En regardant des films gratuits sur la plage", "En entrant dans le Palais des Festivals"], answer: 1, explain: "«Chaque soir, des films sont projetés gratuitement sur la plage, en plein air.»" }
