title: Level check A2
passScore: 0.8
reading:
  text: |
    L'estate scorsa io e mio marito abbiamo passato due settimane in Toscana. Siamo arrivati a Firenze in treno e il primo giorno abbiamo visitato il Duomo e gli Uffizi. C'erano molti turisti, faceva un caldo terribile e alla fine eravamo stanchissimi, ma la città era bellissima.

    Dopo tre giorni abbiamo noleggiato una macchina e siamo andati a Siena. Lì abbiamo dormito in un piccolo albergo vicino a Piazza del Campo. Una sera, mentre cenavamo in una trattoria, il cameriere ci ha raccontato la storia del Palio: due volte all'anno, a luglio e ad agosto, i cavalli delle contrade corrono intorno alla piazza. Purtroppo noi eravamo lì a giugno e non l'abbiamo visto.

    Poi siamo andati in campagna, nel Chianti, dove abbiamo dormito in un agriturismo. La signora Rosa cucinava ogni sera piatti tradizionali: la pasta fatta a mano, la bistecca e i cantucci con il vino dolce. Ci siamo trovati così bene che abbiamo deciso di tornare l'anno prossimo. Questa volta, però, andremo a luglio: vogliamo vedere il Palio!
  questions:
    - { q: "How did they travel to Florence?", options: ["By car", "By train", "By plane"], answer: 1 }
    - { q: "What was the weather like in Florence?", options: ["Very hot", "Rainy", "Cold"], answer: 0 }
    - { q: "What did the waiter in Siena tell them about?", options: ["The history of the cathedral", "The Palio horse race", "The best restaurants in Florence"], answer: 1 }
    - { q: "Why didn't they see the Palio?", options: ["It was cancelled", "They were in Siena in June", "The tickets were too expensive"], answer: 1 }
    - { q: "What have they decided to do?", options: ["Go back next year in July", "Buy a house in the Chianti", "Open an agriturismo"], answer: 0 }
