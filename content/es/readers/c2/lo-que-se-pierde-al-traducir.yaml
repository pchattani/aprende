id: r.c2.lo-que-se-pierde-al-traducir
level: c2
title: Lo que se pierde al traducir
kind: text
intro: A literary translator reflects on a year spent translating a Spanish novel into English, from untranslatable words to false friends and the little words that carry tone.
allow: [galicia, edimburgo, sobremesa, friolero, friolera, morriña, pues, bueno, ya]
paragraphs:
  - { es: "Hace un año acepté traducir al inglés una novela ambientada en una aldea de Galicia. Pensé que sería un trabajo de seis meses; han sido doce, no por la longitud del texto, sino por su densidad: cada página escondía una palabra que en español dice en dos sílabas lo que en inglés necesita una frase entera.", en: "A year ago I agreed to translate into English a novel set in a village in Galicia. I thought it would be six months' work; it has been twelve, and not because of the length of the text, but because of its density. Every page hid a word that in Spanish says in two syllables what in English needs a whole sentence." }
  - { es: "La primera fue sobremesa. La familia de la novela vive en la sobremesa: ahí se deciden las herencias, se perdonan las ofensas y se cuentan los secretos. Si escribo «after-lunch conversation», el lector inglés entiende el hecho, pero pierde la pereza, el café frío y las dos horas sin mirar el reloj. Al final dejé la palabra en español, en cursiva, con una glosa a pie de página la primera vez. Después ya era suya.", en: "The first was sobremesa. The family in the novel lives in the sobremesa: that is where inheritances are decided, offences forgiven and secrets told. If I write 'after-lunch conversation', the English reader understands the fact, but loses the laziness, the cold coffee and the two hours without looking at the clock. In the end I left the word in Spanish, in italics, with a gloss in a footnote the first time. After that it was theirs." }
  - { es: "Luego vino la abuela, que es friolera. En inglés no existe un adjetivo para quien siente el frío más que los demás. «She was always cold» suena a enfermedad; «she felt the cold terribly» es más largo, pero conserva el matiz: no es una característica del cuerpo, sino casi del carácter. La abuela, además, tiene morriña, y aquí la palabra gallega viajó intacta porque ya ni siquiera el español la traduce.", en: "Then came the grandmother, who is friolera. In English there is no adjective for someone who feels the cold more than other people. 'She was always cold' sounds like an illness; 'she felt the cold terribly' is longer, but keeps the nuance: it is not a feature of the body, but almost of character. The grandmother also has morriña, and here the Galician word travelled intact because by now not even Spanish translates it." }
  - { es: "Con los falsos amigos el peligro es el contrario: la palabra parece fácil y por eso engaña. El narrador describe a su padre como un hombre sensible, y la primera versión de mi traducción decía «sensible», es decir, sensato. Un corrector atento me salvó. Lo mismo ocurrió con un personaje constipado que, en inglés, parecía tener un problema muy distinto.", en: "With false friends the danger is the opposite: the word looks easy and that is why it deceives. The narrator describes his father as a sensitive man (sensible), and the first draft of my translation said 'sensible', that is, level-headed. An attentive proofreader saved me. The same happened with a character who had a cold (constipado) and, in English, seemed to have a very different problem." }
  - { es: "Más difícil todavía fue el registro. En la novela, el hijo tutea a su madre, pero la trata de usted cuando discuten, y ese cambio dice más que cualquier insulto. El inglés solo tiene un «you». Tuve que buscar el efecto en otra parte: en el nombre completo, en el tono seco, en una frase más corta. La fidelidad no consiste en repetir la forma, sino en producir el mismo golpe.", en: "Harder still was the register. In the novel, the son addresses his mother as tú, but switches to usted when they argue, and that change says more than any insult. English has only one 'you'. I had to look for the effect elsewhere: in the full name, in the dry tone, in a shorter sentence. Faithfulness does not consist in repeating the form, but in producing the same blow." }
  - { es: "Y después están las palabras pequeñas: pues, bueno, es que, ya. No significan casi nada y, sin embargo, lo dicen todo sobre quién habla y cómo se siente. La mayoría desaparecieron en inglés; su trabajo lo hacen ahora las pausas y los puntos suspensivos. Un traductor literal las habría conservado y el diálogo habría sonado a doblaje malo.", en: "And then there are the little words: pues, bueno, es que, ya. They mean almost nothing and yet they say everything about who is speaking and how they feel. Most of them disappeared in English; their job is now done by pauses and ellipses. A literal translator would have kept them and the dialogue would have sounded like bad dubbing." }
  - { es: "Hubo también calcos en la dirección contraria: tras meses pensando en dos lenguas, empiezas a escribir «aplicó al puesto» o a lavar «sus manos». La editorial me devolvió el primer capítulo con una nota amable: «Suena a traducción». Era el peor elogio posible.", en: "There were also calques in the opposite direction: after months thinking in two languages, you start to write 'aplicó al puesto' or to wash 'sus manos'. The publisher sent the first chapter back to me with a kind note: 'It sounds like a translation.' It was the worst possible compliment." }
  - { es: "¿Qué se pierde, entonces, al traducir? Se pierde la sobremesa, se pierde el usted, se pierde algún chiste. Pero también se gana: la abuela tiene ahora, en inglés, una frase que en español no tenía, y el lector de Edimburgo que me escribió la semana pasada ya sabe lo que es la morriña. Traducir es decidir qué se pierde; el oficio está en elegir bien.", en: "What is lost, then, in translating? The sobremesa is lost, usted is lost, the odd joke is lost. But things are gained too: the grandmother now has, in English, a line she did not have in Spanish, and the reader from Edinburgh who wrote to me last week now knows what morriña is. Translating is deciding what gets lost; the craft lies in choosing well." }
questions:
  - { q: "Why did the translation take twice as long as expected?", options: ["The novel was very long", "Many words were dense and hard to render in English", "The publisher kept changing the deadline"], answer: 1 }
  - { q: "How did the translator finally handle 'sobremesa'?", options: ["She translated it as 'dessert'", "She kept it in Spanish with a footnote the first time", "She cut the scenes where it appeared"], answer: 1 }
  - { q: "What mistake did a proofreader catch?", options: ["'Sensible' translated as the English 'sensible'", "A wrong date", "A missing chapter"], answer: 0 }
  - { q: "How did she convey the son switching from tú to usted?", options: ["She used 'thou'", "She used the full name, a dry tone and shorter sentences", "She added a footnote every time"], answer: 1 }
  - { q: "What does 'Suena a traducción' mean for the translator?", options: ["A great compliment", "The worst possible compliment: the text betrayed its origin", "A request for more literal translation"], answer: 1 }
