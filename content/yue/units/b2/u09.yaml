id: b2.u09
title: 南丫島嘅環保生活
lessons:
  - id: b2.u09.l1
    title: 令人好放鬆
    teach: [g.causatives-ling-gaau-dou]
    vocab: [w.naam4-aa1-dou2, w.jung4-syu6-waan1, w.sok3-gu2-waan1, w.waan4-bou2, w.ning4-zing6, w.ling6, w.ling6-dou3, w.gaau2-dou3, w.hoi6-dou3, w.hei3-ce1, w.fai3-hei3, w.wu1-jim5, w.hoi2-joeng4-laap6-saap3, w.zing6-taan1, w.gaau1-zeon1, w.sou3-gaau1, w.gaau1.b, w.geoi1-man4, w.wui4-naam4-tin1, w.zong1-sau1, w.gaa1-si1, w.gaan3-gaak3, w.sei2-mong4, w.faat3-mui4]
    tip: "令 + person + feeling is neutral and works for good or bad results; 搞到 and 害到 are colloquial and usually point at a bad result (害到 blames someone)."
    sentences:
      - { es: "南丫島嘅風景令人好放鬆。", en: "The scenery on Lamma is very relaxing.", altEs: ["南丫島嘅風景令人好放鬆呀。", "南丫島啲風景令人好放鬆。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.ling6, w.naam4-aa1-dou2, w.fong3-sung1] }
      - { es: "島上冇汽車，冇廢氣，令空氣特別清新。", en: "There are no cars on the island and no exhaust fumes, which makes the air especially fresh.", altEs: ["島上冇汽車，冇廢氣，令到空氣特別清新。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.hei3-ce1, w.fai3-hei3, w.dou2-soeng6, w.cing1-san1] }
      - { es: "呢個消息令我好開心。", en: "This news makes me very happy.", altEs: ["呢個消息令到我好開心。", "個消息令我好開心。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.ling6, w.siu1-sik1], error: { wrong: "呢個消息令好開心我。", explain: "令 is followed directly by the person, then the feeling: 令我好開心.", grammar: g.causatives-ling-gaau-dou } }
      - { es: "啲遊客亂拋垃圾，搞到個沙灘好污糟。", en: "Tourists throw rubbish everywhere, and it's made the beach filthy.", altEs: ["啲遊客亂咁拋垃圾，搞到個沙灘好污糟。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.gaau2-dou3, w.paau1, w.laap6-saap3, w.wu1-zou1], transform: { instruction: "Say it neutrally with 令到 instead of 搞到", answer: "啲遊客亂拋垃圾，令到個沙灘好污糟。", alt: ["啲遊客亂拋垃圾，令個沙灘好污糟。"] } }
      - { es: "你冇提我，害到我錯過咗班船。", en: "You didn't remind me, and because of you I missed the ferry.", altEs: ["你冇提醒我，害到我錯過咗班船。", "你冇提我，害我錯過咗班船。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.hoi6-dou3, w.tai4, w.co3-gwo3], transform: { instruction: "Blame him (佢) instead of you", answer: "佢冇提我，害到我錯過咗班船。", alt: ["佢冇提醒我，害到我錯過咗班船。"] } }
      - { es: "榕樹灣嘅夜晚好寧靜，淨係聽到海浪聲。", en: "Nights in Yung Shue Wan are very peaceful; all you can hear is the waves.", altEs: ["榕樹灣啲夜晚好寧靜，淨係聽到海浪聲。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.jung4-syu6-waan1, w.ning4-zing6] }
      - { es: "海洋垃圾令好多海龜同海豚死亡。", en: "Marine litter kills many turtles and dolphins.", altEs: ["海洋垃圾令到好多海龜同海豚死亡。", "海洋垃圾導致好多海龜同海豚死亡。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.hoi2-joeng4-laap6-saap3, w.hoi2-gwai1, w.hoi2-tyun4, w.sei2-mong4] }
      - { es: "塑膠污染令海洋問題越嚟越嚴重。", en: "Plastic pollution is making the ocean's problems worse and worse.", altEs: ["塑膠污染令到海洋問題越嚟越嚴重。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.sou3-gaau1, w.wu1-jim5, w.jyut6-lai4-jyut6, w.jim4-zung6] }
      - { es: "我哋星期日去索罟灣淨灘，執咗二十個膠樽。", en: "On Sunday we went to clean up the beach at Sok Kwu Wan and picked up twenty plastic bottles.", altEs: ["我哋星期日去索罟灣淨灘，執到二十個膠樽。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.zing6-taan1, w.sok3-gu2-waan1, w.gaau1-zeon1] }
      - { es: "隔籬屋裝修，成日好嘈，搞到我瞓唔着。", en: "The flat next door is being renovated and it's noisy all day, so I can't sleep.", altEs: ["隔籬屋裝修，成日好嘈，搞到我瞓唔到。"], jp: "gaak3 lei4 uk1 zong1 sau1 seng4 jat6 hou2 cou4 gaau2 dou3 ngo5 fan3 m4 zoek6", grammar: [g.causatives-ling-gaau-dou], vocab: [w.zong1-sau1, w.cou4, w.gaau2-dou3] }
      - { es: "回南天啲牆濕晒，搞到啲傢俬都發霉。", en: "In the humid spring weather the walls are all damp, and even the furniture has gone mouldy.", altEs: ["回南天啲牆濕晒，搞到啲傢俬都發晒霉。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.wui4-naam4-tin1, w.gaa1-si1, w.sap1, w.faat3-mui4] }
      - { es: "呢間屋嘅間隔好好，令人覺得好闊落。", en: "This flat's layout is very good; it makes it feel very spacious.", altEs: ["間屋嘅間隔好好，令人覺得好闊落。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.gaan3-gaak3, w.ling6] }
      - { es: "居民好愛惜呢個島，好少人會亂拋垃圾。", en: "The residents care a lot about this island; very few people litter.", altEs: ["居民好愛護呢個島，好少人會亂拋垃圾。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.geoi1-man4] }
      - { es: "呢件事令我好失望。", en: "This really disappointed me.", altEs: ["呢件事令到我好失望。", "件事令我好失望。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.sat1-mong6] }
      - { es: "唔好用咁多膠，環保啲啦。", en: "Don't use so much plastic; be a bit greener.", altEs: ["唔好用咁多膠嘢，環保啲啦。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.gaau1.b, w.waan4-bou2] }
      - { es: "冷氣太凍，搞到我感冒。", en: "The air con was so cold I caught a cold.", altEs: ["冷氣太凍，搞到我感冒咗。", "冷氣開得太凍，搞到我感冒。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.laang5-hei3, w.gam2-mou6], error: { wrong: "冷氣太凍，令到我感冒開心。", explain: "搞到 already gives the (bad) result; just say what happened: 搞到我感冒.", grammar: g.causatives-ling-gaau-dou } }
    exchanges:
      - q: { es: "你點解咁鍾意住南丫島？", en: "Why do you like living on Lamma so much?" }
        a: { es: "因為冇車冇廢氣，令到我覺得好放鬆。", en: "Because there are no cars and no exhaust fumes, which makes me feel very relaxed." }
        alt: ["好寧靜，令人好放鬆。", "冇車，空氣好好。", "因為冇車冇廢氣，令我覺得好放鬆。"]
        grammar: [g.causatives-ling-gaau-dou]
        vocab: [w.ling6-dou3, w.fai3-hei3]
      - q: { es: "你點解遲到呀？", en: "Why are you late?" }
        a: { es: "阿蕎冇叫我起身，害到我錯過咗班船。", en: "Ah Kiu didn't wake me up, so thanks to her I missed the ferry." }
        alt: ["錯過咗班船。", "冇人叫我，害我錯過班船。"]
        grammar: [g.causatives-ling-gaau-dou]
        vocab: [w.hoi6-dou3, w.co3-gwo3]
      - q: { es: "個沙灘點解咁污糟？", en: "Why is the beach so dirty?" }
        a: { es: "颱風之後啲海洋垃圾沖晒上沙灘，搞到成個沙灘都係膠樽。", en: "After the typhoon the marine litter all washed ashore, and now the whole beach is covered in plastic bottles." }
        alt: ["颱風搞到好多垃圾上岸。", "啲人亂拋垃圾囉。"]
        grammar: [g.causatives-ling-gaau-dou]
        vocab: [w.gaau2-dou3, w.hoi2-joeng4-laap6-saap3, w.gaau1-zeon1]
      - q: { es: "你搬咗屋之後覺得點呀？", en: "How do you feel since moving house?" }
        a: { es: "好開心，不過回南天搞到間屋好濕。", en: "Very happy, but the humid spring weather has made the flat really damp." }
        alt: ["幾好，就係回南天好濕。", "好開心，個間隔好好。"]
        grammar: [g.causatives-ling-gaau-dou]
        vocab: [w.wui4-naam4-tin1]
      - q: { es: "星期日有冇興趣一齊去淨灘？", en: "Are you interested in going to a beach clean-up together on Sunday?" }
        a: { es: "好呀，幫吓手，令個島乾淨啲。", en: "Sure, let's lend a hand and make the island a bit cleaner." }
        alt: ["好呀，幾點？", "得，我帶手套。"]
        grammar: [g.causatives-ling-gaau-dou]
        vocab: [w.zing6-taan1, w.ling6]
    texts:
      - title: "榕樹灣碼頭告示"
        es: ["歡迎嚟到南丫島。", "島上冇汽車，請行路或者踩單車。", "請帶走自己嘅垃圾，保持島上清潔。"]
        en: ["Welcome to Lamma Island.", "There are no cars on the island; please walk or cycle.", "Please take your rubbish with you and keep the island clean."]
        grammar: [g.causatives-ling-gaau-dou]
        vocab: [w.hei3-ce1, w.laap6-saap3, w.bou2-ci4]
      - title: "淨灘日記"
        es: ["今朝我哋喺索罟灣淨灘，執咗三大袋垃圾。", "最多嘅係膠樽同膠袋，令我好心痛。", "不過見到個沙灘乾乾淨淨，大家都好開心。"]
        en: ["This morning we cleaned up the beach at Sok Kwu Wan and collected three big bags of rubbish.", "Most of it was plastic bottles and bags, which broke my heart.", "But seeing the beach clean again made everyone very happy."]
        grammar: [g.causatives-ling-gaau-dou]
        vocab: [w.zing6-taan1, w.gaau1-zeon1, w.sam1-tung3]
    spicy:
      - { es: "你嘅笑容令我成日都好放鬆。", en: "Your smile always makes me feel relaxed.", altEs: ["你個笑容令我成日都好放鬆。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.ling6, w.fong3-sung1] }
      - { es: "你成晚望住我，搞到我食飯都食唔落。", en: "You've been staring at me all night, so now I can't even eat.", altEs: ["你成晚望住我，搞到我飯都食唔落。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.gaau2-dou3] }
      - { es: "都係你，害到我錯過尾班船，今晚要喺南丫島過夜。", en: "It's all your fault I missed the last ferry, so now I'll have to spend the night on Lamma.", altEs: ["都係你，害到我錯過尾班船，今晚要留喺南丫島。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.hoi6-dou3, w.co3-gwo3] }
      - { es: "回南天濕到咁，你仲要攬住我？", jp: "wui4 naam4 tin1 sap1 dou3 gam3 nei5 zung6 jiu3 laam5 zyu6 ngo5", en: "It's this humid out and you still want to hug me?", altEs: ["回南天咁濕，你仲要攬住我？"], grammar: [g.causatives-ling-gaau-dou, g.dou-extent], vocab: [w.wui4-naam4-tin1] }
      - { es: "南丫島嘅日落好靚，不過令我心跳嘅係你。", en: "The sunset on Lamma is beautiful, but you're the one who makes my heart race.", altEs: ["南丫島啲日落好靚，不過令我心跳嘅係你。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.ling6, w.jat6-lok6] }
  - id: b2.u09.l2
    title: 由於天氣惡劣
    teach: [g.jau-jyu-because]
    vocab: [w.jau4-jyu1, w.dou6-zi3, w.jan5-zi3, w.zou6-sing4, w.hau6-gwo2, w.cyun4-kau4-nyun5-faa3, w.hei3-hau6, w.tin1-zoi1, w.jim4-jit6, w.hon4-laang5, w.bou6-jyu5, w.ok3-lyut3, w.taan3, w.paai4-fong3, w.nang4-jyun4, w.din6-lik6, w.faat3-din6-cong2, w.taai3-joeng4-nang4, w.jyu4-jip6, w.gwo3-dou6, w.jan4-sau2, w.bat1-zuk1, w.zang1-zoeng2, w.fung1-lik6, w.faat3-din6]
    tip: "由於 (owing to) opens the reason, 因此 (therefore) opens the result, and 導致 works like a verb: cause 導致 effect. They sound like the news; with friends, 因為 and 所以 are more natural."
    sentences:
      - { es: "由於天氣惡劣，渡輪服務暫停。", en: "Owing to bad weather, ferry services are suspended.", altEs: ["由於天氣惡劣，渡輪服務暫時停止。"], grammar: [g.jau-jyu-because], vocab: [w.jau4-jyu1, w.ok3-lyut3, w.zaam6-ting4, w.fuk6-mou6], transform: { instruction: "Say it the everyday way with 因為…所以…", answer: "因為天氣唔好，所以渡輪停咗。", alt: ["因為天氣差，所以渡輪停咗。", "因為天氣唔好，所以冇船。"] } }
      - { es: "過度捕魚導致漁業越嚟越差。", en: "Overfishing has led to the fishing industry getting worse and worse.", altEs: ["過度捕魚令漁業越嚟越差。"], grammar: [g.jau-jyu-because], vocab: [w.gwo3-dou6, w.bou6-jyu4, w.dou6-zi3, w.jyu4-jip6], transform: { instruction: "Rewrite it with 由於 … 因此 …", answer: "由於過度捕魚，因此漁業越嚟越差。", alt: ["由於過度捕魚，漁業因此越嚟越差。", "由於過度捕魚，所以漁業越嚟越差。"] } }
      - { es: "由於人手不足，部分服務暫停。", en: "Owing to staff shortages, some services are suspended.", altEs: ["由於人手唔夠，部分服務暫停。"], grammar: [g.jau-jyu-because], vocab: [w.jau4-jyu1, w.jan4-sau2, w.bat1-zuk1] }
      - { es: "南丫島有一間發電廠，供應港島嘅電力。", en: "Lamma has a power station that supplies electricity to Hong Kong Island.", altEs: ["南丫島有間發電廠，供電畀港島。"], grammar: [g.jau-jyu-because], vocab: [w.faat3-din6-cong2, w.din6-lik6] }
      - { es: "發電廠排放大量廢氣，因此居民好關注污染問題。", en: "The power station emits a lot of exhaust, so residents are very concerned about pollution.", altEs: ["發電廠排放好多廢氣，因此居民好關注污染問題。"], grammar: [g.jau-jyu-because], vocab: [w.paai4-fong3, w.jan1-ci2, w.wu1-jim5] }
      - { es: "島上嗰部風車用風力發電，唔會排放碳。", en: "The wind turbine on the island generates electricity from the wind and doesn't emit carbon.", altEs: ["島上部風車用風發電，唔會排放碳。"], grammar: [g.jau-jyu-because], vocab: [w.fung1-ce1, w.taan3, w.paai4-fong3, w.fung1-lik6, w.faat3-din6] }
      - { es: "全球暖化導致氣候越嚟越極端。", en: "Global warming is making the climate more and more extreme.", altEs: ["全球暖化令氣候越嚟越極端。"], grammar: [g.jau-jyu-because], vocab: [w.cyun4-kau4-nyun5-faa3, w.hei3-hau6, w.dou6-zi3] }
      - { es: "由於落大雨，所以活動延期。", en: "Because of the heavy rain, the event has been postponed.", altEs: ["由於落大雨，活動延期。", "因為落大雨，所以活動延期。"], grammar: [g.jau-jyu-because], vocab: [w.jau4-jyu1, w.jin4-kei4, w.wut6-dung6], note: "由於…，所以… is acceptable in speech." }
      - { es: "暴雨引致山泥傾瀉，條行山徑封咗。", en: "The rainstorm caused a landslide, and the hiking trail has been closed.", altEs: ["暴雨造成山泥傾瀉，條行山徑封咗。"], grammar: [g.jau-jyu-because], vocab: [w.bou6-jyu5, w.jan5-zi3] }
      - { es: "天災造成好大損失，好多漁民冇咗收入。", en: "The natural disaster caused heavy losses, and many fishermen lost their income.", altEs: ["天災造成好大嘅損失，好多漁民冇咗收入。"], grammar: [g.jau-jyu-because], vocab: [w.tin1-zoi1, w.zou6-sing4, w.jyu4-man4] }
      - { es: "夏天天氣炎熱，因此用電量大增。", en: "The weather is scorching in summer, so electricity use rises sharply.", altEs: ["夏天天氣好炎熱，因此用電量大增。"], grammar: [g.jau-jyu-because], vocab: [w.jim4-jit6, w.jan1-ci2] }
      - { es: "冬天天氣寒冷，老人家要小心保暖。", en: "The weather is cold in winter, so the elderly need to be careful to keep warm.", altEs: ["冬天好寒冷，老人家要小心保暖。"], grammar: [g.jau-jyu-because], vocab: [w.hon4-laang5, w.lou5-jan4-gaa1] }
      - { es: "如果唔減少排放，後果會好嚴重。", en: "If we don't cut emissions, the consequences will be very serious.", altEs: ["唔減少排放嘅話，後果會好嚴重。"], grammar: [g.jau-jyu-because], vocab: [w.hau6-gwo2, w.gaam2-siu2, w.paai4-fong3] }
      - { es: "島上好多屋頂都裝咗太陽能板，用嚟節省能源。", en: "Many rooftops on the island have solar panels to save energy.", altEs: ["島上好多屋頂都裝咗太陽能板，用嚟慳能源。"], grammar: [g.jau-jyu-because], vocab: [w.taai3-joeng4-nang4, w.nang4-jyun4] }
      - { es: "遊客人數增長咗一倍，因此垃圾都多咗。", en: "Visitor numbers have doubled, so there's more rubbish too.", altEs: ["遊客增長咗一倍，因此垃圾都多咗。"], grammar: [g.jau-jyu-because], vocab: [w.zang1-zoeng2, w.jan1-ci2] }
      - { es: "由於颱風，航班取消。", en: "Owing to the typhoon, flights are cancelled.", altEs: ["由於打風，航班取消。", "由於颱風，所有航班取消。"], grammar: [g.jau-jyu-because], vocab: [w.jau4-jyu1, w.toi4-fung1, w.ceoi2-siu1], error: { wrong: "導致颱風，航班取消。", explain: "導致 is a verb meaning 'lead to' and goes between cause and effect (颱風導致航班取消); 'owing to' is 由於.", grammar: g.jau-jyu-because } }
    exchanges:
      - q: { es: "今日點解冇船去南丫島？", en: "Why are there no ferries to Lamma today?" }
        a: { es: "由於天氣惡劣，渡輪服務暫停。", en: "Owing to bad weather, ferry services are suspended." }
        alt: ["打風呀，冇船。", "因為天氣唔好，停咗船。"]
        grammar: [g.jau-jyu-because]
        vocab: [w.jau4-jyu1, w.ok3-lyut3]
      - q: { es: "點解啲魚越嚟越少？", en: "Why are there fewer and fewer fish?" }
        a: { es: "過度捕魚同污染導致魚獲減少。", en: "Overfishing and pollution have led to smaller catches." }
        alt: ["過度捕魚囉。", "因為污染同捕魚太多。"]
        grammar: [g.jau-jyu-because]
        vocab: [w.gwo3-dou6, w.dou6-zi3]
      - q: { es: "全球暖化會有咩後果？", en: "What will the consequences of global warming be?" }
        a: { es: "海水會升高，天災都會多咗。", en: "Sea levels will rise and there'll be more natural disasters." }
        alt: ["天氣會越嚟越熱。", "天災會多咗。"]
        grammar: [g.jau-jyu-because]
        vocab: [w.hau6-gwo2, w.cyun4-kau4-nyun5-faa3, w.tin1-zoi1]
      - q: { es: "嗰部風車係用嚟做乜嘢？", en: "What's that wind turbine for?" }
        a: { es: "用風力發電，冇碳排放。", en: "It generates power from the wind, with no carbon emissions." }
        alt: ["發電嘅。", "用風發電，好環保。"]
        grammar: [g.jau-jyu-because]
        vocab: [w.taan3, w.paai4-fong3, w.fung1-ce1]
      - q: { es: "間茶餐廳點解今日唔開？", en: "Why isn't the cha chaan teng open today?" }
        a: { es: "門口張紙寫住，由於人手不足，休息一日。", en: "There's a notice on the door saying they're closed for a day owing to staff shortages." }
        alt: ["人手唔夠呀。", "由於人手不足，休息。"]
        grammar: [g.jau-jyu-because]
        vocab: [w.jan4-sau2, w.bat1-zuk1]
    texts:
      - title: "天文台廣播"
        es: ["由於暴雨持續，天文台發出黃色暴雨警告。", "部分離島渡輪服務暫停。", "市民應該留喺安全嘅地方。"]
        en: ["Owing to persistent heavy rain, the Observatory has issued an amber rainstorm warning.", "Some outlying island ferry services are suspended.", "Members of the public should stay somewhere safe."]
        grammar: [g.jau-jyu-because]
        vocab: [w.bou6-jyu5, w.jau4-jyu1, w.zaam6-ting4]
      - title: "地理功課"
        es: ["全球暖化導致氣候越嚟越極端。", "炎熱嘅夏天令用電量增長，發電廠排放更多碳。", "因此，我哋要多用太陽能等可再生能源。"]
        en: ["Global warming is making the climate more and more extreme.", "Scorching summers increase electricity use, and power stations emit more carbon.", "Therefore, we need to use more renewable energy such as solar power."]
        grammar: [g.jau-jyu-because, g.causatives-ling-gaau-dou]
        vocab: [w.cyun4-kau4-nyun5-faa3, w.jim4-jit6, w.zang1-zoeng2, w.taai3-joeng4-nang4]
    spicy:
      - { es: "由於你太靚，我已經錯過咗兩班船。", en: "Owing to your good looks, I've already missed two ferries.", altEs: ["由於你太靚，我錯過咗兩班船。"], grammar: [g.jau-jyu-because], vocab: [w.jau4-jyu1, w.co3-gwo3] }
      - { es: "你嘅眼神導致我成晚瞓唔着，你要負責。", en: "Your look has left me unable to sleep all night; you have to take responsibility.", altEs: ["你個眼神導致我成晚瞓唔着，你要負責。"], jp: "nei5 ge3 ngaan5 san4 dou6 zi3 ngo5 seng4 maan5 fan3 m4 zoek6 nei5 jiu3 fu6 zaak3", grammar: [g.jau-jyu-because], vocab: [w.dou6-zi3, w.fu6-zaak3] }
      - { es: "天氣炎熱，因此我建議我哋去海灘，你負責帶雪糕。", en: "It's scorching, so I propose we go to the beach; you're in charge of bringing ice cream.", altEs: ["天氣咁炎熱，因此我建議去海灘，你負責帶雪糕。"], grammar: [g.jau-jyu-because], vocab: [w.jim4-jit6, w.jan1-ci2] }
      - { es: "由於颱風，渡輪暫停，我哋唯有喺你屋企睇戲。", en: "Owing to the typhoon, the ferries are suspended, so we'll just have to watch a film at your place.", altEs: ["由於打風，渡輪暫停，我哋唯有喺你屋企睇戲。"], grammar: [g.jau-jyu-because], vocab: [w.jau4-jyu1, w.wai4-jau5] }
      - { es: "我同你嘅感情不斷增長，好似全球暖化噉，越嚟越熱。", en: "My feelings for you keep growing, like global warming: hotter and hotter.", altEs: ["我對你嘅感情不斷增長，好似全球暖化噉，越嚟越熱。"], grammar: [g.jau-jyu-because, g.hou-ci-seem], vocab: [w.zang1-zoeng2, w.cyun4-kau4-nyun5-faa3, w.gam2-cing4] }
  - id: b2.u09.l3
    title: 自備餐具，以免浪費
    teach: [g.ji-min-so-as-not]
    vocab: [w.ji5-min5, w.min5-dak1, w.zi6-bei6, w.gaau1-jam2-gun2, w.zik1-hei3, w.caan1-geoi6, w.wui4-sau1, w.gaam2-fai3, w.haan1-din6, w.zit3-joek3, w.luk6-sik1.b, w.sou3-sik6, w.jau5-gei1, w.bou2-ci4, w.sik1-hap6, w.gong3-dai1, w.tai4-gou1, w.hung3-zai3]
    tip: "以免 (formal) and 免得 introduce what you want to AVOID, in the second clause; colloquial 費事 means 'so I don't have to' or, at the start, 'can't be bothered'. Don't add another negative: 以免遲到, not 以免唔遲到."
    sentences:
      - { es: "請帶走垃圾，以免污染環境。", en: "Please take your rubbish with you to avoid polluting the environment.", altEs: ["請帶走你嘅垃圾，以免污染環境。"], grammar: [g.ji-min-so-as-not], vocab: [w.ji5-min5, w.wu1-jim5, w.waan4-ging2], error: { wrong: "請帶走垃圾，以免唔污染環境。", explain: "以免 already means 'so as NOT to'; don't add 唔.", grammar: g.ji-min-so-as-not } }
      - { es: "早啲出門口，免得趕唔切搭船。", en: "Leave early so you don't end up rushing for the ferry.", altEs: ["早啲出門口，免得趕唔切上船。"], grammar: [g.ji-min-so-as-not], vocab: [w.min5-dak1, w.zou2-di1], transform: { instruction: "Make it a formal notice with 以免", answer: "請提早出門，以免趕唔切搭船。", alt: ["請早啲出門口，以免趕唔切搭船。"] } }
      - { es: "我帶埋遮，費事落雨。", en: "I'll take an umbrella in case it rains.", altEs: ["我帶埋把遮，費事落雨。"], grammar: [g.ji-min-so-as-not], vocab: [w.fai3-si6, w.ze1] }
      - { es: "費事同佢嗌，我行開先。", en: "I can't be bothered arguing with him; I'll walk away.", altEs: ["費事同佢嗌交，我行開先。"], altEn: ["I can't be bothered arguing with her; I'll walk away."], grammar: [g.ji-min-so-as-not], vocab: [w.fai3-si6] }
      - { es: "我自備餐具，免得用即棄嘅膠叉。", en: "I bring my own cutlery so I don't have to use disposable plastic forks.", altEs: ["我自己帶餐具，免得用即棄膠叉。"], grammar: [g.ji-min-so-as-not], vocab: [w.zi6-bei6, w.caan1-geoi6, w.zik1-hei3] }
      - { es: "唔該唔使畀膠飲管我，我自己有。", en: "No plastic straw for me, thanks; I have my own.", altEs: ["唔該唔使膠飲管，我自己有。"], grammar: [g.ji-min-so-as-not], vocab: [w.gaau1-jam2-gun2] }
      - { es: "啲膠樽要洗乾淨先好回收。", en: "Plastic bottles should be rinsed clean before you recycle them.", altEs: ["啲膠樽要洗乾淨先拎去回收。"], grammar: [g.ji-min-so-as-not], vocab: [w.wui4-sau1, w.gaau1-zeon1] }
      - { es: "出門口記得熄燈，慳電之餘又慳錢。", en: "Remember to turn the lights off when you go out; you save electricity and money.", altEs: ["出門口記得熄燈，又慳電又慳錢。"], grammar: [g.ji-min-so-as-not], vocab: [w.haan1-din6, w.sik1.b, w.dang1] }
      - { es: "我哋屋企每個月都盡量減廢，少買即棄嘢。", en: "Our household tries to reduce waste every month and buys fewer disposable things.", altEs: ["我哋屋企每個月都盡量減廢，少啲買即棄嘢。"], grammar: [g.ji-min-so-as-not], vocab: [w.gaam2-fai3, w.zik1-hei3] }
      - { es: "島上用水要節約，以免夏天唔夠水。", en: "Water on the island must be used sparingly so there isn't a shortage in summer.", altEs: ["島上用水要節約，免得夏天唔夠水。"], grammar: [g.ji-min-so-as-not], vocab: [w.zit3-joek3, w.ji5-min5, w.dou2-soeng6] }
      - { es: "呢間餐廳主打素食，啲菜全部係有機嘅。", jp: "ni1 gaan1 caan1 teng1 zyu2 daa2 sou3 sik6 di1 coi3 cyun4 bou6 hai6 jau5 gei1 ge3", en: "This restaurant specialises in vegetarian food, and the vegetables are all organic.", altEs: ["呢間餐廳以素食為主，啲菜全部係有機嘅。"], grammar: [g.ji-min-so-as-not], vocab: [w.sou3-sik6, w.jau5-gei1, w.coi3] }
      - { es: "冷氣調高一度，可以降低電費。", jp: "laang5 hei3 tiu4 gou1 jat1 dou6 ho2 ji5 gong3 dai1 din6 fai3", en: "Turning the air conditioning up one degree can lower the electricity bill.", altEs: ["冷氣開高一度，可以降低電費。"], grammar: [g.ji-min-so-as-not], vocab: [w.gong3-dai1, w.din6-fai3] }
      - { es: "學校想提高學生嘅環保意識。", en: "The school wants to raise students' environmental awareness.", altEs: ["學校想提高學生對環保嘅意識。"], grammar: [g.ji-min-so-as-not], vocab: [w.tai4-gou1, w.waan4-bou2] }
      - { es: "我哋要控制膠袋嘅使用，以免海洋垃圾越嚟越多。", en: "We need to control plastic bag use so that marine litter doesn't keep increasing.", altEs: ["我哋要控制膠袋使用，以免海洋垃圾越嚟越多。"], grammar: [g.ji-min-so-as-not], vocab: [w.hung3-zai3, w.gaau1-doi2, w.ji5-min5] }
      - { es: "南丫島好適合過綠色生活。", en: "Lamma is very well suited to green living.", altEs: ["南丫島好啱過綠色生活。"], grammar: [g.ji-min-so-as-not], vocab: [w.sik1-hap6, w.luk6-sik1.b, w.sang1-wut6] }
      - { es: "行山記得帶夠水，以免脫水。", en: "Take enough water when hiking to avoid dehydration.", altEs: ["行山記住帶夠水，以免脫水。", "行山記得帶夠水，免得脫水。"], grammar: [g.ji-min-so-as-not], vocab: [w.tyut3-seoi2, w.ji5-min5], transform: { instruction: "Say it casually with 費事", answer: "行山記得帶夠水，費事脫水。", alt: ["行山帶夠水，費事脫水。"] } }
    exchanges:
      - q: { es: "你點解成日帶住個水樽？", en: "Why do you always carry a water bottle around?" }
        a: { es: "免得買膠樽水囉，又慳錢又環保。", en: "So I don't have to buy bottled water; it saves money and it's eco-friendly." }
        alt: ["費事買樽裝水。", "環保啲嘛。"]
        grammar: [g.ji-min-so-as-not]
        vocab: [w.min5-dak1, w.waan4-bou2]
      - q: { es: "要唔要膠飲管呀？", en: "Would you like a plastic straw?" }
        a: { es: "唔使喇，唔該，我自備咗。", en: "No need, thanks, I've brought my own." }
        alt: ["唔使，唔該。", "唔要，多謝。"]
        grammar: [g.ji-min-so-as-not]
        vocab: [w.gaau1-jam2-gun2, w.zi6-bei6]
      - q: { es: "我哋今晚叫外賣好唔好？", en: "Shall we order takeaway tonight?" }
        a: { es: "不如自己煮，費事用咁多即棄飯盒。", en: "Let's cook ourselves instead, so we don't use so many disposable boxes." }
        alt: ["自己煮啦，費事出去排隊。", "好呀，不過唔要餐具。"]
        grammar: [g.ji-min-so-as-not]
        vocab: [w.zik1-hei3, w.faan6-hap2]
      - q: { es: "呢啲紙可唔可以回收？", en: "Can this paper be recycled?" }
        a: { es: "可以，放入藍色嗰個回收桶。", en: "Yes, put it in the blue recycling bin." }
        alt: ["可以。", "可以，放藍色桶。"]
        grammar: [g.ji-min-so-as-not]
        vocab: [w.wui4-sau1]
      - q: { es: "你點解冷氣開咁高？", en: "Why have you set the air conditioning so high?" }
        a: { es: "慳電囉，二十六度已經夠涼。", en: "To save electricity; twenty-six degrees is cool enough." }
        alt: ["慳電呀。", "費事交咁多電費。"]
        grammar: [g.ji-min-so-as-not]
        vocab: [w.haan1-din6]
    texts:
      - title: "郊野公園告示"
        es: ["請保持安靜，以免影響野生動物。", "請自備水樽，以免製造垃圾。", "多謝大家支持。"]
        en: ["Please keep quiet so as not to disturb the wildlife.", "Please bring your own water bottle to avoid creating rubbish.", "Thank you all for your support."]
        grammar: [g.ji-min-so-as-not]
        vocab: [w.ji5-min5, w.zi6-bei6, w.bou2-ci4]
      - title: "環保小貼士"
        es: ["出街自備餐具同水樽，費事用即棄嘢。", "離開房記得熄燈，慳電又慳錢。", "膠樽洗乾淨先回收，免得污染其他回收物。"]
        en: ["Bring your own cutlery and water bottle when you go out, so you don't need disposables.", "Remember to switch off the lights when you leave a room; it saves electricity and money.", "Rinse plastic bottles before recycling them so they don't contaminate other recyclables."]
        grammar: [g.ji-min-so-as-not]
        vocab: [w.caan1-geoi6, w.haan1-din6, w.wui4-sau1, w.min5-dak1]
    spicy:
      - { es: "我自備咗兩支飲管，免得你同我爭飲。", en: "I brought two straws of my own so you won't fight me for my drink.", altEs: ["我自備咗兩支飲管，費事你同我爭飲。"], grammar: [g.ji-min-so-as-not], vocab: [w.zi6-bei6, w.min5-dak1] }
      - { es: "今晚我送你返屋企，以免你又搭錯船。", en: "I'll see you home tonight, so you don't get on the wrong ferry again.", altEs: ["今晚我送你返去，以免你又搭錯船。"], grammar: [g.ji-min-so-as-not], vocab: [w.ji5-min5, w.sung3.b] }
      - { es: "我哋一齊食素，費事你話我口臭。", en: "Let's both eat vegetarian, so you can't say my breath smells.", altEs: ["我哋一齊食素，免得你話我口臭。"], grammar: [g.ji-min-so-as-not], vocab: [w.fai3-si6] }
      - { es: "你咁靚，我要控制吓自己，以免成晚望住你。", en: "You're so gorgeous I have to control myself, so I don't stare at you all night.", altEs: ["你咁靚，我要控制自己，以免成晚望住你。"], grammar: [g.ji-min-so-as-not], vocab: [w.hung3-zai3, w.ji5-min5] }
      - { es: "熄埋燈慳電啦，反正有月光，而且你個樣喺月光下更加靚。", en: "Switch off the light to save electricity; there's moonlight anyway, and you look even better by moonlight.", altEs: ["熄埋燈慳電啦，反正有月光，你喺月光下更加靚。"], grammar: [g.ji-min-so-as-not], vocab: [w.haan1-din6, w.sik1.b] }
  - id: b2.u09.l4
    title: 保育大自然
    teach: [g.causatives-ling-gaau-dou, g.ji-min-so-as-not]
    vocab: [w.bou2-wu6, w.bou2-juk6, w.po3-waai6, w.tin4-hoi2, w.ho2-ci4-zuk6, w.gun2-lei5, w.hei1-sang1, w.sat1-heoi3, w.wok6-dak1, w.hoi2-gwai1, w.hoi2-tyun4, w.saan1-wu4, w.sang1-mat6, w.zyut6-zung2, w.sang1-taai3, w.gu2-gwaai3, w.hoi2-ngon6, w.hoi6]
    tip: "Combine what you've learnt: cause (令, 搞到, 導致) and avoidance (以免, 免得) are the building blocks of any argument about the environment."
    sentences:
      - { es: "填海會破壞海洋生態，令好多生物失去屋企。", en: "Land reclamation damages the marine ecology and leaves many creatures without a home.", altEs: ["填海會破壞海洋生態，令到好多生物失去屋企。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.tin4-hoi2, w.po3-waai6, w.sang1-taai3, w.sang1-mat6, w.sat1-heoi3] }
      - { es: "每年夏天，綠海龜會返嚟南丫島深灣生蛋。", en: "Every summer, green turtles come back to Sham Wan on Lamma to lay their eggs.", altEs: ["每年夏天，綠海龜都會返嚟南丫島深灣生蛋。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.hoi2-gwai1] }
      - { es: "為咗保護海龜，深灣夏天唔准人入去，以免嚇親佢哋。", en: "To protect the turtles, nobody is allowed into Sham Wan in summer, so as not to frighten them.", altEs: ["為咗保護海龜，深灣夏天唔准人入去，免得嚇親佢哋。"], grammar: [g.ji-min-so-as-not], vocab: [w.bou2-wu6, w.hoi2-gwai1, w.ji5-min5] }
      - { es: "如果唔保育，好多動物會絕種。", en: "If we don't conserve them, many animals will become extinct.", altEs: ["唔保育嘅話，好多動物會絕種。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.bou2-juk6, w.zyut6-zung2], transform: { instruction: "Turn it round with 以免: we must conserve so they don't become extinct", answer: "我哋要保育，以免好多動物絕種。", alt: ["我哋要做好保育，以免好多動物絕種。", "我哋要保育，免得好多動物絕種。"] } }
      - { es: "蒲台島冇乜人住，因此啲石頭同海岸保持得好好。", en: "Hardly anyone lives on Po Toi, so its rocks and coastline are very well preserved.", altEs: ["蒲台島冇咩人住，因此啲石頭同海岸保持得好好。"], grammar: [g.jau-jyu-because], vocab: [w.bou2-ci4, w.sek6-tau4, w.hoi2-ngon6] }
      - { es: "蒲台島啲石形狀好古怪，有啲好似一隻手。", en: "The rocks on Po Toi have very odd shapes; some look like a hand.", altEs: ["蒲台島啲石頭形狀好古怪，有啲好似隻手。"], grammar: [g.hou-ci-seem], vocab: [w.sek6, w.gu2-gwaai3] }
      - { es: "啲遊客亂咁喺石上面寫字，搞到啲古代石刻受損。", en: "Tourists scribble on the rocks, and it's damaged the ancient rock carvings.", altEs: ["啲遊客喺石上面亂寫字，搞到啲古代石刻受損。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.gaau2-dou3, w.gu2-doi6] }
      - { es: "海水溫度上升，導致好多珊瑚死亡。", en: "Rising sea temperatures have led to the death of a lot of coral.", altEs: ["海水溫度升高，導致好多珊瑚死亡。"], grammar: [g.jau-jyu-because], vocab: [w.saan1-wu4, w.dou6-zi3, w.sei2-mong4] }
      - { es: "填海之後，大嶼山附近嘅白海豚少咗好多。", en: "Since the land reclamation, there have been far fewer white dolphins near Lantau.", altEs: ["填完海之後，大嶼山附近嘅白海豚少咗好多。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.tin4-hoi2, w.hoi2-tyun4, w.baak6-hoi2-tyun4] }
      - { es: "發展同保育點樣平衡，係一個好難嘅問題。", en: "How to balance development and conservation is a very difficult question.", altEs: ["點樣平衡發展同保育，係一個好難嘅問題。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.faat3-zin2, w.bou2-juk6] }
      - { es: "我哋唔應該為咗經濟犧牲大自然。", en: "We shouldn't sacrifice nature for the sake of the economy.", altEs: ["我哋唔應該為咗經濟而犧牲大自然。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.hei1-sang1, w.ging1-zai3] }
      - { es: "漁業要做到可持續，就要好好管理。", en: "For the fishing industry to be sustainable, it must be managed well.", altEs: ["想漁業可持續，就要好好管理。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.ho2-ci4-zuk6, w.gun2-lei5, w.jyu4-jip6] }
      - { es: "嗰個保育計劃獲得咗政府資助。", en: "That conservation project received government funding.", altEs: ["個保育計劃獲得政府資助。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.wok6-dak1, w.zi1-zo6] }
      - { es: "你亂踩珊瑚，會害死佢哋。", en: "If you step on the coral carelessly, you'll kill it.", altEs: ["你亂咁踩珊瑚，會害死佢哋。", "你亂踩珊瑚，會害到佢哋死。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.saan1-wu4, w.hoi6], transform: { instruction: "Warn him (佢) instead of you", answer: "佢亂踩珊瑚，會害死佢哋。", alt: ["佢亂咁踩珊瑚，會害死佢哋。"] } }
      - { es: "潛水嗰陣唔好掂珊瑚，以免破壞佢哋。", en: "Don't touch the coral when diving, so as not to damage it.", altEs: ["潛水嗰陣唔好掂珊瑚，免得破壞佢哋。"], grammar: [g.ji-min-so-as-not], vocab: [w.saan1-wu4, w.po3-waai6, w.ji5-min5], error: { wrong: "以免破壞佢哋，潛水嗰陣唔好掂珊瑚。", explain: "以免 introduces the thing to avoid in the SECOND clause.", grammar: g.ji-min-so-as-not } }
      - { es: "失去咗先識得珍惜，就太遲喇。", en: "If you only learn to cherish it once it's gone, it's too late.", altEs: ["失去咗先懂得珍惜，就太遲喇。"], grammar: [g.causatives-ling-gaau-dou, g.zi-jau-sin-only-if], vocab: [w.sat1-heoi3, w.zan1-sik1] }
    exchanges:
      - q: { es: "點解要保護白海豚？", en: "Why should we protect the white dolphins?" }
        a: { es: "因為佢哋越嚟越少，再唔保護就會絕種。", en: "Because there are fewer and fewer of them; if we don't protect them they'll become extinct." }
        alt: ["佢哋就快絕種喇。", "唔保護會絕種。"]
        grammar: [g.causatives-ling-gaau-dou]
        vocab: [w.bou2-wu6, w.zyut6-zung2, w.baak6-hoi2-tyun4]
      - q: { es: "填海有咩問題？", en: "What's the problem with land reclamation?" }
        a: { es: "會破壞生態，搞到啲魚冇地方住。", en: "It damages the ecology and leaves the fish with nowhere to live." }
        alt: ["破壞生態囉。", "令好多生物失去屋企。"]
        grammar: [g.causatives-ling-gaau-dou]
        vocab: [w.tin4-hoi2, w.po3-waai6, w.sang1-taai3]
      - q: { es: "去蒲台島有咩好睇？", en: "What's there to see on Po Toi?" }
        a: { es: "有好多古怪嘅石頭，仲有幾千年前嘅石刻。", en: "Lots of strange rocks, and rock carvings from thousands of years ago." }
        alt: ["睇石頭同石刻。", "啲石好特別。"]
        grammar: [g.hou-ci-seem]
        vocab: [w.sek6-tau4]
      - q: { es: "我可唔可以執啲珊瑚返屋企？", en: "Can I take some coral home?" }
        a: { es: "唔好呀，以免破壞生態，而且係犯法㗎。", en: "Please don't, it damages the ecology, and it's illegal." }
        alt: ["唔得，會破壞生態。", "千祈唔好。"]
        grammar: [g.ji-min-so-as-not]
        vocab: [w.saan1-wu4, w.ji5-min5]
    texts:
      - title: "蒲台島遊記"
        es: ["我哋由香港仔搭街渡去蒲台島，大約一個鐘。", "島上冇乜人，啲石頭形狀好古怪，令人好驚嘆。", "回程嗰陣大家都好攰，但係覺得好值得。"]
        en: ["We took the kaito from Aberdeen to Po Toi; it took about an hour.", "There's hardly anyone on the island, and the strangely shaped rocks are amazing.", "On the way back everyone was exhausted, but we all felt it was well worth it."]
        grammar: [g.causatives-ling-gaau-dou]
        vocab: [w.gaai1-dou2, w.sek6-tau4]
      - title: "保育團體海報"
        es: ["保護海龜，由你做起。", "請唔好喺沙灘留低垃圾，以免海龜誤食。", "可持續嘅未來，需要大家一齊努力。"]
        en: ["Protecting turtles starts with you.", "Please don't leave rubbish on the beach, so the turtles don't eat it by mistake.", "A sustainable future needs everyone's effort."]
        grammar: [g.ji-min-so-as-not]
        vocab: [w.bou2-wu6, w.hoi2-gwai1, w.ho2-ci4-zuk6]
    spicy:
      - { es: "你嘅笑容破壞咗我嘅寧靜生活。", en: "Your smile has wrecked my peaceful life.", altEs: ["你個笑容破壞咗我嘅寧靜生活。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.po3-waai6, w.ning4-zing6] }
      - { es: "我好似海龜噉，無論游幾遠，最後都會返嚟你身邊。", en: "I'm like a turtle: however far I swim, I always come back to you in the end.", altEs: ["我好似隻海龜，無論游幾遠，最後都會返嚟你身邊。"], grammar: [g.hou-ci-seem], vocab: [w.hoi2-gwai1, w.mou4-leon6] }
      - { es: "為咗同你約會，我犧牲咗成個星期嘅加班費。", en: "To go on a date with you, I've sacrificed a whole week's overtime pay.", altEs: ["為咗同你約會，我犧牲咗一個星期嘅加班費。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.hei1-sang1, w.joek3-wui6] }
      - { es: "你要好好保護我呢種就快絕種嘅好男人。", jp: "nei5 jiu3 hou2 hou2 bou2 wu6 ngo5 ni1 zung2 zau6 faai3 zyut6 zung2 ge3 hou2 naam4 jan2", en: "You have to take good care of me, a nearly extinct species of good man.", altEs: ["你要好好保護我呢種快絕種嘅好男人。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.bou2-wu6, w.zyut6-zung2] }
      - { es: "我哋嘅關係要可持續，你就要每個禮拜請我食一次飯。", jp: "ngo5 dei6 ge3 gwaan1 hai6 jiu3 ho2 ci4 zuk6 nei5 zau6 jiu3 mui5 go3 lai5 baai3 ceng2 ngo5 sik6 jat1 ci3 faan6", en: "If our relationship is going to be sustainable, you'll have to take me out to dinner once a week.", altEs: ["我哋段關係要可持續，你就要每個星期請我食一次飯。"], grammar: [g.causatives-ling-gaau-dou], vocab: [w.ho2-ci4-zuk6, w.gwaan1-hai6] }
dialogues:
  - id: b2.u09.d1
    title: 索罟灣淨灘日
    context: Ah Kiu has brought her friend Mr Ho, a newcomer to Lamma, to a beach clean-up at Sok Kwu Wan.
    lines:
      - { speaker: 阿蕎, es: "多謝你今日嚟幫手淨灘。手套同垃圾袋喺度，你自己攞。", en: "Thanks for coming to help with the beach clean-up today. The gloves and rubbish bags are here, help yourself." }
      - { speaker: 何生, es: "嘩，點解個沙灘有咁多膠樽同發泡膠？", en: "Wow, why are there so many plastic bottles and bits of polystyrene on the beach?" }
      - { speaker: 阿蕎, es: "由於上個禮拜打風，啲海洋垃圾全部沖晒上嚟。", en: "Because of last week's typhoon, all the marine litter got washed up here." }
      - { speaker: 何生, es: "真係令人好心痛。啲海龜會唔會食咗啲膠呀？", en: "It's really heartbreaking. Could the turtles eat the plastic?" }
      - { speaker: 阿蕎, es: "會呀，好多海龜就係食錯膠袋死亡。所以我哋要快啲執，以免啲垃圾又沖落海。", en: "Yes, lots of turtles die from eating plastic bags by mistake. So we need to pick it up quickly, before the rubbish washes back into the sea." }
      - { speaker: 何生, es: "我以前成日用即棄餐具，而家諗起覺得好內疚。", en: "I used to use disposable cutlery all the time; thinking about it now, I feel really guilty." }
      - { speaker: 阿蕎, es: "唔緊要，由今日開始自備餐具就得喇。", en: "Never mind, just start bringing your own cutlery from today." }
      - { speaker: 何生, es: "好。執完之後，我哋去食海鮮好唔好？", en: "OK. After we finish, shall we go and eat seafood?" }
      - { speaker: 阿蕎, es: "好呀，不過記得同老闆講唔要膠飲管。", en: "Sure, but remember to tell the owner we don't want plastic straws." }
    questions:
      - { q: "點解個沙灘有咁多垃圾？", options: ["遊客亂拋垃圾", "上個禮拜打風，啲垃圾沖晒上岸", "發電廠排放廢氣"], answer: 1, explain: "阿蕎 says the typhoon last week washed all the marine litter up (由於上個禮拜打風)." }
      - { q: "點解要快啲執垃圾？", options: ["以免垃圾又沖返落海", "因為就快落雨", "因為要趕船"], answer: 0, explain: "以免啲垃圾又沖返落海: so the rubbish doesn't wash back into the sea." }
      - { q: "何生以前有咩習慣？", options: ["成日淨灘", "成日用即棄餐具", "成日食素"], answer: 1, explain: "He used to use disposable cutlery all the time and now feels guilty (內疚)." }
      - { q: "佢哋執完垃圾之後會做乜嘢？", options: ["返屋企", "去食海鮮", "去行山"], answer: 1, explain: "Mr Ho suggests eating seafood afterwards, and Ah Kiu agrees." }
