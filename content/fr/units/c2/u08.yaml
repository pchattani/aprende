id: c2.u08
title: "Québec, je me souviens"
lessons:
  - id: c2.u08.l1
    title: "Je me souviens"
    teach: [g.c2-review]
    tip: "Final checks: si + plus-que-parfait → conditionnel passé (never si j'aurais); the participle with avoir agrees with a preceding direct object (les caribous que nous avons vus); dont replaces de + noun (la ville dont je rêvais); bien que + subjonctif."
    vocab: [w.je-me-souviens, w.orner, w.plaque-d-immatriculation, w.immatriculation, w.québécois, w.belle-province.nm, w.nouvelle-france.nm, w.colon, w.coureur-des-bois, w.fourrure, w.castor, w.orignal, w.caribou, w.château-frontenac.nm, w.fleuve-saint-laurent.nm, w.promontoire, w.plaines-d-abraham.nm, w.capituler, w.capitulation, w.patriote, w.rébellion, w.survie, w.survivre, w.autochtone, w.général, w.continent, w.aventurier, w.se-soulever, w.écraser, w.conclure, w.freiner]
    sentences:
      - { es: "« Je me souviens » est la devise du Québec ; depuis 1978, elle orne les plaques d'immatriculation.", en: "'Je me souviens' is Québec's motto; since 1978 it has adorned licence plates.", altEs: ["« Je me souviens », c'est la devise du Québec ; depuis 1978, elle figure sur les plaques d'immatriculation."], grammar: [g.c2-review, g.depuis-present], vocab: [w.je-me-souviens, w.orner, w.plaque-d-immatriculation] }
      - { es: "Champlain a fondé Québec en 1608, au pied d'un promontoire qui domine le fleuve Saint-Laurent.", en: "Champlain founded Québec in 1608, at the foot of a promontory overlooking the St Lawrence River.", altEs: ["En 1608, Champlain a fondé Québec au pied d'un promontoire qui domine le fleuve Saint-Laurent."], grammar: [g.c2-review, g.relative-qui-que], vocab: [w.promontoire, w.fleuve-saint-laurent.nm] }
      - { es: "Je rêvais de cette ville depuis le début du voyage.", en: "I had been dreaming of this city since the start of the journey.", grammar: [g.c2-review, g.relative-dont], vocab: [], transform: { instruction: "Start with 'C'est la ville' and use dont", answer: "C'est la ville dont je rêvais depuis le début du voyage.", alt: [], en: "It's the city I had been dreaming of since the start of the journey." } }
      - { es: "Si les Français avaient gagné la bataille des plaines d'Abraham, l'histoire de l'Amérique aurait été différente.", en: "If the French had won the battle of the Plains of Abraham, the history of America would have been different.", altEs: ["Si la France avait gagné la bataille des plaines d'Abraham, l'histoire de l'Amérique aurait été différente."], grammar: [g.c2-review, g.si-plus-que-parfait], vocab: [w.plaines-d-abraham.nm], error: { wrong: "Si les Français auraient gagné la bataille des plaines d'Abraham, l'histoire de l'Amérique aurait été différente.", explain: "Never the conditional after si: si + plus-que-parfait (avaient gagné), then the conditionnel passé.", grammar: g.si-plus-que-parfait } }
      - { es: "Les deux généraux, Wolfe et Montcalm, sont morts des suites de la bataille.", en: "Both generals, Wolfe and Montcalm, died as a result of the battle.", altEs: ["Wolfe et Montcalm, les deux généraux, sont morts des suites de la bataille."], grammar: [g.c2-review, g.passe-compose-etre], vocab: [w.plaines-d-abraham.nm] }
      - { es: "Quelques jours plus tard, la ville a capitulé ; la capitulation a été signée le 18 septembre 1759.", en: "A few days later the city surrendered; the capitulation was signed on 18 September 1759.", altEs: ["La ville a capitulé quelques jours plus tard : la capitulation a été signée le 18 septembre 1759."], grammar: [g.c2-review, g.passive-voice], vocab: [w.capituler, w.capitulation] }
      - { es: "En Nouvelle-France, les coureurs des bois échangeaient des fourrures avec les peuples autochtones.", en: "In New France, the coureurs des bois traded furs with the Indigenous peoples.", altEs: ["En Nouvelle-France, les coureurs des bois faisaient le commerce des fourrures avec les peuples autochtones."], grammar: [g.c2-review, g.imparfait-uses], vocab: [w.nouvelle-france.nm, w.coureur-des-bois, w.fourrure, w.autochtone] }
      - { es: "Le castor était si recherché pour sa fourrure qu'il figure aujourd'hui sur la pièce canadienne de cinq cents.", en: "The beaver was so sought after for its fur that it now appears on the Canadian five-cent coin.", altEs: ["Le castor était tellement recherché pour sa fourrure qu'il figure aujourd'hui sur la pièce de cinq cents canadienne."], grammar: [g.c2-review, g.connectors-cause-consequence], vocab: [w.castor, w.fourrure] }
      - { es: "Les caribous que nous avons vus dans le Nord étaient magnifiques.", en: "The caribou we saw in the North were magnificent.", altEs: ["Les caribous qu'on a vus dans le Nord étaient magnifiques."], grammar: [g.c2-review, g.pc-object-agreement], vocab: [w.caribou], error: { wrong: "Les caribous que nous avons vu dans le Nord étaient magnifiques.", explain: "With avoir, the participle agrees with a direct object placed before it: que (= les caribous) → vus.", grammar: g.pc-object-agreement } }
      - { es: "Sur la route de Charlevoix, un orignal a traversé juste devant notre voiture.", en: "On the road to Charlevoix, a moose crossed right in front of our car.", altEs: ["Sur la route de Charlevoix, un orignal a traversé juste devant notre char."], grammar: [g.c2-review, g.pc-vs-imparfait], vocab: [w.orignal] }
      - { es: "En 1837 et en 1838, les Patriotes se sont soulevés contre le pouvoir britannique, mais la rébellion a été écrasée.", en: "In 1837 and 1838 the Patriotes rose up against British rule, but the rebellion was crushed.", altEs: ["En 1837 et en 1838, les Patriotes se sont révoltés contre le pouvoir britannique, mais la rébellion a été écrasée."], grammar: [g.c2-review, g.pronominal-passe-compose], vocab: [w.patriote, w.rébellion] }
      - { es: "Pour beaucoup de Québécois, descendants des colons de la Nouvelle-France, la survie du français reste une question d'identité.", en: "For many Quebecers, descendants of the settlers of New France, the survival of French remains a question of identity.", altEs: ["Pour de nombreux Québécois, descendants des colons de la Nouvelle-France, la survie du français demeure une question d'identité."], grammar: [g.c2-review], vocab: [w.survie, w.québécois, w.colon] }
      - { es: "La Nouvelle-France a disparu en 1763, mais le français y a survécu.", en: "New France disappeared in 1763, but French survived there.", grammar: [g.c2-review, g.concession], vocab: [w.survivre, w.nouvelle-france.nm], transform: { instruction: "Rewrite it with bien que", answer: "Bien que la Nouvelle-France ait disparu en 1763, le français y a survécu.", alt: ["Bien que la Nouvelle-France ait disparu en 1763, le français a survécu."], en: "Although New France disappeared in 1763, French survived there." } }
      - { es: "Le Château Frontenac, qui a ouvert ses portes en 1893, domine le Vieux-Québec.", en: "The Château Frontenac, which opened its doors in 1893, towers over Old Québec.", altEs: ["Ouvert en 1893, le Château Frontenac domine le Vieux-Québec."], grammar: [g.c2-review, g.relative-qui-que], vocab: [w.château-frontenac.nm] }
      - { es: "Avant 1978, on lisait « La Belle Province » sur les plaques des voitures québécoises.", en: "Before 1978, 'La Belle Province' was written on Québec car plates.", altEs: ["Avant 1978, c'est « La Belle Province » qu'on lisait sur les plaques des voitures québécoises."], grammar: [g.c2-review, g.imparfait-uses], vocab: [w.belle-province.nm, w.immatriculation] }
      - { es: "Je t'enverrai ces photos du fleuve ce soir.", en: "I'll send you these photos of the river tonight.", grammar: [g.c2-review, g.double-object-pronouns], vocab: [], transform: { instruction: "Replace 'ces photos du fleuve' with a pronoun", answer: "Je te les enverrai ce soir.", alt: [], en: "I'll send them to you tonight." } }
    exchanges:
      - q: { es: "Que veut dire la devise du Québec ?", en: "What does Québec's motto mean?" }
        a: { es: "« Je me souviens » : chacun l'interprète à sa façon, mais il s'agit toujours de mémoire.", en: "'I remember': everyone interprets it in their own way, but it's always about memory." }
        alt: ["« Je me souviens ».", "C'est une devise sur la mémoire."]
        grammar: [g.c2-review, g.impersonal-constructions]
        vocab: [w.je-me-souviens]
      - q: { es: "Où a eu lieu la bataille de 1759 ?", en: "Where did the 1759 battle take place?" }
        a: { es: "Sur les plaines d'Abraham, juste à côté de la vieille ville ; aujourd'hui, c'est un grand parc.", en: "On the Plains of Abraham, right next to the old town; today it's a big park." }
        alt: ["Sur les plaines d'Abraham.", "Tout près d'ici, sur les plaines d'Abraham."]
        grammar: [g.c2-review]
        vocab: [w.plaines-d-abraham.nm]
      - q: { es: "Tu as vu des orignaux pendant ton séjour ?", en: "Did you see any moose during your stay?" }
        a: { es: "Un seul, au bord de la route, et il était plus grand que notre voiture !", en: "Just one, at the side of the road, and it was bigger than our car!" }
        alt: ["Non, seulement des castors.", "Oui, deux, dans le parc."]
        grammar: [g.c2-review, g.comparatives]
        vocab: [w.orignal]
      - q: { es: "Depuis quand Québec existe-t-elle ?", en: "How long has Québec City existed?" }
        a: { es: "Depuis 1608 : c'est Champlain qui l'a fondée, au pied de ce promontoire.", en: "Since 1608: Champlain founded it, at the foot of this promontory." }
        alt: ["Depuis 1608.", "Champlain l'a fondée en 1608."]
        grammar: [g.c2-review, g.pc-object-agreement]
        vocab: [w.promontoire]
      - q: { es: "C'est quoi, un coureur des bois ?", en: "What's a coureur des bois?" }
        a: { es: "Un aventurier de la Nouvelle-France qui partait chercher des fourrures au fond des forêts.", en: "An adventurer of New France who went off deep into the forests in search of furs." }
        alt: ["Un marchand de fourrures de la Nouvelle-France.", "Un aventurier qui faisait le commerce des fourrures."]
        grammar: [g.c2-review, g.relative-qui-que]
        vocab: [w.coureur-des-bois, w.fourrure]
    texts:
      - title: "Plaque dans la basse-ville"
        es: ["Près d'ici, en 1608, Samuel de Champlain a construit l'Habitation de Québec.", "C'est le début de la Nouvelle-France.", "Le fleuve Saint-Laurent était alors la grande route vers l'intérieur du continent."]
        en: ["Near here, in 1608, Samuel de Champlain built the Habitation de Québec.", "It's the beginning of New France.", "The St Lawrence River was then the great route into the interior of the continent."]
        grammar: [g.c2-review, g.pc-vs-imparfait]
        vocab: [w.nouvelle-france.nm, w.fleuve-saint-laurent.nm]
      - title: "Chronologie"
        es: ["1608 : Champlain fonde Québec.", "1759 : bataille des plaines d'Abraham.", "1763 : par le traité de Paris, la France cède le Canada à la Grande-Bretagne.", "1978 : « Je me souviens » apparaît sur les plaques d'immatriculation."]
        en: ["1608: Champlain founds Québec.", "1759: battle of the Plains of Abraham.", "1763: by the Treaty of Paris, France cedes Canada to Great Britain.", "1978: 'Je me souviens' appears on licence plates."]
        grammar: [g.c2-review]
        vocab: [w.plaines-d-abraham.nm, w.plaque-d-immatriculation]
    spicy:
      - { es: "Je me souviens de tout : ta robe bleue, ton rire, et le fait que tu m'avais promis de rappeler.", en: "I remember everything: your blue dress, your laugh, and the fact that you'd promised to call me back.", altEs: ["Je me souviens de tout : ta robe bleue, ton rire, et que tu m'avais promis de me rappeler."], grammar: [g.c2-review, g.plus-que-parfait], vocab: [w.je-me-souviens] }
      - { es: "Si tu m'avais dit que tu venais à Québec, je t'aurais attendu sur le quai avec des fleurs.", en: "If you'd told me you were coming to Québec, I'd have waited for you on the quay with flowers.", altEs: ["Si tu m'avais dit que tu venais à Québec, je t'aurais attendue sur le quai avec des fleurs."], grammar: [g.c2-review, g.si-plus-que-parfait], vocab: [] }
      - { es: "Tu as capitulé presque aussi vite que Québec en 1759 : cinq jours après notre rencontre, tu disais oui.", en: "You surrendered almost as fast as Québec in 1759: five days after we met, you said yes.", altEs: ["Tu as capitulé presque aussi vite que Québec en 1759 : cinq jours après notre première rencontre, tu disais oui."], grammar: [g.c2-review, g.comparatives], vocab: [w.capituler] }
      - { es: "La tuque que je t'ai offerte, tu l'as mise tous les jours : j'en conclus que tu penses à moi.", en: "The woolly hat I gave you, you've worn it every day: I conclude that you think about me.", altEs: ["Tu as mis tous les jours la tuque que je t'ai offerte : j'en conclus que tu penses à moi."], grammar: [g.c2-review, g.pc-object-agreement], vocab: [w.tuque] }
      - { es: "Ce n'est pas l'orignal qui m'a fait freiner, c'est ton sourire dans le rétroviseur.", en: "It wasn't the moose that made me brake, it was your smile in the rear-view mirror.", altEs: ["Ce n'est pas à cause de l'orignal que j'ai freiné, c'est à cause de ton sourire dans le rétroviseur."], grammar: [g.c2-review, g.mise-en-relief], vocab: [w.orignal] }
  - id: c2.u08.l2
    title: "Longtemps, je me suis couché de bonne heure"
    teach: [g.literary-prose-style]
    tip: "Free indirect speech has no quotation marks and no il pensa que: the narrator slips into the character's mind (Que faisaient-elles maintenant ?). Read a long Proustian period by finding the main clause first, then the branches."
    vocab: [w.style-indirect-libre, w.mot-juste, w.période, w.rythme-ternaire, w.incipit, w.focalisation, w.monologue-intérieur, w.prosateur, w.styliste, w.stylistique, w.épopée, w.saga, w.fresque, w.roman-du-terroir, w.dramaturgie, w.joual, w.vernaculaire, w.truculence, w.verve, w.éloquence, w.éloquent, w.rural, w.guillemets, w.équilibre, w.araignée, w.interne]
    sentences:
      - { es: "« Longtemps, je me suis couché de bonne heure » : c'est l'incipit de Du côté de chez Swann.", en: "'For a long time, I went to bed early': it's the opening line of Swann's Way.", altEs: ["« Longtemps, je me suis couché de bonne heure » : voilà l'incipit de Du côté de chez Swann."], grammar: [g.literary-prose-style], vocab: [w.incipit], note: "Marcel Proust, 1913." }
      - { es: "Chez Proust, la période s'étire sur des lignes entières avant de retomber sur la proposition principale.", en: "In Proust, the periodic sentence stretches over whole lines before landing on the main clause.", altEs: ["Chez Proust, la phrase s'étire sur des lignes entières avant de retomber sur la proposition principale."], grammar: [g.literary-prose-style, g.apres-avoir-avant-de], vocab: [w.période] }
      - { es: "Flaubert cherchait sans relâche le mot juste et lisait ses phrases à voix haute dans son « gueuloir ».", en: "Flaubert searched relentlessly for the right word and read his sentences aloud in his 'bellowing room'.", altEs: ["Flaubert cherchait sans cesse le mot juste et lisait ses phrases à haute voix dans son « gueuloir »."], grammar: [g.literary-prose-style, g.imparfait-uses], vocab: [w.mot-juste] }
      - { es: "Flaubert lisait ses phrases à voix haute afin qu'elles sonnent juste.", en: "Flaubert read his sentences aloud so that they would ring true.", altEs: ["Flaubert lisait ses phrases à haute voix pour qu'elles sonnent juste."], grammar: [g.literary-prose-style, g.subjonctif-conjonctions], vocab: [w.mot-juste], error: { wrong: "Flaubert lisait ses phrases à voix haute afin qu'elles sonnaient juste.", explain: "afin que always takes the subjonctif: qu'elles sonnent (literary: sonnassent).", grammar: g.subjonctif-conjonctions } }
      - { es: "Dans Madame Bovary, « Que faisaient-elles maintenant ? » est du style indirect libre : c'est Emma qui se pose la question.", en: "In Madame Bovary, 'What were they doing now?' is free indirect speech: it's Emma asking herself the question.", altEs: ["Dans Madame Bovary, « Que faisaient-elles maintenant ? » relève du style indirect libre : c'est Emma qui se pose la question."], grammar: [g.literary-prose-style, g.mise-en-relief], vocab: [w.style-indirect-libre] }
      - { es: "Flaubert fait de l'ennui d'Emma une « araignée silencieuse » qui file sa toile dans l'ombre.", en: "Flaubert turns Emma's boredom into a 'silent spider' spinning its web in the shadows.", altEs: ["Pour Flaubert, l'ennui d'Emma est une « araignée silencieuse » qui file sa toile dans l'ombre."], grammar: [g.literary-prose-style, g.figures-of-style], vocab: [w.styliste] }
      - { es: "Elle se demanda : « Est-ce qu'il partira demain ? »", en: "She wondered: 'Will he leave tomorrow?'", grammar: [g.literary-prose-style, g.discours-indirect-past], vocab: [w.style-indirect-libre], transform: { instruction: "Rewrite the question in free indirect speech (no quotation marks, conditional, inversion)", answer: "Partirait-il demain ?", alt: [], en: "Would he leave tomorrow?" } }
      - { es: "Elle a regardé la pluie.", en: "She looked at the rain.", grammar: [g.literary-prose-style, g.passe-simple-usage], vocab: [w.prosateur], transform: { instruction: "Rewrite it in the passé simple of literary narrative", answer: "Elle regarda la pluie.", alt: [], en: "She looked at the rain." } }
      - { es: "Il était éloquent. Il était drôle. Il était truculent.", en: "He was eloquent. He was funny. He was colourful.", grammar: [g.literary-prose-style], vocab: [w.éloquent, w.rythme-ternaire], transform: { instruction: "Join them into one sentence with a ternary rhythm", answer: "Il était éloquent, drôle et truculent.", alt: ["Il était éloquent, drôle, truculent."], en: "He was eloquent, funny and colourful." } }
      - { es: "Dans Maria Chapdelaine, une voix proclame : « Au pays de Québec rien ne doit mourir et rien ne doit changer. »", en: "In Maria Chapdelaine a voice proclaims: 'In the land of Québec nothing must die and nothing must change.'", altEs: ["Dans le roman Maria Chapdelaine, une voix proclame : « Au pays de Québec rien ne doit mourir et rien ne doit changer. »"], grammar: [g.literary-prose-style], vocab: [w.roman-du-terroir], note: "Louis Hémon (1880-1913), Maria Chapdelaine, a classic of the roman du terroir." }
      - { es: "Gabrielle Roy a peint le quartier ouvrier de Saint-Henri dans Bonheur d'occasion, paru en 1945.", en: "Gabrielle Roy painted the working-class district of Saint-Henri in The Tin Flute, published in 1945.", altEs: ["Dans Bonheur d'occasion, paru en 1945, Gabrielle Roy a peint le quartier ouvrier de Saint-Henri."], grammar: [g.literary-prose-style, g.participial-clauses], vocab: [w.fresque] }
      - { es: "En 1968, Les Belles-sœurs de Michel Tremblay ont fait entrer le joual au théâtre.", en: "In 1968 Michel Tremblay's Les Belles-sœurs brought joual onto the stage.", altEs: ["En 1968, avec Les Belles-sœurs, Michel Tremblay a fait entrer le joual au théâtre."], grammar: [g.literary-prose-style, g.faire-causatif], vocab: [w.joual, w.dramaturgie] }
      - { es: "On a reproché à Tremblay sa langue vernaculaire ; on admire aujourd'hui sa truculence et sa verve.", en: "Tremblay was criticised for his vernacular language; today people admire his colourfulness and verve.", altEs: ["On a reproché à Tremblay sa langue vernaculaire, mais on admire aujourd'hui sa truculence et sa verve."], grammar: [g.literary-prose-style, g.on-instead-of-passive], vocab: [w.vernaculaire, w.truculence, w.verve] }
      - { es: "La focalisation interne nous fait voir le monde par les yeux d'un seul personnage.", en: "Internal focalisation makes us see the world through the eyes of a single character.", altEs: ["Avec la focalisation interne, on voit le monde par les yeux d'un seul personnage."], grammar: [g.literary-prose-style, g.faire-causatif], vocab: [w.focalisation] }
      - { es: "Le monologue intérieur, lui, reproduit le flot des pensées d'un personnage, sans ordre apparent.", en: "Interior monologue, for its part, reproduces the flow of a character's thoughts, without apparent order.", altEs: ["Le monologue intérieur reproduit le flot des pensées d'un personnage, sans ordre apparent."], grammar: [g.literary-prose-style, g.dislocation], vocab: [w.monologue-intérieur] }
      - { es: "Cette saga familiale est une véritable épopée du Québec rural, et la stylistique de l'auteur mériterait une thèse.", en: "This family saga is a true epic of rural Québec, and the author's stylistics would deserve a thesis.", altEs: ["Cette saga familiale est une vraie épopée du Québec rural, et le style de l'auteur mériterait une thèse."], grammar: [g.literary-prose-style, g.conditionnel-present], vocab: [w.saga, w.épopée, w.stylistique] }
    exchanges:
      - q: { es: "Comment repère-t-on le style indirect libre ?", en: "How do you spot free indirect speech?" }
        a: { es: "Il n'y a ni guillemets ni « il pensa que », mais les questions et les exclamations du personnage restent.", en: "There are no quotation marks and no 'he thought that', but the character's questions and exclamations remain." }
        alt: ["Pas de guillemets, mais les questions du personnage restent.", "Par les temps et l'absence de guillemets."]
        grammar: [g.literary-prose-style, g.ni-ni-aucun]
        vocab: [w.style-indirect-libre]
      - q: { es: "Tu as fini Du côté de chez Swann ?", en: "Have you finished Swann's Way?" }
        a: { es: "Pas encore : certaines phrases font une demi-page, je dois les relire deux fois.", en: "Not yet: some sentences are half a page long, I have to read them twice." }
        alt: ["Presque !", "Non, j'en suis encore à l'incipit."]
        grammar: [g.literary-prose-style]
        vocab: [w.période]
      - q: { es: "Pourquoi Flaubert criait-il ses phrases ?", en: "Why did Flaubert shout his sentences?" }
        a: { es: "Pour en vérifier le rythme : si une phrase sonnait faux, il la réécrivait.", en: "To check their rhythm: if a sentence rang false, he rewrote it." }
        alt: ["Pour vérifier le rythme.", "Pour trouver le mot juste."]
        grammar: [g.literary-prose-style, g.pronoun-en]
        vocab: [w.mot-juste]
      - q: { es: "Quel roman québécois me conseilles-tu ?", en: "Which Québec novel do you recommend?" }
        a: { es: "Bonheur d'occasion, de Gabrielle Roy : c'est une fresque de Montréal pendant la guerre.", en: "The Tin Flute, by Gabrielle Roy: it's a panorama of Montreal during the war." }
        alt: ["Maria Chapdelaine, de Louis Hémon.", "Les Belles-sœurs, si tu aimes le théâtre."]
        grammar: [g.literary-prose-style]
        vocab: [w.fresque]
      - q: { es: "Le joual, ça peut être littéraire ?", en: "Can joual be literary?" }
        a: { es: "Depuis Les Belles-sœurs, sans aucun doute ; avant, beaucoup le jugeaient indigne de la scène.", en: "Since Les Belles-sœurs, without a doubt; before, many thought it unworthy of the stage." }
        alt: ["Oui, demande à Michel Tremblay !", "Bien sûr, au théâtre surtout."]
        grammar: [g.literary-prose-style, g.imparfait-uses]
        vocab: [w.joual]
    texts:
      - title: "Proust, Du côté de chez Swann (incipit)"
        es: ["Longtemps, je me suis couché de bonne heure.", "Parfois, à peine ma bougie éteinte, mes yeux se fermaient si vite que je n'avais pas le temps de me dire : « Je m'endors. »"]
        en: ["For a long time, I went to bed early.", "Sometimes, my candle scarcely out, my eyes would close so quickly that I had no time to say to myself: 'I'm falling asleep.'"]
        grammar: [g.literary-prose-style]
        vocab: [w.incipit]
      - title: "Louis Hémon, Maria Chapdelaine (extraits)"
        es: ["Nous sommes venus il y a trois cents ans, et nous sommes restés…", "Rien ne changera, parce que nous sommes un témoignage.", "Au pays de Québec rien ne doit mourir et rien ne doit changer…"]
        en: ["We came three hundred years ago, and we stayed…", "Nothing will change, because we are a testimony.", "In the land of Québec nothing must die and nothing must change…"]
        grammar: [g.literary-prose-style]
        vocab: [w.roman-du-terroir]
    spicy:
      - { es: "Longtemps, je me suis couché de bonne heure ; depuis que je te connais, je me couche à pas d'heure.", en: "For a long time, I went to bed early; since I've known you, I go to bed at all hours.", altEs: ["Longtemps, je me suis couché de bonne heure ; depuis que je te connais, je me couche à n'importe quelle heure."], grammar: [g.literary-prose-style, g.depuis-present], vocab: [w.incipit] }
      - { es: "Je cherche le mot juste pour te décrire depuis une heure ; Flaubert, lui, aurait mis trois semaines.", en: "I've been searching for the right word to describe you for an hour; Flaubert would have taken three weeks.", altEs: ["Ça fait une heure que je cherche le mot juste pour te décrire ; Flaubert, lui, aurait mis trois semaines."], grammar: [g.literary-prose-style, g.conditionnel-passe], vocab: [w.mot-juste] }
      - { es: "Viendrait-il ce soir ? Elle refit son maquillage pour la troisième fois. Non, il ne viendrait pas… Il était déjà derrière la porte.", en: "Would he come tonight? She redid her make-up for the third time. No, he wouldn't come… He was already outside the door.", altEs: ["Viendrait-il ce soir ? Elle se remaquilla pour la troisième fois. Non, il ne viendrait pas… Il était déjà derrière la porte."], grammar: [g.literary-prose-style, g.passe-simple-usage], vocab: [w.style-indirect-libre] }
      - { es: "Ta verve m'a séduite, ton éloquence m'a convaincue, ta truculence m'a fait rougir : un rythme ternaire parfait.", en: "Your verve seduced me, your eloquence convinced me, your colourful talk made me blush: a perfect ternary rhythm.", altEs: ["Ta verve m'a séduit, ton éloquence m'a convaincu, ta truculence m'a fait rougir : un rythme ternaire parfait."], grammar: [g.literary-prose-style, g.pc-object-agreement], vocab: [w.verve, w.éloquence, w.truculence, w.rythme-ternaire] }
      - { es: "Notre histoire n'est pas une saga, c'est un incipit : tout reste à écrire.", en: "Our story isn't a saga, it's an opening line: everything is still to be written.", altEs: ["Notre histoire, ce n'est pas une saga, c'est un incipit : tout reste à écrire."], grammar: [g.literary-prose-style], vocab: [w.saga, w.incipit] }
  - id: c2.u08.l3
    title: "Sans blague ! Parler comme on parle"
    teach: [g.native-fluency-markers]
    tip: "Sound native with reactions (Sans blague ! Mon œil ! Tu parles ! Et alors ? N'empêche…), interjections (oups, beurk, bof, ouf), a dropped e caduc among friends (j'sais pas, j'te l'dis) and stress on the last syllable of each word group."
    vocab: [w.fluidité, w.aisance, w.spontané, w.spontanéité, w.débit, w.intonation, w.liaison, w.enchaînement, w.oups, w.beurk, w.sans-blague, w.mon-œil, w.tu-parles, w.et-alors, w.n-empêche, w.faux-pas, w.bévue, w.lapsus, w.maladresse, w.relâcher, w.confondre]
    sentences:
      - { es: "Il a neigé à Québec le 15 mai ? Sans blague !", en: "It snowed in Québec on 15 May? No kidding!", altEs: ["Il a neigé à Québec le 15 mai ? C'est pas vrai !"], grammar: [g.native-fluency-markers], vocab: [w.sans-blague] }
      - { es: "Beurk, je ne mangerai jamais de poutine au petit-déjeuner !", en: "Yuck, I'll never eat poutine for breakfast!", altEs: ["Beurk, jamais je ne mangerai de poutine au petit-déjeuner !"], grammar: [g.native-fluency-markers, g.de-after-negation], vocab: [w.beurk], error: { wrong: "Beurk, je ne mangerai jamais de la poutine au petit-déjeuner !", explain: "After a negation, the partitive de la becomes de: jamais de poutine.", grammar: g.de-after-negation } }
      - { es: "Il dit qu'il a vu un orignal en plein centre-ville. — Mon œil !", en: "He says he saw a moose right downtown. — Yeah, right!", altEs: ["Il dit qu'il a vu un orignal en plein centre-ville. — N'importe quoi !"], grammar: [g.native-fluency-markers], vocab: [w.mon-œil, w.orignal] }
      - { es: "Tu as aimé le carnaval ? — Tu parles ! On y retourne l'année prochaine.", en: "Did you enjoy the carnival? — You bet! We're going back next year.", altEs: ["Tu as aimé le carnaval ? — Et comment ! On y retourne l'année prochaine."], grammar: [g.native-fluency-markers, g.pronoun-y], vocab: [w.tu-parles] }
      - { es: "Il pleut depuis trois jours ; n'empêche, Québec reste magnifique.", en: "It's been raining for three days; still, Québec is as magnificent as ever.", altEs: ["Il pleut depuis trois jours ; malgré tout, Québec reste magnifique."], grammar: [g.native-fluency-markers, g.depuis-present], vocab: [w.n-empêche] }
      - { es: "Je ne sais pas.", en: "I don't know.", grammar: [g.native-fluency-markers, g.spoken-negation], vocab: [w.relâcher], transform: { instruction: "Say it as in fast casual speech (drop ne and the e caduc)", answer: "J'sais pas.", alt: ["Je sais pas."], en: "Dunno." } }
      - { es: "Entre amis, relâche ta prononciation : dis « j'te l'dis » plutôt que « je te le dis ».", en: "Among friends, relax your pronunciation: say 'j'te l'dis' rather than 'je te le dis'.", altEs: ["Entre amis, relâche ta prononciation : dis « j'te l'dis » au lieu de « je te le dis »."], grammar: [g.native-fluency-markers, g.imperative], vocab: [w.relâcher] }
      - { es: "Ton débit est un peu rapide : ralentis, et l'intonation fera le reste.", en: "You speak a bit fast: slow down, and the intonation will do the rest.", altEs: ["Tu parles un peu vite : ralentis, et l'intonation fera le reste."], grammar: [g.native-fluency-markers, g.futur-simple-forms], vocab: [w.débit, w.intonation] }
      - { es: "La liaison est obligatoire dans « les amis », mais interdite après « et » : on dit « et / alors ».", en: "Liaison is compulsory in 'les amis', but forbidden after 'et': you say 'et / alors'.", altEs: ["Dans « les amis », la liaison est obligatoire, mais après « et », elle est interdite."], grammar: [g.native-fluency-markers, g.elision-liaison], vocab: [w.liaison] }
      - { es: "Grâce à l'enchaînement, « une amie » se prononce presque comme un seul mot.", en: "Thanks to linking, 'une amie' is pronounced almost like a single word.", altEs: ["Avec l'enchaînement, « une amie » se prononce presque comme un seul mot."], grammar: [g.native-fluency-markers, g.pronominal-passive], vocab: [w.enchaînement] }
      - { es: "J'ai appelé ma prof « maman » devant toute la classe : quel lapsus !", en: "I called my teacher 'Mum' in front of the whole class: what a slip of the tongue!", altEs: ["J'ai appelé ma professeure « maman » devant toute la classe : quel lapsus !"], grammar: [g.native-fluency-markers], vocab: [w.lapsus] }
      - { es: "Il a commis une bévue en confondant Montréal et Québec devant le maire.", en: "He made a blunder by mixing up Montreal and Québec City in front of the mayor.", altEs: ["Il a fait une bévue en confondant Montréal et Québec devant le maire."], grammar: [g.native-fluency-markers, g.gerondif], vocab: [w.bévue], transform: { instruction: "Replace the gérondif with a clause starting with parce qu'il", answer: "Il a commis une bévue parce qu'il a confondu Montréal et Québec devant le maire.", alt: ["Il a fait une bévue parce qu'il a confondu Montréal et Québec devant le maire."], en: "He made a blunder because he mixed up Montreal and Québec City in front of the mayor." } }
      - { es: "Tutoyer la directrice à la première réunion, c'est un faux pas ; lui faire la bise, une vraie maladresse.", en: "Using tu with the director at the first meeting is a faux pas; kissing her on the cheek, a real blunder.", altEs: ["Tutoyer la directrice dès la première réunion, c'est un faux pas ; lui faire la bise, c'est une vraie maladresse."], grammar: [g.native-fluency-markers, g.tu-vs-vous], vocab: [w.faux-pas, w.maladresse] }
      - { es: "La fluidité ne vient pas de la grammaire seule : elle naît de la spontanéité.", en: "Fluency doesn't come from grammar alone: it is born of spontaneity.", altEs: ["La fluidité ne vient pas seulement de la grammaire : elle vient de la spontanéité."], grammar: [g.native-fluency-markers], vocab: [w.fluidité, w.spontanéité] }
      - { es: "Elle parle français avec une aisance qui impressionne même les Québécois.", en: "She speaks French with an ease that impresses even Quebecers.", altEs: ["Elle parle le français avec une aisance qui impressionne même les Québécois."], grammar: [g.native-fluency-markers, g.relative-qui-que], vocab: [w.aisance] }
      - { es: "Réponds de façon spontanée, sans chercher la phrase parfaite.", en: "Answer spontaneously, without looking for the perfect sentence.", altEs: ["Réponds spontanément, sans chercher la phrase parfaite."], grammar: [g.native-fluency-markers, g.adjective-agreement], vocab: [w.spontané], error: { wrong: "Réponds de façon spontané, sans chercher la phrase parfaite.", explain: "Façon is feminine, so the adjective agrees: de façon spontanée.", grammar: g.adjective-agreement } }
    exchanges:
      - q: { es: "L'hiver dernier, il a fait moins quarante.", en: "Last winter it got down to minus forty." }
        a: { es: "Sans blague ! Moi, je serais resté sous la couette jusqu'au printemps.", en: "No kidding! I'd have stayed under the duvet till spring." }
        alt: ["Sans blague !", "Ouf, je n'étais pas là !"]
        grammar: [g.native-fluency-markers, g.conditionnel-passe]
        vocab: [w.sans-blague]
      - q: { es: "Je parle comme un vrai Québécois, maintenant.", en: "I talk like a real Quebecer now." }
        a: { es: "Mon œil ! Hier soir encore, tu as confondu « dîner » et « souper ».", en: "Yeah, right! Only last night you mixed up 'dîner' and 'souper'." }
        alt: ["Mon œil !", "Tu parles !"]
        grammar: [g.native-fluency-markers]
        vocab: [w.mon-œil]
      - q: { es: "Tu as aimé la poutine ?", en: "Did you like the poutine?" }
        a: { es: "Bof, c'est un peu lourd ; n'empêche, j'en reprendrais bien.", en: "Meh, it's a bit heavy; still, I'd have some more." }
        alt: ["Tu parles, j'en ai pris deux !", "Beurk, pas du tout."]
        grammar: [g.native-fluency-markers, g.pronoun-en]
        vocab: [w.n-empêche]
      - q: { es: "Pardon, je t'ai appelée Julie !", en: "Sorry, I called you Julie!" }
        a: { es: "Pas grave, c'est un lapsus ; je m'appelle Juliette, c'était presque ça.", en: "No worries, it's a slip of the tongue; my name's Juliette, it was close." }
        alt: ["C'est pas grave !", "Oups ! Ce n'est rien."]
        grammar: [g.native-fluency-markers]
        vocab: [w.lapsus]
      - q: { es: "Comment je peux améliorer mon intonation ?", en: "How can I improve my intonation?" }
        a: { es: "Écoute des balados et imite le débit des animateurs, phrase par phrase.", en: "Listen to podcasts and imitate the hosts' pace, sentence by sentence." }
        alt: ["Imite les animateurs de radio.", "Répète après des natifs."]
        grammar: [g.native-fluency-markers, g.imperative]
        vocab: [w.intonation, w.débit]
    texts:
      - title: "Conseils d'une prof de phonétique"
        es: ["Accentuez la dernière syllabe du groupe, pas chaque mot.", "Entre amis, laissez tomber quelques e muets.", "Et surtout, osez parler : la fluidité vient avec la pratique."]
        en: ["Stress the last syllable of the group, not every word.", "Among friends, drop a few silent e's.", "Above all, dare to speak: fluency comes with practice."]
        grammar: [g.native-fluency-markers, g.imperative]
        vocab: [w.fluidité]
      - title: "Conversation dans la rue"
        es: ["— Tu sais quoi ? J'ai trouvé un appart dans le Vieux-Québec.", "— Sans blague !", "— N'empêche, le loyer est salé."]
        en: ["— Guess what? I've found a flat in Old Québec.", "— No kidding!", "— Still, the rent is steep."]
        grammar: [g.native-fluency-markers]
        vocab: [w.sans-blague, w.n-empêche]
    spicy:
      - { es: "Oups, je t'ai écrit « je t'aime » au lieu de « à demain » ; c'était un lapsus… ou pas.", en: "Oops, I wrote 'I love you' instead of 'see you tomorrow'; it was a slip… or not.", altEs: ["Oups, je t'ai écrit « je t'aime » au lieu de « à demain » : c'était un lapsus… ou pas."], grammar: [g.native-fluency-markers], vocab: [w.oups, w.lapsus] }
      - { es: "Tu dis que tu ne danses jamais ? Mon œil, je t'ai vu au carnaval !", en: "You say you never dance? Yeah, right, I saw you at the carnival!", altEs: ["Tu ne danses jamais ? Mon œil, je t'ai vue au carnaval !"], grammar: [g.native-fluency-markers], vocab: [w.mon-œil] }
      - { es: "Moi, nerveux ? Tu parles ! Je bafouille seulement quand tu me regardes.", en: "Me, nervous? As if! I only stammer when you look at me.", altEs: ["Moi, nerveuse ? Tu parles ! Je bafouille seulement quand tu me regardes."], grammar: [g.native-fluency-markers], vocab: [w.tu-parles] }
      - { es: "J'ai renversé du vin sur ta chemise : maladresse, ou excuse pour te prêter mon chandail ?", en: "I spilt wine on your shirt: clumsiness, or an excuse to lend you my sweater?", altEs: ["J'ai renversé du vin sur ta chemise : simple maladresse, ou excuse pour te prêter mon chandail ?"], grammar: [g.native-fluency-markers], vocab: [w.maladresse, w.chandail] }
      - { es: "Et alors, si je rougis ? N'empêche, c'est toi qui m'as invitée.", en: "So what if I'm blushing? All the same, you're the one who asked me out.", altEs: ["Et alors, si je rougis ? N'empêche que c'est toi qui m'as invitée."], grammar: [g.native-fluency-markers, g.ce-qui-c-est], vocab: [w.et-alors, w.n-empêche] }
  - id: c2.u08.l4
    title: "Au bout du périple"
    teach: [g.c2-review, g.native-fluency-markers]
    tip: "Journey's end: the faux amis still to watch (actuellement = currently, éventuellement = possibly), the être verbs and their agreement, the subjonctif after il faut que and avant que, and the goodbyes: à la prochaine, au plaisir, bon courage."
    vocab: [w.bon-courage, w.à-la-prochaine, w.au-plaisir, w.à-la-revoyure, w.maîtrise, w.maîtriser, w.peaufiner, w.parfaire, w.aboutissement, w.aboutir, w.périple, w.pérégrination, w.escale, w.funiculaire, w.traversier, w.ceinture-fléchée, w.carnaval-d-hiver, w.bonhomme-de-neige, w.subjonctif]
    sentences:
      - { es: "Je n'ai pas su que Québec était si belle, alors je ne suis pas venu plus tôt.", en: "I didn't know Québec was so beautiful, so I didn't come sooner.", grammar: [g.c2-review, g.si-plus-que-parfait], vocab: [], transform: { instruction: "Turn it into a regret with si + plus-que-parfait", answer: "Si j'avais su que Québec était si belle, je serais venu plus tôt.", alt: ["Si j'avais su que Québec était si belle, je serais venue plus tôt.", "Si j'avais su que Québec était aussi belle, je serais venu plus tôt.", "Si j'avais su que Québec était aussi belle, je serais venue plus tôt."], en: "If I'd known Québec was so beautiful, I'd have come sooner." } }
      - { es: "Si j'avais su que Québec était si belle, j'y serais venue dès le début du voyage.", en: "If I'd known Québec was so beautiful, I'd have come here at the very start of the journey.", altEs: ["Si j'avais su que Québec était aussi belle, j'y serais venu dès le début du voyage."], grammar: [g.c2-review, g.si-plus-que-parfait], vocab: [w.périple], error: { wrong: "Si j'aurais su que Québec était si belle, j'y serais venue dès le début du voyage.", explain: "Si j'aurais su is the classic mistake: after si, use the plus-que-parfait (si j'avais su).", grammar: g.si-plus-que-parfait } }
      - { es: "Le voyage est fini, mais je continuerai à parler français tous les jours.", en: "The journey is over, but I'll keep speaking French every day.", grammar: [g.c2-review, g.concession], vocab: [w.périple], transform: { instruction: "Rewrite it with bien que", answer: "Bien que le voyage soit fini, je continuerai à parler français tous les jours.", alt: ["Bien que le voyage soit terminé, je continuerai à parler français tous les jours.", "Bien que le voyage soit fini, je continuerai de parler français tous les jours."], en: "Although the journey is over, I'll keep speaking French every day." } }
      - { es: "Nos pérégrinations nous ont menés de Bruxelles à Dakar, puis de Fort-de-France à Montréal.", en: "Our wanderings took us from Brussels to Dakar, then from Fort-de-France to Montreal.", altEs: ["Nos pérégrinations nous ont conduits de Bruxelles à Dakar, puis de Fort-de-France à Montréal."], grammar: [g.c2-review, g.pc-object-agreement], vocab: [w.pérégrination] }
      - { es: "Je me souviendrai de tous ceux que j'ai rencontrés en chemin, et de tout ce qu'ils m'ont appris.", en: "I will remember everyone I met along the way, and everything they taught me.", altEs: ["Je me rappellerai tous ceux que j'ai rencontrés en chemin, et tout ce qu'ils m'ont appris."], grammar: [g.c2-review, g.pc-object-agreement, g.ce-qui-ce-que], vocab: [w.je-me-souviens], error: { wrong: "Je me souviendrai de tous ceux que j'ai rencontré en chemin, et de tout ce qu'ils m'ont appris.", explain: "Que stands for ceux (masculine plural) and comes before avoir: rencontrés.", grammar: g.pc-object-agreement } }
      - { es: "Actuellement, je vis à Québec ; éventuellement, j'y resterai un an de plus.", en: "At the moment I live in Québec City; I may possibly stay a year longer.", altEs: ["En ce moment, je vis à Québec ; peut-être que j'y resterai un an de plus."], grammar: [g.c2-review, g.anglicisms-calques], vocab: [w.faux-ami], note: "Faux amis: actuellement = currently, éventuellement = possibly." }
      - { es: "Il faut que je finisse mes cartes postales avant que le traversier parte.", en: "I must finish my postcards before the ferry leaves.", altEs: ["Il faut que je finisse mes cartes postales avant que le traversier ne parte."], grammar: [g.c2-review, g.subjonctif-necessite, g.ne-expletif], vocab: [w.traversier] }
      - { es: "Prenons le traversier pour Lévis : de l'autre rive, la vue sur le Château Frontenac est superbe.", en: "Let's take the ferry to Lévis: from the other bank, the view of the Château Frontenac is superb.", altEs: ["On prend le traversier pour Lévis ? De l'autre rive, la vue sur le Château Frontenac est superbe."], grammar: [g.c2-review, g.imperative], vocab: [w.traversier, w.château-frontenac.nm] }
      - { es: "Au Carnaval de Québec, Bonhomme porte une tuque rouge et une ceinture fléchée.", en: "At the Québec Winter Carnival, Bonhomme wears a red woolly hat and an arrow sash.", altEs: ["Au carnaval d'hiver de Québec, Bonhomme porte une tuque rouge et une ceinture fléchée."], grammar: [g.c2-review, g.adjective-position], vocab: [w.carnaval-d-hiver, w.ceinture-fléchée, w.tuque] }
      - { es: "Elle s'est levée tôt, elle est sortie et elle a fait un bonhomme de neige devant l'hôtel.", en: "She got up early, went out and built a snowman in front of the hotel.", altEs: ["Elle s'est levée tôt, est sortie et a fait un bonhomme de neige devant l'hôtel."], grammar: [g.c2-review, g.passe-compose-etre, g.pronominal-passe-compose], vocab: [w.bonhomme-de-neige] }
      - { es: "Maîtriser une langue, ce n'est pas ne plus faire d'erreurs : c'est savoir les corriger.", en: "Mastering a language isn't about making no more mistakes: it's about knowing how to correct them.", altEs: ["Maîtriser une langue, ce n'est pas ne plus faire de fautes, c'est savoir les corriger."], grammar: [g.c2-review, g.negation-jamais-plus-rien], vocab: [w.maîtriser] }
      - { es: "Ta maîtrise du subjonctif impressionnerait un académicien.", en: "Your command of the subjunctive would impress an Academician.", altEs: ["Ta maîtrise du subjonctif impressionnerait un membre de l'Académie française."], grammar: [g.c2-review, g.conditionnel-present], vocab: [w.maîtrise] }
      - { es: "Il me reste à peaufiner mon accent et à parfaire mon vocabulaire.", en: "I still have to polish my accent and perfect my vocabulary.", altEs: ["Il me reste encore à peaufiner mon accent et à parfaire mon vocabulaire."], grammar: [g.c2-review, g.impersonal-constructions], vocab: [w.peaufiner, w.parfaire] }
      - { es: "Ce voyage est l'aboutissement de deux ans d'efforts ; ils ont enfin abouti.", en: "This journey is the culmination of two years of effort; it has finally paid off.", altEs: ["Ce voyage est l'aboutissement de deux ans de travail ; mes efforts ont enfin abouti."], grammar: [g.c2-review], vocab: [w.aboutissement, w.aboutir] }
      - { es: "À la prochaine, et bon courage pour la suite !", en: "See you next time, and good luck with what comes next!", altEs: ["À la prochaine, et bon courage pour la suite."], grammar: [g.native-fluency-markers], vocab: [w.à-la-prochaine, w.bon-courage] }
      - { es: "Au plaisir de vous revoir, madame, et merci pour tout. — Allez, à la revoyure !", en: "I hope to see you again, madam, and thank you for everything. — Off you go, see you!", altEs: ["Au plaisir de vous revoir, madame, et merci pour tout. — Allez, à bientôt !"], grammar: [g.native-fluency-markers, g.register-levels], vocab: [w.au-plaisir, w.à-la-revoyure] }
    exchanges:
      - q: { es: "Alors, ce voyage, c'était comment ?", en: "So, how was the journey?" }
        a: { es: "Inoubliable : chaque escale m'a appris quelque chose, et Québec en est l'aboutissement.", en: "Unforgettable: every stop taught me something, and Québec is the culmination." }
        alt: ["Inoubliable !", "Trop court, évidemment."]
        grammar: [g.c2-review, g.pronoun-en]
        vocab: [w.escale, w.aboutissement]
      - q: { es: "Tu reviendras au Québec ?", en: "Will you come back to Québec?" }
        a: { es: "Éventuellement, oui ; et je dis bien « éventuellement », pas « finalement » !", en: "Possibly, yes; and I do mean 'possibly', not 'eventually'!" }
        alt: ["Sûrement !", "J'espère, l'hiver prochain."]
        grammar: [g.c2-review, g.anglicisms-calques]
        vocab: [w.faux-ami]
      - q: { es: "On prend le funiculaire ou l'escalier Casse-Cou ?", en: "Shall we take the funicular or the Breakneck Stairs?" }
        a: { es: "Le funiculaire : mes jambes ont assez marché depuis Paris !", en: "The funicular: my legs have walked enough since Paris!" }
        alt: ["Le funiculaire, sans hésiter.", "L'escalier, pour la vue !"]
        grammar: [g.c2-review]
        vocab: [w.funiculaire]
      - q: { es: "Merci pour tout, et à la prochaine !", en: "Thanks for everything, and see you next time!" }
        a: { es: "Au plaisir ! Et bon courage pour la suite.", en: "It was a pleasure! And good luck with what's next." }
        alt: ["Au plaisir !", "À la prochaine, bon voyage !"]
        grammar: [g.native-fluency-markers]
        vocab: [w.au-plaisir, w.bon-courage, w.à-la-prochaine]
      - q: { es: "Qu'est-ce qu'il te reste à travailler ?", en: "What do you still need to work on?" }
        a: { es: "Peaufiner mon accent, surtout ; la grammaire, je la maîtrise à peu près.", en: "Polishing my accent, mostly; the grammar, I've more or less mastered." }
        alt: ["Mon accent.", "Le subjonctif imparfait, pour rire."]
        grammar: [g.c2-review, g.dislocation]
        vocab: [w.peaufiner, w.maîtriser]
    texts:
      - title: "Dernière carte postale"
        es: ["Chers Leo, Bonchita et Luna, me voici à Québec, au bout du voyage.", "Si vous voyiez le fleuve sous la neige !", "Je me souviens de chaque escale, de Paris jusqu'ici.", "Je vous embrasse, et à la prochaine !"]
        en: ["Dear Leo, Bonchita and Luna, here I am in Québec City, at the end of the journey.", "If only you could see the river under the snow!", "I remember every stop, from Paris to here.", "Love to you all, and see you next time!"]
        grammar: [g.c2-review, g.si-imparfait-conditionnel]
        vocab: [w.escale, w.à-la-prochaine]
      - title: "Mot dans le livre d'or de l'hôtel"
        es: ["Merci pour ce séjour inoubliable au pied du Château Frontenac.", "Nous reviendrons pour le carnaval d'hiver, c'est promis.", "Au plaisir !"]
        en: ["Thank you for this unforgettable stay at the foot of the Château Frontenac.", "We'll come back for the winter carnival, we promise.", "Hope to see you again!"]
        grammar: [g.c2-review, g.futur-simple-forms]
        vocab: [w.carnaval-d-hiver, w.au-plaisir]
    spicy:
      - { es: "Si j'avais su que tu serais au carnaval, j'aurais mis ma plus belle ceinture fléchée.", en: "If I'd known you'd be at the carnival, I'd have worn my finest arrow sash.", altEs: ["Si j'avais su que tu viendrais au carnaval, j'aurais mis ma plus belle ceinture fléchée."], grammar: [g.c2-review, g.si-plus-que-parfait], vocab: [w.ceinture-fléchée] }
      - { es: "Au plaisir de te revoir… et pas seulement pour parler de grammaire.", en: "Hope to see you again… and not just to talk about grammar.", altEs: ["Au plaisir de te revoir, et pas seulement pour parler grammaire."], grammar: [g.native-fluency-markers], vocab: [w.au-plaisir] }
      - { es: "Bien que le voyage soit fini, je garde ton numéro, au cas où tu aurais besoin de cours de subjonctif.", en: "Although the journey is over, I'm keeping your number, in case you need subjunctive lessons.", altEs: ["Même si le voyage est fini, je garde ton numéro, au cas où tu aurais besoin de cours de subjonctif."], grammar: [g.c2-review, g.concession], vocab: [w.périple] }
      - { es: "Sur le traversier, tu m'as demandé l'heure ; trois escales plus tard, on partageait le même dessert.", en: "On the ferry you asked me the time; three stops later, we were sharing the same dessert.", altEs: ["Sur le traversier, tu m'as demandé l'heure, et trois escales plus tard, on partageait le même dessert."], grammar: [g.c2-review, g.pc-vs-imparfait], vocab: [w.traversier, w.escale] }
      - { es: "Je te souhaite bon courage : tu vas devoir supporter mon accent québécois toute la soirée.", en: "Good luck to you: you'll have to put up with my Québec accent all evening.", altEs: ["Bon courage : tu vas devoir supporter mon accent québécois toute la soirée."], grammar: [g.native-fluency-markers, g.futur-proche], vocab: [w.bon-courage, w.québécois] }
dialogues:
  - id: c2.u08.d1
    title: "Sur la terrasse Dufferin"
    context: "At the end of the journey, Geneviève, a guide from Québec City, walks with Paul along the terrace below the Château Frontenac."
    lines:
      - { speaker: Geneviève, es: "Pis, Paul, ça fait quoi d'arriver au bout du voyage ?", en: "So, Paul, how does it feel to reach the end of the journey?" }
      - { speaker: Paul, es: "Franchement ? Si on m'avait dit au départ que je comprendrais le joual, je ne l'aurais pas cru.", en: "Honestly? If someone had told me at the start that I'd understand joual, I wouldn't have believed it." }
      - { speaker: Geneviève, es: "Ben voyons ! Tu le parles presque, maintenant.", en: "Come on! You almost speak it now." }
      - { speaker: Paul, es: "N'exagère pas. Je dis « tabarouette » et « pantoute », c'est tout.", en: "Don't exaggerate. I say 'tabarouette' and 'pantoute', that's all." }
      - { speaker: Geneviève, es: "C'est déjà pas pire ! Regarde : là-haut, le Château Frontenac, et en bas, le fleuve.", en: "That's not bad already! Look: up there, the Château Frontenac, and down below, the river." }
      - { speaker: Paul, es: "C'est ici que Champlain a fondé la ville, en 1608 ?", en: "Is this where Champlain founded the city, in 1608?" }
      - { speaker: Geneviève, es: "Juste en bas, dans la basse-ville. On peut y descendre en funiculaire.", en: "Just below, in the lower town. You can go down by funicular." }
      - { speaker: Paul, es: "Et les plaines d'Abraham, c'est loin ?", en: "And the Plains of Abraham, are they far?" }
      - { speaker: Geneviève, es: "Dix minutes à pied. C'est là que la Nouvelle-France a perdu la bataille de 1759.", en: "Ten minutes' walk. That's where New France lost the battle of 1759." }
      - { speaker: Paul, es: "Pourtant, on parle encore français partout. C'est pour ça, « Je me souviens » ?", en: "And yet French is still spoken everywhere. Is that what 'Je me souviens' is about?" }
      - { speaker: Geneviève, es: "Entre autres. Bon, on prend le traversier pour Lévis ? La vue sur la ville est écœurante.", en: "Among other things. Right, shall we take the ferry to Lévis? The view of the city is awesome." }
      - { speaker: Paul, es: "Avec plaisir. Et après, je t'invite à souper ; à la prochaine escale, il n'y aura plus de poutine !", en: "Gladly. And afterwards I'm taking you to supper; at the next stop there won't be any more poutine!" }
    questions:
      - { q: "Qu'est-ce que Paul n'aurait pas cru au début du voyage ?", options: ["Qu'il comprendrait le joual", "Qu'il mangerait de la poutine", "Qu'il verrait le fleuve"], answer: 0, explain: "Paul says that if he had been told at the start that he would understand joual, he wouldn't have believed it." }
      - { q: "Comment peut-on descendre dans la basse-ville ?", options: ["En traversier", "En funiculaire", "En motoneige"], answer: 1, explain: "Geneviève says you can go down to the lower town by funicular." }
      - { q: "Que s'est-il passé sur les plaines d'Abraham en 1759 ?", options: ["Champlain y a fondé la ville", "La Nouvelle-France y a perdu une bataille", "On y a construit le Château Frontenac"], answer: 1, explain: "Geneviève: c'est là que la Nouvelle-France a perdu la bataille de 1759." }
      - { q: "Que veut dire Geneviève par « la vue est écœurante » ?", options: ["La vue est dégoûtante", "La vue est magnifique", "La vue est cachée"], answer: 1, explain: "In Québec, écœurant usually means 'awesome', the opposite of its meaning in France." }
writing:
  - task: "Write a short reflection on Québec's motto « Je me souviens », seen on every licence plate: history, memory and identity."
    min: 130
    max: 220
    use: [w.je-me-souviens, w.plaque-d-immatriculation, w.capitulation, w.survivance, w.patriote]
    useAtLeast: 3
    grammar: [g.c2-review, g.literary-prose-style]
    expect:
      - { pattern: "\\bje me souviens\\b", hint: "Quote and discuss the motto « Je me souviens »." }
      - { pattern: "\\b(m[eé]moire|histoire|identit[eé]|survivance|devise|souvenir)\\b", hint: "Reflect on memory, history and identity." }
    model: { es: "Sur chaque plaque d'immatriculation du Québec figurent trois mots : « Je me souviens ». Cette devise, inscrite en 1883 sur la façade de l'Hôtel du Parlement, intrigue les visiteurs. De quoi les Québécois se souviennent-ils ? L'architecte qui l'a choisie n'a jamais vraiment expliqué son sens, et c'est peut-être ce secret qui fait sa force. Pour certains, elle rappelle la Nouvelle-France et la capitulation de 1760, après laquelle les Canadiens français ont dû vivre sous le pouvoir britannique. Pour d'autres, elle évoque la survivance d'un peuple qui a su garder sa langue, sa foi et ses traditions pendant plus de deux siècles. D'autres encore y voient le souvenir de la rébellion des patriotes. Quoi qu'il en soit, la devise affirme une identité fondée sur la mémoire. Se souvenir, pour une petite nation francophone en Amérique, ce n'est pas regarder vers le passé : c'est refuser de disparaître.", en: "Every Québec licence plate bears three words: 'Je me souviens' (I remember). This motto, inscribed in 1883 on the façade of the Parliament Building, intrigues visitors. What do Quebecers remember? The architect who chose it never really explained its meaning, and perhaps it is this secret that gives it its strength. For some, it recalls New France and the capitulation of 1760, after which French Canadians had to live under British power. For others, it evokes the survival of a people who managed to keep their language, faith and traditions for more than two centuries. Others still see in it the memory of the Patriots' rebellion. Whatever the case, the motto asserts an identity founded on memory. For a small francophone nation in America, remembering does not mean looking back: it means refusing to disappear." }
  - task: "Write the opening paragraph of a novel set in Québec City in a literary style, using free indirect speech (style indirect libre) and at least one ternary rhythm."
    min: 130
    max: 220
    use: [w.promontoire, w.brume, w.fleuve, w.hésiter, w.valise]
    useAtLeast: 3
    grammar: [g.literary-prose-style]
    expect:
      - { pattern: "(?<![a-zàâçéèêëîïôûùœ])[a-zàâçéèêëîïôûùœ]+,\\s[^,.!?]{1,40},\\s(et|ou)\\s[^,.!?]{1,40}[,.!?]", hint: "Use a ternary rhythm: three elements, A, B et C." }
      - { pattern: "(?<![a-zàâçéèêëîïôûùœ])(?!(mais|jamais|fais|fait|vais|sais|sait|frais|lait|parfait|anglais|fran[cç]ais|palais|vrais|mauvais)(?![a-zàâçéèêëîïôûùœ]))[a-zàâçéèêëîïôûùœ]{2,}(ais|ait|aient)(?![a-zàâçéèêëîïôûùœ])", hint: "Narrate in the past (imparfait / passé simple), letting the character's thoughts slip into the narration." }
    model: { es: "Ce soir-là, la neige tombait sur Québec comme elle tombe depuis toujours, lente, silencieuse et têtue. Du haut du promontoire, Marie-Ève regardait le fleuve disparaître sous la brume. Elle avait quitté la ville vingt ans plus tôt, en jurant de ne jamais revenir. Et voilà qu'elle était là, devant la maison de sa mère, une valise à la main. Que dirait-elle, la vieille femme, en la voyant ? Lui pardonnerait-elle son silence, ses lettres jamais envoyées, ses Noëls passés ailleurs ? Bah, il était trop tard pour reculer. Le taxi était reparti, la rue était vide, et le froid lui piquait déjà les joues. Elle respira profondément. Après tout, elle avait traversé des océans ; elle pouvait bien traverser une rue. Elle monta les trois marches, hésita longtemps, puis frappa enfin à la porte.", en: "That evening the snow was falling on Québec City as it has always fallen, slow, silent and stubborn. From the top of the promontory, Marie-Ève watched the river vanish under the mist. She had left the city twenty years earlier, swearing never to return. And now here she was, in front of her mother's house, a suitcase in her hand. What would the old woman say when she saw her? Would she forgive her silence, her letters never sent, her Christmases spent elsewhere? Well, it was too late to turn back. The taxi had left, the street was empty, and the cold was already biting her cheeks. She took a deep breath. After all, she had crossed oceans; she could surely cross a street. She climbed the three steps, hesitated for a long time, then finally knocked on the door." }
  - task: "Write a lively dialogue between two friends who meet again after years apart, using natural spoken markers (sans blague, mon œil, tu parles, n'empêche, et alors, oups…)."
    min: 130
    max: 220
    use: [w.sans-blague, w.mon-œil, w.tu-parles, w.n-empêche, w.oups]
    useAtLeast: 3
    grammar: [g.native-fluency-markers]
    expect:
      - { pattern: "\\b(sans blague|mon [oœ]eil|tu parles|n['’]emp[eê]che|et alors|oups|beurk|bon ben|bref|quoi|hein|du coup|genre|franchement|carr[eé]ment)\\b", hint: "Use spoken markers: sans blague, mon œil, tu parles, n'empêche…" }
      - { pattern: "[«»\\-—–]|\\?", hint: "Write it as a dialogue, with each speaker's lines." }
    model: { es: "— Julie ? Sans blague, c'est toi ? Ça fait combien de temps, dix ans ? — Au moins ! Tu n'as pas changé du tout. — Mon œil ! J'ai pris dix kilos et je perds mes cheveux. Et toi, tu vis toujours à Paris ? — Tu parles ! Je suis partie il y a cinq ans. J'habite à Québec, maintenant. — À Québec ? Et alors, tu ne meurs pas de froid, l'hiver ? — Bof, on s'habitue. N'empêche, la première année, j'ai cru que j'allais geler sur place. — Et le travail ? Tu es toujours journaliste ? — Oui, enfin, à peu près. J'écris pour un magazine de voyage. Bon, et toi, raconte ! Tu t'es marié ? — Oups, tu ne savais pas ? Si, avec Antoine, ton ancien voisin ! — Non ! Sérieusement ? Bon ben, il faut absolument qu'on prenne un café pour que tu me racontes tout.", en: "— Julie? No kidding, is that you? How long has it been, ten years? — At least! You haven't changed at all. — My foot! I've put on ten kilos and I'm losing my hair. And you, do you still live in Paris? — You must be joking! I left five years ago. I live in Québec City now. — Québec? So don't you freeze to death in winter? — Meh, you get used to it. Still, the first year I thought I'd freeze on the spot. — And work? Are you still a journalist? — Yes, well, more or less. I write for a travel magazine. Right, and you, tell me everything! Did you get married? — Oops, didn't you know? Yes, to Antoine, your old neighbour! — No! Seriously? Well then, we absolutely have to have a coffee so you can tell me everything." }
  - task: "Your journey from Paris to Québec is over. Write a reflective farewell letter in polished French, looking back on the trip and on your progress, with a wide range of structures (subjonctif, conditionnel passé, connectors, idioms…)."
    min: 150
    max: 220
    use: [w.périple, w.escale, w.maîtrise, w.aboutissement, w.peaufiner]
    useAtLeast: 3
    grammar: [g.c2-review, g.native-fluency-markers]
    expect:
      - { pattern: "\\b(p[eé]riple|voyage|parcours|chemin|escales?|[eé]tapes?)\\b", hint: "Look back on the journey: ce périple, chaque escale…" }
      - { pattern: "\\b(aurais|aurait|aurions|auriez|auraient|serais|serait|serions)\\b|\\bqu(e\\s|['’])[^.!?]{0,30}\\b(soit|soient|ait|aient|puisse|puissent|fasse|fassent|sache|veuille)\\b", hint: "Show your range: a conditionnel passé (je n'aurais jamais cru…) or a subjonctif (bien que…, pour que…)." }
    model: { es: "Chers amis, me voici à Québec, au terme d'un périple qui m'a conduit des quais de Paris aux remparts de la vieille capitale. Je n'aurais jamais cru, en arrivant à Roissy, qu'un jour je comprendrais un Bruxellois parler de drache ou un Montréalais jaser de sa blonde ! Chaque escale m'a appris quelque chose : la rigueur des Suisses, la téranga des Sénégalais, la poésie des Antilles, la fierté des Cadiens. Bien que je sois encore loin d'une maîtrise parfaite, je mesure le chemin parcouru. Il y a quelques mois, le subjonctif me faisait encore peur ; aujourd'hui, j'écris cette lettre sans dictionnaire. Ce voyage n'est pas un aboutissement, mais un début : il me reste à peaufiner mon accent et à lire tous les romans dont vous m'avez parlé. Merci à tous ceux qui m'ont accueilli avec tant de patience. Comme on dit ici : je me souviens. Et moi, je me souviendrai de vous. À la revoyure !", en: "Dear friends, here I am in Québec City, at the end of a journey that has taken me from the quays of Paris to the ramparts of the old capital. I would never have believed, arriving at Roissy, that one day I would understand someone from Brussels talking about drache or a Montrealer chatting about his blonde! Every stop taught me something: Swiss rigour, Senegalese téranga, Caribbean poetry, Cajun pride. Although I am still far from perfect mastery, I can measure how far I have come. A few months ago the subjunctive still scared me; today I am writing this letter without a dictionary. This journey is not an end point but a beginning: I still have to polish my accent and read all the novels you told me about. Thank you to everyone who welcomed me with such patience. As they say here: I remember. And I will remember you. See you around!" }
