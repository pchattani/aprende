level: a1
title: Level check A1
passScore: 0.8
reading:
  text: |
    Je m'appelle Camille, j'ai vingt-huit ans et je suis médecin à Paris. J'habite dans un petit appartement dans le Marais, avec mon chat, Pompon. Mon appartement est au troisième étage. Il est petit, mais il y a une belle vue sur Paris.

    Le matin, je me lève à six heures et demie parce que je commence le travail à huit heures. Je prends un café et du pain avec de la confiture, puis je vais à l'hôpital en métro. Je finis à seize heures. L'après-midi, je fais les courses au marché ou je fais du vélo le long de la Seine.

    Le week-end, je vais chez mes parents. Ils habitent à Lyon, à deux heures de Paris en train. Mon père est professeur de musique et ma mère travaille dans une banque. J'ai aussi un frère, Hugo. Il a vingt ans, il est étudiant et il adore le football. Le dimanche, nous mangeons tous ensemble. En été, il fait chaud à Lyon et nous mangeons dans le jardin.
  questions:
    - { q: "What is Camille's job?", options: ["Teacher", "Doctor", "Student"], answer: 1 }
    - { q: "Why does Camille get up at half past six?", options: ["She goes cycling", "She starts work at eight", "Her cat wakes her up"], answer: 1 }
    - { q: "How does she go to work?", options: ["By bike", "By metro", "On foot"], answer: 1 }
    - { q: "Where do her parents live?", options: ["In the Marais", "In Lyon, two hours from Paris by train", "Near the Seine"], answer: 1 }
    - { q: "What does her brother love?", options: ["Music", "Football", "Cooking"], answer: 1 }
