level: a2
title: Checkpoint A2
passScore: 0.8
reading:
  text: |
    El verano pasado, mi amiga Sofía y yo hicimos un viaje de diez días por el norte de España. Salimos de Madrid en coche un sábado por la mañana y la primera noche dormimos en un albergue de Burgos. Hacía mucho calor y no pudimos dormir bien, pero al día siguiente visitamos la catedral y comimos en un restaurante típico.

    El tercer día llegamos a la costa. Mientras Sofía buscaba el hotel en el móvil, yo conducía por una carretera estrecha con vistas al mar. De repente, el coche empezó a hacer un ruido extraño y tuvimos que parar. Un hombre del pueblo nos ayudó y nos llevó a un taller. Nos dijo que el coche no estaría listo hasta el martes.

    Al final, esos dos días sin coche fueron los mejores del viaje. Nos quedamos en una casa pequeña del pueblo, paseamos por la playa, comimos pescado fresco y conocimos a la gente del lugar. Cuando volvimos a Madrid, estábamos agotadas pero muy contentas. Ya hemos decidido volver el año que viene, esta vez en tren.
  questions:
    - { q: "Why didn't they sleep well the first night?", options: ["The hostel was noisy", "It was very hot", "They arrived very late"], answer: 1 }
    - { q: "What was the narrator doing when the car made a strange noise?", options: ["Looking for the hotel", "Driving along a narrow road", "Sleeping"], answer: 1 }
    - { q: "When would the car be ready?", options: ["The same day", "On Tuesday", "After ten days"], answer: 1 }
    - { q: "How did they feel about the two days without a car?", options: ["They were the worst of the trip", "They were the best of the trip", "They were boring"], answer: 1 }
    - { q: "How do they plan to travel next year?", options: ["By car", "By plane", "By train"], answer: 2 }
