id: c1.u06
title: Studio e lavoro
lessons:
  - id: c1.u06.l1
    title: La tesi di laurea
    teach: [g.academic-register]
    tip: "In a thesis, prefer the impersonal si ritiene, si evince, risulta to io penso; the authorial noi (come vedremo) is fine."
    vocab: [w.accademico, w.relatore, w.correlatore, w.laurea-magistrale, w.laurea-triennale, w.dottorando, w.assegno-di-ricerca, w.tesista, w.discutere-la-tesi, w.voto-di-laurea, w.centodieci-e-lode, w.lode, w.esame-orale, w.appello, w.erasmus, w.borsista, w.cattedra, w.ordinario, w.plagio, w.sessione, w.esclusione]
    sentences:
      - { es: "Il presente lavoro si propone di analizzare il ruolo di Archimede nella cultura siracusana.", en: "This paper aims to analyse the role of Archimedes in Syracusan culture.", altEs: ["La presente tesi si propone di analizzare il ruolo di Archimede nella cultura siracusana.", "Questo lavoro si propone di analizzare il ruolo di Archimede nella cultura di Siracusa."], altEn: ["The present work sets out to analyse the role of Archimedes in Syracusan culture."], grammar: [g.academic-register], vocab: [w.tesi] }
      - { es: "Si ritiene che il teatro greco di Siracusa risalga al V secolo a.C.", en: "The Greek theatre of Syracuse is believed to date back to the 5th century BC.", altEs: ["Si ritiene che il teatro greco di Siracusa risalga al quinto secolo avanti Cristo.", "Si ritiene che il Teatro Greco di Siracusa risalga al V secolo a.C."], altEn: ["It is thought that the Greek theatre of Syracuse dates from the 5th century BC."], grammar: [g.academic-register, g.congiuntivo-opinion], vocab: [w.secolo] }
      - { es: "Penso che questa fonte sia del IV secolo.", en: "I think this source is from the 4th century.", altEs: ["Io penso che questa fonte sia del IV secolo.", "Credo che questa fonte sia del IV secolo."], grammar: [g.academic-register, g.congiuntivo-opinion], vocab: [w.fonte], transform: { instruction: "Rewrite it in academic style, starting with Si ritiene", answer: "Si ritiene che questa fonte sia del IV secolo.", alt: ["Si ritiene che questa fonte risalga al IV secolo."], en: "This source is believed to be from the 4th century." } }
      - { es: "Mi sono laureata con centodieci e lode e ora sono dottoranda a Catania.", en: "I graduated with 110 cum laude and now I'm a PhD student in Catania.", altEs: ["Mi sono laureata con 110 e lode e ora sono dottoranda a Catania.", "Mi sono laureata con centodieci e lode e adesso faccio il dottorato a Catania."], altEn: ["I got a first-class degree with honours and I'm now doing a PhD in Catania."], grammar: [g.academic-register, g.passato-prossimo-essere], vocab: [w.centodieci-e-lode, w.dottorando], error: { wrong: "Mi sono laureata con centodieci con lode e ora sono dottoranda a Catania.", explain: "The fixed formula is centodieci e lode, with e: 110 and honours.", grammar: g.academic-register } }
      - { es: "Dopo la laurea triennale a Siracusa, ho scelto una laurea magistrale in archeologia.", en: "After my bachelor's degree in Syracuse, I chose a master's in archaeology.", altEs: ["Dopo la triennale a Siracusa, ho scelto una magistrale in archeologia."], grammar: [g.academic-register], vocab: [w.laurea-triennale, w.laurea-magistrale] }
      - { es: "La mia relatrice è professoressa ordinaria di letteratura greca.", en: "My supervisor is a full professor of Greek literature.", altEs: ["La mia relatrice è ordinaria di letteratura greca."], grammar: [g.academic-register], vocab: [w.relatore, w.ordinario] }
      - { es: "Chi è il correlatore della tua tesi?", en: "Who is the co-supervisor of your thesis?", altEs: ["Chi è il correlatore della tesi?", "Chi ti fa da correlatore?"], altEn: ["Who's your second supervisor?"], grammar: [g.academic-register, g.word-order-marked], vocab: [w.correlatore] }
      - { es: "Discuto la tesi a luglio, nella sessione estiva.", en: "I'm defending my thesis in July, in the summer session.", altEs: ["Discuterò la tesi a luglio, nella sessione estiva.", "A luglio discuto la tesi, nella sessione estiva."], grammar: [g.present-for-future], vocab: [w.discutere-la-tesi] }
      - { es: "Non ho superato l'esame orale e mi sono iscritto all'appello di settembre.", en: "I didn't pass the oral exam and I've signed up for the September session.", altEs: ["Non ho passato l'esame orale e mi sono iscritto all'appello di settembre.", "Non ho superato l'orale e mi sono iscritta all'appello di settembre."], grammar: [g.passato-prossimo-essere], vocab: [w.esame-orale, w.appello] }
      - { es: "Si tratta di un fenomeno ancora poco studiato in ambito accademico.", en: "It is a phenomenon still little studied in academic circles.", altEs: ["Si tratta di un fenomeno ancora poco studiato in ambito universitario."], grammar: [g.academic-register], vocab: [w.accademico] }
      - { es: "Il plagio, anche parziale, comporta l'esclusione dalla sessione di laurea.", en: "Plagiarism, even partial, means exclusion from the graduation session.", altEs: ["Il plagio, anche solo parziale, comporta l'esclusione dalla sessione di laurea."], grammar: [g.academic-register, g.nominalization], vocab: [w.plagio] }
      - { es: "Ho fatto l'Erasmus a Salamanca e lì ho raccolto i dati per la tesi.", en: "I did my Erasmus in Salamanca and collected the data for my thesis there.", altEs: ["Ho fatto l'Erasmus a Salamanca, dove ho raccolto i dati per la tesi."], grammar: [g.passato-prossimo-avere], vocab: [w.erasmus] }
      - { es: "Ha vinto un assegno di ricerca di due anni presso l'Università di Catania.", en: "She won a two-year research grant at the University of Catania.", altEs: ["Ha ottenuto un assegno di ricerca biennale presso l'Università di Catania."], grammar: [g.academic-register], vocab: [w.assegno-di-ricerca] }
      - { es: "Come borsista, non posso accettare altri incarichi retribuiti.", en: "As a grant holder, I can't accept other paid posts.", altEs: ["In quanto borsista, non posso accettare altri incarichi retribuiti."], grammar: [g.potere-dovere], vocab: [w.borsista, w.incarico, w.retribuito] }
      - { es: "Dopo vent'anni di ricerca, ha finalmente ottenuto la cattedra.", en: "After twenty years of research, she finally got the chair.", altEs: ["Dopo vent'anni di ricerca ha finalmente avuto la cattedra."], altEn: ["After twenty years of research, she was finally made professor."], grammar: [g.passato-prossimo-avere], vocab: [w.cattedra] }
      - { es: "Come vedremo nel secondo capitolo, i dati sono ancora parziali.", en: "As we shall see in the second chapter, the data are still incomplete.", altEs: ["Come vedremo nel capitolo secondo, i dati sono ancora parziali."], grammar: [g.academic-register], vocab: [w.capitolo], transform: { instruction: "Make it impersonal: replace vedremo with si vedrà", answer: "Come si vedrà nel secondo capitolo, i dati sono ancora parziali.", alt: ["Come si vedrà nel capitolo secondo, i dati sono ancora parziali."], en: "As will be seen in the second chapter, the data are still incomplete." } }
    exchanges:
      - q: { es: "Con chi fai la tesi?", en: "Who are you doing your thesis with?" }
        a: { es: "Con la professoressa Lombardo; il correlatore è un ricercatore di Catania.", en: "With Professor Lombardo; the co-supervisor is a researcher from Catania." }
        alt: ["Con la professoressa Lombardo.", "La mia relatrice è la professoressa Lombardo."]
        grammar: [g.academic-register]
        vocab: [w.relatore, w.correlatore]
      - q: { es: "Com'è andato l'esame orale?", en: "How did the oral exam go?" }
        a: { es: "Benissimo: ho preso trenta e lode!", en: "Really well: I got top marks with honours!" }
        alt: ["Bene, trenta e lode.", "Male, lo ripeto all'appello di settembre."]
        grammar: [g.passato-prossimo-avere]
        vocab: [w.esame-orale, w.lode]
      - q: { es: "Che voto di laurea hai preso?", en: "What degree mark did you get?" }
        a: { es: "Centodieci e lode, ma la discussione è stata durissima.", en: "110 cum laude, but the defence was really tough." }
        alt: ["Centodieci e lode.", "Centocinque: non mi lamento."]
        grammar: [g.passato-prossimo-avere]
        vocab: [w.voto-di-laurea, w.centodieci-e-lode]
      - q: { es: "Che cosa farai dopo la laurea magistrale?", en: "What will you do after your master's?" }
        a: { es: "Vorrei fare il dottorato, ma prima devo vincere una borsa.", en: "I'd like to do a PhD, but first I have to win a grant." }
        alt: ["Il dottorato, spero.", "Cercherò lavoro all'estero."]
        grammar: [g.futuro-semplice, g.condizionale-courtesy]
        vocab: [w.laurea-magistrale]
      - q: { es: "Quanti tesisti segue la tua relatrice?", en: "How many thesis students does your supervisor have?" }
        a: { es: "Una ventina, per questo risponde alle mail con due settimane di ritardo.", en: "About twenty, which is why she answers emails two weeks late." }
        alt: ["Una ventina.", "Troppi: non ha mai tempo."]
        grammar: [g.academic-register]
        vocab: [w.tesista, w.relatore]
    texts:
      - title: "Abstract"
        es: ["Il presente lavoro si propone di ricostruire la storia del Teatro Greco di Siracusa.", "Dall'analisi delle fonti si evince che l'edificio fu ampliato più volte.", "Come vedremo, resta da chiarire quando sia stata costruita la parte più antica."]
        en: ["This paper aims to reconstruct the history of the Greek Theatre of Syracuse.", "Analysis of the sources shows that the building was enlarged several times.", "As we shall see, it remains to be clarified when the oldest part was built."]
        grammar: [g.academic-register]
        vocab: [w.fonte]
      - title: "Avviso agli studenti"
        es: ["Le sedute di laurea si terranno dal 14 al 18 luglio.", "I tesisti devono consegnare la tesi entro il 20 giugno.", "Si ricorda che il plagio comporta l'esclusione dalla sessione."]
        en: ["Graduation sessions will be held from 14 to 18 July.", "Thesis students must hand in their thesis by 20 June.", "Please note that plagiarism results in exclusion from the session."]
        grammar: [g.academic-register, g.si-impersonale]
        vocab: [w.tesista, w.plagio]
    spicy:
      - { es: "Dai dati raccolti si evince che, quando entri in biblioteca, nessuno riesce più a concentrarsi.", en: "The data collected show that when you walk into the library, nobody can concentrate any more.", altEs: ["Dai dati si evince che, quando entri in biblioteca, nessuno riesce più a concentrarsi."], grammar: [g.academic-register], vocab: [] }
      - { es: "Si ritiene che il dottorando del terzo piano studi fino a tardi solo per incontrarti alla macchinetta del caffè.", en: "It is believed that the PhD student on the third floor studies late only to bump into you at the coffee machine.", altEs: ["Si ritiene che il dottorando del terzo piano resti fino a tardi solo per incontrarti alla macchinetta del caffè."], grammar: [g.academic-register, g.congiuntivo-opinion], vocab: [w.dottorando] }
      - { es: "Resta da chiarire se tu mi abbia invitata a cena per la tesi o per me.", en: "It remains to be clarified whether you invited me to dinner for the thesis or for me.", altEs: ["Resta da chiarire se tu mi abbia invitato a cena per la tesi o per me."], grammar: [g.academic-register, g.congiuntivo-passato], vocab: [] }
      - { es: "Centodieci e lode alla tesi, e trenta e lode al tuo sorriso.", en: "110 cum laude for the thesis, and top marks for your smile.", altEs: ["Centodieci e lode alla tua tesi, e trenta e lode al tuo sorriso."], grammar: [g.academic-register], vocab: [w.centodieci-e-lode, w.lode] }
      - { es: "Come vedremo nel prossimo capitolo, il correlatore non era interessato soltanto alla mia bibliografia.", en: "As we shall see in the next chapter, the co-supervisor wasn't only interested in my bibliography.", altEs: ["Come vedremo nel prossimo capitolo, il correlatore non era interessato solo alla mia bibliografia."], grammar: [g.academic-register], vocab: [w.correlatore] }
  - id: c1.u06.l2
    title: Metodo e risultati
    teach: [g.academic-register, g.nominalization]
    tip: "Research writing packs actions into nouns: l'elaborazione dei dati, la raccolta dei questionari, il calo delle iscrizioni."
    vocab: [w.rivista-scientifica, w.revisione-paritaria, w.metodologia, w.campione, w.questionario, w.variabile, w.correlazione, w.verificare, w.dedurre, w.deduzione, w.sintetizzare, w.elaborare, w.elaborazione, w.ricercare, w.ricerca-scientifica, w.seminario, w.pubblicazione]
    sentences:
      - { es: "L'elaborazione dei dati ha richiesto sei mesi.", en: "Processing the data took six months.", altEs: ["L'elaborazione dei dati è durata sei mesi.", "Per l'elaborazione dei dati ci sono voluti sei mesi."], grammar: [g.nominalization], vocab: [w.elaborazione] }
      - { es: "La raccolta dei questionari si è conclusa a marzo.", en: "The collection of the questionnaires was completed in March.", altEs: ["La raccolta dei questionari è terminata a marzo."], grammar: [g.nominalization], vocab: [w.questionario] }
      - { es: "Il campione è composto da trecento studenti siracusani.", en: "The sample consists of three hundred Syracusan students.", altEs: ["Il campione è formato da trecento studenti siracusani.", "Il campione comprende trecento studenti di Siracusa."], grammar: [g.academic-register], vocab: [w.campione] }
      - { es: "Dall'analisi dei dati emerge una forte correlazione tra le due variabili.", en: "The analysis of the data reveals a strong correlation between the two variables.", altEs: ["Dall'analisi dei dati si evince una forte correlazione tra le due variabili.", "Dall'analisi dei dati emerge una forte correlazione fra le due variabili."], grammar: [g.academic-register, g.nominalization], vocab: [w.correlazione, w.variabile] }
      - { es: "Prima della pubblicazione, ogni articolo è sottoposto a revisione paritaria.", en: "Before publication, every article undergoes peer review.", altEs: ["Prima di essere pubblicato, ogni articolo è sottoposto a revisione paritaria."], grammar: [g.nominalization, g.passive-essere], vocab: [w.revisione-paritaria] }
      - { es: "Verificare un'ipotesi richiede una metodologia rigorosa.", en: "Testing a hypothesis requires a rigorous methodology.", altEs: ["La verifica di un'ipotesi richiede una metodologia rigorosa."], grammar: [g.academic-register, g.nominalization], vocab: [w.verificare, w.metodologia], transform: { instruction: "Replace the infinitive Verificare with the noun La verifica di", answer: "La verifica di un'ipotesi richiede una metodologia rigorosa.", alt: [], en: "The testing of a hypothesis requires a rigorous methodology." } }
      - { es: "Dai risultati si può dedurre che il questionario era troppo lungo.", en: "From the results one can deduce that the questionnaire was too long.", altEs: ["Dai risultati si deduce che il questionario era troppo lungo."], grammar: [g.academic-register], vocab: [w.dedurre, w.questionario] }
      - { es: "La sua deduzione è logica, ma i dati non la confermano.", en: "Her deduction is logical, but the data don't confirm it.", altEs: ["La deduzione è logica, ma i dati non la confermano."], altEn: ["His deduction is logical, but the data don't support it."], grammar: [g.direct-object-pronouns], vocab: [w.deduzione] }
      - { es: "Mi sintetizzi l'articolo in dieci righe?", en: "Can you summarise the article for me in ten lines?", altEs: ["Puoi sintetizzarmi l'articolo in dieci righe?", "Mi riassumi l'articolo in dieci righe?"], grammar: [g.indirect-object-pronouns], vocab: [w.sintetizzare] }
      - { es: "Il gruppo ha elaborato un modello per prevedere l'erosione della costa di Ortigia.", en: "The group has developed a model to predict erosion of the Ortigia coastline.", altEs: ["Il gruppo di ricerca ha elaborato un modello per prevedere l'erosione della costa di Ortigia."], grammar: [g.passato-prossimo-avere], vocab: [w.elaborare, w.erosione] }
      - { es: "Hanno pubblicato i risultati su una rivista scientifica internazionale.", en: "They published the results in an international academic journal.", altEs: ["I risultati sono stati pubblicati su una rivista scientifica internazionale."], grammar: [g.passato-prossimo-avere], vocab: [w.rivista-scientifica] }
      - { es: "Al seminario di giovedì si parlerà della ricerca scientifica nel Mezzogiorno.", en: "At Thursday's seminar the topic will be scientific research in the South.", altEs: ["Al seminario di giovedì si parlerà di ricerca scientifica nel Mezzogiorno."], grammar: [g.si-impersonale], vocab: [w.seminario, w.ricerca-scientifica] }
      - { es: "Si tratta di ricercare le cause, non soltanto di descrivere il fenomeno.", en: "It is a matter of seeking the causes, not just describing the phenomenon.", altEs: ["Si tratta di ricercare le cause, non solo di descrivere il fenomeno."], grammar: [g.academic-register], vocab: [w.ricercare] }
      - { es: "Il comune ha chiuso il porto per tre giorni.", en: "The town council closed the port for three days.", grammar: [g.nominalization], vocab: [w.porto], transform: { instruction: "Turn it into a headline-style noun phrase", answer: "Chiusura del porto per tre giorni.", alt: ["Porto chiuso per tre giorni."], en: "Port closed for three days." } }
      - { es: "Il calo delle iscrizioni preoccupa i ricercatori.", en: "The fall in enrolments worries the researchers.", altEs: ["Il calo degli iscritti preoccupa i ricercatori."], grammar: [g.nominalization], vocab: [w.calo], error: { wrong: "La cala delle iscrizioni preoccupa i ricercatori.", explain: "The noun from calare is the short masculine il calo.", grammar: g.nominalization } }
    exchanges:
      - q: { es: "Quante persone hai intervistato?", en: "How many people did you interview?" }
        a: { es: "Il campione è di duecento persone, tutte residenti a Ortigia.", en: "The sample is two hundred people, all living in Ortigia." }
        alt: ["Duecento, tutte di Ortigia.", "Il campione è di duecento persone."]
        grammar: [g.academic-register]
        vocab: [w.campione]
      - q: { es: "Hai già verificato i dati?", en: "Have you checked the data yet?" }
        a: { es: "Sì, e la correlazione è confermata.", en: "Yes, and the correlation is confirmed." }
        alt: ["Sì, li ho verificati ieri.", "Non ancora, li verifico domani."]
        grammar: [g.gia-ancora-mai]
        vocab: [w.verificare, w.correlazione]
      - q: { es: "Dove pubblicherete l'articolo?", en: "Where will you publish the article?" }
        a: { es: "Su una rivista scientifica con revisione paritaria, se lo accettano.", en: "In a peer-reviewed academic journal, if they accept it." }
        alt: ["Su una rivista internazionale.", "Non lo sappiamo ancora."]
        grammar: [g.futuro-semplice]
        vocab: [w.rivista-scientifica, w.revisione-paritaria]
      - q: { es: "Mi fai un riassunto del seminario?", en: "Can you give me a summary of the seminar?" }
        a: { es: "In sintesi: più ricerca, meno burocrazia.", en: "In short: more research, less red tape." }
        alt: ["Te lo sintetizzo in due parole: più fondi.", "In sintesi, niente di nuovo."]
        grammar: [g.nominalization]
        vocab: [w.seminario, w.sintetizzare]
      - q: { es: "Quanto tempo ci vuole per l'elaborazione dei questionari?", en: "How long does processing the questionnaires take?" }
        a: { es: "Almeno un mese, perché sono tutti cartacei.", en: "At least a month, because they're all on paper." }
        alt: ["Almeno un mese.", "Un paio di settimane."]
        grammar: [g.metterci-volerci, g.nominalization]
        vocab: [w.elaborazione, w.questionario]
    texts:
      - title: "Risultati"
        es: ["Dall'elaborazione dei questionari emergono due dati.", "Il primo è l'aumento dell'uso dei mezzi pubblici.", "Il secondo è il calo, meno atteso, degli spostamenti in auto."]
        en: ["Two findings emerge from the processing of the questionnaires.", "The first is the increase in the use of public transport.", "The second is the less expected drop in car journeys."]
        grammar: [g.nominalization]
        vocab: [w.elaborazione, w.questionario, w.calo]
      - title: "Avviso di seminario"
        es: ["Seminario di metodologia della ricerca.", "Giovedì 12, ore 15, aula 3.", "Partecipazione libera fino a esaurimento dei posti."]
        en: ["Seminar on research methodology.", "Thursday the 12th, 3 p.m., room 3.", "Free entry until all seats are taken."]
        grammar: [g.nominalization]
        vocab: [w.seminario, w.metodologia]
    spicy:
      - { es: "Il campione è piccolo, ma la correlazione tra il tuo sorriso e il mio buonumore è evidente.", en: "The sample is small, but the correlation between your smile and my good mood is obvious.", altEs: ["Il campione è ridotto, ma la correlazione tra il tuo sorriso e il mio buonumore è evidente."], grammar: [g.academic-register], vocab: [w.campione, w.correlazione] }
      - { es: "Ho verificato l'ipotesi tre volte: ogni volta che mi guardi, dimentico la metodologia.", en: "I've tested the hypothesis three times: every time you look at me, I forget the methodology.", grammar: [g.academic-register], vocab: [w.verificare, w.metodologia] }
      - { es: "Elaborazione dei dati: rimandata. Motivo: cena in Ortigia con il correlatore.", en: "Data processing: postponed. Reason: dinner in Ortigia with the co-supervisor.", altEs: ["Elaborazione dei dati rimandata. Motivo: cena in Ortigia con il correlatore."], grammar: [g.nominalization], vocab: [w.elaborazione, w.correlatore] }
      - { es: "Sintetizzami il tuo numero di telefono in dieci cifre, grazie.", en: "Summarise your phone number for me in ten digits, thanks.", altEs: ["Mi sintetizzi il tuo numero di telefono in dieci cifre, grazie?"], grammar: [g.imperativo-pronouns], vocab: [w.sintetizzare] }
      - { es: "Questionario anonimo: da uno a dieci, quanto ti piacerebbe un aperitivo dopo il seminario?", en: "Anonymous questionnaire: from one to ten, how much would you like an aperitivo after the seminar?", grammar: [g.condizionale-presente], vocab: [w.questionario, w.seminario] }
  - id: c1.u06.l3
    title: Riunioni, verbali e mail
    teach: [g.nominalization]
    tip: "Subject lines, agendas and minutes are nominal: Rinvio della riunione, Approvazione del verbale. In the body of a formal email, keep Lei and its capital letters consistent."
    vocab: [w.redigere, w.redatto, w.stesura, w.ordine-del-giorno, w.verbale, w.mansione, w.incarico, w.carica, w.qualifica, w.referenze, w.consulente, w.consulenza, w.collaborare, w.collaborazione, w.collaboratore, w.lavoro-di-squadra, w.leadership, w.professionale, w.professionalità, w.retribuito, w.aziendale, w.esterno, w.affidare, w.ricoprire, w.rientrare, w.eccezione]
    sentences:
      - { es: "Gentile dottoressa, Le scrivo in merito alla posizione di consulente pubblicata sul vostro sito.", en: "Dear Dr ..., I am writing regarding the consultant position posted on your website.", altEs: ["Gentile dottoressa, Le scrivo riguardo alla posizione di consulente pubblicata sul vostro sito."], grammar: [g.formal-letters, g.lei-forms], vocab: [w.consulente] }
      - { es: "In allegato trova il mio curriculum e due lettere di referenze.", en: "Please find attached my CV and two letters of reference.", altEs: ["In allegato Le invio il mio curriculum e due lettere di referenze.", "Le allego il mio curriculum e due lettere di referenze."], grammar: [g.formal-letters], vocab: [w.referenze] }
      - { es: "Primo punto all'ordine del giorno: approvazione del verbale della seduta precedente.", en: "First item on the agenda: approval of the minutes of the previous meeting.", grammar: [g.nominalization], vocab: [w.ordine-del-giorno, w.verbale] }
      - { es: "Chi si occupa della stesura del verbale?", en: "Who's taking care of drafting the minutes?", altEs: ["Chi redige il verbale?", "Chi si occupa di redigere il verbale?"], grammar: [g.nominalization], vocab: [w.stesura, w.verbale] }
      - { es: "Il verbale va redatto entro tre giorni dalla riunione.", en: "The minutes must be drawn up within three days of the meeting.", altEs: ["Il verbale deve essere redatto entro tre giorni dalla riunione."], grammar: [g.passive-andare], vocab: [w.redatto, w.redigere] }
      - { es: "La stesura del contratto è stata affidata a un consulente esterno.", en: "The drafting of the contract was entrusted to an outside consultant.", altEs: ["La stesura del contratto è stata affidata a una consulente esterna."], grammar: [g.nominalization, g.passive-essere], vocab: [w.stesura, w.consulente] }
      - { es: "Tra le mie mansioni rientrano la gestione dei fornitori e i rapporti con la clientela.", en: "My duties include managing suppliers and dealing with clients.", grammar: [g.nominalization], vocab: [w.mansione, w.fornitore, w.clientela] }
      - { es: "Ha ricoperto la carica di direttrice per dieci anni.", en: "She held the post of director for ten years.", altEs: ["Per dieci anni ha ricoperto la carica di direttrice."], grammar: [g.passato-prossimo-avere], vocab: [w.carica] }
      - { es: "Mi hanno affidato un incarico di sei mesi presso la filiale di Siracusa.", en: "They've given me a six-month assignment at the Syracuse branch.", altEs: ["Mi è stato affidato un incarico di sei mesi presso la filiale di Siracusa."], grammar: [g.passato-prossimo-avere], vocab: [w.incarico, w.filiale] }
      - { es: "Nella nostra azienda il lavoro di squadra conta più della leadership di una sola persona.", en: "In our company teamwork counts for more than one person's leadership.", altEs: ["Da noi il lavoro di squadra conta più della leadership di una sola persona."], grammar: [g.comparatives], vocab: [w.lavoro-di-squadra, w.leadership] }
      - { es: "Cerchiamo collaboratori con una qualifica professionale nel settore turistico.", en: "We're looking for collaborators with a professional qualification in the tourism sector.", altEs: ["Cerchiamo collaboratrici e collaboratori con una qualifica professionale nel settore turistico."], grammar: [g.present-are], vocab: [w.collaboratore, w.qualifica, w.professionale] }
      - { es: "Lo stage è retribuito o è solo un rimborso spese?", en: "Is the internship paid or is it just expenses?", altEs: ["È uno stage retribuito o c'è solo un rimborso spese?"], grammar: [g.question-words], vocab: [w.retribuito, w.stage] }
      - { es: "La collaborazione tra l'università e le aziende locali è ormai indispensabile.", en: "Collaboration between the university and local companies is now essential.", altEs: ["Ormai la collaborazione tra l'università e le aziende locali è indispensabile."], grammar: [g.nominalization], vocab: [w.collaborazione] }
      - { es: "Abbiamo deciso di rinviare la riunione.", en: "We have decided to postpone the meeting.", altEs: ["Abbiamo deciso di rimandare la riunione."], grammar: [g.nominalization], vocab: [w.riunione], transform: { instruction: "Write it as an email subject line (nominal style)", answer: "Rinvio della riunione.", alt: ["Rinvio riunione.", "Riunione rinviata."], en: "Meeting postponed." } }
      - { es: "Quando consegnerà il progetto, invii anche il verbale.", en: "When you hand in the project, send the minutes too.", grammar: [g.nominalization, g.imperativo-lei], vocab: [w.verbale], transform: { instruction: "Replace the clause with Alla + noun", answer: "Alla consegna del progetto, invii anche il verbale.", alt: ["Al momento della consegna del progetto, invii anche il verbale."], en: "On delivery of the project, send the minutes too." } }
      - { es: "La ringrazio per la Sua professionalità e per la collaborazione.", en: "Thank you for your professionalism and your cooperation.", altEs: ["La ringrazio della Sua professionalità e della collaborazione."], grammar: [g.lei-forms, g.formal-letters], vocab: [w.professionalità, w.collaborazione], error: { wrong: "Ti ringrazio per la Sua professionalità e per la collaborazione.", explain: "A formal letter keeps Lei throughout: La ringrazio … la Sua.", grammar: g.lei-forms } }
    exchanges:
      - q: { es: "Chi redige il verbale oggi?", en: "Who's drawing up the minutes today?" }
        a: { es: "Lo redigo io, ma qualcuno deve rileggere la stesura.", en: "I'll do it, but someone needs to reread the draft." }
        alt: ["Lo redigo io.", "Tocca a Marco, credo."]
        grammar: [g.direct-object-pronouns]
        vocab: [w.redigere, w.stesura]
      - q: { es: "Di che cosa si occupa esattamente?", en: "What exactly do you do?" }
        a: { es: "Sono consulente: offro consulenza alle aziende che vogliono esportare.", en: "I'm a consultant: I advise companies that want to export." }
        alt: ["Faccio consulenza per le aziende.", "Mi occupo di consulenza aziendale."]
        grammar: [g.lei-forms]
        vocab: [w.consulente, w.consulenza, w.aziendale]
      - q: { es: "Quali sono le Sue mansioni attuali?", en: "What are your current duties?" }
        a: { es: "Coordino cinque collaboratori e curo i rapporti con i fornitori.", en: "I coordinate five collaborators and look after relations with suppliers." }
        alt: ["Coordino un piccolo gruppo.", "Mi occupo dei fornitori."]
        grammar: [g.lei-forms]
        vocab: [w.mansione, w.collaboratore]
      - q: { es: "Ha delle referenze?", en: "Do you have references?" }
        a: { es: "Sì, posso fornirLe i contatti di due ex responsabili.", en: "Yes, I can give you the contact details of two former managers." }
        alt: ["Sì, certo.", "Sì, le ho allegate al curriculum."]
        grammar: [g.lei-forms]
        vocab: [w.referenze]
      - q: { es: "È un incarico retribuito?", en: "Is it a paid post?" }
        a: { es: "Sì, ma solo per i primi tre mesi; poi si vedrà.", en: "Yes, but only for the first three months; then we'll see." }
        alt: ["Sì.", "No, purtroppo è volontariato."]
        grammar: [g.si-impersonale]
        vocab: [w.incarico, w.retribuito]
    texts:
      - title: "Mail di candidatura"
        es: ["Gentile dottor Russo,", "Le scrivo in merito alla collaborazione di cui abbiamo parlato al telefono.", "In allegato trova la mia proposta e le referenze richieste.", "Cordiali saluti, Benedetta Grasso"]
        en: ["Dear Mr Russo,", "I am writing regarding the collaboration we discussed on the phone.", "Please find attached my proposal and the references requested.", "Kind regards, Benedetta Grasso"]
        grammar: [g.formal-letters, g.lei-forms]
        vocab: [w.collaborazione, w.referenze]
      - title: "Verbale"
        es: ["Verbale della riunione del 3 marzo.", "Presenti: il consiglio di amministrazione e due consulenti esterni.", "Ordine del giorno: approvazione del bilancio e nomina del nuovo responsabile."]
        en: ["Minutes of the meeting of 3 March.", "Present: the board of directors and two external consultants.", "Agenda: approval of the accounts and appointment of the new manager."]
        grammar: [g.nominalization]
        vocab: [w.verbale, w.ordine-del-giorno, w.consulente]
    spicy:
      - { es: "Oggetto: richiesta di consulenza urgente. Motivo: non so cosa mettermi stasera.", en: "Subject: urgent request for advice. Reason: I don't know what to wear tonight.", altEs: ["Oggetto: richiesta urgente di consulenza. Motivo: non so cosa mettermi stasera."], grammar: [g.nominalization], vocab: [w.consulenza] }
      - { es: "Tra le mie mansioni non rientra preparare il caffè al capo, ma per te faccio un'eccezione.", en: "Making the boss's coffee isn't one of my duties, but for you I'll make an exception.", grammar: [g.nominalization], vocab: [w.mansione] }
      - { es: "Ordine del giorno: aperitivo, cena, passeggiata in Ortigia. Varie ed eventuali: vedremo.", en: "Agenda: aperitivo, dinner, a stroll in Ortigia. Any other business: we'll see.", grammar: [g.nominalization], vocab: [w.ordine-del-giorno] }
      - { es: "Il verbale dirà che abbiamo lavorato fino a tardi; il verbale non dirà tutto.", en: "The minutes will say we worked late; the minutes won't tell the whole story.", grammar: [g.futuro-semplice], vocab: [w.verbale] }
      - { es: "Lavoro di squadra perfetto: tu scegli il ristorante, io scelgo il dolce.", en: "Perfect teamwork: you pick the restaurant, I pick the dessert.", grammar: [g.nominalization], vocab: [w.lavoro-di-squadra] }
  - id: c1.u06.l4
    title: Al convegno
    teach: [g.presentations]
    tip: "Signpost every step: Oggi vorrei parlarvi di…, Passo ora a…, Come potete vedere…, Per concludere… Speak to the room as voi."
    vocab: [w.convegno, w.congresso, w.presentazione, w.fatturato, w.profitto, w.perdita, w.utile.n, w.azionista, w.socio, w.consiglio-di-amministrazione, w.amministratore-delegato, w.multinazionale, w.filiale, w.clientela, w.fornitore, w.appalto, w.gara-dappalto, w.concorrenza, w.concorrente, w.fusione, w.acquisizione, w.espansione, w.domanda-e-offerta, w.competitivo, w.breve, w.trimestre, w.trasparenza, w.rettore, w.culturale]
    sentences:
      - { es: "Buongiorno a tutti e grazie di essere qui a Siracusa per questo convegno.", en: "Good morning everyone and thank you for being here in Syracuse for this conference.", altEs: ["Buongiorno a tutti e grazie per essere qui a Siracusa per questo convegno."], grammar: [g.presentations], vocab: [w.convegno] }
      - { es: "Oggi vorrei parlarvi del turismo culturale in Ortigia.", en: "Today I'd like to talk to you about cultural tourism in Ortigia.", altEs: ["Oggi vi vorrei parlare del turismo culturale in Ortigia."], grammar: [g.presentations, g.condizionale-courtesy], vocab: [w.turismo] }
      - { es: "La presentazione si articola in tre parti.", en: "The presentation is divided into three parts.", altEs: ["La mia presentazione si articola in tre parti.", "La presentazione è divisa in tre parti."], grammar: [g.presentations], vocab: [w.presentazione] }
      - { es: "In primo luogo analizzeremo il fatturato, in seguito i profitti e infine le prospettive di espansione.", en: "First we'll analyse turnover, then profits and finally the prospects for expansion.", altEs: ["Innanzitutto analizzeremo il fatturato, poi i profitti e infine le prospettive di espansione."], grammar: [g.presentations], vocab: [w.fatturato, w.profitto, w.espansione] }
      - { es: "Guardate il grafico: nel 2024 l'azienda ha chiuso con un utile di due milioni.", en: "Look at the graph: in 2024 the company closed with a profit of two million.", grammar: [g.presentations], vocab: [w.utile.n], transform: { instruction: "Rephrase with Come potete vedere dal grafico", answer: "Come potete vedere dal grafico, nel 2024 l'azienda ha chiuso con un utile di due milioni.", alt: ["Come vedete dal grafico, nel 2024 l'azienda ha chiuso con un utile di due milioni."], en: "As you can see from the graph, in 2024 the company closed with a profit of two million." } }
      - { es: "Passo ora al secondo punto: la concorrenza delle multinazionali.", en: "I'll now move on to the second point: competition from multinationals.", altEs: ["Veniamo adesso al secondo punto: la concorrenza delle multinazionali."], grammar: [g.presentations], vocab: [w.concorrenza, w.multinazionale] }
      - { es: "Apro una breve parentesi sulla fusione dell'anno scorso.", en: "Let me open a brief aside on last year's merger.", altEs: ["Apro una piccola parentesi sulla fusione dell'anno scorso."], grammar: [g.presentations], vocab: [w.fusione] }
      - { es: "Adesso parlo dei soci e degli azionisti.", en: "Now I'll talk about the partners and the shareholders.", altEs: ["Ora parlo dei soci e degli azionisti."], grammar: [g.presentations], vocab: [w.socio, w.azionista], transform: { instruction: "Make it a presentation signpost with Passo ora a", answer: "Passo ora ai soci e agli azionisti.", alt: ["Passo adesso ai soci e agli azionisti.", "Veniamo ora ai soci e agli azionisti."], en: "I'll now move on to the partners and the shareholders." } }
      - { es: "Vorrei sottolineare che le perdite del primo trimestre sono state recuperate.", en: "I'd like to stress that the losses of the first quarter have been recovered.", altEs: ["Vorrei sottolineare che abbiamo recuperato le perdite del primo trimestre."], grammar: [g.presentations, g.passive-essere], vocab: [w.perdita] }
      - { es: "Per concludere, la filiale di Siracusa è oggi la più competitiva del gruppo.", en: "To conclude, the Syracuse branch is now the most competitive in the group.", altEs: ["In conclusione, la filiale di Siracusa è oggi la più competitiva del gruppo."], grammar: [g.presentations, g.superlatives], vocab: [w.filiale, w.competitivo] }
      - { es: "Vi ringrazio per l'attenzione: sono a vostra disposizione per eventuali domande.", en: "Thank you for your attention: I'm happy to answer any questions.", altEs: ["Grazie per l'attenzione: sono a disposizione per eventuali domande."], grammar: [g.presentations], vocab: [] }
      - { es: "Abbiamo vinto la gara d'appalto per il restauro del porto.", en: "We won the tender for the restoration of the port.", altEs: ["Ci siamo aggiudicati l'appalto per il restauro del porto."], grammar: [g.passato-prossimo-avere], vocab: [w.gara-dappalto, w.appalto] }
      - { es: "Il consiglio di amministrazione ha approvato l'acquisizione di un fornitore locale.", en: "The board of directors has approved the acquisition of a local supplier.", grammar: [g.nominalization], vocab: [w.consiglio-di-amministrazione, w.acquisizione, w.fornitore] }
      - { es: "Gli azionisti chiedono all'amministratore delegato più trasparenza.", en: "The shareholders are asking the CEO for more transparency.", altEs: ["Gli azionisti chiedono più trasparenza all'amministratore delegato."], grammar: [g.word-order-marked], vocab: [w.azionista, w.amministratore-delegato] }
      - { es: "Chi è il vostro principale concorrente in Sicilia?", en: "Who is your main competitor in Sicily?", altEs: ["Qual è il vostro principale concorrente in Sicilia?"], grammar: [g.question-words], vocab: [w.concorrente] }
      - { es: "Oggi vorrei parlarvi della domanda e dell'offerta nel settore turistico.", en: "Today I'd like to talk to you about supply and demand in the tourism sector.", altEs: ["Oggi vi vorrei parlare della domanda e dell'offerta nel settore turistico."], grammar: [g.presentations], vocab: [w.domanda-e-offerta], error: { wrong: "Oggi vorrei parlarti della domanda e dell'offerta nel settore turistico.", explain: "Addressing an audience, use voi: parlarvi.", grammar: g.presentations } }
    exchanges:
      - q: { es: "Di che cosa parlerà nella sua presentazione?", en: "What will you talk about in your presentation?" }
        a: { es: "Della fusione tra due aziende siciliane e delle conseguenze per la clientela.", en: "About the merger between two Sicilian companies and the consequences for customers." }
        alt: ["Della fusione tra due aziende siciliane.", "Di turismo e di concorrenza."]
        grammar: [g.presentations, g.futuro-semplice]
        vocab: [w.presentazione, w.fusione]
      - q: { es: "Quando si tiene il congresso?", en: "When is the congress being held?" }
        a: { es: "Dal 3 al 5 ottobre, in un palazzo di Ortigia.", en: "From 3 to 5 October, in a palazzo in Ortigia." }
        alt: ["A ottobre, in Ortigia.", "Dal 3 al 5 ottobre."]
        grammar: [g.si-impersonale]
        vocab: [w.congresso]
      - q: { es: "Scusi, potrebbe tornare alla slide precedente?", en: "Excuse me, could you go back to the previous slide?" }
        a: { es: "Certo. Come vedete, il fatturato è cresciuto del dieci per cento.", en: "Of course. As you can see, turnover grew by ten per cent." }
        alt: ["Certo, eccola.", "Volentieri: come vedete, il fatturato è cresciuto."]
        grammar: [g.presentations, g.condizionale-courtesy]
        vocab: [w.fatturato]
      - q: { es: "Bella presentazione! Posso farLe una domanda?", en: "Great presentation! May I ask you a question?" }
        a: { es: "Prego, sono a disposizione.", en: "Please do, go ahead." }
        alt: ["Certo, prego.", "Volentieri."]
        grammar: [g.presentations, g.lei-forms]
        vocab: [w.presentazione]
      - q: { es: "La vostra azienda è competitiva sui prezzi?", en: "Is your company competitive on price?" }
        a: { es: "Non molto, ma la qualità ci permette di battere la concorrenza.", en: "Not very, but quality lets us beat the competition." }
        alt: ["Sì, molto.", "No, puntiamo sulla qualità."]
        grammar: [g.presentations]
        vocab: [w.competitivo, w.concorrenza]
    texts:
      - title: "Programma del convegno"
        es: ["Ore 9:30: saluti del rettore.", "Ore 10: presentazione dei risultati della ricerca.", "Ore 13: pranzo nel chiostro dell'ex convento."]
        en: ["9.30: welcome from the vice-chancellor.", "10.00: presentation of the research results.", "13.00: lunch in the cloister of the former convent."]
        grammar: [g.nominalization]
        vocab: [w.convegno, w.presentazione]
      - title: "Comunicato stampa"
        es: ["La società ha chiuso il 2024 con un fatturato in crescita.", "L'acquisizione di un fornitore ha favorito l'espansione nel Sud.", "Gli azionisti approveranno il bilancio a maggio."]
        en: ["The company closed 2024 with rising turnover.", "The acquisition of a supplier helped expansion in the South.", "The shareholders will approve the accounts in May."]
        grammar: [g.nominalization]
        vocab: [w.fatturato, w.acquisizione, w.espansione, w.azionista]
    spicy:
      - { es: "Come potete vedere dal grafico, il mio interesse per il relatore è cresciuto in modo esponenziale.", en: "As you can see from the graph, my interest in the speaker has grown exponentially.", grammar: [g.presentations], vocab: [w.relatore] }
      - { es: "Apro una breve parentesi: chi ti ha dato il permesso di essere così affascinante a un convegno?", en: "Let me open a brief aside: who gave you permission to be so charming at a conference?", grammar: [g.presentations], vocab: [w.convegno] }
      - { es: "Per concludere, vorrei sottolineare un dato significativo: sei l'unico motivo per cui sono rimasta fino alla fine.", en: "To conclude, I'd like to stress one significant figure: you're the only reason I stayed until the end.", altEs: ["Per concludere, vorrei sottolineare un dato significativo: sei l'unico motivo per cui sono rimasto fino alla fine."], grammar: [g.presentations, g.relative-cui], vocab: [] }
      - { es: "Legge della domanda e dell'offerta: più mi ignori, più ti cerco.", en: "The law of supply and demand: the more you ignore me, the more I look for you.", grammar: [g.comparatives], vocab: [w.domanda-e-offerta] }
      - { es: "Nessuna fusione aziendale, per carità; al massimo una cena tra soci.", en: "No corporate merger, heaven forbid; at most a dinner between partners.", grammar: [g.nominalization], vocab: [w.fusione, w.socio] }
dialogues:
  - id: c1.u06.d1
    title: La prova generale
    context: "In a café in Ortigia, Benedetta, a PhD student, rehearses her conference talk in front of her supervisor, Professor Lombardo."
    lines:
      - { speaker: Lombardo, es: "Allora, Benedetta, facciamo una prova generale. Immagina che in sala ci siano cento persone.", en: "Right, Benedetta, let's do a dress rehearsal. Imagine there are a hundred people in the room." }
      - { speaker: Benedetta, es: "Buongiorno a tutti e grazie di essere qui. Oggi vorrei parlarvi dell'erosione della costa di Ortigia.", en: "Good morning everyone and thank you for being here. Today I'd like to talk to you about the erosion of the Ortigia coastline." }
      - { speaker: Lombardo, es: "Bene, ma non leggere: guarda il pubblico. E poi?", en: "Good, but don't read: look at the audience. And then?" }
      - { speaker: Benedetta, es: "La presentazione si articola in tre parti: la metodologia, i risultati e alcune proposte.", en: "The presentation is divided into three parts: the methodology, the results and some proposals." }
      - { speaker: Lombardo, es: "Perfetto. Sui risultati, però, eviterei «io penso»: meglio «si ritiene» o «dai dati si evince».", en: "Perfect. On the results, though, I'd avoid 'I think': better 'it is believed' or 'the data show'." }
      - { speaker: Benedetta, es: "Ha ragione. Dai dati si evince un aumento dell'erosione negli ultimi vent'anni.", en: "You're right. The data show an increase in erosion over the last twenty years." }
      - { speaker: Lombardo, es: "Molto meglio. E il campione? Quanti punti della costa avete misurato?", en: "Much better. And the sample? How many points along the coast did you measure?" }
      - { speaker: Benedetta, es: "Quaranta. Come potete vedere dal grafico, la situazione è più grave a sud.", en: "Forty. As you can see from the graph, the situation is more serious in the south." }
      - { speaker: Lombardo, es: "E se qualcuno ti fa una domanda a cui non sai rispondere?", en: "And if someone asks you a question you can't answer?" }
      - { speaker: Benedetta, es: "Dirò: «Bella domanda! È un aspetto che resta da chiarire e che sarà oggetto della prossima ricerca.»", en: "I'll say: 'Good question! It's an aspect that remains to be clarified and will be the subject of our next study.'" }
      - { speaker: Lombardo, es: "Brava. Ancora un po' di pratica e al convegno farai un'ottima figura.", en: "Well done. A bit more practice and you'll make an excellent impression at the conference." }
    questions:
      - { q: "Di che cosa parla la presentazione di Benedetta?", options: ["Del teatro greco di Siracusa", "Dell'erosione della costa di Ortigia", "Della vita di Archimede"], answer: 1, explain: "She says: Oggi vorrei parlarvi dell'erosione della costa di Ortigia." }
      - { q: "Che cosa consiglia la professoressa per i risultati?", options: ["Di usare espressioni impersonali come «si ritiene»", "Di leggere il testo con calma", "Di eliminare il grafico"], answer: 0, explain: "She suggests avoiding io penso and using si ritiene or dai dati si evince." }
      - { q: "Dove è più grave la situazione?", options: ["A nord", "A sud", "Nel porto"], answer: 1, explain: "Benedetta says: la situazione è più grave a sud." }
      - { q: "Che cosa dirà Benedetta se non sa rispondere a una domanda?", options: ["Che la domanda è sbagliata", "Che è un aspetto ancora da chiarire", "Che risponderà la professoressa"], answer: 1, explain: "She will say it is an aspect che resta da chiarire, to be studied next." }
