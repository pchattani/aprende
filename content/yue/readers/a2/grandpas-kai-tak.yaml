id: r.a2.grandpas-kai-tak
level: a2
title: 爺爺嘅啟德機場
kind: text
intro: Kelvin is planning his first trip abroad with friends. When he tells his grandfather, the old man remembers the days when planes landed at Kai Tak, right over the rooftops of Kowloon City.
paragraphs:
  - { es: "我同兩個朋友打算十二月去泰國旅行。我哋已經訂咗機票同酒店，準備喺曼谷玩五日。我未去過泰國，好興奮！我哋諗住去睇廟、行夜市，仲要食好多泰國菜。", en: "Two friends and I are planning a trip to Thailand in December. We've already booked our plane tickets and hotel, and we're getting ready to spend five days in Bangkok. I've never been to Thailand, so I'm really excited! We plan to visit temples, wander round night markets and eat lots of Thai food." }
  - { es: "我同爺爺講我嘅旅行計劃，佢好開心。佢話：「你哋而家去旅行真係好方便。我後生嗰陣，好少人坐飛機，機票好貴，一個月人工都唔夠買一張。」", en: "I told my grandpa about my travel plans and he was delighted. He said: \"Travelling is so convenient for you young people nowadays. When I was young, very few people flew. Plane tickets were very expensive: a whole month's wages wasn't enough to buy one.\"" }
  - { es: "爺爺第一次坐飛機係一九七五年，佢去咗日本做嘢。嗰陣香港嘅機場唔喺赤鱲角，喺九龍城附近，叫啟德機場。爺爺話：「啟德好近市區。飛機落機之前，要喺九龍城啲樓頂上面好低咁飛過。我喺樓下望上去，飛機啲窗都睇得到！」", en: "Grandpa's first flight was in 1975, when he went to Japan for work. In those days Hong Kong's airport wasn't at Chek Lap Kok but near Kowloon City; it was called Kai Tak Airport. Grandpa said: \"Kai Tak was very close to the city. Before landing, the planes had to fly very low over the rooftops of Kowloon City. Looking up from the street, I could see the plane's windows!\"" }
  - { es: "以前住喺九龍城嘅人，日日都聽到飛機嘅聲。爺爺有個朋友住喺嗰度，佢哋傾偈嘅時候，幾分鐘就要停一停，等飛機飛過先繼續講。爺爺笑住話：「我哋講嘢都好大聲，係因為啟德呀！」", en: "People who lived in Kowloon City used to hear the planes every day. Grandpa had a friend who lived there, and when they were chatting, every few minutes they had to stop and wait for a plane to pass before carrying on. Grandpa laughed and said: \"We all talk loudly because of Kai Tak!\"" }
  - { es: "一九九八年，啟德機場停咗用，飛機搬咗去赤鱲角嘅新機場。而家啟德有郵輪碼頭同一個好大嘅體育園。爺爺話佢好掛住舊機場，但係新機場大好多，又安全啲。", en: "In 1998 Kai Tak Airport closed, and the planes moved to the new airport at Chek Lap Kok. Today Kai Tak has a cruise terminal and a huge sports park. Grandpa says he misses the old airport, but the new one is much bigger and safer." }
  - { es: "最後爺爺問我：「你去泰國記得買手信畀我呀！」我話：「冇問題！爺爺，你想唔想同我哋一齊去呀？」佢笑到見牙唔見眼：「唔好喇，我老喇。你影多啲相返嚟畀我睇就得喇。」", en: "Finally Grandpa said to me: \"Remember to bring me back a souvenir from Thailand!\" I said: \"No problem! Grandpa, would you like to come with us?\" He grinned from ear to ear: \"No, no, I'm too old. Just take lots of photos and bring them back to show me.\"" }
questions:
  - { q: "Kelvin打算去邊度旅行？", options: ["日本", "泰國", "澳門"], answer: 1, explain: "我同兩個朋友打算十二月去泰國旅行. Japan is where Grandpa went in 1975." }
  - { q: "爺爺第一次坐飛機係幾時？", options: ["一九七五年", "一九九八年", "十二月"], answer: 0, explain: "爺爺第一次坐飛機係一九七五年. 1998 is when Kai Tak closed." }
  - { q: "以前啟德機場喺邊度附近？", options: ["赤鱲角", "九龍城", "中環"], answer: 1, explain: "喺九龍城附近，叫啟德機場." }
  - { q: "點解爺爺同朋友傾偈要停一停？", options: ["因為飛機好嘈", "因為佢哋好攰", "因為佢哋要食飯"], answer: 0, explain: "They had to wait for each plane to pass before carrying on: 等飛機飛過先繼續講." }
  - { q: "而家啟德有乜嘢？", options: ["一個新機場", "郵輪碼頭同體育園", "好多酒店"], answer: 1, explain: "而家啟德有郵輪碼頭同一個好大嘅體育園." }
glossary:
  - { es: 廟, en: temple }
  - { es: 市區, en: "city centre, urban area" }
  - { es: 郵輪, en: cruise ship }
  - { es: 體育園, en: sports park }
  - { es: 掛住, en: to miss (someone or something) }
  - { es: 笑到見牙唔見眼, en: to grin from ear to ear }
