id: r.a1.el-piso-de-marta
level: a1
title: El piso nuevo de Marta
kind: text
intro: Marta describes her new flat in an email to a friend.
paragraphs:
  - { es: "¡Hola, Ana! ¿Qué tal? Tengo una noticia: tengo un piso nuevo. Está en el barrio de Gracia, en Barcelona. Es un barrio tranquilo, con muchas plazas y cafeterías.", en: "Hi, Ana! How are you? I have news: I have a new flat. It's in the Gracia district, in Barcelona. It's a quiet neighbourhood, with many squares and cafés." }
  - { es: "El piso no es muy grande, pero es muy bonito y moderno. Tiene dos dormitorios, un baño, una cocina pequeña y un salón con una ventana grande. Desde la ventana veo la calle y los árboles.", en: "The flat isn't very big, but it's very nice and modern. It has two bedrooms, a bathroom, a small kitchen and a living room with a big window. From the window I see the street and the trees." }
  - { es: "En el salón hay un sofá azul, una mesa, cuatro sillas y una lámpara. No hay televisión porque no me gusta ver la tele. Prefiero leer o escuchar música. En mi dormitorio hay una cama, un armario y muchos libros.", en: "In the living room there's a blue sofa, a table, four chairs and a lamp. There's no television because I don't like watching TV. I prefer reading or listening to music. In my bedroom there's a bed, a wardrobe and lots of books." }
  - { es: "La cocina es pequeña pero tiene todo: nevera, horno y una mesa para dos personas. Por la mañana desayuno en la cocina y leo el periódico.", en: "The kitchen is small but has everything: fridge, oven and a table for two. In the morning I have breakfast in the kitchen and read the newspaper." }
  - { es: "Al lado del piso hay un supermercado y una farmacia. La estación de metro está a cinco minutos a pie. El mercado está enfrente de la iglesia, en la plaza. Y hay un parque muy cerca donde corro por la mañana.", en: "Next to the flat there's a supermarket and a pharmacy. The metro station is five minutes away on foot. The market is opposite the church, in the square. And there's a park very close by where I run in the morning." }
  - { es: "¿Quieres venir a verlo? Este fin de semana estoy en casa. Puedes dormir en el segundo dormitorio. ¡Hasta pronto! Un beso, Marta.", en: "Do you want to come and see it? This weekend I'm at home. You can sleep in the second bedroom. See you soon! Love, Marta." }
questions:
  - { q: "How many bedrooms does the flat have?", options: ["One", "Two", "Three"], answer: 1 }
  - { q: "Why is there no television?", options: ["It is too expensive", "Marta doesn't like watching TV", "The flat is too small"], answer: 1 }
  - { q: "Where is the market?", options: ["Next to the flat", "Opposite the church", "In the park"], answer: 1 }
glossary:
  - { es: noticia, en: news }
  - { es: árbol, en: tree }
  - { es: nevera, en: fridge }
  - { es: horno, en: oven }
  - { es: beso, en: kiss }
