id: b1.u06
title: Para a gente chegar a tempo
lessons:
  - id: b1.u06.l1
    title: Para a gente chegar a tempo
    teach: [g.personal-infinitive-forms]
    vocab: [w.a-tempo, w.na-hora, w.em-cima-da-hora, w.apressar-se, w.atrasar-se, w.pontualidade, w.avisar-com-antecedência, w.antecedência, w.imediatamente, w.rapidamente, w.rapidez, w.velocidade, w.pegar-trânsito, w.embarque, w.portão, w.conexão, w.escala, w.cancelamento, w.agência, w.máximo]
    tip: "The personal infinitive adds person endings to the infinitive: para nós chegarmos, para vocês chegarem. With eu, você and a gente it has no ending: para a gente chegar."
    sentences:
      - { es: "Precisamos sair agora para a gente chegar a tempo.", en: "We need to leave now so we get there in time.", altEs: ["Precisamos sair agora para chegarmos a tempo.", "Temos que sair agora para a gente chegar a tempo."], grammar: [g.personal-infinitive-forms, g.subjunctive-purpose], vocab: [w.a-tempo] }
      - { es: "É melhor vocês saírem cedo para não pegarem trânsito.", en: "You'd better leave early so you don't get stuck in traffic.", altEs: ["É melhor que vocês saiam cedo para não pegarem trânsito."], grammar: [g.personal-infinitive-forms, g.personal-infinitive-uses], vocab: [w.pegar-trânsito], transform: { instruction: "Change vocês to a gente", answer: "É melhor a gente sair cedo para não pegar trânsito.", en: "We'd better leave early so we don't get stuck in traffic." } }
      - { es: "O portão de embarque fecha vinte minutos antes de o ônibus sair.", en: "The boarding gate closes twenty minutes before the bus leaves.", altEs: ["O portão de embarque fecha vinte minutos antes do ônibus sair."], grammar: [g.personal-infinitive-uses], vocab: [w.embarque, w.portão], note: "The norm writes antes de o ônibus sair; everyday Brazilian contracts: antes do ônibus sair." }
      - { es: "A pontualidade é importante; é melhor chegarmos na hora.", en: "Punctuality matters; we'd better arrive on time.", altEs: ["A pontualidade é importante; é melhor a gente chegar na hora."], grammar: [g.personal-infinitive-forms], vocab: [w.pontualidade, w.na-hora] }
      - { es: "Liguei para a agência para eles confirmarem o hotel.", en: "I called the agency so they'd confirm the hotel.", altEs: ["Liguei para a agência para que eles confirmassem o hotel."], grammar: [g.personal-infinitive-forms, g.subjunctive-purpose], vocab: [w.agência] }
      - { es: "Chegamos em cima da hora, mas deu tempo.", en: "We got there at the last minute, but we made it.", grammar: [g.preterite-irregular], vocab: [w.em-cima-da-hora] }
      - { es: "Se apressem para não perderem a conexão em Confins.", en: "Hurry up so you don't miss your connection at Confins.", altEs: ["Apressem-se para não perderem a conexão em Confins."], grammar: [g.personal-infinitive-forms], vocab: [w.apressar-se, w.conexão], note: "Confins is Belo Horizonte's international airport." }
      - { es: "O voo tem uma escala em Brasília; é bom vocês levarem um lanche.", en: "The flight has a stopover in Brasília; you'd better take a snack.", grammar: [g.personal-infinitive-forms, g.personal-infinitive-uses], vocab: [w.escala] }
      - { es: "Depois do cancelamento do voo, deram um hotel para os passageiros dormirem.", en: "After the flight was cancelled, they gave the passengers a hotel to sleep in.", grammar: [g.personal-infinitive-forms], vocab: [w.cancelamento] }
      - { es: "Me avisa com antecedência para eu poder reservar a mesa.", en: "Let me know in advance so I can book the table.", altEs: ["Me avise com antecedência para eu poder reservar a mesa."], grammar: [g.personal-infinitive-forms], vocab: [w.avisar-com-antecedência] }
      - { es: "É preciso comprar o ingresso com antecedência para garantirmos um lugar.", en: "You have to buy the ticket in advance for us to be sure of a seat.", grammar: [g.personal-infinitive-forms], vocab: [w.antecedência] }
      - { es: "Ele saiu imediatamente para os filhos não se atrasarem.", en: "He left immediately so his kids wouldn't be late.", grammar: [g.personal-infinitive-forms], vocab: [w.imediatamente, w.atrasar-se], error: { wrong: "Ele saiu imediatamente para os filhos não se atrasar.", explain: "The infinitive has a plural subject (os filhos), so it takes -em: atrasarem.", grammar: g.personal-infinitive-forms } }
      - { es: "Fala mais devagar para eu entender.", en: "Speak more slowly so I can understand.", altEs: ["Fale mais devagar para eu entender."], grammar: [g.personal-infinitive-forms], vocab: [], error: { wrong: "Fala mais devagar para mim entender.", explain: "The subject of an infinitive is eu, not mim: para eu entender.", grammar: g.personal-infinitive-uses } }
      - { es: "Aqui a velocidade máxima é sessenta; vá devagar para a gente não levar multa.", en: "The speed limit here is sixty; go slowly so we don't get a fine.", grammar: [g.personal-infinitive-forms], vocab: [w.velocidade, w.máximo] }
      - { es: "Os garçons servem com rapidez para os clientes não esperarem.", en: "The waiters serve quickly so the customers don't wait.", grammar: [g.personal-infinitive-forms], vocab: [w.rapidez] }
      - { es: "Arrumei tudo rapidamente para a gente sair às sete.", en: "I packed everything quickly so we could leave at seven.", altEs: ["Arrumei tudo rapidamente para sairmos às sete."], grammar: [g.personal-infinitive-forms], vocab: [w.rapidamente], transform: { instruction: "Replace a gente with nós", answer: "Arrumei tudo rapidamente para nós sairmos às sete.", alt: ["Arrumei tudo rapidamente para sairmos às sete."] } }
    exchanges:
      - q: { es: "Que horas a gente tem que sair?", en: "What time do we have to leave?" }
        a: { es: "Às seis, para não pegarmos trânsito.", en: "At six, so we don't hit traffic." }
        alt: ["Às seis.", "Cedo, para chegarmos a tempo."]
        grammar: [g.personal-infinitive-forms]
        vocab: [w.pegar-trânsito]
      - q: { es: "Por que você está correndo?", en: "Why are you running?" }
        a: { es: "Para chegar a tempo na reunião!", en: "To get to the meeting in time!" }
        alt: ["Estou atrasado!", "Para não perder o ônibus."]
        grammar: [g.subjunctive-purpose]
        vocab: [w.a-tempo]
      - q: { es: "O voo é direto?", en: "Is the flight direct?" }
        a: { es: "Não, tem uma escala em Brasília.", en: "No, it has a stopover in Brasília." }
        alt: ["É direto, sim.", "Não, tem conexão em Confins."]
        grammar: []
        vocab: [w.escala, w.conexão]
      - q: { es: "Por que você ligou para a agência?", en: "Why did you call the agency?" }
        a: { es: "Para eles mudarem a data da passagem.", en: "So they'd change the date on the ticket." }
        alt: ["Para mudar a data.", "Para confirmar o hotel."]
        grammar: [g.personal-infinitive-forms]
        vocab: [w.agência]
      - q: { es: "Ainda dá tempo?", en: "Is there still time?" }
        a: { es: "Dá, mas é bom a gente se apressar.", en: "There is, but we'd better hurry." }
        alt: ["Dá, se a gente correr.", "Acho que não."]
        grammar: [g.personal-infinitive-uses]
        vocab: [w.apressar-se]
    texts:
      - title: "Mensagem da agência"
        es: ["Prezado cliente, o seu ônibus para Diamantina sai de Belo Horizonte às sete.", "Recomendamos chegar à rodoviária com antecedência.", "É importante os passageiros estarem no portão na hora."]
        en: ["Dear customer, your bus to Diamantina leaves Belo Horizonte at seven.", "We recommend arriving at the bus station in good time.", "It's important for passengers to be at the gate on time."]
        grammar: [g.personal-infinitive-forms, g.personal-infinitive-uses]
        vocab: [w.agência, w.antecedência, w.portão, w.na-hora]
      - title: "Bilhete na geladeira"
        es: ["Filhos, o ônibus da escola passa às seis e meia.", "Deixei o café pronto para vocês tomarem antes de sair.", "Não se atrasem!"]
        en: ["Kids, the school bus comes at half past six.", "I've left breakfast ready for you to have before you go.", "Don't be late!"]
        grammar: [g.personal-infinitive-forms]
        vocab: [w.atrasar-se]
    spicy:
      - { es: "Cheguei em cima da hora para você não ter tempo de desistir.", en: "I arrived at the last minute so you wouldn't have time to back out.", grammar: [g.personal-infinitive-forms], vocab: [w.em-cima-da-hora] }
      - { es: "Me apressei tanto para te ver que vim com uma meia de cada cor.", en: "I hurried so much to see you that I came in odd socks.", grammar: [g.subjunctive-purpose], vocab: [w.apressar-se] }
      - { es: "É melhor a gente sair agora, antes de os seus amigos perceberem.", en: "We'd better leave now, before your friends notice.", altEs: ["É melhor a gente sair agora, antes dos seus amigos perceberem."], grammar: [g.personal-infinitive-forms, g.personal-infinitive-uses], vocab: [] }
      - { es: "Liguei só para você saber que estou pensando em você.", en: "I only called so you'd know I'm thinking about you.", grammar: [g.personal-infinitive-forms], vocab: [] }
      - { es: "Fala mais baixo, para só eu ouvir.", en: "Speak more quietly, so only I can hear.", altEs: ["Fale mais baixo, para só eu ouvir."], grammar: [g.personal-infinitive-forms], vocab: [] }
  - id: b1.u06.l2
    title: Antes de eles chegarem
    teach: [g.personal-infinitive-uses]
    vocab: [w.calendário, w.feriado, w.ocupado, w.livre, w.acompanhar, w.aos-poucos, w.de-vez, w.a-partir-de, w.dentro-de, w.ao-mesmo-tempo, w.enquanto-isso, w.frequência, w.festival, w.evento, w.ingresso-esgotado, w.esgotado]
    tip: "After antes de, depois de, sem, até, por and ao, give the infinitive its own subject: antes de eles chegarem, sem ninguém perceber, ao sairmos."
    sentences:
      - { es: "Antes de eles chegarem, vamos arrumar a sala.", en: "Before they arrive, let's tidy the living room.", altEs: ["Antes deles chegarem, vamos arrumar a sala."], grammar: [g.personal-infinitive-uses], vocab: [], transform: { instruction: "Change eles to você", answer: "Antes de você chegar, vamos arrumar a sala.", alt: ["Antes de você chegar, a gente vai arrumar a sala."], en: "Before you arrive, let's tidy the living room." } }
      - { es: "Depois de vocês jantarem, a gente vai à Vesperata.", en: "After you've had dinner, we'll go to the Vesperata.", grammar: [g.personal-infinitive-uses], vocab: [], note: "At the Vesperata, musicians play from the balconies of Diamantina's old houses to diners in the street below.", error: { wrong: "Depois de vocês jantar, a gente vai à Vesperata.", explain: "With vocês the infinitive takes -em: depois de vocês jantarem.", grammar: g.personal-infinitive-uses } }
      - { es: "Saímos da festa sem eles perceberem.", en: "We left the party without them noticing.", grammar: [g.personal-infinitive-uses], vocab: [] }
      - { es: "Ao chegarmos a Diamantina, fomos direto para a Rua da Quitanda.", en: "On arriving in Diamantina, we went straight to Rua da Quitanda.", altEs: ["Quando chegamos a Diamantina, fomos direto para a Rua da Quitanda."], grammar: [g.personal-infinitive-uses], vocab: [] }
      - { es: "Obrigado por vocês terem vindo.", en: "Thank you for coming.", altEs: ["Obrigada por vocês terem vindo.", "Obrigado por terem vindo."], grammar: [g.personal-infinitive-uses], vocab: [] }
      - { es: "Vamos esperar até eles voltarem.", en: "Let's wait until they come back.", altEs: ["Vamos esperar até que eles voltem."], grammar: [g.personal-infinitive-uses], vocab: [] }
      - { es: "O calendário de eventos sai a partir de março.", en: "The events calendar comes out from March.", grammar: [g.personal-infinitive-uses], vocab: [w.calendário, w.evento, w.a-partir-de] }
      - { es: "O feriado é perfeito para a gente viajar.", en: "The holiday is perfect for us to travel.", altEs: ["O feriado é perfeito para viajarmos."], grammar: [g.personal-infinitive-uses], vocab: [w.feriado] }
      - { es: "Estou ocupado agora; é melhor vocês ligarem mais tarde.", en: "I'm busy now; you'd better call later.", altEs: ["Estou ocupada agora; é melhor vocês ligarem mais tarde."], grammar: [g.personal-infinitive-uses], vocab: [w.ocupado] }
      - { es: "Sábado estou livre para vocês me mostrarem a cidade.", en: "On Saturday I'm free for you to show me the town.", grammar: [g.personal-infinitive-uses], vocab: [w.livre] }
      - { es: "O guia vai acompanhar o grupo até os músicos começarem a tocar.", en: "The guide will stay with the group until the musicians start playing.", grammar: [g.personal-infinitive-uses], vocab: [w.acompanhar] }
      - { es: "Os ingressos já estavam esgotados antes de a gente conseguir comprar.", en: "The tickets were already sold out before we managed to buy any.", altEs: ["Os ingressos já estavam esgotados antes de nós conseguirmos comprar."], grammar: [g.personal-infinitive-uses], vocab: [w.esgotado] }
      - { es: "Aos poucos, os músicos aparecem nas janelas para todos ouvirem.", en: "Little by little, the musicians appear at the windows for everyone to hear.", grammar: [g.personal-infinitive-uses], vocab: [w.aos-poucos] }
      - { es: "Eles se mudaram de vez para Diamantina depois de se aposentarem.", en: "They moved to Diamantina for good after they retired.", grammar: [g.personal-infinitive-uses], vocab: [w.de-vez] }
      - { es: "Dentro de uma hora, a gente encontra vocês na praça.", en: "Within an hour, we'll meet you in the square.", grammar: [g.personal-infinitive-uses], vocab: [w.dentro-de] }
      - { es: "Os músicos tocam ao mesmo tempo para o som encher a rua.", en: "The musicians play at the same time so the sound fills the street.", grammar: [g.personal-infinitive-uses, g.subjunctive-purpose], vocab: [w.ao-mesmo-tempo], transform: { instruction: "Rewrite with para que + subjunctive", answer: "Os músicos tocam ao mesmo tempo para que o som encha a rua.", en: "The musicians play at the same time so that the sound fills the street." } }
    exchanges:
      - q: { es: "Quando a gente vai à Vesperata?", en: "When are we going to the Vesperata?" }
        a: { es: "Depois de vocês descansarem um pouco.", en: "After you've had a bit of a rest." }
        alt: ["Às oito.", "Depois do jantar."]
        grammar: [g.personal-infinitive-uses]
        vocab: []
      - q: { es: "Com que frequência tem Vesperata?", en: "How often is there a Vesperata?" }
        a: { es: "Em alguns sábados do ano.", en: "On some Saturdays in the year." }
        alt: ["Não é toda semana.", "Só em alguns sábados."]
        grammar: []
        vocab: [w.frequência]
      - q: { es: "Você vai ao festival de inverno?", en: "Are you going to the winter festival?" }
        a: { es: "Vou, se os ingressos não estiverem esgotados.", en: "I am, if the tickets aren't sold out." }
        alt: ["Vou, já comprei o ingresso.", "Não, ingresso esgotado!"]
        grammar: [g.future-subjunctive-se]
        vocab: [w.festival, w.esgotado, w.ingresso-esgotado]
      - q: { es: "Você está livre hoje à noite?", en: "Are you free tonight?" }
        a: { es: "Estou! Só preciso terminar uma coisa antes de a gente sair.", en: "I am! I just need to finish something before we go out." }
        alt: ["Estou, sim.", "Não, estou ocupado."]
        grammar: [g.personal-infinitive-uses]
        vocab: [w.livre]
      - q: { es: "O que vocês fizeram enquanto eu dormia?", en: "What did you do while I was asleep?" }
        a: { es: "Fomos ao mercado. Enquanto isso, o Bento fez o almoço.", en: "We went to the market. Meanwhile, Bento made lunch." }
        alt: ["Fomos passear.", "Nada, também dormimos."]
        grammar: []
        vocab: [w.enquanto-isso]
    texts:
      - title: "Programa da Vesperata"
        es: ["Os músicos sobem às sacadas dos casarões às oito.", "Antes de a música começar, o público se senta nas mesas da rua.", "Ao terminarem, os músicos descem para todos aplaudirem."]
        en: ["The musicians go up to the balconies of the old mansions at eight.", "Before the music starts, the audience sits at the tables in the street.", "When they finish, the musicians come down so everyone can applaud."]
        grammar: [g.personal-infinitive-uses]
        vocab: [w.evento]
      - title: "Recado da pousada"
        es: ["Obrigada por vocês terem escolhido a nossa pousada!", "O café da manhã é servido a partir das sete.", "Antes de saírem, deixem a chave com a gente."]
        en: ["Thank you for choosing our guesthouse!", "Breakfast is served from seven.", "Before you leave, give us the key."]
        grammar: [g.personal-infinitive-uses]
        vocab: [w.a-partir-de]
    spicy:
      - { es: "Antes de você dizer não, prova o meu pão de queijo.", en: "Before you say no, try my cheese bread.", altEs: ["Antes de você dizer não, prove o meu pão de queijo."], grammar: [g.personal-infinitive-uses], vocab: [] }
      - { es: "Depois de dançarmos a noite toda, você me deve um café da manhã.", en: "After we've danced all night, you owe me breakfast.", grammar: [g.personal-infinitive-uses], vocab: [] }
      - { es: "Saí da festa sem ninguém perceber… menos você.", en: "I left the party without anyone noticing… except you.", grammar: [g.personal-infinitive-uses], vocab: [] }
      - { es: "Estou livre no sábado para você me mostrar os seus lugares favoritos.", en: "I'm free on Saturday for you to show me your favourite places.", grammar: [g.personal-infinitive-uses], vocab: [w.livre] }
      - { es: "Ao te ver na sacada, esqueci a letra da música.", en: "When I saw you on the balcony, I forgot the words of the song.", grammar: [g.personal-infinitive-uses], vocab: [] }
  - id: b1.u06.l3
    title: Para que todos ouçam
    teach: [g.subjunctive-purpose]
    vocab: [w.para-que, w.a-fim-de, w.sem-que, w.até-que, w.antes-que, w.economizar, w.poupar, w.economia, w.orçamento, w.festa-junina, w.quadrilha, w.fogueira, w.quentão, w.pamonha, w.canjica, w.paçoca, w.pé-de-moleque, w.caldo-de-cana, w.par]
    tip: "Same subject: para + infinitive. Different subject: para + personal infinitive (speech) or para que + subjunctive (careful). Antes que, até que and sem que also take the subjunctive."
    sentences:
      - { es: "Estou economizando para viajar no feriado.", en: "I'm saving to travel over the holiday.", grammar: [g.subjunctive-purpose], vocab: [w.economizar] }
      - { es: "Economizo para que os meus filhos possam estudar.", en: "I save so that my children can study.", altEs: ["Economizo para os meus filhos poderem estudar."], grammar: [g.subjunctive-purpose], vocab: [w.para-que, w.economizar], transform: { instruction: "Use the personal infinitive instead of para que", answer: "Economizo para os meus filhos poderem estudar.", en: "I save so my children can study." } }
      - { es: "Trouxe quentão para vocês provarem.", en: "I brought some quentão for you to try.", altEs: ["Trouxe quentão para que vocês provem."], grammar: [g.subjunctive-purpose, g.personal-infinitive-uses], vocab: [w.quentão], note: "Quentão is hot cachaça with ginger, sugar and spices, drunk at June festivals." }
      - { es: "Fale mais alto para que todos ouçam.", en: "Speak louder so that everyone can hear.", altEs: ["Fale mais alto para todos ouvirem.", "Fala mais alto para todo mundo ouvir."], grammar: [g.subjunctive-purpose], vocab: [w.para-que], transform: { instruction: "Use the personal infinitive instead of para que", answer: "Fale mais alto para todos ouvirem.", alt: ["Fala mais alto para todos ouvirem."], en: "Speak louder so everyone can hear." } }
      - { es: "A gente acende a fogueira para que todos se esquentem.", en: "We light the bonfire so everyone can warm up.", altEs: ["A gente acende a fogueira para todos se esquentarem."], grammar: [g.subjunctive-purpose], vocab: [w.fogueira] }
      - { es: "Ensaiamos a quadrilha a fim de dançar bem na festa junina.", en: "We rehearsed the square dance in order to dance well at the June festival.", grammar: [g.subjunctive-purpose], vocab: [w.a-fim-de, w.quadrilha, w.festa-junina] }
      - { es: "Vou sair da festa sem que ninguém perceba.", en: "I'm going to leave the party without anyone noticing.", altEs: ["Vou sair da festa sem ninguém perceber."], grammar: [g.subjunctive-purpose], vocab: [w.sem-que] }
      - { es: "Vamos ficar aqui até que a fogueira apague.", en: "Let's stay here until the bonfire goes out.", altEs: ["Vamos ficar aqui até a fogueira apagar."], grammar: [g.subjunctive-purpose], vocab: [w.até-que, w.fogueira] }
      - { es: "Vamos embora antes que chova.", en: "Let's go before it rains.", altEs: ["Vamos embora antes de chover."], grammar: [g.subjunctive-purpose], vocab: [w.antes-que], error: { wrong: "Vamos embora antes que chover.", explain: "Antes que takes the present subjunctive (chova); antes de takes the infinitive (antes de chover).", grammar: g.subjunctive-purpose } }
      - { es: "A gente poupa um pouco todo mês para ter uma reserva.", en: "We put a little aside every month to have some savings.", grammar: [g.subjunctive-purpose], vocab: [w.poupar] }
      - { es: "Fizemos um orçamento para não gastar demais na festa.", en: "We drew up a budget so as not to overspend on the party.", grammar: [g.subjunctive-purpose], vocab: [w.orçamento] }
      - { es: "Com essa economia, dá para comprar pamonha para todo mundo.", en: "With those savings, we can buy pamonha for everyone.", grammar: [g.subjunctive-purpose], vocab: [w.economia, w.pamonha] }
      - { es: "Minha avó faz canjica para os netos levarem para casa.", en: "My grandmother makes canjica for the grandchildren to take home.", altEs: ["A minha avó faz canjica para que os netos levem para casa."], grammar: [g.subjunctive-purpose, g.personal-infinitive-uses], vocab: [w.canjica] }
      - { es: "Comprei paçoca e pé de moleque para que vocês provem os doces da festa.", en: "I bought paçoca and peanut brittle so you can try the festival sweets.", altEs: ["Comprei paçoca e pé de moleque para vocês provarem os doces da festa."], grammar: [g.subjunctive-purpose], vocab: [w.paçoca, w.pé-de-moleque] }
      - { es: "Pedi um caldo de cana para a gente dividir.", en: "I ordered a sugar-cane juice for us to share.", grammar: [g.subjunctive-purpose], vocab: [w.caldo-de-cana] }
      - { es: "Vim a Diamantina para conhecer a casa de Juscelino Kubitschek.", en: "I came to Diamantina to see Juscelino Kubitschek's house.", grammar: [g.subjunctive-purpose], vocab: [], note: "Juscelino Kubitschek, the president who built Brasília, was born in Diamantina." }
    exchanges:
      - q: { es: "Para que você está economizando?", en: "What are you saving for?" }
        a: { es: "Para viajar para Portugal no ano que vem.", en: "To travel to Portugal next year." }
        alt: ["Para comprar um carro.", "Para a minha formatura."]
        grammar: [g.subjunctive-purpose]
        vocab: [w.economizar]
      - q: { es: "Por que você trouxe tanta comida?", en: "Why did you bring so much food?" }
        a: { es: "Para que ninguém passe fome na festa junina!", en: "So that nobody goes hungry at the June festival!" }
        alt: ["Para todo mundo comer bem!", "Para sobrar."]
        grammar: [g.subjunctive-purpose]
        vocab: [w.para-que, w.festa-junina]
      - q: { es: "Vamos esperar mais um pouco?", en: "Shall we wait a bit longer?" }
        a: { es: "Vamos, até que a quadrilha comece.", en: "Let's, until the square dance starts." }
        alt: ["Vamos!", "Não, vamos embora antes que chova."]
        grammar: [g.subjunctive-purpose]
        vocab: [w.até-que, w.quadrilha]
      - q: { es: "Quer um quentão?", en: "Do you want a quentão?" }
        a: { es: "Quero, para esquentar! Mas sem muita cachaça.", en: "Yes, to warm up! But not too much cachaça." }
        alt: ["Quero!", "Não, obrigado, prefiro canjica."]
        grammar: [g.subjunctive-purpose]
        vocab: [w.quentão]
      - q: { es: "Qual é o orçamento da festa?", en: "What's the budget for the party?" }
        a: { es: "Pequeno. Por isso cada um traz um prato, para a gente dividir.", en: "Small. That's why everyone brings a dish, for us to share." }
        alt: ["Pequeno.", "Quase nada!"]
        grammar: [g.subjunctive-purpose]
        vocab: [w.orçamento]
    texts:
      - title: "Convite da festa junina"
        es: ["Venha à nossa festa junina no sábado!", "Vai ter fogueira, quadrilha, pamonha e quentão.", "Traga um prato para que todos possam provar."]
        en: ["Come to our June festival party on Saturday!", "There'll be a bonfire, square dancing, pamonha and quentão.", "Bring a dish so that everyone can have a taste."]
        grammar: [g.subjunctive-purpose]
        vocab: [w.festa-junina, w.fogueira, w.quadrilha, w.pamonha, w.quentão]
      - title: "Dica de economia"
        es: ["Quer economizar?", "Faça um orçamento no começo do mês a fim de saber quanto pode gastar.", "E guarde um pouco antes que o dinheiro acabe!"]
        en: ["Want to save money?", "Draw up a budget at the start of the month so you know how much you can spend.", "And put some aside before the money runs out!"]
        grammar: [g.subjunctive-purpose]
        vocab: [w.economizar, w.orçamento, w.a-fim-de, w.antes-que]
    spicy:
      - { es: "Vim à festa junina para você me tirar para dançar.", en: "I came to the June festival for you to ask me to dance.", grammar: [g.subjunctive-purpose, g.personal-infinitive-uses], vocab: [w.festa-junina] }
      - { es: "Te dei paçoca para que você lembre de mim sempre que comer um doce.", en: "I gave you paçoca so you'd remember me whenever you eat something sweet.", grammar: [g.subjunctive-purpose], vocab: [w.paçoca, w.para-que] }
      - { es: "Vamos dançar a quadrilha juntos antes que alguém roube o meu par.", en: "Let's do the square dance together before someone steals my partner.", grammar: [g.subjunctive-purpose], vocab: [w.quadrilha, w.antes-que, w.par] }
      - { es: "Economizei o mês inteiro a fim de te levar para jantar; espero que você esteja com fome.", en: "I saved all month in order to take you to dinner; I hope you're hungry.", grammar: [g.subjunctive-purpose], vocab: [w.economizar, w.a-fim-de] }
      - { es: "Fiquei perto da fogueira para você ter uma desculpa para chegar perto.", en: "I stayed near the bonfire so you'd have an excuse to come close.", altEs: ["Fiquei perto da fogueira para você ter um motivo para chegar perto."], grammar: [g.subjunctive-purpose], vocab: [w.fogueira] }
  - id: b1.u06.l4
    title: Na torcida
    teach: [g.personal-infinitive-uses, g.subjunctive-purpose]
    vocab: [w.estádio, w.torcida, w.arquibancada, w.atleta, w.medalha, w.olimpíadas, w.empate, w.empatar, w.derrota, w.vitória, w.competição, w.competir, w.campeão, w.alambique, w.pinga, w.licor, w.café-coado, w.técnico]
    tip: "Para + personal infinitive is the everyday way to say 'so that': Cantamos para o time não desistir."
    sentences:
      - { es: "Chegamos cedo ao estádio para pegarmos um bom lugar na arquibancada.", en: "We got to the stadium early to get a good seat in the stands.", altEs: ["Chegamos cedo ao estádio para a gente pegar um bom lugar na arquibancada."], grammar: [g.personal-infinitive-uses], vocab: [w.estádio, w.arquibancada] }
      - { es: "A torcida cantou o jogo inteiro para o time não desistir.", en: "The fans sang for the whole match so the team wouldn't give up.", grammar: [g.personal-infinitive-uses, g.subjunctive-purpose], vocab: [w.torcida] }
      - { es: "É importante os atletas descansarem antes da competição.", en: "It's important for the athletes to rest before the competition.", altEs: ["É importante que os atletas descansem antes da competição."], grammar: [g.personal-infinitive-uses], vocab: [w.atleta, w.competição] }
      - { es: "Ela treina todo dia para competir nas Olimpíadas.", en: "She trains every day to compete in the Olympics.", grammar: [g.subjunctive-purpose], vocab: [w.competir, w.olimpíadas] }
      - { es: "Para ganharem a medalha, eles precisam pelo menos de um empate.", en: "To win the medal, they need at least a draw.", grammar: [g.personal-infinitive-uses], vocab: [w.medalha, w.empate] }
      - { es: "O time empatou, mas a torcida aplaudiu para os jogadores saberem que estava tudo bem.", en: "The team drew, but the fans applauded so the players would know it was all right.", grammar: [g.personal-infinitive-uses], vocab: [w.empatar, w.torcida] }
      - { es: "Depois da derrota, o técnico conversou com os jogadores para eles não ficarem tristes.", en: "After the defeat, the coach talked to the players so they wouldn't be down.", grammar: [g.personal-infinitive-uses], vocab: [w.derrota, w.técnico] }
      - { es: "Depois da vitória, a cidade parou para comemorar.", en: "After the win, the whole town stopped to celebrate.", grammar: [g.subjunctive-purpose], vocab: [w.vitória] }
      - { es: "O campeão voltou para Diamantina para a família ver a medalha.", en: "The champion came back to Diamantina so his family could see the medal.", grammar: [g.personal-infinitive-uses], vocab: [w.campeão, w.medalha] }
      - { es: "Fomos ao alambique para vocês verem como se faz cachaça.", en: "We went to the still so you could see how cachaça is made.", grammar: [g.personal-infinitive-uses], vocab: [w.alambique], error: { wrong: "Fomos ao alambique para vocês ver como se faz cachaça.", explain: "With vocês the infinitive takes -em: para vocês verem.", grammar: g.personal-infinitive-forms } }
      - { es: "Pedi uma pinga para a gente comemorar a vitória.", en: "I ordered a cachaça for us to celebrate the win.", grammar: [g.personal-infinitive-uses], vocab: [w.pinga, w.vitória] }
      - { es: "O licor é para depois do jantar, para todo mundo provar.", en: "The liqueur is for after dinner, for everyone to try.", grammar: [g.personal-infinitive-uses], vocab: [w.licor] }
      - { es: "Minha avó faz café coado para as visitas não irem embora com fome.", en: "My grandmother makes filter coffee so visitors don't leave hungry.", altEs: ["A minha avó faz café coado para que as visitas não vão embora com fome."], grammar: [g.personal-infinitive-uses, g.subjunctive-purpose], vocab: [w.café-coado] }
      - { es: "Saímos do estádio antes de o jogo acabar para não pegarmos trânsito.", en: "We left the stadium before the match ended so we wouldn't hit traffic.", altEs: ["Saímos do estádio antes do jogo acabar para não pegarmos trânsito."], grammar: [g.personal-infinitive-uses], vocab: [w.estádio, w.pegar-trânsito] }
      - { es: "Comprei os ingressos para nós vermos a final.", en: "I bought the tickets so we can see the final.", altEs: ["Comprei os ingressos para a gente ver a final."], grammar: [g.personal-infinitive-forms], vocab: [], transform: { instruction: "Change nós to vocês", answer: "Comprei os ingressos para vocês verem a final.", en: "I bought the tickets so you can see the final." } }
      - { es: "A competição foi adiada para que os atletas possam descansar.", en: "The competition was postponed so the athletes can rest.", altEs: ["A competição foi adiada para os atletas poderem descansar."], grammar: [g.subjunctive-purpose], vocab: [w.competição, w.atleta], transform: { instruction: "Use the personal infinitive instead of para que", answer: "A competição foi adiada para os atletas poderem descansar.", en: "The competition was postponed so the athletes could rest." } }
    exchanges:
      - q: { es: "Para que time você torce?", en: "Which team do you support?" }
        a: { es: "Para o Cruzeiro, desde pequeno.", en: "Cruzeiro, since I was little." }
        alt: ["Para o Atlético!", "Não torço para ninguém."]
        grammar: []
        vocab: [w.torcer-para]
      - q: { es: "Como foi o jogo?", en: "How was the match?" }
        a: { es: "Empate: um a um. A torcida ficou chateada.", en: "A draw: one all. The fans were upset." }
        alt: ["Empatou.", "Foi uma derrota feia."]
        grammar: []
        vocab: [w.empate, w.torcida]
      - q: { es: "Vamos comemorar a vitória?", en: "Shall we celebrate the win?" }
        a: { es: "Vamos! Mas sem muita pinga, para a gente acordar cedo amanhã.", en: "Let's! But not too much cachaça, so we can get up early tomorrow." }
        alt: ["Vamos!", "Claro, o campeão merece!"]
        grammar: [g.personal-infinitive-uses]
        vocab: [w.vitória, w.pinga]
      - q: { es: "Por que vocês saíram antes do fim?", en: "Why did you leave before the end?" }
        a: { es: "Para não pegarmos trânsito.", en: "So we wouldn't hit traffic." }
        alt: ["Para não perder o ônibus.", "Porque estava perdendo!"]
        grammar: [g.personal-infinitive-forms]
        vocab: [w.pegar-trânsito]
      - q: { es: "Quer um café coado?", en: "Would you like some filter coffee?" }
        a: { es: "Quero! Para eu acordar de vez.", en: "Yes, please! To wake me up properly." }
        alt: ["Quero, obrigado.", "Agora não, obrigada."]
        grammar: [g.personal-infinitive-forms]
        vocab: [w.café-coado]
    texts:
      - title: "Notícia de esporte"
        es: ["O time de Diamantina ganhou a competição do estado.", "A torcida encheu a arquibancada para ver a vitória.", "Os atletas voltam hoje para a cidade comemorar com eles."]
        en: ["Diamantina's team won the state competition.", "The fans filled the stands to see the win.", "The athletes come home today so the town can celebrate with them."]
        grammar: [g.personal-infinitive-uses]
        vocab: [w.competição, w.torcida, w.arquibancada, w.vitória, w.atleta]
      - title: "Visita ao alambique"
        es: ["No alambique, o seu Bento explicou como se faz a cachaça.", "Depois, deu uma pinga para cada visitante provar.", "Comprei um licor para levarmos de presente."]
        en: ["At the still, Mr Bento explained how cachaça is made.", "Then he gave each visitor a cachaça to try.", "I bought a liqueur for us to take as a present."]
        grammar: [g.personal-infinitive-uses]
        vocab: [w.alambique, w.pinga, w.licor]
    spicy:
      - { es: "Torço para o seu time só para você me levar ao estádio.", en: "I support your team just so you'll take me to the stadium.", grammar: [g.personal-infinitive-uses], vocab: [w.estádio] }
      - { es: "No futebol aceito empate, mas para ganhar o seu coração quero vitória.", en: "In football I'll take a draw, but to win your heart I want victory.", grammar: [g.subjunctive-purpose], vocab: [w.empate, w.vitória] }
      - { es: "Você merece uma medalha por me aguentar a noite inteira falando de futebol.", en: "You deserve a medal for putting up with me talking about football all night.", grammar: [g.personal-infinitive-uses], vocab: [w.medalha] }
      - { es: "Pedi duas pingas para a gente perder a vergonha e dançar.", en: "I ordered two cachaças so we'd lose our shyness and dance.", grammar: [g.personal-infinitive-uses], vocab: [w.pinga] }
      - { es: "Fiz café coado para você ficar mais um pouco.", en: "I made filter coffee so you'd stay a bit longer.", grammar: [g.personal-infinitive-uses], vocab: [w.café-coado] }
dialogues:
  - id: b1.u06.d1
    title: Correndo para a Vesperata
    context: Juliana and Thiago are hurrying to get a table for the Vesperata in Diamantina.
    lines:
      - { speaker: Juliana, es: "Thiago, anda! Precisamos sair agora para a gente pegar uma mesa boa.", en: "Thiago, come on! We need to leave now so we get a good table." }
      - { speaker: Thiago, es: "Calma! A Vesperata só começa às oito.", en: "Relax! The Vesperata doesn't start till eight." }
      - { speaker: Juliana, es: "Eu sei, mas é bom chegarmos cedo. No sábado passado, as mesas acabaram antes de nós chegarmos.", en: "I know, but we'd better get there early. Last Saturday the tables ran out before we arrived." }
      - { speaker: Thiago, es: "Tá bom. Deixa eu pegar o casaco para não passar frio.", en: "OK. Let me get my coat so I don't get cold." }
      - { speaker: Juliana, es: "Liguei para o restaurante para eles guardarem uma mesa na Rua da Quitanda.", en: "I called the restaurant so they'd keep a table for us on Rua da Quitanda." }
      - { speaker: Thiago, es: "Você pensa em tudo! E depois de os músicos tocarem, vamos jantar onde?", en: "You think of everything! And after the musicians have played, where are we having dinner?" }
      - { speaker: Juliana, es: "No mesmo lugar, para não perdermos tempo.", en: "At the same place, so we don't waste time." }
      - { speaker: Thiago, es: "Ótimo. Você trouxe dinheiro? Lá não aceitam cartão.", en: "Great. Did you bring cash? They don't take cards there." }
      - { speaker: Juliana, es: "Trouxe. Agora vamos, antes que comece a chover!", en: "I did. Now let's go, before it starts raining!" }
      - { speaker: Thiago, es: "Para você ficar feliz, eu até corro!", en: "To make you happy, I'll even run!" }
    questions:
      - { q: "A que horas começa a Vesperata?", options: ["Às sete", "Às oito", "Às nove"], answer: 1, explain: "A Vesperata só começa às oito." }
      - { q: "Por que a Juliana quer sair cedo?", options: ["Para pegar uma mesa boa", "Para jantar antes", "Para ver o pôr do sol"], answer: 0, explain: "Precisamos sair agora para a gente pegar uma mesa boa." }
      - { q: "Por que a Juliana ligou para o restaurante?", options: ["Para eles guardarem uma mesa", "Para cancelar a reserva", "Para pedir o cardápio"], answer: 0, explain: "Liguei para o restaurante para eles guardarem uma mesa." }
      - { q: "Por que o Thiago vai pegar o casaco?", options: ["Porque vai chover", "Para não passar frio", "Para dar à Juliana"], answer: 1, explain: "Deixa eu pegar o casaco para não passar frio." }
