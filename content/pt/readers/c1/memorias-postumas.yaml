id: r.c1.memorias-postumas
level: c1
title: "Memórias póstumas: um defunto autor"
kind: literature
author: Machado de Assis (1839–1908)
source: "Memórias Póstumas de Brás Cubas (1881): dedicatória, «Ao leitor» (excerto), capítulos I («Óbito do autor») e II («O emplasto», excerto) e capítulo CLX («Das negativas»). Ortografia atualizada; cortes marcados com (…). Domínio público."
intro: "The novel that changed Brazilian literature is narrated by a dead man. Brás Cubas dedicates his book to a worm, warns that he will have few readers, describes his own funeral and closes with a bitter balance sheet of his life. Enjoy the irony, the play on word order (autor defunto / defunto autor) and the formal register, including the archaic vós."
allow: [hamlet, undiscovered, country, brás, cubas, stendhal, sterne, xavier, maistre, moisés, pentateuco, catumbi, plácida, quincas, borba, califa]
paragraphs:
  - { es: "DEDICATÓRIA. Ao verme que primeiro roeu as frias carnes do meu cadáver dedico como saudosa lembrança estas Memórias Póstumas.", en: "DEDICATION. To the worm that first gnawed the cold flesh of my corpse I dedicate, as a fond remembrance, these posthumous memoirs." }
  - { es: "AO LEITOR. Que Stendhal confessasse haver escrito um de seus livros para cem leitores, coisa é que admira e consterna. O que não admira, nem provavelmente consternará é se este outro livro não tiver os cem leitores de Stendhal, nem cinquenta, nem vinte, e quando muito, dez. Dez? Talvez cinco. Trata-se, na verdade, de uma obra difusa, na qual eu, Brás Cubas, se adotei a forma livre de um Sterne, ou de um Xavier de Maistre, não sei se lhe meti algumas rabugens de pessimismo. Pode ser. Obra de finado. Escrevi-a com a pena da galhofa e a tinta da melancolia, e não é difícil antever o que poderá sair desse conúbio.", en: "TO THE READER. That Stendhal should confess to having written one of his books for a hundred readers is something that astonishes and dismays. What will not astonish, nor probably dismay, is if this other book does not have Stendhal's hundred readers, nor fifty, nor twenty, and at most ten. Ten? Perhaps five. It is, in truth, a rambling work, in which I, Brás Cubas, if I have adopted the free form of a Sterne or a Xavier de Maistre, may have slipped in some grumblings of pessimism. It may be so. The work of a dead man. I wrote it with the pen of mockery and the ink of melancholy, and it is not hard to foresee what may come of such a marriage." }
  - { es: "ÓBITO DO AUTOR. Algum tempo hesitei se devia abrir estas memórias pelo princípio ou pelo fim, isto é, se poria em primeiro lugar o meu nascimento ou a minha morte. Suposto o uso vulgar seja começar pelo nascimento, duas considerações me levaram a adotar diferente método: a primeira é que eu não sou propriamente um autor defunto, mas um defunto autor, para quem a campa foi outro berço; a segunda é que o escrito ficaria assim mais galante e mais novo. Moisés, que também contou a sua morte, não a pôs no intróito, mas no cabo: diferença radical entre este livro e o Pentateuco.", en: "THE AUTHOR'S DEATH. For some time I hesitated whether to open these memoirs at the beginning or at the end, that is, whether to put my birth or my death first. Although common usage is to begin with the birth, two considerations led me to adopt a different method: the first is that I am not exactly an author who has died, but a dead man who has become an author, for whom the grave was a second cradle; the second is that the writing would thus be more elegant and more novel. Moses, who also told of his own death, did not put it at the beginning but at the end: a radical difference between this book and the Pentateuch." }
  - { es: "Dito isto, expirei às duas horas da tarde de uma sexta-feira do mês de agosto de 1869, na minha bela chácara de Catumbi. Tinha uns sessenta e quatro anos, rijos e prósperos, era solteiro, possuía cerca de trezentos contos e fui acompanhado ao cemitério por onze amigos. Onze amigos! Verdade é que não houve cartas nem anúncios.", en: "That said, I expired at two o'clock in the afternoon on a Friday in the month of August 1869, at my fine country house in Catumbi. I was some sixty-four years old, sturdy and prosperous years; I was a bachelor, I owned about three hundred contos, and I was accompanied to the cemetery by eleven friends. Eleven friends! It is true that there were no letters or announcements." }
  - { es: "Acresce que chovia — peneirava — uma chuvinha miúda, triste e constante, tão constante e tão triste, que levou um daqueles fiéis da última hora a intercalar esta engenhosa ideia no discurso que proferiu à beira de minha cova: — “Vós, que o conhecestes, meus senhores, vós podeis dizer comigo que a natureza parece estar chorando a perda irreparável de um dos mais belos caracteres que têm honrado a humanidade. Este ar sombrio, estas gotas do céu, aquelas nuvens escuras que cobrem o azul como um crepe funéreo, tudo isso é a dor crua e má que lhe rói à Natureza as mais íntimas entranhas; tudo isso é um sublime louvor ao nosso ilustre finado.”", en: "What is more, it was raining — drizzling — a fine, sad, steady little rain, so steady and so sad that it led one of those faithful friends of the final hour to insert this ingenious idea into the speech he delivered at the edge of my grave: 'You who knew him, gentlemen, you can say with me that nature seems to be weeping for the irreparable loss of one of the finest characters that have ever honoured humanity. This gloomy air, these drops from heaven, those dark clouds that cover the blue like a funeral crape, all this is the raw, cruel grief that gnaws at nature's innermost depths; all this is a sublime tribute to our illustrious departed.'" }
  - { es: "Bom e fiel amigo! Não, não me arrependo das vinte apólices que lhe deixei. (…) E foi assim que cheguei à cláusula dos meus dias; foi assim que me encaminhei para o undiscovered country de Hamlet, sem as ânsias nem as dúvidas do moço príncipe, mas pausado e trôpego, como quem se retira tarde do espetáculo. Tarde e aborrecido.", en: "Good and faithful friend! No, I do not regret the twenty bonds I left him. (…) And that was how I reached the close of my days; that was how I set out for Hamlet's undiscovered country, without the anxieties or doubts of the young prince, but slow and stumbling, like someone who leaves the show late. Late and bored." }
  - { es: "O EMPLASTO. Com efeito, um dia de manhã, estando a passear na chácara, pendurou-se-me uma ideia no trapézio que eu tinha no cérebro. Uma vez pendurada, entrou a bracejar, a pernear, a fazer as mais arrojadas cabriolas de volatim, que é possível crer. Eu deixei-me estar a contemplá-la. Súbito, deu um grande salto, estendeu os braços e as pernas, até tomar a forma de um X: decifra-me ou devoro-te. Essa ideia era nada menos que a invenção de um medicamento sublime, um emplastro anti-hipocondríaco, destinado a aliviar a nossa melancólica humanidade. (…)", en: "THE PLASTER. Indeed, one morning, as I was walking in my garden, an idea hung itself on the trapeze I had in my brain. Once hanging there, it began to wave its arms, to kick its legs, to perform the most daring acrobat's somersaults imaginable. I stayed there contemplating it. Suddenly it made a great leap, stretched out its arms and legs until it took the shape of an X: decipher me or I devour you. That idea was nothing less than the invention of a sublime medicine, an anti-hypochondriac plaster, intended to relieve our melancholy humanity. (…)" }
  - { es: "DAS NEGATIVAS. Este último capítulo é todo de negativas. Não alcancei a celebridade do emplasto, não fui ministro, não fui califa, não conheci o casamento. Verdade é que, ao lado dessas faltas, coube-me a boa fortuna de não comprar o pão com o suor do meu rosto. Mais; não padeci a morte de D. Plácida, nem a semidemência do Quincas Borba.", en: "ON NEGATIVES. This last chapter is all negatives. I did not achieve the fame of the plaster, I was not a minister, I was not a caliph, I did not know marriage. It is true that, alongside these lacks, I had the good fortune of not earning my bread by the sweat of my brow. What is more, I did not suffer the death of Dona Plácida, nor the half-madness of Quincas Borba." }
  - { es: "Somadas umas coisas e outras, qualquer pessoa imaginará que não houve míngua nem sobra, e conseguintemente que saí quite com a vida. E imaginará mal; porque ao chegar a este outro lado do mistério, achei-me com um pequeno saldo, que é a derradeira negativa deste capítulo de negativas: — Não tive filhos, não transmiti a nenhuma criatura o legado da nossa miséria.", en: "Adding up one thing and another, anyone will imagine that there was neither shortfall nor surplus, and consequently that I came out even with life. And they will imagine wrongly; for on reaching this other side of the mystery, I found myself with a small balance, which is the last negative of this chapter of negatives: I had no children, I did not pass on to any creature the legacy of our misery." }
questions:
  - { q: "A quem Brás Cubas dedica o livro?", options: ["Aos onze amigos do enterro", "A Stendhal", "Ao verme que primeiro roeu o seu cadáver", "Aos cem leitores"], answer: 2, explain: "The famous dedication is to the worm that first gnawed his corpse — a grotesque, ironic opening." }
  - { q: "Qual é a diferença entre “autor defunto” e “defunto autor”?", options: ["Um autor que morreu, e um morto que se tornou autor depois da morte", "Não há diferença", "Um autor famoso e um autor desconhecido", "Um autor jovem e um velho"], answer: 0, explain: "Word order changes the meaning: Brás Cubas did not write and then die; he began writing after death, so the grave was 'another cradle'." }
  - { q: "Por que, segundo o narrador, o livro terá poucos leitores?", options: ["Porque é muito caro", "Porque é uma obra difusa, escrita com a pena da galhofa e a tinta da melancolia", "Porque foi proibido", "Porque está em francês"], answer: 1, explain: "He predicts at most ten readers — perhaps five — for a rambling book that mixes mockery and melancholy." }
  - { q: "O que o amigo diz da chuva no discurso do enterro?", options: ["Que vai estragar a cerimônia", "Que é comum em agosto", "Que é a natureza chorando a perda do morto", "Que todos devem ir embora"], answer: 2, explain: "He turns the drizzle into a flattering image of nature weeping. Brás Cubas then reveals he left this friend twenty bonds — the praise was not disinterested." }
  - { q: "Qual é o “pequeno saldo” do último capítulo?", options: ["Trezentos contos", "Não ter tido filhos e não ter transmitido a ninguém o legado da nossa miséria", "Ter sido ministro", "Ter tido onze amigos"], answer: 1, explain: "The bitter final line: the only positive balance of his life is a negative — he passed on human misery to no child." }
