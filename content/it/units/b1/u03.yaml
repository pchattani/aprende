id: b1.u03
title: "Mi piacerebbe vivere a Bologna"
lessons:
  - id: b1.u03.l1
    title: Cerco casa sotto i portici
    teach: [g.condizionale-uses]
    vocab: [w.fuorisede, w.coinquilino, w.contratto, w.caparra, w.agenzia-immobiliare, w.annuncio, w.monolocale, w.bilocale, w.arredato, w.arredare, w.ristrutturare, w.traslocare, w.convivere, w.portico, w.periferia, w.vivibile, w.servizi, w.trasporti-pubblici, w.qualità-della-vita, w.costo-della-vita, w.spese, w.ideale, w.ideale.n, w.preferibile, w.sentirsi-a-casa, w.ragionevole]
    tip: "The conditional softens everything: vorrei, potresti, dovresti, direi, preferirei. Al posto tuo… (if I were you) + conditional gives advice."
    sentences:
      - { es: "Mi piacerebbe vivere a Bologna, sotto i portici.", en: "I'd like to live in Bologna, under the porticoes.", altEs: ["Mi piacerebbe abitare a Bologna, sotto i portici."], altEn: ["I would love to live in Bologna, under the arcades."], grammar: [g.condizionale-uses], vocab: [w.portico], error: { wrong: "Mi piacerei vivere a Bologna, sotto i portici.", explain: "piacere agrees with the thing that pleases (vivere a Bologna), so it's third person: mi piacerebbe.", grammar: g.condizionale-uses } }
      - { es: "Vorrei un bilocale arredato in centro, ma costerebbe troppo.", en: "I'd like a furnished two-room flat in the centre, but it would cost too much.", grammar: [g.condizionale-uses], vocab: [w.bilocale, w.arredato] }
      - { es: "Mi faresti vedere l'annuncio dell'agenzia immobiliare?", en: "Would you show me the estate agency's advert?", altEs: ["Mi fai vedere l'annuncio dell'agenzia immobiliare?"], grammar: [g.condizionale-uses], vocab: [w.annuncio, w.agenzia-immobiliare] }
      - { es: "Prima di firmare il contratto, dovresti chiedere quanto è la caparra.", en: "Before signing the contract, you should ask how much the deposit is.", altEs: ["Dovresti chiedere quanto è la caparra prima di firmare il contratto."], grammar: [g.condizionale-uses], vocab: [w.contratto, w.caparra] }
      - { es: "Al posto tuo, cercherei un coinquilino per dividere le spese.", en: "If I were you, I'd look for a flatmate to share the costs.", altEs: ["Io al posto tuo cercherei un coinquilino per dividere le spese."], altEn: ["In your shoes, I'd look for a flatmate to split the bills."], grammar: [g.condizionale-uses], vocab: [w.coinquilino, w.spese] }
      - { es: "Un monolocale in periferia costerebbe meno, ma i trasporti pubblici funzionano bene?", en: "A studio flat in the suburbs would cost less, but does public transport work well?", grammar: [g.condizionale-uses], vocab: [w.monolocale, w.periferia, w.trasporti-pubblici] }
      - { es: "Direi che Bologna è una città molto vivibile.", en: "I'd say Bologna is a very liveable city.", altEs: ["Io direi che Bologna è una città molto vivibile."], grammar: [g.condizionale-uses], vocab: [w.vivibile] }
      - { es: "Sarebbe ideale trovare casa vicino all'università.", en: "It would be ideal to find a place near the university.", altEs: ["L'ideale sarebbe trovare casa vicino all'università."], grammar: [g.condizionale-uses], vocab: [w.ideale, w.ideale.n] }
      - { es: "Preferirei convivere con amici piuttosto che vivere da solo.", en: "I'd rather live with friends than live on my own.", altEs: ["Preferirei convivere con degli amici piuttosto che vivere da solo."], grammar: [g.condizionale-uses], vocab: [w.convivere] }
      - { es: "Bisognerebbe ristrutturare la cucina: è proprio vecchia.", en: "The kitchen ought to be renovated: it's really old.", altEs: ["Bisognerebbe ristrutturare la cucina, è davvero vecchia."], grammar: [g.condizionale-uses], vocab: [w.ristrutturare] }
      - { es: "Puoi aiutarmi a traslocare sabato?", en: "Can you help me move house on Saturday?", grammar: [g.condizionale-uses], vocab: [w.traslocare], transform: { instruction: "Make the request more polite with the conditional", answer: "Potresti aiutarmi a traslocare sabato?", alt: ["Mi potresti aiutare a traslocare sabato?"], en: "Could you help me move house on Saturday?" } }
      - { es: "Voglio un caffè e una brioche.", en: "I want a coffee and a croissant.", grammar: [g.condizionale-uses], vocab: [], transform: { instruction: "Make it polite with the conditional", answer: "Vorrei un caffè e una brioche.", alt: ["Vorrei un caffè e una brioche, per favore."], en: "I'd like a coffee and a croissant." } }
      - { es: "Il costo della vita qui è alto, ma la qualità della vita sarebbe migliore.", en: "The cost of living here is high, but the quality of life would be better.", grammar: [g.condizionale-uses], vocab: [w.costo-della-vita, w.qualità-della-vita] }
      - { es: "Non saprei: forse sarebbe preferibile un quartiere con più servizi.", en: "I wouldn't know: maybe a neighbourhood with more amenities would be preferable.", grammar: [g.condizionale-uses], vocab: [w.preferibile, w.servizi] }
      - { es: "Con un balcone sui portici mi sentirei subito a casa.", en: "With a balcony over the porticoes I'd feel at home straight away.", grammar: [g.condizionale-uses], vocab: [w.sentirsi-a-casa, w.portico] }
      - { es: "Per una studentessa fuorisede, trecento euro al mese sarebbe un prezzo ragionevole.", altEs: ["Per una studentessa fuorisede, trecento euro al mese sarebbero un prezzo ragionevole."], en: "For a student living away from home, three hundred euros a month would be a reasonable price.", grammar: [g.condizionale-uses], vocab: [w.fuorisede, w.ragionevole] }
    exchanges:
      - q: { es: "Dove ti piacerebbe vivere?", en: "Where would you like to live?" }
        a: { es: "Mi piacerebbe vivere a Bologna, vicino all'università.", en: "I'd like to live in Bologna, near the university." }
        alt: ["A Bologna, sotto i portici.", "Mi piacerebbe vivere sul lago di Como."]
        grammar: [g.condizionale-uses]
        vocab: [w.portico]
      - q: { es: "Mi passeresti il sale?", en: "Would you pass me the salt?" }
        a: { es: "Certo, eccolo.", en: "Of course, here it is." }
        alt: ["Ecco a te.", "Sì, tieni."]
        grammar: [g.condizionale-uses]
        vocab: []
      - q: { es: "Che cosa faresti al posto mio?", en: "What would you do in my place?" }
        a: { es: "Firmerei il contratto: la casa è bellissima.", en: "I'd sign the contract: the house is beautiful." }
        alt: ["Io aspetterei ancora un po'.", "Cercherei qualcosa di più economico."]
        grammar: [g.condizionale-uses]
        vocab: [w.contratto]
      - q: { es: "Ti andrebbe di vedere un bilocale con me domani?", en: "Would you fancy seeing a two-room flat with me tomorrow?" }
        a: { es: "Volentieri, ma preferirei la mattina.", en: "Gladly, but I'd prefer the morning." }
        alt: ["Mi piacerebbe, ma domani lavoro.", "Certo, a che ora?"]
        grammar: [g.condizionale-uses]
        vocab: [w.bilocale]
      - q: { es: "Quanto costa un monolocale in centro?", en: "How much is a studio flat in the centre?" }
        a: { es: "Direi almeno settecento euro al mese, più le spese.", en: "I'd say at least seven hundred euros a month, plus bills." }
        alt: ["Non saprei, dovresti chiedere all'agenzia.", "Direi settecento euro."]
        grammar: [g.condizionale-uses]
        vocab: [w.monolocale, w.spese]
    texts:
      - title: "Annuncio"
        es: ["Bilocale arredato sotto i portici, zona università.", "Ideale per due studenti fuorisede o una coppia.", "Caparra di due mesi, spese a parte: chiamare l'agenzia immobiliare dopo le 15."]
        en: ["Furnished two-room flat under the porticoes, university area.", "Ideal for two students from out of town or a couple.", "Two months' deposit, bills extra: call the estate agency after 3 pm."]
        grammar: [g.condizionale-uses]
        vocab: [w.bilocale, w.arredato, w.ideale, w.caparra]
      - title: "Messaggio a un'amica"
        es: ["Ciao Marta! Ti andrebbe di venire a vivere con me a Bologna?", "Divideremmo le spese e avremmo una casa più grande.", "Pensaci e fammi sapere!"]
        en: ["Hi Marta! Would you like to come and live with me in Bologna?", "We'd split the bills and we'd have a bigger place.", "Think about it and let me know!"]
        grammar: [g.condizionale-uses]
        vocab: [w.spese]
    spicy:
      - { es: "Mi piacerebbe convivere con te, ma prima dovresti imparare a lavare i piatti.", en: "I'd love to live with you, but first you'd have to learn to wash the dishes.", grammar: [g.condizionale-uses], vocab: [w.convivere] }
      - { es: "Ti andrebbe di cercare casa insieme? Io porterei il divano, tu il vino.", en: "Would you fancy looking for a place together? I'd bring the sofa, you'd bring the wine.", grammar: [g.condizionale-uses], vocab: [] }
      - { es: "Al posto tuo, non lo lascerei uscire da solo: è troppo carino.", en: "If I were you, I wouldn't let him go out alone: he's too cute.", grammar: [g.condizionale-uses], vocab: [] }
      - { es: "Un coinquilino come te sarebbe ideale: simpatico, ordinato e con quegli occhi.", en: "A flatmate like you would be ideal: nice, tidy and with those eyes.", grammar: [g.condizionale-uses], vocab: [w.coinquilino, w.ideale] }
  - id: b1.u03.l2
    title: Avrei voluto studiare qui
    teach: [g.condizionale-passato]
    vocab: [w.avrei-voluto, w.dotto, w.universitario, w.ateneo, w.facoltà, w.iscriversi, w.iscrizione, w.aula, w.docente, w.borsa-di-studio, w.frequentare, w.appunti, w.biblioteca-universitaria, w.ricerca, w.laureato, w.master, w.dottorato, w.cambiamento, w.scelta, w.decisione, w.ingegneria]
    tip: "avrei / sarei + participle = would have. Italian also uses it for the future seen from the past: Ha detto che sarebbe venuto (He said he would come)."
    sentences:
      - { es: "Avrei voluto studiare a Bologna, nell'ateneo più antico del mondo occidentale.", en: "I'd have liked to study in Bologna, at the oldest university in the Western world.", grammar: [g.condizionale-passato], vocab: [w.avrei-voluto, w.ateneo] }
      - { es: "Mi sarei iscritta a Lettere, ma i miei genitori volevano Medicina.", en: "I'd have enrolled in Humanities, but my parents wanted Medicine.", grammar: [g.condizionale-passato], vocab: [w.iscriversi] }
      - { es: "Il docente aveva detto che avrebbe pubblicato i voti entro venerdì.", en: "The lecturer had said he would publish the marks by Friday.", grammar: [g.condizionale-passato], vocab: [w.docente], error: { wrong: "Il docente aveva detto che pubblicherebbe i voti entro venerdì.", explain: "The future seen from the past needs the past conditional: avrebbe pubblicato.", grammar: g.condizionale-passato } }
      - { es: "Pensavo che l'aula sarebbe stata piena, invece c'erano dieci studenti.", en: "I thought the lecture hall would be full, but there were ten students.", grammar: [g.condizionale-passato], vocab: [w.aula] }
      - { es: "Mi avevi promesso che mi avresti prestato gli appunti!", en: "You promised you would lend me your notes!", altEs: ["Mi avevi promesso che mi avresti dato gli appunti!"], grammar: [g.condizionale-passato], vocab: [w.appunti] }
      - { es: "Con una borsa di studio avrei frequentato anche il master.", en: "With a scholarship I would have done the master's too.", grammar: [g.condizionale-passato], vocab: [w.borsa-di-studio, w.frequentare, w.master] }
      - { es: "Sapevo che la facoltà di ingegneria ti sarebbe piaciuta.", en: "I knew you'd like the engineering faculty.", grammar: [g.condizionale-passato], vocab: [w.facoltà, w.ingegneria] }
      - { es: "Al posto tuo, avrei fatto il dottorato in Germania.", en: "In your place, I'd have done my PhD in Germany.", grammar: [g.condizionale-passato], vocab: [w.dottorato] }
      - { es: "Ha detto: «Passo in biblioteca dopo pranzo».", en: "He said: 'I'll drop by the library after lunch.'", grammar: [g.condizionale-passato], vocab: [w.biblioteca-universitaria], transform: { instruction: "Report it: Ha detto che…", answer: "Ha detto che sarebbe passato in biblioteca dopo pranzo.", alt: [], en: "He said he would drop by the library after lunch." } }
      - { es: "Volevo vederti alla festa dell'università.", en: "I wanted to see you at the university party.", grammar: [g.condizionale-passato], vocab: [w.universitario], transform: { instruction: "Express regret with the past conditional", answer: "Avrei voluto vederti alla festa dell'università.", alt: [], en: "I would have liked to see you at the university party." } }
      - { es: "Senza quella decisione, non mi sarei mai laureata.", en: "Without that decision, I'd never have graduated.", grammar: [g.condizionale-passato], vocab: [w.decisione] }
      - { es: "Era una scelta difficile: chiunque avrebbe avuto paura.", en: "It was a difficult choice: anyone would have been scared.", grammar: [g.condizionale-passato], vocab: [w.scelta] }
      - { es: "L'iscrizione costava troppo: avremmo pagato più di mille euro.", en: "Enrolment cost too much: we would have paid more than a thousand euros.", grammar: [g.condizionale-passato], vocab: [w.iscrizione] }
      - { es: "Ci sarebbe piaciuto fare ricerca, ma non c'erano fondi.", en: "We'd have liked to do research, but there was no funding.", grammar: [g.condizionale-passato], vocab: [w.ricerca] }
      - { es: "Un cambiamento così grande? Non l'avrei mai detto!", en: "Such a big change? I'd never have thought it!", altEn: ["Such a big change? I'd never have guessed!"], grammar: [g.condizionale-passato], vocab: [w.cambiamento] }
      - { es: "Sapevo che la vita universitaria mi sarebbe mancata: da laureato, sarei rimasto volentieri a Bologna.", en: "I knew I'd miss university life: as a graduate, I'd gladly have stayed in Bologna.", grammar: [g.condizionale-passato], vocab: [w.universitario, w.laureato] }
    exchanges:
      - q: { es: "Perché non sei venuto alla lezione?", en: "Why didn't you come to the lecture?" }
        a: { es: "Sarei venuto volentieri, ma avevo la febbre.", en: "I'd gladly have come, but I had a temperature." }
        alt: ["Sarei venuto, ma il treno era in ritardo.", "Avevo la febbre."]
        grammar: [g.condizionale-passato]
        vocab: []
      - q: { es: "Che cosa avresti voluto studiare?", en: "What would you have liked to study?" }
        a: { es: "Avrei voluto studiare architettura.", en: "I'd have liked to study architecture." }
        alt: ["Avrei studiato musica.", "Architettura, ma ho scelto economia."]
        grammar: [g.condizionale-passato]
        vocab: [w.avrei-voluto]
      - q: { es: "Ti ha restituito gli appunti?", en: "Did she give you your notes back?" }
        a: { es: "No, aveva detto che me li avrebbe portati ieri.", en: "No, she'd said she would bring them to me yesterday." }
        alt: ["No, non ancora.", "Sì, me li ha dati stamattina."]
        grammar: [g.condizionale-passato, g.combined-pronouns]
        vocab: [w.appunti]
      - q: { es: "Com'è andato l'esame?", en: "How did the exam go?" }
        a: { es: "Male: avrei preferito un docente meno rigido.", en: "Badly: I'd have preferred a less strict lecturer." }
        alt: ["Benissimo!", "Così così: avrei dovuto studiare di più."]
        grammar: [g.condizionale-passato]
        vocab: [w.docente]
      - q: { es: "Ti sei iscritta al master?", en: "Did you enrol on the master's?" }
        a: { es: "Sì, ma senza la borsa di studio non l'avrei mai fatto.", en: "Yes, but without the scholarship I'd never have done it." }
        alt: ["Sì, finalmente!", "No, costava troppo."]
        grammar: [g.condizionale-passato]
        vocab: [w.master, w.borsa-di-studio]
    texts:
      - title: "Bologna, la Dotta"
        es: ["La chiamano la Dotta per la sua università, fondata secondo la tradizione nel 1088.", "Da ragazzo avrei voluto studiare qui, sotto i portici.", "Ci sarei venuto anche a piedi!"]
        en: ["They call it the Learned for its university, traditionally founded in 1088.", "As a young man I'd have liked to study here, under the porticoes.", "I'd have come here even on foot!"]
        grammar: [g.condizionale-passato]
        vocab: [w.dotto, w.avrei-voluto]
    spicy:
      - { es: "Avrei voluto studiare con te in biblioteca, ma con te vicino non avrei imparato niente.", en: "I'd have liked to study with you in the library, but with you nearby I wouldn't have learnt a thing.", grammar: [g.condizionale-passato], vocab: [w.avrei-voluto] }
      - { es: "Mi avevi detto che saresti passato alle otto: sono le nove e sono pronta da un'ora.", en: "You told me you'd come by at eight: it's nine and I've been ready for an hour.", grammar: [g.condizionale-passato], vocab: [] }
      - { es: "Avrei frequentato tutte le lezioni del professore di storia, e non per la storia.", en: "I'd have attended all the history professor's lectures, and not for the history.", grammar: [g.condizionale-passato], vocab: [w.frequentare] }
      - { es: "Sapevo che mi avresti scritto: nessuno resiste ai miei appunti.", en: "I knew you'd write to me: nobody can resist my notes.", grammar: [g.condizionale-passato], vocab: [w.appunti] }
  - id: b1.u03.l3
    title: Avremmo dovuto prenotare
    teach: [g.modals-condizionale-passato]
    vocab: [w.occasione, w.opportunità, w.possibilità, w.situazione, w.nebbioso, w.clima, w.rendere, w.vale-la-pena, w.musicale, w.mortadella, w.tortellini, w.tagliatelle, w.ragù, w.lasagne, w.battello, w.adorare]
    tip: "Avrei dovuto = I should have, avrei potuto = I could have, avrei voluto = I would have liked to. In speech you'll also hear dovevi / potevi."
    sentences:
      - { es: "Avremmo dovuto prenotare il battello per Bellagio.", en: "We should have booked the boat to Bellagio.", altEs: ["Avremmo dovuto prenotare il battello per andare a Bellagio."], grammar: [g.modals-condizionale-passato], vocab: [w.battello] }
      - { es: "Avresti potuto dirmelo prima!", en: "You could have told me earlier!", altEs: ["Me lo avresti potuto dire prima!", "Potevi dirmelo prima!"], grammar: [g.modals-condizionale-passato], vocab: [] }
      - { es: "Dovevi chiamarmi!", en: "You should have called me!", grammar: [g.modals-condizionale-passato], vocab: [], transform: { instruction: "Use the past conditional of dovere", answer: "Avresti dovuto chiamarmi!", alt: ["Mi avresti dovuto chiamare!"], en: "You should have called me!" } }
      - { es: "Potevi aspettarci!", en: "You could have waited for us!", grammar: [g.modals-condizionale-passato], vocab: [], transform: { instruction: "Use the past conditional of potere", answer: "Avresti potuto aspettarci!", alt: ["Ci avresti potuto aspettare!"], en: "You could have waited for us!" } }
      - { es: "La mattina era nebbiosa: saremmo dovuti partire più tardi.", en: "The morning was foggy: we should have left later.", altEs: ["La mattina era nebbiosa: avremmo dovuto partire più tardi."], grammar: [g.modals-condizionale-passato], vocab: [w.nebbioso] }
      - { es: "Non avresti dovuto mangiare tutti i tortellini da solo!", en: "You shouldn't have eaten all the tortellini by yourself!", grammar: [g.modals-condizionale-passato], vocab: [w.tortellini] }
      - { es: "Potevi avvisarmi: avrei portato il costume.", en: "You could have warned me: I'd have brought my swimsuit.", altEs: ["Avresti potuto avvisarmi: avrei portato il costume."], grammar: [g.modals-condizionale-passato, g.condizionale-passato], vocab: [] }
      - { es: "Era un'occasione unica: avresti dovuto accettare.", en: "It was a unique opportunity: you should have accepted.", grammar: [g.modals-condizionale-passato], vocab: [w.occasione] }
      - { es: "Avrei dovuto studiare di più.", en: "I should have studied more.", altEs: ["Dovevo studiare di più."], grammar: [g.modals-condizionale-passato], vocab: [], error: { wrong: "Dovrei avere studiato di più.", explain: "Italian puts the modal in the past conditional and keeps the infinitive simple: avrei dovuto studiare.", grammar: g.modals-condizionale-passato } }
      - { es: "Con questo clima, sarebbe valsa la pena restare un'altra settimana.", en: "With this weather, it would have been worth staying another week.", grammar: [g.modals-condizionale-passato, g.condizionale-passato], vocab: [w.clima, w.vale-la-pena] }
      - { es: "Avrei potuto fare una carriera musicale, ma ho scelto ingegneria.", en: "I could have had a career in music, but I chose engineering.", grammar: [g.modals-condizionale-passato], vocab: [w.musicale, w.ingegneria] }
      - { es: "Non avreste dovuto ordinare anche le lasagne: bastavano le tagliatelle al ragù.", en: "You shouldn't have ordered the lasagne too: the tagliatelle with ragù was enough.", grammar: [g.modals-condizionale-passato], vocab: [w.lasagne, w.tagliatelle, w.ragù] }
      - { es: "La mortadella? Avresti dovuto assaggiarla a Bologna!", en: "Mortadella? You should have tasted it in Bologna!", grammar: [g.modals-condizionale-passato], vocab: [w.mortadella] }
      - { es: "In quella situazione, che cosa avresti potuto fare?", en: "In that situation, what could you have done?", grammar: [g.modals-condizionale-passato], vocab: [w.situazione] }
      - { es: "Ho perso un'opportunità: avrei dovuto rispondere subito alla mail.", en: "I missed an opportunity: I should have answered the email straight away.", grammar: [g.modals-condizionale-passato], vocab: [w.opportunità] }
      - { es: "Avevamo la possibilità di vedere il lago dall'alto, ma la gita non ci ha reso felici: avremmo voluto più tempo.", en: "We had the chance to see the lake from above, but the trip didn't make us happy: we'd have liked more time.", grammar: [g.modals-condizionale-passato], vocab: [w.possibilità, w.rendere] }
    exchanges:
      - q: { es: "Com'è stata la gita sul lago?", en: "How was the trip on the lake?" }
        a: { es: "Bella, ma avremmo dovuto partire prima.", en: "Lovely, but we should have left earlier." }
        alt: ["Bellissima!", "Bella, ma avremmo dovuto prenotare il battello."]
        grammar: [g.modals-condizionale-passato]
        vocab: []
      - q: { es: "Perché non mi hai chiamato?", en: "Why didn't you call me?" }
        a: { es: "Hai ragione, avrei dovuto farlo.", en: "You're right, I should have." }
        alt: ["Scusa, avrei dovuto chiamarti.", "Avrei voluto, ma non avevo campo."]
        grammar: [g.modals-condizionale-passato]
        vocab: []
      - q: { es: "Valeva la pena andare fino a Bellagio?", en: "Was it worth going all the way to Bellagio?" }
        a: { es: "Sì, ne è valsa la pena: è stupenda.", en: "Yes, it was worth it: it's stunning." }
        alt: ["Sì, assolutamente.", "No, avremmo dovuto restare a Como."]
        grammar: [g.modals-condizionale-passato]
        vocab: [w.vale-la-pena]
      - q: { es: "Hai visitato le ville sul lago?", en: "Did you visit the villas on the lake?" }
        a: { es: "No, avrei voluto, ma non c'era tempo.", en: "No, I'd have liked to, but there wasn't time." }
        alt: ["Solo una, avrei voluto vederne di più.", "Sì, tutte!"]
        grammar: [g.modals-condizionale-passato]
        vocab: []
      - q: { es: "Potevi prendere il treno, no?", en: "You could have taken the train, couldn't you?" }
        a: { es: "Sì, avrei potuto, ma non c'erano più posti.", en: "Yes, I could have, but there were no seats left." }
        alt: ["Avrei potuto, ma era troppo tardi.", "Sì, hai ragione."]
        grammar: [g.modals-condizionale-passato]
        vocab: []
    texts:
      - title: "Cartolina da Como"
        es: ["Cari mamma e papà, il lago è stupendo, anche se il clima è un po' nebbioso.", "Avremmo dovuto restare almeno un'altra notte.", "Voi avreste adorato le ville sull'acqua!"]
        en: ["Dear Mum and Dad, the lake is stunning, even if the weather is a bit foggy.", "We should have stayed at least one more night.", "You would have loved the villas on the water!"]
        grammar: [g.modals-condizionale-passato, g.condizionale-passato]
        vocab: [w.clima, w.nebbioso, w.adorare]
    spicy:
      - { es: "Avresti dovuto vedere la tua faccia quando ti ho baciato sul battello!", en: "You should have seen your face when I kissed you on the boat!", grammar: [g.modals-condizionale-passato], vocab: [w.battello] }
      - { es: "Avrei potuto dirti di no, ma il lago era troppo romantico.", en: "I could have said no to you, but the lake was too romantic.", grammar: [g.modals-condizionale-passato], vocab: [] }
      - { es: "Saresti dovuto venire a Como con me: tramonto, lago e nessuna suocera.", en: "You should have come to Como with me: sunset, lake and no mother-in-law.", altEs: ["Avresti dovuto venire a Como con me: tramonto, lago e nessuna suocera."], grammar: [g.modals-condizionale-passato], vocab: [] }
      - { es: "Non avrei dovuto mangiare i tuoi tortellini, ma erano buonissimi, come te.", en: "I shouldn't have eaten your tortellini, but they were delicious, like you.", grammar: [g.modals-condizionale-passato], vocab: [w.tortellini] }
  - id: b1.u03.l4
    title: Secondo i giornali…
    teach: [g.condizionale-hearsay]
    vocab: [w.probabile, w.pare, w.secondo.prep, w.a-quanto-pare, w.voce, w.stando-a, w.fuggire]
    tip: "In the news the conditional means 'reportedly': sarebbe fuggito = he allegedly escaped. Translate it with apparently, reportedly, allegedly."
    sentences:
      - { es: "Secondo i giornali, un famoso attore avrebbe comprato una villa sul lago.", en: "According to the papers, a famous actor has reportedly bought a villa on the lake.", grammar: [g.condizionale-hearsay], vocab: [w.secondo.prep] }
      - { es: "A quanto pare, il nuovo bar sotto i portici sarebbe già chiuso.", en: "Apparently the new bar under the porticoes has already closed.", grammar: [g.condizionale-hearsay], vocab: [w.a-quanto-pare, w.portico] }
      - { es: "Stando alle prime notizie, non ci sarebbero feriti.", en: "According to early reports, there are no injuries.", grammar: [g.condizionale-hearsay], vocab: [w.stando-a] }
      - { es: "Gira voce che la cantante si sarebbe sposata in segreto a Bellagio.", en: "Rumour has it the singer secretly got married in Bellagio.", grammar: [g.condizionale-hearsay], vocab: [w.voce] }
      - { es: "Il ladro è fuggito in barca.", en: "The thief escaped by boat.", grammar: [g.condizionale-hearsay], vocab: [w.fuggire], transform: { instruction: "Report it as unconfirmed news", answer: "Il ladro sarebbe fuggito in barca.", alt: ["Secondo la polizia, il ladro sarebbe fuggito in barca."], en: "The thief allegedly escaped by boat." } }
      - { es: "Secondo i testimoni, il ladro sarebbe fuggito in barca.", en: "According to witnesses, the thief allegedly escaped by boat.", grammar: [g.condizionale-hearsay], vocab: [w.fuggire, w.secondo.prep], error: { wrong: "Secondo i testimoni, il ladro avrebbe fuggito in barca.", explain: "fuggire takes essere, so the past conditional is sarebbe fuggito.", grammar: g.condizionale-hearsay } }
      - { es: "Secondo la polizia, l'incendio sarebbe partito dalla cucina del ristorante.", en: "According to the police, the fire apparently started in the restaurant kitchen.", grammar: [g.condizionale-hearsay], vocab: [w.secondo.prep] }
      - { es: "La nuova linea del treno per Bologna sarebbe pronta entro due anni.", en: "The new train line to Bologna will reportedly be ready within two years.", grammar: [g.condizionale-hearsay], vocab: [] }
      - { es: "Stando al meteo, domani pioverebbe su tutto il lago.", en: "According to the forecast, it's going to rain over the whole lake tomorrow.", grammar: [g.condizionale-hearsay], vocab: [w.stando-a] }
      - { es: "Il museo è chiuso per lavori.", en: "The museum is closed for works.", grammar: [g.condizionale-hearsay], vocab: [], transform: { instruction: "Report it as something you've heard, not a fact", answer: "Il museo sarebbe chiuso per lavori.", alt: ["A quanto pare, il museo sarebbe chiuso per lavori."], en: "The museum is apparently closed for works." } }
      - { es: "Il quadro sarebbe stato rubato negli anni Settanta.", en: "The painting was reportedly stolen in the seventies.", grammar: [g.condizionale-hearsay], vocab: [] }
      - { es: "Pare, ma non è sicuro: l'università aprirebbe una nuova sede a Como.", en: "Apparently, though it's not certain, the university is going to open a new campus in Como.", grammar: [g.condizionale-hearsay], vocab: [w.pare] }
      - { es: "Mi hanno detto che Marco sarebbe a Torino, ma non ne sono sicuro.", en: "I've been told Marco is in Turin, but I'm not sure.", grammar: [g.condizionale-hearsay], vocab: [] }
      - { es: "È probabile: secondo l'agenzia, i prezzi delle case salirebbero ancora.", en: "It's likely: according to the agency, house prices are set to rise further.", grammar: [g.condizionale-hearsay], vocab: [w.probabile, w.secondo.prep] }
      - { es: "Gli affitti a Bologna sarebbero saliti del dieci per cento in un anno.", en: "Rents in Bologna have reportedly gone up by ten per cent in a year.", grammar: [g.condizionale-hearsay], vocab: [] }
    exchanges:
      - q: { es: "Hai sentito la notizia?", en: "Have you heard the news?" }
        a: { es: "Sì: a quanto pare, un attore americano avrebbe comprato una villa a Como.", en: "Yes: apparently an American actor has bought a villa on Lake Como." }
        alt: ["No, che cosa è successo?", "Sì, ma non ci credo."]
        grammar: [g.condizionale-hearsay]
        vocab: [w.a-quanto-pare]
      - q: { es: "È vero che chiudono il museo?", en: "Is it true they're closing the museum?" }
        a: { es: "Non si sa: secondo il giornale, chiuderebbe a gennaio.", en: "Nobody knows: according to the paper, it'll close in January." }
        alt: ["Pare di sì.", "Secondo me no."]
        grammar: [g.condizionale-hearsay]
        vocab: [w.secondo.prep]
      - q: { es: "Dov'è Luca? Non lo vedo da giorni.", en: "Where's Luca? I haven't seen him for days." }
        a: { es: "Sarebbe in vacanza sul lago, ma non ne sono sicura.", en: "He's supposed to be on holiday on the lake, but I'm not sure." }
        alt: ["Pare che sia in vacanza.", "Non lo so."]
        grammar: [g.condizionale-hearsay]
        vocab: []
      - q: { es: "Ci sono stati feriti nell'incidente?", en: "Was anyone injured in the accident?" }
        a: { es: "Stando alle prime notizie, no.", en: "According to early reports, no." }
        alt: ["Pare di no.", "Secondo la radio, ci sarebbero due feriti."]
        grammar: [g.condizionale-hearsay]
        vocab: [w.stando-a]
      - q: { es: "Domani fa bello?", en: "Will the weather be nice tomorrow?" }
        a: { es: "Secondo il meteo, pioverebbe tutto il giorno.", en: "According to the forecast, it's going to rain all day." }
        alt: ["Pare di no.", "Secondo il meteo, sì."]
        grammar: [g.condizionale-hearsay]
        vocab: [w.secondo.prep]
    texts:
      - title: "Notizia breve"
        es: ["Como, villa venduta a una star di Hollywood.", "Secondo alcune fonti, l'attore avrebbe pagato più di venti milioni di euro.", "A quanto pare, la villa sarebbe stata ristrutturata da poco."]
        en: ["Como: villa sold to a Hollywood star.", "According to some sources, the actor paid more than twenty million euros.", "Apparently the villa had recently been renovated."]
        grammar: [g.condizionale-hearsay]
        vocab: [w.secondo.prep, w.a-quanto-pare, w.ristrutturare]
      - title: "Voci in facoltà"
        es: ["Gira voce che il professor Neri andrebbe in pensione a giugno.", "Stando ai suoi assistenti, l'esame di luglio sarebbe più facile.", "Ma è solo una voce: studiate lo stesso!"]
        en: ["Rumour has it Professor Neri is retiring in June.", "According to his assistants, the July exam will be easier.", "But it's only a rumour: study anyway!"]
        grammar: [g.condizionale-hearsay]
        vocab: [w.voce, w.stando-a]
    spicy:
      - { es: "Secondo tua sorella, ti saresti innamorato di me al primo aperitivo.", en: "According to your sister, you fell for me at the first aperitivo.", grammar: [g.condizionale-hearsay], vocab: [w.secondo.prep] }
      - { es: "Gira voce che tu balleresti benissimo: dimostramelo stasera.", en: "Rumour has it you dance brilliantly: prove it to me tonight.", grammar: [g.condizionale-hearsay], vocab: [w.voce] }
      - { es: "A quanto pare, il mio ex avrebbe ancora la mia foto nel portafoglio.", en: "Apparently my ex still has my photo in his wallet.", grammar: [g.condizionale-hearsay], vocab: [w.a-quanto-pare] }
      - { es: "Stando ai tuoi amici, saresti timido; stasera però non mi sembri timido per niente.", en: "According to your friends, you're shy; but tonight you don't seem shy at all.", grammar: [g.condizionale-hearsay], vocab: [w.stando-a] }
dialogues:
  - id: b1.u03.d1
    title: Sul battello per Bellagio
    context: Giulia and her friend Tommaso are on the boat across Lake Como. Giulia is thinking about moving to Bologna.
    lines:
      - { speaker: Tommaso, es: "Che vista! Ti piacerebbe vivere qui sul lago?", en: "What a view! Would you like to live here on the lake?" }
      - { speaker: Giulia, es: "Qui no, sarebbe troppo tranquillo. A me piacerebbe vivere a Bologna.", en: "Not here, it would be too quiet. I'd like to live in Bologna." }
      - { speaker: Tommaso, es: "A Bologna? E il tuo lavoro a Milano?", en: "In Bologna? And your job in Milan?" }
      - { speaker: Giulia, es: "Mi hanno offerto una borsa di studio per un master. Secondo la mia docente, sarebbe un'occasione unica.", en: "They've offered me a scholarship for a master's. According to my lecturer, it would be a unique opportunity." }
      - { speaker: Tommaso, es: "E tu che cosa ne pensi?", en: "And what do you think?" }
      - { speaker: Giulia, es: "Accetterei subito, ma gli affitti, a quanto pare, sarebbero molto alti.", en: "I'd accept straight away, but rents are apparently very high." }
      - { speaker: Tommaso, es: "Potresti cercare una coinquilina. Mia cugina aveva detto che avrebbe lasciato il suo bilocale a settembre.", en: "You could look for a flatmate. My cousin had said she would be leaving her two-room flat in September." }
      - { speaker: Giulia, es: "Davvero? Avresti dovuto dirmelo subito!", en: "Really? You should have told me straight away!" }
      - { speaker: Tommaso, es: "Calmati, l'ho saputo ieri! Le scrivo stasera.", en: "Calm down, I only found out yesterday! I'll write to her tonight." }
      - { speaker: Giulia, es: "Al posto tuo, le scriverei adesso: i bilocali sotto i portici spariscono in un giorno.", en: "If I were you, I'd write to her now: two-room flats under the porticoes disappear in a day." }
    questions:
      - { q: "Dove vorrebbe vivere Giulia?", options: ["Sul Lago di Como", "A Bologna", "A Milano"], answer: 1, explain: "A me piacerebbe vivere a Bologna." }
      - { q: "Che cosa le hanno offerto?", options: ["Un lavoro a Milano", "Una borsa di studio per un master", "Un bilocale sul lago"], answer: 1, explain: "Mi hanno offerto una borsa di studio per un master." }
      - { q: "Che cosa preoccupa Giulia?", options: ["Il clima di Bologna", "Gli affitti alti", "La sua docente"], answer: 1, explain: "Gli affitti, a quanto pare, sarebbero molto alti." }
      - { q: "Che cosa farà Tommaso?", options: ["Scriverà a sua cugina", "Cercherà casa a Milano", "Andrà a Bologna con Giulia"], answer: 0, explain: "Le scrivo stasera: he'll write to his cousin." }
