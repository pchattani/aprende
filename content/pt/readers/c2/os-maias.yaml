id: r.c2.os-maias
level: c2
title: "Os Maias: o Ramalhete e a última corrida"
kind: literature
author: Eça de Queirós (1845–1900)
source: "Os Maias (1888), capítulo I (início), capítulo VI (excerto) e capítulo XVIII (excertos e final). Ortografia atualizada (norma europeia); cortes marcados com (…). Domínio público."
intro: "The great novel of nineteenth-century Lisbon follows three generations of the Maia family. You will read the famous opening description of their house, the Ramalhete; a sarcastic remark by João da Ega about a country that imports everything; and the ending, where Carlos and Ega, now middle-aged, conclude that nothing is worth running for — and then run for a tram. Eça writes in European Portuguese: notice assentámos, falhámos (EP past with an accent), enclisis and the ironic precision of his adjectives."
allow: [havana, inglaterra, paris, europa, eça, queirós, maias, maia, ramalhete, lisboa, francisco, paula, janelas, verdes, maria, carlos, joão, ega, santos, aterro, jesuítas]
paragraphs:
  - { es: "Eça de Queirós passou grande parte da vida fora de Portugal, como cônsul em Havana, em Inglaterra e, por fim, em Paris, onde morreu. Talvez por isso tenha visto o seu país com tanta lucidez e tanta ironia. Os Maias, publicado em 1888, é ao mesmo tempo a tragédia de uma família e o retrato satírico da alta sociedade lisboeta do seu tempo: os políticos que não governam, os poetas que não escrevem, os jornalistas que só querem jantar bem. Mais de um século depois, muitos portugueses ainda citam as suas frases como se falassem de hoje.", en: "Eça de Queirós spent much of his life outside Portugal, as consul in Havana, in England and finally in Paris, where he died. Perhaps that is why he saw his country with such lucidity and such irony. The Maias, published in 1888, is at once the tragedy of a family and a satirical portrait of the Lisbon high society of his time: politicians who do not govern, poets who do not write, journalists who only want to dine well. More than a century later, many Portuguese still quote his lines as if they were about today." }
  - { es: "A casa que os Maias vieram habitar em Lisboa, no outono de 1875, era conhecida na vizinhança da Rua de S. Francisco de Paula, e em todo o bairro das Janelas Verdes, pela casa do Ramalhete ou simplesmente o Ramalhete. Apesar deste fresco nome de vivenda campestre, o Ramalhete, sombrio casarão de paredes severas, com um renque de estreitas varandas de ferro no primeiro andar, e por cima uma tímida fila de janelinhas abrigadas à beira do telhado, tinha o aspeto tristonho de residência eclesiástica que competia a uma edificação do reinado da senhora D. Maria I: com uma sineta e com uma cruz no topo assemelhar-se-ia a um colégio de jesuítas.", en: "The house the Maias came to live in, in Lisbon, in the autumn of 1875, was known in the neighbourhood of the Rua de São Francisco de Paula, and throughout the Janelas Verdes district, as the house of the Ramalhete, or simply the Ramalhete. Despite this fresh name, fit for a country villa, the Ramalhete, a gloomy mansion with severe walls, a row of narrow iron balconies on the first floor and above them a timid line of little windows sheltering under the edge of the roof, had the dismal look of a church residence that befitted a building from the reign of Queen Maria I: with a little bell and a cross on top it would have resembled a Jesuit college." }
  - { es: "O nome de Ramalhete provinha decerto de um revestimento quadrado de azulejos fazendo painel no lugar heráldico do escudo de armas, que nunca chegara a ser colocado, e representando um grande ramo de girassóis atado por uma fita onde se distinguiam letras e números de uma data. (…)", en: "The name Ramalhete (bouquet) no doubt came from a square facing of tiles forming a panel in the heraldic place of the coat of arms, which had never been put up, and depicting a large bunch of sunflowers tied with a ribbon on which one could make out the letters and numbers of a date. (…)" }
  - { es: "João da Ega, o melhor amigo de Carlos, é um dos grandes personagens cómicos do romance: inteligente, exagerado, sempre com um projeto de livro que nunca escreve. Numa das suas tiradas mais famosas, define assim a relação de Portugal com a Europa:", en: "João da Ega, Carlos's best friend, is one of the great comic characters of the novel: intelligent, extravagant, always with a book project he never writes. In one of his most famous tirades, he defines Portugal's relationship with Europe like this:" }
  - { es: "— Aqui importa-se tudo. Leis, ideias, filosofias, teorias, assuntos, estéticas, ciências, estilo, indústrias, modas, maneiras, pilhérias, tudo nos vem em caixotes pelo paquete. A civilização custa-nos caríssima, com os direitos da Alfândega: e é em segunda mão, não foi feita para nós, fica-nos curta nas mangas… (…)", en: "'Here everything is imported. Laws, ideas, philosophies, theories, subjects, aesthetics, sciences, style, industries, fashions, manners, jokes — everything comes to us in crates on the steamer. Civilisation costs us a fortune, with the Customs duties: and it's second-hand, it wasn't made for us, it's too short in the sleeves…' (…)" }
  - { es: "Dez anos depois de todos os desastres da família, Carlos volta a Lisboa e passeia pela cidade com o velho amigo João da Ega. Visitam o Ramalhete vazio, falam do passado e, ao fim da tarde, chegam à conclusão que resume toda uma geração.", en: "Ten years after all the family's disasters, Carlos comes back to Lisbon and walks around the city with his old friend João da Ega. They visit the empty Ramalhete, talk about the past and, at the end of the afternoon, reach the conclusion that sums up a whole generation." }
  - { es: "— Falhámos a vida, menino! — Creio que sim… Mas todo o mundo mais ou menos a falha. Isto é, falha-se sempre na realidade aquela vida que se planeou com a imaginação. (…)", en: "'We've failed at life, my boy!' 'I think so… But everyone fails at it, more or less. That is, in reality one always fails at the life one planned in one's imagination.' (…)" }
  - { es: "— Que raiva ter esquecido o paiozinho! Enfim, acabou-se. Ao menos assentámos a teoria definitiva da existência. Com efeito, não vale a pena fazer um esforço, correr com ânsia para coisa alguma… Ega, ao lado, ajuntava, ofegante, atirando as pernas magras: — Nem para o amor, nem para a glória, nem para o dinheiro, nem para o poder…", en: "'How annoying to have forgotten the paiozinho! Anyway, that's that. At least we've settled the definitive theory of existence. Indeed, it's not worth making an effort, running eagerly after anything…' Ega, beside him, added, panting, throwing out his thin legs: 'Not for love, not for glory, not for money, not for power…'" }
  - { es: "A lanterna vermelha do americano, ao longe, no escuro, parara. E foi em Carlos e em João da Ega uma esperança, outro esforço: — Ainda o apanhamos! — Ainda o apanhamos! De novo a lanterna deslizou e fugiu. Então, para apanhar o americano, os dois amigos romperam a correr desesperadamente pela rampa de Santos e pelo Aterro, sob a primeira claridade do luar que subia.", en: "The red lantern of the tram, far off in the dark, had stopped. And in Carlos and João da Ega there was a hope, another effort: 'We can still catch it!' 'We can still catch it!' Again the lantern slid away and fled. Then, to catch the tram, the two friends broke into a desperate run up the Santos slope and along the Aterro, under the first light of the rising moon." }
  - { es: "O final é uma das páginas mais célebres da literatura portuguesa. Depois de toda uma teoria sobre a inutilidade do esforço, as duas personagens desatam a correr atrás de um simples americano, o carro puxado por cavalos que servia de transporte público em Lisboa. A ironia é dupla: Eça ri-se dos seus heróis, que não conseguem viver de acordo com a filosofia que acabaram de inventar, mas talvez também sugira que, apesar de tudo, a vida continua a puxar-nos para a frente.", en: "The ending is one of the most celebrated pages in Portuguese literature. After a whole theory about the uselessness of effort, the two characters break into a run after a mere americano, the horse-drawn car that served as public transport in Lisbon. The irony is double: Eça laughs at his heroes, who cannot live by the philosophy they have just invented, but perhaps he also suggests that, in spite of everything, life keeps pulling us forward." }
questions:
  - { q: "Porque é que o nome “Ramalhete” não combina com a casa?", options: ["Porque a casa era nova e alegre", "Porque não havia flores em Lisboa", "Porque é um nome fresco, de casa de campo, para um casarão sombrio e severo", "Porque a casa ficava no Porto"], answer: 2, explain: "Eça contrasts the 'fresco nome de vivenda campestre' with a gloomy mansion that looked like a church residence." }
  - { q: "De onde vinha o nome da casa?", options: ["De um painel de azulejos com um ramo de girassóis", "De um jardim com muitas flores", "Do apelido de um antigo dono", "De uma igreja próxima"], answer: 0, explain: "A tiled panel showing a bunch of sunflowers, placed where the coat of arms should have been." }
  - { q: "O que critica Ega na frase “Aqui importa-se tudo”?", options: ["O preço dos transportes", "A falta de originalidade de um país que copia, em segunda mão, a civilização estrangeira", "A qualidade do vinho", "O excesso de turistas"], answer: 1, explain: "Laws, ideas and fashions arrive 'em caixotes pelo paquete' — second-hand civilisation that does not fit: 'fica-nos curta nas mangas'." }
  - { q: "Qual é a “teoria definitiva da existência” de Carlos e Ega?", options: ["Que é preciso trabalhar muito", "Que o amor é tudo", "Que não vale a pena fazer esforço nem correr para coisa alguma", "Que se deve emigrar"], answer: 2, explain: "Not for love, glory, money or power — nothing is worth an effort." }
  - { q: "Em que consiste a ironia do final?", options: ["Os dois morrem", "Logo depois de dizerem que não vale a pena correr, correm desesperadamente atrás do americano", "Ega casa-se", "O Ramalhete é vendido"], answer: 1, explain: "Their actions contradict their philosophy within seconds — Eça's comic and perhaps hopeful closing image." }
