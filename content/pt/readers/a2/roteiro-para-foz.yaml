id: r.a2.roteiro-para-foz
level: a2
title: Roteiro para Foz do Iguaçu
kind: text
intro: Rodrigo sends his family the plan for their four-day trip to Foz do Iguaçu, on the border with Argentina and Paraguay. The message is full of future forms.
allow: [rodrigo, foz, iguaçu, itaipu, paraguai, argentina, argentino, argentinos, garganta, diabo, ok, rafting, lu, tia, cris]
paragraphs:
  - { es: "Oi, família! Faltam só duas semanas para a nossa viagem, então eu preparei um roteiro. Leiam com atenção, por favor, e me digam se querem mudar alguma coisa.", en: "Hi, family! There are only two weeks to go until our trip, so I've prepared an itinerary. Please read it carefully and tell me if you want to change anything." }
  - { es: "Na quinta-feira, nós sairemos de casa às cinco da manhã, porque o voo é às sete. Chegaremos a Foz às oito e meia e iremos direto para o hotel. À tarde, faremos a primeira visita às Cataratas, do lado brasileiro. Lá, tem uma trilha de mais ou menos um quilômetro, com vistas incríveis. No fim da trilha, vocês verão a Garganta do Diabo, a parte mais forte das quedas. Levem capa de chuva: a gente vai sair muito molhado!", en: "On Thursday, we'll leave home at five in the morning, because the flight is at seven. We'll arrive in Foz at half past eight and go straight to the hotel. In the afternoon, we'll make our first visit to the Falls, on the Brazilian side. There's a trail of about a kilometre there, with incredible views. At the end of the trail you'll see the Devil's Throat, the most powerful part of the falls. Bring rain jackets: we're going to come out very wet!" }
  - { es: "Na sexta, atravessaremos a ponte para a Argentina. Do lado argentino, as trilhas são maiores e passam por cima das quedas. Será um dia longo, mas todo mundo diz que vale a pena. Não esqueçam os passaportes! Quer dizer, para brasileiros a carteira de identidade basta, mas é melhor levar os dois.", en: "On Friday, we'll cross the bridge into Argentina. On the Argentine side, the trails are longer and go over the top of the falls. It will be a long day, but everyone says it's worth it. Don't forget your passports! Well, for Brazilians an identity card is enough, but it's better to take both." }
  - { es: "No sábado de manhã, visitaremos a usina de Itaipu, que o Brasil e o Paraguai construíram juntos. É uma das maiores do mundo. Depois do almoço, a tia Cris e a Lu farão o passeio de barco que vai até embaixo das quedas. Eu e o papai preferimos ficar no Parque das Aves. Lá tem tucanos, araras e muitos outros pássaros.", en: "On Saturday morning, we'll visit the Itaipu dam, which Brazil and Paraguay built together. It's one of the biggest in the world. After lunch, Aunt Cris and Lu will do the boat trip that goes right under the falls. Dad and I prefer to stay at the Bird Park. There are toucans, macaws and lots of other birds there." }
  - { es: "No domingo, teremos a manhã livre para descansar ou fazer compras. O voo de volta sai às quatro da tarde. Se tudo der certo, estaremos em casa para o jantar.", en: "On Sunday, we'll have the morning free to rest or go shopping. The return flight leaves at four in the afternoon. If all goes well, we'll be home for dinner." }
  - { es: "Mais uma coisa: em março ainda faz muito calor em Foz, uns trinta e cinco graus. Tragam protetor solar, chapéu e roupas leves. E tênis confortável, porque nós andaremos bastante. Vai ser a melhor viagem da família, tenho certeza! Beijos, Rodrigo.", en: "One more thing: in March it's still very hot in Foz, around thirty-five degrees. Bring sunscreen, a hat and light clothes. And comfortable trainers, because we'll be walking a lot. It's going to be the best family trip, I'm sure! Kisses, Rodrigo." }
questions:
  - { q: "Por que a família vai sair de casa às cinco da manhã?", options: ["Porque o voo é às sete", "Porque a trilha abre cedo", "Porque o hotel é longe"], answer: 0, explain: "«Nós sairemos de casa às cinco da manhã, porque o voo é às sete.»" }
  - { q: "O que é a Garganta do Diabo?", options: ["Um restaurante argentino", "A parte mais forte das quedas", "Uma ponte"], answer: 1, explain: "«Vocês verão a Garganta do Diabo, a parte mais forte das quedas.»" }
  - { q: "O que a família vai fazer na sexta-feira?", options: ["Visitar a usina de Itaipu", "Ir ao lado argentino das Cataratas", "Descansar no hotel"], answer: 1, explain: "«Na sexta, atravessaremos a ponte para a Argentina.»" }
  - { q: "Quem vai fazer o passeio de barco?", options: ["O Rodrigo e o pai", "A tia Cris e a Lu", "A família toda"], answer: 1, explain: "«A tia Cris e a Lu farão o passeio de barco.» Rodrigo and Dad will go to the Bird Park." }
  - { q: "Que roupa o Rodrigo recomenda?", options: ["Roupas leves e tênis confortável", "Casacos e luvas", "Roupas elegantes"], answer: 0, explain: "«Tragam protetor solar, chapéu e roupas leves. E tênis confortável.»" }
