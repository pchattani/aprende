grammar:
  - { prompt: "Ieri Marco ___ al cinema con Laura.", options: ["ha andato", "è andato", "è andata"], answer: 1, explain: "andare takes essere and the participle agrees with the subject: Marco è andato (g.passato-prossimo-essere)." }
  - { prompt: "Stamattina ___ un cappuccino al bar.", options: ["ho preso", "ho prenduto", "sono preso"], answer: 0, explain: "prendere has an irregular participle: preso (g.participles-irregular)." }
  - { prompt: "Le ragazze si ___ molto alla festa.", options: ["sono divertite", "hanno divertito", "sono divertiti"], answer: 0, explain: "Reflexive verbs take essere; the participle agrees with le ragazze (g.reflexive-passato-prossimo)." }
  - { prompt: "Da bambino ___ sempre a calcio con mio fratello.", options: ["ho giocato", "giocavo", "giocherò"], answer: 1, explain: "A habit in the past: imperfetto (g.imperfetto-uses)." }
  - { prompt: "Mentre ___ la doccia, è suonato il telefono.", options: ["ho fatto", "facevo", "farò"], answer: 1, explain: "mentre + imperfetto for the background action, passato prossimo for the event (g.mentre-quando)." }
  - { prompt: "Hai visto Paola? — Sì, ___ ho vista ieri.", options: ["la", "l'", "le"], answer: 1, explain: "la becomes l' before ho, and the participle agrees: l'ho vista (g.pronoun-participle-agreement)." }
  - { prompt: "Hai telefonato a Luca? — Sì, ___ ho telefonato stamattina.", options: ["lo", "gli", "le"], answer: 1, explain: "telefonare a qualcuno: indirect object, a lui = gli (g.indirect-object-pronouns)." }
  - { prompt: "L'anno prossimo ___ in Toscana.", options: ["andremo", "anderemo", "andiamo stati"], answer: 0, explain: "andare has a contracted future stem: andr- (g.futuro-irregular)." }
  - { prompt: "Dov'è Marta? — Non so, ___ a casa.", options: ["sarà", "è stata", "era"], answer: 0, explain: "The future expresses a guess about the present: sarà a casa = she's probably at home (g.futuro-probability)." }
  - { prompt: "Firenze è più grande ___ Siena.", options: ["che", "di", "come"], answer: 1, explain: "più + adjective + di before a noun (g.comparatives)." }
  - { prompt: "Questa pizza è ___ di quella di ieri.", options: ["più buona", "migliore", "meglio"], answer: 1, explain: "migliore is the comparative adjective of buono (g.comparatives-irregular)." }
  - { prompt: "Quante mele vuoi? — ___ voglio tre.", options: ["Ne", "Ci", "Le"], answer: 0, explain: "ne replaces a quantity (g.ne-partitive)." }
  - { prompt: "Per arrivare a Pisa ___ un'ora.", options: ["ci vuole", "ci vogliono", "ci metto"], answer: 0, explain: "volerci is impersonal and agrees with the time: ci vuole un'ora (g.metterci-volerci)." }
  - { prompt: "Signora, ___ pure!", options: ["entra", "entri", "entrate"], answer: 1, explain: "Imperative with Lei for -are verbs ends in -i: entri (g.imperativo-lei)." }
  - { prompt: "Studio italiano ___ due anni.", options: ["per", "da", "fra"], answer: 1, explain: "An action that started in the past and continues: present + da (g.da-since)." }
writing:
  prompt: "Write an e-mail to an Italian friend about a trip you took last year: where you went, how you travelled, what the place was like, what you did and what happened, and what you will do next time."
  minWords: 90
  modelAnswer: |
    Cara Francesca,
    come stai? Ti scrivo per raccontarti il mio viaggio in Toscana dell'anno scorso. Sono partita a maggio con mia sorella e siamo arrivate a Pisa in aereo. Il primo giorno abbiamo visto la torre: era più piccola di come pensavo, ma bellissima! Poi abbiamo preso il treno per Lucca, dove abbiamo noleggiato due biciclette e abbiamo fatto il giro delle mura. Faceva bel tempo e c'erano pochi turisti. Una sera, mentre tornavamo all'albergo, abbiamo trovato una piccola trattoria e abbiamo mangiato la migliore pasta della mia vita. Il prossimo anno tornerò in Toscana e visiterò Siena. Vuoi venire con me?
    Un abbraccio,
    Emma
  checklist:
    - "I used the passato prossimo for completed events, with the right auxiliary (sono partita, abbiamo visto)."
    - "I used the imperfetto for descriptions and background (era, faceva, c'erano, mentre tornavamo)."
    - "My participles with essere agree with the subject (siamo arrivate)."
    - "I used at least one comparative (più piccola di, la migliore)."
    - "I used the future to talk about next time (tornerò, visiterò)."
    - "I began and ended the e-mail appropriately (Cara…, Un abbraccio)."
