id: r.b2.je-doute-que-vous-finissiez
level: b2
title: "Les bouchons : je doute que vous finissiez"
kind: text
intro: A Parisian food critic, rather sceptical, reviews a traditional Lyon «bouchon». Notice how doubt and certainty change the mood (je doute que + subjunctive, je suis sûr que + indicative).
allow: [brazier, eugénie, bocuse, nantua, beaujolais, ok, centre]
paragraphs:
  - { es: "Je l'avoue : je suis arrivé à Lyon plein de préjugés. Depuis des années, mes amis lyonnais me répètent que leur ville est la capitale de la gastronomie, et qu'on y mange mieux qu'à Paris. Je doutais fortement que ce soit vrai. Je ne pensais pas qu'un simple restaurant de quartier puisse rivaliser avec nos grandes tables parisiennes. J'avais tort, et je vais vous expliquer pourquoi.", en: "I admit it: I arrived in Lyon full of prejudices. For years my friends from Lyon have been telling me that their city is the capital of gastronomy, and that you eat better there than in Paris. I strongly doubted that was true. I didn't think a simple neighbourhood restaurant could compete with our great Parisian tables. I was wrong, and I'm going to explain why." }
  - { es: "Le bouchon est le restaurant traditionnel lyonnais. Il est possible que le nom vienne des bouchons de paille que l'on accrochait autrefois devant les auberges, mais personne n'en est tout à fait sûr. Ce qui est certain, c'est que ces petits restaurants ont été rendus célèbres par les « mères lyonnaises », ces femmes cuisinières qui, au début du vingtième siècle, ont quitté les cuisines des familles bourgeoises pour ouvrir leurs propres établissements. La plus célèbre, Eugénie Brazier, a été la première à obtenir trois étoiles dans deux restaurants à la fois, en 1933. Un certain Paul Bocuse a d'ailleurs appris le métier chez elle.", en: "The bouchon is the traditional Lyon restaurant. It's possible that the name comes from the bundles of straw (bouchons) that were once hung outside inns, but nobody is entirely sure. What is certain is that these little restaurants were made famous by the 'mères lyonnaises', women cooks who, at the beginning of the twentieth century, left the kitchens of middle-class families to open their own establishments. The most famous, Eugénie Brazier, was the first to win three stars at two restaurants at once, in 1933. A certain Paul Bocuse, by the way, learned his trade with her." }
  - { es: "Le bouchon où j'ai dîné ne paie pas de mine : des nappes à carreaux rouges et blancs, des tables serrées les unes contre les autres, des photos jaunies aux murs. Le patron vous tutoie dès la deuxième minute. Je ne crois pas qu'on trouve ce genre d'ambiance dans un restaurant étoilé, et c'est tant mieux.", en: "The bouchon where I had dinner doesn't look like much: red and white checked tablecloths, tables squeezed together, yellowed photos on the walls. The owner calls you tu within the first two minutes. I don't think you'd find this kind of atmosphere in a Michelin-starred restaurant, and so much the better." }
  - { es: "Pour commencer, on m'a apporté un saladier de lentilles, du saucisson et des grattons, sans que j'aie rien commandé. Puis est arrivée la fameuse cervelle de canut, qui, rassurez-vous, n'a rien à voir avec une cervelle : c'est du fromage blanc aux herbes et à l'échalote. Comme plat, j'ai choisi la quenelle de brochet, sauce Nantua. Elle était énorme, légère comme un nuage, et nageait dans une sauce aux écrevisses. Mon voisin de table, un habitué, a commandé un tablier de sapeur, une tranche de tripes panée et frite. Il m'a affirmé que c'était un délice. Je veux bien le croire, mais je doute que je trouve un jour le courage de le goûter.", en: "To start, I was brought a bowl of lentils, saucisson and grattons (crispy pork pieces), without my having ordered anything. Then came the famous cervelle de canut ('silk worker's brain') which, don't worry, has nothing to do with brains: it's fromage blanc with herbs and shallots. As a main course I chose the pike quenelle with Nantua sauce. It was enormous, light as a cloud, and swimming in a crayfish sauce. My neighbour at the next table, a regular, ordered a tablier de sapeur, a slice of breaded, fried tripe. He assured me it was a delight. I'm willing to believe him, but I doubt I'll ever find the courage to taste it." }
  - { es: "Tout cela s'accompagne d'un pot lyonnais, une bouteille de quarante-six centilitres au fond très épais, remplie de beaujolais ou de côtes-du-rhône. Le patron m'a assuré qu'il était impossible de boire un pot entier à deux sans rire. Je confirme.", en: "All this comes with a pot lyonnais, a forty-six-centilitre bottle with a very thick bottom, filled with Beaujolais or Côtes-du-Rhône. The owner assured me it was impossible for two people to drink a whole pot without laughing. I can confirm." }
  - { es: "Au moment du dessert – une tarte aux pralines roses, spécialité de la ville –, le patron m'a regardé avec un sourire : « Je doute que vous la finissiez, monsieur le Parisien. » Il avait raison. Je n'ai pas pu.", en: "When dessert came – a pink praline tart, a speciality of the city – the owner looked at me with a smile: 'I doubt you'll finish it, Mr Parisian.' He was right. I couldn't." }
  - { es: "Mon verdict ? Je ne suis pas certain que Lyon soit la capitale mondiale de la gastronomie : je laisse ce débat aux Lyonnais, qui adorent en parler. Mais je suis sûr d'une chose : on y mange avec une générosité qu'on ne trouve plus guère à Paris. Un conseil, toutefois : méfiez-vous des faux bouchons pour touristes, nombreux dans le Vieux-Lyon. Cherchez plutôt ceux qui portent le label des bouchons authentiques. Et surtout, ne déjeunez pas le jour même : vous le regretteriez.", en: "My verdict? I'm not certain that Lyon is the world capital of gastronomy: I'll leave that debate to the people of Lyon, who love talking about it. But I am sure of one thing: people eat there with a generosity you hardly find in Paris anymore. One piece of advice, though: beware of the fake bouchons for tourists, of which there are many in Vieux-Lyon. Look instead for those carrying the label of authentic bouchons. And above all, don't have lunch that day: you'd regret it." }
questions:
  - { q: "Qu'est-ce que le critique pensait avant de venir à Lyon ?", options: ["Qu'on y mangeait mieux qu'à Paris", "Qu'un restaurant de quartier ne pouvait pas rivaliser avec les grandes tables parisiennes", "Que les bouchons étaient trop chers"], answer: 1, explain: "«Je ne pensais pas qu'un simple restaurant de quartier puisse rivaliser avec nos grandes tables parisiennes.»" }
  - { q: "Qui étaient les « mères lyonnaises » ?", options: ["Des femmes cuisinières qui ont ouvert leurs propres restaurants", "Les mères des chefs célèbres", "Des religieuses"], answer: 0, explain: "Women cooks who left bourgeois households «pour ouvrir leurs propres établissements»." }
  - { q: "Qu'est-ce que la cervelle de canut ?", options: ["Une vraie cervelle", "Du fromage blanc aux herbes et à l'échalote", "Une saucisse"], answer: 1, explain: "«Rassurez-vous, n'a rien à voir avec une cervelle : c'est du fromage blanc aux herbes et à l'échalote.»" }
  - { q: "Pourquoi le critique ne goûtera probablement jamais le tablier de sapeur ?", options: ["C'est trop cher", "Il n'a pas le courage", "On n'en sert plus"], answer: 1, explain: "«Je doute que je trouve un jour le courage de le goûter.»" }
  - { q: "Quel conseil donne-t-il aux lecteurs ?", options: ["Aller dans les bouchons pour touristes", "Se méfier des faux bouchons et ne pas déjeuner le jour même", "Commander toujours le tablier de sapeur"], answer: 1, explain: "«Méfiez-vous des faux bouchons pour touristes… ne déjeunez pas le jour même.»" }
  - { q: "« Je doute que vous la finissiez. » Pourquoi le subjonctif ?", options: ["Parce que douter que exprime le doute", "Parce que c'est au passé", "Parce que c'est une question"], answer: 0, explain: "Douter que expresses doubt and takes the subjunctive; être sûr que takes the indicative." }
