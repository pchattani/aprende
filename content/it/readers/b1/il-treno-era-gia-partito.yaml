id: r.b1.il-treno-era-gia-partito
level: b1
title: Il treno era già partito
kind: text
intro: Luca had planned the perfect evening at the opera in the Arena di Verona for his girlfriend's birthday. Then everything went wrong. A story that uses the trapassato prossimo to look back from a moment in the past.
allow: [quindicimila, luca, marta, verona, aida, verdi, brescia, ok]
paragraphs:
  - { es: "Per il compleanno di Marta avevo organizzato tutto da mesi. Avevo comprato due biglietti per l'Aida all'Arena di Verona, avevo prenotato un tavolo in una piccola osteria vicino a Piazza delle Erbe e avevo trovato un albergo con vista sull'Adige. Marta non sapeva niente: le avevo detto solo di tenersi libera il sabato sera.", en: "For Marta's birthday I had organised everything months in advance. I had bought two tickets for Aida at the Arena di Verona, I had booked a table in a little osteria near Piazza delle Erbe and I had found a hotel with a view of the Adige. Marta knew nothing: I'd only told her to keep Saturday evening free." }
  - { es: "Il treno da Milano partiva alle 15:05. Avevo calcolato tutto: saremmo arrivati a Verona alle cinque, avremmo lasciato le valigie in albergo e avremmo avuto il tempo di fare una passeggiata prima di cena. Quel pomeriggio, però, Marta era uscita dall'ufficio più tardi del solito, perché il suo capo le aveva chiesto di finire una relazione urgente.", en: "The train from Milan left at 3.05. I had worked it all out: we'd arrive in Verona at five, leave our bags at the hotel and have time for a stroll before dinner. That afternoon, however, Marta had left the office later than usual, because her boss had asked her to finish an urgent report." }
  - { es: "Siamo arrivati alla Stazione Centrale di corsa, alle 15:07. Quando siamo arrivati al binario, il treno era già partito. Ho guardato il tabellone: il treno successivo c'era alle 16:05, ma i posti erano esauriti. Marta mi guardava senza capire. «Ma dove dovevamo andare?» mi ha chiesto. A quel punto ho dovuto raccontarle tutto.", en: "We arrived at Central Station running, at 3.07. When we got to the platform, the train had already left. I looked at the departures board: there was a next train at 4.05, but it was sold out. Marta looked at me without understanding. 'But where were we supposed to be going?' she asked me. At that point I had to tell her everything." }
  - { es: "Ero disperato. Avevo speso un sacco di soldi e avevo immaginato quella giornata in ogni dettaglio. Ho cominciato a scusarmi, ma Marta mi ha interrotto: «Ascolta, se fossimo partiti in orario, non avrei saputo niente fino a Verona. Invece adesso so già che hai organizzato una cosa bellissima. Non perdiamo altro tempo: troviamo un altro treno.» Non era offesa per niente. Anzi, sembrava divertirsi.", en: "I was desperate. I'd spent a lot of money and I'd imagined that day down to the last detail. I started apologising, but Marta interrupted me: 'Listen, if we'd left on time, I wouldn't have known anything until Verona. Instead I already know you've organised something wonderful. Let's not waste any more time: let's find another train.' She wasn't offended at all. On the contrary, she seemed to be enjoying herself." }
  - { es: "Alla fine abbiamo preso un regionale per Brescia e da lì un altro treno per Verona. Il viaggio è durato quasi tre ore, in piedi tra i pendolari. Siamo arrivati in albergo alle sette e mezza. Non avevamo più tempo per la cena: abbiamo mangiato un panino in piedi e siamo corsi all'Arena.", en: "In the end we took a regional train to Brescia and from there another train to Verona. The journey took almost three hours, standing among the commuters. We got to the hotel at half past seven. We no longer had time for dinner: we ate a sandwich standing up and ran to the Arena." }
  - { es: "E lì è successa la cosa più bella della giornata. L'Arena era piena, quindicimila persone, e quando si è fatto buio tutti hanno acceso una piccola candela, come vuole la tradizione. Marta non l'aveva mai visto. Ha preso la mia mano e mi ha detto: «È il regalo più bello che io abbia mai ricevuto.» Io non le ho detto che la candela l'avevamo comprata all'ingresso per due euro.", en: "And there the best thing of the day happened. The Arena was full, fifteen thousand people, and when it got dark everyone lit a little candle, as tradition demands. Marta had never seen it. She took my hand and said: 'It's the best present I've ever received.' I didn't tell her that we'd bought the candle at the entrance for two euros." }
  - { es: "L'opera è finita dopo mezzanotte. Tornando in albergo abbiamo trovato l'osteria ancora aperta e il cuoco, gentilissimo, ci ha preparato due piatti di risotto all'Amarone. Così, alla fine, abbiamo cenato lo stesso. Da quel giorno, però, Marta controlla sempre l'orario dei treni prima di me. «Non si sa mai», dice ridendo.", en: "The opera ended after midnight. On the way back to the hotel we found the osteria still open and the cook, who was very kind, made us two plates of Amarone risotto. So in the end we had dinner after all. Since that day, though, Marta always checks the train times before I do. 'You never know,' she says, laughing." }
questions:
  - { q: "Che cosa aveva preparato Luca per il compleanno di Marta?", options: ["Una festa a sorpresa a Milano", "Una serata all'opera a Verona", "Un viaggio a Brescia"], answer: 1, explain: "He had bought Aida tickets at the Arena, booked dinner and a hotel in Verona." }
  - { q: "Perché sono arrivati tardi alla stazione?", options: ["Perché Marta era uscita tardi dall'ufficio", "Perché c'era sciopero", "Perché Luca aveva dimenticato i biglietti"], answer: 0, explain: "Her boss «le aveva chiesto di finire una relazione urgente»: the trapassato explains what had happened earlier." }
  - { q: "Perché non hanno preso il treno delle 16:05?", options: ["Perché era in ritardo", "Perché i posti erano esauriti", "Perché andava a Venezia"], answer: 1, explain: "«I posti erano esauriti» – sold out." }
  - { q: "Che cosa fanno gli spettatori all'Arena quando si fa buio?", options: ["Cantano insieme", "Accendono una piccola candela", "Escono a cena"], answer: 1, explain: "Lighting candles at dusk is a famous tradition of the Arena opera festival." }
  - { q: "Come si conclude la storia?", options: ["Non cenano per niente", "Il cuoco dell'osteria gli prepara il risotto dopo l'opera", "Tornano a Milano la sera stessa"], answer: 1, explain: "The osteria was still open after midnight and the cook made them risotto all'Amarone." }
