id: b1.u11
title: Conectores y textos
lessons:
  - id: b1.u11.l1
    title: Causa y consecuencia
    teach: [g.connectors-cause-consequence]
    vocab: [w.ya-que, w.puesto-que, w.debido-a, w.por-lo-tanto, w.por-consiguiente, w.de-modo-que, w.economia, w.causa, w.consecuencia, w.provocar, w.afectar, w.dado-que, w.en-consecuencia, w.economico, w.inflacion, w.efecto, w.multa]
    tip: "Cause: porque (mid-sentence), como (at the start), ya que / puesto que (formal), debido a + noun. Consequence: así que, por eso, por lo tanto, de modo que."
    sentences:
      - { es: "Como no había trenes por la huelga, fui al trabajo en bici.", en: "As there were no trains because of the strike, I went to work by bike.", grammar: [g.connectors-cause-consequence], vocab: [w.como.conj, w.huelga, w.bici, w.trabajo] }
      - { es: "El vuelo no salió debido a la tormenta; por lo tanto, pasamos la noche en el aeropuerto.", en: "The flight didn't leave due to the storm; therefore, we spent the night at the airport.", grammar: [g.connectors-cause-consequence], vocab: [w.debido-a, w.por-lo-tanto, w.vuelo, w.tormenta, w.aeropuerto] }
      - { es: "Ya que estás en la cocina, pon la mesa, por favor.", en: "Since you're in the kitchen, set the table, please.", grammar: [g.connectors-cause-consequence, g.imperative-tu], vocab: [w.ya-que, w.cocina, w.poner-la-mesa] }
      - { es: "Los alquileres han subido tanto que muchos jóvenes siguen viviendo con sus padres.", en: "Rents have gone up so much that many young people are still living with their parents.", grammar: [g.connectors-cause-consequence, g.present-perfect], vocab: [w.alquiler, w.subir, w.joven, w.padres, w.seguir-gerundio], note: "tanto … que = so much … that." }
      - { es: "El gobierno ha aprobado nuevas medidas económicas, de modo que los impuestos bajarán el año que viene.", en: "The government has approved new economic measures, so taxes will go down next year.", grammar: [g.connectors-cause-consequence, g.future-simple], vocab: [w.gobierno, w.medida, w.economico, w.de-modo-que, w.impuesto, w.bajar, w.que-viene], note: "aprobar = to approve, to pass (a law); also to pass an exam." }
      - { es: "Puesto que la ley no es clara, los ciudadanos no saben qué hacer.", en: "Since the law isn't clear, citizens don't know what to do.", grammar: [g.connectors-cause-consequence], vocab: [w.puesto-que, w.ley, w.ciudadano, w.claro.adj] }
      - { es: "La crisis provocó mucho paro y, por consiguiente, miles de familias tuvieron que mudarse.", en: "The crisis caused a lot of unemployment and, consequently, thousands of families had to move.", grammar: [g.connectors-cause-consequence, g.preterite-irregular], vocab: [w.crisis, w.provocar, w.paro, w.por-consiguiente, w.mudarse], variant: "In Latin America unemployment is el desempleo; el paro is Spain's everyday word." }
      - { es: "Hacía tanto calor que la manifestación terminó una hora antes.", en: "It was so hot that the demonstration finished an hour early.", grammar: [g.connectors-cause-consequence, g.preterite-vs-imperfect], vocab: [w.manifestacion, w.calor, w.terminar] }
      - { es: "Le pusieron una multa por aparcar en la acera.", en: "He was given a fine for parking on the pavement.", grammar: [g.connectors-cause-consequence], vocab: [w.multa, w.aparcar, w.acera, w.poner], note: "por + infinitive = because of doing something." }
      - { es: "La contaminación afecta más a los niños; por eso el ayuntamiento ha cerrado el centro al tráfico.", en: "Pollution affects children most; that's why the council has closed the centre to traffic.", grammar: [g.connectors-cause-consequence], vocab: [w.contaminacion, w.afectar, w.nino, w.deber.plan, w.ayuntamiento, w.trafico] }
      - { es: "Gracias a la ayuda de mis vecinos, pude terminar la mudanza en un día.", en: "Thanks to my neighbours' help, I managed to finish the move in one day.", grammar: [g.connectors-cause-consequence], vocab: [w.gracias-a, w.ayuda, w.vecino, w.mudanza] }
      - { es: "No sabemos la causa del accidente, pero sus efectos han sido graves y, en consecuencia, la carretera sigue cerrada.", en: "We don't know the cause of the accident, but its effects have been serious and, as a result, the road is still closed.", grammar: [g.connectors-cause-consequence], vocab: [w.causa, w.efecto, w.en-consecuencia, w.consecuencia, w.accidente, w.grave, w.carretera] }
      - { es: "Dado que la inflación ha bajado, la economía va mejor, de modo que las empresas empiezan a buscar trabajadores otra vez.", en: "Given that inflation has fallen, the economy is doing better, so companies are starting to look for workers again.", grammar: [g.connectors-cause-consequence], vocab: [w.dado-que, w.inflacion, w.economia, w.de-modo-que, w.empresa, w.trabajador, w.buscar] }
      - { es: "En nuestra sociedad mucha gente trabaja demasiado y, por culpa del estrés, duerme mal.", en: "In our society a lot of people work too much and, because of stress, sleep badly.", grammar: [g.connectors-cause-consequence], vocab: [w.sociedad, w.gente, w.demasiado, w.por-culpa-de, w.estres] }
      - { es: "Como llovía mucho, cogimos un taxi.", en: "As it was raining hard, we took a taxi.", grammar: [g.connectors-cause-consequence], vocab: [w.llover, w.coger, w.taxi], error: { wrong: "Porque llovía mucho, cogimos un taxi.", explain: "At the start of a sentence Spanish uses como for a cause; porque goes mid-sentence: Cogimos un taxi porque llovía.", grammar: g.connectors-cause-consequence } }
      - { es: "Estaba muy cansado. Me fui a la cama a las nueve.", en: "I was very tired. I went to bed at nine.", grammar: [g.connectors-cause-consequence], vocab: [w.cansado, w.cama, w.asi-que], transform: { instruction: "Join the two sentences with así que", answer: "Estaba muy cansado, así que me fui a la cama a las nueve.", alt: ["Estaba muy cansado así que me fui a la cama a las nueve."] } }
  - id: b1.u11.l2
    title: Contraste
    teach: [g.connectors-contrast]
    vocab: [w.sino, w.no-obstante, w.a-pesar-de, w.inconveniente, w.presencial, w.horario, w.por-el-contrario, w.a-diferencia-de, w.aun-asi, w.de-todas-formas, w.excepto, w.desacuerdo, w.comodidad, w.productividad, w.productivo, w.aislado]
    tip: "pero adds a contrast; sino corrects a negative (no es caro, sino barato). sin embargo / no obstante go between commas; aunque + indicative for facts."
    sentences:
      - { es: "Aunque el teletrabajo tiene muchas ventajas, también tiene inconvenientes: mucha gente se siente aislada.", en: "Although remote work has many advantages, it also has drawbacks: many people feel isolated.", grammar: [g.connectors-contrast], vocab: [w.aunque, w.teletrabajo, w.ventaja, w.inconveniente, w.aislado, w.sentirse] }
      - { es: "No busco un sueldo más alto, sino un horario flexible: la productividad no depende de las horas.", en: "I'm not looking for a higher salary, but for flexible hours: productivity doesn't depend on the hours.", grammar: [g.connectors-contrast], vocab: [w.sino, w.sueldo, w.horario, w.flexible, w.productividad, w.depender] }
      - { es: "Me gusta trabajar desde casa; sin embargo, soy menos productivo y echo de menos a mis compañeros.", en: "I like working from home; however, I'm less productive and I miss my colleagues.", grammar: [g.connectors-contrast], vocab: [w.sin-embargo, w.productivo, w.echar, w.companero], note: "echar de menos = to miss (someone or something).", variant: "In Latin America: extrañar a alguien." }
      - { es: "A pesar de la lluvia, miles de personas salieron a la manifestación, a diferencia del año pasado.", en: "Despite the rain, thousands of people went out to the demonstration, unlike last year.", grammar: [g.connectors-contrast], vocab: [w.a-pesar-de, w.lluvia, w.persona, w.manifestacion, w.a-diferencia-de] }
      - { es: "Mi hermana está a favor de las clases presenciales, excepto en verano; yo, en cambio, prefiero las clases por internet.", en: "My sister is in favour of in-person classes, except in summer; I, on the other hand, prefer online classes.", grammar: [g.connectors-contrast], vocab: [w.a-favor, w.presencial, w.excepto, w.verano, w.en-cambio, w.clase, w.internet] }
      - { es: "Por un lado, el coche ofrece comodidad; por otro lado, aparcar en el centro es muy difícil.", en: "On the one hand, the car offers convenience; on the other, parking in the centre is very difficult.", grammar: [g.connectors-contrast], vocab: [w.por-un-lado, w.por-otro-lado, w.coche, w.ofrecer, w.comodidad, w.aparcar] }
      - { es: "Muchos están en contra de la nueva ley; no obstante, el gobierno la ha aprobado.", en: "Many are against the new law; nevertheless, the government has passed it.", grammar: [g.connectors-contrast, g.direct-object-pronouns], vocab: [w.en-contra, w.ley, w.no-obstante, w.gobierno] }
      - { es: "Mientras que mi padre lee el periódico, mi madre lee las noticias en el móvil.", en: "Whereas my father reads the newspaper, my mother reads the news on her phone.", grammar: [g.connectors-contrast], vocab: [w.mientras-que, w.periodico, w.noticia, w.movil] }
      - { es: "En el debate, cada uno defendió sus argumentos sin gritar.", en: "In the debate, each person defended their arguments without shouting.", grammar: [g.connectors-contrast, g.preterite-regular], vocab: [w.debate, w.defender, w.argumento, w.gritar] }
      - { es: "Discutimos durante horas; aun así, al final nadie cambió de opinión y seguimos en desacuerdo.", en: "We argued for hours; even so, in the end nobody changed their mind and we still disagree.", grammar: [g.connectors-contrast], vocab: [w.discutir, w.aun-asi, w.al-final, w.cambiar-de, w.opinion, w.desacuerdo] }
      - { es: "Es fácil criticar; por el contrario, apoyar a alguien cuando lo necesita cuesta más.", en: "It's easy to criticise; on the contrary, supporting someone when they need it is harder.", grammar: [g.connectors-contrast], vocab: [w.criticar, w.por-el-contrario, w.apoyar, w.costar] }
      - { es: "Aunque la discusión fue dura, seguimos siendo amigos.", en: "Although the argument was hard, we're still friends.", grammar: [g.connectors-contrast, g.preterite-ser-ir], vocab: [w.aunque, w.discusion, w.duro, w.seguir-gerundio] }
      - { es: "Los jóvenes no leen menos, sino que leen en pantallas.", en: "Young people don't read less, but rather they read on screens.", grammar: [g.connectors-contrast], vocab: [w.sino, w.joven, w.leer, w.pantalla], note: "sino que before a conjugated verb." }
      - { es: "No es médico, sino enfermero.", en: "He isn't a doctor, but a nurse.", grammar: [g.connectors-contrast], vocab: [w.sino, w.medico, w.enfermero], error: { wrong: "No es médico, pero enfermero.", explain: "After a negative, a correction uses sino, not pero.", grammar: g.connectors-contrast } }
      - { es: "Estaba cansada. Terminó el informe.", en: "She was tired. She finished the report.", grammar: [g.connectors-contrast], vocab: [w.cansado, w.terminar, w.informe, w.aunque], transform: { instruction: "Join the sentences with aunque", answer: "Aunque estaba cansada, terminó el informe.", alt: ["Terminó el informe aunque estaba cansada."] } }
      - { es: "A pesar de que el horario es largo, el trabajo me encanta; de todas formas, me gustaría salir antes los viernes.", en: "Even though the hours are long, I love the job; anyway, I'd like to leave earlier on Fridays.", grammar: [g.connectors-contrast, g.conditional-hypothetical], vocab: [w.a-pesar-de, w.horario, w.largo, w.encantar, w.de-todas-formas, w.gustaria], note: "a pesar de que + conjugated verb; a pesar de + noun or infinitive." }
  - id: b1.u11.l3
    title: Organizar un texto
    teach: [g.connectors-order]
    vocab: [w.en-primer-lugar, w.para-empezar, w.asimismo, w.por-otra-parte, w.en-segundo-lugar, w.a-continuacion, w.por-ultimo, w.por-ejemplo, w.sobre-todo, w.especialmente, w.desde-mi-punto-de-vista, w.personalmente, w.redaccion, w.parrafo, w.introduccion, w.conclusion, w.ante-todo, w.en-definitiva, w.resumir, w.texto, w.palabra, w.principal]
    tip: "Open (en primer lugar, para empezar), add (además, asimismo), sequence (a continuación, por último), exemplify (por ejemplo, es decir), close (en resumen, en conclusión)."
    sentences:
      - { es: "En primer lugar, y ante todo, quiero dar las gracias a todos por venir.", en: "Firstly, and above all, I want to thank everyone for coming.", grammar: [g.connectors-order], vocab: [w.en-primer-lugar, w.ante-todo, w.gracias.phr, w.venir] }
      - { es: "Para empezar, el tema principal de mi texto es la vida en las ciudades.", en: "To begin with, the main topic of my text is life in cities.", grammar: [g.connectors-order], vocab: [w.para-empezar, w.tema, w.principal, w.texto, w.ciudad] }
      - { es: "En segundo lugar, hablaré de los problemas del tráfico y, a continuación, de la contaminación.", en: "Secondly, I'll talk about traffic problems and, next, about pollution.", grammar: [g.connectors-order, g.future-simple], vocab: [w.en-segundo-lugar, w.a-continuacion, w.trafico, w.contaminacion] }
      - { es: "Por otra parte, la ciudad ofrece muchas oportunidades de trabajo; asimismo, tiene mejores hospitales.", en: "On the other hand, the city offers many job opportunities; likewise, it has better hospitals.", grammar: [g.connectors-order], vocab: [w.por-otra-parte, w.ofrecer, w.oportunidad, w.asimismo, w.hospital] }
      - { es: "Practico deportes de equipo, es decir, fútbol y baloncesto.", en: "I play team sports, that is, football and basketball.", grammar: [g.connectors-order], vocab: [w.es-decir, w.deporte, w.equipo, w.futbol, w.baloncesto], note: "practicar un deporte = to play a sport." }
      - { es: "No voy a ir a la fiesta, o sea, que no me esperéis.", en: "I'm not going to the party, I mean, don't wait for me.", grammar: [g.connectors-order, g.imperative-negative], vocab: [w.o-sea, w.fiesta, w.esperar] }
      - { es: "Sobre todo, hay que reciclar más, especialmente en las grandes ciudades.", en: "Above all, we have to recycle more, especially in big cities.", grammar: [g.connectors-order], vocab: [w.sobre-todo, w.hay-que, w.reciclar, w.especialmente] }
      - { es: "De hecho, muchas ciudades ya han cerrado el centro a los coches.", en: "In fact, many cities have already closed the centre to cars.", grammar: [g.connectors-order, g.present-perfect], vocab: [w.de-hecho, w.cerrar, w.centro, w.coche] }
      - { es: "Por ejemplo, en Barcelona mucha gente va al trabajo en bici.", en: "For example, in Barcelona many people go to work by bike.", grammar: [g.connectors-order], vocab: [w.por-ejemplo, w.gente, w.bici, w.trabajo] }
      - { es: "Desde mi punto de vista, el medio ambiente es el tema más importante de nuestro siglo.", en: "From my point of view, the environment is the most important issue of our century.", grammar: [g.connectors-order, g.superlatives], vocab: [w.desde-mi-punto-de-vista, w.medio-ambiente, w.tema, w.siglo] }
      - { es: "Personalmente, prefiero vivir en un pueblo tranquilo, aunque está lejos de todo.", en: "Personally, I prefer living in a quiet village, even though it's far from everything.", grammar: [g.connectors-order, g.connectors-contrast], vocab: [w.personalmente, w.pueblo, w.tranquilo, w.lejos, w.aunque] }
      - { es: "Por último, la conclusión resume en pocas palabras las ideas más importantes del texto.", en: "Lastly, the conclusion summarises in a few words the most important ideas of the text.", grammar: [g.connectors-order], vocab: [w.por-ultimo, w.conclusion, w.resumir, w.palabra, w.texto] }
      - { es: "En definitiva, vivir en la ciudad tiene ventajas y desventajas.", en: "All in all, living in the city has advantages and disadvantages.", grammar: [g.connectors-order], vocab: [w.en-definitiva, w.ventaja, w.desventaja, w.vivir] }
      - { es: "En conclusión, una redacción necesita una introducción, dos o tres párrafos y una conclusión.", en: "In conclusion, an essay needs an introduction, two or three paragraphs and a conclusion.", grammar: [g.connectors-order], vocab: [w.en-conclusion, w.redaccion, w.introduccion, w.parrafo, w.conclusion] }
      - { es: "Por último, quiero dar las gracias a mis profesores.", en: "Finally, I want to thank my teachers.", grammar: [g.connectors-order], vocab: [w.por-ultimo, w.gracias.phr, w.profesor], error: { wrong: "Por última, quiero dar las gracias a mis profesores.", explain: "The connector is a fixed form: por último, whoever is speaking.", grammar: g.connectors-order } }
      - { es: "Primero, la ciudad es cara. Segundo, hay mucho ruido. Prefiero el pueblo.", en: "First, the city is expensive. Second, there's a lot of noise. I prefer the village.", grammar: [g.connectors-order], vocab: [w.en-primer-lugar, w.ademas, w.en-resumen, w.ruido], transform: { instruction: "Rewrite with en primer lugar, además and en resumen", answer: "En primer lugar, la ciudad es cara; además, hay mucho ruido. En resumen, prefiero el pueblo.", alt: ["En primer lugar, la ciudad es cara. Además, hay mucho ruido. En resumen, prefiero el pueblo."] } }
  - id: b1.u11.l4
    title: Cartas formales
    teach: [g.formal-letters]
    vocab: [w.estimado, w.atentamente, w.cordial, w.saludar, w.dirigirse-a, w.adjuntar, w.queja, w.reclamacion, w.a-quien-corresponda, w.disposicion, w.asistir, w.devolucion, w.disculpa, w.lamentar, w.firmar, w.presentar, w.error, w.molestia, w.asistencia, w.disculparse, w.adjunto, w.a-la-espera-de, w.firma]
    tip: "Estimado/a señor/a: (colon) … Le escribo para … Quedo a la espera de su respuesta. Atentamente, — use usted throughout."
    sentences:
      - { es: "Estimada señora Ruiz: Le escribo para solicitar información sobre el curso de verano.", en: "Dear Mrs Ruiz, I am writing to request information about the summer course.", grammar: [g.formal-letters], vocab: [w.estimado, w.solicitar, w.informacion, w.curso], note: "Spanish uses a colon after the greeting, not a comma." }
      - { es: "Me dirijo a ustedes con el fin de presentar una queja por el retraso de mi pedido.", en: "I am writing to you in order to make a complaint about the delay of my order.", grammar: [g.formal-letters], vocab: [w.dirigirse-a, w.presentar, w.queja, w.retraso, w.pedido], note: "con el fin de = in order to." }
      - { es: "Adjunto le envío mi currículum, como me pidió por teléfono.", en: "Please find attached my CV, as you asked me by phone.", grammar: [g.formal-letters], vocab: [w.adjunto, w.adjuntar, w.curriculum, w.pedir, w.telefono], note: "adjunto here works like an adverb: enclosed / attached." }
      - { es: "Les agradecería que me informaran sobre los precios y los horarios.", en: "I would be grateful if you could inform me about prices and timetables.", grammar: [g.formal-letters], vocab: [w.agradecer, w.informar, w.precio, w.horario], note: "informaran is the imperfect subjunctive, required after agradecería que." }
      - { es: "Le confirmo mi asistencia a la entrevista del martes a las diez; asistiré con mucho gusto.", en: "I confirm my attendance at the interview on Tuesday at ten; I will be very glad to attend.", grammar: [g.formal-letters, g.future-simple], vocab: [w.confirmar, w.asistencia, w.asistir, w.entrevista, w.martes] }
      - { es: "Quedo a la espera de su respuesta. Atentamente, Marta Gil.", en: "I look forward to your reply. Yours sincerely, Marta Gil.", grammar: [g.formal-letters], vocab: [w.a-la-espera-de, w.respuesta, w.atentamente, w.quedar] }
      - { es: "A quien corresponda: Solicito la devolución del dinero de un billete de tren que no pude coger.", en: "To whom it may concern: I request a refund for a train ticket I was unable to take.", grammar: [g.formal-letters, g.relative-que-quien], vocab: [w.a-quien-corresponda, w.solicitar, w.devolucion, w.billete] }
      - { es: "Nos disculpamos por el error y lamentamos las molestias.", en: "We apologise for the error and regret the inconvenience.", grammar: [g.formal-letters], vocab: [w.disculparse, w.error, w.lamentar, w.molestia], note: "pedir disculpas = disculparse = to apologise." }
      - { es: "Le ruego que me envíe la factura con su firma lo antes posible.", en: "I kindly ask you to send me the invoice with your signature as soon as possible.", grammar: [g.formal-letters, g.indirect-commands], vocab: [w.rogar, w.enviar, w.factura, w.firma, w.firmar, w.pronto.phr] }
      - { es: "Quedo a su disposición para cualquier consulta. Un cordial saludo, Luis Pérez.", en: "I remain at your disposal for any queries. Kind regards, Luis Pérez.", grammar: [g.formal-letters], vocab: [w.disposicion, w.cualquier, w.consulta, w.cordial, w.saludar] }
      - { es: "He presentado una reclamación porque el hotel no era el que reservé.", en: "I have made a complaint because the hotel wasn't the one I booked.", grammar: [g.formal-letters, g.relative-que-quien], vocab: [w.reclamacion, w.hotel, w.reservar] }
      - { es: "Me gustaría solicitar el puesto de camarero que ofrecen en su restaurante.", en: "I would like to apply for the waiter position you are offering in your restaurant.", grammar: [g.formal-letters, g.relative-que-quien], vocab: [w.puesto, w.camarero, w.ofrecer, w.restaurante, w.gustaria] }
      - { es: "En espera de sus noticias, le saluda atentamente, Carmen López.", en: "Awaiting your news, yours faithfully, Carmen López.", grammar: [g.formal-letters], vocab: [w.noticia, w.saludar, w.atentamente] }
      - { es: "Les informamos de que su pedido llegará el lunes.", en: "We inform you that your order will arrive on Monday.", grammar: [g.formal-letters, g.future-simple], vocab: [w.informar, w.pedido, w.llegar, w.lunes], note: "informar de que: the de is standard in formal Spanish." }
      - { es: "Estimado señor García: Le escribo para solicitar información sobre el alquiler del piso.", en: "Dear Mr García, I am writing to request information about renting the flat.", grammar: [g.formal-letters], vocab: [w.estimado, w.solicitar, w.alquiler, w.piso], error: { wrong: "Querido señor García: Le escribo para solicitar información sobre el alquiler del piso.", explain: "In a formal letter use Estimado/a; Querido/a is for friends and family.", grammar: g.formal-letters } }
      - { es: "Hola, Ana: ¿me mandas la factura? Un beso.", en: "Hi Ana, can you send me the invoice? Kisses.", grammar: [g.formal-letters], vocab: [w.enviar.phr, w.factura, w.rogar], transform: { instruction: "Rewrite as a formal email to señora Ortega", answer: "Estimada señora Ortega: Le ruego que me envíe la factura. Atentamente,", alt: ["Estimada señora Ortega: Le agradecería que me enviara la factura. Atentamente,", "Estimada señora Ortega: Les agradecería que me enviaran la factura. Atentamente,"] } }
dialogues:
  - id: b1.u11.d1
    title: Una reclamación por teléfono
    context: Señora Vidal calls an online shop because the order she received is not what she bought.
    lines:
      - { speaker: Empleado, es: "Tienda Casa y Jardín, buenos días. ¿En qué puedo ayudarle?", en: "Casa y Jardín shop, good morning. How can I help you?" }
      - { speaker: Sra. Vidal, es: "Buenos días. Llamo para presentar una reclamación. Hice un pedido hace dos semanas y ayer, por fin, llegó; sin embargo, no es lo que compré.", en: "Good morning. I'm calling to make a complaint. I placed an order two weeks ago and yesterday, at last, it arrived; however, it isn't what I bought." }
      - { speaker: Empleado, es: "Lo lamento mucho, señora. ¿Me puede dar el número del pedido, por favor?", en: "I'm very sorry, madam. Can you give me the order number, please?" }
      - { speaker: Sra. Vidal, es: "Sí, es el 4517. Pedí una lámpara blanca y, en cambio, me han enviado una mesa pequeña.", en: "Yes, it's 4517. I ordered a white lamp and, instead, they've sent me a small table." }
      - { speaker: Empleado, es: "Ya lo veo. Por lo visto ha habido un error en el almacén. Le pido disculpas en nombre de la empresa.", en: "I see it now. Apparently there has been a mistake in the warehouse. I apologise on behalf of the company." }
      - { speaker: Sra. Vidal, es: "Se lo agradezco, pero quiero una solución. O me envían la lámpara esta semana o solicito la devolución del dinero.", en: "I appreciate that, but I want a solution. Either you send me the lamp this week or I'll request a refund." }
      - { speaker: Empleado, es: "Por supuesto. Puesto que el error es nuestro, le enviamos la lámpara mañana mismo y recogemos la mesa sin ningún coste.", en: "Of course. Since the mistake is ours, we'll send you the lamp tomorrow and collect the table at no cost." }
      - { speaker: Sra. Vidal, es: "De acuerdo. Además, me gustaría recibir la confirmación por escrito.", en: "All right. In addition, I'd like to receive the confirmation in writing." }
      - { speaker: Empleado, es: "Ahora mismo le mando un correo con todos los datos. Y, como disculpa, le hacemos un descuento del diez por ciento en su próxima compra.", en: "I'll send you an email with all the details right now. And, by way of apology, we'll give you a ten per cent discount on your next purchase." }
      - { speaker: Sra. Vidal, es: "Muy amable. Entonces quedo a la espera de su correo. Buenos días.", en: "Very kind. Then I'll wait for your email. Good day." }
