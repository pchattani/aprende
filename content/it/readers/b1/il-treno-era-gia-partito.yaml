  - { es: tenersi libera, en: to keep herself free }
  - { es: calcolato, en: worked out, calculated }
  - { es: relazione, en: report }
  - { es: urgente, en: urgent }
  - { es: tabellone, en: departures board }
  - { es: esauriti, en: sold out }
  - { es: regionale, en: regional (slow) train }
  - { es: candela, en: candle }
  - { es: gentilissimo, en: very kind }
  - { es: disperato, en: desperate }
  - { es: dettaglio, en: detail }
  - { es: interrotto, en: interrupted }
  - { es: amarone, en: Amarone (a red wine from Verona) }
