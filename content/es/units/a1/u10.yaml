id: a1.u10
title: Tiempo libre y el tiempo
lessons:
  - id: a1.u10.l1
    title: ¿Qué tiempo hace?
    teach: [g.weather]
    vocab: [w.tiempo, w.sol, w.viento, w.lluvia, w.nieve, w.nube, w.cielo, w.grado, w.llover, w.nevar, w.nublado, w.primavera, w.verano, w.otono, w.invierno]
    sentences:
      - { es: "¿Qué tiempo hace hoy?", en: "What's the weather like today?", grammar: [g.weather, g.question-words], vocab: [w.tiempo] }
      - { es: "Hace mucho calor y hace sol.", en: "It is very hot and sunny.", grammar: [g.weather], vocab: [w.calor, w.sol], error: { wrong: "Es mucho calor y es sol.", explain: "Weather uses hacer: hace calor, hace sol.", grammar: g.weather } }
      - { es: "Hace frío en invierno.", en: "It is cold in winter.", grammar: [g.weather], vocab: [w.frio.noun, w.invierno] }
      - { es: "Hoy hace viento en la playa.", en: "Today it is windy at the beach.", grammar: [g.weather], vocab: [w.viento, w.playa] }
      - { es: "Está nublado y va a llover.", en: "It is cloudy and it is going to rain.", grammar: [g.weather, g.ir-a-infinitive], vocab: [w.nublado, w.llover] }
      - { es: "Llueve mucho en otoño.", en: "It rains a lot in autumn.", grammar: [g.weather], vocab: [w.llover, w.otono] }
      - { es: "En la montaña nieva en diciembre.", en: "In the mountains it snows in December.", grammar: [g.weather], vocab: [w.nevar, w.montana] }
      - { es: "El cielo está azul y no hay nubes.", en: "The sky is blue and there are no clouds.", grammar: [g.hay], vocab: [w.cielo, w.nube] }
      - { es: "Estamos a treinta grados.", en: "It is thirty degrees.", grammar: [g.weather], vocab: [w.grado, w.treinta] }
      - { es: "En primavera hace buen tiempo.", en: "In spring the weather is good.", grammar: [g.weather], vocab: [w.primavera, w.bueno] }
      - { es: "Me gusta la lluvia pero no me gusta el frío.", en: "I like rain but I don't like the cold.", grammar: [g.gustar], vocab: [w.lluvia, w.frio.noun] }
      - { es: "En verano no llueve casi nunca.", en: "In summer it hardly ever rains.", grammar: [g.frequency-adverbs], vocab: [w.verano, w.llover] }
      - { es: "La nieve es blanca y fría.", en: "Snow is white and cold.", grammar: [g.adjective-agreement], vocab: [w.nieve, w.blanco], transform: { instruction: "Change to the plural: las nubes (clouds) are white", answer: "Las nubes son blancas." } }
  - id: a1.u10.l2
    title: Deportes y aficiones
    teach: [g.jugar-tocar]
    vocab: [w.jugar, w.tocar, w.futbol, w.tenis, w.baloncesto, w.natacion, w.nadar, w.correr, w.bailar, w.cantar, w.pintar, w.guitarra, w.piano, w.cancion, w.cartas, w.videojuego, w.serie, w.equipo, w.partido, w.paseo]
    sentences:
      - { es: "Juego al fútbol los sábados.", en: "I play football on Saturdays.", grammar: [g.jugar-tocar, g.stem-changing-present], vocab: [w.jugar, w.futbol], error: { wrong: "Juego fútbol los sábados.", explain: "In Spain: jugar al fútbol (a + el).", grammar: g.jugar-tocar } }
      - { es: "¿Juegas al tenis o al baloncesto?", en: "Do you play tennis or basketball?", grammar: [g.jugar-tocar], vocab: [w.tenis, w.baloncesto] }
      - { es: "Mi hermana toca el piano muy bien.", en: "My sister plays the piano very well.", grammar: [g.jugar-tocar], vocab: [w.tocar, w.piano], error: { wrong: "Mi hermana juega el piano muy bien.", explain: "Instruments take tocar, not jugar.", grammar: g.jugar-tocar } }
      - { es: "Toco la guitarra y canto canciones.", en: "I play the guitar and sing songs.", grammar: [g.jugar-tocar], vocab: [w.guitarra, w.cantar, w.cancion] }
      - { es: "Hago natación dos veces a la semana.", en: "I do swimming twice a week.", grammar: [g.hacer-present], vocab: [w.natacion, w.vez] }
      - { es: "Nadamos en el mar en verano.", en: "We swim in the sea in summer.", grammar: [g.regular-ar-present], vocab: [w.nadar, w.mar] }
      - { es: "Corro por el parque por la mañana.", en: "I run through the park in the morning.", grammar: [g.prepositions-movement], vocab: [w.correr, w.parque] }
      - { es: "Los domingos jugamos a las cartas con los abuelos.", en: "On Sundays we play cards with our grandparents.", grammar: [g.jugar-tocar], vocab: [w.cartas, w.abuelo] }
      - { es: "A mi hermano le encantan los videojuegos.", en: "My brother loves video games.", grammar: [g.gustar-plural], vocab: [w.videojuego] }
      - { es: "Veo una serie todas las noches.", en: "I watch a series every night.", grammar: [g.frequency-adverbs], vocab: [w.serie, w.ver] }
      - { es: "Mi equipo juega un partido importante hoy.", en: "My team plays an important match today.", grammar: [g.jugar-tocar], vocab: [w.equipo, w.partido] }
      - { es: "Me gusta bailar y pintar.", en: "I like dancing and painting.", grammar: [g.gustar-plural], vocab: [w.bailar, w.pintar] }
      - { es: "Damos un paseo después de cenar.", en: "We go for a walk after dinner.", grammar: [g.regular-ar-present], vocab: [w.paseo, w.cenar] }
      - { es: "Ella juega al tenis.", en: "She plays tennis.", grammar: [g.jugar-tocar], vocab: [w.jugar, w.tenis], transform: { instruction: "Change to 'they'", answer: "Juegan al tenis.", alt: ["Ellos juegan al tenis.", "Ellas juegan al tenis."] } }
  - id: a1.u10.l3
    title: Quiero, puedo, prefiero
    teach: [g.stem-changing-present]
    vocab: [w.entender, w.pensar, w.recordar, w.encontrar, w.pedir, w.seguir, w.repetir, w.perder, w.ganar, w.favorito, w.interesante, w.facil, w.dificil, w.importante, w.mejor]
    sentences:
      - { es: "No entiendo la pregunta. ¿Puedes repetir?", en: "I don't understand the question. Can you repeat?", grammar: [g.stem-changing-present], vocab: [w.entender, w.repetir] }
      - { es: "¿Qué piensas de la película? Pienso que es interesante.", en: "What do you think of the film? I think it's interesting.", grammar: [g.stem-changing-present], vocab: [w.pensar, w.interesante] }
      - { es: "No recuerdo su nombre.", en: "I don't remember his name.", grammar: [g.stem-changing-present], vocab: [w.recordar, w.nombre] }
      - { es: "Nunca encuentro mis llaves.", en: "I never find my keys.", grammar: [g.stem-changing-present, g.frequency-adverbs], vocab: [w.encontrar, w.llave] }
      - { es: "Pido un café y mi amigo pide un té.", en: "I order a coffee and my friend orders a tea.", grammar: [g.stem-changing-present], vocab: [w.pedir] }
      - { es: "Sigue todo recto hasta la plaza.", en: "Go straight on to the square.", grammar: [g.directions-imperative], vocab: [w.seguir, w.plaza] }
      - { es: "Siempre pierdo el autobús por la mañana.", en: "I always miss the bus in the morning.", grammar: [g.stem-changing-present], vocab: [w.perder, w.autobus] }
      - { es: "Mi equipo favorito gana el partido.", en: "My favourite team wins the match.", grammar: [g.adjectives-position], vocab: [w.ganar, w.favorito] }
      - { es: "El español es fácil pero el chino es difícil.", en: "Spanish is easy but Chinese is difficult.", grammar: [g.connectors-basic], vocab: [w.facil, w.dificil] }
      - { es: "Es importante hacer deporte.", en: "It is important to do sport.", grammar: [g.hay-que], vocab: [w.importante, w.deporte] }
      - { es: "¿Cuál es tu mejor amigo?", en: "Who is your best friend?", grammar: [g.question-words], vocab: [w.mejor, w.amigo] }
      - { es: "Preferimos el tenis al fútbol.", en: "We prefer tennis to football.", grammar: [g.stem-changing-present], vocab: [w.preferir, w.tenis] }
      - { es: "Entendemos un poco de italiano.", en: "We understand a little Italian.", grammar: [g.stem-changing-present], vocab: [w.entender, w.italiano], error: { wrong: "Entiendemos un poco de italiano.", explain: "nosotros keeps the original vowel: entendemos.", grammar: g.stem-changing-present } }
      - { es: "Ella piensa en su familia.", en: "She thinks about her family.", grammar: [g.stem-changing-present], vocab: [w.pensar], transform: { instruction: "Change to 'we'", answer: "Pensamos en nuestra familia.", alt: ["Nosotros pensamos en nuestra familia."] } }
  - id: a1.u10.l4
    title: ¿Te gusta? A mí también
    teach: [g.gustar-plural, g.saber-vs-conocer]
    vocab: [w.tambien.phr, w.tampoco, w.gratis, w.fuera]
    sentences:
      - { es: "Me gusta el cine. ¿Y a ti? A mí también.", en: "I like the cinema. And you? Me too.", grammar: [g.gustar-plural, g.tambien-tampoco], vocab: [w.tambien.phr, w.cine] }
      - { es: "No me gusta el fútbol. — A mí tampoco.", en: "I don't like football. — Me neither.", grammar: [g.tambien-tampoco], vocab: [w.tampoco, w.futbol] }
      - { es: "A mis padres les gusta viajar.", en: "My parents like travelling.", grammar: [g.gustar-plural], vocab: [w.viajar] }
      - { es: "Nos encanta nadar en el río.", en: "We love swimming in the river.", grammar: [g.gustar-plural], vocab: [w.nadar, w.rio] }
      - { es: "¿Os gustan las series españolas?", en: "Do you (all) like Spanish series?", grammar: [g.gustar-plural], vocab: [w.serie] }
      - { es: "¿Sabes nadar? Sí, sé nadar muy bien.", en: "Can you swim? Yes, I can swim very well.", grammar: [g.saber-vs-conocer], vocab: [w.saber, w.nadar] }
      - { es: "No sé tocar el piano.", en: "I can't play the piano.", grammar: [g.saber-vs-conocer], vocab: [w.saber, w.piano] }
      - { es: "¿Conoces Barcelona? Sí, la conozco bien.", en: "Do you know Barcelona? Yes, I know it well.", grammar: [g.saber-vs-conocer, g.direct-object-intro], vocab: [w.conocer] }
      - { es: "Sé que vives en Madrid.", en: "I know that you live in Madrid.", grammar: [g.saber-vs-conocer], vocab: [w.saber], error: { wrong: "Conozco que vives en Madrid.", explain: "Facts take saber: sé que…", grammar: g.saber-vs-conocer } }
      - { es: "El concierto es gratis.", en: "The concert is free.", grammar: [g.ser-present], vocab: [w.gratis, w.concierto] }
      - { es: "Los niños juegan fuera.", en: "The children play outside.", grammar: [g.jugar-tocar], vocab: [w.fuera, w.jugar] }
      - { es: "A Juan le gusta el baloncesto y a mí me gusta el tenis.", en: "Juan likes basketball and I like tennis.", grammar: [g.gustar-plural], vocab: [w.baloncesto, w.tenis] }
      - { es: "Me gustan las canciones de este grupo.", en: "I like this band's songs.", grammar: [g.gustar-plural], vocab: [w.cancion] }
dialogues:
  - id: a1.u10.d1
    title: Un domingo de lluvia
    context: Pablo and Yuki decide what to do on a rainy Sunday.
    lines:
      - { speaker: Pablo, es: "¡Qué tiempo tan malo! Llueve y hace frío.", en: "What awful weather! It's raining and it's cold." }
      - { speaker: Yuki, es: "Sí, y hace viento. No podemos jugar al tenis.", en: "Yes, and it's windy. We can't play tennis." }
      - { speaker: Pablo, es: "¿Te gusta el cine? Hay una película española muy buena.", en: "Do you like the cinema? There's a very good Spanish film." }
      - { speaker: Yuki, es: "Me encanta el cine, pero prefiero quedarme en casa. ¿Sabes jugar a las cartas?", en: "I love the cinema, but I'd rather stay at home. Do you know how to play cards?" }
      - { speaker: Pablo, es: "No muy bien. ¿Tocas la guitarra? Yo canto un poco.", en: "Not very well. Do you play the guitar? I sing a bit." }
      - { speaker: Yuki, es: "Sí, toco la guitarra desde pequeña. ¿Qué canciones conoces?", en: "Yes, I've played the guitar since I was little. What songs do you know?" }
      - { speaker: Pablo, es: "Conozco muchas canciones de los años ochenta.", en: "I know lots of songs from the eighties." }
      - { speaker: Yuki, es: "¡Perfecto! Y después vemos una serie. A mí me gustan las series de misterio.", en: "Perfect! And afterwards we'll watch a series. I like mystery series." }
      - { speaker: Pablo, es: "A mí también. Pero primero, un café caliente.", en: "Me too. But first, a hot coffee." }
    questions:
      - { q: "Why can't they play tennis?", options: ["It is too hot", "It is raining and windy", "They don't have a court"], answer: 1 }
      - { q: "What does Yuki play?", options: ["The piano", "The guitar", "Cards"], answer: 1 }
      - { q: "What kind of series does Yuki like?", options: ["Comedy", "Mystery", "Sport"], answer: 1 }
