id: r.b1.una-reclamacion-y-su-respuesta
level: b1
title: Una reclamación y su respuesta
kind: text
intro: Beatriz writes a formal letter of complaint about a broken washing machine, and the shop's customer service replies.
allow: [beatriz, molina, ruiz, javier, soto, aqua]
paragraphs:
  - { es: "Madrid, 14 de marzo de 2026. Estimados señores: Me dirijo a ustedes para presentar una reclamación en relación con la lavadora que compré en su tienda el pasado 2 de febrero, modelo Aqua 500, factura número 48213.", en: "Madrid, 14 March 2026. Dear Sirs, I am writing to you to make a complaint regarding the washing machine I bought in your shop on 2 February, model Aqua 500, invoice number 48213." }
  - { es: "La lavadora funcionó bien durante tres semanas. Sin embargo, desde el 25 de febrero está averiada: se para a mitad del programa y el agua no sale. Llamé al servicio técnico el mismo día y me dijeron que un técnico vendría en cuarenta y ocho horas. Llevo dos semanas esperando y nadie ha venido todavía.", en: "The washing machine worked well for three weeks. However, since 25 February it has been out of order: it stops halfway through the programme and the water does not drain. I called the technical service the same day and they told me a technician would come within forty-eight hours. I have been waiting for two weeks and nobody has come yet." }
  - { es: "He llamado cuatro veces más. Cada vez me dicen que la visita está pendiente y que tenga paciencia. Puesto que la lavadora está en garantía y el problema no es culpa mía, considero que la situación es inaceptable. Además, tengo dos hijos pequeños y lavar la ropa a mano no es una solución.", en: "I have called four more times. Each time they tell me the visit is pending and to be patient. Since the washing machine is under guarantee and the problem is not my fault, I consider the situation unacceptable. Besides, I have two small children and washing clothes by hand is not a solution." }
  - { es: "Por todo ello, les ruego que reparen la lavadora en un plazo máximo de siete días o que me devuelvan el dinero. En caso contrario, presentaré una queja en la oficina del consumidor. Adjunto copia de la factura y de la garantía. Quedo a la espera de su respuesta. Atentamente, Beatriz Molina Ruiz.", en: "For all these reasons, I ask you to repair the washing machine within a maximum of seven days or to refund my money. Otherwise, I will file a complaint with the consumer office. I enclose a copy of the invoice and the guarantee. I look forward to your reply. Yours faithfully, Beatriz Molina Ruiz." }
  - { es: "Madrid, 17 de marzo de 2026. Estimada señora Molina: Le escribo en respuesta a su carta del 14 de marzo. Ante todo, le pedimos disculpas por las molestias y por el retraso del servicio técnico, debido a un error en nuestro sistema de citas.", en: "Madrid, 17 March 2026. Dear Mrs Molina, I am writing in reply to your letter of 14 March. First of all, we apologise for the inconvenience and for the delay of the technical service, due to an error in our appointment system." }
  - { es: "Lamentamos mucho lo ocurrido. Hemos comprobado que su lavadora está en garantía y, por consiguiente, la reparación es gratuita. Un técnico irá a su casa el jueves 19 de marzo por la mañana. Si la lavadora no se puede arreglar, se la cambiaremos por una nueva sin ningún coste.", en: "We very much regret what has happened. We have checked that your washing machine is under guarantee and, consequently, the repair is free of charge. A technician will come to your home on Thursday 19 March in the morning. If the washing machine cannot be fixed, we will replace it with a new one at no cost." }
  - { es: "Asimismo, como disculpa, le ofrecemos un descuento del veinte por ciento en su próxima compra. Puede estar segura de que estamos trabajando para que esto no vuelva a ocurrir. Quedo a su disposición para cualquier consulta. Le saluda atentamente, Javier Soto, responsable de atención al cliente.", en: "Likewise, by way of apology, we offer you a twenty per cent discount on your next purchase. You can be sure that we are working so that this does not happen again. I remain at your disposal for any queries. Yours sincerely, Javier Soto, head of customer service." }
questions:
  - { q: "What is wrong with the washing machine?", options: ["It makes a loud noise", "It stops halfway through the programme and the water does not drain", "It does not switch on"], answer: 1 }
  - { q: "How long has Beatriz been waiting for the technician?", options: ["Two days", "Two weeks", "Two months"], answer: 1 }
  - { q: "What does Beatriz demand?", options: ["A new flat", "A repair within seven days or a refund", "A discount"], answer: 1 }
  - { q: "Why was the technical service delayed, according to the shop?", options: ["An error in the appointment system", "A strike", "The technician was ill"], answer: 0 }
  - { q: "What does the shop offer as an apology?", options: ["A free washing machine", "A twenty per cent discount on the next purchase", "A year of free repairs"], answer: 1 }
