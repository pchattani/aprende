id: r.b2.of-course-its-simple
level: b2
title: 梗係啦，咁簡單嘛
kind: dialogue
intro: Flatmates Ah Fan and Ah Kiu share a flat in Tung Chung. When Ah Fan announces she will cook a proper dinner for the first time, Ah Kiu is sceptical - and their particles say more than their words.
allow: [阿芬, 阿蕎]
paragraphs:
  - { es: "阿芬同阿蕎喺東涌一齊租屋住咗一年。兩個人性格好唔同：阿蕎好細心，乜嘢都計劃好；阿芬就隨和得滯，成日話「冇所謂啦」。佢哋平日返工好忙，十次有九次都係叫外賣。", en: "Ah Fan and Ah Kiu have been sharing a rented flat in Tung Chung for a year. Their personalities are very different: Ah Kiu is careful and plans everything; Ah Fan is far too easygoing and is always saying \"I don't mind\". They're both busy at work during the week, and nine times out of ten they order takeaway." }
  - { es: "星期五夜晚，阿芬一入門口就宣佈：「聽日我煮飯！我要煮一餐正式嘅晚飯：豉油雞、蒸魚同炒菜心。」阿蕎望住佢：「你識煮咩？上次你煲個公仔麵都燶咗喎。」阿芬：「嗰次係意外嚟㗎！今次我睇咗片，梗係得啦，咁簡單嘛。」", en: "On Friday night, as soon as Ah Fan came through the door she announced: \"Tomorrow I'm cooking! I'm going to make a proper dinner: soy sauce chicken, steamed fish and stir-fried choi sum.\" Ah Kiu looked at her: \"Since when can you cook? Last time you even burnt a pot of instant noodles.\" Ah Fan: \"That was an accident! This time I've watched videos, so of course I can do it - it's so simple.\"" }
  - { es: "第二日朝早，佢哋去東涌街市買餸。阿芬想買一條好大嘅魚，阿蕎話：「兩個人食，使乜買咁大條呀？」阿芬：「大條先抵食囉。」阿蕎：「抵食？食唔晒咪又係嘥囉。」最後阿芬揀咗條中等嘅，個魚販仲送咗啲葱畀佢哋。", en: "The next morning they went to Tung Chung market to buy food. Ah Fan wanted to buy a huge fish, and Ah Kiu said: \"There are only two of us - why on earth buy such a big one?\" Ah Fan: \"Big ones are better value, obviously.\" Ah Kiu: \"Better value? If we can't finish it, it's just a waste, isn't it.\" In the end Ah Fan chose a medium-sized one, and the fishmonger even threw in some spring onions for free." }
  - { es: "返到屋企，阿芬開始煮。佢一路睇住手機條片，一路切雞。阿蕎喺客廳聽到廚房「乒乒乓乓」，忍唔住行入去睇：「你條魚洗咗未呀？」阿芬：「未呀，蒸之前先洗嘛。」阿蕎：「唔係嘛，梗係要先洗乾淨同劏好先得㗎！你連魚都未劏？」", en: "Back home, Ah Fan started cooking. She chopped the chicken while watching the video on her phone. Ah Kiu heard banging and clattering from the kitchen and couldn't resist going in to look: \"Have you washed the fish?\" Ah Fan: \"Not yet, you wash it just before steaming, don't you?\" Ah Kiu: \"You're kidding! Of course you have to clean and gut it first! You haven't even gutted the fish?\"" }
  - { es: "阿芬：「魚販幫我劏咗㗎喇，你睇吓咪知囉。」阿蕎一睇，真係劏好咗。佢有啲尷尬：「噢……咁又係。」阿芬好得意：「係囉，我都話我得㗎嘛！」", en: "Ah Fan: \"The fishmonger gutted it for me. Have a look and you'll see.\" Ah Kiu looked, and it really had been gutted. She was a bit embarrassed: \"Oh... fair enough.\" Ah Fan was very pleased with herself: \"Exactly. I told you I could do it!\"" }
  - { es: "不過好景不常。十分鐘之後，廚房開始出煙，個煙霧警報器「嘟嘟」聲咁響。阿蕎衝入去，發現阿芬炒菜心唔記得落水，個鑊燶到黑晒。阿芬：「點會咁㗎？片入面明明好容易㗎！」阿蕎一邊開窗一邊話：「片入面嗰個係廚師嚟㗎嘛，你係廚師咩？」", en: "But the good times didn't last. Ten minutes later smoke began pouring out of the kitchen and the smoke alarm started beeping. Ah Kiu rushed in and found that Ah Fan had forgotten to add water when stir-frying the choi sum, and the wok was burnt black. Ah Fan: \"How did that happen? In the video it was so easy!\" Ah Kiu said as she opened the window: \"The person in the video is a chef! Are you a chef?\"" }
  - { es: "最後，豉油雞有少少鹹，蒸魚就啱啱好，菜心就……冇咗。兩個人坐低食飯，阿蕎食咗一啖魚，話：「其實都幾好食喎。」阿芬：「係咪先？我都話我有天份嘅。」阿蕎：「有天份？你下個禮拜賠個新鑊畀我先講啦。」", en: "In the end the soy sauce chicken was a little salty, the steamed fish was just right, and the choi sum... no longer existed. The two of them sat down to eat. Ah Kiu took a mouthful of fish and said: \"Actually, this is pretty good.\" Ah Fan: \"See? I told you I had talent.\" Ah Kiu: \"Talent? Buy me a new wok next week and then we'll talk.\"" }
  - { es: "雖然搞到成間屋都係煙，但係嗰晚兩個人笑咗好耐。阿芬話：「下個禮拜我再煮！」阿蕎即刻拎起電話：「唔使喇，我而家就叫外賣定先。」", en: "Even though the whole flat filled with smoke, the two of them laughed for a long time that evening. Ah Fan said: \"I'll cook again next week!\" Ah Kiu immediately picked up her phone: \"No need. I'll order next week's takeaway right now, just in case.\"" }
questions:
  - { q: "阿芬同阿蕎平日食飯通常點樣？", options: ["自己煮", "叫外賣", "返屋企食"], answer: 1, explain: "十次有九次都係叫外賣." }
  - { q: "阿蕎話「你識煮咩？」係咩意思？", options: ["佢真係想知阿芬識唔識煮", "佢唔相信阿芬識煮", "佢想阿芬教佢煮"], answer: 1, explain: "咩 here expresses doubt or surprise: she doesn't believe Ah Fan can cook, given the burnt instant noodles." }
  - { q: "邊個劏咗條魚？", options: ["阿芬", "阿蕎", "魚販"], answer: 2, explain: "魚販幫我劏咗㗎喇." }
  - { q: "點解個煙霧警報器會響？", options: ["阿芬炒菜心唔記得落水，個鑊燶咗", "條魚蒸得太耐", "有人食煙"], answer: 0, explain: "阿芬炒菜心唔記得落水，個鑊燶到黑晒." }
  - { q: "最後邊樣餸最好食？", options: ["豉油雞", "蒸魚", "菜心"], answer: 1, explain: "蒸魚就啱啱好; the chicken was salty and the choi sum was burnt." }
  - { q: "阿芬話「我都話我得㗎嘛！」係咩語氣？", options: ["好得意，覺得自己一早講啱", "好擔心", "好嬲"], answer: 0, explain: "嘛 points to something that should have been obvious: \"I told you so.\"" }
glossary:
  - { es: 公仔麵, en: instant noodles }
  - { es: 燶, en: burnt }
  - { es: 片, en: video (clip) }
  - { es: 中等, en: medium-sized }
  - { es: 魚販, en: fishmonger }
  - { es: 葱, en: spring onion }
  - { es: 乒乒乓乓, en: banging and clattering }
  - { es: 劏, en: to gut (a fish) }
  - { es: 好景不常, en: "good times don't last" }
  - { es: 煙霧警報器, en: smoke alarm }
  - { es: 嘟嘟, en: beep beep }
  - { es: 衝, en: to rush }
  - { es: 啖, en: mouthful (measure word) }
  - { es: 天份, en: talent }
  - { es: 定先, en: (first) just in case }
