id: c1.u05
title: "In bocca al lupo!"
lessons:
  - id: c1.u05.l1
    title: In bocca al lupo! Crepi!
    teach: [g.idioms]
    vocab: [w.in-bocca-al-lupo, w.crepi, w.acqua-in-bocca, w.avere-le-mani-bucate, w.prendere-due-piccioni-con-una-fava, w.non-vedere-lora, w.essere-al-verde, w.costare-un-occhio-della-testa, w.avere-un-diavolo-per-capello, w.fare-orecchie-da-mercante, w.rompere-il-ghiaccio, w.tagliare-la-corda, w.essere-in-gamba, w.avere-la-testa-fra-le-nuvole, w.cadere-dalle-nuvole, w.mettere-i-bastoni-tra-le-ruote, w.menare-il-can-per-laia, w.fare-il-passo-più-lungo-della-gamba, w.rosicare, w.metafora, w.locuzione, w.pescivendolo, w.pescheria]
    tip: "Idioms have fixed wording and can't be translated word for word: costa un occhio della testa (not dalla), Crepi! is the reply to In bocca al lupo!, and the verb is conjugated as usual: sono al verde, ha le mani bucate."
    sentences:
      - { es: "Domani hai l'esame all'università? In bocca al lupo! — Crepi!", en: "You've got your university exam tomorrow? Good luck! — Thanks!", altEs: ["Domani hai l'esame all'università? In bocca al lupo! — Crepi il lupo!"], altEn: ["Your exam at university is tomorrow? Break a leg! — Thanks!"], grammar: [g.idioms], vocab: [w.in-bocca-al-lupo, w.crepi], error: { wrong: "Domani hai l'esame all'università? In bocca al lupo! — Grazie!", explain: "The traditional reply to In bocca al lupo is Crepi! (may the wolf die), not Grazie.", grammar: g.idioms } }
      - { es: "Acqua in bocca: la festa per Giulia è una sorpresa.", en: "Mum's the word: the party for Giulia is a surprise.", altEn: ["Keep it to yourself: Giulia's party is a surprise."], grammar: [g.idioms], vocab: [w.acqua-in-bocca] }
      - { es: "Mio fratello spende sempre tutto: lo stipendio gli dura una settimana.", en: "My brother always spends everything: his salary lasts him a week.", grammar: [g.idioms], vocab: [], transform: { instruction: "Say it with an idiom (avere le mani bucate)", answer: "Mio fratello ha le mani bucate: lo stipendio gli dura una settimana.", alt: [], en: "My brother spends money like water: his salary lasts him a week." } }
      - { es: "Questo mese sono al verde: niente pizza in via Etnea.", en: "I'm broke this month: no pizza on Via Etnea.", grammar: [g.idioms], vocab: [w.essere-al-verde] }
      - { es: "Un appartamento in centro a Catania, per fortuna, non costa un occhio della testa.", en: "Luckily, a flat in the centre of Catania doesn't cost an arm and a leg.", grammar: [g.idioms], vocab: [w.costare-un-occhio-della-testa], error: { wrong: "Un appartamento in centro a Catania, per fortuna, non costa un occhio dalla testa.", explain: "Idioms have fixed wording: un occhio della testa, never dalla.", grammar: g.idioms } }
      - { es: "Passando dalla pescheria, ho preso due piccioni con una fava: il pesce per cena e due chiacchiere con il pescivendolo.", en: "Going by the fish market, I killed two birds with one stone: fish for dinner and a chat with the fishmonger.", grammar: [g.idioms, g.gerundio-uses], vocab: [w.prendere-due-piccioni-con-una-fava, w.pescivendolo] }
      - { es: "Non vedo l'ora di assaggiare la granita con la brioche.", en: "I can't wait to try granita with a brioche.", grammar: [g.idioms], vocab: [w.non-vedere-lora] }
      - { es: "È arrabbiatissimo per la multa.", en: "He's furious about the fine.", grammar: [g.idioms], vocab: [], transform: { instruction: "Say it with an idiom (avere un diavolo per capello)", answer: "Ha un diavolo per capello per la multa.", alt: ["Per la multa ha un diavolo per capello."], en: "He's hopping mad about the fine." } }
      - { es: "Gli ho chiesto tre volte di pagare, ma fa orecchie da mercante.", en: "I've asked him to pay three times, but he turns a deaf ear.", grammar: [g.idioms], vocab: [w.fare-orecchie-da-mercante] }
      - { es: "Per rompere il ghiaccio, ha offerto un giro di arancini a tutti.", en: "To break the ice, he bought everyone a round of arancini.", grammar: [g.idioms], vocab: [w.rompere-il-ghiaccio, w.arancino], note: "In Catania it's arancino, masculine." }
      - { es: "Tua sorella è proprio in gamba: lavora e studia ingegneria.", en: "Your sister is really capable: she works and studies engineering.", grammar: [g.idioms], vocab: [w.essere-in-gamba] }
      - { es: "Scusa, avevo la testa fra le nuvole: che cosa hai detto?", en: "Sorry, I was miles away: what did you say?", altEs: ["Scusa, avevo la testa tra le nuvole: che cosa hai detto?"], grammar: [g.idioms], vocab: [w.avere-la-testa-fra-le-nuvole] }
      - { es: "Quando mi ha detto che si sposava, sono caduto dalle nuvole.", en: "When he told me he was getting married, I was flabbergasted.", altEs: ["Quando mi ha detto che si sposava, sono caduta dalle nuvole."], grammar: [g.idioms], vocab: [w.cadere-dalle-nuvole] }
      - { es: "Smettila di menare il can per l'aia e dimmi che cosa è successo.", en: "Stop beating about the bush and tell me what happened.", grammar: [g.idioms, g.imperativo-pronouns], vocab: [w.menare-il-can-per-laia] }
      - { es: "Con quel mutuo hanno fatto il passo più lungo della gamba.", en: "With that mortgage they bit off more than they could chew.", grammar: [g.idioms], vocab: [w.fare-il-passo-più-lungo-della-gamba] }
      - { es: "Ha vinto il Catania e i tifosi del Palermo rosicano.", en: "Catania won and the Palermo fans are sore about it.", grammar: [g.idioms, g.colloquial-italian], vocab: [w.rosicare], note: "rosicare is colloquial, from Rome, now heard everywhere." }
    exchanges:
      - q: { es: "Domani parto per il colloquio a Milano.", en: "Tomorrow I'm leaving for the interview in Milan." }
        a: { es: "In bocca al lupo! Fammi sapere com'è andata.", en: "Good luck! Let me know how it went." }
        alt: ["In bocca al lupo!", "In bocca al lupo, sei in gamba!"]
        grammar: [g.idioms]
        vocab: [w.in-bocca-al-lupo]
      - q: { es: "Hai visto Marco alla festa?", en: "Did you see Marco at the party?" }
        a: { es: "Sì, ma dopo mezz'ora ha tagliato la corda.", en: "Yes, but after half an hour he slipped away." }
        alt: ["Solo per poco: ha tagliato la corda subito.", "Sì, ma è sparito presto."]
        grammar: [g.idioms]
        vocab: [w.tagliare-la-corda]
      - q: { es: "Perché il progetto non va avanti?", en: "Why isn't the project moving forward?" }
        a: { es: "Perché qualcuno in ufficio continua a mettere i bastoni tra le ruote.", en: "Because someone in the office keeps putting a spoke in the wheels." }
        alt: ["Qualcuno ci mette i bastoni tra le ruote.", "Mancano i soldi."]
        grammar: [g.idioms]
        vocab: [w.mettere-i-bastoni-tra-le-ruote]
      - q: { es: "Vieni al concerto sabato?", en: "Are you coming to the concert on Saturday?" }
        a: { es: "Non posso, sono al verde fino al 27.", en: "I can't, I'm broke until the 27th." }
        alt: ["Magari, ma sono al verde.", "Costa un occhio della testa, non posso."]
        grammar: [g.idioms]
        vocab: [w.essere-al-verde]
      - q: { es: "Sai che Lucia si trasferisce in Australia?", en: "Did you know Lucia is moving to Australia?" }
        a: { es: "Davvero? Sono caduto dalle nuvole!", en: "Really? I'm flabbergasted!" }
        alt: ["Non ne sapevo niente!", "Sono caduta dalle nuvole!"]
        grammar: [g.idioms]
        vocab: [w.cadere-dalle-nuvole]
      - q: { es: "«In bocca al lupo» è una metafora?", en: "Is «in bocca al lupo» a metaphor?" }
        a: { es: "È una locuzione fissa: non va presa parola per parola.", en: "It's a fixed expression: you don't take it word for word." }
        alt: ["Più o meno: è un modo di dire.", "È un'espressione idiomatica."]
        grammar: [g.idioms]
        vocab: [w.metafora, w.locuzione]
    texts:
      - title: "Messaggio a un'amica"
        es: ["Domani ho l'esame di diritto.", "Non vedo l'ora che finisca!", "Se mi scrivi «in bocca al lupo», ti rispondo «crepi»."]
        en: ["Tomorrow I've got my law exam.", "I can't wait for it to be over!", "If you write «good luck» to me, I'll reply «crepi»."]
        grammar: [g.idioms]
        vocab: [w.non-vedere-lora, w.in-bocca-al-lupo, w.crepi]
    spicy:
      - { es: "Per rompere il ghiaccio, mi ha offerto una granita; per scioglierlo del tutto, la brioche.", en: "To break the ice, he offered me a granita; to melt it completely, the brioche.", grammar: [g.idioms], vocab: [w.rompere-il-ghiaccio] }
      - { es: "Non vedo l'ora di rivederti: ho già la testa fra le nuvole.", en: "I can't wait to see you again: my head's already in the clouds.", grammar: [g.idioms], vocab: [w.non-vedere-lora, w.avere-la-testa-fra-le-nuvole] }
      - { es: "Mi hai fatto cadere dalle nuvole: non sapevo che ballassi così bene.", en: "You've bowled me over: I didn't know you danced so well.", grammar: [g.idioms, g.concordanza-congiuntivo], vocab: [w.cadere-dalle-nuvole] }
      - { es: "Sei così in gamba che perfino mia madre ha smesso di farmi domande.", en: "You're so capable that even my mother has stopped asking me questions.", grammar: [g.idioms], vocab: [w.essere-in-gamba] }
      - { es: "Acqua in bocca su quello che è successo dopo la festa di Sant'Agata.", en: "Not a word about what happened after the Sant'Agata festival.", grammar: [g.idioms], vocab: [w.acqua-in-bocca] }
  - id: c1.u05.l2
    title: Chi dorme non piglia pesci
    teach: [g.proverbs]
    vocab: [w.piove-sul-bagnato, w.chi-dorme-non-piglia-pesci, w.chi-va-piano-va-sano-e-va-lontano, w.tra-il-dire-e-il-fare-cè-di-mezzo-il-mare, w.labito-non-fa-il-monaco, w.meglio-tardi-che-mai, w.il-mattino-ha-loro-in-bocca, w.ogni-morte-di-papa, w.a-caval-donato-non-si-guarda-in-bocca, w.chi-la-fa-laspetti, w.paese-che-vai-usanza-che-trovi, w.non-tutte-le-ciambelle-riescono-col-buco, w.proverbio, w.detto, w.frase-fatta, w.luogo-comune, w.stereotipo, w.cliché, w.saggezza-popolare, w.storto, w.offensivo, w.catanese]
    tip: "Proverbs often use chi + singular verb and the old verb pigliare. Italians frequently say only the first half (Chi dorme…, Paese che vai…) and let the listener finish. One well-placed proverb persuades; three sound like a parody."
    sentences:
      - { es: "Chi dorme non piglia pesci: alla pescheria bisogna arrivare all'alba.", en: "The early bird catches the worm: you have to get to the fish market at dawn.", grammar: [g.proverbs], vocab: [w.chi-dorme-non-piglia-pesci], transform: { instruction: "Swap the proverb for one with the same meaning (il mattino…)", answer: "Il mattino ha l'oro in bocca: alla pescheria bisogna arrivare all'alba.", alt: [], en: "The early bird catches the worm: you have to get to the fish market at dawn." }, error: { wrong: "Chi dormono non pigliano pesci: alla pescheria bisogna arrivare all'alba.", explain: "chi (whoever) always takes a singular verb: chi dorme non piglia.", grammar: g.proverbs } }
      - { es: "Chi va piano va sano e va lontano, soprattutto sulle strade dell'Etna.", en: "Slow and steady wins the race, especially on the roads of Etna.", grammar: [g.proverbs], vocab: [w.chi-va-piano-va-sano-e-va-lontano] }
      - { es: "Aveva promesso di smettere di fumare, ma tra il dire e il fare c'è di mezzo il mare.", en: "He'd promised to stop smoking, but it's easier said than done.", grammar: [g.proverbs], vocab: [w.tra-il-dire-e-il-fare-cè-di-mezzo-il-mare] }
      - { es: "È meglio arrivare tardi che non arrivare per niente.", en: "It's better to arrive late than not to arrive at all.", grammar: [g.proverbs], vocab: [], transform: { instruction: "Say it with the proverb", answer: "Meglio tardi che mai.", alt: ["Meglio tardi che mai!"], en: "Better late than never." } }
      - { es: "Non giudicarlo dai vestiti: l'abito non fa il monaco.", en: "Don't judge him by his clothes: appearances can be deceptive.", grammar: [g.proverbs, g.imperativo-negative], vocab: [w.labito-non-fa-il-monaco] }
      - { es: "La torta è venuta un po' storta, ma non tutte le ciambelle riescono col buco.", en: "The cake came out a bit lopsided, but things don't always turn out perfectly.", grammar: [g.proverbs], vocab: [w.storto, w.non-tutte-le-ciambelle-riescono-col-buco] }
      - { es: "Paese che vai, usanza che trovi: a Catania si dice arancino.", en: "When in Rome, do as the Romans do: in Catania you say arancino.", grammar: [g.proverbs], vocab: [w.paese-che-vai-usanza-che-trovi, w.arancino] }
      - { es: "Mi hanno regalato una bici vecchia, ma a caval donato non si guarda in bocca.", en: "They gave me an old bike, but you don't look a gift horse in the mouth.", grammar: [g.proverbs, g.si-impersonale], vocab: [w.a-caval-donato-non-si-guarda-in-bocca] }
      - { es: "Mi ha fatto uno scherzo e io gliel'ho restituito: chi la fa l'aspetti!", en: "He played a trick on me and I paid him back: what goes around comes around!", grammar: [g.proverbs, g.combined-pronouns-past], vocab: [w.chi-la-fa-laspetti] }
      - { es: "Il mattino ha l'oro in bocca: alzati, che il mercato apre alle sei.", en: "The early bird catches the worm: get up, the market opens at six.", grammar: [g.proverbs, g.imperativo-tu], vocab: [w.il-mattino-ha-loro-in-bocca] }
      - { es: "Piove sul bagnato: dopo la multa, mi hanno rubato anche la bici.", en: "It never rains but it pours: after the fine, they stole my bike too.", grammar: [g.proverbs], vocab: [w.piove-sul-bagnato] }
      - { es: "Mio zio viene a trovarci ogni morte di papa.", en: "My uncle comes to see us once in a blue moon.", grammar: [g.proverbs], vocab: [w.ogni-morte-di-papa] }
      - { es: "Nei proverbi c'è la saggezza popolare, ma anche qualche luogo comune.", en: "In proverbs there's folk wisdom, but also the odd cliché.", grammar: [g.proverbs], vocab: [w.proverbio, w.saggezza-popolare, w.luogo-comune] }
      - { es: "Spesso gli italiani dicono solo la prima metà del detto: «Chi dorme…».", en: "Italians often say only the first half of the saying: «Chi dorme…».", grammar: [g.proverbs], vocab: [w.detto] }
      - { es: "Dire che i siciliani sono tutti uguali è uno stereotipo offensivo.", en: "Saying that Sicilians are all the same is an offensive stereotype.", grammar: [g.infinito-sostantivato], vocab: [w.stereotipo, w.offensivo] }
      - { es: "Un proverbio ben scelto convince; tre di fila sembrano un cliché, anzi una frase fatta.", en: "A well-chosen proverb convinces; three in a row sound like a cliché, or rather a stock phrase.", grammar: [g.proverbs], vocab: [w.proverbio, w.cliché, w.frase-fatta] }
    exchanges:
      - q: { es: "Scusate, sono arrivato in ritardo anche oggi.", en: "Sorry, I'm late again today." }
        a: { es: "Meglio tardi che mai, dai: siediti.", en: "Better late than never, come on: sit down." }
        alt: ["Meglio tardi che mai!", "Non fa niente, siediti."]
        grammar: [g.proverbs]
        vocab: [w.meglio-tardi-che-mai]
      - q: { es: "Ho perso il lavoro e la settimana dopo mi si è rotta la macchina.", en: "I lost my job and the week after my car broke down." }
        a: { es: "Eh, piove sempre sul bagnato.", en: "Ah, it never rains but it pours." }
        alt: ["Piove sul bagnato, purtroppo.", "Che sfortuna!"]
        grammar: [g.proverbs]
        vocab: [w.piove-sul-bagnato]
      - q: { es: "Perché a Catania la sera si mangia così tardi?", en: "Why do people eat so late in the evening in Catania?" }
        a: { es: "Paese che vai, usanza che trovi.", en: "When in Rome, do as the Romans do." }
        alt: ["È l'usanza del Sud.", "Paese che vai…"]
        grammar: [g.proverbs]
        vocab: [w.paese-che-vai-usanza-che-trovi]
      - q: { es: "Ti fidi del nuovo collega? Sembra così elegante.", en: "Do you trust the new colleague? He seems so smart." }
        a: { es: "L'abito non fa il monaco: aspettiamo di vederlo lavorare.", en: "Appearances can be deceptive: let's wait and see him work." }
        alt: ["L'abito non fa il monaco.", "Vedremo come lavora."]
        grammar: [g.proverbs]
        vocab: [w.labito-non-fa-il-monaco]
      - q: { es: "Hai finito la tesi?", en: "Have you finished your thesis?" }
        a: { es: "Non ancora: chi va piano va sano e va lontano.", en: "Not yet: slow and steady wins the race." }
        alt: ["Quasi: chi va piano va sano e va lontano.", "Non ancora, ma ci sono quasi."]
        grammar: [g.proverbs]
        vocab: [w.chi-va-piano-va-sano-e-va-lontano]
    texts:
      - title: "I proverbi della nonna"
        es: ["Mia nonna catanese aveva un proverbio per tutto.", "Se mi alzavo tardi, diceva: «Chi dorme non piglia pesci».", "Se mi lamentavo di un regalo: «A caval donato non si guarda in bocca»."]
        en: ["My Catanese grandmother had a proverb for everything.", "If I got up late, she'd say: «The early bird catches the worm».", "If I complained about a present: «Don't look a gift horse in the mouth»."]
        grammar: [g.proverbs, g.imperfetto-uses]
        vocab: [w.proverbio, w.chi-dorme-non-piglia-pesci, w.a-caval-donato-non-si-guarda-in-bocca]
    spicy:
      - { es: "Chi dorme non piglia pesci, e nemmeno numeri di telefono.", en: "The early bird catches the worm, and phone numbers too.", altEn: ["Whoever sleeps catches no fish, and no phone numbers either."], grammar: [g.proverbs], vocab: [w.chi-dorme-non-piglia-pesci] }
      - { es: "Mi hai chiesto di uscire dopo sei mesi: meglio tardi che mai!", en: "You asked me out after six months: better late than never!", grammar: [g.proverbs], vocab: [w.meglio-tardi-che-mai] }
      - { es: "L'abito non fa il monaco, ma quella camicia ti sta benissimo.", en: "Clothes don't make the man, but that shirt looks great on you.", grammar: [g.proverbs], vocab: [w.labito-non-fa-il-monaco] }
      - { es: "Paese che vai, usanza che trovi: qui ci si saluta con due baci.", en: "When in Rome…: here people greet each other with two kisses.", grammar: [g.proverbs, g.ci-si], vocab: [w.paese-che-vai-usanza-che-trovi] }
      - { es: "Tra il dire e il fare c'è di mezzo il mare: hai detto che cucinavi tu, ma vedo solo un menù.", en: "Easier said than done: you said you were cooking, but all I can see is a menu.", grammar: [g.proverbs], vocab: [w.tra-il-dire-e-il-fare-cè-di-mezzo-il-mare] }
  - id: c1.u05.l3
    title: Di punto in bianco
    teach: [g.fixed-expressions]
    vocab: [w.a-squarciagola, w.a-vanvera, w.piovere-a-catinelle, w.a-occhio-e-croce, w.di-punto-in-bianco, w.in-quattro-e-quattrotto, w.fare-le-ore-piccole, w.essere-al-settimo-cielo, w.avere-grilli-per-la-testa, w.stare-con-le-mani-in-mano, w.fare-una-figuraccia, w.alzare-il-gomito, w.pane-carasau, w.mirto, w.cannonau, w.vermentino, w.passito, w.seadas, w.porceddu, w.fradicio, w.circo, w.pesce-spada, w.pian-piano, w.velocemente, w.brace]
    tip: "Fixed adverbial phrases make Italian sound native: di punto in bianco (out of the blue), a occhio e croce (roughly), in quattro e quattr'otto (in no time), a squarciagola (at the top of your voice), pian piano (little by little). Some agree: sano e salvo → sani e salvi."
    sentences:
      - { es: "Durante la festa di Sant'Agata i devoti gridano a squarciagola per le strade.", en: "During the Sant'Agata festival the devotees shout at the tops of their voices in the streets.", grammar: [g.fixed-expressions], vocab: [w.a-squarciagola] }
      - { es: "Ieri pioveva a catinelle e siamo arrivati a casa fradici.", en: "Yesterday it was raining cats and dogs and we got home soaked.", grammar: [g.fixed-expressions, g.imperfetto-uses], vocab: [w.piovere-a-catinelle, w.fradicio] }
      - { es: "A occhio e croce, in piazza c'erano centomila persone.", en: "At a rough guess, there were a hundred thousand people in the square.", grammar: [g.fixed-expressions], vocab: [w.a-occhio-e-croce] }
      - { es: "Improvvisamente ha deciso di trasferirsi in Sardegna.", en: "Suddenly he decided to move to Sardinia.", grammar: [g.fixed-expressions], vocab: [], transform: { instruction: "Use di punto in bianco", answer: "Di punto in bianco ha deciso di trasferirsi in Sardegna.", alt: ["Ha deciso di punto in bianco di trasferirsi in Sardegna."], en: "Out of the blue he decided to move to Sardinia." } }
      - { es: "Ha preparato la cena molto velocemente.", en: "She made dinner very quickly.", grammar: [g.fixed-expressions], vocab: [], transform: { instruction: "Use in quattro e quattr'otto", answer: "Ha preparato la cena in quattro e quattr'otto.", alt: ["In quattro e quattr'otto ha preparato la cena."], en: "She made dinner in no time at all." } }
      - { es: "Abbiamo fatto le ore piccole a parlare in terrazza.", en: "We stayed up till the small hours talking on the terrace.", grammar: [g.fixed-expressions], vocab: [w.fare-le-ore-piccole] }
      - { es: "Quando ha saputo che l'avevano presa, era al settimo cielo.", en: "When she found out they'd taken her on, she was over the moon.", grammar: [g.fixed-expressions, g.trapassato-prossimo], vocab: [w.essere-al-settimo-cielo] }
      - { es: "Hai sempre grilli per la testa: prima il circo, adesso la barca a vela!", en: "You're always full of fanciful ideas: first the circus, now the sailing boat!", grammar: [g.fixed-expressions], vocab: [w.avere-grilli-per-la-testa, w.circo] }
      - { es: "Non stare con le mani in mano: aiutami ad apparecchiare.", en: "Don't just sit there twiddling your thumbs: help me lay the table.", grammar: [g.fixed-expressions, g.imperativo-negative], vocab: [w.stare-con-le-mani-in-mano] }
      - { es: "Ho fatto una figuraccia: ho chiamato la suocera con il nome della ex.", en: "I made a fool of myself: I called my mother-in-law by my ex's name.", grammar: [g.fixed-expressions], vocab: [w.fare-una-figuraccia] }
      - { es: "A cena lo zio ha alzato un po' il gomito con il mirto.", en: "At dinner my uncle had a drop too much of the myrtle liqueur.", grammar: [g.fixed-expressions], vocab: [w.alzare-il-gomito, w.mirto] }
      - { es: "Gavino ha portato dalla Sardegna pane carasau, seadas e un cannonau.", en: "Gavino brought carasau bread, seadas and a bottle of Cannonau from Sardinia.", grammar: [g.fixed-expressions], vocab: [w.pane-carasau, w.seadas, w.cannonau] }
      - { es: "Il vermentino si beve fresco, il passito con il dolce.", en: "Vermentino is drunk chilled, passito with dessert.", grammar: [g.si-passivante], vocab: [w.vermentino, w.passito] }
      - { es: "Il porceddu si cuoce pian piano, per ore, sulla brace.", en: "Suckling pig is cooked little by little, for hours, over the embers.", grammar: [g.fixed-expressions, g.si-passivante], vocab: [w.porceddu] }
      - { es: "Siamo arrivati sani e salvi, anche se il traghetto ballava parecchio.", en: "We arrived safe and sound, even though the ferry was rocking quite a bit.", altEs: ["Siamo arrivate sane e salve, anche se il traghetto ballava parecchio."], grammar: [g.fixed-expressions], vocab: [], error: { wrong: "Siamo arrivati sano e salvo, anche se il traghetto ballava parecchio.", explain: "sano e salvo agrees with the subject: sani e salvi (m. pl.), sane e salve (f. pl.).", grammar: g.fixed-expressions } }
      - { es: "Man mano che assaggiavo, capivo perché Gavino ama tanto la sua isola.", en: "As I tasted one thing after another, I understood why Gavino loves his island so much.", grammar: [g.fixed-expressions], vocab: [] }
    exchanges:
      - q: { es: "Quanta gente c'era alla processione?", en: "How many people were at the procession?" }
        a: { es: "A occhio e croce, centomila persone.", en: "At a rough guess, a hundred thousand people." }
        alt: ["Più o meno centomila.", "Tantissima, a occhio e croce centomila."]
        grammar: [g.fixed-expressions]
        vocab: [w.a-occhio-e-croce]
      - q: { es: "Com'era il pesce spada di ieri sera?", en: "How was last night's swordfish?" }
        a: { es: "Buonissimo; e con un bicchiere di vermentino, ancora meglio.", en: "Delicious; and with a glass of Vermentino, even better." }
        alt: ["Ottimo.", "Buonissimo, cotto alla perfezione."]
        grammar: [g.fixed-expressions]
        vocab: [w.pesce-spada, w.vermentino]
      - q: { es: "Perché hai quella faccia?", en: "Why are you pulling that face?" }
        a: { es: "Ho fatto una figuraccia: ho cantato a squarciagola, ma la canzone era sbagliata.", en: "I made a fool of myself: I sang at the top of my voice, but it was the wrong song." }
        alt: ["Ho fatto una figuraccia.", "Lascia stare, che figuraccia!"]
        grammar: [g.fixed-expressions]
        vocab: [w.fare-una-figuraccia, w.a-squarciagola]
      - q: { es: "A che ora siete tornati ieri?", en: "What time did you get back yesterday?" }
        a: { es: "Alle quattro: abbiamo fatto le ore piccole.", en: "At four: we stayed up till the small hours." }
        alt: ["Tardissimo.", "Alle quattro del mattino."]
        grammar: [g.fixed-expressions]
        vocab: [w.fare-le-ore-piccole]
      - q: { es: "Che cosa ha detto il professore della mia tesi?", en: "What did the professor say about my thesis?" }
        a: { es: "Niente di preciso: parlava un po' a vanvera.", en: "Nothing specific: he was rambling a bit." }
        alt: ["Niente di preciso.", "Che va bene, più o meno."]
        grammar: [g.fixed-expressions]
        vocab: [w.a-vanvera]
    texts:
      - title: "Invito a cena"
        es: ["Sabato sera cena sarda a casa mia!", "Porto io il porceddu, Gavino il mirto e le seadas.", "Non portate niente, venite e basta: si mangia alla buona."]
        en: ["Sardinian dinner at my place on Saturday night!", "I'll bring the suckling pig, Gavino the myrtle liqueur and the seadas.", "Don't bring anything, just come: it's a simple, informal meal."]
        grammar: [g.fixed-expressions]
        vocab: [w.porceddu, w.mirto, w.seadas]
    spicy:
      - { es: "Mi hai fatto girare la testa in quattro e quattr'otto.", en: "You turned my head in no time at all.", grammar: [g.fixed-expressions], vocab: [w.in-quattro-e-quattrotto] }
      - { es: "Abbiamo fatto le ore piccole a parlare… solo a parlare, giuro.", en: "We stayed up till the small hours talking… just talking, I swear.", grammar: [g.fixed-expressions], vocab: [w.fare-le-ore-piccole] }
      - { es: "Quando mi hai sorriso, ero al settimo cielo.", en: "When you smiled at me, I was over the moon.", grammar: [g.fixed-expressions], vocab: [w.essere-al-settimo-cielo] }
      - { es: "Di punto in bianco mi ha preso la mano, e io ho fatto finta di niente.", en: "Out of the blue he took my hand, and I acted as if nothing had happened.", grammar: [g.fixed-expressions], vocab: [w.di-punto-in-bianco] }
      - { es: "Ho alzato un po' il gomito e ti ho cantato una serenata a squarciagola: chiedo scusa ai vicini.", en: "I had a drop too much and sang you a serenade at the top of my voice: my apologies to the neighbours.", grammar: [g.fixed-expressions], vocab: [w.alzare-il-gomito, w.a-squarciagola, w.serenata] }
  - id: c1.u05.l4
    title: Non avere peli sulla lingua
    teach: [g.idioms, g.proverbs]
    vocab: [w.avere-il-dente-avvelenato, w.essere-come-il-cacio-sui-maccheroni, w.avere-la-puzza-sotto-il-naso, w.prendere-in-castagna, w.non-avere-peli-sulla-lingua, w.vuotare-il-sacco, w.gettare-la-spugna, w.sputare-il-rospo, w.nuraghe, w.nuragico, w.canto-a-tenore, w.launeddas, w.pastorizia, w.pastore, w.gregge, w.transumanza, w.ovile, w.macchia-mediterranea, w.sughero, w.sughereta, w.duna, w.cala, w.insenatura, w.promontorio, w.sfornare, w.canna, w.tappo, w.civiltà, w.interno, w.scorrere, w.vuotare, w.sputare, w.gettare]
    tip: "Some idioms describe people (non avere peli sulla lingua, avere la puzza sotto il naso), others push for the truth (sputa il rospo!, vuotare il sacco). Choose them for the right register: they're friendly and informal."
    sentences:
      - { es: "Gavino non ha peli sulla lingua: dice sempre quello che pensa.", en: "Gavino speaks his mind: he always says what he thinks.", grammar: [g.idioms], vocab: [w.non-avere-peli-sulla-lingua], error: { wrong: "Gavino non ha peli nella lingua: dice sempre quello che pensa.", explain: "The idiom is fixed: non avere peli sulla lingua.", grammar: g.idioms } }
      - { es: "Dimmi la verità, dai: che cosa ti ha detto tua nonna?", en: "Tell me the truth, go on: what did your grandmother tell you?", grammar: [g.idioms, g.imperativo-pronouns], vocab: [], transform: { instruction: "Use the idiom sputare il rospo", answer: "Dai, sputa il rospo: che cosa ti ha detto tua nonna?", alt: ["Sputa il rospo, dai: che cosa ti ha detto tua nonna?"], en: "Come on, out with it: what did your grandmother tell you?" } }
      - { es: "Alla fine ha vuotato il sacco: era stato lui a mangiare tutte le seadas.", en: "In the end he spilled the beans: he was the one who had eaten all the seadas.", grammar: [g.idioms, g.cleft-sentences], vocab: [w.vuotare-il-sacco, w.seadas], transform: { instruction: "Use the idiom with the same meaning: sputare il rospo", answer: "Alla fine ha sputato il rospo: era stato lui a mangiare tutte le seadas.", alt: [], en: "In the end he came out with it: he was the one who had eaten all the seadas." } }
      - { es: "Mia cugina ha la puzza sotto il naso: in Costa Smeralda va solo nei locali di lusso.", en: "My cousin is snooty: on the Costa Smeralda she only goes to luxury places.", grammar: [g.idioms], vocab: [w.avere-la-puzza-sotto-il-naso] }
      - { es: "Ha il dente avvelenato con il vicino da quando gli ha preso il posto auto.", en: "He's had it in for his neighbour ever since he took his parking space.", grammar: [g.idioms, g.da-since], vocab: [w.avere-il-dente-avvelenato] }
      - { es: "La tua visita arriva come il cacio sui maccheroni: abbiamo appena sfornato il pane.", en: "Your visit couldn't come at a better time: we've just taken the bread out of the oven.", grammar: [g.idioms], vocab: [w.essere-come-il-cacio-sui-maccheroni, w.sfornare] }
      - { es: "Non gettare la spugna: la salita è dura, ma l'ovile è dietro la collina.", en: "Don't throw in the towel: the climb is hard, but the sheepfold is behind the hill.", grammar: [g.idioms, g.imperativo-negative], vocab: [w.gettare-la-spugna, w.ovile] }
      - { es: "In Sardegna ci sono circa settemila nuraghi.", en: "There are about seven thousand nuraghi in Sardinia.", grammar: [g.c-e-ci-sono], vocab: [w.nuraghe] }
      - { es: "La civiltà nuragica costruì torri di pietra senza usare malta.", en: "The nuragic civilisation built stone towers without using mortar.", grammar: [g.passato-remoto-forms], vocab: [w.civiltà, w.nuragico] }
      - { es: "Il canto a tenore è patrimonio dell'UNESCO dal 2005.", en: "Tenore singing has been on UNESCO's heritage list since 2005.", grammar: [g.da-since], vocab: [w.canto-a-tenore] }
      - { es: "Le launeddas sono uno strumento antichissimo, fatto di tre canne.", en: "Launeddas are an ancient instrument made of three reeds.", grammar: [g.superlatives], vocab: [w.launeddas, w.canna] }
      - { es: "La pastorizia è ancora un'attività importante nell'interno dell'isola.", en: "Sheep farming is still an important activity in the island's interior.", grammar: [g.adjective-agreement], vocab: [w.pastorizia, w.interno] }
      - { es: "D'inverno il pastore porta il gregge verso la pianura: è la transumanza.", en: "In winter the shepherd takes the flock down towards the plain: that's transhumance.", grammar: [g.present-are], vocab: [w.pastore, w.gregge, w.transumanza] }
      - { es: "Tra la macchia mediterranea e le sugherete si cammina per ore senza incontrare nessuno.", en: "Between the Mediterranean scrub and the cork woods you can walk for hours without meeting anyone.", grammar: [g.si-impersonale, g.double-negation], vocab: [w.macchia-mediterranea, w.sughereta] }
      - { es: "Il sughero sardo finisce nei tappi di mezzo mondo.", en: "Sardinian cork ends up in the stoppers of half the world.", grammar: [g.articulated-prepositions], vocab: [w.sughero, w.tappo] }
      - { es: "Dal promontorio si vedono una piccola insenatura e, più lontano, le dune.", en: "From the headland you can see a small inlet and, further away, the dunes.", grammar: [g.si-passivante], vocab: [w.promontorio, w.insenatura, w.duna] }
    exchanges:
      - q: { es: "Di dov'è Gavino?", en: "Where is Gavino from?" }
        a: { es: "Di Nuoro, nel cuore della Sardegna: suo nonno faceva il pastore.", en: "From Nuoro, in the heart of Sardinia: his grandfather was a shepherd." }
        alt: ["Di Nuoro.", "È sardo, di Nuoro."]
        grammar: [g.essere-di]
        vocab: [w.pastore]
      - q: { es: "Che cos'è un nuraghe?", en: "What's a nuraghe?" }
        a: { es: "È una torre di pietra dell'età del bronzo, tipica della Sardegna.", en: "It's a Bronze Age stone tower, typical of Sardinia." }
        alt: ["Una torre nuragica.", "Una costruzione antica di pietra."]
        grammar: [g.essere-di]
        vocab: [w.nuraghe]
      - q: { es: "Tua madre ti ha preso in castagna?", en: "Did your mother catch you red-handed?" }
        a: { es: "Sì, mi ha visto uscire dalla pasticceria con tre cannoli.", en: "Yes, she saw me coming out of the pastry shop with three cannoli." }
        alt: ["Purtroppo sì.", "Sì, con le mani nei cannoli."]
        grammar: [g.idioms]
        vocab: [w.prendere-in-castagna, w.cannolo]
      - q: { es: "Dove facciamo il bagno domani?", en: "Where shall we swim tomorrow?" }
        a: { es: "In una cala nascosta: ci si arriva solo a piedi, tra la macchia mediterranea.", en: "In a hidden cove: you can only get there on foot, through the Mediterranean scrub." }
        alt: ["In una cala vicino al promontorio.", "In una caletta nascosta."]
        grammar: [g.ci-si]
        vocab: [w.cala, w.macchia-mediterranea]
      - q: { es: "Ti è piaciuto il canto a tenore?", en: "Did you enjoy the tenore singing?" }
        a: { es: "Moltissimo: quattro voci, nessuno strumento, e mi sono venuti i brividi.", en: "Very much: four voices, no instruments, and it gave me goosebumps." }
        alt: ["Moltissimo.", "Sì, è stato emozionante."]
        grammar: [g.passato-prossimo-essere]
        vocab: [w.canto-a-tenore]
      - q: { es: "Perché non parli più con tua sorella?", en: "Why don't you talk to your sister any more?" }
        a: { es: "Ho ancora il dente avvelenato per quella storia del matrimonio.", en: "I still bear a grudge over that business with the wedding." }
        alt: ["È una lunga storia.", "Abbiamo litigato per il matrimonio."]
        grammar: [g.idioms]
        vocab: [w.avere-il-dente-avvelenato]
    texts:
      - title: "Cartolina dalla Barbagia"
        es: ["Qui il tempo scorre pian piano: chi va piano va sano e va lontano.", "Di giorno camminiamo tra le sugherete, la sera ascoltiamo il canto a tenore.", "Non vedo l'ora di raccontarti tutto per filo e per segno."]
        en: ["Here time goes by slowly: slow and steady wins the race.", "By day we walk among the cork woods, in the evening we listen to tenore singing.", "I can't wait to tell you everything in minute detail."]
        grammar: [g.proverbs, g.fixed-expressions]
        vocab: [w.sughereta, w.canto-a-tenore, w.chi-va-piano-va-sano-e-va-lontano]
    spicy:
      - { es: "Dai, sputa il rospo: ti piaccio o no?", en: "Come on, out with it: do you like me or not?", grammar: [g.idioms], vocab: [w.sputare-il-rospo] }
      - { es: "Non ho peli sulla lingua: sei la persona più bella dell'isola.", en: "I'll speak my mind: you're the most beautiful person on the island.", grammar: [g.idioms, g.superlatives], vocab: [w.non-avere-peli-sulla-lingua] }
      - { es: "Alla fine ha vuotato il sacco: era venuto alla festa solo per vedere me.", en: "In the end he spilled the beans: he'd come to the party just to see me.", grammar: [g.idioms, g.trapassato-prossimo], vocab: [w.vuotare-il-sacco] }
      - { es: "Non getto la spugna: prima o poi accetterai un invito a cena.", en: "I'm not throwing in the towel: sooner or later you'll accept a dinner invitation.", grammar: [g.idioms], vocab: [w.gettare-la-spugna] }
      - { es: "Tra le dune, al tramonto, il tuo invito è arrivato come il cacio sui maccheroni.", en: "Among the dunes, at sunset, your invitation came at just the right moment.", grammar: [g.idioms], vocab: [w.duna, w.essere-come-il-cacio-sui-maccheroni] }
dialogues:
  - id: c1.u05.d1
    title: In pescheria a Catania
    context: Early morning at Catania's fish market. Agata, from Catania, has dragged her Sardinian friend Gavino out shopping after a late night.
    lines:
      - { speaker: Agata, es: "Gavino, svegliati! Chi dorme non piglia pesci, e qui in pescheria vale alla lettera.", en: "Gavino, wake up! The early bird catches the worm, and here at the fish market it's literally true." }
      - { speaker: Gavino, es: "Lo so, lo so. Ma ieri abbiamo fatto le ore piccole e ho la testa fra le nuvole.", en: "I know, I know. But we stayed up till the small hours last night and my head's in the clouds." }
      - { speaker: Agata, es: "Dai, sputa il rospo: com'è andato l'esame?", en: "Come on, out with it: how did the exam go?" }
      - { speaker: Gavino, es: "Ho preso trenta! Sono al settimo cielo.", en: "I got full marks! I'm over the moon." }
      - { speaker: Agata, es: "Sei proprio in gamba, lo sapevo. Allora oggi offri tu.", en: "You're really something, I knew it. So today it's your treat." }
      - { speaker: Gavino, es: "Magari, ma sono al verde. E il pesce spada qui costa un occhio della testa.", en: "I wish, but I'm broke. And swordfish here costs an arm and a leg." }
      - { speaker: Agata, es: "Ma va', a occhio e croce sono quindici euro al chilo. Non menare il can per l'aia.", en: "Come off it, at a rough guess it's fifteen euros a kilo. Stop beating about the bush." }
      - { speaker: Gavino, es: "Va bene: prendo due piccioni con una fava, il pesce per stasera e una granita per te.", en: "All right: I'll kill two birds with one stone, fish for tonight and a granita for you." }
      - { speaker: Agata, es: "Ecco, così mi piaci! E stasera cena siciliana o sarda?", en: "That's more like it! And tonight, Sicilian dinner or Sardinian?" }
      - { speaker: Gavino, es: "Sarda: mia madre mi ha mandato pane carasau e mirto. Paese che vai, usanza che trovi!", en: "Sardinian: my mother sent me carasau bread and myrtle liqueur. When in Rome!" }
    questions:
      - { q: "Perché Gavino ha la testa fra le nuvole?", options: ["Perché è innamorato", "Perché ha fatto le ore piccole", "Perché ha fame"], answer: 1, explain: "Ieri abbiamo fatto le ore piccole: they stayed up very late." }
      - { q: "Com'è andato l'esame di Gavino?", options: ["Male", "Non l'ha ancora fatto", "Benissimo"], answer: 2, explain: "He got trenta (full marks) and is al settimo cielo." }
      - { q: "Che cosa significa «sono al verde»?", options: ["Non ho soldi", "Sono stanco", "Sono vegetariano"], answer: 0, explain: "essere al verde = to be broke." }
      - { q: "Che cosa ha mandato la madre di Gavino?", options: ["Arancini e cannoli", "Pesce spada", "Pane carasau e mirto"], answer: 2, explain: "Mia madre mi ha mandato pane carasau e mirto." }
